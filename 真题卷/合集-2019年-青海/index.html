<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">行测真题模拟考场<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>
<div class="toast" id="toast"></div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",imgBase:"",papers:[{"slug":"2019-青海-省市州级-A类","title":"2019年青海省公务员录用考试《行测》题省市州级（A类）（网友回忆版）","year":"2019","group":"青海","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2393983","cat":"新思想","stem":"党的十九大报告指出，（    ）是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势。","options":{"A":"中国共产党的领导","B":"人民当家作主","C":"公有制经济","D":"民主协商"},"answer":"A","explanation":"本题考查政治常识。\n习近平总书记在党的十九大报告中指出，“中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导”。\n故正确答案为A。","no":1,"missingImage":false},{"type":"question","qid":"2393994","cat":"时事政治","stem":"2019年4月27日，习近平总书记在第二届“一带一路”国际合作高峰论坛圆桌峰会上指出，要高质量共建“一带一路”。“一带一路”是“（    ）”的简称。","options":{"A":"21世纪丝绸之路经济带、海上丝绸之路","B":"海上丝绸之路经济带、21世纪丝绸之路","C":"丝绸之路经济带、21世纪海上丝绸之路","D":"丝绸之路海上经济带、21世纪丝绸之路"},"answer":"C","explanation":"本题考查政治常识。\n“一带一路”是“丝绸之路经济带”和“21世纪海上丝绸之路”的简称。“一带一路”是中国与丝路沿途国家分享优质产能，它是共商项目投资、共建基础设施、共享合作成果，内容包括道路联通、贸易畅通、货币流通、政策沟通、人心相通等“五通”。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"2393933","cat":"新思想","stem":"下列活动由中国共产党领导的是（    ）。\n①东北义勇军的抗日斗争\n②东北抗日联军的斗争\n③东北抗日游击队的斗争\n④中华共和国人民革命政府的抗日斗争\n⑤“一二·九”运动\n⑥西安事变","options":{"A":"①②③④⑤⑥","B":"①③④⑤","C":"②③⑤⑥","D":"②③⑤"},"answer":"D","explanation":"本题考查毛中特。\n①错误，东北义勇军是“九·一八”事变后到1933年初东北抗日武装的总称。日军发动侵占东北辽宁、吉林、黑龙江三省的战争时，当地广大人民群众、边防军和地方武装的爱国官兵自发组成了积极抗击日伪军的非官方队列。因此，东北义勇军的抗日斗争不是中国共产党领导的。\n②正确，东北抗日联军是在中国共产党领导下的一支英雄部队。“九一八”日本侵占中国东北以后，由部分原东北军、中共抗日游击队、农民暴动武装、义勇军等组成。他们在中国共产党的领导下，同日本侵略者进行了长达十四年的艰苦斗争，牵制七十六万日军，消灭日本关东军十八万，表现了中华民族不畏强暴，英勇不屈的精神，有力地支援了全国的抗日战争和世界反法西斯战争。\n③正确，从1936年初到1937年秋，在中国共产党的领导和组织下，东北抗日游击队、东北人民革命军等抗日武装陆续改编成东北抗日联军。\n④错误，中华共和国是1933年闽变时由陈铭枢、李济深等中国国民党党内反蒋左派及十九路军在福建建立的共和国，又称十九路军政权，首都福州，其政府自称为“中华共和国人民革命政府”，政府主席为李济深，执政党为生产人民党，年号为“中华共和国”。因此，中华共和国人民革命政府的抗日斗争不是中国共产党领导的。\n⑤正确，1935年12月9日，北平数千名学生举行了抗日救国示威游行，反对华北自治，反抗日本帝国主义，要求保全中国领土的完整，掀起了全国抗日救国新高潮。“一二·九”运动是中国共产党领导的一次大规模学生爱国运动。\n⑥错误，西安事变是指1936年12月12日张学良和杨虎城为了达到劝谏蒋介石改变“攘外必先安内”的既定国策，停止内战，一致抗日的目的，在西安发动“兵谏”的历史事件。因此，西安事变不是中国共产党领导的。\n综上所述，②③⑤正确，①④⑥错误。\n故正确答案为D。","no":3,"missingImage":false}],"count":3,"answerable":3,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2393987","cat":"人文常识","stem":"中央提出“十三五”期间脱贫攻坚的目标是“两不愁三保障”，“三保障”具体是指（    ）。","options":{"A":"保障日常吃饭、保障基本医疗、保障基本就业","B":"保障日常吃饭、保障基本穿着、保障基本就业","C":"保障义务教育、保障基本穿着、保障安全住房","D":"保障义务教育、保障基本医疗、保障安全住房"},"answer":"D","explanation":"本题考查政治常识。\n2015年11月召开的中央扶贫开发工作会议强调，“十三五”期间脱贫攻坚的目标是，到2020年稳定实现农村贫困人口不愁吃、不愁穿，农村贫困人口义务教育、基本医疗、住房安全有保障；同时实现贫困地区农民人均可支配收入增长幅度高于全国平均水平、基本公共服务主要领域指标接近全国平均水平。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"2393996","cat":"科技常识","stem":"“正能量”指的是一种健康乐观、积极向上的动力和情感。当下中国社会涌现了许多富有正能量的人和事，这些催人奋进的、充满希望的人和事也带动和影响了周围一批人，从哲学角度看（    ）。\n①正能量具有指导作用，能够将人们的愿望变成现实\n②正能量具有能动性，能够给人带来信心和力量\n③正能量具有反作用，能对人体生理活动进行调节和控制\n④正能量具有创造性，能直接转化为物质力量","options":{"A":"①②","B":"①④","C":"②③","D":"③④"},"answer":"C","explanation":"该题考查政治相关知识。人能够能动地改造世界体现在：意识对改造客观世界具有指导作用；意识对于人体生理活动具有调节和控制作用。\n①错误，“正能量”是一种具有健康乐观、积极向上的意识，意识具有指导作用，人们在意识的指导下通过实践才能把观念的东西转化为现实东西，但是仅仅通过意识是无法将愿望变成现实的，前半句正确，后半句错误，所以①错误。\n②正确，“正能量”作为一种正确的意识，是一种健康乐观、积极向上的动力和情感，能够给人带来信心和力量，所以②正确。\n③正确，“正能量”作为一种正确的意识，健康乐观、积极向上的动力和情感，对人体生理活动具有调节和控制作用，当人们在遇到挫折困难的时候，可以通过“正能量”的意识，使人们积极乐观、身心愉悦，更好地面对生活。所以③正确。\n④错误，意识活动具有主动性和创造性，是人能够认识世界的重要条件，但是意识不能直接转化为物质力量，是通过实践才能转化为物质的，所以④错误。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"2393998","cat":"人文常识","stem":"一块屋场，几条板凳，没有主席台，不用音箱话筒，无需讲话稿，聊的是田头村事，谈的是致富之经。这是深受村民点赞的屋场会，贫困户、村干部、驻村工作队等几十人围坐一起，倾听百姓心声，解读扶贫政策，说实话，解决实际问题。屋场会（    ）。\n①有利于增强服务意识，融洽干群关系，为群众办实事\n②是对巩固基层政权的有益尝试和探索\n③有利于基层群众性自治组织形式的多样化\n④是党的群众路线的一种创新，有助于调动村民参与村务管理的热情","options":{"A":"①②","B":"①④","C":"②③","D":"③④"},"answer":"B","explanation":"该题考查政治知识。题干中“一块屋场，几条板凳，没有主席台，不用音箱话筒，无需讲话稿”指不讲形式、接地气的屋场会。\n①正确，不讲形式、接地气的屋场会，可以真正了解村民的所思、所想、所盼，有利于融洽干群关系，为老百姓办实事，所以①正确。\n②错误，村委会是基层群众性自治组织，不是国家基层政权机关，所以②错误。\n③错误，屋场会是民主管理形式的创新，不是基层群众性自治组织形式的多样化，基层自治组织的形式就是村委会和居委会，我国《宪法》规定：“城市和农村按居民居住地区设立的居民委员会或者村民委员会是基层群众性自治组织。”基层群众性自治组织形式的多样化说法错误，所以③错误。\n④正确，屋场会是对村民民主管理的创新，是党的群众路线的一种创新，问政于民，问需于民，调动了村民参与村务管理的热情，所以④正确。\n故正确答案为B。","no":6,"missingImage":false},{"type":"question","qid":"2394001","cat":"经济常识","stem":"据统计，目前我国老年人已达2.3亿，老年消费者这轮“夕阳”本应该成为推动GDP发展的一轮“朝阳”，但因为社会养老保障体系建设滞后，即使是“重阳节”这一天，人们也很难感受到“银发经济”这四个字的分量。这给我们的启示是（    ）。\n①深化改革，有效化解我国的“老年化”矛盾，完善中国特色养老保障制度\n②充分认识规律发生作用的条件和范围，使价值规律与我国经济发展相符合\n③正确认识和利用社会养老保障体系与老年消费的客观联系，拉动经济增长\n④矛盾具有特殊性，我国不适合发展“银发经济”，而应大力发展“朝阳经济”","options":{"A":"①②","B":"②④","C":"①③","D":"③④"},"answer":"C","explanation":"该题考查政治知识。\n①正确，我国社会养老保障体系建设滞后，要通过改革，不断完善中国特色养老保障制度，解决社会发展中的各种矛盾，尤其是“老年化”矛盾，所以①正确。\n②错误，发挥主观能动性要尊重客观规律，应该是充分认识规律发生作用的条件和范围，使我国“经济发展”与“价值规律”相符合，而不是“价值规律”与我国的“经济发展”来符合，选项说法正好相反，所以②错误。\n③正确，要想“银发经济”拉动经济增长，必须在社会养老保障体系较为完善的条件下，因此只有正确认识和利用社会养老保障体系与老年消费的客观联系，才能拉动经济增长，所以③正确。\n④错误，矛盾具有特殊性，只有正确认识我国“老年化”矛盾的特殊性，才能使我国的“银发经济”转化为“朝阳经济”，因此我们既要发展“银发经济”，也要寻找机会大力发展“朝阳经济”，所以④错误。\n故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"2394005","cat":"法律常识","stem":"司法公正体现在司法活动各个方面和对司法人员的要求上。下列（    ）做法体现的不是司法公正的内涵。","options":{"A":"甲法院对社会关注的重大案件通过微博直播庭审过程","B":"乙法院将本院公开审理后作出的判决书在网上公布","C":"丙检察院为辩护人查阅、摘抄、复制案卷材料提供便利","D":"丁检察院为暴力犯罪的被害人提供医疗和物质救助"},"answer":"D","explanation":"本题考查法律常识。\n根据司法的理论与实践，司法公正主要体现在以下几方面：（1）司法活动的合法性。合法性是指司法机关审理案件要严格按照法律的规定办事。不仅要按实体法办事，而且要按程序法办事。（2）司法人员的中立性，如法官的中立性。（3）司法活动的公开性。诉讼程序的每一阶段和步骤都应当以当事人和社会公众看得见的方式进行。例如，法院应当努力实现立案公开、庭审公开、审判结果公开、裁判文书公开和执行过程公正。（4）当事人地位的平等性。一是当事人享有平等的诉讼权利，二是法院平等地保护当事人诉讼权利的行使。（5）司法程序的参与性。程序参与性又称为“获得法庭审判机会”，指那些利益或权利可能会受到民事裁判或诉讼结局直接影响的人应当有充分的机会富有意义地参与诉讼的过程，并对裁判结果的形成发挥其有效的影响和作用。（6）司法结果的正确性。适用法律时，事实要调查清楚；证据要确凿可靠，经得起历史检验；对案件的定性要准确；处理要适当。\nA项、B项正确，属于司法活动的公开性，体现了司法公正。\nC项正确，这是司法程序的参与性体现，属于司法公正。\nD项错误，该检察院的刑事被害人救助有关工作与司法公正无关。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"2394010","cat":"人文常识","stem":"人民币升值，最有可能出现的是（    ）。","options":{"A":"旅游收入增加","B":"旅游收入减少","C":"进口增加","D":"出口增加"},"answer":"C","explanation":"本题考查经济常识。人民币升值是相对于其他货币而言的，意味着人民币的购买力增强。对于国人出国旅游、留学、投资等都有好处，有利于中国进口，不利于中国出口。\nA、B两项错误，旅游收入来源于入境游、出境游和国内游。人民币升值对国内游基本没有影响；出境游的影响因素很多，除人民币汇率外，还有国家居民收入水平、签证政策、目的地的物价水平、航权、国家的出境政策、国际关系等，人民币升值对出境游有积极影响，但是影响有限；人民币升值会一定程度上抑制出境游，但我国出境游客中，港澳游客占据绝大部分，而在港澳地区，人民币基本上可以自由流通，汇率因素对旅游选择的影响不大。综上，人民币升值并不必然带来旅游收入的增加或者减少。\nC项正确，D项错误，人民币升值会使进口品价格下降，出口品价格上升，从而刺激进口，抑制出口，减少国际贸易顺差甚至出现逆差。\n故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"2394012","cat":"经济常识","stem":"钱铺钱庄是明清时期重要的金融机构。钱铺的主要业务是兑换银两，或将顾客手中的铜钱换成银两，或将银两换成铜钱。后来发展成吸收存款、放款和汇兑为主要业务的钱庄。到乾隆年间，钱庄已有相当规模。上述转变的主要原因是（    ）。","options":{"A":"以物易物是明清时期商贸主要形式","B":"工商业发展使区域间长途贸易兴盛","C":"民营手工业在明清时期获得大发展","D":"明清时期中国的对外贸易长期出超"},"answer":"B","explanation":"本题考查人文常识。\n钱庄早期称为钱铺，最初只是经营银两与制钱的兑换以及不同成色银两的兑换业务，从中赚取手续费。之后，由于工商业发展，市场交易的不断扩大，在长途跨区域贸易中，携带银两或铜钱不便，有些信誉好的钱庄就开始签发钱帖子，即银票，代替现金支付，可随时兑取银钱。继而发展为吸收存款、发放贷款，将商业资本转变和增加为金融资本，从中赚取利息。\n故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"2394019","cat":"经济常识","stem":"面对国际经济合作和竞争格局的深刻变化，顺应国内经济提质增效升级的迫切需要，我国要坚定不移地扩大对外开放，在开放中增强发展新动能、增添改革新动力、增创竞争新优势，推进新一轮高水平对外开放，着力实现合作共赢。据此，下列传导路径正确的有（    ）。\n①实施创新驱动发展战略——形成出口竞争新优势——开放型经济水平提高\n②扩大跨境电子商务试点——企业增加出口产品“海外仓”建设——促进经济全球化形成\n③推进自贸区谈判——促进贸易投资自由化——构建均衡、共赢、包容的国际经贸体系\n④打造新的外向型产业集群——加快“走出去”步伐——外资更多投向中西部地区","options":{"A":"①②","B":"②④","C":"①③","D":"③④"},"answer":"C","explanation":"本题考查经济常识。\n①正确，习近平总书记指出：“要加快实施创新驱动发展战略，强化现代化经济体系的战略支撑。”实施创新驱动发展战略，有利于增加出口的竞争优势，进一步提高开放型经济水平。\n②错误，《关于促进外贸回稳向好的若干意见》指出：在加大对外贸新业态的支持力度上，要开展并扩大跨境电子商务试点，支持企业建设一批出口产品“海外仓”和海外营运中心。但是目前经济全球化已经形成，②表述错误。\n③正确，2016年政府工作报告指出：加快实施自由贸易区战略。积极商签区域全面经济伙伴关系协定，加快中日韩自贸区等谈判，推进中美、中欧投资协定谈判，加强亚太自贸区联合战略研究。推进自贸区谈判，有利于促进贸易投资自由化，构建均衡、共赢、包容的国际经贸体系。\n④错误，打造新的外向型产业集群，引导外资更多投向中西部地区。但是外资更多投向中西部地区是“引进来”，而不是“走出去”，④表述错误。\n因此，①③表述正确，②④表述错误。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"2394021","cat":"科技常识","stem":"龙卷风的实质是高速旋转的气流。它能把地面上的物体或人畜“吸”起卷入空中。龙卷风能“吸”起物体的原因是（    ）。","options":{"A":"龙卷风内部的压强远小于外部的大气压强","B":"龙卷风利用静电将物体吸到空中","C":"龙卷风使物体受到的重力变小","D":"龙卷风增大了空气对物体的浮力"},"answer":"A","explanation":"本题考查地理国情。\nA项正确，气体的流速越大，压强越小。龙卷风内部空气流速远大于外部空气流速，所以龙卷风内部的压强远小于外部压强。物体在压强差的作用下，被“吸”起卷入空中。 \nB项错误，当一个带有静电的物体靠近另一个不带静电的物体时，由于静电感应，产生吸附现象。处于龙卷风中的物体一方面很少带静电，另一方面也没有可以令其吸附的对象，故表述错误。\nC项错误，重力是地球对地面附近物体施加的引力，其大小等于物体的质量与重力加速度之积，即重力\u003cimg data-k=\"abd200c90896\">，重力加速度\u003cimg data-k=\"0c75235b18dd\">为常量，龙卷风中的物体质量\u003cimg data-k=\"f412308ad916\">并未减小，因此其受到的重力不变。\nD项错误，浮力是物体浸入流体（液体或气体）中受到的向上的力，其大小等于物体所排开的流体的重量。处于龙卷风中的物体的体积一般不会变化（除特殊的易变形物体外），其排开的气体的重量也不会变化，因此物体受到的浮力不变。\n故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"2394023","cat":"地理国情","stem":"在青海，当我们外出时，看树桩上的年轮，可以识别年轮宽的一面为（    ）。","options":{"A":"东方","B":"南方","C":"西方","D":"北方"},"answer":"B","explanation":"本题考查地理国情。\n树木在阳光充足的一面生长旺盛，形成层原始细胞分裂较快，径向生长较快，每年长得多，年轮间距较宽。我国地处北半球，树干朝南一面受阳光照射较多，所以年轮间隔大的一面是南方。\n故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"2394025","cat":"人文常识","stem":"飞行距离较远时，民航飞机一般适宜在（    ）飞行。","options":{"A":"散逸层","B":"对流层","C":"平流层","D":"中间层"},"answer":"C","explanation":"本题考查地理国情。\n民航飞机一般在对流层顶部（空气运动较稳定）或平流层底部飞行。选择在什么高度飞行，和航线长度有关系。飞行距离较长时在平流层飞行。\nA项错误，800公里高度以上的大气层称为散逸层，它是大气的最高层，这里温度很高，空气稀薄。民航飞机无法达到这样的飞行高度。\nB项错误，对流层为大气圈的最低层，云、雨、雪、雾、雷电等天气现象，基本上都发生在此层，其特点是有强烈的对流运动，不太适合飞机长距离飞行。\nC项正确，自对流层顶至50—55公里的高空为平流层。平流层内水汽和尘埃稀少，基本上无云雨天气，空气垂直运动微弱，气流平稳，利于飞机长距离高空飞行。\nD项错误，平流层顶到80—90公里高度的大气层为中间层。气温随高度增高而降低。高度较高且有相当强烈的垂直对流运动，不适宜飞机飞行。\n故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"2394026","cat":"人文常识","stem":"白纸、黑纸、镜子、红纸四种物体，吸收光的本领从强到弱依次是（    ）。","options":{"A":"白纸、黑纸、镜子、红纸","B":"黑纸、红纸、白纸、镜子","C":"镜子、白纸、红纸、黑纸","D":"镜子、黑纸、红纸、白纸"},"answer":"B","explanation":"本题考查科技常识。\n白色不透明物体能反射所有的色光，黑色不透明物体吸收所有的色光，彩色不透明物体只能反射和物体相同的色光，其他色光被物体吸收。因此黑纸吸收光的本领最强，之后依次是红纸、白纸。镜子是通过光的镜面反射来成虚像的，其界面光滑、反射率高，吸收光的本领最弱。\n故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"2394028","cat":"人文常识","stem":"如果国庆节当天是农历九月初三。关于当天月相的描述，正确的是（    ）。","options":{"A":"杨同学说：“月球黄昏升出地平面。”","B":"赖同学说：“上半夜可见于西天。”","C":"张同学说：“月面东半亮（左）。”","D":"尹同学说：“月球午夜落下地平面。”"},"answer":"B","explanation":"本题考查地理国情。月球本身并不发光，我们看到的月光是月球反射太阳光的结果。月球圆缺变化的各种形状，称为月相。可用口诀加强记忆：上上上西西、下下下东东。意思是：上弦月出现在农历月的上半月的上半夜，月面朝西，位于西半天空（凹的一面朝东）；下弦月出现在农历月的下半月的下半夜，月面朝东（凹的一面朝西），位于东半天空。\nA项错误，农历每月十八、十九，月面朝东。此时为黄昏后月出，正午前月落，大半晚可见。\nB项正确，农历每月初三，月球被太阳照亮的半个月面朝西，地球上可看到其中有一部分呈镰刀形，凸面对着西边的太阳，称为蛾眉月。蛾眉月，日出后月出，日落后月落，与太阳同在天空，在明亮的天空中，故看不到月相。只有当太阳落山后的一段时间才能在西方天空看到蛾眉月。所以上半夜可在西方天空看到月亮。\nC项错误，农历每月二十二、二十三，太阳、地球和月球之间的相对位置变成直角，月球在日地连线的西边90°。这时我们看到月球东半边亮呈半圆形，月面朝东，称为下弦月。\nD项错误，农历每月初七、初八，太阳、地球和月球之间的相对位置变成直角，即月地连线与日地连线成90°。地球上的观察者正好看到月球是西半边亮，亮面朝西，呈半圆形叫上弦月。上弦月约正午月出，午夜从西方落入地平线之下，上半晚可见。\n故正确答案为B。","no":16,"missingImage":false},{"type":"question","qid":"2393931","cat":"科技常识","stem":"在温暖的环境中，苹果、梨放久了会逐渐变成空心，重量明显减轻。其主要原因是（    ）。","options":{"A":"苹果、梨的蒸腾作用散失了较多的水分","B":"苹果、梨的呼吸作用消耗了其中的有机物","C":"苹果、梨的中央被细菌、真菌分解掉了","D":"苹果、梨细胞的分裂和生长停止"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，蒸腾作用是水分从活的植物体表面（主要是叶子）以水蒸汽状态散失到大气中的过程。蒸腾作用不仅受外界环境条件的影响，而且还受植物本身的调节和控制，因此它是一种复杂的生理过程。摘下来的苹果、梨不会进行蒸腾作用，但会进行蒸发作用，使得水分不断散失，出现表皮皱缩现象。\nB项正确，植物的呼吸作用是指植物体吸收氧气，将有机物转化为二氧化碳和水并释放能量的过程。在温暖的环境中久放的苹果、梨会逐渐变成空心，重量明显减轻是因为苹果、梨进行呼吸作用，体内的有机物消耗较多，有机物减少，使其空心。\nC项错误，苹果、梨被周围的细菌和真菌等分解者分解，会出现腐烂现象，但不会出现空心现象。\nD项错误，苹果、梨长成后，高度分化的细胞的确会停止分裂和生长，但不会出现空心现象。\n故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"2393932","cat":"人文常识","stem":"有史学家评论战国时期的学说称：“战国时代，诸子百家风行一时。各家中有顺势而动的，想要因势利导，借助权力来改造社会；也有逆势而动的，知其不可而为，想依据理想来改造社会。”其中“逆势而动”的学派最有可能的是（    ）。","options":{"A":"墨家","B":"纵横家","C":"法家","D":"兵家"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，墨家的创始人是墨子。他的思想代表了平民的利益，特别是手工业者的利益。墨子主张“兼爱”（爱一切人，“不分王公大人”和“万民”的阶级差别），“非攻”（反对战争，在当时主要是反对不正义战争，反映了小生产者渴望安定生活的愿望），“尚贤”（主张任人唯贤，反对王公贵族的任人唯亲）。战国时期，各国混战不休，因此，墨家的主张不符合当时的时代形势，因此，“逆势而动”的学派最有可能的是墨家。\nB项错误，纵横家是战国时期从事政治外交的流派。他们的出现主要是因为当时割据纷争，王权不能稳固统一，需要在国力富足的基础上利用联合、排斥、威逼、利诱或辅之以兵之法不战而胜，或以较少的损失获得最大的收益。纵横家的产生符合当时的历史条件，因此纵横家属于“顺势而动”的学派。\nC项错误，法家是战国时期的重要学派之一，法家在经济上主张废井田，重农抑商、奖励耕战；政治上主张废分封，设郡县，君主专制，仗势用术，以严刑峻法进行统治；思想和教育方面，则主张禁断诸子百家学说，以法为教，以吏为师。其学说为君主专制的大一统王朝的建立，提供了理论根据和行动方略。因此，法家属于借助权力来改造社会的学派。\nD项错误，兵家是春秋战国诸子百家之一，以研究作战、用兵为其主要宗旨。兵家集大成者是孙武的《孙子兵法》。兵家学派的产生符合当时的历史条件，因此兵家属于“顺势而动”的学派。\n故正确答案为A。","no":18,"missingImage":false},{"type":"question","qid":"2393934","cat":"人文常识","stem":"穿越时空，来到19世纪90年代的英国伦敦，你可能看到的场景是（    ）。","options":{"A":"女王召集议会开会，由她选任新首相","B":"泰晤士河水质恶化","C":"爱因斯坦访问伦敦，宣讲相对论","D":"飞机在伦敦上空飞过"},"answer":"B","explanation":"本题考查人文常识。19世纪90年代是指公元1890年至1899年。\nA项错误，英国首相是英国政府首脑，是代表英国王室和民众执掌国家行政权力的最高官员。一般情况下国会下议院的多数党党魁或执政联盟的首领自动成为首相人选，人选经国王、女王任命后正式成为首相。19世纪90年代的英国，资产阶级代议制已经相对完善，首相由议会多数党领袖出任，由女王任命，但并非由女王选出。“选任”的说法错误。\nB项正确，自18世纪60年代，英国进入工业革命。工业革命促进了英国的工业发展，大量的工厂沿泰晤士河而建，两岸人口激增，大量的矿业废水、工业废水和生活污水未经处理就流入泰晤士河，水质恶化严重。在19世纪90年代，可能看到泰晤士河水质恶化。\nC项错误，相对论是爱因斯坦创立的关于物质、运动、时间和空间之间相互关系的理论。依其研究对象的不同可分为狭义相对论和广义相对论。爱因斯坦在1905年发表的论文《论动体的电动力学》中首次提出狭义相对论。广义相对论由爱因斯坦于1915年完成，1916年正式发表。19世纪90年代尚未出现相对论。\nD项错误，1903年12月17日，世界上第一架载人动力飞机在美国北卡罗莱纳州的基蒂霍克飞上了蓝天。这架飞机被称为“飞行者号”，它的发明者是美国莱特兄弟。飞机出现在20世纪初，19世纪90年代看不到。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"2393935","cat":"人文常识","stem":"支持组织集权的正当理由是（    ）。","options":{"A":"提高组织的适应能力","B":"提高组织决策质量","C":"维护政策的统一性与提高行政效率","D":"提高组织成员的工作热情"},"answer":"C","explanation":"本题考查管理学常识。组织集权是指在一个组织结构体系中，机关的事权由本机关自行负责处理，不设置或授权下级或派出机关的组织结构体系；或者上级机关或单位完全掌握组织的决策权和控制权，下级或派出机关处理事务须完全秉承上级或中枢机关的意志的组织结构体系。\nA项错误，处在动态环境中的组织必须根据环境中各种因素的变化不断进行调整。集权的组织可能使各个部门失去自我适应和自我调整的能力，从而削弱组织整体的应变能力。现代管理环境情况多变，要求管理组织系统要有很强的适应性，很强的应变能力。而实现这一点就需要通过授权来使各级管理者手中拥有自主权。\nB项错误，在高度集权的组织中，随着组织规模的扩大，组织的最高管理者远离基层，基层发生的问题经过层层请示汇报后再作决策，不仅影响了决策的正确性，而且影响决策的及时性。\nC项正确，组织集权的优点有：政令统一，不会出现乱出多门，分歧互异的现象；统筹兼顾，集中人力、物力资源，实现管理效能；组织上、下形成一个层级控制体系，指挥统一，命令易于贯彻执行。支持组织集权正是基于其能维护政令的统一性，并通过统筹兼顾提高行政效率。\nD项错误，由于实行集权管理，几乎所有的决策权都集中在最高管理层，结果使中下层管理者变成了纯粹的执行者，他们没有任何的决策权、发言权和自主权。长此以往，他们的积极性、创造性和主动性会被磨灭，工作热情消失，并且会减弱其对组织关心的程度。\n故正确答案为C。","no":20,"missingImage":false}],"count":17,"answerable":17,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2393984","cat":"逻辑填空","stem":"经典不产自        的冥想，而源于        的共鸣。作者自身树立经典意识、在艺术上精益求精；网站编辑把好品质关，及时发掘推荐有潜力的作品；网站、读者、评论家和监管部门也可齐心协力，营造有利环境。\n依次填入划横线部分最恰当的一项是（    ）。","options":{"A":"隔绝  协作","B":"隔空  合作","C":"虚空  现实","D":"浅层  深度"},"answer":"A","explanation":"本题从第二空入手，根据完整语句“作者自身树立经典意识、在艺术上精益求精；网站编辑把好品质关，及时发掘推荐有潜力的作品；网站、读者、评论家和监管部门也可齐心协力，营造有利环境”可知，横线处强调经典源于多方的共同努力，A项“协作”指在目标实施过程中，部门与部门之间、个人与个人之间的协调与配合；B项“合作”指个人与个人、群体与群体之间为达到共同目的，彼此相互配合的一种联合行动、方式，均符合文意。C项“现实”指客观存在的事物或事实解释；D项“深度”指一个人的学识、修养很高，与文意不符，均排除。\n第一空，横线处搭配“冥想”且根据“不产自······而源于······”可知，横线处与第二空构成反义并列关系，A项“隔绝”指阻隔、断绝，与“协作”语意相反，体现出经典并非个体冥想的产物，符合文意，当选。B项“隔空”指隔着一定的空间，无法与“合作”构成语意相反，排除。\n故正确答案为A。\n【文段出处】《网络文学：趋向经典，创造经典》","no":21,"missingImage":false},{"type":"question","qid":"2393989","cat":"逻辑填空","stem":"观察就要用专业的角度去关注、        周围的事物，有意识地汲取、思索、分析，看在眼里，记在心里。丰富的想象正是来源于知识的广博和平时对生活深入细致的观察。因此，想象并不是凭空        的。\n依次填入划横线部分最恰当的一项是（    ）。","options":{"A":"体验  杜撰","B":"体味  虚构","C":"体察  臆造","D":"体察  虚构"},"answer":"C","explanation":"第一空，横线处与“关注”通过顿号构成并列且对应后文“看在眼里”，故横线处表达“看”的含义，C、D两项“体察”指体会、观察，语意相符。A项“体验”指亲身经历；B项“体味”指体会寻味，均与文意不符，排除。\n第二空，根据“想象正是来源于······观察”可知，横线处强调想象不是凭空想出来的，C项“臆造”指凭主观的想法编造，语意相符且“凭空臆造”是常见搭配，当选。D项“虚构”指凌空构作，凭空捏造，虚幻之实化，含有“凭空编造”的意思，与“凭空”语义重复，排除。\n故正确答案为C。","no":22,"missingImage":false},{"type":"question","qid":"2393991","cat":"逻辑填空","stem":"在政治、经济多元和一体化的时代，文化语境也呈现多元，出现        的情感价值取向实属正常现象，我们充分尊重个人的情感选择。但是，过度        情感的极端自由、极端物欲，其实会给个人的幸福带来许多内伤。\n依次填入划横线部分最恰当的一项是（    ）。","options":{"A":"林林总总  鼓吹","B":"琳琅满目  渲染","C":"纷繁芜杂  追逐","D":"标新立异  强调"},"answer":"A","explanation":"第一空，横线处搭配“价值取向”且根据“文化语境也呈现多元”可知，横线处体现“多”的含义，A项“林林总总”形容繁多，符合文意，当选。B项“琳琅满目”比喻面前美好的东西很多，多搭配工艺品，与“价值取向”搭配不当，排除；C项“纷繁芜杂”指多而杂乱，没有条理，文段并未体现“杂、乱”，排除；D项“标新立异”指提出新的主张、见解，与“多”无关，且文段并未强调“新”，排除。\n第二空，代入验证，根据“极端自由”、“极端物欲”可知，横线处所填词语感情色彩偏消极，A项“鼓吹”指过度吹嘘，符合语境，当选。\n故正确答案为A。","no":23,"missingImage":false},{"type":"question","qid":"2394000","cat":"逻辑填空","stem":"如果冰川融化，海平面上升，世界各国都将要        被海水淹没地区的人口或者在河道中下游地带建造大坝保护地处低洼地区的城市，这些都需要巨大的花费。因此，世界目前面临的挑战就是限制二氧化碳的排放，从而        全球变暖所导致的最坏结果的发生，这在未来几十年里更加重要。\n依次填入划横线部分最恰当的一项是（    ）。","options":{"A":"转移  阻止","B":"控制  避免","C":"延缓  减少","D":"安置  改变"},"answer":"A","explanation":"第一空，横线处搭配“人口”且根据“被海水淹没地区的”可知，这些人口需要被“转移”、“安置”到安全的地方，A、D两项均符合文意。B项“控制人口”指减少人口增长，语意不符，排除；C项“延缓”指延迟，与“人口”搭配不当，排除。\n第二空，横线处搭配“的发生”，A项“阻止······发生”，搭配恰当，符合文意，当选。D项“改变”用法错误，合理的搭配为“改变最坏的结果”，而不是“改变最坏结果的发生”，排除。\n故正确答案为A。","no":24,"missingImage":false},{"type":"question","qid":"2394002","cat":"逻辑填空","stem":"城市的生活资源有限，在数千个城市里，数百个城市供水或供电等已然        ，而且越是密集拥挤的地方污染治理的力度越大，而治理污染越是困难，人口越发失控。当人口承载量日趋饱和，对环境本来是正常的利用，也渐渐变成了不计后果的        。\n依次填入划横线部分最恰当的一项是（    ）。","options":{"A":"捉襟见肘  索取","B":"寥寥无几  掠夺","C":"不堪重负  破坏","D":"人满为患  占用"},"answer":"A","explanation":"第一空，搭配“供水、供电等”，根据前文“生活资源有限”可知，横线处体现城市供水供电不足、压力大之意，A项“捉襟见肘”比喻顾此失彼、穷于应付，符合文意，保留；B项“寥寥无几”修饰的是数量上的少，D项“人满为患”指因人多造成了困难，两项均与“供水供电”搭配不当，排除；C项“不堪重负”指承受不了繁重的负荷，不能担当重任，指在经济上或别的方面无法承受，由材料中“生活资源有限”可知，程度过重，排除。\n验证第二空，表示对环境从正常利用变成不考虑后果的索要，A项“索取”符合文意，当选。\n故正确答案为A。","no":25,"missingImage":false},{"type":"question","qid":"2394014","cat":"逻辑填空","stem":"其实，持这种        的人并不想掩饰他们        的种族主义观念，说什么“这是一场与一种完全不同的文明和不同的意识形态的斗争，这是美国以前从未经历过的”“当前中国的制度不是西方哲学和历史的产物”“我们首次面对一个非白色人种的大国竞争对手”。这样的鼓噪声，人们并不陌生，使人们不能不想到纳粹当年对犹太民族的恶毒诅咒。\n依次填入划横线部分最恰当的一项是（    ）。","options":{"A":"是非观念  天生优越","B":"奇谈怪论  根深蒂固","C":"奇思怪想  与生俱来","D":"独立思想  推陈出新"},"answer":"B","explanation":"第一空，根据后文给出的种种言论与观点和“鼓噪声”、“毒恶诅咒”可知，该言论与观点是消极贬义的，B项“奇谈怪论”指奇怪的、不合情理的言论，符合文意，当选。A项“是非观念”指能够判断一件事情的是非对错，不表示消极的感情色彩，排除；C项“奇思怪想”指想象力丰富，而文段后文“鼓噪声”、“恶毒诅咒”可知，横线处并非表达的是想象力，而是具体的言论，排除；D项“独立思想”指独立自主、不依赖他人，感情色彩积极，排除。\n验证第二空，修饰“种族主义观念”，“根深蒂固”指根基深厚牢固，不可动摇，用在此处搭配恰当，符合文意。\n故正确答案为B。\n【文段出处】《不要逆历史潮流而动——“对华文明冲突论”可以休矣》","no":26,"missingImage":false},{"type":"question","qid":"2394018","cat":"逻辑填空","stem":"那种抽象地用对技术先进性的讨论取代对实际贸易情况的讨论的分析，意味着将具体的生产过程简化成技术体系中的上游和下游的关系，抽象地谈论哪一方具有创新优势，不提及具体的产业能力和制造体系，得出的结论因此形成了巨大的        。那种简单地将所谓          等同于对美方无条件、无底线、无边界让步的认识，则是典型的        的表现。\n依次填入划横线部分最恰当的一项是（    ）。","options":{"A":"反差  实力深浅  妥协退让","B":"落差  引而不发  投降主义","C":"扭曲  韬光养晦  虚无主义","D":"漏洞  涵养蓄积  绥靖主义"},"answer":"C","explanation":"从第二空入手，根据前后文可知，第二空应体现出与“对美方无条件、无底线、无边界让步的认识”不是等同的，而是相反关系，故横线处应填入积极感情色彩的词语。A项“实力深浅”为中性词，包含“深浅”两个方面，排除；B项“引而不发”比喻做好准备暂时不行动，等待时机；C项“韬光养晦”指隐藏才能不使外露；D项“涵养蓄积”指积蓄储存能量，三项均符合文意，保留。\n第三空，根据“是典型的······的表现”可知，前文是对横线处的解释说明，对应“对美方无条件、无底线、无边界让步的认识”，C项“虚无主义”表意正确，指对于客观世界或生命的认识是没有任何目的、条件和意义的，文段无条件、无底线、无边界地认识美方，即为“虚无主义”的表现，C项正确，当选。B项“投降主义”指违背民族或阶级利益，向敌人投降、屈服的思想或行为，文段并未体现投降之意，排除；D项“绥靖主义”指对侵略者姑息、退让，牺牲别国利益以求暂时的和平与苟安的妥协政策，与文段意思不符，排除。\n验证第一空，根据前文“抽象地讨论取代实际情况的分析”、“抽象简化技术体系”等，得出的结论形成“扭曲”符合文意。\n故正确答案为C。\n【文段出处】《赢得中美贸易摩擦需要纠正三种错误认知》","no":27,"missingImage":false},{"type":"question","qid":"2394022","cat":"逻辑填空","stem":"所谓幼儿园“小学化”，指的是在幼儿园阶段提前教汉语拼音、识字、计算、英语等小学课程内容。这种现象近年来非常普遍，        ，甚至传导至幼前阶段，也就是还没上幼儿园就开始教这些知识了。更有甚者，小孩还在幼儿园阶段就在上奥数班，至于学拼音、英语，更是        。上海的家长们为了给孩子报某个毫无资质的学前班，挤破了头不说，排队报名的黄牛号都涨到5000元，这事情也一度闹得        。\n依次填入划横线部分最恰当的一项是（    ）。","options":{"A":"靡然成风  层见叠出  沸沸扬扬","B":"蔚然成风  层见叠出  沸反盈天","C":"靡然成风  司空见惯  沸沸扬扬","D":"蔚然成风  司空见惯  沸反盈天"},"answer":"C","explanation":"第一空，所填词语形容幼儿园“小学化”这一现象，根据前后文可知，作者对于幼儿园“小学化”是不认可的，这是一种不好的风气，“靡然成风”指相互跟风，群起效尤而成风气，贬义词，多指不好的风气，保留A、C两项；“蔚然成风”指一件事情逐渐发展盛行，形成一种良好的风气，感情色彩为积极褒义，与文段感情色彩不符，排除B、D两项。\n第二空，根据横线前“更是”可知，横线处体现该现象特别普遍、特别常见，C项“司空见惯”指某事常见不足为奇，与文意相符，当选；A项“层见叠出”指接连不断地多次出现，文段仅表示该现象常见而非一个接一个地出现，排除。\n验证第三空，“沸沸扬扬”形容人声喧扰，议论纷纷，与前文“闹得”搭配得当，当选。\n故正确答案为C。","no":28,"missingImage":false},{"type":"question","qid":"2394027","cat":"逻辑填空","stem":"自改革开放以来，中国一直在加强科技开发，多次冲破技术封锁，实现弯道超车，        ，靠的就是自主创新。从车辆到线路，从制动到通信信号，没有技术，就从国外引进消化吸收。一步一个台阶，中国高铁企业苦练内功、        ，实现了国人高铁产业腾飞的梦想。以高铁为镜，我们涵养精益求精的大国工匠精神。        ，中国制造面临过这样的尴尬：号称是世界工厂、制造大国，老百姓却        ，去国外抢购保温杯、电饭煲、马桶盖等普通日用品。\n依次填入划横线部分最恰当的一项是（    ）。","options":{"A":"后来居上  厚积薄发  毋庸讳言  舍近求远","B":"后发先至  养精蓄锐  毋庸讳言  舍本逐末","C":"后发先至  养精蓄锐  毋庸置疑  舍近求远","D":"后来居上  厚积薄发  毋庸置疑  舍本逐末"},"answer":"A","explanation":"先看第一空，所填词语与“弯道超车”构成并列，表示中国科技发展由原来“没有技术”到后来的“实现弯道超车”，体现出中国科技发展由弱到强，由比不上发达国家到赶超发达国家。“后来居上”指后来的超过先前的，用以称赞后起之秀超过前辈，符合文意。“后发先至”指比对手晚出手但是先碰到对方，一出手对方必然倒地，“必然倒地”无从体现，文中并未提及中国与他国竞争致使他国败北，排除B、C项。\n再看第四空，由“中国是制造大国，老百姓却去国外抢购日用品”可知，老百姓放弃身边的国货，而选择国外产品。A项“舍近求远”指舍去近处的，追求远处的，形容做事走弯路，符合文意。D项“舍本逐末”比喻做事不注意根本，而只抓细微末节，文字并未提及“根本”与“细节”，排除。\n第二、三空代入验证，“厚积薄发”形容只有准备充分才能办好事情；“毋庸讳言”指用不着隐讳，可以直说的内容，填入文段均符合文意。\n故正确答案为A。\n【文段出处】《人民日报评论员：标注中国制造新高度》","no":29,"missingImage":false},{"type":"question","qid":"2394031","cat":"逻辑填空","stem":"传统文化是中华民族的灵魂，几千年来，春节庙会、清明祭祖、端午赛龙舟、重阳登高等传统民俗活动        ，展现了乡土文化旺盛顽强的生命力。乡村旅游大发展，传统村落成为人们        的旅游胜地，民俗体验、乡村写生等成为消费热点。景德镇陶瓷、淄博琉璃、潍坊风筝等乡土工艺品以及泰山皮影、日照农民画等乡土民间艺术纷纷走出国门，中国乡村文化正        地走向世界，挺立于世界文化之林。实践证明，中国乡土文化历经劫难而不亡，        而新生，我们完全有理由树立对乡土文化的自信，这是文化自信的核心构成，决定着文化自信的深度和广度。\n依次填入划横线部分最恰当的一项是（    ）。","options":{"A":"方兴未艾  趋之若鹜  从容不迫  沧海桑田","B":"如火如荼  纷至沓来  踌躇满志  饱经风雨","C":"轰轰烈烈  接踵而至  胸有成竹  饱经沧桑","D":"方兴未艾  心驰神往  信心百倍  饱经沧桑"},"answer":"B","explanation":"第一空，所填词语搭配“传统民俗活动”，根据“几千年来”、“展现了乡土文化旺盛顽强的生命力”可知，所填词语表示传统民俗活动依然发展良好，B项“如火如荼”原比喻军容之盛，现用来形容旺盛、热烈或激烈；C项“轰轰烈烈”形容事业的兴旺，也形容声势浩大，气魄宏伟，两项符合语境。A、D项“方兴未艾”是指事物正在发展，尚未达到止境或还没有停止，多形容新生事物正在蓬勃发展，“传统民俗活动”存在了几千年，并非新生事物，与文意不符。排除A、D两项。\n第二空，根据“乡村旅游大发展”、“消费热点”可知，传统村落成为非常热门的旅游地点。B项“纷至沓来”形容纷纷到来，连续不断地到来；C项“接踵而至”指人们前脚跟着后脚，接连不断地来，均符合文意。\n第三空，根据“我们完全有理由树立对乡土文化的自信”可知，中国乡村文化应是很有自信地走向世界，B项“踌躇满志”形容对自己取得的成就非常得意，C项“胸有成竹”比喻熟练有把握，均符合文意。\n第四空，横线前后句式一致，表示并列，所填词语对应“历经劫难”。B项“饱经风雨”指经历过许多艰难困苦，符合文意。C项“饱经沧桑”指经历过多次的世事变化，生活经历极为丰富，这里并非经历“世事变化”，而是经历“苦难”，排除。\n故正确答案为B。\n【文段出处】中学语文测试题","no":30,"missingImage":false},{"type":"question","qid":"2393945","cat":"逻辑填空","stem":"中国人喜欢用石头来代表仪式与权力，一个突出的例证是，人们喜欢在石头上进行书法创作，取其      的材料气质，达到永存文字的理想。石头取材方便、质地坚硬、体量巨大、保存容易、镌刻困难、端正严肃、      等特性，让石头上的书法与其他材料上的书法有所区别。摩崖是中国人创造的、体量最大的书法，选址多在断崖峭壁之上。因此其内容与形式，必须与所处环境      ，既突出周围景观地貌的主题，起到点题作用，又隐身于大山大水之间，强调人与自然的和谐。“石文”兴起的初期，正是纸张发明的时候。其后，石头上的书法与纸张上的书法交织前行。聪明的中国人充分利用石头与纸张不同的载体特性，      ，各自发挥长处，共同建构中国文字、文化与文明的摩天大厦。\n依次填入划横线部分最恰当的项是（ ）。","options":{"A":"亘古不灭  朴素无华  息息相关  扬长避短","B":"亘古不灭  朴素无华  休戚相关  相得益彰","C":"亘古不变  质朴无华  息息相关  扬长避短","D":"亘古不变  质朴无华  休戚相关  相得益彰"},"answer":"C","explanation":"第一空，横线修饰“石头”这类材料的气质，且根据“达到永存文字的理想”可知，希望书写在石头上的文字可以永存、不改变。“亘古不变”指从古至今永远也不会改变，符合文意。“亘古不灭”指从古到今，永不绝灭，形容永久的生命力，侧重强调“永不绝灭”，不符合文意，且程度较重，排除A、B项。\n第二空，横线修饰“石头”的特性，“质朴无华”指质朴实在而不浮华，符合文意。\n第三空入手，横线修饰摩崖内容与形式，与其所处环境的关系，根据“既突出周围景观地貌的主题，起到点题作用，又隐身于大山大水之间，强调人与自然的和谐”可知，书法与自然之间应紧密联系。C项“息息相关”形容关系非常密切，符合文意。D项“休戚相关”指忧喜、祸福彼此相关联，形容关系密切，利害相关，文中未提及“利害、祸福”，故语意过重，排除D项。\n第四空，代入验证，C项“扬长避短”指发扬长处，回避短处，与“利用石头与纸张不同的载体特性，各自发挥长处共构摩天大厦”对应得当，当选。\n故正确答案为C。\n【文段出处】高三模考卷","no":31,"missingImage":false},{"type":"question","qid":"2393946","cat":"逻辑填空","stem":"世界经济强劲，中国经济更有力量；国际市场疲软，中国经济也存在不确定性。面对外汇资产缩水风险、出口贸易受到影响和输入性通胀压力上升等      ，中国需要      考量应对，谋定而后动，制定具有特色的中国方案更是      。\n依次填入划横线部分最恰当的一项是（ ）。","options":{"A":"困境  郑重  迫在眉睫","B":"局势  认真  十万火急","C":"局面  仔细  急如星火","D":"考验  审慎  刻不容缓"},"answer":"D","explanation":"第一空，横线处所填词语应与 “面对”搭配，且根据“风险”“压力上升”可知，横线处应体现出当下面对的情况、处境是有问题的。A项“困境”指困难的处境，D项“考验”指通过具体事件、行动或困难环境来检验，均符合文意，保留。B项“局势”指一个时期内的发展情况，C项“局面”指一个时期内事情的状态，均不符合文意，排除。\n第二空，横线处所填词语应与横线后“谋定而后动”形成对应，即定下计划后再采取行动，故横线处需体现中国应充分考虑之意。D项“审慎”指周密而谨慎，可以体现“充分考虑”之意，保留。A项“郑重”指严肃认真，无法体现“充分考虑”之意，排除。\n第三空，代入验证，D项“刻不容缓”指片刻也不容耽搁，形容情势或事情非常紧迫，符合文意，当选。\n故正确答案为D。\n【文段出处】高三模考卷","no":32,"missingImage":false},{"type":"question","qid":"2393948","cat":"逻辑填空","stem":"散存于民间的珍贵文物和艺术品，从19世纪起就大量流向海外，幸存于国内民间的藏品      ，而拥有这些宝贝的藏家对拍卖这件事还抱有怀疑和惧怕的心理，不敢轻易拿出藏品交易。      的春秋两季拍卖，在不紧不慢的节奏中积累出市场，经过大约10年的蛰伏期，中国文物艺术品价值逐渐      出来。\n依次填入划横线部分最恰当的一项是（ ）。","options":{"A":"比比皆是  大张旗鼓  显露","B":"偶有所闻  循序渐进  展示","C":"凤毛麟角  周而复始  迸发","D":"五花八门  水到渠成  呈现"},"answer":"C","explanation":"第一空，填入横线的成语修饰“民间藏品”，且结合前后文“幸存”及“不敢轻易拿出藏品交易”可知，“民间藏品”为数不多、非常稀少。B项“偶有所闻”指偶然听说；C项“凤毛麟角”比喻人或物稀有珍贵，均可体现“民间藏品”少的意思，符合文意，保留。A项“比比皆是”形容遍地都是；D项“五花八门”比喻花样多端种类繁多，均与文意相悖，排除。\n第二空，填入横线的成语修饰“春秋两季拍卖”，并结合后文“经过10年蛰伏期，艺术品的价值……”可知，所填词语应体现“拍卖”是两个季节不断循环往复的，C项“周而复始”形容不断循环，符合文意，当选。B项“循序渐进”按一定的顺序、步骤逐渐进步，“春秋两季拍卖”并非是先后顺序、步骤的关系，仅为不同时间段的举办，与文意不符，排除。\n第三空，代入验证， C项 “价值迸发”搭配恰当，表述正确。\n故正确答案为C。\n【文段出处】《浅谈2018—19年中国古董文物艺术品拍卖市场行情，怎么发展起来的》","no":33,"missingImage":false},{"type":"question","qid":"2393949","cat":"逻辑填空","stem":"自美国本届政府上台以来，世界主要经济体对美方的      主义多有领教，对美方处理中美经贸摩擦的      心态和极端手法      。去年以来，美方对欧盟、日本、加拿大等主要经济体纷纷挑起经贸摩擦。\n依次填入划横线部分最恰当的一项是（ ）。","options":{"A":"霸权  无理  深有感触","B":"霸凌  骄横  感同身受","C":"单边  一贯  心知肚明","D":"强权  习惯  习以为常"},"answer":"B","explanation":"本题从第二空入手，所填词语与“极端”构成并列关系，应体现美方“心态”极度的偏激，色彩偏消极，B项“骄横”指傲慢专横，符合文意。A项“无理”一般搭配“要求、条件”，与“心态”搭配不当，排除。C项“一贯”指一向如此,从未改变，D项“习惯”指积久养成的生活方式，均不能与后文“极端”构成并列关系，且均为中性词，与文段不符，排除。\n第一空，代入验证，“霸凌主义”指恃强欺弱者、恶霸的主张，符合文意。\n第三空，代入验证，“感同身受”指像自身承受一样。对应前文“世界主要经济体……多有领教”，符合文意，当选。\n故正确答案为B。\n【文段出处】《失道寡助的美国打不赢贸易战》","no":34,"missingImage":false},{"type":"question","qid":"2393950","cat":"逻辑填空","stem":"各种文明应该交流互鉴、取长补短、美美与共。把国与国之间的问题上升到文明层面，把不同文明降低到人种范畴，不仅      ，而且有百害而无一利。对那些热衷于种族主义的斯金纳们，人们必须大喝一声，      吧！不要冒天下之大不韪，再执迷不悟、      ，前面就是万丈深渊。\n依次填入划横线部分最恰当的一项是（ ）。","options":{"A":"毫无正义  金盆洗手  固执己见","B":"损人害己  果断放弃  不知悔改","C":"于事无补  悬崖勒马  一意孤行","D":"打破平衡  回头是岸  怙恶不悛"},"answer":"C","explanation":"第一空，依据“不仅……而且”为递进关系，故所填词语对应“有百害而无一利”且程度较轻，A、C、D项均可， B项“损人害己”指既害了别人，又害了自己，与后文程度一致，不能构成递进关系，排除。\n第二空，根据后文“不要冒天下之大不韪……前面就是万丈深渊”可知，所填词语应体现让“斯金纳们”这类人“要及时悔改，否则前面就有危险存在”，C项“悬崖勒马”比喻面临危险及时醒悟回头符合文意，保留。A项“金盆洗手”指放弃以前长期从事的行业或某件事，而文段修饰的“热衷于种族主义的人”即“一种信仰”而非“从事的行业或事”，与文意不符，排除；D项“回头是岸”比喻犯错误的人只要悔改,就会有出路，文段并未提及“是否有出路”，仅强调要及时悔悟错误，“是岸”无对应信息，排除。\n第三空，代入验证C项。顿号表并列，所填词语对应“执迷不悟”，应体现坚持错误而不觉悟之意，C项“一意孤行”指不接受别人的劝告，顽固地按照自己的主观想法去做，符合文意，当选。\n故正确答案为C。\n【文段出处】《人民日报钟声：不要逆历史潮流而动——“对华文明冲突论”可以休矣》","no":35,"missingImage":false},{"type":"question","qid":"2393937","cat":"语句表达","stem":"下列各句在表达上没有语病的一句是（  ）。","options":{"A":"为了防止这类交通事故不再发生，我们加强了交通安全的教育和管理","B":"不管气候条件和地理环境都极端不利，登山队员仍然克服了困难，胜利攀登顶峰","C":"该市有人不择手段仿造伪劣产品，对这种坑害顾客骗取钱财的不法行为，应给以严厉打击","D":"马教授领导的科研组研制出能燃用各种劣质煤并具有节煤作用的劣质煤稳燃器，为节能做出了重大贡献"},"answer":"D","explanation":"A项存在语病，应将“不再”改为“再次”，肯否矛盾，排除。\nB项存在语病，应将“不管”改为“尽管”，关联词语搭配不当，排除。\nC项存在语病，应将“仿造”改为“制造”或者将“伪劣产品”改为“名牌产品” ，仿造伪劣产品逻辑不当，排除。\n故正确答案为D。","no":36,"missingImage":false},{"type":"question","qid":"2393938","cat":"片段阅读","stem":"美国在海外推行民主问题时，决策者专注于其他国家的法律和制度而不是其正当文化。他们认为，人们会为了投票的机会而放弃近期的安全和稳定。他们利用军事干预来推行民主价值观，而没有考虑这种做法所带来的问题，而且还忽视了他们希望去说服的那些人的价值观和利益。\n上面这段话主要表达的意思是（  ）。","options":{"A":"认为在海外推行民主问题时因专注于其他国家的法律和制度而犯了不少错误","B":"认为在海外推行民主问题时一味地干预而没有考虑他国人民的价值观和利益","C":"认为美国在海外推行民主问题时犯了三大错误","D":"认为美国在海外推行民主问题时犯了四大错误"},"answer":"C","explanation":"文段围绕“美国在海外推行民主问题”展开，提到了美国决策者只专注于其他国家的法律和制度而不看他们的正当文化、美国认为人们会为了投票的机会而放弃近期的安全稳定、美国利用军事干预来推行民主价值观而不考虑后果以及对方的价值观和利益这三方面的问题。文段是并列结构，需对文段做全面概括，即美国在海外推行民主问题时存在的三方面问题，C项当选。\nA、B两项均未提及核心话题“美国”，且仅仅提到了某一个问题，表述片面，排除；D项：“四大错误”表述错误，只有三方面错误，排除。\n故正确答案为C。","no":37,"missingImage":false},{"type":"question","qid":"2393939","cat":"片段阅读","stem":"20年前，关于中东地区的高级别外交会议没有美国的参与和领导是不可想象的。如今，土耳其、俄罗斯和伊朗在没有华盛顿的情况下展开磋商，而叙利亚反对派前往莫斯科去讨论国家的未来。俄罗斯也加强了与埃及、土耳其、沙特阿拉伯和以色列的联系。\n上面这段话要表达的主要意思是（ ）。","options":{"A":"在中东问题上，俄罗斯基本上取代了美国处理中东事务","B":"美国对中东控制力和影响力明显下降","C":"中东开始由美国单一主导走向多极化主导","D":"中东的未来掌握在美国或俄罗斯等大国的手里，自己无法主宰"},"answer":"B","explanation":"文段首句指出20年前美国在中东影响力很大，第二句“如今”之后情况发生了变化：中东各国在没有美国参与的情况下开展磋商，叙利亚反对派去俄罗斯参会，并且俄罗斯与各国的联系也在加强。文段通过对比体现出俄罗斯在中东的作用上升，而美国在中东的影响力大不如先前，对应B项。\nA项，“俄罗斯基本取代美国”表述绝对，文段仅体现出俄罗斯在中东的作用上升，排除；\nC项，“多极化主导”无中生有，排除；\nD项，谈论中东未来无法自主而受制于美国俄罗斯，无中生有，排除。\n故正确答案为B。\n【出处】《西班牙专家：淡出中东凸显美影响力弱化》","no":38,"missingImage":false},{"type":"question","qid":"2393940","cat":"片段阅读","stem":"随着现代化进程的加快，传统文化的发展空间被压缩了。这其中有诸多因素的影响，但传统文化本身应对不灵活、缺乏创新能力也是一个重要原因。一方面是固步自封，不求变革而落伍于时代；另一方面则身在宝山而不自知，优秀的文化财富没有得到充分开发利用。《花木兰》的故事被美国人拿去拍成动画片，影响跨越国界，就充分显示了民间传统文化创新的魅力。\n上面这段话要表达的主要意思是（ ）。","options":{"A":"分析传统文化未能与时俱进的原因","B":"保护传统文化的关键是文化创新","C":"传统文化需要用异国的思维才能创新","D":"现代化进程加快是传统文化落伍的主要原因"},"answer":"B","explanation":"文段首句指出传统文化面临发展空间被压缩的问题，接下来指出传统文化缺乏创新能力是造成问题的主要原因，后文通过例举两个方面进行说明。尾句通过“花木兰”的例子，说明了传统文化通过开发利用可以取得成功，文段为“提出问题+分析问题”的结构，意在针对问题提出对策即需要创新来扩大空间，对应B项。\nA项属于分析问题的部分，非重点，排除；\nC项，“异国思维”对应文段尾句“花木兰”的内容，属于举例论证的内容，非重点，排除；\nD项，文段导致传统文化落伍的原因是“传统文化本身应对不灵活、缺乏创新能力”而非“现代化进程加快”，两者不存在因果关系，排除。\n故正确答案为B。\n【文段出处】《李贻衡委员：民间传统文化的保护与创新》","no":39,"missingImage":false},{"type":"question","qid":"2393941","cat":"片段阅读","stem":"在中国文化苑内，唐诗与宋词构成一双至美无上的艺术精品，共同构成中国封建时代文化的高峰。人们对这两种文体亦颇多评论。有人认为，唐诗才是真正的艺术，精细而高雅，无论是用词还是构思，皆展示文才与思情；而宋词则或多或少有一种鄙俗的质地，类似于今天的通俗文学。有人认为，宋词才是真正的艺术，做到了雅俗共赏，非诗所能比，“梅须逊雪三分白，雪却输梅一段香”。我则以为二者各有所长，不必作无谓的比较。\n下面对“梅须逊雪三分白，雪却输梅一段香”这句话在文中所要表达的意思，理解最准确的一项是（ ）。","options":{"A":"唐诗比宋词更有韵味，更有雅正之质","B":"唐诗与宋词一样，各有所长，各有所短","C":"宋词比唐诗更有优势，更有广泛的社会性","D":"唐诗有梅香，宋词有雪白"},"answer":"C","explanation":"本题为词句理解题，需要结合上下文进行理解，“梅须逊雪三分白，雪却输梅一段香”是文段倒数第二句的后半个分句，结合前半句话“宋词才是真正的艺术……非诗所能比”，可知这句话是在突出宋词的较高地位。并且尾句提到“我则以为二者各有所长”，转折之后说明两者地位相同，转折之前应该体现两者地位不同，突出的是“宋词”较高地位，C项当选。\nA项，倒数第二句突出的是“宋词”的地位，而非“唐诗”，语义相悖，排除。\nB项对应尾句，是转折之后的观点，而这句诗在转折之前，与尾句的含义不同，排除。\nD项未涉及到两者地位的对比，排除。\n故正确答案为C。","no":40,"missingImage":false},{"type":"question","qid":"2393954","cat":"片段阅读","stem":"所有的农耕文明时代的文化都具有保守性，无论东西方，概无例外。深刻的原因是，在以手工劳动为基础的生产方式中，“原封不动地保持旧的生产方式，却是过去一切工业阶级生存的首要条件”（《马克思恩格斯选集》）。西方文化，尤其是自然科学在西方文艺复兴与18世纪工业革命后之所以发生了深刻性的质变，引发了中西方的对立与冲突，以及中国在自然科学发展上的明显落后，根本原因在于，以机器为生产基础的商品经济生产方式与交换方式取代了以手工工具为基础的自然经济生产方式与交换方式。\n对上面这段话，理解正确的一项是（ ）。","options":{"A":"以手工劳动为基础的生产方式，是导致农耕文明时代的文化具有保守性的根本原因","B":"由表及里，从历史的文化现象角度分析了中西方的对立与冲突形成的深层原因","C":"无论东西方，在封建时代，都是以农耕文明为主的，故而东西方都具有保守性","D":"自然科学的质变引发了中西方文化的对立与冲突，引发了生产方式与交换方式的变化"},"answer":"B","explanation":"根据文段，首先从自然科学、西方文艺复兴与18世纪工业革命等历史事实出发，再从“生产方式与交换方式”的改变这一根本原因进行分析，阐述了中西方的对立与冲突形成的深层原因，符合由浅入深，“由表及里”的顺序，B项正确，当选； \nA项，根据文段，手工劳动为基础的生产方式是导致农耕文化具有保守性的“深刻原因”，而非“根本原因”，排除。\nC项，根据文意可知，无论是东方和西方的农耕文明都具有保守性，而并非东方和西方均以农耕文明为主，概念偷换，排除。\nD项，根据文意，自然科学之所以发生深刻变化，根本原因在于生产方式和交换方式的改变，而非自然科学导致二者的改变，属于因果倒置，排除。\n故正确答案为B。\n【文段出处】《论文化创新与创新文化》","no":41,"missingImage":false},{"type":"question","qid":"2393956","cat":"片段阅读","stem":"以梅宏团队为研究主力，北京大学作为第一完成单位研发的“云端融合的资源反射机制及高效互操作技术”改变了传统“白盒”互操作技术思路，提出颠覆式的数据互操作技术途径——“黑盒”思路，通过揭示信息系统内部基于云端融合特性的计算反射机理，发明了通过系统客户端外部监测与控制实现业务数据和功能高效互操作的整套技术及平台，突破了信息孤岛业务数据和功能与第三方系统高效互操作这一制约大数据价值链上下游的“卡脖子”技术，使信息孤岛开放效率得到大幅提升。\n对上面这段话，下列说法正确的一项是（ ）。","options":{"A":"黑盒思路突破了信息孤岛业务数据和功能与第三方系统高效互操作这一制约大数据的整套技术和平台","B":"梅宏团队利用高效互操作技术揭示了计算机反射机理","C":"在白盒思路下，信息孤岛开放效率基本上没有什么提升","D":"黑盒与白盒相比，优势在于其资源反射机理和高效互操作技术"},"answer":"D","explanation":"根据文段首句“云端融合的资源反射机制及高效互操作技术改变了传统白盒互操作技术思路”可知白盒与黑盒的区别在于资源反射机制和互操技术两点，D项当选。\nA项，根据文意，黑盒思路建立了“整套技术及平台”，突破了高效互操这一制约了大数据价值链上下游的卡脖子技术，可知黑盒思路并非对整套技术有所突破，只是在“高效互操”上有所突破，范围扩大，排除。\nB项，根据文段“梅宏团队通过揭示······计算反射机理，发明了······高效互操作的整套技术及平台”可知，揭示原理在前，发明高效互操作技术在后，因果倒置，排除。\nC项，根据文意，黑盒思路使孤岛开放效率大幅度提升，但文段并未说明白盒思路下效率没有提升，表述无中生有，排除。\n故正确答案为D。\n【文段出处】《“黑盒式”互操作技术连接信息孤岛》","no":42,"missingImage":false},{"type":"question","qid":"2393959","cat":"片段阅读","stem":"19世纪末20世纪初，是中国面临前所未有的大变革的年代。活跃在那个大变革年代的有几位杰出的历史人物，他们凝聚了那个时代的记忆，成为那个时代的符号。梁启超先生就是其中一位。他既是英勇的斗士，也是深邃的学者；既是不知疲倦的政治家，也是充满了慈爱的长者。遗憾的是，历史没有给予他长久的人生。但这却不影响他形成远超自我生命的学术思想体系。这个学术思想体系随着时间的推移，不仅没有褪色，反而更加熠熠生辉。\n对上面这段话理解不正确的一项是（ ）。","options":{"A":"文段着墨时代背景，目的是衬托主人公梁启超先生","B":"文段重点在于表明梁启超先生斗士、学者、政治家、长者的身份","C":"文段用梁启超先生有限的生命来反衬他远超生命的思想","D":"文段虽从多角度来写梁启超先生，但归根结蒂是想揭示梁启超先生的思想价值"},"answer":"B","explanation":"根据文段“但这却不影响他形成远超自我生命的学术思想体系”可知，文段通过转折词重点强调梁启超的思想体系，C项与D项理解正确，排除；而对其多种身份的介绍位于转折前，并非文段强调的重点，B项当选；A项，根据“梁启超先生就是其中一位”以及后文可知文段重点描述了时代背景之下的梁启超先生，理解正确，排除。\n故正确答案为B。\n【文段出处】《一个时代的思想图谱和文化基因》","no":43,"missingImage":false},{"type":"question","qid":"2393965","cat":"语句表达","stem":"下列各句中，画线的成语使用正确的一项是（  ）。","options":{"A":"故宫博物院的珍宝馆里，陈列着各种奇珍异宝、古玩文物，真是\u003cu>沁人心脾\u003c/u>","B":"建设中国特色的社会主义事业，要靠我们持久奋战，不可能\u003cu>一蹴而就\u003c/u>","C":"经过重新装修，教学楼里里外外\u003cu>改头换面\u003c/u>，给了刚返校的师生们一个惊喜","D":"金庸的武打小说情节起伏跌宕、\u003cu>抑扬顿挫\u003c/u>，吸引了广大读者"},"answer":"B","explanation":"B项，“一蹴而就”比喻事情轻而易举，一下子就成功，文段强调的就是建设中国特色社会主义事业要持久奋战，不能一下子成功，符合文意，当选；\nA 项，“沁人心脾”用来形容欣赏了美好的诗文、乐曲等给人以清新、爽朗的感觉，而文段中说的是“奇珍异宝”、“古玩文物”而非诗文、乐曲，用法不当，排除；\nC项，“改头换面”比喻只改外表和形式，内容实质不变，而句子中提到里里外外都改变了，不仅仅是表面，用法不当，排除；\nD项，“抑扬顿挫”，形容诗文作品或音乐之声响高低转折，富变化又有节奏，不能用来形容小说的情节，用法不当，排除。\n故正确答案为B。","no":44,"missingImage":false},{"type":"question","qid":"2393967","cat":"语句表达","stem":"填入划横线部分最恰当的一句是（ ）。\n据中国农业大学调查，我国消费者每年在餐桌上浪费的食物总量价值高达2000亿元，被倒掉的食物约相当于两亿多人一年的口粮。德国和英国的统计显示，德国居民每年当作垃圾扔掉的可用或部分可用的食品高达1100万吨；英国每天有约700万片面包、130万罐酸奶、66万个鸡蛋被丢弃，其中相当一部分可以食用，这种“舌尖上的浪费”，触目惊心，令人心痛。无数的事实证明：      。","options":{"A":"当前许多国家食物浪费严重","B":"中欧食物浪费惊人","C":"其他国家食物浪费没有中欧明显","D":"人们对食物的浪费应引起人类的重视与警觉"},"answer":"A","explanation":"语句填空题，横线在结尾，并且横线前面出现无数事实证明，提示需要总结前文得出最终的结论，文段首先指出我国每年浪费的食物总量非常的大，其次又指出德国和英国的浪费也是非常严重的，紧接着指出“事实证明”，其实指的是前面提到的各种例子，可知，文段想强调食物浪费非常严重，对应到A项，“许多国家食物浪费严重”，符合文意，当选；\nB项，“中欧”若理解为“中国”和“欧洲”，则范围扩大，文段只提到了“西欧（英国）”“欧洲中部地区（德国）”，并没有提及“北欧”。“中欧”如果理解为“欧洲中部”，表述也为片面，因为文段也提到了“中国”和“西欧（英国）”，排除；\nC项，“其他国家没有中欧明显”文段没有提到其他国家与中欧的对比，无中生有，排除；\nD项，文段通过例子以及“事实证明”想要强调的是食物浪费的情况严重，而非要引起人们的警觉和重视，无中生有，排除。\n故正确答案为A。","no":45,"missingImage":false},{"type":"question","qid":"2393953","cat":"片段阅读","stem":"国家邮政局发展研究中心指数研究室主任刘江说，1～4月快递业务量完成170.7亿件，同比增长\u003cimg data-k=\"a990c4f3eaa8\">，是同期服务业生产指数增速的3倍多，增速在现代服务业处于领先地位。更可喜的是，快递行业不仅长“块头”，“肌肉”也跟着长，行业发展质量不断提高。1～4月份，全国快递服务企业业务收入累计完成2135.4亿元，同比增长\u003cimg data-k=\"dccda39d9d0e\">；行业日均快件处理量达1.6亿件，最高达1.8亿件，单月快递业务量已接近50亿件数量级。\n下列选项适合做文章标题的是（  ）。","options":{"A":"快递行业，跑出加速度","B":"农村快递增长迅猛","C":"快递应补齐短板","D":"快递高位运行"},"answer":"D","explanation":"这是一道标题填入题，其实也是需要把握文段中心的。文段前半部分指出快递业务发展势头比较好，处于现代服务的领先地位，接着又指出快递行业不仅长“块头”，还长“肌肉”，也就是说行业发展的质量也不断提高，后面举出数据具体解释说明，故文段强调的是快递行业发展速度和质量水平都不断提高，对应到D项，“高位运行”将高速度和高质量包括在内。\nA项，“跑出加速度”只强调速度快，而没指出质量高，片面，排除；\nB项，“农村”无中生有，排除；\nC项，“应补齐短板”无中生有，排除；\n故正确答案为D。\n【文段出处】《国家邮政局发展研究中心指数研究室主任刘江接受人民日报采访》","no":46,"missingImage":false},{"type":"question","qid":"2393957","cat":"语句表达","stem":"①五四运动是彻底反帝反封建的伟大爱国革命运动。\n②深刻认识五四运动是一场伟大爱国革命运动，始终高举爱国主义伟大旗帜。\n③五四运动倡导的爱国，就是要争取民族独立、维护国家主权和领土完整、反对帝国主义奴役和封建军阀的卖国行径，为中华民族的爱国主义注入了新的内涵。\n④五四精神的主要内容是爱国、进步、民主、科学，而其核心是爱国主义精神。\n⑤爱国主义是一种既质朴又深沉的情感，是实现中华民族伟大复兴的精神动力，无论何时我们都要厚植爱国主义情怀、高举爱国主义伟大旗帜。\n将上面的句子组成语意连贯的一段话，排列正确的一项是（  ）。","options":{"A":"①②④③⑤","B":"②①④③⑤","C":"④③①⑤②","D":"⑤②①④③"},"answer":"B","explanation":"对比选项，判断首句，①句和②句均提出“五四运动”话题，可以作首句；④句分析五四运动的具体精神，⑤句分析五四精神中的爱国精神，均是具体展开说明的句子，不适合作为首句，排除C、D两项。\n对比A、B两项，重点辨析①②两句的先后顺序，②句先提出五四运动是爱国革命运动这一观点，①句对此观点进行具体解释说明，故顺序为②①，对应B项。\n故正确答案为B。\n【文段出处】《坚定实现民族复兴的志向和信心》宣讲家网","no":47,"missingImage":false},{"type":"question","qid":"2393962","cat":"片段阅读","stem":"下列空缺处句子排列最恰当的一项是（  ）。\n无论是读者还是作者，我们在接触文字时，常常由我们的个性、人生经历、生长环境这三个因素来决定我们的审美趣味。      ，      ，      。      ，      ，      。这三点功夫就是我们常说的学问修养，而纯正的趣味必定是学问修养的结果。\n①它们的影响有好有坏\n②我们应该根据固有的个性而加以磨砺陶冶\n③不易也不必完全摆脱\n④这三点都是很自然地套在一个人身上的\n⑤接收多方的传统习尚而融会贯通\n⑥扩充身世经历而加以细心体验","options":{"A":"②⑤⑥④①③","B":"②⑥⑤④③①","C":"④①③②⑥⑤","D":"④③①②⑤⑥"},"answer":"C","explanation":"对比选项，判断首句，根据指代词形成捆绑，④中“这三点”指代前文的“这三个环境因素”，故④做首句，排除A、B两项。\n对比C、D两项，重点分析②⑥⑤三句的排列顺序，②⑥⑤中的“个性”、“身世经历”、“传统习尚”分别依次对应第一句的“个性、人生经历、生长环境这三个因素”，对应C项。\n故正确答案为C。\n【文段出处】《文学的趣味》朱光潜","no":48,"missingImage":false},{"type":"question","qid":"2393966","cat":"语句表达","stem":"下列空缺处句子排列最恰当的一项是（  ）。\n在中国传统文化中，道家的老子与庄子常常两位一体；儒家的孔子与孟子也是形影相随的，      。\n①既有《论语》，则有《孟子》\n②孔子曰“成仁”，孟子曰“取义”，他们的宗旨也相配合\n③冯友兰先生既把孔子比作苏格拉底，又把孟子比作柏拉图\n④既有大圣，则有亚圣\n⑤司马迁说：“孟子序诗书，述仲尼之意。”","options":{"A":"④②①③⑤","B":"④①②⑤③","C":"①④②③⑤","D":"①②④⑤③"},"answer":"B","explanation":"观察选项，①和④都是“既有……则有……”的句式，两句句式一致，故①④或者④①应紧密相连，排除A、D两项。\n对比B、C 两项，区别在于①④的先后顺序，横线前语句提及了孔子、孟子二位人物，④中的“大圣”、“亚圣”分别是孔子及孟子的称号，①句中的《论语》、《孟子》则是他们的作品，按照逻辑顺序，应该先提出人物，再分析其代表作品，故顺序为④①，对应B项。\n故正确答案为B。\n【文段出处】《孔 孟》黄仁宇","no":49,"missingImage":false},{"type":"question","qid":"2393968","cat":"语句表达","stem":"①右手下坡去十来步，就是一条小溪，水却不深\n②踏着溪中的几块垫脚石过了溪，路旁有茅棚，住着一两家老百姓\n③小屋前门有一条小路，曲折向外，在松林中行数百米，便豁然开朗\n④还有很多美丽的骨牌草，有的还是很青翠，有的已经枯黄\n⑤左手上坡是一条较为正式的路，隔路又是一片松林，坡头长满了半人高的茅草\n将上面的句子组成语意连贯的一段话，排列正确的一项是（  ）。","options":{"A":"②①④③⑤","B":"③④①⑤②","C":"②⑤①④③","D":"③⑤④①②"},"answer":"D","explanation":"首先观察选项,确定首句，②句描绘了踏过小溪后的景象，③句介绍了小屋周边的环境，不易判断首句。接着观察句子可知，①句“右手下坡去十来步，就是一条小溪”，②句“踏着溪中的几块垫脚石过了溪”可通过“小溪”这一共同信息捆绑，且应先介绍“小溪”再“过溪”，故①②捆绑，锁定D项。D项中③句出现了“松林”，与⑤句“又是一片松林”同样也可通过“松林”这一共同信息捆绑，当选。\n故正确答案为D。\n【文段出处】高中语文试题","no":50,"missingImage":false},{"type":"question","qid":"2393971","cat":"语句表达","stem":"依次填入下面一段文字横线处的语句，衔接最恰当的一组是（  ）。\n在中国古代有四大发明，但也有人说，中国的珠算也当是一大发明。为什么呢？中国珠算以算盘为工具进行数字计算，借助算盘和口诀，通过人手指拨动算珠，就可以完成高难度的计算。      ，      ，      ，      ，      ，      。2013年12月4日，中国珠算被正式列入联合国教科文组织的人类非物质文化遗产名录。\n①即使是不识字的人也能熟练掌握\n②珠算算盘结构简单\n③蕴含了坐标几何原理\n④包含了珠算的所有秘密\n⑤珠算口诀则是一套完整的韵味诗歌\n⑥用珠算运算，无论速度还是准确率都可以跟电子计算器媲美","options":{"A":"②④⑤③⑥①","B":"②③⑤④①⑥","C":"⑥①②⑤④③","D":"⑥②④⑤③①"},"answer":"B","explanation":"本题属于语句填空与语句排序的组合题型，需将句子依次排列后放于文段当中，同时需要注意与前后文的衔接。\n横线前出现“算盘和口诀”的表述，故后文应先介绍算盘，再论述口诀，观察选项发现②句“算盘结构”，③句“坐标几何原理”均介绍“算盘”的结构，⑤句则是论述“珠算口诀”，故②③句应在⑤句之前，锁定B项。\n验证B项，②③句均介绍算盘，⑤④句均论述珠算口诀，最后通过①⑥总结珠算的好处，并以此引出下文，逻辑通顺，当选。\n故正确答案为B。\n【文段出处】高中语文试题","no":51,"missingImage":false},{"type":"question","qid":"2393972","cat":"语句表达","stem":"下列空缺处的句子衔接最恰当的一项是（  ）。\n她登上山崖之巅，纵目四望，时值深秋，崖角的菊花      。","options":{"A":"十分秀丽，光洁鲜亮。竞相开放，争奇斗艳，花蕊嫩黄，花瓣层层叠叠","B":"竞相开放，争奇斗艳。花蕊嫩黄，花瓣层层叠叠，光洁鲜亮，十分秀丽","C":"光洁鲜亮，十分秀丽。花蕊嫩黄，花瓣层层叠叠，竞相开放，争奇斗艳","D":"花瓣层层叠叠，竞相开放。花蕊嫩黄，光洁鲜亮，争奇斗艳，十分秀丽"},"answer":"B","explanation":"横线出现在文段结尾，且为尾句中的一个分句，需与尾句话题保持一致。横线之前出现“菊花”，选项均是在介绍菊花的相关话题，内容相同，仅语序有变化，故在选择时需考虑选项的逻辑顺序。\n观察选项发现，“竞相开放，争奇斗艳”是对菊花的整体开放进行描述，“花蕊嫩黄”“花瓣层层叠叠”是对菊花的组成部分分别进行描述，“光洁鲜亮，十分秀丽”是对菊花的评价。按照逻辑顺序，应先整体阐述“菊花的开放”，再具体描述“菊花的组成部分”，最后对菊花进行评价。对应B项。\nA项，将“光洁鲜亮，十分秀丽”的评价置于“开放”前，逻辑混乱，排除；\nC项，将“开放”置于最后，逻辑混乱，排除；\nD项，将“开放”置于“花瓣”后，逻辑混乱，排除。\n故正确答案为B。\n【文段出处】《小村池塘》","no":52,"missingImage":false},{"type":"question","qid":"2393990","cat":"语句表达","stem":"空缺处的句子衔接最恰当的一项是（  ）。\n若要谈论中国的散文，有人非常认可朱自清，有人则赞赏宗白华，有人则喜欢余秋雨，但是我却更爱余光中，   ①  ，徐疾多致的节奏代替了平铺直叙的语序，   ②  ，幽默风趣的妙语代替了装腔作势的教训。","options":{"A":"①簇新的意象代替了被嚼烂的少女和梦的俗喻②澎澎湃湃的谈吐代替了矫揉造作的伪情滥调","B":"①被嚼烂的少女和梦的俗喻被簇新的意象代替了②矫揉造作的伪情滥调被澎澎湃湃的谈吐代替了","C":"①簇新的意象代替了矫揉造作的伪情滥调②澎澎湃湃的谈吐代替了被嚼烂的少女和梦的俗喻","D":"①被嚼烂的少女和梦的俗喻被澎澎湃湃的谈吐代替了②矫揉造作的伪情滥调被簇新的意象代替了"},"answer":"A","explanation":"观察已知题干，前后句式相同，构成并列关系，横线处所填语句应为“……代替了……”的句式，而B、D两项中，句式为“被……代替了”，均排除。\n分析句子内容，“徐疾多致的节奏代替了平铺直叙的语序”中，“徐疾多致”意为快慢有次序， “平铺直叙”意为没有起伏，重点不突出，两者语义相反。故横线处①句前后也应构成语义相反的关系；“幽默风趣的妙语代替了装腔作势的教训”中，“幽默风趣的妙语”和“装腔作势的教训”都与言论有关，分句中前后话题一致，故横线处②句所填句子前后话题也应保持一致。\nA项，①句，“被嚼烂的”“俗喻”意为陈旧，与“簇新”构成语义相反。第②句“澎澎湃湃的谈吐”和 “矫揉造作的伪情滥调”均与言论有关，前后话题一致，当选。\nC项，①句，“簇新”和“矫揉造作”无法构成语义相反，②句，“澎澎湃湃的谈吐”和“被嚼烂的少女和梦的俗喻”话题不一致，排除。\n故正确答案为A。\n【文段出处】《余光中的散文艺术世界》","no":53,"missingImage":false},{"type":"question","qid":"2393974","cat":"语句表达","stem":"依次填写在甲乙丙三处横线上的句子，最恰当的一项是（  ）。\n上个世纪八十年代初，我刚刚参加工作，   甲  后来回想起来，自己也常常惊讶于那时候的大胆：   乙  却居然敢放言高论，   丙  \n甲：①我为了赶任务开始写一篇关于文学的论文，②我开始写一篇关于文学的论文，为了赶任务，\n乙：①对于本国的古典文学缺乏系统研究，对于欧洲文学所知有限，而政治思想水平也很低的那时的我，②我那时对于本国的古典文学缺乏系统研究，对于欧洲文学所知有限，而政治思想水平也很低，\n丙：①真是大胆的事。②岂非大胆？","options":{"A":"甲①乙①丙②","B":"甲①乙②丙②","C":"甲②乙①丙①","D":"甲②乙①丙②"},"answer":"D","explanation":"甲横线处，分析选项句子，①句为正常语序，陈述客观情况；②句为倒装句，突出强调“赶任务”这一目的。又依据后文可知，作者当时的行为比较大胆，“赶任务”意为时间紧任务重，即作者要在短时间内将论文完成，能体现“大胆”。句式中，将“赶任务”这一事件经倒装语序突出强调后，与文意更吻合，故甲选择第②句，排除A、B两项。\n乙横线处，C、D两项均为第①句，不需辨析。\n丙横线处，由“：”可知，横线后的句子对横线前的“大胆”进行解释说明。①句为陈述句，语气平淡；②句为反问句，语气强烈，通过反问句的句式更加凸显出“赶任务写文学论文”这一事件的不可思议性和大胆程度，故②句更符合文意，对应D项。\n故正确答案为D。\n【文段出处】高考语文题","no":54,"missingImage":false},{"type":"question","qid":"2393993","cat":"语句表达","stem":"下列各项中最适合填在横线上的一项是（  ）。\n人们常常生活在实际生活中，而文人和哲人则常常生活在想象世界里。我们生活中的一点一滴，或喜或悲，在文人笔下成为悲欢离合的故事，而在哲人眼里，则是一篇篇的哲学故事。其中，一位哲人对乐观与悲观这样解释：譬如面对着桌子上的半杯水，乐观主义者说这个杯子的一半是满的，悲观主义者说这个杯子一半是空的，显然，      ，使我们在任何时候任何条件下都不会失去信心和追求。一旦遇到困难，我们黯淡的心情也能够很快豁然开朗，从种种苦恼中自我解脱。","options":{"A":"这两种理解有其合理性也有一些片面性","B":"乐观主义者比悲观主义者更有利于人类进步","C":"人与人的观察角度和思维方式是不同的","D":"观察事物时善于选择生活中积极的一面"},"answer":"D","explanation":"横线前列举了乐观的人和悲观的人看待半杯水的不同角度和见解，横线后提到“不会失去信心和追求”，只有乐观的心态才会有这样的效果，故横线上所填的内容应该与乐观积极的心态有关，对应D项。\nA、C两项未提及“积极心态”，与后文无法衔接，均排除；\nB项，“人类进步”无中生有，且后文未涉及对于“乐观和悲观”比较之后结果的评价与讨论，该项与后文无法衔接，排除。 \n故正确答案为D。","no":55,"missingImage":false}],"count":35,"answerable":35,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2394004","cat":"数学运算","stem":"实验室有A、B、C三个实验试管，分别装有10克、15克、20克的水，小明把含有一定浓度的10克药水倒进A试管中，混合后取出10克倒入B试管中，再次混合后，从B试管中取出10克倒入C试管中，最后用化学仪器检测出C试管中药水浓度为\u003cimg data-k=\"c3a6569e152c\">。试计算刚开始倒入A试管中药水的浓度是多少？","options":{"A":"\u003cimg data-k=\"fc324c3b9ecb\">","B":"\u003cimg data-k=\"798f1f286d1f\">","C":"\u003cimg data-k=\"a1f51a060389\">","D":"\u003cimg data-k=\"2c6adc1698b0\">"},"answer":"C","explanation":"设最初倒入A试管中药水的浓度为\u003cimg data-k=\"7927fa366b6c\">，则：\nA混合后取出10克的浓度为\u003cimg data-k=\"96c835d9bc3c\">；\nB混合后取出10克浓度为\u003cimg data-k=\"12c5d89af7e2\">；\nC混合后浓度为\u003cimg data-k=\"70d739c201b1\">，解得\u003cimg data-k=\"7ec6f1226a97\">。\n所以最初倒入A试管中药水的浓度为\u003cimg data-k=\"a1f51a060389\">。\n故正确答案为C。","no":56,"missingImage":false},{"type":"question","qid":"2394006","cat":"数学运算","stem":"正值毕业季，306宿舍有A、B、C、D四位男同学，他们准备找班主任宋老师合影，若要求宋老师坐正中间，A、B两位同学不能挨着坐，那么总共有多少种坐法？","options":{"A":"8种","B":"12种","C":"16种","D":"24种"},"answer":"C","explanation":"方法一：根据题意，包括老师一共5人，要求老师在中间，则老师左边和右边各两个人。考虑A、B不相邻，则A、B分别在老师左右两边， C、D也分别在老师的左右两边。先安排A、B，在老师左边两个空中挑一个\u003cimg data-k=\"1f1c113b3f0c\"> ，在右边两个空中挑一个\u003cimg data-k=\"1f1c113b3f0c\"> ，考虑A、B顺序\u003cimg data-k=\"dcb378dfdcab\">，剩下两个空放C、D，考虑顺序\u003cimg data-k=\"dcb378dfdcab\">，所以共有\u003cimg data-k=\"9ce3d187d338\">\u003cimg data-k=\"d3c04dbcfd43\">\u003cimg data-k=\"59b4d959c8d0\">种。\n方法二：本题正面情况较为复杂考虑从反面出发进行求解。总情况老师在中间其余四人共
