003c/u>。\n\u003cimg data-k=\"febca1725ba2\" style=\"max-width:552px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"观察题干图形，每幅图形均为九宫格，且存在黑色区域。观察发现，第一组图中，每幅图形中的黑色区域均占3个格子；第二组图中，前两幅图黑色区域均占6个格子，故？处图形黑色区域应占6个格子，只有C项符合。\n故正确答案为C。","no":107,"missingImage":false},{"type":"question","qid":"2295523","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"18de29832da5\" style=\"max-width:462px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相似，优先考虑样式规律。九宫格优先横向看，发现第一行图形中第二个图形由第一个图形左右翻转后，叠加到第一个图形左边所得，第三个图形由第一个图形旋转180°后，叠加到第一个图形右边所得。验证第二行图形，符合此规律。因此，第三行图形应用此规律，？处的图形应由第一个图形旋转180°后，叠加到第一个图形右边，只有C项满足要求。\n故正确答案为C。","no":108,"missingImage":false},{"type":"question","qid":"2295525","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"d810407594d8\" style=\"max-width:538px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"每一幅图形均由直线、黑圆和白圆组成，考虑三种元素之间的关系，在第一组图形中每一条线上均有2个黑圆，一个白圆，且两个黑圆之间均有一个白圆，第二组应符合此规律，前两幅图形中均有两个黑圆与一个白圆连接，且两个黑圆中间没有白圆间隔，观察选项只有D项符合要求。\n故正确答案为D。","no":109,"missingImage":false},{"type":"question","qid":"2295528","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"1f8f4f5138ad\" style=\"max-width:536px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相同，优先考虑位置规律。观察发现黑圆均在内圈移动，白圆均在外圈移动，考虑内外圈分开看，首先观察内圈，发现黑圆每次逆时针移动1格，因此？处图形中内圈左下角应为空白格，排除B、D选项。继续观察外圈，发现白圆每次顺时针移动3格，因此？处外圈左上角应有一个白圆，排除A选项。\n故正确答案为C。","no":110,"missingImage":false},{"type":"question","qid":"2295531","cat":"图形推理","stem":"下列选项中，与所给图形规律相同的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"4d1b3a8b7b9e\" style=\"max-width:399px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"黑块数量不一致，元素组成相似，优先考虑样式规律，但黑白运算无规律。继续观察发现，题干中白色方块全部都连在一起，即白色方块均为一部分。A项白色方块为一部分，B项为三部分，C项为三部分，D项为两部分，只有A项符合。\n故正确答案为A。","no":111,"missingImage":false},{"type":"question","qid":"2295533","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"bbceff822ec6\" style=\"max-width:230px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成相似，优先考虑样式规律。观察发现，每个图形均可分为上、中、下三部分。第一横行中，上面部分出现左边三角形、右边三角形、大三角形，中间部分出现朝左半圆、朝右半圆、整圆，下面部分出现空白圆、内含一条竖线、两条竖线的圆；经验证，第二横行满足此规律；故第三横行应用此规律，？处应上面部分应为大三角形、中间部分为朝右半圆、下面部分为一条竖线的圆，只有D项符合。\n故正确答案为D。","no":112,"missingImage":false},{"type":"question","qid":"2295535","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"75bcf8212c4f\" style=\"max-width:397px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"解法一：元素组成不同，优先考虑属性规律。图形整体比较规整，优先考虑对称性。观察可知，题干图形对称轴的数量依次为4、3、2、？、0，故问号处应填入有1条对称轴的轴对称图形，只有C项符合。\n故正确答案为C。\n解法二：观察发现题干图形出现了单一曲线和圆，考虑数曲线。题干曲线数量分别是1、3、5、？、1。故根据数字对称的规律，问号处应选择有3条曲线的图形，只有B项符合。\n故正确答案为B。\n注：本题有两种解法，出题不严谨，但粉笔倾向于解法一。因为数字对称的规律近几年公考题目中几乎没有出现，说明不是命题人想考查的方向，而对称轴的数量却呈现了依次递减的规律，这比数字对称的规律更加严谨、更加符合最新的出题趋势。","no":113,"missingImage":false},{"type":"question","qid":"2295543","cat":"图形推理","stem":"下列选项中，能组合成一个\u003cimg data-k=\"42fd443ca3a4\">立方体方块的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"b16794bd4a9f\" style=\"max-width:559px\">","options":{"A":"1、2、3","B":"2、3、4","C":"1、3、4","D":"2、3、5"},"answer":"C","explanation":"题干要求组成\u003cimg data-k=\"27d14461aacd\">立方体方块，故小方块总数应该是27块。图1是9块，图2是7块，图3是12块，图4是6块，图5是8块，排除A、B两项；剩余C、D两项，都有图3，立方体每层有9块，图3已满足一层是9块，另一层有3块，故另外两图应满足某一层相加有6块。图2和图5均无法满足某一层相加有6块，而图1上层与图4下层相加为6块，即图1、3、4可组合成\u003cimg data-k=\"27d14461aacd\">立方体方块（如下图所示）。\n\u003cimg data-k=\"c077379791e1\" style=\"max-width:423px\">\n\u003cimg data-k=\"5a91af31b1f8\" style=\"max-width:196px\">\n故正确答案为C。","no":114,"missingImage":false},{"type":"question","qid":"2295570","cat":"图形推理","stem":"右边选项中，不能由展开图折叠而成的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"79b37793de5c\" style=\"max-width:480px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"将题干展开图标号如下图：\n\u003cimg data-k=\"d475a33ed9bb\" style=\"max-width:472px\">\nA项：由面c和面d组成，选项与题干一致，排除；\nB项：由面b和面c组成，选项与题干一致，排除；\nC项：由面b和面d组成，选项与题干一致，排除；\nD项：如上图，题干中面b和面c中竖线交于黄色公共点，选项和题干不一致，故该项不是面b和面c；题干中面c和面d中竖线交于绿色公共点，选项和题干不一致，故该项不是面c和面d；所以该项只能是面b和面d。由于四面体中，构成直线的是同一条边，所以题干中标蓝色的为同一条边。又因为题干面b中竖线交于蓝色公共边，而选项中右侧面有竖线交于公共边，所以选项右侧面为面b，而左侧面为面d。\n\u003cimg data-k=\"648f9671d404\" style=\"max-width:546px\">\n对面d进行画边，如上图所示，题干中边3对应的是面b，选项中边1对应的是面b，选项与题干不一致，当选。\n本题为选非题，故正确答案为D。","no":115,"missingImage":false},{"type":"question","qid":"2295572","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"24cbb9e47193\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"观察发现，第一组图中，将所有位置的小黑三角形拼在一起，可以得到一个完整的黑色正方形；第二组图应用规律，故？处应左下角区域有一个小黑三角形，只有D项符合。\n故正确答案为D。","no":116,"missingImage":false},{"type":"question","qid":"2295274","cat":"逻辑判断","stem":"小王和小李现在是经济系二年级的学生。在根据一年级的课程总成绩来评定奖学金时，已知他们两人的经济学原理成绩相同，而英语、高等数学等其他六门课的成绩则互有高低。最终小王获得了奖学金。\n下列      项如果为真，能够判断出小王的总成绩比小李的要高。","options":{"A":"小王的最高分比小李的最高分要高","B":"小王的最低分是高等数学，而小李的最低分是英语","C":"小王的最低分比小李的平均成绩要高","D":"小王的最低分比小李的最低分要高出许多"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：小王的总成绩比小李的要高。\n论据：根据一年级的课程总成绩来评定奖学金时，已知他们两人的经济学原理成绩相同，而英语、高等数学等其他六门课的成绩则互有高低。\n第二步：逐一分析选项。\nA项：该项只是对最高分进行了比较，而最高分不能决定六门课总成绩，排除；\nB项：该项只是对最低分进行了说明，而最低分不能决定六门课总成绩，排除；\nC项：小王的最低分比小李的平均分高，那么小王的平均分一定比小李的高，即小王的总成绩更高，可以得出结论，当选；\nD项：该项只是对最低分进行了比较，而最低分不能决定六门课总成绩，排除。\n故正确答案为C。","no":117,"missingImage":false},{"type":"question","qid":"2295276","cat":"逻辑判断","stem":"对所有的静脉血标本进行检测，没有发现阳性HIV抗体。\n如果上述断定为假，则下列      项一定为真。","options":{"A":"要发现阳性HIV抗体，必须对所有静脉血标本进行检测","B":"对所有静脉血标本进行检测，未必能发现阳性HIV抗体","C":"部分静脉血标本尚未进行检测，或者已经发现了阳性HIV抗体","D":"部分静脉血标本尚未进行检测，但是已经发现了阳性HIV抗体"},"answer":"C","explanation":"第一步：分析题干条件。\n对所有静脉血标本检测 且 \u003cimg data-k=\"0be436194951\">发现现阳性HIV抗体。\n已知题干为假，那么其矛盾命题：\u003cimg data-k=\"0be436194951\">（对所有静脉血标本检测 且 \u003cimg data-k=\"0be436194951\">发现了阳性HIV抗体）一定为真，即：有的静脉血标本没有检测 或 发现了阳性HIV抗体。\n第二步：逐一分析选项。\nA项：翻译为发现阳性HIV抗体\u003cimg data-k=\"2dfb7d1f72f3\">所有静脉血标本检测，是对题干矛盾命题“或”关系的肯定，无法得出确定性结论，排除；\nB项：翻译为对所有静脉血标本检测\u003cimg data-k=\"2dfb7d1f72f3\">未必发现阳性HIV抗体，是对题干矛盾命题“或”关系的否定，根据“否一推一”可知，一定发现了阳性HIV抗体，与题干不一致，排除；\nC项：翻译为有的静脉血标本没有检测 或 发现了阳性HIV抗体，与题干的矛盾命题一致，一定为真，当选；\nD项：翻译为有的静脉血标本没有检测 且 发现了阳性HIV抗体，题干矛盾命题为“或”关系而不是“且”关系，排除。\n故正确答案为C。","no":118,"missingImage":false},{"type":"question","qid":"2295277","cat":"逻辑判断","stem":"研究人员通过对某国500名儿童进行跟踪研究发现，人类大脑成长最快的时期是在出生后三个月内，大脑的尺寸可以达到成人的一半以上。\n下列      项的答案最能评价上述结论的正确性。","options":{"A":"500名儿童中有没有人的大脑是在出生三个月后才快速生长的？","B":"有没有对其他国家的儿童进行跟踪研究？","C":"儿童的大脑功能和成人是不是一样？","D":"男童和女童的大脑成长速度是否一样？"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：人类大脑成长最快的时期是在出生后三个月内，大脑的尺寸可以达到成人的一半以上。\n论据：研究人员对某国500名儿童进行跟踪研究。\n第二步：逐一分析选项。\nA项：如果仅有个别儿童的大脑是在出生三个月后才快速生长的，不会对实验的结论造成影响，因此不能评价上述结论的正确性，排除；\nB项：该项说明仅对一个国家儿童进行了研究不具有代表性，也应对其他国家儿童进行研究才能确保结论的正确性，因此可以对题干的结论做出评价，当选；  \nC项：该项讨论的是儿童和成人的大脑功能，与题干讨论的大脑成长速度无关，是无关项，因此不能评价上述结论的正确性，排除；\nD项：该项讨论的是男童和女童的大脑成长速度是否一样，与题干讨论的人类大脑成长最快的时期无关，是无关项，因此不能评价上述结论的正确性，排除。\n故正确答案为B。","no":119,"missingImage":false},{"type":"question","qid":"2295280","cat":"逻辑判断","stem":"当今社会，二维码支付方式在餐饮门店、超市、便利店等线下小额支付场景中得到了广泛的应用。但在条码生成机制和传输过程中仍存在风险隐患，也引发了不少涉及支付安全风险的案件。\n下列      项能够对题干中的结论起到解释的作用。","options":{"A":"静态条码容易被篡改或变造，容易携带木马或病毒","B":"线下扫码支付为用户带来了便捷的消费体验","C":"商家利用线下扫码支付可以帮助自身提高经营收益","D":"采用先进的令牌技术进行变异处理后，可以保护真实卡号信息"},"answer":"A","explanation":"第一步：找出题干结论。\n “在条码生成机制和传输过程中仍存在风险隐患，引发了不少涉及支付安全风险的案件。”\n第二步：逐一分析选项。\nA项：该项解释了二维码支付隐患是由于静态条码容易被篡改或变造，容易携带木马或病毒，可以解释题干结论，当选；\nB项：该项讨论的是线下扫码支付为用户带来了便捷的消费体验，题干讨论的是二维码支付会带来安全隐患，讨论话题不一致，不能解释题干结论，排除；\nC项：该项讨论的是商家利用线下扫码支付可以帮助自身提高经营收益，题干讨论的是二维码支付会带来安全隐患，讨论话题不一致，不能解释题干结论，排除；\nD项：该项讨论的是提高移动支付安全性的方法，不能解释为什么存在风险隐患，不能解释题干结论，排除。\n故正确答案为A。","no":120,"missingImage":false},{"type":"question","qid":"2295282","cat":"逻辑判断","stem":"爱因斯坦对人类最大的贡献就是相对论的提出，它是人类研究宇宙强有力的工具。爱因斯坦通过相对论进行过宇宙质量的计算，结果发现宇宙的质量总和竟然为零。爱因斯坦认为，宇宙在大爆炸后产生的物质有正反两种形式，反物质和正物质完全相反，而且正、反物质质量相等。但科学家在宇宙中只发现了很小量的反物质，那大部分的反物质去哪里了？如果它们不存在于宇宙中，爱因斯坦通过相对论的计算也不会发现宇宙质量总和为零。但是宇宙的质量为零，这说明反物质应该还是存在于宇宙当中。\n下列      项是以上论述所假设的前提。","options":{"A":"只存在一个宇宙","B":"爱因斯坦通过相对论的计算是正确的","C":"人类如果不能利用反物质的巨大能量，就不能进行星际探索","D":"科学家在实验室中发现了反物质，而且现在也可以在实验室制造一部分反物质"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：大部分的反物质应该还是存在于宇宙当中。\n论据：爱因斯坦通过相对论进行过宇宙质量的计算，结果发现宇宙的质量总和竟然为零。爱因斯坦认为，宇宙在大爆炸后产生的物质有正反两种形式，反物质和正物质完全相反，而且正、反物质质量相等。但科学家在宇宙中只发现了很小量的反物质。\n第二步：逐一分析选项。\nA项：该项说的是宇宙的数量，与论点说的大部分的反物质是否存在于宇宙中无关，是无关项，排除；\nB项：只有爱因斯坦相对论的计算是正确的，才能通过宇宙的质量总和为零，得知反物质应大量存在，是结论成立的必要条件，当选；\nC项：该项说的是反物质能力的作用与应用，与论点说的大部分的反物质是否存在于宇宙中无关，是无关项，排除；\nD项：科学家可以在实验室发现、制造出反物质，说明反物质是存在的，但无法证明宇宙中是否存在大部分的反物质，无法加强，排除。\n故正确答案为B。","no":121,"missingImage":false},{"type":"question","qid":"2295284","cat":"逻辑判断","stem":"人们向火星发射了诸多探测器，以期探寻火星是否存在生命。在探测区域发现火星表面是含大量硫酸盐的酸性土壤，这预示着火星上存在火山活动。另外探测数据表明火星土样还显示出高氯酸盐的迹象，高氯酸盐是一种可担当火星微生物的能量源的化合物；同时在火星表面还发现一个奇怪迹象——还原铁，该迹象表明火星表面曾存在生命。\n下列      项如果为真，最能质疑以上论述。","options":{"A":"在地球上，还原铁一般是通过微生物形成的","B":"火山爆发喷发出硫，硫燃烧生成二氧化硫，二氧化硫遇水形成亚硫酸，亚硫酸氧化成硫酸，硫酸和金属反应，生成硫酸盐","C":"探索发现，在火星表面不存在液态水","D":"行星上的铁和撞击它的彗星所携带的有机碳发生化学反应可产生还原铁"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：火星表面曾存在生命。\n论据：探测器发现火星表面是含大量硫酸盐的酸性土壤，火星土样还显示出高氯酸盐的迹象，而高氯酸盐是一种可担当火星微生物的能量源的化合物，同时在火星表面还发现了还原铁。\n论点讨论的是“火星”和“生命”的关系，论据讨论的是“火星”和“硫酸盐”、“高氯酸盐”、“还原铁”的关系，论点论据话题不一致，削弱优先考虑拆桥，即拆断“硫酸盐”、“高氯酸盐”、“还原铁”和“生命”之间的联系。\n第二步：逐一分析选项。\nA项：选项指出地球上的还原铁和生命有关系，而题干是通过还原铁证明火星上有生命，无法削弱，排除；\nB项：火山爆发喷发出硫，通过一系列反应生成硫酸盐，说明硫酸盐确实与火山活动之间有联系，是加强项，无法削弱，排除；\nC项：火星表面不存在液态水，题干未提及液态水，是无关项，无法削弱，排除；\nD项：行星上的铁和撞击它的彗星所携带的有机碳发生化学反应可产生还原铁，说明还原铁的出现与存在生命之间不一定存在必然联系，是拆桥项，可以削弱，当选。\n故正确答案为D。","no":122,"missingImage":false},{"type":"question","qid":"2295285","cat":"逻辑判断","stem":"工厂对技术工人的学历情况进行了调查，发现过去五年间新进厂的技术工人学历层次有大幅度提高。因此，工厂技术工人的素质整体有较大提升。\n如果上述情况属实，下列      项无法对结论起到支持。","options":{"A":"过去五年间的新进厂的技术工人现在仍在工厂上班","B":"素质高的技术工人生产的产品较少出现不合格的情况","C":"学历越高的人，素质也越高","D":"学历高的人会带动其他同事提高素质"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：工厂技术工人的素质整体有较大提升。\n论据：过去五年间新进厂的技术工人学历层次有大幅度提高。\n本题的论点是说工厂技术工人的素质有提高，而论据说的是近5年间新进厂技术工人的学历有提高，论点关键词是“技术工人的素质”，论据关键词是“技术工人的学历”，论点与论据话题不一致，因此这道题既可以考查加强论点与论据之间的关系，又可以考查补充新的论据。\n第二步：逐一分析选项。\nA项：题干论据表明过去五年新进厂的技术工人学历有大幅提高，而选项又补充了现在这些新技术工人仍然在工厂上班，这就补充了新论据，说明现在工厂技术工人的学历仍然是高的，可以加强论据，排除；\nB项：技术工人素质高使得产品较少出现不合格的情况，与题干论点现有工人素质是否提升无关，属于无关选项，无法加强，当选；\nC项：选项将论据中的“技术工人的学历高”与论点中的“技术工人的素质高”建立联系，属于搭桥，可以加强，排除； \nD项：选项可以说明随着近5年间学历高的技术工人来到工厂，他们会带动身边其他同事整体素质会提升，进而使得整个工厂技术工人的素质提高，在论据与论点之间建立联系，属于搭桥，可以加强，排除。\n本题为选非题，故正确答案为B。","no":123,"missingImage":false},{"type":"question","qid":"2295290","cat":"逻辑判断","stem":"研究人员研究了来自110万人的DNA，得出了一个评分系统。利用该系统可以通过检测某人的DNA来大致预测某人的受教育程度。结果发现，那些基因得分最低的人只有\u003cimg data-k=\"fc324c3b9ecb\">的机会从大学毕业；相比之下，那些基因得分在前五分之一的人，有\u003cimg data-k=\"e172e0ad0a10\">的机会从大学毕业。这是有史以来最大规模的人类认知遗传学研究。有些人据此以为，人类的基因与学历之间有极大联系。\n下列\u003cu>      \u003c/u>项如果为真，最能质疑这些人的观点。","options":{"A":"在110万被研究者中，抽样显示，只有不到\u003cimg data-k=\"a1f51a060389\">的人是大学毕业的","B":"在大学毕业的被研究者中，其父母之一是大学毕业的超过\u003cimg data-k=\"e172e0ad0a10\">","C":"在110万被研究者中，有超过\u003cimg data-k=\"1a67739c8245\">的人是大学毕业的","D":"基因得分最居中的人，也有\u003cimg data-k=\"2c6adc1698b0\">的机会从大学毕业"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：人类的基因与学历之间有极大联系。\n论据：基因得分最低的人只有\u003cimg data-k=\"fc324c3b9ecb\">的机会从大学毕业；基因得分在前五分之一的人，有\u003cimg data-k=\"e172e0ad0a10\">的机会从大学毕业。\n第二步：逐一分析选项。\nA项：110万被研究者中只有不到\u003cimg data-k=\"a1f51a060389\">的人是大学毕业的，此时前五分之一确实高于平均水平，得分最低的确实低于平均水平，补充论据支持题干论点，可以加强，排除；\nB项：被研究者们的父母与该研究无关，属于无关选项，不能削弱，排除；\nC项：110万被研究者中有超过\u003cimg data-k=\"1a67739c8245\">的人是大学毕业的，说明所选的研究样本中，绝大部分人都有高学历，否定了题干论点基因得分在前五分之一的人，有\u003cimg data-k=\"e172e0ad0a10\">的机会从大学毕业，削弱了题干观点，可以削弱，当选；\nD项：基因得分最居中的人也有\u003cimg data-k=\"2c6adc1698b0\">的机会从大学毕业的，此时前五分之一确实高于居中水平，得分最低的确实低于居中水平，说明基因与学历有关系，补充论据支持题干论点，可以加强，排除。\n故正确答案为C。","no":124,"missingImage":false},{"type":"question","qid":"2295291","cat":"类比推理","stem":"某科技企业新选举出7名工会委员，有1位是沈阳人，2位是北方人，1位是广州人，2位是体育爱好者，3位是党委委员。\n假如上述介绍涉及了该企业工会的所有委员，那么下列关于该企业工会委员的判断都与题干不矛盾，除了      项。","options":{"A":"2位体育爱好者都是党委委员","B":"党委委员不都是南方人","C":"体育爱好者都是南方人","D":"沈阳人是体育爱好者"},"answer":"A","explanation":"第一步：分析题干。\n共有7名工会委员，有1位是沈阳人，2位是北方人，1位是广州人，2位是体育爱好者，3位是党委委员，且上述介绍涉及了该企业工会的所有委员。其中，沈阳人属于北方人二者为种属关系，“故2位是北方人，1位是广州人，2位是体育爱好者，3位是党委委员”包含了该企业工会的所有委员，以此条件验证各个选项。\n第二步：根据题干条件分析选项。\nA项：如果2位体育爱好者都是党委委员，二者为种属关系，则“2位是北方人，1位是广州人，3位是党委委员”包含了该企业工会的所有委员，但此时委员人数最多为6人，与题干矛盾，当选；\nB项：如果党委委员不都是南方人，说明3位党委委员中至少有1人不是南方人，则“2位是北方人，1位是广州人，2位是体育爱好者，2位是党委委员或1位是党委委员者”包含了该企业工会的所有委员，最多可以是7人，与题干没有矛盾，排除；\nC项：如果体育爱好者都是南方人，则“2位是北方人，1位是广州人，2位是体育爱好者，3位是党委委员”包含了该企业工会的所有委员，最多可以是8人，与题干没有矛盾，排除；\nD项：如果沈阳人是体育爱好者，则“2位是北方人，1位是广州人，2位是体育爱好者，3位是党委委员”包含了该企业工会的所有委员，其中沈阳人即是北方人又是体育爱好者，最多可以是7人，与题干没有矛盾，排除。\n本题为选非题，故正确答案为A。","no":125,"missingImage":false},{"type":"question","qid":"2295293","cat":"类比推理","stem":"在某次国际会议上，每国有1-2名代表参会，参会代表没有多重国籍的人。其中，甲、乙、丙和丁四人分别来自英国、德国和美国3个国家。已知：\n（1）甲、乙至少有1人来自英国；\n（2）乙、丙至少有1人来自德国。\n如果甲、丙、丁至少有2人来自英美两国，则下列      项是不可能的。","options":{"A":"甲来自德国","B":"乙来自德国","C":"丙来自英国","D":"丁来自英国"},"answer":"A","explanation":"第一步：分析题干。\n根据题干信息已知，甲、乙、丙和丁四人分别来自英国、德国和美国3个国家，且没有多重国籍。\n①甲、乙至少有1人来自英国；\n②乙、丙至少有1人来自德国。\n③甲、丙、丁至少有2人来自英美两国。\n第二步：逐一分析选项。 \nA项：假如甲来自德国，根据①②那么乙来自英国，丙来自德国。那么题干甲、丙、丁至少有2人来自英美两国不成立，所以甲不可能来自德国，当选；\nB项：假如乙来自德国，根据①那么甲来自英国，丙丁的国籍不确定，题干甲、丙、丁至少有2人来自英美两国可能成立，排除；\nC项：假设丙来自英国，根据①②那么乙来自德国，甲来自英国。丁来自美国，题干甲、丙、丁至少有2人来自英美两国可能成立，排除；\nD项：假设丁来自英国，根据③可知甲、丙至少一人来自美国，与条件①②不矛盾，排除。\n本题为选非题，故正确答案为A。","no":126,"missingImage":false},{"type":"question","qid":"2295297","cat":"类比推理","stem":"G镇A小区内老王家出现了不少飞蛾，除非小区里业主家出现了飞蛾，否则小区不能向居委会申请除蛾的药剂。G镇B小区可以向居委会申请除蛾的药剂。\n如果上述断定为真，则下列      项不能断定真假。\nⅠA小区有的业主家中没有发现飞蛾。\nⅡA小区可以申请除蛾的药剂。\nⅢB小区的业主家均出现了飞蛾。","options":{"A":"只有Ⅰ","B":"只有Ⅱ","C":"只有Ⅰ和Ⅲ","D":"Ⅰ、Ⅱ和Ⅲ"},"answer":"D","explanation":"第一步：分析题干。\n①G镇A小区内老王家出现了不少飞蛾；\n②小区能向居委会申请除蛾的药剂\u003cimg data-k=\"2dfb7d1f72f3\">小区里业主家出现了飞蛾；\n③G镇B小区可以向居委会申请除蛾的药剂；\n第二步：逐一分析选项。\nⅠ：已知A小区内老王家出现了不少飞蛾，只能说明A小区有的业主家中发现飞蛾，不能推出ⅠA小区有的业主家中没有发现飞蛾，即Ⅰ项无法判断真假；\nⅡ：已知A小区内老王家出现了不少飞蛾，为②的肯后不能推出确定性结论，即Ⅱ项无法判断真假；\nⅢ：G镇B小区可以向居委会申请除蛾的药剂，根据②可以推出B小区里业主家出现了飞蛾。但不能推出B小区的业务家均出现了飞蛾，即Ⅲ项无法判断真假。\n综上所述Ⅰ、Ⅱ、Ⅲ均无法判断真假。\n本题为选非题，故正确答案为D。","no":127,"missingImage":false},{"type":"question","qid":"2295298","cat":"类比推理","stem":"青少年高校科学营旨在充分利用重点大学的科技教育资源，激发青少年对科学的兴趣，培养青少年的科学精神、创新意识和实践能力。班主任鼓励甲、乙、丙、丁四位同学报名参加暑假举行的科学营。几天后班主任向这四位同学询问录取的情况，他们的回答如下：\n甲：乙被科学营录取了。\n乙：丙被科学营录取了。\n丙：甲或者乙被科学营录取了。\n丁：乙或丙被科学营录取了。\n经过班主任调查，发现只有一位同学的回答与事实相符。\n根据以上陈述，下列      项为假。","options":{"A":"丙说的是真话","B":"乙没有被科学营录取","C":"被科学营录取的不是甲","D":"丁说的是假话"},"answer":"C","explanation":"本题为真假推理题。\n第一步：分析题干。\n甲：乙被录取。\n乙：丙被录取。\n丙：甲或乙被录取。\n丁：乙或丙被录取。\n四人的陈述没有明显的矛盾关系。分析发现，若甲陈述为真，则丙和丁都为真；若乙陈述为真，则丁也为真。但四人中只有一人回答与事实相符，则甲和乙陈述为假，即乙和丙都没有被录取。乙且丙均没有被录取，故丁陈述也为假，因有一人陈述为真，故陈述为真者是丙，即甲或乙被录取，而乙没有被录取，则可知甲一定被录取。\n第二步：逐一分析选项。\nA项：根据分析可知，丙陈述为真，选项正确，排除；\nB项：根据分析可知，乙没有被录取，选项正确，排除；\nC项：根据分析可知，甲一定被录取，选项错误，当选；\nD项：根据分析可知，丁陈述为假，选项正确，排除。\n本题为选非题，故正确答案为C。","no":128,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"483d4a4e127f\" style=\"max-width:700px\">\u003c/p>\u003cp>\u003cimg data-k=\"a7a36570de6f\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"2295367","cat":"综合","stem":"与2008年相比，2009年香港特别行政区四大服务业从业人数      。","options":{"A":"增加了0.5万人","B":"增加了3.5万人","C":"减少了0.5万人","D":"减少了3.5万人"},"answer":"D","explanation":"根据题干“与2008年相比，2009年······”，结合选项“增加······万人”、“减少······万人”，可知本题为增长量计算问题。定位表格可知，2008年香港特别行政区四大服务业从业人数为\u003cimg data-k=\"73e62f32b8f0\">，2009年香港特别行政区四大服务业从业人数为\u003cimg data-k=\"65dfc414a15d\">。\u003cimg data-k=\"496dbdaf9f9a\">，即2009年比2008年减少了3.5万人。\n故正确答案为D。","no":129,"missingImage":false}]},{"type":"material","material":"\u003cp>        2017年1月17日国家能源局公布《能源发展“十三五”规划》《天然气“十三五”规划》，首次明确“发挥市场配置资源的决定性作用”，到2020年天然气综合保供能力应达到3600亿立方米以上，天然气消费占一次能源消费比例达到\u003cimg data-k=\"a844a7e8064c\">-\u003cimg data-k=\"fc324c3b9ecb\">。\u003c/p>\u003cp>        2017年，我国天然气消费总量2373亿立方米，同比增长\u003cimg data-k=\"4b8f3a899668\">；全年天然气进口量920亿立方米，同比增长\u003cimg data-k=\"4e507f602a32\">。\u003c/p>\u003cp>\u003cimg data-k=\"76185c40243d\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"2295393","cat":"增长","stem":"假设2020年全国天然气消费总量达到3600亿立方米，且2017-2020年天然气进口量同比增速相同，则2020年天然气进口量将达到消费总量的      。","options":{"A":"不到两成","B":"三成多","C":"五成多","D":"八成以上"},"answer":"C","explanation":"由题干“······2020年天然气进口量将达到消费总量的多少成”可判断本题为现期比重问题。定位文字材料第二段“2017年···全年天 function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";

      var r=questionScore(q,a,perQ);

      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}

    var now=Date.now();

    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}

    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
