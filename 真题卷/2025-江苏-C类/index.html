<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2025年江苏省公务员录用考试《行测》题（C类）（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2025-江苏-C类","title":"2025年江苏省公务员录用考试《行测》题（C类）（网友回忆版）","year":"2025","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"13319187","cat":"毛中特","stem":"习近平新时代中国特色社会主义思想从理论和实践结合上，科学地回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党等重大时代课题，提出一系列原创性的治国理政新理念新思想新战略。关于习近平新时代中国特色社会主义思想的历史地位，下列表述正确的是：\n①继承和发展马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观，是马克思主义在当代中国发展最新理论成果，开辟了马克思主义中国化时代化的新境界\n②把马克思主义基本原理同中国具体实际相结合，同中华优秀传统文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华文化和中国精神的时代精华\n③确立了社会主义市场经济体制的改革目标和基本构架，确立了社会主义初级阶段的基本经济制度和分配制度，开创了全面深化改革新局面，推进党的建设新的伟大工程\n④是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家发展事业的根本遵循","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n①正确，党的十九大报告指出，习近平新时代中国特色社会主义思想，是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展，是马克思主义中国化最新成果，是党和人民实践经验和集体智慧的结晶，是中国特色社会主义理论体系的重要组成部分，是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南，必须长期坚持并不断发展。党的二十大报告提出的“六个必须坚持”，即必须坚持人民至上、坚持自信自立、坚持守正创新、坚持问题导向、坚持系统观念、坚持胸怀天下，集中体现了习近平新时代中国特色社会主义思想的世界观和方法论，是马克思主义世界观方法论中国化时代化的最新成果。\n②正确，习近平新时代中国特色社会主义思想既坚持了马克思主义的根本立场和基本原理，又从中华优秀传统文化中汲取了丰富营养，实现了马克思主义与中华优秀传统文化的有机融合，推动了中华文化的创造性转化和创新性发展。所以，它把马克思主义基本原理同中国具体实际相结合，同中华优秀传统文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华文化和中国精神的时代精华。\n③错误，“确立了社会主义市场经济体制的改革目标和基本构架，确立了社会主义初级阶段的基本经济制度和分配制度”等主要是邓小平理论、三个代表重要思想、科学发展观的重要成果，并不是习近平新时代中国特色社会主义思想的特定贡献。习近平新时代中国特色社会主义思想主要是推进全面深化改革向广度和深度进军，而不是确立社会主义市场经济体制等的最初阶段的内容。\n④正确，习近平新时代中国特色社会主义思想为实现中华民族伟大复兴的中国梦提供了科学理论指引和行动纲领，从思想上、理论上、战略上、行动上为党和国家事业发展指明了方向，对于团结带领全国各族人民全面建成社会主义现代化强国、全面推进中华民族伟大复兴具有重大而深远的意义。因此，可以说它是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家发展事业的根本遵循。\n故①②④说法正确。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"13319179","cat":"毛中特","stem":"党的十八大以来以习近平同志为核心的党中央把全面从严治党纳入“四个全面”战略布局，深入推进新时代党的建设新的伟大工程，提出一系列新理念新思想新战略，形成习近平总书记关于党的建设的重要思想。党在革命性锻造中更加坚强有力、更加充满活力。全面从严治党开辟了百年大党自我革命的新境界。关于新时代全面从严治党取得的历史性开创性成就，下列表述正确的是：\n①牢牢抓住“关键少数”，坚持从领导干部抓起，以上率下\n②提出让人民监督政府是跳出历史周期率第一个答案\n③开展了史无前例的反腐败斗争，取得压倒性胜利并全面巩固\n④把制度建设贯穿党的政治各方面，形成比较完善的党内法规体系\n⑤以党的政治建设统领党的建设的各项工作，不断增强党组织政治功能","options":{"A":"①②③⑤","B":"①②④⑤","C":"①③④⑤","D":"②③④⑤"},"answer":"C","explanation":"本题考查理论与政策。\n①正确，党的十八大以来，全面从严治党过程中，始终强调抓住领导干部这个 “关键少数”，以上率下，要求领导干部以身作则、率先垂范，带头遵守党纪国法，执行党的各项规定，以实际行动引领广大党员干部廉洁从政、担当作为。\n②错误，毛泽东同志在延安的窑洞里给出了跳出历史周期率的第一个答案，即让人民监督政府。而在新时代，习近平总书记给出了第二个答案，这就是自我革命。\n③正确，2023年1月9日，中共中央总书记、国家主席、中央军委主席习近平在中国共产党第二十届中央纪律检查委员会第二次全体会议上发表重要讲话。讲话指出：“新时代10年，我们党不断深化对自我革命规律的认识，不断推进党的建设理论创新、实践创新、制度创新，在构建全面从严治党体系上积累了丰富成果······我们开展史无前例的反腐败斗争，坚持无禁区、全覆盖、零容忍，不敢腐、不能腐、不想腐一体推进，‘打虎’、‘拍蝇’、‘猎狐’多管齐下，查处一大批腐败分子，消除党内严重政治隐患，反腐败斗争取得压倒性胜利并全面巩固，成功走出一条中国特色反腐败之路······”\n④正确，2023年1月9日，中共中央总书记、国家主席、中央军委主席习近平在中国共产党第二十届中央纪律检查委员会第二次全体会议上发表重要讲话。讲话指出：“新时代10年，我们党不断深化对自我革命规律的认识，不断推进党的建设理论创新、实践创新、制度创新，在构建全面从严治党体系上积累了丰富成果······我们把制度建设贯穿党的各项建设，与时俱进完善党章，聚焦加强党的领导和党的建设推进制度创新，形成比较完善的党内法规体系，搭建起党和国家监督体系‘四梁八柱’，把权力关进制度的笼子，为新时代党的建设提供了根本性、全局性、稳定性、长期性保障······”\n⑤正确，党的十八大以来，全面从严治党强调以党的政治建设为统领，把政治标准和政治要求贯穿党的思想建设、组织建设、作风建设、纪律建设以及制度建设、反腐败斗争始终，不断增强党组织政治功能和组织功能，确保党的团结统一和行动一致。\n故①③④⑤表述正确。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"13319185","cat":"新思想","stem":"2023年7月，习近平总书记在江苏考察时强调，江苏有能力也有责任在推进中国式现代化进程中走在前、做示范，希望江苏在科技创新上取得新突破，在强链补链延链上展现新作为，在建设中华民族现代文明上探索新经验，在推进社会治理现代化上实现新提升。为贯彻落实总书记赋予江苏“四个新”的重大任务，下列做法正确的有：\n①打造全国重要的产业科技创新高地，使高质量发展更多依靠创新驱动的内涵型增长，强化企业科技创新主体地位，深化科技体制改革和人才发展体制机制改革\n②巩固传统产业领先地位，加快打造具有国际竞争力的战略性新兴产业集群，全面提升产业基础高级化和产业链现代化水平，加快构建以先进制造业为骨干的现代化产业体系\n③加强优秀传统文化的保护传承和创新发展，大力发展现代科技、教育事业，全面提升人民群众的科学文化素质，繁荣发展文化事业和文化产业，持续推进城乡公共文化服务标准化、均等化\n④加快健全社会保障体系，健全就业促进机制和就业公共服务体系，完善社会治理体系，推进社会治理数字化，推进应急管理体系和能力现代化","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查理论与政策。\n①正确，习近平总书记指出，中国式现代化关键在科技现代化。江苏要在科技创新上率先取得新突破，打造全国重要的产业科技创新高地，使高质量发展更多依靠创新驱动的内涵型增长。要强化企业科技创新主体地位，促进创新要素向企业集聚，不断提高科技成果转化和产业化水平。要深化科技体制改革和人才发展体制机制改革······\n②正确，习近平总书记强调，要把坚守实体经济、构建现代化产业体系作为强省之要，巩固传统产业领先地位，加快打造具有国际竞争力的战略性新兴产业集群，推动数字经济与先进制造业、现代服务业深度融合，全面提升产业基础高级化和产业链现代化水平，加快构建以先进制造业为骨干的现代化产业体系。\n③正确，习近平总书记指出，建设中华民族现代文明，是推进中国式现代化的必然要求，是社会主义精神文明建设的重要内容。江苏要加强优秀传统文化的保护传承和创新发展，积极参与建设长江和大运河两大国家文化公园。要大力发展现代科技、教育事业，全面提升人民群众的科学文化素质。要繁荣发展文化事业和文化产业，持续推进城乡公共文化服务标准化、均等化······\n④正确，习近平总书记强调，江苏必须在保障和改善民生、推进社会治理现代化上走在前列。要加快健全社会保障体系，健全就业促进机制和就业公共服务体系，做好重点群体就业工作。要坚持和发展新时代“枫桥经验”、“浦江经验”，完善社会治理体系，健全城乡基层治理体系和乡村治理协同推进机制，推进社会治理数字化。要推进应急管理体系和能力现代化······\n故做法正确的有①②③④，共4项。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"13319189","cat":"新思想","stem":"习近平总书记指出，中华民族有着五千多年的悠久历史和灿烂文化，而且中华文化从远古一直延续发展到今天，是世界上唯一绵延不断，且以国家形态发展至今的伟大文明，具有突出的连续性。关于中华文化为何具有突出的连续性，下列说法正确的是：\n①强大的文化主体性，夯实了中华文明连续性的内在支撑\n②浩如烟海的文化典籍成为中华文明连续性的天然载体\n③独特又稳定的地理环境，筑牢了中华文明连续性的自然基础\n④中华文化“中和”的文化价值诉求奠定了中华文明连续性的价值底蕴","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n①错误，《中华文明源远流长的连续性》中指出：“厚重的文化积累是中华文明突出连续性的内在支撑。一个文明能够从不断裂、历久弥新，其中决定连续性的深层次原因必与既有的文化密切相关。换言之，同一个国家‘不断裂’状态的维持，一是其国民的人类遗传基因延续不辍，二是其国家文化基因世代传承。”\n②正确，《习近平总书记这样谈中华文明的连续性》中指出：“中华民族创造了浩如烟海的文化典籍，中华文明在这些代代相传的典籍中得以记载和传承，如四书五经等儒家典籍向来是历代儒家学子首要研学之书，从未中断。······在我国出土的大量考古成果充分展示着中华文明起源和发展的历史脉络，从中可见中华文明传承悠久且从未中断。”由此可见，浩如烟海的文化典籍成为中华文明连续性的天然载体。\n③正确，《中华文明源远流长的连续性》中指出：“独特的地理气候是中华文明突出连续性的自然基础。”《连续性：中华文明的首要特性》中指出：“中华文明成为人类历史上唯一一个绵延5000多年至今未曾中断的灿烂文明。而这主要得益于以下三个因素：第一，独特稳定的地理环境。”\n④正确，《连续性：中华文明的首要特性》中指出：“第二，‘中和’的文化价值诉求。中华文明源远流长、博大精深，其中儒家、道家成为中华文明的主流思想······‘中’就是要把握适当的限度，使自己的言行合乎标准。‘中和’所代表的中性智慧强调的是事物双方的相辅相成、共生共存，从而做到不偏不倚、执两用中······总而言之，‘中和’的文化价值诉求成就了‘贵和持中、自强不息’的中华文明，奠定了中华文明源远流长的价值底蕴。”\n故②③④表述正确。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"13319196","cat":"新思想","stem":"习近平总书记指出，全面依法治国是国家治理的一场深刻革命。我们要坚持走中国特色社会主义法治道路、建设中国特色社会主义法治体系、建设社会主义法治国家。关于中国特色社会主义法治道路的核心要义，下列理解正确的是：\n①中国特色社会主义制度是中国特色社会主义法治体系的根本制度基础\n②党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证\n③中国特色社会主义法治理论是法治体系的理论指导，是全面推进依法治国的行动指南\n④弘扬社会主义法治精神、传承中华优秀传统法律文化是社会主义法治建设的首要任务","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"A","explanation":"本题考查理论与政策。\n①②③正确，《习近平新时代中国特色社会主义思想学习纲要》中“八、全面推进依法治国”部分指出：“中国特色社会主义法治道路的核心要义，就是要坚持党的领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论。党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。坚持中国特色社会主义法治道路，最根本的是坚持党的领导。中国特色社会主义制度是中国特色社会主义法治体系的根本制度基础，是全面推进依法治国的根本制度保障。中国特色社会主义法治理论是中国特色社会主义法治体系的理论指导和学理支撑，是全面推进依法治国的行动指南。”\n④错误，《法治中国建设规划（2020－2025年）》中“二、全面贯彻实施宪法，坚定维护宪法尊严和权威”部分指出：“建设法治中国，必须高度重视宪法在治国理政中的重要地位和作用，坚持依宪治国、依宪执政，把全面贯彻实施宪法作为首要任务，健全保证宪法全面实施的体制机制，将宪法实施和监督提高到新水平。”\n故①②③表述正确。\n故正确答案为A。","no":5,"missingImage":false},{"type":"question","qid":"13319195","cat":"时事政治","stem":"习近平总书记在党的二十届三中全会上提出，到2035年，全面建成高水平社会主义市场经济体制，为中国式现代化提供重要保障。下列做法属于构建高水平社会主义市场经济体制举措的是：\n①培育壮大先进制造业集群，推进制造业高端化、智能化、绿色化发展\n②推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通\n③坚持和落实“两个毫不动摇”，促进各种所有制经济优势互补、共同发展\n④依法平等长久保护各种所有制经济产权，建立高效的知识产权综合管理体制","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议审议通过了《中共中央关于进一步全面深化改革、推进中国式现代化的决定》（以下简称《决定》）。\n①错误，《决定》在“三、健全推动经济高质量发展体制机制”部分指出“（9）健全促进实体经济和数字经济深度融合制度。加快推进新型工业化，培育壮大先进制造业集群，推动制造业高端化、智能化、绿色化发展······”故此举措说法无误，但不属于构建高水平社会主义市场经济体制。\n②正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（6）构建全国统一大市场。推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。加强公平竞争审查刚性约束，强化反垄断和反不正当竞争，清理和废除妨碍全国统一市场和公平竞争的各种规定和做法······”\n③正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（5）坚持和落实‘两个毫不动摇’。毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展，保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护，促进各种所有制经济优势互补、共同发展。”\n④正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（7）完善市场经济基础制度。完善产权制度，依法平等长久保护各种所有制经济产权，建立高效的知识产权综合管理体制······”\n综上，②③④正确。\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"13319193","cat":"时事政治","stem":"习近平总书记多次深刻阐释“以人民为中心”的执政理念。党的二十届三中全会将这一执政理念确定为进一步全面深化改革必须遵循的原则，强调坚持以人民为中心，尊重人民主体地位和首创精神，人民有所呼、改革有所应，做到改革为了人民、改革依靠人民、改革成果由人民共享。某市的下列举措符合“以人民为中心”的原则的是：\n①创办共富市集，减免低收入群众和灵活就业收入人员摊位费\n②建立“百姓会客厅”机制，密切联系群众，问计于民、问需于民\n③全国推进公用事业市场化改革提升，提升资源配置效率，减轻财政负担\n④持续完善积分落户制，促进有稳定就业的外来人口有序实现市民化","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n“以人民为中心的发展思想”是习近平总书记于2015年10月26日至29日，党的十八届五中全会提出的治国方针理论。所谓以人民为中心，就是要抓住人民最关心最直接最现实的利益问题，不断保障和改善民生，促进社会公平正义，在更高水平上实现幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶，让发展成果更多更公平惠及全体人民，不断促进人的全面发展，朝着实现全体人民共同富裕不断迈进。\n①正确，“创办共富市集，减免低收入群众和灵活就业收入人员摊位费”能够增加这部分人的收入，有利于共同富裕的实现，是符合“以人民为中心”原则的举措。\n②正确，“建立‘百姓会客厅’机制，密切联系群众，问计于民、问需于民”可以更好地抓住人民最关心最直接最现实的利益问题，以便解决这些问题，是符合“以人民为中心”原则的举措。\n③错误，“全国推进公用事业市场化改革提升，提升资源配置效率，减轻财政负担”更多强调为财政减负，和人民并无直接联系。\n④正确，“持续完善积分落户制，促进有稳定就业的外来人口有序实现市民化”能够更好解决外来人口养老育幼、买房医疗等问题，提高这一群体的幸福感，是符合“以人民为中心”原则的举措。\n综上，①②④正确。\n故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"13319194","cat":"新思想","stem":"习近平总书记强调，就业是最基本的民生，事关人民群众切身利益，事关经济社会健康发展，事关国家长治久安。要实施就业优先战略，促进高质量充分就业。关于促进高质量充分就业，下列表述正确的是：\n①在宏观层面，高质量充分就业主要包括就业机会充分、就业环境公平、就业结构优化、人岗匹配高效、劳动关系和谐等\n②在微观层面，高质量充分就业主要表现为每个公民不仅有活干，而且工作稳定、收入合理、保障可靠、职业安全等\n③高质量充分就业是一个很高的要求，也是一个循序渐进的过程，必须尽力而为、量力而行；必须充分调动人民群众的积极性主动性创造性，引导大家依靠努力奋斗创造幸福生活\n④促进高质量充分就业。要始终坚持就业优先，着力解决结构性就业矛盾，完善重点群体就业支持政策，深化就业体制机制改革，加强劳动者权益保障","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"C","explanation":"本题考查理论与政策。\n2024年11月1日出版的第21期《求是》杂志发表了中共中央总书记、国家主席、中央军委主席习近平的重要文章《促进高质量充分就业》。\n①③正确，②错误，文章指出，党的二十大科学把握就业形势新变化，顺应人民群众新期待，着眼扎实推进高质量发展和全体人民共同富裕，作出了促进高质量充分就业的重大部署。在宏观层面，高质量充分就业主要包括就业机会充分、就业环境公平、就业结构优化、人岗匹配高效、劳动关系和谐等；在微观层面，高质量充分就业主要表现为劳动者不仅有活干，而且工作稳定、收入合理、保障可靠、职业安全等。当然，这是一个很高的要求，也是一个循序渐进的过程，必须尽力而为、量力而行；必须充分调动人民群众的积极性主动性创造性，引导大家依靠努力奋斗创造幸福生活，不能不劳而获、坐享其成。\n④正确，文章指出，促进高质量充分就业，是新时代新征程就业工作的新定位、新使命·····这里，我着重强调5点。第一，始终坚持就业优先······第二，着力解决结构性就业矛盾······第三，完善重点群体就业支持政策······第四，深化就业体制机制改革······第五，加强劳动者权益保障······\n综上，①③④表述正确。\n故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"13319197","cat":"新思想","stem":"习近平总书记对江苏生态文明建设念兹在兹，反复叮嘱江苏要“把保护生态环境摆在更加突出的位置”“走出一条生态优先、绿色发展的新路子”。为贯彻落实总书记的重要指示精神，江苏全面加快推进美丽江苏建设，推动实现人与自然和谐共生的现代化。关于全面推进美丽江苏建设的举措，下列说法正确的是：\n①加强苏北海岸带的国土空间管控，一律不得新增围海和填海\n②建设黄河故道千里生态富民廊道，构建江淮生态经济区湖群绿心\n③推动江河湖海各展所长，统筹推进长江和大运河国家文化公园建设\n④增强省域森林、湿地、土壤、海洋等生态系统固碳作用，支持里下河地区提升生态系统碳汇能力","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n①错误，《国务院关于&lt;江苏省国土空间规划（2021—2035年）&gt;的批复》在“二、筑牢安全发展的空间基础”部分指出：“······除国家重大项目外，全面禁止围填海；严格无居民海岛管理。”\n②③正确，《中共江苏省委江苏省人民政府关于全面推进美丽江苏建设的实施意见》在“四、打造美丽江苏建设示范样板”部分“（十二）塑造‘水韵江苏’品牌”中指出：“以水为脉，推动江河湖海各展所长，统筹推进长江和大运河国家文化公园建设，着力打造太湖全国湖泊治理标杆，构筑蓝湾百里生态百里缤纷百里沿海岸线，建设黄河故道千里生态富民廊道，构建江淮生态经济区湖群绿心，彰显各具特色、各现其美的‘水韵江苏’风采。”\n④正确，《中共江苏省委江苏省人民政府关于全面推进美丽江苏建设的实施意见》在“二、加快发展方式绿色低碳转型”部分“（二）积极稳妥推进碳达峰碳中和”中指出：“落实碳达峰碳中和‘1+N’政策体系，推动能耗双控逐步转向碳排放双控······增强省域森林、湿地、土壤、海洋等生态系统固碳作用，支持里下河地区提升生态系统碳汇能力。深入推进减污降碳协同创新。”\n故②③④说法正确。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"11226410","cat":"新思想","stem":"党的十八大以来，以习近平同志为核心的党中央站在巩固党的执政基础和维护国家政权安全的高度，坚持和加强党对基层治理的领导，不断推进基层治理理论创新、实践创新和制度创新。习近平总书记围绕基层治理发表一系列重要论述，立意高远，内涵丰富，思想深刻，为新时代推进基层治理现代化提供了根本遵循和科学指南，关于总书记基层治理重要论述的精神实质和精髓要义，下列理解正确的有：\n①鲜明树立大抓基层的工作导向\n②深入阐述推进基层治理现代化的价值取向\n③深刻阐明基层治理在国家治理体系中的地位作用\n④科学擘画党组织领导的共建共治共享的基层治理格局\n⑤明确提出构建富有活力和效率的新型基层社会治理体系的工作要求","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"D","explanation":"本题考查理论与政策。\n2024年5月，求是网发表题为《基层是党的执政之基、力量之源》的文章，以下简称文章。\n①正确，文章指出，鲜明树立大抓基层的工作导向。习近平总书记高度重视抓基层打基础，强调“各级都要重视基层、关心基层、支持基层”，“要树立大抓基层的鲜明导向，推动改革举措落到基层，使基层真正强起来”，同时要求“持续深化整治形式主义为基层减负，为基层干部干事创业创造良好条件”。\n②正确，文章指出，深入阐述推进基层治理现代化的价值取向。习近平总书记强调，“保障和改善民生没有终点，只有连续不断的新起点”，“创新社会治理，最终是为了让群众得实惠”······总书记“身入”基层，更“心到”基层，充分彰显了大党大国领袖深厚的人民情怀，生动诠释了以人民为中心的价值取向。\n③正确，文章指出，深刻阐明基层治理在国家治理体系中的地位作用。基础不牢，地动山摇。习近平总书记深刻指出，“基层是党的执政之基、力量之源”，“基层是一切工作的落脚点”······只有把基层党组织建设强、把基层政权巩固好，中国特色社会主义的根基才能稳固。我国国家治理体系的一个优势就是把城乡社区基础筑牢。\n④正确，文章指出，科学擘画党组织领导的共建共治共享的基层治理格局。习近平总书记强调，“基层社区事务很多很繁杂，单靠政府是干不了、也干不好的，必须充分发挥社会各方面作用，激发全社会活力”。党的十九大提出打造共建共治共享的社会治理格局，党的二十大部署建设人人有责、人人尽责、人人享有的社会治理共同体。近年来，各地区各部门坚决贯彻落实党中央决策部署，不断完善党委领导、政府负责、社会协同、公众参与、法治保障的社会治理体系，构建党组织领导的共建共治共享的城乡基层治理格局。\n⑤正确，文章指出，明确提出构建富有活力和效率的新型基层社会治理体系的工作要求。习近平总书记十分关心基层治理创新和治理效能提升，多次强调要“健全党组织领导的自治、法治、德治相结合的基层治理体系”，“要着力推进社会治理系统化、科学化、智能化、法治化”。2024年4月，总书记在重庆考察时进一步要求，“继续推动资源下沉、完善服务设施，强化网格化管理、信息化支撑，提高社区精细化治理、精准化服务水平”，“让城市治理更智能、更高效、更精准”，为提升基层治理效能指明前进方向。\n故①②③④⑤表述正确，共5项。\n故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"13319206","cat":"新思想","stem":"新中国成立75年以来，中国共产党团结带领全国各族人民勠力同心、砥砺奋进，经济实力实现了跨越式发展，深刻改变了世界发展格局。关于新中国成立75年来的经济发展成就，下列表述正确的是：\n①经济总量跃居世界第二位\n②连续十四年保持了世界第一制造业大国地位\n③谷物产量跃居世界第二位\n④改革开放以来成为世界经济增长的重要引擎","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查经济常识。\n2024年9月，国家统计局发布新中国75年经济社会发展成就系列报告（以下简称报告）。\n①正确，报告在“一、从积贫积弱到世界第二大经济体，经济实力、综合国力和国际影响力实现历史性跨越”部分的“（一）国民经济快速增长，经济实力空前跃升”中指出：“······经济总量连续跨越重要关口······2023年超过126万亿元，稳居世界第二大经济体······”\n②正确，报告在“二、从瓶颈制约到优势支撑，基础产业和基础设施空前加强”部分的“（一）工农业生产能力突飞猛进，主要产品产量全球第一”中指出：“······制造业增加值连续14年位居世界第一，占世界份额30%左右，成为驱动全球制造业发展的重要引擎······”\n③错误，报告在“二、从瓶颈制约到优势支撑，基础产业和基础设施空前加强”部分的“（一）工农业生产能力突飞猛进，主要产品产量全球第一”中指出：“······粮食总产量由1949年的2264亿斤增加到2023年的13908亿斤，增长5.1倍；谷物、肉类、花生、茶叶、水果等农产品产量居全球首位······”\n④正确，报告在“一、从积贫积弱到世界第二大经济体，经济实力、综合国力和国际影响力实现历史性跨越”部分的“（三）综合国力跃居世界前列，国际影响力日益彰显”中指出：“新中国成立初期，我国经济总量占世界比重很小，至1978年也仅为1.7%，居世界第10位。改革开放以来，我国经济持续快速增长，成为世界经济增长的重要引擎和稳定力量······”\n故表述正确的是①②④。\n故正确答案为B。","no":11,"missingImage":false}],"count":11,"answerable":11,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"11226406","cat":"人文常识","stem":"巩固和完善农村基本经营制度是党的农村政策的基石，是促进乡村全面振兴、加快建设农业强国的制度基础。关于巩固和完善农业农村基本经营制度的要求，下列表述正确的是：\n①坚持稳定土地承包关系\n②坚持家庭经营基础性地位\n③坚持土地集中连片流转\n④坚持农村土地农民集体所有","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n①②④正确，《关于完善农村土地所有权承包权经营权分置办法的意见》在“二、总体要求”部分“（二）基本原则”中指出：“守住政策底线。坚持和完善农村基本经营制度，坚持农村土地集体所有，坚持家庭经营基础性地位，坚持稳定土地承包关系，不能把农村土地集体所有制改垮了，不能把耕地改少了，不能把粮食生产能力改弱了，不能把农民利益损害了。”\n③错误，《农村土地经营权流转管理办法》在“第一章 总则”部分指出：“第四条 土地经营权流转应当因地制宜、循序渐进，把握好流转、集中、规模经营的度，流转规模应当与城镇化进程和农村劳动力转移规模相适应，与农业科技进步和生产手段改进程度相适应，与农业社会化服务水平提高相适应，鼓励各地建立多种形式的土地经营权流转风险防范和保障机制。”因此，要引导农村土地经营权有序流转，而非坚持土地集中连片流转。\n故①②④表述正确。\n故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"11226408","cat":"法律常识","stem":"根据《农村集体经济组织法》，非农村集体经济组织成员长期在农村集体经济组织工作，对集体做出贡献的，经农村集体经济组织成员大会全体成员四分之三以上同意，可以享有的权利是：\n①参与分配集体收益\n②可以取得宅基地使用权\n③享受农村集体经济组织提供的服务和福利\n④集体土地被征收征用时参与分配土地补偿费等","options":{"A":"①②","B":"①③","C":"②④","D":"③④"},"answer":"B","explanation":"本题考查法律常识。\n①③正确，②④错误，根据《农村集体经济组织法》第十五条规定：“非农村集体经济组织成员长期在农村集体经济组织工作，对集体做出贡献的，经农村集体经济组织成员大会全体成员四分之三以上同意，可以享有本法第十三条第七项、第九项、第十项规定的权利。”第十三条规定：“农村集体经济组织成员享有下列权利：（一）依照法律法规和农村集体经济组织章程选举和被选举为成员代表、理事会成员、监事会成员或者监事；（二）依照法律法规和农村集体经济组织章程参加成员大会、成员代表大会，参与表决决定农村集体经济组织重大事项和重要事务；（三）查阅、复制农村集体经济组织财务会计报告、会议记录等资料，了解有关情况；（四）监督农村集体经济组织的生产经营管理活动和集体收益的分配、使用，并提出意见和建议；（五）依法承包农村集体经济组织发包的农村土地；（六）依法申请取得宅基地使用权；（七）参与分配集体收益；（八）集体土地被征收征用时参与分配土地补偿费等；（九）享受农村集体经济组织提供的服务和福利；（十）法律法规和农村集体经济组织章程规定的其他权利。”\n故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"11226413","cat":"人文常识","stem":"“全面深化改革是一场深刻的社会革命，是一项复杂的系统工程，必须以科学的方法论为指导方能行稳致远。”这句话与下列古语所蕴含的理念相契合的是：","options":{"A":"事必有法，然后可成","B":"于安思危，于治忧乱","C":"备豫不虞，为国常道","D":"取之有度，用之有节"},"answer":"A","explanation":"本题考查马克思主义。\n“全面深化改革是一场深刻的社会革命，是一项复杂的系统工程，必须以科学的方法论为指导方能行稳致远。”强调了科学方法的重要性。\nA项正确，“事必有法，然后可成”意思是任何事情都有方法，只有找到合适的方法，才能成功。强调了科学方法的重要性，蕴含的理念与题干一致。\nB项错误，“于安思危，于治忧乱”意思是即使居于安乐的环境里，也要想到可能出现的危险；即使处在稳定的境况中，也要忧虑可能发生的动乱。‌强调的是矛盾的同一性，即矛盾双方相互依存、相互转化。蕴含的理念与题干不一致。\nC项错误，“备豫不虞，为国常道”意思是事先防备意外之事，是治理国家的常道。强调了防患于未然的重要性，蕴含的理念与题干不一致。\nD项错误，“取之有度，用之有节”意思是在获取资源时要有限度，在使用时要节制。强调了质量互变原理中“度”的重要性观点，蕴含的理念与题干不一致。\n故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"11226414","cat":"人文常识","stem":"下面图片是我国为纪念某一特定节日而发行的纪念邮票，据此可判断该节日是：\n\u003cimg data-k=\"69ec03d43d4a\" style=\"max-width:461px\">\n\u003cimg data-k=\"4f00446a215a\" style=\"max-width:342px\">\n\u003cimg data-k=\"113b9700350f\" style=\"max-width:281px\">","options":{"A":"青年节","B":"教师节","C":"植树节","D":"重阳节"},"answer":"B","explanation":"本题考查人文常识。\nA项错误，青年节是5月4日，邮票中没有任何与青年节相关的元素，如五四青年节相关的历史事件、标志等。\nB项正确，第一张邮票写着“9月10日教师节”；第二张邮票左侧有“立德树人”的文字，“立德树人”是教育的根本任务；第三张邮票左侧有“教师节·师恩难忘”的文字。都表明这些邮票是为纪念教师节发行的。\nC项错误，植树节是3月12日，邮票中没有种植树木、树苗等与植树节直接相关的元素。\nD项错误，重阳节是农历9月9日，有登高祈福、拜神祭祖、晒秋、赏菊、饮宴祈寿等习俗，邮票中没有相关的元素。\n故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"11226417","cat":"人文常识","stem":"七巧板是一种古老的中国传统智力玩具，由一个正方形切割成的大小、形状各异的七块板组成。它们可以拼成许多图形，其原理在我国现代社区治理中多有体现。下列我国社区治理实践与七巧板的原理相契合的是：","options":{"A":"网格化管理","B":"社区服务外包","C":"河湖长制","D":"首问责任制"},"answer":"A","explanation":"本题考查管理常识。\nA项正确，网格化，就是将城区行政性地划分为一个个的“网格”，使这些网格成为政府管理基层社会的单元。网格化管理依托统一的城市管理以及数字化平台，将城市管理辖区按照一定的标准划分成为单元网格。通过加强对单元网格的部件和事件巡查，建立一种监督和处置互相分离的形式。\nB项错误，社区公共服务外包是一种新型的政府提供社区公共服务的模式。它将社区公共服务的提供和生产的概念区分开来，较好地兼顾了服务提供的效率和公平，而专业的社工、非营利组织和营利性组织进入社区服务领域，大大改善了社区的服务环境，满足社区人群对公共服务日益提升的多元化需求。\nC项错误，河湖长制即河长制、湖长制的统称，是由各级党政负责同志担任河湖长，负责组织领导相应河湖治理和保护的一项生态文明建设制度创新。通过构建责任明确、协调有序、监管严格、保护有力的河湖管理保护机制，为维护河湖健康生命、实现河湖功能永续利用提供制度保障。\nD项错误，首问责任制是针对群众对机关内设机构职责分工和办事程序不了解、不熟悉的实际问题，而采取的一项便民工作制度。该制度规定群众来访时，机关在岗被询问的工作人员即为首问责任人。要求首问责任人对群众提出的问题或要求，无论是否是自己职责（权）范围内的事，都要给群众一个满意的答复。\n故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"13319234","cat":"科技常识","stem":"当人们乘坐列车进藏时，会在青藏铁路旁发现一个特别的景象，路基两旁时不时会闪过一排排金属管，这些金属管插入地底，露出地面的部分高达两米（如图所示）。关于这些金属管的作用，下列说法正确的是：\n\u003cimg data-k=\"fa5e96f09f0d\" style=\"max-width:600px\">","options":{"A":"收集传导气象信息","B":"实时监控路基安全","C":"阻挡动物横穿铁路","D":"保护冻土层的结构"},"answer":"D","explanation":"本题考查地理国情。\nD项正确，A、B、C三项错误，青藏高原由于海拔高气温低，冻土层分布广泛。随着温度的变化，土体会产生多次冻融和冻胀，这样的过程容易造成土层结构破坏、地基承载力降低、边坡失稳等问题。为了减少温度上升冻土融化下沉造成的路基下沉，需要在路基沿线架设热棒。热棒是一种高约4米、内部中空、外部有散热片的金属柱子，其根部有很多空心管通入路基之中，当路基受热有水汽出现，这些水汽就会顺着空心管道上升至热棒中。高原地区的气温低、风力大，寒冷的风吹过热棒的散热片后，把热量带走，水汽就此也降温凝结。故这些金属管的作用为保护冻土层的结构。\n故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"11226412","cat":"人文常识","stem":"某地遭遇特大暴雨灾害，地处深山的M社区断水断电断网，成为一座孤岛，洪水冲毁附近铁路，千名乘客滞留车厢。紧急关头，社区党支部孟书记带领党员和居民安置转运近千名滞留乘客，解决他们的吃、住等问题，保障了他们的生命财产安全，为后续救援赢得了宝贵时间。关于孟书记事迹所体现的职业道德，下列表述最贴切的是：","options":{"A":"秉公用权，公私分明，努力维护和促进社会公平正义","B":"依法履职，严格按照法定的权限、程序和方式执行公务","C":"精通业务知识，勤勉敬业、求真务实，兢兢业业做好本职工作","D":"敢于担当、无私奉献，面对困难奋勇而上，面对危机挺身而出"},"answer":"D","explanation":"本题考查毛中特。\nA项错误，“秉公用权，公私分明，努力维护和促进社会公平正义”主要侧重于在权力使用过程中不偏不倚，处理公共事务时公正无私，维护社会公平正义。而题干中孟书记的事迹重点在于他面对特大暴雨灾害这种紧急困难情况时的应对举措，并没有突出权力使用以及公平正义相关方面。\nB项错误，“依法履职，严格按照法定的权限、程序和方式执行公务”强调的是在执行公务时遵循法律规定的权限和程序。但题干主要围绕孟书记带领大家积极应对灾害，保障滞留乘客生命财产安全展开，并没有涉及到依法依规按程序执行公务的内容。\nC项错误，“精通业务知识，勤勉敬业、求真务实，兢兢业业做好本职工作”着重体现的是对业务知识的掌握以及工作态度方面。题干重点突出的是孟书记在面临特大暴雨灾害这种危机情况时的担当和奉献精神，并非强调业务知识和日常工作态度。\nD项正确，“敢于担当、无私奉献，面对困难奋勇而上，面对危机挺身而出”很好地契合了孟书记在社区遭遇特大暴雨灾害、乘客滞留的危机时刻，带领党员和居民积极安置转运滞留乘客，解决各种问题，保障生命财产安全的行为，充分体现了孟书记在困难和危机面前敢于承担责任、无私奉献的精神品质。\n故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"11226418","cat":"人文常识","stem":"张某与李某同住一个小区，双方发生借款纠纷，张某起诉到法院，法院判决李某应偿还借款，但李某未履行生效判决。为此，张某在小区业主群向李某讨债，并在小区公告栏、电梯间等处张贴判决书。李某认为张某侵犯了其个人权益。对此，下列说法正确的是：","options":{"A":"张某正当行使权利，其讨债行为不构成侵权","B":"张某向李某公开讨债，侵犯了李某的名誉权","C":"张某公开张贴判决书，侵犯了李某的隐私权","D":"张某应当申请法院强制执行，无权自行讨债"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，C项正确，根据《中华人民共和国民法典》第一千零三十二条规定：“自然人享有隐私权。任何组织或者个人不得以刺探、侵扰、泄露、公开等方式侵害他人的隐私权。隐私是自然人的私人生活安宁和不愿为他人知晓的私密空间、私密活动、私密信息。”题中，张某未经许可，将带有李某个人信息的判决书公布到小区，侵犯了李某的隐私权。\nB项错误，根据《中华人民共和国民法典》第一千零二十四条规定：“民事主体享有名誉权。任何组织或者个人不得以侮辱、诽谤等方式侵害他人的名誉权。名誉是对民事主体的品德、声望、才能、信用等的社会评价。”题中，张某未经许可，将带有李某个人信息的判决书公布到小区，并未以侮辱、诽谤等方式侵害李某的名誉权。\nD项错误，根据《中华人民共和国民事诉讼法》第二百四十七条规定：“发生法律效力的民事判决、裁定，当事人必须履行。一方拒绝履行的，对方当事人可以向人民法院申请执行，也可以由审判员移送执行员执行。调解书和其他应当由人民法院执行的法律文书，当事人必须履行。一方拒绝履行的，对方当事人可以向人民法院申请执行。”因此，张某可以申请法院强制执行，但是也有权自行讨债。\n故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"11226419","cat":"法律常识","stem":"燕某、郑某是某小区业主委员会的主任和委员，同时也是业主微信群的群主和管理员。业主徐某在业主群中发言，质疑业主委员会不依法办事，并与多位业主发生争执，郑某将其移出群。徐某向燕某投诉，要求重新入群，燕某拒绝并将其拉黑。徐某认为其人格受到贬损，欲将燕某、郑某起诉至法院，对此，下列说法正确的是：","options":{"A":"郑某作为管理员不拥有平台赋予的“踢人”权力","B":"燕某作为群主将业主徐某拉黑，侵害了其人格权","C":"入群、退群、移出群等行为不属于民事诉讼受案范围","D":"业主微信群的群主、管理员没有自主选择群成员的权力"},"answer":"C","explanation":"本题考查法律常识。\nA、D两项错误，根据《互联网群组信息服务管理规定》第九条第一款规定：“互联网群组建立者、管理者应当履行群组管理责任，依据法律法规、用户协议和平台公约，规范群组网络行为和信息发布，构建文明有序的网络群体空间。”题中，业主微信群的群主、管理员有权依照规定履行包括将群成员移出群组、自主选择群成员在内的群组管理职责。\nB项错误，根据《中华人民共和国民法典》第九百九十条规定：“人格权是民事主体享有的生命权、身体权、健康权、姓名权、名称权、肖像权、名誉权、荣誉权、隐私权等权利。除前款规定的人格权外，自然人享有基于人身自由、人格尊严产生的其他人格权益。”题中，并未表明燕某发表过对徐某侮辱、诽谤的内容，燕某作为群主将业主徐某拉黑不构成对其人格权的侵犯。\nC项正确，根据《中华人民共和国民事诉讼法》第三条规定：“人民法院受理公民之间、法人之间、其他组织之间以及他们相互之间因财产关系和人身关系提起的民事诉讼，适用本法的规定。”入群、退群、移出群等行为不涉及公民之间的人身和财产关系，不产生民事法律关系，因此不属于民事诉讼受案范围。\n故正确答案为C。","no":20,"missingImage":false}],"count":9,"answerable":9,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        大地的深处，一粒粒种子正悄然从土壤中苏醒。它们曾在土壤的怀抱中沉睡，身上\u003cu>        \u003c/u>着生命的力量。在被称为“种子诺亚方舟”的国家作物种质库里，借助科技的力量，无数跨越时空的种子在此“\u003cu>        \u003c/u>”。\u003c/p>\u003cp>        国家作物种质库有几个特点：第一是容量大——拥有150万份的总容量，是目前全球最大的国家级农作物种质资源库；第二是保存方式体系化，它囊括了现在所有植物种质资源保存的技术条件，包括低温种子保存、试管苗保存、超低温保存和DNA保存；第三是实现了自动化信息化管理。\u003c/p>\u003cp>        农稳社稷，种子为基。作物种质资源是支撑粮食丰收的一个重要基础——正如国家作物种质库的设计理念“承接上苍之甘露，孕育万物之繁衍”。因此，种质资源库的使命就是长久、安全地保存好这些种质资源，为农业发展提供支撑。\u003c/p>\u003cp>        种质资源最主要的保存方式是低温种子保存，国家作物种质库采用\u003cimg data-k=\"d3282721e766\">低温和45%以下相对湿度保存种子。全球约有90%的种质资源是以种子形式保存的。种质资源保存的方式还有超低温。超低温保存需要用到的工具是液氮罐，国家作物种质库的一个液氮罐大概能够保存1万份种质资源。\u003c/p>\u003cp>        像香蕉这些没有种子的作物，通常是把一棵一棵的植株种到种质资源圃里保存，这是无性繁殖作物种质资源非常重要的一种保存方式。但是植株在露天环境中，会面临自然灾害以及病虫害威胁。为了应对这个情况，在种质资源圃保存的基础上，配套超低温保存，把植株的一些关键组织取下来，经过一系列处理后，放到\u003cimg data-k=\"2a5a2efa92e7\">的液氮里去，这样就能够永久保存下来。\u003c/p>\u003cp>        芒果等热带水果也需要液氮保存。虽然芒果有种子，但很多芒果果核很大，不能忍耐脱水、不能耐受低温，所以一般也不能放在低温种子库保存，就需要把芒果种子的胚，即生长点取下来，经过一系列处理之后放到液氮里保存。\u003c/p>\u003cp>        种质资源还可以采用试管苗保存。把植株的茎尖等生长点取下来，放在瓶子里——瓶子下面有看上去像果冻一样的培养基，它能提供营养让茎尖在上面慢慢生长。超低温和试管苗，主要都是用来保存无性繁殖作物和一些多年生的作物。如果作物方便转化成试管苗，那么就会用这种方式来保存。如果不太方便转化成试管苗，作物就先在液氮罐里进行超低温保存。\u003c/p>\u003cp>        试管苗方式保存的种质资源处在活跃的生长状态。试管苗属于真正的“温室里的花朵”，但是如果需要的话，把它们从瓶子里拿出来以后，再经过一些“锻炼”，就可以迅速恢复生产。种子在瓶子里是在不断生长的，因此也会不断消耗，当培养基的营养用完之后，或苗子长“老”了之后，就需要把它的生长点再拿下来，换一个瓶子，让它的生命周而复始无限循环下去。\u003c/p>\u003cp>        每一粒种子都承载着生命的希望，从一粒小小的种子到丰收的田野，这是一场科技与自然的默契合作。国家作物种质库不仅是种子的守护者，更是未来农业发展的基石。这些看似平凡的种子，正汇聚成中华民族的繁荣根基，支撑着农业强国的梦想。\u003c/p>","questions":[{"qid":"13319302","cat":"逻辑填空","stem":"依次填入文中画横线部分最恰当的一项是：","options":{"A":"积蓄 安家","B":"蕴藏 休憩","C":"涵养 冬眠","D":"勃发 修炼"},"answer":"A","explanation":"本题可从第二空入手。根据“种子诺亚方舟”可知，横线处应体现国家作物种质库像诺亚方舟一样，将无数跨越时空的种子安置起来，使其存活下来。A项“安家”指安置家庭，置于此处能够生动形象地体现出种子在种质库中存活的状态，符合文意，保留。B项“休憩”指休息，C项“冬眠”指某些动物在寒冷的冬季休眠，D项“修炼”指道家修养练功、炼丹等活动，均与文意不符，排除。\n第一空，代入验证。横线处应体现种子与“生命的力量”之间的关系，且根据“一粒粒种子正悄然从土壤中苏醒”可知，横线处应体现种子具有了生命的力量。A项“积蓄”指积聚、储存，符合文意，当选。\n故正确答案为A。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":21,"missingImage":false},{"qid":"13319303","cat":"片段阅读","stem":"关于“超低温保存”种质资源，下列表述与文意相符的是：","options":{"A":"未必都需要使用液氮罐保存作物的种子","B":"大都需要与种质资源圃保存法配套使用","C":"可有效减少自然灾害对种质资源的影响","D":"可以直接保存芒果这类热带水果的种子"},"answer":"C","explanation":"A项：根据第四段“超低温保存需要用到的工具是液氮罐”可知，选项表述与文意相悖，排除。\nB项：根据第五段“但是植株在露天环境中，会面临自然灾害以及病虫害威胁。为了应对这个情况，在种质资源圃保存的基础上，配套超低温保存······这样就能够永久保存下来”可知，种质资源圃保存法与超低温保存法配套使用效果会更好，但并未提及大都需要配套使用，无中生有，排除。\nC项：根据第五段“但是植株在露天环境中，会面临自然灾害以及病虫害威胁。为了应对这个情况，在种质资源圃保存的基础上，配套超低温保存······这样就能够永久保存下来”可知，选项表述正确，当选。\nD项：根据第六段“虽然芒果有种子，但很多芒果果核很大，不能忍耐脱水、不能耐受低温，所以一般也不能放在低温种子库保存，就需要把芒果种子的胚，即生长点取下来，经过一系列处理之后放到液氮里保存”可知，选项表述与文意相悖，排除。\n故正确答案为C。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":22,"missingImage":false},{"qid":"13319305","cat":"片段阅读","stem":"根据文意推断，在国家作物种质库里，玉米最可能采用的保存方式是：","options":{"A":"低温种子保存","B":"试管苗保存","C":"超低温保存","D":"种质资源圃保存"},"answer":"A","explanation":"A项：根据第四段“种质资源最主要的保存方式是低温种子保存，国家作物种质库采用\u003cimg data-k=\"d3282721e766\">低温和45%以下相对湿度保存种子。全球约有90%的种质资源是以种子形式保存的”可知，玉米作为有种子的作物，最有可能采用低温种子保存的方式，当选。\nB、C两项：根据第七段“超低温和试管苗，主要都是用来保存无性繁殖作物和一些多年生的作物”可知，玉米并非无性繁殖或多年生作物，通常不会通过试管苗、超低温的方式保存，均排除。\nD项：根据第五段“像香蕉这些没有种子的作物，通常是把一棵一棵的植株种到种质资源圃里保存，这是无性繁殖作物种质资源非常重要的一种保存方式”可知，玉米为有种子的作物，通常不会通过种质资源圃方式保存，排除。\n故正确答案为A。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":23,"missingImage":false},{"qid":"13319306","cat":"片段阅读","stem":"作者在介绍国家作物种质库诸多特点时，重点说明的是：","options":{"A":"容量大且独一无二","B":"保存方式齐备完善","C":"管理方式精准智能","D":"设计理念别具匠心"},"answer":"B","explanation":"文章第二段总体介绍了国家作物种质库“容量大”“保存方式体系化”“实现了自动化信息化管理”这三个特点，但文章第四至八段分别详细介绍了低温种子保存、种质资源圃保存、超低温保存、试管苗保存等多种保存方式及其适用情况等内容，故作者在介绍国家作物种质库诸多特点时，重点说明的是其保存方式多样化、体系化，对应B项。\nA、C、D三项：A项“容量大”、C项“管理方式”、D项“设计理念”均只是简单提及，并未展开重点说明，排除。\n故正确答案为B。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":24,"missingImage":false},{"qid":"13319307","cat":"片段阅读","stem":"下列最适合做这篇文章标题的是：","options":{"A":"作物种质库里的未来农业","B":"平凡的种子，不平凡的“家”","C":"国家作物种质库：生命的起点","D":"“种子诺亚方舟”守护农业火种"},"answer":"D","explanation":"文章第一段引出“种子诺亚方舟”的话题，即国家作物种质库的概念，第二段介绍了国家作物种质库的三个特点，第三段介绍了作物种质资源的重要作用及种质资源库的使命，第四至八段详细介绍了种质资源的保存方式，第九段总结全文，再次指出种子和国家作物种质库的重要意义，即国家作物种质库不仅是种子的守护者，更是未来农业发展的基石。故文章主要围绕“种子诺亚方舟”即国家作物种质库展开，强调其对保护种子、支撑我国成为农业强国的重要性，D项契合文章中心，且表述生动形象，当选。\nA项：文章强调的是国家作物种质库对保护种子、支撑我国成为农业强国的重要性，而非单纯阐述“作物种质库”与“未来农业”的关系，偏离文章中心，排除。\nB项：“不平凡的‘家’”表述不明确，没有突出国家作物种质库对保护种子、支撑我国成为农业强国的重要性，排除。\nC项：“生命的起点”概念范围扩大，文章仅强调“保护种子”，偏离文章中心，排除。\n故正确答案为D。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":25,"missingImage":false},{"qid":"13319266","cat":"片段阅读","stem":"在江苏，自动驾驶已成为创新技术重塑物流运输产业的重要载体。搭载多类型传感器的智慧重型卡车，一旦切换到智能辅助驾驶状态，驾驶员就变身为安全员，只需坐在车上监管，智慧重型卡车会根据实时路况减速、避让或变道。除了智慧重型卡车，应用于港口的自动驾驶集装箱卡车也已完成技术验证的初始阶段，驶入了大规模商业应用的快车道。行驶在物流园区与制造业企业之间的自动驾驶物流车，则在智驾系统助力下，实现了物流业与制造业的深度融合。\n这段文字重在说明：","options":{"A":"自动驾驶在江苏的应用场景已经越来越广阔","B":"物流车应用智能技术使得驾驶员获得了解放","C":"自动驾驶促进了江苏物流运输业的发展升级","D":"物流车因智能技术的加持应用范围不断扩大"},"answer":"C","explanation":"文段开篇指出自动驾驶成为江苏地区创新技术重塑物流运输产业的重要载体，接着通过智慧重型卡车、自动驾驶集装箱卡车、自动驾驶物流车的例子，对前文进行举例论证，具体说明自动驾驶在江苏物流运输领域的应用和积极影响。故文段重点强调自动驾驶促进江苏地区重塑物流运输产业，对应C项。\nA项：“应用场景已经越来越广阔”表述不明确，文段强调自动驾驶在江苏物流运输业的应用，排除。\nB项：“驾驶员获得了解放”对应举例论证的部分内容，非重点，排除。\nD项：“智能技术”范围扩大，文段的主题词为“自动驾驶”，排除。\n故正确答案为C。\n【文段出处】人民日报《自动驾驶，让货运更智慧》","no":26,"missingImage":false},{"qid":"12100969","cat":"片段阅读","stem":"近年来，网购发展势头迅猛，各类购物节层出不穷。每到大促销那几天，网络延迟、抢不到货、运力紧张等问题会直接影响消费者购物体验。为此，商家和平台想出了很多应对方法，预售便是其中之一。预售最直接的好处，就是提前知道能卖多少。通过预售，能对未来销售量作出较为精准的预测，从而解决备货和周转问题。如果遇到购物节，预售还能提前制造话题、增加活动曝光度，唤醒消费者的潜在需求。预售打了个时间差，也缓解了平台在购物节期间的流量压力。\n这段文字意在说明：","options":{"A":"网络商家和平台选择预售模式的原因","B":"网络购物节期间预售发挥的重要作用","C":"预售能提升消费者促销期间购物体验","D":"预售的好处是能刺激消费者购物需求"},"answer":"A","explanation":"文段开篇指出在大促销的时候会出现一些影响消费者购物体验的问题，接着通过“应对方法”给出对策，即预售，然后从多个方面详细解释了预售的好处。故文段重点在于对策，强调商家和平台选择预售的模式来解决大促销期间购物产生的问题，对应A项。\nB项：“预售发挥的重要作用”对应解释说明的内容，非重点，排除。\nC项：“提升消费者促销期间购物体验”表述片面，文段说的是除了消费者获得好处外，商家和平台也获得了好处，排除。\nD项：“刺激消费者购物需求”对应解释说明的内容，非重点，且表述片面，排除。\n故正确答案为A。\n【文段出处】经济日报《商家为什么爱预售》","no":27,"missingImage":false},{"qid":"13319272","cat":"片段阅读","stem":"口口相传的经验是讲故事的人的灵感来源。在劳动的氛围中讲故事，是一种交流方式。每一个讲故事的人都会在故事中留下自己的痕迹，就像制陶人会在陶器上留下自己的印记一样。人在放松的状态下听故事，内心会想记下这些故事，并有对他人转述故事的愿望，这就构成了听故事的人与讲故事的人之间的关系。讲故事的人就像智者一样，能讲出自己的人生经验，也能讲出他人的经验、历史的经验，他们能让故事的火把生活的灯芯点燃。\n这段文字中“在故事中留下自己的痕迹”的含义最有可能是：","options":{"A":"每个故事都会被讲故事的人加入一些自身经历","B":"讲故事的人会结合个人阅历对故事进行再加工","C":"讲故事的人会向听故事的人讲自己的人生经验","D":"每个故事在被多个人讲述之后内容会发生变化"},"answer":"B","explanation":"文段开篇表明讲故事的人的灵感源于口口相传的经验，接着指出讲故事的人会在故事中留下自己的痕迹，并用制陶人做类比，强调讲故事的人会在故事中留下属于自己的印记，然后从听故事的人的角度，阐述听故事的人与讲故事的人之间的互动关系，最后把讲故事的人比作智者，强调他们既能讲出自己的人生经验，也能传达他人的经验和历史的经验，进一步说明讲故事的人会在故事中留下属于自己的独特印记。故“在故事中留下自己的痕迹”指的是讲故事的人会在故事中加入自己的人生经验，或者自己对他人经验、历史经验的理解，对应B项。\nA、D两项：“每个故事”主体错误，文段中“留下自己的痕迹”的主体应该是“讲故事的人”，均排除。\nC项：“讲自己的人生经验”表述片面，文段提到讲故事的人还能讲他人的经验和历史的经验，排除。\n故正确答案为B。\n【文段出处】网易《火与灯芯》","no":28,"missingImage":false},{"qid":"13319269","cat":"片段阅读","stem":"司法建议最初源于行政诉讼。近年来，司法建议的适用范围不断拓展，从保障法院裁判执行措施，进阶升级为社会矛盾纠纷的预防性机制。司法建议既是对传统“治未病”理念的继承，也是对新时代“枫桥经验”的一项创新性实践。通过司法建议，对案件审理过程中发现的可能影响社会和谐的隐患或因素提出建议，以预防纠纷再次发生。有效的司法建议不仅能预先准确找出矛盾纠纷产生的原因，还能进一步提升法院的权威，彰显司法的人文关怀。\n下列关于司法建议的说法，与文意不符的是：","options":{"A":"适用范围正在逐步地扩大","B":"不会弱化司法机关的权威","C":"可有效避免社会矛盾产生","D":"是一种更柔性的治理方式"},"answer":"C","explanation":"A项：根据“近年来，司法建议的适用范围不断拓展”可知，该项表述正确，排除。\nB项：根据“有效的司法建议不仅能预先准确找出矛盾纠纷产生的原因，还能进一步提升法院的权威”可知，该项表述正确，排除。\nC项：根据“近年来，司法建议的适用范围不断拓展，从保障法院裁判执行措施，进阶升级为社会矛盾纠纷的预防性机制”“通过司法建议，对案件审理过程中发现的可能影响社会和谐的隐患或因素提出建议，以预防纠纷再次发生”可知，司法建议目前只能起到“预防社会矛盾纠纷”“预防纠纷再次发生”的作用，“有效避免社会矛盾产生”表述过于绝对，当选。\nD项：根据“有效的司法建议不仅能······还能······彰显司法的人文关怀”可知，该项表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明日报《司法建议：为柔性治理提供一副“良方”》","no":29,"missingImage":false},{"qid":"13319281","cat":"片段阅读","stem":"有关数据显示：2024年1—7月，高端装备制造业销售收入同比增长8.3%，占制造业总销售收入的比重为16.5%，较上年同期提高0.5个百分点；智能设备制造业销售收入同比增长12.4%；高耗能制造业销售收入占制造业比重为30.7%，较上年同期下降0.8个百分点，节能降耗工作有序推进；制造业企业采购环境治理服务金额同比增长6.2%，增速较2023年加快2.4个百分点，治污投入不断加大。\n这段文字重在说明：","options":{"A":"制造业持续不断在国民经济发展中起领跑作用","B":"经济发展亮点频现呈现出持续向好的发展态势","C":"制造业正向高端化智能化绿色化发展扎实推进","D":"经济发展与生态治理齐头并进为实现双赢努力"},"answer":"C","explanation":"文段首先列举了2024年1—7月高端装备制造业销售收入增长的数据，接着通过分号进行衔接，列举了智能设备制造业销售收入增长、高耗能制造业销售收入降低的数据，以及制造业企业采购环境治理服务金额增长的数据。故文段为由分号衔接的并列结构，需全面概括，强调制造业正在向着高端、智能、低耗能、少污染的方向发展，对应C项。\nA项：“领跑作用”文段并未提及，无中生有，排除。\nB、D两项：均缺少文段核心话题“制造业”，排除。\n故正确答案为C。\n【文段出处】人民日报《透过增值税发票看经济亮点》","no":30,"missingImage":false},{"qid":"12100985","cat":"片段阅读","stem":"海洋牧场，顾名思义就像是在海洋中建设“牧场”，如同在大草原上放牧牛羊一样，通过科学规划和管理，对鱼、虾、贝、藻等海洋资源进行有计划的海上牧养。有专家推算，海洋向人类提供食物的能力，相当于全世界陆地耕地面积所提供食物的1000倍。在全球粮食供应矛盾日益突出的今天，解决好中国这个人口大国的吃饭问题、保障粮食安全，要树立大食物观，既向陆地要食物，也向海洋要食物，建设海上牧场、“蓝色粮仓”。\n最适合做这段文字标题的是：","options":{"A":"渔牧齐抓，保障粮食安全","B":"陆海兼收，树立大食物观","C":"“牧场”，奏响“深海乐章”","D":"“种粮”于海，打造“蓝色粮仓”"},"answer":"D","explanation":"文段开篇对“海洋牧场”的概念进行解释，指出其像在大草原上放牧一样，在海洋中对鱼、虾等海洋资源进行有计划的牧养，接着通过专家推算强调海洋提供食物的能力巨大，最后介绍在全球粮食供应矛盾日益突出的背景下，解决好中国的吃饭问题、保障粮食安全，要树立大食物观，既向陆地要食物，也向海洋要食物，需建设海上牧场、“蓝色粮仓”。故文段重点强调要建设海洋牧场来保障粮食安全，对应D项。\nA、B两项：A项“渔牧齐抓”和B项“陆海兼收”均表述宏观，没有突出“海洋牧场”这一核心内容，文段重点强调在海洋中进行类似于在陆地上放牧的行为，排除。\nC项：偏离文段核心话题“粮食”，排除。\n故正确答案为D。\n【文段出处】今日头条《发展海洋牧场，建设“蓝色粮仓”，这两件事要做好》","no":31,"missingImage":false},{"qid":"13319268","cat":"片段阅读","stem":"“N无”的极简婚礼已成为年轻人婚礼的新趋势，包括“三无”“四无”“五无”婚礼。具体指的是无早起、无接亲、无仪式、无车队、无煽情、无主持、无婚纱、无接亲堵门、无场地布置、无伴娘伴郎等各种“无”的随意搭配组合。他们取消有当众表演之嫌的过度煽情催泪环节，使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车，结束后作为伴手礼赠予亲朋。这些对婚礼的“整顿”，实则是年轻人追求“实用主义”与自我满足在婚礼中的表现。\n下列关于极简婚礼的说法，与文意不符的是：","options":{"A":"让传统、现代和个性在婚礼中更好融合","B":"是对固有的婚礼模式和长辈安排的反抗","C":"年轻人在婚礼中的消费越来越回归理性","D":"年轻人在婚礼中的表现越来越尊重内心"},"answer":"B","explanation":"A项：根据“具体指的是······各种‘无’的随意搭配组合。他们取消有当众表演之嫌的过度煽情催泪环节，使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，“随意搭配组合”体现出个性，结合“使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，既有对传统环节的沿用，也体现出现代性，该项表述正确，排除。\nB项：“对固有的婚礼模式和长辈安排的反抗”文段未提及，无中生有，当选。\nC项：根据“使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，“使用简单环保的装饰”及“用蔬果布置”体现出年轻人在婚礼消费中的理性，该项表述正确，排除。\nD项：根据“这些对婚礼的‘整顿’，实则是年轻人追求‘实用主义’与自我满足在婚礼中的表现”可知，“尊重内心”表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】中国青年报《“整顿”的风吹到了婚礼》","no":32,"missingImage":false},{"qid":"13319277","cat":"片段阅读","stem":"数字货币利用大数据与区块链技术，能够高效记录并存储交易信息及货币流向。这种技术的应用使得货币的创造、流通和监控过程变得更加透明和高效。具体来说，大数据技术的运用使得货币政策的制定者可以快速获取大量实时的经济活动数据，极大提高了数据的准确性和政策制定的针对性。区块链技术的特性——分布式账本，为货币流通提供了一个安全可靠的环境，确保了交易信息的不可篡改和实时追踪，降低了监控成本并减少了实施滞后。此类技术革新为中央银行在制定和实施货币政策时提供了强大的数据支撑，使政策更加精准地匹配经济情况的实际需求。\n这段文字重在说明：","options":{"A":"数字货币使货币政策的制定实施更精准和高效","B":"数字货币在金融监管方面具有较大的应用价值","C":"大数据与区块链技术有利于推动宏观经济发展","D":"大数据与区块链技术为货币流通提供安全保障"},"answer":"A","explanation":"文段开篇引出“数字货币”这一概念，指出其利用大数据与区块链技术使得货币的创造、流通和监控过程变得更加透明和高效，接下来通过“具体来说”分别从大数据技术可提高数据的准确性、政策制定的针对性以及区块链技术能降低监控成本并减少实施滞后这两方面对数字货币的作用进行解释说明，尾句通过指代词“此类技术革新”指代前文内容，得出结论，强调数字货币能为中央银行制定和实施货币政策时提供数据支撑，让政策更精准匹配需求。故文段重点强调数字货币对货币政策的正向作用，主题词为“数字货币”与“货币政策”，对应A项。\nB项：“在金融监管方面具有较大的应用价值”对应文段中数字货币的一项作用，除此之外，数字货币还有“创造”“流通”等方面的作用，选项表述片面，且选项并未提及文段主题词“货币政策”，偏离文段重点，排除。\nC项：“推动宏观经济发展”概念范围扩大，文段仅论述“货币政策”，且选项并未提及文段主题词“数字货币”与“货币政策”，排除。\nD项：“安全保障”对应文段解释说明中“区块链技术”的作用，属于数字货币中的一项技术运用，非重点且表述片面，另外选项并未提及文段主题词“数字货币”与“货币政策”，排除。\n故正确答案为A。","no":33,"missingImage":false},{"qid":"12100972","cat":"语句表达","stem":"近年来，随着科技的发展，AI已经深入到文艺创作的各个领域，并逐渐兴起一场艺术创作模式革命。在流行音乐领域，一批AI作曲软件快速迭代升级，有效推动了新作品的结构优化，增强了旋律扩写能力，一定程度上促进了流行音乐作品的优胜劣汰。AI创作门槛越来越低，使得“全民制作人”成为可能。此种背景下，                    ，成为热门话题。\n填入画横线部分最恰当的一项是：","options":{"A":"AI对流行音乐创作影响几何","B":"流行音乐人应如何利用AI创作","C":"AI作曲软件如何促成全民制作人","D":"流行音乐领域未来如何与AI共生"},"answer":"A","explanation":"横线出现在文段结尾，且为尾句的分句，故需结合横线前内容以及横线所在尾句内容进行分析。文段开篇提到AI深入文艺创作的各个领域，并带来一场艺术创作模式革命，接着具体阐述AI在流行音乐领域所带来的影响，指出AI作曲软件的升级促进了流行音乐作品的优胜劣汰以及AI创作门槛低使“全民制作人”成为可能，尾句通过“此种背景下”总结前文，横线后指出“成为热门话题”。故横线处应继续围绕“AI”和“流行音乐创作”进行论述，概括AI对流行音乐创作产生的影响，对应A项。\nB项：“流行音乐人应如何利用AI创作”表述错误，文段重点论述AI对流行音乐创作整体产生的影响，排除。\nC项：“AI作曲软件如何促成全民制作人”只是AI影响流行音乐创作的一个方面，表述片面，排除。\nD项：“流行音乐领域未来如何与AI共生”强调的是未来的共生关系，而文段更多是在论述当下AI对流行音乐创作已经产生的影响，排除。\n故正确答案为A。\n【文段出处】光明网《AI作曲：会给流行音乐带来什么》","no":34,"missingImage":false},{"qid":"13319282","cat":"片段阅读","stem":"地震预警不等于预测。地震预警简单来说，就是利用两个“时间差”。地震发生时，会产生两种重要的地震波：一种是速度较快但震动较弱的纵波，一种是速度较慢但震动较大的横波。地震发生后，地震仪捕捉到纵波，对地震波信息进行快速处理，计算出地震参数、影响程度和预警时间。抢在横波到达之前，将信息通过更快的电磁波形式分发。目前我国已建设了很多地震预警监测台站，覆盖数十个省份，形成了世界上规模最大的地震预警网。\n下列说法与文意不符的是：","options":{"A":"可以凭借纵横波时间差进行地震预测","B":"地震横波比地震纵波产生的危害更大","C":"地震纵波可先于横波被地震仪捕捉到","D":"通过地震预警可以尽早得知地震信息"},"answer":"A","explanation":"A项，根据“地震预警不等于预测······一种是速度较慢但震动较大的横波”可知，“地震预测”偷换概念，当选；\nB项，根据“一种是速度较快但震动较弱的纵波，一种是速度较慢但震动较大的横波”可知，通常震动越大危害相对越大，表述正确，排除；\nC项，根据“地震发生后，地震仪捕捉到纵波······抢在横波到达之前······”可知，表述正确，排除；\nD项，根据“地震发生后，地震仪捕捉到纵波，对地震波信息进行快速处理······将信息通过更快的电磁波形式分发”可知，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】澎湃新闻《地震预警来临的几秒钟内，我们可以做什么？》","no":35,"missingImage":false},{"qid":"12100975","cat":"片段阅读","stem":"日常生活中，用来加工米饭、馒头等主食的原料，几乎都来自禾本科植物。在成为主食重要来源的过程中，禾本科植物经历了漫长的进化和选择阶段。在长期的物种进化中，野生种经过天然杂交、遗传物质自然加倍，以及异常气候及环境胁迫导致的自然选择，逐步形成了人类可以作为食物进行种植的禾本科植物类型。禾本科植物适应性强，易于推广种植，其籽粒便于储藏、加工，且营养丰富。禾本科植物分布范围广，抗逆性比较强，遗传多样性丰富，因此在不同类型环境中都能种植，并获得较理想的产量。\n这段文字重在说明：","options":{"A":"禾本科植物适应性强且便于种植","B":"禾本科植物成为主食主要原料的缘由","C":"禾本科植物籽粒的营养十分丰富","D":"禾本科植物经历的进化和选择的过程"},"answer":"B","explanation":"文段开篇指出禾本科植物是主食的主要原料，接着说明禾本科植物在成为主食重要来源的过程中，经历了漫长的进化和选择阶段，并具体说明了其形成人类可以作为食物进行种植的禾本科植物类型的进化过程，随后论述禾本科植物自身的特点和种植优势。故文段重在强调禾本科植物成为主食主要原料的原因，对应B项。\nA、C两项：均对应禾本科植物优势中的一部分，表述片面，排除。\nD项：“禾本科植物经历的进化和选择的过程”非重点，排除。\n故正确答案为B。\n【文段出处】人民网《主食为何大多来自禾本科？》","no":36,"missingImage":false},{"qid":"13319280","cat":"片段阅读","stem":"作为一类代谢功能多样的特殊微生物，光合细菌具有强大的生化催化能力和营养益生功能，可以制备多种多样的生物制剂。目前国内科研院所和医药厂商对光合细菌在医药产品开发领域的研究仍处于起步阶段。随着科学技术水平不断进步，研究者对光合细菌类群特殊代谢能力的理解将进一步加深，有助于持续激发该类细菌的产业化潜力。除生产新式治疗药物外，还可利用光合细菌适应极端环境的生存优势，结合基因工程技术，设计开发工程菌株，通过微生物催化作用实现分子结构重组，用以大量生产重要原料药物，或可替代化学制药技术。总体而言，深度拓展光合细菌在医药研究领域的研究，具有良好的应用前景与实践意义，有望推动微生物制药工程可持续发展。\n从这段文字提取关键词最恰当的一项是：","options":{"A":"特殊微生物 光合细菌 生物制药","B":"特殊微生物 代谢能力 产业化","C":"光合细菌 产业化 制药技术","D":"光合细菌 代谢功能 医药应用"},"answer":"D","explanation":"文段开篇引出“光合细菌”这一话题，指出其可以制备多种多样的生物制剂，接着指出虽然目前国内对光合细菌在医药产品开发领域的研究处于起步阶段，但是随着科技水平的进步，研究者对光合细菌的代谢能力的理解将进一步加深，有助于激发其产业化潜力，其可用于生产药物或替代化学制药技术，最后通过“总体而言”进行总结，强调拓展光合细菌在医药研究领域的研究有良好的应用前景与实践意义。故文段围绕光合细菌在医药方面的应用展开论述，D项“光合细菌”“代谢功能”“医药应用”能够很好地概括文段重点，当选。\nA项：“特殊微生物”非重点，排除。\nB项：缺少文段主题词“光合细菌”，偏离文段中心，排除。\nC项：“制药技术”表述片面，无法全面概况光合细菌在医药方面的应用，且“产业化”非重点，排除。\n故正确答案为D。\n【文段出处】知网《光合细菌代谢与其在医药领域的应用》","no":37,"missingImage":false},{"qid":"13319285","cat":"逻辑填空","stem":"目前，我国快递业务已经达到了前所未有的新高度，业务量已突破1000亿件大关。快递物流是经济活力            的“风向标”，不仅            出行业的蓬勃跃升，更彰显了我国经济的繁荣活力与无限潜能。\n依次填入画横线部分最恰当的一项是：","options":{"A":"毋庸置疑 显示","B":"名副其实 映照","C":"当之无愧 折射","D":"理所当然 展示"},"answer":"B","explanation":"本题所给选项较为接近，需对比择优。第一空，根据“目前，我国快递业务已经达到了前所未有的新高度，业务量已突破1000亿件大关”与“快递物流是经济活力······的‘风向标’”可知，横线处应体现快递物流作为经济活力的“风向标”这个名称与实际是相符的。B项“名副其实”指名称或名声与实际相符合，符合文意，保留。A项“毋庸置疑”指无须怀疑，侧重强调确定性，D项“理所当然”指从道理上讲应该这样，侧重强调合理性，C项“当之无愧”指完全当得起，没有惭愧和不足的地方，多用于积极的语境，而“风向标”能够反映事物发展的趋势与方向，感情色彩为中性，且文段中“业务量已突破1000亿件大关”仅为客观事实的陈述，侧重于客观和名称相符合，故三项均不符合文意，均排除。\n第二空，代入验证。根据“更彰显了我国经济的繁荣活力与无限潜能”可知，快递行业的业务量能够体现出行业的蓬勃发展。B项“映照”指照射，能形象地表达出快递物流映射出行业的蓬勃跃升，当选。\n故正确答案为B。\n【文段出处】红网《快递业务突破千亿件：“小包裹”跑出“大经济”》","no":38,"missingImage":false},{"qid":"12100976","cat":"逻辑填空","stem":"在全世界地质学家和古生物学家的共同努力下，地球演化史的时间框架已经建立，国际年代地层表也就            ，并且国际地层委员会每年都会对其进行优化更新。随着国际年代地层表的            ，世界各国的地质学家可以更好地研究地球的构造与变化，为保护地球、服务人类生态文明建设做出贡献。\n依次填入画横线部分最恰当的一项是：","options":{"A":"水到渠成 精益求精","B":"呼之欲出 大功告成","C":"应运而生 日臻完善","D":"瓜熟蒂落 精雕细琢"},"answer":"C","explanation":"本题可从第二空入手。根据前文“国际地层委员会每年都会对其进行优化更新”可知，横线处所填成语应体现不断优化更新之意。C项“日臻完善”指一天天逐步达到完美的境地，符合文意，保留。A项“精益求精”比喻已经很好了，还要求更好，主语通常为人，与“国际年代地层表”搭配不当，排除。B项“大功告成”指巨大工程或重要任务宣告完成，侧重完成，与文意不符，排除。D项“精雕细琢”形容做事仔细用心，与“国际年代地层表”搭配不当，排除。\n第一空，代入验证。根据“在全世界地质学家······时间框架已经建立”可知，横线处所填成语应体现在地球演化史的时间框架建立这一背景下，国际年代地层表随之产生。C项“应运而生”指随着某种形势而产生，符合文意，当选。\n故正确答案为C。\n【文段出处】《地球的年龄怎么算？》","no":39,"missingImage":false},{"qid":"12100977","cat":"逻辑填空","stem":"金秋十月，正是新疆最美的时节。天山南北片片胡杨林叠翠流金，城市间平坦宽敞的马路            ，现代化建筑            ，一座座现代化城市吸引着来自四面八方的游客。\n依次填入画横线部分最恰当的一项是：","options":{"A":"参差交错 比比皆是","B":"整齐划一 巍然挺立","C":"纵横交错 鳞次栉比","D":"秩序井然 错落有致"},"answer":"C","explanation":"第一空，搭配“马路”，且根据文意与选项内容可知，横线处需体现城市间平坦宽敞的马路的布局。C项“纵横交错”指横的、竖的交叉在一起，能形象地体现出马路横竖交叉的布局，与实际情况相符，且符合语境，保留。A项“参差交错”指各种不同的事物错综复杂地交织在一起，用于此处表示马路规划不整齐、交叉混乱，与“平坦宽敞”的马路规划不符，排除；B项“整齐划一”指有条有理，全都一样，用于形容马路的分布情况程度过重，马路的铺设无法做到完全一致，与实际不符，排除；D项“秩序井然”形容有次序、条理分明的样子，多用于形容管理有序的场景，而非马路的分布情况，排除。\n第二空，代入验证。横线处搭配“现代化建筑”。C项“鳞次栉比”形容房屋等密集整齐地排列，符合现代化建筑排列紧密有序的特点，符合文意，当选。\n故正确答案为C。\n【文段出处】新华网《天山长城 大漠华章——新疆生产建设兵团成立70周年综述》","no":40,"missingImage":false},{"qid":"13319289","cat":"逻辑填空","stem":"中华法系形成于秦朝，至隋唐日趋成熟，宋元明清时期        形成了影响深远的成文法典，在历史发展中        而成的中华法系彰显了中华优秀传统法律文化自我发展、回应挑战的主体性与生命力，也反映了中华文明            的延续性。\n依次填入画横线部分最恰当的一项是：","options":{"A":"陆续 积淀 源远流长","B":"相继 淬炼 一脉相承","C":"渐次 聚集 薪火相传","D":"稳步 嬗变 生生不息"},"answer":"B","explanation":"第一空，根据“中华法系形成于秦朝······形成了影响深远的成文法典”“延续性”可知，横线处所填词语应体现时间的连续性。A项“陆续”表示前后相继，时断时续，B项“相继”指一个跟着一个，连续不断，C项“渐次”指逐步、渐渐，均符合文意，保留。D项“稳步”比喻有把握地按一定步骤进行，与文意不符，排除。\n第二空，根据文意可知，横线处所填词语应体现中华法系不断完善的形成过程。A项“积淀”指积累沉淀，B项“淬炼”指反复经受考验，磨炼，均符合文意，保留。C项“聚集”指集合、凑在一起，多指不同空间的事物聚合在一块儿，无法体现前文所述的不断完善的过程，与文意不符，排除。\n第三空，根据“中华法系形成于秦朝······形成了影响深远的成文法典”“中华法系彰显了中华优秀传统法律文化自我发展······的延续性”可知，横线处所填成语应体现连贯性，连续性。B项“一脉相承”指从同一个血统或派别世代承接流传下来，符合文意，当选。A项“源远流长”比喻历史悠久，根底深厚，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明日报《从优秀传统法律文化看中华文明的突出特性》","no":41,"missingImage":false},{"qid":"13319295","cat":"逻辑填空","stem":"对于人类而言，“逝去之物”总具有独特的魅力。人们难以遏制对“起源”的遐想，并做出            般的追问。考古发掘让早已湮灭的文明再见天日，通过窥探遗迹的里里外外、角角落落，用发现的物证来        历史的图景。文物既旧也新，它不仅可以证实或证伪我们关于历史的记忆和想象，更重要的是复活了被遗忘的文明的璀璨艺术，让那些            的美再次绽放。\n依次填入画横线部分最恰当的一项是：","options":{"A":"剥茧抽丝 再现 深藏不露","B":"愚公移山 组合 巧夺天工","C":"精卫填海 拼合 不为人知","D":"夸父逐日 还原 不可替代"},"answer":"D","explanation":"第一空，根据“人们难以遏制对‘起源’的遐想”以及“追问”可知，横线处应体现人们对探索、追求“起源”的坚决、执着之意。B项“愚公移山”比喻以顽强的毅力和不怕困难、人定胜天的斗争精神去征服自然、改造世界，C项“精卫填海”比喻不畏艰难，不达目的誓不罢休的坚强意志，D项“夸父逐日”比喻决心很大，均符合文意，保留。A项“剥茧抽丝”形容分析事物极为细致，而且一步一步很有层次，无法体现执着之意，与文意不符，排除。\n第二空，横线处应与“物证”及“历史的图景”搭配，且由“早已湮灭的文明再见天日”及“复活了被遗忘的文明的璀璨艺术”可知，横线处重点强调通过物证来让历史图景重现之意。D项“还原”指事物恢复原状，与“物证”“历史的图景”均搭配恰当，且符合文意，保留。B项“组合”指组织成为整体，C项“拼合”指合在一起，组合，均无法体现“重现”之意，且均与“历史的图景”搭配不当，排除。\n第三空，代入验证。横线处应与“美”搭配，且根据“‘逝去之物’总具有独特的魅力”可知，横线处应体现文物、文明之美的特殊性。D项“不可替代”指某人或某物是不能够用他人或他物来进行代替的，符合文意，且与“美”搭配恰当，当选。\n故正确答案为D。\n【文段出处】中国社会科学网《文物中的文明与艺术》","no":42,"missingImage":false},{"qid":"13319294","cat":"逻辑填空","stem":"中国探月20年，拉近了            与普通公众生活的距离。当一粒棉花种子在月球上生根发芽，当月球车玉兔微博下满是网友的祝福，当中小学教材换上了崭新的中国月面图······越来越多的人与探月工程的某项成果、某个侧面            ，一个共识在人们心中不断        ：我们离月球并不遥远！\n依次填入画横线部分最恰当的一项是：","options":{"A":"碧海青天 邂逅相逢 汇集","B":"浩瀚苍穹 心心相印 回响","C":"星辰大海 不期而遇 凝聚","D":"蟾宫折桂 情投意合 激荡"},"answer":"C","explanation":"第一空，根据后文可知，中国探月20年拉近了太空与普通公众生活的距离。B项“浩瀚苍穹”形容广阔的宇宙，符合文意，保留。C项“星辰大海”比喻未知的领域或遥远的目标，置于此处可用来形容人们所知甚少的太空，符合文意，保留。A项“碧海青天”指碧绿的海，湛蓝的天，形容水天一色，旷远无边；也形容嫦娥在广寒宫夜夜看着空阔的碧海青天，心情孤寂凄凉，后比喻女子对爱情的坚贞，D项“蟾宫折桂”的意思是在月宫中攀折桂花，比喻科举应试得中，均无法用来形容太空，排除。\n第二空，根据“当一粒棉花种子······换上了崭新的中国月面图”可知，横线处应体现越来越多的人接触到了探月成果。C项“不期而遇”指未经约定而意外相遇，可以体现人们接触到了探月工程的某项成果或某个侧面，符合文意，保留。B项“心心相印”形容彼此心意一致，无法与“成果”“侧面”搭配，排除。\n第三空，代入验证 ":"5小时","D":"5.5小时"},"answer":"B","explanation":"用M、N分别表示两架无人机的工作效率，根据题意可得：\u003cimg data-k=\"192628841b2e\">，化简得M：N=2：1。赋值M无人机的工作效率为2，N无人机的工作效率为1，则喷洒整片农田的工作量为2×2+5×1=9，仅由M无人机喷洒农药，那么喷洒完整片农田需要9÷2=4.5小时。\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"13319475","cat":"数学运算","stem":"某市正在深入推进“智改数转网联”升级行动计划，力争实现全市规模以上企业全覆盖。目前，全市规模以上企业2080家，其中未完成升级的规模以上企业比已完成升级的多0.6倍，那么已完成升级的规模以上企业有（    ）。","options":{"A":"780家","B":"800家","C":"1280家","D":"1300家"},"answer":"B","explanation":"设已完成升级的规模以上企业有x家，则未完成升级的规模以上企业有（1+0.6）x=1.6x家。根据题意可得：x+1.6x=2080，解得x=800。\n故正确答案为B。","no":55,"missingImage":false},{"type":"question","qid":"13319478","cat":"数学运算","stem":"甲、乙两瓶质量和浓度均相同的酒精溶液，在甲瓶中加入20克水、乙瓶中加入50克浓度为30%的酒精溶液后，浓度仍然相等。若继续在甲瓶中加入30克纯酒精，溶液又恢复到最初浓度，则乙瓶酒精溶液最初的质量是（    ）。","options":{"A":"100克","B":"110克","C":"120克","D":"150克"},"answer":"A","explanation":"设甲、乙两瓶酒精溶液最初的质量均为m克，浓度均为n。根据题意可知：在甲瓶中加入20克水后，继续在甲瓶中加入30克纯酒精，溶液又恢复到最初浓度。结合公式：浓度\u003cimg data-k=\"5d71429fa4e4\">，可列式：\u003cimg data-k=\"de3a7f26c11d\">，解得n=60%；根据“在甲瓶中加入20克水、乙瓶中加入50克浓度为30%的酒精溶液后，浓度仍然相等”，可列式：\u003cimg data-k=\"44635c24b95f\">。\n方法一：根据公式：\u003cimg data-k=\"bc26665aaeb9\">，可将方程化简为：\u003cimg data-k=\"5d2d166e4401\">，解得m=100。\n方法二：方程正面求解比较复杂，可将选项代入验证，代入A项：\u003cimg data-k=\"57183f436a26\">，等式成立，符合题意，当选。\n故正确答案为A。","no":56,"missingImage":false},{"type":"question","qid":"13319480","cat":"数学运算","stem":"一场演出的节目有舞蹈《水韵江苏》、歌曲《让世界充满爱》和《绣红旗》、小品《幸福一家人》、魔术《奇幻之旅》、杂技《力量》。若要求两首歌曲分别作为开头曲和结尾曲，舞蹈与杂技相邻演出，小品和魔术不能相邻演出，则节目演出的排列顺序有（    ）。","options":{"A":"8种","B":"12种","C":"18种","D":"24种"},"answer":"A","explanation":"根据题意，要求两首歌曲分别作为开头曲和结尾曲，有\u003cimg data-k=\"79ffa592ef20\">种情况；要求舞蹈与杂技相邻演出，故可先将舞蹈和杂技捆绑起来，由于演出有先后顺序，有\u003cimg data-k=\"79ffa592ef20\">种情况；要求小品和魔术不能相邻演出，可用插空法，先将舞蹈和杂技作为整体安排到两首歌曲中间，再将小品和魔术插入中间的2个空中，有\u003cimg data-k=\"79ffa592ef20\">种情况。分步用乘法，则共有2×2×2=8种节目演出的排列顺序。\n故正确答案为A。","no":57,"missingImage":false},{"type":"question","qid":"13319486","cat":"数学运算","stem":"某地考古出土了一种呈长方体的青铜器，测得其长、宽、高分别为60cm、40cm、60cm。为了防止氧化，有关部门为其做个半球形的保护罩，
