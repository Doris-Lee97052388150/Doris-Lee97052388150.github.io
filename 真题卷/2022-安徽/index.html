<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2022-安徽","title":"2022年安徽省公务员录用考试《行测》题（网友回忆版）","year":"2022","group":"安徽","modules":[{"label":"政治理论","items":[{"type":"question","qid":"5102128","cat":"时事政治","stem":"中国共产党十九届六中全会决定，党的二十大将于2022年下半年在北京召开。下列有关党的二十大的说法正确的有几项：\n①党的二十大，是我们党进入全面建设社会主义现代化国家、向第二个百年奋斗目标进军新征程的重要时刻召开的一次十分重要的代表大会\n②代表产生程序的5个主要环节是：推荐提名、组织考察、确定代表候选人初步人选、确定代表候选人预备人选、会议选举\n③党的二十大代表的选举要严格资格条件，坚持把政治标准放在首位\n④党的二十大代表名额共2300名，与十九大时相同","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查政治常识。\n①正确，中国共产党第十九届中央委员会第六次全体会议公报指出：“全会决定，中国共产党第二十次全国代表大会于2022年下半年在北京召开。全会认为，党的二十大是我们党进入全面建设社会主义现代化国家、向第二个百年奋斗目标进军新征程的重要时刻召开的一次十分重要的代表大会，是党和国家政治生活中的一件大事。”\n②正确，二十大代表的产生，要坚持和加强党的全面领导，充分发扬党内民主，采取自下而上、上下结合、反复酝酿、逐级遴选的办法进行。代表产生程序有5个主要环节，即推荐提名、组织考察、确定代表候选人初步人选、确定代表候选人预备人选、会议选举。\n③正确，党中央提出，二十大代表应是共产党员中的优秀分子。要严把人选政治关，坚持把政治标准放在首位，突出考察人选的理想信念、政治品格和道德修养，着重了解人选政治判断力、政治领悟力、政治执行力，增强“四个意识”、坚定“四个自信”、做到“两个维护”等方面的表现情况，对政治上不合格的一票否决。\n④正确，中央组织部负责人就做好二十大代表选举工作接受采访时表示，党中央明确，二十大代表名额共2300名，与十九大时相同。二十大代表名额的分配，主要根据党组织数量和党员人数确定，同时考虑前几次党的全国代表大会代表名额等因素。按照这一分配办法，各选举单位的代表名额，与十九大时基本相同。\n故①②③④说法正确。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"5102121","cat":"新思想","stem":"2022年5月10日，习近平总书记在庆祝中国共产主义青年团成立100周年大会上发表重要讲话，激励广大青年团员在实现中华民族伟大复兴中国梦的新征程上奋勇前进。下列有关中国共产主义青年团表述不正确的是：","options":{"A":"团的地方组织和基层组织同时受同级党委和团的上级组织领导","B":"中国共产主义青年团受中国共产党的委托领导中国少年先锋队的工作","C":"团旗上环绕黄色五角星周围的黄色圆圈，象征中国青年一代紧密团结在中国共产党周围","D":"团员在加入共产党后或年满二十八周岁、没有在团内担任职务的情况下，不再保留团籍"},"answer":"D","explanation":"本题考查政治常识。\nA项正确，《中国共产主义青年团章程》总则规定：“中国共产主义青年团中央委员会受中国共产党中央委员会领导，团的地方组织和基层组织受同级党的委员会领导，同时受团的上级组织领导。”\nB项正确，《中国共产主义青年团章程》总则规定：“中国共产主义青年团受中国共产党的委托领导中国少年先锋队的工作。中国共产主义青年团是中华全国青年联合会的核心团体会员，发挥主导作用。中国共产主义青年团在中国共产党的领导下，指导中华全国学生联合会开展工作。”\nC项正确，《中国共产主义青年团章程》第八章“团旗、团徽、团歌”中的第三十七条规定：“中国共产主义青年团团旗旗面为红色，象征革命胜利；左上角缀黄色五角星，周围环绕黄色圆圈，象征中国青年一代紧密团结在中国共产党周围。”\nD项错误，《中国共产主义青年团章程》第一章“团员”中的第一条第三款规定：“团员加入共产党以后仍保留团籍，年满二十八周岁，没有在团内担任职务，不再保留团籍。”\n本题为选非题，故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"5102129","cat":"新思想","stem":"习近平总书记以统揽全局的战略思维和宽广的世界眼光深刻把握国家安全问题，提出了总体国家安全观。下列相关表述正确的有几项：\n①总体国家安全观是我党历史上第一个被确立为国家安全工作指导思想的重大战略思想\n②《中华人民共和国国家安全法》规定，每年5月15日为全民国家安全教育日\n③总体国家安全观主要聚焦于如何解决好大国发展进程中面临的共性安全问题\n④国家安全机关举报受理电话为12339","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"B","explanation":"本题考查政治常识。\n①正确，《总体国家安全观学习纲要》中明确提出：“总体国家安全观是我们党历史上第一个被确立为国家安全工作指导思想的重大战略思想，是中国共产党和中国人民捍卫国家主权、安全、发展利益百年奋斗实践经验和集体智慧的结晶，是马克思主义国家安全理论中国化的最新成果，是习近平新时代中国特色社会主义思想的重要组成部分，是新时代国家安全工作的根本遵循和行动指南。”\n②错误，《中华人民共和国国家安全法》第一章“总则”第十四条规定：“每年4月15日为全民国家安全教育日。”\n③错误，总体国家安全观从坚持和发展中国特色社会主义的战略高度，系统回答了中国特色社会主义进入新时代，如何既解决好大国发展进程中面临的共性安全问题，同时又处理好中华民族伟大复兴关键阶段面临的特殊安全问题这个重大时代课题，是一个系统完整的科学理论体系，内涵丰富、博大精深，涉及治党治国治军等各个方面，标志着我们党对国家安全基本规律的认识达到了新高度。故不仅是关注“大国发展进程中面临的共性安全问题”，同时也要关注“中华民族伟大复兴关键阶段面临的特殊安全问题”。\n④正确，12339是国家安全机关受理公民和组织举报电话，这条热线是由国家安全部设立的，为了方便公民和组织向国家安全机关举报间谍行为或线索。\n综上，①④正确，②③错误。\n故正确答案为B。","no":3,"missingImage":false},{"type":"question","qid":"5102123","cat":"新思想","stem":"2022年3月，习近平总书记在看望参加政协会议的社会福利和社会保障界委员时强调，要在推动社会保障事业高质量发展上持续用力，织密社会保障安全网，为人民生活安康托底。下列做法有助于推动社会保障事业高质量发展的有几项：\n①加大对因疫因灾遇困群众的临时救助力度\n②保障流浪乞讨人员人身安全和基本生活，关心关爱精神障碍人员\n③健全灵活就业人员社保制度，扩大失业、工伤、生育保险的覆盖面\n④健全社会保障基金监管体系，严厉打击欺诈骗保、套保和挪用贪占各类社会保障资金的违法行为","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查政治常识。\n①②正确，习近平总书记强调：“要加大对因疫因灾遇困群众的临时救助力度，做好残疾人康复、教育、就业等工作，保障流浪乞讨人员人身安全和基本生活，关心关爱精神障碍人员，坚决杜绝欺凌虐待妇女儿童、老年人、残疾人等违法行为。”\n③④正确，习近平总书记强调：“我国已建成世界上规模最大的社会保障体系。要健全灵活就业人员社保制度，扩大失业、工伤、生育保险的覆盖面，实现制度安排更加公平，覆盖范围更加广泛，为人民生活安康托底。要健全社会保障基金监管体系，严厉打击欺诈骗保、套保和挪用贪占各类社会保障资金的违法行为，守护好人民群众的每一分‘养老钱’、‘保命钱’。”\n综上所述，有助于推动社会保障事业高质量发展的有①②③④，有4项。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"5102126","cat":"新思想","stem":"习近平总书记强调，必须深化对新的时代条件下我国各类资本及其作用的认识，规范和引导资本健康发展，发挥其作为重要生产要素的积极作用。下列对资本的认识不准确的是（    ）。","options":{"A":"在社会主义市场经济体制下，资本是带动各类生产要素集聚配置的重要纽带","B":"资本具有逐利本性，如不加以规范和约束，就会给经济社会发展带来不可估量的危害","C":"要加强资本领域反腐败，保持反腐败高压态势，坚决打击以权力为依托的资本逐利行为","D":"要正确处理资本和利益分配问题，既注重维护按劳分配的主体地位，更注重保障资本参与社会分配获得增殖和发展"},"answer":"D","explanation":"本题考查政治常识。\n2022年4月29日，中共中央总书记习近平就依法规范和引导我国资本健康发展进行第三十八次集体学习时发表重要讲话。\nA、B两项正确，习近平总书记在讲话中指出：“要历史地、发展地、辩证地认识和把握我国社会存在的各类资本及其作用。在社会主义市场经济体制下，资本是带动各类生产要素集聚配置的重要纽带，是促进社会生产力发展的重要力量，要发挥资本促进社会生产力发展的积极作用。同时，必须认识到，资本具有逐利本性，如不加以规范和约束，就会给经济社会发展带来不可估量的危害。”\nC项正确，习近平总书记在讲话中指出：“要加强资本领域反腐败，保持反腐败高压态势，坚决打击以权力为依托的资本逐利行为，着力查处资本无序扩张、平台垄断等背后的腐败行为。”\nD项错误，习近平总书记在讲话中指出：“要正确处理资本和利益分配问题。我国社会主义的国家性质决定了我们必须坚持按劳分配为主体、多种分配方式并存，在社会分配中体现人民至上。要注重经济发展的普惠性和初次分配的公平性，既注重保障资本参与社会分配获得增殖和发展，更注重维护按劳分配的主体地位，坚持发展为了人民、发展依靠人民、发展成果由人民共享，坚定不移走全体人民共同富裕的道路。”\n本题为选非题，故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"5102125","cat":"时事政治","stem":"2022年，按照以习近平同志为核心的党中央的部署要求，为稳定宏观经济大盘，稳定上亿市场主体，各部门多措并举优化和落实助企纾困政策，为经济平稳运行提供有力支撑。下列属于“稳主体”对策的是：\n①实施大规模留抵退税政策\n②对特困行业实行阶段性缓缴养老保险费\n③中国人民银行宣布下调金融机构存款准备金率\n④设立3岁以下婴幼儿照护个人所得税专项附加扣除\n⑤央行、银保监会发布个人首套房商贷利率下限调整","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"C","explanation":"本题考查经济常识。\n市场主体是经济的力量载体，保市场主体就是保社会生产力。\n①正确，2022年3月21日，国务院总理李克强主持召开国务院常务会议，确定实施大规模增值税留抵退税的政策安排，为稳定宏观经济大盘提供强力支撑。\n②正确，2022年4月6日，国务院总理李克强主持召开国务院常务会议，决定对特困行业实行阶段性缓缴养老保险费政策，加大失业保险支持稳岗和培训力度；部署适时运用货币政策工具，更加有效支持实体经济发展。\n③正确，为支持实体经济发展，促进综合融资成本稳中有降，中国人民银行决定于2022年4月25日下调金融机构存款准备金率0.25个百分点（不含已执行5%存款准备金率的金融机构），为加大对小微企业和“三农”的支持力度，对没有跨省经营的城商行和存款准备金率高于5%的农商行，在下调存款准备金率0.25个百分点的基础上，再额外多降0.25个百分点。\n④错误，为贯彻落实《中共中央 国务院关于优化生育政策促进人口长期均衡发展的决定》，依据《中华人民共和国个人所得税法》有关规定，国务院决定，设立3岁以下婴幼儿照护个人所得税专项附加扣除。自2022年1月1日起，纳税人照护3岁以下婴幼儿子女的相关支出，在计算缴纳个人所得税前，按照每个婴幼儿每月1000元的标准定额扣除。该项扣除政策有利于减轻人民群众抚养子女负担，体现了国家对人民群众生育养育的鼓励和照顾。属于“保民生”的措施。\n⑤正确，2022年5月15日，央行、银保监会联合发布《关于调整差别化住房信贷政策有关问题的通知》，对于贷款购买普通自住房的居民家庭，首套住房商业性个人住房贷款利率下限调整为不低于相应期限贷款市场报价利率（LPR）减20个基点，二套住房商业性个人住房贷款利率政策下限按现行规定执行。此举对稳定市场预期将起到积极作用，有利于进一步满足刚性和改善性住房需求，促进房地产市场平稳健康发展。\n综上所述，属于“稳主体”对策的是①②③⑤，共4项。\n故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"5102120","cat":"时事政治","stem":"根据十三届全国人大五次会议审议通过的《政府工作报告》，下列属于2022年我国经济发展主要预期目标的是：\n①居民消费价格涨幅3%左右\n②实现高水平科技自立自强\n③国内生产总值增长6.5%左右\n④粮食产量保持在1.3万亿斤以上\n⑤坚持政府过紧日子，更好节用裕民\n⑥居民收入增长与经济增长基本同步","options":{"A":"①③④","B":"①④⑥","C":"②③④","D":"②⑤⑥"},"answer":"B","explanation":"本题考查政治常识。\n①④⑥正确，③错误，2022年《政府工作报告》中“二、2022年经济社会发展总体要求和政策取向”指出：“今年发展主要预期目标是：国内生产总值增长5.5%左右；城镇新增就业1100万人以上，城镇调查失业率全年控制在5.5%以内；居民消费价格涨幅3%左右；居民收入增长与经济增长基本同步；进出口保稳提质，国际收支基本平衡；粮食产量保持在1.3万亿斤以上；生态环境质量持续改善，主要污染物排放量继续下降；能耗强度目标在‘十四五’规划期内统筹考核，并留有适当弹性，新增可再生能源和原料用能不纳入能源消费总量控制。”\n②错误，2021年习近平在中国科学院第二十次院士大会、中国工程院第十五次院士大会和中国科学技术协会第十次全国代表大会上指出：“实践证明，我国自主创新事业是大有可为的！我国广大科技工作者是大有作为的！我国广大科技工作者要以与时俱进的精神、革故鼎新的勇气、坚忍不拔的定力，面向世界科技前沿、面向经济主战场、面向国家重大需求、面向人民生命健康，把握大势、抢占先机，直面问题、迎难而上，肩负起时代赋予的重任，努力实现高水平科技自立自强！”\n⑤错误，2022年《政府工作报告》中“三、2022年政府工作任务”部分的“（一）着力稳定宏观经济大盘，保持经济运行在合理区间”指出：“要坚持政府过紧日子，更好节用裕民。大力优化支出结构，保障重点支出，严控一般性支出。盘活财政存量资金和闲置资产。”\n综上所述，属于2022年我国经济发展主要预期目标的是①④⑥。\n故正确答案为B。","no":7,"missingImage":false}],"count":7,"answerable":7,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"5102118","cat":"人文常识","stem":"2022年，中央一号文件《中共中央 国务院关于做好2022年全面推进乡村振兴重点工作的意见》明确提出“三农”工作的首要任务是“全力抓好粮食生产和重要农产品供给”。下列选项错误的是：","options":{"A":"大力推进北方设施蔬菜、北菜南运基地建设，提高蔬菜应急保供能力","B":"坚持中国人的饭碗任何时候都要牢牢端在自己手中，饭碗主要装中国粮","C":"全面落实粮食安全党政同责，严格粮食安全责任制考核，确保粮食播种面积稳定","D":"坚持和加强党对“三农”工作的全面领导，牢牢守住保障国家粮食安全和不发生规模性返贫两条底线"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，《中共中央 国务院关于做好2022年全面推进乡村振兴重点工作的意见》在“一、全力抓好粮食生产和重要农产品供给”部分指出：“（三）保障‘菜篮子’产品供给。加大力度落实‘菜篮子’市长负责制。稳定生猪生产长效性支持政策，稳定基础产能，防止生产大起大落。加快扩大牛羊肉和奶业生产，推进草原畜牧业转型升级试点示范。稳定水产养殖面积，提升渔业发展质量。稳定大中城市常年菜地保有量，大力推进北方设施蔬菜、南菜北运基地建设，提高蔬菜应急保供能力。”由此可知，应是“南菜北运基地建设”，而非“北菜南运基地建设”。\nB、C两项正确，《中共中央 国务院关于做好2022年全面推进乡村振兴重点工作的意见》在”一、全力抓好粮食生产和重要农产品供给”部分指出：“（一）稳定全年粮食播种面积和产量。坚持中国人的饭碗任何时候都要牢牢端在自己手中，饭碗主要装中国粮，全面落实粮食安全党政同责，严格粮食安全责任制考核，确保粮食播种面积稳定、产量保持在1.3万亿斤以上。”\nD项正确，《中共中央 国务院关于做好2022年全面推进乡村振兴重点工作的意见》在开头第二段指出：“做好2022年‘三农’工作，要以习近平新时代中国特色社会主义思想为指导，全面贯彻党的十九大和十九届历次全会精神······坚持和加强党对‘三农’工作的全面领导，牢牢守住保障国家粮食安全和不发生规模性返贫两条底线，突出年度性任务、针对性举措、实效性导向，充分发挥农村基层党组织领导作用，扎实有序做好乡村发展、乡村建设、乡村治理重点工作，推动乡村振兴取得新进展、农业农村现代化迈出新步伐。”\n本题为选非题，故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"5102137","cat":"法律常识","stem":"某市为保护当地的湿地自然景观，制定颁布了《X市湿地保护办法》，禁止私自采掘、捕捞、打猎等行为。张某闲来无事，前往湿地景区游玩，看到两只受伤野鸭便顺手捡起，准备带回家去。在回家路上，张某携带的野鸭被正在巡逻的警察发现，警察依据《X市湿地保护办法》对其处以1000元罚款。张某不服，欲提起行政诉讼，下列说法错误的是：","options":{"A":"张某可以就罚款决定提起诉讼","B":"张某认为《X市湿地保护办法》违背上位法规定，可以只就其合法性提起诉讼","C":"张某可以提供行政行为违法的证据，提供的证据不成立的，不免除公安机关的举证责任","D":"公安机关对作出的行政行为负有举证责任，应当提供作出该行政行为的证据和所依据的规范性文件"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国行政诉讼法》第十二条第一款第一项规定：“人民法院受理公民、法人或者其他组织提起的下列诉讼：（一）对行政拘留、暂扣或者吊销许可证和执照、责令停产停业、没收违法所得、没收非法财物、罚款、警告等行政处罚不服的；”\nB项错误，根据《中华人民共和国行政诉讼法》第十三条第二项规定：“人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：（二）行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令；”题中，《X市湿地保护办法》属于规章或行政机关制定、发布的具有普遍约束力的决定、命令，不得对其提起行政诉讼。\nC项正确，根据《中华人民共和国行政诉讼法》第三十七条规定：“原告可以提供证明行政行为违法的证据。原告提供的证据不成立的，不免除被告的举证责任。”\nD项正确，根据《中华人民共和国行政诉讼法》第三十四条第一款规定：“被告对作出的行政行为负有举证责任，应当提供作出该行政行为的证据和所依据的规范性文件。”\n本题为选非题，故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"5102132","cat":"经济常识","stem":"下列关于金融产品的说法正确的是：","options":{"A":"金融产品价格波动属于信用风险","B":"在开放基金中风险最低的是混合型基金","C":"存款保险制度的保障范围不包括银行自营的理财产品","D":"金融产品的风险由大到小排序：金融债券＞股票＞储蓄产品"},"answer":"C","explanation":"本题考查经济常识。\nA项错误，信用风险又称违约风险，是指借款人、证券发行人或交易对方因种种原因，不愿或无力履行合同条件而构成违约，致使银行、投资者或交易对方遭受损失的可能性。因此，金融产品价格波动不属于信用风险。\nB项错误，人们将开放式基金分为四种基本类型：股票型基金、混合型基金、债券型基金、货币型基金。混合型基金指同时投资于股票、债券和货币市场等工具，没有明确投资方向的基金。而货币型基金主要投资于货币市场的基金，相对来说，它的风险是最低的。\nC项正确，存款保险主要保障的是储蓄存款，如果存款保险成员机构发生经营危机，或者面临破产倒闭，那么存款保险就可以为该成员机构提供财务方面的救助，或者直接向存款人支付部分或全部的存款，从而保障存款人的相关权益。但是银行自营的理财产品并不属于储蓄存款，因此是不属于存款保险制度的保障范围之内的。\nD项错误，金融债券是由银行和非银行金融机构发行的债券。从收益方面看，债券在购买之前，利率已定，到期就可以获得固定利息，而不用管发行债券的公司经营获利与否；股票一般在购买之前不定股息率，股息收入随股份公司的盈利情况变动而变动，盈利多就多得，盈利少就少得，无盈利不得。从本金方面看，债券到期可回收本金，也就是说连本带利都能得到，如同放债一样；股票则无到期之说。股票本金一旦交给公司，就不能再收回，只要公司存在，就永远归公司支配。公司一旦破产，还要看公司剩余资产清盘状况，那时甚至连本金都会蚀尽，所以债券的风险性小于股票。储蓄产品是指银行推出的存钱产品，风险是最低的。因此，风险由大到小排序：股票＞金融债券＞储蓄产品。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"5102375","cat":"人文常识","stem":"“揭榜挂帅”是通过高额悬赏征集科技创新成果，把需要攻关的科研项目张榜，谁有本事谁就揭榜。这充分体现了国家对改革科研项目管理模式、提高科技创新支撑能力的高度重视。下列说法不准确的是：","options":{"A":"采取“一对一”的揭榜方式","B":"支持企业牵头组建的创新联合体“揭榜攻关”","C":"是一种以科研成果来兑现的科研经费投入体制","D":"“政府搭台、创新唱戏”将各自的资源优势有力整合到一起"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，从揭榜方式来看，当前多数省份默认采取“一对一”的揭榜方式，同时鼓励揭榜单位组建创新联合体共同攻关，而针对需求方无法确定唯一合作对象的情况，部分地区注明揭榜方可为2-3家，实行“赛马”制。\nB项正确，在中国科学院第二十次院士大会、中国工程院第十五次院士大会、中国科协第十次全国代表大会上，习近平总书记强调，“要发挥企业出题者作用，推进重点项目协同和研发活动一体化，加快构建龙头企业牵头、高校院所支撑、各创新主体相互协同的创新联合体。”企业天然具有技术创新的诉求和属性，领军企业能够把握关键核心技术的前沿导向，并具有较强的研发领导能力与抗风险能力，由他们牵头组建创新联合体，有助于带动整个创新链上下游企业的技术水平，实现关键核心技术的突破。因此要支持企业牵头组建的创新联合体“揭榜攻关”。\nC项正确，“揭榜挂帅”也被称为科技悬赏制，是一种以科研成果来兑现的科研经费投入体制，由政府组织面向全社会开放征集科技创新成果的一种非周期性科研资助安排。\nD项正确，“政府搭台”是指发挥好政府在科研管理方面的组织优势，提供政策保障，“创新唱戏”是要激发高校、企业等创新主体的创新活力，整合各种创新资源，提升国家整体创新能力。实行“揭榜挂帅”的最终目的，就是要通过深化科技体制改革把巨大创新潜能有效释放出来，持续提升科技自主创新能力，整合企业、科学界等的力量与资源集中攻破难关。\n本题为选非题，故正确答案为A。","no":11,"missingImage":false},{"type":"question","qid":"5102144","cat":"人文常识","stem":"下列诗句与其描述的乐器对应错误的一项是：","options":{"A":"昆山玉碎凤凰叫，芙蓉泣露香兰笑——箜篌","B":"幽音变调忽飘洒，长风吹林雨堕瓦——笛子","C":"弦凝指咽声停处，别有深情一万重——古筝","D":"间关莺语花底滑，幽咽泉流冰下难——琵琶"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，诗句出自唐代李贺的《李凭箜篌引》，意思是乐声清脆动听得就像昆仑山美玉击碎，凤凰鸣叫；时而使芙蓉在露水中饮泣，时而使香兰开怀欢笑。描写的乐器是箜篌。\nB项错误，诗句出自唐代李颀的《听董大弹胡笳声兼寄语弄房给事》，意思是幽咽琴声忽转轻松潇洒，像大风吹林如大雨落瓦。“胡笳声”，也就是《胡笳弄》，是按胡笳声调翻为琴曲。描写的乐器为古琴。\nC项正确，诗句出自唐代白居易的《夜筝》，意思是忽然，弦声凝绝、柔指轻顿，那片刻的宁静又诉说出千万重的深情。描写的乐器是古筝。\nD项正确，诗句出自唐代白居易的《琵琶行》，意思是一会儿像黄鹂在花下啼鸣婉转流利，一会儿又像泉水在冰下流动滞涩不畅。好像冰泉冷涩琵琶声开始凝结，凝结而不通畅声音渐渐地中断。描写的乐器是琵琶。\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"5102139","cat":"科技常识","stem":"关于下列诗句均描述了一种生物学现象，对其解释错误的是：","options":{"A":"“儿童急走追黄蝶，飞入菜花无处寻”体现动物的拟态","B":"“春色满园关不住，一枝红杏出墙来”体现植物的向光性","C":"“落红不是无情物，化作春泥更护花”体现微生物的分解作用","D":"“人间四月芳菲尽，山寺桃花始盛开”体现植物开花受温度影响"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，“儿童急走追黄蝶，飞入菜花无处寻”意为小孩子奔跑着追赶黄蝴蝶，可是蝴蝶飞入菜花丛中就再也找不到了。动物的保护色是指动物把体表的颜色改变为与周围环境相似，这种颜色叫保护色。黄蝶飞入菜花丛中就再也找不到了体现的是动物的保护色。拟态是一种生物模拟另一种生物或模拟环境中的其他物体从而获得好处的现象，一般拟态是属于静止的，而保护色与运动状态无关。\nB项正确，“春色满园关不住，一枝红杏出墙来”意为满园子的春色是关不住的，开得正旺的红杏有一枝枝条伸到墙外来了。植物的向光性是指植物生长器官受单方向光照射而引起生长弯曲的现象，对高等植物而言，向光性主要指植物地上部分茎叶的正向光性。正向光性运动与生长素分布有关，光线能使生长素在背光一侧比向光一侧分布多，因此，背光侧比向光侧生长得快，使植物的茎显示出向光性。“红杏出墙”是因为红杏树枝条的向光性生长发生弯曲。\nC项正确，“落红不是无情物，化作春泥更护花”意为从枝头上掉下来的落花不是无情之物，会化作春天的泥土，培育春天的花朵生长。落花之所以会转化为春泥是微生物的分解作用，泥土中的微生物通过分解作用可以将落花中的有机物分解为简单的无机物，为土地提供养分，使自然界的物质得到循环利用。\nD项正确，“人间四月芳菲尽，山寺桃花始盛开”意为人间四月里百花凋零已尽，可是山寺之中，桃花却刚刚盛开。说明海拔高度升高温度下降，温度会影响植物的生长发育进程。\n本题为选非题，故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"5102377","cat":"科技常识","stem":"高脂血症的临床表现主要是脂质在皮肤内沉积引起的黄色瘤和脂质在血管内皮沉积所引起的动脉粥样硬化，然而，多数患者并无明显症状和异常体征。下列关于这种疾病的说法正确的是：","options":{"A":"患者日常饮食中的油脂摄入应当以动物油为主","B":"只有肥胖者才会得高脂血症","C":"血液中的部分脂质过高","D":"容易引起白血病"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，高脂血症的患者日常饮食中的油脂摄入应当以植物油为主，并且每人每日的用量以25-30g为宜。因为动物性脂肪，或者是肉类、蛋类、乳制品等食物中的饱和脂肪酸和胆固醇的含量比较丰富，摄入过多，容易使胆固醇超标，出现高胆固醇血症，会加重病情。\nB项错误，肥胖的人的血脂代谢异常的可能性大，出现高脂血症的几率大，但是并不是只有肥胖的人才会得高脂血症，就算是体型消瘦的人也会得高脂血症。高脂血症是一种脂质代谢紊乱引起的疾病，高脂血症也是引起动脉硬化、血管内粥样斑块形成的最主要的原因。\nC项正确，高脂血症是由各种原因导致的血浆中的胆固醇、甘油三酯以及低密度脂蛋白水平升高和高密度脂蛋白过低的一种的全身质代谢异常的一种病。\nD项错误，白血病与高脂血症一般没有关系，属于两种不同的疾病。高脂血症是指血脂水平过高。白血病是血液当中出现不正常的白细胞大量增生的情况。\n故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"5102141","cat":"科技常识","stem":"某品牌果汁饮料的配料表为：水、橙浓缩汁、木糖醇、山梨酸、维生素C、羧甲基纤维素钠、黄原胶、姜黄、食用香精。下列关于该饮料中配料所对应的作用类型错误的是：","options":{"A":"姜黄——色素","B":"山梨酸——酸度调节剂","C":"维生素C——抗氧化剂","D":"木糖醇——甜味剂"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，姜黄素是一种天然化合物，具有良好的抗炎和抗癌特性。姜黄素是从姜科、天南星科中的一些植物的根茎中提取的一种二酮类化合物，其中，姜黄中约含姜黄素3%～6%，是植物界很稀少的具有二酮结构的色素。\nB项错误，山梨酸，又称为清凉茶酸、2,4-己二烯酸、2-丙烯基丙烯酸，是一种食品添加剂。山梨酸和山梨酸钾是国际上应用最广的防腐剂，具有较高的抗菌性能，抑制霉菌的生长繁殖，通过抑制微生物体内的脱氢酶系统，达到抑制微生物的生长和起防腐作用。酸度调节剂亦称pH调节剂，是用以维持或改变食品酸碱度的物质。规定允许使用的酸度调节剂有柠檬酸、柠檬酸钾、乳酸、酒石酸等。\nC项正确，抗氧化剂是指能防止或延缓食品氧化，提高食品的稳定性和延长贮存期的食品添加剂。维生素C具有很强的还原性，是高效抗氧化剂。\nD项正确，甜味剂是指能赋予软饮料甜味的食品添加剂。木糖醇是一种有机化合物，是从白桦树、橡树、玉米芯、甘蔗渣等植物原料中提取出来的一种天然甜味剂。\n本题为选非题，故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"5102403","cat":"人文常识","stem":"在日常生活中，长期来看下列杯子的使用方法对人体最没有危害的是：","options":{"A":"用玻璃杯喝冰橙汁","B":"用不锈钢杯喝碳酸饮料","C":"用塑料杯盛放刚烧开的水","D":"用内壁涂有彩釉的陶瓷杯喝热姜汁"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，玻璃杯是指玻璃制成的杯子，通常由原材料高硼硅玻璃，经过600多度的高温烧制而成，其物理强度高，与普遍玻璃相比，无毒副作用，其机械性能，热稳定性能，抗水、抗碱、抗酸等性能大大提高。用玻璃杯喝冰橙汁对身体基本不会产生危害。\nB项错误，不锈钢材质对于酸性饮料不具有防腐蚀特性，碳酸饮料属于酸性物质，长时间使用不锈钢杯装碳酸饮料不仅会破坏腐蚀水杯内壁，更会对人体造成伤害，因此不宜用不锈钢杯喝碳酸饮料。\nC项错误，塑料杯通常由聚苯乙烯（PS）制作而成，用其装酸（如柳橙汁）、碱性物质后，会分解出致癌物质，不耐高温；其温度达到六十几度的时候会变形，产生对人体有害的物质，因此不宜能用塑料杯盛放刚烧开的水。\nD项错误，彩釉陶瓷杯上的图案是用颜料涂画而来，内壁涂有彩釉，当装入开水、酸性、碱性饮料时，铅等有害重金属元素会溶解在饮料中，对健康不利。因此不宜用内壁涂有彩釉的陶瓷杯喝热姜汁。\n故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"5102319","cat":"人文常识","stem":"丙烯酰胺被世界卫生组织列为2A级致癌物，即可疑致癌物。食品中的丙烯酰胺并不是人为添加到食物中，而是在烘焙或烹饪过程中产生的，下列烹饪手法中生成丙烯酰胺最少的是：","options":{"A":"干煸四季豆","B":"炸油条","C":"白灼虾","D":"炝炒白菜"},"answer":"C","explanation":"本题考查科技常识。\n丙烯酰胺的形成与食物加工烹调方式、温度、时间、水分等有关。丙烯酰胺主要在高碳水化合物、低蛋白质的植物性食物烹调过程中被加热到120\u003cimg data-k=\"b658c865c7d8\">\u003cimg data-k=\"a2ed70c2e19b\">以上时生成，140-180\u003cimg data-k=\"8afadf6ce3b2\">为生成的最佳温度；在加工温度较低，如用水煮时，丙烯酰胺的形成水平相当低。食物的水含量也是影响丙烯酰胺形成的重要因素，特别是烘烤、油炸食品最后阶段水分减少、表面温度升高后，其丙烯酰胺形成量更高。白灼虾是用水煮的方式烹调，与干煸四季豆、炸油条、炝炒白菜相比，丙烯酰胺的生成量最少。\n故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"5102133","cat":"人文常识","stem":"传统的光刻技术中，镜头与光刻胶之间的介质是空气，而浸入式技术是将空气介质换成液体，得到合适波长的光，以提高成像分辨率，以下说法错误的是：","options":{"A":"液体局部温度起伏会引起成像质量恶化","B":"为了减少液体对光线的吸收，液层厚度不能太大","C":"以纯水为介质时，可以选取任意波长紫外光为光源","D":"可以注入高折射率的液体以得到更高频率的光，提高成像分辨率"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，液体温度的变化将引起折射率的改变。如果液体温度变化不均匀，会导致像面聚焦偏移和球差的改变。在曝光系统中，焦面的偏移可由调焦调平系统校正，然而局部的温度起伏将引起局部的成像质量恶化。\nB项正确，光刻机的生产率与照明光的透射率成正比，因此为了减小液体对光线的吸收，液体层的厚度不能太大。\nC项错误，在光的大多数波段水的折射率为1.33左右，而在193nm附近，水的折射率高达1.437，因此为满足高折射率和高透射系数的要求，应使用水作为193nm附近光刻的浸没液体，不能任意选择波长。\nD项正确，浸入式技术利用光通过液体介质后光源波长缩短来提高分辨率，其缩短的倍率即为液体介质的折射率。因此，折射率越高的液体就可以得到波长更短的光，提高成像分辨率。【备注：本题D项说法不严谨，注入高折射率的液体改变的应是光的波长，而非频率。】\n本题为选非题，故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"5102136","cat":"人文常识","stem":"乒乓球运动员在比赛中运用上旋打法进攻，在击球的过程中通过带有向上提拉的动作，打出上旋球，下列关于上旋球说法错误的是：","options":{"A":"球体上表面相对空气的旋转速度大，下表面相对空气的旋转速度小","B":"球体上方气体压强比球体下方大，上旋球下坠速度比正常快","C":"乒乓球转速越大，上下表面压强差就越大，下坠得就越快","D":"球体旋转向前飞行，上表面向前转动，下表面向后转动"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，上旋球的运动方向和自转方向一样，球向前运动，由于空气具有一定的粘滞性，当乒乓球向前转动时，空气就与球的上表面产生摩擦，就会导致球体上表面相对空气的旋转速度小，下表面相对空气的旋转速度大。\nB项正确，由于球体的上表面相对空气的旋转速度小，下表面相对空气的旋转速度大，根据伯努利原理，流速大的地方压强小，所以下表面受的气体压强小，故上旋球下坠速度比正常快。\nC项正确，当乒乓球转速越大，上表面的空气流动速度和下表面的空气流动速度差就越大，上下表面压强差就越大，所以下坠得就越快。\nD项正确，上旋球的运动方向和自转方向一样，球向前运动，上表面是向前转动，下表面是向后转动。\n本题为选非题，故正确答案为A。","no":19,"missingImage":false},{"type":"question","qid":"5102143","cat":"科技常识","stem":"下列关于伟大科学工程的说法，正确的是：","options":{"A":"阿波罗计划：1961年在美国启动，尤里·加加林乘坐阿波罗1号宇宙飞船第一个登上月球表面","B":"中国863计划：1986年在中国启动，深海载人潜水器被列为该计划的研究专项之一","C":"人类基因组计划：1990年在法国启动，聚焦测定人染色体DNA序列，以破译遗传信息为目的","D":"人类脑计划：1997年在英国启动，以心理科学和信息科学研究为核心"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，阿波罗计划为20世纪60-70年代美国实施的载人登月工程，“阿波罗”登月飞行从1961年启动。1969年7月16-24日，阿姆斯特朗作为“阿波罗”11号飞船指令长，完成人类首次登月飞行。\nB项正确，中国863计划是中国发展高技术及其产业的计划，全称国家高技术研究发展计划。因1986年3月王大珩、王淦昌、杨嘉墀、陈芳允四位科学家提出这个建议而得名，于1986年启动实施。2002年中国科技部将深海载人潜水器研制列为国家高技术研究发展计划（863计划）重大专项，启动“蛟龙号”载人深潜器的自行设计、自主集成研制工作。\nC项错误，人类基因组计划由美国科学家于1985年率先提出，1990年正式启动，于2000年完成了人类基因组“工作框架图”。其核心任务是要绘制出人类基因组的遗传图谱、物理图谱、转录图谱和序列图谱，最终测定出人类基因组DNA的全部核苷酸序列。\nD项错误，人类脑计划包括神经科学和信息科学这当今自然科学两大热点的相互结合研究，其核心内容是神经信息学。1997年人类脑计划在美国正式启动，美国20多家著名的大学和研究所参加了这个研究计划。\n故正确答案为B。","no":20,"missingImage":false}],"count":13,"answerable":13,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"5102183","cat":"逻辑填空","stem":"改革和法治如鸟之两翼、车之两轮。党的十八大以来，全面深化改革的一个鲜明特点，就是把法治贯穿于改革全过程，在法治下推进改革、在改革中完善法治，保证改革和法治相互促进、            。\n填入划横线部分最恰当的一项是：","options":{"A":"交相辉映","B":"相映成趣","C":"相得益彰","D":"相为表里"},"answer":"C","explanation":"横线处所填成语搭配“改革和法治”，根据横线前顿号可知，横线处所填成语与“相互促进”构成近义并列，表意相近。C项“相得益彰”指两个人或两件事物互相配合，双方的能力和作用更能显示出来，可以体现相互促进之意，当选。A项“交相辉映”指各种光亮、色彩等互相映照，多用于形容美好的景象，与“改革和法治”搭配不当，排除；B项“相映成趣”指相互衬托着，显得很有趣味，很有意思，D项“相为表里”即互为表象及内里，内外互相配合，共为一体，均无法体现促进之意，排除。\n故正确答案为C。\n【文段出处】人民日报《人民时评：让法治与改革相得益彰》","no":21,"missingImage":false},{"type":"question","qid":"5102382","cat":"逻辑填空","stem":"中华传统节日的文化内涵蕴藏在人与自然、人与他人、人与自身的相处之道中，体现了中华民族的核心价值观念，而        其中的则是对“和”的追求。\n填入划横线部分最恰当的一项是：","options":{"A":"分列","B":"统贯","C":"包含","D":"纵横"},"answer":"B","explanation":"根据“中华传统节日的文化内涵蕴藏在人与自然、人与他人、人与自身的相处之道中”可知，横线处应体现出对“和”的追求贯穿始终之意，B项“统贯”指系统、条贯，可以体现“贯穿始终”之意，当选。\nA项“分列”指按照一项准则分级或分类，与文意无关，排除；\nC项“包含”指里边含有，无法体现“贯穿始终”之意，排除；\nD项“纵横”指竖横交错或奔驰无阻，文段未体现“交错”之意，排除。\n故正确答案为B。\n【文段出处】书籍《中国文艺评论》2021年第5期——《中华传统节日的文化内涵：基于人与自然、他者和自身关系视角的考察》","no":22,"missingImage":false},{"type":"question","qid":"5102187","cat":"逻辑填空","stem":"修炼挨批评这项基本功，要有虚心接受的气度。接受批评，就要拿出虚心以待、胸怀若谷的姿态，砥砺            、从善如流的自觉。\n填入划横线部分最恰当的一项是：","options":{"A":"见贤思齐","B":"洗心革面","C":"兼听则明","D":"闻过则喜"},"answer":"D","explanation":"根据顿号可知，横线处所填成语与“从善如流”构成并列关系，表示听取正确的意见、接受善意的规劝之意，D项“闻过则喜”意为听到批评意见就喜悦，比喻乐于接受他人规劝，符合文意，当选。\nA项“见贤思齐”意思是见到德才兼备的人就要向他（她）看齐，文段没有体现出要向德才兼备的人看齐之意，排除；B项“洗心革面”意为除去邪思杂念，改变旧日面目，比喻彻底悔悟，改过自新，文段并无改过自新之意，排除；C项“兼听则明”指多方听取意见才能辨明是非得失，侧重意见，文段强调批评，与文意不符，排除。\n故正确答案为D。\n【文段出处】人民日报《人民日报:每一位同志都要修炼好挨批评的基本功》","no":23,"missingImage":false},{"type":"question","qid":"5102195","cat":"逻辑填空","stem":"升腾的火箭，        的是一个民族的飞天梦想，镌刻的是一个国家的前行脚步。从“嫦娥奔月”到“祝融驭火”，从“天和筑穹”到“墨子传信”，从“北斗联网”到“天舟穿梭”······中国航天向浩瀚宇宙的每一次进发，振奋的是越来越昂扬的精神和气概，        的是越来越厚重的自信和底气。\n依次填入划横线部分最恰当的一项是：","options":{"A":"承载 夯实","B":"记载 树立","C":"负载 牢固","D":"担负 增强"},"answer":"A","explanation":"第一空，横线前的对应主体为“火箭”，横线后需与“梦想”构成搭配。A项“承载”指承受、负载，与“梦想”搭配恰当，保留。B项“记载”指把事情写下来，与“火箭”搭配不当，排除；C项“负载”指机械设备以及生理组织等在单位时间内所担负的工作量，也指机件及建筑构件承受的重量，是名词，而横线处需填入动词与“梦想”搭配，故搭配不当，排除；D项“担负”指承当起责任、工作、费用等，与“梦想”搭配不当，排除。\n第二空，代入验证，搭配“自信”和“底气”，A项“夯实”指加固，填入文段表示中国航天给予我们充足的自信和底气，搭配得当，且符合文意，当选。\n故正确答案为A。\n【文段出处】人民网《为浩瀚太空留下更多中国身影》","no":24,"missingImage":false},{"type":"question","qid":"5102212","cat":"逻辑填空","stem":"文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。人类社会与文明的每一次        ，无不伴随着文化的历史性进步。纵览历史长河，无论是传统还是现代社会治理结构和治理体系中，文化发展无不         、推动着社会的发展和完善。\n依次填入划横线部分最恰当的一项是：","options":{"A":"跨越 滋补","B":"跃进 滋养","C":"变迁 滋润","D":"突破 滋生"},"answer":"B","explanation":"第一空，横线处搭配“人类社会与文明”，根据“无不伴随着文化的历史性进步”可知，横线处要体现人类社会与文明的进步之意。A项“跨越”指超过时期或地区之间的界限，B项“跃进”指跳着向前进，比喻极快地前进，D项“突破”指冲破或超过某个界限，均可体现出进步之意，符合文意，保留。C项“变迁”指事物缓慢逐渐变化转移，侧重强调变化而并不一定就是进步，与文意不符，排除。\n第二空，根据横线后顿号可知，横线处与“推动”构成近义并列，共同体现出“文化发展”对“社会的发展和完善”发挥的积极作用。B项“滋养”指供给养分，置于此处表示文化为社会的发展和完善提供养分，符合文意，当选。A项“滋补”指供给身体需要的养分，补养，常与“身体”搭配，与后文“社会的发展和完善”搭配不当，排除；D项“滋生”指繁殖，引起，产生，多用于消极语境，如滋生细菌、滋生腐败等，文段并非消极语境，排除。\n故正确答案为B。\n【文段出处】中国教育报《涵育向上而行的文化》","no":25,"missingImage":false},{"type":"question","qid":"5102215","cat":"逻辑填空","stem":"低碳转型是牵涉供应端和消费端全链条的        工程，不仅需要各行各业攻坚克难的决心，也需要我们每个人            的行动。夏天把空调温度调高一些，尽量购买节能型用品，积极参与义务植树活动，每个人都为地球的“凉热”出一份力。只有让低碳成为新风尚、新潮流，才能与技术革新形成合力。\n依次填入划横线部分最恰当的一项是：","options":{"A":"核心 事必躬亲","B":"系统 脚踏实地","C":"特殊 持之以恒","D":"浩大 厚积薄发"},"answer":"B","explanation":"第一空，根据“牵涉供应端和消费端全链条”以及“不仅需要······也需要······”可知，低碳转型是一个涉及方方面面的工程，故横线处应体现涉及范围广的含义，B项“系统”指有条理的、成体系的，D项“浩大”指规模巨大，均符合文意，保留。A项“核心”指中心，主要部分，C项“特殊”指与别的事物不同，文段强调的是涉及范围广，均与文意不符，排除。\n第二空，根据“夏天把空调温度调高一些，尽量购买节能型用品，积极参与义务植树活动，每个人都为地球的‘凉热’出一份力”可知，低碳行动需要我们每个人都付出切实的行动，B项“脚踏实地”比喻做事踏实认真，符合文意，当选。D项“厚积薄发”形容只有准备充分才能办好事情，文段强调每个人切实去做而非事先准备，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《科技创新助力碳中和》","no":26,"missingImage":false},{"type":"question","qid":"5102182","cat":"逻辑填空","stem":"奋斗者永远是年轻的。青春与否，无关乎年龄，而在于心境。用奋斗        时代，用拼搏定义未来，这不仅是年轻人该有的追求，更是每个与时代同行者应有的姿态。奋斗不息，青春不朽。让我们以梦为马，不负韶华，在奋勇搏击中放飞青春梦想，在            中激扬青春力量。\n依次填入划横线部分最恰当的一项是：","options":{"A":"礼赞 砥砺前行","B":"拥抱 继往开来","C":"顺应 一往无前","D":"讴歌 风雨兼程"},"answer":"A","explanation":"第一空，搭配“奋斗”“时代”，且文段感情色彩偏积极。A项“礼赞”指怀着敬意地赞扬，B项“拥抱”指为表示亲近和爱意而互相搂抱，均搭配恰当且符合文段感情色彩，保留。C项“顺应”指顺从，适应，为中性词，与文段感情色彩不符，排除；D项“讴歌”指用歌唱、言辞等赞美，与“奋斗”搭配不当，排除。\n第二空，横线处成语与“奋勇搏击”构成并列，强调面对困难努力拼搏，勇敢向前。A项“砥砺前行”指经历磨炼，克服困难，往前进步，符合文意，当选。B项“继往开来”指继承前人的事业，开辟未来的道路，文段并未提及继承前人的事业，与文意不符，排除。\n故正确答案为A。\n【文段出处】人民网《在奋勇搏击中放飞青春梦想》","no":27,"missingImage":false},{"type":"question","qid":"5102184","cat":"逻辑填空","stem":"有统计表明，由听力障碍者组成的家庭中，约90%育有听力正常子女。他们因出生于听障家庭，常常处在听障、健听两个世界的边缘地带。他们可能既无法真正        听障者世界，也不被听人世界完全        。他们面临普通人无法想象的挫折和压力，比如语言        迟缓、人际沟通障碍等，社会应给予他们更多的关注。\n依次填入划横线部分最恰当的一项是：","options":{"A":"融入 接纳 习得","B":"汇入 接受 发展","C":"进入 纳入 获取","D":"深入 接收 运用"},"answer":"A","explanation":"第一空，搭配“听障者世界”，横线前“他们”指代听力障碍者家庭中的听力正常子女，根据前文“常常处在听障、健听两个世界的边缘地带”可知，他们对于这两个世界都无法融合进来，A项“融入”、C项“进入”、D项“深入”均搭配恰当且符合文意，保留。B项“汇入”侧重空间上的汇合进入，与“听障者世界”搭配不当，排除。\n第二空，搭配“听人世界”，且根据前后的并列关系可知，此处表示不被听人世界所接受，A项“接纳”、C项“纳入”均搭配恰当且符合文意，保留。D项“接收”指收受，文段强调的是接受的态度而非接收的具体行为，与文意不符，排除。\n第三空，搭配“语言”，A项“习得”指学习得到，置于此处搭配恰当且符合文意，当选。C项“获取”表示获得、取得，一般不与“语言”搭配，排除。\n故正确答案为A。\n【文段出处】光明日报《倪兰：听障家庭中的健听子女》","no":28,"missingImage":false},{"type":"question","qid":"5102188","cat":"逻辑填空","stem":"宋代的“琼林宴”，是专为新科进士们举办的宴会，它从唐代“闻喜宴”        而来。与“闻喜宴”不同的是，“琼林宴”的        更高，是皇帝亲自参与的“国宴”，因赐宴在著名的“琼林苑”而得名。明清时期，多将“琼林宴”称为“恩荣宴”，其仪式内容基本不变，“琼林宴”的形式得以        下来。\n依次填入划横线部分最恰当的一项是：","options":{"A":"转变 标准 流行","B":"发展 格局 延续","C":"演变 规格 传承","D":"演化 条件 稳定"},"answer":"C","explanation":"第一空，根据前文可知，横线处应体现宋代的“琼林宴”是从唐代“闻喜宴”的基础上发展变化而来，B项“发展”指事物从小到大、从简单到复杂、从低级到高级的变化，C项“演变”指逐渐地发展变化，均符合文意，保留。A项“转变”指由一种情况变成另一种情况，侧重“与之前形成强烈反差”，与文意不符，排除；D项“演化”指演变（多用于自然界的变化），如“生物演化”，与文段语境不符，排除。\n第二空，根据后文可知，“琼林宴”是皇帝亲自参与的“国宴”，故横线处需体现出级别更高，C项“规格”泛指规定的要求或条件，符合文意，保留。B项“格局”指结构、格式和规模，与文意不符，排除。\n第三空，代入验证。横线处意在表达明清时期将宋代“琼林宴”的形式继承下来，C项“传承”指传递和继承，符合文意，当选。\n故正确答案为C。\n【文段出处】《古代学子们如何庆祝自己的毕业季？》","no":29,"missingImage":false},{"type":"question","qid":"5102360","cat":"逻辑填空","stem":"衡量民众对美好生活需要的满足状况，获得感无疑是一个重要的社会心态        。而获得感的        ，需要个体的持续努力，也需要政府和社会的赋能。共同富裕、教育减负、生育友好等国家战略和政策，都是有效的赋能方式，既可以直接        社会成员的负担，也有助于培养更加朝气蓬勃的社会生态，进而从体制机制上保障获得感的可持续性。\n依次填入划横线部分最恰当的一项是：","options":{"A":"标志 获取 减少","B":"标准 增强 释放","C":"指标 提升 减轻","D":"准绳 巩固 降低"},"answer":"C","explanation":"第一空，根据文意可知，横线处所填词语可以起到“衡量民众对美好生活需要的满足状况”的作用，B项“标准”指衡量事物的准则，C项“指标”指衡量目标的参数或预期中打算达到的指数、规格、标准，D项“准绳”比喻言论、行动等依据的原则和标准，三者均符合文意，保留。A项“标志”指表明特征的记号或事物，无法起到衡量的作用，排除。\n第二空，搭配“获得感”，根据“个体的持续努力”“保障获得感的可持续性”可知，横线处所填词语应体现获得感越来越多之意。B项“增强”指在原有的基础上更进一步，C项“提升”指提高，二者均符合文意且搭配恰当，保留。D项“巩固”指使牢固，强调原有基础的保持，不能体现变多之意，排除。\n第三空，搭配“负担”，C项“减轻”指减少重量或程度，与“负担”搭配恰当，当选。B项“释放”指把所含的能量或物质放出来，常搭配“能量”“压力”“潜能”等，与“负担”搭配不当，排除。\n故正确答案为C。\n【文段出处】光明网《以青春之奋斗创造青年之获得》","no":30,"missingImage":false},{"type":"question","qid":"5102254","cat":"片段阅读","stem":"实现技术要素高效配置是高标准市场体系建设的战略使命。技术要素市场化改革为建设高标准市场体系带来内生动力。发展完善技术要素市场，对现有市场体系提出了更高要求，例如需要更加健全的产权保护制度，更加公平的市场竞争环境，更为成熟的劳动力、资本要素市场以及更加包容的市场监管。此外，由于市场管理与创新管理的部门分割，技术要素市场化改革必然要求高标准市场体系建设要着力解决深层次的体制机制障碍、更加有效地统筹市场体系与创新体系的关系、协调科技与经济社会发展的关系。\n这段文字的中心观点在于说明：","options":{"A":"科技与经济社会发展的关系","B":"技术要素与高标准市场体系的关系","C":"高标准市场体系与创新体系的关系","D":"技术要素对市场体系提出了更高要求"},"answer":"B","explanation":"文段首先指出实现技术要素是高标准市场体系建设的战略使命，接着介绍技术要素市场化对高标准市场体系的作用及要求，并举例说明，然后通过“此外”引导并列，指出技术要素市场化改革对高标准市场体系的要求，故文段的主题词是“技术要素”与“高标准市场体系”，强调的重点是技术要素与高标准市场体系的关系，对应B项。\nA项，“科技与经济社会发展的关系”对应尾句的一部分，表述片面，且无主题词“技术要素”与“高标准市场体系”，排除；\nC项，文段并未提及“高标准市场体系与创新体系的关系”，无中生有，且无主题词“技术要素”，排除；\nD项，对应“此外”前的内容，表述片面，且文段主题词是“高标准市场体系”而非“市场体系”，主题词范围扩大，排除。\n故正确答案为B。\n【文段出处】《技术要素市场如何培育》","no":31,"missingImage":false},{"type":"question","qid":"5102219","cat":"片段阅读","stem":"人脸识别的相关应用需要公民肖像做支撑，因此，肖像权是人脸识别过程中最有可能受到侵害的权利。在人们看来，人脸识别当然是识别人脸。但实际上，人脸识别图像上显示的是人脸，不过后台能够看见的画面已不局限在人脸范围，这样的人脸识别采集图像，的确有“说话不算数”之嫌。进一步说来，如此人脸识别的App在法律上也涉嫌越权或者侵权。人脸识别只能采集公民主动提供人脸的图像信息，一旦采集范围扩大，将人脸周围的图像、公民所处的环境、正在从事的行为等信息进行采集，将侵犯公民不愿暴露的隐私。\n下列选项与文段意思不符的是：","options":{"A":"扩大人脸识别采集范围有可能侵害公民隐私权","B":"摄像头采集人脸周围的图像扩大了采集的范围","C":"公民应主动提供人脸的图像信息并享有知情权","D":"公民肖像权在人脸识别过程中最有可能受侵害"},"answer":"C","explanation":"A项，根据文段“一旦采集范围扩大，将人脸周围的图像、公民所处的环境、正在从事的行为等信息进行采集，将侵犯公民不愿暴露的隐私”可知，说法正确，排除；\nB项，根据文段“不过后台能够看见的画面已不局限在人脸范围”“一旦采集范围扩大，将人脸周围的图像······将侵犯公民不愿暴露的隐私”可知，采集人脸周围的图像属于扩大采集范围，说法正确，排除；\nC项，根据文段“人脸识别只能采集公民主动提供人脸的图像信息”可知，人脸识别的信息获取来源由公民主动提供，文段并未要求公民主动提供，偷换概念，当选；\nD项，根据文段“因此，肖像权是人脸识别过程中最有可能受到侵害的权利”可知，说法正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明网《人脸识别只能识别人脸》","no":32,"missingImage":false},{"type":"question","qid":"5102176","cat":"片段阅读","stem":"人们一般都喜欢追逐日出或日落景观，但绝大部分人可能没意识到，其实在与太阳相反一侧的天空，也隐藏着鲜为人知的景观，比如说人们能看到的两种大尺度影子景观——“山影”和“地影”。日出或日落前后，在太阳照射下，高大山峰投射出巨大阴影。此时站在该山峰的观测者观察这个阴影，阴影看起来像金字塔，这就是山影。除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏。\n对这段文字理解正确的是：","options":{"A":"大多数人不喜欢欣赏“山影”“地影”景观","B":"人们不把“山影”“地影”作为景观来欣赏","C":"“山影”和“地影”是鲜为人知的山上景观","D":"只有极少数人能发现和欣赏“山影”和“地影”"},"answer":"D","explanation":"A项，根据“除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏”可知，大部分人只是没有注意到“山影”“地影”，故“大多数人不喜欢”无中生有，排除；\nB项，根据“除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏”可知，登山家和摄影师还是会欣赏“山影”和“地影”的，表述过于绝对，排除；\nC项，根据“在与太阳相反一侧的天空，也隐藏着鲜为人知的景观······‘山影’和‘地影’”可知，“山影”和“地影”是天空中的景观，故“山上景观”表述错误，排除；\nD项，根据“除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏”可知，表述正确，当选。\n故正确答案为D。\n【文段出处】中国地理网《山影地影 只有极少数人在欣赏它们》","no":33,"missingImage":false},{"type":"question","qid":"5102258","cat":"片段阅读","stem":"长棘海星，这种像仙人球一般长满尖刺的生物，是珊瑚礁生态系统的主要捕食者。成年长棘海星的身体直径可以达到35厘米，有记录的最大个体甚至能超过75厘米。长棘海星以各类珊瑚，尤其是造礁珊瑚为食，被啃食的珊瑚只会留下白森森的外骨骼。如同肆虐于草原和农田的蝗灾一样，在全球范围内长棘海星会出现不规律的种群暴发，对珊瑚礁生态系统造成严重影响。\n这段文字没有提及长棘海星的：","options":{"A":"外形特征","B":"捕食对象","C":"种群密度","D":"破坏作用"},"answer":"C","explanation":"A项，根据“长棘海星，这种像仙人球一般长满尖刺的生物”“成年长棘海星的身体直径可以达到35厘米，有记录的最大个体甚至能超过75厘米”可知，“外形特征”文段有提及，排除；\nB项，根据“长棘海星以各类珊瑚，尤其是造礁珊瑚为食”可知，其“捕食对象”即为珊瑚，文段有提及，排除；\nC项，“种群密度”文段并未提及，无中生有，当选；\nD项，根据“如同肆虐于草原和农田的蝗灾一样，在全球范围内长棘海星会出现不规律的种群暴发，对珊瑚礁生态系统造成严重影响”可知，文段有提及“破坏作用”，排除。\n本题为选非题，故正确答案为C。\n【文段出处】中国国家地理杂志《长棘海星暴发 充满谜团的自然现象》","no":34,"missingImage":false},{"type":"question","qid":"5102216","cat":"片段阅读","stem":"我国宏观调控体系伴随社会主义市场经济体制改革的全面深化不断创新、完善。随着大数据、云计算、人工智能、区块链等加速创新，数字技术日益融入经济社会发展各领域全过程。数字技术不仅是数字经济发展的支撑，而且是辅助经济治理的基础。宏观经济是一个不可中断的连续进程，作为关键生产要素的数据也是动态的、系统化的，以不间断的“流”的形式存在。发挥数字技术在宏观经济治理中的作用，是创新和完善调控的重要任务，是提高调控前瞻性、针对性、有效性的重要条件。\n这段文字是一篇文章的引言，接下去作者最可能讲述的是：","options":{"A":"如何运用数字技术创新完善宏观调控","B":"如何完善宏观经济治理推动社会发展","C":"如何深度挖掘宏观经济数据资源","D":"如何让数字文明助力新发展格局"},"answer":"A","explanation":"本题为接语选择题，需通读全文，重点关注文段最后讨论的核心话题。文段开篇引出话题，即宏观调控体系在不断创新、完善。随后提出数字技术对于经济治理的重要作用，并提出宏观经济与数据均是动态的形式存在。尾句提出数字技术对于宏观调控的重要作用。根据话题一致原则，文段接下来最可能围绕“数字技术”和“宏观调控”展开论述，介绍如何通过数字技术创新和完善宏观调控，对应A项。\nB、C、D三项，均未提及文段核心话题“数字技术”，与前文无法衔接，排除。\n故正确答案为A。\n【文段出处】《善用数字技术创新宏观调控》","no":35,"missingImage":false},{"type":"question","qid":"5102372","cat":"语句表达","stem":"①我国现存辽塔约有90座，其中辽宁省内就有约40座\n②辽宁辽塔的“辽”字，既有空间上的地理分布，又有时间上的历史积淀\n③辽代古塔简称辽塔，其以独特的风格造型和精美的建造艺术在中华古塔中独树一帜\n④一座座矗立在辽宁省内的辽塔，历经千年，记录着佛教在东北地区的传播流变，也成为我们窥探大辽王朝兴衰的一扇窗\n⑤契丹民族兴起于辽河河畔，辽宁省名源于辽河\n将以上5个句子重新排列，语序正确的是：","options":{"A":"③①⑤②④","B":"③⑤①②④","C":"②③①④⑤","D":"①③②⑤④"},"answer":"A","explanation":"对比选项，判断首句，①句指出我国现存辽塔的数量，②句指出辽塔中“辽”的内涵，③句引出辽塔这一话题。应先引出话题，再围绕其展开论述。故③句更适合作为首句，排除C、D两项。\n继续对比选项，寻找线索。A、B两项的区别在于③句之后接①句还是⑤句，①句围绕辽塔话题，指出现存数量，与③句话题一致，而⑤句强调辽宁省的名字来源，与③句话题不一致，故确定③①两句捆绑，锁定A项。\n故正确答案为A。\n【文段出处】《辽宁辽塔 占据全国辽塔半壁江山的古塔群》","no":36,"missingImage":false},{"type":"question","qid":"5102364","cat":"语句表达","stem":"热水和冷水混在一起会变成温水。但是，温水不会自发分成热水和冷水。热量只能从热的物体向冷的物体单向传递，这一原理称为“热力学第二定律”。如果用分子这一微观视角看这一定律，物质的温度取决于其中沿着随机方向运动的分子的速度。分子运动速度快就会变热，速度慢就会变冷。但是数量庞大的分子运动时，各个分子的运动速度不是固定的。说到底，温度只不过是以不同速度运动的分子的平均速度罢了。因此，如果能够从以各种速度运动的分子中，只筛选出运动速度快的分子，从理论上说，就应该能                    。\n填入划横线处最恰当的句子是：","options":{"A":"从温水中单独提取出热水","B":"从温水中自发分出冷热水","C":"不使用能量就把冷水烧开","D":"不通过传递就把热水变温"},"answer":"A","explanation":"横线出现在结尾，且为尾句的分句，故需依据横线前内容以及横线所在尾句内容进行分析。文段开篇指出，温水不会自发分成热水和冷水，并解释原因。随后指出物质的温度取决于分子的速度，分子速度快就会变热，速度慢就会变冷，并以“说到底”进行总结，指出温度是分子的平均速度。“因此”基于前文得出结论，指出若能筛选出运动速度快的分子，就可以达到某种目的。结合前文可知，运动速度快意味着温度高，“筛选出运动速度快的分子”意味着提取出了温度高的部分，A项“提取出热水”符合文意，且呼应首句提出的问题，当选。\nB项，“筛选出运动速度快的分子”意味着提取出温度高的部分，而非“分出冷热水”，排除；\nC项，文段没有体现出“不使用能量”，排除；\nD项，“筛选出运动速度快的分子”意味着提取出温度高的部分，而非将热水变温，排除。\n故正确答案为A。","no":37,"missingImage":false},{"type":"question","qid":"5102214","cat":"片段阅读","stem":"恐龙胚胎化石“英良贝贝”，是迄今为止发现的最完整的恐龙胚胎。该胚胎被认为属于一种非鸟类兽脚类恐龙——窃蛋龙。胚胎以一种奇怪的姿势蜷缩在蛋壳内。此姿势从未在恐龙胚胎中发现，反倒是现代鸟类胚胎的常见姿势。现代鸟类的胚胎会在孵化后期经历预折叠、折叠、后折叠3个阶段，而“英良贝贝”的姿势相当于处在“预折叠”阶段。研究人员推断，这种先前被认为是鸟类特有的预孵化行为，可能起源于几千万年甚至上亿年前的兽脚类恐龙。\n这段文字意在强调：","options":{"A":"“英良贝贝”的胚胎姿势在已知的恐龙胚胎中是独一无二的","B":"现代鸟类的许多特征最初是从兽脚类恐龙祖先身上演化来的","C":"孵蛋姿势同现代鸟类相似，证明恐龙存在孵化抚育后代行为","D":"姿势奇特的胚胎为恐龙与现代鸟类之间的联结提供了新线索"},"answer":"D","explanation":"文段开篇介绍目前发现最完整的恐龙胚胎是“英良贝贝”，然后介绍该胚胎呈现的奇怪姿势从未在恐龙胚胎中发现，反而在现代鸟类胚胎中常见，接下来详细介绍该姿势相当于现代鸟类胚胎孵化的“预折叠”阶段，最后通过“研究人员推断”及指代词“这种”进行总结，鸟类的预孵化行为可能起源于兽脚类恐龙。故文段重点强调现代鸟类孵化行为和恐龙可能存在关联，对应D项。\nA项，对应文段“此姿势从未在恐龙胚胎中发现”，非文段重点，排除；\nB项，“许多特征”范围扩大，文段只介绍了胚胎孵化行为，排除；\nC项，“恐龙存在孵化抚育后代行为”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】《睡姿像小鸟，萌化了！这是迄今为止科学记录最完整的恐龙胚胎》","no":38,"missingImage":false},{"type":"question","qid":"5102203","cat":"片段阅读","stem":"乾隆款绛州澄泥砚的设计非常单一，没有任何一方向新式的琢砚风格靠拢，其仿造的主要是文化昌隆的汉、唐、宋泥质砚的标准款式。而同期乾隆朝内务府制造的大量松花砚则几乎抛弃了这种仿古砚式，极尽所能地去追求甚至创造潮流——高浮雕与浅浮雕配合营造表面，器座堆叠，砚盒设计精巧。如果说，乾隆朝宫作松花砚体现的是清宫在艺术审美领域的无往不胜，那么仿古绛州澄泥砚则意在强调它在技术领域的无所不能。\n下列说法正确的是：","options":{"A":"乾隆朝制造仿古砚的成就远远超出实用和观赏的目的","B":"松花砚代表的新式琢砚风格是乾隆朝造砚的主要潮流","C":"乾隆朝的澄泥砚旨在展示当时还原古砚制作的高超技艺","D":"乾隆朝宫作砚以追求艺术创造的美感或技术极致而著称"},"answer":"C","explanation":"A项，“成就远远超出实用和观赏的目的”文段未提及，无中生有，排除；\nB项，文段指出“同期乾隆朝内务府制造的大量松花砚则几乎抛弃了这种仿古砚式，极尽所能地去追求甚至创造潮流”，但并未体现出松花砚成为“主要潮流”，无中生有，排除；\nC项，根据“其仿造的主要是文化昌隆的汉、唐、宋泥质砚的标准款式”和“仿古绛州澄泥砚则意在强调它在技术领域的无所不能”可知，表述正确，当选；\nD项，根据“乾隆朝宫作松花砚体现的是清宫在艺术审美领域的无往不胜，那么仿古绛州澄泥砚则意在强调它在技术领域的无所不能”可知，“艺术创造的美感或技术”对应“宫作松花砚”、“仿古绛州澄泥砚”，“乾隆朝宫作砚”范围扩大，排除。\n故正确答案为C。\n【文段出处】《清代古砚鉴藏与仿古砚成造——以乾隆款仿古绛州澄泥砚为中心》","no":39,"missingImage":false},{"type":"question","qid":"5102220","cat":"片段阅读","stem":"南极动物的食物链极有特色，有人这样形容：在南极生活的动物从食物链上划分只有三个可能：它是磷虾，它吃磷虾或它捕食吃磷虾的动物。这个说法简单清晰地揭示了南极磷虾在南极生物圈承担的关键角色——这里几乎所有的动物都直接或间接地依赖磷虾生存。有些动物的食谱只有磷虾，没有其他替代品，而且它们生长繁殖、捕猎与迁移的时间和地点均与磷虾的生长状态相耦合。\n由上述材料无法推出：","options":{"A":"南极磷虾是南极生物链中至关重要的一个环节","B":"大多南极动物进化出以磷虾为中心的生存方式","C":"部分南极动物的繁殖期与磷虾的丰产期相一致","D":"企鹅数量的下降主要由于磷虾数量的减少所致"},"answer":"D","explanation":"A项，根据“这个说法简单清晰地揭示了南极磷虾在南极生物圈承担的关键角色——这里几乎所有的动物都直接或间接地依赖磷虾生存”可以推出，南极磷虾在南极生物圈发挥关键作用，表述正确，排除；\nB项，根据“在南极生活的动物从食物链上划分只有三个可能：它是磷虾，它吃磷虾或它捕食吃磷虾的动物”“这里几乎所有的动物都直接或间接地依赖磷虾生存”可以推出，大多南极动物进化出以磷虾为中心的生存方式，表述正确，排除；\nC项，根据“而且它们生长繁殖、捕猎与迁移的时间和地点均与磷虾的生长状态相耦合”可以推出，部分南极动物的繁殖期与磷虾的丰产期相一致，表述正确，排除；\nD项，文段未提及“企鹅数量下降”的原因，也未涉及“磷虾数量的减少”，故属于无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《从南极磷虾看生命的意义》","no":40,"missingImage":false},{"type":"question","qid":"5102218","cat":"片段阅读","stem":"叙事医学是一种具有叙事能力的医学实践，而叙事能力是指能够吸收、解释并被疾病的故事所感动的能力。这种能力有助于临床医生在医疗活动中提升对患者的共情能力、职业精神、亲和力和自我行为的反思。叙事医学要求医生在临床决策过程中倾听病人的叙事，关注家属等社会关系人的叙事。这样，医生才可以获取更多有助于临床决策的信息，才能作出正确的疾病诊断，提出最适合病人的决策建议，最后和患方共同作出首先保障病人利益，又能平衡各方权益的诊疗选择。\n这段文字意在说明：","options":{"A":"叙事医学有助于医患共同决策","B":"叙事医学可化解当下医疗分歧","C":"叙事医学可避免技术至上误区","D":"叙事医学有利于当前医学实践"},"answer":"A","explanation":"文段开篇阐释“叙事医学”的定义，紧接着说明其对于临床医生在医疗活动中有诸多提升，接下来介绍“叙事医学”对医生在临床决策过程中的相关要求，最后通过“这样”总结前文，进一步指出“叙事医学”在诊疗过程中的积极意义。文段尾句点明主旨，强调“叙事医学”有助于医生和患方共同作出诊疗选择，对应A项。\nB项“医疗分歧”、C项“技术至上”文段并未提及，无中生有，均排除；\nD项，“医学实践”对应首句话题引入部分，非重点，且“有利于当前医学实践”表述不明确，排除。\n故正确答案为A。\n【文段出处】期刊《叙事医学助力医患共同决策》","no":41,"missingImage":false},{"type":"question","qid":"5102263","cat":"片段阅读","stem":"制造与服务融合是智能制造的重要内容之一，服务要素渗透到制造各个环节中形成了生产性服务与制造服务化。本文从工业互联网的商业视角、使用视角、功能视角、实现视角建立了制造与服务融合中虚拟逻辑与实体活动交互的技术体系，有针对性地提出了生态位驱动、供应链驱动、大数据驱动、物联网驱动的制造与服务融合方法。本文构建的制造与服务融合技术体系，深化了工业互联网在制造业与服务业中的应用，为数字经济中制造服务产业的技术创新奠定了基础。\n如果这是一篇论文的摘要，那么这篇论文的标题最有可能是：","options":{"A":"数字经济中制造与服务融合的协同机制","B":"四轮驱动下的制造与服务融合技术体系","C":"工业互联网在智能制造中的体系化应用","D":"基于工业互联网的制造与服务融合技术"},"answer":"D","explanation":"文段开篇指出制造与服务融合是智能制造的重要内容之一，并由此形成了生产性服务与制造服务化。随后指出本文从工业互联网的多重视角，建立了制造与服务融合中虚拟逻辑与实体活动交互的技术体系，提出了多要素驱动的制造与服务融合方法，尾句作进一步阐释，指出基于工业互联网的制造与服务融合技术体系带来了诸多利好。故文段主要讨论的话题为“工业互联网”与“制造与服务融合技术”，对应D项。\nA、B两项，均缺少文段核心话题“工业互联网”，排除；\nC项，强调“工业互联网”在智能制造中的应用，缺少文段另一核心话题“制造与服务融合技术”，排除。\n故正确答案为D。\n【文段出处】万方智搜《基于工业互联网的制造与服务融合技术》","no":42,"missingImage":false},{"type":"question","qid":"5102221","cat":"片段阅读","stem":"我国全年降水量、河川径流量60％～80％集中在汛期；同时，降水和径流的年际变化显著，最大和最小年降水量南方地区相差2～4倍，北方地区相差3～6倍，径流量最大和最小年份相差10～15倍。天然来水过程与需水过程不匹配，很多地区出现旱涝急转，水资源开发利用难度加大。随着城镇化水平不断提升，人口和经济要素进一步向城市集聚。20世纪80年代初，全国人口城镇化率仅30%，2020年已达63.8%。城市群尤其中心城市水资源保障问题将日益突出。\n这段文字意在说明：","options":{"A":"我国降水和河川径流年际变化较大","B":"我国大部分地区水资源年内分配不均","C":"我国北方地区水资源衰减态势可能会进一步持续","D":"我国水资源分布失衡、供需矛盾突出，与自然和人为因素有关"},"answer":"D","explanation":"文段开篇指出我国全年降水量和河川径流量大部分集中在汛期，且不同年份的变化显著，天然来水过程与需水过程不匹配，接着又指出，随着城镇化水平不断提升，人口和经济要素向城市集聚，这种人为的因素也导致了水资源保障问题日益突出。因此，文段为没有标志的并列结构，前半部分指出水资源供需矛盾的自然因素，后半部分指出人为因素，对应D项。\nA、B两项，均对应文段关于“水资源供需矛盾的自然因素”，表述片面，排除；\nC项，“北方地区水资源衰减态势”文段未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】光明日报《院士专家把脉我国水资源“家底”——水，如何平衡发展之重》","no":43,"missingImage":false},{"type":"question","qid":"5102257","cat":"片段阅读","stem":"在高空气球技术取得进展的同时，航空和航天技术也迎来了飞速发展时期。在大气层内，飞机是更便捷的飞行工具，而对于那些需要在大气层之上进行的科学研究，卫星提供了更加理想的环境。然而，高空气球这种历久弥新的工具却没有走出人们的视野，目前仍然是重要的科学研究工具。\n这段文字的核心观点是：","options":{"A":"高空气球在科学研究中有独特优势","B":"高空气球比飞机和卫星更重要","C":"古老的高空气球仍在不断发展","D":"高空气球可用作科学观测平台"},"answer":"A","explanation":"文段开篇指出在高空气球技术发展的同时，航空和航天技术也在发展，随后通过“飞机”和“卫星”具体介绍了航空航天技术的发展应用，尾句“然而”引导转折，强调高空气球依然是重要的科学研究工具，对应A项。\nB项，“比飞机和卫星更重要”文段并未提及，无关对比，排除；\nC项，“高空气球仍在不断发展”对应文段首句，为话题引入部分的内容，非重点，排除；\nD项，“科学观测平台”文段并未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】北晚在线《高空气球打造新型天文望远镜，只花千分之一的钱，做和哈勃望远镜同样的事》","no":44,"missingImage":false},{"type":"question","qid":"5102204","cat":"片段阅读","stem":"目前，水和肥料都没有在农业中得到最佳使用，传统的植物栽培方法，使大部分水和化学物质，穿过土壤“溜过”根部，与地下水混合。为此，全球农业科技工作者都在寻找可以解决问题的新材料。某大学科研人员开发出一种聚合物水凝胶，该凝胶可作为土壤的“智能”添加剂，有助于避免土壤污染，显著减少用水量并改善植物对肥料的吸收。该研究员说，新研发的水凝胶能够在下雨或灌溉时储存大量水分，然后随着土壤变干缓慢释放。同时，这种水凝胶完全可以生物降解，也就是说，经过一段时间后，它们会“溶解”在土壤中，毫无踪迹。\n这段文字意在说明：","options":{"A":"根部肥料往往远离根部未发挥其肥料作用","B":"聚合物水凝胶可减少土地用水并避免污染","C":"大量使用化学肥料使土壤状况被破坏","D":"新研发的水凝胶在土壤中可完全降解"},"answer":"B","explanation":"文段开篇介绍传统的植物栽培方法存在不足，水和肥料都没有得到最佳使用，接着通过“为此”指代前文进行总结，指出某大学科研人员开发出一种聚合物水凝胶，并指出该凝胶既有助于避免土壤污染，又能减少用水量及改善植物对肥料的吸收。后文围绕聚合物水凝胶的作用进行具体解释说明。故文段重在强调聚合物水凝胶具有避免土壤污染和减少用水量的作用，对应B项。\nA项，“根部肥料往往远离根部”对应前文传统的栽培方法的部分内容，文段重点强调新材料聚合物水凝胶，排除；\nC项，文段并未论述“大量使用化学肥料”对于“土壤状况”的危害，无中生有，排除；\nD项，“土壤中可完全降解”对应“同时”之后解释说明的内容，非重点且表述片面，排除。\n故正确答案为B。\n【文段出处】《新凝胶可减少土地用水并避免污染》","no":45,"missingImage":false}],"count":25,"answerable":25,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"5102155","cat":"数学运算","stem":"滑雪和滑冰是冬奥会的两大项赛事，其中高山滑雪、自由式滑雪、单板滑雪、跳台滑雪、越野滑雪和北欧两项是滑雪大项中的6个分项，短道速滑、速度滑冰和花样滑冰是滑冰大项中的3个分项。小林打算去现场观看比赛，共选择6个项目，并且每个大项不少于1个，若所有项目比赛时间均不交叉，则不同的观赛方式有：","options":{"A":"83种","B":"84种","C":"92种","D":"102种"},"answer":"A","explanation":"方法一：根据题意，要求每个大项不少于1个，即分为三类情况讨论如下：\n第一类：滑冰大项中选择1个分项，滑雪大项中选择5个分项，情况数为\u003cimg data-k=\"4df5e912ff2d\">\u003cimg data-k=\"52659307e641\">种情况；\n第二类：滑冰大项中选择2个分项，滑雪大项中选择4个分项，情况数为\u003cimg data-k=\"74d7c0a6f706\">\u003cimg data-k=\"1b43afd2b3bd\">种情况；\n第三类：滑冰大项中选择3个分项，滑雪大项中选择3个分项，情况数为\u003cimg data-k=\"08c4e57b15da\">\u003cimg data-k=\"a7e96beb39f4\">种情况；\n分类相加，即符合条件的总情况数为18+45+20=83种。\n方法二：根据题意，要求每个大项不少于1个，正面情况数较多，故从反面考虑。反面为选择的6个项目均为滑雪分项（滑冰分项仅有3个，故不可能全为滑冰项目），则反面情况为从6个滑雪分项中选择6个项目，有\u003cimg data-k=\"191427b0146b\">种情况。总的情况数为从9个分项中选择6个项目，有\u003cimg data-k=\"ca1279dc79e7\">\u003cimg data-k=\"a5d4c83f7fac\">\u003cimg data-k=\"cda5569a03c1\">种情况，故所求情况数=总情况数-反面情况数=84-1=83种。\n故正确答案为A。","no":46,"missingImage":false},{"type":"question","qid":"5102131","cat":"数学运算","stem":"某单位四个党史宣讲小组各有若干组员，现增加2人并重新分配，使得四个小组人数相等。此时与原先相比，第一小组人数增加10人，第二小组人数减少1人，第三小组人数增加一倍，第四小组人数减半。则原先人数最多的小组与人数最少的小组之间相差：","options":{"A":"15人","B":"21人","C":"24人","D":"32人"},"answer":"C","explanation":"设重新分配后平均每组x人，则根据题意可知：\n\u003cimg data-k=\"b1c4013d45f3\" style=\"max-width:600px\">\n由上表可得，原先四个小组总人数\u003cimg data-k=\"0834715a4b93\"> ，解得x=14。可得原先四个小组人数分别为：第一小组=x-10=4人，第二小组=x+1=15人，第三小组\u003cimg data-k=\"29a2a988c816\">人，第四小组=2x=28人。则原先人数最多的小组与人数最少的小组之间相差28-4=24人。\n故正确答案为C。","no":47,"missingImage":false},{"type":"question","qid":"5102162","cat":"数学运算","stem":"某方舱医院配有1000张床位，现已接收新冠确诊患者200名，并按床护比（护士数与床位数的比值）0.6：1配齐了护士人员。因疫情发展迅速，该医院又收治了700名患者，此时床护比下调为0.2：1，那么还需增加护士：","options":{"A":"80名","B":"60名","C":"40名","D":"20名"},"answer":"B","explanation":"根据最初床护比为0.6：1，可求出最初200名患者配备的护士人数为200×0.6=120名；又收治700名患者后，患者总数变为200+700=900名，按照下调后床护比为0.2：1计算，共需护士900×0.2=180名，所以需增加护士人数=180-120=60名。\n故正确答案为B。","no":48,"missingImage":false},{"type":"question","qid":"5102321","cat":"数学运算","stem":"某助农志愿小分队采摘到甲、乙、丙三筐枸杞共144斤。第一次从甲筐中取出与乙筐一样重的枸杞放入乙筐，第二次再从现有乙筐中取出与丙筐一样重的枸杞放入丙筐，第三次从现有丙筐中取出与现有甲筐一样重的枸杞放入甲筐，此时三筐枸杞一样重。那么原来甲筐中有枸杞：","options":{"A":"36斤","B":"48斤","C":"56斤","D":"66斤"},"answer":"D","explanation":"方法一：甲、乙、丙三筐共144斤，最终三筐枸杞一样重，每筐144÷3=48斤，根据题意反推如下表：\n\u003cimg data-k=\"ef1849cf9209\" style=\"max-width:376px\">\n方法二：设最初甲、乙、丙分别有x斤、y斤、z斤枸杞，变化如下表：\n\u003cimg data-k=\"8d251008d196\" style=\"max-width:351px\">\n可列方程组：\u003cimg data-k=\"62e63abaea0c\">，解得\u003cimg data-k=\"927340a9c0ef\">。\n故正确答案为D。","no":49,"missingImage":false},{"type":"question","qid":"5102142","cat":"数学运算","stem":"某地采用传统销售模式，销售一批鸡蛋需要20天，销售一批桃子需要25天。为推动销售，当地开启县领导直播带货模式，直播带货期间，鸡蛋的销售效率提高为原来的2倍，桃子销售效率为原来的3倍；其余销售时间依然按照传统模式进行，结果两种产品同时销售完成。那么销售期间直播带货的天数为：","options":{"A":"3","B":"5","C":"8","D":"10"},"answer":"B","explanation":"除了销售时间相同，销售鸡蛋和销售桃子没有其它关系，所以二者是相互独立的，因此可赋值传统销售模式下的鸡蛋和桃子的销售效率均为1，则直播带货期间，鸡蛋销售效率为2，桃子销售效率为3。根据题意可得，该批鸡蛋总量为20×1=20，该批桃子总量为25×1=25。设销售期间直播带货的天数为x，则非直播带货的鸡蛋销售时间为\u003cimg data-k=\"dea08e5a5d68\">，非直播带货的桃子销售时间为\u003cimg data-k=\"00616aee543a\">。因为两种产品同时销售完成，其中的直播带货时间相同，那么非直播带货的时间也相同，即20-2x=25-3x，解得x=5，因此销售期间直播带货的天数为5。\n故正确答案为B。","no":50,"missingImage":false},{"type":"question","qid":"5102161","cat":"数学运算","stem":"为了加强环境治理和生态修复，某市派出4位专家（甲、乙、丙、丁）前往某山区3个勘探点进行环境检测，要求每个勘探点至少安排一名专家。那么甲、乙两名专家去了不同勘探点的概率是：","options":{"A":"\u003cimg data-k=\"97dceef419de\">","B":"\u003cimg data-k=\"6f9d0abe3e0f\">","C":"\u003cimg data-k=\"3ca0481893af\">","D":"\u003cimg data-k=\"a8b04cd19bab\">"},"answer":"C","explanation":"4位专家分配到3个勘探点，要求每个勘探点至少安排一名专家，则有一个勘探点需要分配2位专家。从4位专家中选择两位，有\u003cimg data-k=\"56f10476feff\">种情况，将选择的两位专家当作一个整体，与另外两位专家分别分配到3个勘探点，共有\u003cimg data-k=\"a6bfbd5c06d2\">种情况，则总情况数有6×6=36种。\n甲、乙两名专家去了不同勘探点，从正向分析情况数较多，考虑反向计算，即甲、乙两名专家去了同一勘探点。将甲、乙两名专家当作一个整体，与另外两位专家分别分配到3个勘探点，共有\u003cimg data-k=\"a6bfbd5c06d2\">种情况。即甲、乙两名专家去了同一勘探点共有6种情况。\n则所求概率\u003cimg data-k=\"4aa9059e6b84\">\u003cimg data-k=\"796f497a05fe\">\u003cimg data-k=\"a781c3abaf40\">。\n故正确答案为C。","no":51,"missingImage":false},{"type":"question","qid":"5102140","cat":"数学运算","stem":"北京冬奥会期间，冬奥会吉祥物“冰墩墩”纪念品十分畅销。销售期间某商家发现，进价为每个40元的“冰墩墩”，当售价定为44元时，每天可售出300个，售价每上涨1元，每天销量减少10个。现商家决定提价销售，若要使销售利润达到最大，则售价应为：","options":{"A":"51元","B":"52元","C":"54元","D":"57元"},"answer":"D","explanation":"设“冰墩墩”纪念品售价共上涨x元，销售利润为y元。根据题意，可列方程：\u003cimg data-k=\"b6b77010028a\">，即\u003cimg data-k=\"de1f2daeae5b\">，令y=0，解得\u003cimg data-k=\"45a0f105bb26\">，\u003cimg data-k=\"c9ac4187942a\">，当\u003cimg data-k=\"0d2a839367ab\">时，总利润最大，此时售价为44+13=57元。\n故正确答案为D。","no":52,"missingImage":false},{"type":"question","qid":"5102311","cat":"数学运算","stem":"某商场为庆祝开业三周年，制作了一个长方形大蛋糕，并切成四块，如图所示。假设这个蛋糕可供350人享用，左下角那块蛋糕平均可供50人享用，右上角那块蛋糕平均可供70人，则中间最大块蛋糕平均可供多少人享用？\n\u003cimg data-k=\"665d8962f6fb\" style=\"max-width:412px\">","options":{"A":"150","B":"155","C":"175","D":"180"},"answer":"B","explanation":"假设平均每人享用蛋糕\u003cimg data-k=\"6c90394679b6\">，则蛋糕面积为\u003cimg data-k=\"68b41ba7f4ab\">，赋值蛋糕的长为35cm，宽为10cm。如下图所示：\n\u003cimg data-k=\"339b94dca085\" style=\"max-width:398px\">\n根据“左下角那块蛋糕平均可供50人享用，右上角那块蛋糕平均可供70人”可知\u003cimg data-k=\"7ac0d225fd46\">，\u003cimg data-k=\"cd51b395c516\">，根据三角形面积公式：\u003cimg data-k=\"b11a4eeb4386\">，可得：CE\u003cimg data-k=\"94811de5e6d7\">cm，BF\u003cimg data-k=\"119a449c0b20\">cm，则ED=35-10=25cm，DF=10-4=6cm，则\u003cimg data-k=\"dbd4dab2ee59\">，故\u003cimg data-k=\"ced5e0cf4afd\">，平均可供155人享用，即中间最大块蛋糕平均可供155人享用。\n故正确答案为B。","no":53,"missingImage":false},{"type":"question","qid":"5102127","cat":"数学运算","stem":"某市举行庆典活动，将依次升空105架无人机，升空方式如下：每架无人机间距均相等，第一次升空n架，第二次升空n-1架，以此类推，最终在夜空中组成一个近似等边三角形背景的灯光秀，那么第10次升空的无人机数量是：","options":{"A":"3架","B":"5架","C":"8架","D":"10架"},"answer":"B","explanation":"根据题意可知，每次升空的无人机数量组成等差数列。又因为“组成一个近似等边三角形”，则第一次升空n架（\u003cimg data-k=\"55e3564ec1a3\">）为底边，最后一次升空的无人机在三角形的顶点上，数量为1架（\u003cimg data-k=\"488e4f8cdea0\">），且公差d＝-1。根据等差数列求和公式：\u003cimg data-k=\"fcb7d670761f\">，可得\u003cimg data-k=\"f960e1048e8f\">，解得n＝14。再根据等差数列通项公式：\u003cimg data-k=\"bd9a568a4619\">，则\u003cimg data-k=\"e1264c95e33e\">，故第10次升空的无人机数量是5架。\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"5102135","cat":"数学运算","stem":"某城市规划馆有一个边长为40米的正三角形数字展厅，展厅中布置有5台投影设备，用于展示城市的过去、现在以及畅想城市的未来。每台投影设备的尺寸忽略不计，则任意两台设备之间的最小距离：","options":{"A":"小于10米","B":"不超过16米","C":"不超过20米","D":"在23～28米之间"},"answer":"C","explanation":"根据题意“在正三角形数字展厅内部布置5台投影设备”，假设其中3台投影设备放在正三角形数字展厅的三个顶点，即蓝色圆点处，如下图所示。此时若想使剩余2台设备的距离尽量大，连接正三角形各边上的中点，可得到小正三角形，从红色圆点处任选2个放置剩余2台投影设备即可得到最大间距，则任意两台设备之间的最小距离不超过\u003cimg data-k=\"46fd8fb468f1\">米。\n\u003cimg data-k=\"213650e1cd0e\" style=\"max-width:269px\">\n故正确答案为C。","no":55,"missingImage":false},{"type":"question","qid":"5102309","cat":"数学运算","stem":"某镇卫生院50多名医生被平均分配到13个基层诊所参与工作，其中男医生比女医生多4人。工作结束后，25％的男医生和一部分女医生继续到邻镇4个医疗点支援工作，这批人员中任意6人必有男医生，且保证必有一个医疗点的女医生多于1人。那么该卫生院到邻镇支援工作的医生共有：","options":{"A":"12人","B":"14人","C":"16人","D":"18人"},"answer":"A","explanation":"根据题意，某镇卫生院50多名医生被平均分配到13个基层诊所参与工作，医生总数为13的倍数，则医生总数只能为52人。由于男医生比女医生多4人，则男医生有\u003cimg data-k=\"d8b47d91d80b\">人，女医生有\u003cimg data-k=\"8189b4e95986\">人，分配到邻镇的男医生有28×25%=7人。要使这批人员中任意6人必有男医生，则女医生的人数应小于6人；又因有4个医疗点，且要保证必有一个医疗点的女医生多于1人，则女医生的人数应大于4人，故女医生的人数为5人。则该卫生院到邻镇支援工作的医生有7+5=12人。\n故正确答案为A。\n注：男医生人数为7人，女医生人数少于6人，则医生总人数少于13人，只有A项满足。","no":56,"missingImage":false},{"type":"question","qid":"5102138","cat":"数学运算","stem":"用一个长为20厘米、宽为2厘米、高为1.5厘米的长方体木料，制作一串半径最大的木珠子，不考虑制作过程中的损耗，则这串珠子的数量最多为：","options":{"A":"10个","B":"13个","C":"14个","D":"20个"},"answer":"C","explanation":"木珠子是球形的，需要从长方体木料的内部进行切割，由于长方体的高为1.5厘米，则木珠子的最大直径为长方体的高1.5厘米，即半径最大。长方体的宽为2厘米，木珠子的直径为1.5厘米，制作过程中，要令数量最多，木珠子错落摆放即满足要求。摆放过程注意不要超出长方体木料的长度，用前两个珠子的摆放作为演示：\n\u003cimg data-k=\"ae7131a34bbf\" style=\"max-width:291px\">\nAC是两个木珠子球心的连线，长度即为木珠子的直径1.5厘米，AC为斜边做直角三角形ABC，AC即两个球心间的最短距离。BC的长度为长方体的宽-木珠子的半径-B点距长方体左边的边长，且AB垂直BC，可得出B点距长方体左边的边长即A点距长方体边长的距离0.75厘米，可求BC长=2-0.75-0.75=0.5厘米，在直角三角形ABC中，利用勾股定理可以求出AB长为\u003cimg data-k=\"00851e5575b3\">厘米，即在AB所在直线上，相邻两个珠子间距（把珠子看成点）为\u003cimg data-k=\"6f3f1e3b3561\">厘米，且第一个和最后一个珠子的球心距长方体木料两端至少为0.75厘米。则制作的珠子数量=段数+1，段数\u003cimg data-k=\"e6c7a9c8511f\">\u003cimg data-k=\"3db10e46aef0\">，即分为13段，那么珠子数量最多=13+1=14个。\n故正确答案为C。","no":57,"missingImage":false},{"type":"question","qid":"5102159","cat":"数学运算","stem":"三星堆一号祭祀坑出土一枚金杖（如下图所示），全长1.42米，直径2.3厘米，采用的是金皮包卷在圆柱形木头上，出土时，金皮重约500克，已知60克黄金的体积是3.1088立方厘米，则金皮的厚度大约是：（保留小数点后两位）\n\u003cimg data-k=\"028884475f6a\" style=\"max-width:99px\">","options":{"A":"0.25mm","B":"0.51mm","C":"0.87mm","D":"1.02mm"},"answer":"A","explanation":"根据题意，金皮展开后为长方体，展开图如下图所示。设金皮的厚度为x厘米，根据长方体体积公式：\u003cimg data-k=\"b1244fc44f9e\">=长×宽×高，可得金皮的体积为：\u003cimg data-k=\"1e7317ee34c8\">，根据体积与重量成正比，则可列式：\u003cimg data-k=\"367fb6d3f4af\">，则\u003cimg data-k=\"32ed8836577e\">，\u003cimg data-k=\"ba0374d151ae\">取3.14，解得\u003cimg data-k=\"9adb3f0b5e04\">厘米，即0.25mm。\n\u003cimg data-k=\"c0b598b532b5\" style=\"max-width:142px\">\n故正确答案为A。","no":58,"missingImage":false},{"type":"question","qid":"5102158","cat":"数学运算","stem":"商家门口摆放了一把正四棱锥形（底面为正方形，侧面为四个全等的等腰三角形）的遮阳伞，第一次伞撑开到图1所示的位置，伞柄与伞骨成角\u003cimg data-k=\"480293f12b83\">为\u003cimg data-k=\"5608ab142532\">，继续撑开到如图2所示的位置，伞柄与伞骨成角\u003cimg data-k=\"da3733cc4faf\">变为\u003cimg data-k=\"c1ec48dc2933\">，那么第二次伞撑开后形成的正方形\u003cimg data-k=\"ec9e715d2932\">是第一次撑开后正方形ABCD面积的：\n\u003cimg data-k=\"bbacf5d2101a\" style=\"max-width:600px\">","options":{"A":"\u003cimg data-k=\"44cab75270c7\">倍","B":"\u003cimg data-k=\"8569e91685c6\">倍","C":"2倍","D":"3倍"},"answer":"D","explanation":"连接CQ，如图1所示，因PQ与正四棱锥的底面垂直，故三角形CPQ为直角三角形，在直角三角形CPQ中，\u003cimg data-k=\"922938a41bcb\">，故\u003cimg data-k=\"0e67ad6c2e7d\">。同理，连接\u003cimg data-k=\"8c05438d968d\">，如图2，在直角三角形\u003cimg data-k=\"2cfb12c72edb\">中，\u003cimg data-k=\"fea1eff68395\">，故\u003cimg data-k=\"62105f7e5441\">，根据\u003cimg data-k=\"80e1103df02b\"> ，\u003cimg data-k=\"b60623fa9bd7\">，且\u003cimg data-k=\"db5f1899f678\">，可得 \u003cimg data-k=\"875048db7663\">\u003cimg data-k=\"c1c5e8e84fd1\">\u003cimg data-k=\"4eb1582bfb3b\">，故第二次伞撑开后形成的正方形\u003cimg data-k=\"ec9e715d2932\">是第一次撑开后正方形ABCD面积的3倍。\n\u003cimg data-k=\"344f59bf5851\" style=\"max-width:600px\">\n故正确答案为D。","no":59,"missingImage":false},{"type":"question","qid":"5102160","cat":"数学运算","stem":"A、B两个乡镇分布于山谷两侧，山谷间有一条宽为2km的河道（如下图所示）。当地政府决定在两个乡镇间修建一条跨河公路促进旅游发展。由于架桥费用高昂，所以要求跨河公路中的桥梁路段长度最短。那么根据图中数据，从A镇前往B镇的最短距离为：\n\u003cimg data-k=\"fbdae63556cd\" style=\"max-width:600px\">","options":{"A":"17km","B":"15km","C":"19km","D":"20km"},"answer":"B","explanation":"根据题目要求桥长2km，最短距离=AB最短距离+桥长，如下图所示，将河流看成一条直线，两点之间线段最短，连接AB构成直角三角形ABC，\u003cimg data-k=\"e13154a5d51d\">km。\n\u003cimg data-k=\"ec77f8b4bd13\" style=\"max-width:600px\">\n从A镇前往B镇的最短距离=13+2=15km。\n故正确答案为B。","no":60,"missingImage":false}],"count":15,"answerable":15,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"5102228","cat":"类比推理","stem":"姹紫：嫣红","options":{"A":"嘉言：懿行","B":"风刀：霜剑","C":"小家：碧玉","D":"疾首：蹙额"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n姹紫嫣红形容各种颜色的花卉艳丽、好看，“姹紫”指美丽的紫色，“嫣红”指鲜艳的红色，二者为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：嘉言懿行指有教育意义的好言语和好行为，“嘉言”指有益的言论，“懿行”指高尚的行为，二者为并列关系，与题干逻辑关系一致，保留；\nB项：风刀霜剑指寒风像刀子，严霜像剑一样刺人的肌肤，形容气候寒冷，也比喻世态险恶，“风刀”指风如刀，“霜剑”指霜似剑，二者为并列关系，与题干逻辑关系一致，保留；\nC项：小家碧玉指小户人家的年轻美貌的女子，“小家”指小户人家，“碧玉”指年轻美貌的女子，二者不是并列关系，与题干逻辑关系不一致，排除；\nD项：疾首蹙额形容厌恶、痛恨的样子，“疾首”指头痛，“蹙额”指皱眉，二者为并列关系，与题干逻辑关系一致，保留。\n对比A、B、D三项，题干中，“姹”修饰“紫”，“嫣”修饰 “红”，“姹紫”和“嫣红”均为偏正结构；A项的“嘉言”和“懿行”均为偏正结构，B项的“风刀”和“霜剑”不是偏正结构，D项的“蹙额”是动宾结构，所以A项与题干的逻辑关系更加一致。\n\n故正确答案为A。","no":61,"missingImage":false},{"type":"question","qid":"5102169","cat":"类比推理","stem":"电脑：设备","options":{"A":"广播：传媒","B":"颜料：绘画","C":"文言：白话","D":"能源：煤炭"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n电脑是一种设备，二者是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：传媒指传播媒介，特指报纸、广播、电视、网络等各种新闻工具，广播是一种传媒，二者是种属关系，与题干逻辑关系一致，当选；\nB项：颜料是绘画所用的材料，二者不是种属关系，与题干逻辑关系不一致，排除；\nC项：文言和白话为汉语书面语的两种形式，二者是并列关系而非种属关系，与题干逻辑关系不一致，排除；\nD项：煤炭是一种能源，二者是种属关系，但两词顺序与题干相反，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"5102358","cat":"类比推理","stem":"帛书：简牍","options":{"A":"日晷：秒表","B":"熊猫：银杏","C":"青铜：礼器","D":"牛车：轿子"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n帛书是指中国古代写在绢帛上的文书；简牍是指中国古代书写在竹简或木片上的文书，二者是两种不同的书，为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：日晷和秒表是两种不同的计时器，二者为并列关系，与题干逻辑关系一致，保留；\nB项：熊猫是动物，银杏是植物，二者不是并列关系，与题干逻辑关系不一致，排除；\nC项：青铜是制作礼器的原材料之一，二者为原材料与成品的对应关系，与题干逻辑关系不一致，排除；\nD项：牛车和轿子是两种不同的交通工具，二者为并列关系，与题干逻辑关系一致，保留。\n对比A、D两项，题干中的帛书和简牍都是古代出现的事物，A项中的日晷是古代出现的事物，但秒表是现代出现的事物，D项中的牛车起源于商代，牛车和轿子都是古代出现的事物，故D项与题干的关系更近。\n故正确答案为D。","no":63,"missingImage":false},{"type":"question","qid":"5102233","cat":"类比推理","stem":"针线：布料：服饰","options":{"A":"剪刀：彩纸：窗花","B":"刻刀：玺印：玉石","C":"玻璃：窗户：窗框","D":"鸡精：乌鸡：鸡汤"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n针线是制作服饰的工具，布料是制作服饰的原材料，三者为工具、原材料、成品的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：剪刀是制作窗花的工具，彩纸是制作窗花的原材料，三者为工具、原材料、成品的对应关系，与题干逻辑关系一致，当选；\nB项：刻刀是制作玺印的工具，玉石是制作玺印的原材料，三者为工具、成品、原材料的对应关系，但三词顺序与题干不同，与题干逻辑关系不一致，排除；\nC项：玻璃和窗框是窗户的组成部分，与题干逻辑关系不一致，排除； \nD项：鸡精是一种调味品，不是制作鸡汤的工具，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":64,"missingImage":false},{"type":"question","qid":"5102174","cat":"类比推理","stem":"电影院：影片：放映","options":{"A":"图书馆：资料：查阅","B":"下水道：地漏：排水","C":"传染病：疫苗：防疫","D":"朋友圈：微信：聊天"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n在电影院放映影片，放映影片是动宾关系，电影院是放映影片的地点。\n第二步：判断选项词语间逻辑关系。\nA项：在图书馆查阅资料，查阅资料是动宾关系，图书馆是查阅资料的地点，与题干逻辑关系一致，当选；\nB项：地漏具有排水的功能，二者是功能对应关系，与题干逻辑关系不一致，排除；\nC项：不能说在传染病防疫疫苗，且传染病不是一个地点，与题干逻辑关系不一致，排除；\nD项：不能说在朋友圈聊天微信，且朋友圈不是一个地点，微信具有聊天的功能，二者是功能对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":65,"missingImage":false},{"type":"question","qid":"5102209","cat":"类比推理","stem":"马匹：船只：车辆","options":{"A":"银两：金钱：银币","B":"纸张：试卷：画册","C":"水杯：油瓶：饭碗","D":"官员：武将：首领"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n马匹、船只和车辆都有运输的功能，三者在功能上是并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：银两是以银锭为主要形式的一种秤量货币单位，金钱多指用金属铸成的钱，后泛指货币财富，银两是金钱，二者是种属关系，与题干逻辑关系不一致，排除；\nB项：纸张是制作试卷的原材料，二者是原材料与成品的对应关系，与题干逻辑关系不一致，排除；\nC项：水杯、油瓶和饭碗都有盛装物品的功能，三者在功能上是并列关系，与题干逻辑关系一致，当选；\nD项：武将是古代的军事将领或部队军官，武将是官员，二者是种属关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"5102165","cat":"类比推理","stem":"肥：瘦：挑肥拣瘦","options":{"A":"上：下：欺上瞒下","B":"来：去：翻来覆去","C":"黑：白：黑白分明","D":"是：非：口是心非"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n肥与瘦为反义词，且肥在第三个词语中的2号位，瘦在第三个词语中的4号位，第三个词语拆分之后，挑肥与拣瘦均为动宾结构。\n第二步：判断选项词语间逻辑关系。\nA项：上与下为反义词，上在第三个词语中的2号位，下在第三个词语中的4号位，第三个词语拆分之后，欺上与瞒下均为动宾结构，与题干逻辑关系一致，当选；\nB项：来与去为反义词，来在第三个词语中的2号位，去在第三个词语中的4号位，第三个词语拆分之后，翻来与覆去不是动宾结构，与题干逻辑关系不一致，排除；\nC项：黑与白为反义词，黑在第三个词语中的1号位，白在第三个词语中的2号位，与题干逻辑关系不一致，排除；\nD项：是与非为反义词，是在第三个词语中的2号位，非在第三个词语中的4号位，第三个词语拆分之后，口是与心非不是动宾结构，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":67,"missingImage":false},{"type":"question","qid":"5102171","cat":"类比推理","stem":"征稿：评选：颁奖","options":{"A":"运动：热身：放松","B":"节能：减排：环保","C":"设计：施工：监理","D":"麻醉：切开：缝合"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n先征稿，再评选，最后颁奖，三者为动作上的先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：先热身，再运动，两词顺序与题干相反，与题干逻辑关系不一致，排除；\nB项：节能和减排是并列关系，不分先后，且节能和减排都属于环保措施，与题干逻辑关系不一致，排除；\nC项：先设计，再施工，监理是指对工程项目等进行监督管理，监理的主要内容是熟悉所监理项目的合同条款、规范、设计图纸，有效开展现场监理工作，及时报告施工过程中出现的问题等，所以施工和监理可以同时发生，没有一定的先后顺序，与题干逻辑关系不一致，排除；\nD项：先麻醉，再切开，最后缝合，三者为动作上的先后顺序的对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":68,"missingImage":false},{"type":"question","qid":"5102173","cat":"类比推理","stem":"晴空万里 对于 （    ） 相当于 （    ） 对于 识文断字","options":{"A":"天干物燥；才高八斗","B":"雨后春笋；妙笔生花","C":"阴云密布；胸无点墨","D":"倾盆大雨；味同嚼蜡"},"answer":"C","explanation":"逐一代入选项。\nA项：“晴空万里”形容天空晴朗，没有一点云彩，“天干物燥”意思是天气太干，物品也干燥，极易起火，二者无明显逻辑关系；“才高八斗”比喻才学极高，“识文断字”意思是能识字读书，指有一点文化知识，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nB项：“晴空万里”形容天空晴朗，没有一点云彩，“雨后春笋”指春天下大雨后，发出来的竹笋一下子就长出来很多，比喻新生事物迅速大量地涌现出来，二者无明显逻辑关系；“妙笔生花”比喻写作能力大有进步，或形容文章写得很出色，“识文断字”意思是能识字读书，指有一点文化知识，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：“晴空万里”形容天空晴朗，没有一点云彩，“阴云密布”形容浓厚的云层或空气中的大量的烟尘遮蔽天日，二者为反义关系；“胸无点墨”意思是肚子里没有一点墨水，指没有文化，“识文断字”意思是能识字读书，指有一点文化知识，二者为反义关系，前后逻辑关系一致，当选；\nD项：“晴空万里”形容天空晴朗，没有一点云彩，“倾盆大雨”形容雨大势急，二者为反义关系；“味同嚼蜡”意思是像吃蜡一样，没有一点儿味，形容语言或文章枯燥无味，“识文断字”意思是能识字读书，指有一点文化知识，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"5102192","cat":"类比推理","stem":"入木三分 对于 （    ） 相当于 （    ） 对于 音乐","options":{"A":"绘画；珠圆玉润","B":"雕刻；黄钟大吕","C":"建筑；高山流水","D":"书法；余音绕梁"},"answer":"D","explanation":"逐一代入选项。\nA项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，与绘画无明显逻辑关系；珠圆玉润形容歌声婉转优美或文字流畅明快，用来形容音乐，二者为对应关系。前后逻辑关系不一致，排除；\nB项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，与雕刻无明显逻辑关系；黄钟大吕形容正大、庄严、高妙的音乐或文辞，用来形容音乐，二者为对应关系。前后逻辑关系不一致，排除；\nC项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，与建筑无明显逻辑关系；高山流水指知音难觅或乐曲高妙，用来形容音乐，二者为对应关系。前后逻辑关系不一致，排除；\nD项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，用来形容书法，二者构成对应关系；余音绕梁形容歌声或音乐优美，耐人回味，用来形容音乐，二者构成对应关系。前后逻辑关系一致，当选。\n故正确答案为D。","no":70,"missingImage":false},{"type":"question","qid":"5102197","cat":"定义判断","stem":"衰老通常分为生理性衰老和病理性衰老。生理性衰老是指随着年龄增长出现的衰老，也就是自然老化。病理性衰老是指衰老速度由于负面情绪、物理创伤、营养匮乏、身体疾病等各种因素的作用而加快。\n根据上述定义，下列诗词所描述的现象最符合病理性衰老的是：","options":{"A":"白头搔更短，浑欲不胜簪","B":"寒暑迭变，不觉渐成衰老","C":"惟草木之零落兮，恐美人之迟暮","D":"人生不得长欢乐，年少须臾老到来"},"answer":"A","explanation":"第一步：找出定义关键词。\n病理性衰老：“由于负面情绪、物理创伤、营养匮乏、身体疾病”、“衰老速度加快”；\n生理性衰老：“随着年龄增长出现的衰老”、“自然老化”。\n第二步：逐一分析选项。\nA项：“白头搔更短，浑欲不胜簪”意思为“愁闷心烦只有搔首而已，致使白发疏稀插不上簪”，愁闷心烦符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，白发稀疏是衰老的明显特征之一，而更稀疏符合“衰老速度加快”，符合“病理性衰老”定义，当选；\nB项：“寒暑迭变，不觉渐成衰老”意思为“冬天和夏天交替变化，没有感觉就已渐渐衰老”，时间的变化导致的衰老，不符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，也未体现“衰老速度加快”，不符合“病理性衰老”定义，排除；\nC项：“惟草木之零落兮，恐美人之迟暮”意思为“想到树上黄叶纷纷飘零，而害怕美人头上也添上丝丝霜鬓”，诗人只是表达了害怕美人衰老，而不是描写美人已经衰老，又为何衰老，不符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，也未体现“衰老速度加快”，不符合“病理性衰老”定义，排除；\nD项：“人生不得长欢乐，年少须臾老到来”意思为“人的一生得不到长久的欢乐，青春年少的时光总是过的很快，老年很快就来了”，诗人感叹的是时光飞逝，是由于时间的原因导致衰老，不符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，也未体现“衰老速度加快”，不符合“病理性衰老”定义，排除。\n故正确答案为A。\n注——本题出处如下：\nhttps://baike.baidu.com/item/%E8%A1%B0%E8%80%81/1169838?fr=aladdin","no":71,"missingImage":false},{"type":"question","qid":"5102223","cat":"定义判断","stem":"深度学习是指在模仿人脑机制的神经网络中，对人工神经元的层进行了“多层处理”。深度学习不仅可以让AI（人工智能）读取大量图片，还可以让AI自主提取图片特征。得益于深度学习技术的面世，只要有大量数据，AI就能以极高的准确率进行学习，从而大幅度拓展了AI的应用范围。\n根据上述定义，下列属于深度学习的是：","options":{"A":"人工智能图片教学走进课堂让学生体验深度学习","B":"问诊机器人可以迅速获取病患B超报告的风险信息","C":"某设区市在数字峰会期间提供无人驾驶汽车试乘服务","D":"安防巡检机器人通过图像识别技术判定工人是否佩戴安全帽"},"answer":"D","explanation":"第一步：找出定义关键词。\n“AI（人工智能）读取大量图片”、“自主提取图片特征”。\n第二步：逐一分析选项。\nA项：让学生观看人工智能的图片来体验深度学习，是让学生观看图片，不是让AI读取图片，不符合“AI（人工智能）读取大量图片”，不符合定义，排除；\nB项：问诊机器人可以识别B超报告，但报告中不只含有图片，还含有文字性诊断结果可以直接告知病患风险信息，而不需要AI提取，不符合“AI（人工智能）读取大量图片”、“自主提取图片特征”，不符合定义，排除；\nC项：提供无人驾驶汽车试乘服务，不是让AI读取图片，不符合“AI（人工智能）读取大量图片”、“自主提取图片特征”，不符合定义，排除；\nD项：安防巡检机器人通过识别工人的图像来判定工人是否佩戴安全帽，符合“AI（人工智能）读取大量图片”、“自主提取图片特征”，符合定义，当选。\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"5102247","cat":"定义判断","stem":"乡情治理是指乡情作用于基层社会治理主体和治理体系，在基层社会的意见整合、利益协调、矛盾化解、服务供给等治理过程中发挥重要作用的一种治理形态。“乡情”是一种基于地域以及附着在经济、社会、文化纽带上的特殊情感，体现为认同感、归属感、荣誉感及在此基础上的回馈意愿和公共精神。乡情治理的核心是存在一个由情感和认同构筑的场域，这个场域通过一些微观机制影响个体动机和群体行为，从而影响社会治理体系和过程。\n根据上述定义，下列属于乡情治理的是：","options":{"A":"顺德人都以顺德是“世界美食之都”而自豪","B":"敢拼会赢的精神一直激励着闽南人勇闯南洋","C":"海外华侨华人一直有着爱国爱乡的光荣传统","D":"北岸乡贤成立妈祖慈善基金会服务当地桑梓"},"answer":"D","explanation":"第一步：找出定义关键词。\n“乡情作用于基层社会治理主体和治理体系”、“在基层社会的治理过程中发挥重要作用”、“由情感和认同构筑的场域”、“影响社会治理体系和过程”。\n第二步：逐一分析选项。\nA项：“以顺德是‘世界美食之都’而自豪”只表明顺德人对当地的情感和认同，但是没有体现出对基层社会的治理，不符合“乡情作用于基层社会治理主体和治理体系”、“在基层社会的治理过程中发挥作用”，不符合定义，排除；\nB项：“敢拼会赢的精神”只表明这是闽南人的一种精神，并不是对于某地域的乡情，所以不存在由情感和认同构筑的场域，不符合“由情感和认同构筑的场域”，同时并没有体现出治理，不符合“乡情作用于基层社会治理主体和治理体系”，不符合定义，排除；\nC项：“爱国爱乡的光荣传统”只是海外华侨华人的品格，并不是对于某地域的乡情，所以不存在由情感和认同构筑的场域，不符合“由情感和认同构筑的场域”，同时并没有体现出治理，不符合“乡情作用于基层社会治理主体和治理体系”，不符合定义，排除；\nD项：“乡贤成立妈祖慈善基金会”说明当地人认同本地区的文化，存在由情感和认同构筑的场域，符合“由情感和认同构筑的场域”，而且“服务当地桑梓”是一种基层社会治理，符合“乡情作用于基层社会治理主体和治理体系”、“影响社会治理体系和过程”，符合定义，当选。\n故正确答案为D。","no":73,"missingImage":false},{"type":"question","qid":"5102355","cat":"定义判断","stem":"参照群体理论是关于人的社会心理态度和行为怎样受其从属的或追求的群体参照力所影响的社会心理学理论。参照群体是指个体从心理上把自己列入、与之对照，并在评价、态度、行为上和在规范与价值观形成上接受其影响的群体。\n根据上述定义，下列选项不能用参照群体理论解释的是：","options":{"A":"小王平时喜欢便装，但是参加面试时他决定穿着西装","B":"夏秋之际，妈妈怕孩子受凉，很注意给孩子增减衣物","C":"小刘看其他影迷都购买了偶像同款商品，自己也去买","D":"小张父母都是医生，她比常人更在意身边的卫生状况"},"answer":"B","explanation":"第一步：找出定义关键词。\n“受其从属的或追求的群体参照力所影响”。\n第二步：逐一分析选项。\nA项：小王平时喜欢便装，但参加面试时穿了西装，是因为面试时大多数人都选择正式的西装，小王也受其影响，因而在面试时做出同样的选择，符合“受其从属的或追求的群体参照力所影响”，符合定义，排除； \nB项：妈妈给孩子增减衣物是因为天气转凉，妈妈行为的变化是受天气变化的影响而不是群体的影响，不符合“受其从属的或追求的群体参照力所影响”，不符合定义，当选；\nC项：小刘购买偶像同款商品是因为其他影迷都购买了，小刘的行为受影迷群体的影响，符合“受其从属的或追求的群体参照力所影响”，符合定义，排除；\nD项：小张在意卫生状况是因为小张的父母都是医生，小张的行为受其父母的影响，符合“受其从属的或追求的群体参照力所影响”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":74,"missingImage":false},{"type":"question","qid":"5102199","cat":"定义判断","stem":"最小干预原则是指在保证文物安全的基本前提下，通过最小程度的介入来最大限度地维系文物的原本面貌，保留文物的历史、文化价值，以实现延续现状、降低保护性破坏的目标。\n根据上述定义，下列选项不属于最小干预原则的是：","options":{"A":"某博物馆在修复古籍时不拆开原线绳，只修补蛀洞严重的书页，而不修补强度未受蛀洞影响的书页","B":"某博物馆的一幅雕塑作品中的人物手臂缺失，专家们查阅了原始资料，根据资料将其复原如初","C":"某古城墙修缮时，保留其残损的现状，在靠近边墙的一侧恢复了很窄的台阶供游人安全通过","D":"某古塔倾斜，专家们在研究后最终决定只纠偏一度，它看上去依旧是倾斜的状态"},"answer":"B","explanation":"第一步：找出定义关键词。\n“保证文物安全”、“最小程度的介入”、“最大限度地维系文物的原本面貌”、“延续现状、降低保护性破坏”。\n第二步：逐一分析选项。\nA项：某博物馆在修复古籍时不拆开原线绳，只修补蛀洞严重的书页，符合“最小程度的介入”，不修补强度未受蛀洞影响的书页，符合“最大限度地维系文物的原本面貌”，符合定义，排除；\nB项：雕塑作品中的人物手臂缺失，根据资料将其复原如初，并没有保留现状，也没有体现是不是最小程度的改变，不符合“最小程度的介入”、“最大限度地维系文物的原本面貌”，不符合定义，当选；\nC项：某古城墙修缮时，保留其残损的现状，符合“最大限度地维系文物的原本面貌”，在靠近边墙的一侧恢复了很窄的台阶，说明修复的地方很少，符合“最小程度的介入”，符合定义，排除；\nD项：某古塔倾斜，专家们只纠偏一度，说明修复的很少，符合“最小程度的介入”，依旧保留倾斜的状态，符合“最大限度地维系文物的原本面貌”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":75,"missingImage":false},{"type":"question","qid":"5102222","cat":"定义判断","stem":"回应性监管是指政府通过制度设计，采用多样化的监管手段和策略对市场主体和社会组织进行动态化、智能化、差别化的监管。回应性监管强调监管主体的多元化，除政府以外，企业、社会组织，乃至被监管对象都是监管主体；在监管策略上，采取差异化、阶梯化的监管方式，即政府首先鼓励自我监管，难以奏效时才采取更为严厉的强化型自我监管直至命令控制型监管。\n根据上述定义，下列选项没有体现回应性监管的是：","options":{"A":"某地主管部门因食品安全问题突击整顿涉事企业","B":"瑞典立法要求工作场所必须建立安全环保的内控体系","C":"英国成立企业、工会代表组成的大健康监管委员会","D":"聘请专业的第三方机构对企业安全生产状况进行评估"},"answer":"A","explanation":"第一步：找出定义关键词。\n“采用多样化的监管手段和策略”、“监管主体的多元化”。\n第二步：逐一分析选项。\nA项：某地主管部门直接对涉事企业进行了整顿，监管只有某地主管部门一个，没有体现出监管手段的多样化，不符合“采用多样化的监管手段和策略”，不符合定义，当选；\nB项：瑞典立法要求建立内控体系，说明除政府外还有其他监管手段和策略，内控体系也体现了“差别化的监管”，符合“采用多样化的监管手段和策略”，符合定义，排除；\nC项：英国成立企业、工会代表组成的大健康监管委员会，说明监管由不同主体共同完成，体现了多样化的监管手段和策略，符合“采用多样化的监管手段和策略”，符合定义，排除；\nD项：聘请专业的第三方机构，说明除第三方机构外可能还有其他的监管主体，可能符合 “监管主体的多元化”，比A更好，符合定义，排除。\n本题为选非题，故正确答案为A。","no":76,"missingImage":false},{"type":"question","qid":"5102236","cat":"定义判断","stem":"生殖隔离可以区分为合子前隔离和合子后隔离。合子前隔离是指由于活动区域、生活习性、体态差异等各种因素导致无法进行基因交流，从而产生生殖隔离。相比来说，合子后隔离则是因为遗传信息的不匹配，即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍。\n根据上述定义，下列现象体现合子后隔离的是：","options":{"A":"甲种兰花通过a昆虫授粉，乙种兰花通过b昆虫授粉，二者只能通过人工授粉进行繁殖","B":"三倍体西瓜开花后，用二倍体西瓜的花朵进行授粉，培育无籽西瓜","C":"富尔顿蟋蟀和宾州蟋蟀的鸣声不同，无法相互吸引，不会进行交配","D":"13年蝉和17年蝉的发情期不同，没有交配机会"},"answer":"B","explanation":"第一步：找出定义关键词。\n合子前隔离：“由于活动区域、生活习性、体态差异等各种因素”、“导致无法进行基因交流”；\n合子后隔离：“因为遗传信息的不匹配”、“即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍”。\n第二步：逐一分析选项。\nA项：两种兰花因“授粉昆虫不同”无法自然进行基因交流，但可以通过人工授粉进行繁殖，不符合“即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍”，不符合“合子后隔离”的定义，排除；\nB项：三倍体西瓜用二倍体西瓜授粉后，培育出了“无籽”西瓜，说明双方生殖细胞结合后不能完成正常的繁衍，符合“因为遗传信息的不匹配”、“即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍”，符合“合子后隔离”的定义，当选；\nC项：富尔顿蟋蟀和宾州蟋蟀因“鸣声不同”，不会进行交配，符合“由于活动区域、生活习性、体态差异等各种因素”、“导致无法进行基因交流”，符合“合子前隔离”的定义，不符合“合子后隔离”的定义，排除；\nD项：两种蝉因“发情期不同”，没有交配机会，符合“由于活动区域、生活习性、体态差异等各种因素”、“导致无法进行基因交流”，符合“合子前隔离”的定义，不符合“合子后隔离”的定义，排除。\n故正确答案为B。","no":77,"missingImage":false},{"type":"question","qid":"5102235","cat":"定义判断","stem":"薄膜干涉，指的是不同颜色的光波有不同的波长，当一束光波照射于薄膜，由于折射率不同，光波会被薄膜的上界面与下界面分别反射后再相遇，发生相互干涉而形成新的光波。对这一现象的研究可以用于计算薄膜的厚度、折射率等。\n根据上述定义，下列不属于薄膜干涉的是：","options":{"A":"一片普通薄玻璃镶嵌在窗框里，屋外灿烂的阳光穿透玻璃，照在屋内镜子上也能产生强烈反光","B":"汽车玻璃上的贴膜会改变折射光线和反射光线的能量分配比例，增加对某一光波的反射光强度","C":"汽车在有积水的柏油路上驶过时，积水面会形成一层油膜，这层油膜在阳光下呈现出美丽的色彩","D":"自然环境中，两块干净平整的玻璃片紧紧压叠形成极薄空间，出现一些平行条纹，手指用力压紧玻璃时，条纹随之发生改变"},"answer":"A","explanation":"第一步：找出定义关键词。\n“一束光波照射于薄膜”、“薄膜使其形成新的光波”。\n第二步：逐一分析选项。\nA项：阳光穿透玻璃，照在屋内镜子上产生强烈反光，说明镜子对光进行了反射，但镜子上是否有薄膜并不清楚，不符合“一束光波照射于薄膜”，不符合定义，当选；\nB项：光线照射在汽车玻璃上的贴膜上，符合“一束光波照射于薄膜”，改变折射光线和反射光线的能量分配比例，增加对某一光波的反射光强度，说明光波经过贴膜后形成了新的光波，符合“薄膜使其形成新的光波”，符合定义，排除；\nC项：积水面形成的油膜在阳光下呈现出美丽的色彩，符合“一束光波照射于薄膜”，“美丽的色彩”说明肉眼看不到颜色的阳光经过油膜后形成了新的光波，符合“薄膜使其形成新的光波”，符合定义，排除；\nD项：两块干净平整的玻璃片紧紧压叠形成极薄空间时，出现平行条纹，说明周围环境有光，符合“一束光波照射于薄膜”，手指用力压紧玻璃时，条纹随之发生改变，说明出现了新的光波，符合“薄膜使其形成新的光波”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":78,"missingImage":false},{"type":"question","qid":"5102230","cat":"定义判断","stem":"过滤气泡是指以大数据与算法推荐为底层架构，根据用户的使用时间、地区以及浏览习惯生成用户画像，并通过算法技术为其呈现独一无二的界面体验。网络上这种针对个人化搜索而提供筛选后结果的推荐算法，被称为过滤气泡。\n根据上述定义，下列不属于过滤气泡的是：","options":{"A":"赵先生准备买车，上网看了很多汽车测评类的文章，买完车之后，浏览器上的内容几乎全是汽车类的资讯","B":"李先生经常网购图书，平台特意为他推送购书清单，打造个性化书店，让他在第一时间能得到新书的信息","C":"刘先生经常去某网络贴吧发帖，得到了很多人的关注，一些与他有相同爱好的人还建立了一个微信群进行交流","D":"王先生和张先生分别在各自手机上搜索某公司，王先生的搜索结果多为该公司的招聘信息，张先生的却多为该公司的投资信息"},"answer":"C","explanation":"第一步：找出定义关键词。\n“针对个人化搜索，提供筛选后结果”。\n第二步：逐一分析选项。\nA项：赵先生上网看测评类的文章后，浏览器为其推送相关内容，符合“针对个人化搜索，提供筛选后结果”，符合定义，排除；\nB项：李先生经常网购图书，平台针对性推送购书清单，符合“针对个人化搜索，提供筛选后结果”，符合定义，排除；\nC项：刘先生经常去某网络贴吧发帖，建立微信群的过程，没有体现出“针对个人化搜索，提供筛选后结果”，不符合定义，当选；\nD项：两位先生分别在各自手机上搜索某公司后，搜索结果的不同，符合“针对个人化搜索，提供筛选后结果”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":79,"missingImage":false},{"type":"question","qid":"5102202","cat":"定义判断","stem":"马兰戈尼效应，指的是表面张力不同的两种液体存在表面张力梯度，表面张力大的对其周围表面张力小的液体的拉力强，使液体从表面张力小的一边向张力大的方向流动渗透。\n根据上述定义，下列属于马兰戈尼效应的是：","options":{"A":"若干种不同的酒按密度大小依次缓慢倒进杯子，会形成分层，通过加冰块，可以加大或减小密度，分层更明显","B":"涂料配色过程中，涂料和干燥后的涂膜颜色存在细微差异，在湿膜时颜色一般比较浅，在干燥后，颜色会加深","C":"牛奶中加入几滴流体色素，没有搅拌的情况下色素相对集中，取少量洗洁精滴在色素所在位置，色素迅速往牛奶边缘扩散","D":"奶茶就是牛奶和茶叶水的充分混合，不同的奶粉和不同茶叶水搭配，产生不同风味的奶茶，而且奶粉和茶水的配比也影响奶茶口感"},"answer":"C","explanation":"第一步：找出定义关键词。\n“表面张力不同的两种液体”、“液体从表面张力小的一边向张力大的方向流动渗透”。\n第二步：逐一分析选项。\nA项：若干种不同的酒按密度大小依次缓慢倒进杯子形成分层，并没有出现流动渗透，不符合“液体从表面张力小的一边向张力大的方向流动渗透”，不符合定义，排除；\nB项：涂料和干燥后的涂膜颜色存在细微差异，在湿膜时颜色一般比较浅，在干燥后，颜色会加深，说的是涂料干燥前和干燥后的颜色差异，只出现一种液体涂料，不符合“表面张力不同的两种液体”，并且也体现不出液体之间的流动渗透，不符合“液体从表面张力小的一边向张力大的方向流动渗透”，不符合定义，排除；\nC项：牛奶中加入几滴流体色素，没有搅拌的情况下色素相对集中，取少量洗洁精滴在色素所在位置，色素迅速往牛奶边缘扩散，这是因为牛奶密度略高于色素，在牛奶中加入色素后，色素可以短暂漂浮在牛奶表面，洗洁精是一种表面活性剂，加入洗洁精后，色素表面的张力迅速下降，从而小于牛奶张力，便形成扩散效果，加入洗洁精后的牛奶与色素符合“表面张力不同的两种液体”，色素在洗洁精的作用下改变张力，从而向牛奶边缘扩散，符合“液体从表面张力小的一边向张力大的方向流动渗透”，符合定义，当选；\nD项：奶茶是牛奶和茶叶水的混合物，在介绍奶茶的制作原材料，没有体现两种液体互相流动渗透，不符合“液体从表面张力小的一边向张力大的方向流动渗透”，不符合定义，排除。\n故正确答案为C。","no":80,"missingImage":false},{"type":"question","qid":"5102356","cat":"图形推理","stem":"所给的四个选项中，哪一项填入问号处，不能使之呈现一定的规律性：\n\u003cimg data-k=\"d9b45c73b11a\" style=\"max-width:620px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图一、图三和图四均为多端点图形，图二为多圆相交图形，可以考虑笔画数。题干图形均为一笔画，而本题为选非题，故？处应选择不是一笔画的图形。A、B、C三项均为一笔画图形，D项为两笔画图形。只有D项不符合规律。\n本题为选非题，故正确答案为D。","no":81,"missingImage":false},{"type":"question","qid":"5102250","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"ebf7a21ac326\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相同，优先考虑位置规律。观察发现，第一组图形中，第一个图形上下翻转并保留原图形后得到第二个图形，第一个图形保持不变放置在下方，然后对第一个图形分别进行上下翻转后放置在上方、顺时针旋转\u003cimg data-k=\"c16e5a8b3239\">后放置在左侧、逆时针旋转\u003cimg data-k=\"c16e5a8b3239\">后放置在右侧得到第三个图形。第二组图形应用此规律，对应B项。\n故正确答案为B。","no":82,"missingImage":false},{"type":"question","qid":"5102354","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"874a79a91648\" style=\"max-width:558px\">","options":{"A":"①②③，④⑤⑥","B":"①③⑤，②④⑥","C":"①④⑤，②③⑥","D":"①⑤⑥，②③④"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形分割明显，考虑面数量。图①⑤⑥均有6个面，图②③④均有9个面，即图①⑤⑥一组，图②③④一组。\n故正确答案为D。","no":83,"missingImage":false},{"type":"question","qid":"5102227","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"69758870f88a\" style=\"max-width:560px\">","options":{"A":"①②③，④⑤⑥","B":"①③⑤，②④⑥","C":"①④⑤，②③⑥","D":"①⑤⑥，②③④"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，且属性规律无法分为两组，考虑数量规律。题干每幅图形均为25宫格内出现的一个由黑粗线条构成的多边形封闭区域。观察发现，图①④⑤中多边形的面积相同，均占7.5个格子，图②③⑥中多边形的面积相同，均占10.5个格子。即图①④⑤为一组，图②③⑥为一组。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"5102238","cat":"图形推理","stem":"下图右框内纸盒的外表面中，不能折叠成左框内所示的纸盒的是：\n\u003cimg data-k=\"6292220c23c8\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查六面体的空间重构。将题干立体图中的面依次标注为面a、面b、面c，如下图所示。\n\u003cimg data-k=\"d7257783153e\" style=\"max-width:500px\">\nA项：选项与题干立体图一致，排除；\nB项：题干立体图中面a与面b的公共边靠近面a中云朵的底部，而选项中面a与面b的公共边靠近面a中云朵的顶部，选项与题干立体图不一致，当选；\n\u003cimg data-k=\"049365b7296c\" style=\"max-width:350px\">\nC项：选项与题干立体图一致，排除；\nD项：选项与题干立体图一致，排除。\n本题为选非题，故正确答案为B。\n备注：本题作图不严谨，C项中面b与面a的公共边所对应的图形与题干立体图有差别，云朵的细节与立体图形不同，但对比B、C两项，B项错误更加明显，因此小粉笔建议选择B项。","no":85,"missingImage":false},{"type":"question","qid":"5102186","cat":"逻辑判断","stem":"研究发现，对居住地附近有至少30%的土地是公园和绿地的成年人而言，他们感到孤独的几率比居住地附近绿地面积不足10%的成年人要低26%。对于独居者而言，关联性甚至更大——在绿地面积达到或超过30%的地区，他们感到孤独的可能性降低了一半。\n以下哪项如果为真，最能支持上述观点?","options":{"A":"越来越多的证据表明，孤独感与罹患抑郁症的风险增加有关","B":"城市重新造林可能有助于降低主观记忆减退甚至患阿尔茨海默症的风险","C":"以前没有定期接触自然的人以安全、积极和可持续的方式定期与自然接触，就有希望缓解孤独感","D":"绿地面积大小与社交互动频率正相关，经常与他人在绿地环境中交流有助于改善情绪和消除孤独感"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：对于独居者而言，关联性甚至更大——在绿地面积达到或超过30%的地区，他们感到孤独的可能性降低了一半。\n论据：对居住地附近有至少30%的土地是公园和绿地的成年人而言，他们感到孤独的几率比居住地附近绿地面积不足10%的成年人要低26%。\n论据给出一组“居住地附近绿地面积”与“孤独感”关系的数据，论点说的是“居住地附近绿地面积”与“独居者孤独感”的关系，论据和论点的话题一致，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：该项说的是孤独感与罹患抑郁症风险的关系，而论点说的是居住地附近绿地面积与孤独感的关系，话题不一致，无法加强，排除；\nB项：该项说的是城市造林对主观记忆减退及患阿尔茨海默症风险的影响，而论点说的是居住地附近绿地面积与孤独感的关系，话题不一致，无法加强，排除；\nC项：该项说的是定期接触自然有望缓解孤独感，但并不明确“接触自然”与“居住地附近绿地面积”的关系，为不明确项，无法加强，排除；\nD项：该项说的是绿地面积大小影响社交互动频率，且经常与他人在绿地环境中交流有助于改善情绪和消除孤独感，解释了为什么在绿地面积达到或超过30%的地区，独居者感到孤独的可能性会降低，补充论据，可以加强，当选。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"5102232","cat":"逻辑判断","stem":"研究人员对人的“头骨突起”进行了一项研究。在这项研究中，调查对象包括1200名年龄在18岁至86岁的普通人群，研究发现，颅骨底部出现骨质突起的情况在年轻人中比在老年人中更为普遍，尤其是在18岁至30岁年龄组的男性当中，研究者认为，一些人颅骨底部出现的奇怪的“头骨突起”与他们长时间弯下脖子看智能手机时的奇怪角度有关。\n以下各项如果为真，最能质疑上述结论的是：","options":{"A":"网上销售的塑形枕头深受“头骨突起”的年轻消费者欢迎","B":"该研究样本人群是随机抽取，它的结论适用于普通人群","C":"研究人员对年轻人更容易出现头骨突起的分析过程存在瑕疵","D":"研究者并未对调查对象每日弯下脖子看智能手机的时间进行记录"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：一些人颅骨底部出现的奇怪的“头骨突起”与他们长时间弯下脖子看智能手机时的奇怪角度有关。\n论据：研究发现颅骨底部出现骨质突起的情况在年轻人中比在老年人中更为普遍，尤其是在18岁至30岁年龄组的男性当中。\n本题论据在分析“年龄”与“头骨突起”的关系，论点在分析“长时间弯下脖子看智能手机时的奇怪角度”和“头骨突起”的关系，论据和论点话题不一致，优先考虑拆桥，即不能通过“年龄”推出“不良姿势看手机的时长”。\n第二步：逐一分析选项。\nA项：指出塑形枕头受到“头骨突起”的年轻消费者欢迎，是在强调部分头骨突起人群的购物偏好，但论点是在分析“头骨突起”产生的具体原因，话题不一致，无法削弱，排除；\nB项：指出研究样本选取很科学，结论具有普适性，进一步说明了结论成立的科学性，为加强项，无法削弱，排除；\nC项：指出研究中对年轻人更容易出现头骨突起的分析过程存在瑕疵，即论据中的研究过程是存在瑕疵的，可以削弱，保留；\nD项：指出该研究未统计过不同年龄段的受访者用不良姿势看智能手机的时长，那就不能通过“年龄”推出“不良姿势看手机的时长”，可以削弱，保留；\n比较C、D两项，C项只说分析过程存在瑕疵，但具体是什么瑕疵，是否会影响实验结论，表述并不明确，故D项更为明确。\n故正确答案为D。","no":87,"missingImage":false},{"type":"question","qid":"5102359","cat":"逻辑判断","stem":"有些人的心情比较容易受到外界影响，比如飞行员担心遇到雷暴，虽然没有什么奇招，但有些食物的确能让大脑更好地运作，可可就是其中之一。这是因为可可含有大量的茶碱和咖啡因，它们可以有效的减轻压力和缓解疼痛。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"虽然可可富含咖啡因，但咖啡因只有在特定条件下才能发挥其减压作用","B":"据研究显示，可可中含有的茶碱和咖啡因可以刺激大脑分泌内啡肽，而内啡肽对减轻压力和缓解疼痛非常有效","C":"每天摄入主要原料为可可的黑巧克力对情绪会有一定影响","D":"每天至少30分钟的运动，有助于大脑产生缓解压力和焦虑所需的激素"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：有些食物的确能让大脑更好地运作，可可就是其中之一。\n论据：可可含有大量的茶碱和咖啡因，它们可以有效的减轻压力和缓解疼痛。\n本题论点说的是“可可”让“大脑更好地运作”，论据说的是“可可”中的“茶碱和咖啡因”可以“减轻压力和缓解疼痛”，“减轻压力和缓解疼痛”有助于“大脑更好地运作”，二者关系紧密，可以认为话题一致，加强可以考虑补充论据，即解释原因或举例。\n第二步：逐一分析选项。\nA项：指出可可中的咖啡因需要在“特定条件”下才能发挥减压作用，但无法确定食用可可时是否满足特定条件，也就无法判断减压作用是否能实现，属于不明确项，无法加强，排除；\nB项：指出可可中含有的茶碱和咖啡因是通过刺激大脑分泌内啡肽来起到减轻压力和缓解疼痛作用的，进而能让大脑更好地运作，解释原因，补充论据，当选；\nC项：指出用可可制作的黑巧克力对情绪有影响，但无法判断是好影响还是坏影响，能否让大脑更好的运作，属于不明确项，无法加强，排除；\nD项：指出“运动”对于大脑的作用，而论点说的是“可可”对于大脑的作用，话题不一致，属于无关项，无法加强，排除。\n故正确答案为B。","no":88,"missingImage":false},{"type":"question","qid":"5102224","cat":"类比推理","stem":"近日，有科学家撰文指出，即使保持现有的城市和农田面积，地球上至少还有种植1万亿棵或1.5万亿棵树的空间，面积可达900万平方公里，大致相当于美国的国土面积。而这些新树未来几十年里可以从大气中吸收近7500亿吨导致温室效应的二氧化碳，这几乎等同于人类在过去25年排放的碳污染的总和。因此，该科学家认为，对抗全球变暖最根本的方法是，种植1万亿棵或1.5万亿棵树。\n以下各项如果为真，最能质疑这位科学家观点的是：","options":{"A":"还有其他可行方法可以应对气候变化，例如让人们从吃肉转向吃素","B":"对燃烧石油、煤炭和天然气的依赖，才是导致全球变暖的根本原因","C":"随着全球变暖尤其是热带地区变干燥，当前树木植被已在大片消失","D":"只有年轻的树木才能从空气中清除更多碳污染，热带地区最具潜力"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：对抗全球变暖最根本的方法是，种植1万亿棵或1.5万亿棵树。\n论据：1万亿棵或1.5万亿棵新树未来几十年里可以从大气中吸收近7500亿吨导致温室效应的二氧化碳，这几乎等同于人类在过去25年排放的碳污染的总和。\n论点讨论的是“对抗全球变暖最根本的方法是种1万亿棵或1.5万亿棵树”，论据讨论的是“通过种1万亿棵或1.5万亿棵树吸收导致温室效应的二氧化碳”，论点论据都在讨论种树可以对抗全球变暖，论点论据话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项说的是还有其他可行方法可以应对气候变化，题干论点讨论的是应对全球变暖最根本的方法是种树，话题不一致，无法削弱，排除;\nB项：该项说的是导致全球变暖的根本原因是对燃烧石油、煤炭和天然气的依赖，说明要想对抗全球变暖根本方法应该是减少对燃烧石油、煤炭和天然气的依赖，可以说明种树不能从根本上解决全球变暖，削弱论点，当选；\nC项：该项说的是全球变暖尤其是热带地区变干燥导致当前树木植被已在大片消失，题干论点讨论的是应对全球变暖最根本的方法是种树，话题不一致，无法削弱，排除；\nD项：该项说的是什么样的树木才能从空气中清除更多碳污染，题干论点讨论的是应对全球变暖最根本的方法是种树，无法削弱，排除。\n故正确答案为B。","no":89,"missingImage":false},{"type":"question","qid":"5102226","cat":"逻辑判断","stem":"有观点认为，体质的酸化是百病之源。无论是癌症，还是常见的高血压、糖尿病、痛风等，都是由于“酸性食物”吃多了导致体质酸化引起的。而鱼、肉、米饭、酒等人类的主副食品都是酸性的，尤其是我们的主食米饭，更被渲染成“酸性食物”的典型代表。\n以下各项如果为真，最能反驳上述观点的是：","options":{"A":"人体的皮肤处于弱酸性状态时，比较不容易滋生细菌","B":"人体的酸碱度以7.4为佳，即身体偏碱性就是健康的","C":"人体有三个调节系统平衡酸碱，人的体质不会是酸性","D":"健康人的尿液是呈酸性的，人体本身就存在酸性物质"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：体质的酸化是百病之源。\n论据：无论是癌症，还是常见的高血压、糖尿病、痛风等，都是由于“酸性食物”吃多了导致体质酸化引起的。\n本题的论点和论据均在讨论“体质酸化”与“疾病”之间的关系，话题一致，削弱优先考虑削弱论点，即体质的酸化不是百病之源。\n第二步：逐一分析选项。\nA项：该项讨论的是“人体皮肤处于弱酸性状态”与“不容易滋生细菌”的关系，“人体皮肤处于弱酸性状态”不能代表论点中“体质的酸化”，且“不容易滋生细菌”不代表不容易生病，话题不一致，无法削弱，排除；\nB项：该项指出身体偏碱性就是健康的，未明确说明酸性体质是否健康，不明确项，排除；\nC项：该项指出人的体质不会是酸性的，说明酸性体质不存在，则酸性体质也不可能是百病之源，削弱论点，当选；\nD项：该项指出健康人体存在酸性物质，但是存在酸性物质不代表健康人是“酸性体质”，话题不一致，无法削弱，排除。\n故正确答案为C。","no":90,"missingImage":false},{"type":"question","qid":"5102200","cat":"逻辑判断","stem":"伤害感受神经能够对造血干细胞动员进行调控，增强造血干细胞的黏附或迁移，降钙素基因相关肽（CGRP）是伤害感受神经元主要分泌的神经递质分子。研究者发现，给予CGRP可以显著增强造血干细胞动员。CGRP可以直接影响造血干细胞，诱导细胞表面形成CALCRL和RAMP1蛋白形成的二聚体受体，并促进造血干细胞进入血管。研究专家认为，吃辣可以促进造血干细胞动员。\n如果上述结论为真，需要补充的前提是：","options":{"A":"骨髓神经纤维中高达77%都是伤害感受神经元","B":"辛辣食物导致的“辣味”是一种痛觉，会激活伤害感受神经","C":"辣的食物能够促进消化液的分泌，增加消化酶的活性，加速胃肠道蠕动","D":"造血干细胞会在神经的调控之下，从骨髓释放进入循环，对损失的血细胞进行补充"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：吃辣可以促进造血干细胞动员。\n论据：伤害感受神经能够对造血干细胞动员进行调控，增强造血干细胞的黏附或迁移，降钙素基因相关肽（CGRP）是伤害感受神经元主要分泌的神经递质分子。研究者发现，给予CGRP可以显著增强造血干细胞动员。CGRP可以直接影响造血干细胞，诱导细胞表面形成CALCRL和RAMP1蛋白形成的二聚体受体，并促进造血干细胞进入血管。\n本题论点说的是“吃辣”与“造血干细胞动员”之间的关系，论据说的是“伤害感受神经”与“造血干细胞动员”之间的关系，话题不一致，且提问方式为“前提”，加强优先考虑搭桥，即建立“吃辣”与“伤害感受神经”之间的联系。\n第二步：逐一分析选项。\nA项：指出骨髓神经纤维中的伤害感受神经元占比高，不能说明“吃辣”与“造血干细胞动员”之间的关系，话题不一致，无法加强，排除；\nB项：指出“辣味”会激活神经纤维中的伤害感受神经，这说明吃辣可以影响伤害感受神经，进而影响造血干细胞动员，在“吃辣”与“伤害感受神经”之间建立了联系，搭桥项，可以加强，当选；\nC项：指出辣的食物能够促进消化液的分泌、加速胃肠道蠕动，与造血干细胞无关，属于无关项，无法加强，排除；\nD项：指出造血干细胞能够对损失的血细胞进行补充，未提及吃辣对其的影响，属于无关项，无法加强，排除。\n故正确答案为B。","no":91,"missingImage":false},{"type":"question","qid":"5102163","cat":"逻辑判断","stem":"欧洲杯比赛期间，小赵、小钱、小孙、小李预测甲、乙两支队伍能否进入决赛。他们的对话如下：\n小赵：如果甲进入决赛，则乙也能进入决赛。\n小钱：我看甲进入决赛没有问题。\n小孙：在我看来，甲能够进入决赛，但乙进不了。\n小李：我的看法是，如果甲不能进入决赛，则乙进决赛。\n结果出来后，他们四人的预测有两个真、两个假，关于甲和乙是否进入决赛，以下推论正确的是：","options":{"A":"甲和乙都进入决赛","B":"甲和乙都没有进入决赛","C":"甲进入决赛，乙没有进入决赛","D":"甲没有进入决赛，乙进入决赛"},"answer":"D","explanation":"第一步：分析题干找关系。\n①小赵：甲\u003cimg data-k=\"508f0e7dbbe5\">乙；\n②小钱：甲；\n③小孙：甲 且 \u003cimg data-k=\"e752a8ae1a16\">乙；\n④小李：\u003cimg data-k=\"e752a8ae1a16\">甲\u003cimg data-k=\"508f0e7dbbe5\">乙。\n分析题干条件，①、③为矛盾关系，必有一真一假。\n第二步：看其余。\n根据题干推理可知，四人预测为两真两假，故②、④也必有一真一假。由“A\u003cimg data-k=\"508f0e7dbbe5\">B”=“\u003cimg data-k=\"e752a8ae1a16\">A 或 B”可知，④“\u003cimg data-k=\"e752a8ae1a16\">甲\u003cimg data-k=\"508f0e7dbbe5\">乙”=“甲 或 乙”，此时，若②“甲”为真，则④“甲 或 乙”为真，与②、④必有一真一假矛盾，故②“甲”为假，即甲没有进入决赛，此时④“甲 或 乙”为真，根据或关系的否一推一，可知乙进入决赛。\n故正确答案为D。","no":92,"missingImage":false},{"type":"question","qid":"5102164","cat":"逻辑判断","stem":"研究者发现，蚕挑选桑叶要经过类似于计算机安全系统的验证。蚕口器下方的下颚须在触碰叶片时会先轻轻咬一口，下颚须中的味觉神经能以极高的灵敏度识别叶片表面的\u003cimg data-k=\"af343db3844d\">-谷甾醇、绿原酸、异槲皮苷这三种物质；接着，它会用口器上的须形外颚叶来尝一下叶片叶汁中的糖分，须形外颚叶上的味觉神经比较迟钝，只有高浓度的糖才能激活；在确认是桑叶后它才开始大肆咀嚼。\n由此可以推出：","options":{"A":"桑叶会分泌适合蚕生长的糖分和物质，故而它几乎只吃桑叶","B":"通过不同的器官感受不同的味道，这就是蚕判断桑叶的秘诀","C":"蚕在演化过程中，它的口器具备了通过触碰感知桑叶的能力","D":"这项研究有助于改进蚕的人工饲料，可在没有桑树的环境下养蚕"},"answer":"B","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干指出蚕是通过高浓度糖分激活须形外颚叶上的味觉神经来确认桑叶，没有提及蚕只吃桑叶的原因，无中生有，无法推出，排除；\nB项：题干指出蚕口器下方的下颚须中的味觉神经能识别\u003cimg data-k=\"af343db3844d\">-谷甾醇、绿原酸、异槲皮苷，接着，蚕会用口器上的须形外颚叶来尝一下叶片叶汁中的糖分，可以推出蚕通过不同的器官感受不同的味道来判断是否是桑叶，可以推出，当选；\nC项：题干指出蚕依靠下颚须中的“味觉神经”识别叶片表面的一些物质，用口器上的须形外颚叶来“尝”糖分，因此蚕是依靠“味觉”来感知桑叶，而非依靠“碰触”，无法推出，排除；\nD项：题干中没有提及蚕的饲养，也没有提及改进蚕的人工饲料，无中生有，无法推出，排除。\n故正确答案为B。","no":93,"missingImage":false},{"type":"question","qid":"5102177","cat":"逻辑判断","stem":"要控制冰川的退缩，一劳永逸的方法只有节能减排、减少温室气体排放、遏制地球气温升高。只有这样，冰川的加速退缩才能从根本上得到控制。如果不减少温室气体的排放，欧洲阿尔卑斯山将有94％的冰川会在100年内消失掉，也许人们只能在冷库中看到一点剩余的冰川冰。\n由此可以推出：","options":{"A":"如果节能减排、减少温室气体排放、遏制地球气温升高，就能够控制冰川的退缩","B":"如果欧洲阿尔卑斯山有94％的冰川在100年内消失掉，那就说明温室气体排放没有减少","C":"除非减少温室气体排放，否则欧洲阿尔卑斯山将有94％的冰川在100年内消失掉","D":"只要节能减排、减少温室气体排放、遏制地球气温升高，就能控制冰川退缩"},"answer":"C","explanation":"第一步：翻译题干。\n①冰川的退缩得到控制\u003cimg data-k=\"2dfb7d1f72f3\">节能减排、减少温室气体排放、遏制地球气温升高\n②\u003cimg data-k=\"e752a8ae1a16\">减少温室气体排放\u003cimg data-k=\"2dfb7d1f72f3\">欧洲阿尔卑斯山将有94％的冰川会在100年内消失掉\n第二步：逐一分析选项。\nA项：翻译为“\u003cspan style=\"color:#rgb(89,89,89)\">节能减排、减少温室气体排放、遏制地球气温升高\u003c/span>\u003cimg data-k=\"2dfb7d1f72f3\">\u003cspan style=\"color:#rgb(89,89,89)\">冰川的退缩得到控制\u003c/span>”，是对①的肯后，但肯后得不到确定性的结论，无法推出，排除；\nB项：翻译为“\u003cspan style=\"color:#rgb(89,89,89)\">欧洲阿尔卑斯山将有94％的冰川在100年内消失掉\u003c/span>\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">\u003cspan style=\"color:#rgb(89,89,89)\">减少温室气体排放\u003c/span>”，是对②的肯后，但肯后得不到确定性的结论，无法推出，排除；\nC项：翻译为“\u003cimg data-k=\"e752a8ae1a16\">\u003cspan style=\"color:#rgb(89,89,89)\">欧洲阿尔卑斯山将有94％的冰川在100年内消失掉\u003c/span>\u003cimg data-k=\"2dfb7d1f72f3\">\u003cspan style=\"color:#rgb(89,89,89)\">减少温室气体排放\u003c/span>”，是对②的否后，否后必否前，可以推出，当选；\nD项：翻译为“\u003cspan style=\"color:#rgb(89,89,89)\">节能减排、减少温室气体排放、遏制地球气温升高\u003c/span>\u003cimg data-k=\"2dfb7d1f72f3\">\u003cspan style=\"color:#rgb(89,89,89)\">冰川的退缩得到控制\u003c/span>”，是对①的肯后，但肯后得不到确定性的结论，无法推出，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"5102179","cat":"逻辑判断","stem":"科学家在金星大气层中探测到了磷化氢的踪迹，浓度极高，是地球大气层中磷化氢浓度的1000倍至100万倍。在地球上，磷化氢仅见于工业生产领域或由厌氧微生物所产生。对于金星上磷化氢的来源，研究团队进行了大量分析，推断是否来自光照、闪电、火山或者从金星表面向上吹至大气层中的矿物质等，但根据已有知识的计算结果均不支持这些来源。研究人员因此表示有磷化氢意味着没有充足的氧气存在，但有可能证明是存在厌氧生物的，故而金星大气层中的磷化氢有可能是某种生物留下的印记。\n以下哪项如果为真，最能削弱上述研究人员的观点？","options":{"A":"金星大气中含有大量二氧化碳以及浓硫酸云层，温室效应非常严重","B":"科学家们发现了“不需要呼吸”的动物，比较符合金星的大气条件","C":"金星上存在某些未知的光化学过程，这些光化学过程能够释放大量的磷化氢","D":"磷化氢需要很多能量来制作，且任何行星上都不太可能存在太多磷，因此一颗行星产生大量磷化氢的可能性很低"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：金星大气层中的磷化氢有可能是某种生物留下的印记。\n论据：有磷化氢意味着没有充足的氧气存在，但有可能证明是存在厌氧生物的。\n本题论点说的是“金星大气层中的磷化氢”与“某种生物”之间的关系，论据说的是“磷化氢”与可能存在“厌氧生物”之间的关系，论点论据话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项说金星大气中含有大量二氧化碳以及浓硫酸云层，温室效应非常严重，而论点讨论的是金星大气层中的磷化氢是否来自于某种生物，话题不一致，无法削弱，排除；\nB项：该项说的是存在比较符合金星上大气条件的“不需要呼吸”的动物，说明在金星上可能在没有充足氧气的情况下存在生物，即厌氧生物，补充论据说明这些生物可能是磷化氢的来源，为加强项，无法削弱，排除；\nC项：该项说的是金星上存在某些未知的光化学过程，这些光化学过程能够释放大量的磷化氢，说明金星大气层中的磷化氢是来自于光化学过程，而不是来自于厌氧生物，削弱论点，可以削弱，当选；\nD项：该项说的是任何行星上都不太可能存在太多磷，因此一颗行星产生大量磷化氢的可能性很低，而题干论点讨论的是金星大气层中的磷化氢的来源问题，话题不一致，无法削弱，排除。\n故正确答案为C。","no":95,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2020年，由软件产品、信息技术服务、信息安全产品和服务、嵌入式系统软件四大业务形态构成的我国软件和信息技术服务业持续恢复，收入保持较快增长，信息技术服务加快云化发展，软件应用服务化、平台化趋势明显。\u003c/p>\u003cp>        2020年，软件产品实现收入22758亿元，同比增长10.1%，占全行业比重为27.9%。其中，工业软件产品实现收入1974亿元，增长11.2%，为支撑工业领域的自主可控发展发挥重要作用。\u003c/p>\u003cp>        2020年，信息技术服务实现收入49868亿元，同比增长15.2%，增速高出全行业平均水平1.9个百分点，占全行业收入比重为61.1%。其中，电子商务平台技术服务收入9095亿元，同比增长10.5%；云服务、大数据服务共实现收入4116亿元，同比增长11.1%。\u003c/p>\u003cp>        2020年，信息安全产品和服务实现收入1498亿元，同比增长10.0%，增速较上年回落2.4个百分点。\u003c/p>\u003cp>        2020年嵌入式系统软件实现收入7492亿元，同比增长12.0%，增速较上年提高4.2个百分点，占全行业收入比重为9.2%。嵌入式系统软件已成为产品和装备数字化改造、各领域智能化增值的关键性带动技术。\u003c/p>","questions":[{"qid":"5102378","cat":"比重","stem":"2020年电子商务平台技术服务收入占全行业收入的比重约为：","options":{"A":"7.6%","B":"11.1%","C":"15.3%","D":"18.2%"},"answer":"B","explanation":"根据题干“2020年······占······的比重约为”，结合材料时间是2020年，可判定本题为现期比重问题。定位文字材料第二段、第三段可知：2020年，软件产品实现收入22758亿元，同比增长10.1%，占全行业比重为27.9%；电子商务平台技术服务收入9095亿元。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，则2020年全行业收入\u003cimg data-k=\"ef934d1e7338\">\u003cimg data-k=\"57053c5ac877\">\u003cimg data-k=\"acfe88a7f292\">亿元，故题干所求\u003cimg data-k=\"1a3a83423fbe\">\u003cimg data-k=\"20f0875f5239\">，与B项最接近。\n故正确答案为B。","no":96,"missingImage":false},{"qid":"5102379","cat":"增长","stem":"2020年四大业务形态收入同比增速高于全行业平均水平的有：","options":{"A":"1个","B":"2个","C":"3个","D":"4个"},"answer":"A","explanation":"定位文字材料第二段可知：2020年软件产品收入同比增长10.1%；定位文字材料第三段可知：2020年信息技术服务收入同比增长15.2%，增速高出全行业平均水平1.9个百分点，可得2020年全行业平均水平同比增速为15.2%-1.9%=13.3%；定位文字材料第四段可知：2020年信息安全产品和服务收入同比增长10.0%；定位文字材料第五段可知：2020年嵌入式系统软件收入7492亿元，同比增长12.0%。四大业务形态收入同比增速高于全行业平均水平的为信息技术服务(15.2%)，有1个。\n故正确答案为A。","no":97,"missingImage":false},{"qid":"5102380","cat":"综合","stem":"2019年全行业实现收入约为：","options":{"A":"7.2万亿元","B":"7.4万亿元","C":"8.2万亿元","D":"8.4万亿元"},"answer":"A","explanation":"根据题干“2019年······约为”，结合材料时间为2020年，可判定本题为基期计算问题。定位文字材料第三段可得：2020年，信息技术服务实现收入49868亿元，同比增长15.2%，增速高出全行业平均水平1.9个百分点，占全行业收入比重为61.1%。根据公式：整体量\u003cimg data-k=\"95f7e3ba5183\">，则2020年全行业实现收入\u003cimg data-k=\"a5fb40ad0a8f\">亿元，同比增速=15.2%-1.9%=13.3%。根据公式：基期量\u003cimg data-k=\"eb4ccfb62ef4\">，则2019年全行业实现收入\u003cimg data-k=\"5563f76bad6d\">\u003cimg data-k=\"05cc2ea19609\">\u003cimg data-k=\"8daca9f6dc37\">亿元\u003cimg data-k=\"1d57a23533fe\">万亿元。\n故正确答案为A。","no":98,"missingImage":false},{"qid":"5102381","cat":"增长","stem":"2019年嵌入式系统软件同比增速相较于信息安全产品和服务同比增速：","options":{"A":"快2.0%","B":"快8.6%","C":"慢4.6%","D":"慢7.5%"},"answer":"C","explanation":"根据题干“2019年······同比增速相较于······同比增速”，可判定本题为一般增长率问题。定位材料第五段，2020年嵌入式系统软件实现收入7492亿元，同比增长12.0%，增速较上年提高4.2个百分点，则2019年嵌入式系统软件同比增速为12.0%-4.2%=7.8%；定位材料第四段，2020年信息安全产品和服务实现收入1498亿元，同比增长10.0%，增速较上年回落2.4个百分点，则2019年信息安全产品和服务同比增速为10.0%+2.4%=12.4%，二者相差：7.8%-12.4%=-4.6%，即慢4.6%。\n故正确答案为C。","no":99,"missingImage":false},{"qid":"5102383","cat":"综合","stem":"下列选项不能从上述资料推出的是：","options":{"A":"2019年信息安全产品和服务实现收入约为1361.8亿元","B":"2019年信息安全产品和服务占全行业收入比重最低","C":"2020年信息安全产品和服务占全行业收入比重为2.8%","D":"2019年信息技术服务收入占全行业收入比重低于61.1%"},"answer":"C","explanation":"A项：定位文字材料第四段可得：2020年，信息安全产品和服务实现收入1498亿元，同比增长10.0%。根据公式：基期量\u003cimg data-k=\"eb4ccfb62ef4\">，则2019年信息安全产品和服务实现收入为\u003cimg data-k=\"787ef0e9ac73\">亿元，正确；\nB项：定位文字材料可知2020年软件产品、信息技术服务、信息安全产品和服务、嵌入式系统软件的实现收入及同比增长率。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，整体量一致，比较比重的大小，只需比较部分量的大小即可。根据公式：基期量\u003cimg data-k=\"eb4ccfb62ef4\">，则2019年软
