<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2020-江苏-B类","title":"2020年江苏省公务员录用考试《行测》题（B类）（网友回忆版）","year":"2020","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2452626","cat":"时事政治","stem":"党的十九届四中全会通过了《坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化若干重大问题的决定》。关于该《决定》的内容，下列说法正确的是\n①阐述了我国国家制度和国家治理体系发展的历史性成就和显著优势\n②提出了推进国家治理体系和治理能力现代化的重大意义和总体要求\n③回答了什么是社会主义和怎样建设社会主义这个重大政治问题\n④明确了各项制度必须坚持和巩固的根本点、完善和发展的方向","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查政治常识。\n①②④正确，习近平总书记在《关于&lt;中共中央关于坚持和完善中国特色社会主义制度,推进国家治理体系和治理能力现代化若干重大问题的决定&gt;的说明》一文中指出：“决定稿由15部分构成，分为三大板块。第一板块为第一部分，是总论，主要阐述中国特色社会主义制度和国家治理体系发展的历史性成就、显著优势，提出新时代坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化的重大意义和总体要求。第二板块为分论，聚焦坚持和完善支撑中国特色社会主义制度的根本制度、基本制度、重要制度，安排了13个部分，明确了各项制度必须坚持和巩固的根本点、完善和发展的方向，并作出工作部署。第三板块为第十五部分和结束语，主要就加强党对坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化的领导提出要求。”\n③错误，邓小平理论回答了什么是社会主义和怎样建设社会主义这个重大政治问题。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"2452666","cat":"新思想","stem":"习近平总书记指出，涉及群众的问题，要准确把握社会心态和群众情绪，充分考虑执法对象的切身感受，推行人性化执法、阳光执法。但是，不论怎么做，对违法行为一定要严格尺度、依法处理。对此，下列理解正确的是","options":{"A":"社会心态和群众情绪是执法的基本出发点","B":"执法对象的切身感受是影响执法的决定性因素","C":"人性化执法、阳光执法是实现执法目的的根本保障","D":"严格尺度、依法处理是执法的根本要求"},"answer":"D","explanation":"本题考查政治常识。\nA项错误，社会心态和群众情绪是在执法过程中涉及到群众问题时，需要准确把握的因素，但其并非是执法的基本出发点。在社会主义国家，执法的权力来自于人民，执法必须立足于为人民服务，以人民利益为根本的出发点。\nB项错误，充分考虑执法对象的亲身感受，是为了推行人性化执法和柔性执法，防止恶性事件发生，其并非是影响执法的决定性因素。\nC项错误，人性化执法、阳光执法是实现执法目的的重要条件，但并非根本保障。\nD项正确，题干中强调“不论怎么做”，对违法行为一定要严格尺度、依法处理，可见，习近平总书记强调的是“严格尺度、依法处理”，这是执法的根本要求。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"2452667","cat":"新思想","stem":"前不久，中央政治局召开会议分析研究当前经济形势，重申了宏观政策要稳、微观政策要活、社会政策要托底的总体思路。下列体现“微观政策要活”这一政策思路的是","options":{"A":"避免过度投放货币，以防经济出现大幅度的波动","B":"阶段性提高财政赤字，弥补降税带来的财政减收","C":"鼓励创业和创新，有针对性地加大对企业的扶持","D":"对弱势群体提供普遍的社会保障，解决市场失灵"},"answer":"C","explanation":"本题考查经济常识。\nA项错误，“避免过度投放货币”，即控制货币发行量，是货币政策的内容之一，体现的是“宏观政策要稳”，也就是实施稳健的货币政策。\nB项错误，“提高财政赤字”是财政政策的内容之一，体现的是“宏观政策要稳”，也就是实施积极的财政政策。\nC项正确，企业等微观市场主体是社会财富的创造者，是经济发展的基石。通过鼓励创业和创新，针对性地加大对企业的扶持，可以全面搞活微观经济，助推企业顺利度过结构调整阵痛期，体现的正是“微观经济要活”这一政策思路。\nD项错误，“对弱势群体提供普遍的社会保障”是为困难群众提供基本生活保障，通过社会保障政策“托底”，让全体人民共享改革发展成果，维护社会和谐稳定，体现的是“社会政策要托底”。\n故正确答案为C。","no":3,"missingImage":false}],"count":3,"answerable":3,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2452631","cat":"人文常识","stem":"2019年10月31日，国务院决定开展第七次全国人口普查。关于第七次全国人口普查，下列说法不正确的是","options":{"A":"标准时点是2020年11月1日零时","B":"普查对象不含在境内定居的外国人","C":"将首次采集普查对象的身份证号码","D":"采取电子化方式开展人口普查登记"},"answer":"B","explanation":"本题考查政治常识。\nA项正确，2020年第七次全国人口标准时点是2020年11月1日零时普查。\nB项错误，普查对象是普查标准时点在中华人民共和国境内的自然人以及在中华人民共和国境外但未定居的中国公民，不包括在中华人民共和国境内短期停留的境外人员。\nC项正确，为了提高普查数据质量，在全国第七次人口普查中将首次采集普查对象的身份证号码。\nD项正确，国务院决定于2020年开展第七次全国人口普查。本次全国人口普查采取电子化方式开展普查登记，探索使用智能手机采集数据。\n本题为选非题，故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"2452668","cat":"法律常识","stem":"2019年7月，中共中央办公厅、国务院办公厅印发了《关于加快推进公共法律服务体系建设的意见》，明确提出了公共法律服务体系建设的总体要求、基本原则和主要目标。下列关于公共法律服务体系的说法，不正确的是","options":{"A":"公共法律服务是全面依法治国的基础性、服务性和保障性工作","B":"公共法律服务体系建设需要由政府主导、其他社会主体积极参与","C":"公共法律服务的重点对象是低收入群体等特殊群体","D":"公共法律服务体系提供的是免费的公益性法律服务"},"answer":"D","explanation":"本题考查政治。\nA项正确，《关于加快推进公共法律服务体系建设的意见》指出：“公共法律服务是政府公共职能的重要组成部分，是保障和改善民生的重要举措，是全面依法治国的基础性、服务性和保障性工作。”\nB项正确，《关于加快推进公共法律服务体系建设的意见》指出：“坚持政府主导、社会参与，落实政府推进公共法律服务体系建设的主体责任，激发各类社会主体参与公共法律服务的积极性。”\nC项正确，《关于加快推进公共法律服务体系建设的意见》指出：“保障特殊群体的基本公共法律服务权益。将低收入群体、残疾人、农民工、老年人、青少年、单亲困难母亲等特殊群体和军人军属、退役军人及其他优抚对象作为公共法律服务的重点对象。”\nD项错误，《关于加快推进公共法律服务体系建设的意见》指出：“保障特殊群体的基本公共法律服务权益······引导律师、公证员、司法鉴定人、基层法律服务工作者自觉履行社会责任，积极参与公益性法律服务。”可见公益性法律服务是针对特殊群体提供的服务，而公共法律服务体系的总体目标，则是“建设覆盖城乡、便捷高效、均等普惠的现代公共法律服务体系”，并非是提供免费的法律服务。\n本题为选非题，故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"2452669","cat":"人文常识","stem":"当今世界不稳定不确定因素明显增加，我们要坚持底线思维，居安思危、未雨绸缪，做好应付最坏局面的思想准备。下列表述体现了坚持底线思维的是","options":{"A":"政治建设方面绝不能犯颠覆性错误","B":"经济建设方面努力实现高质量发展","C":"文化建设方面要繁荣社会主义文艺","D":"外交战略方面构建人类命运共同体"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，政治安全攸关党和国家的安危，是维护国家安全的根本。如果在事关全局的政治问题上随波逐流，丧失原则和立场，就会严重危害党和人民事业的发展。因此政治建设决不能犯颠覆性错误，这是一种底线。\nBCD项错误，底线思维具有目的性、价值性，以实现和维护一定利益和价值为旨归。坚持和发展中国特色社会主义，全面建成社会主义现代化强国，实现中华民族伟大复兴的中国梦，是我们坚持底线思维的总体价值目标。这一总体价值目标，是通过经济、政治、文化、社会、生态文明各个方面建设来体现和实现的。BCD项不属于坚持底线思维，是为了实现总体价值目标在经济、文化、外交战略建设方面的表现。\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"2452636","cat":"人文常识","stem":"1949年3月，中共中央和毛泽东离开西柏坡前往北平进驻香山。在香山的半年时间里，发生的一系列重大历史事件在党和国家历史上具有非常重要的地位。下列发生在这一时期的重大历史事件是\n①毛泽东、朱德发布向全国进军的命令，吹响了解放全中国的伟大号角\n②召开了党的七届二中全会，规定了党在全国胜利后应当采取的基本政策\n③毛泽东发表了《论人民民主专政》，为新中国建立奠定了理论和政策基础\n④制定了《中国人民政治协商会议共同纲领》，描绘了建立建设新中国的蓝图","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"C","explanation":"本题考查毛中特。\n①、③、④正确，2019年9月12日，中共中央总书记、国家主席、中央军委主席习近平专程前往北京香山革命纪念地，瞻仰双清别墅、来青轩等革命旧址，参观香山革命纪念馆。他表示，1949年3月23日，中共中央和毛泽东同志离开西柏坡前往北平，25日进驻北京香山，这里成为党中央所在地。在这里，毛泽东、朱德同志发布向全国进军的命令，吹响了“打过长江去，解放全中国”的伟大号角，中国人民解放军以摧枯拉朽之势向全国各地胜利大进军，彻底结束了国民党在大陆的统治。在这里，毛泽东同志发表了《论人民民主专政》，为新中国的建立奠定理论基础和政策基础。在这里，中共中央同各民主党派、各界人士共同筹备中国人民政治协商会议，制定通过了起到临时宪法作用的《中国人民政治协商会议共同纲领》，确定了新中国的国体和政体，制定了一系列基本政策，描绘了建立建设新中国的宏伟蓝图。\n②错误，党的七届二中全会于1949年3月5日—13日在河北西柏坡召开。这次会议规定了党在全国胜利以后在政治、经济、外交方面应当采取的基本政策，为夺取全国革命的胜利，推动新民主主义革命向社会主义革命转变，奠定了政治上和思想上的基础。此次会议在西柏坡召开，因此不属于离开西柏坡前往北平进驻香山后发生的重大历史事件。\n故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"2452637","cat":"人文常识","stem":"人们常常引用希腊典故来分析当今世界的现实问题。下列希腊典故与其寓意对应正确的是","options":{"A":"潘多拉的盒子——世事变幻无常","B":"阿喀琉斯之踵——强大事物的软肋","C":"修昔底德陷阱——安静祥和背后暗藏的风险","D":"达摩克利斯之剑——守成大国与崛起大国必有一战"},"answer":"B","explanation":"本题考查人文常识。\nA项错误，潘多拉，希腊神话中的第一个女人。她貌美性诈，私自打开宙斯送给她的一只盒子，里面装的疾病、疯狂、罪恶、嫉妒等祸患，一齐飞出，只有希望留在盒底，人间因此充满灾难。因此“潘多拉的盒子”成为“灾祸的来源”的同义语。\nB项正确，荷马史诗中的英雄阿喀琉斯出生后便被神仙母亲倒提着浸入冥河，而脚后跟却不慎露在水外，因而除脚后跟外，全身各处刀枪不入。后来，一次战斗中他被人一箭射中脚踝而死去。后人用阿喀琉斯之踵喻指即使再强大的英雄，也有致命的死穴或软肋。\nC项错误，“修昔底德陷阱”，指一个新崛起的大国必然要挑战现存大国，而现存大国也必然会回应这种威胁，这样战争变得不可避免。此说法源自古希腊著名历史学家修昔底德，他认为，当一个崛起的大国与既有的统治霸主竞争时，双方面临的危险多数以战争告终。\nD项错误，古希腊传说中迪奥尼修斯国王请他的大臣达摩克利斯赴宴，命其坐在用一根马鬃悬挂的一把寒光闪闪的利剑下，意指令人处于一种危机状态，随时要有危机意识。达摩克利斯之剑比喻安逸祥和背后存在的杀机和危险，告诫人们要经常反思潜在的风险并化解之。现也引申为做坏事的人随时都有可能受到惩罚。\n故正确答案为B。","no":8,"missingImage":false},{"type":"question","qid":"2452652","cat":"人文常识","stem":"我国在区块链领域拥有良好基础，要加快推动区块链技术和产业创新发展，积极推进区块链和经济社会融合发展。关于区块链的特征和作用，下列说法不正确的是","options":{"A":"省去第三方中间环节，降低交易成本","B":"打通部门间的数据壁垒，实现信息共享","C":"解决经济社会发展中的“存证”难题，维护社会秩序","D":"排除管理员外任何人修改信息的可能性，确保信息安全"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，区块链技术通过“去中心化”和“点对点”的特征，进一步减少中间环节，消除了第三方交易中介存在的必要性，从而降低交易成本。因为实现了点对点的交易，中央处理或清算组织成为冗余；因为交易的真实性是由区块链上所有参与者共同验证和维护的，所以作为第三方的信用中介也失去了存在价值。\nB项正确，区块链“分布式”的特点，可以打通部门间的“数据壁垒”，实现信息和数据共享。与中心化的数据存储不同，区块链上的信息都会通过点对点广播的形式分布于每一个节点，通过“全网见证”实现所有信息的“如实记录”。在公共服务领域，区块链能够实现政务数据跨部门、跨区域共同维护和利用，为人民群众带来更好的政务服务体验。\nC项正确，区块链“不可篡改”的特点，为经济社会发展中的“存证”难题提供了解决方案。只要能够确保上链信息和数据的真实性，那么区块链就可以解决信息的“存”和“证”难题。比如在版权领域，区块链可以用于电子证据存证，可以保证不被篡改，并通过分布式账本链接原创平台、版权局、司法机关等各方主体，可以大大提高处理侵权行为的效率。在金融、司法、医疗、版权等对数据真实性要求高的领域，区块链都可以创造安全、高效的应用场景。\nD项错误，区块链通过时间戳保证每个区块依次顺序相连。时间戳使区块链上每一笔数据都具有时间标记。简单来说，时间戳证明了区块链上什么时候发生了什么事情，且任何人无法篡改，甚至管理员也无法修改。\n本题为选非题，故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"2452670","cat":"人文常识","stem":"以下是某执法部门对市民网络投诉的回复情况：\n\u003cimg data-k=\"105ae33e6cab\" style=\"max-width:554px\">\n下列对管理员回复的评价，正确的是","options":{"A":"合情合理，明确表明了执法的合法依据","B":"内容完整，能准确告知执法信息的查询途径","C":"格式规范，但未具体说明执法的正当理由","D":"回复及时，但内容避重就轻并缺乏针对性"},"answer":"D","explanation":"本题考查法律常识。根据《信访工作条例》第十七条规定：“公民、法人或者其他组织可以采用信息网络、书信、电话、传真、走访等形式，向各级机关、单位反映情况，提出建议、意见或者投诉请求，有关机关、单位应当依规依法处理。”第三十四条规定：“对本条例第三十一条第六项规定的信访事项应当自受理之日起60日内办结；情况复杂的，经本机关、单位负责人批准，可以适当延长办理期限，但延长期限不得超过30日，并告知信访人延期理由。”案件中，投诉时间是5月23日，处理时间是5月24日，回复及时。但回复的内容，缺乏针对性。只说了配合市政府工作，但对于老百姓提出的三个问题，为啥撕，为啥不让整改，损失谁承担并未一一作答。\nAB选项错误，该回复缺乏针对性，因此，内容不完整，也不够合情合理。\nC选项错误，回复中说明了执法的理由，即配合市政府工作。\n故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"2452671","cat":"法律常识","stem":"赵某被依法列为失信联合惩戒对象。据此，有关部门可以对他采取的合法措施是","options":{"A":"教育管理部门禁止赵某的孩子就读重点学校","B":"用人单位取消赵某的年终绩效工资","C":"人民法院将赵某的失信情况通报其配偶所在单位","D":"某机关拒绝录用赵某为公务员"},"answer":"D","explanation":"本题考查法律。\nA项错误，根据《关于对失信被执行人实施联合惩戒的合作备忘录》规定：“（二十三）限制失信被执行人及失信被执行人的法定代表人、主要负责人、影响债务履行的直接责任人员、实际控制人的子女就读高收费私立学校，由最高人民法院、教育部实施。”由此可见，并不是禁止就读重点学校，而是禁止就读高收费私立学校。\nB项错误，根据《关于对失信被执行人实施联合惩戒的合作备忘录》规定：“（十八）禁止参评文明单位、道德模范。对于机关、企事业单位、社会团体或其领导成员为失信被执行人的，不得参加文明单位评选，已经取得文明单位荣誉称号的予以撤销。各类失信被执行人均不得参加道德模范评选，已获得道德模范荣誉称号的予以撤销。由中央宣传部、中央文明办实施。”用人单位不能因为失信原因取消失信人年终绩效工资，但可以撤销荣誉称号，取消评优评先资格。\nC项错误，根据《关于对失信被执行人实施联合惩戒的合作备忘录》规定：“（十五)通过‘信用中国’网站和企业信用信息公示系统向社会公布，将失信被执行人信息通过信用中国网站、企业信用信息公示系统向社会公布，由国家发展改革委、工商总局实施。（十六）通过主要新闻网站向社会公布：协调相关互联网新闻信息服务单位向社会公布失信被执行人信息，由国家网信办实施。”可见备忘录中没有规定要将信息通知配偶单位。\nD项正确，根据《关于对失信被执行人实施联合惩戒的合作备忘录》规定：“（十七）限制招录（聘）为公务员或事业单位工作人员。协助限制招录（聘）失信被执行人为公务员或事业单位工作人员，由中组部、人力资源社会保障部、公务员局等有关部门实施。”失信人无法报考公务员，会被限制，只有在限制消除后才能恢复正常。\n故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"2452672","cat":"人文常识","stem":"某市交警在设卡检查酒驾时，有人驾驶摩托车行驶到检查点前，突然掉头并加速逆行。对此情形，下列执勤交警的做法恰当的是","options":{"A":"为避免发生执法风险，放弃对该摩托车的检查","B":"详细记录现场执法情况，及时作出处置","C":"将路边的共享单车推向路面，阻止摩托车逃跑","D":"立即追击拦阻，防止发生酒驾事故"},"answer":"B","explanation":"本题考查法律常识。\n A项错误，在交警检查时，有人驾驶摩托车加速逆行，逃避交警的检查，该人的行为有违法的嫌疑，涉嫌酒驾或者其他违法行为，执勤交警应及时处理这种情况，放弃对摩托车的检查、让该摩托车逆行可能会造成交通事故的发生。\nB项正确，《道路交通安全违法行为处理程序规定》第十五条第一款规定：“公安机关交通管理部门可以利用交通技术监控设备收集、固定违法行为证据。”交警在遇到本题中的情况，应利用执法记录仪等设备详细记录现场执法情况，可以向交通管理部门反映、联合其他路口交警等，对该摩托车的车主作出处置。\nC项错误，将共享单车推向路面会在路面上形成障碍，影响其他车辆的通行，也会影响周围行人使用共享单车。\nD项错误，该摩托车车主是加速逆行，若交警及时追击，两辆车的逆行在公路上会影响其他车辆的正常出行，容易引发交通事故，造成交通混乱。\n故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"2452673","cat":"法律常识","stem":"1965年，老周自建了一套房屋。2017年，老周的房屋被划入旧城改造范围。因无产权证和土地使用证，该房屋被认定为违法建筑，城管部门依据2008年施行的《城乡规划法》，责令老周限期拆除。对此，下列说法正确的是","options":{"A":"老周的房屋属于违法建筑，应当责令其自行拆除","B":"因旧城改造，认定老周的房屋为违法建筑已无实际意义","C":"城管部门适用法律错误，限期拆除的决定无效","D":"老周的房屋属历史遗留问题，不能得到拆迁补偿"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，老周的房屋自建于1965年，在2008年《城乡规划法》颁布施行前已建成，根据法不溯及既往的原则，无法依据2008年颁布的《城乡规划法》认定老周的房屋为违法建筑。\nB项错误，是否认定为违法建筑，关系到老周能否获得拆迁补偿，因此，无实际意义的说法错误。\nC项正确，根据法不溯及既往的原则，城管部门适用法律错误，因此城管部门作出的限期拆除决定无效。\nD项错误，老周的房屋属于历史遗留问题，但如果根据1965年法律，老周房屋属于合法房屋的，拆迁时应当给予补偿。\n故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"2452674","cat":"人文常识","stem":"老丁将自家临街的一间房屋改为商店，里面的一间房屋用于居住，并办理了合法经营手续。前不久，有消费者举报老丁商店有假冒商品出售，经查，举报属实。对此，市场监督管理部门可以作出的行为是","options":{"A":"查封商店并扣留假冒商品","B":"冻结商店或老丁的银行账户","C":"没收商店的营业收入","D":"责令老丁暂停营业"},"answer":"D","explanation":"本题考查法律常识。根据《消费者权益保护法》第五十六条规定：“经营者有下列情形之一，除承担相应的民事责任外，其他有关法律、法规对处罚机关和处罚方式有规定的，依照法律、法规的规定执行；法律、法规未作规定的，由工商行政管理部门或者其他有关行政部门责令改正，可以根据情节单处或者并处警告、没收违法所得、处以违法所得一倍以上十倍以下的罚款，没有违法所得的，处以五十万元以下的罚款；情节严重的，责令停业整顿、吊销营业执照：······（二）在商品中掺杂、掺假，以假充真，以次充好，或者以不合格商品冒充合格商品的······”\nA、B两项错误，采用查封、扣押、冻结等行政强制措施是对财物实施暂时性控制，而老丁商店销售假冒商品已经查证属实，市场监督管理部门应当直接做出行政处罚，而非采取行政强制措施。\nC项错误，市场监督管理部门可以做出没收违法所得的处罚，但不得没收商店的营业收入。\nD项正确，如果情节严重，市场监督管理部门可以做出责令暂停营业的处罚。\n故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"2452655","cat":"法律常识","stem":"某区教育局将学区调整的情况张贴在各学校门口。刘某的住房被划入新的学区，但他没有及时了解情况，将房屋低价卖给了王某。对此，下列说法正确的是","options":{"A":"刘某认为区教育局公开学区信息不当，有权提起行政诉讼","B":"区教育局公开学区信息的行为构成行政不作为","C":"刘某有权以重大误解为由，解除与王某的房屋买卖合同","D":"区教育局应对刘某的损失承担赔偿责任"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，根据《政府信息公开条例》第五十一条规定：“公民、法人或者其他组织认为行政机关在政府信息公开工作中侵犯其合法权益的，可以向上一级行政机关或者政府信息公开工作主管部门投诉、举报，也可以依法申请行政复议或者提起行政诉讼。”因此，如果刘某认为教育局做法不当的，有权提起行政诉讼。\nB项错误，行政不作为是指行政机关应当履行职责而不履行或者拖延履行职责。区教育局主动公开学区，并不存在不作为。\nC项错误，根据《民法典》第一百四十七条规定：“基于重大误解实施的民事法律行为，行为人有权请求人民法院或者仲裁机构予以撤销。”刘某因为没有及时了解情况，将学区房低价卖给了王某，双方存在重大误解，刘某可以请求人民法院或者仲裁机构将合同撤销，但不能直接与王某解除合同。\nD项错误，刘某没有及时了解学区变动信息，是由于自己的过错，其不能要求区教育局承担责任。但是其将房屋低价卖给了王某，存在重大误解，刘某可以通过请求人民法院或者仲裁机构将合同撤销挽回损失。\n故正确答案为A。","no":15,"missingImage":false}],"count":12,"answerable":12,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        我们多数人对“膳食纤维”的感性印象，恐怕就是那些粗糙的、嚼不烂的“植物纤维”，所以很容易就会想到芹菜和韭菜这类含“筋”丰富的蔬菜，其实，这两种蔬菜膳食纤维含量和许多食物比起来丝毫不出众。它们“渣渣”的口感，主要是植物木质部和韧皮部形成的宏观维管束结构，不完全等同于“膳食纤维”。\u003c/p>\u003cp>        食物膳食纤维的含量，并不与“粗糙”程度成正比，反而许多“软滑细润”的食物同样含有大量的膳食纤维。笼统说，膳食纤维是不能被我们消化酶消化的植物细胞壁残余物，包括纤维素、半纤维素、抗性淀粉、菊粉和各类多糖如葡甘露聚糖和果胶等等。膳食纤维分为“不溶性膳食纤维”和“可溶性膳食纤维”两大类，它们在身体里发挥着不同生理作用。\u003c/p>\u003cp>        “不溶性膳食纤维”不溶于水，但它们能像钢筋骨架一样撑起食物，从而增加了“饱腹感”并能刺激肠道蠕动，减少排泄物在肠道里的停留时间，就是俗称的“润肠通便&quot;；它们通常不能被肠道微生物消化利用，但可以吸附肠道里的有害物质。\u003c/p>\u003cp>        “可溶性膳食纤维”能溶于水，吸水后多呈凝胶状，让食物变得黏稠软滑，使食团体积膨胀，延长胃的排空时间，减缓糖分的吸收：它们能被结肠中的微生物降解生成短链脂肪酸等有益的物质，也能阻止肠粘膜粘连和潜在致病菌迁移，减轻肠道炎症。\u003c/p>\u003cp>        大多数植物性食物，都同时含有这两类膳食纤维。食物口感粗糙的部分，主要包含不溶性膳食纤维，而可溶性纤维完全没有粗粝的口感，膳食纤维含量\u003cu>            \u003c/u>，所以一种食物粗纤维较多，并不代表它的膳食纤维的总量就高。那么，哪些食物的膳食纤维含量比较高呢？膳食纤维在谷物、豆类、菌藻和果蔬中广泛存在，而动物性食物则几乎不含膳食纤维。实际上，豆类和谷物才是膳食纤维的含量冠军，它们可溶性和不可溶性膳食纤维的含量都很高，是普通果蔬的几倍甚至十多倍。需要强调的是，这里的“谷物”特指“全谷物”：即脱壳后没有经过精制的粮食种子，譬如小麦粒、大麦粒、糙米、燕麦、荞麦、玉米、薏米、小米等，不包括精白米和精白面，事实上，精米、精面做成的食物，膳食纤维含量很低。\u003c/p>\u003cp>        我国居民膳食指南建议，成人每日膳食纤维的摄入量为25～30克(正比于摄入热量)，我们日常的烹饪方式比如粗研磨、切碎、加热，对膳食纤维的含量和状态影响不大。但如果你不吃谷物或豆类，仅仅靠吃蔬果、坚果和肉类，膳食纤维能达到每日推荐量的可能性几乎没有。\u003c/p>\u003cp>        那些长期选择“低碳水加只吃肉类和果蔬”的饮食方式，从膳食纤维摄入角度看并不健康，这类人的肠道菌群会发生改变，体内产生的三甲胺和氧化三甲胺显著高于普通人，这类物质也是心血管疾病的风险因子。\u003c/p>\u003cp>        但值得注意的是，既然有推荐量，也就是说膳食纤维摄入并非越多越好，有相关动物性实验显示某类型的膳食纤维摄入过量，会影响肠道菌群，从而对身体产生非常负面的影响。所以尽量从均衡膳食中摄入膳食纤维，不推荐额外的可溶性膳食纤维补充剂。\u003c/p>\u003cp>        正常人群还是应该遵照居民膳食指南来吃，自己“设计”的饮食方式绝不会优于指南的。\u003c/p>","questions":[{"qid":"2452579","cat":"片段阅读","stem":"作者在文章开头以芹菜韭菜为例主要想说明：","options":{"A":"多数人凭感性印象判定膳食纤维","B":"含“筋”的食物并非一定富含膳食纤维","C":"膳食纤维丰富与否不能光凭口感","D":"这两种蔬菜实际上与膳食纤维关系不大"},"answer":"B","explanation":"文段开篇指出大多数人对“膳食纤维”的感性印象是粗糙且嚼不烂的“植物纤维”，通过“所以”做总结，引出“芹菜和韭菜”这类含“筋”丰富的蔬菜，说明人们认为芹菜和韭菜是富含“膳食纤维”的，随后通过“其实”转折，指出芹菜与韭菜他们的纤维含量和许多食物比起来并不如其他食物，尾句进行说明，强调其并不等同于“膳食纤维”，故整个文段通过“芹菜与韭菜”这类含“筋”的食物说明其并非富含“膳食纤维”，对应B项。\nA项，“多数人凭感性印象” 文段想要说明凭感性印象判定的食物并非一定富含膳食纤维，与文段观点不符，排除；\nC项，“不能光凭口感”表述不明确，文段想要说明含“筋”类的食物并非有膳食纤维，排除；\nD项，论述的为例子本身，文段意在通过这两种蔬菜引出观点，例子本身非重点，排除。\n故正确答案为B。","no":16,"missingImage":false},{"qid":"2452586","cat":"片段阅读","stem":"下列对膳食纤维的描述不符合文意的是：","options":{"A":"可以是感觉上非常软嫩细滑的食物","B":"不可能被肠胃中的消化酶完全消化","C":"两类膳食纤维对人体作用不尽相同","D":"每天食用含膳食纤维食物多多益善"},"answer":"D","explanation":"这是一道选非的细节判断题。\nA项，通过第二段中“反而许多‘软细滑润’的食物同样含有大量的膳食纤维”可知，表述正确，排除；\nB项，根据第二段中“膳食纤维是不能被我们消化酶消化的植物细胞壁残余物”可知，表述正确，排除；\nC项，根据第二段中“膳食纤维分为‘不溶性膳食纤维’和‘可溶性膳食纤维’两大类，它们在身体里发挥着不同生理作用”，可知，表述正确，排除；\nD项，根据第八段中“但值得注意的是，既然有推荐量，也就是说膳食纤维摄入并非越多越好”可知，“多多益善”表述错误，故当选。\n本题为选非题，故正确答案为D。\n【文段出处】《口感越粗越有“筋”的果蔬，膳食纤维的含量就越高？》","no":17,"missingImage":false},{"qid":"2452593","cat":"语句表达","stem":"填入文中画横线处最恰当的是：","options":{"A":"取决于两者的总和","B":"全在于两者比例高低","C":"来自于这两类食物","D":"包含在这两类食物中"},"answer":"A","explanation":"横线出现在第五段中间，需结合上下文分析。横线前指出大多数植物性食物同时含有不溶性和可溶性膳食纤维，口感粗糙部分主要是不溶性膳食纤维，可溶性膳食纤维没有粗粝口感。横线后强调一种食物粗纤维多不代表膳食纤维总量高。这说明膳食纤维的总量是由不溶性和可溶性膳食纤维共同决定的，并非只看其中某一种，对应A项。\nB项，横线后已点明与各类纤维占比多少无关，“全在于两者比例高低”与文意相悖，排除；\nC、D两项，“两类食物”偷换概念，文段围绕两类“膳食纤维”论述，而非“两类食物”，均排除。\n故正确答案为A。\n【文段出处】《口感越粗越有“筋”的果蔬，膳食纤维的含量就越高？》","no":18,"missingImage":false},{"qid":"2452606","cat":"片段阅读","stem":"下列说法与文意不符的是：","options":{"A":"食物中包含不溶性膳食纤维有助通便","B":"每天进食粗粮有利于膳食纤维量达标","C":"长期食用动物性食物对健康有危害性","D":"食谱中包含豆类食品对健康十分有益"},"answer":"C","explanation":"A项，根据第三段“‘不溶性膳食纤维’不溶于水······减少排泄物在肠道里的停留时间，就是俗称的‘润肠通便’”可知，不溶性膳食纤维有助于通便，选项表述正确，排除；\nB项，根据第五段“这里的‘谷物’特指‘全谷物’：即脱壳后没有经过精制的粮食种子······事实上，精米、精面做成的食物，膳食纤维含量很低”及第六段“成人每日膳食纤维的摄入量为25～30克（正比于摄入热量）······膳食纤维能达到每日推荐量的可能性几乎没有”可知，选项表述正确，排除；\nC项，根据第七段“那些长期选择‘低碳水加只吃肉类和果蔬’的饮食方式······并不健康”可知，低碳水且只吃动物性食物才不健康，选项扩大范围，当选；\nD项，根据第五段“事实上，豆类和谷物才是膳食纤维的含量冠军”可知，选项表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《口感越粗越有“筋”的果蔬，膳食纤维的含量就越高？》","no":19,"missingImage":false},{"qid":"2452611","cat":"片段阅读","stem":"作者通过这篇文章主要说明：","options":{"A":"哪些食物中膳食纤维含量是比较丰富的","B":"食用适量含膳食纤维食品对健康有哪些好处","C":"居民膳食指南给日常饮食提出哪些要求","D":"不恰当的饮食方式中隐含哪些健康风险因素"},"answer":"A","explanation":"文章首段引出膳食纤维的话题，第二段明确膳食纤维概念，指出纤维含量和食物粗糙程度无必然关联，第三、四段分别阐释不溶性膳食纤维和可溶性膳食纤维的特点与作用，第五段说明各类食物膳食纤维含量差异，点明豆类、全谷物纤维含量最高，第六至九段介绍成人膳食纤维每日推荐摄入量，说明纤维摄入不足、过量均会危害身体，倡导均衡膳食、遵循膳食指南。文章围绕膳食纤维展开论述，且着重对比不同食物的纤维含量，重点围绕“富含膳食纤维的食物”展开论述，对应A项。\nB项，分别对应文章第三、四段，并非文段重点，排除；\nC、D两项，文章主要围绕“膳食纤维”展开论述，均缺少主题词“膳食纤维”，偏离文章核心话题，排除。\n故正确答案为A。\n【文段出处】《口感越粗越有“筋”的果蔬，膳食纤维的含量就越高？》","no":20,"missingImage":false},{"qid":"2452618","cat":"片段阅读","stem":"国家治理效能是反映制度优势的重要指标。中国特色社会主义的制度优势需要转化为国家治理效能，需要通过治理效能来实现和彰显。要善于运用制度和法律治理国家，把各方面制度优势转换为管理国家的效能。推进国家治理体系和治理能力现代化，是发挥社会主义制度优越性的必由之路。\n这段文字重在强调：","options":{"A":"我国制度优势需要通过良好的治理效能来体现","B":"依靠法律推进我国治理体系和治理能力现代化","C":"社会主义制度对我国治理现代化产生重大影响","D":"治理国家必须发挥我国社会主义制度的优越性"},"answer":"A","explanation":"文段开篇指出国家治理效能对制度优势的重要性，接着介绍中国特色社会主义的制度优势需要转化为国家治理效能，并通过治理效能来实现和彰显。随后用“要”提出对策，即善于运用制度和法律治理国家，把制度优势转换为治理效能。结尾强调推进国家治理体系和治理能力现代化，是发挥社会主义制度优越性的必由之路。故文段始终围绕“制度优势”与“治理效能”的关系展开，重在强调制度优势需要通过治理效能来彰显，对应A项，当选。\nB项“依靠法律推进我国治理体系和治理能力现代化”，“法律”表述片面，且缺少主题词“制度优势”，排除；\nC、D两项“社会主义制度对我国治理现代化产生重大影响” 和“治理国家必须发挥我国社会主义制度的优越性”均偏离文段重点，且缺少主题词“治理效能”，排除。\n故正确答案为A。\n【文段出处】人民网《国家治理现代化：把制度优势转化为治理效能》","no":21,"missingImage":false},{"qid":"2452624","cat":"片段阅读","stem":"统一的数据采集和分类管理标准有利于政务数据的整合共享，方便各地区、各部门数据库之间的接口连接与数据交换。应加快制定政务数据采集、处理、提供、修改等各类标准规范，对原有信息资源进行标准化处理，规范数据共享的类型、方式、内容、对象和条件，破除数据共享的技术障碍。\n这段文字中提取的关键词最恰当的是","options":{"A":"数据采集  整合共享  技术障碍","B":"政务数据  数据交换  数据共享","C":"数据采集  标准规范  信息资源","D":"政务数据  标准规范  数据共享"},"answer":"D","explanation":"文段开篇提到有利于政务数据整合共享的两种方式，然后提出对策，即加快制定政务数据的各类标准规范，规范数据共享，以破除数据共享的技术障碍。故文段的关键词是“政务数据”“标准规范”“数据共享”，对应D项。\nA项，“数据采集”表述片面，只是政务数据整合共享两种方式中的其中一种，排除。\nB项，“数据交换”表述片面，只是政务数据整合共享的意义之一，排除。\nC项，“信息资源”非重点，只是标准化处理的对象，排除。\n故正确答案为D。\n【文段出处】《政务数据不愿共享的成因及对策》","no":22,"missingImage":false},{"qid":"2452662","cat":"片段阅读","stem":"对于1900-1911年的社会政治变动，真正给我以深刻印象的，并不是所读到的辛亥革命史著作，而是鲁迅的小说。从那里，我才真正知道各色人等是如何经历一场变革，他们不同的心态、经历、际遇、沉浮。在一个个非常生活化的、普通的空间里，被作家塑造和加工了的人物形象是栩栩如生的、可信的，他们再现了一个时代的情境。在这里，辛亥革命不是一个被神圣化了的事件，而是每一个经历者生活的一部分。而在我们的历史写作中，重大事件往往是被高高地架起来的。\n这段文字意在说明：","options":{"A":"鲁迅小说对历史事件的描写真实生动","B":"历史写作往往不能给人以鲜活的印象","C":"小说的史实陈述比历史学著作更真实","D":"撰写辛亥革命史应该借鉴文学的手法"},"answer":"B","explanation":"文段开篇说明相对于辛亥革命史著作，鲁迅的小说更能让作者印象深刻，让其更深入地了解当时的社会政治变动，小说中塑造的人物形象栩栩如生，再现了一个时代的情景。接着再次说明鲁迅小说对历史事实的描写真实生动。文段尾句则指出我们的历史写作中，重大事件往往是被高高地架起来的，即强调历史写作往往不能生动地再现历史。故文段为分-总结构，以鲁迅的小说为引，重点强调历史写作往往不能生动地再现历史，对应B项。\nA项，“鲁迅小说”为前文话题引入的部分，非重点，排除；\nC项，“小说的史实陈述”偷换概念，文段指出的是“小说中塑造的人物形象再现时代情景”，而非“史实陈述”，且文段强调的并非是“真实”，而是“生动”，选项偏离文段中心，排除；\nD项，“应该借鉴文学的手法”，对策无中生有，文段未提及，排除。\n故正确答案为B。\n【文段出处】赵世瑜《明清史、近代史、社会史三者如何对话？》","no":23,"missingImage":false},{"qid":"2452543","cat":"语句表达","stem":"群体免疫力是一种保护整个社区免受疾病侵害的手段：通过免疫社区里足够多的人，有效地打断疾病从一个人传染到另一个人的接力，中断感染链，从而保护少数不能接种疫苗的人群。但是，这个模式要真正起作用，社区中接种疫苗的人必须足够多。接种疫苗的人数必须高于一个最小的百分值(学术界称之为“阈值”)，群体免疫才会生效。接种的社区成员越多，                    。\n填入画横线处最恰当的是：","options":{"A":"整个社区就越能够避免疾病的爆发","B":"才能有效阻断疾病源感染整个社区","C":"越能保护少数拒绝接种疫苗的人群","D":"整个社区的免疫模式才能发生作用"},"answer":"A","explanation":"横线出现在文段结尾，需结合前文内容分析。文段首先介绍群体免疫力的内涵，说明其依靠多数人接种疫苗、中断感染链，进而保护社区及少数无法接种疫苗的人群。接着通过“但是”进行转折，指出接种人数达到规定阈值群体免疫才能生效。横线处所填内容应承接前文逻辑，体现接种人数增多带来的积极效果，对应A项。\nB项，“阻断疾病源”表述过于绝对，群体免疫力只能保护群体免受侵害，而不是“阻断疾病源”，排除；\nC项，“拒绝接种疫苗的人群”文段未提及，无中生有，排除；\nD项，文段强调的是接种人数达到阈值，群体免疫便可生效，并非人数越多免疫模式才起作用，排除。\n故正确答案为A。\n【文段出处】《这些谣言别再信啦！关于疫苗的三大误解 》","no":24,"missingImage":false},{"qid":"2452663","cat":"片段阅读","stem":"乡村文化的发展获取了可观的经济效益，但从长远看，文化产品更应注重它们的社会效益。社会效益会提高人们的幸福感，有助于实现中华民族的伟大复兴。当然，这并不是要求我们放弃经济效益，而是在两者发生冲突时应把社会效益放在首位。实现乡村文化产业的社会效益，需要政府的监督引导以及政策支持，乡村文化企业自身更应不断提高创新能力，传播先进的文化思想。\n这段文字主要说明：","options":{"A":"发展乡村文化产业在乡村振兴中的作用","B":"发展乡村文化产业的主要对策和举措","C":"发展乡村文化产业中政府和企业的职责","D":"发展乡村文化产业要重视其社会效益"},"answer":"D","explanation":"文段首句通过转折引出话题，即乡村文化产品应更重视社会效益。并进一步解释说明重视社会效益的原因，接着阐述重视社会效益并非放弃经济效益，而是要在冲突时将社会效益放在首位，随后就如何实现社会效益，提出对策，强调政府以及企业应该发挥作用。故文段意在强调在乡村文化产业发展中，我们需要注重社会效益，D项符合文意。\nA项，文段并没有论述乡村文化产业对于乡村振兴的重要作用，排除；\nB项，没有指明具体的对策举措是什么，表述不明确，排除；\nC项，缺乏关键词“社会效益”，排除。\n故正确答案为D。\n【文段出处】《提升乡村文化产业的社会效益》","no":25,"missingImage":false},{"qid":"2452556","cat":"片段阅读","stem":"在电影表现的技术层面，数字技术事实上已经代替了同源成像技术，出现了由电脑生产影像所构造的故事片。电脑生产的影像已经不再局限于单纯的特技效果，它们构成了影片全部蒙太奇中的镜头，主要角色都是完全或部分由电脑合成。在电影的发行和放映环节，具有质感的胶片卷，放映机吵闹的声音，抑或是影像剪辑表，还有流动于影院之间装胶片的金属盒，正在一个个地消失于我们的视线，成为历史。\n下列对文意的概括最恰当的是：","options":{"A":"数字技术已经颠覆了以往电影生产发行全过程","B":"当前电影艺术表现完全离不开数字技术的辅助","C":"数字合成技术取代了电影制作中各种拍摄手法","D":"同源成像技术在电影拍摄技术层面已成为历史"},"answer":"A","explanation":"文段首先阐述“在电影表现的技术层面”，数字技术已代替了同源成像技术，并进行解释说明；接着论述“在电影的发行和放映环节”，数字技术给电影带来的改变，以往的形式“正在一个个地消失于我们的视线，成为历史”。故整个文段为并列结构，讲述数字技术给电影表现的技术层面、发行和放映环节分别带来了重大改变，对应A项，“数字技术已经颠覆了以往电影生产发行全过程”。\nB项，“完全离不开”无中生有，且表述过于绝对化，排除；\nC项，“拍摄手法”仅对应文段“电影表现的技术层面”，表述片面，排除；\nD项，“同源成像技术”非重点，文段重点为“数字技术”，排除。\n故正确答案为A。\n【文段出处】《王静：超越电影本体论》","no":26,"missingImage":false},{"qid":"2452633","cat":"片段阅读","stem":"以种植业和养殖业为主的农业生产，是深度贫困地区产业扶贫的重要项目和农民主要收入来源。农业生产是“露天工厂”，具有“靠天吃饭”的局限性。深度贫困地区大都自然条件恶劣，发生灾害的频率高、范围广，加之病虫害等方面的影响，给农业生产带来极大挑战。因此，深度贫困地区发展种植业和养殖业，更需要借助农业保险这一市场经济条件下风险管理的基本手段。\n以下概括不符合文意的是","options":{"A":"科学的风险管理对于保障农民收入至关重要","B":"借助农业保险可有效分散农业生产者的风险","C":"深度贫困地区的农业生产需要承担较大风险","D":"农业保险能够提前介入并有效预防自然灾害"},"answer":"D","explanation":"A项，根据“农业生产······是深度贫困地区······农民主要收入来源”“更需要借助农业保险这一市场经济条件下风险管理的基本手段”可知，风险管理对保障农民收入很重要，符合文意，排除；\nB项，根据“更需要借助农业保险这一市场经济条件下风险管理的基本手段”可知，农业保险可分散农业生产者的风险，符合文意，排除；\nC项，根据“深度贫困地区大都自然条件恶劣，发生灾害的频率高、范围广，加之病虫害等方面的影响，给农业生产带来极大挑战”可知，深度贫困地区的农业生产风险较大，符合文意，排除；\nD项，根据“农业生产······具有‘靠天吃饭’的局限性”及“更需要借助农业保险这一市场经济条件下风险管理的基本手段”可知，文段仅指出农业保险是风险管理手段，并未提及农业保险能够“提前介入并有效预防自然灾害”，无中生有，与文意不符，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《农业保险助力产业扶贫》","no":27,"missingImage":false},{"qid":"2452665","cat":"片段阅读","stem":"每一页书中也许蕴含着各种心境情绪，让你时而唏嘘不已、痛哭流涕，时而又情不自禁、破涕为笑。你打开一本书，又好似开启了一条可以随意穿梭的时空隧道，瞬间拥有了一双可以御风的翅膀。每一页书中还可能隐含着一场涤荡一切的头脑风暴、一场惊天动地的革命，打开它你可能坚定如往昔，也可能瞬间大彻大悟。在书中，百年乃至千年前的先贤、天才与你同在。在书中，你可以与古人窃窃私语，也可以与他们唇枪舌剑。而每当你合上书页，你都不再是打开它时的自己——人不能两次打开同一本书。\n下列说法与文中画线部分意思最接近的是：","options":{"A":"每读一本书读者就可能穿越一次历史和现实","B":"两次读同一本书时往往身处不同的时间空间","C":"读书的感悟会随着心境和情绪的不同而变化","D":"同一本书中包含的内容有时候给人印象不同"},"answer":"C","explanation":"文段开篇说明书中蕴含着各种心境情绪，并具体解释说明，接下来通过打比方的形式首先说明书给人的力量，继而指出书的力量给予我们的可能是坚定如往昔，也可能是大彻大悟，后文同时指出在书中面对先贤、天才时，我们可以与他们窃窃私语，也可以唇枪舌剑，说明书给人带来的心境是不同的，而人在书中所获得的也是不同的，因此尾句“人不能两次打开同一本书”即读书给人带来的感悟是不同的，对应C项。\nA项“穿越一次历史和现实”、B项“时间空间”均对应打比方的内容，而打比方是为说明书的作用，故打比方自身并非重点，且两项所述内容并非读书给予人的作用，均排除； \nD项所述内容为书的内容给人的客观印象，而文段更多的是强调“读书之后人的主观感受”，排除。\n故正确答案为C。\n【文段出处】《阅读者的双重性格》","no":28,"missingImage":false},{"qid":"2452544","cat":"片段阅读","stem":"海底矿产资源中最受关注的是海底石油。有人推测，\u003cimg data-k=\"25cf5647428a\">的大陆架蕴藏着石油。海底石油储量约2500亿吨，相当于世界石油预估储量的三分之一以上，仅在大陆架的石油储量就有1400亿吨。第一口浅海油井出现在1891年，更多的勘探开发始于20世纪20年代，60年代进入飞跃发展时期。现在，全世界有100多个国家在勘探海底石油，30多个国家已开采出这种“工业的血液”。20世纪50年代海底石油产量仅占全世界石油总产量的\u003cimg data-k=\"0ef566a32600\">，70年代增加到\u003cimg data-k=\"c78f19de7451\">，80年代已达\u003cimg data-k=\"2c6adc1698b0\">，21世纪初已远远超过\u003cimg data-k=\"e172e0ad0a10\">。\n以下概括不符合文意的是","options":{"A":"近半个多世纪海底石油勘探开采发展极为迅速","B":"大陆架的石油储量超过世界石油储量三分之一","C":"现今使用的石油及制品多半来自海底油田","D":"全世界约半数的国家进行了海底石油勘探"},"answer":"B","explanation":"A项，根据文段“20世纪50年代海底石油产量仅占全世界石油总产量的\u003cimg data-k=\"0ef566a32600\">，70年代增加到\u003cimg data-k=\"c78f19de7451\">，80年代已达\u003cimg data-k=\"2c6adc1698b0\">，21世纪初已远远超过\u003cimg data-k=\"e172e0ad0a10\">”可知，近半个多世纪，即20世纪60年代至21世纪10年代，海底石油勘探开采发展迅速，与文意相符，排除；\nB项，根据文段“海底石油储量约2500亿吨，相当于世界石油预估储量的三分之一以上，仅在大陆架的石油储量就有1400亿吨”可知，文段只提及海底石油储量相当于世界石油预估储量的三分之一，选项“大陆架的石油储量”偷换概念，当选；\nC项，根据文段“30多个国家已开采出这种‘工业的血液’”和“21世纪初已远远超过\u003cimg data-k=\"e172e0ad0a10\">”可知，海底石油是“工业的血脉”，且占世界石油总量超过\u003cimg data-k=\"e172e0ad0a10\">，在现今广泛被利用，与文意相符，排除；\nD项，根据文段“全世界有100多个国家在勘探海底石油”可知，该项表述正确，因为世界上共有233个国家和地区，其中国家有197个，与文意相符，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《未来人类向海洋要资源》","no":29,"missingImage":false},{"qid":"2452629","cat":"片段阅读","stem":"语言和文化一样，很少是自给自足的，故词语的借用自古至今都是常见的语言现象。但当外来词汇进入一个国家后，当地民族会在适应吸收新成分的同时，不自觉地变异和改造其原貌。随着时间的推移，外来词汇会逐渐本土化，日久天长，源流模糊，体用隔断，变异迭生。一旦借词身上的“异域特征”(诸如音素、音节的构成等)在使用者的意识里淡化或消失，它们就会被当地人视为自己母语中的一部分。\n这段文字重在说明：","options":{"A":"外来词汇对本民族语言和文化的影响","B":"本民族语言吸收改造外来词汇的方式","C":"外来词汇使用的普遍性及本土化过程","D":"外来词汇在母语中淡化与消失的原因"},"answer":"C","explanation":"文段开篇讲到词语的借用自古至今都是常见的语言现象，接着通过转折关联词“但”指出当地民族会在适应、吸收外来词新成分的同时对其进行改造，接着详细阐述了外来词本土化的过程。故文段重在强调外来词的使用是很普遍的现象以及它本土化的具体过程，对应C项。\nA项：“外来词汇对本民族的影响”在文段中并未提及，属于无中生有，排除。\nB项：“吸收改造外来词汇的方式”文段并未提及，无中生有，排除。\nD项：文段讲的是借词身上的“异域特征”在使用者的意识里淡化或消失，而非外来词汇在母语中淡化与消失，偷换概念，排除。\n故正确答案为C。\n【文段出处】《由东南亚语言中的梵汉借词看文化交流》","no":30,"missingImage":false},{"qid":"2452659","cat":"片段阅读","stem":"旅行是用你的眼、用你的心去感悟，这一点是再好的旅行装备，再妙笔生花的作家的游记作品，再保真的摄像拍照设备都代替不了的。至于如何获得个人感悟，从客观上讲需要提前做功课，带着感情和文化背景去旅行；从主观上要保持随心所欲的心态，每个人都有自己独特的感悟，不要跟随他人的参照系去做盲目判断。\n下列说法与文意不符的是","options":{"A":"旅行就是用自己的眼睛去发现美探索美","B":"了解相关文化背景有助于体悟旅行之美","C":"旅行时的装备和设备可有可无","D":"旅行者应当有宽松舒缓的心态"},"answer":"C","explanation":"A项，根据“旅行是用你的眼、用你的心去感悟”可知，旅行就是要自己去看、自己去感悟的，故表述正确，排除；\nB项，根据“从客观上讲需要提前做功课，带着感情和文化背景去旅行”可知，旅行前要提前做好准备、了解文化背景，故表述正确，排除；\nC项，根据“再保真的摄像拍照设备都代替不了”可知，文段仅论述摄像拍照设备不能代替旅行，选项中“旅行时的装备和设备”偷换概念，故表述错误，当选；\nD项，根据“从主观上要保持随心所欲的心态，每个人都有自己独特的感悟，不要跟随他人的参照系去做盲目判断”可知，旅行时要放松，不根据别人的参照去判断，故表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《葛剑雄＜四极日记＞：讲述世界尽头的“极地传奇”》","no":31,"missingImage":false},{"qid":"2452622","cat":"片段阅读","stem":"书院是中国历史上一种独具特色的文化教育形式，在书院发展的一千多年历史进程中，它不仅是中国文化的象征，更是中国文化向域外传播的窗口。书院之名起于唐代，由最早的修书、藏书的机构，逐步演变为具有教学、研究功能的场所。书院制度在宋代不断发展、壮大、成熟，清代是书院发展的鼎盛时期，无论是穷乡僻壤，还是边陲小镇都可见到书院。不仅如此，书院还随儒学走出国门，在朝鲜半岛生根、萌芽、兴盛起来，对中国文化传播起着不可替代的作用。\n这段文字主要说明","options":{"A":"书院的发展经历了漫长的历史过程","B":"书院所承载的教育及文化传播功能","C":"书院与文明传承之间有着密切关系","D":"书院制度的影响遍布我国以及域外"},"answer":"B","explanation":"文段首先阐述了书院是一种文化教育形式，“更”字强调其是中国文化传播的窗口。接着具体论述了历史上书院的教育功能。尾句具体阐述了书院的文化传播功能。由此可知，文段主要介绍了书院文化教育和传播的功用，对应B项。\nA项，“漫长的历史过程”非重点，排除。\nC项，“文明传承”无中生有，排除。\nD项，“书院制度”对应解释说明内容，非重点，且表述片面，排除。\n故正确答案为B。\n【文段出处】《书院在中华文明对外传播中的重要作用》","no":32,"missingImage":false},{"qid":"2452680","cat":"片段阅读","stem":"实际上，过分依赖保健品，不仅带不来保健的功效，还可能损害人体健康。健康的体魄不是靠各种保健品堆砌而成的，科学养生需要权威指导、科学知识。大道至简，健康养生并不复杂。世界卫生组织研究发现，影响健康的因素中，生物学因素占\u003cimg data-k=\"0c486c1399ce\">、环境影响占\u003cimg data-k=\"b579423d43a8\">、行为和生活方式占\u003cimg data-k=\"1a67739c8245\">、医疗服务仅占\u003cimg data-k=\"b956f6c8ed4d\">。因此，与其迷信保健品的神奇功效，不如以科学和自律来呵护自己的健康。\n下列说法与文意不符的是：","options":{"A":"最简单的生活方式是最好的养生","B":"应注重科学养生知识的宣传普及","C":"健康生活方式是最有效的养生方法","D":"影响人体健康的因素是多种多样的"},"answer":"A","explanation":"A项，文段阐述了“大道至简，健康养生并不复杂”，而并未提及“最简单的生活方式”，为无中生有的表述，当选；\nB项，根据“科学养生需要权威指导、科学知识”可知，表述正确，排除；\nC项，根据“影响健康的因素中······行为和生活方式占\u003cimg data-k=\"1a67739c8245\">”及“不如以科学和自律来呵护自己的健康”可知，文段强调要有健康的生活方式，而不能依赖保健品，表述正确，排除；\nD项，根据“影响健康的因素中，生物学因素占\u003cimg data-k=\"0c486c1399ce\">、环境影响占\u003cimg data-k=\"b579423d43a8\">、行为和生活方式占\u003cimg data-k=\"1a67739c8245\">、医疗服务仅占\u003cimg data-k=\"b956f6c8ed4d\">”可知，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】人民网《走出养生的“保健品误区”》","no":33,"missingImage":false},{"qid":"2452681","cat":"语句表达","stem":"①显而易见，一个专业人士在一年之内进行多次重复实验\n②但欧洲在改良并且推广印刷术之后，开始建立科学实验的制度，偶然的作用开始让位于必然\n③有经济学家认为，古代中国在技术上一直领先，是因为古代中国人口规模庞大，偶然性的发明远远多于人口稀少的欧洲\n④所获得的知识和发现，肯定要比一个工匠一辈子因为偶然和随机所获得的发现和成果多\n⑤在印刷术发明之前，人类社会科技的进步主要靠大众在生产实践中的偶然发现\n⑥无论在东方社会，还是西方社会，情况都是相似的\n将以上6个句子重新排列，语序最恰当的是：","options":{"A":"⑤⑥③②①④","B":"③⑥⑤②①④","C":"⑤⑥②①④③","D":"③⑤⑥①④②"},"answer":"A","explanation":"观察选项，判断首句，⑤表明在印刷术发明之前，人类社会科技进步靠偶然发现。③进一步说明中国的偶然性发明多，应该先提出以前多是偶然发现，再具体介绍中国偶然性发明多，即⑤比③更适合作首句，排除B、D两项。对比A项和C项发现，都是⑤⑥，对比⑥后接②或③。⑥“无论在东方社会，还是西方社会”，按照逻辑顺序，文段应该先说东方，再说西方。③中描述的是中国即东方。②中描述的是欧洲即西方。故应③在②之前，选择A项。\n故正确答案为A。","no":34,"missingImage":false},{"qid":"2452682","cat":"片段阅读","stem":"《论语》最初的译本应当是1687年在巴黎以拉丁文出版的《中国哲学家孔子》。据不完全统计，《论语》目前有40多种语言的译本，其中英语世界译本最多。不同译本间的差异较大，有些译本比较忠实于语言与历史，能客观介绍《论语》及孔子思想；有些译本则善于在翻译中寄托译者本人的使命意识，以耶稣会传教士的译著为代表；还有些译者虽然古汉语水平不高，他们的翻译主要或部分依靠前人的译著，但他们擅于解释和传播孔子思想，使之在异文化中产生很大影响。\n这段文字重在说明：","options":{"A":"《论语》的翻译活动已有三百多年的漫长历史","B":"英语国家是译介《论语》的重镇","C":"《论语》通过多种语言译介走向世界","D":"多语种的译本传播了《论语》丰富的文化价值"},"answer":"D","explanation":"文段开篇引出《论语》译本的历史，接下来通过数据论述了《论语》不同语言译本的数量，介绍了《论语》译本的现状。接着通过两个分号，引导三方面并列，分别论述不同译本翻译《论语》有不同的影响：有的客观介绍《论语》及孔子思想；有的翻译中寄托译者本人的使命意识；有的擅于解释和传播孔子思想，故文段旨在强调不同的译本都在为传播《论语》提供不同的角度，传递不同的内容，对应D项。\nA项，“三百多年的漫长历史”，对应文段首句，非重点，排除。\nB项，“英语国家”，非文段重点，文段意在强调不同的译本，而非英语国家，排除。\nC项，文段重点并非是通过不同的语言让世界知道了，而是通过不同的译本传递不同的内容，故“通过多种语言译介走向世界”，偏离文段中心，排除。\n故正确答案为D。\n【文段出处】人民日报《论语》译本谈","no":35,"missingImage":false},{"qid":"2452591","cat":"逻辑填空","stem":"法治是社会治理的基本规则，尤其是在全面依法治国新时代，任何人不管在线上还是线下，都应遵守法律秩序。任何人都必须在法律和道德的        内对网络话语权“轻拿轻放”，用谨言慎行守护            的网络空间和人间正道。\n依次填入画横线处最恰当的一项是：","options":{"A":"原则  纤毫毕现","B":"规则  正义凛然","C":"架构  波澜不惊","D":"框架  风清气正"},"answer":"D","explanation":"第一空，根据文意可知，横线处形容应在法律和道德的约束下对网络话语权“轻拿轻放”。C项“架构”指框架；D项“框架”比喻事物的组织、结构，均符合文意，保留。法律和道德本身就是一种原则、规则，故A项“原则”、B项“规则”与“法律和道德”搭配不当，排除A、B两项。\n第二空，横线处搭配“网络空间”，且根据“遵守法律秩序、谨言慎行、守护”可知，横线处应形容好的网络空间氛围。D项“风清气正”指讲道德、重操守、严纪律、不谋私、顾大局、淡名利、讲友爱、重团结、多奉献，符合文段语境，当选。C项“波澜不惊”比喻局面平静、形势平稳，没有什么变化或曲折，与文意无关，排除。\n故正确答案为D。\n【文段出处】《网络话语权应轻拿轻放》","no":36,"missingImage":false},{"qid":"2452661","cat":"逻辑填空","stem":"“创新乡贤文化”确实有助于以乡情乡愁为纽带，吸引和凝聚各方人士支持家乡建设。此乃      乡村现代化难题的有益尝试，这一点显然是            的。\n依次填入画横线处最恰当的一项是","options":{"A":"针对  显而易见","B":"缓解  举足轻重","C":"应对  弥足珍贵","D":"破解  毋庸置疑"},"answer":"D","explanation":"本题可从第二空入手，根据文段“确实有助于······支持家乡建设”说明“创新乡贤文化”对于解决现代化难题这一点是很确定的。D项“毋庸置疑”指事实确定明显，不必怀疑，符合文段语境，当选。A项“显而易见”指事情或道理很明显，极容易看清，与横线前“显然”语义重复，排除；B项“举足轻重”比喻所处地位非常重要，侧重强调重要性，与文段强调确定的语境不符，排除；C项“弥足珍贵”形容十分珍贵，侧重强调珍贵，与文段语境不符，排除。\n第一空，代入验证，“破解难题”为常见固定搭配，符合题意。\n故正确答案为D。\n【文段出处】《新乡贤文化建设中的传承与创新》","no":37,"missingImage":false},{"qid":"2452714","cat":"逻辑填空","stem":"他从不要求学生死记硬背，组织考试也            。考试通常采用开卷的方式，让学生把试卷带回去做。凡是提出自己见解的，即使是与他唱反调，只要能            ，往往也能得高分。\n依次填入画横线处最恰当的一项是","options":{"A":"特立独行  自成一体","B":"与众不同  自圆其说","C":"我行我素  言之凿凿","D":"剑走偏锋  义正词严"},"answer":"B","explanation":"第一空，横线对应后面让学生带回家开卷考试，体现和其他考试形式不一样，A项“特立独行”指特殊的，与众不同的，B项“与众不同”表示与其他人不一样，D项“剑走偏锋”形容不走常规，找一些新的、不同以往的办法来解决问题，均可，保留。C项“我行我素”指不管人家怎么说，仍旧按照自己平素的一套去做，感情色彩消极，文段并没有对他的行为进行批判，因此感情色彩不符，排除。\n第二空，横线前面论述“凡是提出自己见解的”，后面论述会得到高分，因此横线上也应体现出来学生自己提出观点是正确的，可以获得认可的，B项“自圆其说”指说话的人能使自己的论点或谎话没有漏洞，对应前面提出自己的观点，亦可对应后文得到高分的表述，当选；A项“自成一体”意为在书法、绘画等方面具有独创风格，能自成体系，对应不到学生的观点上，排除；D项“义正词严”形容理由正当充足，措词严正有力。文段要体现的是自己的观点，而非说的理由很充分，排除。\n故正确答案为B。\n【文段出处】《国学大师顾颉刚其人其事》","no":38,"missingImage":false},{"qid":"2452715","cat":"逻辑填空","stem":"国际组织亦称国际团体或国际机构，是具有国际性行为特征的组织，是两个或两个以上的国家（或其他国际法主体）为实现共同的政治经济目的，依据其      的条约或其他正式法律文件建立的有一定规章制度的      机构。\n依次填入画横线处最恰当的一项是","options":{"A":"缔结  常设性","B":"制订  长期性","C":"拟定  永久性","D":"起草  轮值性"},"answer":"A","explanation":"第一空，横线搭配“条约”，且和后文“正式法律文件”构成对应，体现出“正式”或“已确定”之意，A项“缔结”指订立，可搭配条约，能体现“正式”之意，符合文意，保留。B项“制订”指创制，拟定，C项“拟定”指草订，D项“起草”指打草稿，从立法修改的确定性来看，三者更侧重过程而非结果，排除。\n第二空验证，“常设性机构”，搭配恰当。\n故正确答案为A。","no":39,"missingImage":false},{"qid":"2452521","cat":"逻辑填空","stem":"多年宣传之后，垃圾分类真的要走入每个中国家庭的生活了。在这场与垃圾            的拉锯战中，中国是否能借助垃圾分类扭转局势，并通过利用自身的回收行业优势提升人们的环保意识，真正解决垃圾问题，避免重蹈发达国家的覆辙，我们            。\n依次填入画横线处最恰当的一项是：","options":{"A":"殚精竭虑  翘首以盼","B":"旷日持久  拭目以待","C":"分秒必争  整装待发","D":"势均力敌  胸有成竹"},"answer":"B","explanation":"第一空，由文段“拉锯战”可知，横线处词语表意为持续时间长或因双方实力不相上下而形成拉锯战，B项“旷日持久”指耗费时日，D项“势均力敌”形容双方势力相当、不分高下，均符合文意，保留；A项“殚精竭虑”形容用尽精力、费尽心思，与文意不符，排除；C项“分秒必争”形容抓紧时间，与文意不符，排除。\n第二空，由文段“是否能借助垃圾分类扭转局势”可知，横线处词语表意为要继续观察，B项“拭目以待”指擦亮眼睛等待着，形容殷切期望或等待某件事情的实现，符合文意，当选；D项“胸有成竹”比喻办事以前已有全面的设想和安排，与前文“是否”相悖，排除。\n故正确答案为B。\n【文段出处】《上海破局垃圾分类，能否避免成为下一个日本？》","no":40,"missingImage":false},{"qid":"2452522","cat":"逻辑填空","stem":"一个人走在森林里，膨胀的暖流扑面而来，仿佛热气从暖炉中        而出。随着森林的浓密稀疏，温热的空气或膨胀、或减弱。湿润的凉意令人感到河道的存在，它们虽早已        ，但泥土中仍        着湿气。\n依次填入画横线处最恰当的一项是：","options":{"A":"流泻  干涸  残存","B":"汹涌  断流  留存","C":"肆意  枯竭  保存","D":"奔腾  湮灭  残留"},"answer":"A","explanation":"本题可从第二空入手，所填词语修饰“河道”，A项“干涸”指河道、池塘等的水干枯；B项“断流”指枯水期河道中水流消失的现象；C项“枯竭”指水源、资源等干涸，断绝，均符合文意，保留。D项“湮灭”指埋没消灭，与“河道”搭配不当，排除。\n第三空，由“它们虽早已······”可知，此处的河道已经很长时间没有水了，因此泥土中的“湿气”也比较少，A项“残存”指残缺不全地存留下来，能够体现湿气不多，符合文意，保留。B项“留存”指保存，存放，C项“保存”指事物、性质、意义、作风等继续存在，不受损失或不发生变化，均无法体现“湿气”较少，排除。\n第一空，代入验证，A项“流泻”指迅速地流出、射出，可以与前文“膨胀的暖流扑面而来”构成对应，当选。\n故正确答案为A。\n【文段出处】《总有一些美好的事物在等着我们》","no":41,"missingImage":false},{"qid":"2452520","cat":"逻辑填空","stem":"回顾我国科技事业的发展，正是一代代航天人            、顽强拼搏，        了一系列关键核心技术，才有了中国航天大国的地位；正是因为        了深海装备的关键核心技术，才能使“蛟龙”“潜龙”“海龙”遨游深海，独立自主地进行科学考察，使中国在世界深海科学事业上拥有了发言权。\n依次填入画横线处最恰当的一项是：","options":{"A":"筚路蓝缕  攻克  突破","B":"锲而不舍  钻研  掌控","C":"披坚执锐  解决  攻陷","D":"身先士卒  破解  控制"},"answer":"A","explanation":"第一空，根据文段顿号可知，横线处与“顽强拼搏”构成并列，语义相近，应该体现出努力奋斗，坚持不懈的含义。A项“筚路蓝缕”形容创业的艰苦，B项“锲而不舍”比喻有恒心，有毅力，两者均符合题意，保留；C项“披坚执锐”指穿着铁甲，拿着武器，形容全副武装，D项“身先士卒”指作战时将领亲自带头，冲在士兵前面，比喻领导带头，走在群众前面，均无法与后文构成并列，排除C、D两项。 \n第二空，搭配“核心技术”，根据后文可知，横线处意为我国成功破解了核心技术，A项“攻克”指战胜，占领、胜利，符合题意，当选。B项“钻研”指深入研究，与文意不符，排除。\n第三空，代入验证，搭配“核心技术”。A项“突破”指打破，“突破核心技术”搭配恰当。\n故正确答案为A。\n【文段出处】《把关键核心技术掌握在自己手中》","no":42,"missingImage":false},{"qid":"2452526","cat":"逻辑填空","stem":"执法检查是人大行使宪法法律赋予的监督权，也是保证法律得到全面有效实施的一把“利剑”。既然是“利剑”，就必须锋利，而不是        、无关痛痒。有力度、有硬度的执法检查，才能        法律的权威。为什么有的执法检查所呈现的结果却与老百姓的切身感受        ？其中原因恐怕还在于执法检查没到位。\n依次填入画横线处最恰当的一项是：","options":{"A":"蜻蜓点水  彰显  大相径庭","B":"畏首畏尾  体现  千差万别","C":"畏葸不前  突显  南辕北辙","D":"声东击西  宣告  失之千里"},"answer":"A","explanation":"第一空，由顿号可知，所填成语需和“无关痛痒”构成并列，“无关痛痒”指与自身利害没有关系或无足轻重，用在此处表示法律的“利剑”没有起到应有的重要作用。A项“蜻蜓点水”比喻做事肤浅不深入，可以和“无关痛痒”构成并列，符合文意，保留。B项“畏首畏尾”比喻做事胆子小，顾虑多，C项“畏葸不前”指畏惧退缩，不敢前进，文段没有体现害怕、畏惧的意思，B、C两项均不符合文意，排除；D项“声东击西”指造成要攻打东边的声势，实际上却攻打西边，是使对方产生错觉以出奇制胜的一种战术，无法与“无关痛痒”构成并列，排除。锁定A项。\n第二空，代入验证，A项“彰显”指鲜明地显示，与“权威”搭配得当。\n第三空，代入验证，A项“大相径庭”比喻相差很远，大不相同，可以体现执法检查所产生的结果与老百姓的切身感受大不相同，符合文意。\n故正确答案为A。\n【文段出处】人民日报快评：《让执法检查长出“牙齿”》","no":43,"missingImage":false},{"qid":"2452530","cat":"逻辑填空","stem":"中国彩陶很注意图案纹样与器型的关系，        而统一协调，也注意彩陶图案在不同        所产生的不同效果，这种以彩绘纹样与造型        完美结合的艺术手法，同时也成为传统雕塑和工艺美术极有特色的表现手法。\n依次填入画横线处最恰当的一项是：","options":{"A":"交相辉映  角度  天衣无缝","B":"五彩缤纷  位置  错落有致","C":"千变万化  方向  有目共睹","D":"相辅相成  视角  浑然一体"},"answer":"D","explanation":"第一空，根据横线前文可知此处形容的是“中国彩陶图案纹样与器型的关系”，且根据后文“统一协调”、“完美结合的艺术手法”可知，横线处表达二者关系是相互配合的，D项“相辅相成”指相互补充，相互促成，置于文段体现出二者的关系是紧密的，符合文意，保留；A项“交相辉映”指各种光亮、色彩等相互映照，形容美好的景象；B项“五彩缤纷”形容色彩繁多艳丽；二者均不能形容图案纹样与器型之间的关系，排除；C项“千变万化”指变化无穷，文段并非有变化之意，与文意不符，排除，锁定D项。\n第二空，代入验证，“视角”指的是观察物体时不同的角度，置于文段体现出彩陶图案在不同的角度都有不同的效果，符合文意。\n第三空，代入验证，“浑然一体”指融合成为一个整体，也形容文章绘画布置匀整，多用于诗文、绘画等，置于文段符合艺术表现的语境，体现出纹样与造型的完美结合，符合语境。\n故正确答案为D。\n【文段出处】《新石器时代的彩绘陶，引导了中国美术的意象表现之路》","no":44,"missingImage":false},{"qid":"2452660","cat":"逻辑填空","stem":"每次去浯溪，除了看它的碑林和山水之外，最令我            的，是元结当年弹琴的浯台。那里是浯溪的最高点，每到月夜，元结总是执一把琴，坐在那里对江而弹。琴声激活了浯溪山水，浯溪山水        了他的琴声。元结与山水融合在一起，任千古忧愁万古功名顺琴声而去，随水而流，在虚无中        着沉重，在缥缈中偶尔跳出一声叹息。\n依次填入画横线处最恰当的项是：","options":{"A":"魂牵梦绕  涵养  夹杂","B":"心驰神往  滋养  错杂","C":"流连忘返  浸润  掺杂","D":"铭心刻骨  滋润  混杂"},"answer":"C","explanation":"第一空，搭配“浯台”。A项“魂牵梦绕”形容万分思念，B项“心驰神往”指心神飞到向往的地方，C项“流连忘返”指玩乐时留恋不愿离开，A、B、C三项均可搭配“浯台”，保留。D项“铭心刻骨”形容留下的印象极其深刻，永远忘不了，程度过重，排除。\n第二空，由前文分句“琴声激活了浯溪山水”可知，横线处形容浯溪山水和琴声之间的关系。A项“涵养”指涵育、滋润、养育，通常指在修身养性方面，也指道德、学问等方面的修养，无法形容浯溪山水和琴声之间的关系，排除。B项“滋养”指供给养分、补养；C项“浸润”指逐渐渗透、熏陶的意思，两项置于此处均可，保留。\n第三空，修饰“虚无”与“沉重”的关系。C项“掺杂”指混杂，填入文段表达琴声中带有沉重之感，语义恰当，当选。B项“错杂”指交错夹杂，侧重交错、杂乱，与文意不符，排除。\n故正确答案为C。\n【文段出处】《寂寞的浯溪》","no":45,"missingImage":false}]}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2452724","cat":"数学运算","stem":"-32.16，48.23，-72.30，108.37，-162.44，（    ）","options":{"A":"230.51","B":"230.62","C":"243.51","D":"243.62"},"answer":"C","explanation":"观察数列，有小数点，故考虑机械划分。以小数点为分隔符，小数点前是-32、48、-72、108、-162，构成公比为-1.5的等比数列，故原数列小数点前数字为\u003cimg data-k=\"196cd94f71ec\">；小数点后是16、23、30、37、44，构成公差为7的等差数列，故小数点后的数字为\u003cimg data-k=\"dd 的路程之比即为速度之比\u003cimg data-k=\"02ab1130ac62\">，则甲走了\u003cimg data-k=\"e7a0ed602418\">米，还剩\u003cimg data-k=\"baa3dadae21c\">米。\n故正确答案为D。","no":59,"missingImage":false},{"type":"question","qid":"2452573","cat":"数学运算","stem":"某便民超市将薏米、红豆和小黄米按2：3：5混合后出售，每千克成本13.3元。若薏米每千克成本23.6元，红豆每千克成本9.8元，则小黄米每千克的成本是","options":{"A":"10.36元","B":"10.18元","C":"11.45元","D":"11.28元"},"answer":"D","explanation":"假设混合后薏米2千克，红豆3千克、小黄米5千克。设小黄米每千克成本为\u003cimg data-k=\"5320a525f2bc\">元，则有\u003cimg data-k=\"55b27f768aad\">\u003cimg data-k=\"426526f00bff\">，解得\u003cimg data-k=\"b51c3c12f345\">。\n故正确答案为D。","no":60,"missingImage":false},{"type":"question","qid":"2452710","cat":"数学运算","stem":"某训练基地的一块三角形场地的面积是1920平方米。已知该三角形场地的三边长度之比是\u003cimg data-k=\"bd4571075cbc\">，则其周长是：","options":{"A":"218米","B":"240米","C":"306米","D":"360米"},"answer":"B","explanation":"已知三角形三边长度之比为\u003cimg data-k=\"4a4522cf572c\">，因\u003cimg data-k=\"9452301f7acd\">，说明此三角形为直角三角形。设此三角形三边长度分别为\u003cimg data-k=\"ef2475e00a74\">米，\u003cimg data-k=\"274ddd8e6913\">米，\u003cimg data-k=\"9774e21527c2\">米，则三角形面积\u003cimg data-k=\"cdf3ea3d4fda\">平方米，解得\u003cimg data-k=\"e57f8e5cd702\">，即\u003cimg data-k=\"7664acfff731\">。三角形周长为\u003cimg data-k=\"04bf805da460\">\u003cimg data-k=\"60fd5281079a\">米。\n故正确答案为B。","no":61,"missingImage":false},{"type":"question","qid":"2452598","cat":"数学运算","stem":"某单位要抽调若干人员下乡扶贫，小王、小李、小张都报了名，但因工作需要，若选小李或小张，就不能选小王。已知三人入选的概率都是0.2，但小李、小张同时入选的概率是0.1，则三人中有人入选的概率是","options":{"A":"0.3","B":"0.4","C":"0.5","D":"0.6"},"answer":"C","explanation":"根据题意“若选小李或小张，就不能选小王”，即小李或小张入选时，小王一定不入选，小王入选时，小李和小张都不入选。“三人中有人入选”有以下四种情况：\n①小李和小张同时入选，此时小王一定不入选：概率为0.1；\n②小李入选、小张不入选，此时小王一定不入选：当小李入选时有两类情况：小李单独入选和小李和小张共同入选，所以小李单独入选的概率为“小李入选的概率\u003cimg data-k=\"e752a8ae1a16\">小李和小张共同入选的概率”\u003cimg data-k=\"cbc8f6ecd0c7\">。\n③小张入选、小李不入选，此时小王一定不入选：当小张入选时有两类情况：小张单独入选和小李和小张共同入选，所以小张单独入选的概率为“小张入选的概率\u003cimg data-k=\"e752a8ae1a16\">小李和小张共同入选的概率”\u003cimg data-k=\"cbc8f6ecd0c7\">。\n④小李与小张都未入选，小王单独入选：概率为0.2。\n故“三人中有人入选” 的概率是\u003cimg data-k=\"d9f73c600658\">，对应C项。\n故正确答案为C。","no":62,"missingImage":false},{"type":"question","qid":"2452712","cat":"数学运算","stem":"下图为某市一段地下水管道的分布图，箭线表示管道中水的流向，数值表示箭线的长度(单位：千米)。水从S点流到T点最短的距离是：\n\u003cimg data-k=\"35f1379050cc\" style=\"max-width:434px\">","options":{"A":"20千米","B":"22千米","C":"23千米","D":"24千米"},"answer":"B","explanation":"\u003cimg data-k=\"6a9a13b01083\" style=\"max-width:437px\">\n\n求S点到T点的最短距离，可以先分两部分考虑，如图所示，即S点到A点，再由A点到T点。从S点到A点，共有4条路线，显然最短距离为\u003cimg data-k=\"cee493d761af\">千米，从A点到T点，共有2条路线，显然最短距离为\u003cimg data-k=\"49b4fca0dc58\">千米，此时最短距离为\u003cimg data-k=\"0d59da2f9672\">千米。虽然从S点出发不经过A点，也有其他路线到达T点，但均大于22千米，即水从S点流到T点最短的距离为22千米。\n故正确答案为B。","no":63,"missingImage":false},{"type":"question","qid":"2452596","cat":"数学运算","stem":"某企业按三个等级给员工发放奖金，一、二、三等奖的获奖人数之比为1：3：10，奖金总额之比为2：3：1。已知获奖员工总数126人，发放奖金总额16.2万元，则三等奖的奖金是","options":{"A":"250元","B":"300元","C":"350元","D":"400元"},"answer":"B","explanation":"设一、二、三等奖的获奖人数为\u003cimg data-k=\"f82036fad5c4\">、\u003cimg data-k=\"9bd3bf634e7d\">、\u003cimg data-k=\"5f9ede3381ef\">，因为“获奖员工总数126人”，即\u003cimg data-k=\"4d8747143a95\">，解得\u003cimg data-k=\"9777c7f68361\">，即一、二、三等奖的获奖人数分别为9、27、90人。设一、二、三等奖的奖金总额分别为\u003cimg data-k=\"757c328cd016\">、\u003cimg data-k=\"f384282eedc4\">、\u003cimg data-k=\"c1beececd683\">。因为“发放奖金总额16.2万元”，即\u003cimg data-k=\"8ed0d93a0901\">，解得\u003cimg data-k=\"680ce1024a8d\">元，即三等奖的奖金总额为27000元，故三等奖奖金为\u003cimg data-k=\"385f7d1e48c2\">元。\n故正确答案为B。","no":64,"missingImage":false}],"count":19,"answerable":19,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>在400米跑比赛中，罗、方、许、吕、田、石6人被分在一组。他们站在由内到外的1至6号赛道上。关于他们的位置，已知：\u003c/p>\u003cp>（1）田和石的赛道相邻；\u003c/p>\u003cp>（2）吕的赛道编号小于罗；\u003c/p>\u003cp>（3）田和罗之间隔着两条赛道；\u003c/p>\u003cp>（4）方的赛道编号小于吕，且中间隔着两条赛道。\u003c/p>","questions":[{"qid":"2452551","cat":"逻辑判断","stem":"根据以上陈述，关于田的位置，以下哪项是可能的？","options":{"A":"在3号赛道上","B":"在4号赛道上","C":"在5号赛道上","D":"在6号赛道上"},"answer":"A","explanation":"第一步：分析题干。\n（1）田和石的赛道相邻；\n（2）吕的赛道编号小于罗；\n（3）田和罗之间隔着两条赛道；\n（4）方的赛道编号小于吕，且中间隔着两条赛道。\n第二步：根据题干条件分析选项。\n提问方式为可能为真，因此，可以考虑代入法。\n代入A项，田在3号赛道上，根据条件（3）可知，罗只能在6号赛道上；根据条件（2）（4）可知吕可能在4号或5号赛道上。如果吕在4号赛道上，则方在1号赛道上，根据条件（1）此时石只能在2号，此时满足题干所有要求，所以A项就是可能的，当选；\n代入B项，田在4号赛道上，根据条件（3）可知，罗只能在1号赛道上，则吕的赛道编号不可能小于罗，与题干条件（2）矛盾，排除；\n代入C项，田在5号赛道上，根据条件（3）可知，罗只能在2号赛道上，题干条件（2），吕只能在1赛道上，此时方的赛道编号不可能小于吕，与题干条件（4）矛盾，排除；\n代入D项，田在6号赛道上，根据条件（3）可知，罗只能在3号赛道上，根据条件（2）可知吕可能在1号或2号赛道上，此时方的赛道不可能小于吕的同时隔着两条赛道，与题干条件（4）矛盾，排除。\n故正确答案为A。","no":65,"missingImage":false},{"qid":"2452559","cat":"逻辑判断","stem":"根据以上陈述，可以推出以下哪项？","options":{"A":"许和石的赛道相邻","B":"许和石之间隔着一条赛道","C":"许和石之间隔着两条赛道","D":"许和石之间隔着三条赛道"},"answer":"C","explanation":"第一步：分析题干。\n（1）田和石的赛道相邻；\n（2）吕的赛道编号小于罗；\n（3）田和罗之间隔着两条赛道；\n（4）方的赛道编号小于吕，且中间隔着两条赛道。\n第二步：根据题干条件分析选项。\n由条件（2）可知：\u003cimg data-k=\"3796ca571a26\">\n由条件（4）可知：\u003cimg data-k=\"414e24ee1c0c\">\n以上二者可知，\u003cimg data-k=\"08a1c650b9ad\">，则方、吕、罗的赛道排列只有以下三种可能：\n\u003cimg data-k=\"a0a43d98375f\" style=\"max-width:559px\">\n如果是情况一，根据条件（1）（3），田、石分别在2号、3号赛道，许只能在6号赛道；\n\u003cimg data-k=\"5bae4b30c7b6\" style=\"max-width:562px\">\n如果是情况二，根据条件（1）（3），田、石分别在3号、2号赛道，许只能在5号赛道；\n\u003cimg data-k=\"6bc16c4414fa\" style=\"max-width:563px\">\n如果是情况三，根据条件（1）（3），田、石分别在3号、4号赛道，许只能在1号赛道；\n\u003cimg data-k=\"d4535e6a1b65\" style=\"max-width:559px\">\n无论哪种情况，许和石之间都是隔着两条赛道，对应C选项。\n故正确答案为C。","no":66,"missingImage":false},{"qid":"2452542","cat":"类比推理","stem":"唇亡：齿寒","options":{"A":"安居：乐业","B":"纲举：目张","C":"开卷：有益","D":"惩前：毖后"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“唇亡”指嘴唇没有了，“齿寒”指牙齿就会寒冷，即因为“唇亡”，所以“齿寒”，二者为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“安居”指安定的住在一起，“乐业”指愉快地从事自己的职业，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：“纲举”指提起鱼网上面的总绳，“目张”指一个个网眼都张开，即提起大绳子来，就能让一个个网眼张开了。因为“纲举”，所以“目张”，二者为因果对应关系，与题干逻辑关系一致，当选；\nC项：“开卷”指打开书本读书，“有益”指有好处有收获，指的是读书总会有好处的。题干是两件事情之间的因果关系，而C项只有读书一件事，有益是读书本身的效果，二者不是因果关系，与题干逻辑关系不一致，排除；\nD项：“惩前”指警戒之前犯的错误，“毖后”指以后谨慎，不致再犯，“惩前”的目的是“毖后”，二者是方式目的对应，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":67,"missingImage":false},{"qid":"2452546","cat":"类比推理","stem":"湄公河：跨境河","options":{"A":"黄鹤楼：吊脚楼","B":"青海湖：内陆湖","C":"英国人：西欧人","D":"中山门：凯旋门"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“湄公河”是亚洲最重要的跨国水系，因此“湄公河”是“跨境河”，且“湄公河”是“跨境河”中的一个，二者为包容关系中的特指。\n第二步：判断选项词语间逻辑关系。\nA项：“吊脚楼”为苗族（重庆、贵州等）、壮族、布依族、侗族、水族、土家族等族的传统民居，“黄鹤楼”是武汉标志性建筑，是名胜，因此“黄鹤楼”不是“吊脚楼”，与题干逻辑关系不一致，排除；\nB项：“青海湖”是中国最大的“内陆湖”，因此“青海湖”是“内陆湖”，且“青海湖”是“内陆湖”中的一个，二者为包容关系中的特指，与题干逻辑关系一致，当选；\nC项：“英国人”是“西欧人”，但英国人是一种统称，有很多英国人，二者不是包容关系中的特指，与题干逻辑关系不一致，排除；\nD项：“中山门”和“凯旋门”为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":68,"missingImage":false},{"qid":"2452683","cat":"类比推理","stem":"裙子：毛料裙子：时装","options":{"A":"酒精：食用酒精：粮食","B":"手机：5G手机：通讯","C":"包子：肉馅包子：蒸笼","D":"小说：历史小说：名著"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n毛料裙子是裙子的一种，二者是种属关系，毛料裙子是从原材料角度区分的服装，时装是从流行程度上区分的服装，二者是交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：食用酒精是酒精的一种，二者是种属关系，粮食经过发酵可以变成食用酒精，二者是原材料对应，与题干逻辑关系不一致，排除；\nB项：5G手机是手机的一种，二者是种属关系，通讯是手机的功能，与题干逻辑关系不一致，排除；\nC项：肉馅包子是包子的一种，二者是种属关系，蒸笼是蒸包子时需要用到的工具，与题干逻辑关系不一致，排除；\nD项：历史小说是小说的一种，二者是种属关系，历史小说是按照创作的题材来划分作品，名著是从知名程度来区分的作品，二者是交叉关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":69,"missingImage":false},{"qid":"2452685","cat":"类比推理","stem":"春节：饺子：饺皮","options":{"A":"中秋节：月饼：蛋黄","B":"清明节：青团：青艾","C":"端午节：粽子：粽叶","D":"元宵节：酒酿：糯米"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n饺皮是饺子的组成部分，二者是组成关系，且饺皮是饺子的最外层；春节会吃饺子，是传统节日和习俗的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：蛋黄可以作为月饼的馅，二者是组成关系，但蛋黄是包在月饼的里层，并不是在月饼的最外层，与题干逻辑关系不一致，排除；\nB项：由青艾磨汁加入糯米粉制作青团，青艾汁是制作青团的原材料，二者是原材料对应，与题干逻辑关系不一致，排除；\nC项：粽叶是粽子的组成部分，二者是组成关系，粽叶是粽子的最外层；端午节会吃粽子，是传统节日和习俗的对应关系，与题干逻辑关系一致，当选；\nD项：糯米是制作酒酿的原材料，二者是原材料对应，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":70,"missingImage":false},{"qid":"2452686","cat":"类比推理","stem":"暴雨：洪灾：排涝","options":{"A":"炎热：干旱：减产","B":"假日：拥堵：疏导","C":"路滑：摔倒：骨折","D":"地震：伤亡：救助"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n暴雨可能会导致洪灾，二者是因果对应，且暴雨是自然灾害；排涝是解决洪灾的方式，二者是方式对应。\n第二步：判断选项词语间逻辑关系。\nA项：炎热可能会导致干旱，二者是因果对应；干旱可能会导致减产，二者是因果对应，与题干逻辑关系不一致，排除；\nB项：假日可能会导致拥堵，二者是因果对应，但是概率很小，且假日也不是自然灾害，与题干逻辑关系不一致，排除；\nC项：路滑可能会让人摔倒，二者是因果对应；摔倒可能会导致骨折，二者是因果对应，与题干逻辑关系不一致，排除；\nD项：地震可能会导致伤亡，二者是因果对应，且地震是自然灾害；救助是解决地震伤亡的方式，二者是方式对应，与题干逻辑关系一致，当选。\n故正确答案为D。","no":71,"missingImage":false},{"qid":"2452687","cat":"类比推理","stem":"开车不喝酒：喝酒不开车","options":{"A":"家是最小国：国是千万家","B":"不到长城非好汉：唯有好汉到长城","C":"你好我好大家好：大家好了你我好","D":"真金不怕火炼：怕火炼的不是真金"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n不喝酒（B）是开车（A）的必要条件，喝酒（\u003cimg data-k=\"e752a8ae1a16\">B）是不开车（\u003cimg data-k=\"e752a8ae1a16\">A）的充分条件 。\n第二步：判断选项词语间逻辑关系。\nA项：最小国（B）是家（A）的必要条件，国（B）是千万家（A）的充分条件，与题干逻辑关系不一致，排除；\nB项：到长城（B）是好汉（A）的必要条件，到长城（B）是好汉（A）的充分条件，与题干逻辑关系不一致，排除；\nC项：大家好（B）是你好我好（A）的必要条件，大家好（B）是你好我好（A）的充分条件，与题干逻辑关系不一致，排除；\nD项：不怕火炼（B）是真金（A）的必要条件，怕火炼（\u003cimg data-k=\"e752a8ae1a16\">B）是不是真金（\u003cimg data-k=\"e752a8ae1a16\">A）的充分条件，与题干逻辑关系一致，当选。\n故正确答案为D。","no":72,"missingImage":false},{"qid":"2452688","cat":"类比推理","stem":"裤子 之于（    ）相当于（    ）之于 笔画","options":{"A":"剪刀——色彩","B":"秋裤——画笔","C":"布料——汉字","D":"裁缝——书家"},"answer":"C","explanation":"逐一代入选项。\nA项：剪刀是制作裤子需要的工具，二者是对应关系，色彩和笔画没有必然联系，前后逻辑关系不一致，排除；\nB项：秋裤是裤子，二者是种属关系，画笔可以写出笔画，二者为对应关系，前后逻辑关系不一致，排除；\nC项：裤子是由布料组成的，二者是组成关系，汉字也是由笔画组成的，二者是组成关系，前后逻辑关系一致，当选；\nD项：裁缝制作裤子，二者为主宾关系，书家书写笔画，二者也为主宾关系，但顺序反了，前后逻辑关系不一致，排除。\n故正确答案为C。","no":73,"missingImage":false},{"qid":"2452684","cat":"类比推理","stem":"（    ）之于 实事求是 相当于 南辕北辙 之于 （    ）。","options":{"A":"按图索骥——方枘圆凿","B":"上下求索——守株待兔","C":"刻舟求剑——声东击西","D":"量体裁衣——背道而驰"},"answer":"D","explanation":"逐一代入选项。\nA项：按图索骥比喻按照线索去寻找；实事求是是指从实际情况出发，不夸大，不缩小，正确地对待和处理问题，二者没有必然联系，南辕北辙指的是心想往南而车子却向北行，比喻行动和目的正好相反；方枘圆凿比喻格格不入、不相容、不适宜，二者没有必然联系，前后逻辑关系不一致，排除；\nB项：上下求索比喻百折不挠，不遗余力地去追求和探索；实事求是是指从实际情况出发，不夸大，不缩小，正确地对待和处理问题，二者没有必然联系，南辕北辙指的是心想往南而车子却向北行，比喻行动和目的正好相反；守株待兔指希望不经过努力而得到成功的侥幸心理，比喻死守狭隘经验，不知变通，二者没有必然联系，前后逻辑关系不一致，排除；\nC项：刻舟求剑比喻办事刻板，没有发展的眼光；实事求是是指从实际情况出发，不夸大，不缩小，正确地对待和处理问题，二者没有必然联系，南辕北辙指的是心想往南而车子却向北行，比喻行动和目的正好相反；声东击西指造成要攻打东边的声势，实际上却攻打西边，二者没有必然联系，前后逻辑关系不一致，排除；\nD项：量体裁衣本义是按照身材尺寸裁剪衣服，比喻做事从实际情况出发；实事求是是指从实际情况出发，不夸大，不缩小，正确地对待和处理问题，二者为近义关系，南辕北辙指的是心想往南而车子却向北行，比喻行动和目的正好相反；背道而驰比喻行动方向和所要达到的目标完全相反，二者为近义关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":74,"missingImage":false},{"qid":"2452701","cat":"类比推理","stem":"请从四个选项中选出恰当的一项，其特征或规律与题干给出的一串符号的特征或规律最为相符。\n\u003cimg data-k=\"53b2ef6788ec\">","options":{"A":"
