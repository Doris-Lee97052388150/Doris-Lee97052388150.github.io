它折叠而成？请把它找出来。\n\u003cimg data-k=\"bc29d92e332e\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"将题干展开图中的面依次标号，如下图：\n\u003cimg data-k=\"7429c0756209\" style=\"max-width:488px\">\nA项：选项由面c、e、f构成，题干中三个面的公共点（红色的点）引出面c和面f的两根线，选项中这三个面的公共点（红色的点）只引出面f的一根线，选项与题干不一致，排除；\n\u003cimg data-k=\"d541d664bd3d\" style=\"max-width:491px\">\nB项：选项由面b、c、d构成，以面b中两根线的交点（绿色的点）为起点在面b中顺时针画边，题干中边3挨着面a，选项中边3挨着面c，选项与题干不一致，排除；\n\u003cimg data-k=\"8538cbc02c4e\" style=\"max-width:488px\">\nC项：选项由面a、b、d构成，以面b中两根线的交点（绿色的点）为起点在面b中顺时针画边，题干中边3挨着面a的白三角，选项中边3挨着面a的黑三角，选项与题干不一致，排除；\n\u003cimg data-k=\"b265c2a1de3e\" style=\"max-width:503px\">\nD项：选项与题干一致，当选。\n故正确答案为D。","no":87,"missingImage":false},{"qid":"2452692","cat":"图形推理","stem":"下面给定的是纸盒外表面的展开图，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"d9939e9f4089\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"将原展开图标上序号如下图，逐一进行分析。\n\u003cimg data-k=\"26a2b1e223a4\" style=\"max-width:700px\">\nA项：选项出现了面a和面d，面e，而面a和面d为相对面，不能同时出现，选项与题干不一致，排除；\nB项：选项出现了面c，面d，面e，选项与题干一致，当选；\nC项：选项出现了面b，面c，面f，而面c和面f为相对面，不能同时出现，选项与题干不一致，排除；\nD项：选项出现了面b，面d，面f，以面b为唯一面，以面b和面d的公共边为唯一边（如图中绿线所示）。在展开图和选项的面b上，以唯一边为起始边，沿着顺时针方向同时进行画边，展开图中边2所对的面为面c，选项中边2所对的面不是面c，选项与题干不一致，排除。\n故正确答案为B。","no":88,"missingImage":false},{"qid":"2452625","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"e42490bd6468\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查图形的实际意义，寻找最大共同点。九宫格优先横行看，观察发现，题干每行图片均为奶牛，第一行中奶牛头部的朝向左右交替，且奶牛身上的花纹相同，第二行也为此规律，故第三行运用规律，前两幅图奶牛的头部朝向分别为右、左，故问号处图形的奶牛头部应朝右，排除A、C项，B项奶牛身上的花纹与前两幅图不同，排除。\n故正确答案为D。","no":89,"missingImage":false},{"qid":"2452693","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"09ef4a9eea03\" style=\"max-width:358px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成相似，优先考虑样式规律，且相同线条重复出现，故考虑样式规律中的加减同异。九宫格优先看横行，第一行中，图1逆时针旋转90˚，外框保留，内部元素与图2求异得到图3；经验证，第二行也满足此规律；第三行，应用此规律，选择一个图1逆时针旋转90˚，外框保留，内部元素与图2求异得到的图形，因此“？”处应该选择A项。\n故正确答案为A。","no":90,"missingImage":false},{"qid":"2452532","cat":"图形推理","stem":"左图为给定的立体，从任意角度剖开，右边哪一项不可能是它的截面图？\n\u003cimg data-k=\"ca376c289ca9\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查截面图，逐一分析选项。\n\u003cimg data-k=\"ae3602f606fc\" style=\"max-width:400px\">\nA项：无法切出。\nB项：从图形正上方切入，垂直向下切即可得到，排除；\nC项：从图形六面体棱上切入，斜切，保证三条边等长，即可得到，排除；\nD项：从图形六面体棱上切入，斜切，保证两条边等长，即可得到，排除。\n本题为选非题，故正确答案为A。\n注：A项截面中椭圆和长方形的中心可能存在重合的情况，但无法确定椭圆和长方形的大小比例、椭圆与长方形框的距离比例、椭圆和长方形的中心重合等是否可以同时满足，而BCD三个选项可以确定能够截出，故粉笔答案定为A项。","no":91,"missingImage":false},{"qid":"2452541","cat":"逻辑判断","stem":"党内存在的很多问题都同政治问题相关联。不从政治上认识问题、解决问题，就会陷入头痛医头、脚痛医脚的被动局面，就无法从根本上解决问题。提高政治能力，很重要的一条就是要善于从政治上分析问题、解决问题。只有从政治上分析问题才能看清本质，只有从政治上解决问题才能抓住根本。\n根据以上陈述，可以得出以下哪项？","options":{"A":"只有从政治上认识问题、解决问题，才能从根本上解决问题","B":"如果善于从政治上分析问题、解决问题，就能提高政治能力","C":"一旦陷入头痛医头、脚痛医脚的被动局面，就无法从根本上解决问题","D":"如果没有看清本质、抓住根本，说明没有从政治上分析问题、解决问题"},"answer":"A","explanation":"第一步：翻译题干。\n①\u003cimg data-k=\"e752a8ae1a16\">（政治上认识问题、解决问题）\u003cimg data-k=\"2dfb7d1f72f3\">陷入头痛医头、脚痛医脚的被动局面\n②\u003cimg data-k=\"e752a8ae1a16\">（政治上认识问题、解决问题）\u003cimg data-k=\"a3a13b026980\">根本上解决问题\n③提高政治能力\u003cimg data-k=\"2dfb7d1f72f3\">善于从政治上分析问题、解决问题\n④看清本质\u003cimg data-k=\"2dfb7d1f72f3\">政治上分析问题\n⑤抓住根本\u003cimg data-k=\"2dfb7d1f72f3\">政治上解决问题\n第二步：逐一分析选项。\nA项：翻译为根本上解决问题\u003cimg data-k=\"2dfb7d1f72f3\">政治上认识问题、解决问题，是对②的否后，否后必否前，可以推出，当选；\nB项：翻译为善于从政治上分析问题、解决问题\u003cimg data-k=\"2dfb7d1f72f3\">提高政治能力，是对③的肯后，肯后得不到确定结论，无法推出，排除；\nC项：翻译为陷入头痛医头、脚痛医脚的被动局面\u003cimg data-k=\"a3a13b026980\">根本上解决问题，是对①的肯后，肯后得不到确定结论，无法和②中的“根本上解决问题”串在一起，无法推出，排除；\nD项：翻译为\u003cimg data-k=\"e752a8ae1a16\">（看清本质、抓准根本）\u003cimg data-k=\"a3a13b026980\">（政治上分析问题、解决问题），是对④、⑤的否前，否前得不到确定结论，无法推出，排除。\n故正确答案为A。","no":92,"missingImage":false},{"qid":"2452723","cat":"逻辑判断","stem":"为了研究早餐前锻炼和早餐后锻炼对健康的影响，研究人员进行了连续8周的实验，其中，实验组在早餐前锻炼，对照组在早餐后锻炼。结果发现，实验组锻炼过程中平均燃烧的脂肪量是对照组的2倍。体检结果进一步显示，实验组胰岛素反应能力得到了改善，而对照组没有。研究人员由此认为，相较于早餐后锻炼，早餐前锻炼更能降低罹患心血管疾病的风险。\n以下哪项如果为真，最能支持上述研究人员的观点？","options":{"A":"胰岛素反应能力强能有效稳定人体的血糖含量","B":"脂肪量过高是罹患心血管疾病的主要原因","C":"饱食状态下锻炼常常会引起胃穿孔等意外","D":"实验对象都是已经患有心血管疾病的个体"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：相较于早餐后锻炼，早餐前锻炼更能降低罹患心血管疾病的风险。\n论据：实验组（即早餐前锻炼）锻炼过程中的平均燃烧的脂肪量是对照组（即早餐后锻炼）的2倍。实验组胰岛素反应能力得到了改善，而对照组没有。\n论点强调的是早餐前锻炼和降低患心血管疾病风险之间的关系。论据说的是早餐前锻炼和脂肪量降低、胰岛素反应能力改善之间的关系。论点论据话题不一致，优先考虑搭桥。\n第二步：逐一分析选项。\nA项：论点说的是可以降低罹患心血管疾病的风险，该项说的是能有效稳定血糖含量，而血糖含量和心血管疾病之间是否存在必然关系并不确定，无法加强，排除；\nB项：脂肪量过高是罹患心血管疾病的主要原因，所以脂肪量燃烧得多，患心血管疾病的风险就降低，在脂肪量和心血管疾病之间建立起联系，属于搭桥项，可以加强，当选；\nC项：论点说的是早餐前锻炼和降低心血管疾病风险的关系，该项说的是餐后锻炼可能产生的问题，话题不一致，无法加强，排除；\nD项：论点说的是降低罹患心血管疾病的风险，即减少得病的概率，该项说的是所有实验对象都已经患有心血管疾病，与题干论点无关，无法加强，排除。\n故正确答案为B。","no":93,"missingImage":false},{"qid":"2452550","cat":"逻辑判断","stem":"每个“熊孩子”的背后都有一个“熊家长”。这些“熊家长”对“熊孩子”百依百顺，溺爱娇惯，这使得“熊孩子”以自我为中心，缺乏规则意识，容易产生过激的非理性行为。当“熊孩子”有些行为对他人和社会造成伤害时，“熊家长”也会以“他还是个孩子”来护短辩解，要求原谅。\n以下哪项最可能是“熊家长”辩解所隐含的前提？","options":{"A":"“熊孩子”犯错误不是故意为之","B":"只要是孩子就难免犯错","C":"“熊孩子”长大后会成为好孩子","D":"孩子犯错误应当被原谅"},"answer":"D","explanation":"第一步:找出论点和论据。\n论点:“熊家长”要求原谅“熊孩子”。\n论据:“熊家长”以“他还是个孩子”来护短辩解。\n题干中论点说的是要求他人原谅“熊孩子”，论据说的是“熊孩子”还是个孩子，论点论据话题不一致，因此考虑在“原谅”和“孩子”之间搭桥。\n第二步:逐一分析选项。\nA项：该项说的是犯错误不是故意为之，与“被原谅”无必然关系，不能加强，排除；\nB项：该项说的是孩子就难免犯错，与“被原谅”无必然关系，不能加强，排除；\nC项：该项说的是孩子长大后会成为好孩子，与“被原谅”无必然关系，不能加强，排除；\nD项：在“原谅”和“孩子”之间搭桥，为搭桥项，是家长辩解的前提，可以加强，当选。\n故正确答案为D。","no":94,"missingImage":false},{"qid":"2452725","cat":"逻辑判断","stem":"市民文化周期间，文化部门要在桃源、东山、南浦、九华四个社区分别举办书展、画展、影展和文博展四种不同的文化惠民活动，由于时间场地限制，每个社区只能举办一种活动。已知：\n（1）桃源社区既不办影展，也不办画展；\n（2）东山社区既不办书展，也不办画展；\n（3）如果东山社区不办画展，则南浦社区不办书展；\n（4）如果九华社区不办文博展，则南浦社区举办书展。\n据此可以推出以下哪项？","options":{"A":"东山社区有可能举办文博展","B":"画展不可能在南浦社区举办","C":"九华社区既没办影展，也没办画展","D":"书展要么是南浦社区办，要么是九华社区办"},"answer":"C","explanation":"第一步：翻译题干。\n要求为每个社区只能举办一种活动；\n\u003cimg data-k=\"bad39755897c\">桃源社区\u003cimg data-k=\"8a927501c838\">影展 且\u003cimg data-k=\"8a927501c838\">画展\n\u003cimg data-k=\"9587cf4a0ff8\">东山社区\u003cimg data-k=\"8a927501c838\">书展 且\u003cimg data-k=\"8a927501c838\">画展\n\u003cimg data-k=\"23fd45eec3c4\">东山社区\u003cimg data-k=\"8a927501c838\">画展 \u003cimg data-k=\"7b6029b3bbde\"> 南浦社区\u003cimg data-k=\"8a927501c838\">书展\n\u003cimg data-k=\"f558333fed2a\">九华社区\u003cimg data-k=\"8a927501c838\">文博展 \u003cimg data-k=\"7b6029b3bbde\"> 南浦社区书展\n第二步：再推理。\n结合确定信息和最大信息，\u003cimg data-k=\"9587cf4a0ff8\">和\u003cimg data-k=\"23fd45eec3c4\">可知，东山社区不办画展，可知南浦社区不办书展。结合条件\u003cimg data-k=\"f558333fed2a\">，逆否等价规则，可得九华社区办文博展；又根据要求每个社区只能举办一种活动。所以可得：九华社区既没办影展，也没办画展。\n故正确答案为C。","no":95,"missingImage":false},{"qid":"2452560","cat":"逻辑判断","stem":"某部门新录用甲、乙、丙三名工作人员，他们各自的籍贯为江苏、安徽、浙江中的某个省。张红、李梅和王芹对他们的籍贯有如下猜测：\n张红：甲是浙江人，乙是安徽人，丙也是浙江人；\n李梅：甲是浙江人，乙是江苏人，丙不是江苏人；\n王芹：甲是江苏人，乙是浙江人，丙也是江苏人。\n已知，对甲、乙、丙的籍贯，上述三人均猜对1个，猜错2个。\n根据以上信息，以下哪项是可能的？","options":{"A":"甲是江苏人，乙是安徽人，丙是浙江人","B":"甲是浙江人，乙是江苏人，丙是江苏人","C":"甲是安徽人，乙是浙江人，丙是江苏人","D":"甲是江苏人，乙是安徽人，丙是安徽人"},"answer":"D","explanation":"题干条件不确定，优先采用代入法。\n将A项代入，张红所说的第一句话错误，后面两句正确，不符合题干要求“猜对1个，猜错2个”，排除；\n将B项代入，张红所说的第一句话正确，后面两句错误；李梅前两句正确，最后一句话错误，不符合题干要求“猜对1个，猜错2个”，排除；\n将C项代入，张红所说的三句话均错误，不符合题干要求“猜对1个，猜错2个”，排除；\n将D项代入，张红第二句话正确其余错误；李梅第三句话正确其余错误；王芹第一句话正确其余错误，符合题干要求，当选。\n故正确答案为D。","no":96,"missingImage":false},{"qid":"2452726","cat":"逻辑判断","stem":"某款策略类竞技游戏在所有时刻都有\u003cimg data-k=\"8f0a29fab4bc\">种可以选择的操作，并且是一种不完全信息的游戏——玩家通常看不到对手在做什么，因此就无法预测下一步操作。最近，某互联网公司开发了能够玩该款游戏的智能机器人AlphaStar，在一周内就获得了宗师等级，这意味着它在该地区九万多名玩家中排在前\u003cimg data-k=\"91e27bf314ad\">。游戏开发者据此断言，AlphaStar在游戏策略上已经和人类持平或者胜过人类了。\n以下哪项如果为真，最能支持上述游戏开发者的论断？","options":{"A":"AlphaStar的反应速度被限制在人类的反应水平","B":"AlphaStar在游戏中隐藏了自己是机器人的身份","C":"AlphaStar汇集了人工智能最新发展的成果和技术","D":"AlphaStar可以利用的支持决策的信息量远超人类"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：AlphaStar在游戏策略上已经和人类持平或者胜过人类了。\n论据：某互联网公司开发了能够玩该游戏的智能机器人AlphaStar，在一周内就获得了宗师等级，排名在该地区九万多名玩家中的前\u003cimg data-k=\"91e27bf314ad\">。\n论据说的是AlphaStar一周内获得等级高，论点说的是AlphaStar在游戏策略上已经和人类持平或者胜过人类了，话题一致，优先考虑补充论据。\n第二步：逐一分析选项。\nA项：反应速度被限制在人类的反应水平，排除了其他因素的干扰，从而说明AlphaStar在游戏策略上真的已经和人类持平或者胜过人类，可以加强，当选；\nB项：隐藏自己机器人的身份，与是否在游戏策略上已经和人类持平或者胜过人类无关，属于无关选项，排除；\nC项：只是说明它汇集了人工智能最新发展的成果和技术，但并不能支持他是否在游戏策略上已经和人类持平或者胜过人类，排除；\nD项：可以利用的支持决策的信息量远超人类，说明获胜也可能是因为本身信息量多，而不是仅仅是游戏策略强，削弱了论点中游戏策略导致获胜的结论，他因削弱，排除。\n故正确答案为A。\n附：通过查证原文，本题答案为A项。\n\u003cimg data-k=\"d311ca5ffb1d\" style=\"max-width:700px\">","no":97,"missingImage":false},{"qid":"2452555","cat":"逻辑判断","stem":"张、王、李、赵四人计划在6至9月中分别选择一个月休年假，但部门人手短缺，一个月中不能有两个人休假。赵不希望安排在6月，张要求不要安排在9月，李表示6月或8月都可以，王提出只能安排在7、8月份。\n如四人的要求均得到满足，则可以推出以下哪项？","options":{"A":"张只能安排在6月或者7月","B":"只要李不在6月，王一定会在7月","C":"如果李安排在8月，那么张安排在7月","D":"如果王安排在7月，那么李安排在6月"},"answer":"B","explanation":"本题信息较多，可考虑列表。\n整理题干信息如下：\n（1）一个月中不能有两个人休假；\n（2）赵不在6月；\n（3）张不在9月；\n（4）李6月或8月；\n（5）王只在7月或8月。\n根据题干填入信息如下：\n\u003cimg data-k=\"c5fda11e835a\" style=\"max-width:386px\">\n所以由表格可知赵在9月份。其他信息不确定。所以考虑代入选项。\nA项：根据表格可以发现张可以安排在6月、7月和8月，故选项说法错误，排除；\nB项：如果李不安排在6月，此时6月、7月和9月都不安排李，故李只能在8月，那么王一定会在7月，该项说法正确，当选；\nC项：如果李安排在8月，那么王在7月，此时张只能安排在6月，选项说法错误，排除；\nD项：如果王安排在7月，即张、李、赵都不能安排在7月，但此时李可以在6月也可以在8月，故该项选项错误，排除。\n故正确答案为B。","no":98,"missingImage":false},{"qid":"2452547","cat":"逻辑判断","stem":"人类学家测量了历史上各个时期的人类头骨之后发现，当代成人的脑容量平均为1349毫升，相比中石器时代人类的脑容量，男性减少了\u003cimg data-k=\"fc324c3b9ecb\">，女性减少了\u003cimg data-k=\"b579423d43a8\">。研究者认为，在分工日益明确的时代，富有合作精神的人比其他人有更多的生存和繁衍机会，“最友好者生存”是导致人类大脑不断缩小的重要原因。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"当代脑科学研究表明，脑容量更小会使得人类更富有合作精神","B":"合作会减少人类的攻击性，而攻击性的减少会使人身体变轻、脑容量减少","C":"随着气温的升高，人们对体重的要求降低，身体的缩小必然带来大脑的缩小","D":"外部信息存储介质的出现减轻了大脑的记忆负担，人类的大脑随之缩小"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：在分工日益明确的年代，富有合作精神的人比其他人有更多的生存和繁衍机会，“最友好者生存”是导致人类大脑不断缩小的重要原因。\n论据:无。\n本题只有论点没有论据，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：选项说的是脑容量更小让人更具有合作精神，而论点说的是合作会导致人类大脑不断缩小，该项颠倒了论点中的因果，因果倒置，无法加强，排除；\nB项：选项说的是合作会减少攻击性，从而使脑容量减少，解释了为什么合作会导致人类大脑不断缩小，补充论据，可以加强，当选；\nC项：选项说的是身体的缩小会让大脑缩小，而论点指出合作是导致大脑缩小的重要原因，身体的缩小与合作是否为重要原因无关，无法加强，排除；\nD项：选项说的是外部存储介质会让大脑缩小，而论点指出合作是导致大脑缩小的重要原因，外部存储介质与合作是否为重要原因无关，无法加强，排除；\n故正确答案为B。","no":99,"missingImage":false},{"qid":"2452597","cat":"定义判断","stem":"造血式扶贫：指政府部门或社会力量通过持续性地扶持农村产业发展，拓宽农产品销售及消费渠道等，帮助贫困地区、贫困人口增收脱贫的扶贫方式。\n下列属于造血式扶贫的是","options":{"A":"某县按照“东部林果、旅游，西部设施农业”的整体思路，一直坚持“\u003cimg data-k=\"e77e2e63bd01\">”的产业发展模式，使农民年收入翻了一番，人均达到近万元","B":"某县扶贫办组织了200多名山区农民，经过严格培训，输送到东南沿海城市工作。这些农民每月都按时寄钱回家，家里的日子越过越红火","C":"县农科所资助某村贫困家庭100头种羊，多次对他们进行科学养羊技术培训，并安排技术人员进行“一对一”的专业指导","D":"为了解决全村苹果严重滞销的问题，村里的几个年轻人共同开办了一个水果直销网店。不到半月时间，所有苹果就销售一空"},"answer":"A","explanation":"第一步：找出定义关键词。\n“政府部门或社会力量”、“持续性地扶持农村产业发展，拓宽农产品销售及消费渠道”、“帮助贫困地区、贫困人口增收脱贫”。\n第二步：逐一分析选项。\nA项：某县符合“政府部门或社会力量”，一直坚持“\u003cimg data-k=\"8be311259fef\">\u003cimg data-k=\"88b8dcd66a2b\">”的产业发展模式，符合“持续性地扶持农村产业发展，拓宽农产品销售及消费渠道”，使农民年收入翻了一番，人均达到近万元，符合“帮助贫困地区、贫困人口增收脱贫”，符合定义，当选；\nB项：某县扶贫办组织了200多名山区农民，经过严格培训，输送到东南沿海城市工作，不符合“持续性地扶持农村产业发展，拓宽农产品销售及消费渠道”，不符合定义，排除；\nC项：县农科所资助某村贫困家庭100头种羊，多次对他们进行科学养羊技术培训，不符合“持续性地扶持农村产业发展，拓宽农产品销售及消费渠道”，不符合定义，排除；\nD项：为了解决全村苹果严重滞销的问题，村里的几个年轻人共同开办了一个水果直销网店，不符合“政府部门或社会力量”，且没有提到贫困，不符合“帮助贫困地区、贫困人口增收脱贫”，不符合定义，排除。\n故正确答案为A。","no":100,"missingImage":false},{"qid":"2452602","cat":"定义判断","stem":"分众化教育：指根据受众的具体差异，用典型案例分别进行宣传，以激发情感共鸣，达成特定目标的教育方式。\n下列属于分众化教育的是","options":{"A":"某市组织全市技术创新能手分别深入到所在行业部门，分享自己的创新经验，极大地激发了各行各业人士的创新热情","B":"某地组织的“五一劳动奖章”获得者宣讲团多次进行巡回报告，他们的先进事迹深深地打动了前来听讲的市民","C":"每天傍晚，某学校附近地铁口都有艺术教育培训机构的招生人员散发传单，上面印着考入名校的学生彩照和成绩","D":"在“不忘初心、牢记使命”主题教育中，某区组织党员干部分系统观看专题纪录片《警钟长鸣》，取得了预期效果"},"answer":"A","explanation":"第一步：找出定义关键词。\n“根据受众的具体差异，用典型案例分别进行宣传”、“激发情感共鸣，达成特定目标”。\n第二步：逐一分析选项。\nA项：某市组织全市技术创新能手分别深入到所在行业部门，分享自己的创新经验，符合“根据受众的具体差异，用典型案例分别进行宣传”，极大地激发了各行各业人士的创新热情，符合“激发情感共鸣，达成特定目标”，符合定义，当选； \nB项：某地组织的“五一劳动奖章” 获得者宣讲团多次进行巡回报告，不符合“根据受众的具体差异，用典型案例分别进行宣传”，不符合定义，排除；\nC项：每天傍晚，某学校附近地铁口都有艺术教育培训机构的招生人员散发传单，不符合“根据受众的具体差异，用典型案例分别进行宣传”，不符合定义，排除；\nD项：某区组织党员干部分系统观看专题纪录片《警钟长鸣》，不符合“根据受众的具体差异，用典型案例分别进行宣传”，不符合定义，排除。\n故正确答案为A。","no":101,"missingImage":false},{"qid":"2452605","cat":"定义判断","stem":"喘息服务：指由政府部门购买服务，为有失能失智老人的低收入家庭或特殊困难家庭提供临时性援助，让常年在家照顾亲属者得到短暂休息。\n下列属于喘息服务的是","options":{"A":"由于儿女移居国外，年迈的赵先生夫妇只得相依为命，平时一起去市场买日常用品，一起去医院就诊取药。社区了解情况后，专门雇人每天上门半小时帮他们料理家务","B":"杨先生10多年前中风，老伴杜女士为了照料他，每天忙得团团转，连自己生病都没时间去医院。今年初，街道派护工不定期上门服务，让她能有时间到医院看病或稍事休息","C":"父亲去世后，年过六旬的张先生独自承担起了照顾精神病妹妹的重任，从来没有睡过一个安稳觉。不久前，老张专门请了一名钟点工照看妹妹，感觉轻松了许多","D":"患健忘症的陈奶奶经常独自出门闲逛，多次走失，靠低保维持生活的儿子无力照顾。区民政部门了解情况后，把陈奶奶送进养老院，并承担了所有费用"},"answer":"B","explanation":"第一步：找出定义关键词。\n“政府部门购买服务”、“为有失能失智老人的低收入家庭或特殊困难家庭提供临时性援助”、“让常年在家照顾亲属者得到短暂休息”。\n第二步：逐一分析选项。\nA项：由于儿女移居国外，社区专门雇人每天上门半小时帮年迈的赵先生夫妇料理家务，不符合“为有失能失智老人的低收入家庭或特殊困难家庭提供临时性援助”，也不符合“让常年在家照顾亲属者得到短暂休息”，不符合定义，排除；\nB项：杨先生10多年前中风，今年初街道派护工不定期上门服务，让杜女士能有时间到医院看病或稍事休息，符合“政府部门购买服务”、“为有失能失智老人的低收入家庭或特殊困难家庭提供临时性援助”、“让常年在家照顾亲属者得到短暂休息”，符合定义，当选；\nC项：老张专门请了一名钟点工照看妹妹，不符合“政府部门购买服务”，不符合定义，排除；\nD项：患健忘症的陈奶奶多次走失，区民政部门了解情况后，把陈奶奶送进养老院，并承担了所有费用，不符合“为有失能失智老人的低收入家庭或特殊困难家庭提供临时性援助”，不符合定义，排除。\n故正确答案为B。","no":102,"missingImage":false},{"qid":"2452617","cat":"定义判断","stem":"口述登记制：指办理个体工商户登记手续时，申请人无需亲自填表，只要口述各项信息，核对确认后即可当场领取营业执照的登记方式。\n下列属于口述登记制的是","options":{"A":"赵先生到市场监督管理部门办理个体户注册登记手续。在窗口人员指导下按照“申请-受理-核准”的步骤，半小时就办好了手续。第二天就拿到了自己的营业执照","B":"汪先生打算申请运动器材店营业执照。他从网上弄清了申请程序，第二天来到区市场监督管理部门登记处，简要地回答了几个问题，不一会儿营业执照就办好了","C":"程先生到市场监督管理部门办理花店营业执照。按照现场人员的指导填好表格，经办人员输入系统打印出信息登记表，程先生签名确认后就拿到了营业执照","D":"蔡先生到市场监督管理部门办理营业执照注销手续。在指定窗口完成自动身份识别后，回答了工作人员的询问，很快就办完了全部手续"},"answer":"B","explanation":"第一步：找出定义关键词。\n“办理个体工商户登记手续时”、“无需亲自填表”、“口述信息”、“核对后当场领取营业执照”。\n第二步：逐一分析选项。\nA项：赵先生在窗口人员的指导下按照“申请-受理-核准”的步骤，是本人亲自办理，但没有体现“口述信息”即可办理，而且，赵先生第二天拿到营业执照，不符合“核对后当场领取营业执照”，不符合定义，排除；\nB项：汪先生在区市场监督管理部门，回答几个问题符合“口述信息”，然后“不一会儿营业执照就办好了”，符合“核对后当场领取营业执照”，符合定义，当选；\nC项：程先生按照现场人员的指导填好表格，是本人亲自填表，不符合“无需亲自填表”，不符合定义，排除；\nD项：蔡先生办理营业执照注销手续，不符合“办理个体工商户登记手续”，不符合定义，排除。\n故正确答案为B。","no":103,"missingImage":false},{"qid":"2452619","cat":"定义判断","stem":"垃圾资源化：指垃圾进行分选处理后，成为无污染的循环再利用原料，进而加工、转化为再生资源的垃圾处理方式。\n下列属于垃圾资源化的是：","options":{"A":"某市为了缓解因煤炭资源过度开采造成的地面下陷问题，新建了一个大型垃圾场，经过分类后的城市生活垃圾每天都会运到这里集中填埋","B":"垃圾焚烧发电需要投入巨大资金，随着相关技术不断进步，电能产量越来越高，尽管排放问题还没有彻底解决，但它仍然是目前比较常见的城市垃圾处理方式","C":"乡村垃圾大多采用分类处理的方法：有回收价值的，挑选出来后稍加处理卖给需要的人，其他大部分卖到废品回收站点，无回收价值的，堆到指定地点","D":"某市正在推行新的垃圾处理方式：将厨余垃圾等有机物分离出来，制成有机肥料，将砖头瓦块、玻璃陶瓷等无机物分离出来，制成新型免烧砖"},"answer":"D","explanation":"第一步：找出定义关键词。\n“垃圾进行分选处理后”、“成为无污染的循环再利用原料”、“加工、转化为再生资源”。\n第二步：逐一分析选项。\nA项：新建垃圾场，将分类后的城市生活垃圾集中填埋，只是简单填埋，没有将垃圾转化为可循环的原料，不符合“成为无污染的循环再利用原料”、“加工、转化为再生资源”，不符合定义，排除；\nB项：垃圾焚烧发电是常见的垃圾处理方式，只是对垃圾进行焚烧，没有体现对垃圾的分类处理，不符合“垃圾进行分选处理后”，而且焚烧垃圾的排放问题没有彻底解决，不符合“成为无污染的循环再利用原料”，不符合定义，排除；\nC项：将有回收价值的垃圾卖掉，将无回收价值的垃圾堆放到指定地点，只涉及垃圾的回收和变卖，但没有体现出将垃圾转化成其他资源，不符合“加工、转化为再生资源”，不符合定义，排除；\nD项：将厨余垃圾等有机物分离出来，制成肥料，将无机物分离出来，制成免烧砖，符合“垃圾进行分选处理后”，而且将分选处理后的垃圾制成其他资源，符合“成为无污染的循环再利用原料”、“加工、转化为再生资源”，符合定义，当选。\n故正确答案为D。","no":104,"missingImage":false},{"qid":"2452621","cat":"定义判断","stem":"良性冲突：指管理者设法把企业内部的小冲突转化为凝聚力，推动企业发展的管理策略。\n下列属于良性冲突的是","options":{"A":"公司召开员工代表大会修订奖惩条例，与会者的意见出现了巨大分歧，大家争得面红耳赤，最后少数服从多数，通过了该条例的修订","B":"某企业面临着一项急需解决的技术难题，总经理提议谁能提出解决方案就可以担任项目主管并获得10万元重奖。这一提议遭到部分与会者的反对，最终未能通过","C":"徐先生和景先生是某公司的一对老搭档，在一些重大决策问题上经常意见相左，互不相让，最终却总能达成一致。在他们的领导下，公司业绩稳步提高","D":"市场部蒋经理听到销售员反映产品质量问题后，向质检部反馈意见，与生产部经理产生了矛盾。公司组织三个部门多次开会协调，最终建立了良好沟通机制"},"answer":"D","explanation":"第一步：找出定义关键词。\n“管理者”、“把企业内部小冲突转化为凝聚力”、“推动企业发展”。\n第二步：逐一分析选项。\nA项：与会者意见出现巨大分歧，不符合“企业内部小冲突”，不符合定义，排除； \nB项：提议遭到部分与会者反对，最终未能通过，不符合“将小冲突转化为凝聚力”，不符合定义，排除；\nC项：徐先生和景先生是老搭档，在重大决策问题上经常意见相左，不符合“企业内部小冲突”，不符合定义，排除；\nD项：市场部蒋经理与生产部经理产生矛盾，公司开会协调建立良好沟通机制，符合“将小冲突转化为凝聚力”，而且良好的沟通机制利于公司发展，符合“推动企业发展”，符合定义，当选。\n故正确答案为D。","no":105,"missingImage":false},{"qid":"2452564","cat":"定义判断","stem":"乡贤调解：指村民之间发生纠纷后，由具有较高威望和影响力的乡村贤达人士出面解决纠纷的民间调解方式。\n下列不属于乡贤调解的是","options":{"A":"老周与老马因借贷纠纷对簿公堂，法院受理后到村里开庭，并请了几位乡贤旁听，经过现场调解，双方达成谅解","B":"老肖年轻时走南闯北，见多识广，全村上上下下都很敬重他。张家的牛吃了李家的草，高家的水流进了齐家的房，村民只要找到他，问题一下就解决了","C":"老于从镇司法所退休回村后，用老百姓的“土办法”解决了蒋家婆媳不和的老大难问题。从此以后，村里一旦发生什么纠纷，大家都爱跑来请他去评理","D":"老张和邻居老李因为家门口的路闹得不可开交，把路堵死。家住村头的老支书过去调解，两人一见到他，火气就消了一大半，很快握手言好，开通了道路"},"answer":"A","explanation":"第一步：找出定义关键词。\n“村民之间发生纠纷后”、“较高威望和影响力的乡村贤达人士出面解决纠纷的民间调解方式”。\n第二步：逐一分析选项。\nA项：老周与老马因借贷纠纷对簿公堂，法院受理后到村里开庭，是法院作出调解，不符合“较高威望和影响力的乡村贤达人士出面解决纠纷的民间调解方式”，不符合定义，当选； \nB项：张家的牛吃了李家的草，高家的水流进了齐家的房，符合“村民之间发生纠纷后”，村民只要找到他，问题一下就解决了，符合“较高威望和影响力的乡村贤达人士出面解决纠纷的民间调解方式”，符合定义，排除；\nC项：用老百姓的“土办法”解决了蒋家婆媳不和的老大难问题，符合“村民之间发生纠纷后”、“较高威望和影响力的乡村贤达人士出面解决纠纷的民间调解方式”，符合定义，排除；\nD项：老张和邻居老李因为家门口的路闹得不可开交，符合“村民之间发生纠纷后”，家住村头的老支书过去调解，两人一见到他，火气就消了一大半，很快握手言好，开通了道路，符合“较高威望和影响力的乡村贤达人士出面解决纠纷的民间调解方式”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":106,"missingImage":false},{"qid":"2452567","cat":"定义判断","stem":"等待经济：指商家利用人们购物、就医、出行时的空余时间，提供选择自由、使用方便的付费服务。\n下列不属于等待经济的是","options":{"A":"某购物中心在顾客休息区设置了多台VR游戏机，顾客扫码付费即可操作","B":"某社区卫生服务中心添置了数台功能各异的按摩椅，供候诊患者刷卡使用","C":"某小区内新开设了一家无人超市，每到周末附近居民就喜欢到这里来购物","D":"某火车站在候车室内放置了数台自动售卖机，供旅客自主选购饮料、食品"},"answer":"C","explanation":"第一步：找出定义关键词。\n“商家利用人们购物、就医、出行时的空余时间”、“提供选择自由、使用方便的付费服务”。\n第二步：逐一分析选项。\nA项：某购物中心在顾客休息区设置了多台VR游戏机，顾客扫码付费即可操作，符合“商家利用人们购物、就医、出行时的空余时间”、“提供选择自由、使用方便的付费服务”，符合定义，排除；\nB项：某社区卫生服务中心添置了数台功能各异的按摩椅，供候诊患者刷卡使用，符合“商家利用人们购物、就医、出行时的空余时间”、“提供选择自由、使用方便的付费服务”，符合定义，排除；\nC项：某小区内新开设了一家无人超市，每到周末附近居民就喜欢到这里来购物，不符合“商家利用人们购物、就医、出行时的空余时间”、“提供选择自由、使用方便的付费服务”，不符合定义，当选；\nD项：某火车站在候车室内放置了数台自动售卖机，供旅客自主选购饮料、食品，符合“商家利用人们购物、就医、出行时的空余时间”、“提供选择自由、使用方便的付费服务”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":107,"missingImage":false},{"qid":"2452728","cat":"定义判断","stem":"银发危机：指老年人因为贪图小便宜而上当受骗，遭受财产损失和精神伤害双重打击的现象。\n下列属于银发危机的是","options":{"A":"小吴的父亲喜欢根据手机网站上文物鉴定专家的推荐收藏玉器，房子里到处都是他买来的“宝贝”，虽然小吴经常和他吵架，但他却不认为自己有错","B":"赵大妈家附近的商场举办促销活动，每天前200名的顾客免费送10个鸡蛋，昨天她把鸡蛋领回家后，发现手上的金戒指不见了，在家整整生了一天闷气","C":"在社区医院排队挂号时，一位“热心人”得知孙大妈有脑血管病，向她推荐了一种特效药，原价每瓶499元，只收她100元，她当场买了10瓶。回家后听女儿说这种药在正规药房只卖30元，她懊恼不已","D":"某企业在东方小区举行加湿器直销活动，李大妈在推销员劝说下买了一台，半月后才发现虽然货真价实，自家却完全用不上，她一气之下把它扔进地下室"},"answer":"C","explanation":"第一步：找出定义关键词。\n“老年人”、“因为贪图小便宜而上当受骗”、“遭受财产损失和精神伤害双重打击”。\n第二步：逐一分析选项。\nA项：小吴父亲购买玉器是出于喜爱，并非贪图小便宜，不符合“因为贪图小便宜而上当受骗”，不符合定义，排除；\nB项：赵大妈是在领取鸡蛋的过程中丢失了金戒指，并未上当受骗，不符合“因为贪图小便宜而上当受骗”，不符合定义，排除；\nC项：孙大妈被“热心人”的药价吸引而购买特效药，但该药价格高于正规药房的售价，符合“老年人”、“因为贪图小便宜而上当受骗”，回家后听女儿说完懊恼不已，符合“遭受财产损失和精神伤害双重打击”，符合定义，当选；\nD项：李大妈在推销员的劝说下买了一台加湿器，加湿器本身货真价实，不符合“因为贪图小便宜而上当受骗”，不符合定义，排除。\n故正确答案为C。","no":108,"missingImage":false},{"qid":"2452570","cat":"定义判断","stem":"信息污染：指信息传播过程中混入危害性、欺骗性或误导性信息元素，从而影响对有效信息的正常获取和利用的现象。\n下列属于信息污染的是","options":{"A":"心理学家让实验对象每天看几千张不同的照片，几天后，被试者大都出现头痛、失眠等现象，无法按要求描述相似照片的差别","B":"某牙科医院网站转载了某权威医学杂志的一篇科研论文，但在论文末尾的显著位置附上该医院相关产品的广告","C":"自从帮父母开通微信账号后，小张的微信朋友圈里每天都会看到父母转发的各种养生鸡汤和伪科学信息","D":"陈某在微博上转发某省森林火灾事故的新闻报导时，将五年前亚马孙雨林特大火灾的现场图片作为配图插入其中"},"answer":"D","explanation":"第一步：找出定义关键词。\n“信息传播过程中”、“混入危害性、欺骗性或误导性信息元素”、“影响对有效信息的正常获取和利用”。\n第二步：逐一分析选项。\nA项：心理学家让实验对象每天看几千张不同的照片，实验对象就是要看这些照片，未体现混入别的信息元素，不符合“混入危害性、欺骗性或误导性信息元素”，不符合定义，排除；\nB项：在论文末尾的显著位置附上该医院相关产品的广告，论文的内容本身没有发生改变，附上的广告并不影响读者对论文信息的获取，不符合“混入危害性、欺骗性或误导性信息元素”，不符合定义，排除；\nC项：小张的微信朋友圈里每天都会看到父母转发的各种养生鸡汤和伪科学信息，伪科学本身就是假的，不是混入了欺骗性信息，而是整个信息内容本身为假，不符合“混入危害性、欺骗性或误导性信息元素”，不符合定义，排除；\nD项：陈某在微博上转发某省森林火灾事故的新闻报道，符合“信息传播过程中”，将五年前亚马孙雨林特大火灾的现场图片作为配图插入其中，符合“混入危害性、欺骗性或误导性信息元素”、“影响对有效信息的正常获取和利用的现象”，符合定义，当选。\n故正确答案为D。","no":109,"missingImage":false},{"qid":"2452574","cat":"定义判断","stem":"痕迹管理：指按照相关部门要求，用文字或图片等材料记录、展示工作过程和业绩，作为绩效考核依据的监督管理手段。\n下列不属于痕迹管理的是","options":{"A":"李先生被派往分公司调研，每天忙得不亦乐乎：手机上装了多个工作APP，必须随时关注上边的各种信息，还得及时把现场工作照上传给公司领导","B":"某公司人力资源部门存储了大量的记录公司各项活动的文字影像资料，为每年的年终总结和工作汇报提供了足够的第一手材料","C":"按有关部门规定，申报项目时，除了填写申请书，还须以附件形式提供相应的图片、证书、文件等作为支撑材料，以供评审专家核查","D":"某窗帘公司要求安装人员为客户上门服务时，必须把测量、安装、调试、用户评价等每个环节拍成小视频，现场传给部门经理"},"answer":"C","explanation":"第一步：找出定义关键词。\n“用文字或图片等材料记录、展示工作过程和业绩”、“作为绩效考核依据的监督管理手段”。\n第二步：逐一分析选项。\nA项：李先生及时把现场工作照上传给工作公司领导，符合“用文字或图片等材料记录、展示工作过程和业绩”、“作为绩效考核依据的监督管理手段”，符合定义，排除；\nB项：人力资源部门存储了大量的记录公司活动的文字影像资料，符合“用文字或图片等材料记录、展示工作过程和业绩”、“作为绩效考核依据的监督管理手段”，符合定义，排除；\nC项：申报项目时的申请书以及图片、证书、文件等支撑材料只是为了让评审专家核查情况，不符合“作为绩效考核依据的监督管理手段”，不符合定义，当选；\nD项：窗帘安装人员传给部门经理的每个环节小视频，符合“用文字或图片等材料记录、展示工作过程和业绩”、“作为绩效考核依据的监督管理手段”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":110,"missingImage":false},{"qid":"2452698","cat":"定义判断","stem":"社交恐惧症：指公众场合或正常社交活动中，因为过分担心、害怕而刻意回避的心理现象。\n下列属于社交恐惧症的是","options":{"A":"小王以前多次参加招聘面试，每次面对考官都非常紧张，连一些常识性问题都答不上，现在他再也不愿参加招聘活动了","B":"赵先生从来不喜欢和同事打招呼，更不会主动开玩笑，同事们见了他也都远远地避开","C":"张女士非常喜欢广场舞，却一直跳不好。每当看到一种新的广场舞，就在家里反复模仿练习，但是从来不去广场跳集体舞","D":"小李是公司业务骨干，但是不善言辞。有一次，经理让他向客户介绍新产品的研发情况，小李刚讲了几句就满脸通红无话可说了"},"answer":"A","explanation":"第一步：找出定义关键词。\n“公众场合或正常社交活动中”、“害怕”、“刻意回避”。\n第二步：逐一分析选项。\nA项：小王多次参加面试，符合关键词“正常社交活动中”，面对考官都非常紧张，再也不愿参加招聘活动，符合关键词“害怕”、“刻意回避”，符合定义，当选；\nB项：同事们见到赵先生都避开的原因是赵先生从来不喜欢和同事打招呼，不是“因为过分担心、害怕而刻意回避”，不符合定义，排除；\nC项：张女士从来不去广场跳集体舞，不符合关键词“公众场合或正常社交活动中”，相比于A项，C项的“害怕”也不明确，对比择优，排除；\nD项：小李讲了几句满脸通红的原因是自己不善言辞，未涉及关键词“刻意回避”，排除。\n\u003cimg data-k=\"edd76269e21f\" style=\"max-width:700px\">\n故正确答案为A。\n注：有同学纠结A项的面试算不算社交，经过多方面资料查询，面试是属于社交的，所以这道题我们经过对比择优，选择A项。","no":111,"missingImage":false},{"qid":"2452699","cat":"定义判断","stem":"情感消费：指消费者出于某种情感需要而购买商品的行为，这种情感通常与商品的使用功能并没有直接关系。\n下列属于情感消费的是","options":{"A":"小王和小马是同学，情同姐妹，小王是某大牌化妆品的经销商，小马每次都能以最低的价格从小王处购买她需要的化妆品","B":"张先生看到某旅行社儿童节前推出的“欢乐童年南方行”定制旅游项目后，就选择了儿子一直梦寐以求的一条线路","C":"小陈对某电商平台有深厚的感情，多年来一直喜欢在这家平台购买日常用品，因为这家电商的商品质量好、价格低、服务优","D":"刘先生知道父亲有好多T恤衫，看到一件背后印有父亲生肖图案的T恤衫时，虽然价格不菲，还是毫不犹豫地买了回来"},"answer":"D","explanation":"第一步：找出定义关键词。\n“消费者出于某种情感需要而购买商品的行为”、“这种情感通常与商品的使用功能并没有直接关系”。\n第二步：逐一分析选项。\nA项：小马去小王那里购买化妆品是因为能以最低的价格买到所需的化妆品，并未体现“消费者出于某种情感需要而购买商品的行为”，不符合定义，排除； \nB项：张先生选择该旅游项目是因为这个项目是儿子梦寐以求的，能够体现张先生对儿子的感情，符合“消费者出于某种情感需要而购买商品的行为”，这个项目本身就是为了让孩子们高兴的，跟产品的使用功能是有关系的，不符合“这种情感通常与商品的使用功能并没有直接关系”，不符合定义，排除；\nC项：小陈对某电商平台有深厚的感情，所以一直都在这个电商平台上购买，符合“消费者出于某种情感需要而购买商品的行为”，但是他在这个电商平台上购买就是因为商品性价比高，与这些商品的功能有直接关系的，不符合“这种情感通常与商品的使用功能并没有直接关系”，不符合定义，排除；\nD项：刘先生知道自己父亲有很多T恤，但是依然购买了背后印有自己父亲生肖的T恤，能够体现自己对父亲的感情的，符合“消费者出于某种情感需要而购买商品的行为”，并且他是因为背后有自己父亲生肖的图案才购买的，与T恤本身的功能无关，所以符合“这种情感通常与商品的使用功能并没有直接关系”，符合定义，当选。\n故正确答案为D。","no":112,"missingImage":false},{"qid":"2452700","cat":"图形推理","stem":"鬲（lì）是古代一种煮饭用的炊器，有陶制鬲和青铜鬲，其形状一般为侈口（口沿外倾），有三个中空的足，便于炊煮加热。觚（gū）是古代一种用于饮酒的容器，也用作礼器，圈足、敞口、长身，口部和底部都呈现为喇叭状。卣（yǒu）是古代的一种酒器，口椭圆形，圈足，有盖和提梁，腹深。尊（zūn）是古代的一种大中型盛酒器，圈足，圆腹或方腹，长颈，敞口，口径较大。\n下列4个图形依次为\n\u003cimg data-k=\"5073faf710db\" style=\"max-width:595px\">","options":{"A":"觚、尊、鬲、卣","B":"尊、鬲、觚、卣","C":"觚、卣、鬲、尊","D":"鬲、卣、尊、觚"},"answer":"C","explanation":"第一步：找出定义关键词。\n“鬲”：侈口（口沿外倾）、三个中空的足；\n“觚”：圈足、敞口、长身，口部和底部都呈现为喇叭状；\n“卣”：口椭圆形，圈足，有盖和提梁，腹深；\n“尊”：圈足，圆腹或方腹，长颈，敞口，口径较大。\n第二步：逐一分析选项。\n题干四个图片从左到右依次是：觚、卣、鬲、尊，只有C项符合。\n故正确答案为C。","no":113,"missingImage":false},{"qid":"2452529","cat":"逻辑判断","stem":"谜语有多种猜法。比较法是将字形、字义相近或相反的词放在一起，加以比较而扣合谜底；溯源法是追溯谜面的来源及其与原出处的上下关联，然后再扣合谜底；拟物法是将人或人体某部分物化，将谜面字词语义或所言之事物化，扣合谜底。\n①谜面：枕头。要求打一成语。谜底：置之脑后\n②谜面：桃花潭水深千尺。要求打一成语。谜底：无与伦比\n③谜面：加一笔不好，加一倍不少。要求打一字。谜底：夕\n关于①②③谜语的猜法，下列判断正确的是","options":{"A":"①溯源法，②比较法，③拟物法","B":"①溯源法，②拟物法，③比较法","C":"①比较法，②溯源法，③拟物法","D":"①拟物法，②溯源法，③比较法"},"answer":"D","explanation":"第一步：找出定义关键词。\n比较法：“将字形、字义相近或相反的词放在一起，加以比较而扣合谜底”。\n溯源法：“追溯谜面的来源及其与原出处的上下关联，然后再扣合谜底”。\n拟物法：“将人或人体某部分物化，将谜面字词语义或所言之事物化，扣合谜底” 。\n第二步：逐一分析三个谜语。\n谜语①：“枕头。要求打一成语。谜底：置之脑后”\n分析：“枕头”指躺着的时候，垫在头下使头略高的卧具，“置之脑后”是说放在脑袋后面，符合“将人或人体某部分物化，将谜面字词语义或所言之事物化，扣合谜底”，属于拟物法。\n谜语②：“桃花潭水深千尺。要求打一成语。谜底：无与伦比”\n分析：“桃花潭水深千尺”出自于李白的《赠汪伦》，原句为：“桃花潭水深千尺，不及汪伦送我情”，含义是：桃花潭千尺深的水都比不上汪伦和我的友情，诗人用潭水深千尺比喻汪伦与他的友情。该谜面通过“追溯谜面的来源及其与原出处的上下关联，然后再扣合谜底”，属于溯源法。\n谜语③：“加一笔不好，加一倍不少。要求打一字。谜底：夕”\n分析：“加一笔不好”，“夕”加一笔是“歹”，“歹”是不好的意思；“加一倍不少”，“夕”再加一倍，也就是两个夕，即“多”，“多”也就是不少的意思。谜面是根据谜底“夕”的字形以及字义相近或相反的词来扣合谜底的，因此属于比较法。\n因而谜语①对应拟物法，谜语②对应溯源法，谜语③对应比较法。\n故正确答案为D。","no":114,"missingImage":false}]}],"count":50,"answerable":50,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>根据以下资料，回答116～120题\u003c/p>\u003cp>\u003cimg data-k=\"63efb1ea25b1\" style=\"max-width:700px\">\u003cbr>\u003c/p>","questions":[{"qid":"2452705","cat":"综合","stem":"2019年上半年，东部地区软件业务收入利润率是","options":{"A":"\u003cimg data-k=\"d2805a545cac\">","B":"\u003cimg data-k=\"55a008c01d18\">","C":"\u003cimg data-k=\"0a3296b14394\">","D":"\u003cimg data-k=\"923a945b3cb6\">"},"answer":"A","explanation":"根据题干“2019年上半年······利润率是”，可判定本题为现期比重问题。定位表格最后一行可得，2019年上半年我国东部地区软件业务利润为35464369万元，软件业务收入为263354838万元。根据公式：利润率\u003cimg data-k=\"e6c7a9c8511f\">\u003cimg data-k=\"845e6e95cd5a\">，可得所求利润率\u003cimg data-k=\"950846ea3f1d\">，与A项最接近。\n故正确答案为A。","no":115,"missingImage":false},{"qid":"2452707","cat":"增长","stem":"东部地区各省(市)中，2019年上半年软件业务收入占地区软件业务总收入的比重同比提高的有","options":{"A":"5个","B":"6个","C":"7个","D":"8个"},"answer":"D","explanation":"根据题干“······2019年上半年······占······比重同比提高的有”，可判定本题为两期比重问题。定位表格资料可知2019年上半年我国东部地区各省（市）软件业务收入同比增长率（a）、东部地区软件业务总收入同比增长率（\u003cimg data-k=\"5b1b29c5ddd9\">），根据两期比重结论“若 ，则比重同比提高”，满足题干要求的有北京（\u003cimg data-k=\"4a64fb5715ed\">）、天津（\u003cimg data-k=\"dc       if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;

    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
