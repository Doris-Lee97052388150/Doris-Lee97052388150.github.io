<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">

    <div class="brand">2021年新疆生产建设兵团行政执法类公务员考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>

</div>

<div class="mask" id="mask">

</div>
<div class="toast" id="toast"></div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2021-新疆-兵团","title":"2021年新疆生产建设兵团行政执法类公务员考试《行测》题（网友回忆版）","year":"2021","group":"新疆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"4004579","cat":"新思想","stem":"关于习近平新时代中国特色社会主义思想，表述不正确的是∶","options":{"A":"中国特色社会主义最本质的特征是以人民为中心","B":"新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","C":"全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家","D":"中国特色大国外交要推动构建新型国际关系，推动构建人类命运共同体"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，十九大报告在第三部分“新时代中国特色社会主义思想和基本方略”中指出：“新时代中国特色社会主义思想······明确中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，党是最高政治领导力量，提出新时代党的建设总要求，突出政治建设在党的建设中的重要地位。”\nB项正确，十九大报告在第三部分“新时代中国特色社会主义思想和基本方略”中指出：“新时代中国特色社会主义思想······明确新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，必须坚持以人民为中心的发展思想，不断促进人的全面发展、全体人民共同富裕。”\nC项正确，十九大报告在第三部分“新时代中国特色社会主义思想和基本方略”中指出：“新时代中国特色社会主义思想······明确全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。”\nD项正确，十九大报告在第三部分“新时代中国特色社会主义思想和基本方略”中指出：“新时代中国特色社会主义思想······明确中国特色大国外交要推动构建新型国际关系，推动构建人类命运共同体。”\n本题为选非题，故正确答案为A。","no":1,"missingImage":false}],"count":1,"answerable":1,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"4004593","cat":"法律常识","stem":"关于《中华人民共和国民法典》，以下表述正确的是∶","options":{"A":"编纂民法典是坚持和完善中国特色社会主义制度的现实需要","B":"民法典由全国人大常委会办公室负责牵头制定","C":"最高人民法院对民法典作出的法律解释不具有法律效力","D":"民法典施行后，之前颁布的民事单行法律自动作废"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，《关于&lt;中华人民共和国民法典（草案）&gt;的说明》在“一、编纂民法典的重大意义”部分指出：“（一）编纂民法典是坚持和完善中国特色社会主义制度的现实需要·······我国民事法律制度正是伴随着新时期改革开放和社会主义现代化建设的历史进程而形成并不断发展完善的，是中国特色社会主义法律制度的重要组成部分。在系统总结制度建设成果和实践经验的基础上，编纂一部具有中国特色、体现时代特点、反映人民意愿的民法典，不仅能充分彰显中国特色社会主义法律制度成果和制度自信，促进和保障中国特色社会主义事业不断发展，也能为人类法治文明的发展进步贡献中国智慧和中国方案。”\nB项错误，《关于&lt;中华人民共和国民法典（草案）&gt;的说明》在“三、民法典编纂工作情况”部分指出：“根据党中央的工作部署，编纂民法典的起草工作由全国人大常委会法制工作委员会牵头，最高人民法院、最高人民检察院、司法部、中国社会科学院、中国法学会为参加单位。”\nC项错误，法律解释是指一定的人、组织以及国家机关在法律实施或适用过程中对表达法律的语言文字的意义进行揭示、说明和选择的活动。根据法律解释主体与解释结果效力的不同，法律解释可以被区分为正式解释与非正式解释。所谓正式解释，又被称为法定解释或者有权解释，是指有法律解释权的国家机关、官员对法律作出了有法律约束力的解释。这里的“法律约束力”是指解释结果具有普遍的约束力。根据解释的国家机关的不同，正式解释被区分为：立法解释、司法解释与行政解释。最高人民法院对民法典作出的解释属于司法解释，是正式解释的一种，具有法律效力。\nD项错误，根据《中华人民共和国民法典》第一千二百六十条规定：“本法自2021年1月1日起施行。《中华人民共和国婚姻法》、《中华人民共和国继承法》、《中华人民共和国民法通则》、《中华人民共和国收养法》、《中华人民共和国担保法》、《中华人民共和国合同法》、《中华人民共和国物权法》、《中华人民共和国侵权责任法》、《中华人民共和国民法总则》同时废止。”因此，之前颁布的民事单行法律并不是自动废止，而是由《中华人民共和国民法典》明确规定废止。\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"4004602","cat":"人文常识","stem":"下列新思想与新提法按照提出的时间先后顺序排列正确的是∶\n①五大发展理念②三严三实③五位一体④四个意识⑤四个自信","options":{"A":"③②①④⑤","B":"③④⑤①②","C":"⑤④①③②","D":"⑤④③②①"},"answer":"A","explanation":"本题考查政治常识。\n①2015年10月29日，中国共产党第十八届中央委员会第五次全体会议审议通过的《中共中央关于制定国民经济和社会发展第十三个五年规划的建议》中首次提出“五大发展理念”。《建议》第二部分“‘十三五’时期经济社会发展的主要目标和基本理念”中指出：“完善发展理念。实现‘十三五’时期发展目标，破解发展难题，厚植发展优势，必须牢固树立创新、协调、绿色、开放、共享的发展理念。”\n②2014年3月9日，习近平总书记在中华人民共和国第十二届全国人民代表大会第二次会议安徽代表团参加审议时，关于推进作风建设的讲话中提出“既严以修身、严以用权、严以律己；又谋事要实、创业要实、做人要实”的重要论述，称为“三严三实”讲话。系“三严三实”的首次提出。\n③2012年11月17日至11月23日，党的十八大站在历史和全局的战略高度，对推进新时代“五位一体”总体布局作了全面部署。从经济、政治、文化、社会、生态文明五个方面，制定了新时代统筹推进“五位一体”总体布局的战略目标。\n④“四个意识”是指政治意识、大局意识、核心意识、看齐意识，是2016年1月29日中共中央政治局会议最早提出来的。\n⑤2016年7月1日，习近平总书记在庆祝中国共产党成立95周年大会上发表重要讲话并指出：“坚持不忘初心、继续前进，就要坚持中国特色社会主义道路自信、理论自信、制度自信、文化自信，坚持党的基本路线不动摇，不断把中国特色社会主义伟大事业推向前进。”系“四个自信”的首次提出。\n故按照提出的时间先后顺序排列为③②①④⑤。\n故正确答案为A。","no":3,"missingImage":false},{"type":"question","qid":"4004608","cat":"人文常识","stem":"下列哪一项成语所关联的主要人物与其他三项不同？","options":{"A":"多多益善","B":"才高八斗","C":"一饭千金","D":"暗度陈仓"},"answer":"B","explanation":"本题考查人文常识。\nA项，“多多益善”出自《史记·淮阴侯列传》，刘邦问韩信：“依你看来，像我能带多少人马？”韩信答：“陛下能带十万。”刘邦又问：“那你呢？”韩信答：“对我来说，当然越多越好！”可知，成语关联的主要人物是韩信。\nB项，“才高八斗”出自《南史·谢灵运传》，谢灵运说：“天下的文学之才总共有一石，其中曹子建（曹植）独占了八斗，我的才学占一斗，天下其他人共分一斗。”可知，成语关联的主要人物是曹植。\nC项，“一饭千金”出自《史记·淮阴侯列传》，韩信在未得志时境况困苦，时常往城下钓鱼，有很多漂母（清洗丝棉絮或旧衣布的老婆婆）在河边作工，其中有一个漂母很同情韩信的遭遇，不断地救济他，给他饭吃。后来，韩信替汉王立下汗马功劳，被封为楚王，他想起从前曾受过漂母的恩惠，便命从人送酒菜给她吃，更送给她黄金一千两来答谢她。可知，成语关联的主要人物是韩信。\nD项，“暗度陈仓”出自《史记·淮阴侯列传》，指刘邦将从汉中出兵攻项羽时，让大将军韩信从正面迷惑对方，掩盖自己的攻击路线，暗中绕道奔袭陈仓，取得胜利。可知，成语关联的主要人物是韩信。\n故A、C、D三项成语关联的主要人物均为韩信，B项关联的主要人物为曹植。\n本题为选非题，故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"4004622","cat":"人文常识","stem":"下列“三部曲”的作者与其包含的作品对应错误的是：","options":{"A":"巴金—爱情三部曲—《家》《春》《秋》","B":"茅盾—农村三部曲—《春蚕》《秋收》《残冬》","C":"郭沫若—女神三部曲—《女神之再生》《湘累》《棠棣之花》","D":"曹禺—话剧三部曲—《雷雨》《日出》《原野》"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，巴金，本名李尧棠，中国当代作家。代表作品有“激流三部曲”——《家》《春》《秋》；“爱情三部曲”——《雾》《雨》《电》。\nB项正确，茅盾，原名沈德鸿，字雁冰，中国现代作家、文学评论家、文化活动家以及社会活动家。其短篇小说《春蚕》《秋收》《残冬》被称为“农村三部曲”，从《春蚕》写蚕丝业萧条所引起的农村破产，到《秋收》写农民在饥饿中的抢粮风潮，到《残冬》写农民在一年生计完全绝望以后，终于自发起来进行武装斗争，正好反映出了那个年代旧中国农村变化和农民觉醒的全过程。\nC项正确，郭沫若，本名郭开贞，字鼎堂，中国现代作家、历史学家、考古学家。“女神三部曲”是郭沫若的系列诗作，包括《女神之再生》《湘累》《棠棣之花》，是“五四运动”狂飙突进精神的典型体现。\nD项正确，曹禺，原名万家宝，中国杰出的现代话剧剧作家。《雷雨》《日出》《原野》是他的话剧三部曲，奠定了他在中国现代文学史上的地位。\n本题为选非题，故正确答案为A。","no":5,"missingImage":false},{"type":"question","qid":"4004629","cat":"人文常识","stem":"下列经济名词解释错误的是：","options":{"A":"寡头垄断是指整个行业中只有一个生产者的市场结构","B":"洛伦兹曲线是用以反映国民收入分配平均程度的一种曲线","C":"基尼系数是一个衡量分配不平等程度的指标","D":"边际效用是指消费者在一定时间内增加单位商品所引起的总效用的增加量"},"answer":"A","explanation":"本题考查经济常识。\nA项错误，按照产品或服务供给方状况（即市场上的竞争状况），可以把市场划分为四种类型：完全竞争市场、不完全竞争市场、寡头垄断市场和完全垄断市场。寡头垄断市场又称寡头市场，是指少数几家厂商控制整个行业市场的产品的生产和销售的一种市场组织。整个行业中只有一个生产者的市场结构是完全垄断市场。\nB项正确，为了研究国民收入在国民之间的分配问题，奥地利统计学家洛伦兹提出了著名的洛伦兹曲线，即在一个总体（国家、地区）内，以“最贫穷的人口计算起一直到最富有人口”的人口百分比对应各个人口百分比的收入百分比的点组成的曲线。通过洛伦兹曲线，可以直观地看到一个国家收入分配平等或不平等的状况。\nC项正确，基尼系数是指国际上通用的、用以衡量一个国家或地区居民收入差距的常用指标。基尼系数最大为“1”，最小等于“0”，越接近0表明收入分配越是趋向平等，基尼系数小于0.2时，认为收入分配过于平均。\nD项正确，边际效用是指某种物品的消费量每增加一单位所增加的满足程度，即在一定时间内增加单位商品所引起的总效用的增加量。经济学通常认为，随着商品或服务的量增加，边际效用将会逐步减少，称为边际效应递减定律。\n本题为选非题，故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"4004637","cat":"地理国情","stem":"下列关于我国主要地理分界线的说法，表述正确的是：","options":{"A":"长江水系和黄河水系的分水岭是南岭","B":"冬小麦和春小麦种植区的分界线是黄河一线","C":"汉水和渭河的分界线是武夷山","D":"季风区和非季风区的分界线包含巴颜喀拉山脉"},"answer":"D","explanation":"本题考查地理国情。\nA项错误，长江水系与黄河水系分水岭是巴颜喀拉山脉-秦岭。南岭位于长江以南，指湖南省江西省与南方的两广相连的群山区域，即长江水系与珠江水系的分水岭及其周围群山。\nB项错误，根据不同的播种期，小麦可分为冬小麦与春小麦。冬小麦在秋季播种，次年的夏季收获，对越冬条件有较高要求。春小麦在春季播种，秋季收获。在我国一般以长城为界，在长城以北大体为春小麦，以南则为冬小麦。\nC项错误，汉水和渭河的分界线是秦岭。武夷山位于江西与福建西北部两省交界处，属典型的丹霞地貌。\nD项正确，我国季风区和非季风区的分界线：大兴安岭-阴山山脉-贺兰山-巴颜喀拉山脉-冈底斯山脉。此分界线以东为季风区，冬季近地面受高压系统控制，盛行偏北风，气候干冷，夏季受低压系统控制，盛行偏南风，气候湿润。此分界线以西为非季风区，气候干旱。\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"4004642","cat":"人文常识","stem":"下列说法错误的是：","options":{"A":"洛川会议把领导农民进行秋收起义作为党的最主要的任务","B":"古田会议通过了关于纠正党内错误思想的决议案，是中国共产党和红军建设的纲领性文件","C":"八七会议确立了农村包围城市的革命路线","D":"遵义会议确立了毛泽东在红军和党中央的领导地位，成为党的历史上一个生死攸关的转折点"},"answer":"A","explanation":"本题考查毛中特。\nA项错误，洛川会议是六届中央政治局于1937年8月22日至25日在陕北洛川冯家村召开的扩大会议，会议讨论制定了动员全国军民开展民族解放战争，实行全面持久抗战的方针，进一步确定在抗日战争时期的任务及各项政策。秋收起义是1927年毛泽东在湘赣边界领导工农革命军举行的一次武装起义，“八七会议”把领导农民进行秋收起义作为当前党的最主要任务。\nB项正确，古田会议是中国工农红军第四军于1929年12月28日至29日在福建省上杭县古田村召开的第九次党的代表大会，会议将马克思列宁主义与中国革命斗争的具体实践相结合，纠正了党内和军队中出现的极端民主化、非组织化等错误倾向，解决了如何从加强党的思想工作着手保持党的无产阶级先锋队性质和建设新型人民军队的根本问题。把党建设成为无产阶级先锋队，把军队建设成为无产阶级领导的新型人民军队，在古田会议决议中得以明确，古田会议决议因此成为我党我军建设的伟大纲领及重要里程碑。\nC项正确，八七会议是第一次国内革命战争失败以后，中共中央政治局于1927年8月7日在汉口召开的紧急会议。会议批判和纠正了陈独秀右倾机会主义错误，撤销了他在党内的职务，选出了新的临时中央政治局，确定了土地革命和武装斗争的总方针。毛泽东出席了这次会议，并提出了著名的“枪杆子里出政权”的论断。\nD项正确，遵义会议是指1935年1月中共中央政治局在贵州遵义召开的扩大会议，会议结束了王明“左”倾冒险主义在中共中央的统治，确立了以毛泽东为代表的新的中央的正确领导。这次会议是中国共产党第一次独立自主地运用马克思列宁主义基本原理解决自己的路线、方针和政策方面问题的会议。在极端危急的历史关头，挽救了党，挽救了红军，挽救了革命，是中国共产党历史上一个生死攸关的转折点，标志着中国共产党从幼年走向成熟。\n本题为选非题，故正确答案为A。\n注：农村包围城市是以毛泽东为代表的中国共产党人在领导中国革命实践中逐步摸索出来的一条具有中国特色的发展道路和总战略。从1927年10月到1930年1月，毛泽东在总结井冈山和其他革命根据地实践经验的基础上，先后撰写了《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》等著作，标志着农村包围城市的革命道路理论的基本形成。C选项亦存在瑕疵，八七会议确立的是土地革命和武装斗争的总方针，并决定发动秋收起义，并未直接确立农村包围城市的革命路线。但本题为单选题，A项错误更为明显，故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"4004648","cat":"科技常识","stem":"诗句“已晚相逢半山碧，便忙也折一枝黄。花应冷笑东篱族，犹向陶翁觅宠光。”描写的植物是：","options":{"A":"菊花","B":"桂花","C":"迎春花","D":"向日葵"},"answer":"A","explanation":"本题考查人文常识。\n题干中的诗句出自宋代杨万里的《野菊》，意思是已是傍晚时分，在绿色的半山腰中与野菊相逢。即使匆忙也要折一枝淡黄的野菊。野菊花也许会冷笑那些家养的菊花，因为家菊们竟然向陶渊明寻求恩宠。诗中“陶翁”“东篱”对应东晋田园诗人陶渊明及其所著“采菊东篱下，悠然见南山”。可知该诗描写的是菊花。\n故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"4004654","cat":"科技常识","stem":"以下关于我国科技成就的说法错误的是：","options":{"A":"2020年6月23日，在西昌卫星发射中心成功发射第55颗北斗导航卫星","B":"2020年9月21日，海洋二号C星成功发射，是我国海洋动力环境监测网的第一颗卫星","C":"2020年5月5日，长征五号B运载火箭在海南文昌首飞成功","D":"嫦娥四号着陆器和“玉兔二号”月球车分别于2020年11月10日和11月9日结束月夜休眠，迎来第24月昼"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，2020年6月23日9时43分，我国在西昌卫星发射中心用长征三号乙运载火箭，成功发射北斗系统第55颗导航卫星暨北斗三号最后一颗全球组网卫星。至此，北斗三号全球卫星导航系统星座部署全面完成。\nB项错误，2020年9月21日13时40分，长征四号乙运载火箭从酒泉卫星发射中心点火升空，成功将海洋二号C星送入预定轨道。海洋二号C星是我国海洋动力环境监测网的第二颗卫星，也是我国首颗运行于倾斜轨道的大型遥感卫星。\nC项正确，2020年5月5日，为我国载人空间站工程研制的长征五号B运载火箭在海南文昌首飞成功，正式拉开我国载人航天工程“第三步”任务的序幕。\nD项正确，2018年12月8日，我国在西昌卫星发射中心利用长征三号乙改进型运载火箭成功将嫦娥四号着陆器和巡视器（“玉兔二号”月球车）发射升空，实现了人类首次月球背面软着陆和巡视勘察。嫦娥四号着陆器和“玉兔二号”月球车分别于2020年11月10日3时12分和2020年11月9日10时17分结束月夜休眠，受光照自主唤醒，迎来第24月昼。\n本题为选非题，故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"4004660","cat":"人文常识","stem":"下列观点属于客观唯心主义的是：","options":{"A":"万物的本源是水","B":"万物皆备于我","C":"存在即是被感知","D":"世界是绝对观念的异化"},"answer":"D","explanation":"本题考查政治常识。\n客观唯心主义是唯心主义哲学的两种基本形式之一。它认为在物质世界和人类产生之前就独立存在着一种客观精神（理念、理、绝对精神、绝对观念等），这种客观精神在其发展过程中，产生了物质世界。因此，客观精神在先，是物质世界的本原，是第一性的；物质世界在后，是客观精神的表现和派生物，是第二性的。\nA项错误，“万物的本源是水”是古希腊米利都学派的创始人泰勒斯的名言，他认为世界的本源是水，即具体的物质是世界的本源，属于古代朴素唯物主义的观点。\nB项错误，“万物皆备于我”出于《孟子·尽心上》，意思是万物本性都与我所通。其认为世界的本源是人的精神，世界上的一切事物都存在于人的精神之中，属于主观唯心主义的观点。\nC项错误，“存在即是被感知”是英国哲学家贝克莱的名言，他认为，既然所有外物经过感觉到达心灵，那么我们能够确信的是我们的感觉，我们无法确定感觉之外还有什么外物。即一切物质都存在于人的精神之中，属于主观唯心主义的观点。\nD项正确，“世界是绝对观念的异化”是黑格尔哲学提出的一个重要客观唯心主义论断，出自黑格尔《逻辑学》。其认为世界是绝对观念产生的，是它的异化，所以绝对观念中产生了世界，属于客观唯心主义的观点。\n故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"4004667","cat":"经济常识","stem":"下列名词与其英文缩写对应不正确的是：","options":{"A":"博鳌亚洲论坛——BFA","B":"国民生产总值——GDP","C":"国际货币基金组织——IMF","D":"世界卫生组织——WHO"},"answer":"B","explanation":"本题考查经济常识。\nA项正确，博鳌亚洲论坛（Boao Forum For Asia，缩写BFA）是一个总部设在中国的非官方、非营利性、定期、定址国际组织，由29个成员国共同发起，于2001年2月在海南省琼海市博鳌镇正式宣布成立。\nB项错误，国民生产总值（Gross National Product，缩写GNP）是一定时期内本国的生产要素所有者所占有的最终产品和服务的总价值。GDP（Gross Domestic Product）指国内生产总值，是一个国家（或地区）所有常住单位在一定时期内生产活动的最终成果。\nC项正确，国际货币基金组织（International Monetary Fund，缩写IMF）是根据1944年7月在布雷顿森林会议签订的《国际货币基金组织协定》，于1945年12月27日在华盛顿成立的，总部设在华盛顿特区。\nD项正确，世界卫生组织（World Health Organization，缩写WHO）是联合国下属的一个专门机构，总部设置在瑞士日内瓦，只有主权国家才能参加，是国际上最大的政府间卫生组织。\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"4004673","cat":"人文常识","stem":"关于京剧艺术，下列说法错误的是：","options":{"A":"京剧腔调以西皮、二黄为主，被视为中国国粹","B":"昆曲是京剧的前身，表演的艺术手段主要是唱、念、做、打","C":"《红灯记》《沙家浜》《智取威虎山》是现代京剧的代表作","D":"2010年京剧被列入“人类非物质文化遗产代表作名录”"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，京剧，曾称平剧，腔调以西皮、二黄为主，用胡琴和锣鼓等伴奏，与中国画、中国医学被世人称为“中国三大国粹”。\nB项错误，京剧的前身是徽剧。昆曲是中国戏曲史上具有最完整表演体系的剧种，很多剧种都是在昆曲的基础上发展起来的，因而被称为“百戏之祖，百戏之师”。京剧虽然吸收了一部分昆曲的特点，但其前身并不是昆曲。\nC项正确，京剧分为传统京剧和现代京剧。在内容上，传统京剧多表现历史题材，如《霸王别姬》《铡美案》等，多为帝王将相戏；而现代京剧多表现现实题材，如革命现代京剧《智取威虎山》《红灯记》《沙家浜》等。\nD项正确，“人类非物质文化遗产代表作名录”是经联合国教科文组织评选确定的。2010年11月，京剧被列入“人类非物质文化遗产代表作名录”。\n本题为选非题，故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"4004683","cat":"人文常识","stem":"下列关于声音的常识，说法错误的是：","options":{"A":"人耳可以听到的声音频率在20Hz-20000Hz之间","B":"声音在不同介质中传播速度一般是固体大于液体","C":"未见其人先闻其声，是因为声波波长较长，容易发生反射现象","D":"音调指声音的高低，响度指声音的强弱，音色主要指声音的特色"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，声音的音调高低由频率决定，人耳能听见的声音的频率范围在20Hz-20000Hz之间。频率高于20000Hz的声音称为超声波，低于20Hz的声音称为次声波，人类均无法听到。\nB项正确，声音的传播需要介质，可以在固体、液体和气体中传播。在固体中传播速度最快，液体次之，在气体中传播速度最慢。\nC项错误，衍射现象是指波在传播时，如果被一个大小接近于或小于波长的物体阻挡，就绕过这个物体，继续进行。“未见其人先闻其声”是因为两者之间受到某种物体阻挡，因此“未见其人”，但声音可以绕过物体进行，所以“先闻其声”。\nD项正确，声音的三个特性分别是音调、响度、音色。音调指的是声音的高低，由频率决定，频率越高，音调越高；响度指的是声音的强弱，由振幅决定，振幅越大，响度越大；音色指的是不同声音表现在波形方面的特性，由发声体的材料、结构决定，不同的发声体发出声音的音色一般不同，如小提琴和钢琴的音色不同。\n本题为选非题，故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"4004692","cat":"人文常识","stem":"表面张力的形成同处在液体表面薄层内的分子的特殊受力状态密切相关。下列现象，与表面张力无关的是：","options":{"A":"毛笔上的墨汁不会掉下来","B":"荷叶或芋叶上滚动的水珠","C":"氢气球会浮在空中","D":"吹出的肥皂泡泡"},"answer":"C","explanation":"本题考查科技常识。\n液体表面张力，是指作用于液体表面，使液体表面积缩小的力。其产生的原因是：液体跟气体接触的表面存在一个薄层，叫做表面层，表面层里的分子比液体内部稀疏，分子间的距离比液体内部大一些，分子间的相互作用表现为引力。\nA项正确，毛笔上的墨汁不会掉下来属于毛细现象，毛笔上有许多毛细管，墨汁的附着力与液体表面张力共同作用达到与重力平衡，使墨汁不会从毛笔上掉下来。\nB项正确，由于荷叶或芋叶具有疏水、不吸水的表面，落在叶面上的雨水不会浸润展开，而会因表面张力的作用形成水珠。\nC项错误，氢气球会浮在空中是因为氢气的密度比空气小，氢气球受到空气浮力，与液体表面张力无关。\nD项正确，肥皂泡是一层极薄的肥皂水膜，这层膜是由分子组成的，分子之间有相互的作用力。内部的气泡试图聚集在一起成为与外界空气的接触最小化的形状，两种力会最终达到一个平衡状态，即为球形。在一个球形气泡中，每一个肥皂分子都在吸引同样数量的肥皂分子，且表面的张力把气泡拉在一起并使它们保持球形。\n本题为选非题，故正确答案为C。","no":15,"missingImage":false},{"type":"question","qid":"4004700","cat":"人文常识","stem":"下列古诗文或俗语中所描写的现象与其蕴含的气象知识对应错误的是：","options":{"A":"随风潜入夜，润物细无声——在春季，由暖锋形成的春雨，一般雨势较小","B":"一场春雨一场暖，一场秋雨一场寒——暖锋和冷锋过境后的效果","C":"天无三日晴，地无三尺平——江淮地区准静止锋形成的梅雨现象","D":"春雨贵如油，夏雨满街流——华北地区春旱，春天仍在冷气团的控制下"},"answer":"C","explanation":"本题考查地理国情。\nA项正确，“随风潜入夜，润物细无声”出自杜甫的《春夜喜雨》，意思是指春雨随着春风在夜里悄悄地落下，悄然无声地滋润着大地万物。诗句对应的季节为春天，雨水主要是由暖锋形成。暖锋是指锋面在移动过程中，暖空气推动锋面向冷气团一侧移动的锋，可能会连续性降水或出现雾。另外，从诗的含义可以看出雨势较小。\nB项正确，“一场春雨一场暖”是指在春季由于暖锋过境，与冷气团交汇，带来丰沛降水，气温升高的现象。“一场秋雨一场寒”是指在秋季由于冷锋过境，与暖气团交汇，带来丰沛降水，气温降低的现象。\nC项错误，“天无三日晴，地无三尺平”描述的是我国贵州省的特有景象。贵州省，年平均阴雨日数在200天以上，有“天无三日晴”之说；又因山脉绵延，河谷深切，地形崎岖，交通不便，有“地无三尺平”之说。梅雨是中国长江中下游地区在每年六、七月份都会出现持续天阴有雨的气候现象，产生于西太平洋副热带高压边缘的锋区。六月份气温回升，沿海暖气团与西北冷气团势均力敌，此处形成准静止锋，导致梅雨。\nD项正确，“春雨贵如油，夏雨满街流”形容的是我国降水季节性分布不均，夏秋多、冬春少的特点。春季，暖空气势力还不强，来自海洋的暖湿气流多在我国的华南、江南一带徘徊，与冷空气交锋，为那里带来丰沛的雨水，而华北、西北则在湿度较低的冷气团的控制下，出现干冷天气。\n本题为选非题，故正确答案为C。","no":16,"missingImage":false},{"type":"question","qid":"4004706","cat":"人文常识","stem":"生活在东汉时期的医者，在其所在的时期最不可能学习到的著作是：","options":{"A":"《黄帝内经》","B":"《伤寒杂病论》","C":"《千金方》","D":"《神农本草经》"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，《黄帝内经》一般认为成书于春秋战国时期，分《灵枢》《素问》两部分。该书在理论上建立了中医学上的阴阳五行学说、脉象学说、藏象学说等，是我国现存成书最早的一部医学典籍，与《难经》《伤寒杂病论》《神农本草经》并称为中国传统医学四大经典著作。东汉时期的医者是有可能学习到本书的。\nB项正确，《伤寒杂病论》作者是东汉末年医学家张仲景。该书记载了大量有效的方剂，确立了“六经分类”的辨证施治原则，是中国第一部从理论到实践的医学专著。东汉时期的医者是有可能学习到本书的。\nC项错误，《千金方》作者是唐代医药学家孙思邈。该书是对唐代以前医药学成就的系统总结，被誉为我国最早的一部临床百科全书。成书年代远远晚于东汉，故东汉时期的医者不可能学习到本书。\nD项正确，《神农本草经》起源于神农氏，成书于东汉时期。该书是对中国中医药的第一次系统总结，是中医四大经典著作之一。东汉时期的医者是有可能学习到本书的。\n本题为选非题，故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"4004713","cat":"法律常识","stem":"古罗马法学家西塞罗说：“因为法律统治执政官，所以执政官统治人民，我们真正可以说，执政官是会说话的法律，而法律乃是不会说话的执政官。”对这段话的理解，下列表述正确的是：","options":{"A":"只要执政官所说的话，都是法律","B":"执政官是法律的产物，必须服从法律","C":"执政官的统治与法律的统治完全相同","D":"执政官对法律的解释不具有法律效力"},"answer":"B","explanation":"本题考查法律常识。\n题干中西塞罗旨在强调法律地位的至高无上，“执政官”受法律统治，其统治人民的权利也由法律所赋予。\nA项错误，法律是由国家制定或认可并由国家强制力保证实施的，反映由特定物质生活条件所决定的统治阶级意志，以权利和义务为基础，以确认、保护和发展统治阶级所期望的社会关系和社会秩序为目的的行为规范体系。而非执政官所说的话。\nB项正确，广义上的执法是所有国家行政机关、司法机关及其公职人员依照法定职权和程序实施法律的活动，题干中的“执政官”即对应国家行政机关、司法机关及其公职人员。一方面，其职权由法律赋予，属于法律的产物；另一方面，其必须依照法定职权和程序实施法律，受法律的统治。\nC项错误，法律是统治阶级意志的体现，法律的统治是统治阶级统治的方式之一。而执政官是法律的实施者，执政官的统治指其根据法律的授权和规定行使职权，与法律的统治含义、范围均不一致。\nD项错误，根据解释法律的主体和解释结果效力的不同，法律解释分为正式解释和非正式解释。所谓正式解释，又称法定解释或有权解释，是指有法律解释权的国家机关、官员对法律作出了有法律约束力的解释。这里的“法律约束力”是指解释结果具有普遍性的约束力。根据解释的国家机关的不同，正式解释被区分为：立法解释、司法解释与行政解释。所谓非正式解释是指没有法律解释权的机关、团体、组织或个人对法律作出的不具有法律约束力的解释，依其解释的角度和理论化程度不同，分为任意解释和学理解释。执政官对法律的解释属于正式解释，具有法律效力。\n故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"4004719","cat":"法律常识","stem":"下列属于司法活动范畴的是：","options":{"A":"某司法局审查并发放律师执业证","B":"某区市场监督部门检查工厂制造产品","C":"交警对吴某闯红灯进行口头教育","D":"检察机关对犯罪嫌疑人范某以涉嫌抢劫罪予以批准逮捕"},"answer":"D","explanation":"本题考查法律常识。\n司法，又称法的适用，通常是指国家司法机关及其司法人员根据法定职权和法定程序，具体应用法律处理案件的专门活动。我国的司法机关包括人民法院和人民检察院。执法，又称法的执行，狭义上的执法专指国家行政机关及其公职人员依法行使管理职权、履行职责、实施法律的活动。人们把行政机关称为执法机关，就是在狭义上使用“执法”概念。\nA项错误，某司法局是行政机关而非司法机关，其发放律师执业证的行为属于执法活动。\nB项错误，某区市场监督部门是行政机关而非司法机关，其检查工厂制造产品的行为属于执法活动。\nC项错误，交警是公安机关交通管理部门的工作人员，其对吴某闯红灯进行口头教育的行为属于执法活动。\nD项正确，检察机关属于司法机关，其根据《中华人民共和国刑事诉讼法》的授权，按照规定的程序对犯罪嫌疑人范某以涉嫌抢劫罪予以批准逮捕属于司法活动。\n故正确答案为D。","no":19,"missingImage":false},{"type":"question","qid":"4004731","cat":"人文常识","stem":"下列关于我国近代史上的“第一”，表述错误的是：","options":{"A":"中国第一个资产阶级革命团体——兴中会","B":"中国近代史上第一个不平等条约——《南京条约》","C":"中国人提出在中国发展资本主义的第一个方案——《天朝田亩制度》","D":"中国第一个对马克思主义作出系统完整介绍的人——李大钊"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，1894年11月24日，孙中山在美国檀香山创建了中国近代史上第一个资产阶级革命团体——兴中会，第一次提出了推翻满清封建君主专制政府、建立民主共和国的革命纲领，宗旨是驱逐鞑虏，恢复中华，创立合众政府。\nB项正确，1842年8月，英国与清政府签订了《南京条约》，这是中国近代史上第一个不平等条约，开创了以条约形式掠夺和奴役中国合法化的先例；使中国从封建社会开始沦为半殖民地半封建社会；使中华民族与帝国主义、人民大众与封建主义的矛盾，成为中国社会的主要矛盾。\nC项错误，中国人提出在中国发展资本主义的第一个方案是《资政新篇》，其核心是要在中国发展资本主义。《天朝田亩制度》是太平天国时期颁发的一部纲领性文件，主要内容是：废除封建土地所有制；规定了农民平分土地的原则；在农村设立兵农合一的乡官制度；废除封建买卖婚姻；主张人人平等。实际上并没有实行。\nD项正确，李大钊，字守常，是中国最早的马克思主义者，中国共产党的主要创始人之一。1919年5月，李大钊发表《我的马克思主义观》，对马克思主义三大组成部分—马克思主义哲学、政治经济学和科学社会主义的基本观点作了系统介绍。他是国内第一个对马克思主义作系统完整的介绍的人，对马克思主义的传播起了重要作用。\n本题为选非题，故正确答案为C。","no":20,"missingImage":false}],"count":19,"answerable":19,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"4004478","cat":"逻辑填空","stem":"近年来在许多地方，“校闹”频发让学校疲于招架，让教师            ：学生在校园遭遇安全事故要闹，对老师安排座位不满意要闹，孩子被罚抄课文还要闹······“校闹”现象干扰了正常教学秩序，破坏了良好教育生态，治理“校闹”，目前已有相关规定，却收效不大，需要进一步细化落实。\n填入画横线部分最恰当的一项是：","options":{"A":"忧心如焚","B":"垂头丧气","C":"无所适从","D":"人人自危"},"answer":"C","explanation":"根据横线前“让学校疲于招架”以及横线后“学生在校园遭遇······孩子被罚抄课文还要闹”可知，横线处应体现“校闹”频发让老师手忙脚乱、无法招架。C项“无所适从”指不知道依从谁好或不知道怎么办才好，符合文意，当选。\nA项“忧心如焚”指心里愁得像火烧一样，侧重强调忧愁的情绪，与文意不符，排除；\nB项“垂头丧气”形容情绪低落的神情，侧重强调神情低落，与文意不符，排除；\nD项“人人自危”指每个人都觉得自己不安全、有危险，与文意不符，排除。\n故正确答案为C。\n【文段出处】《一个家长闹，全校鸡飞狗跳？》","no":21,"missingImage":false},{"type":"question","qid":"4004484","cat":"逻辑填空","stem":"一直以来，为偶像打榜、刷数据            ，其背后除了粉丝的狂热之外，更有“大粉”们的引导和灰色产业链的助推。此前，“星缘”APP利用粉丝给“爱豆”刷流量的需求，疯狂牟利，不到一年吸金800余万元。\n填入画横线部分最恰当的一项是：","options":{"A":"大张旗鼓","B":"大行其道","C":"风靡一时","D":"蔚然成风"},"answer":"B","explanation":"由横线前“一直以来”以及横线后“······的狂热······灰色产业链的助推”“疯狂牟利”可知，所填成语应表明“为偶像打榜、刷数据”的现象盛行且持续存在，并且其感情色彩偏消极。B项“大行其道”指某种观点或某种事物盛行（多含贬义），符合文意，当选。\nA项“大张旗鼓”形容声势和规模很大，C项“风靡一时”形容一个事物在一个时期非常盛行，二者均与文段“一直以来”对应不当，无法体现出现象的持续性，排除；\nD项“蔚然成风”形容一种事物逐渐发展、盛行，形成风气，多用于积极的语境中，与文段感情色彩不符，排除。\n故正确答案为B。\n【文段出处】人民网评《幕后黑手，必须坚决斩断》","no":22,"missingImage":false},{"type":"question","qid":"4004495","cat":"逻辑填空","stem":"老龄化社会遭遇“扫码时代”，如何找到办法让两者            ，如何让老年人过上正常生活进而可以安享便利？解决这一难题，需要个人、家庭、社会通力合作。\n填入画横线部分最恰当的一项是：","options":{"A":"不相上下","B":"并行不悖","C":"双管齐下","D":"大同小异"},"answer":"B","explanation":"根据横线前后“老龄化社会遭遇‘扫码时代’”和“让老年人过上正常生活进而可以安享便利”可知，横线处所填成语应表达让老龄化社会与“扫码时代”能够同时发展，互不冲突之意，B项“并行不悖”指同时实行，不相冲突，符合文意，当选。\nA项“不相上下”指分不出高低，形容数量、程度差不多，文段并无比较两者高低之意，与文意不符，排除；\nC项“双管齐下”比喻从两方面同时进行，一般搭配解决方法，与文段中的“两者”（“老龄化社会”和“扫码时代”）搭配不当，排除；\nD项“大同小异”指大部分相同，只有小部分不同，与文意无关，排除。\n故正确答案为B。\n【文段出处】《“后浪”要帮 “前浪”要赶 社会要管》","no":23,"missingImage":false},{"type":"question","qid":"4004500","cat":"逻辑填空","stem":"相比踏踏实实的实干，纸上文章好做易做。但扶贫数据看上去很美，不代表贫困群众真的满意。“材料扶贫”无异于            ，非但打不赢决战脱贫攻坚这样的硬仗，长此以往反而会损害全民致富奔小康的国家大计。\n填入画横线部分最恰当的一项是：","options":{"A":"画饼充饥","B":"夸夸其谈","C":"纸上谈兵","D":"言之无物"},"answer":"C","explanation":"根据“无异于”解释说明的标志可知，前文是对横线处的解释说明。由“纸上文章好做易做。但扶贫数据看上去很美，不代表贫困群众真的满意”以及“打不赢决战脱贫攻坚这样的硬仗”可知，“材料扶贫”只是表面功夫，无法解决贫困群众脱贫问题，故横线处所填成语需体现无法解决实际问题之意，C项“纸上谈兵”比喻空谈理论，不能解决实际问题，符合文意，当选。\nA项“画饼充饥”比喻用空想来安慰自己，而文中“材料扶贫”并非是空想，与文意不符，排除；\nB项“夸夸其谈”形容说话浮夸不切实际，文段强调的是“材料扶贫”不能解决问题，而非谈论“说话”是否浮夸，不符合文意，排除；\nD项“言之无物”指文章或言论空空洞洞，没有实际内容，文段谈论的是“材料扶贫”不能解决问题，而非“文章”或者“言论”是否有实际内容，不符合文意，排除。\n故正确答案为C。\n【文段出处】《人民网评：决战脱贫攻坚不能靠“纸上谈兵”》","no":24,"missingImage":false},{"type":"question","qid":"4004530","cat":"逻辑填空","stem":"除了季节的变换导致夜的长短发生变化，黑夜本身并无变迁可言，昼夜交替是自然规律，            。夜的变迁发生在与人类的关系中，人类对黑夜的感情十分复杂，黑夜常常与        联系起来，令人产生长夜漫漫的感觉。\n依次填入画横线部分最恰当的一项是：","options":{"A":"一成不变 邪恶","B":"亘古不变 恐惧","C":"有条不紊 孤独","D":"一以贯之 寒冷"},"answer":"B","explanation":"第一空，根据横线前“昼夜交替是自然规律”可知，横线处所填成语形容“昼夜交替”且与“自然规律”对应，B项“亘古不变”指从古至今永远也不会改变，可以形容“昼夜交替”且与“自然规律”对应，保留。A项“一成不变”指一经形成，不容变更，亦泛指墨守成规，不知变通，含贬义，与文段感情色彩不符，排除；C项“有条不紊”形容做事、说话有条有理，丝毫不乱，D项“一以贯之”指一种思想或理论贯通始终，均不符合文意，排除。\n第二空，代入验证，B项“恐惧”与后文“长夜漫漫”形成对应，体现出人们因对黑夜有“恐惧”，才会觉得其特别漫长，符合文意，当选。\n故正确答案为B。\n【文段出处】《欧洲夜史：人类对夜晚态度之变迁》","no":25,"missingImage":false},{"type":"question","qid":"4004546","cat":"逻辑填空","stem":"对城市而言，限行的好处显而易见。治堵有很多办法，比如多修点马路、合理科学地规划线路、设置通行信号、加快公共交通建设等，但这些办法都会撞到天花板，而限行则            ，上海限行首日通畅的高架就说明了这点。有限的道路资源、停车位资源，跟不上越来越大的需求，不限的话，迟早有一天大家都会堵在路上，            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"药到病除 一动不动","B":"立竿见影 寸步难行","C":"行之有效 长吁短叹","D":"无所顾忌 一筹莫展"},"answer":"B","explanation":"第一空，根据“上海限行首日通畅的高架就说明了这点”可知，“这点”指代了横线处的内容，由“首日通畅”可知横线处所填成语表达见效快的意思，A项“药到病除”形容用药效果非常好，B项“立竿见影”比喻可以立刻见效，均符合文意，保留。C项“行之有效”意为实施某种措施或办法有成效，D项“无所顾忌”形容什么都不怕，均无法体现见效快的意思，排除。\n第二空，根据文意可知，横线处所填成语应体现堵车时的状态，B项“寸步难行”形容走路、行动困难，可体现堵车时艰难前进的状态，符合文意，当选。A项“一动不动”意为一点也不移动，程度过重，不符合文意，排除。\n故正确答案为B。\n【文段出处】《外牌限行治堵取舍之间见城市管理功力》","no":26,"missingImage":false},{"type":"question","qid":"4004553","cat":"逻辑填空","stem":"不妨大胆假设，如果不是画家嫌写实的鞋子            、破坏画面，就是因为世风保守，不便画出女子的绣鞋。还有一种可能：画家无意处理鞋子的问题。既然画家并非以照相式记录为追求，观者何必较真？床上到底有没有人，            ，也恰是趣味所在。\n依次填入画横线部分最恰当的一项是：","options":{"A":"错综复杂 不言而喻","B":"纷然杂陈 模棱两可","C":"扑朔迷离 不置可否","D":"乱七八糟 显而易见"},"answer":"B","explanation":"第一空，横线处搭配“鞋子”，且由“、”可知，横线处所填成语与“破坏画面”语义相近，B项“纷然杂陈”形容东西很多，杂乱摆放的样子，D项“乱七八糟”形容混乱、乱糟糟的样子，均符合文意，保留。A项“错综复杂”形容头绪多，情况复杂，C项“扑朔迷离”形容事物错综复杂，不容易看清真相，均与“鞋子”搭配不当，排除。\n第二空，根据前文“床上到底有没有人”可知，横线处需体现不确定之意，B项“模棱两可”指不表示明确的态度，或没有明确的主张，可体现不确定的含义，符合文意，当选。D项“显而易见”指（事情、道理）非常明显，很容易看清楚，与文意相悖，排除。\n故正确答案为B。\n【文段出处】《＜韩熙载夜宴图＞的迷与谜》","no":27,"missingImage":false},{"type":"question","qid":"4004564","cat":"逻辑填空","stem":"生活在北宋末年的画家张择端绘制的《清明上河图》，生动描绘了北宋都城东京汴梁的风土人情，真实反映了汴京以及汴河两岸的自然风光和街市繁荣情景。街市内店铺            ，各类招幌林立，商贾云集，人流如织，叫卖声            ，一派繁华的都市景象被描绘得绘形绘色，呼之欲出。\n依次填入画横线部分最恰当的一项是：","options":{"A":"漫山遍野 活灵活现","B":"浩如烟海 响彻云霄","C":"鳞次栉比 余音绕梁","D":"星罗棋布 此起彼伏"},"answer":"D","explanation":"第一空，横线处所填成语应与“店铺”搭配，且根据“各类招幌林立，商贾云集”可知，应体现出店铺多的语义，D项“星罗棋布”形容数量众多，散布的范围很广，符合文意，保留。A项“漫山遍野”意为布满山上和田野上，形容为数甚多，到处都是，与文段“街市内”的语境不符，排除；B项“浩如烟海”形容书籍、资料等数量繁多，十分丰富，与“店铺”搭配不当，排除；C项“鳞次栉比”形容建筑物等多而集中，排列整齐，文段并未体现排列整齐之意，与文意不符，排除。\n第二空，代入验证，D项“此起彼伏”形容接连不断，与“叫卖声”搭配恰当，当选。\n故正确答案为D。\n【文段出处】《&lt;清明上河图&gt;里的中药铺》","no":28,"missingImage":false},{"type":"question","qid":"4004574","cat":"逻辑填空","stem":"科研需要踏踏实实，需要兢兢业业，更不要说需要夜以继日、            了。那么，一个科研工作者——即使是诺贝尔奖得主，怎么可能在走马观花中，只蜻蜓点水般地在某处站站脚、说些话，就能            了？\n依次填入画横线部分最恰当的一项是：","options":{"A":"专心致志 扭转乾坤","B":"废寝忘食 脱胎换骨","C":"殚精竭虑 点石成金","D":"披星戴月 画龙点睛"},"answer":"C","explanation":"第一空，根据横线前“、”以及递进标志词“更”可知，横线处所填成语与“夜以继日”构成并列，表示日夜不停地搞研究，且程度要比“踏踏实实”“兢兢业业”更重，B项“废寝忘食”指顾不得睡觉，忘记了吃饭，形容非常勤奋专心，C项“殚精竭虑”形容使尽了精力，费尽了心思，均符合文意，保留。A项“专心致志”形容一心一意，聚精会神，无法与“踏踏实实”“兢兢业业”构成递进，排除；D项“披星戴月”形容起早贪黑，辛勤劳动或昼夜赶路，旅途辛劳，与文意无关，排除。\n第二空，根据文意可知，此处想表达一个科研工作者不可能轻轻松松就取得一项成功的科研成果，故横线处需体现取得科研成果之意，C项“点石成金”多比喻把不好的或平凡的事物改变成很好的事物，可以体现出科研工作者把一些平凡的事物变成伟大的科研成果，符合文意，当选。B项“脱胎换骨”现在常用来比喻痛改前非，重新做人，与文意无关，排除。\n故正确答案为C。\n【文段出处】《用诺贝尔奖得主撑门面之风早该刹住》","no":29,"missingImage":false},{"type":"question","qid":"4004589","cat":"逻辑填空","stem":"人，当是城市的唯一        。城市化的逻辑必须修正，城市化的运行亟待转轨。从规模扩张到形象塑造再到品质        ，再聚焦于人性化的张扬，城市化已在书写一个        的版本。\n依次填入画横线部分最恰当的一项是：","options":{"A":"尺度 提升 崭新","B":"标准 改善 多样","C":"牵挂 升级 全新","D":"主宰 升高 鲜明"},"answer":"A","explanation":"本题可从第三空入手，由“城市化的逻辑必须修正，城市化的运行亟待转轨”可知，此处强调城市化的观念要改变、要更新，即书写一个新版本。A项“崭新”、C项“全新”均能体现“新”的意思，符合文意，保留。B项“多样”侧重样式多，D项“鲜明”指（颜色）明亮，或指分明而确定，均与文意不符，排除。\n第一空，对比A、C两项，由“······聚焦于人性化的张扬”可知，此处强调城市化过程中要以人为本，要将人的需求作为城市化的准则、法度。A项“尺度”指标准，符合文意，保留。C项“牵挂”指挂念，强调内心惦记着，体现不出城市化过程中应遵循以人为本的准则，且“牵挂”的主语一般是人，与“城市”搭配不当，排除。\n第二空，代入验证。“品质提升”为常见搭配，且“规模扩张、形象塑造、品质提升”也能构成时间上的顺承，A项“提升”填入恰当，当选。\n故正确答案为A。\n【文段出处】《还城于人！人是唯一尺度 城市规划向生活细部发力》","no":30,"missingImage":false},{"type":"question","qid":"4004601","cat":"逻辑填空","stem":"电视剧人须百倍珍惜传统文化源远流长的文脉传承，自豪地对待中华民族的优秀历史文化传统和革命历史文化资源，        好民族文化瑰宝，传承好中华文史精粹，辩证把握、理性萃取深厚传统文化的时代价值，古为今用，            ，将中华民族的文化自信、道路自信通过各种方式熔铸到创作实践中，使作品中的人物形象        出沁人心脾、滋人心智、撼人心魄的民族情怀、社会责任、道德光彩与文化品性。\n依次填入画横线部分最恰当的一项是：","options":{"A":"维护 去粗取精 散发","B":"保护 洋为中用 展示","C":"保卫 继往开来 表现","D":"守护 推陈出新 凸显"},"answer":"D","explanation":"第一空，搭配“文化瑰宝”，B项“保护”、D项“守护”均可与其搭配，保留。A项“维护”意为保护，使其免于遭到破坏，常搭配“关系”“秩序”等，C项“保卫”意为保护，使其不受侵犯或损害，常搭配“家乡”“领土”等，均与“文化瑰宝”搭配不当，排除。\n第二空，根据横线前“传承好中华文史精粹”可知，横线处成语应体现出电视剧人对传统文化的态度，D项“推陈出新”意为去掉旧事物的糟粕，取其精华，并使它向新的方向发展，能体现电视剧人对待传统文化的态度，保留。B项“洋为中用”意为批判地吸收外国文化中一切有益的东西，为我所用，不能体现电视剧人对传统文化的态度，排除。\n第三空，代入验证，D项“凸显”即凸出显露，与“民族情怀、社会责任、道德光彩与文化品性”搭配恰当，当选。\n故正确答案为D。\n【文段出处】《让经典形象照亮现实生活》","no":31,"missingImage":false},{"type":"question","qid":"4004613","cat":"逻辑填空","stem":"和平犹如空气和阳光，受益而不觉，失之则难存。弱肉强食不是人类共存之道，穷兵黩武不是人类和平之计。和平而非战争，合作而非对抗，这才是人类社会进步的永恒主题。        历史、        先烈、        和平、        未来——无论过去、现在还是未来，都是我们共同的心声。\n依次填入画横线部分最恰当的一项是：","options":{"A":"牢记 怀念 珍惜 创造","B":"铭记 缅怀 珍爱 开创","C":"谨记 悼念 爱惜 塑造","D":"铭刻 纪念 重视 刻画"},"answer":"B","explanation":"第一空，搭配“历史”。A项“牢记”指牢牢地记住，B项“铭记”指深深地记在心里，D项“铭刻”指铭记，三者均与“历史”搭配恰当，保留。C项“谨记”含有牢记之意，一般搭配“教训”“教诲”等，与“历史”搭配不当，排除。\n第二空，搭配“先烈”。A项“怀念”指思念，B项“缅怀”指怀念，追想，二者均可与“先烈”搭配，保留。D项“纪念”指用事物或行动对人或事表示怀念，结合“共同的心声”可知，文段更侧重于表达从内心抒发对“先烈”的情感，而非“用事物或行动”，不符合文意，排除。\n第三空，搭配“和平”。A项“珍惜”意为珍重爱惜，B项“珍爱”指爱护、珍惜、爱惜，两者均可搭配“和平”。对比来看，“珍爱和平”更能够体现出对和平的特别重视之意，且“珍爱”\u003cimg data-k=\"e6c7a9c8511f\">“珍惜”\u003cimg data-k=\"3d6d1f96db11\">“爱惜”，本身包含A项“珍惜”，语义更为丰富，因此B项“珍爱”更符合文意，保留。\n第四空，代入验证，搭配“未来”。B项“开创”指开拓创造，“开创未来”为常见搭配，不仅体现对未来的创造，还可体现出对未来的开拓、拓展，语义丰富度更强，当选。\n故正确答案为B。\n【文段出处】《新华网评：绝不让历史悲剧重演》","no":32,"missingImage":false},{"type":"question","qid":"4004620","cat":"片段阅读","stem":"运动健身不仅能增强人的体格、提升身体机能，也能磨练人的意志、锤炼人的精神。健身既是对身体机能的一种唤醒提升，也是对精神意志的一种挑战磨练。这种锻炼能够帮助人们增强意志品格，从精神层面提升耐受力、抗压力，储备起强大的“心理能量”，让人在应对困难时更为自信从容、勇敢坚定。\n这段文字主要讲的是：","options":{"A":"运动健身不仅为身体赋能，也为精神赋能","B":"当今社会健身运动已成为一种风尚","C":"运动健身能够增强身体和心理的承受力","D":"运动健身有助于自身解决困难"},"answer":"A","explanation":"文段开篇提出运动健身对人的身体机能和精神意志有益处，接着再次论述健身对身体和精神的积极作用。尾句具体说明运动健身对人精神层面提供的能量。故文段为总分结构，重点强调运动健身对身体和精神的正面作用，对应A项。\nB项，“健身运动已成为一种风尚”文段未提及，无中生有，排除；\nC项，“身体的承受力”与文段表述不一致，文段强调“增强人的体格、提升身体机能”，排除；\nD项，“有助于自身解决困难”表述不准确，文段明确指出运动健身对人的身体机能和精神意志有益处，排除。\n故正确答案为A。\n【文段出处】《人民日报体坛观澜：让运动为精神赋能》","no":33,"missingImage":false},{"type":"question","qid":"4004627","cat":"片段阅读","stem":"现实中医护人员和患者及家属往往站在不同角度考虑问题，受时间、环境、岗位责任等多种因素影响，医患之间沟通不顺畅，容易引发医患关系紧张和矛盾。但是有了医务社工，可以参与诊疗团队，从患者心理和社会角度提出诊疗建议，同时也可以耐心帮助患者理解诊疗方案，与医生和患者双方充分沟通，提高诊疗效率，推动构建和谐医患关系。\n这段文字意在说明：","options":{"A":"医务社工的普及一定能够构建和谐医患关系","B":"医患关系紧张的原因是医护人员和家属沟通不畅","C":"医务社工能帮助患者得到更好更适合的治疗和就医体验","D":"医务社工是促进医患有效沟通和医疗信息传递的桥梁"},"answer":"D","explanation":"文段首先介绍了现实中医护人员和患者及家属考虑问题的角度不同，容易引发医患关系紧张的问题。接着通过转折关联词“但是”引出“医务社工”这一话题，并通过“同时”引导并列，接着分别论述了医务社工可对患者提出诊疗建议，以及帮助患者理解诊疗方案这两方面的作用，即提高医患双方沟通效率，故文段重在强调医务社工在医患关系中发挥的连接和桥梁作用，对应D项。\nA项，“一定能够”表述过于绝对，排除；\nB项，“医患关系紧张的原因”对应转折前的内容，非重点，排除；\nC项，“能帮助患者得到更好更适合的治疗和就医体验”仅对应医务社工的一方面作用，表述片面，排除。\n故正确答案为D。\n【文段出处】《北青报：加强医务社会工作 助推医患和谐》","no":34,"missingImage":false},{"type":"question","qid":"4004633","cat":"片段阅读","stem":"如果从专业发展的角度看，同届不同专业的学生“混居”，不仅会拓展学生的知识面，从更多维度构建学生的知识结构，还会给学生带来非专业的专业视角。在4年或更长学习时间里相互交流，让学习理工科专业的学生从同住的学习文科专业的学生那里感受人文气息，同时也让学习文科专业的学生从学习理工科专业的学生那里熏陶到科学精神，这样的住宿“布局”，是不是更有利于培养视野宽阔的人才？\n这段文字旨在说明：","options":{"A":"“混居”模式帮助学生拓展知识结构","B":"“混居”模式的独特之处","C":"学生“混居”对人才培养的好处","D":"学生“混居”优势大于劣势"},"answer":"C","explanation":"文段开篇提出学生“混居”的话题，接着从知识层面、非专业视角以及被不同学科精神熏陶的角度介绍学生“混居”带来的积极意义，尾句通过指代词“这样”指代前文进行总结，强调学生“混居”的住宿“布局”有利于培养视野宽阔的人才，故文段旨在强调学生“混居”有利于人才培养，对应C项。\nA项，“拓展知识结构”仅为“混居”带来的好处之一，表述片面，排除；\nB项，“独特之处”偏离文段中心，未体现“混居”带来的好处，排除；\nD项，“优势大于劣势”文段未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】光明日报《不同专业学生“混居”不妨一试》","no":35,"missingImage":false},{"type":"question","qid":"4004640","cat":"片段阅读","stem":"对于外国游客而言，除了中国广袤大地上的壮美风光之外，中国的魅力还来自于传统文化。尽管目前入境游还未恢复，以入境游为业务的旅游企业却已在提前谋划布局。然而无论怎样，让外国游客发现中国文化的独特魅力，应成为这些企业的着力点和突破口。\n这段文字意在强调：","options":{"A":"外国游客被中国的传统文化所吸引","B":"旅游企业需做好向外国游客宣传讲解中国文化的日常工作","C":"旅游企业需提前计划安排好入境游业务","D":"引导外国游客发现中国文化魅力是旅游企业的工作关键"},"answer":"D","explanation":"文段开篇提出对于外国游客而言，中国的魅力不仅来自于壮美的风光，还来自于传统文化，随后进一步论述现在入境游虽未恢复，但以入境游为业务的旅游企业已在提前谋划布局，最后通过转折词“然而”引出文段重点，强调旅游企业应该让外国游客发现中国文化的独特魅力，对应D项。\nA项，“外国游客被中国的传统文化所吸引”对应文段首句，非重点，排除；\nB项，“宣传讲解中国文化的日常工作”文段未提及，无中生有，排除；\nC项，“需提前计划安排好入境游业务”与文段对策不一致，排除。\n故正确答案为D。\n【文段出处】人民日报海外版《旅游复苏 文化争先》","no":36,"missingImage":false},{"type":"question","qid":"4004644","cat":"片段阅读","stem":"数据只有在流动、分享、加工、处理的过程中才有价值，海量数据集合而成的大数据，在带来便利和机遇的同时，也产生了安全风险。找到保护和利用之间的平衡点，数据分级分类很有必要。一旦实现数据的分级分类，什么是可收集、使用、交易的一般信息，什么是不可使用、不可交易的个人隐私或敏感信息，就会有明确界定。相应的，根据数据级别和类别，就有了不同的安全防护措施和判断违规违法行为的依据。可见，数据分级分类既是数据安全治理过程的重要环节，也是数据精细化管控的依据。\n这段文字意在说明：","options":{"A":"数据分级分类可以防止数据泄露","B":"数据分级分类对于数据安全保障的重要性","C":"如何进行数据分级分类","D":"数据保护的必要性"},"answer":"B","explanation":"文段开篇指出数据在带来好处的同时也存在风险，紧接着提出解决问题的对策，即数据分级分类可平衡数据的保护和利用。随后说明数据分级分类带来的意义。尾句通过“可见”进行总结，再次重申数据分级分类对数据治理和管控的重要性。故文段为总分总结构，强调的重点为数据分级分类可减少数据使用的风险，对应B项。\nA项，“数据泄露”仅能对应“数据安全”，表述片面，排除；\nC项，“如何进行数据分级分类”无中生有，排除；\nD项，未提及文段主题词“数据分级分类”，偏离文段核心话题，排除。\n故正确答案为B。\n【文段出处】《数据分类，安全更有保障（微观）》","no":37,"missingImage":false},{"type":"question","qid":"4004652","cat":"片段阅读","stem":"一则报告显示，从数字化阅读方式的人群分布特征来看，中国成年数字化阅读方式接触者中，18-29周岁人群占31.7%，30-39周岁人群占24.8%，40-49周岁人群占23.1%，50-59周岁人群占12.8%。对倾向阅读形式的研究发现，36.7%的成年国民更倾向于“拿一本纸质图书阅读”，比2018年的38.4%下降了1.7个百分点；有43.5%的国民倾向于“手机阅读”，比2018年的40.2%上升了3.3个百分点。\n以下说法与原文不相符的是：","options":{"A":"中国成年数字化阅读接触者中，近八成是18-49周岁人群","B":"倾向手机阅读的读者比例有所上升","C":"超过半数成年国民倾向于数字化阅读方式","D":"18-29周岁人群在数字化阅读人群中所占比重最大"},"answer":"D","explanation":"A项，根据“18-29周岁人群占31.7%，30-39周岁人群占24.8%，40-49周岁人群占23.1%”可知，18-49周岁的数字化阅读接触者，共占79.6%，“近八成”为接近80%，表述正确，排除；\nB项，根据“有43.5%的国民倾向于‘手机阅读’，比2018年的40.2%上升了3.3个百分点”可知，倾向手机阅读的读者比例是上升的，表述正确，排除；\nC项，根据“对倾向阅读形式的研究发现，36.7%的成年国民更倾向于‘拿一本纸质图书阅读’”可知，成年国民“纸质图书阅读”的比例为36.7%，“数字化阅读方式”即“非纸质图书阅读”（包括“手机阅读”“电子阅读器阅读”“网页浏览”等方式），故“数字化阅读方式”比重应为100%-36.7%=63.3%，超过了50%，表述正确，排除；\nD项，根据“从数字化阅读方式的人群分布特征来看，中国成年数字化阅读方式接触者中，18-29周岁人群占31.7%，30-39周岁人群占24.8%，40-49周岁人群占23.1%，50-59周岁人群占12.8%”可知，文段论述的是“成年数字化阅读方式接触者”，而非所有人群，扩大范围，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《人均阅读量4.65本 人们越来越不爱读纸质书了吗？》","no":38,"missingImage":false},{"type":"question","qid":"4004658","cat":"片段阅读","stem":"穿着汉服等传统服饰、一次又一次地“复习”国乐跨界视频，是不少年轻人眼里的古风时尚。近些年古风逐渐被大众了解、接受并喜爱。古风文化作为一个圈层文化，尤其在年轻人中间有较大的吸引力。谈到“李某为什么这么火”时，业界普遍认为，除了得益于李某在商业运作上的高超得当，也与古风在时下的流行风潮密不可分。这归根结底是年轻人对传统文化的认同和向往。\n这段文字最后一句话中的“这”指的是：","options":{"A":"穿着汉服等传统服饰","B":"年轻人喜欢并追求古风文化","C":"李某为什么这么火","D":"古风对于大众的吸引力"},"answer":"B","explanation":"“这”出现在文段尾句，需要结合前文理解，且应指代前文的重点。文段开篇介绍了当下年轻人眼中的古风时尚，接下来通过程度词“尤其”强调古风文化受年轻人喜欢，并以李某为例进行论证。尾句通过指代词“这”指出古风文化受年轻人喜爱的根本原因。故“这”指代的内容为古风文化受年轻人喜爱，对应B项。\nA项，穿汉服仅为古风时尚的一种表现，表述片面，且缺少关键词“年轻人”，排除；\nC项，李某为文段举例部分的内容，并非“这”指代内容，排除；\nD项，该项强调“对于大众的吸引力”，而文段强调的是对年轻人的吸引力，排除。\n故正确答案为B。\n【文段出处】新华网《越来越多年轻人穿着汉服走上街头 会成为你的日常吗？》","no":39,"missingImage":false},{"type":"question","qid":"4004664","cat":"片段阅读","stem":"火热的短视频，为传统文化的传播提供了新的渠道。然而，进入各大短视频平台会发现，玩模仿秀、秀萌宠、拼搞笑、竞才艺、秀美食、炫技能等各种内容比比皆是，可跟传统文化有关的内容却少之又少，在全面复兴优秀传统文化的时代背景下，传统文化缘何缺席短视频平台？\n这段文字接下来最可能讲述的是：","options":{"A":"传统文化与短视频渠道的衔接","B":"传统文化大量通过短视频传播的原因","C":"传统文化应该怎么在短视频平台发展","D":"传统文化通过新媒体传播时面临的短板"},"answer":"D","explanation":"根据提问方式可知，本题为接语选择题。文段开篇引出短视频的话题，随后尾句通过转折提出问题，即在全面复兴优秀传统文化的背景下，短视频平台涉及传统文化的内容很少，短视频平台对传播传统文化起到的效果甚微。根据话题一致的原则，下文应围绕这一话题展开论述。D项，“面临的短板”是对尾句问题的具体论述，当选。\nA项，对应首句，前文已有论述，排除；\nB项，“传统文化大量通过短视频传播”与文意相悖，排除；\nC项，“应该怎么······发展”是对策表述，根据论述逻辑，提出问题后，应先分析问题，后给出对策，故D项更优，排除C项。\n故正确答案为D。\n【文段出处】《传播传统文化，不妨试试短视频》","no":40,"missingImage":false},{"type":"question","qid":"4004671","cat":"片段阅读","stem":"社交工具升级、社交能力降级，是当下年轻人群体的一种生活交际尴尬。当下许多年轻人自称的“社恐”尚未达到疾病的程度，只是一种对社交回避、抗拒的负面情绪，但这种带有倾向性的社交焦虑，却需引发人们关注。年轻人热衷线上社交的热闹，非但不能消解“社恐”焦虑，反而会拉大与他人的心理距离。\n这段文字接下来最可能讲述的是：","options":{"A":"年轻人群体“社恐”的危害","B":"年轻人群体“社恐”的发展","C":"年轻人群体“社恐”的表现","D":"年轻人群体“社恐”的成因"},"answer":"C","explanation":"由提问方式可知，本题为接语选择题，重点关注文段尾句。文段开篇指出社交能力降级是当下年轻人群体的生活交际尴尬，接下来通过转折词“但”指出虽然年轻人自认为的“社恐”只是一种负面情绪，但其带有的社会焦虑仍需引发人们的关注。最后文段尾句指出年轻人群体热衷线上社交非但不能消解“社恐”焦虑，还可能会带来问题，因此文段接下来应继续围绕年轻人群体“社恐”的表现进行具体展开，对应C项。\nA项，“危害”为带来的不良后果，应先论述完具体表现，然后论述其可能产生的危害，排除；\nB项，“‘社恐’的发展”与尾句话题不一致，排除；\nD项，按照逻辑顺序，应该先论述“‘社恐’的表现”再论述“‘社恐’的成因”，排除。\n故正确答案为C。\n【文段出处】《纾解年轻人“社恐”关键靠“自疗”》","no":41,"missingImage":false},{"type":"question","qid":"4004678","cat":"片段阅读","stem":"现代思维方式随着时代和实践的发展不断变化，形成了与传统思维方式区别很大的新角度、新方法。从静态性思维向动态性思维转变表现出系统综合性、动态开放性和自主创新性的特点。\n这段文字主要支持的观点是：","options":{"A":"现代思维方式与传统思维方式的研究方法不同","B":"现代思维方式注重新角度和新方法","C":"现代思维方式从静态向动态转变","D":"思维方式随着实践的发展而发展"},"answer":"C","explanation":"文段首先引出话题，即现代思维方式发生了变化，形成与传统思维方式不同的新角度、新方法，接着指出新角度、新方法体现在“从静态性思维向动态性思维转变”，并论述具体表现。故文段强调现代思维方式经历从静态向动态的思维转变，对应C项。\nA项，“研究方法”无中生有，且“方法不同”表述不够明确，排除；\nB项，“新角度和新方法”表述不明确，文段明确指出了“从静态性思维向动态性思维转变”，排除；\nD项，“思维方式”概念扩大，文段强调的是“现代思维方式”，排除。\n故正确答案为C。","no":42,"missingImage":false},{"type":"question","qid":"4004684","cat":"片段阅读","stem":"有人认为只有当经济发展到一定水平，才有可能有效地去治理环境。但是如果等到了严重污染后，再行治理，就需要花费数倍乃至数十倍的经济代价。因此，“先污染，后治理”的观点是不可取的。\n这段文字主要支持的观点是：","options":{"A":"环境治理花费较大","B":"环境治理应防治结合，以防为主","C":"环境问题事关个人切身利益","D":"经济发展要与环境相适应"},"answer":"B","explanation":"文段首先引出他人观点：环境治理要等经济发展到一定水平才能有效实施，即“先污染，后治理”，之后转折，强调环境如果污染严重将花费巨大的经济代价，否定了前文观点，最后“因此”进行总结，指出“先污染，后治理”是不可取的，也就是说应该及时治理环境污染，提前防治，避免污染的发生，对应B项。\nA项，对应“花费数倍乃至数十倍的经济代价”，为结论前内容，非文段重点，排除；\nC项，“个人切身利益”无中生有，排除；\nD项，文段强调如何治理环境污染，而非在探讨经济发展与环境之间的关系，且该项未提及主题词“环境治理”，偏离文段话题，排除。\n故正确答案为B。\n【文段出处】《中国再也不能走“先污染后治理”的发展道路》","no":43,"missingImage":false},{"type":"question","qid":"4004694","cat":"片段阅读","stem":"古往今来，诚信的力量从来都不曾被忽视。商鞅徙木立信的故事广为流传，季布一诺千金的佳话不绝于史，“信义兄弟”孙水林、孙东林兄弟20年信守承诺生死接力给农民工送薪。对个人而言，诚信是立身之本，是做人做事必须坚守的道德底线；对企业而言，诚信是无形资产，靠信誉打造品牌才能赢得百姓信赖。\n下列最适合做这段文字标题的是：","options":{"A":"言必信，行必果","B":"人而无信，不知其可也","C":"人无信不立","D":"巧诈不如拙诚"},"answer":"C","explanation":"文段首句引出“诚信”这一话题，接着通过商鞅、季布、孙水林、孙东林兄弟的事例来说明诚信的重要性，最后引出作者的看法，诚信是个人的立身之本，是企业赢得信赖的基础。故文段重点在尾句，强调诚信是个人立身之本，企业立足之基。C项“人无信不立”强调不讲信誉，不能立足于社会，与文段重点描述一致，当选。\nA项，“言必信，行必果”意为说话一定要算数，行动一定要坚决、果断，文段并未提及行动的坚决、果断，无中生有，排除；\nB项，“人而无信，不知其可也”意为人要是失去了信用或不讲信用，不知道他还可以做什么，虽然也能体现“诚信”的重要性，但C项明确指出信用是立身之本，排除；\nD项，“巧诈不如拙诚”意为巧智伪诈，不如笨拙而诚实，文中并未提及“伪诈”和“笨拙”，无中生有，排除。\n故正确答案为C。\n【文段出处】《让诚信成为一种习惯》","no":44,"missingImage":false},{"type":"question","qid":"4004697","cat":"片段阅读","stem":"微藻是一种古老的低等植物，广泛地分布在海洋、淡水湖泊等水域，种类繁多。微藻可直接利用阳光、二氧化碳和含氮、磷等元素的简单营养物质快速生长，并在细胞内合成大量油脂。因此，微藻为生物柴油生产提供了新的油脂资源。与大豆、油菜和麻疯树等油料植物相比，微藻的生长周期短，从初生到可以制油仅需一个星期左右，而大豆等油料植物一般需要几个月。此外，微藻的含油量高，油脂产率高，单位面积产油量是大豆的数百倍，每公顷可年产几万升生物柴油。微藻还不会占用耕地，利用滩涂、盐碱地、荒漠等，以及海水、荒溪地区的地下水等，就可以大规模地开发“微藻油田”，不会与农作物争地、争水。\n对上述文段理解错误的是：","options":{"A":"微藻种类很多且在海洋中可以找到它们的踪迹","B":"微藻的生命周期短，存活时间大约为一周","C":"油脂是在微藻的细胞内合成的","D":"微藻不占用耕地，不与农作物争水"},"answer":"B","explanation":"A项，根据“微藻是一种古老的低等植物，广泛地分布在海洋、淡水湖泊等水域，种类繁多”可知，表述正确，排除；\nB项，根据“与大豆、油菜和麻疯树等油料植物相比，微藻的生长周期短，从初生到可以制油仅需一个星期左右”可知，文段强调从初生到可以制油需一个星期左右，而非存活时间，表述错误，当选；\nC项，根据“微藻可直接利用阳光、二氧化碳和含氮、磷等元素的简单营养物质快速生长，并在细胞内合成大量油脂”可知，表述正确，排除；\nD项，根据“不会与农作物争地、争水”可知，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《微藻——可循环的“绿色油田”》","no":45,"missingImage":false},{"type":"question","qid":"4004712","cat":"语句表达","stem":"有人说，书香是一座城市最亲切的味道。一看到新华书店的招牌，就想起儿时无数个周末的阅读时光；离家最近的图书馆里，某排架子上还静静躺着曾在迷茫时汲取力量的那册书；越来越丰富的数字阅读资源，不经意间一翻就有意想不到的收获。在安静的书架间，无论是本地居民，还是外来务工者，都有一个共同的名字：                    。\n填入画横线部分最恰当的一项是：","options":{"A":"学者，在安静的图书馆里，徜徉在知识的海洋","B":"学生，在一本本书中，渴求地汲取力量","C":"普通人，都在努力地汲取知识，获得力量","D":"读者，在书香的氤氲中，他们获得同样的滋养"},"answer":"D","explanation":"横线在文段结尾，所填语句对前文起总结的作用。文段开篇指出书香是一种亲切的味道，并通过并列的分句具体说明书店的招牌、书架上的书、数字阅读资源所带来的亲切感。文段尾句以书架间为场景，指出本地居民和外来务工者在这里都有一个共同的名字、身份，即都是读者，对应D项。\nA项“学者”、B项“学生”均不能全面准确地概括“本地居民”及“外来务工者”的身份，排除；对比C、D两项，D项“读者”比C项“普通人”更加契合“在书架间阅读”的场景，且D项“书香”与文段首句呼应更准确，排除C项。\n故正确答案为D。\n【文段出处】《文化是城市的灵魂》","no":46,"missingImage":false},{"type":"question","qid":"4004723","cat":"语句表达","stem":"。可是，由于不能考驾照，一些超龄老年人纷纷选择老年代步车作为出行工具，反而带来新的安全隐患。首先，老年代步车的质量参差不齐，不少“三无产品”充斥其中，安全系数低。其次，老年人上路前没有经过专业驾驶技术培训，对各项交通法规更是一知半解，很容易造成交通违法行为，引发道路交通事故。\n填入画横线部分最恰当的一项是：","options":{"A":"开车是个技术活，能否申请驾照主要看当事人的身体情况","B":"由于人们生活水平的不断提高和人均寿命的不断延长，老年人的身体素质普遍提高","C":"设置申请驾照年龄上限的初衷，是确保驾驶者的身体能力，保障道路交通安全","D":"老年人开车有自身的优势，小心谨慎、心态平和，遇到“斗气车”也不会去较劲儿"},"answer":"C","explanation":"横线出现在文段开头，需结合后文内容进行分析。根据横线后转折词“可是”可知，横线处所填内容与后文内容构成转折，后文指出超龄老人不能考驾照带来新的安全隐患，接着通过并列结构具体阐述。故横线处应表示超龄老人不能申请驾照的合理性，对应C项。\nA项，“能否申请驾照主要看当事人的身体情况”强调申请驾照与身体状况之间的关系，而文段论述的是申请驾照与年龄的关系，与后文衔接不当，排除；\nB项，“老年人的身体素质”并非文段讨论的话题，与后文衔接不当，排除；\nD项，“老年人开车有自身的优势”与文段论述的超龄老人不能考驾照表意矛盾，排除。\n故正确答案为C。\n【文段出处】中国青年报《取消申请驾照年龄上限必要且可行》","no":47,"missingImage":false},{"type":"question","qid":"4004738","cat":"语句表达","stem":"。然而，随着我国经济快速发展，人民生活水平日益提高，婚俗悄然“变味”。“辛辛苦苦几十年，一婚回到贫困线”不是段子，而是屡见不鲜的现实。动辄十几万到几十万不等的惊人“天价彩礼”，高攀不起的“份子钱”，一摆就是几十桌甚至上百桌的豪华婚宴，尽显低俗甚至触及法律底线的“婚闹”······凡此种种，不一而足，婚俗中的一些不正之风，打着传统文化的旗号，传播的却是不健康、不文明的文化气息。\n填入画横线部分最恰当的一项是：","options":{"A":"最令人深恶痛绝的是无底线的低俗乃至愚俗的“婚闹”","B":"文明的婚俗，是践行社会主义核心价值观的生动实现，是良好社会风尚的重要载体","C":"婚俗礼仪传承千年，全国各地已形成了各具特色的婚礼习俗，也成为传统文化的重要组成部分","D":"婚俗之“俗”，乃传统习俗、公序良俗之意，绝无半点庸俗、低俗的味道"},"answer":"D","explanation":"横线出现在文段开头，需结合后文内容进行分析。后文通过“然而”引导转折，指出随着经济快速发展和人民生活水平的日益提高，婚俗悄然“变味”，并举例说明。尾句“凡此种种”对前文进行总结，指出婚俗中存在不正之风，传播不健康、不文明的文化气息。故后文着重强调婚俗“变味”了，存在“不健康、不文明”的情况，横线处应体现出婚俗“变味”之前的状态，即“婚俗”是积极的、正向的，非“不健康、不文明”的。D项体现出婚俗原本传递的价值观是积极的，而非庸俗、低俗的，当选。\nA项，“最令人深恶痛绝的是无底线的低俗乃至愚俗的‘婚闹’”，没有提到“婚俗”这一话题，与后文无法构成转折，排除；\nB项，“社会主义核心价值观”“良好社会风尚”文段未提及，与后文衔接不当，排除；\nC项，“全国各地已形成了各具特色的婚礼习俗”文段未提及，与后文衔接不当，排除。\n故正确答案为D。\n【文段出处】《提倡婚俗新风尚，遏制不正之风》","no":48,"missingImage":false},{"type":"question","qid":"4004744","cat":"片段阅读","stem":"迈克尔博士在酵母菌、线虫和果蝇身上试验了一种药物，能够在其他任何条件都不变的情况下延长这三种常用模型生物的寿命。其中酵母菌的寿命延长了17％，线虫和果蝇的寿命延长了10％左右，换算成人类的话大概相当于多活8年。什么药物居然能有这么神奇的功效呢？答案是布洛芬，药店里随便可以买到的止痛药。如此普通而又廉价的小药片居然还能增寿？会不会是试验误差呢？检索一下论文数据库就可以知道，这个发现不是偶然的，还有好几个实验室得出过类似的结论，只可惜类似试验尚未在人类身上做过。\n下列说法和文段相符的是：","options":{"A":"好几个实验室都做过和迈克尔博士一样的研究","B":"事实证明布洛芬可以延长人类8年的寿命","C":"布洛芬是人们普遍使用的止痛药","D":"布洛芬是否能够延长人类寿命还有待研究"},"answer":"D","explanation":"A项，根据“还有好几个实验室得出过类似的结论”可知，文段仅提到得出的结论类似，并未提及其他几个实验室做的研究是否和迈克尔博士一样，无中生有，排除；\nB项，根据“其中酵母菌的寿命延长了\u003cimg data-k=\"b579423d43a8\">，线虫和果蝇的寿命延长了\u003cimg data-k=\"fc324c3b9ecb\">左右，换算成人类的话大概相当于多活8年”可知，文段中介绍的是布洛芬延长了酵母菌、线虫和果蝇的寿命，并非人类的寿命，偷换概念，排除；\nC项，根据“布洛芬，药店里随便可以买到的止痛药。如此普通而又廉价的小药片”可知，文段仅介绍布洛芬廉价且容易获得，并未提及是否被人们“普遍使用”，无中生有，排除；\nD项，根据“只可惜类似试验尚未在人类身上做过”可知，布洛芬在人类身上的效果还是未知，表述正确，当选。\n故正确答案为D。\n【文段出处】《世间已有长寿药？》","no":49,"missingImage":false},{"type":"question","qid":"4004746","cat":"语句表达","stem":"①一出门，一阵微风轻轻地拂过我的脸颊，拂过山上的树木，发出沙沙的声音，也带来了清新的空气和泥土的芳香\n②皎洁的月光倾泻下来，如流水般洒向大地，给万物披上了一层银白色\n③夏天的夜晚，不像白天那样炎热，很凉爽\n④受不了家里的闷热，我决定出去看看\n⑤不像中秋的月亮那样圆润美丽，却别有一番风韵\n⑥深蓝色的天空犹如一块巨大的幕布，挡住了太阳，上面挂着一轮弯弯的明月\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"④①⑥②⑤③","B":"⑥⑤②③④①","C":"④①③⑥⑤②","D":"⑥④①②⑤③"},"answer":"C","explanation":"对比选项，确定首句。④句中提到了作者要“出去看看”，⑥句中提到了“天空”和“明月”，根据日常逻辑，应先离开家来到外面，才能看到“天空”和“明月”，故④句适合作首句，排除B、D两项。\n继续寻找其他线索，⑤句中提到了“不像中秋的月亮那样圆润美丽”，故前一句应提到不圆的月亮，对比A、C两项，⑥句中提及“弯弯的明月”，而②句围绕“月光”展开，故⑥⑤两句捆绑恰当，C项当选。\n故正确答案为C。\n【文段出处】《乡村夏夜散文》","no":50,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"4004708","cat":"数学运算","stem":"8个包装盒里面分别装有17、19、26、27、35、40、42、50包小蛋糕，小李先取走一盒，其余的被小王、小周、小孙拿走，已知小王和小周取走的蛋糕包数相同，并且是小孙拿走的两倍，则小王取走的盒子里面的蛋糕包数最可能是：","options":{"A":"19、26、35","B":"19、35、42","C":"17、27、26","D":"17、35、40"},"answer":"D","explanation":"方法一：8个包装盒里面共装有小蛋糕\u003cimg data-k=\"c0d385a3d7d4\">\u003cimg data-k=\"075bc4b908f1\">\u003cimg data-k=\"ec3a801f7230\">包。代入选项，小王、小周、小孙、小李拿走的小蛋糕包数如下表所示：\n\u003cimg data-k=\"2b0423332e44\" style=\"max-width:636px\">\n因小李拿走一盒，A、B、C三项中小李拿走的小蛋糕包数在题干中不存在，只有D项后小李拿走的26包在题干中存在。\n方法二：8个包装盒里面共装有小蛋糕\u003cimg data-k=\"c0d385a3d7d4\">\u003cimg data-k=\"075bc4b908f1\">\u003cimg data-k=\"ec3a801f7230\">包，设小李拿走\u003cimg data-k=\"5320a525f2bc\">包，小孙拿走\u003cimg data-k=\"c1beececd683\">包，则小王和小周分别拿走\u003cimg data-k=\"757c328cd016\">包。\u003cimg data-k=\"679b7b054362\">，即\u003cimg data-k=\"e1a11598f52c\">，因\u003cimg data-k=\"b97c8422dd2a\">的尾数为0或5，因此\u003cimg data-k=\"5320a525f2bc\">的尾数只能是6或1，结合题干数据，\u003cimg data-k=\"5320a525f2bc\">只能取值26。代入解得\u003cimg data-k=\"e07f2d2d17d8\">，则\u003cimg data-k=\"460f9c8990e1\">，即小王共拿走92包，\u003cimg data-k=\"d73f0c4d41e9\">包，只有D项符合要求。\n故正确答案为D。","no":51,"missingImage":false},{"type":"question","qid":"4004725","cat":"数学运算","stem":"已知某宾馆共有30个房间，一名清洁工拿着30把钥匙，她只知道一把钥匙开一把锁，但是不知道哪把钥匙开哪把锁，现在她要打扫每一间房子，需要将钥匙和房间一一匹配，她最多要试多少次？","options":{"A":"365","B":"385","C":"435","D":"465"},"answer":"C","explanation":"30个房间有30把锁，第1把钥匙最多试开29次，因为如果29次都打不开锁，那么不必再试，剩余的这把钥匙肯定是第30把锁的钥匙；依次类推，第2把钥匙最多试开28次；第3把钥匙最多试开27次······第29把钥匙最多试开1次；最后剩下的1把钥匙和1把锁必匹配，即试开0次。故将钥匙和房间一一匹配最多试开\u003cimg data-k=\"091c3b1ac743\">\u003cimg data-k=\"00b4f04148ef\">次。\n故正确答案为C。","no":52,"missingImage":false},{"type":"question","qid":"4004735","cat":"数学运算","stem":"某仓库有一批货物以75%的利润率出售，售出90%后，剩下的货物全部以6折出售，那么这批货物的最终利润率为：","options":{"A":"68%","B":"62%","C":"54%","D":"51%"},"answer":"A","explanation":"赋值此批货物为10件，每件成本100元，则总成本为\u003cimg data-k=\"dab5444976a9\">元。出售过程列表如下：\n\u003cimg data-k=\"5bf085133c8d\" style=\"max-width:622px\">\n此批货物总利润为\u003cimg data-k=\"cc96e460d99b\">元，最终利润率为\u003cimg data-k=\"1df750787278\">。\n故正确答案为A。","no":53,"missingImage":false},{"type":"question","qid":"4004743","cat":"数学运算","stem":"甲乙两人同时沿直线跑道两端匀速相向而行，两人第一次迎面相遇时距跑道中点50米，两人到达跑道尽头时立即掉头重新出发，重新出发后两人第二次相遇，第二次两人相遇也为迎面相遇，且距跑道中点150米。则此时两人中速度较快一人比速度较慢一人多行走多少米？","options":{"A":"150","B":"400","C":"200","D":"300"},"answer":"D","explanation":"假设甲比乙快，则两人第一次相遇时距离中点50米处应在靠近乙的一侧，此时\u003cimg data-k=\"cefd8a2895a5\">米，\u003cimg data-k=\"9f5faacfc642\">米，故\u003cimg data-k=\"9e821fcba35f\">米。根据多次相遇问题公式：\u003cimg data-k=\"ec0bfc36c757\">\u003cimg data-k=\"77e8fb6c1523\">，第一次相遇时\u003cimg data-k=\"080ca1bd8c35\">，第二次相遇时\u003cimg data-k=\"fd93197dddd8\">，可得\u003cimg data-k=\"7a48d6c93eb4\">。\u003cimg data-k=\"a708df1f25de\">，\u003cimg data-k=\"51544384fb77\">，可得\u003cimg data-k=\"1574e685d153\">，同理\u003cimg data-k=\"589f2b4fbdb5\">，故\u003cimg data-k=\"92d06632db11\">\u003cimg data-k=\"cac11f31afbe\">\u003cimg data-k=\"2fae39e2a30f\">\u003cimg data-k=\"cef8f9db7017\">米，即第二
