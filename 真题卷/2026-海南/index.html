t":"数学运算","stem":"小刘在某APP上学习党史知识，第一天有若干道题，答完8道后，剩下未答完的题目数量自动增加一倍；第二天答8道题，剩下未答完的题目数量又增加一倍；第三天答8道题后正好答完，问第一天开始时有多少道题？","options":{"A":"14","B":"15","C":"16","D":"17"},"answer":"A","explanation":"方法一：设第一天开始时有x道题，每天剩余题目如下：\n\u003cimg data-k=\"47ff15b363eb\" style=\"max-width:610px\">\n根据题干第三天答8道题后正好答完，可得方程：\u003cimg data-k=\"d287692b59d1\">，解得：x=14。故第一天开始时有14道题。\n方法二：根据题意，第二天答题剩余题目增加一倍后的题量，第三天答8道题后正好答完，考虑代入排除法：\n代入A项，当第一天开始有14道题时，第一天答题完毕剩余题量为14-8=6道，增加一倍后剩余题目为2×6=12道，第二天答题完毕剩余题量为12-8=4道，增加一倍后剩余题目为4×2=8道，第三天答8道题后正好答完，符合题意，当选；\n代入B项，当第一天开始有15道题时，第一天答题完毕剩余题量为15-8=7道，增加一倍后剩余题目为2×7=14道，第二天答题完毕剩余题量为14-8=6道，增加一倍后剩余题目为2×6=12道，第三天答8道题后不能正好答完，排除；\n代入C项，当第一天开始有16道题时，第一天答题完毕剩余题量为16-8=8道，增加一倍后剩余题目为2×8=16道，第二天答题完毕剩余题量为16-8=8道，增加一倍后剩余题目为2×8=16道，第三天答8道题后不能正好答完，排除；\n代入D项，当第一天开始有17道题时，第一天答题完毕剩余题量为17-8=9道，增加一倍后剩余题目为2×9=18道，第二天答题完毕剩余题量为18-8=10道，增加一倍后剩余题目为2×10=20道，第三天答8道题后不能正好答完，排除。\n故正确答案为A。\n备注：代入A项符合题目所有条件，其他选项无需代入。","no":65,"missingImage":false},{"type":"question","qid":"16069866","cat":"数学运算","stem":"某电脑设有6位开机密码，且每一位密码都是字母a、b、c、d中的一个。若密码必须包含a、b字母至少各1个，且首尾字母相同，问符合要求的密码有多少种？","options":{"A":"320","B":"450","C":"570","D":"960"},"answer":"C","explanation":"根据题意，出现至少······，正面考虑较为复杂，可以从反面考虑。\n即：正面情况数=总情况数-反面情况数。\n总情况数即首尾字母相同，中间位置字母任选：\n第一步：确定首尾字母，有a、b、c、d共\u003cimg data-k=\"be99391be9cc\">种选择；\n第二步：确定中间4个位置，每个位置都可从4个字母中任选，共\u003cimg data-k=\"f626f3d20a33\">种选择；\n总情况数=4×256=1024种情况。\n反面情况数可分类讨论：\n根据两集合容斥原理，反面情况数=不含a的情况数+不含b的情况数-既不含a也不含b的情况数（重复计算部分）\n①不含a的情况：即所有位置只有b、c、d共3个字母可供选择。\n第一步：确定首尾字母，有b、c、d共\u003cimg data-k=\"d911159e6c76\">种选择；\n第二步：确定中间4个位置，每个位置都可从3个字母中任选，共\u003cimg data-k=\"7b51713100b6\">种选择；\n不含a的情况数=3×81=243种情况；\n②不含b的情况：即所有位置只有a、c、d共3个字母可供选择。\n第一步：确定首尾字母，有a、c、d共\u003cimg data-k=\"d911159e6c76\">种选择；\n第二步：确定中间4个位置，每个位置都可从3个字母中任选，共\u003cimg data-k=\"7b51713100b6\">种选择；\n不含b的情况数=3×81=243种情况；\n③既不含a也不含b的情况：即所有位置只有c、d共2个字母可供选择。\n第一步：确定首尾字母，有c、d共\u003cimg data-k=\"629f7f5df0db\">种选择；\n第二步：确定中间4个位置，每个位置都可从2个字母中任选，共\u003cimg data-k=\"0ad59e57faf7\">种选择；\n既不含a也不含b的情况数=2×16=32种情况；\n所以，反面情况数=243+243−32=454种。\n因此，正面情况数=总情况数-反面情况数=1024−454=570种。\n故正确答案为C。","no":66,"missingImage":false}],"count":14,"answerable":14,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"16069886","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性：\n\u003cimg data-k=\"5529306488dc\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相同，但无明显位置规律，也无明显属性规律，考虑数量规律。观察发现，题干图形均存在大面积黑块，且黑块有明显分堆，优先考虑黑白块的部分数。第一组图形中，黑块部分数依次为1、2、3，第二组前两幅图形的黑块部分数依次为1、2，故“？”处图形的黑块部分数应为3，只有B项符合。\n故正确答案为B。","no":67,"missingImage":false},{"type":"question","qid":"16069776","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性：\n\u003cimg data-k=\"83992ac7e6f5\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形封闭面明显，优先考虑面数量。题干图形的面数量均为7，因此“？”处图形的面数量应为7，D项图形的面数量为8，排除。继续观察发现，题干图形内部均由直线和曲线构成，其中全直线面数量依次为5、4、3、2、1，呈递减规律，故“？”处图形的全直线面数量应为0，只有C项符合。\n故正确答案为C。","no":68,"missingImage":false},{"type":"question","qid":"16069800","cat":"图形推理","stem":"以下哪两个图形交换位置之后，整个图形序列将呈现一定的规律性？\n\u003cimg data-k=\"b7b97f07474f\" style=\"max-width:600px\">","options":{"A":"②和③","B":"③和④","C":"④和⑤","D":"⑤和⑥"},"answer":"D","explanation":"解析一：元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干每幅图形的内部线条均与外框相交，且内部线条与外框的交点数均为3。继续观察发现，图①到图④的3个框上交点每次沿顺时针方向移动一个边，交换图⑤和图⑥后，六个图形交点移动规律连贯，对应D项。\n解析二：元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干每幅图都是一个六边形被内部线条分割成3个面，其中有且只有一个面与外边框有3条边重合，观察这3条重合边，图①到图④的3条重合边每次沿顺时针方向移动一个边，交换图⑤和图⑥后，六个图形的3条重合边移动规律连贯，对应D项。\n故正确答案为D。","no":69,"missingImage":false},{"type":"question","qid":"15833801","cat":"图形推理","stem":"经过A、B、C三点所截出的图形为：\n\u003cimg data-k=\"23515b0470fb\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查截面图。根据小正方体与大多面体的接触方式可发现，大多面体的e、f面的夹角为钝角，所以经过A、B、C三点不能截出矩形面，排除A、B项，再根据边的比例关系排除C项(截面如图1所示)。\n\u003cimg data-k=\"d99a6c794cbd\" style=\"max-width:400px\">\n故正确答案为D。","no":70,"missingImage":false},{"type":"question","qid":"16070128","cat":"图形推理","stem":"左下图为14个白色、2个灰色和2个黑色正方体组成的多面体的左视图和主视图，问哪一项可能是其正确的俯视图？（    ）\n\u003cimg data-k=\"b80d7ff16d15\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查三视图。根据主视图可知，该多面体的右上方没有正方体；根据左视图可知，该多面体的中后方没有正方体；根据所有选项俯视图可知，该多面体的左前方没有正方体，此时对于3×3×3形式的大立方体来说，该多面体应缺失9个小正方体。又已知该多面体有14个白色、2个灰色和2个黑色共计18个小正方体，故该多面体的其他位置均应存在小正方体。\n结合左视图、主视图，可以确定符合要求的立体图形如下图所示。\n\u003cimg data-k=\"9aebd4324875\" style=\"max-width:211px\">\n立体图形对应的俯视图如下图所示，对应A项。\n\u003cimg data-k=\"d4c105983b07\" style=\"max-width:133px\">\n故正确答案为A。","no":71,"missingImage":false},{"type":"question","qid":"16070026","cat":"定义判断","stem":"情绪方言是特定文化或亚文化群体中形成的社会性情绪表达系统，其通过共享的符号规则、行为模式及认知框架，在群体内部传递、识别并规范情绪体验，具有地域性、传承性，且能与其他文化群体的情绪表达模式形成显著区分。\n根据上述定义，下列不属于情绪方言的是（    ）。","options":{"A":"北极圈某游牧部落的成员通过凝视积雪反光角度的细微变化，传递对猎物的敬畏等复杂情绪","B":"某沙漠贸易群体在扎营时，用靴尖绘制族群特定沙纹图案表达情绪，如螺旋表交易诚意，折线表怀疑等","C":"某海岛社群在集体捕鱼前吟唱特定旋律，代表对海洋风险的集体忧虑，而外来者常误以为是普通劳作号子","D":"某公司业务分淡季、旺季，公司员工也逐渐形成了喝浓缩咖啡代表旺季工作压力大，喝奶茶代表淡季工作舒心的职场亚文化默契"},"answer":"D","explanation":"第一步：找出定义关键词。\n“特定文化或亚文化群体中形成的社会性情绪表达系统”、“通过共享的符号规则、行为模式及认知框架，在群体内部传递、识别并规范情绪体验”、“具有地域性、传承性，且能与其他文化群体的情绪表达模式形成显著区分”。\n第二步：逐一分析选项。\nA项：北极圈某游牧部落的成员通过凝视积雪反光角度的细微变化传递复杂情绪，属于特定地域文化群体的符号化情绪表达，具有鲜明传承性和文化区分性，符合“特定文化或亚文化群体中形成的社会性情绪表达系统”、“通过共享的符号规则、行为模式及认知框架，在群体内部传递、识别并规范情绪体验”、“具有地域性、传承性，且能与其他文化群体的情绪表达模式形成显著区分”，符合定义，排除；\nB项：某沙漠贸易群体用特定沙纹图案表达情绪，是群体内部共享的符号系统，具有地域性、传承性和文化特异性，符合“特定文化或亚文化群体中形成的社会性情绪表达系统”、“通过共享的符号规则、行为模式及认知框架，在群体内部传递、识别并规范情绪体验”、“具有地域性、传承性，且能与其他文化群体的情绪表达模式形成显著区分”，符合定义，排除；\nC项：某海岛社群以吟唱特定旋律传递集体忧虑，是群体内部传承的情绪表达模式，外来者难以理解，体现文化区分性，符合“特定文化或亚文化群体中形成的社会性情绪表达系统”、“通过共享的符号规则、行为模式及认知框架，在群体内部传递、识别并规范情绪体验”、“具有地域性、传承性，且能与其他文化群体的情绪表达模式形成显著区分”，符合定义，排除；\nD项：某公司员工以饮品习惯隐喻工作压力，虽是职场亚文化中的情绪默契，但缺乏地域性、传承性及显著的文化区分特征，更接近临时性、情境化的职场习惯，不符合“具有地域性、传承性，且能与其他文化群体的情绪表达模式形成显著区分”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"16070062","cat":"定义判断","stem":"环境福利绩效是衡量经济活动主体在实现经济目标过程中，对生态环境带来积极影响程度的综合指标。它涵盖资源利用效率、污染减排成效、生态系统保护成果等多个维度，评估在获取经济收益的同时，为生态环境创造的福利增值，旨在全面反映经济活动对环境改善的贡献，以推动可持续发展模式的构建。\n根据上述定义，下列不属于环境福利绩效的是（    ）。","options":{"A":"某大型企业在塌陷区铺设光伏板，年发电4.8亿度，与此同时还雇佣了300名失业矿工担任运维人员","B":"某企业车队将车辆全部更换为纯电动车，虽然因购车支出挤占培训经费3亿元，但同时可降低碳排放15%","C":"某市划拨经费改造透水路面等生态设施，大大降低了内涝发生率，同时减少排水管网维修支出1.2亿元/年","D":"某钢铁厂将余热接入市政供暖，替代燃煤锅炉，减少PM2.5排放41%，覆盖区域冬季呼吸道疾病就诊量下降29%"},"answer":"C","explanation":"第一步：找出定义关键词。\n“在实现经济目标过程中”、“对生态环境带来积极影响”。\n第二步：逐一分析选项。\nA项：某大型企业在塌陷区铺设光伏板以此发电，符合“在实现经济目标过程中”，光伏是清洁能源，减少了化石能源的使用，同时塌陷区得到开发利用，符合“对生态环境带来积极影响”，符合定义，排除；\nB项：某企业车队将车辆全部更换为纯电动车，符合“在实现经济目标过程中”，降低碳排放15%，符合“对生态环境带来积极影响”，符合定义，排除；\nC项：某市划拨经费改造透水路面等生态设施，属于城市公共基础设施与生态治理工程，并非经济活动主体追求经济目标的行为，不符合“在实现经济目标过程中”，不符合定义，当选；\nD项：某钢铁厂将余热接入市政供暖，符合“在实现经济目标过程中”，减少PM2.5排放41%，符合“对生态环境带来积极影响”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"16069992","cat":"定义判断","stem":"人口粘性是以人口迁移惰性与地理空间稳定性为核心特征的社会地理现象，指特定区域内居民因资源依赖、社会交往、文化认同或制度约束等因素，形成对原居地的长期驻留倾向，抑制人口外迁动力，从而维持或强化区域人口规模与结构稳定性。\n根据上述定义，下列属于人口粘性的是（    ）。","options":{"A":"老刘退休后搬迁至深圳和子女一起生活，但每年清明节都会返乡扫墓","B":"在上海打工的赵某十年来一直租住在房租低廉的城中村，虽然日均通勤3小时，但仍不打算迁离","C":"山东农户李某每年冬季赴海南种植反季瓜菜，春季返乡务农，虽然每年往返，但多了一份额外收入","D":"煤矿工人孙某因国企改制获得矿区住房产权，子女教育依托企业附属学校，尽管薪资偏低仍拒绝南下务工"},"answer":"D","explanation":"第一步：找出定义关键词。\n“资源依赖、社会交往、文化认同或制度约束”、“对原居地的长期驻留倾向”。\n第二步：逐一分析选项。\nA项：老刘退休后搬去深圳，每年清明节返乡扫墓，说明老刘已经搬走、定居外地，只是偶尔回去，不符合“对原居地的长期驻留倾向”，不符合定义，排除；\nB项：赵某在上海城中村租房，说明赵某并非长期驻留原居地，不符合“对原居地的长期驻留倾向”，不符合定义，排除；\nC项：李某冬季去海南，春季回山东务农，说明李某并非长期驻留原居地，不符合“对原居地的长期驻留倾向”，不符合定义，排除；\nD项：孙某有矿区住房产权、子女在企业附属学校上学，薪资低也不南下，说明是对矿区住房产权及子女企业附属学校有资源依赖，符合“资源依赖、社会交往、文化认同或制度约束”，且薪资偏低也拒绝南下，说明确实存在长期驻留倾向，符合“对原居地的长期驻留倾向”，符合定义，当选。\n故正确答案为D。","no":74,"missingImage":false},{"type":"question","qid":"16069978","cat":"定义判断","stem":"种间互作是一种以跨物种直接或间接影响为核心特征的生态学现象，不同物种通过竞争、捕食、互利共生等关系，在资源利用、空间分配或生理功能上产生动态关联，驱动群落结构演化、物种适应性分化及生态系统功能维持，其作用机制可表现为促进、抑制或协同进化。\n根据上述定义，下列属于种间互作的是（    ）。","options":{"A":"一西伯利亚狼群中的两只公狼因争夺头狼地位发生争斗，导致群体内部等级重构","B":"酸雨导致土壤pH值下降，间接影响蚯蚓与植物根系之间通过养分循环的共生关系","C":"旱季来临，持续的干旱导致塞伦盖蒂草原的羚羊与斑马同时向植物茂盛的水源地迁徙","D":"兔子感染某类寄生虫后行动迟缓更易被郊狼捕食，郊狼继而成为了寄生虫的新宿主，该类寄生虫由此提高了传播效率"},"answer":"D","explanation":"第一步：找出定义关键词。\n“跨物种直接或间接影响”、“不同物种”、“竞争、捕食、互利共生等关系”、“资源利用、空间分配或生理功能上产生动态关联”、“驱动群落结构演化、物种适应性分化及生态系统功能维持”。\n第二步：逐一分析选项。\nA项：西伯利亚狼群中的两只公狼属于同一物种，不符合“不同物种”，不符合定义，排除；\nB项：酸雨导致土壤pH值下降，间接影响蚯蚓与植物的共生关系，是外在环境因素对这两个物种的关系产生了影响，并非物种之间的直接或间接相互作用，不符合“跨物种直接或间接影响”、“资源利用、空间分配或生理功能上产生动态关联”、“驱动群落结构演化、物种适应性分化及生态系统功能维持”，不符合定义，排除；\nC项：羚羊与斑马同时向植物茂盛的水源地迁徙，是受干旱环境影响的被动行为，并非物种之间的直接或间接相互作用，不符合“跨物种直接或间接影响”、“资源利用、空间分配或生理功能上产生动态关联”、“驱动群落结构演化、物种适应性分化及生态系统功能维持”，不符合定义，排除；\nD项：兔子、寄生虫、郊狼，符合“不同物种”，寄生虫感染兔子使得兔子更易被郊狼捕食，郊狼捕食兔子后成为寄生虫新宿主提升了寄生虫的传播效率，符合“跨物种直接或间接影响”、“竞争、捕食、互利共生等关系”、“资源利用、空间分配或生理功能上产生动态关联”、“驱动群落结构演化、物种适应性分化及生态系统功能维持”，符合定义，当选。\n故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"16069983","cat":"定义判断","stem":"差错导向是指个体对错误本身以及应对错误方式的主观看法，差错掩盖导向指个体出于自我形象或短期利益的维护而产生对负面评价或惩罚的恐惧，倾向于通过否认、隐藏或推卸责任等方式掩盖错误，避免他人察觉。差错学习导向指个体以开放的心态将错误视为改进机会，主动反思错误原因、总结经验并积极调整行为以实现自我提升。\n根据上述定义，下列属于差错学习导向的是（    ）。","options":{"A":"某餐厅食材变质导致多名顾客食物中毒，餐厅经理把原因归结为“厨师与采购沟通不足，导致食材新鲜度不达标”","B":"某三甲医院建立“无惩罚差错上报系统”，医护人员可匿名分享失误案例以供全院学习","C":"小赵在考试失利后大量刷题，但拒绝分析错题原因导致相同知识点反复出错","D":"某企业宣称“已从用户数据泄露事件中汲取教训”，但并未升级安全系统"},"answer":"B","explanation":"第一步：找出定义关键词。\n差错导向：“个体对错误本身以及应对错误方式”、“主观看法”；\n差错掩盖导向：“个体出于自我形象或短期利益的维护”、“对负面评价或惩罚的恐惧”、“通过否认、隐藏或推卸责任等方式掩盖错误”、“避免他人察觉”；\n差错学习导向：“个体以开放的心态将错误视为改进机会”、“主动反思并积极调整行为”、“以实现自我提升”。\n第二步：逐一分析选项。\nA项：餐厅经理将中毒事件简单归咎于沟通不足，未主动反思问题根源、未总结经验、未采取改进措施，不符合“主动反思并积极调整行为”、“以实现自我提升”，不符合“差错学习导向”定义，排除；\nB项：医院建立无惩罚差错上报系统，医护人员可匿名分享失误案例以供学习，符合“个体以开放的心态将错误视为改进机会”、“主动反思并积极调整行为”、“以实现自我提升”，符合“差错学习导向”定义，当选；\nC项：小赵拒绝分析错题原因，不符合“主动反思并积极调整行为”，不符合“差错学习导向”定义，排除；\nD项：企业未升级安全系统，不符合“主动反思并积极调整行为”，不符合“差错学习导向”定义，排除。\n故正确答案为B。","no":76,"missingImage":false},{"type":"question","qid":"16069990","cat":"定义判断","stem":"解构式技能重组是一种主动的学习策略，指学习者为突破复杂技能的学习瓶颈，有意识地将目标技能分解为若干个独立的、可单独训练的核心子模块，然后对这些子模块进行高强度的专项练习，待各模块熟练后，再将其重新整合，最终实现对整体技能的精通。\n根据上述定义，下列属于解构式技能重组的是（    ）。","options":{"A":"某厨师学徒严格按照菜谱，从食材处理到火候掌握一步步学习制作一道新派融合菜，最终成功复刻了这道菜肴","B":"小赵为准备一场重要演讲，将自己以往演讲中反响最好的几个案例和金句进行重新编排和串联，形成了一套全新的演讲稿","C":"为提高百米自由泳成绩，某游泳运动员聘请体能师进行为期三个月的核心力量与腿部爆发力专项训练，有效增强划水与打腿效果","D":"小高为提升篮球突破能力，认真练习了变向运球、篮下脚步和非惯用手上篮动作，并在对抗训练中流畅组合运用，得分效率大增"},"answer":"D","explanation":"第一步：找出定义关键词。\n“学习者为突破复杂技能的学习瓶颈”、“将目标技能分解为若干个独立的、可单独训练的核心子模块”、“对这些子模块进行高强度的专项练习”、“各模块熟练后，再将其重新整合”、“最终实现对整体技能的精通”。\n第二步：逐一分析选项。\nA项：厨师学徒严格按照菜谱，从食材处理到火候掌握一步步学习，是按流程顺序模仿学习，并非将复杂技能分解、专项训练再整合，不符合“将目标技能分解为若干个独立的、可单独训练的核心子模块”、“对这些子模块进行高强度的专项练习”、“各模块熟练后，再将其重新整合”，不符合定义，排除；\nB项：小赵只是将以往演讲中反响最好的几个案例和金句重新编排和串联，仅是对内容的重组，并非对演讲技能进行分解、专项训练再整合，不符合“将目标技能分解为若干个独立的、可单独训练的核心子模块”、“对这些子模块进行高强度的专项练习”、“各模块熟练后，再将其重新整合”，不符合定义，排除；\nC项：游泳运动员进行了核心力量与腿部爆发力的专项训练后，有效增强划水与打腿效果，但未体现两个模块的整合，不符合“各模块熟练后，再将其重新整合”，不符合定义，排除；\nD项：小高以篮球突破这一整体技能为目标，将其拆解为变向运球、篮下脚步、非惯用手上篮动作3个独立可训练的核心子模块，认真练习后，在对抗训练中流畅组合运用，得分效率大增，符合“学习者为突破复杂技能的学习瓶颈”、“将目标技能分解为若干个独立的、可单独训练的核心子模块”、“对这些子模块进行高强度的专项练习”、“各模块熟练后，再将其重新整合”、“最终实现对整体技能的精通”，符合定义，当选。\n故正确答案为D。","no":77,"missingImage":false},{"type":"question","qid":"16069973","cat":"定义判断","stem":"分权时序是指政府或组织在权力分配过程中，依据特定逻辑，分阶段、按顺序逐步下放权力的策略，其核心逻辑是通过“时序规划”降低分权风险，确保权力下放与承接能力、管理成熟度相匹配。\n根据上述定义，下列属于分权时序的是：","options":{"A":"某企业市场部根据产品推广计划安排不同地区的促销活动时间","B":"某政府部门在公共设施建设中，根据项目进度和资金安排分阶段推进不同区域的设施建设","C":"某公司研发团队在产品研发过程中，根据项目进度安排团队不同成员的工作任务和时间顺序","D":"某矿区开展生态修复项目时，地方政府优先赋予矿区环境监管权，但未同步下放排污费征收权"},"answer":"D","explanation":"第一步：找出定义关键词。\n“政府或组织在权力分配过程中”、“分阶段、按顺序逐步下放权力”。\n第二步：逐一分析选项。\nA项：某企业市场部根据产品推广计划安排不同地区的促销活动时间，属于工作时间安排，没有体现权力分配与下放权力，不符合“政府或组织在权力分配过程中”、“分阶段、按顺序逐步下放权力”，不符合定义，排除；\nB项：某政府部门根据项目进度和资金安排分阶段推进公共设施建设，属于项目建设推进，没有体现权力分配与下放权力，不符合“政府或组织在权力分配过程中”、“分阶段、按顺序逐步下放权力”，不符合定义，排除；\nC项：某公司研发团队根据项目进度安排成员工作任务和时间顺序，属于工作分工与进度安排，没有体现权力分配与下放权力，不符合“政府或组织在权力分配过程中”、“分阶段、按顺序逐步下放权力”，不符合定义，排除；\nD项：地方政府优先赋予矿区环境监管权，未同步下放排污费征收权，体现权力分配与下放权力，符合“政府或组织在权力分配过程中”、“分阶段、按顺序逐步下放权力”，符合定义，当选。\n故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"15833802","cat":"类比推理","stem":"瑟：磬","options":{"A":"针灸：推拿","B":"书法：茶道","C":"鲁班：庖丁","D":"梨园：杏坛"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n瑟是一种中国古代汉族弹拨乐器；磬是一种中国古代汉族石制打击乐器，二者属于同一类别下的两种事物，构成并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：针灸和推拿是两种不同的中医传统疗法，二者属于同一类别下的两种事物，与题干逻辑关系一致，当选；\nB项：书法特指用毛笔写汉字的艺术，茶道指通过沏茶、品茶以及相关的礼节来陶冶性情的饮茶技艺，二者不属于同一类别的不同事物，与题干逻辑关系不一致，排除；\nC项：庖丁泛指厨师，与鲁班不是并列关系，与题干逻辑关系不一致，排除；\nD项：梨园为戏院或戏曲界的别称；杏坛原指孔子聚徒讲学之处，后泛称教育场所，二者不属于同一类别的不同事物，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":79,"missingImage":false},{"type":"question","qid":"16069769","cat":"类比推理","stem":"江山：画卷","options":{"A":"琴弦：心声","B":"节气：农事","C":"火药：军事","D":"春雨：甘露"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n江山可以被比喻为画卷，二者为比喻象征义。\n第二步：判断选项词语间逻辑关系。\nA项：琴弦是传递心声的工具，二者不是比喻象征义，与题干逻辑关系不一致，排除；\nB项：农事活动依据节气，二者为依据对应关系，与题干逻辑关系不一致，排除；\nC项：火药可用于军事领域，二者为应用领域对应关系，与题干逻辑关系不一致，排除；\nD项：春雨可以被比喻为甘露，二者为比喻象征义，与题干逻辑关系一致，当选。\n故正确答案为D。","no":80,"missingImage":false},{"type":"question","qid":"17467572","cat":"类比推理","stem":"暴雨：洪水预警：加高堤坝","options":{"A":"地震：余震监测：稳固房屋","B":"旱灾：人工降雨：水库蓄水","C":"台风：航线取消：航班延误","D":"寒潮：供暖启动：道路结冰"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n洪水预警是暴雨发生以后的监控手段，加高堤坝是防灾措施。\n第二步：判断选项词语间逻辑关系。\nA项：余震监测是地震发生以后的监控手段，稳固房屋是防灾措施，与题干逻辑关系一致，当选；\nB项：人工降雨不是旱灾发生以后的监控手段，与题干逻辑关系不一致，排除；\nC项：航线取消不是台风发生以后的监控手段，与题干逻辑关系不一致，排除；\nD项：供暖启动不是寒潮发生以后的监控手段，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":81,"missingImage":false},{"type":"question","qid":"15833805","cat":"类比推理","stem":"故事：寓言：格言","options":{"A":"地形：平原：山地","B":"住宅：别墅：厂房","C":"钟表：指针：发条","D":"地区：盆地：山川"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n寓言是假托故事说明道理或教训的文学作品，寓言是故事，第二词与第一词构成种属关系；格言是可作为行为准则、蕴含教育意义的精练定型语句，格言不是故事，第三词与第一词构成反向种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：平原和山地都是地形，后两词与第一词均构成种属关系，与题干逻辑关系不一致，排除；\nB项：别墅是住宅，第二词与第一词构成种属关系；厂房不是住宅，第三词与第一词构成反向种属关系，与题干逻辑关系一致，当选；\nC项：指针和发条都是钟表的组成部分，后两词与第一词均构成组成关系，与题干逻辑关系不一致，排除；\nD项：盆地是地形，不是地区，第二词与第一词构成反向种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":82,"missingImage":false},{"type":"question","qid":"16070051","cat":"类比推理","stem":"移动支付 对于 （    ） 相当于 （    ） 对于 资源优化","options":{"A":"手机操作；平台运营","B":"远程购物；通讯网络","C":"便捷交易；共享单车","D":"电子支付；汽车租赁"},"answer":"C","explanation":"逐一代入选项。\nA项：移动支付需要通过手机操作实现，二者为条件对应关系；平台运营实现了资源优化，二者为方式与结果对应关系，前后逻辑关系不一致，排除；\nB项：远程购物需要通过移动支付实现，二者为条件对应关系；通讯网络与资源优化没有必然关联，前后逻辑关系不一致，排除；\nC项：移动支付实现了便捷交易，共享单车实现了资源优化，二者均为方式与结果对应关系，前后逻辑关系一致，当选；\nD项：移动支付是电子支付的一种，二者为种属关系；汽车租赁实现了资源优化，二者为方式与结果对应关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":83,"missingImage":false},{"type":"question","qid":"16069773","cat":"类比推理","stem":"（    ） 对于 轨道 相当于 候鸟 对于 （    ）","options":{"A":"卫星；迁徙路线","B":"车道；大雁","C":"汽车；湿地公园","D":"马路；丹顶鹤"},"answer":"A","explanation":"逐一代入选项。\nA项：卫星沿着轨道运行，二者是主体与运动轨迹的对应关系；候鸟沿着迁徙路线飞行，二者是主体与运动轨迹的对应关系，前后逻辑关系一致，当选；\nB项：车道和轨道是两种不同的道路设施，二者是并列关系；大雁是一种候鸟，二者是种属关系，前后逻辑关系不一致，排除；\nC项：某些特殊的轨道汽车可以在轨道上行驶，二者是主体与运动轨迹的对应关系；湿地公园是候鸟的栖息地，二者是地点的对应关系，前后逻辑关系不一致，排除；\nD项：马路和轨道是两种不同的道路设施，二者是并列关系；丹顶鹤是一种候鸟，二者是种属关系，前后逻辑关系不一致，排除。\n故正确答案为A。","no":84,"missingImage":false},{"type":"question","qid":"16069794","cat":"逻辑判断","stem":"某大学研发的B系列首颗卫星B-1正常在轨运行时间达到了其设计寿命。但是，第二批3颗B系列卫星（B-2/3/4）仅运行2个月便坠入大气层，远低于其设计寿命。对于B系列卫星在轨寿命短的原因，有研究人员认为B-1发射于2021年，整体处于太阳活动周的上升初期，空间天气水平相对较低；而B-2/3/4发射于2024年，其运行期间处于太阳活动高年，空间天气急剧增强，导致B系列卫星寿命缩短。但也有科学家认为，低轨大气密度大幅增加引发了B-2/3/4卫星的加速陨落。\n以下哪项如果为真，最能质疑上述科学家的观点？","options":{"A":"空间天气的急剧增强会导致低轨大气密度大幅度增加","B":"低轨大气密度增加会对卫星产生阻力，使卫星轨道高度衰减","C":"太阳活动在上升期、峰值期和下降期的太阳辐射指数不同","D":"低轨大气密度受到地磁活动和地球自转、公转等因素影响"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：低轨大气密度大幅增加引发了B-2/3/4卫星的加速陨落。\n论据：无。\n本题只有论点没有论据，削弱优先考虑削弱论点，即说明卫星的加速陨落并非由低轨大气密度大幅增加导致的。\n第二步：逐一分析选项。\nA项：该项说的是空间天气的急剧增强会导致低轨大气密度大幅度增加，即导致B-2/3/4卫星加速陨落的根本原因是空间天气的急剧增强，而非低轨大气密度大幅增加，削弱论点，可以削弱，当选；\nB项：该项说的是低轨大气密度增加会对卫星产生阻力，使卫星轨道高度衰减，解释了低轨大气密度增加如何导致卫星加速陨落，为加强项，无法削弱，排除；\nC项：该项说的是太阳活动在不同时期的太阳辐射指数不同，与论点讨论的低轨大气密度大幅增加是否会导致卫星加速陨落无关，为无关项，无法削弱，排除；\nD项：该项说的是低轨大气密度受到地磁活动和地球自转、公转等因素影响，讨论的是影响低轨大气密度的原因，与论点讨论的低轨大气密度大幅增加是否会导致卫星加速陨落无关，为无关项，无法削弱，排除。\n故正确答案为A。","no":85,"missingImage":false},{"type":"question","qid":"16070053","cat":"类比推理","stem":"最近，落地护眼灯受到家长们追捧。它高达2米左右，外形酷似街边路灯，所以又被称为“大路灯”。“大路灯”采用上下双光源设计，一个光源照向书桌，另一个照向天花板，相当于把台灯和顶灯融为一盏灯，让室内光照更明亮柔和。一些商家据此宣称，“大路灯”能护眼、防近视。\n以下哪项如果为真，最能质疑商家观点？","options":{"A":"目前无直接临床证据证明“大路灯”对近视防控有效果","B":"“大路灯”不是医疗器械，具有医疗效果的宣传不可信","C":"在模拟太阳光光谱环境下学习的学生，近视发生率较低","D":"家长只需注意“大路灯”是否明确标注执行了行业标准"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：“大路灯”能护眼、防近视。\n论据：“大路灯”采用上下双光源设计，一个光源照向书桌，另一个照向天花板，相当于把台灯和顶灯融为一盏灯，让室内光照更明亮柔和。\n本题论点讨论“大路灯”能护眼、防近视，论据讨论“大路灯”的照明效果明亮柔和，因为照明效果明亮柔和，所以能护眼、防近视，论点与论据话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：选项指出目前无直接临床证据证明“大路灯”对近视防控有效果，说明商家宣称的内容并没有科学证据，削弱论点，可以削弱，当选；\nB项：选项指出“大路灯”具有医疗效果的宣传不可信，而医疗效果指医疗技术人员依据相关法律法规和医疗卫生相关标准和规定，运用医学科学技术对患某种疾病的病人进行诊断、检查、治疗，使其机体和心理恢复到正常状态，即题干论点中提到的“能护眼、防近视”并不属于医疗效果，因此无法直接说明“大路灯”是否能护眼、防近视，不明确项，无法削弱，排除；\nC项：选项指出在模拟太阳光光谱环境下学习的学生，近视发生率较低，不明确“大路灯”模拟的灯光是否为太阳光光谱环境，无法削弱，排除；\nD项：选项指出家长只需注意“大路灯”是否执行了行业标准，行业标准的严格执行与“大路灯”能护眼、防近视无关，无法削弱，排除。\n故正确答案为A。","no":86,"missingImage":false},{"type":"question","qid":"16070027","cat":"逻辑判断","stem":"儿童安全座椅可以在碰撞发生或急停时防止或最大限度减轻对儿童的伤害，同时还能有效降低非碰撞场景下的伤害风险，例如车辆突发制动、行驶过程中车门意外开启等。在2021年修订的《中华人民共和国未成年人保护法》中，儿童安全座椅首次被写入全国性法律。然而，该法实行至今，儿童安全座椅的配备情况仍不容乐观。\n以下哪项如果为真，最能解释上述现象？","options":{"A":"目前，在0至6岁儿童的家长中，仅有67.53%的受访者为儿童配备了儿童安全座椅","B":"有调查显示，大部分已配备儿童安全座椅的家庭，仅在长途出行时才会使用该座椅","C":"行车时“大人抱着孩子最安全”“车速慢就没事”等错误观念在人们心目中根深蒂固","D":"上述法律规定应当配备儿童安全座椅，这是当前对未使用儿童安全座椅的行为作出处罚的主要依据"},"answer":"C","explanation":"第一步：找出题干矛盾。\n儿童安全座椅能有效保护儿童，且已被写入全国性法律，但儿童安全座椅的配备情况仍不容乐观。\n第二步：逐一分析选项。\nA项：指出儿童安全座椅的配备比例数据，仅说明配备情况不容乐观，并未解释出现这一现象的原因，不能解释题干矛盾，排除；\nB项：指出大部分已配备儿童安全座椅的家庭，仅在长途出行时才会使用该座椅，讨论的是已配备儿童安全座椅的家庭的使用情况，而题干讨论的是儿童安全座椅的配备情况，话题不一致，不能解释题干矛盾，排除；\nC项：指出行车时“大人抱着孩子最安全”“车速慢就没事”等错误观念在人们心目中根深蒂固，直接说明即使法律有规定、产品有作用，很多人仍因观念问题不主动配备，能够解释为何儿童安全座椅的配备情况仍不容乐观，可以解释题干矛盾，当选；\nD项：指出该法律是对未使用儿童安全座椅的行为作出处罚的主要依据，但不能解释为何该法实行至今，儿童安全座椅的配备情况仍不容乐观，不能解释题干矛盾，排除。\n‌故正确答案为C。","no":87,"missingImage":false},{"type":"question","qid":"16070140","cat":"逻辑判断","stem":"近年来，不少高校在课程论文、毕业论文中明确列出AI工具的“可用清单”与“禁用边界”，要求学生声明是否使用AI。国际主流学术期刊与出版机构也相继更新投稿须知，强调AI不得署名为作者，要求披露AI使用情况，并重申作者对论文内容的最终责任。面对AI的迅猛发展，这些规范回应迅速，态度审慎，体现了学术共同体对伦理风险的高度重视。因此，这些AI使用规范的出台，有利于防止学术不端的出现。\n以下哪项如果为真，最能削弱上述论证？","options":{"A":"无论是教学科研，还是论文写作与数据处理，在当前的学术界，AI的使用已经成为常态","B":"除了作者自我披露，目前不存在可靠的AI检测工具来检测是否使用以及在多大程度上使用了AI","C":"在学术实践中，AI不只被用于代写等极端场景，还参与到梳理论证结构、优化逻辑衔接、润色语言表达等各个环节","D":"上述规则只是在形式上作了更新，但其核心依然延续了传统学术不端治理的路径，即划定允许与禁止的边界并加以惩戒"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：这些AI使用规范的出台，有利于防止学术不端的出现。\n论据：不少高校在课程论文、毕业论文中明确列出AI工具的“可用清单”与“禁用边界”，要求学生声明是否使用AI。国际主流学术期刊与出版机构也相继更新投稿须知，强调AI不得署名为作者，要求披露AI使用情况，并重申作者对论文内容的最终责任。面对AI的迅猛发展，这些规范回应迅速，态度审慎，体现了学术共同体对伦理风险的高度重视。\n本题论点与论据均在讨论AI使用规范与防止学术不端的关系，二者话题一致，削弱可以优先考虑削弱论点。 \n第二步：逐一分析选项。\nA项：指出学术界AI使用已成为常态，只能说明用的多，无法说明AI使用规范能否防止学术不端，无关选项，无法削弱，排除；\nB项：指出除了作者自我披露，目前不存在可靠的AI检测工具来检测是否使用以及在多大程度上使用了AI，说明是否使用AI只能靠作者的自我披露，并没有有效的监测方式，那么想学术不端的人可以用了AI却不声明，AI使用规范就失去了作用，进而无法防止学术不端行为，削弱论点，可以削弱，当选；\nC项：指出AI用途广泛，无法说明AI使用规范能否防止学术不端，无关选项，无法削弱，排除；\nD项：指出AI使用规范只在形式上作了更新，其核心依然延续了传统学术不端治理的路径，只能说明AI使用规范与传统方式一致，但这无法说明AI使用规范能否防止学术不端，无法削弱，排除。\n故正确答案为B。","no":88,"missingImage":false},{"type":"question","qid":"16069781","cat":"逻辑判断","stem":"继黄金、白银价格大幅拉涨后，近日期货市场上铂金价格也出现了上涨。作为有色金属，铂、钯等铂族金属可吸收氢气，是汽车尾气催化剂以及氢能等新兴应用场景的关键原材料。有专家认为，此轮铂金行情看涨并非短期情绪驱动，铂金价格将持续走高。\n以下除哪一项外，均能支持上述专家的观点？","options":{"A":"由于国际市场的需要，未来燃油汽车产业和清洁能源行业对铂金的需求会持续扩大","B":"在美元信用走弱的趋势下，交易市场基于稳定预期，会将投资目光转向黄金、白银、铂金等贵金属","C":"铂金具有化学稳定性、催化活性和生物相容性，一直以来被广泛应用于航空航天、生物医药等现代高科技产业","D":"N国拥有全球70%以上铂金产量，但该国近期面临电力短缺、矿体老化和运营成本上升等情况，导致全球铂金供应不足进一步加剧"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：此轮铂金行情看涨并非短期情绪驱动，铂金价格将持续走高。\n论据：近日期货市场上铂金价格也出现了上涨。作为有色金属，铂、钯等铂族金属可吸收氢气，是汽车尾气催化剂以及氢能等新兴应用场景的关键原材料。\n本题论点与论据都在说铂族金属是新兴应用场景的关键原材料，所以后续价格会持续走高，论点和论据话题一致，加强优先考虑补充论据，即解释原因或举例子，且本题为选非题，将可以加强的选项排除即可。\n第二步：逐一分析选项。\nA项：该项讨论的是燃油汽车产业和清洁能源行业对铂金的需求会持续扩大，而需求扩大会带来铂金价格的持续走高，补充论据，可以加强，排除；\nB项：该项讨论的是美元信用走弱，使得资金流向黄金、白银、铂金等贵金属，资金流入铂族金属时会增加铂族金属的需求，而需求增加会带来铂金价格的持续走高，补充论据，可以加强，排除；\nC项：该项讨论的是铂金因化学稳定性、催化活性等，一直被广泛应用于航空航天、生物医药等高科技产业，只能表明其用途广泛，并未提到其未来需求增加或供给减少，不能证明其价格是否会持续走高，为不明确项，无法加强，当选；\nD项：该项讨论的是N国铂金产量占全球70%以上，但其面临电力短缺、矿体老化、运营成本上升等情况导致全球铂金供应不足加剧，说明铂金供给减少，而供给减少会带来铂金价格的持续走高，补充论据，可以加强，排除。\n本题为选非题，故正确答案为C。","no":89,"missingImage":false},{"type":"question","qid":"16069793","cat":"逻辑判断","stem":"近期的一项研究发现，氢排放会间接加剧全球变暖，1990年至2020年累积的氢排放为工业化后的全球平均气温上升“贡献”了0.02摄氏度。氢气间接加剧全球变暖的主要原因是它会消耗大气中能够分解温室气体甲烷的天然净化物质，大气中的氢气越多，这类天然净化物质就越少，从而延长甲烷在大气中的留存时间，加剧升温。此外，另有研究发现，近三十年人类活动在整体规模、强度与对全球影响范围上显著增强。由此可见，人类活动加剧了全球变暖。\n上述论证的成立，必须基于以下哪一前提？","options":{"A":"人类活动排放的大量二氧化碳是推动全球变暖的元凶","B":"1990年至2020年间，全球氢气排放量的增加主要由于人类活动","C":"氢气与这类天然净化物质的反应会生成臭氧、水蒸气等温室气体","D":"氢气排放会对人类的工业、农业等活动产生直接或间接不利影响"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：人类活动加剧了全球变暖。\n论据：氢排放会间接加剧全球变暖，1990年至2020年累积的氢排放为工业化后的全球平均气温上升“贡献”了0.02摄氏度。氢气间接加剧全球变暖的主要原因是它会消耗大气中能够分解温室气体甲烷的天然净化物质，大气中的氢气越多，这类天然净化物质就越少，从而延长甲烷在大气中的留存时间，加剧升温。此外，另有研究发现，近三十年人类活动在整体规模、强度与对全球影响范围上显著增强。\n本题论点讨论的是人类活动加剧了全球变暖，论据讨论的是氢排放加剧全球变暖，且近三十年人类活动增强。论点和论据有话题不一致的地方，加强可考虑搭桥，即建立“人类活动”与“氢排放”之间的联系。\n第二步：逐一分析选项。\nA项：该项说人类活动排放的大量二氧化碳是推动全球变暖的元凶，补充论据说明人类活动加剧了全球变暖，可以加强，保留；\nB项：该项说1990年至2020年间（即近三十年），全球氢气排放量的增加主要由于人类活动，建立了“人类活动”与“氢排放”之间的联系，搭桥项，可以加强，保留；\nC项：该项说氢气会通过反应生成温室气体，但没有提及人类活动，无法说明是否是人类活动加剧了全球变暖，话题不一致，无法加强，排除；\nD项：该项说氢气排放会对人类活动产生影响，没有提及全球变暖，与论点讨论的人类活动加剧全球变暖话题不一致，无法加强，排除。\n对比A、B两项，B项搭桥的加强力度大于A项补充论据，当选。\n故正确答案为B。","no":90,"missingImage":false}],"count":24,"answerable":24,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2009年，民营企业进出口3.45万亿元，占同期我国进出口总额的22.9%，比重首次超过国有企业。2019年，民营企业进出口13.49万亿元，占同期我国进出口总额的42.7%，首次成为第一大外贸经营主体并保持至今。2024年，民营企业进出口占同期我国进出口总额的55.5%。2025年前两个月，民营企业进出口3.69万亿元。\u003c/p>\u003cp>        2022年，我国有进出口实绩的民营企业数量迈上50万家台阶。2024年，我国有进出口实绩的民营企业数量达60.9万家，占我国有进出口实绩企业的87.1%。\u003c/p>\u003cp>        2024年，民营企业出口高新技术产品3.05万亿元，较2019年增长94.5%，占我国同类商品出口比重较2019年（下同）提升17.5个百分点至48.6%。手机、汽车（包括底盘）、蓄电池、电脑、船舶出口额较2019年分别增长123.8%、10.5倍、461.6%、83.9%、375%，占比分别提升30.1个、18.3个、19.4个、11.2个、20.3个百分点至59.7%、51.5%、69.4%、27.2%、38.6%。2025年前两个月，民营企业上述商品出口额同比分别增长11.8%、11%、20.3%、1.7%、25.2%。\u003c/p>\u003cp>        2024年，民营企业进口大宗商品1.91万亿元，较2019年增长107.8%。同期，国有企业、外商投资企业大宗商品进口额占我国大宗商品进口额比重分别较2019年下降8.6个、0.7个百分点至55.4%、9.3%。\u003c/p>\u003cp>        2025年前两个月，民营企业对传统市场（美国、欧盟、日本、我国香港地区、英国等）、东盟、拉美分别进出口1.26万亿元、6310.2亿元、3247.9亿元，同比分别增长4%、增长4.8%、下降1.3%。\u003c/p>","questions":[{"qid":"17467575","cat":"增长","stem":"2019年我国进出口总额比2009年约增加多少万亿元？","options":{"A":"10","B":"13","C":"17","D":"20"},"answer":"C","explanation":"根据题干“2019年······比2009年······约增加多少万亿元”，可判定本题为增长量计算问题。定位文字材料第一段可得：2009年，民营企业进出口3.45万亿元，占同期我国进出口总额的22.9%；2019年，民营企业进出口13.49万亿元，占同期我国进出口总额的42.7%。根据公式：整体\u003cimg data-k=\"447680635370\">、增长量=现期量-基期量，则题干所求\u003cimg data-k=\"0c85f2df9273\">万亿元，与C项最接近。\n故正确答案为C。","no":91,"missingImage":false},{"qid":"16069815","cat":"比重","stem":"将手机、蓄电池、船舶三类商品按2019年民营企业出口额占我国同类产品出口额比重从高到低排列，正确的是：","options":{"A":"手机、船舶、蓄电池","B":"蓄电池、船舶、手机","C":"蓄电池、手机、船舶","D":"船舶、手机、蓄电池"},"answer":"C","explanation":"根据题干“······按2019年······比重从高到低排列······”，结合材料时间为2024年，可判定本题为基期比重问题。定位文字材料第三段可得：2024年，手机、蓄电池、船舶出口额占比较2019年分别提升30.1个、19.4个、20.3个百分点至59.7%、69.4%、38.6%。则2019年这三类商品占比分别为：手机=59.7%-30.1%=29.6%、蓄电池=69.4%-19.4%=50%、船舶=38.6%-20.3%=18.3%。综上，2019年所占比重从高到低排列为蓄电池、手机、船舶。\n故正确答案为C。","no":92,"missingImage":false},{"qid":"16069817","cat":"综合","stem":"2019年，国有企业大宗商品进口额约是外商投资企业大宗商品进口额的多少倍？","options":{"A":"5.2","B":"5.8","C":"6.4","D":"7.0"},"answer":"C","explanation":"根据题干“2019年······是······的多少倍”，结合材料时间为2024年，可判定本题为基期倍数问题。定位文字材料第四段可得：2024年，国有企业、外商投资企业大宗商品进口额占我国大宗商品进口额比重分别较2019年下降8.6个、0.7个百分点至55.4%、9.3%。则2019年国有企业、外商投资企业大宗商品进口额占我国大宗商品进口额比重分别为55.4%+8.6%=64%、9.3%+0.7%=10%。则题干所求倍数\u003cimg data-k=\"fd780f0024ba\">。\n故正确答案为C。","no":93,"missingImage":false},{"qid":"16069865","cat":"比重","stem":"关于2025年前两个月民营企业进出口总额，以下饼图能准确反映传统市场（白色）、东盟（灰色）和其他地区（黑色）占比关系的是：","options":{"A":"\u003cimg data-k=\"7bc0860431e7\" style=\"max-width:200px\">","B":"\u003cimg data-k=\"1669d5e39323\" style=\"max-width:204px\">","C":"\u003cimg data-k=\"42b747f436c4\" style=\"max-width:200px\">","D":"\u003cimg data-k=\"7038c9f5fe18\" style=\"max-width:200px\">"},"answer":"A","explanation":"根据题干“······2025年前两个月······占比关系的是”，结合材料时间涉及2025年前两个月，可判定本题为现期比重问题。定位文字材料第一段可得：2025年前两个月，民营企业进出口3.69万亿元；定位文字材料第五段可得：2025年前两个月，民营企业对传统市场、东盟分别进出口1.26万亿元、6310.2亿元。根据公式：比重\u003cimg data-k=\"155c064d29d7\">，\n则民营企业进出口总额中，对传统市场和东盟所占比重之和为\u003cimg data-k=\"87a63ec05580\">稍大于50%，排除C、D两项；民营企业对传统市场进出口额是对东盟进出口额的\u003cimg data-k=\"d072ddb89a51\">倍，排除B项。\n故正确答案为A。","no":94,"missingImage":false},{"qid":"16069885","cat":"综合","stem":"能够从上述资料中推出的是：","options":{"A":"2024年3-12月民营企业进出口总额","B":"2024年前两个月民营企业高新技术产品出口额","C":"2024年前两个月民营企业手机、电脑进出口总额","D":"2024年非民营企业高新技术产品出口额相较2019年增速"},"answer":"D","explanation":"A项：定位文字材料第一段可得：2024年民营企业进出口占同期我国进出口总额的55.5%，2025年前两个月民营企业进出口3.69万亿元。没有给出2024年3-12月民营企业进出口总额相关数据，无法推出，错误；\nB项：定位文字材料第三段可得：2024年民营企业出口高新技术产品3.05万亿元。没有给出2024年前两个月民营企业高新技术产品出口额相关数据，无法推出，错误；\nC项：定位文字材料第三段可得：2024年民营企业手机、电脑出口额较2019年的增速及比重变化，2025年前两个月民营企业手机、电脑出口额的同比增速。没有给出2024年前两个月民营企业手机、电脑进出口总额相关数据，无法推出，错误；\nD项：定位文字材料第三段可得：2024年民营企业出口高新技术产品3.05万亿元，较2019年增长94.5%，占我国同类商品出口比重较2019年（下同）提升17.5个百分点至48.6%。则2024年非民营企业高新技术产品出口额=高新技术产品出口额-民营企业高新技术产品出口额\u003cimg data-k=\"f825d6c92f10\">万亿元，2019年非民营企业高新技术产品出口额\u003cimg data-k=\"250385a8dbc8\">万亿元。根据公式：增长率\u003cimg data-k=\"7a919ee92a2e\">，2024年非民营企业高新技术产品出口额相较2019年的增速\u003cimg data-k=\"42dbaea555d6\">，可以推出，正确。\n故正确答案为D。","no":95,"missingImage":false}]},{"type":"material","material":"\u003cp>\u003cimg data-k=\"6c1db111bf9a\" style=\"max-width:565px\">\u003c/p>","questions":[{"qid":"16069826","cat":"平均数","stem":"2025年，我国服装整体市场规模比2020~2024年间的平均值高：","options":{"A":"不到1000亿元","B":"1000~1300亿元","C":"1300~1600亿元","D":"1600亿元以上"},"answer":"B","explanation":"根据题干“2025年······比2020~2024年间的平均值高”，可判定本题为现期平均数问题。定位统计表可得：2020~2025年我国服装整体市场规模分别为19600.7亿元、21938.2亿元、19950.5亿元、21619.5亿元、21698.2亿元、22049.5亿元。则所求\u003cimg data-k=\"2494ef7ce5b5\">\u003cimg data-k=\"2e11aeb4f7c3\">\u003cimg data-k=\"3592bc2f5880\">亿元，在B项范围内。\n故正确答案为B。","no":96,"missingImage":false},{"qid":"16069828","cat":"比重","stem":"2025年，我国运动鞋类市场规模占鞋类市场规模的比重比运动服装占服装市场规模的比重高约多少个百分点？","options":{"A":"37","B":"41","C":"45","D":"49"},"answer":"B","explanation":"根据题干“2025年······比重高约多少个百分点”，可判定本题为现期比重问题。定位表格材料可得：2025年我国鞋类市场规模4787.7亿元，其中运动鞋类市场规模2393.7亿元；我国服装市场规模22049.5亿元，其中运动服装市场规模1982.8亿元。根据公式：比重\u003cimg data-k=\"155c064d29d7\">，则题干所求\u003cimg data-k=\"203cac8898cd\">，即高约41个百分点。\n故正确答案为B。","no":97,"missingImage":false},{"qid":"16069831","cat":"增长","stem":"如保持2025年同比增量不变，我国运动服装市场规模将在哪一年首次超过运动鞋类市场规模？","options":{"A":"2034年","B":"2035年","C":"2036年","D":"2037年"},"answer":"A","explanation":   return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
