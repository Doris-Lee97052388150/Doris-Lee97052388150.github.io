<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2026年安徽省公务员录用考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2026-安徽","title":"2026年安徽省公务员录用考试《行测》题（网友回忆版）","year":"2026","group":"安徽","modules":[{"label":"政治理论","items":[{"type":"question","qid":"17934106","cat":"新思想","stem":"习近平总书记指出，政绩观问题是一个根本性问题，关乎立党为公、执政为民。关于树立和践行正确政绩观，下列说法正确的有几项？\n①坚持为人民出政绩、以实干出政绩\n②坚持为官一任、造福一方 \n③坚持功成不必在我、功成必定有我\n④坚持既为一域增光、又为全局添彩\n⑤坚持一张蓝图绘到底、一茬接着一茬干","options":{"A":"2 项","B":"3 项","C":"4 项","D":"5 项"},"answer":"D","explanation":"本题考查新思想。\n①正确，2026年1月20日，习近平总书记在省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班开班式上发表重要讲话强调：“顺利完成‘十五五’时期目标任务，必须着力提高党领导经济社会发展能力和水平。各级干部特别是领导干部要进一步加强学习，钻研党的创新理论，提高专业素养，增强实干本领。要树立和践行正确政绩观，坚持从实际出发、按规律办事，自觉为人民出政绩、以实干出政绩。”\n②正确，2020年5月，习近平总书记参加十三届全国人大三次会议内蒙古代表团审议时强调：“必须把为民造福作为最重要的政绩······各级领导干部要树立正确的权力观、政绩观、事业观，不慕虚荣，不务虚功，不图虚名，切实做到为官一任、造福一方。”\n③⑤正确，2020年11月14日，习近平总书记在南京主持召开全面推动长江经济带发展座谈会时强调：“推动长江经济带发展，要拿出‘功成不必在我’的精神境界和‘功成必定有我’的历史担当，保持历史耐心和战略定力，一张蓝图绘到底，一茬接着一茬干，确保一江清水绵延后世、惠泽人民。”\n④正确，2020年10月10日，习近平总书记在中央党校（国家行政学院）中青年干部培训班开班式上的重要讲话中强调，领导干部想问题、作决策，一定要对国之大者心中有数，多打大算盘、算大账，少打小算盘、算小账，善于把地区和部门的工作融入党和国家事业大棋局，做到既为一域争光、更为全局添彩。\n综上，①②③④⑤表述正确，共5项。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"16069954","cat":"新思想","stem":"习近平总书记强调，要坚持以铸牢中华民族共同体意识为主线，不断推进民族团结进步事业，推动党的民族工作高质量发展。关于铸牢中华民族共同体意识，下列说法正确的有几项?\n①广泛交往交流交融是推进中华民族共同体建设的重要途径\n②加强对青少年的历史文化教育，全面推广普及国家通用语言文字，全面推行使用国家统编教材\n③要坚持和完善民族区域自治制度，逐步完善相关法律法规和差别化区域支持政策，依法保障各族群众合法权益\n④要引导各族群众不断增强对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n2024年9月27日，全国民族团结进步表彰大会在北京举行。习近平总书记出席大会并发表重要讲话。\n①正确，习近平总书记在讲话中指出：“第四，推动各民族全方位嵌入，积极促进各民族交往交流交融。广泛交往交流交融是推进中华民族共同体建设的重要途径。”\n②正确，习近平总书记在讲话中指出：“第二，着力构筑中华民族共有精神家园······加强对青少年的历史文化教育，全面推广普及国家通用语言文字，全面推行使用国家统编教材，把中华民族共同体意识从小就植入孩子们的心灵。”\n③正确，习近平总书记在讲话中指出：“第五，依法治理民族事务，不断提高民族事务治理能力和水平。要坚持和完善民族区域自治制度，逐步完善相关法律法规和差别化区域支持政策，依法保障各族群众合法权益。加强法治宣传教育，引导各族群众增强国家意识、公民意识、法治意识。”\n④正确，习近平总书记在讲话中指出：“第一，始终坚持党的领导，不断巩固各民族团结奋斗的共同思想政治基础······要引导各族群众不断增强对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同，牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念。”\n故①②③④表述正确，共4项。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"16070303","cat":"新思想","stem":"习近平总书记指出，要推动公共文化服务标准化、均等化，坚持政府主导、社会参与、重心下移、共建共享，完善公共文化服务体系，提高基本公共文化服务的覆盖面和适用性。关于完善公共文化服务体系，下列举措正确的有几项？\n①做好文化馆、乡镇（街道）综合文化站、村（社区）综合性文化服务中心等的规划建设\n②推动优质文化资源向沿海发达地区集中，促进公共文化服务差异化发展\n③实施全国智慧图书馆体系建设、公共文化云建设等项目\n④实施广播电视惠民工程，完善农村文化基础设施网络\n⑤推动各民族文化的传承保护和创新交融，提升民族地区公共文化服务水平","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"C","explanation":"本题考查新思想。\n2021年9月9日，国务院新闻办公室发布《国家人权行动计划（2021—2025年）》（以下简称《行动计划》）。\n①正确，《行动计划》在“一、经济、社会和文化权利”部分“（七）文化权利”中指出：“完善公共文化服务基础设施。做好公共图书馆、文化馆、博物馆、美术馆、乡镇（街道）综合文化站、村（社区）综合性文化服务中心等的规划建设。健全各级各类公共文化服务基础设施。”\n②错误、④正确，《行动计划》在“一、经济、社会和文化权利”部分“（七）文化权利”中指出：“补齐公共文化服务短板。落实国家基本公共服务标准要求，加强基层文化建设，增加供给总量，优化供给结构，推动优质文化资源向农村地区、革命老区、民族地区、边疆地区倾斜，缩小城乡和地区之间公共文化服务差距。实施广播电视惠民工程，完善农村文化基础设施网络。”故“推动优质文化资源向沿海发达地区集中，促进公共文化服务差异化发展”说法有误，应为“推动优质文化资源向农村地区、革命老区、民族地区、边疆地区倾斜，缩小城乡和地区之间公共文化服务差距”。\n③正确，《行动计划》在“一、经济、社会和文化权利”部分“（七）文化权利”中指出：“推动公共数字文化建设。统筹推进公共文化数字化重点工程建设。实施全国智慧图书馆体系建设、公共文化云建设等项目。”\n⑤正确，《行动计划》在“四、特定群体权益保障”部分“（一）少数民族权益”中指出：“保障少数民族文化权利。推动各民族文化的传承保护和创新交融，提升民族地区公共文化服务水平。保护和传承少数民族传统文化。做好少数民族古籍保护、抢救、整理、出版和研究工作。开展少数民族古籍数字化建设。办好第六届全国少数民族文艺会演。开展好少数民族语电视剧译制片源捐赠工作。”\n综上，①③④⑤表述正确，共4项。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"16069953","cat":"新思想","stem":"习近平总书记强调，要牢固树立和践行绿水青山就是金山银山的理念，坚定不移走生态优先、绿色发展之路。关于绿色发展，下列表述正确的有几项?\n①坚持绿色发展是发展观的一场深刻革命\n②要坚持经济优先、技术优先、人工恢复为主的方针，像保护眼睛一样保护自然和生态环境\n③应暂缓绿色发展领域的多边合作平台建设，以应对现有国际环境治理合作存在的诸多风险与挑战\n④不仅要从政策上加强管理和保护，而且要从全球变化、碳循环机理等方面加深认识，依靠科技创新破解绿色发展难题","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"B","explanation":"本题考查新思想。\n①正确，2017年6月21日至23日，习近平总书记在山西考察工作时强调：“坚持绿色发展是发展观的一场深刻革命。要从转变经济发展方式、环境污染综合治理、自然生态保护修复、资源节约集约利用、完善生态文明制度体系等方面采取超常举措，全方位、全地域、全过程开展生态环境保护。”\n②错误，2018年5月18日至19日，全国生态环境保护大会在北京召开，习近平总书记出席会议并发表重要讲话，他指出：“新时代推进生态文明建设，必须坚持好以下原则。一是坚持人与自然和谐共生，坚持节约优先、保护优先、自然恢复为主的方针，像保护眼睛一样保护生态环境，像对待生命一样对待生态环境，让自然生态美景永驻人间······”故“要坚持经济优先、技术优先、人工恢复为主的方针”表述有误，应为“坚持节约优先、保护优先、自然恢复为主的方针”。\n③错误，2024年7月18日，二十届三中全会通过的《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“七、完善高水平对外开放体制机制”中指出：“（28）完善推进高质量共建‘一带一路’机制。继续实施‘一带一路’科技创新行动计划，加强绿色发展、数字经济、人工智能、能源、税收、金融、减灾等领域的多边合作平台建设······”故“应暂缓绿色发展领域的多边合作平台建设”表述错误，应为“加强绿色发展······等领域的多边合作平台建设”。\n④正确，2016年5月30日，习近平总书记在全国科技创新大会、两院院士大会、中国科协第九次全国代表大会上强调：“绿色发展是生态文明建设的必然要求，代表了当今科技和产业变革方向，是最有前途的发展领域······不仅要研究生态恢复治理防护的措施，而且要加深对生物多样性等科学规律的认识；不仅要从政策上加强管理和保护，而且要从全球变化、碳循环机理等方面加深认识，依靠科技创新破解绿色发展难题，形成人与自然和谐发展新格局。”\n综上，①④表述正确，共2项。\n故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"16069974","cat":"新思想","stem":"习近平总书记指出，中国愿同世界各国一道，把握信息革命发展的历史主动，携手构建网络空间命运共同体，让互联网更好造福人民、造福世界。关于构建网络空间命运共同体，下列表述正确的是：\n①尊重网络主权，维护网络安全，共同构建和平、安全、开放、合作的网络空间\n②全球网络主要由跨国公司提供，网络空间未来应由跨国公司携手经营\n③倡导发展优先，构建更加普惠繁荣的网络空间\n④保障数据安全，建立单边、保密的国际互联网治理体系\n⑤深化网络安全务实合作，有力打击网络违法犯罪行为","options":{"A":"①③⑤","B":"①④⑤","C":"①②③⑤","D":"①②③④⑤"},"answer":"A","explanation":"本题考查新思想。\n①正确，2014年11月19日，习近平总书记在向首届世界互联网大会致贺词中强调：“中国正在积极推进网络建设，让互联网发展成果惠及13亿中国人民。中国愿意同世界各国携手努力，本着相互尊重、相互信任的原则，深化国际合作，尊重网络主权，维护网络安全，共同构建和平、安全、开放、合作的网络空间，建立多边、民主、透明的国际互联网治理体系。”\n②错误，2022年11月7日，国务院新闻办公室发布的《携手构建网络空间命运共同体》白皮书在“三、构建网络空间命运共同体的中国贡献”部分“（三）积极参与网络空间治理”中指出：“中国始终认为，国家不分大小、强弱、贫富，都是平等成员，都有权平等参与国际规则与秩序建构，确保网络空间未来发展由各国人民共同掌握。”同时，全球网络基础设施与治理体系以主权国家为核心主体，跨国公司仅为重要的商业服务提供者，而非“主要提供者”。故“网络空间未来应由跨国公司携手经营”表述错误，应为“确保网络空间未来发展由各国人民共同掌握”。\n③正确，2023年11月8日，习近平总书记向2023年世界互联网大会乌镇峰会开幕式发表的视频致辞指出：“我们倡导发展优先，构建更加普惠繁荣的网络空间。深化数字领域国际交流合作，加速科技成果转化。加快信息化服务普及，缩小数字鸿沟，在互联网发展中保障和改善民生，让更多国家和人民共享互联网发展成果。”\n④错误，2015年12月16日，习近平总书记在第二届世界互联网大会开幕式上的讲话中指出：“第五，构建互联网治理体系，促进公平正义。国际网络空间治理，应该坚持多边参与、多方参与，由大家商量着办，发挥政府、国际组织、互联网企业、技术社群、民间机构、公民个人等各个主体作用，不搞单边主义，不搞一方主导或由几方凑在一起说了算······”故“建立单边、保密的国际互联网治理体系”表述错误，应为“国际网络空间治理，应该坚持多边参与、多方参与，由大家商量着办”。\n⑤正确，2023年11月9日，人民日报发表的文章《共同推动构建网络空间命运共同体迈向新阶段》指出：“‘我们倡导安危与共，构建更加和平安全的网络空间。’只有尊重网络主权，遵守网络空间国际规则，深化网络安全务实合作，有力打击网络违法犯罪行为，加强数据安全和个人信息保护，才能妥善应对科技发展带来的规则冲突、社会风险、伦理挑战，更好维护网络空间安全。”\n故①③⑤表述正确。\n故正确答案为A。","no":5,"missingImage":false},{"type":"question","qid":"16070156","cat":"时事政治","stem":"制定“十五五”规划建议，系统谋划“十五五”时期经济社会发展，是实现党的二十大描绘的宏伟蓝图、分阶段有步骤推进中国式现代化的需要，意义重大。关于“十五五”规划建议，下列表述正确的有几项？\n①适度超前建设新型基础设施，推进信息通信网络、全国一体化算力网、重大科技基础设施等建设和集约高效利用\n②推动量子科技、生物制造、第六代移动通信等成为新的经济增长点\n③建设法治经济、信用经济，打造市场化法治化国际化一流营商环境\n④健全与常住人口相匹配的公共资源配置机制，加强县域基本公共服务供给统筹","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n2025年10月23日，中国共产党第二十届中央委员会第四次全体会议通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》（以下简称《建议》）。\n①正确，《建议》在“三、建设现代化产业体系，巩固壮大实体经济根基”部分指出：“（10）构建现代化基础设施体系。加强基础设施统筹规划，优化布局结构，促进集成融合，提升安全韧性和运营可持续性。适度超前建设新型基础设施，推进信息通信网络、全国一体化算力网、重大科技基础设施等建设和集约高效利用，推进传统基础设施更新和数智化改造。”\n②正确，《建议》在“三、建设现代化产业体系，巩固壮大实体经济根基”部分指出：“前瞻布局未来产业，探索多元技术路线、典型应用场景、可行商业模式、市场监管规则，推动量子科技、生物制造、氢能和核聚变能、脑机接口、具身智能、第六代移动通信等成为新的经济增长点。”\n③正确，《建议》在“二、‘十五五’时期经济社会发展的指导方针和主要目标”部分指出：“坚持有效市场和有为政府相结合。充分发挥市场在资源配置中的决定性作用，更好发挥政府作用，构建统一、开放、竞争、有序的市场体系，建设法治经济、信用经济，打造市场化法治化国际化一流营商环境，形成既‘放得活’又‘管得好’的经济秩序。”\n④正确，《建议》在“十一、加大保障和改善民生力度，扎实推进全体人民共同富裕”部分指出：“（44）稳步推进基本公共服务均等化。建立基本公共服务均等化评价标准，完善基本公共服务范围和内容，制定实现基本公共服务均等化的目标、路径、措施，推动更多公共服务向基层下沉、向农村覆盖、向边远地区和生活困难群众倾斜，健全与常住人口相匹配的公共资源配置机制。加强县域基本公共服务供给统筹，完善投入保障长效机制。全面深化事业单位改革。”\n综上，①②③④表述正确，共4项。\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"15833825","cat":"新思想","stem":"党的十八大以来，以习近平同志为核心的党中央坚定不移推进全面从严治党，取得一系列理论创新、实践创新、制度创新成果，构建起全面从严治党体系，开辟了百年大党自我革命新境界。下列关于全面从严治党的表述准确的是（    ）。\n①严密党的组织体系，关键是坚持党中央权威和集中统一领导，根本在做到“两个维护”\n②制度建设要与管党治党需要相适应、与党的各项建设相配套，全方位织密制度的笼子\n③新时代党的建设是以党的组织建设为统领、党的各项建设同向发力综合发力的系统工程\n④着力抓好政治监督、领导班子特别是“一把手”监督、“三重一大”事项监督以及权力集中、资金密集、资源富集等重点领域的监督","options":{"A":"①②③","B":"①②④","C":"②③④","D":"①②③④"},"answer":"B","explanation":"本题考查新思想。\n2025年2月16日，《求是》杂志发表习近平总书记重要文章《健全全面从严治党体系》。\n①正确，文章指出：“第一，健全上下贯通、执行有力的组织体系······只有党的组织体系严密起来，党的各级组织政治功能和组织功能充分发挥出来，全面从严治党才能持续向纵深推进。严密党的组织体系，关键是坚持党中央权威和集中统一领导，根本在做到‘两个维护’。”\n②正确，文章指出：“第四，健全科学完备、有效管用的制度体系。全面从严治党政治性、原则性强，必须有一套科学完备的制度来规范。制度建设要与管党治党需要相适应、与党的各项建设相配套，全方位织密制度的笼子。”\n③错误，文章指出：“······新时代党的建设是以党的政治建设为统领、党的各项建设同向发力综合发力的系统工程，必须以党中央关于党的建设的重要思想、关于党的自我革命的重要思想为根本遵循，坚持和加强党的全面领导和党中央集中统一领导······”故“以党的组织建设为统领”表述有误，应为“以党的政治建设为统领”。\n④正确，文章指出：“第三，健全精准发力、标本兼治的监管体系······要突出监督重点，着力抓好政治监督、领导班子特别是‘一把手’监督、‘三重一大’事项监督以及权力集中、资金密集、资源富集等重点领域的监督，切实让特权现象和腐败问题无所遁形。”\n综上，①②④表述准确。\n故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"15833828","cat":"新思想","stem":"党的十八大以来，以习近平同志为核心的党中央高度重视海洋工作和海洋事业发展，将海洋强国建设作为实现中华民族伟大复兴的重大战略任务，通盘谋划、整体推进海洋强国建设。关于建设海洋强国，下列表述准确的是：\n①统筹处理人与自然的关系、发展和保护的关系是推进海洋强国建设的重大原则\n②建设海洋强国必须进一步关心海洋、认识海洋、经略海洋，加快海洋科技创新步伐\n③建设强大的现代化海军是建设世界一流军队的重要标志，是建设海洋强国的战略支撑\n④建设海洋强国所需的关键技术主要靠对外开放引进，靠充分发挥国外关键技术经验优势","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"A","explanation":"本题考查新思想。\n①正确，2024年1月11日，求是网发表的文章《准确把握新形势下海洋资源开发保护要求》指出：“美丽海洋是美丽中国的重要组成部分，碧海蓝天也是金山银山。统筹处理人与自然的关系、发展和保护的关系是推进海洋强国建设的重大原则······”\n②正确，2018年6月12日，习近平总书记在山东青岛考察时强调：“海洋经济发展前途无量。建设海洋强国，必须进一步关心海洋、认识海洋、经略海洋，加快海洋科技创新步伐。”\n③正确，2017年5月24日，习近平总书记视察海军机关时强调：“建设强大的现代化海军是建设世界一流军队的重要标志，是建设海洋强国的战略支撑，是实现中华民族伟大复兴中国梦的重要组成部分。”\n④错误，2022年4月10日，习近平总书记在中国海洋大学三亚海洋研究院调研考察时，对建设海洋强国作出重要指示，强调要推动海洋科技实现高水平自立自强，加强原创性、引领性科技攻关，把装备制造牢牢抓在自己手里，努力用我们自己的装备开发油气资源，提高能源自给率，保障国家能源安全。故建设海洋强国所需的关键技术不能主要靠对外开放引进，而应加强原创性、引领性科技攻关，把装备制造牢牢抓在自己手里。\n综上，①②③表述准确。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"16069911","cat":"时事政治","stem":"党的二十大报告指出，坚持把发展经济的着力点放在实体经济上，推进新型工业化，加快建设制造强国、质量强国、航天强国、交通强国、网络强国、数字中国。关于发展实体经济，下列说法正确的是：\n①金融是实体经济的血脉，为实体经济服务是金融的天职\n②要增强资本市场服务实体经济功能，积极有序发展股权融资\n③要实现实体经济、科技创新、现代金融、人力资源协同发展\n④要促进实体经济和数字经济深度融合，有序推动实体经济脱实向虚\n⑤要推动资源要素向实体经济集聚、政策措施向实体经济倾斜、工作力量向实体经济加强","options":{"A":"①②③⑤","B":"②③④","C":"①②④⑤","D":"③④⑤"},"answer":"A","explanation":"本题考查新思想。\n①正确，2026年2月1日出版的第3期《求是》杂志发表了习近平总书记的重要文章《走好中国特色金融发展之路，建设金融强国》，文章指出：“······坚持把金融服务实体经济作为根本宗旨。实体经济是金融的根基，金融是实体经济的血脉，服务实体经济是金融的天职······”\n②正确，2017年7月召开的全国金融会议指出：“金融是国之重器，是国民经济的血脉······要增强资本市场服务实体经济功能，积极有序发展股权融资，提高直接融资比重······”\n③正确，党的十九大报告在“五、贯彻新发展理念，建设现代化经济体系”部分指出：“必须坚持质量第一、效益优先······着力加快建设实体经济、科技创新、现代金融、人力资源协同发展的产业体系，着力构建市场机制有效、微观主体有活力、宏观调控有度的经济体制，不断增强我国经济创新力和竞争力。”\n④错误，2026年2月1日出版的第3期《求是》杂志发表了习近平总书记的重要文章《走好中国特色金融发展之路，建设金融强国》，文章指出：“······我国金融必须守好服务实体经济本分，推动高质量发展，决不能脱实向虚。”十五五规划纲要在“第十三章 全方位推进数智技术赋能”部分指出：“促进实体经济和数字经济深度融合。”故“有序推动实体经济脱实向虚”表述有误。\n⑤正确，《习近平新时代中国特色社会主义思想学习纲要》在“九、以新发展理念引领经济高质量发展”部分指出：“······要加快发展先进制造业，坚定不移建设制造强国。推动互联网、大数据、人工智能同实体经济深度融合，推动资源要素向实体经济集聚、政策措施向实体经济倾斜、工作力量向实体经济加强······”\n故正确的有①②③⑤。\n故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"16070174","cat":"新思想","stem":"推进中国式现代化是一个系统工程，需要统筹兼顾、系统谋划、整体推进，正确处理好一系列重大关系。下列与之相关的表述正确的有（    ）。\n①活力与秩序：中国式现代化应当而且能够实现活而不乱、活跃有序的动态平衡\n②守正与创新：守正才能不迷失方向、不犯颠覆性错误，创新才能把握时代、引领时代\n③战略与策略：要增强策略的前瞻性，准确把握事物发展的必然趋势，以科学的战略预见未来、引领未来\n④效率与公平：中国式现代化既要创造比资本主义更高的效率，又要更有效地维护社会公平，更好实现效率与公平相兼顾、相促进、相统一","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查新思想。\n2023年10月1日，《求是》杂志发表习近平总书记重要文章《推进中国式现代化需要处理好若干重大关系》，以下简称文章。\n①正确，文章指出：“五是活力与秩序的关系。在现代化的历史进程中，处理好这对关系是一道世界性难题。中国式现代化应当而且能够实现活而不乱、活跃有序的动态平衡。”\n②正确，文章指出：“三是守正与创新的关系。守正创新是我们党在新时代治国理政的重要思想方法。守正才能不迷失方向、不犯颠覆性错误，创新才能把握时代、引领时代。”\n③错误，文章指出：“二是战略与策略的关系。战略与策略是我们党领导人民改造世界、变革实践、推动历史发展的有力武器······要增强战略的前瞻性，准确把握事物发展的必然趋势，敏锐洞悉前进道路上可能出现的机遇和挑战，以科学的战略预见未来、引领未来。”故“策略的前瞻性”表述有误，应为“战略的前瞻性”。\n④正确，文章指出：“四是效率与公平的关系。中国式现代化既要创造比资本主义更高的效率，又要更有效地维护社会公平，更好实现效率与公平相兼顾、相促进、相统一。”\n故①②④表述正确，共3项。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"16069901","cat":"新思想","stem":"城乡融合发展是中国式现代化的必然要求。关于城乡融合发展，下列说法正确的有几项？\n①要把乡村振兴战略这篇大文章做好，必须走城乡融合发展之路\n②在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败\n③要顺应城乡融合发展大趋势，破除妨碍城乡要素平等交换、双向流动的制度壁垒\n④振兴乡村，不能就乡村论乡村，还是要强化以工补农、以城带乡，加快形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n①正确，2018年9月21日，习近平总书记在十九届中央政治局第八次集体学习时讲话指出：“要把乡村振兴战略这篇大文章做好，必须走城乡融合发展之路。我们一开始就没有提城市化，而是提城镇化，目的就是促进城乡融合。要向改革要动力，加快建立健全城乡融合发展体制机制和政策体系。”\n②正确，2018年9月21日，习近平总书记在十九届中央政治局第八次集体学习时讲话指出：“我一直强调，没有农业农村现代化，就没有整个国家现代化。在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败。”\n③正确，2022年12月23日，习近平总书记在中央农村工作会议上讲话指出：“要顺应城乡融合发展大趋势，破除妨碍城乡要素平等交换、双向流动的制度壁垒，促进发展要素、各类服务更多下乡，率先在县域内破除城乡二元结构。”\n④正确，2020年12月28日，习近平总书记在中央农村工作会议上讲话指出：“第六，推动城乡融合发展见实效。振兴乡村，不能就乡村论乡村，还是要强化以工补农、以城带乡，加快形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系。”\n综上，①②③④说法正确，共4项。\n故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"16070240","cat":"新思想","stem":"就业是最基本的民生，事关人民群众切身利益，事关经济社会健康发展，事关国家长治久安。关于促进高质量充分就业，下列举措恰当的有几项？\n①引导退役军人围绕国家重点扶持领域创业\n②推动农村低收入人口就业帮扶常态化，防止因失业导致规模性返贫\n③鼓励支持企业吸纳就业、自主创业，统筹用好公益性岗位，确保不出现零就业家庭\n④对各种类型的就业困难高校毕业生均按照规定给予一定的社会保险补贴\n⑤提升青年就业服务效能，强化针对性职业指导、职业介绍、技能培训、见习实习，形成衔接校内校外、助力成长成才的服务支撑","options":{"A":"5项","B":"4项","C":"3项","D":"2项"},"answer":"C","explanation":"本题考查新思想。\n2024年9月15日，中共中央、国务院发布《关于实施就业优先战略促进高质量充分就业的意见》，以下简称《意见》。\n①正确，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十）做好退役军人就业服务保障。健全学历教育与职业技能培训、创业培训、个性化培训并行的退役军人教育培训体系······引导退役军人围绕国家重点扶持领域创业。”\n②正确，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十一）拓宽农村劳动力就业增收空间。壮大县域富民产业，推出一批适应乡村全面振兴需要的新职业，注重引导外出人才返乡、城市人才下乡创业，实施以工代赈，加快形成双向流动、互融互通的统筹城乡就业格局······推动农村低收入人口就业帮扶常态化，防止因失业导致规模性返贫。”\n③错误，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十二）完善困难人员就业援助制度······鼓励支持企业吸纳就业、自主创业，统筹用好公益性岗位，确保零就业家庭动态清零。”故“确保不出现零就业家庭”表述错误，应为“确保零就业家庭动态清零”。\n④错误，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十三）优化自主创业灵活就业保障制度······对就业困难人员、离校2年内未就业高校毕业生灵活就业的，按照规定给予一定的社会保险补贴。”故“各种类型的就业困难高校毕业生”表述错误，应为“就业困难人员、离校2年内未就业高校毕业生灵活就业的”。\n⑤正确，《意见》在“四、完善重点群体就业支持体系”部分指出：“（九）拓展高校毕业生等青年就业成才渠道······提升青年就业服务效能，强化针对性职业指导、职业介绍、技能培训、见习实习，形成衔接校内校外、助力成长成才的服务支撑。”\n综上，①②⑤说法正确，共3项。\n故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"16070340","cat":"新思想","stem":"优化政务服务、提升行政效能是优化营商环境、建设全国统一大市场的必然要求，对加快构建新发展格局、推动高质量发展具有重要意义。关于优化政务服务、提升行政效能，下列举措恰当的是：\n①推进关联事项集成办，为企业和群众提供“一件事一次办”“一类事一站办”服务\n②推进线下办事“只进一门”，要求所有的银行网点、邮政网点、园区等都要设置便民服务点\n③推进企业和群众诉求“一线应答”，根据需要设置重点领域专席，不断提升12345热线接办效率\n④推进线上办事“一网通办”，推动各类政务服务事项和应用“应接尽接、应上尽上”，政府服务事项全面纳入同级政务服务平台管理和办理","options":{"A":"①②","B":"①③","C":"②④","D":"③④"},"answer":"B","explanation":"本题考查新思想。\n2024年01月16日，《国务院关于进一步优化政务服务提升行政效能推动“高效办成一件事”的指导意见》（以下简称《意见》）发布。\n①正确，《意见》在“三、全面深化政务服务模式创新”部分指出：“（四）推进关联事项集成办。从企业和群众视角出发，将需要多个部门办理或跨层级办理，关联性强、办理量大、办理时间相对集中的多个事项集成办理，为企业和群众提供‘一件事一次办’、‘一类事一站办’服务。明确每个‘一件事’的牵头部门和配合部门及各自职责，强化跨部门政策、业务、系统协同和数据共享······”\n②错误，《意见》在“二、全面加强政务服务渠道建设”部分指出：“（一）推进线下办事‘只进一门’······有关部门单设的政务服务窗口应整合并入本级政务服务中心，确不具备整合条件的要纳入一体化管理，按统一要求提供规范服务。结合经济社会发展状况、人口分布情况，统筹推进乡镇（街道）便民服务中心和村（社区）便民服务站建设。鼓励在有条件、有需求的银行网点、邮政网点、园区等设置便民服务点，探索利用集成式自助终端提供‘24小时不打烊’服务。国务院部门可根据实际需要设立政务服务大厅，集中提供办事服务。”故“要求所有的银行网点、邮政网点、园区等都要设置便民服务点”表述错误，应为“鼓励在有条件、有需求的银行网点、邮政网点、园区等设置便民服务点”。\n③正确，《意见》在“二、全面加强政务服务渠道建设”部分指出：“（三）推进企业和群众诉求‘一线应答’。依托12345政务服务便民热线加强政务服务热线归并，根据需要设置重点领域专席，不断提升12345热线接办效率，高效受理政务服务咨询、投诉、求助、建议和在线办理指导等诉求。建立健全‘接诉即办’机制，更好发挥热线直接面向企业和群众的窗口作用，及时了解问题建议，推动解决服务问题······”。\n④错误，《意见》在“二、全面加强政务服务渠道建设”部分指出：“（二）推进线上办事‘一网通办’······加强省级政务服务平台网上统一受理端建设，推动办件信息实时共享，实现办事申请‘一次提交’、办理结果‘多端获取’。依托各级政务服务平台整合联通各类办事服务系统，推动各类政务服务事项和应用‘应接尽接、应上尽上’，除法律法规另有规定或涉及国家秘密等外，政务服务事项全部纳入同级政务服务平台管理和办理。”故“政府服务事项全面纳入同级政务服务平台管理和办理”表述错误，应为“除法律法规另有规定或涉及国家秘密等外，政务服务事项全部纳入同级政务服务平台管理和办理”。\n综上，①③表述正确。\n故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"16069951","cat":"马克思主义","stem":"习近平总书记曾说：“我们要有钉钉子的精神，钉钉子往往不是一锤子就能钉好的，而是要一锤一锤接着敲，直到把钉子钉实钉牢，钉牢一颗再钉下一颗，不断钉下去，必然大有成效。如果东一榔头西一棒子，结果很可能是一颗钉子都钉不上、钉不牢。”这句话最能体现的哲学原理是：\n①量变与质变辩证统一\n②肯定与否定辩证统一\n③主要矛盾与次要矛盾辩证统一\n④尊重客观规律与发挥主观能动性辩证统一","options":{"A":"①②","B":"②③","C":"③④","D":"①④"},"answer":"D","explanation":"本题考查马克思主义。\n①正确，钉钉子要一锤一锤接着敲，直到钉实钉牢，体现了量的积累（每一锤）达到一定程度必然引起质的飞跃（钉牢一颗钉子）；不断钉下去，必然大有成效，体现了量变与质变的辩证统一关系。\n②错误，“肯定与否定辩证统一”指事物内部包含肯定和否定的因素，要通过辩证否定实现发展。题干强调的是持续用力、循序渐进，并未涉及对事物自身的肯定与否定。\n③错误，“主要矛盾与次要矛盾辩证统一”指在复杂事物发展过程中要抓关键、抓重点，统筹兼顾。题干强调的是工作方法上的持续性和连贯性，批评“东一榔头西一棒子”，重在防止分散用力，而非区分主次矛盾。\n④正确，钉钉子要尊重“一锤子钉不好”的客观规律，必须一锤一锤钉，又要发挥主观能动性，一锤一锤接着敲，不断钉下去，只有把二者结合起来，才能取得实效，体现了尊重客观规律与发挥主观能动性的辩证统一关系。\n故①④表述正确。\n故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"16070154","cat":"时事政治","stem":"“五年来，我们党以巨大的政治勇气和强烈的责任担当，提出一系列新理念新思想新战略，出台一系列重大方针政策，推出一系列重大举措，推进一系列重大工作，解决了许多长期想解决而没有解决的难题，办成了许多过去想办而没有办成的大事，推动党和国家事业发生历史性变革。”这段话最直接体现了马克思主义哲学的哪一观点？","options":{"A":"一切从实际出发","B":"人的意识具有能动性","C":"人民群众是历史的创造者","D":"生产关系反作用于生产力"},"answer":"B","explanation":"本题考查马克思主义。\nA项错误，一切从实际出发是马克思主义哲学的根本要求，该观点强调的是理论联系实际，实事求是，从客观实际出发来认识和解决问题。题干强调的是提出新理念新思想新战略、出台方针政策等发挥人的主观能动性，最终推动历史性变革，而并未直接强调这些行动是基于对实际情况的客观认识以及从实际出发来解决问题。\nB项正确，意识的能动作用是指意识能动地反映世界和通过实践改造世界的能力和作用，其最突出的表现是通过指导实践改造客观世界。题干明确描述了党通过提出新理念新思想新战略、出台方针政策等主动性的行动，推动了党和国家事业的历史性变革，直接体现了人的意识的能动性。\nC项错误，人民群众是历史的创造者强调的是人民群众在历史发展中的决定性作用。题干强调的是党发挥主观能动性最终推动了党和国家事业的历史性变革，而并未直接强调人民，也并未强调人民群众在历史发展中的决定性作用。\nD项错误，生产关系反作用于生产力强调的是生产关系对生产力的发展不是消极被动的，而是具有巨大的反作用，其讨论的是生产关系和生产力之间的相互作用关系。题干强调的是“党和国家事业的全面历史性变革”，不局限于经济领域，也不直接讲生产关系调整。\n故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"16069958","cat":"新思想","stem":"中国共产党党报党刊的发展历程，与中国共产党的奋斗历程密不可分。下列说法错误的是：","options":{"A":"《布尔塞维克》是解放战争时期中国共产党创办的中央机关刊物","B":"《人民日报》由《晋察冀日报》和晋冀鲁豫《人民日报》合并而来","C":"《红色中华》创刊于江西瑞金，初期为中华苏维埃共和国临时中央政府机关报","D":"《求是》杂志是党中央指导全党全国工作的重要思想理论阵地，前身是中共中央主办的《红旗》杂志"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，《布尔塞维克》于1927年10月至1932年7月出版，其名称源自俄语“共产党”的音译，属于中共中央在第二次国内革命战争时期的地下理论机关刊物。而解放战争时期是1946年至1949年。\nB项正确，1948年5月，晋察冀与晋冀鲁豫边区合并为华北解放区，同年6月15日，《晋察冀日报》和晋冀鲁豫《人民日报》合并为《人民日报》，是中国共产党中央委员会机关报。\nC项正确，1931年12月11日，《红色中华》创刊于江西瑞金，初期为中华苏维埃共和国临时中央政府机关报，《红色中华》的任务是发挥中央政府对苏维埃运动的积极领导作用。\nD项正确，《求是》杂志是中国共产党中央委员会主办的机关刊物，是党中央指导全党全国工作的重要思想理论阵地。《求是》杂志创刊于1988年7月1日，其前身是1958年中共中央创办的《红旗》杂志。\n本题为选非题，故正确答案为A。","no":16,"missingImage":false}],"count":16,"answerable":16,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"16069956","cat":"人文常识","stem":"“二十四史”是中国历代史学家精心编撰的纪传体史书，是中华民族珍贵的文化遗产。下列说法正确的是：","options":{"A":"《后汉书》记载了侯景之乱","B":"《南史》是南朝范晔编撰的史书","C":"《汉书》中《艺文志》是记述经济制度的专篇","D":"《史记》卷次中《五帝本纪》排序在《殷本纪》之前"},"answer":"D","explanation":"本题考查人文常识。\nA项错误，《后汉书》是南朝宋范晔编撰的史书，创作于南朝宋元嘉年间，是一部记载东汉历史的纪传体断代史。《后汉书》主要记述了上起东汉的汉光武帝建武元年（25年），下至汉献帝建安二十五年（220年），共195年的史事。而侯景之乱发生在南北朝时期的梁朝，属于南朝历史事件，时间远晚于东汉，不可能出现在《后汉书》中。\nB项错误，《南史》是中国历代官修正史“二十四史”之一，记述上起宋武帝刘裕永初元年（420年），下迄陈后主陈叔宝祯明三年（589年），包含南朝宋、齐、梁、陈四个朝代共一百七十年的历史。《南史》与《北史》为姊妹篇，由李大师及其子李延寿两代人编撰完成，而非范晔。\nC项错误，《汉书》由东汉班固编撰，班昭、马续补作，是中国首部纪传体断代史，成书于汉和帝年间，与《史记》《后汉书》《三国志》并称“前四史”。《汉书》中的《艺文志》在西汉刘歆《七略》基础上改编而成，是中国古代第一部系统性的图书目录、学术源流专篇，主要记录当时存世典籍、分类与学术流派。而记述经济制度、财政、农业、工商业等内容的专篇是《食货志》。\nD项正确，《史记》是西汉史学家司马迁撰写的纪传体史书，是中国历史上第一部纪传体通史，记载了上至上古传说中的黄帝时代，下至汉武帝太初四年间共三千多年的历史。全书由十二本纪、十表、八书、三十世家、七十列传构成，其中“本纪”是全书提纲，以王朝的更替为体，按年月时间记述帝王的言行政绩，照历史时间顺序：《五帝本纪》居首，其后依次为《夏本纪》《殷本纪》《周本纪》等。五帝时代早于殷商，因此《五帝本纪》在卷次排序上位于《殷本纪》之前。\n故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"16069939","cat":"人文常识","stem":"关于我国考古发现，下列说法错误的是:","options":{"A":"良渚文化主要分布于太湖地区，其文化遗址最大特色是所出土的玉器","B":"仰韶文化主要分布在黄河支流汇集的中原地区，其中较著名的是元谋人遗址","C":"大汶口文化主要分布在泰山周围地区，氏族墓地中晚期出现了男女合葬现象","D":"龙山文化是新石器时代晚期的文化，其陶器已开始使用轮制技术，器型规整"},"answer":"B","explanation":"A项正确，良渚文化是我国长江下游太湖流域新石器时代晚期的重要文化，距今约5300—4300年。该文化以大型古城址、祭坛、水利系统和大量制作精美的玉琮、玉璧、玉钺等礼器为突出特征，玉器工艺发达，象征着较高的社会等级与早期国家形态。\nB项错误，仰韶文化是黄河中游地区新石器时代的代表性文化，以彩陶为典型标志，著名遗址有陕西西安半坡遗址、河南陕县庙底沟遗址等。元谋人遗址位于云南元谋县，属于旧石器时代早期古人类遗址，与仰韶文化在时代、地域、文化属性上均不相符。\nC项正确，大汶口文化主要分布在以泰山为中心的黄河下游地区，距今约6500—4500 年。其墓葬材料丰富，早期以单人葬为主，中晚期出现男女合葬、夫妻合葬，同时墓葬规模与随葬品差异明显，反映出私有制出现、贫富分化与社会阶层逐步形成。\nD项正确，龙山文化是新石器时代晚期文化，主要分布于黄河中下游地区，距今约4500—4000 年。该文化普遍掌握快轮制陶技术，陶器以黑陶为代表，胎质细腻、器壁轻薄、造型规整，标志着我国史前制陶工艺达到较高水平。\n本题为选非题，故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"16069972","cat":"人文常识","stem":"下列诗文与人物对应错误的是（    ）。","options":{"A":"服牛乘马，衣裳是制—轩辕氏","B":"尝谷教民，爰制农事—神农氏","C":"木德风姓，八卦创焉—老聃","D":"始作书契，以代结绳—仓颉"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，出自三国时期曹植的《黄帝赞》，意思为驯服牛马作为交通工具，制作衣裳，开创文明礼制。歌颂黄帝（轩辕氏）做出的贡献。\nB项正确，出自出自明代孙承恩的《古像赞二百零五首·其三·神农》，意思为神农氏亲自尝试各种谷物，教导民众耕种，并制定了农耕的规章制度。此外，神农氏也尝百草，发明医药等。\nC项错误，出自三国时期曹植的《伏羲赞》，意思为伏羲作为东方木德之君，承风姓之始，首创八卦。因此对应的人物为伏羲。老聃就是老子，姓李名耳，字聃，春秋末期思想家、哲学家，道家学派创始人。\nD项正确，出自《四体书势》，意思为仓颉最早创造了文字，用来代替过去结绳记事的方法。\n本题为选非题，故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"15833835","cat":"法律常识","stem":"下列关于我国行政处罚制度的说法，错误的是（    ）。","options":{"A":"乡镇人民政府、街道办事处有权行使部分行政处罚权","B":"限制人身自由的行政处罚，只能由法律和行政法规设定","C":"对行政处罚不服的，受处罚者均有权依法提起行政复议或者行政诉讼","D":"不满十四周岁的未成年人有违法行为的，不予行政处罚，责令监护人加以管教"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国行政处罚法》第二十四条第一、二款规定：“省、自治区、直辖市根据当地实际情况，可以决定将基层管理迫切需要的县级人民政府部门的行政处罚权交由能够有效承接的乡镇人民政府、街道办事处行使，并定期组织评估。决定应当公布。承接行政处罚权的乡镇人民政府、街道办事处应当加强执法能力建设，按照规定范围、依照法定程序实施行政处罚。”\nB项错误，根据《中华人民共和国行政处罚法》第十条第二款规定：“限制人身自由的行政处罚，只能由法律设定。”第十一条第一款规定：“行政法规可以设定除限制人身自由以外的行政处罚。”本项中，行政法规不能设定限制人身自由的行政处罚。\nC项正确，根据《中华人民共和国行政处罚法》第七条第一款规定：“公民、法人或者其他组织对行政机关所给予的行政处罚，享有陈述权、申辩权；对行政处罚不服的，有权依法申请行政复议或者提起行政诉讼。”\nD项正确，根据《中华人民共和国行政处罚法》第三十条规定：“不满十四周岁的未成年人有违法行为的，不予行政处罚，责令监护人加以管教；已满十四周岁不满十八周岁的未成年人有违法行为的，应当从轻或者减轻行政处罚。”\n本题为选非题，故正确答案为B。","no":20,"missingImage":false},{"type":"question","qid":"16069975","cat":"法律常识","stem":"《民营经济促进法》规定平等对待民营经济组织，保障公平竞争。下列做法符合该规定的是：","options":{"A":"某市规范性文件规定，限制信用等级B级以下的民营企业参加政府采购交易活动","B":"某市严格把控数据安全，限缩民营企业使用公共交通数据的授权范围","C":"某银行风控规范要求，民营企业信贷审批需要公司法人提供连带保证","D":"某银行合理设置小型民营企业不良贷款容忍度、健全尽职免责机制"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国民营经济促进法》第十四条第一款规定：“公共资源交易活动应当公开透明、公平公正，依法平等对待包括民营经济组织在内的各类经济组织。”本项中，以信用等级为由限制民营企业参与政府采购，属于排斥民营经济组织参与公共资源交易，违反平等对待、公平竞争原则，因此，某市限制信用等级B级以下的民营企业参加政府采购交易活动，不符合《中华人民共和国民营经济促进法》规定。\nB项错误，根据《中华人民共和国民营经济促进法》第十二条规定：“国家保障民营经济组织依法平等使用资金、技术、人力资源、数据、土地及其他自然资源等各类生产要素和公共服务资源，依法平等适用国家支持发展的政策。”第十三条规定：“各级人民政府及其有关部门依照法定权限，在制定、实施政府资金安排、土地供应、排污指标、公共数据开放、资质许可、标准制定、项目申报、职称评定、评优评先、人力资源等方面的政策措施时，平等对待民营经济组织。”因此，限缩民营企业使用公共数据的授权范围，剥夺其平等使用数据要素的权利，不符合《中华人民共和国民营经济促进法》规定。\nC项错误，根据《中华人民共和国民营经济促进法》第二十四条规定：“金融机构在授信、信贷管理、风控管理、服务收费等方面应当平等对待民营经济组织。金融机构违反与民营经济组织借款人的约定，单方面增加发放贷款条件、中止发放贷款或者提前收回贷款的，依法承担违约责任。”因此，对民营企业单独设置“法人连带保证”的额外担保要求，违反金融机构平等对待民营经济组织的原则，不符合《中华人民共和国民营经济促进法》规定。\nD项正确，根据《中华人民共和国民营经济促进法》第二十条规定：“国务院有关部门依据职责发挥货币政策工具和宏观信贷政策的激励约束作用，按照市场化、法治化原则，对金融机构向小型微型民营经济组织提供金融服务实施差异化政策，督促引导金融机构合理设置不良贷款容忍度、建立健全尽职免责机制、提升专业服务能力，提高为民营经济组织提供金融服务的水平。”因此，某银行合理设置小型民营企业不良贷款容忍度、健全尽职免责机制，符合《中华人民共和国民营经济促进法》规定。\n故正确答案为D。","no":21,"missingImage":false},{"type":"question","qid":"16070161","cat":"经济常识","stem":"关于金融知识，下列说法错误的是：","options":{"A":"外汇结构性理财产品可以挂钩大宗商品、对冲基金、黄金石油等标的","B":"股票净值，又称股票的票面价值，是指每股股票所包含的实际资产的价值","C":"开放式基金是指基金份额总额不固定，基金份额可以在基金合同约定的时间和场所申购或赎回的基金","D":"债券的票面利率取决于债券发行时的市场利率、债券期限、发行者信用水平、债券的流动性水平等因素"},"answer":"B","explanation":"本题考查经济常识。\nA项正确，外汇结构性理财产品是一种将固定收益类资产与金融衍生品结合的理财产品。它们通常会设定一个最低保本额，保本额上的浮动收益取决于产品挂钩标的的表现。这些挂钩标的可以非常广泛，包括大宗商品、境外上市的股票价格或指数、对冲基金和黄金石油等。\nB项错误，股票净值亦称“股票的账面价值”，指每个普通股能够分配到的公司会计账面上的净价值，是股票所含实际资产的价值。它等于公司净值减去流通在外的公司优先股总面额后的余额再除以流通在外的普通股数。“股票的票面价值”是一个固定的数值，主要用于表明股票所代表的资本数额和在公司总股本中的比例，但它并不直接反映股票的实际资产的价值。\nC项正确，按基金运作方式不同，基金可分为封闭式基金和开放式基金。其中开放式基金是指基金份额总额不固定，基金份额可以在基金合同约定的时间和场所申购或者赎回的基金。\nD项正确，债券的票面利率取决于债券发行时的市场利率、债券期限、发行者信用水平、债券的流动性水平等因素。发行时市场利率越高，票面利率就越高；债券期限越长，票面利率就越高；发行者信用水平越高，票面利率就越低；债券的流动性越高，票面利率就越低。\n本题为选非题，故正确答案为B。","no":22,"missingImage":false},{"type":"question","qid":"16069959","cat":"人文常识","stem":"下列语句与其所蕴含的经济学原理对应正确的是：","options":{"A":"物以多为贱——沉没成本","B":"酒香不怕巷子深——买方市场","C":"众人拾柴火焰高——规模经济","D":"物至而反，冬夏是也。致至而危，累棋是也——边际效用递增"},"answer":"C","explanation":"本题考查经济常识。\nA项错误，“物以多为贱”反映的是供给影响价格的供需原理，供大于求，价格下跌；供小于求，价格上升。所以“物以多为贱”反映的是商品供给过剩导致价格下跌。沉没成本指已发生且不可回收的支出，如已经流逝的时间、金钱或精力等，与物品贵贱无关。\nB项错误，买方市场指商品供大于求导致买方占据交易优势的市场形态。反之，卖方市场指商品供不应求促使卖方掌握主动权的市场形态。“酒香不怕巷子深”描述优质产品无需广告即可吸引消费者，体现的是卖方占据主导地位，所以应该是卖方市场。\nC项正确，规模经济指随着生产规模扩大，单位产品的平均成本下降，效率提升。“众人拾柴火焰高”形象比喻集体协作能放大产出效益，与企业通过扩大生产、分工协作降低单位成本的经济逻辑相符合。\nD项错误，“物至而反，冬夏是也。致至而危，累棋是也”大意为事物发展到极致必转向反面，对应经济学中的边际效用递减，即随着消费者对某种物品消费量的增加，每增加消费一单位该物品带来的满足感递减，甚至转为负效用。而边际效用递增是指随着消费者对某种物品的消费量增加，每增加消费一单位该物品所带来的满足感逐步上升。\n故正确答案为C。","no":23,"missingImage":false},{"type":"question","qid":"16070153","cat":"地理国情","stem":"我国幅员辽阔，各地风土人情迥异，天南地北皆有壮美景色。下列有关说法错误的是（    ）。","options":{"A":"新疆天山天池和长白山天池同属火山湖","B":"海南是个多民族聚居的省份，其少数民族中黎族人口最多","C":"福建武夷山、四川青城山、江西龙虎山都属于典型的丹霞地貌","D":"山东泰山地形高峻，河流短小流急，多瀑布，形成潭瀑交替的景观"},"answer":"A","explanation":"本题考查地理国情。\nA项错误，长白山天池是火山多次喷发后，火山口塌陷积水形成的典型火山口湖，属于火山湖的范畴；而新疆天山天池是冰川刨蚀、冰碛物堵塞形成的冰碛堰塞湖，不属于火山湖的范畴。\nB项正确，海南省是我国多民族聚居的热带岛屿省份，有30余个民族成分，世居民族包含黎族、苗族、回族等。根据第七次全国人口普查数据，其中黎族人口超149万，占全省少数民族总人口84%以上，是海南人口最多的少数民族，也是海南独有的世居少数民族。\nC项正确，丹霞地貌以陆相红色砂砾岩为成景基底，经流水侵蚀、风化剥落等作用形成赤壁丹崖的核心景观。福建武夷山、江西龙虎山、四川青城山均为我国丹霞地貌典型代表；其中武夷山是世界文化与自然双重遗产，江西龙虎山是“中国丹霞”世界自然遗产的核心组成部分。\nD项正确，泰山为断块隆升山地，主峰玉皇顶与周边平原相对高差超1300米，整体地形高峻、地势起伏剧烈。受地形限制，区域内河流短小流急，流水侵蚀作用形成大量瀑布与冲蚀深潭，最终造就了潭瀑交替的特色水文景观。\n本题为选非题，故正确答案为A。","no":24,"missingImage":false},{"type":"question","qid":"17467551","cat":"人文常识","stem":"肥胖会严重影响人体健康，饮食控制是治疗肥胖症的一种有效手段。在摄入量相同且不考虑烹饪方式的情况下，下列四份食谱中热量值最低的是（    ）。","options":{"A":"鸭肉、馒头、马铃薯、葡萄","B":"鲈鱼、大米饭、黄瓜、橙子","C":"鸡蛋、花卷、胡萝卜、榴莲","D":"五花肉、烧饼、鲜香菇、西瓜"},"answer":"B","explanation":"本题考查科技常识。\n相同摄入量且不考虑烹饪方式的情况下，食材中脂肪、糖类或碳水化合物含量越高，整体热量值越高；低脂优质蛋白、高膳食纤维蔬菜及低糖水果占比越高，整体热量值越低。\nA项错误，鸭肉脂肪含量中等，馒头与马铃薯均为淀粉含量较高的主食，葡萄含糖量偏高。整体食材脂肪与碳水化合物占比偏高，因此该食谱整体热量处于中等水平。\nB项正确，鲈鱼为低脂高蛋白的白肉，热量密度显著偏低，大米饭为常规精制主食，黄瓜属于极低热量的高纤维蔬菜，橙子为低糖水果。全餐以低脂、低糖、高纤维食材为主，脂肪与精制碳水占比最低，故该食谱热量值最低。\nC项错误，花卷为精制淀粉类主食，胡萝卜相比黄瓜而言，碳水化合物含量较高，榴莲为高脂高糖水果，热量密度极高，大幅提升了整份食谱的热量水平。\nD项错误，五花肉为高脂肪肉类，热量密度极高，烧饼属于高油高淀粉主食，二者共同构成极高热量来源，即便鲜香菇与西瓜热量较低，也无法降低整体热量，故该食谱为四组中热量最高的组合。\n故正确答案为B。","no":25,"missingImage":false},{"type":"question","qid":"16070217","cat":"科技常识","stem":"炎炎夏日，花露水是人们常备的避暑物品。花露水以乙醇、香精、蒸馏水为主要原料混合配制，颜色多为淡湖蓝、绿、黄。下列有关说法正确的是（    ）。","options":{"A":"花露水具有消毒杀菌作用","B":"花露水可以消除蚊子叮咬的肿包","C":"花露水放在暴晒的车内没有安全隐患","D":"在患处擦拭花露水能有效改善过敏性皮炎症状"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，花露水以乙醇、香精、蒸馏水为主要原料配制而成，其中乙醇（酒精）浓度通常在50%-75%，主流产品多为70%左右，该浓度区间能使微生物蛋白质变性，起到良好的消毒杀菌作用，可用于日常去污、抑菌、防痱、止痒等场景。\nB项错误，花露水对于蚊虫叮咬后产生的肿包没有促进消除的作用，酒精挥发吸热可以暂时止痒，某些花露水中含有的薄荷、冰片等成分也有清凉止痒效果。被蚊虫叮咬后，如果皮肤已有破损，涂抹花露水反而可能加重创面刺激，正确的做法是选用炉甘石洗剂或合规的糖皮质激素类药膏。\nC项错误，花露水含有大量酒精，属于易燃易爆物品。在夏季暴晒的车内，温度可高达\u003cimg data-k=\"665d47a9336c\">以上，密闭空间内酒精大量挥发，会形成易燃易爆的混合气体，遇静电、明火极易引发燃烧甚至爆炸，因此花露水严禁长时间放在暴晒的车内。\nD项错误，花露水中的酒精、香精等成分会刺激本就受损的皮肤屏障，加重过敏性皮炎的红肿、灼热感，甚至诱发更严重的过敏反应。皮炎患者应避免使用花露水，及时就医并使用专用药物治疗。\n故正确答案为A。","no":26,"missingImage":false},{"type":"question","qid":"16069971","cat":"人文常识","stem":"咖啡因是一种中枢神经兴奋剂，能够暂时驱走睡意并恢复精力，咖啡、茶和能量饮料中都含有咖啡因成分。下列有关说法正确的是（    ）。","options":{"A":"过量饮用能量饮料可能引发心脏不适","B":"茶叶颜色的深浅能反映咖啡因的含量多少","C":"未经发酵的绿茶，咖啡因含量比完全发酵的红茶高","D":"相比常压下煮出的咖啡，蒸汽加压煮的咖啡所含咖啡因含量更低"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，能量饮料通常含有高浓度咖啡因及其他兴奋成分（如牛磺酸、瓜拉纳等），过量摄入咖啡因会导致中枢神经与心血管系统兴奋，可能引发心脏不适，导致心率加快、血压升高、心悸、心律异常等。\nB项错误，茶叶颜色的深浅与咖啡因含量无直接关联。茶叶颜色由发酵程度和氧化程度决定（如绿茶未发酵，颜色浅；红茶全发酵，颜色深），而咖啡因含量主要取决于茶树品种、采摘部位、冲泡方式等。\n‌C项错误，未经发酵的绿茶与完全发酵的红茶之间的咖啡因含量高低无固定规律，同原料前提下，绿茶与红茶咖啡因总量相近。因为咖啡因实际含量更多取决于茶树品种、嫩度、冲泡条件，与是否发酵无必然高低关系。\nD项错误，咖啡因溶出率与压力、温度、时间呈正相关，相比常压下煮出的咖啡，蒸汽加压（如意式浓缩咖啡的制作方法）属于高温高压短时间萃取，单位体积咖啡液中所含咖啡因含量更高，而非“更低”。\n故正确答案为A。","no":27,"missingImage":false},{"type":"question","qid":"16069917","cat":"科技常识","stem":"下列选项体现的物理原理与其他选项不同的是（    ）。","options":{"A":"三角形的泡泡棒吹出的泡泡总是趋于球状","B":"植物根部的毛细管从土壤中吸收水分","C":"眼镜镜片的表面镀膜可以防蓝光","D":"雨后荷叶上的水珠呈球形"},"answer":"C","explanation":"本题考查科技常识。\nA、D两项正确，三角形的泡泡棒吹出的泡泡最终呈球形，雨后荷叶上的水珠呈球形，都是因为液体表面张力的作用，表面张力会使液体表面尽可能收缩到最小表面积（相同体积下球形表面积最小），因此体现的是表面张力原理。\nB项正确，毛细作用是液体表面对固体表面的吸引力。当毛细管插入浸润液体中，管内液面上升，高于管外液面；毛细管插入不浸润液体中，管内液体下降，低于管外液面。植物根部毛细管从土壤中吸水，利用的是毛细现象，而毛细现象本质上是液体表面张力与附着层分子相互作用力共同作用的结果，核心原理是表面张力。\nC项错误，眼镜镜片的表面镀膜防蓝光，利用的是光的干涉原理。镜片表面镀多层纳米级光学薄膜，蓝光入射时，在膜层上表面与下表面分别反射，两束反射光相位相反、发生相消干涉，大幅降低蓝光透过率。与表面张力无关。\n本题为选非题，故正确答案为C。","no":28,"missingImage":false},{"type":"question","qid":"16070218","cat":"地理国情","stem":"极光是一种绚丽多彩的大气发光现象，一般只在南北两极的高纬度地区出现，它的形成与太阳活动、地球磁场和高层大气的相互作用有关。由此判断观测极光需要的条件是（    ）。","options":{"A":"太阳活动强烈，月圆的夜晚","B":"太阳活动强烈，晴朗的夜晚","C":"太阳活动微弱，多云的夜晚","D":"太阳活动微弱，下雨的夜晚"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，B项正确，极光的产生依赖于太阳活动释放的高能带电粒子与地球磁场的相互作用。当太阳活动强烈时，更多高能带电粒子进入地球两极，激发高层大气中的原子发光，形成极光。而极光亮度较低，需在无云层遮挡且无其他光污染的晴朗夜晚才能清晰观测。但月圆的夜晚通常月光强烈，明亮的月光会严重削弱极光的可见度，甚至使其完全不可见。故“太阳活动强烈，晴朗的夜晚”可以观测到极光。\n‌C、D两项错误，太阳活动微弱时，太阳风强度降低，进入地球两极的高能带电粒子减少，极光出现的频率和强度显著降低，甚至无法形成可见极光。下雨意味着云层厚密，而在多云的夜晚，云层会完全遮挡极光，不具备极光的观测条件。\n故正确答案为B。","no":29,"missingImage":false},{"type":"question","qid":"16070166","cat":"人文常识","stem":"若将一个弹簧拉力器的一端固定在天花板上，握住另一端用力缓慢竖直下拉，假设弹簧具有一定的质量且均匀分布，则弹簧拉力器最可能断裂的位置是（    ）。","options":{"A":"弹簧拉力器的上部","B":"弹簧拉力器的中部","C":"弹簧拉力器的下部","D":"上、下部同时断裂"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，弹簧自身有均匀分布的质量，缓慢下拉过程中，弹簧上部不仅要承受人手施加的拉力，还要承担下方整段弹簧的全部重力，越靠近上端，弹簧所承受的总张力越大，应力也最大，因此最容易在此处发生断裂。\nB项错误，中部弹簧仅需承受人手拉力与下方一半弹簧的重力，所受张力明显小于上端，应力水平不足以使其先于上部断裂。\nC现错误，下部弹簧只需要承受人手施加的拉力，无需承担额外的弹簧自重，所受张力最小，是整根弹簧中应力最低的位置，几乎不会最先断裂。\nD项错误，由于弹簧上下位置的受力存在显著差异，上部受力远大于下部，应力分布极不均匀，不可能出现上下同时达到断裂极限的情况。\n故正确答案为A。","no":30,"missingImage":false}],"count":14,"answerable":14,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"16069882","cat":"逻辑填空","stem":"中国有着悠久灿烂的文明，同时开创了人类历史上最为            的现代化进程，中国故事精彩非凡、激动人心，也需要精彩讲述、更好传播。\n填入画横线部分最恰当的一项是：","options":{"A":"五彩斑斓","B":"流光溢彩","C":"波澜壮阔","D":"汹涌澎湃"},"answer":"C","explanation":"横线处所填成语搭配“现代化进程”，且根据文意可知，横线处应体现中国现代化进程气势宏大、规模宏伟。C项“波澜壮阔”比喻声势雄壮或规模巨大，多用于形容事业、进程等，与“现代化进程”搭配恰当，且符合文意，当选。\nA项“五彩斑斓”指多种颜色错杂而繁多耀眼，B项“流光溢彩”形容光彩明亮华丽，跳动闪烁，均多用于形容色彩，与“现代化进程”搭配不当，排除；D项“汹涌澎湃”多形容声势浩大，不可阻挡，常用来形容水流、情绪等，与“现代化进程”搭配不当，排除。\n故正确答案为C。\n【文段出处】人民网《以中国话语讲好中国故事（新论）》","no":31,"missingImage":false},{"type":"question","qid":"16069880","cat":"逻辑填空","stem":"《永乐大典》成书于明永乐六年，是中国古代最大的类书，《不列颠百科全书》称其为“世界有史以来最大的百科全书”，共计22937卷，11095册，约3.7亿字，收先秦至明初的各类典籍七八千种，被称为典籍        、佚书宝库。","options":{"A":"本源","B":"渊薮","C":"桂冠","D":"文荟"},"answer":"B","explanation":"顿号提示横线处与“佚书宝库”构成并列，且根据“世界有史以来最大的百科全书”“收先秦至明初的各类典籍七八千种”可知，横线处应体现《永乐大典》汇聚了各类典籍之意，B项“渊薮”指人或事物聚集的地方，置于此处表达典籍汇集之意，为常见表达，符合文意，当选。\nA项“本源”指事物产生的根源，横线处强调的是典籍的汇聚，而非根源，排除；\nC项“桂冠”指竞赛中的冠军，与文意无关，排除；\nD项“文荟”指文化、文艺精华汇聚之所或文化荟萃的状态‌，常被用作机构、场所或活动的名称，“文”与“典籍”重复，排除。\n故正确答案为B。\n【文段出处】长江日报《&lt;永乐大典&gt;是怎样上“热搜”的》","no":32,"missingImage":false},{"type":"question","qid":"16069895","cat":"逻辑填空","stem":"未来，数字科技将会持续深度赋能文化产业，数字文化产业新模式、新业态更加丰富，文化产业的产业链、生态链、价值链更为        。我们应着重培养市场主体，探索建构文化全产业链，        文化供给与文化需求的错位，引导文化企业坚持社会效益与经济效益的高度统一，不断提升文化产品和服务的供给质量。\n依次填入画横线部分最恰当的一项是：","options":{"A":"完备 消解","B":"完善 拉开","C":"完好 弥补","D":"完美 避开"},"answer":"A","explanation":"本题可从第二空入手，横线处词语搭配“错位”，根据 “应着重培养市场主体，探索建构文化全产业链”“引导文化企业坚持社会效益与经济效益的高度统一”可知，横线处应表达要解决、消除文化供给与需求不匹配、不协调的问题。A项“消解”意为消释、消除，与“错位”搭配恰当，符合文意，保留。B项“拉开”指摆开，放开，增加差距，置于此处表达让错位变得更大，与文意相悖，排除；C项“弥补”指补偿、填补，常搭配“短板”“不足”等，与“错位”搭配不当，排除；D项“避开”指躲开、回避，侧重主动绕开问题，不主动解决，文段强调要主动消除错位，与“错位”搭配不当且与文意不符，排除。\n第一空，代入验证。搭配“产业链、生态链、价值链”，且根据“数字科技将会持续深度赋能文化产业，数字文化产业新模式、新业态更加丰富”可知，横线处应表达相关产业链条变得齐全，完整，A项“完备”指应该有的全都有了，符合文意，当选。\n故正确答案为A。\n【文段出处】云南师范大学学报（哲学社会科学版）《“十四五”我国文化产业高质量发展的战略定位与路径选择》","no":33,"missingImage":false},{"type":"question","qid":"16069963","cat":"逻辑填空","stem":"现有研究认为，虚拟孵化之所以能培育创业企业，是基于网络聚集了人力和资本资源，帮助创业企业实现了资源        。事实上，无论是传统孵化还是虚拟孵化，提供资源是孵化平台帮助创业企业克服新生        、获取竞争优势的重要方式。\n依次填入画横线部分最恰当的一项是：","options":{"A":"汇聚 颓势","B":"聚积 弱势","C":"聚拢 态势","D":"聚合 劣势"},"answer":"D","explanation":"本题可从第二空入手，根据文意及顿号可知，横线处所填词语与“新生”搭配且与后文的“优势”构成反义并列关系，表达创业企业处于新生阶段，面临着竞争中的不利条件或不足之处之意。B项“弱势”指力量弱小的地位或状态，D项“劣势”指在力量或态势上处于比对方不利的条件或地位，置于此处都能表达出新生企业在竞争中相对不利的状况，符合文意，保留。A项“颓势”指衰败、没落的趋势或形势，通常用于描述事物已经出现明显的衰败迹象，但新生企业处于起步和成长初期，只是相对基础薄弱、竞争力不足，而非已呈现出衰败的趋势，与文意不符，排除；C项“态势”指状态和形势，为中性词，无法体现出新生企业面临的不利状况，排除。\n第一空，搭配“资源”，且根据文意可知，横线处词语表示因网络聚集了人力和资本资源为创业企业带来的积极作用，应与前文的“聚集”在语义上构成对应。D项“聚合”指聚集并结合，强调不仅集中，还能整合为一体，常搭配“资源”，能很好地体现虚拟孵化将人力和资本资源整合为一个有机整体的过程，符合文意，当选。B项“聚积”强调的是通过长时间的积累使数量增多，常搭配“财富”“物资”等，侧重于积累的过程，而文段强调的是虚拟孵化借助网络对人力和资本资源进行整合，并非单纯数量上的积累，与文意不符，排除。\n故正确答案为D。\n【文段出处】知网《虚拟孵化对创业企业数字化的使能机理：组织学习视角的案例研究》","no":34,"missingImage":false},{"type":"question","qid":"16069929","cat":"逻辑填空","stem":"高山草甸四周海拔较高的陡峭山地往往是不同生态系统的交界处，生存环境和食物资源更为多样，这使得赤狐可以大展拳脚，        在不同景观的边缘，将捕食效率最大化，同时也将风险降至最低，可谓            。即使在内蒙古达赉湖、宁夏贺兰山等地，赤狐的洞穴也经常出现。\n依次填入画横线部分最恰当的一项是：","options":{"A":"逡巡 从容不迫","B":"盘桓 张弛有度","C":"游走 进退自如","D":"驻留 攻守兼备"},"answer":"C","explanation":"第一空，根据“······在不同景观的边缘，将捕食效率最大化，同时也将风险降至最低”可知，横线处所填词语需体现赤狐能够主动、灵活地穿梭在不同景观边缘的意思，C项“游走”指四处走动、来回移动，置于此处能够体现赤狐的动态性和灵活性，符合文意，保留。A项“逡巡”指有所顾虑而徘徊不前，文段并未体现赤狐有所顾虑，排除；B项“盘桓”指逗留、徘徊，D项“驻留”指在某处暂时停留，两项均强调“停留不走”的状态，与文意不符，排除。\n第二空，代入验证。C项“进退自如”指无论是前进还是后退都能得心应手，可对应前文“捕食效率最大化”（进）和“风险降至最低”（退），与文意相符，当选。\n故正确答案为C。","no":35,"missingImage":false},{"type":"question","qid":"16069947","cat":"逻辑填空","stem":"史诗类电视剧可以被视为一种文化记忆的        ，其目的不仅是呈现特定时期的历史社会文本，而且也是向观众传递镌刻在历史中的社会价值和思想观念。经由历史重现，向观众传递正确的社会价值和思想观念，是史诗类电视剧创制的            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"表现 金科玉律","B":"投影 玉圭金臬","C":"展示 不二之选","D":"再现 应有之义"},"answer":"D","explanation":"第一空，横线处形容“史诗类电视剧”与“文化记忆”之间的关系，根据横线后“呈现特定时期的历史社会文本”可知，横线处应体现出“史诗类电视剧”能够把文化记忆呈现、还原出来之意，A项“表现”意为表示出来，C项“展示”指清楚地摆出来、明显地表现，D项“再现”指（过去的事情）再次出现，均符合文意且与“文化记忆”搭配恰当，保留。B项“投影”意为投射在一个面或一条线上的物体的影子或图形，比喻甲事物在乙事物上面表现出来的迹象，文段并无“投射”之意，排除。\n第二空，根据横线前“也是向观众传递镌刻在历史中的社会价值和思想观念”及“向观众传递正确的社会价值和思想观念”可知，横线处应体现“史诗类电视剧”应该通过其创作向观众传达正确的社会价值和思想观念之意，D项“应有之义”指应该有的义理，符合文意，当选。A项“金科玉律”比喻必须遵守、不能变更的信条，具有强制性和权威性，置于此处程度过重，排除；C项“不二之选”意为没有比这个选择更好的了，文段并无“选择”的语境，与文意不符，排除。\n故正确答案为D。\n【文段出处】光明日报《在酸甜苦辣中向阳而生》","no":36,"missingImage":false},{"type":"question","qid":"16069937","cat":"逻辑填空","stem":"一种能监测心脏术后并发症的新设备可以完成比传统的起搏器更复杂的监测。起搏器只能提供心脏的整体图像，但新设备可以提供更        的图像，具体显示出心脏哪些区域功能不正常。其上分布的微电极阵列可从心房的多个位置绘制电信号活动，并按需传递电刺激，以便在        的时候解除房颤，恢复正常心律。\n依次填入画横线部分最恰当的一项是：","options":{"A":"清晰 需要","B":"细致 关键","C":"直观 适当","D":"完整 凶险"},"answer":"B","explanation":"第一空，根据横线前转折词“但”及后文“具体显示出心脏哪些区域功能不正常”可知，横线处所填词语应与“整体”构成转折关系，表达新设备提供的图像更具体、更精细之意。B项“细致”指精细周密，符合文意，保留。A项“清晰”指清楚，而文段并未对比图像的清晰度，且其反义词应为“模糊”，无法与“整体”构成转折，排除；C项“直观”指直接观察的，与具体、精细无关，排除；D项“完整”指没有损坏或残缺，与“整体”语义相近，无法构成转折关系，排除。\n第二空，代入验证。B项“关键”比喻事物最紧要的部分，对事情起决定作用的因素，置于此处能表达在重要、紧急时刻解除房颤之意，逻辑合理，当选。\n故正确答案为B。\n【文段出处】《可溶解的心脏监测设备》","no":37,"missingImage":false},{"type":"question","qid":"16069949","cat":"逻辑填空","stem":"托育服务是由3岁以下婴幼儿的法定监护人之外的人或机构，在特定时间内进行的一种组织化、系统化的照顾服务活动。在现代社会中，妇女外出就业造成的亲职抚育困境愈发        。家庭结构的小型化也造成婴幼儿照顾的代际支持        ，加之年轻父母对婴幼儿照护要求的精细化，托育服务作为一种          儿童福利，越来越成为城市工薪家庭的重要选择。\n依次填入画横线部分最恰当的一项是：","options":{"A":"突出 薄弱 辅助性","B":"明显 短缺 基础性","C":"普遍 不足 补充性","D":"典型 欠缺 支持性"},"answer":"C","explanation":"第一空，搭配“亲职抚育困境”“愈发”，A项“突出”指超过一般地显露出来，B项“明显”指清楚地显露出来，容易让人看出或感觉到，C项“普遍”指广泛而有共同性，均与“亲职抚育困境”“愈发”搭配恰当，保留。D项“典型”指具有代表性的人或事物，与“愈发”搭配不当，且文段未提及该困境代表了什么样的人或事物，排除。\n第二空，搭配“代际支持”，根据“托育服务作为一种······儿童福利，越来越成为城市工薪家庭的重要选择”可知，横线处所填词语应体现代际支持不够之意，B项“短缺”指缺乏，不足，C项“不足”表示数量或程度上的不充分，无法满足需求，均符合文意且搭配恰当，保留。A项“薄弱”指容易破坏或动摇，不雄厚，不坚强，一般搭配“兵力”“基础”“意志”，与“代际支持”搭配不当，排除。\n第三空，根据“托育服务是由3岁以下婴幼儿的法定监护人之外······系统化的照顾服务活动”可知，横线处所填词语应体现托育是额外的支持之意，C项“补充性”指因不足或损失而加以添补的，符合文意，当选。B项“基础性”指基本的，与文意不符，排除。\n故正确答案为C。\n【文段出处】学术论坛期刊《我国托育服务的社区化转向：逻辑与路径》","no":38,"missingImage":false},{"type":"question","qid":"16070308","cat":"逻辑填空","stem":"人工智能技术飞速发展，逐渐向人类智能水平逼近。科学家们在研究过程中愈发清晰地意识到，许多棘手的问题并非单凭一家公司之力就能成功解决。除了至今            的“电车难题”外，还有日益重要的价值观        问题——当AI拥有了自主设定目标的能力时，又该如何确保这些由AI自行确定的目标符合人类利益、与人类价值观相        ？\n依次填入画横线部分最恰当的一项是：","options":{"A":"争论不休 构建 吻合","B":"流口常谈 践行 出入","C":"悬而未决 对齐 契合","D":"束手无策 匹配 切合"},"answer":"C","explanation":"第一空，搭配“电车难题”，且根据“许多棘手的问题并非单凭一家公司之力就能成功解决”可知，横线处所填成语应表达“电车难题”至今没有解决之意，C项“悬而未决”指一直拖在那里，没有得到解决，符合文意，保留。A项“争论不休”比喻双方或多方对某一个问题各执一端，讨论不出最终的结果，谁也不肯停下来，B项“流口常谈”指人人挂在嘴上的老话，均无法体现没有解决之意，排除；D项“束手无策”形容遇到问题时毫无解决的办法，程度过重，且主语通常为人，一般表述为“令人束手无策的‘电车难题’”，排除。\n第二空，代入验证。搭配“价值观”，C项“对齐”指的是使两个或多个事物在位置、方向或功能上达到整齐、一致或协调的状态，与“价值观”搭配恰当，保留。\n第三空，代入验证。根据“、”可知，横线处所填词语与“符合”意思接近，C项“契合”指投合，符合，符合文意，当选。\n故正确答案为C。\n【文段出处】微信公众号：中国战略新兴产业《从互撕到约谈：马斯克与奥特曼的“AI冷战”突然破冰？》","no":39,"missingImage":false},{"type":"question","qid":"16069881","cat":"逻辑填空","stem":"近年来，随着“中华文明探源研究”“考古中国”等重大项目的深入实施，中国考古学界积极推动多学科交叉融合，不断利用新手段、新工具提升田野考古发掘水平与研究阐释能力，        了历史轴线，        了历史信度，丰富了历史内涵，        了历史场景。\n依次填入画横线部分最恰当的一项是：","options":{"A":"廓张 平添 加强","B":"延伸 增强 活化","C":"接续 提高 恢复","D":"拓长 充实 还原"},"answer":"B","explanation":"第一空，搭配“历史轴线”，且根据“不断利用新手段、新工具提升田野考古发掘水平与研究阐释能力”以及“丰富了历史内涵”可知，横线处所填词语应体现新手段、新工具的使用使历史轴线延长之意。B项“延伸”指延长、伸展，D项“拓长”指扩展并延长，均与“历史轴线”搭配恰当，保留。A项“廓张”指扩散、扩大，与“历史轴线”搭配不当，排除；C项“接续”指接着前面的，继续，文段未体现历史轴线曾处于中断状态之意，与文意不符，排除。\n第二空，搭配“历史信度”，B项“增强”指增进、加强，与“历史信度”搭配恰当，保留。D项“充实”指丰富、充足，常搭配“细节”“内容”“队伍”等，与“历史信度”搭配不当，排除。\n第三空，代入验证，B项“活化”指使物质、细胞、机体恢复或增强活力，与“历史场景”搭配恰当，当选。\n故正确答案为B。\n【文段出处】社科院专刊《深化文化遗产研究阐释工作》","no":40,"missingImage":false},{"type":"question","qid":"16069925","cat":"片段阅读","stem":"目前，以京津冀、长三角、粤港澳大湾区、成渝、中部地区城市群为核心的快递枢纽集群建设已基本成形，全球性国际寄递中心、境外地面网络和海外仓加快建设，农村寄递服务网络实现下乡进村，宅递、箱递、站递等多元化末端服务体系初步形成。我国快递业拥有专业物流园区400多个，营业网点41.3万处，快递运输汽车27万多辆，全货机近200架。重点城市群内快件1日达、国内重点城市间次日达已成为常态。\n这段文字意在说明：","options":{"A":"我国快递业通过完善基础设施推动了城乡寄送服务均衡发展","B":"我国快递业将聚焦全球寄递网络建设以提升国际运输时效","C":"我国快递业依托“枢纽+网络”建设实现了物流及寄递能力全面发展","D":"我国快递业在农村寄递网络建设及寄递时效提升上成效显著"},"answer":"C","explanation":"文段开篇指出“以城市群为核心的快递枢纽集群”已基本建设成形，随后指出“全球性国际寄递中心、境外地面网络和海外仓”加快建设、“农村寄递服务网络”实现下乡进村。接下来通过列数据的形式说明我国快递业物流能力显著增强，进而提升了寄递能力。故文段通过并列结构说明快递业依托枢纽集群与地面网络，提升了物流能力和寄递能力，对应C项。\nA项“城乡”、B项“全球寄递网络”、D项“农村”均仅对应文段部分内容，文段提及我国快递业覆盖城市与农村，同时“全球性国际寄递中心、境外地面网络和海外仓”也加快建设，表述片面，排除。\n故正确答案为C。\n【文段出处】求是网《更好发挥快递业引领作用 有效降低全社会物流成本》","no":41,"missingImage":false},{"type":"question","qid":"16069924","cat":"片段阅读","stem":"美，向来不是强造出来的，落在城市绿化上更是如此。一座美丽城市的内核，在于人们对大自然的珍爱与敬畏、人与自然的和谐共生。近年来，我国的城市绿化得到快速发展，遍布公园广场的观赏草坪、街道两旁齐整的行道树、绿草如茵的足球场都为园林城市建设增色不少，极大地提升了观赏性与舒适度。但一些城市绿化中也出现了相互跟风、贪美求贵、追求“四季有花”等现象，不仅成为城市建设的不能承受之重，也与生态文明建设的初衷背道而驰。\n接下来作者最有可能讲述的是：","options":{"A":"如何实事求是地进行城市绿化","B":"城市绿化要综合考虑多种可能","C":"城市绿化绝不能贪美求贵","D":"让城市绿化更好地造福人民"},"answer":"A","explanation":"文段以城市绿化之美不能强造开篇，进而论述美丽城市的内核是人与自然和谐共生，随后阐述我国城市绿化快速发展带来的成效。接着通过转折词“但”引出当前城市绿化存在的问题，并强调其负面影响。按照行文逻辑，接下来最可能围绕“如何纠正这些问题、正确开展绿化”展开论述。文段的问题核心是“跟风、贪美求贵、追求‘四季有花’等”，本质是“不实事求是”，因此接下来最可能讲“如何实事求是地开展绿化”，对应A项。\nB项，“综合考虑多种可能”表述不明确，未明确指向文段中“跟风、贪美求贵、追求‘四季有花’”的具体问题，针对性不强，排除；\nC项，仅针对文段中“贪美求贵”这一个现象，表述片面，排除；\nD项，强调意义效果，未针对尾句问题提出解决对策，逻辑不连贯，排除。\n故正确答案为A。\n【文段出处】新华时评《城市绿化不能贪美求贵》","no":42,"missingImage":false},{"type":"question","qid":"16069930","cat":"片段阅读","stem":"在我国，对农业生产造成重大危害的多数昆虫都具有迁飞性。草地贪夜蛾、黏虫等具有“春夏北迁，秋冬南迁”的习性。由于昆虫个体小、重量轻，飞行能力有限，远距离迁飞主要借助气流运载。季风、台风、西太平洋副热带高压的位置与强度变化等因素都会对害虫的迁飞扩散产生重要影响。每年春夏，害虫大军从中南半岛等地随西南季风迁飞入我国，之后又随西南季风或东南季风暖湿气流继续北上。到了秋冬，草地贪夜蛾、黏虫等为逃避低温环境，只好迁回温暖的南方。这是昆虫逃避不良环境条件的一种生存对策。\n这段文字重在说明害虫大军迁飞的：","options":{"A":"地域密码","B":"季节规律","C":"环境影响","D":"生存策略"},"answer":"B","explanation":"文段开篇引出话题“多数昆虫都具有迁飞性”，随后提出观点，草地贪夜蛾、黏虫等具有“春夏北迁，秋冬南迁”的习性，即害虫大军迁飞的季节规律。后文对其进行原因解释，从季风、台风、西太平洋副热带高压的位置与强度变化等因素具体论述如何影响其迁飞的季节规律，文段最后一句通过“这”对前文“逃避低温环境”进行补充说明。故文段重在说明害虫大军迁飞的季节规律，对应B项。\nA项“地域密码”文段并非重点描述，虽然提及南北方，但“春夏北迁，秋冬南迁”重点是强调季节的规律，排除；\nC项“环境影响”对应“季风、台风、西太平洋副热带高压的位置与强度变化等因素”，为原因解释部分内容，非重点，排除；\nD项“生存策略”出现在尾句，是对“逃避低温环境”进行的补充说明，并非全文重点，排除。\n故正确答案为B。\n【文段出处】中国农业科学院植物保护研究所《一探究竟 “虫军”迁飞的气象“密码”》","no":43,"missingImage":false},{"type":"question","qid":"16070287","cat":"片段阅读","stem":"20世纪中叶，分子生物学诞生，开启了在分子水平上研究生命及其活动的现代生命科学时代。这个时期的研究者采用“碎片化”的模式来研究生命及其生理或病理活动。但是，研究者逐渐认识到，生命活动并非是由一个个基因或蛋白质“零件”独立完成的，而是建立在生命体内众多基因、蛋白质和其他化学小分子形成的复杂相互作用之上；对于高等生物而言，除了分子层面复杂的相互作用网络外，还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用。\n根据这段文字，可以推出：","options":{"A":"生命活动是一种复杂系统的整体行为","B":"低等生物的生命活动由基因独立完成","C":"分子层面的研究是理解高等生物的关键","D":"现代科学主要采用“碎片化”模式研究生命活动"},"answer":"A","explanation":"A项，根据“生命活动并非是由一个个基因或蛋白质‘零件’独立完成的，而是建立在生命体内众多基因、蛋白质和其他化学小分子形成的复杂相互作用之上······还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用”可知，表述正确，当选；\nB项，根据“生命活动并非是由一个个基因或蛋白质‘零件’独立完成的”可知，文段是一个普遍性的陈述，并未区分低等生物和高等生物，尽管后文提及高等生物有额外的介观层面相互作用，但并不意味着低等生物的生命活动可以由基因独立完成，无中生有，排除；\nC项，根据“除了分子层面复杂的相互作用网络外，还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用”可知，除了“分子层面的研究”，还存在“细胞、组织和器官等不同介观层面”，未提及分子层面的研究是理解高等生物的“关键”，偷换逻辑，排除；\nD项，根据“20世纪中叶，分子生物学诞生······这个时期的研究者采用‘碎片化’的模式来研究生命及其生理或病理活动”和“但是，研究者逐渐认识到，生命活动并非是······”可知，20 世纪中叶使用了“碎片化”的模式，后来研究者逐渐认识到该模式的弊端，故无法得出现代科学“主要采用”“碎片化”模式研究生命活动，排除。\n故正确答案为A。\n【文段出处】中国网《生命大科学：从微观到介观的组学研究》","no":44,"missingImage":false},{"type":"question","qid":"16069943","cat":"片段阅读","stem":"晚安牛奶的最大卖点在于“高褪黑素含量”。有品牌标明“褪黑素含量：12500pg/盒”，1pg等于万亿分之一克。而褪黑素的有效剂量在0.1~0.3毫克，这意味着需要喝约8000盒这种牛奶才能达到治疗剂量，因此晚安牛奶助眠更依赖于其安慰剂效应。如果某人有轻微的失眠困扰，还达不到临床上失眠的诊断标准，又能够排除器质性或精神疾病因素导致的失眠，个体比较相信晚安牛奶，或者喝后有效，在这种有益无害的前提下，不妨食用。\n这段文字意在强调：","options":{"A":"晚安牛奶的助眠效果主要源自心理作用","B":"晚安牛奶能助眠是商家的虚假宣传","C":"多喝晚安牛奶才能起到助眠作用","D":"晚安牛奶有较好的助眠效果"},"answer":"A","explanation":"文段首先通过晚安牛奶的最大卖点，引出“高褪黑素含量”话题，之后通过数据对比指出品牌标明的褪黑素含量远远达不到褪黑素的治疗剂量，随后通过结论词“因此”引出结论，即晚安牛奶助眠更依赖于其安慰剂效应。最后进行补充说明，指出在某些轻微、非器质性或精神疾病因素导致的失眠且在本人相信等情况下可以食用。故文段重在强调晚安牛奶助眠效果的真正来源是安慰剂作用，即心理作用，对应A项。\nB项，“商家的虚假宣传”文段并未提及，无中生有，排除；\nC项，“多喝晚安牛奶才能起到助眠作用”非重点，虽然文段提到“需要喝约8000盒”，但这只是为了证明晚安牛奶的褪黑素含量低，排除；\nD项，“晚安牛奶有较好的助眠效果”偏离重点，文段重点强调“晚安牛奶的助眠效果主要靠安慰剂作用”，排除。\n故正确答案为A。\n【文段出处】中华网《网红“晚安牛奶”真能助眠吗？医生：喝8000瓶才有效》","no":45,"missingImage":false},{"type":"question","qid":"16069932","cat":"语句表达","stem":"①如今，有些文字砖在未被发现前就已经消匿了，尽量多地发现并解读文字砖，成为了钩沉历史的重要途径\n②我国古代的很多国家工程都实行“物勒工名”制\n③砖上的文字记录了长城修建者的信息，甚至还有远隔百里千里之外的地名\n④在今天河北、北京、山西等地的明长城上有一些带有文字的砖，它们被称为长城文字砖\n⑤长城文字砖上的每个文字都是史书之外的鲜活符号，为我们解锁那段历史提供了秘钥\n⑥透过文字砖，我们可以辨识出某段长城是由谁修造的，还可通过上面的地名探察明朝国防的客兵制度\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②③④⑥⑤①","B":"④⑤②⑥③①","C":"②④⑥⑤③①","D":"④③②⑥⑤①"},"answer":"D","explanation":"对比选项，确定首句。②句介绍中国古代很多国家都实行“物勒工名”这一制度，介绍“物勒工名”的背景，④句通过下定义，引出“长城文字砖”这一话题，二者均适合作为首句，无法排除选项。\n观察题干，可以发现①句、⑤句、⑥句都介绍了“长城文字砖”对解答历史的重要意义，③句介绍了长城文字砖上的文字信息。故根据行文逻辑可以判断，文段应先介绍文字砖上的信息内容，再介绍基于其具备的重要历史价值。因此③句应在①句、⑤句、⑥句之前，排除B、C两项，保留A、D两项。\n对比A、D两项发现，可通过确定③句和④句的顺序确定答案。③句介绍长城文字砖上记录的具体信息，④句通过下定义的方式引出长城文字砖的话题，应先引出文字砖的话题，再具体介绍砖上的信息内容，故④句应在③句之前，排除A项，D项当选。\n故正确答案为D。\n【文段出处】中国国家地理《透过文字砖 看明长城隐藏的历史信息》","no":46,"missingImage":false},{"type":"question","qid":"16069878","cat":"片段阅读","stem":"智能社会的演进模糊了社会心态与社会行为的边界，呈现出线上线下虚实共生、心态风险与行动风险交织缠绕的特征，这对社会心态的治理策略与治理工具提出了新的挑战。社交软件的分享机制与算法推荐规律，都以对人类心理特征的精准利用为前提。此类技术往往把复杂的人类互动过程简化为点赞、转发等二元化的态度立场或简单行为，虽然便利了个体表达观点，却可能导致网络行为高度两极化，让许多事实错误但情绪饱满的虚假信息快速传播，成为网络空间治理的一大顽疾。\n这段文字意在强调：","options":{"A":"智能社会对社会心态治理提出了新的挑战","B":"智能化加速了从社会心态到社会行为的转化","C":"社交软件的算法可能导致网络行为高度两极化","D":"智能社会当务之急是要加强网络空间治理"},"answer":"A","explanation":"文段开篇介绍了智能社会演进所呈现的特征，并指出这对社会心态的治理提出了新挑战。随后指出社交软件的分享机制与算法推荐规律会简化人类的互动行为，导致网络行为高度两极化，让虚假信息传播，成为网络空间治理的一大顽疾，即对前文进行了解释说明。故文段重点在首句，强调智能社会的演进对社会心态治理提出了新挑战，对应A项。\nB项，“加速了从社会心态到社会行为的转化”无中生有，文段未提及，排除；\nC项，“可能导致网络行为高度两极化”对应分述句部分，非重点，且缺少文段主题词“智能社会”，排除；\nD项，文段的问题是“智能社会对社会心态的治理提出新挑战”，若想提对策，也应该是针对“社会心态”，“要加强网络空间治理”偏离文段核心，对策不具备针对性，排除。\n故正确答案为A。\n【文段出处】光明日报《以“智”臻“善”：社会心态治理的发展趋势》","no":47,"missingImage":false},{"type":"question","qid":"16069968","cat":"片段阅读","stem":"普惠金融体系面临的重要挑战之一是服务对象存在标准化数据少、个体风险高、抵押品少、个性化需求多等特征，因此发展普惠金融需要不同类型的金融机构和企业共同分担风险和损失，比如融资担保等风险共担机制即为解决上述问题的一种手段，不过费用设计、合作模式等都有待于进一步创新。\n这段文字意在说明：","options":{"A":"普惠金融体系费用设计和合作模式亟待创新","B":"普惠金融体系建设要逐步拓宽金融服务领域","C":"普惠金融体系建设有必要完善风险共担机制","D":"普惠金融体系面临来自服务对象的多重挑战"},"answer":"C","explanation":"文段首先介绍了普惠金融体系面临的一大重要挑战，为问题引入。随后以“因此”+“需要”引导对策“发展普惠金融需要不同类型的金融机构和企业共同分担风险和损失”，并以“比如”引导举例论证，结尾处虽出现转折词“不过”，但其引导的“费用设计、合作模式等都有待于进一步创新”实为对风险共担机制的具体完善。所以中心句仍为“因此”引导的对策句，对应C项。\nA项，对应文段尾句对“风险共担机制”补充说明的内容，非文段重点，且C项既包含文段的核心对策“风险共担机制”，又通过“有必要完善”概括了“费用设计、合作模式等都有待于进一步创新”，更为全面完整，故排除A项；\nB项，“逐步拓宽金融服务领域”文段未提及，无中生有，排除；\nD项，“面临来自服务对象的多重挑战”为问题表述，非重点，排除。\n故正确答案为C。\n【文段出处】《建设高质量普惠金融体系：目标任务、发展实践和挑战应对》","no":48,"missingImage":false},{"type":"question","qid":"16069876","cat":"片段阅读","stem":"人形机器人的传感器像是人类的眼睛、耳朵和皮肤，扮演着感知器官的角色。视觉传感器通过摄像头捕捉环境图像；声音传感器接收并解析语音指令；力觉传感器仿效人体的力觉感受，精确感知与外界的接触力；触觉传感器模仿人类触觉，精准感知物体的形状和硬度。控制系统是人形机器人的大脑，借助计算单元和智能算法处理数据并作出决策。多种智能算法的应用让机器人越来越接近人类，比如利用深度神经网络，处理视觉、语音识别等任务。\n根据这段文字，对“人形机器人的设计原理”概括最准确的是：","options":{"A":"借助多功能传感器实现智能化处理","B":"仿生学与机械工程的有机融合","C":"赋予精准触觉，提升感知能力","D":"传感技术与控制理论的集成突破"},"answer":"D","explanation":"文段首先指出人形机器人的传感器扮演感知器官的角色，并具体介绍视觉、声音、力觉和触觉传感器的作用。随后指出控制系统如同人类大脑，借助计算单元和智能算法处理数据并作出决策，并说明智能算法的应用使其更接近人类。故文段为并列结构，从传感器与控制系统两个角度论述了人形机器人的设计原理，对应D项。\nA项“多功能传感器”、C项“触觉”和“提升感知能力”均仅对应传感器部分，未提及“控制系统”，表述片面，排除；\nB项，“机械工程”文段未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】人民日报《探索人形机器人的奥秘（开卷知新）》","no":49,"missingImage":false},{"type":"question","qid":"16069933","cat":"语句表达","stem":"通过将城市物联网系统与互联网系统进行充分融合，借助大数据、云计算等数字信息处理技术，管理者可以将城市运行过程中所产生的海量数据资源进行充分整合，在提取有效信息后进行优化决策，形成科学可行的城市治理方案。利用物联网技术改造城市传统基础设施，将其接入城市物联网系统并使其智能化，由此可以增进城市各子系统同使用者、管理者之间的高效协作关系，                    。\n填入画横线处最恰当的是：","options":{"A":"进而提高城市系统的整体运行效率","B":"从而更好发挥物联网的价值创造功能","C":"有效提升互联网和物联网的可靠性和安全性","D":"从多个维度改善城市环境和人们的生活质量"},"answer":"A","explanation":"横线出现在文段结尾，且为尾句的分句，故需结合横线前内容以及横线所在尾句内容进行分析。文段开篇提出城市物联网与互联网融合能形成科学可行的城市治理方案，紧接着论述通过物联网技术改造传统基础设施能增进城市各子系统同使用者、管理者之间的高效协作关系，故横线处应承接前文“高效协作”，体现其对城市系统的直接影响，即提升城市系统整体运行效率，对应A项。\nB项，“发挥价值创造功能”偏离文段核心话题“城市治理”，表述片面，排除；\nC项，“可靠性和安全性”文段中未提及，无中生有，排除；\nD项，“城市环境和人们的生活质量”文段中未提及，无中生有，且与前文“高效协作”衔接不当，排除。\n故正确答案为A。\n【文段出处】经济与管理评论编辑部《新发展阶段物联网赋能经济高质量发展的路径与支持体系研究 》","no":50,"missingImage":false},{"type":"question","qid":"16069873","cat":"片段阅读","stem":"“低空风怪”也叫下击暴流，是一股从雷暴云中快速下沉的强烈气流。如同瀑布一泻千里直击山石，“风怪”在触及地面后向四周爆发出强大的冲击力。当“风怪”呼啸而下时，速度最高可达每秒100米，比高铁还快。不仅如此，它还会在低空形成猛然四散的强风，击中地面时爆发出的水平风力最大可达17级，足以掀翻火车、轮船。“风怪”造成的大风会在几百米内风向突变，对飞机起降危害很大。\n接下来作者最有可能讲述的是：","options":{"A":"“低空风怪”的定义及其特征","B":"“低空风怪”威力强、危害大","C":"能否对“低空风怪”作出预警","D":"“低空风怪”与龙卷风的差异"},"answer":"C","explanation":"本题为接语选择题，需要在通读全文的基础上，重点关注文段最后讨论的核心话题。文段开篇引出“低空风怪”这一话题，随后分别论述了其冲击力强、风速快、风力大的特点，尾句强调“低空风怪”的危害，即对飞机起降危害性很大。故下文应该继续围绕“低空风怪”的危害性进一步延伸，最有可能探讨预警“低空风怪”的相关话题，C项当选。\nA项“‘低空风怪’的定义及其特征”与B项“‘低空风怪’威力强、危害大”均为前文已论述过的内容，后文不会再次论述，排除；\nD项，“龙卷风”文段并未提及，与前文衔接不当，排除。\n故正确答案为C。\n【文段出处】光明网·文摘报《降服“低空风怪”》","no":51,"missingImage":false},{"type":"question","qid":"16070179","cat":"片段阅读","stem":"一年中的大部分时间，成年棕熊都是离群索居的动物。但当大量鲑鱼洄游到湖中繁殖时，常常会有几十头棕熊同时聚集在湖边。过高的种群密度和相对有限的理想捕鱼位置，决定了它们必须竞争进食序列。在这个巨大的“餐桌”周围，进食的座次是由实力来决定的，成年公熊之间常常为了争夺捕鱼位置在湖畔发生激烈打斗，胜者赢得一切。在这个时期，湖畔通常是被雄性棕熊所占据的，当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们，幼熊易遭到撕咬而死亡。\n由这段文字无法推出：","options":{"A":"成年棕熊在争夺食物时竞争非常激烈","B":"成年棕熊的进食序列主要由实力决定","C":"鲑鱼繁殖期的湖畔对幼熊会更加危险","D":"雌熊带幼熊靠近湖畔是为了捕食鲑鱼"},"answer":"D","explanation":"A项：根据“成年公熊之间常常为了争夺捕鱼位置在湖畔发生激烈打斗”可知，符合文意，排除；\nB项：根据“在这个巨大的‘餐桌’周围，进食的座次是由实力来决定的”可知，符合文意，排除；\nC项：根据“当大量鲑鱼洄游到湖中繁殖时，······在这个时期······当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们，幼熊易遭到撕咬而死亡”可知，符合文意，排除；\nD项：文段仅指出“当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们”，但并未提及它们靠近的目的是捕食鲑鱼，无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】中国国家地理网《堪察加棕熊 为森林“运氮”的鲑鱼猎手》","no":52,"missingImage":false},{"type":"question","qid":"16069890","cat":"片段阅读","stem":"有人认为海山是孤立的水下岛屿。事实真是这样吗？因为海洋的分割，岛屿上确实会形成相对孤立的岛屿生物群，生物群落比较独特，特有种比例高，但总体多样性低。在海山上，除鱼虾等游泳动物外，大型生物主要是一些固着生活或移动能力差的动物，它们主要通过海流转移和扩散幼体。海山是否“孤立”，取决于栖息其上的生物幼体扩散是否受到限制。地形和海流的相互作用可在海山顶部形成封闭环流，从而留住幼虫。但这些现象出现的频率很低，即便出现也不持久，因此难以将海山长期隔离成水下孤岛。\n最适合做这段文字标题的是：","options":{"A":"人类最不了解的生物栖息地","B":"海山：特有种的乐园","C":"海山是孤立的水下岛屿吗？","D":"海山：深海中的生命孤岛"},"answer":"C","explanation":"文段开篇引出“海山是否是孤立的水下岛屿”的话题，然后进行分析，先是介绍了岛屿的生物群落总体多样性较低，接着又阐述了在海山上大型生物基本都是靠海流转移和扩散幼体，然后指出海山是否“孤立”与生物幼体扩散是否受到限制有关，又分析封闭环流虽然能够留住幼虫，但这些现象出现的频率很低，最后通过“因此”引出观点，说明海山并非是水下孤岛。故文段整体围绕海山是否是孤立的水下岛屿这一话题展开，对应C项。\nA项，缺少文段主题词“海山”，排除；\nB项，“特有种”属于结论词“因此”之前的内容，非重点，排除；\nD项，与文意相悖，文段强调海山难以被隔离成水下孤岛，排除。\n故正确答案为C。\n【文段出处】《这类深海秘境人类只探索过其中1%，那里是生命“孤岛”还是“绿洲”？》","no":53,"missingImage":false},{"type":"question","qid":"16069894","cat":"片段阅读","stem":"在深度学习的过程中，实际确定误差并非易事。为解决这一问题，当前深度学习领域应用“损失函数”实现误差最小化，即在人工智能的学习过程中，找到能够最小化损失函数值的参数。但损失函数的形式会随具体情况而有所不同，难以全面掌握其特性，因此需要引入微分。微分主要用于分析某个变量的变化如何影响函数的值。通过对损失函数进行微分，可以明了参数变化时损失函数值的变化，进而调整参数值，让损失函数的值尽可能小。在针对性地进行编程后，人工智能能够自动完成上述任务。\n对这段文字概括最恰当的是：","options":{"A":"通过对损失函数进行微分，深度学习能实现误差最小化","B":"引入微分后，损失函数能帮助人工智能实现自主深度学习","C":"损失函数在深度学习中主要用于确定误差","D":"损失函数对深度学习的参数优化具有重要意义"},"answer":"A","explanation":"文段开篇介绍在深度学习过程中确定实际误差并非易事，接下来指出用“损失函数”实现误差最小化，随后“但”转折引出损失函数形式会随具体情况而有所不同，难以全面掌握其特性，紧接着通过“因此”强调需要引入微分，后文继续说明对损失函数微分能明确参数变化对损失值的影响，进而调整参数值让损失函数的值尽可能小，且进行针对性编程后人工智能就可自动完成任务。故文段核心在于对损失函数进行微分能帮助深度学习实现误差最小化，对应A项。\nB项，文段重点是“误差最小化”，并非“实现自主深度学习”，偏离文段中心，排除；\nC、D两项，均缺少“微分”这一主题词，偏离文段中心，排除。\n故正确答案为A。","no":54,"missingImage":false},{"type":"question","qid":"16069897","cat":"片段阅读","stem":"绿色供应链是一种在整个供应链中综合考虑环境影响和资源效率的现代管理模式。它以绿色制造理论和供应链管理技术为基础，涉及供应商、生产商、销售商、消费者和回收商，目的是使产品从物料获取、加工、包装、仓储、运输、使用到报废处理的整个过程，对环境影响最小，资源利用率最高。资源材料是绿色供应链的基础，其可持续性供给是实现绿色供应链的根本条件。\n根据这段文字，可以推出的是：","options":{"A":"传统供应链对环境影响的关注度较低","B":"应用绿色供应链，生产商和供应商最为关键","C":"绿色供应链的核心目标是增强可持续发展","D":"若资源材料供给不可持续，绿色供应链则难以实现"},"answer":"D","explanation":"A项，文段仅介绍了绿色供应链“综合考虑环境影响”，未提及传统供应链对环境影响的关注度，无中生有，排除；\nB项，根据“它以绿色制造理论和供应链管理技术为基础，涉及供应商、生产商、销售商、消费者和回收商”可知，“生产商和供应商最为关键”表述过于绝对，排除；\nC项，根据“目的是使产品从物料获取、加工、包装、仓储、运输、使用到报废处理的整个过程，对环境影响最小，资源利用率最高”可知，“核心目标是增强可持续发展”表述错误，排除；\nD项，根据“资源材料是绿色供应链的基础，其可持续性供给是实现绿色供应链的根本条件”可知，若资源材料供给不可持续，作为根本条件缺失，绿色供应链则难以实现，表述正确，当选。\n故正确答案为D。\n【文段出处】中国知网《打造绿色供应链 如何让电机“转”得更省》","no":55,"missingImage":false}],"count":25,"answerable":25,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"16070159","cat":"数学运算","stem":"运动心率即人体在运动时保持的心率状态，保持最佳的运动心率对于运动安全及运动效果来说都十分重要。一般来说，正常人最佳运动心率的范围是：最大运动心率=（220-年龄）×0.8次/分；最小运动心率=（220-年龄）×0.6次/分。那么正常人40岁时，最佳运动心率的范围为：","options":{"A":"108~132次/分","B":"132~144次/分","C":"108~144次/分","D":"144~176次/分"},"answer":"C","explanation":"根据题干给出的公式，当正常人40岁时，最大运动心率=（220-40）×0.8=144次/分；最小运动心率=（220-40）×0.6=108次/分。故正常人40岁时，最佳运动心率的范围为：108~144次/分。\n故正确答案为C。","no":56,"missingImage":false},{"type":"question","qid":"16070160","cat":"数学运算","stem":"木星冲日，即木星、地球和太阳三者处于一条直线上，且地球位于太阳和木星之间。已知2024年12月8日发生了木星冲日，若木星绕太阳公转的周期约为12个地球年，则下一次木星冲日发生于下列哪个时间段？","options":{"A":"2025年7月~9月","B":"2026年1月~3月","C":"2026年4月~6月","D":"2026年7月~9月"},"answer":"B","explanation":"已知地球绕太阳公转的周期为1个地球年，相当于钟表的分针（短且快）；木星绕太阳公转的周期约为12个地球年，相当于钟表的时针（长且慢）。“木星冲日，即木星、地球和太阳三者处于一条直线上，且地球位于太阳和木星之间”，相当于分针和时针重合。两针角速度差为\u003cimg data-k=\"a6de9a3e197b\">圈/年，则重合周期为\u003cimg data-k=\"01cb92d0abf5\">年\u003cimg data-k=\"600da2a3d77d\">1年零33天。已知2024年12月8日发生了木星冲日，则下一次约为2026年1月10日，在B项范围内。\n故正确答案为B。","no":57,"missingImage":false},{"type":"question","qid":"16070162","cat":"数学运算","stem":"某数字展馆沿入口两侧各设有3个展位。现需安排数字产品展位和人工智能展位各3个，且数字产品展位不能都安排在同一侧，那么共有多少种安排方式？","options":{"A":"244","B":"648","C":"684","D":"720"},"answer":"B","explanation":"方法一：根据题意，要求数字产品的3个展位不能都安排在同一侧，分类讨论如下：\n（1）左侧有1个数字产品展位和2个人工智能展位，其余展位在右侧，有\u003cimg data-k=\"4e407b9232a6\">\u003cimg data-k=\"971d23bf919e\">种安排方式；\n（2）左侧有2个数字产品展位和1个人工智能展位，其余展位在右侧，有\u003cimg data-k=\"33fcb76ad08f\">\u003cimg data-k=\"971d23bf919e\">种安排方式。\n综上，共有324+324=648种安排方式。\n方法二：可考虑逆向思维。总情况为将6个展位任意放置在左右两侧的6个位置，有\u003cimg data-k=\"b5af088a30fe\">种安排方式。要求数字产品的3个展位不能都安排在同一侧，反面为数字产品的3个展位均放在同一侧。从左、右两侧选择其中一侧，放入数字产品的3个展位，另一侧放入人工智能的3个展位，有\u003cimg data-k=\"b3430f62aacd\">种安排方式。因此，共有720-72=648种安排方式。\n故正确答案为B。","no":58,"missingImage":false},{"type":"question","qid":"16070173","cat":"数学运算","stem":"某县拟对某段运河开展河道治理。甲公司治理1米需要用时1.5天，投入5万元；乙公司治理1米需要用时2天，投入4万元。甲、乙两公司不能同时作业，若要求在365天内完成不少于200米的治理工作，则至少需要治理费用：","options":{"A":"832万元","B":"845万元","C":"860万元","D":"870万元"},"answer":"D","explanation":"根据题意要求总费用最少，则需治理总量尽量少，即完成200米的治理工作即可。又因甲公司治理费用为5万元/米，乙公司为4万元/米，要使总治理费用最低，则需乙公司治理距离尽量长。设乙公司治理x米，则甲公司治理（200-x）米，根据治理天数在365天内，可列式：\u003cimg data-k=\"c64ec555c9c9\">，解得\u003cimg data-k=\"bdbb4f17fbb9\">，x最大为130。则总治理费用最低为5×（200-130）+4×130=870万元。\n故正确答案为D。","no":59,"missingImage":false},{"type":"question","qid":"16070165","cat":"数学运算","stem":"城区某中学安排2位数学老师、4位英语老师到A、B两所乡村中学任教，要求两所乡村中学各安排3位老师，其中A中学至少需要安排1位数学老师。那么有多少种不同的安排方式？","options":{"A":"9","B":"12","C":"16","D":"20"},"answer":"C","explanation":"方法一：根据题意，A中学可以安排1位数学老师或2位数学老师，分类讨论如下：\n（1）A中学安排1位数学老师、2位英语老师，其余老师安排给B中学，有\u003cimg data-k=\"f680fdcc63ba\">种安排方式；\n（2）A中学安排2位数学老师、1位英语老师，其余老师安排给B中学，有\u003cimg data-k=\"e79bff1207ee\">种安排方式。\n分类用加法，则A中学至少需要安排1位数学老师的方式有12+4=16种。\n方法二：可考虑逆向思维。总情况为从6位老师中选3位去A中学，有\u003cimg data-k=\"e4071fc1b226\">种安排方式。要求A中学至少需要安排1位数学老师，反面为安排到A中学的3位老师全是英语老师，有\u003cimg data-k=\"e0f0f119e7e1\">种安排方式。因此，共有20-4=16种安排方式。\n故正确答案为C。","no":60,"missingImage":false},{"type":"question","qid":"17467542","cat":"数学运算","stem":"杜甫在《绝句》中写道：“两个黄鹂鸣翠柳，一行白鹭上青天。”从这十四个字中任取两个字，则声母相同的概率是多少？","options":{"A":"\u003cimg data-k=\"e77b0c0c3005\">","B":"\u003cimg data-k=\"94ad2fb4b9ec\">","C":"\u003cimg data-k=\"729d10d53f63\">","D":"\u003cimg data-k=\"311f5c2d861c\">"},"answer":"B","explanation":"从十四个字中任取两个字，总的情况数为\u003cimg data-k=\"cb629dec1c95\">种。十四个字的拼音分别为“liǎng gè huáng lí míng cuì liǔ，yì háng bái lù shàng qīng tiān。”其中相同的声母只有4个“l”和2个“h”。其中两个字声母均为l的情况数为\u003cimg data-k=\"7975261ec038\">种，两个字声母均为h的情况数为\u003cimg data-k=\"b9eb3665fae2\">种，分类用加法，则满足“两个字声母相同”条件的情况数为6+1=7种。根据公式：概率\u003cimg data-k=\"840bdad550b2\">，则题干所求概率\u003cimg data-k=\"b541100882c5\">。\n故正确答案为B。","no":61,"missingImage":false},{"type":"question","qid":"16070168","cat":"数学运算","stem":"体操世锦赛男团预赛一共有单杠、双杠、自由体操、鞍马、吊环、跳马六个项目，每个国家的比赛项目顺序由抽签决定。那么某个国家第一个比赛项目不是单杠，且自由体操不在双杠之后的概率是多少?","options":{"A":"\u003cimg data-k=\"264d1a7b506a\">","B":"\u003cimg data-k=\"54d707f15b45\">","C":"\u003cimg data-k=\"a6f7e1889399\">","D":"\u003cimg data-k=\"ff1b1de9ab8e\">"},"answer":"A","explanation":"根据题意，第一个比赛项目是六个项目中的任意一项的概率均为\u003cimg data-k=\"c7ce0624c5b3\">，则第一个比赛项目不是单杠的概率为\u003cimg data-k=\"365691502844\">；自由体操要么在双杠之前，要么在双杠之后，要求自由体操不在双杠之后，则自由体操在双杠之前，概率为\u003cimg data-k=\"54d707f15b45\">。分步用乘法，则所求概率\u003cimg data-k=\"152423188d63\">。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"16070169","cat":"数学运算","stem":"为了节约资源，保护环境，某企业需要购买A、B两种型号的污水处理设备共8台。A型设备月污水处理能力为240吨，价格为每台12万元，B型设备月污水处理能力为160吨，价格为每台10万元，企业最多支出90万元购买设备，且要求月污水处理能力不低于1600吨。那么A型污水处理设备最多可购买：","options":{"A":"3台","B":"4台","C":"5台","D":"6台"},"answer":"C","explanation":"方法一：根据题意可得A、B两种型号的设备每万元月污水处理能力分别为\u003cimg data-k=\"ce694a08cda9\">吨、\u003cimg data-k=\"8ba04ab82e89\">吨，相同支出情况下A型设备污水处理能力更强，但A型设备价格较高，结合题目问A型污水处理设备最多可购买多少，可从最大选项开始代入验证：\n代入D项，A型设备6台，则B型设备8-6=2台，总费用=6×12+2×10=72+20=92万元，超过90万预算，排除；\n代入C项，A型设备5台，则B型设备8-5=3台，总费用=5×12+3×10=60+30=90万元，刚好符合预算，总处理能力\u003cimg data-k=\"ec6c0c8d9dfa\">，符合能力要求。\n故正确答案为C。\n方法二：设购买A型设备x台，则B型设备(8-x)台。根据企业最多支出90万元可得\u003cimg data-k=\"b48c8a5160fd\">，根据要求月污水处理能力不低于1600吨可得\u003cimg data-k=\"33ed400db5cc\">，解得\u003cimg data-k=\"3627f68fe40e\">，因此A型设备最多可购买5台。\n故正确答案为C。","no":63,"missingImage":false},{"type":"question","qid":"16070163","cat":"数学运算","stem":"随着新型清洁能源、现代生态农牧的发展，昔日戈壁荒滩不仅成为光伏“蓝海”，还变成了养殖数万只“光伏羊”的繁茂草原。牧民甲、乙家中都有若干只“光伏羊”，乙若给甲20只羊，甲的羊数将是乙的K倍；甲若给乙K只羊，乙的羊数将是甲的一半；若K为正整数，那么K的值可能有多少个？","options":{"A":"5","B":"6","C":"7","D":"8"},"answer":"D","explanation":"设牧民甲、乙家中的光伏羊分别有x只、y只。根据题意可列方程组：\u003cimg data-k=\"03caf59a898c\">，将①式x=k（y-20）-20代入②式可得：k（y-20）-20-k=2（y+k），整理可得\u003cimg data-k=\"309e2b3d132f\">，变形后可得\u003cimg data-k=\"93683c165367\">，根据题意y为正整数，且k为正整数，则k-2为66的约数。对66进行因式分解：66=1×66=2×33=3×22=6×11，因此66的约数共8个，k-2共8种情况：\n当k-2=1时，k=3，y=89只，x=187只；\n当k-2=2时，k=4，y=56只，x=124只；\n当k-2=3时，k=5，y=45只，x=105只；\n当k-2=6时，k=8，y=34只，x=92只；\n当k-2=11时，k=13，y=29只，x=97只；\n当k-2=22时，k=24，y=26只，x=124只；\n当k-2=33时，k=35，y=25只，x=155只；\n当k-2=66时，k=68，y=24只，x=252只。\n则k值共有8种可能。\n故正确答案为D。","no":64,"missingImage":false},{"type":"question","qid":"16070268","cat":"数学运算","stem":"一家三口去旅游，拍摄单人照、合照一共68张。合照的数量比单人照的两倍少一张；合照中，全家福占了三分之二，且孩子出现的次数为爸爸妈妈出现次数之和的一半；孩子的单人照比爸爸、妈妈单人照数量之和多1张。那么孩子出现的照片一共有：","options":{"A":"52张","B":"48张","C":"45张","D":"37张"},"answer":"A","explanation":"根据“单人照、合照一共68张。合照的数量比单人照的两倍少一张”，可得单人照为\u003cimg data-k=\"cc0fdea91ae0\">张，合照为68−23=45张。因为“孩子的单人照比爸爸、妈妈单人照数量之和多1张”，则孩子单人照为\u003cimg data-k=\"ea4c9de35ad5\">张，爸爸、妈妈单人照为23−12=11张。由于“合照中，全家福占了三分之二”，则全家福数量为\u003cimg data-k=\"25e5c7eeca78\">张，两人合照数量为45−30=15张。\n设有孩子的两人合照为x张，则没有孩子的两人合照为(15−x)张。根据 “合照中孩子出现的次数为爸爸妈妈出现次数之和的一半”，可得方程\u003cimg data-k=\"c57dd4abd35a\">，解得x=10。所以孩子出现的照片一共有12+30+10=52张。\n故正确答案为A。","no":65,"missingImage":false},{"type":"question","qid":"17467567","cat":"数学运算","stem":"某小区内有一块直角扇形的草坪如下图所示，两条互相垂直的小路AC与BC分别长4米和3米。物业公司准备在四边形OACB围成的区域种植丁香花。如果小路面积忽略不计，则丁香花种植面积为多少平方米？\n\u003cimg data-k=\"605958ee4e3a\" style=\"max-width:200px\">","options":{"A":"11","B":"12","C":"13","D":"14"},"answer":"A","explanation":"连接AB，且延长CB、AO相交于D点，如下图所示：\n\u003cimg data-k=\"ae600f483878\" style=\"max-width:260px\">\n已知\u003cimg data-k=\"ea51df9274c3\">，AC=4米，BC=3米，在直角三角形ABC中，斜边\u003cimg data-k=\"6ddf3881488c\">米。由于AD所对圆周角为\u003cimg data-k=\"dd44efe89e5a\">，故AD为直径，AO=OD，则\u003cimg data-k=\"cc6c58aaa773\">与\u003cimg data-k=\"e94dc7f9baa4\">全等，BD=AB=5米，CD=CB+BD=3+5=8米。\u003cimg data-k=\"5c3a33a086cb\">\u003cimg data-k=\"6708a0c54db6\">，\u003cimg data-k=\"a81548148cc7\">\u003cimg data-k=\"2c0288cffbb7\">，\u003cimg data-k=\"e5ca10832156\">\u003cimg data-k=\"130237a0e28e\">。所求面积\u003cimg data-k=\"5138c7e5542e\">。\n故正确答案为A。","no":66,"missingImage":false},{"type":"question","qid":"16070196","cat":"数学运算","stem":"某风力发电机的三片风叶之间两两所成的角度为\u003cimg data-k=\"513220b8408e\">，当其中一片风叶OB与塔杆叠合时，一位身高1.8米的技术人员站在另一片风叶OA端头的正下方，测得塔杆顶部仰角为\u003cimg data-k=\"86c1f89cc9f5\">（如左下图所示）；若该技术人员站在离塔杆60米处，则测得塔杆顶部仰角为\u003cimg data-k=\"5f65827c69cc\">（如右下图所示）。那么风叶转动时叶片顶端最高离地面：\n\u003cimg data-k=\"b259ac2e2b05\" style=\"max-width:300px\">","options":{"A":"81.8米","B":"89.8米","C":"95.8米","D":"101.8米"},"answer":"D","explanation":"根据题意，在风叶转动过程中，叶片垂直地面达到最高点时顶端距地面最远，如图所示，最大距离=OA+OD+1.8米。\n\u003cimg data-k=\"80bdb83b907a\" style=\"max-width:200px\">\n根据题干右图所示，\u003cimg data-k=\"b2d8a7113c46\">且\u003cimg data-k=\"a790a1c6a949\">，可得\u003cimg data-k=\"97a84f5557d5\">为等腰直角三角形，技术人员离塔杆60米，可得OE=EP=60米；根据题干左图所示，\u003cimg data-k=\"2ec65cb8b3bb\">且\u003cimg data-k=\"db3910b14e7e\">，根据勾股定理可得，直角\u003cimg data-k=\"84460620214d\">三边之比为\u003cimg data-k=\"8203a47308a6\">，则\u003cimg data-k=\"e5431002f998\">\u003cimg data-k=\"00c47d9418b5\">米；根据题意，相邻风叶夹角均为\u003cimg data-k=\"513220b8408e\">，则\u003cimg data-k=\"e8c03c181b3c\">且\u003cimg data-k=\"14f8279717ab\">\u003cimg data-k=\"18179026085c\">，人在A点正下方，则\u003cimg data-k=\"0d7edf163977\">，\u003cimg data-k=\"7a7af2a3b611\">\u003cimg data-k=\"1419a0fd7b7a\">，同理可得直角\u003cimg data-k=\"aa502f60a1da\">三边之比为\u003cimg data-k=\"344e4ae36d24\">，则\u003cimg data-k=\"d8783108d583\">\u003cimg data-k=\"fa467a8a3c88\">米。\n综上，题干所求=OA+OD+1.8米=40米+60米+1.8米=101.8米。\n故正确答案为D。","no":67,"missingImage":false},{"type":"question","qid":"16070171","c
