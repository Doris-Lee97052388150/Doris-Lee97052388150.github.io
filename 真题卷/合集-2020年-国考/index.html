ssingImage":false},{"type":"question","qid":"2448405","cat":"数学运算","stem":"从一个装有水的水池中向外排水，规定每周二、四、六每天排出剩余水量的\u003cimg data-k=\"3a9dc4442269\">，其余日期每天排出剩余水量的\u003cimg data-k=\"3f05f5fdaaff\">。如此连续操作6天后，水池中剩余相当于总容量\u003cimg data-k=\"228c961e3d45\">的水。问最开始时水池中的水量最多相当于总容量的：","options":{"A":"\u003cimg data-k=\"524311ce6fd4\">","B":"\u003cimg data-k=\"35135e419f7b\">","C":"\u003cimg data-k=\"3f05f5fdaaff\">","D":"\u003cimg data-k=\"26aeee0b1f1d\">"},"answer":"C","explanation":"若想开始时的水量占比尽可能大，则最开始时的水量应尽可能多，由于最后剩余水量的占比一定，则每天排出的水要尽可能多。\n根据题意，每周二、四、六排水后剩余水量为前一天的\u003cimg data-k=\"a65028fb9b41\">；其余日期（周日、周一、周三、周五）每天剩余水量为前一天的\u003cimg data-k=\"f2b6bd972a2a\">。若要每日排出的水尽量多，则其余日期应尽量多。假设从周日开始计算，连续六天后，剩余水量为开始水量的：\u003cimg data-k=\"48171286af74\">。则最开始水池中的水量相当于总容量的\u003cimg data-k=\"345c6c64208b\">。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"2448415","cat":"数学运算","stem":"某单位从理工大学、政法大学和财经大学总计招聘应届毕业生三百多人。其中从理工大学招聘人数是政法大学和财经大学之和的\u003cimg data-k=\"cd4db1324e77\">，从政法大学招聘的人数比财经大学多\u003cimg data-k=\"1a67739c8245\">。问该单位至少再多招聘多少人，就能将从这三所大学招聘的应届生平均分配到7个部门？","options":{"A":"6","B":"5","C":"4","D":"3"},"answer":"A","explanation":"根据条件“理工大学招聘人数是政法大学和财经大学之和的\u003cimg data-k=\"cd4db1324e77\">”，则\u003cimg data-k=\"10bb27b2b0d6\">；“政法大学招聘的人数比财经大学多\u003cimg data-k=\"1a67739c8245\">”，则\u003cimg data-k=\"d935b95c4d79\">。设政法与财经大学的总招聘人数为\u003cimg data-k=\"4d3365261e89\">，则三所大学的总招聘人数为\u003cimg data-k=\"c28119edd2f0\">。根据“总计招聘应届毕业生三百多人”，则\u003cimg data-k=\"89f37a985f4e\">只能取值为3，此时总计招聘了\u003cimg data-k=\"43c770eb8d99\">人。\n若想将招聘的应届生平均分配到7个部门，大于351且能够被7整除的数最小为357，则还需要至少招聘\u003cimg data-k=\"21bc749eeb93\">人。\n故正确答案为A。","no":68,"missingImage":false},{"type":"question","qid":"2448429","cat":"数学运算","stem":"甲、乙两条生产线生产A和B两种产品。其中甲生产线生产A、B产品的效率分别是乙生产线的2倍和3倍。现有2种产品各\u003cimg data-k=\"2d9343580f7f\">件的生产任务，企业安排甲和乙生产线合作尽快完成任务，最终甲总共生产了\u003cimg data-k=\"f0cb37618e80\">件产品。问乙在单位时间内生产A的件数是生产B件数的多少倍？","options":{"A":"\u003cimg data-k=\"b11e6ad0961b\">","B":"\u003cimg data-k=\"d0daeb4b1a91\">","C":"\u003cimg data-k=\"3ec7c7086312\">","D":"\u003cimg data-k=\"bc33423274a6\">"},"answer":"A","explanation":"如下表所示，假设乙生产线生产A产品的效率为\u003cimg data-k=\"f82036fad5c4\">，生产B产品的效率为\u003cimg data-k=\"b0b4715579ef\">，则甲生产线生产A产品的效率为\u003cimg data-k=\"d42c4d91af4a\">，生产B产品的效率为\u003cimg data-k=\"be78899eb7de\">。\n\u003cimg data-k=\"273eb1708a05\" style=\"max-width:700px\">\nA产品甲的效率是乙的2倍，B产品甲的效率是乙的3倍，因此相对而言甲做B产品优势更明显，要想二者合作时间短，则让甲生产线生产B产品，乙生产线生产A产品。根据题意甲总共生产\u003cimg data-k=\"658f3a45ecde\">件产品可知甲生产了B产品\u003cimg data-k=\"27dbc967604b\">件，A产品\u003cimg data-k=\"d1fd1f4efadf\">件，则乙生产了剩余的A产品\u003cimg data-k=\"d1fd1f4efadf\">件。根据甲乙两条生产线工作时间相同，可列方程:\u003cimg data-k=\"66bfbe8cc182\">，解得\u003cimg data-k=\"e8d2505184c9\">，即乙在单位时间内生产A的件数是生产B件数的\u003cimg data-k=\"97dceef419de\">倍。\n故正确答案为A。","no":69,"missingImage":false},{"type":"question","qid":"2448449","cat":"数学运算","stem":"部队前哨站的雷达监测范围为100千米。某日前哨站侦测到正东偏北\u003cimg data-k=\"5608ab142532\">\u003cimg data-k=\"7801a3647a7c\">千米处，一架可疑无人机正匀速向正西方向飞行。前哨站通知正南方向150千米处的部队立即向正北方向发射无人机拦截，匀速飞行一段时间后，正好在某点与可疑无人机相遇。问我方无人机速度是可疑无人机的多少倍？","options":{"A":"\u003cimg data-k=\"79dd7f8819b3\">","B":"\u003cimg data-k=\"3d43c6c4300d\">","C":"\u003cimg data-k=\"1f3dc018727e\">","D":"\u003cimg data-k=\"1650c5a46940\">"},"answer":"C","explanation":"\u003cimg data-k=\"92e614d033e6\" style=\"max-width:245px\">\n根据题意可得我方无人机与可疑无人机运动轨迹如上图所示，二者最终在C点相遇，\u003cimg data-k=\"f3bf3e0f1c50\">。\n已知\u003cimg data-k=\"0a31463be8b0\">千米，\u003cimg data-k=\"65984be3f12f\">，则在直角三角形\u003cimg data-k=\"e70662d10b27\">中，\u003cimg data-k=\"4cb671af5b5c\">，\u003cimg data-k=\"4f87a1c20445\">千米，\u003cimg data-k=\"dd85b09fc37f\">千米，又已知\u003cimg data-k=\"853c5fa2bedb\">千米，则\u003cimg data-k=\"2b0d167331ff\">千米。\n相同时间，我方无人机从B点飞行到C点，可疑无人机从A点飞行到C点，速度之比等于路程之比，\u003cimg data-k=\"b319b9f30000\">，则我方无人机速度是可疑无人机的\u003cimg data-k=\"1f3dc018727e\">倍。\n故正确答案为C。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>某集团公司有生产、销售、研发、人事、财务、法务6个部门，现有从前到后的6栋办公楼：戊字楼、己字楼、庚字楼、辛字楼、壬字楼和癸字楼，每部门各一栋楼，并且各部门安排符合如下要求：\u003c/p>\u003cp>（1）销售部在财务部和生产部之前；\u003c/p>\u003cp>（2）人事部紧接在研发部或者生产部的后面；\u003c/p>\u003cp>（3）紧接在法务部后面的是研发部或者销售部。\u003c/p>","questions":[{"qid":"2448400","cat":"逻辑判断","stem":"下列各部门办公楼按照从前到后的顺序排列，哪项符合上述要求？","options":{"A":"法务部、研发部、销售部、财务部、生产部、人事部","B":"财务部、法务部、研发部、人事部、销售部、生产部","C":"法务部、销售部、研发部、生产部、财务部、人事部","D":"研发部、人事部、销售部、法务部、财务部、生产部"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）销售部在财务部和生产部之前；\n（2）人事部紧接在研发部或者生产部的后面；\n（3）紧接在法务部后面的是研发部或者销售部。\n本题题干信息确定，选项信息充分，优先考虑排除法。\n第二步：根据题干条件进行推理。\n根据条件（1）可知销售部在财务部和生产部之前，排除B项；\n根据条件（2）可知人事部紧接在研发部或者生产部的后面，排除C项；\n根据条件（3）可知紧接在法务部后面的是研发部或者销售部，排除D项。\n经验证，A项符合所有条件，当选。\n故正确答案为A。","no":71,"missingImage":false},{"qid":"2448402","cat":"类比推理","stem":"如果研发部在戊字楼，那么下列哪项可能为真？","options":{"A":"法务部在辛字楼","B":"人事部在癸字楼","C":"财务部在己字楼","D":"生产部在庚字楼"},"answer":"B","explanation":"第一步：整理题干条件。\n（1）销售在财务和生产之前；\n（2）人事紧挨研发或生产之后；\n（3）紧挨法务之后的是研发或销售；\n（4）研发在戊字楼；\n第二步：根据题干条件分析选项。\n问的可能为真，可以考虑代入法：列表如下：\n\u003cimg data-k=\"efc080d420ec\" style=\"max-width:644px\">\n当研发部在戊字楼时，结合条件（3）可知，在紧挨着法务部后面的，只能是销售部。\n再结合条件（1）可知，销售部在财务和生产之前。\nA项代入：法务部在辛字楼，如下：\n\u003cimg data-k=\"a7624e5bc14c\" style=\"max-width:644px\">\n此时，销售不可能在财务和生产之前，与条件（1）不符，排除；\nB项代入：人事部在癸字楼， \n此时，根据条件（2），人事部不可能紧挨着研发，只能是紧挨着生产之后；即壬字楼为生产部；结合条件（3），此时紧挨着法务部之后的只能是销售，而销售又在财务和生产之前，即：\n\u003cimg data-k=\"b24ef347adf1\" style=\"max-width:644px\">\n满足题干所有条件，可能为真，当选；\nC项代入：财务在己字楼：如下：\n\u003cimg data-k=\"0f2fa2cfa920\" style=\"max-width:644px\">\n此时，销售不可能在财务和生产之前，与条件（1）不符，排除；\nD项代入：生产部在庚字楼，如下：\n\u003cimg data-k=\"f00dbb9e4b94\" style=\"max-width:644px\">\n结合条件（1），销售只能在己字楼；此时紧挨着法务之后的不可能是研发或者销售，与条件（3）不符，排除；\n故正确答案为B。","no":72,"missingImage":false},{"qid":"2448406","cat":"类比推理","stem":"如果法务部在壬字楼，那么销售部在：","options":{"A":"庚字楼","B":"辛字楼","C":"戊字楼","D":"己字楼"},"answer":"C","explanation":"第一步：整理题干条件。\n（1）销售在财务和生产之前；\n（2）人事紧挨研发或生产之后；\n（3）紧挨法务之后的是研发或销售；\n（4）法务部在壬字楼。\n第二步：根据题干条件分析选项。\n列表如下：\n\u003cimg data-k=\"5792a763fb44\" style=\"max-width:631px\">\n结合条件（3），如果法务部后面紧挨着是销售部，即癸字楼为销售部，此时会发现：销售不可能在财务和生产之前，与条件（1）不符，即：销售部不可能在癸字楼，紧挨着法务部后面是只能是研发部，研发部在癸字楼；\n\u003cimg data-k=\"c2dfb4116a85\" style=\"max-width:630px\">\n此时再结合条件（2）可知，人事部只能紧挨在生产部之后；再根据条件（1）可知，销售部后面有财务部和生产部，以及人事部，那么销售部只能在戊字楼。\n故正确答案为C。","no":73,"missingImage":false},{"qid":"2448409","cat":"逻辑判断","stem":"如果销售部安排在戊字楼，则以下哪项安排是不可能的？","options":{"A":"财务部在癸字楼","B":"研发部在己字楼","C":"法务部在辛字楼","D":"人事部在庚字楼"},"answer":"B","explanation":"第一步：整理题干条件。\n（1）销售在财务和生产之前；\n（2）人事紧挨研发或生产之后；\n（3）紧挨法务之后的是研发或销售；\n（4）销售部在戊字楼。\n第二步：根据题干分析选项。\n列表如下：\n\u003cimg data-k=\"87264fd7ea3e\" style=\"max-width:631px\">\n根据（3）可知，此时紧挨着法务部之后的只能是研发部；此时研发部门不可能在己字楼或者戊字楼。\n本题为选非题，故正确答案为B。","no":74,"missingImage":false},{"qid":"2448413","cat":"类比推理","stem":"下列哪两个部门不可能依次安排在庚字楼和辛字楼？","options":{"A":"法务部、销售部","B":"研发部、财务部","C":"人事部、研发部","D":"财务部、法务部"},"answer":"C","explanation":"第一步：整理题干条件。\n（1）销售在财务和生产之前；\n（2）人事紧挨研发或生产之后；\n（3）紧挨法务之后的是研发或销售。\n第二步：根据题干分析选项。\nA项代入：结合条件（1）壬字楼和癸字楼只能是财务部或者生产部；\n\u003cimg data-k=\"123d43a5f0c4\" style=\"max-width:634px\">\n满足题干所有条件，可能为真，排除；\nB项代入：\n此时，结合条件（1）销售只能在戊字楼或己字楼，结合条件（2）人事只能紧挨着生产；戊字楼和己字楼为法务或者销售即可；\n\u003cimg data-k=\"b13865d64f45\" style=\"max-width:635px\">\n满足题干所有条件，可能为真，排除；\nC项代入：结合条件（2）可知，己字楼只能是生产，此时要想满足（1），戊字楼只能是销售部，会发现，法务部后面不可能紧挨着研发或者销售，与条件（3）不符，不可能为真，当选；\n\u003cimg data-k=\"5df1e5ab6a13\" style=\"max-width:638px\">\nD项代入：结合条件（1）可知，销售部只能在戊字楼或己字楼，再结合条件（3）可知，紧接在法务部后面的只能是研发部，即研发部在壬字楼，则根据条件（2）可知，人事部只能在癸字楼，此时，生产部在己字楼，销售部在戊字楼。\n\u003cimg data-k=\"fb99002ddd24\" style=\"max-width:632px\">\n满足题干所有条件，可能为真，排除；\n本题为选非题，故正确答案为C。","no":75,"missingImage":false},{"qid":"2448480","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"9478848206b6\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"图形元素组成不同，且无明显属性规律，考虑数量规律。观察发现题干图4为明显的一笔画图形，且出现大量端点，考虑笔画数。题干图形均为一笔画，所以？处图形也应该是一笔画图形，图A、B、C、D的奇点数分别为：4、4、2、6，对应笔画数分别是：两笔画、两笔画、一笔画、三笔画，只有C项满足规律。\n故正确答案为C。","no":76,"missingImage":false},{"qid":"2448482","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"64672cee68cd\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"图形1、2、4元素组成相同，考虑位置规律。题干图形明显分成黑色L形和白色L形，整体无规律考虑分开看。观察发现，从图一到图二，黑色L形顺时针旋转\u003cimg data-k=\"c16e5a8b3239\">，白色L形位置不变；从图二到图三，白色L形逆时针旋转\u003cimg data-k=\"c16e5a8b3239\">，黑色L形位置不变，同时有一块黑色小正方形与白色小正方形重叠，呈现黑色；从图三到图四，黑色L形顺时针旋转\u003cimg data-k=\"c16e5a8b3239\">，白色L形位置不变；从图四到图五，白色L形逆时针旋转\u003cimg data-k=\"c16e5a8b3239\">，黑色L形位置不变，同时有一块黑色小正方形与白色小正方形重叠，呈现黑色；根据上述规律，从图五到？处，应该是：黑色L形顺时针旋转\u003cimg data-k=\"c16e5a8b3239\">，白色L形位置不变，对应A项。\n故正确答案为A。","no":77,"missingImage":false},{"qid":"2448487","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"e2594f828f1d\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"图形元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干出现明显的曲线和直线，且线条交叉明显，考虑数曲线与直线的交点数，分别是：4、6、2、4、8，同时，图形的曲线数为：2、3、1、2、4，发现规律为：图形的曲直交点数是曲线数的两倍。所以？处图形也应该符合此规律。选项中，曲直交点数分别为：5、4、1、2，均只有一条曲线，只有D项满足规律，曲直交点数是曲线数的两倍。\n故正确答案为D。\n注：本题由于A项图片不清晰，根据原图的视觉效果A项应为4个曲直交点，但放大后，A项应为5个曲直交点，由于考虑到考场的真实情况，所以视频解析中老师是按照考场思维进行讲解的。","no":78,"missingImage":false},{"qid":"2448488","cat":"图形推理","stem":"下图为给定的多面体及其外表面展开图，问字母A、B、C、D和数字1、2、3、4代表的棱的对应关系为：\n\u003cimg data-k=\"e83bd80cdea5\" style=\"max-width:641px\">","options":{"A":"1-C，2-A，3-B，4-D","B":"1-A，2-C，3-B，4-D","C":"1-A，2-C，3-D，4-B","D":"1-C，2-A，3-D，4-B"},"answer":"A","explanation":"将如下图多面体的面分别标为e、f、g面，对应的展开图也进行标序如下图。\n\u003cimg data-k=\"5ea587b062f8\" style=\"max-width:604px\">\n利用画边法找对应的边，以面e、f的公共边为起点，顺时针画边。立体图中，边的顺序是：公共边\u003cimg data-k=\"7b6029b3bbde\">A\u003cimg data-k=\"7b6029b3bbde\">B\u003cimg data-k=\"7b6029b3bbde\">C，展开图中，边的顺序是：公共边\u003cimg data-k=\"7b6029b3bbde\">2\u003cimg data-k=\"7b6029b3bbde\">3\u003cimg data-k=\"7b6029b3bbde\">1，所以，数字1、2、3对应的边是：C、A、B，边4为D，只有A项符合。\n故正确答案为A。","no":79,"missingImage":false},{"qid":"2448493","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"fc3b21f7faab\" style=\"max-width:588px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题为九宫格题。元素组成相似，优先考虑样式规律。观察可知，题干图形均由黑点和白点构成，考虑黑白运算。根据第一行可知，运算规律为：黑\u003cimg data-k=\"3d6d1f96db11\">黑\u003cimg data-k=\"e6c7a9c8511f\">白；黑\u003cimg data-k=\"3d6d1f96db11\">白\u003cimg data-k=\"e6c7a9c8511f\">黑；白\u003cimg data-k=\"3d6d1f96db11\">黑\u003cimg data-k=\"e6c7a9c8511f\">黑；白\u003cimg data-k=\"3d6d1f96db11\">白\u003cimg data-k=\"e6c7a9c8511f\">黑，第二行验证符合此运算规律。第三行左上角为白\u003cimg data-k=\"3d6d1f96db11\">白\u003cimg data-k=\"e6c7a9c8511f\">黑，排除B、D两项；对比A、C两项右下角颜色不同，应为“黑\u003cimg data-k=\"3d6d1f96db11\">白\u003cimg data-k=\"e6c7a9c8511f\">黑”，据此C项当选。\n故正确答案为C。","no":80,"missingImage":false},{"qid":"2448496","cat":"图形推理","stem":"左图给定的是由相同正方体堆叠而成多面体的正视图和后视图。该多面体可以由①、②和③三个多面体组合而成，问以下哪一项能填入问号处？\n\u003cimg data-k=\"a98c12d19302\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查立体拼合。\n\u003cimg data-k=\"90eb6b5b47a4\" style=\"max-width:698px\">\n观察题干给出的多面体可知，横行和竖列最多均有4个正方体，其中②最下方为4个正方体，①最下方可以拼为4个正方体，则①和②正方体数量最多的行列会放置在主视图的左后方。根据题干后视图可知，第二层最多有3个小立方体，①第二行有3个小立方体，所以①在后视图的最前面，并且②最下面多出来的正方体可以和①最下方缺少的正方体进行拼合，如上图所示。拼合后可知，第二层缺少3个正方体，排除C、D两项。对比A、B两项可知，下层的正方体位置不同，①②拼合后最左侧不缺正方体，据此B项当选。\n故正确答案为B。","no":81,"missingImage":false},{"qid":"2448497","cat":"图形推理","stem":"左图是给定的多面体，将其从任一面剖开，下面哪一项不可能是该多面体的截面？\n\u003cimg data-k=\"09bbd4851a5a\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查截面图，逐一分析选项。\n\u003cimg data-k=\"c6bc50dc7f52\" style=\"max-width:700px\">\nA项：从图形正中间竖直向下切即可得到，排除；\nB项：从正前方切入，向后下方切出，只切图形上方凸出的两部分即可得到，排除；\nC项：从图形下方切入，平行于底面即可以得到，排除；\nD项：无法切出，当选。\n本题为选非题，故正确答案为D。","no":82,"missingImage":false},{"qid":"2448498","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律,分类正确的一项是：\n\u003cimg data-k=\"c6ad1c4e9e85\" style=\"max-width:700px\">","options":{"A":"①③④，②⑤⑥","B":"①②⑥，③④⑤","C":"①④⑤，②③⑥","D":"①④⑥，②③⑤"},"answer":"C","explanation":"本题为分组分类题。元素组成不同，优先考虑属性规律。观察可知，题干图形比较规整，考虑对称性。图①④⑤一组，对称轴穿过图中的两条线，并且这两条线和对称轴垂直；图②③⑥一组，对称轴穿过图中的两个交点，对应C项。\n故正确答案为C。","no":83,"missingImage":false},{"qid":"2448414","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"40d478cbbeb4\" style=\"max-width:413px\">","options":{"A":"①④⑥，②③⑤","B":"①③⑤，②④⑥","C":"①②⑥，③④⑤","D":"①③④，②⑤⑥"},"answer":"A","explanation":"解析一：本题为分组分类题目。每幅图都由几个图形拼接而成，优先考虑图形间关系。图形内部线条比较多，优先考虑线条数量，发现图①④⑥内部公共边都是4根线，图②③⑤内部公共边都是3根线，所以，①④⑥为一组，②③⑤为一组。\n解析二：本题为分组分类题目。图形外部都是多边形，考虑外框图形直线数，图①④⑥外框图形都是7根线，图②③⑤外框图形都是8根线。所以，①④⑥为一组，②③⑤为一组。\n故正确答案为A。","no":84,"missingImage":false},{"qid":"2448431","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，\n分类正确的一项是：\n\u003cimg data-k=\"d0c06d8fcd19\" style=\"max-width:408px\">","options":{"A":"①②③，④⑤⑥","B":"①③④，②⑤⑥","C":"①③⑤，②④⑥","D":"①②⑤，③④⑥"},"answer":"B","explanation":"本题为分组分类题目。观察发现，图形①中黑色图形只有正方形一种，②中黑色图形有梯形和三角形两种，③中黑色图形只有梯形一种，④中黑色图形只有三角形一种，⑤中黑色图形有圆和圆环两种，⑥中黑色图形有长方形和梯形两种，所以，可以根据黑色图形是一种还是两种分为两组，①③④为一组，②⑤⑥为一组。\n故正确答案为B。","no":85,"missingImage":false},{"qid":"2448436","cat":"定义判断","stem":"超前纠结指的是在平庸的人群中，有正确洞见的人当其观点不被接受、不被相信，对事情的发展无能为力时，所表现出的无奈、压抑和痛苦的心情。\n根据上述定义，下列最能体现超前纠结的是：","options":{"A":"古来圣贤皆寂寞，惟有饮者留其名","B":"举世皆浊我独清，世人皆醉我独醒","C":"无可奈何花落去，似曾相识燕归来","D":"醉卧沙场君莫笑，古来征战几人回"},"answer":"B","explanation":"第一步：找出定义关键词。\n“在平庸的人群中”、“正确洞见的人当其观点不被接受、不被相信，对事情的发展无能为力时”、“所表现出的无奈、压抑和痛苦的心情”。\n第二步：逐一分析选项。\nA项：诗句的意思是“自古以来圣贤无不是冷落寂寞的，只有会喝酒的人才能够流传美名。”该诗句说明作者李白只图一醉方休，表达了诗人旷达的胸怀，没有体现出“正确洞见的人当其观点不被接受、不被相信，对事情的发展无能为力”，不符合定义，排除；\nB项：诗句的意思是“世界上的人都是污浊的，唯独我干净、清白；众人都已醉倒，唯独我一人清醒。”该诗句是屈原被排挤，被冠以奸邪的罪名，遭到了放逐后所作，符合“在平庸的人群中”“正确洞见的人当其观点不被接受、不被相信，对事情的发展无能为力时”，也符合“所表现出的无奈、压抑和痛苦的心情”，符合定义，当选；\nC项：诗句的意思是“那花儿落去我也无可奈何，那归来的燕子似曾相识”，该诗句表达了春的消逝，时光的流逝，都是不可抗拒的自然规律，虽然惋惜流连也无济于事，不符合“正确洞见的人当其观点不被接受、不被相信，对事情的发展无能为力时”，不符合定义，排除；\nD项：诗句的意思是“醉就醉吧，醉卧在沙场上有什么呢，请不要见笑，从古至今征战的人有几个是活着回来的。”表达了豪放、开朗、兴奋的感情，还有视死如归的勇气，不符合“所表现出的无奈、压抑和痛苦的心情”，不符合定义，排除。\n故正确答案为B。","no":86,"missingImage":false},{"qid":"2448465","cat":"定义判断","stem":"算术平均数描述了一组数据的平均趋势，是所有数据之和除以数据个数所得之商。在统计学中使用时应注意：出现极端数值、模糊不清的数据或者不同质的数据时，均不能计算算术平均数。\n根据上述定义，下列适于计算算术平均数的是：","options":{"A":"某社区统计该社区居民的平均年龄，其中包括10岁以下儿童204人，90岁以上老人26人","B":"某公司统计35岁以下青年职工的年平均收入，发现基本处于10～12万元之间，其中有一人为公司高管，年收入百万元以上","C":"某学校统计本校青少年平均身高，将该校学前部、小学部和中学部全部学生计算在内","D":"某市统计该市各区县留守儿童的平均数量，其中外出务工人员数量较多的区县无法进行准确统计，只提供了估算数据"},"answer":"A","explanation":"第一步：找出定义关键词。\n“描述了一组数据的平均趋势”、“所有数据之和除以数据个数所得之商”、“出现极端数值、模糊不清的数据或者不同质的数据时，均不能计算算术平均数”。\n第二步：逐一分析选项。\nA项：10岁以下儿童204人，90岁以上老人26人，这些都是该社区居民，所以在统计该社区居民的平均年龄，要统计在内，适用于计算算数平均数，当选；\nB项：某公司统计35岁以下青年职工的年平均收入，一人年收入百万元以上，其他人基本处于10~12万元之间，年收入百万以上的公司高管与年收入10~12万元的普通员工相比，属于“极端数值”，不适于计算算术平均数，排除；\nC项：某学校统计本校青少年平均身高，青少年一般是指自上初中到高中毕业，包括“中学部”，但不包括“学前部、小学部”，所以，“学前部、小学部和中学部”属于“不同质的数据”，不适于计算算术平均数，排除；\nD项：某市统计该市各区县留守儿童的平均数量，其中外出务工人员数量较多的区县无法进行准确统计，只提供了估算数据，估算出的数据属于“模糊不清的数据”，不适于计算算术平均数，排除。\n故正确答案为A。","no":87,"missingImage":false},{"qid":"2448477","cat":"定义判断","stem":"动物辅助治疗是一种以动物为媒介，通过人与动物的接触，改善或维持残障人士的身体状况，或帮助他们加强与外部世界的互动，进而促进康复、适应社会的过程。\n根据上述定义，下列情形不属于动物辅助治疗的是：","options":{"A":"性情温和的迷你猪适合陪伴自闭症患者，减轻他们面对人群时产生的焦虑","B":"卷尾猴能够帮助体障者完成日常生活中的简单动作，如开关门、操控遥控器等","C":"鼬獾会在主人精神病发作之际，发出叫声，警示主人，让主人可以及时服药","D":"英国短毛猫性格温顺且不具有攻击性，喜静且贴近主人，适合陪伴独自生活的老年人"},"answer":"D","explanation":"第一步：找出定义关键词。\n“以动物为媒介”、“通过人与动物的接触，改善或维持残障人士的身体状况，或帮助他们加强与外部世界的互动”。\n第二步：逐一分析选项。\nA项：迷你猪陪伴自闭症患者，符合“以动物为媒介”，减轻自闭症患者面对人群时产生的焦虑，符合“通过人与动物的接触，帮助他们加强与外部世界的互动”，符合定义，排除；\nB项：卷尾猴帮助体障者完成简单动作，符合“以动物为媒介”，体障者能够开关门、操控遥控器，符合“通过人与动物的接触，改善或维持残障人士的身体状况”，符合定义，排除；\nC项：鼬獾能够警示精神病人及时吃药，符合“以动物为媒介”，在主人发病时发出叫声，警示主人，符合“通过人与动物的接触，改善或维持残障人士的身体状况”，符合定义，排除；\nD项：独自生活的老年人不是残障人士，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":88,"missingImage":false},{"qid":"2448483","cat":"定义判断","stem":"合理使用是指在法律明文规定的情形下，非商业性使用他人已经发表的作品，可以不经著作权人许可，也不必向其支付报酬。“法律明文规定的情形”主要包括：（1）为个人学习、研究或者欣赏，使用他人已经发表的作品；（2）免费表演已经发表的作品；（3）对设置或者陈列在室外公共场所的艺术作品进行临摹、绘画、摄影、录像；（4）将已经发表的以汉语言文字创作的作品翻译成少数民族语言文字作品出版发行。\n根据上述规定，下列属于合理使用的是：","options":{"A":"甲在班级聚会上演唱了戊未发表的一首歌曲","B":"乙将一部英文作品翻译成蒙文作品出版发行","C":"丙公司拍摄公共广场的雕塑作品后，将其制作成图片发行","D":"丁为撰写论文，复印了庚发表在某期刊上的论文作参考"},"answer":"D","explanation":"第一步：找出定义关键词。\n“在法律明文规定的情形下”、“非商业性使用他人已经发表的作品”、“为个人学习、研究或者欣赏，使用他人已经发表的作品”、“免费表演已经发表的作品”、“对设置或者陈列在室外公共场所的艺术作品进行临摹、绘画、摄影、录像”、“将已经发表的以汉语言文字创作的作品翻译成少数民族语言文字作品出版发行”。\n第二步：逐一分析选项。\nA项：甲唱了一首戊尚未发表的歌曲，不符合“非商业性使用他人已经发表的作品”和“免费表演已经发表的作品”，不符合定义，排除； \nB项：乙将英文作品翻译成蒙文作品，这里的英文作品不符合“将已经发表的以汉语言文字创作的作品翻译成少数民族语言文字作品出版发行”，不符合定义，排除；\nC项：丙公司拍摄雕塑作品后进行发行，属于商业用途，不符合“非商业性使用他人已经发表的作品”，不符合定义，排除；\nD项：丁为了撰写论文复印和参考了庚已经发表的论文，参考论文符合“在法律明文规定的情形下”和“为个人学习、研究或者欣赏，使用他人已经发表的作品”，同时，丁没有用作商业用途，符合“非商业性使用他人已经发表的作品”，符合定义，当选。\n故正确答案为D。","no":89,"missingImage":false},{"qid":"2448491","cat":"定义判断","stem":"花序是指花在花轴上不同形式的序列。其中，伞房花序的特点是花序轴下部的花梗较长，上部的花梗依次渐短，整个花序的花几乎排列在一个平面上；伞形花序的特点是在总花梗顶端集生许多花梗近等长的小花，放射状排列如伞。\n根据上述定义，下列属于伞房花序的是：\n\u003cimg data-k=\"b36990889995\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"第一步：找出定义关键词。\n伞房花序：“花序轴下部的花梗较长，上部的花梗依次渐短”、“整个花序的花几乎排列在一个平面上”。\n伞形花序：“在总花梗顶端集生许多花梗近等长的小花”、“放射状排列如伞”。\n第二步：逐一分析选项。\nA项：图中的花梗等长，不符合“花序轴下部的花梗较长，上部的花梗依次渐短”，花序排列形状也不符合“整个花序的花几乎排列在一个平面上”，不符合“伞房花序”定义，排除； \nB项：图中的花梗几乎等长，符合“在总花梗顶端集生许多花梗近等长的小花”，花序排列形状也符合“放射状排列如伞”，符合“伞形花序”定义，不符合“伞房花序”定义，排除；\nC项：图中下部花梗长，上部花梗短，符合“花序轴下部的花梗较长，上部的花梗依次渐短”，并且花序形状也符合“整个花序的花几乎排列在一个平面上”，符合“伞房花序”定义，当选；\nD项：图中的花梗等长，不符合“花序轴下部的花梗较长，上部的花梗依次渐短”，花序排列形状也不符合“整个花序的花几乎排列在一个平面上”，不符合“伞房花序”定义，排除。\n故正确答案为C。","no":90,"missingImage":false},{"qid":"2448492","cat":"定义判断","stem":"编剧式观影者是指看影视剧不介意被剧透，甚至会提前查询剧情介绍、翻遍各种影评的人。这种观影者追求掌控剧情发展的感觉，不喜欢出乎意料。\n根据上述定义，下列属于编剧式观影者的是：","options":{"A":"小王看了一部好的影片后，觉得应该和女朋友一起分享，于是邀请女朋友到电影院观影，还向她介绍了电影的主要内容","B":"小杜对任何事情都讲求理性思维，对于电影，他只有在了解了权威评价、剧情内容、画面特征等情况后，才有观赏的冲动","C":"小李酷爱悬疑类影片，他喜欢陶醉在烧脑的剧情中，心情随着剧情而起伏，他经常假想自己就是一名侦探，对他人总是投出审视的目光","D":"张大爷的老伴退休后整天在家看电视剧，对很多电视剧的剧情都了如指掌，还经常将剧情讲述给张大爷"},"answer":"B","explanation":"第一步：找出定义关键词。\n“看影视剧不介意被剧透”、“会提前查询剧情介绍、翻遍各种影评的人”。\n第二步：逐一分析选项。\nA项：小王向女朋友介绍电影剧情，但没有说女朋友是否介意被剧透，不符合“看影视剧不介意被剧透”，不符合定义，排除； \nB项：小杜对于电影在了解权威评价、剧情内容、画面特征等情况后，才有观赏的冲动，符合“会提前查询剧情介绍、翻遍各种影评的人”，符合定义，当选；\nC项：小李喜欢陶醉在烧脑的剧情中，但没有涉及喜欢提前知道剧情，不符合“会提前查询剧情介绍、翻遍各种影评的人”，不符合定义，排除；\nD项：张大爷的老伴喜欢将电视剧剧情讲述给张大爷，但没有说张大爷是否介意被剧透，不符合“看影视剧不介意被剧透”，不符合定义，排除。\n故正确答案为B。","no":91,"missingImage":false},{"qid":"2448381","cat":"定义判断","stem":"愧疚补偿策略指的是不直接提出要求，而强调由于对方的责任导致自己处于困境，使对方产生愧疚心理，从而使对方补偿自己的一种策略。\n根据上述定义，下列反映了愧疚补偿策略的是：","options":{"A":"甲向李某倾诉由于误信了他群发的信息，导致自己被骗得很惨，李某于是免息借钱给甲做生意以求得心安","B":"乙上班迟到被领导批评，回家后责怪妻子没有及时叫醒他，并要求妻子以后负责夜里带孩子，妻子答应了他","C":"丙开车邀请陈某一起郊游，途中丙不慎扭伤了脚，只得请假休养，陈某感到非常内疚，决定帮助丙接送孩子上下学","D":"丁在庄某家做保洁时不慎摔伤，庄某听家政公司说丁家庭非常困难，主动替丁支付了5000元的治疗费用"},"answer":"A","explanation":"第一步：找出定义关键词。\n“不直接提出要求”、“强调由于对方的责任导致自己处于困境”、“使对方产生愧疚心理，从而使对方补偿自己”。\n第二步：逐一分析选项。\nA项：甲向李某倾诉由于李某的原因他被骗的很惨，符合“强调由于对方的责任导致自己处于困境”， 李某于是免息借钱给甲做生意以求得心安，符合“使对方产生愧疚心理，从而使对方补偿自己”，符合定义，当选；\nB项：乙要求妻子以后负责夜里带孩子，不符合“不直接提出要求”，不符合定义，排除；\nC项：丙请假休养，未提及是由于陈某的责任而导致自己受伤，不符合“强调由于对方的责任导致自己处于困境”，不符合定义，排除；\nD项：庄某听家政公司说丁家庭非常困难，并不是丁某自己强调家庭困难，不符合“强调由于对方的责任导致自己处于困境”，不符合定义，排除；\n故正确答案为A。","no":92,"missingImage":false},{"qid":"2448382","cat":"定义判断","stem":"客观-价值谬误是一种错误的推理，其前提是一个事实性的描述，而结论所表述的则是一个涉及价值意义的描述，而且这种推理没有预设明显的价值判断前提。\n根据上述定义，下列属于客观-价值谬误的是：","options":{"A":"人与人之间应该进行更多地交流和沟通，更多地理解和包容，世界上的民族国家将越来越少","B":"既然人人都要遵纪守法，那我们就应该对法律多一份尊重，对规则多一份敬畏","C":"世界变得越来越城市化，因此人们就不应该继续诗意地栖居在农村","D":"这个地区的绿化率在不断提高，其空气质量也将不断改善"},"answer":"C","explanation":"第一步：找出定义关键词。\n“前提是一个事实性的描述”、“结论所表述的则是一个涉及价值意义的描述”。\n第二步：逐一分析选项。\nA项：人与人之间应该进行更多地交流和沟通，更多地理解和包容，属于涉及价值意义的描述，世界上的民族国家将越来越少，属于陈述的事实，不符合“前提是一个事实性的描述”、“结论所表述的则是一个涉及价值意义的描述”，不符合定义，排除；\nB项：既然人人都要遵纪守法，属于涉及价值意义的描述，那我们就应该对法律多一份尊重，对规则多一份敬畏，也属于涉及价值意义的描述，不符合“前提是一个事实性的描述”，不符合定义，排除；\nC项：世界变得越来越城市化，符合“前提是一个事实性的描述”，因此人们就不应该继续诗意地栖居在农村，符合“结论所表述的则是一个涉及价值意义的描述”，符合定义，当选；\nD项：这个地区的绿化率在不断提高，属于陈述的事实，其空气质量也将不断改善，也属于陈述的事实，不符合“结论所表述的则是一个涉及价值意义的描述”，不符合定义，排除。\n故正确答案为C。","no":93,"missingImage":false},{"qid":"2448383","cat":"定义判断","stem":"社交裂变是一种利益驱动的商业模式，通过人与人之间的社交促进产品的传播与销售，本质上是通过利益驱动激励客户从而形成裂变。\n根据上述定义，下列不属于社交裂变的是：","options":{"A":"某微商客户挑选好某个商品后，分享在自己的社交圈，好友帮助砍价后，客户可以低价购买，同时也宣传了该商品","B":"某微信用户在购买到自己喜欢的商品后，经常拍照发在朋友圈中，慢慢地大家都知道她喜欢购买高档奢侈品","C":"某电商平台的客户成功购买商品后，分享其链接，所有点击的人都能获得商家提供的随机金额的优惠券","D":"某咖啡店的老顾客参加“邀请好友免费喝咖啡”的活动后，可以获取一张套餐券"},"answer":"B","explanation":"第一步：找出定义关键词。\n“通过人与人之间的社交促进产品的传播与销售”、“通过利益驱动激励客户从而形成裂变”。\n第二步：逐一分析选项。\nA项：微商客户通过在自己的社交圈中分享商品促进了产品的传播和销售，符合关键词“通过人与人之间的社交促进产品的传播与销售”，微商客户通过在朋友圈分享获得了好友的砍价，继而可以通过较低的价格购买到产品，符合关键词“通过利益驱动激励客户从而形成裂变”，符合定义，排除；\nB项：微信用户在购买到自己喜欢的商品后，通过拍照在朋友圈中分享，继而起到产品宣传的效果，符合关键词“通过人与人之间的社交促进产品的传播与销售”，但选项中未体现出商家对微信用户的激励，不符合关键词“通过利益驱动激励客户从而形成裂变”，不符合定义，当选；\nC项：电商平台通过让购买成功的客户分享其链接来宣传自己，符合关键词“通过人与人之间的社交促进产品的传播与销售”，所有点击的人都能获得商家提供的随机金额的优惠券，符合定义关键词“通过利益驱动激励客户从而形成裂变”，符合定义，排除；\nD项：咖啡店通过让老顾客邀请好友免费喝咖啡来促进产品的传播和销售，符合关键词“通过人与人之间的社交促进产品的传播与销售”，老顾客通过参加“邀请好友免费喝咖啡”活动可以获取一张套餐券，符合定义关键词“通过利益驱动激励客户从而形成裂变”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":94,"missingImage":false},{"qid":"2448384","cat":"定义判断","stem":"培养基是指供给微生物、植物或动物（或组织）生长繁殖的，由不同营养物质组合配制而成的营养基质，一般都含有碳水化合物、含氮物质、无机盐、维生素、水等物质。天然培养基是利用动物、植物或微生物包括其提取物制成的培养基；合成培养基是根据天然培养基的成分，用化学物质模拟合成、人工设计而配制的培养基；半组合培养基是以化学试剂配制为主，同时还加有少量天然成分的培养基。\n根据上述定义，下列属于半组合培养基的是：","options":{"A":"为研究鸡胚细胞的生长，在一定比例的盐水氨基酸溶液中加入少量玉米汁制成的培养基","B":"为促进乳酸菌生长，使用小麦的麦芽汁制成的培养基","C":"为加速诱发绿萝生长，将有机成分、矿物元素、琼脂等按3:1:2的比例制成的培养基","D":"为观察产气荚膜梭菌的生成，在1000毫升新鲜牛奶中加入10毫升硫酸亚铁制成的培养基"},"answer":"A","explanation":"第一步：找出定义关键词。\n培养基：“供给微生物、植物或动物（或组织）生长繁殖的，由不同营养物质组合配制而成的营养基质，一般都含有碳水化合物、含氮物质、无机盐、维生素、水等物质”。\n天然培养基：“利用动物、植物或微生物包括其提取物制成”。\n合成培养基：“根据天然培养基的成分，用化学物质模拟合成、人工设计而配制的培养基”。\n半组合培养基：“以化学试剂配制为主，同时还加有少量天然成分的培养基”。\n第二步：逐一分析选项。\nA项：“在一定比例的盐水氨基酸溶液中加入少量玉米汁制成的培养基”说明该培养基是以盐水氨基酸溶液为主，以少量玉米汁为辅，且盐水氨基酸溶液是一种化学试剂，玉米汁是从玉米中提取而来，为天然成分，符合关键词“以化学试剂配制为主，同时还加有少量天然成分的培养基”，符合定义，当选；\nB项：麦芽汁是从麦芽中提取而来，是天然成分，但选项中并未提及“化学试剂”，不符合关键词“以化学试剂配制为主，同时还加有少量天然成分的培养基”，不符合定义，排除；\nC项：“有机成分、矿物元素、琼脂等按3：1：2的比例制成”，说明该培养基中有机成分占比最高，但有机成分也分为天然有机和合成有机，不确定此处的有机成分是否是化学试剂配制，不符合关键词“以化学试剂配制为主，同时还加有少量天然成分的培养基”，不符合定义，排除； \nD项：“在1000毫升新鲜牛奶中加入10毫升硫酸亚铁制成的培养基”说明该培养基是以新鲜牛奶为主，以硫酸亚铁为辅，而新鲜牛奶是天然成分，硫酸亚铁为化学试剂调配而成，不符合关键词“以化学试剂配制为主，同时还加有少量天然成分的培养基”，不符合定义，排除。\n故正确答案为A。","no":95,"missingImage":false},{"qid":"2448385","cat":"类比推理","stem":"物体：惯性","options":{"A":"气体：稳定性","B":"观察：客观性","C":"贵金属：磁性","D":"液体：流动性"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n惯性是物体的固有属性，一切物体都具有惯性，二者为属性对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：稳定性并非气体的固有属性，如臭氧就是一种具有刺激性特殊气味的不稳定气体，与题干逻辑关系不一致，排除；\nB项：客观性并非观察的固有属性，与题干逻辑关系不一致，排除；\nC项：磁性并非贵金属的固有属性，如金是贵金属，但其并没有磁性，与题干逻辑关系不一致，排除；\nD项：流动性是液体的固有属性，一切液体都具有流动性，二者为属性对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":96,"missingImage":false},{"qid":"2448386","cat":"类比推理","stem":"全身麻醉：注射麻醉","options":{"A":"网络存储：单机存储","B":"胸式呼吸：腹式呼吸","C":"物理消毒：加热消毒","D":"抽样调查：问卷调查"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n全身麻醉，是指麻醉药经呼吸道吸入、静脉或肌肉注射进入体内，产生中枢神经系统的抑制，临床表现为神志消失、全身疼觉丧失、遗忘、反射抑制和骨骼肌松弛。注射麻醉，是指通过静脉注射或者肌肉注射来进行的麻醉。有的全身麻醉是注射麻醉，有的注射麻醉是全身麻醉，二者是交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：网络存储和单机存储是两种不同的储存方式，为并列关系，与题干逻辑关系不一致，排除；\nB项：胸式呼吸，主要是靠肋骨的侧向扩张来吸气，利用肋间外肌上举肋骨以扩大胸廓，该种呼吸方式主要依靠胸部的扩张和收缩，横隔膜运动较小，呼吸主要集中在肺的上中部进行。腹式呼吸，主要是让横隔膜上下移动，吸气时横隔膜下降将脏器挤到下方，吐气时横隔膜比平常上升，可以进行深度呼吸，吐出较多停滞在肺底部的二氧化碳。二者是不同的呼吸方式，为并列关系，与题干逻辑关系不一致，排除；\nC项：物理消毒，是指利用物理因素杀灭或消除病原微生物及其他有害微生物的方法。主要包括自然净化、机械除菌、热力消毒灭菌、电离辐射消毒、微波消毒、超声波杀毒、等离子体灭菌、过滤除菌等。加热消毒属于物理消毒的一种，二者是包容关系中的种属关系，与题干逻辑关系不一致，排除；\nD项：抽样调查，是一种非全面调查，它是从全部调查研究对象中，抽选一部分单位进行调查，并据以对全部调查研究对象做出估计和推断的一种调查方法。问卷调查，是指通过制定详细周密的问卷，要求被调查者据此进行回答以收集资料的方法。有的抽样调查是问卷调查，有的问卷调查是抽样调查，二者是交叉关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":97,"missingImage":false},{"qid":"2448388","cat":"类比推理","stem":"物必先腐：而后虫生","options":{"A":"古木无人径：深山何处钟","B":"水落鱼梁浅：天寒梦泽深","C":"少壮不努力：老大徒伤悲","D":"欲投人处宿：隔水问樵夫"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n物必先腐，而后虫生，指的是因为东西自身先腐烂，所以虫子才可以寄生，二者为因果的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：古木无人径，深山何处钟，指的是古木参天却没有人行路径，深山里何处传来古寺鸣钟？二者不是因果的对应关系，与题干逻辑关系不一致，排除；\nB项：水落鱼梁浅，天寒梦泽深，指的是鱼梁洲因水落而露出江面，云梦泽由天寒而迷蒙幽深。二者为并列关系，与题干逻辑关系不一致，排除；\nC项：少壮不努力，老大徒伤悲，指的是因为年轻力壮的时候不奋发图强，所以老年时只会留下悲伤、后悔。二者为因果的对应关系，与题干逻辑关系一致，当选；\nD项：欲投人处宿，隔水问樵夫，指的是想在山中找个人家去投宿，隔水询问那樵夫可否方便？二者不是因果的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":98,"missingImage":false},{"qid":"2448390","cat":"类比推理","stem":"轻车熟路：人生地疏","options":{"A":"廉洁奉公：卑躬屈膝","B":"任重道远：无所事事","C":"前仆后继：贪生怕死","D":"河清海晏：国泰民安"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n轻车熟路指车子轻便，道路熟悉，比喻任务不重，又有经验，做起来容易；人生地疏指人事不熟，地方陌生，二者为反义关系；且“轻车”和“熟路”是并列关系，“人生”和“地疏”是并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：廉洁奉公指的是不贪污腐化，一心为公；卑躬屈膝指的是形容低声下气，奉承讨好的样子，二者没有必然联系，与题干逻辑关系不一致，排除；\nB项：任重道远指的是担子很重，路程遥远，比喻责任重大，需要经过长期的艰苦奋斗；无所事事指的是什么事都不干，二者为反义关系，但“无所”和“事事”不是并列关系，与题干逻辑关系不一致，排除；\nC项：前仆后继指的是前边的倒下了，后边的紧跟上来，形容不怕牺牲，英勇奋战；贪生怕死指的是贪恋生存，畏惧死亡，指对敌作战畏缩不前，二者为反义关系；且“前仆”和“后继”是并列关系，“贪生”和“怕死”是并列关系，与题干逻辑关系一致，当选；\nD项：河清海晏指的是黄河的水澄清，大海风平浪静，用以比喻天下太平；国泰民安指的是国家太平，人民安乐，二者为近义关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":99,"missingImage":false},{"qid":"2448423","cat":"类比推理","stem":"路由器：连接：网络","options":{"A":"千斤顶：修补：轮胎","B":"石英钟：显示：时间","C":"万花筒：观察：花卉","D":"烽火台：侦察：敌情"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n路由器有连接网络的功能，前后为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：千斤顶的功能是更换轮胎时顶起车身，不是修补轮胎，与题干逻辑关系不一致，排除；\nB项：石英钟的功能是显示时间，与题干逻辑关系一致，当选；\nC项：万花筒是一种光学玩具，由孔中看去即可观测到对称的美丽图像，故无法通过万花筒观察花卉，与题干逻辑关系不一致，排除；\nD项：烽火台是古时用于点燃烟火传递重要消息的高台，人们通过烽火台传递敌情，而不是侦察敌情，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":100,"missingImage":false},{"qid":"2448433","cat":"类比推理","stem":"建筑材料：混凝土：水泥","options":{"A":"饮料：汽水：二氧化碳","B":"医疗用具：注射器：药物","C":"监控：监视器：画面","D":"交通设施：减速带：警示牌"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n混凝土是建筑材料的一种，二者为种属关系，水泥是混凝土的原材料，二者为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：汽水是饮料的一种，二者为种属关系，二氧化碳是汽水的原材料，二者为对应关系，与题干逻辑关系一致，当选；\nB项：注射器是医疗工具的一种，二者为种属关系，但药物不是注射器的原材料，应为用注射器注射药物，与题干逻辑关系不一致，排除；\nC项：监视器与监控是功能的对应关系，且监视器中可以显示画面，与题干逻辑关系不一致，排除；\nD项：减速带是交通设施的一种，二者为种属关系，警示牌与减速带没有明显的逻辑关系，警示牌和交通设施是交叉关系，有的警示牌是交通设施（如铁路道口交通警示牌等），有的警示牌不是交通设施（如高压警示牌、高空作业警示牌等），与题干逻辑关系不一致，排除。\n故正确答案为A。","no":101,"missingImage":false},{"qid":"2448438","cat":"类比推理","stem":"本能行为：学习行为：乌贼喷墨","options":{"A":"合法行为：合理行为：盗窃财物","B":"物理变化：化学变化：树木折断","C":"生产管理：销售管理：退货处理","D":"社会现象：自然现象：四季变换"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n本能行为和学习行为是并列关系中的矛盾关系，乌贼喷墨是一种本能行为。\n第二步：判断选项词语间逻辑关系。\nA项：有的合法行为是合理行为，有的合理行为是合法行为，合法行为和合理行为为交叉关系；盗窃财物是非法行为和不合理行为，与题干逻辑关系不一致，排除；\nB项：物理变化和化学变化是并列关系中的矛盾关系；树木折断没有新物质产生，是物理变化，与题干逻辑关系一致，当选；\nC项：生产管理和销售管理是并列关系中的反对关系；退货处理属于销售管理的一部分，两者是组成关系，与题干逻辑关系不一致，排除；\nD项：社会现象和自然现象是并列关系的矛盾关系，四季变换是一种自然现象，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":102,"missingImage":false},{"qid":"2448442","cat":"类比推理","stem":"税前收入：税后收入：税金","options":{"A":"法律规定：道德规范：规则","B":"测量高度：真实高度：误差","C":"高原地区：平原地区：纬度","D":"生产成本：出厂价格：销售价"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n税前收入和税后收入是并列关系，税前收入减去税金等于税后收入。\n第二步：判断选项词语间逻辑关系。\nA项：法律规定和道德规范是并列关系，法律规定和道德规范依据的是不同的规则规范大家的行为，与题干逻辑关系不一致，排除；\nB项：测量高度和真实高度是并列关系，测量高度减去误差等于真实高度，与题干逻辑关系一致，当选；\nC项：高原地区和平原地区是并列关系，但高原地区和平原地区是根据不同的海拔进行区分的，与纬度无关，与题干逻辑关系不一致，排除；\nD项：生产成本、出厂价格、销售价是并列关系，销售价减去出厂价格是销售商的利润，出厂价格减去生产成本是生产商的利润，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":103,"missingImage":false},{"qid":"2448454","cat":"类比推理","stem":"薄荷 对于（  ）相当于（  ）对于 计时器","options":{"A":"川芎；水钟","B":"清凉；精准","C":"茯苓；倒计时","D":"药用植物；沙漏"},"answer":"D","explanation":"逐一代入选项。\nA项：薄荷和川芎都是中药材，两者是并列关系；水钟是一种计时器，两者是种属关系，前后逻辑关系不一致，排除；\nB项：薄荷有清凉的作用，两者是功能的对应关系；计时器具有精准的属性，两者是属性的对应关系，前后逻辑关系不一致，排除；\nC项：薄荷和茯苓都是中药材，两者是并列关系；计时器可以有倒计时的功能，两者是对应关系，前后逻辑关系不一致，排除；\nD项：薄荷是一种药用植物，两者是种属关系；沙漏是一种计时器，两者是种属关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":104,"missingImage":false},{"qid":"2448457","cat":"类比推理","stem":"玻璃瓶 对于（  ）相当于（  ）对于 秋播作物","options":{"A":"石英砂；农作物","B":"塑料瓶；水生植物","C":"饮料瓶；春播作物","D":"广口瓶；大棚作物"},"answer":"D","explanation":"逐一代入选项。\nA项：石英砂是制作玻璃瓶的原材料，两者是对应关系；秋播作物是农作物的一种，两者是种属关系，前后逻辑关系不一致，排除；\nB项：玻璃瓶和塑料瓶是并列关系；水生植物和秋播作物是交叉关系，前后逻辑关系不一致，排除；\nC项：玻璃瓶和饮料瓶是交叉关系；春播作物和秋播作物是并列关系，前后逻辑关系不一致，排除；\nD项：玻璃瓶和广口瓶是交叉关系；大棚作物和秋播作物是交叉关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":105,"missingImage":false},{"qid":"2448470","cat":"逻辑判断","stem":"随着气温上升，热带雨林遭受闪电雷击并引发大火的几率也会上升。然而，目前的监测表明，美洲热带雨林虽然更频繁地受到闪电雷击，却没有引发更多的森林大火。研究者认为这可能与近年来雨林中藤蔓植物大量增加有关。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"闪电雷击常常引起温带森林大火，但热带雨林因为湿度较大，并不会产生较大火灾","B":"1968年热带雨林中藤蔓植物的覆盖率是32%，当前其覆盖率已经高达60%，有的地区甚至超过75%","C":"藤蔓茎干相对树枝电阻更小，能像建筑上的避雷针那样传导闪电，让大部分电流从自己的茎干传导","D":"雷击这样大规模、速度极快的放电，先摧毁了外部的藤蔓植物，中间的树木得到了保护"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：美洲热带雨林虽然更频繁地受到闪电雷击，却没有引发更多的森林大火，可能与近年来雨林中藤蔓植物大量增加有关。\n论据：无。\n前文是背景介绍，本题只有论点没有论据，优先考虑解释原因和举例，即证明没有引起森林大火与藤蔓植物增加之间有关系。\n第二步:逐一分析选项。\nA项：热带雨林湿度大，不会产生火灾，论点是讨论未引起火灾与藤蔓之间的关系，无法支持，排除；\nB项：藤蔓植物覆盖率越来越大，未直接明确说明藤蔓覆盖率与没有引起森林火灾的必然关系，不明确选项，无法支持，排除；\nC项：藤蔓茎干电阻比树枝更小，可以像避雷针一样传导闪电，把藤蔓茎干比作避雷针，明确解释了电流从自己的茎干传导，避免了火灾，解释原因，可以支持，当选；\nD项：雷击很大，先摧毁外部的藤蔓，保护了内部的树枝，摧毁了外部的藤蔓说明遭受了雷击，但并不明确是否避免了火灾，属于不明确选项，无法支持，排除。\n故正确答案为C。","no":106,"missingImage":false},{"qid":"2448473","cat":"逻辑判断","stem":"一切生命有机体都需要新陈代谢，否则生命就会停止。文明也是一样，如果长期自我封闭，必将走向衰落。交流互鉴是文明发展的本质要求。只有同其他文明交流互鉴、取长补短，才能保持旺盛生命活力。\n由此可以推出：","options":{"A":"一种文明如果没有同其他文明交流互鉴，就不能保持旺盛生命活力","B":"一种文明如果没有长期自我封闭，就不会走向衰落","C":"一种文明如果同其他文明交流互鉴、取长补短，就能保持旺盛生命活力","D":"一种文明如果没有保持旺盛生命活力，它就没有同其他文明取长补短"},"answer":"A","explanation":"第一步：翻译题干。\n①—生命停止\u003cimg data-k=\"2dfb7d1f72f3\">新陈代谢；\n②自我封闭\u003cimg data-k=\"2dfb7d1f72f3\">衰落；\n③旺盛生命活力\u003cimg data-k=\"2dfb7d1f72f3\">交流互鉴 且 取长补短。\n第二步：逐一分析选项。\nA项：翻译为“—交流互鉴\u003cimg data-k=\"2dfb7d1f72f3\">—旺盛生命活力”，③后件是且关系，否定其中一项则否定全部，该选项是否后推否前，可以推出，当选；\nB项：翻译为“—自我封闭\u003cimg data-k=\"2dfb7d1f72f3\">—衰落”，是对②的否前，否前推不出确定性结论，排除；\nC项：翻译为“交流互鉴 且 取长补短\u003cimg data-k=\"2dfb7d1f72f3\">旺盛生命活力”，是对③的肯后，肯后推不出确定性结论，排除；\nD项：翻译为“—旺盛生命活力\u003cimg data-k=\"2dfb7d1f72f3\">—取长补短”，是对③的否前，否前推不出确定性结论，排除。\n故正确答案为A。","no":107,"missingImage":false},{"qid":"2448391","cat":"逻辑判断","stem":"澳大利亚箱形水母是世界上毒性最强的动物之一，蜇人后其毒素会使人皮肤坏死并伴随剧痛，还会侵入人的心脏，使人在短时间内因心脏停搏而死亡。一只箱形水母体内携带的毒液足以致60人死亡，目前还没有针对其毒液的特效药物。近日，研究人员通过全基因组筛查的方法发现，人体细胞内一种名为ATP2B1的蛋白质是箱形水母毒液发挥毒性的必要条件，研究人员据此认为，通过靶向治疗方法降低胆固醇可以对抗箱形水母的毒液。\n以下哪项可以作为上述论证的前提？","options":{"A":"靶向治疗方法是一种安全可靠的方法","B":"ATP2B1蛋白质发挥作用需要胆固醇","C":"降低胆固醇后不会对人体产生副作用","D":"已研制出降低胆固醇的靶向治疗药物"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：通过靶向治疗方法降低胆固醇可以对抗箱形水母的毒液。\n论据：名为ATP2B1的蛋白质是箱形水母毒液发挥毒性的必要条件。\n本题论点讨论的是靶向疗法降低胆固醇可以对抗毒液，论据讨论的是毒液发挥作用需要人体内的蛋白质ATP2B1，论点和论据话题不一致，优先考虑搭桥，在“胆固醇”与该“蛋白质”之间建立联系即可。\n第二步：逐一分析选项。\nA项：就算靶向治疗方法不是安全的方法，也不影响论点讨论的靶向治疗方法对抗毒液是否有效，不是上述论证的前提，排除；\nB项：ATP2B1蛋白质发挥作用需要胆固醇，通过靶向疗法可以降低胆固醇，从而防止毒液发挥毒性，在“胆固醇”与该“蛋白质”之间建立了联系，搭桥项，当选；\nC项：降低胆固醇是否有副作用与题干讨论的能否对抗毒液无关，不是上述论证的前提，排除；\nD项：已研制出靶向治疗药物，与题干讨论的靶向疗法是否有用无关，不是上述论证的前提，排除。\n故正确答案为B。","no":108,"missingImage":false},{"qid":"2448393","cat":"逻辑判断","stem":"2014年以来，某州已发生了超过230次3级及以上地震，而2008年之前这一数字是年均1次。频繁的地震活动引发了人们的疑问，一些研究者发现2014年以来，全州为了避免石油开采中钻井和水力压裂过程中产生的有毒废水污染地表水，开始将这些废水注入地下岩石的不透水层之间，这一行为很可能就是引发地震的关键原因。\n以下哪项如果为真，最能支持上述推测？","options":{"A":"废水灌入岩石水层中会降低断层之间的摩擦力，使之更易滑动，从而诱发地震","B":"该州自2008年以来勘探出更多的石油储备，石油开采活动大幅增加","C":"该州2008年之前的地震次数少但震级大，2014年以来地震次数多但震级小","D":"大多数连续地震是一次强震后发生的一系列余震，但该州地震并不属于这种情况"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：将石油开采中的有毒废水注入地下岩石的不透水层之间，这一行为很可能就是引发地震的关键原因。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据，即解释为什么将这些废水注入地下岩石的不透水层之间会引发地震，或举例证明将这些废水注入地下岩石的不透水层之间会引发地震。\n第二步：逐一分析选项。\nA项：指出废水灌入岩石水层中会降低断层之间的摩擦力从而诱发地震，解释为什么将这些废水注入地下岩石的不透水层之间会引发地震，补充论据，当选；\nB项：指出该州自2008年以来石油开采活动大幅增加，石油开采活动增加只能证明开采排放的有毒废水增多，但不能证明是这些废水注入地下造成了该州2014年以来地震多发，无法加强，排除；\nC项：指出该州2008年之前的地震与2014年的地震在数量以及震级上的差别，而论点说的是造成该州2014年以来地震多发的原因，话题不一致，无法加强，排除；\nD项：指出该州地震不是一次强震后发生的一系列余震，而论点说的是造成该州地震多发的原因，话题不一致，无法加强，排除。\n故正确答案为A。","no":109,"missingImage":false},{"qid":"2448395","cat":"逻辑判断","stem":"一般来说，动物的蛋会通过土壤中微生物和堆肥分解有机物时产生的热量来孵化，但这些微生物（包含细菌）也会穿透蛋壳、感染胚胎，自然情况下这一比例高于\u003cimg data-k=\"798f1f286d1f\">。然而，在澳洲有一种名为丛冢雉的鸟类，其蛋发生感染的几率仅为\u003cimg data-k=\"d70907a2658d\">，研究者发现其蛋壳中含有溶酶酵素，研究者据此认为这种物质很可能就是抵御细菌侵扰的关键因素。\n以下哪项如果为真，没有削弱上述结论？","options":{"A":"丛冢雉的蛋壳中所含的溶酶酵素量，与其他动物相比，含量大抵相当","B":"丛冢雉的蛋壳被一层纳米级的碳酸钙层包裹，拥有了更强的防水性和抗细菌入侵能力","C":"丛冢雉蛋散发一种特殊气味，会使附着在其蛋壳上的细菌数减少","D":"与其他动物的蛋壳相比，丛冢雉的蛋壳要薄三分之一，更易受到微生物的入侵"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：溶酶酵素这种物质很可能就是抵御细菌侵扰的关键因素。\n论据：在澳洲有一种名为丛冢雉的鸟类，其蛋发生感染的几率仅为\u003cimg data-k=\"d70907a2658d\">，研究者发现其蛋壳中含有溶酶酵素。\n本题论点说的是溶酶酵素是抵御细菌侵扰的关键因素，论据说的是一种蛋壳中含有溶酶酵素的鸟类蛋发生感染的几率仅为\u003cimg data-k=\"d70907a2658d\">，二者都是在说溶酶酵素与细菌感染之间的关系，话题一致，削弱优先考虑削弱论点，且论点为因果关系，也可以考虑因果倒置（能够抵御细菌侵扰使其出现溶酶酵素），还可以考虑他因削弱（其他原因导致该鸟类可以抵御细菌侵扰）。\n第二步：逐一分析选项。\nA项：指出丛冢雉的蛋壳中所含的溶酶酵素量与其他动物含量相当，这说明溶酶酵素并不是丛冢雉的蛋的感染率比其他动物的蛋低很多的原因，削弱论点，排除；\nB项：指出纳米级的碳酸钙拥有了更强的防水性和抗细菌入侵能力，说明碳酸钙可能是丛冢雉的蛋的感染率比其他动物的蛋低很多的原因，提出了其他的原因可能是抵御细菌侵扰的关键因素，他因削弱，排除；\nC项：指出丛冢雉散发一种特殊气味会使附着在其蛋壳上的细菌数减少，说明气味可能是丛冢雉的蛋的感染率比其他动物的蛋低很多的原因，提出了其他的原因可能是抵御细菌侵扰的关键因素，他因削弱，排除；\nD项：指出丛冢雉的蛋壳很薄，更易受到微生物的入侵，讨论的是丛冢雉的蛋壳是否容易受到入侵，而论点讨论的是溶酶酵素是抵御细菌侵扰的关键因素，话题不一致，无法削弱，当选。\n本题为选非题，故正确答案为D。","no":110,"missingImage":false}]}],"count":40,"answerable":40,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"65907d546655\" function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};

      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);

    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
