<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2025年广西区考公务员录用考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2025-广西","title":"2025年广西区考公务员录用考试《行测》题（网友回忆版）","year":"2025","group":"广西","modules":[{"label":"政治理论","items":[{"type":"question","qid":"13504351","cat":"马克思主义","stem":"习近平总书记指出，“两个结合”是我们取得成功的最大法宝。关于“两个结合”，下列表述正确的有几项？\n①“两个结合”筑牢了道路根基，中国特色的关键就在于“两个结合”\n②“两个结合”本身就是创新，同时又开启了广阔的理论和实践创新空间\n③“两个结合”产生了深刻的“化学反应”，造就了一个有机统一的新的文化生命体\n④“两个结合”是坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"D","explanation":"本题考查理论与政策。\n2023年6月2日，中共中央总书记、国家主席、中央军委主席习近平在北京出席文化传承发展座谈会并发表重要讲话。\n①正确，讲话在“二、深刻理解‘两个结合’的重大意义”部分指出，第三，“结合”筑牢了道路根基。中国特色的关键就在于“两个结合”。“第二个结合”让中国特色社会主义道路有了更加宏阔深远的历史纵深，拓展了中国特色社会主义道路的文化根基。\n②正确，讲话在“二、深刻理解‘两个结合’的重大意义”部分指出，第四，“结合”打开了创新空间。“结合”本身就是创新，同时又开启了广阔的理论和实践创新空间。“第二个结合”让我们掌握了思想和文化主动，并有力地作用于道路、理论和制度。\n③正确，讲话在“二、深刻理解‘两个结合’的重大意义”部分指出，第二，“结合”的结果是互相成就。“结合”不是“拼盘”，不是简单的“物理反应”，而是深刻的“化学反应”，造就了一个有机统一的新的文化生命体。\n④正确，讲话在“二、深刻理解‘两个结合’的重大意义”部分指出，在五千多年中华文明深厚基础上开辟和发展中国特色社会主义，把马克思主义基本原理同中国具体实际、同中华优秀传统文化相结合是必由之路。这是我们在探索中国特色社会主义道路中得出的规律性认识。\n故正确的有①②③④，共4项。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"13504309","cat":"新思想","stem":"习近平总书记强调，中国将坚持推进高水平对外开放，以高质量发展全面推进中国式现代化，为各国开放合作提供新机遇。关于推进高水平对外开放，下列举措恰当的有几项？\n①维护多元稳定的国际经济格局和经贸关系\n②加强知识产权保护，营造良好的营商环境\n③稳步扩大规则、规制、管理、标准等制度型开放\n④减少对外资企业的准入限制，全面放开所有行业领域\n⑤加快建设贸易强国，推动共建“一带一路”高质量发展","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"C","explanation":"本题考查理论与政策。\n①③⑤正确，④错误，党的二十大报告“四、加快构建新发展格局，着力推动高质量发展”部分指出：“（五）推进高水平对外开放。依托我国超大规模市场优势，以国内大循环吸引全球资源要素，增强国内国际两个市场两种资源联动效应，提升贸易投资合作质量和水平。稳步扩大规则、规制、管理、标准等制度型开放。推动货物贸易优化升级，创新服务贸易发展机制，发展数字贸易，加快建设贸易强国。合理缩减外资准入负面清单，依法保护外商投资权益，营造市场化、法治化、国际化一流营商环境。推动共建‘一带一路’高质量发展。优化区域开放布局，巩固东部沿海地区开放先导地位，提高中西部和东北地区开放水平。加快建设西部陆海新通道。加快建设海南自由贸易港，实施自由贸易试验区提升战略，扩大面向全球的高标准自由贸易区网络。有序推进人民币国际化。深度参与全球产业分工和合作，维护多元稳定的国际经济格局和经贸关系。”减少外资准入限制是推进对外开放的重要举措，但“全面放开所有行业领域”表述过于绝对，某些关键领域仍需保留一定的限制，以确保国家利益和安全。\n②正确，习近平总书记在重要文章《全面加强知识产权保护工作 激发创新活力推动构建新发展格局》中指出：“创新是引领发展的第一动力，保护知识产权就是保护创新······知识产权保护工作关系国家对外开放大局，只有严格保护知识产权，才能优化营商环境、建设更高水平开放型经济新体制。知识产权保护工作关系国家安全，只有严格保护知识产权，才能有效保护我国自主研发的关键核心技术、防范化解重大风险。”\n故①②③⑤表述正确，有4项。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"13504329","cat":"时事政治","stem":"党的二十大报告指出，构建全国统一大市场，深化要素市场化改革，建设高标准市场体系。关于构建全国统一大市场，下列与之相关说法错误的是：","options":{"A":"推动市场基础制度规则统一","B":"加强公平竞争审查柔性约束","C":"规范地方招商引资法规制度","D":"深化地方标准管理制度改革"},"answer":"B","explanation":"本题考查理论与政策。\nB项错误，A、C、D三项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“二、构建高水平社会主义市场经济体制”部分“（6）构建全国统一大市场”中指出：“推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。加强公平竞争审查刚性约束，强化反垄断和反不正当竞争，清理和废除妨碍全国统一市场和公平竞争的各种规定和做法。规范地方招商引资法规制度，严禁违法违规给予政策优惠行为。建立健全统一规范、信息共享的招标投标和政府、事业单位、国有企业采购等公共资源交易平台体系，实现项目全流程公开管理。提升市场综合监管能力和水平。健全国家标准体系，深化地方标准管理制度改革。”故B项中“柔性约束”说法错误。\n本题为选非题，故正确答案为B。","no":3,"missingImage":false},{"type":"question","qid":"13504328","cat":"时事政治","stem":"党的二十届三中全会指出，法治是中国式现代化的重要保障。下列不属于完善中国特色社会主义法治体系举措的是：","options":{"A":"健全基层民主制度","B":"深入推进依法行政","C":"深化立法领域改革","D":"加强涉外法治建设"},"answer":"A","explanation":"本题考查理论与政策。\nA项错误，中国共产党第二十届中央委员会第三次全体会议提出，发展全过程人民民主是中国式现代化的本质要求。必须坚定不移走中国特色社会主义政治发展道路，坚持和完善我国根本政治制度、基本政治制度、重要政治制度，丰富各层级民主形式，把人民当家作主具体、现实体现到国家政治生活和社会生活各方面。要加强人民当家作主制度建设，健全协商民主机制，健全基层民主制度，完善大统战工作格局。\nB、C、D三项正确，中国共产党第二十届中央委员会第三次全体会议提出，法治是中国式现代化的重要保障。必须全面贯彻实施宪法，维护宪法权威，协同推进立法、执法、司法、守法各环节改革，健全法律面前人人平等保障机制，弘扬社会主义法治精神，维护社会公平正义，全面推进国家各方面工作法治化。要深化立法领域改革，深入推进依法行政，健全公正执法司法体制机制，完善推进法治社会建设机制，加强涉外法治建设。\n本题为选非题，故正确答案为A。","no":4,"missingImage":false},{"type":"question","qid":"13504370","cat":"新思想","stem":"习近平总书记强调，现代化产业体系是现代化国家的物质技术基础，必须把发展经济的着力点放在实体经济上，为实现第二个百年奋斗目标提供坚强物质支撑。下列与之相关说法正确的有几项？\n①推进实施绿色发展战略，充分发挥绿色化赋能实体经济发展效应\n②促进数字技术和实体经济深度融合，催生新产业新业态新模式替代传统产业\n③重视现代服务业的发展，推动现代服务业与先进制造业、现代农业深度融合\n④推动重点产业在国内外有序转移、促进国内外产业深度融合与实体经济发展相结合","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","explanation":"本题考查理论与政策。\n①正确，《新型工业化是发展新质生产力的主阵地》中指出，习近平总书记强调：“要充分认识形成绿色发展方式和生活方式的重要性、紧迫性、艰巨性。”······因此，要推动绿色发展与实体经济发展相融合，充分发挥绿色化赋能实体经济发展效应。\n②错误，《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》中指出，促进数字技术与实体经济深度融合，赋能传统产业转型升级，催生新产业新业态新模式，壮大经济发展新引擎。\n③正确，《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》中指出，重视现代服务业的发展，推动现代服务业与先进制造业、现代农业深度融合，深化业务关联、链条延伸、技术渗透，支持智能制造系统解决方案、流程再造等新型专业化服务机构发展。培育具有国际竞争力的服务企业。\n④正确，习近平总书记在二十届中央政治局第二次集体学习时强调，优化生产力布局，推动重点产业在国内外有序转移，支持企业深度参与全球产业分工和合作，促进内外产业深度融合，打造自主可控、安全可靠、竞争力强的现代化产业体系。这要求我们发挥好超大规模市场优势和超大纵深空间优势，加快建设以实体经济为支撑的现代化产业体系，引导产业合理有序梯度转移。\n故①③④表述正确，共3项。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"13504327","cat":"新思想","stem":"习近平总书记强调，纪检监察机关是推进党的自我革命的重要力量，党和人民对这支队伍充分信任、充满期待，下列与之相关说法正确的有几项？\n①巩固拓展主题教育和教育整顿成果，坚持把思想教育放在首位\n②强化严格管理监督，打造忠诚干净担当、敢于善于斗争的纪检监察铁军\n③深化纪检监察体制改革，坚持授权和控权相结合，把权力关进制度的笼子\n④着力加强纪检监察工作规范化法治化正规化建设，不断提高正风肃纪反腐能力","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","explanation":"本题考查理论与政策。\n①错误，②③④正确，2025年1月6日，习近平总书记在中国共产党第二十届中央纪律检查委员会第四次全体会议上发表重要讲话。习近平总书记在讲话中强调：“纪检监察机关是推进党的自我革命的重要力量，党和人民对这支队伍充分信任、充满期待。要深化纪检监察体制改革，坚持授权和控权相结合，把权力关进制度的笼子。要着力加强纪检监察工作规范化法治化正规化建设，不断提高正风肃纪反腐能力。要巩固拓展主题教育和教育整顿成果，坚持打铁必须自身硬，强化严格管理监督，打造忠诚干净担当、敢于善于斗争的纪检监察铁军。”\n综上，②③④说法正确，共3项。\n故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"13504287","cat":"时事政治","stem":"2024年12月，中央农村工作会议在北京召开，会议对如何做好“三农”工作进行了具体部署，下列与之相关说法错误的是：","options":{"A":"加强新时代农村精神文明建设，积极开展移风易俗","B":"提高农村基本公共服务水平，持续改善农村人居环境","C":"推进农业科技力量协同攻关，因地制宜发展农业新质生产力","D":"完善农产品贸易与生产协调机制，推动粮食等农产品价格稳步提升"},"answer":"D","explanation":"本题考查理论与政策。\nD项错误，A、B、C三项正确，2024年中央农村工作会议强调，要聚焦学习运用“千万工程”经验、推进乡村全面振兴······推进农业科技力量协同攻关，加快科技成果大面积推广应用，因地制宜发展农业新质生产力······完善农产品贸易与生产协调机制，推动粮食等重要农产品价格保持在合理水平······推动基础设施向农村延伸，提高农村基本公共服务水平，持续改善农村人居环境，加强农村生态环境治理······实施文明乡风建设工程，加强新时代农村精神文明建设，积极开展移风易俗。\n本题为选非题，故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"13504294","cat":"新思想","stem":"实现中华民族伟大复兴的中国梦不可能一马平川，我们要居安思危、未雨绸缪，坚决战胜一切不确定难预料的风险挑战。任何困难都无法阻挡中国人民前进的步伐，我们要居安思危、未雨绸缪，是因为：","options":{"A":"人类社会历史发展是前进性与曲折性的辩证统一","B":"社会规律是在各种因素的相互作用过程中自发实现的","C":"通过充分发挥主观能动性，就能消除事物发展中的偶然方面","D":"本质与现象是相互依存的，所有现象都在一定程度上表现本质"},"answer":"A","explanation":"本题考查马克思主义。\n“居安思危”是指处于安全的环境下，也要预判可能出现的危险。“未雨绸缪”比喻事先做好准备工作，防止意外的发生。\nA项正确，题干中强调“实现中华民族伟大复兴的中国梦不可能一马平川”，其中，实现中华民族伟大复兴的中国梦是历史发展的必然趋势，具有前进性，但中国梦的实现不是一帆风顺，有一定的曲折性。要居安思危、未雨绸缪，就是要正视前进性的曲折，做好准备工作，符合题意。\nB项错误，社会规律是通过人们的自觉活动实现的，需要人的有意识、有目的的活动参与，不是在各种因素的相互作用过程中自发实现的。\nC项错误，事物的发展是由必然性和偶然性共同决定的。必然性是指事物发展过程中不可避免、确定的因素，偶然性则是指事物发展过程中不确定、可能改变的因素。但是，偶然性往往是难以完全预见和控制的。因此，通过充分发挥主观能动性，并不能消除事物发展中的偶然方面。\nD项错误，本质是事物的根本性质，是构成事物的诸要素之间的内在联系，是相对稳定的。现象是事物的外部联系和表面特征，是多变易逝的。本质总是通过一定的现象表现自己的存在。表述正确，但是和材料无关。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"13504288","cat":"时事政治","stem":"党的二十届三中全会提出，要推动建设生育友好型社会。关于推动建设生育友好型社会，下列举措不恰当的是：","options":{"A":"指导各地推动养育、教育产业市场化发展","B":"鼓励各地出台多孩子女同校就读具体实施办法","C":"指导各地将辅助生殖技术项目纳入医保报销范围","D":"指导有条件的地方将参加职工基本医疗保险的灵活就业人员纳入生育保险"},"answer":"A","explanation":"本题考查理论与政策。\n2024年10月19日，国务院办公厅印发《关于加快完善生育支持政策体系推动建设生育友好型社会的若干措施》（以下简称《措施》）。\nA项错误，《措施》在“一、总体要求”部分指出：“以习近平新时代中国特色社会主义思想为指导······完善生育支持政策体系和激励机制，健全覆盖全人群、全生命周期的人口服务体系，有效降低生育、养育、教育成本，营造全社会尊重生育、支持生育的良好氛围，为推动实现适度生育水平、促进人口高质量发展提供有力支撑。”由此可见，推动养育、教育产业市场化发展说法错误。\nB项正确，《措施》在“四、强化教育、住房、就业等支持措施”部分“（九）扩大优质教育资源供给”中指出：“优化区域教育资源配置······鼓励各地出台多孩子女同校就读具体实施办法，帮助解决家长接送不便问题。”\nC项正确，《措施》在“二、强化生育服务支持”部分“（四）加强生殖健康服务”中指出：“深入实施母婴安全行动提升计划和出生缺陷防治能力提升计划······加强生育医疗费用保障，指导各地将适宜的分娩镇痛以及辅助生殖技术项目纳入医保报销范围。”\nD项正确，《措施》在“二、强化生育服务支持”部分“（一）增强生育保险保障功能”中指出：“强化生育保险对参保女职工生育医疗费用、生育津贴待遇等保障作用。指导有条件的地方将参加职工基本医疗保险的灵活就业人员、农民工、新就业形态人员纳入生育保险。”\n本题为选非题，故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"13504334","cat":"新思想","stem":"深化养老服务改革发展是实施积极应对人口老龄化国家战略的迫切要求，是保障和改善民生的重要任务，事关亿万百姓福祉，事关社会和谐稳定，为加快建设适合我国国情的养老服务体系，更好保障老有所养，下列举措恰当的是：\n①推动国有资本参与发展养老服务，完善分类考核评价\n②加快补齐农村养老服务短板，扩大农村养老服务供给\n③发挥社区养老的决定作用，为居家养老提供有力支持\n④以失能老年人的照护为重点，强化我国基本养老服务","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n2024年12月30日，中共中央 国务院发布了《关于深化养老服务改革发展的意见》（以下简称《意见》）。\n①正确，《意见》在“四、构建养老服务事业产业发展三方协同机制”部分指出：“发挥养老服务产业发展市场配置资源作用······推动国有资本参与发展养老服务，完善分类考核评价。”\n②正确，《意见》在“三、贯通协调居家社区机构三类养老服务形态”部分指出：“加快补齐农村养老服务短板。因地制宜扩大农村养老服务供给。”\n③错误，《意见》在“三、贯通协调居家社区机构三类养老服务形态”部分指出：“强化社区养老依托作用。扩大社区养老服务有效供给，依托社区为居家养老提供有力支持。”故“社区养老的决定作用”说法有误。\n④正确，《意见》在“一、总体要求”部分指出：“加快健全养老服务网络，优化居家为基础、社区为依托、机构为专业支撑、医养相结合的养老服务供给格局，强化以失能老年人照护为重点的基本养老服务，健全分级分类、普惠可及、覆盖城乡、持续发展的养老服务体系······”\n故正确的有①②④。\n故正确答案为B。","no":10,"missingImage":false}],"count":10,"answerable":10,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"13504298","cat":"人文常识","stem":"下列关于汉字的表述错误的是：","options":{"A":"甲骨文的内容多为“卜辞”","B":"“书同文”中的“文”指的是大篆","C":"“钟鸣鼎食”中的两种器具均是金文的载体","D":"隶书是篆书的化繁为简，化圆为方，化弧为直"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，甲骨文，主要流行于商周时期，又称“契文”、“甲骨卜辞”，是迄今为止中国发现的年代最早的成熟文字系统。因商朝的人大都迷信鬼神，大事小事都要卜问，故甲骨文的内容大部分是殷商王室占卜的记录，即“卜辞”。\nB项错误，“书同文”是秦始皇统一六国后推行的政策，以秦国的小篆为标准，统一全国文字，这里的“文”指的是小篆，而不是大篆。\nC项正确，“钟鸣鼎食”出自《史记·货殖列传》，钟：古代乐器；鼎：古代炊器，二者都是青铜器，而金文指的是铸造在殷商与周朝青铜器上的铭文，所以这两种器具均是金文的载体。\nD项正确，隶书是由篆书演变而来的，它简化了篆书的结构，将篆书的圆转笔画改为方折，化繁为简，化圆为方，化弧为直。\n本题为选非题，故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"13504335","cat":"人文常识","stem":"下列诗句与其所描述的乐器对应正确的是：","options":{"A":"昆山玉碎凤凰叫，芙蓉泣露香兰笑——二胡","B":"锦瑟无端五十弦，一弦一柱思华年——古筝","C":"曲终收拨当心画，四弦一声如裂帛——箜篌","D":"几年调弄七条丝，元化分功十指知——古琴"},"answer":"D","explanation":"本题考查人文常识。\nA项错误，“昆山玉碎凤凰叫，芙蓉泣露香兰笑”出自唐代李贺的《李凭箜篌引》，意思是乐声清脆得就像昆仑山的美玉被击碎，凤凰在鸣叫；时而又像芙蓉在露水中饮泣，像兰花迎风开放笑语轻柔。通过“玉碎”“凤凰叫”等意象描述箜篌的清脆音色和奇幻音效，诗句所描述的乐器是箜篌，而非二胡。\nB项错误，“锦瑟无端五十弦，一弦一柱思华年”出自唐代李商隐的《锦瑟》，意思是精美的瑟为什么有五十根弦，一弦一柱都叫我追忆青春年华。“瑟”是中国传统弹拨乐器，早期有五十弦，后演变为二十五弦，而古筝通常为二十一弦，两者形制不同。诗句明确指向瑟，而非古筝。\nC项错误，“曲终收拨当心画，四弦一声如裂帛”出自唐代白居易的《琵琶行》，意思是一曲终了拨子从弦索中间划过四弦，一声轰鸣好像撕裂了布帛。“四弦”直接点明诗句所描述的乐器为琵琶，而非箜篌。\nD项正确，“几年调弄七条丝，元化分功十指知”出自唐代方干的《听段处士弹琴》，意思是弹琴者花费了数年时间来调弄琴弦，深知通过十指的巧妙运用，能够将自然的变化和美妙融入到音乐之中。“七条丝”明确指出了所弹乐器为古琴，古琴以七弦为基本形制，且诗句强调“十指”拨弄的技法，符合古琴演奏特点。\n故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"13504257","cat":"科技常识","stem":"下列与水资源有关说法错误的是：","options":{"A":"我国主要淡水资源是冰川和地下水","B":"通过蒸发海水可以提取到氯化钠晶体","C":"利用蒸馏法淡化海水的过程主要是物理变化","D":"我国西北绝大部分地区属于地下水补给贫乏区"},"answer":"A","explanation":"本题考查地理国情。\nA项错误，中国淡水资源总量为2.8万亿立方米，占全球水资源的6%，居世界第六位，但人均只有2200立方米，仅为世界平均水平的\u003cimg data-k=\"62886ffdfcd1\">、美国的\u003cimg data-k=\"b0b84fe42a4b\">，是全球人均水资源贫乏的国家之一，属于缺水严重的国家。河流和湖泊是中国主要的淡水资源，河湖的分布、水量的大小，直接影响着各地人民的生活和生产。\nB项正确，通过蒸发海水可以提取到氯化钠晶体，这种方法在工业上被广泛应用，称为海水晒盐。海水晒盐是利用了蒸发结晶的原理。氯化钠的溶解度随温度变化不大，通过阳光照射和风力等自然条件，使海水蒸发，溶剂减少，溶液达到饱和状态，继续蒸发，氯化钠就会以晶体的形式析出。\nC项正确，蒸馏法淡化海水的原理是根据海水中各成分的沸点不同，通过加热海水使其汽化，然后将水蒸气冷却凝结成淡水。在这个过程中，只是水的状态发生了变化，从液态变为气态再变为液态，没有新物质生成，所以主要是物理变化。\nD项正确，西北地区深居内陆，气候干旱少雨，降水量少，蒸发量大。地表径流缺乏，由于降水少，西北地区的河流数量少，且多为内流河，河流水量较小。一些河流在流经干旱地区时，还会因为蒸发、下渗等原因，水量逐渐减少甚至干涸。因此，河流对地下水的补给作用有限。\n本题为选非题，故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"13504299","cat":"人文常识","stem":"关于急救知识，下列说法正确的是：","options":{"A":"伤者出现呕吐时，应对其采取仰卧姿势放置，以防止窒息","B":"踝关节扭伤后，应及时采取热疗加上按摩的方式来促进血液循环","C":"冻伤后应使用温水复温，直至冻伤区域的皮肤恢复正常颜色和感觉","D":"心肺复苏需按照“胸外按压10次、人工呼吸2次”的流程循环操作"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，伤者出现呕吐时，应将其头部偏向一侧，可以使呕吐物自然流出，保持呼吸道通畅。而不是采取仰卧姿势，仰卧姿势可能会导致呕吐物堵塞气道，引起窒息。\nB项错误，踝关节扭伤后，应在初期采取冷敷，而不是热疗和按摩。冷敷可以使局部血管收缩，减轻肿胀和疼痛。在扭伤初期进行热疗和按摩会加重局部出血和肿胀，不利于恢复。一般在扭伤48小时后，根据恢复情况可适当进行热疗等促进血液循环的措施。\nC项正确，冻伤后使用温水复温是正确的处理方法，一般用\u003cimg data-k=\"c8aac86b62cb\">至\u003cimg data-k=\"cde703209637\">的温水浸泡冻伤部位，直至冻伤区域的皮肤恢复至正常颜色和感觉。复温过程中应避免使用过热的水或火烤等方式，以免造成二次损伤。\nD项错误，心肺复苏的正确流程是胸外按压30次、人工呼吸2次，按照这样的流程循环操作，而不是胸外按压10次、人工呼吸2次。\n故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"13504318","cat":"科技常识","stem":"关于常见植物，下列说法正确的是：","options":{"A":"香樟树抗旱耐盐碱，在北方地区更容易生长","B":"玉兰的花期在夏季，花朵有一定的药用价值","C":"银杏树现今已广泛种植，退出濒危植物名录","D":"侧柏四季常青，树形美观，常用作园林绿化"},"answer":"D","explanation":"本题考查科技常识。\nA项错误，香樟树为亚热带常绿乔木，喜温暖湿润气候，耐寒性弱且不耐盐碱。北方冬季寒冷、土壤偏盐碱，不适宜其生长，故更适合南方种植。\nB项错误，玉兰为木兰科落叶乔木，不同种类兰花的花期不同，也因不同地区的温度不同而有区别，通常在春季，而非夏季。其花可入药，有祛风散寒、宣肺通鼻之效；主要分布于安徽、江西、浙江等地，现亦广泛栽培于城市园林。\nC项错误，银杏树虽已大规模人工种植，但野生种群仍属濒危。根据世界自然保护联盟（IUCN）《红色名录》，银杏评级为濒危（EN），尚未退出名录。\nD项正确，侧柏为柏科常绿乔木，四季常青、树形优美，兼具耐修剪、抗污染特性，是北方园林绿化中常见的行道树、绿篱及庭院景观树种。\n故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"13504320","cat":"科技常识","stem":"关于环境污染，下列说法正确的是：","options":{"A":"逆温天气时，大气层变动剧烈，加快了大气污染物的扩散","B":"淡水水体大量缺氧造成藻类死亡，容易引发“赤潮”现象","C":"大气中的二氧化硫和水蒸气可被氧化合成硫酸，进而形成硫酸雾","D":"石灰粉会与油脂发生化学反应使其溶于水，可用来处理海上石油泄漏"},"answer":"C","explanation":"本题考查地理国情。\nA项错误，逆温天气时，大气层出现温度随高度上升而增高的异常现象，导致空气垂直对流受阻，污染物无法扩散至高空，反而积聚在近地面，加剧污染（如雾霾）。因此，逆温天气会减缓污染物扩散，而非加快。\nB项错误，水体富营养化指的是水体中N、P等营养盐含量过多而引起的水质污染现象。水体出现富营养化现象时，浮游藻类大量繁殖，在淡水中形成水华，这种现象在海洋中叫做赤潮或红潮。\nC项正确，二氧化硫排放到大气中后，可被氧化为三氧化硫，再与水蒸气结合生成硫酸。硫酸与颗粒物结合形成硫酸雾（气溶胶），属于二次污染物，可导致酸雨。\nD项错误，石灰粉是以碳酸钙为主要成分的白色粉末状物质。石灰粉与油脂一般不会发生化学反应使其溶于水。在处理海上石油泄漏时，通常以物理吸附或沉淀为主，如使用吸油材料、围油栏围控等，辅以生物降解或化学分散剂等。\n故正确答案为C。","no":16,"missingImage":false},{"type":"question","qid":"13504301","cat":"科技常识","stem":"关于生活生产实践中的化学现象，下列说法错误的是（    ）。","options":{"A":"中药熬煮过程中，多糖类和蛋白质类成分会发生水解","B":"火药点燃时迅速释放出大量气体和热量的物质是硫化氢","C":"木炭通常由木材不完全燃烧或者在隔绝空气的条件下热解得到","D":"琉璃的多彩颜色源于铜、铁、锰等金属的氧化物在高温下的化学反应"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，在中药熬煮过程中，多糖类和蛋白质类成分会发生水解：多糖是由多个单糖分子通过糖苷键连接而成的高分子化合物，熬煮时，高温和水的作用会使糖苷键部分断裂，多糖逐步发生有限水解，生成更易溶出的低聚糖和少量单糖；蛋白质是由多种氨基酸通过肽键连接而成的生物大分子，熬煮时高温先使蛋白质变性，且中药本身含有的天然有机酸、矿物质等成分会形成弱催化环境，促进肽键部分断裂，使蛋白质逐步水解为多肽（部分可进一步生成氨基酸）。熬煮通过上述过程助力中药有效成分溶出，更好地发挥药效。\nB项错误，火药是一种燃烧剂，主要由硝酸钾、炭和硫磺组成。当火药被点燃时，其中的硝酸钾迅速分解产生氧气，同时炭和硫磺燃烧释放出热量。这些反应会产生大量的气体，同时释放出巨大的能量。火药点燃后发生的反应主要是：\u003cimg data-k=\"387b9d6299f6\">\u003cimg data-k=\"bbdff816e68e\">。从反应方程式可以看出，产物是硫化钾、氮气和二氧化碳，没有硫化氢气体产生。\nC项正确，在木材不完全燃烧时，由于氧气供应不充足，木材中的有机物不能完全氧化成二氧化碳和水，会有部分碳元素保留下来形成木炭。在隔绝空气条件下对木材进行热解，这是一个干馏过程。在高温作用下，木材中的水分和其他挥发性物质（如一些有机小分子）会被去除，同时木材中的纤维素、半纤维素和木质素等成分会发生分解和缩聚等化学反应，最终形成以碳为主要成分的木炭，同时还会得到木焦油、木煤气等副产物。\nD项正确，琉璃是以各种颜色的人造水晶为原料，在高温下烧制而成的。在制作琉璃的过程中，加入含有铜、铁、锰等金属的氧化物作为着色剂，这些金属氧化物在高温下会发生化学反应，从而使琉璃呈现出丰富多彩的颜色。例如，氧化铜可使琉璃呈现出绿色或蓝色，氧化铁能让琉璃呈现出红色、黄色或棕色，氧化锰则可使琉璃呈现出紫色或黑色等。不同的金属氧化物以及它们的不同含量和组合，能够使琉璃产生各种各样绚丽的色彩效果。\n本题为选非题，故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"13504259","cat":"科技常识","stem":"关于洗澡过程中的物理现象，下列说法错误的是：","options":{"A":"当浴室内水蒸气凝结成小水珠时，光线在小水珠上会发生散射现象","B":"水珠在皮肤上呈球形，是因为液体表面张力作用使其表面积最小化","C":"淋浴刚喷出水时更有力，是因为水流速度的增加会导致压强的增加","D":"人在浴缸中泡澡时会受到向上的浮力，其大小等于人排开水的重量"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，散射是指由传播介质的不均匀性引起的光线向四周射去的现象。当浴室内水蒸气凝结成小水珠时，小水珠在浴室内的分布是不均匀的，因此光线照射在小水珠上会发生散射现象。\nB项正确，液体表面张力使液体表面有收缩的趋势，会让水珠尽量收缩成表面积最小的球形，这样可以使其整体的能量最低，处于最稳定状态，因此水珠在皮肤上会呈现球形。\nC项错误，根据伯努利原理，在流体中，流速越大的地方压强越小。淋浴喷头通过特殊设计，使水在喷出时流速增大，从而导致喷头出口处的压强减小，而不是压强增加。\nD项正确，根据阿基米德原理，浸在液体中的物体受到向上的浮力，其大小等于物体所排开液体的重力。人在浴缸中泡澡时，身体浸入水中，会排开一部分水，受到的浮力大小就等于排开的水的重量。\n本题为选非题，故正确答案为C。","no":18,"missingImage":false}],"count":8,"answerable":8,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"13504261","cat":"逻辑填空","stem":"对分类学者来说，与其说是找到新物种，不如说是碰到新物种。新物种的发现往往并非            ，而是意外之喜。在阅读文献、野外调查、查阅图片或者研究标本时，分类学者偶尔会发现某份标本或者个体跟之前的记录不一样，进而通过形态学比较或者分子测序手段确认该物种是否属于新的物种。\n填入画横线部分最恰当的一项是：","options":{"A":"守株待兔","B":"刻舟求剑","C":"照本宣科","D":"按图索骥"},"answer":"D","explanation":"根据“并非······而是”可知，横线处所填成语与“意外之喜”构成反义并列，且根据前文“不如说是碰到新物种”以及后文“偶尔会发现某份标本或者个体跟之前的记录不一样”可知，新物种并不是通过以往的记录或文献发现的，而是偶然间发现的，故横线处所填成语需体现通过以往的资料或线索发现之意。D项“按图索骥”比喻依照线索去寻找事物，符合文意，当选。\nA项“守株待兔”比喻死守狭隘的经验不知变通，也讽刺妄想不劳而获的侥幸心理，B项“刻舟求剑”比喻办事刻板拘泥，不知根据实际情况处理问题，均与文意不符，排除；\nC项“照本宣科”形容讲课、发言等死板地按照课文、讲稿，没有发挥，不生动，与“新物种的发现”搭配不当，排除。\n故正确答案为D。\n【文段出处】《哪里更容易碰到新物种？》","no":19,"missingImage":false},{"type":"question","qid":"13504382","cat":"逻辑填空","stem":"很多短视频不会提供更多的、有助于消除不确定性的信息，标题几乎就是其内容的全部。在标题的暗示下，网友被误导从而更容易相信某个被放大的碎片就是完整真相，所以短视频时代的“标题党”可能带来的破坏力就更加          。\n填入画横线部分最恰当的一项是：","options":{"A":"昭然若揭","B":"难以名状","C":"显而易见","D":"不容小觑"},"answer":"D","explanation":"根据“网友被误导从而更容易相信某个被放大的碎片就是完整真相”可知，横线处所填成语需表达出短视频时代“标题党”可能带来的破坏力会很大、不能忽视之意。D项“不容小觑”指不能小看，不能轻视，符合文意，当选。\nA项“昭然若揭”指含义非常明显或真相完全暴露，侧重坏事被揭露，与文意不符，排除；B项“难以名状”指难以形容、描述，侧重无法形容，文意明确指出破坏力不能忽视之意，与文意不符，排除；C项“显而易见”指事情或道理很明显，极容易看清，侧重事情本身较明显，文段侧重“标题党”所带来的消极影响很大，与文意不符，排除。\n故正确答案为D。\n【文段出处】《浙江宣传|别让“标题党”在短视频上蔓延》","no":20,"missingImage":false},{"type":"question","qid":"13504279","cat":"逻辑填空","stem":"食品数字标签，相当于电子“身份证”，通过二维码等形式展示食品的标签信息，消费者可以扫描食品标签上的二维码，通过页面放大、语音识读、视频讲解等多种功能，        地获取食品的相关信息。比如，食品的名称、配料表、生产日期和保质期、营养成分表等信息，消费者            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"持续 一览无遗","B":"实时 一清二楚","C":"详尽 一举两得","D":"便捷 一目了然"},"answer":"D","explanation":"第一空，根据“消费者可以扫描食品标签上的二维码”“比如，食品的名称、配料表、生产日期和保质期、营养成分表等信息”可知，文段强调通过食品数字标签，消费者获取食品相关信息非常便利，且获取的信息全面，故横线处所填词语要体现便利、全面之意，C项“详尽”指详细全面，没有遗漏，D项“便捷”指方便快捷，均符合文意，保留。A项“持续”指连续不断，与“扫码”这一动作不匹配，排除；B项“实时”指在某事发生、发展的实际时间同步做某事，与文段“比如”之后列举的内容不符，排除。\n第二空，根据“消费者可以扫描食品标签上的二维码······获取食品的相关信息”“比如，食品的名称、配料表、生产日期和保质期、营养成分表等信息”可知，文段强调消费者对于食品相关信息清楚了解，故横线处所填成语要体现清楚之意，D项“一目了然”形容事物、事情原委很清晰，一看就知道是怎么回事，符合文意，当选。C项“一举两得”指做一件事，同时收获两方面的好处，文段未提及两方面好处，排除。\n故正确答案为D。\n【文段出处】红网《食品数字标签保护“舌尖上的安全”》","no":21,"missingImage":false},{"type":"question","qid":"12882019","cat":"逻辑填空","stem":"通过迁地保护、建立常态化监测体系、保护和修复野生动植物赖以生存的生态家园等一系列举措，云南许多珍稀动植物的命运正在被        。滇金丝猴数量增长到3300余只，西黑冠长臂猿、绿孔雀等20多种野生动物种群数量也大幅上升；漾濞槭、华盖木等30种极小种群野生植物        灭绝威胁。\n依次填入画横线部分最恰当的一项是：","options":{"A":"改编 挣脱","B":"改写 脱离","C":"改变 面临","D":"修改 受到"},"answer":"B","explanation":"第一空，搭配“命运”，根据前文可知，横线处表达一系列举措对云南许多动植物命运产生积极影响，B项“改写”指变换另一种写法，C项“改变”指使发生变化，均与“命运”搭配恰当，且符合文意，保留。A项“改编”指根据原著重新编写，D项“修改”指改正文章、计划等里面的错误、缺点，均与“命运”搭配不当，排除。\n第二空，根据前文可知，一系列举措对云南许多珍稀动植物起到积极作用，横线处应表达不再面临灭绝威胁之意。B项“脱离”指离开（某种环境或情况），符合文意，当选。C项“面临”指面前遇到（问题、形势等），与文意相悖，排除。\n故正确答案为B。\n【文段出处】光明日报《解码生物多样性保护的云南经验》","no":22,"missingImage":false},{"type":"question","qid":"13504263","cat":"逻辑填空","stem":"山西的珍贵古建筑为现代艺术创作提供了无尽的        。《黑神话：悟空》游戏开发者们深入挖掘山西古建筑中的艺术瑰宝，巧妙地将27处极具代表性的古建筑融入游戏设计中。游戏场景中，“亢金龙”“虚日鼠”等藏于晋城玉皇庙里的二十八星宿塑像被复刻得            ，使越来越多的人体验到中国的古建之美和文化之韵。\n依次填入画横线部分最恰当的一项是：","options":{"A":"巧思 跃然纸上","B":"灵感 栩栩如生","C":"参考 惟妙惟肖","D":"想象 绘声绘色"},"answer":"B","explanation":"第一空，搭配“无尽”，根据“《黑神话：悟空》游戏开发者们深入挖掘山西古建筑中的艺术瑰宝，巧妙地将27处极具代表性的古建筑融入游戏设计中”可知，现代艺术创作者从古建筑中获取到了设计游戏的思路。A项“巧思”指灵巧的心思或巧妙的构思，B项“灵感”指在文学、艺术、科学、技术等活动中，突然产生的富有创造性的思路，均符合文意，保留。C项“参考”指在处理事物时借鉴、利用有关材料，与“无尽”搭配不当，排除；D项“想象”指人类在头脑中对已有的表象进行加工改造，创造出新形象的心理过程，而文段强调的是从真实存在的山西古建筑中获取创作元素，与文意相悖，排除。\n第二空，搭配“二十八星宿塑像”，且根据“使越来越多的人体验到中国的古建之美和文化之韵”可知，横线处成语与后文构成因果关系，应体现复刻效果极具真实感之意。B项“栩栩如生”指艺术形象非常逼真，如同活的一样，符合文意且搭配恰当，当选。A项“跃然纸上”形容描写或刻画得十分生动逼真，多用于文学或绘画领域，“纸上”这一表述显然与“二十八星宿塑像”搭配不当，排除。\n故正确答案为B。\n【文段出处】光明日报《山西：数智助力 古建出圈》","no":23,"missingImage":false},{"type":"question","qid":"13504384","cat":"逻辑填空","stem":"品牌建设是一项长期性、战略性任务，也是一项系统工程。要抓住机遇，直面挑战，用好物质基础雄厚、人力资源丰富、市场空间广阔等        ，坚决解决部分产品质量和性能欠佳的“硬伤”，做细做精做强，不断提升品牌的内在价值，让有竞争力的品牌            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"要素 崭露头角","B":"资本 声名鹊起","C":"优势 脱颖而出","D":"条件 百尺竿头"},"answer":"C","explanation":"第一空，与“物质基础雄厚、人力资源丰富、市场空间广阔等”搭配，且根据文意可知，横线处所填词语应表达品牌建设需要利用好这些资源之意。A项“要素”指构成事物的必要因素，C项“优势”指能超过对方的有利形势，D项“条件”指影响事物发生、存在或发展的因素，均符合文意，保留。B项“资本”比喻牟取利益的凭借，与“市场空间广阔”搭配不当，排除。\n第二空，根据横线前“品牌建设······要抓住机遇，直面挑战”以及“做细做精做强，不断提升品牌的内在价值”可知，横线处所填成语应体现让有竞争力的品牌得到充分发展的意思。C项“脱颖而出”比喻人的才能全部显示出来，多用于竞争的语境当中，与“有竞争力的品牌”搭配恰当，当选。A项“崭露头角”比喻突出地显露出才能和本领，多用于形容事物发展初期或起步阶段，与文意不符，排除；D项“百尺竿头”比喻学问、成绩等达到了很高的程度以后仍继续努力，与文意不符，排除。\n故正确答案为C。\n【文段出处】《以品牌建设助推高质量发展》","no":24,"missingImage":false},{"type":"question","qid":"13504278","cat":"逻辑填空","stem":"近年来，“打卡无人区”成为一些人的时髦选择，诸如青海可可西里、新疆罗布泊等人迹罕至的自然保护区，成了不少人            的人间秘境。但是，“无人区”及自然生态保护区，远没有外界想象得那么浪漫和神秘。每个游客及旅行团都要深刻认识到这类地区的极端危险性，切莫仅凭一腔热血与        ，就盲目进发。\n依次填入画横线部分最恰当的一项是：","options":{"A":"念兹在兹 臆想","B":"念念不忘 激情","C":"心驰神往 好奇","D":"心醉神迷 勇气"},"answer":"C","explanation":"第一空，横线处搭配“人间秘境”，且根据“时髦选择”可知，文段表达人迹罕至的自然保护区成为很多人向往的地方，C项“心驰神往”形容思想集中在追求和向往的事情或地方上，一心向往，搭配恰当，符合文意，保留。A项“念兹在兹”指念念不忘某一件事情，与“人间秘境”搭配不当，排除；B项“念念不忘”指牢记于心，时刻不忘，搭配地点时多搭配去过的地方，文段中并没有去过，与文意不符，排除；D项“心醉神迷”形容佩服爱慕到极点，程度过重，排除。\n第二空，代入验证，根据“每个游客及旅行团都要深刻认识到这类地区的极端危险”可知，文段表达这类地区很危险，不能盲目出发，C项“好奇”指对自己不了解的事物觉得新奇而感兴趣，能体现促使人们盲目进发的情绪，与文意相符，当选。\n故正确答案为C。\n【文段出处】《不得擅自进入“无人区”，青海这个提醒为何必要？|新京报快评》","no":25,"missingImage":false},{"type":"question","qid":"13504378","cat":"逻辑填空","stem":"大自然的雄性和小部分雌性动物在性竞争中会采取            的手段，比如“控制资源”“使用武器”，以及进化出更有          的形态或功能（表型）等。而推动雄性表型性进化的动力，是雌性作为选择者凭借其感官系统和大脑机制的结合在选择配偶的过程中表现出来的性审美。\n依次填入画横线部分最恰当的一项是：","options":{"A":"匪夷所思  亲和力","B":"行之有效  攻击性","C":"独出心裁  独特性","D":"多种多样  吸引力"},"answer":"D","explanation":"本题可从第二空入手，根据“是雌性作为选择者凭借其感官系统和大脑机制的结合在选择配偶的过程中表现出来的性审美”可知，雄性所进化出的形态或功能（表型）符合雌性审美，且能吸引雌性，故横线处所填词语需体现吸引之意，A项“亲和力”比喻使人感到融洽、亲切并愿意接近的力量，D项“吸引力”指能吸引别的事物、人或人的兴趣的性质或能力，均符合文意，保留。B项“攻击性”指具有对他人有意挑衅、侵犯或对事物有意损毁、破坏等心理倾向和行为的人格特征，C项“独特性”指某物或某人所具有的区别于其他同类事物的特性，均与文意不符，排除。\n第一空，横线后通过“比如”对前文进行举例分析，根据“‘控制资源’‘使用武器’，以及进化出更有······的形态或功能（表型）等”可知，横线处所填成语应体现出大自然的雄性和小部分雌性动物在性竞争中会采取多种手段之意，D项“多种多样”指多方面的、五花八门，符合文意，当选。A项“匪夷所思”指事物怪异或人的言行离奇，不是一般人按照常理所能想象的，文段并无怪异、离奇之意，排除。\n故正确答案为D。\n【文段出处】中国科学报《它们的审美是异性进化的动力》","no":26,"missingImage":false},{"type":"question","qid":"13504264","cat":"逻辑填空","stem":"未来，金融机构应该如何进一步做好科技金融服务？ 要根据高技术产业研发投入大、周期长、风险高等特点，            创新信贷服务模式，最大限度提高信贷服务的          ，通过规范发展“贷款+外部直投”、科技保险、科技领军企业供应链金融等专属金融服务，全方位畅通高新技术企业的贷款通道。\n依次填入画横线部分最恰当的一项是：","options":{"A":"因势利导 适配性","B":"量身定制 特殊性","C":"兼收并蓄 积极性","D":"固本强基 重要性"},"answer":"A","explanation":"第一空，根据“要根据高技术产业研发投入大、周期长、风险高等特点” 可知，横线处所填成语应体现根据高技术产业的特点去创新信贷服务模式之意。A项“因势利导”指顺着事情的发展趋势加以引导，B项“量身定制”指根据功能需要定制产品，均符合文意，保留。C项“兼收并蓄”指把不同内容、不同性质的东西收下来，侧重“包容性”，D项“固本强基”指加固本体、强化基础，均与文意无关，排除。\n第二空，搭配“信贷服务”，结合后文“通过规范发展‘贷款+外部直投’、科技保险、科技领军企业供应链金融等专属金融服务，全方位畅通高新技术企业的贷款通道”可知，横线处所填词语应体现信贷服务要与高技术产业贷款需求相匹配。A项“适配性”指互相匹配，相互适应，符合文意，当选。B项“特殊性”强调不同于一般，“最大限度提升特殊性”表述程度过重，与文意不符，排除。\n故正确答案为A。\n【文段出处】经济日报 《精准做好科技金融服务》","no":27,"missingImage":false},{"type":"question","qid":"13504375","cat":"逻辑填空","stem":"发展新质生产力需要传统产业的支撑与贡献。发展好传统产业，可以稳住经济的基本盘，避免            ，为产业转型提供回旋空间，为新产业培育积累产业基础。因此，发展新质生产力不能不立先破、盲目放弃或忽视传统产业，也不能            ，盲目上马所谓的高新技术产业。\n依次填入画横线部分最恰当的一项是:","options":{"A":"随波逐流 人云亦云","B":"大开大合 瞎子摸象","C":"无的放矢 朝秦暮楚","D":"大起大落 一哄而上"},"answer":"D","explanation":"第一空，根据“发展好传统产业，可以稳住经济的基本盘，避免······”可知，横线处所填成语应与“稳住”意思相反，体现不稳定、波动大之意，D项“大起大落”指大幅度的起与落，形容变化大，可体现“不稳定”之意，符合文意，保留。A项“随波逐流”比喻自己没有立场和主见，只是随着潮流走，B项“大开大合”形容文思跌荡，放得开，收得拢，C项“无的放矢”比喻说话做事没有明确目的，或不切合实际，均与文意不符，排除。\n第二空，代入验证。根据“盲目上马所谓的高新技术产业”可知，横线处所填成语应形容“盲目上马”这一行为，D项“一哄而上”比喻做事没有计划、没有组织，大家乱糟糟地开始上马，符合文意，当选。\n故正确答案为D。\n【文段出处】光明网-文摘报《全国统一大市场建设有助于处理好三对关系》","no":28,"missingImage":false},{"type":"question","qid":"13504283","cat":"逻辑填空","stem":"武器因人类生存需要而产生，最初的武器来自自然的        。参照蚌壳边缘、石块边棱等尖锐、锋利的存在，人类学会了制作第一批原始武器。基于对弹性、惯性、杠杆原理等概念的        认识，人类学会了制作弓弩、抛石机等弹射武器，极大地扩展了武器的攻击        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"馈赠 粗浅 手段","B":"启发 模糊 距离","C":"效法 初步 范围","D":"模仿 清醒 强度"},"answer":"B","explanation":"第一空，根据“参照蚌壳边缘、石块边棱等尖锐、锋利的存在”可知，横线处所填词语应体现因为自然而学会制作武器之意，B项“启发”指用事例引起对方联想并有所了解、领悟，符合文意，保留。A项“馈赠”指赠送，文段强调人类从自然现象中主动学习制作武器，而非被动给予，与文意不符，排除；C项“效法”指仿照别人的做法去做，学习别人的长处，D项“模仿”指照某种现成的样子学着做，置于此处应表述为“对自然的效法/模仿”，用法均错误，排除。\n第二空，代入验证，根据“人类学会了制作弓弩、抛石机等弹射武器”可知，人类处于制作弹射武器的阶段，横线处要表达人类对科学原理的认知不深入之意，B项“模糊”指不清楚、不分明，与文意相符，保留。\n第三空，代入验证，搭配“扩展”，且根据“弓弩、抛石机等弹射武器”可知，横线处要表达出弹射武器可以攻击更远的目标，B项“距离”指事物在空间或时间上相隔，符合文意，且搭配恰当，当选。\n故正确答案为B。\n【文段出处】物理《古代武器中的物理学》","no":29,"missingImage":false},{"type":"question","qid":"13504280","cat":"逻辑填空","stem":"面对疑难杂症，临床医学上很多时候只能摸着石头过河。在这方面，AI可以发挥很大作用。它能        影像、病理、基因等多模态数据，提供多尺度综合分析，帮助我们构建更        的肿瘤画像。肿瘤是一个由复杂癌细胞组成的生态系统，对其画像勾勒得越        ，就越能发现以往忽视的肿瘤行为和潜在治疗靶点，为前端治疗提供新思路。\n依次填入画横线部分最恰当的一项是：","options":{"A":"整合 完整 准确","B":"收集 稳定 详尽","C":"模拟 具象 立体","D":"回溯 精细 透彻"},"answer":"A","explanation":"第一空，根据“提供多尺度综合分析”可知，此处体现AI能获取多种数据，对多种数据进行处理，从而提供多尺度综合分析之意，A项“整合”指把零散的东西彼此衔接，从而实现信息系统的资源共享和协同工作，形成有价值有效率的一个整体，B项“收集”指使聚集在一起，均可体现获取或处理多种数据之意，保留。C项“模拟”指对真实事物或者过程的虚拟，侧重于模仿虚拟，D项“回溯”指上溯，向上推导，向内推导，侧重于推导，回忆，均不符获取或处理多种数据之意，排除。\n第二空，搭配“肿瘤画像”，结合“提供多尺度综合分析”可知，此处体现构建更为全面的肿瘤画像之意，A项“完整”指具有或保持着应有的部分，没有损坏或残缺，可与“肿瘤画像“搭配，且可体现较为全面的肿瘤画像之意，保留。B项“稳定”指稳恒固定；没有变动；使稳定，与“肿瘤画像”搭配不当，且意思为稳定不变，不符合文意，排除。\n第三空，代入A项验证，“准确”指行动的结果完全符合实际或预期，可对应后文“就越能发现以往忽视的肿瘤行为和潜在治疗靶点”，可体现对画像勾勒的正确性，当选。\n故正确答案为A。\n【文段出处】《AI如何助力重塑肿瘤诊疗模式》","no":30,"missingImage":false},{"type":"question","qid":"13504314","cat":"逻辑填空","stem":"在发展流变中，汉语的表达效率不断提升。比如，“枯藤老树昏鸦，小桥流水人家，古道西风瘦马”，三个短句，省去了一切连接、修饰，全由名词并列而成。高度        的表达下，九种景物看似独立存在，实则互相        、有机相融，构建出一幅萧瑟秋景，游子离家、悲秋之情            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"简练 叠加 呼之欲出","B":"简约 呼应 显而易见","C":"概括 关联 不言而喻","D":"凝练 照应 溢于言表"},"answer":"D","explanation":"第一空，根据“省去了一切连接、修饰”可知，横线处所填词语应体现表达方式非常精炼，没有多余内容之意。A项“简练”指简明精练，B项“简约”指简略，D项“凝练”指紧凑简练，均符合文意，保留。C项“概括”指把事物的共同特点归结在一起加以简明地叙述，侧重对复杂内容进行归纳总结，与文意不符，排除。\n第二空，根据“有机相融，构建出一幅萧瑟秋景”可知，横线处所填词语应表明景物之间彼此联系，形成一个有机的整体，B项“呼应”指互相照应，D项“照应”指对照呼应，均可体现互相存在联系，符合文意，保留。A项“叠加”指的是使预先成并存储的图形、属性特征等被调用并叠合在一个基本图形上的过程或方法，强调物理性的机械堆砌，无法体现出景物之间的内在联系，与文意不符，排除。\n第三空，搭配“游子离家、悲秋之情”，且根据“构建出一幅萧瑟秋景，游子离家、悲秋之情”可知，横线处所填成语应体现出文字所想表达的情感非常深切之意，D项“溢于言表”意为超出言语以外，指某种思想感情虽未说明却能使人体会出来，符合文意，当选。B项“显而易见”意为事情或道理很明显，极容易看清，一般用来形容事情、道理等比较直观，容易被察觉，与“游子离家、悲秋之情”搭配不当，且“游子离家、悲秋之情”是通过对景物的描写委婉地表达出来的，并非是那种一眼就能看清楚的，置于此处不如D项更符合文意，排除。\n故正确答案为D。\n【文段出处】人民日报《汉语的魅力从何而来》","no":31,"missingImage":false},{"type":"question","qid":"13504332","cat":"片段阅读","stem":"雅文化是一种自觉的、表现为典籍形态的思想体系，流行于知识层次较高的阶层，对社会的影响深刻而狭窄。俗文化以世俗生活为中心，是民众自发的、无意识的文化心理，对社会的影响肤浅而广泛。二者之间只有形式上的自觉思想体系与民众直观体认，典籍形态与世俗传承的区别，实际上雅中有俗、俗中有雅，由俗到雅、由雅到俗。《论语》《孟子》中的语录不仅记载于典籍，也被世俗传诵。《诗经》原本是当时的民谣俚曲，后世竟成为儒家的经典。\n这段文字意在强调雅文化与俗文化：","options":{"A":"彼此完全对立","B":"表现形式有别","C":"社会影响不同","D":"存在互动关系"},"answer":"D","explanation":"文段首先引入了“雅文化”和“俗文化”的话题，并介绍了二者各自的特点，接着指出二者之间只有形式上的区别，后文通过“实际上”进行转折，强调雅中有俗、俗中有雅，由俗到雅、由雅到俗，最后通过《论语》《孟子》《诗经》进行举例论证，故文段重点在转折之后，强调雅中有俗、俗中有雅，由俗到雅、由雅到俗，D项“存在互动关系”是对文段中心的同义替换，当选。\nA项，“彼此完全对立”文段并未涉及，无中生有，排除；\nB项，“表现形式有别”对应文段转折之前的内容，非重点，排除；\nC项，“社会影响不同”为文段开篇引入话题的部分，非重点，排除。\n故正确答案为D。\n【文段出处】光明网《社会风俗中的道德力量》","no":32,"missingImage":false},{"type":"question","qid":"13504383","cat":"片段阅读","stem":"从传播史上来讲，人类的传播形式经历过人际交往的口头传播。在这个阶段，由于传播主体的时空局限，文化传播特别缓慢，其中的文化是歌乐舞一体的，人可以说是“混沌的人”。文字发明之后的书写传播，扩大了空间范围、延伸了时间长度，随之诞生了一种具有反思精神和思想反刍意味的“深度的人”。古登堡革命之后是大规模印刷时代的到来，新闻报刊与20世纪以来的广播、电影视等共同将人类带入了大众传播时代。这种传播模式下，它的受众是一种“无个性的人”。这是一个由小众到大众的发展历程，也是一种人的演变过程。\n这段文字主要介绍了：","options":{"A":"人类传播形式的演变历史","B":"技术进步对人类传播形式的影响","C":"人从“混沌”变为“深度”的过程","D":"人类感知世界和认识社会方式的进化"},"answer":"D","explanation":"文段开篇从传播史视角切入，详细阐述了人类传播形式演变对人类自身感知的影响，即口头传播时期，受时空局限，人类处于“混沌的人”；书写传播时期，因时空扩展，使人们反思和思想反刍成为可能，认知方式得以深化，成为“深度的人”；大众传播时代，人们成为“无个性的人”。尾句通过指代词“这”对前文内容进行了总结，即人类在传播形式发展过程中，自身的认知也在演变。故文段重点强调人类自身感知的演变，对应D项。\nA项，仅提及传播形式的改变，而未提及人自身的演变，偏离文段结论的重点，排除；\nB项，文段并非强调“技术进步的影响”，而是“人类自身感知的演变”，偏离文段重点，排除；\nC项，从“混沌”变为“深度”，仅涉及“从口头传播到书写传播”过程中的部分内容，未包括大众传播时代这些“无个性的人”，概括的不够全面，排除。\n故正确答案为D。\n【文段出处】光明日报《网络生态下对文学走向的展望》","no":33,"missingImage":false},{"type":"question","qid":"13504344","cat":"语句表达","stem":"枯木是自然界中凋枯衰朽之木的总称，宋诗中展现出各种枯木之姿，不仅丰富了诗歌的审美内蕴，还折射出宋人独特的精神追求。                    。宋代社会掀起一股尚“枯”趣味的审美潮流。在日常生活领域，“三苏”开创了清供枯木假山的潮流，枯态花卉、寒山枯林受到士人们的欣赏；在艺术创作领域，士人们在书画创作中运用枯笔技法、追崇枯瘦书体，开创了枯木题材的绘画；在诗歌批评领域，宋代出现了“枯淡”“枯劲”等一系列含“枯”的诗论概念。从日常生活到文学艺术，“枯”成为宋人的重要美学命题。\n填入画横线部分最恰当的一项是：","options":{"A":"枯木意象寄托了宋人丰富的情思意蕴","B":"对枯木的思考映现出艺术家的创作情感","C":"枯木意象与宋代社会的审美文化息息相关","D":"诗歌中的枯木意象具有深邃的思想文化内涵"},"answer":"C","explanation":"横线出现在文段中间，需结合前后文进行分析。横线前通过下定义的方式引出“枯木”的话题，并指出宋诗中的枯木之姿丰富了诗歌的审美内蕴，折射出宋人的精神追求。横线后从日常生活、艺术创作和诗歌批评三个角度阐述宋代社会掀起尚“枯”趣味的审美潮流，强调“枯”成为宋人重要的美学命题，故横线处应承上启下，体现“枯木”意象与宋代社会审美潮流之间的关系，对应C项。\nA项，“情思意蕴”指情感内涵，与横线后体现的宋代尚“枯”审美潮流话题不一致，无法构成衔接，排除；\nB项，“艺术家的创作情感”仅能对应后文的艺术创作领域，表述片面，排除；\nD项，“具有深邃的思想文化内涵”无法体现“枯”的意象与宋代社会审美文化的关联，与后文衔接不当，排除。\n故正确答案为C。\n【文段出处】掌桥科研《宋诗枯木意象研究》","no":34,"missingImage":false},{"type":"question","qid":"13504339","cat":"片段阅读","stem":"水墨作为民族文化的重要象征，是历代国人观察和表现世界的一种独特方式。有别于传统绘画，当代水墨更为贴近这个时代，有着对艺术更为深入的思考。当代水墨艺术家更注重反映当下人的生存状态和精神指向，他们既了悟中国传统文化的艺术灵蕴，又深谙西方先锋艺术语言，同时兼具人文关怀和独立品格，其作品往往能够从传统中汲取精华，又能在西方美学中吸收养分，进而创造出一种新的当代语言，形成自己特有的笔墨方式来表达艺术理想，具有鲜活的时代特征和生命力量。\n这段文字主要介绍了：","options":{"A":"传统水墨与当代水墨之间的差异","B":"水墨作为民族文化象征的重要地位","C":"当代水墨艺术家及其作品的独特造诣","D":"水墨艺术折射出的人文关怀和文化精华"},"answer":"C","explanation":"文段开篇引出“水墨”的话题，接着指出“当代水墨”更贴近时代且有更深入的艺术思考。随后阐述“当代水墨艺术家”更注重反映当下人的生存状态与精神指向，他们有其自身的优势，进而强调他们的作品能从传统和西方美学中汲取养分，创造新语言、形成独特笔墨方式来表达艺术理想，具有鲜活时代特征和生命力量。故文段主题词为“当代水墨艺术家”，重点讨论当代水墨艺术家及其作品的特点，对应C项。\nA项，“传统水墨”为引出主题词“当代水墨艺术家”的铺垫，非重点，排除；\nB项，“水墨的重要地位”为开篇引入部分，非重点，排除；\nD项，“水墨艺术折射出的人文关怀和文化精华”为当代水墨艺术家及其作品的具体特点，未重点突出“当代水墨艺术家”，偏离文段重点，排除。\n故正确答案为C。\n【文段出处】雅昌新闻《贾廷峰：当代水墨是未来艺术投资的潜力股》","no":35,"missingImage":false},{"type":"question","qid":"13504338","cat":"语句表达","stem":"①地球科学在寻找、开发和利用自然资源中起着巨大作用\n②还可以帮助人类与自然环境和谐共处\n③从应用性上来看，它为人类如何利用、保护自然提供了科学的方法论\n④并通过掌握自然灾害的规律与其作斗争\n⑤从理论性上来说，它承担着揭示自然界奥秘与规律的使命\n⑥地球科学是一门理论性、应用性都很强的自然科学\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"⑥⑤③①②④","B":"⑥③⑤①④②","C":"①②④⑥③⑤","D":"①④②⑥③⑤"},"answer":"A","explanation":"对比选项，确定首句。⑥句通过下定义的方式引出“地球科学”的话题，①句介绍地球科学的巨大作用，根据行文逻辑，应先下定义引出话题再描述具体作用，因此⑥句更适合作首句，排除C、D两项。\n对比A、B两项，⑥句后所接句子分别为⑤句和③句。③句从“应用性”的角度对地球科学进行解释，⑤句从“理论性”的角度对地球科学进行解释，根据⑥句中“地球科学是一门理论性、应用性都很强的自然科学”可知，应先说“理论性”，再介绍“应用性”，故⑤句应在③句之前，排除B项，锁定A项。\n故正确答案为A。","no":36,"missingImage":false},{"type":"question","qid":"13504360","cat":"语句表达","stem":"①研究方法是指在研究中发现新现象、新事物，或提出新理论、新观点，揭示事物内在规律的工具和手段，是论文中不可或缺的部分\n②学习了一种方法就相当于掌握了解决某一特定问题的一件工具，掌握的工具越多，解决问题的方法越多，研究能力也就越强\n③“工欲善其事，必先利其器”，如果“事”属于学术研究，“器”便是研究方法\n④在论文写作过程中，研究方法是十分重要的部分，撰写论文不仅要规范格式，写好综述，尤其还要掌握常用的研究方法\n⑤能否做好学术研究，取决于是否使用了正确的、合适的研究方法\n⑥它解释了研究如何进行以及数据来源、数据收集技术的使用等问题\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"①③⑤②④⑥","B":"②③①⑤⑥④","C":"③①④⑥②⑤","D":"④⑤①⑥③②"},"answer":"D","explanation":"观察选项，判断首句。①句介绍研究方法是什么，并指出其对论文的重要性，②句介绍学习、掌握研究方法后带来的意义，③句指出“器”是研究方法，④句通过“尤其”强调研究方法对论文的重要性，①句、③句和④句均可以引出“研究方法”这一话题，按照逻辑顺序，应先引出“研究方法”的话题，再介绍掌握研究方法之后的意义，故②句应该放在①③④三句之后，排除A、B两项。\n继续观察发现，⑥句出现指代词“它”，可以考虑通过指代词捆绑解题。对比④⑥句、①⑥句，①句具体介绍研究方法的定义，指出研究方法是发现新现象，揭示事物内在规律的工具，⑥句中“研究如何进行以及数据来源、数据收集技术的使用”是对研究方法是论文写作工具的进一步说明，话题一致且内容衔接得当，④句指出在论文写作过程中要掌握常用的研究方法，与⑥句内容无法衔接，排除C项。\n故正确答案为D。\n【文段出处】微信公众号北体新传《2023年体育新闻传播研究方法与论文写作工作坊》","no":37,"missingImage":false},{"type":"question","qid":"13504348","cat":"片段阅读","stem":"传统文博展示方式受场地空间、展览时间、文物特性等因素影响，限制了传播力与影响力的进一步提升，很难满足海量游人参观体验的需求。为此，可善用人工智能、虚拟现实等先进技术，推动文博展陈与文创产品数字化、沉浸式转化。比如，近期成立的全国博物馆文创联盟、博物馆策展联盟等平台，正以创新方式探索文博行业发展的新路径，带动中小型博物馆深度挖掘文物背后的故事，并运用新技术打破时空壁垒，以数字化方式让万千文博展品走进大众生活。\n这段文字意在说明，文博展陈应：","options":{"A":"拓展多空间，善用新技术","B":"活化老文物，挖掘新共鸣","C":"传承古智慧，融合新媒体","D":"展现历史美，利用新视角"},"answer":"A","explanation":"文段首先指出传统文博展示方式难以满足游人参观体验需求的问题，接着通过“为此”提出善用先进技术推动文博展陈与文创产品数字化、沉浸式转化这一对策，最后通过“比如”进行举例论证，故文段重点强调“为此”之后的对策，即善用先进技术推动文博展陈的发展，A项能够体现文段重点“善用先进技术”，当选。\nB项“新共鸣”、C项“新媒体”、D项“新视角”均偏离主题词“先进技术”，排除。\n故正确答案为A。\n【文段出处】中国经济网《展创结合让文物活起来》","no":38,"missingImage":false},{"type":"question","qid":"13504362","cat":"片段阅读","stem":"在机场过安检时，有时会遇到这样的情景：安检人员用一张白色的小纸片在你的手提行李、电子设备，甚至你的衣服上擦拭一遍，再将试纸放入一旁的仪器中。这张白色的小纸片其实是一种专门设计的爆炸物痕量检测纸，用于探测行李或物品表面是否残留有爆炸物的痕迹。它的使用起源于对航空安全的严格要求，尤其是在现代航空业面对的恐怖主义威胁日益增多的背景下，痕量检测技术已成为机场安检系统中的重要组成部分。\n这段文字接下来最不可能谈及的是：","options":{"A":"爆炸物痕量检测纸的工作原理","B":"安检中使用痕量检测纸的利弊","C":"机场采用痕量检测技术的背景","D":"候机楼发现爆炸物的处置程序"},"answer":"D","explanation":"本题为接语选择题，需通读全文，重点把握文段最后讨论的核心话题。文段开篇描述机场安检人员使用爆炸物痕量检测纸的情景，接着介绍其用途、使用起源，最后强调痕量检测技术在机场安检系统的重要性。故文段接下来应重点围绕痕量检测技术在安检中的相关内容展开。\nA项，文段描述了痕量检测纸的用途，但并未深入解释其工作原理，此项与文段话题紧密相关，排除；\nB项，文段探讨了痕量检测技术的重要性，但并未提及其弊端，探讨其利弊是合理延伸，排除；\nC项，“机场采用痕量检测技术的背景”与尾句“背景”相关，接下来有可能展开探讨，排除；\nD项，与文段最后谈论的核心话题不符，接下来最不可能谈及，当选。\n本题为选非题，故正确答案为D。\n【文段出处】科普中国《坐飞机过安检时擦的小纸片是什么？》","no":39,"missingImage":false},{"type":"question","qid":"13504343","cat":"语句表达","stem":"郑和大航海发生在中国军事科技实力遥遥领先的背景下，郑和率领两百余艘船、两万多名将士的大舰队，实力远超大航海时代两三艘船、百余人的小船队，军事实力更是远超途经的国家和地区，但郑和船队坚持“共享太平之福”“敦睦邦交”“强不凌弱”的原则，奉行“厚往薄来”的政策，从来没有以大欺小，倚强凌弱，没有掠夺一两黄金白银，没有发动一场军事侵略，也没有占领一寸海外殖民地。“郑和大航海”                    。\n填入画横线部分最恰当的一项是：","options":{"A":"在中外交流交往中发挥了积极的作用","B":"为中国的发展创造了稳定的国际环境","C":"是中华民族一脉相承的和平基因的最好例证","D":"为推动构建海洋命运共同体提供了中国方案"},"answer":"C","explanation":"横线位于文段结尾，需结合前文内容进行分析。文段开篇点明郑和大航海所处背景是中国军事科技实力遥遥领先的时候，郑和船队实力远超同时代其他船队。随后通过转折词“但”指出郑和船队始终秉持“共享太平之福”“敦睦邦交”“强不凌弱”的原则，奉行“厚往薄来”的政策，在航海过程中未进行掠夺、侵略和占领。这些行为充分彰显了和平友好的特质。故文段最后应进行总结，表明“郑和大航海”所展现的和平理念，对应C项。\nA项，“在中外交流交往中发挥了积极的作用”偏离文段核心话题，文段重点强调的是郑和大航海过程中展现的和平理念，而非其在中外交流交往中的积极作用，排除；\nB项，“为中国的发展创造了稳定的国际环境”无中生有，文段并没有表明中国因郑和大航海而获得了怎样稳定的国际环境，排除；\nD项，“海洋命运共同体”是现代概念，文段围绕的是郑和大航海时期的和平行为，与文段时代背景不符，排除。\n故正确答案为C。\n【文段出处】光明网《向世界讲好“郑和大航海”故事》","no":40,"missingImage":false},{"type":"question","qid":"13504325","cat":"片段阅读","stem":"免疫系统包含三大防线，皮肤、黏膜作为免疫系统的第一道防线，会阻止所有病毒或细菌的进入。当病毒或细菌已经侵入到人的身体时，巨噬细胞率先开始发挥作用。巨噬细胞能把外来异物如病毒或细菌吞入，靠内部的酶和各种活性物质杀死它们或者使其降解。当侵入人体的病毒或细菌数量过大时，巨噬细胞会释放化学信号，这时免疫系统的“保安”——白细胞能通过变形而穿过毛细血管壁，聚集到病菌入侵部位，将其包围、吞噬。\n这段文字意在说明：","options":{"A":"巨噬细胞的工作机制","B":"免疫系统如何抵御病菌","C":"白细胞具有包围、吞噬病菌的作用","D":"皮肤、黏膜是免疫系统的第一道防线"},"answer":"B","explanation":"文段开篇介绍免疫系统有三大防线，接着论述第一道防线会阻止所有病毒或细菌的进入，之后指出当病毒或细菌侵入人体后，巨噬细胞先开始发挥作用，最后论述当侵入人体的病毒或细菌数量过大时，白细胞会将病菌包围和吞噬，故文段为三方面的并列结构，详细介绍了免疫系统抵御病菌的三道防线，对应B项。\nA项“巨噬细胞”、C项“白细胞”和D项“皮肤、黏膜”均为文段并列的一部分内容，表述片面，排除。\n故正确答案为B。\n【文段出处】光明日报《免疫系统是如何抵御病毒的》","no":41,"missingImage":false},{"type":"question","qid":"13504342","cat":"片段阅读","stem":"农耕时代生产与生活、人与自然的关系十分密切。人们或为了感恩大自然的恩赐，或为了庆祝辛苦劳作换来的收获，或为了激发生命的活力，或为了加强人际的亲情，经过长期相互认同，最终约定俗成，渐渐把一年中某一天确定为节日，并创造了十分完整又严格的节俗，如仪式、庆典、规制、禁忌，乃至特定的游艺、装饰与食品，来把节日这天演化成一个内涵独特、氛围迷人的日子。\n这段文字意在说明：","options":{"A":"节日的内涵","B":"节日的形成","C":"节俗的意义","D":"节俗的创造"},"answer":"B","explanation":"文段开篇介绍农耕时代生产与生活、人和自然关系密切，随后指出人们因感恩自然、庆祝收获等原因，经过长期相互认同，最终约定俗成将一年中的某一天定为节日，后文举例说明节日中的一些习俗，并指出节俗让节日更有内涵和氛围，故文段重在说明节日是如何形成的，对应B项。\nA项，“节日的内涵”文段并未提及，无中生有，排除；\nC项，文段重点强调节日的形成，“节俗的意义”非重点，排除；\nD项，“节俗的创造”仅为节日形成过程中的一部分，表述片面，排除。\n故正确答案为B。\n【文段出处】天津市老教授协会《冯骥才：我们为什么要过节》","no":42,"missingImage":false},{"type":"question","qid":"13504352","cat":"片段阅读","stem":"近年来，相关地区依托长城保护修复实践基地，将长城保护工作重心由一般性保护工程向研究性修缮项目转变。与以往修缮过程中各专业技术人员作业相对分离不同，研究性修缮从工程启动便形成协同模式：以考古挖掘为开端，多学科研究为手段，数字化跟踪记录为保障，考古、设计、勘察、施工等人员在前期研究与勘察、设计方案制定、施工执行、成果整理等各环节协同配合，形成全专业全周期的合作。\n最适合做这段文字标题的是：","options":{"A":"研究性修缮：考古保护新范式","B":"研究性修缮如何进行多学科协同","C":"长城保护：研究性修缮的协同新模式","D":"研究性修缮揭开长城科学保护的细节"},"answer":"C","explanation":"文段开篇介绍长城保护工作重心由一般性保护工程向研究性修缮项目转变，接着指出与以往的修缮过程不同，研究性修缮项目注重形成协同模式，后文具体描述协同的各个环节，故文段重在强调研究性修缮项目注重以协同模式开展长城保护工作，对应C项。\nA项，“考古保护”范围扩大，文段强调的是“长城保护”，排除；\nB项，未包含主题词“长城保护”，排除；\nD项，偏离文段核心话题“协同模式”，且“长城科学保护的细节”无中生有，排除。\n故正确答案为C。\n【文段出处】人民日报《研究性修缮助力长城保护（新知）》","no":43,"missingImage":false},{"type":"question","qid":"13504326","cat":"片段阅读","stem":"西北太平洋台风主要形成于菲律宾以东的西北太平洋海域。这片海域全年温暖湿润，尤其是在夏季和秋季，海水温度升高，空气湿度加大，为台风的生成提供了充足能量。因此，西北太平洋成为全球台风生成最为活跃的区域之一。通常情况下，西北太平洋台风生成后沿西北方向移动，逐步影响中国、菲律宾、日本等国家。相比之下，南海被众多岛屿和大陆环抱，为台风活动提供了一个独特的舞台。由于位于热带和副热带气候带之间，南海夏季海温同样较高，这为台风的生成提供了充足的能量。而季风活动对南海台风的生成和发展有重要影响，使其具有明显的季节性和区域性特点。\n这段文字未提及的是：","options":{"A":"西北太平洋台风的影响范围","B":"南海台风与季风活动的关系","C":"南海台风的路径变化特点","D":"地形在台风形成中的作用"},"answer":"C","explanation":"A项，根据“通常情况下，西北太平洋台风生成后沿西北方向移动，逐步影响中国、菲律宾、日本等国家”可知，“影响范围”有所提及，排除；\nB项，根据“而季风活动对南海台风的生成和发展有重要影响，使其具有明显的季节性和区域性特点”可知，“南海台风与季风活动的关系”有所提及，排除；\nC项，文段中并未提及南海台风的路径变化特点，无中生有，当选；\nD项，根据“南海被众多岛屿和大陆环抱，为台风活动提供了一个独特的舞台”可知，“地形在台风形成中的作用”有所提及，排除。\n本题为选非题，故正确答案为C。\n【文段出处】中国气象报社《生于海上，几多风雨？——谈谈台风的认知误区》","no":44,"missingImage":false}],"count":26,"answerable":26,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"13504397","cat":"数学运算","stem":"某产品甲、乙两个经销商第一季度销售总额为200万元。第二季度，甲、乙的销售额比第一季度分别高20%、25%，且甲的销售额比乙高44万元。问上半年甲的销售额比乙高多少万元？","options":{"A":"72","B":"76","C":"80","D":"84"},"answer":"D","explanation":"设甲第一季度销售额为a万元，则乙第一季度销售额为（200-a）万元，甲第二季度销售额为1.2a万元，乙第二季度销售额为1.25×（200-a）万元。根据题意可列式：1.2a-1.25×（200-a）=44，解得a=120，则甲第一季度销售额为120万元，乙第一季度销售额为200-120=80万元。故甲第一季度销售额比乙高120-80=40万元，根据题干甲第二季度销售额比乙高44万元，因此上半年甲的销售额比乙高40+44=84万元。\n故正确答案为D。","no":45,"missingImage":false},{"type":"question","qid":"13504316","cat":"数学运算","stem":"某购物平台推出每消费600元立减50元的活动，钟先生在该平台准备购买单价为500元的某款商品不超过10件，问他购买几件时平均每件的购买成本最低？","options":{"A":"5","B":"6","C":"8","D":"9"},"answer":"B","explanation":"方法一：根据题意，由于“每消费600元立减50元”，故要想平均每件的购买成本最低，则应让购买总价刚好为600的倍数。因为购买商品单价为500元，因此购买总价也应为500的倍数。故购买总价既是600的倍数又是500的倍数，则其应为600和500最小公倍数（3000）的倍数。因为购买件数不超过10件，所以购买总价不超过500×10=5000元，则当购买总价为3000元时，即购买\u003cimg data-k=\"1c900ab3b996\">件商品时，此时平均每件成本最低。\n方法二：根据每消费600元立减50元，代入选项进行分析：\n代入A项：若购买5件，则总价为500×5=2500元，\u003cimg data-k=\"bc34a7dd740b\">······100，故可享受优惠50×4=200元，平均每件商品享受优惠\u003cimg data-k=\"f24278d58bf1\">元；\n代入B项：若购买6件，则总价为500×6=3000元，\u003cimg data-k=\"a93cb872f0d1\">，故可享受优惠50×5=250元，平均每件商品享受优惠\u003cimg data-k=\"1c29bc83afe3\">元；\n代入C项：若购买8件，则总价为500×8=4000元，\u003cimg data-k=\"e6a8026c44e0\">······400，故可享受优惠50×6=300元，平均每件商品享受优惠\u003cimg data-k=\"a534f40f61a4\">元；\n代入D项：若购买9件，则总价为500×9=4500元，\u003cimg data-k=\"9c3d7121b4a7\">······300，故可享受优惠50×7=350元，平均每件商品享受优惠\u003cimg data-k=\"7fb4457ac947\">元。\n综上，当购买6件时，平均每件商品享受优惠最大，此时平均每件的购买成本最低。\n故正确答案为B。","no":46,"missingImage":false},{"type":"question","qid":"13504262","cat":"数学运算","stem":"某公司搬家需打包运走电脑主机和显示器各n台。有两种打包方式：一种是一箱装入6台主机和4台显示器，另一种是一箱装入3台主机和8台显示器。已知公司所有的电脑主机和显示器正好装满若干箱，问n可能的最小值为：","options":{"A":"18","B":"24","C":"30","D":"36"},"answer":"D","explanation":"设第一种打包方式装满a箱，第二种打包方式装满b箱。根据电脑主机和显示器各有n台，可得：n=6a+3b=4a+8b，解得a=2.5b，代入可得n=18b。因为a、b均为箱子的数量，必须为正整数，故b取最小值2时，n取最小值为36。\n故正确答案为D。","no":47,"missingImage":false},{"type":"question","qid":"13504267","cat":"数学运算","stem":"某公司甲部门男性员工比女性多2人，乙部门女性员工比男性多3人。已知甲、乙两部门女性员工共6人，问从甲、乙两部门中随机选出4人，恰好选到2名男员工和2名女员工的概率是：","options":{"A":"\u003cimg data-k=\"bd36d3dedbc7\">","B":"\u003cimg data-k=\"bba9dc514227\">","C":"\u003cimg data-k=\"43e1b1b62b35\">","D":"\u003cimg data-k=\"4732320a37ea\">"},"answer":"B","explanation":"设甲部门女性员工为x人，则甲部门男性员工有（x+2）人；乙部门女性员工有（6-x）人；乙部门男性员工有（6-x）-3=（3-x）人；甲、乙两个部门共有男性员工（x+2）+（3-x）=5人。\n根据公式：概率\u003cimg data-k=\"ac77862681f7\">，分析如下：\n甲、乙两个部门共有5+6=11名员工，从中随机选出4人，总情况数\u003cimg data-k=\"23a0edfb4cfc\">种。\n要求选出的4名员工恰好为2名男员工和2名女员工：从5名男员工中随机选出2名，有\u003cimg data-k=\"81e47d1198cd\">种情况；从6名女员工中随机选出2名，有\u003cimg data-k=\"b3dd874582bf\">种情况。则满足要求的情况数为\u003cimg data-k=\"24e16bbd6e55\">种。\n综上，所求概率\u003cimg data-k=\"86d877485d04\">。\n故正确答案为B。","no":48,"missingImage":false},{"type":"question","qid":"13504282","cat":"数学运算","stem":"小张和小赵分别从甲、乙两地同时出发前往对方的出发地。小张出发时的速度是小赵的一半，两人匀速行进1小时后迎面相遇。此后小张开始均匀加速，最终比小赵晚到达1小时。问小张到达时的速度是小赵到达时速度的多少倍？","options":{"A":"\u003cimg data-k=\"89507e97188a\">","B":"\u003cimg data-k=\"5d23fa8046e3\">","C":"\u003cimg data-k=\"7dc7ea6810bf\">","D":"\u003cimg data-k=\"6a0a1ba817b7\">"},"answer":"C","explanation":"根据题意，赋值小赵出发时每小时的速度为2，则小张出发时每小时的速度为1。两人同时从甲、乙两地出发，1小时后相遇，根据相遇公式：\u003cimg data-k=\"c0379b2c5bb1\">，可得\u003cimg data-k=\"e034378b2f4f\">。小赵从乙地到甲地全程用时为\u003cimg data-k=\"e4c71577d6f7\">小时，则小张从甲地到乙地全程用时为1.5+1=2.5小时。小张从相遇后到达乙地用时为2.5-1=1.5小时，小张从相遇后到达乙地距离等于小赵1小时行进距离=2×1=2，则小张从相遇后到达乙地的平均速度为\u003cimg data-k=\"3457c06de5d5\">。根据公式：均匀加速运动的平均速度\u003cimg data-k=\"740a716c14f6\">，可列式\u003cimg data-k=\"0ebcef6d9037\">，解得小张达到乙地时的速度为\u003cimg data-k=\"64c90f9dd0ba\">，则小张到达时的速度是小赵到达时速度的\u003cimg data-k=\"59d988bd58c3\">倍。\n故正确答案为C。","no":49,"missingImage":false},{"type":"question","qid":"13504289","cat":"数学运算","stem":"甲乙两部门组织户外团建，共设A、B、C三项活动。甲部门每人三项活动均参加1次，乙部门每人任选2项不同活动各参加1次。已知A、B、C三项活动分别有18人、16人、15人参加，问甲部门成员至多有多少人?","options":{"A":"11","B":"12","C":"13","D":"14"},"answer":"C","explanation":"解法一：A、B、C三项活动参加的总人次为18+16+15=49，设甲部门为x人，乙部门为y人。根据题意，可得方程3x+2y=49，根据奇偶特性，可得x为奇数，排除B、D两项；根据问题“至多有多少人”，优先代入C项，解得y=5，符合题意，当选。\n解法二：根据问题“至多”，可通过选项从大到小依次代入验证：\n代入D项：甲部门14人，根据甲部门每人三项活动均参加1次，即A、B、C三项活动分别剩下4、2、1人次，4+2+1=7人次，奇数不能让乙部门每人任选2项不同活动各参加1次，排除；\n代入C项：甲部门13人，根据甲部门每人三项活动
