ngImage":false},{"type":"question","qid":"4818054","cat":"类比推理","stem":"连理枝：玫瑰","options":{"A":"梧桐雨：明月","B":"丁香结：鸿雁","C":"昆山玉：松柏","D":"杨柳枝：长亭"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n连理枝与玫瑰都可以用来象征爱情，具有相同的象征义。\n第二步：判断选项词语间逻辑关系。\nA项：梧桐雨象征坚贞不渝的爱情，明月象征思乡之情，与题干逻辑关系不一致，排除；\nB项：丁香结象征生活中解不开的愁怨，鸿雁比喻书信和传递书信的人，与题干逻辑关系不一致，排除；\nC项：昆山玉象征人才，松柏象征坚贞，与题干逻辑关系不一致，排除；\nD项：杨柳枝与长亭都是象征离别，与题干逻辑关系一致，当选。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"4818044","cat":"类比推理","stem":"化险为夷：转危为安","options":{"A":"异曲同工：深入浅出","B":"承前启后：继往开来","C":"除旧布新：空前绝后","D":"畏首畏尾：瞻前顾后"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n化险为夷，指的是使危险的处境或者情况变为平安。转危为安，指的是从危险转为平安。两者是近义关系，且两者皆为褒义词。\n第二步：判断选项词语间逻辑关系。\nA项：异曲同工，也说同工异曲，指曲调虽然不同，却都同样美妙，后比喻不同的说法或做法都收到同样的效果。深入浅出，指讲话或文章的内容深刻，语言文字却浅显易懂。两者不是近义关系，与题干逻辑关系不一致，排除；\nB项：承前启后，指承接过去的，开创未来的，继承前人事业，为后人开辟道路。继往开来，指继承前人的事业，并为将来开辟道路。两者是近义关系，且两者均含褒义词性，与题干逻辑关系一致，当选；\nC项：除旧布新，指除去旧的，建立新的。空前绝后，指从前没有过，此后也不会有，多用来形容某种成就或盛况，带有夸张赞叹的意味。两者不是近义关系，与题干逻辑关系不一致，排除；\nD项：畏首畏尾，指前也怕，后也怕，比喻胆小、做事顾虑重重。瞻前顾后，指看看前面再看看后面，形容做事谨慎，考虑周密，也形容顾虑太多，犹豫不决。两者是近义关系，但是畏首畏尾是贬义词，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":87,"missingImage":false},{"type":"question","qid":"4817887","cat":"类比推理","stem":"开水瓶：保温","options":{"A":"密码锁：加密","B":"体温计：测温","C":"热水器：洗澡","D":"保险箱：安全"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n开水瓶的功能是保温，二者是功能对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：密码锁的功能是防盗，具有加密的属性，二者不是功能对应关系，与题干逻辑关系不一致，排除；\nB项：体温计的功能是测温，二者是功能对应关系，与题干逻辑关系一致，当选；\nC项：热水器的功能是加热，不是洗澡，二者不是功能对应关系，与题干逻辑关系不一致，排除；\nD项：保险箱的功能是防火防盗，具有安全性，二者不是功能对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":88,"missingImage":false},{"type":"question","qid":"4817947","cat":"逻辑判断","stem":"鹬蚌相争，渔翁得利","options":{"A":"兼听则明，偏信则暗","B":"塞翁失马，焉知非福","C":"户枢不蠹，流水不腐","D":"城门失火，殃及池鱼"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n鹬蚌相争，渔翁得利，比喻双方争执不下，两败俱伤，让第三者占了便宜。鹬蚌相争为因，渔翁得利为果，二者为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：兼听则明，偏信则暗，指听取双方或多方面的意见就能明辨是非，只相信单方面的话，必然会犯片面性的错误。二者均单独存在因果对应关系，但二者之间为并列关系，与题干逻辑关系不一致，排除；\nB项：塞翁失马，焉知非福，比喻一时虽然受到损失，反而因此能得到好处。二者间无明显逻辑关系，与题干逻辑关系不一致，排除；\nC项：户枢不蠹，流水不腐，指经常转动的门轴不会被虫蛀，流动的水不会腐臭，比喻经常运动的东西不易受腐蚀，二者为并列关系，与题干逻辑关系不一致，排除；\nD项：城门失火，殃及池鱼，指城门着了火，大家都用护城河的水救火，水用尽了，鱼也就干死了，比喻因牵连而受祸患或损失。城门失火为因，殃及池鱼为果，二者为因果对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":89,"missingImage":false},{"type":"question","qid":"4818276","cat":"类比推理","stem":"刷脸支付：人脸识别：人工智能","options":{"A":"自动驾驶：环保汽车：清洁能源","B":"语音助手：翻译软件：5G网络","C":"山地车：自行车：滑板车","D":"网络家电：智能家居：物联技术"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n刷脸支付需要用到人脸识别技术，二者为对应关系，人脸识别需要用到人工智能技术，二者为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：自动驾驶与环保汽车之间没有明显的逻辑关系，与题干逻辑关系不一致，排除；\nB项：语音助手可能需要使用翻译软件，翻译软件可能需要使用5G网络，二者为对应关系，但均为可能性的需要，与题干逻辑关系不一致，排除；\nC项：山地车是自行车的一种，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：网络家电需要用到智能家居，二者为对应关系，智能家居需要用到物联技术，二者为对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":90,"missingImage":false},{"type":"question","qid":"4818059","cat":"类比推理","stem":"屈驾：赐教：斧正","options":{"A":"芳龄：寒舍：令堂","B":"敬候：光临：笑纳","C":"久仰：留步：拙见","D":"敢问：俯就：包涵"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“屈驾”是邀请人的敬词，“赐教”是请求对方给予指教的敬词，“斧正”是请别人修改文章的敬词，三个词语均为敬词，即都是对他人表示尊敬的礼貌用语， 为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：“芳龄”指女子的年龄，是敬词；“寒舍”指自己的家，是谦词；“令堂”指对别人母亲的尊称，是敬词，三个词语并非都是敬词，与题干逻辑关系不一致，排除；\nB项：“敬候”指恭敬地等候，是敬词；“光临”指含恭敬口吻地欢迎宾客到来，是敬词；“笑纳”指请人收下礼物，是敬词，三个词语都是敬词，为并列关系，与题干逻辑关系一致，当选；\nC项：“久仰”指仰慕他人已久，是敬词；“留步”指送客时客人辞让之语，是敬词；“拙见”指自己的见解，是谦词，三个词语并非都是敬词，与题干逻辑关系不一致，排除；\nD项：“敢问”指向对方提出问题，附带自谦的姿态，是谦词；“俯就”指请求别人同意担任某种职务，是敬词；“包涵”指请人原谅，是敬词，三个词语并非都是敬词，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":91,"missingImage":false},{"type":"question","qid":"4818464","cat":"类比推理","stem":"酉时：戌时：亥时","options":{"A":"立春：立秋：立冬","B":"颔联：颈联：尾联","C":"口琴：古琴：胡琴","D":"吴语：粤语：软语"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n地支是中国传统用作表示次序的符号，其包括：子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥，被称为“十二地支”。中国古代用十二地支纪时，将一日均分为十二个时段，“酉时”“戌时”“亥时”是“十二时辰”中的最后三个，三者是并列关系，且三者在十二地支纪时中排列紧密连续。\n第二步：判断选项词语间逻辑关系。\nA项：立春、立秋、立冬是我国二十四节气中的三个，三者是并列关系，但没有紧密相连，与题干逻辑关系不一致，排除；\nB项：律诗一共四联，一二句叫首联，三四句叫颔联，五六句叫颈联，七八句叫尾联。颔联、颈联、尾联分别是律诗的第二联、第三联、第四联，三者是并列关系，且在律诗中排列紧密连续，与题干逻辑关系一致，当选；\nC项：口琴、古琴、胡琴是三种不同的乐器，三者是并列关系，但三者在乐器中不存在排列关系，与题干逻辑关系不一致，排除；\nD项：吴语又称吴越语、江南话、江浙话，与粤语同为方言，二者是并列关系；软语指温和而委婉的话语，与前两者无关，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":92,"missingImage":false},{"type":"question","qid":"4818020","cat":"类比推理","stem":"五音：商：徵","options":{"A":"五经：易：乐","B":"五谷：麦：稷","C":"五金：金：铝","D":"五行：火：雷"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n五音指五声音阶，依次为宫、商、角、徵、羽。“商”和“徵”构成反对关系，二者分别和“五音”构成组成关系。\n第二步：判断选项词语间逻辑关系。\nA项：五经指《诗经》《尚书》《礼记》《周易》《春秋》，简称为“诗、书、礼、易、春秋”。“乐”指《乐经》，“五经”当中不包括“乐”，二者不构成组成关系，与题干逻辑关系不一致，排除；\nB项：五谷指五种谷物，古代有多种不同说法，最主要的有两种：一种指稻、黍、稷、麦、菽；另一种指麻、黍、稷、麦、菽。“麦”和“稷”构成反对关系，二者分别和“五谷”构成组成关系，与题干逻辑关系一致，当选；\nC项：五金指金、银、铜、铁、锡五种金属。“五金”当中不包括“铝”，二者不构成组成关系，与题干逻辑关系不一致，排除；\nD项：五行也叫五行学说，指金、木、水、火、土。“五行”当中不包括“雷”，二者不构成组成关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":93,"missingImage":false},{"type":"question","qid":"4818113","cat":"类比推理","stem":"银杏 对于 （    ） 相当于 （    ） 对于 黑管","options":{"A":"大乔木；克拉管","B":"五角枫；管乐器","C":"公孙木；单簧管","D":"中草药；双簧管"},"answer":"C","explanation":"逐一代入选项。\nA项：银杏是一种大乔木，二者为种属关系；克拉管又称黑管、单簧管，二者为全同关系，前后逻辑关系不一致，排除；\nB项：银杏和五角枫是不同的树木，二者为并列关系；黑管是管乐器的一种，二者为种属关系，前后逻辑关系不一致，排除；\nC项：银杏又称白果、公孙木、鸭掌树等等，二者为全同关系；单簧管又称克拉管、黑管，二者为全同关系，前后逻辑关系一致，当选；\nD项：银杏可以作为一种中草药，二者为种属关系；双簧管和黑管是两种不同的乐器，二者为并列关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"4818128","cat":"类比推理","stem":"安居乐业 对于 （    ） 相当于 （    ） 对于 抱残守缺","options":{"A":"安土重迁；墨守成规","B":"颠沛流离；革故鼎新","C":"丰衣足食；独辟蹊径","D":"背井离乡；推陈出新"},"answer":"D","explanation":"逐一代入选项。\nA项：安居乐业指人们生活美满的样子，比喻安定地生活，愉快地工作；安土重迁指在家乡住惯了，很不愿意搬迁，二者无明显逻辑关系。抱残守缺指守着残缺的东西不放，形容思想守旧，不知变革；墨守成规比喻固执地按老一套办，不求改进，二者是近义关系，前后逻辑关系不一致，排除；\nB项：安居乐业指人们生活美满的样子，比喻安定地生活，愉快地工作；颠沛流离形容生活穷困，到处流浪，二者是反义关系。抱残守缺指守着残缺的东西不放，形容思想守旧，不知变革；革故鼎新指革除旧弊，创立新制，二者是反义关系，前后逻辑关系一致，保留；\nC项：安居乐业指人们生活美满的样子，比喻安定地生活，愉快地工作；丰衣足食形容生活宽裕，二者都可以用来形容人民生活的美好，二者是近义关系。抱残守缺指守着残缺的东西不放，形容思想守旧，不知变革；独辟蹊径比喻独创一种全新的与人迥异的风格、手法，二者是反义关系，前后逻辑关系不一致，排除；\nD项：安居乐业指人们生活美满的样子，比喻安定地生活，愉快地工作；背井离乡常指被迫远离家乡到外地谋生，二者是反义关系。抱残守缺指守着残缺的东西不放，形容思想守旧，不知变革；推陈出新指事物的除旧更新，二者是反义关系，前后逻辑关系一致，保留。\n比较B、D两项，题干中的安居和乐业，抱残和守缺都是并列结构，B项中颠沛和流离不是并列结构，排除；D项中的背井和离乡，推陈和出新都是并列结构，当选。\n故正确答案为D。","no":95,"missingImage":false},{"type":"question","qid":"4818454","cat":"逻辑判断","stem":"一项最新研究指出，可以根据大脑血清素系统的变化提前20年发现帕金森病的早期发病征兆。在该跟踪研究中，研究人员招募了14名携带一种极为罕见的突变基因的志愿者。这些志愿者的这种突变基因几乎肯定会在他们一生中的某个阶段诱发帕金森病。研究人员表示，血清素系统功能是判断帕金森病前兆的一个很好指标，因为在尚未确诊的参与者体内发现了血清素系统的可检测变化。\n以下各项如果为真，最能支持上述研究的是：","options":{"A":"全球已知只有约100人携带这种突变基因","B":"医生可以在最常见的症状出现之前诊断出帕金森病","C":"研究人员指出，血清素系统变化是迄今发现的帕金森病最早信号","D":"因志愿者都携带有极罕见的突变基因，该研究结论无法覆盖其他患者"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：可以根据大脑血清素系统的变化提前20年发现帕金森病的早期发病征兆。\n论据：研究人员招募了14名携带一种极为罕见的突变基因的志愿者。这些志愿者的这种突变基因几乎肯定会在他们一生中的某个阶段诱发帕金森病。研究人员表示，血清素系统功能是判断帕金森病前兆的一个很好指标，因为在尚未确诊的参与者体内发现了血清素系统的可检测变化。\n本题的论点论据讨论的均为大脑血清素系统的变化与提前发现帕金森病早期发病征兆之间的关系，论点论据话题一致，优先考虑补充论据的形式进行加强。\n第二步：逐一分析选项。\nA项：该项指出全球已知只有约100人携带这种突变基因，有多少人携带这种突变基因与大脑血清素系统的变化是否可以提前发现帕金森病的早期发病征兆无关，无法加强，排除；\nB项：该项表明医生可以在最常见的症状出现之前诊断出帕金森病，医生可以诊断与大脑血清素系统的变化是否可以提前发现帕金森病的早期发病征兆无关，无法加强，排除；\nC项：该项指出血清素系统变化是帕金森病的最早的信号，说明血清素系统变化是最早的信号，确实能够提前发现帕金森病的早期发病征兆，补充论据，可以加强，当选；\nD项：该项指出研究中的志愿者均具有极罕见的突变基因，研究结果没有办法覆盖其他患者，说明此次研究的结果无法覆盖所有人，为削弱项，无法加强，排除。\n故正确答案为C。","no":96,"missingImage":false},{"type":"question","qid":"4818236","cat":"逻辑判断","stem":"研究发现，每天保持三顿正餐的时间表大致稳定，对于保持良好的身体状况非常重要，这是因为保持规律的用餐时间能够改善新陈代谢和身心状态，更具体地说，遵循并保持固定的饮食时间表与肥胖、代谢综合征、心血管疾病和情绪改善的风险降低有关，这种习惯也有利于我们自身生物钟的良好运行，从而使我们以良好的身心状态应对日常工作和生活。\n以下各项如果为真，最能支持上述研究的是：","options":{"A":"一些著名的医学家呼吁公众不仅要考虑每天的饮食健康和保持适当体育锻炼，还要注意饮食规律","B":"某生物医药研究中心去年发布的一项研究结果表明，周末不规律的饮食可能与体重指数的增加有关","C":"如果我们不经常参加体育运动，那么罹患II型糖尿病等代谢性疾病以及心血管疾病的风险就会有所增加","D":"当我们的用餐时间与正常时间相差三小时以上时，对体重指数的影响最大，而代谢性疾病与肥胖密不可分"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：每天保持三顿正餐的时间表大致稳定，对于保持良好的身体状况非常重要。\n论据：保持规律的用餐时间能够改善新陈代谢和身心状态，更具体地说，遵循并保持固定的饮食时间表与肥胖、代谢综合征、心血管疾病和情绪改善的风险降低有关，这种习惯也有利于我们自身生物钟的良好运行，从而使我们以良好的身心状态应对日常工作和生活。\n论点论据都在讨论的是保持规律的用餐时间和身体状况的关系，论点论据话题一致，加强考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是医学家呼吁要注意饮食规律，论点讨论的是三顿正餐时间稳定对于保持良好的身体状况是否重要，话题不一致，无法加强，排除；\nB项：该项说的是周末不规律的饮食可能与体重指数的增加有关，说明不规律饮食和身体状况有关系，可以加强，但是属于可能性加强，力度较弱，保留；\nC项：该项说的是不经常参加体育运动，罹患代谢性疾病和心血管疾病的风险会增加，论点讨论的是三顿正餐时间稳定对于保持良好的身体状况是否重要，话题不一致，无法加强，排除； \nD项：该项说的是用餐时间与正常时间相差三小时以上时，对体重指数的影响最大，补充论据说明三顿正餐的时间表稳定跟身体状况有关，保留。\n对比B、D两项，B项是可能性加强，D项是补充确定的论据，可能性加强力度较弱，D项当选。\n故正确答案为D。","no":97,"missingImage":false},{"type":"question","qid":"4818463","cat":"逻辑判断","stem":"某研究机构通过的一项实验证明喜欢阅读文学名著的人理解他人的能力更强。该实验让参与者阅读古典名著、通俗小说和纪实文学。然后进行一项“从眼睛中读懂别人心思\"的测试。结果发现，读名著的参与者更容易读懂别人的感情。研究者认为，文学名著更注重人物角色的刻画而不是情节的描述，从而要求读者对人物角色进行细致思考和推理，因此文学名著有助于人们更好地感知他人。\n以下各项如果为真，最能削弱上述结论的是：","options":{"A":"“从眼睛中读懂别人心思”测试本身的设计缺乏科学性","B":"相较于人物角色的刻画，许多文学名著更注重情节描述","C":"许多善解人意的人具有理工科背景，很少阅读文学名著","D":"另有研究证明，理解他人能力强的人更喜欢读科技著作"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：文学名著有助于人们更好地感知他人。\n论据：文学名著更注重人物角色的刻画而不是情节的描述，从而要求读者对人物角色进行细致思考和推理。\n论点和论据都提到了文学名著有助于人们更好地理解、感知他人，所以讨论的话题是一致的，削弱优先考虑否论点，其次可以考虑否论据。\n第二步：逐一分析选项。\nA项：提到测试本身缺少科学性，说明测试可能存在一些问题，可以削弱，保留；\nB项：许多文学名著更注重情节描述而非角色刻画，举例削弱论据，可以削弱，保留；\nC项：许多善解人意的人很少阅读文学名著无法说明文学名著能否帮助人们更好地感知他人，无关项，无法削弱，排除；\nD项：理解他人能力强的人更喜欢读科技著作，说的是能力强后喜欢做什么，而论点讨论的是文学名著对于感知他人的作用，话题不一致，无关项，无法削弱，排除。\n比较A、B两项，A项说明测试设计缺乏科学性，但未明确说明设计缺陷对实验结果的影响，而B项直接削弱题干论据，力度更强，因此择优选B项。\n故正确答案为B。","no":98,"missingImage":false},{"type":"question","qid":"4818186","cat":"逻辑判断","stem":"有学者指出：在经济新常态背景下，我国“特殊逆城镇化”现象正大量发生，即在城镇化总体上尚未完成人口由乡村向城市集中的阶段和郊区化阶段的时候，“逆城镇化”现象已经开始涌现，在特有制度约束下形成“走入乡村”“走向小城”的人口活动趋势，并且，这一趋势预示着未来的发展潮流。\n以下各项如果为真，不能支持上述学者观点的是：","options":{"A":"近年来，异地养老是许多老年人改善生活品质的自发选择，城市老年人结伙搭伴到农村养老，成为一种潮流","B":"进城农民工、大中专毕业生、退役士兵和科技人员等返乡下乡创业和就业，推动了农村一二三产业融合发展","C":"城市居民到城镇、乡村长期居住，带动当地重新繁荣，在部分乡村出现一些来自全国各地不同人们的聚居点","D":"据某研究机构不完全统计，城市居民平均每人每年深入农村体验生活3次，大大促进了农村的经济社会发展"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：在经济新常态背景下，我国“特殊逆城镇化”现象正大量发生，并且这一趋势预示着未来的发展潮流。\n论据：无。\n本题只有论点，没有论据，优先考虑补充论据的方式进行加强。\n第二步：逐一分析选项。\nA项：该项说的是近年来城市老年人结伙搭伴到农村养老成为一种潮流，举例子说明“特殊逆城镇化”正在发生，可以加强，排除；\nB项：该项说的是部分人群返乡下乡创业和就业，推动了农村产业发展，举例子说明“特殊逆城镇化”正在发生，可以加强，排除；\nC项：该项说的是城市居民到城镇、乡村长期居住，使得部分乡村出现一些来自全国各地不同人们的聚居点，举例子说明“特殊逆城镇化”正在发生，可以加强，排除；\nD项：该项说的是城市居民每年深入农村体验生活会促进农村的经济社会发展，但城市居民只是去农村游玩，与论点所说的“特殊逆城镇化”现象无关，为无关项，无法加强，当选。\n本题为选非题，故正确答案为D。","no":99,"missingImage":false},{"type":"question","qid":"4818205","cat":"逻辑判断","stem":"俗话说：吃饭不吃蒜，香味少一半；吃肉不吃蒜，营养减一半。然而，某养生专家却说：“大蒜炝锅致癌”。因为大蒜在炝锅时，其所含氨基酸和糖类在高温烹调过程中会发生“美拉德反应”，从而产生丙烯酰胺。如果大蒜切的越薄、受热温度越高、受热时间越长，烹调时的“美拉德反应”就会越剧烈，产生的丙烯酰胺也就越多。丙烯酰胺属于2A级致癌物。\n以下各项如果为真，最能削弱上述结论的是：","options":{"A":"对健康饮食的重视使大部分人很少采用炝锅的方式烹饪","B":"高温的煎炸和漂烫会对大蒜素产生破坏损失大蒜的营养","C":"所谓的2A级致癌物是指对人类致癌性证据有限的物质","D":"丙烯酰胺致癌临界点为短时间内使用炝锅蒜32.7公斤"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：大蒜炝锅致癌。\n论据：大蒜在炝锅时，其所含氨基酸和糖类在高温烹调过程中会发生“美拉德反应”，从而产生丙烯酰胺。如果大蒜切的越薄、受热温度越高、受热时间越长，烹调时的“美拉德反应”就会越剧烈，产生的丙烯酰胺也就越多，丙烯酰胺是致癌物。\n本题论点说的是大蒜炝锅致癌，论据说的是大蒜在高温烹调时会产生致癌物丙烯酰胺，不能脱离致癌物的“数量”谈致癌的“效果”，故可以通过“数量”进行拆桥。\n第二步：逐一分析选项。\nA项：指出重视健康饮食使大部分人很少采用炝锅的方式烹饪，与大蒜炝锅能否致癌无关，无法削弱，排除；\nB项：指出高温烹饪会对大蒜素产生破坏，而论点讨论的是大蒜炝锅能否致癌，话题不一致，无法削弱，排除；\nC项：指出2A级致癌物是指对人类致癌性证据有限的物质，致癌性证据有限不代表不能致癌，因此不明确丙烯酰胺能否致癌，不明确选项，无法削弱，排除；\nD项：指出丙烯酰胺致癌临界点为短时间内使用炝锅蒜32.7公斤，说明炝锅使用的大蒜要超过32.7公斤才能致癌，而日常炝锅使用的大蒜远低于这个量，即通过不现实的数量拆掉丙烯酰胺与致癌之间的关系，拆桥项，当选。\n故正确答案为D。","no":100,"missingImage":false},{"type":"question","qid":"4818462","cat":"逻辑判断","stem":"研究表明，我们口腔中大约有700种细菌驻扎，其中12种被认为是“坏细菌”，也就是致病细菌。在已知引起和发展牙周炎的所有细菌种类中，有一种叫牙龈卟啉单胞菌的细菌，它是一种主要的牙周病原体，也是臭名昭著的“免疫逃避大王”，极具侵略性。某研究发现，感染牙龈卟啉单胞菌的动物模型显示出海马体损伤。海马体是与记忆最相关的大脑区域。\n由此可以推出：","options":{"A":"加强口腔健康就能改善大脑记忆功能","B":"从口腔到大脑的病程过渡始于牙周炎的发展","C":"没有口腔问题的人都不太可能出现思维问题或痴呆","D":"患严重牙周炎的人患认知障碍或痴呆症的风险较大"},"answer":"D","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干指出感染牙龈卟啉单胞菌的动物模型显示出与记忆最相关的海马体损伤，即口腔不健康会对记忆有消极影响，但并没有涉及加强口腔健康是否能改善大脑记忆功能，无中生有，排除；\nB项：题干并没有涉及从口腔到大脑的病程过渡开始于哪里，无中生有，排除；\nC项：题干指出感染牙龈卟啉单胞菌的动物模型显示出与记忆最相关的海马体损伤，即口腔不健康会对记忆有消极影响，但没有涉及没有口腔问题的人是否出现思维问题或痴呆，无中生有，排除；\nD项：题干指出感染牙龈卟啉单胞菌的动物模型显示出与记忆最相关的海马体损伤，而牙龈卟啉单胞菌是引起和发展牙周炎的主要牙周病原体，可以推出当牙周炎严重时感染牙龈卟啉单胞菌较为严重，从而对海马体损伤较为严重，即记忆可能受损，最后患认知障碍或痴呆症的风险较大，可以推出，当选。\n故正确答案为D。","no":101,"missingImage":false},{"type":"question","qid":"4818027","cat":"定义判断","stem":"人们在唱歌时身体会发生一系列变化，如压力荷尔蒙水平下降以及内啡肽水平变化等，而内啡肽荷尔蒙会直接影响个人情绪的变化。科学研究还发现，脑部血流量增加会显著提升老年痴呆症患者的记忆能力。生活中许多人喜欢音乐和唱歌，不要小看这一爱好，因为越来越多的研究发现，唱歌可以帮助患有老年痴呆症的人更好地克服记忆障碍。\n以下各项如果为真，属于上述结论必要前提的是：","options":{"A":"唱歌会显著改善患有肺部疾病的患者的呼吸","B":"患有老年痴呆症的人比其他老年人更加喜爱唱歌","C":"参加集体合唱可以帮助人们提升自我价值和自信心","D":"老年痴呆症病人在唱歌时大脑皮质区的血流量会显著增加"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：唱歌可以帮助患有老年痴呆症的人更好地克服记忆障碍。\n论据：脑部血流量增加会显著提升老年痴呆症患者的记忆能力。\n本题论点讨论的是唱歌与老年痴呆症患者记忆的关系，论据讨论的是脑部血流量增加与老年痴呆症患者记忆的关系，论点论据话题不一致，加强优先考虑搭桥，即建立“唱歌”和“脑部血流量增加”的联系。\n第二步：逐一分析选项。\nA项：该项说的是唱歌可以改善患有肺部疾病患者的呼吸，而论点讨论的是唱歌对老年痴呆症患者记忆力的影响，话题不一致，无法加强，排除；\nB项：该项说的是老年痴呆症患者比其他老年人更喜欢唱歌，没有体现出唱歌对老年痴呆症患者记忆力的影响，无关选项，无法加强，排除；\nC项：该项说的是参加合唱可以帮助提升自我价值和自信心，但没有说明自我价值和自信心的提升对记忆力的影响，与论点讨论的唱歌对老年痴呆症患者记忆力的影响无关，无法加强，排除；\nD项：该项说的是老年痴呆症患者在唱歌时大脑皮质区的血流量会增加，在“唱歌”和“脑部血流量增加”之间建立了联系，属于搭桥项，可以加强，当选。\n故正确答案为D。","no":102,"missingImage":false},{"type":"question","qid":"4818029","cat":"逻辑判断","stem":"在面向我国科技强国和现代化强国建设目标的背景下，要满足经济社会发展科技的要求，就要不断强化科技创新对经济社会发展的战略支撑。只有大力促进科技治理体系和治理能力现代化，才能充分发挥科技创新对经济社会发展的促进作用。\n由此可以推出：","options":{"A":"只要不断强化科技创新对经济社会发展的战略支撑，就能满足经济社会发展科技的要求","B":"如果不能满足经济社会发展科技的要求，就不能强化科技创新对经济社会发展的战略支撑","C":"如果不大力促进科技治理体系与治理能力现代化，就不能充分发挥科技创新对经济社会发展的促进作用","D":"除非充分发挥科技创新对经济社会发展的促进作用，否则不能大力促进科技治理体系与治理能力的现代化"},"answer":"C","explanation":"第一步：翻译题干。\n①满足经济社会发展科技的要求\u003cimg data-k=\"2dfb7d1f72f3\">不断强化科技创新对经济社会发展的战略支撑\n②充分发挥科技创新对经济社会发展的促进作用\u003cimg data-k=\"2dfb7d1f72f3\">大力促进科技治理体系和治理能力现代化\n第二步：逐一分析选项。\nA项：翻译为：不断强化科技创新对经济社会发展的战略支撑\u003cimg data-k=\"2dfb7d1f72f3\">满足经济社会发展科技的要求，是对①的肯后，但肯后得不到确定性结论，无法推出，排除；\nB项：翻译为：\u003cimg data-k=\"e752a8ae1a16\">满足经济社会发展科技的要求\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">强化科技创新对经济社会发展的战略支撑，是对①的否前，但否前得不到确定性结论，无法推出，排除；\nC项：翻译为：\u003cimg data-k=\"e752a8ae1a16\">大力促进科技治理体系与治理能力现代化\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">充分发挥科技创新对经济社会发展的促进作用，是对②的否后，否后必否前，可以推出，当选；\nD项：翻译为：大力促进科技治理体系与治理能力的现代化\u003cimg data-k=\"2dfb7d1f72f3\">充分发挥科技创新对经济社会发展的促进作用，是对②的肯后，但肯后得不到确定性结论，无法推出，排除。\n故正确答案为C。","no":103,"missingImage":false},{"type":"question","qid":"4818028","cat":"类比推理","stem":"球赛即将进入决赛阶段，五个球迷对决赛队伍做了预测。\n甲：如果法国无法进入决赛，那么意大利也不会进入决赛；\n乙：法国没戏，意大利会进决赛；\n丙：或者法国进入决赛，或者葡萄牙进入决赛；\n丁：法国和葡萄牙都不可能进入决赛；\n戊：意大利和葡萄牙进入了决赛。\n结果只有两个球迷预测错误，那么预测错误的球迷是：","options":{"A":"甲和丁","B":"甲和丙","C":"丙和戊","D":"丁和戊"},"answer":"A","explanation":"第一步：分析题干找关系。\n甲：\u003cimg data-k=\"e752a8ae1a16\">法国\u003cimg data-k=\"a3a13b026980\">意大利；\n乙：\u003cimg data-k=\"e752a8ae1a16\">法国 且 意大利；\n丙：法国 或 葡萄牙；\n丁：\u003cimg data-k=\"e752a8ae1a16\">法国 且 \u003cimg data-k=\"e752a8ae1a16\">葡萄牙；\n戊：意大利 且 葡萄牙。\n分析题干条件，甲与乙、丙与丁均为矛盾关系，均必有一真一假。\n第二步：看其余，根据题干推理。\n根据题干条件可知，只有两个球迷预测错误，说明五句话中有三句真话，两句假话，又因甲与乙、丙与丁均必有一真一假，故戊必然说真话，排除C、D两项；既然戊说真话，那么进入决赛的两支队伍为意大利和葡萄牙，即法国没有进入决赛，故乙和丙预测正确，可知甲和丁预测错误，A项当选。\n故正确答案为A。","no":104,"missingImage":false},{"type":"question","qid":"4818036","cat":"逻辑判断","stem":"某超市对甲和乙两种饮料进行特价促销，促销时间为周三到周六共4天。活动结束后发现，每天饮料销售数量均为整箱，甲饮料每天的销售量为1到4箱不等，乙饮料每天的销售量为1至5箱不等，且销售量还符合以下规律：\n①甲饮料每天销售的量并不相同，乙也如此\n②甲、乙销售数量总和随着日期推移每天增加1箱\n③星期三销售了3箱甲饮料，星期四销售了1箱甲饮料，星期六销售了5箱乙饮料\n由此可以推出：","options":{"A":"星期三甲、乙共销售了4箱","B":"星期四甲、乙共销售了6箱","C":"星期五甲、乙共销售了8箱","D":"星期六甲、乙共销售了10箱"},"answer":"A","explanation":"本题为组合排列题。题干涉及排序，可优先考虑列表。\n根据条件③可知：\n\u003cimg data-k=\"0dc86cbabeb0\" style=\"max-width:500px\">\n根据题干“甲饮料每天的销售量为整箱且为1到4箱不等”和条件①可知：周五、周六销售甲饮料的数量为2或4，有如下两种假设：\n假设一：\n\u003cimg data-k=\"6274997e52e9\" style=\"max-width:500px\">\n根据条件②，可知：周五甲、乙饮料销售数量总和为8，故周五乙饮料销售数量为6，与题干“乙饮料每天的销售量为1至5箱不等”矛盾，故此假设不成立；\n假设二：\n\u003cimg data-k=\"00a48f9ab891\" style=\"max-width:500px\">\n根据条件②，可知：周五甲、乙饮料销售数量总和为6，周四甲、乙饮料销售数量总和为5，周三甲、乙饮料销售数量总和为4，故此时乙饮料周三至周五的销售量如下：\n\u003cimg data-k=\"78fab34f456a\" style=\"max-width:500px\">\n此时符合题干全部条件。\n故正确答案为A。","no":105,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"4173e2f2848c\" style=\"max-width:700px\">\u003c/p>\u003cp>\u003cimg data-k=\"f9a3c76b3a1b\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"4817973","cat":"平均数","stem":"2020年全国城乡居民人均可支配收入差额约为：","options":{"A":"19251元","B":"26725元","C":"39273元","D":"43856元"},"answer":"B","explanation":"定位统计图可知：2020年全国城乡收入倍差为2.56；定位统计表可知：2020年全国农村居民人均可支配收入为17131.4元，根据：城乡收入倍差=城镇居民人均可支配收入÷农村居民人均可支配收入，则2020年全国城镇居民人均可支配收入=2020年城乡收入倍差×2020年农村居民人均可支配收入\u003cimg data-k=\"fc9376623d75\">\u003cimg data-k=\"da477d40ef9e\">元，则2020年全国城乡居民人均可支配收入差额\u003cimg data-k=\"2ea3a8a088f8\">元，与B项最接近。\n故正确答案为B。","no":106,"missingImage":false},{"qid":"2578842","cat":"增长","stem":"2020年全国城镇居民人均可支配收入增长率为：","options":{"A":"3.69%","B":"6.93%","C":"8.62%","D":"10.74%"},"answer":"A","explanation":"根据题干“2020年······增长率为”，可判定本题为一般增长率问题。定位表1可得：2019年和2020年全国农村居民人均可支配收入分别为16020.8元、17131.4元；定位图1可得：2019年和2020年城乡收入倍差分别为2.64、2.56。\n方法一：根据公式：城乡收入倍差\u003cimg data-k=\"b354b23e402d\">，则2019年和2020年全国城镇居民人均可支配收入分别为（16020.8×2.64）元、（17131.4×2.56）元。根据公式：增长率\u003cimg data-k=\"372ff9c49f2f\">，则2020年全国城镇居民人均可支配收入增长率\u003cimg data-k=\"e35c59ba80ba\">\u003cimg data-k=\"868c5c58d0ad\">\u003cimg data-k=\"9369d63cdea5\">，结合选项只有A项满足。 \n方法二：\u003cimg data-k=\"374351eb583c\">\u003cimg data-k=\"004aedfdf56d\">，\u003cimg data-k=\"2c13bdefcc55\">\u003cimg data-k=\"a1634db183ee\">。根据公式：城镇居民人均可支配收入=农村居民人均可支配收入×城乡收入倍差，增长率关系为：\u003cimg data-k=\"e149517edd6c\">\u003cimg data-k=\"c950423276b7\">\u003cimg data-k=\"63383c60f20f\">\u003cimg data-k=\"d3e00ced761d\">，结合选项只有A项满足。\n故正确答案为A。","no":107,"missingImage":false},{"qid":"2578841","cat":"平均数","stem":"2017-2020年全国农村人均可支配收入增长最慢的年份是：","options":{"A":"2017","B":"2018","C":"2019","D":"2020"},"answer":"D","explanation":"根据题干“2017-2020年······增长最慢的年份是”，可判定本题为一般增长率比较问题。定位表1可得：2016-2020年全国农村居民人均可支配收入分别为12363.4元、13432.4元、14617.1元、16020.8元、17131.4元。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，可得2017-2020年全国农村人均可支配收入同比增速分别为：\n2017年：\u003cimg data-k=\"cfe56d5ee8e4\">；\n2018年：\u003cimg data-k=\"7702f7a2dd64\">；\n2019年：\u003cimg data-k=\"ca7126a2ae79\">；\n2020年：\u003cimg data-k=\"9956f4d84b48\">。\n则2017-2020年全国农村人均可支配收入增长最慢的年份是2020年。\n故正确答案为D。","no":108,"missingImage":false},{"qid":"2578840","cat":"综合","stem":"与2019年相比，2020年城镇居民与农村居民的可支配收入差额：","options":{"A":"上升了450.9元","B":"下降了450.9元","C":"上升了610.1元","D":"下降了610.1元"},"answer":"A","explanation":"根据题干“与2019年相比，2020年······”，结合选项为上升/下降+具体单位，可判定本题为增长量计算问题。定位统计图可得：2019年全国城乡收入倍差为2.64；定位统计表可得：2019年全国农村居民人均可支配收入为16020.8元。根据：城乡收入倍差\u003cimg data-k=\"824b7af2af2a\">，可得：城镇居民人均可支配收入=城乡收入倍差×农村居民人均可支配收入，则2019年城乡居民人均可支配收入差额=2.64×16020.8-16020.8=（2.64-1）×16020.8≈1.64×16000=26240元。根据本篇第1题可得：2020年城乡居民人均可支配收入差额为26725元。则与2019年相比，2020年城乡居民人均可支配收入差额上升了26725-26240=485元，与A项最接近。\n故正确答案为A。\n备注：本题题干“可支配收入”默认为“人均可支配收入”，否则无法计算。","no":109,"missingImage":false},{"qid":"2578839","cat":"综合","stem":"根据以上材料可以推出的是：","options":{"A":"2020年全国居民人均可支配收入约为30493.9元","B":"2015-2020年农村居民人均可支配收入增速持续上升","C":"2014-2020年工资性收入占农村居民可支配收入的比重始终最高","D":"2014年农民经营性收入小于同时期城镇居民可支配收入的20%"},"answer":"D","explanation":"A项：定位统计图及统计表，可得2020年农村居民及城镇居民人均可支配收入，并未给出农村和城镇居民人数，故无法推出全国居民人均可支配收入，错误； \nB项：定位统计表，可得2014-2020年农村居民人均可支配收入分别为10488.9元、11421.7元、12363.4元、13432.4元、14617.1元、16020.8元、17131.4元。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，则2015-2020年农村居民人均可支配收入增速分别为：2015年，\u003cimg data-k=\"22bd43dbb486\">；2016年，\u003cimg data-k=\"f197dbb5823e\">。可得2016年增速＜2015年增速，非持续上升，错误；\nC项：定位统计表，可得2014-2020年农村居民人均可支配收入及工资性收入的数据。根据比重公式可知，因每年整体量不变，故直接比较每年部分量大小即可。由2014年工资性收入（4152.2元）＜2014年经营性收入（4237.4元），可得2014年工资性收入占农村居民人均可支配收入的比重不是最高，错误；\nD项：定位统计表，可得2014年农村居民人均可支配收入为10488.9元；农民经营性收入为4237.4元。定位统计图，2014年城乡收入倍差为2.75。根据城乡收入倍差\u003cimg data-k=\"824b7af2af2a\">，可知2014年城镇居民人均可支配收入为\u003cimg data-k=\"0a2dfb7eb88d\">元，故2014年农民经营性收入（4237.4元）＜28844.5×20%=5768.9元，正确。\n故正确答案为D。","no":110,"missingImage":false}]},{"type":"material","material":"\u003cp>        2020年全国人口共141178万人，比2010年增长了约5.38%。从地区分布上看，2020年东部地区人口占39.93%，中部地区占25.83%，西部地区占27.12%，东北地区占6.98%。与2010年相比，东部地区人口所占比重上升2.15个百分点，中部地区下降0.79个百分点，西部地区上升0.22个百分点，东北地区下降1.20个百分点。\u003c/p>\u003cp>        从性别构成上看，2020年男性人口为72334万人，女性人口为68844万人。从年龄构成上看，2020年0-14岁人口为25338万人，15-59岁人口为89438万人，60岁及以上人口为26402万人（其中，65岁及以上人口为19064万人）。从城乡分布上看，2020年居住在城镇的人口为90199万人，居住在乡村的人口为50979万人，与2010年相比，城镇人口增加23642万人，乡村人口减少16436万人。从民族构成上看，2020年汉族人口为128631万人，各少数民族人口为12547万人，与2010年相比，汉族人口增长4.93%，各少数民族人口增长10.26%，少数民族人口比重上升0.40个百分点。\u003c/p>","questions":[{"qid":"4818011","cat":"增长","stem":"2020年全国人口比2010年全国人口增加的数量位于以下哪个区间：","options":{"A":"5000万人-6000万人","B":"6000万人-7000万人","C":"7000万人-8000万人","D":"8000万人-9000万人"},"answer":"C","explanation":"根据题干“2020年······比2010年······增加的数量······”，可判定本题为增长量计算问题。\n方法一：定位文字材料第一段可得：2020年全国人口共141178万人，比2010年增长了约5.38%。根据公式：增长量\u003cimg data-k=\"8a9736885154\">，则2020年全国人口比2010年全国人口增加的数量\u003cimg data-k=\"57d2c588cc90\">万人，在7000万人-8000万人区间。\n方法二：定位文字第二段可知：（2020年）与2010年相比，城镇人口增加23642万人，乡村人口减少16436万人。因为全国人口数=城镇人口数+乡村人口数，则2020年全国人口比2010年全国人口增加的数量=城镇人口增加数量-乡村人口减少数量=23642-16436=7206万人，在7000万人-8000万人区间。\n故正确答案为C。","no":111,"missingImage":false},{"qid":"4818013","cat":"综合","stem":"2020年，中部地区人口比西部地区人口少：","options":{"A":"约1721万人","B":"约1821万人","C":"约1921万人","D":"约2021万人"},"answer":"B","explanation":"根据题干“2020年，中部地区人口比西部地区人口少”，结合材料中给出2020年中部地区和西部地区的人口占比，可判定本题为现期比重问题。定位材料第一段可得：2020年全国人口共141178万人······中部地区占25.83%，西部地区占27.12%。根据公式：部分量=整体量×比重，则2020年中部地区人口比西部地区人口少\u003cimg data-k=\"84d3af6dcea1\">\u003cimg data-k=\"6f5ab408311b\">\u003cimg data-k=\"61b767daec01\">万人，与B项最接近。\n故正确答案为B。","no":112,"missingImage":false},{"qid":"4818014","cat":"综合","stem":"2010年，东部地区人口是东北地区人口的：","options":{"A":"约4.6倍","B":"约5.7倍","C":"约6.5倍","D":"约7.3倍"},"answer":"A","explanation":"根据题干“2010年······是······的”，选项是约多少倍，且材料时间为2020年，可判定本题为基期倍数问题。定位文字材料第一段可得：2020年东部地区人口占39.93%，东北地区占6.98%；与2010年相比，东部地区人口所占比重上升2.15个百分点，东北地区下降1.20个百分点。则2010年，东部地区人口占总人口的比重为39.93%-2.15%=37.78%，东北地区人口占总人口的比重为6.98%+1.2%=8.18%，题目所求倍数\u003cimg data-k=\"ba4b3ada5eac\">。\n故正确答案为A。","no":113,"missingImage":false},{"qid":"4818016","cat":"比重","stem":"2020年，65岁及以上人口占比与60-64岁人口占比相差：","options":{"A":"约6.3%","B":"约7.3%","C":"约8.3%","D":"约9.3%"},"answer":"C","explanation":"根据题干“2020年······占比与······占比相差”，结合材料时间为2020年，可判定本题为现期比重问题。定位文字材料第一段可得：2020年全国人口共141178万人。定位文字材料第二段可得：2020年60岁及以上人口为26402万人，其中，65岁及以上人口为19064万人。则2020年60-64岁人口为26402-19064=7338万人，根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，则所求比重差\u003cimg data-k=\"11ca785458af\">\u003cimg data-k=\"865352f8d4cf\">，与C项最接近。\n故正确答案为C。","no":114,"missingImage":false},{"qid":"4818017","cat":"综合","stem":"能够从上述资料推出的是：","options":{"A":"2010年，全国人口超过13.5亿人","B":"2010年，我国西部地区各少数民族人口不超过5000万人","C":"2020年，我国80%以上人口都在60岁以下（不含60岁）","D":"2020年，男性人口占比超过女性人口占比3个百分点以上"},"answer":"C","explanation":"A项：方法一：定位文字材料第一段可得：2020年全国人口共141178万人，比2010年增长了约5.38%。根据公式：基期量\u003cimg data-k=\"37fde96738fb\">，可得2010年全国人口为\u003cimg data-k=\"fa18741c1494\">万人=13.4亿人&lt;13.5亿人，错误；\n方法二：定位文字材料第一段可得：2020年全国人口共141178万人；定位文字材料第二段可得：从城乡分布上看······与2010年相比，城镇人口增加23642万人，乡村人口减少16436万人。根据公式：基期量=现期量-增长量，可得2010年全国人口=141178-（23642-16436）=141178-7206=133972万人\u003cimg data-k=\"fc1d773efe5a\">亿人&lt;13.5亿人，错误；\nB项：文字材料第二段只给出了2020年全国各少数民族人口的数据，未给出西部地区各少数民族人口的相关数据，因此该项无法推出，错误；\nC项：定位文字材料第一段可得：2020年全国人口共141178万人；定位文字材料第二段可得：2020年60岁及以上人口为26402万人。则2020年60岁以下（不含60岁）人口为141178-26402=114776万人，占全国人口的比重\u003cimg data-k=\"3fd188593fc1\">，正确；\nD项：定位文字材料第一段可得：2020年全国人口共141178万人；定位文字材料第二段可得：2020年男性人口为72334万人，女性人口为68844万人。则2020年，男性人口占比比女性人口多\u003cimg data-k=\"8ef60d3ecc1b\">，即男性人口占比超过女性人口占比不足3个百分点，错误。\n故正确答案为C。","no":115,"missingImage":false}]}],"count":10,"answerable":10,"pointsOf":16}],"total":115,"affected":[],"subtitle":"2022年 · 青海 · 6/6 模块"}]};

<script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
