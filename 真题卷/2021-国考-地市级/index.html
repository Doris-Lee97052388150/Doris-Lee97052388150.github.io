<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2021年国家公务员录用考试《行测》题（地市级网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2021-国考-地市级","title":"2021年国家公务员录用考试《行测》题（地市级网友回忆版）","year":"2021","group":"国考","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2719285","cat":"时事政治","stem":"党的十九届四中全会审议通过了《中共中央关于坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化若干重大问题的决定》。下列对该决定的理解不准确的是：","options":{"A":"首次用一次中央全会专门研究我国国家制度和国家治理问题并作出决定","B":"首次提出国家治理体系和治理能力现代化的命题","C":"明确党的领导制度在我国国家制度和治理体系中的统领地位","D":"对社会主义基本经济制度内涵作出重要拓展和深化"},"answer":"B","explanation":"本题考查政治常识。\nA项正确，中国共产党第十九届中央委员会第四次全体会议于2019年10月28日至31日在北京举行，审议通过了《中共中央关于坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化若干重大问题的决定》。用一次中央全会专门研究国家制度和国家治理问题并作出决定，这在党的历史上还是第一次。\nB项错误，党的十八届三中全会首次提出“推进国家治理体系和治理能力现代化”这个重大命题，并把“完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化”确定为全面深化改革的总目标。\nC项正确，《中共中央关于坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化若干重大问题的决定》指出：“中国共产党领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势，党是最高政治领导力量。必须坚持党政军民学、东西南北中，党是领导一切的，坚决维护党中央权威，健全总揽全局、协调各方的党的领导制度体系，把党的领导落实到国家治理各领域各方面各环节。”中共中央总书记、国家主席、中央军委主席习近平发表重要文章《坚持和完善中国特色社会主义制度推进国家治理体系和治理能力现代化》，该文章指出：“中国特色社会主义制度是一个严密完整的科学制度体系，起四梁八柱作用的是根本制度、基本制度、重要制度，其中具有统领地位的是党的领导制度。”\nD项正确，《中共中央关于坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化若干重大问题的决定》指出：“公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制等社会主义基本经济制度，既体现了社会主义制度优越性，又同我国社会主义初级阶段社会生产力发展水平相适应，是党和人民的伟大创造。必须坚持社会主义基本经济制度，充分发挥市场在资源配置中的决定性作用，更好发挥政府作用，全面贯彻新发展理念，坚持以供给侧结构性改革为主线，加快建设现代化经济体系。”该决定对社会主义基本经济制度内涵作了重要拓展和深化。\n本题为选非题，故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"2719287","cat":"新思想","stem":"习近平总书记指出，要强化对市场主体的金融支持，发展普惠金融，有效缓解企业特别是中小微企业融资难融资贵问题。下列哪个措施最有助于新增融资重点流向中小微企业？","options":{"A":"深化市场报价利率改革，引导贷款利率继续下行","B":"探索优化教育、养老领域中长期融资的配套政策和运作模式","C":"综合运用清收、核销、重组、证券化、债转股等多种处置手段，大力化解不良资产风险","D":"银行业金融机构优先、快速对在中国人民银行征信报告中无贷款记录的企业提供贷款"},"answer":"A","explanation":"本题考查经济常识。\nA项正确，8月17日，国务院召开常务会议，会议指出，要继续落实好为市场主体减负等金融支持政策。其中，要提高金融支持政策便利度，支持中小银行运用大数据进行有效银企对接，疏通传导机制，扩大市场主体受益面。深化市场报价利率改革，引导贷款利率继续下行。落实落细运用再贷款再贴现资金发放优惠利率贷款、支持发放信用贷款等措施，确保小微企业全年融资量增、面扩、价降。\nB项错误，为了防范化解我国当前面临的主要金融风险，要坚持实施稳健的货币政策，优化金融市场体系，推进利率市场化改革，培育行业性区域性信用环境，建立健全贷款风险补偿共担机制，按市场化法治化原则对出现暂时困难的优质企业进行纾困并加快出清“僵尸企业”，探索优化教育、养老领域中长期融资的配套政策和运作模式。因此该做法是为了防范化解金融风险。\nC项错误，不良贷款处置是金融系统向实体经济让利的方式之一，近年来监管部门鼓励甚至强行督促银行业综合运用现金清收、批量转让、资产证券化、债转股、损失核销等多种手段，来加大处置不良资产的力度，与新增融资重点流向中小微企业无直接关系。\nD项错误，首贷，即首次贷款，是指在中国人民银行征信报告中无贷款记录的企业首次从银行业金融机构获得贷款，该做法只针对“首贷”的企业，覆盖较片面，不是最有助于新增融资重点流向中小微企业的做法。\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"2719288","cat":"新思想","stem":"党的十九大报告提出，要建设高素质专业化干部队伍，把好干部标准落到实处。关于好干部标准，下列理解正确的有几项？\n①把专业素质放在第一位，要做到勇于作为、善于谋事\n②突出政治标准，要做到信念坚定、为民服务\n③力戒空谈，要做到勤政务实、敢于担当\n④把纪律作为底线，要做到清正廉洁","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查政治常识。\n①项错误，2017年10月18日，党的十九大报告中指出：建设高素质专业化干部队伍。在提到“把好干部标准落到实处”时，首先提到的是：坚持正确选人用人导向，匡正选人用人风气，突出政治标准，提拔重用牢固树立“四个意识”和“四个自信”、坚决维护党中央权威、全面贯彻执行党的理论和路线方针政策、忠诚干净担当的干部，选优配强各级领导班子。习近平在2018年召开的全国组织工作会议上的讲话再次强调：把政治标准放在第一位。政治标准是硬杠杠。\n②项正确，突出政治标准是十九大对好干部标准的明确要求。\n③项正确，党的十九大报告指出：完善干部考核评价机制，建立激励机制和容错纠错机制，旗帜鲜明为那些敢于担当、踏实做事、不谋私利的干部撑腰鼓劲。\n④项正确，党的十九大报告强调：把党的政治建设摆在首位。······弘扬忠诚老实、公道正派、实事求是、清正廉洁等价值观，坚决防止和反对个人主义、分散主义、自由主义、本位主义、好人主义。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"2719316","cat":"新思想","stem":"根据《中国共产党纪律处分条例》，下列说法正确的是：","options":{"A":"某区委原书记吕某，大搞迷信活动，找风水先生破解风水、卜问前程，主要违反党的生活纪律","B":"某国有公司原党委委员、执行董事赵某，利用企业信誉和地位大搞权钱交易，牟取个人私利，主要违反党的廉洁纪律","C":"某县向中央环保督察组提供10份编造的县委常委会会议纪要，弄虚作假，应对督察，主要违反党的工作纪律","D":"某市畜牧兽医局原党组书记、局长郭某，自2003年3月起兼任该市某饲料有限公司（畜牧类企业）法定代表人、董事长，主要违反党的组织纪律"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，《中国共产党纪律处分条例》第六十三条规定：“组织迷信活动的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。参加迷信活动，造成不良影响的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。对不明真相的参加人员，经批评教育后确有悔改表现的，可以免予处分或者不予处分。”该条规定于第六章“对违反政治纪律行为的处分”中，因此，吕某大搞迷信活动等行为违反了党的政治纪律，而不是生活纪律。\nB项正确，《中国共产党纪律处分条例》第八十五条第一款规定：“党员干部必须正确行使人民赋予的权力，清正廉洁，反对任何滥用职权、谋求私利的行为。”该款规定于第八章“对违反廉洁纪律行为的处分”，因此，赵某利用企业信誉和地位大搞权钱交易，牟取个人利益，违反了党的廉洁纪律。\nC项错误，《中国共产党纪律处分条例》第五十一条规定：“对党不忠诚不老实，表里不一，阳奉阴违，欺上瞒下，搞两面派，做两面人，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。”该条规定于第六章“对违反政治纪律行为的处分”中，因此，本质上看，弄虚作假，应对督察是作风不正、党性不纯，对党不忠诚不老实的表现，违反了党的政治纪律，而不是工作纪律。\nD项错误，《中国共产党纪律处分条例》第九十四条第一款规定：“违反有关规定从事营利活动，有下列行为之一，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分：（一）经商办企业的；（二）拥有非上市公司（企业）的股份或者证券的；（三）买卖股票或者进行其他证券投资的；（四）从事有偿中介活动的；（五）在国（境）外注册公司或者投资入股的；（六）有其他违反有关规定从事营利活动的。”该款规定于第八章“对违反廉洁纪律行为的处分”，因此，郭某作为党员，担任公司法定代表人、董事长，违反了党的廉洁纪律，而不是组织纪律。\n故正确答案为B。","no":4,"missingImage":false}],"count":4,"answerable":4,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2719289","cat":"法律常识","stem":"2020年3月9日，中共中央办公厅发布《党委（党组）落实全面从严治党主体责任规定》，根据该规定，党组（党委）应当加强对本单位（本系统）全面从严治党各项工作的领导。在加强党的建设方面，下列理解不准确的是：","options":{"A":"支持纪检监察机关履行监督责任，一体推进不敢腐、不能腐、不想腐","B":"持续整治“四风”特别是形式主义、官僚主义，反对特权思想和特权现象","C":"把党的思想建设摆在首位，坚定政治信仰，强化政治领导，提高政治能力，净化政治生态","D":"党组（党委）带头遵守党内法规制度，严格落实党内法规执行责任制"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，根据《党委（党组）落实全面从严治党主体责任规定》第七条第七款规定：加强党的纪律建设，履行党风廉政建设主体责任，支持纪检监察机关履行监督责任，一体推进不敢腐、不能腐、不想腐。\nB项正确，根据《党委（党组）落实全面从严治党主体责任规定》第六条第六款规定：持之以恒抓好党的作风建设，落实中央八项规定精神，持续整治“四风”特别是形式主义、官僚主义，反对特权思想和特权现象，密切党同人民群众的血肉联系。\nC项错误，根据《党委（党组）落实全面从严治党主体责任规定》第六条第三款规定：把党的政治建设摆在首位，坚定政治信仰，强化政治领导，提高政治能力，净化政治生态，始终在政治立场、政治方向、政治原则、政治道路上同党中央保持高度一致。\nD项正确，根据《党委（党组）落实全面从严治党主体责任规定》第七条第八款规定：带头遵守党内法规制度，严格落实党内法规执行责任制，建立健全本单位（本系统）党建工作制度，不断提高制度执行力。\n本题为选非题，故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"2719294","cat":"人文常识","stem":"根据2020年1月21日中共中央办公厅发布的《纪检监察机关处理检举控告工作规则》，下列表述错误的是：","options":{"A":"对匿名检举控告材料，确有需要的，可以直接核查检举控告人的笔迹、网际协议地址（IP地址）等信息","B":"纪检监察机关提倡、鼓励实名检举控告，对实名检举控告优先办理、优先处置、给予答复","C":"承办的监督检查、审查调查部门应当将实名检举控告的处理结果在办结之日起15个工作日内向检举控告人反馈","D":"纪检监察机关信访举报部门可以通过面谈方式核实是否属于实名检举控告"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，第五章，实名检举控告的处理中第二十九条第二款规定：对匿名检举控告材料，不得擅自核查检举控告人的笔迹、网际协议地址（IP地址）等信息。对检举控告人涉嫌诬告陷害等违纪违法行为，确有需要采取上述方式追查其身份的，应当经设区的市级以上纪委监委批准。\nB项正确，第五章，实名检举控告的处理中第二十五条规定：纪检监察机关提倡、鼓励实名检举控告，对实名检举控告优先办理、优先处置、给予答复。\nC项正确，第五章，实名检举控告的处理中第二十七条第一款规定：承办的监督检查、审查调查部门应当将实名检举控告的处理结果在办结之日起15个工作日内向检举控告人反馈，并记录反馈情况。\nD项正确，第五章，实名检举控告的处理中第二十四条第二款规定：纪检监察机关信访举报部门可以通过电话、面谈等方式核实是否属于实名检举控告。\n本题为选非题，故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"2719302","cat":"地理国情","stem":"下列先烈的书信，按时间先后排序正确的是：\n①“看最近之情况，敌人或要再来碰一下钉子，只要敌来犯，兄即到河东与弟等共同去牺牲。······更相信只要我等能本此决心，我们的国家及我五千年历史之民族，决不致亡于区区三岛倭奴之手。”\n②“志兰！亲爱的：别时容易见时难，分离二十一个月了，何日相聚······愿在党的整顿之风下各自努力，力求进步吧！以进步来安慰自己，以进步来酬报别后衷情。”\n③“母亲因为坚决地做了反满抗日的斗争，今天已经到了牺牲的前夕了。······母亲不用千言万语来教育你，就用实行来教育你。在你长大成人之后，希望不要忘记你的母亲是为国而牺牲的！”\n④“山东交涉及北京学界之举动，迪纯兄归，当知原委。······现每日有游行演讲，有救国日刊，各举动积极进行，但取不越轨范以外，以稳健二字为宗旨。”","options":{"A":"③④②①","B":"④②①③","C":"③④①②","D":"④③①②"},"answer":"D","explanation":"本题考查人文常识。\n①这封信是1940年5月1日，枣宜会战前夕张自忠亲笔昭告各将领、各部队的书信。枣宜会战中，张自忠将军身负七处重伤，壮烈殉国，成为抗战期间中国军队牺牲的最高将领、二战中盟军牺牲的最高将领。\n②这封家书是1942年5月22日，左权将军壮烈殉国前三天写给爱妻刘志兰的最后一封信。由信中“党的整顿之风”可判断当时党内正开展整风运动（1941年-1945年）。\n③这封信是1936年赵一曼写给儿子的遗书，九一八事变后，日本帝国主义于1932年在长春成立了伪满洲国傀儡政权，信中“反满抗日”指的便是东北人民反抗伪满洲国的抗日活动，此时处于东北局部抗战时期。\n④这封信是1919年5月17日，闻一多写给父母的家书，信中“山东交涉及北京学界之举动”“每日有游行演讲”等交代了当时北京学界游行演讲是为了争取山东主权问题，故可判断当时正处于五四运动时期。\n综上，上述先烈的书信，按时间先后排序应为④③①②（五四运动\u003cimg data-k=\"2dfb7d1f72f3\">局部抗战\u003cimg data-k=\"2dfb7d1f72f3\">全面抗战\u003cimg data-k=\"2dfb7d1f72f3\">延安整风）。\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"2719307","cat":"人文常识","stem":"根据2020年7月1日起实施的《中华人民共和国公职人员政务处分法》，下列说法错误的是：","options":{"A":"政务处分的对象不仅包括公务员，也包括国有企业管理人员","B":"政务处分不同于党纪处分","C":"政务处分决定由监察机关依法作出，也可以由公职人员任免机关、单位作出","D":"对公职人员的同一违法行为，监察机关和公职人员任免机关、单位不得重复给予政务处分和处分"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，《政务处分法》第二条规定：“本法适用于监察机关对违法的公职人员给予政务处分的活动。本法第二章、第三章适用于公职人员任免机关、单位对违法的公职人员给予处分。处分的程序、申诉等适用其他法律、行政法规、国务院部门规章和国家有关规定。本法所称公职人员，是指《中华人民共和国监察法》第十五条规定的人员。”《监察法》第十五条规定：“监察机关对下列公职人员和有关人员进行监察：（一）中国共产党机关、人民代表大会及其常务委员会机关、人民政府、监察委员会、人民法院、人民检察院、中国人民政治协商会议各级委员会机关、民主党派机关和工商业联合会机关的公务员，以及参照《中华人民共和国公务员法》管理的人员；（二）法律、法规授权或者受国家机关依法委托管理公共事务的组织中从事公务的人员；（三）国有企业管理人员；（四）公办的教育、科研、文化、医疗卫生、体育等单位中从事管理的人员；（五）基层群众性自治组织中从事管理的人员；（六）其他依法履行公职的人员。”\nB项正确：政务处分是监察机关对违法的公职人员给予的惩戒。党纪处分是党员违反党的纪律，危害党、国家和人民利益，应当依照规定受到的纪律处分。政务处分与党纪处分的区别主要有：①党纪处分的对象是党员，政务处分的对象是行使公权力的公职人员；②党纪处分对应的是违纪行为，政务处分对应的是违法行为；③党纪处分的依据主要是党章、党纪处分条例、党内监督条例等党内法规，政务处分的依据主要是政务处分法、监察法、公务员法、法官法、检察官法、行政机关公务员处分条例、事业单位工作人员处分暂行规定、公职人员政务处分暂行规定等法律法规。\nC项错误，《政务处分法》第三条规定：“监察机关应当按照管理权限，加强对公职人员的监督，依法给予违法的公职人员政务处分。公职人员任免机关、单位应当按照管理权限，加强对公职人员的教育、管理、监督，依法给予违法的公职人员处分。监察机关发现公职人员任免机关、单位应当给予处分而未给予，或者给予的处分违法、不当的，应当及时提出监察建议。”政务处分由监察机关依法作出。\nD项正确，《政务处分法》第十六条规定：“对公职人员的同一违法行为，监察机关和公职人员任免机关、单位不得重复给予政务处分和处分。”\n本题为选非题，故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"2719312","cat":"人文常识","stem":"长征是宣言书、长征是宣传队、长征是播种机。下列《长征组歌》中的诗句，按所反映事件发生的先后顺序排列正确的是：\n①六盘山上红旗展，势如破竹扫敌骑\n②昼夜兼程二百四，猛打穷追夺泸定\n③雪山低头迎远客，草毯泥毡扎营盘\n④战士双脚走天下，四渡赤水出奇兵","options":{"A":"③①④②","B":"③④②①","C":"④③①②","D":"④②③①"},"answer":"D","explanation":"本题考查毛中特。\n①1935年10月，中央红军在毛泽东等人率领下，经过艰苦斗争，于7日经宁夏隆德县，翻越六盘山。\n②1935年5月29日。中央红军部队在四川省中西部强渡大渡河成功，沿大渡河东岸北上，主力由安顺场沿大渡河右岸北上，红四团官兵在天下大雨的情况下，在崎岖陡峭的山路上跑步前进，在5月29日凌晨6时许按时到达泸定桥西岸。第2连连长和22名突击队员沿着枪林弹雨和火墙密布的铁索踩着铁链夺下桥头，并与东岸部队合围占领了泸定桥。\n③1935年6月至1936年7月，红四方面军在所经过的四川、西藏、青海、甘肃四省内，翻越了海拔4400米以上的雪山共5座，其中梦笔山、夹金山都是两次经过，虹桥山、折多山、巴郎山是一次经过。虹桥山海拔4592米，是红四方面军翻过的雪山中最高的一座。草地在四川省西北部与甘肃交接处，纵横数百里，四川松潘以北，班佑地区之南，也叫松潘大草地。\n④四渡赤水是中央红军在长征途中，为争取战略主动，在贵州、四川、云南边境地区，成功进行的一次高度灵活机动的战略性战役。从1935年1月19日红军离开遵义开始，到5月9日胜利渡过金沙江为止，历时3个多月。在毛泽东、周恩来等的领导下，中央红军粉碎了蒋介石围歼红军于川黔滇的企图，展现了中国共产党领导人高超的军事指挥艺术，是我军革命战争史上的光辉典范。\n正确的顺序为④②③①。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"2719321","cat":"人文常识","stem":"中共中央、国务院于2019年12月4日印发了《关于营造更好发展环境支持民营企业改革发展的意见》，下列说法与之不符的是：","options":{"A":"招投标时不得设置与业务能力无关的企业规模门槛","B":"在人才引进支持政策方面对民营企业一视同仁，支持民营企业引进海外高层次人才","C":"鼓励民营企业积极参与社会公益、慈善事业","D":"在电力、电信、铁路、石油等行业和领域，向民营企业全面开放"},"answer":"D","explanation":"本题考查政治常识。\nA项正确，《中共中央 国务院关于营造更好发展环境支持民营企业改革发展的意见》指出：“破除招投标隐性壁垒。对具备相应资质条件的企业，不得设置与业务能力无关的企业规模门槛和明显超过招标项目要求的业绩门槛等。”\nB项正确，《中共中央 国务院关于营造更好发展环境支持民营企业改革发展的意见》指出：“在人才引进支持政策方面对民营企业一视同仁，支持民营企业引进海外高层次人才。”\nC项正确，《中共中央 国务院关于营造更好发展环境支持民营企业改革发展的意见》指出：“鼓励民营企业积极参与社会公益、慈善事业。”\nD项错误，《中共中央 国务院关于营造更好发展环境支持民营企业改革发展的意见》指出：“在电力、电信、铁路、石油、天然气等重点行业和领域，放开竞争性业务，进一步引入市场竞争机制。支持民营企业以参股形式开展基础电信运营业务，以控股或参股形式开展发电配电售电业务。支持民营企业进入油气勘探开发、炼化和销售领域，建设原油、天然气、成品油储运和管道输送等基础设施。支持符合条件的企业参与原油进口、成品油出口。”\n本题为选非题，故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"2719286","cat":"人文常识","stem":"《中共中央国务院关于抓好“三农”领域重点工作确保如期实现全面小康的意见》（2020年中央一号文件）未提及以下哪一内容？","options":{"A":"强化粮食安全省长责任制考核","B":"坚持和发展新时代“枫桥经验”","C":"全面加强基层司法所建设","D":"有计划安排县城学校教师到乡村支教"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，2020年中央一号文件在第三部分“保障重要农产品有效供给和促进农民持续增收”中指出：“稳定粮食生产。确保粮食安全始终是治国理政的头等大事。粮食生产要稳字当头，稳政策、稳面积、稳产量。强化粮食安全省长责任制考核，各省（自治区、直辖市）2020年粮食播种面积和产量要保持基本稳定。”\n\nB项正确，2020年中央一号文件在第四部分“加强农村基层治理”中指出：“调处化解乡村矛盾纠纷。坚持和发展新时代“枫桥经验”，进一步加强人民调解工作，做到小事不出村、大事不出乡、矛盾不上交。畅通农民群众诉求表达渠道，及时妥善处理农民群众合理诉求。”\nC项错误，2020年中央一号文件是21世纪以来指导“三农”工作的第17个中央一号文件，全文共5个部分，包括：坚决打赢脱贫攻坚战、对标全面建成小康社会加快补上农村基础设施和公共服务短板、保障重要农产品有效供给和促进农民持续增收、加强农村基层治理、强化农村补短板保障措施，并未提及基层司法所建设。\nD项正确，2020年中央一号文件在第二部分“对标全面建成小康社会加快补上农村基础设施和公共服务短板”中指出：“提高农村教育质量······加强乡村教师队伍建设，全面推行义务教育阶段教师‘县管校聘’，有计划安排县城学校教师到乡村支教。”\n本题为选非题，故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"2719290","cat":"科技常识","stem":"下列我国科技成就，按照时间先后排序正确的是：\n①屠呦呦获诺贝尔生理学或医学奖\n②汉字激光照相排版系统研制成功\n③袁隆平成功培育出籼型杂交水稻\n④超级计算机“天河一号”研制成功\n⑤北斗三号全球卫星导航系统正式开通","options":{"A":"③②④①⑤","B":"②③⑤④①","C":"③⑤②④①","D":"②④③①⑤"},"answer":"A","explanation":"本题考查科技常识。\n①2015年10月5日，我国科学家屠呦呦获得诺贝尔生理学或医学奖，她也由此成为迄今为止第一位获得诺贝尔科学奖项的本土中国科学家。\n②1975年5月，北京大学开始研制汉字激光照排系统，由王选教授等主持这项工作。1979年7月27日，科研人员用自己研制的照排系统，一次成版地输出一张由各种大小字体组成、版面布局复杂的八开报纸样纸，报头是“汉字信息处理”六个大字。这是首次用激光照排机输出的中文报纸版面。\n③1973年，袁隆平成功培育出世界上第一个籼型杂交水稻，他也因此获得了“杂交水稻之父”的称号。\n④“天河一号”是中国首台千兆次超级计算机。“天河一号”超级计算机从2008年开始研制，按两期工程实施：一期系统于2009年9月研制成功；二期系统于2010年8月在国家超级计算天津中心升级完成。\n⑤2020年7月31日上午，北斗三号全球卫星导航系统建成暨开通仪式在北京举行。中共中央总书记、国家主席、中央军委主席习近平出席仪式，宣布北斗三号全球卫星导航系统正式开通。\n因此，按时间先后顺序排序应为③②④①⑤。\n故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"2719293","cat":"人文常识","stem":"中共中央、国务院于2019年11月印发了《国家积极应对人口老龄化中长期规划》，其中提及的积极应对人口老龄化的战略目标包括：\n①制度基础持续巩固\n②财富储备日益充沛\n③人力资本不断提升\n④科技支撑更加有力\n⑤城乡区域协调发展","options":{"A":"①③④⑤","B":"①②③④","C":"①②④⑤","D":"②③④⑤"},"answer":"B","explanation":"本题考查政治常识。\n《国家积极应对人口老龄化中长期规划》提出的积极应对人口老龄化的战略目标是：积极应对人口老龄化的制度基础持续巩固，财富储备日益充沛，人力资本不断提升，科技支撑更加有力，产品和服务丰富优质，社会环境宜居友好，经济社会发展始终与人口老龄化进程相适应，顺利建成社会主义现代化强国，实现中华民族伟大复兴的中国梦。\n综上，①②③④属于积极应对人口老龄化的战略目标。\n故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"2719296","cat":"法律常识","stem":"某市开展交通整治活动，扣押了一批乱停放的货运机动车。主管部门与某民营停车场签订租赁协议，停放扣押车辆。下列情形属于行政法调整范围的是：","options":{"A":"车主甲对该主管部门的扣押决定不服产生争议","B":"民营停车场与该主管部门产生租赁费纠纷","C":"车主乙因车辆而与托运人产生承运合同纠纷","D":"车主丙在车辆被扣押过程中暴力抗法且情节严重"},"answer":"A","explanation":"本题考查法律常识。\n行政法，是调整由于行政活动发生的行政关系法律规范的总和。行政关系具体包括：行政管理关系、行政法制监督关系、行政救济关系和内部行政关系。\nA项正确，主管部门与被扣押车辆的车主甲之间的关系属于行政管理关系，车主甲对主管部门的扣押决定不服产生争议可以申请行政复议或行政诉讼，属于行政救济关系，由行政法调整。\nB项错误，民营停车场与该主管部门之间的租赁关系是平等主体之间的法律关系，由民法调整。\nC项错误，车主乙与托运人之间的承运关系是平等主体之间的法律关系，由民法调整。\nD项错误，车主丙暴力抗法且情节严重，行为已经触犯刑法，构成妨碍公务罪，由刑法调整。\n故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"2719299","cat":"经济常识","stem":"下列与贷款有关的说法错误的是：","options":{"A":"若采用等额本息的还款方式，每月还款额相同","B":"贷款市场报价利率（LPR）是基于央行公开市场操作利率形成的一种市场化利率","C":"以公益为目的的非营利法人对外提供的贷款担保是有效的","D":"学生在校期间的国家助学贷款利息由财政全额补贴"},"answer":"C","explanation":"本题考查经济常识。\nA项正确，等额本息还款方式指在贷款期限内每月以相等的还款额足额偿还贷款本金和利息。与之相对的还款方式是等额本金，等额本金指每月还款时偿还的贷款本金相同，利息不等，因此每月还款总额是不等的。\nB项正确，贷款市场报价利率（LPR）是由具有代表性的报价行，根据本行对最优质客户的贷款利率，以公开市场操作利率（主要指中期借贷便利利率）加点形成的方式报价，由中国人民银行授权全国银行间同业拆借中心计算得出并发布的利率，由中国人民银行授权全国银行间同业拆借中心计算并公布的基础性的贷款参考利率。LPR市场化程度较高，能够充分反映信贷市场资金供求情况，使用LPR进行贷款定价可以促进形成市场化的贷款利率，提高市场利率向信贷利率的传导效率。实际操作中，LPR每月都会进行集中报价和发布。\nC项错误，根据《民法典》第683条第2款规定：“以公益为目的的非营利法人、非法人组织不得为保证人。”因此，以公益为目的的非营利法人对外提供的担保是无效的。\nD项正确，2015年7月8日，李克强总理主持召开国务院常务会议。会议决定高校学生在读期间助学贷款利息由财政全额补贴，毕业后在还款期内继续攻读学位或在校期间因病等休学的,也可申请贴息。同时将贷款最长期限由原先的10年、14年，统一延长至20年。\n本题为选非题，故正确答案为C。","no":15,"missingImage":false},{"type":"question","qid":"2719303","cat":"人文常识","stem":"很多伟大科学家的墓志铭简练而富有诗意，是了解其一生成就的窗口。下列墓志铭与科学家对应错误的是：","options":{"A":"我曾测量天空，现在测量幽冥。灵魂飞向天国，肉体安息土中——爱因斯坦","B":"他把世界翻了一个个儿，虽然并不完全——达尔文","C":"他从苍天处取得闪电，从暴君处取得民权——富兰克林","D":"他失明了，因为自然界已经没有剩下什么他没有看见过的东西了——伽利略"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，德国天文学家、数学家开普勒发现了行星运动的三大定律，分别是轨道定律、面积定律和周期定律。他为自己撰写的墓志铭是：“我曾测量天空，现在测量幽冥。灵魂飞向天国，肉体安息土中。”\nB项正确，英国科学家达尔文提出了生物进化论，他的墓志铭是：“他把世界翻了一个个儿，虽然并不完全。”\nC项正确，美国政治家、物理学家富兰克林发明了避雷针，他曾在雷电交加的情况下，利用风筝将大气电收集到莱顿瓶中，使其充电，由此证明了他所提出的“闪电和静电的同一性”的设想。法国经济学家杜尔哥评价富兰克林：“他从苍天处取得闪电，从暴君处取得民权。”\nD项正确，意大利天文学家伽利略研究了速度和加速度、重力和自由落体等理论，发明了温度计，并使用用于天体科学观测的望远镜。晚年的伽利略失明，后人在其墓志铭写道：“他失明了，因为自然界已经没有剩下什么他没有看见过的东西了。”\n本题为选非题，故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"2719322","cat":"人文常识","stem":"下面是一款路由器的参数规格说明，对此描述错误的是：\n\u003cimg data-k=\"ea626b374a2d\" style=\"max-width:644px\">","options":{"A":"主频是路由器中央处理器的时钟频率","B":"此款路由器属于千兆无线路由器","C":"路由器的LAN口可以用来连接外网","D":"5GHz频段比2.4GHz频段传输距离短"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，主频也叫时钟频率，用来表示中央处理器的运算速度，常见的单位有Hz、kHz、MHz和GHz。\nB项正确，千兆无线路由器指无线传输速率达到1Gbps以上（1000Mbps以上）的无线路由器，图中所示路由器的无线传输速率为1167Mbps，属于千兆无线路由器。\nC项错误，WAN是英文Wide Area Network的首字母缩写，即代表广域网；而LAN则是Local Area Network的缩写，即本地网（或叫局域网）。WAN口主要用于连接外部网络，如ADSL、DDN、以太网等各种接入线路；而LAN口用来连接家庭内部网络，主要与家庭网络中的交换机、集线器或PC相连。\nD项正确，频段越高，信号衰减越快，传输距离就会越短。5GHz的频段比2.4GHz高，因此5GHz频段比2.4GHz频段传输距离短。\n本题为选非题，故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"2719327","cat":"科技常识","stem":"下列与生物灾害有关的说法错误的是：","options":{"A":"中国蝗灾最严重的地区是两湖地区","B":"稻飞虱的天敌有蜘蛛、青蛙","C":"松毛虫在高温干旱环境下更易繁殖","D":"鼠类会啃食庄稼的茎、叶、根和种子"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，蝗灾主要是由干旱引起的，我国历史上曾发生过多次蝗灾，其地域分布主要集中在今河北、河南、山东三省，两湖地区比较湿润，不是蝗灾最严重的地区。\nB项正确，稻飞虱是水稻上重要害虫之一，其天敌可分为捕食性天敌，如蜘蛛、青蛙等，寄生性天敌，如缨小蜂、白僵菌等。\nC项正确，松毛虫是严重威胁落叶松林的森林害虫，食量大，繁殖力强，干旱是造成松毛虫大暴发的最重要的因素之一。\nD项正确，鼠类为杂食性动物，农作物从种到收全过程和农产品贮存过程中都可能遭受其害。鼠类主要破坏植物的地下根茎为主，也啃食地上部分的花和叶、种子等。\n本题为选非题，故正确答案为A。","no":18,"missingImage":false},{"type":"question","qid":"2719328","cat":"人文常识","stem":"下列与口罩相关的说法正确的是：","options":{"A":"纱布口罩可达到防雾霾的效果","B":"活性炭口罩可吸附过滤空气中的甲醛","C":"医用外科口罩是医用口罩中防护等级最高的一类","D":"在成分不明的毒气污染环境中应佩戴过滤式防毒口罩"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，雾霾天气是对大气中各种悬浮颗粒物含量超标的笼统表述，PM2.5（空气动力学当量直径小于等于2.5微米的颗粒物）被认为是造成雾霾天气的“元凶”，而普通纱布口罩对于直径小于2.5微米的空气颗粒基本起不到过滤作用。\nB项正确，活性炭是一种粉状、粒状或丸状的无定形具有多孔的碳，用其制成的口罩有很强的吸附性能，可以用来吸附过滤空气中的甲醛等有毒有害气体。\nC项错误，目前我国医用口罩主要分为3种：医用防护口罩、医用外科口罩、一次性使用医用口罩，其中防护级别最高的是“医用防护口罩”，可过滤空气中的微粒，阻隔飞沫、血液、体液、分泌物等污染物，对非油性颗粒的过滤效率可达到\u003cimg data-k=\"d5d70dbf73a6\">以上。\nD项错误，过滤式防毒口罩是通过滤毒药剂等滤除空气中的有毒气体再供人呼吸。滤毒药剂只能在确定了毒物种类、浓度、气温和一定的作业时间内起防护作用。所以过滤式防毒口罩不能用于成分不明的毒气污染环境。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"2719332","cat":"科技常识","stem":"干热岩是埋深数千米的高温岩体，属于一种新兴的地热能源。下列有关说法正确的是：","options":{"A":"我国在青藏高原首次发现大规模可利用的干热岩资源","B":"注入低温水回收高温水的干热岩利用过程发生了能量转化","C":"干热岩发电技术已在世界多个国家的工业生产中普遍应用","D":"干热岩的开发利用过程中容易产生导致酸雨的污染气体"},"answer":"A","explanation":"本题考查科技常识。\n干热岩（HDR），也称增强型地热系统（EGS），或称工程型地热系统，是埋深数千米，内部不存在流体或仅有少量地下流体的高温岩体。\nA项正确，2014年，我国青海地勘人员在青海共和盆地成功钻获温度高达\u003cimg data-k=\"4a096fea0450\">的干热岩。这是我国首次发现大规模可利用干热岩资源。\nB项错误，在干热岩利用过程中，注入井将低温水输入热储水库中，经过高温岩体加热这一过程并未发生能量转化，只发生热能的传递。\nC项错误，干热岩发电技术属于新兴环保发电技术，该技术尚未成熟，该项中“普遍应用”表述错误。\nD项错误，干热岩是指一种没有水或蒸汽的热岩体，主要是各种变质岩或结晶岩类岩体，属清洁能源，可用于地热发电。在干热岩地热发电系统中不排放废水、废物、废气，对环境基本没有影响。因此，干热岩发电技术可大幅降低温室效应和酸雨对环境的影响，且不受季节、气候制约。\n故正确答案为A。","no":20,"missingImage":false}],"count":16,"answerable":16,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2719292","cat":"逻辑填空","stem":"发展扶贫产业不能眉毛胡子一把抓，必须立足当地自然禀赋，挖掘地方特色资源，按照“宜种则种、宜养则养”的原则，注重发展山地农业、生态农业、观光农业等特色产业，学会“靠山吃山唱山歌，靠海吃海念海经”，谨防产业“            ”。应该看到，适合的才是最好的。\n填入画横线部分最恰当的一项是：","options":{"A":"急功近利","B":"水土不服","C":"削足适履","D":"千篇一律"},"answer":"B","explanation":"由“学会‘靠山吃山唱山歌，靠海吃海念海经’”“适合的才是最好的”可知，文段强调发展产业要能适应当地情况，即具备适应性，根据横线前“谨防”可知，横线处表达意思与适应性相反，B项“水土不服”指对于一个地方的气候条件或饮食习惯不能适应，符合文意，并且“水土不服”体现出一种拟人的形象表达，为最佳答案，当选。\nA项“急功近利”指急于求得成效，贪求眼前利益，文段没有体现追求利益之意，与文意不符，排除；\nC项“削足适履”比喻不合理的迁就凑合或不顾具体条件，生搬硬套，该词重在强调对自身特性加以摒弃，以迁就适应外在事物，与文意不符，且无法与文段“靠山吃山唱山歌，靠海吃海念海经”形成形象表达呼应，排除；\nD项“千篇一律”指千篇文章都是一个模式，泛指事物只有一种形式，“谨防”表达的是多种多样的意思，但并不能对应文段“适合的才是最好的”，体现不出无法适应之意，与文意不符，排除。\n故正确答案为B。\n【文段出处】《以产业扶贫增强贫困地区造血功能》","no":21,"missingImage":false},{"type":"question","qid":"2719300","cat":"逻辑填空","stem":"“人民城市人民建”。搭建民意“直通车”、公众“议事厅”，有事好商量，大家来出力，很多工作就能做到            。比如上海能在短短一年内迅速形成垃圾分类的新风尚，靠的就是人民群众的主动性、积极性与创造性。\n填入画横线部分最恰当的一项是：","options":{"A":"立竿见影","B":"事半功倍","C":"万无一失","D":"尽善尽美"},"answer":"B","explanation":"根据横线后“比如”可知，后文是横线处的解释说明。根据“在短短一年内迅速形成垃圾分类的新风尚”可知，横线处想体现的是花费较少时间与投入就能取得很好的效果之意。加之前文中的“大家来出力”强调合作的重要性，进而带来效率的提升。B项“事半功倍”形容费力小，收效大，符合文意，当选。\nA项“立竿见影”意为把竹竿竖在阳光下，立刻可以看到影子，比喻收效迅速，见效很快，用于此处程度过重，与后文的“一年内”表述不符，排除；\nC项“万无一失”形容有绝对把握，绝对不出差错，文段未提及做工作时有没有差错，排除；\nD项“尽善尽美”意为极其完善，极其美好，形容事物完美无缺，文段未提及工作是否完美，且“尽善尽美”放入此处程度过重，排除。\n故正确答案为B。\n【文段出处】《马上评｜人民，就是这座城市的尺度》","no":22,"missingImage":false},{"type":"question","qid":"2719309","cat":"逻辑填空","stem":"在芯片、操作系统等很多方面，我们需要下定决心，攻坚克难，自力更生。因为一旦核心技术受制于人，就有被人“            ”的威胁。所以，我们要有“宝剑锋从磨砺出，梅花香自苦寒来”的定力，逐渐形成一批拥有自主知识产权的核心技术和产业，把发展的主动权牢牢掌握在自己手中。\n填入画横线部分最恰当的一项是：","options":{"A":"过河拆桥","B":"落井下石","C":"一网打尽","D":"釜底抽薪"},"answer":"D","explanation":"根据“核心技术受制于人”“把发展的主动权牢牢掌握在自己手中”可知，核心技术对我国非常重要，一旦被他人控制，我国就会有根基被动摇的威胁，D项“釜底抽薪”比喻从根本上解决问题，此处加上双引号为形象表达，体现出我国的核心技术一旦受制于人，将会被别国“釜底抽薪”，从根本上制约我国发展，符合文意，当选。\nA项“过河拆桥”比喻达到目的以后，就把曾经帮助过自己的人一脚踢开，该词中的“拆桥”未必是根本性的重要方面，相较于“釜底抽薪”来看，没有直接体现出“核心技术”的根本性重要性，排除；\nB项“落井下石”比喻乘人有危难时加以陷害，文中并未提及我们当下已经出现危难的情况，与文意不符，排除；\nC项“一网打尽”比喻全部抓住或消灭，用以形容核心技术受制于人的结果，程度过重，排除。\n故正确答案为D。\n【文段出处】《谨防受制于人的历史在智能时代重演》","no":23,"missingImage":false},{"type":"question","qid":"2719317","cat":"逻辑填空","stem":"中国道路的成功开创不仅创造了中国奇迹，而且创造了中国经验。中国经验无疑是中国智慧的结晶，具有鲜明的          。但是，中国经验作为中国道路的积极成果，也是在遵循历史发展和现代化发展规律、吸收世界发展经验教训的基础上形成的，它是对人类文明发展进行探索的重要产物，反映了人类文明进步的规律，因而又具有一定的          。\n依次填入画横线部分最恰当的一项是：","options":{"A":"地域性  国际性","B":"实践性  理论性","C":"特殊性  普遍性","D":"先进性  创新性"},"answer":"C","explanation":"本题可从第二空入手，横线前的“因而”体现因果关系，根据前文“遵循历史发展和现代化发展规律、吸收世界发展经验教训的基础上形成的，它是对人类文明发展进行探索的重要产物，反映了人类文明进步的规律”可知，中国经验虽然是中国创造的，但也是在整个世界和人类的经验教训基础上的产物，故具有普适性，A项“国际性”、C项“普遍性”均符合文意，保留。B项“理论性”侧重于强调理论有系统性，文中未提及，排除；D项“创新性”指事物具有创造性或新意，文中未提及，排除。\n第一空，根据“中国经验无疑是中国智慧的结晶”可知，“中国经验”属于中国特有的智慧，C项“特殊性”指事物特有的、不同于其他事物或一般情况的性质，符合文意，当选。A项“地域性”指某类事物局限于某一地理区域的情况，与后文“吸收世界发展经验教训的基础上形成的”相矛盾，排除。\n两个空综合来看，文段以“但是”衔接，前后构成转折，填入的两个词语“特殊性”与“普遍性”也刚好形成语义相反，符合文段逻辑。\n故正确答案为C。\n【文段出处】光明日报《唯物史观视域中的中国道路》","no":24,"missingImage":false},{"type":"question","qid":"2719324","cat":"逻辑填空","stem":"“为调研而调研”等现象的出现，很大程度上就在于调研不深入、不具体。现实中，有人了解情况习惯于大而化之、            ；有人调研习惯于走设计“路线”，            。这些心中不揣问题、脚下不沾泥土的错误做法，导致调研不深、不实、不细、不准，最终也会无效。\n依次填入画横线部分最恰当的一项是：","options":{"A":"粗枝大叶  按部就班","B":"走马观花  表里不一","C":"轻描淡写  循规蹈矩","D":"避重就轻  按图索骥"},"answer":"A","explanation":"第一空，根据横线前的“、”可知，横线处所填成语与“大而化之”构成并列关系，体现出做事情不够谨慎，疏忽大意之意。A项“粗枝大叶”比喻工作不认真，不细致，马虎大意，B项“走马观花”比喻粗略地观察事物，均符合文意，保留。C项“轻描淡写”多指说话写文章把重要问题轻轻带过，不加重视，文段侧重“了解情况”，与“轻描淡写”搭配不当，排除；D项“避重就轻”指避开重要的而拣次要的来承担，也指回避主要的问题，只谈无关重要的方面，侧重强调主要和次要问题，文段并无主要和次要的对应，排除。\n第二空，根据横线前“有人调研习惯于走设计路线”可知，横线处要体现出按规定路线做事之意，A项“按部就班”指按老规矩办事，缺乏创新精神，符合文意，当选。B项“表里不一”指表面与内在不一样，侧重强调表面和内在不同，文段并无表面与内在的对应，排除。\n故正确答案为A。\n【文段出处】《发扬调查研究好作风》","no":25,"missingImage":false},{"type":"question","qid":"2719330","cat":"逻辑填空","stem":"探索和形成一个好的制度不容易，关键是毫不动摇地坚持和巩固、与时俱进地完善和发展、            地遵守和执行。这要求我们要把制度像种子一样种在头脑里，如红线一般        于工作中。这样才能推动中国特色社会主义制度更加成熟、更加定型，将制度优势转化为强大的治理效能，通达“中国之治”的新天地。\n依次填入画横线部分最恰当的一项是：","options":{"A":"坚定不移  渗透","B":"一丝不苟  应用","C":"不折不扣  贯穿","D":"矢志不渝  根植"},"answer":"C","explanation":"本题可从第二空入手，根据横线前“像种子一样种在头脑里，如红线一般”可知，横线处所填词语与“红线”对应，体现“红线”的特性。C项“贯穿”指穿过，连通，符合文意，保留。A项“渗透”指某种事物或势力逐渐进入其他方面，B项“应用”指适用需要，以供使用，D项“根植”指扎根，均与“红线”特性不符，排除。\n第一空，代入验证，C项“不折不扣”指不打折扣，表示完全、十足、彻底，可形容遵守和执行制度的态度，搭配恰当，当选。\n故正确答案为C。\n【文段出处】《解码“中国之治”的制度优势》","no":26,"missingImage":false},{"type":"question","qid":"2719336","cat":"逻辑填空","stem":"一根网线、一部手机，把偏远的贫困地区链接进了广阔的大市场。电商扶贫，不是        地把农产品搬到网上，更在深层次地倒逼农业产业转型升级，进而扩展到其他相关领域，创建出中国式扶贫的新        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"简单  范本","B":"盲目  方向","C":"机械  蓝图","D":"被动  模式"},"answer":"A","explanation":"第一空，横线处形容“把农产品搬到网上”的行为，由“不是······更”可知，横线处与“深层次”语义相反，体现出做法浅显之意，A项“简单”可体现出没有深层次内涵之意，符合文意，保留。B项“盲目”意为认识不清，反义为认知清晰，与文意不符，排除；C项“机械”意为方式拘泥死板，反义为灵活变通，与文意不符，排除；D项“被动”意为被外力推进而行动，反义为主动，与文意不符，排除。\n第二空，代入验证，A项“范本”指典范的样本，与“创建”搭配恰当，符合文意，当选。\n故正确答案为A。\n【文段出处】《电商扶贫创建中国式扶贫新范本》","no":27,"missingImage":false},{"type":"question","qid":"2719340","cat":"逻辑填空","stem":"在实际应用中，专网通常服务于政府、军队、公安、能源、消防、轨道交通等部门或领域，大部分情况下被用来进行应急通信、调度指挥。性能可靠、低成本、定制化的特点，使其在行业应用中具备            的优势。即便5G时代呼啸而来，专网依旧能够找到            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"独具一格  立足之地","B":"众所周知  一席之地","C":"不可替代  用武之地","D":"显而易见  立锥之地"},"answer":"C","explanation":"第一空，横线处搭配“优势”，且对应前文“性能可靠、低成本、定制化的特点”，A项“独具一格”意为另有一种独特的风格，C项“不可替代”意为无法被代替，D项“显而易见”形容事情一下就能看清楚，放入此处均可形容专网特点带来的优势，符合文意，保留。B项“众所周知”意为许多人都知道，侧重大家都知道，与前文专网的特点对应不当，排除。\n第二空，根据前文“使其在行业应用中具备······优势”可知，横线处体现的是专网在5G时代依然能够应用，C项“用武之地”比喻可以施展自己才能的地方或机会，能够体现“应用”之意，符合文意，当选。A项“立足之地”指容身的地方，D项“立锥之地”指很小的安身地方，均强调有安身之处，无法体现“应用”之意，与文意不符，排除。\n故正确答案为C。\n【文段出处】《有了5G，我们还需要专网吗》","no":28,"missingImage":false},{"type":"question","qid":"2719323","cat":"逻辑填空","stem":"信息匮乏的年代，决策水平与信息量成正相关，但当信息从匮乏走向过载甚至“爆炸”时，决策质量与信息量间的函数曲线便开始下滑，利用繁杂信息形成        判断变得难上加难。此时，智能化就可以大显身手，计算智能未必能在逻辑能力上逾越人类，但其强大的处理速度却恰好使信息过载带来的决策困境            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"理性  烟消云散","B":"准确  迎刃而解","C":"科学  不复存在","D":"有效  无影无踪"},"answer":"B","explanation":"本题可从第二空入手，根据“智能化就可以大显身手”可知，横线处所填词语应表达计算智能强大的处理速度可以解决信息过载带来的问题，B项“迎刃而解”比喻主要的问题解决了，其他有关的问题就可以很容易地得到解决，可体现问题被解决，符合文意，保留。A项“烟消云散”形容事物消失净尽，C项“不复存在”指不会再次出现或拥有，D项“无影无踪”形容完全消失，不知去向，均重在强调问题彻底消失、不存在，文段侧重强调问题能被解决，而非问题彻底消失、不再出现，故三项程度均过重，排除。\n第一空，代入验证B项，“利用繁杂信息形成准确判断变得难上加难”符合文意，当选。\n故正确答案为B。\n【文段出处】《认知域下智能化战争制胜机理》","no":29,"missingImage":false},{"type":"question","qid":"2719335","cat":"逻辑填空","stem":"一些国家在实现自身现代化过程中选错了参照系，将发达国家有什么、做什么作为实现自身现代化的        ，导致在向市场经济转型过程中经济停滞、崩溃，危机不断。而中国能够根据自己的要素禀赋条件，发挥政府在市场经济中            的作用，把自己能做好的产业做大做强，将比较优势变成竞争优势，从而推动经济长期稳定快速发展。\n依次填入画横线部分最恰当的一项是：","options":{"A":"目标  因势利导","B":"原则  总揽全局","C":"模本  穿针引线","D":"途径  保驾护航"},"answer":"A","explanation":"第一空，根据横线前“参照系”可知，横线处所填词语应体现一些国家将发达国家作为自己实现现代化的参考、样本，A项“目标”指想要达到的境地或标准，C项“模本”指供临摹用的底本，用在此处均可体现一些国家模仿参照发达国家之意，符合“参照系”语境，保留。B项“原则”指说话或行事所依据的法则，发达国家的做法仅是一些国家发展中的参考，而非准则，程度过重，排除；D项“途径”指方法、路子，前文“将发达国家······作为”与“途径”搭配不当，“发达国家”不能直接成为“途径”，排除。\n第二空，横线处同时搭配前文的“政府”与后文的“作用”，且根据前文“中国能够根据自己的要素禀赋条件”可知，横线处意在表达政府在市场经济中根据自身条件积极发挥作用。A项“因势利导”指顺着事情的发展趋势加以引导，符合文意，当选。C项“穿针引线”比喻从中撮合、联系，使双方接通关系，政府并不会直接进入市场促成商业合作，而是会宏观调控，与文意不符，排除。\n故正确答案为A。\n【文段出处】《中国发展带来的几点启示》","no":30,"missingImage":false},{"type":"question","qid":"2719342","cat":"逻辑填空","stem":"每个民族都有自己独特的民俗文化，然而，一些人分不清具体的民族文化和民俗文化，加之有人为了在短时间内推出本民族民俗文化，盲目迎合当下的流行需要，反而使自己的民俗文化变得            ，出现“雷同化”传播现象，使大众对不同区域的特色民俗文化认知较为        ，影响大众对民俗文化的了解和兴趣，进而在一定程度上影响少数民族地区的经济发展。\n依次填入画横线部分最恰当的一项是：","options":{"A":"支离破碎  肤浅","B":"不伦不类  模糊","C":"名存实亡  混乱","D":"面目全非  狭隘"},"answer":"B","explanation":"本题可从第二空入手，根据“一些人分不清具体的民族文化和民俗文化”“出现‘雷同化’传播现象”可知，人们对不同地区的特色民俗文化分辨不清，B项“模糊”、C项“混乱”，均符合文意，保留。A项“肤浅”指学识浅或理解不深，强调不深入、不深刻，D项“狭隘”指（心胸、气量、见识等）局限于一个小范围里，强调不宽广，均与文意无关，排除。\n第一空，横线处词语修饰“民俗文化”，根据“每个民族都有自己独特的民俗文化”“盲目迎合当下的流行需要”“出现雷同化传播”可知，民俗文化本来应是各不相同，但现在为了迎合流行需要，最终导致其失去自身的特色，不同的民俗文化之间难以区分、四不像，B项“不伦不类”指不像这一类，也不像那一类，形容不成样子或不规范，符合文意，当选。C项“名存实亡“指名义上还存在，实际上已消亡，文段并未体现民俗文化已消亡，故与文意不符，排除。\n故正确答案为B。\n【文段出处】《少数民族民俗文化品牌的保护与传播》","no":31,"missingImage":false},{"type":"question","qid":"2719348","cat":"逻辑填空","stem":"近代以来，怎样处理中国传统文化与西方文化的关系，成为很多学者关注的重要问题。有人主张全盘西化，也有人主张全面恢复传统。这些        的观点当然受到了当时历史环境的影响，但也暴露出一些人在思维模式上的局限，即用            的思维来看待复杂的文化现象。这种思维模式在今天的研究中依然不同程度地存在。\n依次填入画横线部分最恰当的一项是：","options":{"A":"荒谬  泾渭分明","B":"偏颇  非此即彼","C":"片面  针锋相对","D":"极端  水火不容"},"answer":"B","explanation":"第一空，横线前出现指代词“这些”，根据前文“有人主张全盘西化，也有人主张全面恢复传统”可知，在处理中国传统文化与西方文化关系的问题上，人们的观点分为两派，要么“全盘西化”，要么“全面恢复传统”，B项“偏颇”指偏向一方，不公平，不公正，C项“片面”指不全面，D项“极端”含偏激之意，均符合文意，保留。A项“荒谬”指极端荒唐，非常不合情理，程度过重，排除。\n第二空，横线处修饰“思维”，即人们看待复杂文化现象的想法，根据前文可知，人们要么全盘西化，要么全面恢复传统，看问题不够全面，比较单一，B项“非此即彼”指不是这一个，就是那一个，能够体现出片面之意，符合文意，当选。C项“针锋相对”比喻双方意见、观点等尖锐对立，如“谈判双方针锋相对”，D项“水火不容”比喻二者对立，绝不相容，如“虚拟世界与现实世界并非水火不容”，二者均强调两个主体对立的状态，而横线处修饰的是人们看待复杂文化现象的思维，这种思维应是每一个人的想法，而非两个主体，故搭配不当，排除。\n故正确答案为B。\n【文段出处】《为政治文明发展提供滋养》","no":32,"missingImage":false},{"type":"question","qid":"2719352","cat":"逻辑填空","stem":"从生态学角度来讲，人工种群和野外种群是完全不同的概念。大型哺乳动物行为复杂，其生活技巧人类难以传授，又难以“无师自通”。如果        将其放归野外，结局很可能是死亡。就算可以放归野外，也必须为他们找到        的栖息地。\n依次填入画横线部分最恰当的一项是：","options":{"A":"贸然  合适","B":"直接  天然","C":"草率  理想","D":"随意  安全"},"answer":"A","explanation":"本题可从第二空入手，搭配“栖息地”，且根据前文“如果······将其放归野外，结局很可能是死亡”可知，简单的将其放归野外不够，还需找到能使其生存的栖息地，故横线处表达适宜、符合要求的含义。A项“合适”即适宜、符合客观要求，置于文段能体现找到适合“大型哺乳动物”生存的栖息地的意思，保留。B项“天然”即自然存在的野外，体现不出适宜、能使其生存的含义，排除。C项“理想”一方面指对未来事物的想象或希望，文段并未体现出对未来的希望，另一方面强调使人满意，文段强调的是找到适合“大型哺乳动物”生存的栖息地，而不是强调找到让“人”满意的栖息地，因此“理想”与文意不符，排除。D项“安全”即没有危险，但除了栖息地安全还需要食物等才能生存，表述片面，排除。\n第一空，代入验证，A项“贸然”即轻率、不加考虑，填入语义恰当，当选。\n故正确答案为A。\n【文段出处】《专家呼吁像保护大熊猫一样保护雪豹》","no":33,"missingImage":false},{"type":"question","qid":"2719357","cat":"逻辑填空","stem":"噬菌体是一种侵袭细菌的病毒，虽然它们很早就被发现，但由于一次只能攻击一种特定的细菌而未受关注。然而，曾经不那么受欢迎的          ，如今却成了它们最大的吸引力。由于过度使用抗生素，人类无意中        了目前最强大、最具耐药性的超级细菌，而噬菌体无疑是对付它们的潜在有效武器。\n依次填入画横线部分最恰当的一项是：","options":{"A":"敏感性  培育","B":"特异性  催生","C":"单一性  激活","D":"局限性  发现"},"answer":"B","explanation":"第一空，根据前文“由于一次只能攻击一种特定的细菌而未受关注”可知，横线处表达噬菌体不受欢迎的特性，B项“特异性”、C项“单一性”、D项“局限性”均可表达其一次只能攻击一种特定细菌的特点，保留。A项“敏感性”即感觉敏锐，与“一次只能攻击一种特定的细菌”无关，体现不出噬菌体的特点，排除。\n第二空，搭配“最强大、最具耐药性的超级细菌”，横线处要表达由于人类过度使用抗生素，促使细菌进化，产生了最具耐药性的超级细菌的含义，B项“催生”即促使诞生，符合文意，当选。C项“激活”即刺激使其活跃，D项“发现”即经过研究找到没看到的事物，一般均搭配原本就存在的事物，但是文段中超级细菌本身是不存在的，是由于人类过度使用抗生素才进化出来的细菌，搭配不当，排除。\n故正确答案为B。\n【文段出处】《噬菌体：可对抗超级耐药菌的病毒“卷土重来”》","no":34,"missingImage":false},{"type":"question","qid":"2719359","cat":"逻辑填空","stem":"现代社会获取盐分轻而易举，以至于人们认为吃盐是            的事情。而事实上，由于盐在地理上的分布不均以及交通不畅等原因，其在古代一直都属于        之物。在人类历史上的绝大部分时间里，人们都在寻找盐，甚至令盐业成为了历史上第一个由国家垄断的产业。可以说，盐贯穿着整个人类历史，并在人类文明的发展中起到了            的作用。\n依次填入画横线部分最恰当的一项是：","options":{"A":"稀松平常  必需  举足轻重","B":"理所当然  稀缺  至关重要","C":"天经地义  关键  承上启下","D":"手到擒来  珍贵  一以贯之"},"answer":"B","explanation":"第一空，由“现代社会获取盐分轻而易举”可知，人们认为吃盐是很方便、容易的事情。A项“稀松平常”指事情很平常，并没有特别的地方，B项“理所当然”指应该是这样的，合乎情理，D项“手到擒来”指做事有把握，不费力，均符合文意，保留。C项“天经地义”指非常正确、不容置疑的道理，程度过重，排除。\n第二空，根据“盐在地理上的分布不均以及交通不畅等原因”以及“人们都在寻找盐”可知，食盐在古代一直是较为稀少、罕见的物品。B项“稀缺”指稀少、短缺，符合文意，保留。A项“必需”指一定要有，不可缺少，D项“珍贵”指价值大、意义深刻，均无法体现“罕见”的意思，与文意不符，排除。\n第三空，代入验证，由文段可知，横线想要表明盐对人类文明的发展起到了重要作用，B项“至关重要”指对于某人或某事起着关键性作用，符合文意，当选。\n故正确答案为B。\n【文段出处】《如果历史有味道，那一定是咸的！》","no":35,"missingImage":false},{"type":"question","qid":"2719364","cat":"逻辑填空","stem":"亲近百姓、接近生活是曲艺这门艺术的生命力所在。当然，任何人都不可能        生活的全部，所以创作者才有了“采风”一说。采风从来不是去        生活，而是深入其中，体会其中的乐与悲。然而，现在许多曲艺工作者没有耐心去深入百姓生活，于是只能写自己熟悉的生活，创作能力无疑也受到了        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"描摹  评判  质疑","B":"洞察  记录  束缚","C":"掌握  体验  削弱","D":"了解  审视  限制"},"answer":"D","explanation":"第一空，根据文意可知，横线意在表明人们不可能知道并熟悉生活的全部内容。B项“洞察”指很清楚地观察，C项“掌握”指了解事物，因而能充分支配或运用，D项“了解”指知道得很清楚，均符合文意，保留。A项“描摹”指用语言文字表现人或事物的形象、情状、特性等，或指照着底样写和画，与文意不符，排除。\n第二空，由“采风从来不是······而是······”可知，横线处词语应与“深入其中”“体会其中的乐与悲”语义相反，表达仅停留在表面，不深入其中的意思。D项“审视”指仔细看，侧重强调停留在“看”的层面，能体现出不深入的意思，符合文意，保留。B项“记录”指把听到的话或发生的事写下来，“记录生活”本身就属于“采风”的一部分，“采风不是记录生活”表述不当，排除；C项“体验”指通过实践来认识周围的事物，与后文“深入其中”语义相近，无法构成反义并列，排除。\n第三空，代入验证，由“只能写自己熟悉的生活”可知，曲艺工作者的创作范围局限在自己熟悉的领域内，D项“限制”指规定范围，符合文意，当选。\n故正确答案为D。\n【文段出处】《小品&lt;办公室的故事&gt;终获北京文学艺术奖》","no":36,"missingImage":false},{"type":"question","qid":"2719305","cat":"逻辑填空","stem":"上世纪八十年代初，SCI作为一种        的、相对公平的量化指标被引进中国，这是建立科学、公平、公正的高校科研评价体系的初步尝试，在当时是一种进步。但如果启用先进的考核举措而长期            ，甚至演变成“至上”的法宝和单一的指挥棒，最终都会            ，弊大于利。\n依次填入画横线部分最恰当的一项是：","options":{"A":"详细  奉为圭臬  画地为牢","B":"稳定  唯命是从  作茧自缚","C":"客观  一成不变  物极必反","D":"中立  墨守成规  贻笑大方"},"answer":"C","explanation":"第一空，根据“、”可知，横线处内容应与“相对公平”语意相近。C项“客观”、D项“中立”均可体现“相对公平”之意，保留。A项“详细”、B项“稳定”和“相对公平”无关，排除。\n第二空，根据“甚至”可知，横线处应比“演变成‘至上’的法宝和单一的指挥棒”程度更轻，C项“一成不变”指守旧不变或者固守陈法，D项“墨守成规”表示思想保守、守着老规矩不肯改变，均符合文意，保留。\n第三空，根据文意，“先进的考核举措”最后的结果是“弊大于利”，体现出“先进的考核举措”没有得到好的效果。C项“物极必反”指事物发展到极点，会向相反方向转化，符合文意，当选。D项“贻笑大方”指让内行人笑话，文段未提及“内行人”，与文意不符，排除。\n故正确答案为C。\n【文段出处】《破除 “SCI至上”：不是否定SCI，更不是反对发论文》","no":37,"missingImage":false},{"type":"question","qid":"2719318","cat":"逻辑填空","stem":"医生和患者在沟通时最容易出现的        其实是，患者不同意或没听懂医生的建议，又因为不想被说教或觉得尴尬而没有如实反馈意见，而医生也大多没有意识到这一点。这显然会大大影响临床诊疗的        。此外，患者还会由于不想被说教而不承认一些不良生活行为。越是健康状况差的患者，越是容易        一些信息，而他们恰恰是最需要高质量医疗服务的人。\n依次填入画横线部分最恰当的一项是：","options":{"A":"难点  结果  遗漏","B":"盲区  效率  隐瞒","C":"障碍  判断  虚构","D":"瓶颈  目的  回避"},"answer":"B","explanation":"从第二空入手，根据横线前“这”指代前文“医生没有意识到患者没有如实反馈”这件事，可知横线处应表达“此事”对“临床诊疗”造成了影响。A项“结果”、B项“效率”、C项“判断”均符合文意，保留。D项“目的”，无论受影响与否，“临床诊疗”的“目的”都应是一致的，与文意不符，排除。\n第三空，根据“患者······不承认一些不良生活行为”可知“越是健康状况差的患者”越不想承认，故横线处体现出“不承认”之意，B项“隐瞒”意思是掩盖真相不让人知道，符合文意，保留。A项“遗漏”意思是应该列入或处理却因疏忽而没有列入或处理，文段是患者自己不想承认并非因为疏忽，与文意不符，排除；C项“虚构”是指凭空捏造，文中只是患者不承认已有的行为，未体现出“凭空捏造”，与文意不符，排除。\n第一空，代入验证，B项“盲区”刚好和后文“医生也大多没有意识到这一点”形成呼应，符合文意，当选。\n故正确答案为B。\n【文段出处】《看病的时候敢跟医生说谎？这样的人还不少》","no":38,"missingImage":false},{"type":"question","qid":"2719326","cat":"逻辑填空","stem":"内太阳系的岩石行星与外太阳系的气态行星最初的物质构成            。科学家此前认为，由于木星质量大、引力强，可以在一些物质到达内太阳系之前将其        ，阻止了内外太阳系物质的混合。但研究表明，木星的成长速度不足以阻止外太阳系物质源源不断流入内太阳系，这意味着内外太阳系行星将拥有        的成分。\n依次填入画横线部分最恰当的一项是：","options":{"A":"大同小异  阻拦  共同","B":"相去甚远  消灭  全新","C":"千姿百态  捕获  独特","D":"大相径庭  吞噬  类似"},"answer":"D","explanation":"本题可从第三空入手，尾句指代词“这”指代前文“木星的成长速度不足以阻止外太阳系物质源源不断流入内太阳系”，由此可知，内太阳系中可能掺杂外太阳系的物质，所以内外太阳系行星的成分可能有相似之处，A项“共同”形容彼此都具有的，D项“类似”形容大致相像，均符合文意，保留。B项“全新”与C项“独特”均体现不一样的语义，与文意不符，排除。\n第一空，由后文转折词“但”可知，转折前后语义相反，转折后指出现在研究发现内外太阳系的行星成分有相似之处，故转折前应表达二者最初成分不同，D项“大相径庭”比喻相差很远，大不相同，符合文意，保留。A项“大同小异”指大体相同，略有差异，体现出的差异很小，与文意不符，排除。\n第二空，代入验证。D项“吞噬”比喻吞并湮灭，符合文意，当选。\n故正确答案为D。\n【文段出处】《将太阳系一分为二的“守门员”并非木星》","no":39,"missingImage":false},{"type":"question","qid":"2719337","cat":"逻辑填空","stem":"随着各种侦察手段的不断演进，可视侦察、红外侦察、雷达侦察等“            ”，现代坦克在战场上越来越难以藏身。对此，现代坦克当然不会“            ”。在讲求“发现即摧毁”的现代战场上，坦克必须实现对侦察手段的“免疫”，见招拆招，            ，让对手对自己庞大的身躯“视若无睹”。\n依次填入画横线部分最恰当的一项是：","options":{"A":"齐头并进  束手就擒  对症下药","B":"大显身手  自暴自弃  见机行事","C":"虎视眈眈  坐以待毙  有的放矢","D":"明察秋毫  知难而退  多管齐下"},"answer":"C","explanation":"第一空，根据前文“各种侦察手段的不断演进，可视侦察、红外侦察、雷达侦察”和后文“现代坦克在战场上越来越难以藏身”可知，各种侦察手段的发展导致坦克很难不被发现，故横线处所填成语应体现出侦察能力强劲的语义，B项“大显身手”形容充分地显示出本领和才能，符合文意，保留；C项“虎视眈眈”意思是像老虎那样凶狠地盯着，形容心怀不善，伺机攫取，此处由于双引号可表形象表达，将各种侦察手段拟人化，对坦克心怀不善，符合文意，且“视”和“侦察”前后呼应，保留。A项“齐头并进”形容有几个事情或一个事情多方面不分先后地同时进行，D项“明察秋毫”侧重强调任何细小的事物都能看得很清楚，后多形容人能洞察事理，均与文意不符，排除。\n第二空，根据横线前指代词“此”，指代前文各种侦察手段不断演进导致坦克难以藏身的状况，以及后文“见招拆招”可知，面对如此情况，坦克需要想解决办法，而不能放弃隐藏，又因横线前出现否定词“不会”，故横线处所填成语需体现出放弃抵抗的语义，C项“坐以待毙”指坐着等死，形容在极端困难中，不积极想办法找出路，符合文意，保留。B项“自暴自弃”形容自己甘心落后，不求上进，与文意不符，排除。\n第三空，代入验证。C项“有的放矢”比喻说话、做事有针对性，与前文“见招拆招”构成并列，即坦克能有针对性地应对各种侦察招式，符合文意，当选。\n故正确答案为C。\n【文段出处】中国军网《盘点现代坦克隐身技巧》","no":40,"missingImage":false},{"type":"question","qid":"2719344","cat":"片段阅读","stem":"“藏粮于地、藏粮于技”是习近平总书记对粮食安全的战略部署，“软硬件”同时发力将助力提升农业生产率和土地产出率。随着现代科技手段的注入，农业科技创新既帮助农民不断克服疫情带来的影响，又让农业生产更加精准高效。袁隆平的超级杂交水稻、李登海的紧凑型杂交玉米······一批又一批领先国际的粮食品种不断被培育出来。从地瘠“斗笠田”到丰产“吨粮田”，从“汗滴禾下土”到“无接触式春耕”，从“灾殃难测”到“高科技防灾”，现代科技为我国农耕注入了“硬核生产力”。这就意味着粮食丰收，库存充裕，藏粮于民，才会国泰民安。\n最适合做这段文字标题的是：","options":{"A":"民为国基，谷为民命","B":"粮食生产“稳”字当头","C":"藏粮于民，才能国泰民安","D":"提升科技水平，保障粮食安全"},"answer":"D","explanation":"文段首先用习近平总书记的战略部署引出粮食的话题。接着通过“既······又······”介绍了农业科技创新给农业带来的积极影响，并进行举例说明。后文进一步强调“现代科技为我国农耕注入了‘硬核生产力’”。尾句“这就意味着”指代前文现代科技注入我国农耕，阐述这有利于粮食安全。由此可知，文段主要强调科技对于粮食安全具有重要意义，主题词为“科技”，D项契合文段重点，当选。\nA、B、C三项均未涉及文段的主题词“科技”，排除。\n故正确答案为D。\n【文段出处】《粮食安全无虞，大国仍须重稷》","no":41,"missingImage":false},{"type":"question","qid":"2719347","cat":"片段阅读","stem":"一般而言，城市群之间的交通干线分布着许多城市，聚集着大量产业和人口，从而构成经济带。加强经济带规划和经济带上城市建设，是建设现代化区域发展体系和促进区域协调发展的重要方面。为此，应依托重要交通干线聚集经济要素，形成纵向或横向的经济发展轴，充分发挥其对统筹区域协调发展的作用。比如，沿海经济带、长江经济带、陇海兰新经济带和京广京哈经济带等已经集聚了大量人口、产业，城市分布也比较密集，形成了比较明显的经济发展轴，已成为承东启西、连南贯北的经济主骨架。\n这段文字意在说明：","options":{"A":"经济带建设对区域协调发展具有重要意义","B":"我国区域经济发展应以城市群建设为依托","C":"交通干线承担着聚集经济要素的重大使命","D":"形成经济发展轴是城市群建设的长远目标"},"answer":"A","explanation":"文段首先指出交通干线分布着许多城市，聚集着大量产业、人口，从而构成经济带，引出经济带这一话题，接着介绍加强经济带规划和建设对区域协调发展有着重要作用。后文通过“应”引出对策，强调应依托构成经济带的重要经济要素，形成经济发展轴，以发挥对统筹区域协调发展的作用。尾句举例说明目前已有的经济带已经形成了经济发展轴，成为“承东启西、连南贯北”的经济主骨架，即经济带对促进区域协调发展已经起到了作用。整个文段围绕促进区域协调发展展开，重在强调经济带在促进区域协调发展中的重要作用，对应A项。\nB项，“城市群”为引出话题部分，非文段重点，排除；\nC项，“交通干线”为构成经济带的要素，非文段重点，且未提及“区域发展”这一核心话题，排除；\nD项，“城市群建设”为引出话题部分，非文段重点，文段重在围绕“促进区域协调发展”展开，排除。\n故正确答案为A。\n【文段出处】人民日报《建设现代化区域发展体系》","no":42,"missingImage":false},{"type":"question","qid":"2719353","cat":"片段阅读","stem":"在现代化进程中，城的比重上升，乡的比重下降，是客观规律，但在我国拥有近14亿人口的国情下，不管工业化、城镇化进展到哪一步，农业都要发展，乡村都不会消亡，城乡将长期共生并存，这也是客观规律。即便我国城镇化率达到\u003cimg data-k=\"77c9df82ee00\">，农村仍将有4亿多人口。如果在现代化进程中把农村4亿多人落下，到头来“一边是繁荣的城市、一边是凋敝的农村”，这不符合我们党的执政宗旨，也不符合社会主义的本质要求。这样的现代化是不可能取得成功的！40年前，我们通过农村改革拉开了改革开放大幕。40年后的今天，我们应该通过振兴乡村，开启城乡融合发展和现代化建设新局面。\n这段文字主要谈的是：","options":{"A":"城镇化建设","B":"全面建成小康社会","C":"乡村振兴战略","D":"脱贫攻坚"},"answer":"C","explanation":"文段开篇通过转折词“但”转折强调我国国情决定了“农业都要发展，乡村都不会消亡，城乡将长期共生并存”，即强调“乡村”发展的重要性；接下来指出农村人口众多，通过反面论证强调“凋敝的农村”不符合党的宗旨、社会主义的本质、现代化要求，即强调农村要繁荣；文段后半部分由40年前后对比的背景，引出对策，强调应该“振兴乡村”；故文段主要谈的是“乡村振兴战略”，对应C项。\nA项，“城镇化建设”出现在背景介绍的内容中，并非文段主要谈论的话题，排除；\nB项，“全面建成小康社会”、D项，“脱贫攻坚”文段均未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】人民日报《把乡村振兴战略作为新时代“三农”工作总抓手》","no":43,"missingImage":false},{"type":"question","qid":"2719355","cat":"片段阅读","stem":"目前的全球治理体系是现代文明的产物，是经过长时间博弈和磨合后逐渐形成的。当前的全球治理体系存在两方面问题：一是这一体系仍存在许多合理性，对人类和平与发展有十分重要的作用，但随着时代的发展，这一治理体系及其体制机制未能适应新情况，出现了许多问题，亟需进行改革；二是现代化先发国家在这一体系中仍占据主导地位，长期把控国际外交话语权，将以资本为中心的逻辑贯穿于全球治理体系和治理体制机制。因此，要将构建人类命运共同体理念融入既有的全球治理体系及其相应体制机制，就必须正视上述两方面。\n这段文字接下来最可能讲的是：","options":{"A":"我国参与全球治理体系改革的路径","B":"人类命运共同体理念的形成与发展","C":"全球治理体系所面临的机遇与挑战","D":"当前全球治理体系存在的制度缺陷"},"answer":"A","explanation":"文段开篇介绍当前全球治理体系如何形成，接下来指出当前全球治理体系存在两方面的问题，即“不适应新情况”以及“在现代化先发国家长期主导下，以资本为中心带来诸多弊端”。尾句“因此”总结前文提出“必须正视上述两方面”的问题。故接下来应围绕解决“当前的全球治理体系”存在的问题提出对策，即“全球治理体系改革”，对应A项。\nB项，“人类命运共同体理念”偏离文段最后论述的核心话题“全球治理体系”，排除；\nC项，文段尾句主要强调如何正视问题，故下文不可能围绕“机遇”进行论述，排除；\nD项，当前存在的“制度缺陷”文段已经论述过，排除。\n故正确答案为A。\n【文段出处】《郑长忠：为世界谋大同而凝聚共识——中国外交话语权提升的逻辑与路径》","no":44,"missingImage":false},{"type":"question","qid":"2719308","cat":"片段阅读","stem":"早在先秦时期，我国就逐渐形成了以炎黄华夏为凝聚核心、“五方之民”共天下的交融格局。秦国“书同文，车同轨，量同衡，行同伦”，开启了中国统一的多民族国家发展的历程。此后，无论哪个民族入主中原，都以统一天下为己任，都以中华文化的正统自居。分立如南北朝，都自诩中华正统；对峙如宋辽夏金，都被称为“桃花石”；统一如秦汉、隋唐、元明清，更是“六合同风，九州共贯”。秦汉雄风、大唐气象、康乾盛世，都是各民族共同铸就的历史。今天，我们实现中国梦，就要紧紧依靠各族人民的力量。\n这段文字意在说明：","options":{"A":"我们悠久的历史是各民族共同书写的","B":"我们辽阔的疆域是各民族共同开拓的","C":"我们灿烂的文化是各民族共同创造的","D":"我们伟大的精神是各民族共同培育的"},"answer":"A","explanation":"文段开篇介绍先秦时期我国就已经形成的交融格局，接下来通过不同朝代举例论证中国统一的多民族国家发展的过程，而后通过“······都是各民族共同铸就的历史”总结全文，故文段重点强调中国历史是各民族共同铸就的，对应A项。\nB项，文段没有提及“辽阔的疆域”，无中生有，排除；\nC项，由“此后，······都以中华文化的正统自居”可知，“文化”对应分句例子中的内容，非文段重点，排除；\nD项，文段没有提及“伟大的精神”，无中生有，排除。\n故正确答案为A。\n【文段出处】《习近平：在全国民族团结进步表彰大会上的讲话》","no":45,"missingImage":false},{"type":"question","qid":"2719315","cat":"片段阅读","stem":"《汉书·平帝纪》记载，元始二年，“民疾疫者，舍空邸第，为置医药”，提出了“隔离”是防疫的重要举措。明代中期我国就出现了预防天花的“人痘”接种术。18世纪末，英国科学家爱德华·琴纳发明了接种牛痘预防天花的方法，经过几代科学家不懈努力，最终研制出灭活天花病毒的疫苗。随着现代医学科技发展和公共卫生基础设施不断完善，霍乱、鼠疫、流感等曾经对人类造成巨大危害的传染病逐渐得到了有效控制。近些年来，在抗击严重急性呼吸综合征（SARS）、中东呼吸综合征（MERS）、甲型H1N1流感、埃博拉病毒等多次重大传染病中，科学技术都发挥了重要作用。新中国成立以来，我国通过传染病重大科技专项研发部署，在传染病防治领域的科研水平、技术能力、平台建设、人才队伍等方面都有了明显提升。\n这段文字主要说的是：","options":{"A":"中西方在疫情防治理念方面存在诸多共性","B":"借鉴历史经验对于防控疫情具有重要意义","C":"疫情防控离不开国家自上而下的科学部署","D":"科学发展和技术创新有助于人类战胜疫情"},"answer":"D","explanation":"文段开篇引入防疫举措，接着举例说明古今中外通过科学技术发展，成功抗击诸多疫情，故文段主要强调科学技术对抗疫的重要作用，对应D项。\nA项，文段没有进行中西方在疫情防治理念方面异同的比较，故“存在诸多共性”，无中生有，排除；\nB项，“历史经验”对应文段举例内容，非重点，且缺少文段主题词“科学技术”，排除；\nC项，文段没有提及“自上而下”，无中生有，且文段强调的是科学技术发展，偏离文段核心话题，排除。\n故正确答案为D。\n【文段出处】《为打赢疫情防控阻击战提供强大科技支撑》","no":46,"missingImage":false},{"type":"question","qid":"2719329","cat":"语句表达","stem":"虽然物质生产是社会生活的基础，但上层建筑也可以反作用于经济基础，生产力和生产关系、经济基础和上层建筑之间有着十分复杂的关系，有着作用和反作用的现实过程，并不是单线式的简单决定和被决定逻辑。世界上的事物总是有着这样那样的联系，不能孤立地静止地看待事物发展，                    。正所谓“有无相生，难易相成，长短相形，高下相倾，音声相和，前后相随”。在观察社会发展时，一定要注意这种决定和被决定、作用和反作用的有机联系。对生产力标准必须全面准确理解，不能绝对化，不能撇开生产关系、上层建筑来理解生产力标准。\n填入画横线部分最恰当的一项是：","options":{"A":"广袤的自然界是如此，丰富的精神世界也是如此","B":"每一个事物各部分、要素之间都存在联系","C":"否则往往会出现盲人摸象、以偏概全的问题","D":"任何事物都与周围的其他事物相互联系着"},"answer":"C","explanation":"横线位于文段中间，需要结合上下文内容进行分析。前文指出物质生产是基础，然后通过转折关联词“但”强调上层建筑可以反作用于经济基础，并且论述了生产力和生产关系、经济基础和上层建筑的关系比较复杂。接着论述世界上的事物是联系的，不能孤立静止地看待，横线后的内容强调了万事万物相辅相成、相互依存，要全面理解，不能绝对化。可知，文段的逻辑是提出问题—分析问题—解决问题，首先论述万事万物不能孤立看待，接着分析孤立看待的后果，结尾则针对上文的问题给出对策即要全面看待，那么横线应填的内容为孤立看待事物的后果或者影响，对应C项。\nA项，体现不出孤立看待的结果，且与后文联系不紧密，排除；\nB项，“都存在联系”与横线前的内容“不能孤立地静止地看待”衔接不恰当，排除；\nD项，与横线前内容“世界上的事物总是有着这样那样的联系”表意重复，衔接不当，体现不出孤立看待的结果，排除。\n故正确答案为C。\n【文段出处】《坚持历史唯物主义不断开辟当代中国马克思主义发展新境界》","no":47,"missingImage":false},{"type":"question","qid":"2719334","cat":"片段阅读","stem":"早在战争年代，毛泽东同志就强调，各级指挥员必须首先是军事技术专家。20多年前，钱学森同志在展望21世纪时大声疾呼：未来在挑战，军人比任何时候都需要科学，我们要有紧迫感。然而，由于受传统的“重道轻器”等思想的影响，部分指挥员“智谋”有余、“技谋”不足。我们应该清醒认识到，科技是问鼎世界一流军队的“强大引擎”，技术决定战术是制胜铁律，各级指挥员不重视“技谋”就无法有效形成实战能力。惟有那些科技知识的博学者、科学技术的领跑者，才能在未来战场上运筹帷幄、决胜千里。\n最适合做这段文字标题的是：","options":{"A":"“重道轻器”可休矣","B":"现代战场“技谋”不可弱","C":"英雄当以“谋”为先","D":"指挥员的“制胜密码”"},"answer":"B","explanation":"本题为标题填入题。文段首先阐述了战争年代，毛泽东同志强调军事技术专家的重要性，随后论述了钱学森同志对于军人需要科学的紧迫感的呼吁，紧接着通过转折关联词“然而”提出问题：即部分指挥员“智谋”有余、“技谋”不足。后文通过“应该”提出对策，强调科技、技术的重要性，接下来通过反面论证及正面论证加强论证前文观点。故文段重点强调在战场中，要重视科技、技术，B项“技谋”为科技、技术的同义替换。\nA项，“重道轻器”非文段论述重点，文段重点强调的是“技谋”，排除；\nC项，“谋”为先，表述不明确，文段强调的“谋”即“技谋”，排除；\nD项，“指挥员”出现在反面论证和开头背景引入部分，非文段论述重点，且“制胜密码”，表述不明确，排除。\n故正确答案为B。\n【文段出处】《“技谋”不可弱》","no":48,"missingImage":false},{"type":"question","qid":"2719338","cat":"片段阅读","stem":"港珠澳大桥的沉管隧道是世界岛隧工程历史上首个真正意义上的外海深水安装沉管隧道，具有划时代的意义。大桥主体结构的设计使用寿命长达120年，这意味着在一个多世纪的时间里，桥体的核心结构，尤其是6.7公里长的沉管隧道不能出现丝毫的质量问题。大桥的隧道由33节沉管连接而成，每节标准沉管相当于一艘满载的“辽宁号”航母。如此巨大的沉管，还要保证0.5毫米以下这一苛刻的误差限度，这使得它的运输过程不允许出现丝毫差池——不能远距离运输，更不可能在陆地上建好再辗转进入海中。因此，工程师们在距离大桥不远的桂山牛头岛，专门建设了一座沉管管节预制工厂，并采用最先进的流水线进行生产。\n关于港珠澳大桥，这段文字主要介绍的是：","options":{"A":"主体结构的设计标准","B":"施工中对质量的严格把控","C":"保证核心结构质量的措施","D":"在世界桥梁史上的标志意义"},"answer":"C","explanation":"文段开篇介绍港珠澳大桥沉管隧道的划时代意义。接着介绍“大桥主体结构的设计使用寿命长达120年”，并提出“质量问题”的重要性。接下来介绍了大桥沉管的设计和“苛刻的误差限度”，并表明“运输过程不允许出现丝毫差池“，进一步从多个方面阐述了对“质量”的苛刻要求。尾句则承接前文问题，说明了工程师们采取了就近建设专门的工厂的措施来保证质量。故文段主要围绕“核心结构”“质量”两个核心词来阐述说明，同时包含这两个关键词的，对应C项。\nA、B两项，均仅对应文段中部分非重点内容，过于片面，排除；\nD项，属于铺陈背景方面的内容，非重点内容，排除。\n故正确答案为C。\n【文段出处】《港珠澳大桥正式开通！一键解析建造技术究竟有多牛》","no":49,"missingImage":false},{"type":"question","qid":"2719343","cat":"语句表达","stem":"戴口罩等遮挡条件下的人脸识别其实是一项“老”技术，此前研究人员在解决军事刑侦和视频监控问题时就曾长期研究过该技术，并发展出诸多成熟应用。因此，                    。但是以往的技术基础并没有完全打消人们对戴口罩人脸识别“先天不足”的顾虑。相较于以往，口罩遮挡住面部，使得人脸识别系统收集到的面部信息大量减少。不过研究表明，人脸识别的关键信息集中于眉毛和眼睛，只要模型训练得当，戴口罩人脸识别的准确率并不会大幅下降。\n填入画横线部分最恰当的一项是：","options":{"A":"提高识别精度才是这一技术的难点所在","B":"该技术的稳定性和准确率是有一定基础的","C":"人脸识别技术已经被广泛应用于各个领域","D":"人脸识别并不需要对全脸进行整体识别"},"answer":"B","explanation":"横线位于文段中间，应根据上下文内容进行分析。文段开头介绍了人脸识别技术是一项“老”技术，在之前已经经过长期研究并成熟应用，接下来通过结论词“因此”引出横线处所填内容。横线后用“但是”表示转折，强调以前的技术没有完全打消人们的顾虑，并对此进行具体说明，即转折后强调以前的技术存在不足。故横线处所填内容应阐述技术存在好的一面，B项“该技术的稳定性和准确率是有一定基础的”，且也能呼应横线前“‘老’技术”的说法，当选。\nA项，“技术的难点所在”为问题的表述，不能与后文构成转折，排除；\nC项，“广泛应用”与前后文话题无关，排除；\nD项，重点还是围绕人脸识别进行展开，而根据横线前的“该技术”以及横线后的“对戴口罩人脸识别‘先天不足’的顾虑”都可知，整体是在围绕“戴口罩人脸识别”这一技术进行论述，表述不够准确，排除。\n故正确答案为B。 \n【文段出处】科学网《戴口罩也能人脸识别》","no":50,"missingImage":false},{"type":"question","qid":"2719346","cat":"语句表达","stem":"①世界上人居环境最好的部分发达国家及其城市，都是很早就实行垃圾分类、分类类别十分精细的地区\n②道理人人都懂，但长期以来生活垃圾分类投放在我国难以真正落实，相关工作的推进一直无从入手\n③往大处说，推进垃圾分类制度，实现垃圾减量化、资源化、无害化处理，关系到我国能否建成环境友好型、资源节约型社会\n④垃圾分类是城市发展水平和社会文明水平的一个重要体现\n⑤从小处看，推进垃圾分类工作关系广大人民群众的生活环境和城市的清洁美丽宜居程度\n⑥事实上，垃圾分类看起来不起眼，却是城市生活方式和治理模式的一次革命，是践行生态与资源循环理念的关键举措\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"①⑥④③⑤②","B":"⑥③⑤④②①","C":"④①⑤③②⑥","D":"⑤③⑥②①④"},"answer":"C","explanation":"首先，根据选项判断首句，①句介绍了部分发达国家和城市很早就实行了垃圾分类，④句给垃圾分类做定性判断强调其重要性，按逻辑顺序可知，一般情况下是先讨论垃圾分类很重要，然后用具体实例进行论证，因此④句大概率在①句之前。排除A、D两项。⑥句出现“事实上”为关联词语后半部分，一般不用于首句，排除B项，答案基本锁定C项。\n验证C项，④句强调“垃圾分类”的重要性，①句以“人居环境最好的部分发达国家及其城市”对首句观点进行论证。⑤③两句分别从小处和大处两个方面介绍实行垃圾分类的意义，②句提出我国垃圾分类难以真正落实，⑥句转折再次强调垃圾分类的重要性，也就是强调我们要去实行垃圾分类，逻辑通顺，表述合理，当选。\n故正确答案为C。\n【文段出处】《推进垃圾分类，让城市治理迈上新台阶》","no":51,"missingImage":false},{"type":"question","qid":"2719350","cat":"语句表达","stem":"①原因就在于原子核内部的质子和中子数量越多，其状态也就越不稳定，越容易发生放射性的衰变\n②当越来越多的质子和中子聚集在一起，带正电荷的质子之间的斥力就越来越大\n③人们可以在实验室里通过人工方式合成自然界中不存在的元素，但却不能合成无限多的原子核\n④在原子核内部，质子和中子等粒子通过强相互作用结合在一起，这几乎是宇宙中最强的相互作用\n⑤中子之间也会有一些排斥，强相互作用越来越难以束缚，不足以维持原子核的稳定\n⑥在人类已经发现或是制造出的3000多种原子核中，只有288种是稳定的\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"②④⑤⑥③①","B":"③①④②⑤⑥","C":"④⑤⑥①②③","D":"⑥②③①④⑤"},"answer":"B","explanation":"首先，根据选项判断首句，②句介绍越多的质子和中子聚集，质子间斥力越大；③句介绍人们不能合成无限多的原子核；④句介绍在原子核内部质子和中子结合的相互作用力；⑥句介绍在人类已经发现的原子核中只有很少一部分是稳定的。首句不好判断，找其他线索。⑤句中“也”提示前后应为并列结构，说明⑤句之前要提到其他粒子间存在排斥，结合选项，⑤句前分别为④、②两句，②句中提到质子间斥力，可以与⑤句构成并列，而④句介绍粒子间结合在一起的相互作用力，并非斥力，无法与⑤句构成并列，故②⑤两句捆绑，只有B项符合，当选。\n故正确答案为B。\n【文段出处】三联生活周刊 《第117号元素》","no":52,"missingImage":false},{"type":"question","qid":"2719291","cat":"片段阅读","stem":"与线下教学相比，由于时空差异，线上教学更加依赖于教师的指导和帮助，对资源的需求更大。然而，在知识经济时代，教师早已不再是知识垄断者，网络社会中的个体都有可能成为兼具知识消费者和生产者的双重角色。因此，推动社会力量参与在线教育资源供给，需要改变学校“单打独斗”的传统教育格局，以开放的态度接纳企业在线教育服务。例如，学校可适当采取外包的形式，向那些通过资质审核的教育机构、企业购买网络课程服务，提供“智能\u003cimg data-k=\"3d6d1f96db11\">真人”的双引擎驱动教学服务。此外，双方还可在资源支持、学情监测、评价反馈等方面加强协同创新，促进在线教育的健康发展。\n这段文字意在说明：","options":{"A":"“智能\u003cimg data-k=\"3d6d1f96db11\">真人”是教育服务的发展趋势","B":"教育资源供给来源不再局限于学校内部","C":"共享经济时代在线教育将成为一种常态","D":"在线教育的健康发展需要引入社会力量"},"answer":"D","explanation":"文段开篇指出线上教学更依赖于教师的指导，接着通过转折词“然而”介绍了在知识经济时代，每个个体都有可能成为兼具知识消费者和生产者的双重角色。随后通过“因此”得出结论，强调推动社会力量参与在线教育资源供给。最后通过“例如”举例说明如何推动社会力量参与。故文段重点在结论，强调要推动社会力量参与在线教育资源供给，对应D项。\nA项，“智能\u003cimg data-k=\"3d6d1f96db11\">真人”对应文段例子部分，非重点，排除；\nB项，缺乏主题词“在线教育”，排除；\nC项，“共享经济时代”无中生有，排除。\n故正确答案为D。\n【文段出处】《加快在线教育资源共享需要社会力量》","no":53,"missingImage":false},{"type":"question","qid":"2719295","cat":"片段阅读","stem":"人们在评判手机拍照功能时，总是直观地认为手机像素越高，拍照效果越好。事实真的是这样吗？从成像原理来看，像素值的大小对生成的图像会产生一定的影响。当手机的图像传感器面积一定的时候，像素值越高，单位像素面积就越小。而单位像素面积又直接影响到进光量，单位像素面积越小，图像传感器上进光量就越少，拍摄出的照片就会变得灰暗模糊；像素值越低，单位像素感光面积大，感光性能更好，因此在成像的高感光画质以及画面层次等方面都有更好的表现。\n这段文字接下来最有可能：","options":{"A":"阐述像素的定义及其提升途径","B":"介绍提高手机拍照效果的技巧","C":"揭示进光量与像素值间的关系","D":"指出影响手机成像效果的因素"},"answer":"D","explanation":"由提问方式可知，本题为接语选择题。文段开篇指出人们通常认为手机像素越高，拍照效果越好，随后以提问\u003cimg data-k=\"3d6d1f96db11\">回答的形式详细阐述，并非像素越高成像效果越好。因此后文应围绕如何保证手机成像效果进行进一步的说明，对应D项。\nA项，“像素”与“手机成像效果”之间的关系在文段中已经论述过，因此后文基本不会再围绕“像素的定义及其提升途径”展开论述，排除；\nB项，文中重点论述内容是手机的成像效果，“手机拍照效果”概念扩大，排除;\nC项，“进光量与像素值间的关系”为文段中已详细展开说明的内容，后文不会再对其展开介绍，排除。\n故正确答案为D。\n【文段出处】人民网《手机像素越高拍照效果越好？照片质量与多因相关》","no":54,"missingImage":false},{"type":"question","qid":"2719298","cat":"片段阅读","stem":"水田不单单是水稻的种植区，也可以是稻香水美、鱼肥虾壮的养殖场。传统矮秆水稻因为追求最大产量，都采用密植栽种，加上植株株秆矮小，水田中空间狭窄，导致空气流通不好，水中有效含氧量降低，不利于开展水田综合种养结合生产，而高秆水稻株型高大、叶茂且冠层高，植株间距较为稀疏，可为蛙、鱼和泥鳅等稻田养殖动物提供良好的栖息环境，具有适宜种养结合的优势，较好地解决了植株过密导致的水田上方空气对流不充分、空间不足的问题。与现在常见的稻田综合种养模式相比，该模式的经济效益显著提升，将极大地提升农民种植的积极性。\n根据这段文字，高秆水稻种植：","options":{"A":"克服了传统矮秆水稻种植模式的弊端","B":"催生了种养结合的新型种植模式","C":"将成为未来水稻种植业的发展方向","D":"为稻田养殖动物提供了良好的栖息地"},"answer":"D","explanation":"文段开篇引出话题，指出水田不仅是种植区，也可以是养殖场。随后介绍了传统矮秆水稻因种植方式及自身原因并不利于种养结合生产，紧接着通过介绍高秆水稻的优势，与传统矮秆水稻形成对比，突出强调高秆水稻为一些稻田养殖动物提供良好的栖息环境，具有种养结合的优势，尾句为补充说明，说明了种养结合生产的意义，即提升经济效益及农民积极性，故文段旨在强调高秆水稻有利于“养殖”，为养殖动物提供良好的栖息环境，对应D项。\nA项，“克服······弊端”表述不明确，且“种植模式”偷换概念，应为“种养模式”，排除；\nB项，文段指出“与现在常见的稻田综合种养模式相比”，说明“稻田综合种养模式”已然存在，未提及高秆水稻催生了“种养结合的新型种植模式”，无中生有，排除；\nC项，文段仅说明高秆水稻的优势，未提及未来的“发展方向”，无中生有，排除。\n故正确答案为D。","no":55,"missingImage":false},{"type":"question","qid":"2719301","cat":"片段阅读","stem":"过去近20年间，地球深部生命研究取得的重要进展之一便是发现了海底洋壳生物圈，洋壳的体积庞大，是全球海洋沉积物总体积的5倍左右，栖息于此的微生物规模巨大，不可忽视，它们对全球生物地球化学元素循环和海底地貌风化都具有重要的潜在影响。然而，受采样技术和条件的限制，目前对洋壳岩石生物圈的研究和认识还十分有限。此前，有限的研究几乎全部集中于洋壳表层的玄武岩中，而对占洋壳体积近三分之二的下洋壳，尽管认为其也是深部微生物的可栖息环境之一，但尚缺少直接的证据，对栖息于此的微生物及其对极端环境的应对策略研究还是空白。\n这是一篇文章的开头，这篇文章最可能介绍：","options":{"A":"海底洋壳生物圈的发现过程和重要意义","B":"全球海洋沉积物在海底的分布特征","C":"海底地貌风化对微生物生存的影响","D":"海洋下洋壳中的深部微生物及其生存策略"},"answer":"D","explanation":"此题提问方式比较特殊，为接语选择题的变形。文段开篇引出海底洋壳生物圈这一话题并阐述其重要影响，接下来通过转折关联词“然而”指出目前对其认识和研究不足的现状，尾句先是阐述之前的研究主要集中在“洋壳表层”，而对于“下洋壳”的研究不足，而后通过转折关联词“但”进一步指出对生存于此的微生物及其生存策略研究还是空白，故下文应围绕生存在海洋下洋壳中的深部微生物及其生存于此的策略展开详细论述，对应D项。\nA项，“海底洋壳生物圈”为文段开篇的话题，而后文着重强调对于海洋下洋壳中的深部微生物研究不足，偏离文段最后谈论的核心话题，排除；\nB项，未包含文段论述的核心话题“下洋壳”，偏离文段中心，排除；\nC项，“海底地貌风化”对应文段首句，偏离文段最后谈论的核心话题“下洋壳”，排除。\n故正确答案为D。\n【文段出处】《国际顶尖学术期刊发表同济大学李江涛副教授等最新研究成果：揭示了海洋下洋壳岩石中存在的深部生命圈及其生存策略》","no":56,"missingImage":false},{"type":"question","qid":"2719304","cat":"片段阅读","stem":"大数据、人工智能脱胎于网络，而又与网络的侧重点不同。网络强调的是设备和主体之间的连接，是信息社会的基础设施。大数据是因网络的连接和对世界的数字化而形成的数据资源；人工智能则是在大数据的基础上通过反复训练进化而成的处理数据的智慧体系。就当前的发展形势而言，中国拥有世界上最大的网民群体和网络基础设施体系，世界上最大的移动互联网用户群体、电子商务客户群体、电子金融和社交媒体用户群体等，这使得中国成为世界上大数据规模最大的国家，并由此产生了丰富的应用实践和人工智能衍生产品。\n这段文字主要介绍：","options":{"A":"网络、大数据和人工智能之间的关系","B":"中国发展大数据、人工智能的优势","C":"中国互联网用户群体的构成情况","D":"人工智能衍生产品的发展基础"},"answer":"B","explanation":"文段首先引出大数据、人工智能的话题，指出它们与网络的侧重点不同，并对此进行具体介绍。后文介绍中国在网络等方面的情况，“这使得”引出结论，指出这些情况使得“中国成为世界上大数据规模最大的国家，并由此产生了丰富的应用实践和人工智能衍生产品”。由此可知，文段重在强调我国在网络等方面的情况有助于发展大数据、人工智能，即我国发展大数据、人工智能具有优势，对应B项。\nA项，对应文段首句引入话题部分，非重点，排除；\nC项，对应“这使得”之前的内容，非重点，排除；\nD项，未涉及到“大数据”，表述片面，排除。\n故正确答案为B。\n【文段出处】《统筹治理大数据与人工智能》","no":57,"missingImage":false},{"type":"question","qid":"2719310","cat":"片段阅读","stem":"近年来，3D打印技术开始应用于食品、建筑、医疗卫生、航空航天等多个领域。随着3D打印技术在金属零部件制造上取得较大进展，各国开始探讨其在武器装备制造与维修中的应用。研究表明，3D打印对军用武器及设施维修效果显著，能直接在战场上把需要的零部件“打印”出来，及时、精准完成受损装备的维修，快速恢复其作战能力。然而，这种方式制造的军用设备有着不可避免的缺陷，对装备材料要求极高的军用设备来说，除了尺寸受限，其强度和质量也令人担忧。受技术、成本的限制，3D打印技术难以取代大规模流水线生产。\n这段文字主要介绍了3D打印技术：","options":{"A":"广阔的应用前景","B":"取得的最新进展","C":"在军事领域的应用情况","D":"与大规模流水线生产的区别"},"answer":"C","explanation":"文段首先交代背景，引出3D打印技术这一话题，接着指出各国探讨其在武器装备制造与维修中的应用，随后介绍其对军用武器及设施维修效果显著。接下来通过转折词“然而”指出3D打印技术在制造军用设备中存在不可避免的缺陷，难以取代大规模流水线生产。故文段主要介绍3D打印技术在军事领域的应用情况，对应C项。\nA项，“广阔的应用前景”无中生有，且未提及主题词“军事”，排除；\nB项，“取得的最新进展”对应文段转折前的内容，非重点，且未提及主题词“军事”，排除；\nD项，“与大规模流水线生产的区别”非重点，且未提及主题词“军事”，排除。\n故正确答案为C。\n【文段出处】科技日报《3D打印并非武器界“神笔马良”》","no":58,"missingImage":false},{"type":"question","qid":"2719313","cat":"片段阅读","stem":"登陆火星并不是一件容易的事。地球和火星最近时，也有5600万千米的距离，是地球和月亮距离的140倍，想要靠火箭的动力突破这一距离，目前是不可能的。因此，需借助地球的公转把探测器“甩”到火星，不过，需要合适的时机，这就是“发射窗口”。当火星探测器到达远日点，与火星轨道相切时，火星也正好运行到那里，探测器才能与火星交会。在这个时间窗口发射火星探测器，不仅是最省能量的，探测器的有效载荷也会相应增多。这种特定的时机和位置每隔26个月才出现一次。\n这段文字主要：","options":{"A":"强调探测器登陆火星的技术难点","B":"说明探测器“发射窗口”稍纵即逝的特点","C":"描述火星探测器的理想运行轨迹","D":"解释要抓住窗口期发射火星探测器的原因"},"answer":"D","explanation":"文段首先指出登陆火星不容易，接着进行了原因的解释，即距离较远，后文通过“因此”得出结论，又通过“不过”进行转折，强调发射火星探测器需要合适的时机，即“发射窗口”，最后对在窗口期发射火星探测器进行了详细的解释，故文段重在强调为什么要在窗口期发射火星探测器，对应D项。\nA项，“技术难点”对应“因此”之前的内容，非重点，且未提及文段核心话题“窗口期”，排除；\nB项，“稍纵即逝的特点”文段并未提及，无中生有，排除；\nC项，未提及文段核心话题“窗口期”，偏离文段中心，排除。\n故正确答案为D。\n【文段出处】《我们还有多久可以移民火星？》","no":59,"missingImage":false},{"type":"question","qid":"2719314","cat":"片段阅读","stem":"有学者认为，技术文本和政治文献的机器翻译替代人工翻译在未来几年就可能实现，机器翻译译文总体质量超过职业译者也是必然的，甚至文学翻译也同样如此。机器翻译发展到今天已到了第三代，即神经机器翻译，其根本原理就是根据语境化原则建立海量的分门别类的语料库来处理。通过让机器反复学习和训练，语料库文本不断完善，翻译的准确率不断提高，且翻译内容越专业、场景或任务越固定、标准越统一，翻译准确率越高。\n上述文字主要用来反驳以下哪个观点？","options":{"A":"机器翻译不可能取代人工翻译","B":"文学翻译的难度远大于技术文本翻译","C":"机器翻译难以做到准确性与流畅性的统一","D":"机器翻译离不开人工翻译和优化的辅助"},"answer":"A","explanation":"文段开篇引用观点指出技术文本和政治文献的机器翻译有望替代人工翻译，随后分析机器翻译的原理，尾句利用“通过”提出对策说明如何提高机器翻译的准确率。以此来强调首句的观点，故文段主要强调为什么机器翻译能够取代人工翻译，因此反驳了A项“机器翻译不可能取代人工翻译”的观点，A项当选。\nB项，文段没有对“文学翻译”和“技术文本翻译”的难度作比较，无中生有，排除；\nC项，文段没有提到机器翻译“流畅性”，无中生有，排除；\nD项，文段没有提到“人工翻译和优化的辅助”，无中生有，排除。\n故正确答案为A。\n【文段出处】《翻译的过去与未来：机器翻译会取代人工翻译吗？》","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2719398","cat":"数学运算","stem":"某商场开展“助农销售”活动，凡购买某种农产品满300元者可获得一个礼盒，其中装有6种干货中的随机3种各1小袋，以及1袋小米或红豆。问内容不完全相同的礼盒共有多少种可能？","options":{"A":"50","B":"45","C":"40","D":"30"},"answer":"C","explanation":"根据题目条件，从6种干货中随机选出3种，有\u003cimg data-k=\"743a93c75960\">种情况，外加1袋小米或红豆，有2种情况，则内容不完全相同的礼盒共有\u003cimg data-k=\"e90df6756d12\">种可能。\n故正确答案为C。","no":61,"missingImage":false},{"type":"question","qid":"2719400","cat":"数学运算","stem":"某地10户贫困农户共申请扶贫小额信贷25万元。已知每人申请金额都是1000元的整数倍，申请金额最高的农户申请金额不超过申请金额最低农户的2倍，且任意2户农户的申请金额都不相同。问申请金额最低的农户最少可能申请多少万元信贷？","options":{"A":"1.5","B":"1.6","C":"1.7","D":"1.8"},"answer":"B","explanation":"设申请金额最低的农户申请\u003cimg data-k=\"5320a525f2bc\">万元，已知10户贫困农户共申请25万元，要使金额最低的农户申请的金额最少，则令其他农户申请的金额尽可能多。题目中已知申请金额最高的农户申请金额不超过申请金额最低农户的2倍，即最高申请\u003cimg data-k=\"5b8c4ddfee22\">万元，且任意2户农户的申请金额都不相同，同时每人的申请金额都是1000元（0.1万元）的整数倍，则根据这些条件可构造出下表：\n\u003cimg data-k=\"3693ad357103\" style=\"max-width:548px\">\n则\u003cimg data-k=\"607dbb4d7036\">\u003cimg data-k=\"1641eb207602\">\u003cimg data-k=\"90abe866c539\">，即\u003cimg data-k=\"551103c488c9\">，解得\u003cimg data-k=\"72ec7666b5fd\">，由于每人的申请金额都是1000元（0.1万元）的整数倍，则\u003cimg data-k=\"5320a525f2bc\">最少为1.6万元。\n故正确答案为B。","no":62,"missingImage":false},{"type":"question","qid":"2719333","cat":"数学运算","stem":"社区工作人员小张连续4天为独居老人采买生活必需品，已知前三天共采买65次，其中第二天采买次数比第一天多\u003cimg data-k=\"e172e0ad0a10\">，第三天采买次数比前两天采买次数的和少15次，第四天采买次数比第一天的2倍少5次。问这4天中，小张为独居老人采买次数最多和最少的日子，单日采买次数相差多少次？","options":{"A":"9","B":"10","C":"11","D":"12"},"answer":"C","explanation":"设第一天采买的次数为\u003cimg data-k=\"5b8c4ddfee22\">，则第二天采买的次数为\u003cimg data-k=\"094d6f486bf7\">，第三天采买的次数为\u003cimg data-k=\"b5d3b080b477\">，第四天采买的次数为\u003cimg data-k=\"2a8073848662\">，已知前三天共采买65次，则有\u003cimg data-k=\"81b1cd2dd6b8\">，解得\u003cimg data-k=\"58197da10939\">，则这4天采买的次数分别为16次（\u003cimg data-k=\"5b8c4ddfee22\">）、24次（\u003cimg data-k=\"42136d7babe7\">）、25次（\u003cimg data-k=\"e363c78bcb39\">）、27次（\u003cimg data-k=\"f8bcc32437ee\">），所以这4天中单日采买次数最多为27次，最少为16次，相差\u003cimg data-k=\"08da1b155cd0\">次。\n故正确答案为C。","no":63,"missingImage":false},{"type":"question","qid":"2719341","cat":"数学运算","stem":"甲、乙两个单位周末
