？","options":{"A":"王：工会、科研\n卫：人事、教育、财务\n丁：宣传、后勤","B":"王：人事、工会\n卫：宣传、后勤\n丁：科研、教育、财务","C":"王：教育、财务\n卫：人事、后勤\n丁：科研、宣传、工会","D":"王：宣传、后勤\n卫：人事、工会\n丁：科研、教育、财务"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）教育和财务由同一人分管；\n（2）宣传和后勤由同一人分管；\n（3）丁分管的部门比卫多；\n（4）教育、工会中的一个部门由王分管；\n（5）工会、后勤中的一个部门由卫分管。\n第二步：根据题干条件进行推理。\n根据（2）可知宣传和后勤由同一人分管，排除C项；\n根据（3）可知丁分管的部门比卫多，排除A项；\n根据（4）可知教育、工会中的一个部门由王分管，排除D项。\n经验证，B项满足题干所有条件。\n故正确答案为B。","no":71,"missingImage":false},{"qid":"2719416","cat":"类比推理","stem":"如果王分管的部门多于丁，下列哪项可能为真？","options":{"A":"人事由卫分管","B":"科研由卫分管","C":"教育由丁分管","D":"后勤由丁分管"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）教育和财务由同一人分管；\n（2）宣传和后勤由同一人分管；\n（3）丁分管的部门比卫多；\n（4）教育、工会中的一个部门由王分管；\n（5）工会、后勤中的一个部门由卫分管；\n（6）王分管的部门多于丁。\n第二步：根据题干条件进行推理。\n根据条件（6）王分管的部门多于丁和条件（3）丁分管的部门比卫多，可知三人分管部门数量从多到少顺序为王、丁、卫；\n再根据题干条件共有7个部门，可以推出王分管4个部门，丁分管2个部门，卫分管1个部门；\n根据条件（1）和条件（2）可知，卫不分管教育、财务、宣传、后勤，再根据条件（5）可以推出，卫只分管工会，排除A、B两项；\n根据条件（4）教育、工会中的一个部门由王分管，以及卫分管工会可以推出，王一定分管教育，排除C项。\n故正确答案为D。","no":72,"missingImage":false},{"qid":"2719417","cat":"类比推理","stem":"下列哪项是不可能的？","options":{"A":"人事和宣传由王分管","B":"人事和宣传由丁分管","C":"科研和宣传由丁分管","D":"教育和宣传由王分管"},"answer":"A","explanation":"第一步：整理题干条件。\n（1）教育和财务由同一人分管；\n（2）宣传和后勤由同一人分管；\n（3）丁分管的部门比卫多；\n（4）教育、工会中的一个部门由王分管；\n（5）工会、后勤中的一个部门由卫分管。\n第二步：根据题干条件分析选项。\n提问方式出现“不可能”，优先考虑代入法。\nA项代入，人事和宣传由王分管，结合条件（2）可知，王还分管后勤，结合条件（5），卫要去分管工会，又因为条件（4），王要去分管教育，再结合条件（1）可知，王分管教育和财务。此时，王分管人事、教育、财务、宣传和后勤；卫分管工会；丁分管的部门未知，还剩科研一个部门，无论科研是否为丁分管，都不满足条件（3），丁分管的部门比卫多，不可能为真，当选；\nB项代入，人事和宣传由丁分管，结合条件（2）可知，丁还分管后勤，结合条件（5），卫要去分管工会，又因为条件（4），王要分管教育，再结合条件（1）可知，王分管教育和财务。此时，王分管教育和财务；卫分管工会；丁分管人事、宣传和后勤，还剩科研一个部门，无论科研是否为卫分管，均满足条件（3）丁分管的部门比卫多，满足题干所有条件，可能为真，排除；\nC项代入，科研和宣传由丁分管，结合条件（2）可知，丁还分管后勤，结合条件（5），卫要去分管工会，又因为条件（4），王要去分管教育，再结合条件（1）可知，王分管教育和财务。此时，王分管教育和财务；卫分管工会；丁分管科研、宣传和后勤，还剩一个人事，无论人事是否为卫分管，均满足条件（3）丁分管的部门比卫多，满足题干所有条件，可能为真，排除；\nD项代入，教育和宣传由王分管，结合条件（1）和（2）可知，王还分管财务和后勤，再结合条件（5），卫要去分管工会。此时，王分管教育、财务、宣传和后勤；卫分管工会；丁分管的部门未知，还剩人事和科研两个部门，若丁分管人事和科研，满足条件（3）丁分管的部门比卫多，满足题干所有条件，可能为真，排除。\n本题为选非题，故正确答案为A。","no":73,"missingImage":false},{"qid":"2719418","cat":"类比推理","stem":"财务和以下哪个部门不可能由同一人分管？","options":{"A":"人事","B":"科研","C":"宣传","D":"工会"},"answer":"D","explanation":"第一步：整理题干条件。\n（1）教育和财务由同一人分管；\n（2）宣传和后勤由同一人分管；\n（3）丁分管的部门比卫多；\n（4）教育、工会中的一个部门由王分管；\n（5）工会、后勤中的一个部门由卫分管。\n第二步：根据题干条件分析选项。\nA项代入，结合条件（1）可知，教育、财务和人事要同时由一人分管，若此人为丁，则根据条件（2）、（4）、（5）可得：\n\u003cimg data-k=\"58b8f71569d2\" style=\"max-width:700px\">\n若科研由王分管，满足题干所有条件，可能为真，排除；\nB项代入，结合条件（1）可知，教育、财务和科研要同时由一人分管，若此人为丁，则根据条件（2）、（4）、（5）可得：\n\u003cimg data-k=\"f9c857505586\" style=\"max-width:700px\">\n若人事由王分管，可满足题干所有条件，可能为真，排除；\nC项代入，结合条件（1）可知，教育、财务和宣传要同时由一人分管，若此人为王，则根据条件（2）、（4）、（5）可知，卫分管工会，此时若丁分管人事和科研，可得：\n\u003cimg data-k=\"3bb3471ee3e0\" style=\"max-width:700px\">\n满足题干所有条件，可能为真，排除；\nD项代入，结合条件（1）可知，教育、财务和工会要由同一个人分管，此时，教育和工会由同一个人分管，不符合条件（4），教育、工会中的一个部门由王分管，因此该项不可能为真，当选。\n本题为选非题，故正确答案为D。","no":74,"missingImage":false},{"qid":"2719419","cat":"类比推理","stem":"如果科研和宣传由同一人分管，那么下列哪项是可能的？","options":{"A":"人事由卫分管","B":"科研由王分管","C":"教育由丁分管","D":"宣传由卫分管"},"answer":"A","explanation":"第一步：整理题干条件。\n（1）教育和财务由同一人分管；\n（2）宣传和后勤由同一人分管；\n（3）丁分管的比卫多；\n（4）教育、工会中的一个由王分管；\n（5）工会、后勤中的一个由卫分管；\n（6）科研和宣传由同一人分管。\n第二步：根据题干条件分析选项。\n题干问可能为真，可以优先考虑代入法，如下：\n结合条件（2）、（6）可知，宣传、后勤、科研由同一人分管；\nA项代入，若人事由卫分管，结合条件（5）可知，工会、后勤中的一个由卫分管，且结合题干可知宣传、后勤、科研由同一人分管，若要满足条件（3）使丁分管的比卫多，则卫不能分管后勤，则卫分管工会，结合条件（1）、（4）可知，由王分管教育和财务，此时可由丁分管科研、宣传、后勤。即：\n\u003cimg data-k=\"cf3b3cdda3e9\" style=\"max-width:637px\">\n满足题干所有条件，可能为真，当选；\nB项代入，若科研由王分管，则宣传、后勤、科研由王分管，结合条件（5）可知，工会由卫分管，又结合条件（1）、（4）可知，教育和财务也要由王分管。即：\n\u003cimg data-k=\"e2a4198bb854\" style=\"max-width:634px\">\n此时，丁分管的不可能比卫多，与条件（3）不符，不可能为真，排除；\nC项代入，若教育由丁分管，由条件（1）可知，教育和财务均由丁分管，结合条件（4）可知，工会由王分管，结合条件（5）、（6）可知，宣传、后勤、科研由卫分管。即：\n\u003cimg data-k=\"16cd82701299\" style=\"max-width:638px\">\n此时，丁分管的不可能比卫多，与条件（3）不符，不可能为真，排除；\nD项代入，若宣传由卫分管，则宣传、后勤、科研均由卫分管。即：\n\u003cimg data-k=\"eee30fc79116\" style=\"max-width:639px\">\n结合条件（4）可知，教育和工会中的一个由王分管，此时丁分管的不可能比卫多，与条件（3）不符，不可能为真，排除。\n故正确答案为A。","no":75,"missingImage":false},{"qid":"2719382","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"9f15fbd7569e\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"图形元素组成不同，优先考虑属性规律。观察发现，图形中黑白块数量不同，但整体较为规整，考虑对称性。题干图形均只有1条对称轴，且对称轴方向每次逆时针旋转\u003cimg data-k=\"f0149b2f4575\">，故？处应为只有1条对称轴的竖轴对称图形，只有A项符合，当选。\n\u003cimg data-k=\"b293ec243b23\" style=\"max-width:700px\">\n故正确答案为A。","no":76,"missingImage":false},{"qid":"2719385","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"e29328fff7bd\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干每幅图形均存在曲线与直线，且曲直相交，优先考虑曲直交点数。题干每幅图形的曲直交点数均为2个，但无法得出唯一答案。继续观察发现，题干图形相切明显，考虑切点数，每幅图的切点数均为1个，只有C项符合规律。\n故正确答案为C。","no":77,"missingImage":false},{"qid":"2719386","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"d930b021d062\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。题干大部分图形存在扇形，且扇形的面积不同，考虑扇形面积大小规律。观察发现，图1没有扇形，图2扇形为\u003cimg data-k=\"72020bbb1525\">个圆，图3扇形为\u003cimg data-k=\"6cd0004707c4\">个圆，图4扇形为\u003cimg data-k=\"732258bb32ee\">个圆，图5扇形为\u003cimg data-k=\"4dc58b60bb3f\">个圆，扇形面积呈递增规律，故？处扇形面积应为\u003cimg data-k=\"99b62428eced\">个圆，只有A项符合，当选。\n故正确答案为A。","no":78,"missingImage":false},{"qid":"2719388","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"ddc9b7868d4d\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成相似，优先考虑样式规律。题干图形均存在黑色部分和空白部分，考虑黑白运算。第一组图的黑白运算规律为：黑\u003cimg data-k=\"3d6d1f96db11\">黑\u003cimg data-k=\"e6c7a9c8511f\">白，白\u003cimg data-k=\"3d6d1f96db11\">黑\u003cimg data-k=\"e6c7a9c8511f\">黑，黑\u003cimg data-k=\"3d6d1f96db11\">白\u003cimg data-k=\"e6c7a9c8511f\">黑，白\u003cimg data-k=\"3d6d1f96db11\">白\u003cimg data-k=\"e6c7a9c8511f\">白。第二组图运用此规律，可以将图形分为四行看，第二行最左侧应满足白\u003cimg data-k=\"3d6d1f96db11\">白\u003cimg data-k=\"e6c7a9c8511f\">白，排除B、C两项。第三行最右侧应满足白\u003cimg data-k=\"3d6d1f96db11\">黑\u003cimg data-k=\"e6c7a9c8511f\">黑，排除A项，只有D项符合，当选。\n故正确答案为D。","no":79,"missingImage":false},{"qid":"2719391","cat":"图形推理","stem":"左图给定的是正方体纸盒，右边哪项可能是其正确的外表面展开图？\n\u003cimg data-k=\"debb93d76d90\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"将题干立体图及选项展开图中对应的面标上序号，如下图所示，逐一分析选项。\n\u003cimg data-k=\"3cebf33c9237\" style=\"max-width:700px\">\nA项：选项与题干一致，当选；\nB项：选项中面a与面b的公共边（如下图线1所示），面a挨着面b的小黑色方块，而题干立体图中面a没有挨着面b的小黑色方块，选项与题干不一致，排除；\n\u003cimg data-k=\"17703ba77807\" style=\"max-width:700px\">\nC项：题干立体图中，面a挨着面c中较细的黑色部分，但选项中面a与左右两个相邻面中的较细黑色部分均不相邻（如下图线2和线2&#39;所示），选项与题干立体图不一致，排除；\n\u003cimg data-k=\"f7a5a9073605\" style=\"max-width:700px\">\nD项：因呈直角的两条边是同一条边，故选项中线3折合之后为同一条边，观察发现，选项中面a挨着下方图形较粗的黑色部分（如下图线3所示），而题干立体图中面a没有挨着较粗的黑色部分，选项与题干不一致，排除。\n\u003cimg data-k=\"464df62f420c\" style=\"max-width:700px\">\n故正确答案为A。","no":80,"missingImage":false},{"qid":"2719393","cat":"图形推理","stem":"左图为给定的多面体，从任一角度观看，右边哪项可能是该多面体的视图？\n\u003cimg data-k=\"ce3815385575\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查三视图，逐一分析选项。\nA项：从下往上看，应如图所示\u003cimg data-k=\"b9926a7b54c6\" style=\"max-width:112px\">，题干A选项右上角应为梯形，排除；\nB项：从前往后看，与题干一致，当选；\nC项：从上往下看，应如图所示\u003cimg data-k=\"8006459ed6d5\" style=\"max-width:69px\">，题干C选项左下角应为梯形而非长方形，排除；\nD项：从右往左看，应如图所示\u003cimg data-k=\"fdd34d411380\" style=\"max-width:92px\">，题干D选项右下角应为长方形而非梯形，排除。\n故正确答案为B。","no":81,"missingImage":false},{"qid":"2719395","cat":"图形推理","stem":"左图给定的是由相同正方体堆叠成的多面体的正视图和后视图。该多面体可以由①、②和③三个多面体组合而成，问以下哪一项能填入问号处？\n\u003cimg data-k=\"130de707e230\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查立体拼合。\n\u003cimg data-k=\"4f89d2f5ad6f\" style=\"max-width:342px\">\n观察题干给出的多面体可知，图形可分为4层，由下至上第一层有12个小立方体，第二层有4个小立方体，第三层有3个小立方体，第四层有6个小立方体。图①共有四层，最上层有1个小立方体，图②共有3层，且只能拼合在由下至上的三层，如上图所示，故立体图形最上层还缺少5个小立方体，观察选项，只有C项存在一层有5个小立方体的面，据此C项当选。\n故正确答案为C。","no":82,"missingImage":false},{"qid":"2719401","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是（    ）。\n\u003cimg data-k=\"babd939c8c95\" style=\"max-width:613px\">","options":{"A":"①②③，④⑤⑥","B":"①②④，③⑤⑥","C":"①③④，②⑤⑥","D":"①③⑤，②④⑥"},"answer":"C","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图形被分割明显，考虑数面。图①③④均有2个面，图②⑤⑥均有4个面，即图①③④一组，图②⑤⑥一组。\n故正确答案为C。","no":83,"missingImage":false},{"qid":"2719403","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是（    ）。\n\u003cimg data-k=\"6460cd8373f8\" style=\"max-width:601px\">","options":{"A":"①②④，③⑤⑥","B":"①③⑤，②④⑥","C":"①③⑥，②④⑤","D":"①⑤⑥，②③④"},"answer":"D","explanation":"本题为分组分类题目。观察发现，题干每幅图形均由两个面相交而成，考虑图形间关系。图①⑤⑥中两个图形具有1条相交边，图②③④中两个图形具有2条相交边，即图①⑤⑥一组，图②③④一组。\n故正确答案为D。","no":84,"missingImage":false},{"qid":"2719404","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是（    ）。\n\u003cimg data-k=\"faaf3c154d49\" style=\"max-width:620px\">","options":{"A":"①③④，②⑤⑥","B":"①③⑤，②④⑥","C":"①②⑥，③④⑤","D":"①④⑥，②③⑤"},"answer":"C","explanation":"本题为分组分类题目。元素组成相同，但无明显位置规律。观察发现，所有图形中黑球全部相连，如果将所有黑球连成线，图③④⑤中所有黑球连成的线能一笔画成，而图①②⑥中所有黑球连成的线存在4个奇点，为两笔画成，如下图所示。因此图①②⑥一组，图③④⑤一组。\n\u003cimg data-k=\"2365c6d665f4\" style=\"max-width:635px\">\n故正确答案为C。","no":85,"missingImage":false},{"qid":"2719358","cat":"定义判断","stem":"析数是指在一定的语境中，利用数学上相加或相乘等关系，把一个数有目的地进行拆分的一种修辞手法。\n根据上述定义，下列没有使用析数的是（    ）。","options":{"A":"故国三千里，深宫二十年。一声何满子，双泪落君前","B":"蛾眉蔽珠栊，玉钩隔琐窗。三五二八时，千里与君同","C":"读尽文书一百担，老来方得一青衫。媒人却问余年纪，四十年前三十三","D":"江陵去扬州，三千三百里。已行一千三，所有二千在"},"answer":"A","explanation":"第一步：找出定义关键词。\n“利用数学上相加或相乘等关系”、“把一个数有目的地进行拆分”。\n第二步：逐一分析选项。\nA项：“故国三千里，深宫二十年。一声何满子，双泪落君前”的意思是故乡和亲人远在千里之外，我已被幽闭在这深宫里二十年了，听一声曲子《何满子》，忍不住掉下眼泪。未体现“利用数学上相加或相乘等关系”和“把一个数有目的地进行拆分”，不符合定义，当选； \nB项：“蛾眉蔽珠栊，玉钩隔琐窗。三五二八时，千里与君同”的意思是蛾眉一样的月儿，被珠帘挡在窗外，玉钩般的月儿，透不进琐窗里。十五十六日，月亮正圆时，我们共赏普照千里的明月。利用数学上相乘关系，将十五和十六拆分成“三五”和“二八”，符合“利用数学上相加或相乘等关系”、“把一个数有目的地进行拆分”，符合定义，排除；\nC项：“读尽文书一百担，老来方得一青衫。媒人却问余年纪，四十年前三十三”的意思是读了一辈子书，老了的时候考中了进士，有人做媒来提亲问我年纪，四十年前三十三岁。利用数学上相加的关系，将七十三拆分成“四十”和“三十三”，符合“利用数学上相加或相乘等关系”、“把一个数有目的地进行拆分”，符合定义，排除；\nD项：“江陵去扬州，三千三百里。已行一千三，所有二千在”的意思是江陵到扬州总共三千三百里，现在已航行了一千三百里，还剩二千里的路程。利用数学上相加的关系，将三千三百拆分成“一千三”和“二千”，符合“利用数学上相加或相乘等关系”、“把一个数有目的地进行拆分”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":86,"missingImage":false},{"qid":"2719361","cat":"定义判断","stem":"互益素是一种生物释放的、能引起他种接受生物产生对释放者和接受者都有益的反应的信息化学物质。\n根据上述定义，下列涉及互益素的是（    ）。","options":{"A":"苹果实蝇在植物果实上产卵后会留下一种标记信息素，以避免自己再次到这里产卵","B":"楝科植物印楝的种子、树叶和树皮中含有的印楝素，对几乎所有害虫都有驱杀效果","C":"亚洲玉米螟雌蛾释放的性信息素能够吸引雄蛾，使雄蛾能够准确找到雌蛾的方位","D":"小麦在遭受麦长管蚜攻击后会释放出水杨酸甲酯，可吸引麦长管蚜的天敌异色瓢虫"},"answer":"D","explanation":"第一步：找出定义关键词。\n“生物释放的”、“引起他种接受生物产生对释放者和接受者都有益的反应”。\n第二步：逐一分析选项。\nA项：苹果实蝇在植物果实上留下标记信息素避免重复产卵，释放者和接受者都是苹果实蝇，不是他种接受生物，不符合“引起他种接受生物产生对释放者和接受者都有益的反应”，不符合定义，排除；\nB项：印楝含有的印楝素有驱杀害虫的效果，只对释放者印楝本身有益，对接受者害虫无益，不符合“引起他种接受生物产生对释放者和接受者都有益的反应”，不符合定义，排除；\nC项：亚洲玉米螟雌蛾和雄蛾属于同一物种，不符合“引起他种接受生物产生对释放者和接受者都有益的反应”，不符合定义，排除； \nD项：小麦遭受麦长管蚜攻击后释放的水杨酸甲酯，可吸引麦长管蚜的天敌异色瓢虫，对释放者小麦和接受者异色瓢虫都有益，符合“生物释放的”、“引起他种接受生物产生对释放者和接受者都有益的反应”，符合定义，当选。\n故正确答案为D。","no":87,"missingImage":false},{"qid":"2719363","cat":"定义判断","stem":"统计数据分为定性数据与定量数据。定性数据包括分类数据和顺序数据。分类数据是指只能归于某一类别的非数字型数据，它是对事物进行分类的结果，用文字表述；顺序数据是指归于某一有序类别的非数字型数据。定量数据是指表现为具体数字观测值的数据。\n①按城市规模可将城市分为特大城市、大城市、中等城市和小城市；\n②婚姻状况：1-未婚，2-已婚，3-离异，4-丧偶；\n③A地到B地的距离为200公里，到C地为320公里，到D地为100公里；\n④某医院建筑面积37.5万平方米，开放床位3182个，临床医生687人。\n根据上述定义，关于以上4组数据的说法正确的是（    ）。","options":{"A":"②④都是分类数据","B":"②③④都是定量数据","C":"①②都是顺序数据","D":"仅②是分类数据"},"answer":"D","explanation":"第一步：找出定义关键词。\n分类数据：“只能归于某一类别的非数字型数据”、“是对事物进行分类的结果，用文字表述”；\n顺序数据：“归于某一有序类别的非数字型数据”；\n定量数据：“表现为具体数字观测值的数据”。\n第二步：逐一分析数据。\n数据①：按城市规模可将城市分为特大城市、大城市，中等城市和小城市，体现出规模大小上的顺序，符合“归于某一有序类别的非数字型数据”，属于顺序数据；\n数据②：婚姻状况：1-未婚， 2-已婚，3-离异，4-丧偶，将婚姻状况分为四类，符合“只能归于某一类别的非数字型数据”、“是对事物进行分类的结果，用文字表述”，属于分类数据；\n数据③：A地到B地的距离为200公里，到C地为320公里，到D地为100公里，都是具体数字观测值的数据，符合“表现为具体数字观测值的数据”，属于定量数据；\n数据④：某医院建筑面积37.5万平方米，开放床位3182个，临床医生687人，医院建筑面积、开放床位数、临床医生数都是具体数字观测值的数据，符合“表现为具体数字观测值的数据”，属于定量数据。\n综上，①属于顺序数据，②属于分类数据，③④都属于定量数据。\n故正确答案为D。","no":88,"missingImage":false},{"qid":"2719367","cat":"定义判断","stem":"拮抗作用是一种常见的感觉变化现象，是指因一种呈味物质的存在，而使另一种呈味物质的呈味特性减弱的现象。\n根据上述定义，下列没有体现拮抗作用的是（    ）。","options":{"A":"在橘子汁中添加少量柠檬酸会感觉甜味减弱，如再加砂糖，又会感到酸味减弱","B":"糖精带有苦味，在糖精中添加少量的谷氨酸钠，苦味可明显缓和","C":"同时服用氯化钠和奎宁后，再饮用清水会有微甜的感觉","D":"在食用过酸涩的西非山榄后，再吃酸味食品，会尝不到酸味"},"answer":"C","explanation":"第一步：找出定义关键词。\n“因一种呈味物质的存在”、“使另一种呈味物质的呈味特性减弱”。\n第二步：逐一分析选项。\nA项：因加入少量柠檬酸使橘子汁甜味减弱，又因再加入砂糖使橘子汁酸味减弱，符合“因一种呈味物质的存在”、“使另一种呈味物质的呈味特性减弱”，符合定义，排除；\nB项：在带有苦味的糖精中添加少量的谷氨酸钠可使苦味明显缓和，因为谷氨酸钠的存在使糖精的呈味特性减弱，符合“因一种呈味物质的存在”、“使另一种呈味物质的呈味特性减弱”，符合定义，排除；\nC项：同时服用氯化钠和奎宁后，再饮用清水会有微甜的感觉，清水本身无味，不属于呈味物质，不符合“因一种呈味物质的存在”、“使另一种呈味物质的呈味特性减弱”，不符合定义，当选；\nD项：在食用过酸涩的西非山榄后，再吃酸味食品，会尝不到酸味，因为西非山榄的存在使酸味食品的呈味特性减弱，符合“因一种呈味物质的存在”、“使另一种呈味物质的呈味特性减弱”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":89,"missingImage":false},{"qid":"2719368","cat":"定义判断","stem":"通过提供产品及服务使顾客产生愉悦等积极情感，从而使顾客觉得从产品及服务中获得了超过使用价值的新价值，以此为手段进行情感营销的过程，称为情感价值链。\n根据上述定义，下列没有凸显情感价值链的是（    ）。","options":{"A":"小张从事美容工作多年，她总是专注而耐心地倾听客户说话，让客户在享受按摩的同时心情舒畅","B":"智能音箱“小美”深受孩子们喜爱，因为它不仅能播放儿歌和故事，还能跟小朋友“对话、握手和点头”","C":"电视上，一对年轻夫妻为“该谁扫地了”而犯愁，之后扫地机器人登场，并闪现广告语“有了它，更幸福”","D":"洗碗机广告中，一位女士愁眉苦脸刷着油腻的碗盘，看着自己粗糙的双手，广告词是“你要做这样的女人吗？”"},"answer":"B","explanation":"第一步：找出定义关键词。\n“通过提供产品及服务使顾客产生愉悦等积极情感”、“获得了超过使用价值的新价值”。\n第二步：逐一分析选项。\nA项：小张倾听客户说话，让客户在享受按摩的同时心情舒畅，符合“通过提供产品及服务使顾客产生愉悦等积极情感”、“获得了超过使用价值的新价值”，符合定义，排除；\nB项：智能音箱“小美”不仅能播放儿歌和故事，还能跟小朋友“对话、握手和点头”，这只是音箱的功能，并没有体现出“获得了超过使用价值的新价值”，不符合定义，当选；\nC项：扫地机器人为年轻夫妻解决扫地难题，增加生活幸福感，符合“通过提供产品及服务使顾客产生愉悦等积极情感”、“获得了超过使用价值的新价值”，符合定义，排除；\nD项：洗碗机广告中，一位女士刷着碗盘，双手粗糙，愁眉苦脸，广告精确地掌握客户的心理需求，从反面切入，让客户感觉可以通过洗碗机摆脱这样愁苦的生活，获得情感价值，符合“通过提供产品及服务使顾客产生愉悦等积极情感”、“获得了超过使用价值的新价值”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":90,"missingImage":false},{"qid":"2719370","cat":"定义判断","stem":"一般来说，科学实验中主要涉及三种变量：自变量、因变量和控制变量，自变量是指在实验中由实验者操作的变量。因变量是指随着自变量的变化而变化的变量。控制变量是指实验中除自变量以外的影响实验变化和结果的潜在因素或条件。\n根据上述定义，下列说法正确的是（    ）。","options":{"A":"研究小麦供给量受当地采购价格的影响，小麦供给量是控制变量，采购价格是因变量","B":"研究不同税率对稀土出口量的影响，稀土出口量是自变量，税率是因变量","C":"研究气候条件对棉花产量的影响，气候条件是因变量，害虫影响是控制变量","D":"研究制糖厂营业额受糖产量的影响，糖的单价是控制变量，糖产量是自变量"},"answer":"D","explanation":"第一步：找出定义关键词。\n自变量：“实验中由实验者操作的变量”；\n因变量：“随着自变量的变化而变化的变量”；\n控制变量：“除自变量以外的影响实验变化和结果的潜在因素或条件”。\n第二步：逐一分析选项。\nA项：研究小麦供给量受当地采购价格的影响，当地采购价格是需要研究人员操作的变量，符合“实验中由实验者操作的变量”，符合自变量定义，不符合因变量定义；小麦供给量是随着当地采购价格变化而变化的量，符合“随着自变量的变化而变化的变量”，符合因变量定义，不符合控制变量定义，排除；\nB项：研究不同税率对稀土出口量的影响，不同税率是该研究中需要研究人员改变的量，符合“实验中由实验者操作的变量”，符合自变量定义，不符合因变量定义；稀土出口量是随着税率的变化而变化的量，符合“随着自变量的变化而变化的变量”，符合因变量定义，不符合自变量定义，排除；\nC项：研究气候条件对棉花产量的影响，气候条件是该研究中需要研究人员改变的量，符合“实验中由实验者操作的变量”，符合自变量定义，不符合因变量定义，排除；\nD项：研究制糖厂营业额受糖产量的影响，糖产量是该研究中需要研究人员改变的量，符合“实验中由实验者操作的变量”，符合自变量定义；糖的单价是该研究中除了糖产量以外的能够影响制糖厂营业额的一种潜在因素，符合“除自变量以外的影响实验变化和结果的潜在因素或条件”，符合控制变量定义，当选。\n故正确答案为D。","no":91,"missingImage":false},{"qid":"2719372","cat":"定义判断","stem":"对立互补命题指的是先后叙述的两个结构基本相同的句式中含有两对或者两对以上相互对立的概念，但是其阐发的意思是一致的或者是相互补充的。\n根据上述定义，下列不属于对立互补命题的是（    ）。","options":{"A":"君子坦荡荡，小人长戚戚","B":"先天下之忧而忧，后天下之乐而乐","C":"仓廪实而知礼节，衣食足而知荣辱","D":"穷在闹市无人问，富在深山有远亲"},"answer":"C","explanation":"第一步：找出定义关键词。\n“先后叙述的两个结构基本相同的句式”、“两对或者两对以上相互对立的概念”、“意思是一致的或者是相互补充的”。\n第二步：逐一分析选项。\nA项：意思是“君子心胸开阔，能够包容别人，小人爱斤斤计较，患得患失”，“君子”和“小人”、“坦荡荡”和“长戚戚”分别出现在前后两句中，且概念对立，符合“先后叙述的两个结构基本相同的句式”、“两对或者两对以上相互对立的概念”、“意思是一致的或者是相互补充的”，符合定义，排除；\nB项：意思是“为官者应把国家、民族的利益摆在首位，为祖国的前途、命运分愁担忧，为天下的人民幸福出力”，“先”和“后”、“忧”和“乐”分别出现在前后两句中，且概念对立，符合“先后叙述的两个结构基本相同的句式”、“两对或者两对以上相互对立的概念”、“意思是一致的或者是相互补充的”，符合定义，排除；\nC项：意思是“百姓的粮仓充足，丰衣足食，才能顾及到礼仪，重视荣誉和耻辱”，“仓廪实”和“衣食足”、“知礼节”和“知荣辱”均不属于相互对立的概念，不符合“两对或者两对以上相互对立的概念”，不符合定义，当选；\nD项：意思是“人穷的时候亲戚朋友在身边也很少来往，富有的时候就算远在深山老林亲戚都会来找你”，“穷”和“富”、“闹市”和“深山”分别出现在前后两句中，且概念对立，符合“先后叙述的两个结构基本相同的句式”、“两对或者两对以上相互对立的概念”、“意思是一致的或者是相互补充的”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":92,"missingImage":false},{"qid":"2719373","cat":"定义判断","stem":"预测干预是指人们受预测信息的影响而采取了某种行为，造成原本有多种可能性的结果真的朝着预测所指示的方向发展。\n根据上述定义，下列属于预测干预的是（    ）。","options":{"A":"某财经访谈栏目中一名专家预测H股票将大涨，结果很多收看该节目的观众争相购买该股票，导致该股票涨停","B":"某福利彩票代销点宣称他们卖出的彩票多次中奖，结果到该代销点购买彩票的人经常排起长队","C":"某国首脑在新年致辞中对该国经济形势进行了展望，因而该国老百姓对未来经济好转充满了信心","D":"甲国大选前，与其敌对的乙国媒体大肆渲染，认为M党总统候选人将当选，结果甲国很多选民转而支持N党总统候选人"},"answer":"A","explanation":"第一步：找出定义关键词。\n“人们受预测信息的影响而采取了某种行为”、“造成原本有多种可能性的结果真的朝着预测所指示的方向发展”。\n第二步：逐一分析选项。\nA项：专家预测H股票将大涨，观众争相购买股票，符合“人们受预测信息的影响而采取了某种行为”，观众的行为导致股票涨停，符合“造成原本有多种可能性的结果真的朝着预测所指示的方向发展”，符合定义，当选；\nB项：某福利彩票代销点宣称的内容不属于预测信息，不符合“人们受预测信息的影响而采取了某种行为”，不符合定义，排除；\nC项：某国首脑在新年致辞中展望了该国经济形势，而百姓只是对未来经济好转充满信心，并未对此采取行动，不符合“人们受预测信息的影响而采取了某种行为”，不符合定义，排除；\nD项：乙国媒体认为M党总统候选人当选，结果选民支持N党总统候选人，不符合“造成原本有多种可能性的结果真的朝着预测所指示的方向发展”，不符合定义，排除。\n故正确答案为A。","no":93,"missingImage":false},{"qid":"2719377","cat":"定义判断","stem":"决策树是由决策点、方案枝、状态节点和概率枝构成的图解法。决策树是以决策点为出发点，引出若干方案枝，每条方案枝代表一个方案。每条方案枝的末端有一个状态节点，从状态节点引出若干概率枝，每条概率枝代表一种自然状态。概率枝上标明每种自然状态之上的概率收益值。这样层层展开，形如树状，故此得名。\n根据上述定义，下列图示正确展示了决策树的是：","options":{"A":"\u003cimg data-k=\"39a4b62afb22\" style=\"max-width:254px\">","B":"\u003cimg data-k=\"c6b5279ba1b4\" style=\"max-width:345px\">","C":"\u003cimg data-k=\"722b96ad77e7\" style=\"max-width:313px\">","D":"\u003cimg data-k=\"1d66a0507048\" style=\"max-width:347px\">"},"answer":"D","explanation":"第一步：找出定义关键词。\n“以决策点为出发点，引出若干方案枝”、“每条方案枝的末端有一个状态节点”、“从状态节点引出若干概率枝”、“每条概率枝代表一种自然状态”、“概率枝上标明每种自然状态之上的概率收益值”。\n第二步：逐一分析选项。\nA项：图中概率枝由决策点引出，不符合“从状态节点引出若干概率枝”，不符合定义，排除；\nB项：图中每个状态节点只引出一条概率枝，不符合“从状态节点引出若干概率枝”，不符合定义，排除；\nC项：图中概率枝末端有状态节点，不符合“每条概率枝代表一种自然状态”，也不符合“概率枝上标明每种自然状态之上的概率收益值”，不符合定义，排除；\nD项：决策点引出两条方案枝，方案枝末端为状态节点，每个状态节点分别引出三条概率枝，概率枝为自然状态，且标明收益值，符合“以决策点为出发点，引出若干方案枝”、“每条方案枝的末端有一个状态节点”、“从状态节点引出若干概率枝”、“每条概率枝代表一种自然状态”、“概率枝上标明每种自然状态之上的概率收益值”，符合定义，当选。\n故正确答案为D。","no":94,"missingImage":false},{"qid":"2719379","cat":"定义判断","stem":"人们常常系统地高估自己对事件的控制程度或影响力，而低估机会、运气等不可控制因素在事件发展过程及其结果上所扮演的角色，这一现象被称为控制错觉。\n根据上述定义，下列没有体现控制错觉的是：","options":{"A":"人们想用骰子掷出“双6”时会在心中默念，用力揉捏骰子，相信这样做就会如愿","B":"一些股民往往借助几个简单的因素预测大盘指数，结果常常是谬以千里","C":"某企业经理认为今年当地举办的运动会对企业发展非常有利，预测今年营业额会有所上涨","D":"景区某摆渡车驾驶员常年走山路，认为自己路况熟、技术好，所以在山路上开得非常快"},"answer":"C","explanation":"第一步：找出定义关键词。\n“高估自己对事件的控制程度或影响力”、“低估机会、运气等不可控制因素在事件发展过程及其结果上所扮演的角色”。\n第二步：逐一分析选项。\nA项：掷骰子是随机事件，人们心中默念并用力揉捏骰子，相信这样做会掷出“双6”，符合“高估自己对事件的控制程度或影响力”，也低估了不可控因素的作用，符合定义，排除；\nB项：一些股民仅借助“几个简单的因素”就认为自己能够预测大盘指数，符合“高估自己对事件的控制程度或影响力”，符合定义，排除；\nC项：某企业经理认为运动会对企业发展有利，能够增加营业额，预测的是运动会对企业的影响，不符合“高估自己对事件的控制程度或影响力”，不符合定义，当选；\nD项：某摆渡车驾驶员认为自己路况熟、技术好而在山路上开快车，体现了此人因为“高估自己对事件的控制程度或影响力”而进行了不安全的驾驶行为，符合定义，排除。\n本题为选非题，故正确答案为C。","no":95,"missingImage":false},{"qid":"2719345","cat":"类比推理","stem":"易拉罐：拉环","options":{"A":"金库：黄金","B":"燃气灶：点火器","C":"台历：农历","D":"拦水坝：河流"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n拉环是易拉罐的组成部分，二者为组成关系。\n第二步：判断选项词语间逻辑关系。\nA项：金库是用来保管黄金的地方，二者是地点对应关系，与题干逻辑关系不一致，排除；\nB项：点火器是燃气灶的组成部分，二者为组成关系，与题干逻辑关系一致，当选；\nC项：台历指放在桌子上的日历，农历是中国传统历法，台历可以用来显示农历，二者为对应关系，与题干逻辑关系不一致，排除；\nD项：拦水坝是拦截水流的堤坝，可以用来拦截河流，二者为对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":96,"missingImage":false},{"qid":"2719351","cat":"类比推理","stem":"船舶抛锚：请求救援","options":{"A":"安全着陆：平稳飞行","B":"行政复议：获得赔偿","C":"卖出高粱：买入白酒","D":"违规销售：停业整顿"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n船舶抛锚是指把锚投入水中，使船停稳，即“停船”（注：如果是车抛锚，那就是车发生故障而停止行驶，与船舶抛锚的意思有区别），所以是先“船舶抛锚”，后“请求救援”，二者存在先后顺序。\n第二步：判断选项词语间逻辑关系。\nA项：先“平稳飞行”，后“安全着陆”，二者存在先后顺序，但顺序与题干相反，与题干逻辑关系不一致，排除；\nB项：先“行政复议”，后“获得赔偿”，二者存在先后顺序，与题干逻辑关系一致，保留；\nC项：“卖出高粱”和“买入白酒”没有必然的先后顺序，与题干逻辑关系不一致，排除；\nD项：先“违规销售”，后“停业整顿”，二者存在先后顺序，与题干逻辑关系一致，保留；\n对比BD项，进行二级辨析，题干的“请求救援”和D项的“停业整顿”都是说明事情偏负面，而B项的结果“获得赔偿”相对来说偏积极，择优选择D项。\n故正确答案为D。","no":97,"missingImage":false},{"qid":"2719356","cat":"类比推理","stem":"春山暖日和风：阑干楼阁帘栊","options":{"A":"绿蚁新醅酒：红泥小火炉","B":"鸡声茅店月：人迹板桥霜","C":"江碧鸟逾白：山青花欲燃","D":"柴门闻犬吠：风雪夜归人"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“春山暖日和风，阑干楼阁帘栊”指的是桃红柳绿的春山，煦暖的阳光照耀，和柔的东风吹拂，楼阁上卷起帘拢。每句都包含三种事物，春山、暖日、和风三者为并列关系，阑干、楼阁、帘栊三者也为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：“绿蚁新醅酒，红泥小火炉”指的是新酿的米酒，色绿香浓；小小红泥炉，烧得殷红。每句只包含一件事物，与题干逻辑关系不一致，排除；\nB项：“鸡声茅店月，人迹板桥霜”指的是鸡声嘹亮，茅草店沐浴着晓月的余晖；板桥弥漫清霜，先行客人足迹行行。每句都包含三件事物，鸡声、茅店、月三者为并列关系，人迹、板桥、霜三者也为并列关系，与题干逻辑关系一致，当选；\nC项：“江碧鸟逾白，山青花欲燃”指的是碧绿的江水把鸟儿的羽毛映衬得更加洁白，山色青翠欲滴，红艳的野花似乎将要燃烧起来。每句只包含两件事物，与题干逻辑关系不一致，排除；\nD项：“柴门闻犬吠，风雪夜归人”指的是柴门外忽传来犬吠声声，原来是有人冒着风雪归家门。每句中只包含两件事物，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":98,"missingImage":false},{"qid":"2719360","cat":"图形推理","stem":"立体化战争：数字化战争","options":{"A":"民主型管理：专制型管理","B":"防风林：观赏树木","C":"有氧运动：医疗瘦身","D":"绩效奖励：物质奖励"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n立体化战争，指在地面（水面）、地下（水下）、空中以及前方、后方同时或交互进行的战争。数字化战争，就是数字化部队在数字化战场进行的信息战，它是以信息为主要手段，以信息技术为基础的战争，是信息战的一种形式。有的立体化战争是数字化战争，有的立体化战争不是数字化战争，有的数字化战争是立体化战争，有的数字化战争不是立体化战争，二者是交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：民主型管理和专制型管理是管理的两种形式，除此之外还有放任型管理，所以二者属于并列关系中的反对关系，与题干逻辑关系不一致，排除；\nB项：防风林是一种以防御自然灾害、维护基础设施、保护生产、改善环境和维持生态平衡等为主要目的的森林群落，观赏树木指可供观赏的木本植物，不能说有的防风林是观赏树木，有的观赏树木是防风林，二者不是交叉关系，与题干逻辑关系不一致，排除；\nC项：有氧运动指人体在氧气充分供应的情况下进行的体育锻炼，是体育锻炼的一种形式，医疗瘦身指的是借助医疗的方法瘦身，是瘦身的一种形式，不能说有的有氧运动是医疗瘦身，二者不是交叉关系，与题干逻辑关系不一致，排除；\nD项：绩效奖励有物质奖励和精神奖励，所以有的绩效奖励是物质奖励，有的绩效奖励不是物质奖励，有的物质奖励是绩效奖励，有的物质奖励不是绩效奖励，二者是交叉关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":99,"missingImage":false},{"qid":"2719365","cat":"类比推理","stem":"风筝：篾刀：竹条","options":{"A":"泥塑：黏土：颜料","B":"绣品：绣针：绣线","C":"糖人：蔗糖：竹签","D":"漆器：描金：涂料"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n篾刀是制作风筝的工具，竹条是制作风筝的原材料，三者为成品、工具、原材料的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：黏土是泥塑的原材料，颜料也是泥塑的原材料，与题干逻辑关系不一致，排除；\nB项：绣针是制作绣品的工具，绣线是制作绣品的原材料，三者为成品、工具、原材料的对应关系，与题干逻辑关系一致，当选；\nC项：蔗糖是制作糖人的原材料，糖人粘在竹签上，与题干逻辑关系不一致，排除；\nD项：描金是制作漆器的一种工艺，涂料是制作漆器的原材料，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":100,"missingImage":false},{"qid":"2719369","cat":"类比推理","stem":"檀香：麝香：香料","options":{"A":"木材：钢筋：建材","B":"日光：月光：光明","C":"薯条：粉条：食物","D":"鲸鱼：鲍鱼：海鱼"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n檀香取于檀香科乔木檀香树的木质心材，属于香料的一种；麝香为鹿科动物麝的雄性腺囊中的分泌物干燥而成，是一种高级香料；二者为并列关系且原料不同，同时二者均与香料构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：木材是建材的一种，钢筋是建材的一种，二者为并列关系且原料不同，同时二者均与建材构成种属关系，与题干逻辑关系一致，当选；\nB项：日光与月光都是光的一种，但不是光明的一种，二者与光明不构成种属关系，与题干逻辑关系不一致，排除；\nC项：薯条与粉条一般都是由土豆作为原材料加工而成的食物，二者为并列关系但原料可以相同，与题干逻辑关系不一致，排除；\nD项：鲸鱼属于哺乳动物，不属于鱼类，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":101,"missingImage":false},{"qid":"2719374","cat":"类比推理","stem":"中央预算：年度预算：地方预算","options":{"A":"历史题材：军事题材：现实题材","B":"户外广告：文字广告：电视广告","C":"知识创新：技术创新：管理创新","D":"人身权利：生命权利：财产权利"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n中央预算和地方预算均属于国家预算，二者为并列关系；且年度预算分别与中央预算、地方预算是交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：现实题材和历史题材是以时间为划分标准的两种文学创作题材，二者为并列关系；且军事题材分别与历史题材、现实题材是交叉关系，与题干逻辑关系一致，当选；\nB项：户外广告是通过户外传播的广告形式，电视广告是一种通过电视播放的广告，文字广告是通过文字形式传播的广告，三者互为交叉关系，与题干逻辑关系不一致，排除；\nC项：知识创新是指获得新的基础科学和技术科学知识的创新活动，技术创新是指以创造新技术为目的的创新活动，管理创新是指企业把新的管理要素引入企业管理系统的创新活动，三者为并列关系，与题干逻辑关系不一致，排除；\nD项：生命权利属于人身权利，二者为种属关系；人身权利又称非财产权利，与财产权利属于并列关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":102,"missingImage":false},{"qid":"2719376","cat":"类比推理","stem":"健康监测：体检：疾病筛查","options":{"A":"为国聚财：税收：调节分配","B":"发掘遗迹：考古：考证年代","C":"解决争议：审判：强制执行","D":"太空飞行：航天：地质分析"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n健康监测和疾病筛查是体检的目的，三者为目的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：为国聚财和调节分配是税收的目的，与题干逻辑关系一致，当选；\nB项：发掘遗迹和考证年代是考古的过程和内容，与题干逻辑关系不一致，排除；\nC项：解决争议是审判的目的，但强制执行不是审判的目的，与题干逻辑关系不一致，排除；\nD项：航天又被称为太空飞行，二者为全同关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":103,"missingImage":false},{"qid":"2719381","cat":"类比推理","stem":"杠杆 对于 （    ） 相当于 （    ） 对于 成语","options":{"A":"滑轮；固定短语","B":"力臂；水滴石穿","C":"省力杠杆；春夏秋冬","D":"简单机械；四字成语"},"answer":"D","explanation":"逐一代入选项。\nA项：杠杆是在力的作用下可绕固定点转动的硬棒，是一种简单机械，滑轮是用来提升重物并能省力的简单机械，二者是并列关系；成语是固定短语，二者是种属关系，前后逻辑关系不一致，排除；\nB项：力臂是力的作用线到杠杆转动轴的垂直距离，二者是对应关系；水滴石穿是成语，二者是种属关系，前后逻辑关系不一致，排除；\nC项：省力杠杆是杠杆的一种，二者是种属关系；春夏秋冬是一个汉语词汇，不是成语，前后逻辑关系不一致，排除；\nD项：杠杆是简单机械的一种，二者是种属关系；四字成语是成语的一种，二者是种属关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":104,"missingImage":false},{"qid":"2719384","cat":"类比推理","stem":"（    ） 对于 口罩 相当于 竹子 对于 （    ）","options":{"A":"耳挂；竹炭","B":"无纺布；斗笠","C":"卫生用品；竹叶","D":"医用口罩；箭竹"},"answer":"B","explanation":"逐一代入选项。\nA项：耳挂是口罩的组成部分，二者为组成关系；竹子是竹炭的原材料，二者为对应关系，前后逻辑关系不一致，排除；\nB项：无纺布是制作口罩的原材料，二者为对应关系；竹子是制作斗笠的原材料，二者为对应关系，前后逻辑关系一致，当选；\nC项：口罩是一种卫生用品，二者为种属关系；竹叶是竹子的组成部分，二者为组成关系，前后逻辑关系不一致，排除；\nD项：医用口罩是口罩的一种，二者为种属关系；箭竹是竹子的一种，二者为种属关系，但词语前后顺序相反，前后逻辑关系不一致，排除。\n故正确答案为B。","no":105,"missingImage":false},{"qid":"2719405","cat":"逻辑判断","stem":"有研究人员认为，胶原蛋白保持皮肤年轻的说法并不科学，他们认为，皮肤得以保持年轻，应归功于表皮干细胞，哺乳动物的表皮细胞会持续更新，新细胞来源于表皮干细胞，这些干细胞会通过一种特定分化的多元蛋白结构——半桥粒附着在基膜上。表皮干细胞会不断复制、分化，产生新细胞取代受损的老细胞，这一更新有利于维持皮肤的年轻。因此，表皮干细胞的更新才是保持皮肤年轻的原因。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"表皮干细胞的更新还需要其他化合物的促进","B":"表皮干细胞的再生能力会随着年龄的增长而衰退","C":"胶原蛋白对促进表皮干细胞的更新至关重要","D":"胶原蛋白的表达在不同干细胞之间存在很大差异"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：胶原蛋白不是保持皮肤年轻的原因，表皮干细胞的更新才是保持皮肤年轻的原因。\n论据：表皮干细胞会不断复制、分化，产生新细胞取代受损的老细胞，这一更新有利于维持皮肤的年轻。\n本题论点和论据都在说表皮干细胞的更新有利于维持皮肤的年轻，话题一致，因此可以预设否定论点的方式进行削弱，即说明表皮干细胞的更新不是保持皮肤年轻的原因。且本题中双方观点关于如何保持皮肤年轻的原因争执，因此如果能说明胶原蛋白能导致表皮干细胞的更新，也可以起到削弱“研究人员”观点的效果。\n第二步：逐一分析选项。\nA项：论点说的是表皮干细胞的更新是保持皮肤年轻的原因，该项说的是表皮干细胞的更新还需要其他化合物的促进，其他化合物未提及，对保持皮肤年轻的影响不明确，排除；\nB项：论点说的是表皮干细胞的更新是保持皮肤年轻的原因，该项说的是表皮干细胞的再生能力，话题不一致，无法削弱，排除；\nC项：论点说的是表皮干细胞的更新是保持皮肤年轻的原因，该项说的是胶原蛋白对促进表皮干细胞的更新至关重要，因此保持皮肤年轻的根本原因还是胶原蛋白，削弱论点，当选；\nD项：论点说的是表皮干细胞的更新是保持皮肤年轻的原因，该项说的是胶原蛋白的表达，主体不一致，无法削弱，排除。\n故正确答案为C。","no":106,"missingImage":false},{"qid":"2719406","cat":"逻辑判断","stem":"羟苯甲酮是一种常见的紫外线吸收剂，多用于防晒护肤品中，全球3500种品牌的防晒霜中均含有该物质。研究表明，即使是极低浓度的羟苯甲酮也会给珊瑚带来致命的伤害，有专家指出，为了保护珊瑚，在海滨浴场应该禁止使用防晒霜。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"一些远离海岸的大洋中部分水域已检测到羟苯甲酮，但浓度较低","B":"羟苯甲酮易引起皮肤过敏，长期使用会影响人体免疫力和生殖能力","C":"羟苯甲酮会破坏、改变珊瑚的DNA，降低幼年珊瑚正常发育的几率","D":"人们在很多场合都使用防晒霜，仅在海滨浴场限制使用效果有限"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：为了保护珊瑚，在海滨浴场应该禁止使用防晒霜。\n论据：羟苯甲酮是一种常见的紫外线吸收剂，多用于防晒护肤品中，全球3500种品牌的防晒霜中均含有该物质。研究表明，即使是极低浓度的羟苯甲酮也会给珊瑚带来致命的伤害。\n本题的论点和论据话题一致，都在说明防晒霜中所含有的物质——羟苯甲酮会给珊瑚带来伤害，在浴场不能使用防晒霜。所以，我们需要以补充论据的方式来加强。\n第二步：逐一分析选项。\nA项：虽在远离海岸的大洋中部水域检测到了羟苯甲酮，浓度较低，但并没有说明该大洋中是否有珊瑚，以及是否给珊瑚带来了致命伤害，属于不明确选项，无法加强，排除；\nB项：羟苯甲酮易引起皮肤过敏，长期使用会影响人体免疫力和生殖能力，都是在说羟苯甲酮对人体的伤害而非对珊瑚的伤害，话题不一致，无法加强，排除；\nC项：羟苯甲酮会通过改变珊瑚的DNA来降低幼年珊瑚正常发育的几率，说明该项是在解释该物质如何对珊瑚产生致命伤害，补充论据，当选；\nD项：仅在海滨浴场限制使用效果有限，只能说明措施使用效果一般，但与是否应该禁止使用防晒霜无关，话题不一致，无法加强，排除。\n故正确答案为C。","no":107,"missingImage":false},{"qid":"2719408","cat":"逻辑判断","stem":"地质学家在澳大利亚中部距地表3公里的地下发现了两处直径超过200公里的神秘自然景观，景观所含有的石英砂中有着一簇簇的细线，这些细线大部分是互相平行的直线。地质学家认为，这些景观很可能是巨大陨石撞击形成的陨石坑，而石英砂的结构就是造成断裂的证据。\n以下哪项是上述论证的必要前提？","options":{"A":"只有经历高速的陨石撞击，地层中石英砂才会显示出含有平行直线的断裂结构","B":"石英砂普遍存在于地球表面，由于坚硬、耐磨、化学性能稳定而很少发生变化","C":"该景观的直径之大，并不同于其他的陨石坑，很可能不是一次形成的","D":"该景观周围的岩石是3亿年到4.2亿年之前形成的，那么撞击也应发生在那一时期"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：直径超过200公里的神秘自然景观很可能是巨大陨石撞击形成的陨石坑。\n论据：石英砂的结构（石英砂中有着一簇簇的细线，这些细线大部分是互相平行的直线）是造成断裂的证据。\n本题问题为“必要前提”，优先考虑搭桥和必要条件。论点说的是神秘自然景观是陨石撞击形成的陨石坑，而论据讨论石英砂的断裂结构，二者话题不一致，优先考虑搭桥，即建立“石英砂断裂结构”和“陨石撞击”的联系。\n第二步：逐一分析选项。\nA项：选项指出只有经历陨石撞击，地层中石英砂才会显示出含有平行直线的断裂结构，即建立了“石英砂中含有平行直线的断裂结构”和“陨石撞击”的联系，属于搭桥项，可以加强，当选；\nB项：选项指出石英砂普遍存在于地球表面，且很少发生变化，只是在讨论石英砂的性质，与论点讨论的该景观是否为陨石撞击形成的陨石坑无关，话题不一致，无法加强，排除；\nC项：选项指出该景观直径大，与其他陨石坑不同，可能不是一次形成的，与论点讨论的该景观是否为陨石撞击形成的陨石坑无关，话题不一致，无法加强，排除；\nD项：选项指出景观周围岩石形成的时间，推断撞击发生的时间，与论点讨论的该景观是否为陨石撞击形成的陨石坑无关，话题不一致，无法加强，排除。\n故正确答案为A。","no":108,"missingImage":false},{"qid":"2719409","cat":"逻辑判断","stem":"近年来，国家从药品生产、流通和销售各环节发力，频频出台降低药价的相关政策。但是，让不少患者感到疑惑的是，一方面是国家降低药价的政策不断出台，另一方面却是诸多常用药价格不断上涨。\n以下哪项如果为真，最能解释上述现象？","options":{"A":"价格下降的药品占大多数，价格上涨的药品占少数，因此从整体上来说，药品价格仍然是下降了","B":"常用进口药的需求增多，相关政策无法控制此类药品的价格上涨","C":"国家虽然出台了降低药价的政策，但是其影响要经过―段时间才能显现出来","D":"降低药价的政策可以有效控制药品市场中因制药原料涨价而导致的药价上涨"},"answer":"B","explanation":"第一步：找出题干矛盾。\n一方面是国家降低药价的政策不断出台，另一方面却是诸多常用药价格不断上涨。\n第二步：逐一分析选项。\nA项：指出整体来说药品价格下降，没有说明为什么政策出台的同时诸多常用药价格却上涨，不能解释题干矛盾，排除；\nB项：指出国家降低药价的政策无法控制常用进口药的价格上涨，又因为这些药的需求在增多，所以这些药物的价格在国家降低药价的政策不断出台时却不断上涨，可以解释题干矛盾，当选；\nC项：指出降低药价的政策影响要经过一段时间才能显现，可以解释政策出台后短时间药价不下降的情况，但不能解释为什么政策出台的同时诸多常用药价格却上涨，不能解释题干矛盾，排除；\nD项：指出降价政策可以有效控制因原料涨价而涨价的现象，说明政策有效，不能解释为什么政策出台的同时诸多常用药价格却上涨，不能解释题干矛盾，排除。\n故正确答案为B。","no":109,"missingImage":false},{"qid":"2719410","cat":"逻辑判断","stem":"近日，有研究团队通过对44个反刍动物物种的基因组测序研究，创建了一个反刍动物的系统进化树，从而解释大量反刍动物的演化史。结果揭示，在近10万年前，反刍动物种群发生大幅衰减，而这些种群数的减少与人类向非洲之外迁徙的时间相符。有人据此认为，这佐证了早期人类活动造成了反刍动物种群的衰减。\n以下哪项如果为真，最能质疑上述结论？","options":{"A":"反刍动物种群衰减后，植被愈加茂盛，为人类提供了更多食物","B":"反刍动物通常有角，在遇到人类攻击时能发挥一定的防御作用","C":"同一时期的马、驴等奇蹄目动物的种群也出现大幅衰减的现象","D":"同一时期大型猫科动物繁盛，它们大规模捕杀反刍动物"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：这佐证了早期人类活动造成了反刍动物种群的衰减。\n论据：在近10万年前，反刍动物种群发生大幅衰减，而这些种群数的减少与人类向非洲之外迁徙的时间相符。\n论点论据都在讨论早期人类活动和反刍动物种群之间的关系，论点论据话题一致，论点中存在因果关系，可优先考虑因果倒置和他因削弱。\n第二步：逐一分析选项。\nA项：该项说的是反刍动物衰减后给人类的影响，论点说的是早期人类活动造成了反刍动物种群的衰减，话题不一致，无法削弱，排除；\nB项：该项说的反刍动物对人类攻击有一定的防御作用，那到底是否是人类活动造成的反刍动物种群衰减不是十分明确，属于不确定选项，无法削弱，排除；\nC项：该项说的是同一时期奇蹄目动物的种群也大幅度衰减，论点说的是早期人类活动造成反刍动物种群的衰减，主体不一致，无法削弱，排除；\nD项：该项说的是同一时期，还有另外一个原因也就是猫科动物大规模捕杀反刍动物也造成反刍动物种群的衰减，属于他因削弱，当选。\n故正确答案为D。","no":110,"missingImage":false}]}],"count":40,"answerable":40,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"4727ad28076b\" style=\"max-widt /* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'

    var b=e.target.closest("[data-x]"); if(!b)return;

}

  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
