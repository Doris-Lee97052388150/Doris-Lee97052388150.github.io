机300天可完成清淤工作，可得：\u003cimg data-k=\"eceae18cf91a\">；由于2台挖沙机100天可完成清淤工作，可得：\u003cimg data-k=\"dcedd4265ff6\">。两式联立，解得\u003cimg data-k=\"403727719a4d\">，\u003cimg data-k=\"079d6c59a718\">。若要求工程队25天内完成河道的全部清淤工作，此时，设所需的挖沙机台数为\u003cimg data-k=\"489782a86fc8\">，则有\u003cimg data-k=\"f99a1a5428d5\">，解得\u003cimg data-k=\"edd9a702d1e7\">，至少需要7台挖沙机同时工作。\n故正确答案为D。","no":68,"missingImage":false},{"type":"question","qid":"2376465","cat":"数学运算","stem":"某次田径运动会中，选手参加各单项比赛计入所在团体总分的规则为：一等奖得9分，二等奖得5分，三等奖得2分。甲队共有10位选手参赛，均获奖。现知甲队最后总分为61分，问该队最多有几位选手获得一等奖？","options":{"A":"3","B":"4","C":"5","D":"6"},"answer":"C","explanation":"设获得一等奖、二等奖、三等奖的人数分别为\u003cimg data-k=\"5320a525f2bc\">、\u003cimg data-k=\"c1beececd683\">、\u003cimg data-k=\"08caa03ce8e3\">，根据题意得：\u003cimg data-k=\"308e846ca118\">，\u003cimg data-k=\"5c2da51265a5\">，整理两式，消去\u003cimg data-k=\"08caa03ce8e3\">得：\u003cimg data-k=\"9c561e3f48c2\">。\n问获得一等奖人数最多，考虑从大到小代入：\n代入D项，若\u003cimg data-k=\"e47b476a4bd8\">，代入\u003cimg data-k=\"9c561e3f48c2\">，\u003cimg data-k=\"c1beececd683\">为负且不是整数，排除；\n代入C项，若\u003cimg data-k=\"43edc63c34e0\">，代入\u003cimg data-k=\"9c561e3f48c2\">，解得\u003cimg data-k=\"5024735a0983\">，\u003cimg data-k=\"7823385f8123\">，符合题意。\n故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"2376445","cat":"数学运算","stem":"小林在距家1.5公里的工厂上班。一天，小林出发10分钟后，父亲老林发现小林的手机没带，立即追出去，并在距离工厂500米的地方追上了他。如果老林追赶的速度比小林快6公里/小时，那么，下列关于小林速度\u003cimg data-k=\"5320a525f2bc\">，求值所列方程正确的是：","options":{"A":"\u003cimg data-k=\"1daf011c0c79\">","B":"\u003cimg data-k=\"0cf7f23ea1a9\">","C":"\u003cimg data-k=\"fe6226f65962\">","D":"\u003cimg data-k=\"1a0f1ed73581\">"},"answer":"A","explanation":"根据题意，老林从家到追上小林，老林和小林行驶的路程均为\u003cimg data-k=\"ec4dddec4298\"> 公里，老林比小林少用\u003cimg data-k=\"449aa1684510\"> 分钟，即\u003cimg data-k=\"6f9d0abe3e0f\"> 小时。小林速度为\u003cimg data-k=\"5320a525f2bc\">，老林速度为\u003cimg data-k=\"e2cd15f5fb4b\">，则\u003cimg data-k=\"1daf011c0c79\">。\n故正确答案为A。","no":70,"missingImage":false}],"count":15,"answerable":15,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"2376553","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"e2056422ec66\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相同，优先考虑位置规律。整体观察发现，小三角、小圆圈均在移动，可以分开看，先看小三角，小三角的移动规律为每次顺时针平移两格，只有C项符合要求。再通过小圆圈位置验证，小圆圈的移动规律为每次逆时针平移三格， C项当选。\n故正确答案为C。","no":71,"missingImage":false},{"type":"question","qid":"2376811","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"4d99f9d72706\" style=\"max-width:557px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"解析一：元素组成不同，属性无明显规律，考虑数量规律。题干均为立体图形，且封闭区域较多，可数立体图形的外表面的面数量，即立体图形的外表面是由几个面构成的，观察发现分别由2、3、4、5、6个面构成，因此“？”处应该选择一个外表面为7的立体图形。A选项8个面，B选项6个面，C选项3个面，D选项7个面。D项当选。\n故正确答案为D。\n解析二：元素组成不同，属性无明显规律，考虑数量规律。观察发现题干立体图形均有下底面，图一和图二下底面形状相同，图三和图四下底面形状相同，因此“？”处应该选择一个与图五下底面形状相同的图形。B项当选。\n故正确答案为B。\n因为解析一中数立体图形的外表面的面数量呈现严谨的等差规律，故粉笔对于此题更倾向根据外表面的面数量，选择 D项。","no":72,"missingImage":false},{"type":"question","qid":"2376756","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"fd39c46c1b1b\" style=\"max-width:497px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"解析1：元素组成不相同，不相似，优先考虑属性规律。题干均为轴对称图形，且对称轴数量均为3条。A项1条；B项3条；C项2条；D项2条。\n故正确答案为B。\n\u003cimg data-k=\"461ffe3544d8\" style=\"max-width:180px\">\n注：如上图所示，A项中蓝点处于圆与三角形的切点处，而红点并非处于圆与三角形的切点处，故此图只有1条对称轴，而不是3条。\n解析2：元素组成不相同，不相似，优先考虑属性规律。题干有曲线有直线，考虑曲直性，图一为有曲有直图形，图二为全直线图形，图三为有曲有直图形，图四为全直线图形，因此“？”处选择一个有曲有直图形。A项有曲有直，B、C、D三项均为纯直线图形。\n故正确答案为A。\n解析3：元素组成不相同，不相似，考虑属性和数量规律。题干出现切圆，考虑笔画数，题干图形笔画数依次为2121？，故？处应为2笔画图形，只有D项为2笔画。\n故正确答案为D。\n本题有多种规律，但从图形特征和命题思路分析，考虑到题干几个图均是等边三角形的变形图，而等边三角形以及其变形图在近几年的考试中多用于考查对称性，故粉笔倾向对称性这一考点。\n故正确答案为B。","no":73,"missingImage":false},{"type":"question","qid":"2376521","cat":"图形推理","stem":"把下面的图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"81a671f9ecaf\" style=\"max-width:700px\">","options":{"A":"①④⑥，②③⑤","B":"①②③，④⑤⑥","C":"①③⑥，②④⑤","D":"①③④，②⑤⑥"},"answer":"A","explanation":"本题为分组分类题目，图形均为明显两个图形相交，考虑图形间关系。观察发现，图①④⑥的公共边为短边，图②③⑤的公共边为长边，故①④⑥一组，②③⑤一组。\n故正确答案为A。","no":74,"missingImage":false},{"type":"question","qid":"2376652","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"79981fa90566\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查三视图，第一组图形中第二个图形和第三个图形分别是第一个立体图形的主视图和俯视图。第二组应用规律，问号处所填图形应为第一个立体图形的俯视图。俯视图从上往下看，可以看到外框是一个类似矩形的轮廓，里面两个小圆圈加上一个小矩形，只有C项符合。\n故正确答案为C。","no":75,"missingImage":false},{"type":"question","qid":"2376754","cat":"图形推理","stem":"正方体切掉一块后剩余部分如下图左侧所示，右侧哪一项是其切去部分的形状？\n\u003cimg data-k=\"883c234e7146\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"此题为立体图形拼合问题，解题原则为凹凸一致。根据题目要求，可知正确选项和左侧图形拼合后应为正方体。观察题干左侧图形，发现外侧斜坡和其内侧上方凸出的小矩形在同一侧，而A、C两项外侧斜坡和凹进去的小矩形不在同一侧，排除；比较B、D两项，仅在中间位置不同，题干左侧图形中间位置存在斜坡，根据凹凸一致的原则，选项也应存在斜坡，只有B项符合。\n故正确答案为B。","no":76,"missingImage":false},{"type":"question","qid":"2376566","cat":"定义判断","stem":"虚拟现实技术是指一种可以创建和体验虚拟世界的仿真系统，它利用计算机生成可交互的三维环境，向使用者提供视觉、听觉、触觉等感官的模拟，从而让人有身临其境之感，这是一种360度视角的沉浸式体验。\n根据上述定义，下列选项属于虚拟现实技术运用的是：","options":{"A":"张三通过电脑与远在巴黎的父亲视频聊天，亲眼见到了埃菲尔铁塔","B":"李四用手机微信与妻子视频聊天，亲耳听到了儿子背诵古诗的声音","C":"刘五戴上特制头盔网购书桌，能够全方位地体验书桌摆进书房的效果","D":"王二用平板电脑看同学在西藏旅游的视频，感觉自己也到了布达拉宫"},"answer":"C","explanation":"第一步：找出定义关键词。\n“指一种可以创建和体验虚拟世界的仿真系统”、“它利用计算机生成可交互的三维环境，向使用者提供视觉、听觉、触觉等感官的模拟”、“从而让人有身临其境之感，是一种360度视角的沉浸式体验。”\n第二步：逐一分析选项。\nA项：张三通过电脑与远在巴黎的父亲视频聊天，亲眼见到了埃菲尔铁塔，看到的埃菲尔铁塔是现实世界的景物，并不是虚拟的，不符合“是一种可以创建和体验虚拟世界的仿真系统”，也不符合“向使用者提供视觉、听觉、触觉等感官的模拟”，不符合定义，排除；\nB项：李四用微信与妻子视频聊天，亲耳听到了儿子背诵古诗的是声音，儿子背诵古诗的声音也是现实世界的声音，并不是虚拟的，不符合“是一种可以创建和体验虚拟世界的仿真系统”，也不符合“向使用者提供视觉、听觉、触觉等感官的模拟”，不符合定义，排除；\nC项：刘五戴上特制头盔，能够全方位地体验书桌摆进书房的效果，符合“向使用者提供视觉、听觉、触觉等感官的模拟”、“是一种360度视角的沉浸式体验”，符合定义，当选；\nD项：王二用平板电脑看同学在西藏旅游的视频，感觉自己也到了布达拉宫，王二观看视频的过程，不符合“创建和体验虚拟世界的仿真系统”，不符合定义，排除。\n故正确答案为C。","no":77,"missingImage":false},{"type":"question","qid":"2376557","cat":"定义判断","stem":"组织认同是指组织成员在行为或观念等诸方面与其所加入的组织具有一致性，觉得自己在组织中既有理性的契约和责任感，也有非理性的归属和依赖感，以及在这种心理基础上表现出的对组织活动尽心尽力的行为结果。\n根据上述定义，下列选项不属于组织认同的是：","options":{"A":"“我们要以共产党员的标准严格要求自己”","B":"“公司面临困难的时候，我们要不离不弃”","C":"“我要每时每刻自觉维护公司的良好形象”","D":"“今日我以母校为傲，明日母校以我为荣”"},"answer":"D","explanation":"第一步：找出定义关键词。\n“组织成员与其所加入的组织具有一致性”、“既有理性的契约和责任感”、“也有非理性的归属和依赖感”、“对组织活动尽心尽力”。\n第二步：逐一分析选项。\nA项：用共产党员的标准要求自己，体现了党员的行为和观念与党组织的一致性，但说出此话的主体不一定是党员，非党员也可以表达这样的决心，该项主体不明确，可能符合“组织成员与其所加入的组织具有一致性”，保留；\nB项：对公司不离不弃，体现了员工对公司的责任感和归属感，符合“既有理性的契约和责任感”、“也有非理性的归属和依赖感”，且面对困难也一直坚守，符合“对组织活动尽心尽力”，符合定义，排除；\nC项：自觉维护公司的良好形象，符合“既有理性的契约和责任感”、“也有非理性的归属和依赖感”，符合定义，排除；\nD项：学生和母校互相为各自取得的成绩骄傲，母校的定义是曾经在那里毕业或学习过的学校，即此刻已经不是该校的学生了，我们才会称之为“母校”，不符合“组织成员与其所加入的组织具有一致性”；另外学校和学生是教书育人的关系，一般也不会说二者有契约关系，不符合“既有理性的契约和责任感”，跟A项相比，A项可能符合，D项是更不符合的，当选。\n本题为选非题，故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"2376571","cat":"定义判断","stem":"意志的活动过程会体现以下两大定律。其中，意志强度边际效应定律是指意志的强度随着自身行为的活动规模的增长而下降；意志强度时间衰减定律是指意志的强度随着自身行为的持续时间的增长而呈现负指数下降。\n根据上述定义，下列选项最能体现意志强度时间衰减定律的是：","options":{"A":"锲而舍之，朽木不折","B":"为山九仞，功亏一篑","C":"穷且益坚，不坠青云之志","D":"一鼓作气，再而衰，三而竭"},"answer":"D","explanation":"第一步：找出定义关键词。\n意志强度边际效应定律：“意志强度”、“随自身行为的活动规模增长而下降”；\n意志强度时间衰减定律：“意志强度”、“随自身行为的持续时间增长而呈现负指数下降”。\n第二步：逐一分析选项。\nA项：“锲而舍之，朽木不折”意思是说如果不坚持做一件事，就算是腐朽的木头也无法折断，说明人们不坚持做一件事的后果，不符合“随自身行为的持续时间增长”，不符合定义，排除；\nB项：“为山九仞，功亏一篑”意思是说堆九仞高的山，只缺一筐土导致不能完成，是用来比喻做事情只差最后一点没能完成，说明没有一直坚持下去，不符合“随自身行为的持续时间增长”，不符合定义，排除；\nC项：“穷且益坚，不坠青云之志”意思是说一个人处境越是艰难，就越是坚忍不拔，越是不丢失高远之志，没有体现与时间增长的关系，不符合“随着自身行为的持续时间的增长而呈现负指数下降”，不符合定义，排除；\nD项：“一鼓作气，再而衰，三而竭”意思是说，第一次击鼓士气会大大的增加，第二次击鼓士气就会减弱了，第三次击鼓就没有士气了，说明士气随着时间的增加而减弱，符合“随时间增长而呈现负指数下降”，符合定义，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"2376587","cat":"定义判断","stem":"水文节律指湖泊水情周期性、有节律的变化。广义水文节律包括昼夜、月运、季节和年际节律。正常情况下，由于流域气候和下垫面等因素较稳定，湖泊多年平均水位趋于稳定数值即湖泊正常年平均水位。所以湖泊年际节律以干扰因素驱动的突变性和适应干扰后的阶段稳定性为特点，无渐变趋向；而昼夜节律对生态系统影响微弱。因此，狭义水文节律特指月运节律与季节节律。\n根据上述定义，下列涉及狭义水文节律的是：","options":{"A":"鄱阳湖受降雨持续减少和来水减少双重影响，水面面积持续萎缩","B":"洪泽湖历史年均水温\u003cimg data-k=\"06c3f01e3f6b\">，最高水温在9月，最低水温在1月","C":"洞庭湖去年年降水量1560毫米，其中4~6月降水约占全年一半","D":"巢湖流域年平均气温稳定在\u003cimg data-k=\"e692fae76cbb\">之间，有200天以上无霜期"},"answer":"B","explanation":"第一步：找出定义关键词。\n水文节律：“湖泊水情周期性、有节律的变化”；\n广义水文节律：“昼夜、月运、季节和年际节律”；\n狭义水文节律：“月运节律和季节节律”。\n（注：水情是指江河湖泊的状况、特征及地理意义，如流量、水位、流速、水温与冰情等）\n本题要选的是符合狭义水文节律的选项。\n第二步：逐一分析选项。\nA项：鄱阳湖水面面积持续萎缩，说明是一直在减小，不存在周期性的变化，不符合定义，排除；\nB项：洪泽湖历史年均最高水温在9月，最低水温在1月，月份和季节不同水温也不同，而且是统计了历史上多年的水温，符合“湖泊水情周期性、有节律的变化”，符合“季节节律”，符合狭义水文节律，符合定义，当选（水情指江河湖泊的状况、特征及地理意义，如流量、水位、流速、水温与冰情等，水温是水文测验的基本项目之一）；\nC项：只是给出洞庭湖去年一年的降水量，没有体现“周期性、有节律的变化”，不符合定义，排除；\nD项：巢湖流域平均气温在15-16摄氏度之间，有200天以上无霜期，是湖泊流经区域的气温变化，而不是湖泊水情的变化，不符合定义，排除。\n故正确答案为B。","no":80,"missingImage":false},{"type":"question","qid":"2376581","cat":"定义判断","stem":"时间感知扭曲是指对时间不正确的知觉。在生活中，受各种因素影响，人们对时间的感知往往会不符合实际，有时候觉得时间过长，有时候觉得时间太短。许多原因都可以造成时间感知扭曲，现实中一场糟糕的表演会让人如坐针毡、觉得终场遥遥无期，与此相反的是，人们对于美好愉快的时光总嫌太短。\n根据上述定义，下列选项不符合时间感知扭曲的是：","options":{"A":"一日不见，如三月兮","B":"欢愉嫌夜短，寂寞恨更长","C":"孤馆度日如年，风露渐变","D":"入春才七日，离家已二年"},"answer":"D","explanation":"第一步：找出定义关键词。\n“对时间不正确的知觉”。\n第二步：逐一分析选项。\nA项：“一日不见，如三月兮”指的是一天没见，就觉得过去了三个月，符合“对时间不正确的知觉”，符合定义，排除；\nB项：“欢愉嫌夜短，寂寞恨更长”指的是欢乐时嫌夜里时间短促，寂寞时怨恨夜晚时间漫长，符合“对时间不正确的知觉”，符合定义，排除；\nC项：“孤馆度日如年，风露渐变”指的是在驿馆里形单影只，度日如年，秋风和露水都开始变得寒冷，过一天就好像过了一年一样，符合“对时间不正确的知觉”，符合定义，排除；\nD项：“入春才七日，离家已二年”指的是入春已经过了七天了，但离开家已经两年了，这是对于时间的客观陈述，不符合“对时间不正确的知觉”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":81,"missingImage":false},{"type":"question","qid":"2376565","cat":"定义判断","stem":"消费滞后是指个人消费滞后于国家经济发展和个人家庭收入所应达到的平均消费水平。消费超前是指当下的收入水平不足以购买现在所需的产品或服务，以贷款、分期付款、预支等形式进行消费。\n根据上述定义，下列属于消费超前的是：","options":{"A":"职员小王以信用卡支付的形式在网上订购了火车票","B":"大学生小李通过某借贷平台购买了某知名品牌电脑","C":"退休工人老张名下有商品房和汽车，但坚持只用老式的直板手机","D":"青年教师小刘有十万元定期存款未到期，向同事借了八万元买车"},"answer":"B","explanation":"第一步：找出定义关键词。\n消费滞后：“指个人消费滞后于国家经济发展和个人家庭收入所应达到的平均消费水平”；\n消费超前：“指当下的收入水平不足以购买现在所需的产品或服务”、“以贷款、分期付款、预支等形式进行消费”。\n第二步：逐一分析选项。\nA项：小王为职员说明小王已经工作，购买火车票应该是消费水平范围内，不符合“当下的收入水平不足以购买现在所需的产品或服务”，不符合定义，排除；\nB项：小李是一名大学生，尚未参加工作，购买电脑符合“当下的收入水平不足以购买现在所需的产品或服务”，且通过“某借贷平台购买”属于“贷款”的支付方式，符合定义，当选；\nC项：老张有房有车，却使用老式的直板手机，符合“个人消费滞后于国家经济发展和个人家庭收入所应达到的平均消费水平”，属于消费滞后，不属于消费超前，不符合定义，排除；\nD项：小刘有十万元的存款，而车只有八万元，也就是当下的收入足以购买现在所需的产品，不符合“当下的收入水平不足以购买现在所需的产品或服务”，且向同事借钱不符合“以贷款、分期付款、预支等形式进行消费”，不符合定义，排除。\n故正确答案为B。","no":82,"missingImage":false},{"type":"question","qid":"2376789","cat":"定义判断","stem":"类脑计算技术总体分为三个层次：结构层次模仿脑、器件层次逼近脑、智能层次超越脑。其中，结构层次模仿脑是指将大脑作为一个物质和生理对象进行解析，获得基本单元(各类神经元和神经突触等)的功能及其连接关系（网络结构）；器件层次逼近脑是指研制能够模拟神经元和神经突触功能的器件，从而在有限的物理空间和功耗条件下构造出人脑规模的神经网络系统；智能层次超越脑是指通过对类脑计算机进行信息刺激、训练和学习，使其产生与人脑类似的智能。\n根据上述定义，下列属于智能层次超越脑的是：","options":{"A":"调整神经网络的突触连接关系及连接频率和强度","B":"绘制精确的人类大脑动态图谱以解析探测大脑","C":"开发功能、密度与人类大脑皮层相当的电子装备","D":"捕捉细微的单个神经元放电的非线性动力学过程"},"answer":"A","explanation":"第一步：找出定义关键词。\n结构层次模仿脑：“将大脑作为物质和生理对象进行解析”、“获得基本单元的功能及其连接关系”；\n器件层次逼近脑：“研制能够模拟神经元和神经突触功能的器件”、“构造出人脑规模的神经网络系统”；\n智能层次超越脑：“对类脑计算机进行信息刺激、训练和学习”、“产生与人脑类似的智能”。\n第二步：逐一分析选项。\nA项：调整神经网络的突触连接关系及连接频率和强度，符合“对类脑计算机进行信息刺激、训练和学习” ，符合“智能层次超越脑”定义，当选；\nB项：绘制精确的人类大脑动态图谱，符合“将大脑作为物质和生理对象进行解析”，符合“结构层次模仿脑”定义，不符合“智能层次超越脑”定义，排除；\nC项：开发功能、密度与人类大脑皮层相当的电子装备，符合“研制能够模拟神经元和神经突触功能的器件”，符合“器件层次逼近脑”定义，不符合“智能层次超越脑”定义，排除；\nD项：捕捉细微的单个神经元放电的非线性动力学过程，符合“获得基本单元的功能及其连接关系”，符合“结构层次模仿脑”定义，不符合“智能层次超越脑”定义，排除。\n故正确答案为A。\n注：本题目来自于《类脑计算机的现在与未来》，各选项对应于该文章中的句子如下所示：\nA项：所谓“智能层次超越脑”，属于类脑计算机应用软件层次的问题，是指通过对类脑计算机进行信息刺激、训练和学习，使其产生与人脑类似的智能甚至涌现出自主意识，实现智能培育和进化。刺激源可以是虚拟环境，也可以是来自现实环境的各种信息（例如互联网大数据）和信号（例如遍布全球的摄像头和各种物联网传感器），还可以是机器人“身体”在自然环境中探索和互动。在这个过程中，类脑计算机能够调整神经网络的突触连接关系及连接强度，实现学习、记忆、识别、会话、推理以及更高级的智能；\nB项：所谓“结构层次模仿脑”，是将大脑作为一个物质和生理对象进行解析，获得基本单元（各类神经元和神经突触等）的功能及其连接关系（网络结构）；\nC项：所谓“器件层次逼近人脑”，是指研制能够模拟神经元和神经突触功能的微纳光电器件，从而在有限的物理空间和功耗条件下构造出人脑规模的神经网络系统。这方面的代表性项目是美国国防部先进研究项目局（DARPA）2008年启动的“神经形态自适应可塑性可扩展电子系统”（即突触），其目标是研制出器件功能、规模与密度均与人类大脑皮层相当的电子装置；\nD项：所谓“结构层次模仿脑”，是将大脑作为一个物质和生理对象进行解析，获得基本单元（各类神经元和神经突触等）的功能及其连接关系（网络结构）。这一阶段，主要通过神经科学实验采用先进的分析探测技术完成。1952年，英国科学家霍奇金和赫胥黎提出了以两人命名的HH方程，精确刻画了单个神经元放电的非线性动力学过程，这是神经元信息处理的标准数学模型。","no":83,"missingImage":false},{"type":"question","qid":"2376531","cat":"类比推理","stem":"拥挤：水泄不通","options":{"A":"清晰：洞见肺腑","B":"严重：触目惊心","C":"费力：举重若轻","D":"伤心：肝肠寸断"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n水泄不通形容拥挤或包围的非常严密，与拥挤是近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：洞见肺腑是指很清楚地看见人的内心，形容襟怀坦白，待人诚恳。与清晰不是近义关系，与题干逻辑关系不一致，排除；\nB项：触目惊心是指看见某种严重情况而内心震惊，形容事态严重，引起轰动，该词强调的是震惊，与严重不是近义关系，与题干逻辑关系不一致，排除；\nC项：举重若轻是比喻能力强，能够轻松地胜任繁重的工作或处理困难的问题。与费力不是近义关系，与题干逻辑关系不一致，排除；\nD项：肝肠寸断是比喻伤心到极点，与伤心是近义关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":84,"missingImage":false},{"type":"question","qid":"2376569","cat":"类比推理","stem":"成长：衰亡","options":{"A":"坚定：彷徨","B":"美好：苦难","C":"深刻：纯真","D":"复杂：单纯"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n成长和衰亡是反义关系，并且成长是积极的，衰亡是消极的。\n第二步：判断选项词语间逻辑关系。\nA项：坚定和彷徨是反义关系，并且坚定是积极的，彷徨是消极的，与题干逻辑关系一致，当选；\nB项：美好的反义词应该是丑陋，而苦难不一定是丑陋的，很多磨难是对人的一种历练，是对人生有益的，因此美好和苦难不是反义关系，与题干逻辑关系不一致，排除；\nC项：深刻和纯真不是反义关系，与题干逻辑关系不一致，排除；\nD项：复杂和单纯是反义关系，但是复杂和单纯没有积极和消极之分，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":85,"missingImage":false},{"type":"question","qid":"2376572","cat":"类比推理","stem":"孤本：书籍","options":{"A":"正方形：长方形","B":"蔬菜：土地","C":"显微镜：实验室","D":"礼物：商品"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n孤本，指某书刊仅有一份在世间流传的版本，亦指仅存的一份未刊手稿或原物已亡佚，仅存的一份拓本。孤本是特殊的书籍。\n第二步：判断选项词语间逻辑关系。\nA项：正方形是特殊的长方形，与题干逻辑关系一致，当选；\nB项：蔬菜和土地，土地是蔬菜生长的场所，与题干逻辑关系不一致，排除；\nC项：显微镜和实验室，显微镜是实验室需要用到的工具，与题干逻辑关系不一致，排除；\nD项：有的礼物是商品，有的礼物不是商品，有的商品是礼物，有的商品不是礼物，二者为交叉关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":86,"missingImage":false},{"type":"question","qid":"2376537","cat":"类比推理","stem":"玻璃幕墙：光污染","options":{"A":"汽车尾气：酸雨","B":"海上风暴：海啸","C":"火山喷发：地震","D":"空气消毒：臭氧"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n玻璃幕墙可以导致光污染，二者是因果关系，并且玻璃幕墙是人为产物。\n第二步：判断选项词语间逻辑关系。\nA项：汽车尾气可以导致酸雨，二者为因果关系，并且汽车尾气是人为产物，与题干逻辑关系一致，当选；\nB项：海上风暴可以导致海啸，二者为因果关系，但海上风暴为天然现象，与题干逻辑关系不一致，排除；\nC项：火山喷发可以导致地震，二者为因果关系，但火山喷发为天然现象，与题干逻辑关系不一致，排除；\nD项：空气消毒不会导致臭氧，二者不是因果关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"2376575","cat":"类比推理","stem":"老字号：新品牌：传承","options":{"A":"老传统：新花样：质疑","B":"老配方：新工艺：创新","C":"老问题：新思考：评价","D":"老物件：新东西：区分"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n老字号经过传承可以变为新品牌。\n第二步：判断选项词语间逻辑关系。\nA项：老传统被质疑不能变为新花样，与题干逻辑关系不一致，排除；\nB项：老配方经过创新可以变为新工艺，与题干逻辑关系一致，当选；\nC项：老问题被评价不能变为新思考，与题干逻辑关系不一致，排除；\nD项：老物件被区分不能变为新东西，与题干逻辑关系不一致，排除。\n注：此题有同学可能会纠结D项，认为老字号与新品牌都是品牌，老物件与新东西都是物品。但D项前两个词与区分无关。从题干三个词的关系看体现了新老物体之间的变化，而B项也是体现了新老事物之间的变化，因此粉笔更倾向于B项。\n故正确答案为B。","no":88,"missingImage":false},{"type":"question","qid":"2376771","cat":"类比推理","stem":"人烟辐辏：鸡犬相闻：繁盛","options":{"A":"人迹罕至：门可罗雀：荒凉","B":"筑巢引凤：腾笼换鸟：友善","C":"战马长矛：坚船利炮：强大","D":"大国工匠：小国寡民：专注"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n人烟辐辏指居民密集；鸡犬相闻指鸡鸣狗吠的声音都能听到，指人烟稠密。二者均可以形容繁盛。\n第二步：判断选项词语间逻辑关系。\nA项：人迹罕至指偏僻荒凉的地方很少有人来过；门可罗雀指门庭冷落车马稀少。二者均可以形容荒凉。与题干逻辑关系一致，当选；\nB项：筑巢引凤指提供良好条件，吸引人才或技术、资金等；腾笼换鸟也叫“双转移战略”，指珠三角劳动密集型产业向东西两翼、粤北山区转移；而东西两翼、粤北山区的劳动力，一方面向当地第二、第三产业转移，另一方面其中的一些较高素质劳动力，向发达的珠三角地区转移。二者与友善无关，与题干逻辑关系不一致，排除；\nC项：“战马长矛”指的是战争时使用的作战工具，与“强大”无明显逻辑关系；“坚船利炮”指战舰坚固，大炮猛烈，形容海军强盛，可以形容“强大”，与题干逻辑关系不一致，排除；\nD项：大国工匠是央视新闻推出的八集系列节目，讲述了不同岗位劳动者用自己的灵巧双手，匠心筑梦的故事；小国寡民指国家小、人民少。二者与专注无关，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":89,"missingImage":false},{"type":"question","qid":"2376775","cat":"类比推理","stem":"鞋匠：缝纫机：大头皮鞋","options":{"A":"厨师：炒菜锅：青椒炒肉","B":"矿工：十字镐：钙铁榴石","C":"记者：录音笔：高端访谈","D":"园丁：洒水壶：鹿角海棠"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n鞋匠用缝纫机制作大头皮鞋，鞋匠是职业，缝纫机是使用的工具，大头皮鞋是鞋匠制作的成品。\n第二步：判断选项词语间逻辑关系。\nA项：厨师用炒菜锅制作青椒炒肉，厨师是职业，炒菜锅是使用的工具，青椒炒肉是厨师制作的成品，与题干逻辑关系一致，当选；\nB项：矿工用十字镐挖掘钙铁榴石（含钛、铬的石榴石都属于钙铁榴石），矿工是职业，十字镐是使用的工具，钙铁榴石可以是十字镐作用的对象，与题干逻辑关系不一致，排除；\nC项：记者用录音笔记录高端访谈，记者是职业，录音笔是使用的工具，“高端访谈”是“记者”参与的活动，与题干逻辑关系不一致，排除；\nD项：园丁用洒水壶浇灌鹿角海棠（属多年生肉质灌木），园丁是职业，洒水壶是使用的工具，鹿角海棠是洒水壶作用的对象，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":90,"missingImage":false},{"type":"question","qid":"2376558","cat":"类比推理","stem":"效率：公平：市场经济","options":{"A":"科学：理性：政治哲学","B":"革命：改良：社会制度","C":"民主：集中：组织原则","D":"美丑：善恶：审美范畴"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n市场经济需要兼顾效率与公平。\n第二步：判断选项词语间逻辑关系。\nA项：政治哲学不需要兼顾科学与理性，且科学是理性的，与题干逻辑关系不一致，排除； \nB项：社会制度不需要兼顾革命与改良，与题干逻辑关系不一致，排除；\nC项：组织原则需要兼顾民主与集中，与题干逻辑关系一致，当选；\nD项：审美范畴不需要兼顾美丑与善恶，且善恶不属于审美的范畴，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":91,"missingImage":false},{"type":"question","qid":"2376570","cat":"类比推理","stem":"瓮牖绳枢：粗茶淡饭：清寒","options":{"A":"叠床架屋：衣锦食肉：奢华","B":"箪食瓢饮：曲肱饮水：简朴","C":"轻车熟路：霜行草宿：轻松","D":"金盆洗手：金屋藏娇：阔绰"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n瓮牖绳枢指以破瓮作窗户，以草绳系户枢，比喻贫穷人家；粗茶淡饭形容饮食简单，生活简朴，二者都可以用来形容清寒。\n第二步：判断选项词语间逻辑关系。\nA项：叠床架屋比喻办事重复，自找麻烦；衣锦食肉形容生活富足，第一词与奢华无关，与题干逻辑关系不一致，排除；\nB项：箪食瓢饮形容读书人安于贫穷的清高生活；曲肱饮水形容清心寡欲、安贫乐道的生活，二者都可以用来形容简朴，与题干逻辑关系一致，当选；\nC项：轻车熟路比喻事情又熟悉又容易；霜行草宿指在霜露中行走，草野中息宿，形容奔波劳苦，第二词与轻松无关，与题干逻辑关系不一致，排除；\nD项：金盆洗手指放弃以前长期从事的行业或某件事；金屋藏娇指十分宠爱妻子，也指男人纳妾或在外包养女人，二者均与阔绰无关，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":92,"missingImage":false},{"type":"question","qid":"2376820","cat":"类比推理","stem":"巾帼 之于 （    ） 相当于 （    ） 之于 监狱","options":{"A":"须眉；囚犯","B":"英雄；犯罪","C":"女子；铁窗","D":"头饰；惩罚"},"answer":"C","explanation":"逐一代入选项。\nA项：巾帼原指古代妇女的头巾和发饰，也借指妇女、女子，须眉指代男子，巾帼和须眉是并列关系；囚犯关押于监狱之中，二者是人物和场所的对应关系。前后逻辑关系不一致，排除；\nB项：巾帼和英雄是交叉关系；犯罪之后可能会囚禁在监狱里，犯罪和监狱是对应关系。前后逻辑关系不一致，排除；\nC项：巾帼原指古代妇女的头巾和发饰，也借指妇女、女子；铁窗是装上铁栅的窗户，比喻象征监狱。前后逻辑关系一致，当选；\nD项：巾帼原指古代妇女的头巾和发饰，与头饰属于种属关系；惩罚与监狱无明显逻辑关系。前后逻辑关系不一致，排除。\n故正确答案为C。","no":93,"missingImage":false},{"type":"question","qid":"2376598","cat":"类比推理","stem":"（    ） 对于 幸灾乐祸 相当于 怨天尤人 对于 （    ）","options":{"A":"得意忘形；呼天号地","B":"乐极生悲；饮恨吞声","C":"兔死狐悲；乐天知命","D":"睚眦必报；破涕为笑"},"answer":"C","explanation":"逐一代入选项。\nA项：得意忘形指因心意得到满足而高兴得失去常态，幸灾乐祸指人缺乏善意，在别人遇到灾祸时感到高兴，二者无关；怨天尤人指遇到挫折或出了问题，一味抱怨天责怪别人，呼天号地形容极为冤屈、怨恨或痛苦，二者无关，前后逻辑关系不一致，排除；\nB项：乐极生悲指高兴到极点时，发生使人悲伤的事，与幸灾乐祸无关；饮恨吞声形容忍恨含悲，不敢表露，与怨天尤人无关，前后逻辑关系不一致，排除；\nC项：兔死狐悲指对同盟的死亡或不幸而伤心，与幸灾乐祸构成反义关系；乐天知命指认为自己的一切都由命运支配，安于现状，与怨天尤人构成反义关系，前后逻辑关系一致，当选；\nD项：睚眦必报指像瞪一下眼睛那样极小的怨仇也要报复，比喻心胸极其狭窄，与幸灾乐祸无关；破涕为笑形容转悲为喜，一下子从哭变为了笑，与怨天尤人无关，前后逻辑关系不一致，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"2376779","cat":"逻辑判断","stem":"多数家长的投入对子女学业投入具有显著的正向预测作用，家长投入程度随子女学段升高而降低，同时多数家长更注重在家辅导的投入，对子女参与社区及学校活动的投入较欠缺。而家长自主支持或控制的教养风格在家长投入与子女学业投入的关系中起调节作用，且部分通过子女学业心理需要的满足这一中介变量产生作用。\n由此可以推出：","options":{"A":"多数家长对子女教育投入的减少，意味着子女学段的升高","B":"家长的投入、教养风格必然会对子女的学业投入产生影响","C":"家中学习环境的创设、形成和学校、社区间的联系呈反比关系","D":"子女学业心理需要的满足是影响其学业投入的内驱和首要因素"},"answer":"B","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干指出“家长投入程度随子女学段升高而降低”，先有子女学段升高，后有投入降低，而选项说的是家长对教育投入减少，意味着子女学段的升高，存在逻辑顺序错误，不能推出，排除； \nB项：题干指出“多数家长的投入对子女学业投入具有显著的正向预测作用”和 “家长自主支持或控制的教养风格在家长投入与子女学业投入的关系中起调节作用”，说明家长的投入、教养风格均会对子女学业的投入产生影响，虽然“必然”这一表述过于绝对，但产生的影响可大可小，哪怕是微乎其微的影响，也可以说“必然有影响”，因此该选项是可以推出的，当选；\nC项：题干指出“多数家长更注重在家辅导的投入，对子女参与社区及学校活动的投入较欠缺”，这是单纯对两种投入的多少情况进行描述，并未体现两种投入之间存在反比关系，过度脑补，无法推出，排除；\nD项：题干只是说 “子女学业心理需要的满足是中介变量”，无法推出其是内驱和首要因素，无中生有，排除。\n故正确答案为B。\n注：本题确实非常有争议，大部分同学在A项和B项中纠结，A项的顺序反了，B项说得太绝对，都有不能接受的问题，所以我们通过查询原文和多次教研发现，B项就是整篇论文想重点讨论的核心内容，从以往经验来看，如果出题人在出题时题干大量参考了某篇文章，一般选项就不会违背该论文的主旨来出题，故小粉笔择优把答案给到B项。争议题各说各有理，备考时间有限，该题可不作为备考重点题目。\n原文网址：https://www.sohu.com/a/311522939_186472?sec=wd","no":95,"missingImage":false},{"type":"question","qid":"2376564","cat":"逻辑判断","stem":"快速、持续、无法预测的竞争环境要求企业规模小，结构简化，同时要有足够的技术储备和抵抗资金风险的能力。目前解决这一矛盾的途径通常是建立全球范围内的“基于双赢原则”的虚拟企业。虚拟企业是企业间的一种动态联盟，参加虚拟企业的各成员企业有一定的自主权。当出现了市场机会，各加盟企业就组织在一起，共同开发并生产销售新产品，一旦发现该产品无利可图，便自动解散。因此，虚拟企业被认为是21世纪最有竞争力的企业运行模式。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"当今社会发达的现代信息技术和通讯手段为各企业间的沟通提供了便利","B":"企业想在当前的竞争环境中生存发展扩大优势，需要一种新的运行模式","C":"虚拟企业中的任一加盟企业生产上出现问题都会中断整个生产链的运行","D":"虚拟企业可迅速集中最强设计加工与销售力量，实现对市场的快速反应"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：虚拟企业被认为是21世纪最有竞争力的企业运行模式。\n论据：当出现了市场机会，各加盟企业就组织在一起，共同开发并生产销售新产品，一旦发现该产品无利可图，便自动解散。\n论点论据都在说虚拟企业的优势，话题一致，优先考虑补充论据，补充能够证明虚拟企业是最有竞争力的企业运营模式的理由进行加强。\n第二步：逐一分析选项。\nA项：现代发达的信息技术为各企业之间的沟通提供便利，但是提供便利不代表就有竞争力，话题不一致，无法加强，排除；\nB项：企业想在竞争环境中生存发展扩大优势，需要新的运行模式，但新的运行模式是否指的是虚拟企业不清楚，无法加强，排除；\nC项：虚拟企业中的任一加盟企业生产出现问题都会中断整个生产链的运行，说的是虚拟企业的缺点，但有缺点不代表没有竞争力，虚拟企业是否是最有竞争力的企业运行模式未知，话题不一致，无法加强，排除；\nD项：虚拟企业能够快速集中最强的力量做出最快的反应，说明虚拟企业的优势，并且力量最强，速度最快，也可说明虚拟企业是最有竞争力的运营模式，补充论据，可以加强，当选。\n故正确答案为D。","no":96,"missingImage":false},{"type":"question","qid":"2376576","cat":"逻辑判断","stem":"信天翁属于鹱形目，有着管状的鼻子，嗅觉灵敏，经常为了觅食在外海上长距离飞行。那些漂浮在海上的塑料垃圾看起来并非美味，可信天翁为什么会吃下它们，并为此付出沉重代价呢？研究人员认为原因在于：对于信天翁而言，这些塑料垃圾闻起来“很好吃”。“美食信号”是一种名叫二甲基硫醚（DMS）的化学物质，这种气味物质在海洋浮游植物的作用下产生。\n以下哪项如果为真，无法支持研究人员的观点？","options":{"A":"鹱形目鸟类当中有一部分物种常聚集在海洋浮游植物丰盛的地方","B":"误食塑料垃圾会导致海鸟行动不便、消化道阻塞，健康慢性受损","C":"实验证明在海中浸泡三周后的塑料样品上都检测到了DMS成分","D":"对DMS气味敏感的鹱形目鸟类可以探测到浓度极低的气味分子"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：信天翁吃塑料垃圾，是因为它们闻起来“很好吃”。\n论据：“美食信号”是二甲基硫醚（DMS），这种气味物质在海洋浮游植物的作用下产生。\n本题为选非题，需将三个能够加强的选项排除。论点说的是塑料垃圾闻起来“好吃”，论据在解释为什么闻起来“好吃”，论点论据说的是一回事，所以可以补充论据来加强。\n第二步：逐一分析选项。\nA项：讨论的是这类鸟中，有一部分聚集在海洋浮游植物丰盛的地方，而海洋浮游植物会产生“美食信号”，让鸟类闻起来“很好吃”，所以解释了题干的论点，可以加强，排除；\nB项：讨论的是误食塑料垃圾会给海鸟带来的不良后果，与题干讨论的为什么垃圾闻起来“好吃”没有关系，不能加强，当选；\nC项：说明塑料垃圾经过海水的浸泡会产生DMS，解释了为什么信天翁闻着塑料垃圾会觉得“很好吃”，可以加强，排除；\nD项：如果鹱形目鸟类不能探测到浓度极低的气味分子，那就不会去吃那些垃圾，该项是论点成立的必要条件，可以加强，排除。\n本题为选非题，故正确答案为B。","no":97,"missingImage":false},{"type":"question","qid":"2376592","cat":"逻辑判断","stem":"研究发现，20到39岁的群体更热衷于使用智能手机中的运动类应用。最主要的原因在于该群体大部分都已经参加工作，且亚健康在该群体中较普遍，所以越来越多的白领和年轻人更注重身体健康；同时，年轻人肥胖率占比较高，而年轻人对美的追求远远超过中老年人，所以他们更在乎运动；此外，该年龄段的用户群体也更熟悉智能手机的操作。\n以下哪项如果为真，最能削弱上述调研发现？","options":{"A":"许多年轻人沉迷于智能手机中的游戏","B":"许多年轻人长期加班，睡眠远远不足","C":"年轻人不坚持运动易引发亚健康问题","D":"当代年轻人营养过于丰富，体型偏胖"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：20到39岁的群体更热衷于使用智能手机中的运动类应用。\n论据：最主要的原因在于该群体大部分都已经参加工作，且亚健康在该群体中较普遍，所以越来越多的白领和年轻人更注重身体健康；同时，年轻人肥胖率占比较高。而年轻人对美的追求远远超过老年人，所以他们更在乎运动；此外，该年龄段的用户群体也更熟悉智能手机的操作。\n本题的论点是20到39岁的群体更喜欢用智能手机中的运动类应用，其中的“更”表明了比较关系，因此削弱论点时要么削弱论点中的中心话题（年轻人不喜欢用手机中的运动类应用），要么直接削弱论点中比较关系（年轻人更喜欢用的不是智能手机中的运动类应用）。\n第二步：逐一分析选项。\nA项：论点说的是年轻人更喜欢用智能手机运动类应用，而该项说的是有很多年轻人沉迷的是智能手机中的游戏，削弱了论点中所说的运动类应用更受欢迎，削弱论点，当选；\nB项：论点讨论的是年轻人更喜欢用智能手机的运动类应用，论据中第二句说的是年轻人大部分因工作处于亚健康状态，因此注重身体健康，本项说的是年轻人因经常加班而睡眠不足，因此本项支持了该论据，无法削弱，排除；\nC项：本项说的是不坚持运动易导致亚健康，论据中第二句说的是年轻人大部分因工作处于亚健康状态，因此本项支持了该论据，无法削弱，排除；\nD项：论据第二句是通过说明年轻人肥胖率占比高，年轻人更追求美来解释论点原因，本项说现在年轻人确实体型肥胖，加强了该论据，无法削弱，排除。\n故正确答案为A。","no":98,"missingImage":false},{"type":"question","qid":"2376554","cat":"逻辑判断","stem":"长久以来，心理学家都支持“数学天赋论”：数学能力是人类自打娘胎里出来就有的能力，就连动物也有这种能力。他们认为存在一种天生的数学内核，通过自我慢慢发展，这种数学内核最后会“长”成我们所熟悉的一切数学能力。最近有反对者提出了不同的看法：数学能力没有天赋，只能是文化的产物。\n以下哪项如果为真，最能支持反对者的看法？","options":{"A":"10~12个月的婴儿已经知道3个黑点和4个黑点是不一样的","B":"数学是大脑的产物，而大脑的生长模式早已由基因“预设”","C":"经过人为训练的大猩猩、海豚和大象等动物能处理数学问题","D":"绝大多数的原始部落的居民只能表示5以下甚至更少的数量"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：数学能力没有天赋，只能是文化的产物。\n论据：无。\n本题只有论点，没有论据，所以优先考虑补充论据的方式来加强。\n第二步：逐一分析选项。\nA项：说明婴儿可以区分数量不同的黑点，举例说明数学能力是有天赋的，否定论点，无法加强，排除；\nB项：说明数学是大脑的产物，大脑已被基因预设，也就是说数学是有天赋的，否定论点，无法加强，排除；\nC项：指出部分动物经过训练能处理数学问题，但是并不知道其是否有数学能力的天赋，不明确选项，无法加强，排除； \nD项：说明绝大多数的原始部落的居民只能表示5甚至以下的数字，通过举例子的方式说明数学能力确实是文化的产物，补充论据，可以加强，当选。\n故正确答案为D。","no":99,"missingImage":false},{"type":"question","qid":"2376583","cat":"逻辑判断","stem":"牙医在治疗龋齿时，先要去除牙齿龋坏的部分，再填充材料以修补缺损的牙体。但是，\u003cimg data-k=\"fc324c3b9ecb\">至\u003cimg data-k=\"0c486c1399ce\">的补牙会失败，且所用的填充物并不具备使牙齿自愈的功能，甚至还有副作用。有鉴于此，研究人员研发出一种用合成生物材料制成的填充物，可以刺激牙髓中干细胞的生长，修复受损部位。这种填充物能刺激干细胞的增殖，并分化成牙本质。如果未来补牙的填充物都用这样的再生材料制成，将降低补牙失败率，也可减少蛀牙患者治疗牙髓之苦。\n由此可以推出：","options":{"A":"未来人们将不再患上蛀牙病","B":"未来人们将不再受龋齿困扰","C":"新研发的补牙填充物能刺激受损牙齿自愈","D":"新研发的补牙填充物能促进牙本质的生长"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据最后一句话可知，未来补牙的填充物将降低补牙失败概率，也可减少蛀牙患者治疗牙髓之苦，只是减少治疗的痛苦，但是没有提及将来会不会患上蛀牙病，无法推出，排除；\nB项：题干中指出未来补牙的填充物可以减少治疗牙髓之苦，但是没有涉及将来会不会受龋齿困扰，无法推出，排除；\nC项：根据第三句话可知，新研发的补牙填充物可以刺激牙髓中干细胞的生长，修复受损部位，可以推出新研发的补牙填充物能刺激受损牙齿自愈，当选；\nD项：根据第四句话可知，新研发的补牙填充物可以刺激干细胞的增殖，并分化成牙本质，但并不是促进牙本质的生长，“分化”并不意味着“促进生长”，偷换概念，排除。\n故正确答案为C。","no":100,"missingImage":false},{"type":"question","qid":"2376594","cat":"逻辑判断","stem":"如今，基于互联网的新型科普方式层出不穷。浅阅读、视频直播以及游戏互动等方式，使得如今获取科学知识的渠道越来越多、门槛也越来越低。研究者认为，尽管“互联网+科普”令科学知识的获取和传播方式发生了很大变化，但这不是对科普传播的一种颠覆，而是显示了公民科学素养的提升。\n以下哪项如果为真，最能质疑研究者的观点？","options":{"A":"新闻应用、微博等资讯类媒体是用户了解科学热点事件的最主要渠道","B":"在许多科学热点事件的传播过程中，公众很难见到权威科学家的身影","C":"数据表明，用户普遍乐于通过图文资讯这样轻松愉悦的形式获取知识","D":"比起明星八卦，在社交媒体转发科普内容更能为转发者本人形象加分"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：“互联网\u003cimg data-k=\"3d6d1f96db11\">科普”不是对科普传播的一种颠覆，而是显示了公民科学素养的提升。\n论据：无。\n本题无论据，只能通过直接否论点进行削弱。可以说 “互联网\u003cimg data-k=\"3d6d1f96db11\">科普”是对科普传播的一种颠覆，并没有显示出公民科学素养的提升。\n第二步：逐一分析选项。\nA项：该项说的是用户获取知识的最主要渠道是哪些，而论点说的是互联网传播科学知识是否会让公民科学素养的提升，与论点话题不一致，无法削弱，排除；\nB项：该项说很难见到权威科学家的身影，说明公众接触到的科学知识是并不权威的，即科学素养没有提升，直接否定题干论点，当选；\nC项：该项说的是用户喜欢用图文资讯的方式获取知识，而论点说的是互联网传播知识是否会让公民科学素养提升，话题不一致，无法削弱，排除；\nD项：该项说的是转发科普内容会使转发者形象加分，说明比起转发明星八卦，公众对于转发科普内容的人评价更高，显示出公众更重视科学，即显示了公众科学素养的提升，属于加强，不能削弱，排除。\n故正确答案为B。\n注：本题通过查询原文，如下图所示，张谦女士提出了观点“互联网+科普”不是对科普传播的一种颠覆，而是有利于公民科学素养的提升。后面的便开始分析提出这个观点的原因，所以在此题中D项是加强项，而非削弱项。\n \n\u003cimg data-k=\"dd2584d5b421\" style=\"max-width:511px\">","no":101,"missingImage":false},{"type":"question","qid":"2376568","cat":"逻辑判断","stem":"在抗生素大规模医用之前，耐药效果对细菌几乎没有意义，突变自身的有害效果更加重要。正常使用抗生素能杀死几乎所有的目标细菌，个别漏网之鱼通常也会被人体免疫系统消灭殆尽。其中一些细菌个体虽然已经带有耐药性的萌芽，但这些萌芽不足以抵御正常剂量抗生素，也会随着个体死去而消失。\n由此可以推出：","options":{"A":"基因突变是耐药细菌泛滥成灾的根本原因","B":"细菌通过基因突变，来削弱抗生素的作用效果","C":"致病菌产生耐药性之后，抗生素将无法攻击病菌","D":"如果没有抗生素滥用，耐药性不会快速蔓延开来"},"answer":"D","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干中没有涉及到耐药细菌泛滥成灾的根本原因，无中生有，排除；\nB项：题干只说到“细菌突变自身的有害效果”，没有明确说明是否是基因突变，无中生有，排除；\nC项：题干中指出有耐药性的细菌个体不足以抵御正常剂量抗生素，说明抗生素还是会去攻击病菌，并不是选项中表述的无法攻击病菌，排除；\nD项：根据第一句可知，抗生素大规模使用之前，耐药性对细菌几乎没有意义，说明如果没有抗生素滥用，耐药性就不会快速蔓延，当选。\n故正确答案为D。","no":102,"missingImage":false},{"type":"question","qid":"2376790","cat":"逻辑判断","stem":"某国际古生物学研究团队最新报告称，在2.8亿年前生活在南非的正南龟是现代乌龟的祖先，它们是在二叠纪至三叠纪大规模物种灭绝事件中幸存下来的。当时，为了躲避严酷的自然环境，它们努力向地下挖洞，同时为保证前肢的挖掘动作足够有力，身体需要一个稳定的支撑，从而导致了肋骨不断加宽。由此可知，乌龟有壳是适应环境的表现，只不过不是为了保护，而是为了向地下挖洞。\n上述结论的成立需要补充以下哪项作为前提？","options":{"A":"只有挖洞才能从大规模物种灭绝事件中幸存","B":"现代乌龟继承了正南龟善于挖洞的某些习性","C":"正南龟前肢足够有力因而并不需要龟壳保护","D":"龟壳是由乌龟的肋骨逐渐加宽后进化而来的"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：乌龟有壳是适应环境的表现，只不过不是为了保护，而是为了向地下挖洞。\n论据：为了躲避严酷的自然环境，它们努力向地下挖洞，同时为保证前肢的挖掘动作足够有力，身体需要一个稳定的支撑，从而导致了肋骨不断加宽。\n问前提，优先考虑搭桥。论点讨论的是乌龟有壳是为了向地下挖洞，论据讨论的是为了适应环境，导致了乌龟的肋骨不断加宽，论点论据讨论的不是一回事，在论点论据之间进行搭桥，可以说明肋骨加宽和有壳之间的关系。\n第二步：逐一分析选项。\nA项：讨论的是如何在大规模物种灭绝事件中幸存，没有说明龟壳与肋骨加宽之间的关系，无法加强，排除；\nB项：讨论的是现代乌龟所继承的习性，没有说明龟壳与肋骨加宽之间的关系，无法加强，排除；\nC项：只解释了正南龟的龟壳不是起到保护的作用，但没有说明龟壳与肋骨加宽之间的关系，没有搭桥，排除；\nD项：说明龟壳是由肋骨加宽后进化而来的，在论点论据之间搭桥，当选。\n故正确答案为D。","no":103,"missingImage":false},{"type":"question","qid":"2376555","cat":"逻辑判断","stem":"自制力不仅关乎自我控制，还包括排除不相关刺激的干扰和坚持完成相关任务（即使是自己不喜欢的任务）的能力。自制力是稳定不变的，还是会被消耗的，学界各派的看法不一。心理学家把实验对象分为两组，让他们同场解决难题。一组解题时只能吃萝卜，另一组还可以吃饼干。结果只吃萝卜的这组坚持时间更短，因为他们在抵制饼干的诱惑的同时，消耗了自制力。他们由此得出结论：人们的自制力是有限的，过度使用会导致自制力下降。\n上述结论的成立需要补充以下哪项作为前提？","options":{"A":"实验对象对解决难题的兴趣不完全相同","B":"饼干和萝卜对实验对象的诱惑力不相同","C":"饼干和萝卜补充人体能量的效果不相同","D":"两组实验对象抗干扰的能力不完全相同"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：人们的自制力是有限的，过度使用会导致自制力下降。\n论据：心理学家把实验对象分为两组，让他们同场解决难题。一组解题时只能吃萝卜，另一组还可以吃饼干。结果只吃萝卜的这组坚持时间更短，因为他们在抵制饼干诱惑的同时，消耗了自制力。\n论据和论点话题一致，且问题为“前提”，优先考虑必要条件。\n第二步：逐一分析选项。\nA项：实验对象对于解决问题的兴趣不同，说明实验起点不一致，并不知道过度使用自制力是否会消耗自制力，无法加强，排除；\nB项：饼干和萝卜对人们的诱惑力不同，如果相同的话，那么就无法通过对比饼干和萝卜得到抵制饼干的诱惑会消耗自制力，是论证成立的前提，当选；\nC项：饼干和萝卜对人体的能量补充的效果，与题干论点无关，为无关选项，无法加强，排除； \nD项：实验对象抗干扰能力不同，说明实验起点不一致，并不知道过度使用自制力是否会消耗自制力，无法加强，排除。\n故正确答案为B。","no":104,"missingImage":false},{"type":"question","qid":"2376591","cat":"逻辑判断","stem":"有研究声称：癌细胞怕热，高体温可以抗癌。人体最容易罹癌的器官包括肺、胃、大肠、乳腺等都是体温较低的部位，心脏之类的“高温器官”不容易得癌症。因此，可以用运动、喝热水、泡澡等方法提高体温来抗癌。\n以下哪项如果为真，最能反驳上述论断？","options":{"A":"受呼吸、饮食等影响，人的口腔温度一般比直肠温度低，而世界范围内直肠癌的发生率要高于口腔癌","B":"人的体温存在精准的调控机制，基本保持平稳状态，体内各个脏器之间并没有什么明显的温度差异","C":"热疗或许可以帮助放疗或一些化疗发挥更好的作用，但证明其可靠性的研究数据依然不足","D":"心脏很少发生恶性肿瘤，是因为这里的心肌细胞不再进行分裂增殖，而与温度高低无关"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：可以用运动、喝热水、泡澡等方法提高体温来抗癌。\n论据：人体最容易罹癌的器官包括肺、胃、大肠、乳腺等都是体温较低的部位，心脏之类的“高温器官”不容易得癌症。\n本题的论点指出提高体温抗癌的方法，论据中也是在说“高温器官”不容易得癌症，所以论点、论据讨论话题一致，要想削弱优先考虑否定论点。\n第二步：逐一分析选项。\nA项：人的口腔温度一般比直肠温度低，而世界范围内直肠癌的发生率要高于口腔癌，说明直肠温度高，直肠癌发生率高，提高体温并不能抗癌，举反例削弱题干论点，保留；\nB项：选项指出体内各个脏器之间并没有明显温度差异，那么肺、胃、大肠、乳腺等就不是体温“较低”的部位，也就没有“高温器官”之说，可以削弱题干论据，保留；\nC项：热疗或许可以发挥更好的作用，但证明其可靠性的研究数据依然不足，因此不确定提高体温是否真的有利于抗癌，属于不明确选项，排除；\nD项：指出心脏很少发生恶性肿瘤，是因为心肌细胞不再分裂增殖，而与温度高低无关，可以削弱题干论据，保留。\n对比ABD三项，A项削弱论点的力度强于B项和D项的削弱论据。\n故正确答案为A。","no":105,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2017年我国成年国民图书阅读率为\u003cimg data-k=\"35afc4ae2ffb\">，比上年增加0.3个百分点；报纸阅读率为\u003cimg data-k=\"6e0815d17580\">，比上年降低2.1个百分点；期刊阅读率为\u003cimg data-k=\"d5edcb561f3f\">，比上年增加1个百分点。\u003cbr>\u003c/p>\u003cp>        2017年我国成年国民数字化阅读方式(网络在线阅读、手机阅读、电子阅读器阅读、平板电脑阅读等)的接触率为\u003cimg data-k=\"cd2cbf4204ac\">。其中，网络在线阅读接触率为\u003cimg data-k=\"f534d9a6c651\">，比上年增加4.4个百分点；手机阅读接触率为\u003cimg data-k=\"7ab1b9b5d7ed\">，比上年增加4.9个百分点；电子阅读器阅读接触率为\u003cimg data-k=\"7b20c874633f\">，比上年增加6.5个百分点；平板电脑阅读接触率为\u003cimg data-k=\"ede29b92 <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
