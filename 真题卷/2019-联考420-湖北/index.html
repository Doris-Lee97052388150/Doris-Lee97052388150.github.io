<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2019-联考420-湖北","title":"2019年420联考《行测》题（湖北卷）（网友回忆版）","year":"2019","group":"联考","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2376461","cat":"新思想","stem":"习近平总书记在中央政治局第十三次集体学习时强调，要精准有效处置重点领域风险，深化金融改革开放，增强金融服务           能力，坚决打好防范化解包括金融风险在内的重大风险攻坚战，推动我国金融业健康发展。","options":{"A":"实体经济","B":"私营经济","C":"中小企业","D":"国有企业"},"answer":"A","explanation":"本题考查政治常识。\n2019年2月22日，中共中央政治局就完善金融服务、防范金融风险举行第十三次集体学习。习近平总书记在主持学习时强调：“要深化对国际国内金融形势的认识，正确把握金融本质，深化金融供给侧结构性改革，平衡好稳增长和防风险的关系，精准有效处置重点领域风险，深化金融改革开放，增强金融服务实体经济能力，坚决打好防范化解包括金融风险在内的重大风险攻坚战，推动我国金融业健康发展。”\n故正确答案为A。","no":1,"missingImage":false}],"count":1,"answerable":1,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2376683","cat":"法律常识","stem":"关于全面依法治国，下列说法不准确的是：","options":{"A":"到本世纪中叶，基本建成法治国家、法治政府、法治社会","B":"全面依法治国在“四个全面”中具有基础性、保障性作用","C":"党的领导是社会主义法治最根本的保证","D":"中国特色社会主义法治体系是中国特色社会主义制度的法律表现形式"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，党的十九大报告指出：“综合分析国际国内形势和我国发展条件，从2020年到本世纪中叶可以分两个阶段来安排。第一个阶段，从2020年到2035年，在全面建成小康社会的基础上，再奋斗十五年，基本实现社会主义现代化。到那时，我国经济实力、科技实力将大幅跃升，跻身创新型国家前列；人民平等参与、平等发展权利得到充分保障，法治国家、法治政府、法治社会基本建成，各方面制度更加完善，国家治理体系和治理能力现代化基本实现······”因此，到2035年，基本建成法治国家、法治政府、法治社会。\nB项正确，2018年8月24日中央全面依法治国委员会第一次会议顺利召开，习近平总书记作出重要讲话。他强调：“全面依法治国具有基础性、保障性作用，在统筹推进伟大斗争、伟大工程、伟大事业、伟大梦想，全面建设社会主义现代化国家的新征程上，要加强党对全面依法治国的集中统一领导，坚持以全面依法治国新理念新思想新战略为指导，坚定不移走中国特色社会主义法治道路，更好发挥法治固根本、稳预期、利长远的保障作用。”\nC项正确，党的十八届四中全会通过的《中共中央关于全面推进依法治国若干重大问题的决定》指出：“党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。”\nD项正确，建设中国特色社会主义法治体系、建设社会主义法治国家是坚持和发展中国特色社会主义的内在要求。习近平总书记强调：“我们要建设的中国特色社会主义法治体系，本质上是中国特色社会主义制度的法律表现形式”。\n本题为选非题，故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"2376493","cat":"人文常识","stem":"关于生态文明建设，下列说法正确的是:","options":{"A":"蓝天保卫战是全面建成小康社会的三大攻坚战之一","B":"加快构建生态文明体系是解决污染问题的根本之策","C":"生态环境安全是经济社会持续健康发展的重要保障","D":"地方政府主要领导是本行政区域生态环境保护第一责任人"},"answer":"C","explanation":"本题考查政治常识。\nA项错误，2017年10月18日，习近平总书记在十九大报告中指出：“要坚决打好防范化解重大风险、精准脱贫、污染防治的攻坚战，使全面建成小康社会得到人民认可、经得起历史检验。”蓝天保卫战并不是三大攻坚战之一。\nB项错误，2018年5月18日至19日，习近平总书记在全国生态环境保护大会上强调：“要全面推动绿色发展。绿色发展是构建高质量现代化经济体系的必然要求，是解决污染问题的根本之策。”\nC项正确，2018年5月18日至19日，习近平总书记在全国生态环境保护大会上强调：“要有效防范生态环境风险。生态环境安全是国家安全的重要组成部分，是经济社会持续健康发展的重要保障。”\nD项错误，2018年5月18日至19日，习近平总书记在全国生态环境保护大会上强调：“各地区各部门要增强‘四个意识’，坚决维护党中央权威和集中统一领导，坚决担负起生态文明建设的政治责任。地方各级党委和政府主要领导是本行政区域生态环境保护第一责任人，各相关部门要履行好生态环境保护职责，使各部门守土有责、守土尽责，分工协作、共同发力。”\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"2376476","cat":"人文常识","stem":"下列属于改革开放40年来我国经济建设所取得伟大成就的是：\n①建立了最完整的现代工业体系\n②成为了世界商品消费第一大国\n③主要农产品的产量跃居世界前列\n④外汇储备连续多年位居世界第一","options":{"A":"①②④","B":"①③④","C":"②③④","D":"①②③④"},"answer":"B","explanation":"本题考查政治常识。\n2018年12月18日，习近平总书记在庆祝改革开放40周年大会上的讲话中指出：“我国主要农产品产量跃居世界前列，建立了全世界最完整的现代工业体系，科技创新和重大工程捷报频传。我国基础设施建设成就显著，信息畅通，公路成网，铁路密布，高坝矗立，西气东输，南水北调，高铁飞驰，巨轮远航，飞机翱翔，天堑变通途。现在，我国是世界第二大经济体、制造业第一大国、货物贸易第一大国、商品消费第二大国、外资流入第二大国（2020年我国成为外资流入第一大国），我国外汇储备连续多年位居世界第一，中国人民在富起来、强起来的征程上迈出了决定性的步伐！”所以，①③④表述正确，②错误。\n故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"2376469","cat":"人文常识","stem":"2018年我国科技界取得了一系列重大成果，这些成果中不包括：","options":{"A":"第二艘航母出海试航","B":"嫦娥四号探测器发射成功","C":"造岛神器“天鲲号”下水","D":"国产大型水陆两栖飞机水上首飞"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，2018年5月13日，我国第二艘航母从大连造船厂码头启航，赴相关海域执行海上试验任务，主要检测验证动力系统等设备的可靠性和稳定性。\nB项正确，2018年12月8日2时23分，我国在西昌卫星发射中心用长征三号乙运载火箭成功发射嫦娥四号探测器，开启了月球探测的新旅程。嫦娥四号探测器后续将经历地月转移、近月制动、环月飞行，最终实现人类首次月球背面软着陆，开展月球背面就位探测及巡视探测，并通过已在使命轨道运行的“鹊桥”中继星，实现月球背面与地球之间的中继通信。\nC项错误，2017年11月3日，由我国自主设计研发的新一代国之重器——“天鲲号”自航绞吸挖泥船成功下水。从被称为“造岛神器”的“天鲸号”，到目前亚洲最大最先进的“天鲲号”，中国自航绞吸挖泥船的自主研制实力再一次让世人惊叹。\nD项正确，2018年10月20日，中国自主研制的大型水陆两栖飞机——“鲲龙”AG600在湖北荆门漳河机场成功实现水上首飞。至此，中国大飞机终于迈出“上天入海”完整步伐，建设航空强国轮廓愈发明晰。\n本题为选非题，故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"2376498","cat":"人文常识","stem":"下列关于血糖的说法错误的是：","options":{"A":"正常人进食后血糖浓度会升高","B":"正常人空腹超过12小时会引起低血糖","C":"南瓜能抑制葡萄糖吸收，具有降血糖作用","D":"胰岛素是人体产生的唯一能够降低血糖的激素"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，食物中存在大量的淀粉等糖类。人在进食后，糖类被人体消化吸收，因此会使血糖含量升高。\nB项正确，低血糖的常见原因包括进食过少、运动过度、药物使用不当、大量饮酒等。正常人空腹（禁食）时间过长，由于没有食入足够的糖，可能会引起低血糖。\nC项错误，南瓜中含有丰富的营养物质，其中包含了蛋白质、多糖、果胶、纤维素、维生素以及微量元素等成分，在这些众多的营养物质中，蛋白质和多糖都可以提升自身免疫功能。部分多糖会被分解成单糖，可能导致人体血糖升高。\nD项正确，胰岛素是体内唯一能够降低血糖浓度的激素，它不仅能够促使葡萄糖分解，还能抑制非糖物质转化为葡萄糖。\n本题为选非题，故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"2376486","cat":"人文常识","stem":"下列选项对“夏满芒夏暑相连”中节气的表述错误的是：","options":{"A":"“小满”表明了降水的时间和强度","B":"“芒种”反映了自然物候现象或农事活动","C":"“立夏”“夏至”体现了寒来暑往的季节变化","D":"“小暑”“大暑”标明了一年之中最热的时段"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，小满具有多重含义，从小满开始，大麦、冬小麦等夏收作物，已经结果、籽粒饱满，但尚未成熟，所以叫小满。小满反映作物的成熟、收成情况，也可以表现降水的时间和强度。\nB项正确，芒种的“芒”字，是指麦类等有芒植物的收获，“种”指谷黍类作物播种的节令。对中国大部分地区来说，芒种一到，夏熟作物要收获，夏播秋收作物要下地。反映作物的收成、播种情况，即农事活动。\nC项错误，立夏是夏季的开始，从此进入夏天，万物生长旺盛。夏至是北半球白昼最长、黑夜最短的一天，从这一天起，进入炎热季节，天地万物在此时生长最旺盛。夏至是从天文角度划分的，反映了太阳高度变化的转折点。立夏体现了季节的变化，夏至体现了太阳高度的转折。\nD项正确，小暑是天气已经很热了，但还不到最热的时候。大暑是一年中最热的节气。\n本题为选非题，故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"2376677","cat":"人文常识","stem":"下列历史事件与人物搭配正确的是：","options":{"A":"锦帆未落干戈起——隋炀帝","B":"烽火四起戏诸侯——周宣王","C":"一骑红尘妃子笑——唐睿宗","D":"车同轨，书同文——周武王"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，“锦帆未落干戈起”出自唐代胡曾的《咏史诗·汴水》，这首诗反映了：隋炀帝开凿京杭大运河，耗费了大量人力物力财力，惹得民不聊生，起义军掀起推翻隋朝统治的浪潮。\nB项错误，“烽火四起戏诸侯”，指西周时周幽王，为褒姒一笑，点燃了烽火台，戏弄了诸侯。褒姒看了果然哈哈大笑。幽王很高兴，因而又多次点燃烽火。后来诸侯们都不相信了，也就渐渐不来了。对应的人物为周幽王，而非周宣王。\nC项错误，“一骑红尘妃子笑”出自唐代杜牧的《过华清宫绝句三首》，讲的是杨贵妃喜欢荔枝，皇帝唐玄宗找人快马相运，意思是速度很快，只能看到滚滚烟尘却没有看到烈马掠过。对应的人物为唐玄宗和杨贵妃，而非唐睿宗。\nD项错误，车同轨，书同文是一个汉语成语，是谓车轨相同，文字相同。形容天下统一。《史记·秦始皇本纪》：“一法度衡石丈尺。车同轨。书同文字。”对应的是秦始皇，而非周武王。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"2376479","cat":"人文常识","stem":"下列送别诗句中不属于描写目送友人场景的是:","options":{"A":"孤帆远影碧空尽，唯见长江天际流","B":"山回路转不见君，雪上空留马行处","C":"日暮酒醒人已远，满天风雨下西楼","D":"青枫江上秋帆远，白帝城边古木疏"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“孤帆远影碧空尽，唯见长江天际流”出自唐代诗人李白的《送孟浩然之广陵》。这是首送别诗，不仅写出了友人所乘船孑然远逝的情景，而且写出诗人凭栏目送的情景，此刻，诗人伫立在黄鹤楼上，久久地注视着那渐行渐远，最终消失在茫茫水天相接之处的一片孤帆，他的心早已随船而去了。寄寓了诗人的惜别之情。\nB项正确，“山回路转不见君，雪上空留马行处。”出自盛唐岑参的《白雪歌送武判官归京》。岑参在这首诗中，以诗人的敏锐观察力和浪漫奔放的笔调，描绘了祖国西北边塞的壮丽景色，以及边塞军营送别归京使臣的热烈场面，表现了诗人和边防将士的爱国热情，以及他们对战友的真挚感情。“山回路转不见君，雪上空留马行处”，用很平淡质朴的语言表现了将士们对战友的真挚感情，字字传神，含蓄隽永。这一部分虽然描写对友人依依惜别的深情，但也表现了边塞将士的豪迈精神。\nC项错误，“日暮酒醒人已远，满天风雨下西楼。”出自唐代许浑的《谢亭送别》。这是一首送别诗。一觉醒来，已是薄暮时分。天色变了，下起了雨，四望一片迷蒙。眼前的江面，两岸的青山红叶都已经笼罩在蒙蒙雨雾和沉沉暮色之中。而朋友的船，此刻更不知道随着急流驶到云山雾嶂之外的什么地方去了。不仅写出身留谢亭而友人早已远去，而且写出暮色苍茫风雨凄迷的孤寂落寞的离愁情。\nD项正确，“青枫江上秋帆远，白帝城边古木疏。”出自唐代高适的《送李少府贬峡中王少府贬长沙》。这是一首送别诗，同时也是一首边塞诗，同时送别两人，且两人均为遭贬而迁。“青枫江”指浏水，在长沙与湘江汇合。写王少府到了长沙，在秋高气爽的季节，望着那明净高远、略无纤尘的蓝天，自然会洗尽烦恼。想象李少府到了峡中，可以去古木参天、枝叶扶疏的白帝城凭吊古迹，以求慰藉。这一句是对离别的二人共同讲的，体现了目送的场景。\n本题为选非题，故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"2376475","cat":"人文常识","stem":"荷花虽生长于池塘的污泥中，但荷叶却出污泥而不染，其主要原因是：","options":{"A":"荷叶含有大量的叶绿素，能与太阳光发生光合作用，产生自清洁","B":"荷叶表面光滑，具有非常强的光洁度，污泥很难在它的表面吸附","C":"荷叶含有疏水的纳米级蜡质，雨露落在上面会形成水珠清洁叶面","D":"荷花枝干细长，水珠落在荷叶上，容易造成荷叶晃动，甩出污泥"},"answer":"C","explanation":"本题考查科技常识。\n荷叶之所以能出污泥而不染是由荷叶叶面上存在着复杂的多重纳米和微米级的超微结构决定的：在超高分辨率显微镜下可以清晰看到，荷叶表面上有许多微小的乳突，它上面长满茸毛，乳突间的凹陷部分充满空气，这样就在紧贴叶面处形成一层极薄的只有纳米量级厚的空气层。这使得在尺寸上远大于这种结构的灰尘、雨水等降落在叶面上后，隔着一层极薄的空气，从而雨水会自动聚集成球形水珠，而水珠的滚动会把落在叶面上的尘土污泥吸附掉滚出叶面，使叶面始终保持干净，这就是著名的“荷叶自洁效应”。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"2376512","cat":"人文常识","stem":"首次把《大学》《中庸》《论语》和《孟子》编在一起的学者是：","options":{"A":"朱熹","B":"程颐、程颢","C":"董仲舒","D":"颜之推"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，南宋理学家朱熹首次将《大学》、《中庸》、《论语》、《孟子》汇集在一起，并为其作章句集注，成《四书章句集注》一书，对后世产生了深远的影响。\nB项错误，程颢、程颐兄弟，河南洛阳人，北宋著名理学家、教育家，“洛学”代表人物，世称“二程”，其理学思想对后世影响深远，南宋理学“集大成者”朱熹正是继承和发展了他们的学说。“二程”的理学思想主要见于《遗书》《文集》和《经说》等，现均收入《二程集》。\nC项错误，董仲舒，汉代思想家、哲学家、政治家、教育家。他在著名的《举贤良对策》中系统地提出了“天人感应”、“大一统”学说和“罢黜百家，表彰六经”的主张。董仲舒的儒家思想大大维护了汉武帝的集权统治，为当时社会政治和经济的稳定做出了贡献。\nD项错误，颜之推，字介，汉族，琅琊临沂（今山东临沂）人。中国古代文学家、教育家，生活年代在南北朝至隋朝期间。颜之推著有《颜氏家训》，在家庭教育发展史上有重要的影响。\n故正确答案为A。","no":11,"missingImage":false},{"type":"question","qid":"2376482","cat":"科技常识","stem":"下列关于粉尘爆炸的说法错误的是：","options":{"A":"颗粒越小越易燃烧，爆炸也越剧烈","B":"越易氧化的物质，其粉尘越易爆炸","C":"越易带电的物质，其粉尘越易爆炸","D":"含卤素和钾、钠的粉尘，爆炸趋势增强"},"answer":"D","explanation":"本题考查科技常识。\n呈细粉状的固体物质被称为粉尘，能燃烧和爆炸的粉尘叫做可燃粉尘。工厂内一些金属粉尘，如镁粉、铝粉，生活中常见的淀粉、木粉等都是可燃粉尘。粉尘在爆炸极限范围内，遇到热源（明火或高温），火焰瞬间传播于整个混合粉尘空间，化学反应速度极快，同时释放大量的热，形成高温高压。由于这一过程中不断有升高的压力会产生冲击波，因此，爆炸会造成很大的破坏力。\nA项正确，粉尘的表面能够吸附空气中的氧，颗粒越细小，粉尘总的表面积就越大，从而表面吸附的氧就越多，越容易发生爆炸。\nB、C项正确，粉尘爆炸的难易程度与粉尘的物理化学性质和环境条件等有关。一般认为氧化速度快的物质容易爆炸，如镁粉、铝粉等。容易带电的粉尘也很容易引起爆炸，如合成树脂粉末、纤维类粉尘等。\nD项错误，根据实践分析，一般含有卤素和钾、钠的粉尘，爆炸趋势减弱。\n本题为选非题，故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"2376492","cat":"人文常识","stem":"下列表述正确的是：","options":{"A":"鄱阳湖栖息着世界上最大的白鹤群","B":"我国最早出现的种植业位于松花江流域","C":"被誉为“天上云霞,地下鲜花”的是四川蜀绣","D":"东北平原是中国第二大平原，也是中国重要的粮棉生产基地"},"answer":"A","explanation":"本题考查地理国情。\nA项正确，鄱阳湖是全世界最大的白鹤集中越冬地，白鹤的数量占全世界总数的\u003cimg data-k=\"d5d70dbf73a6\">以上，堪称鹤之天堂。鄱阳湖区发现白鹤的最早记录是1980年。1985年，时任国际鹤类基金会会长的乔治·阿基博带队来鄱阳湖考察，观测到白鹤1350只，其中幼鹤119只。他们认定那是当时世界上发现的最大野生白鹤群。\nB项错误，我国最早出现的种植业应位于黄河、长江流域。黄河、长江是中国的母亲河，这两条河流的冲积平原地区是中华文明的发祥地且两个平原处在温带湿润、半湿润地区，气候温暖湿润，比较适宜人类居住，所以种植业发展最早。\n\nC项错误，被誉为“天上云霞，地下鲜花”的是杭州的织锦。\n\nD项错误，东北平原是中国最大的平原，是中国三大平原之一。位于中国东北部，南北长约1000千米，东西宽约400千米，面积达35万平方千米。同时东北平原土地肥沃，是全球仅有的三大黑土区域之一，是中国重要的粮食、大豆、畜牧业生产基地，也是中国重要的钢铁、机械、能源、化工基地。\n\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"2376484","cat":"人文常识","stem":"唐太宗李世民曾言:为官择人，唯才是与；苟或不才，虽亲不用。下列哪一人才选拔制度与其所言体现的用人理念最契合：","options":{"A":"科举制","B":"察举制","C":"世卿世禄制","D":"九品中正制"},"answer":"A","explanation":"本题考查人文常识。\n唐太宗李世民曾言：为官择人，唯才是与；苟或不才，虽亲不用。是指用人的原则是看才能，而不管亲疏。\nA项正确，科举制度是隋以后各封建王朝设科考试选拔官吏的制度，由于分科取士而得名。隋文帝废除为世族垄断的九品中正制，设志行修谨、清平干济二科。隋炀帝时始置进士科，科举制形成。1905年，袁世凯、张之洞奏请立停科举。至此，在中国历史上延续了约1300年的科举制度最终被废除，科举取士与学校教育实现了彻底分离。\nB项错误，察举制是中国古代选拔官吏的一种制度，它的确立时间是汉武帝元光元年（公元前134年）。它的主要特征是由地方长官在辖区内随时考察、选取人才并推荐给上级或中央，经过试用考核再任命官职。\nC项错误，世卿世禄制是古代高级官吏的称呼。世卿就是天子或诸侯国君之下的贵族，世世代代、父死子继，连任卿这样的高官。禄是官吏所得的享受财物。世禄就是官吏们世世代代、父死子继，享有所封的土地及其赋税收入。\nD项错误，九品中正制，又称九品官人法，是魏晋南北朝时期重要的选官制度，从曹魏始至隋唐科举的确立，这期间约存在了四百年之久。九品中正制大体是指由各州郡分别推选大中正一人，所推举大中正必为在中央任职官员且德名俱高者。大中正再产生小中正。中正就是品评人才的官职名称。大、小中正产生后，由中央分发一种人才调查表，在该表中将人才分为九等，上上、上中、上下、中上、中中、中下、下上、下中、下下。此项制度使得当时的官吏选拔有了一客观标准，此标准其实依然是采取地方群众舆论和公共意见，保留了汉代乡举里选的遗意。\n故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"2376456","cat":"科技常识","stem":"下列说法错误的是：","options":{"A":"雷雨可使土壤的氮肥增加","B":"18K黄金制品的含金量为70\u003cimg data-k=\"86981204eabb\">","C":"聚四氟乙烯可用于制作不粘锅的涂层","D":"在金属表面喷漆可以防止金属被氧化腐蚀"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，雷雨天气过程中的闪电温度极高，一般在三万度以上，并造成高电压。在高温高电压条件下，空气分子会发生电离，等它们重新结合时，其中的氮和氧就会化合为亚硝酸盐和硝酸盐分子，并溶解在雨水中降落地面，成为天然氮肥。\nB项错误，K金是指黄金和其它金属混合在一起的合金。根据在首饰中的黄金含量可分为不同的K金，其中24K是指纯金，18K黄金制品的含黄金量就是18/24=75\u003cimg data-k=\"86981204eabb\">，因此选项中的70\u003cimg data-k=\"86981204eabb\">表述错误。 \nC项正确，聚四氟乙烯俗称“塑料王”，是由四氟乙烯经聚合而成的高分子化合物，具有优良的化学稳定性、耐腐蚀性、密封性、高润滑不粘性，可用于制作不粘锅的涂层。\nD项正确，金属被氧化腐蚀是指各类材料在环境作用下发生损坏、性能下降或状态的劣化。良好的喷漆涂装保护层能够成为抑制腐蚀介质侵入的屏障，使得金属保持连续完整，因此在金属表面喷漆是一种很重要的金属防腐蚀手段。\n本题为选非题，故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"2376481","cat":"人文常识","stem":"下列成语和人物的对应关系错误的是：","options":{"A":"口蜜腹剑——李义府","B":"十面埋伏——项羽","C":"程门立雪——杨时","D":"东床快婿——王羲之"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，“口蜜腹剑”出自《资治通鉴·唐记》“口有蜜，腹有剑”，这是文中对奸相李林甫的评语。李林甫为宰相后，对于朝中百官凡是才能和功业在自己之上而受到玄宗宠信或官位快要超过自己的人，一定要想方设法除去，尤其忌恨由文学才能而进官的士人。有时表面上装出友好的样子，说些动听的话，而暗中却阴谋陷害。所以世人都称李林甫“口有蜜，腹有剑”。笑里藏刀是指李义府。\nB项正确，“十面埋伏”出自楚汉相争的垓下之战（今安徽省宿州市灵璧县东南）。楚汉相争时期，汉王刘邦重用淮阴人韩信，先后活捉魏王豹、赵王歇、燕王臧荼、齐王田广。他被刘邦封为齐王后率30万大军和彭越的军队会师，把项羽围困在垓下（今安徽省宿州市灵璧县东南），他采取十面埋伏的战术，逼使项羽在乌江自刎，取得决定性的胜利。\nC项正确，宋代的杨时考到进士后不愿做官，专心研究学问。他起先在颍昌（地名）拜理学家程颢为师，学到了不少知识。程颢死后，四十多岁的杨时又和同学游酢一起到洛阳请教另一位有名的理学家程颐（程颢的弟弟）。他们到程颐家时，程颐正在打瞌睡。两人不敢惊动他，就侍立在门口。程颐醒来后发现门外的雪已下了一尺多深。程门立雪由此而来，比喻尊师重道。\nD项正确，“东床快婿”出自刘义庆《世说新语笺疏雅量第六》“王氏谱曰：逸少，羲之小字。羲之妻，太傅郗鉴女，名璿，字子房。”指为人豁达，才能出众的女婿，是女婿的美称。“东床快婿”王羲之就是大名鼎鼎的书法家，被后人称之为“书圣”。\n本题为选非题，故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"2376682","cat":"人文常识","stem":"下列我国古代国家行政机构不具有行政监察职能的是：","options":{"A":"御史台","B":"太常寺","C":"六科给事中","D":"都察院"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，御史台，古代官署名。御史台的职责是纠察弹劾百官过失，是封建国家专司弹劾的监察机关。\nB项错误，太常寺，封建社会中掌管礼乐的最高行政机关，秦时称奉常。汉景帝六年改称太常。汉以后改称太常寺、太常礼乐官等。\nC项正确，明代地方分区监察和中央按系统监察相结合，专设六科给事中，稽察六部百司之事，旨在加强皇帝对六部的控制。\nD项正确，都察院，官署名。明清全国最高监察机构。掌纠劾百司，辩明冤枉，提督各道，为天子耳目风纪之司。\n本题为选非题，故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"2376464","cat":"人文常识","stem":"管理大师杰克·韦尔奇有句名言：管得少，就是管得好。他主要强调管理应该注重：","options":{"A":"沟通","B":"分权","C":"组织","D":"控制"},"answer":"B","explanation":"本题考查管理学常识。\n“管得少，就是管得好”强调的就是管理应该注重分权。管理的最终目标在于提高经营绩效，分权是管理学学者在近一百多年的企业管理研究与实践中，为提高效率而归纳出的一大规律性，管理学家认为企业在追求绩效时必须善于分权，担任一定管理职务的领导者在实际工作中为充分利用专门人才的知识和技能，应将部分解决问题和处理新增业务的权利委任给下属。据此可知，B项正确，ACD三项与题干无关。\n故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"2376678","cat":"科技常识","stem":"下列气体是人体能够产生的，能发挥抗炎、神经功能调节和血管松弛等作用，但若吸入过量会与血红素结合导致中毒的是：","options":{"A":"一氧化氮","B":"一氧化碳","C":"硫化氢","D":"氨气"},"answer":"A","explanation":"A项正确，一氧化氮是一种人体可以自然产生的物质，其具有三大功能：①内皮舒张因子。作为内皮舒张因子，一氧化氮主要产生于内皮细胞，对预防和控制心脑血管疾病有着显著的效果。具体而言，一氧化氮是一种脂溶性气体，可以快速渗透出细胞膜向下扩散，进入并作用于血管周围平滑肌细胞，随着平滑肌的舒张，血管得以扩张（使血管松弛），最终导致血压的下降；②神经传导因子。作为神经传导因子，一氧化氮产生于外周神经和大脑中，作为肾上腺素和胆碱以外的神经递质，在血管、海绵体、胃肠道、泌尿道、气管肌、肛尾肌等外周输出神经抑制反应中起到非常重要的作用；③免疫调节因子。作为免疫调节因子，一氧化氮产生于免疫系统中，合成产生的一氧化氮，通过多条途径调节炎症，在调控免疫反应中起到重要作用。具体而言，一氧化氮可辅助白细胞杀死细菌、真菌、寄生虫、肿瘤细胞等。综上可知，一氧化氮在人体内发挥血管松弛、神经功能调节、抗菌消炎的作用。同时，一氧化氮与血红蛋白有很高的亲和力，如果吸入过量，一氧化氮会夺取氧气与血红蛋白结合的位置，造成人体因缺氧而中毒。\nB项错误，身体组织受毒素、紫外线辐射、激素和药物等侵害时，体内会自然地产生少量一氧化碳。一氧化碳与血红蛋白具有很高的亲和力，吸入过量会造成人体因缺氧而中毒，但一氧化碳在体内不具有血管松弛、神经功能调节、抗菌消炎的作用。\nC项、D项错误，具有刺激性气味的硫化氢和氨气是人体代谢产生的废气，二者均不与血红蛋白结合，且不具有血管松弛、神经功能调节、抗菌消炎的作用。\n故正确答案为A。","no":19,"missingImage":false},{"type":"question","qid":"2376709","cat":"科技常识","stem":"下列我国空间站发展的重要标志性事件按完成步骤排列正确的是：\n①“天宫二号”空间实验室成功发射\n②“神舟十一号”成功发射，完成与“天宫二号”对接\n③陆续发射科学实验舱和空间站核心舱，组建中国空间站\n④“天舟一号”货运飞船成功发射，完成与“天宫二号”对接","options":{"A":"①②③④","B":"④①②③","C":"①③④②","D":"①②④③"},"answer":"D","explanation":"本题考查科技常识。\n①2016年9月15日22时04分，“天宫二号”空间实验室由长征二号FT2火箭发射升空。\n②2016年10月19日3时31分，“神舟十一号”载人飞船与“天宫二号”空间实验室成功实现自动交会对接。\n③建设具有国际先进水平的空间站，解决有较大规模的、长期有人照料的空间应用问题，是我国载人航天工程“三步走”发展战略中第三步的任务目标。按计划，空间站将于2022年前后建成，是我国长期在轨稳定运行的国家太空实验室，将全面提升我国载人航天综合应用效益水平。\n④2017年4月20日19时11分，中国首架货运飞船——“天舟一号”成功发射升空，并在4月22日完成与“天宫二号”的首次对接。\n由此可知，按照完成步骤的时间应该是①②④③。\n故正确答案为D。","no":20,"missingImage":false}],"count":19,"answerable":19,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2376897","cat":"逻辑填空","stem":"科学家将松力纤维蛋白原和可吸收材料共混后，采用静电纺技术制成具有超亲水性、类似细胞外基质的复合生物支架材料。由该材料制成的人工韧带具有良好的组织          和合适的机械强度，植入肌体后，可在逐层降解的同时进行组织再生，诱导肌体自身组织长入韧带中，逐步演变成自身韧带组织，实现腱骨融合，达到永久愈合的目的。\n填入画横线部分最恰当的一项是：","options":{"A":"相容性","B":"自愈性","C":"亲和性","D":"再生性"},"answer":"A","explanation":"横线处所填词语搭配“人工韧带”，形容该材料制成的人工韧带所具有的属性。根据后文“长入韧带中”、“演变成自身韧带组织”、“实现腱骨融合，达到永久愈合的目的”可知，它可以与肌体实现融合，对应A项“相容性”。\nB项“自愈性”指自我恢复的能力，文段未体现人工韧带能够自我恢复，与文意不符，排除；\nC项“亲和性”在组织学上被视为表示组织对某种染料结合力强的一种术语，另外，在胚胎学上，表示细胞或组织相互连接的意思，“亲和性”只能体现出结合性强，容易接近，故“亲和性”程度太轻，与后文实现机体融合的语义不符，排除；\nD项“再生性”指重新恢复生长的能力，与“人工韧带”搭配不当，且根据后文“可在逐层降解的同时进行组织再生，诱导肌体自身组织长入韧带中”可知，文段想体现的是让身体组织再生，而非让人工韧带再生，故该项与文意不符，排除。\n故正确答案为A。\n【文段出处】《探索让人体组织器官“起死回生”》","no":21,"missingImage":false},{"type":"question","qid":"2376507","cat":"逻辑填空","stem":"夏季天气炎热，人很容易犯困、无精打采，这时不妨吃几颗葡萄来帮你提神、消除疲乏之意。因为在葡萄中含有丰富的葡萄糖成分，且很容易被人体吸收利用，从而为大脑供给所需能量，快速恢复大脑活力。同时，葡萄中还含有较多的氨基酸，能对神经产生良好的 ____，帮助人体____衰弱的神经，这也是提神醒脑的有效途径。\n依次填入划横线部分最恰当的一项是：","options":{"A":"刺激  调理","B":"应激  调节","C":"激变  调整","D":"激发  调剂"},"answer":"A","explanation":"第一空，横线处所填词语搭配“产生”，用来形容葡萄中的氨基酸给神经带来的积极作用，A项“刺激”指现实的物体和现象作用于感觉器官，可与产生搭配，置于此处符合文意，保留；D项“激发”为动词，指刺激使奋发，“产生”也为动词，置于此处用法不当，排除；B项“应激”指由外界情况变化所引起的一种情绪状态，常见搭配为产生应激反应，置于此处搭配不当，排除；C项“激变”强调变化突然且激烈，置于此处程度过重，与文意不符，排除。\n第二空，代入验证，A项“调理”指管理，料理，可与文段中“衰弱的神经”进行搭配，形容葡萄中的氨基酸为人体带来的积极作用，符合文意，当选。\n故正确答案为A。\n【文段出处】人民网《夏天吃葡萄有什么好处?教你正确清洗葡萄的方法》","no":22,"missingImage":false},{"type":"question","qid":"2376708","cat":"逻辑填空","stem":"纪录片《苏东坡》以苏东坡贬谪黄州四年的生活为横切面，        其一生的心路历程，从文学、艺术、美食、情感等维度进行透视，多角度地        其生命感悟、精神嬗变和艺术升华的过程，以及对中国传统文化产生的深远影响。同时，辅之以当今最新的研究成果，再现了一个最丰富、最接近本真的苏东坡形象。\n依次填入划横线部分最恰当的一项是：","options":{"A":"关照  阐释","B":"记载  解说","C":"记录  阐述","D":"观照  解读"},"answer":"D","explanation":"第一空，横线处所填词语用以修饰“纪录片”，强调其展现了苏东坡的心路历程，C项“记录”指把所见所闻通过一定的手段保留下来，D项“观照”指观察审视，均符合文意，保留；A项“关照”指关心照顾，与“纪录片”搭配不当，排除；B项“记载”多指用文字叙述，纪录片是影像、声音、文字的集合体，不是简单的文字描绘，排除。\n第二空，由前文可知，强调纪录片从多个维度透视，对苏东坡的生命感悟进行多角度的分析，使我们更加深入地了解苏东坡，D项“解读”指分析研究，可以体现出纪录片的作用，符合文意，当选；C项“阐述”指述说、论述，通过前文可知，纪录片并非简单地述说苏东坡的生命感悟，而是对其进行多角度的分析，故不符合文意，排除。\n故正确答案为D。\n【文段出处】《大型人文历史纪录片&lt;苏东坡&gt;台前幕后的故事》","no":23,"missingImage":false},{"type":"question","qid":"2376713","cat":"逻辑填空","stem":"一个艺术家真正的贡献是艺术语言的创新，如果说审美理想的构建是绘画法度和秩序建立的基石，那么绘画秩序的建立则是绘画风格成熟的      。风格的形成在于画面所搭建的整体构成必须有      的秩序和法则。\n依次填入划横线部分最恰当的一项是：","options":{"A":"途径  和谐","B":"标志  内在","C":"方向  全新","D":"目标  稳定"},"answer":"B","explanation":"第一空，根据“如果说审美理想的构建是绘画秩序建立的基石”，说明审美理想对绘画法度和秩序的建立很重要，则根据“那么绘画秩序的建立则是绘画风格成熟的”，即绘画秩序的建立则是绘画风格成熟的重要体现、表现，故横线处要表达重要体现之意，B项“标志”，符合题意，保留。A项，“途径”，我们通常说做一件事情的具体解决办法，填入文段应表达为“建立绘画秩序则是绘画风格成熟的途径”，故用法不对，排除。C、D两项，文段强调“绘画风格成熟”是目标是追求的方向，而非“绘画秩序的建立”是目标是追求的方向，所以“方向”和“目标”填入文段则与文段意思相悖，排除C、D两项。\n第二空，代入验证，B项，“必须有内在的秩序和法则”，搭配恰当，且“内在的秩序和法则”与前文“画面所搭建的整体构成”可以构成对应，当选。\n故正确答案为B。\n【文段出处】《寻求工笔新语境》","no":24,"missingImage":false},{"type":"question","qid":"2377365","cat":"逻辑填空","stem":"没有精神内核的娱乐，即便一时热闹，        流于空虚。网民需要文化产品、需要轻松娱乐，但不需要无下限、无道德的“秀”。应该肯定的是，依法净网，不只是约谈平台、关停账号，而是持续发力、        治理。\n依次填入划横线部分最恰当的一项：","options":{"A":"最终  固定化","B":"难免  长效化","C":"终归  常态化","D":"终将  平常化"},"answer":"C","explanation":"第一空，横线处所填词语与“即便”构成对应，表达在“一时热闹”之后产生的结果，A项“最终”、C项“终归”、D项“终将”都可以体现出一个结果，符合文意；B项“难免”重在强调“无法避免”，与文意无关，排除。\n第二空，与前文“持续发力”构成近义并列，要体现出一直在做的状态，对应C项“常态化”；A项“固定化”、D项“平常化”均不能与“持续发力”构成近义并列，排除A、D两项。\n故正确答案为C。\n【文段出处】《关停炒作账号，让娱乐走正道》","no":25,"missingImage":false},{"type":"question","qid":"2376714","cat":"逻辑填空","stem":"极光多姿多彩，变化万千，任何彩笔都很难绘出那在严寒的两极空气中嬉戏无常、变幻莫测的炫目之光。在自然界中还没有哪种现象能与之        。极光有时出现时间极短，犹如节日的焰火，在空中闪现一下就消失得无影无踪；有时却可以在苍穹之中        几个小时；有时像一条彩带，有时像一团火焰，有时像一张五光十色的巨大银幕，仿佛上映一场球幕电影，给人视觉上极美的享受。\n依次填入划横线部分最恰当的一项是：","options":{"A":"匹敌  延宕","B":"相较  迤逦","C":"媲美  辉映","D":"抗衡  映照"},"answer":"C","explanation":"第一空，表达没有哪种现象能比得上极光，A项“匹敌”，指双方地位平等、力量相当，B项“相较”指相比较，C项“媲美”美好的程度可以相比，类似比美之意，A、B、C三项均符合语境，保留；D项“抗衡”指彼此对抗，对立，与文意不符，排除。\n第二空，文段搭配极光，C项“辉映”光辉映照、照耀，搭配恰当，当选；A项“延宕”指拖延，偏消极，与文段的感情色彩不符，排除；B项“迤逦”指曲折连绵，通常搭配为“山水迤逦”、“风景迤逦”，与“极光”搭配不当，排除。\n故正确答案为C。\n【文段出处】新华网《极光：最奇妙的天象之谜》","no":26,"missingImage":false},{"type":"question","qid":"2376716","cat":"逻辑填空","stem":"除了口误，笔误同样泄露了潜意识的秘密。短信聊天说到我爸身体不舒服却不去医院检查这一事实时，我想说“我爸就是太固执了”，但我键入的文字竟是“我爸就是太过分了”。那一刻，我突然呆住了。一词之别，却暴露出我内心深处的真实情绪。“固执”只是一种较为客观的        ，而“过分”却是饱含着情绪的        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"判断  认识","B":"体现  流露","C":"显示  暗示","D":"描述  表达"},"answer":"D","explanation":"本题可从第二空入手，根据文段信息“笔误同样泄露了潜意识的秘密”、“暴露出我内心深处的真实情绪”可知，“过分”应是内心深处对于父亲的一种情绪表达，B、D两项保留。A项“认识”指人的头脑对客观世界的反映，文段“过分”不是一种认识，而是情绪的表达，与文意不符，排除； C项“暗示”指用含蓄的言语或示意的举动使人领会，文段没有含蓄示意的意思，排除。\n第一空，根据“我想说‘我爸就是太固执了’”可知，横线前的“固执”是作者对自己父亲的一种评价，D项“描述”指描写叙述，符合文意，当选。B项“体现”指某一事物具体地表现出的某种现象、性质或精神，是一种客观事实的表现，而文段是作者对父亲的评价，非事实的表现，排除。\n故正确答案为D。\n【文段出处】《潜意识如何泄露我们的秘密？》","no":27,"missingImage":false},{"type":"question","qid":"2376715","cat":"逻辑填空","stem":"美好的事物人人向往，若是缺少发现的眼睛，它也容易被      。某次儿童画展，一位小朋友的作品上有一个洞，评委们好奇地问，这是不是一幅破损的作品。小朋友说，这是进入世外桃源的入口。孩子的答案，耐人寻味。如何      发现美的眼睛，是一个需要全社会去回答的课题。\n依次填入划横线部分最恰当的一项是：","options":{"A":"蒙蔽  擦拭","B":"遮蔽  擦亮","C":"掩饰  拂拭","D":"遮掩  烛照"},"answer":"B","explanation":"第一空，根据“缺少发现的眼睛”可知，所填词语应体现出美好事物就难以被发现之意。B项“遮蔽”指遮挡，挡住使看不到， D项“遮掩”亦有遮挡之意，均可以体现出难以发现之意，保留；A项“蒙蔽”指隐瞒真相，使人上当，通常与人搭配使用，与“美好事物”搭配不当，排除；C项“掩饰”设法遮盖、掩盖(真实情况)，不想让他人发现，文段没有设法掩盖之意，与文段语境不符，排除。\n第二空，搭配“眼睛”，B项“擦亮”与“眼睛”为常见搭配，当选；D项“烛照”指照耀，照亮，与“眼睛”搭配不当，排除。\n故正确答案为B。\n【文段出处】《美是有力量的 美育是一种刚需》","no":28,"missingImage":false},{"type":"question","qid":"2376717","cat":"逻辑填空","stem":"关于科学革命的讨论        于十七世纪。不过，其时革命尚在            地展开，相关讨论的焦点集中在科学的本性，而未有所谓“科学革命史”的理解。到十九世纪，现代科学的基本模式逐渐定型，一些学者便回到现代科学的源头做起了编史和整理工作。\n依次填入划横线部分最恰当的一项是：","options":{"A":"滥觞  如火如荼","B":"溯源  轰轰烈烈","C":"起源  风起云涌","D":"发端  方兴未艾"},"answer":"A","explanation":"第一空，A项“滥觞”、C项“起源”、D项“发端”均有表达事物起源和开端的含义，均符合文意，保留；B项“溯源”后一般不加宾语，常表述为“对······进行溯源”，排除。\n第二空，搭配“革命”，表达革命如何展开，A项“如火如荼”形容旺盛、热烈或激烈，可以体现革命开展很热烈，符合文意，当选；C项“风起云涌”形容事物迅速发展，声势浩大，可以说“改革风起云涌”，“风起云涌地展开”用法不当，排除；D项“方兴未艾”指事物正在兴起、发展，一时不会终止，若填入横线处，则与“展开”语义上重复，二者搭配不当，可表述为“科学革命方兴未艾”，排除。\n故正确答案为A。\n【文段出处】《科学史绝非科学的注脚：科学革命的人文理解》","no":29,"missingImage":false},{"type":"question","qid":"2376711","cat":"逻辑填空","stem":"城市的文化形象是人们对一个城市的文化      的整体认知与印象，主要来源于城市的发展哲学、城市精神等构成的理念识别系统，城市各主体的行为方式所构成的行为识别系统以及公共文化空间、文化景观等构成的视觉识别系统。在新一轮的城市竞争中，城市的文化形象对城市的经济社会发展将起到      的作用。\n依次填入划横线部分最恰当的一项是：","options":{"A":"观感  撼天震地","B":"气质  举足轻重","C":"禀赋  振聋发聩","D":"特征  醍醐灌顶"},"answer":"B","explanation":"本题可从第二空入手，横线处要体现出的是城市的文化形象对城市经济社会发展的作用很重要，B项“举足轻重”比喻所处地位重要，一举一动都关系着全局，符合语境，保留；A项“撼天震地”意为连天地都摇动了，形容力量强，声势大，C项“振聋发聩”比喻用语言文字唤醒糊涂麻木的人，使他们清醒过来，D项“醍醐灌顶”比喻给人灌输智慧，使人得到启发或感悟，均无“作用重要”之意，不符合语境，排除。\n第一空，代入验证，B项“气质”用于此处，运用拟人化手法与“城市的文化”搭配得当，意指城市的文化内涵精神等，当选。 \n故正确答案为B。\n【文段出处】长江日报《以城市文化形象助力城市发展》","no":30,"missingImage":false},{"type":"question","qid":"2376707","cat":"逻辑填空","stem":"说起乡愁，那是一种            的情怀，住在心中的故乡常常鲜活在那里。故乡是安放你的灵魂、温暖你的寂冷的地方，是接纳你的疲惫、抚慰你的忧伤的地方。翻开一页页被繁忙弄乱的过往，记忆中的余香总        于儿时的故乡。\n依次填入划横线部分最恰当的一项是：","options":{"A":"与生俱来  氤氲","B":"难以割舍  回荡","C":"刻骨铭心  徘徊","D":"永生难忘  徜徉"},"answer":"A","explanation":"第一空，搭配“情怀”，D项“永生难忘”指一辈子也难以忘记，一般搭配“经历”、“事情”，与“情怀”搭配不当，排除。A项“与生俱来”指不依靠后天培养和教育，从一出生就拥有的特性或行为，B项“难以割舍”形容人对事或人的感情深，难以放弃或分开，C项“刻骨铭心”形容记忆深刻，均与“情怀”搭配恰当，保留。\n第二空，搭配“余香”，A项“氤氲”形容烟或云气浓郁，与“余香”搭配恰当，当选。B项“回荡”指回响在耳边，发出回声，多指声音，与“余香”搭配不当，排除；C项“徘徊”指在一个地方来回地走，比喻犹豫不决，与“余香”搭配不当，排除。\n故正确答案为A。\n【文段出处】《乡愁文丛》","no":31,"missingImage":false},{"type":"question","qid":"2376710","cat":"逻辑填空","stem":"古人根据经验编制了许多脍炙人口的农谚，比如“清明前后，种瓜点豆”。不仅是农谚，与二十四节气相关的诗词歌赋也是            ，比如“蒹葭苍苍，白露为霜”，再比如“清明时节雨纷纷，路上行人欲断魂”。这些诗词歌赋            ，将二十四节气与天气现象巧妙地结合在一起，具有很好的传播性。\n依次填入划横线部分最恰当的一项是：","options":{"A":"俯拾皆是  沉思翰藻","B":"不胜枚举  形神兼备","C":"不计其数  文采斐然","D":"举不胜举  缀玉联珠"},"answer":"B","explanation":"第一空，横线前“也”表示“诗词歌赋”与前面“农谚”并列，前面通过“比如”说明农谚的例子非常多，结合后文“比如······，再比如······”可知，横线处也要体现出诗词歌赋的例子非常多，B项“不胜枚举”、D项“举不胜举”都是强调可以举的例子数量特别多，符合文意，保留；A项“俯拾皆是”意思是只要低下头来捡取，到处都是，形容多而易得，C项“不计其数”指无法计算数目，形容极多，虽然都能体现多的含义，但与“例子”的对应不如B、D两项准确，排除。\n第二空，横线前出现指代词“这些”，横线处要体现出诗词歌赋的特性，通过“将二十四节气与天气现象巧妙地结合在一起”可知，这些诗词与节气结合的非常好，不仅是诗歌，也有节气的内容包含在里面，B项“形神兼备”强调外在物象与内在神韵都具备，符合文意，当选。D项“缀玉联珠”形容诗文十分优美，仅能形容诗文的好，但体现不出包含节气的内容，没有B项对应准确，排除。\n故正确答案为B。\n【文段出处】《气象科普（176）：时间里的中国智慧—二十四节气》","no":32,"missingImage":false},{"type":"question","qid":"2376472","cat":"逻辑填空","stem":"打开书本，一股久违了的墨香扑面而来；摩挲纸张，淡淡的凹凸感非常舒服。味觉、视觉、触觉顿时都活泛起来，连脑细胞也显得格外活跃。读累了，就闭眼歇一歇，顺便回味刚读过的情节，思考作者的            ；看到精彩的描写和精辟的议论，就反复重读、吟咏再三，读到妙处更是            。\n依次填入划横线部分最恰当的一项是：","options":{"A":"春秋笔法  弹冠相庆","B":"言外之意  低头折节","C":"弦外之音  额手称庆","D":"微言大义  击节赞叹"},"answer":"D","explanation":"本题可从第二空入手，横线处搭配“妙处”且横线前“更”表示递进，程度前轻后重，横线处要体现出读到精妙的地方，不仅要反复去读，还可能由衷赞叹。D项“击节赞叹”，形容对别人的诗文或艺术等的赞赏，符合文意，保留。\nA项“弹冠相庆”，指官场中一人当了官或升了官，同伙就互相庆贺将有官可做，含贬义，与文段感情色彩不符，排除；\nB项“低头折节”，指丧失气节，屈服于他人，与文意不符，排除；\nC项“额手称庆”，指两手在胸前相握，举到额头，表示庆幸、庆贺，文段并无“庆幸”之意，排除。\n第一空，代入验证，“思考作者的微言大义”，指思考作者在文字中所体现出来的深刻道理，符合文意，当选。\n故正确答案为D。\n【文段出处】《我们需要更纯粹的阅读》","no":33,"missingImage":false},{"type":"question","qid":"2376494","cat":"逻辑填空","stem":"形成有文化特色、有地域特色、可识别的小城镇发展模式，是一个长期的渐进过程。我们应尊重当地实际，            、远近结合、量力而行，不能盲目            。在模式选择上，可以借鉴国内外小城镇建设的经验，但更重要的是结合自身实际、体现自身特色。\n依次填入划横线部分最恰当的一项是：","options":{"A":"循规蹈矩  分庭抗礼","B":"按部就班  投闲置散","C":"循序渐进  贪大求快","D":"按图索骥  急于求成"},"answer":"C","explanation":"第一空，根据文段首句完整语句“是一个长期的渐进过程”的提示，可知接下来整个文段也应围绕“长期”“渐进”展开。B项“按部就班”指按照一定的顺序、步骤进行，C项“循序渐进”即按照一定顺序逐渐深入或提高，置于此处均符合文意，保留。A项“循规蹈矩”比喻按规矩行事，或拘泥保守，不敢变通，侧重遵守规矩不逾越，D项“按图索骥”比喻按照线索去寻找事物，侧重于拘泥成法办事，均无法与“长期”“渐进”对应，与文意不符，排除。\n第二空，根据“不能盲目”可知，横线处要体现“短期”“快速”之意，C项“贪大求快”对应恰当，当选。B项“投闲置散”指担当不重要的工作或不担任工作，不予重用，与“短期”“快速”无关，排除。\n故正确答案为C。\n【文段出处】人民网《小城镇建设须注重文化要素》","no":34,"missingImage":false},{"type":"question","qid":"2376898","cat":"逻辑填空","stem":"一个城市的建设发展，如果说建筑是她的脊梁，环境是她的容貌，那市民的文明素质就是她的        。而文化作为承载文明的基石，特别是当跨越时空的优秀传统文化理念、价值标准、审美风范被重新        ，转化为现代人们的精神追求和行为养成时，那她        的不仅是一个城市的文明，也增强了作为一名中国人立足世界的文化底气和骨气。\n依次填入划横线部分最恰当的一项是：","options":{"A":"佩饰  演绎  赋予","B":"神采  弘扬  荡涤","C":"灵魂  唤起  涵育","D":"冠冕  阐释  秉承"},"answer":"C","explanation":"第一空，横线前文采用比喻的修辞手法，将城市比作人，建筑和环境分别比作脊梁与容貌，建筑和环境是一个城市外在的表现，而文明素质是一个城市内在的精神，B项“神采”、C项“灵魂”用在此处均可。A“佩饰”、D项“冠冕”是外在的饰品，不符合文意，排除。\n第二空，搭配“优秀传统文化理念、价值标准、审美风范”，“弘扬”与“唤起”均可，保留。\n第三空，搭配“文明”，涵育意为涵养化育，与“文明”搭配恰当，锁定C项。B项“荡涤”意为冲洗、清除，常搭配污泥、旧思想等，与“文明”搭配不当，排除。\n故正确答案为C。\n【文段出处】《“文化”是一座城市最好的名片》","no":35,"missingImage":false},{"type":"question","qid":"2376510","cat":"逻辑填空","stem":"圈椅是明代家具中最为经典的制作。明代圈椅，造型古朴典雅，线条简洁流畅，制作技艺达到了____的境地。“天圆地方”是中国文化中____的宇宙观，不但建筑受其影响，也____到了家具的设计之中。\n依次填入划横线部分最恰当的一项是：","options":{"A":"别有匠心  普遍  融合","B":"巧夺天工  特殊  融会","C":"炉火纯青  典型  融入","D":"入室升堂  独特  融化"},"answer":"C","explanation":"第一空，根据空前的“最为经典”“古朴典雅”“简洁流畅”，可知此空用来形容制作技艺的水平很高，A项“别有匠心”，意为具有与众不同的巧妙的构思，侧重的是不同，排除；B项“巧夺天工”形容技巧的高超，C项“炉火纯青”比喻学问、技术或办事达到了纯熟完美的地步，D项“入室升堂”比喻人的学识技艺等方面有高深的造诣，B、C、D三项均能体现水平之高，保留。\n第二空，B项“特殊”，C项“典型”，D项“独特”搭配“宇宙观”均可，保留。\n第三空，横线前后分别对应“宇宙观”、“到了···之中”，意味着这种宇宙观进入到家具设计理念里面，B项“融会”，融会贯通，侧重点是领会、理解，体现不出宇宙观进入到设计理念之中的意思，排除；D项“融化”，通常指冰或者是雪由于温度或者是太阳光的照射使它化成水，不符合文段意思，且搭配、对应均不恰当，排除；而C项“融入”，融合、混入，可以体现出宇宙观进入到设计理念之中的意思，当选。\n故正确答案为C。\n【文段出处】《圈椅是明代家具中最为经典的制作》","no":36,"missingImage":false},{"type":"question","qid":"2376513","cat":"逻辑填空","stem":"关于卫生健康创新发展的高峰论坛围绕“创新驱动，健康中国”主题，____国际和国内远程医学、“\u003cimg data-k=\"0c27d4cda205\">”等新技术和新产业，探讨“\u003cimg data-k=\"142cd45f890c\">”服务新模式、____发展新业态，____人工智能、大数据等在医疗健康领域的创新之路，为努力提升我国整体医疗水平作出贡献。\n依次填入划横线部分最恰当的一项是：","options":{"A":"着笔  培养  探究","B":"针对  养育  探查","C":"对标  营造  探险","D":"着眼  培育  探寻"},"answer":"D","explanation":"本题可从第三空入手，第三空搭配“创新之路”，A项“探究”表示深入探索并研究，通常搭配问题，奥秘等，C项“探险”指去没有人去过或环境恶劣的地方去考察，均不能搭配“创新之路”，排除A、C两项；B项“探查”指试图发现某种隐蔽的事物或情况，D项“探寻”指找寻追求，均可搭配“创新之路”，保留。\n再看第二空，第二空搭配“新业态”，B项“养育”，通常搭配养育子女，不可与“新业态”搭配，排除；D项“培育”搭配合理，保留。\n第一空代入验证，搭配合理，当选。\n故正确答案为D。\n【文段出处】人民网《远程医疗健康服务大会举行》","no":37,"missingImage":false},{"type":"question","qid":"2376718","cat":"逻辑填空","stem":"蚕蛾往往能巧妙避开捕食者，它们利用旋转的后翅来      蝙蝠的声呐系统，从而      捕食者对捕食目标的定位。但人们对蚕蛾的进化史以及它们后翅多样性形成的原因            。科学家对数百个基因组数据库的后翅形状进化过程进行了研究，发现了不同翅型的进化特征。\n依次填入划横线部分最恰当的一项是：","options":{"A":"躲避  引导  一知半解","B":"折射  诱导  茫然不解","C":"规避  引诱  不求甚解","D":"反射  误导  知之甚少"},"answer":"D","explanation":"本题从第二空入手，根据“蚕蛾······避开捕食者”可知，横线处表达它们能够不被捕食者抓住，D项“误导”符合文意，保留；A项“引导”、B项“诱导”、C项“引诱”填入文段都是指让捕食者抓住，与文意相悖，排除。\n第一空代入验证，蚕蛾利用后翅“反射”声纳系统，搭配恰当，符合文意。\n第三空代入验证，“知之甚少”指对某方面知道得很少，与后文“科学家对数百个基因数据库”对应恰当，当选。\n故正确答案为D。\n【文段出处】《后翅形状成蚕蛾 巧避捕食者“武器”》","no":38,"missingImage":false},{"type":"question","qid":"2376723","cat":"语句表达","stem":"敦煌研究院将与外部机构进一步合作，开展敦煌壁画的保护和修复，为这个文化宝藏的永续保存探讨更多可能性。保护和修复也为了更好地传播，依托数字化，“数字敦煌”资源库在2016年上线。资源库第一期的30个经典石窟，跨越北魏、西魏、北周、隋、唐等多个时期，其中绝大多数石窟都是未对游客开放的，全球网友只需轻点鼠标，就可以免费360度漫游洞窟，足不出户便能近距离感受千年的文化。千年敦煌石窟，正借助科技的手段，                    ，焕发出新的生命与活力。\n填入划横线部分最恰当的一项是：","options":{"A":"力求重建用户沉浸式体验","B":"以虚拟世界代替现实场景","C":"突破时间、空间上的限制","D":"促进与传统文化深度融合"},"answer":"C","explanation":"横线在文段末尾，起总结概括的作用。横线所在句子意在表明敦煌石窟正在借助科技的手段解决某些问题，使石窟重新焕发活力。文段开篇介绍敦煌研究院与外部机构合作探讨敦煌文化的永续保存，接着介绍依托数字化，全球网友只需轻点鼠标便可以漫游石窟文化，无需远行便可感受千年前的文化。由此可知，科技手段解决的是时间和空间上的限制，对应C项。\nA项“重建用户沉浸式体验”、B项“虚拟世界代替现实场景”、D项“与传统文化深度融合”均无中生有，排除。\n故正确答案为C。\n【文段出处】光明网《不再高冷：科技让博物馆有张现代的脸》","no":39,"missingImage":false},{"type":"question","qid":"2376505","cat":"语句表达","stem":"科学家认为，未来的仿生机器人并非是要完全模仿人类的所有功能，而是模仿某项功能。这些智能机器人有望成为“超人”，有的具有超强的记忆力，有的具有超强的学习能力，有的听觉功能特强，有的嗅觉功能特强······                    。\n填入划横线部分最恰当的一项是：","options":{"A":"智能机器将超越人类","B":"不同功能的智能机器人可以用于不同的领域","C":"但它并不具备人类的情感，也不具备人脑的灵活性","D":"人类受限于缓慢的生物学进化速度，无法与之竞争和对抗"},"answer":"B","explanation":"横线在结尾，可知需基于前文得出结论。分析前文，文段开篇提出 “未来的仿生机器人并非···，而是模仿某项功能”，然后通过“这些”总结上文给出观点“智能机器人有望成为‘超人’”，即智能机器人应用于各个领域，后文“有的···有的···”举例子具体说明这些智能机器人分别具有哪些方面的功能，故基于文段，重点说明不同的机器人可以应用在不同的方面，对应B项。\nA项，文段核心词为“智能机器人”而非“智能机器”，另外“超越人类”无中生有，排除；\nC项，文段未提及机器人“情感”和“灵活性”，无中生有，故不能总结上文，排除；\nD项，文段未提及“受限于生物学进化速度”和“人类无法与机器人竞争和对抗”，无中生有，排除。\n故正确答案为B。\n【文段出处】《智能机器会超越人类吗》","no":40,"missingImage":false},{"type":"question","qid":"2376724","cat":"语句表达","stem":"将不能量化的诗歌（以及纯文学）评价标准和人工智能的算法标准拼接在一起，本来就是一件不伦不类的事。人工智能在科学研究、生产劳动等方面的贡献，足以证明其本领之强，                    。人类也完全没必要拿自己的优势去跟人工智能的缺点比较，即使科技再发达，想必在未来很长的一段时间内，诗歌与文学的世界依然是人类情感和灵魂最佳的栖息地，守卫好我们的心灵家园，依然要靠人类自身的智慧与创造力。\n填入划横线部分最恰当的一项是：","options":{"A":"却不能弥补人类智慧在诗歌创作上的缺陷","B":"完全可以取代人类智慧自主开展诗歌创作","C":"没必要和人类智慧在诗歌创作上一决高下","D":"毫无疑问将能够实现诗歌评价标准的量化"},"answer":"C","explanation":"本题为语句填空题，横线在中间，联系前后文把握话题的一致性。横线前阐述将诗歌评价标准与人工智能算法标准拼接，人工智能在科学方面存在的优势，结合横线后，介绍人类也没必要拿自己的优势去跟人工智能的缺点去相比，后文详细解释诗歌与文学同人类的关系，指明人类的智慧与创造力的优势，依据横线后句子出现“也”，横线处应该与后文形成并列关系，即人工智能没必要和人类的优势去比较，对应C项。\nA项，“人类智慧在诗歌创作上的缺陷”属于无中生有，排除；\nB项，根据后文，人类在诗歌创作领域是有优势的，因此人工智能不能取代，表述错误，排除；\nD项，根据前文可知，诗歌评价标准是不能量化的，与文意相悖，排除。\n故正确答案为C。\n【文段出处】《光明网：人工智能写诗与纯文学无关》","no":41,"missingImage":false},{"type":"question","qid":"2376473","cat":"片段阅读","stem":"大数据是科学决策的重要工具，是高精度对未来进行预测的手段。数据是记录人类行为的工具。靠大数据技术对未来做一个预测和参考是人类发展的成果。但是，人际的沟通和交流不该因为大数据技术而遭弃，而过于依赖大数据的预测和推理，放弃人际沟通过程，必然产生人际沟通的弱化，进而影响到人的自由意志。\n这段文字旨在强调：","options":{"A":"大数据是科学决策的重要工具","B":"大数据将发挥越来越重要的作用","C":"大数据不应弱化人际沟通","D":"大数据影响人的自由意志"},"answer":"C","explanation":"文段开篇先引出了大数据的概念，并指出大数据带来了好处，后文通过转折关联词“但是”重点强调“人际的沟通和交流不该因为大数据技术而遭弃”，并通过“产生人际沟通的弱化”，“影响到人的自由意志”论证大数据弱化人际沟通后带来的危害，故文段主旨是在强调大数据不应该弱化人际沟通，对应C项。\nA项，“大数据是科学决策的重要工具”为转折之前的内容，非重点，排除；\nB项，“发挥越来越重要的作用”无中生有，且文段转折后强调的是大数据的危害，感情色彩相悖，排除；\nD项，“大数据影响人的自由意志”仅对应尾句中大数据弱化人际沟通的危害的其中一个方面，且文段重在强调大数据不应该弱化人际沟通，非重点，排除。\n故正确答案为C。\n【文段出处】《大数据带来的是天堂还是地狱》","no":42,"missingImage":false},{"type":"question","qid":"2376502","cat":"语句表达","stem":"在今天的社会文化实践中，我们更要关注当下的传统文化热是否真正触及了传统文化的人文精神实质，是否真正提升了人们的精神境界。一般而言，文化的形式要自觉为文化的内容服务，如果忽略了文化的内容，尤其是忽略了对贯穿其中的人文精神的追求，就必然会走入歧途，背离我们弘扬传统文化的初衷。文化是活的，不能做简单的固化处理，更不能只注重形式而忽略对其内涵的传承。鉴于此，我们必须                    。\n填入划横线部分最恰当的一项是：","options":{"A":"改变过于强调传统文化的符号性的做法","B":"注意纠正传统文化弘扬中的形式化倾向","C":"以实用心态凸显传统文化的工具性价值","D":"借助现代电子技术手段来弘扬传统文化"},"answer":"B","explanation":"横线出现在文段结尾，又根据“鉴于此，我们必须······”说明横线处需要根据上文给对策。分析上文，文段开篇提出问题，即“在今天的社会文化实践中······是否真正提升了人们的精神境界”，后文指出“如果忽略了文化的内容，就会走入歧途，背离初衷”，说明不能只重视形式，一定要重视文化的内容，结尾又通过“文化是活的，更不能只注重形式而忽略对其内涵的传承”再次强调传统文化不能只注重形式而忽略内容。所以，基于上文的对策应该是传统文化弘扬不能只重视形式而忽略内容，对应B项。\nA项，“符号性”文段没有提到，无中生有，排除；\nC项，文段没有提到“实用心态”，也没有提到“传统文化工具性”，无中生有，排除；\nD项，文段中没有提到“电子技术手段”，属于无中生有，排除。\n故正确答案为B。\n【文段出处】《弘扬传统文化应注重人文精神的承传》","no":43,"missingImage":false},{"type":"question","qid":"2376720","cat":"片段阅读","stem":"从人口的空间布局看，城镇化是农村人口向城镇转移，是农民向市民的转变。农民向市民的转变过程，是人的素质的现代化过程。而人的素质的现代化离不开接受现代化的教育。人的教育的现代化是城镇化的基础和支撑。城镇化还意味着人们的就业和生产从农业领域向工业和服务业的转移。人的生产方式的现代化，是城镇化的本质特征，更是人的现代化的本质体现。而支撑人的生产方式现代化的基础则是现代职业教育的普及。\n这段文字意在强调：","options":{"A":"城镇化是人的生产方式的现代化","B":"城镇化是人的素质教育的现代化","C":"城镇化时代的农民需要职业教育","D":"城镇化是进城农民身份的市民化"},"answer":"B","explanation":"文段开篇从人口空间布局的角度解释了城镇化，即农民向市民的转变，接着指出这一转变是人的素质的现代化过程，而素质现代化离不开接受现代化的教育，故文段前半部分强调人的教育的现代化对城镇化很重要。后文指出城镇化还意味着生产方式的现代化，生产方式现代化的基础是现代职业教育的普及，故文段后半部分依然在强调现代教育对于城镇化很重要。故文段重在强调现代化的教育对于城镇化很重要，对应B项。\nA项“生产方式”，D项“进城农民身份的市民化”偏离文段核心话题，文段重在强调“现代教育”，排除A、D两项；C项“农民”概念缩小，文段强调“人”，且“职业教育”并非文段重点，文段强调“现代教育”，排除。\n故正确答案为B。\n【文段出处】《光明日报：建立城镇义务教育资源配置长效机制》","no":44,"missingImage":false},{"type":"question","qid":"2376721","cat":"片段阅读","stem":"在原始社会，人们唱歌、跳舞，但是不写诗，因为那时候没有文字。同理，史前时代的人也演剧，而且有文字之后多数中国戏剧演员并不识字，戏剧演出主要是以口传心授的方式传承与传播的。然而长时间以来，人们陷入了文字与文献崇拜的陷阱不能自拔，乃至文献考据一直成为文学史、戏剧史研究中最受推崇、最有效接近历史真实的研究方法。如果戏剧史研究领域有“新材料”的话，那一定不仅仅是文献。\n这段文字主要强调了：","options":{"A":"戏剧史研究要更新理念并创新研究方法","B":"戏剧史研究要对接传统研究并突破局限","C":"戏剧史研究既要重文献又要重考证考据","D":"戏剧史研究应扩大研究领域和研究方法"},"answer":"A","explanation":"文段开篇先介绍了在原始社会是没有文字的，戏曲传播方式主要是口传心授。接着通过转折词“然而”指出现在对于戏剧史的研究过于局限于文献考据这样的研究方法，文段最后进行补充说明，“如果戏剧史研究领域有‘新材料’的话，那一定不仅仅是文献”，加强论述转折之后的观点，即仅局限于文献考据的研究方法是不正确的，故文段重点是围绕“戏剧史研究”和“研究方法”展开论述，旨在强调目前对于戏剧史研究的研究方法太过单一，我们应该更新现在的研究方法，对应A项。\nB项，文段中提到“人们陷入了文字与文献崇拜的陷阱不能自拔”，可知作者对于传统的研究方法是不赞同的。因此，“对接传统研究”表述错误，排除；\nC项，“重考证考据”无中生有，文段没有提及，排除；\nD项，“扩大研究领域”表述错误，文段重点强调的是应该扩大研究的方法，排除。\n故正确答案为A。\n【文段出处】《百年中国戏剧史》","no":45,"missingImage":false},{"type":"question","qid":"2376514","cat":"片段阅读","stem":"一部人类史，就是人与自然、科学与社会的互动史。在漫长的文明进程中，科学曾仅仅是“闲人”的志趣，科学普及无从谈起，人们在“非科学”的禁锢中艰难摸索。随着近现代科学兴起，人类对自然认识不断加深，科学与社会联系日趋紧密，科学普及在人与自然、科学与社会的结合点上顽强生长，科学在人类现代化道路上散发出璀璨的光芒。\n上述文字主要阐述了：","options":{"A":"人与自然、科学与社会的互动极大促进了科学普及","B":"在人类文明进程中，科学普及前进的道路异常艰辛","C":"科学普及应紧密联系社会并且找准结合点和切入点","D":"随着近现代科学兴起，科学普及前景更加灿烂辉煌"},"answer":"A","explanation":"文段首句通过下定义引出“人与自然、科学与社会的互动”的话题，接下来阐述过去“科学普及”所面临的问题，即很少有人谈论。尾句指出在近代科学兴起的背景下，人与自然、科学与社会的联系更紧密，互动更强，根据“科学普及在人与自然、科学与社会的结合点上顽强生长”“散发出璀璨的光芒”可知，文段旨在强调“人与自然、科学与社会的互动”推动了“科学普及”的发展，对应A项。\nB项，“道路艰辛”对应文段前文“科学普及无从谈起”，是在介绍以前的情况，非重点，排除；\nC项，仅仅提到“联系社会”表述片面，文段中是“人与自然、科学与社会的互动”，并且“切入点”无中生有，文段未提及，排除；\nD项，“随着近代科学兴起”为背景的内容，非重点，排除。\n故正确答案为A。\n【文段出处】《让科普这只“翅膀”硬起来——一论加强科学普及》","no":46,"missingImage":false},{"type":"question","qid":"2376491","cat":"片段阅读","stem":"20世纪以来，人类对弦的认识，发生了质的变革。弦就是振动，振动就会产生波，说明波构成了丰富多彩的大千世界，这为重新认识“美”提供了思想基础和技术方法。研究表明，自然美与物质的波长（或者频率）存在着深刻的内在联系，物体固有的频率与人自身的频率存在耦合关系，“美”是由不同类型波谱的频率与人的相互作用而产生的。\n根据这段文字，下列说法不正确的是：","options":{"A":"对同一个人的美丑认识不同，因审美主体的频率不同所致","B":"阳光、鲜花一定时间内大致不变，因为振动频率没有变化","C":"距离产生美，是因为审美主客体在一定频率范围内共振","D":"见义勇为行为得到社会认可，因为审美主体振动频率一致"},"answer":"D","explanation":"文段开篇介绍了认识美的思想和方法，即通过物体的振动波，接着论述了审美中，物质自身的振动和人自身的频率之间存在相互作用的关系，即当审美客体与审美主体之间耦合的频率相同时，就会产生共振，进而使人觉得“美”。\nA项，根据“‘美’是由不同类型波谱的频率与人的相互作用而产生的”可知，对同样一个审美客体，每个审美主体的美感不同，有的说漂亮，有的说丑，这是由于审美主体的频率不同所致，该项表述正确，排除；\nB项，根据“弦就是振动，振动就会产生波，说明波构成了丰富多彩的大千世界”可知，大千世界是由波构成的，即波构成了万物，万物的变化也就意味着波的变化，波的变化也就意味着振动频率的变化，故万物一定时间内不变就是因为其振动频率没有变化，该项表述正确，排除；\nC项，根据“物体固有的频率与人自身的频率存在耦合关系”可知，物体在一定的频率范围内，能够和人自身的频率产生共振，产生美感，“距离产生美”就是这个道理。该项表述正确，排除；\nD项，文段论述的是审美与主客体之间的振动频率有关，即审美主体与审美客体耦合频率一致，该项中，“见义勇为”得到社会认可，是由于审美主体（不同的人们）的振动频率一致，且审美主体（不同的人们）与审美客体（见义勇为的行为）频率一致，而D项仅仅论述了原因中的主体间振动频率一致，故表述错误，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《自然美的波谱学原理》","no":47,"missingImage":false},{"type":"question","qid":"2376520","cat":"片段阅读","stem":"工匠精神，匠心为本。有没有工匠精神，关键是看有没有一颗安于默默无闻、执着于追求卓越的匠心。树匠心，就要坚守初心、执着专注，秉持赤子之心，摒弃浮躁喧嚣，在本职岗位上坐得住、做得好。怎样才能坐得住、做得好?关键是要做到专心专注、追求至精至善，将产品的每个细节都尽可能做到极致。\n这段文字意在强调：","options":{"A":"育匠人是传承工匠精神的基础","B":"树匠心是弘扬工匠精神的根本","C":"树匠心要坚守初心、执着专注","D":"树匠心需要良好的社会文化环境"},"answer":"C","explanation":"文段首先引入“匠心”这一话题，并指出“匠心”对工匠精神来说是十分重要的。接着给出“树匠心”的对策，即“要坚守初心、执着专注······在本职岗位上坐得住、做得好”。文段尾句对“怎样才能坐得住、做得好”进行补充说明，依然强调“专心专注、追求至精至善”。故文段重点在于“树匠心”的对策，强调“树匠心”要坚守初心、专心专注，对应C项。A项“育匠人”在文段中并未提及，无中生有，排除；B项对应首句，仅是引出话题部分，非重点，排除；D项“良好的社会文化环境”，无中生有，文段并未提及，排除。\n故正确答案为C。\n【文段出处】《人民日报新知新觉：大力弘扬工匠精神》","no":48,"missingImage":false},{"type":"question","qid":"2376722","cat":"片段阅读","stem":"通过对海豚间通信联系的深入研究，科学家发现，齐普夫定律和信息论中的熵值概念可以很好地为分析外星信号服务。在接收到地外任何可疑信号后，应该首先用齐普夫定律分析是否存在一定斜率直线特征，如果有某种特征，则证明其并非毫无意义的噪声。然后进行熵值分析，这样可以不必破译信号便知晓其通信的复杂程度。假设截获到的某一可疑信号，不仅在齐普夫坐标系中具有斜率为\u003cimg data-k=\"b4230a61a137\">的直线特征，而且拥有高阶熵值，那么这个信号极有可能就是我们寻找多时的地外文明。\n对这段文字概括最恰当的一项是：","options":{"A":"研究发现海豚间通信联系与外星信号极为相似","B":"如何运用齐普夫定律和熵值概念分析外星信号","C":"如何判断可疑地外信号是否来自于外星文明","D":"如何通过地外信号判断外星文明的智慧程度"},"answer":"B","explanation":"文段开篇引出科学家的研究发现，即齐普夫定律和熵值概念可以分析外星信号服务。后文论述的“接收到可疑信号后，首先用齐普夫定律分析······然后进行熵值分析······”，进行具体详细分析，即齐普夫定律和熵值概念是如何进行分析的。因此文段为总分结构，对应B项正确。\nA项，“极为相似”无中生有，文段未提及，排除；\nC项，“如何判断”表述不明确，文段明确说是用齐普夫定律和熵值概念，且“是否来自外星文明”只是具体分析中的内容，非重点，排除；\nD项，“智慧程度”无中生有，文段未提及，排除。\n故正确答案为B。\n【文段出处】《天文学家发现11光年外“奇特信号”：会是外星人吗》","no":49,"missingImage":false},{"type":"question","qid":"2376488","cat":"片段阅读","stem":"在智能化无人超市，客人从进门到出门，一举一动都会被数字化，并且被捕捉记录。这些信息回流到云端后，通过算法模型，可以得到许多非常有价值的信息：比如男性顾客和女性顾客各自进店最集中的时间段是什么，哪些商品被拿起又放回去的频次最高等。甚至还能做出预测，比如，传感器感应到进店的女客人很多是穿高跟鞋的，敏锐的老板便会在女鞋区多放些半跟鞋垫和脚踝磨损修复霜。可见，数字化最终目的是实现商品供应链的优化以及店内货架与商品摆放的人性化。\n这段文字主要介绍：","options":{"A":"智能无人零售让超市变得更加聪明、更加善解人意","B":"智能无人零售给线下实体商店的发展前景增添亮色","C":"智能无人零售能够对用户购买行为进行记录与描画","D":"智能无人零售给消费者所带来的更良好的购物体验"},"answer":"C","explanation":"本段语料介绍了智能化无人超市对客人的大数据统计，可以据此收集到很多有价值的信息，对用户的购买行为进行记录与描画，因此C选项正确。\nA、B、D选项都是由C选项推测、演绎出的，而非这段文字主要介绍的内容，所以排除。\n故正确答案为C。\n【文段出处】《智能零售来了 消费体验变了》","no":50,"missingImage":false},{"type":"question","qid":"2376509","cat":"片段阅读","stem":"为了帮助贫困地区脱贫，长期以来，社会各界以多种形式开展帮扶，扶贫思路更加清晰，扶贫手段更加多样，文化扶贫、旅游扶贫、电商扶贫等新方式效果显著，脱贫攻坚实现换挡提速。但一些尚未脱贫的地区，因为自然条件恶劣，发展脱贫产业难度较大。要啃下扶贫的“硬骨头”，还需打好科技牌。\n最适合做这段文字标题的是：","options":{"A":"打好脱贫攻坚科技牌","B":"啃下扶贫的“硬骨头”","C":"选好脱贫攻坚新方式","D":"脱贫攻坚实现换挡提速"},"answer":"A","explanation":"文段开篇指出“社会各界以多种形式开展帮扶，脱贫效果显著，脱贫攻坚实现换挡提速”，即脱贫攻坚取得成效，然后文段通过转折词“但”强调在一些尚未脱贫的地区，难度较大，即存在问题，随后出现了对策标志词“要”，引出对策。故整个文段重点是对策，强调扶贫要通过科技牌，对应A项。\nB项，没有提及文段重点强调的“科技”这样一种扶贫的对策，偏离文段重点，排除；\nC项，“新方式”表述不明确，排除；\nD项，“脱贫攻坚实现换挡提速”是转折之前的内容，转折之前内容非重点，排除。\n故正确答案为A。\n【文段出处】《人民日报纵横：打好脱贫攻坚科技牌》","no":51,"missingImage":false},{"type":"question","qid":"2376518","cat":"片段阅读","stem":"科学家在100亿光年外的星系里发现一颗超亮超新星，其爆发于宇宙大爆炸后约35亿年，正值天文学家所称的“宇宙正午”时期。普通超新星是大质量恒星死亡时发生剧烈爆炸产生的。超亮超新星的亮度比普通超新星高10到100倍，目前还不太清楚其形成机制。以往发现的超亮超新星所在星系质量都较小，使科学家认为小星系缺乏重元素的环境有利于产生超亮超新星。此次发现的超亮超新星所在星系是普通的大质量星系，使人重新思考超亮超新星的形成问题。这意味着银河系也可能曾拥有产生超亮超新星的条件。\n下列说法与原文相符的是：","options":{"A":"超亮超新星产生于恒星形成最剧烈的“宇宙正午”时期","B":"小星系缺乏重元素的环境事实上不利于产生超亮超新星","C":"普通的大质量星系可能曾经拥有产生超亮超新星的条件","D":"大质量恒星死亡时发生剧烈爆炸并不能产生超亮超新星"},"answer":"C","explanation":"C项，根据“此次发现的超亮超新星所在星系是普通的大质量星系，使人重新思考超亮超新星的形成问题”可知，普通大质量星系可能可以产生超亮超新星，符合文意，当选。\nA项，“恒星形成最剧烈”文段没有提及，且文段只是说一颗超亮超新星爆发于“宇宙正午时期”，选项表述无中生有，排除；\nB项，根据“小星系缺乏重元素的环境有利于产生超亮超新星”，选项说“不利于”，与文意相悖，排除；\nD项，根据“普通超新星是大质量恒星死亡时发生剧烈爆炸产生的”可知，文段没有说过“大质量恒星死亡时发生剧烈爆炸”和“超亮超新星”的关系，无中生有，排除。\n故正确答案为C。\n【文段出处】《科学家解析“宇宙正午”的超亮超新星》","no":52,"missingImage":false},{"type":"question","qid":"2376495","cat":"片段阅读","stem":"完美主义者习惯于把各项标准都定得过高而不切实际，受到挫折打击后，变得逃避、拖延、自责而失去行动力。完美主义不仅拖后腿，还可能带来许多心理疾病。由于缺乏一种深刻且始终如一的自尊来源，接受失败的打击对于完美主义者来说尤其困难，而且可能导致一部分人长期抑郁和退缩。完美主义也与社交焦虑和社交恐怖显著相关，因为他们很担心自己是否能给别人留下好印象，容易出现羞怯、自卑、回避行为。完美主义也容易导致强迫症，因为完美主义者对每件事都要求完美无瑕。减少“全或无”的心理倾向，内心会更自在、从容，也更利于进步。\n这段文字意在说明：","options":{"A":"标准过高而且不切实际会损害自尊","B":"羞怯自卑容易使人长期抑郁和退缩","C":"社交焦虑和社交恐怖会导致强迫症","D":"为了心理健康应避免完美主义倾向"},"answer":"D","explanation":"文段首先指出完美主义者在受到挫折打击后，变得逃避、拖延、自责而失去行动力，接着指出完美主义者不仅会拖后腿，还会带来很多心理疾病，后文通过“抑郁”、“社交焦虑”、“社交恐怖”、“强迫症”进行举例说明，尾句给出对策，即减少“全或无”这种完美主义的心理倾向会使人的内心更健康，故文段重在强调应避免完美主义倾向，对应D项。\nA项“会损害自尊”，B项“使人长期抑郁和退缩”，C项“会导致强迫症”均为问题的表述，而文段重在强调解决问题的对策，故排除A、B、C三项。\n故正确答案为D。\n【文段出处】《完美主义拖后腿》","no":53,"missingImage":false},{"type":"question","qid":"2376726","cat":"语句表达","stem":"①透过中华文化发展史，不难发现，中华文化在几千年的演进过程中，虽历经劫难，但每次都能发扬光大、传承至今\n②根据英国著名学者汤因比的著述，人类文明史上曾经存在26个文明形态\n③可见，中华民族传统文化历久弥新的关键就在于其中蕴含着能够保持旺盛生命力的最根本的精神基因\n④这种稳定与新生的辩证统一，是中华优秀传统文化的生命力所在\n⑤中华民族最根本的精神基因深藏于中华民族文化的深层结构之中，具有相对恒久的稳定性，并且能够在新的时代条件下发出新的光彩\n⑥其他古老文明或中断或湮灭，唯有中华文化体系没有中断而延续至今\n将以上6个句子重新排列，语序正确的是：","options":{"A":"③①②⑥⑤④","B":"①②⑤④⑥③","C":"⑤④①②⑥③","D":"②⑥①③⑤④"},"answer":"C","explanation":"首先，对比首句，①句、②句、⑤句均可作为话题引入句，而③句中出现总结词“可见”，不适合做首句，排除A项；观察③句可知，③句在论述“中华民族传统文化历久弥新的关键”，即结论，故③句在形式上和内容上均适合做尾句，排除D项；对比B、C两项，区别在于⑤④与①②的顺序，⑤句和④句提出中华民族的精神是“稳定与新生的辩证统一”，是“有生命力”的，①句、②句、⑥句是列举“中华文化史”、“英国著名学者汤因比的著述”、“其他古老文明”的例子论述中华文化如何避开劫难持续具有生命力的，故①②⑥属于解释说明应捆绑并在⑤④后。\n故正确答案为C。\n【文段出处】《中华民族最根本的精神基因》","no":54,"missingImage":false},{"type":"question","qid":"2376900","cat":"语句表达","stem":"①然而，监管执法的覆盖面毕竟有限，执法成本也相对较高\n②但这毕竟只是消极的自我保护，被侵犯的合法权益没有得到弥补，违法违规者也没有受到应有惩戒\n③过去，用脚投票是很多“小散”的无奈选择，“惹不起总还躲得起”\n④要从根本上保障小投资者的利益，固然要有强有力的外部保护，而增强其自我保护能力也同样重要\n⑤随着监管力度加强，很多损害中小投资者利益的违法行为受到严厉处罚\n⑥在A股市场，由于个人投资者数量庞大，如何有效保护“股微言轻”的小股东，就显得尤其重要\n将以上6个句子重新排列，语序正确的是：","options":{"A":"③②⑤①④⑥","B":"③⑤②①⑥④","C":"⑥③⑤②④①","D":"⑥③②⑤①④"},"answer":"D","explanation":"首先对比选项判断首句，③句论述的话题是“过去，用脚投票是很多‘小散’的无奈选择”，⑥句重在强调保护小股东的重要性，没有明显的首句标志，无法直接确定首句。\n进一步观察可知，①句通过转折关联词“然而”，强调“监管执法覆盖面有限，执法成本相对较高”，⑤强调的是“监管力度的加强使违法行为受到严厉处罚”，故⑤①两句构成关联词捆绑，排除B、C两项；\n根据选项特征可知，需判断④、⑥两句谁更适合作为尾句，⑥句论述保护小股东的重要性，④句指出保护小投资者的具体办法，是对策的表述，因此④比⑥更适合作为尾句，对应D项。\n故正确答案为D。\n【文段出处】人民日报《小股东不能只“用脚投票”》","no":55,"missingImage":false}],"count":35,"answerable":35,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2376731","cat":"数学运算","stem":"一工厂生产的某规格齿轮的齿数是一个三位数的质数（除了1和它本身之外，不能被其他整数整除的正整数），其个、十、百位数字各不相同且均为质数。若将该齿数的百位数字与个位数字对调，所得新的三位数比该齿数大495，则该齿数的十位数字为：","options":{"A":"7","B":"5","C":"3","D":"2"},"answer":"B","explanation":"三位数数字各不相同且均为质数，可知三位数字应在2、3、5、7中选择。调换位置后所得新数字比原数字大495，根据尾数判断则原数字的个位（调换后的百位）应为7，原数字的百位（调换后的个位）应为2，则十位数字只能是3或5。如果是3，则原数字为\u003cimg data-k=\"34b2d403529d\">，不是质数，不符合题意，因此原十位数字只能为5。\n故正确答案为B。","no":56,"missingImage":false},{"type":"question","qid":"2376704","cat":"数学运算","stem":"甲、乙两个工程队共同参与一项建设工程。原计划由甲队单独施工30天完成该项工程三分之一后，乙队加入，两队同时再施工15天完成该项工程。由于甲队临时有别的业务，其参加施工的时间不能超过36天，那么为全部完成该项工程，乙队至少要施工多少天？","options":{"A":"18","B":"20","C":"24","D":"30"},"answer":"A","explanation":"根据题意可得，甲队单独完成这项工程需要\u003cimg data-k=\"8bb03c323cfc\">天，则\u003cimg data-k=\"41018afedb14\">\u003cimg data-k=\"3e0b42c552c1\">，得\u003cimg data-k=\"f185f082f644\">，则甲、乙效率之比为\u003cimg data-k=\"65c4cc10e47b\">，赋值甲的效率为1，乙的效率为3，工程总量为\u003cimg data-k=\"4c395ff06b6d\">。根据问题，乙队施工天数尽可能少，则甲队施工天数应尽可能多，其最多可为36天，则乙队施工天数至少\u003cimg data-k=\"c8b7ad54342f\">\u003cimg data-k=\"09bfe9c218f1\">\u003cimg data-k=\"f90865c51c3c\">天。\n故正确答案为A。","no":57,"missingImage":false},{"type":"question","qid":"2376450","cat":"数学运算","stem":"某楼盘的地下停车位，第一次开盘时平均价格为15万元/个；第二次开盘时，车位的销售量增加了一倍、销售额增加了\u003cimg data-k=\"1a67739c8245\">。那么，第二次开盘的车位平均价格为：","options":{"A":"10万元/个","B":"11万元/个","C":"12万元/个","D":"13万元/个"},"answer":"C","explanation":"赋值第一次车位销售量为1，则\u003cimg data-k=\"0a6857cee0f2\">\u003cimg data-k=\"ff3609d83597\">。根据题意，第二次开盘时，销售量增加了一倍、销售额增加了\u003cimg data-k=\"1a67739c8245\">，可得第二次销售量为\u003cimg data-k=\"c51cf42e980a\">，销售额为\u003cimg data-k=\"022657e8510d\">，则第二次平均价格为\u003cimg data-k=\"ef6b553bc406\">。\n故正确答案为C。","no":58,"missingImage":false},{"type":"question","qid":"2376451","cat":"数学运算","stem":"林先生要将从故乡带回的一包泥土分成小包装送给占其朋友总数\u003cimg data-k=\"a1f51a060389\">的老年朋友。在分包过程中发现，如果每包200克，则少500克；如果每包150克，则多250克。那么，林先生的朋友共有多少人?","options":{"A":"15","B":"30","C":"50","D":"100"},"answer":"C","explanation":"设林先生的老年朋友为\u003cimg data-k=\"5320a525f2bc\">人，根据分包过程可得：\u003cimg data-k=\"7143e3f733e7\">，解得\u003cimg data-k=\"c35b89cf932c\">人。因老年朋友占朋友总数的\u003cimg data-k=\"a1f51a060389\">，则林先生的朋友总共有：\u003cimg data-k=\"52fc68947d61\">人。\n故正确答案为C。\n注：本题并未说明每人分1包，不够严谨；但是不按每人1包则有无数种可能，无法求解。","no":59,"missingImage":false},{"type":"question","qid":"2376448","cat":"数学运算","stem":"一位学生在距离热气球100米处观看它起飞。在热气球起飞后，学生注意到热气球顶部从他的仰角\u003cimg data-k=\"733639eae72a\">上升到\u003cimg data-k=\"377b06e7063a\">，再从\u003cimg data-k=\"377b06e7063a\">上升到\u003cimg data-k=\"9a8bff8f415c\">的位置分别用了11秒和17秒。则前后两段时间热气球平均上升速度的比值约为：","options":{"A":"0.89","B":"0.91","C":"1.12","D":"1.10"},"answer":"A","explanation":"\u003cimg data-k=\"3d96de084dd6\" style=\"max-width:183px\">\n如图所示：当仰角为\u003cimg data-k=\"90cc063762ca\">时，在\u003cimg data-k=\"b8788e5e6738\">中，\n\u003cimg data-k=\"e0722fc71ca6\">\u003cimg data-k=\"275641cb811a\">\u003cimg data-k=\"f175fef0171b\">米；当仰角为\u003cimg data-k=\"97eae1f6ec15\">时，在\u003cimg data-k=\"3951b67afb71\">中， \u003cimg data-k=\"131f4dfb07ec\">\u003cimg data-k=\"c67148376bc7\">\u003cimg data-k=\"3553fb09b2e7\">米；当仰角为\u003cimg data-k=\"b745f599b32a\">时，在\u003cimg data-k=\"198bc77b38be\">中，\u003cimg data-k=\"e4a3424f0385\">\u003cimg data-k=\"5b7503397a8c\">\u003cimg data-k=\"73e40775c4e1\">米。两段时间上升的距离分别为\u003cimg data-k=\"7894b1c76eaf\">\u003cimg data-k=\"581bff93f328\">米，\u003cimg data-k=\"b046d1db1f13\">\u003cimg data-k=\"eadf2093470a\">米，则两段时间平均上升速度比为\u0
