二段“2020年，全国艺术表演团体共演出225.61万场（B），比上年下降24.0%（b）；演出收入86.63亿元（A），下降31.7%（a）”。根据基期平均数\u003cimg data-k=\"5d19e88a3fa9\">可得，2019年全国艺术表演团体平均每场演出收入为\u003cimg data-k=\"0e2df72865c5\">元，可以推出；\n④：定位文字材料最后一段“2020年末，全国共有群众文化机构43687个，比上年末减少386个”。根据基期量=现期量-增长量可得，2019年末全国群众文化机构个数为43687-（-386）个，可以推出。\n综上可知，可以推出的有②③④，共3条。\n故正确答案为C。","no":100,"missingImage":false}]}],"count":15,"answerable":15,"pointsOf":16}],"total":100,"affected":[],"subtitle":"2022年 · 四川 · 6/6 模块"},{"slug":"2022-四川-2","title":"2022年四川省公务员录用考试《行测》题（网友回忆版）","year":"2022","group":"四川","modules":[{"label":"政治理论","items":[{"type":"question","qid":"4817747","cat":"新思想","stem":"习近平总书记指出，革命文物承载着党和人民英勇奋斗的光荣历史，记载中国革命的伟大历程和感人事迹，是党和国家的宝贵财富，下列文物保护单位所陈列的革命文物，按照其反映的中国革命发展进程排序正确的是:\n①中共一大会址纪念馆\n②瑞金中央革命根据地纪念馆\n③北大红楼\n④香山革命纪念馆","options":{"A":"①②③④","B":"①③②④","C":"③①②④","D":"③②①④"},"answer":"C","explanation":"本题考查毛中特。\n①中共一大会址纪念馆反映的事件是中国共产党一大的召开。中国共产党第一次全国代表大会于1921年7月23日至8月初，在上海法租界望志路106号（现兴业路76号）和浙江嘉兴召开，标志着中国共产党的成立。\n②瑞金中央革命根据地纪念馆位于江西省瑞金市象湖镇，反映的事件是瑞金中央革命根据地的建立。1931年（民国二十年）9月，中国共产党苏区中央局迁驻瑞金；9月28日，毛泽东和朱德指挥根据地军民粉碎了敌人第一、二、三次“围剿”，在叶坪村建立、发展和巩固中央革命根据地。\n③北大红楼一般指北京大学红楼。1917年，陈独秀创办的《新青年》迁至北京大学红楼，《新青年》推动了新文化运动的发展。1919年5月4日，北京大学学生从红楼出发到天安门举行了五四运动。\n④香山革命纪念馆反映的事件为党中央进驻香山。1949年3月25日，毛泽东同志率领中共中央机关和中国人民解放军总部入驻北京香山，在这里指挥了解放全中国，推翻国民党统治，筹备新政协，筹建新中国等事件。\n故正确顺序为③①②④。\n故正确答案为C。","no":1,"missingImage":false}],"count":1,"answerable":1,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"4817750","cat":"经济常识","stem":"下列党的会议与所通过的决定或决议对应正确的是:","options":{"A":"党的十一届五中全会——《中共中央关于经济体制改革的决定》","B":"党的十一届六中全会——《关于建国以来党的若干历史问题的决议》","C":"党的十二届三中全会——《中共中央关于社会主义精神文明建设指导方针的决议》","D":"党的十二届六中全会——《中共中央关于建立社会主义市场经济体制若干问题的决定》"},"answer":"B","explanation":"本题考查政治常识。\nA项错误，1980年2月23日，中国共产党第十一届中央委员会第五次全体会议在北京召开。会议讨论和通过了《关于党内政治生活的若干准则》。其总结了我们党几十年来处理党内关系的经验教训，是对党章的必不可少的具体补充，对发扬党内积极因素、克服消极因素，发挥党员的先锋模范作用，具有重要的意义。\nB项正确，1981年6月27日，中国共产党第十一届中央委员会第六次全体会议在北京召开。会议讨论和通过了《关于建国以来党的若干历史问题的决议》，科学地评价了毛泽东个人以及毛泽东思想。\nC项错误，1984年10月20日，中国共产党第十二届中央委员会第三次全体会议在北京召开。会议讨论并通过了《中共中央关于经济体制改革的决定》，规定了改革的方向、性质、任务和方针政策，是指导中国经济体制改革的纲领性文件。\nD项错误，1986年9月28日，中国共产党第十二届中央委员会第六次全体会议在北京召开。会议讨论并通过了《中共中央关于社会主义精神文明建设指导方针的决议》，进一步阐明社会主义精神文明建设的战略地位、根本任务和基本指导方针，是新的历史时期加强我国社会主义精神文明建设的纲领性文献。1993年，在党的十四届三中全会上通过了《中共中央关于建立社会主义市场经济体制若干问题的决定》。《决定》把经济体制改革目标和基本原则进一步具体化，制定了建立社会主义市场经济体制的总体规划。\n故正确答案为B。","no":2,"missingImage":false},{"type":"question","qid":"4817757","cat":"法律常识","stem":"下列对我国全过程人民民主表述不准确的是：","options":{"A":"推进全过程人民民主建设必须坚持走中国特色社会主义政治发展道路","B":"推进全过程人民民主建设，必须坚持党的领导、人民当家作主、依法治国有机统一","C":"深刻认识和把握全过程人民民主重大理念，发挥人大在发展全过程人民民主中的重要作用","D":"全过程人民民主体现了社会主义民主的本质特征，体现了国家一切权力属于公民的宪法原则，体现了我们党以人民为中心的根本宗旨"},"answer":"D","explanation":"本题考查政治常识。\nA项正确，实践充分证明，中国特色社会主义政治发展道路是符合中国国情、保证人民当家作主的正确道路，故推进全过程人民民主建设必须坚持走中国特色社会主义政治发展道路。\nB项正确，党的十八大以来，习近平总书记在总结我国社会主义民主政治建设实践的基础上，提出了“发展全过程人民民主”的重大命题。这个重大命题写进了十九届六中全会通过的《中共中央关于党的百年奋斗重大成就和历史经验的决议》当中，强调必须坚持党的领导、人民当家作主、依法治国有机统一，积极发展全过程人民民主，成为我们在新的历史条件下进一步推进政治建设、发展社会主义民主的重要思想指导。\nC项正确，在中央人大工作会议上，习近平总书记系统阐述全过程人民民主这一重大理念，丰富发展了社会主义民主政治的内涵，对马克思主义民主政治理论作出了原创性贡献。总书记强调必须坚持用制度体系保障人民当家作主，指出人民代表大会制度是实现我国全过程人民民主的重要制度载体，为新时代发展全过程人民民主、推进社会主义民主政治建设提供了根本遵循，为新时代坚持和完善人民代表大会制度、加强和改进人大工作指明了前进方向。\nD项错误，社会主义民主政治的本质特征是人民当家作主。“全过程人民民主”真正将民主选举、民主协商、民主决策、民主管理、民主监督各个环节彼此贯通起来，支持和确保人民当家作主，体现了社会主义民主的本质特征，体现了国家一切权力属于人民的宪法原则，体现了我们党全心全意为人民服务的根本宗旨。根据《中华人民共和国宪法》第二条第一款规定：“中华人民共和国的一切权力属于人民。”而非属于公民。\n本题为选非题，故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"4817759","cat":"法律常识","stem":"政府信息公开对于提高政府工作的透明度，建设法治政府，充分发挥政府信息对人民群众生产、生活和经济社会活动的服务作用有重要意义，下列属于政府应当主动公开的信息是:\n①行政机关在行政执法过程中形成的案卷信息\n②行政机关人事管理、后勤管理等内部事务方面的信息\n③办理行政许可和其他对外管理服务事项的依据、条件、程序以及办理结果\n④扶贫、教育、医疗、社会保障、促进就业等方面的政策、措施及其实施情况","options":{"A":"①②","B":"①④","C":"②③","D":"③④"},"answer":"D","explanation":"本题考查法律常识。\n①错误，根据《中华人民共和国政府信息公开条例》第十六条第二款规定：“行政机关在履行行政管理职能过程中形成的讨论记录、过程稿、磋商信函、请示报告等过程性信息以及行政执法案卷信息，可以不予公开。法律、法规、规章规定上述信息应当公开的，从其规定。”\n②错误，根据《中华人民共和国政府信息公开条例》第十六条第一款规定：“行政机关的内部事务信息，包括人事管理、后勤管理、内部工作流程等方面的信息，可以不予公开。”\n③正确，根据《中华人民共和国政府信息公开条例》第二十条第（五）项规定：“行政机关应当依照本条例第十九条的规定，主动公开本行政机关的下列政府信息：办理行政许可和其他对外管理服务事项的依据、条件、程序以及办理结果。”\n④正确，根据《中华人民共和国政府信息公开条例》第二十条第（十一）项规定：“行政机关应当依照本条例第十九条的规定，主动公开本行政机关的下列政府信息：扶贫、教育、医疗、社会保障、促进就业等方面的政策、措施及其实施情况。”\n故属于政府应当主动公开的信息是③④。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"4817763","cat":"人文常识","stem":"党的十八大以来，全党先后开展了多次集中性学习教育，这些集中性学习教育促使党的创造力、凝聚力、战斗力显著提高，党的自我净化，自我完善、自我革新，自我提高能力不断增强，下列集中性学习教育按时间先后排序正确的是：\n①党的群众路线教育实践活动\n②“三严三实”专题教育\n③“不忘初心，牢记使命”主题教育\n④“两学一做”学习教育","options":{"A":"①②③④","B":"①②④③","C":"①③②④","D":"②①④③"},"answer":"B","explanation":"本题考查政治常识。\n①党的群众路线教育实践活动是2013年6月至2014年10月在全党范围内部署开展的一次以为民、务实、清廉为主要内容，聚焦作风建设的教育实践活动。活动的目的是为了保持党的先进性和纯洁性，着力解决人民群众反映强烈的突出问题，提高做好新形势下群众工作的能力。\n②2015年4月10日，中共中央办公厅印发《关于在县处级以上领导干部中开展“三严三实”专题教育方案》。从2015年4月底开始，“三严三实”专题教育在全党展开，中央政治局带头，坚持以上率下、示范带动。各级党委主要抓了集中学习、专题党课、专题研讨、查摆整改4个方面的工作。\n③2019年5月31日，“不忘初心、牢记使命”主题教育工作会议在北京召开。“不忘初心、牢记使命”主题教育从2019年6月开始，以县处级以上领导干部为重点，在全党自上而下分两批开展。主题教育要贯彻守初心、担使命，找差距、抓落实的总要求，目标是理论学习有收获、思想政治受洗礼、干事创业敢担当、为民服务解难题、清正廉洁作表率，推动全党更加自觉地为实现新时代党的历史使命不懈奋斗。\n④2016年2月，中共中央办公厅印发了《关于在全体党员中开展\"学党章党规、学系列讲话，做合格党员\"学习教育方案》，并发出通知，要求各地区各部门认真贯彻执行。通知指出，开展“学党章党规、学系列讲话，做合格党员”学习教育（简称“两学一做”学习教育），是面向全体党员深化党内教育的重要实践，是推动党内教育从“关键少数”向广大党员拓展、从集中性教育向经常性教育延伸的重要举措。\n故正确顺序为①②④③。\n故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"4817795","cat":"法律常识","stem":"根据《中华人民共和国民法典》，下列说法正确的是：","options":{"A":"一方患有重大疾病但未在结婚登记前告知另一方的，另一方可以请求撤销婚姻","B":"具有民事行为能力的自然人可以通过网络遗嘱的方式处理自己的合法财产","C":"丧偶儿媳不能作为第一或者第二顺序继承人","D":"有违法犯罪记录的，不能成为收养人"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国民法典》第一千零五十三条第一款规定：“一方患有重大疾病的，应当在结婚登记前如实告知另一方；不如实告知的，另一方可以向人民法院请求撤销婚姻。”\nB项错误，根据《中华人民共和国民法典》第一千一百三十四条至一千一百三十九条规定，法定的遗嘱的形式有：自书遗嘱、代书遗嘱、打印遗嘱、以录音录像形式立的遗嘱、口头遗嘱和公证遗嘱六类。没有网络遗嘱这一种类。\nC项错误，根据《中华人民共和国民法典》第一千一百二十九条规定：“丧偶儿媳对公婆，丧偶女婿对岳父母，尽了主要赡养义务的，作为第一顺序继承人。”\nD项错误，根据《中华人民共和国民法典》第一千零九十八条规定：“收养人应当同时具备下列条件：······（四）无不利于被收养人健康成长的违法犯罪记录······”\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"4817799","cat":"人文常识","stem":"川藏铁路被称为“史上最难建”铁路，起到连接我国中西部地区的重要作用，以下不处在川藏铁路沿线的是：","options":{"A":"雅安到林芝段","B":"色季拉山隧道","C":"大渡河特大桥","D":"可可西里站"},"answer":"D","explanation":"本题考查地理国情。\n川藏铁路是中国境内一条连接四川省与西藏自治区的快速铁路，呈东西走向，东起四川省成都市，西至西藏自治区拉萨市。\nA项正确，雅安至林芝段位于四川省、西藏自治区境内，是川藏铁路上的一段，线路起自四川雅安，终至西藏林芝。\nB项正确，色季拉山隧道正洞全长37.9公里，位于川藏铁路沿线的林芝市巴宜区境内的色季拉山。\nC项正确，川藏铁路大渡河特大桥是川藏铁路的控制性节点工程，是川藏铁路进藏第一桥，大桥采用悬索桥方案，横跨泸定大渡河峡谷。\nD项错误，可可西里站是青藏铁路上的一座车站，位于楚玛尔河至五道梁间、可可西里国家自然保护区。\n本题为选非题，故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"4817802","cat":"人文常识","stem":"下列哪一诗句中所使用的修辞手法与其他三项不同？","options":{"A":"臣心一片磁针石，不指南方不肯休","B":"接天莲叶无穷碧，映日荷花别样红","C":"忽如一夜春风来，千树万树梨花开","D":"世味年来薄似纱，谁令骑马客京华"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，诗句出自南宋文人文天祥的《扬子江》，意思是臣的心好似一块磁铁，不指向南方誓不罢休。用的是比喻的修辞手法。\nB项错误，诗句出自南宋诗人杨万里的《晓出净慈寺送林子方》，意思是那密密层层的荷叶铺展开去，与蓝天相连接，一片无边无际的青翠碧绿；那亭亭玉立的荷花绽蕾盛开，在阳光辉映下，显得格外的鲜艳娇红。用的是夸张的修辞手法。\nC项正确，诗句出自唐代诗人岑参的《白雪歌送武判官归京》，意思是忽然间宛如一夜春风吹来，好像是千树万树梨花盛开。用的是比喻的修辞手法。\nD项正确，诗句出自南宋诗人陆游的《临安春雨初霁》，意思是近年来做官的兴味淡淡的像一层薄纱，谁又让我乘马来到京都作客沾染繁华？用的是比喻的修辞手法。\n本题为选非题，故正确答案为B。","no":8,"missingImage":false},{"type":"question","qid":"4817806","cat":"地理国情","stem":"“你从雪山走来，春潮是你的风采；你向东海奔去，惊涛是你的气概。”这句歌词描写的是一条河流，下列与之相关的说法正确的是：","options":{"A":"该河是我国南北方的地理分界线","B":"我国最大的淡水湖位于该河的流域范围内","C":"该河的干流流经区域内是温带大陆性气候区","D":"“大漠孤烟直，长河落日圆”描写的是该河上游的景象"},"answer":"B","explanation":"本题考查地理常识。\n“你从雪山走来，春潮是你的风采；你向东海奔去，惊涛是你的气概”出自《长江之歌》。长江发源于“世界屋脊”——青藏高原的唐古拉山脉各拉丹冬峰西南侧，于崇明岛以东注入东海。\nA项错误，我国南北方的地理分界线是秦岭-淮河。\nB项正确，鄱阳湖地处九江、南昌、上饶三市，是中国第一大淡水湖，也是中国第二大湖，仅次于青海湖。该湖是长江中下游主要支流之一，也是长江流域的一个过水性、吞吐型、季节性重要湖泊。\nC项错误，温带大陆性气候主要分布在南、北纬\u003cimg data-k=\"b1455b37eec6\">~\u003cimg data-k=\"c1ec48dc2933\">的亚欧大陆和北美大陆内陆地区和南美东南部，我国的西北大部分地区属于此气候。长江干流流经区域大部分属于亚热带季风气候，在青藏高原的部分属于高山高原气候。\nD项错误，“大漠孤烟直，长河落日圆”出自王维的《使至塞上》，这是诗人奉命赴边疆慰问将士途中所作的一首纪行诗，记述出使塞上的旅程以及旅程中所见的塞外风光。描写的是黄河的景象。\n故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"4817817","cat":"科技常识","stem":"关于古代建筑元素，下列说法错误的是：","options":{"A":"华表是宫殿、陵墓等大型建筑物前装饰用的巨大石柱","B":"水榭是建于池边或水边的仿船型建筑","C":"照壁是起遮挡、屏蔽作用的墙体","D":"城阙是城门两旁的瞭望阁楼"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，华表是一种中国古代传统建筑形式，属于古代宫殿、陵墓等大型建筑物前面做装饰用的巨大石柱，相传华表是部落时代的一种图腾标志，古称桓表，富有深厚的中国传统文化内涵。\nB项错误，水榭是指建于水边或水上的亭台，以供游客休息、观赏风景的中国传统式建筑。舫是仿照船的造型，在园林的水面上或水边建造起来的一种船型建筑物，供人们游玩设宴、观赏水景。\nC项正确，照壁一般指影壁，是古代寺庙、宫殿、官府衙门和深宅大院前的一种建筑，即门外正对大门以作屏障的墙壁。\nD项正确，城阙是指城门两旁的瞭望阁楼。比如《诗·郑风·子衿》：“挑兮达兮，在城阙兮。”中的“城阙”，即指的这种建筑。\n本题为选非题，故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"4817798","cat":"人文常识","stem":"《史记》是中国历史上第一部纪传体通史，后人对其评价很高。下列评价中，不是针对《史记》的是：","options":{"A":"史家之绝唱，无韵之离骚","B":"不虚美，不隐善，故谓之实录","C":"作史有不待论断而于序事中即见其指","D":"不激诡，不抑抗，赡而不秽，详而有体"},"answer":"D","explanation":"本题考查人文常识。\nA项正确，“史家之绝唱，无韵之离骚”的意思是史家独一无二的文章，没有韵的《离骚》。这是鲁迅对司马迁《史记》的评价。\nB项正确，“不虚美，不隐善，故谓之实录”的意思是不凭空加以赞美，不掩饰其过错，因此称它为符合实际的记载。这是班固附于《史记》的评语。\nC项正确，顾炎武《日知录》卷二十六说：“古人作史，有不待论断而于序事之中即见其指者。惟太史公能之。”讲的是古人“寓褒贬于记叙”的写作方法。顾炎武在这里举的是司马迁写作《史记》的例子。\nD项错误，原句为“若固之叙事，不激诡，不抑抗，赡而不秽，详而有体”，意思是像班固叙事，文辞华美却不妄加抑扬，叙事详尽又能注重体例。出自《后汉书·班彪列传》，这是对写作《汉书》的班固的评价。\n本题为选非题，故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"4817801","cat":"人文常识","stem":"下列情形在北宋时期的汴梁不可能发生的是：","options":{"A":"有来自波斯的商人经商","B":"民众在绸缎庄买彩绸锦帛","C":"蹴鞠运动深受民众欢迎","D":"民众的餐桌上出现了花生"},"answer":"D","explanation":"本题考查人文常识。\nA项正确，随着陆上丝绸之路和海上丝绸之路的兴起，唐宋时期来华的外商众多，其中阿拉伯商人最为活跃。其中相当一部分是与中国相邻近的波斯的“胡商”，他们从陆上丝路携带着香料和珍宝来到凉州、长安，然后深入到洛阳、成都以及长江流域。\nB项正确，北宋时期商业发达，民众是有可能在绸缎庄购买彩绸锦帛的。\nC项正确，“蹴鞠”就是指古人以脚蹴、蹋、踢皮球的活动，类似今日的足球。据史料记载，早在战国时期中国民间就流行娱乐性的蹴鞠游戏，而从汉代开始又成为兵家练兵之法，宋代又出现了蹴鞠组织与蹴鞠艺人，清代开始流行冰上蹴鞠。\nD项错误，1492年，哥伦布发现美洲，引发了欧洲人对这块所谓“新大陆”的注意。在美洲成功殖民后，16世纪后期，西班牙人进而在南亚的菲律宾建立殖民地，一些美洲农作物开始传入菲律宾，再由菲律宾传到南洋各地，并进一步传到中国。美洲作物的引种与传播成为明清时期我国农作物引进的一个显著特点。故北宋时期民众的餐桌上不可能出现花生。\n本题为选非题，故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"4817818","cat":"人文常识","stem":"苏轼在《游金山寺》一诗中说道：“是时江月初生魄，二更月落天深黑。”当天的月相应该是：","options":{"A":"初三\n\u003cimg data-k=\"21819b74e647\" style=\"max-width:98px\">","B":"初八\n\u003cimg data-k=\"fd98a468190f\" style=\"max-width:94px\">","C":"十五\n\u003cimg data-k=\"64771ea8cfae\" style=\"max-width:89px\">","D":"二十七\n\u003cimg data-k=\"2cf5e31f74c9\" style=\"max-width:94px\">"},"answer":"A","explanation":"本题考查地理国情。\n题干中诗句意为：正当此时江中月亮刚刚还在初升起，二更时辰月儿下山天空一片深漆黑。苏轼游金山是在农历十一月初三，此时对应的月相应为蛾眉月。\n蛾眉月是出现在农历月底和月初的月相，形状如同眉毛，日出后月出，日落后月落，与太阳同在天空，故在明亮的天空中看不到该月相。只有当太阳落山后的一段时间能在西方天空看到蛾眉月。诗中描述的“月亮刚刚才升起，二更时就落下”的月相就是蛾眉月。\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"4817819","cat":"人文常识","stem":"关于冰上体育运动，下列说法错误的是：","options":{"A":"加拿大、俄罗斯、美国是传统的冰球强队","B":"冰壶运动中使用的“壶”是纯铜制作的","C":"短道速滑运动员必须佩戴规定形状的头盔","D":"冰上舞蹈是奥运会花样滑冰的正式比赛项目"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，在世界冰球运动历史中，加拿大、俄罗斯、美国一直都是传统的冰球强队，其他有竞争力的队伍还包括瑞典队、芬兰队等。冰球魅力的核心，在于高速高强度的对抗。\nB项错误，冰壶的主体部分原料为不含云母的花岗岩，产自苏格兰艾尔萨克雷格岛，这种材质硬度高，吸水性弱，撞击后不易碎，适合制作冰壶。纯铜是柔软的金属，表面刚切开时为红橙色带金属光泽，单质呈紫红色。\nC项正确，短道速滑选手使用硬塑料头盔来保护自己，以免遭撞击所致的伤害。短道速滑安全头盔应符合现行的ASTM标准。头盔必须有一个规则的形状不能有突起。\nD项正确，北京冬奥会花样滑冰比赛设5个小项，分别为：男子单人滑、女子单人滑、双人滑、冰上舞蹈、团体赛。冰上舞蹈的表演由步法和托举、小跳、姿态等动作组成，更侧重舞步，强调舞蹈的韵味和表现力，技术动作不包括跳跃，托举时男选手的主托举手不能超过头。\n本题为选非题，故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"4817821","cat":"科技常识","stem":"关于生活中的物理知识，下列说法正确的是：","options":{"A":"微波炉的加热原理是利用电能直接转化为内能","B":"煮饭、烧水时主要是运用热传导方式进行传热的","C":"使用炉灶炒菜时，要使锅底放在火苗的外焰，外焰温度高","D":"高压锅煮食物熟的快是因为锅内气压增大，降低了水的沸点"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，微波炉由电源、磁控管、控制电路和烹调腔等部分组成。它利用其内部的磁控管，将电能转变成微波，以非常高的振荡频率穿透食物，当微波被食物吸收时，食物内之极性分子（如水、脂肪、蛋白质等）即被吸引而快速振荡，这种震荡的宏观表现就是食物被加热了。\nB项错误，热传导是介质内无宏观运动时的传热现象，其在固体、液体和气体中均可发生，但严格而言，只有在固体中才是纯粹的热传导，而在流体中即使处于静止状态，也会由于温度梯度所造成的密度差而产生自然对流，因此，在流体中热对流与热传导同时发生。故烧水、煮饭主要运用的是热对流。 \nC项正确，火焰分为三层：内层是深蓝色火焰，因供氧不足，燃烧不完全，温度最低，有还原作用，称焰心或还原焰；中层是深红或浅黄色火焰，明亮，温度比内层高，称内焰；外层是无色，因供氧充足，燃烧完全，温度最高，有氧化作用，称外焰或氧化焰。火焰的温度由内向外依次增高，因此使用炉灶时用外焰。\nD项错误，高压锅通过液体在较高气压下沸点会提升这一物理现象，对水施加压力，使水可以达到较高温度而不沸腾，以加快炖煮食物的效率。\n故正确答案为C。","no":15,"missingImage":false}],"count":14,"answerable":14,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"4817717","cat":"逻辑填空","stem":"梳理百年党史让人留下深刻记忆：一个主题贯穿全程，那就是实现中华民族伟大复兴；一个关系牢不可破，那就是党与人民休戚与共、生死相依；一个宗旨            ，那就是全心全意为人民服务。\n填入画横线部分最恰当的一项是：","options":{"A":"始终不渝","B":"坚持不懈","C":"持之以恒","D":"一如既往"},"answer":"A","explanation":"横线处搭配“宗旨”，且与“贯穿全程”“牢不可破”构成并列关系，体现宗旨是一直存在、不可动摇的。A项“始终不渝”指从开始到最后，一直不改变，搭配恰当，且与文意相符，当选。B项“坚持不懈”形容做事持之以恒，C项“持之以恒”指长久地坚持下去，多与有主观能动性的主体搭配，均与“宗旨”搭配不当，排除；D项“一如既往”指完全和过去一样，文段并非表达与过去一样，而是强调一直存在、不可动摇，且与“宗旨”搭配不当，排除。\n故正确答案为A。\n【文段出处】《人民日报人民论坛：“始终同人民想在一起、干在一起”》","no":16,"missingImage":false},{"type":"question","qid":"4817724","cat":"逻辑填空","stem":"红色资源是宝贵的革命历史文化遗产，全国各地都有自己独特的红色资源，这些红色资源具有唯一性和原真性的特点，十分珍贵，人们走进这些红色资源，正是想            地具体了解其独特的革命遗址、纪念物及先辈的革命事迹，在真实体验中感悟当年艰苦卓绝的革命历程和先辈崇高的革命精神。\n填入画横线部分最恰当的一项是：","options":{"A":"设身处地","B":"近在咫尺","C":"寓教于乐","D":"亲临其境"},"answer":"D","explanation":"根据“走进这些红色资源”“在真实体验中感悟”可知，横线处所填成语应表达观众切身感受红色资源之意。D项“亲临其境”指亲自到了那个地方，符合文意，当选。A项“设身处地”指站在别人的处境替别人着想，B项“近在咫尺”形容距离很近，C项“寓教于乐”指把教育跟娱乐融合为一体，使人在娱乐中受到教育，均无法体现出切身感受之意，与文意不符，排除。\n故正确答案为D。\n【文段出处】《红色资源是宝贵的革命历史文化遗产》","no":17,"missingImage":false},{"type":"question","qid":"4817733","cat":"逻辑填空","stem":"过去几十年中国发展总体上很成功，但也存在一些            的短视行为，比如优先上马“短平快”赢利项目而忽视更需长期投入和经营的基础科学，有些重要项目采取简单外购的“拿来主义”而没下大力气自己攻关。结果，我们在一些关键技术上存在被人“卡脖子”的        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"急功近利 隐患","B":"好大喜功 短板","C":"顾此失彼 困境","D":"心浮气躁 威胁"},"answer":"A","explanation":"第一空，形容“短视行为”，根据后文“比如优先上马‘短平快’赢利项目而忽视更需长期投入和经营的基础科学”可知，横线处所填成语应体现出只注重眼前利益、不顾长远的含义，A项“急功近利”意思是急于求成，贪图眼前的成效和利益，符合文意，保留。B项“好大喜功”指不管条件是否许可，一心想做大事立大功，多用以形容浮夸的作风，C项“顾此失彼”指顾了这个，丢了那个，形容不能全面照顾，D项“心浮气躁”指内心浮躁，均与文意不符，排除。\n第二空，代入验证。横线处所填词语搭配“存在”，体现一些关键技术存在问题，A项“隐患”指潜在的危险，可与“存在”搭配，置于此处符合文意，当选。\n故正确答案为A。\n【文段出处】《徐焰：在科技强国道路上扎实前进》","no":18,"missingImage":false},{"type":"question","qid":"4817738","cat":"逻辑填空","stem":"把企业打造成创新人才成长的“快乐大本营”，要潜心营造自由宽松、宽容失败的创新文化。在美国硅谷，创新失败者被视为“有经验的人”而受到企业        ，创新失败的历练增加了人才的市场价值。在中国，一些大企业对同一创新项目往往组建多个研发团队，鼓励团队之间的竞争，被淘汰者            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"重视 习以为常","B":"赞誉 心悦诚服","C":"青睐 虽败犹荣","D":"欢迎 比比皆是"},"answer":"C","explanation":"本题可从第二空入手，根据“要潜心营造自由宽松、宽容失败的创新文化”以及“创新失败的历练增加了人才的市场价值”可知，横线处成语应体现出被淘汰者处在“自由宽松”的创新环境中。C项“虽败犹荣”表示虽然失败了，但还是非常光荣，符合文意，保留。A项“习以为常”指某种事情经常去做或某种现象经常看到，也就觉得很平常了，B项“心悦诚服”指真心地服气或服从，D项“比比皆是”指到处都是，形容极其常见，均无法体现出“自由宽松”的创新环境，排除。\n第一空，代入验证。C项“青睐”意思是重视、看得起，对应“创新失败者被视为‘有经验的人’”，符合文意，当选。\n故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"4817746","cat":"逻辑填空","stem":"毋庸置疑，        科技创新的突破性力量，善用科技，将使我们的世界变得更加美好。但科技所蕴含的潜力要真正转化为对社会有意义的现实力量，真正形成        的趋利避害机制，需要包括科技企业在内的全社会的共同努力。在此过程中，技术调节的观念有助于促使科技的杠杆朝着有益社会的方向撬动。\n依次填入画横线部分最恰当的一项是：","options":{"A":"顺应 长效","B":"倚靠 灵活","C":"利用 新颖","D":"借助 稳健"},"answer":"D","explanation":"第一空，搭配“力量”，且对应“善用科技”，横线处词语应体现使用、利用之意。C项“利用”指用手段使人或事物为自己服务，D项“借助”指靠别的人或事物的帮助，均符合文意，且搭配恰当，保留。A项“顺应”指顺从、适应，常搭配“潮流”“趋势”等，B项“倚靠”指依赖、依靠，常搭配人或具体事物，均与“力量”搭配不当，排除。\n第二空，搭配“机制”，且对应“对社会有意义的现实力量”“科技的杠杆朝着有益社会的方向撬动”，横线处词语应体现有益、有效之意。D项“稳健”指稳而有力，符合文意，且“稳健机制”为常见搭配，当选。C项“新颖”指新而别致，文段并未涉及“新”，排除。\n故正确答案为D。\n【文段出处】《让科技更有担当 需从技术、社会双管齐下》","no":20,"missingImage":false},{"type":"question","qid":"4817732","cat":"逻辑填空","stem":"随着现代社会的发展，快餐文化开始            ，并且不可避免地影响校园。以快餐阅读为例，时间和精力没少花，却可能收获寥寥。要想真正从阅读中有所收获，传统阅读仍是上选；就阅读效果而言，二者不能            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"风靡一时 混为一谈","B":"蔚然成风 等量齐观","C":"大行其道 相提并论","D":"大张旗鼓 一概而论"},"answer":"C","explanation":"第一空，搭配“快餐文化”，根据“不可避免地影响校园”可知，横线处所填成语强调快餐文化比较流行，同时根据“收获寥寥”可知，作者对快餐文化持消极态度，故横线处所填成语感情色彩偏消极，C项“大行其道”指某种观点或某种事物盛行（多含贬义），符合文意，保留。A项“风靡一时”形容一个事物在一个时期非常盛行，文段并未强调快餐文化流行的时间段，与文意不符，排除；B项“蔚然成风”形容一种事物逐渐发展、盛行，形成风气，多用于积极的语境中，与文段感情色彩不符，排除；D项“大张旗鼓”形容进攻的声势和规模很大，也形容群众活动的声势和规模很大，文段仅强调快餐文化流行，并未指出其声势和规模是否很大，与文意不符，排除。\n验证第二空，根据文意可知，横线处所填成语强调快餐阅读的效果与上选的传统阅读效果没办法进行比较，C项“相提并论”指把不同的人或不同的事放在一起谈论或看待，符合文意，当选。\n故正确答案为C。\n【文段出处】高考练习题","no":21,"missingImage":false},{"type":"question","qid":"4817742","cat":"逻辑填空","stem":"根植于中华大地的传统文化，是我们的先人在生产实践中        出来的文化精华，它反映了中国人的思维方式和道德观念。然而，由于时代和环境差异，这些传统文化往往被            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"提炼 熟视无睹","B":"孕育 司空见惯","C":"浓缩 漠然置之","D":"总结 束之高阁"},"answer":"D","explanation":"第一空，搭配“精华”，根据文意可知，横线处所填词语应形容先人通过生产实践发展出传统文化的过程。A项“提炼”指用化学方法或物理方法使化合物或混合物纯净，或从中提取所要的东西，C项“浓缩”泛指减少事物不需要的部分，使需要部分的含量相对增加，D项“总结”指对某一阶段的工作、学习或思想中的经验或情况进行分析研究，做出带有规律性的结论，均符合文意，且与“精华”搭配得当，保留。B项“孕育”比喻在既存的事物中酝酿着新事物，与“精华”搭配不当，排除。\n第二空，“由于”表原因，前后文应形成因果逻辑，故横线处所填成语应体现出传统文化由于“时代和环境差异”往往难以融入现实生活之意。D项“束之高阁”比喻放着不用、丢在一旁不管，也比喻把某事或某种主张、意见、建议等搁置起来，不予理睬和办理，符合文意，当选。A项“熟视无睹”意为看惯了却像没看见一样，形容对事物漫不经心或不重视，文段并未体现出“看惯了”，与文意不符，排除；C项“漠然置之”指很冷淡地把它搁在一边，对人或事态度冷淡，放在一边不理，侧重态度冷淡，而文段侧重传统文化被搁置起来，并未指出人们对传统文化态度冷淡，排除。\n故正确答案为D。\n【文段出处】《让传统文化融入现代生活》","no":22,"missingImage":false},{"type":"question","qid":"4817753","cat":"逻辑填空","stem":"青年大学生思想比较活跃，充满激情和活力，接受新生事物快，参与意识强，但他们在认识和理解现实时也容易产生            的问题，对事物的          、困难的艰巨性认识不够。因此，我们应带领学生走出校门，走进丰富、生动的社会大课堂。\n依次填入画横线部分最恰当的一项是：","options":{"A":"管中窥豹 多样性","B":"先入为主 曲折性","C":"一叶障目 复杂性","D":"自以为是 两面性"},"answer":"C","explanation":"第一空，根据“认识不够”“走出校门”“走进丰富、生动的社会大课堂”可知，横线处所填成语应体现出学生接触面小，对现实了解较少之意。A项“管中窥豹”比喻只见到事物的一小部分，指所见不全面或略有所得，C项“一叶障目”比喻被局部的或暂时的现象所迷惑，不能认清事物的全貌或问题的本质，均符合文意，保留。B项“先入为主”指先听进去的话或先获得的印象往往在头脑中占有主导地位，以后再遇到不同的意见时，就不容易接受，D项“自以为是”指总以为自己是对的，认为自己的观点、做法都正确，不接受别人的意见，均无法与后文构成因果关系，与文意不符，排除。\n第二空，顿号表并列，故横线处所填词语应与“艰巨性”对应。C项“复杂性”指多而杂乱，可体现困难艰巨之意，当选。A项“多样性”指种类的多样，感情色彩为中性，无法与“艰巨性”对应，与文意不符，排除。\n故正确答案为C。\n【文段出处】《办好思政课 提升育人质量》","no":23,"missingImage":false},{"type":"question","qid":"4817776","cat":"逻辑填空","stem":"除了一些常见元素，海水中还        了大量的微量元素。科学家        海水和海洋沉积物中各种各样的元素，去        大洋的洋流路径，了解不同水体之间的混合，确定海水的酸度，估算海水温度和盐度等。\n依次填入画横线部分最恰当的一项是：","options":{"A":"稀释 通过 分析","B":"分解 根据 研究","C":"溶解 利用 追踪","D":"溶化 收集 考察"},"answer":"C","explanation":"第一空，根据文意可知，横线处所填词语应体现出“海水”中含有大量“微量元素”之意。C项“溶解”指一种物质以分子或离子等状态均匀地分散在另一种物质中，置于此处可以表示海水中含有大量微量元素，与文意相符，保留。A项“稀释”指在溶液中再加入溶剂使溶液的浓度降低，文段并无将微量元素的浓度降低之意，与语境不符，排除；B项“分解”指一个整体分成它的各个组成部分，或指一种物质经过化学反应而生成两种或两种以上成分较简单的其他物质，文段并无将微量元素拆分成几个部分或几种其他物质的意思，且海水无法分解微量元素，排除；D项“溶化”指溶解，多指固体溶解，或形容冰、雪等变成水，文段强调“海水”中含有大量“微量元素”，并非固体溶解或冰雪溶化，与文意不符，排除。\n第二空，代入验证，C项“利用”与“元素”搭配恰当，保留。\n第三空，代入验证，根据文意可知，“海水和海洋沉积物中各种各样的元素”有助于了解“大洋的洋流路径”。C项“追踪”指按着踪迹去追赶或根据线索去追查，置于此处可表示以“元素”为线索，来了解“大洋的洋流路径”，符合文意，当选。\n故正确答案为C。\n【文段出处】《轻松读懂海洋（3）海水的复杂性质》","no":24,"missingImage":false},{"type":"question","qid":"4817791","cat":"逻辑填空","stem":"人无德不立，品德是为人之本。面对            的世界变局，要明辨是非、恪守正道；面对形形色色的外部诱惑，要保持定力、严守规矩；面对来之不易的美好岁月，要            、心怀感恩；面对强国强军的伟大事业，要            、勇于担当。\n依次填入画横线部分最恰当的一项是：","options":{"A":"纷繁复杂 安之若素 当仁不让","B":"眼花缭乱 知恩图报 一马当先","C":"扑朔迷离 饮水思源 责无旁贷","D":"一日千里 安居乐业 义不容辞"},"answer":"C","explanation":"第一空，搭配“世界变局”，A项“纷繁复杂”形容头绪多，情况复杂，C项“扑朔迷离”形容事情错综复杂，难以辨别清楚，D项“一日千里”比喻进展极快，均可形容世界发展的局势，保留。B项“眼花缭乱”形容眼睛看见复杂纷繁的东西而感到迷乱，也比喻事物复杂，无法辨清，通常搭配的主语为人，且在文中需表述为“令人眼花缭乱的世界变局”，搭配不当，排除。\n第二空，通过“、”与“心怀感恩”形成并列，体现要感恩现在的美好岁月，C项“饮水思源”指喝水的时候想起水是从哪儿来的，比喻不忘本，符合文意，保留。A项“安之若素”指在反常或危困等情况下，仍安然处之，毫不在意，D项“安居乐业”指人民生活安定美满的样子，比喻安定地生活，愉快地工作，均不能体现感恩之意，排除。\n第三空，代入验证，C项“责无旁贷”指自己应尽的责任，不能推卸给旁人，可与“勇于担当”形成并列关系，符合文意，当选。\n故正确答案为C。\n【文段出处】《不仅要在物质上强，更要在精神上强》","no":25,"missingImage":false},{"type":"question","qid":"4817708","cat":"片段阅读","stem":"认知地图是一种心智表征，它服务于个人获取、编码、存储、回忆和解码有关其日常或隐喻空间环境中现象的相对位置和属性的信息。海马体在人体中的存在，不但让我们建立起关于空间的认知地图，帮助我们记住位置并找到正确路线，还表明我们关于过去的记忆正是建立在认知地图上的。而空间认知和记忆对人类的意义远超日常生存，它们形成了我们的自我感知：过去的记忆就像我们个体身份的支柱，我们用它铸造了我们生活中的独特叙事；这些故事塑造了我们的行动和决策，也为我们描画出遐想未来的框架。\n这段文字意在揭示：","options":{"A":"认知地图对人类的重要意义","B":"早期记忆对个体发展的影响","C":"空间认知与早期记忆之间的关系","D":"海马体如何影响人类的自我感知"},"answer":"A","explanation":"文段首先引出“认知地图”的话题，介绍了“认知地图”的定义，紧接着指出人体中通过海马体建立了关于空间的认知地图，而且我们过去的记忆正是建立在认知地图上的。最后强调基于认知地图形成的空间认知和记忆对人类的重要意义，形成了我们的自我感知，并进行了具体说明。故文段重点强调认知地图对人类的重要意义，对应A项。\nB项，未包含主题词“认知地图”，偏离文段重点，且“早期记忆对个体发展的影响”仅属于文段中的部分内容，表述片面，排除；\nC项，强调“空间认知与早期记忆之间的关系”，未包含主题词“认知地图”，且文段强调的是基于认知地图形成的空间认知与早期记忆对人类的影响，而非二者的关系，偏离文段重点，排除；\nD项，未包含主题词“认知地图”，且选项强调海马体对人类自我感知的影响，而根据文意，海马体建立了空间认知地图，形成了人类的自我感知，而非影响人类的自我感知，表述错误，排除。\n故正确答案为A。\n【文段出处】《如果婴儿期记忆对我们至关重要，那我们为何会遗忘它？》","no":26,"missingImage":false},{"type":"question","qid":"4817719","cat":"片段阅读","stem":"“数字乡村”战略是“数字中国”建设的重要方面，发展数字农业、推进农业数字化对于做好“三农”工作有着重要意义。由于城乡差距，我国农村的网络基础设施和网民数量均落后于城市，但是在“十三五”期间，尤其是2019年、2020年，农村网民规模和互联网普及率出现了非常显著的增长，远高于全国网民规模和互联网普及率的平均增速。这表明，我国城乡间互联网发展不均衡的现象已得到改善。\n这段文字最后一句中的“这”指的是：","options":{"A":"农村网络基础设施和网民数量均落后于城市","B":"我国城乡间互联网发展不均衡已经得到改善","C":"数字技术已持续渗透到社会经济的各个领域","D":"农村网民规模和互联网普及率获得大幅提升"},"answer":"D","explanation":"指代词在尾句出现，且由尾句可知，指代内容与城乡间互联网发展不均衡的现象得以改善有关，故结合前文进行分析。文段开篇指出“数字乡村”战略的重要性，接着介绍农村的网络基础设施和网民数量均落后于城市。随后通过转折关联词“但是”强调在“十三五”期间农村网民规模和互联网普及率有较大的提升，并通过这一现象得出结论，我国城乡间互联网发展不均衡的现象已有所改善。因此尾句“这”指代的是农村网民规模和互联网普及率的提升，对应D项。\nA项，为转折前内容，无法得出后文结论，排除；\nB项，为指代词后内容，不符合文段逻辑，排除；\nC项，不是指代词所指代的内容，无法得出后文结论，且“已持续渗透······各个领域”无中生有，排除。\n故正确答案为D。\n【文段出处】《数字经济已经渗透到社会各个领域》","no":27,"missingImage":false},{"type":"question","qid":"4817727","cat":"片段阅读","stem":"乌鸦与人类在行为上有许多有趣的共同点：都喜欢玩耍，而且经常使用工具。我们知道，人类幼儿通过玩耍来学习。当蹒跚学步的孩童推倒一堆积木时，他们的大脑里就在形成构建和测量物体的能力。问题在于，乌鸦的玩耍是否也是为了同样的目的？在此前的研究中，科学家记录了野生新喀鸦使用各种各样工具的行为，比如它们会用有钩的木棍或特别准备的叶片，将躲在树干缝隙中的昆虫拖出来。然而，科学家也经常观察到乌鸦摆弄着各种古怪的东西，似乎只是单纯地因为好玩，而没有明确的目的。\n这段文字接下来最可能讲的是：","options":{"A":"关于人类玩耍的社会学解释","B":"乌鸦有哪些使用工具的具体行为","C":"关于乌鸦摆弄东西目的的最新研究","D":"乌鸦与人类在工具使用上的不同特点"},"answer":"C","explanation":"本题为接语选择题。文段开篇介绍乌鸦与人类在行为上有很多共同点，之后通过论述儿童玩耍引出了“乌鸦玩耍目的”的话题，并具体介绍野生新喀鸦使用工具的行为，尾句通过转折词“然而”强调乌鸦摆弄各种东西似乎没有明确的目的。故后文应该围绕乌鸦摆弄东西的目的展开论述，对应C项。\nA项“人类玩耍”、B项“具体行为”、D项“工具使用上的不同特点”均偏离文段最后论述的核心话题“目的”，排除。\n故正确答案为C。\n【文段出处】《乌鸦天性好玩？从玩具到工具只是间接过程》","no":28,"missingImage":false},{"type":"question","qid":"4817735","cat":"片段阅读","stem":"我们在阅读时，大脑左右半球的分工不同：左脑先理解后记忆，记忆慢、遗忘快，更适合记忆的消化、吸收；而右脑则会将语言变成图像，可以大量、快速地记忆，且记忆质量很高，一旦记住就很难忘掉。也就是说，当右脑分析一个词时，比如阅读到“猫”这个词时，就会自动在右脑影像库中搜寻猫的形象，然后将猫这个词与它的图片链接在一起，加深印象。如果是分析一句话，比如“猫在睡觉”，影像库中可能出现的就是一只猫在太阳底下蜷成一团睡觉的图像，或许还夹杂着轻微的鼾声。因此，语言对大脑会有更进一步的刺激，所以听书有时比阅读还多出了一道工序——声音的符号化。\n这段文字接下来最可能讲的是：","options":{"A":"听书比阅读对大脑的要求更高","B":"听书没有阅读容易集中注意力","C":"听书和阅读都是对信息的处理","D":"听书时大脑会将语言变成图像"},"answer":"A","explanation":"根据提问方式可知，本题为接语选择题，应在通读全文的基础上，重点关注文段最后论述的核心话题。文段开篇介绍我们在阅读时大脑的左右半球分工不同，并对如何分工进行具体解释，随后通过“比如”进行举例说明，最后通过“因此”总结上文，强调语言会更进一步刺激大脑，所以听书有时比阅读还多出一道工序。故文段接下来应围绕“听书对大脑的要求比阅读更高”继续展开论述，对应A项。\nB项“集中注意力”、C项“对信息的处理”，均偏离文段核心话题“大脑”，排除；\nD项，“听书时大脑会将语言变成图像”为前文论述过的内容，后文不再赘述，排除。\n故正确答案为A。\n【文段出处】《跟阅读相比“听书”只是被动接受信息吗？》","no":29,"missingImage":false},{"type":"question","qid":"4817740","cat":"片段阅读","stem":"孩子比成人的胆碱能介质在大脑里分布更广，他们学习时并不需要刻意专注。孩子的大脑可以从任何新奇有趣的地方汲取信息，即使这些信息对他们的生活一点用都没有。所以，生长在移动互联网时代的孩子在学习互联网知识时，像我们成人读书一样，自然地掌握相关能力。移动互联网中的信息对他们而言并非碎片，互联网于孩子，就像散发着油墨味的书籍对我们的意义一样，是他们学习的工具与心灵的慰藉。\n这段文字最可能回答的问题是：","options":{"A":"移动互联网为何能成为孩子的学习工具","B":"孩子大脑的作用机制与成人有什么不同","C":"为什么移动互联网信息对孩子而言并非碎片","D":"为什么移动互联网时代的孩子能够随时学习"},"answer":"A","explanation":"文段开篇介绍孩子在学习时不需要刻意专注，他们能随意获取各种各样的信息，接下来通过结论标志词“所以”总结前文，指出孩子在学习互联网知识时，会自然地掌握互联网相关的能力，尾句依旧强调互联网能够帮助孩子学习，是“学习的工具与心灵的慰藉”。故文段重在强调互联网可以帮助孩子学习知识，对应A项。\nB项，“孩子大脑的作用机制与成人有什么不同”属于文段开篇讨论的话题，非重点，排除；\nC项，偏离文段核心话题“学习”，排除；\nD项，“孩子能够随时学习”无法体现出互联网能够“帮助”孩子学习知识，排除。\n故正确答案为A。\n【文段出处】《担心孩子看太多手机？来看儿童发展心理学家的不同看法》","no":30,"missingImage":false},{"type":"question","qid":"4817712","cat":"片段阅读","stem":"艺术家和艺术的成长需要经历漫长的过程，这其中揉进了时光沉淀和情感累积，艺术品更大的价值来源于其背后沧桑岁月里的人的魅力。从技术角度看，肌理、笔触、效果等画面元素或许能被技术替代，但从画家的生平、阅历、思想情感、艺术追求等角度看，没有任何生活阅历、情绪和自我认知的机器，是否同样可以自由创作艺术品，实际上取决于一个大前提，即：人工智能想要取代人类的艺术创作，则必须要取代人类自身，首先成为社会生活的主宰。\n作者要强调的是：","options":{"A":"人工智能在艺术创作领域尚不能取代人类","B":"艺术家和艺术的成长需要漫长的沉淀和积累","C":"缺乏生活阅历的人工智能无法自由创作艺术品","D":"人工智能主宰社会生活就能取代人类艺术创作"},"answer":"A","explanation":"文段开篇指出艺术的价值更多源于背后沧桑岁月里的人的魅力，随后从技术角度分析，艺术作品的一些元素或许能够被技术替代，接着通过“但”转折强调从生平、阅历、思想情感等角度来看，人工智能要想取代人类的艺术创作，必须取代人类自身，故文段重点在转折之后，强调人工智能目前在艺术创作领域还无法取代人类，对应A项。\nB项，仅对应文段开篇话题引入的部分，为转折前的内容，非重点，排除；\nC项，“缺乏生活阅历”仅为人工智能无法取代人类艺术创作的其中一方面原因，还有“情绪和自我认知”，表述片面，且文段重在强调人工智能目前在艺术创作领域还无法取代人类，非重点，排除；\nD项，由“取决于一个大前提”可知，人工智能成为社会生活的主宰是其取代人类艺术创作的一个必要条件，“人工智能主宰社会生活就能取代人类艺术创作”的表述过于绝对，排除。\n故正确答案为A。\n【文段出处】《AI在取代创作之前，须先取代人类自身》","no":31,"missingImage":false},{"type":"question","qid":"4817715","cat":"片段阅读","stem":"《论语》“学而时习之”，其实是对“学”“习”这两种意思既有区别、但又密切相关的人类知识增进行为的表达，其外延远超过今天双音节合成词基础上形成的“学习”一词。《论语》中大量使用到“学”和“习”，“学”强调对典籍的理解与吸收、“习”强调在实践中去检验印证，故“学习”义为“学习并实践”。但是，汉代以后随着汉语词汇构成规律的变化，诸如《史记》《后汉书》等典籍所载“学习”一语已由先秦两个意义递进的单音节词组演变为双音并列式合成词，从而导致“学习”词义的缩小。讨论“学习”在《论语》中的原始本义，对于今天中国的教育振兴以及建构终身学习型社会将有所裨益。\n这是一篇文章的摘要，最适合做这篇文章标题的是：","options":{"A":"《论语》在当代的传承策略","B":"词汇演变与社会发展的关系","C":"《论语》中的“学”\"习”观","D":"汉代在经典传承中的重要地位"},"answer":"C","explanation":"文段开篇介绍《论语》当中的“学”和“习”，指出两者既有区别又密切相关，其外延远超过今天的“学习”一词，接着针对《论语》中的“学”和“习”进行具体介绍，并通过转折词“但是”指出随着汉语词汇构成规律的变化，导致“学习”词义的缩小。最后强调讨论“学习”在《论语》中的原始本义的重要性，所以整个文段主要围绕《论语》中的“学”和“习”进行论述，故文章的标题应包含核心话题，对应C项。\nA项“《论语》”、B项“词汇”、D项“汉代”均偏离文段核心话题“《论语》中的‘学’和‘习’”，不能很好地概括文段，排除。\n故正确答案为C。\n【文段出处】《〈论语〉中的“学”“习”观》","no":32,"missingImage":false},{"type":"question","qid":"4817716","cat":"片段阅读","stem":"我们如果能够看到火星生命体的残骸，就说明这些生物体灭亡距离现在的时间还不长，它们的消失过程，正好是地球生命的诞生和发展阶段，两者的不同，恰恰说明了生命在宇宙中的无比脆弱。另一方面，随着地球内核的逐渐冷却，这种现象是无法避免的，火星将是地球的“将来”，火星的状态无疑会是未来地球的缩影，一旦到了那个时候，地球也将变得不再适合生命生存，未来的人类将何去何从？这就是人类极力发展太空探索技术、开展深空探测的原因之一，这样会让我们对地球的未来、人类的未来有更加清醒的认识，同时也为寻找潜在的、适合人类生存的其他星球打下基础。\n根据上述文字，下列选项不正确的是：","options":{"A":"地球将来会不适合生命生存","B":"未来，人类有可能生活在其他星球上","C":"目前没有在火星上发现生命存在的残骸或者遗迹","D":"火星上发现的生命体残骸意味着火星将适合人类生存"},"answer":"D","explanation":"A项，根据“另一方面，随着地球内核的逐渐冷却······地球也将变得不再适合生命生存，未来的人类将何去何从？”可知，表述正确，排除；\nB项，根据“随着地球内核的逐渐冷却，这种现象是无法避免的，火星将是地球的‘将来’”和“这就是人类极力发展太空探索技术······同时也为寻找潜在的、适合人类生存的其他星球打下基础”可知，表述正确，排除；\nC项，根据“我们如果能够看到火星生命体的残骸，就说明这些生物体灭亡距离现在的时间还不长”可知，表述正确，排除；\nD项，根据“我们如果能够看到火星生命体的残骸，就说明这些生物体灭亡距离现在的时间还不长”可知，文段表述仅为假设，并未在火星上发现生命体存在的残骸或者遗迹，表述错误，且文段并未论述“在火星上发现生命体残骸”和“火星将适合人类生存”两者之间的关系，强加因果，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《为什么说一旦在火星上发现灭绝的生物体，将会是人类绝望的开始？》","no":33,"missingImage":false},{"type":"question","qid":"4817718","cat":"片段阅读","stem":"工业废水零排放脱盐过程不可避免地会产生大量浓盐水。浓盐水的主要成分是无机盐、重金属，也含有预处理、氯化、脱氯和脱盐等过程所用的少量化学品，如阻垢剂、酸和其他反应产物。这种没有被完全处理好且含有毒素的水若未经严格控制就被排放到外界环境中，会造成严重的环境污染问题，因此浓盐水的处理已经是制约工业废水排放的关键技术。\n这是一篇文章的开头，这篇文章最可能介绍的是：","options":{"A":"工业废盐水的环境危害","B":"工业废盐水的化学成分","C":"工业浓盐水的处理技术","D":"废盐水处理技术的改进"},"answer":"C","explanation":"本题为接语选择题。文段开篇先引出工业浓盐水的话题，接着介绍了浓盐水的主要成分，然后指出这种没有被完全处理好且含有毒素的浓盐水如果未经严格控制就被排放到外界环境中会造成严重的环境污染，尾句通过“因此”引出结论，指出对工业浓盐水的处理是制约工业废水排放的关键技术。故下文应该围绕工业浓盐水的处理技术展开论述，对应C项。\nA项“环境危害”、B项“化学成分”均对应“因此”之前的内容，上文已经论述过，下文不会再次论述，排除；\nD项“废盐水”范围扩大，且尾句并未提到目前处理技术的问题，“技术的改进”与尾句衔接不当，排除。\n故正确答案为C。\n【文段出处】《工业废盐水危害有多大？》","no":34,"missingImage":false},{"type":"question","qid":"4817722","cat":"片段阅读","stem":"汉字从产生的那一刻起，就担负起承载中华文化的重任。几千年来，汉字一直顽强地坚持自己独特的表意性，始终没有割断同文化的联系，与中华文化相伴而行，共同谱写了中华文明的不朽篇章。中国自古以来就十分重视汉字作为文化载体的重要社会作用。早在东汉时期，许慎在《说文解字·叙》里就作出了“文字者，经艺之本，王政之始，前人所以垂后，后人所以识古”的著名论断。文字是一切经典文献赖以存在的基础，是社会政治得以实施的首要凭借，是前人将知识和智慧传给后人、后人了解和学习古人的最重要的工具。\n这段文字意在说明：","options":{"A":"汉字是传承中华文化的重要载体","B":"文字是经典文献赖以存在的基础","C":"汉字是中华文明的重要组成部分","D":"文字是传播中华文化的重要工具"},"answer":"A","explanation":"文段开篇指出汉字担负着承载中华文化的重任，接下来论述几千年来汉字与中华文化相伴而行，共同谱写了中华文明的不朽篇章，对首句进行具体论述。随后进一步强调中国自古以来就十分重视汉字作为文化载体的重要社会作用，后文通过东汉时期许慎的论断及其释义进行举例说明。故文段重点强调汉字是中华文化的重要载体，对应A项。\nB、D两项，“文字”范围扩大，文段重点论述的核心话题为“汉字”，且对应尾句解释说明的部分，非文段重点，均排除；\nC项，文段重点强调的是汉字作为传承中华文化的载体，而非“组成部分”，偏离文段中心，排除。\n故正确答案为A。\n【文段出处】《呵护汉字 传承文明》","no":35,"missingImage":false},{"type":"question","qid":"4817710","cat":"语句表达","stem":"《中华人民共和国个人信息保护法》首次在法律层面构建了相对全面的个人信息跨境流动制度，这一制度需要兼顾多重面向与利益。一方面，个人信息跨境流动已经成为我国数字经济发展的迫切要求。根据预测，2025年我国数字经济规模有望跃居全球首位，可达人民币60万亿元，                    ，数字产品或服务的供给、交付均需清晰的数据跨境制度指引。然而另一方面，地缘政治冲突加剧，世界数字大国间博弈，不同经济体主导的数据流动框架竞争日趋激烈，数字贸易保护主义抬头，导致数字经济发展面临的国际环境更加复杂。\n填入画横线部分最恰当的一项是：","options":{"A":"全球贸易发展促成海量数据的跨境流动","B":"个人信息跨境流动成为数字贸易之必需","C":"不同数据蕴含的价值和主权属性并不相同","D":"本法为个人信息跨境流动确立了基本框架"},"answer":"B","explanation":"横线在文段中间，需考虑与前后文的衔接。横线前通过《中华人民共和国个人信息保护法》介绍了个人信息跨境流动制度应兼顾多重面向与利益，接着通过“一方面”具体展开论述，指出个人信息跨境流动是数字经济发展的迫切要求，横线后指出与数字经济相关的数字产品、服务需要跨境制度指引，接下来通过转折关联词“然而”论述个人信息跨境流动制度应兼顾的另一方面内容，故横线处应表达个人信息跨境流动对数字经济的发展很重要，对应B项。\nA项，“海量数据”与“个人信息”相比范围扩大，且“全球贸易发展”与“数字经济”话题不一致，衔接不当，排除；\nC项，“主权属性”无中生有，且缺少“个人信息跨境流动”这一核心话题，衔接不当，排除；\nD项，“确立了基本框架”未体现与数字经济的联系，与前后文话题不一致，衔接不当，排除。\n故正确答案为B。\n【文段出处】《个人信息跨境流动制度的三重维度》","no":36,"missingImage":false},{"type":"question","qid":"4817721","cat":"语句表达","stem":"丝绸之路连通了亚洲各国，各种文明在交流互鉴中互通有无、携手前行，饮食是其中重要的一部分。人类从荒昧走向文明，学会驯化动植物是成因之一；文明的发展与繁荣，则在于这种技艺的传播与改进。原产于西南亚的小麦和大麦沿东西向传播，支撑起亚欧非无数个古典文明；诞生于中国的稻米，至今仍哺育着世界近一半的人口；现在餐桌上常见的玉米、大豆、马铃薯、西红柿、黄瓜等，都是从初始的驯化地沿着贸易路线最终遍布全球的。换言之，                    。\n填入画横线部分最恰当的一项是：","options":{"A":"饮食的发展史与文明的发展史有着相同的脉络","B":"亚洲人民在饮食文明传播方面做出了积极贡献","C":"世界各地的饮食中镌刻着文明的印记","D":"美食将亚洲乃至世界连成了一个整体"},"answer":"A","explanation":"本题为语句填空题，横线位于文段结尾且出现结论词“换言之”，故横线处所填句子应对前文进行总结。文段开篇提出饮食是文明交流中的重要组成部分，紧接着通过分号引导的并列关系论述人类文明发展与驯化动植物之间的关系，并强调文明的发展和繁荣在于驯化动植物这项技能的传播与改进，而后再通过并列关系，以小麦、大麦、稻米、玉米等内容论述饮食与文明之间的关系，且由尾句所提及的饮食的发展之路都是随着驯化地遍布全球可知，饮食的发展也与文明的发展一样，与驯化动植物有关，故文段重点论述了饮食发展与文明发展具有相似性，对应A项。\nB项，“亚洲人民”仅对应并列结构的其中一部分，表述片面，排除；\nC项，文段重点论述了饮食发展与文明发展具有相似性，而非各地的饮食有文明的印记，偏离文段重点，排除；\nD项，未提及核心话题“文明”，与前文衔接不当，排除。\n故正确答案为A。\n【文段出处】《舌尖心上 文明滋味》","no":37,"missingImage":false},{"type":"question","qid":"4817726","cat":"片段阅读","stem":"有天文学家提出，可以将那些遥远的星系作为星际导航的位置参考，这些被选出来的天体就是天文学中常说的活动星系核。这些天体是星系中心的超大质量黑洞所产生的喷流，辐射非常明亮，往往比星系本身的辐射还要强很多。因为中心体积非常小，从遥远的地方去看，就像一个小点很难分辨，以至于在这类天体发现的最早期，最明亮的那一类被称为“类星体”。尽管这类星系也在空间运动，然而因为这些天体距离地球至少有几十亿光年，看起来几乎不动，相比脉冲星要稳定很多。\n关于活动星系核，这段文字没有提及其：","options":{"A":"形成原因","B":"辐射特点","C":"空间运动方式","D":"与地球的距离"},"answer":"C","explanation":"A项，根据“这些天体是星系中心的超大质量黑洞所产生的喷流”可知，“形成原因”文段已提及，排除；\nB项，根据“辐射非常明亮，往往比星系本身的辐射还要强很多”可知，“辐射特点”文段已提及，排除；\nC项，文段并未表明其在空间如何运动，无中生有，当选；\nD项，根据“然而因为这些天体距离地球至少有几十亿光年”可知，“与地球的距离”文段已提及，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明网《星际旅行靠什么导航》","no":38,"missingImage":false},{"type":"question","qid":"4817730","cat":"语句表达","stem":"①数码设备把每一个地点都变成了工位，把每一点时间都变成了工作时间\n②现代人就像转笼里的松鼠，在工作、消费的循环里疲于奔命，筋疲力尽\n③数码设备还把每一个地点都变成了商场，把每一点时间都变成了购物时间\n④互联网和智能手机让沟通即时高效，同时我们丧失了闲适\n⑤过去你可能有想不起要买什么的时刻，现在不会了\n⑥每一样内容里都植入了营销，别人购物发了朋友圈会启发你也想买，社交媒体上大V的“种草”会启发你也想买，还有各种各样的广告\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"②③⑤⑥①④","B":"⑤③⑥①②④","C":"①②④③⑥⑤","D":"④①③⑤⑥②"},"answer":"D","explanation":"观察选项，判断首句。①句指出数码设备把地点变成了工位，把时间变成了工作时间，②句强调现代人像松鼠，忙于工作和消费，④句强调互联网和智能手机让沟通变高效的同时也丧失了闲适，⑤句论述现在我们不会有想不起要买什么的时刻，均可以作首句。\n继续观察，寻找线索。③句出现关联词“还······”，可利用关联词捆绑进行解题，③句之前有①②④⑤四句，①句指出“数码设备把······”，①③两句都在论述互联网把地点和时间变成了什么，可以构成关联词捆绑，对应D项；②④⑤三句均无法与③句构成捆绑，排除A、B、C三项。\n故正确答案为D。\n【文段出处】《互联网消灭的40件事》","no":39,"missingImage":false},{"type":"question","qid":"4817734","cat":"语句表达","stem":"①由于没有必要调查所有的人口，所以统计数字和实际人口数量有很大的差距\n②根据史料推断，中国第一次全国性的人口调查是在秦代完成的\n③中国的原始人口调查始于公元前16世纪的商代，直到公元初才留下全国性的户口数字\n④中国古代的人口调查不同于今天的人口普查，要求查到每一户，每一人\n⑤这就使得相当一部分人口，包括妇女、享有特权的官僚贵族、老人与未成年人等，被排除在调查与统计数字之外\n⑥早先调查户口的主要目的是征收赋税，因而登记的重点只是人口中与征税对象有关的部分\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"②③④⑥①⑤","B":"③⑥①⑤④②","C":"⑥③②①⑤④","D":"④③②⑥⑤①"},"answer":"D","explanation":"观察选项，判断首句。②句论述中国第一次全国性人口调查的时间是秦代，③句论述中国原始人口调查的起源并指出全国性户口数字留下的大致时间是公元初，根据时间和逻辑顺序，应先论述③句再论述②句，故②句不适合作首句，排除A项。\n继续观察，寻找线索。④句提出观点，指出古代的人口调查与今天的人口普查是不同的，⑥句论述早先调查户口的目的，根据逻辑顺序，应先引出话题“古代的人口调查”，再论述其目的和起源时间，故应先论述④句再论述⑥句和③句，锁定D项。\n故正确答案为D。\n【文段出处】《葛剑雄：14亿中国人口从何而来？》","no":40,"missingImage":false},{"type":"question","qid":"4817709","cat":"片段阅读","stem":"向数字经济转型的过程中，处于全球产业链或价值链不同部分的利益会有一定调整，这需要我们正视、对话、协商。包括下一步进入全球数字经济时代，我们还要共同面对技术、伦理的挑战，以及经济发展的变化。当然，个别国家或者利益群体有反弹也很自然，但相信这种高度的全球化，以及科技变革带来的数字化转型应该越来越成为全球的共识。在这个共识基础之上，全球的政策制定者、学界、业界，怎么联合协商，制定一个规则，将是所有人思考的问题。\n关于全球数字经济转型，这段文字中没有提及：","options":{"A":"政策制定者的责任","B":"可以借鉴的历史经验","C":"对不同利益主体的影响","D":"未来发展趋势"},"answer":"B","explanation":"A项，根据“在这个共识基础之上，全球的政策制定者······将是所有人思考的问题”可知，“政策制定者的责任”已提及，排除；\nB项，“可以借鉴的历史经验”文段并未提及，当选；\nC项，根据“个别国家或者利益群体有反弹也很自然”可知，“对不同利益主体的影响”已提及，排除；\nD项，根据“包括下一步进入全球数字经济时代······经济发展的变化”可知，“未来发展趋势”已提及，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《政对面专访陈煜波：数字经济最核心的是数据和人才》","no":41,"missingImage":false},{"type":"question","qid":"4817713","cat":"片段阅读","stem":"珊瑚的每一“树”可能包含着数十万计的微小珊瑚个体。每个珊瑚虫又带有少量的光合藻类，这些藻类为珊瑚提供食物，帮助其保持健康。当水温仅比平常上升几度时，面对环境压力的珊瑚虫会把藻类驱逐出去，先前的整支珊瑚群会变白——这就是珊瑚白化。如果水温不能及时回冷，那么珊瑚可能会死于饥饿或感染。即使珊瑚能逃过一劫，也要耗费约十年时间才能完全复原。\n这段文字意在说明：","options":{"A":"白化是珊瑚主动应对环境压力的结果","B":"光合藻类对于珊瑚保持健康至关重要","C":"珊瑚礁是一个复杂又脆弱的生态群落","D":"海洋升温对珊瑚的生存产生严重威胁"},"answer":"D","explanation":"文段开篇引出话题，介绍了珊瑚如何保持健康，接着介绍水温升高时珊瑚虫会驱逐海藻，造成珊瑚白化，随后介绍若不能及时降温，珊瑚则会死亡，尾句强调即使珊瑚没有死亡，也要耗费很长时间才能复原。故文段主要围绕着“水温升高”和“珊瑚”展开论述，意在说明水温升高对珊瑚的严重影响，对应D项。\nA项，珊瑚白化为水温升高对珊瑚的影响之一，表述片面，且“环境压力”范围扩大，排除；\nB项，对应文段话题引入部分的内容，非重点，排除；\nC项，缺少文段主题词“水温”，偏离文段核心话题，排除。\n故正确答案为D。\n【文段出处】《珊瑚礁白化已经快到恢复不过来的程度了》","no":42,"missingImage":false},{"type":"question","qid":"4817720","cat":"片段阅读","stem":"仔细研究各地那些消失的地方特色美食、知名老店，我们会发现很多美味不是消失于“市场的选择”，而是在动迁中无法接续。对城市来说，不能只有看得见的光鲜和便于量化的经济增长指标，更需要有市井的味道、城市的记忆、百姓的情感。如何避免“改造对城市文化记忆的打断”，是摆在中国众多城市治理者面前的一个共同课题。在两难中谋取两全，兼顾城市繁华与人间烟火味，更需要制度的温情和治理的智慧。\n最适合做这段文字标题的是：","options":{"A":"城市管理两难，还需争取两全","B":"市场选择与城市文化的传承","C":"市井的味道，城市的记忆","D":"城市变迁中的地方美食"},"answer":"A","explanation":"文段开篇指出，城市中的很多“美味”因动迁而无法接续。随后指出，在城市的发展中“文化记忆接续”和“经济增长”同等重要，城市治理者应在二者的“两难”之间寻求“两全”。尾句提出对策，强调应以“制度的温情和治理的智慧”在“城市繁华”和“人间烟火味”的“两难”中“谋取两全”。故文段重点围绕如何使城市管理的“两难”能够“两全”展开论述，对应A项。\nB项，文段重点强调的是如何让“经济”和“文化”两全，而非“传承”，排除；\nC项，偏离文段核心话题，文段重点探讨的是“如何进行两全的城市治理”，“市井味道”只是其中一个方面，表述片面，排除；\nD项，“地方美食”仅对应文段开头话题引入部分的内容，仅仅是“城市文化记忆”中的个例，非重点，排除。\n故正确答案为A。\n【文段出处】《破解两难，还需争取“两全”》","no":43,"missingImage":false},{"type":"question","qid":"4817725","cat":"片段阅读","stem":"儿童学习语言主要依靠内隐的语言习得机制，需要长期大量的语言输入和练习才能取得好的效果。而年龄较大的外语学习者，因其认知能力方面的优势，表现往往优于年龄较小者。一项长达7年的研究发现了正规课堂中年龄因素对外语学习的影响：在接受了同样时间的语言教学之后，年龄较大的学习者成绩优于年龄较小者，特别是在语言的形态、句法特征掌握方面表现尤为突出。这就说明，在课堂学习环境下，儿童并不具备明显的低龄优势，如果没有大量的语料输入和练习，即使很早接触外语学习，也很难获得母语那样的水平。\n这段文字最可能回答的问题是：","options":{"A":"年龄因素对外语学习会产生哪些影响","B":"是否应该让儿童尽早在课堂学习外语","C":"成年人外语课堂学习表现为何优于儿童","D":"学习者在外语学习中受哪些因素的影响"},"answer":"B","explanation":"文段开篇指出，儿童学习语言需要大量的语言输入和练习才能取得好的效果，但年纪较大的外语学习者由于认知能力方面的优势，表现往往会优于年龄较小者。接下来通过一个研究实验证实了这一观点。尾句通过“这就说明”进行总结，再次强调儿童学习外语时，并不具备明显的低龄优势。故文段围绕“儿童学习外语”和“年龄因素”展开，最可能回答的问题为儿童学习外语是否应该越早越好，对应B项。\nA项，“哪些影响”表述不明确，且未提及文段核心话题“儿童”，排除；\nC项，“成年人”偏离了文段的核心话题，文段重点讨论的是“儿童学习外语”，排除；\nD项，文段仅讨论年龄因素的影响，未涉及其他因素，且缺少文段核心话题“儿童”，排除。\n故正确答案为B。\n【文段出处】《学外语并非越早越好——从语言习得研究看儿童的外语学习》","no":44,"missingImage":false},{"type":"question","qid":"4817728","cat":"片段阅读","stem":"在科学研究中，同样的研究得到不同的结果，很正常，很普遍。生命科学目前还停留在实验科学阶段，由于实验条件、样品、动物、仪器设备、实验技术略有不同而得到完全不同的结果，也不意外。如果遇到这种情况，互相指责、争论或者装作漠不关心，都是错误而且缺乏远见的。从个人事业看，这种做法会损害一个人在学术领域内的名声和信誉；如果作为导师，还会误导学生在未来学术发展中的判断，甚至影响他们的人生观。从社会的角度来看，如果利用错误的实验结果获得风险投资并针对疾病开发治疗药物，则是对宝贵社会资源的巨大浪费。\n这段文字意在讨论：","options":{"A":"生命科学研究为什么具有特殊性","B":"科学家保持严谨求实精神很重要","C":"用正确态度与方法面对学术争议","D":"可靠的实验流程有哪些现实意义"},"answer":"C","explanation":"文段开篇指出同样的科学研究得出不同结果是很正常的，并指出在生命科学中由于一些因素出现这种情况也不意外，接着通过反面提对策，指出面对这种学术争议，不能采取互相指责、争论或者装作漠不关心等错误的态度与方法，随后通过个人和社会的角度对前文观点进行论证，故文段强调要用正确态度与方法面对学术争议，对应C项。\nA项，“生命科学研究为什么具有特殊性”文段并未提及，无中生有，排除；\nB项，文段重点围绕遇到学术争议应该如何处理展开论述，该项偏离文段核心话题，且“严谨求实精神”文段并未提及，无中生有，排除；\nD项，“实验流程”文段并未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】《真假难辨的“神经再生”，科学争议该如何解决？》","no":45,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"4817761","cat":"数学运算","stem":"工厂甲、乙、丙3条生产线共同完成一项任务，甲、丙先合作两天，完成了全部任务的\u003cimg data-k=\"3a9dc4442269\">，接着乙、丙合作两天完成剩下任务的45%，最后甲、乙合作两天恰好完成剩余任务。问甲完成的部分占全部任务的：","options":{"A":"\u003cimg data-k=\"cbfc83d2e15e\">","B":"\u003cimg data-k=\"3a9dc4442269\">","C":"\u003cimg data-k=\"ea3b0e6d4e48\">","D":"\u003cimg data-k=\"d0daeb4b1a91\">"},"answer":"C","explanation":"赋值全部任务为60，根据题意可列式：\u003cimg data-k=\"3f52e0a9bd2b\">，\u003cimg data-k=\"008def8b5547\">\u003cimg data-k=\"5088f9061766\">，\u003cimg data-k=\"221aaeb3ad3f\">\u003cimg data-k=\"014c9e9ff20a\">。化简可得：甲+丙=10······①，乙+丙=9······②，甲+乙=11······③。①+②+③可得：2甲+2乙+2丙=30，即甲+乙+丙=15，结合②可得：甲=6。甲总共工作了2+2=4天，故甲完成的部分占全部任务的\u003cimg data-k=\"aae8de8776ac\">。\n故正确答案为C。","no":46,"missingImage":false},{"type":"question","qid":"4817768","cat":"数学运算","stem":"甲、乙两辆货车同时从A地出发，到B地后立即卸载货物，并返回A地装运货物，如此往返两个来回。已知，A、B两地相距30千米，甲、乙两辆货车的速度分别为100千米/小时和80千米/小时。如装运、卸载货物时间忽略不计，问在整个过程中甲、乙两辆货车最远相距多少千米?","options":{"A":"18","B":"20","C":"24","D":"30"},"answer":"C","explanation":"甲、乙两辆货车的最远距离应出现在速度较快的甲货车到达A地或B地时，两辆货车均往返两个来回，两辆货车间的距离如下表：\n\u003cimg data-k=\"33ad8f456ca6\" style=\"max-width:587px\">\n通过上表可知，甲、乙两辆货车的最远距离出现在甲货车第二次返回A地时，此时两辆货车间的距离为24千米。\n故正确答案为C。","no":47,"missingImage":false},{"type":"question","qid":"4817771","cat":"数学运算","stem":"某共享汽车公司年初购入一批二手电动汽车，每台16200元。第一年每台电动汽车的维护费用为1100元，以后每年增加400元，每台电动汽车每年可产生收益9100元。问在第几年时，单台汽车扣除购置和维护成本后产生的利润将超过2万元?","options":{"A":"5","B":"6","C":"7","D":"8"},"answer":"B","explanation":"设第n年时，单台汽车扣除购置和维护成本后产生的利润将超过2万元，根据等差数列公式：\u003cimg data-k=\"3fa01e6c705b\">，可得第n年时电动汽车维护费用=1100+（n-1）×400=400n+700，根据等差数列求和公式\u003cimg data-k=\"71a21354f219\">可得，第n年时电动汽车总维护费用为\u003cimg data-k=\"ae2ff649bb72\">\u003cimg data-k=\"4333df5f79aa\">。根据：收入-成本=利润，则有\u003cimg data-k=\"97b1b7f579d2\">\u003cimg data-k=\"0ab504433322\">，计算较繁琐，考虑将选项由小到大进行代入排除：\n代入A项：n=5，9100×5-（200×25+900×5）-16200=19800＜20000，排除；\n代入B项：n=6，9100×6-（200×36+900×6）-16200=25800＞20000，符合题意。\n则第6年时，单台汽车扣除购置和维护成本后产生的利润将超过2万元。\n\n故正确答案为B。","no":48,"missingImage":false},{"type":"question","qid":"4817781","cat":"数学运算","stem":"企业销售甲、乙、丙三种不同的机械，单价分别为33万元、17万元和13万元，某月三种设备共销售53台，甲设备的销量是丙设备的3倍，且乙设备的销售额比甲、丙设备的销售额之和高1万元，问当月，丙设备的销售额比乙设备少多少万元？","options":{"A":"385","B":"415","C":"466","D":"496"},"answer":"D","explanation":"设甲、乙、丙设备的销量分别为3x台、y台、x台。\n方法一：根据题意，可列方程组：\u003cimg data-k=\"69505db9477f\">，①×17+②，解得x=5，y=33。因此当月丙设备的销售额比乙设备少17y-13x=17×33-13×5=496万元。\n方法二：根据“乙设备的销售额比甲、丙设备的销售额之和高1万元”整理可得：乙设备销售额-丙设备销售额=甲设备销售额+1=33×3x+1=（99x+1）万元，即（题干所求值-1）为99的整数倍，只有D项符合。\n故正确答案为D。","no":49,"missingImage":false},{"type":"question","qid":"4817784","cat":"数学运算","stem":"石雕厂有48个石质圆柱要发往外地。这些圆柱的底面直径均为1.5米，其中30个石柱高0.8米，18个石柱高0.6米。该厂租用的运输车辆除去固定桩之后，可用的空间长3米，宽1.5米。为保证安全，圆柱只能底面朝下堆放，且堆叠高度不得超过2米。问一次性运完这些圆柱，至少需要租用几辆运输车辆？","options":{"A":"9","B":"10","C":"11","D":"12"},"answer":"B","explanation":"根据题意可知，两种石柱的底面直径均为1.5米，则在长3米，宽1.5米的空间中第一层只能并排放2个石柱。要想最后需要的运输车辆尽可能的少，则一辆车中堆叠的石柱的层数应尽可能的多，根据题干“堆叠高度不得超过2米”，则一辆车中最多只能堆叠3层，且保证尽可能多的车堆叠的高度尽可能的高。两种石柱的堆叠情况及需要的车辆如下表所示：\n\u003cimg data-k=\"f5f5893c6e37\" style=\"max-width:583px\">\n则至少需要租用10辆运输车辆。\n故正确答案为B。","no":50,"missingImage":false},{"type":"question","qid":"4817751","cat":"数学运算","stem":"某网店同时针对A、B两种商品开展促销活动，A商品只按组销售，每组的价格保持10元不变，但每组商品由4件增加到5件；B商品的优惠活动则为买一送一。张某以55元的价格购买了原价总计80元的A、B商品各若干件，其中A商品的件数为B商品的2倍。问B商品原价为多少元/件？","options":{"A":"1.5","B":"2","C":"2.5","D":"3"},"answer":"D","explanation":"设B商品原价为x元/件，B商品购买了n件，则A商品购买了2n件。根据题意可列方程：\u003cimg data-k=\"e881030425b4\">，联立①②，解得x=3，n=10，即B商品原价为3元/件。\n故正确答案为D。","no":51,"missingImage":false},{"type":"question","qid":"4817754","cat":"数学运算","stem":"小王打算从6月某日开始每天进行在线学习，每3天学习一次语文，每4天学习一次数学，每5天学习一次外语。已知小王8月13日学习语文，8月14日学习数学，8月15日学习外语。问他是从6月哪一天开始第一次学习的？","options":{"A":"6月12日","B":"6月13日","C":"6月14日","D":"6月15日"},"answer":"C","explanation":"“每3天学习一次语文，每4天学习一次数学，每5天学习一次外语”，说明小王同时学习三科的循环周期为3、4、5的最小公倍数，即60天。小王8月13日学习语文，8月14日学习数学，8月15日学习外语，可得出8月10日小王刚好三科都学习了。8月10日再往前推一个循环周期（60天）也是三科都学习的一天。\n从8月10日往前推，8月已有9天，7月已有31天，还需往前推60-9-31=20天，可列式30-20+1=11，即6月11日应该三科都学习。\n但没有对应选项，则按该时间往后推即可。按照“每3天学习一次语文，每4天学习一次数学，每5天学习一次外语”可以推出，小王6月14日学习语文，6月15日学习数学，6月16日学习外语，所以第一次学习是6月14日。\n故正确答案为C。","no":52,"missingImage":false},{"type":"question","qid":"4817762","cat":"数学运算","stem":"在一块边长为8米的正方形草坪上架设了5个自动洒水器，洒水器的洒水半径为2米（如图所示）。问草坪上同时被两个洒水器洒到水的区域（灰色）面积比没有洒到水的区域（黑色）面积：\n\u003cimg data-k=\"5aa90d94d540\" style=\"max-width:337px\">","options":{"A":"小不到5平方米","B":"小5平方米以上","C":"大不到5平方米","D":"大5平方米以上"},"answer":"A","explanation":"设同时被两个洒水器洒到水的区域（灰色）面积为X平方米（以下称灰色区域）。根据题意，正方形草坪边长为8米，洒水器的洒水半径为2米，可得该正方形草坪面积为8×8=64平方米，每个洒水器洒水的面积为\u003cimg data-k=\"4a1de8efad9b\">平方米。分析图形交叉关系可知，没有洒到水的区域（黑色）面积=正方形草坪面积-（5个洒水器洒水区域总面积-灰色区域面积）\u003cimg data-k=\"c6f01e69a292\">平方米。则灰色区域面积减去黑色区域面积的差值为\u003cimg data-k=\"22f06cebbfcb\">\u003cimg data-k=\"9d5b2e21448b\">平方米，即小不到5平方米。\n故正确答案为A。","no":53,"missingImage":false},{"type":"question","qid":"4817766","cat":"数学运算","stem":"将A、B两个工程交给甲、乙两个工程队实施，已知A工程甲、乙合作需14小时完成，甲单独需18小时完成；B工程甲、乙合作需18小时完成，乙单独需30小时完成。问如两个工程队同时开始工作且在完成所有工程之前中途不休息，则完成时间最长和最短的实施方案，完成时间相差：","options":{"A":"不到10小时","B":"10~15小时之间","C":"15~20小时之间","D":"超过20小时"},"answer":"D","explanation":"赋值A工程的工程总量为14和18的最小公倍数126，则甲完成A工程的效率为\u003cimg data-k=\"cfca480c68b2\">，甲和乙完成A工程的效率和为\u003cimg data-k=\"5d866f891f8d\">，则乙完成A工程的效率为9-7=2；\n赋值B工程的工程总量为18和30的最小公倍数90，则乙完成B工程的效率为\u003cimg data-k=\"5c58136c50f6\">，甲和乙完成B工程的效率和为\u003cimg data-k=\"55673bf0a716\">，则甲完成B工程的效率为5-3=2。\n则根据甲、乙两个工程队各自完成A、B工程的效率列表如下：\n\u003cimg data-k=\"33c385843d30\" style=\"max-width:700px\">\n因此甲完成A工程的效率更高，乙完成B工程的效率更高。\n若想要完成时间最短，优先让甲做A工程，乙做B工程。甲单独完成A工程需要18小时，此时B工程已被乙完成的工程量为18×3=54，B工程剩下90-54=36的工程量由甲、乙共同完成，还需要\u003cimg data-k=\"656e83a43500\">小时，因此完成这两项工程最少需要18+7.2=25.2小时；\n若想要完成时间最长，则考虑先让甲做B工程，乙做A工程。甲单独完成B工程需要\u003cimg data-k=\"a8a628a88e75\">小时，乙单独完成A工程需要\u003cimg data-k=\"ef0982a85575\">小时，故甲单独完成B工程后去帮助乙，当甲完成B工程时，此时A工程已被乙完成的工程量为45×2=90，A工程剩下126-90=36的工程量由甲、乙共同完成，还需要\u003cimg data-k=\"d64487879385\">小时，因此完成这两项工程最多需要45+4=49小时。\n则完成时间最长和最短的实施方案，完成时间相差49-25.2=23.8小时，则完成时间相差超过20小时。\n故正确答案为D。","no":54,"missingImage":false},{"type":"question","qid":"4817770","cat":"数学运算","stem":"某科考队由A、B研究所分别抽调5人，C、D研究所分别抽调7人组成，从每个研究所抽调的人员中，男性均比女性多1人。现将整个科考队分成勘探、化验两个小组，要求每个小组中均包含4个研究所的人且来自任意2个研究所的人数都不相同。问化验小组最少有几名男性成员？","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"B","explanation":"根据题意，各研究所人数情况如下图所示：\n\u003cimg data-k=\"db8afbb427cd\" style=\"max-width:700px\">\n若要求每个小组中均包含4个研究所的人且来自任意2个研究所的人数都不相同，同时化验小组男性成员人数最少，则先考虑化验小组总人数最少的情况，即化验小组为1+2+3+4=10人。\n经过列举，满足人数要求且化验小组男性成员最少的情况如下图所示：\n\u003cimg data-k=\"8f8fef59bc17\" style=\"max-width:700px\">\n则化验小组来自A、B、C、D四个研究所的男性成员人数最少分别为0、1、0、1人，所以化验小组最少有男性成员人数为0+1+0+1=2人。\n故正确答案为B。","no":55,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"4818046","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"b4dac9d7f3ef\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题元素组成不同，无明显属性规律，考虑数量规律。观察发现，题干图形中出现单一曲线、多边形，考虑线的数量。题干图形中既有曲线又有直线，考虑曲线和直线分开去数。题干图形中曲线数量依次为：1、2、3、4、？，所以？处图形的曲线数为5；直线数量依次为：12、11、10、9、？，所以？处图形的直线数为8。只有C项符合。\n故正确答案为C。","no":56,"missingImage":false},{"type":"question","qid":"4818261","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"a4b22bee1702\" style=\"max-width:594px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"解析一：元素组成相同，优先考虑位置规律。观察题干图形发现，图1所有黑球沿如图所示方向往左下方移动一格后得图2。\n\u003cimg data-k=\"535eeb7ce157\" style=\"max-width:600px\">\n图2所有黑球沿如图所示方向往右下方移动一格后得图3。\n\u003cimg data-k=\"9ba135ce9bd0\" style=\"max-width:600px\">\n图3所有黑球沿如图所示方向往左下方移动一格后得图4。\n\u003cimg data-k=\"22a347377daa\" style=\"max-width:600px\">\n图4所有黑球沿如图所示方向往右下方移动一格后得图5。\n\u003cimg data-k=\"9a22f3271d1b\" style=\"max-width:600px\">\n图5所有黑球沿如图所示方向往左下方移动一格后得？处图形，只有C项符合。\n\u003cimg data-k=\"d8bd409995bd\" style=\"max-width:600px\">\n解析二：元素组成相同，优先考虑位置规律。相邻比较发现，每相邻的两幅图都有一部分区域黑白球位置摆放相同，以此类推，？处应选择一个和图5拥有一部分区域黑白球位置摆放相同的，只有C项符合。\n\u003cimg data-k=\"d99cbf91ad51\" style=\"max-width:600px\">\n故正确答案为C。","no":57,"missingImage":false},{"type":"question","qid":"4818181","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"605795a937d6\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，无明显属性规律，考虑数量规律。观察发现，图一、图二和图五都存在多端点图形，可以考虑笔画数。题干图形均为一笔画，所以？处图形也应该是一笔画。A项两笔画，B项两笔画，C项两笔画，D项一笔画。只有D项满足规律。\n故正确答案为D。","no":58,"missingImage":false},{"type":"question","qid":"4818064","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的—个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"3350b9d8e60f\" style=\"max-width:393px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"每行图形元素形状相同，优先考虑位置规律。观察发现，第一行中，图1左右翻转得到图2，线条不变，黑白颜色互换；图2到图3位置不变，实线变成虚线，黑白颜色互换。第二行中，图1沿着直线方向翻转得到图2，线条不变，黑白颜色互换；图2到图3位置不变，实线变成虚线，黑白颜色互换。第三行中，图1沿着直线方向翻转得到图2，线条不变，黑白颜色互换；图2到图3位置不变，实线变虚线，黑白颜色互换，只有A项符合。\n故正确答案为A。","no":59,"missingImage":false},{"type":"question","qid":"4818018","cat":"图形推理","stem":"右边四个图形中，只有一个是由左边的两个图形组合（只能通过上、下、左、右平移、在平面上旋转、重叠覆盖）而成的，请把它找出来：\n\u003cimg data-k=\"814caac27c9b\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查平面拼合。将题干图1顺时针旋转\u003cimg data-k=\"c16e5a8b3239\">后的图形与图2逆时针旋转\u003cimg data-k=\"c16e5a8b3239\">后的图形进行拼合，即可得到B项。\n故正确答案为B。","no":60,"missingImage":false},{"type":"question","qid":"4818019","cat":"图形推理","stem":"下图为同样大小的18个白色正方体和3个灰色正方体堆叠而成的多面体正视图和后视图。该多面体可拆分为①、②、③和④共4个多面体的组合，下列哪一项能填入问号处？\n\u003cimg data-k=\"4c122f6743cf\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查立体拼合，如下图所示，立体图可以由①、②、③以及A项拼合而成。\n\u003cimg data-k=\"f80b96fd5c7b\" style=\"max-width:400px\">\n故正确答案为A。","no":61,"missingImage":false},{"type":"question","qid":"4817922","cat":"定义判断","stem":"反向社会化是一种文化反哺现象，指的是年轻一代用新知识、新观念影响前辈，使得前辈掌握新技能、新理念或者改变原有生活习惯的过程。\n根据上述定义，下列没有构成反向社会化的是：","options":{"A":"在小李反复介绍“断舍离”的理念后，父母终于开始整理丢弃长久不用的物品","B":"小王教会母亲使用微信以后，母亲每天都在使用微信和老友进行沟通","C":"小张教会姥姥电子支付以后，老人终于可以不带现金出门了","D":"小赵送给父亲的65岁生日礼物是一次为期20天的新疆游"},"answer":"D","explanation":"第一步：找出定义关键词。\n“年轻一代用新知识、新观念影响前辈”、“前辈掌握新技能、新理念或者改变原有生活习惯”。\n第二步：逐一分析选项。\nA项：小李向父母介绍“断舍离”的理念，符合“年轻一代用新知识、新观念影响前辈”，父母开始整理丢弃长久不用的物品，符合“前辈掌握新技能、新理念，或者改变原有生活习惯”，符合定义，排除；\nB项：小王教母亲使用微信，符合“年轻一代用新知识、新观念影响前辈”，母亲学会使用微信后，每天使用微信和老友沟通，符合“前辈掌握新技能、新理念，或者改变原有生活习惯”，符合定义，排除；\nC项：小张教姥姥使用电子支付，符合“年轻一代用新知识、新观念影响前辈”，姥姥学会电子支付后，可以不带现金出门，符合“前辈掌握新技能、新理念，或者改变原有生活习惯”，符合定义，排除；\nD项：小赵送给父亲一次为期20天的新疆游，没有涉及小赵对父亲技能或观念的影响，也没有体现父亲掌握了新技能、新理念，不符合“年轻一代用新知识、新观念影响前辈”、“前辈掌握新技能、新理念或者改变原有生活习惯”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":62,"missingImage":false},{"type":"question","qid":"4817898","cat":"定义判断","stem":"过失投放危险物质罪是指行为人对其行为可能引起中毒，造成危害公共安全的严重后果已经预见，而轻信能够避免，或者对这种严重后果应当预见，由于疏忽大意没有预见，以致发生了严重的中毒事故，造成严重结果危害不特定多数人的生命、健康和重大公私财产安全的行为。\n根据上述定义，下列不可能构成过失投放危险物质罪的是：","options":{"A":"甲误将有毒废弃物品倒入村里池塘中，致使村中牲畜饮用后中毒","B":"乙将喷过敌敌畏但未冲洗干净的蔬菜拿到集市上售卖，致多名购买者中毒","C":"丙误将氰化钾当作药品拿给村民张某和王某服用，导致张某和王某死亡","D":"丁将数个含有毒鼠强的番薯埋在田里毒野猪，同村魏某在不知情的情况下，将这些番薯挖回煮食，导致一家三口两人死亡，一人重伤"},"answer":"C","explanation":"第一步：找出定义关键词。\n“其行为可能引起中毒”、“造成危害公共安全的严重后果已经预见，而轻信能够避免”、“对这种严重后果应当预见，由于疏忽大意没有预见”、“发生了严重的中毒事故”、“危害不特定多数人的生命、健康和重大公私财产安全”。\n第二步：逐一分析选项。\nA项：甲误将有毒废弃物品倒入村里池塘中，说明其行为有可能会引起中毒，但甲有所疏忽，符合“其行为可能引起中毒”、“对这种严重后果应当预见，由于疏忽大意没有预见”，致使村中牲畜饮用后中毒，牲畜属于村民财产，即说明甲的行为危害了多数村民的公私财产安全，符合“发生了严重的中毒事故”、“危害不特定多数人的生命、健康和重大公私财产安全”，对应下图中原文标蓝处，符合定义，排除；\nB项：乙的蔬菜上的敌敌畏没有冲洗干净就售卖，说明其行为有可能会引起中毒，但乙有所疏忽，符合“其行为可能引起中毒”、“对这种严重后果应当预见，由于疏忽大意没有预见”，蔬菜购买者是随机的，多名购买者中毒说明出现了严重的中毒事故且危害了其生命健康，符合“发生了严重的中毒事故”、“危害不特定多数人的生命、健康和重大公私财产安全”，对应下图中原文标红处，符合定义，排除；\nC项：氰化钾为剧毒物质，丙误将其拿给村民张某和王某服用，张某和王某属于特定的人，不符合“危害不特定多数人的生命、健康和重大公私财产安全”，不符合定义，对应下图中原文标黄处，应属于过失致人死亡罪，不符合定义，当选；\nD项：丁将有毒的番薯埋在田里毒野猪，说明其行为有可能会引起中毒，但丁有所疏忽，符合“其行为可能引起中毒”、“对这种严重后果应当预见，由于疏忽大意没有预见”，挖出番薯的人是随机的，且食用后致两人死亡、一人重伤，说明出现了严重的中毒事故且危害了生命健康，符合“发生了严重的中毒事故”、“危害不特定多数人的生命、健康和重大公私财产安全”，符合定义，排除。\n本题为选非题，故正确答案为C。\n定义原文：\n\u003cimg data-k=\"e7616e14a0d4\" style=\"max-width:700px\">","no":63,"missingImage":false},{"type":"question","qid":"4817883","cat":"定义判断","stem":"逆境胁迫记忆是指植株为适应复杂多变的自然环境而进化出的许多适应策略。即经过前期适度的非生物逆境干预处理后，对再次发生的逆境胁迫表现出较强的抗性或耐性。\n根据上述定义，下列涉及逆境胁迫记忆的是：","options":{"A":"木豆受病原菌侵染部位的水杨酸含量显著升高，从而提高植物抗病性","B":"蘑菇被老鼠等啮齿类动物啃食过的部位，其生长素的积累会更加明显","C":"玉米营养生长周期历经多次渍水锻炼，可缓解后期渍害造成的产量损失","D":"农民在冬季用石磙子碾压麦苗抑制小麦生长过旺，最终可提高小麦产量"},"answer":"C","explanation":"第一步：找出定义关键词。\n“植株”、“经过前期适度的非生物逆境干预处理”、“对再次发生的逆境胁迫表现出较强的抗性或耐性”。\n第二步：逐一分析选项。\nA项：受病原菌侵染，不符合“经过前期适度的非生物逆境干预处理”，不符合定义，排除；\nB项：被老鼠等啮齿类动物啃食，不符合“经过前期适度的非生物逆境干预处理”，不符合定义，排除；\nC项：玉米历经多次渍水锻炼，符合“植株”、“经过前期适度的非生物逆境干预处理”，缓解后期渍害造成的产量损失，符合“对再次发生的逆境胁迫表现出较强的抗性或耐性”，符合定义，当选；\nD项：用石磙子碾压麦苗，符合“植株”、“经过前期适度的非生物逆境干预处理”，抑制小麦生长过旺，最终可提高小麦产量，不符合“对再次发生的逆境胁迫表现出较强的抗性或耐性”，不符合定义，排除。\n故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"4817829","cat":"定义判断","stem":"同侪效应是指具有相似特征、地位的个体或组织在行动决策上呈现出的某种交互影响的现象，其实现方式和手段的相近性，往往使得同侪比其他群聚对个体或组织的观点、行为具有更强的正向塑造功效。\n根据上述定义，下列属于同侪效应的是：","options":{"A":"青少年沉迷电子游戏，相当一部分原因是由于同伴之间相互模仿与攀比所造成的","B":"讯狗公司高薪聘请的刘工程师，入职后组建了新的研发团队，短时间内就取得了巨大成绩","C":"某高校通过开展老中青“传帮带”业务提升模式，快速提高了青年教师的教学水平及科研能力","D":"“新知”读书会的同学们每天相互监督读书打卡，结果这些同学取得的成绩远远优于其他同学"},"answer":"D","explanation":"第一步：找出定义关键词。\n“具有相似特征、地位的个体或组织”、“在行动决策上呈现出的某种交互影响”、“同侪比其他群聚对个体或组织的观点、行为具有更强的正向塑造功效”。\n第二步：逐一分析选项。\nA项：青少年沉迷电子游戏不是正向的行为，不符合“同侪比其他群聚对个体或组织的观点、行为具有更强的正向塑造功效”，不符合定义，排除；\nB项：刘工程师入职后组建了新的研发团队，不清楚研发团队成员是否为具有相似特征、地位的个体，不符合“具有相似特征、地位的个体或组织”，也未体现成员之间的交互影响，不符合“在行动决策上呈现出的某种交互影响”，不符合定义，排除；\nC项：老中青“传帮带”业务涉及不同年龄层的群体，不符合“具有相似特征、地位的个体或组织”，不符合定义，排除。\nD项：“新知”读书会的同学们，符合“具有相似特征、地位的个体或组织”，他们每天相互监督读书打卡，结果取得的成绩远优于其他同学，符合“在行动决策上呈现出的某种交互影响”、“同侪比其他群聚对个体或组织的观点、行为具有更强的正向塑造功效”，符合定义，当选。\n故正确答案为D。","no":65,"missingImage":false},{"type":"question","qid":"4818003","cat":"定义判断","stem":"内源化学物是指机体内原已存在的和代谢过程中所形成的产物或中间产物。外源化学物是指自然界存在着的或人工合成的各种具有生物活性（即可在生物组织上诱发生物反应、化学反应）的物质。\n根据上述定义，下列说法正确的是：","options":{"A":"医生开具的治疗肺结核的药物属于内源化学物","B":"为增加粘度，在酸奶制作过程中添加的增稠剂属于内源化学物","C":"十字花科植物的细胞在降解时产生了具有芥末味道的芥子油苷，这属于内源化学物","D":"受长期食物匮乏影响，鸟类体内的血浆皮质酮水平缓慢上升，并维持在较高水平，这属于外源化学物"},"answer":"C","explanation":"第一步：找出定义关键词。\n内源化学物：“机体原有和代谢过程中形成的产物或中间产物”；\n外源化学物：“自然界存在或人工合成的具有生物活性（即可在生物组织上诱发生物反应、化学反应）的物质”。\n第二步：逐一分析选项。\nA项：医生开具的治疗肺结核的药物，符合“自然界存在或人工合成的具有生物活性（即可在生物组织上诱发生物反应、化学反应）的物质”，符合“外源化学物”定义，不符合“内源化学物”定义，排除；\nB项：为增加粘度，在酸奶制作过程中添加的增稠剂，符合“自然界存在或人工合成的具有生物活性（即可在生物组织上诱发生物反应、化学反应）的物质”，符合“外源化学物”定义，不符合“内源化学物”定义，排除；\nC项：十字花科植物的细胞在降解时产生了芥子油苷，符合“机体原有和代谢过程中形成的产物或中间产物”，符合“内源化学物”定义，当选；\nD项：鸟类体内的血浆皮质酮，符合“机体原有和代谢过程中形成的产物或中间产物”，符合“内源化学物”定义，不符合“外源化学物”定义，排除。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"4817899","cat":"定义判断","stem":"专业化营销策略是在选择目标市场时，企业选择若干细分市场进行专业化经营的策略。一般分为产品专业化、市场专业化和有选择的专业化三种。产品专业化指公司提供同一类产品或服务，以满足各种不同的市场需求；市场专业化指为某个特定的顾客群提供多样化的产品、服务或解决方案；有选择的专业化则以细分市场的吸引力为标准选择多个细分市场，但各细分市场之间可能关联较小。\n根据上述定义，下列属于有选择的专业化营销策略的是：","options":{"A":"公司着力向全国医药市场推广某种冠心病药品","B":"公司专注营销少年儿童学习、娱乐等系列产品","C":"公司瞄准职业男装和学龄儿童童鞋市场开展营销","D":"公司集中精力于边远农村家电市场的开拓与营销"},"answer":"C","explanation":"第一步：找出定义关键词。\n专业化营销策略：“企业“、“选择若干细分市场进行专业化经营”；\n产品专业化：“提供同一类产品或服务”、“满足各种不同的市场需求”；\n市场专业化：“为某个特定的顾客群”、“提供多样化的产品、服务或解决方案”；\n有选择的专业化：“以细分市场的吸引力为标准”、“选择多个细分市场”、“各细分市场之间可能关联较小”。\n第二步：逐一分析选项。\nA项：向全国医药市场推广某种冠心病药品，只涉及医药市场，不符合“选择多个细分市场”，不符合有选择的专业化营销策略的定义，排除；\nB项：专注营销少年儿童学习、娱乐等系列产品，均是针对少年儿童，相互之间存在关联，不符合“各细分市场之间可能关联较小”，不符合有选择的专业化营销策略的定义，排除；\nC项：公司，符合“企业”，瞄准职业男装和学龄儿童童鞋市场，符合“选择多个细分市场”，也符合“各细分市场之间可能关联较小”，符合有选择的专业化营销策略的定义，当选；\nD项：边远农村家电市场的开拓与营销，只涉及边远农村家电市场，不符合“选择多个细分市场”，不符合有选择的专业化营销策略的定义，排除。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"4818012","cat":"定义判断","stem":"食品安全风险评估指科学评估食品、食品添加剂及食品相关产品中的生物性、化学性和物理性危害对人体健康造成不良影响的可能性及其程度，该评估包括危害识别、危害特征描述、暴露评估、风险特征描述等内容。\n根据上述定义，下列不属于食品安全风险评估范围的是：","options":{"A":"某地消费者投诉超市售卖的酱油中防腐剂含量超标，要求主管部门进行核查","B":"为了增加啤酒的口感和风味，某啤酒生产厂家在其中添加了果胶","C":"食品包装企业创新性地使用了一种新型材料来生产食品外包装箱","D":"某地因为土壤原因，所种植加工的大米中某重金属元素含量超标"},"answer":"C","explanation":"第一步：找到定义关键词。\n“科学评估食品、食品添加剂及食品相关产品中的生物性、化学性和物理性危害”、“对人体健康造成不良影响的可能性及其程度”、“包括危害识别、危害特征描述、暴露评估、风险特征描述等”。\n第二步：逐一分析选项。\nA项：消费者投诉酱油里防腐剂含量超标，符合“科学评估食品添加剂中的化学性危害”，含量超标的防腐剂有可能危害健康，符合“对人体健康造成不良影响的可能性及其程度”，符合食品安全风险评估范围，排除；\nB项：啤酒生产厂家在啤酒里添加果胶，果胶是一种天然食品添加剂，符合“科学评估食品添加剂中的化学性危害”，为了增加啤酒的口感和风味而选择添加果胶，符合“对人体健康造成不良影响的可能性及其程度”，符合食品安全风险评估范围，排除；\nC项：食品包装企业使用新型材料来生产的是外包装箱，不是食品本身，不符合“科学评估食品、食品添加剂及食品相关产品中的生物性、化学性和物理性危害”，不符合食品安全风险评估范围，当选；\nD项：种植加工的大米中某重金属元素含量超标，符合“科学评估食品中的物理性危害”，重金属元素含量超标可能危害人体健康，符合“对人体健康造成不良影响的可能性及其程度”，符合食品安全风险评估范围，排除。\n本题为选非题，故正确答案为C。","no":68,"missingImage":false},{"type":"question","qid":"4817984","cat":"定义判断","stem":"固定行为型是动物按一定时空顺序进行的躯体活动，表现为一定的运动形式并能达到特定的生物学目的。这一行为是被一定的外部刺激引发的，一旦引发就会自动完成而不需要继续给予外部刺激。\n根据上述定义，下列不属于固定行为型的是：","options":{"A":"青蛙发现前方弹舌可及的飞虫后，舌头迅速弹出，随后缩回","B":"工蜂发现蜜源后，到密集的蜂群中，一边激烈地振动着腹部，一边按8字形作盘旋行动","C":"小猫为了清洁会用舌头舔毛，对舔不到的地方会先用唾液打湿爪子后，再用爪子打理该部位","D":"当灰雁的蛋滚出巢外后，它会先伸长脖颈，下颏压在蛋上把蛋拉回，即使中途有人把蛋拿走，灰雁也将继续完成这一动作"},"answer":"C","explanation":"第一步：找出定义关键词。\n“按一定时空顺序进行的躯体活动”、“被一定的外部刺激引发的”、“一旦引发就会自动完成而不需要继续给予外部刺激”。\n第二步：逐一分析选项。\nA项：青蛙先弹舌后缩回，符合“按一定时空顺序进行的躯体活动”，青蛙这一行为是由于发现了前方弹舌可及的飞虫，符合“被一定的外部刺激引发的”，且青蛙可自动完成这一系列动作，不需要再有其他外部刺激，符合“一旦引发就会自动完成而不需要继续给予外部刺激”，符合定义，排除；\nB项：工蜂一边激烈地振动着腹部，一边按8字形作盘旋行动，符合“按一定时空顺序进行的躯体活动”，工蜂这一行为是由于发现了蜜源，符合“被一定的外部刺激引发的”，且工蜂是到蜂群中自动完成这一系列动作，不需要再有其他外部刺激，符合“一旦引发就会自动完成而不需要继续给予外部刺激”，符合定义，排除；\nC项：小猫用舌头舔毛是日常行为，为了清洁身体，并没有受到外界刺激，不符合“被一定的外部刺激引发的”，不符合定义，当选；\nD项：灰雁先伸长脖颈，下颏压在蛋上把蛋拉回，符合“按一定时空顺序进行的躯体活动”，灰雁这一行为是由于蛋滚出巢外，符合“被一定的外部刺激引发的”，且即使中途有人把蛋拿走，灰雁也将继续完成这一动作，体现了这一动作的自动性，符合“一旦引发就会自动完成而不需要继续给予外部刺激”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"4817879","cat":"定义判断","stem":"错失恐惧症指社交活动中因过于担心错失机遇，从不拒绝任何邀约的心理状态。\n根据上述定义，下列属于错失恐惧症的是：","options":{"A":"小陈的心情极易受身边同事对其态度的影响，常常怀疑自己做错什么，总是被后悔自责的情绪所包围","B":"农村大学生小李自尊心很强，刻苦努力，积极参加学校组织的各项活动，最终成为一名优秀的学生","C":"大龄青年小张对各种集体活动或朋友聚会总是“有求必应”，生怕错过任何结识异性朋友的机会","D":"小赵关心时事，每隔一小时就到各大网站刷新闻，生怕错过什么大事，是单位里著名的百事通"},"answer":"C","explanation":"第一步：找出定义关键词。\n“社交活动中”、“过于担心错失机遇”、“从不拒绝任何邀约”。\n第二步：逐一分析选项。\nA项：小陈易受身边同事对其态度的影响而产生负面情绪，未提及有人对小陈邀约，不符合“从不拒绝任何邀约”，不符合定义，排除； \nB项：小李积极参加学校组织的各项活动并成为优秀的学生，并未提及有人对小李邀约，不符合“从不拒绝任何邀约”，不符合定义，排除；\nC项：小张对各种集体活动或朋友聚会总是“有求必应”，生怕错过结交异性朋友的机会，说明他在社交活动中因害怕错失机遇，从不拒绝，符合“社交活动中”、“过于担心错失机遇”、“从不拒绝任何邀约”，符合定义，当选；\nD项：小赵因关心时事到各大网站刷新闻而成为单位的百事通，只能说明他了解时事，并未提及有人对小赵邀约，不符合“从不拒绝任何邀约”，不符合定义，排除。\n故正确答案为C。","no":70,"missingImage":false},{"type":"question","qid":"4817902","cat":"类比推理","stem":"病从口入：祸从口出","options":{"A":"比上不足：比下有余","B":"捡了芝麻：丢了西瓜","C":"耳听为虚：眼见为实","D":"母鸡下蛋：公鸡打鸣"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n病从口入指许多疾病是由于吃了不洁净的东西或饮食不规律引起的；祸从口出指说话不谨慎会招致灾祸，二者没有语义关系，考虑成语拆分，“病”和“祸”是并列关系，“入”和“出”是反义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“比”和“比”是同义关系，“足”和“余”不是反义关系，与题干逻辑关系不一致，排除；\nB项：“捡”和“丢”是反义关系，“麻”和“瓜”不是反义关系，与题干逻辑关系不一致，排除；\nC项：“耳”和“眼”是并列关系，“虚”和“实”是反义关系，与题干逻辑关系一致，当选；\nD项：“母”和“公”是并列关系，“蛋”和“鸣”不是反义关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":71,"missingImage":false},{"type":"question","qid":"4817892","cat":"类比推理","stem":"策略：销售：销量","options":{"A":"表演：技巧：效果","B":"兵器：战斗：伤亡","C":"思路：答题：得分","D":"方法：测量：误差"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n运用策略销售，可以提高销量，三者为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：运用技巧表演，可以增强效果，三者为对应关系，但前两词词语顺序与题干相反，与题干逻辑关系不一致，排除；\nB项：运用兵器战斗，可以增加敌方的伤亡，也可以减少己方的伤亡，三者关系不够严谨，与题干逻辑关系不一致，排除；\nC项：运用思路答题，可以提高得分，三者为对应关系，与题干逻辑关系一致，当选；\nD项：运用方法测量，可以减少误差，三者为对应关系，但题干为“提高”，此处为“减少”，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":72,"missingImage":false},{"type":"question","qid":"4818109","cat":"类比推理","stem":"7：质数：自然数","options":{"A":"红光：可见光：电磁波谱","B":"爱：感情：情感","C":"煤：岩石：沉积岩","D":"U：字母：英文"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n质数是指在大于1的自然数中，除了1和它本身以外不再有其他因数的自然数，如2、3、5、7等，因此7是质数，二者为种属关系。同时，自然数包含所有质数，二者为包容关系。\n第二步：判断选项词语间逻辑关系。\nA项：可见光是电磁波谱中人眼可以感知的部分，如红光、橙光、黄光、绿光等，因此，红光是可见光，二者为种属关系，同时，电磁波谱包含所有可见光，二者为包容关系，与题干逻辑关系一致，当选；\nB项：爱是一种感情，但感情和情感意思相近，二者为近义关系，与题干逻辑关系不一致，排除；\nC项：煤是固体可燃有机岩，两者为种属关系，沉积岩也是岩石的一种，二者为种属关系，但顺序与题干不同，与题干逻辑关系不一致，排除；\nD项：U是字母，二者为种属关系，但有的字母是英文，有的字母不是英文，如汉语拼音中的字母等，有的英文是字母，有的英文不是字母，如英文单词等，二者为交叉关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":73,"missingImage":false},{"type":"question","qid":"4818002","cat":"类比推理","stem":"条件 对于 （    ）相当于 （    ）对于 建设","options":{"A":"医师；设计师","B":"推理；规划","C":"思维；混凝土","D":"暗示；道路"},"answer":"B","explanation":"逐一代入选项。\nA项：条件与医师，二者无明显逻辑关系；设计师可能参与到建设当中，前后逻辑关系不一致，排除；\nB项：推理需要依据条件，二者为依据的对应关系；建设需要依据规划，二者为依据的对应关系，前后逻辑关系一致，当选；\nC项：条件与思维，二者无明显逻辑关系；混凝土是建设中需要的原材料，二者为原材料的对应关系，前后逻辑关系不一致，排除；\nD项：条件与暗示，二者无明显逻辑关系；建设道路，二者为动宾关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":74,"missingImage":false},{"type":"question","qid":"4818235","cat":"类比推理","stem":"水路运输 对于 （    ） 相当于 （    ） 对于 商朝文物","options":{"A":"公路运输；四羊方尊","B":"内河运输；夏代文物","C":"货运船舶；遗址挖掘","D":"长途运输；青铜器物"},"answer":"D","explanation":"逐一代入选项。\nA项：水路运输和公路运输是两种不同的运输方式，二者是并列关系；四羊方尊是商代晚期青铜礼器，四羊方尊是商朝文物，二者是种属关系，前后逻辑关系不一致，排除；\nB项：内河运输是一种水路运输，二者是种属关系；夏代文物和商朝文物是并列关系，前后逻辑关系不一致，排除；\nC项：货运船舶用于水路运输，二者是工具和应用领域的对应关系；商朝文物是遗址挖掘的成果，二者是过程和成果的对应关系，前后逻辑关系不一致，排除；\nD项：有的水路运输是长途运输，有的水路运输不是长途运输，有的长途运输是水路运输，有的长途运输不是水路运输，二者是交叉关系；有的青铜器物是商朝文物，有的青铜器物不是商朝文物，有的商朝文物是青铜器物，有的商朝文物不是青铜器物，二者是交叉关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"4818081","cat":"类比推理","stem":"要做好新时代党的新闻舆论工作，就必须牢牢坚持党性原则。坚持党性原则，最根本的是坚持党的领导。因此坚持党的领导是做好新闻舆论工作的必备条件。\n下列论述与上述推断结构最相似的是：","options":{"A":"人民群众的拥护是我们党最坚固的根基。人民群众最痛恨腐败现象。因此腐败是我们党面临的最大威胁","B":"强国必须强军。强军是新时代坚持和发展中国特色社会主义，实现中华民族伟大复兴的战略支撑。因此巩固和加强人民军队刻不容缓","C":"国家安全是人民幸福安康的基本要求。维护国家安全才能维护全国各族人民的根本利益。因此维护全国各族人民的根本利益才能实现人民幸福安康","D":"社会主义现代化是人与自然和谐共生的现代化。坚持生态文明建设是人与自然和谐共生的必然要求。因此实现社会主义现代化必须坚持生态文明建设"},"answer":"D","explanation":"第一步：分析题干推理形式。\n“要做好新时代党的新闻舆论工作，就必须牢牢坚持党性原则”翻译为：①做好新时代党的新闻舆论工作\u003cimg data-k=\"2dfb7d1f72f3\">坚持党性原则；\n“坚持党性原则，最根本的是坚持党的领导”翻译为：②坚持党性原则\u003cimg data-k=\"2dfb7d1f72f3\">坚持党的领导；\n将①和②串联可以递推出③：做好新时代党的新闻舆论工作\u003cimg data-k=\"2dfb7d1f72f3\">坚持党性原则\u003cimg data-k=\"2dfb7d1f72f3\">坚持党的领导；\n“因此坚持党的领导是做好新闻舆论工作的必备条件”翻译为：④做好新时代党的新闻舆论工作\u003cimg data-k=\"2dfb7d1f72f3\">坚持党的领导。\n④是对③的肯前必肯后。\n第二步：逐一分析选项。\nA项：“人民群众的拥护是我们党最坚固的根基”翻译为：党\u003cimg data-k=\"2dfb7d1f72f3\">人民群众的拥护；“人民群众最痛恨腐败现象”无法翻译，与题干推理形式不同，排除；\nB项：“强国必须强军”翻译为：①强国\u003cimg data-k=\"2dfb7d1f72f3\">强军；“强军是新时代坚持和发展中国特色社会主义，实现中华民族伟大复兴的战略支撑”翻译为：②坚持和发展中国特色社会主义，实现中华民族伟大复兴\u003cimg data-k=\"2dfb7d1f72f3\">强军；①和②无法串联，与题干推理形式不同，排除；\nC项：“国家安全是人民幸福安康的基本要求”翻译为：①人民幸福安康\u003cimg data-k=\"2dfb7d1f72f3\">国家安全；“维护国家安全才能维护全国各族人民的根本利益”翻译为：②维护全国各族人民的根本利益\u003cimg data-k=\"2dfb7d1f72f3\">国家安全；①和②无法串联，与题干推理形式不同，排除；\nD项：“社会主义现代化是人与自然和谐共生的现代化”翻译为：①社会主义现代化\u003cimg data-k=\"2dfb7d1f72f3\">人与自然和谐共生的现代化；“坚持生态文明建设是人与自然和谐共生的必然要求”翻译为：②人与自然和谐共生的现代化\u003cimg data-k=\"2dfb7d1f72f3\">坚持生态文明建设；将①和②串联可以递推出③：社会主义现代化\u003cimg data-k=\"2dfb7d1f72f3\">人与自然和谐共生的现代化\u003cimg data-k=\"2dfb7d1f72f3\">坚持生态文明建设；“因此实现社会主义现代化必须坚持生态文明建设”翻译为：④社会主义现代化\u003cimg data-k=\"2dfb7d1f72f3\">坚持生态文明建设，④是对③的肯前必肯后，与题干推理形式相同，当选。\n故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"4817841","cat":"逻辑判断","stem":"调查显示，我国脱发人群数量达3亿，其中69.8%是30岁以下人群。有一种流行观点认为，脱发与身体内缺乏维生素\u003cimg data-k=\"7cdb4961110e\">有关，只要在脱发处涂抹维生素\u003cimg data-k=\"7cdb4961110e\">就能治愈脱发。调查显示，许多30岁左右的年轻患者对此深信不疑，纷纷采用这种方法试图治愈脱发。\n以下哪项如果为真，最能质疑上述流行观点？","options":{"A":"有专家指出，引起脱发的原因有很多，并不都是缺乏维生素","B":"有研究表明，B族维生素对治疗由缺铁引起的脱发没有作用","C":"大量的临床试验证明，外用维生素\u003cimg data-k=\"7cdb4961110e\">治疗脱发并没有明显疗效","D":"\u003cspan style=\"color:#rgb(89,89,89)\">患者应通过检查弄清脱发原因，再根据诊断结果进行针对性治疗\u003c/span>"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：脱发与身体内缺乏维生素\u003cimg data-k=\"7cdb4961110e\">有关，只要在脱发处涂抹维生素\u003cimg data-k=\"7cdb4961110e\">就能治愈脱发。\n论据：无。\n本题只有论点，没有论据，削弱优先考虑削弱论点，即涂抹维生素\u003cimg data-k=\"7cdb4961110e\">不能治愈脱发。\n第二步：逐一分析选项。\nA项：该项讨论的是引起脱发的原因，而论点讨论的是涂抹维生素\u003cimg data-k=\"7cdb4961110e\">是否可以治愈脱发，话题不一致，无法削弱，排除；\nB项：该项指出B族维生素对治疗由缺铁引起的脱发没有作用，通过举例来削弱论点，可以削弱，保留；\nC项：该项指出外用维生素\u003cimg data-k=\"7cdb4961110e\">治疗脱发并没有明显疗效，直接削弱论点中的“只要在脱发处涂抹维生素\u003cimg data-k=\"7cdb4961110e\">就能治愈脱发”，削弱论点，可以削弱，保留；\nD项：该项讨论的是脱发患者应如何治疗脱发，而论点讨论的是涂抹维生素\u003cimg data-k=\"7cdb4961110e\">是否可以治愈脱发，话题不一致，无法削弱，排除。\n对比B、C两项，B项只说明B族维生素对治疗由缺铁引起的脱发没有作用，但不明确对其他原因造成的脱发是否有用，而C项直接表明外用维生素\u003cimg data-k=\"7cdb4961110e\">治疗脱发并没有明显疗效，C项削弱力度更强，当选。\n故正确答案为C。","no":77,"missingImage":false},{"type":"question","qid":"4818063","cat":"逻辑判断","stem":"最近热播的电视剧涉及教育资源争夺战，不仅把观众的心弦绷紧到了低龄教育阶段，而且暴露了一个更为深层次的问题，即究竟什么才是好的教育。一些剧中人以为，只要孩子能够考到高分进入好的学校，就是最好的教育。\n以下哪项如果为真，最能质疑上述观点？","options":{"A":"应试教育是教育资源长期相对匮乏、社会选拔标准相对单一的后遗症","B":"仅仅以分数作为单一评判标准，早已不能满足市场对各种人才的需要","C":"近年来，相关部门开展了校外培训机构专项治理，已取得阶段性成效","D":"个别孩子以很高的分数考入国内著名高校，最终却走上了犯罪的道路"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：只要孩子能够考到高分进入好的学校，就是最好的教育。\n论据：无。\n本题只有论点，没有论据，削弱优先考虑削弱论点，即考到高分进入好的学校不是最好的教育。\n第二步：逐一分析选项。\nA项：选项讨论的是应试教育产生的原因，应试教育又称填鸭式教育，就是把知识一味灌输给学生，完全不考虑学生是否能够明白其中的意思，指的是一种忽略学生接受能力的教育方式，与题干看重分数的教育不同，无关项，不能削弱，排除；\nB项：选项讨论的是分数作为单一评判标准（即论点的考高分进名校），无法满足市场对人才的需要，说明考高分进名校已经不符合现在人才选拔的要求，所以考高分进名校不是最好的教育，可以削弱论点，保留；\nC项：选项讨论的是有关部门对校外培训机构治理取得的成效，并未提及考高分进好学校是否是最好的教育，二者话题不一致，无关项，无法削弱，排除；\nD项：选项说个别孩子高分进入名校，但是最终却走上犯罪的道路，即通过举了个别孩子的例子说明高分进入好的学校也不一定是最好的教育，举例削弱论点，保留。\n对比B、D两项， D项是举例削弱论点，而B项直接削弱论点，力度更强，因此择优选择B项。\n故正确答案为B。","no":78,"missingImage":false},{"type":"question","qid":"4817948","cat":"逻辑判断","stem":"人人都是可以不普通的。如果你认为自己是最优秀的人，你就会按照最优秀人的标准来要求自己。如果你相信自己能够成功，你就一定能成功。只有先在心里肯定自己，你才能在行动上充分地展现自己。\n根据以上陈述，可以得出以下哪项？","options":{"A":"如果你不认为自己最优秀，你就不会按照最优秀人的标准来要求自己","B":"如果能在行动上充分地展现自己，那么一定是先在心里肯定了自己","C":"有的人虽然自信能够成功，但实际上未必能够成功","D":"你只有相信自己能够成功，才可能取得成功"},"answer":"B","explanation":"第一步：翻译题干。\n①认为自己是最优秀的人\u003cimg data-k=\"2dfb7d1f72f3\">会按照最优秀人的标准来要求自己；\n②相信自己能够成功\u003cimg data-k=\"2dfb7d1f72f3\">一定能成功；\n③在行动上充分地展现自己\u003cimg data-k=\"2dfb7d1f72f3\">先在心里肯定自己。\n第二步：逐一分析选项。\nA项：翻译为：不认为自己最优秀\u003cimg data-k=\"2dfb7d1f72f3\">不会按照最优秀人的标准来要求自己，是对①的否前，否前无必然结论，无法推出，排除；\nB项：翻译为：在行动上充分地展现自己\u003cimg data-k=\"2dfb7d1f72f3\">先在心里肯定自己，是对③的肯前，肯前必肯后，可以推出，当选；\nC项：自信能够成功是对②的肯前，根据肯前必肯后，应得出一定成功，并非未必能够成功，无法推出，排除；\nD项：翻译为：可能取得成功\u003cimg data-k=\"2dfb7d1f72f3\">相信自己能够成功，根据②可知，既不是肯后也不是否后，无法推出，排除。\n故正确答案为B。","no":79,"missingImage":false},{"type":"question","qid":"4818115","cat":"逻辑判断","stem":"作为一种户外运动，徒步正成为越来越多人的生活方式。徒步者们大多喜欢走在美丽清新的城市近郊、乡村荒野、风景名胜或国家公园中。为什么有些现代人喜欢徒步？这是他们热爱自然、回归自然的表现，徒步者希望通过回归自然获得内心的宁静。\n以下哪项如果为真，不能质疑上述观点？","options":{"A":"很多人希望通过徒步来锻炼身体，增强活力，促进身体健康","B":"徒步者反对现代社会所推崇的“速度”价值，希望自己的生活“慢下来”","C":"徒步容易激发创造力，很早就被人作为潜心思考或科学发现的重要方式","D":"国家公园、带薪休假、行走文学等要素的出现，让现代人徒步成为可能"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：现代人喜欢徒步是因为他们热爱自然、回归自然，徒步者希望通过回归自然获得内心的宁静。\n论据：无。\n本题只有论点没有论据，削弱优先考虑否定论点，且论点中存在因果关系，还可以考虑因果倒置和他因削弱。\n第二步：逐一分析选项。\nA项：该项说的是很多人希望通过徒步来锻炼身体，说明现代人喜欢徒步的原因是锻炼身体，而不是回归自然获得内心的宁静，削弱论点，排除；\nB项：该项说的是徒步者希望自己的生活“慢下来”，说明现代人喜欢徒步的原因是让生活“慢下来”，而不是回归自然获得内心的宁静，削弱论点，排除；\nC项：该项说的是徒步容易激发创造力且被人作为潜心思考或科学发现的重要方式，说明现代人喜欢徒步的原因是容易激发创造力，而不是回归自然获得内心的宁静，削弱论点，排除；\nD项：该项说的是国家公园、带薪休假和行走文学等为徒步提供了条件，而题干讨论的是现代人喜欢徒步的原因，话题不一致，无法削弱，当选。\n本题为选非题，故正确答案为D。","no":80,"missingImage":false},{"type":"question","qid":"4818163","cat":"逻辑判断","stem":"一些对生态和气候感兴趣的古生物学研究者发现，中国东部与国外相比，虽然化石产出的具体时期有所差异，但埋藏于紫红色岩石地层的恐龙骨骼化石的埋藏相具有相似性，这是因为晚白垩世全球古生态及古气候是相似的。在中国，埋藏的恐龙骨骼化石种属以鸟脚类鸭嘴恐龙与兽脚类恐龙为主，埋藏环境主要为冲积扇与河流环境；美洲以鸭嘴龙科为主，埋藏环境主要为平原。\n要得到上述古生物学研究者的结论，需要补充的前提是：","options":{"A":"晚白垩世的河流与平原具有不相同的埋藏环境","B":"中国鸟脚类鸭嘴恐龙与美洲的鸭嘴龙科是不同种族","C":"骨骼化石在不同地层的埋藏学特征取决于生态及气候","D":"晚白垩世全球各地的紫红色岩石地层具有相同的埋藏环境"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：中国东部与国外相比，虽然化石产出的具体时期有所差异，但埋藏于紫红色岩石地层的恐龙骨骼化石的埋藏相具有相似性。\n论据：晚白垩世全球古生态及古气候是相似的。\n本题问法为“前提”，论点讨论的是中国东部与国外的埋藏于紫红色岩石地层的恐龙骨骼化石的埋藏相具有相似性，而论据讨论的是晚白垩世全球古生态及古气候是相似的，二者话题不一致，优先考虑搭桥，即建立埋藏相与生态气候之间的联系。\n第二步：逐一分析选项。\nA项：该项指出晚白垩世的河流与平原具有不同的埋藏环境，而题干讨论的是恐龙骨骼化石在紫红色岩石地层的埋藏相与当时生态气候的关系，话题不一致，无法加强，排除；\nB项：该项指出中国的鸟脚类鸭嘴恐龙与美洲的鸭嘴龙科属于不同种族，而题干讨论的是恐龙骨骼化石在紫红色岩石地层的埋藏相与当时生态气候的关系，话题不一致，无法加强，排除；\nC项：该项指出骨骼化石在不同地层的埋藏学特征取决于生态及气候，建立了埋藏相与生态气候之间的联系，属于搭桥项，可以加强，当选；\nD项：该项指出晚白垩世全球各地的紫红色岩石地层的埋藏环境相同，而题干讨论的是恐龙骨骼化石在紫红色岩石地层的埋藏相与当时生态气候的关系，话题不一致，无法加强，排除。\n故正确答案为C。","no":81,"missingImage":false},{"type":"question","qid":"4818208","cat":"逻辑判断","stem":"有关专家认为，北冰洋很可能在2034年迎来第一个“无冰之夏”。北极海冰并非一成不变，一年中会动态变化：夏季持续融化，在9月前后达到最小面积；冬季持续结冻，在3月前后达到最大面积。近几十年来，由于北极地区气温持续升高，海冰在夏季的面积随之持续减少。\n以下哪项如果为真，不能支持上述专家观点？","options":{"A":"1988年25%左右的北极海冰持续冻结4年以上，2013年降到了7%","B":"北极海冰融化后海水将能吸收大量的太阳辐射，相当于海冰的100倍","C":"1979年至2011年，北极海冰9月份的范围正以每十年12%的速率消融","D":"北极夏季最小海冰范围在2012年只有近334万平方千米，是十年前的一半"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：北冰洋很可能在2034年迎来第一个“无冰之夏”。\n论据：近几十年来，由于北极地区气温持续升高，海冰在夏季的面积随之持续减少。\n本题论点和论据话题一致，都是在讨论北极海冰在夏季的面积持续减少，加强优先考虑补充论据，本题为选非题，将可以加强的选项排除即可。\n第二步：逐一分析选项。\nA项：该项说的是北极持续冻结4年以上的海冰从1988年的25%左右下降到了2013年的7%，举例说明了北极海冰在夏季的面积持续减少，补充论据，可以加强，排除；\nB项：该项说的是北极海冰融化后的结果，但不能说明北极海冰在夏季的面积持续减少，话题不一致，无法加强，当选；\nC项：该项举了1979年至2011年的例子，说明北极海冰在夏季的面积确实在持续减少，补充论据，可以加强，排除；\nD项：该项说的是北极在2012年的夏季最小海冰范围是十年前的一半，举例说明了北极海冰在夏季的面积持续减少，补充论据，可以加强，排除。\n本题为选非题，故正确答案为B。","no":82,"missingImage":false},{"type":"question","qid":"4817886","cat":"逻辑判断","stem":"人们往往认为，在育儿问题上，西方父母更“佛系”，东方父母更“鸡血”，某经济学家不以为然。他认为，如果一个社会中出身阶层完全决定了一个人的收入水平，那么，父母敦促孩子努力学习、成为优秀学生的行为就是徒劳的；而如果高学历及名校生能够比其他人获得更多成功时，父母就完全有理由鞭策孩子学习。\n以下哪项如果为真，最能支持上述专家的观点？","options":{"A":"相对于地域和文化因素，家庭经济收入水平高低对父母育儿行为有更为重要的影响","B":"在收入不平等普遍存在的情况下，社会阶层流动性的高低，是影响父母育儿行为的关键因素","C":"如果一个教育系统强调机会公平并淡化成年前的竞争，那么家长和孩子会有更多放松的余地","D":"在教育回报率较低的国家，父母往往会更宽容；在教育回报率较高的国家，父母可能会更专断"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：如果一个社会中出身阶层完全决定了一个人的收入水平，那么，父母敦促孩子努力学习、成为优秀学生的行为就是徒劳的；而如果高学历及名校生能够比其他人获得更多成功时，父母就完全有理由鞭策孩子学习。\n论据：无。\n本题只有论点没有论据，加强考虑补充论据，即解释原因或者举例。\n第二步：逐一分析选项。\nA项：该项说的是家庭收入水平会影响父母的育儿行为，但并未指出会带来什么样的影响，属于不明确选项，无法加强，排除；\nB项：该项说的是在收入不平等的情况下社会阶层流动性的高低影响父母的育儿行为，但是并未指出东西方收入是否平等，也没有指出会对父母带来什么样的影响，无法加强，排除；\nC项：该项说的是教育系统采取的措施对家长孩子的影响，而题干讨论的是不同社会环境下父母不同的育儿行为，话题不一致，无法加强，排除；\nD项：该项指出教育回报率高低对父母育儿行为产生的不同影响，解释了为什么不同的环境下父母会采取不同的育儿行为，补充论据，可以加强，当选。\n故正确答案为D。","no":83,"missingImage":false},{"type":"question","qid":"4817921","cat":"逻辑判断","stem":"在年终考评中，黄某带领的团队7人中有4人被评为优秀，已知：\n(1)黄、丁、陈3人中有2人是优秀；\n(2)李、杨、肖、贾4人中有2人是优秀；\n(3)如果杨、贾两人中有人被评为优秀的，则陈也是优秀。\n根据以上陈述，可以得出以下哪项？","options":{"A":"陈、肖中至少有1人被评为优秀","B":"黄、李中至少有1人被评为优秀","C":"丁、肖中至少有1人被评为优秀","D":"丁、李中至少有1人被评为优秀"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）黄、丁、陈中有2人是优秀；\n（2）李、杨、肖、贾中有2人是优秀；\n（3）杨或贾是优秀\u003cimg data-k=\"2dfb7d1f72f3\">陈是优秀。\n第二步：根据题干条件进行推理。\n题干没有确定信息，且涉及多种情况，故考虑假设法。\n根据条件（3）以及逆否规律，若陈不是优秀，能够推出确定结论，可先假设陈的两种情况：\n第一种情况：假设陈不是优秀，根据条件（1）可知，黄和丁都是优秀，再根据条件（3）否后必否前可知，杨和贾都不是优秀，结合条件（2）可知，李和肖都是优秀；\n第二种情况：假设陈是优秀，根据条件（1）可知，黄和丁中只有1人是优秀，根据条件（2）可知，李、杨、肖、贾中有2人是优秀，根据条件（3）无法推出结论，此时仅可以确定陈是优秀，其他人是否优秀均无法确定。\n综合上述两种情况，可以推出陈、肖中至少有1人被评为优秀成立，对应A项。\n故正确答案为A。","no":84,"missingImage":false},{"type":"question","qid":"4817972","cat":"类比推理","stem":"甲、乙、丙、丁4位同学参加学校运动会。已知他们4人每人都至少获得1个奖项，4人获奖总数为10。关于具体获奖情况，4人还有如下说法：\n甲：乙和丙获奖总数为5；\n乙：丙和丁获奖总数为5；\n丙：丁和甲获奖总数为5；\n丁：甲和乙获奖总数为4。\n后来得知，获得２个奖项的人说了假话，而其他人均说了真话。\n根据以上信息，甲、乙、丙、丁4人具体的获奖数分别应是：","options":{"A":"2、3、2、3","B":"2、4、1、3","C":"2、2、2、4","D":"2、2、3、3"},"answer":"C","explanation":"第一步：分析题干信息。\n题干重要信息：获得２个奖项的人说了假话，而其他人均说了真话。\n第二步：结合题干信息进行推理。\n题干信息不确定，优先考虑代入法解题。\n观察选项，发现四个选项中甲的获奖数都是2，说明甲的获奖数为2，根据题干条件“获得２个奖项的人说了假话”可知，甲说的是假话，故乙和丙的获奖总数不是5。\nA项：乙和丙的获奖总数为5，排除；\nB项：乙和丙的获奖总数为5，排除；\nC项：乙和丙的获奖总数为4，当选；\nD项：乙和丙的获奖总数为5，排除。\n故正确答案为C。","no":85,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2020年我国数字经济规模达到39.2万亿元，保持9.7%的高位增长，占GDP比重为38.6%，同比提升2.4个百分点。\u003c/p>\u003cp>        产业数字化发展深入推进，2020年我国服务业、工业、农业数字经济占行业增加值比重分别为40.7%、21.0%和8.9%。\u003c/p>\u003cp>        2020年，数字经济规模超过1万亿元的省份有广东、江苏、山东、浙江、上海、北京、福建、湖北、四川、河南、河北、湖南和安徽；另有8个省份超过5000亿元；从GDP占比看，北京、上海领先，分别达到55.9%和55.1%；从增速上看，贵州、重庆、福建数字经济增速位列前三，增速超过15%。\u003c/p>\u003cp>\u003cimg data-k=\"bf35148b63f9\" style=\"max-width:700px\">\u003c/p>\u003cp>\u003cimg data-k=\"b9a79f85f327\" style=\"max-width:599px\">\u003c/p>\u003cp>\u003cimg data-k=\"e3f86539d52c\" style=\"max-width:669px\">\u003c/p>","questions":[{"qid":"4817755","cat":"综合","stem":"2020年，数字经济规模超过5000亿元的省份有多少个？","options":{"A":"8","B":"11","C":"16","D":"21"},"answer":"D","explanation":"定位文字资料第三段可得：2020年，数字经济规模超过1万亿元的省份有广东、江苏、山东、浙江、上海、北京、福建、湖北、四川、河南、河北、湖南和安徽；另有8个省份超过5000亿元。可知超过5000亿元的省份共有13+8=21个。\n故正确答案为D。","no":86,"missingImage":false},{"qid":"4817765","cat":"比重","stem":"数字产业化占GDP比重最大的年份是：","options":{"A":"2015年","B":"2017年","C":"2019年","D":"2020年"},"answer":"B","explanation":"根据题干“······占······比重最大的年份是”，可判定本题为现期比重问题。定位统计表可得：2015年、2017年、2019年、2020年数字经济占GDP的比重；定位统计图1可得：2015年、2017年、2019年、2020年数字产业化占数字经济的比重。根据公式：比重\u003cimg data-k=\"d96f2813fb7d\">，可得数字产业化占GDP的比重\u003cimg data-k=\"018909357682\">。\n2015年的比重为：\u003cimg data-k=\"2998781842ba\">；\n2017年的比重为：\u003cimg data-k=\"0cf7d5c0ae20\">；\n2019年的比重为：\u003cimg data-k=\"6e66766668a6\">；\n2020年的比重为：\u003cimg data-k=\"a6b67ae92181\">。\n综上所述，数字产业化占GDP比重最大的年份是2017年。\n故正确答案为B。","no":87,"missingImage":false},{"qid":"4817772","cat":"增长","stem":"2015-2020年，数字经济增速与GDP增速之差超过8.5%的年份有多少个？","options":{"A":"3","B":"4","C":"5","D":"6"},"answer":"B","explanation":"定位统计图2可得：2015-2020年，数字经济增速分别为15.80%、18.90%、20.30%、20.90%、15.60%、9.70%；GDP增速分别为7.00%、8.40%、11.50%、10.50%、7.30%、3.00%。故各年份数字经济增速与GDP增速之差分别为：\n2015年：15.80%-7.00%=8.8%＞8.5%；\n2016年：18.90%-8.40%=10.5%＞8.5%；\n2017年：20.30%-11.50%=8.8%＞8.5%；\n2018年：20.90%-10.50%=10.4%＞8.5%；\n2019年：15.60%-7.30%=8.3%＜8.5%；\n2020年：9.70%-3.00%=6.7%＜8.5%。\n比较可知，2015-2020年，数字经济增速与GDP增速之差超过8.5%的年份有2015年、2016年、2017年、2018年，共4个。\n故正确答案为B。","no":88,"missingImage":false},{"qid":"4817783","cat":"增长","stem":"2020年，产业数字化规模同比增长约：","options":{"A":"9.2%","B":"9.8%","C":"10%","D":"10.7%"},"answer":"D","explanation":"根据题干“2020年······同比增长约”，结合选项为百分数，可判定本题为一般增长率问题。定位文字材料第一段可得：2020年我国数字经济规模达到39.2万亿元，保持9.7%的高位增长。定位统计图1可得：我国数字经济内部结构中，2019年产业数字化占比为80.20%，2020年产业数字化占比为80.90%。根据公式：部分=整体×比重、增长率\u003cimg data-k=\"2623f0dd96bb\">\u003cimg data-k=\"db4d2db6846a\">，可得2020年产业数字化规模同比增长\u003cimg data-k=\"ff525f31395c\">\u003cimg data-k=\"08c71cb4384a\">\u003cimg data-k=\"80e51e7f5bea\">。\n故正确答案为D。","no":89,"missingImage":false},{"qid":"4817786","cat":"综合","stem":"不能从上述资料中推出的是：","options":{"A":"2020年北京市数字经济规模全国领先","B":"2020年数字经济增速是GDP增速的3倍多","C":"2020年数字经济内部结构大约呈现“二八”比例分布","D":"2020年农业、工业和服务业数字经济渗透水平大约逐次倍增"},"answer":"A","explanation":"A项：定位文字材料第三段，2020年，数字经济规模超过1万亿元的省份有广东、江苏、山东、浙江、上海、北京、福建、湖北、四川、河南、河北、湖南和安徽；另有8个省份超过5000亿元；从GDP占比看，北京、上海领先，分别达到55.9%和55.1%。因为北京和其他地区的GDP未知，尽管北京数字经济在GDP中的占比最高，但并不能推出北京数字经济规模最大，错误；\nB项：定位统计图2，2020年我国数字经济增速和GDP增速分别为9.70%、3.00%。则2020年数字经济增速是GDP增速的\u003cimg data-k=\"3c8ccd573341\">倍，正确；\nC项：定位统计图1，2020年我国数字经济内部结构中数字产业化占比和产业数字化占比分别为19.10%、80.90%。则\u003cimg data-k=\"bc44766301d7\">，大约呈现“二八”比例分布，正确；\nD项：定位文字材料第二段，2020年我国服务业、工业、农业数字经济占行业增加值比重分别为40.7%、21.0%和8.9%。题干表述中的“渗透水平”即所占比重，\u003cimg data-k=\"6c607452c62d\">\u003cimg data-k=\"1a8f921ca565\">倍，\u003cimg data-k=\"218d2dfce8b3\">\u003cimg data-k=\"1a8f921ca565\">倍，\n本题为选非题，故正确答案为A。","no":90,"missingImage":false}]},{"type":"material","material":"\u003cp>        2018年某省规模以上企业就业人员年平均工资为62484元，比上年增长10.1%。其中，中层及以上管理人员增长9.7%；专业技术人员增长20.7%；办事人员和有关人员增长5.7%；社会生产服务和生活服务人员增长8.5%；生产制造及有关人员增长9.7%。\u003c/p>\u003cp>\u003cimg data-k=\"f6f42d2fc994\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"4817764","cat":"增长","stem":"2018年，该省规模以上企业就业人员年平均工资同比增速最快的职业类型是：","options":{"A":"专业技术人员","B":"中层及以上管理人员","C":"社会生产服务和生活服务人员","D":"生产制造及有关人员"},"answer":"A","explanation":"定位文字材料可知：2018年，该省规模以上企业中层及以上管理人员的年平均工资增长9.7%；专业技术人员增长20.7%；社会生产服务和生活服务人员增长8.5%；生产制造及有关人员增长9.7%。因此同比增速最快的职业类型是专业技术人员。\n故正确答案为A。","no":91,"missingImage":false},{"qid":"4817767","cat":"平均数","stem":"表中2018年平均工资最高的行业，其规模以上企业专业技术人员平均工资约是生产制造及有关人员的多少倍？","options":{"A":"1.3","B":"1.5","C":"1.7","D":"1.9"},"answer":"B","explanation":"根据题干“表中2018年······约是······的多少倍”，可判定本题为现期倍数问题。定位表格材料可得：2018年平均工资最高的行业为电力、热力、燃气及水生产和供应业，其规模以上企业专业技术人员平均工资为148922元，生产制造及有关人员为101058元。则所求倍数\u003cimg data-k=\"77f3d964a0a6\">倍。\n故正确答案为B。","no":92,"missingImage":false},{"qid":"4817769","cat":"平均数","stem":"2018年，该省规模以上企业中层及以上管理人员平均工资低于全省同类人员平均水平的行业有几个？","options":{"A":"6","B":"7","C":"8","D":"9"},"answer":"B","explanation":"定位表格材料可得，2018年该省规模以上企业中层及以上管理人员平均工资为126154元，低于全省同类人员平均水平的行业有采矿业（117596元）、建筑业（107630元）、批发和零售业（115384元）、住宿和餐饮业（87194元）、水利、环境和公共设施管理业（106555元）、居民服务、修理和其他服务业（110260元）、文化、体育和娱乐业（115905元），共7个。\n故正确答案为B。","no":93,"missingImage":false},{"qid":"4817775","cat":"增长","stem":"如2018年该省规模以上企业各行业各职业就业人员平均工资同比增速均与全省规模以上企业同职业人员总体水平相同，则2017年规模以上教育业企业专业技术人员平均工资比该行业办事人员和有关人员：","options":{"A":"低4000元以上","B":"低不到4000元","C":"高不到4000元","D":"高4000元以上"},"answer":"A","explanation":"根据题干“2017年······比······”，结合选项为低/高······元，且材料时间为2018年，可判定本题为基期和差问题。定位文字材料可得：2018年该省规模以上企业专业技术人员年平均工资增长20.7%，办事人员和有关人员增长5.7%。定位表格材料可得：2018年该省规模以上教育业企业专业技术人员平均工资77593元，办事人员和有关人员平均工资74531元。由于2018年该省规模以上企业各行业各职业就业人员平均工资同比增速均与全省规模以上企业同职业人员总体水平相同，根据公式：基期量\u003cimg data-k=\"eb4ccfb62ef4\">，则2017年该省规模以上教育业企业专业技术人员平均工资与该行业办事人员和有关人员的差值\u003cimg data-k=\"a13b8cb27a3c\">\u003cimg data-k=\"a07606e4aca0\">\u003cimg data-k=\"b9cfc8df4da9\">元，在A项范围内。\n故正确答案为A。","no":94,"missingImage":false},{"qid":"4817780","cat":"平均数","stem":"关于该省规模以上企业就业人员平均工资，能够从上述资料中推出的是：","options":{"A":"2017年生产制造及有关人员平均工资不到5万元","B":"2018年信息传输、软件和信息技术服务业中层以上管理人员平均工资为各行业中最高","C":"表中有3个行业办事人员和有关人员2018年平均工资超过同行业所有就业人员同期平均工资","D":"2018年房地产业中层及以上管理人员平均工资是该行业社会生产服务和生活服务人员的4倍以上"},"answer":"C","explanation":"A项：定位文字材料可得：2018年生产制造及有关人员平均工资同比增长9.7%；定位表格材料可得：2018年生产制造及有关人员平均工资为56060元。根据公式：基期量\u003cimg data-k=\"37fde96738fb\">，则2017年生产制造及有关人员平均工资为\u003cimg data-k=\"268a6f2dd12f\">元，错误；\nB项：定位表格材料可得：2018年信息传输、软件和信息技术服务业中层及以上管理人员平均工资为221498元，低于2018年电力、热力、燃气及水生产和供应业中层及以上管理人员平均工资（227181元），并非行业最高，错误；\nC项：定位表格材料可得：2018年，制造业办事人员和有关人员年平均工资（64752元）超过该行业所有就业人员同期平均工资（62286元）；住宿和餐饮业办事人员和有关人员年平均工资（43270元）超过该行业所有就业人员同期平均工资（43168元）；水利、环境和公共设施管理业办事人员和有关人员年平均工资（55392元）超过该行业所有就业人员同期平均工资（51503元），共3个行业，正确；\nD项：定位表格材料可得：2018年房地产业，中层及以上管理人员平均工资为156070元，社会生产服务和生活服务人员平均工资为40673元。前者是后者的\u003cimg data-k=\"f4cf9654b77f\">倍，错误。\n故正确答案为C。","no":95,"missingImage":false}]},{"type":"material","material":"\u003cp>        2019年，我国快递业务量为635.2亿件，其中东部、中部、西部地区分别完成业务量506.3亿件、81.9亿件和47亿件。全年快递业务收入7497.8亿元，其中东部、中部、西部地区的业务收入所占比重分别为80.2%、11.3%和8.5%。东部、中部、西部地区业务收入占全国比重分别比上年上升0.2个百分点、上升0.1个百分点和下降0.3个百分点。\u003c/p>\u003cp>        2016-2018年，我国快递业务收入分别为3974.4亿元、4957.1亿元、6038.4亿元。\u003c/p>\u003cp>\u003cimg data-k=\"f4b362ee8ee2\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"4817773","cat":"增长","stem":"2017-2019年，我国快递业务收入同比增速超过20%的年份有几个？","options":{"A":"0","B":"1","C":"2","D":"3"},"answer":"D","explanation":"根据题干“2017-2019年，······同比增速超过20%的年份有几个”，可判定本题为一般增长率问题。定位文字材料第一、二段可得：2019年全年快递业务收入7497.8亿元；2016-2018年，我国快递业务收入分别为3974.4亿元、4957.1亿元、6038.4亿元。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，可得2017-2019年，我国快递业务收入同比增速分别为：\n2017年：\u003cimg data-k=\"6966b4ca1a91\">\u003cimg data-k=\"9dc3ba3d58b7\">；\n2018年：\u003cimg data-k=\"c65610bf0e55\">\u003cimg data-k=\"0bcbfe85222c\">；\n2019年：\u003cimg data-k=\"1aad0ed8326f\">\u003cimg data-k=\"32e9acae9cf9\">。\n则2017-2019年，我国快递业务收入同比增速超过20%的年份有3个。\n故正确答案为D。","no":96,"missingImage":false},{"qid":"4817779","cat":"平均数","stem":"2019年，中部地区平均每件快递产生的快递业务收入约是西部地区的多少倍？","options":{"A":"0.5","B":"0.8","C":"1.3","D":"2.1"},"answer":"B","explanation":"根据题干“2019年······是······的多少倍”，可判定本题为现期倍数问题。定位文字材料第一段可得：2019年，我国中部、西部地区分别完成业务量81.9亿件和47亿件。全年快递业务收入7497.8亿元，其中中部、西部地区的业务收入所占比重分别为11.3%和8.5%。根据公式：地区快递业务收入=全国快递业务收入×地区占比，则所求倍数\u003cimg data-k=\"253cbc5f0ecc\">\u003cimg data-k=\"66beb36a1436\">，与B项最接近。\n故正确答案为B。","no":97,"missingImage":false},{"qid":"4817782","cat":"增长","stem":"将①同城快递、②异地快递、③国际/港澳台快递按2016-2019年业务量年均增速（以2016年为基期）从高到低排列，以下正确的是：","options":{"A":"①②③","B":"①③②","C":"③①②","D":"③②①"},"answer":"D","explanation":"根据题干“······年均增速（以2016年为基期）从高到低排列······”，可判定本题为年均增长率问题。定位统计图可知，2016年同城快递、异地快递和国际/港澳台快递业务量分别为74.1亿件、232.5亿件、6.2亿件；2019年同城快递、异地快递和国际/港澳台快递业务量分别为110.4亿件、510.4亿件、14.4亿件。根据年均增长率公式：\u003cimg data-k=\"a2f43e413ff6\">\u003cimg data-k=\"f50caea980dc\">（n为年份差），当年份差n相同时，比较\u003cimg data-k=\"13707bc49d7b\">即可。同城快递：\u003cimg data-k=\"13707bc49d7b\">\u003cimg data-k=\"727574f6e62c\">\u003cimg data-k=\"fb78aa006d22\">；异地快递：\u003cimg data-k=\"13707bc49d7b\">\u003cimg data-k=\"eafcc7fa574d\">\u003cimg data-k=\"c54205529cb4\">；国际/港澳台快递：\u003cimg data-k=\"13707bc49d7b\">\u003cimg data-k=\"7901eb4af3f9\">，则年均增速从高到低的顺序为：③国际/港澳台快递、②异地快递、①同城快递，对应D项。\n故正确答案为D。","no":98,"missingImage":false},{"qid":"4817785","cat":"增长","stem":"如保持2019年同比增量不变，则全国异地快递业务量将在哪一年首次达到同城快递业务量的10倍以上？","options":{"A":"2021年","B":"2022年","C":"2023年","D":"2024年"},"answer":"C","explanation":"根据题干“如保持2019年同比增量不变，······哪一年首次达到同城快递业务量的10倍以上”，可判定本题为现期量计算问题。结合图形材料可得：2018年、2019年同城快递业务量依次为114.1亿件、110.4亿件，2019年同比增量为110.4-114.1=-3.7亿件；2018年、2019年异地快递业务量依次为381.9亿件、510.4亿件，2019年同比增量为510.4-381.9=128.5亿件。假设n年后异地快递业务量首次达到同城快递业务量的10倍以上，即510.4+128.5n＞10×（110.4-3.7n），整理得：165.5n＞593.6，即n＞3.5，n取值为4，题目所求年份为2019+4=2023年。\n故正确答案为C。","no":99,"missingImage":false},{"qid":"4817789","cat":"综合","stem":"不能从上述资料中推出的是：","options":{"A":"2019年我国快递业务收入增速同比上升","B":"2019年东部地区快递业务收入增量大于中部地区","C":"2016-2019年我国年均快递业务收入超过5800亿元","D":"2019年我国异地快递业务量占快递业务总量的比重超过80%"},"answer":"C","explanation":"A项：定位文字材料第一段及第二段可得，2017年、2018年、2019年我国快递业务收入分别为4957.1亿元、6038.4亿元、7497.8亿元。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，则2019年我国快递业务收入增速为：\u003cimg data-k=\"1a function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";

      var r=questionScore(q,a,perQ);

      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });

    totalPts+=m.pointsOf; gotPts+=st.got;

}
