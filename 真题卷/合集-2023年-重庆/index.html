","B":"①④⑤，②③⑥","C":"①③④，②⑤⑥","D":"①③⑥，②④⑤"},"answer":"A","explanation":"本题为分组分类题目。观察发现，题干6幅图中均含有阴影部分，且形状上存在差异，故考虑阴影部分的形状。图①②③中的阴影部分均不是三角形，图④⑤⑥中的阴影部分均是三角形，即图①②③为一组，图④⑤⑥为一组。\n故正确答案为A。","no":72,"missingImage":false},{"type":"question","qid":"5510018","cat":"图形推理","stem":"下方为某一立体图形的侧视图、正视图和顶视图，请从下列选项中选出与之符合的一项：\n\u003cimg data-k=\"c4a77ca34040\" style=\"max-width:550px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"A项：选项的侧视图、正视图、顶视图如下图所示，与题干不符，排除；\n\u003cimg data-k=\"0c1f58fbab72\" style=\"max-width:601px\">\nB项：选项的侧视图、顶视图如下图所示，与题干不符，排除；\n\u003cimg data-k=\"d384e7aa78d5\" style=\"max-width:400px\">\nC项：选项的侧视图、正视图和顶视图，均与题干相符，当选；\nD项：选项的侧视图、顶视图如下图所示，与题干不符，排除。\n\u003cimg data-k=\"c61c5d2894ce\" style=\"max-width:400px\">\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"5510027","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"f6b88937cf60\" style=\"max-width:439px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"解法一：\n图形元素组成相似，优先考虑样式规律。观察发现，题干图形出现阴影、白色两种图案，考虑黑白运算。九宫格优先横向看，但是发现第一行阴影+白=阴影，第二行阴影+白=白，相同运算方式，但结果不同，考虑竖向看。观察发现，第一列：白+白=白、阴影+阴影=阴影、阴影+白=阴影、白+阴影=阴影；第二列验证此规律成立；第三列应用此规律，只有C项符合。\n解法二：\n图形元素组成相似，优先考虑样式规律。观察发现，九宫格横向看无规律，考虑竖向看，第一个图形与第二个图形进行叠加运算可得第三个图形，只有C项符合。\n故正确答案为C。","no":74,"missingImage":false},{"type":"question","qid":"5510025","cat":"图形推理","stem":"下图右框内所给几何体的展开表面中，能折叠成左框内所示几何体的是：\n（注：右框内所给几何体展开表面正反面图形完全一致）\n\u003cimg data-k=\"b95d2e582156\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查空间重构。根据题干左框几何体可知，几何体的四个正方形侧面中四个箭头首尾对应，根据题干逐一进行分析。\nA项：选项中第二行第三个正方形面的箭头指向第三行正方形面的箭头侧面，而题干几何体的四个正方形侧面中四个箭头首尾对应，选项与题干几何体不一致，排除；\nB项：选项四个含有箭头的正方形面中的箭头首尾对应，选项与题干几何体一致，当选；\nC项：选项中第二行第二个正方形面的箭头指向该行第三个正方形面的箭头侧面，而题干几何体的四个正方形侧面中四个箭头首尾对应，选项与题干几何体不一致，排除；\nD项：选项中第二行第一个正方形面的箭头没有指向第三行中相邻面的箭头的尾部，而题干几何体的四个正方形侧面中四个箭头首尾对应，选项与题干几何体不一致，排除。\n故正确答案为B。","no":75,"missingImage":false},{"type":"question","qid":"5510017","cat":"定义判断","stem":"代表性启发，是指在使用启发法时，首先会考虑借鉴要判断的事件本身或同类事件以往的经验，即以往出现的结果；可得性启发，是指在使用启发法进行判断时，人们往往会依赖最先想到的经验和信息，并认定这些容易知觉到或回想起的事件更常出现，以此作为判断的依据。\n根据上述定义，下列属于可得性启发的是：","options":{"A":"人们偏向于高估连续事件发生的概率，这往往会导致对某一计划的成功过分乐观","B":"我们知道高质量产品一般价格不菲，因此，如果某个产品很贵，我们会认为它的质量很好","C":"很多人会根据服装来判断他人社会地位的高低，看到身着高档服装的人，就认为他们更成功、社会地位更高","D":"人们在判断交通工具的安全性时，都认为乘坐飞机更危险，因为首先想到的是关于飞机失事的报道，而通常想不起火车意外事故的报道"},"answer":"D","explanation":"第一步：找出定义关键词。\n代表性启发：“首先借鉴要判断的事件本身或同类事件以往的出现的结果”；\n可得性启发：“把最先想到的经验和信息作为判断的依据”。\n第二步：逐一分析选项。\nA项：高估连续事件发生的概率，即以往连续发生的预测还会发生，借鉴的是同类事件以往出现的结果，不符合“把最先想到的经验和信息作为判断的依据”，不符合“可得性启发”定义，符合“代表性启发”定义，排除；\nB项：高质量产品一般贵，因此，如果某个产品很贵，我们会认为它的质量很好，借鉴的是同类事件以往出现的结果，不符合“把最先想到的经验和信息作为判断的依据”，不符合“可得性启发”定义，符合“代表性启发”定义，排除；\nC项：会根据服装来判断他人社会地位的高低，看到身着高档服装的人，就认为他们更成功、社会地位更高，借鉴的是同类事件以往出现的结果，不符合“把最先想到的经验和信息作为判断的依据”，不符合“可得性启发”定义，符合“代表性启发”定义，排除；\nD项：认为乘坐飞机更危险，因为首先想到的是关于飞机失事的报道，“首先想到”说明是根据最先想到的信息去判断的，符合“把最先想到的经验和信息作为判断的依据”，符合“可得性启发”定义，当选。\n故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"5510024","cat":"定义判断","stem":"在新一代信息技术形成的网络生命空间中，数字平台生态系统提供的社会化工具减少了组织创建的成本，极大地激发了社会个体创建组织的积极性，形成了虚拟世界中组织进化的新现象。大型数字平台生态系统所提供的社会化工具帮助现实社会中的个体打造了众多的数字组织，这些数字组织可以称之为社会化数字组织。\n根据上述定义，下列属于社会化数字组织的是：","options":{"A":"某地利用微博建立了网络红色文化学习社区宣传红军长征精神","B":"志愿者小李在短视频APP中组建助农协会帮助农户直播销售农产品","C":"某外卖平台响应国家号召积极吸纳来自偏远地区进城务工人员，帮助他们实现再就业","D":"登山爱好者老刘发现某社交媒体在信息交流方面十分便捷，便邀请同城登山爱好者到该社交媒体上交流登山体验"},"answer":"B","explanation":"第一步：找出定义关键词。\n“大型数字平台生态系统所提供的社会化工具”、“现实社会中的个体”、“打造了众多的数字组织”。\n第二步：逐一分析选项。\nA项：某地利用微博建立了网络红色文化学习社区，属于地方组织性行为，不符合“现实社会中的个体”，不符合定义，排除；\nB项：该项中短视频APP，符合“大型数字平台生态系统所提供的社会化工具”，志愿者小李，符合“现实社会中的个体”，组建助农协会，符合“打造了众多的数字组织”，符合定义，当选；\nC项：某外卖平台响应国家号召积极吸纳来自偏远地区进城务工人员，网络平台属于企业行为，不符合“现实社会中的个体”，帮助他们实现再就业，不符合“打造了众多的数字组织”，不符合定义，排除；\nD项：登山爱好者老刘是利用社交媒体进行交流，没有体现“打造了众多的数字组织”，不符合定义，排除。\n故正确答案为B。","no":77,"missingImage":false},{"type":"question","qid":"5510132","cat":"定义判断","stem":"数据隐私，是指个人或组织不宜公开的，需要在数据收集、数据存储、数据查询和分析、数据发布等过程中加以保护的信息。\n根据上述定义，下列哪项不属于数据隐私？","options":{"A":"小李在医院就医时，被查出患有霍乱的疾病信息","B":"小东在银行办理个人业务时登记的个人身份证号","C":"小梅在某购物网站上购买的女性物品的购物记录","D":"小雷在某股票交易软件上的交易密码"},"answer":"D","explanation":"第一步：找出定义关键词。\n“个人或组织不宜公开的”、“需要在数据收集、数据存储、数据查询和分析、数据发布等过程中加以保护的信息”。\n第二步：逐一分析选项。\nA项：霍乱是一种消化道急性传染病，其病人医疗信息属个人隐私，未经允许不得公开，医疗取用病人病情数据信息也是匿名化，符合“不宜公开的”、“需在数据收集、存储、查询和分析、发布等过程中加以保护的信息”，符合定义，排除；\nB项：小东符合“个人或组织”，其个人身份证号属于个人隐私信息，符合“个人或组织不宜公开的”、“需要在数据收集、数据存储、数据查询和分析、数据发布等过程中加以保护的信息”，符合定义，排除；\nC项：小梅在某购物网站上购买的女性物品的购物记录，其中女性物品为较为隐私的物品，不宜公开，符合“个人或组织不宜公开的”、“需要在数据收集、数据存储、数据查询和分析、数据发布等过程中加以保护的信息”，符合定义，排除；\nD项：密码是保护个人账户和数据隐私的一种方式，但密码本身并不等同于数据隐私，不符合“需要在数据收集、数据存储、数据查询和分析、数据发布等过程中加以保护的信息”，不符合定义，当选。\n注：如下图，通过查询相关文献可知，密码是获取我们数据隐私的“钥匙”，但密码本身并不等同于数据隐私。\n\u003cimg data-k=\"9587819d3bf8\" style=\"max-width:650px\">\n经过查询，A、B、C项对应为数据隐私中不同的几个方面，如下：\n\u003cimg data-k=\"bcdeff922a8b\" style=\"max-width:396px\">\n本题为选非题，故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"5510031","cat":"定义判断","stem":"生态恢复岸线是指通过人工直接或间接实施保护修复工程或在常年潮汐、冲淤等自然力作用下，将原来的人工岸线最大限度地恢复海岸自然形态、地貌单元，恢复和改善海岸生态功能的岸线。生态恢复岸线具有独特的地理、形态和动态特征，是海陆分界的地理要素，具有重要的生态功能和资源价值。\n根据上述定义，下列属于生态恢复岸线的是：","options":{"A":"将自然海岸形态改变成人工海岸形态的堤坝","B":"某港口城市全力打造的生态美、人气旺的黄金旅游岸线","C":"某海滨城市修复建设的具有自然岸滩形态特征和生态功能的海堤","D":"保持自然生态属性特征，没有因人类活动而改变形态和属性的海岸线"},"answer":"C","explanation":"第一步：找出定义关键词。\n“通过人工直接或间接实施保护修复工程或在常年潮汐、冲淤等自然力作用下”、“将原来的人工岸线最大限度地恢复海岸自然形态、地貌单元”、“恢复和改善海岸生态功能的岸线”。\n第二步：逐一分析选项。\nA项：该项是将自然海岸形态改变成人工海岸形态的堤坝，而不是恢复和改善海岸的生态功能，不符合“将原来的人工岸线最大限度地恢复海岸自然形态、地貌单元”、“恢复和改善海岸生态功能的岸线”，不符合定义，排除；\nB项：某港口城市打造的生态美、人气旺的黄金旅游岸线，不明确是否恢复和改善了海岸的生态功能，不符合“将原来的人工岸线最大限度地恢复海岸自然形态、地貌单元”、“恢复和改善海岸生态功能的岸线”，不符合定义，排除；\nC项：某海滨城市修复建设，符合“通过人工直接或间接实施保护修复工程或在常年潮汐、冲淤等自然力作用下”，修复建设具有自然岸滩形态特征和生态功能的海堤，符合“将原来的人工岸线最大限度地恢复海岸自然形态、地貌单元”、“恢复和改善海岸生态功能的岸线”，符合定义，当选；\nD项：保持自然生态属性特征，没有因人类活动而改变形态和属性的海岸线，本身就是自然形态，不存在恢复和改善的过程，不符合“将原来的人工岸线最大限度地恢复海岸自然形态、地貌单元”、“恢复和改善海岸生态功能的岸线”，不符合定义，排除。\n故正确答案为C。","no":79,"missingImage":false},{"type":"question","qid":"5510052","cat":"定义判断","stem":"环境吸收能力是指自然环境对人类在生产生活过程中产生的废弃物具有自动容纳、吸收和消化的能力。理论上，由于环境吸收能力的存在，地球自身的力量是可以将环境恢复到原有或相近的活力水平，资源环境退化并不是不可逆的。\n根据上述定义，下列属于环境吸收能力的是：","options":{"A":"某地开展农村人居环境整治行动，加强固体废弃物和垃圾处置","B":"某县通过环境治理，提升了当地环境资源所能容纳的人口和经济规模","C":"某市为高载能产业寻求发展空间，测算出该城市大气允许承载污染物的最大数量","D":"PM2.5能够被大自然转化为对生态系统造成危害较小的物质，甚至能进一步被分解达到无害的状态"},"answer":"D","explanation":"第一步：找出定义关键词。\n“自然环境对人类产生的废弃物具有自动容纳、吸收和消化的能力”。\n第二步：逐一分析选项。\nA项：某地开展整治行动加强固体废弃物和垃圾处置，没有体现出自然环境自动容纳、吸收和消化人类产生的废弃物，不符合“自然环境对人类产生的废弃物具有自动容纳、吸收和消化的能力”，不符合定义，排除；\nB项：某县通过环境治理提升环境资源能容纳的人口和经济规模，没有体现出自然环境自动容纳、吸收和消化人类产生的废弃物，不符合“自然环境对人类产生的废弃物具有自动容纳、吸收和消化的能力”，不符合定义，排除；\nC项：某市测算出该城市大气承载污染物的最大数量，没有体现出自然环境自动容纳、吸收和消化人类产生的废弃物，不符合“自然环境对人类产生的废弃物具有自动容纳、吸收和消化的能力”，不符合定义，排除；\nD项：PM2.5被大自然转化成对生态系统造成危害较小的物质，甚至达到无害的状态，是自然环境消化了人类产生的废弃物，符合“自然环境对人类产生的废弃物具有自动容纳、吸收和消化的能力”，符合定义，当选。\n故正确答案为D。","no":80,"missingImage":false},{"type":"question","qid":"5510013","cat":"定义判断","stem":"生物修复就是利用生物的生命代谢活动减少被污染的环境中的有毒有害物的浓度或使其无害化，从而使被污染了的环境能够部分地或完全地恢复到原初状态的过程。\n根据上述定义，下列不属于生物修复的是：","options":{"A":"在被重金属污染的土壤中种植能吸附重金属的蜈蚣草，通过收割蜈蚣草带走土壤里的部分重金属","B":"用玉米等粮食作物做成的降解塑料袋替代传统塑料袋，解决丢弃传统塑料对环境造成的污染问题","C":"利用硝化细菌、芽孢杆菌等微生物菌降解河道有机污染物，治理被污水和垃圾污染的城市河流","D":"在人工水产养殖场中投放一些藻类，利用菌藻共生关系，对池塘里的污物进行处理和净化"},"answer":"B","explanation":"第一步：找出定义关键词。\n“利用生物的生命代谢活动”、“减少被污染的环境中的有毒有害物的浓度”、“使被污染了的环境能够部分地或完全地恢复到原初状态”。\n第二步：逐一分析选项。\nA项：利用蜈蚣草吸收土壤中的重金属，符合“利用生物的生命代谢活动”、“减少被污染的环境中的有毒有害物的浓度”，符合定义，排除；\nB项：使用玉米等粮食作物做成的降解塑料袋来减少环境污染，玉米等粮食是降解塑料袋的原材料，不涉及生物的生命代谢活动，不符合“利用生物的生命代谢活动”、“减少被污染的环境中的有毒有害物的浓度”，不符合定义，当选；\nC项：利用微生物菌降解河道有机污染物，符合“利用生物的生命代谢活动”、“减少被污染的环境中的有毒有害物的浓度”，符合定义，排除；\nD项：利用菌藻共生关系，处理和净化池塘里的污物，符合“利用生物的生命代谢活动”、“减少被污染的环境中的有毒有害物的浓度”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":81,"missingImage":false},{"type":"question","qid":"5510062","cat":"定义判断","stem":"被害人盲点症是指被害人出于某种迫切的需要和急切的欲望，以致注意力狭窄、判断力减弱甚至轻度丧失理智，对自己所处的危险或面临的风险视而不见的一种状态。\n根据上述定义，下列不属于被害人盲点症的是：","options":{"A":"王某为强身健体高价购买大量伪劣保健品","B":"林某在公交车上因争抢座位不慎滑倒受伤","C":"为谋高额回报黄某兼职网络刷单导致经济受损","D":"幻想通过理财一夜暴富的刘某给了骗子可乘之机"},"answer":"B","explanation":"第一步：找出定义关键词。\n“被害人出于某种迫切的需要和急切的欲望”、“注意力狭窄、判断力减弱甚至轻度丧失理智”、“对自己所处的危险或面临的风险视而不见”。\n第二步：逐一分析选项。\nA项：王某为强身健体，符合“被害人出于某种迫切的需要和急切的欲望”，高价购买大量伪劣保健品，符合“注意力狭窄、判断力减弱甚至轻度丧失理智”、“对自己所处的危险或面临的风险视而不见”，符合定义，排除； \nB项：林某不慎滑倒是林某自己不小心所致，没有人要害他，不符合“被害人”，不符合定义，当选；\nC项：黄某为谋高额回报，符合“被害人出于某种迫切的需要和急切的欲望”，黄某网络刷单导致经济受损，符合“注意力狭窄、判断力减弱甚至轻度丧失理智”、“对自己所处的危险或面临的风险视而不见”，符合定义，排除；\nD项：刘某幻想通过理财一夜暴富，符合“被害人出于某种迫切的需要和急切的欲望”，刘某给了骗子可乘之机，符合“注意力狭窄、判断力减弱甚至轻度丧失理智”、“对自己所处的危险或面临的风险视而不见”，符合定义，排除；\n本题为选非题，故正确答案为B。","no":82,"missingImage":false},{"type":"question","qid":"5510135","cat":"定义判断","stem":"大气中水汽直接在地面或地物表面及低空的凝结物，称为隐匿性降水。由空中降落到地面上的水汽凝结物，称为直接性降水。\n根据上述定义，下列属于隐匿性降水的是：","options":{"A":"夜深烟火灭，霰雪落纷纷——白居易《秦中吟》","B":"广寒宫中珠径雨，狂风倾下九天来——邓肃《雹》","C":"神农架景区温度大幅下降至零下3度，迎来了入秋后的雾凇奇观","D":"雨凇边降边冻，粘附在裸露物的外表而不流失，形成越来越厚的冰层"},"answer":"C","explanation":"第一步：找出定义关键词。\n隐匿性降水：“大气中水汽”、“直接在地面或地物表面及低空的凝结物”；\n直接性降水：“由空中降落到地面上的水汽凝结物”。\n第二步：逐一分析选项。\nA项：夜深烟火灭，霰雪落纷纷，意思是夜深人静，烟火无痕，雨雪夹杂，纷纷飘零，雨雪属于空气中的凝结物，不符合“直接在地面或地物表面及低空的凝结物”，不符合“隐匿性降水”定义，符合“直接性降水”定义，排除；\nB项：广寒宫中珠径雨，狂风倾下九天来，意思是广寒宫下的雨雹好似珍珠那么大，狂风从九天倾巢而出，描写的是雨，属于空气中的凝结物，不符合“直接在地面或地物表面及低空的凝结物”，不符合“隐匿性降水”定义，符合“直接性降水”定义，排除；\nC项：雾凇是由冰晶在温度低于冰点以下的物体上形成的白色不透明粒状结构沉积物，是低温时空气中水汽直接冻结在物体上形成的，符合“直接在地面或地物表面及低空的凝结物”，符合“隐匿性降水”定义，当选；\nD项：雨凇是由于降雨附着于物体表面不断聚集形成的白色沉积物，与降雨有关，不符合“直接在地面或地物表面及低空的凝结物”，不符合“隐匿性降水”定义，排除。\n故正确答案为C。","no":83,"missingImage":false},{"type":"question","qid":"5510020","cat":"定义判断","stem":"法律规范包含多种类型。授权性规范，是规定法律主体可以为一定行为或不为一定行为的法律规范。义务性规范，是规定法律主体必须为一定行为的法律规范。禁止性规范，是规定禁止法律主体为一定行为的法律规范。\n根据上述定义，下列属于禁止性规范的是：","options":{"A":"自然人决定、变更姓名，或者法人、非法人组织决定、变更、转让名称的，应当依法向有关机关办理登记手续，但是法律另有规定的除外","B":"对亲子关系有异议且有正当理由的，父或者母可以向人民法院提起诉讼，请求确认或者否认亲子关系","C":"任何组织或者个人不得以丑化、污损或者利用信息技术手段伪造等方式侵害他人肖像权","D":"因正当防卫造成损害的，不承担民事责任"},"answer":"C","explanation":"第一步：找出定义关键词。\n授权性规范：“法律主体可以为一定行为或不为一定行为”；\n义务性规范：“法律主体必须为一定行为”；\n禁止性规范：“禁止法律主体为一定行为”。\n第二步：逐一分析选项。\nA项：自然人决定、变更姓名，或者法人、非法人组织决定、变更、转让名称的，应当依法向有关机关办理登记手续，“应当”不符合“禁止法律主体为一定行为”，符合“义务性规范”定义，不符合“禁止性规范”定义，排除；\nB项：对亲子关系有异议且有正当理由的，父或者母可以向人民法院提起诉讼，“可以诉讼”不符合“禁止法律主体为一定行为”，符合“授权性规范”定义，不符合“禁止性规范”定义，排除；\nC项：任何组织或者个人不得以丑化、污损或者利用信息技术手段伪造等方式侵害他人肖像权，“不得”说明是“禁止法律主体为一定行为”，符合“禁止性规范”定义，当选；\nD项：因正当防卫造成损害的，不承担民事责任，“不承担”说明是可以不用承担，不符合“禁止法律主体为一定行为”，符合“授权性规范”定义，不符合“禁止性规范”定义，排除。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"5510010","cat":"定义判断","stem":"商业效用原则是商事实践中发展出来的一项交易惯例，市场主体提供的商品、服务以及其他标的物应当能够发挥基本的功能作用，如果欠缺必要的使用条件或者辅助设施导致其交易目的落空的，应当予以补足。最佳效用原则是指通过配置组合，使得资源能够最大程度地发挥效能，提高利用效率。\n根据上述定义，下列选项最能体现商业效用原则的是：","options":{"A":"开发商销售商品房赠送车位","B":"商家促销“买桌子送椅子”","C":"出售的地下酒窖附带出入通道","D":"购买家电享受“三包服务”"},"answer":"C","explanation":"第一步：找出定义关键词。\n商业效用原则：“发挥基本的功能作用”、“欠缺必要的使用条件或者辅助设施导致其交易目的落空的，应当予以补足”；\n最佳效用原则：“通过配置组合”、“使资源能够最大程度地发挥效能，提高利用效率”。\n第二步：逐一分析选项。\nA项：商品房的基本功能作用是居住，赠送的车位并不是发挥居住功能的必要使用条件或辅助设施，不符合“必要的使用条件或者辅助设施”，不符合定义，排除；\nB项：买的桌子可以发挥它的基本功能作用，椅子不是桌子发挥功能作用的必要使用条件，不符合“必要的使用条件或者辅助设施”，不符合定义，排除；\nC项：地下酒窖想要发挥作用就要去到地下，如果缺失出入通道就会导致交易落空，符合“必要的使用条件或者辅助设施”，符合定义，当选；\nD项：购买的家电可以发挥基本的功能作用，“三包服务”不是家电发挥功能作用的必要使用条件，不符合“必要的使用条件或者辅助设施”，不符合定义，排除。\n故正确答案为C。","no":85,"missingImage":false},{"type":"question","qid":"5510022","cat":"类比推理","stem":"天荒地老：海枯石烂","options":{"A":"同心同德：反目成仇","B":"披荆斩棘：斩钉截铁","C":"孜孜矻矻：夙夜不懈","D":"望而却步：望风披靡"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“天荒地老”意思是天荒秽，地衰老，指经历的时间极久远。“海枯石烂”意思是海水干涸、石头腐烂，形容历时久远。二者均形容历时久远，二者为近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“同心同德”指思想行动一致。“反目成仇”指翻脸而变成仇敌。二者无明显逻辑关系，与题干逻辑关系不一致，排除；\nB项：“披荆斩棘”指拨开荆丛，砍掉荆棘，比喻开创事业或在前进道路上清除障碍，艰苦奋斗。“斩钉截铁”指砍断钉子切断铁，形容说话或行动坚决果断，毫不犹豫。二者无明显逻辑关系，与题干逻辑关系不一致，排除；\nC项：“孜孜矻矻”形容勤勉不懈怠的样子。“夙夜不懈”指日夜谨慎工作，勤奋不懈。二者均指勤勉不懈怠，二者为近义关系，与题干逻辑关系一致，当选；\nD项：“望而却步”指看到了危险或力不能及的事而往后退缩。“望风披靡”比喻军队毫无斗志，老远看到对方的气势很盛，没有交锋就溃散了。二者无明显逻辑关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":86,"missingImage":false},{"type":"question","qid":"5510015","cat":"类比推理","stem":"葡萄：葡萄酒","options":{"A":"黄金：黄金档","B":"香蕉：香蕉水","C":"杜鹃：杜鹃花","D":"枇杷：枇杷膏"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n葡萄是制作葡萄酒的原材料，二者构成原材料的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：黄金档是指电视开机观众数最广泛的时段的通称，后者是根据前者的内在特性进行类比而命名的，二者不构成原材料的对应关系，与题干逻辑关系不一致，排除；\nB项：香蕉水，又名天那水、梨油，因有乙酸戊酯或乙酸异戊酯的香蕉味，故得名香蕉水，后者是根据其味道类似前者而命名的，二者不构成原材料的对应关系，与题干逻辑关系不一致，排除；\nC项：杜鹃既可以指杜鹃花，也可以指杜鹃鸟，杜鹃与杜鹃花不是原材料的对应关系，与题干逻辑关系不一致，排除；\nD项：枇杷是制作枇杷膏的原材料，二者构成原材料的对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":87,"missingImage":false},{"type":"question","qid":"5510060","cat":"类比推理","stem":"历史朝代：东汉：北宋","options":{"A":"热带气旋：台风：飓风","B":"敬辞称谓：家父：令尊","C":"十二时辰：丑时：午时","D":"交通工具：火车：马车"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n东汉和北宋都是中国历史朝代之一，二者是并列关系，都与历史朝代构成组成关系，且东汉在前，北宋在后。\n第二步：判断选项词语间逻辑关系。\nA项：台风发生在太平洋西部和南海，飓风发生大西洋西部，台风和飓风都是“一种”热带气旋，与热带气旋构成种属关系，台风与飓风也没有时间的先后，与题干逻辑关系不一致，排除；\nB项：家父是对人谦称自己的父亲的称呼，不是敬辞称谓，令尊是称对方父亲的敬词，是“一种”敬辞称谓，与敬辞称谓构成种属关系，家父与令尊也没有时间的先后，与题干逻辑关系不一致，排除；\nC项：十二时辰即：子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥，丑时和午时是并列关系，都与十二时辰构成组成关系，且丑时在前，午时在后，与题干逻辑关系一致，当选；\nD项：火车和马车都是“一种”交通工具，与交通工具构成种属关系，通常马车更早产生，火车是工业时代产物，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":88,"missingImage":false},{"type":"question","qid":"5510141","cat":"类比推理","stem":"细胞核：细胞质：细胞","options":{"A":"绝缘体：半导体：导电","B":"碳中和：碳达峰：环保","C":"真皮：表皮：皮肤","D":"牙冠：牙齿：牙龈"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n细胞核和细胞质都是细胞的组成部分，第一词与第二词为并列关系，均与第三词为组成关系。\n第二步：判断选项词语间逻辑关系。\nA项：绝缘体与半导体为并列关系，绝缘体不容易导电，半导体可以导电，二者与导电不是组成关系，与题干逻辑关系不一致，排除；\nB项：碳中和与碳达峰都是我国针对碳排放提出的目标，二者为并列关系，实现碳中和、碳达峰目标有利于环保，二者与环保不是组成关系，与题干逻辑关系不一致，排除；\nC项：真皮和表皮都是皮肤的组成部分，第一词与第二词为并列关系，均与第三词为组成关系，与题干逻辑关系一致，当选；\nD项：牙冠是牙齿的组成部分，二者为组成关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":89,"missingImage":false},{"type":"question","qid":"5510144","cat":"类比推理","stem":"佶屈聱牙 对于 （    ） 相当于 （    ） 对于 教诲","options":{"A":"文句；春风化雨","B":"书写；和光同尘","C":"表达；无微不至","D":"描述；刚柔相济"},"answer":"A","explanation":"逐一代入选项。\nA项：“佶屈聱牙”形容“文句”艰涩，读起来不顺口，二者为对应关系；“春风化雨”比喻师长潜移默化的谆谆“教诲”，二者为对应关系，前后逻辑关系一致，当选；\nB项：“佶屈聱牙”与“书写”无明显逻辑关系；“和光同尘”比喻随俗而处，不露锋芒，多指随波逐流，与“教诲”无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：“佶屈聱牙”与“表达”无明显逻辑关系；“无微不至”形容关心、照顾得非常细致、周到，与“教诲”无明显逻辑关系，前后逻辑关系不一致，排除；\nD项：“佶屈聱牙”与“描述”无明显逻辑关系；“刚柔相济”是指既有刚强的一面，也有柔和的一面，二者互相补充、配合，与“教诲”无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为A。","no":90,"missingImage":false},{"type":"question","qid":"5510026","cat":"逻辑判断","stem":"一项新研究正在给金星云层中存在生命的可能性泼冷水。科学家研究报告显示，这颗灼热行星的云层中没有足够的水蒸气来维持众所周知的生命形式。因此，国际天文学界认为金星不可能有生命。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"研究人员认定，金星的云层中有足够的水，其大气温度也适合维持生命","B":"研究发现金星云层的水含量仅相当于维持类地生命所需水含量的百分之一","C":"在地球上，磷化氢是一种与生命有关的气体，而金星大气中含有大量的磷化氢","D":"最新的金星生态系统仿真模拟显示，金星的液态水可能维持大约30亿年，只是在7亿5千万年前金星才变得不适合居住"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：国际天文学界认为金星不可能有生命。\n论据：科学家研究报告显示，这颗灼热行星的云层中没有足够的水蒸气来维持众所周知的生命形式。\n论点讨论的是金星不可能有生命，论据讨论的是金星没有足够的水蒸气来维持生命，二者都在讨论金星是否存在生命，话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项讨论的是金星的云层中有足够的水，其大气温度也适合维持生命，说明金星可能有生命，削弱项，无法加强，排除；\nB项：该项讨论的是金星云层的水含量仅相当于维持类地生命所需水含量的百分之一，说明没有足够的水分来维持生命，补充论据，可以加强，当选；\nC项：该项讨论的是金星大气中含有大量的磷化氢，而磷化氢是与生命有关的气体，说明金星可能有生命，削弱项，无法加强，排除；\nD项：该项讨论的是金星适合不适合居住的问题，而题干讨论的是金星存不存在生命，话题不一致，无法加强，排除。\n故正确答案为B。","no":91,"missingImage":false},{"type":"question","qid":"5510011","cat":"逻辑判断","stem":"由于剖宫产分娩是无菌分娩，分娩时胎儿不会接触到妈妈产道中的有益菌群，使得剖宫产宝宝的肠道菌群定植迟缓，影响免疫系统的发育，过敏风险也随之升高。要降低剖宫产宝宝的过敏风险，家长们需要把好饮食关。专家指出，母乳喂养可降低剖宫产宝宝过敏风险。母乳中含有双歧杆菌等益生菌，可帮助宝宝建立健康肠道菌群，训练免疫系统，降低过敏风险。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"剖宫产宝宝肠道健康菌群的建立，比自然分娩宝宝晚约6个月","B":"研究显示，母乳喂养期间母亲进食易过敏食物，会增加宝宝过敏风险","C":"母乳致敏性低，是因为宝宝的免疫系统能将其中的蛋白质识别为“自己的”","D":"把高致敏性的普通牛奶蛋白变成低致敏性的小分子蛋白质，可以降低宝宝过敏的风险"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：母乳喂养可降低剖宫产宝宝过敏风险。\n论据：母乳中含有双歧杆菌等益生菌，可帮助宝宝建立健康肠道菌群，训练免疫系统，降低过敏风险。\n论据讨论的是“母乳中含有的双歧杆菌等益生菌可帮助宝宝降低过敏风险”，论点说的是“母乳喂养可降低剖宫产宝宝过敏风险”，论据和论点话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项是在说剖宫产宝宝肠道健康菌群的建立，比自然分娩宝宝晚约6个月，并未提及母乳喂养，话题不一致，无法加强，排除；\nB项：该项是在说母乳喂养期间母亲进食易过敏食物会增加宝宝过敏风险，但并不清楚母亲如果正常饮食期间母乳喂养会不会降低宝宝过敏风险，为无关项，无法加强，排除；\nC项：母乳致敏性低，是因为宝宝的免疫系统能将其中的蛋白质识别为“自己的”，解释了为什么母乳喂养可以降低宝宝的过敏反应，补充论据，当选；\nD项：把高致敏性的普通牛奶蛋白变成低致敏性的小分子蛋白质，可以降低宝宝过敏的风险，是在指出其他可以降低宝宝过敏风险的办法，但并没提及母乳喂养会不会降低宝宝过敏风险，为无关项，无法加强，排除。\n故正确答案为C。","no":92,"missingImage":false},{"type":"question","qid":"5510034","cat":"逻辑判断","stem":"长距离的地下运输管道在遭遇重大地质断层事件或较大地面运动时可能遭到灾难性的破坏。研究人员开发出一种经济有效的方法，用膨胀聚苯乙烯（EPS）土工泡沫块对管道进行保护，并基于先进的三维计算机模型，评估了在水平断层破裂情况下，由这种土工泡沫块所保护的管道的机械性能。结果发现，它们可以在断层破裂时自压缩，从而减少周围土壤对管道施加的压力，保证了管道即使遭遇水平断层破裂的情况时仍可正常运行。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"土工泡沫块是一种廉价轻质材料的聚合物，抗压性较低","B":"土工泡沫块保护下的管道可以承受极高强度的构造变形","C":"三维计算机模型评估了土工泡沫块所保护的管道的机械性能","D":"土工泡沫块这种材料可变形，因而具有出色的保护管道的性能"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：它们（膨胀聚苯乙烯（EPS）土工泡沫块）可以在断层破裂时自压缩，从而减少周围土壤对管道施加的压力，保证了管道即使遭遇水平断层破裂的情况时仍可正常运行。\n本题只有论点，加强考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说明土工泡沫块廉价轻质，抗压性较低，无法说明其是否能保护管道，无法加强，排除；\nB项：该项说明在土工泡沫块保护下的管道可以承受极高强度的构造变形，故能够保证管道在遭遇水平断层破裂时的正常运行，补充论据，可以加强，保留；\nC项：该项说明三维计算机模型评估了土工泡沫块所保护的管道的机械性能，但评估结果未知，因此无法得知管道在遭遇水平断层破裂时能否正常运行，无法加强，排除;\nD项：该项说明土工泡沫块有出色的保护管道的性能，补充论据，可以加强，保留。\n对比B、D两项，B项强调了土工泡沫块保护管道的结果是管道可以承受极高强度的构造变形，因此，当管道遭遇水平断层破裂时仍能正常运行，而D项仅强调了土工泡沫块可以保护管道，但未说明保护后管道的强度如何，因此无法得知保护后管道是否能在水平断层破裂的情况下正常运行。B项与论点话题更接近，当选。\n故正确答案为B。","no":93,"missingImage":false},{"type":"question","qid":"5510051","cat":"逻辑判断","stem":"某研究机构提取了1200多名女性研究对象最靠近头皮的3厘米头发，这代表过去3个月新长出的头发。研究人员随后对这些女性进行了一项包含10个问题的调查，以了解她们的压力程度。结果表明，压力水平排在前五名的女性头发中含有的皮质醇水平比排在后五名的女性高出24.3%。研究发现，压力水平会反映在头发中储存的皮质醇的含量上。\n以下哪项如果为真，最能削弱上述论证？","options":{"A":"长期的压力会对身体产生负面影响，头发则可以显示出人们的压力水平","B":"皮质醇被称为“压力荷尔蒙”，在身体处于“战斗或逃避”模式时释放","C":"压力通过释放荷尔蒙改变头发色素沉着，使其变灰或变白，甚至导致脱落","D":"皮质醇是大自然在人体的内置警报系统，但压力不是它产生的唯一原因"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：压力水平会反映在头发中储存的皮质醇的含量上。\n论据：压力水平排在前五名的女性头发中含有的皮质醇水平比排在后五名的女性高出24.3%。\n本题的论点论据都是在说皮质醇和压力之间的关系，话题是一致的，故削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：头发可以显示出人们的压力水平，表明头发与压力之间有联系，但不明确是否是头发中的“皮质醇”，无法削弱，排除；\nB项：皮质醇被称为“压力荷尔蒙”，在身体处于“战斗或逃避”模式时释放，表明皮质醇的产生与压力确实有关，可以加强，无法削弱，排除；\nC项：表明压力对头发的危害，但没提到“皮质醇”，无法削弱，排除；\nD项：表明压力不是皮质醇产生的唯一原因，否定了压力和皮质醇之间的必然关系，削弱论点，当选。\n故正确答案为D。","no":94,"missingImage":false},{"type":"question","qid":"5510006","cat":"逻辑判断","stem":"牛蛙这一水产品种在过去无人问津，现今却成为人们餐桌上的美食。打工族在夜晚加班后，吃上一盘“泡椒牛蛙”或“干锅牛蛙”，顿时神清气爽，干劲十足。但随着牛蛙美食的普及，食品安全问题引发了社会关注。有报道称：牛蛙体内含有幼虫裂头蚴、广州管圆线虫等能够在人体寄生的寄生虫，食入带有这些寄生虫的牛蛙，会严重影响人体健康。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"经过高温烹饪，牛蛙身上的寄生虫会被全部杀死","B":"淡水虾蟹中含有肺吸虫，人感染肺吸虫会咳血、呼吸困难","C":"实验室对生态养殖的牛蛙进行解剖，未发现任何裂头蚴寄生虫","D":"牛蛙身上还存在只能在牛蛙本体内寄生而不会传染给人类的寄生虫"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：牛蛙体内含有幼虫裂头蚴、广州管圆线虫等能够在人体寄生的寄生虫，食入带有这些寄生虫的牛蛙，会严重影响人体健康。\n论据：无。\n本题只有论点没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出经过高温烹饪，牛蛙身上的寄生虫会被全部杀死，说明带有寄生虫的牛蛙经过高温烹饪后食用并不会影响人体健康，削弱论点，可以削弱，保留；\nB项：该项指出淡水虾蟹中的肺吸虫会对人体造成影响，与论点讨论的牛蛙体内的寄生虫是否会对人体造成影响无关，话题不一致，无法削弱，排除；\nC项：该项指出生态养殖的牛蛙体内没有发现裂头蚴寄生虫，说明生态养殖的牛蛙不会影响身体健康，削弱论点，可以削弱，保留；\nD项：该项指出牛蛙体内存在不会传染给人类的寄生虫，与论点讨论的牛蛙体内能在人体寄生的寄生虫是否会影响人体健康无关，无法削弱，排除。\n对比A、C两项，A项说的是牛蛙身上所有的寄生虫会被高温杀死，而C项只提到了裂头蚴寄生虫这一种寄生虫，综合对比，A项是整体性削弱，C项是部分削弱，A项的削弱力度大于C项，因此优选A项。\n故正确答案为A。","no":95,"missingImage":false},{"type":"question","qid":"5510041","cat":"逻辑判断","stem":"油脂是由甘油和脂肪酸结合在一起形成的链状分子，可可脂和黄油都是由无数油脂分子聚集在一起形成的，但是它们熔化方式不一样。黄油是随温度上升一点点从固体变为液体，可可脂却是达到熔点时瞬间熔化。科学分析发现，黄油是由100种以上各种各样的油脂混合在一起形成的，而可可脂则只由3种油脂构成。\n由此可以推出：","options":{"A":"黄油和可可脂熔化所需的温度不一样，可可脂所需温度更高","B":"黄油和可可脂熔化所需要的温度不固定，依环境变化而变化","C":"黄油经常用于烹饪，因为其油脂熔化方式对人体健康更有好处","D":"黄油中的各种油脂性质差异较大，而可可脂中的不同油脂熔点相近"},"answer":"D","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：选项指出可可脂熔化所需的温度比黄油更高，而题干中只是表述了“黄油是随温度上升一点点从固体变为液体，可可脂却是达到熔点时瞬间熔化”，并未涉及二者熔化所需温度之间的比较，无中生有，无法推出，排除；\nB项：选项指出黄油和可可脂熔化所需要的温度依环境变化而变化，而题干中只是表述了“黄油是随温度上升一点点从固体变为液体，可可脂却是达到熔点时瞬间熔化”，并未提及二者熔化所需的温度会依环境变化而变化，无中生有，无法推出，排除；\nC项：选项指出黄油因为其油脂熔化方式对人体健康更有好处，所以经常用于烹饪，而题干中并未提及相关内容，无中生有，无法推出，排除；\nD项：根据题干中“黄油是随温度上升一点点从固体变为液体，可可脂却是达到熔点时瞬间熔化”且“黄油是由100种以上各种各样的油脂混合在一起形成的，而可可脂则只由3种油脂构成”可推知，可可脂中的各种油脂少且熔点相近，而黄油中的各种油脂多且熔点不相近，因此黄油中的各种油脂性质差异较大，可以推出，当选。\n故正确答案为D。","no":96,"missingImage":false},{"type":"question","qid":"5510009","cat":"逻辑判断","stem":"北极放大效应是指冰雪和气温之间容易形成正反馈，即气温升高则冰雪消融增多，没有冰雪覆盖的裸地能吸收更多的太阳辐射，加热大气，进一步加剧冰雪消融。观测显示，位于北极格陵兰岛的大多数冰川都呈现出消退趋势，这是世界上流失速度最快的冰川之一。因此，格陵兰岛的冰川消融受到放大效应影响。\n要得到上述结论，需要补充的前提是：","options":{"A":"近30年，格陵兰岛冰川融化已导致全球海平面上升了11毫米，如果全部融化，全球海平面预计会上升7米","B":"格陵兰岛冰川消退会导致大大小小冰川入海，形成冰山，进而导致海啸，摧毁近岸上因纽特人的家园","C":"格陵兰岛的冰川融化后显现出大量陆地，陆地比海洋吸收热量更快","D":"同样是极地，南极地区的冰川消退并不明显"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：格陵兰岛的冰川消融受到放大效应影响。\n论据：北极放大效应是指冰雪和气温之间容易形成正反馈，即气温升高则冰雪消融增多，没有冰雪覆盖的裸地能吸收更多的太阳辐射，加热大气，进一步加剧冰雪消融。观测显示，位于北极格陵兰岛的大多数冰川都呈现出消退趋势，这是世界上流失速度最快的冰川之一。\n本题论据讨论的放大效应是指“一方面气温升高则冰雪消融增多；另一方面没有冰雪覆盖的裸地能吸收更多的太阳辐射，进一步加剧冰雪消融”，论据现已知北极格陵兰岛的冰川呈现出消退趋势，只涉及了“放大效应”中第一方面的内容，要想推出论点“格陵兰岛的冰川消融受到放大效应影响”，需补上另一方面，即“格陵兰岛出现了裸地，且吸收了更多的太阳辐射”。\n第二步：逐一分析选项。\nA项：该项指出格陵兰岛冰川消融导致了全球海平面上升，但是不明确格陵兰岛的冰川消融是否是受到了放大效应影响，为不明确项，无法加强，排除；\nB项：该项指出格陵兰岛冰川消退会导致海啸，而论点讨论的是格陵兰岛的冰川消融是否是受到了放大效应的影响，话题不一致，无法加强，排除；\nC项：该项指出格陵兰岛的冰川融化后显现出大量陆地，陆地比海洋吸收热量更快，补上了“格陵兰岛确实受到放大效应影响”中另一方面的内容，可以加强，当选；\nD项：该项讨论的是南极地区的冰川消退不明显，而论点讨论的格陵兰岛属于北极地区，话题不一致，无法加强，排除。\n故正确答案为C。","no":97,"missingImage":false},{"type":"question","qid":"5510007","cat":"逻辑判断","stem":"心脏是被神经系统控制的，调控心脏的神经是交感神经和迷走神经。安静状态下，迷走神经对心脏的调控比较强，心跳每分钟75次左右；运动或情绪激动的时候，交感神经对心脏的调控比较强，心跳会加快，收缩力也会加强。在血管壁、胃肠道、生殖系统等处都分布着各种内脏平滑肌，平滑肌运动同样受到神经支配。比如，胃肠道平滑肌接受交感神经和迷走神经的双重支配。交感神经兴奋使胃肠道运动减弱，而迷走神经兴奋则使胃肠道运动加强。\n由此可以推出：","options":{"A":"交感神经或迷走神经对心脏和胃肠的调控不同则产生不同的效应","B":"调控内脏器官的神经是交感神经和迷走神经，它们不受意识支配","C":"要保护我们的内脏器官，必须合理地使用大脑，维持良好的情绪","D":"冠心病、胃溃疡之类的疾病也与神经系统的“功能失常”有关系"},"answer":"A","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干第二句话指出在安静和运动或情绪激动状态下，迷走神经和交感神经对心脏的调控力度不同，且产生了不同的效应，第四句话和第五句话指出交感神经和迷走神经对胃肠道不同的调控力度及产生的不同效应，可以推出，当选；\nB项：题干第一句话指出交感神经和迷走神经是调控心脏的神经，而选项说的是调控内脏器官的神经，且题干未提及神经是否受意识的支配，无中生有，无法推出，排除；\nC项：题干未提及“保护内脏器官”与“合理使用大脑”的关系，无中生有，无法推出，排除；\nD项：题干未提及“冠心病、胃溃疡”与“神经系统功能失常”的关系，无中生有，无法推出，排除。\n故正确答案为A。","no":98,"missingImage":false},{"type":"question","qid":"5510147","cat":"类比推理","stem":"某医院刘佳、郑毅、郭斌、丁晓、吴芳、施文6位医生拟报名参加“一心向党，健康为民”进社区义诊活动，已知下列情况为真：\n（1）要么刘佳参加，要么郑毅参加；\n（2）只有吴芳参加，刘佳才参加；\n（3）如果郭斌和吴芳都参加，那么施文也会参加；\n（4）或者丁晓不参加，或者郭斌参加；\n（5）施文、丁晓至少有1人参加。\n现施文确定无法参加，那么6位医生中最后参加义诊活动的是：","options":{"A":"刘佳、郭斌、丁晓","B":"郑毅、郭斌、丁晓","C":"郑毅、丁晓、吴芳","D":"刘佳、丁晓、吴芳"},"answer":"B","explanation":"第一步：翻译题干。\n（1）要么刘佳，要么郑毅；\n（2）刘佳\u003cimg data-k=\"a37757d411ef\">吴芳；\n（3）郭斌 且 吴芳\u003cimg data-k=\"a37757d411ef\">施文；\n（4）\u003cimg data-k=\"0be436194951\">丁晓 或 郭斌；\n（5）施文 或 丁晓；\n（6）\u003cimg data-k=\"0be436194951\">施文。\n第二步：根据题干条件进行推理。\n从确定信息进行推理，施文无法参加，结合条件（5）和“或关系否一推一”可知丁晓参加，结合条件（4）和“或关系否一推一”可知郭斌参加；已知施文无法参加，结合条件（3）和“否后必否前”可知\u003cimg data-k=\"0be436194951\">郭斌 或 \u003cimg data-k=\"0be436194951\">吴芳，结合郭斌参加和“或关系否一推一”可知吴芳不参加，排除C、D两项；结合条件（2）和“否后必否前”可知刘佳不参加，排除A项；再结合条件（1）可知，郑毅参加，此时确定参加的医生为丁晓、郭斌和郑毅，对应B项。\n故正确答案为B。","no":99,"missingImage":false},{"type":"question","qid":"5510005","cat":"类比推理","stem":"某次体操比赛之前，有甲、乙、丙、丁四人预测红队、黄队、绿队、蓝队的出场顺序，四人的预测如下：\n甲说：只有黄队第二个出场，红队才第一个出场。\n乙说：如果红队第三个出场，那么蓝队第四个出场。\n丙说：蓝队不是第四个出场。\n丁说：黄队第二个出场。\n比赛结束后，发现四人中只有一人预测为真，那么绿队是第几个出场？","options":{"A":"第一个","B":"第二个","C":"第三个","D":"第四个"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）红队第一\u003cimg data-k=\"a37757d411ef\">黄队第二；\n（2）红队第三\u003cimg data-k=\"a37757d411ef\">蓝队第四；\n（3）蓝队不是第四；\n（4）黄队第二。\n因为四人中只有一人预测为真，若（2）为假，可得“红队第三”“蓝队不是第四”，若（3）为假，可得“蓝队第四”，互相矛盾，故（2）（3）中必有一真，（1）（4）为假。\n第二步：根据题干条件进行推理。\n根据（1）（4）为假可知，“红队第一”“黄队不是第二”。若（2）为假，可得“红队第三”“蓝队不是第四”，与“红队第一”矛盾，因此（2）为真（3）为假，进而可得“蓝队第四”，又因为“黄队不是第二”，则“黄队第三”，进而推出“绿队第二”。\n故正确答案为B。","no":100,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2021年，全国城市供水总量673.34亿立方米，同比增长6.96%；城市供水管道长度105.99万公里，同比增长5.26%；人均日生活用水量185.03升；供水普及率99.38%，比上年增加0.39个百分点。天津、河北、上海、江苏、浙江和广东6个省（市）城市供水普及率达到100%；福建、山东、湖北、广西、安徽、辽宁、宁夏、新疆、内蒙古、山西、甘肃、河南、黑龙江、江西、云南和湖南16个省（区）超过99%（含）；西藏、青海、北京、四川、贵州和陕西6个省（区、市）超过98%；重庆、吉林、海南3个省（市）和新疆建设兵团超过95%。\u003c/p>\u003cp>\u003cimg data-k=\"a4800a49c015\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"5510181","cat":"综合","stem":"2020年，全国城市供水总量约为：","options":{"A":"600亿立方米","B":"620亿立方米","C":"630亿立方米","D":"724亿立方米"},"answer":"C","explanation":"根据题干“2020年，全国城市供水总量约为”，结合材料时间为2021年，可判定本题为基期计算问题。定位文字材料第一段可得：2021年，全国城市供水总量673.34亿立方米，同比增长6.96%。根据公式：基期量\u003cimg data-k=\"51e165712c75\">，则所求\u003cimg data-k=\"23ded747c8e9\">亿立方米，与C项最接近。\n故正确答案为C。","no":101,"missingImage":false},{"qid":"5509972","cat":"增长","stem":"2021年全国城市供水管道长度比2020年增长约：","options":{"A":"5万公里","B":"5.3万公里","C":"5.6万公里","D":"6万公里"},"answer":"B","explanation":"根据题干“2021年······比2020年增长约”，结合选项带单位，可判定本题为增长量计算问题。定位文字材料可得：2021年，城市供水管道长度105.99万公里，同比增长5.26%。根据公式：增长量\u003cimg data-k=\"cf1216838c87\">，则2021年全国城市供水管道长度比2020年增长\u003cimg data-k=\"d1b1483a3663\">\u003cimg data-k=\"2c94d774128b\">\u003cimg data-k=\"73b725df3db3\">万公里。\n故正确答案为B。","no":102,"missingImage":false},{"qid":"5509991","cat":"平均数","stem":"图2所列的全国部分省（区、市）中，2021年城市人均日生活用水量超过全国平均值的有：","options":{"A":"5个","B":"6个","C":"7个","D":"8个"},"answer":"B","explanation":"定位文字材料可得：2021年，全国人均日生活用水量185.03升。定位图2可得2021年全国部分省（区、市）城市人均日生活用水量。则超过全国平均值（185.03升）的有浙江（212升）、安徽（190升）、福建（231升）、广东（251升）、海南（315升）、西藏（256升）6个省（区、市）。\n故正确答案为B。","no":103,"missingImage":false},{"qid":"5509992","cat":"平均数","stem":"图2中，城市人均日生活用水量最高的省份是用水量中位数省份的约：","options":{"A":"1.78倍","B":"1.88倍","C":"1.95倍","D":"2.03倍"},"answer":"B","explanation":"根据题干“图2中······是······”，结合选项求倍数，可判定本题为现期倍数问题。定位图2可知，城市人均日生活用水量最高的省份是海南，用水量为315升；城市人均日生活用水量中位数省份，即排名第8的省份为宁夏，用水量为168升。故城市人均日生活用水量最高的省份是用水量中位数省份的倍数为\u003cimg data-k=\"3bcbe8da3cf9\">倍，与B项最接近。\n故正确答案为B。","no":104,"missingImage":false},{"qid":"5509996","cat":"综合","stem":"能够从上述资料推出的是：","options":{"A":"2012～2021年，全国城市供水普及率逐年增长","B":"2021年，浙江和广东的供水普及率低于新疆建设兵团","C":"2012～2021年，全国城市人均日生活用水量平均值不超过176升","D":"图2中，用水量排名前三名的省（区、市）城市人均日生活用水量之和是排名后三位的约2.13倍"},"answer":"D","explanation":"A项：定位文字材料可得2020年、2021年全国城市供水普及率，但未给出其余年份的全国城市供水普及率，无法推出，错误；\nB项：定位文字材料可得，2021年浙江和广东城市供水普及率达到100%，新疆建设兵团超过95%。比较可知2021年浙江和广东的供水普及率高于新疆建设兵团，错误；\nC项：定位图1可得2012-2021年全国城市人均日生活用水量。则所求平均值\u003cimg data-k=\"9e86083510c2\">\u003cimg data-k=\"90bfc61edd34\">升＞176升，错误；\nD项：定位图2可得用水量排名前三名的省（区、市）城市人均日生活用水量分别为海南315升、西藏256升、广东251升；用水量排名后三位分别为天津123升、吉林125升、山西138升。则所求倍数\u003cimg data-k=\"a2c73d2122ef\">倍，正确。\n故正确答案为D。","no":105,"missingImage":false}]},{"type":"material","material":"\u003cp>        2012~2021的10年间，辽宁、天津、河北、山东、江苏、上海、浙江、福建、广东、广西、海南11个沿海省市的核电、火电、钢铁、石化等行业的海水冷却用水量稳步增长（图1），其中浙江、福建、广东3省海水冷却用水量相对较高（表1）。截至2021年底，11个沿海省市共建有海水冷却工程22个，2021年全国11个沿海省市海水冷却工程年总循环量为169.5亿吨。\u003c/p>\u003cp>\u003cimg data-k=\"b4eca39096f2\" style=\"max-width:688px\">\u003c/p>\u003cp>\u003cimg data-k=\"eaccc8a2e1e7\" style=\"max-width:688px\">\u003c/p>","questions":[{"qid":"5510158","cat":"综合","stem":"图1中相较于2012年，11个沿海省市海水冷却用水量实现翻一番的年份首次出现在：","options":{"A":"2018年","B":"2019年","C":"2020年","D":"2021年"},"answer":"C","explanation":"根据题干“图1中相较于2012年······实现翻一番的年份首次出现在”，根据“翻一番即变为原来的2倍”，可判定本题为现期倍数问题。定位图1可得，2012年全国11个沿海省市海水冷却用水量为841.0亿吨。在2012年基础上翻一番后用水量为841.0×2=1682亿吨，结合图1可知，相较于2012年，2020年海水冷却用水量首次实现翻一番（1698.1亿吨&gt;1682亿吨）。\n故正确答案为C。","no":106,"missingImage":false},{"qid":"5510160","cat":"综合","stem":"2012~2021年关于各省同年份海水冷却用水量的大小关系正确的是：","options":{"A":"辽宁>河北","B":"山东>江苏","C":"广东>浙江","D":"江苏>广西"},"answer":"B","explanation":"定位表1可知2012~2021年每年各省海水冷却用水量。代入数据验证选项，A项：2021年，辽宁海水冷却用水量（49.0亿吨）&lt;河北海水冷却用水量（54.6亿吨），不符合，排除；B项：2012~2021年山东同年份海水冷却用水量均大于江苏，当选；C项：2015年，广东海水冷却用水量（332.2亿吨）&lt;浙江海水冷却用水量（336.0亿吨），不符合，排除；D项：2017年，江苏海水冷却用水量（42.4亿吨）&lt;广西海水冷却用水量（54.2亿吨），不符合，排除。\n故正确答案为B。","no":107,"missingImage":false},{"qid":"5510163","cat":"综合","stem":"表1中，2021年除浙江、福建、广东外的5个沿海省市海水冷却用水量占全国11个沿海省市的：","options":{"A":"24.6%","B":"33.8%","C":"47.6%","D":"66.2%"},"answer":"A","explanation":"根据题干“表1中，2021年······占······的”，结合选项为百分数，可判定本题为现期比重问题。定位图1可得：2021年全国11个沿海省市的海水冷却用水量为1775.1亿吨；定位表1可得：2021年除浙江、福建、广东外的5个沿海省市海水冷却用水量分别为49.0亿吨、54.6亿吨、145.1亿吨、117.5亿吨、70.6亿吨。根据公式：比重\u003cimg data-k=\"155c064d29d7\">，题目所求\u003cimg data-k=\"c2f0dc44299c\">\u003cimg data-k=\"7c98243726f9\">，与A项最接近。\n故正确答案为A。","no":108,"missingImage":false},{"qid":"5510164","cat":"综合","stem":"2021年海水冷却用水量低于海水冷却工程年总循环量的沿海省市共有几个：","options":{"A":"5个","B":"6个","C":"7个","D":"8个"},"answer":"D","explanation":"定位文字材料可得，2021年全国11个沿海省市海水冷却工程年总循环量为169.5亿吨。结合表格比较可得，8个沿海省中，海水冷却用水量低于海水冷却工程年总循环量的省份共有5个，分别为辽宁（49.0亿吨）、河北（54.6亿吨）、山东（145.1亿吨）、江苏（117.5亿吨）、广西（70.6亿吨）。\n除表中8省外，剩余3个沿海省市海水冷却用水量之和\u003cimg data-k=\"4ba22172ea87\">\u003cimg data-k=\"8eaedfe6ef75\">亿吨。因3个省市的海水冷却用水量之和（163.1亿吨）低于海水冷却工程年总循环量（169.5亿吨），则每个省市的海水冷却用水量均应低于海水冷却工程年总循环量。\n故满足要求的沿海省市共5+3=8个。\n故正确答案为D。","no":109,"missingImage":false},{"qid":"5510165","cat":"综合","stem":"可以从上述资料推出的是：","options":{"A":"2021年全国11个沿海省份海水冷却用水量前4名依次为：广东、浙江、福建、江苏","B":"2012~2021年浙江、广东年海水冷却用水量之和均超过全国同期的60%","C":"2012~2021年表1的8个省市中福建的海水冷却用水量年平均增速最快","D":"2012~2021年间，广东的海水冷却用水量均为辽宁同期的3倍以上"},"answer":"C","explanation":"A项：定位表1，2021年辽宁、河北等8省海水冷却用水量前4名依次为：广东（571.3亿吨）、浙江（338.7亿吨）、福建（264.3亿吨）、山东（145.1亿吨），江苏省在此表中排名为第5，故一定无法排到全国11个沿海省份海水冷却用水量的前4名，错误；\nB项：定位图1可知2012～2021年全国11个沿海省市的海水冷却用水量，定位表1可知2012～2021年浙江、广东年海水冷却用水量。2012年浙江、广东年海水冷却用水量之和占全国11个沿海省市的海水冷却用水量的比重为\u003cimg data-k=\"e7d18342fd58\">\u003cimg data-k=\"eff87b339f4a\">，并非均超过全国同期的60%，错误；\nC项：定位表1可知2012年、2021年辽宁、河北等8省海水冷却用水量。根据年均增长率公式：\u003cimg data-k=\"d4fcb72ca495\">（n为年份差），当年份差相同时，直接比较\u003cimg data-k=\"dd60a582331d\">即可。表1的8个省份\u003cimg data-k=\"dd60a582331d\">分别为：辽宁，\u003cimg data-k=\"643ee0ee5737\">；河北，\u003cimg data-k=\"4940b0dc32f0\">；山东，\u003cimg data-k=\"35b22ce02950\">；江苏，\u003cimg data-k=\"5029c74ea7ef\">；浙江，\u003cimg data-k=\"8e2e30817ae7\">；福建，\u003cimg data-k=\"a5b7d3cd49f2\">；广东，\u003cimg data-k=\"65b33d1ecee9\">；广西，\u003cimg data-k=\"590fbbe10561\">，比较可知8个省份中福建的海水冷却用水量年平均增速最快，正确；\nD项：定位表1可知2012～2021年间，广东、辽宁的海水冷却用水量。2014年广东的海水冷却用水量为辽宁同期的\u003cimg data-k=\"80e9c6ff99ae\">倍\u003cimg data-k=\"6adf29c5edd6\">倍，并非均为3倍以上，错误。\n故正确答案为C。","no":110,"missingImage":false}]},{"type":"material","material":"\u003cp>        2021年中国雨季特征为华南前汛期于4月26日开始，7月2日结束，雨季长度为67天，总雨量494.6毫米。与正常年份相比，开始偏晚20天，结束偏早4天，雨季长度偏短24天，雨量偏少31%。\u003c/p>\u003cp>        西南雨季于6月4日开始，10月4日结束，雨季长度为122天，总雨量634.5毫米。与正常年份相比，开始偏晚9天，结束偏早10天，雨季长度偏短19天，雨量偏少15%。\u003c/p>\u003cp>        华北雨季于7月12日开始，9月9日结束，雨季长度为59天，总雨量276.4毫米。与正常年份相比，开始偏早6天，结束偏晚22天，雨季长度偏长28天，为1961年以来第二长；雨量偏多103%，为1961年以来第三多。\u003c/p>\u003cp>        东北雨季于6月5日开始，8月29日结束，雨季长度为85天，总雨量364.3毫米。与正常年份相比，开始偏早17天，结束偏晚4天，雨季长度偏长21天，雨量偏多23%。\u003c/p>\u003cp>        华西秋雨于8月23日开始，雨季长度为77天，总雨量379.9毫米。与正常年份相比，开始偏早8天，结束偏晚7天，雨季长度偏长15天，雨量偏多87%，为1961年以来最多。\u003c/p>\u003cp>        梅雨于6月9日开始，7月11日出梅，梅雨期32天，梅雨量267.2毫米；与正常年份相比，入梅时间偏晚1天，出梅时间偏早7天，梅雨期偏短8天，梅雨量偏少22%，与2020年梅雨量780.9毫米相比差距明显。江南入梅时间偏晚1天，出梅偏晚3天，雨量偏少15%；长江中下游入梅偏早4天，出梅偏早2天，雨量偏少8%；江淮区入梅时间偏早8天，出梅时间偏早4天，梅雨量偏少14%。\u003c/p>","questions":[{"qid":"5509983","cat":"综合","stem":"正常年份雨季长度最长的地区是：","options":{"A":"华南","B":"西南","C":"东北","D":"华西"},"answer":"B","explanation":"定位文字材料第一段可得：2021年华南雨季长度为67天，与正常年份相比，雨季长度偏短24天。定位文字材料第二段可得：（2021年）西南雨季长度为122天，与正常年份相比，雨季长度偏短19天。定位文字材料第四段可得：（2021年）东北雨季长度为85天，与正常年份相比，雨季长度偏长21天。定位文字材料第五段可得：（2021年）华西雨季长度为77天，与正常年份相比，雨季长度偏长15天。则正常年份各地区雨季长度分别为：华南，67+24=91天；西南，122+19=141天；东北，85-21=64天；华西，77-15=62天。综上，正常年份雨季长度最长的地区是西南。\n故正确答案为B。","no":111,
