<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">行测真题模拟考场<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",imgBase:"",papers:[{"slug":"2023-重庆","title":"2023年重庆市公务员录用考试《行测》题（网友回忆版）","year":"2023","group":"重庆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"5509970","cat":"时事政治","stem":"中国共产党第二十次全国代表大会于2022年10月16日至22日在北京举行，习近平总书记代表第十九届中央委员会向大会作报告。下列有关报告内容表述正确的有：\n①务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争\n②坚持和发展马克思主义，必须同中国具体实际相结合；坚持和发展马克思主义，必须同中华优秀传统文化相结合\n③必须坚持人民至上、必须坚持自信自立、必须坚持守正创新、必须坚持问题导向、必须坚持系统观念、必须坚持胸怀天下\n④坚持和加强党的全面领导、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神\n⑤高质量发展是全面建设社会主义现代化国家的首要任务","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"D","explanation":"本题考查政治常识。\n①项正确，党的二十大报告指出：“中国共产党已走过百年奋斗历程。我们党立志于中华民族千秋伟业，致力于人类和平与发展崇高事业，责任无比重大，使命无上光荣。全党同志务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争，坚定历史自信，增强历史主动，谱写新时代中国特色社会主义更加绚丽的华章。”\n②项正确，党的二十大报告指出：“坚持和发展马克思主义，必须同中国具体实际相结合。我们坚持以马克思主义为指导，是要运用其科学的世界观和方法论解决中国的问题，而不是要背诵和重复其具体结论和词句，更不能把马克思主义当成一成不变的教条······坚持和发展马克思主义，必须同中华优秀传统文化相结合。只有植根本国、本民族历史文化沃土，马克思主义真理之树才能根深叶茂。”\n③项正确，党的二十大报告指出：“必须坚持人民至上、必须坚持自信自立、必须坚持守正创新、必须坚持问题导向、必须坚持系统观念、必须坚持胸怀天下。”\n④项正确，党的二十大报告指出：“坚持和加强党的全面领导、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。”\n⑤项正确，党的二十大报告指出：“高质量发展是全面建设社会主义现代化国家的首要任务。发展是党执政兴国的第一要务。没有坚实的物质技术基础，就不可能全面建成社会主义现代化强国。”\n综上所述，表述正确的有①②③④⑤，共5项。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"5509975","cat":"时事政治","stem":"党的二十大报告提到，十八大以来“我们深入贯彻以人民为中心的发展思想，在幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶上持续用力，人民生活全方位改善”。下列有关内容表述正确的是：\n①及时调整生育政策\n②人均预期寿命增长到八十八点二岁\n③城镇新增就业年均一千三百万人以上\n④互联网上网人数达十三亿三千万人\n⑤居民人均可支配收入从一万六千五百元增加到三万五千一百元\n⑥基本养老保险覆盖十亿四千万人，基本医疗保险参保率稳定在百分之九十五","options":{"A":"①②③④","B":"①③④⑤","C":"②④⑤⑥","D":"①③⑤⑥"},"answer":"D","explanation":"本题考查政治常识。\n①③⑤⑥正确，②④错误，党的二十大报告中“一、过去五年的工作和新时代十年的伟大变革”部分指出：“人均预期寿命增长到七十八点二岁。居民人均可支配收入从一万六千五百元增加到三万五千一百元。城镇新增就业年均一千三百万人以上。建成世界上规模最大的教育体系、社会保障体系、医疗卫生体系，教育普及水平实现历史性跨越，基本养老保险覆盖十亿四千万人，基本医疗保险参保率稳定在百分之九十五。及时调整生育政策。改造棚户区住房四千二百多万套，改造农村危房二千四百多万户，城乡居民住房条件明显改善。互联网上网人数达十亿三千万人。人民群众获得感、幸福感、安全感更加充实、更有保障、更可持续，共同富裕取得新成效。”“人均预期寿命增长到七十八点二岁”而不是八十八点二岁；“互联网上网人数达十亿三千万人”而不是十三亿三千万人。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"5510100","cat":"时事政治","stem":"党的二十大报告指出：要采取更多惠民生、暖民心举措，着力解决好人民群众急难愁盼问题，健全基本公共服务体系，提高公共服务水平，增强均衡性和可及性，扎实推进共同富裕。下列有关内容表述正确的是：\n①实施渐进式延迟法定退休年龄\n②健全社保基金保值增值和安全监管体系\n③加大税收、社会保障、转移支付等的调节力度\n④健全终身职业技能培训制度，推动解决周期性就业矛盾\n⑤深化以市场化为导向的公立医院改革，规范民营医院发展\n⑥坚持房子是用来住的、不是用来炒的定位，加快建立多主体供给、多渠道保障、租购并举的住房制度","options":{"A":"①②③④","B":"①②③⑥","C":"②③⑤⑥","D":"①④⑤⑥"},"answer":"B","explanation":"本题考查政治常识。\n①正确，党的二十大报告指出：“健全社会保障体系。社会保障体系是人民生活的安全网和社会运行的稳定器。健全覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次社会保障体系。完善基本养老保险全国统筹制度，发展多层次、多支柱养老保险体系。实施渐进式延迟法定退休年龄。”\n②正确，党的二十大报告指出：“扩大社会保险覆盖面，健全基本养老、基本医疗保险筹资和待遇调整机制，推动基本医疗保险、失业保险、工伤保险省级统筹。促进多层次医疗保障有序衔接，完善大病保险和医疗救助制度，落实异地就医结算，建立长期护理保险制度，积极发展商业医疗保险。加快完善全国统一的社会保险公共服务平台。健全社保基金保值增值和安全监管体系。”\n③正确，党的二十大报告指出：“完善分配制度。坚持多劳多得，鼓励勤劳致富，促进机会公平，增加低收入者收入，扩大中等收入群体。完善按要素分配政策制度，探索多种渠道增加中低收入群众要素收入，多渠道增加城乡居民财产性收入。加大税收、社会保障、转移支付等的调节力度。”\n④错误，党的二十大报告指出：“健全终身职业技能培训制度，推动解决结构性就业矛盾。完善促进创业带动就业的保障制度，支持和规范发展新就业形态。健全劳动法律法规，完善劳动关系协商协调机制，完善劳动者权益保障制度，加强灵活就业和新就业形态劳动者权益保障。”\n⑤错误，党的二十大报告指出：“深化以公益性为导向的公立医院改革，规范民营医院发展。发展壮大医疗卫生队伍，把工作重点放在农村和社区。重视心理健康和精神卫生。促进中医药传承创新发展。”\n⑥正确，党的二十大报告指出：“健全社会保障体系。坚持房子是用来住的、不是用来炒的定位，加快建立多主体供给、多渠道保障、租购并举的住房制度。”\n综上，①②③⑥正确。\n故正确答案为B。","no":3,"missingImage":false},{"type":"question","qid":"5510104","cat":"时事政治","stem":"党的二十大报告指出，未来五年是全面建设社会主义现代化国家开局起步的关键时期。下列不属于报告中提及的未来五年主要目标任务的是：","options":{"A":"国家安全体系和能力全面加强，基本实现国防和军队现代化","B":"居民收入增长和经济增长基本同步，劳动报酬提高与劳动生产率提高基本同步","C":"全过程人民民主制度化、规范化、程序化水平进一步提高，中国特色社会主义法治体系更加完善","D":"经济高质量发展取得新突破，科技自立自强能力显著提升，构建新发展格局和建设现代化经济体系取得重大进展"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，B、C、D三项正确，党的二十大报告指出，“未来五年是全面建设社会主义现代化国家开局起步的关键时期，主要目标任务是：经济高质量发展取得新突破，科技自立自强能力显著提升，构建新发展格局和建设现代化经济体系取得重大进展；改革开放迈出新步伐，国家治理体系和治理能力现代化深入推进，社会主义市场经济体制更加完善，更高水平开放型经济新体制基本形成；全过程人民民主制度化、规范化、程序化水平进一步提高，中国特色社会主义法治体系更加完善；人民精神文化生活更加丰富，中华民族凝聚力和中华文化影响力不断增强；居民收入增长和经济增长基本同步，劳动报酬提高与劳动生产率提高基本同步，基本公共服务均等化水平明显提升，多层次社会保障体系更加健全；城乡人居环境明显改善，美丽中国建设成效显著；国家安全更为巩固，建军一百年奋斗目标如期实现，平安中国建设扎实推进；中国国际地位和影响进一步提高，在全球治理中发挥更大作用。”\n本题为选非题，故正确答案为A","no":4,"missingImage":false},{"type":"question","qid":"5509981","cat":"新思想","stem":"习近平总书记指出，粮食安全是“国之大者”。保障粮食等重要农产品供给安全，是“三农”工作头等大事。下列有关我国粮食生产安全的表述不准确的是：","options":{"A":"我国粮食总产量连续八年稳定在1.3万亿斤以上","B":"2021年我国启动了国家大豆和油料产能提升工程","C":"2021年我国人均粮食产量超过480公斤，高于国际公认的粮食安全线","D":"我国农业机械化、智能化发展迅速，截至2022年9月，农作物耕种收综合机械化率超过70%"},"answer":"B","explanation":"本题考查政治常识。\nA项正确，2022年12月12日，国家统计局发布数据显示，2022年全年粮食实现增产丰收。全国粮食总产量达13731亿斤，比上年增加74亿斤，增长0.5%，粮食产量连续8年稳定在1.3万亿斤以上。\nB项错误，光明网2022年消息：2022年是国家实施大豆和油料产能提升工程的第一年，按照中央有关部署，各地多油并举、多措并施，稳步提升大豆和油料产能和自给率。2023年，《中共中央 国务院关于做好2023年全面推进乡村振兴重点工作的意见》中明确指出：“深入推进大豆和油料产能提升工程。扎实推进大豆玉米带状复合种植，支持东北、黄淮海地区开展粮豆轮作，稳步开发利用盐碱地种植大豆。”\nC项正确，2022年10月17日上午，中国共产党第二十次全国代表大会新闻中心举行记者招待会。会上指出：“2021年我国人均粮食产量达到483.5公斤，就是说，即使不考虑进口的补充和充裕的库存，仅人均粮食产量就已超过国际上公认的400公斤粮食安全线。”\nD项正确，2022年6月27日，中共中央宣传部举行“中国这十年”系列主题新闻发布会。农业农村部副部长邓小刚在发布会上表示，党的十八大以来，我国物质技术装备条件明显改善，农业现代化建设迈上新台阶。我国已成为世界农机生产大国，农机装备总量接近2亿台（套），总动力达到10.78亿千瓦，全国农作物耕种收综合机械化率超过72%。\n本题为选非题，故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"5509980","cat":"新思想","stem":"党内法规体系建设是一个久久为功、持续推进的历史过程。习近平总书记在庆祝中国共产党成立100周年大会上宣布，我们党已经“形成比较完善的党内法规体系”，下列关于中国共产党党内法规体系的说法错误的是：","options":{"A":"党章是所有党内法规的源头，是制定一切党内法规的基础和依据","B":"党内法规使用党章、准则、条例、规定、办法、规则、细则7类名称","C":"党内法规草案形成后，应当广泛征求意见。征求意见可以采取书面、座谈会、论证会等形式，但不宜采取网上征询的方式","D":"党内法规体系以“1+4”为基本框架，即在党章之下分为党的组织法规、党的领导法规、党的自身建设法规、党的监督保障法规四大板块"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，《中国共产党党内法规体系》指出：“党内法规体系的框架构成，党章是最根本的党内法规。党的一切制度是从党章开始的，党章是所有党内法规的源头，是制定一切党内法规的基础和依据。”\nB项正确，《中国共产党党内法规体系》指出：“党内法规使用党章、准则、条例、规定、办法、规则、细则7类名称，现行有效党内法规中，党章1部，准则3部，条例43部，规定850部，办法2034部，规则75部，细则609部。”\nC项错误，《中国共产党党内法规制定条例》中指出：“党内法规草案形成后，应当广泛征求意见。征求意见范围根据党内法规草案的具体内容确定，必要时在全党范围内征求意见。征求意见时应当注意听取党代表大会代表和有关专家学者的意见。与群众切身利益密切相关的党内法规草案，应当充分听取群众意见。征求意见可以采取书面形式，也可以采取座谈会、论证会、网上征询等形式。”\nD项正确，《中共中央关于加强党内法规制度建设的意见》规定，党内法规体系以“1+4”为基本框架，即在党章之下分为党的组织法规、党的领导法规、党的自身建设法规、党的监督保障法规四大板块。\n本题为选非题，故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"5509978","cat":"时事政治","stem":"2022年10月25日，习近平总书记主持召开了二十届中央政治局第一次会议，审议《中共中央政治局贯彻落实中央八项规定实施细则》。下列有关说法正确的有：\n①党的十九大以来，中央政治局每年都召开民主生活会对照检查贯彻执行中央八项规定情况\n②党的十九大、二十大后的首次中央政治局会议都把审议中央八项规定实施细则作为重要议题\n③必须始终把中央八项规定作为长期有效的铁规矩、硬杠杠\n④抓作风建设只有进行时，没有完成时","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查政治常识。\n①项正确，党的十九大后，中央政治局第一次会议根据中央八项规定实施过程中遇到的新情况新问题，审议通过《中共中央政治局贯彻落实中央八项规定的实施细则》，进一步向全党释放出中央政治局带头、坚持从严治党的鲜明态度和坚定决心。为督促检查中央政治局落实情况，每年年底召开一次中央政治局专题民主生活会，就落实中央八项规定精神情况对照检查。\n②项正确，党的十九大、二十大后的首次中央政治局会议都把审议八项规定实施细则作为重要议题，绝不向不良作风让步的态度，让全党全社会都看到了一以贯之的决心和勇气。\n③④项正确，2022年10月25日，二十届中共中央政治局召开会议，会议强调，抓作风建设只有进行时，没有完成时。党的二十大对锲而不舍落实中央八项规定精神作出新部署，必须始终把中央八项规定作为长期有效的铁规矩、硬杠杠，抓住“关键少数”以上率下，持续深化纠治“四风”，重点纠治形式主义、官僚主义，坚决破除特权思想和特权行为，推动全党坚决落实中央八项规定精神，全面推进党的自我净化、自我完善、自我革新、自我提高，始终保持同人民群众的血肉联系，始终同人民同呼吸、共命运、心连心。\n综上所述，说法正确的有①②③④，共4项。\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"5509976","cat":"时事政治","stem":"党的二十大报告提出“加快发展数字经济，促进数字经济和实体经济深度融合，打造具有国际竞争力的数字产业集群”。下列有关我国数字经济发展说法不正确的是：","options":{"A":"我国5G网络规模已在全球居首位","B":"目前中国算力规模约占全球的27%，排名第二","C":"2021年我国数字经济规模占GDP总量的比重接近20%","D":"全国一体化大数据中心体系初步建立，“东数西算”工程已于2022年全面启动"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，2022年8月20日，据工业和信息化部统计显示，截至今年7月底，我国累计建成开通5G基站196.8万个，5G移动电话用户达到4.75亿户，已建成全球规模最大的5G网络。\nB项正确，2022年11月16日，在2022中国国际数字经济博览会上，中国电子信息产业发展研究院发布的《2022中国数字经济发展研究报告》显示，目前中国算力规模约占全球的27%，排名全球第二。\nC项错误，2022年7月，中国信息通信研究院发布了《中国数字经济发展报告（2022年）》。《报告》显示，2021年我国数字经济规模达到45.5万亿元，占GDP比重达到39.8%。\nD项正确，2022年2月18日，国家启动“东数西算”大型项目协调东西部算力资源，共规划设立8个枢纽10个国家数据中心，标志着全国一体化大数据中心体系完成总体布局设计，“东数西算”工程正式全面启动。\n本题为选非题，故正确答案为C。","no":8,"missingImage":false}],"count":8,"answerable":8,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"5510106","cat":"人文常识","stem":"甲单位在招聘职工时，以不正当理由拒绝接受女性，这种做法在一定程度上侵犯了劳动者的：","options":{"A":"平等就业权","B":"获得劳动安全卫生保护的权利","C":"选择职业的权利","D":"举报和控告的权利"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国劳动法》第三条第一款规定：“劳动者享有平等就业和选择职业的权利、取得劳动报酬的权利、休息休假的权利、获得劳动安全卫生保护的权利、接受职业技能培训的权利、享受社会保险和福利的权利、提请劳动争议处理的权利以及法律规定的其他劳动权利。”招聘中以不正当的理由拒绝女性，是一种在工作就业中的性别歧视，侵犯的是劳动者的平等就业权。\nB项错误，劳动者有获得劳动安全卫生保护的权利，这是保证劳动者在劳动中生命安全和身体健康，是对享受劳动权利的主体切身利益最直接的保护。\nC项错误，劳动者有选择职业的权利。是指劳动者根据自己的意愿选择适合自己才能、爱好的职业的权利。\nD项错误，劳动者有举报和控告的权利是指劳动者有提请劳动争议处理的权利。劳动争议是指劳动关系当事人，因执行《劳动法》或履行集体合同和劳动合同的规定引起的争议。\n故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"5510109","cat":"人文常识","stem":"如果要编纂一部大型宋代百科全书，下列选项可能会被编入的是：","options":{"A":"景泰蓝的制作流程","B":"昆山腔的代表人物","C":"正负开方术的演算方法","D":"十二平均律的应用范围"},"answer":"C","explanation":"本题考查人文常识。\nA项错误，景泰蓝，中国的著名特种金属工艺品类之一，到明代景泰年间这种工艺技术制作达到了最巅峰，制作出的工艺品最为精美而著名。“景泰蓝”这个称谓最先见于清宫造办处档案。故“景泰蓝的制作流程”不可能被编入宋代的百科全书。\nB项错误，昆曲是戏曲的一种，元末明初源于江苏昆山县一带，故称昆曲，又称昆山腔、昆腔或昆剧，因元末居于昆山附近的顾坚创始而得名。故“昆山腔的代表人物”不可能被编入宋代的百科全书。\nC项正确，正负开方术是中国古算法，指中国古代的一种求一元高次方程数值解的方法。这一方法是秦九韶总结和改进了《数书九章》的“开方术”、刘益的“正负开方术”及贾宪的“增乘开方法”得到的。秦九韶是南宋著名数学家，故“正负开方术的演算方法”可能被编入宋代的百科全书。\nD项错误，十二平均律由明代著名律学家朱载堉创建，他制作了世界上第一架定音乐器，代表作有《瑟谱》《律历融通》《律学新说》，有“律圣”之称。故“十二平均律的应用范围”不可能被编入宋代的百科全书。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"5510053","cat":"人文常识","stem":"下列诗句内容与传统节日对应错误的是：","options":{"A":"“金吾不禁夜，玉漏莫相催”——寒食节","B":"“彩缕碧筠粽，香粳白玉团”——端午节","C":"“此生此夜不长好，明月明年何处看”——中秋节","D":"“桂花香馅裹胡桃，江米如珠井水淘”——元宵节"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，出自唐代苏味道的《正月十五夜》，唐朝时期，京城每天晚上都要戒严，对私自夜行者处以重罚，而正月十五这天是例外的，因此诗句描写的是正月十五元宵节。\nB项正确，出自唐代元稹的《表夏十首》，“彩缕碧筠粽，香粳白玉团”是描写粽子的佳句，端午节有吃粽子的习俗，因此诗句描写的是五月初五端午节。\nC项正确，出自北宋苏轼的《阳关曲》，写的是苏轼与其胞弟苏辙久别重逢，共赏中秋月的赏心乐事，中秋节有赏月的习俗，因此诗句描写的是八月十五中秋节。\nD项正确，出自清代符曾的《上元竹枝词》，诗中后两句为“见说马家滴粉好，试灯风里卖元宵。”本诗描绘的是元宵节当天，卖元宵的商贩在一片灯光溢彩中叫卖汤圆的热闹场景，元宵节有吃元宵的习俗，因此诗句描写的是正月十五元宵节。\n本题为选非题，故正确答案为A。","no":11,"missingImage":false},{"type":"question","qid":"5510039","cat":"人文常识","stem":"中国古建筑群是中华民族智慧的结晶，下列相关叙述正确的是：","options":{"A":"承德避暑山庄始建于清雍正皇帝在位时期","B":"北京故宫是中国元明清时期的皇家宫殿，旧称紫禁城","C":"因县治和府治同在一座城内，故平遥古城是典型的“城套城”风格","D":"孔府、孔庙、孔林，统称曲阜“三孔”，孔林是孔子家族的专用墓地"},"answer":"D","explanation":"本题考查人文常识。\nA项错误，承德避暑山庄是中国古代帝王宫苑，清代皇帝避暑和处理政务的场所，始建于1703年，历经清康熙、雍正、乾隆三朝，耗时89年建成。\nB项错误，北京故宫是中国明清两代的皇家宫殿，旧称紫禁城，位于北京中轴线的中心。北京故宫于明成祖永乐四年（1406年）开始建设，以南京故宫为蓝本营建，到永乐十八年（1420年）建成，历经明、清两代，共有24个皇帝在此执政。\nC项错误，徽州古城分为内城和外廓，因为历史上古徽州县治与府治同在一座城内，所以呈现独特且典型的“城套城”风格。而平遥古城保存着最完整的古代县城格局风格，并非“城套城”风格。\nD项正确，孔林，亦称“至圣林”，是孔子及其家族的专用墓地，也是世界上延续时间最长的家族墓地；孔庙，由鲁哀公在孔子生前的故宅基础上改建而成的；孔府，即“衍圣公府”，在是孔子嫡系长子长孙居住的府地。孔府、孔庙、孔林统称曲阜“三孔”。\n故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"5510110","cat":"人文常识","stem":"个人银行账户分为一类银行账户、二类银行账户和三类银行账户（简称Ⅰ类户、Ⅱ类户、Ⅲ类户），下列关于个人银行账户说法错误的是：","options":{"A":"Ⅱ、Ⅲ类户可以通过互联网等电子渠道开立","B":"Ⅰ类户开立必须经过银行工作人员现场面对面审核身份","C":"按银行账户功能由多到少排序：Ⅲ类户>Ⅱ类户>Ⅰ类户","D":"个人开立Ⅱ类户可以通过绑定本人信用卡进行身份验证"},"answer":"C","explanation":"本题考查经济常识。\nA项正确，《中国人民银行关于改进个人银行账户服务 加强账户管理的通知》“二、建立银行账户分类管理机制”部分规定：“（三）电子渠道开户。通过网上银行和手机银行等电子渠道受理银行账户开户申请的，银行可为开户申请人开立Ⅱ类户或Ⅲ类户。”\nB项正确，《中国人民银行关于落实个人银行账户分类管理制度的通知》“一、关于Ⅱ、Ⅲ类个人银行账户的开立、变更和撤销”中指出：“（二）个人可以凭有效身份证件通过银行业金融机构（以下简称银行）柜面开立Ⅰ、Ⅱ、Ⅲ类户。个人在银行柜面开立的Ⅱ、Ⅲ类户，无需绑定Ⅰ类户或者信用卡账户进行身份验证。银行依托自助机具为个人开立Ⅰ类户的，应当经银行工作人员现场面对面审核开户人身份。”\nC项错误，《中国人民银行关于改进个人银行账户服务 加强账户管理的通知》“二、建立银行账户分类管理机制”部分规定：“银行可通过Ⅰ类户为存款人提供存款、购买投资理财产品等金融产品、转账、消费和缴费支付、支取现金等服务。银行可通过Ⅱ类户为存款人提供存款、购买投资理财产品等金融产品、限定金额的消费和缴费支付等服务。银行可通过Ⅲ类户为存款人提供限定金额的消费和缴费支付服务。银行不得通过Ⅱ类户和Ⅲ类户为存款人提供存取现金服务，不得为Ⅱ类户和Ⅲ类户发放实体介质。”因此按银行账户功能由多到少排序为：Ⅰ类户＞Ⅱ类户＞Ⅲ类户。\nD项正确，《中国人民银行关于落实个人银行账户分类管理制度的通知》“一、关于Ⅱ、Ⅲ类个人银行账户的开立、变更和撤销”中指出：“（一）个人开立Ⅱ类、Ⅲ类银行账户（以下简称Ⅱ、Ⅲ类户）可以绑定本人Ⅰ类银行账户（以下简称Ⅰ类户）或者信用卡账户进行身份验证，不得绑定非银行支付机构（以下简称支付机构）开立的支付账户进行身份验证。”\n本题为选非题，故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"5510042","cat":"人文常识","stem":"探索建立长期护理保险制度，是党和政府为应对人口老龄化、健全社会保障体系作出的一项重要部署。下列关于我国长期护理保险制度的说法正确的是：","options":{"A":"长期护理保险属于养老保险范畴","B":"长期护理保险的参保对象是已退休的老年人","C":"根据护理等级、服务提供方式等不同实行差别化待遇保障政策","D":"因突发疾病住院产生的护理费用属于长期护理保险的支付范围"},"answer":"C","explanation":"本题考查政治常识。\nA项错误，根据国家医保局、财政部《关于扩大长期护理保险制度试点的指导意见》（以下简称《意见》）长期护理保险被称为“第六险”，重点解决重度失能人员长期护理保障问题，不属于传统五险（养老保险、医疗保险、工伤保险，失业保险，生育保险）的范畴。\nB项错误，《意见》指出试点阶段的长期护理保险的参保对象，从职工基本医疗保险参保人群起步，重点解决重度失能人员基本护理保障需求，优先保障符合条件的失能老年人、重度残疾人。有条件的地方可随试点探索深入，综合考虑经济发展水平、资金筹集能力和保障需要等因素，逐步扩大参保对象范围，调整保障范围。\nC项正确，《意见》指出长期护理保险基金主要用于支付符合规定的机构和人员提供基本护理服务所发生的费用。根据护理等级、服务提供方式等不同实行差别化待遇保障政策，鼓励使用居家和社区护理服务。\nD项错误，《意见》指出长期护理险针对年老、疾病或伤残导致生活不能自理，需要在家中或疗养院治病医疗由专人陪护所产生的费用进行支付的保险。不包括疾病住院产生的护理费，参保人员住院治疗期间发生的费用，按照其本人所参加的本市职工医保或城乡居民医保的相关规定执行，长期护理保险基金不予支付。\n故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"5510038","cat":"科技常识","stem":"微生物发酵是指在适宜的条件下将原料经过特定的代谢途径转化为人类所需产物的过程。下列不涉及微生物发酵的是：","options":{"A":"豆腐","B":"食醋","C":"乳酪","D":"白酒"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，豆腐是黄豆加工后形成富含蛋白质胶体类似于豆浆，然后加入盐卤或者石膏，使蛋白质凝集变成类似固体的形态，不涉及微生物发酵。 \nB项正确，食醋是以粮食等淀粉质为原料，经微生物制曲、糖化、酒精发酵、醋酸发酵等阶段酿制而成，其主要成分除醋酸外，还含有各种氨基酸、有机酸、糖类、维生素、醇和酯等营养成分，涉及微生物发酵。\nC项正确，奶酪，又名干酪，是一种发酵的牛奶制品，其性质与常见的酸牛奶有相似之处，都是通过发酵过程来制作的，也都含有可以保健的乳酸菌，但是奶酪的浓度比酸奶更高，近似固体食物，营养价值也因此更加丰富，涉及微生物发酵。 \nD项正确，酒是世界上微生物发酵产量最大的产品，中国传统白酒发酵的实质是，以谷物为主要原料，利用酵母菌等微生物，使之在生成主要代谢产物乙醇的同时，还形成丰富的香味物质，涉及微生物发酵。 \n本题为选非题，故正确答案为A。","no":15,"missingImage":false},{"type":"question","qid":"5510030","cat":"地理国情","stem":"成语“沧海桑田”“斗转星移”“日月如梭”所反映的地理现象分别是：","options":{"A":"地壳运动、地球自转运动、地球公转运动","B":"地壳运动、地球公转运动、地球自转运动","C":"地球自转运动、地壳运动、地球公转运动","D":"地球自转运动、地球公转运动、地壳运动"},"answer":"B","explanation":"本题考查地理国情。\n“沧海桑田”意思是大海变成农田，农田变成大海。反映了地壳运动 、海陆变迁的地理现象。地壳运动是由于地球内部原因引起的组成地球物质的机械运动。它可以引起岩石圈的演变，促使大陆、洋底的增生和消亡，并形成海沟和山脉，同时还导致发生地震、火山爆发等。\n“斗转星移”意思是星斗变动位置，指季节或时间的变化。北斗七星围绕北极星自东向西转的规律，我国古代的星象学家把它形象地叫做“斗转星移”，而通过“斗转星移”的规律，人们能够判断季节和节气时间。季节的变化跟地球公转运动有关。\n“日月如梭”意思是太阳和月亮像穿梭一样地来去，形容时间过得很快，反映了日月交替的现象，而地球的自转运动产生的现象有昼夜交替、太阳的东升西落。\n因此，B项正确，A、C、D三项错误。\n故正确答案为B。","no":16,"missingImage":false},{"type":"question","qid":"5510111","cat":"科技常识","stem":"中国航天事业与中国传统文化交相辉映，也映衬中国航天不断迈向深空的探索道路，“玉兔号”“夸父一号”“祝融号”所探测的天体，按距离地球由近及远排列正确的是：","options":{"A":"“玉兔号”“祝融号”“夸父一号”","B":"“祝融号”“玉兔号”“夸父一号”","C":"“玉兔号”“夸父一号”“祝融号”","D":"“夸父一号”“祝融号”“玉兔号”"},"answer":"A","explanation":"本题考查科技常识。\n“玉兔号”是中国首辆月球车，和着陆器共同组成嫦娥三号探测器。2013年12月15日，“玉兔号”巡视器顺利驶抵月球表面。\n“夸父一号”是由中国太阳物理学家自主提出的综合性太阳探测专用卫星。北京时间2022年10月9日，中国在酒泉卫星发射中心使用长征二号丁运载火箭，成功将“夸父一号”发射升空。\n“祝融号”是天问一号任务火星车。 2020年7月23日，在中国文昌航天发射场由长征五号遥四运载火箭发射升空。\nA项正确， B、C、D三项错误，“玉兔号”所探测的天体是月球，月球与地球近地点的距离是36.3万千米；“夸父一号”所探测的天体是太阳，地球距太阳约有1.5亿公里；“祝融号”所探测的天体是火星，地球与火星最近的距离约为5500万公里。所探测天体距离地球由近及远的顺序为月球、火星、太阳，故正确顺序为“玉兔号”“祝融号”“夸父一号”。\n故正确答案为A。","no":17,"missingImage":false},{"type":"question","qid":"5510036","cat":"科技常识","stem":"隐存物种又称为孪生种，是指两个生物在形态上的区别较为隐蔽，以至于难以区分，但实际上存在生殖隔离，属于不同物种。下列属于隐存物种的是：","options":{"A":"四川种大鲵和广西种大鲵","B":"驴和马","C":"白天鹅和黑天鹅","D":"鸡和鸭"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，由于缺乏显著的外部性状差异，中国大鲵长期以来被认为是一个物种。但经研究发现，中国大鲵并非单一物种，目前研究数据支持至少5个物种的划分。这5个物种（包括陕西种、四川种、广西种、贵州种和安徽种）与水系分布紧密相关，大致对应黄河、长江、珠江及钱塘江等水系流域。\nB、C、D三项均错误，属于在生物形态上存在明显差异，且容易区分。\n故正确答案为A。","no":18,"missingImage":false},{"type":"question","qid":"5509967","cat":"人文常识","stem":"用同样大小的力击打表面布满凹坑的小球a和同样大小、轻重但表面光滑的小球b，使球在空中高速飞行，则：","options":{"A":"b球在空中飞行的距离更远，因为光滑的球体提供更多的空气动力","B":"a球在空中飞行的距离更远，因为凹坑可以减少阻力并提供更多的升力","C":"b球在空中飞行的距离更远，因为光滑的球体可以减少阻力并提供更多的升力","D":"a球在空中飞行的距离更远，因为凹坑虽然稍微增加空气阻力但提供更多的升力"},"answer":"B","explanation":"本题考查科技常识。\nA、C、D三项错误，B项正确，球的飞行轨迹不仅受到自身重力的影响，还会受到来自空气的阻力的影响。我们通常会以为粗糙的球会受到更大的阻力，但这只考虑到了摩擦阻力，球在飞行中还受到一个压差阻力，也就是作用在球的前后的阻力，这个阻力比摩擦力的影响更大。球在飞行时，会产生“边界层效应”，如果表面粗糙，会在球的边界产生各种湍流，这些湍流都会影响球的飞行速度和线路。在球体飞行时，表面越是粗糙的球，受到的压差阻力反而越小，也因此粗糙的球会飞得更远。这一效应在球类运动上应用最明显的就是高尔夫球，在高尔夫球的表面，有很多规则的凹凸面，这些凹凸面是故意设计的，就是为了让球飞得更远。 \n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"5510033","cat":"人文常识","stem":"下列所描述的现象不会出现的是：","options":{"A":"到大柱子后面可以躲避寒风，柱子越大背后风速越小","B":"慢慢倒酒水时，酒水会在酒瓶口的边缘附壁流下来","C":"让小汤匙的凸面轻轻接触水龙头流出的小水流，水流会被吸引，沿着汤匙的凸面往下流","D":"拿一个鸡蛋放在水龙头的细小水流下，鸡蛋上半部的水流并没有沿着切向垂直向下流，而是继续沿鸡蛋表面汇聚到蛋壳的最低点才往下流"},"answer":"A","explanation":"本题考查科技常识。\n康达效应亦称附壁作用或柯恩达效应。流体（水流或气流）由偏离原本流动方向，改为随着凸出的物体表面流动的倾向。当流体与它流过的物体表面之间存在表面摩擦时（也可以说是流体粘性），只要曲率不大，流体就会顺着该物体表面流动。\nA项错误，到大柱子后面不可以躲避寒风，因为柱子越大背后风速越大。\nB项正确，倒酒会沿着杯壁流下是受到液体表面张力和康达效应共同作用的结果。当慢慢倒酒水的时候，酒水会在容器表面停留更长时间，水分子与杯壁的粘附力比与水分子的内聚力更大，压力差也将出现在一侧，酒水将沿着容器的一侧流下。\nC项正确，康达效应也称边界吸附效应。当流体经过具有一定弯度的凸面的时候，有向凸面吸附的趋向。将汤匙的背面接触水流，水流会被吸引，沿着汤匙的凸面往下流，这是附壁作用的结果。附壁作用令水流一直在汤匙上的凸面流动。\nD项正确，康达效应讲的是流体（水流或气流）有离开本来的流动方向，随着凸出的物体表面流动的倾向。鸡蛋放在水龙头下水沿着鸡蛋表面流动体现的是康达效应。\n本题为选非题，故正确答案为A。","no":20,"missingImage":false}],"count":12,"answerable":12,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"5509952","cat":"逻辑填空","stem":"编译工作是寂寞的。一盏灯、一杯茶、一支笔、一沓纸、一摞书、一个悠长的夜晚，这是编译人员在岗位上            的写照。他们不在意外界的喧哗，只坚守内心的宁静。\n填入划横线部分最恰当的一项是：","options":{"A":"兢兢业业","B":"克勤克俭","C":"勤学苦练","D":"夜以继日"},"answer":"A","explanation":"根据“编译工作是寂寞的”“他们不在意外界的喧哗，只坚守内心的宁静”可知，横线处所填成语要体现出编译人员在岗位上耐得住寂寞、踏踏实实坚守在工作岗位上之意。A项“兢兢业业”形容做事谨慎、勤恳、踏实，符合文意，当选。\nB项“克勤克俭”指的是既能勤劳，又能节俭，文段未体现出“节俭”之意，排除；\nC项“勤学苦练”指的是认真学习，刻苦训练，文段描述的是工作状态，而非学习、训练的状态，不符合文段语境，排除；\nD项“夜以继日”指的是用晚上的时间接上白天，形容昼夜不停，置于文段中形容编译人员在岗位上的工作状态程度过重，排除。\n故正确答案为A。\n【文段出处】人民日报《老中青三代编译人，坚守马列经典编译阵地——他们让真理穿越时空》","no":21,"missingImage":false},{"type":"question","qid":"5509953","cat":"逻辑填空","stem":"互联网时代的网民，不再是过去处于某一特定组织、相对具有整体性的“人民”。网络对社会成员进行了“再组织化”，各行各业的人群基于话题、诉求、兴趣爱好等重新组合，而且，互联网极大地推动了知识的大众化、民主化，使群众拥有了更多发言渠道，拥有了信息获取和自我强化的能力。这意味着观念和精神秩序的        。\n填入划横线部分最恰当的一项是：","options":{"A":"重塑","B":"重构","C":"形塑","D":"建构"},"answer":"A","explanation":"横线处搭配“观念”和“精神秩序”，且根据指代词“这”以及“各行各业的人群基于话题、诉求、兴趣爱好等重新组合”可知，横线处应体现重新改变之意，A项“重塑”指重新塑造，与“观念”“精神秩序”搭配恰当，且符合文意，当选。B项“重构”指重新构建，与“观念”搭配不当，排除；C项“形塑”指塑造，D项“建构”指建立，均无法体现重新改变之意，排除。\n故正确答案为A。\n【文段出处】半月谈《精准感知互联网时代民情》","no":22,"missingImage":false},{"type":"question","qid":"5509954","cat":"逻辑填空","stem":"无论题材如何变化，这位词作者的作品里都流淌着浓厚的传统文化神韵。《国旗之下》也不例外：“北上漠河，早见一番冰雪。南下三沙，海鸥追逐，浪花飞泻。东抵抚远，遥望日出东海。西陲乌恰，背倚天山，大漠横绝。”四六言错落有致，几句话就把祖国的东西南北“四至”的特点        出来，读起来荡气回肠。\n填入划横线部分最恰当的一项是：","options":{"A":"勾勒","B":"擘画","C":"叙述","D":"描绘"},"answer":"A","explanation":"横线处搭配“特点”，且要与前文“几句话”对应，体现出简单描述之意。A项“勾勒”指用线条勾画出轮廓，与文意相符，当选。B项“擘画”指计划，布置，C项“叙述”指写出或说出事情的前后经过，一般比较详细，D项“描绘”指用线条、颜色或语言文字表现事物的情景，均与文意不符，排除。\n故正确答案为A。\n【文段出处】兵团日报《将传统文化神韵融入作品》","no":23,"missingImage":false},{"type":"question","qid":"5510032","cat":"逻辑填空","stem":"在进行植树任务时，无人机植树系统首先会对地势展开        ，利用地形数据，画出需要再造树林的高分辨率3D地图，同时画出播种路线图，        播种的最优路线。接着，无人机会在播种范围内飞行并进行“精密的植树活动”，利用空气压力把顶部发芽的种子射进土壤里。\n依次填入划横线部分最恰当的一项是：","options":{"A":"勘验 确定","B":"勘探 拟定","C":"勘测 设计","D":"勘察 设定"},"answer":"D","explanation":"第一空，搭配“无人机植树系统”，且根据“利用地形数据，画出需要再造树林的高分辨率3D地图”可知，横线处所填词语应体现无人机植树系统在进行植树任务时会对地势进行考察，D项“勘察”指实地考察或调查，勘查，置于此处可体现无人机植树系统对地形的考察，符合文意，保留。A项“勘验”指司法人员对案件或民事纠纷的现场、物证等进行实地勘查和检验，多指司法人员对现场、物证的勘查，与“无人机植树系统”搭配不当，排除；B项“勘探”指查明矿藏分布情况，测定矿体的位置、形状、大小、成矿规律、岩石性质、地质构造等情况，文段指对地形的考察，而非查明矿藏，与文意不符，排除；C项“勘测”指勘察和测量，多指施工前工人到实地进行调查测量，与“无人机植树系统”搭配不当，排除。\n第二空，代入验证，D项“设定”指设置确定，拟定，与“接着，无人机会在播种范围内飞行”对应恰当，符合文意，当选。\n故正确答案为D。\n【文段出处】《厉害了无人机植树系统！一天能种几万颗树》","no":24,"missingImage":false},{"type":"question","qid":"5509958","cat":"逻辑填空","stem":"如果我们放宽视野，不难发现以同一性为基础的韵律原则在汉语文学之中是            的。宽泛意义上的“偶语”几乎是充盈整个汉语文章体式的“韵律结构”，不仅让语言具有内在的对称感与        感，而且也是文章气势的来源。\n依次填入画横线处最恰当的一项是：","options":{"A":"蔚为大观 融洽","B":"信手拈来 愉悦","C":"更仆难尽 和谐","D":"无所不在 平衡"},"answer":"D","explanation":"第一空，根据“几乎是充盈整个汉语文章体式”可知，以同一性为基础的韵律原则在汉语文学中的应用是非常多、非常普遍的，因此横线处所填成语应体现普遍、数量多之意。A项“蔚为大观”意为丰富多彩，成为盛大的景象，C项“更仆难尽”形容人或事物很多，D项“无所不在”意为到处都存在，到处都有，均与文意相符，保留。B项“信手拈来”多形容写文章时词汇或材料丰富，不费思索，就能写出来，强调很容易写出来，并未体现普遍之意，排除。\n第二空，根据“与”可知，横线处所填词语与“对称感”构成并列关系，体现“偶语”这种“韵律结构”给人带来的与“对称感”相近的直观感受。D项“平衡”意为对立的各方面在数量或质量上相等或相抵，置于此处能够与“对称感”构成并列关系，且与文意相符，当选。A项“融洽”意为彼此感情好，没有抵触，C项“和谐”意为和睦协调，均无法与“对称感”构成并列关系，且无法直接体现“偶语”给人带来的感受，排除。\n故正确答案为D。\n【文段出处】书籍《“韵”之离散：关于当代中国诗歌韵律的一种观察》","no":25,"missingImage":false},{"type":"question","qid":"5510040","cat":"逻辑填空","stem":"在应《洛杉矶书评》邀请所撰写的回应文章里，狄波拉强调了艺术赋予文学翻译“二度创作的许可”：从中文翻译到英文不仅是语言的        ，更是在两个迥异的文学传统之间        ，汉语更包容、含蓄和灵动，但是英语强调精准、凝练和优美。\n依次填入划横线部分最恰当的一项是：","options":{"A":"转换 迁徙","B":"转移 迁就","C":"转达 迁移","D":"转运 迁居"},"answer":"A","explanation":"第一空，搭配“语言”，根据“从中文翻译到英文”可知，语言发生了变化，A项“转换”指改变、改换，符合文意，保留。B项“转移”指改换位置，从一方移到另一方，一般搭配方向、位置等，与“语言”搭配不当，排除；C项“转达”指把一方的话转告给另一方，文段仅体现语言的变化，并无转告之意，与“语言”搭配不当，排除；D项“转运”指把运来的东西再运到另外的地方去，文段并无运送之意，与“语言”搭配不当，排除。\n第二空，代入验证，A项“迁徙”指迁移，有变易、更改之意，填入文段体现出在两个不同的文学传统之间变化之意，符合文意，当选。\n故正确答案为A。\n【文段出处】澎湃新闻《翻译的政治与美学陷阱：从&lt;素食主义者&gt;英译谈起》","no":26,"missingImage":false},{"type":"question","qid":"5510043","cat":"逻辑填空","stem":"由中国歌剧舞剧院推出的舞蹈剧《英雄儿女》以宏伟壮阔的叙事风格、史诗般的影像        、沉浸式的体验，带领观众走进抗美援朝那段激情燃烧的岁月。该剧汇集多种舞蹈形态，舞美运用高科技手段，为观众营造身临其境之感，并以油画的美术风格力图        那个时代的真实色彩。\n依次填入划横线部分最恰当的一项是：","options":{"A":"艺术 描摹","B":"质感 还原","C":"效果 表现","D":"元素 展示"},"answer":"B","explanation":"本题可从第二空入手，搭配“那个时代的真实色彩”，且根据“为观众营造身临其境之感”可知，该剧为观众带来的感受是仿佛回到了当时的场景，故横线处所填词语应体现彷佛回到那个时代之意，B项“还原”指事物恢复原状，符合文意且与“那个时代的真实色彩”搭配恰当，保留。A项“描摹”指用语言文字表现人或事物的形象、情状、特性等，或指照着底样写和画，C项“表现”指表示出来、显现出来，D项“展示”指清楚地摆出来、明显地表现，两项侧重于显示出来，均无法与前文中“为观众营造身临其境之感”对应，排除。\n第一空，代入验证，搭配“史诗般的影像”，B项“质感”指艺术品所表现的物体特质的真实感，符合文意且搭配恰当，当选。\n故正确答案为B。\n【文段出处】《一批抗美援朝战争题材文艺作品涌现：重现、致敬、缅怀，为了“最可爱的人”》","no":27,"missingImage":false},{"type":"question","qid":"5510046","cat":"逻辑填空","stem":"海南自贸港建设根据“三区一中心”的定位要求，把优化口岸营商环境作为发力点，出台了优化口岸营商环境、提升跨境贸易便利化水平的12项措施，努力推动打造适应自贸港建设需要的一流口岸营商环境，正是在这样的        环境下，海南出口运输迎来了        发展期。\n依次填入画横线部分最恰当的一项是：","options":{"A":"优越 蓬勃","B":"优秀 富足","C":"优异 繁荣","D":"优惠 兴替"},"answer":"A","explanation":"第一空，搭配“环境”，且根据横线前指代词“这样的”可知，指代前文“把优化口岸营商环境作为发力点······努力推动打造适应自贸港建设需要的一流口岸营商环境”，故横线处应体现“环境一流”之意，A项“优越”指优胜、优良，与“环境”搭配恰当且符合文意，保留。B项“优秀”指（品行、成绩等）非常好，C项“优异”指（成绩、表现等）优秀，出色，D项“优惠”指较一般优厚，通常搭配政策、条件等，均与“环境”搭配不当，排除。\n第二空，代入验证，A项“蓬勃”意思是繁荣，旺盛，置于此处可体现出海南出口运输迎来了繁荣、旺盛的发展期，符合文意，当选。\n故正确答案为A。\n【文段出处】人民论坛网《人民论坛网评 | 海南自由贸易港任重而道远》","no":28,"missingImage":false},{"type":"question","qid":"5510049","cat":"逻辑填空","stem":"国家文化公园的建设将展示最具有独特性、生命力、影响力和传播力的文化        ，人们在游览体验中感受文化、领悟文化，进而增强文化自信心和提升文化认同感，在心意相通里让文脉        流淌。在这一过程中国家文化公园实现了文化资源保护、利用和传承的统一。\n依次填入划横线部分最恰当的一项是：","options":{"A":"风景 永远","B":"地标 持续","C":"景物 长远","D":"景观 永续"},"answer":"D","explanation":"第一空，根据横线前内容可知，横线处所填词语搭配“文化”且形容“国家文化公园的建设”，D项“景观”意为自然界的景色，也泛指可供观赏的景物，与“文化”搭配恰当，且“文化景观”为常用搭配，保留。A项“风景”意为一定区域内由山水、花草、树木、建筑物等形成的可供人观赏的景象，C项“景物”意为可供观赏的事物，均与“文化”搭配不当，排除；B项“地标”意为用来标示界线位置的目标物或地面上的显著标志，无法与文中“国家文化公园的建设”构成对应，排除。\n第二空，代入验证，由横线后“国家文化公园实现了文化资源保护、利用和传承的统一”可知，横线处所填词语体现文脉一直传承之意，D项“永续”意为长久持续，永远继续，符合文意，当选。\n故正确答案为D。\n【文段出处】道客巴巴《国家文化公园建设中的现实误区及改进途径》","no":29,"missingImage":false},{"type":"question","qid":"5509957","cat":"逻辑填空","stem":"注重观测记录和规律总结，是中国古代科技的一大特点，沈括的《梦溪笔谈》、宋应星的《天工开物》中，至今都有着            的闪光点。在天文、地理、气象、农学等领域，古人        的记录可谓汗牛充栋。\n依次填入画横线处最恰当的一项是：","options":{"A":"可圈可点  勤奋","B":"令人赞叹  勤勉","C":"叹为观止  辛勤","D":"感人肺腑  勤劳"},"answer":"B","explanation":"第一空，搭配“闪光点”，且需体现《梦溪笔谈》《天工开物》直到今天仍然具有一定的价值。B项“令人赞叹”指让人称赞、赞美，符合文段语境，保留。A项“可圈可点”形容表现好，值得肯定或赞扬，一般搭配“表现”“举措”等，与“闪光点”搭配不当，排除；C项“叹为观止”指赞美看到的事物好到极点，通常表述为“有着让人/令人叹为观止的闪光点”，置于此处用法错误，排除；D项“感人肺腑”指使人内心深受感动，文段说的是沈括的《梦溪笔谈》和宋应星的《天工开物》注重观测记录和规律总结，令人称赞，并无令人感动的语境，排除。\n第二空，代入验证。B项“勤勉”指勤奋，能够体现古人的相关记录有很多，符合文意，当选。\n故正确答案为B。\n【文段出处】光明日报《古代科技的现代映照》","no":30,"missingImage":false},{"type":"question","qid":"5510054","cat":"逻辑填空","stem":"一份《2022国民专注力洞察报告》显示，当代人的连续专注时长，已经从2000年的12秒，下降到了8秒。在网络时代，专注力越来越像一种“        品”。人们的时间与注意力被不断地切割，保持长久的专注已经成为一种非常难得的        。\n依次填入画横线处最恰当的一项是：","options":{"A":"稀有 风格","B":"稀缺 品质","C":"珍藏 品行","D":"稀罕 品格"},"answer":"B","explanation":"第一空，横线处所填词语与“品”搭配使用，且根据“当代人的连续专注时长，已经从2000年的12秒，下降到了8秒”可知，在网络时代连续专注的时长在降低，专注力是缺少的、不足的。A项“稀有”指很少见，B项“稀缺”指稀少短缺，且“稀缺品”为固定搭配，均符合文意，保留。C项“珍藏”指有价值而妥善收藏，文段并未体现“专注力有价值被收藏”的意思，排除；D项“稀罕”指稀奇，通常用于口语表述，且一般不与“品”搭配使用，排除。\n第二空，根据文意“人们的时间与注意力被不断地切割”可知，人们很难保持长久的专注力，故保持长久的专注是人们难得的品德、优点。B项“品质”指行为、作风上表现出来的思想、认识、品性等的本质，符合文意，当选。A项“风格”指作风、品格，通常区别于其他人，如别具风格、独特风格等，文段并未体现与他人的比较，不符合文意，排除。\n故正确答案为B。\n【文段出处】光明网《网络时代，专注力为何成了“稀缺品”》","no":31,"missingImage":false},{"type":"question","qid":"5510055","cat":"逻辑填空","stem":"彩礼在古代称为聘礼或聘财，古代法律对聘财的认定标准相当        ，对聘财的形式及数量并无严格的限定。如唐律中“聘财不拘重轻，但同媒约言明纳送礼仪者方是。”立法者的意图非常明确，聘礼不以钱物多少为限，只要双方具有以此作为聘礼的共同认识，即为法律所        。\n依次填入画横线处最恰当的一项是：","options":{"A":"宽松 认可","B":"明确 认同","C":"模糊 承认","D":"宽泛 许可"},"answer":"A","explanation":"第一空，根据“对聘财的形式及数量并无严格的限定”可知，横线处要体现认定标准不严格、不具体之意，A项“宽松”指宽绰、不拥挤、宽畅、宽裕，符合文意，保留。B项“明确”指清晰明白，C项“模糊”指不清楚、不分明，其相反面为清晰，D项“宽泛”指（内容意义等）涉及的面宽，侧重于广泛，均未体现不严格之意，与文意不符，排除。\n第二空，代入验证，搭配“法律”，A项“认可”指承认、许可，搭配恰当，当选。\n故正确答案为A。\n【文段出处】《中国古代彩礼漫谈》","no":32,"missingImage":false},{"type":"question","qid":"5509956","cat":"逻辑填空","stem":"沙珠玉，曾是黄河上游风沙危害最严重的地区之一。20世纪50年代，沙珠玉九成草场已沙漠化。最严重的半年，沙丘向居民点推进了47米。            ，沙珠玉人开始            。对他们来说，造林治沙，是一场用性命与风沙所做的生死搏斗。60多年来，沙珠玉人营造起18道防风林，层层叠叠的树木，硬生生将狂风顶住、逼沙丘后退。\n依次填入划横线部分最恰当的一项是：","options":{"A":"山穷水尽 孤注一掷","B":"不进则退 迎难而上","C":"退无可退 绝地反击","D":"寸步难行 背水一战"},"answer":"C","explanation":"第一空，根据前文“20世纪50年代，······沙丘向居民点推进了47米”可知，横线处体现出沙丘向居民点推进，风沙情况非常严重之意，C项“退无可退”指没有地步可退，形象体现出沙丘向居民点推进，居民没办法后退之意，符合文意，保留。A项“山穷水尽”指山和水都到了尽头，前面再没有路可以走了，比喻陷入绝境，侧重强调前面没有路可走，与文段中“沙丘向居民点推进”的对应不如C项恰当，排除。B项“不进则退”指不前进就要后退，强调进步的重要性，无法体现沙珠玉地区风沙危害的严重性，排除。D项“寸步难行”比喻开展某项工作困难重重，置于此处缺少主语，用法不当，正确用法应为“沙珠玉人寸步难行”，排除。\n第二空，代入验证，根据后文“对他们来说，造林治沙，······逼沙丘后退”可知，横线处表达沙珠玉人在面对风沙危害十分严重的情况下积极采取措施进行治理，C项“绝地反击”指在绝境孤注一掷的进行反抗，符合文意，当选。\n故正确答案为C。\n【文段出处】《青海：遍野“青绿”最动人》","no":33,"missingImage":false},{"type":"question","qid":"5510056","cat":"逻辑填空","stem":"越来越多的年轻人，不再扎堆前往热门旅游城市，而是选择“反向旅游”：通过选择冷门目的地、打卡非旅游城市、“宅”式度假的方式，让自己的假期更加舒适。“反向旅游”对一些热门旅游目的地的        ，能够        其提升景区的服务水平和运营能力，而不是躺在自然资源上坐地收钱。\n依次填入画横线处最恰当的一项是：","options":{"A":"引流 迫使","B":"疏导 推动","C":"分流 倒逼","D":"引导 反推"},"answer":"C","explanation":"第一空，根据前文“不再扎堆前往热门旅游城市”和“选择冷门目的地、打卡非旅游城市”可知，横线处所填词语应体现不去热门旅游目的地之意。B项“疏导”指使淤塞的水流或阻塞的道路畅通，C项“分流”指分开流动，分散流动，均符合文意，保留。A项“引流”指传送的行为（如通过管子引水），D项“引导”指带领，使跟随，填入文段体现人变多了，均与文意相悖，排除。\n第二空，根据前后文可知，“反向旅游”反向推动热门旅游目的地提升服务水平和运营能力。C项“倒逼”指逆向逼迫，反向推动，符合文意，当选。B项“推动”指使劲地推向前或摇动，为正向推动，与文意不符，排除。\n故正确答案为C。\n【文段出处】新华网《“反向旅游”兴起 年轻人的口味为啥变了》","no":34,"missingImage":false},{"type":"question","qid":"5510065","cat":"逻辑填空","stem":"早在远古时代，人们就对晴朗夜空中那条神秘的白色亮带——银河充满好奇，并为其        了多个富有诗意的名字以及各种美丽的传说。如今，生活在不夜城里的人们已很难亲眼目睹银河的美景。尽管如此，人们        银河全貌的努力却从未停止。幸运的是，天文学家正借助不断升级的观测技术和设备，将银河系的全貌愈加清晰地展现在我们面前。\n依次填入划横线部分最恰当的一项是：","options":{"A":"授予 观察","B":"赋予 窥探","C":"设计 窥伺","D":"遐想 考察"},"answer":"B","explanation":"本题可从第二空入手。横线处搭配“银河全貌”。A项“观察”指仔细观看（事物或现象），B项“窥探”指暗中察看，也指观察探索，二者均与“银河全貌”搭配恰当，保留。C项“窥伺”指暗中观望动静，等待时机（多含贬义），与“银河全貌”搭配不当，且与文段感情色彩不符，排除。D项“考察”指实地观察调查，与“银河全貌”搭配不当，排除。\n第一空，根据“多个富有诗意的名字以及各种美丽的传说”可知，横线处所填词语需同时搭配“名字”和“传说”。B项“赋予”指交给（重大任务、使命、意义等），与“名字”“传说”搭配恰当，且符合文意，当选。A项“授予”指给予（勋章、奖状、学位、荣誉等），多用于正式的场合，强调正式给予，与“传说”搭配不当，排除。\n故正确答案为B。\n【文段出处】中国知网《绘制银河》","no":35,"missingImage":false},{"type":"question","qid":"5509955","cat":"逻辑填空","stem":"中国元素与现代奥运的激情碰撞、科技赋能下的            、独具东方美学色彩的审美意象······2022年北京冬奥会、冬残奥会虽然已落下帷幕，但“两个奥运”中形象鲜活的中国元素与创意无限的艺术        将永远镌刻在奥林匹克的历史中。\n依次填入划横线部分最恰当的一项是：","options":{"A":"别出心裁 反响","B":"匠心独运 呈现","C":"推陈出新 构思","D":"标新立异 表达"},"answer":"B","explanation":"第一空，根据顿号可知，横线所填成语与“独具······审美意象”构成并列，体现出中国奥运会不同于其他奥运会之意，A项“别出心裁”指独出巧思，不同流俗，B项“匠心独运”形容独特精巧的艺术构思，D项“标新立异”原指为表明自己新颖的义理，提出与众不同的见解，后来也指故意提出新奇的见解，表示自己与众不同，均符合文意，保留。C项“推陈出新”指去掉旧事物的糟粕，取其精华，并使它向新的方向发展（多指继承文化遗产），文段并未体现“去掉旧事物的糟粕”之意，排除。\n第二空，横线处搭配“艺术”，B项“呈现”指显现，展示出，侧重能明显看见，D项“表达”指把思想感情表示出来，均与“艺术”搭配恰当，根据前文“独具东方美学色彩的审美意象······已落下帷幕”可知，文段强调艺术元素在奥运会中被人们看到，故“呈现”更加符合文意，B项当选，D项排除。且文段围绕“艺术、审美”的话题展开，B项“匠心独运”形容独特精巧的艺术构思，比D项“标新立异”更加契合文段艺术语境。A项“反响”指事物所引起的意见、态度或行动，一般搭配“引起”“强烈”等，与“艺术”搭配不当，排除。\n故正确答案为B。\n【文段出处】《款款奥运情 浓浓中国味》","no":36,"missingImage":false},{"type":"question","qid":"5509960","cat":"逻辑填空","stem":"21世纪诗坛尽管            ，众声喧哗，但在重量级诗人的输送上逊色于上世纪八九十年代。十足才子气背后大手笔缺位，群星闪烁而无月，多元并举背面是欠缺规范，许多诗人理想        ，有理论锐气，但创作上尚未提供与理论        的文本。\n依次填入画横线处最恰当的一项是：","options":{"A":"林林总总  高远  匹配","B":"光怪陆离  高蹈  配合","C":"多姿多彩  远大  搭配","D":"泥沙俱下  崇高  契合"},"answer":"A","explanation":"第一空，横线处与“众声喧哗”构成并列，语义相近，表达“多”的意思，A项“林林总总”形容多得成群，C项“多姿多彩”形容颜色形态多样，两项均符合文意，保留。B项“光怪陆离”形容奇形怪状，五颜六色，也形容事物离奇多变，文段并未体现“奇形怪状”之意，与文意不符，排除；D项“泥沙俱下”比喻好的和坏的混杂在一起，无法体现出“多”的意思，与文意不符，排除。\n第二空，搭配“理想”，A项“高远”指高而深远，C项“远大”指一个人的志向、见解、前程等高远而伟大，均与“理想”搭配得当，保留。\n第三空，横线处应体现文本与理论的关系，A项“匹配”与“文本”“理论”搭配恰当，当选。C项“搭配”无法形容文本理论的关系，与“文本”“理论”搭配不当，排除。\n故正确答案为A。\n【文段出处】中国作家网《21世纪新诗整装再出发》","no":37,"missingImage":false},{"type":"question","qid":"5510066","cat":"逻辑填空","stem":"统一市场是发达市场经济的重要标志，是大国经济实现高质量发展的制度基础。进入新发展阶段，作为世界最大的发展中国家，中国加快建设全国统一大市场，是构建高水平社会主义市场经济体制的        选择，也是构建新发展格局、实现高质量发展的基础        和内在        。\n依次填入横线处最恰当的一组是：","options":{"A":"必定 支持 需求","B":"必然 支撑 要求","C":"必须 支架 需要","D":"必由 支柱 请求"},"answer":"B","explanation":"第一空，根据“统一市场是发达市场经济的重要标志，是大国经济实现高质量发展的制度基础”可知，横线处应体现中国加快建设全国统一大市场对市场经济体制的重要性，B项“必然”指一定会这样，表示事理上确定不移，符合文意且“必然选择”为常用词搭配，保留。A项“必定”表示肯定的推断，文段为客观陈述，不涉及推断，与文意无关，排除；C项“必须”表示事理上和情理上必要，与“选择”搭配不当，排除；D项“必由”表示必须要经由的，如必由之路，与“选择”搭配不当，排除。\n第二空，代入验证，B项“基础支撑”搭配恰当，且符合文意，保留；\n第三空，代入验证，B项“内在要求”搭配恰当，且符合文意，当选。\n故正确答案为B。\n【文段出处】中国证券网《王微：加快建设全国统一大市场 推动高水平市场经济体制建设迈出新步伐》","no":38,"missingImage":false},{"type":"question","qid":"5509966","cat":"逻辑填空","stem":"语言是社会生活的一面镜子，流行语则给这面镜子打上了时代的        ，让这面镜子        出与时代俱进的镜像。“强国有我”“双减”“YYDS”“破防”“内卷”······让我们看到了语言的            ，也让我们对流行语发布和研究涉及的具体问题有了许多思考。\n依次填入划横线部分最恰当的一项是：","options":{"A":"标记 映照 包罗万象","B":"标识 投映 五彩缤纷","C":"标签 折射 丰富多彩","D":"标注 投射 形形色色"},"answer":"C","explanation":"第一空，横线处所填词语要表达流行语使得语言体现出时代的特点，如同给语言这面镜子打上了时代的记号这一含义，A项“标记”指标志、记号，B项“标识”指用来识别的记号，C项“标签”指贴在或系在物品上，标明品名、用途、价格等的纸片，均符合文意，保留。D项“标注”指标示并注明，为动词词性，置于此处用法不当，排除。\n第二空，横线处所填词语要表达镜子可以体现出与时代俱进的内容，且对应形象表达，则应符合“镜子”的特点，B项“投映”指（影像）呈现在物体上，C项“折射”指光线、声波在传播过程中遇到物体阻挡而改变方向的现象，均符合文意，保留。A项“映照”指照射、呼应，与“投映 ”“折射”对比而言，和“镜子”的对应不够贴切，排除。\n第三空，根据“‘强国有我’‘双减’‘YYDS’‘破防’‘内卷’”可知，横线处所填成语要表达流行语涉及的范围广，包含的内容多之意，C项“丰富多彩”指内容丰富，种类多样，符合文意，当选。B项“五彩缤纷”形容色彩繁多而艳丽，侧重强调色彩，与文意不符，排除。\n故正确答案为C。\n【文段出处】《流行语的发布，离不开语言事实的标准和整全性的社会观照》","no":39,"missingImage":false},{"type":"question","qid":"5509965","cat":"逻辑填空","stem":"老字号拥有品牌优势，在做精做强、发展壮大方面具有独特优势。老字号所        的独特产品、精湛技艺和经营理念，具有            的品牌价值、经济价值和文化价值，它们         着优秀的中华民族文化，是新时期弘扬商业文明的核心内涵和宝贵财富。\n依次填入划横线部分最恰当的一项是：","options":{"A":"秉持  名利双收  凝聚","B":"传承  不可估量  承载","C":"恪守  管中窥豹  发扬","D":"弘扬  守正创新  锤炼"},"answer":"B","explanation":"第一空，搭配“产品”“技艺”“理念”，B项“传承”指传递和继承，与“产品”“技艺”“理念”均搭配恰当，保留。A项“秉持”指执持、持有、具有，常与“理念”“原则”“精神”搭配，与“产品”“技艺”均搭配不当，排除；C项“恪守”指谨慎而恭顺地遵守，常与“规则”“政策”搭配，与“产品”“技艺”搭配不当，排除；D项“弘扬”指大力宣传，常与“精神”“文化”搭配，与“产品”均搭配不当，排除。\n第二空，代入验证，搭配“品牌价值、经济价值和文化价值”，且根据“具有独特优势”可知，横线处表示老字号的各种价值巨大，B项“不可估量”指难以估计，体现了价值的巨大，符合文意，保留。\n第三空，代入验证，根据“是新时期弘扬商业文明的核心内涵和宝贵财富”可知，横线处表示老字号包含着丰富的中华文化内涵之意，B项“承载”指承受负载，符合文意，当选。\n故正确答案为B。\n【文段出处】海外网《老字号“名利双收”不是没可能》","no":40,"missingImage":false},{"type":"question","qid":"5509944","cat":"片段阅读","stem":"在信息化时代和学习化社会进程里，学习权客观上要求国家能真正提供满足个体差异性发展的平等教育机会。但这并不意味着教育自由是一种没有限度的自由，当教育自由超越了教育目的的要求以及社会允许的范围时，就需要国家公权力予以保障。结合我国实际，除了对学习权进行立法保障外，最为主要的也最为可行的办法就是调整现有相关的法律法规，完善公民学习权利的法律法规保障细则，从共同利益视角保障学习权，为终身学习社会下的公民学习权利法律保障提出治理思路。\n这段文字意在说明：","options":{"A":"学习权利的法律保障","B":"国家公权力的重要性","C":"学习权的产生及权利性质","D":"学习权利需要公权力的保障"},"answer":"D","explanation":"文段开篇介绍了学习权在客观上的要求，转折词“但”后说明当教育自由超越了教育目的的要求以及社会允许的范围时，通过“需要”提出对策，即用国家公权力来保障，接着通过我国的实际情况来进行论述，具体论述了学习权需要通过公权力来对相关的法律法规进行保障，故文段重点在转折之后，围绕“学习权”与“公权力”的话题展开，强调学习权需要公权力的保障，对应D项。\nA项，“学习权利的法律保障”对应尾句解释说明部分，非重点，且缺少“公权力”的话题，排除；\nB项，缺少“学习权”的话题，排除；\nC项，文段并未介绍学习权是如何产生的，无中生有，排除。\n故正确答案为D。\n【文段出处】《从受教育权到学习权：终身学习社会的权利转型》","no":41,"missingImage":false},{"type":"question","qid":"5509946","cat":"片段阅读","stem":"目前，新型消费也并非一种已经发展成熟或已定型的消费形态，随着数字技术的加快发展，将来可能还会出现更多新的消费业态和消费模式。“数字化”是新型消费最基本的属性。新型消费对人们的消费理念、消费模式和消费场景等多方面产生了新的影响。可以说，新型消费绝不是一次普通的消费升级，而是新时代的一场消费革命。\n这段话主要讲述了：","options":{"A":"新型消费的影响","B":"新型消费的内涵","C":"新型消费的体系","D":"新型消费的视角"},"answer":"B","explanation":"文段首先引出“新型消费”这一话题，指出新型消费并非发展成熟或已定型，接着介绍了新型消费的基本属性，随后指出新型消费对人民的消费产生了新的影响，尾句通过“可以说”得出结论，即新型消费是新时代的一场消费革命。故文段重点介绍新型消费是什么，对应B项。\nA项“影响”对应结论前，非重点，排除；\nC项“体系”、D项“视角”，文段均未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《新型消费与数字化生活：消费革命的视角》","no":42,"missingImage":false},{"type":"question","qid":"5510067","cat":"片段阅读","stem":"我们往往喜欢弄清楚某件事“到底是黑还是白”，这种思维方式称为“非黑即白的思维方式”。但是，“非A即B”的思维方式从逻辑学来看是错误的。当陷入非黑即白的思维方式时，我们所看到的只有极端的选择，所以容易做出错误判断，甚至上当受骗。例如，“不买这个壶会招来不幸哦”，卖壶的骗子巧妙利用语言，让人陷入“买这个壶会招来好运，不买这个壶会招来不幸”的非黑即白的思维方式中。实际上，还有“不买壶会招来好运”“买了壶会招来不幸”的情况。因此，当你被迫做出“A或B”的选择时，不妨停下来思考一下所有的4个选择。\n这段文字意在强调：","options":{"A":"世界充满了非黑即白的思维方式","B":"要避免陷入非黑即白的思维误区","C":"“非A即B”从逻辑上讲是错误的","D":"“非A即B”易让人做出错误判断"},"answer":"B","explanation":"文段首先论述人们往往有一种“非黑即白的思维方式”，接着通过转折词提出这种思维方式从逻辑学来看是错误的，容易让我们做出错误判断，甚至上当受骗，然后列举了卖壶的例子论证，并用“实际上”引出跳出“非A即B”的思维方式还有另外两种情况。最后通过“因此”提出文段重点，建议我们要被迫做出“A或B”的选择时应停下来思考一下所有的4个选择，即应避免陷入非黑即白的思维误区，对应B项。\nA项，“世界充满了非黑即白的思维方式”对应首句，非重点，排除；\nC项, “从逻辑上讲是错误的”对应结论前的内容，非重点，排除；\nD项，“易让人做出错误判断”对应结论前的内容，非重点，排除。\n故正确答案为B。\n【文段出处】科学世界2021年第3期《非黑即白的误区“非A即B”在逻辑上是错误的》","no":43,"missingImage":false},{"type":"question","qid":"5509951","cat":"片段阅读","stem":"人工智能在从事重复性、规则性、可编程的工作内容时更加快速、高效、精确，不仅可以替代体力劳动，而且可以替代大部分脑力劳动。随着人工智能的发展，翻译、导购、司机、会计等大量职业将可能被替代。同时，许多新职业被创造出来，促进了更高质量的就业发展。这些新职业主要集中在高新技术领域、新兴产业和现代服务业，如人工智能工程技术人员、数字化管理师等，大量劳动力从第一、第二产业转向第三产业，从传统职业转向新兴职业，从重复性、低价值的岗位转向创造性、高价值的岗位。\n这段文字主要说明：","options":{"A":"人工智能促使就业结构深度调整","B":"人工智能重构社会再生产各环节","C":"人工智能推动了产业智能化升级","D":"人工智能要求大幅提升就业能力"},"answer":"A","explanation":"文段开篇介绍人工智能在处理一些工作时更有效率，可以替代体力劳动和大部分脑力劳动，接下来介绍可能会被替代的职业，随后通过“同时”引导并列结构，表示人工智能的发展使许多新职业被创造出来，促进了更高质量的就业发展，并对这些新职业进行具体解释说明。故文段为并列结构，重点介绍人工智能的发展代替了大部分职业，也创造出了新职业，即人工智能促使就业结构发生变化，对应A项。\nB项，“重构社会再生产各环节”文段未提及，无中生有，排除；\nC项，“推动了产业智能化升级”仅对应文段后半部分，表述片面，排除；\nD项，“要求大幅提升就业能力”文段未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】《以人工智能促进就业发展》","no":44,"missingImage":false},{"type":"question","qid":"5510058","cat":"片段阅读","stem":"小麦原本是旱地作物，生长周期长，不适合在英国潮湿的环境种植，即使在罗马人统治时期，这里也只能种植生长周期短、耐湿耐寒的大麦和燕麦。因此，在英国引种小麦首先需要排水，最常见的方式是垄沟排水。9、10世纪，英国首次用重犁，重犁由犁刀、犁铧和推土板组成。犁刀切割地皮，犁铧深耕松土，推土板则起垄开沟。垄背上的水渗流到垄沟，再从垄沟排走。种子撒播在垄背上，地面离水，这种垄作技术有利于农作物生长。\n这段文字意在强调：","options":{"A":"重犁耕作是英国发明的耕作技术","B":"大麦和燕麦是英国的主要农作物","C":"在英国垄作技术有利于小麦生长","D":"英国农业发展的主要问题是排水"},"answer":"C","explanation":"文段开篇介绍英国环境潮湿，不适合种植旱地作物小麦，接着得出结论，英国引种小麦首先需要排水，最常见的方法是垄沟排水，然后介绍了垄沟排水的工具重犁及其使用方法，尾句由指代词“这”引导，总结上文。故文段为分总结构，强调英国的垄作技术有利于种植小麦，对应C项。\nA项，根据“9、10世纪，英国首次用重犁”可知，重犁首次在英国使用是在9、10世纪，无法推出“重犁耕作是英国发明的”，排除；\nB项，“大麦和燕麦是英国的主要农作物”对应结论之前内容，非重点，且缺少主题词“垄作技术”和“小麦”，排除；\nD项，缺少主题词“垄作技术”和“小麦”，排除。\n故正确答案为C。\n【文段出处】《水利与英国社会》","no":45,"missingImage":false},{"type":"question","qid":"5509948","cat":"片段阅读","stem":"当前，在发展格局的重要影响下，要实现我国零售业的高质量发展，就要发展线上和线下共同融合的多元立体零售模式，同时要重视新零售供应链生态圈的建设。电商平台企业除了整合上下游供应链合作伙伴、金融、服务及行业资源，朝着“有边界又无边界”的商业生态圈发展，还需要通过线上线下双渠道的协同联动实现持续发展的商业生态布局；商业企业要打破地域的空间限制，改变单一的店铺销售模式，积极借助数字化改造及建设的工具为“新零售”赋能，最终构建“多元要素协同”的“新零售”供应链生态圈。\n这段文字重在说明：","options":{"A":"“新零售”供应链的特征及潜能","B":"“新零售”供应链生态圈多维服务","C":"“新零售”供应链生态圈的协同逻辑","D":"“新零售”供应链生态圈的创新与竞争"},"answer":"C","explanation":"文段开篇指出要实现零售业的高质量发展就要发展多元立体零售模式，同时要建设好新零售供应链生态圈，随后提出电商平台企业要整合各类资源，还要通过线上线下的协同联动实现持续发展的商业生态布局，然后通过分号表并列，指出商业企业应打破空间限制、改变销售模式，为“新零售”赋能，构建“多元要素协同”的“新零售”供应链生态圈。故文段重在介绍“新零售”供应链生态圈要“多元要素协同”，主题词为“‘新零售’供应链生态圈”和“协同”，对应C项。\nA项“特征及潜能”、B项“多维服务”和D项“创新与竞争”均偏离文段核心话题，排除。\n故正确答案为C。","no":46,"missingImage":false},{"type":"question","qid":"5509950","cat":"片段阅读","stem":"“抵触”和“不一致”是“法律冲突”的两种情形。从语义上说，“抵触”或“不一致”，都是指两个规范在内容上的“非同一性”；而且它们有程度上的差别，可以说“抵触”是极端的“不一致”，“不一致”是轻微的“抵触”。但是，《立法法》将“纵向”法与法之间的法律冲突称为“抵触”，把“横向”法与法之间的冲突称为“不一致”。这样，在《立法法》的意义上，“抵触”与“不一致”不是一种法律冲突程度上的区别，而是一种法律冲突情景上和性质上的区别：下位法与上位法冲突称“抵触”，同位法之间的冲突称为“不一致”。\n下列与这段文字的意思相符的一项是：","options":{"A":"下位法与上位法相互矛盾而且冲突程度严重的，才属于“抵触”","B":"“抵触”和“不一致”是“法律冲突”的不同情形，纵横交错","C":"同位法之间，其规定的内容上出现“不同一”，属于“不一致”","D":"“抵触”与“不一致”在法律冲突程度、情景和性质上有区别"},"answer":"C","explanation":"A项，根据“下位法与上位法冲突称‘抵触’”可知，文段并未提及冲突程度严重，无中生有，排除；\nB项，根据“‘抵触’与‘不一致’不是一种法律冲突程度上的区别，而是一种法律冲突情景上和性质上的区别”可知，文段明确指出二者性质上存在不同，并未存在“交错”，表述错误，排除；\nC项，根据“从语义上说，‘抵触’或‘不一致’，都是指两个规范在内容上的‘非同一性’”“同位法之间的冲突称为‘不一致’”可知，表述正确，当选；\nD项，根据“‘抵触’与‘不一致’不是一种法律冲突程度上的区别，而是一种法律冲突情景上和性质上的区别”可知，“抵触”与“不一致”并非是法律冲突程度上的区别，表述错误，排除。\n故正确答案为C。\n【文段出处】《政法学苑 | 如何认识“法律冲突”》","no":47,"missingImage":false},{"type":"question","qid":"5509959","cat":"片段阅读","stem":"氨氧化古菌是一种广泛分布的海洋微生物，它们通过将氨氧化成亚硝酸盐来获得能量。这一过程需要氧气的参与，但它们却常分布在无氧环境中。最新研究发现，氨氧化古菌能在黑暗的缺氧环境中自行生成氧气。研究人员将其移至缺氧海水中，随着氨氧化反应的进行，氧气逐渐被耗尽，但几分钟后氧气浓度又升高。在排除其他可能后，研究人员判定是氨氧化古菌自行产生了氧气，虽然不多，但足以维持自身运行。不过，研究人员尚不完全清楚其产氧机制。\n与这段文字的意思相符的一项是：","options":{"A":"缺氧状态下亚硝酸盐会分解氧气，促进氨氧化古菌的氧循环","B":"氨氧化古菌虽分布广泛，但无法在氧气稀薄区域获取能量","C":"生活在暗黑地带的海洋微生物，无需光也可进行光合作用","D":"海洋世界里还存在着研究人员没弄明白的微生物产氧方式"},"answer":"D","explanation":"A项，文段仅提及“氨氧化古菌能在黑暗的缺氧环境中自行生成氧气”，“缺氧状态下亚硝酸盐会分解氧气”文段未提及，无中生有，排除；\nB项，根据“它们通过将氨氧化成亚硝酸盐来获得能量。这一过程需要氧气的参与”“研究人员将其移至缺氧海水中······研究人员判定是氨氧化古菌自行产生了氧气”可知，在氧气稀薄区域，氨氧化古菌可以自行产生氧气，将氨氧化成亚硝酸盐来获得能量，“无法在氧气稀薄区域获取能量”与文意相悖，排除；\nC项，“光合作用”文段未提及，无中生有，排除；\nD项，根据“氨氧化古菌是一种广泛分布的海洋微生物”及“研究人员尚不完全清楚其产氧机制”可知，“海洋世界里还存在着研究人员没弄明白的微生物产氧方式”表述正确，当选。\n故正确答案为D。","no":48,"missingImage":false},{"type":"question","qid":"5509961","cat":"片段阅读","stem":"淮扬菜被称为“士大夫菜”，同时也是国宴的标准菜系，但这与淮扬菜深受国民喜爱，成为国民菜并不矛盾，淮扬菜历经2000多年，绵延不绝的基础就在民间。淮扬菜有许多大众耳熟能详的菜品，可能很多人吃过，但却不知道吃的就是淮扬菜。淮扬地区，至今仍有斗菜的习俗，春节期间，主妇都要做出拿手好菜来宴请宾客，亲朋好友间还会进行厨艺比拼，这让淮扬菜不断涌现出新菜品。淮扬菜就是在这样的氛围中，一代代传承创新。\n这段文字重在强调：","options":{"A":"淮扬地区斗菜习俗历史悠久","B":"淮扬菜符合当代人的养生理念","C":"淮扬菜是国宴菜，更是国民菜","D":"民间传承为淮扬菜绵延不绝提供基础"},"answer":"D","explanation":"文段开篇提出淮扬菜的话题，接着通过转折词“但”强调淮扬菜历经2000多年，绵延不绝的基础就在民间，后文介绍淮扬菜有许多大众耳熟能详的菜品，很多人都吃过，然后论述淮扬地区的斗菜习俗让淮扬菜不断涌现出新菜品，在这样的氛围中淮扬菜代代传承创新。故文段转折之后是重点，强调民间传承是淮扬菜绵延不绝的基础，对应D项。\nA项，“斗菜习俗”对应文段解释说明部分，非重点，排除；\nB项，“养生理念”文段并未提及，无中生有，排除；\nC项，未体现淮扬菜绵延不绝之意，偏离文段重点，排除。\n故正确答案为D。\n【文段出处】《淮扬菜 是国宴菜，更是国民菜》","no":49,"missingImage":false},{"type":"question","qid":"5509947","cat":"片段阅读","stem":"原始体育的萌芽与日复一日地生产劳动分不开，跳绳运动也不例外。古时，跳绳所用的绳被称为“绳索”，它是由古人编结而成的，人们在编绳索的过程中，通常会有一些跨越的动作，这些下意识的行为吸引了活泼好动的孩子，他们就用短的绳子在旁边反复模仿，并逐渐摸索出一些简单的跨越绳子的方法，当成一种游戏来玩，于是跳绳这一活动就产生了。对于跳绳的明确起源众说纷纭。最早出现的史料是汉代画像石上的跳绳图，证明当时已有了跳绳活动。南朝《荆楚岁时记》中有“飞百索”的记载，正是后来的跳绳游戏。\n这段文字重在说明：","options":{"A":"跳绳运动文化的内涵","B":"跳绳运动的悠久历史","C":"原始体育起源于“模仿”","D":"原始体育起源于生产劳动"},"answer":"B","explanation":"文段开篇引出“跳绳”这一话题，接着介绍了跳绳所用的绳是如何制作的，以及孩子们模仿并逐步发展从而产生跳绳这一活动的过程，然后具体介绍了跳绳的起源，尾句指出《荆楚岁时记》中记载的“飞百索”正是后来的跳绳游戏。故文段主题词为“跳绳”，通过介绍跳绳活动的产生过程以及起源来说明跳绳运动具有悠久的历史，对应B项。\nA项，“文化的内涵”文段未提及，无中生有，排除；\nC、D两项，均缺少文段主题词“跳绳”，偏离文段核心话题，排除。\n故正确答案为B。\n【文段出处】《跳绳真的是“最完美的健康运动”吗？》","no":50,"missingImage":false},{"type":"question","qid":"5510059","cat":"片段阅读","stem":"黄河文化源远流长、博大精深，具有根源性、灵魂性、包容性、忠诚性、原创性、可持续性特征。全面认识和把握这些特征，有利于我们坚定文化自信，保护生态环境。在保护、传承、弘扬和创新黄河文化方面要谋划开展丰富多彩的活动，系统打造代表黄河文化六大特征的典型地标，以传统艺术和现代艺术相结合的形式讲好“黄河故事”，延续历史文脉，以具体行动激励全社会坚定文化自信，为实现中华民族伟大复兴的中国梦凝聚精神力量，谱写新时代建设社会主义现代化国家更加出彩的绚丽篇章。\n这段文字主要强调的是：","options":{"A":"黄河文化源远流长、博大精深","B":"黄河文化具有可持续性的特征","C":"讲好“黄河故事”延续历史文脉","D":"黄河文化的保护、传承、弘扬和创新"},"answer":"D","explanation":"文段开篇指出黄河文化具有的多种特征，紧接着论述全面认识和把握黄河文化特征对坚定文化自信，保护生态环境的好处，之后通过对策标志词“要”具体论述保护、传承、弘扬和创新黄河文化方面的做法，并指出这些对策实施后可带来的意义，故文段重点强调在保护、传承、弘扬和创新黄河文化方面的对策，对应D项。\nA项，“源远流长、博大精深”对应文段首句话题引入部分的内容，非重点，排除；\nB项，“具有可持续性的特征”对应文段首句话题引入部分的内容，非重点，且为黄河文化众多特征中的一部分，表述片面，排除；\nC项，“讲好‘黄河故事’”仅能对应文段多个对策中的一部分，表述片面，排除。\n故正确答案为D。\n【文段出处】《张占仓：黄河文化的主要特征与时代价值》","no":51,"missingImage":false},{"type":"question","qid":"5509963","cat":"片段阅读","stem":"“教资考试热”的出现体现了教师这个职业的地位逐渐提升，近年来我国出台了一系列提高教师地位、改善教师待遇的文件，教师的收入和社会地位不断提升。教师职业具有延续性、内生性发展的特点，年龄大的教师具有更丰富的教学经验，可以不断地进行自我提升、延续发展。专家提醒广大报考者，选择教师职业也要理性，教师对个人的付出和努力要求很高，选择教师职业意味着要有奉献精神。因此，每个人在选择从事教师这个职业之前，要对自己人生的定位和未来发展有一个整体判断，而不是盲目地追逐。\n对这段文字理解不正确的一项是：","options":{"A":"教师职业前景光明","B":"并不是所有人都适合教师这个行业","C":"教资考试需要降温","D":"选择教师职业需要做好奉献的准备"},"answer":"C","explanation":"A项，根据“近年来我国出台了一系列提高教师地位、改善教师待遇的文件，教师的收入和社会地位不断提升”可知，教师的收入和地位不断提升，故“前景光明”表述正确，符合文意，排除；\nB项，根据“每个人在选择从事教师这个职业之前，要对自己人生的定位和未来发展有一个整体判断，而不是盲目地追逐”可知，选择教师职业需要对自己的人生定位和未来发展有整体判断，不是所有人都适合教师行业，表述正确，符合文意，排除；\nC项，文段并未提及“教资考试需要降温”，无中生有，与文意不符，当选；\nD项，根据“选择教师职业意味着要有奉献精神”可知，选择教师职业要有奉献精神，表述正确，符合文意，排除。\n本题为选非题，故正确答案为C。\n【文段出处】新华网《教资考试为何持续升温？》","no":52,"missingImage":false},{"type":"question","qid":"5509949","cat":"片段阅读","stem":"“手撕钢”是一种超薄不锈精密带钢，不仅有精美的表面、平整的板型，而且有良好的微观组织和性能。生产“手撕钢”，是把一卷原始钢带放进轧机里，轧辊像擀面杖一样把钢带从厚擀薄。其生产有一个重要环节是光亮退火，这是“手撕钢”变软的关键。研发团队历经711次试验，攻克452个工艺难题，终于研制出宽600毫米、厚0.015毫米的国产不锈精密带钢，创造了新的世界纪录。国产“手撕钢”的横空出世，打破了国外技术封锁和产品垄断，从航空航天、高端电子、新能源等重点领域，到当下流行的折叠屏手机，都有它的身影。\n最适合做这段文字标题的一项是：","options":{"A":"以无厚者入于有间","B":"精诚所至金石为开","C":"百炼钢化为绕指柔","D":"以尽精微而致广大"},"answer":"C","explanation":"文段开篇引出“手撕钢”的话题，接着介绍“手撕钢”的生产方式，并指出光亮退火环节是“手撕钢”变软的关键，然后详细介绍了我国研发团队研制出国产“手撕钢”，创造了新纪录，打破了国外技术封锁和产品垄断，在各个领域都有广泛的应用前景。故文段围绕“手撕钢”的炼制展开且提到了其“软”的特点，对应C项。\nA项，“以无厚者入于有间”指用没有厚度的刀刃切入有缝隙的骨节，文段未提及，无中生有，排除；\nB项，“精诚所至金石为开”比喻只要专心诚意去做，什么疑难问题都能解决，未提及文段核心话题“手撕钢”变软，偏离文段核心话题，排除；\nD项，“以尽精微而致广大”指君子要达到宽广博大的境界，同时还要达到细致入微、鞭辟入里的境界，与文意无关，排除。\n故正确答案为C。\n【文段出处】《可以“撕”的钢铁！从百炼钢到绕指柔》","no":53,"missingImage":false},{"type":"question","qid":"5509964","cat":"片段阅读","stem":"化石能源制氢和工业副产制氢工艺成熟、成本较低，短期仍将是主要氢源。但化石能源储量有限，且制氢过程仍存在碳排放问题，工业副产制氢的产量有限且供应辐射路程短。从清洁低碳角度看，大规模电气化是我国多个领域实现降碳的有力抓手，如电动汽车替代燃油汽车、电采暖取代传统锅炉采暖等。然而，仍有部分行业难以通过直接电气化实现降碳，最为困难的行业包括钢铁、化工、航运航空等。氢能具有能源燃料和工业原料双重属性，可在这些难以深度脱碳的领域发挥重要作用。\n这段文字重在强调：","options":{"A":"化石能源制氢和工业副产制氢是主要氢源","B":"电动汽车、电采暖等通过直接电气化实现降碳","C":"氢能在部分难以深度脱碳的领域有重要的运用前景","D":"大规模电气化是我国多个领域实现降碳的有力抓手"},"answer":"C","explanation":"文段开篇引出制氢的两种主要方式，即化石能源制氢和工业副产制氢，并且介绍了二者的优、劣势。接着通过转折词“然而”提出问题，即电气化是实现降碳的抓手，但在部分困难行业降碳乏力。最后指出“氢能”因具有能源燃料和工业原料双重属性，可在这些深度脱碳的领域发挥重要作用。故文段意在强调“氢能”在难以深度脱碳的领域的重要作用，对应C项。\nA项，为开篇引出话题部分内容，非重点，排除；\nB、D两项，谈论的核心是“电气化降碳”，文段的主题词为“氢能”，主题词错误，且出现在转折词“然而”前，非重点，排除。\n故正确答案为C。\n【文段出处】光明日报《氢能，现代能源体系新密码》","no":54,"missingImage":false},{"type":"question","qid":"5510063","cat":"片段阅读","stem":"中国古代诗学从唐代“野”字意象的逐渐增多，到宋代“野水”意象的异军突起，不仅意味着唐宋诗学从“大物山水”到“小景山水”的转向，而且从杜甫所开创的“野水”美学至中唐诗人“野水”写作传统的逐渐形成，幽远寻仙的峻险之趣的传统有所消歇，宋人萧散简淡、静观自我的“野水”美学成为时代意趣。“野水”的审美价值不仅在于可游，更在于可居。“可游可居”作为野水山水美学的具体展开，与“可行可望”的彼岸山水美学成为中国诗学的两大传统。\n最适合做这段文字标题的一项是：","options":{"A":"中国诗歌“野水”意象的发展","B":"“野水”意象与唐宋诗学的转向","C":"中国山水诗学的两大话语传统","D":"作为时代意趣的“野水”美学"},"answer":"B","explanation":"文段先指出中国古代诗学从唐到宋，“野水”意象兴起，这意味着唐宋诗学的“转向”以及“野水”写作传统逐渐形成，之后又指出“野水”美学逐渐盛行，成为时代意趣，最后论述了“野水”审美价值的丰富内涵，并指出了其在中国诗学中的地位。故文段重点介绍了“野水”意象的兴起过程，以及其所带来的唐宋诗学意向的转变，对应B项。\nA项，文段重点介绍了“野水”意象兴起给唐宋诗学带来的“转向”，而非仅仅介绍“野水”意象的发展，排除；\nC项，没有提到文段核心话题“野水”，排除；\nD项，没有提到唐宋诗学的转向，偏离文段重点，且文段所述“时代意趣”是以宋朝为时代背景的，选项中的“时代意趣”表述不明确，排除。\n故正确答案为B。\n【文段出处】《唐宋诗学观照下的“野水”意象》","no":55,"missingImage":false},{"type":"question","qid":"5510064","cat":"片段阅读","stem":"运动不足已经成为21世纪最大的公共卫生问题。“运动医学之父”赫罗迪科斯（Herodicus）认为健康受损主要是因为饮食和身体活动之间的不平衡，因此建议严格控制饮食、持续参加身体活动和进行有规律的训练，通过这样的方式维持良好的健康。2007年，美国运动医学学会对赫罗迪科斯运动和医学相结合的理念进行了回顾总结，并和美国医学会一起将“运动是良医”这一思想作为一种学术理念和健康促进项目正式提出。2012年，中国在“运动是良医”理念的基础上进一步提出了“体医融合”概念，强调预防第一，预防和治疗同等重要。\n最适合做这段文字标题的是：","options":{"A":"体医融合","B":"运动是良医","C":"“运动医学之父”赫罗迪科斯","D":"运动不足已成为最大公共卫生问题"},"answer":"A","explanation":"文段开篇提出问题，运动不足成为21世纪最大的公共卫生问题。随后引用“运动医学之父”的观点，即要严格控制饮食、持续参加身体活动和进行有规律的训练来维持良好健康。随后指出美国运动医学学会总结了这一理念，提出“运动是良医”。尾句强调中国在此基础上进一步提出了“体医融合”概念，强调预防和治疗同等重要。故文段重在论述中国提出的“体医融合”概念，对应A项。\nB项，“运动是良医”对应结论前的内容，非重点，文段重在强调中国在此基础上更进一步提出的“体医融合”概念，偏离核心话题，排除。\nC项，“赫罗迪科斯”对应结论前的内容，非重点，排除。\nD项，对应开篇问题表述，非重点，排除。\n故正确答案为A。","no":56,"missingImage":false},{"type":"question","qid":"5509942","cat":"语句表达","stem":"雪域高原，复兴号疾驰在拉林铁路上，藏东南腹地的人们交通出行更加便利；伶仃洋上，港珠澳大桥如飞虹凌波，联通香港、广东珠海、澳门三地，粤港澳大湾区发展跑出加速度；在洋山港，无人驾驶的搬运车来回穿梭，自动化码头大大提高了作业效率，海运效能显著提升······                    ，成为我国交通运输事业取得历史性成就、发生历史性变革的一个生动写照。\n填入划横线部分最恰当的一项是：","options":{"A":"放眼神州大地，交通网络内畅外联，涌动着发展的活力","B":"交通运输业也在全球抗疫、贸易复苏等方面发挥了积极作用","C":"我国坚持交通先行，迎来由交通大国向交通强国的历史性跨越","D":"建成立体交通网，连通城乡，连接四面八方，便利人民群众出行"},"answer":"A","explanation":"横线出现在文段尾句，且为尾句的分句，故需依据横线前内容以及横线所在尾句内容进行分析。文段开篇通过并列分句列举了雪域高原、伶仃洋、洋山港的例子，其中雪域高原的例子强调交通的畅达使得人们出行更加便利，伶仃洋和洋山港的例子则强调交通的发展，联通了大陆与域外，且“跑出加速度”“提高了作业效率，海运效能显著提升”进一步突出了交通对于各项发展的带动作用，横线后尾句内容论述这些案例成为我国交通运输事业取得历史性成就、发生历史性变革的生动写照，故横线处所填语句，重在对上文进行概括，强调我国交通事业的发展，不仅使得国内与国外畅通联动，更为发展提供了助力，对应A项。\nB项，文段并未提及“全球抗疫”“贸易复苏”，无中生有，排除；\nC项，文段中并未提及“交通先行”，无中生有，且未能突出我国交通的便利以及对发展的积极影响，偏离前文中心，排除；\nD项，“便利人民群众出行”仅能对应文段中“雪域高原”这一部分内容，表述片面，排除。\n故正确答案为A。\n【文段出处】人民日报《建设交通强国，发挥现代化开路先锋作用——强国之路正扬帆⑦》","no":57,"missingImage":false},{"type":"question","qid":"5510068","cat":"语句表达","stem":"“反对过度消费，倡导理性消费”不是一句空喊的口号。作为消费活动的主体，消费者在面对各种促销信息不断撞击大脑的时候，应当始终把那句老话“买的没有卖的精”记在心头。同时明确自己的消费目标，坚持按需购买，摒弃那种“不凑齐满减就吃亏”“过了这村就没这店”的消费思维，才能避免买了一大堆不需要的东西。正如《断舍离》一书中所说：“不管东西有多贵，有多稀有，                    ，才够强大。”\n填入划横线部分最恰当的一句是：","options":{"A":"能够按照内心是否想要来判断的人","B":"能够按照价格是否划算来判断的人","C":"能够按照东西是否适合来判断的人","D":"能够按照自己是否需要来判断的人"},"answer":"D","explanation":"横线位于文段结尾，横线处内容应总结前文。文段开篇通过一句口号引入“消费”这一话题，指出倡导理性消费，反对过度消费。接着通过“应当”提出对策，强调消费者应按需购买，避免买了不需要的东西。故横线处应强调“按需购买”，对应D项。\nA项“按照内心是否想要来判断”，B项“按照价格是否划算”、C项“按照东西是否适合”，均未提及“按需购买”这一核心话题，排除。\n故正确答案为D。\n【文段出处】人民网《让消费者真正“买了，不吃亏”》","no":58,"missingImage":false},{"type":"question","qid":"5510069","cat":"语句表达","stem":"①他们的研究和尝试有望引领化学走入自动化时代，加速药物研发进程，使药品的生产更加安全可靠。\n②有科学家向这一任务发起了挑战，不少科学家都在想方设法让化学合成变得更自动化。\n③目前还没有可涵盖所有合成有机化学的数字自动化标准和通用的化学操作编程语言。\n④自动化在化学领域并非新鲜事，但这些自动化合成仅囿于单一类型的化学反应或流程。\n⑤化学家的工作长期以来都通过人工方式完成，是一个非常手工的、由人力驱动的过程。\n⑥比如，克罗宁团队利用研制出的“化学计算机”，自动制备出3种高品质药用化合物。\n将以上6个句子重新排列，语序正确的是：","options":{"A":"③⑤②④⑥①","B":"⑤④③②⑥①","C":"①⑤③④②⑥","D":"⑤③④②①⑥"},"answer":"B","explanation":"对比选项，确定首句。①句出现指代词“他们”，指代不明，不适合作首句，排除C项。③句指出化学自动化当前存在的问题，⑤句指出化学家的工作长期以来都通过人工方式完成，均适合作首句，保留A、B、D三项。\n继续观察发现，②句出现指代词“这一任务”，并指出科学家向其发起挑战，可知前文应论述某一任务当前无法完成，③句指出化学自动化当前存在的问题，④句指出自动化合成仅囿于单一类型的化学反应或流程，均可放在②句之前进行捆绑，⑤句论述化学家的工作是人工方式完成的，并未体现某一任务当前无法完成需要挑战，故⑤②两句无法构成捆绑，排除A项。\n对比B、D两项，①句和⑥句顺序不同，①句以指代词“他们”开头，指出他们的研究和尝试有望引领化学进入自动化时代，即论述研究的意义，⑥句指出克罗宁团队利用研制出的“化学计算机”，根据逻辑顺序可知，应先介绍研究，再论述研究的意义，故⑥句应在①句之前，排除D项，对应B项。\n故正确答案为B。\n【文段出处】科技日报《摆脱瓶瓶罐罐？古老化学走进自动化时代》","no":59,"missingImage":false},{"type":"question","qid":"5509945","cat":"语句表达","stem":"①我们通常看到的悬索桥的基本特征是：加劲梁悬吊在钢缆上，钢缆两端用锚碇固定\n②地锚因地制宜放置在不同的空间里，有的直接安置在地面或者深藏在地下，有的固结于沉井的基础之内或利用桥头地形锚固定在山崖岩层中\n③悬索桥通常还会建造两个高塔，目的是为钢缆提供中间支承，使塔、墩固结，融为一体\n④悬索桥上部结构包括钢缆、塔、加劲梁及吊杆，下部结构包括支承塔的桥墩、锚固钢缆的锚碇及锚台\n⑤锚碇用大体积混凝土做成，有地锚和自锚两种\n⑥自锚通常是将钢缆锚固定在加劲梁表面\n将以上6个句子重新排列，语序正确的是：","options":{"A":"①⑤②④⑥③","B":"③①④⑤②⑥","C":"④①⑤②⑥③","D":"①⑤⑥④②③"},"answer":"C","explanation":"对比选项，确定首句，首句分别为①、③、④三句，①句介绍悬索桥的基本特征，④句介绍悬索桥的上、下部结构，均可作为首句，保留A、C、D三项。③句出现“还”，为关联词后半部分，不适合作为首句，排除B项。\n对比选项，A、C、D三项中④、⑤两句的位置不同，④句通过介绍悬索桥的结构引出“锚碇”的话题，⑤句具体介绍“锚碇”的分类，按照行文逻辑，应先引出“锚碇”，再进行解释说明，故④句应在⑤句之前，排除A、D两项。\n故正确答案为C。\n【文段出处】科普中国《悬索桥的设计奥妙》","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"5509979","cat":"数学运算","stem":"某智慧公共停车场的收费标准如下：停车不超过15分钟，不收费；超过15分钟但不超过60分钟，按1小时计，收费5元；超过1小时后，超过的部分按每30分钟4元收费（不足30分钟，按30分钟计）。若李先生支付停车费17元，则他停车的时长可能为：","options":{"A":"2小时","B":"2小时15分钟","C":"2小时45分钟","D":"3小时"},"answer":"B","explanation":"根据题干“停车不超过15分钟，不收费；超过15分钟但不超过60分钟，按1小时计，收费5元”，李先生支付停车费17元，则停车时长一定超过1小时。扣除前1小时的收费5元，超出1小时部分付款为17-5=12元。根据题干“超过1小时后，超过的部分按每30分钟4元收费（不足30分钟，按30分钟计）”，12元最多可支付12÷4=3个30分钟=1.5小时，则2小时＜李先生的停车时长\u003cimg data-k=\"5201638a9dd7\">小时。\n故正确答案为B。","no":61,"missingImage":false},{"type":"question","qid":"5510000","cat":"数学运算","stem":"某公司自主研发生产的A、B、C三种型号氢燃料电池，解决了该公司今年生产轿车所需电池数量的10%（按一辆车配一块电池计算）。其中A型号氢燃料电池的产量是B型号的2倍，C型号的产量比A、B两种型号的产量之和还多400块。预计该公司今年的轿车总产量是42.4万辆，那么B型号氢燃料电池的产量是：","options":{"A":"3500块","B":"7000块","C":"14000块","D":"21400块"},"answer":"B","explanation":"根据题意，该公司今年自主研发生产的A、B、C三种型号氢燃料电池的产量和为42.4×10000×10%=42400块。已知C型号的产量比A、B两种型号的产量之和还多400块，则A、B两种型号的产量之和为\u003cimg data-k=\"20bc41ff6aa7\">块，A型号氢燃料电池的产量是B型号的2倍，则B型号氢燃料电池的产量为\u003cimg data-k=\"bd993bd462c5\">块。\n故正确答案为B。","no":62,"missingImage":false},{"type":"question","qid":"5510001","cat":"数学运算","stem":"某学习平台收到的征文，将通过两轮评审决定能否采用。先由两位编辑进行初审，若两位编辑评审都通过，则予以采用；若两位编辑都未予通过，则不予采用；若仅有一位编辑初审通过，则再由主编进行复审，若复审通过，则予以采用，否则不予采用。设稿件能通过各初审编辑评审的概率均为0.4，复审的稿件能通过的概率为0.2，各编辑独立评审，则每篇征文被采用的概率为：","options":{"A":"0.32","B":"0.256","C":"0.24","D":"0.208"},"answer":"B","explanation":"根据题意，每篇征文被采用的情况为：①初审两位编辑均通过，概率为：0.4×0.4=0.16；②初审两位编辑仅有一位通过，且主编复审通过，概率为：\u003cimg data-k=\"4b445a39afc9\">，分类用加法，故每篇征文被采用的概率为0.16+0.096=0.256。\n故正确答案为B。","no":63,"missingImage":false},{"type":"question","qid":"5510004","cat":"数学运算","stem":"某空军基地举行飞行训练，有8架歼击机、3架预警直升机、2架反潜直升机参与训练，每架飞机编号不同。训练时，需派出3架歼击机、2架预警直升机、1架反潜直升机进行起降飞行。若每次只能起飞1架飞机，其中3架歼击机必须相邻起飞，2架预警直升机不能相邻起飞，那么不同的起飞方式有多少种？","options":{"A":"504","B":"4032","C":"8064","D":"24192"},"answer":"D","explanation":"先从8架歼击机中选出3架、3架预警直升机中选出2架、2架反潜直升机中选出1架，共有\u003cimg data-k=\"9003c29ea201\">种方法；再根据要求安排起飞顺序，3架歼击机必须相邻起飞可用捆绑法、2架预警直升机不能相邻起飞可用插空法，即先将3架歼击机捆绑后与1架反潜直升机进行排列有\u003cimg data-k=\"46e98dfaa344\">种方法，再将2架预警直升机插空有\u003cimg data-k=\"5e27e25e08d8\">种方法。故满足要求的不同的起飞方式有\u003cimg data-k=\"ace640e794b6\">种。\n故正确答案为D。","no":64,"missingImage":false},{"type":"question","qid":"5509973","cat":"数学运算","stem":"浮雕银杯是我国古代常见的一种盛酒容器，有大银杯和小银杯之分。已知5个大银杯加1个小银杯，可以盛酒3斛（斛，是古代的一种容量单位），5个小银杯加1个大银杯，可以盛酒2斛，则1斛酒至多可以倒满小银杯的数量为：","options":{"A":"2个","B":"3个","C":"4个","D":"5个"},"answer":"B","explanation":"设大银杯容量为x，小银杯容量为y，赋值1斛酒的量为1；根据题意可列方程：5x+y=3······①，5y+x=2······②，联立①②解得\u003cimg data-k=\"fadeab61f68f\">，\u003cimg data-k=\"d2b513954103\">。则1斛酒可倒满的小银杯数量\u003cimg data-k=\"20fde9aadda2\">，故至多可以倒满小银杯的数量为3个。\n故正确答案为B。","no":65,"missingImage":false},{"type":"question","qid":"5510002","cat":"数学运算","stem":"某小区物业准备了230盒口罩免费派发给10栋楼，要求任意两栋楼派发的口罩数量都不相同，但最多相差不超过1倍。假设口罩不拆盒发放，那么派发口罩数量最少的那栋楼最少可派发口罩：","options":{"A":"18盒","B":"15盒","C":"14盒","D":"12盒"},"answer":"C","explanation":"设派发口罩数量最少的那栋楼最少派发口罩x盒。要让派发口罩数量最少的楼栋派发口罩最少，则其他楼栋口罩派发尽量多，且派发口罩最多的楼栋不超过最少的1倍，即派发口罩最多的楼栋最多派发口罩2x盒。由于任意两栋楼派发口罩数量都不相同，则可列表如下：\n\u003cimg data-k=\"dab8e1c9f674\" style=\"max-width:678px\">\n根据口罩一共有230盒可列式：2x+2x-1+2x-2+2x-3+2x-4+2x-5+2x-6+2x-7+2x-8+x=230，化简可得：19x-36=230，解得x=14。那么派发口罩数量最少的那栋楼最少可派发口罩14盒。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"5510178","cat":"数学运算","stem":"A、B两村在一条笔直公路的同侧，到公路的垂直距离分别是3公里和7公里，两村相距8.5公里，现需在公路边建一个物
