:"16592934","cat":"逻辑判断","stem":"人的跖趾关节将其脚趾与脚的其他部位相连，使得双脚在行走和跑步中更加平稳，动作更加迅速。有研究认为，当跖趾关节向上弯曲时，连接着脚趾骨和跟骨的足底腱膜会变得更加紧绷，产生一个向上的力，来抵消脚纵弓承受的一部分压力，从而让双脚在前进中更加稳定。因此，一些常见的运动鞋或者老年健步鞋会有一个特征——具有鞋尖翘度。当人们穿上一双鞋尖向上翘起的鞋时，跖趾关节会顺着鞋尖翘起的弧度向上翘起，产生相似的效果。\n以下哪项如果为真，最能削弱上述研究者的观点？","options":{"A":"这些具有足弓支持、缓冲等作用的鞋出现的时间并不长","B":"脚发力过程中，鞋尖翘度会明显影响跖趾关节的弯曲范围，限制其活动","C":"穿上鞋尖有翘度的鞋行走感觉更轻盈，这是由于脚纵弓承受的压力减少所导致的","D":"跖趾关节向上弯曲产生的向上力虽可抵消脚纵弓承受的一部分压力，但十分微弱，对人类稳定行走的影响不大"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：当人们穿上一双鞋尖向上翘起的鞋时，跖趾关节会顺着鞋尖翘起的弧度向上翘起，产生相似的效果（即会抵消脚纵弓承受的一部分压力，从而让双脚在前进中更加稳定）。\n论据：当跖趾关节向上弯曲时，连接着脚趾骨和跟骨的足底腱膜会变得更加紧绷，产生一个向上的力，来抵消脚纵弓承受的一部分压力，从而让双脚在前进中更加稳定。\n本题论点和论据均在说当跖趾关节向上弯曲时，可以让双脚在前进中更加稳定，论点论据话题一致，削弱可以考虑削弱论点和削弱论据。\n第二步：逐一分析选项。\nA项：指出具有足弓支持、缓冲等作用的鞋出现的时间并不长，但论点讨论的是鞋尖翘度导致的跖趾关节向上弯曲能否让双脚在前进中更加稳定，话题不一致，不能削弱，排除；\nB项：指出脚发力过程中，鞋尖翘度会限制跖趾关节的活动，但论点讨论的是鞋尖翘度导致的跖趾关节向上弯曲能否让双脚在前进中更加稳定，话题不一致，不能削弱，排除；\nC项：指出穿上鞋尖有翘度的鞋行走感觉更轻盈是由于脚纵弓承受的压力减少所导致的，说明当跖趾关节向上弯曲时，会抵消脚纵弓承受的一部分压力，为加强项，不能削弱，排除；\nD项：指出跖趾关节向上弯曲产生的向上力所抵消的脚纵弓承受的压力十分微弱，对人类稳定行走的影响不大，削弱论据，当选。\n故正确答案为D。","no":84,"missingImage":false},{"type":"question","qid":"16593208","cat":"逻辑判断","stem":"土楼是客家文化的象征，主要集中在福建。其实，在广东潮汕地区也存在大量土楼，仅潮州饶平县就有781座。潮汕的土楼始建于元代，盛于明清，迄今已有700余年的营造史。专家认为，土楼生于乱世，是应潮客先民们聚族而居，集体防卫的需要而产生的。\n要得到上述结论，需要补充的前提是：","options":{"A":"在古老的土楼守护下，家族得以躲过漫长岁月中的种种侵袭和战乱","B":"潮汕历史上有过漫长的山海动荡，从明至清屡遭山贼、海盗的侵扰","C":"千百年来，大量的客家人和闽南人从陆路和水路迁入潮汕，带去了土楼文化","D":"潮汕地区古有“无村不寨”的说法，曾有大量军事性、封闭型的围寨，类型多样"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：土楼生于乱世，是应潮客先民们聚族而居，集体防卫的需要而产生的。\n论据：无。\n本题只有论点没有论据，且提问方式为“前提”，加强优先考虑必要条件。\n第二步：逐一分析选项。\nA项：该项指出家族在土楼的守护下躲过侵袭和战乱，说明土楼有防卫的作用，补充论据，可以加强，保留；\nB项：该项指出潮汕从明至清屡遭侵扰，如果潮汕未在此时期内遭受侵扰，那么就无需建造土楼用于防卫，是论点成立的必要条件，可以加强，保留；\nC项：该项指出土楼文化是由客家人和闽南人带来的，并未说明土楼因何而生，无法加强，排除；\nD项：该项指出潮汕曾有类型多样的围寨，并未说明土楼是因何而生的，无法加强，排除。\n对比A、B两项，B项必要条件的加强力度大于A项的补充论据，B项当选。\n故正确答案为B。","no":85,"missingImage":false},{"type":"question","qid":"16593005","cat":"逻辑判断","stem":"长期只给中老年人提供一些对大脑神经系统有益的营养素，如DHA、抗氧化剂等，对预防脑力衰老似乎没有明显的效果，但改变整体的膳食模式则有利于延缓中老年人的认知退化。研究者发现地中海膳食和得舒膳食模式能保护老年人的认知能力。绿叶蔬菜、鱼类和全谷物是这两种膳食模式强调要充分摄入的三类核心食物。此外，还要严格限制油炸、高盐、甜食饮料等，因为它们不利于预防肥胖和三高，而这些则都是加剧认知退化的重要因素。\n以下哪项如果为真，最能支持上述研究发现？","options":{"A":"食用蔬果总量高的老年人认知能力保持得较好","B":"地中海膳食、得舒膳食等饮食模式有利于延缓认知退化","C":"预防脑力衰老仅靠摄入营养素或改变整体的膳食模式是不够的","D":"全谷物有利于控制血糖，绿叶蔬菜有利于改善血脂，鱼类所含的脂肪酸更易消化"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：地中海膳食和得舒膳食模式能保护老年人的认知能力。\n论据：绿叶蔬菜、鱼类和全谷物是这两种膳食模式强调要充分摄入的三类核心食物。此外，还要严格限制油炸、高盐、甜食饮料等，因为它们不利于预防肥胖和三高，而这些则都是加剧认知退化的重要因素。\n本题论点和论据都在说地中海膳食和得舒膳食模式与老年人认知之间的关系，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是蔬果总量高的老年人认知能力保持得较好，但论点中的地中海膳食和得舒膳食模式并没有强调摄入的蔬果总量要高，话题不一致，无法加强，排除；\nB项：该项说的是地中海膳食、得舒膳食等饮食模式有利于延缓认知退化，但没有详细展开说明这两种饮膳食模式如何延缓认知退化，只是简单对论点进行重复，可以加强，保留；\nC项：该项说的是预防脑力衰老不能仅靠摄入营养素或改变整体的膳食模式，而论点说的是地中海膳食和得舒膳食模式能否保护老年人的认知能力，话题不一致，无法加强，排除；\nD项：该项说的是全谷物、绿叶蔬菜、鱼类三种食物分别可以控制血糖、改善血脂、易被消化，说明按照论点中的两种膳食模式摄入的三类核心食物可以帮助控制三高（高血压、高血糖、高血脂），而论据中提到“三高是加剧认知退化的重要因素”，这表明地中海膳食和得舒膳食模式确实能延缓认知退化、保护老年人的认知能力，解释原因，可以加强，保留。\n对比B、D两项，B项只是重复论点，而D项解释说明了“膳食模式中的三类核心食物”与“三高”之间的关系，是对论证逻辑的补充，加强力度强于简单重复论点，故D项更为合适。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"16593021","cat":"逻辑判断","stem":"对世界上最常见的火山类型而言，含水量较高的岩浆往往储存在地壳更深处。水在很大程度上引发并助长了火山爆发，岩浆的含水量越多，岩浆上升得越快，喷发就越猛烈。此时，岩浆的浮力不再是岩浆喷发的关键，岩浆中越多的水分含量才意味着越多的气泡和潜在更猛烈的喷发。\n以下哪项如果为真，最能加强上述研究发现？","options":{"A":"岩浆之所以能通过地壳裂缝上升，是因为岩浆比周围岩石的浮力更大","B":"若除水外还有额外的浮力，也会在火山被触发时将更多的岩浆带到地面","C":"水和岩浆的混合物在上升过程中有时会发生脱气现象，使混合物变得更加粘稠，导致上升缓慢甚至停滞","D":"水和岩浆的混合物储存在火山中，当岩浆上升到地表附近后，压力下降就会形成气泡，气泡迅速膨胀导致岩浆喷射而出"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：水在很大程度上引发并助长了火山爆发，岩浆的含水量越多，岩浆上升得越快，喷发就越猛烈。此时，岩浆的浮力不再是岩浆喷发的关键，岩浆中越多的水分含量才意味着越多的气泡和潜在更猛烈的喷发。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是因为岩浆浮力更大，所以岩浆能上升，强调了浮力对岩浆上升的重要性，而论点说的是岩浆的含水量越多则岩浆喷发得越猛烈，浮力并不是岩浆喷发的关键，削弱论点，无法加强，排除；\nB项：该项说的是除水之外的浮力对岩浆喷发的影响，而论点讨论的是岩浆的含水量对岩浆喷发的影响，为无关项，无法加强，排除；\nC项：该项说的是水和岩浆的混合物有时会导致岩浆上升缓慢，而论点说的是岩浆的含水量越多则岩浆喷发得越猛烈，削弱论点，无法加强，排除；\nD项：该项说的是水和岩浆的混合物在上升到地表附近后会因为压力下降形成气泡，气泡迅速膨胀导致岩浆喷射，解释了水越多就意味着气泡越多，进而会造成岩浆的猛烈喷发，补充论据，可以加强，当选。\n故正确答案为D。","no":87,"missingImage":false},{"type":"question","qid":"16592940","cat":"逻辑判断","stem":"某智库调查表明，某省2022年的长租房成交量呈不断上涨的趋势，排在全国前列，成交总量超过3000套，较去年增长超过40%，有效解决了新市民、青年人等群体的住房难题。因此有专家认为，加快发展长租房市场是我国解决住房难题的一剂良药。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"长租房市场发展时间短，目前缺乏有效监管","B":"2022年，我国的长租房市场规模已达1.73万亿元","C":"长租房无法享受与购房者同等的公共服务，在一二线城市难以推广","D":"有数据表明，我国租赁人口约有2.2亿，占流动人口总数的90%左右"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：加快发展长租房市场是我国解决住房难题的一剂良药。\n论据：某省2022年的长租房成交量呈不断上涨的趋势，排在全国前列，成交总量超过3000套，较去年增长超过40%，有效解决了新市民、青年人等群体的住房难题。\n本题的论点和论据均在讨论发展长租房能有效解决住房难题，二者话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项说的是长租房市场缺乏有效监管，论点说的是发展长租房能有效解决住房难题，话题不一致，无法削弱，排除；\nB项：该项说的是我国长租房市场的规模比较大，论点说的是发展长租房能有效解决住房难题，话题不一致，无法削弱，排除；\nC项：该项说的是长租房在一二线城市难以推广，说明发展长租房无法解决我国一二线城市的住房难题，削弱论点，可以削弱，当选；\nD项：该项说的是我国租赁人口多、占流动人口的比例大，说明我国租房需求大，需要发展租赁市场，补充论据，无法削弱，排除。\n故正确答案为C。","no":88,"missingImage":false},{"type":"question","qid":"16593211","cat":"类比推理","stem":"学校计划开展暑期夏令营活动，就陈老师和林老师是否担任夏令营带队老师，几个家长纷纷猜测：\n吴妈妈：如果陈老师没去带队，林老师肯定也没去；\n李妈妈：陈老师是这个夏令营活动的策划者，她一定会去带队；\n郑妈妈：你们等着看吧，陈老师和林老师至少有一个人会去；\n张妈妈：我认为林老师会去带队，陈老师要回家探亲不会去。\n结果发现其中两个妈妈猜对了，两个妈妈猜错了。请问猜对了的妈妈是：","options":{"A":"李妈妈和郑妈妈","B":"吴妈妈和张妈妈","C":"吴妈妈和李妈妈","D":"郑妈妈和张妈妈"},"answer":"D","explanation":"第一步：分析题干找关系。\n吴妈妈：\u003cimg data-k=\"0be436194951\">陈老师带队\u003cimg data-k=\"b3a86cb4840e\">林老师带队；\n李妈妈：陈老师带队；\n郑妈妈：陈老师带队 或 林老师带队；\n张妈妈：林老师带队 且 \u003cimg data-k=\"0be436194951\">陈老师带队。\n吴妈妈和张妈妈的猜测为矛盾关系，必有一真一假。\n第二步：看其余。\n根据题干可知，四人的猜测为两真两假，故李妈妈和郑妈妈也必有一真一假。若李妈妈的猜测为真，那么郑妈妈的猜测也为真，不符合一真一假，因此李妈妈的猜测为假，郑妈妈的猜测为真，即陈老师没带队，再结合“或关系否一推一”可知，林老师带队，进而可以得出张妈妈的猜测为真。\n故正确答案为D。","no":89,"missingImage":false},{"type":"question","qid":"16593011","cat":"类比推理","stem":"某单位由于工作需要，本周六必须安排赵、钱、孙、李、周、吴、郑7名工作人员值班，每个人都要值半天班，上午安排4人一起值班，下午安排3人一起值班。值班人员的分配满足下列条件：\n(1）赵和孙不在一起值班；\n(2）周和孙不在一起值班；\n(3）如果郑在下午值班，那么赵和李也在下午值班；\n(4）或者钱在上午值班，或者郑在下午值班。\n根据以上信息，必须在上午值班的工作人员是：","options":{"A":"钱和郑","B":"赵和郑","C":"赵和周","D":"吴和孙"},"answer":"A","explanation":"第一步：分析题干条件。\n(1）赵和孙不在一起值班；\n(2）周和孙不在一起值班；\n(3）郑下午值班\u003cimg data-k=\"a37757d411ef\">赵 且 李下午值班；\n(4）钱上午值班 或 郑下午值班；\n(5）上午4人值班，下午3人值班。\n第二步：根据题干条件进行推理。\n根据条件（1）（2）可知，赵和孙不在一起值班，周和孙也不在一起值班，那么赵和周在一起值班；结合条件（3），如果郑在下午值班，那么赵和李也在下午值班，此时周也应该在下午值班，下午值班的人数为4，与条件（5）矛盾，因此郑一定在上午值班；再结合条件（4），钱上午值班或郑下午值班，根据或关系“否一推一”可知，钱一定在上午值班，即钱和郑在上午值班。\n故正确答案为A。","no":90,"missingImage":false},{"type":"question","qid":"16593027","cat":"类比推理","stem":"兵符：信物","options":{"A":"七律：绝句","B":"汉字：偏旁","C":"干戈：战争","D":"寒露：节气"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n兵符是古代帝王授予兵权和调发军队的信物，兵符是一种信物，二者为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：七律是律诗的一种，绝句和律诗均是格律诗的一种，七律和绝句不是种属关系，与题干逻辑关系不一致，排除；\nB项：偏旁是组成汉字的一部分，二者为组成关系，与题干逻辑关系不一致，排除；\nC项：干为防具，戈为武器，二者均为古代兵器，因此后以“干戈”用作兵器的通称，后来引申为指战争，干戈和战争为比喻象征义，与题干逻辑关系不一致，排除；\nD项：寒露，是二十四节气之第十七个节气，秋季的第五个节气，寒露是一种节气，二者为种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":91,"missingImage":false},{"type":"question","qid":"16593054","cat":"类比推理","stem":"虫害：植物受损","options":{"A":"雾霾：慢性肺炎","B":"除名：查无此人","C":"赤潮：海水污染","D":"失眠：辗转反侧"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n虫害导致植物受损，二者为因果关系。\n第二步：判断选项词语间逻辑关系。\nA项：雾霾导致慢性肺炎，二者为因果关系，与题干逻辑关系一致，保留；\nB项：除名是使退出集体，从名册中除掉姓名，除名导致查无此人，二者为因果关系，与题干逻辑关系一致，保留；\nC项：赤潮是由于海洋富营养化，使某些浮游生物暴发性繁殖和高度密集所引起的海水变红的现象，一般是海水先被污染，然后再引发赤潮，海水污染导致赤潮，二者为因果关系，但顺序与题干相反，与题干逻辑关系不一致，排除；\nD项：辗转反侧指躺在床上翻来覆去地不能入睡，失眠和辗转反侧不是因果关系，与题干逻辑关系不一致，排除。\n对比A、B项，题干中“虫害”是自然现象，A项中“雾霾”也是自然现象，B项中“除名”不是自然现象，故A项更为合适。\n故正确答案为A。","no":92,"missingImage":false},{"type":"question","qid":"16593210","cat":"类比推理","stem":"网箱养殖：深海养殖","options":{"A":"网络设备：无线网卡","B":"成人教育：职业教育","C":"载人飞船：返回舱","D":"娱乐项目：剧本杀"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n有的网箱养殖是深海养殖，有的网箱养殖不是深海养殖，有的深海养殖是网箱养殖，有的深海养殖不是网箱养殖，二者为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：无线网卡是一种网络设备，二者为种属关系，与题干逻辑关系不一致，排除；\nB项：有的成人教育是职业教育，有的成人教育不是职业教育，有的职业教育是成人教育，有的职业教育不是成人教育，二者为交叉关系，与题干逻辑关系一致，当选；\nC项：返回舱是载人飞船的一部分，二者为组成关系，与题干逻辑关系不一致，排除；\nD项：剧本杀是一种娱乐项目，二者为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":93,"missingImage":false},{"type":"question","qid":"16593092","cat":"类比推理","stem":"政通人和：国泰民安","options":{"A":"深思熟虑：不假思索","B":"星罗棋布：漫山遍野","C":"心领神会：心照不宣","D":"奋起直追：迎头赶上"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n政通人和是指政事通达，人心和顺，形容国家稳定，人民安乐；国泰民安是指国家太平，人民安乐，二者为近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：深思熟虑是指反复深入细致地考虑；不假思索形容做事答话敏捷、熟练，用不着考虑，二者为反义关系，与题干逻辑关系不一致，排除；\nB项：星罗棋布是指像天空的星星和棋盘上的棋子那样分布着，形容数量很多，分布很广；漫山遍野是指山上和田野里到处都是，形容极多，二者为近义关系，与题干逻辑关系一致，保留；\nC项：心领神会是指对方没有明说，心里已经领会；心照不宣是指彼此心里明白，而不公开说出来，二者是近义关系，与题干逻辑关系一致，保留；\nD项：奋起直追是指振作起来，紧紧赶上去；迎头赶上是指加紧追过最前面的，二者是近义关系，与题干逻辑关系一致，保留。\n对比B、C、D三项，题干政通人和、国泰民安均为褒义词，B项星罗棋布、漫山遍野均为中性词，C项心领神会是褒义词，心照不宣是中性词，D项奋起直追、迎头赶上均为褒义词，故D项和题干逻辑关系更为一致。\n故正确答案为D。","no":94,"missingImage":false},{"type":"question","qid":"16593015","cat":"类比推理","stem":"服装：唐装：西装","options":{"A":"刷牙：牙刷：牙膏","B":"豪车：赛车：轿车","C":"旗帜：国旗：红旗","D":"武术：太极拳：咏春拳"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n唐装和西装是两种不同的服装，后两词为并列关系，且均与第一词构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：牙刷和牙膏是刷牙时配套使用的工具，后两词为配套使用关系，与题干逻辑关系不一致，排除；\nB项：豪车、赛车和轿车是从不同的划分角度命名的汽车，三者互为交叉关系，与题干逻辑关系不一致，排除；\nC项：有的国旗是红旗，有的国旗不是红旗，有的红旗是国旗，有的红旗不是国旗，后两词为交叉关系，与题干逻辑关系不一致，排除；\nD项：太极拳和咏春拳是两种不同的武术，后两词为并列关系，且均与第一词构成种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":95,"missingImage":false},{"type":"question","qid":"16593206","cat":"类比推理","stem":"泡沫经济：实体经济：通货膨胀","options":{"A":"生态农业：传统农业：稻田养鱼","B":"清洁能源：传统能源：污染减少","C":"生理反应：心理反应：望梅止渴","D":"自然现象：社会现象：火山爆发"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n泡沫经济指因投机交易极度活跃，金融证券、房地产等的市场价格脱离实际价值大幅上涨，造成表面繁荣的经济现象；实体经济指一个国家生产的商品价值总量，是人们通过思想、使用工具在地球上创造的经济；当泡沫经济越多而实体经济越少时，就会产生通货膨胀的现象，三者为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：生态农业是指按照生态学原理，应用现代科学技术进行集约经营管理的综合农业生产体系，传统农业是指采用传统手工劳动方式和生产技术的农业，二者为并列关系，稻田养鱼是一种生态农业，二者为种属关系，与题干逻辑关系不一致，排除；\nB项：清洁能源是指开发利用过程中不产生或很少产生污染物的能源，如风能、水能、太阳能、地热能等，传统能源是指已经大规模生产和广泛利用的能源，当使用的清洁能源越多而传统能源越少时，能让污染减少，三者为因果对应关系，与题干逻辑关系一致，当选；\nC项：生理反应是个体受到外界刺激而使机体有所反应的一种紧张状态，心理反应是指人们在面对客观事物时产生的主观体验，包括情感、思维和行为等方面的变化，二者为并列关系，望梅止渴是一种生理反应，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：自然现象是指自然界中由于大自然的运作规律自发形成的某种状况，社会现象是指所有与同物种共同体有关的活动产生、存在和发展密切联系的现象，二者为并列关系，火山爆发是一种自然现象，二者为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":96,"missingImage":false},{"type":"question","qid":"16593007","cat":"类比推理","stem":"锁骨：肋骨：坐骨","options":{"A":"头脑：头皮：头发","B":"腹腔：口腔：鼻腔","C":"盲肠：大肠：直肠","D":"颈椎：胸椎：腰椎"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n锁骨、肋骨、坐骨是三种不同的人体骨骼，三者为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：头脑由头发、头皮、肌肉、骨骼和脑体组成，后两词均与第一词构成组成关系，与题干逻辑关系不一致，排除；\nB项：腹腔、口腔、鼻腔是三种不同的人体部位，三者为并列关系，与题干逻辑关系一致，保留；\nC项：大肠是消化管的下段，可分为盲肠、阑尾、结肠、直肠和肛管5部分，第一词与第三词为并列关系，且均与第二词构成组成关系，与题干逻辑关系不一致，排除；\nD项：颈椎、胸椎、腰椎是三种不同的椎骨，三者为并列关系，与题干逻辑关系一致，保留。\n对比B、D两项，题干中锁骨、肋骨、坐骨所在的位置依次为从上到下，B项中腹腔、口腔、鼻腔所在的位置依次为从下到上，而D项中颈椎、胸椎、腰椎所在的位置依次为从上到下，因此D项与题干逻辑关系更为一致，当选。\n故正确答案为D。","no":97,"missingImage":false},{"type":"question","qid":"16592936","cat":"类比推理","stem":"热传递：热传导：热辐射","options":{"A":"隔离：冷却：灭火","B":"混合物：化合物：纯净物","C":"播种：撒播：条播","D":"说明文：举例子：作比较"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n热传递是物理学上的一个物理现象，是指由于温度差引起的热能传递现象，热传递主要存在三种基本形式：热传导、热辐射和热对流。热传导和热辐射为并列关系，分别与热传递构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：隔离和冷却是两种不同的灭火方式，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：混合物是指由两种或两种以上的单质或化合物混合而成的物质，化合物是指由两种或两种以上不同元素组成的纯净物，纯净物是指由一种单质或一种化合物组成的聚合物。混合物与纯净物为并列关系，化合物与纯净物为种属关系，与题干逻辑关系不一致，排除；\nC项：撒播是指把作物的种子均匀地撒在地里，必要时进行覆土的播种方式，条播是指沿着一条浅犁沟撒布种子的播种方式。撒播和条播是两种不同的播种方式，二者为并列关系，分别与播种构成种属关系，与题干逻辑关系一致，当选；\nD项：举例子和作比较是写说明文采用的两种不同的写作手法，二者为并列关系，分别与说明文构成对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":98,"missingImage":false},{"type":"question","qid":"16593030","cat":"类比推理","stem":"数字经济 对于 （    ） 相当于 （    ） 对于 人工智能","options":{"A":"信息工具 家用电器","B":"信息技术 无人驾驶","C":"数字资源 现代农业","D":"数字货币 远程医疗"},"answer":"B","explanation":"逐一代入选项。\nA项：数字经济是以新一代信息技术为依托的一种新经济形态，数字经济一定需要利用信息工具，二者为必然利用的对应关系；家用电器可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除；\nB项：数字经济一定需要利用信息技术，二者为必然利用的对应关系；无人驾驶一定需要利用人工智能，二者为必然利用的对应关系，前后逻辑关系一致，当选；\nC项：数字经济一定需要利用数字资源，二者为必然利用的对应关系；现代农业可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除；\nD项：数字经济的发展导致了数字货币的产生，二者为产物的对应关系；远程医疗可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":99,"missingImage":false},{"type":"question","qid":"16593000","cat":"类比推理","stem":"缘木求鱼 对于 （    ） 相当于 （    ） 对于 抱薪救火","options":{"A":"事与愿违 抽薪止沸","B":"南辕北辙 通宵达旦","C":"刻舟求剑 纵风止燎","D":"扬汤止沸 凿壁偷光"},"answer":"C","explanation":"逐一代入选项。\nA项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“事与愿违”指事情的发展与主观愿望相反，二者无明显逻辑关系；“抽薪止沸”意思是抽掉锅底下的柴火，使锅里的水不再翻滚，比喻从根本上解决问题，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者是反义关系，前后逻辑关系不一致，排除；\nB项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“南辕北辙”指心里想往南去，却驾车往北走，比喻行动和目的相反，二者无明显逻辑关系；“通宵达旦”指的是从入夜直到天亮，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“刻舟求剑”比喻看问题做事情死板不灵活，不知情随势变，二者是近义关系；“纵风止燎”指的是用鼓风的方法灭火，比喻本欲消弭其事，却反而助长其声势，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者是近义关系，前后逻辑关系一致，当选；\nD项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“扬汤止沸”指把锅里烧的沸水舀起来再倒回去，想叫它不沸腾，比喻办法不对头，不能从根本上解决问题，二者是近义关系；“凿壁偷光”原指西汉匡衡凿穿墙壁引邻舍之烛光读书，后用来形容家贫而读书刻苦，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":100,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"b302ee9e82c1\" style=\"max-width:626px\">\u003c/p>","questions":[{"qid":"16592975","cat":"增长","stem":"表格所列国家中，相较于2012年，2022年全球创新指数增长最快的国家是：","options":{"A":"美国","B":"中国","C":"英国","D":"印度"},"answer":"B","explanation":"根据题干“······相较于2012年，2022年······增长最快的国家是”，可判定本题为一般增长率比较问题。定位统计表可得：2012年美国全球创新指数为57.7，2022年为61.8；2012年中国全球创新指数为45.4，2022年为55.3；2012年英国全球创新指数为61.2，2022年为59.7；2012年印度全球创新指数为35.7，2022年为36.6。根据公式：增长率\u003cimg data-k=\"7a919ee92a2e\">，则相较于2012年，2022年选项中国家全球创新指数同比增速分别为：\n美国：\u003cimg data-k=\"9db085ce17bb\">；\n中国：\u003cimg data-k=\"5112348f6a05\">；\n英国：\u003cimg data-k=\"a72ce82ec5a5\">；\n印度：\u003cimg data-k=\"5a24cfb262a0\">。\n综上，表格所列国家中，相较于2012年，2022年全球创新指数增长最快的国家是中国。\n故正确答案为B。","no":101,"missingImage":false},{"qid":"10204656","cat":"增长","stem":"2022年，瑞士的全球创新指数下降约：","options":{"A":"0.9个百分点","B":"1.4个百分点","C":"1.8个百分点","D":"2.5个百分点"},"answer":"B","explanation":"根据题干“2022年，瑞士的全球创新指数下降约”，结合选项为百分点，可判定本题为一般增长率问题。定位表格可得：2021年和2022年瑞士的全球创新指数分别为65.5和64.6。根据公式：增长率\u003cimg data-k=\"7a919ee92a2e\">，则题干所求为\u003cimg data-k=\"fd40cbf27fea\">\u003cimg data-k=\"f7787ad024bb\">，即下降约1.4个百分点。\n故正确答案为B。\n备注：指数并不等同于百分数，问上升/下降情况时不一定做减法。如A股指数由3000点上涨到3100点，应该说A股指数上涨3.3%，即增长率。经粉笔教研本题的全球创新指数，认为问其上升/下降情况时，计算其增长率更加合理。","no":102,"missingImage":false},{"qid":"16592980","cat":"平均数","stem":"表格所列国家中，2022年全球创新指数排名前五位国家的平均创新指数是：","options":{"A":"58.54","B":"59.74","C":"60.84","D":"61.14"},"answer":"D","explanation":"根据题干“······2022年······平均创新指数是”，可判定本题为现期平均数问题。定位统计表可得：2022年全球创新指数排名前五位的国家分别是瑞士（64.6）、美国（61.8）、瑞典（61.6）、英国（59.7）、荷兰（58.0）。利用“削峰填谷”，以60为基准，分别作差得：4.6、1.8、1.6、-0.3、-2，\u003cimg data-k=\"595351133c0f\">，则排名前五位国家的平均创新指数=60+1.14=61.14。\n故正确答案为D。","no":103,"missingImage":false},{"qid":"16592984","cat":"综合","stem":"关于2021年，下列国家全球创新指数大小比较，错误的是：","options":{"A":"瑞士>瑞典>美国","B":"英国>韩国>荷兰","C":"芬兰>新加坡>丹麦","D":"俄罗斯>巴西>印度"},"answer":"D","explanation":"定位统计表可知2021年部分国家全球创新指数。代入选项验证：\nA项：瑞士（65.5）&gt;瑞典（63.1）&gt;美国（61.3），正确；\nB项：英国（59.8）&gt;韩国（59.3）&gt;荷兰（58.6），正确；\nC项：芬兰（58.4）&gt;新加坡（57.8）&gt;丹麦（57.3），正确；\nD项：俄罗斯（36.6）&gt;巴西（34.2）&lt;印度（36.4），错误。\n本题为选非题，故正确答案为D。","no":104,"missingImage":false},{"qid":"16592988","cat":"综合","stem":"能够从上述资料推出的是：","options":{"A":"2022年，韩国创新指数同比下降幅度超过丹麦","B":"2022年，中国创新指数在全球的排名比2012年上升20位","C":"表格所列年份中，全球创新指数均在58及以上的国家有5个","D":"2022年，表格所列全球创新指数同比增长的国家中，其创新指数同比增量均不少于0.5"},"answer":"A","explanation":"A项：定位统计表可得，2021年、2022年韩国创新指数分别为59.3、57.8，丹麦分别为57.3、55.9。根据公式：增长率\u003cimg data-k=\"7a919ee92a2e\">，可得2022年韩国创新指数同比增速\u003cimg data-k=\"86d653a95f0c\">\u003cimg data-k=\"7c5e4e0b131a\">，即降幅为2.5%；丹麦创新指数同比增速\u003cimg data-k=\"ccd397025f37\">\u003cimg data-k=\"4599a979d4c2\">，即降幅为2.4%。则2022年韩国创新指数同比下降幅度超过丹麦，正确；\nB项：材料只给出部分国家创新指数的数据，无法得出2012年、2022年中国在全球的排名，错误；\nC项：定位统计表可得，2012年、2021年、2022年全球创新指数均在58及以上的国家分别为瑞士（68.2、65.5、64.6）、瑞典（64.8、63.1、61.6）、英国（61.2、59.8、59.7）、荷兰（60.5、58.6、58.0），共4个国家，并非5个国家，错误；\nD项：定位统计表可得，2021年、2022年印度创新指数分别为36.4、36.6。2022年印度创新指数同比增量=现期量-基期量=36.6-36.4=0.2&lt;0.5，并非均不少于0.5，错误。\n故正确答案为A。","no":105,"missingImage":false}]},{"type":"material","material":"\u003cp>\u003cimg data-k=\"572f6d88febc\" style=\"max-width:642px\">\u003c/p>\u003cp>\u003cimg data-k=\"fdb9b3b29f36\" style=\"max-width:642px\">\u003c/p>","questions":[{"qid":"10204589","cat":"增长","stem":"2019~2022年全国体育场地面积增长最快的年份是：","options":{"A":"2019年","B":"2020年","C":"2021年","D":"2022年"},"answer":"A","explanation":"根据题干“2019~ 上强调，要搞好统筹扩大内需和深化供给侧结构性改革，形成需求牵引供给、供给创造需求的更高水平动态平衡，实现国民经济良性循环。\n④正确，习近平总书记在《当前经济工作的几个重大问题》一文“（一）着力扩大国内需求”部分指出：“二是通过政府投资和政策激励有效带动全社会投资。当前，民间投资预期较弱，政府投资必须发挥好引导作用，这是应对经济周期性波动的有力工具······”在中共中央政治局就加快构建新发展格局进行第二次集体学习时又强调，坚决贯彻落实扩大内需战略规划纲要，尽快形成完整内需体系，着力扩大有收入支撑的消费需求、有合理回报的投资需求、有本金和债务约束的金融需求。\n⑤正确，2023年政府工作报告指出：“政府投资和政策激励要有效带动全社会投资，今年拟安排地方政府专项债券3.8万亿元，加快实施‘十四五’重大工程，实施城市更新行动，促进区域优势互补、各展其长，继续加大对受疫情冲击较严重地区经济社会发展的支持力度，鼓励和吸引更多民间资本参与国家重大工程和补短板项目建设，激发民间投资活力。”\n综上所述，①④⑤均说法正确，共3项。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"10204481","cat":"时事政治","stem":"党的二十大报告指出，加快建设农业强国，扎实推动乡村产业、人才、文化、生态、组织振兴。下列措施有利于培育乡村可持续“造血”能力，助推乡村振兴的有几项？\n①建立健全城乡融合发展体制机制和政策体系\n②精准针对农村贫困地区大量投放资源和要素\n③推动乡村产业同质化发展充分发挥规模效应\n④涉农企业下沉，形成以城带乡联动发展格局\n⑤鼓励建设冷库等田间“冰箱”实现错峰销售","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"B","explanation":"本题考查政治常识。\n①正确，《中共中央 国务院关于做好2023年全面推进乡村振兴重点工作的意见》中“九、强化政策保障和体制机制创新”部分指出：“（三十三）推进县域城乡融合发展。健全城乡融合发展体制机制和政策体系，畅通城乡要素流动。”\n②错误，④正确，《以产业振兴助力乡村振兴（新论）》中指出：“合理的乡村产业布局不仅能促进要素自由有序流动，提高要素配置效率，激发乡村产业发展活力，还能推动更大范围内的产业集聚，使涉农企业下沉，形成县带镇、镇带村的多轴联动发展格局，促进乡村产业振兴与县域经济高质量发展有效融合。”助力乡村振兴，应合理在农村贫困地区投放资源和要素。\n③错误，《以产业振兴助力乡村振兴（新论）》中指出：“立足资源禀赋优势，差异化发展特色产业，县域经济才有更强竞争力。基于一方水土，开发乡土资源，突出地域特点，体现当地风情，这样的产业才能从差异化中提升吸引力，拥有持续力。”并非推动乡村产业同质化发展。\n⑤正确，《以产业振兴助力乡村振兴（新论）》中指出：“相关地区和部门应立足实际、分类施策，鼓励建设冷库等田间‘冰箱’，实现错峰销售，或在县域关键节点推动建设农产品冷链集配中心，提升分级分拣、市场集散能力。”\n故①④⑤表述正确，有3项。\n故正确答案为B。","no":2,"missingImage":false},{"type":"question","qid":"16593222","cat":"新思想","stem":"习近平法治思想是对中国共产党领导法治建设丰富实践和宝贵经验的科学总结，是一个内涵丰富、论述深刻、逻辑严密、系统完备的科学理论体系。下列关于习近平法治思想说法正确的有几项？\n①自由是秩序的目的，秩序是自由的保障\n②党的领导是社会主义法治之魂，是我国法治与西方资本主义国家法治最大的区别\n③发挥领导干部示范带头作用，努力使尊法学法守法用法在全社会蔚然成风\n④新闻媒体要加强对执法司法工作的监督，但对执法司法部门的正确行动，要予以支持，加强解疑释惑，进行理性引导\n⑤加强重点领域、新兴领域、涉外领域立法，统筹推进国内法治和涉外法治，以良法促进发展、保障善治","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"D","explanation":"本题考查政治常识。\n①正确，习近平总书记在第二届世界互联网大会开幕式上的讲话中指出：“推进全球互联网治理体系变革，应该坚持以下原则······构建良好秩序。网络空间同现实社会一样，既要提倡自由，也要保持秩序。自由是秩序的目的，秩序是自由的保障。我们既要尊重网民交流思想、表达意愿的权利，也要依法构建良好网络秩序，这有利于保障广大网民合法权益······”\n②正确，习近平总书记于2020年11月16日在中央全面依法治国工作会议上讲话的“第一，坚持党对全面依法治国的领导”中指出：“党的领导和依法治国不是对立的，而是统一的。我国法律充分体现了党和人民意志，我们党依法办事，这个关系是相互统一的关系。全党同志必须牢记，党的领导是我国社会主义法治之魂，是我国法治同西方资本主义国家法治最大的区别······”\n③正确，中共二十大报告在“七、坚持全面依法治国，推进法治中国建设”中指出：“（四）加快建设法治社会。法治社会是构筑法治国家的基础······推进多层次多领域依法治理，提升社会治理法治化水平。发挥领导干部示范带头作用，努力使尊法学法守法用法在全社会蔚然成风。”\n④正确，习近平总书记于2014年1月7日在中央政法工作会议上的讲话中强调：“政法机关要自觉接受媒体监督，以正确方式及时告知公众执法司法工作情况，有针对性地加强舆论引导。新闻媒体要加强对执法司法工作的监督，但对执法司法部门的正确行动，要予以支持，加强解疑释惑，进行理性引导，不要人云亦云，更不要在不明就里的情况下横挑鼻子竖挑眼······”\n⑤正确，中共二十大报告在“七、坚持全面依法治国，推进法治中国建设”中指出：“（一）完善以宪法为核心的中国特色社会主义法律体系······加强宪法实施和监督，健全保证宪法全面实施的制度体系，更好发挥宪法在治国理政中的重要作用，维护宪法权威。加强重点领域、新兴领域、涉外领域立法，统筹推进国内法治和涉外法治，以良法促进发展、保障善治······”\n故符合题意的是①②③④⑤，共5项。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"16593217","cat":"马克思主义","stem":"“周虽旧邦，其命维新”。习近平总书记指出，中国式现代化是中华民族的旧邦新命，必将推动中华文明重焕荣光。下列关于中国式现代化说法正确的有几项？\n①中国式现代化深深植根于中华优秀传统文化，体现科学社会主义的先进本质\n②中国式现代化借鉴吸收一切人类优秀文明成果，是一种全新的人类文明形态\n③中国式现代化是中国共产党领导的社会主义现代化，是文明更新的结果\n④中国式现代化蕴含的独特世界观、价值观、历史观、文明观、民主观、生态观等及其伟大实践，是对世界现代化理论和实践的重大创新\n⑤中华文明赋予中国式现代化以深厚底蕴，走中国式现代化道路，赋予中华文明以现代力量","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"D","explanation":"本题考查政治常识。\n①②正确，习近平总书记在学习贯彻党的二十大精神研讨班开班式上的重要讲话中指出：“中国式现代化，深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，展现了不同于西方现代化模式的新图景，是一种全新的人类文明形态。”\n③正确，党的二十大报告指出：“中国式现代化是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。”习近平总书记在文化传承发展座谈会的讲话中指出：“中国式现代化是赓续古老文明的现代化，而不是消灭古老文明的现代化；是从中华大地长出来的现代化，不是照搬照抄其他国家的现代化；是文明更新的结果，不是文明断裂的产物。”\n④正确，习近平总书记在学习贯彻党的二十大精神研讨班开班式上指出：“中国式现代化蕴含的独特世界观、价值观、历史观、文明观、民主观、生态观等及其伟大实践，是对世界现代化理论和实践的重大创新。”\n⑤正确，习近平总书记在文化传承发展座谈会的讲话中指出：“中国式现代化赋予中华文明以现代力量，中华文明赋予中国式现代化以深厚底蕴。中国式现代化是赓续古老文明的现代化，而不是消灭古老文明的现代化；是从中华大地长出来的现代化，不是照搬照抄其他国家的现代化；是文明更新的结果，不是文明断裂的产物。中国式现代化是中华民族的旧邦新命，必将推动中华文明重焕荣光。”\n故①②③④⑤正确，有5项。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"16593149","cat":"新思想","stem":"无农不稳，无粮则乱。习近平总书记指出，农业强，首要是粮食和重要农产品供给保障能力必须强，下列举措属于提升粮食产能的有几项？\n①切实把种业振兴行动抓出成效，加快生物育种产业化步伐\n②完善农资保供稳价应对机制，稳定农民预期、降低生产风险\n③逐步把永久基本农田全部建成高标准农田，确保建一块成一块\n④制止“舌尖上的浪费”，深入开展“光盘行动”，提倡健康饮食\n⑤坚决守住18亿亩耕地红线，坚决遏制“非农化”，有效终止“非粮化”","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"C","explanation":"本题考查政治常识。\n2023年3月16日，第6期《求是》杂志发表习近平的重要文章《加快建设农业强国 推进农业农村现代化》。\n①③⑤正确，《加快建设农业强国 推进农业农村现代化》在“二、保障粮食和重要农产品稳定安全供给始终是建设农业强国的头等大事”部分指出：“提升粮食产能仍然是首要任务。我国粮食产量已经连续8年保持在1.3万亿斤高平台上，越往前走难度越大。要实施新一轮千亿斤粮食产能提升行动，抓紧制定实施方案，把任务落实下去。提产能关键还是抓耕地和种子两个要害。要坚决守住18亿亩耕地红线，坚决遏制‘非农化’、有效防止‘非粮化’。坚持良田粮用大原则，良田好土要优先保粮食，果树苗木尽量上山上坡，蔬菜园艺更多靠设施农业和工厂化种植。治理‘非粮化’政策性很强，要统筹考虑粮食生产和重要农产品保障、农民增收的关系，留出一定过渡期，加强政策引导。要逐步把永久基本农田全部建成高标准农田，尽快提出落实办法，该拿的钱要拿到位，建设质量和管护机制也要到位，确保建一块成一块。抓种子要选准突破口，持续发力、协同攻关，把种业振兴行动切实抓出成效，把当家品种牢牢攥在自己手里。生物育种是大方向，要加快产业化步伐。”\n②正确，《加快建设农业强国 推进农业农村现代化》在“二、保障粮食和重要农产品稳定安全供给始终是建设农业强国的头等大事”部分指出：“农民种粮能挣钱，粮食生产才有保障。要健全种粮农民收益保障机制，完善价格、补贴、保险‘三位一体’的政策体系，完善农资保供稳价应对机制，稳定农民预期、降低生产风险。”\n④错误，《加快建设农业强国 推进农业农村现代化》在“二、保障粮食和重要农产品稳定安全供给始终是建设农业强国的头等大事”部分指出：“保障粮食安全，要在增产和减损两端同时发力······消费环节大有文章可做，不仅要制止‘舌尖上的浪费’，深入开展‘光盘行动’，还要提倡健康饮食。”\n综上，①②③⑤四项属于提升粮食产能的措施。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"16593167","cat":"新思想","stem":"习近平总书记强调，要用好红色资源，传承好红色基因，把红色江山世世代代传下去。下列红色基地与主题党课开设搭配最合理的是：\n①北大红楼：红色序章\n②南湖红船：清正廉洁\n③遵义会议会址：伟大转折\n④延安革命根据地：革命摇篮","options":{"A":"①②","B":"①③","C":"②④","D":"③④"},"answer":"B","explanation":"本题考查毛中特。\n①正确，北京大学红楼是中国近代史上李大钊、陈独秀、毛泽东最早传播马克思主义和民主科学进步思想的重要场所，具有重要历史价值。2021年“光辉伟业 红色序章——北大红楼与中国共产党早期北京革命活动”主题展览就在北大红楼召开。故在北大红楼与“红色序章”主题党课开设搭配合理。\n②错误，南湖红船是中国共产党第一次全国代表大会的会场，是中国共产党的诞生地。2005年6月21日，时任中共浙江省委书记的习近平同志在《光明日报》发表《弘扬“红船精神” 走在时代前列》的重要文章，首次提出并阐述了红船精神，红船精神的主要内涵是开天辟地、敢为人先的首创精神，坚定理想、百折不挠的奋斗精神，立党为公、忠诚为民的奉献精神，并明确指出红船精神是中国革命精神之源。故在南湖红船与“清正廉洁”主题党课开设搭配并不合理。\n③正确，1935年1月15日至17日，中共中央决定在黔北重镇遵义召开会议，总结第五次反“围剿”的经验教训。遵义会议确立了毛泽东在党和红军中的领导地位，在极其危急的情况下挽救了党，挽救了红军，挽救了中国革命。遵义会议是党的历史上一个生死攸关的转折点，以毛泽东为核心的党中央的正确领导开始确立，标志着中国共产党在政治上走向成熟。故在遵义会议会址与“伟大转折”主题党课开设搭配合理。\n④错误，1927年，轰轰烈烈的大革命失败后，中国共产党为挽救革命、寻找革命新道路开始了新的奋斗历程。10月，毛泽东率领湘赣边界秋收起义的工农革命军，开始为创建以宁冈为中心的井冈山农村革命根据地而斗争。井冈山是中国革命的摇篮。习近平总书记在赴江西考察时曾深刻指出：“井冈山斗争的伟大实践，对中国革命道路的探索和抉择、对中国共产党和人民军队成长具有关键意义。”故“革命摇篮”的主题党课在井冈山开设更为合理。\n综上所述，①③表述正确。\n故正确答案为B。","no":6,"missingImage":false}],"count":6,"answerable":6,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"10204509","cat":"人文常识","stem":"中华文明源远流长，云娱乐中华民族的宝贵精神品格，*********，创造形成了引领中国社会发展进步的社会主义道德体系。下列古语符合社会主义道德体系建设要求的是：\n①见侮而不斗，辱也\n②百尺之室，以突隙之烟焚\n③躬自厚而薄责于人，则远怨矣\n④黑发不知勤学早，白首方悔读书迟","options":{"A":"①②","B":"①③","C":"②③","D":"③④"},"answer":"B","explanation":"略。","redacted":true,"no":7,"missingImage":false},{"type":"question","qid":"10204506","cat":"人文常识","stem":"2023年3月1日，兰某入职某公司，入职10天后兰某发现自己怀孕，于是经常迟到早退，有时还旷工，已经达到了员工手册规定的解聘条件。2023年5月30日公司宣布解聘兰某。对于公司的解聘行为，下列说法正确的是：","options":{"A":"公司有权解聘兰某，且无需支付经济补偿金","B":"公司有权解聘兰某，但必须支付经济补偿金","C":"兰某处于孕期，按照劳动法的规定，公司不得解聘","D":"公司违法解除与兰某的劳动关系，应当双倍支付经济补偿金"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，B、C、D三项错误，根据《中华人民共和国劳动合同法》第三十九条第二项规定：“劳动者有下列情形之一的，用人单位可以解除劳动合同：······（二）严重违反用人单位的规章制度的；······”第四十二条第四项规定：“劳动者有下列情形之一的，用人单位不得依照本法第四十条、第四十一条的规定解除劳动合同：······（四）女职工在孕期、产期、哺乳期的；······”第四十六条规定：“有下列情形之一的，用人单位应当向劳动者支付经济补偿：（一）劳动者依照本法第三十八条规定解除劳动合同的；（二）用人单位依照本法第三十六条规定向劳动者提出解除劳动合同并与劳动者协商一致解除劳动合同的；（三）用人单位依照本法第四十条规定解除劳动合同的；（四）用人单位依照本法第四十一条第一款规定解除劳动合同的；（五）除用人单位维持或者提高劳动合同约定条件续订劳动合同，劳动者不同意续订的情形外，依照本法第四十四条第一项规定终止固定期限劳动合同的；（六）依照本法第四十四条第四项、第五项规定终止劳动合同的；（七）法律、行政法规规定的其他情形。”\n题目中，兰某虽然怀孕，但违背了《中华人民共和国劳动合同法》第三十九条第二项的规定，用人单位可以解除劳动合同；同时《中华人民共和国劳动合同法》并未规定用人单位依照第三十九条的规定解除劳动合同的，需要支付经济补偿金。因此，兰某严重违反劳动纪律或者用人单位规章制度，公司有权解聘兰某，且无需支付经济补偿金。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"10204495","cat":"人文常识","stem":"胡女士在甲公司APP上看到乙酒店某型客房贵宾优惠价为2889元后付款，次日却发现该房型当晚的实际挂牌价仅1377元。胡女士认为其作为贵宾客户却支付了高于实际价格的费用，遂将甲公司起诉至法院。关于此案，下列说法错误的是：","options":{"A":"甲公司存在价格欺诈行为，胡女士有权退一赔三","B":"甲公司向胡女士承诺贵宾优惠价，但未践行承诺，侵害了胡女士的公平交易权","C":"甲公司的行为导致胡女士遭受了不必要的经济损失，侵害了胡女士的财产安全权","D":"甲公司APP作为中介平台，其未如实标注该房型的真实价格，侵害了胡女士的知情权"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国消费者权益保护法》第五十五条第一款规定：“经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金额不足五百元的，为五百元。法律另有规定的，依照其规定。”《明码标价和禁止价格欺诈规定》第十九条第四项规定：“经营者不得实施下列价格欺诈行为：（四）销售商品或者提供服务时，使用欺骗性、误导性的语言、文字、数字、图片或者视频等标示价格以及其他价格信息；”因此，甲公司存在价格欺诈行为，胡女士有权退一赔三。\nB项正确，根据《中华人民共和国消费者权益保护法》第十条规定：“消费者享有公平交易的权利。消费者在购买商品或者接受服务时，有权获得质量保障、价格合理、计量正确等公平交易条件，有权拒绝经营者的强制交易行为。”甲公司该房型的价格并不合理，侵害了胡女士的公平交易权。\nC项错误，根据《中华人民共和国消费者权益保护法》第七条规定：“消费者在购买、使用商品和接受服务时享有人身、财产安全不受损害的权利。消费者有权要求经营者提供的商品和服务，符合保障人身、财产安全的要求。”甲公司的行为并未侵害胡女士的财产安全权。\nD项正确，根据《中华人民共和国消费者权益保护法》第八条规定：“消费者享有知悉其购买、使用的商品或者接受的服务的真实情况的权利。消费者有权根据商品或者服务的不同情况，要求经营者提供商品的价格、产地、生产者、用途、性能、规格、等级、主要成份、生产日期、有效期限、检验合格证明、使用方法说明书、售后服务，或者服务的内容、规格、费用等有关情况。”因此，甲公司APP作为中介平台，未如实标注该房型的真实价格，侵害了胡女士的知情权。\n本题为选非题，故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"16593165","cat":"法律常识","stem":"下列关于自首的判断说法正确的是：","options":{"A":"甲和乙共同实施盗窃犯罪，后甲因为内心害怕，主动到公安机关交代，并独自承担了全部罪行，甲构成自首","B":"甲和乙共同实施诈骗犯罪，后甲因酒驾被公安机关讯问时，主动交代乙曾经实施的故意杀人行为，甲构成自首","C":"王某交通肇事逃逸，其父知道后将其扭送至公安机关，王某主动交代了其肇事逃逸行为，王某构成自首","D":"甲公司非法集资且规模很大，该公司总经理李某因为害怕，瞒着其他高管偷偷到公安机关交代了相关情况，李某作为单位犯罪的直接责任人不能单独成立自首"},"answer":"C","explanation":"本题考查法律常识。\n根据《中华人民共和国刑法》第六十七条规定：“犯罪以后自动投案，如实供述自己的罪行的，是自首。对于自首的犯罪分子，可以从轻或者减轻处罚。其中，犯罪较轻的，可以免除处罚。被采取强制措施的犯罪嫌疑人、被告人和正在服刑的罪犯，如实供述司法机关还未掌握的本人其他罪行的，以自首论。犯罪嫌疑人虽不具有前两款规定的自首情节，但是如实供述自己罪行的，可以从轻处罚；因其如实供述自己罪行，避免特别严重后果发生的，可以减轻处罚。”\nA项错误，根据《最高人民法院关于处理自首和立功具体应用法律若干问题的解释》第一条规定：“······共同犯罪案件中的犯罪嫌疑人，除如实供述自己的罪行，还应当供述所知的同案犯，主犯则应当供述所知其他同案犯的共同犯罪事实，才能认定为自首······”题中，甲独自承担了全部罪行，并未如实供述同案犯，不构成自首。\nB项错误，根据《最高人民法院关于处理自首和立功具体应用法律若干问题的解释》第五条规定：“根据刑法第六十八条第一款的规定，犯罪分子到案后有检举、揭发他人犯罪行为，包括共同犯罪案件中的犯罪分子揭发同案犯共同犯罪以外的其他犯罪，经查证属实；提供侦破其他案件的重要线索，经查证属实；阻止他人犯罪活动；协助司法机关抓捕其他犯罪嫌疑人（包括同案犯）；具有其他有利于国家和社会的突出表现的，应当认定为有立功表现。”题中，甲主动交代乙的其他罪行，构成立功，不构成自首。\nC项正确，根据《最高人民法院关于处理自首和立功具体应用法律若干问题的解释》第一条规定：“······并非出于犯罪嫌疑人主动，而是经亲友规劝、陪同投案的；公安机关通知犯罪嫌疑人的亲友，或者亲友主动报案后，将犯罪嫌疑人送去投案的，也应当视为自动投案······”题中，王某虽被扭送至公安机关，但主动交代罪行，构成自首。\nD项错误，根据《中华人民共和国刑法》第三十一条规定：“单位犯罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员判处刑罚。本法分则和其他法律另有规定的，依照规定。”《办理走私刑事案件适用法律若干问题的意见》第二十一条规定：“关于单位走私犯罪案件自首的认定问题在办理单位走私犯罪案件中，对单位集体决定自首的，或者单位直接负责的主管人员自首的，应当认定单位自首。认定单位自首后，如实交代主要犯罪事实的单位负责的其他主管人员和其他直接责任人员，可视为自首，但对拒不交代主要犯罪事实或逃避法律追究的人员，不以自首论。”因此，司法实践中认可单位自首的情形。题中，李某作为单位直接负责人，虽然瞒着其他高管单独到公安机关交代相关情况，但仍构成单位自首。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"16593152","cat":"经济常识","stem":"货币不仅是固定充当一般等价物的特殊商品，更是人类文明发展史中各个阶段的里程碑，下列语句中关于货币的发展按时间先后排序正确的是：\n①氓之蚩蚩，抱布贸丝\n②青钱白璧买无端，丈夫快意方为欢\n③农工商交易之路通，而龟贝金钱，刀布之币兴焉\n④蜀川老觉家潼川，怀中交子是铁钱","options":{"A":"①④②③","B":"②④①③","C":"③②①④","D":"①③②④"},"answer":"D","explanation":"本题考查经济常识。\n货币的发展经历了偶然的物物交换，扩大的物物交换，以一般等价物为媒介的交换，以金属货币为媒介的物物交换这四个阶段。\n①出自先秦《诗经·卫风·氓》，意思是憨厚的农家小伙子，怀抱布匹来换丝。偶然的物物交换发生在原始社会末期，是在部落双方都有剩余产品这种极其偶然的情况下发生的。“抱布贸丝”则反映了在当时随着生产力和社会分工的发展，物物交换的范围扩大且次数频繁，即扩大的物物交换。\n②出自唐代李贺的《相劝酒》，意思是纵有青钱白璧无数，买不到光阴半寸，身为伟岸丈夫，要的是快意欢颜。青钱即青铜钱，白璧是平圆形而中有孔的白玉，这里代指的就是流通的金属货币。\n③出自《史记·平准书》，意思是龟贝金钱刀布的货币的流通会促进农工商交易之路通畅。龟是龟甲，贝是贝壳，金在商周时期主要指的是青铜，钱指铁铲，刀则指的是兵器，而布则是布匹。体现了以一般等价物为媒介的物物交换。\n④出自宋代释慧空的《送僧三首·其一》，交子是宋代发行的一种纸币，可以兑现，便于流通，也是世界上最早的纸币。纸币产生于一般等价物固定在金银上之后，是代替金属货币执行流通手段的价值符号。\n故正确排序为①③②④。\n故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"16593025","cat":"法律常识","stem":"《中华人民共和国法律援助法》对于规范和促进法律援助工作、保障公民和有关当事人合法权益具有重大意义。下列情况属于可经指派获得法律援助的是：\n①15岁的学生小明涉嫌贩卖毒品，没有委托辩护人\n②25岁的精神病人赵某涉嫌抢劫，其患病多年经济困难，没有委托辩护人\n③35岁的村民张某因向村中水井投毒，可能被判处死刑，没有委托辩护人\n④45岁的聋哑人李某创设公司后涉嫌逃税罪，其个人资产过亿，没有委托辩护人","options":{"A":"①②③","B":"②③④","C":"①③④","D":"①②③④"},"answer":"D","explanation":"本题考查法律常识。\n①②③④正确，根据《中华人民共和国法律援助法》第二十五条第一款规定：“刑事案件的犯罪嫌疑人、被告人属于下列人员之一，没有委托辩护人的，人民法院、人民检察院、公安机关应当通知法律援助机构指派律师担任辩护人：（一）未成年人；（二）视力、听力、言语残疾人；（三）不能完全辨认自己行为的成年人；（四）可能被判处无期徒刑、死刑的人；（五）申请法律援助的死刑复核案件被告人；（六）缺席审判案件的被告人；（七）法律法规规定的其他人员。”其中，①中小明是未成年人，②中赵某是不能完全辨认自己行为的成年人。\n故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"16593137","cat":"法律常识","stem":"司机王某骑电动自行车载其外籍女友去艺术馆参观，二人均未佩戴头盔，被交警发现。对于二人可能面临的行政处罚，下列表述正确的是：","options":{"A":"交警可以当场对王某进行罚款","B":"交警可以暂扣王某的机动车驾驶证","C":"王某女友适用《中华人民共和国行政处罚法》，可予以行政拘留","D":"王某女友不适用《中华人民共和国行政处罚法》的规定，不予处罚"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，B项错误，根据《天津市道路交通安全若干规定》第四十三条第五项规定：“非机动车在道路上通行，应当遵守下列规定：（五）驾驶电动自行车上道路行驶时，驾驶人以及乘车人应当规范佩戴安全头盔。”《中华人民共和国道路交通安全法》第八十九条规定：“行人、乘车人、非机动车驾驶人违反道路交通安全法律、法规关于道路通行规定的，处警告或者五元以上五十元以下罚款；非机动车驾驶人拒绝接受罚款处罚的，可以扣留其非机动车。”《中华人民共和国道路交通安全法》第一百零七条第一款规定：“对道路交通违法行为人予以警告、二百元以下罚款，交通警察可以当场作出行政处罚决定，并出具行政处罚决定书。”由此可见，王某与其外籍女友骑乘电动自行车未佩戴头盔，违反《天津市道路交通安全若干规定》，依据《中华人民共和国道路交通安全法》的规定，对王某与其女友都可处警告或者五元以上五十元以下罚款，同时警告与五十元以下罚款可以当场作出。\nC、D两项错误，根据《中华人民共和国行政处罚法》第八十四条规定：“外国人、无国籍人、外国组织在中华人民共和国领域内有违法行为，应当给予行政处罚的，适用本法，法律另有规定的除外。”由此可见，王某女友的违法行为适用《中华人民共和国行政处罚法》，同时对于王某女友的处罚是警告或者五元以上五十元以下罚款，而非行政拘留。\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"16593017","cat":"人文常识","stem":"戏曲是中华优秀传统文化的重要组成部分，下列有关说法错误的是：","options":{"A":"京剧、豫剧、评剧、黄梅戏、越剧是中国戏剧五大剧种","B":"《群英会》是依据《水浒传》改编的传统京剧","C":"黄梅戏代表剧目中有《天仙配》和《女驸马》","D":"豫剧与梆子腔关系紧密"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，中国戏曲剧种种类繁多，其中“京剧、豫剧、评剧、黄梅戏、越剧”为五大戏曲剧种。京剧在清光绪年间形成于北京，现已成为中国影响最大、最具有代表性的一个剧种。豫剧也称河南梆子、河南高调，形成于清朝初年，至今已有300多年历史，是洛阳、河南的主要剧种，在国内外影响仅次于京剧。评剧是我国北方地区的一种地方戏，在华北、东北及其他一些地区流行很广，是广大人民所喜闻乐见的剧种之一。黄梅戏起源于湖北黄梅，是安徽省的主要地方戏曲剧种，是十八世纪后期在皖、鄂、赣三省毗邻地区形成的一种民间小戏。评剧原名“平腔梆子戏”，俗称“唐山落子”，“蹦蹦戏”。越剧，是以嵊县一带的民间说唱艺术“落地唱书”为基础，并在余姚鹦歌（秧歌）和湖州滩簧的影响下发展形成的。\nB项错误，京剧以历史故事为主要演出内容，传统剧目约有一千三百多个，常演的在三四百个以上，其中《群英会》等剧目家喻户晓，为广大观众所熟知。《群英会》是依据《三国演义》第45回改编的传统京剧，故事叙述：曹操谋士蒋干，与周瑜故交，请求过江劝降。周瑜将计就计，盛会隆重宴请诸将和挚友，号称“群英会”。\nC项正确，黄梅戏中有许多为人熟知的优秀剧目，代表剧目中有《天仙配》和《女驸马》。《天仙配》讲述了七仙女不顾天规，私自下凡与董永结为伉俪，憧憬美好生活，最终被玉帝生生拆散的爱情故事。《女驸马》讲述了民女冯素珍冒死救夫，经历了种种曲折，终于如愿以偿，成就了美满姻缘的故事。\nD项正确，豫剧因早期演员用本嗓演唱，起腔与收腔时用假声翻高尾音带“讴”，又叫“河南讴”。豫剧在声腔上属梆子腔系。豫剧划分主要有五大流派：以开封为中心的唱法称“祥符调”；以商丘为中心的唱法称“豫东调”，又称“东路调”；以洛阳为中心流传的唱法称为“豫西调”，又称“西府调”；流行于豫东南的称“沙河调”，又叫“本地梆”；建国后，在杨兰春等的领导下，对豫剧四大地域流派唱腔进行了综合吸收和大幅改革，运用科学的发音，融入了歌剧元素，形成了“现代流派”，又称“现代戏流派”。\n本题为选非题，故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"16593124","cat":"经济常识","stem":"下列关于国债逆回购的说法正确的是：","options":{"A":"投资者可以通过银行网点购买国债逆回购","B":"国债逆回购是以国家为主体进行债券回购","C":"国债逆回购本质上是一种短期资金借贷方式","D":"国债逆回购利率上行20个基点表示利率增加2%"},"answer":"C","explanation":"本题考查经济常识。\nA项错误，投资者应选择有国债逆回购业务的证券营业部开户。此外，证券交易所还会和投资者签一个“指定交易协议”，所以投资者应在证券交易所开户进行交易。但不可以通过银行网点进行购买。\nB项错误，国债逆回购参与主体大致分为两类：第一类为融资方，一般是商业银行、非银行金融机构等，第二类为资金出借方，一般有个人投资者、基金公司、保险公司等。所以国债逆回购并不是以国家为主体进行债券回购。\nC项正确，国债逆回购本质就是一种短期贷款，即将资金通过国债回购市场拆出，其实就是一种短期贷款。个人通过国债回购市场把自己的资金借出去，获得固定的利息收益；而回购方，也就是借款人用自己的国债作为抵押获得这笔借款，到期后还本付息。\nD项错误，基点是利率的计数单位，一个百分点等于100个基点，也叫BP。如原来利率是3.25%，下降25个基点，就成了3%。此处上行20个基点表示利率增加0.2%。\n故正确答案为C。","no":15,"missingImage":false},{"type":"question","qid":"16593122","cat":"经济常识","stem":"下列所描述现象与相关专业术语对应正确的是：","options":{"A":"某商品的价格越高，其需求量越大——价值悖论","B":"工资率随劳动供求的变动而及时迅速地变动——工资粘性","C":"人们倾向于将从小样本中得到的结论错误地移植到大样本中——小数定律","D":"在完全竞争的市场上，相同交易产品经过汇率调整后，在世界范围内其交易成本是相同的——一价定律"},"answer":"D","explanation":"本题考查经济常识。\nA项错误，价值悖论，也被称为钻石与水悖论，是亚当·斯密在《国富论》中提出的一个观点。这个观点指出了物品的使用价值与交换价值之间存在一个反差，即使用价值大的物品（如水）的交换价值却很小，而交换价值大的物品（如钻石）的使用价值却很小。凡勃伦效应是指消费者对一种商品需求的程度因其标价较高而不是较低而增加，如价格昂贵的手表、钢琴等，往往也能在市场上走俏。消费者购买这类商品不仅仅是为了获得直接的物质满足和享受，更大程度上是为了获得心理上的满足。\nB项错误，工资粘性或工资黏性指工资率不能随劳动供求的变动而及时迅速地变动。20世纪70年代后半期至80年代，早期的新凯恩斯主义者以长期劳动合同的形式引入了名义工资粘性。在发达的经济中，工资不是在即时交易中决定的，而是由劳资双方以明确（或隐含）的合同确定的。在合同期限内，劳动者必须按照根据他预期的价格水平而计算出来的工资提供劳动，即使在此期间实际的价格水平有所变动，劳资双方也必须遵守合同中规定的工资水平。\nC项错误，小数定律又称小数定理，是阿莫斯·特沃斯基和丹尼尔·卡纳曼在其研究中对“赌徒谬误”的总结。小数定律是指把从大样本中得到的结论错误地移植到小样本中的倾向。如“赌博者谬误”：许多人都经常预期一个随机赌局的第二轮会得到与第一轮相反的结果，如果一项投硬币游戏前若干轮出现太多的“头像”，那么许多参与者确信下一轮便应该是“文字”了，而实际上，每一轮在统计上都是独立的。\nD项正确，一价定律是绝对购买力平价理论的一种表现形式，它是由货币学派的代表人物弗里德曼提出的。一价定律可简单地表述为：当贸易开放且交易费用为零时，同样的货物无论在何地销售，用同一货币来表示的货物价格都相同。这揭示了国内商品价格和汇率之间的一个基本联系。在完全竞争的市场上，相同的交易产品或金融资产经过汇率调整后，在世界范围内其交易成本一定是相等的。\n故正确答案为D。","no":16,"missingImage":false},{"type":"question","qid":"16593234","cat":"人文常识","stem":"下列诗句中涉及的典故人物与其时代对应说法不正确的一项是：","options":{"A":"林暗草惊风，将军夜引弓。平明寻白羽，没在石棱中——西汉","B":"闲来垂钓碧溪上，忽复乘舟梦日边——先秦","C":"怀旧空吟闻笛赋，到乡翻似烂柯人——东汉","D":"求田问舍，怕应羞见，刘郎才气——三国"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“林暗草惊风，将军夜引弓。平明寻白羽，没在石棱中。”出自唐代卢纶的《和张仆射塞下曲六首·其二》。意思是树林幽暗，突来的疾风使草木惊倒纷披，将军以为有虎，黑夜里拉弓射箭。天亮时去寻找那支白羽毛的箭，箭头已深埋在石头里。这里的将军指西汉飞将军李广猎虎的故事，取材于西汉史学家司马迁记载李广事迹的《李将军列传》。\nB项正确，“闲来垂钓碧溪上，忽复乘舟梦日边。”出自唐代李白的《行路难·其一》。意思是像姜太公吕尚垂钓溪，闲待东山再起；又像伊尹做梦，乘船经过日边。引用吕尚、伊尹的历史典故，时间对应先秦，即秦朝之前。\nC项错误，“怀旧空吟闻笛赋，到乡翻似烂柯人。”出自唐代刘禹锡的《酬乐天扬州初逢席上见赠》。意思是怀念故去旧友徒然吟诵闻笛小赋，久谪归来感到已非旧时光景。“闻笛赋”指西晋向秀的《思旧赋》，刘禹锡借用这个典故怀念已死去的王叔文、柳宗元等人。\nD项正确，“求田问舍，怕应羞见，刘郎才气。”出自宋代辛弃疾的《水龙吟·登建康赏心亭》。意思是像只为自己购置田地房产的许汜，应怕惭愧去见，才气双全的刘备。此句用许汜与陈登的典故，时间对应东汉末年至三国时期。\n本题为选非题，故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"16593127","cat":"人文常识","stem":"下列选项描述的历史场景与时代不符的是：","options":{"A":"唐玄宗时期，百姓可以在祠堂祭拜祖先","B":"南宋时期，人们可以到商业街购买东西","C":"永乐年间，大部分州县由粮长负责征解税粮","D":"道光年间，福建、广东等地的百姓可以用银元完纳钱粮"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，祠堂是供奉与祭祀祖先或先贤的场所。“祠堂”一名最早出现于汉代，从秦汉到北宋，有资格建祠堂的不是王公贵族，就是士大夫官员，民间不得立祠。南宋时，理学家朱熹著《家礼》立祠堂之制，创制祠堂以敬祖，民间祠堂已有所发展。故在唐玄宗时期，百姓不可以在祠堂祭拜祖先。\nB项正确，南宋时期，商品经济空前繁荣，越来越多的商人在街道两旁开设店铺，商品种类众多，因此带动了商业街的发展，其中最为著名的就是南宋御街。故在南宋时期，人们可以到商业街购买东西。\nC项正确，粮长制，始创于洪武四年，是中国明代在各州县设置的由粮长负责征解税粮的制度。粮长的主要任务是负责本区的田粮催征、经收、解运诸事宜，后来其职权范围也有所扩大，行使拟订田赋科则、编造鱼鳞图册、检举流人户等职责。嘉靖后，实行一条鞭法，裁粮归里，粮长的职责由里长担任。洪武为明朝开国国君朱元璋的年号，永乐是明朝第三个皇帝朱棣的年号。故永乐年间，大部分州县由粮长负责征解税粮。\nD项正确，银元大约在明万历年间流入中国；乾隆年间，清政府首次在西藏铸行“乾隆宝藏”银币；道光年间，台湾、福建、广东等地也曾仿制银元，称为银饼；光绪年间，清廷开始正式铸造银元“光绪元宝”（即龙洋），各省纷纷效仿铸造。故道光年间，福建、广东等地的百姓可以用银元完纳钱粮。\n本题为选非题，故正确答案为A。","no":18,"missingImage":false},{"type":"question","qid":"16593079","cat":"科技常识","stem":"酶是具有高度特异性和高度催化效能的生物催化剂，在人类的生产生活中具有重要的应用。以下有关酶的添加应用对应错误的是（    ）。","options":{"A":"白酒——淀粉酶","B":"果汁——纤维素酶","C":"脱脂奶——乳糖酶","D":"加酶洗衣粉——蛋白酶"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，淀粉酶是水解淀粉和糖原的酶类总称，通常通过淀粉酶催化水解织物上的淀粉浆料。淀粉酶可以用作果汁加工中的淀粉分解和提高过滤速度以及蔬菜加工、糖浆制造、葡萄糖等加工制造。在白酒酿酒过程中，以淀粉为原料酿酒，需经过两个主要过程，一是淀粉糖化过程；二是酒精发酵过程。淀粉吸水膨胀，加热糊化，形成结构疏松的淀粉，在淀粉酶的作用下分解为低分子的单糖；单糖在脱羧酶、脱氢酶的催化下分解，逐渐分解形成二氧化碳和酒精。\nB项正确，纤维素酶是一类能够降解纤维素的酶，其主要作用是水解果汁中的纤维素成分，使其分解成可溶性物质。水果中含有纤维素、果胶等大分子物质，在榨汁时，这些物质会影响出汁率并使榨出的果汁浑浊，易出现沉淀。添加纤维素酶、果胶酶可以将果胶、纤维素分解成小分子的可溶性的物质，从而提高出汁率并使果汁饮料澄清。\nC项错误，乳糖酶是人体中的一种消化酶，是以母乳、奶粉为主要营养来源的婴幼儿体内最重要的消化酶，乳糖酶的主要功能是消化乳糖，将乳糖水解成能够被人体吸收的半乳糖和葡萄糖。乳糖酶主要用于乳品工业，可使低甜度和低溶解度的乳糖转变为较甜的、溶解度较大的单糖，还可使冰淇淋、浓缩乳、淡炼乳中乳糖结晶析出的可能性降低，同时增加甜度。脱脂奶主要通过离心分离将牛奶中的脂肪和非脂肪部分分离而获得。二者并无直接关联。\nD项正确，加酶洗衣粉中添加了多种酶制剂，如碱性蛋白酶制剂和碱性脂肪酶制剂等。这些酶制剂不仅可以有效地清除衣物上的污渍，而且对人体没有毒害作用，并且这些酶制剂及其分解产物能够被微生物分解，不会污染环境。\n本题为选非题，故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"16593236","cat":"科技常识","stem":"下列病毒与其主要感染的人体系统对应正确的是：","options":{"A":"狂犬病毒——免疫系统","B":"流感病毒——神经系统","C":"乙肝病毒——消化系统","D":"艾滋病毒——生殖系统"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，狂犬病毒主要感染神经系统。人类被携带狂犬病毒的动物咬伤后，狂犬病毒会从伤口处进入人体，但并不会马上侵染神经元，而是在肌肉内停留一段时间，这就是潜伏期。潜伏期之后，狂犬病毒会经过运动神经和骨骼肌之间的连接，进入神经系统，一旦狂犬病毒开始侵染神经系统，便会在神经元之间高速运输，神经系统会受到致命的破坏。狂犬病毒主要是通过动物咬抓伤传播。\nB项错误，流感病毒是一种影响上呼吸道和下呼吸道的传染性病毒性疾病，主要感染呼吸系统，通过空气飞沫传播。\nC项正确，乙肝病毒主要感染消化系统。乙肝病毒主要感染身体中的肝脏部位，可能会造成肝功能损伤，肝脏属于消化系统。乙肝的传播方式主要是血液传播、性传播和母婴传播。\nD项错误，艾滋病毒主要感染免疫系统。艾滋病毒会攻击并逐渐破坏人类的免疫系统，致使宿主在被感染时得不到保护。感染人类免疫缺陷病毒并且去世的人，往往死于继发感染或者癌症。艾滋病毒主要是血液传播、性传播和母婴传播。\n故正确答案为C。","no":20,"missingImage":false}],"count":14,"answerable":14,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"10204462","cat":"逻辑填空","stem":"当其他城市还停留在“漫步”的思维里寻找发展机遇时，有的地方已经开始            ，深挖骑行、游船休闲消费需求。这不仅为当地经济拓展了新“赛道”，打开了新思路，也为文旅消费市场扩容提质、产业发展转型升级提供更广阔的市场空间。\n填入画横线部分最恰当的一项是：","options":{"A":"另辟蹊径","B":"推陈出新","C":"招兵买马","D":"大展宏图"},"answer":"A","explanation":"根据横线后“为当地经济拓展了新‘赛道’，打开了新思路”可知，横线处成语应体现有的地方已经采取了和其他城市不同的新做法。A项“另辟蹊径”比喻另创一种新风格或另找一个新途径、新方法，符合文意，当选。\nB项“推陈出新”指对旧的文化进行批判地继承，剔除其糟粕，吸取其精华，创造出新的文化，文段并无“推陈”之意，与文意不符，排除；C项“招兵买马”比喻组织或扩充人力，D项“大展宏图”指大规模地实施宏伟远大的计划或抱负，与后文采取新的做法均无法构成对应，与文意不符，排除。\n故正确答案为A。\n【文段出处】中经评论《“超长黄金周”呼唤文旅消费品质升级》","no":21,"missingImage":false},{"type":"question","qid":"16593164","cat":"逻辑填空","stem":"要解决一个大问题，往往要有好的工具。工具的发展是一个            的过程，新工具能够促进学问的继续发展，提升我们看待问题的深度，又反过来促进我们进一步发展工具。每一次工具的进步，都会带动有意义的、重要的、突破性的学问的发展。\n填入画横线部分最恰当的一项是：","options":{"A":"锦上添花","B":"精益求精","C":"千锤百炼","D":"精雕细琢"},"answer":"B","explanation":"根据“要解决一个大问题”“新工具能够促进学问的继续发展，提升我们看待问题的深度，又反过来促进我们进一步发展工具”可知，在解决一个大问题的过程中，工具在不断地发展进步，形成了正向循环，即工具的发展是越来越好的过程，B项“精益求精”意为好了还求更好，符合文意，当选。\nA项“锦上添花”比喻好上加好，美上添美，侧重在已有的事物上，再添加其他美好的事物，文段强调工具自身的进步发展，与文意不符，排除；\nC项“千锤百炼”比喻经历多次的艰苦斗争和考验，文段并未提及艰苦的斗争和考验，与文意不符，排除；\nD项“精雕细琢”指精心细致地雕刻，多形容做事认真细致，文段并未强调认真细致在工具进步中的重要作用，与文意不符，排除。\n故正确答案为B。\n【文段出处】《丘成桐：学“问”》","no":22,"missingImage":false},{"type":"question","qid":"16593215","cat":"逻辑填空","stem":"许多自媒体采取“流量至上”的经营模式，为追求流量，可能并不会审查所推送的信息是否失真，但对于大量面临“信息茧房”障碍的读者来说，一般不会去思考和辨别言论的真伪，即便有疑虑也难以去辨别，所以，实践中            的情形较多。\n填入画横线部分最恰当的一项是：","options":{"A":"偏听偏信","B":"亦步亦趋","C":"人云亦云","D":"盲从盲信"},"answer":"D","explanation":"根据横线前“对于大量面临‘信息茧房’障碍的读者来说，一般不会去思考和辨别言论的真伪，即便有疑虑也难以去辨别”可知，横线处所填成语应体现对于自媒体推送的信息，读者一般不会去思考和辨别其真伪，而是盲目相信。D项“盲从盲信”意为盲目地相信，附合随从，符合文意，当选。\nA项“偏听偏信”意思是片面地听了一方面的话就信以为真，多指处理事情的态度不公正，与文意不符，排除；B项“亦步亦趋”比喻处处模仿、追随别人，与“言论”搭配不当，排除；C项“人云亦云”形容遇事无主见，顺随别人的意见，侧重从众，而文段侧重不辨真伪，不如D项更加契合文意，排除。\n故正确答案为D。\n【文段出处】长安理论《自媒体时代如何保障“自证清白”的权利》","no":23,"missingImage":false},{"type":"question","qid":"10204465","cat":"逻辑填空","stem":"人们往往对历经上百上千年的古董充满敬畏感，却鲜少给予我们父辈甚至我们自己手中诞生的文明产物以呵护。实际上，工业遗产不仅是几代人青春奋斗的地方，也记录着企业            的发展历程，更承载着中国制造由小到大、由弱变强的历史记忆。\n填入画横线部分最恰当的一项是：","options":{"A":"波澜壮阔","B":"岁月峥嵘","C":"难以忘怀","D":"不可磨灭"},"answer":"D","explanation":"搭配“企业”“发展历程”，根据“工业遗产不仅是······更承载着······历史记忆”可知，文段从个人、企业、中国制造三个维度阐述工业遗产的作用，即工业遗产能够留下记忆，故横线处所填成语应表达留下记忆之意，D项“不可磨灭”指功绩、印象等将始终保留在人们的记忆中，搭配恰当且符合文意，当选。A项“波澜壮阔”比喻声势雄壮或规模巨大，与文意不符，且用于形容企业的发展历程程度过重，排除；B项“岁月峥嵘”形容不平凡的年月，与文意不符，且“岁月峥嵘”通常不作为修饰语使用，排除；C项“难以忘怀”形容记忆深刻，不容易忘掉，侧重强调主观情感上的不能忘怀，而企业的发展历程是客观真实的存在，与文段语境不符，排除。\n故正确答案为D。\n【文段出处】中国经济网《工业遗产这座富矿，不仅属于当代》","no":24,"missingImage":false},{"type":"question","qid":"10204469","cat":"逻辑填空","stem":"一些品牌随意挑选某个古代物件图样印在服饰上，再染上年画风格的配色，就为自己打出国潮的        。其实，这根本算不上真正意义的国潮，国潮不是简单的文化包装，而是传统文化与现代审美的深度        。\n依次填入画横线部分最恰当的一项是:","options":{"A":"名头 交汇","B":"标签 结合","C":"标记 融汇","D":"噱头 融合"},"answer":"D","explanation":"第一空，根据“随意挑选某个古代物件图样印在服饰上，再染上年画风格的配色”“这根本算不上真正意义的国潮”可知，横线处所填词语感情色彩偏消极，D项“噱头”指滑稽的话或举动，也指花招、手段，感情色彩偏消极，符合文意，保留。A项“名头”指名声、由头或名称，B项“标签”指贴在或系在物品上标明品名、用途、价格等的纸片，C项“标记”指记号，均为中性表达，与文段消极的感情色彩不符，排除。\n第二空，代入验证，根据“国潮不是简单的文化包装”可知，横线处词语应体现传统文化与现代审美交融之意，D项“融合”指几种不同的事物合成一体，符合文意，当选。\n故正确答案为D。\n【文段出处】光明网《国潮不是一种简单的文化包装》","no":25,"missingImage":false},{"type":"question","qid":"10204485","cat":"逻辑填空","stem":"科学从来不会        自己洞察了宇宙所有的真相和奥秘，它从不否认自身的局限性：超出一定范围和条件之后，没有任何一种理论能够        和解释所有的现象，回答所有的问题。\n依次填入画横线部分最恰当的一项是：","options":{"A":"宣称 描述","B":"认定 把握","C":"预言 分析","D":"标榜 论证"},"answer":"A","explanation":"第一空，根据“它从不否认自身的局限性”可知，横线处所填词语意在表达科学不会表示自己洞察了宇宙所有的真相和奥秘。A项“宣称”指公开地用语言、文字表示，B项“认定”指确切地认为，D项“标榜”指提出某种好听的名义，加以宣扬，均符合文意，保留。C项“预言”指预先说出将来要发生的事情，文段并未提及对未来的预测，与文意不符，排除。\n第二空，搭配“理论”和“现象”，且根据“解释所有的现象，回答所有的问题”可知，横线处所填词语应表示“阐述清楚”之意。A项“描述”指描写叙述，符合文意且搭配恰当，当选。B项“把握”指抓住，主语通常为具有主观能动性的主体，与“理论”搭配不当，排除；D项“论证”指用论据证明论题的真实性，文段强调“阐述清楚”而非以论据来证明，与文意不符，且“现象”可作为证据以论证“理论”，而非“理论”论证“现象”，置于此处逻辑错误，排除。\n故正确答案为A。\n【文段出处】知社学术圈《如同把大象装进冰箱——颠覆主流科学理论的三步走》","no":26,"missingImage":false},{"type":"question","qid":"16593192","cat":"逻辑填空","stem":"文旅开发需注重对古镇自然环境的呵护，避免简单        其他文旅项目大广场、大草坪、大展馆等设计，应当留住古镇清幽、古朴的历史风貌，而大规模迁移原住居民、过度引入商业设施的开发模式，已经让众多注重旅游体验的游客“用脚投票”，尤当            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"移植 引以为戒","B":"复制 居安思危","C":"参考 防微杜渐","D":"借鉴 慎之又慎"},"answer":"A","explanation":"第一空，根据“应当留住古镇清幽、古朴的历史风貌”和“简单”提示可知，横线处应表达文旅开发不能简单、盲目、不经思考地照抄、挪用其他项目的设计之意，A项“移植”指把幼苗拔起种在田地里，可引申理解为直接挪用，B项“复制”指仿原样品制造，均符合文意，保留。C项“参考”指参证有关材料来帮助研究和了解，D项“借鉴”指把别的人或事当镜子，对照自己，以便吸取经验或教训，均侧重于学习经验、汲取别人的优点之意，并非直接照搬，与文意不符，排除。\n第二空，根据“大规模迁移原住居民、过度引入商业设施的开发模式，已经让众多注重旅游体验的游客‘用脚投票’”可知，这些开发模式无法吸引游客，带来了严重的后果，故横线处应表达应当避免类似的开发模式之意，A项“引以为戒”指把过去犯错误的教训拿来作为警戒，避免重犯，符合文意，当选。B项“居安思危”指随时有应付意外事件的思想准备，侧重在问题发生之前要有忧患意识，而文段该问题已经发生了，故与文意不符，排除。\n故正确答案为A。\n【文段出处】中国青年报《古镇旅游何时不再“抄作业”》","no":27,"missingImage":false},{"type":"question","qid":"10204492","cat":"逻辑填空","stem":"中国地理位置相对独立，南有热带丛林，西南有世界屋脊喜马拉雅山和青藏高原， 西有昆仑山、天山、阿尔泰山等高山和中亚沙漠，北有蒙古高原和戈壁荒滩，东方则面海。它们虽不能构成人类迁徙的绝对        ，但会给大规模人群的流动带来挑战，尤其在环境恶化时更是如此。在这样相对封闭的生态环境中，于气候适宜期迁徙至此的早期直立人生存繁衍，            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"隔断 代代相传","B":"阻碍 绵绵不绝","C":"障碍 开花结果","D":"屏障 开枝散叶"},"answer":"D","explanation":"第一空，根据“会给大规模人群的流动带来挑战”可知，横线处所填词语应体现这些地理因素不能完全阻挡人类迁徙之意，B项“阻碍”指起阻碍作用的事物，C项“障碍”指阻碍物，D项“屏障”指遮蔽、阻挡之物，均可体现阻挡之意，保留。A项“隔断”指专门作为分隔室内空间的立面，常用于分隔房屋及室内空间，与文意不符，排除。\n第二空，搭配“早期直立人”，且通过逗号与前文构成并列关系，故横线处所填成语应与“生存繁衍”构成近义并列，体现人逐渐增多或增广之意，D项“开枝散叶”多用来比喻人的生殖繁衍，传递祖先血脉，与文意相符，当选。B项“绵绵不绝”形容连续不断，多用于搭配“景象”“文化”等，与“早期直立人”搭配不当，排除；C项“开花结果”比喻工作、学习等有进展，并取得了成果，侧重强调结果，无法体现不断增多或增广之意，排除。\n故正确答案为D。\n【文段出处】人民网《探寻旧石器时代的中华文明根脉》","no":28,"missingImage":false},{"type":"question","qid":"16593200","cat":"逻辑填空","stem":"从道理上讲，科普和科幻都可以            ，但实际上，科普的范围更广，科普可以涉及天文、地理、数学、物理、人工智能等多个学科，可以多方面铺开，而且科普的形式包括写科普文章、出版 答案为D。\n【文段出处】潮新闻《孤独的赛者，挑战的是自我和人类极限》","no":31,"missingImage":false},{"type":"question","qid":"16593224","cat":"逻辑填空","stem":"中国的岁时节日既情意盎然又韵味绵长，以其深厚的旨趣，令人            ，堪称中国人的精神原乡。作为人类非物质文化遗产，如今的中国岁时节日，早已把中国与世界紧密地联系到一起，世界各地都有中国的节庆文化，华夏民族的古老智慧，在            中滋润着这个世界。\n依次填入画横线部分最恰当的一项是：","options":{"A":"心向往之  春风化雨","B":"心旌摇荡  继往开来","C":"心驰神往  历久弥新","D":"心旷神怡  经久不衰"},"answer":"C","explanation":"第一空，搭配“中国的岁时节日”，且根据前文“中国的岁时节日既情意盎然又韵味绵长，以其深厚的旨趣”可知，横线处所填成语应体现人们被中国的岁时节日所吸引之意，A项“心向往之”意为对某个人或事物心里很向往，C项“心驰神往”形容思想集中在追求和向往的事情或地方上，一心向往，均符合文意，保留。B项“心旌摇荡”形容面对自己想要或想得到的东西拿不定主意，犹豫不决，文中并无犹豫不决之意，与文意不符，排除；D项“心旷神怡”意为心情愉快，精神舒畅，常与“景色”等搭配，与“中国的岁时节日”搭配不当，排除。\n第二空，搭配“华夏民族的古老智慧”，且根据前文“如今的中国岁时节日······世界各地都有中国的节庆文化”可知，横线处所填成语应表达古老的中国文化在与世界的交流中不断发展之意，C项“历久弥新”形容经过长久的时间，（事物）不但没有衰败、陈旧，反而更新、更好，且“久”对应“古老智慧”，“新”对应“如今的中国岁时节日”，符合文意，当选。A项“春风化雨”指适宜草木生长的风雨，多用在人或事，比喻良好的熏陶和教育，与文意无关，排除。\n故正确答案为C。\n【文段出处】重庆日报《节日文化也是一种精神原乡》","no":32,"missingImage":false},{"type":"question","qid":"10204496","cat":"逻辑填空","stem":"电信网络诈骗受害者超过六成都是“90后”和“00后”的年轻人，这与        的大众认知相悖。为什么有些年轻人总爱接受“            ”的结论，因而常常在推理和决策过程中犯错甚至被骗？这可能是一些思维特质造成的。这些思维特质使得人们跳进自己的思维陷阱，更容易犯下看似        的思维错误。\n依次填入画横线部分最恰当的一项是：","options":{"A":"常规 一反常态 愚蠢","B":"普遍 一览无余 普通","C":"一般 一见钟情 简单","D":"传统 一厢情愿 常见"},"answer":"C","explanation":"本题可从第二空入手，横线处出现双引号，起到形象表达的作用，根据“这些思维特质使得人们跳进自己的思维陷阱”可知，人们由于思维惯性，会直接对结论深信不疑，横线处所填词语要体现一听见结论就相信之意。C项“一见钟情”指男女间一见面就产生了爱情，D项“一厢情愿”指只是单方面的愿望，没有考虑对方是否同意，或客观条件是否具备，置于此处均可体现一听见就相信、认定之意，且满足形象表达，保留。A项“一反常态”意思是完全改变了平时的态度，与“跳进自己的思维陷阱”矛盾，排除；B项“一览无余”形容视野开阔或事物简单明了，一下就能全都看到，与文意无关，排除。\n第三空，搭配“思维错误”，根据“这些思维特质使得人们跳进自己的思维陷阱”“更容易犯下看似······”可知，年轻人能够上当受骗，并非诈骗方式多么高明，C项“简单”指结构单纯，头绪少，容易理解、使用或处理，与“思维错误”搭配恰当，与文意相符，保留。D项“常见”指经常见到，无法体现诈骗不高明之意，与文意不符，排除。\n第一空，代入验证，搭配“大众认知”，C项“一般”指普通、通常，与“大众认知”搭配恰当，当选。\n故正确答案为C。\n【文段出处】环球科学《“一眼假”的网络诈骗，为什么总能骗到年轻人？》","no":33,"missingImage":false},{"type":"question","qid":"16593189","cat":"逻辑填空","stem":"蜱虫具有恐怖的吸血能力，它会找到皮肤上隐蔽的角落            地吸血好几天，人却无法察觉。这是因为蜱虫的唾液就像鸡尾酒一样，由各种蛋白质“        ”而成，其中一些让人不痛不痒，一些让血液不会凝固，还有一些保证不会        人的免疫系统。多种病原体便会趁机入侵人体。\n依次填入画横线部分最恰当的一项是：","options":{"A":"不声不响 搅拌 启动","B":"堂而皇之 调配 惊扰","C":"明目张胆 凝结 触发","D":"有恃无恐 混合 唤醒"},"answer":"B","explanation":"第一空，横线处应体现蜱虫吸血时的特点，且根据“人却无法察觉”可知，横线处与后文构成转折，体现蜱虫吸血时或可能光明正大之意。B项“堂而皇之”指公开或不加掩饰，C项“明目张胆”指公开地、无所顾忌地做坏事，D项“有恃无恐”指因有所依仗而不害怕，填入文段均可体现出蜱虫吸血时光明正大之意，符合文意，保留。A项“不声不响”指不说话、不出声，与后文“无法察觉”无法构成转折，排除。\n第二空，根据“这是因为蜱虫的唾液就像鸡尾酒一样”可知，横线处形容鸡尾酒的特点，B项“调配”指调制配比，符合鸡尾酒的特点且生动形象，D项“混合”指各种物品掺杂在一起，均符合文意，保留。C项“凝结”指由气体变成液体或由液体变成固体，与“鸡尾酒”无法对应，排除。\n第三空，根据“多种病原体便会趁机入侵人体”可知，横线处体现蜱虫不会使免疫系统发生反应之意，B项“惊扰”指惊动扰乱，符合文意，当选。D项“唤醒”指从沉睡状态叫醒，文段并无人体免疫系统原本在沉睡之意，排除。\n故正确答案为B。\n【文段出处】环球科学《你可能已被这种昆虫吸血数天，感染了数种危险病原体，但毫无知觉》","no":34,"missingImage":false},{"type":"question","qid":"16593186","cat":"逻辑填空","stem":"一款零食以前能靠独特口味畅销十几年，这在今天几乎是天方夜谭。新爆款横空出世，模仿者很快            ，消费者的新鲜感被迅速透支。当朝生暮死成为网红食品的常态，相比于            的零食巨头，轻资产的中小品牌反而更容易在时代变幻莫测的风向中            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蜂拥而至 尾大不掉 闪转腾挪","B":"后来居上 作茧自缚 捷足先登","C":"青出于蓝 因循守旧 稳操胜券","D":"龙争虎斗 老气横秋 脱颖而出"},"answer":"A","explanation":"第一空，搭配主语“模仿者”，根据“新鲜感被迅速透支”可知，横线处意在指出模仿者很快进行模仿，出现很多相似的产品，A项“蜂拥而至”意思是像一窝蜂似地拥来，形容很多人乱哄哄地朝一个地方聚拢，符合文意，保留。B项“后来居上”比喻后来的人和事，进步很快，赶上或超过了先前的，文段没有指出模仿者“超越了”先前的，且如果是超越前人的积极语义，就不会有后文“新鲜感被迅速透支”的不良后果，排除；C项“青出于蓝”比喻学生超过老师或后人胜过前人，感情色彩不符，排除；D项“龙争虎斗”比喻大家都在争斗，场面激烈，侧重“争斗”，文段强调人们纷纷模仿，并未强调“争斗”，排除。\n第二空、第三空，代入验证，文段中“零食巨头”与“中小品牌”构成对比，A项“尾大不掉”比喻部下势力太大，不易指挥调度，突出零食巨头存在不易调度、不够灵活的问题；“闪转腾挪”指在困境中快速转移、灵活应对的能力，突出中小品牌轻资产的优势，均符合语境，当选。\n故正确答案为A。\n【文段出处】《90后的童年零食，没人愿意吃了》","no":35,"missingImage":false},{"type":"question","qid":"16593196","cat":"片段阅读","stem":"人类特别喜欢读到和关注有关他人和社会的负面信息，媒体从业者则是顺应这种喜好，这使人们接触到更多的负面信息而非正面信息。这种“有偏见的暴露效应”解释了为什么人们认为当前的道德水平相对较低。而当人们回忆过去时，负面事件更可能被遗忘，这是由于大脑的内在机制要求不良事件引起的负面反应情绪必须被平复，因此时过境迁，再大的悲剧也可以慢慢放下。这种“有偏见的记忆效应”又解释了为什么人们认为过去的道德水平相对较高。\n这段文字意在说明：","options":{"A":"“世风日下”可能是一种群体心理错觉","B":"心理层面人们更愿记住过去美好的事件","C":"道德水平的高低取决于负面事件的影响","D":"媒体传播强化了人们对负面信息的接收"},"answer":"A","explanation":"文段开篇指出人类有关注他人和社会负面信息的喜好，媒体则顺应这种喜好导致人们接触到更多的负面信息，这种“有偏见的暴露效应”解释了人们认为当前道德水平低的原因，随后指出当人们回忆过去时负面事件更可能被遗忘，这种“有偏见的记忆效应”解释了人们认为过去道德水平较高的原因，故文段通过 “有偏见的暴露效应”以及“有偏见的记忆效应”两种心理学机制，解释了为什么人们认为当前道德水平低而过去道德水平高。而这两种心理学机制都是带有偏见的，因此最终得出的结论也并不令人信服，对应A项。\nB项，“人们更愿记住过去美好的事件”对应并列后“有偏见的记忆效应”的内容，表述片面，排除；\nC项，“道德水平的高低”说法错误，文段道德水平的高低只是人们的主观认知，而非客观事实，排除；\nD项，“媒体传播”对应首句的部分内容，表述片面且非重点，排除。\n故正确答案为A。\n【文段出处】《世风日下人心不古？这可能只是一种群体心理幻觉》","no":36,"missingImage":false},{"type":"question","qid":"10204487","cat":"片段阅读","stem":"草原生态系统通过生物多样性，发挥着支持、供给、调节等服务功能：土壤形成、水文、生物代谢化学循环以及其他生态学过程，都是由草原生物多样性参与和支撑的；草原持续为我们供应大量动物产品（如畜产品）和植物产品（如食品、药品等），河流和湖泊的淡水也有赖于草原涵养水源的功能；草原上的植物通过蒸腾作用、光合作用，调节气候，还可配合土壤发挥调蓄作用。 \n这段文字意在说明：","options":{"A":"草原生态系统具有生物多样性","B":"草原具有涵养水源的重要作用","C":"草原与我们日常生活密不可分","D":"草原植物具有降温和调蓄作用"},"answer":"C","explanation":"文段开篇指出草原生态系统通过生物多样性发挥着支持、供给、调节等服务功能，接下来通过“：”进行解释说明，并通过三方面分别论述草原参与支撑其他生态学过程、供应产品、调节气候、发挥调蓄等作用，故文段首句是重点，意在强调草原发挥着多方面的功能，对应C项。\nA项，“生物多样性”非重点，文段重点强调草原的功能，排除；\nB项，“涵养水源”对应解释说明中的第二部分，表述片面，排除；\nD项，“调蓄作用”对应解释说明中的第三部分，表述片面，排除。\n故正确答案为C。\n【文段出处】人民日报《草原多样性“多”在哪里（把自然讲给你听）》","no":37,"missingImage":false},{"type":"question","qid":"10204504","cat":"片段阅读","stem":"关于文艺与时代的关系，中外许多文艺家都有精辟论述。如唐代诗人白居易所言“文章合为时而著，歌诗合为事而作”，法国作家巴尔扎克说自己愿意充当“法国社会的书记员”，“活在民族之中的大诗人，就应该总括这些民族的思想，一言以蔽之，就应该成为他们的时代化身才是”，俄国批评家车尔尼雪夫斯基也曾说过，“只有那些在强大而蓬勃的思想影响之下，只有能够满足时代迫切要求的文学倾向，才能得到灿烂的发展”，等等。这些都说明文艺既要反映时代的现实，又要超越时代的现实。今天，我们迎来一个伟大的变革时代，我们文艺工作者应正确认识文艺与时代的关系，在实践中丰富和完善艺术理想，积极响应“为时代画像、为时代立传、为时代明德”的号召，拿出更多艺术精品献给人民和这个伟大的时代。\n这段文字意在说明：","options":{"A":"文艺创作绝不能脱离当下时代的社会现实","B":"时代需要更多反映社会发展趋势的好作品","C":"艺术家要在实践中不断丰富发展文艺理论","D":"文艺既要反映时代现实又要超越时代现实"},"answer":"D","explanation":"文段开篇指出文艺与时代的关系许多文艺家都有论述，接着进行举例，后文通过指代词“这些”对前文进行总结，点明文艺与时代的关系，即文艺要反映时代现实，又要超越时代现实。最后进行进一步解释说明，指出文艺工作者应正确认识文艺和时代的关系。故文段论述的核心话题为“文艺”与“时代现实”，强调文艺要反映时代现实并超越时代现实，对应D项。\nA项，“不能脱离当下时代的社会现实”表述不明确，文段已明确指出文艺要反映时代现实并超越时代现实，排除；\nB项，缺少“文艺”这一主题词，偏离文段中心，排除；\nC项，缺少“时代现实”这一主题词，偏离文段中心，排除。\n故正确答案为D。\n【文段出处】人民日报《交出我们时代的文艺答卷》","no":38,"missingImage":false},{"type":"question","qid":"16593185","cat":"片段阅读","stem":"语言规划学的研究告诉我们，什么样的语言生活，塑造什么样的语言样态，也就培育什么样的语言能力。古诗词和复杂灵动的修辞有其恒久的价值与魅力，但不要忘记，在唐诗宋词滥觞的岁月，它们也是因适应当时的文人语言生活才获得发展的。回到今天，不论线上线下，我们都很难要求话语里也三句一成语、五句一典故。恰恰相反，不同于直接生硬的引用，在这个网络时代，有恒久魅力的经典语言文化正在以新的方式焕发生机。如把古诗词咏唱出来，新造成语用四字格描述今人情绪······如此种种不胜枚举。\n这段文字意在说明：","options":{"A":"经典的文化元素在每个时代都会流行","B":"每个时代都有其独特的语言生活和样态","C":"语言文化必须适应语言生活才能获得发展","D":"经典文化元素在不同时代会有不同的表现形式"},"answer":"C","explanation":"文段开篇指出语言生活影响语言样态和语言能力，强调语言生活的重要性，后文首先通过转折指出古诗词和修辞是适应当时的语言生活才得以发展的，随后指出在今天的环境下，我们很难要求出口就是成语或典故，经典语言文化在网络时代正以新的方式焕发生机，即经典语言文化适应了现在的语言生活，有新的表现形式，随后进行举例论证。故文段重在强调语言文化需要语言生活，二者具有适配性，对应C项。\nA、D两项，均未提及文段主题词“语言文化”“语言生活”，偏离文段中心，排除；\nB项，未体现“语言文化”和“语言生活”的关系，且缺少“语言文化”这一核心话题，偏离文段中心，排除。\n故正确答案为C。\n【文段出处】《让网络激发语言热情》","no":39,"missingImage":false},{"type":"question","qid":"16593199","cat":"片段阅读","stem":"很多手工艺材料是因其所成之物原本的功能在现代社会中弱化或消失，才造成选材方向的改变，由此，治物不再依据客观需求，而是更多地转向主观的、表达个性的艺术创作。例如，古人对砚材评介的首要标准是适于研墨而非为雕刻观玩，于墨材而言，首要则是适于书写而非为模印赏鉴。回溯历史，由古人之物及用物文化可见，传统手工艺的发展是不断发现和使用合用的材料治物以为人服务，而不是仅仅围绕某种物质存在的技术活动。\n关于手工艺材料，文段中传统观点认为：","options":{"A":"选材应趋向多元化","B":"发掘材质本身之美","C":"材料之美源于适用","D":"治物基于艺术表现"},"answer":"C","explanation":"文段开篇指出随着社会的发展手工艺材料的选材发生了改变，治物由传统的依据客观需求转向了主观艺术创作，并以“砚材”和“墨材”为例，指出古人对手工艺材料的首要要求是“适用”，随后指出从古人的物品和用物文化可以看出，传统手工艺的发展目标是适合人使用，而不是仅仅围绕某种物质存在的技术活动。故文段中所介绍的传统观点认为手工艺材料关键是要适用，对应C项。\nA项“选材多元化”、B项“发掘材质之美”和D项“基于艺术表现”，均未体现出手工艺材料的适用性，与文段观点不符，排除。\n故正确答案为C。\n【文段出处】“中国非物质文化遗产”微信公众号《吴南：透过物质看“非遗”——中国传统手工艺的材料观》","no":40,"missingImage":false},{"type":"question","qid":"10204505","cat":"片段阅读","stem":"我国平台经济具有较好的数据贯通能力和智能分析能力，能够更好地帮助实体经济升级营销模式，提升管理决策效率和营销系统化能力，还可以利用平台应用的能力，提升实体经济中的产业链协同协作效应。因此，政府应积极地引导、支持消费互联网平台转型发展，对平台企业在新技术、新业态等方面的探索和投资布局给予更大的包容与支持，发挥平台优势助力构建我国自主可控的产业生态，在上下游联动、数实融合中创新孵化。\n根据这段文字，我国平台经济需向哪个方向引导？","options":{"A":"提升管理能力","B":"助力产业协同","C":"赋能实体经济","D":"孵化创新产业"},"answer":"C","explanation":"文段开篇指出我国平台经济具有较好的数据贯通能力和智能分析能力，能够帮助实体经济升级营销模式，提升管理决策效率和营销系统化能力。随后通过“还”引导并列，指出平台经济还可利用其应用能力，提升实体经济中的产业链协同协作效应。最后通过“因此”进行总结，指出想要发挥平台经济的作用，政府应采取措施助力数实融合，即数字技术和实体经济深度融合。故文段为分总结构，重点论述平台经济对实体经济的作用，强调我国平台经济需向实体经济方向引导，对应C项。\nA项“提升管理能力”对应“提升管理决策效率”、B项“助力产业协同”对应“提升实体经济中的产业链协同协作效应”，均表述片面，且未提及文段主题词“实体经济”，排除；\nD项，“孵化创新产业”表述不明确，文段强调的是“在数实融合中创新孵化”，该项未提及“实体”，排除。 \n故正确答案为C。\n【文段出处】北京日报《引导平台经济健康持续发展》","no":41,"missingImage":false},{"type":"question","qid":"16593194","cat":"片段阅读","stem":"天文学家用基尼系数来描述星系的面亮度分布不均（用星光替代社会学基尼系数定义中的人类财富）：基尼系数越大，意味着亮度越集中分布在少数区域，星系越倾向为椭圆（年老）星系。年轻和年老星系的分界线就在0.5-0.6左右，即如果一个星系的亮度分布不均匀程度超过0.5，则该星系很大概率近似椭圆星系，已失去了制造新恒星的能力了（变成年老星系）。基尼系数在区分不同类星系中的巨大成功使其成为研究星系及星系形态的一个重要参数。\n根据这段文字，基尼系数在区分不同类星系中的成功表现是：","options":{"A":"区别不同星系表面的明亮程度","B":"演示不同星系从年轻到年老的过程","C":"可以用来描述不同星系与恒星的形状","D":"判断不同星系是否失去制造新恒星的能力"},"answer":"D","explanation":"A项，根据“天文学家用基尼系数来描述星系的面亮度分布不均（用星光替代社会学基尼系数定义中的人类财富）”可知，基尼系数被用来描述“亮度分布”，“明亮程度”偷换概念，排除；\nB项，根据“年轻和年老星系的分界线就在0.5-0.6左右”可知，文段仅论述两者的分界线，而非“星系从年轻到年老的过程”，表述错误，排除；\nC项，根据“基尼系数越大，意味着亮度越集中分布在少数区城，星系越倾向为椭圆（年老）星系······则该星系很大概率近似椭圆星系”可知，“恒星的形状”无中生有，排除；\nD项，根据“如果一个星系的亮度分布不均匀程度超过0.5，则该星系很大概率近似椭圆星系，已失去了制造新恒星的能力了（变成年老星系）”可知，基尼系数在区分不同类星系中的成功表现即为“判断不同星系是否失去制造新恒星的能力”，表述正确，当选。\n故正确答案为D。\n【文段出处】中科院物理所《宇宙社会学：宇宙与人》","no":42,"missingImage":false},{"type":"question","qid":"10204494","cat":"片段阅读","stem":"文言和白话是两个相互依存的概念，无文言，也就无所谓白话，但它们并不等同于书面语和口语。受限于语言保存技术，我们现在能感知的古代汉语都是书面上的，包括文言，也包括白话。文言是在先秦口语的基础上形成的古代汉语书面语。先秦两汉的典籍、六朝以后文人仿古写出的作品都属于文言文。 白话是汉魏六朝以后，随着语言发展变化而形成的较为接近口语的言语，偶尔也夹杂一些文言成分，较能反映语言的时代性和区域性特点。\n根据这段文字，下列说法正确的是：","options":{"A":"汉魏六朝以后的作品都属于白话文","B":"古代汉语实际上包含白话文的成分","C":"文言文更能反映语言的时代性特点","D":"文言与白话分别等同书面语与口语"},"answer":"B","explanation":"A项，根据“六朝以后文人仿古写出的作品都属于文言文”及“白话是汉魏六朝以后，随着语言发展变化而形成的较为接近口语的言语，偶尔也夹杂一些文言成分”可知，选项表述错误，排除；\nB项，根据“受限于语言保存技术，我们现在能感知的古代汉语都是书面上的，包括文言，也包括白话”可知，古代汉语确实包含白话文，选项表述正确，当选；\nC项，根据“白话是汉魏六朝以后······偶尔也夹杂一些文言成分，较能反映语言的时代性和区域性特点”可知，选项中“文言文更能反映······特点”属于无关对比，排除；\nD项，根据“文言和白话是两个相互依存的概念，无文言，也就无所谓白话，但它们并不等同于书面语和口语”可知，选项表述与文意相悖，排除。\n故正确答案为B。\n【文段出处】《书面语与口语的源与流——文与言判雅俗殊形》","no":43,"missingImage":false},{"type":"question","qid":"16593193","cat":"片段阅读","stem":"发展现代设施农业是转变农业发展方式的重要内容。相较于传统农业，现代设施农业把保护环境、低碳节能作为发展的前提条件，按照循环发展理念，通过运用人工智能技术、物联网技术等，不仅可以节约大量水资源、土地资源和人力资源，还能有效降低污染物的排放量，减少资源浪费和环境污染。此外，现代设施农业使用高科技技术和先进设备，通过农业生产标准化、精准化、智能化，让土地利用率、劳动产出率更高，资源能耗、生产成本更低，产品更有品质、生态更加安全，助力农业增效和农民增收。\n关于现代设施农业，这段文字未提及：","options":{"A":"推动传统农业向现代农业转型升级","B":"减少资源消耗将促进农民收入增长","C":"有效降低环境污染有利于保护环境","D":"运用人工智能实现农业无人化生产"},"answer":"D","explanation":"A项，根据“发展现代设施农业是转变农业发展方式的重要内容。相较于传统农业······”可知，发展现代设施农业可以推动农业由传统农业转变为现代农业，文段已提及，排除；\nB项，根据“此外，现代设施农业······资源能耗、生产成本更低，产品更有品质、生态更加安全，助力农业增效和农民增收”可知，文段已提及，排除；\nC项，根据“相较于传统农业，现代设施农业······不仅可以节约大量水资源、土地资源和人力资源，还能有效降低污染物的排放量，减少资源浪费和环境污染”可知，文段已提及，排除；\nD项，“实现农业无人化生产”文段并未提及，当选。\n本题为选非题，故正确答案为D。\n【文段出处】光明日报《用现代设施打造富农强农新引擎》","no":44,"missingImage":false},{"type":"question","qid":"16593190","cat":"片段阅读","stem":"近年来，为建设便民生活圈，北京、上海、杭州等多地兴办了不少社区食堂。除了老年人，一些年轻人、附近社区居民也逐渐成为忠实的消费者。数据显示，截至2022年底，上海市已累计建成社区（长者）食堂305家，老年助餐点1303家。不过，在一些社区食堂备受追捧的同时，也有部分食堂出现运营困难，客源单一、饭菜质量不高是其乏人问津的主要原因。社区食堂的经营需通过科学布局、集约建设和精细化运营实现，要避免脱离社区实际盲目配置食堂，浪费公共资金。经营者也须有市场化竞争意识，在长期运营上拿出“绣花功夫”。\n最适合做这段文字标题的是：","options":{"A":"社区食堂的“小餐桌”与“大民生”","B":"统筹社区食堂“公益”与“效益”","C":"激发活力，创新社区食堂运营新模式","D":"办好食堂，让社区居民共享幸福“食”光"},"answer":"B","explanation":"文段开篇指出多地兴办社区食堂的背景，并通过数据论证社区食堂数量众多，接着通过转折关联词“不过”指出部分食堂出现运营困难的问题，并分析了问题产生的原因，后文通过对策标志词“需”强调应根据社区实际配置食堂，避免浪费公共资金，最后通过“也”表达并列，指出经营者要有市场化竞争意识，故整个文段为背景铺垫+提出问题+解决问题的结构，重点强调经营社区食堂的并列两方面的对策，即社区食堂的经营既要避免浪费公共资金，对应B项中的“公益”，也要有市场化竞争意识，对应B项中的“效益”，二者统筹兼顾，对应B项。\nA项，仅强调社区食堂的重要性，并非围绕社区食堂的经营困难提出对策，偏离文段中心，排除；\nC项，“创新社区食堂运营新模式”表述过于宽泛，不及B项对应准确，且文段并非仅论述“运营”时应如何做，还强调了在运营之前需要做好前期的科学布局，排除；\nD项，“办好食堂”表述不明确，文段已经给出“既要避免浪费公共资金，也要有市场化竞争意识”的具体措施，排除。\n故正确答案为B。\n【文段出处】经济日报《统筹社区食堂“公益”与“效益”》","no":45,"missingImage":false},{"type":"question","qid":"10204464","cat":"片段阅读","stem":"随着大数据、物联网、云计算等现代智能技术的发展，人类社会进入了智慧治理时代。智慧治理对于推进国家治理体系和治理能力现代化具有重要现实意义。当前正在推进的智慧治理面临治理效率低下、数据信息安全存隐患等困境和风险。对智慧治理面临新任务新期待的理论认识不足、主动适应不够，以及过度依赖智能技术对智慧治理的定位不准是导致困境和风险的重要原因。解决智慧治理中存在的问题，需要实现从智能技术赋能到技术融合的转变，理念融合、过程融合及目标融合是实现这一转变的重要路径。\n假如这是一篇文章的摘要，那么这篇文章的标题可能是：","options":{"A":"迈向技术融合的智慧治理","B":"理论认识不足制约智慧治理","C":"智能技术赋能的智慧治理路径","D":"智慧治理存在的问题及成因分析"},"answer":"A","explanation":"本题为标题填入题，需要把握文段中心。文段开篇交代背景，介绍人类社会进入了智慧治理时代。接着引出智慧治理具有重要现实意义。随后，文段具体介绍了智慧治理存在的一些问题并分析原因。文段最后通过“需要”提出对策，强调从智能技术赋能到技术融合的转变可以解决智慧治理中存在的问题。故文段重在强调智慧治理中的问题需要通过技术融合来解决，对应A项。\nB项，“制约智慧治理”为问题表述，非重点，排除；\nC项，“治理路径”表述不明确，且“智能技术赋能”为文段非重点内容，文段重点强调的对策为“技术融合”，排除；\nD项，“问题及成因分析”为对策前内容，非重点，排除。\n故正确答案为A。\n【文段出处】中文期刊-掌桥科研《迈向技术融合的智慧治理》","no":46,"missingImage":false},{"type":"question","qid":"16593212","cat":"语句表达","stem":"在确定是否认识一个人时，我们的大脑会做出三个反应。首先，我们会确认这个人的面部特征，例如他是双眼皮还是单眼皮，高鼻梁还是薄嘴唇；之后，大脑根据这些特征进行人脸识别，判定我们是否认得这张脸；最后再回忆他的名字。简而言之，我们在看到一张脸后，大脑只需简单地识别是否见过；而人的名字藏在记忆的某个角落，我们需要通过检索、回忆等过程，才能最终确定答案，比识别更加复杂。所以                    。\n填入画横线部分最合适的一项是：","options":{"A":"大脑确定是否认识一个人的过程非常地复杂","B":"记住一个人的名字比记住他的长相要难得多","C":"大脑根据一个人的面部特征来回忆他的名字","D":"记忆名字需要与对词语、句子的记忆相联系"},"answer":"B","explanation":"横线位于文段结尾，且横线前出现“所以”，所填句子应对前文内容进行总结。文段开篇指出，我们确定是否认识一个人时，大脑会有三个反应，接下来通过“首先”“之后”和“最后”对三个反应进行具体解释说明。随后通过“简而言之”进行总结，并通过“；”引导并列，指出我们看到一张脸时，大脑是简单识别，而人的名字需要检索、回忆等复杂过程。故横线处所填句子应对“记住名字”和“识别长相”之间的难度对比进行总结，即记住名字比记住长相更复杂、更难，对应B项。\nA项，“是否认识一个人”对应文段首句内容，与“简而言之”总结后论述的话题无法衔接，排除；\nC项，“根据一个人的面部特征来回忆他的名字”前文并未论述，无法衔接，排除；\nD项，“与对词语、句子的记忆相联系”文段并未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】今日文摘《名字和脸，哪个更好记》","no":47,"missingImage":false},{"type":"question","qid":"16593219","cat":"语句表达","stem":"众多民间手艺、戏曲等非物质文化遗产的遗失，与文化传承人缺乏丰厚的收入有关。即便以外部力量进行保护性抢救，往往也只是将其“标本化”，难以恢复其原生活力。                    。比如，《中国通史》等纪录片在视频平台上收费观看，使传统文化释放出可观的商业价值，纪录片创作方、版权方、播出方实现商业共赢；有花丝镶嵌技艺非遗传承人入驻电商平台，一年多来售出超20万件工艺产品。\n填入画横线部分最恰当的一项是：","options":{"A":"文化产业在新的发展能量集聚下将释放出更多精彩","B":"正是对传统文化的创新演绎成就了文化产业的发展","C":"只有新媒体技术的加持，才能推动传统文化的传播","D":"只有文化消费市场活跃，传统文化创作才能有动力"},"answer":"D","explanation":"横线出现在文段中间，需结合前后文内容进行分析。文段开篇指出部分非物质文化遗产的遗失与文化传承人缺乏丰厚的收入有关，接着指出通过外部力量难以恢复其原生活力。横线后通过“比如”进行举例论证，分别以“《中国通史》”“花丝镶嵌技艺”为例，论证“收费观看”“释放商业价值”“实现商业共赢”“入驻电商平台”等一系列举措对于拯救非遗起到的重要作用。故前后文围绕“收入”“收费”“经济价值”进行论述，此类话题均可体现出经济效益的含义，故横线处所填内容需包含核心话题“经济效益”，对应D项“文化消费市场活跃”，且“只有······才······”的句式也体现出文化消费市场的活跃对于拯救非遗至关重要，与前后文衔接恰当。\nA项“新的发展能量”、B项“创新演绎”、C项“新媒体技术”均与“收入”“经济效益”等核心话题无关，排除。\n故正确答案为D。\n【文段出处】光明日报《用数字技术为优秀传统文化赋新能》","no":48,"missingImage":false},{"type":"question","qid":"10204466","cat":"语句表达","stem":"①他们认为成绩不好是老师和父母的责任，遇事不愿主动解决而是更多地选择抱怨\n②究其原因，就是孩子和家长有效沟通后，孩子能明白自己的行为会导致什么样的后果\n③有研究显示，规则有助于孩子的健康发展\n④那些家里规则清楚、始终保持一致且合理可执行的孩子，对自己的学习能力更有信心，成绩也较为优秀\n⑤而那些生活在规则意识不清且标准不稳定的、父母情绪易怒、高控制感、指责型家庭的孩子，更加自卑胆小\n⑥这样有助于他们学会调整自己的行为并给自己制定目标\n将以上六个句子重新排列，语序正确的一项是：","options":{"A":"④②⑥⑤①③","B":"③④⑥②①⑤","C":"③②⑥④①⑤","D":"③④②⑥⑤①"},"answer":"D","explanation":"对比选项，确定首句。④句指出家里规则清楚的孩子在学习方面具有优势，③句指出规则有助于孩子的发展，根据逻辑顺序，应先引出话题，再论述这一话题的具体作用，故③句应在④句之前，排除A项，保留B、C、D三项。\n继续分析所给语句，①句出现指代词“他们”，强调这部分人认为成绩不好是老师和父母的责任，这部分人身上存在消极表现。结合选项分析，①句前分别为②④⑤三句。⑤句说明生活在规则意识不清的家庭的孩子更加自卑胆小，可与①句构成指代词捆绑，D项当选。②句指出孩子与家长沟通的积极影响，④句论述家里规则清楚的孩子的优秀表现，均无法与①句构成指代词捆绑，排除B、C两项。\n故正确答案为D。\n【文段出处】光明网《亲子对话：从操控指责到信息引导》","no":49,"missingImage":false},{"type":"question","qid":"10204476","cat":"语句表达","stem":"①它们不仅记录了长江历年的水文资料，而且具有很高的文学艺术价值\n②为配合三峡水库的建设，我国水下考古工作者已分别对白鹤梁、龙脊石进行了水下调查\n③因长江水位变迁，“丰年碑”已完全没于水下不得见\n④位于重庆朝天门码头的“丰年碑”、涪陵白鹤梁历代题刻、云阳龙脊石题刻被称为长江中游的三大石刻碑群\n⑤白鹤梁题刻保存完好，被誉为世界“第一古代水文站”和世界罕见的“水下碑林”，是长江三峡水库淹没区内最早被定为“全国重点文物保护单位”的遗址\n⑥在水下考古调查研究基础上设计建造的白鹤梁水下博物馆，独具中国特色，成为联合国教科文组织面向全球推广的经典案例\n将以上6句重新排列，语序正确的是：","options":{"A":"④③⑤②⑥①","B":"④①③②⑤⑥","C":"⑤③②⑥④①","D":"⑤④③①②⑥"},"answer":"B","explanation":"对比选项，确定首句。首句分别为④句和⑤句，④句指出“‘丰年碑’、涪陵白鹤梁历代题刻、云阳龙脊石题刻被称为长江中游的三大石刻碑群”，⑤句具体论述“白鹤梁题刻”，按照行文逻辑，应先引出“三大石刻碑群”这一话题，然后再针对其中之一的白鹤梁题刻展开论述，故④句应在⑤句之前，④句更适合作首句，排除C、D两项。\n继续观察文段，①句出现指代词“它们”，应指代多个对象，对比A、B两项，①句前分别是④句和⑥句，④句引出“三大石刻碑群”这一话题，可作为①句“它们”的指代对象，故④①两句可以构成捆绑，B项当选。⑥句介绍了“白鹤梁水下博物馆”的情况，只出现一个对象，与①句无法构成捆绑，排除A项。\n故正确答案为B。\n【文段出处】光明日报《发展中的中国水下考古》","no":50,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"16593101","cat":"数学运算","stem":"王师傅加工零件，他可同时操作4台仪器对零件进行抛光，每个零件需2面抛光才能加工完成，抛光1面需2分钟，问6个零件最少用多少分钟才能加工完成（换零件时间不计）？","options":{"A":"5","B":"6","C":"7","D":"8"},"answer":"B","explanation":"根据题意，6个零件共需抛光6×2=12面，4台仪器同时工作，每次共抛光4面，耗时2分钟。至少需要抛光12÷4=3次，即最少用2×3=6分钟加工完成。\n故正确答案为B。","no":51,"missingImage":false},{"type":"question","qid":"10204486","cat":"数学运算","stem":"甲、乙两工厂共同完成某个生产订单需要12天。现两工厂共同生产8天后，再由乙单独生产7天，一共完成了订单总量的90%。若整个订单由乙单独生产，那么需要多少天完成？","options":{"A":"20","B":"23","C":"26","D":"30"},"answer":"D","explanation":"根据题意，甲、乙两工厂的工作效率满足：8（甲+乙）+7乙=12（甲+乙）×90%，整理可得甲、乙两工厂的工作效率之比为3：2。赋值甲的工作效率为3，乙的工作效率为2，则该订单的工作总量为12×（3+2）=60，故所求为\u003cimg data-k=\"26d178b1f022\">天。\n故正确答案为D。","no":52,"missingImage":false},{"type":"question","qid":"16593105","cat":"数学运算","stem":"某单位从所有职工中选出若干人参加培训，如果选择4人，可能的选择方式正好是选择3人时的10倍，问该单位有多少名职工？","options":{"A":"32","B":"33","C":"42","D":"43"},"answer":"D","explanation":"设该单位有x名职工，根据题意可知：\u003cimg data-k=\"5b09388d2223\">，即\u003cimg data-k=\"c2cb5e98c63b\">，解得x=43。\n故正确答案为D。","no":53,"missingImage":false},{"type":"question","qid":"16191092","cat":"数学运算","stem":"一块长方形田地 BCDE如下图所BC=40米，BE=30米……现从D点出发经A点达 BE边，最短路程为多少米?","options":{"A":"\u003cimg data-k=\"a5cad23d2391\">","B":"\u003cimg data-k=\"a5371f5d2cad\">","C":"\u003cimg data-k=\"2f8fed8a64ce\">","D":"\u003cimg data-k=\"fcc705aafc59\">"},"answer":"C","explanation":"略。","no":54,"missingImage":false},{"type":"question","qid":"16593107","cat":"数学运算","stem":"从甲地到乙地的全价机票为2000元，购买全价或折扣机票，每张都要支付120元税费，从甲地到乙地的高铁票价为680元，企业要安排20人当日从甲地前往乙地出差，单程总预算不超过2万元，已知当日高铁票、机票都充足，2折、3折和5折机票分别还剩余2张、3张和5张，其余为全价机票，问在预算范围内最多能安排多少人乘飞机前往乙地？","options":{"A":"11","B":"12","C":"13","D":"14"},"answer":"C","explanation":"题干要求预算范围内安排乘飞机前往乙地的人数最多，结合选项可知乘飞机的人数大于折扣机票的剩余张数2+3+5=10张，则题干中的折扣机票应全部购买，购买折扣机票的费用为2000×0.2×2+2000×0.3×3+2000×0.5×5+120×10=8800元；设购买全价机票的人数为n人，根据题意可列方程：\u003cimg data-k=\"4bbe3fbe5d4c\">，解得\u003cimg data-k=\"8fb5e7e5a86b\">，则n=3人。故在预算范围内最多能安排乘飞机前往乙地的人数为10+3=13人。\n故正确答案为C。","no":55,"missingImage":false},{"type":"question","qid":"16593097","cat":"数学运算","stem":"商店销售甲、乙、丙、丁四种商品，每件分别盈利15元、9元、4元和1元。某日销售这四种商品共40件，共盈利201元。四种商品每种至少销售1件，且甲、丁商品销量相同。问当天丙商品的销量为多少件？","options":{"A":"21","B":"27","C":"29","D":"31"},"answer":"D","explanation":"根据“甲、丁商品销量相同”，设甲、乙、丙、丁四种商品销量分别为x件、y件、z件、x件。根据“这四种商品共40件”可得，2x+y+z=40······①；根据“共盈利201元”可得，15x+9y+4z+x=201······②。令①×8-②可消去x，得4z-y=119。因为四种商品每种至少销售1件，可得4z＞119，即\u003cimg data-k=\"f06f1a77e51c\">，排除A、B、C三项。代入D项验证，若z=31，则y=4z-119=124-119=5，2x=40-31-5=4，x=2，符合题干所有条件。\n故正确答案为D。","no":56,"missingImage":false},{"type":"question","qid":"16593094","cat":"数学运算","stem":"高校管理学院某期培训班有不到100名学员参加，期中、期末两次考试平均分分别为68分和75分，期中考试不及格学员平均分为53分，及格学员平均分为74分；期末考试不及格学员平均分为47分、及格学员平均分为83分。问这期培训班有多少名学员参加？","options":{"A":"42","B":"54","C":"63","D":"77"},"answer":"C","explanation":"方法一：设该期培训班期中考试及格人数和不及格人数分别为x、y人，期末考试及格人数和不及格人数分别为a、b人，根据题意可知，期中考试总成绩为74x+53y=68（x+y），化简可得2x=5y，所以\u003cimg data-k=\"33912c9fa4a5\">，则总人数x+y为7的倍数；期末考试总成绩为83a+47b=75（a+b），化简可得2a=7b，所以\u003cimg data-k=\"e35d55eadfdd\">，则总人数a+b为9的倍数。综上，总人数为7和9的公倍数，即为63的倍数，结合总人数不到100人，则总人数为63人。\n故正确答案为C。\n方法二：由期中考试不及格学员平均分为53分，及格学员平均分为74分，期中考试平均分为68分，根据线段法口诀“距离与量成反比”可得，\u003cimg data-k=\"8faca91b5efa\">，解得\u003cimg data-k=\"abd2a85d2f7f\">，则总人数为7的倍数；由期末考试不及格学员平均分为47分、及格学员平均分为83分，期末考试平均分为75分，根据线段法口诀“距离与量成反比”可得，\u003cimg data-k=\"3c1c6cf3168b\">，解得\u003cimg data-k=\"1faacd4fbdbd\">，则总人数为9的倍数。综上，总人数为7和9的公倍数，即为63的倍数，结合总人数不到100人，则总人数为63人。\n\u003cimg data-k=\"edfb06f0206b\" style=\"max-width:615px\">\n故正确答案为C。","no":57,"missingImage":false},{"type":"question","qid":"16593095","cat":"数学运算","stem":"企业将12个技术培训名额分配给甲、乙、丙三个研发团队。要求乙团队分配的培训名额比甲团队少，但比丙团队多，且每个团队至少分配1个名额。问有多少种不同的分配方式？","options":{"A":"6","B":"7","C":"36","D":"42"},"answer":"B","explanation":"根据题干条件，各团队分配的培训名额甲&gt;乙&gt;丙，采用枚举法，情况如下：\n\u003cimg data-k=\"ea61931c999c\" style=\"max-width:488px\">\n由上表可知，共有7种不同的分配方式。\n故正确答案为B。","no":58,"missingImage":false},{"type":"question","qid":"16593102","cat":"数学运算","stem":"某校园围墙外的道路形成一个边长为300米的正方形（如图所示），甲、乙两人分别从正方形的两个对角沿逆时针方向同时出发，甲、乙的步行速度比为9：7。问甲、乙两人第一次处于同一条边是在哪一条边上？\n\u003cimg data-k=\"2a0562a3b91a\" style=\"max-width:218px\">","options":{"A":"AB","B":"BC","C":"CD","D":"DA"},"answer":"D","explanation":"根据题意，设甲的速度为9v，则乙的速度为7v。甲、乙初始路程差为CD+DA=300+300=600米，若甲、乙两人第一次处于同一条边，即两人路程差\u003cimg data-k=\"6f55705804e3\">米。根据追及公式：\u003cimg data-k=\"1c726a1bc11a\">，当甲与乙相差300米时，可列式：300=（9v-7v）×t，解得vt=150，则此时甲所走路程=9v×t=1350米（走完一圈300×4=1200米多150米），甲在CD中点；此时乙所走路程=7v×t=1050米（还差150米走完一圈），乙在DA中点。因\u003cimg data-k=\"46c547e605cc\">，故当甲到达D点时，乙未到达A
