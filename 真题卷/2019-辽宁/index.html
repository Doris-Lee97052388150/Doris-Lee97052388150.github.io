<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2019-辽宁","title":"2019年辽宁省公务员录用考试《行测》题（网友回忆版）","year":"2019","group":"辽宁","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2443010","cat":"时事政治","stem":"中共中央、国务院于2019年1月8日在北京隆重举行国家科学技术奖励大会。习近平总书记向获得2018年度国家最高科学技术奖的        颁发奖励证书。","options":{"A":"王泽山院士和侯云德院士","B":"赵玉芬院士和钟南山院士","C":"王泽山院士和施一公院士","D":"刘永坦院士和钱七虎院士"},"answer":"D","explanation":"本题考查政治常识。\nA项错误，王泽山院士和侯云德院士是2017年度国家最高科学技术奖获得者。\nB项错误，赵玉芬院士是著名的有机化学家，但没有获得过国家最高科学技术奖；钟南山院士是著名呼吸病学专家，但没有获得过国家最高科学技术奖。\nC项错误，施一公院士是闻名世界的结构生物学家，但没有获得过国家最高科学技术奖。\nD项正确，2018年度国家科学技术奖励大会于2019年1月8日在人民大会堂举行。哈尔滨工业大学刘永坦院士，中国人民解放军陆军工程大学钱七虎院士分获国家最高科学技术奖。刘永坦院士是我国著名的雷达与信号处理技术专家，我国对海探测新体制雷达理论奠基人，对海远程探测技术跨越发展的引领者；钱七虎院士是我国著名的防护工程学家，现代防护工程理论的奠基人、防护工程学科的创立者、防护工程科技创新的引领者，为我国防护工程各个时期的建设发展做出了杰出贡献。\n故正确答案为D。","no":1,"missingImage":false}],"count":1,"answerable":1,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2443005","cat":"人文常识","stem":"中共中央、国务院、中央军委颁发了“庆祝中华人民共和国成立70周年”纪念章。下述对象中不符合纪念章颁发条件的人员是：","options":{"A":"中华人民共和国成立前参加革命工作的、健在的老战士老同志","B":"中华人民共和国成立后获得国家级表彰奖励及以上荣誉并健在的人员","C":"中华人民共和国成立后因参战荣立特等功以上奖励并健在的军队人员（含退役军人）","D":"为中华人民共和国成立作出杰出贡献的国际友人"},"answer":"C","explanation":"本题考查政治常识。\n为庆祝中华人民共和国成立70周年，中共中央、国务院、中央军委将于2019年8月29日颁发“庆祝中华人民共和国成立70周年”纪念章。“庆祝中华人民共和国成立70周年”纪念章颁发给下述对象中符合条件的人员：中华人民共和国成立前参加革命工作的、健在的老战士老同志；中华人民共和国成立后获得国家级表彰奖励及以上荣誉并健在的人员；中华人民共和国成立后因参战荣立一等功以上奖励并健在的军队人员（含退役军人）；为中华人民共和国成立作出杰出贡献的国际友人。此题出题不严谨，C项“特等功”也属于“一等功以上”，但只有C项与官方描述不一致，故选C。\n本题为选非题，故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"2443008","cat":"科技常识","stem":"为了纪念1970年4月24日我国成功发射了第一颗人造地球卫星——“东方红”1号，2016年3月8日，国务院将每年4月24日设立为“中国航天日”。2019年中国航天日主题是：","options":{"A":"“逐梦航天合作共赢”","B":"“共筑航天新时代”","C":"“航天创造美好生活”","D":"“中国梦 航天梦”"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，2019年4月24日，第四个“中国航天日”，以“逐梦航天，合作共赢”为主题的主场活动在湖南长沙举行，首次重磅发布了中国空间站的最新研制进展。\nB项错误，2018年“中国航天日”主场活动在哈尔滨工业大学开幕，此次“中国航天日”的主题是“共筑航天新时代”。\nC项错误，“航天创造美好生活”是2017年“中国航天日”的主题。 \nD项错误，2016年3月8日，国务院批复同意将每年4月24日设立为“中国航天日”。首个中国航天日的主题为“中国梦，航天梦”。\n故正确答案为A。","no":3,"missingImage":false},{"type":"question","qid":"2443013","cat":"法律常识","stem":"关于信访，下列说法正确的是：","options":{"A":"某县质监局不设立专门的信访工作机构，违反了信访规定","B":"陈某对乡政府的决定不服，可以采用走访形式到市政府提出信访请求","C":"詹某在提出信访事项时故意捏造歪曲事实，诬告陷害他人，应依法追究其刑事责任","D":"钱某对区政府作出的信访事项处理意见不服，可以请求市政府复查"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，《信访工作条例》第十四条规定：“各级党委和政府信访部门是开展信访工作的专门机构，履行下列职责：······”因此，信访工作的专门机构只在各级党委和政府设立，并非在政府的工作部门设立。\nB项错误，《信访工作条例》第二十条第一款规定：“信访人采用走访形式提出信访事项的，应当到有权处理的本级或者上一级机关、单位设立或者指定的接待场所提出。”题中，陈某应向乡政府或县政府提出信访请求，而不能直接向市政府提出。\nC项错误，《信访工作条例》第四十七条第三款规定：“信访人捏造歪曲事实、诬告陷害他人，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。”詹某的行为只有构成犯罪才应被追究刑事责任，C项说法太过绝对。\nD项正确，《信访工作条例》第三十五条规定：“信访人对信访处理意见不服的，可以自收到书面答复之日起30日内请求原办理机关、单位的上一级机关、单位复查。收到复查请求的机关、单位应当自收到复查请求之日起30日内提出复查意见，并予以书面答复。”钱某对区政府的处理意见不服可以请求区政府的上一级机关市政府复查。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"2443014","cat":"法律常识","stem":"关于刑事责任的追究，下列表述错误的是：","options":{"A":"犯罪嫌疑人关某在被抓获前自杀身亡，依法不追究其刑事责任","B":"外国商人保罗在我国领域内犯抢劫罪，适用我国刑法追究其刑事责任","C":"某国公民大卫在搭乘中国飞机时，盗窃他人财物，不能依据我国刑法追究其刑事责任","D":"苏某非法侵占顾某的财产，被害人顾某没有起诉，则依法不追究苏某刑事责任"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《刑事诉讼法》第十六条规定：“有下列情形之一的，不追究刑事责任，已经追究的，应当撤销案件，或者不起诉，或者终止审理，或者宣告无罪：(一)情节显著轻微、危害不大，不认为是犯罪的；(二)犯罪已过追诉时效期限的；(三)经特赦令免除刑罚的；(四)依照刑法告诉才处理的犯罪，没有告诉或者撤回告诉的；（五)犯罪嫌疑人、被告人死亡的；(六)其他法律规定免予追究刑事责任的。”\nB项正确，根据《刑法》第六条规定：“凡在中华人民共和国领域内犯罪的，除法律有特别规定的以外，都适用本法。”\nC项错误，根据《刑法》第六条规定：“凡在中华人民共和国领域内犯罪的，除法律有特别规定的以外，都适用本法。凡在中华人民共和国船舶或者航空器内犯罪的，也适用本法。犯罪的行为或者结果有一项发生在中华人民共和国领域内的，就认为是在中华人民共和国领域内犯罪。”外国人在中国飞机上盗窃，适用我国刑法。\nD项正确，《刑法》第二百七十条规定：“将代为保管的他人财物非法占为己有，数额较大，拒不退还的，处二年以下有期徒刑、拘役或者罚金;数额巨大或者有其他严重情节的，处二年以上五年以下有期徒刑，并处罚金。将他人的遗忘物或者埋藏物非法占为己有，数额较大，拒不交出的，依照前款的规定处罚。本条罪，告诉的才处理。”\n本题为选非题，故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"2443018","cat":"科技常识","stem":"建国以来，我国在科技方面取得了瞩目的成就，下面的表述错误的是：","options":{"A":"“天鲲号”是首艘由我国自主设计建造的亚洲最大自航绞吸挖泥船","B":"“嫦娥四号”探测器的发射，在人类历史上首次实现了航天器在月球背面软着陆","C":"“蛟龙号”是我国首艘载人潜水器支持母船","D":"“雪龙2号”是我国第一艘自主建造的极地科学考察破冰船"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，“天鲲号”绞吸挖泥船是由中国船舶工业集团公司第708所设计，上海振华重工集团启东公司建造的新一代重型自航绞吸挖泥船，是首艘由我国自主设计建造的目前亚洲最大、最先进的自航绞吸挖泥船，也是目前世界上智能化水平最高的自航绞吸船。\nB项正确，2019年1月3日上午10点26分，“嫦娥四号”探测器成功软着陆在月球背面的南极-艾特肯盆地冯卡门撞击坑，这是人类历史上首次实现了航天器在月球背面软着陆。\nC项错误，2018年12月8日，我国首艘载人潜水器支持母船“深海一号”在武汉下水。作为我国7000米级“蛟龙号”载人潜水器专用母船，“深海一号”建成后可以充分发挥“蛟龙号”的技术性能，显著提升我国精细探索大洋资源环境的能力与水平。“蛟龙号”是我国自行设计、自主集成研制的载人潜水器。\nD项正确，2019年7月11日，我国第一艘自主建造的极地科学考察破冰船——“雪龙2”号在上海顺利交付。“雪龙2”号极地科学考察破冰船，采用国际先进的船艏船艉双向破冰船型设计，能以2—3节的航速在冰厚1.5米+雪厚0.2米的条件下连续破冰航行，具备全回转电力推进功能和冲撞破冰能力，可实现极区原地360°自由转动，并突破极区20米当年冰冰脊。\n本题为选非题，故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"2443021","cat":"经济常识","stem":"下列不属于我国在经济疲软时期应该采取的财政政策的是：","options":{"A":"扩大政府开支，增加预算支出规模","B":"降低税收，增加人均可支配收入","C":"降低央行再贴现率","D":"增加政府公债购买规模"},"answer":"C","explanation":"本题考查经济常识。\n财政政策是指国家根据一定时期政治、经济、社会发展的任务而规定的财政工作的指导原则，通过财政支出与税收政策来调节总需求。\nA项正确，扩大政府支出，可以刺激总需求，从而增加国民收入。\nB项正确，降低税收，可以刺激消费，从而增加国民收入。\nC项错误，调整再贴现率属于货币政策。降低再贴现率意味着商业银行向中央银行贷款的成本降低，从而增加了货币投放，直接增加货币供给量，从而刺激消费。\nD项正确，增加政府公债购买规模可以刺激消费，从而增加国民收入。\n本题为选非题，故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"2443025","cat":"人文常识","stem":"下列成语与其蕴含的经济学原理对应错误的是：","options":{"A":"覆水难收——沉没成本","B":"镜花水月——泡沫经济","C":"洛阳纸贵——供给需求","D":"他山之石——风险评估"},"answer":"D","explanation":"本题考查经济常识。\nA项正确，沉没成本是指已经付出了并且不能收回的成本。覆水难收的意思是：倒在地上的水难以收回；比喻事情已成定局，无法挽回。“倒在地上的水”都是已经发生的并且无法收回的，属于沉没成本。因此，“覆水难收”对应沉没资本。\nB项正确，泡沫经济是指资产价值超越实体经济，极易丧失持续发展能力的宏观经济状态。由于缺乏实体经济的支撑，因此其资产犹如泡沫一般容易破裂。镜花水月的意思是：镜子里的花、水中的月亮；比喻虚幻的景象。“镜子里的花、水中的月亮”都是虚而不实的。因此，“镜花水月”对应泡沫经济。\nC项正确，洛阳纸贵是指西晋都城洛阳之纸因大家争相传抄左思的作品《三都赋》，以至于一时之间供不应求，货缺而贵。“纸贵”的原因是由于消费者的需求量增大，而市场的供给小于需求，因此，“洛阳纸贵”对应供给需求。\nD项错误，风险评估是指量化测评某一事件或事物带来的影响或损失的可能程度。他山之石的意思是：比喻能帮助自己改正缺点的人或意见。与“风险评估”没有对应关系。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"2443028","cat":"人文常识","stem":"中国传统文化历来注重含蓄之美，古典诗词文学中更是经常使用典故来表情达意，下列有关典故对应错误的是：","options":{"A":"还珠——比喻官吏为政清廉——今日还珠守，何年执戟郎（唐·杜牧）","B":"尺素——代书信——欲寄彩笺兼尺素，山长水阔知何处（宋·张先）","C":"抱柱——比喻坚守信约——常存抱柱信，岂上望夫台（唐·李白）","D":"画眉——指喜欢——妆罢低声向夫婿，画眉深浅入时无（唐·朱庆馀）"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，还珠，形容为政清廉、政绩卓著。古时合浦盛产珍珠，因太守的贪婪，珍珠都转到别的地方。孟尝任太守后，革除贪污流弊，珍珠又回到合浦来了。故以“还珠”喻官吏为政清廉。唐代诗人杜牧创作了一首五言古诗《春日言怀寄虢州李常侍十韵》，“今日还珠守，何年执戟郎”出自该诗。\nB项错误，尺素，小幅的丝织物，如绢、帛等，代指书信，“欲寄彩笺兼尺素，山长水阔知何处”出自宋代词人晏殊的《蝶恋花•槛菊愁烟兰泣露》。\nC项正确，抱柱，指坚守信约，相传古代书生同一女子相约在桥下见面。他等了很久，不见女子到来，这时河水猛涨，淹没桥梁，书生为了坚守信约，不肯离去，抱住桥柱，淹死在水里。“常存抱柱信，岂上望夫台”出自唐代诗人李白的《长干行》。\nD项正确，画眉，是古代妇女的一种面饰风俗，使得女子眉目清晰，旧时常有夫婿替妻子画眉，表示对妻子的喜欢，也比喻夫妻感情好。“妆罢低声问夫婿，画眉深浅入时无”出自唐代诗人朱庆馀的《近试上张水部》。\n本题为选非题，故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"2443032","cat":"人文常识","stem":"下列诗词中，属于陆游作品的有：\n①《早发白帝城》\n②《示儿》\n③《登幽州台歌》\n④《书愤》","options":{"A":"①②","B":"②③","C":"②④","D":"③④"},"answer":"C","explanation":"本题考查人文常识。\n①错误，《早发白帝城》是唐代伟大诗人李白在流放途中遇赦返回时所创作的一首七言绝句。此诗是李白诗作中流传最广的名篇之一。诗人是把遇赦后愉快的心情和江山的壮丽多姿、顺水行舟的流畅轻快融为一体来表达的。\n②正确，《示儿》是宋代诗人陆游创作的一首七言绝句，是诗人的绝笔。此诗传达出诗人临终时复杂的思想情绪和忧国忧民的爱国情怀，表现了诗人一生的心愿，倾注了诗人满腔的悲慨，既有对抗金大业未就的无穷遗恨，也有对神圣事业必成的坚定信念。\n③错误，《登幽州台歌》是唐代诗人陈子昂在初唐时期创作的一首五言古诗。此诗是一首吊古伤今的生命悲歌，表现诗人孤独遗世、独立苍茫的落寞情怀。\n④正确，《书愤》是南宋诗人陆游创作的一首七言律诗。这首诗展现自己青壮年时期的豪情壮志和战斗生活情景，抒发了壮心未遂、时光虚掷、功业难成的悲愤之气，但悲愤而又不感伤颓废。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"2443035","cat":"人文常识","stem":"对中国字画的落款，下列表述错误的是：","options":{"A":"惠存：是送给集体单位的","B":"斧正：表示“请指导”的意思","C":"清赏：表示这件作品供对方赏玩而已","D":"俪正：指送给爱慕的人"},"answer":"D","explanation":"本题考查人文常识。\nA项正确，“惠”用于对方对待自己的行动，在我国书画作品落款中，“惠存”多在给单位的作品中题写，指作品是赠给集体单位的。\nB项正确，“斧正”意为请对方像匠人一样用斧头削正，表示“请指导”的意思。\nC项正确，“清赏”意为清标可赏，表示这件作品供对方赏玩而已。\nD项错误，“俪”者，伉俪也。“俪正”是指对方夫妇都是行家，请一起指正，而不是指送给爱慕的人。\n本题为选非题，故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"2443037","cat":"人文常识","stem":"下列名言与其作者对应正确的是：","options":{"A":"春蚕到死丝方尽，蜡炬成灰泪始干——屈原","B":"孤帆远影碧空尽，唯见长江天际流——杜甫","C":"路漫漫其修远兮，吾将上下而求索——李商隐","D":"勤能补拙是良训，一分辛苦一分才——华罗庚"},"answer":"D","explanation":"本题考查人文常识。\nA项错误，“春蚕到死丝方尽，蜡炬成灰泪始干”出自唐代诗人李商隐的《无题》，表现了自己对于对方的思念，如同春蚕吐丝，到死方休。“蜡炬成灰泪始干”则比喻自己为不能相聚而痛苦，无尽无休，仿佛蜡泪直到蜡烛烧成了灰方始流尽一样。\nB项错误，“孤帆远影碧空尽，唯见长江天际流”出自唐代诗人李白的《黄鹤楼送孟浩然之广陵》。诗人巧妙地将依依惜别的深情寄托在对自然景物的动态描写之中，将情与景完全交融在一起。\nC项错误，“路漫漫其修远兮，吾将上下而求索”出自屈原的《离骚》。意为道路又窄又长无边无际，但我要努力寻找心中的太阳，表现了诗人志在百折不挠的去寻找理想中的人生之道。\nD项正确，“勤能补拙是良训，一分辛苦一分才”是华罗庚先生的名句，也是他的亲身经历。意为勤奋能够弥补自身的不足，这是前人留下的有益的训诫，只要付出一分辛苦，就能增长一分才能。\n故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"2443040","cat":"人文常识","stem":"中国古代有：“吾日三省吾身”；“道虽迩，不行不至；事虽小，不为不成”；“身体力行”等思想。这些都表达了在进行道德修养时应该：","options":{"A":"省察克治，勤于实践","B":"慎独自律，遵守道德规范","C":"知行合一，完善道德品质","D":"学思结合，加强道德行为训练"},"answer":"A","explanation":"本题考查毛中特。\n“吾日三省吾身”出自《论语》“曾子曰：‘吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？’”这“三省”说了两个方面。一是修己，二是对人。对人要诚信，不欺人也不欺己。替人谋事要尽心，尽心才能不苟且。每日的“三省”是为了更好的实践。“道虽迩，不行不至；事虽小，不为不成。”出自《荀子•修身》。意为路程即使很近，但不走就不能到达；事情即使很小，但不做就不能成功。告诉人们对待任何事情要去做、要有所行动。“身体力行”出自《淮南子•泛论训》：“圣人以身体之。”表示努力实践，亲身体验。题干强调的是行，即实践的重要性。\nA项正确，“省察克治”指每时每刻思考检查自己的思想言行是否符合道德要求，勤于实践。所以，A项正确，符合题意。\nB项错误，“慎独自律”是指一个人在无人监督的情况下，凭着高度自觉，按照道德规范去做事，没有任何有违法律或有悖道德的行为。所以，B项错误，不符合题意。\nC项错误，“知行合一”是由明朝思想家王守仁提出来的。指客体顺应主体，知是指良知，行是指人的实践，知与行的合一。所以，C项错误，不符合题意。\nD项错误，“学思结合”是孔子关于学习心理的观点。意谓在学习过程中把学与思辩证地结合起来。所以，D项错误，不符合题意。\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"2443045","cat":"科技常识","stem":"联合国将2019年定为“国际化学元素周期表年”。下列有关化学元素周期表的说法错误的是：","options":{"A":"元素周期表共有18列","B":"元素周期表是俄国化学家门捷列夫编制的","C":"今年是化学元素周期表创建150周年","D":"元素周期表中元素是按原子从大到小排列的"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，如下图所示，元素周期表共有18列。\n\u003cimg data-k=\"c963662a1d14\" style=\"max-width:521px\">\nB项、C项正确，化学元素周期表是科学界最重要的成就之一，1869年被认为是俄国化学家德米特里·门捷列夫发明元素周期表的一年，2019年则是元素周期表诞生的第150周年。\nD项错误，元素周期表是根据原子序数从小至大排序的化学元素列表，不是从大到小。在周期表中，元素是以元素的原子序数排列，最小的排行最先。表中一横行称为一个周期，一列称为一个族。原子半径由左到右依次减小，上到下依次增大。\n本题为选非题，故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"2443047","cat":"地理国情","stem":"关于中国四大高原，下列表述错误的是：","options":{"A":"青藏高原是世界最高的高原，平均海拔4000米以上，高原上，雪山、冰川很多，有“液体水库”之称","B":"内蒙古高原是中国第二大高原。它地面平坦，很多地方是一望无际的草原","C":"云贵高原地面高低不平，地势比较平坦的山间小盆地，被当地人称之为“坝子”","D":"黄土高原，位于中国中部偏北地区，是中华民族古代文明的发祥地之一"},"answer":"A","explanation":"本题考查地理国情。\nA项错误，青藏高原是世界上海拔最高的高原，平均海拔4000米以上，被称为“世界屋脊”、“第三极”。高原上，雪山、冰川很多，有“固体水库”之称\nB项正确，内蒙古高原是中国第二大高原，为蒙古高原的一部分。内蒙古高原地面平坦，中国重要的牧场，草原面积约占高原面积的\u003cimg data-k=\"cd4db1324e77\">，很多地方是一望无际的草原。\nC项正确，云贵高原多为喀斯特地貌,地面高低不平，高原上有众多地势平坦的山间盆地和宽谷，被当地人称为“坝子”，是水田集中和村镇密集的地方。\nD项正确，黄土高原位于我国中部偏北地区，是中华民族古代文明的发祥地之一，也是地球上分布最集中且面积最大的黄土区。无论古史传说、文献记载，还是考古发现，无论人文学者的考证，还是科学家的研究，均充分表明，黄土高原是中华文明形成、发展、成熟的最重要舞台，不同时期的文化、文明，几乎连续相继地出现在黄土高原。\n本题为选非题，故正确答案为A。","no":15,"missingImage":false},{"type":"question","qid":"2443049","cat":"人文常识","stem":"2019年8月2日，第十四届全运会吉祥物“秦岭四宝”正式亮相。“秦岭四宝”是指：","options":{"A":"朱鹮、大熊猫、羚牛、金丝猴","B":"扬子鳄、朱鹮、羚牛、金丝猴","C":"羚羊、大熊猫、丹顶鹤、金丝猴","D":"朱鹮、大熊猫、羚羊、中华鲟"},"answer":"A","explanation":"本题考查政治常识。\n2019年8月2日，第十四届全运会会徽和吉祥物在西安发布。以“秦岭四宝”朱鹮、大熊猫、羚牛、金丝猴为原型的卡通形象的“朱朱”“熊熊”“羚羚”“金金”为2021年第十四届全国运动会的吉祥物。\n朱鹮“朱朱”，手举火炬，展翅飞跑；大熊猫“熊熊”，张开双臂，热情奔放；羚牛“羚羚”，健壮憨萌，阔步向前；金丝猴“金金”，聪明智慧、灵动可爱。身着“富裕黄”“圣地红”“梦想蓝”“生态绿”运动装的吉祥物组合，分别寓意奔向新时代、喜迎八方客、同享新生活、共筑中国梦。\n故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"2443052","cat":"科技常识","stem":"有关生活小常识，下列表述错误的是：","options":{"A":"几乎所有瓜果蔬菜都含有一定量的维生素C","B":"地震时遇到化工厂着火、毒气泄漏，要尽量绕到上风方向，并用湿毛巾捂住口鼻","C":"果脯是世界卫生组织已经公布的全球十大垃圾食品之一","D":"被动物咬伤后必须在48小时内注射疫苗"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，维生素C主要来源是新鲜蔬菜与水果，正在急速生长的植物中维生素C含量高，几乎所有瓜果蔬菜都含有一定量的维生素C。\nB项正确，地震时遇到化工厂着火、毒气泄漏，要尽量逆风绕到上风方向，并用湿毛巾捂住口鼻，不要朝顺风方向跑。因为顺风会助长火势和毒气泄漏，湿毛巾捂住口鼻可以减少烟尘和有毒有害物质进入呼吸道，降低对人体的伤害。\nC项正确，果脯中含有亚硝酸盐，在人体内可结合胺形成潜在的致癌物质亚硝酸胺；含有香精等添加剂可能损害肝脏等脏器；含有较高盐分可能导致血压升高和肾脏负担加重。\nD项错误，根据《狂犬病暴露预防处置工作规范》第十条：“首次暴露后的狂犬病疫苗接种应当越早越好。接种程序:一般咬伤者于0(注射当天)、3、7、14和28天各注射狂犬病疫苗1个剂量。狂犬病疫苗不分体重和年龄，每针次均接种1个剂量。……”咬伤后应尽量于24小时内接种疫苗。\n世界卫生组织曾经辟谣“十大垃圾食品”的谣言。出题者可能并不知道已经被辟谣。此题为真题，因此不能修改其选项。C项虽有错，但果脯的确是不健康的食品，而D项的错误属于原则性的知识错误，因此粉笔倾向于选D。\n本题为选非题，故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"2443056","cat":"人文常识","stem":"“乳鸦啼散玉屏空，一枕新凉一扇风。睡起秋色无觅处，满阶梧桐月明中。”这首诗描述的是二十四节气中的：","options":{"A":"秋分","B":"白露","C":"立秋","D":"霜降"},"answer":"C","explanation":"本题考查人文常识。\n“乳鸦啼散玉屏空，一枕新凉一扇风。睡起秋色无觅处，满阶梧桐月明中。”是宋代文人刘翰所作的《立秋》，大意为“小乌鸦的鸣叫声散去时，只有玉色屏风空虚寂寞地立着。秋风吹来，顿觉枕边清新凉爽，就像有人在床边用绢扇在扇一样。睡梦中朦朦胧胧地听见外面秋风萧萧，可是醒来去找，却什么也找不到，只见落满台阶的梧桐叶，沐浴在朗朗的月光中。”立秋，是二十四节气中的第13个节气，更是秋天的第一个节气，从这一天开始，天高气爽，月明风清，气温逐渐下降。诗句中“一枕新凉一扇风”可知天气开始转凉，而“秋色无觅处”则说明秋天刚刚到来，可以判断诗句描述的是立秋这一节气。\n故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"2443058","cat":"人文常识","stem":"下列有关光的原理表达正确的是：","options":{"A":"星星闪烁——光的衍射","B":"下雨过后夜间亮者为水，暗者为陆——光的反射","C":"电影银幕——光的直线传播","D":"通过狭缝观察发光的日光灯时能看见彩色条纹——光的漫反射"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，光从一种介质斜射入另一种介质时，传播方向发生改变，从而使光线在不同介质的交界处发生偏折，这种现象叫做光的折射。地球的大气层由于分布不均匀，犹如层层透镜，射入其中的光线便会发生多次折射层层弯折。遥远的星光要到达我们的视野同样需要穿过大气层的多次折射和弯折。而且由于大气层（尤其是其中的对流层）非常不稳定，一直在无规则的湍动，经过弯折的星光会随之改变方向，因此我们观望星空时，看到的星光是闪烁的。所以星星闪烁是因为光的折射，不是光的衍射。\nB项正确，下雨过后，水面发生镜面反射，地面发生的是漫反射。夜间，当人迎着月光走路时，水面反射的较强月光刚好能进入人眼，而地面漫反射的月光射向各个方向，只有较少的一部分能进入人眼。因此，迎着月光走路时，较亮处是水，较暗处为陆地。\nC项错误，电影幕布是影院的硬件设施，投影机将映像投放到幕布上，观众直接从幕布上观看。为了使坐在不同位置上的人都能看到，电影银幕往往要用粗糙的白布制作。一方面，白色能反射所有颜色的光，使所看到的像更加逼真；另一方面，白布表面粗糙（不光滑）能产生漫反射，使光线向各个方向传播。因此应用的原理是光的漫反射，而不是光沿直线传播。\nD项错误，光波在遇到障碍物或通过狭缝时，会偏离直线传播路径，绕过障碍物边缘或狭缝边缘传播，这种现象称为光的衍射。通过狭缝观察发光的日光灯时能看见彩色条纹，主要是由于狭缝的宽度与光的波长相近或小于光的波长，从而发生了较为明显的衍射现象。因此，应用的原理主要是光的衍射，而非光的漫反射。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"2443062","cat":"人文常识","stem":"汉字产生的标志是殷商后期所形成的初步定型的甲骨文，其后经过了几千年的演变，形成了我们今天的文字。下列汉字演变过程的时间排序正确的是：","options":{"A":"隶书、小篆、楷书、行书","B":"小篆、隶书、行书、楷书","C":"小篆、隶书、楷书、行书","D":"楷书、小篆、行书、隶书"},"answer":"C","explanation":"本题考查人文常识相关知识。\n小篆是在秦始皇统一中国后，推行“书同文，车同轨”，统一度量衡的政策，由丞相李斯负责，在秦国原来使用的大篆的基础上，进行简化，取消其他的六国文字，创制了统一文字的汉字书写形式。\n隶书，由小篆演变而来，产生于秦，通行于汉，为后世楷书、草书、行书的产生和演变奠定了基础。字形多呈宽扁，横画长而竖画短，讲究“蚕头雁尾”、“一波三折”。\n楷书也叫正楷、真书、正书。出现于汉末，由隶书逐渐演变而来，魏晋南北朝时期通行，特点是横平竖直。\n行书，大约出现在西汉晩期和东汉初期。行书历经魏晋的黄金期、唐代的发展期后，在宋代达到了新的高峰，于各种书体中逐渐占居主流地位。它是为了弥补楷书的书写速度太慢和草书的难于辨认而产生，特点细若游丝。\n所以，汉字演变过程的时间排序正确的是小篆、隶书、楷书、行书。\n故正确答案为C。","no":20,"missingImage":false}],"count":19,"answerable":19,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2443053","cat":"逻辑填空","stem":"中国共产党的历史，就是一部党领导人民持续进行伟大社会革命的历史。习近平总书记指出：“新时代中国特色社会主义是我们党领导人民进行伟大社会革命的成果，也是我们党领导人民进行伟大社会革命的继续，必须            进行下去。”\n填入画横线部分最恰当的一项是：","options":{"A":"始终如一","B":"义无反顾","C":"勇往直前","D":"一以贯之"},"answer":"D","explanation":"由“中国共产党的历史，就是······持续进行伟大社会革命的历史”“进行伟大社会革命的继续”可知，横线处表达中国特色社会主义要沿着伟大社会革命继续进行下去，D项“一以贯之”强调用一个根本性的事理贯通事情的始末或全部的道理，这里指始终沿着伟大社会革命进行下去的，符合语境，当选。A项“始终如一”指自始至终一个样子，侧重的是坚持，不间断，与语境不符，且，“始终如一进行”用法错误，排除；B项“义无反顾”指为了正义而勇往直前，绝不退缩，C项“勇往直前”指勇敢地一直无畏地前进，两者都强调勇敢前进，与文段持续进行、继续进行的语境不符，排除。\n故正确答案为D。\n【文段出处】《人民日报:新时代中国特色社会主义与伟大社会革命》","no":21,"missingImage":false},{"type":"question","qid":"2443060","cat":"逻辑填空","stem":"当前，世界正处于百年不遇的大        之中，经济仍在艰难复苏，技术革命一日千里，突发性风险始终存在，各方对人类和平与发展        既有期待，又有忧虑。国际之“乱”和中国之“治”，凸显中国方案的可行、中国理念的可贵。\n依次填入画横线部分最恰当的一项是：","options":{"A":"演变  远景","B":"变革  愿景","C":"改革  愿望","D":"变局  前景"},"answer":"D","explanation":"本题从第二空入手，由“既有期待，又有忧虑”可知，此处说的是各方对未来的期待和忧虑，A项“远景”指将来的景象，D项“前景”将要出现的景象和情形，均符合语境，保留；B项“愿景”是希望看到的情景，C项“愿望”泛指心中期望实现的想法，多指心中希望看到的美好的想法，与后文“又有忧虑”矛盾，排除。\n第一空，根据横线后“经济仍在艰难复苏，技术革命一日千里，突发性风险始终存在”可知，横线处表达世界正处于变化的形势中，D项“变局”指变化的时局，可与后文对应，且“正处于百年不遇的大变局之中”为常见搭配，当选；A项“演变”指发展变化，侧重历时较久的，与“正处于”语意不符，排除。\n故正确答案为D。\n【文段出处】《开辟人类更加繁荣安宁的美好未来》","no":22,"missingImage":false},{"type":"question","qid":"2443064","cat":"逻辑填空","stem":"在弘扬中国传统文化、坚守产品品质的同时，老字号加快创新脚步，灵活营销、打造品牌，用全新面貌给人们带来更好的消费体验。在传承中华传统饮食文化的过程中，聚德华天        “发扬工匠精神，打造原汁原味”。“但愿人长久，岁岁杏花楼”，这是上海街头巷尾广为流传的一句话，展现了创办于1851年的老字号“杏花楼”在消费者心中的分量。中秋佳节，团圆赏月，少不了杏花楼的月饼。月饼已不单纯是食品，更是中秋文化的        ，浓缩了中华传统饮食文化的精髓。\n依次填入画横线部分最恰当的一项是：","options":{"A":"注重  符号","B":"关注  元素","C":"重视  代表","D":"侧重  内涵"},"answer":"A","explanation":"本题可从第二空入手，横线处所填词语对应“月饼”，“更”表示递进，A项“符号”指标志，B项“元素”指构成事物的要素，二者均可构成递进关系，保留。C项“代表”指显示同一类的共同特征的人或事物，月饼可以是“中秋食品”的代表，而非“中秋文化”的代表，排除；D项“内涵”指含义、内容，中秋文化的内涵不能是月饼，语义不符，排除。\n第一空，对比AB两个项，文段表达聚德华天坚守产品品质，即对于“发扬工匠精神，打造原汁原味”很重视， A项“注重”即关注重视，符合文意。B项“关注”侧重于关心注视，没有A项更加契合文意，排除。\n故正确答案为A。\n【文段出处】《老字号 用品质擦亮品牌》","no":23,"missingImage":false},{"type":"question","qid":"2443069","cat":"逻辑填空","stem":"我国艺术品拍卖市场异常火爆，大多数人看重的并非艺术品的文化价值，而是它的经济价值。所以，在这个过程中，并不能说明国民文化素质            。这更多只是表明艺术品的        价值而非文化价值受到了一些有钱人的重视。\n依次填入画横线部分最恰当的一项是：","options":{"A":"与日俱增  投资","B":"突飞猛进  市场","C":"水涨船高  商业","D":"相形见绌  收藏"},"answer":"C","explanation":"第一空，横线处所填成语与“国民文化素质”搭配，由文意可知，国民文化素质并没有随着拍卖市场的火爆而提升，B项“突飞猛进”形容事业、学问等进展非常迅速，C项“水涨船高”比喻事物随着它所凭借的基础的提高而提高，均符合文意，保留。A项“与日俱增”指随着时间的推移而不断增长，文段没有时间推移的对应，且与“素质”搭配不当，D项“相形见绌”指跟另一人或事物比较起来显得远远不如，文段并未将国民文化素质跟其他国家进行比较，排除。\n第二空，横线处所填词语搭配“价值”，由前文“大多数人看重的并非艺术品的文化价值，而是它的经济价值”可知，横线处所填词语应与“经济价值”形成对应，故C项“商业”更符合文意，当选。B项“市场”与“商业”相比，语义太宽泛，市场价值也包含文化价值等，而文段强调的是商业价值，排除。\n故正确答案为C。\n【文段出处】《艺术品拍卖，资本导演这场戏》","no":24,"missingImage":false},{"type":"question","qid":"2443075","cat":"逻辑填空","stem":"历史城区、历史文化街区和文物建筑都是        历史信息的资源，是历史的“活化石”，对待历史文化遗存，要使其“            ”，而不是“返老还童”。一些古城区成片拆除、全迁居民另建仿古街，这不是名城保护，也不是棚户区改造的正确方法，既丢了人气，文化传承也无从说起。\n依次填入画横线部分最恰当的一项是：","options":{"A":"包含  老当益壮","B":"囊括  焕然一新","C":"蕴藏  方兴未艾","D":"饱含  延年益寿"},"answer":"D","explanation":"本题可从第二空入手。根据文段“要……而不是……”可知，第二空应与“返老还童”构成反义并列，“返老还童”指老年人恢复了青春的状态，对应后文的“成片拆除”“另建”等，因此横线处应体现出“老年”的另一种状态，保持文化原貌。A项“老当益壮”侧重于年老志气不减、D项“延年益寿”即延长寿命，均能表示出老年的另一种不同状态，保留；B项“焕然一新”指改变旧面貌，出现崭新的气象、C项“方兴未艾”指事物正在发展，尚未到达止境，多用于形容新生事物，均与文意不符，排除。\n对比A、D两项，由后文“古城区成片拆除……不是名城保护……文化传承也无从说起”可知，文段强调要让历史遗迹长久的保存下去，侧重遗迹的“长寿”，未涉及“志气”，且首空D项“饱含”语义较A项“包含”更为丰富，D项更符合文意。\n故正确答案为D。\n【文段出处】《历史文化名城保护，要下绣花功夫》","no":25,"missingImage":false},{"type":"question","qid":"2443081","cat":"逻辑填空","stem":"随着暑期结束，携娃出游的家长已陆续回到家中，但暑期旅游遭遇的种种窘境却依然            。据报道，暑期学生旅游带动家庭出行，致使许多地方的热点景区纷纷“爆棚”，酒店“爆满”，假期“恶补式旅游”让不少家庭陷入进退两难的        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"历历在目  狼狈","B":"挥之不去  境地","C":"不寒而栗  抉择","D":"记忆犹新  尴尬"},"answer":"D","explanation":"第一空，横线与“窘境”搭配，且表示对旅途中不好的经历难以忘记，A项“历历在目”指过去事物清楚地重现眼前，D项“记忆犹新”指印象非常深刻，两项均能体现出记忆深刻的意思，保留；B项“挥之不去”指一些事情在心中难以排解，难以忘怀，常用作“在脑海中或在心里……挥之不去”，此处用法不当，排除；C项“不寒而栗”指因恐惧而发抖，文段没有体现害怕的意思，排除。\n第二空，所填词语与“陷入”搭配，且根据文意应体现出“进退两难”之意，感情色彩偏消极。D项“尴尬”指处境困难，不好处理，且与“陷入”搭配得当，当选；A项“狼狈”形容非常困顿窘迫的样子，此处形容家长程度过重，且与“陷入”搭配不当，排除。\n故正确答案为D。\n【文段出处】《如何走出“恶补式”旅游尴尬》","no":26,"missingImage":false},{"type":"question","qid":"2443085","cat":"逻辑填空","stem":"嫉妒心强的人常常言辞讽刺，他们            ，有时还喜欢过度        对方。嫉妒者对目标者的攻击以恭维为烟幕，这不仅是因为需要维持其妒意披着的赞美外衣，同时也出于对引发其嫉妒的美事的强烈渴望。\n依次填入画横线部分最恰当的一项是：","options":{"A":"言不由衷  赞美","B":"口是心非  表扬","C":"阳奉阴违  夸奖","D":"心口不一  褒奖"},"answer":"D","explanation":"第一空，根据后文可知，嫉妒之人表面上恭维，但内心却对彼此差距强烈不满，因此横线处应体现“表里不一”之意。B项“口是心非”与D项“心口不一”均指说法与想法并不一致，且多作贬义，形容人虚伪诡诈，保留；A项“言不由衷”意为并不是说的真心话，虽也有表里不一之意，但侧重于为了妥协现实的无奈之举，排除；C项“阳奉阴违”指表面遵从，暗里违背，指说法与做法不一，文段侧重于言辞和想法的不一致，而非“行为”，与文意不符，排除；\n第二空，根据“过度”、“强烈渴望”可知，横线处所填词语程度较重，B项“表扬”与D“褒奖”都有称赞之意，但后者较前者程度更重，更符合嫉妒者极端的心态，当选。\n故正确答案为D。\n【文段出处】《嫉妒》","no":27,"missingImage":false},{"type":"question","qid":"2443094","cat":"逻辑填空","stem":"面对新生事物，在很多时候我们是            的。但是，纵观当前互联网经济的侵权新现象，如退押金难等，其所直陈的仍然是经济中存在的诚信缺失、假冒伪劣等老问题。因为互联网经济与实体经济一样，        着相同的市场交易规律，它的本质特征依然是信用经济。\n依次填入画横线部分最恰当的一项是：","options":{"A":"无所适从  遵从","B":"茫然若失  遵守","C":"不知所措  遵照","D":"手足无措  遵循"},"answer":"D","explanation":"第一空，应该体现面对新事物时陌生、慌乱的状态。C项“不知所措”指不知道怎么办才好，形容处境为难或心神慌乱、D项“手足无措”指手脚不知放到哪儿好，形容举动慌张，或无法应付，两项均符合文意，保留。A项“无所适从”指不知听从哪一个好或不知怎么办才好，多用做面临多种选择的语境，文段并非强调面临选择，排除；B项“茫然若失”形容精神不集中，恍惚，若有所失的样子，与文段语境不符，排除。\n第二空代入验证，D项“遵循规律”为常见搭配，当选，C项“遵照”常搭配“命令、指示”等，排除。\n故正确答案为D。\n【文段出处】《如何遏制互联网经济的侵权现象》","no":28,"missingImage":false},{"type":"question","qid":"2443097","cat":"逻辑填空","stem":"罗曼·罗兰：最可怕的敌人，就是没有坚强的信念！顾城：黑夜给了我黑色的眼睛，我却用它来寻找光明！这些            的名句既有艺术感染力又具有强大的生命力，所以能            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"喜闻乐见  千古传颂","B":"脍炙人口  传诵至今","C":"交口称誉  源远流长","D":"口碑载道  名流千古"},"answer":"B","explanation":"本题可从第二空入手，根据文段“罗曼·罗兰：最可怕的敌人，就是没有坚强的信念！顾城：黑夜给了我黑色的眼睛，我却用它来寻找光明！”可知，文段强调的是一些近代作家诗人的名句。B项“传诵至今”填于此处即指这些名句到今天都被人们传扬称颂，符合文意，当选。A项“千古传颂”、C项“源远流长”、D项“名流千古”均强调这些名句有悠久的历史，用来形容近代作家诗人的名句程度过重，均可排除。\n第一空代入验证，B项“脍炙人口”指好的诗文受到人们的称赞和传颂，与“名句”搭配恰当，符合文意，当选。\n故正确答案为B。","no":29,"missingImage":false},{"type":"question","qid":"2443101","cat":"逻辑填空","stem":"半个多世纪以来，沃伦·巴菲特一直都恰到好处地把握了时机。对于这位传奇投资家，他的长期投资取得了惊人的回报，巴菲特自己将他的成功归结为专注。他除了关注商业活动外，几乎对其他一切如艺术、文学、旅行、建筑等全部            ，因此他能够            追求自己的激情。专注就是注意力全力集中到某事物上，与你所关注的事物融为一体，专注是完成伟大事业的决心。\n依次填入画横线部分最恰当的一项是：","options":{"A":"不予理睬  一心一意","B":"不闻不问  尽心尽力","C":"置若罔闻  聚精会神","D":"充耳不闻  专心致志"},"answer":"D","explanation":"本题可从第二空入手，根据后文“专注就是注意力全力集中到某事物上，与你所关注的事物融为一体，专注是完成伟大事业的决心”可知，横线处应体现专注、专心之意。D项“专心致志”即强调专注、专心，符合文意，当选。A项“一心一意”侧重强调专一，而文段强调专注，与文段语境不符，排除；B项“尽心尽力”指竭尽心思、力量，不能体现专注之意，排除；C项“聚精会神”一般搭配具体的动作，文中追求激情是抽象动作，搭配不当，排除； \n第一空代入验证，根据“除了关注商业活动外，几乎对其他一切如艺术、文学、旅行、建筑等全部”可知，文段强调巴菲特重视商业活动，其他活动难以引起其注意，故横线处应体现不重视之意。D项“充耳不闻”指有意不听别人的意见，可以体现不重视，符合文意，当选。\n故正确答案为D。\n【文段出处】《巴菲特:人一生中最重要的是专注》","no":30,"missingImage":false},{"type":"question","qid":"2443107","cat":"逻辑填空","stem":"置身在            的雪花中，在白色的            间，仰望着天空飘落的雪花，手伸出来，接住落下的雪花，我仔细观察了雪花的样子，整朵雪花呈六边形，它的花纹伸展得非常整齐，像树杈分开的样子。\n依次填入画横线部分最恰当的一项是：","options":{"A":"漫天飞扬  亭台楼阁","B":"翩翩起舞  富丽堂皇","C":"漫天飞舞  琼楼玉宇","D":"轻盈飘渺  雕梁画栋"},"answer":"C","explanation":"第一空搭配雪花， A项“飞扬”往往做动词使用，如尘土飞扬、彩旗飞扬，横线处所填词语应当为形容词，排除；B、C、D三项均适合填入文段，保留。 \n第二空，搭配“白色的”，B项“富丽堂皇”形容房屋宏伟豪华，是个形容词，横线上所填词语应为名词，排除；D项“雕梁画栋”指有彩绘装饰的十分华丽的房屋，“彩绘”跟“白色”矛盾，排除。C项“琼楼玉宇”指月中宫殿，仙界楼台。也形容富丽堂皇的建筑物，符合文意，当选。\n故正确答案为C。\n【出处】《下雪了》","no":31,"missingImage":false},{"type":"question","qid":"2443111","cat":"逻辑填空","stem":"包光潜在《温暖的橘子》中提到，那是十年前的秋天，我和朋友到西北旅游观光。由于路途遥远，精神            。大约过了几个隧道之后，豁然开朗，两边的山坡出现大片的橘林。刚刚成熟的橘子，在一片翠绿中            地泛着橘红色的光彩。到了一个小站，火车尚未停稳，月台上已经到处都是奔跑的橘子。\n依次填入画横线部分最恰当的一项是：","options":{"A":"萎靡不振  清晰可见","B":"萎靡不振  若隐若现","C":"一蹶不振  隐约可见","D":"一蹶不振  时隐时现"},"answer":"B","explanation":"第一空，搭配“精神”，表达含义为路途遥远，精神状态比较疲惫。A、B两项“萎靡不振”形容精神不振，意志消沉，适合填入文段；C、D两项“一蹶不振”比喻遭受一次挫折以后就再也振作不起来，文段中未体现“挫折”的含义，排除。\n第二空，依据文意“刚刚成熟的橘子”、“一片翠绿”说明橘子成熟的数量还不多，而且文段中表示是火车快速经过橘林，所以车上的人看到的是一片翠绿中橘红一闪而过，对应B项。A项“清晰可见”与文意相悖，排除。\n故正确答案为B。\n【出处】《温暖的橘子》","no":32,"missingImage":false},{"type":"question","qid":"2443115","cat":"逻辑填空","stem":"要坚持因人因地施策，因贫困原因施策，因贫困类型施策，区别不同情况，做到            、精准滴灌、靶向治疗，不搞大水漫灌、            、大而化之。\n依次填入画横线部分最恰当的一项是：","options":{"A":"有的放矢  人浮于事","B":"持之以恒  蜻蜓点水","C":"对症下药  走马观花","D":"锲而不舍  三心二意"},"answer":"C","explanation":"第一空，由上文“因人因地施策，因贫困原因施策，因贫困类型施策”及后文“精准滴灌”“靶向治疗”可知，横线处应体现“有针对地解决问题”，A项“有的放矢”比喻说话做事有明确的目的性和针对性，符合文意，C项“对症下药”比喻针对具体情况提出解决问题的办法，符合文意；B项“持之以恒”、D项“锲而不舍”均强调“坚持”，和文段侧重点不一致，排除。\n第二空，依据文段“做到······不搞······”可知前后语义相反，故横线上所填词语要体现出“没有针对性”的意思。A项“人浮于事”强调工作中人员过多或人多事少，与文段意思不相符，排除；C项“走马观花”比喻粗略地观察事物，能体现出“没有针对性”的语义，故选该项。\n故正确答案为C。\n【出处】《习近平：对症下药 精准滴灌 靶向治疗 打赢脱贫攻坚战》","no":33,"missingImage":false},{"type":"question","qid":"2443044","cat":"逻辑填空","stem":"中国传统文人重视意境。美学家宗白华先生说过，中国艺术意境的创成，既须得屈原的缠绵悱恻，又须得庄子的超旷空灵。缠绵悱恻，才能            ，深入万物的核心，所谓“得其环中”。超旷空灵，才能为镜中花，水中月，            ，无迹可寻，所谓“超以象外”。\n依次填入画横线部分最恰当的一项是：","options":{"A":"一往情深  羚羊挂角","B":"一如既往  雪泥鸿爪","C":"一气呵成  神来之笔","D":"一见倾心  天马行空"},"answer":"A","explanation":"第一空，根据后文“深入万物的核心”可知，需填入表示深入程度之深、之透彻的词语。A项“一往情深”表示对人或对事物倾注了很深的感情，可体现程度深，符合文意。B项“一如既往”指态度或做法没有任何变化，还是像从前一样；C项“一气呵成”指文章的气势首尾贯通；D项“一见倾心”指初次见面就十分爱慕，均不能体现深入程度之深，故不符合文意，排除。\n验证第二空，根据前文“镜中花，水中月”及后文“无迹可寻”可知，这种意境是很难找到踪迹的、超脱物外的。A项“羚羊挂角”指诗的意境超脱，符合文意，验证合适。\n故正确答案为A。\n【文段出处】《宗白华：中国艺术意境之诞生》","no":34,"missingImage":false},{"type":"question","qid":"2443057","cat":"逻辑填空","stem":"文学只不过是文学，并不等同于文化，也不约等于。但文学是其它各艺术门类的酵母，“文艺”二字        了此种关系。若将文艺从文化中        出来，文化便很容易成为            的学问，结果对于最广大的人民失去了感染力。用时下最流行的说法那就是“不接地气”了。\n依次填入画横线部分最恰当的一项是：","options":{"A":"解释  分离  阳春白雪","B":"注脚  分解  曲高和寡","C":"阐释  拆解  高高在上","D":"注释  剥离  束之高阁"},"answer":"D","explanation":"第一空，“文艺”两字是“文学”与“艺术”的结合，故可知为前文“文学是其他各艺术门类的酵母”的解释。A项“解释”指合理地说明事物变化的原因，事物之间的联系，或者是事物发展的规律；C项“阐释”指说明、表明；D项“注释”指解释字句的文字，也指用文字解释字句，均符合文意。B项“注脚”指解释字句的文字，也泛指解释、说明，但用于此处语法错误，“注脚”后一般不接宾语，比如秦俑展成为“文明交流互鉴”的最好注脚，排除。\n第二空，搭配“文艺”，根据后文解释可知，意在表明文化中不再有文艺的部分，A项“分离”意为分开、离开、隔离、分别之意，符合文意，C项“拆解”指拆开、拆散，符合文意；D项“剥离”指使脱落、分开，可用于具体事物与抽象事物，符合文意。\n第三空，由“结果对于最广大的人民失去了感染力”可知此处强调文化对人民没有吸引力了，人民不再喜欢文化了，D项“束之高阁”指把东西捆起来，放在高高的楼阁上，比喻放在一旁，不去管它，能体现出文化没有吸引力、不再受人民喜欢的意思，当选。A项“阳春白雪”比喻高深的不通俗的文学艺术，文段并非意在夸赞没有了文艺的文化变得十分高雅，与文意不符，排除；C项“高高在上”指领导者脱离实际，脱离群众，体现不出文化没有吸引力、不再受人民喜欢的意思，如某奢侈品在很多人心里是高高在上的，但与此同时，也是备受很多人喜爱的，与语境不符，排除。\n故正确答案为D。\n【文段出处】《梁晓声茅盾文学奖获奖感言：文学影响世道人心》","no":35,"missingImage":false},{"type":"question","qid":"2443070","cat":"逻辑填空","stem":"散布谣言者抓住人们“宁可信其有不可信其无”的心理，散布            的网络谣言。这些谣言误导了公共舆论，        了社会秩序，影响了人们的正常生活。不仅会造成人心恐慌，有的还会给行业和产业发展带来巨大损失，甚至也使国家的一些好政策遭到误解，严重影响政府公信力，民众对此            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"捕风捉影  扰乱  嗤之以鼻","B":"骇人听闻  干扰  莫衷一是","C":"耸人听闻  妨碍  不屑一顾","D":"危言耸听  扰乱  深恶痛绝"},"answer":"D","explanation":"从第三空入手，根据“造成人心恐慌”“行业和产业发展带来巨大损失”以及“国家的一些好政策遭到误解”可知，散布谣言这件事是非常不好的，所填词语要体现出“民众”对散布谣言这件事是非常讨厌的意思，D项“深恶痛绝”指极端地厌恶、痛恨，可以对应文段中非常严重的不良影响，符合文意。A项“嗤之以鼻”指从鼻子里发出冷笑的声音，表示讥笑和蔑视；C项“不屑一顾”认为不值得一看，形容极端轻视，两项均体现出轻视、蔑视的意思，文段中散布谣言造成很大的危害，体现出民众对这件事是非常憎恨的，而不是轻视、看不起，程度过轻，不符合文意，排除；B项“莫衷一是”指意见分歧，没有一致的看法，不符合文意，文段已明确表示了民众的一致的感情倾向，排除。\n第一空、第二空代入文段验证，危言耸听的网络谣言、扰乱了社会秩序，搭配合适，当选。\n故正确答案为D。\n【文段出处】《“科学辟谣平台”：辟谣也需要“国家队”》","no":36,"missingImage":false},{"type":"question","qid":"2443078","cat":"逻辑填空","stem":"不必讳言，近期猪肉价格暴涨，固然与农产品供给周期性        有关，也与生猪生产供应在一些地方存在政策性收紧是分不开的。一个简单例子是，因为环保        ，很多地方不仅纷纷强力取缔养殖场，也禁止农村散户养猪，当规模性养殖受到猪瘟袭击时，供给侧渠道顿时收窄，猪肉涨价自然            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"波动  约束  毫无疑问","B":"变化  制约  势在必行","C":"影响  推进  顺理成章","D":"规律  要求  水到渠成"},"answer":"A","explanation":"本题从第二空入手，根据前文的“政策性收紧”以及下文“强力取缔”“禁止农村散户养猪”可知，“环保”因素是限制性的，A项“约束”、B项“制约”D项“要求”三项均可。C项“环保推进”体现的是环保政策的实施，而非环保硬性要求，故与文意无关，排除。\n第三空，横线处体现“猪肉供给侧渠道顿时收窄”，“猪肉涨价”的必然性结果，A项“毫无疑问”没有一点疑问，十分肯定，语义合适。B项“势在必行”指某事根据事物的发展趋势必须做，即尚未有行动，与文段中猪肉价格已经暴涨的事实不符，排除。D项“水到渠成”比喻条件成熟了，事情自然会成功，文段并无“成功”之意，排除。\n第一空代入验证，“农产品供给周期性波动”为固定搭配，语义合适，当选。\n故正确答案为A。\n【文段出处】《一刀猪肉，贯穿着政府治理的方方面面》","no":37,"missingImage":false},{"type":"question","qid":"2443090","cat":"逻辑填空","stem":"我们从小就接受“无规矩不成方圆”的教育，明白世上任何事物皆有各自标准法度的道理。但总有人不守规则、            ，个中道理值得深思。事实上，近年来有关漠视、违反、扭曲规则的事            ，小到闯红灯、高铁霸座等，大到违规用权、官员腐败等，无不        着破坏规则导致的种种危害和风险。\n依次填入画横线部分最恰当的一项是：","options":{"A":"自以为是  层出不穷  突显","B":"随心所欲  比比皆是  显示","C":"不以为然  大行其道  显露","D":"各行其是  屡见不鲜  凸显"},"answer":"D","explanation":"第一空，根据“、”可知，横线处与“不守规则”语义相近，表达不按“标准法度”行事之意，B项“随心所欲”指一切都由着自己心意，想怎么做就怎么做，D项“各行其是”指各自按照自己以为对的去做，均符合文意，保留。A项“自以为是”指认为自己的看法和做法都正确，不接受别人的意见，文段并无不虚心之意，C项“不以为然”指不认为是对的，表示不同意，与文段意思无关，均排除。\n第二空，根据后文“小到······大到······”可知，横线处应体现漠视、违反、扭曲规则的事很多之意，B项“比比皆是”指到处都是，极其常见，D项“屡见不鲜”指经常看见，并不新奇，均符合文意，保留。\n第三空，搭配“危害和风险”，且对应前文“闯红灯、高铁霸座、违规用权、官员腐败”的行为，侧重强调其带来的“危害和风险”很明显，D项“凸显”指清楚地显露，符合文意，当选。B项“显示”指明显地表现，相较而言程度较轻，无法体现出强调的意味，排除。\n故正确答案为D。\n【文段出处】《规则意识短板现象成因》","no":38,"missingImage":false},{"type":"question","qid":"2443096","cat":"逻辑填空","stem":"中共中央、国务院《关于决定设立河北雄安新区的通知》一出台，可谓            ，连续几天，关于雄安新区的报道和分析            。之所以引发如此巨大的关注，显然是因为雄安新区被提到了很高的地位。这些年国家陆续批准设立了十几个新区，只有雄安新区能和深圳特区、浦东新区            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"惊天动地  此起彼伏  同日而语","B":"石破天惊  铺天盖地  相提并论","C":"震天动地  等量齐观  同舟共济","D":"震天撼地  翻天覆地  一视同仁"},"answer":"B","explanation":"本题可从第二空入手，根据下文“引发如此巨大的关注”可知，横线处体现“关于雄安新区的报道和分析”很多，A项“此起彼伏”指这里起来，那里下去，形容接连不断，B项“铺天盖地”形容声势大，来势猛，到处都是，两项语义均可。C项“等量齐观”指对有差别的事物，同等看待，与文意无关，排除。D项“翻天覆地”侧重表达变化巨大，而非数量、范围上的多、广，排除。\n第三空，表达雄安新区能和深圳特区、浦东新区地位相当，B项“相提并论”指把不同的事放在一起谈论或看待，符合文意。A项“同日而语”指把相同的人或事物放在相同时间比较，放在一起谈论或看待，多用于否定句中，且置于文段与多个主语搭配不当，排除。\n代入验证第一空，横线处形容《关于决定设立河北雄安新区的通知》出台后的引发的轰动效果，“石破天惊”用以比喻文章、议论出奇惊人，符合文意。\n故正确答案为B。","no":39,"missingImage":false},{"type":"question","qid":"2443102","cat":"逻辑填空","stem":"显微摄影是一门使用照相机拍摄显微镜下一般用肉眼无法看清的标本的技术。肉眼中            的细沙，在显微镜下却是“一沙一世界”，有的            像宝石，有的金黄酥脆像饼干。即使是            的柴米油盐，在显微镜下也会展现神奇而充满魅力的一面。\n依次填入画横线部分最恰当的一项是：","options":{"A":"如出一辙  晶莹剔透  不足为奇","B":"一成不变  玲珑剔透  不足为奇","C":"一模一样  光亮通明  司空见惯","D":"千篇一律  晶莹剔透  司空见惯"},"answer":"D","explanation":"本题可以从第二空入手，第二空，形容有的沙子像宝石一样，B项“玲珑剔透”形容器物精致通明，结构细巧；也比喻人精明灵活，不能形容宝石，排除。C项“光亮通明”强调明亮、干净，没有杂质，文段中并未强调没有杂质，排除。A项与D项的“晶莹剔透”指光亮透明的样子，常用来形容宝石，符合文意，保留。\n第三空，形容“柴米油盐”，这些事物在生活中很常见，所以对应D项“司空见惯”，指某事常见。A项“不足为奇”强调不值得奇怪，不能说明日常生活中经常见到，排除。\n代入第一空验证，“千篇一律”原意为一千篇文章都一样，泛指事物只有一种形式，毫无变化，形容细沙在肉眼中看起来都一样，符合文意，当选。\n故正确答案为D。\n【文段出处】《显微镜下大视界》","no":40,"missingImage":false},{"type":"question","qid":"2443105","cat":"片段阅读","stem":"第46个世界环境日确定的主题是“绿水青山就是金山银山”。这是习近平总书记关于生态文明建设最具代表性的“金句”。习近平总书记提出“既要金山银山，又要绿水青山”、“宁要绿水青山，不要金山银山”、“绿水青山就是金山银山”等科学论断，人们习惯称之为“两山论”。随着实践的深入，“两山论”经受了事实检验，越来越成为社会共识，为中国发展注入越来越强大的正能量。\n这段文字支持的观点是：\n①生态环境是经济发展的重要基础\n②生态文明建设应与经济建设协同发展\n③经济建设是生态文明建设的重要基础\n④生态优势可以转化为经济优势","options":{"A":"①②③","B":"②③④","C":"①②④","D":"①③④"},"answer":"C","explanation":"根据文段“绿水青山就是金山银山”可知，①④属于本文所支持的观点；根据文段“既要金山银山，又要绿水青山”可知，②属于本文所支持的观点。③强调经济建设的重要性，而文段强调生态建设的重要性，故不属于本文所支持的观点，排除A项、B项、D项。\n故正确答案为C。\n【文段出处】《习近平的“两山论”指明发展方向》","no":41,"missingImage":false},{"type":"question","qid":"2443109","cat":"片段阅读","stem":"获得2019年诺贝尔经济学奖的三位经济学家，在减贫方面进行了长期的有意义的探索研究，对于如何解决贫困这个艰巨而宏观的世界性课题，他们将其分解为较小、更易于管理的问题，从细节入手，从而交出了一份更具可操作性的答卷。他们的实践表明，这些小而精确的问题通常可以通过精心设计的干预性实验来获得精准的答案，从而做到有效减贫。一些分析人士认为，通过田野实验方法验证具体减贫政策的效果，从而发现有效地克服贫困状态的相关政策，这种研究路径正是发展经济学在当前及今后一段时期的前沿研究方向。\n这段文字意在说明：","options":{"A":"三位经济学家获奖原因分析","B":"通过田野实验方法能解决世界性贫困问题","C":"宏观性世界问题需要用干预性实验来进行验证","D":"宏观性经济问题可通过精细的干预性实验探讨研究"},"answer":"D","explanation":"文段开篇介绍了获得诺贝尔经济学奖的三位经济学家在减贫方面做了有意义的研究，交出了具有可操作性的答卷，接着介绍了他们的实践结果，即可以通过精心设计的干预性试验来获得精准答案，尾句介绍了分析人士的观点，通过指代词总结前文，强调通过精心设计的干预性实验进行研究是发展经济学的方向，故文段的重点强调宏观经济问题可以通过精细的干预实验来进行，对应D项。\nA项“获奖原因分析”文段未提及，无中生有，排除。\nB项“世界性贫困问题”非文段重点，文段强调经济问题，排除。\nC项“宏观性世界问题”概念扩大，文段重点在于经济，排除。\n故正确答案为D。\n【文段出处】《诺贝尔奖为何颁给减贫学者》","no":42,"missingImage":false},{"type":"question","qid":"2443113","cat":"片段阅读","stem":"中国正处在经济快速发展时期，出现了许多新兴产业，但是这些新兴产业人才匮乏，导致我国人才结构不平衡，成为实现经济增长方式转变的瓶颈。与此同时，由于新兴产业新增了许多就业岗位，各地政府应该采取各种方法，调动各种资源，引进新兴产业高端人才，并积极倡导越来越多的人选择学习新兴学科知识。所以，新兴领域的人才培养应该成为越来越多的人升学深造的首选，并将成为高等教育未来发展趋势。\n对这段话的主旨归纳准确的是：","options":{"A":"新兴产业的兴起，增加了就业机会","B":"发展新兴学科教育，提升人才资本","C":"办好新兴产业，加快经济转型","D":"要引导越来越多的人接受新兴学科教育"},"answer":"B","explanation":"文段首先指出我国出现许多新兴产业，接着通过转折关联词“但是”提出问题，即新兴产业人才匮乏阻碍了经济增长方式的转变，后文通过“与此同时”表并列，指出政府应引导人们选择学习新兴学科知识，尾句由“所以”总结前文，引出结论，指出新兴领域的人才培养应该成为升学深造的首选，并成为高等教育的培养趋势，故文段重点强调应发展对新兴领域人才的教育培养，对应B项。\nA项、D项，均为结论前一部分的内容，非重点，排除。\nC项，“新兴产业”并非文段重点，文段重点强调“新兴学科教育”，排除。\n故正确答案B。","no":43,"missingImage":false},{"type":"question","qid":"2443117","cat":"片段阅读","stem":"在全球化日益发展、国际组织地位和作用愈加凸显的今天，中国要想在竞争日趋激烈的国际环境下实现自身发展的战略目标，不仅需要积极主动的进取精神，不断开辟新的领域，加大参与国际组织的力度，同时也需要以认真求实的科学态度，对当今国际组织有一个系统全面的认识，对自己在国际组织中的地位有一个准确的定位和把握，对中国与国际组织之间存在的问题有一个清醒的认识和理解，对未来国际组织的发展趋势及其走向作出合理的推测和判断。\n这段文字主要支持的观点是：","options":{"A":"国际组织地位和作用愈加凸显","B":"中国在国际舞台上实现自身发展的战略目标","C":"中国对国际组织的定位和把握准确","D":"在全球化进程中，中国对国际组织的新认识"},"answer":"D","explanation":"文段开篇指出在全球化的今天，国际组织的地位和作用凸显，接着指出中国要想在竞争日趋激烈的国际环境下实现自身发展的战略目标，一方面要积极进取和开拓，加大参与国际组织的力度，另一方面要以认真求实的态度，对当今国际组织、与国际组织的关系、未来发展趋势等有全面的认识，提取共性可知，文段重在强调在全球化的今天，中国应对国际组织有全新的认识，对应D项。\nA项，仅为文段背景，非重点，排除；\nB项，未提及主题词“国际组织”，排除；\nC项，“对国际组织的定位和把握准确”偷换概念，文段指出“对自己在国际组织中的地位有一个准确的定位和把握”，排除。\n故正确答案为D。\n【文段出处】《中国与国际组织》","no":44,"missingImage":false},{"type":"question","qid":"2443119","cat":"片段阅读","stem":"在人人皆可言教育的年代，猜疑与隔阂正在消解传统意义上的师道尊严。教师，也算是一个清苦的职业。看似有寒暑假，实际上多数时间都用来备课、评课；双休日，学校要承担各类社会考试；工作日，课多人少，一人请假就可能影响教学进度。在这样的工作压力下，倘若再得不到应有的尊重，轻则让教师心灰意冷，重则令名师远走高飞。\n接下来最有可能讲述的是：","options":{"A":"如何消除社会对教师的猜疑与隔阂","B":"涵养师道尊严的途径","C":"造成社会对教师误解的原因","D":"呼吁全社会尊重教师"},"answer":"B","explanation":"文段开篇介绍问题，猜疑与隔阂正在消解传统意义上的师道尊严，随后对教师这一职业进行分析，论述该职业之清苦状态。尾句通过反面论证提出对策，即教师应该得到充分的尊重。接语选择题，下文谈论的内容应与文段尾句话题保持一致，且逻辑一致。故下文应具体介绍，如何让教师得到充分尊重，即让教师得到尊重的具体途径和措施，对应B项，当选。\nA项“猜疑与隔阂”为首句谈论的话题，下文不会继续论述，排除；C项“对教师误解”话题错误，文段最后谈论的是“对教师的尊重”，排除；D项“呼吁全社会尊重教师”为尾句反面论证的内容，即为尾句的同义替换，而下文应谈论让教师得到尊重的具体途径和做法，排除。\n故正确答案为B。\n【文段出处】《师道尊严，需要担当作为来维护》","no":45,"missingImage":false},{"type":"question","qid":"2443120","cat":"片段阅读","stem":"国际妇女节，好莱坞女星安妮·海瑟薇以联合国亲善大使的身份，站上联合国纽约总部讲台发表演说，为女性也为男性发声。她指出，妇女应该待在家里照顾小孩的人设是一种顽固的刻板印象，不仅歧视女性，加重了母亲的负担，也低估了父亲的角色，限制了男性在家庭和社会中的参与度。这种角色定位给孩子的成长带来了巨大的影响，她从亲身体验出发，呼吁全球政府、企业和机构，调整现有的产假制度，给予两性平等的带薪产假和育婴假，“创造一个女性和男性都不会因为想当父母，而受到经济惩罚的世界。”\n这段文字意在强调：","options":{"A":"妇女待在家里照顾小孩的人设是错误的","B":"男性在家庭和社会中的参与度应该加强","C":"除了女性，男性也要拥有育婴权利","D":"男女平等制度的设想"},"answer":"C","explanation":"文段开篇介绍了安妮·海瑟薇在联合国总部发表演说的内容，通过关联词“不仅······也······”论述了妇女照顾小孩的人设给女性、男性及孩子成长带来的负面影响。尾句通过“呼吁”引导对策，表示要给予两性平等的带薪产假和育婴假，即除了女性之外，男性也要照顾小孩。文段中对策是重点，对应C项。\nA项“错误的”表述过于绝对，文段仅论述了这种人设有负面影响，并未提及完全错误，且非对策表述，排除；B项，“参与度”表述不明确，文段明确指出应该增加父亲参与育婴的权利，排除；D项，“制度”表述不明确，文段强调的是“产假制度”，排除。\n故正确答案为C。","no":46,"missingImage":false},{"type":"question","qid":"2443077","cat":"片段阅读","stem":"“无现金社会”之所以能够如此快速地被人们接受，无疑源自于它克服了现金给人们带来的“烦恼”，给生活带来了诸多便利：不仅让偷盗抢劫的笨贼们空手而归，更让使用假钞的骗子们倍感头疼。无现金状态下，还会减少以纸钞为媒介的疾病传播。然而，“无现金社会”也不是百益而无一害。无现金社会，改变的不仅是支付方式，也潜移默化地改变了人们的消费习惯、消费心理。消费者，要理财管理，收支有度；金融机构，要更新服务，保障安全；监管机构，则要因势利导，提升监管能力等。\n本文中“无现金社会”意在强调的是：","options":{"A":"给生活带来的便利","B":"给社会带来了新的风险与挑战","C":"减少以纸钞为媒介的疾病传播","D":"推动技术发展和社会进步"},"answer":"B","explanation":"文段开篇介绍了“无现金社会”被人们快速接受的原因，并论述了它给生活带来的诸多便利。接着通过转折词“然而”引导重点，表示“无现金社会”也有不利的一面，并详细论述了面对“无现金社会”的到来，消费者、金融机构、监管机构需要做到的几个方面，即“无现金社会”给社会带来了新的挑战。文段中转折之后是重点，对应B项。\nA项“带来的便利”、C项“减少疾病传播”均对应转折之前的内容，非重点，排除。\nD项文段未提及，无中生有，且文段转折之后强调的是“不利”，而选项内容为“有利”，排除。\n故正确答案为B。\n【文段出处】《“无现金社会”需兴利去弊》","no":47,"missingImage":false},{"type":"question","qid":"2443082","cat":"片段阅读","stem":"终身学习时代，对知识内容的提供者提出了更高要求。这恰恰也是知识付费平台的“软肋”之一。曾经有媒体做过一次调查，让一些参与过知识付费学习的人回答知识付费对他们来说有没有用。调查结果显示，大部分人对付费学习产品的满意度都不高，而他们的不满意主要就表现在他们对知识付费产品的质量不敢恭维。所以，对于知识付费平台来说，最迫切的任务就是精心打磨内容，提高质量，通过真正优质的好内容赢得学习者的心，让他们觉得“物有所值”。\n最适合做这段文字标题的是：","options":{"A":"知识付费助力终身学习","B":"如何解决知识付费平台的软肋","C":"知识付费需要物有所值","D":"走出知识付费发展困境"},"answer":"C","explanation":"文段开篇提出问题，表示知识内容的提供者不能满足更高的要求是付费平台的“软肋”之一。接着通过介绍调查结果，印证了人们对知识付费产品的质量不满是知识付费学习过程中的主要问题。尾句“所以”引导结论，强调知识付费平台要提高内容质量，让用户在知识付费过程中感到“物有所值”。文段中结论是重点，对应C项。\nA项“助力终身学习”文段未提及，无中生有，排除。\nB项“如何解决”、D项“走出······困境”均表述不明确，文段尾句明确提出了对策，即要让用户感到“物有所值”，排除。\n故正确答案为C。\n【文段出处】《让知识付费助力终身学习》","no":48,"missingImage":false},{"type":"question","qid":"2443087","cat":"片段阅读","stem":"“开学第一课”，本质是“课”，是所有教学的一部分，而课程创新也属于学校的教育事务，因此，在进行“开学第一课”时，各地宜充分结合本校的办学定位、办学条件和特色，由全体教师参与进行课程设计论证，并听取学生和家长的意见。每年的“开学第一课”也不必回避相同的主题，因为每个年龄段的学生，学习任务本就不同，关键在于要给同样的主题注入新的内涵。\n这段文字强调的是：","options":{"A":"不能脱离课的本质开展“开学第一课”","B":"“开学第一课”应由老师、学生、家长三方主体共同设计完成","C":"“开学第一课”与课程创新要同步","D":"“开学第一课”不应拘于形，而应重于实"},"answer":"C","explanation":"文段开篇指出“开学第一课”是教学的一部分，而课程创新也属于学校的教育事务，强调课程创新的重要性，并通过“因此”引导结论，在进行“开学第一课”时，要考虑到各个方面，尾句通过“关键在于”强调“给同样的主题注入新的内涵”，即应该创新，因此文段意在说明“开学第一课”要注重创新，对应C项。\nA项，“课的本质”对应文段开头，为结论之前内容，非重点，排除；\nB项，文段提及“老师、学生、家长三方主体共同设计完成”的目的是为了保障“课程创新”，选项表述内容非重点，排除；\nD项，“应重于实”中的“实”即“创新”，故表述不明确，排除。\n故正确答案为C。\n【文段出处】《多元化“开学第一课”，实现教育的回归》","no":49,"missingImage":false},{"type":"question","qid":"2443092","cat":"片段阅读","stem":"我们要在科学技术上赶超世界先进水平，不但要提高高等教育的质量，而且首先要提高中小学教育的质量，按照中小学生所能接受的程度，用先进的科学知识来充实中小学教育内容。\n这段话支持了这样一个观点：","options":{"A":"提高高等教育质量是在科学技术上赶超世界先进水平的条件","B":"全面提高教育质量是在科学技术上赶超世界先进水平的条件","C":"提高中小学的教育质量是在科学技术上赶超世界先进水平的条件","D":"学习先进科学知识是在科学技术上赶超世界先进水平的条件"},"answer":"C","explanation":"文段给出实现“科学技术上赶超世界先进水平”的两方面对策，且由递进关联词“不但……而且……”引导，且通过“首先”进一步强调第二个对策，即“中小学教育”的重要性，对应C项。\nA项，“高等教育质量”是程度“而且”之前的内容，非重点，排除；\nB项，“全面提高教育质量”范围扩大，文段重点强调的是“中小学教育”，排除；\nD项，“用先进的科学知识来充实中小学教育内容”重点强调“中小学教育”而非“先进科学知识”，非重点，排除。\n故正确答案为C。\n【文段出处】《编好教材是提高教学质量的关键》","no":50,"missingImage":false},{"type":"question","qid":"2443095","cat":"语句表达","stem":"将下列6个句子重新排列，语序正确的是：\n①和人类的目标明确的前行不同，千百年来，还有另一些盲目的旅客\n②咸咸的海水侵蚀着它们，只有一些特殊的有着保护层的果实能幸存\n③视线里，没有帆船，只有被海风塑造的碎云和茫茫海面\n④各种植物的果实，来自大陆或别的海岛，漂浮着到处漫游\n⑤这些天涯浪子，一旦被冲上岛屿，就有可能成为岛屿上的移民\n⑥在这样的海面上依循命运的安排旅行着","options":{"A":"④③①⑥⑤②","B":"①⑤②④⑥③","C":"③①⑥④②⑤","D":"④⑥①②③⑤"},"answer":"C","explanation":"根据选项判断首句，①句论述话题是“盲目的旅客”、③句论述“视线里”的场景、④句论述“植物的果实”，均没有明显的首句标志，无法直接确定首句。\n进一步观察可知，②句中出现指代词“它们”，且论述“一些特殊的有着保护层的果实能幸存”，结合选项，②句之前分别为①④⑤三句，①句论述“盲目的旅客”，和“果实”无关，无法与②句构成捆绑，排除D项；④句论述“各种植物的果实”，可以与②句构成捆绑，保留C项；⑤句论述“被冲上岛屿”，按照逻辑顺序，应先漂浮，再冲上岛屿，故⑤句应在④②两句之后，排除A、B两项。\n验证C项，③句提出海面话题，①⑥两句论述海面上有盲目的旅客，④句介绍旅客是植物的果实，②⑤两句论述旅客的命运，逻辑恰当，当选。\n故正确答案为C。\n【文段出处】《西沙群岛的春天》","no":51,"missingImage":false},{"type":"question","qid":"2443103","cat":"片段阅读","stem":"网约车“合规”，说到底是为了促进网约车行业更良性的发展，为了保障和增进民众的福祉。网约车之规合不合理，民众的利益是最重要的标尺。换言之，如果“合规”有利于民众利益，那就是值得肯定和鼓励的，如果“合规”伤害了民众利益，那就是必须否定和摒弃的。概而言之，规矩是为“人”服务的，一味强调规矩而忘记了“人”，            。\n填在文中空白部分比较恰当的是：","options":{"A":"这无疑是舍本逐末","B":"其结果就是网约车之规为大众所诟病","C":"规矩就是形同虚设","D":"就会损害民众的利益"},"answer":"A","explanation":"横线出现在文段结尾，且由“概而言之”引导，可知是对前文的总结。文段开篇提出网约车“合规”是为了保障和增进民众福祉，其合规的合理性在于民众的利益，并用“换言之”进行正反两方面的解释说明，进一步介绍民众利益是网约车合规的根本所在。最后用“概而言之”总结前文，指出一味强调规矩忘了“人”就是忘记了根本、忽略了关键，对应A项“舍本逐末”。\nB项侧重“网约车之规为大众所诟病”，C项侧重规矩不能发挥作用，两项均未体现“人”的关键作用，排除；\nD项，“损害民众利益”相较于A项“舍本逐末”，没有体现民众利益对合规来说的关键性作用，A项与上文衔接更为紧密，故排除D项。 \n故正确答案为A。\n【文段出处】《网约车“合规”，前提是“规矩合理”》","no":52,"missingImage":false},{"type":"question","qid":"2443106","cat":"片段阅读","stem":"“快递”是一个典型的新业态，它对城市治理根本的挑战在于打破了原有的治理常规，塑造了新的街头治理景观。街头摊贩或许变少了，但摊贩经济却未必减少，它只不过不再依赖于街头巷尾的人员聚集，而是依赖于线上线下的精准匹配。传统意义上的城管执法冲突的确是减少了，但每天针对电动车摆放等服务管理工作却在急剧增加。以前，交警主要针对有车一族进行执法，但现如今针对“快递小哥”这类群体的交通执法在急剧增加。\n下列说法与原文不符的是：","options":{"A":"新业态对街头治理提出新要求","B":"互联网使一些传统商业的实现形式发生了改变","C":"快递新业态的发展是缓解城管执法冲突的有效手段","D":"新业态的出现对城市治理是挑战"},"answer":"C","explanation":"本题是一道选非题。\n由“它对城市治理根本的挑战在于打破了原有的治理常规，塑造了新的街头治理景”可知，“快递”作为新业态对城市治理带来了挑战，对街头治理提出了要求，A、D项均符合文意，排除；\n由“街头摊贩或许变少了，但摊贩经济却未必减少，它只不过不再依赖于街头巷尾的人员聚集，而是依赖于线上线下的精准匹配”可知，互联网确实改变了一些传统商业的实现形式，B项说法符合文意，排除；\nC项“快递新业态的发展是缓解城管执法冲突的有效手段”曲解文意，文中讲到“传统意义上的城管执法冲突的确是减少了，但每天针对电动车摆放等服务管理工作却在急剧增加”，说明只是传统上的减少了，新的却在增加，当选。\n故正确答案为C。","no":53,"missingImage":false},{"type":"question","qid":"2443110","cat":"片段阅读","stem":"诗，来源于生活，又高于生活。可是，诗并不是现实生活照相式的复制品。它是现实生活在诗歌创作者心中所激起的情感的浪花，它需要创作者在生活与艺术之间架起一座桥梁，而艺术感受便是这座桥梁。诗人能以诗的方式接受现实印象，并能借助幻想活动，在诗的形象中把印象又复印出来。诗歌创作者总是善于通过自己独特的艺术感受，去摄取生活中的那些元素，并调动自己的联想和想象，对那些元素进行发酵，进行化学处理，进而酿造出诗来。\n这段文字意在说明：","options":{"A":"诗歌是创作者在现实生活中所激起的情感浪花","B":"对诗歌的创作是诗人通过艺术感受而完成的","C":"诗歌来源于社会印象并反映社会印象","D":"诗歌创作者的想象力十分丰富"},"answer":"B","explanation":"文段开篇提到诗源于生活又高于生活，并非是生活的复制品，后面指出诗是生活在作者心中激起的情感浪花，用“需要”表示对策，提到诗歌需要创作者在生活与艺术间的桥梁即艺术感受，引出“艺术感受”这一主题词，后面又提到诗歌创作者通过艺术感受摄取生活元素进而酿造出诗，故文段强调诗歌创造是通过艺术感受完成的，对应B项。A、C、D三项均未提及“艺术感受”这一主题词，排除。\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"2443114","cat":"片段阅读","stem":"飞船和航天飞机在返回地球进入大气层时，总是要进入“黑障”，这时机身与大气层剧烈摩擦燃烧，通讯信号中断，航天员生理感觉痛苦，因而成为太空任务中最危险的关口。飞船的速度非常快，是第一宇宙速度，这样才能让它在轨道上运行。它的速度一旦降低，就会下落，如果速度在进入大气层前降到很低，它就会直线往下掉，这样克服地球引力一直落到可以开伞的高度，需要消耗大量的燃料。因此，飞船在返回地球进入大气层时，不能减缓速度。\n对这段文字概括最为恰当的是：","options":{"A":"飞船在返回地球进入大气层时，速度不能减缓","B":"飞船速度降低，航天员痛苦感觉增强","C":"飞船速度加快有利于飞行安全","D":"飞船和航天飞机在返回地球进入大气层时，进入“黑障”是必经之路"},"answer":"A","explanation":"文段首先指出，飞船和航天飞机进入“黑障”时是太空任务最危险的关口，此时速度一旦降低就会下落，这个过程需要消耗大量的燃料。最后“因此”总结前文，指出飞船返回地球进入大气层时，不能减缓速度。故文段为分总结构，尾句为结论，对应A项。\nB项，文段没有指出速度降低飞行员的痛苦感觉会增强，排除；\nC项，文段没有指出飞船速度加快有利于飞行安全，排除；\nD项，对应文段首句，为结论前部分，非重点，排除。\n故正确答案为A。\n【文段出处】《飞船返回地球应减慢速度还是加快》","no":55,"missingImage":false},{"type":"question","qid":"2443116","cat":"片段阅读","stem":"生物科技是利用科学技术和生物技术，对农业或其他方面进行改造。利用生物体、生物组织、细胞及其成分，综合应用化学、生物学和医药学各学科原理和技术方法制得的用于预防、诊断、治疗和康复保健的制品或其它现代生物技术研制的蛋白质或核酸类药物。由于药物资源有限，含量极微，因而使用高纯度的分离工艺有一定难度，且成本昂贵。用生物基因工程方法生产这些药物，就可以很好地解决这些难题。\n对“这些难题”理解最准确的一项是：","options":{"A":"生物科技是利用科学技术和生物技术","B":"高纯度的分离工艺有一定难度，成本昂贵","C":"药物资源有限，含量极微，高纯度的分离工艺有一定难度","D":"药物资源有限，含量极微，因而成本昂贵"},"answer":"B","explanation":"前文先介绍生物科技的定义，以及其详细应用。然后指出由于一定原因，导致药物“使用高纯度的分离工艺有一定难度，且成本昂贵”，故生物基因工程方法要解决的难题是“使用高纯度的分离工艺有一定难度，且成本昂贵”，对应B项。\nA项，是对生物科技下定义，不是问题的表述，排除；\nC项，“高纯度的分离工艺有一定难度”只对应“这些难题”的一部分，表述片面，排除。\nD项，“成本昂贵”只对应“这些难题”的一部分，表述片面，排除。\n故正确答案为B。","no":56,"missingImage":false},{"type":"question","qid":"2443118","cat":"片段阅读","stem":"横跨江河的大桥两端接岸处，通常被称为桥头，在桥头位置建造的建筑物就是桥头堡。桥头堡最初的建造目的是出于军事防御的需要。由于最初的桥头堡只是一座地堡或堡垒，因此而得名。现在有些大桥修建的桥头堡不再出于军事目的，而是作为一种建筑标志，如著名的南京长江大桥，两端桥头都建有高达70米的桥头堡，并配合雕塑群像，形成宏伟壮观的建筑群体，使大桥更具气势。桥头堡内部还安装了观光电梯，方便游人登桥眺望壮丽的长江风光。除此之外，设置桥头堡还具有利于大桥的交通管理，方便对其进行日常养护等作用。\n最适合做这段文字标题的是：","options":{"A":"建造大桥桥头堡的初衷","B":"桥头堡名字的由来","C":"建造桥头堡的意义","D":"为什么大桥要造桥头堡"},"answer":"D","explanation":"文段首先通过下定义的方式引出桥头堡这一话题，随后介绍了桥头堡最初的建造目的，接下来指出现在有些大桥建造桥头堡的目的是作为“建筑标志”，并通过南京长江大桥进行举例说明，最后通过“除此之外”指出设置桥头堡地另一原因，即便于大桥的管理和养护。故文段通过并列结构指出大桥建造桥头堡的原因，对应D项。\nA、项仅对应“军事防御的需要”一个方面的原因，表述片面，排除；B项“名字的由来”非重点，排除；C项，“建造桥头堡的意义”仅对应“除此之外”之后的内容，表述片面，且不如D项更符合标题吸引读者的特征，排除。\n故正确答案为D。\n【文段出处】《为什么大桥要造桥头堡》","no":57,"missingImage":false},{"type":"question","qid":"2443121","cat":"片段阅读","stem":"柏拉图说：“法律有一部分是为有美德的人制定的，如果他们愿意和平善良地生活，那么法律可以教会他们在与他人的交往中所要遵循的准则；法律也有一部分是为那些不接受教诲的人制定的，这些人顽固不化，没有任何办法能使他们摆脱罪恶。”\n这段话所阐述的法律的规范作用是：","options":{"A":"教育作用  保障作用","B":"指引作用  保障作用","C":"教育作用  强制作用","D":"指引作用  预测作用"},"answer":"C","explanation":"文段为并列结构，根据第一个分句“法律有一部分是为有美德的人制定的......法律可以教会他们在与他人的交往中所要遵循的准则”可知，此处强调的是法律的教育作用；根据第二个分句“法律也有部分是为那些不接受教诲的人制定的，这些人顽固不化，没有任何办法能使他们摆脱罪恶”可知，此处强调的是法律的强制作用，对应C项。“保障作用”并非法律的规范作用，且文中未体现，排除A、B两项；第二个分句强调的是法律的“强制”作用而非“预测”作用，排除D项。\n故正确答案为C。","no":58,"missingImage":false},{"type":"question","qid":"2443122","cat":"片段阅读","stem":"黄河凌汛发生在冬季河水开始封冻和春季河水开始解冻时，是因冰坝阻塞水流甚至带来洪灾的一种河流特有的水文现象。纬度差异是引起凌汛的主要原因。秋末冬初，北部河水首先封冻，南来的未结冰的水流受阻排泄不畅，于是抬高水位，引起凌汛。冬末南部的河水先解冻，而北部河面依然冰层很厚，上游大量的水流夹带冰凌一起下泄，不仅无法破坏下游的冰层，甚至浮冰还会增进冰层的加厚，极易形成冰坝或冰桥，阻塞水流、抬高水位，发生凌汛。如果凌汛与黄河春季的洪汛结合起来，将会产生更大的危害。因此要兴建许多大型的水利工程，防止凌汛泛滥成灾。\n对这段文字概括最为恰当的是：","options":{"A":"黄河凌汛产生的原因","B":"黄河凌汛是一种河流特有的水文现象","C":"防止黄河凌汛泛滥成灾的必要性","D":"黄河凌汛产生的危害"},"answer":"C","explanation":"文段开篇引出“黄河凌汛”这一话题，接着指出引起凌汛的主要原因是纬度差异，并对纬度差异是如何在冬季封冻和春季解冻时对河水造成影响从而引发凌汛进行了具体解释，随后指出黄河凌汛与春季的洪汛结合会产生更大危害。尾句通过结论词“因此”提出对策，强调要兴建许多大型的水利工程，防止凌汛泛滥成灾。故文段重点强调防止黄河凌汛泛滥成灾的必要性，对应C项。\nA项“黄河凌汛产生的原因”非文段重点，文段通过介绍凌汛的成因引出防止凌汛的必要性，排除；B项是对黄河凌汛概念的介绍，非文段重点，排除；D项介绍凌汛的危害同样是为了体现防止凌汛危害发生的必要性，非文段重点，排除。\n故正确答案为C。\n【文段出处】《黄河凌汛的成因是什么？》","no":59,"missingImage":false},{"type":"question","qid":"2443123","cat":"语句表达","stem":"将下列6个句子重新排列，语序正确的是：\n①这条河贯穿南北，盯着一条河看，其实就是纲举目张，在打量一个辽阔而古老的中国\n②它与空间一起支撑起一个勘探世界奥秘的坐标\n③时间是历史，也是文化，还是解决一个个疑问的真相\n④世界沿着运河像布匹一样在我的想象里展开\n⑤在时空交错的坐标里探寻一条河，我相信我看见的是一个复杂、浩瀚的世界\n⑥它还给了我另一个想象世界的维度，那就是时间","options":{"A":"①⑤⑥③②④","B":"④⑥③②⑤①","C":"⑤①④⑥②③","D":"③②⑤④⑥①"},"answer":"B","explanation":"首先观察选项，对比首句。①句出现指代词“这条河”，句中没有其指代的对象，不适合做首句，排除A项。其他三句不好判断，寻找其他线索。③句里对“时间”的作用进行了具体说明，⑥句句尾引出“时间”这一话题，根据行文逻辑，应先引出话题再进行具体展开，故⑥句后接③句，锁定B项。对B项进行验证，逻辑通顺，当选。\n故正确答案为B。\n【文段出处】《徐则臣：在运河里，打量一个辽阔而古老的中国》","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2443063","cat":"数学运算","stem":"某农科院准备挑选2男2女4名科技人员分别去市郊的甲乙丙丁4个乡参加科技支农工作，在报名的人员中有3男4女符合要求，在4名女性中有1位是农科院的副院长，考虑到工作的具体需要，这名副院长不去甲乡，且去丁乡的是女性。符合条件的选法有        种。","options":{"A":"198","B":"216","C":"378","D":"432"},"answer":"A","explanation":"（1）假设去甲乡镇的为男性，同时丁乡镇必须为女性，乙丙无要求，则情况数为：\u003cimg data-k=\"38cecfbb796e\">\u003cimg data-k=\"55aef399efc5\">\u003cimg data-k=\"4e3771a9f7da\">种；\n（2）假设去甲乡镇的为女性且不能为副院长，丁乡镇必须为女性，乙丙无要求，则情况数为：\u003cimg data-k=\"bd64ff1a1634\">\u003cimg data-k=\"d16b1b1d24cc\">\u003cimg data-k=\"0d2704a0625a\">种；\n则符合条件的选法有\u003cimg data-k=\"06576be179d5\">种。\n故正确答案为A。","no":61,"missingImage":false},{"type":"question","qid":"2443065","cat":"数学运算","stem":"某大型相亲类综艺节目举办线下联谊活动，在签到时每人可以抽取一张礼物卡，凡是抽中有编号的礼物卡均有玫瑰花赠送，抽到“谢谢参与”的则赠送一盒面巾纸。带有编号的礼物卡共100张，编号1-100，按礼物卡标签号发放奖品的规则如下：\n（1）标签号为2的倍数，领2枝玫瑰\n（2）标签号为3的倍数，领3枝玫瑰\n（3）标签号既是2的倍数，又是3的倍数可重复领奖\n（4）其他标签号均领1枝玫瑰\n那么本次联谊活动应准备玫瑰花        枝。","options":{"A":"215","B":"232","C":"312","D":"416"},"answer":"B","explanation":"已知1-100满足编号为2的倍数的有\u003cimg data-k=\"7664cd9c0ad1\">个；编号为3的倍数的有\u003cimg data-k=\"906f9969ed1c\">余1，有33个；编号既为2的倍数又为3的倍数即6的倍数有\u003cimg data-k=\"14735786efd8\">余4，有16个。根据二集合容斥原理\u003cimg data-k=\"058189c60a2e\">\u003cimg data-k=\"9adb64caddbd\">\u003cimg data-k=\"b4355a48337f\">，则\u003cimg data-k=\"43896b24fd9e\">\u003cimg data-k=\"d183386e58f8\">，既非2倍数又非3倍数共有\u003cimg data-k=\"3dcfb40aa6e4\">个。因此总计需准备\u003cimg data-k=\"ee0c1fd51b4f\">\u003cimg data-k=\"39b1f1e18dcc\">枝玫瑰。\n故正确答案为B。","no":62,"missingImage":false},{"type":"question","qid":"2443068","cat":"数学运算","stem":"中秋假期，小王请同在一个城市的9位大学同学聚餐。10人围坐一桌，敬酒前小王提出一个建议：每个人要同不相邻的同学喝一杯。如果小王的提议被通过，那么一共要准备        杯酒。","options":{"A":"70","B":"90","C":"140","D":"210"},"answer":"A","explanation":"根据题干条件，每个人要和不相邻的同学喝一杯，总计10人，每人除了自己和左右相邻的两位同学外，不相邻的同学共7名，即每个人需同7名同学喝酒，10人总计需喝\u003cimg data-k=\"8ec39f18a01e\">次。但因每两人只用喝一次，实际只需要喝\u003cimg data-k=\"7cfd2a6e7590\">次，每次互相喝酒的两人各一杯，总共需要准备\u003cimg data-k=\"9c51cd96fe84\">杯酒。\n故正确答案为A。","no":63,"missingImage":false},{"type":"question","qid":"2443074","cat":"数学运算","stem":"有两个班的学生从南部校区到北部校区参加活动，但只有一辆车接送，第一班的学生坐车从学校出发的同时，第二班学生开始步行；车到途中某处，让第一班学生下车步行，车立刻返回接第二班学生上车并直接开到北部校区。学生步行速度为每小时4公里，载学生时车速每小时40公里，空车时车速为每小时50公里。问：要使两班学生同时到达北部校区，第二班学生步行全程的        。","options":{"A":"1/6","B":"1/7","C":"1/10","D":"1/8"},"answer":"B","explanation":"\u003cimg data-k=\"47c1ebb000ae\" style=\"max-width:700px\">\n由于两个班学生的步行速度均为每小时4公里，坐车速度均为每小时40公里，要想同时到达，则两个班学生的步行距离与乘车距离应分别相等。设一班学生步行的路程为x，乘车的路程为y，则最后步行的时间为\u003cimg data-k=\"7c3ecfa0823f\">；车返回和载着二班学生到达终点总共用的时间应为\u003cimg data-k=\"cf53919b5173\">。两者所用时间相同，则\u003cimg data-k=\"6f6fcb51cee7\">，解得\u003cimg data-k=\"17e49ea68c67\">。则学生步行路程占全程的比重为\u003cimg data-k=\"dc9becd5eea3\">。\n故正确答案为B。","no":64,"missingImage":false},{"type":"question","qid":"2443091","cat":"数学运算","stem":"甲乙丙丁四个建筑队分别承担相同的施工任务。由于设备原因，当甲乙丙同时开工时，丁已经干了若干天。经过一番努力，甲用3天，乙用5天，丙用8天，赶上了丁的进度。已知甲的效率是12，乙的效率是8，则丙的效率是        。","options":{"A":"\u0
