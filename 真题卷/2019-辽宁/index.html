cu>        \u003c/u>小时。","options":{"A":"10","B":"8","C":"6","D":"5"},"answer":"A","explanation":"赋值AB两地的距离为12、15的最小公倍数60，则甲、乙无风时的速度分别为\u003cimg data-k=\"7e52d5fad77b\">，\u003cimg data-k=\"0ee4bfe20570\">。则根据条件，逆风时二者的速度分别为\u003cimg data-k=\"8af4b59a07c9\">，\u003cimg data-k=\"15f002f469bd\">。设从A到B的过程中无风时间为\u003cimg data-k=\"d669d0fdad4b\">，逆风时间为\u003cimg data-k=\"e4be4116a16f\">，则\u003cimg data-k=\"71cf8ae7e91b\">，\u003cimg data-k=\"4410aa14c3d5\">，联立①②式解得\u003cimg data-k=\"e74bfa0f97de\">，\u003cimg data-k=\"4624875ba7e8\">，故逆风时间为10小时。\n故正确答案为A。","no":68,"missingImage":false},{"type":"question","qid":"2443108","cat":"数学运算","stem":"在一块草场上老李养了若干头牛和若干只羊。如果只有羊吃草，够吃16天；如果第一天牛吃，第二天羊吃，这样交替，正好整数天吃完；如果第一天羊吃，第二天牛吃，这样交替，那么比上次轮流的做法多吃半天；牛单独吃能够吃        天。","options":{"A":"8","B":"7","C":"6","D":"5"},"answer":"A","explanation":"根据题干条件，方式1：若第一天牛吃，第二天羊吃，这样交替，则按“牛羊牛羊······”依次交替，则每一个周期为2天，每周期效率\u003cimg data-k=\"d56be6634b4c\">；方式2：若第一天羊吃，第二天牛吃，这样交替，则按“羊牛羊牛······” 依次交替，则每一个周期为2天，每周期效率\u003cimg data-k=\"169803d75d45\">，和方式1相同。\n若方式1刚好吃了完整的n个周期，则方式2需要吃完整的n个周期加上半天，由于每个周期方式1和方式2的效率相等，则此时两次的量不同，存在矛盾。若方式1前面吃了完整的n个周期后再用1天吃完，则最后一天为牛吃完，此时方式2前面也吃了完整的n个周期，则倒数第二天为羊吃，最后半天为牛吃，则有\u003cimg data-k=\"25831f47f59b\">\u003cimg data-k=\"2043ea6f5a1a\">\u003cimg data-k=\"6e3df1339ab7\">，可得：\u003cimg data-k=\"68a6cf97d3ad\">，即\u003cimg data-k=\"9ddb8b921b0f\">。赋值牛吃草效率为2，则羊为1，此时总草量\u003cimg data-k=\"25d0c13117c9\">，则牛单独吃需要的时间为\u003cimg data-k=\"c42833733bc6\">天。\n故正确答案为A。 \n注：1.牛吃草问题会说明草匀速生长，本题没有提到草的生长，因此不考虑草生长。\n2.本题若验证会发现若总量看为16份，则方式1牛羊一周期吃草3份，5个周期后还剩1份只需牛吃半天，与整数天矛盾，因此推测可能为命题人在16这里的数据设置存在问题，尽管能解出答案，但数据内部存在矛盾。","no":69,"missingImage":false},{"type":"question","qid":"2443112","cat":"数学运算","stem":"有4个盒子装有红白蓝绿四色粉笔各有若干支。任意2个盒子的粉笔的支数和分别为12、23、31、46、54、65，粉笔支数最多的盒子里同一颜色最多的粉笔至少有        支（没有并列）。","options":{"A":"14","B":"13","C":"12","D":"11"},"answer":"B","explanation":"假设四个盒子装的粉笔数分别为a支、b支、c支、d支，且\u003cimg data-k=\"87f87c5f08ff\">，则最大的两盒支数和\u003cimg data-k=\"6c8eeb7ba4f7\">，第二大的两盒支数和\u003cimg data-k=\"37ba1032479e\">，联立①②式可得\u003cimg data-k=\"f31aec8f2051\">，根据和差同性可得\u003cimg data-k=\"a3a301643ae2\">为奇数，则只可能是23或31，由于\u003cimg data-k=\"4919209f4cd5\">\u003cimg data-k=\"8add1a00b848\">，故不能为23，则\u003cimg data-k=\"6701ecc0dd24\">。联立③④式，解得\u003cimg data-k=\"763f6e0e79d3\">，代入①式解得\u003cimg data-k=\"e5f0c0c8a0ee\">，即粉笔支数最多的盒子里粉笔总数为44支。设其中同一颜色最多的粉笔有x支，要想让x尽量小，则其它几种颜色的粉笔应尽量多，构造数列如下：\n\u003cimg data-k=\"e24cc76d8772\" style=\"max-width:462px\">\n可列式为\u003cimg data-k=\"eaf6cf3466fb\">\u003cimg data-k=\"b3e1832c0be8\">，解得\u003cimg data-k=\"8ce39160b642\">，因x至少为12.5，又x为整数，则x至少为13。\n故正确答案为B。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"2443004","cat":"图形推理","stem":"从四个选项中选最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"9e2f2811c06b\" style=\"max-width:437px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"解法一：图形元素组成相同，但位置无明显规律，继续观察发现，九宫格每一行的三个图形均为轴对称图形，因此问号处应填一个轴对称图形，但选不出唯一答案，因此考虑对称轴的细化。继续观察，发现每一行的三个图形分别都只有一条横向对称轴、只有一条纵向对称轴和有两条相互垂直的对称轴，如下图所示： \n\u003cimg data-k=\"97bcb28642d3\" style=\"max-width:307px\"> \n因此问号处应当填一个只有一条横向对称轴的图形，只有B选项满足。\n故正确答案为B。\n解法二：图形元素组成相同，优先考虑位置规律，九宫格优先横行观察，通过相邻比较发现，第一行相邻两幅图之间有且只有两条直线发生了位置变化；第二行验证此规律成立，第三行运用此规律，问号处应选择一个跟前一幅图“有且只有两条直线发生了变化”的选项，排除AC两项；九宫格横行观察选不出唯一答案，考虑竖着看，再次观察发现，第一列相邻两幅图之间也满足有且只有两条直线发生了变化，第二列验证无误，故B项和D项中，只有D项满足和第三列的图2有且只有两条直线发生了变化，D项当选。\n故正确答案为D。\n解法三：图形元素组成相同，但位置无明显规律。九宫格每格可划分为2×2的小格子，且每个小方格内有1条斜线，斜线只有两种，考虑黑白运算，九宫格优先看横行，观察发现：相同斜线叠加后变为“/”（如下图黄框内），不同斜线叠加后变为“\\”（如下图红框内），经验证第二行也符合规律，第三行应用规律，只有B项符合。\n\u003cimg data-k=\"a3179b0d338f\" style=\"max-width:540px\">\n故正确答案为B。\n此题有三种思路，但其中两种解法答案都是B，此外，对称性考频相对较高，且以往考过类似题目特征的图形题，考查的也是对称性这一考点，因此经过教研，粉笔倾向于答案B。","no":71,"missingImage":false},{"type":"question","qid":"2443006","cat":"图形推理","stem":"从四个选项中选最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"31af1d0954a1\" style=\"max-width:563px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"题干每幅图均有小黑点，且小黑点的个数分别是：2、1、2、1、2、？，因此问号处应填入小黑点数量为1的选项，排除A、B，剩下C、D两项，对比选项发现唯一区别在于小三角形内部黑点位置不一样；继续观察题干发现，利用时针法从三角形内部的黑点出发，经过直角画向另一条直角边的时候，图1、图3和图5的时针方向一致，均为逆时针，图2、图4的时针方向一致，均为顺时针，如下图所示： \n \u003cimg data-k=\"959102bbe696\" style=\"max-width:529px\">\n因此问号处应填入和图2、图4时针方向一致的选项，只有C项符合。\n故正确答案为C。","no":72,"missingImage":false},{"type":"question","qid":"2443007","cat":"图形推理","stem":"从四个选项中选最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"422c32001303\" style=\"max-width:606px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"图形元素组成不同，属性无明显规律，考虑数量规律。观察发现，题干每幅图均是圆作为外框，且内部线条交叉明显，优先考虑数点。题干图形框上交点依次为0、1、2、？、4，内部交点依次为：1、2、3、？、3，框上交点和内部交点数作差的绝对值均为1，只有C项符合。\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"2443009","cat":"图形推理","stem":"左边给出的是纸盒的外表图，由它折叠而成的一项是：\n\u003cimg data-k=\"ed8b4d12a0dd\" style=\"max-width:639px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"将展开图的面标上序号，如下图所示：\n\u003cimg data-k=\"8d9af06d4b92\" style=\"max-width:178px\">\nA项：与题干展开图一致，当选；\nB项：正面是c面，从c面画边， 如下图所示：\n\u003cimg data-k=\"fdf82721b5db\" style=\"max-width:332px\">\n展开图中边1对应是的d面，而B项中边1对应的不是d面，选项与题干不一致，排除；\nC项：选项中顶面和右面为面b和面e，如下图所示，题干展开图中面b和面e的公共边挨着面b中带箭头的三角形和面e中的空白三角形：\n\u003cimg data-k=\"241deb4765b9\" style=\"max-width:203px\">\n而选项中两个面的公共边挨着两个面中的空白三角形：\n\n\u003cimg data-k=\"8658aab0eac0\" style=\"max-width:133px\">\n选项与题干展开图不一致，排除；\nD项：顶面为c面，从c面开始画边，如下图所示：\n\u003cimg data-k=\"6fe383adb365\" style=\"max-width:297px\">\n展开图中，边3对应的是b面，而D项中边3对应的不是b面，选项与题干不一致，排除。\n故正确答案为A。","no":74,"missingImage":false},{"type":"question","qid":"2443011","cat":"图形推理","stem":"把下面六个图形分为两类，使得每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"2dd6d9722264\" style=\"max-width:395px\">","options":{"A":"①②③  ④⑤⑥","B":"①④⑤  ②③⑥","C":"①③⑥  ②④⑤","D":"①③⑤  ②④⑥"},"answer":"D","explanation":"本题为分组分类。通过观察发现，图①③⑤均有一条竖线，图②④⑥均有空白矩形，因此图①③⑤为一组，②④⑥为一组，对应D项。\n故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"2443015","cat":"图形推理","stem":"从四个选项中选最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"57f02d3fa54b\" style=\"max-width:622px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"图形元素组成相同，优先考虑位置规律。观察发现，黑色三角形每次逆时针平移3格，小白圆圈每次顺时针平移2格，排除D项；最外圈阴影部分的线条与最中间阴影部分线条的方向依次是平行、垂直、平行、垂直、平行、？，因此问号处应当填一个垂直的，只有A符合。\n故正确答案为A。","no":76,"missingImage":false},{"type":"question","qid":"2443055","cat":"定义判断","stem":"概念的内涵是指概念所反映的对象的本质属性，它是概念质的规定性，说明概念所反映的对象是什么样。\n根据上述定义，下列属于从概念的内涵加以说明的是：","options":{"A":"存储-转发信息系统是无论文书或其他信息等数字形式的文本、数字数据都能够通过该系统进行发送和接收","B":"社会关系包括经济、思想、政治、文化以及家庭等各方面的关系","C":"独角兽公司是指那些估值达到10亿美元以上的初创企业","D":"5G是4G之后的延伸"},"answer":"C","explanation":"第一步：找出定义关键词。\n“概念所反映的对象的本质属性”、“说明概念所反映的对象是什么样”。\n第二步：逐一分析选项。\nA项：存储-转发信息系统是无论文书或其他信息等数字形式的文本、数字数据都能够通过该系统进行发送和接收，只是说明文本、数字数据都能够通过该系统进行发送和接收，并没有指出该系统的特点和属性，不符合“概念所反映的对象的本质属性”，不符合定义，排除；\nB项：社会关系包括经济、思想、政治、文化以及家庭等各方面的关系，是在具体举例说明哪些情况属于社会关系，没有指出社会关系的本质属性，不符合“概念所反映的对象的本质属性”，不符合定义，排除；\nC项：独角兽公司是指那些估值达到10亿美元以上的初创企业，指出独角兽公司的属性是估值达到10亿美元以上、初创企业，符合“概念所反映的对象的本质属性”，也符合“说明概念所反映的对象是什么样”，符合定义，当选；\nD项：5G是4G之后的延伸，没有指出5G的本质属性，不符合“概念所反映的对象的本质属性”，不符合定义，排除。\n故正确答案为C。","no":77,"missingImage":false},{"type":"question","qid":"2443059","cat":"定义判断","stem":"饥饿营销是指商品提供者有意调低产量，以期达到调控供求关系、制造供不应求假象、维持商品较高售价和利润，以达到维护品牌形象、提高产品附加值的目的。\n根据上述定义，下列属于饥饿营销的是：","options":{"A":"在楼市旺季某开发商每次只开卖一栋楼，还张榜公布销售情况形成临时性缺货或只剩少数存量假象，造成人多排队、加价购买等热销氛围","B":"全球某大车企为了调整产品结构，对某品牌汽车减低产量","C":"苹果平板电脑iPad刚上市很热销，有时断货，造成一些时尚人士找店长预留，甚至高价买水货","D":"小米手机曾制定用户需先预定排号，根据排位顺序付款发货销售方式，从而引起大家对小米手机的关注，形成热销"},"answer":"A","explanation":"第一步：找出定义关键词。\n“商品提供者有意调低产量”、“调控供求关系、制造供不应求假象、维持商品较高售价和利润”、“以达到维护品牌形象、提高产品附加值的目的”。\n第二步：逐一分析选项。\nA项：开发商每次只开卖一栋楼，符合“商品提供者有意调低产量”，形成临时性缺货或只剩少数存量假象，造成人多排队、加价购买，符合“调控供求关系、制造供不应求假象、维持商品较高售价和利润”，符合定义，当选； \nB项：大车企为了调整产品结构，对汽车减低产量，不符合“调控供求关系、制造供不应求假象”，不符合定义，排除；\nC项：iPad刚上市很热销，有时断货，不符合“商品提供者有意调低产量”，也不符合“调控供求关系、制造供不应求假象”，不符合定义，排除；\nD项：小米手机曾制定用户需先预定排号，根据排位顺序付款发货销售方式，不符合“商品提供者有意调低产量”，也不符合“调控供求关系、制造供不应求假象”，不符合定义，排除。\n故正确答案为A。","no":78,"missingImage":false},{"type":"question","qid":"2443071","cat":"定义判断","stem":"授权是指主管或领导者按层次领导原则委授副职或下属以一定责任与部分理事权，使副职或下属在其领导、监督下有相应的自主权和行动指挥权，被授权者对授权者负有报告及完成之责。\n根据上述定义，下列属于授权的是：","options":{"A":"因去党校学习王校长将报销业务交由校长助理审批","B":"财务处长每月将公司财务信息汇报给董事会","C":"小张因为没找到车间主任，而直接找经理请假","D":"张厂长让秘书替他准备午餐"},"answer":"A","explanation":"第一步：找出定义关键词。\n“主管或领导者”、“按层次领导原则委授副职或下属以一定责任与部分理事权, 使副职或下属在其领导、监督下有相应的自主权和行动指挥权”。\n第二步：逐一分析选项。\nA项：王校长将报销业务交由校长助理审批，校长助理获得了审批报销业务的权限，符合“按层次领导原则委授副职或下属以一定责任与部分理事权, 使副职或下属在其领导、监督下有相应的自主权和行动指挥权”，符合定义，当选； \nB项：财务处长每月将公司财务信息汇报给董事会，财务处长只是汇报并没有获得董事会的授权，不符合定义，排除；\nC项：小张因为没找到车间主任，而直接找经理请假，小张只是请假并没有获得授权，不符合定义，排除；\nD项：张厂长让秘书替他准备午餐，秘书准备午餐并没有获得授权，不符合定义，排除。\n故正确答案为A。","no":79,"missingImage":false},{"type":"question","qid":"2443076","cat":"定义判断","stem":"滚动调查是指一连串在不同时段采用相同内容开展的民意调查，目的是了解民意在时间维度上的变化，例如调查民众对公共服务满意度的变化。\n根据上述定义，下列属于滚动调查的是：","options":{"A":"某公司委托某社会调查公司对不同学历消费者开展调查，了解他们的需求差异","B":"某大学每学期都会在学期初和学期末对学生开展心理健康调查，了解他们的心理健康状况","C":"某区政府每年年初都会对全区居民开展公共服务需求调查，了解居民迫切的民生需要","D":"某健身中心每次课后都会对消费者进行问卷调查，以评价不同健身老师的授课质量"},"answer":"C","explanation":"第一步：找出定义关键词。\n“一连串在不同时段采用相同内容开展的民意调查”、“目的是了解民意在时间维度上的变化”。\n第二步：逐一分析选项。\nA项：某公司委托某社会调查公司对不同学历消费者开展调查，该调查是针对不同学历而不是不同时段，不符合定义，排除； \nB项：某大学每学期都会在学期初和学期末对学生开展心理健康调查，心理健康调查不属于民意调查，不符合定义，排除；\nC项：某区政府每年年初都会对全区居民开展公共服务需求调查，每年年初属于不同时段，居民开展公共服务需求调查，属于民意调查，符合“一连串在不同时段采用相同内容开展的民意调查”，符合定义，当选；\nD项：某健身中心每次课后都会对消费者进行问卷调查，以评价不同健身老师的授课质量，对于健身课程的评价不属于民意调查，不符合定义，排除。\n故正确答案为C。","no":80,"missingImage":false},{"type":"question","qid":"2443080","cat":"定义判断","stem":"邻避效应是指具有负外部性效应的公共设施产生的效用为大众所共享，而带来的风险和成本却由设施附近居民承受，进而导致公众心理上的隔阂，引发居民抵制的现象。\n根据上述定义，下列属于邻避效应的是：","options":{"A":"某社区一楼业主私自开挖地下室，其他楼层业主认为安全受到影响，集体前去阻止施工","B":"某公司拟在格林社区附近修建信号发射塔，但部分居民以信号塔影响风水为由阻止施工","C":"某社区原有变电设施不能满足周边居民用电需求，供电公司拟在附近修建新的变电设施，但附近居民以会产生噪音为理由阻挠施工","D":"某市拟投资兴建一座造纸厂，但相邻胶清市某造纸厂工人认为该厂的修建会影响他们的效益，故前往阻挠施工"},"answer":"C","explanation":"第一步：找出定义关键词。\n“产生的效用为大众所共享”、“带来的风险和成本却由设施附近居民承受”、“公众心理上隔阂，引发居民抵制”。\n第二步：逐一分析选项。\nA项：一楼业主私自开挖地下室，是为了自己用，不符合“产生的效用为大众所共享”， 不符合定义，排除；\nB项：公司拟修建信号发射塔，符合“产生的效用为大众所共享”，但部分居民以影响风水为由阻拦，风水没有体现风险和成本，不符合“带来的风险和成本却由设施附近居民承受”，不符合定义，排除；\nC项：供电公司拟在附近修建新的变电设施，符合“产生的效用为大众所共享”，附近居民以会产生噪音为理由阻挠施工，符合“带来的风险和成本却由设施附近居民承受”、“公众心理上隔阂，引发居民抵制”，符合定义，当选；\nD项：相邻胶清市某造纸厂工人认为新修建的造纸厂会影响他们的效益，不符合“带来的风险和成本却由设施附近居民承受”、“公众心理上隔阂，引发居民抵制”，不符合定义，排除。\n故正确答案为C。","no":81,"missingImage":false},{"type":"question","qid":"2443084","cat":"定义判断","stem":"侧向思维方法是指利用其他领域的观念、知识或方法来寻找解决本领域某个问题的可能途径和思路的一种方式。\n根据上述定义，下列不属于运用侧向思维方法的是：","options":{"A":"鲁班由于茅草的细齿刮破手指而发明了锯","B":"格拉塞通过观察啤酒泡沫的现象，提出了气泡室的设想","C":"居里夫人根据实验室中看到的蓝光，发现了天然放射性元素“镭”","D":"奥地利的医生奥恩布鲁格，受到敲酒桶凭叩击声就能知道桶内有多少酒的启发，想出以“叩诊”的方法诊断人体胸腔中是否有积水"},"answer":"C","explanation":"第一步：找出定义关键词。\n“利用其他领域的观念、知识或方法”、“寻找解决本领域某个问题的可能途径和思路”。\n第二步：逐一分析选项。\nA项：鲁班由于茅草的细齿刮破手指而发明了锯，茅草和锯是不同的领域，符合“利用其他领域的观念、知识或方法”、“寻找解决本领域某个问题的可能途径和思路”，符合定义，排除；\nB项：通过观察啤酒泡沫的现象，提出了气泡室的设想，啤酒泡沫和气泡室是不同的领域，符合“利用其他领域的观念、知识或方法”、“寻找解决本领域某个问题的可能途径和思路”，符合定义，排除；\nC项：根据实验室中看到的蓝光，发现了天然放射性元素“镭”，是通过相关的实验得到相关的发现，不符合“利用其他领域的观念、知识或方法”、“寻找解决本领域某个问题的可能途径和思路”，不符合定义，当选；\nD项：受到敲酒桶凭叩击声判断桶内有多少酒的启发，想出“叩诊”的方法，敲酒桶和叩诊是不同的领域，符合“利用其他领域的观念、知识或方法”、“寻找解决本领域某个问题的可能途径和思路”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":82,"missingImage":false},{"type":"question","qid":"2443088","cat":"定义判断","stem":"水下文化遗产是指经历至少100年的周期性或连续性的、部分或全部位于水下的具有文化、历史或考古价值的所有人类生存的遗迹。\n根据上述定义，下列属于水下文化遗产的是：","options":{"A":"我国南沙群岛附近海域历时数百万年形成的珊瑚礁群","B":"我国道光年间在苏门答腊和爪哇岛之间触礁沉没的商船“泰兴号”","C":"迪拜于上世纪末在海中以人工岛方式建造的世界第一座七星级观光酒店","D":"希腊克里特岛上发掘出的公元前10000年至公元前3300年新石器文化遗迹"},"answer":"B","explanation":"第一步：找出定义关键词。\n“经历至少100年的周期性或连续性”、“部分或全部位于水下”、“具有文化、历史或考古价值的所有人类生存的遗迹”。\n第二步：逐一分析选项。\nA项：我国南沙群岛附近海城历时数百万年形成的珊瑚礁群，没有体现出人类生存，不符合“具有文化、历史或考古价值的所有人类生存的遗迹”，不符合定义，排除；\nB项：我国道光年间在苏门答腊和爪哇岛之间触礁沉没的商船“泰兴号”，符合“经历至少100年的周期性或连续性”、“部分或全部位于水下”、“具有文化、历史或考古价值的所有人类生存的遗迹”，符合定义，当选；\nC项：迪拜于上世纪末在海中以人工岛方式建造的酒店，不符合“经历至少100年的周期性或连续性”、“具有文化、历史或考古价值的所有人类生存的遗迹”，不符合定义，排除；\nD项：希腊克里特岛上发掘出的公元前10000年至公元前3300年新石器文化遗迹，没有体现出在哪里发现的，不符合“部分或全部位于水下”，不符合定义，排除。\n故正确答案为B。","no":83,"missingImage":false},{"type":"question","qid":"2443093","cat":"定义判断","stem":"《民法总则》第三十三条规定“具有完全民事行为能力的成年人，可以与其近亲属、其他愿意担任监护人的个人或者组织事先协商，以书面相关法律法条形式确定自己的监护人。协商确定的监护人在该成年人丧失或者部分丧失民事行为能力时，履行监护职责。”这种监护形式被称为意定监护。\n根据上述定义，下列属于意定监护的是：","options":{"A":"杜宇常年在国外工作，其母亲患慢性疾病，部分丧失民事行为能力，故杜宇指定其叔叔作为母亲的监护人","B":"李伯伯膝下无子，孤身一人，得到了邻居王琦常年悉心照顾。今年初，李伯伯和王琦到公证处公证，确定在李伯伯丧失生活自理能力时由王琦担任其监护人","C":"我国法律规定，在福利院收养的孤儿由福利院担任其监护人","D":"丧偶多年的文爷爷与照顾其生活的保姆互生情愫，两人虽然没有领取结婚证，但俨然形成了事实婚姻"},"answer":"B","explanation":"第一步：找出定义关键词。\n “具有完全民事行为能力的成年人”、“与其近亲属、其他愿意担任监护人的个人或者组织事先协商”、“以书面相关法律法条形式确定自己的监护人”、“协商确定的监护人在该成年人丧失或者部分丧失民事行为能力时，履行监护职责” 。\n第二步：逐一分析选项。\nA项：杜宇的母亲部分丧失民事行为能力，杜宇指定其叔叔作为母亲的监护人，不符合“具有完全民事行为能力的成年人”、“与其近亲属、其他愿意担任监护人的个人或者组织事先协商”，不符合定义，排除；\nB项：李伯伯和王琦到公证处公证，符合“具有完全民事行为能力的成年人”、“与其近亲属、其他愿意担任监护人的个人或者组织事先协商”、“以书面相关法律法条形式确定自己的监护人”，确定在李伯伯丧失生活自理能力时由王琦担任其监护人，符合“协商确定的监护人在该成年人丧失或者部分丧失民事行为能力时，履行监护职责”，符合定义，当选；\nC项：在福利院收养的孤儿由福利院担任其监护人，不符合“具有完全民事行为能力的成年人”、“与其近亲属、其他愿意担任监护人的个人或者组织事先协商”，不符合定义，排除；\nD项：丧偶多年的文爷爷与照顾其生活的保姆虽然没有领取结婚证，但俨然形成了事实婚姻，不符合“以书面相关法律法条形式确定自己的监护人”、“协商确定的监护人在该成年人丧失或者部分丧失民事行为能力时，履行监护职责”，不符合定义，排除。\n故正确答案为B。","no":84,"missingImage":false},{"type":"question","qid":"2443100","cat":"类比推理","stem":"（    ）对于 知识 相当于 挑战 对于（    ）","options":{"A":"理解：攀登","B":"学识：理论","C":"学习：极限","D":"文化：迎接"},"answer":"C","explanation":"逐一代入选项。\nA项：理解知识是动宾短语，挑战和攀登之间无明显逻辑关系，前后逻辑关系不一致，排除；\nB项：学识是指学术上的知识和修养，理论和挑战之间无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：学习知识是动宾短语，挑战极限是动宾短语，前后逻辑关系一致，当选；\nD项：文化和知识之间无明显逻辑关系，迎接挑战是动宾短语，前后逻辑关系不一致，排除。\n故正确答案为C。","no":85,"missingImage":false},{"type":"question","qid":"2443016","cat":"类比推理","stem":"编辑部 对于（    ） 相当于 （    ） 对于 学校","options":{"A":"作者：校园","B":"档案处：学生处","C":"期刊：学生","D":"出版社：教务处"},"answer":"D","explanation":"逐一代入选项。\nA项：编辑部可以联系作者投稿，二者是对应关系，学校和校园是全同关系，前后逻辑关系不一致，排除；\nB项：编辑部和档案处是两个部门，二者是并列关系，学生处是学校的组成部分，二者是组成关系，前后逻辑关系不一致，排除；\nC项：编辑部编辑期刊，二者是工作内容的对应，学生在学校里面，二者是地点的对应，前后逻辑关系不一致，排除；\nD项：编辑部是出版社的组成部分，教务处是学校的组成部分，前后逻辑关系一致，当选。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"2443019","cat":"类比推理","stem":"弓箭：枪炮：战争","options":{"A":"毛笔：钢笔：书法","B":"马车：汽车：运输","C":"书籍：电脑：学习","D":"广播：电视：宣传"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n弓箭和枪炮都是战争中使用的武器，二者是并列关系，且弓箭出现的时间要早于枪炮，战争是名词。\n第二步：判断选项词语间逻辑关系。\nA项：毛笔和钢笔是书法中会用到的工具，二者是并列关系，且毛笔出现的时间要早于钢笔，书法是名词，与题干逻辑关系一致，当选；\nB项：马车和汽车是运输过程中会用到的工具，二者是并列关系，同时运输也可以作为动词，马车和汽车都具有运输的功能，前两个词与第三个词也能构成功能对应，与题干逻辑关系不一致，排除；\nC项：书籍和电脑是学习中会使用到的工具，二者是并列关系，同时学习也可以作为动词，书籍和电脑可以用来学习，前两个词与第三个词构成功能对应，与题干逻辑关系不一致，排除；\nD项：广播和电视是宣传中会使用到的工具，二者是并列关系，同时宣传也可以作为动词，广播和电视都具有宣传的功能，前两个词与第三个词构成功能对应，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"2443020","cat":"类比推理","stem":"侵犯：指责：愤怒","options":{"A":"赞赏：感谢：真诚","B":"帮助：道歉：谅解","C":"误解：解释：无意","D":"抢劫：反抗：犯罪"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n先侵犯别人，再受到指责，二者具有时间的先后顺序；愤怒的指责，二者构成偏正短语。 \n第二步：判断选项词语间逻辑关系。\nA项：先赞赏别人，再受到感谢；真诚的感谢，二者构成偏正短语，与题干逻辑关系一致，当选；\nB项：帮助和道歉无明显先后顺序，与题干逻辑关系不一致，排除；\nC项：无意不能用来形容解释，与题干逻辑关系不一致，排除；\nD项：“犯罪”不能用来形容“反抗”，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":88,"missingImage":false},{"type":"question","qid":"2443022","cat":"类比推理","stem":"语言：简洁","options":{"A":"骨骼：清奇","B":"想象：丰富","C":"彷徨：徘徊","D":"坦途：捷径"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n简洁的语言，二者为偏正关系。\n第二步：判断选项词语间逻辑关系。\nA项：清奇的骨骼，二者为偏正关系，与题干逻辑关系一致，保留；\nB项：丰富的想象，二者为偏正关系，与题干逻辑关系一致，保留；\nC项：彷徨指徘徊走来走去，犹豫不决，二者为近义关系，与题干逻辑关系不一致，排除；\nD项：有的坦途是捷径，有的捷径是坦途，二者为交叉关系，与题干逻辑关系不一致，排除。\n比较A、B两项，题干中的语言和B项中的想象都是抽象名词，而A项中的骨骼是具体名词，B项比A项与题干逻辑关系更为一致。\n故正确答案为B。","no":89,"missingImage":false},{"type":"question","qid":"2443024","cat":"类比推理","stem":"猪八戒：唐僧","options":{"A":"周公：比干","B":"夸父：女娲","C":"哪吒：姜子牙","D":"黄帝：炎帝"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n猪八戒是唐僧的徒弟，二者为上下辈分的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：周公指周文公，是周朝政治家、军事家、哲学家；比干是商王文丁庶子，商王帝乙之弟，商纣王帝辛子受之叔，殷商王室的重臣。二者并非上下辈分的对应关系，与题干逻辑关系不一致，排除；\nB项：夸父与女娲是两位远古时期的神话人物，二者为并列关系，与题干逻辑关系不一致，排除；\nC项：姜子牙和太乙真人都是元始天尊的徒弟，二人是师兄弟关系，哪吒的师傅是太乙真人，因此姜子牙是哪吒的师叔。二者为上下辈分的对应关系，与题干逻辑关系一致，当选；\nD项：黄帝与炎帝是两位不同的部落首领，二者为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":90,"missingImage":false},{"type":"question","qid":"2443026","cat":"类比推理","stem":"平面三角形：内角和180度","options":{"A":"恒星：太阳","B":"磁铁：南极北极","C":"军人：手枪","D":"电话：电波"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n平面三角形必然存在内角和180度的属性，二者为必然属性对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：太阳是一颗恒星，二者为包容关系中的种属关系，与题干逻辑关系不一致，排除；\nB项：磁铁的两端会各指向地球南方和北方，指向北方的一端称为北极，指向南方的一端为南极，磁铁必然有南极北极，与题干逻辑关系一致，当选；\nC项：手枪是军人的武器，二者为职业与工具之间的对应关系，与题干逻辑关系不一致，排除；\nD项：电话利用电波进行信息通讯，二者为对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":91,"missingImage":false},{"type":"question","qid":"2443027","cat":"类比推理","stem":"亏损：收入：成本","options":{"A":"贸易顺差：进口：出口","B":"负债：借钱：还钱","C":"价格上涨：需求：供给","D":"库存：入库：出库"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n收入小于成本会产生亏损。\n第二步：判断选项词语间逻辑关系。\nA项：进口小于出口会产生贸易顺差，与题干逻辑关系一致，当选；\nB项：还钱数小于借钱数会产生负债，但还钱与借钱词语顺序相反，与题干逻辑关系不一致，排除；\nC项：供给小于需求会导致价格上涨，但需求与供给词语顺序相反，与题干逻辑关系不一致，排除；\nD项：入库小于出库会使库存数量减少，而不是“库存”，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":92,"missingImage":false},{"type":"question","qid":"2443029","cat":"类比推理","stem":"有甲乙丙丁戊五个人参加比赛，比赛结束后，有己庚辛壬癸五个人对他们的名次做了如下判断\n己：甲第一名，乙第二名\n庚：丁第四名，戊第五名\n辛：丙第三名，乙第二名\n壬：甲第一名，丁第四名\n癸：丙第四名，戊第五名\n赛后名次公布之后发现，己庚辛每人最多猜对了一半，壬癸至少猜对了一半。则甲乙丙丁戊的名次依次是：","options":{"A":"13425","B":"21345","C":"12453","D":"53412"},"answer":"A","explanation":"第一步：分析题干。\n本题为组合排列，题干五句话有真有假，即题干条件不确定，优先用代入法来解题。\n代入的选项需满足己庚辛每人最多猜对了一半，壬癸至少猜对了一半。\n第二步：逐一分析选项。\nA项：代入后己半真半假，庚半真半假，辛全假，壬半真半假，癸全真，满足题干要求，当选；\nB项：代入后己全假，但庚全真不满足题干要求，排除；\nC项：代入后己全真不满足题干要求，排除；\nD项：代入后己全假，庚全假，辛全假，但壬全假不满足题干要求，排除。\n故正确答案为A。","no":93,"missingImage":false},{"type":"question","qid":"2443031","cat":"逻辑判断","stem":"有三个小伙伴去吃火锅，点餐的时候他们对服务员讲了如下的话：\n甲：或者吃鸭血，或者不吃藕片\n乙：只有不吃海带，才吃鸭血\n丙：不吃豆腐泡，除非吃藕片\n按照三位小伙伴的要求，服务员的下列哪种菜品组合一定不符合客人的要求。","options":{"A":"有鸭血和豆腐泡","B":"有海带，没有藕片","C":"有豆腐泡，没有海带","D":"有海带和豆腐泡"},"answer":"D","explanation":"第一步：翻译题干。\n①鸭血 或者 \u003cimg data-k=\"8a927501c838\">藕片\n②鸭血 \u003cimg data-k=\"7b6029b3bbde\"> \u003cimg data-k=\"8a927501c838\">海带\n③豆腐泡 \u003cimg data-k=\"7b6029b3bbde\"> 藕片\n将③①②进行串联可得④豆腐泡\u003cimg data-k=\"7b6029b3bbde\">藕片\u003cimg data-k=\"7b6029b3bbde\">鸭血\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"8a927501c838\">海带。\n第二步：逐一分析选项。\nA项：代入后与④不冲突，排除；\nB项：代入后与④不冲突，排除；\nC项：代入后与④不冲突，排除；\nD项：有海带和豆腐泡，根据④豆腐泡\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"8a927501c838\">海带，说明有豆腐泡就一定没有海带，D项一定不符合，当选。\n本题为选非题，故正确答案为D。","no":94,"missingImage":false},{"type":"question","qid":"2443034","cat":"类比推理","stem":"某班选派学生代表参加校庆活动，张强或者隋雷至少必须有一人参加，同时还需满足以下条件：\n（1）如果有隋雷，就必须有夏伟\n（2）夏伟、张强至多只能有一人\n（3）若有张强，就必须有孙风\n（4）有孙风，就必须有夏伟\n如果以上为真，代表中一定包括以下哪两人？","options":{"A":"张强和夏伟","B":"夏伟和孙风","C":"孙风和隋雷","D":"隋雷和夏伟"},"answer":"D","explanation":"翻译题干如下：\n（1）隋雷\u003cimg data-k=\"7b6029b3bbde\">夏伟\n（2）\u003cimg data-k=\"8a927501c838\">夏伟 或 \u003cimg data-k=\"8a927501c838\">张强\n（3）张强\u003cimg data-k=\"7b6029b3bbde\">孙风\n（4）孙风\u003cimg data-k=\"7b6029b3bbde\">夏伟\n（5）张强 或 隋雷\n将（3）（4）串联为：张强\u003cimg data-k=\"7b6029b3bbde\">孙风\u003cimg data-k=\"7b6029b3bbde\">夏伟，又根据（2）可得张强\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"8a927501c838\">夏伟，则说明张强一定不去，又根据（5）否一推一可得隋雷去，根据（1）可得夏伟去，因此隋雷和夏伟一定去。\n故正确答案为D。","no":95,"missingImage":false},{"type":"question","qid":"2443036","cat":"逻辑判断","stem":"当前一些教师授课过程中存在知识更新不及时、授课态度不端正、教学方法不科学的问题。之所以会出现这三个问题，根本原因是教师考核过程中存在的重科研、轻教学的倾向。除非改变考核中教学评价占比过低的现状，教师才有积极性及时更新知识、授课态度才能更加端正、教学方法才能更加科学。对于学生而言，如果这三个问题不能得到有效解决，就很难激发起他们的学习兴趣。\n如果上述陈述为真，则以下哪一项论断必定为真？","options":{"A":"如果学生的学习兴趣没有激发起来，那一定是这三个问题没有得到有效解决","B":"如果学生的学习兴趣激发起来了，那一定是教师考核中提高了教学评价的占比","C":"如果教师的教学态度没有端正起来，则说明教师考核中教学占比仍然较低","D":"只要解决了这三个问题，学生的学习兴趣就一定能激发起来"},"answer":"B","explanation":"第一步：翻译题干。\n（1）积极性及时更新知识\u003cimg data-k=\"2dfb7d1f72f3\">改变考核中教学评价占比过低的现状；\n（2）授课态度能更加端正\u003cimg data-k=\"2dfb7d1f72f3\">改变考核中教学评价占比过低的现状；\n（3）教学方法能更加科学\u003cimg data-k=\"2dfb7d1f72f3\">改变考核中教学评价占比过低的现状；\n（4）-有效解决这三个问题\u003cimg data-k=\"2dfb7d1f72f3\">-激发起学生的学习兴趣。\n第二步：逐一分析选项。\nA项：\u003cimg data-k=\"e752a8ae1a16\">激发起学生的学习兴趣\u003cimg data-k=\"1ea22d0695fd\">有效解决这三个问题，这是对条件（4）的肯后，肯后得不到确定结论，排除；\nB项：学生的学习兴趣激发起来了\u003cimg data-k=\"2dfb7d1f72f3\">教师考核中提高了教学评价的占比，这是对条件（4）的否后，否后必否前，可以得出有效解决了“知识更新不及时、授课态度不端正、教学方法不科学”这三个问题，这是对条件（1）的肯前，肯前必肯后，可推出改变了考核中教学评价占比过低的现状。该项可以推出，当选；\nC项：-教师的教学态度端正\u003cimg data-k=\"2dfb7d1f72f3\">教师考核中教学占比仍然较低，这是对条件（2）的否前，否前得不到确定结论，排除；\nD项：解决了这三个问题\u003cimg data-k=\"2dfb7d1f72f3\">学生的学习兴趣能激发起来，这是对条件（4）的否前，否前得不到确定结论，排除。\n故正确答案为B。","no":96,"missingImage":false},{"type":"question","qid":"2443038","cat":"逻辑判断","stem":"赵甲、钱乙、孙丙、李丁和周戊分别住在赵楼、钱屯、孙家堡、李庄和周店五个村中。已知：\n（1）每人的姓氏与所在村庄的第一个字不同\n（2）赵甲和孙丙不住在李庄\n（3）钱乙不住在孙家堡或周店\n（4）李丁不住在赵楼或钱屯\n（5）周戊不住在钱屯或赵楼\n（6）除非赵甲住李庄，钱乙才住李庄\n（7）若赵甲住孙家堡，则孙丙住李庄\n根据以上信息可以得出以下哪项？","options":{"A":"李丁住孙家堡","B":"钱乙住李庄","C":"孙丙住周店","D":"赵甲住钱屯"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）每个人的姓氏与所在村庄的第一个字不同；\n（2）甲不住李庄 且 丙不住李庄；\n（3）乙不住孙家堡 且 乙不住周店；\n（4）丁不住赵楼 且 丁不住钱屯；\n（5）戊不住赵楼 且 戊不住钱屯；\n（6）乙住李庄\u003cimg data-k=\"2dfb7d1f72f3\">甲住李庄；\n（7）甲住孙家堡\u003cimg data-k=\"2dfb7d1f72f3\">丙住李庄。\n第二步：根据题干条件进行推理。\n根据条件（2）甲不住李庄且丙不住李庄，结合条件（6）可知，乙不住在李庄；再结合条件（1）可知丁也不住李庄，故只能是戊住在李庄，排除B项；\n根据条件（2）丙不住李庄，结合条件（7）可知，甲不住在孙家堡，再根据条件（1）（3）可知乙和丙都不住在孙家堡，故只能是丁住在孙家堡，对应A项。\n故正确答案为A。\n注：本题条件（3）（4）（5）中虽然出现“或”，但表达意思为“且”，如条件（3）钱乙不住在孙家堡或周店，意思是钱乙既不住在孙家堡也不住在周店，翻译成“且”更满足条件实际含义。","no":97,"missingImage":false},{"type":"question","qid":"2443039","cat":"逻辑判断","stem":"一个国家只有立足粮食基本自给，才能掌握粮食安全主动权，进而才能掌控经济社会发展这个大局。而只有守住今天的耕地，才能守住明天的饭碗，如果耕地守不住，粮食生产就成了无本之木、无源之水，我们就没有了赖以吃饭的“命根子”。由此可以推出：","options":{"A":"守住耕地就可以确保粮食安全无虞","B":"确保粮食自给意味着掌握了粮食安全主动权","C":"如果能够确保粮食生产，意味着我们守住了耕地","D":"之所以能掌控经济社会发展大局是因为做到了粮食基本自给"},"answer":"C","explanation":"第一步：翻译题干。\n①粮食安全主动权\u003cimg data-k=\"2dfb7d1f72f3\">粮食基本自给\n②掌控经济社会发展大局\u003cimg data-k=\"2dfb7d1f72f3\">粮食安全主动权\n③守住明天饭碗\u003cimg data-k=\"2dfb7d1f72f3\">守住今天耕地\n④\u003cimg data-k=\"e752a8ae1a16\">守住今天耕地\u003cimg data-k=\"2dfb7d1f72f3\">粮食生产成了无本之木、无源之水\n⑤\u003cimg data-k=\"e752a8ae1a16\">守住今天耕地\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">“命根子”\n第二步：逐一分析选项。\nA项：翻译为守住耕地\u003cimg data-k=\"2dfb7d1f72f3\">粮食安全无虞，是对④的否前，否前不确定，排除；\nB项：翻译为粮食自给\u003cimg data-k=\"2dfb7d1f72f3\">掌握粮食安全主动权，是对①的肯后，肯后不确定，排除；\nC项：翻译为确保粮食生产\u003cimg data-k=\"2dfb7d1f72f3\">守住了耕地，是对④的否后，否后必否前，推出守住耕地，当选；\nD项：选项为因果关系，题干为条件关系，故无法推出，排除。\n故正确答案为C。","no":98,"missingImage":false},{"type":"question","qid":"2443042","cat":"类比推理","stem":"近年来一些地区出现了居民因担心辐射阻挠移动通讯信号基站建设的案例。对此，专家指出，移动通信基站手机频段的电磁辐射平均功率密度为40微瓦/平方厘米，其强度相当于一台电视机或1.5个移动电话充电器。因此，大家大可不必担心移动基站的辐射危害。\n以下哪项如果为真，最能支持专家的结论？","options":{"A":"实际上，人们并不是每天都处于移动基站的辐射范围内","B":"即使有辐射，移动通讯已经成为人们必不可少的通讯工具","C":"低于100微瓦/平方厘米的电磁辐射不会对人体产生伤害","D":"没有哪个人因为电视机有辐射而放弃看电视"},"answer":"C","explanation":"第一步：找到论点和论据\n论点：大家大可不必担心移动基站的辐射危害。\n论据：移动通信基站手机频段的电磁辐射平均功率密度为40微瓦/平方厘米，其强度相当于一台电视机或1.5个移动电话充电器\n论点的话题是基站的辐射对人体没有危害，论据的话题是移动通信基站手机频段的电磁辐射平均功率密度为40微瓦/平方厘米，论点论据话题不一致，优先考虑搭桥。\n第二步：逐一分析选项\nA项：虽然人们不是每天都处于辐射范围内，但不代表移动基站的辐射对人体无危害，只要处于辐射范围内就有可能有危害，无关选项，排除；\nB项：移动通讯是不是必不可少的工具和题干讨论的辐射的危害话题不一致，无关选项，排除；\nC项：40微瓦低于100微瓦/平方厘米，对人体无危害，在论点论据间建立联系，搭桥，当选；\nD项：该项讨论的是看电视，不是移动基站，类比加强选项力度极弱，排除。\n故正确答案为C。","no":99,"missingImage":false},{"type":"question","qid":"2443043","cat":"逻辑判断","stem":"相关资料显示，国内出现丁克家族大概是在上世纪90年代。进入工业社会，消费取代生产成为家庭的基本经济功能，知识取代体力成为主要人力资本，人口质量取代数量决定家庭的经济效益，社会化与社会保障将赡养外移至社会机构，生育的价值降低，不再是家庭的“必需品”和“生命的必要构成”，不育成为自由权利。所以，近年来选择做丁克的家庭有明显上升的趋势。为此，有专家预言丁克现象会对中国的二孩生育政策造成冲击和影响。\n若以下选项均为真，最能对专家的预言进行削弱的是：","options":{"A":"丁克家族的增多是社会发展到一定程度后必然出现的现象，背后反映的是中国人价值观的变迁","B":"丁克在中国仍然是小众，是部分中国人的生育态度，是可以接受的自然选择，不会对中国的二孩生育政策造成任何冲击和影响","C":"城市化的快速发展，年轻、适龄生育人口涌向大城市，随之而来的工作难、房价高、生育成本上涨，是选择不生二胎的主要原因","D":"结婚十年一直做丁克族的小王夫妇被国家二胎政策所触动生育了一名男婴"},"answer":"B","explanation":"第一步：找到论点和论据\n论点：丁克现象会对中国的二孩生育政策造成冲击和影响。\n论据：无\n本题只有论点没有论据，前面的文段都是背景情况交代，优先考虑否定论点，即丁克不会对中国的二孩生育政策造成冲击。\n第二步：逐一分析选项\nA项：中国人的价值观和二孩生育政策话题不一致，无关选项，排除；\nB项：丁克不会对中国的二孩生育政策造成任何冲击和影响，否定论点，当选；\nC项：其他原因也能导致二孩生育政策受影响，他因削弱，力度较弱，排除；\nD项：小王夫妇只是个例，其他人是否受影响不确定，没办法否定整个中国的情况，削弱力度较弱，排除。\n故正确答案为B。","no":100,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2019年1-8月，全国房地产开发投资84589亿元，同比增长\u003cimg data-k=\"ad773022e364\">，增速比1-7月回落0.1个百分点。其中，住宅投资65187亿元，增长\u003cimg data-k=\"562e626cdd42\">，增速回落0.2个百分点。\u003c/p>\u003cp>        1-8月，东部地区房地产开发投资44857亿元，同比增长\u003cimg data-k=\"793465e28a89\">，增速比1-7月回落0.4个百分点；中部地区投资17809亿元，增长\u003cimg data-k=\"91d1b1e3d61b\">，增速加快0.3个百分点；西部地区投资18506亿元，增长\u003cimg data-k=\"486e12acca4c\">，增速加快0.9个百分点；东北地区投资3418亿元，增长\u003cimg data-k=\"edd474a40bb0\">，增速回落1.3个百分点。\u003c/p>\u003cp>        1-8月，房地产开发企业土地购置面积12236万平方米，同 <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
