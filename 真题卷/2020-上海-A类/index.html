<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2020年上海市公务员录用考试《行测》题（A类）（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>

      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>

    <button class="btn" id="settingsBtn">设置</button>

</div>

<div class="wrap">

</div>

<div class="bottombar">

    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>
<div class="toast" id="toast"></div>

window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2020-上海-A类","title":"2020年上海市公务员录用考试《行测》题（A类）（网友回忆版）","year":"2020","group":"上海","modules":[{"label":"政治理论","items":[{"type":"material","material":"\u003cp>        习近平总书记指出：“当代中国的伟大社会变革，不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版。”实践证明，中国特色社会主义道路是一条既符合中国国情，又适合时代发展要求并取得巨大成功的唯一正确道路。只有这条道路而没有别的道路，能够引领中国进步、增进人民福祉、实现民族复兴。我们必须坚定道路自信、理论自信、制度自信、文化自信。\u003c/p>\u003cp>\u003cspan style=\"color:#000000\">        \u003c/span>在中国特色社会主义新时代，完成伟大事业必须靠党的领导。中国特色社会主义制度的最大优势是中国共产党领导。今天，我们比历史上任何时期都更接近、更有信心和能力实现中华民族伟大复兴的目标。习近平总书记指出：“行百里者半九十。中华民族伟大复兴，绝不是轻轻松松、敲锣打鼓就能实现的。全党必须准备付出更为艰巨、更为艰苦的努力。”\u003c/p>","questions":[{"qid":"2452916","cat":"新思想","stem":"坚定中国特色社会主义“四个自信”，说到底是要坚定        。","options":{"A":"制度自信","B":"道路自信","C":"理论自信","D":"文化自信"},"answer":"D","explanation":"本题考查政治常识。\n2016年5月17日,习近平总书记在哲学社会科学工作座谈会上指出,“我们要坚定中国特色社会主义道路自信、理论自信、制度自信,说到底是要坚持文化自信”。\n故正确答案为D。","no":1,"missingImage":false},{"qid":"2452918","cat":"新思想","stem":"实现伟大理想，必须推进伟大事业。习近平总书记指出，改革开放以来党的全部理论和实践的主题是                    。","options":{"A":"以经济建设为中心","B":"建立新中国和改革开放","C":"中国特色社会主义","D":"发展社会主义市场经济"},"answer":"C","explanation":"本题考查政治常识。\n 习总书记在“7·26”重要讲话中指出，中国特色社会主义是改革开放以来党的全部理论和实践的主题，全党必须高举中国特色社会主义伟大旗帜，牢固树立中国特色社会主义道路自信、理论自信、制度自信、文化自信，确保党和国家事业始终沿着正确方向胜利前进。这一重要论断引起了思想理论界和广大干部群众的普遍关注、广泛认同和热烈反响。独特的文化传统，独特的历史命运，独特的基本国情，决定了我们必然要走适合自己特点的发展道路。中国特色社会主义是马克思主义基本原理同中国具体实践和时代特征相结合的产物，是党带领全国各族人民长期实践取得的根本成就，必须倍加珍惜、始终坚持、不断发展。\n故正确答案为C。","no":2,"missingImage":false}]},{"type":"material","material":"\u003cp>        新中国成立不久，中国共产党就把促进“农业和交通运输业的现代化”“建立巩固的现代化国防”写入党在过渡时期总路线。1954年，在第一届全国人民代表大会第一次会议开幕词中，毛泽东同志提出：“准备在几个五年计划之内，将我们现在这样一个经济上文化上落后的国家，建设成为一个工业化的具有高度现代文化程度的伟大国家。”根据这些思想，周恩来同志在政府工作报告中首次提出包括现代化的工业、现代化的农业、现代化的交通运输业和现代化的国防在内的四个现代化目标。此后，四个现代化的内容不断调整完善，从明确提出“实现工业化”到掀起一场“技术革命”，1964年第三届全国人民代表大会第一次会议正式和完整地提出我国实现“四个现代化”的任务。1975年，周恩来同志在第四届全国人民代表大会第一次会议上又重申了分两步走、全面实现四个现代化的战略安排。\u003c/p>\u003cp>\u003cspan style=\"color:#rgb(89,89,89)\"> :"党的政治建设是党的根本性建设"},"answer":"ACD","explanation":"本题考查政治常识。\n A项正确，党的十九大报告中指出，“人民是历史的创造者，是决定党和国家前途命运的根本力量，中国共产党人的初心和使命，就是为中国人民谋幸福，为中华民族谋复兴”。深刻揭示了党同人民的关系，我们在任何情况下、与人民同呼吸共命运的立场不能变，全心全意为人民服务的宗旨不能忘，要始终坚持以人民为中心的发展理念。总理念中的“守初心”正是体现了党始终坚持以人民为中心的发展理念。\nB项错误，党的十六届四中全会提出科学执政、民主执政、依法执政这三种党的执政方式。其中依法执政是新的历史条件下党执政的一个基本方式。科学执政、民主执政要通过依法执政体现出来，又要靠依法执政来保证实现。\nC项正确，党的先进性建设，就是要使我们党保持与时俱进的品质，始终走在时代前列，不断提高执政能力、巩固执政地位、完成执政使命；就是要通过推进思想建设、组织建设、作风建设、制度建设、反腐倡廉建设，使党的理论和路线、方针、政策始终体现社会发展进步的要求和全国各族人民的利益，不断提高广大党员的素质和各级党组织的创造力、凝聚力、战斗力，始终发挥党员的先锋模范作用，始终发挥党组织的领导核心作用和战斗堡垒作用。“担使命，找差距”都体现了党重视自身先进性建设，提高执政能力。\n D项正确，党的政治建设是党的根本性建设，决定党的建设方向和效果。重视政治建设是中国共产党的优良传统与特别优势。此次主题会议正是体现了党的政治建设是党的根本性建设。\n故正确答案为ACD。","no":9,"missingImage":false}]},{"type":"material","material":"\u003cp>        新中国成立不久，中国共产党就把促进“农业和交通运输业的现代化”“建立巩固的现代化国防”写入党在过渡时期总路线。1954年，在第一届全国人民代表大会第一次会议开幕词中，毛泽东同志提出：“准备在几个五年计划之内，将我们现在这样一个经济上文化上落后的国家，建设成为一个工业化的具有高度现代文化程度的伟大国家。”根据这些思想，周恩来同志在政府工作报告中首次提出包括现代化的工业、现代化的农业、现代化的交通运输业和现代化的国防在内的四个现代化目标。此后，四个现代化的内容不断调整完善，从明确提出“实现工业化”到掀起一场“技术革命”，1964年第三届全国人民代表大会第一次会议正式和完整地提出我国实现“四个现代化”的任务。1975年，周恩来同志在第四届全国人民代表大会第一次会议上又重申了分两步走、全面实现四个现代化的战略安排。\u003c/p>\u003cp>\u003cspan style=\"color:#rgb(89,89,89)\">        \u003c/span>党的十八大以来，以习近平同志为核心的党中央以巨大的政治勇气和强烈的责任担当，进行伟大斗争、建设伟大工程、推进伟大事业、实现伟大梦想，取得了全方位、开创性成就，实现了深层次、根本性变革，推动中国特色社会主义进入新时代。党的十九大围绕新时代实现中华民族伟大复兴的历史使命，对新时代推进我国社会主义现代化建设作出新的顶层设计，提出分两步走，在21世纪中叶建成社会主义现代化强国的战略安排。\u003c/p>","questions":[{"qid":"2452953","cat":"人文常识","stem":"上述材料表明，                    ，是中华民族的最高利益和根本利益。我们党领导中国人民进行的一切奋斗，归根到底都是为了实现这一伟大目标。","options":{"A":"实现中华民族伟大复兴","B":"全面实现“四个现代化”","C":"建设社会主义现代化强国","D":"建立完整的工业体系和国民经济体系"},"answer":"AC","explanation":"本题考查中国特色社会主义理论体系\n《习近平新时代中国特色社会主义思想学习纲要》中指出：“建设社会主义现代化强国，实现中华民族伟大复兴，是中华民族的最高利益和根本利益。我们党领导中国人民进行的一切奋斗，归根到底都是为了实现这一伟大目标。”从新中国成立到党的十九大召开，四个现代化的内容不断调整完善，党的十九大围绕新时代实现中华民族伟大复兴的历史使命，对新时代推进我国社会主义现代化建设作出新的顶层设计，提出在21世纪中叶建成社会主义现代化强国的战略安排。\n故正确答案为AC。","no":10,"missingImage":false},{"qid":"2452956","cat":"人文常识","stem":"1964年第三届全国人民代表大会第一次会议正式和完整地提出我国实现“四个现代化”的任务是：“在不太长的历史时期内，把我国建设成为一个具有现代农业、现代工业、            的社会主义强国”。","options":{"A":"现代交通运输业","B":"现代国防","C":"现代教育","D":"现代科学技术"},"answer":"BD","explanation":"本题考查中国特色社会主义理论体系\n《周恩来总理在第三届全国人民代表大会第一次会议上作政府工作报告（1964年)》中指出：“周总理说，为了在不太长的历史时期内，把我国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的社会主义强国，我们在今后发展国民经济中，应当注意以下的问题。第一，正确处理农业、轻工业、重工业的关系。第二，正确处理自力更生同国际合作的关系。第三，实行技术革命。第四，实行集中领导同大搞群众运动相结合。”\n故正确答案为BD。","no":11,"missingImage":false},{"qid":"2452958","cat":"人文常识","stem":"改革开放之后，我们党曾提出社会主义现代化建设“三步走”战略目标，即                    。","options":{"A":"解决人民温饱问题","B":"人民生活总体上达到小康水平","C":"全面建成小康社会","D":"基本实现现代化"},"answer":"ABD","explanation":"1987年10月25日，中国共产党第十三次全国代表大会举行。代理中央委员会总书记赵紫阳作《沿着有中国特色的社会主义道路前进——在中国共产党第十三次全国代表大会上的报告》的报告。报告中指出：“党的十一届三中全会以后，我国经济建设的战略部署大体分三步走。第一步，实现国民生产总值比一九八〇年翻一番，解决人民的温饱问题。这个任务已经基本实现。第二步，到本世纪末，使国民生产总值再增长一倍，人民生活达到小康水平。第三步，到下个世纪中叶，人均国民生产总值达到中等发达国家水平，人民生活比较富裕，基本实现现代化。”\n故正确答案为ABD。","no":12,"missingImage":false}]},{"type":"material","material":"\u003cp>        绩效在中国古代政府管理中早有应用。从《尚书》的“三载考绩，三考黜陟幽明”到周朝《地官》中的相关规定。堂南汉已形成较完整的绩效制度。宋庆历年间，范仲淹在向皇帝提交的《答手诏条陈十事》中，第一条为“明黜陟”，即废除“磨勘制”，恢复宋朝的考绩制。宋朝在救灾上有不成文规定，主办官员若能用好政府拨款，且无贪贿和灾民暴乱，则为“有功”；若不动用国库，而是运用地方资源救灾，则为“有绩效”。\u003c/p>\u003cp>\u003cspan style=\"color:#rgb(89,89,89)\">        \u003c/span>十九大报告提出的“全面实施绩效管理”是对政府治理理念和方式的重大改革，影响深远。全面实施绩效管理该怎么做，事关改革成败。“全面”是相对于局部、片面或举例说明而言的，按此理解，全面绩效管理是全覆盖公共部门、公共资金的管理。绩效管理是价值理性和工具理性的统一，其管理主体是各级政府，采用“有效公共服务\u003cimg data-k=\"3d6d1f96db11\">预算”的双要素管理。通过绩效指标、绩效目标，将公共部门职能转化为责任，以绩效评价来监察结果，从而将领导干部目标责任考核纳入该体系，是责任型、服务型政府的“抓手”。它按不同对象设计管理环节，如对部门采用绩效目标、绩效预算、绩效拨款、绩效评价等环节管理，从而区别于传统管理。\u003c/p>\u003cp>\u003cspan style=\"color:#rgb(89,89,89)\">        \u003c/span>绩效管理属于科学管理，科学性是其基本属性，主要通过制度建设、绩效指标和日常管理体现。绩效指标应按部门职能、预算项目目标设计，遵循量化规则，绩效管理制度建设则应符合公共管理规律和流程化、环节化管理要求，如对预算项目采用前期、中期、后期评价模式，对部门管理采用绩效目标、绩效预算、绩效拨款、绩效评价环节模式。绩效指标应指向结果，绩效评价是对结果而非管理过程的评价。绩效管理过程各项评价结果应按法律、《信息公开条例》要求公开。\u003c/p>","questions":[{"qid":"2453089","cat":"人文常识","stem":"绩效在中国古代政府管理中的应用，是基于（    ）的目的。","options":{"A":"考察官员的执政结果","B":"选拔和激励有担当、政绩卓著的官员","C":"淘汰贪官庸官","D":"防御和抵抗外来入侵"},"answer":"ABC","explanation":"本题考查人文常识。\n“三载考绩，三考黜陟幽明”的意思是三年考核一次，三次考核之后，提升贤明者，罢免昏庸者。体现了中国古代实行考绩制度的目的是考察官员的执政结果；选拔和激励有担当、政绩卓著的官员，淘汰贪官庸官。同时，宋代在救灾上的不成文规定，也体现了激励选拔担当、政绩卓著的官员，遏制官员贪腐目的。因此，ABC正确。\nD项错误，材料未体现，故排除。\n故正确答案为ABC。","no":13,"missingImage":false},{"qid":"2453090","cat":"人文常识","stem":"根据材料，下列对于政府全面绩效管理的“全面”理解正确的是（    ）","options":{"A":"从中央到村委会六级政府全覆盖","B":"前期、中期和后期评价等过程全覆盖","C":"党政机关、事业单位、社会团体、国有企业和民营企业全覆盖","D":"一般公共预算、政府性基金预算、国有资本经营预算和社会保险基金预算全覆盖"},"answer":"BD","explanation":"本题考查管理学常识。\nA项错误，根据材料，绩效管理的“管理主体是各级政府”，即政府全覆盖，包括中央到乡镇五级政府。《宪法》第一百一十一条规定：“城市和农村按居民居住地区设立的居民委员会或者村民委员会是基层群众性自治组织。”村委会不属于一级政府。\nB项正确，根据材料，“绩效管理制度建设则应符合公共管理规律和流程化、环节化管理要求，如对预算项目采用前期、中期、后期评价模式”，说明绩效管理将覆盖预算资金运动各环节，实现前期、中期和后期评价等全过程管理。\nC项错误，根据材料，“全面绩效管理是全覆盖公共部门、公共资金的管理”，其中的公共部门包括党政机关、事业单位、社会团体和国有企业。私营企业不属于公共部门的范畴。\nD项正确，根据材料，绩效管理“采用‘有效公共服务+预算’的双要素管理”，即预算全覆盖，包括一般公共预算、政府性基金预算、国有资本经营预算和社会保险基金预算。\n故正确答案为BD。","no":14,"missingImage":false},{"qid":"2453091","cat":"人文常识","stem":"根据材料，我国全面实施绩效管理的原则包括（    ）","options":{"A":"整体性原则","B":"公益性原则","C":"科学性原则","D":"公开性原则"},"answer":"ACD","explanation":"本题考查管理常识。\nA项正确，全面绩效管理是全覆盖公共部门、公共资金的管理。全面绩效管理的对象是所有的公共部门，并非是针对部分部门实施的管理方式，体现了整体性原则。\nB项错误，公益性原则指的是实施某种政策、方案、措施、活动等，应是以满足人民群众的公共利益为目的，全面实施绩效管理是对政府治理理念和方式的改革，其管理主体是各级政府，主要是为了形成完整的科学的绩效管理制度，未体现公益性。\nC项正确，绩效管理属于科学管理，科学性是其根本属性，体现了科学性原则是全面绩效管理包含的原则，绩效指标按部门职能、预算项目目标设计，遵循量化规则，绩效管理制度建设符合公共管理规律和流程化、环节化管理要求是科学性原则的体现。\nD项正确，绩效管理过程各项评价结果应按法律、《信息公开条例》要求公开，体现的是公开性原则。\n故正确答案为ACD。","no":15,"missingImage":false},{"qid":"2453093","cat":"经济常识","stem":"我国全面实施绩效管理的意义主要体现在：","options":{"A":"拓展了财政作为国家治理基础和重要支柱的功能","B":"对管理全过程实施了绩效评价","C":"优化了政府治理方式","D":"提升了政府行政效率"},"answer":"CD","explanation":"本题考查管理学常识。\nA项错误，全面实施绩效管理包含了对公共资金的管理，可以更有效地配置财政资源，提高社会经济发展效率，但没有拓展财政作为国家的治理基础和重要支柱的功能。\nB项错误，根据材料，绩效评价是对结果而非管理过程的评价。\nC、D项正确，求是网《全面实施绩效管理，提升国家治理能力》一文中指出，全面绩效管理是深化行政体制改革、转变政府职能的重要手段，也是推进政府治理现代化的必然要求，对于提高政府的工作效能、实现资源的优化配置具有十分重要的意义。十九大报告中提到全面实施绩效管理，首次确立绩效管理的系统架构，是党中央在整体管理层面上贯彻落实新《预算法》的重大决策，将之作为完善国家治理体系、提高财政资金使用效率的重要抓手，是新时代推进服务型、责任型和效能型政府的探索和创新。\n故正确答案为CD。","no":16,"missingImage":false}]},{"type":"material","material":"\u003cp>        法工委是全国人大常委会的工作机构，作为参谋助手为全国人大常委会行使国家立法权提供服务。为了加强与新闻媒体的联系，更好地向社会公众介绍立法工作情况，法工委建立了发言人制度。\u003c/p>\u003cp>\u003cspan style=\"color:#rgb(89,89,89)\">        \u003c/span>2019年8月21日，全国人大常委会法工委就建立发言人机制举行第一次记者会。发言人通报了今年上半年法律草案向社会公布征求意见的情况，并回答记者提问。\u003c/p>\u003cp>\u003cspan style=\"color:#rgb(89,89,89)\">        \u003c/span>目前为止，本年度共有15部法律草案向社会公开征求意见21件次，包括：民法典婚姻家庭编（草案二次审议稿）、民法典继承编（草案二次审议稿）、森林法（修订草案）、社区矫正法（草案）、密码法（草案）、固体废物污染环境防治法（修订草案）、土地管理法和城市房地产管理法修正案（草案二次审议稿）等。\u003c/p>\u003cp>\u003cspan style=\"color:#rgb(89,89,89)\">        \u003c/span>对于备受关注的民法典，其合同编、侵权编草案的二次审议稿于2019年1月4日至2月3日在中国人大网全文公布，公开向社会征求意见。合同编草案二次审议稿共收到256人提出的504条意见，侵权责任编草案二次审议稿收到117人提出的228条意见。2019年4月，十三届全国人大常委会第十次会议对民法典物权编、人格权编进行了二审，之后4月26日至5月25日，两编草案的二次审议稿分别在中国人大网全文公布，公开征求社会公众意见。其间，物权编草案二次审议稿共收到1132人提出的2286条意见，人格权编草案二次审议稿收到20031人提出的31936条意见。\u003c/p>","questions":[{"qid":"2452973","cat":"人文常识","stem":"全国人大常委会                    。","options":{"A":"是全国人大的常设机关","B":"行使最高立法权","C":"是我国最高国家行政机关","D":"是我国最高国家权力机关的执行机关"},"answer":"AB","explanation":"本题考查法律常识。\nA项正确，根据《宪法》第五十七条规定：“中华人民共和国全国人民代表大会是最高国家权力机关。它的常设机关是全国人民代表大会常务委员会。”\nB项正确，根据《宪法》第五十八条规定：“全国人民代表大会和全国人民代表大会常务委员会行使国家立法权。”全国人大及其常委会行使最高立法权。\nC、D项错误，根据《宪法》第八十五条规定：“中华人民共和国国务院，即中央人民政府，是最高国家权力机关的执行机关，是最高国家行政机关。”因此国务院是我国最高国家行政机关，是我国最高国家权力机关的执行机关，而非全国人大常委会。\n故正确答案为AB。","no":17,"missingImage":false},{"qid":"2452974","cat":"法律常识","stem":"下列法律中必须由全国人大制定的是                    。","options":{"A":"中华人民共和国土地管理法","B":"中华人民共和国森林法","C":"中华人民共和国社区矫正法","D":"中华人民共和国民法典"},"answer":"D","explanation":"本题考查法律常识。根据《宪法》第六十二条规定：“全国人民代表大会行使下列职权：······（三）制定和修改刑事、民事、国家机构的和其他的基本法律······”第六十七条规定：“全国人民代表大会常务委员会行使下列职权：······（二）制定和修改除应当由全国人民代表大会制定的法律以外的其他法律······”全国人大制定基本法律，全国人大常委会制定除基本法律以外的其他法律。\nA项错误，《中华人民共和国土地管理法》是1986年6月25日第六届全国人民代表大会常务委员会第十六次会议通过，并于2019年经全国人大常委会修订通过，属于基本法律以外的其他法律，应由全国人大常委会制定。\nB项错误，《中华人民共和国森林法》是1984年9月20日第六届全国人民代表大会常务委员会第七次会议通过，并于2009年经全国人大常委会修订，属于基本法律以外的其他法律，应由全国人大常委会制定。\nC项错误，《中华人民共和国社区矫正法》2019年12月28日第十三届全国人民代表大会常务委员会第十五次会议通过。《中华人民共和国社区矫正法》属于基本法律以外的其他法律，应由全国人大常委会制定。\nD项正确，民法典属于民事基本法律，必须由全国人大制定。\n故正确答案为D。","no":18,"missingImage":false},{"qid":"2452975","cat":"法律常识","stem":"民法典合同编、侵权编草案的二次审议稿在中国人大网全文公布，公开向社会征求意见，根本原因在于                    。","options":{"A":"我国坚持人民代表大会制度","B":"我国是人民民主专政的社会主义国家","C":"社会主义法制是社会主义民主的前提和基础","D":"社会主义民主是社会主义法制的保障"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，根据《宪法》第二条第一、二款规定：“中华人民共和国的一切权力属于人民。人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会。”人民代表大会制度是我国的政权组织形式，是按照民主集中制的原则，建立全部国家机构，统一领导和管理国家事务的根本政治制度。而题干虽然是在中国人大网站公布，但是是为了向社会征求意见，选项和题意不符。另外题中问的是根本原因，政体是由国体决定的，有什么性质的国家，就要求有什么样的政体与之相匹配。因此应当选到国体，而非政体。\nB项正确，根据《宪法》第一条第一款规定：“中华人民共和国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家。”法律草案审议稿在网上公布，公开向社会征求意见，根本原因是我国的国体是人民民主专政，充分体现了我国由人民当家作主。\nC项错误，社会主义民主同法制相比，是第一位的、决定性的。主要原因有：一是从社会主义法制的产生来看，它是随着社会主义民主即人民主权的产生而产生的。二是从社会主义法制的性质和内容来看，有什么性质的民主，就有什么性质的法制。三是从社会主义法制的健全和发展方向来看，同样不能离开民主。因此，社会主义民主是社会主义法制的前提和基础。\nD项错误，社会主义法制是社会主义民主的保障，主要体现在：一是社会主义法制确认社会主义民主；二是社会主义法制规定社会主义民主的范围；三是社会主义法制规定如何实现社会主义民主；四是社会主义法制是保卫社会主义民主的武器。\n故正确答案为B。","no":19,"missingImage":false},{"qid":"2452977","cat":"人文常识","stem":"全国人大常委会行使国家立法权，向社会公开征求意见                    。","options":{"A":"体现了我国民主的广泛性","B":"是人民群众参与管理国家的基础和标志","C":"促进了基层政权的巩固","D":"有利于群众依法直接行使民主权利"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，法律草案审议稿在网上公布，公开向社会征求意见，全体人民都能参与，体现了我国民主的广泛性。\nB项错误，选举权和被选举权是公民基本的民主权利，因此行使选举权和被选举权是人民群众参与管理国家的基础和标志。\nC项错误，完善基层民主制度，才能促进基层政权巩固。\nD项错误，群众直接行使民主权利这一说法错误，人民通过选举人大代表，由人大代表组成人民代表大会代表人民行使民主权利，因此是间接行使民主权利。\n故正确答案为A。","no":20,"missingImage":false},{"qid":"2452903","cat":"科技常识","stem":"2019年8月，清华大学科研团队发布了一款类脑计算芯片。该芯片是世界首款异构融合类脑芯片，也是世界上第一个既可支持脉冲神经网络又可支持人工神经网络的人工智能芯片。该芯片的名字是        。","options":{"A":"“天机芯”","B":"“中国芯”","C":"“中华芯”","D":"“麒麟芯”"},"answer":"A","explanation":"本题考查科技常识。\n2019年8月，清华大学施路平团队发布研究成果——类脑计算芯片“天机芯”。该芯片是世界首款异构融合类脑芯片，也是世界上第一个既可支持脉冲神经网络又可支持人工神经网络的人工智能芯片。\n故正确答案为A。","no":21,"missingImage":false},{"qid":"2452901","cat":"人文常识","stem":"近年来，我国置身世界大发展大变革大调整中，不惑于纷乱现象，不畏于艰难险阻，以元首外交引领扩大全球朋友圈、以开放合作之姿谋求各国共同发展、力倡多边主义推动全球治理改革，不断开创中国特色大国外交新局面。这表明，中国特色大国外交是        。\n①以维护各国共同利益为目的，促进共同发展。\n②主导全球多边治理，建立国际政治经济新秩序。\n③坚持独立自主的和平外交政策，发挥负责任大国的作用。\n④坚持合作共赢，推动构建人类命运共同体。","options":{"A":"①②","B":"①③④","C":"②③④","D":"③④"},"answer":"D","explanation":"本题考查政治常识。\n①错误，中国外交政策的宗旨是维护世界和平、促进共同发展。维护国家利益是主权国家对外活动的出发点和落脚点。我国在维护自身利益的同时，兼顾他国合理关切，在谋求本国发展中促进各国共同发展。“以维护各国共同利益为目的”说法错误。\n②错误，中国积极致力于全球多边治理，但不是“主导”，中国尊重各国人民自主选择发展道路的权利，维护国际公平正义，反对把自己的意志强加于人，反对干涉别国内政，反对以强凌弱。\n③正确，中国坚持独立自主的和平外交政策，是维护世界和平与稳定的积极因素和坚定力量，是促进世界经济发展的重要力量，在国际事务中的代表性和话语权进一步增强，发挥着负责任大国的作用。\n④正确，中国高举和平、发展、合作、共赢的旗帜，推动建设相互尊重、公平正义、合作共赢的新型国际关系。中国主张各国人民同心协力，构建人类命运共同体，建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。\n故正确答案为D。","no":22,"missingImage":false},{"qid":"2453105","cat":"人文常识","stem":"港珠澳大桥是世界上最长的跨海大桥，大桥路线呈“S”型曲线，切合了水流走向。从结构力学的角度来看，弯度明显更稳定，跨海大桥受到的海浪冲击远远大于普通桥梁，设计“S”型曲线，能让水流通过引导减少对桥梁造成的伤害。同时，由于海底也和地面一样，是凹凸不平的地形，把桥梁修成弯曲的形状是为了避开这些起伏的地形，保障桥梁的稳定和安全。这表明：","options":{"A":"人具有主观能动性，可以认识事物的本质和规律","B":"人能够创造条件，改变规律起作用的具体方式","C":"人的意识能够创造出自然界所没有的客观事物","D":"人能够通过想象将观念中的对象变成现实的东西"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，人具有主观能动性，可以认识事物的本质和规律，并且能够利用规律，改造客观世界，造福于人类。港珠澳大桥路线设计成“S”型曲线正是人们利用规律，发挥主观性的一个体现。\nB项错误，人们可以创造条件，改变规律起作用的具体方式，但是本题大桥设计成“S”型曲线是人们在利用规律、顺应规律，并没有为了让规律起作用而去改变什么。\nC项错误，辩证唯物主义认为，物质决定意识，意识是对物质的反映，意识不是自生的和先验的。“意识能够创造出自然界所没有的客观事物”是唯心主义的观点，是错误的，意识不能够脱离物质而存在。\nD项错误，人能够通过想象将观念中的对象变成现实的东西，体现的是意识对物质的反作用，但题干没有提到人的想象，是无关选项，所以不选。\n故正确答案为A。","no":23,"missingImage":false},{"qid":"2452909","cat":"经济常识","stem":"2019年8月，国务院印发《中国（上海）自由贸易试验区            总体方案》，方案要求，建立以            为核心的制度体系，建立全面风险管理制度，建设具有国际市场竞争力的开放型产业体系。","options":{"A":"外高桥保税区，贸易便利化","B":"临港新片区，贸易便利化","C":"外高桥保税区，投资贸易自由化","D":"临港新片区，投资贸易自由化"},"answer":"D","explanation":"本题考查政治常识。\n2019年8月，国务院印发《中国（上海）自由贸易试验区临港新片区总体方案》（以下简称《方案》）。《方案》明确，新片区参照经济特区管理。要建立以投资贸易自由化为核心的制度体系。在适用自由贸易试验区各项开放创新措施的基础上，支持新片区以投资自由、贸易自由、资金自由、运输自由、人员从业自由等为重点，推进投资贸易自由化便利化。\n故正确答案为D。","no":24,"missingImage":false},{"qid":"2452929","cat":"经济常识","stem":"下列选项中，属于行政行为的是                    。","options":{"A":"市场监督管理局销毁收缴的假冒伪劣产品","B":"城管局雇用外部人员修理其办公设备","C":"交警在路口安装交通标志","D":"财政局审批某会计师事务所的设立"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，市场监督管理局查封、扣押物品或者没收非法所得等是具体行政行为，但市场监督管理局对收缴的假冒伪劣产品的销毁是行政事实行为，行政事实行为指的是行政主体基于职权实施的不能产生、变更或者消灭行政法律关系的行为。\nB项错误，城管局雇用外部人员修理设备，便和外部人员之间建立了承揽合同，双方是民事法律关系，城管局具有民事主体资格，未使用其行政职权，不属于行政行为。\nC项错误，行政行为指行政主体及其工作人员行使行政职权对相对人作出的产生行政法律效果的行为。交警在路口安装交通标志是为了保障出行安全的职责行为，没有相对人，也没有权利义务的产生，不属于行政行为。\nD项正确，行政许可是指行政机关根据公民、法人或者其他组织的申请，经依法审查准予其从事特定活动的行为。《行政许可法》第十二条规定：“下列事项可以设定行政许可：……（五）企业或者其他组织的设立等，需要确定主体资格的事项；（六）法律、行政法规规定可以设定行政许可的其他事项。”财政局审批会计师事务所的设立是行政许可行为。\n故正确答案为D。","no":25,"missingImage":false},{"qid":"2452939","cat":"法律常识","stem":"下列选项中，        属于我国《刑法》规定的刑罚。","options":{"A":"从业禁止","B":"管制","C":"训诫","D":"罚款"},"answer":"B","explanation":"本题考查法律常识。\n根据《刑法》第三十三条规定：“【主刑种类】主刑的种类如下：（一）管制；（二）拘役；（三）有期徒刑；（四）无期徒刑；（五）死刑。”第三十四条规定：“【附加刑种类】附加刑的种类如下：（一）罚金；（二）剥夺政治权利；（三）没收财产。附加刑也可以独立适用。”\n故正确答案为B。","no":26,"missingImage":false},{"qid":"2453107","cat":"法律常识","stem":"我国《宪法》规定，国家建立健全同（    ）发展水平相适应的社会保障制度。","options":{"A":"政治","B":"经济","C":"政治和经济","D":"政治、经济和社会"},"answer":"B","explanation":"本题考查法律常识。\n根据《宪法》第十四条第四款规定：“国家建立健全同经济发展水平相适应的社会保障制度。”\n故正确答案为B。","no":27,"missingImage":false},{"qid":"2452926","cat":"人文常识","stem":"下列关于公务员录用的表述，错误的是                    。","options":{"A":"新录用的公务员试用期为一年","B":"被依法列为失信联合惩戒对象的人员不得录用为公务员","C":"地方各级机关公务员的录用必要时可授权市级公务员主管部门组织","D":"录用公务员应当在规定的编制限额内，并有相应的职位空缺"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，《公务员法》第三十四条规定：“新录用的公务员试用期为一年。试用期满合格的，予以任职；不合格的，取消录用。”\nB项正确，《公务员法》第二十六条规定：“下列人员不得录用为公务员：（一）因犯罪受过刑事处罚的；（二）被开除中国共产党党籍的；（三）被开除公职的；（四）被依法列为失信联合惩戒对象的；（五）有法律规定不得录用为公务员的其他情形的。”\nC项错误，《公务员法》第二十四条规定：“中央机关及其直属机构公务员的录用，由中央公务员主管部门负责组织。地方各级机关公务员的录用，由省级公务员主管部门负责组织，必要时省级公务员主管部门可以授权设区的市级公务员主管部门组织。”\nD项正确，《公务员法》第二十七条规定：“录用公务员，应当在规定的编制限额内，并有相应的职位空缺。”\n本题为选非题，故正确答案为C。","no":28,"missingImage":false},{"qid":"2452944","cat":"人文常识","stem":"下列行为中，属于公共政策诉求的是                    。","options":{"A":"患者要求医院减免医药费","B":"企业要求政府减轻负担","C":"职员要求老板提高工资","D":"公众要求传媒关注客机安全"},"answer":"B","explanation":"本题考查行政管理。\n公共政策是指国家通过对资源的战略性运用，以协调经济社会活动及相互关系的一系列政策的总称。因此，公共政策是国家制定的。\nA项错误，医院不属于制定公共政策的主体，患者对医院的诉求不属于公共政策诉求。\nB项正确，政府可以制定公共政策以实现公共利益诉求，因此企业要求政府减轻负担属于公共政策诉求。\nC项错误，企业老板不属于制定公共政策的主体，无法制定公共政策，因此职员对老板的诉求不属于公共政策诉求。\nD项错误，传媒不属于制定公共政策的主体，不能制定公共政策，因此公众对传媒的诉求不属于公共政策诉求。\n故正确答案为B。","no":29,"missingImage":false},{"qid":"2452946","cat":"人文常识","stem":"行政协调对于行政管理有序化以及组织整体功能的发挥有重要作用。下列对行政协调的理解错误的是                    。","options":{"A":"行政协调是指行政管理过程中的协调","B":"行政协调是在有关各方存在不同程度共同之处的基础上，对差异进行融和调整","C":"行政协调关键在于政府与公众间的平衡","D":"行政协调与行政公关在原则与方法上有融和交叉之处"},"answer":"C","explanation":"本题考查行政管理。\nA项正确，行政协调是指行政管理过程中的协调，是行政主体为达到一定的行政目标而引导行政组织、部门、人员之间建立良好的协作与配合关系，以实现共同目标的行为。\nB项正确，行政协调不是在非此即彼相互排斥的两极做选择，而是在有关各方存在不同程度共同之处的基础上，对差异进行融和调整，以实现关系的和谐与整体功能的最大化。\nC项错误，行政协调关键在政府各方面关系的平衡，如输入信息与输出信息的平衡、履行社会职能与自身有效管理的平衡、专业化分工与全局管理的平衡、职权责的平衡等。\nD项正确，行政协调是行政主体为达到一定的行政目标而引导行政组织、部门、人员之间建立良好的协作与配合关系，以实现共同目标的行为。行政公共关系特指政府在施政过程中运用传播沟通的方法，促进政府与公众之间相互了解、理解、信任与合作的一种管理活动。行政协调的关键在政府各方面关系的平衡，行政公关是通过双向传播与沟通达到政府与公众间的平衡，二者都是为达到一种平衡关系以实现共同目标，因此，在实际操作中，二者无论是在原则还是方法上往往有融和交叉之处。\n本题为选非题，故正确答案为C。","no":30,"missingImage":false},{"qid":"2452940","cat":"法律常识","stem":"行政管理外部监督是指行政管理组织以外的各种监督主体对行政机关及其工作人员的管理活动进行的多渠道、多种形式的异体监督。其中，            是有法律效力的最高层次的异体监督。","options":{"A":"社会监督","B":"政党监督","C":"司法机关监督","D":"权力机关监督"},"answer":"D","explanation":"本题考查管理学常识。\nA项错误，社会监督是指由国家机关以外的社会组织和公民对各种法律活动的合法性进行的监督。\nB项错误，政党监督是指政党组织对行政机关的工作实施的监察与督导。政党监督包括执政党监督、参政党监督、在野党监督等，其中执政党监督占有非常重要的地位。中国的政党监督的方式包括：中国共产党的监督；民主党派的监督；人民政协的监督。\nC项错误，司法机关监督是指人民检察院和人民法院依照法定职权和程序对行政机关、公务员进行的监督。\nD项正确，权力机关监督是指各级人大及其常委会对国家行政机关及其公务员的监督，其监督的主要方式有听取和审议工作报告，审查和批准国民经济计划和财政预算、决算，审查政府的法规、决定和命令，质询和询问，代表视察和执法检查，罢免政府组成人员六种。人民代表大会是我国的权力机关，国家行政机关在它的基础上产生，对它负责，受它监督。因此，权力机关监督是有法律效力最高层次的异体监督。\n故正确答案为D。","no":31,"missingImage":false},{"qid":"2453094","cat":"人文常识","stem":"下列行政方法中，与我们长期提倡的“从群众中来，到群众中去”的群众路线工作方法有相似之处的是：","options":{"A":"思想政治教育方法","B":"参与管理方法","C":"行为激励方法","D":"行政责任方法"},"answer":"B","explanation":"本题考查行政管理。\n行政方法即行政管理方法，是指行政机关及其工作人员为实现行政目标，从公共组织内外部环境和管理对象的实际情况出发，在一定的管理思想和原则指导下所采取的各种措施、手段、办法、技巧的总和。\nA项错误，思想政治教育方法是通过对人们进行确定的、有目的的、系统的感化与劝导，使受教育者在身心上养成教育者所希望的思想和品质的行政方法。其主要途径有：情理交融法、普遍自我教育法、个别现象教育法、以身作则教育法和刚柔相济法等。\nB项正确，参与管理方法是通过由下级行政主体或者行政客体参加管理和决策来提高人们的积极性和管理效率的一种行政方法，可以激励人们更好地为完成行政目标而努力。这种方法与我们长期倡导的“从群众中来，到群众中去”的群众路线的工作方法有相似之处。\nC项错误，行为激励方法是通过有计划地设置一定的条件和情境，激发人们的行为动机，使之产生某种特定的行为反应。主要方式有：目标激励、奖励激励、竞争激励和反激励等。\nD项错误，行政责任方法用行政体制中职权划分的机制将组织中的目标与人事中的职位有机地结合起来，从而使行政工作中的职、权、责、利诸要素一致起来。其本质内容是权力与责任的关系，包括机关责任制与岗位责任制。\n故正确答案为B。","no":32,"missingImage":false},{"qid":"2453097","cat":"人文常识","stem":"光学树脂常用于制作镜片，它是一种有机材料，其分子间结构相对松弛，光线可通过率为\u003cimg data-k=\"6afd798acfd8\">。下列关于光学树脂镜片的表达错误的是\u003cu>                    \u003c/u>。","options":{"A":"树脂镜片和普通玻璃镜片的透光率不相上下","B":"树脂镜片的抗撞击力比普通玻璃镜片更强","C":"和同样大小的普通玻璃镜片相比，树脂镜片要轻得多","D":"和普通玻璃镜片相比，树脂镜片更加耐磨"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，在可见光区，树脂镜片透光率接近玻璃，二者不相上下。\nB项正确，树脂镜片的抗冲击力强，不易破裂。万一镜片被击碎，不但碎片少，且较不尖锐，能使眼球及面部受伤的情形减至最低程度。\nC项正确，和同样大小的普通玻璃镜片相比，树脂镜片相当于玻璃镜片重量的二分之一至三分之一，要轻得多。\nD项错误，树脂镜片的缺点是容易擦伤，树脂镜片的耐刮性较玻璃镜片差，虽可经由表面硬化处理改善之，但效果有限。\n本题为选非题，故正确答案为D。","no":33,"missingImage":false},{"qid":"2452898","cat":"人文常识","stem":"已知物体表面颜色越浅，反射热辐射的能力越强，进行热辐射的能力越差；物体表面颜色越深，反射热辐射的能力越差，进行热辐射的能力越强。据此，下列关于石油液化气罐和电力变压器表面颜色的判断，说法正确的是                    。","options":{"A":"均应漆成银白色","B":"均应漆成灰黑色","C":"前者漆成灰黑色，后者漆成银白色","D":"前者漆成银白色，后者漆成灰黑色"},"answer":"D","explanation":"本题考查科技常识。\n液化气罐里面装有的液化气属于易燃易爆液体，因此要保持低温。但其本身不产生热，其温度升高主要是因为吸收来自环境中通过热辐射传递的热量，涂成银白色这种浅色，其外表面反射热辐射的能力就强，可以减少从外界吸收的热辐射，从而保持罐体温度较低，保证安全性。\n正常运行中的电力变压器，会有极少部分的电能转化为内能，导致其温度升高，当变压器的温度比环境温度高时，将其漆成颜色很深的灰黑色，有利于将热量通过热辐射的方式传递到环境中，从而避免自身温度升得过高。 \n故正确答案为D。","no":34,"missingImage":false},{"qid":"2452950","cat":"科技常识","stem":"下列选项中，导热性最好的是        ，它比大多数气体的导热系数高出10倍，在能源工业中是极好的传热导体。","options":{"A":"氢气","B":"氧气","C":"氮气","D":"氦气"},"answer":"A","explanation":"本题考查科技常识。\n导热系数是表征物质导热能力的物理量。表示材料在一维稳态传热情况下，面积为\u003cimg data-k=\"b5b156f4221b\">，厚度为\u003cimg data-k=\"a38e7a1e9ec2\">的材料，当其两侧表面温度差为\u003cimg data-k=\"96e33e2f1423\">时，单位时间内由导热方式传递的热量，单位为瓦/米·度（W/(m·K)，此处为K可用\u003cimg data-k=\"3aa3bde13251\">代替）。\n\u003cimg data-k=\"973bb08ee351\">下氢气导热系数约为0.17 W/(m·K)，是导热性最好的气体，比大多数气体的导热系数高出10倍，因此在能源工业中，氢气是极好的传热导体。\n故正确答案为A。","no":35,"missingImage":false},{"qid":"2453098","cat":"人文常识","stem":"飞行器在速度接近音速时会有一股强大的阻力，使飞行器产生强烈的振荡，速度衰减。这一现象被称为音障。要突破音障，对超音速飞机的结构有一定要求，下列机翼的设计有利于突破音障的是：","options":{"A":"又薄又短","B":"又薄又长","C":"又厚又短","D":"又厚又长"},"answer":"A","explanation":"本题考查科技常识。\n飞机是靠机翼产生升力，而把飞机托上天空的，机翼越大，升力就越大。但是，从另一方面来看，机翼在飞行中也会产生阻力，机翼越厚越长，阻力也越大。在飞行速度比较低的时候，为了产生足够的升力，就要把机翼做得长一些，例如滑翔机的翅膀就特别长；当速度提高以后，特别是在超音速飞行的时候，如果机翼厚长，所产生的阻力就特别大，就很难突破音障。因此对于超音速飞机来说，把机翼设计得又短又薄才能有利于突破音障。\n故正确答案为A。","no":36,"missingImage":false},{"qid":"2452900","cat":"人文常识","stem":"马克思、恩格斯创立了唯物史观和剩余价值学说，揭示了人类历史发展的奥秘和资本主义剥削的实质，论证了无产阶级的历史使命，弥补了空想社会主义的缺陷，从而把社会主义从空想发展为科学。科学社会主义问世的标志是            。","options":{"A":"《共产党宣言》的发表","B":"《资本论》的出版","C":"巴黎公社的建立","D":"十月革命的胜利"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，《共产党宣言》的问世是人类思想史上的一个伟大事件，标志着科学社会主义的诞生。《共产党宣言》是第一次全面阐述科学社会主义原理的伟大著作，为各国无产阶级革命提供了崇高的共产主义理想、先进的建党学说和科学的行动指南。\nB项错误，《资本论》是马克思主义政治经济学的经典著作，是享誉世界的伟大名著。《资本论》的出版，标志着马克思主义政治经济学理论体系的形成，在马克思主义理论形成和发展史中具有十分重大的意义。\nC项错误，1871年3月18日，巴黎工人举行起义，推翻了资产阶级反动统治，建立了无产阶级革命政权。3月26日进行公社选举，28日巴黎公社宣告成立。巴黎公社是人类历史上第一个无产阶级政权。\nD项错误，1917年11月7日，列宁和托洛茨基领导的布尔什维克武装力量推翻了临时政府，建立了苏维埃政权。列宁领导的十月革命产生了世界上第一个无产阶级专政的国家，开辟了世界无产阶级革命的新时代和殖民地半殖民地在无产阶级领导下进行民族民主革命的新时代。\n故正确答案为A。","no":37,"missingImage":false},{"qid":"2453100","cat":"人文常识","stem":"“破釜沉舟”是项羽在           前作的战前动员，意在鼓励将士志在必胜，现在作为成语，表示下定决心，不顾一切地干到底。","options":{"A":"长平之战","B":"巨鹿之战","C":"官渡之战","D":"淝水之战"},"answer":"B","explanation":"本题考查人文常识。\nA项错误，长平之战，是秦国率军在赵国的长平（今山西省晋城高平市西北）一带同赵国军队发生的战争。赵军最终战败，秦国获胜进占长平。成语纸上谈兵，经常用于形容长平之战失利的赵括。\nB项正确，巨鹿之战，是秦末农民战争所取得的一场巨大胜利，也是中国历史上著名的以少胜多的战役之一。项羽破釜沉舟，在各诸侯军龟缩于壁垒中时带头以楚军猛攻秦军，带动诸侯联军歼灭秦将主力。\nC项错误，官渡之战，曹操以两万左右的兵力，出奇制胜，击破袁军十万，以曹操的全面胜利而告结束。是东汉末年“三大战役”之一，也是中国历史上著名的以弱胜强的战役之一。\nD项错误，淝水之战，前秦出兵伐晋，于淝水（现今安徽省寿县的东南方）与东晋交战，最终东晋仅以八万军力大胜八十余万前秦军，是中国历史上著名的以少胜多的战例。\n故正确答案为B。","no":38,"missingImage":false},{"qid":"2453081","cat":"人文常识","stem":"荀子的“不闻不若闻之，闻之不若见之，见之不若知之，知之不若行之”；明代王夫之的“知行相资以为用”，从哲学的角度，这里主要强调的是                    。","options":{"A":"物质与意识","B":"认识与实践","C":"感性认识与理性认识","D":"静止与运动"},"answer":"B","explanation":"本题考查政治常识。\nA项错误，世界统一于物质，意识是物质的产物，物质第一性，意识第二性，物质决定意识，意识对物质具有能动的反作用。意识的反作用要受物质决定作用的制约。题干未体现，无关选项。\nB项正确，实践对认识的决定性作用主要表现为：（1）实践是认识的来源，实践产生了认识的需要；（2）实践是认识发展的根本动力，是认识的基础；（3）实践是认识的目的；（4）实践是检验认识正确与否的唯一标准。荀子的“不闻不若闻之，闻之不若见之，见之不若知之，知之不若行之”，意思是没有听到不如听到，听到不如见到，见到不如理解到，理解到不如去实行，学问到了实行也就达到了顶点。王夫之的“知行相资以为用”，意思是以知促行、以行促知、知行合一。所以题干主要强调的是“认识与实践”的哲学原理。\nC项错误，感性认识是人们在实践过程中，通过自己各种感官产生的感觉在头脑中产生许多印象，对各种事物的表面现象有了初步认识。它只反映事物的现象和外部联系，尚未达到事物的本质和内部联系。在感性认识的基础上，经过思考的作用，将丰富的感觉材料，加以去粗取精，去伪存真，由此及彼，由表及里的改造制作过程，就会产生一个飞跃，变成由概念、判断和推理阶段反映事物的本质和内部联系的理性认识。它同感性认识有性质的不同，但又互相连贯，二者在实践的基础上联系起来。题干未体现，无关选项。\nD项错误，运动是物质的存在形式和固有属性。它包括宇宙间的一切变化和过程。辩证唯物主义认为，世界是物质的，物质是永恒运动着的。物质和运动是不可分的，世界上没有不运动的物质，也没有离开物质的运动。题干未体现，无关选项。\n故正确答案为B。","no":39,"missingImage":false},{"qid":"2452908","cat":"人文常识","stem":"“西风烈，长空雁叫霜晨月。霜晨月，马蹄声碎，喇叭声咽。雄关漫道真如铁，而今迈步从头越。从头越，苍山如海，残阳如血。”是毛泽东同志写于1935年的一首词。该词描绘的是红军            的场景。","options":{"A":"征战甘肃南部关隘腊子口","B":"征战福建龙岩、漳州","C":"飞夺泸定桥","D":"征战贵州娄山关"},"answer":"D","explanation":"本题考查人文常识。\n这首词出自毛泽东的《忆秦娥·娄山关》，写于1935年2月，最早发表于1957年1月的《诗刊》上。1935年2月25日凌晨，红军向贵州娄山关挺进，在红花园与黔军遭遇，傍晚时分终于把这座雄关控制在手中，使大部队顺利通过。由于这一仗意义重大，所以诗人心情无比激动，在战斗结束不久即挥笔写下此词。\n故正确答案为D。","no":40,"missingImage":false}]}],"count":32,"answerable":32,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        从一般视角看，充分陈述法律理由有助于促进公正，但本书（《司法的逻辑：实践中的方法与公正》）作者却提出：司法中是应该作出法律论证，但这种法律论证不应该追求“充分”。为什么？首先，“充分”是指除了运用细节化的明确法律规定和一般形式逻辑推理加以论证这两种方式之外，对其他辅助性论证资源的大量使用，辅助性论证资源则主要包括说理方法、经验常识、法律原理。多数情况下，仅仅运用细节化的明确法律规定及一般形式逻辑推理，这种论证只会让人感到“本来如此”，而要实现“很有道理”的论证，则势必需要不断地使用说理方法、经验常识和法律原理等。\u003c/p>\u003cp>        然而，作者经过研究后发现：其一，人们关于“说理方法”的日常经验，本身就是复杂的，比如中国古代的许多经典文本，以模糊思维和飘逸说理为特征，典型如《论语》《老子》，而西方许多经典文本，却以分析思维和精细说理为特征，两种思维说理明显不同；其二，日常生活的论证语境和法律过程的论证语境存在较大区别，后者比前者更凸显利益以及是非立场的纠葛，参与者及旁观者对后者中的论证，审视、期待、要求显然更高，从“经验常识”展开理由论证，总会引发新的疑问和追问；其三，在法学话语及法律实践话语中，关于“法律原理”的争论不胜枚举，在中国法学甚至世界法学中，几乎难以看到一个法律原理未曾遭遇反论，且法律原理常涉及规范问题，注定在价值上有主观性。\u003c/p>\u003cp>        因此，作者的结论是：法律论证是否充分与争议的化解、裁判的正当性、司法公正之间均没有必然的联系，而“单纯”的法律论证，仅适用细节化的法律规定及一般形式逻辑，以展现法律裁判的理由，是最理想的，它清晰明确、难以被质疑，几乎能最好、最有效地抵挡外部裁判异议。\u003c/p>","questions":[{"qid":"2453029","cat":"片段阅读","stem":"上文中提及的“本书作者”对司法中充分进行法律论证的态度是            。","options":{"A":"赞成","B":"不赞成","C":"不置可否","D":"怀疑"},"answer":"B","explanation":"第一段开篇通过转折词“但”引出“本书作者”对“充分进行法律论证”的态度，即“司法中是应该做出法律论证，但这种法律论证不应该追求‘充分’”，换句话说，作者对于司法中充分进行法律论证这一做法是不赞同的，锁定B项；\nA项“赞成”，D项“怀疑”，均不是作者的态度，排除；\nC项“不置可否”指不表明态度，文段作者态度很明确，即不赞同，排除；\n故正确答案为B。\n【文段出处】《老问题与新见解——读刘星&lt;司法的逻辑：实践中的方法与公正&gt;》","no":41,"missingImage":false},{"qid":"2453030","cat":"片段阅读","stem":"根据文意，下列说法不正确的是                    。","options":{"A":"中西方的说理方式不尽相同","B":"让人感到“本来如此”的法律论证方式其实是最有效的","C":"使用说理方法、经验常识和法律原理会使法律论证“很有道理”","D":"日常生活的论证语境更强调利益的诉求"},"answer":"D","explanation":"A项，根据第2自然段“比如中国古代的许多经典文本，以模糊思维和飘逸说理为特征······而西方许多经典文本，却以分析思维和精细说理为特征”，可知中国和西方的说理方式不同，表述正确，排除；\nB项，根据第1自然段“多数情况下，仅仅运用细节化的明确法律规定及一般形式逻辑推理，这种论证只会让人感到‘本来如此’”；以及第3自然段“仅适用细节化的法律规定及一般形式逻辑，以展现法律裁判的理由，是最理想的，它清晰明确、难以质疑，几乎能最好、最有效地抵挡外部裁判异议”可知，“本来如此”的法律论证方法就是最有效的，表述正确，排除；\nC项，根据第1自然段“而要实现‘很有道理’的论证，则势必需要不断地使用说理方法、经验常识和法律原理等”可知，最有效的论证方式应该是“说理方法、经验常识和法律原理等”，表述正确，排除；\nD项，根据第2自然段“其二，日常生活的论证语境和法律过程的论证语境存在较大区别，后者比前者更凸显利益以及是非立场的纠葛”可知，法律过程的论证语境更强调利益诉求，表述错误，当选；\n本题为选非题，故正确答案为D。\n【文段出处】《老问题与新见解——读刘星&lt;司法的逻辑：实践中的方法与公正&gt;》","no":42,"missingImage":false},{"qid":"2453031","cat":"片段阅读","stem":"根据文意，下列关于“单纯”的法律论证的说法，不正确的是                    。","options":{"A":"仅运用细节化的明确法律规定和一般形式逻辑推理加以论证","B":"论证不充分，难以让人信服","C":"多数情况下不影响司法的公正性","D":"比较清晰明确，不容置疑"},"answer":"B","explanation":"A项，根据最后一段“仅适用细节化的法律规定及一般形式逻辑”可知，表述正确，排除；\nB项，根据最后一段“是最理想的，它清晰明确、难以质疑”可知，该论证可以让人信服，故表述与文意相悖，当选；\nC项，根据最后一段“几乎能最好、最有效地抵挡外部裁判异议”可知，该论证方式不受外界影响，故不会影响司法的公正性，表述正确，排除；\nD项，根据最后一段“是最理想的，它清晰明确、难以质疑”可知，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《老问题与新见解——读刘星&lt;司法的逻辑：实践中的方法与公正&gt;》","no":43,"missingImage":false}]},{"type":"material","material":"\u003cp>        皇祐二年，吴中大饥，殍殣枕路，是时范文正领浙西，发粟及募民存饷，为术甚备，吴人喜竞渡，好为佛事。希文乃纵民竞渡，太守日出宴于湖上，自春至夏，居民空巷出游。又召诸佛寺主首谕之曰：“饥岁工价至贱，可以大兴土木之役。”于是诸寺工作鼎兴。又新敖仓吏舍，日役千夫。\u003c/p>\u003cp>        监司奏劾杭州不恤荒政，嬉游不节，及公私兴造，伤耗民力。文正乃自条叙所以宴游及兴造，皆欲以发有余之财以惠贫者。贸易、饮食、工技、服力之人，仰食于公私者，日无虑数万人，荒政之施，莫此为大。是岁，两浙唯杭州晏然，民不流徙，皆公之惠也。岁饥，发司农之粟，募民兴利，近岁遂著为令。既已恤饥，因之以成就民利，此先王之美泽也。\u003c/p>","questions":[{"qid":"2453083","cat":"片段阅读","stem":"下列选项中，对文中句子理解有误的一项是：","options":{"A":"“吴中大饥，殍殣枕路”。意思是吴中闹饥荒，饿死的人躺倒在路上","B":"“希文乃纵民竞渡，太守日出宴于湖上”，这里希文和太守指的都是范仲淹","C":"“又新敖仓吏舍，日役千夫。”这里“新”是形容词作动词，“日”是名词作状语","D":"“文正乃自条叙所以宴游及兴造，皆欲以发有余之财以惠贫者。”这句话的意思是范仲淹上奏辩解自己之所以宴游湖上，大兴土木、都是为了让官府可以聚集到更多钱财进而发放给贫苦的人"},"answer":"D","explanation":"A项，“吴中大饥，殍殣枕路” ，“殍殣”指饿死的人，可译为“吴中发生大饥荒，饿死者的尸体遍布于道路”，选项表述正确，排除；\nB项，“希文乃纵民竞渡，太守日出宴于湖上”，范仲淹字希文，在杭州担任太守时，遇到饥荒，且后文检察机关弹劾范仲淹“不恤荒政，嬉游不节”也可证实，是范仲淹宴饮于西湖，因此，本文中希文与太守，均指范仲淹，表述正确，排除；\nC项，“又新敖仓吏舍，日役千夫。”中，“新”指的是翻新，是一个动作，属于形容词作动词，“日”指的是每日，表示时间，属于时间名词作状语，因此，C项表述正确，排除；\nD项，根据前文可知，不仅官府在翻建，寺庙也在翻建，所以不仅是官府，还有民间寺庙，故“官府”表述片面，且根据文意可知，官府与民间为百姓提供的是工作机会，并非直接发放钱财，表述错误，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《范文正浙西救灾》","no":44,"missingImage":false},{"qid":"2453085","cat":"片段阅读","stem":"根据文意，以下（    ）项不是范仲淹采取的救荒措施。","options":{"A":"打开自家谷仓赈济灾民","B":"鼓励老百姓举行划船比赛","C":"鼓励寺院大兴土木工程","D":"招募人力修建谷仓和官府衙衙役的宿舍"},"answer":"A","explanation":"A项，根据第一段“发粟及募民存饷，为术甚备”，意为下令散发米粮以赈济灾民，并鼓励百姓储备粮食，救荒的措施非常完备，并未提及发放的是自家仓库米粮，无中生有，当选；\nB项，根据第一段“希文乃纵民竞渡”，意为范仲淹鼓励民间多举办赛事，表述正确，排除；\nC项，根据第一段“饥岁工价至贱，可以大兴土木之役。于是诸寺工作鼎兴”，意为灾荒年间民工工价最低廉，可以趁此时机大力兴建土木工程，于是各个寺院的修建工程都非常兴盛，表述正确，排除；\nD项，根据第一段“又新敖仓吏舍，日役千夫”，意为又召募工人兴建了朝廷的谷仓及官府衙役的宿舍，每天募集的工人多达一千人，表述正确，排除；\n本题为选非题，故正确答案为A。\n【文段出处】《范文正浙西救灾》","no":45,"missingImage":false},{"qid":"2453087","cat":"片段阅读","stem":"关于范仲淹的救荒措施带来的后果，以下选项中描述不恰当的一项是：","options":{"A":"造成杭州城万人空巷，老百姓每天出门游玩","B":"导致监察官员上奏弹劾范仲淹劳民伤财","C":"令灾民有机会通过贸易、饮食服务、出卖体力等从官府或私人处得到工作机会","D":"使杭州成为两浙地区唯一社会安定的地方，外地灾民也纷纷逃荒到杭州"},"answer":"D","explanation":"A项，文章第一段“希文乃纵民竞渡，太守日出宴于湖上，自春至夏，居民空巷出游”的意思是“范仲淹就鼓励民间多举办赛事，太守每日出游宴饮于西湖上，自春天到夏天，城中居民大规模出游，尽情玩赏。”，该项表述正确，排除。\nB项，文章第二段“监司奏劾杭州不恤荒政，嬉游不节，及公私兴造，伤耗民力”的意思是“监察机关弹劾杭州长官范仲淹不体恤荒政，嬉戏游乐而无节制，以及官府、私家兴建房舍，伤耗民间财力”，该项表述正确，排除。\nC项，文章第三段“贸易、饮食、工技、服力之人，仰食于公私者，日无虑数万人，······”的意思是“那些从事贸易、饮食行业的人，工匠、民夫，仰仗官府、私家养活的，每天大概可达几万人”，该项表述正确，排除。\nD项，文章第四段“是岁，两浙唯杭州晏然，民不流徙，皆公之惠也”的意思是“这一年两浙路灾区唯有杭州平安无事，百姓没有流亡的，这都是范仲淹的恩惠。”，文段并未体现“外地灾民也纷纷逃荒到杭州”，该选项表述不恰当。\n本题为选非题，故正确答案为D。\n【文段出处】《范文正浙西救灾》","no":46,"missingImage":false},{"qid":"2453088","cat":"语句表达","stem":"下列句子中，没有表达作者对范仲淹救荒措施的态度和评价的是：","options":{"A":"“是时范文正领浙西，发粟及募民存饷，为术甚备”。","B":"“荒政之施，莫此为大”。","C":"“希文乃纵民竞渡，太守日出宴于湖上”。","D":"“是岁，两浙唯杭州晏然，民不流徙，皆文正之惠也。”"},"answer":"C","explanation":"A项，指范仲淹治理浙西，下令散发米粮赈灾，并鼓励百姓储备粮食，救荒的措施非常完备，体现了对范仲淹治理措施的肯定，排除；\nB项，指救济灾荒的措施，没有比这一做法更好的了，体现了对范仲淹救灾的褒奖，排除；\nC项，指范仲淹鼓励民间多举办赛事，太守每日出游宴饮于西湖上，只是客观表述范仲淹的措施，没有体现作者对范仲淹做法的态度如何，当选；\nD项，指这一年杭州免于过重的灾祸，人民不用颠沛流离，体现了范仲淹措施得当，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《范文正浙西救灾》","no":47,"missingImage":false},{"qid":"2453006","cat":"逻辑填空","stem":"公文的力度        与思想的深度有关，        离不开语言的“加持”。劲道的公文语言        紧凑凝练、一语中的，        层层递进、步步深入，风格因人而异，        都应起到触动人心、震撼人心、激励人心的效果。","options":{"A":"既，又，不是，就是，但","B":"既，也，或，或，但","C":"因为，所以，既，又，但是","D":"不但，而且，无论，还是，然而"},"answer":"B","explanation":"第一空、第二空，根据“与思想的深度有关”“离不开语言的‘加持’”可知，此处列举了影响公文力度的两个因素，应填入表示并列或递进的连词，A项“既”“又”、B项“既”“也”均表示并列，D项“不但”“而且”表示递进，三项均符合文意，保留。C项“因为”“所以”表示因果关系，排除。\n第三空、第四空，根据后文信息“风格因人而异”可知，前文是在列举公文语言的不同风格。B项“或”“或”可以表示列举，符合文意，保留；A项“不是”“就是”表示二者择其一的选择关系，公文语言不是只有这两种风格，排除；D项“无论”“还是”表假设关系，文段列举的两种风格并不属于假设，排除。\n第五空代入验证，文段意为不同风格的公文语言都具有同样的效果，前后语义相反，B项“但”表示转折，逻辑通顺，符合文意，当选。\n故正确答案为B。\n【文段出处】东方资讯《【遴选公文写作】公文语言“成熟度”是什么？如何提高“成熟度”？》","no":48,"missingImage":false},{"qid":"2453059","cat":"逻辑填空","stem":"必须承认，我们在给年轻人贴上“个性”标签的同时，其实多少也暗含着不够成熟不够理性的主观评价。问题是，哪一代人不都是从            的青年时代，逐渐走向成熟和理性的？都需要经历从学生到职业人的身份      ，这种转变对每个人来说都不是            的。\n填入画线部分最恰当的一项是：","options":{"A":"稀里糊涂  蜕变  顺顺当当","B":"稀里糊涂  改变  风平浪静","C":"懵懵懂懂  改变  风平浪静","D":"懵懵懂懂  蜕变  顺顺当当"},"answer":"D","explanation":"第一空，搭配“青年时代”，和“成熟和理性”语意相反，C、D两项“懵懵懂懂”形容什么也不知道，置于文段可体现青年时代的青涩、不成熟，符合文意，保留。A、B两项“稀里糊涂”指不明白、迷糊，其反义为“明明白白”，与“成熟和理性”无关，排除。\n第二空， C项“改变”指变化、更改。D项“蜕变”泛指人或事物发生质变。根据文段可知，每个人的身份都会由学生变为职业人，这种变化是身份的完全变化，D项“蜕变”符合文意，排除C项。\n第三空代入验证，根据文意可知，在身份发生较大变化的过程中，不可能一点困难都不会遇到，D项“顺顺当当”符合语境，当选。\n故正确答案为D。\n【文段出处】《不必放大95后“秒辞”现象》","no":49,"missingImage":false},{"qid":"2453008","cat":"逻辑填空","stem":"根据上海市统一规划，新扬子江码头将洗去征尘，转换角色，一改昔日军港码头的        ，嬗变成黄浦江45公里美丽岸线中一段特别风景。今后，当我们流连忘返，徜徉其间，享受习习江风，观赏浦江两岸美景的时候，千万别忘了海军扬子江码头——这朵昔日洁白无比的海上珊瑚花，曾带给我们这座城市的        、        与美好。","options":{"A":"肃穆，宁静，光荣","B":"宁静，安宁，光荣","C":"肃静，安宁，荣耀","D":"安宁，宁静，荣耀"},"answer":"C","explanation":"第一空，与“军港码头”搭配，A项“肃穆”、C项“肃静”意为严肃而安静，可以表示军港码头应具有的特性，保留；B项“宁静”、D项“安宁”意为平静、安静，体现不出带有军事色彩的军港码头的特性；且后文“嬗变”意为蜕变、更替，故前后文语义应该相反，B项“宁静”、D项“安宁”无法与后文“美丽岸线中一段特别风景”构成相反的语义关系，故排除B、D两项。\n第二空，横线处应体现出军港码头给城市带来的作用，C项“安宁”指安定、太平，符合军港码头对城市所起的作用，保留。A项“宁静”侧重于平静，体现不出军港对于城市的保护作用，排除。\n第三空，代入验证，C项“荣耀”指美好的声誉，符合文意，当选。\n故正确答案为C。\n【文段出处】搜狐网《别了，黄浦江畔的扬子江码头》","no":50,"missingImage":false},{"qid":"2453063","cat":"逻辑填空","stem":"因为资金迟迟未能到位，      发电站的工程一直      不前。\n填入画线部分最恰当的一项是：","options":{"A":"水力  停止","B":"水利  停止","C":"水力  停滞","D":"水利  停滞"},"answer":"C","explanation":"第一空，A、C两项“水力”指水流所产生的动力。B、D两项“水利”指对水资源的开发利用和防止水灾，也指代水利工程。根据文意，发电站是利用水流的力量进行发电的，应使用“水力”，排除B、D两项。\n第二空，A项“停止”指不再进行、不再实行；C项“停滞”指因为受到阻碍，不能顺利地运动或发展。根据文段“因为资金迟迟未能到位”可知，水电站的发展受到了资金的阻滞而不能顺利发展，C项“停滞”更加符合文意，A项“停止”程度过重，排除。\n故正确答案为C。","no":51,"missingImage":false},{"qid":"2452998","cat":"语句表达","stem":"图灵在密码方面取得的成就                    。他发明了“图灵机”，虽然这个机器当时是为战争服务的，但是，在人工智能的发展历史中，却是            的一个事件。","options":{"A":"可望而不可即，开天辟地","B":"可望而不可及，开天辟地","C":"可望而不可及，开天劈地","D":"可望而不可即，开天劈地"},"answer":"B","explanation":"第一空，“即”指靠近，接近，“可望而不可即”指可以望到但无法接近。“及”指达到，赶上，“可望而不可及”指只可仰望而无法赶上。横线处搭配“成就”，表达图灵的成就是其他事物赶不上的，故B、C两项更加符合文意，排除A、D两项。\n第二空，B项“开天辟地”指前所未有，有史以来的第一次，置于文段表达“图灵机”是人工智能发展历史上的一个开端性事件，符合文意，当选。C项“开天劈地”属成语误用，排除。\n故正确答案为B。","no":52,"missingImage":false},{"qid":"2453011","cat":"语句表达","stem":"下列语句中，不能契合孟子“舍生取义”精神的一项是                     。","options":{"A":"人生自古谁无死，留取丹心照汗青。","B":"为国坚诚款，捐躯忘贱贫。","C":"粉身碎骨全不怕，要留清白在人间。","D":"人固有一死，或重于泰山，或轻于鸿毛。"},"answer":"B","explanation":"孟子“舍生取义”意为维护正义事业而不怕牺牲生命，牺牲自己。\nA项，“人生自古谁无死，留取丹心照汗青”出自文天祥的《过零丁洋》，意为自古以来没有人能够长生不死，我要留一片爱国的丹心映照史册，能够体现出舍生取义的精神，排除。\nB项，“为国坚诚款，捐躯忘贱贫”出自骆宾王的《咏怀古意上裴侍郎》，意为治理国家要忠诚、真诚，为国家奉献不分贵贱，未能体现出当生命与道义发生冲突时，选择道义，当选。\nC项，“粉身碎骨全不怕，要留清白在人间”出自于谦的《石灰吟》，意为即使粉身碎骨也毫不惧怕，只要把高尚的节操留在人世间，能够体现出舍生取义的精神，排除。\nD项，“人固有一死，或重于泰山，或轻于鸿毛”出自司马迁的《报任安书》，意为人终究免不了一死，但死的价值不同，为了人民正义的事业而死就比泰山还重，而那些自私自利、损人利己的人之死就比鸿毛还轻，能够体现出舍生取义的精神，排除。\n本题为选非题，故正确答案为B。","no":53,"missingImage":false},{"qid":"2453065","cat":"语句表达","stem":"下列句子中，没有语病的一项是：","options":{"A":"十八大以来，党和政府加大了对贪污、腐败、徇私枉法等的查处和打击，做到发现一起，查处一起。","B":"改革公费医疗制度，实施医疗保险的问题，对于广大群众并不是一下子就能接受的，相关政府部门应耐心做好宣传、解释工作。","C":"能否做好水资源的开源和节流，是西部开发成功的关键。","D":"波澜壮阔的改革开放和现代化建设，为广大有志青年提供了一个驰骋、进取的广阔空间。"},"answer":"D","explanation":"A项缺少宾语，应改为“加大了对贪污、腐败、徇私枉法等的查处和打击力度”，排除；B项介词滥用，“对于广大群众并不是一下子就能接受的”应删掉“对于”，排除；C项一面对两面，应把“能否做好水资源的开源和节流”中的“能否”删去或改为“是西部开发成功与否的关键”，排除；D项语句通顺，语义明确，没有语病，当选。\n故正确答案为D。","no":54,"missingImage":false},{"qid":"2453014","cat":"片段阅读","stem":"下列划线成语“一言以蔽之”的用法，错误的一项是      。","options":{"A":"精明的贾母，竞被王熙凤\u003cu>一言以蔽之\u003c/u>，不知不觉就上当了。","B":"有个别提案和建议看起来“不接地气”，究其原因，要么缺少充分的科学论证，要么没有相关的数据支撑······\u003cu>一言以蔽之\u003c/u>，就是缺乏扎实深入的调查研究。","C":"如果没有第三者，离婚分手的原因往往是很复杂的，是难以\u003cu>一言以蔽之\u003c/u>的。","D":"\u003cu>一言以蔽之\u003c/u>，就是“中国人始终认为，世界好，中国才能好；中国好，世界才更好”。"},"answer":"A","explanation":"“一言以蔽之”指用一句话来概括。\nA项，该句语义为精明的贾母被王熙凤的话蒙蔽了，“一言以蔽之”在此处使用错误，当选；\nB项，该句指出个别提案和建议看起来“不接地气”的原因较多，后文对这些原因进行概括，即“缺乏扎实深入的调查研究”，“一言以蔽之”在此处用法正确，排除；\nC项，该句语义为离婚分手的原因很复杂，难以用一句话概括，“一言以蔽之”在此处用法正确，排除；\nD项，该句通过“一言以蔽之”进行概括总结，接着引出中国人的观点，“一言以蔽之”在此处用法正确，排除。\n本题为选非题，故正确答案为A。","no":55,"missingImage":false},{"qid":"2453068","cat":"片段阅读","stem":"①由于蛋黄的比重小于蛋白，选择将鸡蛋的大头向上直立存放，即使蛋白变稀，也不会很快发生蛋黄贴皮现象。\n②这是因为鲜鸡蛋的蛋清是浓稠的，但随着存放时间的延长以及外界温度的变化，蛋白会逐渐变稀，从而失去固定蛋黄的作用。\n③储存鸡蛋时要将鸡蛋竖着放，而且要将鸡蛋的大头朝上。\n④这样既可防止微生物侵入蛋黄，也有利于保证蛋品的质量。\n下列语句按照合理的逻辑顺序，排列正确的一项是：","options":{"A":"②①③④","B":"①④③②","C":"③②①④","D":"③④②①"},"answer":"C","explanation":"观察选项，确定首句。①、②、③充当首句，②出现指代词“这是”，且没有出现指代对象，故不适合作首句，排除A项；比较①、③两句，③句提出要将“鸡蛋的大头朝上”这一话题，①句围绕这一话题进行原因的论述，故③句更适合作首句，排除B项。\n对比C和D发现，②出现指代词“这”、关联词“因为”，属于原因分析，而③句论述了“储存时将鸡蛋的大头朝上”这一做法，②句属于对③句做法的原因分析，故③②可以构成捆绑，排除D项，C项符合逻辑，当选。\n故正确答案为C。\n【出处】腾讯网《储存鸡蛋时一定要这样放不但防微生物还保证质量》","no":56,"missingImage":false},{"qid":"2453020","cat":"片段阅读","stem":"对下面一则广告的修改意见最恰当的一组是        。\nxx山庄位于西天目山，夏天特别凉爽，白天不用扇子，夜晚不离被子。山庄总面积4000多平方米，可同时接待近200多人，伙食分餐、桌餐任选，周围瀑布、水库、竹林美不胜收，室内卡拉OK、棋牌、乒乓应有尽有，是朋友小聚，避暑休闲的好去处。\n（1）“西天目山”改成“天目山西边”；\n（2）“夏天”改成“气候”；\n（3）“同时接待近200多人”中的“近”或“多”去掉一个；\n（4）“美不胜收”改成“数不胜数”；\n（5）“朋友小聚”后逗号改成顿号。","options":{"A":"（1）（4）","B":"（2）（4）","C":"（3）（5）","D":"（4）（5）"},"answer":"C","explanation":"（1）“西天目山”是国家级森林和野生动物类型的自然保护区，并没有“天目山西边”的说法，无需修改；（2）“夏天凉爽”说法没有问题，无需修改；（3）“近200人”是不到200，“200多人”是比200多，“近”与“多”两者矛盾，应该去掉一个，说法正确，当选；（4）“美不胜收”指美好的东西很多，一时看不过来。在广告当中表达瀑布、水库、竹林很美，没有问题，无需修改；（5）“朋友小聚”、“避暑休闲”为并列关系，改为顿号更加恰当，说法正确，当选。\n故正确答案为C。","no":57,"missingImage":false},{"qid":"2453022","cat":"片段阅读","stem":"2018年，国家大幅上调了科学技术奖的奖金标准，最高奖奖金由此前的500万元/人上调至800万元/人，且全部由获奖者个人支配。在人们的印象里，科研工作者的形象似乎总是与清苦绑定在一起，科研中个人智力劳动的价值，常常被有意无意地轻视。事实上，没有科研工作者的个人努力与智慧，再多的投入，也不能确保取得相应的产出。因此，不论是国家、社会还是科研机构，都该为他们的努力提供回报。这也传达出一个信号，国家尊重科研工作中个人的价值，或者说，只要能取得相应的成就，科研工作者就完全可以堂堂正正地过上富裕、优渥的生活。也只有这样，科研事业才能有源源不断的新鲜血液注入，进而变得更加繁荣、昌盛。\n这一文段的主要意思是                    。","options":{"A":"国家大幅上调了科学技术奖的奖金标准","B":"要加大对科研中个人智力劳动的奖励","C":"科研工作者配得上这样的奖励","D":"科研工作者的清苦生活已在改变"},"answer":"C","explanation":"文段首先介绍国家上调科学技术奖奖金标准的举措，紧接着指出科研中的个人智力劳动价值常被轻视，随后通过“事实上”转折指出科研工作者的价值及重要性，否定前文大家的固有印象，所以多方都应该为科研工作者的努力提供回报，说明此次调整奖金标准是合情理的。后文通过“这也传达出一个信号”“也只有这样”强调“提供回报”这一情况反映出的是只要能取得相应的成就，科研工作者完全可以堂堂正正过上富裕的生活，也就是说我们要改变固有观念。文段重在强调科研工作者只要有相应的成绩完全可以过上富裕的生活，对应C项。\nA项，为文段开头背景引入部分，偏离文段重点，排除；\nB项，“要加大”为将来时，而对科研中个人智力劳动的奖励是已有的客观现象，表述不符；且文段重点并非加大奖励，而是转变固有思想观念，认可科研工作者取得成就后的奖励，排除；\nD项，“已在改变”属于客观事实的描述，并非文段重点，排除。\n故正确答案为C。\n【文段出处】中国青年报《800万元奖金全归个人 科研工作者配得上这样的奖励》","no":58,"missingImage":false},{"qid":"2453021","cat":"片段阅读","stem":"美国近期发射了“帕克太阳探测器”。该探测器比之前的任何探测器飞得离太阳表面更近，在严酷的高温和辐射条件下，将深入探索太阳，希冀解开重大谜团。\n下面说法与这段文字相符的是        。","options":{"A":"“帕克太阳探测器”能深入太阳对其进行探索","B":"美国发射的太阳探测器离太阳更近","C":"“帕克太阳探测器”将承受高温以及太阳辐射的考验","D":"有了“帕克太阳探测器”，太阳的重大谜团将被解开"},"answer":"C","explanation":"A项，根据“飞得离太阳表面更近”“将深入探索太阳”可知文段表达的意思是距离太阳很近，然后进一步探索太阳，而“深入太阳对其进行探索”意为进入太阳里面进行探索，故表述与文意不符，排除；\nB项，根据“该探测器比之前的任何探测器飞得离太阳表面更近”可知，文段特指美国发射的“帕克太阳探测器”离太阳很近，并非美国发射的所有的太阳探测器都离太阳近，故表述与文意不符，排除；\nC项，根据“在严酷的高温和辐射条件下，将深入探索太阳”可知，表述正确，当选；\nD项，根据“希冀解开重大谜团”可知，只是一种希望，并不能得出“重大谜团将被解开”的结论，表述错误，排除。\n故正确答案为C。\n【文段出处】人民日报《美将发射帕克太阳探测器：掀起新高潮或解重大谜团》","no":59,"missingImage":false},{"qid":"2453071","cat":"片段阅读","stem":"当人体骨骼发生骨质疏松时，疏松的骨骼会在体重负荷之下出现“微骨折”，这些“微骨折”日积月累，会造成骨骼塌陷、关节变形等病变，发生“差异性沉降”。其中，脊柱、胫骨近端等部位差异沉降最为显著和典型。胫骨内外侧平台的“差异性沉降”导致膝关节内侧软骨受压超过临界值，逐渐变薄、退变，继而关节研磨加重，从而导致膝关节骨性关节炎。\n下列说法与上文意思不相符的是：","options":{"A":"胫骨的“差异性沉降”是导致膝关节骨性关节炎发生和发展的主要原因","B":"骨质疏松是导致膝关节骨性关节炎发生和发展的重要原因","C":"骨骼的“差异性沉降”出现在膝关节骨性关节炎的发病过程中","D":"在体重载荷的长期作用下，人体骨骼会发生不同程度的沉降"},"answer":"D","explanation":"A项，根据尾句“胫骨内外侧平台的‘差异性沉降’......从而导致膝关节骨性关节炎。”可知，胫骨的“差异性沉降”是导致膝关节骨性关节炎发生和发展的主要原因，表述正确，排除；\nB项，根据文意可知，骨质疏松会出现“微骨折”，进而发生“差异性沉降”，从而导致膝关节骨性关节炎，故表述正确，排除；\nC项，根据尾句“胫骨内外侧平台的‘差异性沉降’......从而导致膝关节骨性关节炎。”可知，骨骼的“差异性沉降”是出现在膝关节骨性关节炎的发病过程中，表述正确，排除；\nD项，根据“当人体骨骼发生骨质疏松时，疏松的骨骼会在体重负荷之下出现‘微骨折’，......发生‘差异性沉降’。”可知，疏松的骨骼会在体重负荷之下出现“差异性沉降”，选项夸大范围，故表述错误，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《膝关节磨损 该换膝还是保膝》","no":60,"missingImage":false},{"qid":"2453073","cat":"片段阅读","stem":"前几年，一些不法分子打着“助学”的旗号，大肆在校园推销“高利贷”。将目标重点放到涉世未深的大学生身上，一时间大行其道，由于设置了各种难以识别的“套路”，利息高得骇人，以及恶意逼债等，导致有的学生在压力之下不得不休学，出卖隐私，甚至出现跳楼自杀的悲剧。现在，经过教育、公安等部门的通力合作，“校园贷”已从大学校园里被清除出去，但并未绝迹，仍在危害社会。实际上大学生也有教训可以吸取，在父母的宠爱之下，在一些所谓时尚生活的诱惑下，往往过度追求超越自身和其家庭经济状况的高消费，没能认识“校园贷”的危害。因此，                    。\n填入画线处最恰当的一句是：","options":{"A":"教育、公安等部门要继续严格清除“校园贷”","B":"大学生有必要进行反思加强自律","C":"大学生要远离“校园贷”","D":"大学生要增强对“校园贷”危害的认识"},"answer":"B","explanation":"横线出现在文段结尾，且由“因此”引导，故需要对前文进行总结。文段开头引出不法分子在校园推销“高利贷”的话题。紧接着具体介绍了校园“高利贷”对大学生的危害，并指出教育、公安等部门的通力合作，“校园贷”已从大学校园里被清除出去，但仍在危害社会。后文出现一个“实际上”，话锋一转，开始分析大学生自身的问题，“在一些所谓时尚生活的诱惑下，往往过度追求超越自身和其家庭经济状况的高消费，没能认识&#39;校园贷&#39;的危害”，归根结底主要问题还是没能抵御诱惑。所以横线上的内容应该针对学生没能抵住诱惑提出具体对策，即学生要有自我约束能力，不断反思加强自律，对应B项。\nA项“教育、公安等部门”为转折之前内容，非重点，排除；\nC项远离“校园贷”表述不明确，文段强调“大学生本人进行反思加强自律”，排除；\nD项“增强对&#39;校园贷&#39;危害的认识”，是针对“没能认识&#39;校园贷&#39;的危害”这个问题，但这并非根本问题，最根本的问题是大学生没有抵御住诱惑，所以对策没有针对性，排除。\n故正确答案为B。\n【文段出处】中国青年报《重拳打击“校园贷” 大学生也要自律》","no":61,"missingImage":false},{"qid":"2453024","cat":"片段阅读","stem":"为了满足人们的肉类需求，目前有200亿只鸡、15亿头牛和10亿只羊占领着地球四分之一的土地，吃掉了世界上30%的农作物，消耗着大量的淡水。研究表明，获得一公斤的牛肉大约需要消耗1.5万升淡水，而收获一公斤的玉米或小麦只需要1500升。牲畜和禽类产生的废弃物对环境气候也毫无裨益，根据联合国粮食及农业组织的统计，家禽产生的废气占全部人为温室气体的14.5%。\n上面语段传递的信息是                    。","options":{"A":"畜牧业加剧了地球环境的恶化","B":"肉类生产方式将逐步被改变","C":"素食是关系人们真正健康长寿、自然环境保护和人类生存发展的大事，因此将在全世界普遍提倡","D":"传统养殖业即将转型"},"answer":"A","explanation":"文段开篇指出为了满足肉类需求，地球上大量土地被动物占用，农作物和淡水被大量消耗，接着通过数据对比牛肉与谷物的耗水量，进一步说明畜牧业对资源的大量消耗。后文通过“也”引出另一方面，指出牲畜和禽类产生的废弃物对环境气候有不利影响，并引用数据说明家畜产生的废弃物在温室气体中的占比。故文段从资源消耗和环境污染的角度，论述了畜牧业对地球环境的负面影响，对应A项。\nB、C、D三项：B项“肉类生产方式将逐步被改变”、C项“素食”、D项“传统养殖业”文段均未提及，无中生有，排除。\n故正确答案为A。","no":62,"missingImage":false},{"qid":"2453025","cat":"片段阅读","stem":"海洋二号B卫星是我国第二颗海洋动力环境系列卫星，是我国民用空间基础设施规划的海洋业务卫星。该星将与后续发射的海洋二号C卫星和D卫星组成我国首个海洋动力环境卫星星座，可大幅提高海洋动力环境要素全球观测覆盖能力和时效性。海洋二号B卫星成功发射后，卫星获取的海风、海浪、海流、海温等海洋动力环境信息可进一步满足海洋业务需求并兼顾气象、减灾、水利等其他行业的应用需求，为国民经济建设和国防建设、海洋科学研究、全球气候变化提供数据支持，同时也将在国际对地观测体系中发挥重要作用，为我国积极参与全球治理提供技术支撑。\n下面说法与上文意思不相符的是","options":{"A":"海洋二号B卫星能够获取全球海面风向、浪高等多种海洋动力环境参数","B":"海洋二号B卫星接收的数据可应用于气象、农业和应急管理等领域","C":"海洋二号C卫星和D卫星比B卫星的海洋动力环境要素全球观测覆盖能力和时效性更强","D":"海洋二号B卫星将在国际对地观测体系中发挥重要作用"},"answer":"C","explanation":"A项，根据文段“卫星获取的海风、海浪、海流、海温等海洋动力环境信息”可知，表述符合文意，排除；\nB项，根据文段“信息可进一步满足海洋业务需求并兼顾气象、减灾、水利等其他行业的应用需求”可知，表述正确，排除；\nC项，文段中没有提及海洋二号C卫星和D卫星与B卫星之间的对比，无关对比，当选；\nD项，根据“同时也将在国际对地观测体系中发挥重要作用”可知，符合文意，排除。\n本题为选非题，故正确答案为C。\n【文段出处】人民日报：《我国成功发射海洋二号B卫星》","no":63,"missingImage":false},{"qid":"2453026","cat":"片段阅读","stem":"语言经济学作为一门新兴的交叉学科，是运用经济学的概念、分析方法及工具，把语言作为变量，不仅研究语言本身产生、发展、演化和变迁的规律和路径，语言对个体的作用机理和传导机制等内容，而且考察语言在经济活动中的作用以及语言和经济活动之间的关系，并在此基础上，为语言教育、翻译等语言产业的发展及相关语言政策的制定提供建议。\n根据上文意思，下面说法有误的是                    。","options":{"A":"语言经济学是运用经济学的方法研究不同语言的产生和演化","B":"语言经济学的研究重点是语言、语言政策及其演变对经济活动的影响","C":"语言经济学的研究目的是使语言更好地服务于经济发展和社会生活","D":"从学科发展的角度来看，语言经济学将有效促进语言学和经济学之间的跨学科互动，对推动经济学和语言学的发展都有着重要意义"},"answer":"B","explanation":"根据提问可知，本题为细节判断题。\nA项，对应文段“研究语言本身产生、发展、演化和变迁的规律和路径”，选项表述正确，排除；\nB项，由文段“不仅研究语言本身产生、发展、演化和变迁的规律和路径，语言对个体的作用机理和传导机制等内容，而且考察语言在经济 铺一层，共9个立方体；接下来满足正面和左侧面，需要10个立方体即可，如下图所示，共有9+10=19个立方体。所以至少需要19个单位立方体。\u003cimg data-k=\"4e5bf312a733\" style=\"max-width:677px\">\n故正确答案为B。\n备注：如下图所示，实际可以通过9+6=15个单位立方体摆出满足题目要求的图形，但由于选项最小为17，出题人应该不是考查这种思路，故猜测本题答案为19。\n\u003cimg data-k=\"532c2163b5ea\" style=\"max-width:662px\">","no":87,"missingImage":false},{"qid":"2453092","cat":"数学运算","stem":"如图所示，则\u003cimg data-k=\"e60e374bef03\">的度数是\u003cu>        \u003c/u>。\n\u003cimg data-k=\"0bbc23242808\" style=\"max-width:527px\">","options":{"A":"\u003cimg data-k=\"1a42724182ae\">","B":"\u003cimg data-k=\"8cdcbb8b636d\">","C":"\u003cimg data-k=\"d5648066255d\">","D":"\u003cimg data-k=\"3d5a02576e7d\">"},"answer":"C","explanation":"如下图，延长直线CF交AB于点G，交DE于点H。则根据三角形两个内角和等于第三个角的外角可得\u003cimg data-k=\"5812255745c3\">，\u003cimg data-k=\"d30dfb263ad4\">，则\u003cimg data-k=\"e60e374bef03\">\u003cimg data-k=\"f9eb4c13ec13\">\u003cimg data-k=\"2a01c94fcc79\">，即四边形DHGA内角和为\u003cimg data-k=\"cf0947f5c839\">。\n\u003cimg data-k=\"a1a490e46f4f\" style=\"max-width:293px\">\n故正确答案为C。","no":88,"missingImage":false}]}],"count":23,"answerable":23,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"2452945","cat":"类比推理","stem":"从金属利用的历史来看，先是青铜器时代，而后是铁器时代，铝的利用是近百年的事。下列选项中，与金属利用的先后顺序相关度最高的是                    。","options":{"A":"地壳中金属的含量","B":"金属冶炼的难易","C":"金属的导电性和延展性","D":"金属制品的用途"},"answer":"B","explanation":"铜、铁、铝三种金属活动性由强到弱的顺序为：铝\u003cimg data-k=\"f29c047cf8c7\">铁\u003cimg data-k=\"f29c047cf8c7\">铜；金属活动性越强，金属的冶炼难易程度越难，冶炼技术要求越高，因而人类早期只能使用较容易冶炼的铜，随后才是铁，最后是铝。\n故正确答案为B。","no":89,"missingImage":false},{"type":"question","qid":"2453061","cat":"类比推理","stem":"将气体溶于水有多种装置，如果是一种有毒气体，下列装置最合适的是（  ）。\n\u003cimg data-k=\"db23db9ae499\" style=\"max-width:412px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"A项：烧杯敞口，有毒气体若未充分溶解会散发到空气中，造成危害，错误；\nB项：倒扣漏斗虽然增加了气体与水的接触面，但是烧杯敞口，可能导致未充分溶解的有毒气体散发到空气中，造成危害，错误；\nC项：装置封闭，玻璃管中气体无法排出，水只能溶解少量气体，错误；\nD项：第一次未溶解气体通入到敞口烧杯内，会进行再次溶解，能使有毒气体充分溶于水，正确。\n故正确答案为D。","no":90,"missingImage":false},{"type":"question","qid":"2452955","cat":"逻辑判断","stem":"物质的结构决定性质，微粒间的相互作用力越强，熔点越高。一些氧化物的熔点如下表所示：\n\u003cimg data-k=\"138be6dc86aa\" style=\"max-width:504px\">\n下列选项中，不能解释氧化物熔点存在差异的是\u003cu>                    \u003c/u>。","options":{"A":"分子晶体中的作用力是相对较弱的分子间作用力","B":"离子晶体中的作用力是相对较强的离子键","C":"原子晶体中的作用力是相对较弱的共价键","D":"\u003cimg data-k=\"a1173fa7ee84\">中的离子键弱于\u003cimg data-k=\"938d020d9bc0\">的"},"answer":"C","explanation":"A项，分子晶体中的作用力是分子间作用力，不是化学键，作用力较弱，熔沸点较低，故A项可以解释氧化物的熔点差异；\nB项，离子晶体中的作用力是离子键，属于化学键，作用力较强，熔沸点较高，故B项可以解释氧化物的熔点差异；\nC项，原子晶体中的作用力是共价键，属于化学键，作用力很强，熔沸点一般很高，故C项表述错误，不能解释氧化物的熔点差异；\nD项，\u003cimg data-k=\"a1173fa7ee84\">和\u003cimg data-k=\"938d020d9bc0\">是离子晶体，离子晶体中的作用力为离子键，离子键能越大，晶体的熔点越高，因为\u003cimg data-k=\"a1173fa7ee84\">的离子键弱于\u003cimg data-k=\"938d020d9bc0\">，所以\u003cimg data-k=\"a1173fa7ee84\">的熔点比\u003cimg data-k=\"938d020d9bc0\">的熔点低，故D项可以解释氧化物的熔点差异。\n故正确答案为C。","no":91,"missingImage":false},{"type":"question","qid":"2453069","cat":"类比推理","stem":"医院吸氧的氧气吸入器（图2），其作用原理与图1类似，关于该装置，下列说法错误的是（  ）。\n\u003cimg data-k=\"864373d04e1e\" style=\"max-width:500px\">","options":{"A":"可以用来湿润氧气","B":"B导管连接氧气钢瓶","C":"可以用来观察输出氧气的流速","D":"可以用来观察是否有氧气输出"},"answer":"B","explanation":"A项：氧气从A导管通入，通入水中，再通过B导管排出，可以用来湿润氧气，正确；\nB项：若B导管连接氧气钢瓶通入氧气，则会导致瓶内气体气压增大，使水从A导管排出，错误；\nC项：氧气不易溶于水，通过水时会看见有气泡生成，故可以通过观察气泡产生的速度判别输出氧气的速度，正确；\nD项：氧气不易溶于水，可以通过观察是否有气泡产生，判别是否有氧气输出，正确。\n本题为选非题，故正确答案为B。","no":92,"missingImage":false},{"type":"question","qid":"2452960","cat":"逻辑判断","stem":"过氧化氢(\u003cimg data-k=\"734f90d791a4\">)的沸点比水高，但受热易分解。某试剂厂制得浓度\u003cimg data-k=\"7b63c376ca57\">~\u003cimg data-k=\"b956f6c8ed4d\">的过氧化氢溶液，再浓缩成\u003cimg data-k=\"a1f51a060389\">的溶液时，可采用的适宜方法是\u003cu>            \u003c/u>。","options":{"A":"常压蒸馏","B":"减压蒸馏","C":"加压蒸馏","D":"加生石灰，常压蒸馏"},"answer":"B","explanation":"过氧化氢的沸点比水高，但受热易分解，浓缩过氧化氢溶液时，应避免加热，常压、加压蒸馏，均需加热，故A项、C项错误。生石灰与水反应会放出大量的热，会使过氧化氢分解，故D项错误。适宜方法应为减压蒸馏，减压可降低水的沸点，使水在较低温度下沸腾，得到浓缩的过氧化氢溶液，B项正确。\n故正确答案为B。","no":93,"missingImage":false},{"type":"question","qid":"2452961","cat":"类比推理","stem":"“蹦极”是一种极富刺激性的游乐项目，如图所示为一根橡皮绳，一端系住人的腰部，另一端固定在跳台上。当人落至图中A点时，橡皮绳刚好被拉直，当人落至图中B点时，橡皮绳对人的拉力大小与人的重力大小相等，C点是游戏者所能达到的最低点。在游戏者离开跳台到最低点的过程中，不计空气阻力，下列说法正确的是\u003cu>                    \u003c/u>。\n\u003cimg data-k=\"9402f16117c7\" style=\"max-width:189px\">","options":{"A":"游戏者的动能一直在增加","B":"游戏者到达B点时重力势能最小","C":"游戏者到达B点时动能最大","D":"游戏者在C点时的弹性势能最小"},"answer":"C","explanation":"在蹦极的过程中，绳子还没有完全拉直时，游戏者的速度越来越快，因此动能逐渐增加；在A点和B点之间，游戏者受重力和绳子向上的拉力作用，由于重力大于拉力，因此合力方向向下，加速度方向向下，速度仍然在增加，动能依然在增加；在B点和C点之间，绳子向上的拉力开始大于重力，合外力方向向上，加速度方向向上，因此速度逐渐减少，直至C点时速度为0，动能逐渐减少。因此A项错误、C项正确。\n游戏者在出发点处位置最高，重力势能势能最大，在C点处位置最低，重力势能最小，B项说法错误。\n弹性势能是物体由于发生弹性形变而具有的能量，弹性形变越大，弹性势能越大。在C点处，绳子被拉至最长，因此弹性势能最大，D项说法错误。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"2452970","cat":"类比推理","stem":"某国研制出一种用超声波做子弹的枪，当超声波达到一定强度时就能有较强的攻击力，实际要阻挡这一武器的袭击，只要用薄薄的一层            。","options":{"A":"半导体","B":"磁性物质","C":"真空带","D":"绝缘物质"},"answer":"C","explanation":"超声波是频率高于20000赫兹的声波，属于声波的一种。由于声波不能在真空中传播，故只要设置一层真空带，就能阻断超声波子弹的攻击。\n故正确答案为C。","no":95,"missingImage":false},{"type":"question","qid":"2452967","cat":"类比推理","stem":"如图所示，匀速向东行驶的火车车厢中，光滑水平桌面上正中位置放有一个相对静止的小球。右下图是小球的俯视图，A为初始位置，曲线为小球相对桌面的运动轨迹，可以判断\u003cu>                    \u003c/u>。\n\u003cimg data-k=\"ca3a02ce2e0f\" style=\"max-width:469px\">","options":{"A":"火车向北减速转弯","B":"火车向西减速前进","C":"火车向东加速前进","D":"火车向南减速转弯"},"answer":"A","explanation":"\u003cimg data-k=\"6c0bd7308afd\" style=\"max-width:233px\">\n根据题意，小球与桌面相对静止，则小球和桌面同时向东做匀速直线运动，由小球相对桌面的运动轨迹可知，小球相对桌面的运动速度可以分解为正东方向和正南方向的两个分速度，由于桌面是光滑的，对小球没有摩擦力，小球在惯性作用下继续保持匀速向东运动（即火车原有的速度）。以小球作为参照物，火车和桌面的运动速度可分解为正西方向和正北方向。\nA项，火车向北减速转弯，火车和桌面相对于小球有正西方向和正北方向的分速度，正确；\nB项，火车向西减速前进，火车和桌面相对于小球运动方向为正西，错误；\nC项，火车向东加速前进，火车和桌面相对于小球运动方向为正东，错误；\nD项，火车向南减速转弯，火车和桌面相对于小球有正西方向和正南方向的分速度，错误。\n故正确答案为A。","no":96,"missingImage":false},{"type":"question","qid":"2453072","cat":"类比推理","stem":"如图所示，重为G质量分布均匀的梯子斜搁在光滑的竖直墙面上，重为Q的人沿梯子从低端A处开始匀速向上走向顶端B处，整个过程梯子不滑动。则下列说法中正确的是（  ）。\n\u003cimg data-k=\"d49c13c8eff3\" style=\"max-width:236px\">","options":{"A":"梯子对墙面的压力变大","B":"地面对梯子的支持力变小","C":"梯子对墙面的压力变小","D":"地面对梯子的支持力变大"},"answer":"A","explanation":"人在上爬的过程中，梯子和人的构成的系统处于平衡状态。对整体进行受力分析，竖直方向上，受到地面提供的竖直向上的支持力，人与梯子提供的竖直向下的重力，处于平衡状态，由于梯子和人的重力不发生改变，所以地面对梯子的支持力不发生改变，即支持力不会变小也不会变大，排除选项B、D。\n \u003cimg data-k=\"b5c9cfd1ddb8\" style=\"max-width:242px\">\n将梯子看成轻质杠杆，A点为支点，将人的重力看成动力，墙对梯子的支持力看成阻力，随着人向上走，重力不变，但动力臂\u003cimg data-k=\"37fbe77dab72\">变大，而阻力臂\u003cimg data-k=\"d9733b0e8d41\">不变，根据平衡状态下，\u003cimg data-k=\"06630ba347c0\">，可以推出阻力变大，即墙对梯子的支持力变大，梯子对墙面的压力也变大。\n故正确答案为A。","no":97,"missingImage":false},{"type":"question","qid":"2453074","cat":"逻辑判断","stem":"如图所示、AB为一根两端封闭的玻璃粗管，其中装满水，水中有一个直径小于粗管直径的乒乓球。当玻璃管以中点O点开始在水平面内顺时针转动时，则（  ）。\n\u003cimg data-k=\"b1b174458899\" style=\"max-width:496px\">","options":{"A":"乒乓球向A端移动，当转动够快时乒乓球能停留在玻璃管的A端","B":"乒乓球向B端移动，当转动够快时乒乓球能停留在玻璃管的B端","C":"乒乓球向A端移动，当转动够快时乒乓球能停留在玻璃管的中点O处","D":"无论转动多快，乒乓球相对玻璃管停留在原处"},"answer":"C","explanation":"物体做圆周运动所需的向心力\u003cimg data-k=\"6b017f6975cd\"> ，其中\u003cimg data-k=\"f412308ad916\">是物体的质量，\u003cimg data-k=\"0d3c27d09683\">是物体运动的角速度，\u003cimg data-k=\"572ab59e28b8\">是运动的圆周轨道半径。\n玻璃管开始旋转时，水和乒乓球以相同的角速度做圆周运动，由于水质量大于乒乓球，故做圆周运动时所需要的向心力光凭管壁摩擦力不足以提供，故乒乓球附近的水会做离心运动，被“甩”到外侧管底，在管底支持力的作用下，进行圆周运动，与此同时，乒乓球在水的作用下向内侧运动，最终停留在O点。\n故正确答案为C。","no":98,"missingImage":false},{"type":"question","qid":"2453075","cat":"逻辑判断","stem":"如图所示是日本庭院常见的一种装置——添水。装置原理十分简单，竹筒中间设置支架，上面注水，如果水满竹筒就会倒出来。倒出来后竹筒空了又会抬起来。下列关于该装置表述不正确的是（  ）。\n\u003cimg data-k=\"b26414b37647\" style=\"max-width:574px\">","options":{"A":"装置的重心会旋转轴往复运动","B":"装置重心超过轴向右一段距离后进入倒水阶段","C":"装置做往复运动的周期和注水速度有关，注水越快，周期越短","D":"装置做往复运动的周期和竹筒容积有关，容积越大，周期越短"},"answer":"D","explanation":"刚开始注水时，水聚集在竹筒左侧的底部，因此重心靠左，随着竹筒内水量的变多，重心逐渐变高，并且向右移动，水满时，重心在轴右侧一定距离，竹筒将克服摩擦力缓慢做顺时针转动，将水倒出，此时，竹筒变空，重心回到轴左侧，竹筒逆时针抬起。\n注水速度越快，整个装置的重心变化越快，往复运动越快，周期越短；竹筒容积越大，注水时，水满所需要的水量就越多，往复运动越慢，周期越长。\n本题为选非题，故正确答案为D。","no":99,"missingImage":false},{"type":"question","qid":"2453095","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是：\n\u003cimg data-k=\"704f9ebc3ba6\" style=\"max-width:472px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相同，优先考虑位置规律。内部的小正方形从图一开始沿着外边框四个角，每次逆时针移动一步，因此图四应该移动到左下角位置，排除B项；继续观察，小正方形内部的小元素依次按照顺（逆）时针平移2格，所以图四中小黑点应在最右侧，符合的只有C项。\n故正确答案为C。","no":100,"missingImage":false},{"type":"question","qid":"2452980","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>        \u003c/u>。\n\u003cimg data-k=\"024decdc63e5\" style=\"max-width:528px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，出现多个独立小元素，优先考虑元素种类和数量规律。每幅图都是由正方形和圆两种元素组成，且每幅图正方形的数量比圆的数量多1个，只有C项符合。\n故正确答案为C。","no":101,"missingImage":false},{"type":"question","qid":"2453078","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是：\n\u003cimg data-k=\"22a9c0cf73b6\" style=\"max-width:669px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成相同，优先考虑位置规律。观察发现， 题干前一幅图的1变为下一幅图的4，2变为7，3变为5，4变为8，5变为6，6变为1，7变为3，8变为2。只有A项符合。\n\u003cimg data-k=\"6e88d94d46c5\" style=\"max-width:700px\">\n故正确答案为A。","no":102,"missingImage":false},{"type":"question","qid":"2452984","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>        \u003c/u>。\n\u003cimg data-k=\"32f3c42a58a5\" style=\"max-width:568px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相似，且相同线条重复出现，优先考虑样式规律中的加减同异。第一组图中，图1和图2求同得到图3；第二组图应用此规律，故？处应选择一个图1和图2求同得到的图形。只有C符合。\n故正确答案为C。","no":103,"missingImage":false},{"type":"question","qid":"2453032","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"efc793eff936\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成相同，优先考虑位置规律。每个图形都是由4个高低不一的长方形组成的，在图一中，从左到右依次给长方形编号为1、2、3、4，图一到图二1号长方形向右平移三步，图二到图三2号长方形向右平移三步，故图三到？处应该是3号长方形向右平移三步，只有A项符合。\n故正确答案为A。 \n\u003cimg data-k=\"881e2d1b3172\" style=\"max-width:484px\">","no":104,"missingImage":false},{"type":"question","qid":"2453033","cat":"图形推理","stem":"下图给定的平面图折叠后的立体图形是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"935a3b6df5d9\" style=\"max-width:433px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"将原展开图标上序号，如下图，逐一进行分析。\n\u003cimg data-k=\"5055c6050357\" style=\"max-width:246px\">\nA项：选项与题干一致，当选；\nB项：选项中的面k在展开图中没有出现，选项与题干不一致，排除；\n\u003cimg data-k=\"c2494215c6c1\" style=\"max-width:151px\">\nC项：选项中包括面e和面i，而面e和面i为相对面，不能同时出现，选项与题干不一致，排除；\nD项：选项中包括面f和面h，而面f和面h为相对面，不能同时出现，选项与题干不一致，排除。\n故正确答案为A。","no":105,"missingImage":false},{"type":"question","qid":"2453034","cat":"图形推理","stem":"左图是右图的平面展开图，数字与字母一一对应，与123456可以对应的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"bfb1fa330d47\" style=\"max-width:509px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查六面体。\nA项：题干展开图中的面5和面6是相对面，而面f和面e不是，排除。\nB项：题干展开图中的面1和面3是相对面，而面c和面e不是，排除。\nC项：题干展开图中的面1和面3是相对面，而面c和面f不是，排除。\nD项：题干展开图中六个面的相对位置关系和立体图形中六个面的相对位置一致，当选。\n故正确答案为D。","no":106,"missingImage":false},{"type":"question","qid":"2453080","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"659ca3c7d1a6\" style=\"max-width:551px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成相似，优先考虑样式规律。观察发现，第一组图形中，第一个图形经过顺时针旋转60°后，与第二个图形进行叠加运算可得第三个图形。根据此规律，第二组图形中，先将第一个图形顺时针旋转60°，再与第二个图形进行叠加，可得A项。\n故正确答案为A。","no":107,"missingImage":false},{"type":"question","qid":"2453036","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"d6af9f0b910d\" style=\"max-width:554px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相同，优先考虑位置规律。第一组图中，图2是由图1左右翻转得来的，图3是由图2上下翻转得来的。第二组图运用此规律，图2是由图1左右翻转得来的，所以？处图形应该是图2上下翻转得来的，只有B项符合此规律。\n故正确答案为B。","no":108,"missingImage":false},{"type":"question","qid":"2453082","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是：\n\u003cimg data-k=\"dff346ae84b6\" style=\"max-width:558px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"观察题干图形发现，元素组成相似。题干每幅图都由内圈、中间、外圈组成，颜色或图案包括黑色、白色、斜线、竖线、点状。\n观察可得，题干正方形内部填充依次是白-黑-斜线-竖线，所以“？”处图形内部为“点状”，排除B、C两项。比较A、D两项，不同之处在于外圈，继续观察外圈正方形的填充分别是斜线-竖线-点状-白色，所以“？”处图形外圈为“黑色”，只有D项符合。\n故正确答案为D。","no":109,"missingImage":false},{"type":"question","qid":"2453084","cat":"图形推理","stem":"下列选项中，与其他三个图形规律不同的是：\n\u003cimg data-k=\"3ac412a63467\" style=\"max-width:541px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"通过观察发现，题干图形均由黑块和白块组成，且色块分布均匀，优先考虑黑白块面积。A项、B项和C项中的黑块和白块面积相同，均占图形总面积的一半，而D项中白块的面积远大于黑块，故只有D项呈现的规律与其他三项不同。\n本题为选非题，故正确答案为D。","no":110,"missingImage":false},{"type":"question","qid":"2453086","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是：\n\u003cimg data-k=\"12ef7ebe6848\" style=\"max-width:497px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"九宫格优先横行看，第一行图1的内部线条替换成图2的斜线样式后可得到图3，且图3保留了图2该方向的斜线；第二行验证规律可得，图1的内部线条替换成图2的曲线样式后可得到图3，且图3保留了图2竖直方向的曲线，规律验证成立；因此第三行中，图1的内部线条替换成图2的虚线样式，并且要保留图2该方向的虚线，只有D符合。\n故正确答案选D。","no":111,"missingImage":false},{"type":"question","qid":"2453046","cat":"逻辑判断","stem":"所有真正关心老百姓利益的领导干部，都会受到大家的尊敬；而真正关心老百姓利益的领导干部都特别重视如何解决住房、看病、教育和养老等民生问题。因此，那些不重视如何解决老百姓民生问题的领导干部，都不会受到大家的尊敬。\n为保证上述论证成立，必须增加下列      项作为前提。","options":{"A":"随着老龄化社会的来临，老百姓面临的看病、养老等问题越来越突出","B":"所有重视如何解决老百姓民生问题的领导干部，都会受到大家的尊敬","C":"住房、看病、教育和养老等民生问题，是事关老百姓利益的最为突出的问题","D":"所有受到大家尊敬的领导干部，都是真正关心老百姓利益的领导干部"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：不重视民生问题的领导干部\u003cimg data-k=\"2dfb7d1f72f3\">不尊敬（根据逆否可以推出：尊敬\u003cimg data-k=\"2dfb7d1f72f3\">重视民生问题的领导干部）；\n论据：关心老百姓利益的领导干部\u003cimg data-k=\"2dfb7d1f72f3\">尊敬；关心老百姓利益的领导干部\u003cimg data-k=\"2dfb7d1f72f3\">重视民生问题。\n第二步：逐一分析选项。\nA项：论点说的是不重视如何解决老百姓民生问题的领导干部，都不会受到大家的尊敬，该项说的是看病、养老等问题越来越突出，话题不一致，无法加强，排除；\nB项：简单翻译为重视解决民生问题的领导干部\u003cimg data-k=\"2dfb7d1f72f3\">尊敬，将其补充到论据之上，无法得到论点，因此无法加强，排除；\nC项：论点说的是不重视如何解决老百姓民生问题的领导干部，都不会受到大家的尊敬，该项说的是民生问题是最为突出的话题，话题不一致，无法加强，排除；\nD项：简单翻译为：尊敬\u003cimg data-k=\"2dfb7d1f72f3\">关心老百姓利益的领导干部，将其补充到论据，可以得到：尊敬\u003cimg data-k=\"2dfb7d1f72f3\">关心老百姓利益的领导干部\u003cimg data-k=\"7b6029b3bbde\">重视民生问题，因此可以得到论点，可以加强，当选。\n故正确答案为D。","no":112,"missingImage":false},{"type":"question","qid":"2453056","cat":"逻辑判断","stem":"人因自然而生，人与自然是一种共生关系，对自然的伤害最终会伤及人类自身。因此，只有尊重自然规律，才能有效防止在开发利用自然上走弯路。\n根据以上陈述，可以得出下列       项。","options":{"A":"如果不尊重自然规律，就不能有效防止在开发利用自然上走弯路","B":"如果尊重自然规律，就能有效防止在开发利用自然上走弯路","C":"因为人与自然是一种共生关系，所以必须尊重自然规律","D":"人因自然而生，所以必须开发利用自然"},"answer":"A","explanation":"第一步：翻译题干。\n有效防止在开发利用自然上走弯路\u003cimg data-k=\"2dfb7d1f72f3\">尊重自然规律\n第二步：逐一分析选项。\nA项：翻译为\u003cimg data-k=\"e752a8ae1a16\">尊重自然规律\u003cimg data-k=\"a3a13b026980\">有效防止在开发利用自然上走弯路，是对题干的否后，否后必否前，当选；\nB项：翻译为尊重自然规律\u003cimg data-k=\"2dfb7d1f72f3\">有效防止在开发利用自然上走弯路，是对题干的肯后，但肯后得不到确定性的结论，无法推出，排除；\nC项：题干未提及人与自然共生关系与尊重自然规律的联系，无法推出，排除；\nD项：题干未提及人因自然而生和开发利用自然关系的联系，无法推出，排除。\n故正确答案为A。","no":113,"missingImage":false},{"type":"question","qid":"2453058","cat":"逻辑判断","stem":"在最后一次校级职称评定委员会的会议上，委员张教授认为这届委员会是近年来工作最没有影响力的一届。当列席会议的校长询问这一判断的理由时，张教授指出：大多数教师根本叫不出委员会成员的姓名。\n张教授的判断如果为真，必须假定下列      项。","options":{"A":"普通教师通常对职称评定委员会的工作不感兴趣","B":"只有职称评定委员会成员才有资格评价委员会工作是否具有影响力","C":"教师对职称评定委员会人员组成的熟悉程度是评价其工作是否具有影响力的一个重要指标","D":"在遴选职称评定委员会成员时，候选人往往是那些在教师中拥有较高知名度的教授"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：这届委员会是近年来工作最没有影响力的一届。\n论据：大多数教师根本叫不出委员会成员的姓名。\n论点讨论的是这届委员会的影响力，论据讨论的是能否叫出委员会成员姓名。论点论据话题不一致，结合问法，优先考虑搭桥。\n第二步：逐一分析选项。\nA项：该项讨论的是教师对职称评定委员会工作不感兴趣，与论点这届委员会的影响力无关，话题不一致，无法加强，排除；\nB项：该项讨论的是谁有资格评价委员会工作是否具有影响力，与论点这届委员会的影响力无关，话题不一致，无法加强，排除；\nC项：教师对职称评定委员会人员组成的熟悉程度，即是否能叫出委员会成员姓名，其是评价委员会工作是否具有影响力的一个重要指标，选项建立了论点与论据的联系，为搭桥项，可以加强，当选；\nD项：该项讨论的是遴选职称评定委员会成员的条件，与论点这届委员会的影响力无关，话题不一致，无法加强，排除。\n故正确答案为C。","no":114,"missingImage":false},{"type":"question","qid":"2453044","cat":"逻辑判断","stem":"亚马逊热带雨林火灾次数与过火面积每年以惊人的比例增加。但是，卫星照片显示，去年火灾次数与过火面积的增加比例明显低于往年。去年，某国政府支出数百万美元用于预防和扑灭亚马逊热带雨林火灾。该国政府宣称，上述卫星数据表明政府预防和扑灭火灾的努力取得了显著效果。\n下列      项如果为真，最能削弱该国政府的上述结论。","options":{"A":"去年该国用以预防和扑灭亚马逊热带雨林火灾的投入明显低于往年","B":"该国去年出现了异乎寻常的大面积持续降雨","C":"与该国毗邻的其他国家的热带雨林火灾次数与过火面积并未减少","D":"该国用于热带雨林火灾预防与扑灭的费用只占年度财政支出的很小比例"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：政府预防和扑灭火灾的努力取得了显著效果。\n论据：去年火灾次数与过火面积的增加比例明显低于往年。去年，某国政府支出数百万美元用于预防和扑灭亚马逊热带雨林火灾。\n论点和论据都在讨论政府预防和扑灭火灾的关系，因此论点论据话题一致，考虑否定论点。\n第二步：逐一分析选项。\nA项：论点说的是预防和扑灭火灾的努力取得了显著效果，该项说的是去年的投入明显低于往年，投入的高低和是否有效果不是同一话题，话题不一致，无法削弱，排除；\nB项：论点说的是政府扑灭火灾的努力取得了效果，该项说的是去年出现了大面积持续降雨，说明亚马逊雨林火灾次数减少的原因是大面积持续降雨，说了亚马逊雨林火灾次数减少的另外一个原因，属于另有他因，可以削弱，当选；\nC项：论点说的是亚马逊雨林的火灾，该项说的其他国家的雨林，主体不一致，无法削弱，排除；\nD项：论点说的是政府扑灭火灾取得了显著效果，该项说的是投入费用的比例，话题不一致，无法削弱，排除。\n故正确答案为B。","no":115,"missingImage":false},{"type":"question","qid":"2453040","cat":"逻辑判断","stem":"一些科学家认为，在6500万年前，一颗小行星击中了现在的尤卡坦半岛，因此导致了恐龙的灭绝。这些科学家认为：如此一击抛掷了大量的碎片到大气中，从而阻挡了阳光、冷却了空气。对于食草恐龙来说，如果没有充足的阳光和食物资源，那么它们将会灭亡，并且没有恐龙能够长期在低温中生存。然而，这批科学家同时确信：小行星产生的大多数碎片会在六个月内到达地面，以至于无法让植物消失和让恐龙冻僵。\n下列      项如果为真，能为解决上述科学家们的信念和事实之间的明显差异提供支持。","options":{"A":"食草恐龙的灭绝使食肉恐龙失去了食物来源","B":"恐龙很容易受到由小行星碎片所引发的空气污染的影响，以致于产生致命的呼吸问题","C":"碎片聚合成的粉尘能够减少约\u003cimg data-k=\"798f1f286d1f\">的阳光，从而使地表温度降低7到10摄氏度","D":"那颗小行星的直径至少为9.6公里，对于通过撞击和由其引起的海啸来杀死恐龙已经足够大了"},"answer":"B","explanation":"第一步：找出题干矛盾。\n提问方式为：解决科学家们的信念和事实之间的明显差异，即解释科学家的信念和事实之间的矛盾。\n科学家认为的即为科学家的信念，信念为：小行星击中了现在的尤卡坦半岛，因此导致了恐龙的灭绝。如此一击抛掷了大量的碎片到大气中，从而阻挡了阳光、冷却了空气。对于食草恐龙来说，如果没有充足的阳光和食物资源，那么它们将会灭亡，并且没有恐龙能够长期在低温中生存。\n科学家确信的即为事实，事实为：小行星产生的大多数碎片会在六个月内到达地面，以至于无法让植物消失和让恐龙冻僵。\n简单总结：我们需要解释为什么“小行星碎片影响的阳光和食物问题没有让恐龙灭绝，但科学家依然认为是小行星碎片让恐龙灭绝的。”\n第二步：逐一分析选项。\nA项：该项说食草恐龙的灭绝使食肉恐龙失去食物，但事实是小行星的大多数碎片会在六个月内到达地面，以至于无法让植物消失，所以食草恐龙还是有植物可食用，无法解释信念和事实之间的差异，不能解释题干矛盾，排除；\nB项：该项说明恐龙的灭绝是因为小行星产生的碎片引发的空气污染问题，解释了在阳光和食物问题没有让恐龙灭绝后（即事实），小行星产生的碎片是怎样导致恐龙灭绝的（即信念），解释了信念和事实之间的差异，可以解释题干矛盾，保留；\nC项：该项说粉尘对地表温度的影响，但不明确地表温度降低7到10摄氏度之后是否对恐龙的生存产生灭绝影响，不能解释题干矛盾，排除；\nD项：该项说明恐龙的灭绝是因为撞击和海啸，解释了在阳光和食物问题没有让恐龙灭绝后（即事实），小行星是怎样导致恐龙灭绝的（即信念），解释了信念和事实之间的差异，可以解释题干矛盾，保留；\n对比B、D两项，B项解释了“小行星产生的碎片是怎样导致恐龙灭绝”，D项解释了“小行星是怎样导致恐龙灭绝”，题干中的信念既提到了“小行星导致恐龙灭绝”，也大篇幅分析了“小行星产生的碎片导致恐龙灭绝”，题干中的事实只提到了“小行星产生的碎片”的相关信息。故信念和事实差异的重点应是“小行星产生的碎片”到底是如何导致恐龙灭绝，而并非“小行星”是如何导致恐龙灭绝；另外，D项的海啸是局部的，B项的空气污染明显范围更大，更可能导致恐龙灭绝，因此B项解释力度更强。\n故正确答案为B。","no":116,"missingImage":false},{"type":"question","qid":"2453045","cat":"逻辑判断","stem":"在某旅行社的股东会上，总经理提出：根据目前公司整体规划，我提议欧洲线和北美线两条线路至少要开通一条，但南美线因航线问题不能马上开通。董事长表示反对。\n下列      项最能准确表达董事长的意思。","options":{"A":"欧洲线、北美线和南美线三条线路都开通","B":"欧洲线、北美线和南美线三条线路都不开通","C":"欧洲线和北美线两条线路至多开通一条，但南美线要马上开通","D":"如果南美线不能马上开通，那么欧洲线和北美线两条线路都不能开通"},"answer":"D","explanation":"第一步：翻译题干。\n①（欧洲线或北美线）且\u003cimg data-k=\"e752a8ae1a16\">南美线\n董事长表示反对，则董事长意思为题干翻译的否命题，则题干可以表示为\n②\u003cimg data-k=\"e752a8ae1a16\">（欧洲线或北美线）或南美线\n第二步：逐一分析选项。\nA项：翻译为：欧洲线且北美线且南美线，无法推出，排除；\nB项：翻译为：\u003cimg data-k=\"e752a8ae1a16\">欧洲线且\u003cimg data-k=\"e752a8ae1a16\">北美线且\u003cimg data-k=\"e752a8ae1a16\">南美线，无法推出，排除；\nC项：翻译为：（\u003cimg data-k=\"e752a8ae1a16\">欧洲线或\u003cimg data-k=\"e752a8ae1a16\">北美线）且南美线，无法推出，排除；\nD项：翻译为：\u003cimg data-k=\"e752a8ae1a16\">南美线\u003cimg data-k=\"a3a13b026980\">欧洲线且\u003cimg data-k=\"e752a8ae1a16\">北美线，为②的否一推一，可以推出，当选。\n故正确答案为D。","no":117,"missingImage":false},{"type":"question","qid":"2453042","cat":"逻辑判断","stem":"中国国庆盛大阅兵过程中，各军兵种方队整齐划一、步调一致，完美展现了中国军人的刚毅与坚强，举世瞩目。这是军人们历经数月艰苦训练的结果。已知，某训练小组共有40余名队员，平均身高1.82米，平均年龄24岁。最终，所有年龄23岁以上且身高超过1.83米的队员都参与了正式阅兵。\n根据以上信息，关于该训练小组，可以得出下列      项。","options":{"A":"没有23岁以下的队员参加正式阅兵","B":"参加正式阅兵的队员中，23岁以上的队员占多数","C":"所有身高超过1.83米但年龄23岁以下的队员都没有参加正式阅兵","D":"未参加正式阅兵者中不包括年龄23岁以上且身高超过1.83米的队员"},"answer":"D","explanation":"第一步：翻译题干。\n23岁以上且身高超过1.83米\u003cimg data-k=\"7b6029b3bbde\">参与正式阅兵\n第二步：逐一分析选项。\nA项：没有23岁以下的队员参加正式阅兵说明所有23岁以下的队员都没有参加阅兵，23岁以下属于对题干翻译的否前，否前不确定，无法推出，排除；\nB项：根据题干翻译只知道23岁以上且身高超过1.83的队员都参加了阅兵，但这些人在所有人中的比例未知，无法推出，排除；\nC项：翻译为：身高超过1.83米且23岁以下\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">参加阅兵，23岁以下是对题干翻译的否前，否前不确定，无法推出，排除； \nD项：翻译为：23岁以上且身高超过1.83米\u003cimg data-k=\"7b6029b3bbde\">参加正式阅兵，可以推出，当选。\n故正确答案为D。","no":118,"missingImage":false},{"type":"question","qid":"2453060","cat":"逻辑判断","stem":"某大学哲学系三年级本科生参加了一次国家英语六级考试。关于考试成绩，四位同学做出了如下猜测：\n甲：所有同学都及格了。\n乙：小张没有及格。\n丙：肯定不会全部同学都及格。\n丁：也不会所有同学都不及格。\n如果只有一位同学猜错了，则下列                    项为真。","options":{"A":"甲猜错了，小张及格了","B":"甲猜错了，小张没有及格","C":"乙猜错了，小张及格了","D":"丙猜错了，小张及格了"},"answer":"B","explanation":"本题属于真假推理题。\n第一步：找出题干矛盾关系。\n甲说“所有同学都及格”和丙说“肯定不会全部同学都及格”（即有的同学不会及格）是矛盾关系，必有一真必有一假。\n第二步：看其余。\n已知只有一句是假话，则乙和丁说的是真话，即小张没有及格，也不会所有同学都不及格（即有的同学会及格），因此甲说的是假话，丙说的是真话。\n故正确答案为B。","no":119,"missingImage":false},{"type":"question","qid":"2453064","cat":"类比推理","stem":"花园有东西两个区，已知：\n（1）玫瑰都种植在东区；\n（2）西区是牡丹园，种植的是各色牡丹；\n（3）花园中的牡丹有许多名贵品种，但是没有黑色的；\n（4）珍稀品种都是玫瑰。\n根据以上陈述，关于该花园中的花卉，下列                    项必然为假。","options":{"A":"西区牡丹中有珍稀品种","B":"玫瑰没有名贵品种","C":"东区有许多名贵品种","D":"玫瑰有许多珍稀品种"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）玫瑰\u003cimg data-k=\"7b6029b3bbde\">种植在东区；\n（2）西区（牡丹园）\u003cimg data-k=\"7b6029b3bbde\">种植各色牡丹；\n（3）牡丹有许多名贵品种，没有黑色牡丹；\n（4）珍稀品种\u003cimg data-k=\"7b6029b3bbde\">玫瑰。\n第二步：根据题干条件进行推理。\nA项：根据条件（2）、（4）可知，西区（牡丹园）\u003cimg data-k=\"7b6029b3bbde\">牡丹，对条件（4）逆否，\u003cimg data-k=\"e752a8ae1a16\">玫瑰\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">珍稀品种，将二者串联，西区（牡丹园）\u003cimg data-k=\"7b6029b3bbde\">牡丹\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">珍稀品种，因此，西区牡丹中有珍稀品种必然为假，即A项一定为假，当选；\nB项：根据条件（3）可知，牡丹有许多名贵品种，但是玫瑰是否有名贵品种，题干没有提及，因此可能为真，不是必然为假，排除B项；\nC项：根据条件（3）可知，牡丹有许多名贵品种，但是东区是否有名贵品种，题干没有提及，因此可能为真，不是必然为假，排除C项；\nD项：根据条件（4）可知，珍稀品种\u003cimg data-k=\"7b6029b3bbde\">玫瑰，有许多玫瑰是珍稀品种，是对箭头后的肯后，肯后不确定，但是可能为真，不是必然为假，排除D项。\n故正确答案为A。","no":120,"missingImage":false},{"type":"question","qid":"2453049","cat":"类比推理","stem":"一家人准备一起去北欧旅游，各自表达如下愿望：\n父亲：若去挪威，则不去丹麦和冰岛；\n母亲：若不去冰岛，则去挪威和丹麦；\n儿子：若不去挪威，则去瑞典和芬兰。\n最终的方案满足了上述每个人的愿望。根据以上陈述，可以得出下列      项。","options":{"A":"去瑞典、芬兰和丹麦","B":"去瑞典、芬兰和冰岛","C":"去瑞典、丹麦和冰岛","D":"去芬兰、丹麦和冰岛"},"answer":"B","explanation":"已知：\n（1）挪威\u003cimg data-k=\"a3a13b026980\">丹麦且\u003cimg data-k=\"e752a8ae1a16\">冰岛\n（2）\u003cimg data-k=\"e752a8ae1a16\">冰岛\u003cimg data-k=\"2dfb7d1f72f3\">挪威且丹麦\n（3）\u003cimg data-k=\"e752a8ae1a16\">挪威\u003cimg data-k=\"2dfb7d1f72f3\">瑞典且芬兰\n因题干都为推出关系，无确定信息，故采用代入法。\nA项：代入瑞典、芬兰和丹麦，去丹麦是对条件1的否后，得到否前：不去挪威，这是对条件2的否后，得到否前：去冰岛。但是A项中并没有去冰岛，这与题干矛盾，因此无法推出，排除；\nB项：代入瑞典、芬兰和冰岛，去冰岛对条件1进行了否后，得到否前：不去挪威，同时不去挪威又能根据条件3得到瑞典且芬兰，因为代入后符合条件，当选；\nC项：代入瑞典、丹麦和冰岛，同B项，只能根据去冰岛得出去了瑞典和芬兰，无法得出是否去丹麦，排除；\nD项：代入芬兰、丹麦和冰岛，同B项，只能根据去冰岛得出去了瑞典和芬兰，无法得出是否去丹麦，排除。\n故正确答案为B。","no":121,"missingImage":false},{"type":"question","qid":"2453067","cat":"类比推理","stem":"在干部选拔中，甲、乙、丙、丁4人脱颖而出。进一步考察，4人中2人拟任正科级，2人拟任副科级。已知：\n（1）若甲或乙之一任正科级，则丁任正科级；\n（2）若甲或乙之一任副科级，则丙任副科级；\n（3）如果丁任正科级，则丙也任正科级。\n根据以上信息，则下列                    项可能为真。","options":{"A":"甲乙均任正科级","B":"乙丙均任正科级","C":"甲丙均任正科级","D":"乙丁均任正科级"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）要么甲正科，要么乙正科\u003cimg data-k=\"a37757d411ef\">丁正科；\n（2）要么甲副科，要么乙副科\u003cimg data-k=\"a37757d411ef\">丙副科；\n（3）丁正科\u003cimg data-k=\"a37757d411ef\">丙正科；\n（4）甲、乙、丙、丁4人中2人正科，2人副科；\n将（1）（3）进行串联得到：（5）要么甲正科，要么乙正科\u003cimg data-k=\"a37757d411ef\">丁正科\u003cimg data-k=\"a37757d411ef\">丙正科。\n第二步：根据题干条件进行推理。\n提问方式为“可能”，优先考虑代入法。\n代入A项：若甲、乙均为正科，根据条件（4）可知，丙、丁均为副科，“丙副科”是对条件（2）的肯后，且“甲、乙均为正科”是对条件（5）的否前，均可能成立，满足题干所有条件，可能为真，当选； \n代入B项：若乙、丙均为正科，根据条件（4）可知，甲、丁均为副科，但“甲副科、乙正科”是对条件（5）的肯前，肯前必肯后，可知丁、丙均为正科，此时正科为3人，前后结论矛盾，不可能为真，排除；\n代入C项：若甲、丙均为正科，根据条件（4）可知，乙、丁均为副科，但“甲正科、乙副科”是对条件（5）的肯前，肯前必肯后，可知丁、丙均为正科，此时正科为3人，前后结论矛盾，不可能为真，排除；\n代入D项：若乙、丁均为正科，根据条件（4）可知，甲、丙均为副科，但“甲副科、乙正科”是对条件（5）的肯前，肯前必肯后，可知丁、丙均为正科，此时正科为3人，前后结论矛盾，不可能为真，排除。\n故正确答案为A。","no":122,"missingImage":false},{"type":"question","qid":"2453050","cat":"类比推理","stem":"某三甲医院的医生中，专科医院毕业的医生人数大于非专科医院毕业的医生人数，女医生的人数大于男医生的人数。\n如果上述论述是真的，那么      项关于该医院医生的断定也一定是真的。\n（1）非专科医院毕业的女医生人数大于专科医院毕业的男医生人数。\n（2）专科医院毕业的男医生人数大于非专科医院毕业的男医生人数。\n（3）专科医院毕业的女医生人数大于非专科医院毕业的男医生人数。","options":{"A":"（1）和（2）","B":"只有（2）","C":"只有（3）","D":"（2）和（3）"},"answer":"C","explanation":"已知：\n①专科医学院毕业人数\u003cimg data-k=\"f29c047cf8c7\">非专科医学院毕业人数\n②女医生人数\u003cimg data-k=\"f29c047cf8c7\">男医生人数\n（1）非专科女医生人数\u003cimg data-k=\"f29c047cf8c7\">专科男医生人数，根据题干条件，无从得出二者之间的关系，排除；\n（2）专科医学院毕业的男医生人数\u003cimg data-k=\"f29c047cf8c7\"> 非专科医学院毕业的男医生人数，根据题干条件，无法得知男医生中专科与非专科的比例关系，无法推出，排除；\n（3）①专科医院毕业医生人数\u003cimg data-k=\"0e07cb2326e8\">非专科医院毕业医生人数，即专科（男+女）\u003cimg data-k=\"0e07cb2326e8\">非专科（男+女）；②女医生人数\u003cimg data-k=\"0e07cb2326e8\">男医生人数，即女（非专科+专科）\u003cimg data-k=\"0e07cb2326e8\">男（非专科 +专科）。将①和②相加，整理可得：专科医院毕业的女医生人数\u003cimg data-k=\"0e07cb2326e8\">非专科医院毕业的男医生人数，可以推出。\n故正确答案为C。","no":123,"missingImage":false}],"co
