answer":"D","explanation":"设上坡路段儿子的速度为x，则父亲的速度为1.2x；设下坡路段儿子的速度为y，则父亲的速度为0.8y；赋值上、下坡路段的距离分别为1、2。根据“父子同时到达终点”，可列式：\u003cimg data-k=\"b17b17f171d9\">，化简可得：y=3x，则父亲上、下坡路段的速度之比为\u003cimg data-k=\"fe9976cafa48\">\u003cimg data-k=\"e890c79c6e79\">。\n故正确答案为D。","no":53,"missingImage":false},{"type":"question","qid":"13319477","cat":"数学运算","stem":"某农场使用M、N两架无人机喷洒农药，先由M无人机工作2小时，再由N无人机工作5小时，可喷洒完整片农田；两架无人机同时工作1小时后，有三分之二的农田尚未喷洒。如果仅由M无人机喷洒农药，那么喷洒完整片农田需要（    ）。","options":{"A":"3.5小时","B":"4.5小时","C":"5小时","D":"5.5小时"},"answer":"B","explanation":"用M、N分别表示两架无人机的工作效率，根据题意可得：\u003cimg data-k=\"192628841b2e\">，化简得M：N=2：1。赋值M无人机的工作效率为2，N无人机的工作效率为1，则喷洒整片农田的工作量为2×2+5×1=9，仅由M无人机喷洒农药，那么喷洒完整片农田需要9÷2=4.5小时。\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"13319475","cat":"数学运算","stem":"某市正在深入推进“智改数转网联”升级行动计划，力争实现全市规模以上企业全覆盖。目前，全市规模以上企业2080家，其中未完成升级的规模以上企业比已完成升级的多0.6倍，那么已完成升级的规模以上企业有（    ）。","options":{"A":"780家","B":"800家","C":"1280家","D":"1300家"},"answer":"B","explanation":"设已完成升级的规模以上企业有x家，则未完成升级的规模以上企业有（1+0.6）x=1.6x家。根据题意可得：x+1.6x=2080，解得x=800。\n故正确答案为B。","no":55,"missingImage":false},{"type":"question","qid":"13319478","cat":"数学运算","stem":"甲、乙两瓶质量和浓度均相同的酒精溶液，在甲瓶中加入20克水、乙瓶中加入50克浓度为30%的酒精溶液后，浓度仍然相等。若继续在甲瓶中加入30克纯酒精，溶液又恢复到最初浓度，则乙瓶酒精溶液最初的质量是（    ）。","options":{"A":"100克","B":"110克","C":"120克","D":"150克"},"answer":"A","explanation":"设甲、乙两瓶酒精溶液最初的质量均为m克，浓度均为n。根据题意可知：在甲瓶中加入20克水后，继续在甲瓶中加入30克纯酒精，溶液又恢复到最初浓度。结合公式：浓度\u003cimg data-k=\"5d71429fa4e4\">，可列式：\u003cimg data-k=\"de3a7f26c11d\">，解得n=60%；根据“在甲瓶中加入20克水、乙瓶中加入50克浓度为30%的酒精溶液后，浓度仍然相等”，可列式：\u003cimg data-k=\"44635c24b95f\">。\n方法一：根据公式：\u003cimg data-k=\"bc26665aaeb9\">，可将方程化简为：\u003cimg data-k=\"5d2d166e4401\">，解得m=100。\n方法二：方程正面求解比较复杂，可将选项代入验证，代入A项：\u003cimg data-k=\"57183f436a26\">，等式成立，符合题意，当选。\n故正确答案为A。","no":56,"missingImage":false},{"type":"question","qid":"13319480","cat":"数学运算","stem":"一场演出的节目有舞蹈《水韵江苏》、歌曲《让世界充满爱》和《绣红旗》、小品《幸福一家人》、魔术《奇幻之旅》、杂技《力量》。若要求两首歌曲分别作为开头曲和结尾曲，舞蹈与杂技相邻演出，小品和魔术不能相邻演出，则节目演出的排列顺序有（    ）。","options":{"A":"8种","B":"12种","C":"18种","D":"24种"},"answer":"A","explanation":"根据题意，要求两首歌曲分别作为开头曲和结尾曲，有\u003cimg data-k=\"79ffa592ef20\">种情况；要求舞蹈与杂技相邻演出，故可先将舞蹈和杂技捆绑起来，由于演出有先后顺序，有\u003cimg data-k=\"79ffa592ef20\">种情况；要求小品和魔术不能相邻演出，可用插空法，先将舞蹈和杂技作为整体安排到两首歌曲中间，再将小品和魔术插入中间的2个空中，有\u003cimg data-k=\"79ffa592ef20\">种情况。分步用乘法，则共有2×2×2=8种节目演出的排列顺序。\n故正确答案为A。","no":57,"missingImage":false},{"type":"question","qid":"13319486","cat":"数学运算","stem":"某地考古出土了一种呈长方体的青铜器，测得其长、宽、高分别为60cm、40cm、60cm。为了防止氧化，有关部门为其做个半球形的保护罩，则该保护罩（厚度忽略不计）的表面积至少为（    ）。","options":{"A":"\u003cimg data-k=\"a4cf90a95079\">","B":"\u003cimg data-k=\"b31f9b400180\">","C":"\u003cimg data-k=\"5d15eb0a0b47\">","D":"\u003cimg data-k=\"65423e1d8cc9\">"},"answer":"C","explanation":"\u003cimg data-k=\"2609a8740d58\" style=\"max-width:400px\">\n如图所示，使半球形保护罩既能罩住长方体又表面积最小，则长方体顶点A、B、C、D均与球面相切，O为底面中点，连接OA即为球体的半径。连接\u003cimg data-k=\"b5331f7b55fd\">，则\u003cimg data-k=\"b5331f7b55fd\">是长方形\u003cimg data-k=\"5f45cfdc1236\">对角线\u003cimg data-k=\"a9d33043d31d\">的一半，且\u003cimg data-k=\"290b49b776c2\">\u003cimg data-k=\"cdaa67c26678\">，\u003cimg data-k=\"11cdb9728e11\">\u003cimg data-k=\"c856c627f51c\">，则根据勾股定理，\u003cimg data-k=\"a9d33043d31d\">\u003cimg data-k=\"5f20b3551fb7\">\u003cimg data-k=\"1261ff44e905\">，\u003cimg data-k=\"0ab0327b5c30\">。因为三角形\u003cimg data-k=\"c2442091976b\">为直角三角形，且\u003cimg data-k=\"a04c9db48cee\">，则根据勾股定理，\u003cimg data-k=\"0196140294f9\">\u003cimg data-k=\"e486f69a8dba\">。根据公式：球体表面积\u003cimg data-k=\"7261378cb505\">\u003cimg data-k=\"1c6f49afa859\">，可得该保护罩的表面积为\u003cimg data-k=\"bec4a109d88b\">。\n故正确答案为C。\n备注： ①本题所求保护罩的表面积不包含底面。因为通常所说的“罩子”是没有底面的，即使罩子有底面，往往底面材质和罩子材质也不一样，会更厚一些，和题目中厚度忽略不计矛盾，故本题答案不能为A。\n②由于本题的长方体是文物，因此不能随意调整摆放的情况，即不能以40cm为高算最值，故本题答案不能为D。","no":58,"missingImage":false},{"type":"question","qid":"13319481","cat":"数学运算","stem":"某场国际跳水比赛设有7名裁判，分别给运动员每一跳打分，所打分数均为0.5的整数倍，且最低为0分，最高为10分。运动员每一跳得分的具体计算规则为：去掉两个最高分和两个最低分，剩下的3个分数之和乘以难度系数即为这一跳的得分。若某运动员第一跳的难度系数为3.0，得分为66分，则7名裁判给这名运动员第一跳打分的平均数最多为（    ）。","options":{"A":"7.5分","B":"7.8分","C":"8.0分","D":"8.2分"},"answer":"C","explanation":"根据题意：中间三个分数之和×3=66，可知中间三个分数之和为22。要使7名裁判打分的平均数最多，则需让其他4名裁判打的分数尽量多。第一、第二高的两个分数最高可取10分，第六、第七高的分数最多可与第五高的分数相同，故应让第五高的分数尽量高。设第五高的分数为x，因为中间三个分数（第三、第四、第五）总和为定值22，若想第五高的分数x尽量高，则第三、第四高的分数应尽量低，列表构造如下：\n\u003cimg data-k=\"e9f948fc74bf\" style=\"max-width:530px\">\n则有3x=22，解得\u003cimg data-k=\"b07d8a56fca3\">，因为裁判所打分数均为0.5的整数倍，故第五高的分数最高取7分。第六、第七高的分数最多也均可取7分。此时具体分数如下：\n\u003cimg data-k=\"0bb7e94123ce\" style=\"max-width:530px\">\n或者\n\u003cimg data-k=\"fca7d8c43df1\" style=\"max-width:530px\">\n此时7名裁判给这名运动员第一跳打分的平均数最多为\u003cimg data-k=\"8f40ad3bf4b4\">分。\n故正确答案为C。","no":59,"missingImage":false},{"type":"question","qid":"13319482","cat":"数学运算","stem":"用若干玫瑰花制作玫瑰花束，若每束8枝余3枝，9枝余5枝，如果将这些玫瑰花全部用完，制成数量各不相同的3束玫瑰花，那么数量最多的那一束至少有玫瑰花（    ）。","options":{"A":"18枝","B":"20枝","C":"21枝","D":"23枝"},"answer":"C","explanation":"设每束8枝有a束，每束9枝有b束，根据玫瑰花总枝数相同可列式：8a+3=9b+5，整理可得：8a=9b+2。根据奇偶特性可知，8a和2均为偶数，则9b为偶数，即b为偶数。根据要求数量最多的一束玫瑰花最少，那么玫瑰花总枝数要最少，即b取值要尽量小，分情况讨论：\n若b=2，则a=2.5，不是整数，不符合题意；\n若b=4，则a=4.75，不是整数，不符合题意；\n若b=6，则a=7，符合题意，则此时玫瑰花总枝数最少为8×7+3=59枝。要使数量最多的一束玫瑰花枝数最少，则另外两束玫瑰花枝数要尽可能多，设数量最多的一束玫瑰花最少有x枝，又因3束玫瑰花枝数各不相同，可得玫瑰花枝数如下：\n\u003cimg data-k=\"3b40d93cdcc4\" style=\"max-width:600px\">\n根据玫瑰花总共有59枝，可列式：x+x-1+x-2=59，解得\u003cimg data-k=\"b060c46bdda4\">，问最少，向上取整21枝。\n故正确答案为C。","no":60,"missingImage":false},{"type":"question","qid":"13319483","cat":"数学运算","stem":"某5A级景区门票90元/人，教师免票、大学生半票，乘坐索道另付70元/人。某校教师和大学生共110人到该景区研学，若支付的门票和索道费共11750元，则参与研学的教师有（    ）。","options":{"A":"6人","B":"10人或20人","C":"10人","D":"6人或20人"},"answer":"D","explanation":"设参与研学的教师有x人，则参与研学的大学生有（110-x）人；设乘坐索道的有y人，则未乘坐索道的有（110-y）人。根据题意，大学生半票后为\u003cimg data-k=\"1dafe488ac40\">元/人，则门票费共\u003cimg data-k=\"e66f516f2e05\">元；索道费共70y元。根据“若支付的门票和索道费共11750元”，可列方程45×（110-x）+70y=11750，整理得14y-9x=1360。优先考虑代入选项进行验证，代入x=6，解得y=101，符合题意；代入x=10，解得\u003cimg data-k=\"7085d12e2ef7\">，为非整数，不符合题意，排除；代入x=20，解得y=110，符合题意。综上，参与研学的教师有6人或20人。\n故正确答案为D。\n备注：此题表述不太严谨，可以选择乘坐索道也可以选择不乘坐索道，若更改表述为“若乘坐索道另付70元/人”，会更加严谨。","no":61,"missingImage":false},{"type":"question","qid":"13319490","cat":"数学运算","stem":"小张打羽毛球膝盖受伤，需每隔4天去医院做一次理疗，如果他7月2日去，则7月的理疗有1次在星期六、1次在星期日，其余都在工作日；如果他7月3日去，则7月的理疗只有1次在星期日，其余都在工作日，那么7月31日是（    ）。","options":{"A":"星期四","B":"星期三","C":"星期二","D":"星期一"},"answer":"A","explanation":"小张每隔4天去医院做一次理疗，即每5天做一次理疗。如果7月2日去做理疗，则7月做理疗的日期分别为2日、7日、12日、17日、22日、27日；如果7月3日去做理疗，则7月做理疗的日期分别为3日、8日、13日、18日、23日、28日，代入选项：\nA项：7月31日是星期四，则7月日历如下表所示：\n\u003cimg data-k=\"dba2f77dd70e\" style=\"max-width:592px\">\n即7月2日为星期三，7日为星期一，12日为星期六，17日为星期四，22日为星期二，27日为星期日，满足“如果他7月2日去，则7月的理疗有1次在星期六、1次在星期日，其余都在工作日”的条件；7月3日为星期四，8日为星期二，13日为星期日，18日为星期五，23日为星期三，28日为星期一，满足“如果他7月3日去，则7月的理疗只有1次在星期日，其余都在工作日”的条件。满足所有条件，当选。其他选项无需验证。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"13319485","cat":"数学运算","stem":"某科技园区计划铺设电缆联通A、B、C、D、E、F六栋办公楼，可以铺设电缆的线路如下图所示，每条边上的数字表示两栋楼之间线路的长度（单位：10米），则铺设电缆的总长度最短是（    ）。\n\u003cimg data-k=\"a9383080d486\" style=\"max-width:278px\">","options":{"A":"280米","B":"290米","C":"310米","D":"350米"},"answer":"B","explanation":"若要铺设电缆总长度最短，则铺设的线路应尽量少且每条线路的长度应尽量短。六栋办公楼，最少需要5条线路即可联通。最短路径优先，选择AB、AC、CF、BE、AD，此时六栋楼均被连通且铺设电缆的总长度最短，故所求为（4+5+6+7+7）×10=290米。\n故正确答案为B。","no":63,"missingImage":false}],"count":19,"answerable":19,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>在环太湖自行车比赛中，冲刺阶段排在前四位的是甲、乙、丙、丁四名选手（如图，圆圈表示选手），他们来自江苏、上海、浙江和安徽，所骑自行车颜色是蓝色、灰色、白色和黄色。已知：\u003c/p>\u003cp>（1）江苏选手在选手丙的东南面；\u003c/p>\u003cp>（2）上海选手在赛道的东部位置，他所骑自行车是蓝色的；\u003c/p>\u003cp>（3）骑灰色自行车的选手不是排在第四位；\u003c/p>\u003cp>（4）选手丁排在第三位，选手乙来自浙江；\u003c/p>\u003cp>（5）安徽选手排在骑黄色自行车的选手之前，排在选手甲之后。\u003c/p>\u003cp>\u003cimg data-k=\"38117aa9e73e\" style=\"max-width:300px\">\u003c/p>","questions":[{"qid":"11367790","cat":"逻辑判断","stem":"根据上述信息，可以推出以下哪项？","options":{"A":"甲来自江苏，排第二位","B":"乙来自浙江，排第四位","C":"丙来自安徽，排第一位","D":"丁来自上海，排第三位"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）江苏选手在选手丙的东南面；\n（2）上海选手在赛道的东部位置，他所骑自行车是蓝色的；\n（3）骑灰色自行车的选手不是排在第四位；\n（4）选手丁排在第三位，选手乙来自浙江；\n（5）安徽选手排在骑黄色自行车的选手之前，排在选手甲之后。\n第二步：根据题干条件进行推理。\n根据条件（1）江苏选手在丙的东南面，可以推出丙是第2名，江苏选手是第3名；\n根据条件（2）上海选手在赛道东部以及江苏选手是第3名，可以推出上海选手是第1名，且自行车是蓝色的；\n根据条件（3）以及第1名自行车是蓝色的，可以推出灰色自行车的选手不是第2名，就是第3名；\n根据条件（4）以及江苏选手是第3名，可以推出丁是江苏选手；\n根据条件（5）、上海选手是第1名以及江苏选手是第3名，可以推出安徽选手是第2名，甲是第1名，具体如下表所示。\n\u003cimg data-k=\"3d92ee12acb8\" style=\"max-width:522px\">\n综合上述结论，可以推出第4名是乙，来自浙江，B项当选。\n故正确答案为B。","no":64,"missingImage":false},{"qid":"11367792","cat":"逻辑判断","stem":"如果丙所骑自行车是白色，则可以推出以下哪项？","options":{"A":"选手甲所骑自行车不是蓝色的","B":"选手乙所骑自行车是灰色的","C":"安徽选手所骑自行车是黄色的","D":"江苏选手所骑自行车是灰色的"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）江苏选手在选手丙的东南面；\n（2）上海选手在赛道的东部位置，他所骑自行车是蓝色的；\n（3）骑灰色自行车的选手不是排在第四位；\n（4）选手丁排在第三位，选手乙来自浙江；\n（5）安徽选手排在骑黄色自行车的选手之前，排在选手甲之后；\n（6）丙的自行车是白色的。\n第二步：根据题干条件进行推理。\n根据上一题的结论，第1名为选手甲，来自上海，自行车是蓝色的，排除A项；\n根据条件（6）丙的自行车是白色的，结合上一题的结论可以推出第2名为选手丙，来自安徽，自行车是白色的，排除C项；\n再根据条件（3）骑灰色自行车的选手不是排在第四位，结合上一题的结论可以推出第3名选手丁来自江苏，自行车是灰色的，那么第4名选手乙来自浙江，自行车是黄色的（具体如下表所示），D项当选。\n\u003cimg data-k=\"da0f945d863f\" style=\"max-width:550px\">\n故正确答案为D。","no":65,"missingImage":false},{"qid":"11367761","cat":"类比推理","stem":"元宇宙：虚拟性","options":{"A":"实验：前瞻性","B":"决策：可行性","C":"宣传：普遍性","D":"总结：概括性"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n元宇宙是通过虚拟增强的物理现实，是呈现收敛性和物理持久性特征的、基于未来互联网的具有链接感知和共享特征的3D虚拟空间。元宇宙一定具有虚拟性，二者是必然属性的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：实验不一定具有前瞻性，二者是或然属性的对应关系，与题干逻辑关系不一致，排除；\nB项：决策不一定具有可行性，二者是或然属性的对应关系，与题干逻辑关系不一致，排除；\nC项：宣传不一定具有普遍性，二者是或然属性的对应关系，与题干逻辑关系不一致，排除；\nD项：总结指总结后概括出来的结论。总结一定具有概括性，二者是必然属性的对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":66,"missingImage":false},{"qid":"12100994","cat":"类比推理","stem":"柿子：柿饼","options":{"A":"土豆：土豆泥","B":"花生：花生糖","C":"椰子：椰子汁","D":"葡萄：葡萄干"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“柿子”是制作“柿饼”的原材料，二者为原材料与成品的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“土豆”是制作“土豆泥”的原材料，二者为原材料与成品的对应关系，与题干逻辑关系一致，保留；\nB项：“花生”是制作“花生糖”的原材料，二者为原材料与成品的对应关系，与题干逻辑关系一致，保留；\nC项：“椰子”是制作“椰子汁”的原材料，二者为原材料与成品的对应关系，与题干逻辑关系一致，保留；\nD项：“葡萄”是制作“葡萄干”的原材料，二者为原材料与成品的对应关系，与题干逻辑关系一致，保留。\n对比A、B、C、D四项，题干“柿子”制成“柿饼”和D项“葡萄”制成“葡萄干”的过程中都需要经过“晾晒”，而A项“土豆”制成“土豆泥”、B项“花生”制成“花生糖”、C项“椰子”制成“椰子汁”均不需要经过“晾晒”，故D项与题干逻辑关系更为一致，当选。\n故正确答案为D。","no":67,"missingImage":false},{"qid":"11367764","cat":"类比推理","stem":"热极生风：穷极思变","options":{"A":"鼓空声高：人狂话大","B":"绳锯木断：水滴石穿","C":"人闲生病：石闲生苔","D":"得道多助：失道寡助"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“热极生风”意思是一个地方热得太厉害，不久便会产生大风；“穷极思变”意思是在穷困艰难的时候，就要想办法改变现状。二者无明显语义关系，考虑拆分。因为“热极”所以“生风”，因为“穷极”所以“思变”，二者拆分之后均为因果关系，且“热极生风”和“穷极思变”均可指“事物在极端状态下会发生变化”。\n第二步：判断选项词语间逻辑关系。\nA项：“鼓空声高”意思是鼓里面是空的时候声音反而大；“人狂话大”意思是没有真才实学的人往往狂妄自大，好说大话，喜欢吹牛。因为“鼓空”所以“声高”，因为“人狂”所以“话大”，二者拆分之后均为因果关系，但“鼓空声高”无法指“事物在极端状态下会发生变化”，与题干逻辑关系不一致，排除；\nB项：“绳锯木断”意思是以绳当锯，也能锯断木头；“水滴石穿”意思是水滴不断地滴，可以滴穿石头。因为“绳锯”所以“木断”，因为“水滴”所以“石穿”，二者拆分之后均为因果关系，但“绳锯木断”和“水滴石穿”均无法指“事物在极端状态下会发生变化”，与题干逻辑关系不一致，排除；\nC项：“人闲生病”意思是人闲得无聊就容易生病；“石闲生苔”意思是闲置的石头很容易长出青苔。因为“人闲”所以“生病”，因为“石闲”所以“生苔”，二者拆分之后均为因果关系，且“人闲生病”和“石闲生苔”均可指“事物在极端状态下会发生变化”，与题干逻辑关系一致，当选；\nD项：“得道多助”意思是坚持正义就能得到多方面的支持与帮助；“失道寡助”意思是违背正义必然陷于孤立。因为“得道”所以“多助”，因为“失道”所以“寡助”，二者拆分之后均为因果关系，但“得道多助”和“失道寡助”均无法指“事物在极端持续状态下会发生变化”，与题干逻辑关系不一致，排除。\n故正确答案为C。\n本题为争议题。若看题干第一个词“热极生风”与物有关，第二个词“穷极思变”与人有关；A项第一个词“鼓空声高”与物有关，第二个词“人狂话大”与人有关，C项刚好顺序反了，也有同学会选择A项，此考法历年真题也确实考过。两种理解方式均有合理之处，考生无需过于纠结不严谨的题，重点学习此类题的解题思路即可，这种同时涉及物和人的成语或诗句可能会考查的两个角度，一是具体意思的类似，二是由物到人或由人到物的类比。","no":68,"missingImage":false},{"qid":"11367770","cat":"类比推理","stem":"苍鹰：鸿雁：书信","options":{"A":"加油：注水：鼓劲","B":"下海：上岸：录取","C":"须眉：巾帼：围脖","D":"疆域：河山：国土"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“苍鹰”和“鸿雁”都是鸟类，二者为并列关系；“鸿雁”是书信的代称，可以比喻“书信”，第二词与第三词构成比喻象征义，且第一词与第三词无必然逻辑关系。\n第二步：判断选项词语间逻辑关系。\nA项：“加油”和“注水”都是动作，二者为并列关系；“加油”可用于支持，指勉励他人或自己，可以比喻“鼓劲”，第一个词与第三个词构成比喻象征义，词语顺序与题干不一致，与题干逻辑关系不一致，排除；\nB项：“下海”和“上岸”都是动作，二者为并列关系；“上岸”指舍舟登陆，也指考生被录取，可以比喻“录取”，第二词与第三词构成比喻象征义，且第一词与第三词无必然逻辑关系，与题干逻辑关系一致，当选；\nC项：“须眉”指胡须和眉毛，也可以比喻男子，“巾帼”指古代妇女的头巾和发饰，也可以比喻女子，二者为并列关系；但“巾帼”不能比喻“围脖”，与题干逻辑关系不一致，排除；\nD项：“疆域”指国家领土，“河山”指国家的疆土，“国土”指国家的领土，第一个词和第三个词意思一致，二者为全同关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":69,"missingImage":false},{"qid":"11367768","cat":"类比推理","stem":"压舱石：就业：社会稳定","options":{"A":"先手棋：专利：科技创新","B":"基本盘：耕地：粮食生产","C":"晴雨表：管理：人才培养","D":"主阵地：学校：知识传播"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“压舱石”本意为船舶、飞机等交通工具上为了保持平衡和稳定而放置的重物，后比喻对事物发展起到稳定、支撑作用的关键因素、重要力量或基础保障。“就业”是“社会稳定”的“压舱石”，三者为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“先手棋”本来指围棋、象棋等棋类游戏中，先走的一方所下的第一步棋，具有争取主动的优势，后引申为在竞争、行动等过程中，为了占据主动地位而采取的第一步或关键的起始行动、策略等。“专利”不是“科技创新”的“先手棋”，三者不构成对应关系，与题干逻辑关系不一致，排除；\nB项：“基本盘”指事物最基础、最根本的部分。“耕地”是“粮食生产”的“基本盘”，三者为对应关系，与题干逻辑关系一致，保留；\nC项：“晴雨表”比喻能敏锐地反映某种变化或在事情发生前出现征兆的事物。“管理”不是“人才培养”的“晴雨表”，三者不构成对应关系，与题干逻辑关系不一致，排除；\nD项：“主阵地”指在军事作战中，军队主要据守和作战的地区或位置，现在常用来指在某个领域、行业或工作中，起主导、核心作用，集中力量进行主要活动或发挥主要作用的地方、领域或平台等。“学校”是“知识传播”的“主阵地”，三者为对应关系，与题干逻辑关系一致，保留。\n对比B、D两项，题干的“压舱石”强调“就业”是维持“社会稳定”的重要基础和关键因素，对“社会稳定”起着支撑作用，B项的“基本盘”强调“耕地”是“粮食生产”的根本和基础，对“粮食生产”起着支撑作用，而D项的“主阵地”没有体现这种基础和支撑作用。且题干的“压舱石”和B项的“基本盘”都是物品，而D项的“主阵地”为地点，故B项与题干逻辑关系更为一致，当选。\n故正确答案为B。","no":70,"missingImage":false},{"qid":"11367767","cat":"类比推理","stem":"森林 之于 （    ） 相当于 （    ） 之于 社会","options":{"A":"气候 法制","B":"氧气 自然","C":"系统 国家","D":"树木 家庭"},"answer":"A","explanation":"逐一代入选项。\nA项：森林会调节气候，二者为对应关系；法制会约束或调节社会，二者为对应关系，前后逻辑关系一致，当选；\nB项：森林会释放氧气，二者为产物的对应关系；自然会影响社会，而社会也会改造自然，二者为互相影响的对应关系，前后逻辑关系不一致，排除；\nC项：森林是一种生态系统，二者为种属关系；国家可以指阶级统治的工具，也可以指一个国家的整个区域，但国家不是一种社会，二者不是种属关系，前后逻辑关系不一致，排除；\nD项：树木是森林的组成部分，二者为组成关系；家庭是社会的组成部分，二者为组成关系，但前后词语顺序相反，前后逻辑关系不一致，排除。\n故正确答案为A。","no":71,"missingImage":false},{"qid":"12100997","cat":"图形推理","stem":"请从四个选项中选出最恰当的一项填入问号处，使题干图形呈现一定的规律性。\n\u003cimg data-k=\"5955dfe06015\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，且属性规律无答案，考虑数量规律。观察发现，题干图形中的曲线和直线均有明显相交，考虑曲直交点数。题干图形的曲直交点数均为1，故？处应选择有1个曲直交点的图形，只有B项符合。\n故正确答案为B。","no":72,"missingImage":false},{"qid":"11367769","cat":"图形推理","stem":"请从四个选项中选出最恰当的一项填入问号处，使题干图形呈现一定的规律性。\n\u003cimg data-k=\"04b3872a9b21\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"题干中每幅图形均由1个单独小矩形和4个相连的小矩形构成。观察发现，单独小矩形的方向在每幅图中依次呈水平、竖直，交替放置，故？处应选择一个单独小矩形竖直放置的图形，排除A、D两项；继续观察发现，4个相连的小矩形中，与单独小矩形方向一致的数量依次为2、1、2、1、2，交替出现，只有C项符合。\n故正确答案为C。","no":73,"missingImage":false},{"qid":"11367773","cat":"图形推理","stem":"请从四个选项中选出最恰当的一项填入问号处，使题干图形呈现一定的规律性。\n\u003cimg data-k=\"1371077fddbf\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干出现多个 “日”字变形图，考虑笔画数。题干图形均为一笔画图形，？处应用规律，排除A、B两项；继续观察发现，题干每幅图形均存在两个三角形面，故？处应选一个存在两个三角形面的图形，只有C项符合。\n故正确答案为C。","no":74,"missingImage":false},{"qid":"11367796","cat":"图形推理","stem":"左边给定的图形是由右边哪些图形拼合（只可平移，不可旋转和翻转）而成的？\n\u003cimg data-k=\"84356f635d3e\" style=\"max-width:600px\">","options":{"A":"①②③④","B":"①②③⑤","C":"②③④⑤","D":"①③④⑤"},"answer":"D","explanation":"本题考查平面拼合，可采用平行且等长相消的方式解题。左边给定的图形是由右边①③④⑤拼合而成的。平行且等长相消的方式如下图所示：\n\u003cimg data-k=\"9826d20eef47\" style=\"max-width:151px\">\n故正确答案为D。","no":75,"missingImage":false},{"qid":"11367783","cat":"类比推理","stem":"上边四张纸片，每张纸片一面是黑色，另一面是白色，下边仅有一项能由它们拼合（可以平移、旋转、翻转）而成，请把它找出来。\n\u003cimg data-k=\"2ef668c8e392\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查平面拼合，可以平移、旋转、翻转，且每张纸片一面是黑色，另一面是白色，需要考虑翻转后的颜色变化。将题干图形标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"44b6a766e023\" style=\"max-width:500px\">\nA项：中间的三角形是由图③旋转后平移过去的，颜色应该是黑色，而选项是白色，排除；\nB项：下方的多边形是由图②旋转后平移过去的，颜色应该是白色，而选项是黑色，排除；\nC项：可以由题干图形拼合而成，拼合方式如图所示，当选；\nD项：右上角的多边形与题干四张纸片的形状均不相同，无法由题干图形拼合而成，排除。\n故正确答案为C。","no":76,"missingImage":false},{"qid":"11367785","cat":"图形推理","stem":"左边给定的是一个立方体，右边哪一项可能是它的外表面展开图？\n\u003cimg data-k=\"5f79b34f14d9\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"将题干立体图和选项展开图的面均标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"39d9d4380857\" style=\"max-width:600px\">\nA项：题干立体图中g面中箭头的箭尾对着e面，而选项中无论是g1面还是g2面，箭头的箭尾均对着f2面，选项展开图与题干立体图不一致，排除；\n\u003cimg data-k=\"ac41aecc9c47\" style=\"max-width:600px\">\nB项：题干立体图中e面中箭头指向f面中箭头的尖，而选项中无论是e1面还是e2面，箭头均指向f2面中箭头的箭身，选项展开图与题干立体图不一致，排除；\n\u003cimg data-k=\"fb8080d79980\" style=\"max-width:600px\">\nC项：以e面中单箭头尖指向的边为起始边，在题干立体图和选项展开图中进行顺时针画边（如下图所示），题干立体图中边4对应g面中的箭尾，而选项中无论是e1面还是e2面，边4均不对应g面中的箭尾，选项展开图与题干立体图不一致，排除；\n\u003cimg data-k=\"20a0a35d3c35\" style=\"max-width:600px\">\nD项：题干由e1面、g1面和f2面组成，选项展开图与题干立体图一致，当选。\n故正确答案为D。","no":77,"missingImage":false},{"qid":"12101001","cat":"图形推理","stem":"左边给定的是六面体的外表面展开图，右边哪一项能由它折叠而成？\n\u003cimg data-k=\"309f21d79a89\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查六面体。将展开图中右下角的面移动，并给每个面标号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"977b4a481624\" style=\"max-width:658px\">\nA项：选项一定有面i和面f，右面为面e或面k，展开图中面f和面k为相对面，无法同时出现，故右面为面e。展开图中面e、面f和面i的公共点引出一条线，而选项中三个面的公共点引出两条线，选项与题干展开图不一致，排除；\nB项：选项由面e、面g与面k构成，选项与题干展开图一致，当选；\nC项：选项一定有面h和面i，展开图中面h与面i的公共边挨着面h中的两条线，而选项中两个面的公共边只挨着面h中的一条线，选项与题干展开图不一致，排除；\nD项：选项由面f、面h和面i构成，展开图中三个面的公共点引出两条线，而选项中三个面的公共点只引出一条线，选项与题干展开图不一致，排除。\n故正确答案为B。","no":78,"missingImage":false},{"qid":"11367788","cat":"图形推理","stem":"下面4个立体图形均由大小相同的8个白色小立方体和4个灰色小立方体堆叠而成，其中一个立体图形的某一视图可能是由纯白小方格组成的，请把它找出来。\n\u003cimg data-k=\"81228cae1352\" style=\"max-width:501px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查三视图。A、B、C三项中的立体图形不可能某一视图由纯白小方格组成，排除。D项中，立体图形的正面能看到7个白色小立方体和3个灰色小立方体，所以其背面应还有1个白色小立方体和1个灰色小立方体。如下图所示，当灰色小立方体在最下层摆放，白色小立方体摆放在该灰色小立方体的上方时，其俯视图由纯白小方格组成。\n\u003cimg data-k=\"569210208a35\" style=\"max-width:317px\">\n故正确答案为D。","no":79,"missingImage":false},{"qid":"11367777","cat":"逻辑判断","stem":"只有为了人民的现代化，才有意义；只有依靠人民的现代化，才有动力。新时代以来，我们坚持民生为大，书写了经济快速发展和社会长期稳定两大奇迹新篇章。只要坚持一切为了人民、一切依靠人民，就能充分调动广大人民的积极性。\n根据以上信息，可以推出以下哪项？","options":{"A":"不是为了人民的现代化，就是没有意义的现代化","B":"不坚持民生为大，就不能创造经济快速发展和社会长期稳定两大奇迹","C":"如果没能调动广大人民的积极性，则没有坚持一切为了人民","D":"只有坚持一切依靠人民，才能充分调动广大人民的积极性"},"answer":"A","explanation":"第一步：翻译题干。\n①现代化有意义\u003cimg data-k=\"a37757d411ef\">为了人民的现代化；\n②现代化有动力\u003cimg data-k=\"a37757d411ef\">依靠人民的现代化；\n③坚持一切为了人民 且 坚持一切依靠人民\u003cimg data-k=\"a37757d411ef\">充分调动广大人民的积极性。\n第二步：逐一分析选项。\nA项：翻译为“\u003cimg data-k=\"0be436194951\">为了人民的现代化\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">现代化有意义”，是对①的否后，否后必否前，可以推出，当选；\nB项：翻译为“\u003cimg data-k=\"0be436194951\">坚持民生为大\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">创造经济快速发展和社会长期稳定两大奇迹”，二者不存在逻辑关系，无法推出，排除；\nC项：翻译为“\u003cimg data-k=\"0be436194951\">调动广大人民的积极性\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">坚持一切为了人民”，是对③的否后，否后必否前，即“\u003cimg data-k=\"0be436194951\">充分调动广大人民的积极性\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">坚持一切为了人民 或 \u003cimg data-k=\"0be436194951\">坚持一切依靠人民”，无法得出“\u003cimg data-k=\"0be436194951\">坚持一切为了人民”一定为真，无法推出，排除；\nD项：翻译为“充分调动广大人民的积极性\u003cimg data-k=\"a37757d411ef\">坚持一切依靠人民”，是对③的肯后，但肯后得不到确定性的结论，无法推出，排除。\n故正确答案为A。","no":80,"missingImage":false},{"qid":"12101003","cat":"逻辑判断","stem":"地名是一个社会的基本公共信息，是自然地理、生产生活、历史文化的重要载体，在经济社会发展中发挥着基础性作用。民政部印发通知，提出以乡村地名采集上图标注为牵引，全面推进乡村地名命名管理、地名标志设置维护。对此，有专家称这一举措有助于传承中华民族悠久的历史文化。\n以下哪项如果为真，最能支持上述专家的论断？","options":{"A":"地名作为一种蕴含丰富价值的资源，融入了人们的价值取向、文化思想观念等内容","B":"地名属于专有名词，每个地名都有对应的读音和含义，体现了人们对美好生活的期盼","C":"地名是人类历史“活化石”，在中华民族千百年的传承中被赋予更多含义，成为中华文明的独特载体","D":"一些地方存在着地名不规范的现象，给基层治理、公共服务以及人们的生产生活带来诸多困扰"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：这一举措（以乡村地名采集上图标注为牵引，全面推进乡村地名命名管理、地名标志设置维护）有助于传承中华民族悠久的历史文化。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出地名融入了人们的价值取向、文化思想观念等内容，人们的价值取向、文化思想观念等内容是中华民族历史文化的具体体现，补充论据，可以加强，保留；\nB项：该项指出每个地名都有对应的读音和含义，体现了人们对美好生活的期盼，但无法证明地名命名管理是否有助于传承中华民族悠久的历史文化，无法加强，排除；\nC项：该项指出地名在中华民族千百年的传承中被赋予更多含义，成为中华文明的独特载体，解释了为什么地名命名管理有助于传承中华民族悠久的历史文化，补充论据，可以加强，保留；\nD项：该项指出一些地方存在着地名不规范的现象以及由此带来的困扰，而论点说的是地名命名管理有助于传承中华民族悠久的历史文化，话题不一致，无法加强，排除。\n对比A、C两项，题干论点的关键词为“有助于传承中华民族悠久的历史文化”，A项说的是具体体现即“人们的价值取向、文化思想观念等内容”，而C项指出“地名在中华民族千百年的传承中被赋予更多含义”，C项表述的范围比A项更大、更全面，C项当选。\n故正确答案为C。","no":81,"missingImage":false},{"qid":"12101032","cat":"逻辑判断","stem":"某学校开通了甲、乙、丙3趟校直通车，分别在校门口、图书馆、教学楼、宿舍楼、行政楼5个地点选择一些地方设置班车停靠点，每趟班车设置了3个停靠点，每个停靠点都有1至2趟班车停靠，已知：\n（1）在校门口停靠点的班车趟数量最少；\n（2）若乙班车不在教学楼和图书馆停靠，则丙班车在校门口停靠；\n（3）若丙班车不在行政楼、教学楼和图书馆停靠，则仅有乙班车在宿舍楼停靠。\n根据上述信息，可以推断出以下哪项?","options":{"A":"甲班车在教学楼停靠","B":"乙班车在行政楼停靠","C":"甲、乙班车在宿舍楼停靠","D":"乙、丙班车在宿舍楼停靠"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）在校门口停靠点的班车趟数量最少；\n（2）乙班车不在教学楼和图书馆停靠\u003cimg data-k=\"a37757d411ef\">丙班车在校门口停靠；\n（3）丙班车不在行政楼、教学楼和图书馆停靠\u003cimg data-k=\"a37757d411ef\">仅有乙班车在宿舍楼停靠；\n（4）3趟班车每趟设置了3个停靠点，每个停靠点都有1至2趟班车停靠。\n第二步：根据题干条件进行推理。\n根据条件（1）和条件（4）可以推出，校门口有1趟班车停靠，其余4个停靠点行政楼、教学楼、图书馆和宿舍楼均有2趟班车停靠；\n根据宿舍楼有2趟班车停靠，可以推出“仅有乙班车在宿舍楼停靠”不成立，再结合条件（3）的逆否可以推出，丙班车在行政楼、教学楼和图书馆停靠；\n再根据条件（4）可以推出，丙班车不在校门口和宿舍楼停靠，宿舍楼又有2趟班车停靠，那么甲、乙班车在宿舍楼停靠，满足题干所有条件，C项当选。\n故正确答案为C。\n注：本题条件（2）中的“在教学楼和图书馆停靠”和条件（3）中的“在行政楼、教学楼和图书馆停靠”需理解成“一个整体”，不能理解成且关系，进行逆否时无需使用德摩根定律进行推理，这样才能得出正确答案。","no":82,"missingImage":false},{"qid":"11367780","cat":"逻辑判断","stem":"一项调查显示，某公司有70%的员工存在压力过大、健康隐患等问题。为此，公司计划建立一个“健康角”，提供瑜伽课程和心理咨询服务。公司管理层预测，设立“健康角”能改善员工的身心状态，提高整体工作效率。\n回答以下哪个问题，最有助于评价公司管理层作出的上述预测？","options":{"A":"员工是否有需求和兴趣参与“健康角”活动","B":"其他实施类似福利计划的公司是否取得了成效","C":"该调查数据是否反映公司员工真实的身心状况","D":"该公司是否有足够预算用于“健康角”长期运营"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：设立“健康角”能改善员工的身心状态，提高整体工作效率。\n论据：无。\n本题只有论点，没有论据，且提问方式为“最有助于”评价公司管理层作出的预测，问题对预测成立越重要越有帮助，可优先考虑必要条件。\n第二步：逐一分析选项。\nA项：该项讨论的是员工是否有需求和兴趣参与“健康角”，如果员工对“健康角”没有需求和兴趣，就不会参与该活动，那设立“健康角”就达不到预期效果，即该问题成立是预测成立的必要条件，有助于评价公司管理层的预测，当选；\nB项：该项讨论的是其他公司，而论点讨论的是该公司，主体不一致，无助于评价公司管理层的预测，排除；\nC项：该项讨论的是该调查数据是否反映公司员工真实的身心状况，即使该数据不能反映真实情况，也不代表该公司员工身心状况是良好的，因此无法据此判断“健康角”是否能实现预期效果，无助于评价公司管理层的预测，排除；\nD项：该项讨论的是该公司是否有足够预算用于“健康角”长期运营，而论点讨论的是该公司设立“健康角”能否取得预期效果，话题不一致，无助于评价公司管理层的预测，排除。\n故正确答案为A。","no":83,"missingImage":false},{"qid":"11367786","cat":"逻辑判断","stem":"海草是由陆地植物演化到适应海洋环境的高等植物。一种或几种海草连片生长，共同形成广袤柔软的“海草床”。海草床是最高效的碳捕获和碳封存系统之一，贮存碳的效率比森林高90倍，碳封存时间可达上千年。然而海草床是脆弱的生态系统，受自然环境变化和人类活动影响较大，全球范围内海草床正面临严峻退化趋势。基于如上原因，有专家建议，亟需开展“海底种草”生态修复工作，加强对海草床的保护。\n以下哪项如果为真，最能支持上述专家的建议？","options":{"A":"当前全球气候变暖日益加剧，科学家已发现人类生产生活排放的碳化合物是变暖的主要元凶","B":"海草床可以通过光合作用吸收环境中的无机碳，将其高效地固定、转化为有机碳并进行积累","C":"有些地方海岸线侵蚀严重，加强海草床保护和修复，能有效防止或减缓海滩和海岸遭受侵蚀","D":"海草床具有水质净化和调控功能，能吸收水体中的营养盐和重金属，降低海水悬浮物的浓度"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：亟需开展“海底种草”生态修复工作，加强对海草床的保护。\n论据：海草床是最高效的碳捕获和碳封存系统之一，贮存碳的效率比森林高90倍，碳封存时间可达上千年。然而海草床是脆弱的生态系统，受自然环境变化和人类活动影响较大，全球范围内海草床正面临严峻退化趋势。\n本题论点说的是亟需修复和保护海草床，论据说的是海草床是最高效的碳捕获和碳封存系统之一，但正面临严峻退化趋势，二者话题基本一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是全球气候变暖日益加剧，而其主要元凶是人类生产生活排放的碳化合物，那么固碳就显得尤为重要，而海草床可以固碳，故应亟需开展“海底种草”生态修复工作，该项指出目前碳排放问题较严重是填补了论据推出论点过程中的漏洞，补充论据，保留；\nB项：该项说的是海草床可以将无机碳高效地固定、转化为有机碳并进行积累，说明海草床贮存碳的效率较高，是对论据的重复，可以加强，保留；\nC项：该项说有些地方海岸线侵蚀严重，加强海草床保护和修复，能有效防止或减缓海滩和海岸遭受侵蚀，但未提及其与碳化合物的关系，话题不一致，无法加强，排除；\nD项：该项说的是海草床具有水质净化和调控功能，但没有体现这些功能对碳化合物的作用，无法证明“亟需”修复和保护海草床，无法加强，排除。\n对比A、B两项，A项填补了论据推出论点过程中的漏洞，而B项只是重复论据，因此A项的加强力度更强。\n故正确答案为A。","no":84,"missingImage":false},{"qid":"11367795","cat":"类比推理","stem":"甲：在手机市场增长缓慢的大环境下，折叠屏手机销量连续多年保持两位数的增长，折叠屏手机将是手机研发的下一个风口\n乙：折叠屏手机经历多年发展仍只占手机整体销量的1.6%，由此来看，折叠屏手机不值得手机厂商投入太多精力\n以下哪项与上述对话方式最为相似？","options":{"A":"甲：2017年企业应用AI技术比例约为20%，到2023年提高至50%，AI技术将是国家经济发展的重点\n乙：AI技术经历多年发展已经在社会方方面面起着重要作用，但传统行业仍是经济中的重要部分，同样需要重视","B":"甲：这次期末考试，张明的成绩平均每科提高了5分，这表明张明过去一年在学习上认真了许多\n乙：这次期末考试比较简单，全班同学各科平均分都提高了10分之多，由此看来，张明在过去一年没有认真学习","C":"甲：过去三年某出版社的错别字检出量大大增加，必须增加相应的人手以避免错别字检出数量继续增加\n乙：过去三年该出版社出版总量大大增加，但错别字检出率维持在万分之一左右，远低于国家标准，无需增加人手","D":"甲：一项调查显示，超过90%的大学生在不请假的情况下缺过课，这一现象说明课堂纪律没有得到很好的遵守\n乙：这项调查主要针对大四学生，如果是大一学生，则缺过课的比例不超过20%，可见大学课堂纪律得到了很好的遵守"},"answer":"C","explanation":"第一步：分析题干逻辑关系。\n甲根据“折叠屏手机销量连续多年保持两位数的增长”的现象，得出“折叠屏手机将是手机研发的下一个风口”的结论，而乙提出“折叠屏手机经历多年发展仍只占手机整体销量的1.6%”，通过说明折叠屏手机在手机整体销量中的占比仍很低反驳了甲的结论。\n第二步：逐一分析选项。\nA项：甲根据“企业应用AI技术比例在2023年提高至50%”的现象，得出“AI技术将是国家经济发展的重点”的结论，乙提出“传统行业仍是经济中的重要部分，同样需要重视”，并未反驳甲的结论，与题干对话方式不一致，排除；\nB项：甲根据“张明的成绩平均每科提高了5分”的现象，得出“张明过去一年在学习上认真了许多”的结论，而乙提出“全班同学各科平均分都提高了10分之多”，通过说明张明的成绩提升幅度小于全班同学的平均水平反驳了甲的结论，与题干对话方式不一致，排除；\nC项：甲根据“过去三年某出版社的错别字检出量大大增加”的现象，得出“必须增加相应的人手以避免错别字检出数量继续增加”的结论，而乙提出“过去三年该出版社出版总量大大增加，但错别字检出率维持在万分之一左右”，通过说明错别字的数量占文本总字数的比例很低反驳了甲的结论，与题干对话方式一致，当选；\nD项：甲根据“一项调查显示，超过90%的大学生在不请假的情况下缺过课”的现象，得出“课堂纪律没有得到很好的遵守”的结论，而乙提出“这项调查主要针对大四学生，如果是大一学生，则缺过课的比例不超过20%”，通过说明调查的样本不具代表性反驳了甲的结论，与题干对话方式不一致，排除。\n故正确答案为C。","no":85,"missingImage":false},{"qid":"12101008","cat":"逻辑判断","stem":"近年来，AI在世界范围内掀起一波接一波的热潮，它的颠覆性应用让许多行业受益。然而，今年4月发布的一份研究报告显示，近一年来，经济与企业类AI谣言量增速达99.91%。某权威调查机构称，生成虚假文章的网站数量自2023年5月以来激增1000%以上，涉及15种语言。据此，有专家预测，如果任由这种情况发展下去，AI输出内容的质量会呈现断崖式下降。\n以下哪项如果为真，最能支持上述专家的预测？","options":{"A":"AI输出的内容虽然形式上非常合理，但是一旦深入分析，就会发现很多地方站不住脚","B":"缺乏批判性思维的情况下，AI可能让人陷入认知幻觉，扭曲公众对现实和科学共识的集体理解","C":"AI生成的大量虚假、垃圾内容会源源不断地回流互联网，“污染”训练AI模型的数据","D":"AI生成、伪造或篡改文本、图片、音频和视频的现象越来越普遍，产生了大量信息垃圾"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：如果任由这种情况发展下去，AI输出内容的质量会呈现断崖式下降。\n论据：今年4月发布的一份研究报告显示，近一年来，经济与企业类AI谣言量增速达99.91%。某权威调查机构称，生成虚假文章的网站数量自2023年5月以来激增1000%以上，涉及15种语言。\n本题论据和论点都在讨论AI输出质量的情况，话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出AI输出的内容深入分析后就会发现很多地方站不住脚，说的是AI输出的内容存在问题，但没有提及“AI谣言、虚假信息”对“AI输出内容的质量”的影响，话题不一致，无法加强，排除；\nB项：该项指出AI可能对人产生的负面影响，但没有提及“AI谣言、虚假信息”对“AI输出内容的质量”的影响，话题不一致，无法加强，排除；\nC项：该项指出AI生成的大量虚假、垃圾内容会源源不断地回流互联网，“污染”训练AI模型的数据，进而导致AI输出内容的质量变差，补充论据，可以加强，当选；\nD项：该项指出AI生成、伪造或篡改文本、图片、音频和视频的现象越来越普遍，产生了大量信息垃圾，属于重复论据，没有提及“AI输出内容的质量断崖式下降”，无法加强，排除。\n故正确答案为C。","no":86,"missingImage":false},{"qid":"11367774","cat":"逻辑判断","stem":"甲、乙、丙三人毕业后同时进入某单位实习，由于表现较好，实习结束后他们将分到人事处、财务处、办公室正式入职。有人对他们各自的工作部门进行了如下猜测：\n（1）甲入职的部门是人事处；\n（2）乙入职的部门不是财务处；\n（3）丙入职的部门不是人事处。\n实际上，上述三个猜测只有一个是对的。\n根据上述信息，可以推出甲、乙、丙入职的部门依次为：","options":{"A":"人事处 财务处 办公室","B":"办公室 财务处 人事处","C":"财务处 办公室 人事处","D":"人事处 办公室 财务处"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）甲入职的部门是人事处；\n（2）乙入职的部门不是财务处；\n（3）丙入职的部门不是人事处；\n（4）三个猜测只有一个是对的。\n题干条件没有矛盾关系，也没有反对关系，考虑题干假设或选项代入，选项信息充分，优先考虑代入法。\n第二步：逐一代入选项。\n代入A项：条件（1）为真，条件（2）为假，条件（3）为真，有两个猜测为真，与条件（4）矛盾，排除；\n代入B项：条件（1）为假，条件（2）为假，条件（3）为假，三个猜测均为假，与条件（4）矛盾，排除；\n代入C项：条件（1）为假，条件（2）为真，条件（3）为假，只有一个猜测为真，符合条件（4），当选；\n代入D项：条件（1）为真，条件（2）为真，条件（3）为真，三个猜测均为真，与条件（4）矛盾，排除。\n故正确答案为C。","no":87,"missingImage":false},{"qid":"12101016","cat":"定义判断","stem":"预期管理：指政府部门通过发布会、社交媒体等方式，与社会公众进行互动性交流，以提高政策接受度，塑造稳定的运行环境，确保预期目标实现的管理方式。\n下列属于预期管理的是：","options":{"A":"进入冬季后，市生态环境局每天通过电视台实时发布空气质量监测数据，市民出门前都会随时收看","B":"县文旅局为了促进旅游业发展，制作了上百个短视频，在多个社交平台上宣传当地的美景和特色文化","C":"针对野猪频繁出没危害居民生命财产安全的事件，区农业农村局出台了补偿规定，并在听证会上答复了广大市民的提问","D":"某电商平台公布了平台补贴与政府“以旧换新”补贴叠加使用的申领方案，收到网民提出的各种建议后，又进行了多处修改"},"answer":"C","explanation":"第一步：找出定义关键词。\n“政府部门”、“通过发布会、社交媒体等方式”、“与社会公众进行互动性交流”、“提高政策接受度，塑造稳定的运行环境，确保预期目标实现”。\n第二步：逐一分析选项。\nA项：市生态环境局通过电视台发布空气质量监测数据，只是市生态环境局发布信息的方式，并未体现与社会公众的互动性交流，不符合“与社会公众进行互动性交流”，不符合定义，排除；\nB项：县文旅局制作了上百个短视频，在多个社交平台上宣传当地的美景和特色文化，未体现与社会公众的互动性交流，不符合“与社会公众进行互动性交流”，不符合定义，排除；\nC项：区农业农村局针对野猪危害居民生命财产安全的事件出台了补偿规定，并在听证会上答复了广大市民的提问，符合“政府部门”、“通过发布会、社交媒体等方式”、“与社会公众进行互动性交流”、“提高政策接受度，塑造稳定的运行环境，确保预期目标实现”，符合定义，当选；\nD项：某电商平台公布了平台补贴及政府补贴的申领方案，但电商平台不属于政府部门，不符合“政府部门”，不符合定义，排除。\n故正确答案为C。","no":88,"missingImage":false},{"qid":"11367804","cat":"定义判断","stem":"数字意境：指通过数字技术赋能将优秀传统文化以沉浸式的艺术形式进行创新表达，凸显视觉效果呈现，以展现其文化韵味和审美意境。\n下列属于数字意境的是：","options":{"A":"某电视台文化节目中，大学生们来到文化古迹现场，与考古专家互动，在诵读、观察、探究中加深对中华传统文化的理解","B":"某景区排练的舞蹈节目中，以当地石窟为真实背景，利用三维动画技术复原了壁画中飞天与金刚的舞蹈，使静止的文化符号变成了动感的形象","C":"某艺术研究院和多家企业合作，对古代编钟复制件进行高精细度的音源采集，最终实现对这一传统瑰宝的数字化复原","D":"某博物馆从古代名画《千里江山图》《百花图卷》中选取“意象”元素，实景搭建了沉浸式体验展厅，观众犹如身临其境"},"answer":"B","explanation":"第一步：找出定义关键词。\n“通过数字技术赋能”、“将优秀传统文化以沉浸式的艺术形式进行创新表达”、“凸显视觉效果呈现”。\n第二步：逐一分析选项。\nA项：某电视台文化节目中，大学生们来到文化古迹现场，与考古专家互动，未体现数字技术，不符合“通过数字技术赋能”，不符合定义，排除；\nB项：利用三维动画技术，体现了数字技术，符合“通过数字技术赋能”，复原了石窟壁画中飞天与金刚的舞蹈，使静止的文化符号变成了动感的形象，符合“将优秀传统文化以沉浸式的艺术形式进行创新表达”、“凸显视觉效果呈现”，符合定义，当选；\nC项：对古代编钟复制件进行高精细度的音源采集，最终实现对这一传统瑰宝的数字化复原，只是对其音源进行复原，不涉及创新表达，不符合“将优秀传统文化以沉浸式的艺术形式进行创新表达”、“凸显视觉效果呈现”，不符合定义，排除；\nD项：某博物馆从古代名画中选取“意象”元素，实景搭建了沉浸式体验展厅，观众犹如身临其境，不明确是否使用了数字技术，不符合“通过数字技术赋能”，不符合定义，排除。\n故正确答案为B。","no":89,"missingImage":false},{"qid":"11367797","cat":"定义判断","stem":"创意环保教育：指为了培养青少年生态环保意识而开展的与单向教育模式不同的互动性课外活动。\n下列属于创意环保教育的是：","options":{"A":"每周六晚上，刘老师都会带领一群小小昆虫“发烧友”，在山林、草坪中探索奇妙的昆虫世界，探讨人与自然的和谐关系","B":"王先生发现儿子对地理、生物知识很感兴趣，就给他买了许多书。儿子在增长知识的同时也萌生了更强的环保意识","C":"刘女士收到家长群的通知，要求学生提交用空牛奶盒完成的手工环保作业，她只好网购一些空盒子，因为家里几乎不喝牛奶","D":"清江社区利用微信公众号、户外海报等载体，对废旧电池回收问题进行通俗易懂的讲解，居民纷纷表示再也不会随意乱扔电池"},"answer":"A","explanation":"第一步：找出定义关键词。\n“培养青少年生态环保意识”、“与单向教育模式不同”、“互动性课外活动”。\n第二步：逐一分析选项。\nA项：刘老师带领小小昆虫“发烧友”在山林、草坪中探索昆虫世界，是在户外由老师带领开展的活动，且探讨了人与自然的和谐关系，说明老师与学生之间存在互动，是为了培养生态环保意识，符合“培养青少年生态环保意识”、“与单向教育模式不同”、“互动性课外活动”，符合定义，当选；\nB项：王先生给儿子买了许多书，儿子通过看书萌生了更强的环保意识，是儿子单向学习书籍知识，不符合“互动性课外活动”，不符合定义，排除；\nC项：家长群的通知要求学生提交用空牛奶盒完成的手工环保作业，刘女士为了帮孩子完成作业网购空盒子，没有体现环保，且只是为了完成作业，也未体现互动性，不符合“培养青少年生态环保意识”、“互动性课外活动”，不符合定义，排除；\nD项：清江社区对废旧电池回收问题进行讲解，居民表示再也不会乱扔电池，说明清江社区的讲解是针对居民，而非青少年，不符合“培养青少年生态环保意识”，不符合定义，排除。\n故正确答案为A。","no":90,"missingImage":false},{"qid":"11367806","cat":"定义判断","stem":"多元共治：指针对社会运行中的复杂问题，由政府、社会组织、公民等主体共同参与，多方合作的社会治理模式。\n下列属于多元共治的是：","options":{"A":"针对辖区内河道持续多年的污染问题，某县水利、环保等部门成立联合工作小组，决心打赢河道污染治理的攻坚战","B":"针对居民停车位、充电桩严重不足的问题，某街道统筹规划电动自行车停放充电区域，优化地下非机动车库安全设施，消除电动自行车“上楼入户”的隐患","C":"某区政府在老旧小区改造、公共服务等社区工作中，鼓励业委会、志愿者充分发挥各自作用，遇到问题加强沟通，满足居民的合理诉求","D":"某村两面临山，农林交错，靠近交通要道，火灾防治压力巨大。村民自发组织巡查队，检测上报森林火情，有效遏制了火灾多发的势头"},"answer":"C","explanation":"第一步：找出定义关键词。\n“政府、社会组织、公民等主体共同参与”、“多方合作的社会治理模式”。\n第二步：逐一分析选项。\nA项：某县水利、环保等部门联合治理河道污染，不涉及社会组织和公民等主体，不符合“政府、社会组织、公民等主体共同参与”，不符合定义，排除；\nB项：某街道统筹规划电动自行车停放充电区域，优化地下非机动车库安全设施，不涉及社会组织和公民等主体，不符合“政府、社会组织、公民等主体共同参与”、“多方合作的社会治理模式”，不符合定义，排除；\nC项：某区政府在社区工作中，鼓励业委会、志愿者充分发挥各自作用，符合“政府、社会组织、公民等主体共同参与”、“多方合作的社会治理模式”，符合定义，当选；\nD项：村民自发组织巡查队，检测上报森林火情，不涉及政府等主体，不符合“政府、社会组织、公民等主体共同参与”、“多方合作的社会治理模式”，不符合定义，排除。\n故正确答案为C。","no":91,"missingImage":false},{"qid":"11367799","cat":"定义判断","stem":"森林模式：指企业在发展过程中借助内外部竞争不断克服自身短板，带动行业和谐发展，最终形成群体优势的发展模式。\n下列属于森林模式的是：","options":{"A":"某家具厂针对市场动态需求，研发出一系列新产品，市场占有率不断攀升。本地其他厂家也加大了研发力度，家具行业很快成了当地的支柱产业","B":"某公司定期举办专题研讨会，让员工与国内外同行进行交流，开阔眼界，取长补短，提高业务素质","C":"近年来，某林区大力推进“种、苗、造、抚、管”一体化生产经营模式，保持与周围环境和谐发展的良好势头，培育出了森林可持续经营的样板林区","D":"某公司实行末位淘汰制，业绩排名靠后的员工将被调换工作岗位。每个人都感受到了巨大的压力，产品销售额直线上升，企业的规模和影响力越来越大"},"answer":"A","explanation":"第一步：找出定义关键词。\n“企业”、“借助内外部竞争不断克服自身短板”、“带动行业和谐发展、形成群体优势”。\n第二步：逐一分析选项。\nA项：某家具厂针对市场动态需求，研发出一系列新产品，本地其他厂家也加大了研发力度，符合“企业”、“借助内外部竞争不断克服自身短板”，家具行业成了当地的支柱产业，符合“带动行业和谐发展、形成群体优势”，符合定义，当选；\nB项：某公司员工与国内外同行进行交流，取长补短，提高业务素质，符合“企业”，但不明确该公司是否带动了所在行业的发展，不符合“带动行业和谐发展、形成群体优势”，不符合定义，排除；\nC项：某林区推进一体化生产经营模式，保持与周围环境和谐发展的良好势头，符合“企业”，该林区成为了样板林区，但不明确其是否带动了所在行业的发展，不符合“带动行业和谐发展、形成群体优势”，不符合定义，排除；\nD项：某公司实行末位淘汰制，规模和影响力越来越大，符合“企业”、“借助内外部竞争不断克服自身短板”，但不明确该公司是否带动了所在行业的发展，不符合“带动行业和谐发展、形成群体优势”，不符合定义，排除。\n故正确答案为A。","no":92,"missingImage":false},{"qid":"11367805","cat":"定义判断","stem":"正向情绪价值：指通过积极性的言语或行动，为他人带来舒服、愉悦、安全等良性感受的人际交往能力。\n下列属于正向情绪价值的是：","options":{"A":"林女士是一位经验丰富的住家月嫂，看到自己照护的孩子健康成长和新手父母们满意的笑容，她体会到了自己的价值","B":"陈先生大学毕业后当过游戏主播、网络写手、保险推销员，不久前又在酒吧驻唱。父母很尊重他的选择，从不横加干涉","C":"秦女士到时装店买衣服，刚一进门，几个营业员就围了上来，拼命夸她身材好，穿什么都好看。她虽然半信半疑，还是忍不住买了几件","D":"赵先生是同事心目中的“显眼包”，每次聚会的时候，只要他一开口，大家就会笑得前仰后合，工作中的压力一扫而空"},"answer":"D","explanation":"第一步：找出定义关键词。\n“通过积极性的言语或行动”、“为他人带来良性感受”、“人际交往能力”。\n第二步：逐一分析选项。\nA项：林女士是一位经验丰富的住家月嫂，她照护的孩子健康成长和新手父母们的满意说明林女士具备一定的专业能力，但没有体现“人际交往能力”，不符合定义，排除；\nB项：陈先生大学毕业后做过多种工作，父母尊重他的选择而不加干涉，不符合“通过积极性的言语或行动”、“为他人带来良性感受”，不符合定义，排除；\nC项：营业员拼命夸秦女士身材好，秦女士对此半信半疑，说明营业员的话没有给秦女士带来良性感受，不符合“为他人带来良性感受”，不符合定义，排除；\nD项：赵先生在每次与同事的聚会中，都能让大家笑得前仰后合，工作压力一扫而空，体现了赵先生良好的人际交往能力，符合“通过积极性的言语或行动”、“为他人带来良性感受”、“人际交往能力”，符合定义，当选。\n故正确答案为D。","no":93,"missingImage":false},{"qid":"12101019","cat":"定义判断","stem":"错位沟通：指在日常交流中，由于对彼此的意图和情感理解不一致，导致沟通效果不佳或产生误解。\n下列属于错位沟通的是：","options":{"A":"小杨希望给同事留下沉稳的印象，在单位总是言辞谨慎，很少和同事闲聊，大家都以为他不愿意和人接触","B":"李老师在公开课上讲解一道专业难题，由于相应的背景知识不足，听众始终无法听明白李老师的意思","C":"小张夫妇就孩子的教育问题发生了激烈的争吵，小张认为孩子应该多做课外习题提升成绩，而妻子认为童年就该无忧无虑尽情玩耍","D":"小王打电话告诉女友，临时又要加班，没法一起去看电影。女友冷淡地回复“你去工作吧，我不重要的”，小王一下子就无心工作了"},"answer":"D","explanation":"第一步：找出定义关键词。\n“在日常交流中”、“对彼此的意图和情感理解不一致”、“导致沟通效果不佳或产生误解”。\n第二步：逐一分析选项。\nA项：小杨希望给同事留下沉稳的印象，在单位总是很少和同事交流，而同事都以为他不愿意和人接触，这个误解并不是在日常交流中产生的误会，不符合“在日常交流中”，不符合定义，排除；\nB项：李老师在公开课上讲解专业难题，听众因相应的背景知识不足而无法听懂，听不懂是听众的知识储备不足导致的，不符合“在日常交流中”、“对彼此的意图和情感理解不一致”，不符合定义，排除；\nC项：小张夫妇就孩子的教育问题发生了激烈的争吵，是夫妻二人对于孩子教育观念的不同，不符合“对彼此的意图和情感理解不一致”，不符合定义，排除；\nD项：小王打电话告诉女友，临时又要加班，没法一起去看电影，女友冷淡地回复“你去工作吧，我不重要的”，说明双方在沟通中产生了误解，符合“在日常交流中”、“对彼此的意图和情感理解不一致”、“导致沟通效果不佳或产生误解”，符合定义，当选。\n故正确答案为D。","no":94,"missingImage":false},{"qid":"12101025","cat":"定义判断","stem":"达人探店：指网络博主为了打通商品与消费者的信息隔膜，以直播、视频等形式展示真实的产品体验和消费场景，并在网络平台上发布个人评价的行为。\n下列属于达人探店的是：","options":{"A":"高先生是网上小有名气的食评家，直播时常常让老板和大厨当场下不了台，被网友称为“六亲不认”，收获了大量粉丝，很多餐馆因此改进了菜品和服务","B":"某知名穿搭博主经常购买各品牌的当季新款时装，在各种社交媒体发布变装视频，其穿搭风格被一些网友模仿","C":"健身教练石先生录制了健身教学网课，为提升课程销量，在社交平台上发布了包含大量学员体验及评价的推介视频","D":"带爸妈外出游玩时，胡女士有时会对当地景点的适老性设施情况进行评价，拍摄成攻略短视频，被网民赞誉为史上最靠谱的老年旅游活地图"},"answer":"A","explanation":"第一步：找出定义关键词。\n“网络博主”、“为了打通商品与消费者的信息隔膜”、“以直播、视频等形式展示真实的产品体验和消费场景”、“在网络平台上发布个人评价”。\n第二步：逐一分析选项。\nA项：高先生是网上小有名气的食评家，符合“网络博主”、“在网络平台上发布个人评价”，他在直播时常常让老板和大厨当场下不了台，符合“以直播、视频等形式展示真实的产品体验和消费场景”，符合定义，当选；\nB项：某知名穿搭博主经常购买各品牌的当季新款时装，并在各种社交媒体发布变装视频，这属于自身穿搭风格的展示，并非为了让消费者了解商品本身的情况，不符合“为了打通商品与消费者的信息隔膜”，不符合定义，排除；\nC项：健身教练石先生在社交平台上发布包含大量学员体验及评价的推介视频是为了提升课程销量，不符合“为了打通商品与消费者的信息隔膜”，不符合定义，排除；\nD项：带爸妈外出游玩时，胡女士会拍摄攻略短视频，并对当地景点的适老性设施情况进行评价，主要针对的是适老性设施而非景点本身，并非为了让消费者了解商品本身的情况，不符合“为了打通商品与消费者的信息隔膜”，不符合定义，排除。\n故正确答案为A。","no":95,"missingImage":false},{"qid":"11367800","cat":"定义判断","stem":"情感虹吸：指现实生活中难以得到心理慰藉的中老年人，在网络世界中因为受到情感诱导而盲目消费，导致个人钱财严重受损的现象。\n下列属于情感虹吸的是：","options":{"A":"在外地工作的朱先生发现母亲退休后将退休金的一大半都用于购买一种“三无”保健品，原来该产品的推销员几乎每周都会来陪母亲聊家常","B":"酒店大厨赵先生在网络平台上免费教授烹饪知识，因其手艺精湛，说话幽默，嘴巴又甜，受到了无数妈妈级粉丝的喜爱，每天都能得到不少打赏","C":"儿子考上大学后，刘女士每天晚上都会定时打开手机，在主播们的嘘寒问暖中感受一丝安慰，偶尔也为他们刷一些小礼物","D":"独居的李奶奶每天都泡在“50后时光”直播间，为主播刷“火箭”“跑车”等礼物，成为了“榜一大哥”，两个月内花掉了多年的积蓄"},"answer":"D","explanation":"第一步：找出定义关键词。\n“现实生活中难以得到心理慰藉的中老年人”、“在网络世界中”、“受到情感诱导而盲目消费”、“导致个人钱财严重受损”。\n第二步：逐一分析选项。\nA项：母亲退休后购买“三无”保健品，该产品的推销员几乎每周都会来陪母亲聊家常，没有体现利用“网络”，不符合“在网络世界中”，不符合定义，排除；\nB项：赵先生每天都能得到不少来自妈妈级粉丝的打赏，但未提到这些妈妈级粉丝的钱财是否严重受损，不符合“导致个人钱财严重受损”，不符合定义，排除；\nC项：刘女士每天晚上都会定时打开手机，偶尔为主播们刷一些小礼物，未提到刘女士的钱财是否严重受损，不符合“导致个人钱财严重受损”，不符合定义，排除；\nD项：独居的李奶奶每天都泡在“50后时光”直播间，符合“现实生活中难以得到心理慰藉的中老年人”、“在网络世界中”，为主播刷礼物，两个月内花掉了多年的积蓄，符合“受到情感诱导而盲目消费”、“导致个人钱财严重受损”，符合定义，当选。\n故正确答案为D。","no":96,"missingImage":false},{"qid":"12101022","cat":"定义判断","stem":"电梯效应：指在相对封闭、狭小的空间中，受各种因素影响，人或动物自动减少身体接触，有意控制动作幅度或降低音量的现象。\n下列属于电梯效应的是：","options":{"A":"封闭屋舍中饲养的大猩猩会克制兴奋情绪，很少大喊大叫，避免与同伴关系紧张","B":"地铁里人们大多习惯性地刷着手机、戴耳机听音乐，或者关注车厢里的广告用语","C":"很多出租车中，司机在主驾和副驾、前排座椅与后排座椅之间用亚克力材料进行了实质隔断","D":"当乘坐轮椅的病人在医院搭乘电梯时，电梯中的其他人会主动避让，给他腾出足够空间"},"answer":"A","explanation":"第一步：找出定义关键词。\n“在相对封闭、狭小的空间中”、“人或动物自动减少身体接触，有意控制动作幅度或降低音量”。\n第二步：逐一分析选项。\nA项：在封闭屋舍中，符合“在相对封闭、狭小的空间中”，大猩猩会克制兴奋情绪，很少大喊大叫，符合“人或动物自动减少身体接触，有意控制动作幅度或降低音量”，符合定义，当选；\nB项：在地铁里，符合“在相对封闭、狭小的空间中”，人们习惯性地刷着手机、戴耳机听音乐，说明这是一种习惯，并非有意控制动作幅度或降低音量，不符合“人或动物自动减少身体接触，有意控制动作幅度或降低音量”，不符合定义，排除；\nC项：在出租车里，符合“在相对封闭、狭小的空间中”，在主驾和副驾、前排座椅与后排座椅之间用亚克力材料进行了实质隔断，是为了确保乘客和司机的安全，并非有意控制动作幅度或降低音量，不符合“人或动物自动减少身体接触，有意控制动作幅度或降低音量”，不符合定义，排除；\nD项：在医院搭乘电梯，符合“在相对封闭、狭小的空间中”，电梯中的其他人会主动避让病人，是为了保护病人的安全，并非有意控制动作幅度或降低音量，不符合“人或动物自动减少身体接触，有意控制动作幅度或降低音量”，不符合定义，排除。\n故正确答案为A。","no":97,"missingImage":false}]}],"count":34,"answerable":34,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        新中国成立75年来，从“造不了”到“造得出”再到“造得好”，中国制造实现跨越式增长。我国工业增加值从1952年的120亿元增加到2023年的39.9万亿元，500种主要工业产品中四成以上产品产量位居全球第一。\u003c/p>\u003cp>        1978年我国工业增加值为1621亿元，1992年突破1.0万亿元，2007年达10.7万亿元，2012年达20.9万亿元；2013-2023年工业增加值年均增长5.7%。2023年，我国原煤产量47.1亿吨，比1949年增长146倍；粗钢产量10.2亿吨，增长6449倍；水泥产量20.2亿吨，增长3064倍；平板玻璃产量9.7亿重量箱，增长897倍；化肥产量5714万吨，增长9522倍。2023年，我国汽车产量3011.3万辆，比上年增长9.3%，其中新能源汽车产量944.3万辆，增长30.3%；手机、微型计算机、彩色电视机、工业机器人产量分别为15.7亿台、3.3亿台、1.9亿台、43.0万套，均位居全球首位。\u003c/p>\u003cp>        2023年，我国工业增加值占GDP比重为31.7%，制造业增加值占GDP比重为26.2%。规模以上装备制造业增加值比上年增长6.8%，占规模以上工业增加值比重为33.6%，比2012年提高5.4个百分点；规模以上高技术制造业增加值增长2.7%，占规模以上工业增加值比重为15.7%，比2012年提高6.3个百分点。\u003c/p>","questions":[{"qid":"13319324","cat":"增长","stem":"2023年我国制造业增加值为：","options":{"A":"27.4万亿元","B":"30.1万亿元","C":"33.0万亿元","D":"36.7万亿元"},"answer":"C","explanation":"根据题干“2023年我国制造业增加值为”，结合材料时间为2023年，且材料只给出制造业增加值占GDP的比重，可判定本题为现期比重问题。定位文字材料第一段可知：我国工业增加值从1952年的120亿元增加到2023年的39.9万亿元；定位文字材料第三段可知：2023年，我国工业增加值占GDP比重为31.7%，制造业增加值占GDP比重为26.2%。根据公式：整体\u003cimg data-k=\"447680635370\">，则2023年我国GDP\u003cimg data-k=\"8e1662aa35b2\">\u003cimg data-k=\"c500beeb9323\">万亿元，故2023年我国制造业增加值\u003cimg data-k=\"aa7f7eee419a\">\u003cimg data-k=\"0f39465d594b\">\u003cimg data-k=\"8e8064c8bc50\">万亿元。与C项最接近。\n故正确答案为C。","no":98,"missingImage":false},{"qid":"13319327","cat":"比重","stem":"2012年，我国规模以上装备制造业增加值占规模以上工业增加值的比重，与规模以上高技术制造业增加值占规模以上工业增加值的比重相差：","options":{"A":"14.8个百分点","B":"18.8个百分点","C":"19.2个百分点","D":"19.8个百分点"},"answer":"B","explanation":"根据题干“2012年······占······的比重，与······占······的比重相差”，结合材料时间为2023年，可判定本题为基期比重问题。定位文字材料第三段可       st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);

    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
