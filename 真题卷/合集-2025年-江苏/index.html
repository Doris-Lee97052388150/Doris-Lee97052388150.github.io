<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">行测真题模拟考场<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",imgBase:"",papers:[{"slug":"2025-江苏-A类","title":"2025年江苏省公务员录用考试《行测》题（A类）（网友回忆版）","year":"2025","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"13319187","cat":"毛中特","stem":"习近平新时代中国特色社会主义思想从理论和实践结合上，科学地回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党等重大时代课题，提出一系列原创性的治国理政新理念新思想新战略。关于习近平新时代中国特色社会主义思想的历史地位，下列表述正确的是：\n①继承和发展马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观，是马克思主义在当代中国发展最新理论成果，开辟了马克思主义中国化时代化的新境界\n②把马克思主义基本原理同中国具体实际相结合，同中华优秀传统文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华文化和中国精神的时代精华\n③确立了社会主义市场经济体制的改革目标和基本构架，确立了社会主义初级阶段的基本经济制度和分配制度，开创了全面深化改革新局面，推进党的建设新的伟大工程\n④是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家发展事业的根本遵循","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n①正确，党的十九大报告指出，习近平新时代中国特色社会主义思想，是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展，是马克思主义中国化最新成果，是党和人民实践经验和集体智慧的结晶，是中国特色社会主义理论体系的重要组成部分，是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南，必须长期坚持并不断发展。党的二十大报告提出的“六个必须坚持”，即必须坚持人民至上、坚持自信自立、坚持守正创新、坚持问题导向、坚持系统观念、坚持胸怀天下，集中体现了习近平新时代中国特色社会主义思想的世界观和方法论，是马克思主义世界观方法论中国化时代化的最新成果。\n②正确，习近平新时代中国特色社会主义思想既坚持了马克思主义的根本立场和基本原理，又从中华优秀传统文化中汲取了丰富营养，实现了马克思主义与中华优秀传统文化的有机融合，推动了中华文化的创造性转化和创新性发展。所以，它把马克思主义基本原理同中国具体实际相结合，同中华优秀传统文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华文化和中国精神的时代精华。\n③错误，“确立了社会主义市场经济体制的改革目标和基本构架，确立了社会主义初级阶段的基本经济制度和分配制度”等主要是邓小平理论、三个代表重要思想、科学发展观的重要成果，并不是习近平新时代中国特色社会主义思想的特定贡献。习近平新时代中国特色社会主义思想主要是推进全面深化改革向广度和深度进军，而不是确立社会主义市场经济体制等的最初阶段的内容。\n④正确，习近平新时代中国特色社会主义思想为实现中华民族伟大复兴的中国梦提供了科学理论指引和行动纲领，从思想上、理论上、战略上、行动上为党和国家事业发展指明了方向，对于团结带领全国各族人民全面建成社会主义现代化强国、全面推进中华民族伟大复兴具有重大而深远的意义。因此，可以说它是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家发展事业的根本遵循。\n故①②④说法正确。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"13319179","cat":"毛中特","stem":"党的十八大以来以习近平同志为核心的党中央把全面从严治党纳入“四个全面”战略布局，深入推进新时代党的建设新的伟大工程，提出一系列新理念新思想新战略，形成习近平总书记关于党的建设的重要思想。党在革命性锻造中更加坚强有力、更加充满活力。全面从严治党开辟了百年大党自我革命的新境界。关于新时代全面从严治党取得的历史性开创性成就，下列表述正确的是：\n①牢牢抓住“关键少数”，坚持从领导干部抓起，以上率下\n②提出让人民监督政府是跳出历史周期率第一个答案\n③开展了史无前例的反腐败斗争，取得压倒性胜利并全面巩固\n④把制度建设贯穿党的政治各方面，形成比较完善的党内法规体系\n⑤以党的政治建设统领党的建设的各项工作，不断增强党组织政治功能","options":{"A":"①②③⑤","B":"①②④⑤","C":"①③④⑤","D":"②③④⑤"},"answer":"C","explanation":"本题考查理论与政策。\n①正确，党的十八大以来，全面从严治党过程中，始终强调抓住领导干部这个 “关键少数”，以上率下，要求领导干部以身作则、率先垂范，带头遵守党纪国法，执行党的各项规定，以实际行动引领广大党员干部廉洁从政、担当作为。\n②错误，毛泽东同志在延安的窑洞里给出了跳出历史周期率的第一个答案，即让人民监督政府。而在新时代，习近平总书记给出了第二个答案，这就是自我革命。\n③正确，2023年1月9日，中共中央总书记、国家主席、中央军委主席习近平在中国共产党第二十届中央纪律检查委员会第二次全体会议上发表重要讲话。讲话指出：“新时代10年，我们党不断深化对自我革命规律的认识，不断推进党的建设理论创新、实践创新、制度创新，在构建全面从严治党体系上积累了丰富成果······我们开展史无前例的反腐败斗争，坚持无禁区、全覆盖、零容忍，不敢腐、不能腐、不想腐一体推进，‘打虎’、‘拍蝇’、‘猎狐’多管齐下，查处一大批腐败分子，消除党内严重政治隐患，反腐败斗争取得压倒性胜利并全面巩固，成功走出一条中国特色反腐败之路······”\n④正确，2023年1月9日，中共中央总书记、国家主席、中央军委主席习近平在中国共产党第二十届中央纪律检查委员会第二次全体会议上发表重要讲话。讲话指出：“新时代10年，我们党不断深化对自我革命规律的认识，不断推进党的建设理论创新、实践创新、制度创新，在构建全面从严治党体系上积累了丰富成果······我们把制度建设贯穿党的各项建设，与时俱进完善党章，聚焦加强党的领导和党的建设推进制度创新，形成比较完善的党内法规体系，搭建起党和国家监督体系‘四梁八柱’，把权力关进制度的笼子，为新时代党的建设提供了根本性、全局性、稳定性、长期性保障······”\n⑤正确，党的十八大以来，全面从严治党强调以党的政治建设为统领，把政治标准和政治要求贯穿党的思想建设、组织建设、作风建设、纪律建设以及制度建设、反腐败斗争始终，不断增强党组织政治功能和组织功能，确保党的团结统一和行动一致。\n故①③④⑤表述正确。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"13319185","cat":"新思想","stem":"2023年7月，习近平总书记在江苏考察时强调，江苏有能力也有责任在推进中国式现代化进程中走在前、做示范，希望江苏在科技创新上取得新突破，在强链补链延链上展现新作为，在建设中华民族现代文明上探索新经验，在推进社会治理现代化上实现新提升。为贯彻落实总书记赋予江苏“四个新”的重大任务，下列做法正确的有：\n①打造全国重要的产业科技创新高地，使高质量发展更多依靠创新驱动的内涵型增长，强化企业科技创新主体地位，深化科技体制改革和人才发展体制机制改革\n②巩固传统产业领先地位，加快打造具有国际竞争力的战略性新兴产业集群，全面提升产业基础高级化和产业链现代化水平，加快构建以先进制造业为骨干的现代化产业体系\n③加强优秀传统文化的保护传承和创新发展，大力发展现代科技、教育事业，全面提升人民群众的科学文化素质，繁荣发展文化事业和文化产业，持续推进城乡公共文化服务标准化、均等化\n④加快健全社会保障体系，健全就业促进机制和就业公共服务体系，完善社会治理体系，推进社会治理数字化，推进应急管理体系和能力现代化","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查理论与政策。\n①正确，习近平总书记指出，中国式现代化关键在科技现代化。江苏要在科技创新上率先取得新突破，打造全国重要的产业科技创新高地，使高质量发展更多依靠创新驱动的内涵型增长。要强化企业科技创新主体地位，促进创新要素向企业集聚，不断提高科技成果转化和产业化水平。要深化科技体制改革和人才发展体制机制改革······\n②正确，习近平总书记强调，要把坚守实体经济、构建现代化产业体系作为强省之要，巩固传统产业领先地位，加快打造具有国际竞争力的战略性新兴产业集群，推动数字经济与先进制造业、现代服务业深度融合，全面提升产业基础高级化和产业链现代化水平，加快构建以先进制造业为骨干的现代化产业体系。\n③正确，习近平总书记指出，建设中华民族现代文明，是推进中国式现代化的必然要求，是社会主义精神文明建设的重要内容。江苏要加强优秀传统文化的保护传承和创新发展，积极参与建设长江和大运河两大国家文化公园。要大力发展现代科技、教育事业，全面提升人民群众的科学文化素质。要繁荣发展文化事业和文化产业，持续推进城乡公共文化服务标准化、均等化······\n④正确，习近平总书记强调，江苏必须在保障和改善民生、推进社会治理现代化上走在前列。要加快健全社会保障体系，健全就业促进机制和就业公共服务体系，做好重点群体就业工作。要坚持和发展新时代“枫桥经验”、“浦江经验”，完善社会治理体系，健全城乡基层治理体系和乡村治理协同推进机制，推进社会治理数字化。要推进应急管理体系和能力现代化······\n故做法正确的有①②③④，共4项。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"13319189","cat":"新思想","stem":"习近平总书记指出，中华民族有着五千多年的悠久历史和灿烂文化，而且中华文化从远古一直延续发展到今天，是世界上唯一绵延不断，且以国家形态发展至今的伟大文明，具有突出的连续性。关于中华文化为何具有突出的连续性，下列说法正确的是：\n①强大的文化主体性，夯实了中华文明连续性的内在支撑\n②浩如烟海的文化典籍成为中华文明连续性的天然载体\n③独特又稳定的地理环境，筑牢了中华文明连续性的自然基础\n④中华文化“中和”的文化价值诉求奠定了中华文明连续性的价值底蕴","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n①错误，《中华文明源远流长的连续性》中指出：“厚重的文化积累是中华文明突出连续性的内在支撑。一个文明能够从不断裂、历久弥新，其中决定连续性的深层次原因必与既有的文化密切相关。换言之，同一个国家‘不断裂’状态的维持，一是其国民的人类遗传基因延续不辍，二是其国家文化基因世代传承。”\n②正确，《习近平总书记这样谈中华文明的连续性》中指出：“中华民族创造了浩如烟海的文化典籍，中华文明在这些代代相传的典籍中得以记载和传承，如四书五经等儒家典籍向来是历代儒家学子首要研学之书，从未中断。······在我国出土的大量考古成果充分展示着中华文明起源和发展的历史脉络，从中可见中华文明传承悠久且从未中断。”由此可见，浩如烟海的文化典籍成为中华文明连续性的天然载体。\n③正确，《中华文明源远流长的连续性》中指出：“独特的地理气候是中华文明突出连续性的自然基础。”《连续性：中华文明的首要特性》中指出：“中华文明成为人类历史上唯一一个绵延5000多年至今未曾中断的灿烂文明。而这主要得益于以下三个因素：第一，独特稳定的地理环境。”\n④正确，《连续性：中华文明的首要特性》中指出：“第二，‘中和’的文化价值诉求。中华文明源远流长、博大精深，其中儒家、道家成为中华文明的主流思想······‘中’就是要把握适当的限度，使自己的言行合乎标准。‘中和’所代表的中性智慧强调的是事物双方的相辅相成、共生共存，从而做到不偏不倚、执两用中······总而言之，‘中和’的文化价值诉求成就了‘贵和持中、自强不息’的中华文明，奠定了中华文明源远流长的价值底蕴。”\n故②③④表述正确。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"13319196","cat":"新思想","stem":"习近平总书记指出，全面依法治国是国家治理的一场深刻革命。我们要坚持走中国特色社会主义法治道路、建设中国特色社会主义法治体系、建设社会主义法治国家。关于中国特色社会主义法治道路的核心要义，下列理解正确的是：\n①中国特色社会主义制度是中国特色社会主义法治体系的根本制度基础\n②党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证\n③中国特色社会主义法治理论是法治体系的理论指导，是全面推进依法治国的行动指南\n④弘扬社会主义法治精神、传承中华优秀传统法律文化是社会主义法治建设的首要任务","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"A","explanation":"本题考查理论与政策。\n①②③正确，《习近平新时代中国特色社会主义思想学习纲要》中“八、全面推进依法治国”部分指出：“中国特色社会主义法治道路的核心要义，就是要坚持党的领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论。党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。坚持中国特色社会主义法治道路，最根本的是坚持党的领导。中国特色社会主义制度是中国特色社会主义法治体系的根本制度基础，是全面推进依法治国的根本制度保障。中国特色社会主义法治理论是中国特色社会主义法治体系的理论指导和学理支撑，是全面推进依法治国的行动指南。”\n④错误，《法治中国建设规划（2020－2025年）》中“二、全面贯彻实施宪法，坚定维护宪法尊严和权威”部分指出：“建设法治中国，必须高度重视宪法在治国理政中的重要地位和作用，坚持依宪治国、依宪执政，把全面贯彻实施宪法作为首要任务，健全保证宪法全面实施的体制机制，将宪法实施和监督提高到新水平。”\n故①②③表述正确。\n故正确答案为A。","no":5,"missingImage":false},{"type":"question","qid":"13319195","cat":"时事政治","stem":"习近平总书记在党的二十届三中全会上提出，到2035年，全面建成高水平社会主义市场经济体制，为中国式现代化提供重要保障。下列做法属于构建高水平社会主义市场经济体制举措的是：\n①培育壮大先进制造业集群，推进制造业高端化、智能化、绿色化发展\n②推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通\n③坚持和落实“两个毫不动摇”，促进各种所有制经济优势互补、共同发展\n④依法平等长久保护各种所有制经济产权，建立高效的知识产权综合管理体制","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议审议通过了《中共中央关于进一步全面深化改革、推进中国式现代化的决定》（以下简称《决定》）。\n①错误，《决定》在“三、健全推动经济高质量发展体制机制”部分指出“（9）健全促进实体经济和数字经济深度融合制度。加快推进新型工业化，培育壮大先进制造业集群，推动制造业高端化、智能化、绿色化发展······”故此举措说法无误，但不属于构建高水平社会主义市场经济体制。\n②正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（6）构建全国统一大市场。推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。加强公平竞争审查刚性约束，强化反垄断和反不正当竞争，清理和废除妨碍全国统一市场和公平竞争的各种规定和做法······”\n③正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（5）坚持和落实‘两个毫不动摇’。毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展，保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护，促进各种所有制经济优势互补、共同发展。”\n④正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（7）完善市场经济基础制度。完善产权制度，依法平等长久保护各种所有制经济产权，建立高效的知识产权综合管理体制······”\n综上，②③④正确。\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"13319193","cat":"时事政治","stem":"习近平总书记多次深刻阐释“以人民为中心”的执政理念。党的二十届三中全会将这一执政理念确定为进一步全面深化改革必须遵循的原则，强调坚持以人民为中心，尊重人民主体地位和首创精神，人民有所呼、改革有所应，做到改革为了人民、改革依靠人民、改革成果由人民共享。某市的下列举措符合“以人民为中心”的原则的是：\n①创办共富市集，减免低收入群众和灵活就业收入人员摊位费\n②建立“百姓会客厅”机制，密切联系群众，问计于民、问需于民\n③全国推进公用事业市场化改革提升，提升资源配置效率，减轻财政负担\n④持续完善积分落户制，促进有稳定就业的外来人口有序实现市民化","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n“以人民为中心的发展思想”是习近平总书记于2015年10月26日至29日，党的十八届五中全会提出的治国方针理论。所谓以人民为中心，就是要抓住人民最关心最直接最现实的利益问题，不断保障和改善民生，促进社会公平正义，在更高水平上实现幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶，让发展成果更多更公平惠及全体人民，不断促进人的全面发展，朝着实现全体人民共同富裕不断迈进。\n①正确，“创办共富市集，减免低收入群众和灵活就业收入人员摊位费”能够增加这部分人的收入，有利于共同富裕的实现，是符合“以人民为中心”原则的举措。\n②正确，“建立‘百姓会客厅’机制，密切联系群众，问计于民、问需于民”可以更好地抓住人民最关心最直接最现实的利益问题，以便解决这些问题，是符合“以人民为中心”原则的举措。\n③错误，“全国推进公用事业市场化改革提升，提升资源配置效率，减轻财政负担”更多强调为财政减负，和人民并无直接联系。\n④正确，“持续完善积分落户制，促进有稳定就业的外来人口有序实现市民化”能够更好解决外来人口养老育幼、买房医疗等问题，提高这一群体的幸福感，是符合“以人民为中心”原则的举措。\n综上，①②④正确。\n故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"13319194","cat":"新思想","stem":"习近平总书记强调，就业是最基本的民生，事关人民群众切身利益，事关经济社会健康发展，事关国家长治久安。要实施就业优先战略，促进高质量充分就业。关于促进高质量充分就业，下列表述正确的是：\n①在宏观层面，高质量充分就业主要包括就业机会充分、就业环境公平、就业结构优化、人岗匹配高效、劳动关系和谐等\n②在微观层面，高质量充分就业主要表现为每个公民不仅有活干，而且工作稳定、收入合理、保障可靠、职业安全等\n③高质量充分就业是一个很高的要求，也是一个循序渐进的过程，必须尽力而为、量力而行；必须充分调动人民群众的积极性主动性创造性，引导大家依靠努力奋斗创造幸福生活\n④促进高质量充分就业。要始终坚持就业优先，着力解决结构性就业矛盾，完善重点群体就业支持政策，深化就业体制机制改革，加强劳动者权益保障","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"C","explanation":"本题考查理论与政策。\n2024年11月1日出版的第21期《求是》杂志发表了中共中央总书记、国家主席、中央军委主席习近平的重要文章《促进高质量充分就业》。\n①③正确，②错误，文章指出，党的二十大科学把握就业形势新变化，顺应人民群众新期待，着眼扎实推进高质量发展和全体人民共同富裕，作出了促进高质量充分就业的重大部署。在宏观层面，高质量充分就业主要包括就业机会充分、就业环境公平、就业结构优化、人岗匹配高效、劳动关系和谐等；在微观层面，高质量充分就业主要表现为劳动者不仅有活干，而且工作稳定、收入合理、保障可靠、职业安全等。当然，这是一个很高的要求，也是一个循序渐进的过程，必须尽力而为、量力而行；必须充分调动人民群众的积极性主动性创造性，引导大家依靠努力奋斗创造幸福生活，不能不劳而获、坐享其成。\n④正确，文章指出，促进高质量充分就业，是新时代新征程就业工作的新定位、新使命·····这里，我着重强调5点。第一，始终坚持就业优先······第二，着力解决结构性就业矛盾······第三，完善重点群体就业支持政策······第四，深化就业体制机制改革······第五，加强劳动者权益保障······\n综上，①③④表述正确。\n故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"13319197","cat":"新思想","stem":"习近平总书记对江苏生态文明建设念兹在兹，反复叮嘱江苏要“把保护生态环境摆在更加突出的位置”“走出一条生态优先、绿色发展的新路子”。为贯彻落实总书记的重要指示精神，江苏全面加快推进美丽江苏建设，推动实现人与自然和谐共生的现代化。关于全面推进美丽江苏建设的举措，下列说法正确的是：\n①加强苏北海岸带的国土空间管控，一律不得新增围海和填海\n②建设黄河故道千里生态富民廊道，构建江淮生态经济区湖群绿心\n③推动江河湖海各展所长，统筹推进长江和大运河国家文化公园建设\n④增强省域森林、湿地、土壤、海洋等生态系统固碳作用，支持里下河地区提升生态系统碳汇能力","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n①错误，《国务院关于&lt;江苏省国土空间规划（2021—2035年）&gt;的批复》在“二、筑牢安全发展的空间基础”部分指出：“······除国家重大项目外，全面禁止围填海；严格无居民海岛管理。”\n②③正确，《中共江苏省委江苏省人民政府关于全面推进美丽江苏建设的实施意见》在“四、打造美丽江苏建设示范样板”部分“（十二）塑造‘水韵江苏’品牌”中指出：“以水为脉，推动江河湖海各展所长，统筹推进长江和大运河国家文化公园建设，着力打造太湖全国湖泊治理标杆，构筑蓝湾百里生态百里缤纷百里沿海岸线，建设黄河故道千里生态富民廊道，构建江淮生态经济区湖群绿心，彰显各具特色、各现其美的‘水韵江苏’风采。”\n④正确，《中共江苏省委江苏省人民政府关于全面推进美丽江苏建设的实施意见》在“二、加快发展方式绿色低碳转型”部分“（二）积极稳妥推进碳达峰碳中和”中指出：“落实碳达峰碳中和‘1+N’政策体系，推动能耗双控逐步转向碳排放双控······增强省域森林、湿地、土壤、海洋等生态系统固碳作用，支持里下河地区提升生态系统碳汇能力。深入推进减污降碳协同创新。”\n故②③④说法正确。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"13319199","cat":"新思想","stem":"2018年11月5日，习近平总书记宣布，长三角一体化发展上升为国家战略，六年来，长三角区域深入贯彻总书记重要指示精神，紧扣一体化和高质量两个关键词，推进各项任务落实落地，不断推动蓝图规划变为现实画卷。关于长三角一体化发展取得的成就，下列表述正确的是：\n①民生基础建设共建共享，设施联通愈加发达，轨道上的长三角再上新台阶\n②产业发展日益密切、科技协同不断加快、生态环境持续改善、民生服务更有温度\n③运用“千万工程”经验，统筹抓好良田、良种、良机、良法集成推广，粮食生产实现“三增”\n④整体实力和综合竞争力持续位居全国前列，成为我国参与国际竞争合作重要平台","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n①正确，2024年12月4日，长三角区域合作办公室在上海举行新闻发布会。发布会指出，聚焦一体化发展制度保障，加快完善一体化发展体制机制。长三角公共服务便利共享有序推进，累计已有170余项高频政务服务和应用实现跨省“一网通办”，长三角率先在全国试点的跨省异地就医门诊费用直接结算至2024年10月底已累计超4600万人次，减少群众垫付超70亿元。基础设施互联互通水平持续提升，长三角高铁营业里程超7600公里，新能源汽车年度新建公共充电桩超12万个，车桩比达1.55。长三角生态绿色一体化发展示范区建设深入推进，2024年新推出18项制度创新成果。\n②正确，长三角这片土地已成为中国经济发展最活跃、开放程度最高、创新能力最强、市场容量最大的区域之一。产业发展日趋密切、科技协同不断加快、生态环境持续改善、民生服务更有温度、设施联通愈加通达。\n③错误，2024年江苏省《政府工作报告》在“一、2023年工作回顾”部分“（三）统筹城乡区域协调发展”中指出：“出台全国首部省级国土空间规划······出台高水平建设农业强省行动方案，制定学习运用‘千万工程’经验加快建设新时代鱼米之乡的政策措施。统筹抓好良田良种良机良法集成推广，新建高标准农田120万亩、改造提升207万亩，改造大中型灌区34处，粮食生产面积、单产、总产实现‘三增’······”这是江苏省在城乡区域协调发展部分取得的成就，而非长三角一体化发展取得的成就。\n④正确，2023年11月30日，习近平总书记在上海主持召开深入推进长三角一体化发展座谈会并发表重要讲话。习近平总书记指出，长三角一体化发展战略提出并实施5年来······长三角区域整体实力和综合竞争力持续位居全国前列，彰显中国特色社会主义制度优越性的重要窗口和我国参与国际竞争合作的重要平台的作用日益显现，为构建新发展格局、推进高水平对外开放赢得了战略主动。\n故①②④表述正确。\n故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"13319206","cat":"新思想","stem":"新中国成立75年以来，中国共产党团结带领全国各族人民勠力同心、砥砺奋进，经济实力实现了跨越式发展，深刻改变了世界发展格局。关于新中国成立75年来的经济发展成就，下列表述正确的是：\n①经济总量跃居世界第二位\n②连续十四年保持了世界第一制造业大国地位\n③谷物产量跃居世界第二位\n④改革开放以来成为世界经济增长的重要引擎","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查经济常识。\n2024年9月，国家统计局发布新中国75年经济社会发展成就系列报告（以下简称报告）。\n①正确，报告在“一、从积贫积弱到世界第二大经济体，经济实力、综合国力和国际影响力实现历史性跨越”部分的“（一）国民经济快速增长，经济实力空前跃升”中指出：“······经济总量连续跨越重要关口······2023年超过126万亿元，稳居世界第二大经济体······”\n②正确，报告在“二、从瓶颈制约到优势支撑，基础产业和基础设施空前加强”部分的“（一）工农业生产能力突飞猛进，主要产品产量全球第一”中指出：“······制造业增加值连续14年位居世界第一，占世界份额30%左右，成为驱动全球制造业发展的重要引擎······”\n③错误，报告在“二、从瓶颈制约到优势支撑，基础产业和基础设施空前加强”部分的“（一）工农业生产能力突飞猛进，主要产品产量全球第一”中指出：“······粮食总产量由1949年的2264亿斤增加到2023年的13908亿斤，增长5.1倍；谷物、肉类、花生、茶叶、水果等农产品产量居全球首位······”\n④正确，报告在“一、从积贫积弱到世界第二大经济体，经济实力、综合国力和国际影响力实现历史性跨越”部分的“（三）综合国力跃居世界前列，国际影响力日益彰显”中指出：“新中国成立初期，我国经济总量占世界比重很小，至1978年也仅为1.7%，居世界第10位。改革开放以来，我国经济持续快速增长，成为世界经济增长的重要引擎和稳定力量······”\n故表述正确的是①②④。\n故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"13319213","cat":"新思想","stem":"2024年是我国人民代表大会制度建立70周年。人民代表大会制度是中国共产党领导中国人民艰辛探索长期奋斗的成果，是从中国土壤中生长起来的全新政治制度，是人类政治制度史上的伟大创造。关于人民代表大会制度发展历程中的重大事件，下列表述准确的有：\n①抗日根据地政权建设实行的“三三制”是人民代表大会制度形成和发展的历史起点\n②《中国人民政治协商会议共同纲领》对新中国实行人民代表大会制度作出了明确安排\n③一届全国人大一次会议通过《中华人民共和国宪法》，标志着人民代表大会制度的建立\n④五届全国人大二次会议通过修宪决议和地方组织法，规定县级以上地方各级人大设立常委会","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查毛中特。\n①错误，1931年11月，中华苏维埃第一次全国代表大会在江西瑞金召开。大会制定了《中华苏维埃共和国宪法大纲》，宣告中华苏维埃共和国临时中央政府成立。1934年1月，中华苏维埃第二次全国代表大会召开。这两次大会是工农兵代表大会制度政体的演练，是中国共产党领导人民开展政权建设的开端，也是人民代表大会制度形成和发展的历史起点。\n②正确，1949年9月29日，中国人民政治协商会议第一届全体会议通过的具有临时宪法作用的《中国人民政治协商会议共同纲领》，确立了新中国的国家政权制度，包括国体和政体，明确提出在我国实行人民代表大会制度，奠定了新中国初期国家根本政治制度的法律基础。\n③正确，1954年9月15日至28日，第一届全国人民代表大会第一次会议在北京中南海举行会议通过的《中华人民共和国宪法》，是在共同纲领基础上的进一步发展，对人民代表大会制度这一国家根本政治制度作出了系统全面的规定，这标志着人民代表大会制度建立。\n④正确，1979年，五届全国人大二次会议通过修宪决议和地方组织法，规定县级以上地方各级人大设立常委会，将地方各级革命委员会改为人民政府，这是新时期完善人民代表大会制度、加强地方政权建设的重大举措。\n故表述准确的有②③④。\n故正确答案为D。","no":12,"missingImage":false}],"count":12,"answerable":12,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"13319212","cat":"人文常识","stem":"2024年2月，经推荐遴选，中央组织部、中央宣传部确定20名“最美公务员”，他们从乡村振兴一线到驻外前线，从乡镇街道到产业园区，在强国建设、民族复兴新征程上作表率，他们坚定拥护“两个确立”，坚持做到“两个维护”，在重大任务、重大斗争中担苦担难担重担险，在日常工作中恪尽职守，善作善成，以实际行动彰显出新时代人民公仆本色。这一新时代人民公仆本色所体现的公务员职业道德是：","options":{"A":"信仰坚定，担当作为，竭诚为民，无私奉献","B":"爱国敬业，遵纪守法，创业创新，服务社会","C":"胸怀祖国，追求真理，淡泊名利，勇攀高峰","D":"执着专注，精益求精，一丝不苟，追求卓越"},"answer":"A","explanation":"本题考查毛中特。\nA项正确，信仰坚定要求公务员坚定对马克思主义的信仰，坚定对社会主义和共产主义的信念，坚持中国共产党的领导，最美公务员“坚定拥护‘两个确立’，坚持做到‘两个维护’”即体现了这一点；担当作为要求公务员兢兢业业做好本职工作，同时坚持原则、敢于担当、认真负责，面对矛盾敢于迎难而上，面对危机敢于挺身而出，最美公务员“在重大任务、重大斗争中担苦担难担重担险，在日常工作中恪尽职守，善作善成”即体现了这一点；竭诚为民，无私奉献要求公务员坚持以人为本、执政为民，全心全意为人民服务，永做人民公仆，最美公务员们大多来自基层“从乡村振兴一线到驻外前线，从乡镇街道到产业园区”，身处与民生联系最紧密、对民情民意最了解的基层一线，他们自觉将为人民服务的理念融入到工作实践中，“以实际行动彰显出新时代人民公仆本色”即体现了这一点。\nB项错误，“爱国敬业，遵纪守法，创业创新，服务社会”属于企业家精神的内容。\nC项错误，“胸怀祖国，追求真理，淡泊名利，勇攀高峰”属于科学家精神的内容。\nD项错误，“执着专注，精益求精，一丝不苟，追求卓越”属于工匠精神的内容。\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"13319219","cat":"地理国情","stem":"都江堰主要由鱼嘴、飞沙堰、宝瓶口三大主体工程和一百二十多项辅助工程构成，科学地解决了江水自动分流、自动排沙、控制进水流量等问题，消除了水患，使川西平原成为“水旱从人”的“天府之国”，都江堰水利工程蕴含的哲理是：","options":{"A":"矛盾是事物变化发展的根本原因","B":"事物往往是作为系统存在、变化的","C":"事物总是作为过程存在、发展的","D":"一切事物都是运动、变化和发展的"},"answer":"B","explanation":"本题考查马克思主义。\nA项错误，唯物辩证法认为，事物的内部矛盾（即内因）是事物自身运动的源泉和动力，是事物发展的根本原因。选项本身表述不够准确，且题干并未体现这一原理。\nB项正确，唯物辩证法认为，系统就是由事物诸要素或组成部分相互联系和相互依赖而构成的有机整体，事物往往是作为系统而存在变化的。鱼嘴、飞沙堰、宝瓶口三大主体工程和一百二十多项辅助工程构成了都江堰工程系统，这个系统科学地解决了问题、消除了水患，即体现了这一点。\nC项错误，唯物辩证法的发展观认为，过程是指一切事物都有其产生、发展和转化为其他事物的历史，都有它的过去、现在和未来，是事物发展在时间上的持续和在时空上的延伸。一切事物都是作为过程而存在、作为过程而发展的。题干并未直接体现这一原理。\nD项错误，唯物辩证法的发展观认为，无论是自然界、人类社会还是人的思维都是在不断地运动、变化和发展的，事物的发展具有普遍性和客观性。题干并未直接体现这一原理。\n故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"13319220","cat":"人文常识","stem":"加强预期管理，有效引导、协调和稳定社会预期，可以实现政策效果最大化，确保政策实施达到预期效果。关于预期管理，下列说法正确的是：","options":{"A":"预期管理要求必须遵守底线思维和利益原则","B":"通过预期管理可以降低股票市场的交易风险","C":"编制中长期发展规划是预期管理的有益实践","D":"政府运用预期管理定期调整成品油零售价格"},"answer":"C","explanation":"本题考查管理常识。\n预期管理是宏观经济治理的重要内容，指政府部门通过政策解读、信息公开、新闻发布等方式，加强与公众的信息沟通，有效引导、协调和稳定社会预期，使政策在某种程度上可被预见和理解，以实现政策效果最大化，确保政策的实施能够达到预期效果。预期管理对于稳定市场、提高政策效果具有重要意义，通过有效的预期管理，可以引导市场参与者的行为，减少市场波动，提高政策的执行效率和效果。\nA项错误，预期管理指政府部门通过政策解读、信息公开、新闻发布等方式，加强与公众的信息沟通，有效引导、协调和稳定社会预期，因此要遵守沟通原则。\nB项错误，预期管理对于稳定市场、提高政策效果具有重要意义，通过有效的预期管理，可以引导市场参与者的行为，减少市场波动，提高政策的执行效率和效果。股票市场的交易风险包括外部客观因素所带来的风险，也包括由投资者本人的主观因素所造成的风险。因此单靠预期管理不能降低股票市场的交易风险。\nC项正确，从时间维度来看，我国的预期管理不仅有应对短期宏观稳定的预期管理，也有中长期发展规划，甚至还有“两个一百年”奋斗目标。同时，通过五年规划、年度政府工作报告等制度性安排形成了前瞻性指引，这些都会起到锚定预期的作用。\nD项错误，我国成品油零售价格是根据近期国际市场油价变化情况，按照现行成品油价格形成机制确定的，并不是政府运用预期管理定期调整。\n故正确答案为C。","no":15,"missingImage":false},{"type":"question","qid":"13319222","cat":"法律常识","stem":"“一个案例胜过一沓文件”，最高人民法院建设人民法院案例库，筛选具有典型意义的参考案例并收录入库。这一做法所发挥的效能是：\n①强化司法权威\n②提升法官的司法能力\n③优化司法公开\n④促进法律适用的统一","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查法律常识。\n2024年2月27日，最高人民法院举行人民法院案例库建设工作新闻发布会指出：“建设人民法院案例库，具有多方面的重要作用和意义：第一，建设人民法院案例库是促进法律正确、统一适用的重要举措。第二，建设人民法院案例库是深化诉源治理的重要抓手。第三，建设人民法院案例库是深化优化司法公开的重要载体。第四，建设人民法院案例库是提升法官司法能力的有效途径。”\n故表述正确的是②③④。\n故正确答案为D。","no":16,"missingImage":false},{"type":"question","qid":"13319223","cat":"法律常识","stem":"M公司在网络购物平台销售一款智能门锁，宣称该门锁具有“生成临时密码”功能，韩某购买安装该款门锁后，发现并不具备所宣称的功能，该公司回复说需要额外付费升级系统后才能安装该功能。对此，下列说法不正确的是：","options":{"A":"M公司对产品的不实宣传构成欺诈","B":"M公司与韩某之间的买卖合同无效","C":"韩某有权向M公司主张惩罚性赔偿","D":"韩某有权请求M公司承担违约责任"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，一方当事人故意告知对方虚假情况，或者故意隐瞒真实情况，诱使对方当事人作出错误意思表示的，可以认定为欺诈行为。题中，M公司宣称其销售的门锁具有“生成临时密码”功能，但韩某购买安装后发现并不具备所宣称的功能，因此，M公司对产品的不实宣传构成欺诈。\nB项错误，根据《中华人民共和国民法典》第一百四十八条规定：“一方以欺诈手段，使对方在违背真实意思的情况下实施的民事法律行为，受欺诈方有权请求人民法院或者仲裁机构予以撤销。”因此，M公司与韩某之间的买卖合同并不是无效的，而是可撤销的。\nC项正确，根据《中华人民共和国消费者权益保护法》第五十五条第一款规定：“经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金额不足五百元的，为五百元。法律另有规定的，依照其规定。”因此，韩某有权向M公司主张惩罚性赔偿。\nD项正确，根据《中华人民共和国民法典》第一百八十六条规定：“因当事人一方的违约行为，损害对方人身权益、财产权益的，受损害方有权选择请求其承担违约责任或者侵权责任。”违约行为，是指当事人一方不履行合同义务或履行合同义务不符合约定条件的行为。题中，韩某购买安装的M公司销售的智能门锁，并不具备约定的“生成临时密码”功能，M公司的行为构成违约，因此，韩某有权请求M公司承担违约责任。\n本题为选非题，故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"13319225","cat":"人文常识","stem":"某自助餐厅顾客浪费严重，遂规定凡浪费食物者加收清理费10元，结果生意一落千丈；后改变策略，将价格提高10元，并规定对未浪费食物者奖励10元，结果生意火爆且杜绝了浪费行为。该自助餐厅的做法与下列传统故事具有相同思维方式的是：","options":{"A":"司马光砸缸","B":"孔融让梨","C":"杯酒释兵权","D":"卧薪尝胆"},"answer":"A","explanation":"本题考查管理常识。\n逆向思维，就是从相反的角度来思考问题。它强调打破常规，从不同的角度来看待事物，从而找到更好的解决方案。在该自助餐厅的故事中，逆向思维的应用体现在对问题的解决方法上。餐厅尝试从相反的角度来看待浪费食物的问题。他们没有对浪费食物的顾客进行惩罚，而是对没有浪费食物的顾客进行奖励。\nA项正确，通常孩子掉入缸中，人的常规思维都是救孩子，而司马光选择砸缸的方式。这个故事告诉我们面对问题，要打破常规，寻找解决方法，体现了逆向思维。\nB项错误，孔融让梨是中国千百年来流传的一个道德教育故事，它告诉我们，做人应该懂得谦让，只有善待他人、学会礼让，才能够树立起良好的道德情操。并没有体现逆向思维。\nC项错误，杯酒释兵权是指宋初宋太祖赵匡胤通过酒宴威逼利诱高阶军官交出兵权的一次政治事件。赵匡胤使用和平手段解除了大臣的军权，成功防止了军队的政变，这是历史上有名的安内方略，体现的是军事智慧。并没有体现逆向思维。\nD项错误，卧薪尝胆指越王勾践战败后以柴草卧铺，并经常舔尝苦胆，以时时警惕自己不忘所受苦难的故事，后形容人刻苦自励，发奋图强。并没有体现逆向思维。\n故正确答案为A。","no":18,"missingImage":false},{"type":"question","qid":"13319226","cat":"人文常识","stem":"《四库全书》收录的一份古代公文有如下内容：“自古人臣事君，必令民生疾苦具以上闻，劝善惩恶，屏绝私党，以爱民弭盗、革除恶习、敦厚风俗为务。前张伯行奏，称务期家给人足，仰报君恩。今未及一年而遽云家给人足，毋乃文饰太过乎？”如果按照现代公文的行文方向判断，下列与该公文行文方向一致的是：","options":{"A":"通知","B":"请示","C":"议案","D":"报告"},"answer":"A","explanation":"本题考查公文写作与处理。\n题干公文出自《四库全书》中的《清实录》，为清圣祖皇帝回复江苏巡抚张伯行奏疏的内容，故行文方向为下行文。\nA项正确，根据《党政机关公文处理条例》第八条第（八）项规定：“公文种类主要有：（八）通知。适用于发布、传达要求下级机关执行和有关单位周知或者执行的事项，批转、转发公文。”故为下行文。\nB项错误，根据《党政机关公文处理条例》第八条第（十一）项规定：“公文种类主要有：（十一）请示。适用于向上级机关请求指示、批准。”故为上行文。\nC项错误，根据《党政机关公文处理条例》第八条第（十三）项规定：“公文种类主要有：（十三）议案。适用于各级人民政府按照法律程序向同级人民代表大会或者人民代表大会常务委员会提请审议事项。”故为平行文。\nD项错误，根据《党政机关公文处理条例》第八条第（十）项规定：“公文种类主要有：（十）报告。适用于向上级机关汇报工作、反映情况，回复上级机关的询问。”故为上行文。\n故正确答案为A。","no":19,"missingImage":false},{"type":"question","qid":"13319234","cat":"科技常识","stem":"当人们乘坐列车进藏时，会在青藏铁路旁发现一个特别的景象，路基两旁时不时会闪过一排排金属管，这些金属管插入地底，露出地面的部分高达两米（如图所示）。关于这些金属管的作用，下列说法正确的是：\n\u003cimg data-k=\"fa5e96f09f0d\" style=\"max-width:600px\">","options":{"A":"收集传导气象信息","B":"实时监控路基安全","C":"阻挡动物横穿铁路","D":"保护冻土层的结构"},"answer":"D","explanation":"本题考查地理国情。\nD项正确，A、B、C三项错误，青藏高原由于海拔高气温低，冻土层分布广泛。随着温度的变化，土体会产生多次冻融和冻胀，这样的过程容易造成土层结构破坏、地基承载力降低、边坡失稳等问题。为了减少温度上升冻土融化下沉造成的路基下沉，需要在路基沿线架设热棒。热棒是一种高约4米、内部中空、外部有散热片的金属柱子，其根部有很多空心管通入路基之中，当路基受热有水汽出现，这些水汽就会顺着空心管道上升至热棒中。高原地区的气温低、风力大，寒冷的风吹过热棒的散热片后，把热量带走，水汽就此也降温凝结。故这些金属管的作用为保护冻土层的结构。\n故正确答案为D。","no":20,"missingImage":false}],"count":8,"answerable":8,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        大地的深处，一粒粒种子正悄然从土壤中苏醒。它们曾在土壤的怀抱中沉睡，身上\u003cu>        \u003c/u>着生命的力量。在被称为“种子诺亚方舟”的国家作物种质库里，借助科技的力量，无数跨越时空的种子在此“\u003cu>        \u003c/u>”。\u003c/p>\u003cp>        国家作物种质库有几个特点：第一是容量大——拥有150万份的总容量，是目前全球最大的国家级农作物种质资源库；第二是保存方式体系化，它囊括了现在所有植物种质资源保存的技术条件，包括低温种子保存、试管苗保存、超低温保存和DNA保存；第三是实现了自动化信息化管理。\u003c/p>\u003cp>        农稳社稷，种子为基。作物种质资源是支撑粮食丰收的一个重要基础——正如国家作物种质库的设计理念“承接上苍之甘露，孕育万物之繁衍”。因此，种质资源库的使命就是长久、安全地保存好这些种质资源，为农业发展提供支撑。\u003c/p>\u003cp>        种质资源最主要的保存方式是低温种子保存，国家作物种质库采用\u003cimg data-k=\"d3282721e766\">低温和45%以下相对湿度保存种子。全球约有90%的种质资源是以种子形式保存的。种质资源保存的方式还有超低温。超低温保存需要用到的工具是液氮罐，国家作物种质库的一个液氮罐大概能够保存1万份种质资源。\u003c/p>\u003cp>        像香蕉这些没有种子的作物，通常是把一棵一棵的植株种到种质资源圃里保存，这是无性繁殖作物种质资源非常重要的一种保存方式。但是植株在露天环境中，会面临自然灾害以及病虫害威胁。为了应对这个情况，在种质资源圃保存的基础上，配套超低温保存，把植株的一些关键组织取下来，经过一系列处理后，放到\u003cimg data-k=\"2a5a2efa92e7\">的液氮里去，这样就能够永久保存下来。\u003c/p>\u003cp>        芒果等热带水果也需要液氮保存。虽然芒果有种子，但很多芒果果核很大，不能忍耐脱水、不能耐受低温，所以一般也不能放在低温种子库保存，就需要把芒果种子的胚，即生长点取下来，经过一系列处理之后放到液氮里保存。\u003c/p>\u003cp>        种质资源还可以采用试管苗保存。把植株的茎尖等生长点取下来，放在瓶子里——瓶子下面有看上去像果冻一样的培养基，它能提供营养让茎尖在上面慢慢生长。超低温和试管苗，主要都是用来保存无性繁殖作物和一些多年生的作物。如果作物方便转化成试管苗，那么就会用这种方式来保存。如果不太方便转化成试管苗，作物就先在液氮罐里进行超低温保存。\u003c/p>\u003cp>        试管苗方式保存的种质资源处在活跃的生长状态。试管苗属于真正的“温室里的花朵”，但是如果需要的话，把它们从瓶子里拿出来以后，再经过一些“锻炼”，就可以迅速恢复生产。种子在瓶子里是在不断生长的，因此也会不断消耗，当培养基的营养用完之后，或苗子长“老”了之后，就需要把它的生长点再拿下来，换一个瓶子，让它的生命周而复始无限循环下去。\u003c/p>\u003cp>        每一粒种子都承载着生命的希望，从一粒小小的种子到丰收的田野，这是一场科技与自然的默契合作。国家作物种质库不仅是种子的守护者，更是未来农业发展的基石。这些看似平凡的种子，正汇聚成中华民族的繁荣根基，支撑着农业强国的梦想。\u003c/p>","questions":[{"qid":"13319302","cat":"逻辑填空","stem":"依次填入文中画横线部分最恰当的一项是：","options":{"A":"积蓄 安家","B":"蕴藏 休憩","C":"涵养 冬眠","D":"勃发 修炼"},"answer":"A","explanation":"本题可从第二空入手。根据“种子诺亚方舟”可知，横线处应体现国家作物种质库像诺亚方舟一样，将无数跨越时空的种子安置起来，使其存活下来。A项“安家”指安置家庭，置于此处能够生动形象地体现出种子在种质库中存活的状态，符合文意，保留。B项“休憩”指休息，C项“冬眠”指某些动物在寒冷的冬季休眠，D项“修炼”指道家修养练功、炼丹等活动，均与文意不符，排除。\n第一空，代入验证。横线处应体现种子与“生命的力量”之间的关系，且根据“一粒粒种子正悄然从土壤中苏醒”可知，横线处应体现种子具有了生命的力量。A项“积蓄”指积聚、储存，符合文意，当选。\n故正确答案为A。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":21,"missingImage":false},{"qid":"13319303","cat":"片段阅读","stem":"关于“超低温保存”种质资源，下列表述与文意相符的是：","options":{"A":"未必都需要使用液氮罐保存作物的种子","B":"大都需要与种质资源圃保存法配套使用","C":"可有效减少自然灾害对种质资源的影响","D":"可以直接保存芒果这类热带水果的种子"},"answer":"C","explanation":"A项：根据第四段“超低温保存需要用到的工具是液氮罐”可知，选项表述与文意相悖，排除。\nB项：根据第五段“但是植株在露天环境中，会面临自然灾害以及病虫害威胁。为了应对这个情况，在种质资源圃保存的基础上，配套超低温保存······这样就能够永久保存下来”可知，种质资源圃保存法与超低温保存法配套使用效果会更好，但并未提及大都需要配套使用，无中生有，排除。\nC项：根据第五段“但是植株在露天环境中，会面临自然灾害以及病虫害威胁。为了应对这个情况，在种质资源圃保存的基础上，配套超低温保存······这样就能够永久保存下来”可知，选项表述正确，当选。\nD项：根据第六段“虽然芒果有种子，但很多芒果果核很大，不能忍耐脱水、不能耐受低温，所以一般也不能放在低温种子库保存，就需要把芒果种子的胚，即生长点取下来，经过一系列处理之后放到液氮里保存”可知，选项表述与文意相悖，排除。\n故正确答案为C。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":22,"missingImage":false},{"qid":"13319305","cat":"片段阅读","stem":"根据文意推断，在国家作物种质库里，玉米最可能采用的保存方式是：","options":{"A":"低温种子保存","B":"试管苗保存","C":"超低温保存","D":"种质资源圃保存"},"answer":"A","explanation":"A项：根据第四段“种质资源最主要的保存方式是低温种子保存，国家作物种质库采用\u003cimg data-k=\"d3282721e766\">低温和45%以下相对湿度保存种子。全球约有90%的种质资源是以种子形式保存的”可知，玉米作为有种子的作物，最有可能采用低温种子保存的方式，当选。\nB、C两项：根据第七段“超低温和试管苗，主要都是用来保存无性繁殖作物和一些多年生的作物”可知，玉米并非无性繁殖或多年生作物，通常不会通过试管苗、超低温的方式保存，均排除。\nD项：根据第五段“像香蕉这些没有种子的作物，通常是把一棵一棵的植株种到种质资源圃里保存，这是无性繁殖作物种质资源非常重要的一种保存方式”可知，玉米为有种子的作物，通常不会通过种质资源圃方式保存，排除。\n故正确答案为A。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":23,"missingImage":false},{"qid":"13319306","cat":"片段阅读","stem":"作者在介绍国家作物种质库诸多特点时，重点说明的是：","options":{"A":"容量大且独一无二","B":"保存方式齐备完善","C":"管理方式精准智能","D":"设计理念别具匠心"},"answer":"B","explanation":"文章第二段总体介绍了国家作物种质库“容量大”“保存方式体系化”“实现了自动化信息化管理”这三个特点，但文章第四至八段分别详细介绍了低温种子保存、种质资源圃保存、超低温保存、试管苗保存等多种保存方式及其适用情况等内容，故作者在介绍国家作物种质库诸多特点时，重点说明的是其保存方式多样化、体系化，对应B项。\nA、C、D三项：A项“容量大”、C项“管理方式”、D项“设计理念”均只是简单提及，并未展开重点说明，排除。\n故正确答案为B。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":24,"missingImage":false},{"qid":"13319307","cat":"片段阅读","stem":"下列最适合做这篇文章标题的是：","options":{"A":"作物种质库里的未来农业","B":"平凡的种子，不平凡的“家”","C":"国家作物种质库：生命的起点","D":"“种子诺亚方舟”守护农业火种"},"answer":"D","explanation":"文章第一段引出“种子诺亚方舟”的话题，即国家作物种质库的概念，第二段介绍了国家作物种质库的三个特点，第三段介绍了作物种质资源的重要作用及种质资源库的使命，第四至八段详细介绍了种质资源的保存方式，第九段总结全文，再次指出种子和国家作物种质库的重要意义，即国家作物种质库不仅是种子的守护者，更是未来农业发展的基石。故文章主要围绕“种子诺亚方舟”即国家作物种质库展开，强调其对保护种子、支撑我国成为农业强国的重要性，D项契合文章中心，且表述生动形象，当选。\nA项：文章强调的是国家作物种质库对保护种子、支撑我国成为农业强国的重要性，而非单纯阐述“作物种质库”与“未来农业”的关系，偏离文章中心，排除。\nB项：“不平凡的‘家’”表述不明确，没有突出国家作物种质库对保护种子、支撑我国成为农业强国的重要性，排除。\nC项：“生命的起点”概念范围扩大，文章仅强调“保护种子”，偏离文章中心，排除。\n故正确答案为D。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":25,"missingImage":false},{"qid":"13319266","cat":"片段阅读","stem":"在江苏，自动驾驶已成为创新技术重塑物流运输产业的重要载体。搭载多类型传感器的智慧重型卡车，一旦切换到智能辅助驾驶状态，驾驶员就变身为安全员，只需坐在车上监管，智慧重型卡车会根据实时路况减速、避让或变道。除了智慧重型卡车，应用于港口的自动驾驶集装箱卡车也已完成技术验证的初始阶段，驶入了大规模商业应用的快车道。行驶在物流园区与制造业企业之间的自动驾驶物流车，则在智驾系统助力下，实现了物流业与制造业的深度融合。\n这段文字重在说明：","options":{"A":"自动驾驶在江苏的应用场景已经越来越广阔","B":"物流车应用智能技术使得驾驶员获得了解放","C":"自动驾驶促进了江苏物流运输业的发展升级","D":"物流车因智能技术的加持应用范围不断扩大"},"answer":"C","explanation":"文段开篇指出自动驾驶成为江苏地区创新技术重塑物流运输产业的重要载体，接着通过智慧重型卡车、自动驾驶集装箱卡车、自动驾驶物流车的例子，对前文进行举例论证，具体说明自动驾驶在江苏物流运输领域的应用和积极影响。故文段重点强调自动驾驶促进江苏地区重塑物流运输产业，对应C项。\nA项：“应用场景已经越来越广阔”表述不明确，文段强调自动驾驶在江苏物流运输业的应用，排除。\nB项：“驾驶员获得了解放”对应举例论证的部分内容，非重点，排除。\nD项：“智能技术”范围扩大，文段的主题词为“自动驾驶”，排除。\n故正确答案为C。\n【文段出处】人民日报《自动驾驶，让货运更智慧》","no":26,"missingImage":false},{"qid":"13319272","cat":"片段阅读","stem":"口口相传的经验是讲故事的人的灵感来源。在劳动的氛围中讲故事，是一种交流方式。每一个讲故事的人都会在故事中留下自己的痕迹，就像制陶人会在陶器上留下自己的印记一样。人在放松的状态下听故事，内心会想记下这些故事，并有对他人转述故事的愿望，这就构成了听故事的人与讲故事的人之间的关系。讲故事的人就像智者一样，能讲出自己的人生经验，也能讲出他人的经验、历史的经验，他们能让故事的火把生活的灯芯点燃。\n这段文字中“在故事中留下自己的痕迹”的含义最有可能是：","options":{"A":"每个故事都会被讲故事的人加入一些自身经历","B":"讲故事的人会结合个人阅历对故事进行再加工","C":"讲故事的人会向听故事的人讲自己的人生经验","D":"每个故事在被多个人讲述之后内容会发生变化"},"answer":"B","explanation":"文段开篇表明讲故事的人的灵感源于口口相传的经验，接着指出讲故事的人会在故事中留下自己的痕迹，并用制陶人做类比，强调讲故事的人会在故事中留下属于自己的印记，然后从听故事的人的角度，阐述听故事的人与讲故事的人之间的互动关系，最后把讲故事的人比作智者，强调他们既能讲出自己的人生经验，也能传达他人的经验和历史的经验，进一步说明讲故事的人会在故事中留下属于自己的独特印记。故“在故事中留下自己的痕迹”指的是讲故事的人会在故事中加入自己的人生经验，或者自己对他人经验、历史经验的理解，对应B项。\nA、D两项：“每个故事”主体错误，文段中“留下自己的痕迹”的主体应该是“讲故事的人”，均排除。\nC项：“讲自己的人生经验”表述片面，文段提到讲故事的人还能讲他人的经验和历史的经验，排除。\n故正确答案为B。\n【文段出处】网易《火与灯芯》","no":27,"missingImage":false},{"qid":"13319269","cat":"片段阅读","stem":"司法建议最初源于行政诉讼。近年来，司法建议的适用范围不断拓展，从保障法院裁判执行措施，进阶升级为社会矛盾纠纷的预防性机制。司法建议既是对传统“治未病”理念的继承，也是对新时代“枫桥经验”的一项创新性实践。通过司法建议，对案件审理过程中发现的可能影响社会和谐的隐患或因素提出建议，以预防纠纷再次发生。有效的司法建议不仅能预先准确找出矛盾纠纷产生的原因，还能进一步提升法院的权威，彰显司法的人文关怀。\n下列关于司法建议的说法，与文意不符的是：","options":{"A":"适用范围正在逐步地扩大","B":"不会弱化司法机关的权威","C":"可有效避免社会矛盾产生","D":"是一种更柔性的治理方式"},"answer":"C","explanation":"A项：根据“近年来，司法建议的适用范围不断拓展”可知，该项表述正确，排除。\nB项：根据“有效的司法建议不仅能预先准确找出矛盾纠纷产生的原因，还能进一步提升法院的权威”可知，该项表述正确，排除。\nC项：根据“近年来，司法建议的适用范围不断拓展，从保障法院裁判执行措施，进阶升级为社会矛盾纠纷的预防性机制”“通过司法建议，对案件审理过程中发现的可能影响社会和谐的隐患或因素提出建议，以预防纠纷再次发生”可知，司法建议目前只能起到“预防社会矛盾纠纷”“预防纠纷再次发生”的作用，“有效避免社会矛盾产生”表述过于绝对，当选。\nD项：根据“有效的司法建议不仅能······还能······彰显司法的人文关怀”可知，该项表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明日报《司法建议：为柔性治理提供一副“良方”》","no":28,"missingImage":false},{"qid":"13319281","cat":"片段阅读","stem":"有关数据显示：2024年1—7月，高端装备制造业销售收入同比增长8.3%，占制造业总销售收入的比重为16.5%，较上年同期提高0.5个百分点；智能设备制造业销售收入同比增长12.4%；高耗能制造业销售收入占制造业比重为30.7%，较上年同期下降0.8个百分点，节能降耗工作有序推进；制造业企业采购环境治理服务金额同比增长6.2%，增速较2023年加快2.4个百分点，治污投入不断加大。\n这段文字重在说明：","options":{"A":"制造业持续不断在国民经济发展中起领跑作用","B":"经济发展亮点频现呈现出持续向好的发展态势","C":"制造业正向高端化智能化绿色化发展扎实推进","D":"经济发展与生态治理齐头并进为实现双赢努力"},"answer":"C","explanation":"文段首先列举了2024年1—7月高端装备制造业销售收入增长的数据，接着通过分号进行衔接，列举了智能设备制造业销售收入增长、高耗能制造业销售收入降低的数据，以及制造业企业采购环境治理服务金额增长的数据。故文段为由分号衔接的并列结构，需全面概括，强调制造业正在向着高端、智能、低耗能、少污染的方向发展，对应C项。\nA项：“领跑作用”文段并未提及，无中生有，排除。\nB、D两项：均缺少文段核心话题“制造业”，排除。\n故正确答案为C。\n【文段出处】人民日报《透过增值税发票看经济亮点》","no":29,"missingImage":false},{"qid":"13319274","cat":"片段阅读","stem":"在何尊的铭文中，有一句话是“恭德裕天”。其中的“德”字，相较甲骨文，底部多出“心”字部首。有专家认为，有“心”方为“德”，表明在三千多年前“德政”这一政治理念业已出现，这为人们理解中国的政治传统提供了有益启示。不同时代、地域青铜器之间的关系“图谱”，青铜器的材质分析、工艺重建和产地溯源，青铜器不同器型与纹饰的来源、演变······亟待破译的“青铜密码”还有很多，需要我们拓宽视野，运用多种研究方法、技术手段进行综合分析，进一步推动相关学科发展。\n这段文字意在强调：","options":{"A":"青铜器的研究领域十分广阔","B":"青铜器亟待进一步深入研究","C":"青铜器研究有益于挖掘传统文化","D":"青铜器研究具有极其重要的价值"},"answer":"B","explanation":"文段开篇以何尊的铭文中“德”字的变化引出“德政”理念，阐述了青铜器研究对理解中国政治传统的意义，接着介绍了一些亟待破译的“青铜密码”，并提出对策，强调需要运用多种方法、手段进行综合分析，从而推动相关学科发展。故文段重在强调青铜器亟待进一步深入研究，对应B项。\nA项：文段重点强调要对青铜器进行深入研究，而非强调青铜器的研究领域广阔，该项偏离文段重点，排除。\nC、D两项：C项“有益于挖掘传统文化”，D项“具有极其重要的价值”均为意义表述，文段重点强调对策，排除。\n故正确答案为B。\n【文段出处】人民网《打开青铜器这本“大书”》","no":30,"missingImage":false},{"qid":"13319271","cat":"片段阅读","stem":"在众多用于建筑的保温材料中，蛭石因其良好的保温性能而广受青睐。蛭石是一种含镁的水铝硅酸盐次生变质矿物，具有二维层状结构，受热时会失水膨胀，因形状类似水蛭而得名。经高温煅烧后，蛭石体积能瞬间膨胀十几倍，每块膨胀蛭石里有很多毛细孔，且每个毛细孔都是微纳米级孔径。这些小空隙就是一个个保温空间。蛭石膨胀倍数越高，空隙越发达，保温性能也就越好。更重要的是，蛭石在生产加工过程中对生态环境污染很小，产品废弃后还能回收再利用，非常符合建筑领域十分推崇的可持续发展理念。\n最适合做这段文字标题的是：","options":{"A":"蛭石为什么可以保温","B":"蛭石：一种神奇的矿石","C":"你所不知道的“蛭石”真面貌","D":"蛭石：让建筑物更加绿色节能"},"answer":"D","explanation":"文段首先引出“蛭石”的话题，并说明蛭石是广受青睐的建筑保温材料，接着介绍蛭石的成分、性状和名称的由来，然后介绍了蛭石保温的原理，尾句通过“更重要的是”引出重点，强调蛭石具有环保的特性，符合建筑领域的可持续发展理念，对应D项。\nA项：“为什么可以保温”对应前文内容，非重点，且未体现文段核心话题“建筑”，排除。\nB项：“神奇的矿石”表述不明确，未体现蛭石节能环保的特点，且未体现文段核心话题“建筑”，排除。\nC项：“你所不知道的‘蛭石’真面貌”侧重与普遍认知不相符的实际情况，而文段未提及对“蛭石”的普遍认知，该项无中生有，排除。\n故正确答案为D。\n【文段出处】响水日报《蛭石：让建筑物更加绿色节能》","no":31,"missingImage":false},{"qid":"13319268","cat":"片段阅读","stem":"“N无”的极简婚礼已成为年轻人婚礼的新趋势，包括“三无”“四无”“五无”婚礼。具体指的是无早起、无接亲、无仪式、无车队、无煽情、无主持、无婚纱、无接亲堵门、无场地布置、无伴娘伴郎等各种“无”的随意搭配组合。他们取消有当众表演之嫌的过度煽情催泪环节，使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车，结束后作为伴手礼赠予亲朋。这些对婚礼的“整顿”，实则是年轻人追求“实用主义”与自我满足在婚礼中的表现。\n下列关于极简婚礼的说法，与文意不符的是：","options":{"A":"让传统、现代和个性在婚礼中更好融合","B":"是对固有的婚礼模式和长辈安排的反抗","C":"年轻人在婚礼中的消费越来越回归理性","D":"年轻人在婚礼中的表现越来越尊重内心"},"answer":"B","explanation":"A项：根据“具体指的是······各种‘无’的随意搭配组合。他们取消有当众表演之嫌的过度煽情催泪环节，使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，“随意搭配组合”体现出个性，结合“使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，既有对传统环节的沿用，也体现出现代性，该项表述正确，排除。\nB项：“对固有的婚礼模式和长辈安排的反抗”文段未提及，无中生有，当选。\nC项：根据“使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，“使用简单环保的装饰”及“用蔬果布置”体现出年轻人在婚礼消费中的理性，该项表述正确，排除。\nD项：根据“这些对婚礼的‘整顿’，实则是年轻人追求‘实用主义’与自我满足在婚礼中的表现”可知，“尊重内心”表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】中国青年报《“整顿”的风吹到了婚礼》","no":32,"missingImage":false},{"qid":"13319275","cat":"片段阅读","stem":"由于历史上非物质文化遗产没有文字著录，而非遗最重要的内容——记忆和技艺，都保存在传承人的身上，这就带来了巨大的不确定性。如果传承中断，记忆和技艺就会立即丢失，这项非遗也就消失了。只有通过传承人的口述记录，将这些无形的记忆和技艺转化为文字，才能将其确凿地保存下来。故而本世纪以来，自民间文化遗产抢救工作和非遗名录建立肇始，对传承人的口述调查便成了为非遗立档普遍采用的不可或缺的方式，有时甚至是唯一的方式，也是最可靠的方法。\n这段文字意在强调：","options":{"A":"为非遗立档是亟待完成的非遗传承工作","B":"口述调查是进行非遗研究最可靠的方法","C":"对传承人口述调查于保存非遗作用很大","D":"传承人是做好非遗抢救工作的关键因素"},"answer":"C","explanation":"文段开篇指出非遗最重要的记忆和技艺都保存在传承人的身上，这带来了巨大的不确定性，接着指出传承人的口述记录对保存这些无形的记忆和技艺的重要性，最后通过“故而”得出结论，指出对传承人的口述调查很重要。故文段的核心话题为“传承人”“口述调查”，重在强调对传承人的口述调查是保存非遗内容的重要工作，对应C项。\nA项：缺少文段核心话题“传承人”“口述调查”，排除。\nB项：缺少文段核心话题“传承人”，排除。\nD项：缺少文段核心话题“口述调查”，排除。\n故正确答案为C。\n【文段出处】光明日报《视觉记录：传承人口述调查的新方法》","no":33,"missingImage":false},{"qid":"13319277","cat":"片段阅读","stem":"数字货币利用大数据与区块链技术，能够高效记录并存储交易信息及货币流向。这种技术的应用使得货币的创造、流通和监控过程变得更加透明和高效。具体来说，大数据技术的运用使得货币政策的制定者可以快速获取大量实时的经济活动数据，极大提高了数据的准确性和政策制定的针对性。区块链技术的特性——分布式账本，为货币流通提供了一个安全可靠的环境，确保了交易信息的不可篡改和实时追踪，降低了监控成本并减少了实施滞后。此类技术革新为中央银行在制定和实施货币政策时提供了强大的数据支撑，使政策更加精准地匹配经济情况的实际需求。\n这段文字重在说明：","options":{"A":"数字货币使货币政策的制定实施更精准和高效","B":"数字货币在金融监管方面具有较大的应用价值","C":"大数据与区块链技术有利于推动宏观经济发展","D":"大数据与区块链技术为货币流通提供安全保障"},"answer":"A","explanation":"文段开篇引出“数字货币”这一概念，指出其利用大数据与区块链技术使得货币的创造、流通和监控过程变得更加透明和高效，接下来通过“具体来说”分别从大数据技术可提高数据的准确性、政策制定的针对性以及区块链技术能降低监控成本并减少实施滞后这两方面对数字货币的作用进行解释说明，尾句通过指代词“此类技术革新”指代前文内容，得出结论，强调数字货币能为中央银行制定和实施货币政策时提供数据支撑，让政策更精准匹配需求。故文段重点强调数字货币对货币政策的正向作用，主题词为“数字货币”与“货币政策”，对应A项。\nB项：“在金融监管方面具有较大的应用价值”对应文段中数字货币的一项作用，除此之外，数字货币还有“创造”“流通”等方面的作用，选项表述片面，且选项并未提及文段主题词“货币政策”，偏离文段重点，排除。\nC项：“推动宏观经济发展”概念范围扩大，文段仅论述“货币政策”，且选项并未提及文段主题词“数字货币”与“货币政策”，排除。\nD项：“安全保障”对应文段解释说明中“区块链技术”的作用，属于数字货币中的一项技术运用，非重点且表述片面，另外选项并未提及文段主题词“数字货币”与“货币政策”，排除。\n故正确答案为A。","no":34,"missingImage":false},{"qid":"13319278","cat":"语句表达","stem":"从古村落整体发展的层面来看，其更新改造过程中应                    。如今的古村落物质空间形态是不同历史发展阶段不断叠加的产物，其中既有人们在村落整体空间布局结构、街巷空间肌理等方面的精心谋划，体现了人与自然和谐共生、文化追求等方面的精髓，也有人们在不同年代由于认识不足或其他原因导致的种种改变。因此，要深入研究古村落历史发展沿革，提取古村落选址和布局中的山水田园人居精华，做到去芜存菁，通过更新改造，更好体现古村落在整体空间布局方面的生态智慧和人文内涵，凸显古村落的整体风貌特色和历史文化价值。\n填入画横线处最恰当的一项是：","options":{"A":"辩证处理“取”与“舍”的关系","B":"将文化遗产保护与文旅资源开发相结合","C":"正确对待历史文化价值同特色产业发展的关系","D":"把挖掘历史文化内涵同打造特色文化品牌统一起来"},"answer":"A","explanation":"横线出现在文段开头，前半句论述了更新改造古村落时应如何做，后文首先论述了如今的古村落物质空间形态是不同历史发展阶段多种原因叠加的产物，既有精心谋划的精髓也有认识不足的问题，随后通过“因此”强调了在古村落更新改造的过程中应去芜存菁，从而更能体现古村落的生态智慧、人文内涵、整体风貌特色和历史文化价值。故后文强调古村落更新改造应去芜存菁，对应A项。\nB项，“文化遗产保护与文旅资源开发相结合”文段并未提及，无中生有，排除；\nC、D两项，C项“历史文化价值”、D项“文化内涵”均对应文段尾句中对策的意义效果，非重点内容，且“特色产业发展”“特色文化品牌”文段均未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】《发展文化经济，为古村落添活力》","no":35,"missingImage":false},{"qid":"13319282","cat":"片段阅读","stem":"地震预警不等于预测。地震预警简单来说，就是利用两个“时间差”。地震发生时，会产生两种重要的地震波：一种是速度较快但震动较弱的纵波，一种是速度较慢但震动较大的横波。地震发生后，地震仪捕捉到纵波，对地震波信息进行快速处理，计算出地震参数、影响程度和预警时间。抢在横波到达之前，将信息通过更快的电磁波形式分发。目前我国已建设了很多地震预警监测台站，覆盖数十个省份，形成了世界上规模最大的地震预警网。\n下列说法与文意不符的是：","options":{"A":"可以凭借纵横波时间差进行地震预测","B":"地震横波比地震纵波产生的危害更大","C":"地震纵波可先于横波被地震仪捕捉到","D":"通过地震预警可以尽早得知地震信息"},"answer":"A","explanation":"A项，根据“地震预警不等于预测······一种是速度较慢但震动较大的横波”可知，“地震预测”偷换概念，当选；\nB项，根据“一种是速度较快但震动较弱的纵波，一种是速度较慢但震动较大的横波”可知，通常震动越大危害相对越大，表述正确，排除；\nC项，根据“地震发生后，地震仪捕捉到纵波······抢在横波到达之前······”可知，表述正确，排除；\nD项，根据“地震发生后，地震仪捕捉到纵波，对地震波信息进行快速处理······将信息通过更快的电磁波形式分发”可知，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】澎湃新闻《地震预警来临的几秒钟内，我们可以做什么？》","no":36,"missingImage":false},{"qid":"13319276","cat":"片段阅读","stem":"绝大多数私家车辆平均充电频率约为每年50次。按照汽车10年寿命测算，全周期内车主使用的充电次数约为500次。而目前，动力电池的实际使用寿命至少为2000次，每辆新能源汽车在全周期内仍有超过1000次的电池充电次数可参与车网互动给电网送电。经过相关验证，车辆以小倍率进行充放电，在浅充浅放的工况下，经过数千天的使用，在完成200余次V2G（电动汽车给电网送电）充放电循环后，电池容量仍保持在93%以上。此外，虽然V2G技术会增加新能源汽车电池的充放电次数，但合理的充放电管理策略可优化电池的使用效率，减少电池的老化和降解。\n这段文字讨论的核心问题是：","options":{"A":"新能源汽车参与车网互动有何必要性和优越性","B":"V2G技术对新能源汽车电池使用效率有无影响","C":"适当地充放电与优化汽车电池使用效率有何关系","D":"参与车网互动是否会影响到汽车电池的使用寿命"},"answer":"D","explanation":"文段开篇指出私家车辆全周期内的充电次数，随后表明观点，即每辆新能源汽车的动力电池在全周期内有大量剩余充电次数可参与车网互动给电网送电，后文通过相关验证，先说明在特定充放电工况下，车辆经过多次V2G充放电循环后电池容量仍能保持在较高水平，再用“此外”引导并列，说明即便V2G技术会增加电池充放电次数，但合理的管理策略可优化电池使用效率、减少电池老化降解，通过“V2G（电动汽车给电网送电）”可知，V2G技术即为前文提及的车网互动，故整个文段围绕新能源汽车参与车网互动（V2G）对电池使用寿命的影响展开论述，对应D项。\nA项，缺少文段核心话题“电池使用寿命”，且“必要性和优越性”文段并未提及，无中生有，排除；\nB项，文段核心话题为“电池使用寿命”，而非“电池使用效率”，排除；\nC项，缺少文段核心话题“车网互动（V2G）”“电池使用寿命”，排除。\n故正确答案为D。\n【文段出处】人民日报海外版《有效解决新型电力系统建设过程中供需协同不足——灵活电网怎么建？新能源车来出力（能源转型看中国②）》","no":37,"missingImage":false},{"qid":"13319287","cat":"片段阅读","stem":"在生态系统中起着至关重要作用的南极磷虾，是如何度过寒冷、黑暗而漫长的极夜的？科学家发现，当浮游植物因缺少阳光而停止生长时，南极磷虾就会转向捕食中小型浮游动物。储藏在海冰中的微生物——南极冰藻，是南极磷虾在冬天的天然“粮仓”。在没有饵料的情况下，南极磷虾能存活200天左右；在食物极其匮乏时，南极磷虾会逐渐变小，靠消耗体内的脂肪来维持生命。\n这段文字最有可能用来例证：","options":{"A":"南极磷虾在极端环境中有特殊能力","B":"特别的环境会孕育出特别的生命体","C":"南极冰藻在生态系统中有重要作用","D":"生物具有应对特殊环境的生存本领"},"answer":"D","explanation":"文段开篇提出问题，即南极磷虾如何度过极夜，随后给出解释，指出南极磷虾会在浮游植物停止生长时捕食中小型浮游动物，而南极冰藻成为南极磷虾在冬天的天然“粮仓”，尾句介绍了南极磷虾在没有饵料时的存活天数，以及其在食物极其匮乏的情况下，会通过消耗体内脂肪来维持生命。故文段以南极磷虾为例，重点介绍了南极磷虾在极端环境下具备了适应环境的特殊能力，可用来例证生物为应对特殊环境产生了独特的生存本领，对应D项。\nA项：“南极磷虾”属于举例内容，非重点，排除。\nB项：“特别的环境会孕育出特别的生命体”强调的是环境对生命体的影响，而文段重点介绍了南极磷虾在极端环境下如何“生存”，故重点为“生存能力”，排除。\nC项：“南极冰藻”属于举例内容，非重点，排除。\n故正确答案为D。\n【文段出处】科普时报《生命渴望阳光》","no":38,"missingImage":false},{"qid":"13319280","cat":"片段阅读","stem":"作为一类代谢功能多样的特殊微生物，光合细菌具有强大的生化催化能力和营养益生功能，可以制备多种多样的生物制剂。目前国内科研院所和医药厂商对光合细菌在医药产品开发领域的研究仍处于起步阶段。随着科学技术水平不断进步，研究者对光合细菌类群特殊代谢能力的理解将进一步加深，有助于持续激发该类细菌的产业化潜力。除生产新式治疗药物外，还可利用光合细菌适应极端环境的生存优势，结合基因工程技术，设计开发工程菌株，通过微生物催化作用实现分子结构重组，用以大量生产重要原料药物，或可替代化学制药技术。总体而言，深度拓展光合细菌在医药研究领域的研究，具有良好的应用前景与实践意义，有望推动微生物制药工程可持续发展。\n从这段文字提取关键词最恰当的一项是：","options":{"A":"特殊微生物 光合细菌 生物制药","B":"特殊微生物 代谢能力 产业化","C":"光合细菌 产业化 制药技术","D":"光合细菌 代谢功能 医药应用"},"answer":"D","explanation":"文段开篇引出“光合细菌”这一话题，指出其可以制备多种多样的生物制剂，接着指出虽然目前国内对光合细菌在医药产品开发领域的研究处于起步阶段，但是随着科技水平的进步，研究者对光合细菌的代谢能力的理解将进一步加深，有助于激发其产业化潜力，其可用于生产药物或替代化学制药技术，最后通过“总体而言”进行总结，强调拓展光合细菌在医药研究领域的研究有良好的应用前景与实践意义。故文段围绕光合细菌在医药方面的应用展开论述，D项“光合细菌”“代谢功能”“医药应用”能够很好地概括文段重点，当选。\nA项：“特殊微生物”非重点，排除。\nB项：缺少文段主题词“光合细菌”，偏离文段中心，排除。\nC项：“制药技术”表述片面，无法全面概况光合细菌在医药方面的应用，且“产业化”非重点，排除。\n故正确答案为D。\n【文段出处】知网《光合细菌代谢与其在医药领域的应用》","no":39,"missingImage":false},{"qid":"13319284","cat":"语句表达","stem":"①因为声波是一种机械波，声波的传播依赖于机械振动在介质中的传递\n②花样游泳比赛时，水上水下都要有音响设备\n③因此，当声波入射到水和空气的交界面时，仅有0.1%的声能量能透过水-气交界面\n④为什么空气中和水下难以共享一个声音世界呢\n⑤在不同介质中，声波的传递能力会因介质声阻抗的差异而有所不同，常温下，空气与水的声阻抗相差约3600倍\n⑥声音在水和空气之间的极低透射，使得潜入水中的花样游泳运动员难以听到岸上音乐，所以需要水上和水下同时布置音响设备\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②①④⑥⑤③","B":"②④①⑤③⑥","C":"④①⑤③②⑥","D":"④①②⑤⑥③"},"answer":"B","explanation":"对比选项，确定首句。选项中首句分别为②句和④句。②句指出花样游泳比赛时水上水下都要有音响设备，④句提出“为什么空气中和水下难以共享一个声音世界”的问题，根据逻辑顺序可知，④句是围绕②句内容进行的进一步论述，故②句应在④句之前，排除C、D两项，保留A、B两项。\n继续观察选项，②句后分别衔接①句与④句，①句指出声波的传播依赖于机械振动在介质中的传递，是对④句“为什么空气中和水下难以共享一个声音世界”的回答，故④句应在①句之前，排除A项，B项当选。\n故正确答案为B。\n【文段出处】科普中国网《“我是你的破壁人！”空气&水：······》","no":40,"missingImage":false},{"qid":"13319291","cat":"逻辑填空","stem":"在发展新质生产力的当下，江苏高端制造不断刷新纪录，取得创新成果。近日，工信部公布了2024年先进制造业集群“国家队”名单，全国共有35个先进制造业集群            ，其中江苏有4个入选，在这场国家级的选拔赛中，江苏            ，有何过人之处？\n依次填入画横线部分最恰当的一项是：","options":{"A":"上榜 一路凯歌","B":"入围 一枝独秀","C":"荣膺 技压群芳","D":"胜出 独占鳌头"},"answer":"A","explanation":"第一空，根据“工信部公布了2024年先进制造业集群‘国家队’名单”“其中江苏有4个入选”可知，横线处应体现全国共有35个先进制造业集群进入名单之意。A项“上榜”、B项“入围”都有进入名单之意，符合文意，保留。D项“胜出”指在比赛或竞争中胜过对手，符合文意，保留；C项“荣膺”指光荣地接受或承当，一般搭配“称号”“荣誉”等，与“名单”搭配不当，排除。\n第二空，根据“江苏高端制造不断刷新纪录，取得创新成果”“其中江苏有4个入选，在这场国家级的选拔赛中，江苏······有何过人之处”可知，横线处应体现江苏表现突出、成绩不凡。A项“一路凯歌”形容在前进的过程中不断取得成功和胜利，充满了喜悦和荣耀，符合文意，当选。B项“一枝独秀”形容在同类事物中最为突出，最为优秀，文段没有强调江苏是最出色的，只是强调江苏自身表现出色，与文意不符，排除；D项“独占鳌头”指在竞争中夺得首位，文段并未强调江苏排名第一，与文意不符，排除。\n故正确答案为A。\n【文段出处】现代快报《先进制造业集群“国家队”，江苏+4》","no":41,"missingImage":false},{"qid":"13319285","cat":"逻辑填空","stem":"目前，我国快递业务已经达到了前所未有的新高度，业务量已突破1000亿件大关。快递物流是经济活力            的“风向标”，不仅            出行业的蓬勃跃升，更彰显了我国经济的繁荣活力与无限潜能。\n依次填入画横线部分最恰当的一项是：","options":{"A":"毋庸置疑 显示","B":"名副其实 映照","C":"当之无愧 折射","D":"理所当然 展示"},"answer":"B","explanation":"本题所给选项较为接近，需对比择优。第一空，根据“目前，我国快递业务已经达到了前所未有的新高度，业务量已突破1000亿件大关”与“快递物流是经济活力······的‘风向标’”可知，横线处应体现快递物流作为经济活力的“风向标”这个名称与实际是相符的。B项“名副其实”指名称或名声与实际相符合，符合文意，保留。A项“毋庸置疑”指无须怀疑，侧重强调确定性，D项“理所当然”指从道理上讲应该这样，侧重强调合理性，C项“当之无愧”指完全当得起，没有惭愧和不足的地方，多用于积极的语境，而“风向标”能够反映事物发展的趋势与方向，感情色彩为中性，且文段中“业务量已突破1000亿件大关”仅为客观事实的陈述，侧重于客观和名称相符合，故三项均不符合文意，均排除。\n第二空，代入验证。根据“更彰显了我国经济的繁荣活力与无限潜能”可知，快递行业的业务量能够体现出行业的蓬勃发展。B项“映照”指照射，能形象地表达出快递物流映射出行业的蓬勃跃升，当选。\n故正确答案为B。\n【文段出处】红网《快递业务突破千亿件：“小包裹”跑出“大经济”》","no":42,"missingImage":false},{"qid":"13319288","cat":"逻辑填空","stem":"古往今来，在技术的不断更迭中，无数产业在            中被淘汰。出版业却始终屹立不倒，从纸质介质到电子介质，从印刷术到激光照排技术，再到人工智能的广泛应用与数字产品的研发推广，出版社不断            ，被人们看作是“永不凋落”的朝阳产业。\n依次填入画横线部分最恰当的一项是：","options":{"A":"大浪淘沙 推陈出新","B":"百舸争流 独辟蹊径","C":"白衣苍狗 励精图治","D":"波谲云诡 精益求精"},"answer":"A","explanation":"第一空，根据文意可知，横线所在句子应体现在技术更迭中，很多产业在竞争和发展中被淘汰。A项“大浪淘沙”比喻在激烈的斗争中经受考验、筛选，B项“百舸争流”指上百条船，争着在水上疾驰，均符合文意，保留。C项“白衣苍狗”指浮云形状像白衣，一会儿又变得像黑狗，比喻世事变幻无常，不易揣测，强调世事变化之快，难以预料，与文意不符，排除；D项“波谲云诡”多用于形容事物变幻莫测，强调变化难以捉摸，与文意不符，排除。\n第二空，根据“从纸质介质到电子介质，从印刷术到激光照排技术，再到人工智能的广泛应用与数字产品的研发推广”可知，横线处应体现出版业不断创新发展自身技术。A项“推陈出新”指去掉旧事物的糟粕，取其精华，并使它向新的方向发展，符合文意，当选。B项“独辟蹊径”比喻独创一种风格或新的方法，文段并非强调出版社“独创”了这些技术，与文意不符，排除。\n故正确答案为A。\n【文段出处】科技日报《数智化时代，出版业如何拥抱新技术》","no":43,"missingImage":false},{"qid":"13319292","cat":"逻辑填空","stem":"“领导细胞”在肝脏受损后进行自我修复方面发挥了主要作用。在伤口愈合过程中，这些细胞            ，迅速闭合伤口，然后细胞快速增殖，进一步密封伤口。这表明，在        新组织前，肝脏优先考虑闭合伤口，防止细菌进入器官引起广泛感染。\n依次填入画横线部分最恰当的一项是：","options":{"A":"争先恐后 繁殖","B":"身先士卒 形成","C":"一马当先 生成","D":"首当其冲 产生"},"answer":"C","explanation":"第一空，根据“‘领导细胞’在肝脏受损后进行自我修复方面发挥了主要作用”可知，横线处所填成语应体现发挥重要作用之意。B项“身先士卒”指作战时将帅亲自带头，冲在士兵前面，现多泛指领导带头走在群众前面，C项“一马当先”指作战时策马冲锋在前，形容领先或带头，均符合文意，保留。A项“争先恐后”指争着向前，唯恐落后，侧重积极性，不能体现发挥重要作用之意，排除。D项“首当其冲”指最先受到攻击或遭遇灾难，与文意无关，排除。\n第二空，搭配“新组织”。C项“生成”指（自然现象）形成，经过化学反应而形成，产生，与“新组织”搭配恰当，当选。B项“形成”指通过发展变化而成为具有某种特点的事物，或者出现某种情形或局面，多搭配“局势”“趋势”“问题”等，与“新组织”搭配不当，排除。\n故正确答案为C。\n【文段出处】科技日报《修复受损肝脏的新型细胞发现》","no":44,"missingImage":false},{"qid":"13319289","cat":"逻辑填空","stem":"中华法系形成于秦朝，至隋唐日趋成熟，宋元明清时期        形成了影响深远的成文法典，在历史发展中        而成的中华法系彰显了中华优秀传统法律文化自我发展、回应挑战的主体性与生命力，也反映了中华文明            的延续性。\n依次填入画横线部分最恰当的一项是：","options":{"A":"陆续 积淀 源远流长","B":"相继 淬炼 一脉相承","C":"渐次 聚集 薪火相传","D":"稳步 嬗变 生生不息"},"answer":"B","explanation":"第一空，根据“中华法系形成于秦朝······形成了影响深远的成文法典”“延续性”可知，横线处所填词语应体现时间的连续性。A项“陆续”表示前后相继，时断时续，B项“相继”指一个跟着一个，连续不断，C项“渐次”指逐步、渐渐，均符合文意，保留。D项“稳步”比喻有把握地按一定步骤进行，与文意不符，排除。\n第二空，根据文意可知，横线处所填词语应体现中华法系不断完善的形成过程。A项“积淀”指积累沉淀，B项“淬炼”指反复经受考验，磨炼，均符合文意，保留。C项“聚集”指集合、凑在一起，多指不同空间的事物聚合在一块儿，无法体现前文所述的不断完善的过程，与文意不符，排除。\n第三空，根据“中华法系形成于秦朝······形成了影响深远的成文法典”“中华法系彰显了中华优秀传统法律文化自我发展······的延续性”可知，横线处所填成语应体现连贯性，连续性。B项“一脉相承”指从同一个血统或派别世代承接流传下来，符合文意，当选。A项“源远流长”比喻历史悠久，根底深厚，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明日报《从优秀传统法律文化看中华文明的突出特性》","no":45,"missingImage":false},{"qid":"13319296","cat":"逻辑填空","stem":"在新中国科技史和工业史上，中国核事业的奠基之作、            的“一堆一器”，作为我国建设的第一项原子能设施，彰显了新中国的硬实力。从基础研究，到“两弹一艇”研制，再到和平利用原子能，“一堆一器”            。虽然，通过报刊书本、影视荧屏，我们对“一堆一器”并不完全陌生。然而，当它们“活生生”地出现在眼前时，惊喜与感动依旧            ，关于它们的故事与传奇、过往与现状，依然牵动人心。\n依次填入画横线部分最恰当的一项是：","options":{"A":"闻名遐迩 举足轻重 情不自胜","B":"声名显赫 劳苦功高 不期而至","C":"大名鼎鼎 功不可没 油然而生","D":"举世无双 功勋卓著 汹涌澎湃"},"answer":"C","explanation":"第一空，根据“奠基之作”“作为我国建设的第一项原子能设施，彰显了新中国的硬实力”“我们对‘一堆一器’并不完全陌生”可知，横线处应体现“一堆一器”具有重要地位，能够对外彰显我国实力，大家都有所了解。A项“闻名遐迩”形容名声很大，B项“声名显赫”形容名声盛大，C项“大名鼎鼎”形容名气很大，极其有名，均符合文意，保留。D项“举世无双”指世界上再没有第二个这样的人或物，形容极其罕见稀有，强调独特性，文段没有对“一堆一器”的唯一性和独特性进行介绍，与文意不符，排除。\n第二空，根据“奠基之作”可知，横线处应体现“一堆一器”在基础研究等过程中的重要作用。A项“举足轻重”形容身份或地位特殊，一举一动足以影响全局，C项“功不可没”指功劳极大，不可抹灭，均符合文意，保留。B项“劳苦功高”形容做事勤苦，功劳很大，多用以慰问和赞颂别人，文段并未体现“一堆一器”在基础研究等过程中劳累勤苦，与文意不符，排除。\n第三空，根据“关于它们的故事与传奇、过往与现状，依然牵动人心”可知，横线处应体现人们看到“一堆一器”出现在眼前时，还是会惊喜、感动。C项“油然而生”形容某种好的思想感情自然而然地产生，符合文意，当选。A项“情不自胜”指感情悲痛得无法忍受，与文意不符，排除。\n故正确答案为C。\n【文段出处】人民日报《把“历史数据”转化为“当代记忆”》","no":46,"missingImage":false},{"qid":"13319295","cat":"逻辑填空","stem":"对于人类而言，“逝去之物”总具有独特的魅力。人们难以遏制对“起源”的遐想，并做出            般的追问。考古发掘让早已湮灭的文明再见天日，通过窥探遗迹的里里外外、角角落落，用发现的物证来        历史的图景。文物既旧也新，它不仅可以证实或证伪我们关于历史的记忆和想象，更重要的是复活了被遗忘的文明的璀璨艺术，让那些            的美再次绽放。\n依次填入画横线部分最恰当的一项是：","options":{"A":"剥茧抽丝 再现 深藏不露","B":"愚公移山 组合 巧夺天工","C":"精卫填海 拼合 不为人知","D":"夸父逐日 还原 不可替代"},"answer":"D","explanation":"第一空，根据“人们难以遏制对‘起源’的遐想”以及“追问”可知，横线处应体现人们对探索、追求“起源”的坚决、执着之意。B项“愚公移山”比喻以顽强的毅力和不怕困难、人定胜天的斗争精神去征服自然、改造世界，C项“精卫填海”比喻不畏艰难，不达目的誓不罢休的坚强意志，D项“夸父逐日”比喻决心很大，均符合文意，保留。A项“剥茧抽丝”形容分析事物极为细致，而且一步一步很有层次，无法体现执着之意，与文意不符，排除。\n第二空，横线处应与“物证”及“历史的图景”搭配，且由“早已湮灭的文明再见天日”及“复活了被遗忘的文明的璀璨艺术”可知，横线处重点强调通过物证来让历史图景重现之意。D项“还原”指事物恢复原状，与“物证”“历史的图景”均搭配恰当，且符合文意，保留。B项“组合”指组织成为整体，C项“拼合”指合在一起，组合，均无法体现“重现”之意，且均与“历史的图景”搭配不当，排除。\n第三空，代入验证。横线处应与“美”搭配，且根据“‘逝去之物’总具有独特的魅力”可知，横线处应体现文物、文明之美的特殊性。D项“不可替代”指某人或某物是不能够用他人或他物来进行代替的，符合文意，且与“美”搭配恰当，当选。\n故正确答案为D。\n【文段出处】中国社会科学网《文物中的文明与艺术》","no":47,"missingImage":false},{"qid":"13319294","cat":"逻辑填空","stem":"中国探月20年，拉近了            与普通公众生活的距离。当一粒棉花种子在月球上生根发芽，当月球车玉兔微博下满是网友的祝福，当中小学教材换上了崭新的中国月面图······越来越多的人与探月工程的某项成果、某个侧面            ，一个共识在人们心中不断        ：我们离月球并不遥远！\n依次填入画横线部分最恰当的一项是：","options":{"A":"碧海青天 邂逅相逢 汇集","B":"浩瀚苍穹 心心相印 回响","C":"星辰大海 不期而遇 凝聚","D":"蟾宫折桂 情投意合 激荡"},"answer":"C","explanation":"第一空，根据后文可知，中国探月20年拉近了太空与普通公众生活的距离。B项“浩瀚苍穹”形容广阔的宇宙，符合文意，保留。C项“星辰大海”比喻未知的领域或遥远的目标，置于此处可用来形容人们所知甚少的太空，符合文意，保留。A项“碧海青天”指碧绿的海，湛蓝的天，形容水天一色，旷远无边；也形容嫦娥在广寒宫夜夜看着空阔的碧海青天，心情孤寂凄凉，后比喻女子对爱情的坚贞，D项“蟾宫折桂”的意思是在月宫中攀折桂花，比喻科举应试得中，均无法用来形容太空，排除。\n第二空，根据“当一粒棉花种子······换上了崭新的中国月面图”可知，横线处应体现越来越多的人接触到了探月成果。C项“不期而遇”指未经约定而意外相遇，可以体现人们接触到了探月工程的某项成果或某个侧面，符合文意，保留。B项“心心相印”形容彼此心意一致，无法与“成果”“侧面”搭配，排除。\n第三空，代入验证。横线处搭配“共识”。C项“凝聚”指聚集、积聚，“凝聚共识”为常见搭配，当选。\n故正确答案为C。\n【文段出处】《一场跨越时空的征途（新语）》","no":48,"missingImage":false},{"qid":"13319301","cat":"逻辑填空","stem":"自上古时期以来，华夏先民就通过粟和黍的栽培、陶器的烧制、冶铁的发明，        了农业文明的辉煌篇章；汉唐之际，从造纸术到雕版印刷，这些发明创造为文化传承发展提供了重要        ；宋元以降，《梦溪笔谈》《授时历》《天工开物》《本草纲目》等科学典籍的问世，无一不是中华民族            、与时俱进的优秀典范。\n依次填入画横线部分最恰当的一项是：","options":{"A":"谱写 借鉴 除旧布新","B":"铸就 载体 蜕故孳新","C":"绘制 支撑 吐故纳新","D":"开启 依托 革故鼎新"},"answer":"D","explanation":"第一空，搭配“辉煌篇章”。A项“谱写”指创造（值得记载的事物），D项“开启”指开创，二者均与“辉煌篇章”搭配得当，保留。B项“铸就”意为铸造成，多用于比喻，常见搭配有“铸就辉煌”“铸就伟业”“铸就传奇”等，C项“绘制”指用笔或其他绘图工具描画制作，常见搭配有“绘制地图”“绘制蓝图”“绘制图表”等，二者均与“辉煌篇章”搭配不当，排除。\n第二空，根据文意可知，横线处强调文化传承发展建立在雕版印刷等发明的基础上。D项“依托”指依靠，凭借，符合文意，保留。A项“借鉴”指把别的人或事当镜子，对照自己，以便吸取经验或教训，文段并无“吸取经验或教训”的语境，排除。\n第三空，代入验证。D项“革故鼎新”指革除旧的，建立新的，与“与时俱进”意思相近，可构成近义并列关系，符合文意，当选。\n故正确答案为D。\n【文段出处】人民日报《为推动科技创新提供文化支撑 大力培育创新文化（有的放矢）》","no":49,"missingImage":false},{"qid":"13319300","cat":"逻辑填空","stem":"巍巍华山阻住了奔腾南来的黄河，逼其90度大拐弯。原来被高原土层        着的黄河，一旦向东越过三门峡进入华北平原，顿时就变成了在平地上            的“野马”，成了到处滚动、狂奔的地上河，一会儿从东北方向流入渤海，一会儿又从东南方向夺取淮河河道注入黄海。万年千年间，黄河携带的泥沙渐渐        出了美丽富饶的华北平原。\n依次填入画横线部分最恰当的一项是：","options":{"A":"环抱 狂放不羁 凝固","B":"挟持 肆无忌惮 淤积","C":"裹挟 自由驰骋 沉淀","D":"束缚 风驰电掣 积累"},"answer":"B","explanation":"第一空，根据“巍巍华山阻住了奔腾南来的黄河”及“一旦向东越过三门峡进入华北平原，顿时就变成了在平地上······的‘野马’”可知，横线处所填词语应体现黄河被高原土层所限制、约束。B项“挟持”指用威力强迫对方服从，置于此处可形象地将高原土层对黄河的约束比作一种强制性的挟持，可生动地展现出黄河被高原土层限制、引导流向的状态，D项“束缚”指使受到约束限制，使停留在狭窄的范围里，均符合文意，保留。A项“环抱”的意思是环绕，围绕在中间，侧重描述一种自然的、静态的环绕格局，无法体现出黄河被限制、约束的状态，与文意不符，排除；C项“裹挟”意为（风、流水等）把别的东西卷入，使随着移动，例如“洪水裹挟着杂物奔腾而下”，文段侧重强调黄河被高原土层限制流向，并非黄河被卷入并随其他事物移动，与文意不符，排除。\n第二空，修饰“野马”，且根据“成了到处滚动、狂奔的地上河，一会儿从东北方向流入渤海，一会儿又从东南方向夺取淮河河道注入黄海”可知，横线处所填成语应体现出黄河进入华北平原后，摆脱了高原土层的约束，肆意流动、到处滚动狂奔的状态。B项“肆无忌惮”指恣意妄行，毫无顾忌，置于此处可准确地体现出黄河不受控制的特点，且可以与“野马”进行呼应，符合文意，保留。D项“风驰电掣”形容像刮风和闪电那样迅速，文段侧重强调黄河像野马一样不受控制，并非强调其流速快，与文意不符，排除。\n第三空，代入验证。B项“淤积”指（水里的泥沙等）沉积，置于此处可准确地体现出黄河泥沙经过万年千年堆积形成平原的过程，符合文意，当选。\n故正确答案为B。\n【文段出处】人民日报《黄河之水天上来》","no":50,"missingImage":false}]}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"13319467","cat":"数学运算","stem":"1.13，3.18，7.25，4.25，9.33，（    ）","options":{"A":"6.34","B":"8.35","C":"10.43","D":"12.45"},"answer":"B","explanation":"数列各项均为小数，优先考虑机械划分。观察整数和小数部分，组间无明显规律，考虑组内规律，小数部分-整数部分得到新数列：12，15，18，21，24，（    ），是公差为3的等差数列。则所求项小数部分-整数部分=24+3=27，只有B项35-8=27满足。\n故正确答案为B。","no":51,"missingImage":false},{"type":"question","qid":"13319479","cat":"数学运算","stem":"\u003cimg data-k=\"54d707f15b45\">，\u003cimg data-k=\"ff1b1de9ab8e\">，\u003cimg data-k=\"62f28a2cc6c4\">，\u003cimg data-k=\"8c7f00e20cd0\">，\u003cimg data-k=\"5655b1247a19\">，（    ）","options":{"A":"\u003cimg data-k=\"8c91a3842b8a\">","B":"\u003cimg data-k=\"4ff618517896\">","C":"\u003cimg data-k=\"4c9d1dbc0f2e\">","D":"\u003cimg data-k=\"5d66fab6b677\">"},"answer":"A","explanation":"数列各项均为分数，考虑分数数列。观察分母特点：\u003cimg data-k=\"eb5a9f6ac0bd\">，\u003cimg data-k=\"b94827bcb4ab\">，则对数列进行反约分可得：\u003cimg data-k=\"54d707f15b45\">， \u003cimg data-k=\"a286663bc2d7\">，\u003cimg data-k=\"62f28a2cc6c4\">，\u003cimg data-k=\"8c7f00e20cd0\">，\u003cimg data-k=\"3fccc3b421c1\">，（    ），分母规律为：\u003cimg data-k=\"6e844982e9ef\">，即依次为：\u003cimg data-k=\"f0aab05cb576\">，\u003cimg data-k=\"5b0ee59217b6\">，\u003cimg data-k=\"d9c3c3d92e8f\">，\u003cimg data-k=\"4b70ceb9f332\">，\u003cimg data-k=\"dcb25ba11ab1\">，则所求项分母为\u003cimg data-k=\"b24f6e2d4d96\">；分子部分为：1，6，23，58，117，（    ），后项-前项可得：5，17，35，59，（    ），无明显规律，继续作差可得：12，18，24，（    ），是公差为6的等差数列，则所求项分子为117+（59+24+6）=206，即所求项为\u003cimg data-k=\"8c91a3842b8a\">。\n故正确答案为A。","no":52,"missingImage":false},{"type":"question","qid":"13319473","cat":"数学运算","stem":"\u003cimg data-k=\"b35f49f93254\">，\u003cimg data-k=\"395e03f8a0cd\">，14，\u003cimg data-k=\"1511e8657d7c\">，\u003cimg data-k=\"33b2090c06e8\">，（    ）","options":{"A":"\u003cimg data-k=\"31350c6a
