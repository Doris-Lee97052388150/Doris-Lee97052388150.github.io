\">。","no":57,"missingImage":false},{"type":"question","qid":"11226491","cat":"数学运算","stem":"引导车引导运输车队前往某地，途经一座桥梁和一个隧道，引导车与运输车队速度一致，引导车的长度忽略不计。匀速通过800米长的桥梁，引导车需36秒，运输车队需45秒。通过隧道时车速比通过桥梁时下降25%，若引导车需60秒，则运输车队需：","options":{"A":"69秒","B":"70秒","C":"72秒","D":"75秒"},"answer":"C","explanation":"根据火车过桥公式：\u003cimg data-k=\"b9b1fa8336b6\">，可得通过桥梁时车速为\u003cimg data-k=\"18635406f264\">米/秒，\u003cimg data-k=\"d6125f8f283c\">米。通过隧道时车速为\u003cimg data-k=\"4b13cc5c9dc6\">米/秒，则\u003cimg data-k=\"94f0184f4222\">米，运输车队通过隧道需要\u003cimg data-k=\"2c5385ca67c7\">秒。\n故正确答案为C。","no":58,"missingImage":false},{"type":"question","qid":"13319477","cat":"数学运算","stem":"某农场使用M、N两架无人机喷洒农药，先由M无人机工作2小时，再由N无人机工作5小时，可喷洒完整片农田；两架无人机同时工作1小时后，有三分之二的农田尚未喷洒。如果仅由M无人机喷洒农药，那么喷洒完整片农田需要（    ）。","options":{"A":"3.5小时","B":"4.5小时","C":"5小时","D":"5.5小时"},"answer":"B","explanation":"用M、N分别表示两架无人机的工作效率，根据题意可得：\u003cimg data-k=\"192628841b2e\">，化简得M：N=2：1。赋值M无人机的工作效率为2，N无人机的工作效率为1，则喷洒整片农田的工作量为2×2+5×1=9，仅由M无人机喷洒农药，那么喷洒完整片农田需要9÷2=4.5小时。\n故正确答案为B。","no":59,"missingImage":false},{"type":"question","qid":"11226494","cat":"数学运算","stem":"某单位在边长为200米的正方形广场上组织一场招聘会，计划安排若干名工作人员提供咨询服务，每名工作人员入场后将分别随机站在一个位置上，其服务半径不超过\u003cimg data-k=\"577cecd72a3b\">米。若要确保咨询服务全覆盖，则至少需要安排工作人员：","options":{"A":"4名","B":"5名","C":"6名","D":"7名"},"answer":"A","explanation":"如下图所示，正方形广场ABCD边长为200米，则对角线AC、BD长度均为\u003cimg data-k=\"9026f8f756ca\">米，由于每名工作人员服务半径不超过\u003cimg data-k=\"577cecd72a3b\">米，要想安排的工作人员最少，则每名工作人员服务范围要尽量大，服务半径最大为\u003cimg data-k=\"577cecd72a3b\">米，则服务范围最大是一个直径为\u003cimg data-k=\"0986c458aa48\">米的圆。将正方形广场分为4个完全相等的正方形区域，以左上正方形AEOF为例，其对角线AO为\u003cimg data-k=\"8078b56cc64f\">米。若1名工作人员站在AO的中点G上，其服务的范围为正方形AEOF的外接圆，恰好覆盖了4个顶点以及4条边。同理，再将3名工作人员分别安排在BO、CO、DO的中点上，就能确保咨询服务全覆盖，则至少需要安排4名工作人员。\n\u003cimg data-k=\"0e13294642ea\" style=\"max-width:336px\">\n故正确答案为A。","no":60,"missingImage":false},{"type":"question","qid":"13319472","cat":"数学运算","stem":"某单位组织45名员工参观第十五届中国国际航空航天博览会。其中，21人参观了新一代隐身战斗机歼-35A，22人参观了嫦娥六号取回的月背月壤样品，19人参观了大型无人机战舰“虎鲸”。所有员工中，这三种展览都未参观的有5人，至少参观两种的有12人，则这三种展览都参观的有（    ）。","options":{"A":"7人","B":"8人","C":"9人","D":"10人"},"answer":"D","explanation":"根据题意，设参观两种展览的员工有x人，参观三种展览的员工有y人。根据三集合容斥原理非标准型公式：A+B+C-满足两项-2×满足三项=总数-都不，可列式：21+22+19-x-2y=45-5，整理得：x+2y=22······①；根据“至少参观两种的有12人”，可得：x+y=12······②，①式减②式可得：y=10，故这三种展览都参观的有10人。\n故正确答案为D。","no":61,"missingImage":false},{"type":"question","qid":"13319480","cat":"数学运算","stem":"一场演出的节目有舞蹈《水韵江苏》、歌曲《让世界充满爱》和《绣红旗》、小品《幸福一家人》、魔术《奇幻之旅》、杂技《力量》。若要求两首歌曲分别作为开头曲和结尾曲，舞蹈与杂技相邻演出，小品和魔术不能相邻演出，则节目演出的排列顺序有（    ）。","options":{"A":"8种","B":"12种","C":"18种","D":"24种"},"answer":"A","explanation":"根据题意，要求两首歌曲分别作为开头曲和结尾曲，有\u003cimg data-k=\"79ffa592ef20\">种情况；要求舞蹈与杂技相邻演出，故可先将舞蹈和杂技捆绑起来，由于演出有先后顺序，有\u003cimg data-k=\"79ffa592ef20\">种情况；要求小品和魔术不能相邻演出，可用插空法，先将舞蹈和杂技作为整体安排到两首歌曲中间，再将小品和魔术插入中间的2个空中，有\u003cimg data-k=\"79ffa592ef20\">种情况。分步用乘法，则共有2×2×2=8种节目演出的排列顺序。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"11226493","cat":"数学运算","stem":"某配送中心负责若干个货箱的分配，如果将货箱平均分配给6个配送点，有3个无法分配；如果将货箱平均分配给11个配送点，恰好分完；如果将货箱平均分配给13个配送点，有2个无法分配。该配送中心负责分配的货箱总共可能有：","options":{"A":"231个","B":"429个","C":"561个","D":"759个"},"answer":"C","explanation":"根据题意可知，该配送中心负责分配的货箱总数减3后是6的整数倍，又是11的整数倍，减2后是13的整数倍，观察选项可知，均为11的整数倍，依次代入选项验证即可：\n代入A项：\u003cimg data-k=\"903f988e19b3\">；\u003cimg data-k=\"7ec4711a9542\">整数，不符合题意，排除；\n代入B项：\u003cimg data-k=\"3835f772678e\">；\u003cimg data-k=\"e3220ace91ed\">整数，不符合题意，排除；\n代入C项：\u003cimg data-k=\"ded109856736\">；\u003cimg data-k=\"9255063aab2c\">，符合题意，当选。无需验证剩余选项。\n故正确答案为C。","no":63,"missingImage":false},{"type":"question","qid":"13319482","cat":"数学运算","stem":"用若干玫瑰花制作玫瑰花束，若每束8枝余3枝，9枝余5枝，如果将这些玫瑰花全部用完，制成数量各不相同的3束玫瑰花，那么数量最多的那一束至少有玫瑰花（    ）。","options":{"A":"18枝","B":"20枝","C":"21枝","D":"23枝"},"answer":"C","explanation":"设每束8枝有a束，每束9枝有b束，根据玫瑰花总枝数相同可列式：8a+3=9b+5，整理可得：8a=9b+2。根据奇偶特性可知，8a和2均为偶数，则9b为偶数，即b为偶数。根据要求数量最多的一束玫瑰花最少，那么玫瑰花总枝数要最少，即b取值要尽量小，分情况讨论：\n若b=2，则a=2.5，不是整数，不符合题意；\n若b=4，则a=4.75，不是整数，不符合题意；\n若b=6，则a=7，符合题意，则此时玫瑰花总枝数最少为8×7+3=59枝。要使数量最多的一束玫瑰花枝数最少，则另外两束玫瑰花枝数要尽可能多，设数量最多的一束玫瑰花最少有x枝，又因3束玫瑰花枝数各不相同，可得玫瑰花枝数如下：\n\u003cimg data-k=\"3b40d93cdcc4\" style=\"max-width:600px\">\n根据玫瑰花总共有59枝，可列式：x+x-1+x-2=59，解得\u003cimg data-k=\"b060c46bdda4\">，问最少，向上取整21枝。\n故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"13319486","cat":"数学运算","stem":"某地考古出土了一种呈长方体的青铜器，测得其长、宽、高分别为60cm、40cm、60cm。为了防止氧化，有关部门为其做个半球形的保护罩，则该保护罩（厚度忽略不计）的表面积至少为（    ）。","options":{"A":"\u003cimg data-k=\"a4cf90a95079\">","B":"\u003cimg data-k=\"b31f9b400180\">","C":"\u003cimg data-k=\"5d15eb0a0b47\">","D":"\u003cimg data-k=\"65423e1d8cc9\">"},"answer":"C","explanation":"\u003cimg data-k=\"2609a8740d58\" style=\"max-width:400px\">\n如图所示，使半球形保护罩既能罩住长方体又表面积最小，则长方体顶点A、B、C、D均与球面相切，O为底面中点，连接OA即为球体的半径。连接\u003cimg data-k=\"b5331f7b55fd\">，则\u003cimg data-k=\"b5331f7b55fd\">是长方形\u003cimg data-k=\"5f45cfdc1236\">对角线\u003cimg data-k=\"a9d33043d31d\">的一半，且\u003cimg data-k=\"290b49b776c2\">\u003cimg data-k=\"cdaa67c26678\">，\u003cimg data-k=\"11cdb9728e11\">\u003cimg data-k=\"c856c627f51c\">，则根据勾股定理，\u003cimg data-k=\"a9d33043d31d\">\u003cimg data-k=\"5f20b3551fb7\">\u003cimg data-k=\"1261ff44e905\">，\u003cimg data-k=\"0ab0327b5c30\">。因为三角形\u003cimg data-k=\"c2442091976b\">为直角三角形，且\u003cimg data-k=\"a04c9db48cee\">，则根据勾股定理，\u003cimg data-k=\"0196140294f9\">\u003cimg data-k=\"e486f69a8dba\">。根据公式：球体表面积\u003cimg data-k=\"7261378cb505\">\u003cimg data-k=\"1c6f49afa859\">，可得该保护罩的表面积为\u003cimg data-k=\"bec4a109d88b\">。\n故正确答案为C。\n备注： ①本题所求保护罩的表面积不包含底面。因为通常所说的“罩子”是没有底面的，即使罩子有底面，往往底面材质和罩子材质也不一样，会更厚一些，和题目中厚度忽略不计矛盾，故本题答案不能为A。\n②由于本题的长方体是文物，因此不能随意调整摆放的情况，即不能以40cm为高算最值，故本题答案不能为D。","no":65,"missingImage":false},{"type":"question","qid":"11226498","cat":"数学运算","stem":"为了丰富居民的业余生活，区政府拟在花苑小区西面围墙外的空地上，修建一个矩形文化广场，广场的一边为小区围墙。现沿广场周边植树，相邻两棵树、最东边的树与围墙的间隔最多为4m，且远离围墙的两个角上都植树。已知围墙一侧无需植树，最终共植树63棵，那么文化广场的最大面积为：","options":{"A":"7442","B":"7848","C":"8192","D":"8498"},"answer":"C","explanation":"由题意可知，相邻两棵树、最东边的树与围墙的间隔取最大值4m时，文化广场的边长最大，此时文化广场的面积最大。设与围墙相垂直的两条边均植树x棵，则与围墙相垂直的边长均为4xm。由于围墙一侧无需植树且最终共植树63棵，则与围墙相平行的边植树63-2x+2=（65-2x）棵，则与围墙相平行的边长为\u003cimg data-k=\"2a256f13a2d0\">。设文化广场的面积为\u003cimg data-k=\"a2a0dd5c22f3\">，则\u003cimg data-k=\"a883a343e595\">，令y=0，解得\u003cimg data-k=\"1a7bf3c27aef\">，\u003cimg data-k=\"5611d9978adf\">，当\u003cimg data-k=\"398566b58b10\">时，y取最大值。则文化广场的最大面积为\u003cimg data-k=\"823235720638\">。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"13319483","cat":"数学运算","stem":"某5A级景区门票90元/人，教师免票、大学生半票，乘坐索道另付70元/人。某校教师和大学生共110人到该景区研学，若支付的门票和索道费共11750元，则参与研学的教师有（    ）。","options":{"A":"6人","B":"10人或20人","C":"10人","D":"6人或20人"},"answer":"D","explanation":"设参与研学的教师有x人，则参与研学的大学生有（110-x）人；设乘坐索道的有y人，则未乘坐索道的有（110-y）人。根据题意，大学生半票后为\u003cimg data-k=\"1dafe488ac40\">元/人，则门票费共\u003cimg data-k=\"e66f516f2e05\">元；索道费共70y元。根据“若支付的门票和索道费共11750元”，可列方程45×（110-x）+70y=11750，整理得14y-9x=1360。优先考虑代入选项进行验证，代入x=6，解得y=101，符合题意；代入x=10，解得\u003cimg data-k=\"7085d12e2ef7\">，为非整数，不符合题意，排除；代入x=20，解得y=110，符合题意。综上，参与研学的教师有6人或20人。\n故正确答案为D。\n备注：此题表述不太严谨，可以选择乘坐索道也可以选择不乘坐索道，若更改表述为“若乘坐索道另付70元/人”，会更加严谨。","no":67,"missingImage":false},{"type":"question","qid":"13319485","cat":"数学运算","stem":"某科技园区计划铺设电缆联通A、B、C、D、E、F六栋办公楼，可以铺设电缆的线路如下图所示，每条边上的数字表示两栋楼之间线路的长度（单位：10米），则铺设电缆的总长度最短是（    ）。\n\u003cimg data-k=\"a9383080d486\" style=\"max-width:278px\">","options":{"A":"280米","B":"290米","C":"310米","D":"350米"},"answer":"B","explanation":"若要铺设电缆总长度最短，则铺设的线路应尽量少且每条线路的长度应尽量短。六栋办公楼，最少需要5条线路即可联通。最短路径优先，选择AB、AC、CF、BE、AD，此时六栋楼均被连通且铺设电缆的总长度最短，故所求为（4+5+6+7+7）×10=290米。\n故正确答案为B。","no":68,"missingImage":false}],"count":18,"answerable":18,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>在环太湖自行车比赛中，冲刺阶段排在前四位的是甲、乙、丙、丁四名选手（如图，圆圈表示选手），他们来自江苏、上海、浙江和安徽，所骑自行车颜色是蓝色、灰色、白色和黄色。已知：\u003c/p>\u003cp>（1）江苏选手在选手丙的东南面；\u003c/p>\u003cp>（2）上海选手在赛道的东部位置，他所骑自行车是蓝色的；\u003c/p>\u003cp>（3）骑灰色自行车的选手不是排在第四位；\u003c/p>\u003cp>（4）选手丁排在第三位，选手乙来自浙江；\u003c/p>\u003cp>（5）安徽选手排在骑黄色自行车的选手之前，排在选手甲之后。\u003c/p>\u003cp>\u003cimg data-k=\"38117aa9e73e\" style=\"max-width:300px\">\u003c/p>","questions":[{"qid":"11367790","cat":"逻辑判断","stem":"根据上述信息，可以推出以下哪项？","options":{"A":"甲来自江苏，排第二位","B":"乙来自浙江，排第四位","C":"丙来自安徽，排第一位","D":"丁来自上海，排第三位"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）江苏选手在选手丙的东南面；\n（2）上海选手在赛道的东部位置，他所骑自行车是蓝色的；\n（3）骑灰色自行车的选手不是排在第四位；\n（4）选手丁排在第三位，选手乙来自浙江；\n（5）安徽选手排在骑黄色自行车的选手之前，排在选手甲之后。\n第二步：根据题干条件进行推理。\n根据条件（1）江苏选手在丙的东南面，可以推出丙是第2名，江苏选手是第3名；\n根据条件（2）上海选手在赛道东部以及江苏选手是第3名，可以推出上海选手是第1名，且自行车是蓝色的；\n根据条件（3）以及第1名自行车是蓝色的，可以推出灰色自行车的选手不是第2名，就是第3名；\n根据条件（4）以及江苏选手是第3名，可以推出丁是江苏选手；\n根据条件（5）、上海选手是第1名以及江苏选手是第3名，可以推出安徽选手是第2名，甲是第1名，具体如下表所示。\n\u003cimg data-k=\"3d92ee12acb8\" style=\"max-width:522px\">\n综合上述结论，可以推出第4名是乙，来自浙江，B项当选。\n故正确答案为B。","no":69,"missingImage":false},{"qid":"11367792","cat":"逻辑判断","stem":"如果丙所骑自行车是白色，则可以推出以下哪项？","options":{"A":"选手甲所骑自行车不是蓝色的","B":"选手乙所骑自行车是灰色的","C":"安徽选手所骑自行车是黄色的","D":"江苏选手所骑自行车是灰色的"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）江苏选手在选手丙的东南面；\n（2）上海选手在赛道的东部位置，他所骑自行车是蓝色的；\n（3）骑灰色自行车的选手不是排在第四位；\n（4）选手丁排在第三位，选手乙来自浙江；\n（5）安徽选手排在骑黄色自行车的选手之前，排在选手甲之后；\n（6）丙的自行车是白色的。\n第二步：根据题干条件进行推理。\n根据上一题的结论，第1名为选手甲，来自上海，自行车是蓝色的，排除A项；\n根据条件（6）丙的自行车是白色的，结合上一题的结论可以推出第2名为选手丙，来自安徽，自行车是白色的，排除C项；\n再根据条件（3）骑灰色自行车的选手不是排在第四位，结合上一题的结论可以推出第3名选手丁来自江苏，自行车是灰色的，那么第4名选手乙来自浙江，自行车是黄色的（具体如下表所示），D项当选。\n\u003cimg data-k=\"da0f945d863f\" style=\"max-width:550px\">\n故正确答案为D。","no":70,"missingImage":false},{"qid":"12100994","cat":"类比推理","stem":"柿子：柿饼","options":{"A":"土豆：土豆泥","B":"花生：花生糖","C":"椰子：椰子汁","D":"葡萄：葡萄干"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“柿子”是制作“柿饼”的原材料，二者为原材料与成品的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“土豆”是制作“土豆泥”的原材料，二者为原材料与成品的对应关系，与题干逻辑关系一致，保留；\nB项：“花生”是制作“花生糖”的原材料，二者为原材料与成品的对应关系，与题干逻辑关系一致，保留；\nC项：“椰子”是制作“椰子汁”的原材料，二者为原材料与成品的对应关系，与题干逻辑关系一致，保留；\nD项：“葡萄”是制作“葡萄干”的原材料，二者为原材料与成品的对应关系，与题干逻辑关系一致，保留。\n对比A、B、C、D四项，题干“柿子”制成“柿饼”和D项“葡萄”制成“葡萄干”的过程中都需要经过“晾晒”，而A项“土豆”制成“土豆泥”、B项“花生”制成“花生糖”、C项“椰子”制成“椰子汁”均不需要经过“晾晒”，故D项与题干逻辑关系更为一致，当选。\n故正确答案为D。","no":71,"missingImage":false},{"qid":"11367762","cat":"类比推理","stem":"舍本：逐末","options":{"A":"买椟：还珠","B":"取长：补短","C":"避重：就轻","D":"趋炎：附势"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“舍本逐末”指舍弃事物的根本的、主要的部分，而去追求细枝末节，指轻重倒置。“舍本”和“逐末”是并列关系，且“舍”和“逐”、“本”和“末”均是反义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“买椟还珠”指买了装了珍珠的木匣退还了珍珠。“买椟”和“还珠”是并列关系，但“买”和“还”、“椟”和“珠”均不是反义关系，与题干逻辑关系不一致，排除；\nB项：“取长补短”指吸取别人的长处，弥补自己的短处。“取长”是为了“补短”，二者是方式目的的对应关系，且“取”和“补”不是反义关系，与题干逻辑关系不一致，排除；\nC项：“避重就轻”指避开重要的而拣次要的来承担，也指回避主要的问题，只谈无关紧要的方面。“避重”和“就轻”是并列关系，其中“就”指凑近、靠近，“避”和“就”、“重”和“轻”均是反义关系，与题干逻辑关系一致，当选；\nD项：“趋炎附势”指奉承、依附有权有势的人。“趋炎”和“附势”是并列关系，但“趋”和“附”、“炎”和“势”均不是反义关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":72,"missingImage":false},{"qid":"11367764","cat":"类比推理","stem":"热极生风：穷极思变","options":{"A":"鼓空声高：人狂话大","B":"绳锯木断：水滴石穿","C":"人闲生病：石闲生苔","D":"得道多助：失道寡助"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“热极生风”意思是一个地方热得太厉害，不久便会产生大风；“穷极思变”意思是在穷困艰难的时候，就要想办法改变现状。二者无明显语义关系，考虑拆分。因为“热极”所以“生风”，因为“穷极”所以“思变”，二者拆分之后均为因果关系，且“热极生风”和“穷极思变”均可指“事物在极端状态下会发生变化”。\n第二步：判断选项词语间逻辑关系。\nA项：“鼓空声高”意思是鼓里面是空的时候声音反而大；“人狂话大”意思是没有真才实学的人往往狂妄自大，好说大话，喜欢吹牛。因为“鼓空”所以“声高”，因为“人狂”所以“话大”，二者拆分之后均为因果关系，但“鼓空声高”无法指“事物在极端状态下会发生变化”，与题干逻辑关系不一致，排除；\nB项：“绳锯木断”意思是以绳当锯，也能锯断木头；“水滴石穿”意思是水滴不断地滴，可以滴穿石头。因为“绳锯”所以“木断”，因为“水滴”所以“石穿”，二者拆分之后均为因果关系，但“绳锯木断”和“水滴石穿”均无法指“事物在极端状态下会发生变化”，与题干逻辑关系不一致，排除；\nC项：“人闲生病”意思是人闲得无聊就容易生病；“石闲生苔”意思是闲置的石头很容易长出青苔。因为“人闲”所以“生病”，因为“石闲”所以“生苔”，二者拆分之后均为因果关系，且“人闲生病”和“石闲生苔”均可指“事物在极端状态下会发生变化”，与题干逻辑关系一致，当选；\nD项：“得道多助”意思是坚持正义就能得到多方面的支持与帮助；“失道寡助”意思是违背正义必然陷于孤立。因为“得道”所以“多助”，因为“失道”所以“寡助”，二者拆分之后均为因果关系，但“得道多助”和“失道寡助”均无法指“事物在极端持续状态下会发生变化”，与题干逻辑关系不一致，排除。\n故正确答案为C。\n本题为争议题。若看题干第一个词“热极生风”与物有关，第二个词“穷极思变”与人有关；A项第一个词“鼓空声高”与物有关，第二个词“人狂话大”与人有关，C项刚好顺序反了，也有同学会选择A项，此考法历年真题也确实考过。两种理解方式均有合理之处，考生无需过于纠结不严谨的题，重点学习此类题的解题思路即可，这种同时涉及物和人的成语或诗句可能会考查的两个角度，一是具体意思的类似，二是由物到人或由人到物的类比。","no":73,"missingImage":false},{"qid":"12100995","cat":"类比推理","stem":"石刻：石头：木头","options":{"A":"版画：铁板：竹板","B":"根雕：树根：草根","C":"茶道：茶具：餐具","D":"剧本：小说：评说"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“石刻”是运用雕刻的技法在石质材料上创造出具有实在体积的各类艺术品，“石刻”是在“石头”上进行雕刻，前两词是原材料与成品的对应关系，“石头”和“木头”是并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：“版画”是以刀或化学药品等在木、石、麻胶、铜、锌等版面上雕刻或蚀刻后印刷出来的图画，“版画”可以在“铁板”上雕刻，也可以在“竹板”上雕刻，第二词和第三词均可以是第一词的原材料，与题干逻辑关系不一致，排除；\nB项：“根雕”是在“树根”上进行雕刻，前两词是原材料与成品的对应关系，且“树根”和“草根”是并列关系，与题干逻辑关系一致，当选；\nC项：“茶具”和“餐具”是并列关系，但“茶具”是“茶道”中使用的工具，前两词是工具的对应关系，与题干逻辑关系不一致，排除；\nD项：“剧本”是戏剧作品，“小说”是一种叙事性的文学体裁，“评说”是指评论、评价，前两词不是原材料与成品的对应关系，且后两词并非并列关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":74,"missingImage":false},{"qid":"11367768","cat":"类比推理","stem":"压舱石：就业：社会稳定","options":{"A":"先手棋：专利：科技创新","B":"基本盘：耕地：粮食生产","C":"晴雨表：管理：人才培养","D":"主阵地：学校：知识传播"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“压舱石”本意为船舶、飞机等交通工具上为了保持平衡和稳定而放置的重物，后比喻对事物发展起到稳定、支撑作用的关键因素、重要力量或基础保障。“就业”是“社会稳定”的“压舱石”，三者为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“先手棋”本来指围棋、象棋等棋类游戏中，先走的一方所下的第一步棋，具有争取主动的优势，后引申为在竞争、行动等过程中，为了占据主动地位而采取的第一步或关键的起始行动、策略等。“专利”不是“科技创新”的“先手棋”，三者不构成对应关系，与题干逻辑关系不一致，排除；\nB项：“基本盘”指事物最基础、最根本的部分。“耕地”是“粮食生产”的“基本盘”，三者为对应关系，与题干逻辑关系一致，保留；\nC项：“晴雨表”比喻能敏锐地反映某种变化或在事情发生前出现征兆的事物。“管理”不是“人才培养”的“晴雨表”，三者不构成对应关系，与题干逻辑关系不一致，排除；\nD项：“主阵地”指在军事作战中，军队主要据守和作战的地区或位置，现在常用来指在某个领域、行业或工作中，起主导、核心作用，集中力量进行主要活动或发挥主要作用的地方、领域或平台等。“学校”是“知识传播”的“主阵地”，三者为对应关系，与题干逻辑关系一致，保留。\n对比B、D两项，题干的“压舱石”强调“就业”是维持“社会稳定”的重要基础和关键因素，对“社会稳定”起着支撑作用，B项的“基本盘”强调“耕地”是“粮食生产”的根本和基础，对“粮食生产”起着支撑作用，而D项的“主阵地”没有体现这种基础和支撑作用。且题干的“压舱石”和B项的“基本盘”都是物品，而D项的“主阵地”为地点，故B项与题干逻辑关系更为一致，当选。\n故正确答案为B。","no":75,"missingImage":false},{"qid":"12100993","cat":"类比推理","stem":"沿海港口：上海港：国际大港","options":{"A":"跨境班列：中欧班列：长途班列","B":"舆情监测：风险监测：环境监测","C":"纳米技术：纳米科学：前沿科学","D":"纸媒广告：传单广告：杂志广告"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“上海港”位于中国大陆海岸线中部，长江与东海交汇处，是中国沿海的主要枢纽港，也是中国对外开放，参与国际经济大循环的重要口岸。“上海港”既是“沿海港口”，又是“国际大港”，第二词分别与第一词、第三词构成种属关系，第一词和第三词构成交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：“中欧班列”既是“跨境班列”，又是“长途班列”，第二词分别与第一词、第三词构成种属关系，第一词和第三词构成交叉关系，与题干逻辑关系一致，当选；\nB项：“舆情监测”和“环境监测”是两种不同类型的监测，二者为并列关系，与题干逻辑关系不一致，排除；\nC项：“纳米科学”是“纳米技术”的基础，二者为对应关系，与题干逻辑关系不一致，排除；\nD项：“传单广告”和“杂志广告”是广告的不同形式，二者为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":76,"missingImage":false},{"qid":"11367776","cat":"类比推理","stem":"温室效应：冰山融化：海面上升","options":{"A":"博览群书：视野开阔：见解深刻","B":"连日降雪：道路结冰：出行困难","C":"电闪雷鸣：狂风大作：沙尘肆虐","D":"刻苦训练：技能提高：获得金牌"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n因为“温室效应”，所以“冰山融化”；因为“冰山融化”，所以“海面上升”，三者为连续因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：因为“博览群书”，所以“视野开阔”；因为“视野开阔”，所以“见解深刻”，三者为连续因果对应关系，与题干逻辑关系一致，保留；\nB项：因为“连日降雪”，所以“道路结冰”；因为“道路结冰”，所以“出行困难”，三者为连续因果对应关系，与题干逻辑关系一致，保留；\nC项：“电闪雷鸣”“狂风大作”“沙尘肆虐”是不同的天气现象，三者不是连续因果对应关系，与题干逻辑关系不一致，排除；\nD项：因为“刻苦训练”，所以“技能提高”；因为“技能提高”，所以“获得金牌”，三者为连续因果对应关系，与题干逻辑关系一致，保留。\n对比A、B、D三项，题干和B项的初始原因均为自然原因，带来的均为消极结果，但A、D两项初始原因为人为原因，带来的为积极结果，B项与题干逻辑关系更为一致，当选。\n故正确答案为B。","no":77,"missingImage":false},{"qid":"11367770","cat":"类比推理","stem":"苍鹰：鸿雁：书信","options":{"A":"加油：注水：鼓劲","B":"下海：上岸：录取","C":"须眉：巾帼：围脖","D":"疆域：河山：国土"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“苍鹰”和“鸿雁”都是鸟类，二者为并列关系；“鸿雁”是书信的代称，可以比喻“书信”，第二词与第三词构成比喻象征义，且第一词与第三词无必然逻辑关系。\n第二步：判断选项词语间逻辑关系。\nA项：“加油”和“注水”都是动作，二者为并列关系；“加油”可用于支持，指勉励他人或自己，可以比喻“鼓劲”，第一个词与第三个词构成比喻象征义，词语顺序与题干不一致，与题干逻辑关系不一致，排除；\nB项：“下海”和“上岸”都是动作，二者为并列关系；“上岸”指舍舟登陆，也指考生被录取，可以比喻“录取”，第二词与第三词构成比喻象征义，且第一词与第三词无必然逻辑关系，与题干逻辑关系一致，当选；\nC项：“须眉”指胡须和眉毛，也可以比喻男子，“巾帼”指古代妇女的头巾和发饰，也可以比喻女子，二者为并列关系；但“巾帼”不能比喻“围脖”，与题干逻辑关系不一致，排除；\nD项：“疆域”指国家领土，“河山”指国家的疆土，“国土”指国家的领土，第一个词和第三个词意思一致，二者为全同关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":78,"missingImage":false},{"qid":"11367771","cat":"类比推理","stem":"生肖 之于 （    ） 相当于 （    ） 之于 禁行","options":{"A":"飞禽 路口","B":"走兽 信号","C":"天干 通行","D":"地支 红灯"},"answer":"D","explanation":"逐一代入选项。\nA项：飞禽指会飞的鸟类，也泛指鸟类。有的生肖是飞禽（如，鸡），有的生肖不是飞禽，有的飞禽是生肖，有的飞禽不是生肖，二者为交叉关系；在路口可以禁行，二者为对应关系，前后逻辑关系不一致，排除；\nB项：走兽泛指兽类。有的生肖是走兽（如，牛），有的生肖不是走兽，有的走兽是生肖，有的走兽不是生肖，二者为交叉关系；禁行是一种信号，二者为种属关系，前后逻辑关系不一致，排除；\nC项：天干是对甲、乙、丙、丁、戊、己、庚、辛、壬、癸的统称，传统用作表示次序的符号，和生肖无明显逻辑关系；通行和禁行为反义关系，前后逻辑关系不一致，排除；\nD项：地支是对子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥的统称，生肖是代表十二地支而用来记人的出生年的十二种动物，子属鼠、丑属牛、寅属虎、卯属兔、辰属龙、巳属蛇、午属马、未属羊、申属猴、酉属鸡、戌属狗、亥属猪，二者有紧密的对应关系；红灯指红色的交通信号灯，红灯亮时表示禁止通行，二者有紧密的对应关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":79,"missingImage":false},{"qid":"12101002","cat":"类比推理","stem":"月饼 之于 （    ） 相当于 旅游 之于 （    ）","options":{"A":"传统节日 高速公路","B":"中式糕点 休闲活动","C":"手工食品 异国风情","D":"家庭团圆 探索自然"},"answer":"B","explanation":"逐一代入选项。\nA项：“月饼”是“传统节日”中秋节的时节食品，二者是食品与节日场景的对应关系；“旅游”途中可能会经过“高速公路”，二者是休闲活动与道路建设的对应关系，前后逻辑关系不一致，排除；\nB项：“月饼”是一种“中式糕点”，二者为种属关系；“旅游”是一种“休闲活动”，二者为种属关系，前后逻辑关系一致，当选；\nC项：有的“月饼”是“手工食品”，有的“月饼”不是“手工食品”，有的“手工食品”是“月饼”，有的“手工食品”不是“月饼”，二者为交叉关系；“旅游”可以感受“异国风情”，二者是休闲活动与感受的对应关系，前后逻辑关系不一致，排除；\nD项：“月饼”象征“家庭团圆”，二者为比喻象征义，“旅游”是为了“探索自然”，二者为方式目的的对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":80,"missingImage":false},{"qid":"12100999","cat":"图形推理","stem":"请从四个选项中选出最恰当的一项填入问号处，使题干图形呈现一定的规律性。\n\u003cimg data-k=\"e88838ac90c8\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。题干均为封闭区域明显的生活化图形，考虑数面数量，面数量依次为3、4、5、6、7，故？处图形的面数量应为8，只有A项符合。\n故正确答案为A。","no":81,"missingImage":false},{"qid":"12100997","cat":"图形推理","stem":"请从四个选项中选出最恰当的一项填入问号处，使题干图形呈现一定的规律性。\n\u003cimg data-k=\"5955dfe06015\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，且属性规律无答案，考虑数量规律。观察发现，题干图形中的曲线和直线均有明显相交，考虑曲直交点数。题干图形的曲直交点数均为1，故？处应选择有1个曲直交点的图形，只有B项符合。\n故正确答案为B。","no":82,"missingImage":false},{"qid":"12100996","cat":"图形推理","stem":"请从四个选项中选出最恰当的一项填入问号处，使题干图形呈现一定的规律性。\n\u003cimg data-k=\"0d9b4f5d2a11\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，优先考虑属性规律。观察发现，题干图形出现明显等腰元素，优先考虑对称性。题干图形均只有一条对称轴，且对称轴方向依次为竖向、横向、竖向、横向、竖向，故“？”处图形应只有一条对称轴，且为横向，排除B、C两项；继续观察发现，题干图形线条交叉明显，考虑交点数，题干图形的交点数依次为2、3、4、5、6，故“？”处图形的交点数应为7，只有D项符合。\n故正确答案为D。","no":83,"missingImage":false},{"qid":"11367773","cat":"图形推理","stem":"请从四个选项中选出最恰当的一项填入问号处，使题干图形呈现一定的规律性。\n\u003cimg data-k=\"1371077fddbf\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干出现多个 “日”字变形图，考虑笔画数。题干图形均为一笔画图形，？处应用规律，排除A、B两项；继续观察发现，题干每幅图形均存在两个三角形面，故？处应选一个存在两个三角形面的图形，只有C项符合。\n故正确答案为C。","no":84,"missingImage":false},{"qid":"12101004","cat":"图形推理","stem":"请从四个选项中选出最恰当的一项填入问号处，使题干图形呈现一定的规律性。\n\u003cimg data-k=\"62208aab03ea\" style=\"max-width:400px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相似，优先考虑样式规律。观察发现，题干图形轮廓和分割区域相同，考虑黑白运算。九宫格优先看横行，第一行运算规律为：黑+白=黑，白+黑=黑，黑+黑=白，白+白=白；第二行经验证符合此规律；第三行应用此规律，只有C项符合。\n故正确答案为C。","no":85,"missingImage":false},{"qid":"12100998","cat":"图形推理","stem":"左边给定的图形是由右边哪些图形拼合（只可平移，不可旋转和翻转）而成的？\n\u003cimg data-k=\"a184d623688e\" style=\"max-width:600px\">","options":{"A":"①②③④","B":"①②③⑤","C":"②③④⑤","D":"①③④⑤"},"answer":"B","explanation":"本题考查平面拼合，可采用平行且等长相消的方式解题。左边给定的图形是由右边①②③⑤拼合而成的。平行且等长相消的方式如下图所示：\n\u003cimg data-k=\"b453c25bffcb\" style=\"max-width:192px\">\n故正确答案为B。","no":86,"missingImage":false},{"qid":"12101015","cat":"类比推理","stem":"上边四张纸片，每张纸片一面是黑色，另一面是白色，下边仅有一项能由它们拼合（可以平移、旋转、翻转）而成，请把它找出来。\n\u003cimg data-k=\"91342b7e8249\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查平面拼合，可以平移、旋转、翻转，且每张纸片一面是黑色，另一面是白色，需要考虑翻转后的颜色变化。将题干图形标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"8cd9168e0078\" style=\"max-width:500px\">\nA项：可以由题干图形拼合而成，拼合方式如图所示，当选；\nB项：右上角的两个三角形是由图②和图③旋转后平移过去的，颜色都应该是黑色，而选项是白色，排除；\nC项：右上角的三角形是图②，颜色无误，但其下方的白块与题干图形的形状均不相同，无法由题干图形拼合而成，排除；\nD项：右上角的三角形是图②，颜色无误，但其下方的白块无法由题干图形拼合而成，排除。\n故正确答案为A。","no":87,"missingImage":false},{"qid":"12101006","cat":"图形推理","stem":"左边给定的是六面体的外表面展开图，右边哪一项能由它折叠而成?\n\u003cimg data-k=\"7e7382c5f6a5\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"将题干展开图标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"99302db23c16\" style=\"max-width:600px\">\nA项：选项的正面和顶面来自面e、面f、面i、面k，题干展开图中面e、面f、面i、面k任意面中的线条均与另一个面中的线条相交于公共边的中点，而选项中正面中的线条与顶面中的线条不相交，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"ee49d27a3d4d\" style=\"max-width:600px\">\nB项：选项一定有面g与面h，且选项中三个面的公共点挨着顶面中的线条，故选项由面f、面g与面h构成。题干展开图中面g中的直角三角形挨着面f中的直角梯形，而选项中面g中的直角三角形挨着面f中的直角三角形，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"b7f4e6364503\" style=\"max-width:600px\">\nC项：选项由面g、面i与面k构成，选项与题干展开图一致，当选；\n\u003cimg data-k=\"5253c952f1db\" style=\"max-width:600px\">\nD项：选项一定有面g与面h，且选项中三个面的公共点不挨着顶面中的线条，故选项由面g、面h与面i构成。题干展开图中这三个面的公共点挨着面i中的直角梯形，而选项中这三个面的公共点挨着面i中的直角三角形，选项与题干展开图不一致，排除。\n\u003cimg data-k=\"4c97e1526b31\" style=\"max-width:600px\">\n故正确答案为C。","no":88,"missingImage":false},{"qid":"12101001","cat":"图形推理","stem":"左边给定的是六面体的外表面展开图，右边哪一项能由它折叠而成？\n\u003cimg data-k=\"309f21d79a89\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查六面体。将展开图中右下角的面移动，并给每个面标号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"977b4a481624\" style=\"max-width:658px\">\nA项：选项一定有面i和面f，右面为面e或面k，展开图中面f和面k为相对面，无法同时出现，故右面为面e。展开图中面e、面f和面i的公共点引出一条线，而选项中三个面的公共点引出两条线，选项与题干展开图不一致，排除；\nB项：选项由面e、面g与面k构成，选项与题干展开图一致，当选；\nC项：选项一定有面h和面i，展开图中面h与面i的公共边挨着面h中的两条线，而选项中两个面的公共边只挨着面h中的一条线，选项与题干展开图不一致，排除；\nD项：选项由面f、面h和面i构成，展开图中三个面的公共点引出两条线，而选项中三个面的公共点只引出一条线，选项与题干展开图不一致，排除。\n故正确答案为B。","no":89,"missingImage":false},{"qid":"11367788","cat":"图形推理","stem":"下面4个立体图形均由大小相同的8个白色小立方体和4个灰色小立方体堆叠而成，其中一个立体图形的某一视图可能是由纯白小方格组成的，请把它找出来。\n\u003cimg data-k=\"81228cae1352\" style=\"max-width:501px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查三视图。A、B、C三项中的立体图形不可能某一视图由纯白小方格组成，排除。D项中，立体图形的正面能看到7个白色小立方体和3个灰色小立方体，所以其背面应还有1个白色小立方体和1个灰色小立方体。如下图所示，当灰色小立方体在最下层摆放，白色小立方体摆放在该灰色小立方体的上方时，其俯视图由纯白小方格组成。\n\u003cimg data-k=\"569210208a35\" style=\"max-width:317px\">\n故正确答案为D。","no":90,"missingImage":false},{"qid":"11367777","cat":"逻辑判断","stem":"只有为了人民的现代化，才有意义；只有依靠人民的现代化，才有动力。新时代以来，我们坚持民生为大，书写了经济快速发展和社会长期稳定两大奇迹新篇章。只要坚持一切为了人民、一切依靠人民，就能充分调动广大人民的积极性。\n根据以上信息，可以推出以下哪项？","options":{"A":"不是为了人民的现代化，就是没有意义的现代化","B":"不坚持民生为大，就不能创造经济快速发展和社会长期稳定两大奇迹","C":"如果没能调动广大人民的积极性，则没有坚持一切为了人民","D":"只有坚持一切依靠人民，才能充分调动广大人民的积极性"},"answer":"A","explanation":"第一步：翻译题干。\n①现代化有意义\u003cimg data-k=\"a37757d411ef\">为了人民的现代化；\n②现代化有动力\u003cimg data-k=\"a37757d411ef\">依靠人民的现代化；\n③坚持一切为了人民 且 坚持一切依靠人民\u003cimg data-k=\"a37757d411ef\">充分调动广大人民的积极性。\n第二步：逐一分析选项。\nA项：翻译为“\u003cimg data-k=\"0be436194951\">为了人民的现代化\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">现代化有意义”，是对①的否后，否后必否前，可以推出，当选；\nB项：翻译为“\u003cimg data-k=\"0be436194951\">坚持民生为大\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">创造经济快速发展和社会长期稳定两大奇迹”，二者不存在逻辑关系，无法推出，排除；\nC项：翻译为“\u003cimg data-k=\"0be436194951\">调动广大人民的积极性\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">坚持一切为了人民”，是对③的否后，否后必否前，即“\u003cimg data-k=\"0be436194951\">充分调动广大人民的积极性\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">坚持一切为了人民 或 \u003cimg data-k=\"0be436194951\">坚持一切依靠人民”，无法得出“\u003cimg data-k=\"0be436194951\">坚持一切为了人民”一定为真，无法推出，排除；\nD项：翻译为“充分调动广大人民的积极性\u003cimg data-k=\"a37757d411ef\">坚持一切依靠人民”，是对③的肯后，但肯后得不到确定性的结论，无法推出，排除。\n故正确答案为A。","no":91,"missingImage":false},{"qid":"11367772","cat":"逻辑判断","stem":"“露从今夜白，月是故乡明。”唐代诗人杜甫这一千古名句表达了诗人在秋天对故乡的思念和对亲人的牵挂。在国人心中，秋天总是和思乡联系在一起。对此，有学者称，相对于其他季节，秋天人们很容易想起家乡的种种美好，更容易产生思乡情绪。\n以下哪项如果为真，最能支持上述学者的观点？","options":{"A":"秋天大自然由生机勃勃转向秋风萧瑟，让人感受到时间的流逝和生命的脆弱","B":"秋天正是收获的时节，那些从小经历的美好场景深深刻在每个人的心底","C":"中国历史上有无数文人骚客在秋天写下思乡的千古名篇，影响着一代又一代国人","D":"每逢中秋，在外漂泊的游子会意识到已经离家很久，渴望和家人团聚"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：相对于其他季节，秋天人们很容易想起家乡的种种美好，更容易产生思乡情绪。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出秋天让人感受到“时间的流逝和生命的脆弱”，但并未说明此种感受是否会引发“思乡情绪”，话题不一致，无法加强，排除；\nB项：该项指出秋天正是收获的时节，那些“从小经历的美好场景”深深刻在每个人的心底，解释了为什么秋天容易让人们想起“家乡的种种美好”，更容易让人们产生“思乡情绪”，补充论据，可以加强，保留；\nC项：该项指出国人思乡是因为受到文人骚客写下的关于思乡的千古名篇的影响，解释了一代又一代国人思乡的原因，补充论据，可以加强，保留；\nD项：该项指出“中秋”会触发游子的“思乡情绪”，“中秋”是秋天的一个节日，无法判断是节日还是秋天这个季节容易让人们产生思乡情绪，为不明确项，无法加强，排除。\n对比B、C两项，B项解释了为什么每个人会发自心底的产生思乡之情，而C项只是在说思乡是受到了文人骚客的影响，但是发自心底的原因比他人带来的影响更为关键，因此B项加强力度更强。\n故正确答案为B。","no":92,"missingImage":false},{"qid":"12101007","cat":"类比推理","stem":"有些作家不用电脑写作，所有作家都不喜欢喧嚣。所以，有些用电脑写作的人喜欢喧嚣。\n以下哪项与上述推理的结构和错误最为相似？","options":{"A":"有些医生热爱运动，所有医生都不想损害健康。所以，有些不热爱运动的人不想损害健康","B":"有些中年人不爱喝咖啡，所有中年人都不愿意频繁更换手机。所以，有些爱喝咖啡的人愿意频繁更换手机","C":"有些世界文学名著没有汉译本，所有世界文学名著都不是脱离现实的作品。所以，有些没有脱离现实的作品没有汉译本","D":"有些网球运动员不是职业运动员，所有网球运动员都想获得冠军。所以，有些职业运动员想获得冠军"},"answer":"B","explanation":"第一步：分析题干推理形式。\n题干推理形式为：有些a（作家）\u003cimg data-k=\"a37757d411ef\">非b（用电脑写作），所有a（作家）\u003cimg data-k=\"a37757d411ef\">非c（喜欢喧嚣）。所以，有些b（用电脑写作）\u003cimg data-k=\"a37757d411ef\">c（喜欢喧嚣）。\n第二步：逐一分析选项。\nA项：推理形式为：有些a（医生）\u003cimg data-k=\"a37757d411ef\">b（热爱运动），所有a（医生）\u003cimg data-k=\"a37757d411ef\">非c（损害健康）。所以，有些非b（热爱运动）\u003cimg data-k=\"a37757d411ef\">非c（损害健康），与题干推理结构不同，排除；\nB项：推理形式为：有些a（中年人）\u003cimg data-k=\"a37757d411ef\">非b（爱喝咖啡），所有a（中年人）\u003cimg data-k=\"a37757d411ef\">非c（愿意频繁更换手机）。所以，有些b（爱喝咖啡）\u003cimg data-k=\"a37757d411ef\">c（愿意频繁更换手机），与题干推理结构相同，当选；\nC项：推理形式为：有些a（世界文学名著）\u003cimg data-k=\"a37757d411ef\">非b（有汉译本），所有a（世界文学名著）\u003cimg data-k=\"a37757d411ef\">非c（脱离现实的作品）。所以，有些非c（脱离现实的作品）\u003cimg data-k=\"a37757d411ef\">非b（有汉译本），与题干推理结构不同，排除；\nD项：推理形式为：有些a（网球运动员）\u003cimg data-k=\"a37757d411ef\">非b（职业运动员），所有a（网球运动员）\u003cimg data-k=\"a37757d411ef\">c（想获得冠军）。所以，有些b（职业运动员）\u003cimg data-k=\"a37757d411ef\">c（想获得冠军）”，与题干推理结构不同，排除。\n故正确答案为B。","no":93,"missingImage":false},{"qid":"12101000","cat":"逻辑判断","stem":"某品牌奶茶十年前以黑糖珍珠奶茶为招牌，赢得年轻顾客的青睐，在众多茶饮品牌中挣得相当大的市场份额。近年来，随着门店不断扩张，营收也不断增长，但是其招牌黑糖珍珠奶茶的销量却下降了。\n以下除哪项外，均能解释上述现象？","options":{"A":"该品牌的黑糖珍珠奶茶十年来未更新配方，味道没有变化","B":"黑糖珍珠奶茶现在已不是一款新颖且受到消费者欢迎的产品","C":"由于熬制黑糖珍珠的人工成本增加，商家提高了这一产品的价格","D":"近几年茶饮市场火爆，大多数品牌都推出了自己的黑糖珍珠奶茶"},"answer":"A","explanation":"第一步：找出题干矛盾。\n某品牌奶茶门店不断扩张，营收不断增长，但是其招牌黑糖珍珠奶茶的销量却下降了。\n第二步：逐一分析选项。\nA项：该项指出该品牌的黑糖珍珠奶茶十年来味道未变，但味道喜好因人而异，不确定现在消费者是否喜爱该口味，无法解释为何门店不断扩张、营收不断增长，但其招牌黑糖珍珠奶茶的销量却下降，无法解释题干矛盾，当选；\nB项：该项指出黑糖珍珠奶茶现在不再新颖且不再受消费者欢迎，这会导致该品牌的黑糖珍珠奶茶销量下降，而门店不断扩张会带来其他产品营收的增长，从而整体营收依然增长，可以解释题干矛盾，排除；\nC项：该项指出商家提高了黑糖珍珠奶茶的价格，这会导致该品牌的黑糖珍珠奶茶销量下降，而门店不断扩张会带来其他产品营收的增长，从而整体营收依然增长，可以解释题干矛盾，排除；\nD项：该项指出大多数品牌都推出了自己的黑糖珍珠奶茶，市场竞争会更加激烈，这会导致该品牌的黑糖珍珠奶茶销量下降，而门店不断扩张会带来其他产品营收的增长，从而整体营收依然增长，可以解释题干矛盾，排除。\n本题为选非题，故正确答案为A。","no":94,"missingImage":false},{"qid":"11367774","cat":"逻辑判断","stem":"甲、乙、丙三人毕业后同时进入某单位实习，由于表现较好，实习结束后他们将分到人事处、财务处、办公室正式入职。有人对他们各自的工作部门进行了如下猜测：\n（1）甲入职的部门是人事处；\n（2）乙入职的部门不是财务处；\n（3）丙入职的部门不是人事处。\n实际上，上述三个猜测只有一个是对的。\n根据上述信息，可以推出甲、乙、丙入职的部门依次为：","options":{"A":"人事处 财务处 办公室","B":"办公室 财务处 人事处","C":"财务处 办公室 人事处","D":"人事处 办公室 财务处"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）甲入职的部门是人事处；\n（2）乙入职的部门不是财务处；\n（3）丙入职的部门不是人事处；\n（4）三个猜测只有一个是对的。\n题干条件没有矛盾关系，也没有反对关系，考虑题干假设或选项代入，选项信息充分，优先考虑代入法。\n第二步：逐一代入选项。\n代入A项：条件（1）为真，条件（2）为假，条件（3）为真，有两个猜测为真，与条件（4）矛盾，排除；\n代入B项：条件（1）为假，条件（2）为假，条件（3）为假，三个猜测均为假，与条件（4）矛盾，排除；\n代入C项：条件（1）为假，条件（2）为真，条件（3）为假，只有一个猜测为真，符合条件（4），当选；\n代入D项：条件（1）为真，条件（2）为真，条件（3）为真，三个猜测均为真，与条件（4）矛盾，排除。\n故正确答案为C。","no":95,"missingImage":false},{"qid":"12101003","cat":"逻辑判断","stem":"地名是一个社会的基本公共信息，是自然地理、生产生活、历史文化的重要载体，在经济社会发展中发挥着基础性作用。民政部印发通知，提出以乡村地名采集上图标注为牵引，全面推进乡村地名命名管理、地名标志设置维护。对此，有专家称这一举措有助于传承中华民族悠久的历史文化。\n以下哪项如果为真，最能支持上述专家的论断？","options":{"A":"地名作为一种蕴含丰富价值的资源，融入了人们的价值取向、文化思想观念等内容","B":"地名属于专有名词，每个地名都有对应的读音和含义，体现了人们对美好生活的期盼","C":"地名是人类历史“活化石”，在中华民族千百年的传承中被赋予更多含义，成为中华文明的独特载体","D":"一些地方存在着地名不规范的现象，给基层治理、公共服务以及人们的生产生活带来诸多困扰"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：这一举措（以乡村地名采集上图标注为牵引，全面推进乡村地名命名管理、地名标志设置维护）有助于传承中华民族悠久的历史文化。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出地名融入了人们的价值取向、文化思想观念等内容，人们的价值取向、文化思想观念等内容是中华民族历史文化的具体体现，补充论据，可以加强，保留；\nB项：该项指出每个地名都有对应的读音和含义，体现了人们对美好生活的期盼，但无法证明地名命名管理是否有助于传承中华民族悠久的历史文化，无法加强，排除；\nC项：该项指出地名在中华民族千百年的传承中被赋予更多含义，成为中华文明的独特载体，解释了为什么地名命名管理有助于传承中华民族悠久的历史文化，补充论据，可以加强，保留；\nD项：该项指出一些地方存在着地名不规范的现象以及由此带来的困扰，而论点说的是地名命名管理有助于传承中华民族悠久的历史文化，话题不一致，无法加强，排除。\n对比A、C两项，题干论点的关键词为“有助于传承中华民族悠久的历史文化”，A项说的是具体体现即“人们的价值取向、文化思想观念等内容”，而C项指出“地名在中华民族千百年的传承中被赋予更多含义”，C项表述的范围比A项更大、更全面，C项当选。\n故正确答案为C。","no":96,"missingImage":false},{"qid":"11367786","cat":"逻辑判断","stem":"海草是由陆地植物演化到适应海洋环境的高等植物。一种或几种海草连片生长，共同形成广袤柔软的“海草床”。海草床是最高效的碳捕获和碳封存系统之一，贮存碳的效率比森林高90倍，碳封存时间可达上千年。然而海草床是脆弱的生态系统，受自然环境变化和人类活动影响较大，全球范围内海草床正面临严峻退化趋势。基于如上原因，有专家建议，亟需开展“海底种草”生态修复工作，加强对海草床的保护。\n以下哪项如果为真，最能支持上述专家的建议？","options":{"A":"当前全球气候变暖日益加剧，科学家已发现人类生产生活排放的碳化合物是变暖的主要元凶","B":"海草床可以通过光合作用吸收环境中的无机碳，将其高效地固定、转化为有机碳并进行积累","C":"有些地方海岸线侵蚀严重，加强海草床保护和修复，能有效防止或减缓海滩和海岸遭受侵蚀","D":"海草床具有水质净化和调控功能，能吸收水体中的营养盐和重金属，降低海水悬浮物的浓度"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：亟需开展“海底种草”生态修复工作，加强对海草床的保护。\n论据：海草床是最高效的碳捕获和碳封存系统之一，贮存碳的效率比森林高90倍，碳封存时间可达上千年。然而海草床是脆弱的生态系统，受自然环境变化和人类活动影响较大，全球范围内海草床正面临严峻退化趋势。\n本题论点说的是亟需修复和保护海草床，论据说的是海草床是最高效的碳捕获和碳封存系统之一，但正面临严峻退化趋势，二者话题基本一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是全球气候变暖日益加剧，而其主要元凶是人类生产生活排放的碳化合物，那么固碳就显得尤为重要，而海草床可以固碳，故应亟需开展“海底种草”生态修复工作，该项指出目前碳排放问题较严重是填补了论据推出论点过程中的漏洞，补充论据，保留；\nB项：该项说的是海草床可以将无机碳高效地固定、转化为有机碳并进行积累，说明海草床贮存碳的效率较高，是对论据的重复，可以加强，保留；\nC项：该项说有些地方海岸线侵蚀严重，加强海草床保护和修复，能有效防止或减缓海滩和海岸遭受侵蚀，但未提及其与碳化合物的关系，话题不一致，无法加强，排除；\nD项：该项说的是海草床具有水质净化和调控功能，但没有体现这些功能对碳化合物的作用，无法证明“亟需”修复和保护海草床，无法加强，排除。\n对比A、B两项，A项填补了论据推出论点过程中的漏洞，而B项只是重复论据，因此A项的加强力度更强。\n故正确答案为A。","no":97,"missingImage":false},{"qid":"11367793","cat":"逻辑判断","stem":"一直以来，患者在初诊后第二天拿着检查报告找医生复诊时需要再挂号，这大大增加患者的就医负担。针对这一情况，某医院开始实施“一次挂号管三天”的做法，让当天不能完成检查或不能领取检查报告的患者，在三天内可携带报告到同一科室复诊，无需再次挂号。对此，有初诊患者担心，医院此举会延长他们的等待时间，挤压他们的就诊机会。\n以下哪项如果为真，最能说明上述患者的担心是不必要的？","options":{"A":"该做法实施后，医院将根据医生的接诊情况，合理安排初诊患者与复诊患者的接诊次序，尽量避免出现长时间排队现象","B":"无论是否需要再次挂号，患者都会去同一科室进行复诊，该做法的实施不会导致科室接诊的患者明显增多","C":"该做法实施前，医生也会接待手持检查报告的复诊患者，但他们需要重新挂号，与初诊患者一起按挂号次序就诊","D":"该做法实施后，患者可在挂号三天有效期内从容完成检查、治疗等就医环节，保障诊治的连续性和有效性"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：有初诊患者担心，医院此举（实施“一次挂号管三天”的做法）会延长他们的等待时间，挤压他们的就诊机会。\n论据：无。\n本题只有论点，没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项说的是该做法实施后医院将根据情况合理安排初诊患者与复诊患者的接诊次序，这样就可以尽量避免出现长时间排队现象，不会延长初诊患者的等待时间，说明了他们的担心是不必要的，削弱论点，当选；\nB项：该项说的是该做法不会导致科室接诊的患者明显增多，但在患者数量不增加的情况下，初诊患者与复诊患者的排队次序和等待时间不明确，复诊患者的就诊次序可能都排在初诊患者之前，仍然会延长初诊患者的等待时间，不能证明他们的担心是不必要的，无法削弱，排除；\nC项：该项说的是该做法实施前的情况，无法判断实施后是否会延长初诊患者的等待时间，无法削弱，排除；\nD项：该项说的是该做法对患者的好处，但与初诊患者等待时间和就诊机会无关，话题不一致，无法削弱，排除。\n故正确答案为A。","no":98,"missingImage":false},{"qid":"11367787","cat":"逻辑判断","stem":"对某项调查的“同意”票进行计数，甲、乙、丙、丁四人给出的结果分别是：9472、9496、9480、9502张。四人计数结果不一致后重新计数，发现有三人分别少计了17张、少计了9张、多计了13张，还有一人仅粗略估计出一个票数。\n根据上述信息，可以推出粗略估计票数的人是：","options":{"A":"甲","B":"乙","C":"丙","D":"丁"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）甲9472、乙9496、丙9480、丁9502；\n（2）1个人少计了17张；\n（3）1个人少计了9张；\n（4）1个人多计了13张；\n（5）1个人仅粗略估计出一个票数。\n第二步：根据题干条件进行推理。\n根据条件（1）（2）可以推出四个人中数量最少的人少计了17张，即甲9472少计了17张，那正确票数应为9472+17=9489，排除A项；\n结合条件（1）（3）可以推出丙9480少计了9张，排除C项；\n结合条件（1）（4）可以推出票数最多的丁9502多计了13张，排除D项。\n综上，乙9496是仅粗略估计出的一个票数，B项当选。\n故正确答案为B。","no":99,"missingImage":false},{"qid":"12101005","cat":"逻辑判断","stem":"某单位员工参加了光明区组织的一些活动。已知：\n（1）所有不参加敬老院义工活动的员工都没参加运动会；\n（2）所有参加读书会的员工都没有参加敬老院义工活动；\n（3）员工张梅参加了敬老院义工活动，也参加了知识竞赛。\n根据上述信息，可以推出以下哪项?","options":{"A":"没有员工参加运动会","B":"张梅没有参加运动会","C":"参加读书会的员工没参加运动会","D":"有员工参加了读书会和知识竞赛"},"answer":"C","explanation":"第一步：翻译题干。\n（1）\u003cimg data-k=\"0be436194951\">参加敬老院义工活动\u003cimg data-k=\"b3a86cb4840e\">参加运动会；\n（2）参加读书会\u003cimg data-k=\"b3a86cb4840e\">参加敬老院义工活动；\n（3）张梅参加了敬老院义工活动 且 参加了知识竞赛。\n将（1）（2）串联可得：（4）参加读书会\u003cimg data-k=\"b3a86cb4840e\">参加敬老院义工活动\u003cimg data-k=\"b3a86cb4840e\">参加运动会。\n第二步：逐一分析选项。\nA项：该项为“没有员工参加运动会”，题干没有所有员工是否参加运动会的表述，无法推出，排除；\nB项：该项为“张梅没有参加运动会”，条件（3）中“张梅参加敬老院义工活动”是对条件（1）的否前，否前无法推出确定性结论，是对条件（2）的否后，可以推出张梅没有参加读书会，均无法推出“张梅没有参加运动会”，无法推出，排除；\nC项：翻译为“参加读书会\u003cimg data-k=\"b3a86cb4840e\">参加运动会”，“参加读书会”是对条件（4）的肯前，肯前必肯后，可以推出“\u003cimg data-k=\"0be436194951\">参加运动会”，当选；\nD项：翻译为“有的员工\u003cimg data-k=\"a37757d411ef\">参加读书会 且 参加知识竞赛”，根据条件（3）“张梅参加了知识竞赛”可以推出“有的员工参加了知识竞赛”，但无法推出参加了知识竞赛的人也同时参加了读书会，无法推出，排除。\n故正确答案为C。","no":100,"missingImage":false},{"qid":"12101008","cat":"逻辑判断","stem":"近年来，AI在世界范围内掀起一波接一波的热潮，它的颠覆性应用让许多行业受益。然而，今年4月发布的一份研究报告显示，近一年来，经济与企业类AI谣言量增速达99.91%。某权威调查机构称，生成虚假文章的网站数量自2023年5月以来激增1000%以上，涉及15种语言。据此，有专家预测，如果任由这种情况发展下去，AI输出内容的质量会呈现断崖式下降。\n以下哪项如果为真，最能支持上述专家的预测？","options":{"A":"AI输出的内容虽然形式上非常合理，但是一旦深入分析，就会发现很多地方站不住脚","B":"缺乏批判性思维的情况下，AI可能让人陷入认知幻觉，扭曲公众对现实和科学共识的集体理解","C":"AI生成的大量虚假、垃圾内容会源源不断地回流互联网，“污染”训练AI模型的数据","D":"AI生成、伪造或篡改文本、图片、音频和视频的现象越来越普遍，产生了大量信息垃圾"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：如果任由这种情况发展下去，AI输出内容的质量会呈现断崖式下降。\n论据：今年4月发布的一份研究报告显示，近一年来，经济与企业类AI谣言量增速达99.91%。某权威调查机构称，生成虚假文章的网站数量自2023年5月以来激增1000%以上，涉及15种语言。\n本题论据和论点都在讨论AI输出质量的情况，话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出AI输出的内容深入分析后就会发现很多地方站不住脚，说的是AI输出的内容存在问题，但没有提及“AI谣言、虚假信息”对“AI输出内容的质量”的影响，话题不一致，无法加强，排除；\nB项：该项指出AI可能对人产生的负面影响，但没有提及“AI谣言、虚假信息”对“AI输出内容的质量”的影响，话题不一致，无法加强，排除；\nC项：该项指出AI生成的大量虚假、垃圾内容会源源不断地回流互联网，“污染”训练AI模型的数据，进而导致AI输出内容的质量变差，补充论据，可以加强，当选；\nD项：该项指出AI生成、伪造或篡改文本、图片、音频和视频的现象越来越普遍，产生了大量信息垃圾，属于重复论据，没有提及“AI输出内容的质量断崖式下降”，无法加强，排除。\n故正确答案为C。","no":101,"missingImage":false},{"qid":"12101013","cat":"逻辑判断","stem":"滨海大学选派小赵、小钱、小孙、小李、小周组成辩论队，参加滨海市组织的大学生辩论赛。已知：\n（1）如果小赵是哲学专业的，那么小周就不是经济学专业的；\n（2）或者小钱是法医专业的，或者小赵是哲学专业的；\n（3）小李和小孙至少有一人是计算机专业的；\n（4）如果小孙是计算机专业的，那么小钱不是法医专业的。\n增加以下哪项作为前提，可以推出“小李是计算机专业的”？","options":{"A":"小钱不是法医专业的","B":"小孙是计算机专业的","C":"小赵是哲学专业的","D":"小周是经济学专业的"},"answer":"D","explanation":"第一步：翻译题干。\n①小赵哲学\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">小周经济学；\n②小钱法医 或 小赵哲学；\n③小李计算机 或 小孙计算机；\n④小孙计算机\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">小钱法医。\n第二步：根据题干条件进行推理。\n提问为“推出‘小李是计算机专业的’”，本题给出了结论，需要从结论出发倒推条件。\n根据条件③可知：想要推出“小李是计算机专业的”，根据“否一推一”，需要“小孙不是计算机专业的”成立；\n根据条件④可知：想要推出“小孙不是计算机专业的”，根据“逆否等价”，需要“小钱是法医专业的”成立；\n根据条件②可知：想要推出“小钱是法医专业的”，根据“否一推一”，需要“小赵不是哲学专业的”成立；\n根据条件①可知：想要推出“小赵不是哲学专业的”，根据“逆否等价”，需要“小周是经济学专业的”成立，对应D项。\n故正确答案为D。","no":102,"missingImage":false},{"qid":"12101017","cat":"逻辑判断","stem":"在某校法学院的一次模拟竞赛中，冯明、范华、朱丽、赵刚、吴勇等5位同学参加模拟民事诉讼、刑事诉讼、行政诉讼和劳动争议仲裁4项比赛，每位同学参加1项比赛，每项比赛都有1-2位同学参加。已知：\n（1）如果冯明和朱丽之中至少有1位同学参加模拟劳动争议仲裁，那么范华参加模拟民事诉讼，而赵刚参加模拟劳动争议仲裁；\n（2）如果范华和赵刚之中至少有1位同学参加模拟劳动争议仲裁，那么朱丽和吴勇都参加模拟民事诉讼。\n若吴勇未参加模拟劳动争议仲裁，则可以推出以下哪项?","options":{"A":"范华参加模拟行政诉讼","B":"赵刚参加模拟刑事诉讼","C":"冯明参加模拟劳动争议仲裁","D":"朱丽参加模拟民事诉讼"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）冯明劳动争议仲裁 或 朱丽劳动争议仲裁\u003cimg data-k=\"a37757d411ef\">范华民事诉讼 且 赵刚劳动争议仲裁；\n（2）范华劳动争议仲裁 或 赵刚劳动争议仲裁\u003cimg data-k=\"a37757d411ef\">朱丽民事诉讼 且 吴勇民事诉讼；\n（3）5位同学每位同学参加1项比赛，4项比赛每项比赛都有1-2位同学参加，即仅有1项比赛有2位同学参加；\n（4）\u003cimg data-k=\"0be436194951\">吴勇劳动争议仲裁。\n第二步：根据题干条件进行推理。\n根据条件（3）、（4）可知，吴勇未参加模拟劳动争议仲裁，则参加模拟劳动争议仲裁的是冯明、范华、朱丽、赵刚中的1-2人。\n假设冯明或朱丽参加模拟劳动争议仲裁，根据条件（1）可以推出，范华参加模拟民事诉讼，赵刚参加模拟劳动争议仲裁；再根据条件（2）以及赵刚参加模拟劳动争议仲裁，可以推出朱丽和吴勇都参加模拟民事诉讼，此时参加模拟民事诉讼的有3人，与条件（3）矛盾，故假设不成立，即冯明和朱丽都没有参加模拟劳动争议仲裁，那么参加模拟劳动争议仲裁的是范华或赵刚，再根据条件（2）可以推出朱丽和吴勇都参加模拟民事诉讼，D项为真，当选。\n故正确答案为D。","no":103,"missingImage":false},{"qid":"11367806","cat":"定义判断","stem":"多元共治：指针对社会运行中的复杂问题，由政府、社会组织、公民等主体共同参与，多方合作的社会治理模式。\n下列属于多元共治的是：","options":{"A":"针对辖区内河道持续多年的污染问题，某县水利、环保等部门成立联合工作小组，决心打赢河道污染治理的攻坚战","B":"针对居民停车位、充电桩严重不足的问题，某街道统筹规划电动自行车停放充电区域，优化地下非机动车库安全设施，消除电动自行车“上楼入户”的隐患","C":"某区政府在老旧小区改造、公共服务等社区工作中，鼓励业委会、志愿者充分发挥各自作用，遇到问题加强沟通，满足居民的合理诉求","D":"某村两面临山，农林交错，靠近交通要道，火灾防治压力巨大。村民自发组织巡查队，检测上报森林火情，有效遏制了火灾多发的势头"},"answer":"C","explanation":"第一步：找出定义关键词。\n“政府、社会组织、公民等主体共同参与”、“多方合作的社会治理模式”。\n第二步：逐一分析选项。\nA项：某县水利、环保等部门联合治理河道污染，不涉及社会组织和公民等主体，不符合“政府、社会组织、公民等主体共同参与”，不符合定义，排除；\nB项：某街道统筹规划电动自行车停放充电区域，优化地下非机动车库安全设施，不涉及社会组织和公民等主体，不符合“政府、社会组织、公民等主体共同参与”、“多方合作的社会治理模式”，不符合定义，排除；\nC项：某区政府在社区工作中，鼓励业委会、志愿者充分发挥各自作用，符合“政府、社会组织、公民等主体共同参与”、“多方合作的社会治理模式”，符合定义，当选；\nD项：村民自发组织巡查队，检测上报森林火情，不涉及政府等主体，不符合“政府、社会组织、公民等主体共同参与”、“多方合作的社会治理模式”，不符合定义，排除。\n故正确答案为C。","no":104,"missingImage":false},{"qid":"12101016","cat":"定义判断","stem":"预期管理：指政府部门通过发布会、社交媒体等方式，与社会公众进行互动性交流，以提高政策接受度，塑造稳定的运行环境，确保预期目标实现的管理方式。\n下列属于预期管理的是：","options":{"A":"进入冬季后，市生态环境局每天通过电视台实时发布空气质量监测数据，市民出门前都会随时收看","B":"县文旅局为了促进旅游业发展，制作了上百个短视频，在多个社交平台上宣传当地的美景和特色文化","C":"针对野猪频繁出没危害居民生命财产安全的事件，区农业农村局出台了补偿规定，并在听证会上答复了广大市民的提问","D":"某电商平台公布了平台补贴与政府“以旧换新”补贴叠加使用的申领方案，收到网民提出的各种建议后，又进行了多处修改"},"answer":"C","explanation":"第一步：找出定义关键词。\n“政府部门”、“通过发布会、社交媒体等方式”、“与社会公众进行互动性交流”、“提高政策接受度，塑造稳定的运行环境，确保预期目标实现”。\n第二步：逐一分析选项。\nA项：市生态环境局通过电视台发布空气质量监测数据，只是市生态环境局发布信息的方式，并未体现与社会公众的互动性交流，不符合“与社会公众进行互动性交流”，不符合定义，排除；\nB项：县文旅局制作了上百个短视频，在多个社交平台上宣传当地的美景和特色文化，未体现与社会公众的互动性交流，不符合“与社会公众进行互动性交流”，不符合定义，排除；\nC项：区农业农村局针对野猪危害居民生命财产安全的事件出台了补偿规定，并在听证会上答复了广大市民的提问，符合“政府部门”、“通过发布会、社交媒体等方式”、“与社会公众进行互动性交流”、“提高政策接受度，塑造稳定的运行环境，确保预期目标实现”，符合定义，当选；\nD项：某电商平台公布了平台补贴及政府补贴的申领方案，但电商平台不属于政府部门，不符合“政府部门”，不符合定义，排除。\n故正确答案为C。","no":105,"missingImage":false},{"qid":"12101025","cat":"定义判断","stem":"达人探店：指网络博主为了打通商品与消费者的信息隔膜，以直播、视频等形式展示真实的产品体验和消费场景，并在网络平台上发布个人评价的行为。\n下列属于达人探店的是：","options":{"A":"高先生是网上小有名气的食评家，直播时常常让老板和大厨当场下不了台，被网友称为“六亲不认”，收获了大量粉丝，很多餐馆因此改进了菜品和服务","B":"某知名穿搭博主经常购买各品牌的当季新款时装，在各种社交媒体发布变装视频，其穿搭风格被一些网友模仿","C":"健身教练石先生录制了健身教学网课，为提升课程销量，在社交平台上发布了包含大量学员体验及评价的推介视频","D":"带爸妈外出游玩时，胡女士有时会对当地景点的适老性设施情况进行评价，拍摄成攻略短视频，被网民赞誉为史上最靠谱的老年旅游活地图"},"answer":"A","explanation":"第一步：找出定义关键词。\n“网络博主”、“为了打通商品与消费者的信息隔膜”、“以直播、视频等形式展示真实的产品体验和消费场景”、“在网络平台上发布个人评价”。\n第二步：逐一分析选项。\nA项：高先生是网上小有名气的食评家，符合“网络博主”、“在网络平台上发布个人评价”，他在直播时常常让老板和大厨当场下不了台，符合“以直播、视频等形式展示真实的产品体验和消费场景”，符合定义，当选；\nB项：某知名穿搭博主经常购买各品牌的当季新款时装，并在各种社交媒体发布变装视频，这属于自身穿搭风格的展示，并非为了让消费者了解商品本身的情况，不符合“为了打通商品与消费者的信息隔膜”，不符合定义，排除；\nC项：健身教练石先生在社交平台上发布包含大量学员体验及评价的推介视频是为了提升课程销量，不符合“为了打通商品与消费者的信息隔膜”，不符合定义，排除；\nD项：带爸妈外出游玩时，胡女士会拍摄攻略短视频，并对当地景点的适老性设施情况进行评价，主要针对的是适老性设施而非景点本身，并非为了让消费者了解商品本身的情况，不符合“为了打通商品与消费者的信息隔膜”，不符合定义，排除。\n故正确答案为A。","no":106,"missingImage":false},{"qid":"12101018","cat":"定义判断","stem":"精神股东：指对特定企业或产品没有实际投资，也不追求实质性回报，却长期关注企业经营发展状况，为其成败感到骄傲或失落的客户群体。\n下列属于精神股东的是：","options":{"A":"乔先生五年前买入了某药企的股票后，三天两头登录该公司网站浏览企业发展的各种信息，每次看到企业的利好消息就会感到很开心","B":"郑先生是一位太空探索迷，十多年来时刻关注着某公司的火星移民计划，收集了所有的火箭发射视频，哪怕看到一点点进展都会非常兴奋","C":"周女士喜欢某品牌手机，多年来一直关注、购买它的各种新产品，提出改进建议，最近该品牌又推出了一款十分先进的新手机，周女士逢人就夸","D":"刘女士很早以前就关注了某景区推出的影视体验项目，打算国庆假期去游玩，但由于节日游客爆满，她没有买到票，最终无法成行，有些郁闷"},"answer":"B","explanation":"第一步：找出定义关键词。\n“对特定企业或产品没有实际投资，也不追求实质性回报”、“长期关注企业经营发展状况，为其成败感到骄傲或失落”。\n第二步：逐一分析选项。\nA项：乔先生五年前买入了某药企的股票，说明乔先生对该企业有实际投资，不符合“对特定企业或产品没有实际投资，也不追求实质性回报”，不符合定义，排除；\nB项：郑先生“时刻关注”某公司的火星移民计划，只是关注，没有体现实际投资，符合“对特定企业或产品没有实际投资”，哪怕看到一点点进展都会非常兴奋，符合“长期关注企业经营发展状况，为其成败感到骄傲或失落”，符合定义，当选；\nC项：周女士多年来一直关注、购买该品牌的各种新产品，对特定企业的产品有实际的消费与投资，不符合“对特定企业或产品没有实际投资”，不符合定义，排除；\nD项：刘女士因想去游玩而关注了某景区推出的影视体验项目，并非是对企业经营发展状况的长期关注，不符合“长期关注企业经营发展状况，为其成败感到骄傲或失落”，不符合定义，排除。\n故正确答案为B。","no":107,"missingImage":false},{"qid":"11367798","cat":"定义判断","stem":"平台自我优待：指商业平台主体借助自身技术或数据优势地位，通过特定手段取得优惠待遇以获得竞争优势的行为。\n下列不属于平台自我优待的是：","options":{"A":"某电商平台利用从卖家经营过程中收集到的海量销售数据，优化了自家产品的推荐策略，并在平台搜索引擎中把它们排列在前面","B":"某在线旅游平台在用户自行预订车票、门票时，默认搭售自己代理的旅游保险产品，却没有在显著位置提醒用户可以取消这项服务","C":"某应用商店运营商对自家程序软件给了更高的评分星级，对第三方开发者则设置了更为严格的审核评级标准","D":"某供水公司利用在区域供水市场的支配地位，要求用水单位必须邀请己方对供水工程进行勘察、施工和安装"},"answer":"D","explanation":"第一步：找出定义关键词。\n“商业平台主体借助自身技术或数据优势地位”、“通过特定手段取得优惠待遇以获得竞争优势”。\n第二步：逐一分析选项。\nA项：相比其他卖家，该电商平台利用从卖家经营过程中收集到的海量销售数据，优化了自家产品的推荐策略，并在平台搜索引擎中把它们排列在前面，是借助自身技术和数据优势获得竞争优势，符合“商业平台主体借助自身技术或数据优势地位”、“通过特定手段取得优惠待遇以获得竞争优势”，符合定义，排除；\nB项：相比其他的保险产品，该在线旅游平台默认搭售自己代理的旅游保险产品，却没有在显著位置提醒用户可以取消这项服务，是借助自身技术优势获得竞争优势，符合“商业平台主体借助自身技术或数据优势地位”、“通过特定手段取得优惠待遇以获得竞争优势”，符合定义，排除；\nC项：该应用商店运营商对自家程序软件给了更高的评分星级，对第三方开发者则设置了更为严格的审核评级标准，是借助自身技术优势获得竞争优势，符合“商业平台主体借助自身技术或数据优势地位”、“通过特定手段取得优惠待遇以获得竞争优势”，符合定义，排除；\nD项：该供水公司利用在区域供水市场的支配地位，要求用水单位必须邀请己方做事，是借助市场优势，不是借助自身技术或数据优势，不符合“商业平台主体借助自身技术或数据优势地位”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":108,"missingImage":false},{"qid":"11367800","cat":"定义判断","stem":"情感虹吸：指现实生活中难以得到心理慰藉的中老年人，在网络世界中因为受到情感诱导而盲目消费，导致个人钱财严重受损的现象。\n下列属于情感虹吸的是：","options":{"A":"在外地工作的朱先生发现母亲退休后将退休金的一大半都用于购买一种“三无”保健品，原来该产品的推销员几乎每周都会来陪母亲聊家常","B":"酒店大厨赵先生在网络平台上免费教授烹饪知识，因其手艺精湛，说话幽默，嘴巴又甜，受到了无数妈妈级粉丝的喜爱，每天都能得到不少打赏","C":"儿子考上大学后，刘女士每天晚上都会定时打开手机，在主播们的嘘寒问暖中感受一丝安慰，偶尔也为他们刷一些小礼物","D":"独居的李奶奶每天都泡在“50后时光”直播间，为主播刷“火箭”“跑车”等礼物，成为了“榜一大哥”，两个月内花掉了多年的积蓄"},"answer":"D","explanation":"第一步：找出定义关键词。\n“现实生活中难以得到心理慰藉的中老年人”、“在网络世界中”、“受到情感诱导而盲目消费”、“导致个人钱财严重受损”。\n第二步：逐一分析选项。\nA项：母亲退休后购买“三无”保健品，该产品的推销员几乎每周都会来陪母亲聊家常，没有体现利用“网络”，不符合“在网络世界中”，不符合定义，排除；\nB项：赵先生每天都能得到不少来自妈妈级粉丝的打赏，但未提到这些妈妈级粉丝的钱财是否严重受损，不符合“导致个人钱财严重受损”，不符合定义，排除；\nC项：刘女士每天晚上都会定时打开手机，偶尔为主播们刷一些小礼物，未提到刘女士的钱财是否严重受损，不符合“导致个人钱财严重受损”，不符合定义，排除；\nD项：独居的李奶奶每天都泡在“50后时光”直播间，符合“现实生活中难以得到心理慰藉的中老年人”、“在网络世界中”，为主播刷礼物，两个月内花掉了多年的积蓄，符合“受到情感诱导而盲目消费”、“导致个人钱财严重受损”，符合定义，当选。\n故正确答案为D。","no":109,"missingImage":false},{"qid":"11367805","cat":"定义判断","stem":"正向情绪价值：指通过积极性的言语或行动，为他人带来舒服、愉悦、安全等良性感受的人际交往能力。\n下列属于正向情绪价值的是：","options":{"A":"林女士是一位经验丰富的住家月嫂，看到自己照护的孩子健康成长和新手父母们满意的笑容，她体会到了自己的价值","B":"陈先生大学毕业后当过游戏主播、网络写手、保险推销员，不久前又在酒吧驻唱。父母很尊重他的选择，从不横加干涉","C":"秦女士到时装店买衣服，刚一进门，几个营业员就围了上来，拼命夸她身材好，穿什么都好看。她虽然半信半疑，还是忍不住买了几件","D":"赵先生是同事心目中的“显眼包”，每次聚会的时候，只要他一开口，大家就会笑得前仰后合，工作中的压力一扫而空"},"answer":"D","explanation":"第一步：找出定义关键词。\n“通过积极性的言语或行动”、“为他人带来良性感受”、“人际交往能力”。\n第二步：逐一分析选项。\nA项：林女士是一位经验丰富的住家月嫂，她照护的孩子健康成长和新手父母们的满意说明林女士具备一定的专业能力，但没有体现“人际交往能力”，不符合定义，排除；\nB项：陈先生大学毕业后做过多种工作，父母尊重他的选择而不加干涉，不符合“通过积极性的言语或行动”、“为他人带来良性感受”，不符合定义，排除；\nC项：营业员拼命夸秦女士身材好，秦女士对此半信半疑，说明营业员的话没有给秦女士带来良性感受，不符合“为他人带来良性感受”，不符合定义，排除；\nD项：赵先生在每次与同事的聚会中，都能让大家笑得前仰后合，工作压力一扫而空，体现了赵先生良好的人际交往能力，符合“通过积极性的言语或行动”、“为他人带来良性感受”、“人际交往能力”，符合定义，当选。\n故正确答案为D。","no":110,"missingImage":false},{"qid":"11367801","cat":"定义判断","stem":"零糖社交：有意降低社交期望值，在互动过程中保持距离感和独立性，尽量减轻双方的精神负担，使心情更加轻松愉悦的社交方式。\n下列属于零糖社交的是：","options":{"A":"吴女士和好友多年未见，平时只是逢年过节发条问候短信。前几天，得知她生病的消息后，好友立刻放下工作赶了过来","B":"李先生经常周末约上三五个骑友到附近城市游玩，每次当天往返，所有费用AA制，虽然大家只知道彼此的微信昵称，却玩得非常开心","C":"小王每天晚上都要和自家的AI对话机器人闲聊半个多小时，就像交往多年亲密无间的好友，他很享受这样的交流，没有一点心理包袱","D":"小赵工作很忙，日常生活中也是个“独行侠”。收到母校的校庆邀请后，他毫不犹豫就婉言谢绝了。因为他不想跑去给人家增加招待负担"},"answer":"B","explanation":"第一步：找出定义关键词。\n“有意降低社交期望值”、“在互动过程中保持距离感和独立性”、“使心情更加轻松愉悦的社交方式”。\n第二步：逐一分析选项。\nA项：吴女士和好友虽多年未见，但在得知她生病的消息后，好友立刻放下工作赶了过来，说明双方互动过程中并未保持距离感和独立性，不符合“在互动过程中保持距离感和独立性”，不符合定义，排除；\nB项：李先生经常周末约骑友游玩，当天往返且所有费用AA制，大家只知道彼此的微信昵称，说明李先生与骑友之间进行社交主要是为了游玩，互相保持着距离感和独立性，符合“有意降低社交期望值”、“在互动过程中保持距离感和独立性”，玩得非常开心，符合“使心情更加轻松愉悦的社交方式”，符合定义，当选；\nC项：小王每天晚上都要和AI对话机器人闲聊，其中AI对话机器人不是人，不涉及人与人之间的社交，不符合“使心情更加轻松愉悦的社交方式”，不符合定义，排除；\nD项：小赵因工作繁忙日常生活是“独行侠”，收到母校的校庆邀请，为了不增加招待负担便婉言谢绝了，未体现小赵的心情状态，不符合“使心情更加轻松愉悦的社交方式”，不符合定义，排除。\n故正确答案为B。","no":111,"missingImage":false},{"qid":"11367804","cat":"定义判断","stem":"数字意境：指通过数字技术赋能将优秀传统文化以沉浸式的艺术形式进行创新表达，凸显视觉效果呈现，以展现其文化韵味和审美意境。\n下列属于数字意境的是：","options":{"A":"某电视台文化节目中，大学生们来到文化古迹现场，与考古专家互动，在诵读、观察、探究中加深对中华传统文化的理解","B":"某景区排练的舞蹈节目中，以当地石窟为真实背景，利用三维动画技术复原了壁画中飞天与金刚的舞蹈，使静止的文化符号变成了动感的形象","C":"某艺术研究院和多家企业合作，对古代编钟复制件进行高精细度的音源采集，最终实现对这一传统瑰宝的数字化复原","D":"某博物馆从古代名画《千里江山图》《百花图卷》中选取“意象”元素，实景搭建了沉浸式体验展厅，观众犹如身临其境"},"answer":"B","explanation":"第一步：找出定义关键词。\n“通过数字技术赋能”、“将优秀传统文化以沉浸式的艺术形式进行创新表达”、“凸显视觉效果呈现”。\n第二步：逐一分析选项。\nA项：某电视台文化节目中，大学生们来到文化古迹现场，与考古专家互动，未体现数字技术，不符合“通过数字技术赋能”，不符合定义，排除；\nB项：利用三维动画技术，体现了数字技术，符合“通过数字技术赋能”，复原了石窟壁画中飞天与金刚的舞蹈，使静止的文化符号变成了动感的形象，符合“将优秀传统文化以沉浸式的艺术形式进行创新表达”、“凸显视觉效果呈现”，符合定义，当选；\nC项：对古代编钟复制件进行高精细度的音源采集，最终实现对这一传统瑰宝的数字化复原，只是对其音源进行复原，不涉及创新表达，不符合“将优秀传统文化以沉浸式的艺术形式进行创新表达”、“凸显视觉效果呈现”，不符合定义，排除；\nD项：某博物馆从古代名画中选取“意象”元素，实景搭建了沉浸式体验展厅，观众犹如身临其境，不明确是否使用了数字技术，不符合“通过数字技术赋能”，不符合定义，排除。\n故正确答案为B。","no":112,"missingImage":false},{"qid":"12101019","cat":"定义判断","stem":"错位沟通：指在日常交流中，由于对彼此的意图和情感理解不一致，导致沟通效果不佳或产生误解。\n mg data-k=\"d8022b1f4034\">&lt;20人，并未超过20人，错误；\nC项：定位统计图可得，2021-2023年末全国人均公共图书馆藏量分别为0.89册、0.96册、1.02册。根据公式：增长量=现期量-基期量，可得2022年末全国人均公共图书馆藏量的增量=0.96-0.89=0.07册，2023年末全国人均公共图书馆藏量的增量=1.02-0.96=0.06册。2022年末的增量（0.07册）&gt;2023年末的增量（0.06册），并非逐年增大，错误；\nD项：定位文字材料可得，2023年末，全国共有公共图书馆从业人员6.1万人。其中，高级职称人员0.8万人，占13.0%；中级职称人员1.9万人，占31.2%。则中、高级职称从业人员占比=13.0%+31.2%=44.2%，故初级职称从业人员占比\u003cimg data-k=\"e59a69bf269f\">，即占比不超过55.8%，正确。\n故正确答案为D。","no":133,"missingImage":false}]}],"count":20,"answerable":20,"pointsOf":16}],"total":133,"affected":[],"subtitle":"2025年 · 江苏 · 6/6 模块"},{"slug":"2025-江苏-C类","title":"2025年江苏省公务员录用考试《行测》题（C类）（网友回忆版）","year":"2025","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"13319187","cat":"毛中特","stem":"习近平新时代中国特色社会主义思想从理论和实践结合上，科学地回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党等重大时代课题，提出一系列原创性的治国理政新理念新思想新战略。关于习近平新时代中国特色社会主义思想的历史地位，下列表述正确的是：\n①继承和发展马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观，是马克思主义在当代中国发展最新理论成果，开辟了马克思主义中国化时代化的新境界\n②把马克思主义基本原理同中国具体实际相结合，同中华优秀传统文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华文化和中国精神的时代精华\n③确立了社会主义市场经济体制的改革目标和基本构架，确立了社会主义初级阶段的基本经济制度和分配制度，开创了全面深化改革新局面，推进党的建设新的伟大工程\n④是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家发展事业的根本遵循","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n①正确，党的十九大报告指出，习近平新时代中国特色社会主义思想，是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展，是马克思主义中国化最新成果，是党和人民实践经验和集体智慧的结晶，是中国特色社会主义理论体系的重要组成部分，是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南，必须长期坚持并不断发展。党的二十大报告提出的“六个必须坚持”，即必须坚持人民至上、坚持自信自立、坚持守正创新、坚持问题导向、坚持系统观念、坚持胸怀天下，集中体现了习近平新时代中国特色社会主义思想的世界观和方法论，是马克思主义世界观方法论中国化时代化的最新成果。\n②正确，习近平新时代中国特色社会主义思想既坚持了马克思主义的根本立场和基本原理，又从中华优秀传统文化中汲取了丰富营养，实现了马克思主义与中华优秀传统文化的有机融合，推动了中华文化的创造性转化和创新性发展。所以，它把马克思主义基本原理同中国具体实际相结合，同中华优秀传统文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华文化和中国精神的时代精华。\n③错误，“确立了社会主义市场经济体制的改革目标和基本构架，确立了社会主义初级阶段的基本经济制度和分配制度”等主要是邓小平理论、三个代表重要思想、科学发展观的重要成果，并不是习近平新时代中国特色社会主义思想的特定贡献。习近平新时代中国特色社会主义思想主要是推进全面深化改革向广度和深度进军，而不是确立社会主义市场经济体制等的最初阶段的内容。\n④正确，习近平新时代中国特色社会主义思想为实现中华民族伟大复兴的中国梦提供了科学理论指引和行动纲领，从思想上、理论上、战略上、行动上为党和国家事业发展指明了方向，对于团结带领全国各族人民全面建成社会主义现代化强国、全面推进中华民族伟大复兴具有重大而深远的意义。因此，可以说它是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家发展事业的根本遵循。\n故①②④说法正确。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"13319179","cat":"毛中特","stem":"党的十八大以来以习近平同志为核心的党中央把全面从严治党纳入“四个全面”战略布局，深入推进新时代党的建设新的伟大工程，提出一系列新理念新思想新战略，形成习近平总书记关于党的建设的重要思想。党在革命性锻造中更加坚强有力、更加充满活力。全面从严治党开辟了百年大党自我革命的新境界。关于新时代全面从严治党取得的历史性开创性成就，下列表述正确的是：\n①牢牢抓住“关键少数”，坚持从领导干部抓起，以上率下\n②提出让人民监督政府是跳出历史周期率第一个答案\n③开展了史无前例的反腐败斗争，取得压倒性胜利并全面巩固\n④把制度建设贯穿党的政治各方面，形成比较完善的党内法规体系\n⑤以党的政治建设统领党的建设的各项工作，不断增强党组织政治功能","options":{"A":"①②③⑤","B":"①②④⑤","C":"①③④⑤","D":"②③④⑤"},"answer":"C","explanation":"本题考查理论与政策。\n①正确，党的十八大以来，全面从严治党过程中，始终强调抓住领导干部这个 “关键少数”，以上率下，要求领导干部以身作则、率先垂范，带头遵守党纪国法，执行党的各项规定，以实际行动引领广大党员干部廉洁从政、担当作为。\n②错误，毛泽东同志在延安的窑洞里给出了跳出历史周期率的第一个答案，即让人民监督政府。而在新时代，习近平总书记给出了第二个答案，这就是自我革命。\n③正确，2023年1月9日，中共中央总书记、国家主席、中央军委主席习近平在中国共产党第二十届中央纪律检查委员会第二次全体会议上发表重要讲话。讲话指出：“新时代10年，我们党不断深化对自我革命规律的认识，不断推进党的建设理论创新、实践创新、制度创新，在构建全面从严治党体系上积累了丰富成果······我们开展史无前例的反腐败斗争，坚持无禁区、全覆盖、零容忍，不敢腐、不能腐、不想腐一体推进，‘打虎’、‘拍蝇’、‘猎狐’多管齐下，查处一大批腐败分子，消除党内严重政治隐患，反腐败斗争取得压倒性胜利并全面巩固，成功走出一条中国特色反腐败之路······”\n④正确，2023年1月9日，中共中央总书记、国家主席、中央军委主席习近平在中国共产党第二十届中央纪律检查委员会第二次全体会议上发表重要讲话。讲话指出：“新时代10年，我们党不断深化对自我革命规律的认识，不断推进党的建设理论创新、实践创新、制度创新，在构建全面从严治党体系上积累了丰富成果······我们把制度建设贯穿党的各项建设，与时俱进完善党章，聚焦加强党的领导和党的建设推进制度创新，形成比较完善的党内法规体系，搭建起党和国家监督体系‘四梁八柱’，把权力关进制度的笼子，为新时代党的建设提供了根本性、全局性、稳定性、长期性保障······”\n⑤正确，党的十八大以来，全面从严治党强调以党的政治建设为统领，把政治标准和政治要求贯穿党的思想建设、组织建设、作风建设、纪律建设以及制度建设、反腐败斗争始终，不断增强党组织政治功能和组织功能，确保党的团结统一和行动一致。\n故①③④⑤表述正确。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"13319185","cat":"新思想","stem":"2023年7月，习近平总书记在江苏考察时强调，江苏有能力也有责任在推进中国式现代化进程中走在前、做示范，希望江苏在科技创新上取得新突破，在强链补链延链上展现新作为，在建设中华民族现代文明上探索新经验，在推进社会治理现代化上实现新提升。为贯彻落实总书记赋予江苏“四个新”的重大任务，下列做法正确的有：\n①打造全国重要的产业科技创新高地，使高质量发展更多依靠创新驱动的内涵型增长，强化企业科技创新主体地位，深化科技体制改革和人才发展体制机制改革\n②巩固传统产业领先地位，加快打造具有国际竞争力的战略性新兴产业集群，全面提升产业基础高级化和产业链现代化水平，加快构建以先进制造业为骨干的现代化产业体系\n③加强优秀传统文化的保护传承和创新发展，大力发展现代科技、教育事业，全面提升人民群众的科学文化素质，繁荣发展文化事业和文化产业，持续推进城乡公共文化服务标准化、均等化\n④加快健全社会保障体系，健全就业促进机制和就业公共服务体系，完善社会治理体系，推进社会治理数字化，推进应急管理体系和能力现代化","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查理论与政策。\n①正确，习近平总书记指出，中国式现代化关键在科技现代化。江苏要在科技创新上率先取得新突破，打造全国重要的产业科技创新高地，使高质量发展更多依靠创新驱动的内涵型增长。要强化企业科技创新主体地位，促进创新要素向企业集聚，不断提高科技成果转化和产业化水平。要深化科技体制改革和人才发展体制机制改革······\n②正确，习近平总书记强调，要把坚守实体经济、构建现代化产业体系作为强省之要，巩固传统产业领先地位，加快打造具有国际竞争力的战略性新兴产业集群，推动数字经济与先进制造业、现代服务业深度融合，全面提升产业基础高级化和产业链现代化水平，加快构建以先进制造业为骨干的现代化产业体系。\n③正确，习近平总书记指出，建设中华民族现代文明，是推进中国式现代化的必然要求，是社会主义精神文明建设的重要内容。江苏要加强优秀传统文化的保护传承和创新发展，积极参与建设长江和大运河两大国家文化公园。要大力发展现代科技、教育事业，全面提升人民群众的科学文化素质。要繁荣发展文化事业和文化产业，持续推进城乡公共文化服务标准化、均等化······\n④正确，习近平总书记强调，江苏必须在保障和改善民生、推进社会治理现代化上走在前列。要加快健全社会保障体系，健全就业促进机制和就业公共服务体系，做好重点群体就业工作。要坚持和发展新时代“枫桥经验”、“浦江经验”，完善社会治理体系，健全城乡基层治理体系和乡村治理协同推进机制，推进社会治理数字化。要推进应急管理体系和能力现代化······\n故做法正确的有①②③④，共4项。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"13319189","cat":"新思想","stem":"习近平总书记指出，中华民族有着五千多年的悠久历史和灿烂文化，而且中华文化从远古一直延续发展到今天，是世界上唯一绵延不断，且以国家形态发展至今的伟大文明，具有突出的连续性。关于中华文化为何具有突出的连续性，下列说法正确的是：\n①强大的文化主体性，夯实了中华文明连续性的内在支撑\n②浩如烟海的文化典籍成为中华文明连续性的天然载体\n③独特又稳定的地理环境，筑牢了中华文明连续性的自然基础\n④中华文化“中和”的文化价值诉求奠定了中华文明连续性的价值底蕴","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n①错误，《中华文明源远流长的连续性》中指出：“厚重的文化积累是中华文明突出连续性的内在支撑。一个文明能够从不断裂、历久弥新，其中决定连续性的深层次原因必与既有的文化密切相关。换言之，同一个国家‘不断裂’状态的维持，一是其国民的人类遗传基因延续不辍，二是其国家文化基因世代传承。”\n②正确，《习近平总书记这样谈中华文明的连续性》中指出：“中华民族创造了浩如烟海的文化典籍，中华文明在这些代代相传的典籍中得以记载和传承，如四书五经等儒家典籍向来是历代儒家学子首要研学之书，从未中断。······在我国出土的大量考古成果充分展示着中华文明起源和发展的历史脉络，从中可见中华文明传承悠久且从未中断。”由此可见，浩如烟海的文化典籍成为中华文明连续性的天然载体。\n③正确，《中华文明源远流长的连续性》中指出：“独特的地理气候是中华文明突出连续性的自然基础。”《连续性：中华文明的首要特性》中指出：“中华文明成为人类历史上唯一一个绵延5000多年至今未曾中断的灿烂文明。而这主要得益于以下三个因素：第一，独特稳定的地理环境。”\n④正确，《连续性：中华文明的首要特性》中指出：“第二，‘中和’的文化价值诉求。中华文明源远流长、博大精深，其中儒家、道家成为中华文明的主流思想······‘中’就是要把握适当的限度，使自己的言行合乎标准。‘中和’所代表的中性智慧强调的是事物双方的相辅相成、共生共存，从而做到不偏不倚、执两用中······总而言之，‘中和’的文化价值诉求成就了‘贵和持中、自强不息’的中华文明，奠定了中华文明源远流长的价值底蕴。”\n故②③④表述正确。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"13319196","cat":"新思想","stem":"习近平总书记指出，全面依法治国是国家治理的一场深刻革命。我们要坚持走中国特色社会主义法治道路、建设中国特色社会主义法治体系、建设社会主义法治国家。关于中国特色社会主义法治道路的核心要义，下列理解正确的是：\n①中国特色社会主义制度是中国特色社会主义法治体系的根本制度基础\n②党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证\n③中国特色社会主义法治理论是法治体系的理论指导，是全面推进依法治国的行动指南\n④弘扬社会主义法治精神、传承中华优秀传统法律文化是社会主义法治建设的首要任务","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"A","explanation":"本题考查理论与政策。\n①②③正确，《习近平新时代中国特色社会主义思想学习纲要》中“八、全面推进依法治国”部分指出：“中国特色社会主义法治道路的核心要义，就是要坚持党的领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论。党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。坚持中国特色社会主义法治道路，最根本的是坚持党的领导。中国特色社会主义制度是中国特色社会主义法治体系的根本制度基础，是全面推进依法治国的根本制度保障。中国特色社会主义法治理论是中国特色社会主义法治体系的理论指导和学理支撑，是全面推进依法治国的行动指南。”\n④错误，《法治中国建设规划（2020－2025年）》中“二、全面贯彻实施宪法，坚定维护宪法尊严和权威”部分指出：“建设法治中国，必须高度重视宪法在治国理政中的重要地位和作用，坚持依宪治国、依宪执政，把全面贯彻实施宪法作为首要任务，健全保证宪法全面实施的体制机制，将宪法实施和监督提高到新水平。”\n故①②③表述正确。\n故正确答案为A。","no":5,"missingImage":false},{"type":"question","qid":"13319195","cat":"时事政治","stem":"习近平总书记在党的二十届三中全会上提出，到2035年，全面建成高水平社会主义市场经济体制，为中国式现代化提供重要保障。下列做法属于构建高水平社会主义市场经济体制举措的是：\n①培育壮大先进制造业集群，推进制造业高端化、智能化、绿色化发展\n②推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通\n③坚持和落实“两个毫不动摇”，促进各种所有制经济优势互补、共同发展\n④依法平等长久保护各种所有制经济产权，建立高效的知识产权综合管理体制","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议审议通过了《中共中央关于进一步全面深化改革、推进中国式现代化的决定》（以下简称《决定》）。\n①错误，《决定》在“三、健全推动经济高质量发展体制机制”部分指出“（9）健全促进实体经济和数字经济深度融合制度。加快推进新型工业化，培育壮大先进制造业集群，推动制造业高端化、智能化、绿色化发展······”故此举措说法无误，但不属于构建高水平社会主义市场经济体制。\n②正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（6）构建全国统一大市场。推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。加强公平竞争审查刚性约束，强化反垄断和反不正当竞争，清理和废除妨碍全国统一市场和公平竞争的各种规定和做法······”\n③正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（5）坚持和落实‘两个毫不动摇’。毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展，保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护，促进各种所有制经济优势互补、共同发展。”\n④正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（7）完善市场经济基础制度。完善产权制度，依法平等长久保护各种所有制经济产权，建立高效的知识产权综合管理体制······”\n综上，②③④正确。\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"13319193","cat":"时事政治","stem":"习近平总书记多次深刻阐释“以人民为中心”的执政理念。党的二十届三中全会将这一执政理念确定为进一步全面深化改革必须遵循的原则，强调坚持以人民为中心，尊重人民主体地位和首创精神，人民有所呼、改革有所应，做到改革为了人民、改革依靠人民、改革成果由人民共享。某市的下列举措符合“以人民为中心”的原则的是：\n①创办共富市集，减免低收入群众和灵活就业收入人员摊位费\n②建立“百姓会客厅”机制，密切联系群众，问计于民、问需于民\n③全国推进公用事业市场化改革提升，提升资源配置效率，减轻财政负担\n④持续完善积分落户制，促进有稳定就业的外来人口有序实现市民化","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n“以人民为中心的发展思想”是习近平总书记于2015年10月26日至29日，党的十八届五中全会提出的治国方针理论。所谓以人民为中心，就是要抓住人民最关心最直接最现实的利益问题，不断保障和改善民生，促进社会公平正义，在更高水平上实现幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶，让发展成果更多更公平惠及全体人民，不断促进人的全面发展，朝着实现全体人民共同富裕不断迈进。\n①正确，“创办共富市集，减免低收入群众和灵活就业收入人员摊位费”能够增加这部分人的收入，有利于共同富裕的实现，是符合“以人民为中心”原则的举措。\n②正确，“建立‘百姓会客厅’机制，密切联系群众，问计于民、问需于民”可以更好地抓住人民最关心最直接最现实的利益问题，以便解决这些问题，是符合“以人民为中心”原则的举措。\n③错误，“全国推进公用事业市场化改革提升，提升资源配置效率，减轻财政负担”更多强调为财政减负，和人民并无直接联系。\n④正确，“持续完善积分落户制，促进有稳定就业的外来人口有序实现市民化”能够更好解决外来人口养老育幼、买房医疗等问题，提高这一群体的幸福感，是符合“以人民为中心”原则的举措。\n综上，①②④正确。\n故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"13319194","cat":"新思想","stem":"习近平总书记强调，就业是最基本的民生，事关人民群众切身利益，事关经济社会健康发展，事关国家长治久安。要实施就业优先战略，促进高质量充分就业。关于促进高质量充分就业，下列表述正确的是：\n①在宏观层面，高质量充分就业主要包括就业机会充分、就业环境公平、就业结构优化、人岗匹配高效、劳动关系和谐等\n②在微观层面，高质量充分就业主要表现为每个公民不仅有活干，而且工作稳定、收入合理、保障可靠、职业安全等\n③高质量充分就业是一个很高的要求，也是一个循序渐进的过程，必须尽力而为、量力而行；必须充分调动人民群众的积极性主动性创造性，引导大家依靠努力奋斗创造幸福生活\n④促进高质量充分就业。要始终坚持就业优先，着力解决结构性就业矛盾，完善重点群体就业支持政策，深化就业体制机制改革，加强劳动者权益保障","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"C","explanation":"本题考查理论与政策。\n2024年11月1日出版的第21期《求是》杂志发表了中共中央总书记、国家主席、中央军委主席习近平的重要文章《促进高质量充分就业》。\n①③正确，②错误，文章指出，党的二十大科学把握就业形势新变化，顺应人民群众新期待，着眼扎实推进高质量发展和全体人民共同富裕，作出了促进高质量充分就业的重大部署。在宏观层面，高质量充分就业主要包括就业机会充分、就业环境公平、就业结构优化、人岗匹配高效、劳动关系和谐等；在微观层面，高质量充分就业主要表现为劳动者不仅有活干，而且工作稳定、收入合理、保障可靠、职业安全等。当然，这是一个很高的要求，也是一个循序渐进的过程，必须尽力而为、量力而行；必须充分调动人民群众的积极性主动性创造性，引导大家依靠努力奋斗创造幸福生活，不能不劳而获、坐享其成。\n④正确，文章指出，促进高质量充分就业，是新时代新征程就业工作的新定位、新使命·····这里，我着重强调5点。第一，始终坚持就业优先······第二，着力解决结构性就业矛盾······第三，完善重点群体就业支持政策······第四，深化就业体制机制改革······第五，加强劳动者权益保障······\n综上，①③④表述正确。\n故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"13319197","cat":"新思想","stem":"习近平总书记对江苏生态文明建设念兹在兹，反复叮嘱江苏要“把保护生态环境摆在更加突出的位置”“走出一条生态优先、绿色发展的新路子”。为贯彻落实总书记的重要指示精神，江苏全面加快推进美丽江苏建设，推动实现人与自然和谐共生的现代化。关于全面推进美丽江苏建设的举措，下列说法正确的是：\n①加强苏北海岸带的国土空间管控，一律不得新增围海和填海\n②建设黄河故道千里生态富民廊道，构建江淮生态经济区湖群绿心\n③推动江河湖海各展所长，统筹推进长江和大运河国家文化公园建设\n④增强省域森林、湿地、土壤、海洋等生态系统固碳作用，支持里下河地区提升生态系统碳汇能力","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n①错误，《国务院关于&lt;江苏省国土空间规划（2021—2035年）&gt;的批复》在“二、筑牢安全发展的空间基础”部分指出：“······除国家重大项目外，全面禁止围填海；严格无居民海岛管理。”\n②③正确，《中共江苏省委江苏省人民政府关于全面推进美丽江苏建设的实施意见》在“四、打造美丽江苏建设示范样板”部分“（十二）塑造‘水韵江苏’品牌”中指出：“以水为脉，推动江河湖海各展所长，统筹推进长江和大运河国家文化公园建设，着力打造太湖全国湖泊治理标杆，构筑蓝湾百里生态百里缤纷百里沿海岸线，建设黄河故道千里生态富民廊道，构建江淮生态经济区湖群绿心，彰显各具特色、各现其美的‘水韵江苏’风采。”\n④正确，《中共江苏省委江苏省人民政府关于全面推进美丽江苏建设的实施意见》在“二、加快发展方式绿色低碳转型”部分“（二）积极稳妥推进碳达峰碳中和”中指出：“落实碳达峰碳中和‘1+N’政策体系，推动能耗双控逐步转向碳排放双控······增强省域森林、湿地、土壤、海洋等生态系统固碳作用，支持里下河地区提升生态系统碳汇能力。深入推进减污降碳协同创新。”\n故②③④说法正确。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"11226410","cat":"新思想","stem":"党的十八大以来，以习近平同志为核心的党中央站在巩固党的执政基础和维护国家政权安全的高度，坚持和加强党对基层治理的领导，不断推进基层治理理论创新、实践创新和制度创新。习近平总书记围绕基层治理发表一系列重要论述，立意高远，内涵丰富，思想深刻，为新时代推进基层治理现代化提供了根本遵循和科学指南，关于总书记基层治理重要论述的精神实质和精髓要义，下列理解正确的有：\n①鲜明树立大抓基层的工作导向\n②深入阐述推进基层治理现代化的价值取向\n③深刻阐明基层治理在国家治理体系中的地位作用\n④科学擘画党组织领导的共建共治共享的基层治理格局\n⑤明确提出构建富有活力和效率的新型基层社会治理体系的工作要求","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"D","explanation":"本题考查理论与政策。\n2024年5月，求是网发表题为《基层是党的执政之基、力量之源》的文章，以下简称文章。\n①正确，文章指出，鲜明树立大抓基层的工作导向。习近平总书记高度重视抓基层打基础，强调“各级都要重视基层、关心基层、支持基层”，“要树立大抓基层的鲜明导向，推动改革举措落到基层，使基层真正强起来”，同时要求“持续深化整治形式主义为基层减负，为基层干部干事创业创造良好条件”。\n②正确，文章指出，深入阐述推进基层治理现代化的价值取向。习近平总书记强调，“保障和改善民生没有终点，只有连续不断的新起点”，“创新社会治理，最终是为了让群众得实惠”······总书记“身入”基层，更“心到”基层，充分彰显了大党大国领袖深厚的人民情怀，生动诠释了以人民为中心的价值取向。\n③正确，文章指出，深刻阐明基层治理在国家治理体系中的地位作用。基础不牢，地动山摇。习近平总书记深刻指出，“基层是党的执政之基、力量之源”，“基层是一切工作的落脚点”······只有把基层党组织建设强、把基层政权巩固好，中国特色社会主义的根基才能稳固。我国国家治理体系的一个优势就是把城乡社区基础筑牢。\n④正确，文章指出，科学擘画党组织领导的共建共治共享的基层治理格局。习近平总书记强调，“基层社区事务很多很繁杂，单靠政府是干不了、也干不好的，必须充分发挥社会各方面作用，激发全社会活力”。党的十九大提出打造共建共治共享的社会治理格局，党的二十大部署建设人人有责、人人尽责、人人享有的社会治理共同体。近年来，各地区各部门坚决贯彻落实党中央决策部署，不断完善党委领导、政府负责、社会协同、公众参与、法治保障的社会治理体系，构建党组织领导的共建共治共享的城乡基层治理格局。\n⑤正确，文章指出，明确提出构建富有活力和效率的新型基层社会治理体系的工作要求。习近平总书记十分关心基层治理创新和治理效能提升，多次强调要“健全党组织领导的自治、法治、德治相结合的基层治理体系”，“要着力推进社会治理系统化、科学化、智能化、法治化”。2024年4月，总书记在重庆考察时进一步要求，“继续推动资源下沉、完善服务设施，强化网格化管理、信息化支撑，提高社区精细化治理、精准化服务水平”，“让城市治理更智能、更高效、更精准”，为提升基层治理效能指明前进方向。\n故①②③④⑤表述正确，共5项。\n故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"13319206","cat":"新思想","stem":"新中国成立75年以来，中国共产党团结带领全国各族人民勠力同心、砥砺奋进，经济实力实现了跨越式发展，深刻改变了世界发展格局。关于新中国成立75年来的经济发展成就，下列表述正确的是：\n①经济总量跃居世界第二位\n②连续十四年保持了世界第一制造业大国地位\n③谷物产量跃居世界第二位\n④改革开放以来成为世界经济增长的重要引擎","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查经济常识。\n2024年9月，国家统计局发布新中国75年经济社会发展成就系列报告（以下简称报告）。\n①正确，报告在“一、从积贫积弱到世界第二大经济体，经济实力、综合国力和国际影响力实现历史性跨越”部分的“（一）国民经济快速增长，经济实力空前跃升”中指出：“······经济总量连续跨越重要关口······2023年超过126万亿元，稳居世界第二大经济体······”\n②正确，报告在“二、从瓶颈制约到优势支撑，基础产业和基础设施空前加强”部分的“（一）工农业生产能力突飞猛进，主要产品产量全球第一”中指出：“······制造业增加值连续14年位居世界第一，占世界份额30%左右，成为驱动全球制造业发展的重要引擎······”\n③错误，报告在“二、从瓶颈制约到优势支撑，基础产业和基础设施空前加强”部分的“（一）工农业生产能力突飞猛进，主要产品产量全球第一”中指出：“······粮食总产量由1949年的2264亿斤增加到2023年的13908亿斤，增长5.1倍；谷物、肉类、花生、茶叶、水果等农产品产量居全球首位······”\n④正确，报告在“一、从积贫积弱到世界第二大经济体，经济实力、综合国力和国际影响力实现历史性跨越”部分的“（三）综合国力跃居世界前列，国际影响力日益彰显”中指出：“新中国成立初期，我国经济总量占世界比重很小，至1978年也仅为1.7%，居世界第10位。改革开放以来，我国经济持续快速增长，成为世界经济增长的重要引擎和稳定力量······”\n故表述正确的是①②④。\n故正确答案为B。","no":11,"missingImage":false}],"count":11,"answerable":11,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"11226406","cat":"人文常识","stem":"巩固和完善农村基本经营制度是党的农村政策的基石，是促进乡村全面振兴、加快建设农业强国的制度基础。关于巩固和完善农业农村基本经营制度的要求，下列表述正确的是：\n①坚持稳定土地承包关系\n②坚持家庭经营基础性地位\n③坚持土地集中连片流转\n④坚持农村土地农民集体所有","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n①②④正确，《关于完善农村土地所有权承包权经营权分置办法的意见》在“二、总体要求”部分“（二）基本原则”中指出：“守住政策底线。坚持和完善农村基本经营制度，坚持农村土地集体所有，坚持家庭经营基础性地位，坚持稳定土地承包关系，不能把农村土地集体所有制改垮了，不能把耕地改少了，不能把粮食生产能力改弱了，不能把农民利益损害了。”\n③错误，《农村土地经营权流转管理办法》在“第一章 总则”部分指出：“第四条 土地经营权流转应当因地制宜、循序渐进，把握好流转、集中、规模经营的度，流转规模应当与城镇化进程和农村劳动力转移规模相适应，与农业科技进步和生产手段改进程度相适应，与农业社会化服务水平提高相适应，鼓励各地建立多种形式的土地经营权流转风险防范和保障机制。”因此，要引导农村土地经营权有序流转，而非坚持土地集中连片流转。\n故①②④表述正确。\n故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"11226408","cat":"法律常识","stem":"根据《农村集体经济组织法》，非农村集体经济组织成员长期在农村集体经济组织工作，对集体做出贡献的，经农村集体经济组织成员大会全体成员四分之三以上同意，可以享有的权利是：\n①参与分配集体收益\n②可以取得宅基地使用权\n③享受农村集体经济组织提供的服务和福利\n④集体土地被征收征用时参与分配土地补偿费等","options":{"A":"①②","B":"①③","C":"②④","D":"③④"},"answer":"B","explanation":"本题考查法律常识。\n①③正确，②④错误，根据《农村集体经济组织法》第十五条规定：“非农村集体经济组织成员长期在农村集体经济组织工作，对集体做出贡献的，经农村集体经济组织成员大会全体成员四分之三以上同意，可以享有本法第十三条第七项、第九项、第十项规定的权利。”第十三条规定：“农村集体经济组织成员享有下列权利：（一）依照法律法规和农村集体经济组织章程选举和被选举为成员代表、理事会成员、监事会成员或者监事；（二）依照法律法规和农村集体经济组织章程参加成员大会、成员代表大会，参与表决决定农村集体经济组织重大事项和重要事务；（三）查阅、复制农村集体经济组织财务会计报告、会议记录等资料，了解有关情况；（四）监督农村集体经济组织的生产经营管理活动和集体收益的分配、使用，并提出意见和建议；（五）依法承包农村集体经济组织发包的农村土地；（六）依法申请取得宅基地使用权；（七）参与分配集体收益；（八）集体土地被征收征用时参与分配土地补偿费等；（九）享受农村集体经济组织提供的服务和福利；（十）法律法规和农村集体经济组织章程规定的其他权利。”\n故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"11226413","cat":"人文常识","stem":"“全面深化改革是一场深刻的社会革命，是一项复杂的系统工程，必须以科学的方法论为指导方能行稳致远。”这句话与下列古语所蕴含的理念相契合的是：","options":{"A":"事必有法，然后可成","B":"于安思危，于治忧乱","C":"备豫不虞，为国常道","D":"取之有度，用之有节"},"answer":"A","explanation":"本题考查马克思主义。\n“全面深化改革是一场深刻的社会革命，是一项复杂的系统工程，必须以科学的方法论为指导方能行稳致远。”强调了科学方法的重要性。\nA项正确，“事必有法，然后可成”意思是任何事情都有方法，只有找到合适的方法，才能成功。强调了科学方法的重要性，蕴含的理念与题干一致。\nB项错误，“于安思危，于治忧乱”意思是即使居于安乐的环境里，也要想到可能出现的危险；即使处在稳定的境况中，也要忧虑可能发生的动乱。‌强调的是矛盾的同一性，即矛盾双方相互依存、相互转化。蕴含的理念与题干不一致。\nC项错误，“备豫不虞，为国常道”意思是事先防备意外之事，是治理国家的常道。强调了防患于未然的重要性，蕴含的理念与题干不一致。\nD项错误，“取之有度，用之有节”意思是在获取资源时要有限度，在使用时要节制。强调了质量互变原理中“度”的重要性观点，蕴含的理念与题干不一致。\n故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"11226414","cat":"人文常识","stem":"下面图片是我国为纪念某一特定节日而发行的纪念邮票，据此可判断该节日是：\n\u003cimg data-k=\"69ec03d43d4a\" style=\"max-width:461px\">\n\u003cimg data-k=\"4f00446a215a\" style=\"max-width:342px\">\n\u003cimg data-k=\"113b9700350f\" style=\"max-width:281px\">","options":{"A":"青年节","B":"教师节","C":"植树节","D":"重阳节"},"answer":"B","explanation":"本题考查人文常识。\nA项错误，青年节是5月4日，邮票中没有任何与青年节相关的元素，如五四青年节相关的历史事件、标志等。\nB项正确，第一张邮票写着“9月10日教师节”；第二张邮票左侧有“立德树人”的文字，“立德树人”是教育的根本任务；第三张邮票左侧有“教师节·师恩难忘”的文字。都表明这些邮票是为纪念教师节发行的。\nC项错误，植树节是3月12日，邮票中没有种植树木、树苗等与植树节直接相关的元素。\nD项错误，重阳节是农历9月9日，有登高祈福、拜神祭祖、晒秋、赏菊、饮宴祈寿等习俗，邮票中没有相关的元素。\n故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"11226417","cat":"人文常识","stem":"七巧板是一种古老的中国传统智力玩具，由一个正方形切割成的大小、形状各异的七块板组成。它们可以拼成许多图形，其原理在我国现代社区治理中多有体现。下列我国社区治理实践与七巧板的原理相契合的是：","options":{"A":"网格化管理","B":"社区服务外包","C":"河湖长制","D":"首问责任制"},"answer":"A","explanation":"本题考查管理常识。\nA项正确，网格化，就是将城区行政性地划分为一个个的“网格”，使这些网格成为政府管理基层社会的单元。网格化管理依托统一的城市管理以及数字化平台，将城市管理辖区按照一定的标准划分成为单元网格。通过加强对单元网格的部件和事件巡查，建立一种监督和处置互相分离的形式。\nB项错误，社区公共服务外包是一种新型的政府提供社区公共服务的模式。它将社区公共服务的提供和生产的概念区分开来，较好地兼顾了服务提供的效率和公平，而专业的社工、非营利组织和营利性组织进入社区服务领域，大大改善了社区的服务环境，满足社区人群对公共服务日益提升的多元化需求。\nC项错误，河湖长制即河长制、湖长制的统称，是由各级党政负责同志担任河湖长，负责组织领导相应河湖治理和保护的一项生态文明建设制度创新。通过构建责任明确、协调有序、监管严格、保护有力的河湖管理保护机制，为维护河湖健康生命、实现河湖功能永续利用提供制度保障。\nD项错误，首问责任制是针对群众对机关内设机构职责分工和办事程序不了解、不熟悉的实际问题，而采取的一项便民工作制度。该制度规定群众来访时，机关在岗被询问的工作人员即为首问责任人。要求首问责任人对群众提出的问题或要求，无论是否是自己职责（权）范围内的事，都要给群众一个满意的答复。\n故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"13319234","cat":"科技常识","stem":"当人们乘坐列车进藏时，会在青藏铁路旁发现一个特别的景象，路基两旁时不时会闪过一排排金属管，这些金属管插入地底，露出地面的部分高达两米（如图所示）。关于这些金属管的作用，下列说法正确的是：\n\u003cimg data-k=\"fa5e96f09f0d\" style=\"max-width:600px\">","options":{"A":"收集传导气象信息","B":"实时监控路基安全","C":"阻挡动物横穿铁路","D":"保护冻土层的结构"},"answer":"D","explanation":"本题考查地理国情。\nD项正确，A、B、C三项错误，青藏高原由于海拔高气温低，冻土层分布广泛。随着温度的变化，土体会产生多次冻融和冻胀，这样的过程容易造成土层结构破坏、地基承载力降低、边坡失稳等问题。为了减少温度上升冻土融化下沉造成的路基下沉，需要在路基沿线架设热棒。热棒是一种高约4米、内部中空、外部有散热片的金属柱子，其根部有很多空心管通入路基之中，当路基受热有水汽出现，这些水汽就会顺着空心管道上升至热棒中。高原地区的气温低、风力大，寒冷的风吹过热棒的散热片后，把热量带走，水汽就此也降温凝结。故这些金属管的作用为保护冻土层的结构。\n故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"11226412","cat":"人文常识","stem":"某地遭遇特大暴雨灾害，地处深山的M社区断水断电断网，成为一座孤岛，洪水冲毁附近铁路，千名乘客滞留车厢。紧急关头，社区党支部孟书记带领党员和居民安置转运近千名滞留乘客，解决他们的吃、住等问题，保障了他们的生命财产安全，为后续救援赢得了宝贵时间。关于孟书记事迹所体现的职业道德，下列表述最贴切的是：","options":{"A":"秉公用权，公私分明，努力维护和促进社会公平正义","B":"依法履职，严格按照法定的权限、程序和方式执行公务","C":"精通业务知识，勤勉敬业、求真务实，兢兢业业做好本职工作","D":"敢于担当、无私奉献，面对困难奋勇而上，面对危机挺身而出"},"answer":"D","explanation":"本题考查毛中特。\nA项错误，“秉公用权，公私分明，努力维护和促进社会公平正义”主要侧重于在权力使用过程中不偏不倚，处理公共事务时公正无私，维护社会公平正义。而题干中孟书记的事迹重点在于他面对特大暴雨灾害这种紧急困难情况时的应对举措，并没有突出权力使用以及公平正义相关方面。\nB项错误，“依法履职，严格按照法定的权限、程序和方式执行公务”强调的是在执行公务时遵循法律规定的权限和程序。但题干主要围绕孟书记带领大家积极应对灾害，保障滞留乘客生命财产安全展开，并没有涉及到依法依规按程序执行公务的内容。\nC项错误，“精通业务知识，勤勉敬业、求真务实，兢兢业业做好本职工作”着重体现的是对业务知识的掌握以及工作态度方面。题干重点突出的是孟书记在面临特大暴雨灾害这种危机情况时的担当和奉献精神，并非强调业务知识和日常工作态度。\nD项正确，“敢于担当、无私奉献，面对困难奋勇而上，面对危机挺身而出”很好地契合了孟书记在社区遭遇特大暴雨灾害、乘客滞留的危机时刻，带领党员和居民积极安置转运滞留乘客，解决各种问题，保障生命财产安全的行为，充分体现了孟书记在困难和危机面前敢于承担责任、无私奉献的精神品质。\n故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"11226418","cat":"人文常识","stem":"张某与李某同住一个小区，双方发生借款纠纷，张某起诉到法院，法院判决李某应偿还借款，但李某未履行生效判决。为此，张某在小区业主群向李某讨债，并在小区公告栏、电梯间等处张贴判决书。李某认为张某侵犯了其个人权益。对此，下列说法正确的是：","options":{"A":"张某正当行使权利，其讨债行为不构成侵权","B":"张某向李某公开讨债，侵犯了李某的名誉权","C":"张某公开张贴判决书，侵犯了李某的隐私权","D":"张某应当申请法院强制执行，无权自行讨债"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，C项正确，根据《中华人民共和国民法典》第一千零三十二条规定：“自然人享有隐私权。任何组织或者个人不得以刺探、侵扰、泄露、公开等方式侵害他人的隐私权。隐私是自然人的私人生活安宁和不愿为他人知晓的私密空间、私密活动、私密信息。”题中，张某未经许可，将带有李某个人信息的判决书公布到小区，侵犯了李某的隐私权。\nB项错误，根据《中华人民共和国民法典》第一千零二十四条规定：“民事主体享有名誉权。任何组织或者个人不得以侮辱、诽谤等方式侵害他人的名誉权。名誉是对民事主体的品德、声望、才能、信用等的社会评价。”题中，张某未经许可，将带有李某个人信息的判决书公布到小区，并未以侮辱、诽谤等方式侵害李某的名誉权。\nD项错误，根据《中华人民共和国民事诉讼法》第二百四十七条规定：“发生法律效力的民事判决、裁定，当事人必须履行。一方拒绝履行的，对方当事人可以向人民法院申请执行，也可以由审判员移送执行员执行。调解书和其他应当由人民法院执行的法律文书，当事人必须履行。一方拒绝履行的，对方当事人可以向人民法院申请执行。”因此，张某可以申请法院强制执行，但是也有权自行讨债。\n故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"11226419","cat":"法律常识","stem":"燕某、郑某是某小区业主委员会的主任和委员，同时也是业主微信群的群主和管理员。业主徐某在业主群中发言，质疑业主委员会不依法办事，并与多位业主发生争执，郑某将其移出群。徐某向燕某投诉，要求重新入群，燕某拒绝并将其拉黑。徐某认为其人格受到贬损，欲将燕某、郑某起诉至法院，对此，下列说法正确的是：","options":{"A":"郑某作为管理员不拥有平台赋予的“踢人”权力","B":"燕某作为群主将业主徐某拉黑，侵害了其人格权","C":"入群、退群、移出群等行为不属于民事诉讼受案范围","D":"业主微信群的群主、管理员没有自主选择群成员的权力"},"answer":"C","explanation":"本题考查法律常识。\nA、D两项错误，根据《互联网群组信息服务管理规定》第九条第一款规定：“互联网群组建立者、管理者应当履行群组管理责任，依据法律法规、用户协议和平台公约，规范群组网络行为和信息发布，构建文明有序的网络群体空间。”题中，业主微信群的群主、管理员有权依照规定履行包括将群成员移出群组、自主选择群成员在内的群组管理职责。\nB项错误，根据《中华人民共和国民法典》第九百九十条规定：“人格权是民事主体享有的生命权、身体权、健康权、姓名权、名称权、肖像权、名誉权、荣誉权、隐私权等权利。除前款规定的人格权外，自然人享有基于人身自由、人格尊严产生的其他人格权益。”题中，并未表明燕某发表过对徐某侮辱、诽谤的内容，燕某作为群主将业主徐某拉黑不构成对其人格权的侵犯。\nC项正确，根据《中华人民共和国民事诉讼法》第三条规定：“人民法院受理公民之间、法人之间、其他组织之间以及他们相互之间因财产关系和人身关系提起的民事诉讼，适用本法的规定。”入群、退群、移出群等行为不涉及公民之间的人身和财产关系，不产生民事法律关系，因此不属于民事诉讼受案范围。\n故正确答案为C。","no":20,"missingImage":false}],"count":9,"answerable":9,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        大地的深处，一粒粒种子正悄然从土壤中苏醒。它们曾在土壤的怀抱中沉睡，身上\u003cu>        \u003c/u>着生命的力量。在被称为“种子诺亚方舟”的国家作物种质库里，借助科技的力量，无数跨越时空的种子在此“\u003cu>        \u003c/u>”。\u003c/p>\u003cp>        国家作物种质库有几个特点：第一是容量大——拥有150万份的总容量，是目前全球最大的国家级农作物种质资源库；第二是保存方式体系化，它囊括了现在所有植物种质资源保存的技术条件，包括低温种子保存、试管苗保存、超低温保存和DNA保存；第三是实现了自动化信息化管理。\u003c/p>\u003cp>        农稳社稷，种子为基。作物种质资源是支撑粮食丰收的一个重要基础——正如国家作物种质库的设计理念“承接上苍之甘露，孕育万物之繁衍”。因此，种质资源库的使命就是长久、安全地保存好这些种质资源，为农业发展提供支撑。\u003c/p>\u003cp>        种质资源最主要的保存方式是低温种子保存，国家作物种质库采用\u003cimg data-k=\"d3282721e766\">低温和45%以下相对湿度保存种子。全球约有90%的种质资源是以种子形式保存的。种质资源保存的方式还有超低温。超低温保存需要用到的工具是液氮罐，国家作物种质库的一个液氮罐大概能够保存1万份种质资源。\u003c/p>\u003cp>        像香蕉这些没有种子的作物，通常是把一棵一棵的植株种到种质资源圃里保存，这是无性繁殖作物种质资源非常重要的一种保存方式。但是植株在露天环境中，会面临自然灾害以及病虫害威胁。为了应对这个情况，在种质资源圃保存的基础上，配套超低温保存，把植株的一些关键组织取下来，经过一系列处理后，放到\u003cimg data-k=\"2a5a2efa92e7\">的液氮里去，这样就能够永久保存下来。\u003c/p>\u003cp>        芒果等热带水果也需要液氮保存。虽然芒果有种子，但很多芒果果核很大，不能忍耐脱水、不能耐受低温，所以一般也不能放在低温种子库保存，就需要把芒果种子的胚，即生长点取下来，经过一系列处理之后放到液氮里保存。\u003c/p>\u003cp>        种质资源还可以采用试管苗保存。把植株的茎尖等生长点取下来，放在瓶子里——瓶子下面有看上去像果冻一样的培养基，它能提供营养让茎尖在上面慢慢生长。超低温和试管苗，主要都是用来保存无性繁殖作物和一些多年生的作物。如果作物方便转化成试管苗，那么就会用这种方式来保存。如果不太方便转化成试管苗，作物就先在液氮罐里进行超低温保存。\u003c/p>\u003cp>        试管苗方式保存的种质资源处在活跃的生长状态。试管苗属于真正的“温室里的花朵”，但是如果需要的话，把它们从瓶子里拿出来以后，再经过一些“锻炼”，就可以迅速恢复生产。种子在瓶子里是在不断生长的，因此也会不断消耗，当培养基的营养用完之后，或苗子长“老”了之后，就需要把它的生长点再拿下来，换一个瓶子，让它的生命周而复始无限循环下去。\u003c/p>\u003cp>        每一粒种子都承载着生命的希望，从一粒小小的种子到丰收的田野，这是一场科技与自然的默契合作。国家作物种质库不仅是种子的守护者，更是未来农业发展的基石。这些看似平凡的种子，正汇聚成中华民族的繁荣根基，支撑着农业强国的梦想。\u003c/p>","questions":[{"qid":"13319302","cat":"逻辑填空","stem":"依次填入文中画横线部分最恰当的一项是：","options":{"A":"积蓄 安家","B":"蕴藏 休憩","C":"涵养 冬眠","D":"勃发 修炼"},"answer":"A","explanation":"本题可从第二空入手。根据“种子诺亚方舟”可知，横线处应体现国家作物种质库像诺亚方舟一样，将无数跨越时空的种子安置起来，使其存活下来。A项“安家”指安置家庭，置于此处能够生动形象地体现出种子在种质库中存活的状态，符合文意，保留。B项“休憩”指休息，C项“冬眠”指某些动物在寒冷的冬季休眠，D项“修炼”指道家修养练功、炼丹等活动，均与文意不符，排除。\n第一空，代入验证。横线处应体现种子与“生命的力量”之间的关系，且根据“一粒粒种子正悄然从土壤中苏醒”可知，横线处应体现种子具有了生命的力量。A项“积蓄”指积聚、储存，符合文意，当选。\n故正确答案为A。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":21,"missingImage":false},{"qid":"13319303","cat":"片段阅读","stem":"关于“超低温保存”种质资源，下列表述与文意相符的是：","options":{"A":"未必都需要使用液氮罐保存作物的种子","B":"大都需要与种质资源圃保存法配套使用","C":"可有效减少自然灾害对种质资源的影响","D":"可以直接保存芒果这类热带水果的种子"},"answer":"C","explanation":"A项：根据第四段“超低温保存需要用到的工具是液氮罐”可知，选项表述与文意相悖，排除。\nB项：根据第五段“但是植株在露天环境中，会面临自然灾害以及病虫害威胁。为了应对这个情况，在种质资源圃保存的基础上，配套超低温保存······这样就能够永久保存下来”可知，种质资源圃保存法与超低温保存法配套使用效果会更好，但并未提及大都需要配套使用，无中生有，排除。\nC项：根据第五段“但是植株在露天环境中，会面临自然灾害以及病虫害威胁。为了应对这个情况，在种质资源圃保存的基础上，配套超低温保存······这样就能够永久保存下来”可知，选项表述正确，当选。\nD项：根据第六段“虽然芒果有种子，但很多芒果果核很大，不能忍耐脱水、不能耐受低温，所以一般也不能放在低温种子库保存，就需要把芒果种子的胚，即生长点取下来，经过一系列处理之后放到液氮里保存”可知，选项表述与文意相悖，排除。\n故正确答案为C。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":22,"missingImage":false},{"qid":"13319305","cat":"片段阅读","stem":"根据文意推断，在国家作物种质库里，玉米最可能采用的保存方式是：","options":{"A":"低温种子保存","B":"试管苗保存","C":"超低温保存","D":"种质资源圃保存"},"answer":"A","explanation":"A项：根据第四段“种质资源最主要的保存方式是低温种子保存，国家作物种质库采用\u003cimg data-k=\"d3282721e766\">低温和45%以下相对湿度保存种子。全球约有90%的种质资源是以种子形式保存的”可知，玉米作为有种子的作物，最有可能采用低温种子保存的方式，当选。\nB、C两项：根据第七段“超低温和试管苗，主要都是用来保存无性繁殖作物和一些多年生的作物”可知，玉米并非无性繁殖或多年生作物，通常不会通过试管苗、超低温的方式保存，均排除。\nD项：根据第五段“像香蕉这些没有种子的作物，通常是把一棵一棵的植株种到种质资源圃里保存，这是无性繁殖作物种质资源非常重要的一种保存方式”可知，玉米为有种子的作物，通常不会通过种质资源圃方式保存，排除。\n故正确答案为A。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":23,"missingImage":false},{"qid":"13319306","cat":"片段阅读","stem":"作者在介绍国家作物种质库诸多特点时，重点说明的是：","options":{"A":"容量大且独一无二","B":"保存方式齐备完善","C":"管理方式精准智能","D":"设计理念别具匠心"},"answer":"B","explanation":"文章第二段总体介绍了国家作物种质库“容量大”“保存方式体系化”“实现了自动化信息化管理”这三个特点，但文章第四至八段分别详细介绍了低温种子保存、种质资源圃保存、超低温保存、试管苗保存等多种保存方式及其适用情况等内容，故作者在介绍国家作物种质库诸多特点时，重点说明的是其保存方式多样化、体系化，对应B项。\nA、C、D三项：A项“容量大”、C项“管理方式”、D项“设计理念”均只是简单提及，并未展开重点说明，排除。\n故正确答案为B。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":24,"missingImage":false},{"qid":"13319307","cat":"片段阅读","stem":"下列最适合做这篇文章标题的是：","options":{"A":"作物种质库里的未来农业","B":"平凡的种子，不平凡的“家”","C":"国家作物种质库：生命的起点","D":"“种子诺亚方舟”守护农业火种"},"answer":"D","explanation":"文章第一段引出“种子诺亚方舟”的话题，即国家作物种质库的概念，第二段介绍了国家作物种质库的三个特点，第三段介绍了作物种质资源的重要作用及种质资源库的使命，第四至八段详细介绍了种质资源的保存方式，第九段总结全文，再次指出种子和国家作物种质库的重要意义，即国家作物种质库不仅是种子的守护者，更是未来农业发展的基石。故文章主要围绕“种子诺亚方舟”即国家作物种质库展开，强调其对保护种子、支撑我国成为农业强国的重要性，D项契合文章中心，且表述生动形象，当选。\nA项：文章强调的是国家作物种质库对保护种子、支撑我国成为农业强国的重要性，而非单纯阐述“作物种质库”与“未来农业”的关系，偏离文章中心，排除。\nB项：“不平凡的‘家’”表述不明确，没有突出国家作物种质库对保护种子、支撑我国成为农业强国的重要性，排除。\nC项：“生命的起点”概念范围扩大，文章仅强调“保护种子”，偏离文章中心，排除。\n故正确答案为D。\n【文段出处】科普时报《在“种子诺亚方舟”守护农业火种》","no":25,"missingImage":false},{"qid":"13319266","cat":"片段阅读","stem":"在江苏，自动驾驶已成为创新技术重塑物流运输产业的重要载体。搭载多类型传感器的智慧重型卡车，一旦切换到智能辅助驾驶状态，驾驶员就变身为安全员，只需坐在车上监管，智慧重型卡车会根据实时路况减速、避让或变道。除了智慧重型卡车，应用于港口的自动驾驶集装箱卡车也已完成技术验证的初始阶段，驶入了大规模商业应用的快车道。行驶在物流园区与制造业企业之间的自动驾驶物流车，则在智驾系统助力下，实现了物流业与制造业的深度融合。\n这段文字重在说明：","options":{"A":"自动驾驶在江苏的应用场景已经越来越广阔","B":"物流车应用智能技术使得驾驶员获得了解放","C":"自动驾驶促进了江苏物流运输业的发展升级","D":"物流车因智能技术的加持应用范围不断扩大"},"answer":"C","explanation":"文段开篇指出自动驾驶成为江苏地区创新技术重塑物流运输产业的重要载体，接着通过智慧重型卡车、自动驾驶集装箱卡车、自动驾驶物流车的例子，对前文进行举例论证，具体说明自动驾驶在江苏物流运输领域的应用和积极影响。故文段重点强调自动驾驶促进江苏地区重塑物流运输产业，对应C项。\nA项：“应用场景已经越来越广阔”表述不明确，文段强调自动驾驶在江苏物流运输业的应用，排除。\nB项：“驾驶员获得了解放”对应举例论证的部分内容，非重点，排除。\nD项：“智能技术”范围扩大，文段的主题词为“自动驾驶”，排除。\n故正确答案为C。\n【文段出处】人民日报《自动驾驶，让货运更智慧》","no":26,"missingImage":false},{"qid":"12100969","cat":"片段阅读","stem":"近年来，网购发展势头迅猛，各类购物节层出不穷。每到大促销那几天，网络延迟、抢不到货、运力紧张等问题会直接影响消费者购物体验。为此，商家和平台想出了很多应对方法，预售便是其中之一。预售最直接的好处，就是提前知道能卖多少。通过预售，能对未来销售量作出较为精准的预测，从而解决备货和周转问题。如果遇到购物节，预售还能提前制造话题、增加活动曝光度，唤醒消费者的潜在需求。预售打了个时间差，也缓解了平台在购物节期间的流量压力。\n这段文字意在说明：","options":{"A":"网络商家和平台选择预售模式的原因","B":"网络购物节期间预售发挥的重要作用","C":"预售能提升消费者促销期间购物体验","D":"预售的好处是能刺激消费者购物需求"},"answer":"A","explanation":"文段开篇指出在大促销的时候会出现一些影响消费者购物体验的问题，接着通过“应对方法”给出对策，即预售，然后从多个方面详细解释了预售的好处。故文段重点在于对策，强调商家和平台选择预售的模式来解决大促销期间购物产生的问题，对应A项。\nB项：“预售发挥的重要作用”对应解释说明的内容，非重点，排除。\nC项：“提升消费者促销期间购物体验”表述片面，文段说的是除了消费者获得好处外，商家和平台也获得了好处，排除。\nD项：“刺激消费者购物需求”对应解释说明的内容，非重点，且表述片面，排除。\n故正确答案为A。\n【文段出处】经济日报《商家为什么爱预售》","no":27,"missingImage":false},{"qid":"13319272","cat":"片段阅读","stem":"口口相传的经验是讲故事的人的灵感来源。在劳动的氛围中讲故事，是一种交流方式。每一个讲故事的人都会在故事中留下自己的痕迹，就像制陶人会在陶器上留下自己的印记一样。人在放松的状态下听故事，内心会想记下这些故事，并有对他人转述故事的愿望，这就构成了听故事的人与讲故事的人之间的关系。讲故事的人就像智者一样，能讲出自己的人生经验，也能讲出他人的经验、历史的经验，他们能让故事的火把生活的灯芯点燃。\n这段文字中“在故事中留下自己的痕迹”的含义最有可能是：","options":{"A":"每个故事都会被讲故事的人加入一些自身经历","B":"讲故事的人会结合个人阅历对故事进行再加工","C":"讲故事的人会向听故事的人讲自己的人生经验","D":"每个故事在被多个人讲述之后内容会发生变化"},"answer":"B","explanation":"文段开篇表明讲故事的人的灵感源于口口相传的经验，接着指出讲故事的人会在故事中留下自己的痕迹，并用制陶人做类比，强调讲故事的人会在故事中留下属于自己的印记，然后从听故事的人的角度，阐述听故事的人与讲故事的人之间的互动关系，最后把讲故事的人比作智者，强调他们既能讲出自己的人生经验，也能传达他人的经验和历史的经验，进一步说明讲故事的人会在故事中留下属于自己的独特印记。故“在故事中留下自己的痕迹”指的是讲故事的人会在故事中加入自己的人生经验，或者自己对他人经验、历史经验的理解，对应B项。\nA、D两项：“每个故事”主体错误，文段中“留下自己的痕迹”的主体应该是“讲故事的人”，均排除。\nC项：“讲自己的人生经验”表述片面，文段提到讲故事的人还能讲他人的经验和历史的经验，排除。\n故正确答案为B。\n【文段出处】网易《火与灯芯》","no":28,"missingImage":false},{"qid":"13319269","cat":"片段阅读","stem":"司法建议最初源于行政诉讼。近年来，司法建议的适用范围不断拓展，从保障法院裁判执行措施，进阶升级为社会矛盾纠纷的预防性机制。司法建议既是对传统“治未病”理念的继承，也是对新时代“枫桥经验”的一项创新性实践。通过司法建议，对案件审理过程中发现的可能影响社会和谐的隐患或因素提出建议，以预防纠纷再次发生。有效的司法建议不仅能预先准确找出矛盾纠纷产生的原因，还能进一步提升法院的权威，彰显司法的人文关怀。\n下列关于司法建议的说法，与文意不符的是：","options":{"A":"适用范围正在逐步地扩大","B":"不会弱化司法机关的权威","C":"可有效避免社会矛盾产生","D":"是一种更柔性的治理方式"},"answer":"C","explanation":"A项：根据“近年来，司法建议的适用范围不断拓展”可知，该项表述正确，排除。\nB项：根据“有效的司法建议不仅能预先准确找出矛盾纠纷产生的原因，还能进一步提升法院的权威”可知，该项表述正确，排除。\nC项：根据“近年来，司法建议的适用范围不断拓展，从保障法院裁判执行措施，进阶升级为社会矛盾纠纷的预防性机制”“通过司法建议，对案件审理过程中发现的可能影响社会和谐的隐患或因素提出建议，以预防纠纷再次发生”可知，司法建议目前只能起到“预防社会矛盾纠纷”“预防纠纷再次发生”的作用，“有效避免社会矛盾产生”表述过于绝对，当选。\nD项：根据“有效的司法建议不仅能······还能······彰显司法的人文关怀”可知，该项表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明日报《司法建议：为柔性治理提供一副“良方”》","no":29,"missingImage":false},{"qid":"13319281","cat":"片段阅读","stem":"有关数据显示：2024年1—7月，高端装备制造业销售收入同比增长8.3%，占制造业总销售收入的比重为16.5%，较上年同期提高0.5个百分点；智能设备制造业销售收入同比增长12.4%；高耗能制造业销售收入占制造业比重为30.7%，较上年同期下降0.8个百分点，节能降耗工作有序推进；制造业企业采购环境治理服务金额同比增长6.2%，增速较2023年加快2.4个百分点，治污投入不断加大。\n这段文字重在说明：","options":{"A":"制造业持续不断在国民经济发展中起领跑作用","B":"经济发展亮点频现呈现出持续向好的发展态势","C":"制造业正向高端化智能化绿色化发展扎实推进","D":"经济发展与生态治理齐头并进为实现双赢努力"},"answer":"C","explanation":"文段首先列举了2024年1—7月高端装备制造业销售收入增长的数据，接着通过分号进行衔接，列举了智能设备制造业销售收入增长、高耗能制造业销售收入降低的数据，以及制造业企业采购环境治理服务金额增长的数据。故文段为由分号衔接的并列结构，需全面概括，强调制造业正在向着高端、智能、低耗能、少污染的方向发展，对应C项。\nA项：“领跑作用”文段并未提及，无中生有，排除。\nB、D两项：均缺少文段核心话题“制造业”，排除。\n故正确答案为C。\n【文段出处】人民日报《透过增值税发票看经济亮点》","no":30,"missingImage":false},{"qid":"12100985","cat":"片段阅读","stem":"海洋牧场，顾名思义就像是在海洋中建设“牧场”，如同在大草原上放牧牛羊一样，通过科学规划和管理，对鱼、虾、贝、藻等海洋资源进行有计划的海上牧养。有专家推算，海洋向人类提供食物的能力，相当于全世界陆地耕地面积所提供食物的1000倍。在全球粮食供应矛盾日益突出的今天，解决好中国这个人口大国的吃饭问题、保障粮食安全，要树立大食物观，既向陆地要食物，也向海洋要食物，建设海上牧场、“蓝色粮仓”。\n最适合做这段文字标题的是：","options":{"A":"渔牧齐抓，保障粮食安全","B":"陆海兼收，树立大食物观","C":"“牧场”，奏响“深海乐章”","D":"“种粮”于海，打造“蓝色粮仓”"},"answer":"D","explanation":"文段开篇对“海洋牧场”的概念进行解释，指出其像在大草原上放牧一样，在海洋中对鱼、虾等海洋资源进行有计划的牧养，接着通过专家推算强调海洋提供食物的能力巨大，最后介绍在全球粮食供应矛盾日益突出的背景下，解决好中国的吃饭问题、保障粮食安全，要树立大食物观，既向陆地要食物，也向海洋要食物，需建设海上牧场、“蓝色粮仓”。故文段重点强调要建设海洋牧场来保障粮食安全，对应D项。\nA、B两项：A项“渔牧齐抓”和B项“陆海兼收”均表述宏观，没有突出“海洋牧场”这一核心内容，文段重点强调在海洋中进行类似于在陆地上放牧的行为，排除。\nC项：偏离文段核心话题“粮食”，排除。\n故正确答案为D。\n【文段出处】今日头条《发展海洋牧场，建设“蓝色粮仓”，这两件事要做好》","no":31,"missingImage":false},{"qid":"13319268","cat":"片段阅读","stem":"“N无”的极简婚礼已成为年轻人婚礼的新趋势，包括“三无”“四无”“五无”婚礼。具体指的是无早起、无接亲、无仪式、无车队、无煽情、无主持、无婚纱、无接亲堵门、无场地布置、无伴娘伴郎等各种“无”的随意搭配组合。他们取消有当众表演之嫌的过度煽情催泪环节，使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车，结束后作为伴手礼赠予亲朋。这些对婚礼的“整顿”，实则是年轻人追求“实用主义”与自我满足在婚礼中的表现。\n下列关于极简婚礼的说法，与文意不符的是：","options":{"A":"让传统、现代和个性在婚礼中更好融合","B":"是对固有的婚礼模式和长辈安排的反抗","C":"年轻人在婚礼中的消费越来越回归理性","D":"年轻人在婚礼中的表现越来越尊重内心"},"answer":"B","explanation":"A项：根据“具体指的是······各种‘无’的随意搭配组合。他们取消有当众表演之嫌的过度煽情催泪环节，使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，“随意搭配组合”体现出个性，结合“使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，既有对传统环节的沿用，也体现出现代性，该项表述正确，排除。\nB项：“对固有的婚礼模式和长辈安排的反抗”文段未提及，无中生有，当选。\nC项：根据“使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，“使用简单环保的装饰”及“用蔬果布置”体现出年轻人在婚礼消费中的理性，该项表述正确，排除。\nD项：根据“这些对婚礼的‘整顿’，实则是年轻人追求‘实用主义’与自我满足在婚礼中的表现”可知，“尊重内心”表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】中国青年报《“整顿”的风吹到了婚礼》","no":32,"missingImage":false},{"qid":"13319277","cat":"片段阅读","stem":"数字货币利用大数据与区块链技术，能够高效记录并存储交易信息及货币流向。这种技术的应用使得货币的创造、流通和监控过程变得更加透明和高效。具体来说，大数据技术的运用使得货币政策的制定者可以快速获取大量实时的经济活动数据，极大提高了数据的准确性和政策制定的针对性。区块链技术的特性——分布式账本，为货币流通提供了一个安全可靠的环境，确保了交易信息的不可篡改和实时追踪，降低了监控成本并减少了实施滞后。此类技术革新为中央银行在制定和实施货币政策时提供了强大的数据支撑，使政策更加精准地匹配经济情况的实际需求。\n这段文字重在说明：","options":{"A":"数字货币使货币政策的制定实施更精准和高效","B":"数字货币在金融监管方面具有较大的应用价值","C":"大数据与区块链技术有利于推动宏观经济发展","D":"大数据与区块链技术为货币流通提供安全保障"},"answer":"A","explanation":"文段开篇引出“数字货币”这一概念，指出其利用大数据与区块链技术使得货币的创造、流通和监控过程变得更加透明和高效，接下来通过“具体来说”分别从大数据技术可提高数据的准确性、政策制定的针对性以及区块链技术能降低监控成本并减少实施滞后这两方面对数字货币的作用进行解释说明，尾句通过指代词“此类技术革新”指代前文内容，得出结论，强调数字货币能为中央银行制定和实施货币政策时提供数据支撑，让政策更精准匹配需求。故文段重点强调数字货币对货币政策的正向作用，主题词为“数字货币”与“货币政策”，对应A项。\nB项：“在金融监管方面具有较大的应用价值”对应文段中数字货币的一项作用，除此之外，数字货币还有“创造”“流通”等方面的作用，选项表述片面，且选项并未提及文段主题词“货币政策”，偏离文段重点，排除。\nC项：“推动宏观经济发展”概念范围扩大，文段仅论述“货币政策”，且选项并未提及文段主题词“数字货币”与“货币政策”，排除。\nD项：“安全保障”对应文段解释说明中“区块链技术”的作用，属于数字货币中的一项技术运用，非重点且表述片面，另外选项并未提及文段主题词“数字货币”与“货币政策”，排除。\n故正确答案为A。","no":33,"missingImage":false},{"qid":"12100972","cat":"语句表达","stem":"近年来，随着科技的发展，AI已经深入到文艺创作的各个领域，并逐渐兴起一场艺术创作模式革命。在流行音乐领域，一批AI作曲软件快速迭代升级，有效推动了新作品的结构优化，增强了旋律扩写能力，一定程度上促进了流行音乐作品的优胜劣汰。AI创作门槛越来越低，使得“全民制作人”成为可能。此种背景下，                    ，成为热门话题。\n填入画横线部分最恰当的一项是：","options":{"A":"AI对流行音乐创作影响几何","B":"流行音乐人应如何利用AI创作","C":"AI作曲软件如何促成全民制作人","D":"流行音乐领域未来如何与AI共生"},"answer":"A","explanation":"横线出现在文段结尾，且为尾句的分句，故需结合横线前内容以及横线所在尾句内容进行分析。文段开篇提到AI深入文艺创作的各个领域，并带来一场艺术创作模式革命，接着具体阐述AI在流行音乐领域所带来的影响，指出AI作曲软件的升级促进了流行音乐作品的优胜劣汰以及AI创作门槛低使“全民制作人”成为可能，尾句通过“此种背景下”总结前文，横线后指出“成为热门话题”。故横线处应继续围绕“AI”和“流行音乐创作”进行论述，概括AI对流行音乐创作产生的影响，对应A项。\nB项：“流行音乐人应如何利用AI创作”表述错误，文段重点论述AI对流行音乐创作整体产生的影响，排除。\nC项：“AI作曲软件如何促成全民制作人”只是AI影响流行音乐创作的一个方面，表述片面，排除。\nD项：“流行音乐领域未来如何与AI共生”强调的是未来的共生关系，而文段更多是在论述当下AI对流行音乐创作已经产生的影响，排除。\n故正确答案为A。\n【文段出处】光明网《AI作曲：会给流行音乐带来什么》","no":34,"missingImage":false},{"qid":"13319282","cat":"片段阅读","stem":"地震预警不等于预测。地震预警简单来说，就是利用两个“时间差”。地震发生时，会产生两种重要的地震波：一种是速度较快但震动较弱的纵波，一种是速度较慢但震动较大的横波。地震发生后，地震仪捕捉到纵波，对地震波信息进行快速处理，计算出地震参数、影响程度和预警时间。抢在横波到达之前，将信息通过更快的电磁波形式分发。目前我国已建设了很多地震预警监测台站，覆盖数十个省份，形成了世界上规模最大的地震预警网。\n下列说法与文意不符的是：","options":{"A":"可以凭借纵横波时间差进行地震预测","B":"地震横波比地震纵波产生的危害更大","C":"地震纵波可先于横波被地震仪捕捉到","D":"通过地震预警可以尽早得知地震信息"},"answer":"A","explanation":"A项，根据“地震预警不等于预测······一种是速度较慢但震动较大的横波”可知，“地震预测”偷换概念，当选；\nB项，根据“一种是速度较快但震动较弱的纵波，一种是速度较慢但震动较大的横波”可知，通常震动越大危害相对越大，表述正确，排除；\nC项，根据“地震发生后，地震仪捕捉到纵波······抢在横波到达之前······”可知，表述正确，排除；\nD项，根据“地震发生后，地震仪捕捉到纵波，对地震波信息进行快速处理······将信息通过更快的电磁波形式分发”可知，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】澎湃新闻《地震预警来临的几秒钟内，我们可以做什么？》","no":35,"missingImage":false},{"qid":"12100975","cat":"片段阅读","stem":"日常生活中，用来加工米饭、馒头等主食的原料，几乎都来自禾本科植物。在成为主食重要来源的过程中，禾本科植物经历了漫长的进化和选择阶段。在长期的物种进化中，野生种经过天然杂交、遗传物质自然加倍，以及异常气候及环境胁迫导致的自然选择，逐步形成了人类可以作为食物进行种植的禾本科植物类型。禾本科植物适应性强，易于推广种植，其籽粒便于储藏、加工，且营养丰富。禾本科植物分布范围广，抗逆性比较强，遗传多样性丰富，因此在不同类型环境中都能种植，并获得较理想的产量。\n这段文字重在说明：","options":{"A":"禾本科植物适应性强且便于种植","B":"禾本科植物成为主食主要原料的缘由","C":"禾本科植物籽粒的营养十分丰富","D":"禾本科植物经历的进化和选择的过程"},"answer":"B","explanation":"文段开篇指出禾本科植物是主食的主要原料，接着说明禾本科植物在成为主食重要来源的过程中，经历了漫长的进化和选择阶段，并具体说明了其形成人类可以作为食物进行种植的禾本科植物类型的进化过程，随后论述禾本科植物自身的特点和种植优势。故文段重在强调禾本科植物成为主食主要原料的原因，对应B项。\nA、C两项：均对应禾本科植物优势中的一部分，表述片面，排除。\nD项：“禾本科植物经历的进化和选择的过程”非重点，排除。\n故正确答案为B。\n【文段出处】人民网《主食为何大多来自禾本科？》","no":36,"missingImage":false},{"qid":"13319280","cat":"片段阅读","stem":"作为一类代谢功能多样的特殊微生物，光合细菌具有强大的生化催化能力和营养益生功能，可以制备多种多样的生物制剂。目前国内科研院所和医药厂商对光合细菌在医药产品开发领域的研究仍处于起步阶段。随着科学技术水平不断进步，研究者对光合细菌类群特殊代谢能力的理解将进一步加深，有助于持续激发该类细菌的产业化潜力。除生产新式治疗药物外，还可利用光合细菌适应极端环境的生存优势，结合基因工程技术，设计开发工程菌株，通过微生物催化作用实现分子结构重组，用以大量生产重要原料药物，或可替代化学制药技术。总体而言，深度拓展光合细菌在医药研究领域的研究，具有良好的应用前景与实践意义，有望推动微生物制药工程可持续发展。\n从这段文字提取关键词最恰当的一项是：","options":{"A":"特殊微生物 光合细菌 生物制药","B":"特殊微生物 代谢能力 产业化","C":"光合细菌 产业化 制药技术","D":"光合细菌 代谢功能 医药应用"},"answer":"D","explanation":"文段开篇引出“光合细菌”这一话题，指出其可以制备多种多样的生物制剂，接着指出虽然目前国内对光合细菌在医药产品开发领域的研究处于起步阶段，但是随着科技水平的进步，研究者对光合细菌的代谢能力的理解将进一步加深，有助于激发其产业化潜力，其可用于生产药物或替代化学制药技术，最后通过“总体而言”进行总结，强调拓展光合细菌在医药研究领域的研究有良好的应用前景与实践意义。故文段围绕光合细菌在医药方面的应用展开论述，D项“光合细菌”“代谢功能”“医药应用”能够很好地概括文段重点，当选。\nA项：“特殊微生物”非重点，排除。\nB项：缺少文段主题词“光合细菌”，偏离文段中心，排除。\nC项：“制药技术”表述片面，无法全面概况光合细菌在医药方面的应用，且“产业化”非重点，排除。\n故正确答案为D。\n【文段出处】知网《光合细菌代谢与其在医药领域的应用》","no":37,"missingImage":false},{"qid":"13319285","cat":"逻辑填空","stem":"目前，我国快递业务已经达到了前所未有的新高度，业务量已突破1000亿件大关。快递物流是经济活力            的“风向标”，不仅            出行业的蓬勃跃升，更彰显了我国经济的繁荣活力与无限潜能。\n依次填入画横线部分最恰当的一项是：","options":{"A":"毋庸置疑 显示","B":"名副其实 映照","C":"当之无愧 折射","D":"理所当然 展示"},"answer":"B","explanation":"本题所给选项较为接近，需对比择优。第一空，根据“目前，我国快递业务已经达到了前所未有的新高度，业务量已突破1000亿件大关”与“快递物流是经济活力······的‘风向标’”可知，横线处应体现快递物流作为经济活力的“风向标”这个名称与实际是相符的。B项“名副其实”指名称或名声与实际相符合，符合文意，保留。A项“毋庸置疑”指无须怀疑，侧重强调确定性，D项“理所当然”指从道理上讲应该这样，侧重强调合理性，C项“当之无愧”指完全当得起，没有惭愧和不足的地方，多用于积极的语境，而“风向标”能够反映事物发展的趋势与方向，感情色彩为中性，且文段中“业务量已突破1000亿件大关”仅为客观事实的陈述，侧重于客观和名称相符合，故三项均不符合文意，均排除。\n第二空，代入验证。根据“更彰显了我国经济的繁荣活力与无限潜能”可知，快递行业的业务量能够体现出行业的蓬勃发展。B项“映照”指照射，能形象地表达出快递物流映射出行业的蓬勃跃升，当选。\n故正确答案为B。\n【文段出处】红网《快递业务突破千亿件：“小包裹”跑出“大经济”》","no":38,"missingImage":false},{"qid":"12100976","cat":"逻辑填空","stem":"在全世界地质学家和古生物学家的共同努力下，地球演化史的时间框架已经建立，国际年代地层表也就            ，并且国际地层委员会每年都会对其进行优化更新。随着国际年代地层表的            ，世界各国的地质学家可以更好地研究地球的构造与变化，为保护地球、服务人类生态文明建设做出贡献。\n依次填入画横线部分最恰当的一项是：","options":{"A":"水到渠成 精益求精","B":"呼之欲出 大功告成","C":"应运而生 日臻完善","D":"瓜熟蒂落 精雕细琢"},"answer":"C","explanation":"本题可从第二空入手。根据前文“国际地层委员会每年都会对其进行优化更新”可知，横线处所填成语应体现不断优化更新之意。C项“日臻完善”指一天天逐步达到完美的境地，符合文意，保留。A项“精益求精”比喻已经很好了，还要求更好，主语通常为人，与“国际年代地层表”搭配不当，排除。B项“大功告成”指巨大工程或重要任务宣告完成，侧重完成，与文意不符，排除。D项“精雕细琢”形容做事仔细用心，与“国际年代地层表”搭配不当，排除。\n第一空，代入验证。根据“在全世界地质学家······时间框架已经建立”可知，横线处所填成语应体现在地球演化史的时间框架建立这一背景下，国际年代地层表随之产生。C项“应运而生”指随着某种形势而产生，符合文意，当选。\n故正确答案为C。\n【文段出处】《地球的年龄怎么算？》","no":39,"missingImage":false},{"qid":"12100977","cat":"逻辑填空","stem":"金秋十月，正是新疆最美的时节。天山南北片片胡杨林叠翠流金，城市间平坦宽敞的马路            ，现代化建筑            ，一座座现代化城市吸引着来自四面八方的游客。\n依次填入画横线部分最恰当的一项是：","options":{"A":"参差交错 比比皆是","B":"整齐划一 巍然挺立","C":"纵横交错 鳞次栉比","D":"秩序井然 错落有致"},"answer":"C","explanation":"第一空，搭配“马路”，且根据文意与选项内容可知，横线处需体现城市间平坦宽敞的马路的布局。C项“纵横交错”指横的、竖的交叉在一起，能形象地体现出马路横竖交叉的布局，与实际情况相符，且符合语境，保留。A项“参差交错”指各种不同的事物错综复杂地交织在一起，用于此处表示马路规划不整齐、交叉混乱，与“平坦宽敞”的马路规划不符，排除；B项“整齐划一”指有条有理，全都一样，用于形容马路的分布情况程度过重，马路的铺设无法做到完全一致，与实际不符，排除；D项“秩序井然”形容有次序、条理分明的样子，多用于形容管理有序的场景，而非马路的分布情况，排除。\n第二空，代入验证。横线处搭配“现代化建筑”。C项“鳞次栉比”形容房屋等密集整齐地排列，符合现代化建筑排列紧密有序的特点，符合文意，当选。\n故正确答案为C。\n【文段出处】新华网《天山长城 大漠华章——新疆生产建设兵团成立70周年综述》","no":40,"missingImage":false},{"qid":"13319289","cat":"逻辑填空","stem":"中华法系形成于秦朝，至隋唐日趋成熟，宋元明清时期        形成了影响深远的成文法典，在历史发展中        而成的中华法系彰显了中华优秀传统法律文化自我发展、回应挑战的主体性与生命力，也反映了中华文明            的延续性。\n依次填入画横线部分最恰当的一项是：","options":{"A":"陆续 积淀 源远流长","B":"相继 淬炼 一脉相承","C":"渐次 聚集 薪火相传","D":"稳步 嬗变 生生不息"},"answer":"B","explanation":"第一空，根据“中华法系形成于秦朝······形成了影响深远的成文法典”“延续性”可知，横线处所填词语应体现时间的连续性。A项“陆续”表示前后相继，时断时续，B项“相继”指一个跟着一个，连续不断，C项“渐次”指逐步、渐渐，均符合文意，保留。D项“稳步”比喻有把握地按一定步骤进行，与文意不符，排除。\n第二空，根据文意可知，横线处所填词语应体现中华法系不断完善的形成过程。A项“积淀”指积累沉淀，B项“淬炼”指反复经受考验，磨炼，均符合文意，保留。C项“聚集”指集合、凑在一起，多指不同空间的事物聚合在一块儿，无法体现前文所述的不断完善的过程，与文意不符，排除。\n第三空，根据“中华法系形成于秦朝······形成了影响深远的成文法典”“中华法系彰显了中华优秀传统法律文化自我发展······的延续性”可知，横线处所填成语应体现连贯性，连续性。B项“一脉相承”指从同一个血统或派别世代承接流传下来，符合文意，当选。A项“源远流长”比喻历史悠久，根底深厚，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明日报《从优秀传统法律文化看中华文明的突出特性》","no":41,"missingImage":false},{"qid":"13319295","cat":"逻辑填空","stem":"对于人类而言，“逝去之物”总具有独特的魅力。人们难以遏制对“起源”的遐想，并做出            般的追问。考古发掘让早已湮灭的文明再见天日，通过窥探遗迹的里里外外、角角落落，用发现的物证来        历史的图景。文物既旧也新，它不仅可以证实或证伪我们关于历史的记忆和想象，更重要的是复活了被遗忘的文明的璀璨艺术，让那些            的美再次绽放。\n依次填入画横线部分最恰当的一项是：","options":{"A":"剥茧抽丝 再现 深藏不露","B":"愚公移山 组合 巧夺天工","C":"精卫填海 拼合 不为人知","D":"夸父逐日 还原 不可替代"},"answer":"D","explanation":"第一空，根据“人们难以遏制对‘起源’的遐想”以及“追问”可知，横线处应体现人们对探索、追求“起源”的坚决、执着之意。B项“愚公移山”比喻以顽强的毅力和不怕困难、人定胜天的斗争精神去征服自然、改造世界，C项“精卫填海”比喻不畏艰难，不达目的誓不罢休的坚强意志，D项“夸父逐日”比喻决心很大，均符合文意，保留。A项“剥茧抽丝”形容分析事物极为细致，而且一步一步很有层次，无法体现执着之意，与文意不符，排除。\n第二空，横线处应与“物证”及“历史的图景”搭配，且由“早已湮灭的文明再见天日”及“复活了被遗忘的文明的璀璨艺术”可知，横线处重点强调通过物证来让历史图景重现之意。D项“还原”指事物恢复原状，与“物证”“历史的图景”均搭配恰当，且符合文意，保留。B项“组合”指组织成为整体，C项“拼合”指合在一起，组合，均无法体现“重现”之意，且均与“历史的图景”搭配不当，排除。\n第三空，代入验证。横线处应与“美”搭配，且根据“‘逝去之物’总具有独特的魅力”可知，横线处应体现文物、文明之美的特殊性。D项“不可替代”指某人或某物是不能够用他人或他物来进行代替的，符合文意，且与“美”搭配恰当，当选。\n故正确答案为D。\n【文段出处】中国社会科学网《文物中的文明与艺术》","no":42,"missingImage":false},{"qid":"13319294","cat":"逻辑填空","stem":"中国探月20年，拉近了            与普通公众生活的距离。当一粒棉花种子在月球上生根发芽，当月球车玉兔微博下满是网友的祝福，当中小学教材换上了崭新的中国月面图······越来越多的人与探月工程的某项成果、某个侧面            ，一个共识在人们心中不断        ：我们离月球并不遥远！\n依次填入画横线部分最恰当的一项是：","op
