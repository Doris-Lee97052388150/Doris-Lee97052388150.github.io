有公共图书馆3309个，从业人员6.1万人。则所求平均从业人员数\u003cimg data-k=\"2c2f1ca43120\">\u003cimg data-k=\"d8022b1f4034\">&lt;20人，并未超过20人，错误；\nC项：定位统计图可得，2021-2023年末全国人均公共图书馆藏量分别为0.89册、0.96册、1.02册。根据公式：增长量=现期量-基期量，可得2022年末全国人均公共图书馆藏量的增量=0.96-0.89=0.07册，2023年末全国人均公共图书馆藏量的增量=1.02-0.96=0.06册。2022年末的增量（0.07册）&gt;2023年末的增量（0.06册），并非逐年增大，错误；\nD项：定位文字材料可得，2023年末，全国共有公共图书馆从业人员6.1万人。其中，高级职称人员0.8万人，占13.0%；中级职称人员1.9万人，占31.2%。则中、高级职称从业人员占比=13.0%+31.2%=44.2%，故初级职称从业人员占比\u003cimg data-k=\"e59a69bf269f\">，即占比不超过55.8%，正确。\n故正确答案为D。","no":133,"missingImage":false}]}],"count":20,"answerable":20,"pointsOf":16}],"total":133,"affected":[],"subtitle":"2025年 · 江苏 · 6/6 模块"},{"slug":"2025-江苏-B类","title":"2025年江苏省公务员录用考试《行测》题（B类）（网友回忆版）","year":"2025","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"13319187","cat":"毛中特","stem":"习近平新时代中国特色社会主义思想从理论和实践结合上，科学地回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党等重大时代课题，提出一系列原创性的治国理政新理念新思想新战略。关于习近平新时代中国特色社会主义思想的历史地位，下列表述正确的是：\n①继承和发展马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观，是马克思主义在当代中国发展最新理论成果，开辟了马克思主义中国化时代化的新境界\n②把马克思主义基本原理同中国具体实际相结合，同中华优秀传统文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华文化和中国精神的时代精华\n③确立了社会主义市场经济体制的改革目标和基本构架，确立了社会主义初级阶段的基本经济制度和分配制度，开创了全面深化改革新局面，推进党的建设新的伟大工程\n④是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家发展事业的根本遵循","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n①正确，党的十九大报告指出，习近平新时代中国特色社会主义思想，是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展，是马克思主义中国化最新成果，是党和人民实践经验和集体智慧的结晶，是中国特色社会主义理论体系的重要组成部分，是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南，必须长期坚持并不断发展。党的二十大报告提出的“六个必须坚持”，即必须坚持人民至上、坚持自信自立、坚持守正创新、坚持问题导向、坚持系统观念、坚持胸怀天下，集中体现了习近平新时代中国特色社会主义思想的世界观和方法论，是马克思主义世界观方法论中国化时代化的最新成果。\n②正确，习近平新时代中国特色社会主义思想既坚持了马克思主义的根本立场和基本原理，又从中华优秀传统文化中汲取了丰富营养，实现了马克思主义与中华优秀传统文化的有机融合，推动了中华文化的创造性转化和创新性发展。所以，它把马克思主义基本原理同中国具体实际相结合，同中华优秀传统文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华文化和中国精神的时代精华。\n③错误，“确立了社会主义市场经济体制的改革目标和基本构架，确立了社会主义初级阶段的基本经济制度和分配制度”等主要是邓小平理论、三个代表重要思想、科学发展观的重要成果，并不是习近平新时代中国特色社会主义思想的特定贡献。习近平新时代中国特色社会主义思想主要是推进全面深化改革向广度和深度进军，而不是确立社会主义市场经济体制等的最初阶段的内容。\n④正确，习近平新时代中国特色社会主义思想为实现中华民族伟大复兴的中国梦提供了科学理论指引和行动纲领，从思想上、理论上、战略上、行动上为党和国家事业发展指明了方向，对于团结带领全国各族人民全面建成社会主义现代化强国、全面推进中华民族伟大复兴具有重大而深远的意义。因此，可以说它是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家发展事业的根本遵循。\n故①②④说法正确。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"13319179","cat":"毛中特","stem":"党的十八大以来以习近平同志为核心的党中央把全面从严治党纳入“四个全面”战略布局，深入推进新时代党的建设新的伟大工程，提出一系列新理念新思想新战略，形成习近平总书记关于党的建设的重要思想。党在革命性锻造中更加坚强有力、更加充满活力。全面从严治党开辟了百年大党自我革命的新境界。关于新时代全面从严治党取得的历史性开创性成就，下列表述正确的是：\n①牢牢抓住“关键少数”，坚持从领导干部抓起，以上率下\n②提出让人民监督政府是跳出历史周期率第一个答案\n③开展了史无前例的反腐败斗争，取得压倒性胜利并全面巩固\n④把制度建设贯穿党的政治各方面，形成比较完善的党内法规体系\n⑤以党的政治建设统领党的建设的各项工作，不断增强党组织政治功能","options":{"A":"①②③⑤","B":"①②④⑤","C":"①③④⑤","D":"②③④⑤"},"answer":"C","explanation":"本题考查理论与政策。\n①正确，党的十八大以来，全面从严治党过程中，始终强调抓住领导干部这个 “关键少数”，以上率下，要求领导干部以身作则、率先垂范，带头遵守党纪国法，执行党的各项规定，以实际行动引领广大党员干部廉洁从政、担当作为。\n②错误，毛泽东同志在延安的窑洞里给出了跳出历史周期率的第一个答案，即让人民监督政府。而在新时代，习近平总书记给出了第二个答案，这就是自我革命。\n③正确，2023年1月9日，中共中央总书记、国家主席、中央军委主席习近平在中国共产党第二十届中央纪律检查委员会第二次全体会议上发表重要讲话。讲话指出：“新时代10年，我们党不断深化对自我革命规律的认识，不断推进党的建设理论创新、实践创新、制度创新，在构建全面从严治党体系上积累了丰富成果······我们开展史无前例的反腐败斗争，坚持无禁区、全覆盖、零容忍，不敢腐、不能腐、不想腐一体推进，‘打虎’、‘拍蝇’、‘猎狐’多管齐下，查处一大批腐败分子，消除党内严重政治隐患，反腐败斗争取得压倒性胜利并全面巩固，成功走出一条中国特色反腐败之路······”\n④正确，2023年1月9日，中共中央总书记、国家主席、中央军委主席习近平在中国共产党第二十届中央纪律检查委员会第二次全体会议上发表重要讲话。讲话指出：“新时代10年，我们党不断深化对自我革命规律的认识，不断推进党的建设理论创新、实践创新、制度创新，在构建全面从严治党体系上积累了丰富成果······我们把制度建设贯穿党的各项建设，与时俱进完善党章，聚焦加强党的领导和党的建设推进制度创新，形成比较完善的党内法规体系，搭建起党和国家监督体系‘四梁八柱’，把权力关进制度的笼子，为新时代党的建设提供了根本性、全局性、稳定性、长期性保障······”\n⑤正确，党的十八大以来，全面从严治党强调以党的政治建设为统领，把政治标准和政治要求贯穿党的思想建设、组织建设、作风建设、纪律建设以及制度建设、反腐败斗争始终，不断增强党组织政治功能和组织功能，确保党的团结统一和行动一致。\n故①③④⑤表述正确。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"13319185","cat":"新思想","stem":"2023年7月，习近平总书记在江苏考察时强调，江苏有能力也有责任在推进中国式现代化进程中走在前、做示范，希望江苏在科技创新上取得新突破，在强链补链延链上展现新作为，在建设中华民族现代文明上探索新经验，在推进社会治理现代化上实现新提升。为贯彻落实总书记赋予江苏“四个新”的重大任务，下列做法正确的有：\n①打造全国重要的产业科技创新高地，使高质量发展更多依靠创新驱动的内涵型增长，强化企业科技创新主体地位，深化科技体制改革和人才发展体制机制改革\n②巩固传统产业领先地位，加快打造具有国际竞争力的战略性新兴产业集群，全面提升产业基础高级化和产业链现代化水平，加快构建以先进制造业为骨干的现代化产业体系\n③加强优秀传统文化的保护传承和创新发展，大力发展现代科技、教育事业，全面提升人民群众的科学文化素质，繁荣发展文化事业和文化产业，持续推进城乡公共文化服务标准化、均等化\n④加快健全社会保障体系，健全就业促进机制和就业公共服务体系，完善社会治理体系，推进社会治理数字化，推进应急管理体系和能力现代化","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查理论与政策。\n①正确，习近平总书记指出，中国式现代化关键在科技现代化。江苏要在科技创新上率先取得新突破，打造全国重要的产业科技创新高地，使高质量发展更多依靠创新驱动的内涵型增长。要强化企业科技创新主体地位，促进创新要素向企业集聚，不断提高科技成果转化和产业化水平。要深化科技体制改革和人才发展体制机制改革······\n②正确，习近平总书记强调，要把坚守实体经济、构建现代化产业体系作为强省之要，巩固传统产业领先地位，加快打造具有国际竞争力的战略性新兴产业集群，推动数字经济与先进制造业、现代服务业深度融合，全面提升产业基础高级化和产业链现代化水平，加快构建以先进制造业为骨干的现代化产业体系。\n③正确，习近平总书记指出，建设中华民族现代文明，是推进中国式现代化的必然要求，是社会主义精神文明建设的重要内容。江苏要加强优秀传统文化的保护传承和创新发展，积极参与建设长江和大运河两大国家文化公园。要大力发展现代科技、教育事业，全面提升人民群众的科学文化素质。要繁荣发展文化事业和文化产业，持续推进城乡公共文化服务标准化、均等化······\n④正确，习近平总书记强调，江苏必须在保障和改善民生、推进社会治理现代化上走在前列。要加快健全社会保障体系，健全就业促进机制和就业公共服务体系，做好重点群体就业工作。要坚持和发展新时代“枫桥经验”、“浦江经验”，完善社会治理体系，健全城乡基层治理体系和乡村治理协同推进机制，推进社会治理数字化。要推进应急管理体系和能力现代化······\n故做法正确的有①②③④，共4项。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"13319189","cat":"新思想","stem":"习近平总书记指出，中华民族有着五千多年的悠久历史和灿烂文化，而且中华文化从远古一直延续发展到今天，是世界上唯一绵延不断，且以国家形态发展至今的伟大文明，具有突出的连续性。关于中华文化为何具有突出的连续性，下列说法正确的是：\n①强大的文化主体性，夯实了中华文明连续性的内在支撑\n②浩如烟海的文化典籍成为中华文明连续性的天然载体\n③独特又稳定的地理环境，筑牢了中华文明连续性的自然基础\n④中华文化“中和”的文化价值诉求奠定了中华文明连续性的价值底蕴","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n①错误，《中华文明源远流长的连续性》中指出：“厚重的文化积累是中华文明突出连续性的内在支撑。一个文明能够从不断裂、历久弥新，其中决定连续性的深层次原因必与既有的文化密切相关。换言之，同一个国家‘不断裂’状态的维持，一是其国民的人类遗传基因延续不辍，二是其国家文化基因世代传承。”\n②正确，《习近平总书记这样谈中华文明的连续性》中指出：“中华民族创造了浩如烟海的文化典籍，中华文明在这些代代相传的典籍中得以记载和传承，如四书五经等儒家典籍向来是历代儒家学子首要研学之书，从未中断。······在我国出土的大量考古成果充分展示着中华文明起源和发展的历史脉络，从中可见中华文明传承悠久且从未中断。”由此可见，浩如烟海的文化典籍成为中华文明连续性的天然载体。\n③正确，《中华文明源远流长的连续性》中指出：“独特的地理气候是中华文明突出连续性的自然基础。”《连续性：中华文明的首要特性》中指出：“中华文明成为人类历史上唯一一个绵延5000多年至今未曾中断的灿烂文明。而这主要得益于以下三个因素：第一，独特稳定的地理环境。”\n④正确，《连续性：中华文明的首要特性》中指出：“第二，‘中和’的文化价值诉求。中华文明源远流长、博大精深，其中儒家、道家成为中华文明的主流思想······‘中’就是要把握适当的限度，使自己的言行合乎标准。‘中和’所代表的中性智慧强调的是事物双方的相辅相成、共生共存，从而做到不偏不倚、执两用中······总而言之，‘中和’的文化价值诉求成就了‘贵和持中、自强不息’的中华文明，奠定了中华文明源远流长的价值底蕴。”\n故②③④表述正确。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"13319196","cat":"新思想","stem":"习近平总书记指出，全面依法治国是国家治理的一场深刻革命。我们要坚持走中国特色社会主义法治道路、建设中国特色社会主义法治体系、建设社会主义法治国家。关于中国特色社会主义法治道路的核心要义，下列理解正确的是：\n①中国特色社会主义制度是中国特色社会主义法治体系的根本制度基础\n②党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证\n③中国特色社会主义法治理论是法治体系的理论指导，是全面推进依法治国的行动指南\n④弘扬社会主义法治精神、传承中华优秀传统法律文化是社会主义法治建设的首要任务","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"A","explanation":"本题考查理论与政策。\n①②③正确，《习近平新时代中国特色社会主义思想学习纲要》中“八、全面推进依法治国”部分指出：“中国特色社会主义法治道路的核心要义，就是要坚持党的领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论。党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。坚持中国特色社会主义法治道路，最根本的是坚持党的领导。中国特色社会主义制度是中国特色社会主义法治体系的根本制度基础，是全面推进依法治国的根本制度保障。中国特色社会主义法治理论是中国特色社会主义法治体系的理论指导和学理支撑，是全面推进依法治国的行动指南。”\n④错误，《法治中国建设规划（2020－2025年）》中“二、全面贯彻实施宪法，坚定维护宪法尊严和权威”部分指出：“建设法治中国，必须高度重视宪法在治国理政中的重要地位和作用，坚持依宪治国、依宪执政，把全面贯彻实施宪法作为首要任务，健全保证宪法全面实施的体制机制，将宪法实施和监督提高到新水平。”\n故①②③表述正确。\n故正确答案为A。","no":5,"missingImage":false},{"type":"question","qid":"13319195","cat":"时事政治","stem":"习近平总书记在党的二十届三中全会上提出，到2035年，全面建成高水平社会主义市场经济体制，为中国式现代化提供重要保障。下列做法属于构建高水平社会主义市场经济体制举措的是：\n①培育壮大先进制造业集群，推进制造业高端化、智能化、绿色化发展\n②推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通\n③坚持和落实“两个毫不动摇”，促进各种所有制经济优势互补、共同发展\n④依法平等长久保护各种所有制经济产权，建立高效的知识产权综合管理体制","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议审议通过了《中共中央关于进一步全面深化改革、推进中国式现代化的决定》（以下简称《决定》）。\n①错误，《决定》在“三、健全推动经济高质量发展体制机制”部分指出“（9）健全促进实体经济和数字经济深度融合制度。加快推进新型工业化，培育壮大先进制造业集群，推动制造业高端化、智能化、绿色化发展······”故此举措说法无误，但不属于构建高水平社会主义市场经济体制。\n②正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（6）构建全国统一大市场。推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。加强公平竞争审查刚性约束，强化反垄断和反不正当竞争，清理和废除妨碍全国统一市场和公平竞争的各种规定和做法······”\n③正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（5）坚持和落实‘两个毫不动摇’。毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展，保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护，促进各种所有制经济优势互补、共同发展。”\n④正确，《决定》在“二、构建高水平社会主义市场经济体制”部分指出“（7）完善市场经济基础制度。完善产权制度，依法平等长久保护各种所有制经济产权，建立高效的知识产权综合管理体制······”\n综上，②③④正确。\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"13319193","cat":"时事政治","stem":"习近平总书记多次深刻阐释“以人民为中心”的执政理念。党的二十届三中全会将这一执政理念确定为进一步全面深化改革必须遵循的原则，强调坚持以人民为中心，尊重人民主体地位和首创精神，人民有所呼、改革有所应，做到改革为了人民、改革依靠人民、改革成果由人民共享。某市的下列举措符合“以人民为中心”的原则的是：\n①创办共富市集，减免低收入群众和灵活就业收入人员摊位费\n②建立“百姓会客厅”机制，密切联系群众，问计于民、问需于民\n③全国推进公用事业市场化改革提升，提升资源配置效率，减轻财政负担\n④持续完善积分落户制，促进有稳定就业的外来人口有序实现市民化","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n“以人民为中心的发展思想”是习近平总书记于2015年10月26日至29日，党的十八届五中全会提出的治国方针理论。所谓以人民为中心，就是要抓住人民最关心最直接最现实的利益问题，不断保障和改善民生，促进社会公平正义，在更高水平上实现幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶，让发展成果更多更公平惠及全体人民，不断促进人的全面发展，朝着实现全体人民共同富裕不断迈进。\n①正确，“创办共富市集，减免低收入群众和灵活就业收入人员摊位费”能够增加这部分人的收入，有利于共同富裕的实现，是符合“以人民为中心”原则的举措。\n②正确，“建立‘百姓会客厅’机制，密切联系群众，问计于民、问需于民”可以更好地抓住人民最关心最直接最现实的利益问题，以便解决这些问题，是符合“以人民为中心”原则的举措。\n③错误，“全国推进公用事业市场化改革提升，提升资源配置效率，减轻财政负担”更多强调为财政减负，和人民并无直接联系。\n④正确，“持续完善积分落户制，促进有稳定就业的外来人口有序实现市民化”能够更好解决外来人口养老育幼、买房医疗等问题，提高这一群体的幸福感，是符合“以人民为中心”原则的举措。\n综上，①②④正确。\n故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"13319194","cat":"新思想","stem":"习近平总书记强调，就业是最基本的民生，事关人民群众切身利益，事关经济社会健康发展，事关国家长治久安。要实施就业优先战略，促进高质量充分就业。关于促进高质量充分就业，下列表述正确的是：\n①在宏观层面，高质量充分就业主要包括就业机会充分、就业环境公平、就业结构优化、人岗匹配高效、劳动关系和谐等\n②在微观层面，高质量充分就业主要表现为每个公民不仅有活干，而且工作稳定、收入合理、保障可靠、职业安全等\n③高质量充分就业是一个很高的要求，也是一个循序渐进的过程，必须尽力而为、量力而行；必须充分调动人民群众的积极性主动性创造性，引导大家依靠努力奋斗创造幸福生活\n④促进高质量充分就业。要始终坚持就业优先，着力解决结构性就业矛盾，完善重点群体就业支持政策，深化就业体制机制改革，加强劳动者权益保障","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"C","explanation":"本题考查理论与政策。\n2024年11月1日出版的第21期《求是》杂志发表了中共中央总书记、国家主席、中央军委主席习近平的重要文章《促进高质量充分就业》。\n①③正确，②错误，文章指出，党的二十大科学把握就业形势新变化，顺应人民群众新期待，着眼扎实推进高质量发展和全体人民共同富裕，作出了促进高质量充分就业的重大部署。在宏观层面，高质量充分就业主要包括就业机会充分、就业环境公平、就业结构优化、人岗匹配高效、劳动关系和谐等；在微观层面，高质量充分就业主要表现为劳动者不仅有活干，而且工作稳定、收入合理、保障可靠、职业安全等。当然，这是一个很高的要求，也是一个循序渐进的过程，必须尽力而为、量力而行；必须充分调动人民群众的积极性主动性创造性，引导大家依靠努力奋斗创造幸福生活，不能不劳而获、坐享其成。\n④正确，文章指出，促进高质量充分就业，是新时代新征程就业工作的新定位、新使命·····这里，我着重强调5点。第一，始终坚持就业优先······第二，着力解决结构性就业矛盾······第三，完善重点群体就业支持政策······第四，深化就业体制机制改革······第五，加强劳动者权益保障······\n综上，①③④表述正确。\n故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"13319197","cat":"新思想","stem":"习近平总书记对江苏生态文明建设念兹在兹，反复叮嘱江苏要“把保护生态环境摆在更加突出的位置”“走出一条生态优先、绿色发展的新路子”。为贯彻落实总书记的重要指示精神，江苏全面加快推进美丽江苏建设，推动实现人与自然和谐共生的现代化。关于全面推进美丽江苏建设的举措，下列说法正确的是：\n①加强苏北海岸带的国土空间管控，一律不得新增围海和填海\n②建设黄河故道千里生态富民廊道，构建江淮生态经济区湖群绿心\n③推动江河湖海各展所长，统筹推进长江和大运河国家文化公园建设\n④增强省域森林、湿地、土壤、海洋等生态系统固碳作用，支持里下河地区提升生态系统碳汇能力","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n①错误，《国务院关于&lt;江苏省国土空间规划（2021—2035年）&gt;的批复》在“二、筑牢安全发展的空间基础”部分指出：“······除国家重大项目外，全面禁止围填海；严格无居民海岛管理。”\n②③正确，《中共江苏省委江苏省人民政府关于全面推进美丽江苏建设的实施意见》在“四、打造美丽江苏建设示范样板”部分“（十二）塑造‘水韵江苏’品牌”中指出：“以水为脉，推动江河湖海各展所长，统筹推进长江和大运河国家文化公园建设，着力打造太湖全国湖泊治理标杆，构筑蓝湾百里生态百里缤纷百里沿海岸线，建设黄河故道千里生态富民廊道，构建江淮生态经济区湖群绿心，彰显各具特色、各现其美的‘水韵江苏’风采。”\n④正确，《中共江苏省委江苏省人民政府关于全面推进美丽江苏建设的实施意见》在“二、加快发展方式绿色低碳转型”部分“（二）积极稳妥推进碳达峰碳中和”中指出：“落实碳达峰碳中和‘1+N’政策体系，推动能耗双控逐步转向碳排放双控······增强省域森林、湿地、土壤、海洋等生态系统固碳作用，支持里下河地区提升生态系统碳汇能力。深入推进减污降碳协同创新。”\n故②③④说法正确。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"11226407","cat":"新思想","stem":"习近平总书记指出，法治政府建设是全面依法治国的重点任务和主体工程，要扎实推进依法行政，深化行政执法体制改革，全面推进严格规范公正文明执法。下列做法属于深化行政执法体制改革举措的是：","options":{"A":"完善重大行政决策审查机制，未经合法性审查或经审查不合法的，不得提交讨论","B":"完善行政组织法，依法依规设立机构、配置职能、明确权限和责任、规范运行程序","C":"完善垂直管理体制和地方分级管理体制，确保党中央集中统一领导和国家制度统一、政令统一，理顺中央和地方职责关系，更好发挥两个积极性","D":"完善行政处罚等领域行政裁量权基准制度，裁量权基准的设定要符合法律、法规、规章有关行政执法事项、条件、程序、种类、幅度的规定"},"answer":"D","explanation":"本题考查理论与政策。\nA项错误，坚持科学决策、民主决策、依法决策，对于加快建设法治政府、深入推进依法行政至关重要。要完善重大决策合法性审查机制，未经合法性审查或经审查不合法的，不得提交讨论。该项属于健全政府机构职能体系，提升依法决策和政务服务水平的举措。\nB项错误，机构职能法定化是加快建设法治政府、深入推进依法行政的重要内容。要进一步完善相关党内法规和国家法律法规，依法依规设立机构、配置职能、明确权限和责任、规范运行程序，推动改革成果制度化法定化。该项属于健全政府机构职能体系，提升依法决策和政务服务水平的举措。\nC项错误，我国作为单一制国家，实行垂直管理和地方分级管理相结合的体制由来已久。完善垂直管理体制和地方分级管理体制，要确保党中央集中统一领导和国家制度统一、政令统一，理顺中央和地方职责关系，更好发挥两个积极性。该项属于完善政府管理体制机制，提高政府治理效能的举措。\nD项正确，完善行政处罚等领域行政裁量权基准制度。规范行政裁量权基准制定和管理，对保障法律、法规、规章有效实施，规范行政执法行为，维护社会公平正义具有重要意义。要坚持法制统一，裁量权基准的设定要符合法律、法规、规章有关行政执法事项、条件、程序、种类、幅度的规定。该项属于深化行政执法体制改革，促进严格规范公正文明执法的举措。\n故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"11226401","cat":"新思想","stem":"2024年是中国人民政治协商会议成立75周年。实践充分证明，人民政协是中国共产党把马克思列宁主义基本原理同中华优秀传统文化相结合的伟大成果。人民政协体现的中华优秀传统文化精神是：\n①“大道之行、天下为公”的大同理想\n②“明于庶物、察于人伦”的精神追求\n③“兼容并包、求同存异”的政治智慧\n④“民惟邦本、本固邦宁”的民本思想","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"C","explanation":"本题考查理论与政策。\n①③④正确，②错误，《论我国政治协商制度的中华优秀传统文化根脉》指出，协商民主为什么产生于中国、中国为什么能够独创政治协商制度、为什么会有人民政协这一具有鲜明中国特色的组织形式，习近平总书记作出了科学回答：“社会主义协商民主在我国有根、有源、有生命力”，“它源自中华民族长期形成的天下为公、兼容并蓄、求同存异等优秀政治文化”。“人民政协植根于中国历史文化”。具体来说，主要是以下三个核心理念。（一）“大道之行、天下为公”的大同理想；（二）“民惟邦本、本固邦宁”的民本思想；（三）“兼容并包、求同存异”的政治智慧。\n故正确答案为C。","no":11,"missingImage":false}],"count":11,"answerable":11,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"11226402","cat":"人文常识","stem":"我国要推进国有经济布局优化和结构调整，推动国有资本和国有企业做强做优做大，增强核心功能，提升核心竞争力。国有企业的核心功能不包括：","options":{"A":"维护国家安全","B":"引领科技创新","C":"服务国计民生","D":"促进城乡融合"},"answer":"D","explanation":"本题考查理论与政策。\n2023年12月25日至26日，国务院国资委召开中央企业负责人会议，全面贯彻落实党的二十大精神和中央经济工作会议精神，总结2023年国资央企工作，研究部署2024年重点任务。会议强调，要深化落实习近平总书记关于国有企业改革发展和党的建设的重要论述，落实党中央、国务院领导同志部署要求，坚持和加强党对国资央企的全面领导，围绕增强核心功能、提高核心竞争力，深入实施国有企业改革深化提升行动，着力提高中央企业创新能力和价值创造能力，推动国有资本“三个集中”，加快建设现代化产业体系、实现高质量发展，更好发挥科技创新、产业控制、安全支撑作用，为持续推动经济实现质的有效提升和量的合理增长，以中国式现代化全面推进强国建设、民族复兴伟业作出新贡献。国务院国资委党委成员出席会议。\nA项正确，国有企业是保障国家经济安全和国防安全的重要力量。它们在关键领域和行业保持一定的控制力，以确保国家的经济安全和稳定。\nB项正确，国有企业在很多重大科技创新领域发挥着引领作用。例如在航空航天、高铁、5G通信等领域，并突破了一系列关键核心技术，推动了我国科技水平的提升。\nC项正确，国有企业广泛分布在能源、交通、金融、公用事业等关系国计民生的重要行业和关键领域，为国民经济的平稳运行和人民生活的正常进行提供了有力支撑。\nD项错误，促进城乡融合主要是通过一系列政策举措及多方面力量协同作用，推动城乡之间在经济、社会、文化等各个方面的融合发展，并不是国有企业的核心功能。\n本题为选非题，故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"13319212","cat":"人文常识","stem":"2024年2月，经推荐遴选，中央组织部、中央宣传部确定20名“最美公务员”，他们从乡村振兴一线到驻外前线，从乡镇街道到产业园区，在强国建设、民族复兴新征程上作表率，他们坚定拥护“两个确立”，坚持做到“两个维护”，在重大任务、重大斗争中担苦担难担重担险，在日常工作中恪尽职守，善作善成，以实际行动彰显出新时代人民公仆本色。这一新时代人民公仆本色所体现的公务员职业道德是：","options":{"A":"信仰坚定，担当作为，竭诚为民，无私奉献","B":"爱国敬业，遵纪守法，创业创新，服务社会","C":"胸怀祖国，追求真理，淡泊名利，勇攀高峰","D":"执着专注，精益求精，一丝不苟，追求卓越"},"answer":"A","explanation":"本题考查毛中特。\nA项正确，信仰坚定要求公务员坚定对马克思主义的信仰，坚定对社会主义和共产主义的信念，坚持中国共产党的领导，最美公务员“坚定拥护‘两个确立’，坚持做到‘两个维护’”即体现了这一点；担当作为要求公务员兢兢业业做好本职工作，同时坚持原则、敢于担当、认真负责，面对矛盾敢于迎难而上，面对危机敢于挺身而出，最美公务员“在重大任务、重大斗争中担苦担难担重担险，在日常工作中恪尽职守，善作善成”即体现了这一点；竭诚为民，无私奉献要求公务员坚持以人为本、执政为民，全心全意为人民服务，永做人民公仆，最美公务员们大多来自基层“从乡村振兴一线到驻外前线，从乡镇街道到产业园区”，身处与民生联系最紧密、对民情民意最了解的基层一线，他们自觉将为人民服务的理念融入到工作实践中，“以实际行动彰显出新时代人民公仆本色”即体现了这一点。\nB项错误，“爱国敬业，遵纪守法，创业创新，服务社会”属于企业家精神的内容。\nC项错误，“胸怀祖国，追求真理，淡泊名利，勇攀高峰”属于科学家精神的内容。\nD项错误，“执着专注，精益求精，一丝不苟，追求卓越”属于工匠精神的内容。\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"11226411","cat":"人文常识","stem":"下图为敦煌地区出土的汉代竹简残片，下列对其记载内容判断正确的是：\n\u003cimg data-k=\"3a2d166ae9e0\" style=\"max-width:250px\">\n①竹简上记载的内容到现在仍在广泛使用\n②竹简记载了当时河流水位的季节变化情况\n③竹简上的内容表明我国很早开始使用十进制计数法\n④竹简上的内容可能在汉代通过“丝绸之路”传播到西方","options":{"A":"①③","B":"①④","C":"②③","D":"②④"},"answer":"A","explanation":"本题考查人文常识。\n①正确，从图片中可以看出，竹简上记载的是九九乘法口诀。九九乘法表是数学中的乘法口诀，别名有九九歌，产生年代是春秋战国，出自《算法大成》，到现在仍在广泛使用。\n②错误，图片中竹简上明确记载的是九九乘法口诀，并没有任何关于当时河流水位季节变化情况的相关信息，所以不能得出竹简记载了当时河流水位的季节变化情况这一结论。\n③正确，竹简上的九九乘法口诀使用了从一到九的数字，这表明我国已经熟练地使用十进制计数法。十进制计数法是一种以10为基数的计数方法，至迟在商代时，中国已采用了十进位值制。\n④错误，虽然“丝绸之路”在汉代已经开通，促进了东西方的文化交流，但目前并没有确凿的证据表明九九乘法口诀在汉代通过“丝绸之路”传播到了西方。据记载，九九乘法口诀13世纪才传入西方。\n故①③判断正确。\n故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"11226404","cat":"科技常识","stem":"我国科学家攻克石墨高温纯化关键技术，成功开发出超高纯石墨产品，标志着我国超高纯石墨产品达到国际领先水平。下列关于石墨的说法正确的是：","options":{"A":"是由碳元素组成的有色金属矿物","B":"在自然界分布广泛，不存在人造石墨","C":"属于战略性物资，我国禁止出口石墨产品","D":"在工业生产中应用广泛，被誉为“工业黑金”"},"answer":"D","explanation":"本题考查科技常识。\nA项错误，石墨又名黑铅，是碳的一种同素异形体，不透明且触感油腻，颜色由铁黑到钢铁灰不等，形状可呈晶体状、薄片状、鳞状、条纹状、层状体。石墨是一种非金属矿物，并不是有色金属矿物。\nB项错误，石墨是一种天然形成的矿物，它常见于火成岩、变质岩中的矿床或伴生矿物中，也可以在沉积岩中发现。石墨既存在于自然界中，也可以通过人工制备得到。天然石墨的生产成本相对较高，而人工合成的石墨可以达到更高的质量和纯度要求。\nC项错误，石墨是多个国家的战略性矿产资源，其在新能源、航天航空、核能、军工等战略性新兴产业中具有重要应用。中国作为全球最大的石墨生产国和出口国，长期以来，坚定履行防扩散等国际义务，根据维护国家安全和利益需要，依法对特定石墨物项实施出口管制，对部分石墨物项实施临时管制。故“禁止出口石墨产品”说法错误。\nD项正确，石墨由于其特殊的结构，具有耐高温性、抗热震性、导电性、润滑性、化学稳定性以及可塑性等众多特性，广泛应用于冶金、机械、电子、军工、国防、航天航空等领域，被称为“工业黑金”。\n故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"11226403","cat":"人文常识","stem":"公正司法是维护社会公平正义的最后一道防线，规范司法权力的运行，建设公正高效权威的社会主义司法制度，才能让人民群众在每一个案件中感受公平正义。下列说法与公正司法精神相契合的是：","options":{"A":"人民法院独立行使审判权，不受任何机关或组织的制约","B":"在案件事实无法查清的情况下，人民法院不应作出终局裁判","C":"在司法活动中，应重视发挥司法政策的导向作用和解释功能","D":"审判过程一律公开，人民法院应以人民看得见的方式裁判案件"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国宪法》第一百三十一条和《中华人民共和国人民法院组织法》第四条规定：“人民法院依照法律规定独立行使审判权，不受行政机关、社会团体和个人的干涉。”因此，人民法院独立行使审判权，并不是不受任何机关或组织的制约，表述过于绝对，与公正司法精神不相契合。\nB项错误，根据《中华人民共和国民事诉讼法》第六十七条规定：“当事人对自己提出的主张，有责任提供证据。当事人及其诉讼代理人因客观原因不能自行收集的证据，或者人民法院认为审理案件需要的证据，人民法院应当调查收集。人民法院应当按照法定程序，全面地、客观地审查核实证据。”《最高人民法院关于民事诉讼证据的若干规定》第八十五条第一款规定：“人民法院应当以证据能够证明的案件事实为根据依法作出裁判。”《中华人民共和国刑事诉讼法》第二百条第三项规定：“（三）证据不足，不能认定被告人有罪的，应当作出证据不足、指控的犯罪不能成立的无罪判决。”《中华人民共和国行政诉讼法》第三十四条第一款规定：“被告对作出的行政行为负有举证责任，应当提供作出该行政行为的证据和所依据的规范性文件。”由此说明，在案件事实无法查清的情况下，人民法院审理民事案件时应依据证据能够证明的案件事实作出裁判，审理刑事案件时应依法作出无罪判决。因此，审理行政案件时应依据证据能够证明的案件事实作出终局裁判，而不是不应作出终局裁判，表述不符合法律规定，与公正司法精神不相契合。\nC项正确，根据《关于统一法律适用加强类案检索的指导意见》要求：“检索到的类案为指导性案例的，人民法院应当参照作出裁判；检索到其他类案的，人民法院可以作为作出裁判的参考。”由此说明，司法政策通过明确裁判标准，解决了法律适用中的模糊性问题，体现了司法政策的导向作用。此外，司法政策还可以通过解释法律条文，弥补法律规定的不足，例如《关于适用〈关于民事诉讼证据的若干规定〉中有关举证时限规定的通知》，对举证时限作了释明与补充，体现了司法政策的解释功能。因此，在司法活动中，应重视发挥司法政策的导向作用和解释功能，有助于实现司法公正和统一，与公正司法精神相契合。\nD项错误，根据《中华人民共和国民事诉讼法》第一百三十七条规定：“人民法院审理民事案件，除涉及国家秘密、个人隐私或者法律另有规定的以外，应当公开进行。离婚案件，涉及商业秘密的案件，当事人申请不公开审理的，可以不公开审理。”《中华人民共和国刑事诉讼法》第十一条规定：“人民法院审判案件，除本法另有规定的以外，一律公开进行。被告人有权获得辩护，人民法院有义务保证被告人获得辩护。”《中华人民共和国行政诉讼法》第五十四条规定：“人民法院公开审理行政案件，但涉及国家秘密、个人隐私和法律另有规定的除外。涉及商业秘密的案件，当事人申请不公开审理的，可以不公开审理。”因此，人民法院审判过程不是一律公开，表述过于绝对，与公正司法精神不相契合。\n故正确答案为C。","no":16,"missingImage":false},{"type":"question","qid":"13319223","cat":"法律常识","stem":"M公司在网络购物平台销售一款智能门锁，宣称该门锁具有“生成临时密码”功能，韩某购买安装该款门锁后，发现并不具备所宣称的功能，该公司回复说需要额外付费升级系统后才能安装该功能。对此，下列说法不正确的是：","options":{"A":"M公司对产品的不实宣传构成欺诈","B":"M公司与韩某之间的买卖合同无效","C":"韩某有权向M公司主张惩罚性赔偿","D":"韩某有权请求M公司承担违约责任"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，一方当事人故意告知对方虚假情况，或者故意隐瞒真实情况，诱使对方当事人作出错误意思表示的，可以认定为欺诈行为。题中，M公司宣称其销售的门锁具有“生成临时密码”功能，但韩某购买安装后发现并不具备所宣称的功能，因此，M公司对产品的不实宣传构成欺诈。\nB项错误，根据《中华人民共和国民法典》第一百四十八条规定：“一方以欺诈手段，使对方在违背真实意思的情况下实施的民事法律行为，受欺诈方有权请求人民法院或者仲裁机构予以撤销。”因此，M公司与韩某之间的买卖合同并不是无效的，而是可撤销的。\nC项正确，根据《中华人民共和国消费者权益保护法》第五十五条第一款规定：“经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金额不足五百元的，为五百元。法律另有规定的，依照其规定。”因此，韩某有权向M公司主张惩罚性赔偿。\nD项正确，根据《中华人民共和国民法典》第一百八十六条规定：“因当事人一方的违约行为，损害对方人身权益、财产权益的，受损害方有权选择请求其承担违约责任或者侵权责任。”违约行为，是指当事人一方不履行合同义务或履行合同义务不符合约定条件的行为。题中，韩某购买安装的M公司销售的智能门锁，并不具备约定的“生成临时密码”功能，M公司的行为构成违约，因此，韩某有权请求M公司承担违约责任。\n本题为选非题，故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"11226409","cat":"法律常识","stem":"秦某驾车在F市某丁字路口右转行驶30米后，道路左侧和地上出现“禁止驶入”的交通标志和标线。秦某进退两难，遂驶入了禁行路段。F市交巡警支队作出处罚决定，认定秦某驾车在该路段逆向行驶违法，予以200元罚款、记3分的处理。秦某不服，向F市公安局提起行政复议。下列关于本案的说法正确的是：","options":{"A":"该交通标志标线设置符合比例原则中的适当性要求","B":"秦某不可以将该路段其他车辆的违章信息申请公开","C":"F市交巡警支队实施行政处罚遵循的是无过错原则","D":"秦某可举证证明自己机动车逆向行驶没有主观过错"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，根据《城市道路交通标志和标线设置规范》4.3.1规定：“交通标志应设置在车辆行进方向上易于看到的地方，并宜设置在车辆前进方向的右侧或车行道上方。当路段单向车道数大于4条、道路交通量大、大车比例高时，宜分别在车辆前进方向左、右两侧设置相同的交通标志。”因此，F市交巡警支队将案涉禁行标志设置在道路的左侧，符合规范，但交通标志标线设置除了应当符合相关规范外，还应当考虑相关通行设计的合理性等因素。秦某驾车行至该丁字路口时，路口前方或其他相应位置并未设置“禁止右转”等相关提示标志。此种情况下，一般人的反应是此处可以右转，既然可以右转，右转后的道路一般情况下均可以通行。本案F市交巡警支队虽然将禁行标志设置在禁行道路的起点，但没有在起点位置之前的适当位置设置相应的提示标志，致使机动车驾驶人驶入顺行路段后，容易越过禁行道路，造成违章。因此，该处的交通标志标线设置存在不合理之处，不符合比例原则中的适当性要求。\nB项错误，根据《中华人民共和国政府信息公开条例》第十三条规定：“除本条例规定的行政机关主动公开的政府信息外，公民、法人或者其他组织还可以根据自身生产、生活、科研等特殊需要，向国务院部门、地方各级人民政府及县级以上地方人民政府部门申请获取相关政府信息。”第二条规定：“本条例所称政府信息，是指行政机关在履行行政管理职能过程中制作或者获取的，以一定形式记录、保存的信息。”因此，秦某可以将该路段其他车辆的违章信息申请公开。\nC项错误，D项正确，根据《中华人民共和国行政处罚法》第三十三条第二款规定：“当事人有证据足以证明没有主观过错的，不予行政处罚。法律、行政法规另有规定的，从其规定。”因此，当事人无过错的，行政机关不得进行处罚，F市交巡警支队实施行政处罚没有遵循无过错原则，秦某可举证证明自己机动车逆向行驶没有主观过错。\n故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"11226416","cat":"法律常识","stem":"某县自然资源和规划局向县政府请示回收某地块的土地使用权。县政府批复同意后，县自然资源和规划局并未制作回收决定书，也未通知该地块的使用权人，而是直接将回收事项交由县土地储备中心付诸实施。韩某合法的房屋位于该地块内，对回收土地使用权的决定不服，遂提起行政诉讼。对此，下列说法不正确的是：","options":{"A":"县政府的批复属于内部行政行为，并没有对韩某的权益产生影响","B":"县自然资源和规划局虽未制作回收决定书，但回收土地的决定已生效","C":"县自然资源和规划局直接将县政府批复付诸实施的行为具有可诉性","D":"韩某提起行政诉讼应列的被告是县政府而不是县自然资源和规划局"},"answer":"D","explanation":"本题考查法律常识。\nA、C两项正确，根据《中华人民共和国行政诉讼法》第十二条第一款第四项规定：“人民法院受理公民、法人或者其他组织提起的下列诉讼：（四）对行政机关作出的关于确认土地、矿藏、水流、森林、山岭、草原、荒地、滩涂、海域等自然资源的所有权或者使用权的决定不服的。”内部行政行为是指行政主体在内部行政组织管理过程中所作的只对行政组织内部产生法律效力的行政行为。这种行为通常基于行政隶属关系，只影响行政组织内部的事务。然而，当内部行政行为对外部相对人的权利义务产生实际影响并被付诸实施，出现“内部行政行为外部化”的情形时，则具有可诉性。题干中，县政府的批复本身属于内部行政行为，不具有处分性，并没有对韩某的权益产生直接影响。然而，后期县自然资源和规划局直接将县政府批复付诸实施的行为对韩某的土地使用权益产生了影响，具有可诉性。\nB项正确，公定力是指行政行为一经成立，不论是否合法，即具有被推定为合法而要求所有机关、组织、个人予以尊重的一种法律效力。公定力是一种推定或假定的法律效力。行政行为在因为违法而被有关机关撒销或变更以前，被推定为合法的，要求公众予以尊重。因此，县自然资源和规划局回收该地块的土地使用权虽未严格依照法定程序，但行政行为具有公定力，一经成立，则对相对人产生效力，需要所有机关、组织、个人予以尊重。\nD项错误，根据《最高人民法院关于适用〈中华人民共和国行政诉讼法〉的解释》第十九条规定：“当事人不服经上级行政机关批准的行政行为，向人民法院提起诉讼的，以在对外发生法律效力的文书上署名的机关为被告。”《中华人民共和国行政诉讼法》第二十六条第一款：“公民、法人或者其他组织直接向人民法院提起诉讼的，作出行政行为的行政机关是被告。”题干中，并未表明谁是在对外发生法律效力的文书上署名的机关，然而题干中表明是由县自然资源和规划局直接将回收事项交由县土地储备中心付诸实施，可见该行政行为的作出机关为县自然资源和规划局，因此本案被告应为县自然资源和规划局。\n本题为选非题，故正确答案为D。","no":19,"missingImage":false},{"type":"question","qid":"11226405","cat":"人文常识","stem":"某炒货店的食品经营许可证即将到期，向所在县的市场监督管理局申请延续经营许可，县市场监督管理局经审核确认，炒货店经营许可的案件与原发证条件相比无本质变化，但周边的居民反映炒货店开业以来，人流量大，有噪声污染和用电安全隐患。对此，县市场监督管理局的合法处理方式应是：","options":{"A":"可对炒货店提出的延续申请作出暂停许可","B":"按照原标准对炒货店的延续申请进行审查","C":"按照初次许可申请要件重新审核延续申请","D":"将相邻关系因素作为延续申请的考量因素"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国行政许可法》第五十条第二款规定：“行政机关应当根据被许可人的申请，在该行政许可有效期届满前作出是否准予延续的决定；逾期未作决定的，视为准予延续。”对于被许可人的延续申请，行政机关的决定只有是否准予，暂停许可”不属于行政许可延续的法定处理方式。\nB项正确，D项错误，根据《食品经营许可和备案管理办法》第三十四条第三款规定：“申请变更或者延续食品经营许可时，申请人声明经营条件未发生变化、经营项目减项或者未发生变化的，市场监督管理部门可以不进行现场核查，对申请材料齐全、符合法定形式的，当场作出准予变更或者延续食品经营许可决定。”可见，延续申请的审查范围仅限经营条件、经营项目与行政许可直接相关的条件，噪声污染、用电安全隐患并非本案中与食品安全直接相关的条件，行政机关无需将相邻关系因素作为延续申请的考量因素。\nC项错误，根据《食品经营许可和备案管理办法》第三十三条规定：“食品经营者申请延续食品经营许可的，应当提交食品经营许可延续申请书，以及与延续食品经营许可事项有关的其他材料。食品经营者取得纸质食品经营许可证正本、副本的，应当同时提交。”行政许可延续与初次许可的法律性质、审查强度、材料要求存在法定差异，二者不能等同。延续申请无需按照初次许可申请要件重新审核。\n故正确答案为B。","no":20,"missingImage":false}],"count":9,"answerable":9,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>①近年来，利用碎片时间“听读”成为流行趋势，伴随这条小众的内容赛道走向大众化，\u003cu>                    \u003c/u>。“耳朵经济”包括播客、听书、有声读物等，具有便捷化、阅读碎片化、互动性强等特点。数据显示，我国现有相关企业4万余家，三成以上公众有听书习惯，35.4%的用户选择付费订阅，预计2028年在线音频市场收入将增长至510亿元。\u003c/p>\u003cp>②“耳朵经济”发展，不仅丰富了阅读方式和阅读体验，推动构建全民阅读新生态，也激活了消费新“声”机，为经济带来新机遇和新活力。推动有声市场的高质量发展，需从内容创新、技术创新、模式创新三个维度持续发力。\u003c/p>\u003cp>③当前，音频平台用户对内容的需求越来越多元化和个性化，这就要求内容创作者和市场主体积极关注市场动态、做好市场调研，有针对性地发掘新的创作领域，丰富创作题材的“内容池”。分析研判用户阅读消费场景与用途类别，了解其需求偏好，根据各自市场定位开发差异化、垂直性的优质内容，布局和深耕个性化细分领域，加快树立具有辨识度的市场品牌。音频以听觉为传导途径，其播出效果还取决于播讲者对文本的诠释能力、声音感染力及背景音效的信息密度。如何提升作品内容品质，将文字符号升华为带有亲密感和人情味的对话，为用户带来独特的情感体验将是市场主体面临的考验。要在激烈的市场竞争中胜出，搭建一支集编剧、配音、导演、后期制作等多方面人才于一体的强有力的团队就显得必要而重要。\u003c/p>\u003cp>④“耳朵经济”的崛起得益于科技的创新发展，数智技术在音频生产过程中必将发挥越来越重要的作用。随着大数据、云计算等技术运用于内容生产、流量预测、分发推荐等环节，音频平台可以获取用户的点击流量、付费习惯、评论内容、分享频次等数据，并根据算法机制建立用户画像，精准预测其行为习惯和偏好，为个性化内容生产提供支撑，从而提升用户黏性。人工智能、语音合成技术等将使生成的语音更加自然、流畅，传递更丰富的情感温度，系统性提高用户的收听体验。同时，无线耳机、智能音箱、智能汽车等各类智能硬件的日益普及提供了多终端、沉浸式、全场景覆盖的接收渠道，在满足用户不同需求的同时，也为“耳朵经济”的提质增效开辟了新的空间。\u003c/p>\u003cp>⑤“耳朵经济”以听觉为主要内容形态，可以很好地解放双手、双眼。因此，音频可以渗透到不同场景中，和其他应用共享碎片化时间，这为构建“音频+”的多元业务生态提供了可能。如“音频+直播”模式可实现实时互动，用户可通过音频参与直播，获得即时反馈；“音频+游戏”模式可通过声音引导创造出全新的游戏体验；“音频+出版社”模式可通过有声书和播客等形式拓宽传统出版传播渠道，使阅读变得更加便捷和生动。如此来看，以模式创新不断延伸产业链条，将为推动“耳朵经济”健康发展拓展更多有效路径。\u003c/p>","questions":[{"qid":"12100979","cat":"语句表达","stem":"填入文章第①段画横线部分最恰当的一项是：","options":{"A":"“耳朵经济”进入快速发展阶段","B":"“耳朵经济”一跃成为市场的主流","C":"“耳朵经济”开始进入消费者视野","D":"“耳朵经济”越来越受企业的关注"},"answer":"A","explanation":"横线出现在文章第①段开头，且为首句的分句，应结合本句及后文内容进行分析。首句开头指出利用碎片时间“听读”开始变得大众化，横线后论述了“耳朵经济”的具体内容及特点，并通过具体数据展示“耳朵经济”较好的发展势头。结合首句以及后文内容可知，横线处应体现“耳朵经济”具有迅猛发展的态势，对应A项。\nB项：“主流”表述过于绝对，文段仅体现了“耳朵经济”发展状况较好，与文意不符，排除。\nC项：横线前已经指出“这条小众的内容赛道走向大众化”，所以“开始进入消费者视野”与前文衔接不当，排除。\nD项：“企业”仅能对应尾句举例论证的一部分，表述片面，并且后文列举相关数据的目的是强调“耳朵经济”的发展状况较好，与后文话题衔接不当，排除。\n故正确答案为A。\n【文段出处】光明日报《发展“耳朵经济” 激活生产消费生机》","no":21,"missingImage":false},{"qid":"12100980","cat":"片段阅读","stem":"下列关于音频内容生产的说法，与文意不符的是：","options":{"A":"应按用户需求偏好开发多元化、个性化的内容","B":"应为用户提供沉浸式、全场景覆盖的接收渠道","C":"播讲者需具有好的文本诠释能力和声音感染力","D":"播讲内容应该能够给用户带去独特的情感体验"},"answer":"B","explanation":"A项：根据第③段“当前，音频平台用户对内容的需求越来越多元化和个性化，这就要求内容创作者和市场主体······丰富创作题材的‘内容池’”可知，该项表述正确，排除。\nB项：根据第④段“无线耳机、智能音箱、智能汽车等各类智能硬件的日益普及提供了多终端、沉浸式、全场景覆盖的接收渠道，在满足用户不同需求的同时，也为‘耳朵经济’的提质增效开辟了新的空间”可知，提供接收渠道的是“各类智能硬件的日益普及”而非“音频内容生产”，该项偷换概念，当选。\nC项：根据第③段“音频以听觉为传导途径，其播出效果还取决于播讲者对文本的诠释能力、声音感染力及背景音效的信息密度”可知，该项表述正确，排除。\nD项：根据第③段“如何提升作品内容品质，将文字符号升华为带有亲密感和人情味的对话，为用户带来独特的情感体验将是市场主体面临的考验”可知，该项表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】光明日报《发展“耳朵经济” 激活生产消费生机》","no":22,"missingImage":false},{"qid":"12100981","cat":"片段阅读","stem":"文章第⑤自然段重在说明：","options":{"A":"“耳朵经济”因可渗透到各种场景中而具有很好的发展前景","B":"“音频+”多元业务生态是“耳朵经济”未来的主要发展方向","C":"可通过模式创新拓展更多有效路径促进“耳朵经济”健康发展","D":"“音频”的形态特点为“耳朵经济”多元化发展提供了可能性"},"answer":"C","explanation":"文章第⑤段首先介绍“耳朵经济”是以听觉为主要内容形态，其能解放双手和双眼，因此音频可以渗透到不同场景中，这为构建“音频+”的多元业务生态提供了可能，随后通过“音频+直播”“音频+游戏”“音频+出版社”的例子具体说明了“耳朵经济”的多元化创新应用，最后通过“如此来看”进行总结，强调通过模式创新可以为推动“耳朵经济”健康发展拓展更多有效路径，对应C项。\nA项：文段重点强调通过模式创新可以推动“耳朵经济”发展，而非其“发展前景”，该项偏离文段核心，排除。\nB项：文段虽然提到“‘音频+’多元业务生态”，但未强调其为“未来的主要发展方向”，无中生有，排除。\nD项：“‘音频’的形态特点为‘耳朵经济’多元化发展提供了可能性”为文段开头引出话题的内容，非重点，排除。\n故正确答案为C。\n【文段出处】光明日报《发展“耳朵经济” 激活生产消费生机》","no":23,"missingImage":false},{"qid":"12100983","cat":"片段阅读","stem":"关于“耳朵经济”，文中未提及的是：","options":{"A":"便捷化、阅读碎片化、互动性强是其特点","B":"进一步推动了视听电子产业的高质量发展","C":"其崛起得益于数字技术等科技的创新和发展","D":"内容创新是决定其后续发展状况的重要因素"},"answer":"B","explanation":"A项：根据第①段“‘耳朵经济’包括播客、听书、有声读物等，具有便捷化、阅读碎片化、互动性强等特点”可知，该项在文章中有所提及，排除。\nB项：“进一步推动了视听电子产业的高质量发展”文章并未提及，无中生有，当选。\nC项：根据第④段“‘耳朵经济’的崛起得益于科技的创新发展，数智技术在音频生产过程中必将发挥越来越重要的作用”可知，该项在文章中有所提及，排除。\nD项：根据第②段“推动有声市场的高质量发展，需从内容创新、技术创新、模式创新三个维度持续发力”可知，该项在文章中有所提及，排除。\n本题为选非题，故正确答案为B。\n【文段出处】光明日报《发展“耳朵经济” 激活生产消费生机》","no":24,"missingImage":false},{"qid":"12100984","cat":"片段阅读","stem":"下列最适合做这篇文章标题的是：","options":{"A":"“耳朵经济”走进你我他","B":"“耳朵经济”：科技创新的宠儿","C":"经济发展的新路径——“耳朵经济”","D":"发展“耳朵经济”激活生产消费生机"},"answer":"D","explanation":"文章第①段提出了“耳朵经济”的话题，第②段指出“耳朵经济”的发展为经济带来了新机遇和新活力，并指出推动有声市场高质量发展要从内容创新、技术创新、模式创新三个维度发力，接下来第③④⑤段分别从内容创新、技术创新、模式创新三个方面具体论述如何发展“耳朵经济”。故文章重点强调发展“耳朵经济”激活了生产消费新“声”机，为经济带来新机遇和新活力，对应D项。\nA项：“走进你我他”对应文章第①段，仅指出“耳朵经济”目前已成为流行趋势，非重点，排除。\nB项：“科技创新”仅对应文章第④段，非重点，且表述片面，排除。\nC项：“经济发展的新路径”文章并未体现，与文章的对应不及D项准确，排除。\n故正确答案为D。\n【文段出处】光明日报《发展“耳朵经济” 激活生产消费生机》","no":25,"missingImage":false},{"qid":"13319266","cat":"片段阅读","stem":"在江苏，自动驾驶已成为创新技术重塑物流运输产业的重要载体。搭载多类型传感器的智慧重型卡车，一旦切换到智能辅助驾驶状态，驾驶员就变身为安全员，只需坐在车上监管，智慧重型卡车会根据实时路况减速、避让或变道。除了智慧重型卡车，应用于港口的自动驾驶集装箱卡车也已完成技术验证的初始阶段，驶入了大规模商业应用的快车道。行驶在物流园区与制造业企业之间的自动驾驶物流车，则在智驾系统助力下，实现了物流业与制造业的深度融合。\n这段文字重在说明：","options":{"A":"自动驾驶在江苏的应用场景已经越来越广阔","B":"物流车应用智能技术使得驾驶员获得了解放","C":"自动驾驶促进了江苏物流运输业的发展升级","D":"物流车因智能技术的加持应用范围不断扩大"},"answer":"C","explanation":"文段开篇指出自动驾驶成为江苏地区创新技术重塑物流运输产业的重要载体，接着通过智慧重型卡车、自动驾驶集装箱卡车、自动驾驶物流车的例子，对前文进行举例论证，具体说明自动驾驶在江苏物流运输领域的应用和积极影响。故文段重点强调自动驾驶促进江苏地区重塑物流运输产业，对应C项。\nA项：“应用场景已经越来越广阔”表述不明确，文段强调自动驾驶在江苏物流运输业的应用，排除。\nB项：“驾驶员获得了解放”对应举例论证的部分内容，非重点，排除。\nD项：“智能技术”范围扩大，文段的主题词为“自动驾驶”，排除。\n故正确答案为C。\n【文段出处】人民日报《自动驾驶，让货运更智慧》","no":26,"missingImage":false},{"qid":"13319269","cat":"片段阅读","stem":"司法建议最初源于行政诉讼。近年来，司法建议的适用范围不断拓展，从保障法院裁判执行措施，进阶升级为社会矛盾纠纷的预防性机制。司法建议既是对传统“治未病”理念的继承，也是对新时代“枫桥经验”的一项创新性实践。通过司法建议，对案件审理过程中发现的可能影响社会和谐的隐患或因素提出建议，以预防纠纷再次发生。有效的司法建议不仅能预先准确找出矛盾纠纷产生的原因，还能进一步提升法院的权威，彰显司法的人文关怀。\n下列关于司法建议的说法，与文意不符的是：","options":{"A":"适用范围正在逐步地扩大","B":"不会弱化司法机关的权威","C":"可有效避免社会矛盾产生","D":"是一种更柔性的治理方式"},"answer":"C","explanation":"A项：根据“近年来，司法建议的适用范围不断拓展”可知，该项表述正确，排除。\nB项：根据“有效的司法建议不仅能预先准确找出矛盾纠纷产生的原因，还能进一步提升法院的权威”可知，该项表述正确，排除。\nC项：根据“近年来，司法建议的适用范围不断拓展，从保障法院裁判执行措施，进阶升级为社会矛盾纠纷的预防性机制”“通过司法建议，对案件审理过程中发现的可能影响社会和谐的隐患或因素提出建议，以预防纠纷再次发生”可知，司法建议目前只能起到“预防社会矛盾纠纷”“预防纠纷再次发生”的作用，“有效避免社会矛盾产生”表述过于绝对，当选。\nD项：根据“有效的司法建议不仅能······还能······彰显司法的人文关怀”可知，该项表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明日报《司法建议：为柔性治理提供一副“良方”》","no":27,"missingImage":false},{"qid":"13319272","cat":"片段阅读","stem":"口口相传的经验是讲故事的人的灵感来源。在劳动的氛围中讲故事，是一种交流方式。每一个讲故事的人都会在故事中留下自己的痕迹，就像制陶人会在陶器上留下自己的印记一样。人在放松的状态下听故事，内心会想记下这些故事，并有对他人转述故事的愿望，这就构成了听故事的人与讲故事的人之间的关系。讲故事的人就像智者一样，能讲出自己的人生经验，也能讲出他人的经验、历史的经验，他们能让故事的火把生活的灯芯点燃。\n这段文字中“在故事中留下自己的痕迹”的含义最有可能是：","options":{"A":"每个故事都会被讲故事的人加入一些自身经历","B":"讲故事的人会结合个人阅历对故事进行再加工","C":"讲故事的人会向听故事的人讲自己的人生经验","D":"每个故事在被多个人讲述之后内容会发生变化"},"answer":"B","explanation":"文段开篇表明讲故事的人的灵感源于口口相传的经验，接着指出讲故事的人会在故事中留下自己的痕迹，并用制陶人做类比，强调讲故事的人会在故事中留下属于自己的印记，然后从听故事的人的角度，阐述听故事的人与讲故事的人之间的互动关系，最后把讲故事的人比作智者，强调他们既能讲出自己的人生经验，也能传达他人的经验和历史的经验，进一步说明讲故事的人会在故事中留下属于自己的独特印记。故“在故事中留下自己的痕迹”指的是讲故事的人会在故事中加入自己的人生经验，或者自己对他人经验、历史经验的理解，对应B项。\nA、D两项：“每个故事”主体错误，文段中“留下自己的痕迹”的主体应该是“讲故事的人”，均排除。\nC项：“讲自己的人生经验”表述片面，文段提到讲故事的人还能讲他人的经验和历史的经验，排除。\n故正确答案为B。\n【文段出处】网易《火与灯芯》","no":28,"missingImage":false},{"qid":"12100968","cat":"片段阅读","stem":"不同于单车智能技术路线，“车路云一体化”可以理解为“聪明的车+智慧的路+强大的云”，实现车端、路端双数据感知相互补充，在复杂场景下形成协同决策。通过数据共享与实时交互，路侧基础设施获取的实时感知信息弥补了车端传感器的感知短板，极大地提升了自动驾驶的安全性与效率。近期入选试点的南京、无锡、苏州等20个城市，都具备汽车产业发展或智能网联汽车运行的基础，在政策突破、产业聚集、场景应用等方面具有优势，能够为“车路云一体化”提供实践经验和数据支持。\n下列关于“车路云一体化”的说法，与文意不符的是：","options":{"A":"车端传感器感知技术取得关键性突破","B":"车端、路端双数据能够形成协同决策","C":"有助于提升自动驾驶的安全性和效率","D":"试点城市都已具备一定的基础和优势"},"answer":"A","explanation":"A项：根据“路侧基础设施获取的实时感知信息弥补了车端传感器的感知短板”可知，文段强调的是路侧基础设施对车端传感器的补充作用，而非车端传感器感知技术自身取得关键性突破，该项与文意不符，当选。\nB项：根据“‘车路云一体化’可以理解为‘聪明的车+智慧的路+强大的云’，实现车端、路端双数据感知相互补充，在复杂场景下形成协同决策”可知，车端、路端双数据能够形成协同决策，该项与文意相符，排除。\nC项：根据“‘车路云一体化’可以理解为······极大地提升了自动驾驶的安全性与效率”可知，“车路云一体化”有助于提升安全性和效率，该项与文意相符，排除。\nD项：根据“近期入选试点的南京、无锡、苏州等20个城市，都具备汽车产业发展或智能网联汽车运行的基础，在政策突破、产业聚集、场景应用等方面具有优势”可知，试点城市都已具备一定的基础和优势，该项与文意相符，排除。\n本题为选非题，故正确答案为A。\n【文段出处】人民日报《推动新能源汽车智能化发展》","no":29,"missingImage":false},{"qid":"13319281","cat":"片段阅读","stem":"有关数据显示：2024年1—7月，高端装备制造业销售收入同比增长8.3%，占制造业总销售收入的比重为16.5%，较上年同期提高0.5个百分点；智能设备制造业销售收入同比增长12.4%；高耗能制造业销售收入占制造业比重为30.7%，较上年同期下降0.8个百分点，节能降耗工作有序推进；制造业企业采购环境治理服务金额同比增长6.2%，增速较2023年加快2.4个百分点，治污投入不断加大。\n这段文字重在说明：","options":{"A":"制造业持续不断在国民经济发展中起领跑作用","B":"经济发展亮点频现呈现出持续向好的发展态势","C":"制造业正向高端化智能化绿色化发展扎实推进","D":"经济发展与生态治理齐头并进为实现双赢努力"},"answer":"C","explanation":"文段首先列举了2024年1—7月高端装备制造业销售收入增长的数据，接着通过分号进行衔接，列举了智能设备制造业销售收入增长、高耗能制造业销售收入降低的数据，以及制造业企业采购环境治理服务金额增长的数据。故文段为由分号衔接的并列结构，需全面概括，强调制造业正在向着高端、智能、低耗能、少污染的方向发展，对应C项。\nA项：“领跑作用”文段并未提及，无中生有，排除。\nB、D两项：均缺少文段核心话题“制造业”，排除。\n故正确答案为C。\n【文段出处】人民日报《透过增值税发票看经济亮点》","no":30,"missingImage":false},{"qid":"13319274","cat":"片段阅读","stem":"在何尊的铭文中，有一句话是“恭德裕天”。其中的“德”字，相较甲骨文，底部多出“心”字部首。有专家认为，有“心”方为“德”，表明在三千多年前“德政”这一政治理念业已出现，这为人们理解中国的政治传统提供了有益启示。不同时代、地域青铜器之间的关系“图谱”，青铜器的材质分析、工艺重建和产地溯源，青铜器不同器型与纹饰的来源、演变······亟待破译的“青铜密码”还有很多，需要我们拓宽视野，运用多种研究方法、技术手段进行综合分析，进一步推动相关学科发展。\n这段文字意在强调：","options":{"A":"青铜器的研究领域十分广阔","B":"青铜器亟待进一步深入研究","C":"青铜器研究有益于挖掘传统文化","D":"青铜器研究具有极其重要的价值"},"answer":"B","explanation":"文段开篇以何尊的铭文中“德”字的变化引出“德政”理念，阐述了青铜器研究对理解中国政治传统的意义，接着介绍了一些亟待破译的“青铜密码”，并提出对策，强调需要运用多种方法、手段进行综合分析，从而推动相关学科发展。故文段重在强调青铜器亟待进一步深入研究，对应B项。\nA项：文段重点强调要对青铜器进行深入研究，而非强调青铜器的研究领域广阔，该项偏离文段重点，排除。\nC、D两项：C项“有益于挖掘传统文化”，D项“具有极其重要的价值”均为意义表述，文段重点强调对策，排除。\n故正确答案为B。\n【文段出处】人民网《打开青铜器这本“大书”》","no":31,"missingImage":false},{"qid":"13319271","cat":"片段阅读","stem":"在众多用于建筑的保温材料中，蛭石因其良好的保温性能而广受青睐。蛭石是一种含镁的水铝硅酸盐次生变质矿物，具有二维层状结构，受热时会失水膨胀，因形状类似水蛭而得名。经高温煅烧后，蛭石体积能瞬间膨胀十几倍，每块膨胀蛭石里有很多毛细孔，且每个毛细孔都是微纳米级孔径。这些小空隙就是一个个保温空间。蛭石膨胀倍数越高，空隙越发达，保温性能也就越好。更重要的是，蛭石在生产加工过程中对生态环境污染很小，产品废弃后还能回收再利用，非常符合建筑领域十分推崇的可持续发展理念。\n最适合做这段文字标题的是：","options":{"A":"蛭石为什么可以保温","B":"蛭石：一种神奇的矿石","C":"你所不知道的“蛭石”真面貌","D":"蛭石：让建筑物更加绿色节能"},"answer":"D","explanation":"文段首先引出“蛭石”的话题，并说明蛭石是广受青睐的建筑保温材料，接着介绍蛭石的成分、性状和名称的由来，然后介绍了蛭石保温的原理，尾句通过“更重要的是”引出重点，强调蛭石具有环保的特性，符合建筑领域的可持续发展理念，对应D项。\nA项：“为什么可以保温”对应前文内容，非重点，且未体现文段核心话题“建筑”，排除。\nB项：“神奇的矿石”表述不明确，未体现蛭石节能环保的特点，且未体现文段核心话题“建筑”，排除。\nC项：“你所不知道的‘蛭石’真面貌”侧重与普遍认知不相符的实际情况，而文段未提及对“蛭石”的普遍认知，该项无中生有，排除。\n故正确答案为D。\n【文段出处】响水日报《蛭石：让建筑物更加绿色节能》","no":32,"missingImage":false},{"qid":"12100969","cat":"片段阅读","stem":"近年来，网购发展势头迅猛，各类购物节层出不穷。每到大促销那几天，网络延迟、抢不到货、运力紧张等问题会直接影响消费者购物体验。为此，商家和平台想出了很多应对方法，预售便是其中之一。预售最直接的好处，就是提前知道能卖多少。通过预售，能对未来销售量作出较为精准的预测，从而解决备货和周转问题。如果遇到购物节，预售还能提前制造话题、增加活动曝光度，唤醒消费者的潜在需求。预售打了个时间差，也缓解了平台在购物节期间的流量压力。\n这段文字意在说明：","options":{"A":"网络商家和平台选择预售模式的原因","B":"网络购物节期间预售发挥的重要作用","C":"预售能提升消费者促销期间购物体验","D":"预售的好处是能刺激消费者购物需求"},"answer":"A","explanation":"文段开篇指出在大促销的时候会出现一些影响消费者购物体验的问题，接着通过“应对方法”给出对策，即预售，然后从多个方面详细解释了预售的好处。故文段重点在于对策，强调商家和平台选择预售的模式来解决大促销期间购物产生的问题，对应A项。\nB项：“预售发挥的重要作用”对应解释说明的内容，非重点，排除。\nC项：“提升消费者促销期间购物体验”表述片面，文段说的是除了消费者获得好处外，商家和平台也获得了好处，排除。\nD项：“刺激消费者购物需求”对应解释说明的内容，非重点，且表述片面，排除。\n故正确答案为A。\n【文段出处】经济日报《商家为什么爱预售》","no":33,"missingImage":false},{"qid":"13319268","cat":"片段阅读","stem":"“N无”的极简婚礼已成为年轻人婚礼的新趋势，包括“三无”“四无”“五无”婚礼。具体指的是无早起、无接亲、无仪式、无车队、无煽情、无主持、无婚纱、无接亲堵门、无场地布置、无伴娘伴郎等各种“无”的随意搭配组合。他们取消有当众表演之嫌的过度煽情催泪环节，使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车，结束后作为伴手礼赠予亲朋。这些对婚礼的“整顿”，实则是年轻人追求“实用主义”与自我满足在婚礼中的表现。\n下列关于极简婚礼的说法，与文意不符的是：","options":{"A":"让传统、现代和个性在婚礼中更好融合","B":"是对固有的婚礼模式和长辈安排的反抗","C":"年轻人在婚礼中的消费越来越回归理性","D":"年轻人在婚礼中的表现越来越尊重内心"},"answer":"B","explanation":"A项：根据“具体指的是······各种‘无’的随意搭配组合。他们取消有当众表演之嫌的过度煽情催泪环节，使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，“随意搭配组合”体现出个性，结合“使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，既有对传统环节的沿用，也体现出现代性，该项表述正确，排除。\nB项：“对固有的婚礼模式和长辈安排的反抗”文段未提及，无中生有，当选。\nC项：根据“使用简单环保的装饰，将婚礼上布置场地的鲜花送给宾客，直接用蔬果布置现场和婚车”可知，“使用简单环保的装饰”及“用蔬果布置”体现出年轻人在婚礼消费中的理性，该项表述正确，排除。\nD项：根据“这些对婚礼的‘整顿’，实则是年轻人追求‘实用主义’与自我满足在婚礼中的表现”可知，“尊重内心”表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】中国青年报《“整顿”的风吹到了婚礼》","no":34,"missingImage":false},{"qid":"12100970","cat":"片段阅读","stem":"当滑雪者因雪崩被困在厚厚的雪层之下，由于雪很轻，他可以将双手交叉，形成一个气囊用于呼吸，但沙洞坍塌时的情况就有所不同。在沙洞坍塌事故中救人往往非常困难，因为沙子沉重且极其不稳定。当救援人员舀走沙子，并试图解救被困者时，救援人员的重力作用会导致沙洞继续塌陷，并重新填满空隙。因此，消防员等专业人员从坍塌的沙洞救人时，通常会在洞口横放一些木板。这样，他们就可以使用工具移除沙子，而不会将任何重量直接压在洞口边缘。\n根据文意，“因此”中的“此”是指：","options":{"A":"沙洞坍塌与雪崩的情形不同","B":"沙洞坍塌救援时需将洞口沙子移除","C":"沙洞坍塌救人具有不可控性","D":"沙洞坍塌救援时可能带来新的坍塌"},"answer":"D","explanation":"本题为代词指代题，“因此”中的“此”位于文段中间，可结合前文理解代词含义。文段开篇对比了雪崩与沙洞坍塌的情况，指出在沙洞坍塌事故中救人往往非常困难，接着指出沙洞坍塌救援时救援人员的重力作用会导致沙洞继续塌陷，随后通过“因此”进行总结，故“此”指的是沙洞坍塌救援时救援人员的重力作用会导致沙洞继续塌陷，对应D项。\nA项：“沙洞坍塌与雪崩的情形不同”对应文段引出话题的内容，并非代词指代的对象，排除。\nB项：“需将洞口沙子移除”对应代词之后的内容，并非代词指代的对象，排除。\nC项：“不可控性”与D项“可能带来新的坍塌”相比，表述不明确，排除。\n故正确答案为D。\n【文段出处】微信公众号《沙滩上不要随便挖洞，里面暗藏着杀机》","no":35,"missingImage":false},{"qid":"12100972","cat":"语句表达","stem":"近年来，随着科技的发展，AI已经深入到文艺创作的各个领域，并逐渐兴起一场艺术创作模式革命。在流行音乐领域，一批AI作曲软件快速迭代升级，有效推动了新作品的结构优化，增强了旋律扩写能力，一定程度上促进了流行音乐作品的优胜劣汰。AI创作门槛越来越低，使得“全民制作人”成为可能。此种背景下，                    ，成为热门话题。\n填入画横线部分最恰当的一项是：","options":{"A":"AI对流行音乐创作影响几何","B":"流行音乐人应如何利用AI创作","C":"AI作曲软件如何促成全民制作人","D":"流行音乐领域未来如何与AI共生"},"answer":"A","explanation":"横线出现在文段结尾，且为尾句的分句，故需结合横线前内容以及横线所在尾句内容进行分析。文段开篇提到AI深入文艺创作的各个领域，并带来一场艺术创作模式革命，接着具体阐述AI在流行音乐领域所带来的影响，指出AI作曲软件的升级促进了流行音乐作品的优胜劣汰以及AI创作门槛低使“全民制作人”成为可能，尾句通过“此种背景下”总结前文，横线后指出“成为热门话题”。故横线处应继续围绕“AI”和“流行音乐创作”进行论述，概括AI对流行音乐创作产生的影响，对应A项。\nB项：“流行音乐人应如何利用AI创作”表述错误，文段重点论述AI对流行音乐创作整体产生的影响，排除。\nC项：“AI作曲软件如何促成全民制作人”只是AI影响流行音乐创作的一个方面，表述片面，排除。\nD项：“流行音乐领域未来如何与AI共生”强调的是未来的共生关系，而文段更多是在论述当下AI对流行音乐创作已经产生的影响，排除。\n故正确答案为A。\n【文段出处】光明网《AI作曲：会给流行音乐带来什么》","no":36,"missingImage":false},{"qid":"13319277","cat":"片段阅读","stem":"数字货币利用大数据与区块链技术，能够高效记录并存储交易信息及货币流向。这种技术的应用使得货币的创造、流通和监控过程变得更加透明和高效。具体来说，大数据技术的运用使得货币政策的制定者可以快速获取大量实时的经济活动数据，极大提高了数据的准确性和政策制定的针对性。区块链技术的特性——分布式账本，为货币流通提供了一个安全可靠的环境，确保了交易信息的不可篡改和实时追踪，降低了监控成本并减少了实施滞后。此类技术革新为中央银行在制定和实施货币政策时提供了强大的数据支撑，使政策更加精准地匹配经济情况的实际需求。\n这段文字重在说明：","options":{"A":"数字货币使货币政策的制定实施更精准和高效","B":"数字货币在金融监管方面具有较大的应用价值","C":"大数据与区块链技术有利于推动宏观经济发展","D":"大数据与区块链技术为货币流通提供安全保障"},"answer":"A","explanation":"文段开篇引出“数字货币”这一概念，指出其利用大数据与区块链技术使得货币的创造、流通和监控过程变得更加透明和高效，接下来通过“具体来说”分别从大数据技术可提高数据的准确性、政策制定的针对性以及区块链技术能降低监控成本并减少实施滞后这两方面对数字货币的作用进行解释说明，尾句通过指代词“此类技术革新”指代前文内容，得出结论，强调数字货币能为中央银行制定和实施货币政策时提供数据支撑，让政策更精准匹配需求。故文段重点强调数字货币对货币政策的正向作用，主题词为“数字货币”与“货币政策”，对应A项。\nB项：“在金融监管方面具有较大的应用价值”对应文段中数字货币的一项作用，除此之外，数字货币还有“创造”“流通”等方面的作用，选项表述片面，且选项并未提及文段主题词“货币政策”，偏离文段重点，排除。\nC项：“推动宏观经济发展”概念范围扩大，文段仅论述“货币政策”，且选项并未提及文段主题词“数字货币”与“货币政策”，排除。\nD项：“安全保障”对应文段解释说明中“区块链技术”的作用，属于数字货币中的一项技术运用，非重点且表述片面，另外选项并未提及文段主题词“数字货币”与“货币政策”，排除。\n故正确答案为A。","no":37,"missingImage":false},{"qid":"13319280","cat":"片段阅读","stem":"作为一类代谢功能多样的特殊微生物，光合细菌具有强大的生化催化能力和营养益生功能，可以制备多种多样的生物制剂。目前国内科研院所和医药厂商对光合细菌在医药产品开发领域的研究仍处于起步阶段。随着科学技术水平不断进步，研究者对光合细菌类群特殊代谢能力的理解将进一步加深，有助于持续激发该类细菌的产业化潜力。除生产新式治疗药物外，还可利用光合细菌适应极端环境的生存优势，结合基因工程技术，设计开发工程菌株，通过微生物催化作用实现分子结构重组，用以大量生产重要原料药物，或可替代化学制药技术。总体而言，深度拓展光合细菌在医药研究领域的研究，具有良好的应用前景与实践意义，有望推动微生物制药工程可持续发展。\n从这段文字提取关键词最恰当的一项是：","options":{"A":"特殊微生物 光合细菌 生物制药","B":"特殊微生物 代谢能力 产业化","C":"光合细菌 产业化 制药技术","D":"光合细菌 代谢功能 医药应用"},"answer":"D","explanation":"文段开篇引出“光合细菌”这一话题，指出其可以制备多种多样的生物制剂，接着指出虽然目前国内对光合细菌在医药产品开发领域的研究处于起步阶段，但是随着科技水平的进步，研究者对光合细菌的代谢能力的理解将进一步加深，有助于激发其产业化潜力，其可用于生产药物或替代化学制药技术，最后通过“总体而言”进行总结，强调拓展光合细菌在医药研究领域的研究有良好的应用前景与实践意义。故文段围绕光合细菌在医药方面的应用展开论述，D项“光合细菌”“代谢功能”“医药应用”能够很好地概括文段重点，当选。\nA项：“特殊微生物”非重点，排除。\nB项：缺少文段主题词“光合细菌”，偏离文段中心，排除。\nC项：“制药技术”表述片面，无法全面概况光合细菌在医药方面的应用，且“产业化”非重点，排除。\n故正确答案为D。\n【文段出处】知网《光合细菌代谢与其在医药领域的应用》","no":38,"missingImage":false},{"qid":"12100975","cat":"片段阅读","stem":"日常生活中，用来加工米饭、馒头等主食的原料，几乎都来自禾本科植物。在成为主食重要来源的过程中，禾本科植物经历了漫长的进化和选择阶段。在长期的物种进化中，野生种经过天然杂交、遗传物质自然加倍，以及异常气候及环境胁迫导致的自然选择，逐步形成了人类可以作为食物进行种植的禾本科植物类型。禾本科植物适应性强，易于推广种植，其籽粒便于储藏、加工，且营养丰富。禾本科植物分布范围广，抗逆性比较强，遗传多样性丰富，因此在不同类型环境中都能种植，并获得较理想的产量。\n这段文字重在说明：","options":{"A":"禾本科植物适应性强且便于种植","B":"禾本科植物成为主食主要原料的缘由","C":"禾本科植物籽粒的营养十分丰富","D":"禾本科植物经历的进化和选择的过程"},"answer":"B","explanation":"文段开篇指出禾本科植物是主食的主要原料，接着说明禾本科植物在成为主食重要来源的过程中，经历了漫长的进化和选择阶段，并具体说明了其形成人类可以作为食物进行种植的禾本科植物类型的进化过程，随后论述禾本科植物自身的特点和种植优势。故文段重在强调禾本科植物成为主食主要原料的原因，对应B项。\nA、C两项：均对应禾本科植物优势中的一部分，表述片面，排除。\nD项：“禾本科植物经历的进化和选择的过程”非重点，排除。\n故正确答案为B。\n【文段出处】人民网《主食为何大多来自禾本科？》","no":39,"missingImage":false},{"qid":"13319284","cat":"语句表达","stem":"①因为声波是一种机械波，声波的传播依赖于机械振动在介质中的传递\n②花样游泳比赛时，水上水下都要有音响设备\n③因此，当声波入射到水和空气的交界面时，仅有0.1%的声能量能透过水-气交界面\n④为什么空气中和水下难以共享一个声音世界呢\n⑤在不同介质中，声波的传递能力会因介质声阻抗的差异而有所不同，常温下，空气与水的声阻抗相差约3600倍\n⑥声音在水和空气之间的极低透射，使得潜入水中的花样游泳运动员难以听到岸上音乐，所以需要水上和水下同时布置音响设备\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②①④⑥⑤③","B":"②④①⑤③⑥","C":"④①⑤③②⑥","D":"④①②⑤⑥③"},"answer":"B","explanation":"对比选项，确定首句。选项中首句分别为②句和④句。②句指出花样游泳比赛时水上水下都要有音响设备，④句提出“为什么空气中和水下难以共享一个声音世界”的问题，根据逻辑顺序可知，④句是围绕②句内容进行的进一步论述，故②句应在④句之前，排除C、D两项，保留A、B两项。\n继续观察选项，②句后分别衔接①句与④句，①句指出声波的传播依赖于机械振动在介质中的传递，是对④句“为什么空气中和水下难以共享一个声音世界”的回答，故④句应在①句之前，排除A项，B项当选。\n故正确答案为B。\n【文段出处】科普中国网《“我是你的破壁人！”空气&水：······》","no":40,"missingImage":false},{"qid":"13319291","cat":"逻辑填空","stem":"在发展新质生产力的当下，江苏高端制造不断刷新纪录，取得创新成果。近日，工信部公布了2024年先进制造业集群“国家队”名单，全国共有35个先进制造业集群            ，其中江苏有4个入选，在这场国家级的选拔赛中，江苏            ，有何过人之处？\n依次填入画横线部分最恰当的一项是：","options":{"A":"上榜 一路凯歌","B":"入围 一枝独秀","C":"荣膺 技压群芳","D":"胜出 独占鳌头"},"answer":"A","explanation":"第一空，根据“工信部公布了2024年先进制造业集群‘国家队’名单”“其中江苏有4个入选”可知，横线处应体现全国共有35个先进制造业集群进入名单之意。A项“上榜”、B项“入围”都有进入名单之意，符合文意，保留。D项“胜出”指在比赛或竞争中胜过对手，符合文意，保留；C项“荣膺”指光荣地接受或承当，一般搭配“称号”“荣誉”等，与“名单”搭配不当，排除。\n第二空，根据“江苏高端制造不断刷新纪录，取得创新成果”“其中江苏有4个入选，在这场国家级的选拔赛中，江苏······有何过人之处”可知，横线处应体现江苏表现突出、成绩不凡。A项“一路凯歌”形容在前进的过程中不断取得成功和胜利，充满了喜悦和荣耀，符合文意，当选。B项“一枝独秀”形容在同类事物中最为突出，最为优秀，文段没有强调江苏是最出色的，只是强调江苏自身表现出色，与文意不符，排除；D项“独占鳌头”指在竞争中夺得首位，文段并未强调江苏排名第一，与文意不符，排除。\n故正确答案为A。\n【文段出处】现代快报《先进制造业集群“国家队”，江苏+4》","no":41,"missingImage":false},{"qid":"12100971","cat":"逻辑填空","stem":"哺乳动物稍晚于恐龙出现在演化舞台上。在中生代与恐龙相伴的演化过程中，哺乳动物一直是身形娇小的类群，根本无法与“巨无霸”恐龙            。但在新生代，虽然        出许多高大威猛的动物，哺乳动物却成为生物界的王者。\n依次填入画横线部分最恰当的一项是：","options":{"A":"相提并论 突现","B":"等量齐观 进化","C":"分庭抗礼 涌现","D":"同日而语 繁衍"},"answer":"C","explanation":"第一空，根据“但在新生代，虽然······哺乳动物却成为生物界的王者”可知，横线处应体现在中生代，身形娇小的哺乳动物并非王者，不具备与“巨无霸”恐龙平起平坐、相互抗衡的实力和地位。C项“分庭抗礼”指双方平起平坐，实力相当，可以抗衡，符合文意，保留。A项“相提并论”指把不同事物不加区别地混在一起来谈论或对待，文段并非强调哺乳动物和恐龙是否可以放在一起谈论，而是强调在中生代两者的地位和实力差距很大，与文意不符，排除。B项“等量齐观”指对有差别的事物同等看待，强调看待事物的态度是同等的、没有差别的，无法体现两者地位的高低及是否能抗衡，与文意不符，排除。D项“同日而语”指放在同一时间谈论，通常是同一事物在不同时间的比较，而文段是哺乳动物和恐龙两个不同事物在同一时间的对比，与文意不符，排除。\n第二空，代入验证。C项“涌现”指在同一时期大量地出现，置于此处能体现出许多高大威猛的动物大量出现之意，符合文意，当选。\n故正确答案为C。\n【文段出处】科普时报《早期小型哺乳动物长得慢活得久》","no":42,"missingImage":false},{"qid":"12100974","cat":"逻辑填空","stem":"当前，人力资源供需还存在不        的现象，发展新职业有利于解决这一问题。积极挖掘、培育新职业，开发好这个就业增长点，将有效促进更高质量更充分就业。各级政府需            、创造条件，引导新职业健康发展。\n依次填入画横线部分最恰当的一项是：","options":{"A":"平衡 齐头并进","B":"和谐 多管齐下","C":"协调 齐抓共管","D":"匹配 多措并举"},"answer":"D","explanation":"第一空，搭配“人力资源供需”，且根据后文可知，横线所在分句应体现人力资源的供应无法满足需求之意。A项“平衡”指对立的各方面在数量或质量上相等或相抵，D项“匹配”指两个或多个事物在某些方面相适应、相符合或相配合，均与“人力资源供需”搭配恰当，且符合文意，保留。B项“和谐”指配合得适当，和睦协调，常与“音调”“社会”等搭配，C项“协调”指配合得适当，常与“色彩”“动作”等搭配，均与“人力资源供需”搭配不当，排除。\n第二空，根据顿号可知，横线处应与“创造条件”构成近义并列关系，体现各级政府针对人力资源供需问题应采取一定的措施、对策之意。D项“多措并举”指一起行动、同时实施，符合文意，当选。A项“齐头并进”形容有几个事情或一个事情的多个方面不分先后地同时进行，侧重同时进行，无法体现政府应想办法解决人力资源供需问题之意，与文意不符，排除。\n故正确答案为D。\n【文段出处】人民网《把握新职业带来的新机遇》","no":43,"missingImage":false},{"qid":"12100976","cat":"逻辑填空","stem":"在全世界地质学家和古生物学家的共同努力下，地球演化史的时间框架已经建立，国际年代地层表也就            ，并且国际地层委员会每年都会对其进行优化更新。随着国际年代地层表的            ，世界各国的地质学家可以更好地研究地球的构造与变化，为保护地球、服务人类生态文明建设做出贡献。\n依次填入画横线部分最恰当的一项是：","options":{"A":"水到渠成 精益求精","B":"呼之欲出 大功告成","C":"应运而生 日臻完善","D":"瓜熟蒂落 精雕细琢"},"answer":"C","explanation":"本题可从第二空入手。根据前文“国际地层委员会每年都会对其进行优化更新”可知，横线处所填成语应体现不断优化更新之意。C项“日臻完善”指一天天逐步达到完美的境地，符合文意，保留。A项“精益求精”比喻已经很好了，还要求更好，主语通常为人，与“国际年代地层表”搭配不当，排除。B项“大功告成”指巨大工程或重要任务宣告完成，侧重完成，与文意不符，排除。D项“精雕细琢”形容做事仔细用心，与“国际年代地层表”搭配不当，排除。\n第一空，代入验证。根据“在全世界地质学家······时间框架已经建立”可知，横线处所填成语应体现在地球演化史的时间框架建立这一背景下，国际年代地层表随之产生。C项“应运而生”指随着某种形势而产生，符合文意，当选。\n故正确答案为C。\n【文段出处】《地球的年龄怎么算？》","no":44,"missingImage":false},{"qid":"12100977","cat":"逻辑填空","stem":"金秋十月，正是新疆最美的时节。天山南北片片胡杨林叠翠流金，城市间平坦宽敞的马路            ，现代化建筑            ，一座座现代化城市吸引着来自四面八方的游客。\n依次填入画横线部分最恰当的一项是：","options":{"A":"参差交错 比比皆是","B":"整齐划一 巍然挺立","C":"纵横交错 鳞次栉比","D":"秩序井然 错落有致"},"answer":"C","explanation":"第一空，搭配“马路”，且根据文意与选项内容可知，横线处需体现城市间平坦宽敞的马路的布局。C项“纵横交错”指横的、竖的交叉在一起，能形象地体现出马路横竖交叉的布局，与实际情况相符，且符合语境，保留。A项“参差交错”指各种不同的事物错综复杂地交织在一起，用于此处表示马路规划不整齐、交叉混乱，与“平坦宽敞”的马路规划不符，排除；B项“整齐划一”指有条有理，全都一样，用于形容马路的分布情况程度过重，马路的铺设无法做到完全一致，与实际不符，排除；D项“秩序井然”形容有次序、条理分明的样子，多用于形容管理有序的场景，而非马路的分布情况，排除。\n第二空，代入验证。横线处搭配“现代化建筑”。C项“鳞次栉比”形容房屋等密集整齐地排列，符合现代化建筑排列紧密有序的特点，符合文意，当选。\n故正确答案为C。\n【文段出处】新华网《天山长城 大漠华章——新疆生产建设兵团成立70周年综述》","no":45,"missingImage":false},{"qid":"13319285","cat":"逻辑填空","stem":"目前，我国快递业务已经达到了前所未有的新高度，业务量已突破1000亿件大关。快递物流是经济活力            的“风向标”，不仅            出行业的蓬勃跃升，更彰显了我国经济的繁荣活力与无限潜能。\n依次填入画横线部分最恰当的一项是：","options":{"A":"毋庸置疑 显示","B":"名副其实 映照","C":"当之无愧 折射","D":"理所当然 展示"},"answer":"B","explanation":"本题所给选项较为接近，需对比择优。第一空，根据“目前，我国快递业务已经达到了前所未有的新高度，业务量已突破1000亿件大关”与“快递物流是经济活力······的‘风向标’”可知，横线处应体现快递物流作为经济活力的“风向标”这个名称与实际是相符的。B项“名副其实”指名称或名声与实际相符合，符合文意，保留。A项“毋庸置疑”指无须怀疑，侧重强调确定性，D项“理所当然”指从道理上讲应该这样，侧重强调合理性，C项“当之无愧”指完全当得起，没有惭愧和不足的地方，多用于积极的语境，而“风向标”能够反映事物发展的趋势与方向，感情色彩为中性，且文段中“业务量已突破1000亿件大关”仅为客观事实的陈述，侧重于客观和名称相符合，故三项均不符合文意，均排除。\n第二空，代入验证。根据“更彰显了我国经济的繁荣活力与无限潜能”可知，快递行业的业务量能够体现出行业的蓬勃发展。B项“映照”指照射，能形象地表达出快递物流映射出行业的蓬勃跃升，当选。\n故正确答案为B。\n【文段出处】红网《快递业务突破千亿件：“小包裹”跑出“大经济”》","no":46,"missingImage":false},{"qid":"13319289","cat":"逻辑填空","stem":"中华法系形成于秦朝，至隋唐日趋成熟，宋元明清时期        形成了影响深远的成文法典，在历史发展中        而成的中华法系彰显了中华优秀传统法律文化自我发展、回应挑战的主体性与生命力，也反映了中华文明            的延续性。\n依次填入画横线部分最恰当的一项是：","options":{"A":"陆续 积淀 源远流长","B":"相继 淬炼 一脉相承","C":"渐次 聚集 薪火相传","D":"稳步 嬗变 生生不息"},"answer":"B","explanation":"第一空，根据“中华法系形成于秦朝······形成了影响深远的成文法典”“延续性”可知，横线处所填词语应体现时间的连续性。A项“陆续”表示前后相继，时断时续，B项“相继”指一个跟着一个，连续不断，C项“渐次”指逐步、渐渐，均符合文意，保留。D项“稳步”比喻有把握地按一定步骤进行，与文意不符，排除。\n第二空，根据文意可知，横线处所填词语应体现中华法系不断完善的形成过程。A项“积淀”指积累沉淀，B项“淬炼”指反复经受考验，磨炼，均符合文意，保留。C项“聚集”指集合、凑在一起，多指不同空间的事物聚合在一块儿，无法体现前文所述的不断完善的过程，与文意不符，排除。\n第三空，根据“中华法系形成于秦朝······形成了影响深远的成文法典”“中华法系彰显了中华优秀传统法律文化自我发展······的延续性”可知，横线处所填成语应体现连贯性，连续性。B项“一脉相承”指从同一个血统或派别世代承接流传下来，符合文意，当选。A项“源远流长”比喻历史悠久，根底深厚，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明日报《从优秀传统法律文化看中华文明的突出特性》","no":47,"missingImage":false},{"qid":"12100973","cat":"逻辑填空","stem":"人工智能浪潮来袭，新一轮科技革命和产业变革正在深刻改变着人们的生产生活        ，也带来发展新机遇。新能源汽车产业潜力巨大，近年来中国汽车产业“换道超车”步伐提速。如新能源汽车产业发展        人工智能技术，将给交通出行        无限可能。\n依次填入画横线部分最恰当的一项是：","options":{"A":"态度 引入 带来","B":"观念 融合 给予","C":"形态 采用 创造","D":"方式 叠加 注入"},"answer":"D","explanation":"第一空，根据“人工智能浪潮来袭，新一轮科技革命和产业变革正在深刻改变着人们的生产生活······”及“将给交通出行······无限可能”可知，横线处所填词语应体现科技革命和产业变革正改变着人们的生产生活模式。C项“形态”指事物的形式与状态，D项“方式”指说话做事所采取的方法和形式，均符合文意，保留。A项“态度”指人的举止神情或对于事情的看法和采取的行动，B项“观念”指客观事物在人脑里留下的概括的形象，均侧重强调想法层面，文段论述的是科技革命和产业变革正改变着人们的生产生活模式，并非想法层面，排除。\n第二空，根据“人工智能浪潮来袭”及“新能源汽车产业潜力巨大”可知，人工智能技术在不断升级，新能源汽车产业也在快速壮大，故横线处所填词语应体现两个主体共同发展、发挥作用。D项“叠加”指重叠增加，可体现双方都在迅猛发展，共同助力交通出行，符合文意，保留。C项“采用”指认为合适而使用，仅能体现新能源汽车产业使用了人工智能技术，无法体现人工智能技术与新能源汽车产业共同发挥作用，排除。\n第三空，代入验证。D项“注入”指泵入、灌入或流入，置于此处可以体现新能源汽车产业和人工智能技术两者结合给交通出行带来积极作用，符合文意，当选。\n故正确答案为D。\n【文段出处】光明网《看，未来交通这个样》","no":48,"missingImage":false},{"qid":"13319294","cat":"逻辑填空","stem":"中国探月20年，拉近了            与普通公众生活的距离。当一粒棉花种子在月球上生根发芽，当月球车玉兔微博下满是网友的祝福，当中小学教材换上了崭新的中国月面图······越来越多的人与探月工程的某项成果、某个侧面            ，一个共识在人们心中不断        ：我们离月球并不遥远！\n依次填入画横线部分最恰当的一项是：","options":{"A":"碧海青天 邂逅相逢 汇集","B":"浩瀚苍穹 心心相印 回响","C":"星辰大海 不期而遇 凝聚","D":"蟾宫折桂 情投意合 激荡"},"answer":"C","explanation":"第一空，根据后文可知，中国探月20年拉近
