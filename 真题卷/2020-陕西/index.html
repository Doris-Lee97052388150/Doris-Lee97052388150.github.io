老年人降低血压和胆固醇","D":"核桃还对糖尿病人的血糖控制有一定的帮助"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：多吃核桃对人类心脏有好处。\n论据：最近有研究证实，多吃核桃的确有益肠道健康，可增加大量的有益肠道细菌。\n提问中问到“前提”，且论点和论据话题不一致，论点说的是“心脏”，论据说的是“肠道细菌”，考虑在两者之间搭桥进行加强。\n第二步：逐一分析选项。\nA项：充满益生菌的肠道可长时间地保护人类心脏健康，在“有益肠道细菌”和“心脏健康”之间建立了联系，属于搭桥，可以加强，当选；\nB项：肠道益生菌降低患高血压风险，高血压与论点中的“对人类心脏有好处”没有关系，话题不一致，无法加强，排除；\nC项：食用核桃降低血压和胆固醇，高血压、胆固醇与论点中的“对人类心脏有好处”没有关系，话题不一致，无法加强，排除；\nD项：核桃有利于控制糖尿病人血糖，血糖与论点中的“对人类心脏有好处”没有关系，话题不一致，无法加强，排除。\n故正确答案为A。","no":92,"missingImage":false},{"type":"question","qid":"2578124","cat":"逻辑判断","stem":"近年来，伴随着信息技术的发展和传播形态的演变，出现了一种“深度造假”新现象，这一现象是指经过处理的视频，或者通过人工智能技术生成的其他数字内容，它们会产生看似真实的虚假图像和声音。2019年初，某国际知名人工智能杂志的一篇文章提到：人工智能基金会筹集了1000万美元，开发了一套系统工具，能够通过人工审核或机器学习来识别诸如深度造假之类的欺骗性恶意内容。这篇文章还介绍了一家总部位于荷兰的科技初创公司努力将对抗性机器学习“作为探测深度造假的主要工具”。\n由此可以推出：","options":{"A":"“深度造假”的技术往往是领先于最新的检测技术的","B":"我们依靠技术进步才能解决“深度造假”带来的挑战","C":"人类无法像人工智能那样能识别出“深度造假”现象","D":"强大的人工智能技术可以用来检测虚假或欺骗性内容"},"answer":"D","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干中指出“开发了一套系统工具，能够通过人工审核或机器学习来识别诸如深度造假之类的欺骗性恶意内容”，选项中是“深度造假”的技术领先于最新的检测技术，题干中并未对“深度造假”技术和检测技术进行比较，无法判断谁更领先，无法推出，排除；\nB项：题干中指出开发的工具可以识别和探测深度造假，只是说明针对“深度造假”现象，技术进步可以解决，但没有提及我们是否只能依靠技术进步才能解决“深度造假”现象，逻辑错误，排除；\nC项：题干中指出“开发了一套系统工具，能够通过人工审核或机器学习来识别诸如深度造假之类的欺骗性恶意内容”，选项中是人类无法像人工智能那样能识别出“深度造假”现象，题干中并未对人类和人工智能的识别水平进行比较，无法推出，排除；\nD项：根据最后一句可知，机器学习可作为识别和探测深度造假的主要工具，机器学习属于人工智能技术，可以推出人工智能技术能用来检测虚假或欺骗性内容，该项属于最后一句的同义替换，可以推出，当选。\n故正确答案为D。","no":93,"missingImage":false},{"type":"question","qid":"2578130","cat":"逻辑判断","stem":"2006年，国际天文学联合会(IAU)对太阳系大行星进行了重新定义，结果导致冥王星被排除出太阳系“九大行星”。最近有天文学家指出，由于冥王星运行在太阳系中天体密集的一个特殊区域——柯伊伯带，并且被证明是太阳系中第二复杂、最有趣、比火星更具活力的一颗天体，因此冥王星就是太阳系的第九大行星。\n以下各项如果为真，最能质疑上述天文学家结论的是:","options":{"A":"冥王星位于太阳系的外圈，非常黯淡，其个头甚至比月球还要小","B":"冥王星轨道周边还有其他天体，就连其卫星都有它自身一半大小","C":"太阳系其他八大行星围绕太阳运行的轨道基本都在同一个平面上","D":"太阳系大行星必须有的特点之一是清理了轨道周边的其他天体"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：冥王星就是太阳系的第九大行星。\n论据：由于冥王星运行在太阳系中天体密集的一个特殊区域——柯伊伯带，并且被证明是太阳系中第二复杂、最有趣、比火星更具活力的一颗天体。\n论点讨论的是“冥王星”与“第九大行星”的关系，论据讨论的是“冥王星”与“天体密集区域”的关系，二者话题不一致，削弱优先考虑拆桥。\n第二步：逐一分析选项。\nA项：论点说的是冥王星是太阳系的第九大行星，该项说的是冥王星个头的大小，无法削弱，排除；\nB项：论点说的是冥王星是太阳系的第九大行星，该项说的是冥王星周围卫星大小的情况，话题不一致，无法削弱，排除；\nC项：论点说的是冥王星是太阳系的第九大行星，该项说的是太阳系其他八大行星的运行情况，话题不一致，无法削弱，排除；\nD项：该项指出太阳系大行星必须有的特点之一是清理了轨道周边的其他天体，但论据中指出冥王星运行在太阳系中天体密集的一个特殊区域，说明冥王星没有清理轨道周边的其他天体，不能满足太阳系大行星的必须特点，所以冥王星不能算作太阳系的第九大行星，切断了论据和论点之间的关系，拆桥项，可以削弱，当选。\n故正确答案为D。","no":94,"missingImage":false},{"type":"question","qid":"2578149","cat":"逻辑判断","stem":"国外某公司从农户手中收购伪步行虫和蟋蟀等昆虫，把它们加工成粉末或油，再与其它食材混合，制成让人吃不出昆虫味道的美味食品。2019年该公司销售这种食品已实现百万美元盈利。联合国粮农组织肯定这家公司的做法，并指出食用昆虫，有利于应对世界性粮食供应紧缺和营养不良的问题。\n上述论证若要成立，必须增加的前提是：","options":{"A":"世界粮食供应紧张状况还将持续，开发昆虫等新食材，可有效应对食物需求增长","B":"昆虫富含蛋白质、脂肪、补足维生素和铁的营养成分，是量大低成本的补充食材","C":"国外某权威研究机构称，在本世纪，食用昆虫有利于人口增长和蛋白质消费增加","D":"亚洲、非洲一些缺粮且人口营养不良的地区在大力发展昆虫养殖加工业"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：食用昆虫，有利于应对世界性粮食供应紧缺和营养不良的问题。\n论据：把昆虫加工成粉末或油，再与其它食材混合，制成美味食品，销售这种食品已经实现百万美元盈利。\n本题的论点和论据都围绕食用昆虫展开，论点和论据话题一致，提问为“前提”，优先考虑必要条件。\n第二步：逐一分析选项。\nA项：昆虫等新食材可以有效应对食物需求增长，说的是昆虫可以应对食物需求增长，是论证成立的前提，但没有涉及补充营养，比较片面，排除；\nB项：如果昆虫营养价值不高，那么就无法应对营养不良问题，如果昆虫没有量大价低的优势，那么就无法应对世界性粮食供应紧缺问题，选项是论点成立的必要条件，是论证成立的前提，并且两个方面都有涉及，比A项更好，当选；\nC项：国外某研究机构的观点主要指出本世纪食用昆虫有相关好处，但并不明确食用昆虫是否能应对世界性粮食供应紧缺等问题，不是论证成立的前提，排除；\nD项：亚洲、非洲部分地区正在发展昆虫养殖加工业，但并不明确发展昆虫养殖加工业是否能应对世界性粮食供应紧缺等问题，不是论证成立的前提，排除。\n故正确答案为B。","no":95,"missingImage":false},{"type":"question","qid":"2578163","cat":"逻辑判断","stem":"最新研究显示，常喝绿茶有益心血管。研究者对十万余名参与者进行了为期七年的跟踪研究。参与者被分成两组：有喝绿茶习惯者（即每周喝绿茶三次以上的人）和没有喝绿茶习惯者（即从不或每周喝绿茶次数不到三次的人）。研究者发现，与没有喝绿茶习惯者相比，有喝绿茶习惯者患心脏病和中风的风险低\u003cimg data-k=\"798f1f286d1f\">，死于心脏病和中风的风险低\u003cimg data-k=\"00d81ae5f0a8\">。\n以下各项如果为真，最能支持上述结论的是：","options":{"A":"与常喝绿茶的人相比，从不吸烟者患心脏病和中风的风险低\u003cimg data-k=\"74618a307709\">","B":"绿茶中含有的黄酮醇类，具有预防血液凝块及血小板成团的作用","C":"绿茶中的儿茶素和多种维他命成分，可有效延缓衰老、预防癌症","D":"习惯喝绿茶组的参与者其年龄普遍大于无喝绿茶习惯组的参与者"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：常喝绿茶有益心血管。\n论据：研究者对十万余名参与者进行了为期七年的跟踪研究。参与者被分成两组：有喝绿茶习惯者（即每周喝绿茶三次以上的人）和没有喝绿茶习惯者（即从不或每周喝绿茶次数不到三次的人）。研究者发现，与没有喝绿茶习惯者相比，有喝绿茶习惯者患心脏病和中风的风险低\u003cimg data-k=\"798f1f286d1f\">，死于心脏病和中风的风险低\u003cimg data-k=\"00d81ae5f0a8\">。\n本题论点说的是常喝绿茶有益心血管，论据是对比有喝绿茶习惯者和没有喝绿茶习惯者患心脏病和中风的风险及死于心脏病和中风的风险的数据结果。二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：论点说的是常喝绿茶有益心血管，对比的是常喝绿茶和不常喝绿茶，该项是常喝绿茶的人与从不吸烟者相比，话题不一致，无法加强，排除；\nB项：该项说的是绿茶中的黄酮醇类，具有预防血液凝块及血小板成团的作用，而中风等心血管疾病常见的原因之一是血液凝固成团，解释了为什么常喝绿茶有益心血管，补充论据，当选；\nC项：绿茶中的儿茶素和多种维他命成分，可有效延缓衰老、预防癌症，并没有说明绿茶中的儿茶素和多种维他命成分对心血管的益处，话题不一致，无法加强，排除；\nD项：习惯喝绿茶组的参与者其年龄普遍大于无喝绿茶习惯组的参与者，无法确定中风和心脏病的患病和死亡风险与年龄之间的关系，也无法确定两组参与者之间的具体年龄差距，属于不明确选项，无法加强，排除。\n故正确答案为B。","no":96,"missingImage":false},{"type":"question","qid":"2578169","cat":"逻辑判断","stem":"科研人员发现，鸟蛋颜色与温度有极大关联。研究结果显示，在日照强度较低的地方，深色鸟蛋更常见；而在阳光强度更高、更暖和的区域，鸟蛋颜色普遍更浅。研究小组认为，更深颜色的壳意味着可以吸收更多热量，从而在更寒冷的环境中具有生存优势。因为蛋中胚胎需要稳定的环境温度，但其自身却不具备温度调节能力。\n以下各项如果为真，最能支持上述结论的是：","options":{"A":"将不同品种的鸡蛋放置在阳光中，颜色更深的鸡蛋比浅色鸡蛋升温更快，而且其蛋壳表面保持较高温度的时间更长","B":"大杜鹃将自己生的蛋寄宿在一百多种鸟的巢中，为了避免蛋被鸟巢主人赶跑，它们能够高仿出二十多种色型的鸟蛋","C":"要孵化出小鸟，适宜的温度十分重要，所以为了保证小鸟能顺利破壳，鸟妈妈只能待在窝里孵蛋，来提高蛋的温度","D":"蛇、乌龟的蛋大多埋在地下，有隐蔽性，所以是白色的，而鸟蛋暴露在环境中，则需要斑纹和颜色做障眼法迷惑天敌"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：更深颜色的壳意味着可以吸收更多热量，从而在更寒冷的环境中具有生存优势。\n论据：研究结果显示，在日照强度较低的地方，深色鸟蛋更常见；而在阳光强度更高、更暖和的区域，鸟蛋颜色普遍更浅。蛋中胚胎需要稳定的环境温度，但其自身却不具备温度调节能力。\n本题的论点是蛋壳颜色与温度的关系，论据是在日照强度较低的地方深色鸟蛋更多，且蛋的胚胎不具备温度调节的能力，二者话题一致，优先考虑补充论据的方式加强，即举例子或解释原因。\n第二步：逐一分析选项。\nA项：举出鸡蛋在阳光中的例子，说明颜色更深的蛋壳可以吸收更多热量，举例加强，当选；\nB项：该项说的是大杜鹃鸟为了避免蛋被鸟巢主人赶跑而高仿出二十多种颜色的鸟蛋，但是没有说明鸟蛋颜色的深浅与温度之间的关系，属于无关项，无法加强，排除；\nC项：该项说的是为了保证小鸟顺利破壳，鸟妈妈只能待在窝里孵蛋，没有提及鸟蛋的颜色，属于无关项，无法加强，排除；\nD项：该项说的是鸟蛋需要颜色做障眼法迷惑天敌，但是没有说明鸟蛋颜色的深浅与温度之间的关系，属于无关项，无法加强，排除。\n故正确答案为A。","no":97,"missingImage":false},{"type":"question","qid":"2578144","cat":"逻辑判断","stem":"磷存在于我们的DNA中，是构成生命的基本元素之一，但它早期是如何到达地球的仍是一个谜。近日，科学家通过观测恒星形成区域，追踪到了含磷分子从宇宙到达地球的“旅程”。观测结果表明，含磷分子是在大质量恒星形成时产生的，刚形成的恒星会释放气流，在星际云中打造出一条通道。随着恒星震动和释放辐射，含磷分子在这些通道壁上沉积并产生大量一氧化磷粒子，这些粒子逐渐汇聚、融合，从一块小石头变成了彗星，而这些彗星，就成为了生命的“信使”，携带着生命分子来到了地球。\n以下各项如果为真，最能质疑上述结论的是：","options":{"A":"科学家已经在陨石中找到了证据，研究发现为数不多的一些陨石携带有包含了一氧化二磷等含磷分子的有机物","B":"彗星撞击地球表面时，可产生36万个大气压，温度可达\u003cimg data-k=\"46aff7d6d97a\">，会引发彗星晶体中的磷元素发生未知化学变化","C":"早期的彗星撞击事件为地球带来每年10万亿千克的有机物质，它们进入地球环境后开启了地球生命的演化历程","D":"仅仅是拥有DNA的所需物质是远远不够的，只有上千万甚至是上亿万分之一的概率才能满足生命形成所需的条件"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：磷如何到达地球？含磷分子是在大质量恒星形成时产生的，刚形成的恒星会释放气流，在星际云中打造出一条通道。随着恒星震动和释放辐射，含磷分子在这些通道壁上沉积并产生大量一氧化磷粒子，这些粒子逐渐汇聚、融合，从一块小石头变成了彗星，而这些彗星，就成为了生命的“信使”，携带着生命分子来到了地球。\n论据：无。\n本题只有论点，没有论据，优先考虑否论点。\n第二步：逐一分析选项。\nA项：该项讨论的是陨石携带包含了一氧化二磷等含磷分子的有机物，题干讨论的是彗星携带一氧化磷粒子，讨论主体不一致，不能削弱，排除；\nB项：该项表明彗星携带的磷元素在撞击地球表面时，会发生未知的化学变化，那么磷可能到达不了地球，无法成为构成生命的基本元素之一，可以削弱，当选；\nC项：该项表明彗星撞击事件为地球带来了很多有机物质，开启了地球生命的演化历程，肯定了彗星携带着生命分子来到了地球，可以加强，排除；\nD项：该项讨论的是生命形成所需的条件，与磷如何到达地球无关，无关项，排除。\n故正确答案为B。","no":98,"missingImage":false},{"type":"question","qid":"2578141","cat":"逻辑判断","stem":"人体在\u003cimg data-k=\"876b58b75271\">左右的时候，能够使用最小的动力来维持身体需求的平衡。也就是说，人类在\u003cimg data-k=\"876b58b75271\">时通过获取少量的能量，就能达到最大的行动力。因此，一个多世纪以来，\u003cimg data-k=\"876b58b75271\">一直被当作人类健康的体温标准。然而日前一项研究却揭示，在过去的一个世纪，正常状态下人类的体温越来越低了，约每10年下降\u003cimg data-k=\"e8586fd4837d\">。\n以下各项如果为真，最不能支持上述结论的是：","options":{"A":"温度计制造技术的逐步发展使得测量数据变得越来越精细","B":"现代生活方式降低了人类劳动强度，导致新陈代谢率下降","C":"现代医学的进步降低了人类患病频次，炎症反应逐渐减少","D":"温室效应引发全球气温上升，也使人类自降体温对抗炎热"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：在过去的一个世纪，正常状态下人类的体温越来越低了，约每10年下降\u003cimg data-k=\"e8586fd4837d\">。\n论据：无。\n本题只有论点，没有论据，加强方式考虑补充论据，即解释为什么正常状态下的人类体温越来越低或者举例证明正常状态下的人类体温越来越低。\n第二步：逐一分析选项。\nA项：该选项说的是温度计的测量数据变得越来越精细，但是温度计的数据对人类的体温不会产生影响，属于无关项，无法加强，当选；\nB项：该选项说的是人类劳动强度下降，新陈代谢率下降，而新陈代谢率下降会对体温产生影响，解释了为什么正常状态下的人类体温越来越低，补充论据，排除；\nC项：该选项说的是人类患病频次降低，炎症反应减少，炎症会导致体温上升，炎症的减少就可以解释为什么正常状态下的人类体温越来越低，补充论据，排除；\nD项：该选项说的是温室效应引发的全球气温上升，使人类体温降低对抗炎热，解释了为什么正常状态下的人类体温越来越低，补充论据，排除。\n本题为选非题，故正确答案为A。\n备注：【题目来源】http://www.xinhuanet.com/science/2020-01/21/c_138722473.ht\n《生活方式进步，炎症反应减少 人类因此越来越“冷”》\n\u003cimg data-k=\"3b61da0468a8\" style=\"max-width:579px\">\n\u003cimg data-k=\"d2692015183c\" style=\"max-width:558px\">","no":99,"missingImage":false},{"type":"question","qid":"2578148","cat":"类比推理","stem":"小严在商场看中一款鞋子，纠结是买黑色好还是买白色好。同行的好朋友小芳说：你去问下柜员，是黑色的销量高，还是白色的销量高，不就知道了吗？\n以下选项与题干中的问答方式最为相似的是：","options":{"A":"准备考研的小张在A培训班和B培训班之间犹豫不决，室友小王说：你去问问已经考上了研究生的学长学姐们，看看他们报的是A还是B，不就知道了吗","B":"老郑打算给乔迁新居的战友老袁买一件礼物，在书法字画和艺术盆景之间有点为难，老伴说：你去花店打听下，乔迁送艺术盆景的人多不多，不就知道了吗","C":"小莫和男友去网红美食街探寻美食，面对众多从未吃过的各地特色美食不知如何取舍，男友说：我们看看哪家店门口的队伍排得最长，就去吃哪家的吧","D":"七夕节到了，小汪准备给女朋友送一支口红，不知道女朋友是喜欢001色号还是006色号，同事小林建议说：你上网查下哪个色号最热门，就选哪个呗"},"answer":"D","explanation":"第一步：分析题干问答方式。\n小严在买黑色鞋还是白色鞋之间犹豫，而小芳建议询问柜员二者销量来进行选择，即建议是通过对比二者的销量来确定应该买什么。\n第二步：逐一分析选项。\nA项：准备考研的小张在报A班还是报B班之间犹豫，室友小王建议询问考上研究生的学长学姐们如何选择，即建议是通过别人报了什么来进行选择，而没有通过对比二者报名数量的多少来进行选择，与题干问答形式不一致，排除；\nB项：老郑在买书法字画和艺术盆景之间犹豫，他老伴的建议是询问花店乔迁送艺术盆景的人多不多，建议的方式只是看艺术盆景的销量，而没有对比艺术盆景和书法字画的销量，与题干问答方式不一致，排除；\nC项：小莫面对众多从未吃过的美食不知如何取舍，这是在众多美食中进行取舍，而不是二选一，与题干问答形式不一致，排除；\nD项：小汪在买001色号和006色号之间犹豫，同事小林建议查找二者谁更热门来进行选择，即建议是通过对比二者的销量来确定应该买什么，与题干问答形式一致，当选。\n故正确答案为D。","no":100,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2019年全国房地产开发投资132194亿元，比上年增长\u003cimg data-k=\"5a48b637e8e6\">，增速比上年加快0.4个百分点。其中，住宅投资97071亿元，增长\u003cimg data-k=\"a29616dad5f5\">，增速比上年加快0.5个百分点。2019年，全国商品房销售面积171558万平方米，比上年下降\u003cimg data-k=\"c6f98ff2683d\">。其中，住宅销售面积增长\u003cimg data-k=\"cc3d5e510397\">，办公楼销售面积下降\u003cimg data-k=\"06e6f0ff1afe\">，商业营业用房销售面积下降\u003cimg data-k=\"21c4bf00689b\">。商品房销售额159725亿元，增长\u003cimg data-k=\"2adb37f2d71c\">，增速比上年回落5.7个百分点。其中，住宅销售额增长\u003cimg data-k=\"55a3117507e3\">，办公楼销售额下降\u003cimg data-k=\"43c59195d293\">，商业营业用房销售额下降\u003cimg data-k=\"55a008c01d18\">。\u003c/p>\u003cp>\u003cimg data-k=\"f67dcb9a3514\" style=\"max-width:700px\">\u003c/p>\u003cp>\u003cimg data-k=\"5c09fc501147\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"2578242","cat":"增长","stem":"2018年全国房地产开发投资比上年增长：","options":{"A":"\u003cimg data-k=\"fb0d03006499\">","B":"\u003cimg data-k=\"17a98a3a09dd\">","C":"\u003cimg data-k=\"f4da28a03560\">","D":"\u003cimg data-k=\"795f8d51863f\">"},"answer":"D","explanation":"根据题干“2018年全国房地产开发投资比上年增长”，结合选项为百分数，可判定本题为一般增长率问题。定位文字材料“2019年全国房地产开发投资······，比上年增长\u003cimg data-k=\"5a48b637e8e6\">，增速比上年加快0.4个百分点”，可得2018年全国房地产开发投资的增长率\u003cimg data-k=\"7dca4aee0e9a\">。\n故正确答案为D。","no":101,"missingImage":false},{"qid":"2578246","cat":"增长","stem":"2019年全国房地产开发投资增长最快的地区是：","options":{"A":"东部地区","B":"中部地区","C":"西部地区","D":"东北地区"},"answer":"C","explanation":"定位表一可知，2019年各地区房地产开发投资额的增长率分别为：东部地区\u003cimg data-k=\"3b61bc974f56\">；中部地区\u003cimg data-k=\"a4224048dc85\">；西部地区\u003cimg data-k=\"f85b1dc323bd\">；东北地区\u003cimg data-k=\"a6902d99f4b2\">，则2019年全国房地产开发投资增长最快的地区是西部地区。\n故正确答案为C。","no":102,"missingImage":false},{"qid":"2578488","cat":"比重","stem":"2019年全国住宅投资在房地产开发投资中的比重约为：","options":{"A":"\u003cimg data-k=\"1d9abc9f9689\">","B":"\u003cimg data-k=\"0d871ce3be36\">","C":"\u003cimg data-k=\"1a67739c8245\">","D":"\u003cimg data-k=\"e5a54cf7e850\">"},"answer":"A","explanation":"根据题干“2019年······在······中的比重约为”且材料时间为2019年，可判定此题为现期比重问题。定位文字材料“2019年全国房地产开发投资132194亿元······住宅投资97071亿元”，根据公式：比重\u003cimg data-k=\"32bbe9558060\">，则2019年全国住宅投资在房地产开发投资中的比重\u003cimg data-k=\"42b30f3e7a4d\">\u003cimg data-k=\"ac401df05fda\">，首位商7，与A项最接近。\n故正确答案为A。","no":103,"missingImage":false},{"qid":"2578489","cat":"增长","stem":"2019年全国商品房销售面积同比下降幅度最大的地区是：","options":{"A":"东部地区","B":"中部地区","C":"西部地区","D":"东北地区"},"answer":"D","explanation":"定位表二，可知2019年东部地区商品房销售面积同比下降\u003cimg data-k=\"7d0253d7c3db\">，中部地区商品房销售面积同比下降\u003cimg data-k=\"777eec6bd763\">，西部地区商品房销售面积同比上升\u003cimg data-k=\"5921c867c7c3\">，东北地区商品房销售面积同比下降\u003cimg data-k=\"ecd9a812c637\">。西部地区商品房销售面积同比上升，可排除；其余三个地区商品房销售面积同比下降幅度最大的是东北地区。\n故正确答案为D。","no":104,"missingImage":false},{"qid":"2578507","cat":"综合","stem":"根据上述材料可以推出：","options":{"A":"与上一年相比，2019年全国住宅投资和住宅销售面积均有增长","B":"与上一年相比，2019年全国商品房销售面积和销售额均有下降","C":"与上一年相比，2019年全国住宅销售额和办公楼销售额均有增长","D":"与上一年相比，2019年东北地区商品房销售面积和销售额均有下降"},"answer":"A","explanation":"A项：定位文字材料“2019年全国房地产······住宅投资······增长\u003cimg data-k=\"a29616dad5f5\">······住宅销售面积增长\u003cimg data-k=\"7d0253d7c3db\">”，可知与上一年相比，2019年全国住宅投资和住宅销售面积均有增长，正确；\nB项：定位文字材料“2019年，全国商品房销售面积······比上年下降\u003cimg data-k=\"c6f98ff2683d\">，······商品房销售额······增长\u003cimg data-k=\"04d0fb8081ca\">”，可知与上一年相比，2019年全国商品房销售面积下降，销售额上升，错误；\nC项：定位文字材料“2019年······住宅销售额增长\u003cimg data-k=\"55a3117507e3\">，办公楼销售额下降\u003cimg data-k=\"43c59195d293\">”，可知与上一年相比，全国住宅销售额上升，办公楼销售额下降，错误；\nD项：定位表二，可知2019年东北地区商品房销售面积增长率为\u003cimg data-k=\"80d2c93cbab7\">，销售额增长率为\u003cimg data-k=\"132684824956\">，可知与上一年相比，东北地区商品房销售面积下降，销售额上升，错误。\n故正确答案为A。","no":105,"missingImage":false}]},{"type":"material","material":"\u003cp>\u003cimg data-k=\"66ff3687ae7e\" style=\"max-width:562px\">\u003c/p>\u003cp>\u003cimg data-k=\"877a1b01b49c\" style=\"max-width:593px\">\u003c/p>","questions":[{"qid":"2578512","cat":"综合","stem":"与上个月相比较，2月份职工人数变动幅度最大的是：","options":{"A":"甲车间","B":"乙车间","C":"丙车间","D":"丁车间"},"answer":"A","explanation":"根据题干“······变动幅度最大的是”，可判定本题为一般增长率问题。定位表一，可得甲、乙、丙、丁4个车间1月份的职工人数分别为500、600、300、200，2月份的职工人数分别为550、580、320、200。变动幅度比较大小，比较增长率的绝对值即可。根据增长率=\u003cimg data-k=\"cd497a757361\">，可得甲、乙、丙、丁4个车间职工人数的环比增速分别为\u003cimg data-k=\"09073515300b\">，\u003cimg data-k=\"c9f04de9ac76\">，\u003cimg data-k=\"24b272faff8a\">，\u003cimg data-k=\"e3f4892b38e6\">，甲车间职工人数的变动幅度最大。\n故正确答案为A。","no":106,"missingImage":false},{"qid":"2578513","cat":"平均数","stem":"与上个月相比较，2月份平均工资增长速度最快的车间是：","options":{"A":"甲车间","B":"乙车间","C":"丙车间","D":"丁车间"},"answer":"C","explanation":"根据题干“······增长速度最快的车间是”，可判定本题为一般增长率问题。定位表一，可得甲、乙、丙、丁4个车间1月份的平均工资分别为5000、4500、6000、8000，甲、乙、丙、丁4个车间2月份的平均工资分别为5200、4600、6500、7950。根据增长率=\u003cimg data-k=\"cd497a757361\">，可得甲、乙、丙、丁4个车间的环比增速分别为\u003cimg data-k=\"f93fe1fb4ff2\">\u003cimg data-k=\"923c9f330bd3\">，\u003cimg data-k=\"444abd53935e\">\u003cimg data-k=\"4061aa8f542c\">，\u003cimg data-k=\"77fd5db4439e\">\u003cimg data-k=\"af5b1b6512ba\">，\u003cimg data-k=\"09adcb8a552e\">\u003cimg data-k=\"936c05a65091\">，丙车间增长速度最快。\n故正确答案为C。","no":107,"missingImage":false},{"qid":"2578475","cat":"综合","stem":"对C集团公司1-2月份的产值贡献率最大的是：","options":{"A":"甲车间","B":"乙车间","C":"丙车间","D":"丁车间"},"answer":"B","explanation":"根据题干“对C集团公司1-2月份的产值贡献率最大的是”，因\u003cimg data-k=\"523a8b3608d0\">，可判定本 /* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'

    var b=e.target.closest("[data-x]"); if(!b)return;

}

  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
