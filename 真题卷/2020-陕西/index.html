<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2020年陕西省公务员考试《行测》试题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>

      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>

</div>

<div class="mask" id="mask">

</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2020-陕西","title":"2020年陕西省公务员考试《行测》试题（网友回忆版）","year":"2020","group":"陕西","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2578702","cat":"时事政治","stem":"2020年《政府工作报告》提出，2019年“三大攻坚战取得关键进展”。下列不属于“关键进展”内容的是","options":{"A":"脱贫攻坚取得决定性成就","B":"生态环境总体改善","C":"金融运行总体平稳","D":"外贸外资保持稳定"},"answer":"D","explanation":"本题考查政治常识。\nA、B、C三项正确，2020年5月22日，国务院总理李克强在第十三届全国人民代表大会第三次会议上作政府工作报告。李克强在报告中提出：“三大攻坚战取得关键进展。农村贫困人口减少1109万，贫困发生率降至\u003cimg data-k=\"8e91150a03d7\">，脱贫攻坚取得决定性成就。污染防治持续推进，主要污染物排放量继续下降，生态环境总体改善。金融运行总体平稳。”\nD项错误，外贸外资保持稳定不属于2019年“三大攻坚战”取得的“关键进展”。\n本题为选非题，故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"2577902","cat":"新思想","stem":"《中共中央关于坚持和完善中国特色社会主义制度推进国家治理体系和治理能力现代化若干重大问题的决定》提到“坚持和发展新时代‘枫桥经验’”。“枫桥经验”主要针对的是：","options":{"A":"完善正确处理新形势下人民内部矛盾有效机制","B":"健全有利于更充分更高质量就业的促进机制","C":"实行最严格的生态环境保护机制","D":"健全人民文化权益保障制度"},"answer":"A","explanation":"本题考查政治常识。\n1963年，毛泽东在浙江枫桥创造的“发动和依靠群众，坚持矛盾不上交，就地解决，实现捕人少，治安好”的经验材料上批示：“要各地仿效，经过试点，推广去做”。从此，“枫桥经验”成为全国政法战线的一面旗帜。\n2019年10月31日，中国共产党第十九届中央委员会第四次全体会议通过了《中共中央关于坚持和完善中国特色社会主义制度推进国家治理体系和治理能力现代化若干重大问题的决定》。《决定》提出：“完善正确处理新形势下人民内部矛盾有效机制。坚持和发展新时代‘枫桥经验’，畅通和规范群众诉求表达、利益协调、权益保障通道，完善信访制度，完善人民调解、行政调解、司法调解联动工作体系，健全社会心理服务体系和危机干预机制，完善社会矛盾纠纷多元预防调处化解综合机制，努力将矛盾化解在基层。”\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"2577912","cat":"马克思主义","stem":"习近平总书记在《辩证唯物主义是中国共产党人的世界观和方法论》一文中指出，“学习和运用唯物辩证法，就要反对形而上学的思想方法”。中国古代成语中，就有对形而上学思想的批判，下列成语中不属于对形而上学思想批判的是：","options":{"A":"盲人摸象、刻舟求剑","B":"缘木求鱼、邯郸学步","C":"坐井观天、水中捞月","D":"老骥伏枥、老马识途"},"answer":"D","explanation":"本题考查政治常识。\n形而上学是与辩证法相对立的世界观和方法论。其特点是用孤立、静止、片面观点来看世界。\nA项正确，盲人摸象，比喻对事物只凭片面的了解或局部的经验，就乱加猜测，想做出全面的判断，以偏概全，不能了解真相，是片面地看待事物。刻舟求剑，一般比喻死守教条，拘泥成法，固执不变通的人，忽视了运动是物质的根本属性。两个典故都属于对形而上学思想的批判。\nB项正确，缘木求鱼，比喻方向或办法不对头，不可能达到目的。邯郸学步，比喻一味地模仿别人，不仅没学到本事，反而把原来的本事也丢了。两个典故都体现了没有把握事物本质，片面地看问题，都属于对形而上学思想的批判。\nC项正确，坐井观天，比喻眼界小，见识少。水中捞月，比喻去做根本做不到的事情，只能白费力气。两个典故都体现了用片面的、孤立的观点看问题，都属于对形而上学思想的批判。\nD项错误，老骥伏枥，比喻有志向的人虽然年老，仍有雄心壮志，蕴含着自强不息的民族精神。老马识途，意思是指老马认识路，比喻有经验的人对事情比较熟悉。两个典故属于辩证法的观点，不属于对形而上学思想的批判。\n本题为选非题，故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"2578705","cat":"新思想","stem":"2020年3月6日，习近平总书记出席决战决胜脱贫攻坚座谈会，就确保高质量完成脱贫攻坚目标任务作出重大部署。关于高质量完成脱贫攻坚目标任务，下列说法错误的是：","options":{"A":"继续聚焦“三区三州”等深度贫困地区，落实脱贫攻坚方案","B":"接续推进全面脱贫与乡村振兴有效衔接","C":"做好对因疫致贫返贫人口的帮扶，及时落实好兜底保障等措施","D":"要重点解决全国易地扶贫搬迁中的贫困人口搬得出的问题"},"answer":"D","explanation":"本题考查政治常识。\n2020年3月6日，习近平出席决战决胜脱贫攻坚座谈会并发表重要讲话。\nA项正确，习近平在会上指出：“要继续聚焦‘三区三州’等深度贫困地区，落实脱贫攻坚方案，瞄准突出问题和薄弱环节狠抓政策落实。”\nB项正确，习近平在会上指出：“接续推进全面脱贫与乡村振兴有效衔接。”\nC项正确，习近平在会上指出：“要做好对因疫致贫返贫人口的帮扶，密切跟踪受疫情影响的贫困人口情况，及时落实好兜底保障等帮扶措施，确保他们基本生活不受影响。”\nD项错误，习近平指出：“全国易地扶贫搬迁960多万贫困人口，中西部地区还同步搬迁500万非贫困人口，相当于一个中等国家的人口规模。现在搬得出的问题基本解决了，下一步的重点是稳得住、有就业、逐步能致富。”全国易地扶贫搬迁中的贫困人口搬得出的问题基本解决了，所以脱贫攻坚目标任务中，重点不是“搬得出”，而是“稳得住、有就业、逐步能致富”。\n本题为选非题，故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"2578827","cat":"新思想","stem":"延安时期，中国共产党逐步形成了一个“稳定的成熟的领导集体”，这个领导集体成员包括：","options":{"A":"毛泽东、朱德、刘少奇、周恩来、邓小平","B":"毛泽东、朱德、刘少奇、周恩来、任弼时","C":"毛泽东、朱德、刘少奇、周恩来、陈云","D":"毛泽东、朱德、刘少奇、周恩来、彭德怀"},"answer":"B","explanation":"本题考查政治常识。\n从1935年10月到1948年3月，是中国共产党历史上的延安时期。延安时期，中国共产党之所以能够从胜利走向更大的胜利，一个主要的原因是逐步形成了成熟的、稳定的以毛泽东为核心的领导集体。朱德、刘少奇、周恩来、任弼时等领导人也多是在革命战争中锻炼出来的领袖人物，都是国内、党内最优秀、最有才华的人物，具有崇高的革命理想和坚定的政治方向，对党和人民的事业无限忠诚，能够把马克思主义普遍真理和中国革命实际相结合，实事求是，具有丰富的实践经验和卓越的领导才能。\nA项错误，1956年中共八届一中全会上，邓小平当选为中央政治局常委、中央委员会总书记，成为以毛泽东为核心的第一代中央领导集体的重要成员，经过革命和建设的长期历练，也成为了第二代中央领导集体的核心，领导党和人民开创改革开放的新时期。\nB项正确，1945年4月23日至6月11日，中共七大胜利召开，选出了毛泽东、朱德、刘少奇、周恩来、任弼时为领导集体的新的书记处，宣告了以毛泽东为核心的中共第一代中央领导集体正式形成。\nC项错误，1950年10月27日，陈云被补选为中央书记处书记。而且在1956年中共八大上，毛泽东、刘少奇、周恩来、朱德、陈云、邓小平被选为政治局常委，其中毛泽东为中共中央主席，刘少奇、周恩来、朱德、陈云为副主席，邓小平为总书记。陈云、邓小平此时成为了中共第一代中央领导集体的重要成员。\nD项错误，彭德怀同志在延安时期，曾经担任过中共中央军委委员、八路军副总指挥，并于1940年在华北组织发动百团大战，于1943年回延安参加整风运动后，被任命为中央军委副主席兼总参谋长，他是国内和国际著名的军事家和政治家，一直受到广大党员和群众的怀念和爱戴，但他并非是延安时期中国共产党的领导集体成员之一。\n故正确答案为B。","no":5,"missingImage":false}],"count":5,"answerable":5,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2578820","cat":"人文常识","stem":"20世纪50年代中期，交通大学部分教职员工响应党和国家号召，从上海迁至西安办学，支投祖国的大西北建设，形成了“西迁精神”,“西迁精神”的核心是：","options":{"A":"爱国主义","B":"科教报国","C":"自力更生，艰苦创业","D":"听党话，跟党走"},"answer":"A","explanation":"本题考查政治常识。\n2020年4月22日，习近平总书记在西安交通大学考察时指出：“‘西迁精神’的核心是爱国主义，精髓是听党指挥跟党走，与党和国家、与民族和人民同呼吸、共命运，具有深刻现实意义和历史意义。”\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"2578822","cat":"人文常识","stem":"在“一带一路”国家战略的推动下,中欧班列（长安号）线路发展迅速，该线路从西安出发，开行14个国家，44个城市，实现了欧亚区域全覆盖，目前最远到达：","options":{"A":"巴黎","B":"巴塞罗那","C":"罗马","D":"布鲁塞尔"},"answer":"B","explanation":"本题考查政治常识。\n2020年4月8日，75019次列车从中国铁路西安局集团有限公司新筑车站驶出，这是陕西省首次开行中欧班列（西安-巴塞罗那）。西安至巴塞罗那班列开行后，开行已达14国44个城市，开行线路15条，图定班列数量居全国前列。其中，巴塞罗那位于伊比利亚半岛东北部，濒临地中海，是西班牙第二大城市，它目前是中欧班列（长安号）最远到达的城市。\n故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"2577923","cat":"人文常识","stem":"2019年12月4日，中共中央、国务院印发《关于营造更好发展环境支持民营企业改革发展的意见》，充分肯定了我国民营经济的地位和作用，提出了有力举措，为民营企业未来发展指明了方向。下列与之相关的说法错误的是：","options":{"A":"要进一步放开民营企业市场准入和实施公平统一的市场监管制度，保障民营企业平等获得资源要素","B":"民营企业在推动发展、促进创新、增加就业、改善民生和扩大开放等方面发挥了不可替代的作用","C":"支持民营企业发行债券，降低可转债发行门槛","D":"对民营企业实行公平竞争审查制度的软性约束"},"answer":"D","explanation":"本题考查政治常识。\n2019年12月4日，中共中央、国务院印发《关于营造更好发展环境支持民营企业改革发展的意见》（以下简称《意见》）。\nA项正确，《意见》第二项，优化公平竞争的市场环境。（三）进一步放开民营企业市场准入······（四）实施公平统一的市场监管制度。深化要素市场化配置体制机制改革，健全市场化要素价格形成和传导机制，保障民营企业平等获得资源要素。\nB项正确，《意见》中指出，改革开放40多年来，民营企业在推动发展、促进创新、增加就业、改善民生和扩大开放等方面发挥了不可替代的作用。民营经济已经成为我国公有制为主体多种所有制经济共同发展的重要组成部分。\nC项正确，《意见》第三项，完善精准有效的政策环境。（九）完善民营企业直接融资支持制度。支持民营企业发行债券，降低可转债发行门槛。在依法合规的前提下，支持资管产品和保险资金通过投资私募股权基金等方式积极参与民营企业纾困。鼓励通过债务重组等方式合力化解股票质押风险。积极吸引社会力量参与民营企业债转股。\nD项错误，《意见》第二项，优化公平竞争的市场环境。（五）强化公平竞争审查制度刚性约束。坚持存量清理和增量审查并重，持续清理和废除妨碍统一市场和公平竞争的各种规定和做法等。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"2577930","cat":"法律常识","stem":"甲方将乙方诉至人民法院，要求乙方偿还借款期限为一年，且已到期的2万元借款以及借款利息。在诉讼中，甲方向法庭提交了借据作为乙方借款的证据。下列与之相关的说法正确的是：","options":{"A":"甲方除了提交借据外，还需要提交向乙方实际付款的凭证，才能证明甲、乙双方之间的借贷关系真实发生","B":"虽然借据上未约定利息，但是乙方仍应按照年利率\u003cimg data-k=\"363071dac4a0\">的标准向甲方支付借期内和逾期后的资金占用利息","C":"甲方提交借据足以证明甲、乙双方之间的借贷关系合法成立，乙方抗辩无效","D":"借据上没有约定利息，故乙方无须向甲方支付借期内利息"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，根据《最高人民法院关于审理民间借贷案件适用法律若干问题的规定(2020第二次修正)》第二条第一款规定：“出借人向人民法院提起民间借贷诉讼时，应当提供借据、收据、欠条等债权凭证以及其他能够证明借贷法律关系存在的证据。”甲方凭借借据提起诉讼，可以证明甲乙之间借贷法律关系存在。\nB项错误，根据《最高人民法院关于审理民间借贷案件适用法律若干问题的规定(2020第二次修正)》第二十八条规定：“借贷双方对逾期利率有约定的，从其约定，但是以不超过合同成立时一年期贷款市场报价利率四倍为限。未约定逾期利率或者约定不明的，人民法院可以区分不同情况处理：（一）既未约定借期内利率，也未约定逾期利率，出借人主张借款人自逾期还款之日起参照当时一年期贷款市场报价利率标准计算的利息承担逾期还款违约责任的，人民法院应予支持；（二）约定了借期内利率但是未约定逾期利率，出借人主张借款人自逾期还款之日起按照借期内利率支付资金占用期间利息的，人民法院应予支持。”因此，甲、乙双方之间借据上未约定利息，则视为不支付借款期间内的利息，但是甲可以主张乙自逾期还款之日起承担逾期还款违约责任。\nC项错误，根据《最高人民法院关于审理民间借贷案件适用法律若干问题的规定(2020第二次修正)》第十五条规定：“第十五条　原告仅依据借据、收据、欠条等债权凭证提起民间借贷诉讼，被告抗辩已经偿还借款的，被告应当对其主张提供证据证明。被告提供相应证据证明其主张后，原告仍应就借贷关系的存续承担举证责任。被告抗辩借贷行为尚未实际发生并能作出合理说明的，人民法院应当结合借贷金额、款项交付、当事人的经济能力、当地或者当事人之间的交易方式、交易习惯、当事人财产变动情况以及证人证言等事实和因素，综合判断查证借贷事实是否发生。”因此，在甲提供借据的情况下，乙仍然可以抗辩。\nD项正确，根据《民法典》第六百八十条规定：“禁止高利放贷，借款的利率不得违反国家有关规定。借款合同对支付利息没有约定的，视为没有利息。借款合同对支付利息约定不明确，当事人不能达成补充协议的，按照当地或者当事人的交易方式、交易习惯、市场利率等因素确定利息；自然人之间借款的，视为没有利息。”因此，借据上没有约定利息，乙方无需向甲方支付借期内利息。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"2578162","cat":"人文常识","stem":"二十八星宿对于古人来说，不仅与军事、农耕等有紧密关系，与文学关系也很密切，所以古代诗文中对于二十八星宿的引用很多。下列诗句中，没有涉及到二十八星宿的是：","options":{"A":"二十四桥仍在，波心荡，冷月无声","B":"人生不相见，动如参与商","C":"迢迢牵牛星，皎皎河汉女","D":"七月流火，九月授衣"},"answer":"A","explanation":"本题考查人文常识。\n二十八星宿，是中国古代天文学名词，由东方苍龙、南方朱雀、西方白虎、北方玄武各七宿组成。东方苍龙七宿：角宿，亢宿，氐宿，房宿，心宿，尾宿，箕宿；北方玄武七宿：斗宿，牛宿，女宿，虚宿，危宿，室宿，壁宿；西方白虎七宿：奎宿，娄宿，胃宿，昴宿，毕宿，觜宿，参宿；南方朱雀七宿：井宿，鬼宿，柳宿，星宿，张宿，翼宿，轸宿。\nA项错误，“二十四桥仍在，波心荡，冷月无声”出自姜夔的《扬州慢·淮左名都》。意思是二十四桥仍然还在，桥下江中的波浪浩荡，凄冷的月色，处处寂静无声。未涉及二十八星宿。\nB项正确，“人生不相见，动如参与商”出自杜甫的《赠卫八处士》。意思是世间上的挚友真难得相见，好比此起彼落的参星与商星这两个星宿。参星属西方白虎七宿。商星属东方苍龙七宿中的心宿。\nC项正确，“迢迢牵牛星，皎皎河汉女”出自《迢迢牵牛星》。意思是看那遥远的牵牛星，明亮的织女星。牵牛星和织女星分别属于北方玄武七宿中的牛宿和女宿。\nD项正确，“七月流火，九月授衣”出自《七月》。意思是在农历七月天气转凉的时节，天黑以后可以看见大火星从西方落下去。九月就该准备御寒的衣服了。此处的“大火星”即商星。商星，属东方苍龙七宿中的心宿，由于它火红的颜色，也称“大辰”、“大火”、“龙星”。\n本题为选非题，故正确答案为A。","no":10,"missingImage":false},{"type":"question","qid":"2578166","cat":"科技常识","stem":"下列关于激光的说法错误的是：","options":{"A":"“激光”一词是受激辐射的光放大的简称","B":"产生激光的必要条件是要有泵浦源和谐振腔","C":"激光按不同的波长可以分为红外激光、可见激光和紫外激光","D":"激光由于能量高、方向性好，目前广泛应用于测量、加工和军事等领域"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，爱因斯坦提出了一套全新的技术理论“光与物质相互作用”。这一理论是说在组成物质的原子中，有不同数量的粒子（电子）分布在不同的能级上，在高能级上的粒子受到某种光子的激发，会从高能级跳（跃迁）到低能级上，这时将会辐射出与激发它的光相同性质的光，而且在某种状态下，能出现一个弱光激发出一个强光的现象。这就叫做“受激辐射的光放大”，简称激光。\nB项正确，产生激光需要增益介质、泵浦器和谐振腔三个条件。增益介质是工作物质，比如二氧化碳、蓝宝石等，都可以作为增益介质。泵浦器是用于激发增益介质中的粒子，使得高能粒子增加，这种激发方式被形象地称为泵浦。被激发的强度往往很弱，达不到实用强度，因此使用谐振腔进行放大。通过以上三个条件，才能获得激光。因此，泵浦器和谐振腔是产生激光的必要条件。\nC项错误，激光按不同的波长可分为：红外激光、可见激光、紫外激光、X射线激光和多波段可调谐激光。\nD项正确，激光是20世纪60年代的新光源，具有方向性好、亮度高、单色性好和相干性好等特点。以激光器为基础的激光工业在全球发展势头迅猛，现在已广泛应用于工业生产、测量、通信、信息处理、医疗卫生、军事、文化教育以及科研等方面。\n本题为选非题，故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"2578823","cat":"地理国情","stem":"近年来，陕西着力推动区域协调发展，形成“国家战略引领，三大区域联动”的新格局，“三大区域联动”是指：","options":{"A":"关中协同创新发展、陕南绿色循环发展、陕北转型持续发展","B":"关中协同创新发展、陕南绿色循环发展、陕北能源支撑发展","C":"关中绿色循环发展、陕南协同创新发展、陕北转型持续发展","D":"关中绿色循环发展、陕南协同创新发展、陕北能源支撑发展"},"answer":"A","explanation":"本题考查政治常识。\n《2019年陕西省政府工作报告》中指出：“十三五”期间，关中协同创新发展、陕北转型持续发展、陕南绿色循环发展，三大区域齐发力，塑造陕西高质量发展新格局。\n故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"2578168","cat":"人文常识","stem":"李某认为某电商平台上的商户所销售服装的外观侵害了其设计著作权，于是通知电商平台对该商户采取删除、屏蔽、断开链接、终止交易和服务等措施。关于李某的上述通知，下列说法正确的是：","options":{"A":"李某只需要提出主张，无须举证，举证商户是否侵权的责任由电商平台和商户承担","B":"李某通知错误，造成商户损失的，李某应当加倍赔偿商户损失","C":"李某必须提供商户侵权的确切证据","D":"李某必须提供商户侵权的初步证据"},"answer":"D","explanation":"本题考查法律常识。\n根据《电子商务法》第四十二条规定：“知识产权权利人认为其知识产权受到侵害的，有权通知电子商务平台经营者采取删除、屏蔽、断开链接、终止交易和服务等必要措施。通知应当包括构成侵权的初步证据。电子商务平台经营者接到通知后，应当及时采取必要措施，并将该通知转送平台内经营者；未及时采取必要措施的，对损害的扩大部分与平台内经营者承担连带责任。因通知错误造成平台内经营者损害的，依法承担民事责任。恶意发出错误通知，造成平台内经营者损失的，加倍承担赔偿责任。”\nA项错误，李某作为知识产权权利人认为其知识产权受到侵害提出主张，需要举证。\nB项错误，恶意发出错误通知，造成平台内经营者损失的，才是加倍承担赔偿责任。\nC项错误，D项正确，通知应当包括的是侵权的初步证据，不是确切证据。\n故正确答案为D。","no":13,"missingImage":false},{"type":"question","qid":"2578826","cat":"人文常识","stem":"关于统筹推进新冠肺炎疫情防控和经济社会发展工作，下列表述错误的是：","options":{"A":"疫情防控的总要求是坚定信心、同舟共济、科学防治、精准施策","B":"疫情防控的总目标是坚决遏制疫情蔓延势头、坚决打赢疫情防控阻击战","C":"新冠肺炎疫情改变了我国经济的基本局面，其冲击是长期的","D":"在应对疫情中，暴露出我国在重大疫情防控体制机制方面存在的明显短板"},"answer":"C","explanation":"本题考查政治常识。\nA、B两项正确，2020年2月23日，习近平总书记在统筹推进新冠肺炎疫情防控和经济社会发展工作部署会议上的讲话中指出，打胜仗首先要有正确战略策略。党中央审时度势、综合研判，及时提出坚定信心、同舟共济、科学防治、精准施策的总要求，明确了坚决遏制疫情蔓延势头、坚决打赢疫情防控阻击战的总目标。\nC项错误，从长期来看，中国经济具有超强的发展韧性，疫情所造成的经济短期波动会逐渐减弱并回归到经济发展的一般趋势，它改变不了我国以供给侧结构性改革推进实现经济高质量发展的大逻辑，不会改变我国经济稳中向好、长期向好的基本趋势，不会改变中国经济在全球经济中的上升地位。\nD项正确，应对新冠肺炎疫情，暴露出我国在重大疫情防控体制机制、公共卫生体系等方面存在的一些短板，要改革完善疾病预防控制体系，建设平战结合的重大疫情防控救治体系，健全应急物资保障体系，加快构建关键核心技术攻关新型举国体制，深入开展爱国卫生运动，不断完善我国公共卫生体系，切实提高应对突发重大公共卫生事件的能力和水平。\n本题为选非题，故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"2577899","cat":"人文常识","stem":"《荀子·儒效》中写道，“不闻不若闻之，闻之不若见之，见之不若知之，知之不若行之”。\n关于这句论述反映的思想，下列说法错误的是：","options":{"A":"知行合一","B":"实践出真知","C":"人定胜天","D":"实践决定认识"},"answer":"C","explanation":"本题考查政治常识。\n“不闻不若闻之，闻之不若见之，见之不若知之，知之不若行之”意思是：学习中听说比不听好，见到比听说好，知晓比见到好，实践比知晓好，学习的最终就是实践，实践了，就明白了。反映了实践和认识的辩证关系，实践是认识的基础，实践决定认识。认识对实践有反作用，正确的认识、科学的理论对实践有指导作用。错误的认识、不科学的理论对实践有阻碍作用。\nA项正确，“知”就是知识，理论；“行”指行为，也就是实践。“知行合一”就是要将理论转化为实践，而且实践是理论的具体体现，是题干所反映的实践和认识的辩证关系。\nB项正确，题干反映了任何事情只有通过自己亲自尝试、实践，才能真正地认识、理解、掌握。即“实践出真知”。\nC项错误，“人定胜天”过分夸大了主观能动性，否认了规律的客观性。主观能动性的发挥要受到客观条件的制约。\nD项正确，题干反映了实践是认识的基础，实践决定认识。\n本题为选非题，故正确答案为C。","no":15,"missingImage":false},{"type":"question","qid":"2577901","cat":"人文常识","stem":"下列关于生活中数学现象的表述错误的是：","options":{"A":"用瓷砖铺地，只有用正三角、四角、六角、八角这四种正多角砖才能刚好将地铺满","B":"圆形的井盖是利用了直径相等原理，这样不论怎么移动井盖，盖子都不会掉下去","C":"每个平面地图都可以只用四种颜色来染色，而且没有两个邻接的区域颜色相同","D":"世界上只有五种正多面体，即正四、六、八、十二、二十面体"},"answer":"A","explanation":"本题考查科技常识。\n A项错误，正多角形瓷砖能刚好把地面铺满，则每个角应为\u003cimg data-k=\"d5648066255d\">的约数。根据多边形内角和公式可知，正八角形的瓷砖一个角的度数为\u003cimg data-k=\"558b28e07665\">，不能被\u003cimg data-k=\"d5648066255d\">整除。\nB项正确，圆的每一条直径均相等，井盖设计为圆形，无论如何转动其直径长度都不变，因此不会掉下去。\nC项正确，根据四色定理，只需要四种颜色就可以将平面地图都涂上颜色，且保证相邻两个区域颜色不同。\nD项正确，正多面体要求必须是多个全等的正多边形组成，满足此要求的只有正四面体、正六面体、正八面体、正十二面体和正二十面体五种类型。\n本题为选非题，故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"2577905","cat":"科技常识","stem":"西汉末巧工丁缓发明的“被中香炉”是世界上已知最早的常平支架，其构造精巧，使用时把燃烧的炭火放入香炉中心的火盆中，无论香炉如何滚动，香炉中心的火盆都能保持水平，炭火始终不会掉出来。下列装置的物理原理与之相同的是：","options":{"A":"指南针","B":"陀螺仪","C":"水平仪","D":"高度计"},"answer":"B","explanation":"本题考查科技常识。\n“被中香炉”是基于角动量守恒的力学原理，角动量守恒定律反映质点和质点系围绕一点或一轴运动的普遍规律；反映不受外力作用或所受诸外力对某定点（或定轴）的合力矩始终等于零的质点和质点系围绕该点（或轴）运动的普遍规律。\nA项错误，指南针是利用磁铁“同性相斥、异性相吸”的特性，与题干“被中香炉”原理不同。\nB项正确，陀螺仪是基于角动量守恒的理论设计出来的，主要是由一个位于轴心且可旋转的转子构成，一旦开始旋转，由于转子的角动量，陀螺仪有抗拒方向改变的趋向，与题干“被中香炉”原理相同。\nC项错误，水平仪利用的是重力的方向总是竖直向下的原理，与题干“被中香炉”原理不同。\nD项错误，常见的高度计主要为气压高度计，利用气压差得出高度差，在3000m范围内，每升高12m，大气压减小1mmHg，与题干“被中香炉”原理不同。\n故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"2578706","cat":"人文常识","stem":"近年来，3D电影由于具有非常逼真的视觉效果，而受到人们的广泛喜爱。根据其光学原理，在拍摄和播放3D电影的过程中所必需的设备组合是：","options":{"A":"2台摄影机、2台放映机、2个平行偏振片","B":"3台摄影机、3台放映机、2个平行偏振片","C":"2台摄影机、2台放映机、2个正交偏振片","D":"3台摄影机、3台放映机、2个正交偏振片"},"answer":"C","explanation":"本题考查科技常识。\n3D电影的制作运用了人眼观察物体的视角，之所以我们用肉眼看到的世界是有立体感的，是因为两个眼睛细微的角度差别经由视网膜传至大脑后就能区分出景物的前后远近，进而产生强烈的立体感。\n拍摄时，3D电影在拍摄时由两架摄像机各自使用一个镜头从不同角度同时拍摄，制成电影胶片。\n放映时，通过两个放映机把用两个镜头拍下的两组胶片同步放映，并且每台放映机前装一块偏振镜，且偏振方向相互垂直，放映机发出两束相互垂直的偏振光投射到银幕上再发射给观众，偏振方向不变。\n观看时，观众佩戴的偏振镜片的偏振方向也是相互垂直的（即正交偏振片），这样左眼只能看到左放映机的画面，右眼只能看到右放映机的画面，两眼看到的画面略有差别，从而产生了立体感。\n故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"2577917","cat":"科技常识","stem":"国家最高科学技术奖自设立以来，已有33位杰出科学工作者获得该奖。下列国家最高科学技术奖得主与其主要贡献对应正确的是：","options":{"A":"李振声一一中国现代预警机事业的开拓者和奠基人，被誉为“中国预警机之父”","B":"闵恩泽一一从事石油炼制催化剂制造技术领域研究，被誉为“中国催化剂之父”","C":"曾庆存一一为中国核潜艇事业的发展做出重要贡献，被誉为“中国核潜艇之父”","D":"侯云德一一从事医学病毒学、新发传染病控制研究，被誉为“中国传染病学之父”"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，李振声，中国科学院院士、第三世界科学院院士，著名小麦遗传育种学家，中国小麦远缘杂交育种奠基人，有“当代后稷”和“中国小麦远缘杂交之父”之称。王小谟，中国现代预警机事业的开拓者和奠基人，被誉为“中国预警机之父”，2013年1月18日荣获2012年度国家最高科学技术奖。\nB项正确，闵恩泽，石油化工催化剂专家，2007年度国家最高科学技术奖获得者，中国炼油催化应用科学的奠基者，石油化工技术自主创新的先行者，被誉为“中国催化剂之父”。\nC项错误，曾庆存，国际著名大气科学家，国际数值天气预报奠基人之一，为现代大气科学和气象事业的两大领域——数值天气预报和气象卫星遥感做出了开创性的贡献，2020年1月10日，获得2019年度国家最高科学技术奖。黄旭华，中国第一代攻击型核潜艇和战略导弹核潜艇总设计师，被誉为“中国核潜艇之父”，2020年1月10日，获得2019年度国家最高科学技术奖。\nD项错误，侯云德，医学病毒学专家，我国分子病毒学和基因工程药物的开拓者，在国内首先研制成功临床级人白细胞干扰素，被誉为“中国干扰素之父”，2018年1月8日，获得2017年度国家最高科学技术奖。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"2577948","cat":"科技常识","stem":"下列关于基因工程表述正确的是：","options":{"A":"各种遗传病的基因异常是不同的，同一遗传病的基因异常是相同的","B":"基因治疗就是把缺陷基因诱变成正常基因","C":"基因诊断的基本原理就是DNA分子杂交","D":"一种基因探针能检测水体中的各种病毒"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，人类的遗传病主要可以分为单基因遗传病、多基因遗传病和染色体异常遗传病三大类，其中多基因遗传病中的任一个基因变异都可能会得遗传病，因此同一遗传病的基因变异可能是不同的。 \nB项错误，基因治疗是指用正常基因取代或修补病人细胞中有缺陷的基因，以纠正或补偿因基因缺陷和异常引起的疾病，达到治疗目的。\nC项正确，基因诊断的基本原理是DNA分子杂交，指用放射性同位素、荧光分子等标记的DNA分子做探针，利用DNA分子杂交原理，鉴定被检测样本上的遗传信息，从而达到检测疾病的目的。\nD项错误，基因探针是一段带有标记的，与待测基因有关的核酸序列，而各种病毒的核酸序列各不相同。因此一种基因探针只能检测水体中的一种病毒。\n故正确答案为C。","no":20,"missingImage":false}],"count":15,"answerable":15,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2578609","cat":"逻辑填空","stem":"只要是创新，就会突破一些条条框框，往往越是重大的创新，对传统标准的        也会越大。我们鼓励创新，就不能把所有的现行技术标准都当成            ，而要一定程度上允许新技术去挑战某些旧的标准，只有这样，才不会让旧的标准成为阻挡创新的绊脚石。\n填入横线处最恰当的一组词是：","options":{"A":"修正  理所当然","B":"冲击  金科玉律","C":"超越  天经地义","D":"调整  不易之论"},"answer":"B","explanation":"第一空，根据文段信息“只要是创新，就会突破一些条条框框”，说明此处也应体现创新会打破传统标准之意，并且横线处体现的是“重大的创新”对于“传统标准的影响”，可知此处所填词语程度较重。B项“冲击”指冲拍撞击；C项“超越”指超过、胜过，均可体现出打破、突破之意，保留。A项“修正”指改正错误使之正确，文段并非是改正错误，排除；D项”调整“指重新调配整顿，使适应新的情况和要求，无法体现打破、突破之意，程度较轻，排除。\n第二空，搭配“标准”，且体现不允许挑战、改动之意，B项“金科玉律”比喻必须遵守、不能变更的信条，搭配恰当，当选。C项“天经地义”指绝对正确,不能改变的道理，也指理所当然的事，常搭配道理、事件，与“标准”搭配不当，排除。\n故正确答案为B。\n【文段出处】《人民日报观象台：创新需要智慧和勇气》","no":21,"missingImage":false},{"type":"question","qid":"2578051","cat":"逻辑填空","stem":"民族精神是衡量一个国家综合国力强弱的重要因素，是衡量一个民族有无凝聚力、向心力、战斗力的重要指标。一个国家重视民族精神的培养，就能凝心聚力、            ，各项事业就会             ；忽视民族精神的培养，只会             、消极颓废，各项事业都难以搞好。\n依次填入划横线部分最恰当的一项是：","options":{"A":"奋发图强  一日千里  一盘散沙","B":"精神振奋  兴旺发达  人心涣散","C":"聚精会神  繁荣昌盛  离心离德","D":"精神抖擞  蒸蒸日上  分崩离析"},"answer":"B","explanation":"第一空，横线处与“凝心聚力”构成并列结构，形容重视民族精神的培养所带来的好处， A项“奋发图强”指振作精神,努力工作,以谋求强盛；B项“精神振奋”指振作精神，奋发努力；D项“精神抖擞”形容精神振奋，饱满。三项均符合文意，保留。C项“聚精会神”形容专心致志，注意力高度集中的样子，常用于搭配具体的某事，如聚精会神地听课，与文段中“国家”“民族精神”搭配不当，排除。\n第二空，根据“民族精神是······重要因素·······重要指标”可知，国家重视培养民族精神后，各项事业就会发展得很好，A项“一日千里”比喻进展极快；B项“兴旺发达”指事物或事业充分发展、欣欣向荣的景象；D项“蒸蒸日上”比喻事情蓬勃发展，日日都有进步，均符合文意，保留。\n第三空，横线处与“消极颓废”构成近义并列，B项“人心涣散”形容人心不齐，与“消极颓废”语意相近，且可以作为不注重民族精神培养的结果，当选。A项“一盘散沙”比喻涣散不团结或力量分散没有组织起来，相较于“人心涣散”缺少“人心”这一重要主语，导致前后衔接不够准确，排除；D项“分崩离析”形容国家或集团四分五裂，这一后果程度过重，且与后文“消极颓废”的并列不够准确，排除。\n故正确答案为B。\n【文段出处】《光明日报--厚植家国情怀 培育精神家园》","no":22,"missingImage":false},{"type":"question","qid":"2577992","cat":"逻辑填空","stem":"防控疫情，应该多一些“小题大做”的        意识。小题大做，不是无理取闹，更不是渲染紧张气氛，而是体现出对疫情的        ，以及对防控疫情的重视。\n依次填入划横线部分最恰当的一项是：","options":{"A":"警惕  戒备","B":"大局  防御","C":"敏锐  监测","D":"谨慎  预判"},"answer":"A","explanation":"第一空，对应“小题大做”，“小题大做”本意指把小事当作大事来处理，可以体现出防控疫情要十分严谨、小心。A项“警惕”是指对可能发生的危险情况或错误倾向保持敏锐的感觉，D项“谨慎”指对外界事物或自己言行密切注意，以免发生不利或不幸的事情，均符合文意，保留。B项“大局”指整个局势，整个局面，文段并无体现，排除；C项“敏锐”指反应灵敏，头脑灵活，目光尖锐，不能体现“严谨、小心”之意，排除。\n第二空，横线处与“重视”意思相近，指“小题大做”，可以体现出对疫情重视的态度。A项“戒备”指警惕防备以应不测，符合文意，当选。D项“预判”指对即将到来的事进行判断，不能体现对疫情的防备和重视，排除。\n故正确答案为A。\n【文段出处】《疫情面前要算大账，不为一己私利，才可能切实抓好防控》","no":23,"missingImage":false},{"type":"question","qid":"2577997","cat":"逻辑填空","stem":"社交裂变简单点来说就是病毒式传播，爆款单品能在短时间内        最多用户，平台也由此获得大量用户和粉丝。获客成本高成为传统电商增长的瓶颈，以人和内容为核心的社交平台，利用用户自身的社交关系网络，能够更快地实现商品和用户        ，自然就被当做商品营销的新渠道。\n依次填入划横线部分最恰当的一项是：","options":{"A":"成就  碰撞","B":"催生  融合","C":"捕捉  适配","D":"抵达  连接"},"answer":"D","explanation":"第一空，搭配“用户”，结合后文，平台也由此获得大量用户和粉丝，可以看出横线处指爆款单品能够让用户了解、吸引用户。D项“抵达”指到达，在文中指被用户看到、了解，符合文意，保留。A项“成就”指造就成全，一般指辅助对方获得成绩，不符合文意，排除；B项“催生”指催产、助产或促使事物发生或形成，排除；C项“捕捉”指捉拿、缉拿，与“用户”搭配不当，且通过“社交裂变简单点来说就是病毒式传播”可知，病毒没有捕捉的功能，瞻前顾后“捕捉”不符合，排除。\n第二空，代入验证，D项“连接”指相互衔接、相连，在文中指借助社交平台使用户能够直接了解商品、商品也能够直接推销到用户面前，对应后文的“渠道”，符合文意，当选。\n故正确答案为D。\n【文段出处】《盘点微信小程序裂变玩法，分分钟告别流量困扰！》","no":24,"missingImage":false},{"type":"question","qid":"2578616","cat":"逻辑填空","stem":"大自然的            创造了光这个神奇的东西，因为光，我们能去感受这个斑斓的世界。光有着绚丽的色彩，而其中最为神奇的要数绿光了。尽管            的世界里到处都能看到绿色，但是植物的绿色属于反射光，植物本身并不是绿光源。\n填入横线处最恰当的一组词是：","options":{"A":"鬼斧神工  五彩缤纷","B":"巧夺天工  五颜六色","C":"天造地设  万紫千红","D":"匠心独运  姹紫嫣红"},"answer":"A","explanation":"第一空，搭配“大自然”，指非人力所为。A项“鬼斧神工”形容艺术技巧高超，不是人力所能达到的，与“大自然”搭配恰当，符合文段语境，保留；B项“巧夺天工”指精巧的人工胜过天然，形容技艺极其精巧，形容人工的事物，不能搭配“大自然”，排除；C项“天造地设”指自然形成而合乎理想，“造”指制作、创造，与横线后“创造”一词表述重复，排除；D项“匠心独运”指独创性地运用精巧的心思，形容文学艺术等方面构思巧妙，与“大自然”搭配不当，排除，初步确定A项。\n第二空，代入验证，A项“五彩缤纷”指颜色繁多，色彩绚丽，十分好看的样子，与后文“绿色”对应，强调在多彩的世界中绿色到处可见，语意相符，当选。\n故正确答案为A。\n【文段出处】《寻找大自然中神秘的绿光》","no":25,"missingImage":false},{"type":"question","qid":"2577991","cat":"逻辑填空","stem":"这一片花海，随四季不同而栽培，每个季节都有十几种花卉        。远离城市        ，回归大自然的宁静，让人诗意地        ，微风拂过，花香撩起的情丝，不知拨动过多少人的心弦。\n依次填入划横线部分最恰当的一项是：","options":{"A":"开放  喧闹  安居","B":"盛放  喧哗  隐居","C":"绽放  喧嚣  栖息","D":"怒放  喧嚷  歇息"},"answer":"C","explanation":"第一空搭配“花卉”，四个词语均可，因此可从第二空判断，第二空搭配“城市”，且与后文“大自然的宁静”对应，说明城市环境不安静。A项“喧闹”和C项“喧嚣”均可用来形容环境不安静，比较吵闹之意，用在此处形容城市环境不安静，符合文意，保留。B项“喧哗”指大声说笑或叫喊，D项“喧嚷”指大声地叫，两词多用来形容具体的声音，一般不形容整体的环境，用于此处形容城市的环境不恰当，排除。\n第三空，对应文段中“远离城市”“回归大自然的宁静”“微风拂过，花香撩起的情丝”，可知停留此处让人很舒适。C项“栖息”指歇息、暂住，置于文段可表达人们在花海中诗意地歇息，符合文意，当选。A项“安居”指安定地生活、定居，文段并未体现在花海之中定居之意，排除。\n故正确答案为C。\n【文段出处】《留在心尖上的花朵》","no":26,"missingImage":false},{"type":"question","qid":"2577954","cat":"逻辑填空","stem":"病毒的故事或许还要从远古说起。在那个            的地球上，海洋占据了世界的绝大部分，而无垠的大海之下是数亿年            的火山活动。在某些            之下，海水中产生了史上第一批有机大分子，从而点燃了生命的星星之火。\n依次填入划横线部分最恰当的一项是：","options":{"A":"病入膏肓  动荡不安  阴差阳错","B":"死气沉沉  经天纬地  不期而遇","C":"了无生机  连绵不断  机缘巧合","D":"奄奄一息  接踵而至  逢机遘会"},"answer":"C","explanation":"第一空，所填词语用来形容“地球”，根据后文“海水中产生了史上第一批有机大分子”可知，之前的地球是没有生命存在、没有生机的。B项“死气沉沉”指气氛不活泼，也形容人精神消沉，不振作，C项“了无生机”指一点生命的活力都没有，均符合地球没有生命气息的文意，保留。A项“病入膏肓”指病情特别严重，无法医治，D项“奄奄一息”比喻事物即将消亡、湮没或毁灭，文中没有描述地球面临重大问题、即将毁灭的状态，均排除。\n第二空，搭配“火山活动”，B项“经天纬地”形容人的才能极大，能做非常伟大的事业，搭配不当，排除。C项“连绵不断”指连续不止，一直都不中断，与“火山活动”搭配恰当，且能与“数亿年”形成对应，符合文意，保留。\n第三空，代入验证，C项“机缘巧合”指特殊的缘分，巧妙地融合遇到，在一起，符合地球在偶然间产生第一批有机大分子之意，当选。\n故正确答案为C。\n【文段出处】《病毒从哪里来》","no":27,"missingImage":false},{"type":"question","qid":"2578836","cat":"逻辑填空","stem":"无论经历多少艰难、付出多大牺牲，都不能忘了为什么出发，不能忘了肩负的使命任务，始终信念如磐、意志如铁、            ，做到“千磨万击还坚劲，任尔东西南北风”。在见世面中强大内心，既能容得下征途顺利时的春风得意，谦虚谨慎、再接再厉、再创佳绩，也能容得下前进受挫时的            ，淡定从容、            、不言放弃，做到“不管风吹浪打，胜似闲庭信步”。\n依次填入划横线部分最恰当的一项是：","options":{"A":"不忘初心  苦心孤诣  积极进取","B":"初心不改  沉重打击  乐观向上","C":"牢记使命  困难挫折  开朗乐观","D":"使命担当  艰苦磨难  力争上游"},"answer":"B","explanation":"第一空，根据顿号可以看出，横线处填入的成语与信念如磐，意志如铁构成并列有非常坚定的语义，根据前文“不能忘了为什么出发”“ 不能忘了肩负的使命任务”可知，A项“不忘初心”、B项“初心不改”、C“牢记使命”，均符合文意，保留；D项“使命担当”中的担当文段中没有体现；排除。\n第二空，根据“受挫时”可知横线，所填词语体现出遇到挫折困难时的状态。B项“沉重打击”与文段对应恰当，保留。A项“苦心孤诣”意为费尽心思钻研或经营,感情色彩积极，与文段不符，排除。C项的“困难挫折”与受挫构成语义重复；排除；\n验证第三空B项“乐观向上”填入文段与后文“不管风吹浪打，胜似闲庭信步”形成对应，符合文意，当选。\n故正确答案为B。\n【文段出处】《坚持在重大斗争中摔打磨砺》","no":28,"missingImage":false},{"type":"question","qid":"2577964","cat":"逻辑填空","stem":"研究需要            ，传播需要放下架子。中科院将物理公式和黑洞等天文现象艺术化设计后，做成了井盖涂鸦，颠覆了科学        的刻板印象，        其趣味性和人情味，推动了科学与艺术的结合，有利于科学传播以及科学氛围的形成。\n依次填入划横线部分最恰当的一项是:","options":{"A":"专心致志  高雅  增强","B":"穷经皓首  严谨  赋予","C":"学而不厌  理性  给予","D":"锲而不舍  高冷  强化"},"answer":"B","explanation":"第一空，横线处所填词语形容“研究”所需要的精神品质，A项“专心致志”指一心一意，集中精神；B项“穷经皓首”指直到年老头白还在钻研经书和古籍，形容勤勉好学，至老不倦；D项“锲而不舍”比喻做事情能坚持到底，不半途而废，也形容有恒心，有毅力，三项均能体现出“研究”应具备的精神品质，保留。C项“学而不厌”意思是学习没有满足的时候，比喻非常好学，用在此处修饰“研究”不恰当，排除。\n第二空，横线处所填词语形容“科学”具有的特点，B项“严谨”指严密谨慎；D项“高冷”指高傲冷淡，这两项用在此处形容大众对科学的刻板印象，均恰当，保留。A项“高雅”指高尚，不粗俗，通常用来形容艺术，与“科学”搭配不当，排除。\n第三空，横线处所填词语搭配“趣味性和人情味”，且由“中科院将物理公式和黑洞等天文现象艺术化设计后，做成了井盖涂鸦”可知，“科学与艺术”相结合给予了科学“趣味性和人情味”。D项“强化”指加强，文段并未出现科学已有一定趣味的内容，故“强化”与文意不符，排除。B项“赋予”指给予，井盖文化给予了科学“趣味性和人情味”，符合文意，当选。\n故正确答案为B。\n【文段出处】《中科院的“井盖涂鸦”，算亵渎科学吗》","no":29,"missingImage":false},{"type":"question","qid":"2577977","cat":"逻辑填空","stem":"尽管许多人相信宇宙的其他地方存在生命，但我们没有证据证明这一点。因此，重要的是要将所有生命都看作是        的，不管其大小、数量或位置。地球支持着宇宙中唯一        的生命。因此，无论太阳系或宇宙其他地方的生命形式如何，我们都必须确保它们        有害的污染——无论它们更接近地球生命，还是完全陌生的外星生命。\n依次填入划横线部分最恰当的一项是：","options":{"A":"平等  确认  远离","B":"宝贵  已知  免受","C":"仅有  了解  避免","D":"珍稀  可知  免遭"},"answer":"B","explanation":"第一空，横线处所填词语形容对生命的态度。根据“将所有生命都看作”可知，此处的“生命”可能不只一种，C项“仅有”的意思是只有一个，再没有别的，与文意不符，排除。根据“不管其大小、数量或位置”可知，其数量不一定很少，D项“珍稀”指珍贵而稀有，与文意不符，排除。A项“平等”泛指地位平等；B项“宝贵”指极有价值，这两项均符合文意，保留。\n第二空，横线处所填词语搭配“生命”。A项“确认”指明确承认，地球上存在生命的事实，无须再“明确承认”，不符合文意，排除。B项“已知”指已经知道，符合文意，保留。\n第三空，代入验证。横线处所填词语搭配“有害的污染”，B项“免受”指避免遭受的意思，与“污染”搭配恰当，当选。\n故正确答案为B。\n【文段出处】《看不见的外星人？地球也许存在着我们未知的生命形式》","no":30,"missingImage":false},{"type":"question","qid":"2578003","cat":"逻辑填空","stem":"现在，随着人们对橡胶认识的深入，橡胶技术也             ，不论是天然橡胶还是人工合成橡胶，都已经成为我们生活的必需品。没有一种原材料像橡胶这样，        了我们生活的方方面面：从家居日用品到体育娱乐制品，从医疗领域到军事工业，都随处可见橡胶制品的影子。\n依次填入划横线部分最恰当的一项是：","options":{"A":"高歌猛进  总括","B":"日臻完善  囊括","C":"今非昔比  概括","D":"革故鼎新  包括"},"answer":"B","explanation":"第一空，搭配“橡胶技术”，根据“随着人们对橡胶认识的深入”“不论是天然橡胶还是人工合成橡胶，都已经成为我们生活的必需品”可知，横线处表示橡胶技术不断提高，越来越好。B项“日臻完善”指一天天逐步达到完美的境地，C项“今非昔比”指现在不是过去所能比得上的，形容变化很大，均符合文意，保留。A项“高歌猛进”指高声歌唱，勇猛前进，形容在前进的道路上，充满乐观精神，侧重形容情绪高涨，与“橡胶技术”搭配不当，排除；D项“革故鼎新”泛指除去旧的，建立新的，文段并未指出去掉旧的，排除。\n第二空，冒号进行解释说明，横线处表示我们生活的方方面面都有橡胶，B项“囊括”指包罗、席卷一切，符合文意，当选。C项“概括”指归纳、总括，把事物的共同特点归结在一起加以简明地叙述，与文意不符，排除。\n故正确答案为B。\n【文段出处】《橡胶改变世界》","no":31,"missingImage":false},{"type":"question","qid":"2577978","cat":"逻辑填空","stem":"近年来，春晚愈发注重        传统文化魅力，表达时代关切和人文情怀。在这每年一度的大联欢中，喜气祥和的人情味，        着中国传统文化的和谐观，春晚早已成为中国“家和万事兴”文化情结的有效载体。\n依次填入划横线部分最恰当的一项是：","options":{"A":"挖掘  契合","B":"培育  承载","C":"拓展  勾勒","D":"展现  传承"},"answer":"A","explanation":"第一空，根据文意可知，横线处意在指出春晚重视展现传统文化的魅力，借助传统文化魅力表达时代关切和人文情怀。A项“挖掘”指深入开发，探求，符合文意，保留；D项“展现”指明显地表现出来，在文中指春晚展示传统文化的魅力，符合文意，保留。B项“培育”指培养幼小生物，使其发育成长，传统文化的魅力本就存在，不需要春晚来培养，排除；C项“拓展”指在原有的基础上，增加新的东西，与“魅力”搭配不当，排除。\n第二空，根据后文所述，春晚成为了中国传统文化情结的载体。故横线处意在指出春晚大联欢是传统文化和谐观的载体，可以有效呈现传统文化的和谐观。A项“契合”指投合，意气相投，在文中指大联欢符合传统文化的和谐观，符合文意，当选。D项“传承”泛指对某某学问、技艺、教义等，在师徒间的传授和继承的过程，“人情味”不能作为“传承”的主语，排除。\n故正确答案为A。\n【文段出处】《春晚：老汤如何“煲”出新味》","no":32,"missingImage":false},{"type":"question","qid":"2578617","cat":"逻辑填空","stem":"人脸识别是利用可见光        人脸图像信息，不同于指纹识别或虹膜识别，后两种采集方式需要利用电子压力传感器、扫描仪等，容易被人察觉，因此有可能        和欺骗。\n依次填入横线处最恰当的一组词是：","options":{"A":"收集  误判","B":"判断  遮蔽","C":"获取  伪装","D":"捕捉  复制"},"answer":"C","explanation":"第一空，根据后文“不同于指纹识别或虹膜识别，后两种采集方式······”可知，横线处也表示“采集”之意，即收集、搜罗之意。A项“收集”表示使聚集在一起，C项“获取”表示获得、取得，D项“捕捉”表示获得、获取，均符合文意，且与“信息”搭配得当，保留；B项“判断”指分析裁定，与文意不符，排除。\n第二空，所填词语应和“欺骗”并列，表示指纹识别与虹膜识别因其易察性，所以采集到的信息可能并不真实、使人上当。C项“伪装”指故意迷惑对方的行为，使之受骗，与文意相符，当选；A项“误判”指判断错误，文段并非强调指纹、虹膜识别过程中出现错误判断，排除；D项“复制”指依照原件制作成一份或多份的行为，无法体现“欺骗”之意，排除。\n故正确答案为C。\n【文段出处】《指纹过后 人脸识别能否扛起门禁大旗？》","no":33,"missingImage":false},{"type":"question","qid":"2578006","cat":"逻辑填空","stem":"对人类而言，环境发挥着两方面的功能。一方面它是人类生存与发展的物质来源；另一方面它承受着各种人类活动所产生的        。这种功能决定了人类自身的活动越来越强烈地影响着环境的发展过程，因此，人类必须彻底地        利己主义，保护好环境，保持同环境和谐与协调的互利关系。\n依次填入划横线部分最恰当的一项是：","options":{"A":"效果  唾弃","B":"结果  摒弃","C":"后果  扬弃","D":"恶果  遗弃"},"answer":"B","explanation":"第一空，根据“各种人类活动”“影响着环境的发展过程”可知，此处为中性表达，人类活动带来的影响有好有坏，横线处应该填一个中性词，B项“结果”为中性词，符合文意，保留。 A项“效果”多指有某种力量、做法产生较好的结果，为积极感情色彩，排除；C项“后果”即有害的或不幸的结果，D项“恶果”即从恶事之因而生的苦果，均为消极感情色彩，排除。\n第二空，代入验证，搭配“利己主义”，横线处表达人类必须放弃利己主义， B项“摒弃”即为了达到自己的目的抛弃一些东西，搭配恰当，符合语境，当选。\n故正确答案为B。\n【文段出处】《科学发展观与环境保护》","no":34,"missingImage":false},{"type":"question","qid":"2578010","cat":"逻辑填空","stem":"有些作家，他们笔尖触动的生活与人性之深，文字创造力之强，令人吃惊。待到人们去        去议论，他们又不声不响扎到什么地方去了。惟有这样才能写出真正        社会人生的作品来。\n依次填入划横线部分最恰当的一项是：","options":{"A":"捧读  知悉","B":"拜读  熟悉","C":"研读  获悉","D":"品读  洞悉"},"answer":"D","explanation":"本题可从第二空入手。第二空，搭配“社会人生”，D项“洞悉”即以敏锐的洞察力辨别，用在此处搭配恰当，且与“他们笔尖触动的生活与人性之深”形成对应，保留。A项“知悉”即知道、了解，通常搭配为“知悉情况”、“知悉流程”；B项“熟悉”即了解得清楚，通常搭配为“熟悉工作”、“熟悉业务”；C项“获悉”即得到消息，通常用法为“从······获悉”，均与“社会人生”搭配不当，且体现不出了解的深入之意，排除。\n第一空代入验证，“品读”填入文段搭配恰当，符合语境，当选。\n故正确答案为D。\n【文段出处】《作家是最沉得住气的一群人》","no":35,"missingImage":false},{"type":"question","qid":"2578020","cat":"逻辑填空","stem":"这种恢弘的春天的仪式，是古老先民为子孙创造的狂欢节，它依然        着祖先们的记忆、嘱托和想象，让春天变得如此华丽，盎然        着他们的激情，那么浓郁、雄健、炽热，洪波涌起，渐至澎湃。\n依次填入划横线部分最恰当的一项是：","options":{"A":"承载  疏放","B":"记载  释放","C":"浸透  吐放","D":"渗透  绽放"},"answer":"C","explanation":"第一空，横线处所填词语搭配“记忆、嘱托和想象”，用以形容“春天的仪式”，意在表达从这样的“仪式”中可以看到祖先们的“记忆、嘱托和想象”，A项“承载”指托着物体，承受它的重量，C项“浸透”指比喻饱含（某种思想感情等），置于此处均符合文意，保留。B项“记载”指把事情写下来，置于此处与“仪式”搭配不当，排除；D项“渗透”比喻一种事物或势力逐渐进入到其他方面，与文意无关，排除。\n第二空，横线处所填词语搭配“激情”，C项“吐放”指放射，多与抽象事物搭配，置于此处符合文意，与“盎然”对应得当，当选。A项“疏放”指行为放纵或者文章不拘常格，与文段含义无关，排除。\n故正确答案为C。\n【文段出处】《金川的花季》","no":36,"missingImage":false},{"type":"question","qid":"2578008","cat":"逻辑填空","stem":"从结绳记事到竹简纸张，从计算机存储到光盘刻录，人类从未停止        更加高效便捷的信息存储方式，信息存储方式的变革很大程度上也        着我们获取信息和认知世界的方式。\n依次填入划横线部分最恰当的一项是：","options":{"A":"追求  塑造","B":"追逐  制造","C":"探求  创造","D":"探究  缔造"},"answer":"A","explanation":"第一空，根据文段信息“从结绳记事到竹简纸张”、“从计算机存储到光盘刻录”可知，我们一直在让我们的信息存储方式更加高效便捷，故横线处应表示“努力达到某种目的”、“想要”之意，A项“追求”表达通过行动达到某种目的，B项“追逐”表达积极追寻，C项“探求”意为探索寻求，均与文段对应恰当，保留。D项“探究”意为探索研究，文中并无研究之意，与文意不符，排除。\n第二空，前文搭配“信息存储方式的变革”，后文搭配“我们获取信息和认知世界的方式”，表达信息存储方式的变革对我们获取信息和认知世界方式有重大影响之意，A项“塑造”强调通过培养、改造使人或事物达到某种预定的目标，当选。B项“制造”往往搭配“装备”“机器”等具体事物，且“制造”的主体多为人，与前文“信息存储方式的变革”搭配不当，排除；C项“创造”重在强调首次做出或建立，强调开创性，而我们获取信息和认知世界的方式是始终存在的，并非首次开创，排除。\n故正确答案为A。\n【文段出处】《数字存储打开想象空间》","no":37,"missingImage":false},{"type":"question","qid":"2578031","cat":"逻辑填空","stem":"“新鲜”与“创新”，二者有一字之别却            。当今，一些篆刻家努力创作出某些颇为“新鲜”的作品，它们也许是“创新”的前奏，却缺乏艺术土壤的滋养，必会            而凋谢。\n依次填入划横线部分最恰当的一项是：","options":{"A":"相去甚远  昙花一现","B":"毫无二致  烜赫一时","C":"大相径庭  电光火石","D":"各有千秋  稍纵即逝"},"answer":"A","explanation":"第一空，根据“却”字可知前后文语义相反，前文“一字之别”表达两者差距很小，故横线处所填词语要体现出两者差距很大之意，A项“相去甚远”，C项“大相径庭”均可表达差距很大之意，保留。B项“毫无二致”表达丝毫没什么两样，与文意相悖，排除；D项“各有千秋”强调各有所长，各有优点，各自有特色，与差距大小无关，排除。\n第二空，根据“却”转折可知，文段表达“新鲜”的作品也许是“创新”的前奏，但最终依然不是创新，不能被保留下来，很快就会消失，A项“昙花一现”比喻稀有的事物或显赫一时的人物出现不久就消逝，与文意相符，且与文段“艺术土壤的滋养”及“凋谢”形象表达对应恰当，当选；C项“电光火石”现多形容事物像闪电和石火一样一瞬间就消失，在形容时间时往往用为“电光火石间”，此处用法不当，且与文段“艺术土壤的滋养”及“凋谢”形象表达的对应不及“昙花一现”准确，排除。\n故正确答案为A。\n【文段出处】《保持艺术新鲜度》","no":38,"missingImage":false},{"type":"question","qid":"2578040","cat":"逻辑填空","stem":"数学是世界各个地方、各个民族最先发展起来的精密科学。以《九章算术》为代表的中国传统数学，同以几何为代表的古希腊数学            ，有如两颗璀璨的明珠在世界的东方和西方            。\n依次填入划横线部分最恰当的一项是：","options":{"A":"各有千秋  交相辉映","B":"平分秋色  相映成趣","C":"半斤八两  一唱一和","D":"势均力敌  遥相呼应"},"answer":"A","explanation":"第一空，应表达中国传统数学和古希腊数学的关系，根据文段信息“有如两颗璀璨的明珠”可知，两者均有重要价值。A项“各有千秋”强调各有所长，各有优点，各自有特色，B项“平分秋色”比喻双方各得一半，不分上下，均符合题意，保留。C项“半斤八两”，比喻彼此一样，不相上下，多为贬义，感情色彩不符，排除；D项“势均力敌”指双方势力相当，不分高下，用于对抗、竞争的语境，文段并未体现中国传统数学和古希腊数学两者在竞争、对抗，与文意不符，排除。\n第二空，根据文段信息“有如两颗璀璨的明珠”可知，文段将中国传统数学和古希腊数学比作“明珠”，A项“交相辉映”意指各种光亮、色彩等互相映照，与“明珠”形成对应，当选。B项“相映成趣”指相互衬托着，显得很有趣味，很有意思，文段并未体现“趣味”，排除。\n故正确答案为A。\n【文段出处】《科学网--留存与弘扬中国的数学基因》","no":39,"missingImage":false},{"type":"question","qid":"2578618","cat":"逻辑填空","stem":"在人类文明的历史长河中，我们曾数次面临来自微生物的致命威胁。天花、梅毒、黑死病、流感、霍乱等流行病曾        人类社会数千年。每一次大流行后，它们都会突然            ，所发生的一切都会烙印在我们的基因里。\n依次填入横线处最恰当的一组词是：","options":{"A":"荼毒  杳无音信","B":"摧残  烟消云散","C":"蹂躏  无影无踪","D":"肆虐  销声匿迹"},"answer":"D","explanation":"从第二空入手，横线处表示流行病每一次大流行后，就会突然消失不见。D项“销声匿迹”形容隐藏起来或不公开出现，符合语境，保留；A项“杳无音信”指一点消息也没有，形容失去联系或没有方式联系，侧重强调联系不上，此处并非强调要联系流行病，不符合语境，排除；B项“烟消云散”像烟云消散一样，比喻事物消失得干干净净；C项“无影无踪”指没有一点踪影，形容完全消失，不知去向，B、C两项均侧重彻底消失，程度过重，天花、梅毒、黑死病、流感等病毒并非流行后就彻底消失不再出现，排除。\n第一空，代入验证， D项“肆虐”指任意残害、危害，与“人类社会”搭配得当，当选。\n故正确答案为D。\n【文段出处】《细菌和病毒上了天怎么办？》","no":40,"missingImage":false},{"type":"question","qid":"2578619","cat":"逻辑填空","stem":"地球自转促进了地球形状的形成，地球自转所产生的惯性离心力，使得地球物质由两极向赤道运动，从而使地球外形呈现出赤道半径大、两极略扁的旋转椭球体的形状，并产生了地球弹性变形。由于日月的引力，地球体发生弹性变形，在海洋面上则表现为海洋潮汐，而地球的自转又使潮汐变为绕地球传播的潮汐波，其传播方向与地球自转方向相反。\n对这段文字中划横线的“其”，理解最准确的一项是：","options":{"A":"弹性变形","B":"日月引力","C":"潮汐波","D":"海洋潮汐"},"answer":"C","explanation":"代词“其”出现在文章最后一句，指代词应该对应前文内容，前文主要提到潮汐波，故“其”指代“潮汐波”，答案锁定C项。\nA项为日月引力所带来的结果；B项为产生潮汐波的原因之一；D项为潮汐波是由谁变化而来，均非“其”指代对象，排除。\n故正确答案为C。\n【出处】《地球自转运动及其环境效应_自然地理学》","no":41,"missingImage":false},{"type":"question","qid":"2577975","cat":"片段阅读","stem":"从社会治理的角度看，占用消防通道的行为之所以屡禁不止，除了违法者缺乏公共安全观念、对生命和法律缺乏敬畏以及监管不到位等因素之外，也有停车难的深层原因。随着我国汽车保有量不断攀升，一些居民区面临停车位紧缺的问题。特别是一些老旧小区，当初设计建设的局限，使得这一矛盾愈发凸显。这也是一些地方占用消防通道的现象反复出现，治理举措管得了一阵子，却无法管长期、管根本的原因所在。就此而言，保持消防通道畅通、有效解决停车难题，既要管要堵，更要疏要导，这考验着基层社会治理的有效性和精准度。\n这段文字接下来最可能讲的是：","options":{"A":"加大处罚力度、提高违法成本等措施","B":"在纾解停车难问题上进行的有益探索","C":"占用消防通道现象反复出现的原因","D":"探讨停车难问题的深层次原因"},"answer":"B","explanation":"接语选择题。文段开篇分析占用消防通道行为屡禁不止的深层原因，随后进行进一步的解释说明，尾句通过“就此而言”得出结论，强调“保持消防通道畅通、有效解决停车难题，既要管要防，更要疏要导，这考验着基层社会治理的有效性和精准度”，故文段最后针对保持消防通道畅通，解决停车难题论述解决对策，后文应继续围绕解决这一问题进行展开，对应B项。\nA项，“加大处罚力度、提高违法成本等措施”表述不明确，且没有提到文段最后谈论的核心话题“停车难题”，排除；\nC项 “占用消防通道现象反复出现的原因”、D项 “停车难问题的深层次原因”前文均已阐述，故后文不会再论述，排除。\n故正确答案为B。\n【文段出处】《破解停车难题，畅通生命通道》","no":42,"missingImage":false},{"type":"question","qid":"2577984","cat":"片段阅读","stem":"数字孪生，按字面意思来讲，就是为真实的物理世界搭建一个高度镜像化的数字世界。随着技术的不断演进，数字孪生发挥重要价值的应用场景会相应增加，其性价比也将不断提高。比如，在技术设计和测试时，数字孪生可以让很多由于物理条件限制、依赖于真实的物理实体而无法完成的操作变成可能；再比如，当数字孪生技术应用于造价不菲的航天器、核电站时，这些设施的性能与安全都将得到进一步提升与保障。\n这段文字没有涉及的是：","options":{"A":"概念与定义","B":"市场的反馈","C":"性价比优势","D":"应用性前景"},"answer":"B","explanation":"A项，“概念与定义”对应文段“数字孪生······就是······数字世界”可知，文段介绍了数字孪生的含义，表述正确，排除；\nB项，文段并未提及“市场的反馈”，无中生有，表述错误，当选；\nC项，“性价比优势”对应文段“其性价比也将不断提高。比如······”，可知文段对其性价比优势进行了举例说明，表述正确，排除；\nD项，“应用性前景”对应文段“比如······再比如······”，可知数字孪生可应用于技术设计和测试以及航天器、核电站等，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《数字孪生技术前景广阔》","no":43,"missingImage":false},{"type":"question","qid":"2578621","cat":"片段阅读","stem":"暴力伤医现象的频繁发生，或许已经让不少人产生了无力感，但无力不代表可以麻木。根据2019年3月最高检发布的数据，2018年检察机关就暴力伤医、聚众扰医等犯罪行为共起诉了3202人，尽管同比下降了29%，但绝对数量依然不低，而且这还只是明确纳入司法轨道的案件。就此来说，我们固然不能渲染和放大医患冲突，但在治理端也不能低估其发生概率。医生的职业环境与安保水平确实仍有待改善与提高。\n根据这段文字，下列说法正确的是：","options":{"A":"医患关系的治理仍需要加强","B":"暴力伤医现象得到了有效控制","C":"医患关系的矛盾已经有所缓解","D":"人们对暴力伤医现象无能为力"},"answer":"A","explanation":"本题属于细节主旨化题目。文段开篇引出暴力伤医话题，随后通过一系列数字进行论证，指出暴力伤医事件较多，最后通过转折强调医生的职业环境和安保水平有待改善，即对于医患关系的治理仍需加强，对应A项。\nB项，根据“但绝对数量依然不低，而且这还只是明确纳入司法轨道的案件”可知，暴力伤医并没有得到有效控制，排除；\nC项，根据“暴力伤医现象频繁发生”可知，医患矛盾并没有得到缓解，排除；\nD项，根据“无力并不代表可以麻木”以及最后一句可知，人们对暴力伤医并不是无能为力的，表述过于绝对，排除。\n故正确答案为A。\n【文段出处】光明时评《暴力伤医必须严惩，化解之道还在于完善医疗服务》","no":44,"missingImage":false},{"type":"question","qid":"2577967","cat":"片段阅读","stem":"在闽江及其支流上存在着大量的传统村镇与古厝，如琴江满族村、闽安古镇、林浦村的“泰山行宫”、大埕村“九条金带”等。它们在类型和内涵上都有相似之处，虽然得到了一定程度的保护，但开发和利用力度仍普遍不够，导致一些历史记忆有湮灭的危险。随着城市化进程的加速及旧城改造规模的不断扩大，传统村镇与古厝必然会面临如何被有效保护的问题。\n接下来作者最有可能讲述的是：","options":{"A":"传统村镇和古厝的招商引资","B":"传统村镇和古厝的文物保护","C":"传统村镇和古厝的开发与保护","D":"传统村镇和古厝的文化内涵"},"answer":"C","explanation":"接语选择题。文段开篇引出传统村镇与古厝的话题，随后指出其开发和利用力度欠缺，最后强调“传统村镇与古厝必然会面临如何被有效保护的问题”，故把握“保护传统村镇与古厝”这一核心话题，可对应C项。\nA项“招商引资”、B项“文物保护”、D项“文化内涵”均无中生有，且与文段最后谈论的话题衔接不一致，排除。\n故正确答案为C。\n【文段出处】《古厝特色成为“福州元素”》","no":45,"missingImage":false},{"type":"question","qid":"2577995","cat":"片段阅读","stem":"朊病毒是一种结构异常的蛋白，能迫使正常蛋白呈现相同的错误折叠形状并像传染病一样在组织中传播。这是继认识到细菌、病毒、支原体等微生物可以引发疾病后，人类又发现的另一种引发疾病的病原体。因此，如果想要成功开发有效的治疗方法，需要针对（靶向）有活性的朊病毒，而不是已经死亡的斑块和缠结物中的大量蛋白。\n从这段文字我们可以推出:","options":{"A":"朊病毒的结构非常复杂","B":"朊病毒比细菌危害更大","C":"朊病毒能够引发疾病","D":"朊病毒引发的疾病能够被有效治疗"},"answer":"C","explanation":"A项，根据“朊病毒是一种结构异常的蛋白”，只是强调其结构和其他的不一样，并未阐述结构复不复杂，偷换概念，排除；\nB项，文段只是论述朊病毒同细菌、病毒等微生物一样，可以引发疾病，并未涉及到朊病毒和细菌谁危害性更大的比较，无关对比，排除；\nC项，根据“这是继认识到细菌、病毒、支原体等微生物可以引发疾病后，人类又发现的另一种引发疾病的病原体”可知，表述正确，当选；\nD项，根据“如果想要成功开发有效的治疗方法”可知，文中只是论述一种有效治疗方法的假设情况，选项以肯定语气论述出来，偷换语气，故表述错误，排除。\n故正确答案为C。\n【文段出处】《谨慎看待老年性痴呆药物的历史性突破》","no":46,"missingImage":false},{"type":"question","qid":"2577957","cat":"片段阅读","stem":"隐球菌首先通过肺部感染侵入人体，而后蔓延至包括大脑在内的其他各处器官，可导致胸痛、干咳、腹部肿胀、头痛、视力模糊等症状。其中，隐球菌性脑膜炎最为严重，如治疗不及时，约有\u003cimg data-k=\"e23821cea175\">的患者可能在一年内死亡；即使在目前已有多种药物治疗的情况下，其死亡率仍保持在\u003cimg data-k=\"2c6adc1698b0\">至\u003cimg data-k=\"985db08b06d9\">。更可怕的是，在那些幸免于死的病人中，部分患者还可能留下失明、听力障碍、偏瘫、头痛、下肢肌肉萎缩等后遗症，其致残率约为\u003cimg data-k=\"798f1f286d1f\">。\n这段文字主要介绍的是：","options":{"A":"隐球菌病的症状明显","B":"隐球菌病的死亡率高","C":"隐球菌病的后遗症多","D":"隐球菌病的危害性大"},"answer":"D","explanation":"文段开篇介绍隐球菌如何进入人体以及所带来的症状，引出隐球菌话题，然后通过程度词“最”表示其所带来的疾病十分严重，后文通过一系列数据，对于为什么说疾病严重进行解释说明，故文段重在强调隐球菌所带来的疾病危害性非常大，对应D项。\nA项，“症状明显”对应首句引出话题，并非文段重点，排除；\nB项，“死亡率高”对应文段“如治疗不及时，约有\u003cimg data-k=\"e23821cea175\">的患者可能在一年内死亡”，为解释说明的一部分，表述片面且非文段重点，排除；\nC项，“后遗症多”对应文段“在那些幸免于死的病人中，部分患者还可能留下失明、听力障碍、偏瘫、头痛、下肢肌肉萎缩等后遗症”，为解释说明的一部分，表述片面且非文段重点，排除。\n故正确答案为D。\n【文段出处】《破解“木乃伊诅咒”之谜，揭示夺命真菌-生物通》","no":47,"missingImage":false},{"type":"question","qid":"2577982","cat":"语句表达","stem":"数字经济的重要意义不仅体现在对总量的贡献上，更重要的是                    ，一方面表现为数字技术赋能传统产业，另一方面表现为数字技术催生新产业。数字技术赋能传统产业，通常也被称为产业数字化，即利用数字技术对传统行业的业务进行升级，进而提升生产数量和效率。从生产流程角度看，数字技术可以通过对企业生产过程中产生的数据进行分析，将程序性业务交给计算机处理，从而降低了操作失误率。同时，企业通过数据分析，能够对业务流程进行全面而系统的监督，及时发现经营过程中的异常和隐患，大大降低风险。\n填入划横线部分最恰当的一项是：","options":{"A":"及时降低企业经营过程中的损耗与风险","B":"将数字化的知识和信息转化为生产要素","C":"对产业结构优化升级所起到的推动作用","D":"不断发掘与推动产业经济的新增长点"},"answer":"C","explanation":"横线出现在文段开头，需结合后文内容进行分析。后文先说明数字经济的重要意义体现为两方面，即数字技术赋能传统产业和数字技术催生新产业。接着对数字技术赋能传统产业展开介绍，指出其本质是通过数字技术对传统产业结构进行的优质升级，随后分别通过生产流程及业务流程两方面继续围绕数字技术赋能传统产业展开详细说明。横线后文重在强调数字技术能够为传统产业结构的调整带来积极作用，故横线处所填内容应体现出数字技术对产业结构变化起到了重要的助推作用，对应C项。\nA项“降低······损耗与风险”对应后文详细展开论述的一部分，表述片面且非重点，排除；\nB项“将······转化为生产要素”文段没有体现，无中生有，排除；\nD项“······产业经济的新增长点”仅对应文段“另一方面表现为数字技术催生新产业”，表述片面，排除。\n故正确答案为C。\n【文段出处】《人民日报：激发数字经济“牵引力”》","no":48,"missingImage":false},{"type":"question","qid":"2577968","cat":"片段阅读","stem":"在现实中，农民工维权时往往面临证据不足、难以取证的问题。B市某法院审理的案件统计数据显示，在农民工讨薪案件中，约有\u003cimg data-k=\"cd4db1324e77\">的败诉是农民工没有相关证据而导致的。虽然劳动合同、工资卡、工资条、银行转账记录、考勤表、工作证等资料证明都可以作为农民工被欠薪的证据，但很多农民工跟着包工头干活仅以现金结账，而没有留存证据。再加上部分农民工缺乏证据意识，也可能导致被欠薪后拿不出足够证据来维权。\n这段文字接下来最可能讲述的是：","options":{"A":"用法规来解决农民工被欠薪之后证据不足的问题","B":"用法规来强制用工单位解决农民工被欠薪问题","C":"培训农民工学会用法规维护自己合法权益","D":"农民工在讨薪过程中遇到的法规问题"},"answer":"A","explanation":"根据提问方式可知，本题为接语选择题，应在阅读全文基础上，重点关注文段最后谈论的核心话题。文段首先指出农民工维权时面临证据不足、难以取证的问题，并举例论证，紧接着围绕这一问题进行了原因分析，说明很多农民工的工资以现金结账，而没有留存证据，尾句通过“再加上”表示并列，指出问题产生的另一原因在于农民工缺乏证据意识，故文段是提出问题+分析问题的结构，后文也应围绕“证据不足”展开论述，综合选项分析，对应A项。\nB项“强制用工单位······”对应文段倒数第二句，仅可解决用工单位导致的证据不足问题，C项“农民工学会用法规······”对应文段尾句，仅可解决农民工自身原因导致的证据不足问题，表述均片面，排除；\nD项，文段尾句强调的是证据不足而导致的问题，“讨薪过程中遇到的法规问题”概念扩大，排除。\n故正确答案为A。\n【文段出处】人民网《北青报：依法破解农民工工资维权举证难》","no":49,"missingImage":false},{"type":"question","qid":"2577985","cat":"片段阅读","stem":"在过去很长一段时期里，大气中二氧化碳的含量基本上保持恒定，这是由于大气中的二氧化碳始终处于“边增长、边消耗”的动态平衡状态。大气中的二氧化碳有\u003cimg data-k=\"cd4db1324e77\">来自人和动植物的呼吸，\u003cimg data-k=\"798f1f286d1f\">来自燃料的燃烧。散布在大气中的二氧化碳有\u003cimg data-k=\"6f4ae0e851d1\">被海洋、湖泊、河流等地面水及空中降水吸收溶解。还有\u003cimg data-k=\"0ef566a32600\">的二氧化碳通过植物光合作用，转化为有机物质贮藏起来。这就是多年来二氧化碳占空气成分\u003cimg data-k=\"1ed0a574a66d\">（体积分数）始终保持不变的原因。\n这段文字主要介绍的是：","options":{"A":"大气中二氧化碳的含量","B":"大气中二氧化碳的来源","C":"大气中二氧化碳的平衡","D":"大气中二氧化碳的消耗"},"answer":"C","explanation":"文段开篇指出大气中二氧化碳的含量保持恒定，处于动态平衡状态。接着对大气中二氧化碳的来源进行介绍，随后说明大气中二氧化碳是如何被吸收、溶解、贮藏的，指出这就是大气中二氧化碳含量得以保持恒定的原因。因此文段主要介绍了大气中二氧化碳处于平衡状态，对应C项。\nA项“含量”、B项“来源”、D项“消耗”分别对应后文解释说明部分，并非文段重点，排除。\n故正确答案为C。","no":50,"missingImage":false},{"type":"question","qid":"2578005","cat":"片段阅读","stem":"目前一些地区产生相对贫困问题，就是由于这些地区的人群缺乏信息和资源。在现代信息社会中，掌握较多信息和资源的人群能够获得更多的致富机会；相反，缺少信息和资源的一部分人群就会被逐渐分化，成为相对贫困人群。要针对相对贫困问题的产生根源和主要特征，在进一步加大政策扶持和资金投入力度、加快基础设施建设的同时，形成产业扶贫、金融扶贫、技术扶贫、信息扶贫、教育扶贫、就业扶贫、文化扶贫、减灾扶贫、医疗扶贫等解决相对贫困的多层次资源支撑和保障。\n这段文字意在说明:","options":{"A":"相对贫困受到各种条件与因素的制约","B":"形成解决相对贫困的多层次资源支撑","C":"信息和资源是造成相对贫困的主要因素","D":"解决相对贫困是扶贫的重要内容与途径"},"answer":"B","explanation":"文段开篇引出话题，即一些地区的人群由于缺乏信息和资源，出现了相对贫困的问题，紧接着从两个方面分析了掌握信息和资源的多少对于贫困的影响，即一方面论述了掌握信息和资源较多的人，致富的机会更多，另一方面论述了缺少信息和资源的人，会成为相对贫困人群，文段尾句针对如何解决相对贫困的问题提出对策，也就是要通过多层次资源的支持和保障来解决，故文段强调的是应该通过多层次的资源支持来解决相对贫困的问题，对应B项。\nA项，“受到······制约”为问题阐述，与文段强调的解决相对贫困的对策对应不当，非重点，排除。\nC项，为问题产生的原因阐述，而文段强调的是解决相对贫困的对策，非重点，排除。\nD项，文段并未提及“扶贫”的内容与途径，无中生有，排除。\n故正确答案为B。\n【文段出处】光明日报：《建立解决相对贫困的长效机制》","no":51,"missingImage":false},{"type":"question","qid":"2578623","cat":"语句表达","stem":"①“适度距离”不单是居住空间上的物理距离，也是心理上的“代际距离”。\n②个性解放、知识快速更新和年轻一代的经济独立不断冲击着传统家长权威。\n③当年轻人与父辈的价值观念和行为方式难以快速趋同时，保持适度距离是确保良性代际互动的前提。\n④在社会转型进程中，中国的家庭结构经历着革命式变迁。\n⑤有学者提出，两代人的居住格局应保持“一碗汤的距离”，既要让子代和父代有各自的独立空间，又要维系家庭成员之间的亲密关系。\n⑥不同价值观念和行为方式在同一时空并存的环境下，代际之间的适度空间和社会距离是彼此有效沟通与和谐共处的基本条件之一。\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"⑤①③④②⑥","B":"②⑥③④①⑤","C":"④②⑥③⑤①","D":"⑥③⑤④①②"},"answer":"C","explanation":"观察选项，②④⑤⑥充当首句，对比这四句话，②句指出年轻一代冲击家长权威，提出问题，④句提出中国家庭结构发生变迁这一观点，根据文意可知②句是对④句中国结构的变迁这一观点进行原因的解释说明，因此④句应该在②句的前面，排除B项。接下来⑤句学者通过“应”提对策，逻辑顺序应该是先提出问题然后给出对策，因此不适合放在首句，排除A项；并且对比⑤②这两句话，②句是提出问题，⑤句是给出对策，故②句在⑤句的前面，排除D项。\n故正确答案为C。\n【文段出处】光明日报《春节，代际弥合好时机》","no":52,"missingImage":false},{"type":"question","qid":"2578011","cat":"片段阅读","stem":"广告、点击量变现和会员付费，是现阶段视频平台的三大主要收入来源。从国内近几年的发展态势来看， L视频平台公司的会员付费模式备受国内同行的青睐和追捧。从2009年到2018年，该公司的市值增长了约60倍，目前高达1293亿美元，在众多科技股中表现抢眼。但即使这样的“巨无霸”，现在也面临着会员增长的压力，这部分收入未来恐怕难以填补其在原创内容领域巨额投入的缺口。\n根据这段文字，下列说法正确的是：","options":{"A":"L公司的广告收入没有会员付费收入高","B":"L公司的会员付费模式优于国内视频网站","C":"L公司的市值增长主要依靠会员付费收入","D":"L公司的点击量变现收入比不上国内其他视频网站"},"answer":"C","explanation":"A项，文段没有关于L公司“广告收入”的具体描述，故广告收入与会员付费收入的比较属于无关对比，排除；\nB项，文段只介绍“会员付费模式备受国内同行的青睐和追捧”，但受青睐和追捧不代表L公司的会员付费模式就优于国内同行，且文段没有关于L公司与国内同行对比的描述，排除；\nC项，L公司会员付费模式备受国内同行的青睐和追捧，说明视频企业比较依赖这种模式，接着通过“该公司的市值增长了约60倍，目前高达1293亿美元”进行论证，说明会员付费模式对企业市值影响巨大，表述正确，当选；\nD项，文段仅仅提到“点击量变现”收入是视频平台主要收入来源之一，但没有将L视频平台的“点击量变现”收入与国内其他视频网站进行比较，与文意不符，排除。\n故正确答案为C。\n【文段出处】新华网《视频平台亏损寒冬来袭 不能只靠“烧钱取暖”》","no":53,"missingImage":false},{"type":"question","qid":"2578022","cat":"片段阅读","stem":"当前我国正处于人口结构高速转变的时期，农村人力资源开发将需要同时面临“农村劳动力转移的难度加大”与“农村劳动力存量的整体素质趋于降低”两大问题。从农业农村发展的要求出发，今后一个时期，开发农村人力资源、优化农村人力资本结构必须着眼于提升农村人力资源的自我发展能力和辐射带动能力，通过“以点带面”加快促进农村劳动者整体素质的提高，从而有效缓解当前人力资源日益短缺的问题，促进农业农村平稳发展。\n这段文字主要强调的是：","options":{"A":"当前我国农村人力资源开发的问题","B":"当前农村人力资源日益短缺的问题","C":"农村劳动者整体素质提升的策略","D":"农村劳动力资源短缺的解决办法"},"answer":"D","explanation":"文段首先铺垫背景，介绍当前我国人口结构正处于高速转变时期，紧接着指出农村人力资源开发面临着“农村劳动力转移的难度加大”与“农村劳动力存量的整体素质趋于降低”两大问题，之后由“必须”给出对策，即“着眼于提升农村人力资源的自我发展能力和辐射带动能力”，通过“以点带面”来提升农村劳动者的整体素质，解决当前人力资源短缺的问题，故文段重点强调解决人力资源短缺的对策，对应D项。\nA、B两项，均为问题的表述，文段重点强调对策，排除；\nC项，“农村劳动者整体素质提升”非文段重点，文段最终要解决的是“农村劳动力资源短缺”的问题，排除。\n故正确答案为D。\n【文段出处】《职教培训需补齐乡村人才“短板”》","no":54,"missingImage":false},{"type":"question","qid":"2578025","cat":"片段阅读","stem":"重大疫情面前，及时发布权威信息，公开透明回应群众关切，能够有效解决信息不对称的问题，压减谣言等虚假信息传播空间，更好地维护社会大局稳定。一段时间以来，有关部门和相关机构及时发布确诊、疑似、治愈和病亡人员数据，一些互联网企业运用大数据、云计算、可视化技术，推出“实时疫情动态”“疫情地图”“同乘患者查询系统”“发热门诊地图”等产品，同步普及科学防护知识，有效满足了民众的信息需求，引导群众理性看待疫情，增强自我防范意识和防护能力。\n这段文字意在强调：","options":{"A":"信息公开透明有助于疫情防护","B":"利用技术手段增强自我防护能力","C":"利用技术手段普及科学防护知识","D":"信息公开透明满足了人民信息需求"},"answer":"A","explanation":"文段开门见山提出对策 “及时发布权威信息，公开透明回应群众关切”，并阐述对策带来的意义。接着列举“有关部门和相关机构”以及“一些互联网企业”的具体事例，进行解释说明，故整个文段为“总分”结构，首句的对策句即为中心句，对应A项。\nB项和C项，“利用技术手段”，是后文分述句的内容，非重点，均排除；\nD项，信息公开透明是为了有效引导群众抗击疫情，该项未包含核心话题“疫情”，排除。\n故正确答案为A。\n【文段出处】《防控疫情要用好大数据》","no":55,"missingImage":false},{"type":"question","qid":"2578036","cat":"片段阅读","stem":"克黎利引述《新科学家》杂志的文章称，记忆的作用不一定是为了记住过去，而是帮助我们走向未来，记忆有时会运用想象和创造的方式，让我们知道接下来怎么做，或者在某些情况下做出什么反应。有些人以为自己有预见未来的能力，其实也许是过去的碎片化记忆而已。如果似曾相识的感觉是来自一段想不起来的记忆，那么就容易产生这样的错觉：接下来发生的事情也是来自于这段记忆，自己具备了“心灵能力”。\n与这段文字观点不符的是：","options":{"A":"似曾相识不是“心灵能力”","B":"似曾相识能够帮助我们预见未来","C":"似曾相识是对过去不完整的记忆","D":"人们的记忆不一定是对过去的回忆"},"answer":"B","explanation":"B项，根据“有些人以为自己有预见未来的能力，其实也许是过去的碎片化记忆而已”可知，人们并无“预见未来的能力”，表述错误；\nA项，根据尾句可知，似曾相识的感觉是基于“一段想不起来的记忆”，并导致“自己具备了‘心灵能力’”这一错觉，故“似曾相识”并不是“心灵能力”，表述正确；\nC项，根据“有些人以为自己有预见未来的能力，其实也许是过去的碎片化记忆而已”以及“如果似曾相识的感觉是来自一段想不起来的记忆······”可知，表述正确；\nD项，根据首句可知，人们的记忆可以“运用想象和创造的方式，让我们知道接下来怎么做，或者在某些情况下做出什么反应”，故“人们的记忆不一定是对过去的回忆”，也可能是想象等，表述正确。\n本题为选非题，故正确答案为B。\n【文段出处】《“似曾相识”是一种心灵能力吗？》","no":56,"missingImage":false},{"type":"question","qid":"2578627","cat":"语句表达","stem":"从土地开发（农业经济时代的“活动对象”），到技术开发（工业经济形态的“活动方式”），再到素质提升（知识经济形态的“活动主体”），是随着经济形态的时间历时性演进，由“客体”向“主体”不断迁移的空间秩序性的发展结果。只有在知识经济形态下，人的实践活动要素——实践主体（知识结构）、实践方式（专业技能）、实践对象（职业责任）和实践目的（创新能力），才能构成一个具有内在联系的有机价值整体。这既是提升素质生产力的重要原因，也是强调创新驱动的依据所在。\n这段文字最后一句话中划横线的“这”指的是：","options":{"A":"从农业经济的“活动对象”到工业经济的“活动方式”，再到知识经济的“活动主体”，三者构成一个价值整体","B":"在知识经济形态下，人的实践活动要素——实践主体、实践方式、实践对象、实践目的本身就是一个价值整体","C":"农业经济、工业经济、知识经济，随着经济形态的历时性演进，逐渐构成一个具有内在联系的有机价值整体","D":"知识经济将人的实践活动要素——实践的主体、方式、对象和目的构成一个具有内在联系的有机价值整体"},"answer":"D","explanation":"代词出现在文段的结尾，需结合前文进行判断。文段首先说明经济形态从高到低的时间历时性演进就是“客体”向“主体”的不断迁移，即随着经济形态的演进，“人的实践活动要素”中的“主体”越来越凸显，强调的是人的实践活动，然后用条件句说明“知识经济形态”是人的实践各要素构成有机价值整体的必要条件，依然还是在说人的实践活动，并且强调人的活动依靠知识经济形态，由前文可知，“这”应指代前面条件句的内容，即在知识经济条件下，人的实践活动要素构成有机价值整体，对应D项。\nA项的“三者构成一个价值整体”、C项的“逐渐构成······有机价值整体”与文意不符，排除；\nB项，“本身就是”不符文意，文段强调是“在知识经济形态下”，四者才能构成有机价值整体，而不是说四者是一个价值整体，排除。\n故正确答案为D。\n【文段出处】《刘梓良 | 从实践哲学思维看卓越全球城市建设》","no":57,"missingImage":false},{"type":"question","qid":"2578039","cat":"片段阅读","stem":"大多数星系正在远离我们而去，其退行速度（红移）和星系的距离成正比。这一比例系数如今被称为哈勃常数，它表示着宇宙当前的膨胀速度。观测宇宙学的核心任务之一就是测量距离与红移的关系，它描述宇宙膨胀的历史，回答关于宇宙年龄、几何、组成成分等基本问题，甚至能够检验很多新物理预言。在天文观测中，遥远天体的红移可以精确获得，但距离的精确测量从来都是天文学家最大的难题。\n接下来作者最有可能讨论的是：","options":{"A":"天文学家如何精确测量距离","B":"天文学家如何精确测量红移","C":"在距离测量方面遇到的困难","D":"在距离测量方面获得的突破"},"answer":"A","explanation":"根据提问方式可知，本题为接语选择题，重点关注文段尾句，把握尾句的核心话题。尾句通过转折词“但”强调天文学家面临“距离的精确测量”的难题，因此文段接下来也应该围绕“天文学家”和“距离的精确测量”两个话题展开论述，可阐述解决方法，对应A项。 \nB项，“精确测量红移”为尾句转折前的话题，并非尾句的核心话题，排除；\nC、D两项，尾句强调的是“距离的精确测量”而非“距离测量”且未提到另一个核心话题“天文学家”，均排除。\n故正确答案为A。\n【文段出处】中国科学院《天文学家首次实现类星体几何距离测量》","no":58,"missingImage":false},{"type":"question","qid":"2577953","cat":"语句表达","stem":"VR技术是Virtual Reality（虚拟现实技术）的英文缩写，近年来，我国的VR技术不断发展，并在医疗、教育、智能制造等行业中得到广泛的运用。5G网络会大大提升虚拟现实体验的仿真度、沉浸感和交互性，这将促进虚拟现实产业的进一步发展。\n文末划横线的“这”指的是：","options":{"A":"中国VR技术的不断发展","B":"VR技术在各行各业中的运用","C":"5G网络所带来的更完美感受","D":"5G网络商用范围的扩大"},"answer":"C","explanation":"根据提问方式，本题为词句理解题，应定位代词的位置，去前文查找指代的内容。文段开篇引入VR技术这一话题，并介绍了VR技术，即虚拟现实技术，在我国的发展和应用。后指出5G网络可给虚拟现实体验更好的感受，再结合“这将促进虚拟现实产业的进一步发展”，故能促进虚拟现实产业的进一步发展的应当是“5G网络所带来的更完美感受”，对应C项。\nA、B两项，都是引入话题之后背景铺垫的内容，且后文“促进虚拟现实产业的进一步发展”应该是强调5G对虚拟现实产业的促进作用，均没有提到核心话题5G，排除。\nD项，属于无中生有，排除。 \n故正确答案为C。","no":59,"missingImage":false},{"type":"question","qid":"2577960","cat":"片段阅读","stem":"糖皮质激素是由人体肾上腺皮质分泌生成的一种类固醇激素，具有调节糖、脂肪和蛋白质的生物合成和代谢的作用，称其为“糖皮质激素”是因为其调节糖类代谢的活性最早为人们所认识。此外，糖皮质激素也可对炎症反应起调控作用，因而常被用作抗炎药物治疗免疫系统过激反应导致的疾病，例如过敏、哮喘和类风湿关节炎。糖皮质激素还常用于对抗癌症患者体内的炎症。在细胞内，糖皮质激素需通过与糖皮质激素受体的相互作用来发挥其生理功能。\n这段文字主要介绍：","options":{"A":"糖皮质激素的定义","B":"糖皮质激素的功用","C":"糖皮质激素的特征","D":"糖皮质激素的性质"},"answer":"B","explanation":"文段开头向我们说明糖皮质激素具有调节糖、脂肪和蛋白质的生物合成和代谢的作用。接下来通过“此外”表示并列，向我们讲述了糖皮质激素对炎症反应的调控作用，接下来用“还常用于”继续阐述糖皮质激素的作用，最后再继续阐述这些功能如何发挥。因此该文段整体上可认为是一个并列文段，提取共性，即主要向我们介绍了糖皮质激素的功能作用，对应B项。\nA项，对应文段开头，并列的前半部分，表述片面，排除。\nC、D两项，原文在特征以及性质方面均没有明确的表述，无中生有，排除。\n故正确答案为B。","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2578527","cat":"数学运算","stem":"小李一家3人进行抢红包游戏，每人发1个红包。结果每人抢得金额总额一致，均为100元，刚巧3人所发红包金额为互不相同整数且成等差数列。问3人中所发红包金额最多的可能是多少元？","options":{"A":"197","B":"198","C":"199","D":"200"},"answer":"C","explanation":"根据题意，“每人抢得金额总额一致，均为100元”，那么三人红包的总额\u003cimg data-k=\"4456d3b7af8a\">元，“3人所发红包金额为互不相同整数且成等差数列”，则中间的金额应为三个红包的总额平均数100元，想要最大的红包金额最多，则最小的红包金额应该为最小，3人每人都发1个红包，金额不能为0元，那么最小金额为1元，则最大的红包金额为\u003cimg data-k=\"d71d9ddebc71\">\u003cimg data-k=\"425b37dbec3b\">元。\n故正确答案为C。\n备注：本题问法不够严谨，题目的本意应为金额最大的红包，金额最多是多少元。","no":61,"missingImage":false},{"type":"question","qid":"2577876","cat":"数学运算","stem":"某医疗器械公司为完成一批口罩订单生产任务，先期投产了A和B两条生产线，A和B的工作效率之比为2：3，计划8天可完成订单生产任务，两天后公司又对这批订单投产了生产线C，A和C的工作效率之比为2：1，问该批口罩订单任务将提前几天完成？","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"A","explanation":"根据题意，A、B生产线工作效率之比为2：3，A、C生产线工作效率之比为2：1，则A、B、C三条生产线工作效率之比为2：3：1。赋值A、B、C三条生产线工作效率分别为2、3、1，则生产任务总量\u003cimg data-k=\"cd348e3506ee\">。A、B两条生产线工作两天后，又投产生产线C，因此完成任务还需\u003cimg data-k=\"525a83fda641\">天，则该批口罩订单任务将提前\u003cimg data-k=\"77b6e43dcc2c\">天完成。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"2577879","cat":"数学运算","stem":"红星中学高二年级在本次期末考试中竞争激烈，年级前七名的三科（语文、数学、英语）平均成绩构成公差为1的等差数列，第七、八、九名的平均成绩既构成等差数列，又构成等比数列，张龙位列第十，与第九名相差1分，张龙的英语成绩为121分，但老师误登记为112分。那么，张龙的名次本该是：","options":{"A":"第四","B":"第五","C":"第七","D":"第八"},"answer":"B","explanation":"根据题意，第七、八、九名的平均成绩构成等差数列，设分别为\u003cimg data-k=\"f106db8c9ea2\">、\u003cimg data-k=\"f82036fad5c4\">、\u003cimg data-k=\"829c0fee6e2b\">，因三人的平均成绩又构成等比数列，则\u003cimg data-k=\"71382f4f5928\">，解得\u003cimg data-k=\"dd4132dae44a\">，即第七、八、九名的平均成绩均为\u003cimg data-k=\"f82036fad5c4\">。张龙平均成绩为\u003cimg data-k=\"2584484f3f56\">，因为英语成绩实为121分，误登记为112分，则三科平均成绩应比目前平均成绩多\u003cimg data-k=\"2b494cbc61bb\">分，实为\u003cimg data-k=\"c8e531f2fe58\">。前七名平均成绩构成公差为1的等差数列，从高到低分别为\u003cimg data-k=\"79f744fbc25d\">、\u003cimg data-k=\"7a8fa761a063\">、\u003cimg data-k=\"1e1eda5c63ca\">、\u003cimg data-k=\"8a6427f368f8\">、\u003cimg data-k=\"52689eb5f099\">、\u003cimg data-k=\"7eaad56d7125\">、\u003cimg data-k=\"f82036fad5c4\">，张龙实际成绩为\u003cimg data-k=\"52689eb5f099\">，名次本该是并列第五名。\n故正确答案为B。","no":63,"missingImage":false},{"type":"question","qid":"2577867","cat":"数学运算","stem":"某水果经销商到一山区水果基地采购猕猴桃和苹果。猕猴桃和苹果的采购价分别为10元/斤和4元/斤，销售价分别为25元/斤和12元/斤。已知该经销商在本次经营中获利40000元，每种水果采购都超过500斤且为整数。那么该经销商的最佳投入资金是：","options":{"A":"20000元","B":"21260元","C":"21300元","D":"21280元"},"answer":"B","explanation":"根据题意，设采购了猕猴桃、苹果分别\u003cimg data-k=\"5320a525f2bc\">、\u003cimg data-k=\"c1beececd683\">斤，根据获利40000元为等量关系列方程，则有\u003cimg data-k=\"c47c975cdf11\">\u003cimg data-k=\"d9de58e5bbb1\">，化简得：\u003cimg data-k=\"098cdae458f9\">，\u003cimg data-k=\"469496e52078\">和40000都是8的倍数，则\u003cimg data-k=\"5320a525f2bc\">是8的倍数；“最佳投入资金”即尽可能投入较少资金，猕猴桃利润率为\u003cimg data-k=\"665dcae2c68f\">，苹果利润率为\u003cimg data-k=\"1971190fd3f5\">。则利润率低的猕猴桃数量应该尽量少，又因为题干说明每种水果采购都超过500斤且为整数，则\u003cimg data-k=\"5320a525f2bc\">最少为504，解得\u003cimg data-k=\"7c38dbc59e40\">，因此最佳投入资金为\u003cimg data-k=\"60891ead680c\">元。\n故正确答案为B。","no":64,"missingImage":false},{"type":"question","qid":"2577871","cat":"数学运算","stem":"甲、乙、丙三人沿着长为500米，宽为250米的长方形场地跑步，三人以2：1：3的速度之比匀速顺时针跑步，当甲开跑时乙刚跑完\u003cimg data-k=\"cbb18cb5350d\">圈，丙开跑时甲跑了100米。问当乙跑完2圈时，甲与丙的位置关系如何？","options":{"A":"丙领先甲2350米","B":"丙领先甲2450米","C":"丙领先甲2900米","D":"丙领先甲3000米"},"answer":"A","explanation":"长方形周长为\u003cimg data-k=\"81af3749cd05\">米；乙比甲提前开跑\u003cimg data-k=\"f9575786b576\">米；甲比丙提前开跑100米；根据甲、乙、丙的速度之比为2：1：3，则乙比丙提前开跑\u003cimg data-k=\"711987cb84a9\">米；乙跑完2圈即\u003cimg data-k=\"a63ed5d5d6a1\">米，此时甲跑了\u003cimg data-k=\"163543e9bf4c\">米，丙跑了\u003cimg data-k=\"8ecda9c5ce2e\">米，因此，丙领先甲\u003cimg data-k=\"02e1612e4f63\">米。\n故正确答案为A。","no":65,"missingImage":false},{"type":"question","qid":"2578523","cat":"数学运算","stem":"某药材公司以每千克8元的价格收购了5000千克药材，深加工后得到合格品和废料，合格品分为一、二、三等品，其比例为1：3：6，每千克售价分别为80元、50元、20元，废料价值为零。公司在加工中需投入其他成本20000元，最终获利108000元。问加工中药材的废品率是多少？","options":{"A":"\u003cimg data-k=\"1a4b9a27904c\">","B":"\u003cimg data-k=\"0cea19887188\">","C":"\u003cimg data-k=\"363071dac4a0\">","D":"\u003cimg data-k=\"b956f6c8ed4d\">"},"answer":"B","explanation":"由题干“合格品分为一、二、三等品，其比例为1：3：6”，设一、二、三等合格品分别为\u003cimg data-k=\"5320a525f2bc\">千克，\u003cimg data-k=\"42136d7babe7\">千克，\u003cimg data-k=\"10f581b287e9\">千克，根据公式：总利润\u003cimg data-k=\"710b0aa3c519\">，可得\u003cimg data-k=\"8e15300b3db5\">\u003cimg data-k=\"5f935231adce\">\u003cimg data-k=\"1b8f24d491ee\">，解得\u003cimg data-k=\"39eaeff9531a\">，则合格品\u003cimg data-k=\"067c93e403f4\">\u003cimg data-k=\"a05a210f2cfd\">千克，废料\u003cimg data-k=\"63f486f3375f\">千克，则废品率\u003cimg data-k=\"262f158f19a6\">。\n故正确答案为B。","no":66,"missingImage":false},{"type":"question","qid":"2577863","cat":"数学运算","stem":"从某物流园区开出6辆货车，这6辆货车的平均装货量为62吨。已知每辆货车载重量各不相同且均为整数，最重的装载了71吨，最轻的装载了54吨。问这6辆货车中装货第三重的卡车最少要装多少吨？","options":{"A":"59","B":"60","C":"61","D":"62"},"answer":"B","explanation":"由题意可知，6辆车载货总量为\u003cimg data-k=\"f067590401c2\">吨，设装货第三重的卡车装载了\u003cimg data-k=\"5320a525f2bc\">吨，要使\u003cimg data-k=\"5320a525f2bc\">取值尽量小，则其他货车装载量应尽量多，可列表为：\n\u003cimg data-k=\"f60fa98a4f09\" style=\"max-width:700px\">\n可列式为：\u003cimg data-k=\"556ab95bf1cb\">\u003cimg data-k=\"dda79621ef20\">，解得\u003cimg data-k=\"fa5ab4c66f80\">，即装货第三重的卡车最少要装60吨。\n故正确答案为B。","no":67,"missingImage":false},{"type":"question","qid":"2577866","cat":"数学运算","stem":"春节期间，省图书馆邀请多位书法老师免费为读者书写春联。现场书写的春联中有188副不是刘老师书写的，有219副不是陈老师书写的，刘、陈两位老师今年一共书写了311副春联。问陈老师今年一共书写了多少副春联？","options":{"A":"208","B":"171","C":"140","D":"126"},"answer":"C","explanation":"设各位书法老师共写了\u003cimg data-k=\"5320a525f2bc\">副春联，可列式为\u003cimg data-k=\"732208d2e431\">，解得\u003cimg data-k=\"18a3731693a2\">，则陈老师写了\u003cimg data-k=\"f8c1dc557fb5\">副。\n故正确答案为C。","no":68,"missingImage":false},{"type":"question","qid":"2577862","cat":"数学运算","stem":"统计学专业学生正在学习《博弈论》，老师给每个学生发了一张卡片，要求每个学生在卡片上随机地从1到100中写下一个数，谁写下的数离他们的平均数的二分之一最接近就胜出，已知该专业共50人，问写下哪个数最可能胜出？","options":{"A":"12","B":"25","C":"50","D":"60"},"answer":"B","explanation":"每人随机写下一个数字，则所写数字越多，他们的平均数将越接近于1-100的平均数即\u003cimg data-k=\"65f819c07a03\">，平均数的二分之一为\u003cimg data-k=\"5b3aa4e5895a\">，与B项最接近，可知写下25最有可能胜出。\n故正确答案为B。\n备注：写数具有随机性，写的越多，越接近于平均数。如果每个学生都知道此结论，那么他们所写的数字会围绕25附近，此时取胜的数字为12.5，与A项最接近；如果所有学生都考虑到这一点，则会围绕12附近来写，此时取胜的为6，以此类推，博弈结果将越来越小，趋近于1，本题没有对应选项。且题干中只强调了学生随机写数的情况，因此粉笔倾向于不考虑博弈的情况，只把它当作纯粹的数学题来给结果。","no":69,"missingImage":false},{"type":"question","qid":"2578533","cat":"数学运算","stem":"某单位开展“我身边的榜样”评选活动，现对3名候选人甲、乙、丙进行不记名投票，投票要求详见选票。这3名候选人的得票数（不考虑是否有效）分别为总票数的\u003cimg data-k=\"22c8d6c4b460\">、\u003cimg data-k=\"77c9df82ee00\">、\u003cimg data-k=\"042488f8a2ca\">，则本次投票的有效率（有效票数与总票数的比值）最高可能为：\n\u003cimg data-k=\"fd74def91046\" style=\"max-width:690px\">","options":{"A":"\u003cimg data-k=\"6278234c153c\">","B":"\u003cimg data-k=\"22c8d6c4b460\">","C":"\u003cimg data-k=\"3ee87c322011\">","D":"\u003cimg data-k=\"04556babf3ab\">"},"answer":"C","explanation":"方法一：赋值总票数为100，那么甲、乙、丙获得的票数分别为88、70、46。未投甲的票数为\u003cimg data-k=\"fb1b24a5e3c3\">；未投乙的票数为\u003cimg data-k=\"c5db6efc697a\">；未投丙的票数为\u003cimg data-k=\"ded14e842fae\">。无效投票为甲、乙、丙三者同时被选。如果有效投票率最高，那么无效票数应最低。无效票数最低\u003cimg data-k=\"a4bbabdd6fb8\">，此时有效票数最高为96，因此有效率最高可能为\u003cimg data-k=\"3ee87c322011\">。\n方法二：设投1票的人数占比为\u003cimg data-k=\"5320a525f2bc\">，投2票的人数占比为\u003cimg data-k=\"c1beececd683\">，投3票的人数占比为\u003cimg data-k=\"08caa03ce8e3\">，则：\n\u003cimg data-k=\"2eb2d8a41eee\">······①，\n\u003cimg data-k=\"022c3668126e\">······②；\n联立①②可得：\u003cimg data-k=\"4c272a9902b6\">，\u003cimg data-k=\"208e55ecf017\">，要想有效投票率最高，即无效票数占比应尽可能小，也就是\u003cimg data-k=\"08caa03ce8e3\">尽可能小，当\u003cimg data-k=\"da8a0319c49c\">时，\u003cimg data-k=\"08caa03ce8e3\">最小为\u003cimg data-k=\"0cea19887188\">，所以有效投票率最高\u003cimg data-k=\"e282c9bbc82e\">。\n故正确答案为C。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"2578703","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"026f4f988138\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，且无明显属性规律，优先考虑数量规律。由于图形封闭面明显，优先考虑数面的数量。观察发现，题干图形面的数量依次为0、1、2、3，构成了递增的等差数列，因此？处图形面的个数应为4。A项面的个数为4，B项面的个数为5，C项面的个数为3，D项面的个数为6，只有A项符合要求。\n故正确答案为A。","no":71,"missingImage":false},{"type":"question","qid":"2578095","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，所给四个选项中分类正确的一项是：\n\u003cimg data-k=\"9cde8f0397ee\" style=\"max-width:484px\">","options":{"A":"①②③；④⑤⑥","B":"①②④；③⑤⑥","C":"①②⑤；③④⑥","D":"①⑤⑥；②③④"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图①、图②均为生活化图形，可以考虑部分数。其中，图①②⑤均由多部分组成，图③④⑥均由一部分组成。因此，图①②⑤为一组、图③④⑥为一组。\n注：分组分类题目中一组为一部分、一组为多部分的规律并不严谨，但此题出现明显生活化图形，无其他明显规律，且在以往的考试中确有出现过在考查部分数的知识点时，分为一部分与多部分两组的情况，故此题粉笔倾向于根据部分数进行分组分类。\n故正确答案为C。","no":72,"missingImage":false},{"type":"question","qid":"2578697","cat":"图形推理","stem":"下列立体图形，其视图（正视图、俯视图、侧视图）不可能是所给四个选项中的哪一项？\n\u003cimg data-k=\"f89a071f8120\" style=\"max-width:582px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查三视图:\nA项，从前往后看可以看到，为主视图，排除；\nB项，从右往左看可以看到，为右视图，排除；\nC项，从上往下看可以看到，为俯视图，排除；\n本题为选非题，故正确答案选D。","no":73,"missingImage":false},{"type":"question","qid":"2578711","cat":"类比推理","stem":"从所给的四个选项中，选择最合适的一项填入问号1和问号2处，使之具有一定规律。\n\u003cimg data-k=\"cebfeaec79a5\" style=\"max-width:627px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题为九宫格题目。元素组成相同，优先考虑位置规律。根据“？”部分都是2×2宫格，观察发现题干其余部分2×2宫格形式当中包含的数字相同，所以考虑2×2宫格的位置关系。\n观察发现九宫格中“米”字的两端的2×2宫格完全相同（如下图中相同颜色标记的图形完全相同），所以1图和2图中的两个图形应该完全相同，只有D项符合。\n\u003cimg data-k=\"698a073d015c\" style=\"max-width:332px\">\n故正确答案为D。","no":74,"missingImage":false},{"type":"question","qid":"2578715","cat":"图形推理","stem":"从下列四个图形中，找出一个和其他三个具有不同规律的图形。\n\u003cimg data-k=\"0923d3aa754d\" style=\"max-width:522px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题让我们找出一个和其他三个具有不同规律的图形。\n解析一：观察发现，题干四个图形整体看起来很规整，因此考虑对称性，其中A、C、D选项均是轴对称图形，B选项两侧不对称，不是轴对称图形，与题干其他图形存在不同规律。\n故正确答案为B。\n解析二：观察发现，题干图形趋向于生活化，因此考虑部分数。其中B、C、D选项中图形都是一部分，A选项中图形是两部分，与题干其他图形存在不同规律。\n故正确答案选A。\n由于题干图形对称性更为明显，所以倾向考查对称，如果想考部分数，图形没必要出的这么对称，并且B选项迷惑性比较强，因此本题答案粉笔倾向于B。","no":75,"missingImage":false},{"type":"question","qid":"2578064","cat":"定义判断","stem":"在高大建筑物顶端安装一根金属棒，并用金属线与埋在地下的金属板连接起来，通过金属棒尖端放电，让云层所带的电和地上的电逐渐中和，以保护建筑物免遭雷击。这种做法应用于管理界时被称为避雷针效应，指事先疏导，防患于未然，引领事态积极发展，即善疏则通，能导必安的管理方法。\n根据上述定义，下列做法与避雷针效应无关的是：","options":{"A":"某市推行“全民参与精准找茬”工作破解城市治理盲区漏点，市民怨气少了满意多了","B":"某小区改建车库，物业方广泛地征求了业主的意见，并形成共识，使该工程顺利推进","C":"某地实行“有事好商量”协商议事工作法，解决大量群众关心的事，化解了社会矛盾","D":"某公司将召开员工发展问题研讨会，要求部门主管会前要调查掌握员工发展需求"},"answer":"D","explanation":"第一步：找出定义关键词。\n“事先疏导，防患于未然”、“引领事态积极发展”。\n第二步：逐一分析选项。\nA项：推行“全民参与精准找茬”工作，可以让市民指出城市潜在的治理问题，符合“事先疏导，防患于未然”，市民怨气少了满意多了，反映出该工作的积极效果，也符合“引领事态积极发展”，符合定义，排除；\nB项：物业方在改建车库前广泛地征求了业主的意见，符合“事先疏导，防患于未然”，征求之后，双方达成了共识，使该工程得以顺利推进，也符合“引领事态积极发展”，符合定义，排除；\nC项：“有事好商量”协商议事工作法可以起到协调商讨的作用，减少群众冲突的发生，符合“事先疏导，防患于未然”，这种工作法解决了大量群众关心的事，化解了社会矛盾，也符合“引领事态积极发展”，符合定义，排除；\nD项：公司将召开员工发展问题研讨会，要求部门主管会前要调查掌握员工发展需求，符合“事先疏导，防患于未然”，但并未提及员工是否会有好的发展，不符合“引领事态积极发展”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"2578068","cat":"定义判断","stem":"闯入性思维是指一些非自主的、反复出现的、无规律的进入个体大脑的干扰性想法，会造成一系列适应问题并诱发负面情绪，包括焦虑、抑郁和强迫症等。\n根据上述定义，下列属于闯入性思维的是：","options":{"A":"每到年底，在外地工作的小孟都要为回不回老家过年而纠结，并因此而情绪烦躁","B":"这段时期股市波动较大，股民老张的心情也像股票指数一样起伏难料，焦虑至极","C":"小强在上课的时候，头脑中总是出现网络游戏的画面，这让他很难静下心来学习","D":"一想到完不成销售任务所带来的负面后果，小程都感到一阵阵的沮丧"},"answer":"C","explanation":"第一步：找出定义关键词。\n“非自主的、反复出现的、无规律的”、“干扰性想法”、“造成一系列适应问题”。\n第二步：逐一分析选项。\nA项：小孟为回不回老家过年而纠结，是小孟自主的想法，不符合“非自主的、反复出现的、无规律的”、“干扰性想法”，不符合定义，排除；\nB项：股民老张的心情像股票指数一样起伏难料，但心情不是“想法”，不符合“非自主的、反复出现的、无规律的”、“干扰性想法”，不符合定义，排除；\nC项：小强在上课时头脑中总是出现网络游戏的画面，符合“非自主的、反复出现的、无规律的”，这让他很难静下心来学习，符合“干扰性想法”、“造成一系列适应问题”，符合定义，当选；\nD项：一想到完不成销售任务所带来的负面后果，是小程自主的想法，不符合“非自主的、反复出现的、无规律的”、“干扰性想法”，不符合定义，排除。\n故正确答案为C。","no":77,"missingImage":false},{"type":"question","qid":"2578709","cat":"定义判断","stem":"情绪惰性，是指个体当前情绪状态能被之前情绪状态所预测的程度，预测程度越大则反映情绪惰性水平越高，情绪惰性作为情绪动态性指标之一反映了情绪变化的速度。\n根据上述定义，下列情形属于情绪惰性的是：","options":{"A":"冬季往往容易使人情绪低落，所以这个冬天也不会例外","B":"调皮的小铭被老师批评之后终于老实了，随后几天都一直规规矩矩的","C":"自从万师傅的老伴儿半年前去世后他就一直很忧郁，估计一时半会儿好不起来","D":"自从首长做了战时动员令之后，整个工厂的工人都保持着激昂的心情努力生产"},"answer":"C","explanation":"第一步：找出定义关键词。\n“个体当前情绪状态”、“能被之前情绪状态所预测的程度，预测程度越大则反映情绪惰性水平越高”。\n第二步：逐一分析选项。\nA项：冬季使人情绪低落，这个冬天也不例外，只是体现冬天的普遍情绪状态，没有指明“个体当前情绪状态”，并不能说明预测程度到底怎么样，不符合“能被之前情绪状态所预测的程度，预测程度越大则反映情绪惰性水平越高”，不符合定义，排除； \nB项：小铭被批评之后就老实了，之后几天也都规规矩矩的，没有体现出通过之前情绪进行预测的过程，不符合“能被之前情绪状态所预测的程度，预测程度越大则反映情绪惰性水平越高”，不符合定义，排除； \nC项：万师傅在老伴儿去世后一直很忧郁，估计一时半会好不了，既体现了当前的情绪状态，又体现了能被之前的情绪所预测，符合“个体当前情绪状态”、“能被之前情绪状态所预测的程度，预测程度越大则反映情绪惰性水平越高”，符合定义，当选；\nD项：工人们在战时动员令后保持着激昂的心情努力生产，并没有体现出通过之前情绪进行预测的过程，不符合“能被之前情绪状态所预测的程度，预测程度越大则反映情绪惰性水平越高”，不符合定义，排除。\n故正确答案为C。","no":78,"missingImage":false},{"type":"question","qid":"2578084","cat":"定义判断","stem":"员工绿色行为是指组织中员工展现的一系列旨在保护生态环境，降低个人活动对自然环境造成负面影响的行为，这些行为是组织正式绿色管理计划的重要补充，能提高组织绿色管理措施的效率，最终有利于环境的可持续发展。\n根据上述定义，下列属于员工绿色行为的是：","options":{"A":"公司员工自觉遵守公司关于垃圾分类的规定","B":"部门经理经常利用废纸打印一些非正式文件","C":"办公室的一位女员工宁愿忍受高温也不愿开冷气，她认为这样更健康","D":"公司保洁员经常把垃圾箱内的废塑料瓶收集起来，下班时顺便带回家"},"answer":"B","explanation":"第一步：找出定义关键词。\n“组织中员工展现的一系列旨在保护生态环境，降低个人活动对自然环境造成负面影响”、“组织正式绿色管理计划的重要补充”、“提高组织绿色管理措施的效率，最终有利于环境的可持续发展”。\n第二步：逐一分析选项。\nA项：公司员工自觉遵守公司关于垃圾分类的规定，说明是公司规定的，不是员工自愿的，不符合“组织中员工展现的一系列旨在保护生态环境，降低个人活动对自然环境造成负面影响”，不符合定义，排除；\nB项：部门经理用废纸打印非正式文件，符合“组织中员工展现的一系列旨在保护生态环境，降低个人活动对自然环境造成负面影响”，也符合“组织正式绿色管理计划的重要补充”、“提高组织绿色管理措施的效率，最终有利于环境的可持续发展”，符合定义，当选；\nC项：办公室的女员工不开冷气，认为这样更健康，是为了自己身体健康并不是为了环保，不符合“组织中员工展现的一系列旨在保护生态环境，降低个人活动对自然环境造成负面影响”，不符合定义，排除；\nD项：公司保洁员把垃圾箱的废塑料瓶收集起来带回家，只是带回了家并不是为了环保，不符合“组织中员工展现的一系列旨在保护生态环境，降低个人活动对自然环境造成负面影响”，不符合定义，排除。\n故正确答案为B。","no":79,"missingImage":false},{"type":"question","qid":"2578077","cat":"定义判断","stem":"社交焦虑障碍，是指个体在可能受到他人审视的一种或多种社交环境中存在持久的强烈恐惧和回避行为。\n根据上述定义，下列属于社交焦虑障碍的是：","options":{"A":"尽管已经获得了公务员招录面试资格，但考虑到排名靠后再加上自己一贯不善于表达，陈某决定放弃这次机会","B":"随着演讲比赛日期的临近，王刚的焦虑和压力也与日俱增，最后他干脆放弃了","C":"小杨一想到下周要当众发言，紧张得一连几天都睡不好觉","D":"大强因为担心被父母催婚，今年春节决定不回家过年"},"answer":"B","explanation":"第一步：找出定义关键词。\n“个体”、“可能受到他人审视的一种或多种社交环境中”、“持久的强烈恐惧”、“回避”。\n第二步：逐一分析选项。\nA项：陈某，符合“个体”，考虑到排名靠后和不善表达而放弃机会，不符合“持久的强烈恐惧”，不符合定义，排除；\nB项：王刚，符合“个体”，演讲比赛临近，符合“可能受到他人审视的一种或多种社交环境中”，他的焦虑压力与日俱增，符合“持久的强烈恐惧”，最后放弃，符合“回避”，符合定义，当选；\nC项：小杨，符合“个体”，想到下周要当众发言，符合“可能受到他人审视的一种或多种社交环境中”，紧张得一连几天睡不好觉，符合“持久的强烈恐惧”，但不符合“回避”，不符合定义，排除；\nD项：大强，符合“个体”，被父母催婚，不符合“可能受到他人审视的一种或多种社交环境中”，不符合定义，排除。\n故正确答案为B。","no":80,"missingImage":false},{"type":"question","qid":"2578061","cat":"定义判断","stem":"类别化是指个体对自身或他人在社会中所处位置的感知和判断，这种感知和判断不仅基于现实社会中社会体制的不同分类标准，也基于自身与他人的社会比较过程。类别化分为社会类别化和自我类别化。社会类别化是个体基于共享的相似性把他人分为不同群体类别的主观心理过程。自我类别化指个体从独立个体到群体成员的过程是通过类别化而得以实现的，是通过“去个性化”实现对群体的归属和成员身份的定位。\n根据上述定义，下列属于自我类别化的是：","options":{"A":"只要每个人的素质提高了，我们整个国民的素质也就自然提高了，因此，重要的是首先做好自己","B":"小明打算应聘公司某职位，但他的父母却认为他更适合做公务员","C":"同学们都说小倩长得像明星，做主播肯定有前途","D":"王医生常常为自己所从事的职业感到无比自豪"},"answer":"D","explanation":"第一步：找出定义关键词。\n类别化：“个体对自身或他人在社会中所处位置的感知和判断”、“基于现实”、“也基于自身与他人的社会比较”；\n社会类别化：“个体基于共享的相似性”、“把他人分为不同群体类别”；\n自我类别化：“个体从独立个体到群体成员”、“实现对群体的归属和成员身份的定位”。\n第二步：逐一分析选项。\nA项：强调做好自己的重要性，并不涉及“个体对自身或他人在社会中所处位置的感知和判断”，不符合题干中任何一个定义，排除；\nB项：父母认为小明适合做公务员，符合“个体基于共享的相似性”、“把他人分为不同群体类别”，符合“社会类别化”定义，不符合“自我类别化”定义，排除；\nC项：同学们觉得小倩长得像明星，做主播有前途，符合“个体基于共享的相似性”、“把他人分为不同群体类别”，符合“社会类别化”定义，不符合“自我类别化”定义，排除；\nD项：王医生为自己所从事的职业感到自豪，符合“个体从独立个体到群体成员”、“实现对群体的归属和成员身份的定位”，符合“自我类别化”定义，当选。\n故正确答案为D。","no":81,"missingImage":false},{"type":"question","qid":"2578082","cat":"定义判断","stem":"越轨创新是指组织在鼓励员工创新的同时，为防止过度自主而偏离组织发展轨道，设置相应的规章制度来约束其创新想法与行为，而一些员工在其创新方案被否决后，仍坚信其创新方案最终会为组织带来收益，并继续隐蔽地进行创新实践的行为。\n根据上述定义，下列属于越轨创新的是：","options":{"A":"服装设计师小王为公司设计了一系列新型饰品，因与公司发展定位不符被否定后，他仍在继续悄悄改进","B":"某高校保安经常到课堂蹭课学外语，队长提醒他这不符合制度规范，他就趁空闲时间偷偷继续过去旁听","C":"因担心影响本职工作，经理反对小刘参加公司举办的创新技能大赛，但小刘仍私下准备着","D":"程序员小张利用上班时间悄悄为朋友设计一款APP软件"},"answer":"A","explanation":"第一步：找出定义关键词。\n“组织鼓励员工创新”、“为防止过度自主而偏离组织发展轨道，设置相应的规章制度来约束其创新想法与行为”、“一些员工在其创新方案被否决后，仍坚信其创新方案最终会为组织带来收益，并继续隐蔽地进行创新实践的行为”。\n第二步：逐一分析选项。\nA项：小王为公司设计新型饰品，因与公司发展定位不符被否定后，他仍在继续悄悄改进，符合“为防止过度自主而偏离组织发展轨道，设置相应的规章制度来约束其创新想法与行为”，也符合“一些员工在其创新方案被否决后，仍坚信其创新方案最终会为组织带来收益，并继续隐蔽地进行创新实践的行为”，符合定义，当选；\nB项：保安去课堂蹭课，队长提醒他不符合制度规范，不符合“组织鼓励员工创新”，不符合定义，排除；\nC项：经理因担心影响本职工作反对小刘参加创新比赛，只是反对，不符合“为防止过度自主而偏离组织发展轨道，设置相应的规章制度来约束其创新想法与行为”，不符合定义，排除；\nD项：小张利用上班时间悄悄为朋友设计APP软件，不符合“坚信其创新方案最终会为组织带来收益”，不符合定义，排除。\n故正确答案为A。","no":82,"missingImage":false},{"type":"question","qid":"2578831","cat":"定义判断","stem":"直接歧视，是指某个行为具有直接的针对性，对于具备不同性别、种族、肤色、年龄以及其他非自我选择特征的人来说有显性的区别对待效果。间接歧视，是指某个看似中立，不针对任何人的行为，却实实在在地在具备不同性别、种族、肤色、年龄以及其他非自我选择特征的人之间造成了区别对待的结果。\n根据上述定义，下列属于间接歧视的是：","options":{"A":"小王是某企业女职工，在一次升为部门经理的考核中，公司最后因为她性格过于柔软而拒绝对其升职","B":"某企业要求所有员工都必须定期参加体能训练，后来企业女职工坚持不下来，纷纷离职，结果该企业成为了著名的“光棍”企业","C":"消防队以便于防火为由，禁止消防队员留长发，导致的结果是基本上没有一线女性消防员","D":"某企业以员工需要经常加班、对体力要求高为由，明确只招40周岁以下的劳动者入职"},"answer":"B","explanation":"第一步：找出定义关键词。\n直接歧视：“某个行为具有直接的针对性”、“不同性别、种族、肤色、年龄以及其他非自我选择特征的人”、“有显性的区别对待”；\n间接歧视：“某个看似中立,不针对任何人的行为”、“实实在在地在具备不同性别、种族、肤色、年龄以及其他非自我选择特征的人”、“造成了区别对待”；\n第二步：逐一分析选项。\nA项：公司以性格过于柔软为由拒绝小王升职，以性格限制，不符合“某个看似中立，不针对任何人的行为”，不符合“间接歧视”定义，排除； \nB项：某企业要求所有员工都必须定期参加体能训练，女员工坚持不下来选择离职，这看似男女平等的标准，因为男女生理条件的不同，实际上把绝大部分的女性排除在外，符合“某个看似中立，不针对任何人的行为”，也符合“实实在在地在具备不同性别、种族、肤色、年龄以及其他非自我选择特征的人”，符合“间接歧视”定义，当选；\nC项：消防队以便于防火为由，禁止消防队员留长发，禁止留长发的规定针对了大部分女性，不符合“某个看似中立，不针对任何人的行为”，女生可以选择留长发或短发，是自我选择特征，不符合“实实在在地在具备不同性别、种族、肤色、年龄以及其他非自我选择特征的人”，不符合“间接歧视”定义，排除；\nD项：企业以员工需要经常加班、对体力要求高为由拒绝40周岁及以上的劳动者，以年龄限制，不符合“某个看似中立，不针对任何人的行为”，不符合“间接歧视”定义，排除。\n故正确答案为B。","no":83,"missingImage":false},{"type":"question","qid":"2578079","cat":"定义判断","stem":"一项新研究显示，中国的消费升级正在延续。所谓消费升级是指消费者对更能满足自己美好物质和精神生活需要的、价格更高的优质商品和服务日益增长的需求。\n根据上述定义，下列最能体现消费升级的是：","options":{"A":"现在收入多了，生活水平高了，人们不再满足于吃饱穿暖，而是想要提高消费档次","B":"某机构研究发现，中国家庭2019年在生活消费品方面的开支预计相较去年增长\u003cimg data-k=\"0ef566a32600\">","C":"中国人对包装食品、饮料、护肤品、洗发水和处方药等快速消费品的消费呈增长趋势","D":"越来越多中国人付出更多成本，去享受健康、快乐、体验好且富有内涵的高端商品和服务"},"answer":"D","explanation":"第一步：找出定义关键词。\n“消费者”、“更能满足自己美好物质和精神生活需要的、价格更高的优质商品和服务”、“日益增长的需求”。\n第二步：逐一分析选项。\nA项：现在收入多了，人们想要提高消费档次，但并不清楚档次提高后的消费是否属于价格更高的优质商品和服务，不符合“更能满足自己美好物质和精神生活需要的、价格更高的优质商品和服务”，不符合定义，排除；\nB项：中国家庭2019年在生活消费品方面的开支预计相较去年增长\u003cimg data-k=\"0ef566a32600\">，生活消费品的开支虽然增长了，但是不清楚这些生活消费品是否是价格更高的优质商品和服务，不符合“更能满足自己美好物质和精神生活需要的、价格更高的优质商品和服务”，不符合定义，排除；\nC项：中国人对快速消费品的消费呈增长趋势，但是不清楚这些增长的快速消费品是否是价格更高的优质的商品和服务，不符合“更能满足自己美好物质和精神生活需要的、价格更高的优质商品和服务”，不符合定义，排除；\nD项：越来越多的中国人付出更多成本，去享受健康、快乐、体验好且富有内涵的高端商品和服务，符合“更能满足自己美好物质和精神生活需要的、价格更高的优质商品和服务”，越来越多的中国人付出成本，也符合“日益增长的需求”，符合定义，当选。\n故正确答案为D。","no":84,"missingImage":false},{"type":"question","qid":"2578701","cat":"定义判断","stem":"和谐管理是组织为了达到其目标，在变动的环境中，围绕社会、市场、政府和职工等和谐主题要素，以优化和不确定性消减为和谐手段提供问题解决方案的实践活动。\n根据上述定义，下列属于和谐管理的是：","options":{"A":"甲公司为在竞标政府项目中获得优势，专门成立公关部门与政府搞关系","B":"丙企业为了治理因生产所造成的环境污染，成立专门基金进行长效维护","C":"乙公司为了让产品赢得市场，孤注一掷花费巨资请明星代言","D":"丁公司为了强化公司的“狼性”文化，经常让员工超时加班"},"answer":"B","explanation":"第一步：找出定义关键词。\n“组织为了达到其目标”、“在变动的环境中，围绕社会、市场、政府和职工等和谐主题要素”、“以优化和不确定性消减为和谐手段提供问题解决方案的实践活动”。\n第二步：逐一分析选项。\nA项：甲公司为在竞标政府项目中获得优势，专门成立公关部门与政府搞关系，有可能会促进企业和政府的关系，也有可能会产生跨越红线的事，不符合“以优化和不确定性消减为和谐手段提供问题解决方案的实践活动”，不符合定义，排除；\nB项：丙企业为了治理因生产所造成的环境污染，成立专门基金进行长效维护，该企业治理自己产生的污染，可以减少因环境污染给企业自身带来的问题，消减了不确定性，符合“以优化和不确定性消减为和谐手段提供问题解决方案的实践活动”，符合定义，当选；\nC项：乙公司为了让产品赢得市场，孤注一掷花费巨资请明星代言，孤注一掷风险较大，不能消减不确定性，不符合“以优化和不确定性消减为和谐手段提供问题解决方案的实践活动”，不符合定义，排除；\nD项：丁公司为了强化公司的“狼性”文化，经常让员工超时加班，会影响员工与公司的关系，增加不确定性，不符合“以优化和不确定性消减为和谐手段提供问题解决方案的实践活动”，不符合定义，排除。\n故正确答案为B。","no":85,"missingImage":false},{"type":"question","qid":"2578073","cat":"类比推理","stem":"筚路蓝缕：艰辛","options":{"A":"焦金流石：干燥","B":"伏虎降龙：强大","C":"毕雨箕风：简陋","D":"集萤映雪：夏夜"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“筚路蓝缕”意思是驾着简陋的柴车，穿着破烂的衣服去开辟山林道路，形容创业的艰苦，与“艰辛”是近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“焦金流石”意思是把金属烤焦，把石头晒化，形容极其炎热难耐，与“干燥”不是近义关系，与题干逻辑关系不一致，排除；\nB项：“伏虎降龙”意思是用威力使猛虎和恶龙屈服，形容力量强大，能战胜一切敌人和困难，与“强大”是近义关系，与题干逻辑关系一致，当选；\nC项：“毕雨箕风”原指民性如星，星好风雨，比喻庶民喜好人主的恩泽，后为颂扬统治者普施仁政之词，与“简陋”不是近义关系，与题干逻辑关系不一致，排除；\nD项：“集萤映雪”意思是家境贫穷，勤学苦读，与“夏夜”不是近义关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":86,"missingImage":false},{"type":"question","qid":"2578105","cat":"类比推理","stem":"摇曳：晃动","options":{"A":"自满：自谦","B":"翻天覆地：一成不变","C":"悲痛：欲绝","D":"顺风转舵：见机行事"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n摇曳指摇荡；晃动指摇晃、摆动，二者为近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：自满多指满足于自己已有的成绩而沾沾自喜的心理状态；自谦指的是自抱谦逊态度，二者为反义关系，与题干逻辑关系不一致，排除；\nB项：翻天覆地形容变化大；一成不变指的是一经形成，不再改变，二者为反义关系，与题干逻辑关系不一致，排除；\nC项：悲痛指悲伤哀痛；欲绝指感情极其强烈的，非常激动的，用来形容悲痛的程度，二者为对应关系，与题干逻辑关系不一致，排除；\nD项：顺风转舵比喻顺着情势改变态度；见机行事指看具体情况灵活办事，二者为近义关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":87,"missingImage":false},{"type":"question","qid":"2578135","cat":"类比推理","stem":"和谐 对于 （    ） 相当于 谦虚 对于 （    ）","options":{"A":"强硬蛮横；安分守己","B":"融洽无间；夜郎自大","C":"波澜不惊；虚怀若谷","D":"动荡不安；趾高气扬"},"answer":"D","explanation":"逐一代入选项。\nA项：强硬蛮横是指骄横跋扈的人，与和谐没有语义关系；安分守己是指规矩本分的人，与谦虚没有语义关系，前后逻辑关系不一致，排除；\nB项：融洽无间是指没有隔阂，相处和谐，与和谐是近义关系；夜郎自大比喻骄傲无知的肤浅自负或自大行为，与谦虚是反义关系，前后逻辑关系不一致，排除；\nC项：波澜不惊是指没有什么变化或曲折，与和谐没有语义关系；虚怀若谷是指十分谦虚，能容纳别人的意见，与谦虚是近义关系，前后逻辑关系不一致，排除；\nD项：动荡不安是指局势不稳定、不平静，与和谐是反义关系；趾高气扬是指骄傲自满，得意忘形的样子，与谦虚是反义关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":88,"missingImage":false},{"type":"question","qid":"2578713","cat":"类比推理","stem":"蛛丝马迹∶鸟迹虫丝","options":{"A":"寒酸落魄∶寒心酸鼻","B":"堆玉积金∶屯粮积草","C":"冰肌玉骨∶劲骨丰肌","D":"挨冻受饿∶担饿受冻"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n蛛丝马迹指事情所留下的隐约可寻的痕迹和线索，鸟迹虫丝比喻极易消失的事物，二者没有明显的语义关系，考虑拆分。蛛丝马迹可拆分为“蛛丝（蜘蛛的丝）”、“马迹（灶马留下的痕迹）”，鸟迹虫丝可拆分为“鸟迹（鸟的爪印）”、“虫丝（虫吐的丝）”，均为偏正结构。\n第二步：判断选项词语间逻辑关系。\nA项：寒酸落魄指穷困、狼狈的样子， “寒酸”和“落魄”都是形容词，与题干逻辑关系不一致，排除；\nB项：堆玉积金指金玉多得可以堆积起来，“堆玉”和“积金”是动宾结构；屯粮积草指储存粮食和草料，“屯粮”和“积草”是动宾结构。四词均非偏正结构，与题干逻辑关系不一致，排除；\nC项：冰肌玉骨指肌骨如同冰玉一般，“冰肌（像冰一样的肌肤）”和“玉骨（像玉一样的肌骨）”是偏正结构；劲骨丰肌指书法有力而丰润，“劲骨（有力的骨架）”和“丰肌（丰满的肌肉）”也是偏正结构，与题干逻辑关系一致，当选；\nD项：挨冻受饿指遭受饥饿与寒冷侵袭，“挨冻”和“受饿”是动宾结构；担饿受冻意思与挨饿受冻相同，且 “担饿”和“受冻”也是动宾结构。四词均非偏正结构，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":89,"missingImage":false},{"type":"question","qid":"2578832","cat":"类比推理","stem":"内核：硬核","options":{"A":"声波：光波","B":"价值：价格","C":"水波：秋波","D":"症结：原因"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n内核是操作系统最基本的部分；硬核原指一种力量感强、节奏激烈的说唱音乐风格，后来引申指“面向核心观众，有一定难度和欣赏门槛的事物”，二者都是核，且内核是本意，硬核具有引申义。\n第二步：判断选项词语间逻辑关系。\nA项：发声体的振动在空气或其他物质中的传播叫做声波；光波是指波长在\u003cimg data-k=\"9286db33bef5\">之间的电磁波，二者为并列关系，且光波无引申义，与题干逻辑关系不一致，排除；\nB项：价值是价格的基础，价格是价值的外在表现，二者为对应关系，且价格无引申义，与题干逻辑关系不一致，排除；\nC项：水波指水的波浪；秋波是秋风中的湖波涟漪，在古人的诗中，秋波引申成为女人的眼睛，二者都是波，且水波是本意，秋波具有引申义，与题干逻辑关系一致，当选；\nD项：症结比喻事情弄坏或不能解决的关键；原因指造成某种结果或引起另一件事情发生的条件，且原因无引申义，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":90,"missingImage":false},{"type":"question","qid":"2578834","cat":"逻辑判断","stem":"有研究发现，低脂饮食的男性比其他男性更易患上睾酮缺乏症。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"试验发现采用地中海饮食的低脂餐谱的男性比其他男性的睾酮水平偏低","B":"睾酮缺乏会出现精力下降、睡眠障碍和脱发等各种健康问题","C":"为了减肥而控制饮食的男性可能会使睾酮水平升高","D":"肥胖会使得男性容易出现睾酮缺乏症，而采用低脂饮食的男性可以减肥"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：低脂饮食的男性比其他男性更易患上睾酮缺乏症。\n本题只有论点没有论据，加强优先考虑补充论据，即解释原因或举例。\n第二步：逐一分析选项。\nA项：采用地中海低脂餐谱的男性比其他男性的睾酮水平偏低，通过举例说明低脂饮食会导致睾酮缺乏，补充论据，当选；\nB项：该项说的是睾酮缺乏造成的后果，论点说的是低脂饮食的男性更容易睾酮缺乏，话题不一致，无法加强，排除；\nC项：该项说的是其他因素导致睾酮水平升高，论点说的是低脂饮食的男性更容易睾酮缺乏，话题不一致，无法加强，排除；\nD项：该项说的是低脂饮食可以减肥，从而可能不会出现睾酮缺乏症，论点说的是低脂饮食的男性更容易睾酮缺乏，话题不一致，无法加强，排除。\n故正确答案为A。","no":91,"missingImage":false},{"type":"question","qid":"2578119","cat":"逻辑判断","stem":"人们常说“要想身体好，天天吃核桃”，多年经验浓缩成的俗话一定有它的道理，最近，有研究证实，多吃核桃的确有益肠道健康，可增加大量的有益肠道细菌，因此对人类心脏有好处。\n上述论证若要成立，必须增加的前提是：","options":{"A":"充满益生菌的肠道，可以长时间地保护人类心脏健康","B":"核桃可以增加肠道益生菌，从而降低患高血压的风险","C":"每天食用核桃可以帮助中
