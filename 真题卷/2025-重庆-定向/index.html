<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2025年重庆市定向选调优秀大学生到基层工作考试《行测》题<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2025-重庆-定向","title":"2025年重庆市定向选调优秀大学生到基层工作考试《行测》题","year":"2025","group":"重庆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"14096533","cat":"时事政治","stem":"党的二十届三中全会明确提出，进一步全面深化改革的总目标是继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。下列与之相关说法正确的是（    ）。\n①2029年——完成二十届三中全会决定提出的改革任务\n②2030年——基本实现国家治理体系和治理能力现代化\n③2035年——全面建成高水平社会主义市场经济体制\n④2049年——基本实现社会主义现代化","options":{"A":"①②","B":"①③","C":"②③","D":"②④"},"answer":"B","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议通过《中共中央关于进一步全面深化改革 推进中国式现代化的决定》（以下简称《决定》）。\n①正确，《决定》在“一、进一步全面深化改革、推进中国式现代化的重大意义和总体要求”中指出：“到二〇二九年中华人民共和国成立八十周年时，完成本决定提出的改革任务。”\n③正确，②④错误，《决定》在“一、进一步全面深化改革、推进中国式现代化的重大意义和总体要求”中指出：“进一步全面深化改革的总目标。继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。到二〇三五年，全面建成高水平社会主义市场经济体制，中国特色社会主义制度更加完善，基本实现国家治理体系和治理能力现代化，基本实现社会主义现代化，为到本世纪中叶全面建成社会主义现代化强国奠定坚实基础。”故②④均为到2035年的目标。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"14096532","cat":"时事政治","stem":"2024年6月28日，国家主席习近平在和平共处五项原则发表70周年纪念大会上的重要讲话中指出，和平共处五项原则是国际关系史上的伟大创举，具有划时代的重大意义。下列关于和平共处五项原则的历史意义，说法错误的是（    ）。","options":{"A":"和平共处五项原则为国际关系重塑树立了法治标杆","B":"和平共处五项原则为国际秩序改革和完善贡献了历史智慧","C":"和平共处五项原则为发展中国家团结合作、联合自强汇聚了强大合力","D":"和平共处五项原则为不同社会制度国家建立和发展关系提供了正确指导"},"answer":"A","explanation":"本题考查理论与政策。\n2024年6月28日，国家主席习近平在和平共处五项原则发表70周年纪念大会上发表《弘扬和平共处五项原则 携手构建人类命运共同体》的重要讲话（以下简称“讲话”）。\nA项错误，讲话指出：“和平共处五项原则为国际关系和国际法治树立了历史标杆。五项原则充分体现联合国宪章宗旨和原则，顺应国际关系发展的时代潮流，符合世界各国人民根本利益。同时，强调国与国关系相互、平等的实践要求，凸显了各国权利、义务、责任相统一的国际法治精神。”故“为国际关系重塑树立了法治标杆”表述有误，应为“为国际关系和国际法治树立了历史标杆”。\nB项正确，讲话指出：“和平共处五项原则为国际秩序改革和完善贡献了历史智慧。五项原则的出发点就是维护弱小国家在强权政治环境中的利益和诉求，旗帜鲜明反帝、反殖、反霸，摒弃了穷兵黩武、以强凌弱的丛林法则，为推动国际秩序朝着更加公正合理方向发展奠定了重要思想基础。”\nC项正确，讲话指出：“和平共处五项原则为发展中国家团结合作、联合自强汇聚了强大合力。五项原则凝结了发展中国家对改变自身命运、追求变革进步的深刻思考。在五项原则激励和鼓舞下，越来越多亚非拉国家相互声援和支持，奋起抵御外来干涉，成功走出独立自主的发展道路。五项原则还促进了南南合作，推动了南北关系改善和发展。”\nD项正确，讲话指出：“和平共处五项原则为不同社会制度国家建立和发展关系提供了正确指导。凡是遵循五项原则，即使社会制度和意识形态不同、历史文化和宗教信仰不同、发展水平和体量规模不同的国家，也完全可以建立和发展相互信任和友好合作的关系。”\n本题为选非题，故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"14096540","cat":"时事政治","stem":"2024年7月4日，国家主席习近平在“上海合作组织+”阿斯塔纳峰会上发表重要讲话，就牢固树立命运共同体意识，始终秉持“上海精神”，坚定不移走契合本国国情、符合本地区实际的发展道路，共同建设更加美好的上海合作组织家园，让各国人民安居、乐业、幸福，提出来相关建议。下列属于建议内容的有几项？（    ）\n①建设团结互信的共同家园\n②建设和平安宁的共同家园\n③建设繁荣发展的共同家园\n④建设公平正义的共同家园\n⑤建设睦邻友好的共同家园\n⑥建设独立自主的共同家园","options":{"A":"3项","B":"4项","C":"5项","D":"6项"},"answer":"C","explanation":"本题考查理论与政策。\n①②③④⑤正确，⑥错误，2024年7月4日，国家主席习近平在阿斯塔纳出席“上海合作组织+”阿斯塔纳峰会并发表题为《携手构建更加美好的上海合作组织家园》的重要讲话。习近平提出五点建议：第一，建设团结互信的共同家园；第二，建设和平安宁的共同家园；第三，建设繁荣发展的共同家园；第四，建设睦邻友好的共同家园；第五，建设公平正义的共同家园。\n综上，属于建议内容的是①②③④⑤，共5项。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"14096544","cat":"新思想","stem":"习近平总书记指出，发展新质生产力是推动高质量发展的内在要求和重要着力点。下列关于新质生产力的说法正确的是（    ）。\n①新质生产力是创新起主导作用\n②具有高科技、高效能、高速度的特征\n③以全要素生产率大幅提升为核心标志\n④以劳动者、劳动资料、劳动对象及其优化组合的跃升为基本内涵","options":{"A":"①②③","B":"①②④","C":"②③④","D":"①③④"},"answer":"D","explanation":"本题考查理论与政策。\n①③④正确，②错误，2024年1月31日，中共中央政治局就扎实推进高质量发展进行第十一次集体学习。习近平总书记强调，新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效能、高质量特征，符合新发展理念的先进生产力质态。它由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生，以劳动者、劳动资料、劳动对象及其优化组合的跃升为基本内涵，以全要素生产率大幅提升为核心标志，特点是创新，关键在质优，本质是先进生产力。故②中“高速度”表述错误，应为“高质量”。\n故正确答案为D。","no":4,"missingImage":false}],"count":4,"answerable":4,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"14096528","cat":"法律常识","stem":"党的二十届三中全会提出，高水平社会主义市场经济体制是中国式现代化的重要保障。关于高水平社会主义市场经济体制，下列说法正确的有几项？（    ）\n①创造更加公平、更有活力的市场环境，实现资源配置效率最优化和效益最大化\n②更好维护市场秩序、弥补市场失灵，畅通国民经济循环，激发全社会内生动力\n③保证各种所有制经济地位平等，依法平等使用生产要素、公平参与市场竞争\n④构建基础制度规则统一、监管公平统一、设施高标准联通的全国统一大市场","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议通过《中共中央关于进一步全面深化改革 推进中国式现代化的决定》（以下简称《决定》）。\n①②正确，《决定》在“二、构建高水平社会主义市场经济体制”中指出：“高水平社会主义市场经济体制是中国式现代化的重要保障。必须更好发挥市场机制作用，创造更加公平、更有活力的市场环境，实现资源配置效率最优化和效益最大化，既‘放得活’”又‘管得住’，更好维护市场秩序、弥补市场失灵，畅通国民经济循环，激发全社会内生动力和创新活力。”\n③错误，《决定》在“二、构建高水平社会主义市场经济体制”中指出：“（5）坚持和落实‘两个毫不动摇’。毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展，保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护，促进各种所有制经济优势互补、共同发展。”故“保证各种所有制经济地位平等”表述有误。\n④正确，《决定》在“二、构建高水平社会主义市场经济体制”中指出：“（6）构建全国统一大市场。推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。加强公平竞争审查刚性约束，强化反垄断和反不正当竞争，清理和废除妨碍全国统一市场和公平竞争的各种规定和做法。”\n综上，①②④正确，共3项。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"14096546","cat":"人文常识","stem":"耐心资本是一种专注于长期投资的资本形式，不以追求短期收益为首要目标，而更重视长期回报的项目或投资活动，通常不受市场短期波动干扰，是对资本回报有较长期限展望且对风险有较高承受力的资本。下列属于耐心资本的是（    ）。\n①定期存款\n②社保基金\n③企业年金\n④个人养老金","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查经济常识。\n①错误，定期存款是银行与存款人双方在存款时事先约定期限、利率，到期后支取本息的存款。虽然有较高的安全性，但其主要目的是为了获取固定的利息收入，并不具备长期投资的特性。\n②③④正确，从全球实践看，耐心资本主要来源于政府投资基金、养老基金（包括社保基金、企业年金、个人养老金）、保险资本以及具有长期投资理念的个人投资者等，是私募创投基金、公募基金等引入中长期资金的重要来源，能够为投资项目、资本市场提供长期稳定的资金支持，是科技创新和产业创新的关键要素保障，是发展新质生产力的重要条件和推动力。\n综上，②③④正确。\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"14096534","cat":"人文常识","stem":"诗句“女贞花白草迷离，江南梅雨时”所描述的天气现象的直接成因是（    ）。","options":{"A":"准静止锋","B":"亚洲高压","C":"热带气旋","D":"东北冷涡"},"answer":"A","explanation":"本题考查地理国情。\n“女贞花白草迷离，江南梅雨时”出自《阮郎归·女贞花白草迷离》，意思是女贞花白点缀在草地之中，星星点点，江南到了梅雨时节。“梅雨”在中国是长江中下游特有的天气现象。\nA项正确，“梅雨”是指每年5月中旬到7月上、中旬的初夏，中国长江中下游指宜昌以东的\u003cimg data-k=\"4752bbd91bde\">范围内或称江淮流域，至日本南部这狭长区域内出现的一段连阴雨天气。此时来自海洋的暖湿气流与北方残留的冷空气在江淮地区相遇。冷暖气流势力相当，无法快速推进或后退，形成相对静止的锋面，即“准静止锋”。暖湿气流沿锋面爬升，冷却凝结，持续产生降雨，形成梅雨天气。\nB项错误，亚洲高压又称西伯利亚高压或蒙古—西伯利亚高压，是多因素的共同作用而产生的在西伯利亚上空形成的大型半永久性高压区。多发生于秋分、冬至之间，冬季位于西伯利亚、蒙古地区的大范围高气压（反气旋）中心，是典型的大陆气团。亚洲高压会推动冷空气南下，导致我国大部分地区寒冷干燥，与夏季的梅雨无关。\nC项错误，热带气旋是生成于热带或副热带洋面上，具有有组织的对流和确定的气旋性环流的非锋面性的天气尺度涡旋的统称。热带气旋本质是低压系统，常见于西太平洋及其临近海域、大西洋和东北太平洋以及印度洋和南太平洋，会带来短时强风、暴雨，但梅雨是持续阴雨。\nD项错误，东北冷涡，是活动于我国东北地区或其附近的高空大型冷涡。它是能够维持3-4天或更长时间的深厚系统。东北冷涡是造成东北地区低温冷害、持续阴雨洪涝、冰雹和雷雨大风等突发性强对流天气的重要天气系统，对东北地区的天气气候有重大影响。与江南梅雨的区域和成因均不相关。\n故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"14096545","cat":"科技常识","stem":"下列成语中所包含的动物错误的是（    ）。","options":{"A":"“蛛丝马迹”中的“马”——灶马","B":"“爱屋及乌”中的“乌”——乌鸦","C":"“豺狼虎豹”中的“豺”——狐狸","D":"“狼奔豕突”中的“豕”——猪"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“蛛丝马迹”出自唐代杨筠松《龙经·武曲星》与清代王家贲《别雅序》，意思是通过蛛丝可寻蜘蛛所在、依灶马痕迹可查其去向，后比喻事情留下的隐约可循的痕迹或线索。这里的“马”并非指哺乳动物马，而是指名为“灶马”的昆虫（学名：突灶螽），常出现在厨房灶台附近。\nB项正确，“爱屋及乌”出自《尚书大传·大战》，意思是因为爱一个人而连带他屋上的乌鸦都一起爱。“乌”指乌鸦，雀形目鸦科鸦属鸟类的通称，中大型鸟类，体长一般在40-70厘米之间。\nC项错误，“豺狼虎豹”泛指危害人畜的各种猛兽，也比喻凶残的恶人。“豺”是真实存在的食肉动物，属于犬科豺属，外形似狼但体型更小、耳朵更圆，性情凶猛，常与狼、虎、豹并列作为凶猛野兽的代表。\nD项正确，“狼奔豕突”出自明末清初归庄《万古愁》，形容成群的坏人乱冲乱撞、肆意骚扰，亦可指敌人仓皇逃窜的状态。“豕”指猪。\n本题为选非题，故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"14096538","cat":"科技常识","stem":"体育运动场景中蕴含了大量的物理知识，下列说法正确的是（    ）。","options":{"A":"人在跑步时有惯性，停下来后惯性消失","B":"大力扣球时，手给球的力大于球给手的力","C":"举着杠铃稳定站立的过程中，人对杠铃做了功","D":"篮球撞击篮板后反弹回来说明了力能改变物体的运动状态"},"answer":"D","explanation":"本题考查科技常识。\nA项错误，物体保持静止状态或匀速直线运动状态的性质，称为惯性。惯性是物体的固有属性，只与物体的质量有关，与运动状态无关。人跑步时有惯性，停下来后质量不变，惯性依然存在。\nB项错误，手给球的力和球给手的力，是一对相互作用力。相互作用力是物理学中描述两个物体间相互作用的力，其基本特征为大小相等、方向相反且作用线重合，遵循同时产生与消失的规律，因此手给球的力和球给手的力大小相等。\nC项错误，物理学中“做功”的两个必要条件：一是作用在物体上的力，二是物体在力的方向上移动了距离。举着杠铃稳定站立时，杠铃受到向上的力，但没有在力的方向上移动距离，有力无距离，不满足做功条件。\nD项正确，物体的运动状态包括速度大小和运动方向，两者任一改变，都属于运动状态改变。篮球撞击篮板前向篮板运动，反弹后向相反方向运动，运动方向发生改变，说明篮板对篮球的力改变了篮球的运动状态。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"14096570","cat":"法律常识","stem":"2023年9月1日，《中华人民共和国无障碍环境建设法》开始正式施行。依据该法，下列说法错误的是（    ）。","options":{"A":"国家鼓励高等学校、中等职业学校等开设无障碍环境建设相关专业和课程","B":"各级人民政府及其有关部门应当为残疾人、老年人获取公共信息提供便利","C":"电视台应当在播出电视节目时配备同步字幕，每周至少播放一次配播手语的新闻节目","D":"停车场应当按照无障碍设施工程建设标准，设置无障碍停车位，并设置显著标志标识"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国无障碍环境建设法》第五十五条第二款规定：“国家鼓励高等学校、中等职业学校等开设无障碍环境建设相关专业和课程，开展无障碍环境建设理论研究、国际交流和实践活动。”\nB项正确，根据《中华人民共和国无障碍环境建设法》第二十九条规定：“各级人民政府及其有关部门应当为残疾人、老年人获取公共信息提供便利；发布涉及自然灾害、事故灾难、公共卫生事件、社会安全事件等突发事件信息时，条件具备的同步采取语音、大字、盲文、手语等无障碍信息交流方式。”\nC项错误，根据《中华人民共和国无障碍环境建设法》第三十条第一款规定：“利用财政资金设立的电视台应当在播出电视节目时配备同步字幕，条件具备的每天至少播放一次配播手语的新闻节目，并逐步扩大配播手语的节目范围。”本项中，电视节目配备同步字幕的前提是利用财政资金设立的电视台；配播手语的新闻节目应当是每天至少播放一次，而非每周。\nD项正确，根据《中华人民共和国无障碍环境建设法》第二十四条第一款规定：“停车场应当按照无障碍设施工程建设标准，设置无障碍停车位，并设置显著标志标识。”\n本题为选非题，故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"14096535","cat":"科技常识","stem":"转基因食品指的是利用转基因生物技术获得的转基因生物品系，并以该转基因生物为直接食品或为原料加工生产的食品。下列与之相关的说法正确的是（    ）。","options":{"A":"2018年，市场上第一个转基因食品出现在英国，是一种保鲜番茄","B":"转基因食品分为植物性转基因食品、动物性转基因食品、原生生物性转基因食品、微生物性转基因食品四类","C":"目前转基因食品对于人体健康是安全的，但将来是否会对人体健康带来负面影响一直存在争议，科学界至今未达成明确的共识","D":"《食品标识管理规定》中明确规定，生产经营转基因食品，食品标识上应显著标示“转基因”字样，否则需要标注“不含转基因”“非转基因”等字样"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，1994年，美国的转基因耐贮藏番茄——“FlavrSavr”获批上市，成为世界上首个被允许销售的转基因食品。该转基因番茄主要通过抑制细胞壁降解或抑制乙烯合成来实现。\nB项错误，转基因食品按原料来源可分为三类：植物源（如转基因大豆、玉米等），动物源（如转基因鱼类等）和微生物源（如转基因微生物发酵制得的奶酪、啤酒等）。该项中“原生生物性转基因食品”并非公认的分类类别，且极少用于食品生产，也未形成商业化的转基因食品品类。\nC项正确，2021年11月24日《中国纪检监察报》文章《转基因技术为保障粮食安全注入新动能——访中国工程院院士吴孔明、万建民》指出：“从国际上看，经济合作与发展组织、世界卫生组织和联合国粮食及农业组织在充分研究后得出结论，目前上市的转基因食品都是安全的。”故目前已商业化的转基因食品对人体健康是安全的。由于转基因技术应用时间较短（仅30余年），关于其长期食用对人体健康的潜在影响（如基因漂移、过敏原变化等），科学界尚未形成完全统一的结论，争议仍在持续。\nD项错误，根据《食品标识管理规定》第十六条第三项：“食品有以下情形之一的，应当在其标识上标注中文说明：（三）属于转基因食品或者含法定转基因原料的；”但“不含转基因”“非转基因”等字样属于反向标注，法规并未要求非转基因食品必须标注此类内容。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"14096543","cat":"人文常识","stem":"厄尔尼诺现象发生时，对我国产生的影响不包括（    ）。","options":{"A":"西北地区冬季平均气温比往年要低","B":"华北地区夏季高温日数达30天以上","C":"秋冬季南方降水量猛增，部分城市出现内涝","D":"黄淮部分地区夏秋连旱，影响粮食产量与质量"},"answer":"A","explanation":"本题考查地理国情。\n“厄尔尼诺现象”是指每隔数年在东太平洋地区出现的海水温度异常升高的现象。东南信风减弱，南北赤道暖流减弱、赤道逆流增强、离岸海水减少，就会造成太平洋东侧地区的冷水上泛减少或停止，甚至被暖流取代，从而形成大范围的海水温度异常增暖的现象。\nA项错误，西北地区位于我国北方，其冬季气温主要取决于冷空气南下的频率和强度。冷空气变弱、南下次数减少，西北地区不仅不会降温，反而会出现“暖冬”，冬季平均气温会比往年偏高，而非偏低。\nB项正确，夏季厄尔尼诺导致副热带高压偏南——华北地区位于副热带高压的北侧，会长期处于副热带高压外围下沉气流控制下，从而使得降水偏少、晴天增多，太阳辐射强，高温日数容易达到30天以上，符合实际影响。\nC项正确，厄尔尼诺秋冬季会让我国南方暖湿气流活跃，暖湿气流从海洋带来大量水汽，与北方南下的弱冷空气在南方交汇，降水量显著增加，部分城市因降雨集中、排水压力大，容易出现内涝，符合实际影响。\nD项正确，厄尔尼诺夏季会导致黄河流域降水偏少，若夏秋季节降水持续不足，易引发“夏秋连旱”，进而影响农作物生长，导致粮食产量和质量下降，符合实际影响。\n本题为选非题，故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"14096550","cat":"人文常识","stem":"下列情形中，劳动者可通过劳动行政部门维护自身合法权益的有几项?（    ）\n①甲企业无故拖欠员工小张工资、奖金等8000余元\n②乙公司要求所有员工遵循企业规定，按工作需求无偿加班\n③丙公司非法限制员工小赵人身自由，强迫其延长工作时间\n④员工小李与丁公司解除劳动合同后，丁公司未依照劳动法给予小李经济补偿","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查法律常识。\n①②④正确，根据《中华人民共和国劳动法》第九十一条第一、二、四项规定：“用人单位有下列侵害劳动者合法权益情形之一的，由劳动行政部门责令支付劳动者的工资报酬、经济补偿，并可以责令支付赔偿金：（一）克扣或者无故拖欠劳动者工资的；（二）拒不支付劳动者延长工作时间工资报酬的；（四）解除劳动合同后，未依照本法规定给予劳动者经济补偿的。”因此，①②④中的劳动者可通过劳动行政部门维护自身合法权益。\n③正确，根据《中华人民共和国劳动法》第三十二条第二项规定：“有下列情形之一的，劳动者可以随时通知用人单位解除劳动合同：（二）用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动的；”第九十条规定：“用人单位违反本法规定，延长劳动者工作时间的，由劳动行政部门给予警告，责令改正，并可以处以罚款。”因此，小赵可通过劳动行政部门维护自身合法权益。\n故①②③④表述正确，共4项。\n故正确答案为D。","no":13,"missingImage":false},{"type":"question","qid":"14096560","cat":"人文常识","stem":"周某单独投资成立润泽水果有限公司，决定不设股东会，也不设董事会，日常经营管理由其亲自负责，同时聘请了3名员工。因市场行情不好，润泽公司一直未能实现盈利，对外拖欠了大量债务。下列与之相关的说法错误的是（    ）。","options":{"A":"周某可以再单独投资设立一家蔬菜公司","B":"债权人可以直接要求周某清偿公司债务","C":"周某负有证明公司财产独立于自己财产的责任","D":"润泽公司可以单独投资设立一家子公司经营水果"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国公司法》第四十二条规定：“有限责任公司由一个以上五十个以下股东出资设立。”《中华人民共和国公司法》并无设立公司股东数量的限制，题中，周某可以再单独投资设立一家蔬菜公司。\nB项错误，根据《中华人民共和国公司法》第三条第一款规定：“公司是企业法人，有独立的法人财产，享有法人财产权。公司以其全部财产对公司的债务承担责任。”题中，润泽水果有限公司以其公司财产承担债务，债权人不得直接要求周某清偿公司债务。\nC项正确，根据《中华人民共和国公司法》第二十三条第三款规定：“只有一个股东的公司，股东不能证明公司财产独立于股东自己的财产的，应当对公司债务承担连带责任。”题中，周某作为一人股东，负有证明公司财产独立于自己财产的责任。\nD项正确，根据《中华人民共和国公司法》第十三条第一款规定：“公司可以设立子公司。子公司具有法人资格，依法独立承担民事责任。”\n本题为选非题，故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"14096548","cat":"经济常识","stem":"田某是一家有限责任公司的股东，在公司设立时以机器设备出资，评估作价80万元，同时以一套房产出资，评估作价420万元。公司成立后第二年，因扩大经营规模的需要，吸收陆某以货币出资200万元入股。第三年年底资产盘查时，公司发现田某作价出资的机器设备在当时实际只值50万元，出资房产因为近两年房地产市场不景气已贬值为360万元。下列与之相关说法正确的是（    ）。","options":{"A":"田某应对机器设备的差额30万元承担补足责任","B":"田某应对房产贬值的差额60万元承担补足责任","C":"陆某应对机器设备的差额30万元承担连带责任","D":"陆某应对房产贬值的差额60万元承担连带责任"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，B、C、D三项错误，根据《中华人民共和国公司法》第五十条规定：“有限责任公司设立时，股东未按照公司章程规定实际缴纳出资，或者实际出资的非货币财产的实际价额显著低于所认缴的出资额的，设立时的其他股东与该股东在出资不足的范围内承担连带责任。”田某在公司设立时以机器设备出资，评估作价80万元，机器设备在当时实际只值50万元，田某应对机器设备的差额30万元承担补足责任，陆某在公司设立时还不是股东，因此，无需对机器设备的差额30万元承担连带责任。田某在公司设立时以房产出资，评估作价420万元，房屋贬值的情形，不属于田某、陆某应对房产贬值的差额60万元承担补足责任的情形。\n故正确答案为A。","no":15,"missingImage":false}],"count":11,"answerable":11,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"18649875","cat":"逻辑填空","stem":"人工智能是引领未来的新兴战略技术之一，气候变化是当今世界面临的最紧迫挑战之一。人工智能革命和绿色能源革命            ，已成为大国竞争必须抢占的科技制高点。我们既期盼更绿色环保的人工智能，也期盼更智能可控的绿色能源，就像期盼盛夏不再酷热难耐。\n填入画横线部分最恰当的一项是（    ）。","options":{"A":"相得益彰","B":"齐头并进","C":"缺一不可","D":"殊途同归"},"answer":"B","explanation":"根据“我们既期盼更绿色环保的人工智能，也期盼更智能可控的绿色能源”可知，横线处应体现人工智能革命和绿色能源革命不分先后，同时进行之意，B项“齐头并进”指不分先后地一齐前进或同时进行，符合文意，当选。A项“相得益彰”指相互配合得好，各方的长处就更能显现，文段并非强调二者配合会有更好的效果，而是强调二者不分先后，同时进行，与文意不符，排除；C项“缺一不可”指两种因素或多种因素中，缺少哪一个也不行，无法体现不分先后，同时进行之意，与文意不符，排除；D项“殊途同归”比喻采用不同方法最终达成相同结果，文段并未体现达到相同效果之意，与文意不符，排除。\n故正确答案为B。\n【文段出处】经济日报《人工智能如何应对气候变化》","no":16,"missingImage":false},{"type":"question","qid":"18649890","cat":"逻辑填空","stem":"如何引导帮助老人更健康地在短视频平台“冲浪”，需要各方努力。有关部门要做好科普宣传，有针对性地指导老人辨别网络骗局、保护个人隐私，增强安全意识。子女也要尽力给予父母更多陪伴，多回家看看，还可帮助他们给手机设置健康模式，从而更好地            ，健康“冲浪”。\n填入画横线部分最恰当的一项是（    ）。","options":{"A":"化险为夷","B":"趋利避害","C":"防微杜渐","D":"未雨绸缪"},"answer":"B","explanation":"根据“更健康地在短视频平台‘冲浪’”“有针对性地指导老人辨别网络骗局、保护个人隐私，增强安全意识”“帮助他们给手机设置健康模式”以及后文“健康‘冲浪’”可知，横线处需要体现出在帮助老人规避网络骗局等安全隐患的同时，也能让他们正常享受短视频平台带来的正面价值。B项“趋利避害”意为趋向有利的一面，避开有害的一面，“趋利”对应享受平台带来的乐趣与便利，“避害”对应前文提及的防范骗局、保护隐私等安全措施，符合文意，当选。\nA项“化险为夷”指使危险的情况或处境变为平安，文段并未涉及老人身处危险之中的语境，与文意不符，排除；\nC项“防微杜渐”指在错误、或坏事刚露出苗头的时候就加以制止，不使其发展，其重点在于对问题苗头的警惕与阻断，但无法涵盖让老人享受短视频好处这层含义，与文意不符，排除；\nD项“未雨绸缪”比喻事先做好准备工作，强调提前做准备，仅体现提前预防之意，未能对应后文让老人享受短视频平台好处的内容，与文意不符，排除。\n故正确答案为B。\n【文段出处】人民政协网《农村老人刷短视频怎样开启“健康模式”？》","no":17,"missingImage":false},{"type":"question","qid":"18649895","cat":"逻辑填空","stem":"即便专注于        的科研之路，也能凭借“有趣的灵魂”让旁人为之瞩目。石教授在《中国化学》期刊封面上把自己P成了补天的女娲，这一创意正是来自其科研设计对轴手性大家族骨架空缺的弥补。在科研这片看似高冷的天空里，用一块            的石头补上了略显空缺的一隅，让学术得以“破圈”。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"理性 巧夺天工","B":"严谨 五彩斑斓","C":"严肃 妙趣横生","D":"枯燥 惟妙惟肖"},"answer":"C","explanation":"本题可从第二空入手，根据“在科研这片看似高冷的天空里，用一块······的石头补上了略显空缺的一隅”及前文“凭借‘有趣的灵魂’让旁人为之瞩目”可知，横线处应体现石教授的创意有趣、生动之意。C项“妙趣横生”指充满了美妙的情趣、意味，符合文意，保留。A项“巧夺天工”指精巧的人工胜过天然，形容技艺极其精巧，B项“五彩斑斓”表示颜色非常好看，色彩相当丰富，D项“惟妙惟肖”指描写或模仿得非常好，非常逼真，但文段侧重创意有趣，均与文意不符，排除。\n第一空，代入验证。根据“即便······也······”可知，横线处应与“有趣”语义相反，C项“严肃”形容严格认真，与“有趣”语义相反，符合文意，当选。\n故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"18649916","cat":"逻辑填空","stem":"天赋基因决定论并不符合人才培养的内在规律。孩子能否成才，关键是要看后天的兴趣与努力。家长与其        天赋基因检测结论，将孩子的未来寄托在不靠谱的“电子算命”上，不如重视孩子自身的兴趣，切实发挥后天培养的作用。只有在学习和生活中逐渐发现孩子的兴趣和特长，            ，鼓励培养，每个孩子才能获得属于自己的成功。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"困惑 顺水推舟","B":"执着 因材施教","C":"纠结 听之任之","D":"迷信 因势利导"},"answer":"D","explanation":"第一空，根据“将孩子的未来寄托在不靠谱的‘电子算命’上”可知，横线处应体现过度信赖之意，且感情色彩偏消极。D项“迷信”泛指盲目地信仰崇拜，感情色彩偏消极，符合文意，且与“电子算命”相呼应，保留。A项“困惑”指感到疑难，不知道该怎么办，C项“纠结”指互相缠绕，均无法体现出过度信赖之意，与文意不符，排除；B项“执着”指固执或拘泥，若置于文段，应添加介词“于”，表述为“执着于天赋基因检测结论”，置于此处用法错误，且无法体现出过度信赖之意，排除。\n第二空，代入验证。根据“发现孩子的兴趣和特长”可知，横线处应体现顺应孩子自身特点加以培养之意，D项“因势利导”指顺着事情的发展趋势加以引导，符合文意，当选。\n故正确答案为D。\n【文段出处】北京青年报《天赋基因检测绝非人才培养捷径》","no":19,"missingImage":false},{"type":"question","qid":"18649894","cat":"逻辑填空","stem":"前进道路上，有人循光而行，有人成为光。各行各业的正能量故事不断涌现，这些榜样            ，笃定前行，以热血和奋斗点亮微光，用自己的方式承担着时代        的责任。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"踔厉奋发 赋予","B":"踵事增华 交托","C":"责无旁贷 托付","D":"义不容辞 给与"},"answer":"A","explanation":"本题可从第二空入手，搭配“时代”“责任”，且根据文意可知，横线处应体现时代将责任交给他人承担之意，A项“赋予”指交给（重大任务、使命等），D项“给与”同“给予”，表达给的意思，均与“时代”“责任”搭配恰当，保留。B项“交托”指交付委托，C项“托付”指委托别人照料或办理，均多与“人”搭配，与“时代”搭配不当，排除。\n第一空，修饰“榜样”，且根据“笃定前行，以热血和奋斗点亮微光”可知，横线处应体现榜样积极行动、热血奋斗的状态，A项“踔厉奋发”形容精神振奋，意气昂扬，符合文意，当选。D项“义不容辞”指道义上不容许推辞、拒绝，常用于形容为了正义事业，敢于挺身而出，不作推辞，无法体现热血奋斗的状态，且后文体现了“承担着责任”，置于此处与后文语义重复，排除。\n故正确答案为A。\n【文段出处】《中新网评：循光而行 看见榜样背后的正能量》","no":20,"missingImage":false},{"type":"question","qid":"18649906","cat":"逻辑填空","stem":"“社会比较”理论认为，人们会为了        自己在社会中的地位、能力和观点等社会特征，而与他人或群体进行比较。通常来说，平行比较有助于形成更为真实和客观的自我认知；下行比较可以提高一个人的自尊心和满足感，让人感到相对        ；上行比较则是一把双刃剑，可能会引发自我        和挫折感，也可能会促使个体努力提升自己。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"评估 优越 贬低","B":"评价 优秀 排斥","C":"品评 优胜 否定","D":"评论 优良 怀疑"},"answer":"A","explanation":"第一空，搭配“地位”“能力”和“观点”，A项“评估”指评议估计，评价，B项“评价”指评定价值高低，与“地位”“能力”“观点”搭配恰当，保留。C项“品评”指评论高下、优劣，强调评论一件东西或事物的好坏，常与“墨宝”“口感”搭配，与“地位”搭配不当，排除；D项“评论”指批评或议论，不符合文意，排除。\n第二空，根据前文“提高一个人的自尊心和满足感”可知，横线处表达下行比较让人感觉自己胜过别人，A项“优越”指优胜，优良，B项“优秀”指非常好，均符合文意，保留。\n第三空，根据“和”可知，横线处应与“挫败感”并列，体现出上行比较可能会让人产生一种自己不好、很失败的自卑感，A项“贬低”指故意对人或事物给与较低的评价，可体现出自卑，符合文意，当选。B项“排斥”指使别的人或事物离开自己这方面，程度过重，排除。\n故正确答案为A。\n【文段出处】科普中国《别再刷短视频了，真的会越刷越抑郁！》","no":21,"missingImage":false},{"type":"question","qid":"18649898","cat":"逻辑填空","stem":"人力筛选海量简历十分费时且          大，不同面试官的标准与意见难以统一，导致评价缺乏          ，而AI工具可以用于概括简历要点、          提取信息，以提升简历筛选的成效。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"随机性 稳定性 针对性","B":"随意性 专业性 选择性","C":"偶然性 客观性 统一化","D":"主观性 公平性 规模化"},"answer":"A","explanation":"第一空，根据“不同面试官的标准与意见难以统一”可知，横线处需体现出人力筛选简历这件事存在很多变量，A项“随机性”、C项“偶然性”、D项“主观性”均可体现，保留。B项“随意性”侧重态度不认真，与文段感情色彩不符，排除。\n第二空，根据“不同面试官的标准与意见难以统一”以及横线前“缺乏”可知，横线处需体现出评价不会变来变去之意，A项“稳定性”可以体现，保留。C项“客观性”、D项“公平性”均无法体现，且文段侧重强调不同面试官的标准与意见难以统一，而非面试官的评价不够客观、公正，排除。\n第三空，代入验证，A项“针对性”置于此处与“概括简历要点”构成并列结构共同体现可以提升简历筛选的成效，符合文意，当选。\n故正确答案为A。\n【文段出处】新华网《“五一”微观察：AI在职场中的这些应用你了解吗？》","no":22,"missingImage":false},{"type":"question","qid":"18649905","cat":"逻辑填空","stem":"今年越来越多骑行爱好者已经从去年的城市骑行，慢慢        为相对专业的公路骑行。从公路骑行所需的公路车整车成交量来看，市场呈现消费        趋势，万元以上高档整车的市场份额        了一倍以上。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"进阶 升级 扩张","B":"转化 上升 增长","C":"进化 换代 扩大","D":"转变 上涨 增加"},"answer":"A","explanation":"第一空，根据“从去年的城市骑行，慢慢······为相对专业的公路骑行”可知，横线处所填词语应体现骑行爱好者骑行方式从相对简单的城市骑行向更具专业性的公路骑行提升转变之意。A项“进阶”指层次或等级提高，C项“进化”指事物由简单到复杂，由低级到高级逐渐发展变化，均符合文意，保留。B项“转化”指变易，改变，D项“转变”指改变，改换，均未能体现向更高层次提升之意，排除。\n第二空，搭配“消费”，A项“升级”指从较低的等级或班级升到较高的等级或班级，与“消费”搭配恰当，保留。C项“换代”指产品在结构、性能等方面比原来的有明显的改进和发展，或指旧的朝代为新的朝代所代替，与“消费”搭配不当，排除。\n第三空，代入验证，A项“扩张”指扩大范围、势力等，置于此处可表示随着市场消费升级，万元以上高档整车在整个市场中所占的份额增长，就如同扩大了势力范围，符合文意，当选。\n故正确答案为A。\n【文段出处】新华网《春日消费正当时，这组数据活力四射！》","no":23,"missingImage":false},{"type":"question","qid":"18649903","cat":"逻辑填空","stem":"没有新漆，没有新瓦，没有被现代审美        过，山西古建筑有时显得过于        。区区一处木头搭建的藻井，古人绘以丹青，饰以琉璃，就呈现出一片璀璨宇宙。千百年后，这些低调的古建筑会冷不丁释放一种审美暴击，让不经意间抬头的游人            。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"侵蚀 拘谨  过目难忘","B":"改造 朴素  心悦诚服","C":"粉饰 陈旧\t 心旷神怡","D":"同化 保守  耳目一新"},"answer":"B","explanation":"第一空，根据“没有新漆，没有新瓦”可知，横线处应体现山西古建筑没有被现代审美改变之意。B项“改造”指原有的事物加以修改或变更，使适合需要，D项“同化”指不相同的事物逐渐变得相近或相同，均符合文意，保留。A项“侵蚀”指逐渐侵害使变坏，侧重于侵害，与文意不符，排除；C项“粉饰”指涂饰表面，掩盖污点或缺点，与文意不符，排除。\n第二空，根据前文“没有新漆，没有新瓦”可知，横线处应体现山西古建筑看起来比较简单、质朴之意。B项“朴素”指朴实，不浮夸，不虚假，符合文意，保留。D项“保守”指维持原状，不求改进，与文意不符，排除。\n第三空，代入验证。B项“心悦诚服”指发自内心的高兴，真心实意地服从或佩服，可体现出游人被古建筑的审美暴击所折服之意，符合文意，当选。\n故正确答案为B。\n【文段出处】新周刊《去一次山西，我被中式审美暴击了》","no":24,"missingImage":false},{"type":"question","qid":"18649913","cat":"逻辑填空","stem":"艺术生活化、生活艺术化对青年群体来说不再只是一个口号，当他们            来获取审美体验和文化记忆时，传统文化不再是高高在上、            ，而是可以触碰，可以体验，可以参与，这比任何        和说教都更有效果，更有意义。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"身体力行 遥不可及 灌输","B":"亲力亲为 望尘莫及 宣传","C":"身临其境 不可向迩 推行","D":"笃志力行 曲高和寡 倡导"},"answer":"A","explanation":"第一空，形容青年群体获取审美体验和文化记忆的方式。根据前文“不再只是一个口号”可知，横线处应体现青年将艺术生活化、生活艺术化变为现实，通过实际行动参与其中。A项“身体力行”意为亲身体验，B项“亲力亲为”强调亲自做事，均符合语境，保留。C项“身临其境”指亲自到达某种境地获得切身感受，侧重真实、生动的感受，D项“笃志力行”意为坚定信念，努力实践，侧重志向坚定，均与文意不符，排除。\n第二空，顿号表示近义并列，“高高在上”形容领导者脱离实际，横线处应表示传统文化不再是难以触碰的。A项“遥不可及”指非常遥远而不可到达，形容难以企及的事物或目标，符合语境，保留。B项“望尘莫及”形容望着远去的人马行走时扬起的阵阵尘土，却不能追上他们，比喻远远地落在了别人的后面，相差甚远，无法追上，一般用于比较的语境中，与文意不符，排除。\n第三空，代入验证。A项“灌输”与“说教”并列，感情色彩均消极，侧重强调一种强制的教育方式，符合语境，当选。\n故正确答案为A。\n【文段出处】经济参考报《文化消费新偏好折射青年一代文化自信》","no":25,"missingImage":false},{"type":"question","qid":"18649900","cat":"片段阅读","stem":"推动资源循环利用和减少环境污染是以旧换新政策的重要目标，通过回收旧的消费品，更好推动经济循环和绿色发展。完善便利的回收体系，是推动消费品以旧换新的重要环节。必须加快建立便捷高效、覆盖广泛、操作便利的消费品回收体系，更好释放消费市场以旧换新的潜力和动力。此外，政府部门还应进一步加强对以旧换新市场的监督和管理，对回收的旧产品进行严格的质量检测和处理。\n这段文字意在强调（    ）。","options":{"A":"以旧换新政策将进一步推动消费的持续增长","B":"推动消费品以旧换新要在“旧”字上做文章","C":"完善的回收体系是推动绿色发展的重要环节","D":"以旧换新行动重在不断创造更多消费新需求"},"answer":"B","explanation":"文段开篇指出通过回收旧的消费品，更好推动经济循环和绿色发展，接着指出完善便利的回收体系是推动消费品以旧换新的重要环节，后文通过并列关联词“此外”引导两方面的对策，强调既要建立消费品回收体系，又要对回收的旧产品进行严格的质量检测和处理，故文段重点强调推动消费品以旧换新需要在完善消费品回收体系和对回收的旧产品进行严格的质量检测和处理等“旧”的方面下功夫，对应B项。\nA项“将进一步推动消费的持续增长”、D项“创造更多消费新需求”文段均未提及，无中生有，排除；\nC项，“完善的回收体系”仅对应并列的一方面内容，表述片面，排除。\n故正确答案为B。\n【文段出处】临泽县人民政府《以旧换新 诠释消费新活力》","no":26,"missingImage":false},{"type":"question","qid":"18649908","cat":"片段阅读","stem":"购买盲盒前，个体无法知道其具体款式，这一信息缺口能激发消费者的好奇心。同时，由于产品的非确定性，消费者们常对其展开联合推测并互相分享、推荐。因此享乐型购买动机和幸运感知水平高的个体更易对非确定性产品产生好奇，并参与购买。高社会支持的消费者个人对不确定性的包容度更高，人们更愿意购买非确定性产品；享乐型产品、适度暴露信息的产品更能够通过提升消费者积极情绪体验，进而促进其购买、分享非确定性产品。\n根据这段文字，影响非确定性产品购买决策的因素不包括（    ）。","options":{"A":"产品的类型","B":"社会的支持度","C":"消费者的个体差异","D":"信息暴露的可信度"},"answer":"D","explanation":"A项，根据“享乐型产品、适度暴露信息的产品更能够通过提升消费者积极情绪体验，进而促进其购买、分享非确定性产品”可知，“享乐型产品”属于产品类型的划分，故该项是影响非确定性产品购买决策的因素，排除；\nB项，根据“高社会支持的消费者个人对不确定性的包容度更高，人们更愿意购买非确定性产品”可知，社会的支持度与购买意愿直接相关，该项是影响非确定性产品购买决策的因素，排除；\nC项，根据“享乐型购买动机和幸运感知水平高的个体更易对非确定性产品产生好奇，并参与购买”可知，不同个体在“购买动机”“幸运感知”上的差异，属于消费者个体差异，该项是影响非确定性产品购买决策的因素，排除；\nD项，根据“享乐型产品、适度暴露信息的产品更能够通过提升消费者积极情绪体验，进而促进其购买、分享非确定性产品”可知，适度暴露信息的产品更能促使人们购买非确定性产品，而非“信息暴露”是否具备可信度，该项并非影响非确定性产品购买决策的因素，当选。\n本题为选非题，故正确答案为D。\n【文段出处】知乎网《揭开神秘盲盒的面纱：非确定性产品如何掏空你的钱包》","no":27,"missingImage":false},{"type":"question","qid":"18649899","cat":"片段阅读","stem":"玉器是一个人群宇宙观、世界观的体现，是文明进程与社会复杂化的见证。新石器时代玉器玉文化发展的两次高峰，一次见证了古国的形成与发展，另一次孕育了王国的形成，两次玉文化发展高峰构成了玉器时代的主要内容。尤其是第二次高峰阶段的发展，统一了中华文化圈内玉文化的整体面貌，整合了玉器制作工艺技术，接纳了各类玉器所蕴含的深刻意义，奠定了中国玉器玉文化的发展趋势。从此以后，无论新增什么样的器类、纹样如何变化，无论玉文化的因素如何多元，从玉文化的整体面貌上看，中华文化圈都展现出统一性、一致性的特点。\n根据这段文字，下列说法正确的是（    ）。","options":{"A":"制作工艺的整合奠定了中国玉器的发展趋势","B":"中国玉文化在历史上经历了两次高峰阶段","C":"中国玉器的纹样与种类具有统一性特质","D":"玉器是文化与社会发展的见证"},"answer":"D","explanation":"A项，根据“尤其是第二次高峰阶段的发展，统一了中华文化圈内玉文化的整体面貌，整合了玉器制作工艺技术，接纳了各类玉器所蕴含的深刻意义，奠定了中国玉器玉文化的发展趋势”可知，“制作工艺的整合”与“奠定了中国玉器的发展趋势”是并列关系，偷换逻辑，排除；\nB项，根据“新石器时代玉器玉文化发展的两次高峰······两次玉文化发展高峰构成了玉器时代的主要内容”可知，新石器时代玉器玉文的发展经历了两次高峰，“中国玉文化”偷换概念，排除；\nC项，根据“从此以后，无论新增什么样的器类、纹样如何变化，无论玉文化的因素如何多元，从玉文化的整体面貌上看，中华文化圈都展现出统一性、一致性的特点”可知，从玉文化的整体面貌上看，中华文化圈都展现出统一性特质，并非玉器的纹样与种类具有统一性，偷换概念，排除；\nD项，根据“玉器是一个人群宇宙观、世界观的体现，是文明进程与社会复杂化的见证······一次见证了古国的形成与发展，另一次孕育了王国的形成，两次玉文化发展高峰构成了玉器时代的主要内容”可知，玉器可以见证文化和社会发展，表述正确，当选。\n故正确答案为D。","no":28,"missingImage":false},{"type":"question","qid":"18649904","cat":"片段阅读","stem":"山峰的重心一般在山体的中间部位，山峰越高，其重心就越高，累加在山峰上的重力也就越大。要想减轻重力对自身的压迫，就得增加山峰的底座面积，这就和建造高楼大厦是一个道理，楼越高，需要的地基面积就必须越大、越深厚。但作为大自然造物，早已被设定好底座面积的珠穆朗玛峰（简称“珠峰”），则显然不行。喜马拉雅山全长2450千米，宽200~350千米，这样的地基面积不足以支撑起万米高峰，所以超过1万米的珠峰的最终结局必然是被自身重力压垮。\n这段文字意在说明：","options":{"A":"喜马拉雅山的底座面积过小","B":"珠峰不会超过1万米的原因","C":"山峰高度受到重心的影响","D":"建造高楼要考虑地基面积"},"answer":"B","explanation":"文段开篇指出山峰重心与高度、底座面积的关系，即山峰越高重心越高，需更大底座面积支撑，并通过高楼与地基的关系进行解释。接着通过转折词“但”强调珠穆朗玛峰作为大自然造物，底座面积（喜马拉雅山的底座面积）已被设定好，不足以支撑万米高峰，最后通过“所以”得出结论：超过1万米的珠峰最终会被自身重力压垮。故文段重点解释了珠峰高度存在上限，无法超过1万米的原因，对应B项。\nA项，仅提及“喜马拉雅山的底座面积过小”，这是解释珠峰不会超过1万米原因的部分内容，表述片面，且未提及主题词“珠峰”，排除；\nC项，“山峰高度受到重心的影响”是对山峰一般原理的阐述，属于解释说明部分，非重点，且未提及主题词“珠峰”，排除；\nD项，“建造高楼要考虑地基面积”是为了类比说明山峰的情况，非重点，且未提及主题词“珠峰”，排除。\n故正确答案为B。\n【文段出处】光明日报《珠峰会不会超过1万米》","no":29,"missingImage":false},{"type":"question","qid":"18649909","cat":"片段阅读","stem":"盛唐之前，线条和色彩是绘画的主要造型手段，如顾恺之《女史箴图》《洛神赋图》等，墨只是作为黑色颜料，借用笔来勾勒对象的外形轮廓，处于附庸地位。唐代画家吴道子独创“兰叶描”画法，表现人物画中衣纹的曲折向背，开笔法向墨法转化之先。“兰叶描”的特点在于运笔中时提时顿，压力不均，从而在一根线条中产生忽粗忽细的效果，这与顾恺之“高古游丝描”细而均匀的用笔方式截然不同，可以看作“墨法”运用之萌芽。张彦远《历代名画记》称赞其“运墨而五色具”，可谓水墨登上绘画艺术舞台的宣言，墨法由此获得承认，笔法也因墨的广泛使用而愈加丰富。\n从这段文字无法推知（    ）。","options":{"A":"同时代人对吴道子的评价","B":"盛唐之际绘画艺术的突破","C":"《女史箴图》中的衣纹特点","D":"“兰叶描”画法的创新过程"},"answer":"C","explanation":"A项，根据“张彦远《历代名画记》称赞其‘运墨而五色具’”可知，“同时代人对吴道子的评价”可以推知，排除；\nB项，根据“盛唐之前，线条和色彩是绘画的主要造型手段······墨只是作为黑色颜料，借用笔来勾勒对象的外形轮廓，处于附庸地位。唐代画家吴道子独创‘兰叶描’画法，表现人物画中衣纹的曲折向背，开笔法向墨法转化之先。······墨法由此获得承认，笔法也因墨的广泛使用而愈加丰富”可知，“盛唐之际绘画艺术的突破”可以推知，排除；\nC项，文段仅提及顾恺之使用“高古游丝描”且线条“细而均匀”，但并未具体描述《女史箴图》中的衣纹特点，故“《女史箴图》中的衣纹特点”无法推知，当选；\nD项，根据“吴道子独创‘兰叶描’画法······开笔法向墨法转化之先。‘兰叶描’的特点在于运笔中时提时顿，压力不均······墨法由此获得承认，笔法也因墨的广泛使用而愈加丰富”可知，“‘兰叶描’画法的创新过程”可以推知，排除。\n本题为选非题，故正确答案为C。","no":30,"missingImage":false},{"type":"question","qid":"18649915","cat":"片段阅读","stem":"“显眼包”的行为特点符合心理学上所谓的“出丑效应”。这种效应指出，精明的人无意中犯点小错误，反而更使人觉得他具有和别人一样会犯错的缺点，反而成为其优点，让人更加喜爱他。在生活中，拥有显眼特质的人通常会在社交场合中做出非常活泼、搞笑的行为。他们勇于表达自己，拥有自信和独特的魅力。这种社交魅力不仅是一种表面的现象，更是一种内心的力量。在保持自信的同时，不去过分在意他人目光，同时保持良好的社交心态，面对困难和挫折都有足够的心理韧性。\n这段文字未提及（    ）。","options":{"A":"“显眼包”的语义变化","B":"“显眼包”的性格特质","C":"“显眼包”的心理学解释","D":"“显眼包”受欢迎的原因"},"answer":"A","explanation":"A项，文段并未提及“显眼包”一词的语义变化，无中生有，当选；\nB项，根据“拥有显眼特质的人通常会在社交场合中做出非常活泼、搞笑的行为。他们勇于表达自己，拥有自信和独特的魅力”可知，“‘显眼包’的性格特质”文段有提及，排除；\nC项，根据“‘显眼包’的行为特点符合心理学上所谓的‘出丑效应’。这种效应······更加喜爱他”可知，“‘显眼包’的心理学解释”文段有提及，排除；\nD项，根据“精明的人无意中犯点小错误，反而更使人觉得他具有和别人一样会犯错的缺点，反而成为其优点，让人更加喜爱他。在生活中，拥有显眼特质的人通常会在社交场合中做出非常活泼、搞笑的行为。他们勇于表达自己，拥有自信和独特的魅力”可知，“‘显眼包’受欢迎的原因”文段有提及，排除。\n本题为选非题，故正确答案为A。\n【文段出处】科普中国《让孩子成为“显眼包”，竟然还有这种好处？》","no":31,"missingImage":false},{"type":"question","qid":"18649918","cat":"片段阅读","stem":"按道理来说，逆风运动受到的阻力更大，顺风运动受到的推力更大。但鸟类的飞行与飞机飞行的原理有点类似，鸟类大多数时候更喜欢逆风而飞，因为这时的风与鸟儿相向而行，气流滑过鸟的翅膀的速度更快，在翅膀上下形成气压差，产生一个上升的力，使鸟飞得更高；并且鸟的体型是由前向后的流线型，羽毛都是由前向后生长，逆着风飞，可以减少空气阻力，如果顺着风飞行，羽毛就会被吹翻起来，像一把被倒着吹的雨伞，增大鸟的飞行阻力。\n这段文字意在说明（    ）。","options":{"A":"鸟类为什么喜欢逆风飞行","B":"鸟类飞行的原理类似飞机","C":"鸟类体型具有流线型特征","D":"鸟类飞行受到风向的影响"},"answer":"A","explanation":"文段首句指出正常情况下顺风运动受到的推力更大，然后由转折关联词“但”引出鸟类则相反，多数时候更喜欢逆风而飞这一观点。继而由关联词“因为”引出原因解释：一方面，鸟儿逆风飞行时气流滑过鸟的翅膀的速度更快，在翅膀上下形成气压差，产生一个上升的力，使鸟能飞得更高。另一方面，鸟的体型是由前向后的流线型，逆风飞行可以减少空气阻力。文段整体结构为：先提出鸟类大多数时候更喜欢逆风而飞这一结论，再以并列的两方面去解释原因。故文段中心句为首句，指出鸟类喜欢逆风飞行，且后文进行了原因解释，对应A项。\nB项，文段中的飞机只是用来作为对比，引出鸟类喜欢逆风飞行这一观点，且后文再未提及，非重点，排除；\nC项，“鸟类体型具有流线型特征”只对应题干中第二个原因，表述片面，排除；\nD项，“鸟类飞行受到风向的影响”只对应题干中第一个原因，表述片面，排除。\n故正确答案为A。\n【文段出处】文摘报、光明网《逆流而上的鱼和鸟》","no":32,"missingImage":false},{"type":"question","qid":"18649919","cat":"片段阅读","stem":"在冬季，树木内运输养分的液体会减缓或停止流动，此时修枝作业可以最大限度减少对树木生长的干扰；冬季土壤冻结，作业对土壤干扰也较小。同时冬季是部分害虫和病菌的休眠期，其活动相对较少，此时清除枯木和病腐木可有效减少害虫和病菌对森林的危害。此外，冬季树干的水分含量比生长季时低，枝脆干轻，便于修枝、集材和运材。\n这段文字意在说明（    ）。","options":{"A":"冬季森林抚育在各地均有开展","B":"冬季是森林抚育作业的黄金期","C":"冬季森林抚育具有严格的作业标准","D":"森林抚育有助于缩短森林培育周期"},"answer":"B","explanation":"文段开篇介绍冬季修枝作业可以最大程度减少对树木生长的干扰，接下来通过“同时”指出冬季清除枯木和病腐木可以减少病虫害对森林的危害，最后通过“此外”继续说明冬季的树干便于修枝、集材和运材。故文段为并列结构，重点介绍在冬季开展森林抚育的原因及积极影响，即冬季是森林抚育作业的黄金期，对应B项。\nA项，文段并未提及多个地点，排除；\nC项，文段并未提及“作业标准”，排除；\nD项，文段并未提及“缩短森林培育周期”，且缺少文段主题词“冬季”，排除。\n故正确答案为B。\n【文段出处】文摘报《森林抚育，冬季为何很重要》","no":33,"missingImage":false},{"type":"question","qid":"18649950","cat":"语句表达","stem":"基因不过是细胞合成蛋白质的指南，真正在人体中发挥生理作用的是蛋白质。不同的蛋白质有时候会相互结合，形成复合体，调节各种功能。基因突变之所以会引发疾病，很大程度上是因为突变会影响这些蛋白质的功能。                    。比如说，在身体里，有两个蛋白质会形成一个关键的复合体，修复受损的DNA。一旦编码这两个蛋白质的基因出现变异，这两个蛋白质的结构就可能发生变化。如果这些变化让它们无法相互作用，就无法形成蛋白复合体来修复DNA，久而久之，细胞里的受损DNA就会越积越多，最终发生质变，引起癌症。\n填入画横线部分最恰当的一项是（    ）。","options":{"A":"癌症相关蛋白会激活不同的信号通路","B":"蛋白质功能与两者间的结合方式有关","C":"致癌因子可能使蛋白复合体发生变化","D":"这能让我们更好地理解癌症如何发生"},"answer":"D","explanation":"横线出现在文段中间，需要结合前后文内容进行分析。前文论述了真正在人体中发挥生理作用的是蛋白质，并指出蛋白质的功能受基因突变影响会引起疾病，横线后举例说明蛋白质功能受到基因突变影响最终引起癌症，故横线处应表达蛋白质功能受损会引发癌症之意，对应D项。\nA项，“激活不同的信号通路”无中生有，文段未提及，排除；\nB项，文段说明蛋白质功能与形成的复合体有关，是受基因突变影响，而非“两者间的结合方式”，表述错误，排除；\nC项，“致癌因子”无中生有，文段未提及，排除。\n故正确答案为D。\n【文段出处】《三篇&lt;科学&gt;齐发！科学家对癌症发病有了新的认识》","no":34,"missingImage":false},{"type":"question","qid":"18649959","cat":"语句表达","stem":"①再加上有些兰花自然分布范围极端狭窄，任何一个小种群的状态都可能关系整个物种的存亡\n②绝大多数兰科植物对环境要求相对苛刻，仅能接受特定生境类型，对真菌、传粉昆虫种类也有要求\n③兰科被纳入《国家重点保护野生植物名录》的重要原因是，它们通常个体少、分布狭隘且面临风险\n④典型例子是暖地杓兰和象鼻兰，二者都是新增的国家一级重点保护植物，分布范围小，已知个体数量少，且均为我国特有物种\n⑤值得庆幸的是，暖地杓兰的人工繁育难题已经取得突破，象鼻兰已能实现规模化人工繁育\n⑥一旦这些环境条件发生改变，即使没有受到人类直接影响，也足以引起居群走向衰退\n将以上六个句子重新排列，语序正确的一项是（    ）。","options":{"A":"②①④⑤③⑥","B":"②①④⑤⑥③","C":"③②⑥①④⑤","D":"③④⑤⑥②①"},"answer":"C","explanation":"对比选项，确定首句。②句阐述绝大多数兰科植物对环境、真菌及传粉昆虫种类都有严苛的要求，③句点明兰科被纳入《国家重点保护野生植物名录》的重要原因是个体少、分布狭隘且面临风险，均可作首句，无法排除。\n继续观察所给语句，寻找线索。⑥句中出现指代词“这些环境条件”，可寻找捆绑句子。结合选项，⑥句前分别为②、③、⑤三句，②句具体阐述兰科植物对生存环境的苛刻要求，与⑥句话题一致，可构成捆绑，C项当选。③句说明兰科被纳入《国家重点保护野生植物名录》的重要原因，⑤句介绍暖地杓兰和象鼻兰的人工繁育取得的新进展，均与“环境条件”无关，不能与⑥句构成捆绑，排除A、B、D三项。\n故正确答案为C。\n【文段出处】澎湃新闻《天价交易下历尽劫难的野生兰花，终于有了“护身符”》","no":35,"missingImage":false}],"count":20,"answerable":20,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"14096255","cat":"数学运算","stem":"以下每一行的数列都有相同的规律，问“？”处应填入的数字为（    ）。\n\u003cimg data-k=\"44aa237e2ad9\" style=\"max-width:327px\">","options":{"A":"-3","B":"3","C":"-11","D":"11"},"answer":"A","explanation":"题干出现图形，判定为图形数阵。\n方法一：观察表格数据，按行查找规律可得：（6-4）×4=10-2；（7-8）×4=5-9；（3-2）×4=5-1。即在每行中满足规律：（第二列数字-第一列数字）×4=第四列数字-第三列数字，则（7-12）×4=（？-17），？=-3。\n方法二：观察表格数据，每一行两两作差可得：第一行，2、-4、8，第二行，-1、2、-4，第三行，1、-2、4，即每一行作差之后均是公比为-2的等比数列。第四行两两作差可得：-5、10、（    ），则下一项为10×（-2）=-20，？-17=-20，？=-3。\n故正确答案为A。","no":36,"missingImage":false},{"type":"question","qid":"14096254","cat":"数学运算","stem":"以下为6×6的数独，其每行、每列和每个小方块的6个格子中都包含1~6的数字。问“？”处应填入的数字为（    ）。\n\u003cimg data-k=\"c5ddd3e03aae\" style=\"max-width:354px\">","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"B","explanation":"题干出现图形，判定为图形数阵。观察空缺数字较少的第二列，所缺数字是2和4，因第四行出现了数字4，则第二列第四行只能是2，第二列第二行是4。观察倒数第二行数字，所缺数字是1、2、4，因第四列和第六列均出现了数字4，则第一列的空格处只能是4。\n如下图，橙色小方块右下角的空格处只能是1或2，结合黄色小方块的最右侧两个空格中必有2，则橙色小方块右下角的空格处只能是1，故“？”处应填入的数字是2。\n\u003cimg data-k=\"a8cca863a8bf\" style=\"max-width:353px\">\n故正确答案为B。","no":37,"missingImage":false},{"type":"question","qid":"14096270","cat":"数学运算","stem":"以下二维数列的首项为灰色方格中数字。每组上下相邻的数字呈现一种固定规律，每组左右相邻的数字呈现另一种固定的规律。问“？”处应填入的数字为（    ）。\n\u003cimg data-k=\"a362b2d6b1b8\" style=\"max-width:600px\">","options":{"A":"20","B":"24","C":"40","D":"44"},"answer":"D","explanation":"题干出现图形，判定为图形数阵。观察上下相邻的数字，查找规律可得：第一组，6×2-10=2；第二组，9×2-10=8，8×2-10=6；第三组，11×2-10=12。即上下相邻的数字满足规律：上×2-10=下，则第三组空格数字=12×2-10=14。观察左右相邻的数字，查找规律可得：第一组，2×2-1=3，3×2-1=5，5×2-1=9；第二组，6×2-1=11。即左右相邻的数字满足规律：左×2-1=右，则第三组第二列空格数字=14×2-1=27。故“？”处应填入的数字为27×2-10=44。\n故正确答案为D。","no":38,"missingImage":false},{"type":"question","qid":"14096252","cat":"数学运算","stem":"商店购进一批服装，按进价的2倍定价销售。如打八折销售，每天比原价销售时多卖20件，每天的利润与原价销售时相同；如每件降价120元，每天销量比原价销售时多2倍，每天的利润是原价销售时的1.2倍。问原价销售时每天能获利多少元？","options":{"A":"3600","B":"4000","C":"6000","D":"7200"},"answer":"C","explanation":"设每件服装进价x元，原价销售时每天可卖y件，则定价为2x元，原价销售时每天可获利（2x-x）y=xy元。根据题意，可列式：\u003cimg data-k=\"e1a28058f736\">······①，\u003cimg data-k=\"c194e293fb57\">······②，解得x=200，y=30。则原价销售时每天能获利200×30=6000元。\n故正确答案为C。","no":39,"missingImage":false},{"type":"question","qid":"14096269","cat":"数学运算","stem":"甲、乙两企业共同投资建厂，约定前三年的收益70%归甲，30%归乙，往后每年的收益中，归乙的比例都比上一年高10个百分点，直到乙的收益占比达到70%为止，已知第一年工厂收益3x元，往后每一年的收益都比上一年高x元。问乙企业的累计收益第一次超过甲是在第几年？","options":{"A":"7","B":"8","C":"9","D":"10"},"answer":"B","explanation":"根据题意，乙企业的收益可列表如下：\n\u003cimg data-k=\"babc552c2551\" style=\"max-width:576px\">\n代入A项：第7年时，根据等差数列求和公式：\u003cimg data-k=\"063245b5a725\">，可得工厂累计收益为\u003cimg data-k=\"8eeb2475ada2\">，乙企业的累计收益为0.9x+1.2x+1.5x+2.4x+3.5x+4.8x+6.3x＝20.6x，则甲企业的累计收益为42x-20.6x＝21.4x。20.6x&lt;21.4x，可知第7年乙企业的累计收益未超过甲，排除；\n代入B项：第8年时，工厂累计收益为42x+10x=52x，乙企业的累计收益为20.6x+7x=27.6x，则甲企业的累计收益为52x-27.6x＝24.4x。27.6x&gt;24.4x，可知第8年乙企业的累计收益第一次超过甲，当选。无需再验证C、D两项。\n故正确答案为B。","no":40,"missingImage":false},{"type":"question","qid":"14096258","cat":"数学运算","stem":"甲、乙工程队共同实施某个路面铺装工程，如每天各工作8小时，正好20天完成任务，实际工作5天后，甲工程队引入新设备效率提升10%，乙工程队每天多工作2小时，结果提前2天完成任务。则甲、乙工程队原始效率的比值为（    ）。","options":{"A":"\u003cimg data-k=\"d59755563ca3\">","B":"\u003cimg data-k=\"cd2546cfdf85\">","C":"\u003cimg data-k=\"89507e97188a\">","D":"\u003cimg data-k=\"02ac35569f98\">"},"answer":"D","explanation":"赋值甲工程队原始效率为每小时10，设乙工程队原始效率为每小时x。\n方法一：工作5天后的剩余工程量为\u003cimg data-k=\"de828d0540a3\">。根据“提前2天完成任务”，即在甲、乙工程队改变工作模式之后实际工作20-2-5=13天完成，可列方程：\u003cimg data-k=\"9f6791a8c1b7\">\u003cimg data-k=\"9d07ea5bcae2\">，解得x=5.6。则甲、乙工程队原始效率的比值为\u003cimg data-k=\"b130f87b8c31\">。\n方法二：根据“提前2天完成任务”，即原计划20-5=15天的工程量实际15-2=13天完成。根据“总量一定，效率与时间成反比”，可列方程：\u003cimg data-k=\"815b2c541790\">，解得x＝5.6。则甲、乙工程队原始效率的比值为\u003cimg data-k=\"b130f87b8c31\">。\n故正确答案为D。","no":41,"missingImage":false},{"type":"question","qid":"14096271","cat":"数学运算","stem":"一个不规则八面体零件的每个面都是不同的三角形，7个面是白色，1个面是黑色，现选择2个白色面分别涂成红色和黄色，要求红、黄色两个面与黑色面均不相邻（仅共顶点不算相邻）。问有多少种不同的涂色方案？","options":{"A":"6","B":"8","C":"10","D":"12"},"answer":"D","explanation":"八面体即八个面，每个面都是三角形，则每个面均有3个相邻面（公共边），仅1个面是黑色，则与黑色面相邻的面有3个，那么与黑色面不相邻的面有4个，从不相邻的面中任意选2个，一定不会与黑色面相邻，共有\u003cimg data-k=\"a20f0bbca763\">种涂色方案。\n故正确答案为D。","no":42,"missingImage":false},{"type":"question","qid":"14096253","cat":"数学运算","stem":"某集团甲、乙、丙三个分公司共有100多人，甲、乙、丙分公司销售人员分别占总人数的40%、44%和34%，且甲分公司销售人员比乙分公司多13人，问销售人员最多和最少的分公司，非销售人员相差多少人？","options":{"A":"16","B":"18","C":"20","D":"22"},"answer":"D","explanation":"根据“甲、乙、丙分公司销售人员分别占总人数的40%、44%和34%”，可得\u003cimg data-k=\"447713bf81dc\">\u003cimg data-k=\"3b7c5bcb2c6b\">；\u003cimg data-k=\"fa09959e189a\">\u003cimg data-k=\"a2c74b753e4f\">；\u003cimg data-k=\"b259bc78d080\">\u003cimg data-k=\"1a810a1f9a5d\">。假设甲分公司销售人员人数为2x人，乙分公司销售人员人数为11y人，又因“甲分公司销售人员比乙分公司多13人”，可列式2x-11y=13，2x为偶数，13为奇数，则11y为奇数，y可取1，3，5，······，当y=1时，x=12，即甲分公司销售人员人数为24人，甲分公司总人数为60人；乙分公司销售人员人数为11人，乙分公司总人数为25人，那么丙分公司的总人数为50人或100人都满足题意；\n当y=3时，x=23，即甲分公司销售人员人数为46人，甲分公司总人数为115人；乙分公司销售人员人数为33人，乙分公司总人数为75人，那么丙分公司的总人数为50人时，不满足题意。因此当y取3及以上时，皆不满足题意。\n综上，若甲分公司销售人员人数为24人、乙分公司销售人员人数为11人、丙分公司销售人员人数为17人时，销售人员最多的是甲公司，最少的是乙公司，则所求为（60-24）-（25-11）=22人。\n故正确答案为D。","no":43,"missingImage":false},{"type":"question","qid":"14096259","cat":"数学运算","stem":"张、王和李从甲地出发匀速前往乙地，到达后均原速度返回。张比王早出发20分钟，比李晚出发30分钟。出发2小时后张追上李，又用了1小时张到达乙地，又用了1小时返程中的李与王迎面相遇。问王从甲地到乙地单程的用时（    ）。","options":{"A":"不到4小时15分","B":"在4小时15分~4小时30分之间","C":"在4小时30分~4小时45分之间","D":"超过4小时45分"},"answer":"C","explanation":"根据题意，出发2小时后张追上李，张所用时间为2小时，李所用时间为2.5小时，\u003cimg data-k=\"64efa66875ff\">；根据路程相同，时间与速度呈反比，可知\u003cimg data-k=\"56871b601ce0\">。假设\u003cimg data-k=\"b533b68354ea\">，\u003cimg data-k=\"3f65650ee009\">，张从甲地到乙地一共走了2+1=3小时，即180分钟，则\u003cimg data-k=\"c8e25d15fb0a\">。根据题干“又用了1小时返程中的李与王迎面相遇”，此时张用时3+1=4小时，即240分钟，再根据题干“张比王早出发20分钟，比李晚出发30分钟”，可得李用时240+30=270分钟，王用时240-20=220分钟。李走的总路程为4×270=1080，即走完甲到乙的900后返程走了1080-900=180，此时与王相遇，那么王走的距离为900-180=720，则\u003cimg data-k=\"241c62747aad\">，故王从甲地到乙地单程的用时为\u003cimg data-k=\"10e8d705847a\">分钟，即4小时35分，在C项范围内。\n故正确答案为C。","no":44,"missingImage":false},{"type":"question","qid":"14096256","cat":"数学运算","stem":"甲和乙两条生产线4小时可以生产320个零件，乙和丙两条生产线6小时可以生产420个零件。如果甲的效率提高25%，其3小时生产的零件数量与丙生产5小时相同。问乙生产210个零件需要多长时间？","options":{"A":"5小时15分","B":"6小时","C":"7小时","D":"7小时30分"},"answer":"A","explanation":"根据题意可得，4（甲+乙）=320①；6（乙+丙）=420②，整理得甲-丙=10。根据“甲的效率提高25%，其3小时生产的零件数量与丙生产5小时相同”，可列式1.25×甲×3=5×丙，整理得\u003cimg data-k=\"48ca6b5338bd\">，甲比丙多1份，结合甲-丙=10，则1份=10，故甲=40，丙=30，乙=40。那么所求为\u003cimg data-k=\"9a61281f5901\">小时，\u003cimg data-k=\"62886ffdfcd1\">小时\u003cimg data-k=\"aa317c180511\">分钟，即乙生产210个零件需要5小时15分。\n故正确答案为A。","no":45,"missingImage":false},{"type":"question","qid":"14096262","cat":"数学运算","stem":"书店A、B、C三种图书，每本售价分别是20元、28元、40元，利润分别是3元、2.8元、4元。已知某学校用1000元购买其中两种图书，合计40本，问书店的利润最大是多少元？","options":{"A":"112","B":"115","C":"120","D":"130"},"answer":"D","explanation":"根据公式：利润率\u003cimg data-k=\"5a49a0b0b9f9\">，则出售A图书的利润率为\u003cimg data-k=\"37d52e00094f\">，出售B图书的利润率为\u003cimg data-k=\"b72dc2bed372\">，出售C图书的利润率为\u003cimg data-k=\"0d3244b77f57\">，比较可知书店出售A图书的利润率最大，若要书店的利润最大，则应尽可能多地购买A图书，即学校可能购买A、B两种图书或A、C两种图书。\n（1）学校购买A、B两种图书：设购买A图书m本，则购买B图书（40-m）本，根据题意可列式：20m+28×（40-m）=1000，解得m=15，即学校购买A图书15本，B图书40-15=25本，此时书店的利润为3×15+2.8×25=115元。\n（2）学校购买A、C两种图书：设购买A图书n本，则购买C图书（40-n）本，根据题意可列式：20n+40×（40-n）=1000，解得n=30，即学校购买A图书30本，C图书40-30=10本，此时书店的利润为3×30+4×10=130元。\n综上，书店的利润最大是130元。\n故正确答案为D。","no":46,"missingImage":false},{"type":"question","qid":"14096267","cat":"数学运算","stem":"某学院艺术特长生招生，学员平均成绩88分，其中男生的平均成绩86分，女生的平均成绩92分。后扩招了2名女生，使得男、女生平均成绩相同，已知扩招的女生的成绩均不超过70分，问扩招后，至少有几名学员？","options":{"A":"12","B":"14","C":"20","D":"26"},"answer":"C","explanation":"根据线段法“距离与量成反比”，则扩招前男生人数：女生人数=（92-88）：（88-86）=2：1，故设扩招前有男生2n人，女生n人。\n\u003cimg data-k=\"a61c427d5006\" style=\"max-width:466px\">\n根据题意可知，扩招了2名女生后，女生的平均成绩也为86分。\n方法一：设扩招的2名女生的平均成绩为x，则可列式：92n+2x=86（n+2），整理可得：x=86-3n。根据“已知扩招的女生的成绩均不超过70分”，则\u003cimg data-k=\"1bd66dc632c9\">，解得\u003cimg data-k=\"e3bfa41c6e27\">，且n为整数，故n最小为6。当n=6时，扩招后至少有学员2n+n+2=3n+2=20人。\n方法二：扩招前男女生人数比为2：1，即扩招前总人数是3的倍数，则扩招后的总人数减2应为3的倍数，结合选项可排除A项。题目问“至少”，将选项从小到大依次代入验证：\n代入B项：扩招后共有14人，则扩招前有女生\u003cimg data-k=\"b62877b35ab1\">人，扩招后有女生4+2=6人，总成绩为6×86=516分，故扩招的2名女生的总成绩为516-92×4=148分，148÷2=74分&gt;70分，不符合题意，排除；\n代入C项：扩招后共有20人，则扩招前有女生\u003cimg data-k=\"fd3fbeeb1c76\">人，扩招后有女生6+2=8人，总成绩为8×86=688分，故扩招的2名女生的总成绩为688-92×6=136分，136÷2=68分&lt;70分，符合题意，当选。无需验证剩余选项。\n故正确答案为C。","no":47,"missingImage":false},{"type":"question","qid":"14096265","cat":"数学运算","stem":"一个圆柱体容器内装有水，其底面半径是一圆台下底面半径的1.5倍，且圆台上底面半径是其下底面半径的一半，圆台完全浸没于圆柱体水中时，水面上升2厘米，问圆台高是多少厘米？","options":{"A":"不到5厘米","B":"5厘米到6厘米","C":"6厘米到7厘米","D":"超过7厘米"},"answer":"D","explanation":"设圆台上底面半径为x厘米，高为y厘米，则圆台下底面半径为2x厘米，圆柱体底面半径为\u003cimg data-k=\"ed0bfc353bf7\">厘米。根据圆台体积公式：\u003cimg data-k=\"3fd0f426e038\">，圆柱体体积公式：\u003cim ","C":"C","D":"D"},"answer":"A","explanation":"元素组成相似，且相同线条重复出现，优先考虑样式规律中的加减同异。九宫格优先横向看，第一行图形中图1与图2求异得到图3；经验证，第二行满足此规律；第三行应用此规律，因此？处图形应由图1与图2求异得到，只有A项符合。\n故正确答案为A。","no":58,"missingImage":false},{"type":"question","qid":"18649983","cat":"图形推理","stem":"把下面的六个图形分成两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是（    ）。\n\u003cimg data-k=\"f4e8c8f8b4ed\" style=\"max-width:500px\">","options":{"A":"①②③，④⑤⑥","B":"①②④，③⑤⑥","C":"①③⑤，②④⑥","D":"①④⑥，②③⑤"},"answer":"A","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。题干图形出现明显多圆相切或相交的变形图，优先考虑笔画数。观察发现，图①②③均为一笔画图形，图④⑤⑥均为两笔画图形，即图①②③为一组，图④⑤⑥为一组。\n故正确答案为A。","no":59,"missingImage":false},{"type":"question","qid":"18649988","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是（    ）。\n\u003cimg data-k=\"e8925e2e60ea\" style=\"max-width:600px\">","options":{"A":"①②③，④⑤⑥","B":"①②④，③⑤⑥","C":"①③⑤，②④⑥","D":"①⑤⑥，②③④"},"answer":"B","explanation":"解析一：本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形分割明显，考虑面数量，但没规律；继续观察发现，题干图形均由多个面拼接而成，考虑图形间关系。图①②④中，面a将其中1个面与另外3个面完全分隔开，且同侧的3个面相交；图③⑤⑥中，面b将与之相交的4个面两两分隔开，且同侧的2个面相交。即图①②④为一组，图③⑤⑥为一组。\n\u003cimg data-k=\"5df09449edca\" style=\"max-width:699px\">\n解析二：本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形分割明显，考虑面数量，但没规律；继续观察发现，只考虑内部线条的情况下，图①②④的内部线条为三部分，图③⑤⑥的内部线条为两部分。即图①②④为一组，图③⑤⑥为一组。\n解析三：本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干每幅图形都有外框，且内部线条与外框有明显相交，考虑数内部直线和外框的交点，图①②④框上交点数均为7，图③⑤⑥框上交点数均为6，即图①②④为一组，图③⑤⑥为一组。\n故正确答案为B。","no":60,"missingImage":false},{"type":"question","qid":"18650003","cat":"图形推理","stem":"以下为纸盒的外表面展开图，问哪一个折叠成的纸盒和其他三个不一样？（    ）\n\u003cimg data-k=\"bda838757fa1\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"A项：内部为“少”和“R”的两个面为相对面，内部为“何”和“K”的两个面为相对面，内部为“由”和“U”的两个面为相对面；\nB项：内部为“少”和“R”的两个面为相对面，内部为“何”和“K”的两个面为相对面，内部为“由”和“U”的两个面为相对面；\nC项：内部为“少”和“R”的两个面为相对面，内部为“何”和“K”的两个面为相对面，内部为“由”和“U”的两个面为相对面；\nD项：内部为“少”和“K”的两个面为相对面，内部为“何”和“R”的两个面为相对面，内部为“由”和“U”的两个面为相对面。\n综上，D项的两组相对面与其他三项不同。\n本题为选非题，故正确答案为D。","no":61,"missingImage":false},{"type":"question","qid":"18649987","cat":"图形推理","stem":"左边的多面体由15个白色和3个灰色正方体堆叠而成，其可以拆分为①、②和③三个多面体的组合。问③代表的多面体是（    ）。\n\u003cimg data-k=\"1c4643264da6\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查立体拼合。题干立体图形可以由①旋转后、②以及D项旋转后拼合而成，如下图所示：\n\u003cimg data-k=\"6ccd26638f58\" style=\"max-width:600px\">\n故正确答案为D。","no":62,"missingImage":false},{"type":"question","qid":"18649985","cat":"图形推理","stem":"下图为15个白色和5个灰色正方体组合而成的多面体，将其经A、B、C三个顶点切开后，正确的截面是（    ）。\n\u003cimg data-k=\"159cb314e83a\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题选项不严谨，没有正确选项。\n本题考查截面图。根据平面公理“过不在一条直线上的三点，有且只有一个平面”可以得出，A、B、C三个顶点可以确定一个唯一的截面，将图形拆分后，如下图所示：\n \u003cimg data-k=\"e146b0dac32a\" style=\"max-width:500px\">\n由于图中是斜切，因此在经过点A所在的小立方体时，该小立方体所在的截面应为长方形，此时由于ef的长度大于小立方体的棱长，因此在长方形截面中横边长度应小于竖边长度，排除C、D两项；又由于点A所在的小立方体为灰色，点B所在的白色小立方体的右边不存在其他小立方体，因此在选项中最后一行的截面图中应只存在一个灰色长方形和一个白色长方形，排除A项。\n故正确答案为B。\n注：本题出题不严谨，由上面拆分后的图形可知，本题B项中的截面图也存在问题，正确的截面应如下图所示，因此考生可以侧重学习解题思路。\n\u003cimg data-k=\"244eab74518f\" style=\"max-width:150px\">","no":63,"missingImage":false},{"type":"question","qid":"18649991","cat":"图形推理","stem":"以下4个图形中，哪一个是由2×2×2的白色小正方体拼成的大正方体的外表面展开图？（    ）\n\u003cimg data-k=\"6b98f85c7ec4\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查空间重构。由题干可知，该大正方体由8个小正方体组成，因此，大正方体每个外表面由4个小正方形组成，其6个外表面一共应包括24个小正方形，A、B两项均只有23个小正方形，排除。继续分析C、D两项。\nC项：如下图所示，标有序号的小正方形可拼合在对应相同序号的位置，该项可以拼成，当选；\n\u003cimg data-k=\"b6065bea3078\" style=\"max-width:200px\">\nD项：如图一所示，左下角存在构成L型的三个小正方形，如果将展开图中间部分分割出完整的4个2×2的面（红色虚线框所示），最左边下方2个小正方形将和其他小正方形重叠，只能如图二所示，将展开图中间部分分割出完整的3个2×2的面（红色虚线框所示），2号和3号小正方形拼合在对应相同序号的位置，此时两个1号小正方形所在的大正方形面重叠，该项不可以拼成，排除。\n\u003cimg data-k=\"b65232d30000\" style=\"max-width:400px\">\n故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"18649997","cat":"图形推理","stem":"下图中第一行的图形为给定的长方体某个角度的视图。问第二行的4个图形中，有几个是同一长方体的不同视图（该长方体仅有2个面不为纯白色）？（    ）\n\u003cimg data-k=\"6900953dd972\" style=\"max-width:600px\">","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"A","explanation":"逐一分析第二行的4个图形是否与第一行图形为同一长方体的不同视图：\n图1：由该图形的正面和左侧面不是纯白色，且能看到底面可知，该图形可能为第一行图形的左前方仰视视角的视图，但该视角的视图应如下图所示；\n\u003cimg data-k=\"03d4bf490a7b\" style=\"max-width:200px\">\n图2：由该图形的正面和右侧面不是纯白色，且能看到顶面可知，该图形可能为第一行图形整体旋转\u003cimg data-k=\"65c9d9957ef9\">后的右前方俯视视角的视图，但该视角的视图应如下图所示；\n\u003cimg data-k=\"8f3de65e6a21\" style=\"max-width:200px\">\n图3：由该图形的正面和右侧面不是纯白色，且能看到底面可知，该图形与第一行图形整体旋转\u003cimg data-k=\"65c9d9957ef9\">后的右前方仰视视角的视图一致；\n图4：由该图形的正面和右侧面不是纯白色，且能看到顶面可知，该图形可能为第一行图形整体旋转\u003cimg data-k=\"65c9d9957ef9\">后的右前方俯视视角的视图，但该视角的视图应如下图所示。\n\u003cimg data-k=\"8f3de65e6a21\" style=\"max-width:200px\">\n综上，第二行的4个图形中只有图3与第一行图形为同一长方体的不同视图，即只有1个。\n故正确答案为A。","no":65,"missingImage":false},{"type":"question","qid":"18649992","cat":"定义判断","stem":"分层随机是指在医学临床研究中，使用随机化原则进行实验设计时，首先根据患者进入试验时某些重要的临床特征或危险因素将患者分为若干层，再在每一层内执行简单随机分配方法形成实验组和对照组，最后总的合成实验组和对照组的方法。\n根据上述定义，下列采用了分层随机的是：","options":{"A":"在对阿尔茨海默症发病进展的研究中，先将患者按照年龄分为不同组，每组内按性别再分为不同亚组，再按照是否经常运动分别进入实验组和对照组","B":"在四种降脂药物疗效的研究中，先将患者按用药时间的不同分为四组，每组内按性别再分为两个亚组，再将每个亚组患者随机分为实验组和对照组","C":"在糖尿病发展进程的观察研究中，有100名患者入试，先拟定100个序号，让其随机抽取，单号进入实验组，双号进入对照组","D":"在进行原发性高血压治疗性研究中，先将患者按病情分为1级、2级和3级高血压，再将每级患者随机分为实验组和对照组"},"answer":"D","explanation":"第一步：找出定义关键词。\n“根据患者进入试验时某些重要的临床特征或危险因素将患者分为若干层”、“在每一层内执行简单随机分配方法形成实验组和对照组”。\n第二步：逐一分析选项。\nA项：先将患者按照年龄分为不同组，每组按性别再分为不同亚组，最后按照是否经常运动分为实验组和对照组，不属于随机分配，不符合“在每一层内执行简单随机分配方法形成实验组和对照组”，不符合定义，排除；\nB项：将患者按用药时间的不同进行分组，其中用药时间既不属于患者的临床特征也不属于危险因素，不符合“根据患者进入试验时某些重要的临床特征或危险因素将患者分为若干层”，不符合定义，排除；\nC项：将进入试验的100名患者拟定100个序号，再让其随机抽取，单号进入实验组，双号进入对照组，是直接通过序号随机分配，不符合“根据患者进入试验时某些重要的临床特征或危险因素将患者分为若干层”，不符合定义，排除；\nD项：将患者按病情分为1级、2级和3级高血压，是根据临床特征进行的分组，符合“根据患者进入试验时某些重要的临床特征或危险因素将患者分为若干层”，再将每级患者随机分为实验组和对照组，符合“在每一层内执行简单随机分配方法形成实验组和对照组”，符合定义，当选。\n故正确答案为D。","no":66,"missingImage":false},{"type":"question","qid":"18649995","cat":"定义判断","stem":"成本按是否与特定决策相关，可以分为相关成本和非相关成本。相关成本是指与特定决策相关的、决策时必须加以考虑的成本。非相关成本是指与特定决策不相关的、决策时可不予考虑的成本。\n根据上述定义，下列说法正确的是（    ）。","options":{"A":"企业决定淘汰旧包装，采用新型包装而增加的生产成本属于相关成本","B":"企业决定接收加急订单，在此期间支付管理人员工资而产生的成本属于相关成本","C":"企业决定增加产品的广告投入，因制作和投放广告而增加的成本属于非相关成本","D":"企业决定接收海外订单，与此同时在海外建设仓库而支付的成本属于非相关成本"},"answer":"A","explanation":"第一步：找出定义关键词。\n相关成本：“与特定决策相关”、“决策时必须加以考虑”；\n非相关成本：“与特定决策不相关”、“决策时可不予考虑”。\n第二步：逐一分析选项。\nA项：采用新型包装而增加的生产成本，是“淘汰旧包装、采用新型包装”这一决策直接导致的额外支出，符合“与特定决策相关”、“决策时必须加以考虑”，符合“相关成本”定义，说法正确，当选；\nB项：支付管理人员工资而产生的成本，通常是企业的固定运营成本，无论是否有“接收加急订单”这一决策，该工资成本均需支付，符合“与特定决策不相关”、“决策时可不予考虑”，符合“非相关成本”定义，不符合“相关成本”定义，说法错误，排除；\nC项：因制作和投放广告而增加的成本，是“增加广告投入”这一决策直接产生的费用，符合“与特定决策相关”、“决策时必须加以考虑”，符合“相关成本”定义，不符合“非相关成本”定义，说法错误，排除；\nD项：在海外建设仓库而支付的成本，是直接由“接收海外订单”这一决策所产生的，符合“与特定决策相关”、“决策时必须加以考虑”，符合“相关成本”定义，不符合“非相关成本”定义，说法错误，排除。\n故正确答案为A。","no":67,"missingImage":false},{"type":"question","qid":"18649989","cat":"定义判断","stem":"注意分配是指在同一时间内，把注意集中到两种或几种不同的事物或者活动上。注意分配的条件在于有熟练的技能技巧和有赖于同时进行的几种活动之间的关系。\n根据上述定义，下列属于注意分配的是（    ）。","options":{"A":"驾驶员在开车时，在观察前方道路的状况时，同时想着晚餐吃什么","B":"李律师同时接了两起民事案件，近段时间忙于对两起案件材料的整理","C":"外科医生长时间专注于一台手术，既要观察仪器数据，又要留心手术刀的操作","D":"教室内幼儿正聚精会神地听老师讲故事，忽然从窗外飞进来一只小鸟，大家都去看小鸟"},"answer":"C","explanation":"第一步：找出定义关键词。\n“同一时间内”、“把注意集中到两种或几种不同的事物或者活动上”、“有熟练的技能技巧”、“有赖于同时进行的几种活动之间的关系”。\n第二步：逐一分析选项。\nA项：驾驶员在开车时，观察前方道路状况的同时想着晚餐吃什么，虽然是在同一时间内，但“观察道路状况”与“想晚餐吃什么”之间没有关系，不符合“有赖于同时进行的几种活动之间的关系”，不符合定义，排除；\nB项：李律师同时接了两起民事案件，近段时间忙于整理两起案件的材料，“近段时间”是一个时间段，说明是在一段时间内处理两件事，而非在“同一时间内”同时进行，不符合“同一时间内”，不符合定义，排除；\nC项：外科医生在进行一台手术时，同一时间内既要观察仪器数据，又要操作手术刀，“观察仪器数据”与“操作手术刀”这两种活动都需要高度熟练的专业技能，且两者密切相关，符合“同一时间内”、“把注意集中到两种或几种不同的事物或者活动上”、“有熟练的技能技巧”、“有赖于同时进行的几种活动之间的关系”，符合定义，当选；\nD项：幼儿从听故事转向看小鸟，属于注意力从一项活动转移到另一项活动，不符合“同一时间内”、“把注意集中到两种或几种不同的事物或者活动上”，不符合定义，排除。\n故正确答案为C。","no":68,"missingImage":false},{"type":"question","qid":"18649994","cat":"定义判断","stem":"意见证据规则是指证人只能陈述自己亲身感受和经历的事实，而不得陈述对该事实的意见或者结论。意见证据规则有两个例外：一是有关专家证人的例外，即一个具有适当资格的专家可以就他拥有相应专业知识且需要专家意见的事实陈述其意见；二是有关普通证人的例外，即作为表述曾亲身感知的事实的方式，一个非专家证人可以就那些不需要任何特殊的专业知识的事实陈述其意见。\n根据上述定义，下列证人的陈述违反了意见证据规则的是（    ）。","options":{"A":"我进门后，就看见甲一边擦着鼻血，一边怒视着乙，乙应该是打了甲","B":"天很黑，我没有看清行凶者的长相，但是从声音辨认他应该年龄很大","C":"案发当晚，被告人后半夜才回到宿舍，他脱衣服时，我闻到了类似火药的味道","D":"我们在尸检的过程中发现死者身上尸斑的发展速度，比正常情况下缓慢，根据检测，我们认定死者的死亡时间已经超过12个小时"},"answer":"A","explanation":"第一步：找出定义关键词。\n“证人只能陈述自己亲身感受和经历的事实”、“不得陈述对该事实的意见或者结论”、“具有适当资格的专家可以就他拥有相应专业知识且需要专家意见的事实陈述其意见”、“作为表述曾亲身感知的事实的方式，非专家证人可以就那些不需要任何特殊的专业知识的事实陈述其意见”。\n第二步：逐一分析选项。\nA项：证人陈述“乙应该是打了甲”，这是一个基于观察的推断或结论，而非直接亲身感知的事实，不符合“证人只能陈述自己亲身感受和经历的事实”、“具有适当资格的专家可以就他拥有相应专业知识且需要专家意见的事实陈述其意见”、“作为表述曾亲身感知的事实的方式，非专家证人可以就那些不需要任何特殊的专业知识的事实陈述其意见”，不符合定义，当选；\nB项：证人陈述“从声音辨认他应该年龄很大”，通过声音判断年龄无需特殊专业知识，是对亲身感知事实陈述的合理意见，符合“作为表述曾亲身感知的事实的方式，非专家证人可以就那些不需要任何特殊的专业知识的事实陈述其意见”，符合定义，排除；\nC项：证人陈述“案发当晚，被告人后半夜才回到宿舍，他脱衣服时，我闻到了类似火药的味道”，均为亲身感知的事实，不涉及意见或结论，符合“证人只能陈述自己亲身感受和经历的事实”，符合定义，排除；\nD项：证人陈述“我们在尸检的过程中发现死者身上尸斑的发展速度，比正常情况下缓慢，根据检测，我们认定死者的死亡时间已经超过12个小时”，说明是具有专业资格的人员基于检测陈述的意见，符合“具有适当资格的专家可以就他拥有相应专业知识且需要专家意见的事实陈述其意见”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":69,"missingImage":false},{"type":"question","qid":"18650002","cat":"定义判断","stem":"对于行为者的某种行为，其基本信息有三条：（1）独特性，指行为者的这种行为是特殊的，还是在多数情况下一直如此；（2）一致性，指行为者的这种行为是否与其他行为者相一致；（3）一贯性，指行为者对行为对象的这种行为一贯如此，还是偶然为之。所谓三维归因是指根据行为者的上述行为信息，可将其行为原因归因于如下图所示的三个维度：\n\u003cimg data-k=\"668878017352\" style=\"max-width:600px\">\n一日，王某就工作分配问题与张经理发生争吵，通过分析发现，王某经常在工作分配上与他人争吵，王某的其他同事都未曾就工作分配问题与张经理发生争吵，王某在其他场合多次就工作分配问题与张经理发生争吵。\n根据上述定义，王某当日的行为应归因于（    ）。","options":{"A":"行为对象的特点","B":"行为者本身的特点","C":"行为情境","D":"无法确定"},"answer":"B","explanation":"第一步：找出定义关键词。\n“独特性：行为者的这种行为是特殊的，还是在多数情况下一直如此”、“一致性：行为者的这种行为是否与其他行为者相一致”、“一贯性：行为者对行为对象的这种行为一贯如此，还是偶然为之”。\n第二步：分析并匹配选项。\n根据“王某就工作分配问题与张经理发生争吵”，且“王某经常在工作分配上与他人争吵”，说明王某与他人争吵的行为，符合“在多数情况下一直如此”，属于独特性低；根据“王某的其他同事都未曾就工作分配问题与张经理发生争吵”，说明王某与他人争吵的行为，符合“行为者的这种行为与其他行为者不一致”，属于一致性低；根据“王某在其他场合多次就工作分配问题与张经理发生争吵”，说明王某与他人争吵的行为，符合“行为者对行为对象的这种行为一贯如此”，属于一贯性高；因此王某与他人争吵的行为属于独特性低、一致性低、一贯性高，应归因于行为者本身的特点，对应B项。\n故正确答案为B。","no":70,"missingImage":false},{"type":"question","qid":"18649998","cat":"类比推理","stem":"故人：客人","options":{"A":"原告：被告","B":"行人：路人","C":"董事：监事","D":"名人：文人"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“故人”和“客人”分别是从熟悉程度、来访身份的角度对人进行划分的，二者为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：“原告”和“被告”是法律诉讼中的不同主体，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：“路人”指路上的行人，“行人”指路上走的人，二者不是交叉关系，与题干逻辑关系不一致，排除；\nC项：“董事”是指由公司股东会选举产生的具有实际权力和权威的管理公司事务的人员，“监事”是公司中常设的监察机关的成员，二者为并列关系，与题干逻辑关系不一致，排除；\nD项：“名人”和“文人”分别是从知名程度、从事领域的角度对人进行划分的，二者为交叉关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"18650000","cat":"类比推理","stem":"松鼠鳜鱼：孜然牛肉：干烧大虾","options":{"A":"凤尾腰花：红油鸡丁：炭烤生蚝","B":"五彩时蔬：酸辣粉丝：香煎藕盒","C":"百花豆腐：松仁玉米：爆炒扇贝","D":"水晶肘子：咖喱土豆：姜汁豇豆"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“松鼠鳜鱼”、“孜然牛肉”和“干烧大虾”是三种不同的菜肴，三者为并列关系，且“松鼠鳜鱼”因形似松鼠而得名，是根据外形进行命名的，“孜然牛肉”是根据使用的主要调味料进行命名的，“干烧大虾”是根据烹饪方式进行命名的。\n第二步：判断选项词语间逻辑关系。\nA项：“凤尾腰花”、“红油鸡丁”和“炭烤生蚝”是三种不同的菜肴，三者为并列关系，且“凤尾腰花”是将腰花切成凤凰尾羽形状而得名的，是根据外形进行命名的，“红油鸡丁”是根据使用的主要调味料进行命名的，“炭烤生蚝”是根据烹饪方式进行命名的，与题干逻辑关系一致，当选；\nB项：“五彩时蔬”、“酸辣粉丝”和“香煎藕盒”是三种不同的菜肴，三者为并列关系，但“五彩时蔬”是根据颜色，而非形状进行命名的，与题干逻辑关系不一致，排除；\nC项：“百花豆腐”、“松仁玉米”和“爆炒扇贝”是三种不同的菜肴，三者为并列关系，但“松仁玉米”是根据主要食材，而非使用的主要调味料进行命名的，与题干逻辑关系不一致，排除；\nD项：“水晶肘子”、“咖喱土豆”和“姜汁豇豆”是三种不同的菜肴，三者为并列关系，但“姜汁豇豆”是根据主要调味料，而非烹饪方式进行命名的，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":72,"missingImage":false},{"type":"question","qid":"18650004","cat":"类比推理","stem":"水质净化：静置沉淀：过滤消毒","options":{"A":"补充营养：肉蛋鲜奶：水果蔬菜","B":"化解矛盾：居中调解：沟通合作","C":"实地观察：调查研究：访谈问卷","D":"教学方法：实地教学：现场教学"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“静置沉淀”和“过滤消毒”都是“水质净化”的方式，后两词为并列关系，二者分别与第一词构成方式目的的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“肉蛋鲜奶”和“水果蔬菜”是不同的食物，均具有“补充营养”的功能，后两词均与第一词构成功能对应关系，与题干逻辑关系不一致，排除；\nB项：“居中调解”和“沟通合作”都是“化解矛盾”的方式，后两词为并列关系，二者分别与第一词构成方式目的的对应关系，与题干逻辑关系一致，当选；\nC项：“实地观察”是“调查研究”的方式，二者为方式目的的对应关系，“访谈问卷”是“调查研究”中用到的物品，二者为使用物品的对应关系，与题干逻辑关系不一致，排除；\nD项：“实地教学”是“现场教学”的通俗名称，二者为全同关系，且“现场教学”是一种“教学方法”，二者为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":73,"missingImage":false},{"type":"question","qid":"18650006","cat":"类比推理","stem":"丸剂：试剂：冲剂","options":{"A":"美梦：睡梦：噩梦","B":"初审：外审：复审","C":"笔算：演算：珠算","D":"古物：器物：礼物"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“丸剂”指以药材细粉或提取物加入粘合剂制成的球形或类球形中药制剂，“冲剂”指以药物提取物与适宜的辅料或药材细粉制成的颗粒状或块状制剂。二者是不同的药物剂型，为并列关系。“试剂”是用于实验或检测的化学物质，“丸剂”不是“试剂”，“冲剂”也不是“试剂”。\n第二步：判断选项词语间逻辑关系。\nA项：“美梦”和“噩梦”是不同的“睡梦”，第一个词和第三个词构成并列关系，分别与第二个词构成种属关系，与题干逻辑关系不一致，排除；\nB项：“初审”和“复审”是审核过程中的两个阶段，二者为并列关系，“外审”又称外部审计，是由独立于被审计单位的国家审计机关或会计师事务所等社会审计机构，对其经济活动的合理性、合法性、准确性、真实性和效益性进行审查的监督机制；“初审”不是“外审”，“复审”也不是“外审”，与题干逻辑关系一致，当选；\nC项：“笔算”和“珠算”是不同的“演算”方式，第一个词和第三个词构成并列关系，分别与第二个词构成种属关系，与题干逻辑关系不一致，排除；\nD项：“古物”是一种“器物”，二者为种属关系，“礼物”与前两词无明显逻辑关系，与题干逻辑关系不一致，排除。\n故正确答案为B。\n注：本题B项中的“外审”存在送外审查和外部审计两种含义，若理解为送外审查，此时外审与复审为交叉关系，但这样分析无答案匹配。因此在本题中需将外审理解为外部审计，且大多数情况外审都为外部审计的意思，此时外审与复审无明显关系，复审不是外审，对应B项。","no":74,"missingImage":false},{"type":"question","qid":"18650013","cat":"类比推理","stem":"医疗保险：财产保险：责任保险","options":{"A":"政府债券：金融债券：企业债券","B":"公众人物：新闻人物：政治人物","C":"报刊杂志：书法绘画：出版书籍","D":"笔墨纸砚：文房四宝：文书工具"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“医疗保险”、“财产保险”和“责任保险”是三种不同类型的保险，都是根据保险保障范围进行划分的，三者为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：“政府债券”是政府为筹集资金而向出资者出具并承诺在一定时期支付利息和偿还本金的债务凭证；“金融债券”是银行及非银行金融机构在全国银行间债券市场发行的按约定还本付息的有价证券；“企业债券”是非金融企业依照法定程序发行，约定在一定期限内还本付息的债券，三者是不同类型的债券，都是根据发行主体进行划分的，为并列关系，与题干逻辑关系一致，当选；\nB项：“公众人物”是根据公众知晓度进行划分的、“新闻人物”是根据是否具有新闻价值进行划分的，“政治人物”是根据所属领域进行划分的，三者互为交叉关系，与题干逻辑关系不一致，排除；\nC项：“书法绘画”是“报刊杂志”和“出版书籍”的内容，第二个词分别与第一个词和第三个词构成内容与载体的对应关系，与题干逻辑关系不一致，排除；\nD项：“笔墨纸砚”是“文房四宝”，前两个词是全同关系，“文房四宝”是中国古代传统文化中的“文书工具”，后两个词是种属关系，与题干逻辑关系不一致，排除。\n故正确答案为A。\n注：本题题干中的“财产保险”有广义与狭义之分。其中“广义财产保险”是指以财产及其有关的经济利益和损害赔偿责任为保险标的的保险；“狭义财产保险”则是指以物质财产为保险标的的保险。\n若按照“广义财产保险”来理解，“责任保险”属于“财产保险”，题干的后两词应为种属关系，但这样分析无答案可以匹配，故本解析按照“狭义财产保险”来理解，即“以物质财产为保险标的的保险”，此时“医疗保险”、“财产保险”和“责任保险”都是根据保险保障范围进行划分的，三者可以看作并列中的反对关系，对应A项。","no":75,"missingImage":false},{"type":"question","qid":"18650014","cat":"逻辑判断","stem":"现代社会飞速发展，人们生活压力越来越大，睡眠问题愈发突出。据统计，中国约有30%的人曾发生不同程度的失眠症状，发病年龄呈年轻化趋势。证据表明，失眠会降低生活质量，增加精神疾病、糖尿病、心血管疾病等风险。国际指南建议，失眠的第一线疗法是失眠认知行为疗法，但世界范围内来看失眠患者获得该治疗的机会极其有限，取而代之的是提供睡眠卫生建议，开催眠药物或超适应症的镇静抗抑郁药物等，但这些都不是长期治疗失眠的方法，因此科学家指出需要创设新的治疗和护理模式。\n以下哪项如果为真，最能支持上述结论?（    ）","options":{"A":"催眠药物或镇静抗抑郁药物可能存在一系列的副作用","B":"失眠认知行为疗法最成熟，但需丰富的医疗资源支持","C":"实验表明存在成本效益可控且可广泛实施的失眠疗法","D":"心理健康问题和失眠的高共患病率需要引入药物治疗"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：科学家指出（治疗失眠）需要创设新的治疗和护理模式。\n论据：国际指南建议，失眠的第一线疗法是失眠认知行为疗法，但世界范围内来看失眠患者获得该治疗的机会极其有限，取而代之的是提供睡眠卫生建议，开催眠药物或超适应症的镇静抗抑郁药物等，但这些都不是长期治疗失眠的方法。\n本题论点讨论的是需要创设新的治疗和护理模式，论据讨论的是两种现有治疗方法的缺点，话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：催眠药物或镇静抗抑郁药物可能存在一系列的副作用，指出现有治疗方法的缺点，说明确实需要新的治疗方法，补充论据，可以加强，保留；\nB项：失眠认知行为疗法需丰富的医疗资源支持，解释了为什么世界范围内来看失眠患者获得该治疗的机会极其有限，说明确实需要新的治疗方法，补充论据，可以加强，保留；\nC项：实验表明存在成本效益可控且可广泛实施的失眠疗法，说明确实存在新的治疗方法能够解决现有方法存在的问题，解释说明需要创设新的治疗方法是可行的，补充论据，可以加强，保留；\nD项：心理健康问题和失眠的高共患病率需要引入药物治疗，解释了现有治疗方法的合理性，而论点讨论的是需要新的治疗方法，话题不一致，无法加强，排除。\n对比A、B、C三项，A项是或然性表述，并且只能说明药物疗法确实有缺点，间接证明需要新的治疗方法，力度较弱；B项只能说明失眠认知行为疗法确实有缺点，间接证明需要新的治疗方法，力度较弱；而C项说明确实存在新的治疗方法能够解决目前的问题，直接证明可以创设新的治疗方法，直接证明的力度强于间接证明，C项当选。\n故正确答案为C。","no":76,"missingImage":false},{"type":"question","qid":"18650018","cat":"逻辑判断","stem":"数据显示，Y国肉类的冷链流通率为30%，果蔬的冷链流通率不到20%，相比之下，发达国家的冷链流通率达到90%以上。对于Y国冷链物流相对落后的原因，一种观点认为是由技术落后造成的。目前冷链物流企业所采用的制冷工艺和技术方法都较为滞后，导致损耗过高，另一种观点则认为，相比普通物流，冷链运输的成本要高出一倍以上，这也导致很多企业仍然采用传统手段进行生鲜配送。\n以下哪项如果为真，最能削弱第二种观点？（    ）","options":{"A":"Y国冷链物流技术落后导致了该国冷链运输的成本过高","B":"物流成本最终都会转嫁到下游产业，最终由消费者买单","C":"Y国基础设施较为发达，普通物流的运输成本比发达国家都要低","D":"为节约成本，Y国一些冷链司机主动关闭制冷机，导致耗损大幅增加"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：相比普通物流，冷链运输的成本要高出一倍以上，这也导致很多企业仍然采用传统手段进行生鲜配送。\n论据：无。\n本题论点讨论Y国冷链运输成本高导致冷链物流相对落后，只有论点，没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出Y国冷链物流技术落后导致了该国冷链运输的成本过高，说明冷链物流相对落后的根本原因是技术落后，而非成本过高，直接削弱论点，可以削弱，当选；\nB项：该项指出物流成本最终会转嫁到消费者，讨论的是物流成本最终由谁承担，与论点讨论的企业为何不采用冷链运输话题不一致，为无关项，无法削弱，排除；\nC项：该项指出Y国普通的物流运输成本比发达国家低，证明普通物流的运输成本确实低，可以加强，无法削弱，排除；\nD项：该项指出Y国一些冷链司机的错误做法导致耗损大幅增加，但并不清楚这些司机占比如何，因此无法确定Y国企业是否会因损耗大而避免采用冷链运输，为不明确项，无法削弱，排除。\n故正确答案为A。","no":77,"missingImage":false},{"type":"question","qid":"18650022","cat":"逻辑判断","stem":"相较于传统肉类，目前市场上以植物蛋白为原料的“人造肉”自带健康、环保等光环，但是，无论是在国内还是国外，“人造肉”的市场效益均不佳。有人认为，消费者对新上市的产品有一个认识、认知和认可的过程，目前消费者对“人造肉”的认知度还不高，更遑论认可度了，这是消费者对“人造肉”消费意愿不强的原因。\n以下除哪项外，均能削弱上述论证？（    ）","options":{"A":"“人造肉”的价格是普通肉类的2到3倍，即使想反复购买，消费者也很难消费得起","B":"多数消费者认为，“人造肉”是人工合成的，吃“人造肉”有害身体健康","C":"目前“人造肉”的产品种类还较为单一，不能满足消费者日常饮食需求","D":"有74%的消费者表示不愿意复购“人造肉”，是因为其口感不如普通肉类"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：消费者对新上市的产品有一个认识、认知和认可的过程，目前消费者对“人造肉”的认知度还不高，更遑论认可度了，这是消费者对“人造肉”消费意愿不强的原因。\n论据：无。\n本题论点讨论的是消费者对“人造肉”的认知度和认可度低导致消费意愿不强，只有论点没有论据，本题为选非题，排除能削弱的选项即可。\n第二步：逐一分析选项。\nA项：消费者消费不起价格更高的“人造肉”，说明消费者消费意愿不强是因为“人造肉”价格高，而非对“人造肉”的认知度和认可度低，可以削弱，排除；\nB项：多数消费者认为吃人工合成的“人造肉”有害健康，这正是消费者对“人造肉”认知度和认可度低的体现，说明确实是消费者的认知度和认可度影响了消费意愿，为加强项，无法削弱，当选；\nC项：“人造肉”产品种类单一，无法满足消费者日常饮食需求，说明消费者消费意愿不强是因为“人造肉”种类单一，而非对“人造肉”的认知度和认可度低，可以削弱，排除；\nD项：74%的消费者因“人造肉”口感不如普通肉类而不愿复购，说明消费者消费意愿不强是因为“人造肉”口感差，而非对“人造肉”的认知度和认可度低，可以削弱，排除。\n本题为选非题，故正确答案为B。","no":78,"missingImage":false},{"type":"question","qid":"18650027","cat":"逻辑判断","stem":"推动特殊教育优质融合发展，需要多方位推进。特殊教育的发展必须以教育整体改革发展为前提，并且必将有利于教育整体改革发展。推动特殊教育优质融合发展，还需要持续扩优提质。资源是发展的保障，质量是永恒的话题，这两点对于当前特殊教育的发展都是必不可少、缺一不可的。\n由此可以推出的是（    ）。","options":{"A":"有了资源和质量必将推动当前特殊教育的发展","B":"没有教育整体改革发展就不会有特殊教育的发展","C":"有了多方位推进就能推动特殊教育优质融合发展","D":"没有持续扩优提质也能推动特殊教育优质融合发展"},"answer":"B","explanation":"第一步：翻译题干。\n（1）推动特殊教育优质融合发展\u003cimg data-k=\"a37757d411ef\">多方位推进；\n（2）特殊教育的发展\u003cimg data-k=\"a37757d411ef\">教育整体改革发展；\n（3）特殊教育的发展\u003cimg data-k=\"a37757d411ef\">有利于教育整体改革发展；\n（4）推动特殊教育优质融合发展\u003cimg data-k=\"a37757d411ef\">持续扩优提质；\n（5）特殊教育的发展\u003cimg data-k=\"a37757d411ef\">资源 且 质量。\n第二步：逐一分析选项。\nA项：翻译为“资源 且 质量\u003cimg data-k=\"a37757d411ef\">特殊教育的发展”，是对条件（5）的肯后，肯后推不出确定性结论，无法推出，排除；\nB项：翻译为“特殊教育的发展\u003cimg data-k=\"a37757d411ef\">教育整体改革发展”，是对条件（2）的肯前，肯前必肯后，可以推出，当选；\nC项：翻译为“多方位推进\u003cimg data-k=\"a37757d411ef\">推动特殊教育优质融合发展”，是对条件（1）的肯后，肯后推不出确定性结论，无法推出，排除；\nD项：翻译为“\u003cimg data-k=\"0be436194951\">持续扩优提质 且 推动特殊教育优质融合发展”，与条件（4）矛盾，无法推出，排除。\n故正确答案为B。","no":79,"missingImage":false},{"type":"question","qid":"18650033","cat":"逻辑判断","stem":"一项报告显示，尽管R国有着全球最大的科研队伍之一，但其高质量科研产出的数量却在持续下降。对于R国高质量科研产出下降的原因，有不少学者认为是由科研经费不足导致的。在过去的20年间，R国的科研经费仅增长了10%，远远低于其他很多国家的水平。但实际上，科研经费不足只会导致科研人员投入科研工作的时间减少，其并不是高质量科研产出下降的原因。\n以下哪项如果为真，最能削弱上述结论?（    ）","options":{"A":"R国高质量科研产出占世界总量的比重并没有下降","B":"科研人员的科研工作时间减少是高质量科研产出下降的原因","C":"科研人员岗位不稳定，使其无法安心工作，产出高质量科研成果","D":"科研人员参与教学和产业合作，虽然减少了其科研时间，但却很有意义"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：科研经费不足只会导致科研人员投入科研工作的时间减少，其并不是高质量科研产出下降的原因。\n论据：无。\n本题只有论点没有论据，削弱优先考虑削弱论点，即“科研经费不足是高质量科研产出下降的原因”。\n第二步：逐一分析选项。\nA项：R国高质量科研产出占世界总量的“比重”并没有下降，而论点讨论的是高质量科研产出的“数量”下降的原因，话题不一致，为无关项，无法削弱，排除；\nB项：科研人员的科研工作时间减少会导致高质量科研产出下降，而科研经费不足会导致科研工作时间减少，因此科研经费不足会导致高质量科研产出下降，削弱论点，可以削弱，当选；\nC项：科研人员“岗位不稳定”使其无法产出高质量科研成果，但并不清楚“科研经费不足”是否会导致高质量科研产出下降，无法削弱，排除；\nD项：科研人员参与教学和产业合作很有意义，而论点讨论的是科研经费不足不会导致高质量科研产出下降，话题不一致，为无关项，无法削弱，排除。\n故正确答案为B。","no":80,"missingImage":false},{"type":"question","qid":"18650031","cat":"逻辑判断","stem":"品牌电动汽车深受消费者喜爱，其生产的纯电动汽车连续几年在全球销量领先。从今年1月开始，该品牌掀起了一轮前所未有的降价风暴，一度吸引了大量消费者，并在前两个季度创下销量历史新高。但是进入三季度之后，销量却开始持续下滑。有分析人士认为，这是由于最初的低价推出后，刺激了销量，但是在经历了两个季度之后降价效应减弱，导致销量下滑，并非像有些人认为的是由该品牌的竞争对手蚕食市场导致的。\n以下哪项如果为真，最能削弱上述结论？（    ）","options":{"A":"尽管销量下滑，但该品牌表示仍然会继续降价","B":"竞争对手蚕食电动车市场导致该品牌的降价效应减弱","C":"其他品牌的电动车目前还无法撼动该品牌的市场地位","D":"该品牌降价销售极大地挤压了利润，不利于企业后期的技术更新"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：进入三季度之后，销量开始持续下滑是由于最初的低价推出后，刺激了销量，但是在经历了两个季度之后降价效应减弱，导致销量下滑，并非像有些人认为的是由该品牌的竞争对手蚕食市场导致的。\n论据：从今年1月开始，该品牌掀起了一轮前所未有的降价风暴，一度吸引了大量消费者，并在前两个季度创下销量历史新高。但是进入三季度之后，销量却开始持续下滑。\n本题的论点、论据讨论的都是该品牌纯电动汽车销量进入三季度之后持续下滑的原因，二者话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出该品牌即使销量下滑也会继续降价，讨论的是该品牌后续如何定价，而论点讨论的是该品牌纯电动汽车销量下滑的原因，二者话题不一致，无法削弱，排除；\nB项：该项指出竞争对手蚕食电动车市场导致该品牌的降价效应减弱，进而导致汽车销量下滑，说明竞争对手蚕食电动车市场才是该品牌纯电动汽车销量下滑的根本原因，直接削弱论点，可以削弱，当选；\nC项：该项指出其他品牌目前还无法撼动该品牌的市场地位，讨论的是该品牌的市场地位如何，而论点讨论的是该品牌纯电动汽车销量下滑的原因，二者话题不一致，无法削弱，排除；\nD项：该项指出该品牌的降价销售不利于企业技术更新，讨论的是降价销售有哪些影响，而论点讨论的是该品牌纯电动汽车销量下滑的原因，二者话题不一致，无法削弱，排除。\n故正确答案为B。","no":81,"missingImage":false},{"type":"question","qid":"18650034","cat":"逻辑判断","stem":"研究人员发现，许多鸟类的体型在进化过程中正在逐渐变小，罪魁祸首是全球气候变暖。研究人员在30个不同地点捕捉到40只成年麻雀，通过比较和测量发现，对它们的体型尺寸而言，其所生活的区域夏季最高温的影响远远大于冬季最低温，而夏季正是它们繁殖的季节。在炎热夏季出生的雏鸟更可能成长为体型较小的成鸟。研究人员认为，鸟类体型变小，是其适应气候变暖的结果。\n以下哪项如果为真，最能支持上述结论？（    ）","options":{"A":"与温暖地区相比，寒冷地区的生物体型会更大，以利于保温","B":"在全球变暖的过程中，鸟类通过改变体型大小以适应这一过程","C":"气候变暖使禽疟疾北移，这种血液寄生虫病会更严重影响鸟类的健康","D":"气候变暖导致食物减少，鸟类通过减少种群规模的方式适应这种变化"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：鸟类体型变小，是其适应气候变暖的结果。\n论据：研究人员发现，许多鸟类的体型在进化过程中正在逐渐变小，罪魁祸首是全球气候变暖。\n本题的论点和论据都在讨论“气候变暖”与“鸟类体型变小”之间的关系，二者话题一致，加强可以考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出寒冷地区生物体型更大以利于保温，讨论的是“温暖地区和寒冷地区生物体型存在差异”，而论点讨论的是“鸟类体型变小”的原因，话题不一致，无法加强，排除；\nB项：该项指出鸟类通过改变体型大小以适应全球变暖这一过程，说明全球变暖确实会导致鸟类体型变小，补充论据，可以加强，当选；\nC项：该项指出气候变暖导致禽疟疾北移影响鸟类健康，讨论的是“气候变暖对鸟类健康的危害”，而论点讨论的是“鸟类体型变小”的原因，话题不一致，无法加强，排除；\nD项：该项指出气候变暖导致食物减少，鸟类通过减少种群规模适应，说明鸟类适应气候变暖的方式是“减少种群规模”，而非“体型变小”，与论点讨论的“体型变小”无关，话题不一致，无法加强，排除。\n故正确答案为B。","no":82,"missingImage":false},{"type":"question","qid":"18650039","cat":"逻辑判断","stem":"法律和道德都是调整社会关系、维护社会秩序的重要手段。法律调整那些对建立正常社会秩序具有比较重要意义的社会关系。从这一点上讲，在调整社会关系方面，法律和道德调整的范围不同。\n上述论证的成立需要补充以下哪项作为前提？（    ）","options":{"A":"法律调整的范围不是固定不变的，会随着社会生活的变化发生变化","B":"法律作用于人的外部行为，道德则主要作用于人的内心世界","C":"道德调整的范围几乎涉及到社会关系的各个领域和方面","D":"道德对法律的漏洞或者空白之处具有弥补作用"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：在调整社会关系方面，法律和道德调整的范围不同。\n论据：法律和道德都是调整社会关系、维护社会秩序的重要手段。法律调整那些对建立正常社会秩序具有比较重要意义的社会关系。\n本题论点讨论的是“法律与道德调整的范围不同”，论据讨论的是“法律只调整重要的社会关系”，二者话题不一致，加强优先考虑搭桥，需要说明在调整社会关系方面，道德的范围不同于法律。\n第二步：逐一分析选项。\nA项：该项指出法律调整的范围会随社会生活的变化而变化，而题干论点讨论的是法律和道德调整社会关系的范围是否相同，话题不一致，无法加强，排除；\nB项：该项指出法律作用于人的外部行为，而道德则作用于人的内心世界，说明法律和道德的作用对象不同，而题干论点讨论的是法律和道德调整社会关系的范围是否相同，话题不一致，无法加强，排除；\nC项：该项指出道德调整的范围几乎涉及到社会关系的各个领域和方面，而法律调整的只是具有重要意义的社会关系，这说明道德与法律的调整范围不同，为搭桥项，可以加强，当选；\nD项：该项指出道德对法律的漏洞或者空白之处具有弥补作用，但并不明确这种弥补作用是否与调整社会关系有关，不明确项，无法加强，排除。\n故正确答案为C。","no":83,"missingImage":false},{"type":"question","qid":"18650037","cat":"逻辑判断","stem":"研究人员分析了4大洲113种鸟类、蝙蝠和蜥蜴等食虫动物栖息地被剥夺后的情况，并对昆虫数量和植物生长的影响进行了量化。研究结果表明，这些食虫动物有效减少了植物天敌的数量，对植物的生长具有正面影响，研究人员据此认为，鸟类、蝙蝠和蜥蜴等食虫动物可减缓全球气候变暖。\n上述论证的成立需要补充以下哪项作为前提？（    ）","options":{"A":"一些昆虫本身就会释放可加速全球气候变暖的温室气体","B":"植物吸收二氧化碳并释放氧气的过程可减缓全球气候变暖","C":"这些食虫动物的存在改变了森林系统气体循环时二氧化碳的比例","D":"食虫动物、植物和昆虫的数量保持平衡可对全球气候变化起到积极作用"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：鸟类、蝙蝠和蜥蜴等食虫动物可减缓全球气候变暖。\n论据：研究人员分析了4大洲113种鸟类、蝙蝠和蜥蜴等食虫动物栖息地被剥夺后的情况，并对昆虫数量和植物生长的影响进行了量化。研究结果表明，这些食虫动物有效减少了植物天敌的数量，对植物的生长具有正面影响。\n本题论点讨论的是“食虫动物可减缓全球气候变暖”，论据讨论的是“食虫动物对植物的生长有正面影响”，论点论据话题不一致，加强优先考虑搭桥，即建立“植物生长”与“减缓全球变暖”之间的联系。\n第二步：逐一分析选项。\nA项：该项指出一些昆虫本身会释放温室气体，因此食虫动物可以通过减少这些昆虫数量，进而减少温室气体，最终减缓全球气候变暖，补充论据，可以加强，保留；\nB项：该项指出植物吸收二氧化碳并释放氧气的过程可减缓全球气候变暖，建立了“植物生长”与“减缓全球变暖”之间的联系，为搭桥项，可以加强，保留；\nC项：该项指出这些食虫动物的存在改变了森林系统气体循环时二氧化碳的比例，但不明确二氧化碳的比例是升高了还是降低了，对减缓全球气候变暖是否具有正向作用，为不明确项，无法加强，排除；\nD项：该项指出食虫动物、植物和昆虫的数量保持平衡可对全球气候变化起到积极作用，而题干论点论据讨论的是食虫动物对植物生长以及减缓全球气候变暖的作用，并非食虫动物、植物和昆虫三者数量间的关系，话题不一致，无法加强，排除。\n对比A、B两项，B项的搭桥力度大于A项的补充论据，B项当选。\n故正确答案为B。","no":84,"missingImage":false},{"type":"question","qid":"18650042","cat":"逻辑判断","stem":"研究人员招募了1600名年龄在50~80岁之间的男性，他们的生活方式使他们有罹患肠癌的风险。研究人员先采集这些人的初始血样，然后让他们在室内自行车上以中等强度骑行3分钟，结束后立即采集第二份血样。结果发现，与静息样本相比，运动后直接采集的血样中抑制某些癌细胞生长的IL-6蛋白增加了。随后研究人员在血样内加入肠癌细胞，发现与静息样本相比，运动后直接采集的血样减缓了癌细胞的生长速度。研究人员认为，适度锻炼可降低罹患肠癌的风险。\n以下哪项如果为真，最能支持上述结论？（    ）","options":{"A":"受到肠癌细胞攻击的健康细胞，其受损DNA在一定的疗法下可以修复","B":"研究人员让参与者高强度锻炼60分钟，没有发现血样中IL-6蛋白增加","C":"进行适度锻炼还可增强肌体免疫力，降低肺癌、肝癌的患病风险","D":"实验中发现，经过适度锻炼后，IL-6蛋白能够释放到血液中去"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：适度锻炼可降低罹患肠癌的风险。\n论据：研究人员招募了1600名年龄在50~80岁之间的男性，他们的生活方式使他们有罹患肠癌的风险。研究人员先采集这些人的初始血样，然后让他们在室内自行车上以中等强度骑行3分钟，结束后立即采集第二份血样。结果发现，与静息样本相比，运动后直接采集的血样中抑制某些癌细胞生长的IL-6蛋白增加了。随后研究人员在血样内加入肠癌细胞，发现与静息样本相比，运动后直接采集的血样减缓了癌细胞的生长速度。\n本题论点和论据均在讨论“适度锻炼”与“降低罹患肠癌风险”之间的关系，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出受到肠癌细胞攻击的健康细胞可以修复，而论点讨论的是适度锻炼能否降低罹患肠癌的风险，话题不一致，无法加强，排除；\nB项：该项指出“高强度锻炼”不能使血样中IL-6蛋白增加，而论点讨论的是“适度锻炼”，话题不一致，无法加强，排除；\nC项：该项指出适度锻炼可以降低“肺癌、肝癌”的患病风险，而论点讨论的是适度锻炼能否降低罹患“肠癌”的风险，话题不一致，无法加强，排除；\nD项：该项指出经过适度锻炼后，IL-6蛋白能够释放到血液中去，说明适度锻炼可以抑制血液中肠癌细胞的生长，从而降低罹患肠癌的风险，补充论据，可以加强，当选。\n故正确答案为D。","no":85,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2023年1~5月，中国蓄电池出口量16.81亿个，同比下降9.4%；出口金额283.77亿美元，同比增长58.2%。\u003c/p>\u003cp>\u003cimg data-k=\"f3cfec79de87\" style=\"max-width:646px\">\u003c/p>","questions":[{"qid":"14096257","cat":"综合","stem":"2022年1~5月，中国蓄电池出口量在以下哪个范围内？","options":{"A":"不到16亿个","B":"16亿个~17亿个之间","C":"17亿个~18亿个之间","D":"超过18亿个"},"answer":"D","explanation":"根据题干“2022年1~5月，中国蓄电池出口量在以下
