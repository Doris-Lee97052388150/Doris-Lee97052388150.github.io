应速率和反应机理的化学分支学科”、“研究化学反应机理，揭示化学反应速率本质”，符合定义，排除；\nD项：研究的是铁与水、氧气的反应情况，判断防锈效果，生锈是化学变化，符合“研究化学反应速率和反应机理的化学分支学科”、“确定化学反应的速率以及温度、压力、催化剂、溶剂和光照等外界因素对反应速率的影响”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":85,"missingImage":false},{"type":"question","qid":"5445845","cat":"定义判断","stem":"政策工具是指实现政策目标所要运用的手段与方法。政策工具可分为以下三种：\n（1）供给型政策工具，对政策目标起直接促进作用，通常体现政府的重要政策导向，包含资金、人才、设施、技术、信息等方面的有效支持；（2）需求型政策工具，对政策目标起到拉动作用，释放对政策目标的需求，减少外部干扰，包括服务外包、直接采购、国际交流与贸易管制等；（3）环境型政策工具，对政策目标起到间接促进作用，通常体现为通过目标、计划、法规、金融与税收等方式提供有利的政策环境，包括目标规划、金融服务、税收优惠、法规管制以及策略性措施等。\n根据上述定义，下列属于促进养老服务的需求型政策工具的是：","options":{"A":"政府向养老机构购买居家养老服务，为低保家庭60周岁以上失能老人提供服务","B":"政府提供资金建设社区食堂，解决失能、独居、空巢等老年人“舌尖养老”难题","C":"政府鼓励技工院校开设老年服务与管理、健康服务与管理、护理等养老服务相关专业","D":"商务部发布《关于推动养老服务产业发展的指导意见》，提出打造养老服务品牌"},"answer":"A","explanation":"第一步：找出定义关键词。\n供给型政策工具：“对政策目标起直接促进作用”、“通常体现政府的重要政策导向”、“包含资金、人才、设施、技术、信息等方面的有效支持”；\n需求型政策工具：“对政策目标起到拉动作用，释放对政策目标的需求，减少外部干扰”、“包括服务外包、直接采购、国际交流与贸易管制等”；\n环境型政策工具：“对政策目标起到间接促进作用”、“通常体现为通过目标、计划、法规、金融与税收等方式提供有利的政策环境”、“包括目标规划、金融服务、税收优惠、法规管制以及策略性措施等”。\n第二步：逐一分析选项。\nA项：政府向养老机构购买居家养老服务，体现了将服务外包给养老机构，符合“对政策目标起到拉动作用，释放对政策目标的需求，减少外部干扰”、“包括服务外包、直接采购、国际交流与贸易管制等”，符合“需求型政策工具”定义，当选；\nB项：政府提供资金建设社区食堂，说明政府直接提供资金支持，不符合“包括服务外包、直接采购、国际交流与贸易管制等”，不符合“需求型政策工具”定义，符合“供给型政策工具”定义，排除；\nC项：政府鼓励技工院校开设养老服务相关专业，说明进行人才培养，提供人才支持，不符合“包括服务外包、直接采购、国际交流与贸易管制等”，不符合“需求型政策工具”定义，符合“供给型政策工具”定义，排除；\nD项：国务院发布《关于推动养老服务产业发展的指导意见》，说明提供有利的政策环境，提出目标规划，不符合“包括服务外包、直接采购、国际交流与贸易管制等”，不符合“需求型政策工具”定义，符合“环境型政策工具”定义，排除。\n故正确答案为A。","no":86,"missingImage":false},{"type":"question","qid":"5445862","cat":"定义判断","stem":"背信规避是指当风险来源为另一个体而不是自然条件时，人们普遍更不愿意冒险，即在同等条件下，人们对于人为风险的规避程度高于对客观风险的规避程度，体现在人们面对人为风险时比面对客观风险时表现得更保守。\n根据上述定义，下列没有体现背信规避的是：","options":{"A":"在对客观题阅卷方式意愿的调查中，学生更愿意选择机器阅卷而非人工阅卷","B":"决定谁先开球时，双方球员都倾向于由裁判抛硬币决定而非裁判随机指定","C":"在老师打算指派一个人多承担一项任务时，同学们纷纷表示要抽签决定","D":"与老司机相比，坐新手司机开的车时，后排座上的乘客主动系安全带的更多"},"answer":"D","explanation":"第一步：找出定义关键词。\n定义中比较易懂的关键词在于：“风险来源为另一个体而不是自然条件时”、“人为风险的规避程度高于对客观风险的规避程度”。\n第二步：逐一分析选项。\nA项：在客观题阅卷方式中，学生更愿意选择机器阅卷而非人工阅卷，机器阅卷对应客观风险，人工阅卷对应人为风险，“学生更愿意选择机器阅卷而非人工阅卷”，符合“人为风险的规避程度高于对客观风险的规避程度”，符合定义，排除；\nB项：在决定谁先开球时，双方球员都倾向于由裁判抛硬币决定而非裁判随机指定，抛硬币对应客观风险，裁判指定对应人为风险，“双方球员都倾向于由裁判抛硬币决定而不是裁判指定”，符合“人为风险的规避程度高于对客观风险的规避程度”，符合定义，排除；\nC项：在老师打算指派一个人多承担一项任务时，同学们纷纷表示要抽签决定，抽签对应客观风险，老师指派对应人为风险，“同学们纷纷表示要抽签决定”，符合“人为风险的规避程度高于对客观风险的规避程度”，符合定义，排除；\nD项：与老司机相比，坐新手司机开的车时，后排座上的乘客主动系安全带的更多，老司机开车与新手司机开车都对应人为风险，没有体现客观风险，“坐新手司机开的车时后排座上的乘客主动系安全带的更多”，只是人为风险规避程度的比较，不符合“人为风险的规避程度高于对客观风险的规避程度”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":87,"missingImage":false},{"type":"question","qid":"5445856","cat":"定义判断","stem":"植物病害分为侵染性病害和非侵染性病害。侵染性病害是由病原物引起的，可以在植物个体间互相传染的病害；非侵染性病害是由于环境不良、营养元素不足等非生物因素造成的病害，由于没有病原物的侵袭，所以不会在植物间相互传染。\n根据上述定义，下列属于非侵染性病害的是：\n①需要微酸性生长环境的杜鹃花，种植在偏碱性土壤中，叶片会黄化\n②植株浇水过多，盆土积水后，由于植株根系缺氧，会导致植株萎蔫\n③除草剂使用不当会引起西瓜苗嫩叶黄化，叶片枯焦，植株萎缩\n④灰葡萄孢真菌会引起番茄灰霉病，发病后造成番茄大量烂果","options":{"A":"仅①④","B":"仅①②","C":"仅①②③","D":"仅②③④"},"answer":"C","explanation":"第一步：找出定义关键词。\n侵染性病害：“由病原物引起”、“可以在植物个体间互相传染”；\n非侵染性病害：“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”。\n第二步：逐一进行分析。\n①：杜鹃花由于生长在偏碱性土壤环境中而导致其叶片黄化，其中偏碱性土壤属于环境因素，符合“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”，符合“非侵染性病害”的定义；\n②：植株由于盆土积水后，根系缺氧导致其萎蔫，其中盆土积水属于环境因素，符合“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”，符合“非侵染性病害”的定义；\n③：西瓜苗由于除草剂使用不当而导致其嫩叶黄化等后果，其中除草剂使用不当属于非生物因素，符合“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”，符合“非侵染性病害”的定义；\n④：番茄大量烂果是由灰葡萄孢真菌引起的，其中灰葡萄孢真菌属于病原物，而不是非生物因素，并且番茄因感染灰霉病而大量烂果，符合“由病原物引起”、“可以在植物个体间互相传染”，符合“侵染性病害”定义，不符合“非侵染性病害”的定义。\n综上，仅①②③符合“非侵染性病害”的定义。\n故正确答案为C。","no":88,"missingImage":false},{"type":"question","qid":"5445787","cat":"定义判断","stem":"单元素导语是指在撰写新闻导语（即消息的开头）时，突出表现一个新闻事实的导语。单元素导语按新闻五要素可分为：①何人导语，突出报道显要或影响大的新闻人物；②何事导语，突出报道新闻事实本身；③何时导语，突出报道读者关心的事情什么时候会发生或进行；④何地导语，突出报道一些重要或有特殊意义的地方发生重大变化的消息；⑤为什么导语，突出报道一个事件的起因。\n根据上述定义，下列导语与其分类对应正确的是：","options":{"A":"亲爱的读者，你知道为什么夏天夜空里看到的星星比冬天夜空里看到的多？——④","B":"1964年10月16日，我国第一颗原子弹爆炸成功——②","C":"杨先生带着2岁的女儿到市医院看病，没想到看一个“咳嗽”就要花1000多元——①","D":"谁是高考状元？这个一年一度的热门话题，今年却在XX省消失了——③"},"answer":"B","explanation":"第一步：找出定义关键词。\n单元素导语：“在撰写新闻导语（即消息的开头）时，突出表现一个新闻事实”；\n何人导语：“突出报道显要或影响大的新闻人物”；\n何事导语：“突出报道新闻事实本身”；\n何时导语：“突出报道读者关心的事情什么时候会发生或进行”；\n何地导语：“突出报道一些重要或有特殊意义的地方发生重大变化的消息”；\n为什么导语：“突出报道一个事件的起因”。\n第二步：逐一分析选项。\nA项：为什么夏天夜空看到的星星比冬天夜空里看到的多是想要表现事件的起因，符合“突出报道一个事件的起因”，符合“为什么导语”定义，不符合“何地导语”定义，对应错误，排除；\nB项：1964年10月16日，第一颗原子弹爆炸成功是新闻事实本身，符合“突出报道新闻事实本身”，符合“何事导语”定义，对应正确，当选；\nC项：杨先生带着女儿到医院看病，一个“咳嗽”花费1000多元是新闻事实本身，符合“突出报道新闻事实本身”，符合“何事导语”定义，不符合“何人导语”定义，对应错误，排除；\nD项：高考状元今年在XX省消失了，报道该省发生的重大变化，符合“突出报道一些重要或有特殊意义的地方发生重大变化的消息”，符合“何地导语”定义，不符合“何时导语”定义，对应错误，排除。\n故正确答案为B。","no":89,"missingImage":false},{"type":"question","qid":"5445915","cat":"定义判断","stem":"数字农业是指用数字化技术，按人类需要的目标，对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业。\n根据上述定义，下列没有体现数字农业的是：","options":{"A":"在大数据平台，点击任一块田地，就可以看到这块田地的土壤酸碱度、肥水条件、环境温度湿度等指标，农民可以根据这些信息进行田地管理","B":"某柑橘生产大省建立“柑橘产业大数据中心”，以数据驱动柑橘产业结构性改革和高质量发展","C":"通过电子标签等技术，对单个产品赋予身份编码及认证信息，在生产管理、仓储、物流、销售等环节实现信息追溯","D":"遇到连绵阴雨天，果蔬容易滋生病害，需要及时喷药，采用轻型直升机几个小时就可以完成传统作业方式十多人几天才能完成的工作"},"answer":"D","explanation":"第一步：找出定义关键词。\n“用数字化技术”、“对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业”。\n第二步：逐一分析选项。\nA项：在大数据平台，点击任一块田地就可以看到田地的一系列指标，符合“用数字化技术”，农民可以根据这些信息进行田地管理，符合“对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业”，符合定义，排除；\nB项：建立“柑橘产业大数据中心”，符合“用数字化技术”，以数据驱动柑橘产业结构性改革和高质量发展，符合“对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业”，符合定义，排除；\nC项：通过电子标签等技术对单个产品赋予身份编码及认证信息，符合“用数字化技术”，在各种环节实现信息追溯，符合“对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业”，符合定义，排除；\nD项：采用轻型直升机对果蔬进行喷药，只是提高了工作效率，没有体现利用数字化技术以及全程数字化和可视化表达等，不符合“用数字化技术”、“对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":90,"missingImage":false},{"type":"question","qid":"5445859","cat":"定义判断","stem":"小中取大法是指在决策时，首先计算各方案在不同自然状态下的收益，并找出各方案在最差自然状态下的收益，然后进行比较，选择在最差自然状态下收益最大或损失最小的方案作为最终方案的一种决策方法。大中取大法是指在决策时，首先计算各方案在不同自然状态下的收益，并找出各方案在最好自然状态下的收益，然后进行比较，选择在最好自然状态下收益最大的方案作为最终方案的一种决策方法。\n\u003cimg data-k=\"2e3ebfd87d45\" style=\"max-width:600px\">\n根据上述定义，分别使用小中取大法和大中取大法对上述方案进行决策，所选择的方案依次是：","options":{"A":"方案二和方案二","B":"方案二和方案一","C":"方案三和方案一","D":"方案三和方案二"},"answer":"D","explanation":"第一步：找出定义关键词。\n小中取大法：“找出各方案在最差自然状态下的收益”、“选择在最差自然状态下收益最大或损失最小的方案”；\n大中取大法：“找出各方案在最好自然状态下的收益”、“选择在最好自然状态下收益最大的方案作为最终方案”。\n第二步：逐一分析选项。\n依据设问使用“小中取大法”，需要符合“找出各方案在最差自然状态下的收益”、“选择在最差自然状态下收益最大或损失最小的方案”，表格中销路差此列对应的数据就是最差自然状态下的收益，方案三是销路差中收益最大的方案，因此根据“小中取大法”应选择方案三；\n依据设问使用“大中取大法”，需要符合“找出各方案在最好自然状态下的收益”、“选择在最好自然状态下收益最大的方案作为最终方案”，表格中销路好此列对应的数据就是最好自然状态下的收益，方案二是销路好中收益最大的方案，因此根据“大中取大法”应选择方案二，只有D项符合。\n故正确答案为D。","no":91,"missingImage":false},{"type":"question","qid":"5445924","cat":"定义判断","stem":"对称推断法是辨析文言词义的一种方法，是指通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析，推断其位置相对的文言词义的一种方法。\n根据上述定义，下列使用了对称推断法的是：","options":{"A":"归有光《项脊轩志》：“项脊轩，旧南阁子也。”其中的“也”，表判断的语气词，可不译","B":"吴均《与朱元思书》：“急湍甚箭，猛浪若奔。”其中的“箭”为名词，可据此推断“奔”也为名词，为“奔马”的意思","C":"《荀子·劝学》：“故木受绳则直，金就砺则利。”其中的“砺”，形旁为“石”，说明“砺”与“石”有关，意思是磨刀石","D":"《旧五代史·冯道传》：“臣所陈虽小，可以喻大。”成语“不言而喻”中的“喻”为“知晓”的意思，可据此推断此句中的“喻”为“知晓”的意思"},"answer":"B","explanation":"第一步：找出定义关键词。\n“通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析”、“推断其位置相对的文言词义”。\n第二步：逐一分析选项。\nA项：“项脊轩，旧南阁子也。”的意思是项脊轩，是过去的南阁楼，这句话没有运用对偶修辞格或排比修辞格，不符合“通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析”，不符合定义，排除；\nB项：“急湍甚箭，猛浪若奔。”的意思是湍急的水流比箭还快，凶猛的巨浪就像奔腾的骏马，这句话运用了对偶修辞格，“箭”和“奔”是位置相对的词语，可用“箭”推断“奔”的含义为“奔马”，符合“通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析”、“推断其位置相对的文言词义”，符合定义，当选；\nC项：“故木受绳则直，金就砺则利。”的意思是所以木材经墨线比量过就变得笔直，金属制的刀剑拿到磨刀石上去磨就能变得锋利，选项根据“砺”与“石”有关，推断其意思是磨刀石，但“石”并不是句子内部的词语，不符合“通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析”，不符合定义，排除；\nD项：“臣所陈虽小，可以喻大。”的意思是臣所说的这件事虽小，却可以说明大道理，这句话没有运用对偶修辞格或排比修辞格，不符合“通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析”，不符合定义，排除。\n故正确答案为B。","no":92,"missingImage":false},{"type":"question","qid":"5445919","cat":"定义判断","stem":"分布区是指某生物的活动、生存范围。如下图所示，用黑色方块表示该生物已知、推断或预计出现的位点。分布区的划定是环绕所有已知、推断或预计出现的位点的最短连续边界所包含的面积，经常用最小凸边形来表示。该最小凸边形的每个内角不能超过180度，并要包含所有出现的位点。\n根据上述定义，对于下列位点所划定的分布区正确的是：\n\u003cimg data-k=\"5980c2cbc244\" style=\"max-width:400px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"第一步：找出定义关键词。\n“环绕所有已知、推断或预计出现的位点的最短连续边界所包含的面积”、“用最小凸边形来表示”、“该最小凸边形的每个内角不能超过180度，并要包含所有出现的位点”。\n第二步：逐一分析选项。\nA项：该项所示的区域划定范围为所有位点的最短连续边界，且范围的形状为每个内角不超过180度的凸边形，同时包含所有出现的位点，符合定义，当选；\nB项：该项所示的区域划定范围内包含超过180度的内角，不符合“该最小凸边形的每个内角不能超过180度，并要包含所有出现的位点”，不符合定义，排除；\nC项：该项所示的区域划定范围外存在位点，不符合“该最小凸边形的每个内角不能超过180度，并要包含所有出现的位点”，不符合定义，排除；\nD项：该项所示的区域划定范围左下角及右侧未连接位点，不属于最短连续边界，不符合“环绕所有已知、推断或预计出现的位点的最短连续边界所包含的面积”，不符合定义，排除。\n故正确答案为A。","no":93,"missingImage":false},{"type":"question","qid":"5445858","cat":"定义判断","stem":"细胞学检查是指对患者病变部位脱落、刮取或穿刺抽取的细胞，进行病理形态学的观察并做出定性诊断的检查方式。细胞学检查主要应用于肿瘤的诊断，也可用于某些疾病的检查和诊断，如内部器官炎症性疾病的诊断和激素水平的判定等。\n根据上述定义，下列属于细胞学检查的是：","options":{"A":"采集患者血液样本，分析血细胞比例变化，判断患者是否出现感染","B":"针对外伤患者皮肤纤维细胞的过度增生，实行激光打磨法，抑制炎性细胞浸润，修复再生皮肤组织","C":"通过拉网法收集食道癌患者的食道脱落细胞，鉴定细胞形态，明确癌变性质","D":"对脑疝患者脑室穿刺，放出脑室液以降低脑压，后再次穿刺注入造影剂，诊断其颅内占位病变的情况"},"answer":"C","explanation":"第一步：找出定义关键词。\n“患者病变部位脱落、刮取或穿刺抽取的细胞”、“进行病理形态学的观察”、“做出定性诊断的检查方式”。\n第二步：逐一分析选项。\nA项：采集患者血液样本，分析血细胞比例变化，不涉及病变部位的细胞，不符合“患者病变部位脱落、刮取或穿刺抽取的细胞”，不符合定义，排除；\nB项：激光打磨抑制炎性细胞浸润，修复再生皮肤组织，属于一种治疗方法，而不是定性诊断的检查方式，不符合“做出定性诊断的检查方式”，不符合定义，排除；\nC项：食道癌患者的食道脱落细胞，符合“患者病变部位脱落的细胞”，鉴定细胞形态，符合“进行病理形态学的观察”，明确癌变性质，符合“做出定性诊断的检查方式”，符合定义，当选；\nD项：放出脑室液以降低脑压，后再次穿刺注入造影剂，诊断其颅内占位病变的情况，是通过注入造影剂进行观察诊断，而不是对细胞进行观察诊断，不符合“患者病变部位脱落、刮取或穿刺抽取的细胞”，不符合定义，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"5445920","cat":"类比推理","stem":"花海：书山","options":{"A":"怒火：苦雨","B":"车流：人潮","C":"雪白：麦浪","D":"龙舟：木马"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n花海指的是像海洋般广阔的花群，书山指的是像山峰般高耸的书籍，二者为并列关系，且后一个字修饰前一个字。\n第二步：判断选项词语间逻辑关系。\nA项：怒火和苦雨不是并列关系，并且是“苦”修饰“雨”，前一个字修饰后一个字，与题干顺序不一致，排除；\nB项：车流指的是像河流般连续不断的车辆，人潮指的是像潮水一样的人群，二者为并列关系，且“流”修饰“车”，“潮”修饰“人”，与题干逻辑关系一致，当选；\nC项：雪白和麦浪无明显逻辑关系，与题干逻辑关系不一致，排除；\nD项：龙舟和木马为并列关系，但龙舟是指龙形船，“龙”修饰“舟”，“木”修饰“马”，都是前一个字修饰后一个字，与题干顺序不一致，排除。\n故正确答案为B。","no":95,"missingImage":false},{"type":"question","qid":"5445863","cat":"类比推理","stem":"猛药去疴：重典治乱","options":{"A":"民生在勤：勤则不匮","B":"从善如登：从恶如崩","C":"静以修身：俭以养德","D":"名非天造：必从其实"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“猛药去疴”意思是通过威力大的药达到去除疾病的目的，“重典治乱”意思是通过严酷的刑罚达到惩治坏人的目的，二者都可指问题很严重，必须采取有力的措施来处理，二者是近义关系，但选项没有近义关系，考虑拆词看结构，“猛药去疴”和“重典治乱”拆词后都能构成方式目的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“民生在勤”的意思是人民的生计在于勤劳，“勤则不匮”意思是勤劳就不会缺乏财物，二者拆词之后不存在方式目的对应关系，与题干逻辑关系不一致，排除；\nB项：“从善如登”意思是顺随良善像登山一样难，比喻学好向善很难，“从恶如崩”意思是顺随恶行像山崩一样容易，比喻学坏很容易，二者拆词之后不存在方式目的对应关系，与题干逻辑关系不一致，排除；\nC项：“静以修身”意思是通过内心安静精力集中来修养身心，“俭以养德”意思是通过俭朴的作风来培养品德，二者拆词后都能构成方式目的对应关系，与题干逻辑关系一致，当选；\nD项：“名非天造”的意思是名称不是天生就有的，“必从其实”的意思是必须依据其客观现实，二者拆词之后不存在方式目的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":96,"missingImage":false},{"type":"question","qid":"5445873","cat":"类比推理","stem":"强光照射：视力损伤","options":{"A":"台风过境：渔业停产","B":"网络招聘：业务扩张","C":"原油进口：能源紧缺","D":"风险防范：消防演练"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“强光照射”会导致“视力损伤”，二者为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“台风过境”会导致“渔业停产”，二者为因果对应关系，与题干逻辑关系一致，当选；\nB项：“业务扩张”会导致“网络招聘”，二者为因果对应关系，但词语顺序与题干相反，与题干逻辑关系不一致，排除；\nC项：“能源紧缺”会导致“原油进口”，二者为因果对应关系，但词语顺序与题干相反，与题干逻辑关系不一致，排除；\nD项：“风险防范”是“消防演练”的目的，二者为方式与目的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":97,"missingImage":false},{"type":"question","qid":"5445912","cat":"类比推理","stem":"一望无垠：辽阔","options":{"A":"人云亦云：重复","B":"耳提面命：教导","C":"方兴未艾：失败","D":"厉兵秣马：战斗"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“一望无垠”意思是宽广、辽阔，一眼望去看不到边际，与“辽阔”是近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“人云亦云”意思是人家怎么说，自己也跟着怎么说，指没有主见，随声附和别人，是贬义词；“重复”指相同的事物又一次出现，“重复”并不局限于重复他人的观点，且是中性的词语，二者不是近义关系，与题干逻辑关系不一致，排除；\nB项：“耳提面命”意思是拉着耳朵，面对面地教导，形容恳切地教诲，与“教导”是近义关系，与题干逻辑关系一致，当选；\nC项：“方兴未艾”意思是事物正在兴起、发展，一时不会终止，与“失败”是反义关系，与题干逻辑关系不一致，排除；\nD项：“厉兵秣马”意思是把兵器磨快，把战马喂饱，形容做好战前准备，强调的是事前做好准备工作，与“战斗”不是近义关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":98,"missingImage":false},{"type":"question","qid":"5445916","cat":"类比推理","stem":"特征提取：模式匹配：语音识别","options":{"A":"接诊病人：网上挂号：健康宣教","B":"提交资料：资格审核：报名成功","C":"询问证人：勘验现场：接到报警","D":"海事损害：请求赔偿：租赁船只"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n先特征提取，再模式匹配，最后语音识别，三者为时间先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：先网上挂号，再接诊病人，第一词与第二词的顺序与题干相反，与题干逻辑关系不一致，排除；\nB项：先提交资料，再资格审核，最后报名成功，与题干逻辑关系一致，当选；\nC项：先接到报警，再询问证人和勘验现场，与题干逻辑关系不一致，排除；\nD项：先租赁船只，再海事损害，最后请求赔偿，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":99,"missingImage":false},{"type":"question","qid":"5445779","cat":"类比推理","stem":"春季过敏：花粉：喷嚏","options":{"A":"肺炎：咳嗽：支原体","B":"乙型脑炎：病毒：发热","C":"失眠：恐惧：噩梦","D":"秋季腹泻：饮食：脱水"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n花粉可能会导致春季过敏，前两词为因果关系；打喷嚏是春季过敏的症状，第一词和第三词为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：咳嗽是肺炎的症状，前两词为对应关系；支原体感染可能会导致肺炎，第一词和第三词为因果关系，与题干逻辑关系不一致，排除；\nB项：病毒感染可能会导致乙型脑炎，前两词为因果关系；发热是乙型脑炎的症状，第一词和第三词为对应关系，与题干逻辑关系一致，当选；\nC项：恐惧可能会导致失眠，前两词为因果关系；噩梦不是失眠的症状，与题干逻辑关系不一致，排除；\nD项：秋季腹泻指发生在秋冬季的腹泻病，原因可能是饮食不当或饮食不洁，而非饮食，前两词不是因果关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":100,"missingImage":false},{"type":"question","qid":"5445868","cat":"类比推理","stem":"片剂：散剂：气雾剂","options":{"A":"边塞诗：山水诗：抒情诗","B":"口头契约：君子协定：书面协议","C":"泉水：湖水：天然水","D":"头部理疗：腰部理疗：腿部理疗"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n片剂是药物与辅料均匀混合后压制而成的片状或异形片状的固体制剂，散剂是指药物或与适宜的辅料经粉碎、均匀混合制成的干燥粉末状制剂，气雾剂是指药物和抛射剂共同封装于带有阀门的耐压容器中，使用时借抛射剂气化所产生的压力，定量或非定量地将药物以雾状喷出的制剂。三者是根据药物的剂型划分的，为并列关系中的反对关系。\n第二步：判断选项词语间逻辑关系。\nA项：边塞诗是以边疆地区军民生活和自然风光为题材的诗，山水诗是描写山水风景的诗，抒情诗是抒发诗人思想感情的诗，三者互为交叉关系，与题干逻辑关系不一致，排除；\nB项：口头契约是指不用书面的形式，通过口头达成的协议，书面协议指以书面形式达成的协议，二者均以协议形式进行划分，为并列关系，但君子协定是借指彼此之间互相信任的约定，并不是以协议形式进行划分，与另外两词不构成并列关系，与题干逻辑关系不一致，排除；\nC项：泉水是指从地下流出来的水，一般是天然水，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：头部理疗、腰部理疗和腿部理疗是根据理疗的身体部位划分的，三者为并列关系中的反对关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":101,"missingImage":false},{"type":"question","qid":"5445790","cat":"类比推理","stem":"标清：高清：超清","options":{"A":"亚音速：音速：超音速","B":"厅级：市级：省级","C":"迁怒：愤怒：暴怒","D":"幽静：寂静：安静"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n三者均对清晰度进行分类，构成并列关系，且清晰度依次递增。\n第二步：判断选项词语间逻辑关系。\nA项：三者均对速度进行分类，构成并列关系，且速度依次递增，与题干逻辑关系一致，当选；\nB项：厅级是我国的一个行政级别，而市级和省级属于我国的行政区划，三者不构成并列关系，与题干逻辑关系不一致，排除；\nC项：迁怒为动词，指把怒气发泄到别人身上，愤怒为形容词，指因极度不满而情绪激动，暴怒指极端愤怒，三者不构成并列关系，与题干逻辑关系不一致，排除；\nD项：幽静指清幽寂静，寂静指没有声音、很静，安静指安稳平静、没有声音，三者均是对静的描述，构成并列关系，但不是静的程度从低到高的依次递增，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":102,"missingImage":false},{"type":"question","qid":"5445791","cat":"类比推理","stem":"刑事警察 对于 （    ） 相当于 （    ） 对于 对外交涉","options":{"A":"公安机关；维护主权","B":"刑事案件；驻外武官","C":"打击犯罪；外交人员","D":"交通警察；外交领事"},"answer":"C","explanation":"逐一代入选项。\nA项：刑事警察是构成公安机关的一部分，二者为组成关系；对外交涉的目的是为了维护主权，二者为方式目的对应关系，前后逻辑关系不一致，排除；\nB项：刑事警察的主要任务是侦查刑事案件，刑事案件本身是一个名词，只是刑事警察的工作对象，二者为职业与工作对象的对应关系；驻外武官的主要任务是对外交涉，二者为职业与工作内容的对应关系，前后逻辑关系不一致，排除；\nC项：刑事警察的工作内容是打击犯罪，二者为职业与工作内容的对应关系；外交人员的工作内容是对外交涉，二者为职业与工作内容的对应关系，前后逻辑关系一致，当选；\nD项：刑事警察和交通警察都是警察，二者为并列关系中的反对关系；外交领事是一国根据协议派驻他国某城市或某地区的代表，是进行对外交涉的代表人物，二者是职业与工作内容的对应关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":103,"missingImage":false},{"type":"question","qid":"5445853","cat":"类比推理","stem":"缄口不言 对于 （    ） 相当于 （    ） 对于 虚怀若谷","options":{"A":"三缄其口；大智若愚","B":"畅所欲言；放荡不羁","C":"守口如瓶；礼贤下士","D":"口若悬河；矜功伐善"},"answer":"D","explanation":"逐一代入选项。\nA项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。三缄其口形容说话极其谨慎、不轻易开口，二者为近义关系；大智若愚指有智慧有才能的人，看起来好像很愚笨，也比喻有智慧的人极有涵养，不露锋芒。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者不是近义关系，前后逻辑关系不一致，排除；\nB项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。畅所欲言指尽情地说出想说的话，没有约束地把心里话吐露出来，二者为反义关系；放荡不羁意思是放纵任性，不加检点，不受约束。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者不是反义关系，前后逻辑关系不一致，排除；\nC项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。守口如瓶意思是闭口不谈，像瓶口塞紧了一般，形容说话谨慎，严守秘密，二者为近义关系；礼贤下士形容重视人才。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者不是近义关系，前后逻辑关系不一致，排除；\nD项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。口若悬河意为说话滔滔不绝，像河水倾泄一样，形容能说善辩，话语不断，二者为反义关系；矜功伐善意思是夸耀自己的功劳和才能，形容极不虚心。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者为反义关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":104,"missingImage":false},{"type":"question","qid":"5445794","cat":"逻辑判断","stem":"人们感受气味通过嗅觉受体实现。研究发现：随着人类的演化，编码人类嗅觉受体的基因不断突变，许多在过去能强烈感觉气味的嗅觉受体已经突变为对气味不敏感的受体，与此同时，人类嗅觉受体的总体数目也随时间推移逐渐变少。由此可以认为，人类的嗅觉经历着不断削弱、逐渐退化的过程。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"随着人类进化，嗅觉中枢在大脑皮层中所占面积逐渐减少","B":"相对于视觉而言，嗅觉在人类感觉系统中的重要性较低","C":"人类有大约1000个嗅觉受体相关基因，其中只有390个可以编码嗅觉受体","D":"不同人群之间嗅觉存在很大差异，老年人的嗅觉敏感性明显低于年轻人"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：人类的嗅觉经历着不断削弱、逐渐退化的过程。\n论据：随着人类的演化，编码人类嗅觉受体的基因不断突变，许多在过去能强烈感觉气味的嗅觉受体已经突变为对气味不敏感的受体，与此同时，人类嗅觉受体的总体数目也随时间推移逐渐变少。\n本题论点论据均在讨论人类的嗅觉在逐渐退化，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出嗅觉中枢在大脑皮层中所占面积逐渐减少，说明嗅觉能力在降低，补充论据，可以加强，当选；\nB项：该项比较了视觉和嗅觉在人类感觉系统中的重要性，而论点讨论的是人类的嗅觉是否退化，话题不一致，无法加强，排除；\nC项：该项指出了人类的1000个嗅觉受体相关基因中有390个可以编码嗅觉受体，没有体现出数量变化的多少，而题干讨论的是嗅觉逐渐退化的过程，话题不一致，无法加强，排除；\nD项：该项讨论的是老年人和年轻人的嗅觉敏感性，而论点讨论的是人类的嗅觉是否退化，话题不一致，无法加强，排除。\n故正确答案为A。","no":105,"missingImage":false},{"type":"question","qid":"5445803","cat":"逻辑判断","stem":"R行星是位于太阳系的一颗小行星，质量不大，平均直径不足500米。在对R行星进行长达一年的观测后，人们发现其表面长期漂浮着砂粒，且砂粒在漂浮一段时间后，还会重新落在行星表面。由于R行星表面没有稳定的大气层，因此人们认为砂粒漂浮的现象主要来自静电，原因是太阳风进入行星表面产生电场时，砂粒会因静电力的作用离开行星表面漂浮游动起来，当没有太阳风时，砂粒又会回落下来。\n以下哪项如果为真，没有质疑上述观点？","options":{"A":"R行星与彗星组成类似，彗星靠近太阳时，受太阳风产生的静电影响，其表面砂粒将会漂浮","B":"R行星表面存在一氧化碳、干冰等挥发性物质，其升华会带动砂粒的释放与漂浮","C":"R行星质量小，静电作用只能扬起毫米级的砂粒，但目前其表面漂浮的砂粒尺寸都很大","D":"R行星自转速度快，星球上的物体受到离心作用强，其表面尘埃与石块会脱离引力束缚，剥落散逸"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：R行星砂粒漂浮的现象主要来自静电。\n论据：R行星表面没有稳定的大气层，太阳风进入行星表面产生电场时，砂粒会因静电力的作用离开行星表面漂浮游动起来，当没有太阳风时，砂粒又会回落下来。\n本题论点和论据讨论的都是砂粒漂浮和静电的关系，论点论据话题一致，本题为削弱选非题，排除能够削弱的选项即可。\n第二步：逐一分析选项。\nA项：该项指出R行星与彗星组成类似，彗星表面砂粒漂浮的原因是静电，所以R行星表面砂粒漂浮的原因也可能是静电，属于类比加强，无法削弱，当选；\nB项：该项指出R行星表面的一氧化碳、干冰等挥发性物质升华会带动砂粒漂浮，说明R行星砂粒漂浮存在其他原因，他因削弱，可以削弱，排除；\nC项：该项指出R行星的静电只能扬起毫米级的砂粒，但其表面漂浮的砂粒尺寸很大，因此R行星的静电无法使R行星砂粒漂浮，说明R行星砂粒漂浮的现象并非主要来自静电，削弱论点，可以削弱，排除；\nD项：该项指出R行星自转速度快导致砂粒漂浮，说明R行星砂粒漂浮存在其他原因，他因削弱，可以削弱，排除。\n本题为选非题，故正确答案为A。","no":106,"missingImage":false},{"type":"question","qid":"5445857","cat":"逻辑判断","stem":"调查显示，某地区第二产业从业人员与五年前相比减少了10.4%，对于第二产业从业人员减少的原因，一种观点认为，产业优化升级是第二产业从业人员减少的原因，第二产业在实现产业规模快速扩大的同时，不断加快技术改造，实现“机器换工”，客观上降低了工业企业的用工需求。另一种观点则认为，这与第二产业的优化升级无关，第三产业的蓬勃发展发挥了就业“蓄水池”的功能，吸纳了大量第二产业从业人员。\n以下哪项如果为真，最能削弱第二种观点？","options":{"A":"第二产业优化升级拉动了第三产业蓬勃发展","B":"该地区第三产业的整体规模比第二产业要小","C":"第三产业的发展得益于持续优化的营商环境","D":"第二产业和第三产业都对吸纳就业作出贡献"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：第二产业从业人员减少的原因，与第二产业的优化升级无关，第三产业的蓬勃发展发挥了就业“蓄水池”的功能，吸纳了大量第二产业从业人员。\n论据：无。\n本题只有论点没有论据，削弱优先考虑直接否定论点。\n第二步：逐一分析选项。\nA项：该项说的是第二产业优化升级拉动了第三产业蓬勃发展，进而导致第二产业从业人员减少，也就是说，导致第二产业从业人员减少的根本原因还是第二产业优化升级，直接削弱了论点，可以削弱，当选；\nB项：该项说的是该地区第三产业的整体规模比第二产业要小，与题干讨论的第二产业从业人员减少的原因无关，话题不一致，无法削弱，排除；\nC项：该项说的是第三产业发展的原因，与题干讨论的第二产业从业人员减少的原因无关，话题不一致，无法削弱，排除；\nD项：该项说的是第二产业和第三产业都对吸纳就业作出贡献，与题干讨论的第二产业从业人员减少的原因无关，话题不一致，无法削弱，排除。\n故正确答案为A。","no":107,"missingImage":false},{"type":"question","qid":"5445918","cat":"逻辑判断","stem":"杂草稻是稻田里不种自生、伴随栽培稻生长的一种“杂草型稻”。研究者在杂草稻基因组中发现了与干旱胁迫下叶片干枯程度显著相关的基因——PAPH1。消除该基因后的株系，其叶肉细胞膜内外钙离子和钾离子流速降低；而PAPH1基因过度表达的株系，其叶肉细胞膜内外钙离子和钾离子流速增加。因此研究者指出，PAPH1基因在杂草稻抗旱性中发挥关键作用。\n上述论证的成立须补充以下哪项作为前提？","options":{"A":"正常状态下的栽培稻长期生长在有水的环境中，不含PAPH1基因","B":"叶肉细胞膜内外钙离子和钾离子的流速也促进PAPH1基因的表达","C":"叶肉细胞膜内外钙离子和钾离子流速越高，杂草稻的抗旱性越强","D":"杂草稻与栽培稻存在基因交流，其演化与栽培稻选育品种密切相关"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：PAPH1基因在杂草稻抗旱性中发挥关键作用。\n论据：研究者在杂草稻基因组中发现了与干旱胁迫下叶片干枯程度显著相关的基因——PAPH1。消除该基因后的株系，其叶肉细胞膜内外钙离子和钾离子流速降低；而PAPH1基因过度表达的株系，其叶肉细胞膜内外钙离子和钾离子流速增加。\n本题的论点谈论的是“PAPH1基因”与“杂草稻抗旱性”的关系，论据谈论的是“PAPH1基因”与“钙离子和钾离子流速”的关系，话题不一致，加强优先考虑搭桥，即建立“杂草稻抗旱性”与“钙离子和钾离子流速”的关系。\n第二步：逐一分析选项。\nA项：指出“栽培稻”生长在有水环境下且不含PAPH1基因，但没提到“杂草稻”是否具有抗旱性，无法说明PAPH1基因在“杂草稻抗旱性”中是否发挥关键作用，主体不一致，无法加强，排除；\nB项：指出“钙离子和钾离子的流速”可以“促进PAPH1基因的表达”，是对论据的因果倒置，可以削弱，无法加强，排除；\nC项：指出“钙离子和钾离子流速”越高，“杂草稻的抗旱性”越强，建立了“杂草稻抗旱性”与“钙离子和钾离子流速”的关系，属于搭桥项，可以加强，当选；\nD项：指出杂草稻与栽培稻存在“基因交流”，且杂草稻的演化与栽培稻选育品种密切相关，但没提到“抗旱性”，无法说明PAPH1基因在“杂草稻抗旱性”中是否发挥关键作用，话题不一致，无法加强，排除。\n故正确答案为C。","no":108,"missingImage":false},{"type":"question","qid":"2579001","cat":"逻辑判断","stem":"汞在环境中有三种存在形态：金属汞、无机汞、有机汞。这三种形态下的汞均有毒性，其毒性由小到大依次为：无机汞＜金属汞＜有机汞。其中，金属汞是常温下唯一的液态金属。烷基汞是已知毒性最大的汞化合物，甲基汞毒性比无机汞大50~100倍。\n由此不能推出的是：","options":{"A":"烷基汞属于有机汞","B":"甲基汞不是无机汞","C":"有机汞和无机汞不能呈现出液态","D":"常温下的金属，除汞外均不呈液态"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干指出汞在环境中三种存在形态的毒性大小为：无机汞＜金属汞＜有机汞，且烷基汞是已知毒性最大的汞化合物，说明烷基汞是有机汞，可以推出，排除；\nB项：题干指出甲基汞毒性比无机汞大50~100倍，说明甲基汞不是无机汞，可以推出，排除；\nC项：题干只指出金属汞是常温下唯一的液态“金属”，而有机汞和无机汞均不是金属，因此无法推出“有机汞和无机汞不能呈现出液态”，当选；\nD项：题干指出金属汞是常温下唯一的液态金属，说明在常温下其他金属都不呈现出液态，可以推出，排除。\n本题为选非题，故正确答案为C。","no":109,"missingImage":false},{"type":"question","qid":"5445884","cat":"逻辑判断","stem":"传统污水处理，或通过重力沉降、混凝澄清、浮力浮上、离心力分离、磁力分离等物理方法对不溶态污染物进行分离，或通过酸碱中和法、化学沉淀法、氧化还原法等化学方法让污染物发生转化，而新兴的微生物治理技术则是通过水体微生物来净化污水。有专家认为，与传统手段相比，微生物治理技术是一种处理污水的更佳手段。\n以下哪项如果为真，不能支持上述观点？","options":{"A":"近年来，微生物技术的科研投入持续扩大，相关技术成果在土壤改良等领域已经得到了有效转化","B":"物理方法进行污水治理的处理厂，通常占地面积大，基建费、运行费高，能耗大，易出现污泥膨胀现象","C":"化学方法进行污水治理运行成本高，需消耗大量的化学试剂，易产生二次污染","D":"微生物技术污水治理的能耗低，效率高，剩余污泥量少，操作管理方便"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：与传统手段相比，微生物治理技术是一种处理污水的更佳手段。\n论据：传统污水处理，或通过重力沉降、混凝澄清、浮力浮上、离心力分离、磁力分离等物理方法对不溶态污染物进行分离，或通过酸碱中和法、化学沉淀法、氧化还原法等化学方法让污染物发生转化，而新兴的微生物治理技术则是通过水体微生物来净化污水。\n本题论点和论据话题一致，都是在对传统手段和微生物治理技术进行比较，加强优先考虑补充论据，本题为选非题，将可以加强的选项排除即可。\n第二步：逐一分析选项。\nA项：该项指出近年来微生物技术的科研投入持续扩大，相关技术成果在土壤改良等领域已经得到了有效转化，仅说明微生物技术对土壤改良的作用，没有提及对污水处理的作用，为无关项，无法加强，当选；\nB项：该项指出物理方法进行污水治理的处理厂，通常占地面积大，基建费、运行费高，能耗大，易出现污泥膨胀现象，补充说明传统手段具有成本高、能耗高、污染环境等缺点，补充论据，可以加强，排除；\nC项：该项指出化学方法进行污水治理运行成本高，需消耗大量的化学试剂，易产生二次污染，补充说明传统手段存在成本高、污染环境等缺点，补充论据，可以加强，排除；\nD项：该项指出微生物技术污水治理的能耗低，效率高，剩余污泥量少，操作管理方便，补充说明微生物技术治理污水有优势，补充论据，可以加强，排除。\n本题为选非题，故正确答案为A。","no":110,"missingImage":false},{"type":"question","qid":"5445883","cat":"逻辑判断","stem":"近来，国际大宗商品市场中，原油和天然气价格达到近十年以来的高位，锌矿价格也上涨了7%左右，有分析人士认为，大宗商品市场将进入“超级周期”（大宗商品价格高于长期平均价格的时期）。从宏观层面看，大宗商品进入“超级周期”是全球经济出现新的增长动力的结果。历史上大宗商品进入“超级周期”往往会带动全球经济复苏，这也预示着当下全球经济正在复苏。\n以下哪项如果为真，最能削弱上述论证？","options":{"A":"地缘政治的风险加剧了大宗商品供应的紧张局势，引发本轮大宗商品价格上涨","B":"飙升的天然气价格推高了化肥的主要成分——氨的价格，进而推高全球粮食价格","C":"全球经济将更注重环保，碳中和与碳达峰将改变能源产业格局，进而影响金属和原油产业的发展远景","D":"全球主要经济体正在加紧出台强有力的救市计划，以寻求本国新的经济增长动力"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：大宗商品市场将进入“超级周期”（大宗商品价格高于长期平均价格的时期）。从宏观层面看，大宗商品进入“超级周期”是全球经济出现新的增长动力的结果。历史上大宗商品进入“超级周期”往往会带动全球经济复苏，这也预示着当下全球经济正在复苏。\n论据：无。\n本题的论点的逻辑是“全球经济出现新的增长动力”导致大宗商品市场将进入“超级周期”，进而预示当下全球经济正在复苏，本题只有论点，没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：论点的逻辑是“全球经济新的增长动力导致大宗商品价格上涨”，该项给出了导致“大宗商品价格上涨”的另一个原因，削弱论点，可以削弱，当选；\nB项：该项说的是天然气价格推高了氨的价格，进而推高全球粮食价格，只说明了部分商品之间的价格关联度，而论点讨论的是大宗商品价格高于平均的原因以及产生的结果，话题不一致，无法削弱，排除；\nC项：该项说的是全球经济将更注重环保，碳中和与碳达峰将改变能源产业格局，而论点讨论的是大宗商品价格高于平均的原因以及产生的结果，话题不一致，无法削弱，排除；\nD项：该项说的是全球主要经济体为寻求本国新的经济增长动力而出台救市计划，而论点讨论的是大宗商品价格高于平均的原因以及产生的结果，话题不一致，无法削弱，排除。\n故正确答案为A。","no":111,"missingImage":false},{"type":"question","qid":"5445925","cat":"逻辑判断","stem":"考古人员对岳阳新墙河流域的大马古城址及其相关东周遗存进行调查研究，推测这里是东周时期麋子国城的遗址。东周时期麋子国被楚灭亡后迁徙江南，最后定居在今岳阳新墙河流域，因此大马古城址应是麋子国遗民南迁后所筑的麋子国城遗址。凤形嘴山、将军潭、尧岭山所在的这一区域应是麋子国遗民生产活动和生活栖息的地方。\n以下哪项如果为真，不能支持考古人员的推测？","options":{"A":"据明隆庆《岳州府志》记载，先秦时期被楚灭国后迁来岳州的有罗、麋、许三国遗民，其中麋子国遗民定居在巴陵（今湖南岳阳）境内","B":"大马古城址、凤形嘴山、将军潭、尧岭山墓地均为楚系，而麋与楚本来同源同祖同姓，二者在文化上相通是顺理成章的","C":"麋子国原为周初的一个子爵小国，与楚国同姓。它最早居于今山东梁山县，又辗转多地，后定居锡穴（今陕西白河县）","D":"大马古城位于今岳阳市东南，与《读史方舆纪要》中记载的岳州“府东三十里，相传古麋子国”所记位置大体一致"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：大马古城址应是麋子国遗民南迁后所筑的麋子国城遗址。\n论据：东周时期麋子国被楚灭亡后迁徙江南，最后定居在今岳阳新墙河流域。凤形嘴山、将军潭、尧岭山所在的这一区域应是麋子国遗民生产活动和生活栖息的地方。\n本题为选非题，可以使用排除法，将可以加强的选项排除，选择无法加强的选项。且本题论点、论据讨论的都是麋子国的遗址，二者讨论的话题一致，可以通过补充论据的方式进行加强。\n第二步：逐一分析选项。\nA项：《岳州府志》记载，先秦时期被楚灭国后的麋子国遗民定居在巴陵（今湖南岳阳）境内，通过列举史书记载，说明麋子国遗民确实定居在今岳阳境内，补充论据，可以加强，排除；\nB项：大马古城址、凤形嘴山、将军潭、尧岭山墓地均为楚系，而麋与楚在文化上相通，说明大马城址、凤形嘴山、将军潭、尧岭山墓地等区域确实有可能是麋子国遗民生产活动和生活栖息的地方，补充论据，可以加强，排除；\nC项：麋子国最早居于今山东梁山县，又辗转多地，后定居在今陕西白河县，讨论的是麋子国曾经的定居地点，但这些地点中是否包含大马古城址并不明确，为不明确项，无法加强，当选；\nD项：大马古城的位置与《读史方舆纪要》中所记关于麋子国的位置大体一致，说明大马古城址确实可能是麋子国的遗址，补充论据，可以加强，排除。\n本题为选非题，故正确答案为C。","no":112,"missingImage":false},{"type":"question","qid":"5445921","cat":"逻辑判断","stem":"面对需求收缩、供给冲击、预期转弱三重压力，要想实现国内经济发展稳中求进，关键是要稳住市场主体。只有围绕市场主体需求实施更大力度减税降费，才能帮助其渡过资金难关。除了减税降费外，还需继续深化“放管服”改革，才能为市场主体营造更加市场化、法治化的营商环境。只有营商环境更加市场化、法治化，市场主体才会获得内生动力，从而进一步增强国内经济的吸引力、创造力、竞争力。\n由此可以推出：","options":{"A":"实施更大力度减税降费，是帮助市场主体渡过资金难关的必要举措","B":"只要稳住市场主体，就能实现国内经济发展稳中求进","C":"如果深化“放管服”改革，就能营造更加市场化、法治化的营商环境","D":"若市场主体不具有内生动力，国内经济就不会有吸引力、创造力、竞争力"},"answer":"A","explanation":"第一步：翻译题干。\n①实现国内经济发展稳中求进\u003cimg data-k=\"a37757d411ef\">稳住市场主体；\n②帮助市场主体渡过资金难关\u003cimg data-k=\"a37757d411ef\">围绕市场主体需求实施更大力度减税降费；\n③为市场主体营造更加市场化、法治化的营商环境\u003cimg data-k=\"a37757d411ef\">减税降费 且 继续深化“放管服”改革；\n④市场主体获得内生动力\u003cimg data-k=\"a37757d411ef\">营商环境更加市场化、法治化；\n⑤进一步增强国内经济的吸引力、创造力、竞争力\u003cimg data-k=\"a37757d411ef\">市场主体获得内生动力。\n第二步：逐一分析选项。\nA项：该项翻译为“帮助市场主体渡过资金难关\u003cimg data-k=\"a37757d411ef\">实施更大力度减税降费”，是对②的肯前，肯前必肯后，可以推出，当选；\nB项：该项翻译为“稳住市场主体\u003cimg data-k=\"a37757d411ef\">实现国内经济发展稳中求进”，是对①的肯后，但肯后得不到确定性的结论，无法推出，排除；\nC项：该项翻译为“深化‘放管服’改革\u003cimg data-k=\"a37757d411ef\">营造更加市场化、法治化的营商环境”，肯定了③后“且”关系中的一项，得不到确定性的结论，无法推出，排除；\nD项：该项翻译为“市场主体不具有内生动力\u003cimg data-k=\"a37757d411ef\">国内经济就不会有吸引力、创造力、竞争力”，是对⑤的否后，否后必否前，得到“\u003cimg data-k=\"0be436194951\">进一步增强国内经济的吸引力、创造力、竞争力”，但进一步增强即“本来就有”且需要增强，否后得到的“不会进一步增强”国内经济的吸引力、创造力、竞争力与选项的“不会有”吸引力、创造力、竞争力，不是同义替换，无法推出，排除。\n故正确答案为A。","no":113,"missingImage":false},{"type":"question","qid":"5445922","cat":"逻辑判断","stem":"石、方、白、于、叶5人参加单板滑雪、跳台滑雪、越野滑雪和高山滑雪4个项目的比赛，每人参加一个项目，每个项目均有1-2人参加。\n已知：（1）如果石和白至少有一人参加高山滑雪，则方参加单板滑雪，而于参加高山滑雪；\n（2）如果于和方至少有一人参加高山滑雪，则白和叶均参加单板滑雪。\n如果叶未参加高山滑雪，则可以得出以下哪项？","options":{"A":"方参加了越野滑雪","B":"叶未参加单板滑雪","C":"石参加了高山滑雪","D":"白未参加跳台滑雪"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）每人参加一个项目，每个项目均有1-2人参加；\n（2）石高山滑雪 或 白高山滑雪\u003cimg data-k=\"a37757d411ef\">方单板滑雪 且 于高山滑雪；\n（3）于高山滑雪 或 方高山滑雪\u003cimg data-k=\"a37757d411ef\">白单板滑雪 且 叶单板滑雪；\n（4）\u003cimg data-k=\"0be436194951\">叶高山滑雪；\n将（2）和（3）串联得到条件（5）石高山滑雪 或 白高山滑雪\u003cimg data-k=\"a37757d411ef\">方单板滑雪 且 于高山滑雪\u003cimg data-k=\"a37757d411ef\">白单板滑雪 且 叶单板滑雪。\n第二步：根据题干条件进行推理。\n题干条件（4）为确定信息，根据条件（4）\u003cimg data-k=\"0be436194951\">叶高山滑雪可知，其余4人均可能参加高山滑雪，考虑采用假设法做题。根据条件（5）假设石高山滑雪 或 白高山滑雪，能够推出方参加单板滑雪，进而得出白和叶都参加单板滑雪，此时有3人参加单板滑雪，明显违背条件（1）每人参加一个项目，每个项目均有1-2人参加，因此石和白均不参加高山滑雪，排除C项；此时再结合条件（4）可知，叶、石和白均不参加高山滑雪，故而得出于高山滑雪 或 方高山滑雪，代入条件（3）可知白和叶均参加单板滑雪，排除B项；结合条件（1）每人参加一个项目，因此白不可能再参加跳台滑雪，D项正确。\n故正确答案为D。","no":114,"missingImage":false}],"count":40,"answerable":40,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        截至2021年底，我国固定互联网宽带接入用户数比上年底净增5224万户。其中，100Mbps及以上接入速率的用户比上年底净增6385万户。\u003c/p>\u003cp>        按接入方式划分，固定互联网宽带接入用户可分为xDSL用户、光纤用户和其他用户；按接入速率划分，固定互联网宽带接入用户可分为100Mbps速率以上用户和其他用户。\u003c/p>\u003cp>\u003cimg data-k=\"373ca5dfad08\" style=\"max-width:694px\">\u003c/p>","questions":[{"qid":"5445929","cat":"增长","stem":"2021年1~2月，我国固定互联网宽带接入用户数月均约增加多少万户？","options":{"A":"867","B":"629","C":"434","D":"315"},"answer":"C","explanation":"根据题干“2021年1~2月······月均约增加······万户”，可判定本题为年均增长量问题。定位文字材料第一段可得：截至2021年底，我国固定互联网宽带接入用户数比上年底净增5224万户；定位统计表可得：2021年2月末我国固定互联网宽带接入用户数为49222万户，12月末为53579万户。根据公式：基期量=现期量-增长量，可得2020年12月末我国固定互联网宽带接入用户数为53579-5224=48355万户。根据公式：年均增长量\u003cimg data-k=\"ef392bd0cc6f\">，则2021年1~2月，我国固定互联网宽带接入用户数月均增加\u003cimg data-k=\"6737f74ea4e1\">\u003cimg data-k=\"961ddabc95a9\">万户。\n故正确答案为C。","no":115,"missingImage":false},{"qid":"5445931" cimg data-k=\"61dda5900f13\">；甘肃\u003cimg data-k=\"9c71a919434c\">；广东\u003cimg data-k=\"83fec696bcdb\">；上海\u003cimg data-k=\"51820294fbd6\">；浙江\u003cimg data-k=\"1d75fc3ba6e8\">；北京\u003cimg data-k=\"f3d4784be81c\">；四川\u003cimg data-k=\"45a037d36108\">。综上，2018年表中所列7个省市中集成电路产量同比增速超过2%的省市有5个。\n（2）2019年各省市集成电路产量增长率分别为：\n江苏\u003cimg data-k=\"662b3cb73a7d\">；甘肃\u003cimg data-k=\"ccbb9f430214\">；广东\u003cimg data-k=\"3321f862a8e7\">；上海\u003cimg data-k=\"e5ab2aac943e\">；浙江\u003cimg data-k=\"ff2f3bc64c64\">；北京\u003cimg data-k=\"2ee79c6c57b8\">；四川\u003cimg data-k=\"92e2c4947810\">。综上，2019年表中所列7个省市中集成电路产量同比增速超过2%的省市有4个。\n则表中所列7个省市中，2019年集成电路产量同比增速超过2%的省市（4个）比上年（5个）少1个。\n故正确答案为A。","no":122,"missingImage":false},{"qid":"5445745","cat":"增长","stem":"将①甘肃、②广东、③上海和④浙江按2016~2021年集成电路产量年均增速（以2016年为基期计算）从高到低排列，以下正确的是：","options":{"A":"④①②③","B":"④①③②","C":"①④②③","D":"①④③②"},"answer":"C","explanation":"根据题干“······按2016~2021年······年均增速（以2016年为基期计算）从高到低排列······”，可判定本题为年均增长率问题。定位统计表可知2016年和2021年甘肃、广东、上海、浙江的集成电路产量。根据年均增长率公式：\u003cimg data-k=\"bc293011a8ac\">（n为年份差），当年份差n相同时，直接根据\u003cimg data-k=\"13707bc49d7b\">的值即可比较年均增长率的大小。计算各省份\u003cimg data-k=\"439148e4ab88\">可得：①甘肃\u003cimg data-k=\"a11d8014bea6\">；②广东\u003cimg data-k=\"eb008ca62792\">；③上海\u003cimg data-k=\"1137b958c82f\">；④浙江\u003cimg data-k=\"22044402eaee\">，则年均增速从高到低排列为：①④②③。\n故正确答案为C。","no":123,"missingImage":false},{"qid":"5445750","cat":"增长","stem":"以下折线图中，最能准确反映2017~2021年间北京市集成电路产量同比增量变化趋势的是：","options":{"A":"\u003cimg data-k=\"e190870592dd\" style=\"max-width:218px\">","B":"\u003cimg data-k=\"af2a03981264\" style=\"max-width:227px\">","C":"\u003cimg data-k=\"6a5f95b56abd\" style=\"max-width:229px\">","D":"\u003cimg data-k=\"7250b48abbf9\" style=\"max-width:233px\">"},"answer":"A","explanation":"根据题干“······2017~2021年间北京市集成电路产量同比增量变化趋势的是”，可判定本题为增长量比较问题。定位统计表可得：2016~2021年北京市集成电路产量分别为81亿块、93亿块、137亿块、154亿块、171亿块、208亿块。根据公式：增长量=现期量-基期量，则2017年同比增量为93-81=12亿块，2018年为137-93=44亿块，2019年为154-137=17亿块，2020年为171-154=17亿块，2021年为208-171=37亿块。可知2019年与2020年同比增量相等，即折线图中第三和第四个点高度一致，只有A项符合。\n故正确答案为A。","no":124,"missingImage":false}]},{"type":"material","material":"\u003cp>        超级计算，也被称为高性能计算。从算力资源的需求看，高性能计算可以分为尖端超算、通用超算、业务超算和人工智能超算四大类。\u003c/p>\u003cp>\u003cimg data-k=\"1cc3c267f4ff\" style=\"max-width:672px\">\u003c/p>\u003cp>\u003cimg data-k=\"a7f6132c1854\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"5445847","cat":"综合","stem":"2020～2021年，中国超算服务市场累计规模约为多少亿元？","options":{"A":"328","B":"354","C":"371","D":"396"},"answer":"B","explanation":"定位统计表可得2020年中国尖端超算、通用超算、业务超算和人工智能超算服务市场规模分别为28.3亿元、37.8亿元、64.4亿元、27.7亿元；2021年这四类超算服务市场规模分别为31.4亿元、40.3亿元、85.6亿元、38.3亿元。则2020～2021年，中国超算服务市场累计规模=28.3+37.8+64.4+27.7+31.4+40.3+85.6+38.3\u003cimg data-k=\"b90a7b7e5ea0\">亿元。\n故正确答案为B。","no":125,"missingImage":false},{"qid":"5445850","cat":"增长","stem":"2018年，中国超算服务4类细分市场中，同比增速最快和最慢的市场当年市场规模同比增速相差约多少个百分点？","options":{"A":"41","B":"47","C":"53","D":"59"},"answer":"C","explanation":"根据题干“2018年······同比增速······百分点”，可判定本题为一般增长率问题。定位统计表可得2017、2018年中国超算服务4类细分市场的市场规模。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，可知2018年，中国超算服务4类细分市场的市场规模同比增速分别为：\n尖端超算：\u003cimg data-k=\"717dff23ca63\">；\n通用超算：\u003cimg data-k=\"d7370fdd1666\">；\n业务超算：\u003cimg data-k=\"0e86b06d03dd\">；\n人工智能超算：\u003cimg data-k=\"40bdb48106fb\">。\n则增速最快的市场为人工智能超算，最慢的市场为尖端超算，所求=58%-5%=53%，即相差约53个百分点。\n故正确答案为C。","no":126,"missingImage":false},{"qid":"5445849","cat":"综合","stem":"2019年，中国第三方超算服务市场规模约占同年超算服务总体市场规模的：","options":{"A":"15%","B":"18%","C":"21%","D":"24%"},"answer":"A","explanation":"根据题干“2019年······占同年······”，结合材料时间为2019年，可判定本题为现期比重问题。定位统计表可得2019年中国尖端超算、通用超算、业务超算和人工智能超算的市场规模；定位统计图可得2019年中国第三方独立超算服务商和互联网超算服务商的市场规模。则所求比重\u003cimg data-k=\"73c3659cb5d0\">\u003cimg data-k=\"69ef8c90566c\">，与A项最接近。\n故正确答案为A。","no":127,"missingImage":false},{"qid":"5445851","cat":"增长","stem":"如保持2021年同比增量不变，则到哪一年第三方互联网超算服务商提供的服务市场规模将第一次超过第三方独立超算服务商？","options":{"A":"2025年","B":"2026年","C":"2027年","D":"2028年"},"answer":"B","explanation":"根据题干“如保持2021年同比增量不变，则到哪一年······将第一次超过······”，可判定本题为现期追赶问题。定位统计图可知2020年、2021年中国第三方独立超算和互联网超算服务商市场规模。根据公式：增长量=现期量-基期量，则2021年第三方互联网超算服务商市场规模同比增量=13.8-9.5=4.3亿元，2021年第三方独立超算服务商市场规模同比增量=18.3-15.0=3.3亿元。根据公式：现期量=基期量+n×增长量，可列式：13.8+n×4.3＞18.3+n×3.3，解得n＞4.5，则n至少为5，即到2026年第三方互联网超算服务商提供的服务市场规模将第一次超过第三方独立超算服务商。\n故正确答案为B。","no":128,"missingImage":false},{"qid":"5445854","cat":"综合","stem":"能够从上述资料中推出的是：","options":{"A":"2016～2020年，通用超算服务市场累计规模超过160亿元","B":"2016～2017年，业务超算服务市场累计规模比人工智能超算服务高30多亿元","C":"2018～2021年，第三方独立超算服务市场规模同比增量逐年递增","D":"2017～2020年，第三方互联网超算服务市场规模同比增速逐年递减"},"answer":"D","explanation":"A项：定位统计表可得2016~2020年通用超算服务市场规模分别为23.9亿元、26.9亿元、29.7亿元、32.2亿元、37.8亿元。则所求=23.9+26.9+29.7+32.2+37.8\u003cimg data-k=\"8215ae184a6a\">\u003cimg data-k=\"627d6c0bc1b3\">亿元＜160亿元，错误；\nB项：定位统计表可得2016~2017年业务超算服务市场规模分别为15.6亿元、24.1亿元，人工智能超算服务市场规模分别为4.7亿元、7.9亿元。则所求=（15.6+24.1）-（4.7+7.9）=39.7-12.6=27.1亿元＜30亿元，错误；\nC项：定位统计图可得2017~2021年中国第三方独立超算服务市场规模。根据公式：增长量=现期量-基期量，则2018年同比增量=8.7-7.1=1.6亿元；2019年同比增量=11.7-8.7=3.0亿元；2020年同比增量=15.0-11.7=3.3亿元；2021年同比增量=18.3-15.0=3.3亿元。因2021年同比增量与2020年相等，则非逐年递增，错误；\nD项：定位统计图可得2016~2020年中国第三方互联网超算服务市场规模。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，则2017年同比增速\u003cimg data-k=\"b6c2e745dc9b\">；2018年同比增速\u003cimg data-k=\"137fb2a1a7ab\">；2019年同比增速\u003cimg data-k=\"76886d7d4a40\">；2020年同比增速\u003cimg data-k=\"8e2b076fb9f8\">。则2017~2020年中国第三方互联网超算服务市场规模同比增速逐年递减，正确。\n故正确答案为D。","no":129,"missingImage":false}]},{"type":"material","material":"\u003cp>        2021年，全国纺织品服装出口3155亿美元，同比增长8.4%。其中，纺织品出口1452.2亿美元，同比下降5.6%，较2019年增长22.0%；服装出口1702.8亿美元，同比增长24.0%，较2019年增长16.0%。其中，针织服装及衣着附件出口864.8亿美元，同比增长39.0%；梭织服装及衣着附件出口701.2亿美元，同比增长12.6%。\u003c/p>\u003cp>        2021年，中国对美国、东盟、欧盟和日本的纺织品服装出口合计1724.9亿美元。其中，对美国出口额为563.5亿美元，同比增长4.0%；向东盟十国出口纺织品服装491.2亿美元，同比增长24.9%；对欧盟27国出口纺织品服装469.9亿美元，同比下降11.1%；对日本出口纺织品服装200.3亿美元，同比下降7.2%。\u003c/p>\u003cp>        2021年，中国向全球出口纺织纱线138亿美元，出口织物667亿美元，分别同比增长41.5%和34.3%。纺织制品当中，防疫类口罩出口额为129.5亿美元，出口金额、数量同比分别下降76.0%和13.0%。除防疫类口罩外，其他纺织制品出口额为517.2亿美元，同比增长27.5%。\u003c/p>\u003cp>        2021年，中国向“一带一路”沿线国家出口纺织品服装1137.9亿美元，同比增长24.5%，较2019年增长17.3%；同时，中国自“一带一路”沿线国家进口纺织品服装131.6亿美元，同比增长24.5%。\u003c/p>","questions":[{"qid":"5445733","cat":"综合","stem":"2020年，全国服装出口额比2019年：","options":{"A":"增长了10%以上","B":"下降了10%以上","C":"增长了不到10%","D":"下降了不到10%"},"answer":"D","explanation":"根据题干“2020年······比2019年”，结合选项为增长/下降+百分数，且材料给出2021年全国服装出口额的同比增速以及相对于2019年的增速，可判定本题为间隔增长率问题。定位文字材料第一段可得：2021年，全国服装出口1702.8亿美元，同比增长24.0%（\u003cimg data-k=\"fa1503d6e290\">），较2019年增长16.0%（\u003cimg data-k=\"7859510d8b2d\">）。根据公式：\u003cimg data-k=\"b0a5282a4984\">，代入数据则有\u003cimg data-k=\"1f93212f04eb\">，解得\u003cimg data-k=\"15f68c5cbc6d\">，即下降了不到10%。\n故正确答案为D。","no":130,"missingImage":false},{"qid":"5445736","cat":"综合","stem":"2021年，全国针织、梭织服装及衣着附件总出口额约占纺织品服装出口总额的：","options":{"A":"55%","B":"50%","C":"45%","D":"40%"},"answer":"B","explanation":"根据题干“2021年，全国······约占······的”，结合材料时间为2021年，可判定本题为现期比重问题。定位文字材料第一段可得：2021年，全国纺织品服装出口3155亿美元······其中，针织服装及衣着附件出口864.8亿美元······梭织服装及衣着附件出口701.2亿美元。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，可得所求比重\u003cimg data-k=\"4c9b3216b7fd\">。\n故正确答案为B。","no":131,"missingImage":false},{"qid":"5445738","cat":"增长","stem":"将①美国、②东盟十国、③欧盟27国和④日本按2021年自中国进口纺织品服装金额同比增量从高到低排列，以下正确的是：","options":{"A":"①②③④","B":"①②④③","C":"②①③④","D":"②①④③"},"answer":"D","explanation":"根据题干“······同比增量从高到低······”，可判定本题为增长量比较问题。定位文字材料第二段可得：2021年······对美国出口额为563.5亿美元，同比增长4.0%；向东盟十国出口纺织品服装491.2亿美元，同比增长24.9%；对欧盟27国出口纺织品服装469.9亿美元，同比下降11.1%；对日本出口纺织品服装200.3亿美元，同比下降7.2%。根据公式：增长量\u003cimg data-k=\"8a9736885154\">，则2021年题干中四个国家自中国进口（即中国对四个国家出口）纺织品服装金额同比增量分别为：①美国：\u003cimg data-k=\"d8674419fbde\">\u003cimg data-k=\"e552d52b34c1\">亿美元；②东盟十国：\u003cimg data-k=\"314c2834be70\">\u003cimg data-k=\"76bd75f09d00\">亿美元；③欧盟27国：\u003cimg data-k=\"784dd7b86c84\">\u003cimg data-k=\"d048fbc64718\">亿美元；④日本：\u003cimg data-k=\"d890ae548679\">\u003cimg data-k=\"aa518d41d18f\">亿美元。则按同比增量从高到低排列为：②东盟十国（\u003cimg data-k=\"9590957dafe2\">亿美元）、①美国（\u003cimg data-k=\"d054e1d98152\">亿美元）、④日本（\u003cimg data-k=\"e8cc04ef8d1c\">亿美元）、③欧盟27国（\u003c   var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";

  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')

  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
