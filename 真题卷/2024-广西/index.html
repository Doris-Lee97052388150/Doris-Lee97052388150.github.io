 data-k=\"f4ea84e94900\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形线条交叉明显，且每幅图都有相切，考虑切点数。题干图形切点数均为1，故？处图形切点数也应为1，只有D项符合。\n故正确答案为D。","no":57,"missingImage":false},{"type":"question","qid":"16593170","cat":"图形推理","stem":"从所给的四个选项中，选择最适合的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"4dab87ffaeda\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"解析一：元素组成相同，优先考虑位置规律。观察发现，题干相邻两幅图形中，左侧三列元素整体向右平移1列，最右侧一列元素移动到最左侧后，又整体向下平移1行（如下图所示），只有A项符合规律。\n\u003cimg data-k=\"0e34d3adc90f\" style=\"max-width:600px\">\n解析二：元素组成相同，优先考虑位置规律。观察发现，题干所有图形均向右平移一格，走到头换到下一行，最后一行走完又走到第一行，所有图形首尾相连，循环往复，如图箭头所示。\n\u003cimg data-k=\"1f2714934c5f\" style=\"max-width:619px\">\n图中标记1的图形，问号处位置如图，排除C、D两项；\n\u003cimg data-k=\"cd4f55b68578\" style=\"max-width:612px\">\nA、B两项的区别在于标记1的图形前面的图形，如图画圈图形，观察发现，只有A符合。\n\u003cimg data-k=\"0f0a40e0faa8\" style=\"max-width:618px\">\n故正确答案为A。","no":58,"missingImage":false},{"type":"question","qid":"16593143","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"1189b1bd2095\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成基本相同，优先考虑位置规律。观察发现，如下图所示，题干每幅图中的虚线依次顺时针移动其半条边长的距离，长实线依次向上循环移动其半条边长的距离，“U”字形图形依次顺时针旋转\u003cimg data-k=\"dd44efe89e5a\">，只有A项符合规律。\n\u003cimg data-k=\"79a763d8fea4\" style=\"max-width:600px\">\n故正确答案为A。","no":59,"missingImage":false},{"type":"question","qid":"10204458","cat":"图形推理","stem":"请从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"c2d0f737f4d3\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相同，优先考虑位置规律。观察发现，题干所有图形都有一个十字交点，该十字交点依次在内圈顺时针平移一格，故？处图形该十字交点的位置应在内圈的右下角，只有C项符合。\n\u003cimg data-k=\"0e92bcb5c797\" style=\"max-width:600px\">\n故正确答案为C。","no":60,"missingImage":false},{"type":"question","qid":"10204454","cat":"图形推理","stem":"请从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"b4365015d3a1\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形均由黑球和白球构成，且黑白球分割明显，考虑部分数。题干图形中，黑球部分数依次为1、1、3、3、2，白球部分数依次为1、2、1、2、4，单独看无规律，考虑运算。黑球部分数+白球部分数依次为2、3、4、5、6，故问号处应选择一个黑球部分数+白球部分数为7的图形，只有C项符合。\n故正确答案为C。","no":61,"missingImage":false},{"type":"question","qid":"10204457","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"a1c1c7c8ad7f\" style=\"max-width:578px\">","options":{"A":"①③④，②⑤⑥","B":"①③⑤，②④⑥","C":"①⑤⑥，②③④","D":"①④⑥，②③⑤"},"answer":"C","explanation":"本题为分组分类题目。观察发现，题干图形内部被线条分割，优先考虑面数量，所有图形面数量均为5，且均明显存在最大面，最大面出现等腰元素，可优先考虑最大面的对称性，图①⑤⑥最大面均为中心对称图形，图②③④最大面均为轴对称图形，即图①⑤⑥一组，图②③④一组。\n故正确答案为C。","no":62,"missingImage":false},{"type":"question","qid":"16593173","cat":"图形推理","stem":"下列纸盒的外表面展开图中，哪一个折叠成的纸盒和其他三个不一样？\n\u003cimg data-k=\"ed20768ec1fd\" style=\"max-width:498px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"将选项展开图标上序号，如下图所示（各选项面都相同，故相同的面用相同字母表示），逐一进行分析。\n\u003cimg data-k=\"dec339fc63ea\" style=\"max-width:492px\">\nA项：面b、面c相邻，公共边紧邻面b与面c的黑块（如上图所示）； \nB项：面b、面c相邻，公共边没有紧邻面b的黑块（如上图所示）；\nC项：面b、面c相邻，公共边紧邻面b与面c的黑块（如上图所示）；\nD项：面b、面c相邻，公共边紧邻面b与面c的黑块（如上图所示）。\n综上，只有B项与其他三项不同。\n本题为选非题，故正确答案为B。","no":63,"missingImage":false},{"type":"question","qid":"16593172","cat":"图形推理","stem":"下图为15个白色和5个灰色正方体组合而成的多面体，将其经A、B、C三个顶点切开后，正确的截面是：\n\u003cimg data-k=\"994f4fa19416\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查截面图。根据平面公理“过不在一条直线上的三点，有且只有一个平面”可以得出，A、B、C三个顶点可以确定一个唯一的截面，如下图所示：\n\u003cimg data-k=\"f323747e3340\" style=\"max-width:278px\">\n逆时针旋转即可得到如下截面图：\n\u003cimg data-k=\"fcbac7232c06\" style=\"max-width:213px\">\n故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"16593168","cat":"图形推理","stem":"下图为15个白色和5个灰色正方体组合而成的多面体，右边哪一个不可能是其某个角度的视图？\n\u003cimg data-k=\"9b11bc13d450\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查三视图，逐一分析选项。\nA项：题干立体图形从仰视（即从下往上）的视角可以看到下图的图形，再将视角顺时针或逆时针旋转\u003cimg data-k=\"dd44efe89e5a\">后，即为A项视图，排除；\n\u003cimg data-k=\"bf4aef24206c\" style=\"max-width:116px\">\nB项：该项不是题干立体图形的视图，当选；\nC项：题干立体图形从右视（即从右往左）的视角可以看到下图的图形，再将视角旋转\u003cimg data-k=\"65c9d9957ef9\">后，即为C项视图，排除；\n\u003cimg data-k=\"4ef3eb04a43b\" style=\"max-width:123px\">\nD项：题干立体图形从后视（即从后往前）的视角可以看到下图的图形，再将视角顺时针旋转\u003cimg data-k=\"dd44efe89e5a\">后，即为D项视图，排除。\n\u003cimg data-k=\"17b6577b75e8\" style=\"max-width:115px\">\n本题为选非题，故正确答案为B。","no":65,"missingImage":false},{"type":"question","qid":"16593136","cat":"定义判断","stem":"职场义警是指认为自己在没有正式授权的情况下，能够监控周围环境中是否存在违反公司规范的迹象，并在自认为适当或合理的时候对感知到的违规同事进行直接或间接处罚的人。\n根据上述定义，下列属于职场义警的是：","options":{"A":"小张认为公司强制加班的行为违反了劳动法，于是向公司主管部门进行实名举报","B":"戴红袖标的居委会王阿姨在斑马线义务执勤时，对乱闯红灯的行人进行口头批评","C":"有同事利用上班时间闲聊，老周看不过去，瞅准机会找到这位同事进行批评教育","D":"保卫科小刘专门就公司员工安全意识弱现象向领导进行汇报，建议领导通报批评"},"answer":"C","explanation":"第一步：找出定义关键词。\n“在没有正式授权的情况下”、“监控到违反公司规范的迹象”、“自认为适当或合理的时候对违规同事进行处罚”。\n第二步：逐一分析选项。\nA项：小张认为公司行为违反劳动法，于是向公司主管部门进行实名举报，其中举报行为并非惩罚行为，不符合“自认为适当或合理的时候对违规同事进行处罚”，不符合定义，排除；\nB项：居委会王阿姨对违反交通规则的行人进行批评是发生在其义务执勤期间，监督行人遵守交通规则是王阿姨的工作内容，不符合“在没有正式授权的情况下”，不符合定义，排除；\nC项：老周对上班闲聊的同事进行批评教育，但并未提及老周的身份是领导，所以他并没有权力批评教育该同事，符合“在没有正式授权的情况下”，老周瞅准机会直接批评上班闲聊的同事，符合“自认为适当或合理的时候对违规同事进行处罚”，符合定义，当选；\nD项：关注员工安全意识的问题在保卫科小刘的工作范围之内，不符合“在没有正式授权的情况下”，不符合定义，排除。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"10204473","cat":"定义判断","stem":"述情障碍是指个体情感功能相对受限，个体无法识别自己或他人的情感，在生活中常常表现为无法找到合适的言语来表达个人感情的一种人格特征。\n根据上述定义，下列涉及述情障碍的是：","options":{"A":"面对同事的误解和质疑，小刘依然没有半句解释，一如既往地选择了沉默","B":"在铁证如山的事实面前，一向能言善辩的嫌疑人犹如泄了气的皮球，一句话也说不出来","C":"小马理解不了人们为何总是在散发恶臭的垃圾面前常常皱眉，对社会丑恶现象也视而不见","D":"面对老师的批评，其他几位被批评的同学已经羞得无地自容，但小刚却还挤眉弄眼笑嘻嘻"},"answer":"D","explanation":"第一步：找出定义关键词。\n“个体无法识别自己或他人的情感”、“无法找到合适的言语来表达个人感情”。\n第二步：逐一分析选项。\nA项：小刘在面对同事的误解和质疑时选择沉默，没有体现小刘“无法识别自己或他人的情感”，而且沉默也不代表“无法找到合适的言语来表达个人感情”，不符合定义，排除；\nB项：嫌疑人无话可说是因为铁证如山，不符合“个体无法识别自己或他人的情感”、“无法找到合适的言语来表达个人感情”，不符合定义，排除；\nC项：小马只是无法理解他人在垃圾面前皱眉的行为，没有体现“个体无法识别自己的情感”，也不符合“无法找到合适的言语来表达个人感情”，不符合定义，排除；\nD项：面对老师批评时其他同学在羞愧，但小刚没有羞愧，说明小刚对自己或他人的情感识别上存在问题，符合“个体无法识别自己或他人的情感”，“挤眉弄眼笑嘻嘻”的行为体现了“无法找到合适的言语来表达个人感情”，符合定义，当选。\n故正确答案为D。","no":67,"missingImage":false},{"type":"question","qid":"16593139","cat":"定义判断","stem":"矛盾职业认同是指从业者对自身职业兼具认同和不认同，或认同职业某一方面而不认同其他方面，反映了个体对自身职业的复杂情感。\n根据上述定义，下列属于矛盾职业认同的是：","options":{"A":"小强对未来就业感到迷茫，一方面认为本专业相对好就业，另一方面觉得工作压力会很大","B":"虽然觉得社会上有很多人对网络主播并不认同，但小飞却决定将主播当作一生的事业来做","C":"小刚的父母希望他毕业后考公务员，但小刚自己却更喜欢做一名教师","D":"老汪觉得送快递很累，但工作时间相对自由，因此他还是决定干下去"},"answer":"D","explanation":"第一步：找出定义关键词。\n“从业者”、“对自身职业兼具认同和不认同”、“认同职业某一方面而不认同其他方面”。\n第二步：逐一分析选项。\nA项：小强还未就业，不符合“从业者”，不符合定义，排除；\nB项：社会上有很多人对网络主播并不认同，但小飞本人却对主播事业很坚定，仅体现出小飞对于主播事业的认同，不符合“对自身职业兼具认同和不认同”、“认同职业某一方面而不认同其他方面”，不符合定义，排除；\nC项：父母希望小刚考公务员，小刚自己却更喜欢做一名教师，不明确小刚是否为从业者，并且仅体现了父母和小刚关于小刚未来职业的想法不同，不符合“对自身职业兼具认同和不认同”、“认同职业某一方面而不认同其他方面”，不符合定义，排除；\nD项：老汪是快递员，符合“从业者”，他觉得送快递很累，但工作时间相对自由，符合“对自身职业兼具认同和不认同”、“认同职业某一方面而不认同其他方面”，符合定义，当选。\n故正确答案为D。","no":68,"missingImage":false},{"type":"question","qid":"10204471","cat":"定义判断","stem":"邻里效应是指在一定的空间范围内，经验丰富的邻里行为会对其他个体的社会经济行为产生影响，从而吸引其他个体出于收益考虑，向其学习、模仿和跟从。\n根据上述定义，下列属于邻里效应的是:","options":{"A":"老赵去年种的玉米格外高产，今年村里的邻居都跟着他家买一样的种子","B":"老孙的儿子初中毕业后选择上职高，这吸引了村里其他孩子也进了职高","C":"村东的小张新买了一辆小轿车，村西的小李看到后，也买了一辆","D":"小冯看了网上的装修图后很心动，也照图装修了自己家"},"answer":"A","explanation":"第一步：找出定义关键词。\n“经验丰富的邻里行为会对其他个体的社会经济行为产生影响”、“吸引其他个体出于收益考虑”、“向其学习、模仿和跟从”。\n第二步：逐一分析选项。\nA项：老赵去年种的玉米格外高产，符合“经验丰富的邻里行为会对其他个体的社会经济行为产生影响”，邻居都跟着他家买一样的种子，符合“吸引其他个体出于收益考虑”、“向其学习、模仿和跟从”，符合定义，当选； \nB项：村里其他孩子和老孙的儿子一样选择了上职高，不符合“对其他个体的社会经济行为产生影响”、“吸引其他个体出于收益考虑”，不符合定义，排除；\nC项：小李只是效仿小张买了一辆小轿车，未体现出小李购买小轿车的目的，不符合“吸引其他个体出于收益考虑”，不符合定义，排除；\nD项：小冯按照网上的装修图装修了自己家，不符合“经验丰富的邻里行为”，不符合定义，排除。\n故正确答案为A。","no":69,"missingImage":false},{"type":"question","qid":"16593140","cat":"定义判断","stem":"逆向选择性监管是指在某些监管领域中，监管者对违规程度较低的目标群体严加监管，对违规程度更高的监管对象却相对宽松，使得监管强度与对象违规程度成反比的组织现象。\n根据上述定义，下列属于逆向选择性监管的是：","options":{"A":"监管部门对证照齐全的大中型校外培训机构严加管控，却对问题突出的个体培训疏于管控","B":"候车时，守序排队的人上车没有座位，而插队的人却有座位，对此公交车司机却不加干预","C":"班主任把易犯错误且屡教不改的学生座位调整在前排，以便任课老师监督","D":"在每年的消费者权益保护日晚会上，监管部门都会重点曝光一些违规产品"},"answer":"A","explanation":"第一步：找出定义关键词。\n“在监管领域中”、“对违规程度较低的目标群体严加监管”、“对违规程度更高的监管对象相对宽松”。\n第二步：逐一分析选项。\nA项：监管部门对证照齐全的培训机构严加管控，证照齐全说明其违规程度相对较低，但却严加管控，符合“在监管领域中”、“对违规程度较低的目标群体严加监管”，对问题突出的个体培训疏于管控，问题突出说明违规程度更高，符合“对违规程度更高的监管对象相对宽松”，符合定义，当选；\nB项：司机对守序排队和插队行为都不加干预，说明根本就不存在监管，不符合“对违规程度较低的目标群体严加监管”、“对违规程度更高的监管对象相对宽松”，不符合定义，排除；\nC项：班主任调整易犯错误且屡教不改的学生的座位，以便任课老师监督，说明是对违规程度更高的对象严加看管，不符合“对违规程度更高的监管对象相对宽松”，不符合定义，排除；\nD项：监管部门重点曝光一些违规产品，没有体现对不同群体的区别监管，不符合“对违规程度较低的目标群体严加监管”、“对违规程度更高的监管对象相对宽松”，不符合定义，排除。\n故正确答案为A。","no":70,"missingImage":false},{"type":"question","qid":"16593146","cat":"定义判断","stem":"即兴能力是企业在紧急、不可预测环境下，计划与行动同时进行，通过对资源进行利用和整合呈现出创造性，从而自发地实现预期目标的能力。\n根据上述定义，下列属于即兴能力的是：","options":{"A":"企业聚餐，员工老杨一杯酒下肚，情绪立即高涨起来，即兴为大家表演了诗朗诵","B":"负责公司招聘的人力资源部通过对考生即兴演讲效果的比较，确定最终录用人员","C":"某企业面对技术封锁，边调整发展规划，边创新研发技术，最终成长为行业巨头","D":"为应对未来劳动力成本大幅攀升的不利影响，企业启动了机器设备升级换代工作"},"answer":"C","explanation":"第一步：找出定义关键词。\n“企业在紧急、不可预测环境下”、“计划与行动同时进行”、“通过对资源进行利用和整合呈现出创造性”、“自发地实现预期目标”。\n第二步：逐一分析选项。\nA项：该项中员工老杨在企业聚餐时的表现属于个人行为，不符合“企业在紧急、不可预测环境下”，不符合定义，排除；\nB项：该项中负责公司招聘的人力资源部对考生的考核和录用属于人力资源部的日常工作，不符合“企业在紧急、不可预测环境下”，也未表现出计划和行动情况，不符合“计划与行动同时进行”，不符合定义，排除；\nC项：该项中某企业面对技术封锁，符合“企业在紧急、不可预测环境下”，调整发展规划，创新研发技术，符合“计划与行动同时进行”、“通过对资源进行利用和整合呈现出创造性”，最终成长为行业巨头，符合“自发地实现预期目标”，符合定义，当选；\nD项：该项中为应对未来劳动力成本大幅攀升的不利影响，企业采取了一些措施，说明已经预知未来如何，不符合“企业在紧急、不可预测环境下”，不符合定义，排除。\n故正确答案为C。","no":71,"missingImage":false},{"type":"question","qid":"10204460","cat":"定义判断","stem":"适应性绩效是指个体应对、响应和支持变化的行为表现，具有一定动态发展性，它对于个人、团队和企业的创新以及维持企业在动态变化的环境中持续高效运作均具有重要意义。\n根据上述定义，下列属于适应性绩效的是：","options":{"A":"企业为适应市场环境，加速剥离非核心业务，以维持主营业务的竞争力","B":"为响应绿色低碳生产要求，公司董事会决定关闭高污染高耗能生产项目","C":"50多岁的赵老师对人工智能技术产生了很大兴趣，专门学习了有关课程","D":"为了适应公司海外市场的快速拓展，销售骨干小刘开始学起了第二外语"},"answer":"D","explanation":"第一步：找出定义关键词。\n“个体”、“应对、响应和支持变化的行为表现”。\n第二步：逐一分析选项。\nA项：企业为适应市场环境，加速剥离非核心业务，主体是企业，不符合“个体”，不符合定义，排除；\nB项：公司董事会决定关闭高污染高耗能生产项目，主体是公司董事会，不符合“个体”，不符合定义，排除；\nC项：50多岁的赵老师，符合“个体”，但他因为对人工智能技术感兴趣而学习有关课程，不符合“应对、响应和支持变化的行为表现”，不符合定义，排除；\nD项：销售骨干小刘，符合“个体”，他为了适应公司海外市场的快速拓展，开始学起了第二外语，符合“应对、响应和支持变化的行为表现”，符合定义，当选。\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"16593131","cat":"定义判断","stem":"警觉性市场学习是指企业或组织为提高深度市场洞察而提前建立预警系统，并保持注意力集中以预测市场变化或感知客户需求微弱信号的学习行为。\n根据上述定义，下列属于警觉性市场学习的是：","options":{"A":"公司提醒小吴要想在职场中保持优势地位，避免被淘汰，就必须利用业余时间多学习","B":"阳阳上课时注意力不集中，为帮他养成良好学习习惯，家长聘请了心理专家进行干预","C":"某知名企业组建市场调研部，定期监测市场动向，积极培训员工，努力规避潜在风险","D":"某房地产开发商通过暂缓开发或拖延施工进度等方式，试图化解可能面临的发展危机"},"answer":"C","explanation":"第一步：找出定义关键词。\n“企业或组织”、“为提高深度市场洞察而提前建立预警系统”、“预测市场变化或感知客户需求”。\n第二步：逐一分析选项。\nA项：公司提醒小吴利用业余时间多学习避免被淘汰，是公司对员工的提醒，不属于对市场变化的预测和对客户需求的感知，不符合“预测市场变化或感知客户需求”，不符合定义，排除；\nB项：家长聘请心理专家帮助阳阳养成良好的学习习惯，其中阳阳的家长不属于企业或组织，不符合“企业或组织”，不符合定义，排除；\nC项：某知名企业组建市场调研部，定期监测市场动向，符合“企业或组织”、“为提高深度市场洞察而提前建立预警系统”、“预测市场变化或感知客户需求”，符合定义，当选；\nD项：某房地产开发商使用暂缓开发或拖延施工进度等方式，是为了化解可能面临的发展危机，而不是对市场变化的预测和对客户需求的感知，不符合“预测市场变化或感知客户需求”，不符合定义，排除。\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"16593141","cat":"定义判断","stem":"领导者对下属或员工的过错惩罚有两种，权变惩罚与非权变惩罚，领导权变惩罚是指领导根据下属的过失程度酌情采取惩罚；领导非权变惩罚是指因下属的过失行为，领导施加了与下属实际绩效和表现不相符的过度惩罚。\n根据上述定义，下列属于领导非权变惩罚的是：","options":{"A":"小刘操作机床时，故意违反操作规程造成机床主机严重受损，公司根据相关规定对其进行加重处罚","B":"因甲方无法如期履行合同义务，乙方领导指示法务部门根据合同约定条款严肃追究甲方的违约责任","C":"刘律师因疏忽大意错过了案件上诉期，尽管其已获得委托人谅解，但律所仍对刘律师施以顶格处罚","D":"小郑不小心给客户少发了部分产品，发现后及时补发，按规定只需罚款，但是经理却坚持要将他开除"},"answer":"D","explanation":"第一步：找出定义关键词。\n领导权变惩罚：“领导根据下属的过失程度酌情采取惩罚”；\n领导非权变惩罚：“领导根据下属的过失，施加了与下属实际绩效和表现不相符的过度惩罚”。\n第二步：逐一分析选项。\nA项：小刘故意违反操作造成机床主机严重受损，公司对其加重处罚是依据公司的规定，不符合“领导根据下属的过失，施加了与下属实际绩效和表现不相符的过度惩罚”，不符合“领导非权变惩罚”定义，排除；\nB项：乙方领导追究甲方的违约责任，其中甲方不属于乙方的下属，且追究违约责任是依据合同约定的条款，不符合“领导根据下属的过失，施加了与下属实际绩效和表现不相符的过度惩罚”，不符合“领导非权变惩罚”定义，排除；\nC项：刘律师因自身疏忽错过了案件上诉期，虽获得委托人谅解，但刘律师的行为属于失职，故律所对刘律师施以顶格处罚也是合理的，不符合“领导根据下属的过失，施加了与下属实际绩效和表现不相符的过度惩罚”，不符合“领导非权变惩罚”定义，排除；\nD项：小郑在发现给客户少发了产品后及时补发，按规定只需罚款，但经理却要坚持开除小郑，这种惩罚是过度的，符合“领导根据下属的过失，施加了与下属实际绩效和表现不相符的过度惩罚”，符合“领导非权变惩罚”定义，当选。\n故正确答案为D。","no":74,"missingImage":false},{"type":"question","qid":"16593160","cat":"定义判断","stem":"积极独处是个体主动选择与他人的交际分离，选择自我自由并投入到有意义的、愉快的活动中，从而产生的一种内在积极体验。\n根据上述定义，下列属于积极独处的是：","options":{"A":"小孙睡眠质量不好，外出工作时一般都不和同事一起住","B":"小钱已经锁定了晚上的演唱会门票，谢绝了同事下班后聚餐的邀请","C":"为了准备研究生入学考试，小赵几乎不参加社交活动，他感到很充实","D":"小周适应不了职场人际关系，辞职后不愿出去找工作，整日在家刷视频"},"answer":"C","explanation":"第一步：找出定义关键词。\n“个体主动选择与他人的交际分离”、“选择自我自由并投入到有意义的、愉快的活动中”、“产生内在积极体验”。\n第二步：逐一分析选项。\nA项：选项指出小孙因为睡眠质量不好所以在外出工作时不和同事一起住，小孙只是晚上不和同事一起住，并不是要和同事“交际分离”，不符合“个体主动选择与他人的交际分离”，不符合定义，排除；\nB项：选项指出小钱因为晚上要看演唱会所以谢绝了当晚的聚餐邀请，并不是要和同事“交际分离”，不符合“个体主动选择与他人的交际分离”，不符合定义，排除；\nC项：选项指出小赵为了准备研究生入学考试几乎不参加社交活动，符合“个体主动选择与他人的交际分离”、“选择自我自由并投入到有意义的、愉快的活动中”，他感到很充实，符合“产生内在积极体验”，符合定义，当选；\nD项：选项指出小周适应不了职场人际关系而不愿出去找工作，并且整日在家刷视频，“整日刷视频”不是有意义的活动，不符合“选择自我自由并投入到有意义的、愉快的活动中”，不符合定义，排除。\n故正确答案为C。","no":75,"missingImage":false},{"type":"question","qid":"16593133","cat":"类比推理","stem":"文字：汉字","options":{"A":"判断：概念","B":"宇宙：恒星","C":"中国：北京","D":"工人：矿工"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n汉字是记录汉语的文字，二者是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：概念不是判断的一种，二者不是种属关系，与题干逻辑关系不一致，排除；\nB项：宇宙是包括一切天体的无限空间，恒星是本身能发出光和热的天体，恒星是宇宙的组成部分，二者是组成关系，与题干逻辑关系不一致，排除；\nC项：北京是中国的组成部分，二者是组成关系，与题干逻辑关系不一致，排除；\nD项：矿工是开采矿物的工人，二者是种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"16593162","cat":"类比推理","stem":"前因后果：因果","options":{"A":"内忧外患：忧患","B":"南征北战：征战","C":"左顾右盼：顾盼","D":"有始无终：始终"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n前因后果指的是事物的因果报应，后泛指整个事件；因果指的是原因与结果的关系，二者没有语义关系，考虑拆分。“前”和“后”是反义关系，“因”和“果”组成第二个词，分别代表原因和结果两个不同的方面，且先“因”后“果”。\n第二步：判断选项词语间逻辑关系。\nA项：“内”和“外”是反义关系，但是“忧”和“患”指的都是忧虑的事情，二者为近义关系，与题干逻辑关系不一致，排除；\nB项：“南”和“北”是反义关系，但是“征”和“战”指的都是出发去作战，二者为近义关系，与题干逻辑关系不一致，排除；\nC项：“左”和“右”是反义关系，但是“顾”和“盼”指的都是看，二者为近义关系，与题干逻辑关系不一致，排除；\nD项：“有”和“无”是反义关系，“始”和“终”组成第二个词，分别代表开始和结束两个不同的方面，且先“始”后“终”，与题干逻辑关系一致，当选。\n故正确答案为D。","no":77,"missingImage":false},{"type":"question","qid":"16593145","cat":"类比推理","stem":"飞机：机库：机场","options":{"A":"课桌：桌椅：桌面","B":"药品：药盒：药箱","C":"乘客：客车：车站","D":"汽车：车轮：车轴"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n飞机停在机库里，二者是存放地点对应关系；飞机停在机场里，二者是存放地点对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：桌面是课桌的一部分，二者不是存放地点对应关系，与题干逻辑关系不一致，排除；\nB项：药品放在药盒里，二者是存放地点对应关系；药品放在药箱里，二者是存放地点对应关系，与题干逻辑关系一致，当选；\nC项：客车运输乘客，二者不是存放地点对应关系，与题干逻辑关系不一致，排除；\nD项：车轮是汽车的组成部分，二者不是存放地点对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":78,"missingImage":false},{"type":"question","qid":"16593147","cat":"类比推理","stem":"制造：中国制造：智能化中国制造","options":{"A":"小说：长篇小说：中长篇科幻小说","B":"批评：自我批评：剖析式自我批评","C":"学习：深度学习：机器人深度学习","D":"锻炼：体育锻炼：有意识体育锻炼"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n中国制造是制造的一种，前两词构成种属关系；智能化中国制造是中国制造的一种，后两词构成种属关系，且“智能化”是对中国制造具体属性的描述。\n第二步：判断选项词语间逻辑关系。\nA项：长篇小说是小说的一种，前两词构成种属关系；中长篇科幻小说是中长篇小说的一种，不是长篇小说，后两词不构成种属关系，与题干逻辑关系不一致，排除；\nB项：自我批评是批评的一种，前两词构成种属关系；剖析式自我批评是自我批评的一种，后两词构成种属关系，且“剖析式”是对自我批评具体属性的描述，与题干逻辑关系一致，保留；\nC项：深度学习是学习的一种，前两词构成种属关系；机器人深度学习是指机器人利用深度学习技术进行学习，与“深度学习”不构成种属关系，与题干逻辑关系不一致，排除；\nD项：体育锻炼是锻炼的一种，前两词构成种属关系；有意识体育锻炼是体育锻炼的一种，后两词构成种属关系，且“有意识”是对体育锻炼具体属性的描述，与题干逻辑关系一致，保留。\n对比B、D两项，题干中“中国制造”与B项中“自我批评”都是主谓结构，D项中“体育锻炼”不是主谓结构，且题干中“智能化”与B项中“剖析式”结构一致，而D项中“有意识”与题干结构不同，故B项与题干逻辑关系更为一致。\n故正确答案为B。","no":79,"missingImage":false},{"type":"question","qid":"16593151","cat":"类比推理","stem":"风吹：草低：见牛羊","options":{"A":"浪打：船摇：靠舵手","B":"光照：叶肥：促生长","C":"游人：如织：显道窄","D":"雨淋：花落：闻余香"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n风吹导致草低，草低导致见牛羊，第一词和第二词、第二词和第三词之间分别构成因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：浪打导致船摇，二者构成因果对应关系，但船摇需要靠舵手，二者不构成因果对应关系，与题干逻辑关系不一致，排除；\nB项：光照导致叶肥，叶肥是促生长的结果，与题干逻辑关系不一致，排除；\nC项：游人如织形容游人多得像织布的线一样，密密麻麻，如织是用来形容游人的，二者不构成因果对应关系，与题干逻辑关系不一致，排除；\nD项：雨淋导致花落，花落导致闻余香，第一词和第二词、第二词和第三词之间分别构成因果对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":80,"missingImage":false},{"type":"question","qid":"16593155","cat":"类比推理","stem":"窗户：窗帘：遮光","options":{"A":"桌子：桌布：防污","B":"电脑：鼠标：操作","C":"座椅：座垫：美观","D":"茶杯：茶叶：茶水"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n窗帘挂在窗户上，二者为配套使用的对应关系；遮光是窗帘的功能，二者为功能对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：桌布铺在桌子上，二者为配套使用的对应关系；防污是桌布的功能，二者为功能对应关系，与题干逻辑关系一致，当选；\nB项：鼠标连接在电脑上，二者为配套使用的对应关系；操作鼠标，二者为动宾关系，与题干逻辑关系不一致，排除；\nC项：座垫铺在座椅上，二者为配套使用的对应关系；美观是座垫的或然属性，二者为属性对应关系，与题干逻辑关系不一致，排除；\nD项：茶叶是制作茶水的原材料，二者是原材料对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":81,"missingImage":false},{"type":"question","qid":"16593169","cat":"类比推理","stem":"信息科技：生物科技：科技","options":{"A":"机械工业：智能工业：工业","B":"纺织产业：物流产业：产业","C":"公共交通：城市交通：交通","D":"商品住房：保障住房：住房"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n信息科技会利用生物科技，生物科技会利用信息科技，二者为相互利用、相互融合的关系，信息科技和生物科技都是科技的一种，前两词分别与第三词构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：机械工业会利用智能工业，智能工业会利用机械工业，二者为相互利用、相互融合的关系，机械工业和智能工业都是工业的一种，前两词分别与第三词构成种属关系，与题干逻辑关系一致，当选；\nB项：纺织产业会利用物流产业，但物流产业不会利用纺织产业，二者不是相互利用、相互融合的关系，与题干逻辑关系不一致，排除；\nC项：有的公共交通是城市交通，有的公共交通不是城市交通，有的城市交通是公共交通，有的城市交通不是公共交通，二者为交叉关系，不是相互利用、相互融合的关系，与题干逻辑关系不一致，排除；\nD项：商品住房和保障住房（保障性住房），二者不是相互利用、相互融合的关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":82,"missingImage":false},{"type":"question","qid":"10204461","cat":"类比推理","stem":"政治家：文学家：思想家","options":{"A":"污染物：氧化物：硫化物","B":"科幻片：纪录片：故事片","C":"马铃薯：西红柿：农作物","D":"运动员：跆拳道：大学生"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n政治家、文学家和思想家是人的三种不同身份，三者互为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：氧化物与硫化物为并列关系，二者分别与污染物构成交叉关系，与题干逻辑关系不一致，排除；\nB项：科幻片、纪录片和故事片是对影视作品从三个不同的角度划分的，三者互为交叉关系，与题干逻辑关系一致，当选；\nC项：马铃薯和西红柿是两种不同的农作物，前两词是并列关系，且分别与第三词构成种属关系，与题干逻辑关系不一致，排除；\nD项：有的大学生是运动员，有的大学生不是运动员，有的运动员是大学生，有的运动员不是大学生，二者构成交叉关系，但是跆拳道是一种运动，与其余两词不构成交叉关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":83,"missingImage":false},{"type":"question","qid":"10204459","cat":"类比推理","stem":"山西：陈醋：粮食","options":{"A":"甘肃：秦艽：植物","B":"河南：汝瓷：瓷土","C":"四川：蜀绣：丝绸","D":"陕西：剪纸：纸张"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n陈醋是山西的特产，二者为特产和产地的对应关系，粮食是制作陈醋的原材料，二者为原材料的对应关系，且粮食经过发酵做成陈醋，发酵是化学变化。\n第二步：判断选项词语间逻辑关系。\nA项：秦艽是一种植物，也是中药，分布在蒙古，俄罗斯西伯利亚和远东地区，中国大陆的内蒙古、宁夏、河北、陕西、新疆、东北、山西等地，秦艽和甘肃不是特产和产地的对应关系，与题干逻辑关系不一致，排除；\nB项：汝瓷是河南特产，二者为特产和产地的对应关系，瓷土是汝瓷的原材料，且瓷土需经过塑形后烧制做成汝瓷，烧制是化学变化，与题干逻辑关系一致，当选；\nC项：蜀绣是巴蜀地区流行的一种民间工艺，对应的产地是四川，二者为特产和产地的对应关系，蜀绣的原材料是丝绸，但是在丝绸上用蚕丝线绣花纹做蜀绣的过程发生的是物理变化，与题干逻辑关系不一致，排除；\nD项：剪纸是一种用剪刀或刻刀在纸上剪刻花纹，用于装点生活或配合其他民俗活动的民间艺术，剪纸不是陕西特产，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":84,"missingImage":false},{"type":"question","qid":"10204468","cat":"类比推理","stem":"（    ） 对于 主演 相当于 顾客 对于 （    ）","options":{"A":"配角；消费者","B":"主角；主顾","C":"男主角；客户","D":"导演；店主"},"answer":"B","explanation":"逐一代入选项。\nA项：配角指戏剧、影视等艺术表演中的次要角色或次要演员，主演指扮演戏剧或影视剧中主角的人，二者为并列关系；顾客与消费者为交叉关系，前后逻辑关系不一致，排除；\nB项：主角指戏剧、影视等艺术表演中的主要角色或主要演员，主演指扮演戏剧或影视剧中主角的人，二者为全同关系；主顾即顾客，二者为全同关系，前后逻辑关系一致，当选；\nC项：主演指扮演戏剧或影视剧中主角的人，男主角是主演，二者为种属关系；客户与顾客为全同关系，前后逻辑关系不一致，排除；\nD项：主演指扮演戏剧或影视剧中主角的人，导演是负责组织和指导演出工作的人，主演配合导演，二者为工作的对应关系；店主和顾客是买卖关系中的双方，二者为交易的对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":85,"missingImage":false},{"type":"question","qid":"10204463","cat":"逻辑判断","stem":"前不久，某地烧烤突然在网上火爆出圈，线上“山呼海啸”般的流量迅速转化为线下高度集聚的客流，一时间，某地烧烤成为现象级“民众盛宴”。最近，网上开始出现一些某地烧烤“凉了”的帖子，依据有三：一是客流量下降，二是一些烧烤店开始转让门面，三是网络搜索热度大不如前。\n以下哪项组合如果为真，最能质疑上述帖子的观点?\n①与其说是“凉了”，不如说是回归常态。眼下，某地烧烤虽然“降温”，但相较“火”起来前还是热得多\n②某地烧烤的火爆吸引了众多入局者，品味和服务好的店铺依然客流不息，有些店面转让出局很正常\n③互联网制造热点具有更新换代快、生命周期短等特点。任何网红的热度都难以持续，但这并不等于“凉了”\n④一场让全民或围观或参与的烧烤让更多人认识了某地，良好的消费环境和优质的公共服务令人印象深刻","options":{"A":"①②","B":"③④","C":"①②③","D":"①②③④"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：某地烧烤“凉了”。\n论据：一是客流量下降，二是一些烧烤店开始转让门面，三是网络搜索热度大不如前。\n本题论点讨论的是某地烧烤“凉了”，论据讨论的是“凉了”的原因，要求从选项中选择有削弱力度的多项，可以先不预设。\n第二步：逐一分析选项。\n①指出该地的烧烤只是回归常态，火热程度“降温”，但比“火”之前还是“热”，因此不是“凉了”，可以削弱；\n②指出品味和服务好的店铺依然客流不息，即没有“凉”，指出有些店面转让出局很正常，因此论据中第二条所提出的一些烧烤店铺转让，也不等于“凉了”，可以削弱；\n③指出互联网制造的热点正常而言是难以持续的，但难以持续不等于“凉了”，因此论据中第三条所指的网络搜索热度大不如前，不等于“凉了”，可以削弱；\n④指出烧烤让更多人认识了该地，消费环境和公共服务给人留下了深刻印象，但没有提及现在该地烧烤业的发展情况，话题不一致，无法削弱。\n综上，能削弱的有①②③。\n故正确答案为C。","no":86,"missingImage":false},{"type":"question","qid":"10204472","cat":"逻辑判断","stem":"科学家一直在对珠峰顶部积雪的厚度进行测量研究，过去由于没有探地雷达，测量研究结果具有不确定性，一般认为珠峰顶部积雪深度在0.92到3.5米之间。最近，中国研究人员在珠峰北坡，利用探地雷达沿着海拔7000米以上的山脊设置了26个测量点，通过采集大量数据得出结论，珠峰顶部积雪比以前认为的要深得多，平均达9.5米。\n以下哪项如果为真，最能支持上述结论?","options":{"A":"探地雷达的测量结果证明了珠峰山脊的地形相对平坦","B":"集中于珠峰山脊的26个测量点显示，各点积雪深度均为9.5米","C":"探地雷达对珠峰北坡海拔7000米以上山脊反复测量的结果可靠","D":"雪和岩石表面差异很大，探地雷达可准确确定这两种物质的边界"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：中国研究人员在珠峰北坡利用探地雷达沿着海拔7000米以上的山脊设置了26个测量点，通过采集大量数据得出结论，珠峰顶部积雪比以前认为的要深得多，平均达9.5米。\n论据：无。\n本题只有论点，没有论据，加强优先考虑必要条件或补充论据，即可利用探地雷达得出珠峰顶部积雪平均厚度，或补充能够证明论点成立的依据。\n第二步：逐一分析选项。\nA项：该项是说探地雷达的测量结果证明了珠峰山脊的地形相对平坦，但论点讨论的是利用探地雷达是否可以得出珠峰顶部积雪的平均厚度，话题不一致，无关选项，无法加强，排除；\nB项：该项是说珠峰山脊的26个测量点显示，各点积雪的深度均为9.5米，补充了实验数据，证明珠峰顶部积雪的平均深度可能达到9.5米，补充论据，可以加强，保留；\nC项：该项是说探地雷达对珠峰海拔7000米以上山脊反复测量的结果可靠，说明可以利用探地雷达测量积雪深度，补充论据，可以加强，保留；\nD项：该项是说雪和岩石表面差异很大，探地雷达可准确确定这两种物质的边界，如果探地雷达不能准确确定这两种物质的边界，那么利用探地雷达就无法准确测量积雪的深度，故该项是论点成立的必要条件，可以加强，保留；\n对比B、C、D三项，B项只是补充了测量点位的数据，且论点是说珠峰的顶部积雪深度平均达到9.5米，而题干中只是通过26个观测点得出的珠峰顶部积雪深度，是局部推出了整体，故26个观测点的积雪深度均为9.5米不是论点成立的必要条件，C项只是说明雷达测量的结果可靠，而D项具体说明了探地雷达确实可以测量积雪的原理，综上，必要条件大于补充论据，且D项比C项表述更明确，故D项力度更强。\n故正确答案为D。","no":87,"missingImage":false},{"type":"question","qid":"16593174","cat":"逻辑判断","stem":"视觉（光）是哺乳动物重要的感知，其促进幼年大脑发育的功能得到了广泛关注。在发育过程中视网膜自感光神经节细胞是最早具有感光功能的视网膜感光细胞，专家认为它可能是介导光促进幼年大脑发育最关键的感光细胞。\n以下哪项如果为真，最能支持专家的观点？","options":{"A":"蜻蜓拥有近乎三百六十度的视野，它们不用频繁地扭动头部，就可以发现目标猎物","B":"新生儿出生前视网膜已经发育，随着婴儿月龄增加，追物能力变强，视野扩大，多增加光环境可以促进新生儿大脑发育","C":"细胞光感受的缺失，会导致幼鼠在学习速度上的缺陷，但这种缺陷可以被幼年时人为激活该细胞或视上核的催产素神经元所弥补","D":"小蝙蝠的视杆细胞主要用于感受暗光，虽然它们具有视力，但回声定位能力却是其感知周围环境的主要手段，可以忽略视觉对它的重要性"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：它（视网膜自感光神经节细胞）可能是介导光促进幼年大脑发育最关键的感光细胞。\n论据：在发育过程中视网膜自感光神经节细胞是最早具有感光功能的视网膜感光细胞。\n本题论点和论据均在讨论视网膜自感光神经节细胞和感光的关系，论点论据话题一致，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：选项讨论的是蜻蜓可利用近三百六十度的视野来发现目标猎物，而论点讨论的是视网膜自感光神经节细胞对幼年大脑发育的影响，话题不一致，无法加强，排除；\nB项：选项讨论的是多增加光环境可以促进新生儿大脑发育，而论点讨论的是视网膜自感光神经节细胞对幼年大脑发育的影响，话题不一致，无法加强，排除；\nC项：选项指出幼鼠在学习速度上的缺陷可以被幼年时人为激活视网膜自感光神经节细胞所弥补，说明该细胞确实能介导光促进幼年大脑发育，补充论据，可以加强，当选；\nD项：该项指出小蝙蝠的视杆细胞主要用于感受暗光，而论点讨论的是视网膜自感光神经节细胞对幼年大脑发育的影响，话题不一致，无法加强，排除。\n故正确答案为C。","no":88,"missingImage":false},{"type":"question","qid":"16593157","cat":"逻辑判断","stem":"某高校针对去年起图书馆的图书借阅情况做了调查，数据显示，文学类书籍的借阅量大大超过了科技类书籍。因此，文学类书籍的受欢迎程度要高于科技类书籍。\n以下哪项如果为真，最能削弱上述论证？","options":{"A":"科技类书籍学习难度较大","B":"文学类书籍占该校图书馆馆藏一半以上","C":"该校就读文科专业的学生接近三分之二","D":"除了文学类书籍，法律、哲学类书籍也很受欢迎"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：文学类书籍的受欢迎程度要高于科技类书籍。\n论据：某高校针对去年起图书馆的图书借阅情况做了调查，数据显示，文学类书籍的借阅量大大超过了科技类书籍。\n本题论点探讨的是文学类书籍受欢迎程度更高，论据探讨的文学类书籍的借阅量更大，论点论据话题不一致，削弱优先考虑拆桥，即说明借阅量大不等于受欢迎程度高。\n第二步：逐一分析选项。\nA项：科技类书籍的学习难度较大会导致其受欢迎程度较低，解释了论点成立的原因，为加强项，无法削弱，排除；\nB项：文学类书籍占该校图书馆馆藏一半以上，即图书馆中文学类书籍的总量超过了科技类书籍，两类书籍的总量不一致，在两类书籍总量不一致的情况下，借阅量无法准确反映受欢迎程度，为拆桥项，可以削弱，当选；\nC项：该校有接近三分之二的学生就读“文科”专业（教学上哲学、历史、政治、法律等学科均属于“文科”专业），论点论据探讨的是“文学类”书籍，而非“文科”书籍，因此无法确定就读“文科”专业对借阅“文学类”书籍的影响，选项与题干话题不一致，无法削弱，排除；\nD项：指出该校法律、哲学类书籍的情况，与论点探讨的话题无关，为无关项，无法削弱，排除。\n故正确答案为B。","no":89,"missingImage":false},{"type":"question","qid":"16593159","cat":"逻辑判断","stem":"有研究报告指出，当前地球上有近一半的开花植物受到灭绝的威胁，数量超过10万种。而鉴于90%的药物来自植物，因此人类可能会失去大多数药物来源。\n以下哪项如果为真最能质疑上述观点？","options":{"A":"动物以及真菌类也是重要的药物来源","B":"植物受威胁甚至濒临灭绝的情况明显超过动物","C":"地球上的植物大概有40万种，当前开发为药用植物的有1万多种","D":"植物的药用价值也正是其濒临灭绝的主要原因，亟需寻找可替代药物"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：人类可能会失去大多数药物来源。\n论据：人类90%的药物来自植物，而当前地球上有近一半的开花植物受到灭绝的威胁，数量超过10万种。\n本题论点讨论的是人类可能会失去大多数药物来源，论据讨论的是人类90%的药物来自植物，而近一半的开花植物受到灭绝的威胁，故论点论据话题不一致，削弱优先考虑拆桥，即在“近一半的开花植物灭绝”和“人类失去大多数药物来源”之间断开联系即可。\n第二步：逐一分析选项。\nA项：动物以及真菌类也是重要的药物来源，只是重要的药物来源，但不清楚动物以及真菌类在药物来源中的占比，无法削弱论点中的“大多数药物来源”，为不明确项，无法削弱，排除；\nB项：植物受威胁甚至濒临灭绝的情况明显超过动物，比较植物和动物濒临灭绝的情况，与论点人类可能会失去大多数药物来源无关，为无关项，无法削弱，排除；\nC项：地球上的植物大概有40万种，当前开发为药用植物的有1万多种，即地球上的植物足够多，尽管近一半的开花植物受到灭绝的威胁，人类只开发药用植物一万多种，还剩很多植物可以开发为药用植物，即在“近一半的开花植物灭绝”和“人类失去大多数药物来源”之间断开联系，为拆桥项，可以削弱，当选；\nD项：植物的药用价值也正是其濒临灭绝的主要原因，是在谈论植物濒临灭绝的原因，与论点人类可能会失去大多数药物来源无关，为无关项，无法削弱，排除。\n故正确答案为C。","no":90,"missingImage":false},{"type":"question","qid":"16593166","cat":"逻辑判断","stem":"世界上一些棉花种植区域的虫害导致全球棉花价格大幅上涨，相比之下，大豆的价格长期保持稳定，由于棉花成熟快，甲国许多大豆种植者计划停止大豆种植而改种棉花。所以，至少在未来几年内，棉花价格的高涨将大幅提高棉花种植者的收入。\n以下哪项如果为真，最能削弱上述论证？","options":{"A":"过去几年大豆种植成本显著增加，预计将继续攀升","B":"很少有消费者愿意为棉织品支付比现在更高的价格","C":"甲国新研发的杀虫剂价格低廉，还能有效杀死棉花害虫","D":"未来几年，甲国的棉花和棉花制品需求量不会急剧增加"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：至少在未来几年内，棉花价格的高涨将大幅提高棉花种植者的收入。\n论据：世界上一些棉花种植区域的虫害导致全球棉花价格大幅上涨，相比之下，大豆的价格长期保持稳定，由于棉花成熟快，甲国许多大豆种植者计划停止大豆种植而改种棉花。\n本题论点讨论的是棉花价格的高涨将大幅提高棉花种植者的收入，论据讨论的是因全球棉花价格大幅上涨及棉花成熟快，甲国许多大豆种植者认为种棉花的收入会更高，从而计划停止大豆种植而改种棉花，论点论据都在讨论种棉花会提高种植者的收入，二者话题一致，削弱可以考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出大豆种植成本预计将继续攀升，而论点讨论的是种棉花是否会提高种植者的收入，话题不一致，无法削弱，排除；\nB项：该项指出很少有消费者愿意为棉织品支付比现在更高的价格，说明消费者不愿意买单，所以种棉花挣不了钱，可以削弱，保留；\nC项：该项指出甲国新研发的杀虫剂价格低廉，还能有效杀死棉花害虫，结合题干开头提及的棉花因虫害而涨价，说明由于甲国有便宜杀虫剂，所以就没有虫害，产量也不会下降，棉花就不会涨价进而不会提高种植者收入，可以削弱，保留；\nD项：该项指出未来几年，甲国的棉花和棉花制品需求量不会急剧增加，而收入是由棉花价格和销量共同决定的，甲国消费者需求量不会急剧增加，故甲国棉花及棉花制品销量和价格可能不会有明显增加，从而将不会大幅提高棉花种植者的收入，削弱论点，可以削弱，保留。\n对比B、C、D三项，D项中通过“未来几年”、“需求量”与论点中的“未来几年”、“收入”相呼应，与题干关系更紧密，而B、C两项均未提及具体时间，反驳“收入增加”的内容不如D项更直接。\n本题的主要争议点在CD项：\n1.有同学质疑D项觉得虽然需求量不会急剧增加，但是“棉花价格会大幅上涨”，那就大幅提高棉花种植者的收入了呀。注意，在种棉花的人多了，需求不会急剧增加的情况下，棉花价格就不可能大幅上涨，所以“价格会大幅上涨”这个假设就不成立。\n已知种棉花的人多了，且“收入=价格*销量”，D项说“需求量不会急剧增加”，可以推出“棉花价格不会大幅上涨”且“销量不会急剧增加”，那么最终“种植者收入也就不会大幅提高”，D项可以削弱论点；\nC项因为有杀虫剂，所以棉花的价格不会大幅上涨，但是没有提到需求量，也就是没有考虑到“销量”问题，此处没有D项全面。\n2.题干认为棉花价格上涨是因为“虫害”，C项强调甲国新研发的杀虫剂价格低廉，能有效杀死棉花害虫，即可以解决虫害问题，题干的问题被解决了，那么棉花价格也就不会上涨，最终“种植者收入就不会大幅提高”，从与题干内容的相关性上，C项的“杀虫剂”更贴合论证内容，这点C项比D项好。\n综上，本题是争议题，CD项各有道理，在这道题中主要学习的思路有：\n一是“因为收入=价格*销量，所以讨论收入是否会提高时，价格和销量两方面都能考虑到的选项更优”；\n二是“哪个选项跟文段讨论的话题更相关更接近，哪个选项的力度更强”。\n一般这两种选项不会同时出现，因为这道题一起出现了，所以就有了争议，争议题不纠结，不作为备考重点，学习基本思路即可。\n故正确答案为D。","no":91,"missingImage":false},{"type":"question","qid":"16593138","cat":"逻辑判断","stem":"借助水文气象卫星20年采集的数据，科学家看到全球56%的海水变得越来越绿，这些海水都处在南纬40度和北纬40度之间的热带和亚热带水域，海水颜色由上层海水所含物质决定，深蓝色意味着海洋中没有太多生物，绿色则代表海里存在着以浮游植物为基础的生态系统，科学家据此认为，气候变暖让这片海域变得越来越绿。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"变绿海域都处在热带和亚热带，特别是赤道附近","B":"如果海洋持续变暖，海洋变绿现象会持续地加剧","C":"气候变暖会大大加速热带和亚热带海洋浮游植物生长","D":"模拟海洋生态系统证明气候变暖与海水变绿之间存在正相关关系"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：气候变暖让热带和亚热带海域变得越来越绿。\n论据：全球56%的海水变得越来越绿，这些海水都处在南纬40度和北纬40度之间的热带和亚热带水域，海水颜色由上层海水所含物质决定，深蓝色意味着海洋中没有太多生物，绿色则代表海里存在着以浮游植物为基础的生态系统。\n本题论点讨论的是气候变暖让热带和亚热带海域变得越来越绿，论据讨论的是绿色则代表海里存在着以浮游植物为基础的生态系统，论据和论点话题不一致，加强优先考虑搭桥，即在“浮游植物”和“气候变暖”之间建立联系。\n第二步：逐一分析选项。\nA项：该项说的是变绿海域处在何地，论点说的是海域变得越来越绿的原因，话题不一致，无法加强，排除；\nB项：该项说的是如果海洋持续变暖，海洋变绿现象会持续地加剧，说明气候变暖会导致海洋持续变暖，进而导致海洋变绿，补充论据，可以加强，保留；\nC项：该项说的是气候变暖会大大加速热带和亚热带海洋浮游植物生长，在“浮游植物”和“气候变暖”之间建立联系，为搭桥项，可以加强，保留；\nD项：该项说的是模拟海洋系统证明气候变暖与海洋变绿之间存在正相关关系，补充论据，可以加强，保留。\n对比B、C、D三项，C项为搭桥项，B项和D项均为补充论据，C项的加强力度大于B、D两项。\n故正确答案为C。","no":92,"missingImage":false},{"type":"question","qid":"16593175","cat":"逻辑判断","stem":"帕金森病作为一种严重的神经变性疾病，其背后发生的潜在原因尚不清楚，尽管遗传突变已经成为诱发帕金森病的一种已知原因，但90%的病例仍然是零星发生的，且没有明确的遗传起源，最新研究发现，环境因素如肠道微生物代谢产物会破坏人类产生多巴胺的神经元，导致类似帕金森病的症状出现，这一发现表明潜在的环境因素是帕金森病的诱因之一。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"人类微生物组可能影响神经退行性疾病","B":"帕金森病患者的肠道微生物组环境与健康人不同","C":"帕金森病诱因的发现为开发新型疗法提供了方向","D":"杀虫剂和工业化学物质等与机体神经退化之间存在明显关联"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：潜在的环境因素是帕金森病的诱因之一。\n论据：环境因素如肠道微生物代谢产物会破坏人类产生多巴胺的神经元，导致类似帕金森病的症状出现。\n本题论据在讨论环境因素中的肠道因素会导致类似帕金森病的症状出现，论点在讨论潜在的环境因素是帕金森病的诱因之一，论点论据均在讨论环境因素导致帕金森病，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的人类微生物组可能影响神经退行性疾病，帕金森病是最常见的神经退行性疾病之一，说明人类微生物组可能会对帕金森病有影响，具有可能的加强作用，保留；\nB项：该项说的是帕金森病患者的肠道微生物组环境与健康人不同，说明由于两类人的肠道微生物不同，所以有可能是肠道微生物引发的帕金森，有一定的加强力度，保留；\nC项：该项说的是帕金森病诱因发现的现实意义，与题干讨论的潜在的环境因素是否是帕金森病诱因的话题无关，为无关项，无法加强，排除；\nD项：该项说的是杀虫剂和工业化学物质等与机体神经退化之间存在明显关联，而杀虫剂和工业化学物质确实是生活环境中存在的，举例说明环境因素是帕金森病的诱因，补充论据，可以加强，保留。\n对比A、B、D三项，A项和B项均为可能性的加强，而D项是明确的举例加强，D项的加强力度大于A、B两项。\n故正确答案为D。","no":93,"missingImage":false},{"type":"question","qid":"16593134","cat":"类比推理","stem":"小赵、小李、小周、小孙、小钱五人一起参与“谁是卧底”的游戏。已知五人中有两人是卧底，且存在以下情况：\n①小赵、小李两人中至少有一人是卧底\n②如果小李是卧底，小周一定是卧底\n③只有在小孙是卧底时，小钱才是卧底\n④如果小钱不是卧底，那么小赵也不是卧底\n⑤小孙不是卧底\n则卧底是：","options":{"A":"小赵和小钱","B":"小钱和小李","C":"小李和小周","D":"小赵和小周"},"answer":"C","explanation":"第一步：分析题干条件。\n①小赵 或 小李是卧底；\n②小李是卧底\u003cimg data-k=\"a37757d411ef\">小周是卧底；\n③小钱是卧底\u003cimg data-k=\"a37757d411ef\">小孙是卧底；\n④小赵是卧底\u003cimg data-k=\"a37757d411ef\">小钱是卧底；\n⑤小孙不是卧底；\n⑥五人中有两人是卧底。\n第二步：根据题干条件进行推理。\n条件⑤为确定信息，从确定信息开始推理。结合条件③，根据“否后必否前”可以得出小钱不是卧底。结合条件④，根据“否后必否前”可知，小赵不是卧底。结合条件①，根据“或关系否一推一”可以得出小李是卧底，再结合条件②，根据“肯前必肯后”可以得出小周是卧底，对应C项。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"16593130","cat":"类比推理","stem":"某单位邀请7位评标专家甲、乙、丙、丁、戊、己、庚参加评标工作，7位评标专家随机被分成两组，其中第一组3人，第二组4人，但分组须符合以下要求：\n①甲和丙不能在同一个小组\n②如果乙在第一组，那么丁必须在第一组\n③如果戊在第一组，那么丙必须在第二组\n④己必须在第二组\n如果丙、戊在同一组，那么不可能在同一组的是：","options":{"A":"甲和乙","B":"甲和丁","C":"乙和庚","D":"丙和庚"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）甲和丙不能在同一个小组；\n（2）乙在第一组\u003cimg data-k=\"a37757d411ef\">丁在第一组；\n（3）戊在第一组\u003cimg data-k=\"a37757d411ef\">丙在第二组；\n（4）己在第二组；\n（5）丙、戊在同一组；\n（6）第一组3人，第二组4人。\n第二步：根据题干条件进行推理。\n根据条件（3），如果戊在第一组，那么丙应该在第二组，与条件（5）“丙、戊在同一组”矛盾，所以戊在第二组，则丙也在第二组。此时结合条件（1）可知，甲在第一组；结合条件（4）己在第二组和条件（6）可得表格如下。此时还余乙、丁、庚3人未分组。\n\u003cimg data-k=\"ef59dd3d0db5\" style=\"max-width:600px\">\n结合条件（2），假设乙在第一组，则丁也在第一组，此时甲、乙、丁在第一组，丙、戊、己、庚在第二组；假设乙在第二组，此时甲、丁、庚在第一组，乙、戊、丙、己在第二组。综上，乙和庚一定不可能在同一组。\n本题为选非题，故正确答案为C。","no":95,"missingImage":false}],"count":40,"answerable":40,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万，互联网普及率达75.6%，较2021年12月提升2.6个百分点。我国网民使用手机上网的比例达99.8%，较2021年12月增加0.1个百分点；使用电视上网的比例为25.9%；使用台式电脑、笔记本电脑、平板电脑上网的比例分别为34.2%、32.8%和28.5%。我国城镇网民规模约为7.59亿，占网民整体的71.1%，农村网民规模约为3.08亿，较2021年12月增长约2371万，占网民整体的28.9%。\u003c/p>\u003cp>        2022年12月，20-29岁、30-39岁、40-49岁网民占比分别为14.2%、19.6%和16.7%；50岁及以上网民群体占比由2021年12月的26.8%提升至30.8%，互联网进一步向中老年群体渗透。\u003c/p>\u003cp>        2022年12月，线上办公用户规模约达5.4亿，较2021年12月增加7078万户，占整体网民的50.6%。互联网医疗用户规模约达3.63亿，较2021年12月增加约6466万，占网民整体的34%。农村地区在线教育和互联网医疗用户分别占农村网民整体的31%和21.5%，较上年分别增加2.7%和4.1%。\u003c/p>\u003cp>\u003cimg data-k=\"71fc163a9ef2\" style=\"max-width:678px\">\u003c/p>","questions":[{"qid":"16593065","cat":"综合","stem":"截至2022年12月，我国20岁以上网民人数是20岁以下网民人数的：","options":{"A":"不到3倍","B":"3-4倍之间","C":"4-5倍之间","D":"5倍以上"},"answer":"C","explanation":"根据题干“截至2022年12月······是······的”，结合材料时间为2022年12月，且选项为倍数，可判定本题为现期倍数问题。定位文字材料第二段可得：2022年12月，我国20-29岁、30-39岁、40-49岁网民占比分别为14.2%、19.6%和16.7%；50岁及以上网民群体占比由2021年12月的26.8%提升至30.8%。则截至2022年12月，我国20岁以上网民人数占比=14.2%+19.6%+16.7%+30.8%=81.3%，20岁以下网民人数占比=1-81.3%=18.7%，则题干所求\u003cimg data-k=\"5fe92a2d1df7\">，在C项范围内。 \n故正确答案为C。","no":96,"missingImage":false},{"qid":"16593066","cat":"增长","stem":"截至2022年12月，我国城镇网民规模同比增速约为：","options":{"A":"1.2%","B":"1.6%","C":"2.0%","D":"2.4%"},"answer":"B","explanation":"根据题干“截至2022年12月······同比增速约为”，可判定本题为一般增长率问题。定位文字材料第一段可得：截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万。我国城镇网民规模约为7.59亿，农村网民规模约为3.08亿，较2021年12月增长约2371万。由于我国网民规模的同比增长量=城镇网民规模的同比增长量+农村网民规模的同比增长量，则2022年12月，我国城镇网民规模同比增长约3549-2371=1178万=0.1178亿。根据公式：增长率\u003cimg data-k=\"52798dda76db\">\u003cimg data-k=\"e538436134c4\">。\n故正确答案为B。","no":97,"missingImage":false},{"qid":"10204490","cat":"综合","stem":"根据上述材料，截止2022年12月我国网民使用上网前3位的设备是：","options":{"A":"手机、台式电脑、笔记本电脑","B":"手机、笔记本电脑、平板电脑","C":"手机、电视、台式电脑","D":"电视、台式电脑、平板电脑"},"answer":"A","explanation":"定位文字材料第一段可知：截止2022年12月，我国网民使用手机上网的比例达99.8%，使用电视上网的比例为25.9%，使用台式电脑、笔记本电脑、平板电脑上网的比例分别为34.2%、32.8%和28.5%。故截止2022年12月我国网民使用上网前3位的设备是：手机（99.8%）、台式电脑（34.2%）、笔记本电脑（32.8%）。\n故正确答案为A。","no":98,"missingImage":false},{"qid":"16593067","cat":"增长","stem":"2019-2022年，当年12月我国城镇与农村互联网普及率同比增量相差在1个百分点以内的年份有几个？","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"A","explanation":"根据题干“2019-2022年，当年12月······同比增量······”，可判定本题为增长量计算问题。定位统计图可知2018年12月-2022年12月我国城镇与农村互联网的普及率。根据公式：增长量=现期量-基期量，则2019-2022年，当年12月我国城镇与农村互联网普及率同比增量差值分别为：\n2019年：\u003cimg data-k=\"7edd680f10a8\">，不满足；\n2020年：\u003cimg data-k=\"468558a2cf4f\">，不满足；\n2021年：\u003cimg data-k=\"0e69974689cc\">，满足；\n2022年：\u003cimg data-k=\"c76cf0cf9c32\">，不满足。\n综上可知，2019-2022年，当年12月我国城镇与农村互联网普及率同比增量相差在1个百分点以内的年份仅有1个（2021年）。\n故正确答案为A。","no":99,"missingImage":false},{"qid":"16593068","cat":"增长","stem":"以下柱状图中，最能准确反映2019年12月-2022年12月全国互联网普及率同比增量变化趋势的是（横轴位置代表增量为0）：","options":{"A":"\u003cimg data-k=\"cf7c8a58964d\" style=\"max-width:250px\">","B":"\u003cimg data-k=\"bb72085f9980\" style=\"max-width:250px\">","C":"\u003cimg data-k=\"eeb3857f260a\" style=\"max-width:251px\">","D":"\u003cimg data-k=\"6ccfe2935152\" style=\"max-width:251px\">"},"answer":"C","explanation":"根据题干“······最能准确反映2019年12月-2022年12月全国互联网普及率同比增量变化趋势的是······”，可判定本题为增长量比较问题。定位统计图可知2018年12月-2022年12月全国互联网普及率。根据公式：增长量=现期量-基期量，则2019年12月-2022年12月全国互联网普及率同比增量分别为：\n2019年12月：64.5%-59.6%=4.9%，即同比增长4.9个百分点；\n2020年12月：70.4%-64.5%=5.9%，即同比增长5.9个百分点；\n2021年12月：73.0%-70.4%=2.6%，即同比增长2.6个百分点；\n2022年12月：75.6%-73.0%=2.6%，即同比增长2.6个百分点。\n观察可知，同比增量呈先上升再下降最后相等的趋势，且2020年12月与2019年12月同比增量仅相差1个百分点，与C项变化趋势一致。\n故正确答案为C。","no":100,"missingImage":false}]},{"type":"material","material":"\u003cp>        2022年中国锂电池出货量658GWh，同比增长101 <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
