<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2024年广西区考公务员录用考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2024-广西","title":"2024年广西区考公务员录用考试《行测》题（网友回忆版）","year":"2024","group":"广西","modules":[{"label":"政治理论","items":[{"type":"question","qid":"16593217","cat":"马克思主义","stem":"“周虽旧邦，其命维新”。习近平总书记指出，中国式现代化是中华民族的旧邦新命，必将推动中华文明重焕荣光。下列关于中国式现代化说法正确的有几项？\n①中国式现代化深深植根于中华优秀传统文化，体现科学社会主义的先进本质\n②中国式现代化借鉴吸收一切人类优秀文明成果，是一种全新的人类文明形态\n③中国式现代化是中国共产党领导的社会主义现代化，是文明更新的结果\n④中国式现代化蕴含的独特世界观、价值观、历史观、文明观、民主观、生态观等及其伟大实践，是对世界现代化理论和实践的重大创新\n⑤中华文明赋予中国式现代化以深厚底蕴，走中国式现代化道路，赋予中华文明以现代力量","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"D","explanation":"本题考查政治常识。\n①②正确，习近平总书记在学习贯彻党的二十大精神研讨班开班式上的重要讲话中指出：“中国式现代化，深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，展现了不同于西方现代化模式的新图景，是一种全新的人类文明形态。”\n③正确，党的二十大报告指出：“中国式现代化是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。”习近平总书记在文化传承发展座谈会的讲话中指出：“中国式现代化是赓续古老文明的现代化，而不是消灭古老文明的现代化；是从中华大地长出来的现代化，不是照搬照抄其他国家的现代化；是文明更新的结果，不是文明断裂的产物。”\n④正确，习近平总书记在学习贯彻党的二十大精神研讨班开班式上指出：“中国式现代化蕴含的独特世界观、价值观、历史观、文明观、民主观、生态观等及其伟大实践，是对世界现代化理论和实践的重大创新。”\n⑤正确，习近平总书记在文化传承发展座谈会的讲话中指出：“中国式现代化赋予中华文明以现代力量，中华文明赋予中国式现代化以深厚底蕴。中国式现代化是赓续古老文明的现代化，而不是消灭古老文明的现代化；是从中华大地长出来的现代化，不是照搬照抄其他国家的现代化；是文明更新的结果，不是文明断裂的产物。中国式现代化是中华民族的旧邦新命，必将推动中华文明重焕荣光。”\n故①②③④⑤正确，有5项。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"10204470","cat":"时事政治","stem":"党的二十大报告指出，优化民营企业发展环境，依法保护民营企业产权和企业家权益，促进民营经济发展壮大。下列关于促进民营经济发展措施与其发挥作用对应正确的是：\n①完善社会信用激励约束机制——发挥信用激励机制作用，提升信用良好企业获得感\n②完善融资支持政策制度——支持符合条件的民营企业上市融资，缓解民营企业资金问题\n③持续完善知识产权保护体系——严格落实侵权惩罚性赔偿，降低民营企业科技转化成本\n④健全民营经济人士思想政治建设机制——深入开展理想信念教育，确保构建亲近政商关系","options":{"A":"①②","B":"①③","C":"②④","D":"③④"},"answer":"A","explanation":"本题考查政治常识。\n2023年7月19日，《中共中央 国务院关于促进民营经济发展壮大的意见》发布。以下简称《意见》。\n①正确，《意见》在“二、持续优化民营经济发展环境”部分指出：“（三）完善社会信用激励约束机制。完善信用信息记录和共享体系，全面推广信用承诺制度，将承诺和履约信息纳入信用记录。发挥信用激励机制作用，提升信用良好企业获得感······”\n②正确，《意见》在“三、加大对民营经济政策支持力度”部分指出：“（五）完善融资支持政策制度。健全银行、保险、担保、券商等多方共同参与的融资风险市场化分担机制······推动民营企业债券融资专项支持计划扩大覆盖面、提升增信力度。支持符合条件的民营企业上市融资和再融资。”\n③错误，《意见》在“四、强化民营经济发展法治保障”部分指出：“（十二）持续完善知识产权保护体系。加大对民营中小微企业原始创新保护力度。严格落实知识产权侵权惩罚性赔偿、行为保全等制度。建立知识产权侵权和行政非诉执行快速处理机制，健全知识产权法院跨区域管辖制度。”而“降低民营企业科技转化成本”属于《意见》“五、着力推动民营经济实现高质量发展”部分中“（十六）支持提升科技创新能力”举措所对应的作用。\n④错误，《意见》在“六、促进民营经济人士健康成长”部分指出：“（二十一）健全民营经济人士思想政治建设机制。积极稳妥做好在民营经济代表人士先进分子中发展党员工作。深入开展理想信念教育和社会主义核心价值观教育。教育引导民营经济人士中的党员坚定理想信念，发挥先锋模范作用，坚决执行党的理论和路线方针政策。积极探索创新民营经济领域党建工作方式。”而关于“构建亲近政商关系”，《意见》中指出“（二十五）全面构建亲清政商关系。把构建亲清政商关系落到实处，党政干部和民营企业家要双向建立亲清统一的新型政商关系。”可知其与“健全民营经济人士思想政治建设机制”并无对应关系，且应该是构建“亲清政商关系”而不是“亲近政商关系”。\n故正确的是①②。\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"10204477","cat":"时事政治","stem":"党的二十大报告指出，坚持按劳分配为主体、多种分配方式并存，构建初次分配、再分配、第三次分配协调配套的制度体系。关于完善收入分配格局，下列说法正确的是：\n①扩大中等收入群体比重，增加低收入群体收入，取缔过高收入，促进社会公平正义\n②构建知识、技术、数据等创新要素参与收益分配机制，优化初次分配格局\n③推动教育、养老、医疗、住房保障等基本公共服务均等化，逐步健全再分配机制\n④通过发展企业年金、职业年金等措施，发挥第三次分配重要作用","options":{"A":"①②","B":"①④","C":"②③","D":"③④"},"answer":"C","explanation":"本题考查政治常识。\n2022年12月，中共中央、国务院印发了《扩大内需战略规划纲要（2022-2035年）》（以下简称《纲要》）。\n①错误，《纲要》中“九、扎实推动共同富裕，厚植内需发展潜力”部分指出：“······坚持以人民为中心的发展思想，在高质量发展中促进共同富裕，正确处理效率和公平的关系，完善收入分配格局，构建初次分配、再分配、三次分配协调配套的基础性制度安排，加大税收、社保、转移支付等调节力度并提高精准性，扩大中等收入群体比重，增加低收入群体收入，合理调节高收入，取缔非法收入，促进社会公平正义，促进人的全面发展，增强内需发展后劲。”\n②正确，《纲要》中“九、扎实推动共同富裕，厚植内需发展潜力”部分的“（二十八）持续优化初次分配格局”中指出：“健全各类生产要素参与分配机制。构建知识、技术、数据等创新要素参与收益分配机制，强化以增加知识价值为导向的分配政策，发挥工资激励保障作用。”\n③正确，《纲要》中“九、扎实推动共同富裕，厚植内需发展潜力”部分的“（二十九）逐步健全再分配机制”中指出：“加大财税制度对收入分配的调节力度。健全直接税体系，完善综合与分类相结合的个人所得税制度，加强对高收入者的税收调节和监管。完善中央与地方财政事权和支出责任划分，推动教育、养老、医疗、住房保障等基本公共服务均等化。”\n④错误，《纲要》中“九、扎实推动共同富裕，厚植内需发展潜力”部分的“（二十九）逐步健全再分配机制”中指出：“健全社会保障制度。推进基本养老保险由制度全覆盖到法定人群全覆盖，完善灵活就业人员参加职工社会保险制度。发展企业年金、职业年金，规范发展第三支柱养老保险。”\n故②③表述正确。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"16593167","cat":"新思想","stem":"习近平总书记强调，要用好红色资源，传承好红色基因，把红色江山世世代代传下去。下列红色基地与主题党课开设搭配最合理的是：\n①北大红楼：红色序章\n②南湖红船：清正廉洁\n③遵义会议会址：伟大转折\n④延安革命根据地：革命摇篮","options":{"A":"①②","B":"①③","C":"②④","D":"③④"},"answer":"B","explanation":"本题考查毛中特。\n①正确，北京大学红楼是中国近代史上李大钊、陈独秀、毛泽东最早传播马克思主义和民主科学进步思想的重要场所，具有重要历史价值。2021年“光辉伟业 红色序章——北大红楼与中国共产党早期北京革命活动”主题展览就在北大红楼召开。故在北大红楼与“红色序章”主题党课开设搭配合理。\n②错误，南湖红船是中国共产党第一次全国代表大会的会场，是中国共产党的诞生地。2005年6月21日，时任中共浙江省委书记的习近平同志在《光明日报》发表《弘扬“红船精神” 走在时代前列》的重要文章，首次提出并阐述了红船精神，红船精神的主要内涵是开天辟地、敢为人先的首创精神，坚定理想、百折不挠的奋斗精神，立党为公、忠诚为民的奉献精神，并明确指出红船精神是中国革命精神之源。故在南湖红船与“清正廉洁”主题党课开设搭配并不合理。\n③正确，1935年1月15日至17日，中共中央决定在黔北重镇遵义召开会议，总结第五次反“围剿”的经验教训。遵义会议确立了毛泽东在党和红军中的领导地位，在极其危急的情况下挽救了党，挽救了红军，挽救了中国革命。遵义会议是党的历史上一个生死攸关的转折点，以毛泽东为核心的党中央的正确领导开始确立，标志着中国共产党在政治上走向成熟。故在遵义会议会址与“伟大转折”主题党课开设搭配合理。\n④错误，1927年，轰轰烈烈的大革命失败后，中国共产党为挽救革命、寻找革命新道路开始了新的奋斗历程。10月，毛泽东率领湘赣边界秋收起义的工农革命军，开始为创建以宁冈为中心的井冈山农村革命根据地而斗争。井冈山是中国革命的摇篮。习近平总书记在赴江西考察时曾深刻指出：“井冈山斗争的伟大实践，对中国革命道路的探索和抉择、对中国共产党和人民军队成长具有关键意义。”故“革命摇篮”的主题党课在井冈山开设更为合理。\n综上所述，①③表述正确。\n故正确答案为B。","no":4,"missingImage":false}],"count":4,"answerable":4,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"16593165","cat":"法律常识","stem":"下列关于自首的判断说法正确的是：","options":{"A":"甲和乙共同实施盗窃犯罪，后甲因为内心害怕，主动到公安机关交代，并独自承担了全部罪行，甲构成自首","B":"甲和乙共同实施诈骗犯罪，后甲因酒驾被公安机关讯问时，主动交代乙曾经实施的故意杀人行为，甲构成自首","C":"王某交通肇事逃逸，其父知道后将其扭送至公安机关，王某主动交代了其肇事逃逸行为，王某构成自首","D":"甲公司非法集资且规模很大，该公司总经理李某因为害怕，瞒着其他高管偷偷到公安机关交代了相关情况，李某作为单位犯罪的直接责任人不能单独成立自首"},"answer":"C","explanation":"本题考查法律常识。\n根据《中华人民共和国刑法》第六十七条规定：“犯罪以后自动投案，如实供述自己的罪行的，是自首。对于自首的犯罪分子，可以从轻或者减轻处罚。其中，犯罪较轻的，可以免除处罚。被采取强制措施的犯罪嫌疑人、被告人和正在服刑的罪犯，如实供述司法机关还未掌握的本人其他罪行的，以自首论。犯罪嫌疑人虽不具有前两款规定的自首情节，但是如实供述自己罪行的，可以从轻处罚；因其如实供述自己罪行，避免特别严重后果发生的，可以减轻处罚。”\nA项错误，根据《最高人民法院关于处理自首和立功具体应用法律若干问题的解释》第一条规定：“······共同犯罪案件中的犯罪嫌疑人，除如实供述自己的罪行，还应当供述所知的同案犯，主犯则应当供述所知其他同案犯的共同犯罪事实，才能认定为自首······”题中，甲独自承担了全部罪行，并未如实供述同案犯，不构成自首。\nB项错误，根据《最高人民法院关于处理自首和立功具体应用法律若干问题的解释》第五条规定：“根据刑法第六十八条第一款的规定，犯罪分子到案后有检举、揭发他人犯罪行为，包括共同犯罪案件中的犯罪分子揭发同案犯共同犯罪以外的其他犯罪，经查证属实；提供侦破其他案件的重要线索，经查证属实；阻止他人犯罪活动；协助司法机关抓捕其他犯罪嫌疑人（包括同案犯）；具有其他有利于国家和社会的突出表现的，应当认定为有立功表现。”题中，甲主动交代乙的其他罪行，构成立功，不构成自首。\nC项正确，根据《最高人民法院关于处理自首和立功具体应用法律若干问题的解释》第一条规定：“······并非出于犯罪嫌疑人主动，而是经亲友规劝、陪同投案的；公安机关通知犯罪嫌疑人的亲友，或者亲友主动报案后，将犯罪嫌疑人送去投案的，也应当视为自动投案······”题中，王某虽被扭送至公安机关，但主动交代罪行，构成自首。\nD项错误，根据《中华人民共和国刑法》第三十一条规定：“单位犯罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员判处刑罚。本法分则和其他法律另有规定的，依照规定。”《办理走私刑事案件适用法律若干问题的意见》第二十一条规定：“关于单位走私犯罪案件自首的认定问题在办理单位走私犯罪案件中，对单位集体决定自首的，或者单位直接负责的主管人员自首的，应当认定单位自首。认定单位自首后，如实交代主要犯罪事实的单位负责的其他主管人员和其他直接责任人员，可视为自首，但对拒不交代主要犯罪事实或逃避法律追究的人员，不以自首论。”因此，司法实践中认可单位自首的情形。题中，李某作为单位直接负责人，虽然瞒着其他高管单独到公安机关交代相关情况，但仍构成单位自首。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"10204467","cat":"人文常识","stem":"唐太宗的《起居注》一直流传至今，以下情景不可能出现的是：","options":{"A":"与大臣一同品鉴李白的诗歌","B":"与房玄龄等大臣商议旱灾救助方案","C":"接见西域使者，被少数民族尊为“天可汗”","D":"宗庙祭祀，向其父唐高祖李渊上香祷告"},"answer":"A","explanation":"本题考查人文常识。\n起居注，是中国古代记录帝王的言行录，该史书体例由东汉明德皇后开创。唐太宗李世民（599年—649年）是唐朝的第二位皇帝，在位期间被称为“贞观之治”。\nA项错误，李白（701年—762年），盛唐时期著名诗人，字太白，号青莲居士，被誉为“诗仙”，代表作有《望庐山瀑布》《行路难》《蜀道难》等。故选项所述情景不可能出现。\nB项正确，房玄龄（579年—648年），名乔，字玄龄，凌烟阁二十四功臣之一，与杜如晦合称为“房谋杜断”。房玄龄是李世民得力的谋士之一，参与玄武门之变，与杜如晦等五人并功第一。李世民即位后，房玄龄为中书令，负责综理朝政长达二十年。故选项所述情景可能出现。\nC项正确，“天可汗”是唐代西北各族君长对唐太宗的尊称，也是表示对唐太宗的拥戴。“可汗”本是突厥、回纥、柔然等民族最高统治者的称号，“天可汗”就等于是给予各民族共同拥戴的最高统治者的尊称。贞观四年唐王朝击败东突厥以后，唐太宗接受诸蕃君长所奉“天可汗”称号。故选项所述情景可能出现。\nD项正确，李渊是唐朝的开国皇帝，是唐太宗李世民的父亲。贞观九年，李渊病逝，谥号太武皇帝，庙号高祖，葬于献陵。故选项所述情景可能出现。\n本题为选非题，故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"16593230","cat":"人文常识","stem":"下列文句与蕴含的哲理对应正确的是：","options":{"A":"竭泽而渔，岂不获得，而明年无鱼——事物是不断发展的","B":"井蛙不可以语于海，夏虫不可以语于冰——尊重客观规律","C":"吾生也有涯，而知也无涯。以有涯随无涯，殆已——勤学善记","D":"兵无常势，水无常形，能因敌变化而取胜者，谓之神——学会审时度势"},"answer":"D","explanation":"本题考查政治常识。\nA项错误，“竭泽而渔，岂不获得，而明年无鱼”出自《吕氏春秋·览·孝行览》，把池水抽干去捕鱼，哪能捉不到呢，只是第二年就没鱼了。比喻取之不留余地，只图眼前利益，不作长远打算。没有用发展的眼光看问题，而是用孤立、静止的思维思考问题，属于形而上学的观点。\nB项错误，“井蛙不可以语于海，夏虫不可以语于冰”出自《庄子·外篇·秋水》，意思是对井里的蛙不可与它谈论关于海的事情，对夏天生死的虫子不可与它谈论关于冰雪的事情。这是因为井蛙的眼界受空间限制，夏虫的眼界受到时令的制约，体现了认识来源于实践的哲学原理。\nC项错误，“吾生也有涯，而知也无涯。以有涯随无涯，殆已”出自《庄子·内篇·养生主》，意思是我的生命是有限的，而知识是无限的。用有限的生命去追求无限的知识，真是累人啊！体现了认识是在实践基础上不断向前发展的。人们在实践中追求和发展真理是一个永无止 境的过程。\nD项正确，“兵无常势，水无常形，能因敌变化而取胜者，谓之神”出自《孙子兵法·虚实篇》，意思是用兵作战没有固定不变的方法态势，如同水流没有固定的形状，能够依据敌情的变化而取胜，可称得上用兵如神了。体现了一切事物都是不断运动、变化、发展的，要用发展的眼光看问题，学会审时度势。\n故正确答案为D。\n注：本题存在瑕疵，D项不是哲理的表述，但前后所反映的哲理一致。","no":7,"missingImage":false},{"type":"question","qid":"10204501","cat":"人文常识","stem":"下列世界文化遗产及所在地对应错误的是：","options":{"A":"平遥古城——山西；鼓浪屿——福建","B":"龙门石窟——河南；云冈石窟——陕西","C":"布达拉宫——西藏；良渚古城遗址——浙江","D":"武当山古建筑群——湖北；西递村——安徽"},"answer":"B","explanation":"本题考查地理国情。\nA项正确，平遥古城位于山西省晋中市，始建于西周宣王时期（前827年—前782年），于明代洪武三年（1370年）重建、扩修城池，是现今中国境内保存最为完整的一座古代县城；1997年12月3日，平遥古城与周边的双林寺、镇国寺共同被联合国教科文组织确定为世界文化遗产，列入《世界遗产名录》。鼓浪屿位于福建省厦门市，岛西南有一海蚀岩洞受浪潮冲击，声如擂鼓，自明朝雅化为今名称“鼓浪屿”；2017年7月8日，“鼓浪屿：历史国际社区”被列入世界遗产名录。\nB项错误，龙门石窟位于河南省洛阳市，是世界上造像最多、规模最大的石刻艺术宝库，被联合国教科文组织评为“中国石刻艺术的最高峰”，中国著名石窟之一，现为世界文化遗产。云冈石窟位于山西省大同市，原名灵岩寺、石佛寺，是中国第一个皇家授权开凿的石窟；2001年，云冈石窟被联合国教科文组织列入世界文化遗产名录。\nC项正确，布达拉宫位于西藏自治区首府拉萨市，是一座宫堡式建筑群，主体建筑为白宫和红宫两部分；1994年，布达拉宫被列入世界遗产名录。良渚古城遗址位于浙江省杭州市余杭区，由良渚古城核心区、水利系统、祭坛墓地和外围郊区等部分组成；2019年7月6日，良渚古城遗址获准列入世界遗产名录。\nD项正确，武当山古建筑群位于湖北省丹江口市境内，敕建于唐贞观年间，明代达到鼎盛；1994年，武当山古建筑群被列入世界文化遗产名录。西递村位于安徽省黟县西递镇，地处黄山南麓、黟县盆地南侧，始建于北宋皇佑年间，发展于明朝景泰中叶，鼎盛于清代初期；2000年，以西递村为代表的皖南古村落被联合国教科文组织列入世界文化遗产名录。\n本题为选非题，故正确答案为B。","no":8,"missingImage":false},{"type":"question","qid":"16593156","cat":"科技常识","stem":"下列古籍中描述的现象与所体现的物理原理对应正确的是（    ）。","options":{"A":"《论衡》中提到摩擦过的琥珀能吸引像草芥一样的轻小物体——分子引力","B":"《考工记》中提到马拉车时，虽然马不再施力了，车仍能向前移动一段距离——惯性","C":"《墨子》中提到天平一端加重物，另一端必得加重物，两者必须相等才能平衡——力的相互作用","D":"《异苑》中提到有户人家的铜盆经常发出声音，后来发现是与宫中撞钟相应，用锉刀锉了铜盆后，声音就消失了——多普勒效应"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，中国学者王充在《论衡》一书写下“顿牟掇芥”，意为摩擦过的琥珀能吸引轻小草芥。摩擦后的琥珀得到了带负电的电子，它能吸引轻小草芥说明带电体具有吸引轻小物体的性质，体现了摩擦起电效应，和分子引力无关。\nB项正确，《考工记》中记载“马力既竭，辀（指车轮）犹能一取焉”，意思是没有了马的拉力以后，马车车轮仍然能往前行驶一段距离。马车原来是前进的，当马的拉力消失后，因为马车具有惯性，仍然要保持原来的前进状态，因此马车还可以继续向前移动一段距离。\nC项错误，《墨经》中记载：“衡，加重于其一旁，必捶，权重相若也。”这句话的意思是：天平衡量的一臂加重物时，另一臂则要加砝码，且两者必须等重，天平才能平衡。这句话解释的是杠杆的原理，和力的相互作用无关。\nD项错误，《异苑》中记载一个人来向张华请教，说他家有一个洗澡用的大铜盆，每日早晚总会嗡嗡作响，就像有人在敲打一般。张华答：这只铜盆和洛阳宫中大钟的音调相谐，宫中每天早晚都要撞钟，所以使铜澡盆有声相应。张华还告诉他只要把铜盆锉掉一点，使其变轻，便不会再作响。这体现了共鸣原理，和多普勒效应无关。多普勒效应是由于波源与观测者相对运动而出现的观测者测得的波频率与波源频率不同的现象。\n故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"16593154","cat":"科技常识","stem":"下列诗词中包含的生物学现象说法错误的是（    ）。","options":{"A":"野火烧不尽，春风吹又生——草原生态系统具有稳定性","B":"群雁辞归鹄南翔，念君客游思断肠——候鸟通过迁徙适应气候变化","C":"停车坐爱枫林晚，霜叶红于二月花——植物开花受温度和光照影响","D":"落红不是无情物，化作春泥更护花——微生物的分解作用及物质的循环"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，“野火烧不尽，春风吹又生”出自唐代诗人白居易的《赋得古原草送别》。诗句的意思是：野火不能烧尽野草，春天一到野草会长出来。生态系统稳定性即为生态系统所具有的保持或恢复自身结构和功能相对稳定的能力。这句诗通过描述野火燃烧和春风吹拂后植被再生的情景，体现了草原生态系统在面对破坏时的恢复和重生能力，展现了其具有一定的稳定性。\nB项正确，“群雁辞归鹄南翔，念君客游思断肠”出自魏晋时期诗人曹丕的《燕歌行二首·其一》。诗句的意思是：燕群辞归，天鹅南飞。思念出外远游的良人啊，我肝肠寸断。这句诗描写了候鸟离开北方迁徙到南方的场景。候鸟是指栖息地和繁殖地之间在不同季节之间往返的鸟类，它们通常会根据气候和资源的变化而进行周期性的迁徙，以适应气候变化，寻找适宜的生存条件。\nC项错误，“停车坐爱枫林晚，霜叶红于二月花”出自唐朝诗人杜牧的《山行》。诗句的意思是：停下车来，是因为喜爱这深秋的枫林晚景，那经霜的枫叶竟比二月的鲜花还要火红。夏天的枫叶是绿色的，这是因为枫叶中含有大量的叶绿素。叶绿素对绿光的吸收少、反射多导致叶片呈现绿色；当秋天到来天气温度变低，叶绿素被降解，叶片就会呈现出花青素的颜色。花青素又称红色素，位于叶片细胞的液泡内，使叶片呈现红色。所以该句诗主要体现了温度对色素的影响。\nD项正确，“落红不是无情物，化作春泥更护花”出自清代龚自珍的《己亥杂诗·其五》。诗句的意思是：从枝头上掉下来的落花不是无情之物，即使化作春泥，也甘愿化作养料，滋养美丽的花朵生长。这是由于在自然界中，土壤中的微生物可以分解落叶、枯枝、落花等有机物质，将这些有机物质转化为土壤中的无机盐等物质，使土壤更加肥沃，为植物提供养分。通过分解者的分解，这些有机物质回归到环境中并被再次利用，促进了自然界的物质循环。\n本题为选非题，故正确答案为C。","no":10,"missingImage":false}],"count":6,"answerable":6,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"10204462","cat":"逻辑填空","stem":"当其他城市还停留在“漫步”的思维里寻找发展机遇时，有的地方已经开始            ，深挖骑行、游船休闲消费需求。这不仅为当地经济拓展了新“赛道”，打开了新思路，也为文旅消费市场扩容提质、产业发展转型升级提供更广阔的市场空间。\n填入画横线部分最恰当的一项是：","options":{"A":"另辟蹊径","B":"推陈出新","C":"招兵买马","D":"大展宏图"},"answer":"A","explanation":"根据横线后“为当地经济拓展了新‘赛道’，打开了新思路”可知，横线处成语应体现有的地方已经采取了和其他城市不同的新做法。A项“另辟蹊径”比喻另创一种新风格或另找一个新途径、新方法，符合文意，当选。\nB项“推陈出新”指对旧的文化进行批判地继承，剔除其糟粕，吸取其精华，创造出新的文化，文段并无“推陈”之意，与文意不符，排除；C项“招兵买马”比喻组织或扩充人力，D项“大展宏图”指大规模地实施宏伟远大的计划或抱负，与后文采取新的做法均无法构成对应，与文意不符，排除。\n故正确答案为A。\n【文段出处】中经评论《“超长黄金周”呼唤文旅消费品质升级》","no":11,"missingImage":false},{"type":"question","qid":"16593227","cat":"逻辑填空","stem":"汉语溯源，我们主张从造字义入手，揭示其特征义、结合训诂材料和文献例证，从语素相互选择和古今沟通的角度，探讨词语产生的构词理据和意义变化等。只有这样，才有可能真正找到字词产生的源头，在纷繁复杂的词义系统里            ，层层深入，探明真相。\n填入画横线部分最恰当的一项是：","options":{"A":"去伪存真","B":"去粗取精","C":"抽丝剥茧","D":"按图索骥"},"answer":"C","explanation":"根据文意可知，文段核心话题为“溯源”，且根据横线后“层层深入”可知，横线处应体现出在纷繁复杂的词义系统里有层次地分析之意，C项“抽丝剥茧”形容分析事物极为细致，而且一步一步很有层次，符合文意，当选。\nA项，“去伪存真”指除掉虚假留存真实，文段不涉及虚假和真实，排除；\nB项，“去粗取精”指舍去粗糙的部分，取其精华部分，文段并无筛选之意，排除；\nD项，“按图索骥”比喻按照线索去寻求事物，也可比喻做事墨守成规，无法体现在纷繁复杂的词义系统里有层次地分析，也无法与文段主题词“溯源”形成对应，且文段并未提及线索，排除。\n故正确答案为C。\n【文段出处】光明网《溯源汉语字词 讲好文化故事》","no":12,"missingImage":false},{"type":"question","qid":"16593164","cat":"逻辑填空","stem":"要解决一个大问题，往往要有好的工具。工具的发展是一个            的过程，新工具能够促进学问的继续发展，提升我们看待问题的深度，又反过来促进我们进一步发展工具。每一次工具的进步，都会带动有意义的、重要的、突破性的学问的发展。\n填入画横线部分最恰当的一项是：","options":{"A":"锦上添花","B":"精益求精","C":"千锤百炼","D":"精雕细琢"},"answer":"B","explanation":"根据“要解决一个大问题”“新工具能够促进学问的继续发展，提升我们看待问题的深度，又反过来促进我们进一步发展工具”可知，在解决一个大问题的过程中，工具在不断地发展进步，形成了正向循环，即工具的发展是越来越好的过程，B项“精益求精”意为好了还求更好，符合文意，当选。\nA项“锦上添花”比喻好上加好，美上添美，侧重在已有的事物上，再添加其他美好的事物，文段强调工具自身的进步发展，与文意不符，排除；\nC项“千锤百炼”比喻经历多次的艰苦斗争和考验，文段并未提及艰苦的斗争和考验，与文意不符，排除；\nD项“精雕细琢”指精心细致地雕刻，多形容做事认真细致，文段并未强调认真细致在工具进步中的重要作用，与文意不符，排除。\n故正确答案为B。\n【文段出处】《丘成桐：学“问”》","no":13,"missingImage":false},{"type":"question","qid":"16593215","cat":"逻辑填空","stem":"许多自媒体采取“流量至上”的经营模式，为追求流量，可能并不会审查所推送的信息是否失真，但对于大量面临“信息茧房”障碍的读者来说，一般不会去思考和辨别言论的真伪，即便有疑虑也难以去辨别，所以，实践中            的情形较多。\n填入画横线部分最恰当的一项是：","options":{"A":"偏听偏信","B":"亦步亦趋","C":"人云亦云","D":"盲从盲信"},"answer":"D","explanation":"根据横线前“对于大量面临‘信息茧房’障碍的读者来说，一般不会去思考和辨别言论的真伪，即便有疑虑也难以去辨别”可知，横线处所填成语应体现对于自媒体推送的信息，读者一般不会去思考和辨别其真伪，而是盲目相信。D项“盲从盲信”意为盲目地相信，附合随从，符合文意，当选。\nA项“偏听偏信”意思是片面地听了一方面的话就信以为真，多指处理事情的态度不公正，与文意不符，排除；B项“亦步亦趋”比喻处处模仿、追随别人，与“言论”搭配不当，排除；C项“人云亦云”形容遇事无主见，顺随别人的意见，侧重从众，而文段侧重不辨真伪，不如D项更加契合文意，排除。\n故正确答案为D。\n【文段出处】长安理论《自媒体时代如何保障“自证清白”的权利》","no":14,"missingImage":false},{"type":"question","qid":"10204465","cat":"逻辑填空","stem":"人们往往对历经上百上千年的古董充满敬畏感，却鲜少给予我们父辈甚至我们自己手中诞生的文明产物以呵护。实际上，工业遗产不仅是几代人青春奋斗的地方，也记录着企业            的发展历程，更承载着中国制造由小到大、由弱变强的历史记忆。\n填入画横线部分最恰当的一项是：","options":{"A":"波澜壮阔","B":"岁月峥嵘","C":"难以忘怀","D":"不可磨灭"},"answer":"D","explanation":"搭配“企业”“发展历程”，根据“工业遗产不仅是······更承载着······历史记忆”可知，文段从个人、企业、中国制造三个维度阐述工业遗产的作用，即工业遗产能够留下记忆，故横线处所填成语应表达留下记忆之意，D项“不可磨灭”指功绩、印象等将始终保留在人们的记忆中，搭配恰当且符合文意，当选。A项“波澜壮阔”比喻声势雄壮或规模巨大，与文意不符，且用于形容企业的发展历程程度过重，排除；B项“岁月峥嵘”形容不平凡的年月，与文意不符，且“岁月峥嵘”通常不作为修饰语使用，排除；C项“难以忘怀”形容记忆深刻，不容易忘掉，侧重强调主观情感上的不能忘怀，而企业的发展历程是客观真实的存在，与文段语境不符，排除。\n故正确答案为D。\n【文段出处】中国经济网《工业遗产这座富矿，不仅属于当代》","no":15,"missingImage":false},{"type":"question","qid":"10204480","cat":"逻辑填空","stem":"中华民族追求疆域领土统一、推崇中央政府权威、注重文化共识        ，反对国家四分五裂、地方各自为政、价值观虚无混乱。尽管一些历史时期也曾出现过分裂局面，但统一始终是        。不论分裂的时间有多长、分裂的局面有多严重，最终都会重新走向统一。\n依次填入画横线部分最恰当的一项是：","options":{"A":"凝结 核心","B":"汇合 重心","C":"凝聚 主流","D":"汇聚 主题"},"answer":"C","explanation":"第一空，搭配“文化共识”，且根据相同句式表并列可知，横线处所填词语与“虚无混乱”意思相反，表达大家在文化层面形成共识，C项“凝聚”指气体变浓或凝结，也指聚集、积聚，搭配得当，且“凝聚共识”为常见搭配，保留。A项“凝结”指气体变成液体或液体变成固体的过程，也指聚集、积聚，常搭配“心血”“情感和智慧”“力量”等，与“共识”搭配不如“凝聚”恰当，排除；B项“汇合”指聚集、会合，D项“汇聚”指聚集在一起，均侧重多个主体从四面八方聚集到一起，与文意不符，且与“文化共识”搭配不当，排除。\n第二空，代入验证，根据“不论分裂的时间有多长······最终都会重新走向统一”可知，横线处所填词语应体现“分裂最终会统一”之意，C项“主流”指事物发展的主要方面，符合文意，当选。\n故正确答案为C。\n【文段出处】求是网《中华民族“大一统”理念的历史传承》","no":16,"missingImage":false},{"type":"question","qid":"10204469","cat":"逻辑填空","stem":"一些品牌随意挑选某个古代物件图样印在服饰上，再染上年画风格的配色，就为自己打出国潮的        。其实，这根本算不上真正意义的国潮，国潮不是简单的文化包装，而是传统文化与现代审美的深度        。\n依次填入画横线部分最恰当的一项是:","options":{"A":"名头 交汇","B":"标签 结合","C":"标记 融汇","D":"噱头 融合"},"answer":"D","explanation":"第一空，根据“随意挑选某个古代物件图样印在服饰上，再染上年画风格的配色”“这根本算不上真正意义的国潮”可知，横线处所填词语感情色彩偏消极，D项“噱头”指滑稽的话或举动，也指花招、手段，感情色彩偏消极，符合文意，保留。A项“名头”指名声、由头或名称，B项“标签”指贴在或系在物品上标明品名、用途、价格等的纸片，C项“标记”指记号，均为中性表达，与文段消极的感情色彩不符，排除。\n第二空，代入验证，根据“国潮不是简单的文化包装”可知，横线处词语应体现传统文化与现代审美交融之意，D项“融合”指几种不同的事物合成一体，符合文意，当选。\n故正确答案为D。\n【文段出处】光明网《国潮不是一种简单的文化包装》","no":17,"missingImage":false},{"type":"question","qid":"16593201","cat":"逻辑填空","stem":"近日，被称作“宝宝巴士”的新能源小车火出圈，与其说是可爱的形象俘获了大众的芳心，倒不如说是新的生活审美态度在这几年间        发生了转变，回归于事物的本质功能。人们日益发觉，简单、温暖地生活着，其实就是一种            的幸福。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蓦然 不可多得","B":"豁然 无可替代","C":"全然 难以名状","D":"悄然 弥足珍贵"},"answer":"D","explanation":"第一空，根据“新的生活审美态度在这几年间”以及“人们日益发觉，简单、温暖地生活着······的幸福”可知，横线处应体现大众的生活审美态度逐渐发生改变之意，D项“悄然”形容在进行某项活动或发生变化时寂静无声，符合文段语境，保留。A项“蓦然”指突然，猛然，B项“豁然”指一下子彻底晓悟，均与“这几年间”对应不恰当，文段强调的是逐渐发生变化之意，而非一下转变，均排除；C项“全然”指完全地，由“日益发觉”可知，人们并未完全转变态度，与文意不符，排除。\n第二空，代入验证，D项“弥足珍贵”指十分珍贵，与“幸福”搭配恰当，当选。\n故正确答案为D。\n【文段出处】《满大街的宝宝巴士，像极了朴实好用的我》","no":18,"missingImage":false},{"type":"question","qid":"10204492","cat":"逻辑填空","stem":"中国地理位置相对独立，南有热带丛林，西南有世界屋脊喜马拉雅山和青藏高原， 西有昆仑山、天山、阿尔泰山等高山和中亚沙漠，北有蒙古高原和戈壁荒滩，东方则面海。它们虽不能构成人类迁徙的绝对        ，但会给大规模人群的流动带来挑战，尤其在环境恶化时更是如此。在这样相对封闭的生态环境中，于气候适宜期迁徙至此的早期直立人生存繁衍，            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"隔断 代代相传","B":"阻碍 绵绵不绝","C":"障碍 开花结果","D":"屏障 开枝散叶"},"answer":"D","explanation":"第一空，根据“会给大规模人群的流动带来挑战”可知，横线处所填词语应体现这些地理因素不能完全阻挡人类迁徙之意，B项“阻碍”指起阻碍作用的事物，C项“障碍”指阻碍物，D项“屏障”指遮蔽、阻挡之物，均可体现阻挡之意，保留。A项“隔断”指专门作为分隔室内空间的立面，常用于分隔房屋及室内空间，与文意不符，排除。\n第二空，搭配“早期直立人”，且通过逗号与前文构成并列关系，故横线处所填成语应与“生存繁衍”构成近义并列，体现人逐渐增多或增广之意，D项“开枝散叶”多用来比喻人的生殖繁衍，传递祖先血脉，与文意相符，当选。B项“绵绵不绝”形容连续不断，多用于搭配“景象”“文化”等，与“早期直立人”搭配不当，排除；C项“开花结果”比喻工作、学习等有进展，并取得了成果，侧重强调结果，无法体现不断增多或增广之意，排除。\n故正确答案为D。\n【文段出处】人民网《探寻旧石器时代的中华文明根脉》","no":19,"missingImage":false},{"type":"question","qid":"16593183","cat":"逻辑填空","stem":"电影黄金档期票房以及年度总票房在整个经济总量中占比不高，但电影产业的经济影响            ，因为人们会通过这一数字，来        经济、社会的运转状况，尝试从中寻找规律、得到启发。\n依次填入画横线部分最恰当的一项是：","options":{"A":"毋庸置喙 分析","B":"不容小觑 管窥","C":"举足轻重 估量","D":"兹事体大 洞察"},"answer":"B","explanation":"第一空，形容“电影产业的经济影响”，根据横线前“但”表转折可知，应与前文“在整个经济总量中占比不高”意思相反，即表达“影响较大”之意。B项“不容小觑”指不能小看，不能轻视，C项“举足轻重”形容有实力，所处的地位很重要，一举一动都对全局有重大影响，均符合文意，保留。A项“毋庸置喙”指不用别人插嘴，不需要多话，与文意不符，排除；D项“兹事体大”指这件事的体制规模非常大，也指这件事关系重大，一般直接搭配某个事件本身，而非某事件产生的“影响”，排除。\n第二空，横线搭配“运转状况”，根据“通过这一数字······从中寻找规律、得到启发”可知，横线处需表示人们通过电影票房数字这一小部分可以知晓经济、社会运转这一整体情况之意。B项“管窥”指通过竹管子的孔看天，置于此处可表达从观察到的部分推测全貌之意，与文段中“这一数字”和“经济、社会的运转状况”部分和整体的关系对应准确，当选。C项“估量”指估计衡量，与“运转状况”搭配不当，且无法对应文中通过一小部分看出整体之意，与文意不符，排除。\n故正确答案为B。\n【文段出处】经济观察网《信心比“票房重回百亿”更重要》","no":20,"missingImage":false},{"type":"question","qid":"16593224","cat":"逻辑填空","stem":"中国的岁时节日既情意盎然又韵味绵长，以其深厚的旨趣，令人            ，堪称中国人的精神原乡。作为人类非物质文化遗产，如今的中国岁时节日，早已把中国与世界紧密地联系到一起，世界各地都有中国的节庆文化，华夏民族的古老智慧，在            中滋润着这个世界。\n依次填入画横线部分最恰当的一项是：","options":{"A":"心向往之  春风化雨","B":"心旌摇荡  继往开来","C":"心驰神往  历久弥新","D":"心旷神怡  经久不衰"},"answer":"C","explanation":"第一空，搭配“中国的岁时节日”，且根据前文“中国的岁时节日既情意盎然又韵味绵长，以其深厚的旨趣”可知，横线处所填成语应体现人们被中国的岁时节日所吸引之意，A项“心向往之”意为对某个人或事物心里很向往，C项“心驰神往”形容思想集中在追求和向往的事情或地方上，一心向往，均符合文意，保留。B项“心旌摇荡”形容面对自己想要或想得到的东西拿不定主意，犹豫不决，文中并无犹豫不决之意，与文意不符，排除；D项“心旷神怡”意为心情愉快，精神舒畅，常与“景色”等搭配，与“中国的岁时节日”搭配不当，排除。\n第二空，搭配“华夏民族的古老智慧”，且根据前文“如今的中国岁时节日······世界各地都有中国的节庆文化”可知，横线处所填成语应表达古老的中国文化在与世界的交流中不断发展之意，C项“历久弥新”形容经过长久的时间，（事物）不但没有衰败、陈旧，反而更新、更好，且“久”对应“古老智慧”，“新”对应“如今的中国岁时节日”，符合文意，当选。A项“春风化雨”指适宜草木生长的风雨，多用在人或事，比喻良好的熏陶和教育，与文意无关，排除。\n故正确答案为C。\n【文段出处】重庆日报《节日文化也是一种精神原乡》","no":21,"missingImage":false},{"type":"question","qid":"10204502","cat":"逻辑填空","stem":"近年来，以云计算、大数据、人工智能等技术引领的新一代数字化浪潮            。数字化转型按下“加速键”，数字技术应用深度和广度不断拓展，新技术新业态新模式            ，数字经济日渐成为继农业经济、工业经济之后的新兴经济形态。\n依次填入画横线部分最恰当的一项是:","options":{"A":"汹涌澎湃 此起彼伏","B":"浩浩荡荡 层出不穷","C":"波澜壮阔 生生不息","D":"气壮山河 方兴未艾"},"answer":"B","explanation":"第一空，搭配“浪潮”，且将数字化比喻为“浪潮”，A项“汹涌澎湃”，B项“浩浩荡荡”，C项“波澜壮阔”均与“浪潮”搭配恰当，且符合形象表达，保留。D项“气壮山河” 形容气势如高山大河般雄壮豪迈，与“浪潮”搭配不当，排除。\n第二空，搭配“新技术新业态新模式”，且根据前文“数字化转型按下‘加速键’，数字技术应用深度和广度不断拓展”可知，横线处所填成语应体现在数字化转型的背景下，新技术新业态新模式“不断出现”之意，B项“层出不穷”指接连不断地出现，没有穷尽，符合文意，当选。A项“此起彼伏”指这里起来，那里下去，形容接连不断，侧重高潮迭起，从未止息，与文意不符，排除；C项“生生不息”指不断地生长、繁殖，与“新技术新业态新模式”搭配不当，排除。\n故正确答案为B。\n【文段出处】《发展数字经济重在“以数促实”》","no":22,"missingImage":false},{"type":"question","qid":"16593207","cat":"逻辑填空","stem":"县域是连接农村和城市的重要        ，也是未来城镇化的重要载体。然而，虽然县域流动户籍限制取消，农民工落户意愿却并未显著        。究其原因，县域产业聚集力弱、公共服务滞后等因素，都影响了其落户意愿。因此，进一步提升县域农民工市民化质量，关键是        “稳定就业难、体面居住难、安心落户难”三大难题。\n依次填入画横线部分最恰当的一项是：","options":{"A":"纽带 增加 解决","B":"枢纽 增强 破解","C":"关节 加强 分解","D":"节点 上涨 解答"},"answer":"B","explanation":"本题可从第三空入手，横线处所填词语搭配“难题”，A项“解决”指处理使有结果，B项“破解”指解开、解决，均与“难题”搭配恰当，保留。C项“分解”指一个整体分成它的各个组成部分，与文意无关，排除；D项“解答”指解释回答，由文意可知，“稳定就业难、体面居住难、安心落户难”是民生问题，是政府需要从根本上解决的问题，而不能仅仅是解释回答， 故“解答”置于此处与文意不符，排除。\n第一空，由横线前的“重要”以及后文的“重要载体”可知，横线处所填词语意在表达县域在农村和城市之间起到了重要的连接作用，B项“枢纽”指事物相互联系的中心环节、事物的关键之处，符合文意，保留。A项“纽带”比喻起联系作用的人或事物，置于此处搭配得当，但仅能体现连接之意，无法突出县域的重要性，排除。\n第二空，代入验证，横线处所填词语搭配“意愿”，根据横线前关联词“却”可知，横线处与前文构成转折关系，应体现虽然县域流动户籍限制取消，但农民工落户意愿并未显著提升之意，B项“增强”指增进加强，与“意愿”搭配恰当且语义合适，当选。\n故正确答案为B。\n【文段出处】文摘报《加快提升县域农民工市民化质量》","no":23,"missingImage":false},{"type":"question","qid":"16593226","cat":"逻辑填空","stem":"正所谓沧海桑田，6000年前的撒哈拉可能并非大沙漠，而是一片大草原。19世纪中叶，德国探险家海因里希·巴特在        的撒哈拉沙漠中意外发现史前岩画，数10万幅精美的图像描绘着种族繁盛的大象、长颈鹿、河马和羚羊被猎人追捕的        场景，可以推想，史前人类        了撒哈拉由草原变成沙漠的过程。\n依次填入画横线部分最恰当的一项是：","options":{"A":"沉寂 神秘 见证","B":"干燥 震撼 记录","C":"荒凉 生动 经历","D":"广袤 壮观 目睹"},"answer":"C","explanation":"第一空，根据前文“沧海桑田”即世事变化巨大，以及后文“描绘着种族繁盛的······场景”可知，横线处应与后文“种族繁盛”语义相反，A项“沉寂”即十分寂静，听不见一丝声音，C项“荒凉”指人烟少，冷清，均符合文意，保留。B项“干燥”即没有水分或水分很少，D项“广袤”指辽阔无边，均无法与后文形成对应，排除。\n第二空，根据前文“种族繁盛的大象、长颈鹿、河马和羚羊被猎人追捕”可知，图像描绘的是较为形象的生活化场景，C项“生动”意为具有活力，能感动人，符合文意，保留。A项“神秘”意为使人摸不透，高深莫测，画像是具体的生活场景并不高深，与文意不符，排除。\n第三空，代入验证，C项“经历”指亲身见过、遇到过，与“过程”搭配恰当，当选。\n故正确答案为C。\n【文段出处】地球知识局《这片比印度还大的草原，变成了沙漠！》","no":24,"missingImage":false},{"type":"question","qid":"16593184","cat":"逻辑填空","stem":"阿尔茨海默病（AD）可能始于        症状出现前的几年甚至几十年，但是过去我们缺少被广泛        的方法，能在AD最早期将其识别出来，2023年公布的新版AD诊断标准修订草案，将血浆生物标志物        生物标志物分类，疾病诊断和分期等条目，早发现、早诊断、早治疗或不再是一句空话。\n依次填入画横线部分最恰当的一项是：","options":{"A":"明显 接受 纳入","B":"典型 运用 列入","C":"严重 普及 收入","D":"确切 认可 载入"},"answer":"A","explanation":"第一空，横线后出现转折关联词“但是”，转折后强调过去无法在AD最早期将其识别出来，转折前应表达AD在出现能够识别的症状前就已经产生了，故横线处应表达能够识别出来，即能看出来之意，A项“明显”指清楚地显露出来，容易让人看出或感觉到，与文意相符，保留。B项“典型”指具有代表性的人物或事件，侧重具有代表性，而非强调容易看出来，与文段对应不及A项恰当，排除；C项“严重”指程度深、影响大，D项“确切”指准确、恰当，均不强调能够看出来之意，与文意不符，排除。\n第二空，代入验证，A项“接受”指对事物容纳而不拒绝，置于文段可表达过去的方法没有被大家广泛认同，语义恰当，保留。\n第三空，代入验证，横线前搭配“生物学将标志物”，A项“纳入”指归入，置于此处，表示将血浆生物标志物归入到生物标志物分类和条目等范畴，当选。\n故正确答案为A。\n【文段出处】医学界《验血查阿尔茨海默病：早发现20年，能拦住痴呆吗？》","no":25,"missingImage":false},{"type":"question","qid":"10204503","cat":"逻辑填空","stem":"20世纪80年代，伴随乡村民俗及观念的日益        ，写实风格绘画也在快速地构建新的民间审美意趣，反映社会生活、农村新貌的作品取代原来的民俗题材成为年画主体，年画艺术与“年”的关系            ，木版年画的雕版套印技术，以及由此形成的传统审美趣味至此走到了        的边缘。\n依次填入画横线部分最恰当的一项是：","options":{"A":"弱化 形同陌路 式微","B":"淡化 渐行渐远 没落","C":"淡出 今非昔比 衰亡","D":"遗失 每况愈下 消弭"},"answer":"B","explanation":"第一空，搭配“乡村民俗及观念”，且根据横线后“反映社会生活、农村新貌的作品取代原来的民俗题材成为年画主体”可知，横线处所填词语应体现出乡村民俗及观念逐渐被遗忘和被取代的过程，A项“弱化”指逐渐衰弱，B项“淡化”指使（问题、情感等）逐渐冷淡下来，变得不被重视或无关紧要，均符合文意，保留。C项“淡出”比喻逐渐退出，从某地方不声张、轻轻离去，D项“遗失”指丢失，丢弃，均与“乡村民俗及观念”搭配不当，排除。\n第二空，搭配“年画艺术与‘年’”，且由前文可知，年画艺术不再以与年相关的传统民俗题材作为主体，横线处所填成语要体现出两者逐渐疏离之意，B项“渐行渐远”指不断地行走，分离得越来越远，符合文意，保留。A项“形同陌路”指本来很熟悉的朋友或别的人，因为一些事情而不再联系或交往，与“年画艺术与‘年’”搭配不当，排除。\n第三空，代入验证。由前文可知，“雕版套印技术”以及“由此形成的传统审美趣味”的发展情况并不乐观，B项“没落”指衰败，趋向灭亡，符合文意，当选。\n故正确答案为B。\n【文段出处】中国文化报《木版年画的文化内涵与时代延展》","no":26,"missingImage":false},{"type":"question","qid":"16593189","cat":"逻辑填空","stem":"蜱虫具有恐怖的吸血能力，它会找到皮肤上隐蔽的角落            地吸血好几天，人却无法察觉。这是因为蜱虫的唾液就像鸡尾酒一样，由各种蛋白质“        ”而成，其中一些让人不痛不痒，一些让血液不会凝固，还有一些保证不会        人的免疫系统。多种病原体便会趁机入侵人体。\n依次填入画横线部分最恰当的一项是：","options":{"A":"不声不响 搅拌 启动","B":"堂而皇之 调配 惊扰","C":"明目张胆 凝结 触发","D":"有恃无恐 混合 唤醒"},"answer":"B","explanation":"第一空，横线处应体现蜱虫吸血时的特点，且根据“人却无法察觉”可知，横线处与后文构成转折，体现蜱虫吸血时或可能光明正大之意。B项“堂而皇之”指公开或不加掩饰，C项“明目张胆”指公开地、无所顾忌地做坏事，D项“有恃无恐”指因有所依仗而不害怕，填入文段均可体现出蜱虫吸血时光明正大之意，符合文意，保留。A项“不声不响”指不说话、不出声，与后文“无法察觉”无法构成转折，排除。\n第二空，根据“这是因为蜱虫的唾液就像鸡尾酒一样”可知，横线处形容鸡尾酒的特点，B项“调配”指调制配比，符合鸡尾酒的特点且生动形象，D项“混合”指各种物品掺杂在一起，均符合文意，保留。C项“凝结”指由气体变成液体或由液体变成固体，与“鸡尾酒”无法对应，排除。\n第三空，根据“多种病原体便会趁机入侵人体”可知，横线处体现蜱虫不会使免疫系统发生反应之意，B项“惊扰”指惊动扰乱，符合文意，当选。D项“唤醒”指从沉睡状态叫醒，文段并无人体免疫系统原本在沉睡之意，排除。\n故正确答案为B。\n【文段出处】环球科学《你可能已被这种昆虫吸血数天，感染了数种危险病原体，但毫无知觉》","no":27,"missingImage":false},{"type":"question","qid":"16593186","cat":"逻辑填空","stem":"一款零食以前能靠独特口味畅销十几年，这在今天几乎是天方夜谭。新爆款横空出世，模仿者很快            ，消费者的新鲜感被迅速透支。当朝生暮死成为网红食品的常态，相比于            的零食巨头，轻资产的中小品牌反而更容易在时代变幻莫测的风向中            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蜂拥而至 尾大不掉 闪转腾挪","B":"后来居上 作茧自缚 捷足先登","C":"青出于蓝 因循守旧 稳操胜券","D":"龙争虎斗 老气横秋 脱颖而出"},"answer":"A","explanation":"第一空，搭配主语“模仿者”，根据“新鲜感被迅速透支”可知，横线处意在指出模仿者很快进行模仿，出现很多相似的产品，A项“蜂拥而至”意思是像一窝蜂似地拥来，形容很多人乱哄哄地朝一个地方聚拢，符合文意，保留。B项“后来居上”比喻后来的人和事，进步很快，赶上或超过了先前的，文段没有指出模仿者“超越了”先前的，且如果是超越前人的积极语义，就不会有后文“新鲜感被迅速透支”的不良后果，排除；C项“青出于蓝”比喻学生超过老师或后人胜过前人，感情色彩不符，排除；D项“龙争虎斗”比喻大家都在争斗，场面激烈，侧重“争斗”，文段强调人们纷纷模仿，并未强调“争斗”，排除。\n第二空、第三空，代入验证，文段中“零食巨头”与“中小品牌”构成对比，A项“尾大不掉”比喻部下势力太大，不易指挥调度，突出零食巨头存在不易调度、不够灵活的问题；“闪转腾挪”指在困境中快速转移、灵活应对的能力，突出中小品牌轻资产的优势，均符合语境，当选。\n故正确答案为A。\n【文段出处】《90后的童年零食，没人愿意吃了》","no":28,"missingImage":false},{"type":"question","qid":"16593202","cat":"片段阅读","stem":"数字媒介是现代文明尤其是科学技术文明的最新成果，它本身就是现代文明的一部分，在数字媒介上人们不断创造新的文化样态，传承并创新传统文化形式；文明交流过程中的文化遗产、思想观念、文化艺术等内容都可以被数字化，交流过程也被存储于云端，时间与空间问题不再制约文明交流，能否数字化则是影响文明交流互鉴的关键；文明交流主体间的关系是多向度的，既是现实的交往也是虚拟的交往，既是在场的交往又是离身的交往，文化族群之间的交往更加频繁。\n这段文字意在强调：","options":{"A":"文化交流途径依赖数字化传播","B":"数字技术不断创造文明新样式","C":"数字化的交流不再受时空限制","D":"数字媒介多维度影响文明交流"},"answer":"D","explanation":"文段开篇引出“数字媒介”的话题，并指出人们可以在数字媒介上传承并创新传统文化形式，之后引出“文明交流”的话题，指出文明交流的内容及过程被存储于云端，数字化使文明交流不再受时间与空间的制约，之后通过“关键”强调数字化对文明交流的影响重大，接着后文进行详细解释说明。故文段强调“数字媒介”对“文明交流”的重要影响，对应D项。\nA项，缺少主题词“数字媒介”，偏离文段核心话题，排除；\nB、C两项，均缺少主题词“文明交流”，偏离文段核心话题，排除。\n故正确答案为D。\n【文段出处】中国社会科学网《涂凌波：数字时代的世界交往与文明交流新图景》","no":29,"missingImage":false},{"type":"question","qid":"16593187","cat":"片段阅读","stem":"科创企业往往轻资产、高风险，缺乏担保资金和抵质押物，与银行传统的信贷模式不匹配。科创企业在发展过程中还存在研发资金投入大、技术转化周期长等问题。当前，大多数银行的科创金融产品依赖于传统信贷模式，对于大量科技创新企业信贷融资存在不敢贷、不愿贷的情况。实践中，金融机构对于企业知识产权质押融资的应用依然存在一定阻碍，现有产品仍以短期为主，缺乏针对科创企业的中长期贷款产品。\n这段文字意在强调：","options":{"A":"科创企业的贷款不足","B":"科创企业创业风险高","C":"缺少适合科创企业的金融产品","D":"金融机构对科创企业信心不足"},"answer":"C","explanation":"文段开篇介绍科创企业与银行传统的信贷模式不匹配的现状，接着介绍科创企业发展面临的问题，而后指出当前大多数银行的金融产品无法满足科创企业的信贷融资需求，尾句从金融机构角度论述实践中缺少针对科创企业的中长期贷款产品，故文段重点强调目前银行和金融机构所提供的金融产品难以满足科创企业的融资需要，对应C项。\nA项，文段强调缺少能够适应科创企业需要的金融产品，“贷款不足”偏离核心话题，排除；\nB项，“创业风险高”对应文段首句介绍的科创企业现状，非重点，且表述片面，排除；\nD项，“信心不足”对应银行金融产品无法满足科创企业需要的部分原因，表述片面，排除。\n故正确答案为C。\n【文段出处】《金观平：协同发力破解科技企业融资难》","no":30,"missingImage":false},{"type":"question","qid":"16593196","cat":"片段阅读","stem":"人类特别喜欢读到和关注有关他人和社会的负面信息，媒体从业者则是顺应这种喜好，这使人们接触到更多的负面信息而非正面信息。这种“有偏见的暴露效应”解释了为什么人们认为当前的道德水平相对较低。而当人们回忆过去时，负面事件更可能被遗忘，这是由于大脑的内在机制要求不良事件引起的负面反应情绪必须被平复，因此时过境迁，再大的悲剧也可以慢慢放下。这种“有偏见的记忆效应”又解释了为什么人们认为过去的道德水平相对较高。\n这段文字意在说明：","options":{"A":"“世风日下”可能是一种群体心理错觉","B":"心理层面人们更愿记住过去美好的事件","C":"道德水平的高低取决于负面事件的影响","D":"媒体传播强化了人们对负面信息的接收"},"answer":"A","explanation":"文段开篇指出人类有关注他人和社会负面信息的喜好，媒体则顺应这种喜好导致人们接触到更多的负面信息，这种“有偏见的暴露效应”解释了人们认为当前道德水平低的原因，随后指出当人们回忆过去时负面事件更可能被遗忘，这种“有偏见的记忆效应”解释了人们认为过去道德水平较高的原因，故文段通过 “有偏见的暴露效应”以及“有偏见的记忆效应”两种心理学机制，解释了为什么人们认为当前道德水平低而过去道德水平高。而这两种心理学机制都是带有偏见的，因此最终得出的结论也并不令人信服，对应A项。\nB项，“人们更愿记住过去美好的事件”对应并列后“有偏见的记忆效应”的内容，表述片面，排除；\nC项，“道德水平的高低”说法错误，文段道德水平的高低只是人们的主观认知，而非客观事实，排除；\nD项，“媒体传播”对应首句的部分内容，表述片面且非重点，排除。\n故正确答案为A。\n【文段出处】《世风日下人心不古？这可能只是一种群体心理幻觉》","no":31,"missingImage":false},{"type":"question","qid":"10204504","cat":"片段阅读","stem":"关于文艺与时代的关系，中外许多文艺家都有精辟论述。如唐代诗人白居易所言“文章合为时而著，歌诗合为事而作”，法国作家巴尔扎克说自己愿意充当“法国社会的书记员”，“活在民族之中的大诗人，就应该总括这些民族的思想，一言以蔽之，就应该成为他们的时代化身才是”，俄国批评家车尔尼雪夫斯基也曾说过，“只有那些在强大而蓬勃的思想影响之下，只有能够满足时代迫切要求的文学倾向，才能得到灿烂的发展”，等等。这些都说明文艺既要反映时代的现实，又要超越时代的现实。今天，我们迎来一个伟大的变革时代，我们文艺工作者应正确认识文艺与时代的关系，在实践中丰富和完善艺术理想，积极响应“为时代画像、为时代立传、为时代明德”的号召，拿出更多艺术精品献给人民和这个伟大的时代。\n这段文字意在说明：","options":{"A":"文艺创作绝不能脱离当下时代的社会现实","B":"时代需要更多反映社会发展趋势的好作品","C":"艺术家要在实践中不断丰富发展文艺理论","D":"文艺既要反映时代现实又要超越时代现实"},"answer":"D","explanation":"文段开篇指出文艺与时代的关系许多文艺家都有论述，接着进行举例，后文通过指代词“这些”对前文进行总结，点明文艺与时代的关系，即文艺要反映时代现实，又要超越时代现实。最后进行进一步解释说明，指出文艺工作者应正确认识文艺和时代的关系。故文段论述的核心话题为“文艺”与“时代现实”，强调文艺要反映时代现实并超越时代现实，对应D项。\nA项，“不能脱离当下时代的社会现实”表述不明确，文段已明确指出文艺要反映时代现实并超越时代现实，排除；\nB项，缺少“文艺”这一主题词，偏离文段中心，排除；\nC项，缺少“时代现实”这一主题词，偏离文段中心，排除。\n故正确答案为D。\n【文段出处】人民日报《交出我们时代的文艺答卷》","no":32,"missingImage":false},{"type":"question","qid":"10204479","cat":"片段阅读","stem":"竹秆质地坚硬，其堪与木材媲美的木质特性，来自于初生结构中发达的机械组织和细胞壁木质化的基本组织；木材的木质特性，则来自于年轮式样分布的次生木质部。竹秆外形与其他禾本科草本植物的茎相似，具有明显的节和节间，节数和粗细在出笋时就已基本固定；节附近分布有居间分生组织，节间伸长时，各节分生组织同时活动，竹子迅速拔高；缺少形成层，不能长粗，只能保持“婴儿时期的身材”。竹壁分为竹青、竹肉、竹黄三个部分，竹青含叶绿素呈绿色，可以进行光合作用。\n根据这段文字，下列说法错误的是：","options":{"A":"竹秆只能长高不能长粗","B":"竹子能够进行光合作用","C":"竹秆的节数在出笋时就已基本固定","D":"竹子的木质特性来自于次生木质部"},"answer":"D","explanation":"A项，根据“节附近分布有居间分生组织，节间伸长时，各节分生组织同时活动，竹子迅速拔高；缺少形成层，不能长粗，只能保持‘婴儿时期的身材’ ”可知，竹秆只能长高不能长粗，表述正确，排除；\nB项，根据“竹壁分为竹青、竹肉、竹黄三个部分，竹青含叶绿素呈绿色，可以进行光合作用”可知，竹子可以通过竹青进行光合作用，表述正确，排除；\nC项，根据“竹秆外形与其他禾本科草本植物的茎相似，具有明显的节和节间，节数和粗细在出笋时就已基本固定”可知，表述正确，排除；\nD项，根据“竹秆质地坚硬，其堪与木材媲美的木质特性，来自于初生结构中发达的机械组织和细胞壁木质化的基本组织；木材的木质特性，则来自于年轮式样分布的次生木质部”可知，竹秆的木质特性来自于初生结构中发达的机械组织和细胞壁木质化的基本组织，木材的木质特性来自于次生木质部，并不是竹子，偷换概念，当选。\n本题为选非题，故正确答案为D。\n【文段出处】人民网《竹子是草还是树？（把自然讲给你听）》","no":33,"missingImage":false},{"type":"question","qid":"10204494","cat":"片段阅读","stem":"文言和白话是两个相互依存的概念，无文言，也就无所谓白话，但它们并不等同于书面语和口语。受限于语言保存技术，我们现在能感知的古代汉语都是书面上的，包括文言，也包括白话。文言是在先秦口语的基础上形成的古代汉语书面语。先秦两汉的典籍、六朝以后文人仿古写出的作品都属于文言文。 白话是汉魏六朝以后，随着语言发展变化而形成的较为接近口语的言语，偶尔也夹杂一些文言成分，较能反映语言的时代性和区域性特点。\n根据这段文字，下列说法正确的是：","options":{"A":"汉魏六朝以后的作品都属于白话文","B":"古代汉语实际上包含白话文的成分","C":"文言文更能反映语言的时代性特点","D":"文言与白话分别等同书面语与口语"},"answer":"B","explanation":"A项，根据“六朝以后文人仿古写出的作品都属于文言文”及“白话是汉魏六朝以后，随着语言发展变化而形成的较为接近口语的言语，偶尔也夹杂一些文言成分”可知，选项表述错误，排除；\nB项，根据“受限于语言保存技术，我们现在能感知的古代汉语都是书面上的，包括文言，也包括白话”可知，古代汉语确实包含白话文，选项表述正确，当选；\nC项，根据“白话是汉魏六朝以后······偶尔也夹杂一些文言成分，较能反映语言的时代性和区域性特点”可知，选项中“文言文更能反映······特点”属于无关对比，排除；\nD项，根据“文言和白话是两个相互依存的概念，无文言，也就无所谓白话，但它们并不等同于书面语和口语”可知，选项表述与文意相悖，排除。\n故正确答案为B。\n【文段出处】《书面语与口语的源与流——文与言判雅俗殊形》","no":34,"missingImage":false},{"type":"question","qid":"16593199","cat":"片段阅读","stem":"很多手工艺材料是因其所成之物原本的功能在现代社会中弱化或消失，才造成选材方向的改变，由此，治物不再依据客观需求，而是更多地转向主观的、表达个性的艺术创作。例如，古人对砚材评介的首要标准是适于研墨而非为雕刻观玩，于墨材而言，首要则是适于书写而非为模印赏鉴。回溯历史，由古人之物及用物文化可见，传统手工艺的发展是不断发现和使用合用的材料治物以为人服务，而不是仅仅围绕某种物质存在的技术活动。\n关于手工艺材料，文段中传统观点认为：","options":{"A":"选材应趋向多元化","B":"发掘材质本身之美","C":"材料之美源于适用","D":"治物基于艺术表现"},"answer":"C","explanation":"文段开篇指出随着社会的发展手工艺材料的选材发生了改变，治物由传统的依据客观需求转向了主观艺术创作，并以“砚材”和“墨材”为例，指出古人对手工艺材料的首要要求是“适用”，随后指出从古人的物品和用物文化可以看出，传统手工艺的发展目标是适合人使用，而不是仅仅围绕某种物质存在的技术活动。故文段中所介绍的传统观点认为手工艺材料关键是要适用，对应C项。\nA项“选材多元化”、B项“发掘材质之美”和D项“基于艺术表现”，均未体现出手工艺材料的适用性，与文段观点不符，排除。\n故正确答案为C。\n【文段出处】“中国非物质文化遗产”微信公众号《吴南：透过物质看“非遗”——中国传统手工艺的材料观》","no":35,"missingImage":false},{"type":"question","qid":"10204505","cat":"片段阅读","stem":"我国平台经济具有较好的数据贯通能力和智能分析能力，能够更好地帮助实体经济升级营销模式，提升管理决策效率和营销系统化能力，还可以利用平台应用的能力，提升实体经济中的产业链协同协作效应。因此，政府应积极地引导、支持消费互联网平台转型发展，对平台企业在新技术、新业态等方面的探索和投资布局给予更大的包容与支持，发挥平台优势助力构建我国自主可控的产业生态，在上下游联动、数实融合中创新孵化。\n根据这段文字，我国平台经济需向哪个方向引导？","options":{"A":"提升管理能力","B":"助力产业协同","C":"赋能实体经济","D":"孵化创新产业"},"answer":"C","explanation":"文段开篇指出我国平台经济具有较好的数据贯通能力和智能分析能力，能够帮助实体经济升级营销模式，提升管理决策效率和营销系统化能力。随后通过“还”引导并列，指出平台经济还可利用其应用能力，提升实体经济中的产业链协同协作效应。最后通过“因此”进行总结，指出想要发挥平台经济的作用，政府应采取措施助力数实融合，即数字技术和实体经济深度融合。故文段为分总结构，重点论述平台经济对实体经济的作用，强调我国平台经济需向实体经济方向引导，对应C项。\nA项“提升管理能力”对应“提升管理决策效率”、B项“助力产业协同”对应“提升实体经济中的产业链协同协作效应”，均表述片面，且未提及文段主题词“实体经济”，排除；\nD项，“孵化创新产业”表述不明确，文段强调的是“在数实融合中创新孵化”，该项未提及“实体”，排除。 \n故正确答案为C。\n【文段出处】北京日报《引导平台经济健康持续发展》","no":36,"missingImage":false},{"type":"question","qid":"16593225","cat":"片段阅读","stem":"“中华”一词始于胡汉的区分，却终于胡汉的融合。所以产生这样的结果，根本原因在于“中华”一词并不是一个狭义的“汉人”概念，而是一个较宽泛的文化概念，既不对胡族设限，胡族对其也无明显的抵触与排斥。特别是“中华”之“华”所具有的以“衣冠礼乐”来喻指文化的象征意义，给“中华”这一概念带来了极大的包容度。入唐以后，“中华”一词作为唐朝别称与中国名号被广泛使用的事实，清楚地告诉我们，“中华”概念的实质是“华夷融合”。从很大意义上说，这正是后来历史发展中被“中华”所称谓的人们共同体得以不断扩大的原因。\n根据这段文字，“中华”一词的特点是：","options":{"A":"文化性","B":"历时性","C":"模糊性","D":"开放性"},"answer":"D","explanation":"文段围绕“中华”一词展开论述。首先通过转折指出“中华”一词终于胡汉的融合，紧接着分析其产生的原因，即“中华”一词本身就是一个较宽泛的文化概念，具有极大的包容度，随后又介绍入唐以后“中华”概念的实质是“华夷融合”。最后通过“从很大意义上说”再次强调“中华”的包容度和融合性使得被“中华”所称谓的人们共同体不断扩大。由此可知，文段强调“中华”一词的特点即是包容、融合，对应D项“开放性”。\nA项“文化性”、B项“历时性”、C项“模糊性”均与“包容、融合”的特点无关，排除。\n故正确答案为D。\n【文段出处】清华大学学报 2022年第4期 《东晋南北朝至隋唐胡汉融合与“中华”词义嬗变》","no":37,"missingImage":false},{"type":"question","qid":"16593214","cat":"片段阅读","stem":"在真空蒸发器内，卤水在外来蒸汽的作用下加热沸腾，水分的蒸发使卤水得到浓缩，卤水蒸发出的二次蒸汽温度低于外来输入蒸汽的温度，但仍然携带较多热量，二次蒸汽中的热量会被输入到下一级蒸发器中，二次蒸汽的温度相对较低，为了有效利用其中的热量，此时会降低蒸发器中的压力，水的沸点会随之降低，卤水会在更低的温度下沸腾，其产生的蒸汽又能够被用于气压更低的下一级蒸发器中。如此，通过多个蒸发器联用，不断回收蒸汽来进行加热，可以大大节省蒸汽的消耗量。\n根据这段文字，为了节省蒸汽消耗量需采取的措施是：","options":{"A":"降低卤水的浓度","B":"提高蒸汽的温度","C":"降低蒸发器中气压","D":"增加蒸发器的数量"},"answer":"C","explanation":"文段首先介绍了在真空蒸发器内，卤水在外来蒸汽的作用下加热沸腾，接着指出卤水蒸发出的二次蒸汽仍然携带较多热量，可通过降低蒸发器中的压力，让水的沸点随之降低，从而使得卤水在更低的温度下再次沸腾，进而达到节省蒸汽消耗量的目的，即外来蒸汽—卤水加热沸腾—二次蒸汽（卤水）—降低压力—水沸点降低—卤水再次沸腾，故节省蒸汽消耗量的举措为“降低蒸发器中的压力”，对应C项。\nA项，根据“在真空蒸发器内，卤水在外来蒸汽的作用下加热沸腾，水分的蒸发使卤水得到浓缩······”可知，降低卤水浓度的做法与节省蒸汽消耗量的举措无关，排除；\nB项，“提高蒸汽温度”的做法文段并未提及，无中生有，排除；\nD项，根据“如此，通过多个蒸发器联用，不断回收蒸汽来进行加热，可以大大节省蒸汽的消耗量”可知，为了节省蒸汽消耗量，主要是通过降低蒸发器当中的气压，再将多个蒸发器联用，使得蒸汽不断被回收，而非增加蒸发器的数量，排除。\n故正确答案为C。\n【文段出处】科技日报《陶瓷膜过滤、多效真空蒸发······小盐粒蕴含大科技》","no":38,"missingImage":false},{"type":"question","qid":"16593193","cat":"片段阅读","stem":"发展现代设施农业是转变农业发展方式的重要内容。相较于传统农业，现代设施农业把保护环境、低碳节能作为发展的前提条件，按照循环发展理念，通过运用人工智能技术、物联网技术等，不仅可以节约大量水资源、土地资源和人力资源，还能有效降低污染物的排放量，减少资源浪费和环境污染。此外，现代设施农业使用高科技技术和先进设备，通过农业生产标准化、精准化、智能化，让土地利用率、劳动产出率更高，资源能耗、生产成本更低，产品更有品质、生态更加安全，助力农业增效和农民增收。\n关于现代设施农业，这段文字未提及：","options":{"A":"推动传统农业向现代农业转型升级","B":"减少资源消耗将促进农民收入增长","C":"有效降低环境污染有利于保护环境","D":"运用人工智能实现农业无人化生产"},"answer":"D","explanation":"A项，根据“发展现代设施农业是转变农业发展方式的重要内容。相较于传统农业······”可知，发展现代设施农业可以推动农业由传统农业转变为现代农业，文段已提及，排除；\nB项，根据“此外，现代设施农业······资源能耗、生产成本更低，产品更有品质、生态更加安全，助力农业增效和农民增收”可知，文段已提及，排除；\nC项，根据“相较于传统农业，现代设施农业······不仅可以节约大量水资源、土地资源和人力资源，还能有效降低污染物的排放量，减少资源浪费和环境污染”可知，文段已提及，排除；\nD项，“实现农业无人化生产”文段并未提及，当选。\n本题为选非题，故正确答案为D。\n【文段出处】光明日报《用现代设施打造富农强农新引擎》","no":39,"missingImage":false},{"type":"question","qid":"16593212","cat":"语句表达","stem":"在确定是否认识一个人时，我们的大脑会做出三个反应。首先，我们会确认这个人的面部特征，例如他是双眼皮还是单眼皮，高鼻梁还是薄嘴唇；之后，大脑根据这些特征进行人脸识别，判定我们是否认得这张脸；最后再回忆他的名字。简而言之，我们在看到一张脸后，大脑只需简单地识别是否见过；而人的名字藏在记忆的某个角落，我们需要通过检索、回忆等过程，才能最终确定答案，比识别更加复杂。所以                    。\n填入画横线部分最合适的一项是：","options":{"A":"大脑确定是否认识一个人的过程非常地复杂","B":"记住一个人的名字比记住他的长相要难得多","C":"大脑根据一个人的面部特征来回忆他的名字","D":"记忆名字需要与对词语、句子的记忆相联系"},"answer":"B","explanation":"横线位于文段结尾，且横线前出现“所以”，所填句子应对前文内容进行总结。文段开篇指出，我们确定是否认识一个人时，大脑会有三个反应，接下来通过“首先”“之后”和“最后”对三个反应进行具体解释说明。随后通过“简而言之”进行总结，并通过“；”引导并列，指出我们看到一张脸时，大脑是简单识别，而人的名字需要检索、回忆等复杂过程。故横线处所填句子应对“记住名字”和“识别长相”之间的难度对比进行总结，即记住名字比记住长相更复杂、更难，对应B项。\nA项，“是否认识一个人”对应文段首句内容，与“简而言之”总结后论述的话题无法衔接，排除；\nC项，“根据一个人的面部特征来回忆他的名字”前文并未论述，无法衔接，排除；\nD项，“与对词语、句子的记忆相联系”文段并未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】今日文摘《名字和脸，哪个更好记》","no":40,"missingImage":false},{"type":"question","qid":"16593219","cat":"语句表达","stem":"众多民间手艺、戏曲等非物质文化遗产的遗失，与文化传承人缺乏丰厚的收入有关。即便以外部力量进行保护性抢救，往往也只是将其“标本化”，难以恢复其原生活力。                    。比如，《中国通史》等纪录片在视频平台上收费观看，使传统文化释放出可观的商业价值，纪录片创作方、版权方、播出方实现商业共赢；有花丝镶嵌技艺非遗传承人入驻电商平台，一年多来售出超20万件工艺产品。\n填入画横线部分最恰当的一项是：","options":{"A":"文化产业在新的发展能量集聚下将释放出更多精彩","B":"正是对传统文化的创新演绎成就了文化产业的发展","C":"只有新媒体技术的加持，才能推动传统文化的传播","D":"只有文化消费市场活跃，传统文化创作才能有动力"},"answer":"D","explanation":"横线出现在文段中间，需结合前后文内容进行分析。文段开篇指出部分非物质文化遗产的遗失与文化传承人缺乏丰厚的收入有关，接着指出通过外部力量难以恢复其原生活力。横线后通过“比如”进行举例论证，分别以“《中国通史》”“花丝镶嵌技艺”为例，论证“收费观看”“释放商业价值”“实现商业共赢”“入驻电商平台”等一系列举措对于拯救非遗起到的重要作用。故前后文围绕“收入”“收费”“经济价值”进行论述，此类话题均可体现出经济效益的含义，故横线处所填内容需包含核心话题“经济效益”，对应D项“文化消费市场活跃”，且“只有······才······”的句式也体现出文化消费市场的活跃对于拯救非遗至关重要，与前后文衔接恰当。\nA项“新的发展能量”、B项“创新演绎”、C项“新媒体技术”均与“收入”“经济效益”等核心话题无关，排除。\n故正确答案为D。\n【文段出处】光明日报《用数字技术为优秀传统文化赋新能》","no":41,"missingImage":false},{"type":"question","qid":"10204464","cat":"片段阅读","stem":"随着大数据、物联网、云计算等现代智能技术的发展，人类社会进入了智慧治理时代。智慧治理对于推进国家治理体系和治理能力现代化具有重要现实意义。当前正在推进的智慧治理面临治理效率低下、数据信息安全存隐患等困境和风险。对智慧治理面临新任务新期待的理论认识不足、主动适应不够，以及过度依赖智能技术对智慧治理的定位不准是导致困境和风险的重要原因。解决智慧治理中存在的问题，需要实现从智能技术赋能到技术融合的转变，理念融合、过程融合及目标融合是实现这一转变的重要路径。\n假如这是一篇文章的摘要，那么这篇文章的标题可能是：","options":{"A":"迈向技术融合的智慧治理","B":"理论认识不足制约智慧治理","C":"智能技术赋能的智慧治理路径","D":"智慧治理存在的问题及成因分析"},"answer":"A","explanation":"本题为标题填入题，需要把握文段中心。文段开篇交代背景，介绍人类社会进入了智慧治理时代。接着引出智慧治理具有重要现实意义。随后，文段具体介绍了智慧治理存在的一些问题并分析原因。文段最后通过“需要”提出对策，强调从智能技术赋能到技术融合的转变可以解决智慧治理中存在的问题。故文段重在强调智慧治理中的问题需要通过技术融合来解决，对应A项。\nB项，“制约智慧治理”为问题表述，非重点，排除；\nC项，“治理路径”表述不明确，且“智能技术赋能”为文段非重点内容，文段重点强调的对策为“技术融合”，排除；\nD项，“问题及成因分析”为对策前内容，非重点，排除。\n故正确答案为A。\n【文段出处】中文期刊-掌桥科研《迈向技术融合的智慧治理》","no":42,"missingImage":false},{"type":"question","qid":"16593195","cat":"片段阅读","stem":"开发前沿技术应用场景的实践价值在于，通过将前沿技术落地转化为生产力。高技能人才的可贵之处不在于突破核心技术，而在于为产业痛点、难点问题找到核心技术的最佳实践运用场景。例如，将智能技术引入水、电、煤等公用事业领域，但不同行业在应用场景选择上存在差异，电力企业重点推进智能电网建设，燃气行业的建设重点是智能表具系统······这些前沿技术的应用场景不是原始创新，而是技术的跨界融合，需要一线技术人员基于行业特点寻找适合的前沿技术实现赋能和融合。\n最适合做这段文字标题的是：","options":{"A":"智能技术的开发与利用具有行业选择性","B":"技术落地的基础——突破创新，跨界融合","C":"找准问题——开发前沿技术应用场景的核心","D":"高技能人才——前沿技术应用落地的“嫁接者”"},"answer":"D","explanation":"文段开篇介绍了将前沿技术落地转化为生产力是开发前沿技术应用场景的实践价值，接着引出“高技能人才”这一话题，并提出观点，强调其重要作用在于能将核心技术应用于产业问题的解决，使这些核心技术得以转化为生产力。后文通过“例如”列举了智能技术在水、电、煤等公用事业领域应用的例子，表示其在不同行业的应用具有差异性，随后指出这些前沿技术的应用场景需要一线技术人员来实现赋能和融合，对前文观点进行论证。故文段重点论述高技能人才在前沿技术应用落地中的融合作用，对应D项，“高技能人才”为文段核心话题，“嫁接者”可体现将技术融合之意。\nA项，缺少文段主题词“高技能人才”，且“行业选择性”仅能对应举例说明的内容，非重点，排除；\nB项，缺少文段主题词“高技能人才”，且“技术落地的基础”文段并未提及，无中生有，排除；\nC项，缺少文段主题词“高技能人才”，且“开发前沿技术应用场景的核心”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】工人日报 《技术赋能、跨界融合：新时代大国工匠的技能新特质》","no":43,"missingImage":false},{"type":"question","qid":"10204466","cat":"语句表达","stem":"①他们认为成绩不好是老师和父母的责任，遇事不愿主动解决而是更多地选择抱怨\n②究其原因，就是孩子和家长有效沟通后，孩子能明白自己的行为会导致什么样的后果\n③有研究显示，规则有助于孩子的健康发展\n④那些家里规则清楚、始终保持一致且合理可执行的孩子，对自己的学习能力更有信心，成绩也较为优秀\n⑤而那些生活在规则意识不清且标准不稳定的、父母情绪易怒、高控制感、指责型家庭的孩子，更加自卑胆小\n⑥这样有助于他们学会调整自己的行为并给自己制定目标\n将以上六个句子重新排列，语序正确的一项是：","options":{"A":"④②⑥⑤①③","B":"③④⑥②①⑤","C":"③②⑥④①⑤","D":"③④②⑥⑤①"},"answer":"D","explanation":"对比选项，确定首句。④句指出家里规则清楚的孩子在学习方面具有优势，③句指出规则有助于孩子的发展，根据逻辑顺序，应先引出话题，再论述这一话题的具体作用，故③句应在④句之前，排除A项，保留B、C、D三项。\n继续分析所给语句，①句出现指代词“他们”，强调这部分人认为成绩不好是老师和父母的责任，这部分人身上存在消极表现。结合选项分析，①句前分别为②④⑤三句。⑤句说明生活在规则意识不清的家庭的孩子更加自卑胆小，可与①句构成指代词捆绑，D项当选。②句指出孩子与家长沟通的积极影响，④句论述家里规则清楚的孩子的优秀表现，均无法与①句构成指代词捆绑，排除B、C两项。\n故正确答案为D。\n【文段出处】光明网《亲子对话：从操控指责到信息引导》","no":44,"missingImage":false},{"type":"question","qid":"10204476","cat":"语句表达","stem":"①它们不仅记录了长江历年的水文资料，而且具有很高的文学艺术价值\n②为配合三峡水库的建设，我国水下考古工作者已分别对白鹤梁、龙脊石进行了水下调查\n③因长江水位变迁，“丰年碑”已完全没于水下不得见\n④位于重庆朝天门码头的“丰年碑”、涪陵白鹤梁历代题刻、云阳龙脊石题刻被称为长江中游的三大石刻碑群\n⑤白鹤梁题刻保存完好，被誉为世界“第一古代水文站”和世界罕见的“水下碑林”，是长江三峡水库淹没区内最早被定为“全国重点文物保护单位”的遗址\n⑥在水下考古调查研究基础上设计建造的白鹤梁水下博物馆，独具中国特色，成为联合国教科文组织面向全球推广的经典案例\n将以上6句重新排列，语序正确的是：","options":{"A":"④③⑤②⑥①","B":"④①③②⑤⑥","C":"⑤③②⑥④①","D":"⑤④③①②⑥"},"answer":"B","explanation":"对比选项，确定首句。首句分别为④句和⑤句，④句指出“‘丰年碑’、涪陵白鹤梁历代题刻、云阳龙脊石题刻被称为长江中游的三大石刻碑群”，⑤句具体论述“白鹤梁题刻”，按照行文逻辑，应先引出“三大石刻碑群”这一话题，然后再针对其中之一的白鹤梁题刻展开论述，故④句应在⑤句之前，④句更适合作首句，排除C、D两项。\n继续观察文段，①句出现指代词“它们”，应指代多个对象，对比A、B两项，①句前分别是④句和⑥句，④句引出“三大石刻碑群”这一话题，可作为①句“它们”的指代对象，故④①两句可以构成捆绑，B项当选。⑥句介绍了“白鹤梁水下博物馆”的情况，只出现一个对象，与①句无法构成捆绑，排除A项。\n故正确答案为B。\n【文段出处】光明日报《发展中的中国水下考古》","no":45,"missingImage":false}],"count":35,"answerable":35,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"10204486","cat":"数学运算","stem":"甲、乙两工厂共同完成某个生产订单需要12天。现两工厂共同生产8天后，再由乙单独生产7天，一共完成了订单总量的90%。若整个订单由乙单独生产，那么需要多少天完成？","options":{"A":"20","B":"23","C":"26","D":"30"},"answer":"D","explanation":"根据题意，甲、乙两工厂的工作效率满足：8（甲+乙）+7乙=12（甲+乙）×90%，整理可得甲、乙两工厂的工作效率之比为3：2。赋值甲的工作效率为3，乙的工作效率为2，则该订单的工作总量为12×（3+2）=60，故所求为\u003cimg data-k=\"26d178b1f022\">天。\n故正确答案为D。","no":46,"missingImage":false},{"type":"question","qid":"16593096","cat":"数学运算","stem":"运动会招募志愿者，第一次招募了不到100人，其中男女比例为11：7；补招若干女性志愿者后，男女比例变为4：3。问最多可能补招了多少名女性志愿者？","options":{"A":"3","B":"5","C":"6","D":"10"},"answer":"B","explanation":"根据“男女比例为11：7”“补招若干女性志愿者后，男女比例变为4：3”可知，男生人数既是11的倍数，又是4的倍数，男生人数为44n。结合“第一次招募了不到100人”可知，男生人数是44人，原来女生人数为44÷11×7=28人；补招后女生人数变为44÷4×3=33人。可知女生最多可能补招人数为33-28=5人。\n故正确答案为B。","no":47,"missingImage":false},{"type":"question","qid":"16593107","cat":"数学运算","stem":"从甲地到乙地的全价机票为2000元，购买全价或折扣机票，每张都要支付120元税费，从甲地到乙地的高铁票价为680元，企业要安排20人当日从甲地前往乙地出差，单程总预算不超过2万元，已知当日高铁票、机票都充足，2折、3折和5折机票分别还剩余2张、3张和5张，其余为全价机票，问在预算范围内最多能安排多少人乘飞机前往乙地？","options":{"A":"11","B":"12","C":"13","D":"14"},"answer":"C","explanation":"题干要求预算范围内安排乘飞机前往乙地的人数最多，结合选项可知乘飞机的人数大于折扣机票的剩余张数2+3+5=10张，则题干中的折扣机票应全部购买，购买折扣机票的费用为2000×0.2×2+2000×0.3×3+2000×0.5×5+120×10=8800元；设购买全价机票的人数为n人，根据题意可列方程：\u003cimg data-k=\"4bbe3fbe5d4c\">，解得\u003cimg data-k=\"8fb5e7e5a86b\">，则n=3人。故在预算范围内最多能安排乘飞机前往乙地的人数为10+3=13人。\n故正确答案为C。","no":48,"missingImage":false},{"type":"question","qid":"16593102","cat":"数学运算","stem":"某校园围墙外的道路形成一个边长为300米的正方形（如图所示），甲、乙两人分别从正方形的两个对角沿逆时针方向同时出发，甲、乙的步行速度比为9：7。问甲、乙两人第一次处于同一条边是在哪一条边上？\n\u003cimg data-k=\"2a0562a3b91a\" style=\"max-width:218px\">","options":{"A":"AB","B":"BC","C":"CD","D":"DA"},"answer":"D","explanation":"根据题意，设甲的速度为9v，则乙的速度为7v。甲、乙初始路程差为CD+DA=300+300=600米，若甲、乙两人第一次处于同一条边，即两人路程差\u003cimg data-k=\"6f55705804e3\">米。根据追及公式：\u003cimg data-k=\"1c726a1bc11a\">，当甲与乙相差300米时，可列式：300=（9v-7v）×t，解得vt=150，则此时甲所走路程=9v×t=1350米（走完一圈300×4=1200米多150米），甲在CD中点；此时乙所走路程=7v×t=1050米（还差150米走完一圈），乙在DA中点。因\u003cimg data-k=\"46c547e605cc\">，故当甲到达D点时，乙未到达A点，此时甲、乙两人均在DA边，且为第一次处于同一条边。\n故正确答案为D。","no":49,"missingImage":false},{"type":"question","qid":"16593098","cat":"数学运算","stem":"c地为a、b两地直线道路上的一点，甲、乙两人9：00分别自a、b两地同时出发匀速相向而行，甲的速度是乙的1.5倍，甲9：40到达c地休息10分钟后继续向b地前进；乙全程不休息，在10：40到达c地，问甲、乙相遇的时间为：","options":{"A":"10：00","B":"10：10","C":"10：20","D":"10：30"},"answer":"B","explanation":"方法一：赋值甲每分钟的速度为3，乙每分钟的速度为2。根据甲9：40到达c地，则\u003cimg data-k=\"d07f8d7d4e66\">；乙全程不休息，在10：40到达c地，则\u003cimg data-k=\"f8263666b728\">，因此ab的路程\u003cimg data-k=\"1841ef7d43fe\">。设甲、乙两人从9：00开始出发t分钟后相遇，则\u003cimg data-k=\"751bfb701434\">\u003cimg data-k=\"449fd6964ae9\">，解得t=70，因此甲、乙相遇的时间为9：00+70分钟=10：10。\n方法二：赋值甲每分钟的速度为3，乙每分钟的速度为2。根据乙9：00出发，在10：40到达c地，可得乙从b地到c地的路程为2×100=200。当甲9：50离开c地继续向b地前进时，乙已走的路程为2×50=100，此时甲、乙继续相向而行所需的相遇时间\u003cimg data-k=\"f098b9f5158c\">\u003cimg data-k=\"57ee9778592b\">\u003cimg data-k=\"8b10d7592a42\">分钟，则甲、乙相遇时间为9：50+20分钟=10：10。\n故正确答案为B。","no":50,"missingImage":false},{"type":"question","qid":"10204488","cat":"数学运算","stem":"某餐饮店接到一份粽子订单，张师傅与李师傅同时工作8小时可完成。现张师傅先独自包粽子3小时，李师傅接着独自包了1小时，还剩订单总数的\u003cimg data-k=\"4d71668f04e7\">没完成。已知张师傅每小时比李师傅多包14个粽子。问这份订单粽子的总数是多少个？","options":{"A":"224","B":"296","C":"320","D":"416"},"answer":"A","explanation":"根据题意可得，张师傅和李师傅的效率关系为：3×张+1×李=8×（张+李）×（\u003cimg data-k=\"1528a341df64\">），整理可得，张：李=3：1，设张师傅的效率为每小时3x个，李师傅的效率为每小时x个。根据“张师傅包粽子比李师傅每小时多14个”可得，3x-x=14，解得x=7，则一共有8×（3×7+1×7）=8×28=224个粽子。\n故正确答案为A。","no":51,"missingImage":false},{"type":"question","qid":"16593103","cat":"数学运算","stem":"安排A、B、C、D共4个研发团队参与甲、乙、丙3个课题的研究，要求每个课题至少有1个团队参与，每个团队必须且只能参与1个课题，如甲课题参与的团队数超过1个，则A、B都不参与甲课题，问共有多少种不同的安排方式？","options":{"A":"24","B":"26","C":"36","D":"42"},"answer":"B","explanation":"根据题意可知，甲课题参与的团队数可能为1个或2个，分情况讨论如下：\n（1）甲课题参与的团队数为1个，先从4个研发团队中任意选择1个有\u003cimg data-k=\"be99391be9cc\">种情况，再让剩下3个团队参与乙、丙2个课题有\u003cimg data-k=\"9ba99a92b39c\">种情况，分步用乘法，共有4×6=24种情况。\n（2）甲课题参与的团队数为2个，则只能C、D参与甲课题，剩下A、B2个团队参与乙、丙2个课题有\u003cimg data-k=\"54bf29117685\">种情况。\n分类用加法，则共有24+2=26种安排方式。\n故正确答案为B。","no":52,"missingImage":false},{"type":"question","qid":"16593095","cat":"数学运算","stem":"企业将12个技术培训名额分配给甲、乙、丙三个研发团队。要求乙团队分配的培训名额比甲团队少，但比丙团队多，且每个团队至少分配1个名额。问有多少种不同的分配方式？","options":{"A":"6","B":"7","C":"36","D":"42"},"answer":"B","explanation":"根据题干条件，各团队分配的培训名额甲&gt;乙&gt;丙，采用枚举法，情况如下：\n\u003cimg data-k=\"ea61931c999c\" style=\"max-width:488px\">\n由上表可知，共有7种不同的分配方式。\n故正确答案为B。","no":53,"missingImage":false},{"type":"question","qid":"10204499","cat":"数学运算","stem":"一个半径300米的圆形湖泊中有一个半径100米的圆形人工岛，该人工岛的中心在湖泊中心的正西方150米处。甲从湖正北的A点开船出发，绕行人工岛西侧到达正南的B点。如果保持最短路线行驶，那么行驶多少米后甲到达人工岛的岸边？\n\u003cimg data-k=\"7fe67cb34105\" style=\"max-width:300px\">","options":{"A":"\u
