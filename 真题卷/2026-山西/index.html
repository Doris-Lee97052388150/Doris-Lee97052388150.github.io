<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2026年山西省公务员录用考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2026-山西","title":"2026年山西省公务员录用考试《行测》题（网友回忆版）","year":"2026","group":"山西","modules":[{"label":"政治理论","items":[{"type":"question","qid":"16070174","cat":"新思想","stem":"推进中国式现代化是一个系统工程，需要统筹兼顾、系统谋划、整体推进，正确处理好一系列重大关系。下列与之相关的表述正确的有（    ）。\n①活力与秩序：中国式现代化应当而且能够实现活而不乱、活跃有序的动态平衡\n②守正与创新：守正才能不迷失方向、不犯颠覆性错误，创新才能把握时代、引领时代\n③战略与策略：要增强策略的前瞻性，准确把握事物发展的必然趋势，以科学的战略预见未来、引领未来\n④效率与公平：中国式现代化既要创造比资本主义更高的效率，又要更有效地维护社会公平，更好实现效率与公平相兼顾、相促进、相统一","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查新思想。\n2023年10月1日，《求是》杂志发表习近平总书记重要文章《推进中国式现代化需要处理好若干重大关系》，以下简称文章。\n①正确，文章指出：“五是活力与秩序的关系。在现代化的历史进程中，处理好这对关系是一道世界性难题。中国式现代化应当而且能够实现活而不乱、活跃有序的动态平衡。”\n②正确，文章指出：“三是守正与创新的关系。守正创新是我们党在新时代治国理政的重要思想方法。守正才能不迷失方向、不犯颠覆性错误，创新才能把握时代、引领时代。”\n③错误，文章指出：“二是战略与策略的关系。战略与策略是我们党领导人民改造世界、变革实践、推动历史发展的有力武器······要增强战略的前瞻性，准确把握事物发展的必然趋势，敏锐洞悉前进道路上可能出现的机遇和挑战，以科学的战略预见未来、引领未来。”故“策略的前瞻性”表述有误，应为“战略的前瞻性”。\n④正确，文章指出：“四是效率与公平的关系。中国式现代化既要创造比资本主义更高的效率，又要更有效地维护社会公平，更好实现效率与公平相兼顾、相促进、相统一。”\n故①②④表述正确，共3项。\n故正确答案为C。","no":1,"missingImage":false},{"type":"question","qid":"16070156","cat":"时事政治","stem":"制定“十五五”规划建议，系统谋划“十五五”时期经济社会发展，是实现党的二十大描绘的宏伟蓝图、分阶段有步骤推进中国式现代化的需要，意义重大。关于“十五五”规划建议，下列表述正确的有几项？\n①适度超前建设新型基础设施，推进信息通信网络、全国一体化算力网、重大科技基础设施等建设和集约高效利用\n②推动量子科技、生物制造、第六代移动通信等成为新的经济增长点\n③建设法治经济、信用经济，打造市场化法治化国际化一流营商环境\n④健全与常住人口相匹配的公共资源配置机制，加强县域基本公共服务供给统筹","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n2025年10月23日，中国共产党第二十届中央委员会第四次全体会议通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》（以下简称《建议》）。\n①正确，《建议》在“三、建设现代化产业体系，巩固壮大实体经济根基”部分指出：“（10）构建现代化基础设施体系。加强基础设施统筹规划，优化布局结构，促进集成融合，提升安全韧性和运营可持续性。适度超前建设新型基础设施，推进信息通信网络、全国一体化算力网、重大科技基础设施等建设和集约高效利用，推进传统基础设施更新和数智化改造。”\n②正确，《建议》在“三、建设现代化产业体系，巩固壮大实体经济根基”部分指出：“前瞻布局未来产业，探索多元技术路线、典型应用场景、可行商业模式、市场监管规则，推动量子科技、生物制造、氢能和核聚变能、脑机接口、具身智能、第六代移动通信等成为新的经济增长点。”\n③正确，《建议》在“二、‘十五五’时期经济社会发展的指导方针和主要目标”部分指出：“坚持有效市场和有为政府相结合。充分发挥市场在资源配置中的决定性作用，更好发挥政府作用，构建统一、开放、竞争、有序的市场体系，建设法治经济、信用经济，打造市场化法治化国际化一流营商环境，形成既‘放得活’又‘管得好’的经济秩序。”\n④正确，《建议》在“十一、加大保障和改善民生力度，扎实推进全体人民共同富裕”部分指出：“（44）稳步推进基本公共服务均等化。建立基本公共服务均等化评价标准，完善基本公共服务范围和内容，制定实现基本公共服务均等化的目标、路径、措施，推动更多公共服务向基层下沉、向农村覆盖、向边远地区和生活困难群众倾斜，健全与常住人口相匹配的公共资源配置机制。加强县域基本公共服务供给统筹，完善投入保障长效机制。全面深化事业单位改革。”\n综上，①②③④表述正确，共4项。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"16070305","cat":"新思想","stem":"习近平总书记强调，要推动森林“水库、钱库、粮库、碳库”更好联动，实现生态效益、经济效益、社会效益相统一。下列表述与这一要求相契合的有几项？\n①手中有粮，心中不慌\n②绿水青山就是金山银山\n③增绿就是增优势，护林就是护财富\n④环境就是民生，青山就是美丽，蓝天也是幸福","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查新思想。\n①错误，2020年5月23日，习近平总书记在看望参加全国政协十三届三次会议的经济界委员并参加联组会时强调：“对我们这样一个有着14亿人口的大国来说，农业基础地位任何时候都不能忽视和削弱，手中有粮、心中不慌在任何时候都是真理。”故“手中有粮，心中不慌”强调农业对我国的重要性，但并未体现生态效益、经济效益、社会效益相统一。\n②正确，2005年8月15日，时任浙江省委书记的习近平同志，在湖州市安吉县余村考察时，首次提出“绿水青山就是金山银山”的科学论断。2018年5月18日，习近平总书记在全国生态环境保护大会上发表重要讲话指出：“绿水青山既是自然财富、生态财富，又是社会财富、经济财富。保护生态环境就是保护自然价值和增值自然资本，就是保护经济社会发展潜力和后劲，使绿水青山持续发挥生态效益和经济社会效益。”故“绿水青山就是金山银山”体现了生态效益、经济效益、社会效益相统一。\n③正确，2023年9月6日，习近平总书记在黑龙江漠河考察时指出：“要坚持造林与护林并重；要树立增绿就是增优势、护林就是护财富的理念，在保护的前提下让老百姓通过发展林下经济增加收入。”“增绿”“护林”体现了生态效益，“增优势”体现了社会效益，“护财富”体现了经济效益，故“增绿就是增优势，护林就是护财富”体现了生态效益、经济效益、社会效益相统一。\n④正确，2016年1月18日，习近平总书记在省部级主要领导干部学习贯彻党的十八届五中全会精神专题研讨班上发表重要讲话指出：“我讲过，环境就是民生，青山就是美丽，蓝天也是幸福，绿水青山就是金山银山；保护环境就是保护生产力，改善环境就是发展生产力。”“环境”“青山”“蓝天”体现了生态效益，“民生”“美丽”“幸福”体现了社会效益和经济效益，故“环境就是民生，青山就是美丽，蓝天也是幸福”体现了生态效益、经济效益、社会效益相统一。\n故相契合的有②③④，共3项。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"16069957","cat":"新思想","stem":"党的十八大以来，以习近平同志为核心的党中央坚定不移推进全面从严治党，取得一系列理论创新、实践创新、制度创新成果，构建起全面从严治党体系，开辟了百年大党自我革命新境界。下列关于全面从严治党的表述不准确的是（    ）。","options":{"A":"制度建设要与管党治党需要相适应、与党的各项建设相配套，全方位织密制度的笼子","B":"严密党的组织体系，关键是坚持党中央权威和集中统一领导，根本在做到“两个维护”","C":"新时代党的建设是以党的组织建设为统领、党的各项建设同向发力综合发力的系统工程","D":"着力抓好政治监督、领导班子特别是“一把手”监督、“三重一大”事项监督以及权力集中、资金密集、资源富集等重点领域的监督"},"answer":"C","explanation":"本题考查新思想。\n2025年2月16日，《求是》杂志发表习近平总书记重要文章《健全全面从严治党体系》，以下简称文章。\nA项正确，文章指出：“第四，健全科学完备、有效管用的制度体系。全面从严治党政治性、原则性强，必须有一套科学完备的制度来规范。制度建设要与管党治党需要相适应、与党的各项建设相配套，全方位织密制度的笼子。”\nB项正确，文章指出：“第一，健全上下贯通、执行有力的组织体系······只有党的组织体系严密起来，党的各级组织政治功能和组织功能充分发挥出来，全面从严治党才能持续向纵深推进。严密党的组织体系，关键是坚持党中央权威和集中统一领导，根本在做到‘两个维护’。”\nC项错误，文章指出：“······新时代党的建设是以党的政治建设为统领、党的各项建设同向发力综合发力的系统工程，必须以党中央关于党的建设的重要思想、关于党的自我革命的重要思想为根本遵循，坚持和加强党的全面领导和党中央集中统一领导······”故“以党的组织建设为统领”表述有误，应为“以党的政治建设为统领”。\nD项正确，文章指出：“第三，健全精准发力、标本兼治的监管体系······要突出监督重点，着力抓好政治监督、领导班子特别是‘一把手’监督、‘三重一大’事项监督以及权力集中、资金密集、资源富集等重点领域的监督，切实让特权现象和腐败问题无所遁形。”\n本题为选非题，故正确答案为C。","no":4,"missingImage":false},{"type":"question","qid":"16069901","cat":"新思想","stem":"城乡融合发展是中国式现代化的必然要求。关于城乡融合发展，下列说法正确的有几项？\n①要把乡村振兴战略这篇大文章做好，必须走城乡融合发展之路\n②在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败\n③要顺应城乡融合发展大趋势，破除妨碍城乡要素平等交换、双向流动的制度壁垒\n④振兴乡村，不能就乡村论乡村，还是要强化以工补农、以城带乡，加快形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n①正确，2018年9月21日，习近平总书记在十九届中央政治局第八次集体学习时讲话指出：“要把乡村振兴战略这篇大文章做好，必须走城乡融合发展之路。我们一开始就没有提城市化，而是提城镇化，目的就是促进城乡融合。要向改革要动力，加快建立健全城乡融合发展体制机制和政策体系。”\n②正确，2018年9月21日，习近平总书记在十九届中央政治局第八次集体学习时讲话指出：“我一直强调，没有农业农村现代化，就没有整个国家现代化。在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败。”\n③正确，2022年12月23日，习近平总书记在中央农村工作会议上讲话指出：“要顺应城乡融合发展大趋势，破除妨碍城乡要素平等交换、双向流动的制度壁垒，促进发展要素、各类服务更多下乡，率先在县域内破除城乡二元结构。”\n④正确，2020年12月28日，习近平总书记在中央农村工作会议上讲话指出：“第六，推动城乡融合发展见实效。振兴乡村，不能就乡村论乡村，还是要强化以工补农、以城带乡，加快形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系。”\n综上，①②③④说法正确，共4项。\n故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"16069974","cat":"新思想","stem":"习近平总书记指出，中国愿同世界各国一道，把握信息革命发展的历史主动，携手构建网络空间命运共同体，让互联网更好造福人民、造福世界。关于构建网络空间命运共同体，下列表述正确的是：\n①尊重网络主权，维护网络安全，共同构建和平、安全、开放、合作的网络空间\n②全球网络主要由跨国公司提供，网络空间未来应由跨国公司携手经营\n③倡导发展优先，构建更加普惠繁荣的网络空间\n④保障数据安全，建立单边、保密的国际互联网治理体系\n⑤深化网络安全务实合作，有力打击网络违法犯罪行为","options":{"A":"①③⑤","B":"①④⑤","C":"①②③⑤","D":"①②③④⑤"},"answer":"A","explanation":"本题考查新思想。\n①正确，2014年11月19日，习近平总书记在向首届世界互联网大会致贺词中强调：“中国正在积极推进网络建设，让互联网发展成果惠及13亿中国人民。中国愿意同世界各国携手努力，本着相互尊重、相互信任的原则，深化国际合作，尊重网络主权，维护网络安全，共同构建和平、安全、开放、合作的网络空间，建立多边、民主、透明的国际互联网治理体系。”\n②错误，2022年11月7日，国务院新闻办公室发布的《携手构建网络空间命运共同体》白皮书在“三、构建网络空间命运共同体的中国贡献”部分“（三）积极参与网络空间治理”中指出：“中国始终认为，国家不分大小、强弱、贫富，都是平等成员，都有权平等参与国际规则与秩序建构，确保网络空间未来发展由各国人民共同掌握。”同时，全球网络基础设施与治理体系以主权国家为核心主体，跨国公司仅为重要的商业服务提供者，而非“主要提供者”。故“网络空间未来应由跨国公司携手经营”表述错误，应为“确保网络空间未来发展由各国人民共同掌握”。\n③正确，2023年11月8日，习近平总书记向2023年世界互联网大会乌镇峰会开幕式发表的视频致辞指出：“我们倡导发展优先，构建更加普惠繁荣的网络空间。深化数字领域国际交流合作，加速科技成果转化。加快信息化服务普及，缩小数字鸿沟，在互联网发展中保障和改善民生，让更多国家和人民共享互联网发展成果。”\n④错误，2015年12月16日，习近平总书记在第二届世界互联网大会开幕式上的讲话中指出：“第五，构建互联网治理体系，促进公平正义。国际网络空间治理，应该坚持多边参与、多方参与，由大家商量着办，发挥政府、国际组织、互联网企业、技术社群、民间机构、公民个人等各个主体作用，不搞单边主义，不搞一方主导或由几方凑在一起说了算······”故“建立单边、保密的国际互联网治理体系”表述错误，应为“国际网络空间治理，应该坚持多边参与、多方参与，由大家商量着办”。\n⑤正确，2023年11月9日，人民日报发表的文章《共同推动构建网络空间命运共同体迈向新阶段》指出：“‘我们倡导安危与共，构建更加和平安全的网络空间。’只有尊重网络主权，遵守网络空间国际规则，深化网络安全务实合作，有力打击网络违法犯罪行为，加强数据安全和个人信息保护，才能妥善应对科技发展带来的规则冲突、社会风险、伦理挑战，更好维护网络空间安全。”\n故①③⑤表述正确。\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"16069954","cat":"新思想","stem":"习近平总书记强调，要坚持以铸牢中华民族共同体意识为主线，不断推进民族团结进步事业，推动党的民族工作高质量发展。关于铸牢中华民族共同体意识，下列说法正确的有几项?\n①广泛交往交流交融是推进中华民族共同体建设的重要途径\n②加强对青少年的历史文化教育，全面推广普及国家通用语言文字，全面推行使用国家统编教材\n③要坚持和完善民族区域自治制度，逐步完善相关法律法规和差别化区域支持政策，依法保障各族群众合法权益\n④要引导各族群众不断增强对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n2024年9月27日，全国民族团结进步表彰大会在北京举行。习近平总书记出席大会并发表重要讲话。\n①正确，习近平总书记在讲话中指出：“第四，推动各民族全方位嵌入，积极促进各民族交往交流交融。广泛交往交流交融是推进中华民族共同体建设的重要途径。”\n②正确，习近平总书记在讲话中指出：“第二，着力构筑中华民族共有精神家园······加强对青少年的历史文化教育，全面推广普及国家通用语言文字，全面推行使用国家统编教材，把中华民族共同体意识从小就植入孩子们的心灵。”\n③正确，习近平总书记在讲话中指出：“第五，依法治理民族事务，不断提高民族事务治理能力和水平。要坚持和完善民族区域自治制度，逐步完善相关法律法规和差别化区域支持政策，依法保障各族群众合法权益。加强法治宣传教育，引导各族群众增强国家意识、公民意识、法治意识。”\n④正确，习近平总书记在讲话中指出：“第一，始终坚持党的领导，不断巩固各民族团结奋斗的共同思想政治基础······要引导各族群众不断增强对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同，牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念。”\n故①②③④表述正确，共4项。\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"16070207","cat":"新思想","stem":"党的十八大以来，以习近平同志为核心的党中央高度重视海洋工作和海洋事业发展，将海洋强国建设作为实现中华民族伟大复兴的重大战略任务，通盘谋划、整体推进海洋强国建设。关于建设海洋强国，下列表述不准确的是：","options":{"A":"统筹处理人与自然的关系、发展和保护的关系是推进海洋强国建设的重大原则","B":"建设海洋强国必须进一步关心海洋、认识海洋、经略海洋，加快海洋科技创新步伐","C":"建设强大的现代化海军是建设世界一流军队的重要标志，是建设海洋强国的战略支撑","D":"建设海洋强国所需的关键技术主要靠对外开放引进，靠充分发挥国外关键技术经验优势"},"answer":"D","explanation":"本题考查新思想。\nA项正确，2024年1月11日，求是网发表的文章《准确把握新形势下海洋资源开发保护要求》指出：“美丽海洋是美丽中国的重要组成部分，碧海蓝天也是金山银山。统筹处理人与自然的关系、发展和保护的关系是推进海洋强国建设的重大原则······”\nB项正确，2018年6月12日，习近平总书记在山东青岛考察时强调：“海洋经济发展前途无量。建设海洋强国，必须进一步关心海洋、认识海洋、经略海洋，加快海洋科技创新步伐。”\nC项正确，2017年5月24日，习近平总书记视察海军机关并发表重要讲话。他强调，建设强大的现代化海军是建设世界一流军队的重要标志，是建设海洋强国的战略支撑，是实现中华民族伟大复兴中国梦的重要组成部分。\nD项错误，2022年4月10日，习近平总书记在中国海洋大学三亚海洋研究院调研考察时，对建设海洋强国作出重要指示，强调要推动海洋科技实现高水平自立自强，加强原创性、引领性科技攻关，把装备制造牢牢抓在自己手里，努力用我们自己的装备开发油气资源，提高能源自给率，保障国家能源安全。故建设海洋强国所需的关键技术不能主要靠对外开放引进，而应加强科技攻关和自主研发。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"16069911","cat":"时事政治","stem":"党的二十大报告指出，坚持把发展经济的着力点放在实体经济上，推进新型工业化，加快建设制造强国、质量强国、航天强国、交通强国、网络强国、数字中国。关于发展实体经济，下列说法正确的是：\n①金融是实体经济的血脉，为实体经济服务是金融的天职\n②要增强资本市场服务实体经济功能，积极有序发展股权融资\n③要实现实体经济、科技创新、现代金融、人力资源协同发展\n④要促进实体经济和数字经济深度融合，有序推动实体经济脱实向虚\n⑤要推动资源要素向实体经济集聚、政策措施向实体经济倾斜、工作力量向实体经济加强","options":{"A":"①②③⑤","B":"②③④","C":"①②④⑤","D":"③④⑤"},"answer":"A","explanation":"本题考查新思想。\n①正确，2026年2月1日出版的第3期《求是》杂志发表了习近平总书记的重要文章《走好中国特色金融发展之路，建设金融强国》，文章指出：“······坚持把金融服务实体经济作为根本宗旨。实体经济是金融的根基，金融是实体经济的血脉，服务实体经济是金融的天职······”\n②正确，2017年7月召开的全国金融会议指出：“金融是国之重器，是国民经济的血脉······要增强资本市场服务实体经济功能，积极有序发展股权融资，提高直接融资比重······”\n③正确，党的十九大报告在“五、贯彻新发展理念，建设现代化经济体系”部分指出：“必须坚持质量第一、效益优先······着力加快建设实体经济、科技创新、现代金融、人力资源协同发展的产业体系，着力构建市场机制有效、微观主体有活力、宏观调控有度的经济体制，不断增强我国经济创新力和竞争力。”\n④错误，2026年2月1日出版的第3期《求是》杂志发表了习近平总书记的重要文章《走好中国特色金融发展之路，建设金融强国》，文章指出：“······我国金融必须守好服务实体经济本分，推动高质量发展，决不能脱实向虚。”十五五规划纲要在“第十三章 全方位推进数智技术赋能”部分指出：“促进实体经济和数字经济深度融合。”故“有序推动实体经济脱实向虚”表述有误。\n⑤正确，《习近平新时代中国特色社会主义思想学习纲要》在“九、以新发展理念引领经济高质量发展”部分指出：“······要加快发展先进制造业，坚定不移建设制造强国。推动互联网、大数据、人工智能同实体经济深度融合，推动资源要素向实体经济集聚、政策措施向实体经济倾斜、工作力量向实体经济加强······”\n故正确的有①②③⑤。\n故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"16069955","cat":"新思想","stem":"加强数字政府建设是创新政府治理理念和方式、形成数字治理新格局、推进国家治理体系和治理能力现代化的重要举措。下列关于数字政府建设的基本原则，表述正确的有几项?\n①坚持党的全面领导，充分发挥党总揽全局、协调各方的领导核心作用\n②坚持以市场为中心，始终把满足人民群众物质生活的迫切需求作为目标\n③坚持整体协同，强化系统观念，加强系统集成，全面提升数字政府集约化建设水平\n④坚持数据赋能，建立健全数据治理制度和标准体系，加强数据汇聚融合、共享开放和开发利用","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查新思想。\n2022年6月23日，国务院发布了《关于加强数字政府建设的指导意见》，以下简称《意见》。\n①正确，《意见》“一、发展现状和总体要求”中“2.基本原则”部分指出：“坚持党的全面领导。充分发挥党总揽全局、协调各方的领导核心作用，全面贯彻党中央、国务院重大决策部署，将坚持和加强党的全面领导贯穿数字政府建设各领域各环节，贯穿政府数字化改革和制度创新全过程，确保数字政府建设正确方向。”\n②错误，《意见》“一、发展现状和总体要求”中“2.基本原则”部分指出：“坚持以人民为中心。始终把满足人民对美好生活的向往作为数字政府建设的出发点和落脚点······”故“以市场为中心，始终把满足人民群众物质生活的迫切需求作为目标”说法错误，应为“以人民为中心，始终把满足人民对美好生活的向往作为数字政府建设的出发点和落脚点”\n③正确，《意见》“一、发展现状和总体要求”中“2.基本原则”部分指出：“坚持整体协同。强化系统观念，加强系统集成，全面提升数字政府集约化建设水平，统筹推进技术融合、业务融合、数据融合，提升跨层级、跨地域、跨系统、跨部门、跨业务的协同管理和服务水平······”\n④正确，《意见》“一、发展现状和总体要求”中“2.基本原则”部分指出：“坚持数据赋能。建立健全数据治理制度和标准体系，加强数据汇聚融合、共享开放和开发利用，促进数据依法有序流动，充分发挥数据的基础资源作用和创新引擎作用，提高政府决策科学化水平和管理服务效率，催生经济社会发展新动能。”\n故①③④正确，共3项。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"16070220","cat":"马克思主义","stem":"习近平总书记指出，各级干部要深刻懂得用权为民、担责成事、廉洁立身的道理，自觉把担当和自律统一起来，在构建亲清政商关系上亮明态度、付诸行动。关于亲清政商关系，下列表述正确的有几项？\n①对于领导干部而言，所谓“亲”，就是要坦荡真诚同民营企业接触交往\n②对于领导干部而言，所谓“清”，就是洁身自好，减少同民营企业家的来往\n③对于民营企业家而言，所谓“亲”，就是积极主动同各级党委和政府及部门多沟通多交流\n④对于民营企业家而言，所谓“清”，就是遵纪守法办企业、光明正大搞经营\n⑤“亲”和“清”本质上是干事和干净的关系，是辩证统一的，完全可以并行不悖","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"C","explanation":"本题考查新思想。\n①③④正确，②错误，2016年3月4日下午，习近平总书记看望了参加全国政协十二届四次会议的民建、工商联委员，并参加联组会，听取委员们意见和建议。习近平总书记指出：“对领导干部而言，所谓‘亲’，就是要坦荡真诚同民营企业接触交往，特别是在民营企业遇到困难和问题情况下更要积极作为、靠前服务，对非公有制经济人士多关注、多谈心、多引导，帮助解决实际困难。所谓‘清’，就是同民营企业家的关系要清白、纯洁，不能有贪心私心，不能以权谋私，不能搞权钱交易。对民营企业家而言，所谓‘亲’，就是积极主动同各级党委和政府及部门多沟通多交流，讲真话，说实情，建诤言，满腔热情支持地方发展。所谓‘清’，就是要洁身自好、走正道，做到遵纪守法办企业、光明正大搞经营。”故②中“就是洁身自好，减少同民营企业家的来往”表述错误，应为“就是同民营企业家的关系要清白、纯洁，不能有贪心私心，不能以权谋私，不能搞权钱交易”。\n⑤正确，2025年2月17日，习近平总书记在京出席民营企业座谈会时候指出：“五是进一步构建亲清政商关系。这个问题我讲过多次了，现在仍有不少干部认识不到位、工作片面化简单化。我再次重申，‘亲’和‘清’本质上是干事和干净的关系，是辩证统一的，完全可以并行不悖。”\n①③④⑤正确，共4项。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"16070227","cat":"新思想","stem":"习近平总书记指出，讲好中国故事，传播好中国声音，展示真实、立体、全面的中国，是加强我国国际传播能力建设的重要任务。关于加强我国国际传播能力建设，下列表述正确的是：\n①要提升国际传播体系稳定性，防范国际传播格局重构\n②要全面提升国际传播效能，建强适应新时代国际传播需要的专门人才队伍\n③要倡导和平的国际舆论环境，不参与国际舆论斗争，塑造谦逊谦和的大国形象\n④推动走出去、请进来管理便利化，扩大国际人文交流合作","options":{"A":"①②","B":"②④","C":"①③","D":"③④"},"answer":"B","explanation":"本题考查新思想。\n①错误，④正确，《中共中央关于进一步全面深化改革、推进中国式现代化的决定》在“十、深化文化体制机制改革”部分中指出：“（41）构建更有效力的国际传播体系。推进国际传播格局重构，深化主流媒体国际传播机制改革创新，加快构建多渠道、立体式对外传播格局。加快构建中国话语和中国叙事体系，全面提升国际传播效能。建设全球文明倡议践行机制。推动走出去、请进来管理便利化，扩大国际人文交流合作。”故“防范国际传播格局重构”表述错误，应为“推进国际传播格局重构”。\n②正确，③错误，2021年5月31日，习近平总书记在中共中央政治局第三十次集体学习时指出：“我们党历来高度重视对外传播工作……积极推动中华文化走出去，有效开展国际舆论引导和舆论斗争，初步构建起多主体、立体式的大外宣格局······要全面提升国际传播效能，建强适应新时代国际传播需要的专门人才队伍······”故“不参与国际舆论斗争”表述错误，应为“有效开展国际舆论引导和舆论斗争”。\n综上，②④表述正确。\n故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"16070240","cat":"新思想","stem":"就业是最基本的民生，事关人民群众切身利益，事关经济社会健康发展，事关国家长治久安。关于促进高质量充分就业，下列举措恰当的有几项？\n①引导退役军人围绕国家重点扶持领域创业\n②推动农村低收入人口就业帮扶常态化，防止因失业导致规模性返贫\n③鼓励支持企业吸纳就业、自主创业，统筹用好公益性岗位，确保不出现零就业家庭\n④对各种类型的就业困难高校毕业生均按照规定给予一定的社会保险补贴\n⑤提升青年就业服务效能，强化针对性职业指导、职业介绍、技能培训、见习实习，形成衔接校内校外、助力成长成才的服务支撑","options":{"A":"5项","B":"4项","C":"3项","D":"2项"},"answer":"C","explanation":"本题考查新思想。\n2024年9月15日，中共中央、国务院发布《关于实施就业优先战略促进高质量充分就业的意见》，以下简称《意见》。\n①正确，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十）做好退役军人就业服务保障。健全学历教育与职业技能培训、创业培训、个性化培训并行的退役军人教育培训体系······引导退役军人围绕国家重点扶持领域创业。”\n②正确，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十一）拓宽农村劳动力就业增收空间。壮大县域富民产业，推出一批适应乡村全面振兴需要的新职业，注重引导外出人才返乡、城市人才下乡创业，实施以工代赈，加快形成双向流动、互融互通的统筹城乡就业格局······推动农村低收入人口就业帮扶常态化，防止因失业导致规模性返贫。”\n③错误，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十二）完善困难人员就业援助制度······鼓励支持企业吸纳就业、自主创业，统筹用好公益性岗位，确保零就业家庭动态清零。”故“确保不出现零就业家庭”表述错误，应为“确保零就业家庭动态清零”。\n④错误，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十三）优化自主创业灵活就业保障制度······对就业困难人员、离校2年内未就业高校毕业生灵活就业的，按照规定给予一定的社会保险补贴。”故“各种类型的就业困难高校毕业生”表述错误，应为“就业困难人员、离校2年内未就业高校毕业生灵活就业的”。\n⑤正确，《意见》在“四、完善重点群体就业支持体系”部分指出：“（九）拓展高校毕业生等青年就业成才渠道······提升青年就业服务效能，强化针对性职业指导、职业介绍、技能培训、见习实习，形成衔接校内校外、助力成长成才的服务支撑。”\n综上，①②⑤说法正确，共3项。\n故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"16069899","cat":"新思想","stem":"习近平总书记指出，对我们这样一个有着14亿人口的大国来说，农业基础地位任何时候都不能忽视和削弱。关于增强粮食等重要农产品供给保障能力，下列说法正确的有几项？\n①在确保省内耕地保护任务不降低前提下，稳妥有序退出河道内影响行洪安全等的不稳定耕地\n②加强中小河流治理和大中型灌区建设改造，推进蓄滞洪区关键设施建设和管理机制改革\n③严格生猪屠宰检疫执法监管，强化重大动物疫病和重点人畜共患病防控\n④建设现代化防洪减灾体系，全面开展病险水库除险加固\n⑤加力落实新一轮百亿斤粮食产能提升任务","options":{"A":"5项","B":"4项","C":"3项","D":"2项"},"answer":"B","explanation":"本题考查新思想。\n2025年2月23日，《中共中央、国务院关于进一步深化农村改革 扎实推进乡村全面振兴的意见》（以下简称《意见》）发布。\n①正确，《意见》在“一、持续增强粮食等重要农产品供给保障能力”部分指出：“（三）强化耕地保护和质量提升······稳步推进盐碱地综合利用试点，加强东北黑土区侵蚀沟、南方酸化退化耕地治理。分类推进撂荒地复垦利用。在确保省域内耕地保护任务不降低前提下，稳妥有序退出河道内影响行洪安全等的不稳定耕地。”\n②④正确，《意见》在“一、持续增强粮食等重要农产品供给保障能力”部分指出：“（五）加强农业防灾减灾能力建设······建设现代化防洪减灾体系，全面开展病险水库除险加固，加强中小河流治理和大中型灌区建设改造，推进蓄滞洪区关键设施建设和管理机制改革。”\n③正确，《意见》在“一、持续增强粮食等重要农产品供给保障能力”部分指出：“（二）扶持畜牧业稳定发展······落实灭菌乳国家标准，支持以家庭农场和农民合作社为主体的奶业养殖加工一体化发展。严格生猪屠宰检疫执法监管，强化重大动物疫病和重点人畜共患病防控。”\n⑤错误，《意见》在“一、持续增强粮食等重要农产品供给保障能力”部分指出：“（一）深入推进粮油作物大面积单产提升行动······进一步扩大粮食单产提升工程实施规模，加大高产高效模式集成推广力度，推进水肥一体化，促进大面积增产。加力落实新一轮千亿斤粮食产能提升任务。”故“百亿”表述错误，应为“千亿”。\n故①②③④表述正确，共4项。\n故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"16070302","cat":"新思想","stem":"建设教育强国，基点在基础教育。基础教育搞得越扎实，教育强国步伐就越稳、后劲就越足。关于加强基础教育，下列举措正确的有几项？\n①提升寄宿制学校办学条件和管理水平，办好必要的乡村小规模学校\n②统筹推进市域内高中阶段学校多样化发展，加快扩大普通高中教育资源供给\n③强化家庭教育主阵地作用，健全学校家庭社会协同育人机制\n④建立基础教育各学段学龄人口变化监测预警制度，优化中小学和幼儿园布局\n⑤深入开展县域义务教育优质均衡督导评估，有序推进市域义务教育优质均衡发展","options":{"A":"4项","B":"3项","C":"2项","D":"1项"},"answer":"A","explanation":"本题考查新思想。\n2025年1月，中共中央 国务院印发《教育强国建设规划纲要（2024—2035年）》（以下简称《纲要》）。\n①⑤正确，《纲要》在“三、办强办优基础教育，夯实全面提升国民素质战略基点”部分指出：“（八）推动义务教育优质均衡发展和城乡一体化······提升寄宿制学校办学条件和管理水平，办好必要的乡村小规模学校······深入开展县域义务教育优质均衡督导评估，有序推进市域义务教育优质均衡发展。”\n②正确，《纲要》在“三、办强办优基础教育，夯实全面提升国民素质战略基点”部分指出：“（九）促进学前教育普及普惠和高中阶段学校多样化发展······统筹推进市域内高中阶段学校多样化发展，加快扩大普通高中教育资源供给。”\n③错误，《纲要》在“三、办强办优基础教育，夯实全面提升国民素质战略基点”部分指出：“（十）统筹推进‘双减’和教育教学质量提升······强化学校教育主阵地作用，全面提升课堂教学水平，加强对学习困难学生的辅导······”故“强化家庭教育主阵地作用”说法错误，应为“强化学校教育主阵地作用”。\n④正确，《纲要》在“三、办强办优基础教育，夯实全面提升国民素质战略基点”部分指出：“（七）健全与人口变化相适应的基础教育资源统筹调配机制······建立基础教育各学段学龄人口变化监测预警制度，优化中小学和幼儿园布局。”\n故①②④⑤说法正确，共4项。\n故正确答案为A。","no":15,"missingImage":false},{"type":"question","qid":"16069951","cat":"马克思主义","stem":"习近平总书记曾说：“我们要有钉钉子的精神，钉钉子往往不是一锤子就能钉好的，而是要一锤一锤接着敲，直到把钉子钉实钉牢，钉牢一颗再钉下一颗，不断钉下去，必然大有成效。如果东一榔头西一棒子，结果很可能是一颗钉子都钉不上、钉不牢。”这句话最能体现的哲学原理是：\n①量变与质变辩证统一\n②肯定与否定辩证统一\n③主要矛盾与次要矛盾辩证统一\n④尊重客观规律与发挥主观能动性辩证统一","options":{"A":"①②","B":"②③","C":"③④","D":"①④"},"answer":"D","explanation":"本题考查马克思主义。\n①正确，钉钉子要一锤一锤接着敲，直到钉实钉牢，体现了量的积累（每一锤）达到一定程度必然引起质的飞跃（钉牢一颗钉子）；不断钉下去，必然大有成效，体现了量变与质变的辩证统一关系。\n②错误，“肯定与否定辩证统一”指事物内部包含肯定和否定的因素，要通过辩证否定实现发展。题干强调的是持续用力、循序渐进，并未涉及对事物自身的肯定与否定。\n③错误，“主要矛盾与次要矛盾辩证统一”指在复杂事物发展过程中要抓关键、抓重点，统筹兼顾。题干强调的是工作方法上的持续性和连贯性，批评“东一榔头西一棒子”，重在防止分散用力，而非区分主次矛盾。\n④正确，钉钉子要尊重“一锤子钉不好”的客观规律，必须一锤一锤钉，又要发挥主观能动性，一锤一锤接着敲，不断钉下去，只有把二者结合起来，才能取得实效，体现了尊重客观规律与发挥主观能动性的辩证统一关系。\n故①④表述正确。\n故正确答案为D。","no":16,"missingImage":false},{"type":"question","qid":"16070214","cat":"新思想","stem":"从“四个全面”战略布局到发展“全链条、全方位、全覆盖”的全过程人民民主，从“全方位、全地域、全过程”开展生态文明建设到“全方位、全过程、全周期”从严治理腐败。一个“全”字，集中凸显了习近平总书记治国理政的哪种思维？","options":{"A":"历史思维","B":"底线思维","C":"创新思维","D":"系统思维"},"answer":"D","explanation":"本题考查新思想。\nD项正确，A、B、C三项错误，历史思维是指以历史视角、历史规律看待现实问题，从历史中汲取经验、把握走向，强调以史为鉴、知古鉴今。底线思维是指要立足最不利情况，预判风险、守住边界，强调防风险、守底线、稳大局。创新思维强调突破常规、开拓新思路新方法，强调敢闯敢试、破旧立新。系统思维强调从整体、全局、联系出发，统筹各领域、各环节、各要素，强调整体性、协同性、全覆盖、全过程。题干反复突出“全”，强调整体统筹、全域覆盖、全程贯通、协同联动，正是系统思维的典型体现。\n故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"16070303","cat":"新思想","stem":"习近平总书记指出，要推动公共文化服务标准化、均等化，坚持政府主导、社会参与、重心下移、共建共享，完善公共文化服务体系，提高基本公共文化服务的覆盖面和适用性。关于完善公共文化服务体系，下列举措正确的有几项？\n①做好文化馆、乡镇（街道）综合文化站、村（社区）综合性文化服务中心等的规划建设\n②推动优质文化资源向沿海发达地区集中，促进公共文化服务差异化发展\n③实施全国智慧图书馆体系建设、公共文化云建设等项目\n④实施广播电视惠民工程，完善农村文化基础设施网络\n⑤推动各民族文化的传承保护和创新交融，提升民族地区公共文化服务水平","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"C","explanation":"本题考查新思想。\n2021年9月9日，国务院新闻办公室发布《国家人权行动计划（2021—2025年）》（以下简称《行动计划》）。\n①正确，《行动计划》在“一、经济、社会和文化权利”部分“（七）文化权利”中指出：“完善公共文化服务基础设施。做好公共图书馆、文化馆、博物馆、美术馆、乡镇（街道）综合文化站、村（社区）综合性文化服务中心等的规划建设。健全各级各类公共文化服务基础设施。”\n②错误、④正确，《行动计划》在“一、经济、社会和文化权利”部分“（七）文化权利”中指出：“补齐公共文化服务短板。落实国家基本公共服务标准要求，加强基层文化建设，增加供给总量，优化供给结构，推动优质文化资源向农村地区、革命老区、民族地区、边疆地区倾斜，缩小城乡和地区之间公共文化服务差距。实施广播电视惠民工程，完善农村文化基础设施网络。”故“推动优质文化资源向沿海发达地区集中，促进公共文化服务差异化发展”说法有误，应为“推动优质文化资源向农村地区、革命老区、民族地区、边疆地区倾斜，缩小城乡和地区之间公共文化服务差距”。\n③正确，《行动计划》在“一、经济、社会和文化权利”部分“（七）文化权利”中指出：“推动公共数字文化建设。统筹推进公共文化数字化重点工程建设。实施全国智慧图书馆体系建设、公共文化云建设等项目。”\n⑤正确，《行动计划》在“四、特定群体权益保障”部分“（一）少数民族权益”中指出：“保障少数民族文化权利。推动各民族文化的传承保护和创新交融，提升民族地区公共文化服务水平。保护和传承少数民族传统文化。做好少数民族古籍保护、抢救、整理、出版和研究工作。开展少数民族古籍数字化建设。办好第六届全国少数民族文艺会演。开展好少数民族语电视剧译制片源捐赠工作。”\n综上，①③④⑤表述正确，共4项。\n故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"16070154","cat":"时事政治","stem":"“五年来，我们党以巨大的政治勇气和强烈的责任担当，提出一系列新理念新思想新战略，出台一系列重大方针政策，推出一系列重大举措，推进一系列重大工作，解决了许多长期想解决而没有解决的难题，办成了许多过去想办而没有办成的大事，推动党和国家事业发生历史性变革。”这段话最直接体现了马克思主义哲学的哪一观点？","options":{"A":"一切从实际出发","B":"人的意识具有能动性","C":"人民群众是历史的创造者","D":"生产关系反作用于生产力"},"answer":"B","explanation":"本题考查马克思主义。\nA项错误，一切从实际出发是马克思主义哲学的根本要求，该观点强调的是理论联系实际，实事求是，从客观实际出发来认识和解决问题。题干强调的是提出新理念新思想新战略、出台方针政策等发挥人的主观能动性，最终推动历史性变革，而并未直接强调这些行动是基于对实际情况的客观认识以及从实际出发来解决问题。\nB项正确，意识的能动作用是指意识能动地反映世界和通过实践改造世界的能力和作用，其最突出的表现是通过指导实践改造客观世界。题干明确描述了党通过提出新理念新思想新战略、出台方针政策等主动性的行动，推动了党和国家事业的历史性变革，直接体现了人的意识的能动性。\nC项错误，人民群众是历史的创造者强调的是人民群众在历史发展中的决定性作用。题干强调的是党发挥主观能动性最终推动了党和国家事业的历史性变革，而并未直接强调人民，也并未强调人民群众在历史发展中的决定性作用。\nD项错误，生产关系反作用于生产力强调的是生产关系对生产力的发展不是消极被动的，而是具有巨大的反作用，其讨论的是生产关系和生产力之间的相互作用关系。题干强调的是“党和国家事业的全面历史性变革”，不局限于经济领域，也不直接讲生产关系调整。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"16069952","cat":"新思想","stem":"下列选项中，习近平用语与其蕴含的思想、观点对应恰当的是：\n①我将无我，不负人民——全心全意为人民服务\n②功成不必在我、功成必定有我——方向决定前途，道路决定命运\n③江山就是人民，人民就是江山——民为邦本\n④时代是出卷人，我们是答卷人，人民是阅卷人——时代造就英雄，伟大来自平凡","options":{"A":"①②","B":"①③","C":"②④","D":"③④"},"answer":"B","explanation":"本题考查新思想。\n①正确，“我将无我，不负人民”出自习近平总书记于2019年3月首次提出的重要表述，源于其回答意大利众议长关于执政理念的提问。该表述集中体现了中国共产党领导人以人民为中心的执政思想，强调为中国人民谋幸福、为中华民族谋复兴的使命担当。“全心全意为人民服务”是中国共产党始终坚持的根本宗旨，体现了党与人民群众的根本关系。其核心要求是将人民利益置于首位，以实现、维护和发展最广大人民根本利益为一切工作的出发点和落脚点。故二者蕴含的思想、观点对应恰当。\n②错误，“功成不必在我、功成必定有我”出自习近平总书记于2018年4月在深入推动长江经济带发展座谈会上的讲话。该表述意为功绩、事业的成功未必在我手中、在我任期、在我有生之年得到实现，但成功的过程一定有我的参与贡献。“方向决定前途，道路决定命运”出自习近平总书记于2018年12月18日在庆祝改革开放40周年大会上发表的重要讲话，讲的是道路、方向、制度问题。故二者蕴含的思想、观点对应不恰当。\n③正确，“江山就是人民，人民就是江山”是习近平总书记于2021年2月20日在党史学习教育动员大会上首次完整、公开提出的。这一表述彰显了中国共产党人民至上的根本立场，阐明了人民是国家主人、是历史创造者，党打江山守江山守的是人民的心，始终为人民谋幸福、依靠人民创造历史伟业。“民为邦本”出自《尚书·五子之歌》，意思是老百姓是国家的根本，根本牢固了国家才能安宁，体现了我国早期的民本思想。故二者蕴含的思想、观点对应恰当。\n④错误，“时代是出卷人，我们是答卷人，人民是阅卷人”出自习近平总书记于2018年1月5日在学习贯彻党的十九大精神研讨班开班式上发表的讲话。这句话深刻回答了新赶考路上“谁来出卷”“谁来答卷”“谁来阅卷”等根本问题，生动诠释了中国共产党一以贯之的初心使命。“时代造就英雄，伟大来自平凡”是习近平总书记于2021年2月25日在全国脱贫攻坚总结表彰大会上发表重要讲话时提出的，它深刻阐释了伟大与平凡、时代与个人的辩证关系，是对奋斗精神、人民力量、英雄观的高度概括。故二者蕴含的思想、观点对应不恰当。\n故①③表述正确。\n故正确答案为B。","no":20,"missingImage":false},{"type":"question","qid":"16069958","cat":"新思想","stem":"中国共产党党报党刊的发展历程，与中国共产党的奋斗历程密不可分。下列说法错误的是：","options":{"A":"《布尔塞维克》是解放战争时期中国共产党创办的中央机关刊物","B":"《人民日报》由《晋察冀日报》和晋冀鲁豫《人民日报》合并而来","C":"《红色中华》创刊于江西瑞金，初期为中华苏维埃共和国临时中央政府机关报","D":"《求是》杂志是党中央指导全党全国工作的重要思想理论阵地，前身是中共中央主办的《红旗》杂志"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，《布尔塞维克》于1927年10月至1932年7月出版，其名称源自俄语“共产党”的音译，属于中共中央在第二次国内革命战争时期的地下理论机关刊物。而解放战争时期是1946年至1949年。\nB项正确，1948年5月，晋察冀与晋冀鲁豫边区合并为华北解放区，同年6月15日，《晋察冀日报》和晋冀鲁豫《人民日报》合并为《人民日报》，是中国共产党中央委员会机关报。\nC项正确，1931年12月11日，《红色中华》创刊于江西瑞金，初期为中华苏维埃共和国临时中央政府机关报，《红色中华》的任务是发挥中央政府对苏维埃运动的积极领导作用。\nD项正确，《求是》杂志是中国共产党中央委员会主办的机关刊物，是党中央指导全党全国工作的重要思想理论阵地。《求是》杂志创刊于1988年7月1日，其前身是1958年中共中央创办的《红旗》杂志。\n本题为选非题，故正确答案为A。","no":21,"missingImage":false}],"count":21,"answerable":21,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"16070285","cat":"法律常识","stem":"根据《中华人民共和国广告法》，下列属于违法行为的有几项？\n①在广告中使用国旗、国歌\n②在广告中使用国家机关工作人员的名义或者形象\n③电视台以介绍健康、养生知识等形式变相发布医疗、药品、医疗器械、保健食品广告\n④教育、培训广告中利用科研单位、学术机构、专业人士的名义或者形象作推荐、证明","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查法律常识。\n①错误，根据《中华人民共和国广告法》第九条第一项规定：“广告不得有下列情形：（一）使用或者变相使用中华人民共和国的国旗、国歌、国徽，军旗、军歌、军徽；”因此，无论商业目的如何，在广告中使用国旗、国歌均属于违法行为。\n②错误，根据《中华人民共和国广告法》第九条第二项规定：“广告不得有下列情形：（二）使用或者变相使用国家机关、国家机关工作人员的名义或者形象；”因此，国家机关及其工作人员的形象代表公权力，将其在广告中使用属于违法行为。\n③错误，根据《中华人民共和国广告法》第十九条规定：“广播电台、电视台、报刊音像出版单位、互联网信息服务提供者不得以介绍健康、养生知识等形式变相发布医疗、药品、医疗器械、保健食品广告。”选项中，电视台以健康、养生知识为幌子，实则发布医疗、药品等禁止类广告，属于典型的变相发布，因此，属于违法行为。\n④错误，根据《中华人民共和国广告法》第二十四条第三项规定：“教育、培训广告不得含有下列内容：（三）利用科研单位、学术机构、教育机构、行业协会、专业人士、受益者的名义或者形象作推荐、证明。”因此，教育、培训广告中利用科研单位、学术机构、专业人士的名义或者形象作推荐、证明属于违法行为。\n故①②③④均属于违法行为，共4项。\n故正确答案为D。","no":22,"missingImage":false},{"type":"question","qid":"16069956","cat":"人文常识","stem":"“二十四史”是中国历代史学家精心编撰的纪传体史书，是中华民族珍贵的文化遗产。下列说法正确的是：","options":{"A":"《后汉书》记载了侯景之乱","B":"《南史》是南朝范晔编撰的史书","C":"《汉书》中《艺文志》是记述经济制度的专篇","D":"《史记》卷次中《五帝本纪》排序在《殷本纪》之前"},"answer":"D","explanation":"本题考查人文常识。\nA项错误，《后汉书》是南朝宋范晔编撰的史书，创作于南朝宋元嘉年间，是一部记载东汉历史的纪传体断代史。《后汉书》主要记述了上起东汉的汉光武帝建武元年（25年），下至汉献帝建安二十五年（220年），共195年的史事。而侯景之乱发生在南北朝时期的梁朝，属于南朝历史事件，时间远晚于东汉，不可能出现在《后汉书》中。\nB项错误，《南史》是中国历代官修正史“二十四史”之一，记述上起宋武帝刘裕永初元年（420年），下迄陈后主陈叔宝祯明三年（589年），包含南朝宋、齐、梁、陈四个朝代共一百七十年的历史。《南史》与《北史》为姊妹篇，由李大师及其子李延寿两代人编撰完成，而非范晔。\nC项错误，《汉书》由东汉班固编撰，班昭、马续补作，是中国首部纪传体断代史，成书于汉和帝年间，与《史记》《后汉书》《三国志》并称“前四史”。《汉书》中的《艺文志》在西汉刘歆《七略》基础上改编而成，是中国古代第一部系统性的图书目录、学术源流专篇，主要记录当时存世典籍、分类与学术流派。而记述经济制度、财政、农业、工商业等内容的专篇是《食货志》。\nD项正确，《史记》是西汉史学家司马迁撰写的纪传体史书，是中国历史上第一部纪传体通史，记载了上至上古传说中的黄帝时代，下至汉武帝太初四年间共三千多年的历史。全书由十二本纪、十表、八书、三十世家、七十列传构成，其中“本纪”是全书提纲，以王朝的更替为体，按年月时间记述帝王的言行政绩，照历史时间顺序：《五帝本纪》居首，其后依次为《夏本纪》《殷本纪》《周本纪》等。五帝时代早于殷商，因此《五帝本纪》在卷次排序上位于《殷本纪》之前。\n故正确答案为D。","no":23,"missingImage":false},{"type":"question","qid":"16069939","cat":"人文常识","stem":"关于我国考古发现，下列说法错误的是:","options":{"A":"良渚文化主要分布于太湖地区，其文化遗址最大特色是所出土的玉器","B":"仰韶文化主要分布在黄河支流汇集的中原地区，其中较著名的是元谋人遗址","C":"大汶口文化主要分布在泰山周围地区，氏族墓地中晚期出现了男女合葬现象","D":"龙山文化是新石器时代晚期的文化，其陶器已开始使用轮制技术，器型规整"},"answer":"B","explanation":"A项正确，良渚文化是我国长江下游太湖流域新石器时代晚期的重要文化，距今约5300—4300年。该文化以大型古城址、祭坛、水利系统和大量制作精美的玉琮、玉璧、玉钺等礼器为突出特征，玉器工艺发达，象征着较高的社会等级与早期国家形态。\nB项错误，仰韶文化是黄河中游地区新石器时代的代表性文化，以彩陶为典型标志，著名遗址有陕西西安半坡遗址、河南陕县庙底沟遗址等。元谋人遗址位于云南元谋县，属于旧石器时代早期古人类遗址，与仰韶文化在时代、地域、文化属性上均不相符。\nC项正确，大汶口文化主要分布在以泰山为中心的黄河下游地区，距今约6500—4500 年。其墓葬材料丰富，早期以单人葬为主，中晚期出现男女合葬、夫妻合葬，同时墓葬规模与随葬品差异明显，反映出私有制出现、贫富分化与社会阶层逐步形成。\nD项正确，龙山文化是新石器时代晚期文化，主要分布于黄河中下游地区，距今约4500—4000 年。该文化普遍掌握快轮制陶技术，陶器以黑陶为代表，胎质细腻、器壁轻薄、造型规整，标志着我国史前制陶工艺达到较高水平。\n本题为选非题，故正确答案为B。","no":24,"missingImage":false},{"type":"question","qid":"16070161","cat":"经济常识","stem":"关于金融知识，下列说法错误的是：","options":{"A":"外汇结构性理财产品可以挂钩大宗商品、对冲基金、黄金石油等标的","B":"股票净值，又称股票的票面价值，是指每股股票所包含的实际资产的价值","C":"开放式基金是指基金份额总额不固定，基金份额可以在基金合同约定的时间和场所申购或赎回的基金","D":"债券的票面利率取决于债券发行时的市场利率、债券期限、发行者信用水平、债券的流动性水平等因素"},"answer":"B","explanation":"本题考查经济常识。\nA项正确，外汇结构性理财产品是一种将固定收益类资产与金融衍生品结合的理财产品。它们通常会设定一个最低保本额，保本额上的浮动收益取决于产品挂钩标的的表现。这些挂钩标的可以非常广泛，包括大宗商品、境外上市的股票价格或指数、对冲基金和黄金石油等。\nB项错误，股票净值亦称“股票的账面价值”，指每个普通股能够分配到的公司会计账面上的净价值，是股票所含实际资产的价值。它等于公司净值减去流通在外的公司优先股总面额后的余额再除以流通在外的普通股数。“股票的票面价值”是一个固定的数值，主要用于表明股票所代表的资本数额和在公司总股本中的比例，但它并不直接反映股票的实际资产的价值。\nC项正确，按基金运作方式不同，基金可分为封闭式基金和开放式基金。其中开放式基金是指基金份额总额不固定，基金份额可以在基金合同约定的时间和场所申购或者赎回的基金。\nD项正确，债券的票面利率取决于债券发行时的市场利率、债券期限、发行者信用水平、债券的流动性水平等因素。发行时市场利率越高，票面利率就越高；债券期限越长，票面利率就越高；发行者信用水平越高，票面利率就越低；债券的流动性越高，票面利率就越低。\n本题为选非题，故正确答案为B。","no":25,"missingImage":false},{"type":"question","qid":"16069972","cat":"人文常识","stem":"下列诗文与人物对应错误的是（    ）。","options":{"A":"服牛乘马，衣裳是制—轩辕氏","B":"尝谷教民，爰制农事—神农氏","C":"木德风姓，八卦创焉—老聃","D":"始作书契，以代结绳—仓颉"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，出自三国时期曹植的《黄帝赞》，意思为驯服牛马作为交通工具，制作衣裳，开创文明礼制。歌颂黄帝（轩辕氏）做出的贡献。\nB项正确，出自出自明代孙承恩的《古像赞二百零五首·其三·神农》，意思为神农氏亲自尝试各种谷物，教导民众耕种，并制定了农耕的规章制度。此外，神农氏也尝百草，发明医药等。\nC项错误，出自三国时期曹植的《伏羲赞》，意思为伏羲作为东方木德之君，承风姓之始，首创八卦。因此对应的人物为伏羲。老聃就是老子，姓李名耳，字聃，春秋末期思想家、哲学家，道家学派创始人。\nD项正确，出自《四体书势》，意思为仓颉最早创造了文字，用来代替过去结绳记事的方法。\n本题为选非题，故正确答案为C。","no":26,"missingImage":false},{"type":"question","qid":"16070158","cat":"人文常识","stem":"关于社会保险，下列说法正确的是：","options":{"A":"灵活就业人员可以参加职工基本医疗保险","B":"失业者领取失业保险金的期限与累计缴费年限无关","C":"同一统筹地区内用人单位工伤保险执行统一缴费费率","D":"生育保险待遇中的生育津贴按职工本人上年度的月平均工资计发"},"answer":"A","explanation":"本题考查经济常识。\nA项正确，根据《中华人民共和国社会保险法》第二十三条第二款规定：“无雇工的个体工商户、未在用人单位参加职工基本医疗保险的非全日制从业人员以及其他灵活就业人员可以参加职工基本医疗保险，由个人按照国家规定缴纳基本医疗保险费。”\nB项错误，根据《中华人民共和国社会保险法》第四十六条规定：“失业人员失业前用人单位和本人累计缴费满一年不足五年的，领取失业保险金的期限最长为十二个月；累计缴费满五年不足十年的，领取失业保险金的期限最长为十八个月；累计缴费十年以上的，领取失业保险金的期限最长为二十四个月。重新就业后，再次失业的，缴费时间重新计算，领取失业保险金的期限与前次失业应当领取而尚未领取的失业保险金的期限合并计算，最长不超过二十四个月。”因此，失业者领取失业保险金的期限与累计缴费年限有关。\nC项错误，根据《工伤保险条例》第八条规定：“工伤保险费根据以支定收、收支平衡的原则，确定费率。国家根据不同行业的工伤风险程度确定行业的差别费率，并根据工伤保险费使用、工伤发生率等情况在每个行业内确定若干费率档次。行业差别费率及行业内费率档次由国务院社会保险行政部门制定，报国务院批准后公布施行。统筹地区经办机构根据用人单位工伤保险费使用、工伤发生率等情况，适用所属行业内相应的费率档次确定单位缴费费率。”因此，同一统筹地区内的工伤保险会根据不同行业确定差别费率，而不是执行统一缴费费率。\nD项错误，根据《中华人民共和国社会保险法》第五十六条规定：“职工有下列情形之一的，可以按照国家规定享受生育津贴：（一）女职工生育享受产假；（二）享受计划生育手术休假；（三）法律、法规规定的其他情形。生育津贴按照职工所在用人单位上年度职工月平均工资计发。”因此，生育津贴按照职工所在用人单位上年度职工月平均工资计发，而不是‌按职工本人月均工资计发。\n故正确答案为A。","no":27,"missingImage":false},{"type":"question","qid":"16069959","cat":"人文常识","stem":"下列语句与其所蕴含的经济学原理对应正确的是：","options":{"A":"物以多为贱——沉没成本","B":"酒香不怕巷子深——买方市场","C":"众人拾柴火焰高——规模经济","D":"物至而反，冬夏是也。致至而危，累棋是也——边际效用递增"},"answer":"C","explanation":"本题考查经济常识。\nA项错误，“物以多为贱”反映的是供给影响价格的供需原理，供大于求，价格下跌；供小于求，价格上升。所以“物以多为贱”反映的是商品供给过剩导致价格下跌。沉没成本指已发生且不可回收的支出，如已经流逝的时间、金钱或精力等，与物品贵贱无关。\nB项错误，买方市场指商品供大于求导致买方占据交易优势的市场形态。反之，卖方市场指商品供不应求促使卖方掌握主动权的市场形态。“酒香不怕巷子深”描述优质产品无需广告即可吸引消费者，体现的是卖方占据主导地位，所以应该是卖方市场。\nC项正确，规模经济指随着生产规模扩大，单位产品的平均成本下降，效率提升。“众人拾柴火焰高”形象比喻集体协作能放大产出效益，与企业通过扩大生产、分工协作降低单位成本的经济逻辑相符合。\nD项错误，“物至而反，冬夏是也。致至而危，累棋是也”大意为事物发展到极致必转向反面，对应经济学中的边际效用递减，即随着消费者对某种物品消费量的增加，每增加消费一单位该物品带来的满足感递减，甚至转为负效用。而边际效用递增是指随着消费者对某种物品的消费量增加，每增加消费一单位该物品所带来的满足感逐步上升。\n故正确答案为C。","no":28,"missingImage":false},{"type":"question","qid":"16070172","cat":"人文常识","stem":"《黄帝内经》中“是故圣人不治已病治未病”的思想是中医养生的重要理念，倡导通过饮食、运动、情志调节等方式增强体质，未病先防。下列古诗词中描述的行为不符合“治未病”理念的是（    ）。","options":{"A":"天寒常早睡，不待日光敛","B":"修性以保神，安心以全身","C":"抽刀断水水更流，举杯消愁愁更愁","D":"食惟半饱无兼味，酒至三分莫过频"},"answer":"C","explanation":"本题考查文化常识。\n“治未病”意为未病先防、养生、顺自然。\nA项正确，诗句出自宋代释文珦的五言古诗《早睡》。意思为天气冷了就早早睡觉，不等太阳完全落山就休息。选项内容顺应天时、规律作息，符合“治未病”的养生理念。\nB项正确，诗句出自三国魏嵇康的经典养生名篇《养生论》。意思为修养性情、调摄心性，以此保养精神、守护心神；安定内心、平和情志，以此保全身体、养护生命。选项内容符合“治未病”的养生理念。\nC项错误，诗句出自唐代李白的《宣州谢朓楼饯别校书叔云》。意思为拔刀断水水却更加汹涌奔流，举杯消愁愁情上却更加浓烈。过量饮酒伤神伤身，不符合“治未病”理念。\nD项正确，诗句出自明代龚廷贤的养生名篇《摄养诗》。意思为吃饭只吃半饱（七八分饱），不追求多种油腻、浓烈的味道，饮食清淡简单。喝酒只喝到三分微醺即可，不要频繁饮酒。饮食有节、不过量饮酒，符合“治未病”的养生理念。\n本题为选非题，故正确答案为C。","no":29,"missingImage":false},{"type":"question","qid":"16070218","cat":"地理国情","stem":"极光是一种绚丽多彩的大气发光现象，一般只在南北两极的高纬度地区出现，它的形成与太阳活动、地球磁场和高层大气的相互作用有关。由此判断观测极光需要的条件是（    ）。","options":{"A":"太阳活动强烈，月圆的夜晚","B":"太阳活动强烈，晴朗的夜晚","C":"太阳活动微弱，多云的夜晚","D":"太阳活动微弱，下雨的夜晚"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，B项正确，极光的产生依赖于太阳活动释放的高能带电粒子与地球磁场的相互作用。当太阳活动强烈时，更多高能带电粒子进入地球两极，激发高层大气中的原子发光，形成极光。而极光亮度较低，需在无云层遮挡且无其他光污染的晴朗夜晚才能清晰观测。但月圆的夜晚通常月光强烈，明亮的月光会严重削弱极光的可见度，甚至使其完全不可见。故“太阳活动强烈，晴朗的夜晚”可以观测到极光。\n‌C、D两项错误，太阳活动微弱时，太阳风强度降低，进入地球两极的高能带电粒子减少，极光出现的频率和强度显著降低，甚至无法形成可见极光。下雨意味着云层厚密，而在多云的夜晚，云层会完全遮挡极光，不具备极光的观测条件。\n故正确答案为B。","no":30,"missingImage":false},{"type":"question","qid":"16069971","cat":"人文常识","stem":"咖啡因是一种中枢神经兴奋剂，能够暂时驱走睡意并恢复精力，咖啡、茶和能量饮料中都含有咖啡因成分。下列有关说法正确的是（    ）。","options":{"A":"过量饮用能量饮料可能引发心脏不适","B":"茶叶颜色的深浅能反映咖啡因的含量多少","C":"未经发酵的绿茶，咖啡因含量比完全发酵的红茶高","D":"相比常压下煮出的咖啡，蒸汽加压煮的咖啡所含咖啡因含量更低"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，能量饮料通常含有高浓度咖啡因及其他兴奋成分（如牛磺酸、瓜拉纳等），过量摄入咖啡因会导致中枢神经与心血管系统兴奋，可能引发心脏不适，导致心率加快、血压升高、心悸、心律异常等。\nB项错误，茶叶颜色的深浅与咖啡因含量无直接关联。茶叶颜色由发酵程度和氧化程度决定（如绿茶未发酵，颜色浅；红茶全发酵，颜色深），而咖啡因含量主要取决于茶树品种、采摘部位、冲泡方式等。\n‌C项错误，未经发酵的绿茶与完全发酵的红茶之间的咖啡因含量高低无固定规律，同原料前提下，绿茶与红茶咖啡因总量相近。因为咖啡因实际含量更多取决于茶树品种、嫩度、冲泡条件，与是否发酵无必然高低关系。\nD项错误，咖啡因溶出率与压力、温度、时间呈正相关，相比常压下煮出的咖啡，蒸汽加压（如意式浓缩咖啡的制作方法）属于高温高压短时间萃取，单位体积咖啡液中所含咖啡因含量更高，而非“更低”。\n故正确答案为A。","no":31,"missingImage":false},{"type":"question","qid":"16069917","cat":"科技常识","stem":"下列选项体现的物理原理与其他选项不同的是（    ）。","options":{"A":"三角形的泡泡棒吹出的泡泡总是趋于球状","B":"植物根部的毛细管从土壤中吸收水分","C":"眼镜镜片的表面镀膜可以防蓝光","D":"雨后荷叶上的水珠呈球形"},"answer":"C","explanation":"本题考查科技常识。\nA、D两项正确，三角形的泡泡棒吹出的泡泡最终呈球形，雨后荷叶上的水珠呈球形，都是因为液体表面张力的作用，表面张力会使液体表面尽可能收缩到最小表面积（相同体积下球形表面积最小），因此体现的是表面张力原理。\nB项正确，毛细作用是液体表面对固体表面的吸引力。当毛细管插入浸润液体中，管内液面上升，高于管外液面；毛细管插入不浸润液体中，管内液体下降，低于管外液面。植物根部毛细管从土壤中吸水，利用的是毛细现象，而毛细现象本质上是液体表面张力与附着层分子相互作用力共同作用的结果，核心原理是表面张力。\nC项错误，眼镜镜片的表面镀膜防蓝光，利用的是光的干涉原理。镜片表面镀多层纳米级光学薄膜，蓝光入射时，在膜层上表面与下表面分别反射，两束反射光相位相反、发生相消干涉，大幅降低蓝光透过率。与表面张力无关。\n本题为选非题，故正确答案为C。","no":32,"missingImage":false},{"type":"question","qid":"16070217","cat":"科技常识","stem":"炎炎夏日，花露水是人们常备的避暑物品。花露水以乙醇、香精、蒸馏水为主要原料混合配制，颜色多为淡湖蓝、绿、黄。下列有关说法正确的是（    ）。","options":{"A":"花露水具有消毒杀菌作用","B":"花露水可以消除蚊子叮咬的肿包","C":"花露水放在暴晒的车内没有安全隐患","D":"在患处擦拭花露水能有效改善过敏性皮炎症状"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，花露水以乙醇、香精、蒸馏水为主要原料配制而成，其中乙醇（酒精）浓度通常在50%-75%，主流产品多为70%左右，该浓度区间能使微生物蛋白质变性，起到良好的消毒杀菌作用，可用于日常去污、抑菌、防痱、止痒等场景。\nB项错误，花露水对于蚊虫叮咬后产生的肿包没有促进消除的作用，酒精挥发吸热可以暂时止痒，某些花露水中含有的薄荷、冰片等成分也有清凉止痒效果。被蚊虫叮咬后，如果皮肤已有破损，涂抹花露水反而可能加重创面刺激，正确的做法是选用炉甘石洗剂或合规的糖皮质激素类药膏。\nC项错误，花露水含有大量酒精，属于易燃易爆物品。在夏季暴晒的车内，温度可高达\u003cimg data-k=\"665d47a9336c\">以上，密闭空间内酒精大量挥发，会形成易燃易爆的混合气体，遇静电、明火极易引发燃烧甚至爆炸，因此花露水严禁长时间放在暴晒的车内。\nD项错误，花露水中的酒精、香精等成分会刺激本就受损的皮肤屏障，加重过敏性皮炎的红肿、灼热感，甚至诱发更严重的过敏反应。皮炎患者应避免使用花露水，及时就医并使用专用药物治疗。\n故正确答案为A。","no":33,"missingImage":false},{"type":"question","qid":"16070166","cat":"人文常识","stem":"若将一个弹簧拉力器的一端固定在天花板上，握住另一端用力缓慢竖直下拉，假设弹簧具有一定的质量且均匀分布，则弹簧拉力器最可能断裂的位置是（    ）。","options":{"A":"弹簧拉力器的上部","B":"弹簧拉力器的中部","C":"弹簧拉力器的下部","D":"上、下部同时断裂"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，弹簧自身有均匀分布的质量，缓慢下拉过程中，弹簧上部不仅要承受人手施加的拉力，还要承担下方整段弹簧的全部重力，越靠近上端，弹簧所承受的总张力越大，应力也最大，因此最容易在此处发生断裂。\nB项错误，中部弹簧仅需承受人手拉力与下方一半弹簧的重力，所受张力明显小于上端，应力水平不足以使其先于上部断裂。\nC现错误，下部弹簧只需要承受人手施加的拉力，无需承担额外的弹簧自重，所受张力最小，是整根弹簧中应力最低的位置，几乎不会最先断裂。\nD项错误，由于弹簧上下位置的受力存在显著差异，上部受力远大于下部，应力分布极不均匀，不可能出现上下同时达到断裂极限的情况。\n故正确答案为A。","no":34,"missingImage":false},{"type":"question","qid":"16069915","cat":"科技常识","stem":"下列异常的体检指标，与其关联的疾病最不可能对应的是（    ）。","options":{"A":"白细胞数量高于参考范围的上限——阑尾炎","B":"谷丙转氨酶高于参考范围的上限——冠心病","C":"红细胞数量低于参考范围的下限——贫血症","D":"甲胎蛋白浓度高于参考范围的上限——肝癌"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，白细胞是人体免疫系统的核心功能细胞，外周血白细胞总数升高，是急性细菌性感染、化脓性炎症反应的标志性指标。阑尾炎的核心发病机制是阑尾管腔堵塞后继发肠道细菌感染，引发的急性化脓性炎症，属于典型的腹腔细菌感染性疾病。急性阑尾炎发作时，机体免疫系统快速激活，大量白细胞增殖并趋化至炎症病灶，直接导致外周血白细胞总数显著高于参考上限。\nB项错误，谷丙转氨酶90%以上储存于人体肝细胞的胞质中，心肌、骨骼肌等其他组织中含量极低。只有当肝细胞受损、细胞膜完整性被破坏时，大量谷丙转氨酶才会释放进入血液，导致外周血检测值显著升高。故谷丙转氨酶是临床诊断肝细胞损伤、肝脏疾病的特异性、敏感性核心指标，冠心病本身不会导致谷丙转氨酶升高。冠心病全称冠状动脉粥样硬化性心脏病，是冠状动脉粥样硬化导致血管狭窄、心肌缺血缺氧引发的心脏疾病，其特异性生物标志物是肌钙蛋白等。\nC项正确，贫血症指外周血中单位容积内的红细胞计数、血红蛋白浓度、红细胞比容低于同年龄、同性别、同地区健康人群的参考范围下限的一种病理状态。其中，红细胞数量减少是贫血最核心的病理表现之一。\nD项正确，甲胎蛋白是原发性肝细胞癌的特异性肿瘤标志物。生理状态下，甲胎蛋白主要由胎儿肝细胞合成，出生后合成能力迅速下降，健康成人外周血中甲胎蛋白浓度极低。当肝细胞发生癌变时，癌变的肝细胞可能重新获得合成甲胎蛋白的能力，导致外周血甲胎蛋白浓度显著升高。\n本题为选非题，故正确答案为B。","no":35,"missingImage":false}],"count":14,"answerable":14,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"16069882","cat":"逻辑填空","stem":"中国有着悠久灿烂的文明，同时开创了人类历史上最为            的现代化进程，中国故事精彩非凡、激动人心，也需要精彩讲述、更好传播。\n填入画横线部分最恰当的一项是：","options":{"A":"五彩斑斓","B":"流光溢彩","C":"波澜壮阔","D":"汹涌澎湃"},"answer":"C","explanation":"横线处所填成语搭配“现代化进程”，且根据文意可知，横线处应体现中国现代化进程气势宏大、规模宏伟。C项“波澜壮阔”比喻声势雄壮或规模巨大，多用于形容事业、进程等，与“现代化进程”搭配恰当，且符合文意，当选。\nA项“五彩斑斓”指多种颜色错杂而繁多耀眼，B项“流光溢彩”形容光彩明亮华丽，跳动闪烁，均多用于形容色彩，与“现代化进程”搭配不当，排除；D项“汹涌澎湃”多形容声势浩大，不可阻挡，常用来形容水流、情绪等，与“现代化进程”搭配不当，排除。\n故正确答案为C。\n【文段出处】人民网《以中国话语讲好中国故事（新论）》","no":36,"missingImage":false},{"type":"question","qid":"16069880","cat":"逻辑填空","stem":"《永乐大典》成书于明永乐六年，是中国古代最大的类书，《不列颠百科全书》称其为“世界有史以来最大的百科全书”，共计22937卷，11095册，约3.7亿字，收先秦至明初的各类典籍七八千种，被称为典籍        、佚书宝库。","options":{"A":"本源","B":"渊薮","C":"桂冠","D":"文荟"},"answer":"B","explanation":"顿号提示横线处与“佚书宝库”构成并列，且根据“世界有史以来最大的百科全书”“收先秦至明初的各类典籍七八千种”可知，横线处应体现《永乐大典》汇聚了各类典籍之意，B项“渊薮”指人或事物聚集的地方，置于此处表达典籍汇集之意，为常见表达，符合文意，当选。\nA项“本源”指事物产生的根源，横线处强调的是典籍的汇聚，而非根源，排除；\nC项“桂冠”指竞赛中的冠军，与文意无关，排除；\nD项“文荟”指文化、文艺精华汇聚之所或文化荟萃的状态‌，常被用作机构、场所或活动的名称，“文”与“典籍”重复，排除。\n故正确答案为B。\n【文段出处】长江日报《&lt;永乐大典&gt;是怎样上“热搜”的》","no":37,"missingImage":false},{"type":"question","qid":"16069895","cat":"逻辑填空","stem":"未来，数字科技将会持续深度赋能文化产业，数字文化产业新模式、新业态更加丰富，文化产业的产业链、生态链、价值链更为        。我们应着重培养市场主体，探索建构文化全产业链，        文化供给与文化需求的错位，引导文化企业坚持社会效益与经济效益的高度统一，不断提升文化产品和服务的供给质量。\n依次填入画横线部分最恰当的一项是：","options":{"A":"完备 消解","B":"完善 拉开","C":"完好 弥补","D":"完美 避开"},"answer":"A","explanation":"本题可从第二空入手，横线处词语搭配“错位”，根据 “应着重培养市场主体，探索建构文化全产业链”“引导文化企业坚持社会效益与经济效益的高度统一”可知，横线处应表达要解决、消除文化供给与需求不匹配、不协调的问题。A项“消解”意为消释、消除，与“错位”搭配恰当，符合文意，保留。B项“拉开”指摆开，放开，增加差距，置于此处表达让错位变得更大，与文意相悖，排除；C项“弥补”指补偿、填补，常搭配“短板”“不足”等，与“错位”搭配不当，排除；D项“避开”指躲开、回避，侧重主动绕开问题，不主动解决，文段强调要主动消除错位，与“错位”搭配不当且与文意不符，排除。\n第一空，代入验证。搭配“产业链、生态链、价值链”，且根据“数字科技将会持续深度赋能文化产业，数字文化产业新模式、新业态更加丰富”可知，横线处应表达相关产业链条变得齐全，完整，A项“完备”指应该有的全都有了，符合文意，当选。\n故正确答案为A。\n【文段出处】云南师范大学学报（哲学社会科学版）《“十四五”我国文化产业高质量发展的战略定位与路径选择》","no":38,"missingImage":false},{"type":"question","qid":"16069945","cat":"逻辑填空","stem":"勤劳智慧的黔东南人民始终        着与大自然“万物共生”的传统，响应季节变化，熟悉土地秉性，主动顺应、融入大自然生态系统，形成了生态养殖、种植和绿色循环、发展的完整生物链。作为典型的人工生态系统，从江稻鱼鸭复合系统具有保护生物多样性、控制病虫害、调节气候、        水源等多种生态功能。\n依次填入画横线部分最恰当的一项是：","options":{"A":"坚守 涵养","B":"遵守 滋润","C":"恪守 蓄积","D":"信守 保持"},"answer":"A","explanation":"第一空，搭配“传统”，A项“坚守”指坚定遵守，不背离，B项“遵守”指依照规定行动，不违背，C项“恪守”指严格遵守，均与“传统”搭配恰当，保留。D项“信守”指忠诚地遵守，常搭配“承诺”等，与“传统”搭配不当，排除。\n第二空，搭配“水源”，A项“涵养”指蓄积并保持（水分等），与“水源”搭配恰当，当选。B项“滋润”指增添水分，使不干枯，与“水源”搭配不当，排除；C项“蓄积”指积聚储存，与“水源”搭配不当，且不及A项“涵养”语义丰富，排除。\n故正确答案为A。\n【文段出处】光明网《稻鱼鸭共生：这一人工生态系统何以在黔东南流传千年？》","no":39,"missingImage":false},{"type":"question","qid":"16069936","cat":"逻辑填空","stem":"约有20%的人出生时至少携带一个名为APOE4的基因变异拷贝。该变异使人年老时更易患心脏病，但这种变异却没有被淘汰。研究发现，APOE4基因可能具有抵消其他负面影响的        好处，如携带APOE4的儿童可以更好地清除肠道寄生虫，而携带这种基因的女性会生育更多的孩子。这种生育优势可能使该致病基因在人类进化过程中得以        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"潜在 延续","B":"特殊 发展","C":"显性 保存","D":"隐性 入选"},"answer":"A","explanation":"第一空，根据“携带APOE4的儿童可以更好地清除肠道寄生虫”可知，横线处应体现APOE4基因有一些不为人知的好处，这些好处不是马上就能显现出来之意。A项“潜在”指存在于事物内部尚未显露出来的，D项“隐性”指性质或性状不表现在外的，均符合文意，保留。B项“特殊”强调特别、与众不同，与文意不符，排除；C项“显性”指明显表现出来，与文意相悖，排除。\n第二空，根据“携带这种基因的女性会生育更多的孩子。这种生育优势可能使该致病基因在人类进化过程中”可知，横线处应体现因为这种生育优势，致病基因得以留存下来之意。A项“延续”指照原来样子继续下去，符合文意，当选。D项“入选”指中选、当选，与文意不符，排除。\n故正确答案为A。\n【文段出处】《常见阿尔茨海默病基因可能让人类祖先有更多孩子》","no":40,"missingImage":false},{"type":"question","qid":"16069950","cat":"逻辑填空","stem":"马的移动能力强且速度快，有了马的        ，人类的畜牧规模必然会有所        ，聚落的大小、位置以及聚落之间的距离也会随之出现一定程度的变化。\n依次填入画横线部分最恰当的一项是：","options":{"A":"参与 改变","B":"帮助 精简","C":"协助 扩大","D":"介入 增加"},"answer":"C","explanation":"第一空，根据“有了马的······人类的畜牧规模”可知，横线处应体现马在人类畜牧活动中所起到的作用。A项“参与”指参加，B项“帮助”指替人出力、出主意或给予物质上、精神上的支援，C项“协助”指从旁提供帮助或辅助，均与文意相符，保留。D项“介入”指插入其中进行干预，强调主动干预，与文中“马”这一主体特性不符，排除。\n第二空，搭配“规模”，且根据“马的移动能力强且速度快”可知，横线处应体现马对人类畜牧规模变化起到积极作用。C项“扩大”指使（范围、规模等）比原来大，与“规模”搭配恰当，且与文意相符，当选。A项“改变”指事物发生显著的差别，置于横线处仅能体现规模发生变化，无法体现是积极的变化还是消极的变化，与C项相较，“扩大”更契合文意，排除；B项“精简”指去掉不必要的，留下必要的，与文意相悖，排除。\n故正确答案为C。\n【文段出处】中国社会科学网《骑马术在欧亚草原的流行与在中国的兴起》","no":41,"missingImage":false},{"type":"question","qid":"16069963","cat":"逻辑填空","stem":"现有研究认为，虚拟孵化之所以能培育创业企业，是基于网络聚集了人力和资本资源，帮助创业企业实现了资源        。事实上，无论是传统孵化还是虚拟孵化，提供资源是孵化平台帮助创业企业克服新生        、获取竞争优势的重要方式。\n依次填入画横线部分最恰当的一项是：","options":{"A":"汇聚 颓势","B":"聚积 弱势","C":"聚拢 态势","D":"聚合 劣势"},"answer":"D","explanation":"本题可从第二空入手，根据文意及顿号可知，横线处所填词语与“新生”搭配且与后文的“优势”构成反义并列关系，表达创业企业处于新生阶段，面临着竞争中的不利条件或不足之处之意。B项“弱势”指力量弱小的地位或状态，D项“劣势”指在力量或态势上处于比对方不利的条件或地位，置于此处都能表达出新生企业在竞争中相对不利的状况，符合文意，保留。A项“颓势”指衰败、没落的趋势或形势，通常用于描述事物已经出现明显的衰败迹象，但新生企业处于起步和成长初期，只是相对基础薄弱、竞争力不足，而非已呈现出衰败的趋势，与文意不符，排除；C项“态势”指状态和形势，为中性词，无法体现出新生企业面临的不利状况，排除。\n第一空，搭配“资源”，且根据文意可知，横线处词语表示因网络聚集了人力和资本资源为创业企业带来的积极作用，应与前文的“聚集”在语义上构成对应。D项“聚合”指聚集并结合，强调不仅集中，还能整合为一体，常搭配“资源”，能很好地体现虚拟孵化将人力和资本资源整合为一个有机整体的过程，符合文意，当选。B项“聚积”强调的是通过长时间的积累使数量增多，常搭配“财富”“物资”等，侧重于积累的过程，而文段强调的是虚拟孵化借助网络对人力和资本资源进行整合，并非单纯数量上的积累，与文意不符，排除。\n故正确答案为D。\n【文段出处】知网《虚拟孵化对创业企业数字化的使能机理：组织学习视角的案例研究》","no":42,"missingImage":false},{"type":"question","qid":"16069931","cat":"逻辑填空","stem":"在一般印象里，香水是比较晚近的舶来品，但这里的“香水”指的是发展成熟的香精香水。20世纪初，香港的广生行和上海中西大药房        引进了淡香精香水“佛罗里达水”，借用欧阳修词中“花露重，草烟低，人家帘幕垂”的句子，命名为“花露水”。这种淡绿色香水主要使用玫瑰与麝香香精，在此后数十年里        中国，是中国最流行的香调。所以，有人将花露水称为中国最早的香水，也不能说没有依据。\n依次填入画横线部分最恰当的一项是：","options":{"A":"先后 遍及","B":"率先 风靡","C":"抢先 享誉","D":"分别 席卷"},"answer":"B","explanation":"第一空，根据“在一般印象里，香水是比较晚近的舶来品”“有人将花露水称为中国最早的香水”可知，横线处要体现出香港的广生行和上海中西大药房在较早的时候就引进了香水，B项“率先”指带头，首先，C项“抢先”指赶在别人前头，争先，均符合文意，保留。A项“先后”指前后相继，侧重香港的广生行和上海中西大药房这两家引进香水的先后顺序，D项“分别”指分头，各自，均与文意不符，排除。\n第二空，根据“是中国最流行的香调”可知，横线处要体现出花露水在此后数十年里很流行之意，B项“风靡”指草木随风而倒，形容事物很风行，符合文意，当选。C项“享誉”指在社会上取得声誉，以此体现其品质好口碑好之意，而文段仅仅表达流行之意，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《中国古代的“香水”》","no":43,"missingImage":false},{"type":"question","qid":"16069929","cat":"逻辑填空","stem":"高山草甸四周海拔较高的陡峭山地往往是不同生态系统的交界处，生存环境和食物资源更为多样，这使得赤狐可以大展拳脚，        在不同景观的边缘，将捕食效率最大化，同时也将风险降至最低，可谓            。即使在内蒙古达赉湖、宁夏贺兰山等地，赤狐的洞穴也经常出现。\n依次填入画横线部分最恰当的一项是：","options":{"A":"逡巡 从容不迫","B":"盘桓 张弛有度","C":"游走 进退自如","D":"驻留 攻守兼备"},"answer":"C","explanation":"第一空，根据“······在不同景观的边缘，将捕食效率最大化，同时也将风险降至最低”可知，横线处所填词语需体现赤狐能够主动、灵活地穿梭在不同景观边缘的意思，C项“游走”指四处走动、来回移动，置于此处能够体现赤狐的动态性和灵活性，符合文意，保留。A项“逡巡”指有所顾虑而徘徊不前，文段并未体现赤狐有所顾虑，排除；B项“盘桓”指逗留、徘徊，D项“驻留”指在某处暂时停留，两项均强调“停留不走”的状态，与文意不符，排除。\n第二空，代入验证。C项“进退自如”指无论是前进还是后退都能得心应手，可对应前文“捕食效率最大化”（进）和“风险降至最低”（退），与文意相符，当选。\n故正确答案为C。","no":44,"missingImage":false},{"type":"question","qid":"16069937","cat":"逻辑填空","stem":"一种能监测心脏术后并发症的新设备可以完成比传统的起搏器更复杂的监测。起搏器只能提供心脏的整体图像，但新设备可以提供更        的图像，具体显示出心脏哪些区域功能不正常。其上分布的微电极阵列可从心房的多个位置绘制电信号活动，并按需传递电刺激，以便在        的时候解除房颤，恢复正常心律。\n依次填入画横线部分最恰当的一项是：","options":{"A":"清晰 需要","B":"细致 关键","C":"直观 适当","D":"完整 凶险"},"answer":"B","explanation":"第一空，根据横线前转折词“但”及后文“具体显示出心脏哪些区域功能不正常”可知，横线处所填词语应与“整体”构成转折关系，表达新设备提供的图像更具体、更精细之意。B项“细致”指精细周密，符合文意，保留。A项“清晰”指清楚，而文段并未对比图像的清晰度，且其反义词应为“模糊”，无法与“整体”构成转折，排除；C项“直观”指直接观察的，与具体、精细无关，排除；D项“完整”指没有损坏或残缺，与“整体”语义相近，无法构成转折关系，排除。\n第二空，代入验证。B项“关键”比喻事物最紧要的部分，对事情起决定作用的因素，置于此处能表达在重要、紧急时刻解除房颤之意，逻辑合理，当选。\n故正确答案为B。\n【文段出处】《可溶解的心脏监测设备》","no":45,"missingImage":false},{"type":"question","qid":"16069947","cat":"逻辑填空","stem":"史诗类电视剧可以被视为一种文化记忆的        ，其目的不仅是呈现特定时期的历史社会文本，而且也是向观众传递镌刻在历史中的社会价值和思想观念。经由历史重现，向观众传递正确的社会价值和思想观念，是史诗类电视剧创制的            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"表现 金科玉律","B":"投影 玉圭金臬","C":"展示 不二之选","D":"再现 应有之义"},"answer":"D","explanation":"第一空，横线处形容“史诗类电视剧”与“文化记忆”之间的关系，根据横线后“呈现特定时期的历史社会文本”可知，横线处应体现出“史诗类电视剧”能够把文化记忆呈现、还原出来之意，A项“表现”意为表示出来，C项“展示”指清楚地摆出来、明显地表现，D项“再现”指（过去的事情）再次出现，均符合文意且与“文化记忆”搭配恰当，保留。B项“投影”意为投射在一个面或一条线上的物体的影子或图形，比喻甲事物在乙事物上面表现出来的迹象，文段并无“投射”之意，排除。\n第二空，根据横线前“也是向观众传递镌刻在历史中的社会价值和思想观念”及“向观众传递正确的社会价值和思想观念”可知，横线处应体现“史诗类电视剧”应该通过其创作向观众传达正确的社会价值和思想观念之意，D项“应有之义”指应该有的义理，符合文意，当选。A项“金科玉律”比喻必须遵守、不能变更的信条，具有强制性和权威性，置于此处程度过重，排除；C项“不二之选”意为没有比这个选择更好的了，文段并无“选择”的语境，与文意不符，排除。\n故正确答案为D。\n【文段出处】光明日报《在酸甜苦辣中向阳而生》","no":46,"missingImage":false},{"type":"question","qid":"17467564","cat":"逻辑填空","stem":"近年来，人们通过电场对磁矩实现精准或概率性质的        ，实现了对人脑中突触或神经元功能的模拟，并初步构建了基于自旋的物理神经网络。这一前沿探索不仅挑战了传统计算与信息处理模式的        ，还        智能科技领域的一场深刻变革。\n依次填入画横线部分最恰当的一项是：","options":{"A":"测定 范式 彰显出","B":"校核 疆域 引发了","C":"调控 边界 预示着","D":"适配 法则 意味着"},"answer":"C","explanation":"第一空，根据“通过电场对磁矩实现精准或概率性质的······”可知，横线处需体现“电场对磁矩”的作用，且根据后文“实现了对人脑中突触或神经元功能的模拟，并初步构建了基于自旋的物理神经网络”可知，横线处应体现通过电场来控制磁矩，从而构建物理神经网络之意。C项“调控”指调节控制，在物理学中，“电场调控磁矩”是专业术语，符合文意，保留。A项“测定”指测量确定，侧重于获取数据，而文中强调的是通过操作来实现功能模拟，与文意不符，排除；B项“校核”指校对、核查，通常用于数据或事实的确认，与文意不符，排除；D项“适配”指通过技术手段实现硬件设计思想向可编程逻辑器件的映射过程，通常指两个事物之间的匹配，与文意不符，排除。\n第二空，代入验证。根据“不仅挑战了传统计算与信息处理模式”“······智能科技领域的一场深刻变革”可知，横线处体现这一前沿探索颠覆了传统的处理模式，C项“边界”指国家之间或地区之间的界线，填入横线体现前沿探索突破了传统模式的应用局限，符合文意，保留。\n第三空，代入验证。根据“还······智能科技领域的一场深刻变革”可知，横线处所填词语应体现这种探索引发或预示深刻变革。“‘预示着’变革”意为根据现状推断未来将有变革，能够体现前沿探索的前瞻性特点，符合文意，C项当选。\n故正确答案为C。\n【文段出处】科学通报《基于自旋的智能器件与物理神经网络进展》","no":47,"missingImage":false},{"type":"question","qid":"14143359","cat":"逻辑填空","stem":"这些“山环水绕”的地方虽然山不高，水的形态也无太大差别，但这里是自然优美的        。这里有花岗岩、石灰岩、红色砂岩三大造景岩石，每一种都造就了独具        的美，如花岗岩的雄浑，石灰岩的秀美，红色砂岩造就的赤壁丹霞······然而，这块“山环水绕”之地，永远在          中展现出无穷的多样性，如花岗岩造就的黄山式的景观在江西三清山上再现，红色砂岩造就的广东仁化碧水丹崖式的风景在福建泰宁重演。\n依次填入画横线部分最恰当的一项是：","options":{"A":"代表 生态 丰富性","B":"特例 风情 共同性","C":"范例 特色 同一性","D":"典范 个性 统一性"},"answer":"D","explanation":"第一空，根据“这里有花岗岩、石灰岩、红色砂岩三大造景岩石，每一种都造就了独具······的美”可知，横线处意在表达这些“山环水绕”的地方能够体现出自然优美之意。A项“代表”指显示同一类的共同特征的人或事物，C项“范例”指可以当作典范的事例，D项“典范”指可以作为学习、效仿标准的人或事物，均符合文意，保留。B项“特例”指特殊的事例，由前文“虽然山不高，水的形态也无太大差别”可知，文段并未体现这里有“特殊”之意，排除。\n第二空，根据“如花岗岩的雄浑，石灰岩的秀美，红色砂岩造就的赤壁丹霞······”可知，横线处应体现三大造景岩石造就的美各有独特之处，C项“特色”指事物所表现的独特的色彩、风格，D项“个性”指事物的特性，均能够体现出“不一样”之意，保留。A项“生态”指生物在一定的自然环境下生存和发展的状态，也指生物的生理特性和生活习性，与文中造景岩石的地质景观之美无关，且无法体现出独特之处，排除。\n第三空，根据“如花岗岩造就的黄山式的景观在江西三清山上再现，红色砂岩造就的广东仁化碧水丹崖式的风景在福建泰宁重演”可知，横线处应体现不同地域的同类景观存在共通规律与内在特质。D项“统一性”指共有的特质和特性，侧重内在规律一致、共有特质相通，与文意相符，且能与“多样性”对应，当选。C项“同一性”指具有完全相同的性质，侧重强调事物间毫无差异，与后文“多样性”表意矛盾，排除。\n故正确答案为D。","no":48,"missingImage":false},{"type":"question","qid":"16070308","cat":"逻辑填空","stem":"人工智能技术飞速发展，逐渐向人类智能水平逼近。科学家们在研究过程中愈发清晰地意识到，许多棘手的问题并非单凭一家公司之力就能成功解决。除了至今            的“电车难题”外，还有日益重要的价值观        问题——当AI拥有了自主设定目标的能力时，又该如何确保这些由AI自行确定的目标符合人类利益、与人类价值观相        ？\n依次填入画横线部分最恰当的一项是：","options":{"A":"争论不休 构建 吻合","B":"流口常谈 践行 出入","C":"悬而未决 对齐 契合","D":"束手无策 匹配 切合"},"answer":"C","explanation":"第一空，搭配“电车难题”，且根据“许多棘手的问题并非单凭一家公司之力就能成功解决”可知，横线处所填成语应表达“电车难题”至今没有解决之意，C项“悬而未决”指一直拖在那里，没有得到解决，符合文意，保留。A项“争论不休”比喻双方或多方对某一个问题各执一端，讨论不出最终的结果，谁也不肯停下来，B项“流口常谈”指人人挂在嘴上的老话，均无法体现没有解决之意，排除；D项“束手无策”形容遇到问题时毫无解决的办法，程度过重，且主语通常为人，一般表述为“令人束手无策的‘电车难题’”，排除。\n第二空，代入验证。搭配“价值观”，C项“对齐”指的是使两个或多个事物在位置、方向或功能上达到整齐、一致或协调的状态，与“价值观”搭配恰当，保留。\n第三空，代入验证。根据“、”可知，横线处所填词语与“符合”意思接近，C项“契合”指投合，符合，符合文意，当选。\n故正确答案为C。\n【文段出处】微信公众号：中国战略新兴产业《从互撕到约谈：马斯克与奥特曼的“AI冷战”突然破冰？》","no":49,"missingImage":false},{"type":"question","qid":"16070307","cat":"逻辑填空","stem":"考古学的早期实践是自然史的延伸，就是以进化模式来安排考古材料。人类的历史和文化被看作是一种        的过程，世界各地的文化发展遵循相同的轨迹，文化差异是由发展速率的快慢所造成。这种直线进化论存在明显弱点，导致种族主义考古学        ，把原住民文化看作生物学因素造成的        现象，无法发展到更高级的阶段。\n依次填入画横线部分最恰当的一项是：","options":{"A":"自然 泛滥 滞后","B":"加速 盛行 反常","C":"累进 流行 落后","D":"演变 胜出 极端"},"answer":"C","explanation":"第一空，根据“以进化模式来安排考古材料”“文化差异是由发展速率的快慢所造成”“这种直线进化论”可知，横线处应体现不断进化之意。C项“累进”指以一定方式逐步增加，D项“演变”指发展变化，均符合文意，保留。A项“自然”指自由发展，不受外界干预，侧重自发产生，无法体现进化之意，与文意不符，排除；B项“加速”指加快速度，与文意不符，排除。\n\n第二空，根据文意可知，横线处应体现种族主义考古学比较盛行之意，C项“流行”指广泛传布、盛行，可以体现种族主义考古学比较盛行之意，符合文意，保留。D项“胜出”指在比赛或竞争中胜过对手，文段并未体现战胜对手之意，与文意不符，排除。\n第三空，代入验证。根据“无法发展到更高级的阶段”可知，横线处应体现水平较低、不高级之意，C项“落后”指不先进，符合文意，当选。\n故正确答案为C。\n【文段出处】齐鲁学刊《考古学如何重建上古史》","no":50,"missingImage":false},{"type":"question","qid":"16069943","cat":"片段阅读","stem":"晚安牛奶的最大卖点在于“高褪黑素含量”。有品牌标明“褪黑素含量：12500pg/盒”，1pg等于万亿分之一克。而褪黑素的有效剂量在0.1~0.3毫克，这意味着需要喝约8000盒这种牛奶才能达到治疗剂量，因此晚安牛奶助眠更依赖于其安慰剂效应。如果某人有轻微的失眠困扰，还达不到临床上失眠的诊断标准，又能够排除器质性或精神疾病因素导致的失眠，个体比较相信晚安牛奶，或者喝后有效，在这种有益无害的前提下，不妨食用。\n这段文字意在强调：","options":{"A":"晚安牛奶的助眠效果主要源自心理作用","B":"晚安牛奶能助眠是商家的虚假宣传","C":"多喝晚安牛奶才能起到助眠作用","D":"晚安牛奶有较好的助眠效果"},"answer":"A","explanation":"文段首先通过晚安牛奶的最大卖点，引出“高褪黑素含量”话题，之后通过数据对比指出品牌标明的褪黑素含量远远达不到褪黑素的治疗剂量，随后通过结论词“因此”引出结论，即晚安牛奶助眠更依赖于其安慰剂效应。最后进行补充说明，指出在某些轻微、非器质性或精神疾病因素导致的失眠且在本人相信等情况下可以食用。故文段重在强调晚安牛奶助眠效果的真正来源是安慰剂作用，即心理作用，对应A项。\nB项，“商家的虚假宣传”文段并未提及，无中生有，排除；\nC项，“多喝晚安牛奶才能起到助眠作用”非重点，虽然文段提到“需要喝约8000盒”，但这只是为了证明晚安牛奶的褪黑素含量低，排除；\nD项，“晚安牛奶有较好的助眠效果”偏离重点，文段重点强调“晚安牛奶的助眠效果主要靠安慰剂作用”，排除。\n故正确答案为A。\n【文段出处】中华网《网红“晚安牛奶”真能助眠吗？医生：喝8000瓶才有效》","no":51,"missingImage":false},{"type":"question","qid":"16069878","cat":"片段阅读","stem":"智能社会的演进模糊了社会心态与社会行为的边界，呈现出线上线下虚实共生、心态风险与行动风险交织缠绕的特征，这对社会心态的治理策略与治理工具提出了新的挑战。社交软件的分享机制与算法推荐规律，都以对人类心理特征的精准利用为前提。此类技术往往把复杂的人类互动过程简化为点赞、转发等二元化的态度立场或简单行为，虽然便利了个体表达观点，却可能导致网络行为高度两极化，让许多事实错误但情绪饱满的虚假信息快速传播，成为网络空间治理的一大顽疾。\n这段文字意在强调：","options":{"A":"智能社会对社会心态治理提出了新的挑战","B":"智能化加速了从社会心态到社会行为的转化","C":"社交软件的算法可能导致网络行为高度两极化","D":"智能社会当务之急是要加强网络空间治理"},"answer":"A","explanation":"文段开篇介绍了智能社会演进所呈现的特征，并指出这对社会心态的治理提出了新挑战。随后指出社交软件的分享机制与算法推荐规律会简化人类的互动行为，导致网络行为高度两极化，让虚假信息传播，成为网络空间治理的一大顽疾，即对前文进行了解释说明。故文段重点在首句，强调智能社会的演进对社会心态治理提出了新挑战，对应A项。\nB项，“加速了从社会心态到社会行为的转化”无中生有，文段未提及，排除；\nC项，“可能导致网络行为高度两极化”对应分述句部分，非重点，且缺少文段主题词“智能社会”，排除；\nD项，文段的问题是“智能社会对社会心态的治理提出新挑战”，若想提对策，也应该是针对“社会心态”，“要加强网络空间治理”偏离文段核心，对策不具备针对性，排除。\n故正确答案为A。\n【文段出处】光明日报《以“智”臻“善”：社会心态治理的发展趋势》","no":52,"missingImage":false},{"type":"question","qid":"16069876","cat":"片段阅读","stem":"人形机器人的传感器像是人类的眼睛、耳朵和皮肤，扮演着感知器官的角色。视觉传感器通过摄像头捕捉环境图像；声音传感器接收并解析语音指令；力觉传感器仿效人体的力觉感受，精确感知与外界的接触力；触觉传感器模仿人类触觉，精准感知物体的形状和硬度。控制系统是人形机器人的大脑，借助计算单元和智能算法处理数据并作出决策。多种智能算法的应用让机器人越来越接近人类，比如利用深度神经网络，处理视觉、语音识别等任务。\n根据这段文字，对“人形机器人的设计原理”概括最准确的是：","options":{"A":"借助多功能传感器实现智能化处理","B":"仿生学与机械工程的有机融合","C":"赋予精准触觉，提升感知能力","D":"传感技术与控制理论的集成突破"},"answer":"D","explanation":"文段首先指出人形机器人的传感器扮演感知器官的角色，并具体介绍视觉、声音、力觉和触觉传感器的作用。随后指出控制系统如同人类大脑，借助计算单元和智能算法处理数据并作出决策，并说明智能算法的应用使其更接近人类。故文段为并列结构，从传感器与控制系统两个角度论述了人形机器人的设计原理，对应D项。\nA项“多功能传感器”、C项“触觉”和“提升感知能力”均仅对应传感器部分，未提及“控制系统”，表述片面，排除；\nB项，“机械工程”文段未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】人民日报《探索人形机器人的奥秘（开卷知新）》","no":53,"missingImage":false},{"type":"question","qid":"16069930","cat":"片段阅读","stem":"在我国，对农业生产造成重大危害的多数昆虫都具有迁飞性。草地贪夜蛾、黏虫等具有“春夏北迁，秋冬南迁”的习性。由于昆虫个体小、重量轻，飞行能力有限，远距离迁飞主要借助气流运载。季风、台风、西太平洋副热带高压的位置与强度变化等因素都会对害虫的迁飞扩散产生重要影响。每年春夏，害虫大军从中南半岛等地随西南季风迁飞入我国，之后又随西南季风或东南季风暖湿气流继续北上。到了秋冬，草地贪夜蛾、黏虫等为逃避低温环境，只好迁回温暖的南方。这是昆虫逃避不良环境条件的一种生存对策。\n这段文字重在说明害虫大军迁飞的：","options":{"A":"地域密码","B":"季节规律","C":"环境影响","D":"生存策略"},"answer":"B","explanation":"文段开篇引出话题“多数昆虫都具有迁飞性”，随后提出观点，草地贪夜蛾、黏虫等具有“春夏北迁，秋冬南迁”的习性，即害虫大军迁飞的季节规律。后文对其进行原因解释，从季风、台风、西太平洋副热带高压的位置与强度变化等因素具体论述如何影响其迁飞的季节规律，文段最后一句通过“这”对前文“逃避低温环境”进行补充说明。故文段重在说明害虫大军迁飞的季节规律，对应B项。\nA项“地域密码”文段并非重点描述，虽然提及南北方，但“春夏北迁，秋冬南迁”重点是强调季节的规律，排除；\nC项“环境影响”对应“季风、台风、西太平洋副热带高压的位置与强度变化等因素”，为原因解释部分内容，非重点，排除；\nD项“生存策略”出现在尾句，是对“逃避低温环境”进行的补充说明，并非全文重点，排除。\n故正确答案为B。\n【文段出处】中国农业科学院植物保护研究所《一探究竟 “虫军”迁飞的气象“密码”》","no":54,"missingImage":false},{"type":"question","qid":"16069964","cat":"片段阅读","stem":"斑翅果蝇的雌虫会在多种软皮水果中产卵，其幼虫在果实内取食，导致水果腐烂。近日，科研人员利用“基因剪刀”技术将影响斑翅果蝇性别发育的基因修改成让雌虫无法正常产卵但对雄虫无影响的版本后，斑翅果蝇的绝大多数后代都会继承这个基因变化，实现基因驱动。科学家认为，人为实现基因驱动，让特定基因在生物群体中传播开来，可以控制有害生物的数量或增强濒危物种的抗病能力。此前已有研究团队用相关方法消灭传播疟疾的蚊子，此次用于斑翅果蝇这种农业害虫尚属首次。\n这段文字主要介绍了：","options":{"A":"“基因剪刀”技术是一项高效的抗虫害技术","B":"“基因剪刀”技术增强了濒危物种的抗病能力","C":"通过基因驱动可以控制有害生物的数量","D":"研究人员用“基因剪刀”技术对抗斑翅果蝇"},"answer":"D","explanation":"文段首先指出斑翅果蝇雌虫产卵会危害软皮水果，接着说明科研人员用“基因剪刀”技术修改其性别发育基因，实现基因驱动，随后介绍基因驱动具有控制有害生物数量或增强濒危物种抗病能力的作用，尾句进一步强调，此次将该技术用于斑翅果蝇这种农业害虫是首次尝试。故文段围绕“基因剪刀”技术与“斑翅果蝇”展开，重点强调研究人员运用“基因剪刀”技术对抗斑翅果蝇这一具体研究，对应D项。\nA项，“高效的抗虫害技术”侧重对技术本身的属性评价，但文段并未提及该技术是否“高效”，且文段核心是介绍该技术针对斑翅果蝇的具体应用实践，选项缺少文段主题词“斑翅果蝇”，偏离文段重点，排除；\nB项，“增强了濒危物种的抗病能力”仅为“基因剪刀”技术实现基因驱动后可能带来的效果之一，并非文段所阐述的核心内容，表述片面且非重点，且缺少文段主题词“斑翅果蝇”，排除；\nC项，“控制有害生物的数量”仅为基因驱动可能带来的效果之一，并非文段所阐述的核心内容，表述片面且非重点，且缺少文段主题词“基因剪刀”技术与“斑翅果蝇”，排除。\n故正确答案为D。\n【文段出处】新华网《美国研究用“基因剪刀”对抗农业害虫斑翅果蝇》","no":55,"missingImage":false},{"type":"question","qid":"16069948","cat":"语句表达","stem":"如今，网络和数字媒介已成为未成年人生活的基本环境。短视频以沉浸式体验让他们轻松获得各种热点、热梗和表情包，“老铁”“666”等迅速进入他们的话语体系，甚至成为特定圈层的身份标识。在各大社交媒体上，家长们担心“孩子不好好说话”，老师们交流“如何引导学生正确用语”。诙谐幽默的网络语言在丰富人类表达的同时，                    。在“人机共生”时代，如何培育未成年人的语言文化素养值得重视。\n填入画横线处最恰当的是：","options":{"A":"也成为人们理解文化和世界的重要方式","B":"也对原有规范的语言文化体系造成冲击","C":"更需要思考机器智能环境下的文化素养提升问题","D":"越来越多的人感受到“文字失语”的困扰"},"answer":"B","explanation":"本题为语句填空题，横线在文段中间，需结合前后文进行分析。文段开篇指出各种网络语言进入了未成年人的话语体系，但与此同时，家长与老师对此种现象表示了担心并给予正确引导。可知，网络语言虽丰富了人类的表达，但仍有负面影响。B项中“对原有规范的语言文化体系造成冲击”准确对应概括了前文中“不好好说话”“引导学生正确用语”等问题，并且与后文“重视如何培育未成年人语言文化素养”这一对策高度契合，当选。\nA项，“理解文化和世界”文段并未提及，无中生有，排除；\nC项，缺少文段核心话题“语言”，且“机器智能”文段并未提及，无中生有，排除；\nD项，“文字失语”指因网络文化和流行语的影响，导致语言表达能力下降的现象，但横线之前强调“丰富人类表达”，与前文语义矛盾，无法衔接，排除。\n故正确答案为B。\n【文段出处】《“人机共生”时代更须注重语言规范》","no":56,"missingImage":false},{"type":"question","qid":"16069873","cat":"片段阅读","stem":"“低空风怪”也叫下击暴流，是一股从雷暴云中快速下沉的强烈气流。如同瀑布一泻千里直击山石，“风怪”在触及地面后向四周爆发出强大的冲击力。当“风怪”呼啸而下时，速度最高可达每秒100米，比高铁还快。不仅如此，它还会在低空形成猛然四散的强风，击中地面时爆发出的水平风力最大可达17级，足以掀翻火车、轮船。“风怪”造成的大风会在几百米内风向突变，对飞机起降危害很大。\n接下来作者最有可能讲述的是：","options":{"A":"“低空风怪”的定义及其特征","B":"“低空风怪”威力强、危害大","C":"能否对“低空风怪”作出预警","D":"“低空风怪”与龙卷风的差异"},"answer":"C","explanation":"本题为接语选择题，需要在通读全文的基础上，重点关注文段最后讨论的核心话题。文段开篇引出“低空风怪”这一话题，随后分别论述了其冲击力强、风速快、风力大的特点，尾句强调“低空风怪”的危害，即对飞机起降危害性很大。故下文应该继续围绕“低空风怪”的危害性进一步延伸，最有可能探讨预警“低空风怪”的相关话题，C项当选。\nA项“‘低空风怪’的定义及其特征”与B项“‘低空风怪’威力强、危害大”均为前文已论述过的内容，后文不会再次论述，排除；\nD项，“龙卷风”文段并未提及，与前文衔接不当，排除。\n故正确答案为C。\n【文段出处】光明网·文摘报《降服“低空风怪”》","no":57,"missingImage":false},{"type":"question","qid":"16069894","cat":"片段阅读","stem":"在深度学习的过程中，实际确定误差并非易事。为解决这一问题，当前深度学习领域应用“损失函数”实现误差最小化，即在人工智能的学习过程中，找到能够最小化损失函数值的参数。但损失函数的形式会随具体情况而有所不同，难以全面掌握其特性，因此需要引入微分。微分主要用于分析某个变量的变化如何影响函数的值。通过对损失函数进行微分，可以明了参数变化时损失函数值的变化，进而调整参数值，让损失函数的值尽可能小。在针对性地进行编程后，人工智能能够自动完成上述任务。\n对这段文字概括最恰当的是：","options":{"A":"通过对损失函数进行微分，深度学习能实现误差最小化","B":"引入微分后，损失函数能帮助人工智能实现自主深度学习","C":"损失函数在深度学习中主要用于确定误差","D":"损失函数对深度学习的参数优化具有重要意义"},"answer":"A","explanation":"文段开篇介绍在深度学习过程中确定实际误差并非易事，接下来指出用“损失函数”实现误差最小化，随后“但”转折引出损失函数形式会随具体情况而有所不同，难以全面掌握其特性，紧接着通过“因此”强调需要引入微分，后文继续说明对损失函数微分能明确参数变化对损失值的影响，进而调整参数值让损失函数的值尽可能小，且进行针对性编程后人工智能就可自动完成任务。故文段核心在于对损失函数进行微分能帮助深度学习实现误差最小化，对应A项。\nB项，文段重点是“误差最小化”，并非“实现自主深度学习”，偏离文段中心，排除；\nC、D两项，均缺少“微分”这一主题词，偏离文段中心，排除。\n故正确答案为A。","no":58,"missingImage":false},{"type":"question","qid":"16070239","cat":"片段阅读","stem":"当人们将光照程度作为城市发达程度的衡量标准时，大都市的星光也正在“黯淡消失”。曾几何时，夜晚璀璨的星空带给人无限的遐思，但是随着城市化进程的加快，越来越多生活在城市里的人发现，星星似乎“消失不见”了。天文学家表示，近年来光污染状况迅速恶化，超过三分之一的人类看不到夜空中明亮的银河。发光二极管和其他形式的照明正以惊人的速度照亮夜空。由于光污染的加剧，20年后人类可能无法看到夜晚的星空。\n最适合做这段文字标题的是：","options":{"A":"星光黯淡：寻找消失的星星","B":"光污染：亮了城市，暗了星空","C":"星星点灯：照不亮城市的夜空","D":"光污染：让星星们“无处可藏”"},"answer":"B","explanation":"文段开篇介绍人们将光照程度作为衡量城市发达程度的标准，同时大都市的星光在“黯淡消失”，接着指出随着城市化进程加快，城市的星星似乎“消失不见”了。后文通过天文学家的观点，强调城市光污染状况迅速恶化，部分人类已经看不到夜空中明亮的银河，最后指出未来人类可能看不见夜晚的星空，故文段整体围绕“光污染”展开，介绍其照亮城市的同时也“暗淡”了星空，对应B项。\nA项，未提及核心话题“光污染”，且“寻找消失的星星”文段并未提及，无中生有，排除；\nC项，未提及核心话题“光污染”，且“星星点灯”文段并未提及，无中生有，排除；\nD项，“无处可藏”与文意相悖，且缺少对城市的影响，表述片面，排除。\n故正确答案为B。\n【文段出处】中国科学报《光污染：亮了城市，暗了星空》科技日报《光污染或致20年后难见星空》","no":59,"missingImage":false},{"type":"question","qid":"16069897","cat":"片段阅读","stem":"绿色供应链是一种在整个供应链中综合考虑环境影响和资源效率的现代管理模式。它以绿色制造理论和供应链管理技术为基础，涉及供应商、生产商、销售商、消费者和回收商，目的是使产品从物料获取、加工、包装、仓储、运输、使用到报废处理的整个过程，对环境影响最小，资源利用率最高。资源材料是绿色供应链的基础，其可持续性供给是实现绿色供应链的根本条件。\n根据这段文字，可以推出的是：","options":{"A":"传统供应链对环境影响的关注度较低","B":"应用绿色供应链，生产商和供应商最为关键","C":"绿色供应链的核心目标是增强可持续发展","D":"若资源材料供给不可持续，绿色供应链则难以实现"},"answer":"D","explanation":"A项，文段仅介绍了绿色供应链“综合考虑环境影响”，未提及传统供应链对环境影响的关注度，无中生有，排除；\nB项，根据“它以绿色制造理论和供应链管理技术为基础，涉及供应商、生产商、销售商、消费者和回收商”可知，“生产商和供应商最为关键”表述过于绝对，排除；\nC项，根据“目的是使产品从物料获取、加工、包装、仓储、运输、使用到报废处理的整个过程，对环境影响最小，资源利用率最高”可知，“核心目标是增强可持续发展”表述错误，排除；\nD项，根据“资源材料是绿色供应链的基础，其可持续性供给是实现绿色供应链的根本条件”可知，若资源材料供给不可持续，作为根本条件缺失，绿色供应链则难以实现，表述正确，当选。\n故正确答案为D。\n【文段出处】中国知网《打造绿色供应链 如何让电机“转”得更省》","no":60,"missingImage":false},{"type":"question","qid":"16070287","cat":"片段阅读","stem":"20世纪中叶，分子生物学诞生，开启了在分子水平上研究生命及其活动的现代生命科学时代。这个时期的研究者采用“碎片化”的模式来研究生命及其生理或病理活动。但是，研究者逐渐认识到，生命活动并非是由一个个基因或蛋白质“零件”独立完成的，而是建立在生命体内众多基因、蛋白质和其他化学小分子形成的复杂相互作用之上；对于高等生物而言，除了分子层面复杂的相互作用网络外，还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用。\n根据这段文字，可以推出：","options":{"A":"生命活动是一种复杂系统的整体行为","B":"低等生物的生命活动由基因独立完成","C":"分子层面的研究是理解高等生物的关键","D":"现代科学主要采用“碎片化”模式研究生命活动"},"answer":"A","explanation":"A项，根据“生命活动并非是由一个个基因或蛋白质‘零件’独立完成的，而是建立在生命体内众多基因、蛋白质和其他化学小分子形成的复杂相互作用之上······还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用”可知，表述正确，当选；\nB项，根据“生命活动并非是由一个个基因或蛋白质‘零件’独立完成的”可知，文段是一个普遍性的陈述，并未区分低等生物和高等生物，尽管后文提及高等生物有额外的介观层面相互作用，但并不意味着低等生物的生命活动可以由基因独立完成，无中生有，排除；\nC项，根据“除了分子层面复杂的相互作用网络外，还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用”可知，除了“分子层面的研究”，还存在“细胞、组织和器官等不同介观层面”，未提及分子层面的研究是理解高等生物的“关键”，偷换逻辑，排除；\nD项，根据“20世纪中叶，分子生物学诞生······这个时期的研究者采用‘碎片化’的模式来研究生命及其生理或病理活动”和“但是，研究者逐渐认识到，生命活动并非是······”可知，20 世纪中叶使用了“碎片化”的模式，后来研究者逐渐认识到该模式的弊端，故无法得出现代科学“主要采用”“碎片化”模式研究生命活动，排除。\n故正确答案为A。\n【文段出处】中国网《生命大科学：从微观到介观的组学研究》","no":61,"missingImage":false},{"type":"question","qid":"16069944","cat":"片段阅读","stem":"近年来，一系列具有人文情怀的文化综艺类节目集体走红。在融媒体时代，文化综艺类节目如何创新成了摆在创作者面前的一道难题。创新要找到令年轻人感兴趣的点进行嫁接，但又不能丢掉主流媒体的审美、价值观和社会责任。文化综艺的创新，应该走文化传统和现代时尚相结合之路，不能脱离对传统经典文化的传承凭空打造所谓现代时尚，而是要把传统与时代精神相结合，走进人民群众最接地气的生活，在寓教于乐中让人受到启迪。\n下列选项与这段文字意思不符的是：","options":{"A":"文化综艺类节目的创新要扎根人民、扎根生活","B":"文化综艺类节目要以传承传统文化为首要目的","C":"文化综艺类节目不能流于说教而忽视其娱乐性","D":"文化综艺类节目创新要关注年轻人的精神需求"},"answer":"B","explanation":"A项，根据“走进人民群众最接地气的生活”可知，“扎根人民、扎根生活”与文意相符，排除；\nB项，根据“应该走文化传统和现代时尚相结合之路······要把传统与时代精神相结合”可知，“以传承传统文化为首要目的”文段并未提及，无中生有，当选；\nC项，根据“在寓教于乐中让人受到启迪”可知，“不能流于说教而忽视其娱乐性”与文意相符，排除；\nD项，根据“创新要找到令年轻人感兴趣的点进行嫁接”可知，“创新要关注年轻人的精神需求”与文意相符，排除。\n本题为选非题，故正确答案为B。\n【文段出处】中国文化报《文化综艺如何“玩转”传统文化？》","no":62,"missingImage":false},{"type":"question","qid":"16069967","cat":"片段阅读","stem":"近日，一种名叫“RoboCap”的机器人胶囊问世，体积相当于维生素大小，一端在容器中装载有效药物，表面涂有明胶，可调节其在特定pH下溶解。当涂层溶解时，pH的变化会触发“RoboCap”胶囊内部的一个微型马达旋转，有助于胶囊进入粘液并移位。胶囊上覆盖着小螺柱，可以像牙刷一样刷掉粘液。旋转运动还可帮助侵蚀携带药物的隔室，将药物释放到消化道。也就是说，该胶囊的“机器人帽”到达小肠时，会旋转并穿过粘液屏障，使胶囊携带的药物进入肠道内的细胞。研究人员表示，机器人胶囊有朝一日或能取代注射给药的方式。\n这段文字未涉及机器人胶囊的：","options":{"A":"应用前景","B":"适用对象","C":"工作原理","D":"内部结构"},"answer":"B","explanation":"A项，根据“研究人员表示，机器人胶囊有朝一日或能取代注射给药的方式”可知，“应用前景”文段有所提及，排除；\nB项，“适用对象”在文段中并未提及，无中生有，当选；\nC项，根据“当涂层溶解时，pH的变化会触发‘RoboCap’胶囊内部的一个微型马达旋转，有助于胶囊进入粘液并移位。胶囊上覆盖着小螺柱，可以像牙刷一样刷掉粘液。旋转运动还可帮助侵蚀携带药物的隔室，将药物释放到消化道”可知，“工作原理”文段有所提及，排除；\nD项，根据“一端在容器中装载有效药物，表面涂有明胶”“胶囊内部的一个微型马达”“携带药物的隔室”可知，“内部结构”文段有所提及，排除。\n本题为选非题，故正确答案为B。\n【文段出处】科技日报《机器人胶囊可将药物送入消化道》","no":63,"missingImage":false},{"type":"question","qid":"16070179","cat":"片段阅读","stem":"一年中的大部分时间，成年棕熊都是离群索居的动物。但当大量鲑鱼洄游到湖中繁殖时，常常会有几十头棕熊同时聚集在湖边。过高的种群密度和相对有限的理想捕鱼位置，决定了它们必须竞争进食序列。在这个巨大的“餐桌”周围，进食的座次是由实力来决定的，成年公熊之间常常为了争夺捕鱼位置在湖畔发生激烈打斗，胜者赢得一切。在这个时期，湖畔通常是被雄性棕熊所占据的，当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们，幼熊易遭到撕咬而死亡。\n由这段文字无法推出：","options":{"A":"成年棕熊在争夺食物时竞争非常激烈","B":"成年棕熊的进食序列主要由实力决定","C":"鲑鱼繁殖期的湖畔对幼熊会更加危险","D":"雌熊带幼熊靠近湖畔是为了捕食鲑鱼"},"answer":"D","explanation":"A项：根据“成年公熊之间常常为了争夺捕鱼位置在湖畔发生激烈打斗”可知，符合文意，排除；\nB项：根据“在这个巨大的‘餐桌’周围，进食的座次是由实力来决定的”可知，符合文意，排除；\nC项：根据“当大量鲑鱼洄游到湖中繁殖时，······在这个时期······当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们，幼熊易遭到撕咬而死亡”可知，符合文意，排除；\nD项：文段仅指出“当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们”，但并未提及它们靠近的目的是捕食鲑鱼，无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】中国国家地理网《堪察加棕熊 为森林“运氮”的鲑鱼猎手》","no":64,"missingImage":false},{"type":"question","qid":"16069928","cat":"语句表达","stem":"①一段时间里，长视频葆有一种艺术优越感，认为台网联动就是把影视作品切成片段挪到网上\n②这种长短阵营划分实际上是专业作品和民间段子的区分\n③但在当今短视频崛起的网络视频生态中，长视频不可再孤芳自赏，而应打开视野，与更多短视频及受众进行联结交流\n④剧场化不是让长视频成为网络视听阵营的“孤勇者”，而是在精品化战略基础上思考如何利用短视频为作品铺垫引流\n⑤的确，长视频是一种综合艺术，包含文学、戏剧、音乐、歌舞等多种艺术元素\n⑥网络视频原无长短之分，只因短视频的崛起，专业生产的影视作品才以长视频的概念区别于用户生产模式的短视频\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑥④①②③⑤","B":"④⑥②①⑤③","C":"⑤①②③⑥④","D":"①⑤③②④⑥"},"answer":"B","explanation":"观察选项，确定首句。①句指出长视频葆有艺术优越感及对台网联动的认识，④句对“剧场化”下定义，指出剧场化是在精品化战略基础上思考如何利用短视频为长视频作品铺垫引流，⑥句说明长短视频划分的由来，三句均可作首句，故保留A、B、D三项。⑤句以“的确”开头，“的确”指完全确实，多用于佐证前文观点，故不适合直接作首句，排除C项。\n继续观察发现，②句出现指代词“这”，可考虑指代词捆绑解题。②句核心围绕“长短视频的阵营划分”展开，前文需围绕此话题论述。观察A、B、D三项可知，②句前分别为①、③、⑥句。⑥句介绍因短视频的崛起才有了长短视频之分，与②句话题一致，可构成指代词捆绑，B项当选。①句介绍长视频葆有艺术优越感，③句介绍当下长视频的发展方向，二者均无法与②句构成指代词捆绑，排除A、D两项。\n故正确答案为B。\n【文段出处】光明日报《影视节目创作传播：长短视频互利共生》","no":65,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"17467518","cat":"数学运算","stem":"某电影院即将开始检票，检票前已有人在排队。假设每人检票时间相同，且排队检票的人数均匀增加。若开一个检票口，10分钟可以检完；若开两个检票口，4分钟可以检完；若开三个检票口，则多少分钟可以检完？","options":{"A":"1.8","B":"2","C":"2.5","D":"2.8"},"answer":"C","explanation":"设检票前已有Y人排队，每分钟增加x人排队检票，每个检票口每分钟检1人。根据牛吃草公式：\u003cimg data-k=\"9f50c176dee7\">，可得：\u003cimg data-k=\"13ca385d90c4\">······①，\u003cimg data-k=\"b48e4183fc7b\">······②，联立①②两式，解得\u003cimg data-k=\"d8eabfade500\">，\u003cimg data-k=\"d945d06186ae\">。设开三个检票口，t分钟可以检完，则有\u003cimg data-k=\"2c09fc850fc1\">，解得t=2.5。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"16070159","cat":"数学运算","stem":"运动心率即人体在运动时保持的心率状态，保持最佳的运动心率对于运动安全及运动效果来说都十分重要。一般来说，正常人最佳运动心率的范围是：最大运动心率=（220-年龄）×0.8次/分；最小运动心率=（220-年龄）×0.6次/分。那么正常人40岁时，最佳运动心率的范围为：","options":{"A":"108~132次/分","B":"132~144次/分","C":"108~144次/分","D":"144~176次/分"},"answer":"C","explanation":"根据题干给出的公式，当正常人40岁时，最大运动心率=（220-40）×0.8=144次/分；最小运动心率=（220-40）×0.6=108次/分。故正常人40岁时，最佳运动心率的范围为：108~144次/分。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"16070168","cat":"数学运算","stem":"体操世锦赛男团预赛一共有单杠、双杠、自由体操、鞍马、吊环、跳马六个项目，每个国家的比赛项目顺序由抽签决定。那么某个国家第一个比赛项目不是单杠，且自由体操不在双杠之后的概率是多少?","options":{"A":"\u003cimg data-k=\"264d1a7b506a\">","B":"\u003cimg data-k=\"54d707f15b45\">","C":"\u003cimg data-k=\"a6f7e1889399\">","D":"\u003cimg data-k=\"ff1b1de9ab8e\">"},"answer":"A","explanation":"根据题意，第一个比赛项目是六个项目中的任意一项的概率均为\u003cimg data-k=\"c7ce0624c5b3\">，则第一个比赛项目不是单杠的概率为\u003cimg data-k=\"365691502844\">；自由体操要么在双杠之前，要么在双杠之后，要求自由体操不在双杠之后，则自由体操在双杠之前，概率为\u003cimg data-k=\"54d707f15b45\">。分步用乘法，则所求概率\u003cimg data-k=\"152423188d63\">。\n故正确答案为A。","no":68,"missingImage":false},{"type":"question","qid":"16070162","cat":"数学运算","stem":"某数字展馆沿入口两侧各设有3个展位。现需安排数字产品展位和人工智能展位各3个，且数字产品展位不能都安排在同一侧，那么共有多少种安排方式？","options":{"A":"244","B":"648","C":"684","D":"720"},"answer":"B","explanation":"方法一：根据题意，要求数字产品的3个展位不能都安排在同一侧，分类讨论如下：\n（1）左侧有1个数字产品展位和2个人工智能展位，其余展位在右侧，有\u003cimg data-k=\"4e407b9232a6\">\u003cimg data-k=\"971d23bf919e\">种安排方式；\n（2）左侧有2个数字产品展位和1个人工智能展位，其余展位在右侧，有\u003cimg data-k=\"33fcb76ad08f\">\u003cimg data-k=\"971d23bf919e\">种安排方式。\n综上，共有324+324=648种安排方式。\n方法二：可考虑逆向思维。总情况为将6个展位任意放置在左右两侧的6个位置，有\u003cimg data-k=\"b5af088a30fe\">种安排方式。要求数字产品的3个展位不能都安排在同一侧，反面为数字产品的3个展位均放在同一侧。从左、右两侧选择其中一侧，放入数字产品的3个展位，另一侧放入人工智能的3个展位，有\u003cimg data-k=\"b3430f62aacd\">种安排方式。因此，共有720-72=648种安排方式。\n故正确答案为B。","no":69,"missingImage":false},{"type":"question","qid":"16070167","cat":"数学运算","stem":"某冷链物流公司每天至少要运送160吨海鲜从甲港口到乙市场，公司有8辆A型冷链运输车和4辆B型冷链运输车，且只有10名驾驶员。A型车每天每辆可运输24吨，运费350元；B型车每天每辆可运输20吨，运费450元。那么公司每天的运费最少为：","options":{"A":"2450元","B":"2550元","C":"2650元","D":"2900元"},"answer":"A","explanation":"求每天的运费最少，优先考虑使用费用低的车型。根据题意可知，A型车的运费（350元）更低，则尽量多用A型车。要满足每天至少运送160吨，\u003cimg data-k=\"afd1767ec61e\">，车辆为整数，向上取整为7辆，即7辆A型车可满足运送要求，且运费最少，运费为7×350=2450元。\n故正确答案为A。","no":70,"missingImage":false},{"type":"question","qid":"17467567","cat":"数学运算","stem":"某小区内有一块直角扇形的草坪如下图所示，两条互相垂直的小路AC与BC分别长4米和3米。物业公司准备在四边形OACB
