:"question","qid":"13504457","cat":"数学运算","stem":"甲和乙两个科研单位共有99名工作人员。其中甲单位研究人员占本单位工作人员总数的75%，乙单位研究人员占本单位工作人员总数的88%。问甲单位的非研究人员比乙单位的非研究人员：","options":{"A":"少不到5人","B":"少5人以上","C":"多不到5人","D":"多5人以上"},"answer":"A","explanation":"方法一：根据题意，甲单位研究人员数占甲单位人数的\u003cimg data-k=\"1df90b0d06c0\">，可知甲单位人数为4的倍数；乙单位研究人员数占乙单位人数的\u003cimg data-k=\"a871df83890a\">，可知乙单位人数为25的倍数。再根据甲、乙两单位共有99人，可知：\n若乙单位人数=25人，甲单位人数=99-25=74人，不是4的倍数，排除；\n若乙单位人数=50人，甲单位人数=99-50=49人，不是4的倍数，排除；\n若乙单位人数=75人，甲单位人数=99-75=24人，满足题干条件，成立。\n再根据甲单位非研究人员数占甲单位人数的\u003cimg data-k=\"d1e7e6c87a15\">，乙单位非研究人员数占乙单位人数的\u003cimg data-k=\"abba77e1c364\">，可得甲单位非研究人员有\u003cimg data-k=\"267d5d39bb70\">人，乙单位非研究人员有\u003cimg data-k=\"c18bb1093c0c\">人，所以甲单位的非研究人员比乙单位的非研究人员少3人。\n方法二：根据题意，甲单位研究人员数占甲单位人数的\u003cimg data-k=\"1df90b0d06c0\">，乙单位研究人员数占乙单位人数的\u003cimg data-k=\"a871df83890a\">，设甲单位总人数为4x人，乙单位总人数为25y人，因甲、乙两单位共有99人，可列式：4x+25y=99，由奇偶特性，4x为偶数，99为奇数，可知25y为奇数，则y为奇数：\n若y=1，则4x=99-25=74，x为非整数，排除；\n若y=3，则4x=99-75=24，x=6，满足题干条件，成立。\n则甲单位总人数为4×6=24人，非研究人员为24×（1-75%）=6人；乙单位总人数为25×3=75人，非研究人员为75×（1-88%）=9人，所以甲单位的非研究人员比乙单位的非研究人员少3人。\n故正确答案为A。","no":59,"missingImage":false},{"type":"question","qid":"13504333","cat":"数学运算","stem":"五边形公园ABCDE的面积为4万平方米，其中ABCD为长方形，AB=0.75BC，且ADE为等腰直角三角形（\u003cimg data-k=\"d694b3790c15\">为直角）。小张从D点出发在公园中慢跑，沿箭头所示方向先后经过B点、AE中点和DE中点后到达C点。问小张全程跑了多少米?\n\u003cimg data-k=\"ca7c1cf2b874\" style=\"max-width:279px\">","options":{"A":"\u003cimg data-k=\"0edd9928dab6\">","B":"\u003cimg data-k=\"908d918f42b7\">","C":"\u003cimg data-k=\"b25883d1a1a5\">","D":"\u003cimg data-k=\"3d4a690e4e0d\">"},"answer":"C","explanation":"连接AD，设长方形长BC、AD为4x米，则宽AB、DC为3x米，则根据勾股定理可得长方形对角线BD\u003cimg data-k=\"da4ed01db16d\">米；根据\u003cimg data-k=\"dd07880e4067\">为等腰直角三角形，三边比例关系为\u003cimg data-k=\"cd7b61bea45e\">，可得\u003cimg data-k=\"d6492a00ec12\">米；则\u003cimg data-k=\"9677faae9950\">\u003cimg data-k=\"49c8ca3398d8\">；解得x=50米，那么AB=CD=150米，AD=BC=200米，BD=250米。\n由题意可得F、G分别为AE、DE中点，故\u003cimg data-k=\"ce0a7ada7f5f\">米；过E点做AD垂线相交于H点，过G点做AD、BC垂线分别相交于I、J点，则EH=HD=100米，GI为\u003cimg data-k=\"5384172bb727\">的中位线，故\u003cimg data-k=\"81924f84abf0\">米；那么在直角\u003cimg data-k=\"f2e51277598b\">中，CJ=DI=50米，JG=IJ+GI=150+50=200米，根据勾股定理可得：\u003cimg data-k=\"243e29aae893\">\u003cimg data-k=\"90596e52ce98\">米，同理可得：\u003cimg data-k=\"b2f01802d7c1\">米；则所求距离\u003cimg data-k=\"c1c62097caec\">\u003cimg data-k=\"0567f328b139\">\u003cimg data-k=\"53a5798c13d2\">米。\n\u003cimg data-k=\"f733f48bbdf2\" style=\"max-width:316px\">\n故正确答案为C。","no":60,"missingImage":false}],"count":14,"answerable":14,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"13504266","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性：\n\u003cimg data-k=\"018519ce56a0\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"解析一：元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图形线条交叉明显，且每幅图均出现明显的弧线，考虑数曲直交点。曲直交点数均为1，排除B项；继续观察发现，题干图形曲直交点的特征依次为：曲线的端点与直线交叉、曲线的中段与直线“十字交叉”、曲线的端点与直线交叉、曲线的中段与直线“十字交叉”、曲线的端点与直线交叉，故？处图形的曲直交点应为曲线的中段与直线“十字交叉”，只有D项符合。\n故正确答案为D。\n解析二：\n元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图形线条交叉明显，且每幅图均出现明显的弧线，考虑曲直交点。曲直交点数均为1，排除B项；继续观察发现，题干图形曲直交点的特征为：曲线与直线（横线或竖线）相交、曲线与斜线相交、曲线与直线（横线或竖线）相交、曲线与斜线相交、曲线与直线（横线或竖线）相交，故？处图形的曲直交点应为曲线与斜线相交，只有A项符合。\n故正确答案为A。\n注：本题粉笔倾向于解析一。因为题干图形均只有一条曲线，曲线的端点或中段与直线相交的特征更明确；另外，解析二中图1为曲线与竖线相交，图3和图5为曲线与横线相交，其直线方向不完全一样。","no":61,"missingImage":false},{"type":"question","qid":"13504389","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"d804e5645db7\" style=\"max-width:500px\">","options":{"A":"①③④，②⑤⑥","B":"①②④，③⑤⑥","C":"①②⑤，③④⑥","D":"①④⑥，②③⑤"},"answer":"B","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形被分割，考虑面数量，但面数量无规律，且框内有明显一笔构成的线条，考虑笔画数。图①②④均为两笔画图形，图③⑤⑥均为一笔画图形，即图①②④为一组，图③⑤⑥为一组。\n故正确答案为B。","no":62,"missingImage":false},{"type":"question","qid":"13504321","cat":"图形推理","stem":"左下图为15个白色和3个灰色正方体组合而成的多面体，其可以由以下4项中除哪项外的3个小多面体组合而成？\n\u003cimg data-k=\"dad271b2e4f9\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查立体拼合。题干多面体可以由A、B、C中的小多面体（A、C 两项中的小多面体需要先旋转）拼合而成，具体拼合过程如下图所示。\n\u003cimg data-k=\"52446cc987c0\" style=\"max-width:559px\">\n本题为选非题，故正确答案为D。","no":63,"missingImage":false},{"type":"question","qid":"13504268","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性：\n\u003cimg data-k=\"7eb72a148c62\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形均由黑白球组成，第一组图形黑球每次增加1个，白球每次增加2个；第二组图形黑球每次增加2个，白球每次增加1个，故？处图形应该包含6个黑球、3个白球，排除A、B两项；再次观察发现，题干图形都是由不同颜色的球组成，且明显分为内外两圈，考虑分开看。第一组图中，内圈的黑球依次顺时针增加1个，外圈的白球依次逆时针增加2个；第二组图中，前两幅图内圈的白球依次顺时针增加1个，外圈的两部分黑球各依次逆时针增加1个，？处图形应用此规律，只有D项符合。\n故正确答案为D。","no":64,"missingImage":false},{"type":"question","qid":"13504273","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"e8eb68953609\" style=\"max-width:500px\">","options":{"A":"①③④，②⑤⑥","B":"①②④，③⑤⑥","C":"①⑤⑥，②③④","D":"①②⑥，③④⑤"},"answer":"C","explanation":"本题为分组分类题目。元素组成相同，但无位置规律和属性规律，考虑数量规律。观察发现，题干图形黑球和白球分堆明显，考虑部分数。图①⑤⑥中黑球部分数均为1，白球部分数均为4，图②③④中黑球部分数均为2，白球部分数均为3，故图①⑤⑥为一组，图②③④为一组。\n故正确答案为C。","no":65,"missingImage":false},{"type":"question","qid":"13504308","cat":"图形推理","stem":"左下图为两个正方体组合而成的长方体，这两个正方体的外表面展开图分别可能是：\n\u003cimg data-k=\"035413764454\" style=\"max-width:500px\">","options":{"A":"①和②","B":"③和④","C":"①和④","D":"②和③"},"answer":"A","explanation":"将题干两个正方体的面标上字母序号，并在立体图形和外表面展开图的黑色半圆形面（面e和面g）中以黑色半圆形的直径所在的边为起始边，顺时针描边标号，如下图所示。\n\u003cimg data-k=\"9b707c16a39c\" style=\"max-width:279px\">\n\u003cimg data-k=\"39dc5262b075\" style=\"max-width:700px\">\n图①中，标出黑色半圆形面中对应的边1和边4后发现，二者与题干右侧正方体中面g的边1和边4对应一致，可能是题干右侧正方体的外表面展开图。\n图②中，标出黑色半圆形面与小直角三角形面的公共边（即边3）后发现，边3与题干左侧正方体中面e和面f的公共边对应一致，可能是题干左侧正方体的外表面展开图。\n图③中，标出黑色半圆形面中对应的边1和边3后发现，边1与题干右侧正方体中面g的边1不对应一致，不可能是题干右侧正方体的外表面展开图；边3与题干左侧正方体中面e的边3不对应一致，不可能是题干左侧正方体的外表面展开图。故图③不可能是组成长方体的任一正方体的外表面展开图。\n图④中，黑色半圆形面中对应的边1与题干右侧正方体中面g的边1不对应一致，不可能是题干右侧正方体的外表面展开图；黑色半圆形面中对应的边3与题干左侧正方体中面e的边3不对应一致，不可能是题干左侧正方体的外表面展开图。故图④不可能是组成长方体的任一正方体的外表面展开图。\n综上，两个正方体的外表面展开图可能是①和②，对应A项。\n故正确答案为A。","no":66,"missingImage":false},{"type":"question","qid":"13504323","cat":"定义判断","stem":"情绪爆发策略是指在谈判过程中，当双方在某一个问题上相持不下，或者对方的态度、行为欠妥，要求不太合理时，通过情绪爆发、大发脾气等手段有意制造僵局逼迫对方，从而使对方被迫让步的谈判策略。\n根据上述定义，下列符合情绪爆发策略的是：","options":{"A":"小强脾气很是暴躁，做事没有耐心，经常一遇到不顺心的事就生气发火，家里人都不敢和他亲近","B":"老王作为公司负责人经常出去谈判，有时遇到对方提出无理要求，他总会大发脾气直接离席，不再与对方谈判","C":"谈判时，双方在某原则性问题上讨论了两天毫无进展，老周率领代表团临时离席表达自己的不满，最终对方作出了让步","D":"多多与父母沟通，要求买新手机，但被父母拒绝了，多多以离家出走要挟父母必须给他买，父母坚决不同意并对他进行了批评教育"},"answer":"C","explanation":"第一步：找出定义关键词。\n“在谈判过程中”、“双方在某一个问题上相持不下，或者对方的态度、行为欠妥，要求不太合理”、“通过情绪爆发、大发脾气等手段有意制造僵局逼迫对方”、“使对方被迫让步”。\n第二步：逐一分析选项。\nA项：小强脾气很是暴躁，做事没有耐心，遇到不顺心的事就生气发火，是日常做事的态度和行为，不符合“在谈判过程中”，家里人都不敢和他亲近，不符合“使对方被迫让步”，不符合定义，排除；\nB项：老王在谈判过程中，遇到对方提出无理要求，不再与对方谈判，直接终止谈判而不是在继续的谈判中迫使对方让步，不符合“使对方被迫让步”，不符合定义，排除；\nC项：谈判时，双方在某原则性问题上讨论了两天毫无进展，符合“在谈判过程中”、“双方在某一个问题上相持不下”，老周率领代表团临时离席表达自己的不满，最终对方作出了让步，符合“通过情绪爆发、大发脾气等手段有意制造僵局逼迫对方”、“使对方被迫让步”，符合定义，当选；\nD项：多多以离家出走要挟父母必须给他买手机，但父母坚决不同意并对他进行了批评教育，证明父母没有让步，不符合“使对方被迫让步”，不符合定义，排除。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"13504331","cat":"定义判断","stem":"主动收入就是用时间来换取金钱，它最大的特点就是必须花费时间和精力去获得，它是一种临时性收入，做一次工作得到一次回报。被动收入是不需要花费多少时间和精力，也不需要照看，就可以自动获得的收入。\n根据上述定义，下列各项收入中不属于被动收入的是：","options":{"A":"银行存款的收益","B":"授权专利的许可费","C":"每月固定的兼职工资","D":"退休后每月领到的退休金"},"answer":"C","explanation":"第一步：找出定义关键词。\n主动收入：“用时间来换取金钱”、“最大的特点就是必须花费时间和精力去获得”、“一种临时性收入，做一次工作得到一次回报”；\n被动收入：“不需要花费多少时间和精力，也不需要照看，就可以自动获得的收入”。\n第二步：逐一分析选项。\nA项：银行存款的收益无需花费额外的时间和精力，就可自动获得利息，符合“不需要花费多少时间和精力，也不需要照看，就可以自动获得的收入”，符合“被动收入”定义，排除；\nB项：授权专利的许可费无需花费额外的时间和精力，只要有人使用专利，就可获得许可费用，符合“不需要花费多少时间和精力，也不需要照看，就可以自动获得的收入”，符合“被动收入”定义，排除；\nC项：每月固定的兼职工资是需要花费时间和精力的，也是做一次工作得到一次回报，符合“用时间来换取金钱”、“最大的特点就是必须花费时间和精力去获得”、“一种临时性收入，做一次工作得到一次回报”，符合“主动收入”定义，不符合“被动收入”定义，当选；\nD项：退休后每月领到的退休金无需花费额外的时间和精力，是按照当前的相关制度，每月自动发放的，符合“不需要花费多少时间和精力，也不需要照看，就可以自动获得的收入”，符合“被动收入”定义，排除。\n本题为选非题，故正确答案为C。","no":68,"missingImage":false},{"type":"question","qid":"13504322","cat":"定义判断","stem":"在经济学当中，运动防御是指企业不仅要坚守原有市场阵地，还要将业务范围扩展到新的有潜力的领域，以作为将来防御和进攻的中心。\n根据上述定义，下列不属于运动防御的是：","options":{"A":"某石油公司转型为能源公司，市场范围扩展到煤炭、核能、水利和化学等多方面","B":"某饮料公司发现许多人都在控制糖类摄入，于是推出了不少低糖饮料，以此来稳固市场","C":"某手机公司除了钻研提升手机性能以外，近几年还推出了智能穿戴、新能源汽车等多类产品","D":"某白酒公司认识到年轻人对白酒的消费意愿不强，于是拓展进入了冷冻食品等其他行业，实行多元化经营"},"answer":"B","explanation":"第一步：找出定义关键词。\n“企业不仅要坚守原有市场阵地，还要将业务范围扩展到新的有潜力的领域”。\n第二步：逐一分析选项。\nA项：石油公司将业务扩展至煤炭、核能、水利和化学等新的领域，符合“企业不仅要坚守原有市场阵地，还要将业务范围扩展到新的有潜力的领域”，符合定义，排除；\nB项：低糖饮料属于饮料行业的细分产品，饮料公司并未向新的领域扩展业务，不符合“企业不仅要坚守原有市场阵地，还要将业务范围扩展到新的有潜力的领域”，不符合定义，当选；\nC项：手机公司将业务扩展至智能穿戴、新能源汽车等新的领域，符合“企业不仅要坚守原有市场阵地，还要将业务范围扩展到新的有潜力的领域”，符合定义，排除；\nD项：白酒公司将业务扩展至冷冻食品等新的领域，符合“企业不仅要坚守原有市场阵地，还要将业务范围扩展到新的有潜力的领域”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":69,"missingImage":false},{"type":"question","qid":"13504340","cat":"定义判断","stem":"非组织公众就是在公共关系对象中，处于无组织状态的个体的总和，非组织公众一般包括流散型公众、聚散型公众、周期型公众和固定型公众。①流散型公众：极为分散的最不稳定的公众；②聚散型公众：因某一临时事件、活动或某一共同问题临时聚集在一起的公众；③周期型公众：按一定的规律聚集在一起的公众；④固定型公众：由于兴趣、爱好、习惯的影响，比较集中地与某些组织、社团、商店、杂志社或某种商品生产厂家保持稳定联系的公众。\n根据上述定义，下列对应正确的是：","options":{"A":"乘坐北京开往上海高铁的旅客——④","B":"定期来某学校上课的函授班学员——③","C":"经常来社区棋牌室打牌的退休人员——②","D":"奥运会期间来田径体育场观看比赛的观众——①"},"answer":"B","explanation":"第一步：找出定义关键词。\n①流散型公众：“极为分散”、“不稳定”；\n②聚散型公众：“因某一临时事件、活动或某一共同问题”、“临时聚集”；\n③周期型公众：“按一定的规律聚集在一起”；\n④固定型公众：“由于兴趣、爱好、习惯的影响”、“与某些组织、社团、商店、杂志社或某种商品生产厂家保持稳定联系”。\n第二步：逐一分析选项。\nA项：乘坐北京开往上海高铁的旅客，“乘坐高铁”不符合“由于兴趣、爱好、习惯的影响”、“与某些组织、社团、商店、杂志社或某种商品生产厂家保持稳定联系”，不符合“固定型公众”定义，对应错误，排除；\nB项：定期来某学校上课的函授班学员，“定期”符合“按一定的规律聚集在一起”，符合“周期型公众”定义，对应正确，当选；\nC项：经常来社区棋牌室打牌的退休人员，“打牌”符合“由于兴趣、爱好、习惯的影响”，“经常来社区棋牌室”符合“与某些组织、社团、商店、杂志社或某种商品生产厂家保持稳定联系”，符合“固定型公众”定义，不符合“聚散型公众”定义，对应错误，排除；\nD项：奥运会期间来田径体育场观看比赛的观众，“奥运会期间”“看比赛”符合“因某一临时事件、活动或某一共同问题”、“临时聚集”，符合“聚散型公众”定义，不符合“流散型公众”定义，对应错误，排除。\n故正确答案为B。","no":70,"missingImage":false},{"type":"question","qid":"13504336","cat":"定义判断","stem":"生理性购买动机是指消费者为满足由保持和延续生命而引起的各种需要所产生的购买动机，社会性购买动机是指由社会性因素引起的消费者购买商品的动机。消费者的社会性购买动机是在后天社会因素的影响下形成的，一般可分为基本的社会性动机和高级的社会性动机。由社会交往、归属、自主等意念引起的购买动机，属于基本的社会性购买动机；由成就、威望等意念引起的购买动机，属于高级的社会性购买动机。\n根据上述定义，下列属于社会性购买动机的是：","options":{"A":"小乔每周都会和朋友出去约饭喝茶","B":"小华每周都会购买必要的生活物资","C":"小吴每周都会去社区参加义工活动","D":"小曼每个季度会购买刚需换季衣物"},"answer":"A","explanation":"第一步：找出定义关键词。\n生理性购买动机：“消费者为满足由保持和延续生命而引起的各种需要所产生的购买动机”；\n社会性购买动机：“由社会性因素引起的消费者购买商品的动机”、“分为基本的社会性动机和高级的社会性动机”；\n基本的社会性购买动机：“由社会交往、归属、自主等意念引起的购买动机”；\n高级的社会性购买动机：“由成就、威望等意念引起的购买动机”。\n第二步：逐一分析选项。\nA项：小乔每周都会和朋友出去约饭喝茶，符合“由社会交往、归属、自主等意念引起的购买动机”，符合“基本的社会性购买动机”定义，也符合“社会性购买动机”定义，当选；\nB项：小华每周都会购买必要的生活物资，符合“消费者为满足由保持和延续生命而引起的各种需要所产生的购买动机”，符合“生理性购买动机”定义，不符合“社会性购买动机”定义，排除；\nC项：小吴每周都会去社区参加义工活动，参加义工活动不涉及购买商品，不符合“由社会性因素引起的消费者购买商品的动机”，不符合“社会性购买动机”定义，排除；\nD项：小曼每个季度会购买刚需换季衣物，符合“消费者为满足由保持和延续生命而引起的各种需要所产生的购买动机”，符合“生理性购买动机”定义，不符合“社会性购买动机”定义，排除。\n故正确答案为A。","no":71,"missingImage":false},{"type":"question","qid":"13504324","cat":"定义判断","stem":"文化再生产是指文化模式、信仰、价值观、习俗、语言和其他社会行为在时间上的持续性和在不同社会成员之间的传递，通常通过教育系统、家庭、媒体、宗教机构和其他社会机构来实现。这些机构通过传授知识、规范和行为模式，帮助新一代成员学习并内化其文化。\n根据上述定义，下列一定属于文化再生产的是：","options":{"A":"小王在单亲家庭长大，从小养成了独立的性格","B":"在公司聚会上，小李向同事介绍自己的女朋友","C":"某小学开设了具有当地特色的民俗课，深受学生喜爱","D":"电视上不断滚动播放着某品牌家用饮水设备的广告语"},"answer":"C","explanation":"第一步：找出定义关键词。\n“文化模式、信仰、价值观、习俗、语言和其他社会行为”、“时间上的持续性”、“不同社会成员之间的传递”。\n第二步：逐一分析选项。\nA项：单亲家庭中长大的小王，养成了独立的性格，性格是一个人对现实的相对稳定的态度，不符合“文化模式、信仰、价值观、习俗、语言和其他社会行为”，养成独立的性格也不符合“不同社会成员之间的传递”，不符合定义，排除；\nB项：小李在公司聚会上向同事们介绍自己的女朋友，传递给同事的信息是关于女朋友的基本情况，不符合“文化模式、信仰、价值观、习俗、语言和其他社会行为”，不符合定义，排除；\nC项：某小学开设了具有当地特色的民俗课，民俗课可以将当地特色的民间文化通过课程的形式传递给同学们，符合“文化模式、信仰、价值观、习俗、语言和其他社会行为”、“不同社会成员之间的传递”，课程深受学生喜爱，同学们通过学习逐渐了解并认同这些民俗，有利于把当地特色民俗传承下去，符合“时间上的持续性”，符合定义，当选；\nD项：某品牌家用饮水设备的广告语不断在电视上滚动播放，电视广告传递的是饮水设备的产品信息，不符合“文化模式、信仰、价值观、习俗、语言和其他社会行为”，不符合定义，排除。\n故正确答案为C。","no":72,"missingImage":false},{"type":"question","qid":"13504346","cat":"定义判断","stem":"在管理心理学中，人们把在不记姓名或相互不了解的情况下个体独立性、自主性得到充分体现的现象，称之为匿名效应。\n根据上述定义，下列属于匿名效应的是：","options":{"A":"小刘到了一个新成立的公司，大家互相不了解，因此他尽量收敛自己的锋芒","B":"小方只想在现在的岗位上工作，没有长远规划，常常以不会为理由推脱各项工作","C":"学校要求匿名对教师进行评价，小林虽然不喜欢张老师，但还是给她的评价写了“优”","D":"小丁随便报了个旅行团到陌生城市旅行，在旅行中大胆尝试不同的穿衣风格，释放真实的自己"},"answer":"D","explanation":"第一步：找出定义关键词。\n“不记姓名或相互不了解的情况”、“个体独立性、自主性得到充分体现”。\n第二步：逐一分析选项。\nA项：小刘到了新成立的公司，符合“不记姓名或相互不了解的情况”，但小刘收敛自己的锋芒，没有真正地展现自己，不符合“个体独立性、自主性得到充分体现”，不符合定义，排除； \nB项：小方在现在的岗位上工作，不清楚是否是“相互不了解的情况”，常常以不会为理由推脱各项工作，不清楚是否真的不会，不符合“个体独立性、自主性得到充分体现”，不符合定义，排除；\nC项：小林不喜欢张老师，但还是评价了“优”，并没有展现自主性，不符合“个体独立性、自主性得到充分体现”，不符合定义，排除；\nD项：小丁到陌生城市旅行，符合“不记姓名或相互不了解的情况”，在旅行中释放真实的自己，符合“个体独立性、自主性得到充分体现”，符合定义，当选。\n故正确答案为D。","no":73,"missingImage":false},{"type":"question","qid":"13504349","cat":"定义判断","stem":"组合是指把多项看似不相关的事物通过想象加以联接，从而使之变成新的整体。按照组合方式不同，组合可分为三种：同类组合是指若干相同事物的组合；异类组合是指两种或两种以上不同事物的组合；重组组合是指分解事物的原来组合，再按照新的目标重新组合。\n根据上述定义，下列属于重组组合的是：","options":{"A":"在手机壳背后安一个钢圈，制成带支架的手机壳","B":"用100根雪糕棍制作成房子、坦克等手工艺制品","C":"在台灯底座安装紫外线灭蚊装置，设计出灭蚊灯","D":"将原来拼装成大风车的积木拆开，再拼装成飞机"},"answer":"D","explanation":"第一步：找出定义关键词。\n组合：“把多项看似不相关的事物”、“通过想象加以联接”；\n同类组合：“若干相同事物的组合”；\n异类组合：“两种或两种以上不同事物的组合”；\n重组组合：“分解事物的原来组合，再按照新的目标重新组合”。\n第二步：逐一分析选项。\nA项：在手机壳背后安装一个钢圈，是在原有的基础上加上一个东西，并未分解事物的原来组合，不符合“分解事物的原来组合，再按照新的目标重新组合”，不符合“重组组合”定义，排除；\nB项：用100根雪糕棍制作成房子等手工艺制品，是同一种事物的组合，符合“若干相同事物的组合”，符合“同类组合”定义，不符合“重组组合”定义，排除；\nC项：在台灯底座安装紫外线灭蚊装置，是在台灯底座原有的基础上安装，并未分解事物的原来组合，不符合“分解事物的原来组合，再按照新的目标重新组合”，不符合“重组组合”定义，排除；\nD项：将原来拼装成大风车的积木拆开，符合“分解事物的原来组合”，再拼装成飞机，符合“再按照新的目标重新组合”，符合“重组组合”定义，当选。\n故正确答案为D。","no":74,"missingImage":false},{"type":"question","qid":"13504408","cat":"类比推理","stem":"公文：公告：通告","options":{"A":"湿地：水松：水杉","B":"信息：图像：文字","C":"卷纸：卫生纸：餐巾纸","D":"运动器材：动感单车：引体向上"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n公文是法定机关与组织在公务活动中，按照特定的体式、经过一定的处理程序形成和使用的书面材料；公告和通告都是公文的一种类型。公告和通告是并列关系，二者分别和公文构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：湿地是一种生态系统，水松和水杉是湿地中的两种植物。水松和水杉是并列关系，二者分别和湿地是地点对应关系，与题干逻辑关系不一致，排除；\nB项：图像和文字是两种不同的信息。图像和文字是并列关系，二者分别和信息构成种属关系，与题干逻辑关系一致，当选；\nC项：卷纸通常指的是一种用于卫生、清洁等目的的长条形、可卷曲的纸张；卫生纸和餐巾纸是不同用途的两种生活用纸。卫生纸和餐巾纸是并列关系，二者分别和卷纸构成交叉关系，与题干逻辑关系不一致，排除；\nD项：动感单车是一种运动器材，但引体向上是一种动作，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":75,"missingImage":false},{"type":"question","qid":"13504269","cat":"类比推理","stem":"欲穷千里目：更上一层楼","options":{"A":"为唤春来争艳朵：甘将香化育花泥","B":"不经一番寒彻骨：怎得梅花扑鼻香","C":"欲上高楼去避愁：愁还随我上高楼","D":"抛开俗事陪山坐：才得闲心听水歌"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“欲穷千里目，更上一层楼”的意思是想要看到千里之外的风光，那就要再登上更高的一层城楼，其中“欲穷千里目”是目的，“更上一层楼”是方式，二者为方式目的的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“为唤春来争艳朵，甘将香化育花泥”的意思是为了春天的花朵绽放，甘愿化作花泥，其中“为唤春来争艳朵”是目的，“甘将香化育花泥”是方式，二者为方式目的的对应关系，与题干逻辑关系一致，当选；\nB项：“不经一番寒彻骨，怎得梅花扑鼻香”的意思是只有经历艰苦（寒彻骨），才能获得美好的结果（梅花香），二者不是方式目的的对应关系，与题干逻辑关系不一致，排除；\nC项：“欲上高楼去避愁，愁还随我上高楼”的意思是心想到高楼上观看美景躲避忧愁，忧愁还是跟着我上了高楼，二者不是方式目的的对应关系，与题干逻辑关系不一致，排除；\nD项：“抛开俗事陪山坐，才得闲心听水歌”的意思是放下世俗的琐事、烦恼和欲望，与山为伴，亲近自然，才能获得内心的闲适与安宁，聆听流水的声音，感受自然的美好，二者为条件结果的对应关系，不是方式目的的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":76,"missingImage":false},{"type":"question","qid":"13504281","cat":"类比推理","stem":"加大培训：稳定就业：扩充岗位","options":{"A":"预防流感：接种疫苗：增强体质","B":"增加营收：提高利润：降低成本","C":"建立信任：有效沟通：促成合作","D":"浸泡催芽：翻土播种：浇水追肥"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n加大培训和扩充岗位都是为了稳定就业，第一词和第三词都与第二词构成方式目的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：接种疫苗和增强体质都是为了预防流感，第二词和第三词都与第一词构成方式目的对应关系，与题干逻辑关系不一致，排除；\nB项：增加营收和降低成本都是为了提高利润，第一词和第三词都与第二词构成方式目的对应关系，与题干逻辑关系一致，当选；\nC项：建立信任和有效沟通都是为了促成合作，第一词和第二词都与第三词构成方式目的对应关系，与题干逻辑关系不一致，排除；\nD项：先浸泡催芽，然后翻土播种，最后浇水追肥，三者为动作先后的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":77,"missingImage":false},{"type":"question","qid":"13504387","cat":"类比推理","stem":"覆：盖：覆盖","options":{"A":"寒：酸：寒酸","B":"厚：重：厚重","C":"喉：舌：喉舌","D":"抚：摸：抚摸"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“覆”、“盖”、“覆盖”均指遮盖，三者是近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“寒”指冷、穷困，“酸”指像醋的气味或味道，二者不是近义关系，与题干逻辑关系不一致，排除；\nB项：“厚”指扁平物体上下两个面的距离大，“重”指分量较大、程度深，二者不是近义关系，与题干逻辑关系不一致，排除；\nC项：“喉”指介于咽和气管之间的部分，“舌”指舌头，二者不是近义关系，与题干逻辑关系不一致，排除；\nD项：“抚”、“摸”、“抚摸”均指用手指轻轻触摸，三者是近义关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"13504405","cat":"类比推理","stem":"刑罚：改造罪犯：处罚","options":{"A":"格言：指导言行：语句","B":"审计：收入分配：监督","C":"比喻：生动描写：借喻","D":"科研：本质规律：活动"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n刑罚是指审判机关依据刑事法律对罪犯所施行的法律制裁。刑罚是处罚的一种，二者为种属关系；刑罚的功能是改造罪犯，二者为功能的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：格言是指含有劝诫和教育意义的话。格言是语句的一种，二者为种属关系；格言的功能是指导言行，二者为功能的对应关系，与题干逻辑关系一致，当选；\nB项：审计是指由专设机关依照法律对国家各级政府及金融机构、企业事业组织的重大项目和财务收支进行事前和事后的监督、检查。审计是监督的一种具体形式，二者为种属关系；但审计的功能是监督和检查收入分配，收入分配是审计的对象，二者为作用对象的对应关系，与题干逻辑关系不一致，排除；\nC项：借喻是比喻的一种，直接借比喻的事物来代替被比喻的事物，被比喻的事物和比喻词都不出现。借喻和比喻是种属关系，但词语顺序与题干相反；比喻的功能是生动描写，二者为功能的对应关系，与题干逻辑关系不一致，排除；\nD项：科研是活动的一种，二者为种属关系；但科研的功能是探索本质规律，本质规律是科研的对象，二者为作用对象的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":79,"missingImage":false},{"type":"question","qid":"13504285","cat":"类比推理","stem":"发炎：发烧","options":{"A":"饥饿：烧烤","B":"学习：考试","C":"祭祀：缅怀","D":"缺铁：贫血"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n发炎表现为红、肿、热、痛和功能障碍，所以发炎可以导致发烧，二者为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：饥饿会导致胃肠疾病或者低血糖等，不会导致烧烤，二者不是因果对应关系，与题干逻辑关系不一致，排除；\nB项：学习是为了准备考试，二者为方式目的的对应关系，与题干逻辑关系不一致，排除；\nC项：祭祀是一种缅怀的方式，二者为方式目的的对应关系，与题干逻辑关系不一致，排除；\nD项：缺铁可以导致贫血，二者为因果对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":80,"missingImage":false},{"type":"question","qid":"13504319","cat":"类比推理","stem":"（    ） 对于 斜拉桥 相当于 燃油车 对于（    ）","options":{"A":"拱式桥；摩托车","B":"钢架桥；人力车","C":"人行桥；网约车","D":"独木桥；违章车"},"answer":"C","explanation":"逐一代入选项。\nA项：拱式桥和斜拉桥是两种不同结构类型的桥，二者是并列关系；有的摩托车是燃油车，有的燃油车是摩托车，有的摩托车不是燃油车，有的燃油车不是摩托车，二者是交叉关系，前后逻辑关系不一致，排除；\nB项：有的钢架桥是斜拉桥，有的斜拉桥是钢架桥，有的钢架桥不是斜拉桥，有的斜拉桥不是钢架桥，二者是交叉关系；燃油车和人力车是两种不同动力来源的车，二者是并列关系，前后逻辑关系不一致，排除；\nC项：有的人行桥是斜拉桥，有的斜拉桥是人行桥，有的人行桥不是斜拉桥，有的斜拉桥不是人行桥，二者是交叉关系；有的网约车是燃油车，有的燃油车是网约车，有的网约车不是燃油车，有的燃油车不是网约车，二者是交叉关系，前后逻辑关系一致，当选；\nD项：独木桥和斜拉桥是两种不同结构类型的桥，二者是并列关系；有的违章车是燃油车，有的燃油车是违章车，有的违章车不是燃油车，有的燃油车不是违章车，二者是交叉关系，前后逻辑关系不一致，排除。\n故正确答案为C。\n注：有同学可能会认为B项的钢架桥和斜拉桥是按照结构划分的两种不同的桥梁，但是按照结构划分的应为“刚”架桥，选项中的“钢”架桥为按照材料划分的，二者并不相同。","no":81,"missingImage":false},{"type":"question","qid":"13504406","cat":"类比推理","stem":"大天白日 对于 （    ） 相当于 （    ） 对于 月黑风高","options":{"A":"昼伏夜行；光天化日","B":"更深露重；日上三竿","C":"月明星稀；夜深人静","D":"白日当空；夙兴夜寐"},"answer":"B","explanation":"逐一代入选项。\nA项：“大天白日”指白天，“昼伏夜行”指白天隐藏起来，晚上出来赶路，为避免被敌人发现所采取的秘密活动，二者无明显逻辑关系；“光天化日”指大家看得很清楚的地方，“月黑风高”比喻没有月光风也很大的夜晚，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nB项：“大天白日”指白天，“更深露重”指夜深后，外面很冷，开始有露水，二者形容的时间相反；“日上三竿”形容太阳升得很高，天已大亮，“月黑风高”比喻没有月光风也很大的夜晚，二者形容的时间相反，前后逻辑关系一致，当选；\nC项：“大天白日”指白天，“月明星稀”指月亮明亮时，星星就显得稀疏了，二者形容的时间相反；“夜深人静”指深夜没有人声，非常寂静，“月黑风高”比喻没有月光风也很大的夜晚，二者形容的时间相近，前后逻辑关系不一致，排除；\nD项：“大天白日”指白天，“白日当空”指太阳高悬天空，二者形容的时间相近；“夙兴夜寐”指早起晚睡，形容勤劳，“月黑风高”比喻没有月光风也很大的夜晚，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":82,"missingImage":false},{"type":"question","qid":"13504373","cat":"逻辑判断","stem":"汉朝建立后，在秦咸阳故都的基础上建立了长安城。经过西汉末年、东汉末年和魏晋南北朝期间的长期战乱，长安城日益凋敝。城门、宫殿、武库及城南的礼制建筑等都在战火中被毁，唐朝建立后，虽然汉都长安已破败不堪，但是唐长安城仍与其关联密切。有学者认为，汉长安城实际上成为了唐长安城的一部分。\n以下哪项如果为真，最能支持上述学者的观点？","options":{"A":"汉长安城的渭南内城被划入了唐长安城西北角的禁苑，成为专供皇室游猎的场所","B":"唐朝政府设有专门的机构管理汉长安城的主要遗迹，还曾对汉未央宫进行过修葺扩建","C":"至唐朝时，汉长安城的城墙城门、部分宫殿、武库、官署和角楼等建筑及道路都还保留完好","D":"隋朝建立都城时，曾从汉长安城的宫室建筑拆取了一些大型建材，这些都为后世的唐朝所继承"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：汉长安城实际上成为了唐长安城的一部分。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：汉长安城的渭南内城被划入了唐长安城西北角的禁苑，说明汉长安城确实成为了唐长安城的一部分，补充论据，可以加强，当选；\nB项：唐朝政府会管理汉长安城的主要遗迹并修葺扩建过汉未央宫，但汉长安城的主要遗迹和汉未央宫是否被纳入了唐长安城并不清楚，为不明确项，无法加强，排除；\nC项：汉长安城的部分建筑及道路至唐朝时仍保留完好，但其是否被纳入了唐长安城并不清楚，为不明确项，无法加强，排除；\nD项：唐朝部分建筑的“建材”来自汉长安城的宫室建筑，而论点讨论的是汉长安“城”实际上成为了唐长安城的一部分，建材无法代表城池，话题不一致，无法加强，排除。\n故正确答案为A。","no":83,"missingImage":false},{"type":"question","qid":"13504379","cat":"逻辑判断","stem":"自己烧水喝与直接喝包装水，哪一种更健康？一种观点认为，包装水中含有大量的微塑料，直接喝包装水会使微塑料进入体内，危害健康，因此自己烧水喝比直接喝包装水健康，另一种观点则认为，当前微塑料污染无处不在，海洋、污水、淡水、饮用水中均含有微塑料，因此自己烧水喝与直接喝包装水对健康的影响是一样的。\n以下哪项如果为真，最能削弱第二种观点？","options":{"A":"在日常饮食中应尽量减少微塑料进入体内","B":"把水烧开后，可以除去高达84%的微塑料","C":"自然水域中的微塑料已危害到野生动物健康","D":"微塑料可以进入血液，甚至抵达心脏和大脑"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：自己烧水喝与直接喝包装水对健康的影响是一样的。\n论据：当前微塑料污染无处不在，海洋、污水、淡水、饮用水中均含有微塑料。\n本题论点讨论是自己烧水喝与直接喝包装水对健康的影响相同，论据讨论的是所有水中都含有微塑料，二者话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：指出日常饮食中应该减少微塑料的摄入，与论点讨论的自己烧水喝与直接喝包装水对健康的影响相同无关，话题不一致，无法削弱，排除；\nB项：指出水烧开后可以除去84%的微塑料，说明自己烧水喝比直接喝包装水摄入的微塑料少，因此自己烧水喝与直接喝包装水对健康的影响不一样，削弱论点，可以削弱，当选；\nC项：指出自然水域中的微塑料危害到“野生动物”的健康，与论点讨论的“人体健康”无关，话题不一致，无法削弱，排除；\nD项：指出微塑料的危害，但不清楚自己烧的水与直接饮用包装水中的微塑料含量是否相同，为不明确项，无法削弱，排除。\n故正确答案为B。","no":84,"missingImage":false},{"type":"question","qid":"13504369","cat":"逻辑判断","stem":"研究人员比较了过去几年自动驾驶车辆和人类驾驶车辆的相关数据发现，一般情况下，与人类驾驶相比，自动驾驶车辆在执行常规驾驶任务，如保持车道位置和根据车流调整位置时更安全，研究人员认为，以自动驾驶车辆代替人类驾驶车辆上路可以大大减少交通事故。\n上述结论需要补充以下哪项作为前提？","options":{"A":"当前交通事故主要发生在常规驾驶任务中","B":"过去几年自动驾驶车辆技术水平发展迅速","C":"自动驾驶车辆可以为道路交通提供精准导航","D":"自动驾驶车辆和人类驾驶车辆存在风险差异"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：以自动驾驶车辆代替人类驾驶车辆上路可以大大减少交通事故。\n论据：一般情况下，与人类驾驶相比，自动驾驶车辆在执行常规驾驶任务，如保持车道位置和根据车流调整位置时更安全。\n论据和论点都在说自动驾驶车辆比人类驾驶更安全，二者话题一致，且提问方式为“前提”，加强优先考虑补充必要条件。\n第二步：逐一分析选项。\nA项：选项表明当前交通事故主要发生在常规驾驶任务中，如果该项不成立，即交通事故大多都不是发生在常规驾驶任务中，那么就无法根据论据“在执行常规驾驶任务时，自动驾驶车辆比人类驾驶更安全”得出论点，因此该项是论点成立的必要条件，可以加强，当选；\nB项：选项表明过去几年自动驾驶车辆技术水平发展迅速，但不明确以自动驾驶车辆代替人类驾驶车辆上路是否可以减少交通事故，无法加强，排除；\nC项：选项表明自动驾驶车辆可以为道路交通提供精准导航，说的是自动驾驶车辆的导航能力，而论点说的是自动驾驶车辆的安全性，话题不一致，无法加强，排除；\nD项：选项表明自动驾驶车辆和人类驾驶车辆存在风险差异，但不明确以自动驾驶车辆代替人类驾驶车辆上路是否可以减少交通事故，无法加强，排除。\n故正确答案为A。","no":85,"missingImage":false},{"type":"question","qid":"13504367","cat":"逻辑判断","stem":"某商场发生了一起电梯坠落事故，对于事故发生的原因，甲、乙二人展开了讨论。甲说：此次电梯坠落事故的责任在于电梯维保单位，事故电梯维保单位没有严格按照安全技术规范要求对电梯进行实质性维保。乙说：此次电梯坠落事故的发生与事故电梯维保单位没有关系，事故电梯向下运行过程中，对重反绳轮滚动轴承因疲劳剥落失效，出现了卡死现象，这才是导致事故发生的原因。\n以下哪项如果为真，最能削弱乙的意见？","options":{"A":"事故电梯维保单位负责保养的其他电梯并没有出现类似事故，目前都在正常运行","B":"由于安全监管等相关部门的重视，对所有电梯元件的生产、安装、维保都有严格的规定，由此导致的事故数量呈现逐年下降趋势","C":"当前出现的电梯事故的主要原因是人的不安全行为，如超载、反复开关梯门、在电梯运行过程中蹦跳等，而非电梯本身的不安全状态","D":"事故电梯维保单位没有严格按照安全技术规范要求对电梯进行实质性维保，导致对重反绳轮滚动轴承老化，出现卡死现象"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：此次电梯坠落事故的发生与事故电梯维保单位没有关系，事故电梯向下运行过程中，对重反绳轮滚动轴承因疲劳剥落失效，出现了卡死现象，这才是导致事故发生的原因。\n论据：无。\n本题只有论点没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项说的是事故电梯维保单位负责保养的“其他电梯”正常运行，但不能说明题干商场发生事故的电梯问题与维保单位无关，无法削弱，排除；\nB项：该项说的是安全监管等相关部门对电梯元件的规定及事故数量下降趋势，与论点讨论的此次电梯坠落事故发生的原因无关，为无关项，无法削弱，排除；\nC项：该项说的是电梯事故的主要原因是人的不安全行为，而非电梯本身的不安全状态，但不明确人的不安全行为与论点讨论的原因之间的关系，为不明确项，无法削弱，排除；\nD项：该项说的是事故电梯维保单位没有严格按照要求对电梯进行实质性维保，导致对重反绳轮滚动轴承老化，出现卡死现象，说明从根本上来说，是电梯维保单位没有严格按照要求对电梯进行实质性维保导致了事故的发生，直接削弱了乙的观点，可以削弱，当选。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"13504381","cat":"逻辑判断","stem":"为研究雄性小鼠肠道微生物组对后代健康的影响，研究人员给雄性小鼠注射了6周抗生素，导致它们肠道微生物多样性和丰富度下降，结果发现这些小鼠的后代出生时体重较轻、生长严重受限以及过早死亡的概率更高，研究人员认为，这一效应与雄性生殖系统对微生物组失衡的反应有关，这种反应可能会增加胎盘功能不全的风险，因此，雄性小鼠肠道微生物组紊乱可能会影响后代健康。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"在雌性小鼠受孕前，若紊乱的雄性小鼠肠道微生物组得到恢复，则能降低后代不健康的风险","B":"研究中雄性小鼠生殖系统对微生物组失衡的反应包括激素信号受损和睾丸代谢物特征改变","C":"导致雄性小鼠肠道微生物组紊乱的环境因素会引发宿主的生理和疾病反应","D":"对哺乳动物而言，雄性的健康状况很有可能会遗传给后代"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：雄性小鼠肠道微生物组紊乱可能会影响后代健康。\n论据：研究人员给雄性小鼠注射了6周抗生素，导致它们肠道微生物多样性和丰富度下降，结果发现这些小鼠的后代出生时体重较轻、生长严重受限以及过早死亡的概率更高，研究人员认为，这一效应与雄性生殖系统对微生物组失衡的反应有关，这种反应可能会增加胎盘功能不全的风险。\n本题论点和论据均在讨论雄性小鼠肠道微生物对后代健康的影响，论点论据话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：选项说在雌性小鼠受孕前，紊乱的雄性小鼠肠道微生物组如果恢复，则能降低后代不健康的风险，补充反面论据说明雄性小鼠肠道微生物组紊乱确实会影响后代健康，补充论据，可以加强，当选；\nB项：选项说研究中雄性小鼠生殖系统对微生物组失衡的反应包括哪些特征改变，但论点讨论的是雄性小鼠肠道微生物组紊乱是否会影响后代健康，话题不一致，无法加强，排除；\nC项：选项说导致雄性小鼠肠道微生物组紊乱的环境因素会引发宿主的生理和疾病反应，但论点讨论的是雄性小鼠肠道微生物组紊乱是否会影响后代健康，话题不一致，无法加强，排除；\nD项：选项说哺乳动物雄性的健康状况很有可能会遗传给后代，但是不确定雄性小鼠肠道微生物组紊乱是否会影响后代健康，为不明确选项，无法加强，排除。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"13504368","cat":"逻辑判断","stem":"研究人员调查了负面情绪（包括愤怒、焦虑和悲伤）是否会对人体产生不利影响。研究中，280名成年人被随机分配4项情绪任务之一，包括回忆让他们愤怒的个人经历；回忆令自己感到焦虑的事件；阅读一系列引发悲伤的令人沮丧的句子；或者反复从1数到100以诱发中性情绪状态。研究发现，从任务完成后的0分钟到40分钟，回忆愤怒经历会导致血管舒张能力受损。40分钟后，这种状况才消失，而相较于愤怒，焦虑和悲伤情绪并没有引发血管内壁功能的显著变化。研究人员据此认为，愤怒会增加患动脉粥样硬化的风险。\n上述论证的成立需要补充以下哪项作为前提？","options":{"A":"血管舒张能力受损引发血管内壁功能的显著变化","B":"回忆愤怒的经历与心血管疾病之间存在显著关联","C":"血管舒张能力受损会增加患动脉粥样硬化的风险","D":"研究开始前，受试者都未检出血管舒张能力受损"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：愤怒会增加患动脉粥样硬化的风险。\n论据：回忆愤怒经历会导致血管舒张能力受损，而焦虑和悲伤情绪并没有引发血管内壁功能的显著变化。\n本题论点说的是“愤怒”与“患动脉粥样硬化的风险”之间的关系，论据说的是“愤怒”与“血管舒张能力受损”之间的关系，二者话题不一致，且提问方式为“前提”，加强优先考虑搭桥，即在“血管舒张能力受损”与“患动脉粥样硬化的风险”之间建立联系。\n第二步：逐一分析选项。\nA项：指出血管舒张能力受损引发血管内壁功能的显著变化，但不明确是否会增加患动脉粥样硬化的风险，不明确选项，无法加强，排除；\nB项：指出回忆愤怒经历与心血管疾病之间存在关联，但不明确是否会增加患动脉粥样硬化的风险，不明确选项，无法加强，排除；\nC项：指出血管舒张能力受损会增加患动脉粥样硬化的风险，在“血管舒张能力受损”与“患动脉粥样硬化的风险”之间建立了联系，搭桥选项，是论证成立的前提，当选；\nD项：指出实验前受试者都未检出血管舒张能力受损，说明实验具有科学性，但论点讨论的是患动脉粥样硬化的风险，所以不是论证成立的前提，排除。\n故正确答案为C。","no":88,"missingImage":false},{"type":"question","qid":"13504366","cat":"逻辑判断","stem":"深度睡眠阶段，人体会从大脑中移除不想要的或可能有害的物质，包括阿尔茨海默病中聚集的主要蛋白质，如Tau蛋白。阿尔茨海默病患者的一种病理变化是脑内Tau蛋白过度磷酸化，在细胞内堆积形成神经原纤维缠结。因此有研究者认为，深度睡眠不足会增加罹患阿尔茨海默病的风险。\n以下哪项如果为真，最能削弱上述结论?","options":{"A":"神经原纤维缠结与神经细胞死亡和认知功能障碍密切相关","B":"携带阿尔茨海默病高风险基因的人更可能出现深度睡眠不足","C":"精神刺激、创伤、神经系统疾病等因素都可诱发阿尔茨海默病","D":"年轻人的深度睡眠占睡眠时间的20%~25%，老年人只占5%~7%"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：深度睡眠不足会增加罹患阿尔茨海默病的风险。\n论据：深度睡眠阶段，人体会从大脑中移除不想要的或可能有害的物质，包括阿尔茨海默病中聚集的主要蛋白质，如Tau蛋白。阿尔茨海默病患者的一种病理变化是脑内Tau蛋白过度磷酸化，在细胞内堆积形成神经原纤维缠结。\n本题论点和论据讨论的都是深度睡眠和患阿尔茨海默病的风险之间的关系，二者话题一致，优先考虑削弱论点，且论点包含因果关系，还可以考虑因果倒置或他因削弱。\n第二步：逐一分析选项。\nA项：该项指出神经原纤维缠结与神经细胞死亡和认知功能障碍密切相关，但是，由于认知功能障碍包含的疾病类型诸多，不一定只有阿尔茨海默病，因此选项不明确，无法削弱，排除；\nB项：该项指出携带阿尔茨海默病高风险基因的人更可能出现深度睡眠不足，说明深度睡眠不足可能是由阿尔茨海默病的遗传风险（高风险基因）引起的，而不是深度睡眠不足导致了阿尔茨海默病，因此选项为因果倒置，可以削弱，当选；\nC项：该项说明精神刺激、创伤、神经系统疾病等因素都可诱发阿尔茨海默病，提出了其他可能的阿尔茨海默病的风险因素，但并未说明这些因素与深度睡眠的关系，因此无法削弱深度睡眠不足和阿尔茨海默病之间的关系，话题不一致，无法削弱，排除；\nD项：该项指出年轻人和老年人深度睡眠在睡眠时间中的占比，说明深度睡眠的比例随着年龄的增长而减少，但它并没有说明年轻人和老年人中患阿尔茨海默病的占比，因此无法直接削弱深度睡眠不足和阿尔茨海默病之间的关系，话题不一致，无法削弱，排除。\n故正确答案为B。","no":89,"missingImage":false},{"type":"question","qid":"13504393","cat":"逻辑判断","stem":"一项有关办公模式的研究中，研究机构选择了全球最大在线旅行社之一的M公司员工进行了实验，该公司员工约有1600人，研究发现，与每天到办公室工作相比，每周居家办公两天的混合办公模式不仅没有影响员工的工作表现，还能有效降低人力成本。因此，研究机构认为：混合办公模式是公司运营的有效模式。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"M公司推行混合办公模式后，员工辞职率下降了33%","B":"M公司中，采用混合办公模式人员和非混合办公模式人员在晋升方面机会均等","C":"近几年来全球约1亿员工采用混合工作制，M公司所在国有很多企业都赞成该模式","D":"如果员工每周5天不在办公室工作，员工培训指导以及公司文化都会受到较大影响"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：混合办公模式是公司运营的有效模式。\n论据：一项对M公司员工约1600人进行的实验发现，与每天到办公室工作相比，每周居家办公两天的混合办公模式不仅没有影响员工的工作表现，还能有效降低人力成本。\n本题论据说的是混合办公模式的一些优势，论点说的是混合办公模式是公司运营的有效模式，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是混合办公模式降低了M公司的辞职率，提升了员工的稳定性，有利于公司运营，补充论据，可以加强，当选；\nB项：该项说的是混合办公模式对“人员晋升”的影响，不涉及公司运营，话题不一致，无法加强，排除；\nC项：该项说的是混合办公模式的使用情况和其他企业的态度，不涉及公司运营，话题不一致，无法加强，排除；\nD项：该项说的是混合办公模式产生的负面影响，不利于公司运营，具有削弱作用，排除。\n故正确答案为A。","no":90,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        截至2023年底，全国现有海水淡化工程156个，同比增加了6个。其中，万吨级及以上海水淡化工程55个，工程规模2300723吨/日，千吨及以上万吨级以下海水淡化工程51个，工程规模208266吨/日，千吨级以下海水淡化工程50个，全国海水淡化工程分布点10个省级行政区。\u003c/p>\u003cp>\u003cimg data-k=\"1882fa2b2730\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"13504524","cat":"增长","stem":"2020-2023年间，全国年底海水淡化工程规模同比增速最快的年份 <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
