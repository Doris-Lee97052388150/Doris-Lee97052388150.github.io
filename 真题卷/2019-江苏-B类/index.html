<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2019-江苏-B类","title":"2019年江苏省公务员录用考试《行测》题（B类）（网友回忆版）","year":"2019","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2367770","cat":"新思想","stem":"党的十八大以来，党中央团结带领全党全国各族人民，深刻回答了重大时代课题，形成了习近平新时代中国特色社会主义思想。关于习近平新时代中国特色社会主义思想，下列表述正确的是\n①根本立场是以人民为中心，坚持人民主体地位\n②核心要义是坚持和发展中国特色社会主义\n③精髓是为人民谋幸福、为民族谋复兴、为世界作贡献\n④理论特色是体现了理论与实际相结合、战略和战术相一致","options":{"A":"①②③","B":"①③④","C":"②③④","D":"①②③④"},"answer":"D","explanation":"本题考查政治常识。\n①正确，习近平新时代中国特色社会主义思想始终强调“以人民为中心”的根本立场。坚持以人民为中心的发展思想，是习近平新时代中国特色社会主义思想的核心价值取向，是对马克思主义人民观的继承和发展，与中国共产党的初心一脉相承。\n②正确，坚持和发展中国特色社会主义，是改革开放以来我们党全部理论和实践的鲜明主题，是习近平新时代中国特色社会主义思想的核心要义。\n③正确，习近平新时代中国特色社会主义思想的精髓是为人民谋幸福、为民族谋复兴、为世界作贡献，集中反映了当代中国共产党人的人民立场、民族抱负、世界责任。\n④正确，《习近平新时代中国特色社会主义思想三十讲》指出：“八个明确”、“十四个坚持”有机融合、有机统一，凝结着我们党坚持和发展中国特色社会主义的经验总结，凝结着以习近平同志为核心的党中央对中国特色社会主义规律认识的深化、拓展、升华，体现了理论与实际相结合、战略与战术相一致、认识论和方法论相统一的理论特色。因此①②③④正确。\n故正确答案为D。","no":1,"missingImage":false}],"count":1,"answerable":1,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2367771","cat":"经济常识","stem":"改革开放40多年来，我国取得了举世瞩目的历史性发展成就。关于我国经济发展成就，下列说法正确的是\n①国内生产总值年均实际增长率，远高于同期世界经济年均增长率\n②我国成为世界第二大经济体、商品消费第二大国、外资流入第二大国\n③主要农产品产量跃居世界前列，建立了全世界最完整的现代工业体系\n④我国成为世界制造业第一大国、货物贸易第一大国，外汇储备连续多年位居世界第一","options":{"A":"①③④","B":"①②③","C":"②③④","D":"①②③④"},"answer":"D","explanation":"本题考查政治常识。\n庆祝改革开放40周年大会于2018年12月18日上午10时在人民大会堂举行。中共中央总书记、国家主席、中央军委主席习近平出席大会并发表重要讲话。讲话指出：“40年来，我们始终坚持以经济建设为中心，不断解放和发展社会生产力，我国国内生产总值远高于同期世界经济的年均增速。我国主要农产品产量跃居世界前列，建立了全世界最完整的现代工业体系，科技创新和重大工程捷报频传。我国基础设施建设成就显著，信息畅通，公路成网，铁路密布，高坝矗立，西气东输，南水北调，高铁飞驰，巨轮远航，飞机翱翔，天堑变通途。现在，我国是世界第二大经济体、制造业第一大国、货物贸易第一大国、商品消费第二大国、外资流入第二大国，我国外汇储备连续多年位居世界第一，中国人民在富起来、强起来的征程上迈出了决定性的步伐！”（备注：2020年中国吸收外资逆势上涨，超过美国成为全球最大的外资流入国。）\n因此，①②③④均正确。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"2367773","cat":"科技常识","stem":"2019年1月3日，嫦娥四号探测器在月球背面成功着陆，并与玉兔二号巡视器顺利分离，实现了多个国际首次。对此，下列说法不正确的是","options":{"A":"首次进行了月基低频射电天文观测","B":"首次在月球背面软着陆和巡视探测","C":"首次实测了月球表面浅层月壤温度","D":"首次实现地球和月球背面的中继通信"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，2019年1月3日，嫦娥四号探测器登陆月球背面，搭载了由中国科学院空天信息研究院研制的巡视器（“玉兔二号”月球车）测月雷达和着陆器低频射电频谱仪有效载荷。1月4日00时20分，低频射电频仪成功加电开机，设备自检正常；当日8时42分，测月雷达成功加电开机，设备自检正常。我国成为国际上首次实现在月球背面开展低频射电天文观测的国家，填补了对100KHz\u003cimg data-k=\"6d86a19033e0\">10MHz低频射电天文方面的科学空白。\nB项正确，2018年12月8日凌晨2时23分，我国探月工程再次出发——嫦娥四号成功发射。嫦娥四号最终将降落在月球背面，实现人类首次月球背面软着陆和巡视探测。\nC项错误，2019年1月14日，在第一个月夜降临后，嫦娥四号着陆器和玉兔二号探测器陆续进入了休眠状态。 在第一个月夜休眠期间，着陆器上配置的同位素温差电池为月夜温度采集器供电，该采集器于测点位置成功监测第一月夜温度变化情况，月表温度在月夜期间最低达到\u003cimg data-k=\"f2237348c418\">，这是我国探月工程首次获取月夜温度探测数据。这也是国内首次实测月夜期间浅层月壤温度，并不是国际上首次。\nD项正确，2019年1月3日上午10点26分，“嫦娥四号”探测器成功着陆在月球背面东经177.6度、南纬45.5度附近的预选着陆区，并通过“鹊桥”中继星传回了世界第一张近距离拍摄的月背影像图，揭开了古老月背的神秘面纱。这是人类首次月背与地球的中继通信，开启了人类月球探测新篇章。\n本题为选非题，故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"2367777","cat":"人文常识","stem":"今年是中华人民共和国成立70周年。下列对中华人民共和国成立意义的表述，正确的是\n①标志着新民主主义社会的结束\n②基本完成了民族独立和人民解放的任务\n③为实现中华民族的伟大复兴开辟了新纪元\n④为中国的进步和发展创造了最重要的前提","options":{"A":"①②③","B":"①③④","C":"②③④","D":"①②③④"},"answer":"C","explanation":"本题考查政治常识。\n①错误，1949年10月新中国成立，标志着我国进入到新民主主义社会。到1956年社会主义改造基本完成，标志着新民主主义社会结束。\n②③正确，中国共产党领导全国各族人民，推翻了压在人民头上的帝国主义、封建主义和官僚资本主义三座大山，取得新民主主义革命的基本胜利并建立了中华人民共和国，使中国结束了一百多年来被侵略被奴役的屈辱历史，真正成为了独立自主的国家，中国人民从此站起来了，成为国家的主人。所以，新中国的成立，基本完成了民族独立和人民解放的任务，开辟了中国历史的新纪元。\n④正确，习近平在庆祝改革开放40周年大会上的讲话上指出：“以毛泽东同志为主要代表的中国共产党人，把马克思列宁主义基本原理同中国革命具体实践结合起来，创立了毛泽东思想，团结带领全党全国各族人民，经过长期浴血奋斗，完成了新民主主义革命，建立了中华人民共和国，确立了社会主义基本制度，成功实现了中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了根本政治前提和制度基础。”\n①错误，②③④正确。\n故正确答案为C。","no":4,"missingImage":false},{"type":"question","qid":"2367781","cat":"人文常识","stem":"1919年爆发的五四运动，是中国近代史上一个划时代的事件。下列关于五四运动的表述，正确的是","options":{"A":"直接导火线是第一次世界大战的爆发","B":"具备了旧民主主义革命的一些基本特点","C":"青年学生在五四运动中发挥了决定性的作用","D":"为中国共产党成立作了思想和干部上的准备"},"answer":"D","explanation":"本题主要考查人文常识。\n第一次世界大战期间，欧洲列强无暇东顾，日本乘机加强对中国的侵略，严重损害了中国的主权，中国人民的反日情绪日渐增长。一战结束后，1919年召开巴黎和会，会上中国外交失败，引发了伟大的五四运动，这就是在1919年5月4日发生在北京的一场以青年学生为主，广大群众、市民、工商人士等阶层共同参与的，通过示威游行、请愿、罢工、暴力对抗政府等多种形式进行的爱国运动，这是中国人民彻底的反对帝国主义、封建主义的爱国运动。\nA项错误，五四运动的直接导火线是中国在“巴黎和会”上的外交失败。1919年召开的巴黎和会将战前德国在山东的特权转交给日本，严重损害了中国的利益，消息传到国内引发了五四运动。而第一次世界大战的时间是1914年7月28日—1918年11月11日，五四运动爆发时第一次世界大战已经结束。\nB项错误，五四运动是中国新民主主义革命的开端，在此之前的近代以来的资产阶级民主革命为中国的旧民主主义革命。新民主主义革命是无产阶级领导的、人民大众的、反对帝国主义、封建主义、官僚资本主义的革命。它的目标是无产阶级（通过中国共产党）牢牢掌握革命领导权，彻底完成革命的任务，并及时实现由新民主主义向社会主义的过渡。而旧民主主义革命是资产阶级领导的，以建立资产阶级共和国为目的的资产阶级民主革命。所以五四运动并不具有旧民主主义革命的特点。\nC项错误，工人阶级在五四运动中发挥了决定性的作用,青年学生发挥了先锋作用。\nD项正确，五四运动波及中国思想文化、政治发展方向、社会经济潮流、教育，同时对中国共产党的建立和发展起到了重要的作用。五四运动传播了马克思主义，且当时参与的代表比如瞿秋白、周恩来等人，后期也担任了我党的重要领导人，所以说五四运动为党的成立作了思想和干部上的准备。\n故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"2367784","cat":"人文常识","stem":"今年是我国全面建成小康社会、实现第一个百年奋斗目标的关键之年。下列对2020年全面建成小康社会目标的理解，不正确的是","options":{"A":"科技实力跃升，跻身创新型国家前列","B":"现行标准下农村贫困人口实现脱贫","C":"人民的生活水平和生活质量普遍提高","D":"主要污染物的排放总量大幅度减少"},"answer":"A","explanation":"本题主要考查政治常识。\n“十三五”规划指出，“十三五”时期是全面建成小康社会的决胜阶段。必须认真贯彻党中央战略决策和部署，准确把握国内外发展环境和条件的深刻变化，积极适应把握引领经济发展新常态，全面推进创新发展、协调发展、绿色发展、开放发展、共享发展，确保全面建成小康社会。\nA项错误，“十三五”规划指出：创新驱动发展成效显著。创新驱动发展战略深入实施，创业创新蓬勃发展，全要素生产率明显提高。科技与经济深度融合，创新要素配置更加高效，重点领域和关键环节核心技术取得重大突破，自主创新能力全面增强，迈进创新型国家和人才强国行列。因此“跻身创新型国家前列”的说法错误。\nB、C两项正确，“十三五”规划指出：人民生活水平和质量普遍提高。就业、教育、文化体育、社保、医疗、住房等公共服务体系更加健全，基本公共服务均等化水平稳步提高。教育现代化取得重要进展，劳动年龄人口受教育年限明显增加。就业比较充分，收入差距缩小，中等收入人口比重上升。我国现行标准下农村贫困人口实现脱贫，贫困县全部摘帽，解决区域性整体贫困。\nD项正确，“十三五”规划指出：生态环境质量总体改善。生产方式和生活方式绿色、低碳水平上升。能源资源开发利用效率大幅提高，能源和水资源消耗、建设用地、碳排放总量得到有效控制，主要污染物排放总量大幅减少，主体功能区布局和生态安全屏障基本形成。\n本题为选非题，故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"2367788","cat":"法律常识","stem":"张某驾车时因未张贴“交强险”标识，被交警孔某拦下，当场作出罚款50元的决定。下列关于该行政处罚的说法，正确的是","options":{"A":"孔某一人不能当场作出这一处罚决定","B":"张某在处罚决定作出前有权要求听证","C":"孔某须将处罚决定报所属交警大队备案","D":"张某若不服处罚，起诉前应先提请复议"},"answer":"C","explanation":"A项错误、C项正确：《公安机关办理行政案件程序规定》简易程序部分第三十七条第一款规定：“违法事实确凿，且具有下列情形之一的，人民警察可以当场作出处罚决定，有违禁品的，可以当场收缴：（一）对违反治安管理行为人或者道路交通违法行为人处二百元以下罚款或者警告的；（二）出入境边防检查机关对违反出境入境管理行为人处五百元以下罚款或者警告的；（三）对有其他违法行为的个人处五十元以下罚款或者警告、对单位处一千元以下罚款或者警告的；（四）法律规定可以当场处罚的其他情形。”第三十九条规定：“适用简易程序处罚的，可以由人民警察一人作出行政处罚决定。人民警察当场作出行政处罚决定的，应当于作出决定后的二十四小时内将当场处罚决定书报所属公安机关备案，交通警察应当于作出决定后的二日内报所属公安机关交通管理部门备案。在旅客列车、民航飞机、水上作出行政处罚决定的，应当在返回后的二十四小时内报所属公安机关备案。”交警孔某对张某处以50元的罚款，符合行政处罚简易程序的条件，可以由警察一人作出。孔某应当于作出行政处罚决定后的二日内报其所属的交警大队备案。\nB项错误：《公安机关办理行政案件程序规定》第一百二十三条规定：“在作出下列行政处罚决定之前，应当告知违法嫌疑人有要求举行听证的权利：（一）责令停产停业；（二）吊销许可证或者执照；（三）较大数额罚款；（四）法律、法规和规章规定违法嫌疑人可以要求举行听证的其他情形。前款第三项所称‘较大数额罚款’，是指对个人处以二千元以上罚款，对单位处以一万元以上罚款，对违反边防出境入境管理法律、法规和规章的个人处以六千元以上罚款。对依据地方性法规或者地方政府规章作出的罚款处罚，适用听证的罚款数额按照地方规定执行。”并不是所有的行政处罚都可以要求听证，对张某作出的罚款50元的行政处罚决定，张某不能要求听证。\nD项正确，根据《行政复议法》第二十三条第一款第一项规定：“有下列情形之一的，申请人应当先向行政复议机关申请行政复议，对行政复议决定不服的，可以再依法向人民法院提起行政诉讼：（一）对当场作出的行政处罚决定不服；”张某若不服行政处罚，应先申请行政复议。（注：因《行政复议法》修改，本题D项目前也是正确答案。）\n故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"2367792","cat":"人文常识","stem":"王某向县规划部门申请旧房改建，获得批准。张某认为王某的改建严重影响了其通行和采光，遂以阻挡消防通道为由向县消防部门举报。消防部门调查后，责令王某停止施工，并限期拆除已建部分。下列关于本案的说法，不正确的是","options":{"A":"规划部门有权要求消防部门撤销处罚决定","B":"张某有权向规划部门申请撤销改建许可","C":"消防部门可以请求县政府撤销改建许可","D":"改建许可被撤销前应中止处罚决定的执行"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，可撤销的具体行政行为必须经过法定程序由国家有权机关作出撤销决定，才能否定其法律效力。法定程序是指行政复议、行政诉讼和行政监督程序。行政相对人可以通过复议和诉讼途径，由复议机关和法院撤销该行政行为，行政监督程序中，上级主管部门有权撤销该具体行政行为，机关发现行政行为有可撤销情形的，也能撤销该具体行政行为。因此，本题中，规划局和消防部门属于平级单位，无权要求消防部门撤销处罚决定。\nB、C两项正确，《行政许可法》第七条规定：“公民、法人或者其他组织对行政机关实施行政许可，享有陈述权、申辩权；有权依法申请行政复议或者提起行政诉讼；其合法权益因行政机关违法实施行政许可受到损害的，有权依法要求赔偿。”《行政许可法》第六十九条第一款规定：“有下列情形之一的，作出行政许可决定的行政机关或者其上级行政机关，根据利害关系人的请求或者依据职权，可以撤销行政许可：（一）行政机关工作人员滥用职权、玩忽职守作出准予行政许可决定的；（二）超越法定职权作出准予行政许可决定的；（三）违反法定程序作出准予行政许可决定的；（四）对不具备申请资格或者不符合法定条件的申请人准予行政许可的；（五）依法可以撤销行政许可的其他情形。” 张某作为利害关系人，有权向规划部门申请撤销改建许可。消防部门可以请求县规划部门的上级机关（县政府）撤销改建许可。\nD项正确，信赖保护原则是行政法的一项重要原则，指的是行政行为作出后，行政相对人基于对行政行为的信赖，而做出的行为是受到保护的，行政机关不得擅自撤销、变更已生效的行政行为。本题中，王某改建房屋是获得了规划部门批准的，改建许可不得随意撤销。如果此时继续进行处罚执行，拆除王某已建房屋，会对王某利益造成重大损害。因此，改建许可被最终撤销前，处罚中止执行。\n本题为选非题，故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"2367798","cat":"人文常识","stem":"某公司董事长孙某当选为区人大代表。下列关于孙某履行代表义务的说法，正确的是","options":{"A":"孙某应协助区政府开展招商引资工作","B":"孙某应设立“人大代表工作室”开展调研工作","C":"孙某应定期将公司的经营状况报告区人大常委会","D":"孙某应积极参加对区人民法院执法情况的检查工作"},"answer":"D","explanation":"本题考查法律常识。\n根据《代表法》第四条规定：“代表应当履行下列义务：（一）模范地遵守宪法和法律，保守国家秘密，在自己参加的生产、工作和社会活动中，协助宪法和法律的实施；（二）按时出席本级人民代表大会会议，认真审议各项议案、报告和其他议题，发表意见，做好会议期间的各项工作；（三）积极参加统一组织的视察、专题调研、执法检查等履职活动；（四）加强履职学习和调查研究，不断提高执行代表职务的能力；（五）与原选区选民或者原选举单位和人民群众保持密切联系，听取和反映他们的意见和要求，努力为人民服务；（六）自觉遵守社会公德，廉洁自律，公道正派，勤勉尽责；（七）法律规定的其他义务。”\n A、B、C三项错误，D项正确，孙某应积极参加对区人民法院执法情况的检查工作符合《代表法》第四条第（三）项的规定。\n 故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"2367803","cat":"人文常识","stem":"楚汉相争在我国历史文化中留下了深深的印迹。下列表述不正确的是","options":{"A":"象棋中的“楚河汉界”源自于这段历史","B":"成语“破釜沉舟”源于楚汉相争中的一场战役","C":"琵琶曲《十面埋伏》反映了楚汉垓下决战情形","D":"诗句“生当作人杰，死亦为鬼雄”以此为题材"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，楚河汉界，为象棋棋盘中的分界线，来源于楚汉战争。《史记》中对于刘邦和项羽之战的记载有“鸿沟而西者为汉，鸿沟而东者为楚”，历史就这样使鸿沟成了“楚河汉界”。\nB项错误，“破釜沉舟”来源于项羽一战成名的巨鹿之战，公元前207年，项羽的起义军与秦将章邯率领的秦军主力部队在巨鹿（今河北邢台市）展开大战；项羽不畏强敌，引兵渡漳水（由巨鹿东北流向东南的一条河）。渡河后，项羽命令全军：“皆沉船，破釜甑，烧庐舍，持三日粮，以示士卒必死，无一还心。”最终，项羽大获全胜，巨鹿一战，是项羽和秦军的一场战役，不是楚汉相争中的战役。\nC项正确，“十面埋伏” 这个典故出自楚汉相争的垓下之战，楚汉相争时期，汉王刘邦麾下韩信率30万大军和彭越的军队会师，把项羽围困在垓下（今安徽省宿州市灵璧县东南），他采取十面埋伏的战术，逼使项羽在乌江自刎，取得决定性的胜利。\nD项正确，宋代女词人李清照写的《夏日绝句》：“生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东”，写的正是楚汉相争中项羽乌江自刎的情形。\n本题为选非题，故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"2367805","cat":"人文常识","stem":"对下列诗句所描写活动的解释，正确的是","options":{"A":"“清风如可托，终共白云飞”描写的是射箭","B":"“平明寻白羽，没在石棱中”描写的是捉迷藏","C":"“嘈嘈切切错杂弹，大珠小珠落玉盘”描写的是弹琵琶","D":"“三五步行遍天下，六七人百万雄兵“描写的是下象棋"},"answer":"C","explanation":"本题考查人文常识。\nA项错误，“清风如可托，终共白云飞”出自北宋诗人寇准的《纸鸢》。全诗歌风筝以咏志，通过写风筝需要外力依托才能飞翔，以物喻人，尽显辩证唯物主义思想。\nB项错误，“平明寻白羽，没在石棱中”出自唐代诗人卢纶的《和张仆射塞下曲·其二》，描写了天明寻找（昨晚射出的）白羽箭，发现箭头已深深没入在巨大石块中，突出了将军射箭技艺的高超。\nC项正确，“嘈嘈切切错杂弹，大珠小珠落玉盘”出自唐代诗人白居易的《琵琶行》。诗句描写了琵琶声错落有致，疾乱中自有章法，像珍珠掉落玉盘一样清脆动听。\nD项错误，“三五步行遍天下，六七人百万雄兵”突出了京剧表演中成队的随从或兵卒在台上表现大场景的演出特点，因此描写的是戏台，而不是下象棋。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"2367809","cat":"人文常识","stem":"对下列词语的解释，不正确的是（    ）。","options":{"A":"风树之悲——因父母去世而悲伤","B":"金兰之交——亲如兄弟的友情","C":"期颐之年——八九十岁的年龄","D":"弄璋之喜——生了男孩的喜庆"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“风树之悲”出自《韩诗外传》卷九，原文是“树欲静而风不止，子欲养而亲不待”。指因父母亡故，不能奉养的悲伤。\nB项正确，“金兰之交”最早出自《周易\u003cimg data-k=\"d4f0d11b53cc\">系辞上》“二人同心，其利断金；同心之言，其臭如兰”。原指牢固而融洽的友情，后用做结拜为兄弟姐妹的代称。\nC项错误，“期颐之年”出自《礼记\u003cimg data-k=\"d4f0d11b53cc\">曲礼上》中“百年曰期颐”一句，意为百岁老人饮食起居不能自理，一切需期待别人供养或照顾。因此，“期颐之年”指一百岁，而不是八、九十岁。\nD项正确，“弄璋”指的是古人把璋给男孩玩，希望他将来有玉一样的品德。因此，“弄璋之喜”旧时常用以祝贺生了男孩的喜庆。\n本题为选非题，故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"2367813","cat":"经济常识","stem":"下列不属于我国当前振兴实体经济、促进企业“脱虚向实”措施的是：","options":{"A":"提高金融机构的存款准备金比率","B":"设立战略性新兴产业专项发展基金","C":"加大房地产企业土地使用金认缴比例","D":"强化金融机构资产及表外业务的监管"},"answer":"A","explanation":"本题考查经济常识。\n“脱虚向实”即经济脱离虚拟经济的投资，转向实体经济的投资、生产、流通。\nA项错误，存款准备金率是指金融机构为保证客户提取存款和资金清算需要而准备的在中央银行的存款比例。提高存款准备金率是应对通货膨胀的措施，其调节经济的基本逻辑为：提高存款准备金率\u003cimg data-k=\"2dfb7d1f72f3\">银行用于贷款的货币减少\u003cimg data-k=\"2dfb7d1f72f3\">货币供应量减少\u003cimg data-k=\"2dfb7d1f72f3\">抑制通货膨胀。银行用于贷款的货币减少，经济实体投资缩小，不利于发展实体经济。\nB项正确，设立战略性新兴产业发展基金是为了加快培育形成经济新动能，属于振兴实体经济的措施。\nC项正确，认缴比例是投资者出的钱在投资总额中占的比重。加大房地产企业土地使用金认缴比例即要求投资者在开发房地产方面要投入更多的资金，金融、房地产、互联网某种意义上来说都是为实体经济服务的，其发展水平必须与实体经济相称，要把更多的资金和资源配置到实体经济中去。加大房地产企业土地使用金认缴比例提高了房地产投资门槛，可以遏制房地产的过度发展，间接促进实体经济的发展。\nD项正确，“表外”指的是金融机构的资产负债表之外的资金。强化金融机构资产及表外业务的监管有助于抑制泡沫和防控金融风险，引导资金脱虚向实，必然要继续防范金融风险，为实体经济创造稳定的流动性环境。\n本题为选非题，故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"2367817","cat":"人文常识","stem":"下列关于水资源的说法，不正确的是","options":{"A":"地球上水资源的主体是咸水","B":"海洋水与陆地水在不断循环","C":"地球上水体大多以液态存在","D":"地球上淡水主体是江河湖水"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，地球上的水按其存在的领域可分为海洋水（咸水）、陆地水（既有咸水也有淡水）、大气水（淡水），海洋水占全部水体的\u003cimg data-k=\"17b81ad60902\">，因此，地球上水资源的主体是咸水。\nB项正确，由于太阳辐射和重力作用，地球上存在水循环。地球表面各种形式的水体是不断地相互转化的，水以气态，液态和固态的形式在陆地、海洋和大气间不断循环的过程就是水循环。\nC项正确，地球上水的存在形态有三种：固态、液态、气态。大部分以液态的形态存在；在寒冷的极地和高山上水常常以固态的形态存在；空气中的水主要以气态的形态存在。自然界的水随着温度的改变，状态也会发生变化。\nD项错误，冰川水是地球上最宝贵、最丰富的淡水资源，蕴藏了所有淡水资源的\u003cimg data-k=\"8c3342040bcf\">。但多处于极端的特殊地理位置，要么在南极、北极，要么在极高山上，所以冰川水具有极高的价值，但开采条件极其艰难。\n本题为选非题，故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"2367820","cat":"地理国情","stem":"下列对有关气候效应的解释，正确的是","options":{"A":"阳伞效应是指由于天空中大块乌云的阻挡而削弱太阳短波辐射，使气温降低","B":"热岛效应是指由于城市下垫面特性和人类活动影响，使市区的气温比郊区高","C":"温室效应是指温室气体透过太阳长波辐射，大量吸收地面短波辐射，使气温升高","D":"海洋沙漠化效应是指海洋因受周围陆地沙漠化的影响，失去了对气温的调节功能"},"answer":"B","explanation":"本题考查地理国情。\nA项错误，阳伞效应指由于大气中固、液体粒子对太阳辐射的强烈阻挡作用，而使地表气温降低的现象。大气中的固、液体粒子来源于人为排放和自然过程如火山喷发、森林火灾等。它们能直接吸收和反射太阳辐射能，还能作为凝结核，使天空云量增加，加大反射率，这些都能使地表所获得的太阳辐射能减少。\nB项正确，热岛效应指城市气温较四周郊区为高，好像一个温暖的岛屿分布于农村较凉的“海洋”之中。其形成原因主要是：人类活动导致有大量人为热释放；产生污染物质增多，加强了大气保温作用；下垫面吸收的辐射热量，主要用于加热市区空气。\nC项错误，温室效应是指由于地球表面空气中的二氧化碳等温室气体浓度增加，而导致地表附近气温的升高的现象。其形成原因是：温室气体可以使太阳短波辐射透过，地表由于吸收短波辐射被加热，提高了温度，再以长波向外辐射，而长波又被温室气体吸收，使气温升高。\nD项错误，海洋沙漠化效应是指倾注到海洋中的废油，在海面形成油膜，起到抑制海水蒸发的作用，同时又减少了海面潜热的转移，使海洋失去调节气温的作用，因而海洋上的空气变得愈来愈干燥，故称之为“海洋沙漠化效应”。\n故正确答案为B。","no":15,"missingImage":false}],"count":14,"answerable":14,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        知识产权广义上是关于无形智力成果的专有权利，是通过排除他人的主张和干预而独占智力成果的开发和使用，进而获得独占权益的制度。基于知识产权的\u003cu>                         \u003c/u>属性，财产理论成为知识产权制度的核心理论。具体到知识产权与公共领域的二元关系中，则是一方面强调权利人作为财产权主体控制其权属范围内的一切资源而排除资源自由流动的可能性；另一方面将\u003cu>公共领域作为知识产权潜在的“对手”\u003c/u>，主张公共领域的边界和层次的发展压缩了知识产权的权属范围，限制了知识产权作为一项财产权利的功能实现。\u003c/p>\u003cp>        为了避免公共资源的过度使用而造成资源损耗，通过财产制度赋予主体对特定资源的所有权，可以确保资源的使用受到合理规范和控制。同时，财产所有权的确立在减少资源损耗的基础上增加财产使用带来的收益，引导财产主体进一步投入、开发和使用资源本身，形成资源不断增值和收益的良性循环。\u003c/p>\u003cp>        智力成果作为知识产权的客体具有无形属性，在创造、传播和使用过程中不会产生“公有物的悲剧”中资源过度使用的困境。然而智力成果缺少法律制度的规范而允许不受限制的自由使用，造成的不利后果则是权利主体无法就智力成果的价值进行有效的收益，最终导致智力创造活动激励不足而无以为继。巧合的是，财产化智力资源能提供充裕的行为激励而解决这个问题。在经济学理论的背景下，知识产权依托财产理论实现重要的制度功能——鼓励智力创造活动，这又与知识产权制度的根本目的相契合。\u003c/p>\u003cp>        问题在于，财产理论并不能完全解释资源的开发和使用。资源的财产化发展到一定程度反而会阻碍后续开发和使用行为。\u003cu>知识产权领域也有类似的矛盾\u003c/u>。在传统的生物制药领域，基于专利申请而不断增加的专利数量不仅没有进一步促进研发创新，反而由于权属复杂分散难以整合而导致后续研发的成本过高，最终阻碍生物制药行业的发展。类似的，版权领域内的演绎行为的权利传统上归属于作品原作者。然而，滑稽戏仿等创作行为本身是对原作品进行丰富和发展的合理手段，通过转化性的创作来体现不同于原作者的目的和意图，能有效丰富社会整体文化艺术作品的数量和质量。实践中各国在版权立法方面将滑稽戏仿规定为版权的例外并允许类似行为的实施。显然，坚持绝对的演绎权利必然压缩演绎作者创作的空间，抑制基于原作品的演绎行为。因此，知识产权制度在理论构建过程中不能依赖财产化思路将智力资源完全专有化，而应该在财产化的过程中兼顾其他策略来实现知识产权的制度目的。\u003c/p>","questions":[{"qid":"2367891","cat":"语句表达","stem":"填入文中画横线处最恰当的一项是","options":{"A":"专有和排他","B":"专属和高端","C":"独有和专业","D":"独创和稀缺"},"answer":"A","explanation":"横线所在句子在文段中间，起着承上启下的作用，应结合上下文。首句指出“知识产权广义上是······的专有权利，是通过排除他人······独占权益的制度。”强调知识产权的专有和排他的两面性。后文对“知识产权与公共领域的关系”从两方面进行介绍，横线处应体现“知识产权的属性”，结合文段可知应为A项。B、C两项仅提到“专属”“独有”仅属于知识产权的一方面属性，表述片面，排除。D项“独创和稀缺”为无中生有，排除。\n故正确答案为A。\n【文段出处】《孙阳：论公共领域的功能实现》","no":16,"missingImage":false},{"qid":"2367892","cat":"片段阅读","stem":"对文章第一段中“公共领域作为知识产权潜在的‘对手’”理解不正确的是","options":{"A":"知识产权理论上就是一种私人财产权","B":"公共领域的活动可能会影响知识产权实现","C":"知识产权作为私人财产不可用于公共领域","D":"权利人不希望被公共领域侵犯其权益"},"answer":"C","explanation":"A项，根据“财产理论成为知识产权制度的核心理论”及“权利人作为财产权主体控制其权属范围内的一切资源而排除资源自由流动的可能性”可知，表述正确，排除；\nB项、D项，根据“主张公共领域的边界和层次的发展压缩了知识产权的权属范围，限制了知识产权作为一项财产权利的功能实现”可知，此处强调权利人主张要明晰“公共领域的边界和层次”来保护其权利，故“公共领域活动”可能会侵犯权利人的权利，B、D选项表述均正确，排除；\nC项，文段并未明确指出“不可用于公共领域”，表述过于绝对，表述错误，当选。\n本题为选非题，故正确答案为C。","no":17,"missingImage":false},{"qid":"2367893","cat":"片段阅读","stem":"作者认为，知识产权不受限制自由使用最终将会导致","options":{"A":"智力成果的权利人无法得到相应的收益","B":"智力创造活动由于激励不足而无以为继","C":"无法形成知识产权资源收益的不断增值","D":"知识产权的使用缺乏合理的规范和控制"},"answer":"B","explanation":"根据篇章第3段“然而智力成果缺少法律制度的规范而允许不受限制的自由使用，造成的不利后果则是权利主体无法就智力成果的价值进行有效的收益，最终导致智力创造活动激励不足而无以为继”可知，最终会导致的结果是智力创造活动激励不足而无以为继，对应选项为B。\nA项“无法得到相应的收益”、C项“无法形成资源收益的增值”均为知识产权不受限制自由使用的不利后果，而并非最终会导致的结果，排除；\nD项，“缺乏合理的规范和控制”为知识产权不受限制自由使用的原因，而非结果，排除。\n故正确答案为B。\n【文段出处】《孙阳：论公共领域的功能实现》","no":18,"missingImage":false},{"qid":"2367894","cat":"片段阅读","stem":"对文章最后一段中“知识产权领域也有类似的矛盾”解释不恰当的是","options":{"A":"专利数量不断增加有时并未促进研发创新","B":"知识产权的财产化导致后续研发成本过高","C":"版权领域内的演绎权利只能归属于原作者","D":"后人从事转化性创作有时也缺乏必要空间"},"answer":"C","explanation":"“类似的矛盾”指代上文，即资源的财产化发展到一定程度反而会阻碍后续开发和使用行为。且后文详细介绍了这种矛盾的两种情况，一种是由于专利数量不断增加导致研发成本过高，最终阻碍发展，对应A、B两项。一种是由于坚持绝对的演绎权利，压缩了演绎作者创作的空间，抑制基于原作品的演绎行为，对应D项。\nC项，根据“类似的，版权领域内的演绎行为的权利传统上归属于作品原作者”以及后文“实践中各国在版权立法方面将滑稽戏仿规定为版权的例外并允许类似行为的实施”可知，各国允许其他作者对原作品通过丰富和发展的合理手段，进行转化性的创作，故表述错误，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《孙阳：论公共领域的功能实现》","no":19,"missingImage":false},{"qid":"2367895","cat":"片段阅读","stem":"这篇文章着重说明的是","options":{"A":"知识产权过度保护也将造成危害","B":"知识产权实质上是财产权问题","C":"知识产权与公共领域的相互关系","D":"知识产权保护需注意其两面性"},"answer":"D","explanation":"篇章首先介绍了知识产权及其核心理论财产理论，并说明了两者间的关系，引出话题。接着文段提出观点，说明为了避免公共资源的过度使用而造成资源损耗，通过财产制度赋予主体对特定资源的所有权，可以确保资源的使用受到合理规范和控制，以此详细说明知识产权的客体智力成果依托财产理论的重要性。最后文段指出问题，财产理论并不能完全适用于知识产权，并通过“因此”给出结论，即知识产权应该在财产化的过程中兼顾其他策略来实现知识产权的制度目的。\n故篇章主要论述了知识产权需要财产理论的保护，并说明其不能只依赖财产理论的保护，否则会产生问题。即论述了用财产理论保护知识产权是把双刃剑，对应选项为D。\nA项，未提及通过财产理论保护知识产权的好处及必要性，表述片面，排除；\nB项，财产理论仅是知识产权的核心理论，且文段表明还需兼顾其他策略，故表述过于绝对，排除；\nC项，“相互关系”表述不具体明确，且文段主要论述的是知识产权与财产理论间的关系，排除。\n故正确答案为D。\n【文段出处】《孙阳：论公共领域的功能实现》","no":20,"missingImage":false},{"qid":"2367864","cat":"片段阅读","stem":"财政作为国家治理的基础和重要支柱，对促进科技创新具有重要的支撑、引领、提升与保障作用。具体来看，财政政策可以通过有的放矢的精准化财政投入，为科技创新输入供给端推力；通过有扶有控的差异化税收优惠通道，为科技创新构筑引导性激励；通过导向明确的选择性政府采购渠道，为科技创新设定需求端拉力。\n这段文字重点说明的是","options":{"A":"财政政策促进科技创新的主要途径","B":"财政政策在科技创新中的提升作用","C":"财政政策对科技创新所产生的影响","D":"财政政策制定要考虑科技创新需要"},"answer":"A","explanation":"文段开篇指出财政对于科技创新有重要的支撑、引领、提升、保障作用，“具体来看”引出对策，后文通过三个并列的分句详细说明财政如何对科技创新起作用。故文段重在说明财政政策促进科技创新的途径，对应A项，当选。\nB项“提升作用”表述片面，文段中说明还有引领、保障、支撑作用，排除。\nC项“所产生的影响”表述不明确，“影响”可以是积极的作用也可以是消极的作用，文段中为积极的作用，排除。\nD项“要考虑科技创新的需要”无中生有，文段没有提及，排除。\n故正确答案为A。\n【文段出处】《创新驱动导向下财政政策促进科技创新的路径探索》","no":21,"missingImage":false},{"qid":"2367865","cat":"片段阅读","stem":"语言的发展、维持或衰落从来不是一个纯粹的语言学问题，而是复杂的社会、政治和经济力量相互博弈的结果。当前，学界主要从社会学、政治学以及经济学等视角探讨方言保护问题，而有关方言的法律保护尤其是行政法保护的研究尚不多见。因此，建立和完善我国方言保护的行政法机制，协调普通话与方言的冲突，从而在语言的通用性、规范性与多样性之间寻求均衡保护，具有重要的理论与应用价值。\n这段文字之后最有可能讨论的是：","options":{"A":"方言保护具有的理论与实践价值","B":"语言规范化和多样化平衡的方法","C":"普通话与方言的冲突并非不可调和","D":"如何通过行政立法对方言进行保护"},"answer":"D","explanation":"本题为接语选择题，需在通读全文的基础上重点关注文段最后谈论的核心话题。文段开篇指出语言的发展是复杂力量博弈的结果，“当前”指出语言方面存在的问题，即“有关方言的行政法保护研究尚不多见”。尾句“因此”得出结论，说明建立和完善方言保护的行政法机制意义重大。故下文应该围绕“行政法”的建立和完善继续论述，D项与尾句话题一致，当选。\nA、B、C三项均没有提及尾句的核心话题“行政法”，与文段无法衔接，排除。\n故正确答案为D。\n【文段出处】《论汉学方言的行政法保护》","no":22,"missingImage":false},{"qid":"2367866","cat":"片段阅读","stem":"以人均收入衡量的发展差距，本身隐含着一个资源禀赋结构上的差异，即发达地区具有相对丰富的资本要素，从而在资本密集型产业上具有比较优势；而相对不发达地区则具有劳动力丰富和生产成本低的比较优势。东中西部地区之间存在的资源禀赋结构差异，无疑可以成为中西部地区经济发展赶超的机遇。\n下列说法与文意不符的是：","options":{"A":"不同地区资源禀赋的差异有利有弊","B":"发达地区相对来说劳动力比较缺乏","C":"中西部可以利用劳动力丰富的优势","D":"资本密集型产业多集中在东部地区"},"answer":"A","explanation":"A项，“有利有弊”与文段不符，文段中只提及了资源禀赋的“优势”，没有提及“弊端”，故选项与文段不符，当选。\nB项，根据“相对不发达地区则具有劳动力丰富和生产成本低的比较优势”可知，“发达地区相对来说劳动力比较缺乏”符合文意，排除。\nC项，根据“相对不发达地区则具有劳动力丰富和生产成本低的比较优势”以及“无疑可以成为中西部地区经济发展赶超的机遇”可知，中西部为经济相对不发达的地区，具有劳动力丰富和生产成本低的比较优势，符合文意，排除。\nD项，根据“发达地区具有相对丰富的资本要素，从而在资本密集型产业上具有比较优势”以及“无疑可以成为中西部地区经济发展赶超的机遇”可知，东部为经济相对发达的地区，具有丰富的资本要素，符合文意，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《中国经济增长如何转向全要素生产率驱动型》","no":23,"missingImage":false},{"qid":"2367867","cat":"片段阅读","stem":"在整个地图学史上，有效使用地图意味着看懂绘制在平面上的一系列抽象符号，然后将这些符号与当地环境的各种三维特征联系起来，从而成功地确定自己的位置。但这并不是所有普通人都能够做到的，而且不久之前，地图本身也还是一种稀缺的人工制品，有些地图还属于军事上敏感的机密。但是，能够在手机屏幕上看到的地图改变了这一切。\n这段文字重在说明","options":{"A":"地图学发展经历了漫长的历史过程","B":"地图绘制使用中存在诸多技术难题","C":"智能手机的出现促进了地图学发展","D":"智能手机大大提升了人类生活质量"},"answer":"C","explanation":"文段开篇介绍在地图学的历史上，有效使用地图对人们的要求极高。“但”表转折，强调不是所有人都能看懂地图，而且地图还是一种稀缺品，不是所有人都能看到地图。尾句“但是”表转折，强调手机上的地图改变了这一情况。故文段重在强调手机上的地图改变了地图原来的情况，使所有人都能看到、看懂地图，对应C项，当选。\nA项和B项没有提及文段的重点“手机”，排除；D项没有提及“地图”这一核心话题，且“提升了人类生活质量”无中生有，排除。\n故正确答案为C。","no":24,"missingImage":false},{"qid":"2367869","cat":"片段阅读","stem":"城镇化是一个长期的历史过程。在这个过程中，既有人口从农村向城镇迁移的正向城镇化，也不可避免地会出现农民工返乡等逆城镇化现象。通过加快户籍制度改革，促进农业转移人口市民化，可以保证城镇化持续推进；同时，实施乡村振兴战略，不仅可以为农村人才和劳动力创造更广阔的用武之地，也使城镇化的推进更加行稳致远。\n下列说法与文意不符的是","options":{"A":"推进城镇化不等于只允许人口向城镇迁移","B":"推进城镇化进程中应倡导农民工返乡创业","C":"实施乡村振兴战略与城镇化进程并不矛盾","D":"城镇化过程中户籍制度改革是关键的一步"},"answer":"B","explanation":"A项，文段“既有人口从农村向城镇迁移的正向城镇化，也不可避免地会出现农民工返乡等逆城镇化现象”中“既······也······”表示并列，故“人口向城镇迁移”只是城镇化的一种情况，故选项“不等于只允许······”表述正确，排除；\nB项，“倡导农民返乡创业”文段未提及，无中生有，当选；\nC项，由文段“实施乡村振兴战略······也使城镇化的推进更加行稳致远”可知，二者不矛盾，表述正确，排除；\nD项，“户籍制度改革是关键的一步”由文段“通过加快户籍制度改革······促进······可以保证······”可知，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《如何让新型城镇化走得更远》","no":25,"missingImage":false},{"qid":"2367871","cat":"片段阅读","stem":"传统文学自现代以来一直有纯文学和通俗文学之分。纯文学的读者往往是小众的、精英化的，通俗文学则是供更广大的人群阅读，而作者也是顺应这两个阅读方向形成了相对稳定的群体。网络文学则不同于这两者，能让更多的年轻群体参与阅读。它的多样性让更多的人能够在其间满足自己的需求，因此让原来并非文学读者的一部分大众作为文学阅读的“增量”参与到文学阅读之中，也使得许多不同身份的年轻写作者在这个空间中找到了职业写作的可能性。大量的年轻读者和作者从网络文学的入口进入了文学之中。\n这段文字重在说明：","options":{"A":"网络文学的出现扩大了文学作品的受众","B":"网络文学比传统文学更能吸引青年人群","C":"网络文学比传统文学更能满足各类人群的需求","D":"网络文学的发展扩大了文学的读者和作者群体"},"answer":"D","explanation":"文段开篇论述“纯文学”与“通俗文学”受众、作者的情况，接着通过“网络文学则不同于这两者”引出文段的核心话题“网络文学”，然后通过“因此”对上文进行总结，引出结论，其中“也”表示并列，结论为网络文学使得文学读者增加，也使得不同身份的年轻作者加入文学中，尾句“大量······进入了文学之中”对结论进行补充说明，故文段重点为“因此”之后引导的结论，强调网络文学使很多读者和作者加入文学中，D项“扩大了文学的读者和作者群体”概括全面，符合文意，当选。\nA项，“扩大······受众”只是网络文学带来的一方面情况，未提及带来作者的增加，表述片面，排除。\nB项，“青年群体”只对应“年轻人”，未提及一部分大众加入到文学中，表述片面，排除。\nC项，“满足各类人群需求”表述不明确，文段明确提出网络文学利于增加读者和作者，不如D项表述更明确，排除。\n故正确答案为D。\n【文段出处】《从&lt;悟空传&gt;到&lt;花千骨&gt;文学阅读将走向何方？》","no":26,"missingImage":false},{"qid":"2367873","cat":"片段阅读","stem":"动物体型缩小和气候升温之间的联系不止出现在远古时期。随着全球变暖，现生的许多物种体型也在减小。大蟾蜍、蛇、乌龟、蝾螈、林鼠、粪蝇、北极地区的蝴蝶、多种北海鱼和一种绵羊——这些动物的体型都变得越来越小了。这种现象一度让科学家们感到困惑，但是，通过多组实验、野外观测和对化石的研究，答案似乎越来越明显。\n下列选项与文意不符的是：","options":{"A":"小体型动物个体在气候变暖中具有生存优势","B":"科学家对动物体型变化与气候变暖的相关性早有关注","C":"气候升温导致动物体型缩小在现阶段仅限于理论构想","D":"远古时期已经出现气候升温引发动物体型变化"},"answer":"C","explanation":"A项，根据文段论述的全球变暖，很多物种体型在缩小，可知在气候变暖中，小体型物种个体具有生存优势，符合文意，排除。\nB项，由文段“这种现象一度让科学家们感到困惑”可知，科学家们早已开始关注这一现象，故选项表述正确，排除。\nC项，文段论述“通过多组实验、野外观测和对化石的研究，答案似乎越来越明显”，故不仅仅是停留在理论构想阶段，已开始实践研究，选项表述有误，当选。\nD项，由文段首句“动物体型缩小和气候升温之间的联系不止出现在远古时期”可知，远古时期已经出现这种现象，选项表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《全球气候开始急速变暖，动物却变得越来越小了》","no":27,"missingImage":false},{"qid":"2367875","cat":"片段阅读","stem":"人类社会的教育现象，除了教学之外，还存在着无教授的学习，以及未能引发学习的教授等活动。即便是教学，也不仅仅存在于学校里，而是发生在人的社会生活各个领域之中。远在近现代学校产生之前，人类就已经在从事各种各样的教育活动；近现代学校产生之后，人类的教育活动依然在学校以外的社会生活领域中广泛发生着。教育学将自身的研究视野限定在学校时空框架内，实际上是给自己确定了一个错误的学科边界，因而只能将大量的教育现象含糊地当作所谓“广义的教育”而暧昧地排斥于自己的主要研究视域之外。\n下列说法与文意不符的是：","options":{"A":"教育活动广泛存在于人类生活的各个领域中","B":"无人教授的学习行为也可以归入到教育活动","C":"当前的教育学研究对于学科边界存在误判","D":"近现代学校的出现限制了教育学的研究视野"},"answer":"D","explanation":"A项，由文段“人类社会的教育现象，除了教学之外，还存在······即便是教学，也不仅仅存在······而是发生在人的社会生活各个领域之中”可知，选项表述正确，排除。\nB项，由文段“人类社会的教育现象······还存在着无教授的学习”可知，选项表述正确，排除。\nC项，根据文段“教育学将自身的研究视野限定在学校时空框架内，实际上是给自己确定了一个错误的学科边界”可知，选项“教育学······对于学科边界存在误判”表述正确，其中，选项的“误判”对应文段的“错误的”，符合文意，排除。\nD项，文段“近现代学校产生之后，人类的教育活动依然在学校以外的社会生活领域中广泛发生着”说明近现代学校产生之后，人类的教育活动未受到限制，故选项“限制······研究视野”表述有误，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《论教育学的边界》","no":28,"missingImage":false},{"qid":"2367877","cat":"片段阅读","stem":"根据新的刑事证据规则，鉴定检材的真实性和同一性已经成为鉴定意见转化为定案根据的前提条件。这显然是我国刑事证据制度发生的重大变化。透过这一变化，我们可以发现司法改革的决策者们已经具有了一种新的理论认识：实物证据鉴真是司法鉴定程序启动的前提和基础；未经鉴真过程，任何专业人士对实物证据所作的“司法鉴定意见”都将是没有法律意义的；实物证据作为一种“送检材料”，在其真实性和同一性存在合理疑问的情况下，鉴定意见将不具有作为定案根据的资格。\n这段文字中提取的关键词最恰当的是","options":{"A":"刑事证据  实物证据鉴真  定案根据","B":"司法改革  司法鉴定意见  定案根据","C":"鉴定检材  刑事证据制度  司法改革","D":"证据制度  司法鉴定程序  送检材料"},"answer":"A","explanation":"文段开篇引出新的刑事证据的话题，接着说明我国刑事证据制度的重大变化体现实物证据鉴真的重要性，即实物证据鉴真直接影响实物证据能否成为定案根据。故文段就是强调“刑事证据制度的重大变化即实物证据鉴真直接影响实物证据能否成为定案根据”关键词为“刑事证据、实物证据鉴真、定案根据”，对应A项，当选。\nB项、C项“司法改革”对应“司法改革的决策者······”，仅为决策者身份的限定词，非文段核心话题，排除。\nD项“证据制度”表述不准确，文段围绕“刑事证据”相关制度、规则展开论述，“司法鉴定程序”对应“是司法鉴定程序的启动的前提和基础”，而该句强调的核心话题是“实物证据鉴真”，排除。\n故正确答案为A。","no":29,"missingImage":false},{"qid":"2367880","cat":"片段阅读","stem":"在一项研究中，研究者发现由于关于慢阻肺（慢性阻塞性肺炎）的刻板印象根深蒂固，有可能导致罹患这种疾病的女性患者不能被及时确诊。研究者请192位医生诊断一批中年患者，他们是长期咳嗽以及有吸烟史的男性或女性。在初次检查中，只有\u003cimg data-k=\"29980f8660cf\">的女性患者被诊断为慢阻肺，而男性患者则达到了\u003cimg data-k=\"675c3b4f494e\">的诊断率。随后，研究者提供了指向慢阻肺的医学检验报告，这时诊断率的性别差距缩小了，但仍然没有完全消失。\n文段中“刻板印象”指的是：","options":{"A":"女性患慢阻肺疾病的可能性较小","B":"女性患慢阻肺不容易被诊断","C":"男性由于吸烟史导致患慢阻肺","D":"男性患慢阻肺很容易被诊断"},"answer":"A","explanation":"本题为词句理解题，“刻板印象”出现在文段首句，首句说明刻板印象会导致罹患慢阻肺的女性患者不能被及时确诊，后文又通过列举研究数据论述了刻板印象导致的结果，即女性被诊断为慢阻肺的比率明显低于男性，能够导致这种结果的原因为人们具有“女性患慢阻肺疾病的可能性较小”这样的观念，所以“刻板印象”就是指“女性患慢阻肺疾病的可能性较小”，对应A项。\nB项，“不容易被诊断”为刻板印象导致的结果，而非刻板印象本身，排除。\nC、D两项，根据文段首句“刻板印象有可能导致······女性患者······”可知，刻板印象的作用主体为女性，男性患病原因、是否容易被诊断，与女性无关，排除。\n故正确答案为A。","no":30,"missingImage":false},{"qid":"2367882","cat":"片段阅读","stem":"生态文明首先是一种世界观，也就是如何看待人与自然和人与人之间的关系。实际上，人与自然的关系和人与人之间的关系是同一事物的相互映衬，同时，人与自然的关系也在一定程度上决定了人与人之间的关系。当人与自然关系紧张，如一定的自然资源和生态环境承载不了已有的人口数量时，就会产生人与人之间关系的对抗。\n下列说法与文意不符的是","options":{"A":"人与自然的和谐相处事实上有利于协调人与人之间的关系","B":"处理好人与人的关系比处理好人与自然之间的关系更为重要","C":"正确的世界观可以引导我们处理好人与人及人与自然的关系","D":"人与人的关系发生对抗可能和人与自然关系的紧张相关"},"answer":"B","explanation":"A项，根据“人与自然的关系也在一定程度上决定了······对抗”可知，人与自然的关系决定了人与人的关系，如果人与自然的关系紧张，人与人的关系也就会紧张，那么人与自然和谐相处，也就有利于协调人与人的关系，选项与文意相符，排除。\nB项，“比······更为重要”涉及比较，而文段并未将人与人的关系、人与自然的关系进行对比，无关对比，当选。\nC项，根据文段首句表明世界观就是如何看待人与自然、人与人的关系，所以正确的世界观可以更好地引导我们处理好这些关系，选项与文意相符，排除。\nD项，根据文段尾句可知，人与自然关系紧张是人与人关系发生对抗的原因之一，选项与文意相符，排除。\n本题为选非题，故正确答案为B。","no":31,"missingImage":false},{"qid":"2367884","cat":"语句表达","stem":"①农业生产中农用机械、灌溉设施和相关技术上的投入，有很大一部分是所谓的固定成本，它们不随经营规模增加而变化。\n②农业生产与工业一样，存在“规模经济效应”，理解这一现象需要用到经济学的固定成本和可变成本的概念。\n③因此，每单位土地上的平均成本会随规模增加而减少。\n④而事实上，农场规模成为限制这些新技术、新知识广泛采用的一大影响因素。\n⑤当前，关于控制农业面源污染的主流做法是研发技术、培训农民、知识“下乡”等知识传递路线。\n⑥当农业经营规模较小时，农民在计算相关的成本和收益后，会发现投入固定成本较大的项目是不划算的。\n将以上6个句子重新排序，语序正确的是：","options":{"A":"⑤-④-②-③-①-⑥","B":"①-⑥-③-②-④-⑤","C":"②-①-③-⑥-⑤-④","D":"⑥-②-①-③-⑤-④"},"answer":"C","explanation":"观察选项，对比首句。⑤句“当前”论述背景，适合作首句，保留。①句介绍“固定成本”的具体内容，⑥句“投入固定成本”，②句提出“固定成本和可变成本”的概念，故①⑥两句应在②句之后，不适合作首句，排除B、D两项。\n观察题干，③句出现结论词“因此”，从该句入手。结合A、C两项，需要判断③句之前接②句还是①句。③句总结了每单位土地上的平均成本和规模的关系，②句提及了规模经济和两个成本概念，①句论述了固定成本和规模的关系，①③两句话题一致，衔接恰当，进行捆绑。\n故正确答案为C。\n【文段出处】《浙大团队研究发现：耕地减“肥”，适度扩大规模很关键！》","no":32,"missingImage":false},{"qid":"2367886","cat":"片段阅读","stem":"按照溶解性能来分，农药可以分为水溶性和脂溶性两种。传统用水浸泡的方法，只能去除果蔬表面的水溶性农药，却不能除去其主要残留物质——脂溶性农药。而且，在浸泡过程中，水溶性农药会溶解在水中并形成具有一定浓度的水溶液，若浸泡时间过久，则很有可能导致水中的农药被果蔬重新吸附，还会造成蔬菜中的许多水溶性营养素如维生素C以及钙、镁、铁、锌等溶解在水中，从而造成其营养成分损失。\n以下对文意的概括最恰当的是","options":{"A":"水浸泡法清洗果蔬的弊大于利","B":"水浸泡法清洗果蔬如何控制时长","C":"脂溶性农药清洗难度大于水溶性农药","D":"水浸泡法清洗果蔬具有局限性"},"answer":"D","explanation":"文段开篇提到农药按溶解性分为水溶性和脂溶性两类，接着引出传统用水浸泡的清洗方法，随后通过转折词“却”强调这种方法不能去除主要残留物质脂溶性农药，可知水浸泡的方法效果不好。之后又用“而且”进一步强调，在浸泡过程中可能导致农药重新被果蔬吸附，还会造成营养成分损失。故文段重点水浸泡法清洗果蔬效果不好，有局限性，对应D项，当选；A项“弊大于利”，文段并没有进行利弊的对比，排除；B项“如何控制时长”文段没有体现，表述无中生有，排除；C项“清洗难度”并非文段强调的重点，文段围绕水浸泡方法的效果展开论述，排除。 \n故正确答案为D。\n【文段出处】《农药残留会致癌？蔬菜浸泡太久可能更脏》","no":33,"missingImage":false},{"qid":"2367887","cat":"片段阅读","stem":"当前，人们往往简单地将“积极老龄化”理解为“老有所为”，但其真正含义远超后者。通常，我国“老有所为”的主体主要是老干部、老专业科技人才、老知识分子等，但他们只是老年人中的一部分。“积极老龄化”是面向全体老年人群体的，不仅老干部、老知识分子要“积极老龄化”，普通老人也要“积极老龄化”。“老有所为”着重强调老年人“参与”的一面，“积极老龄化”还强调“健康”和“保障”以及三者之间的有机统一和结合，参与社会仅是“积极老龄化”的一个方面。\n这段文字意在阐明","options":{"A":"“积极老龄化”比“老有所为”内涵更丰富","B":"“老有所为”和“积极老龄化”的主体不同","C":"“老有所为”比“积极老龄化”更重视参与","D":"“积极老龄化”概念长期被误读的根本原因"},"answer":"A","explanation":"文段首先引出“积极老龄化”这一话题，接下来通过转折词 “但”强调“积极老龄化”的含义远超“老有所为”，其含义更丰富。后文从两个概念的主体和内容两个方面进行解释说明，“老有所为”的主体只是老年人的一部分，“积极老龄化”面向全体老年人群体； “老有所为”强调老年人“参与”的一面、“积极老龄化”还强调“健康”和“保障”以及三者之间的有机统一和结合。故文段强调的是“积极老龄化”比“老有所为”内涵更丰富，对应A项，当选；B项“主体不同”、C项“重视参与”仅为解释说明中的一个方面，表述片面，且非重点，均排除；D项对应首句转折之前的内容，非重点，且“根本原因”无中生有，排除。\n故正确答案为A。\n【文段出处】《用科学诠释“积极老龄化”》","no":34,"missingImage":false},{"qid":"2367890","cat":"语句表达","stem":"沉浸在自然环境的多样性生物中，有助于维持肌肤不可或缺的健康微生物群系和肠道菌群。研究显示，如果儿童在很小的时候没有用足够的时间去亲近大自然，那么随着年龄的增长他们就不会形成适当的免疫功能来保护自我。沐浴在大自然中，可以摄取那些能产生大量健康微生物群系的东西。由于一些城市缺少公园，树木稀少，这种大自然赋予的免疫力不足，                    。\n填入画横线处最恰当的是：","options":{"A":"微生物群系和肠道菌群减少了","B":"孩子们的免疫功能退化了","C":"大自然中的生物多样性降低了","D":"成年人的健康水平下降了"},"answer":"B","explanation":"横线出现在文段结尾，要注意与前文的关系。前文通过“研究显示”引出结论，儿童在很小的时候没有用足够的时间去亲近大自然，随着年龄的增长他们就不会形成适当的免疫功能来保护自我。之后的内容是对这一研究结论进行解释说明，横线前指出，大自然赋予的免疫力不足，故孩子们的免疫功能将受到影响，对应B项，当选；A项“微生物群系和肠道菌群”、C项“大自然中的生物多样性”均对应首句的内容，并非研究显示的结论，研究结论重点强调的是亲近大自然与儿童免疫力的关系，均排除；D项“成年人的健康水平”无中生有，前文强调的是“儿童”这一话题，排除。\n故正确答案为B。\n【文段出处】《大自然的治愈力量：精油、冥想、森林疗法有多科学？》","no":35,"missingImage":false},{"qid":"2367872","cat":"逻辑填空","stem":"古典诗歌热潮兴起不是                的，其中体现了先贤诗人几千年的智慧与情感。结合新的时代条件传承和        中华优秀传统文化，也必将有效提升我们的文化自信，为中华民族伟大复兴创造条件。\n依次填入画横线处最恰当的一项是","options":{"A":"理所当然  发扬","B":"必然  宣传","C":"自然而然  倡导","D":"偶然  弘扬"},"answer":"D","explanation":"第一空，根据“古典诗歌中体现了先贤诗人几千年的智慧与情感”可知，它的兴起是长期发展的结果，是一种必然的趋势，D项“偶然”与“不是”搭配，表必然的意思，符合文意，当选。A项“理所当然”指按道理应当这样，B项“必然”指客观事物联系和发展的合乎规律的、确定不移的趋势，与文意相悖，排除；C项“自然而然”指非人力干预而自然如此，“非人力干预”文段未涉及，排除。答案锁定D项。\n第二空，代入验证，“弘扬中华优秀传统文化”搭配恰当，符合文意，当选。\n故正确答案为D。\n【文段出处】《让传统文化浸润时代人心》","no":36,"missingImage":false},{"qid":"2367874","cat":"逻辑填空","stem":"考古并不是简单地将珍贵文物挖掘出来呈现给世人，而是一门探究历史真相的        科学。考古有一套        的科学理论和方法来指导田野挖掘、文物保护修复和后期研究，每一件出土文物的背后，都有考古人付出的智慧、汗水和辛劳。\n依次填入画横线处最恰当的一项是：","options":{"A":"严肃 严谨","B":"严谨 严肃","C":"严整 严格","D":"严格 严整"},"answer":"A","explanation":"第一空，搭配“科学”，且根据“探究历史真相”可知，考古是一门很认真的科学，A项“严肃”指作风、态度等严格、郑重、认真，B项“严谨”形容态度严肃谨慎，做事细致、周全、完善，追求完美，均符合文意，保留。C项“严整”指严肃整齐，纪律严明，多搭配“队伍”，与“科学”搭配不当，排除；D项“严格”指遵守或执行规定、规则十分认真、不偏离原则、不容马虎，一般搭配“规定”“纪律”，与“科学”搭配不当，排除。\n第二空，搭配“科学理论和方法”，且根据“考古人付出的智慧、汗水和辛劳”可知，理论和方法是充满智慧的，科学的，A项“严谨”形容态度严肃谨慎，做事细致、周全、完善，追求完美，搭配恰当，当选。B项“严肃”指作风、态度等严格、郑重、认真，与“科学理论和方法”搭配不当，排除。\n故正确答案为A。\n【文段出处】《考古人的青春和汗水》","no":37,"missingImage":false},{"qid":"2367876","cat":"逻辑填空","stem":"中国传统文化中的“和而不同”与共享观念，                地成为“人类命运共同体”以及“民心相通”的价值观的注脚。中国向世界提出了“人类共同命运”的全球倡议，包含了对全球“普遍联结”与“价值关联”等发展特征的        概括，是中国特色全球传播的生动表述。\n依次填入画横线处最恰当的一项是","options":{"A":"恰逢其时  高度","B":"无可替代  简洁","C":"恰如其分  凝练","D":"正当其时  有力"},"answer":"C","explanation":"第一空，根据文意，该空表示中国的“和而不同”与共享观念，恰好符合对“人类命运共同体”以及“民心相通”价值观的解释，C 项“恰如其分”指办事或说话十分恰当合适，符合文意，当选。A 项“恰逢其时”指恰恰遇到这个时候，D 项“正当其时”指正是时候，文段并未涉及时间，排除；B 项“无可替代”指没有什么能够取代、替换，程度过重，排除。\n第二空，代入验证，根据“人类命运共同体”包含了“普遍联结”与“价值关联”等发展特征可知，它是对多种发展特征的非常简洁的概括，C 项“凝练”指紧凑简练，符合文意，当选。\n故正确答案为C。\n文段出处：《提升“一带一路”背景下中国价值观国际传播力的思考》","no":38,"missingImage":false},{"qid":"2367878","cat":"逻辑填空","stem":"地方戏曲是中华文化的重要组成部分，在新时代受到诸多新兴事物的冲击而略显暗淡，甚至濒临消亡。作为新时期的文化工作者，我们        着传承和保护中华传统文化的使命，如何在整个社会大环境中，营造出戏曲文化氛围，不断传承和发展地方戏曲，使其兼具传统韵味和时代气息，赢得更多人的喜爱，是我们需要始终                探索的课题。\n依次填入画横线处最恰当的一项是","options":{"A":"背负  矢志不渝","B":"承担  孜孜以求","C":"担负  持之以恒","D":"肩负  坚持不懈"},"answer":"D","explanation":"第一空，横线处与“使命”搭配，B项“承担”指担负、担当，C项“担负”指承当，D项“肩负”指担负，三项均可与“使命”搭配，均保留。A项“背负”指担负，多搭配偏消极或中性词，如“包袱、重任、债务”等，与“使命”搭配不当，排除。\n第二空，与“探索”搭配且通过“始终”进行修饰，用来形容对课题的探索自始至终一直进行下去。D项“坚持不懈”指坚持到底，毫不松懈，侧重点在不松懈，形容探索的过程，符合文意，当选。B项“孜孜以求”比喻不知疲倦地探求，本身包含“求”的语境，与后文“探索”语义重复，排除；C项“持之以恒”指长久坚持下去，“恒”与“始终”语义重复，排除。\n故正确答案为D。\n【文段出处】《论如何实现地方戏曲的传承与保护》（文段有更改）","no":39,"missingImage":false},{"qid":"2367879","cat":"逻辑填空","stem":"支付工具的多样化组合，提升了我国支付体系运行的质量和效率，满足了公众            支付需求。从未来支付趋势看，现金支付和非现金支付工具相互        、相互补充、共存共生的局面将长期存在。但是对我国这样一个地域广、人口多、发展很不均衡的大国来说，由于核心技术水平的限制，过度依赖非现金支付会大大增加支付体系的脆弱性。因此，必须长期        现金作为国家法定支付方式的地位，切实保障广大人民使用现金的合法权益。\n依次填入画横线处最恰当的一项是","options":{"A":"区别化  支持  确保","B":"差异化  支撑  确立","C":"个性化  支援  确认","D":"多元化  支应  确证"},"answer":"B","explanation":"第一空，根据“支付工具的多样化组合”可知，横线处表达满足公众不同的支付需求，选项均符合文意。\n第二空，通过顿号与“相互补充”构成并列结构，横线处对应“补充”，表示现金支付与非现金支付长期共存，“相互支持”、“相互支撑”符合文意。C项“支援”指用人力、物力、财力或其他实际行动去支持和援助，D项“支应”指敷衍、应付，均与文意不符。\n第三空，与“地位”搭配，B项“确立地位”搭配恰当，当选。A项“确保”指切实保持或保证，搭配不当，用在此处应表述为“必须长期确保现金的首要地位不动摇”，排除。\n故正确答案为B。\n【文段出处】《中国金融》：现金的价值与生命力","no":40,"missingImage":false},{"qid":"2367881","cat":"逻辑填空","stem":"随着城镇化以及新一轮产业转移，很多城区的制造企业搬离。在留下的厂房利用问题上，以北京798艺术区为代表的城市更新                ，并成为诸多城市        的对象，各类文化创意产业园区逐渐成为城市更新的重要产品        。\n依次填入画横线处最恰当的一项是：","options":{"A":"如火如荼 模拟 名片","B":"方兴未艾 沿袭 样式","C":"应运而生 效仿 形态","D":"风起云涌 学习 代表"},"answer":"C","explanation":"第一空，表达在城镇化和新一轮产业转移这个时期，城市更新产生并发展，B项“方兴未艾”形容新生事物正在发展，一时不会停止，C项“应运而生”指适应时机而产生，均符合文意，保留。A项“如火如荼”形容气势旺盛、热烈，D项“风起云涌”比喻事物迅速发展，声势浩大。根据后文“逐渐成为”可知，文化创意产业园区为代表的城市更新是逐渐发展的，A、D两项均程度过重，排除。\n第二空，横线处表达“798艺术区”为代表的文化创意园区成为诸多城市模仿的对象，B项“沿袭”指依照旧传统或原有的规定办理，与文化创意产业园区搭配不当，排除。C项“效仿”指以某件事情为榜样，模仿来做或作为借鉴以便发扬，可以用来形容其他城市模仿“798艺术街区”，符合文意，保留。\n第三空，代入验证，文化创意产业园区成为城市更新的产品形态，C项符合文意，当选。\n故正确答案为C。\n【文段出处】《新文创，激发城市发展新活力》","no":41,"missingImage":false},{"qid":"2367883","cat":"逻辑填空","stem":"去年冬天，我终于再次回到家乡。踏上这片                的土地，不觉中满眼尽是熟悉的情景。猛地回到现实中，我早已泪眼        。街市的路面依然那样光亮，如同镜面一样，反衬着天空和街道两侧时常变换的店舍，时间似乎并没有在此停留，而是平静地        着正在发生的一切。\n依次填入画横线处最恰当的一项是","options":{"A":"魂牵梦绕  婆娑  诉说","B":"知根知底  朦胧  讲述","C":"牵肠挂肚  模糊  呈现","D":"日思夜想  迷离  反映"},"answer":"A","explanation":"第一空，搭配“土地”，根据“再次回到家乡”“满眼熟悉的场景”“早已泪眼”可知，横线所填词语表达对这片土地非常熟悉和思念的意思，A项“魂牵梦绕”、D项“日思夜想”都体现出思念的意思，符合文意。B项“知根知底”指非常了解某个人，横线搭配的是“土地”，搭配不当，排除；C项“牵肠挂肚”指非常挂念，很不放心，文段没有体现不放心的意思，排除；\n第二空，要体现出眼泪掉下来的样子，A项“婆娑”指眼泪下滴的样子，并且泪眼婆娑固定搭配，填入文段合适，D项“迷离”指模糊而难以分辨清楚，不符合文意，排除。\n第三空，代入验证，“诉说着发生的一切”，A项“诉说”符合语意，当选。\n故正确答案为A。\n【文段出处】《镜面》","no":42,"missingImage":false},{"qid":"2367885","cat":"逻辑填空","stem":"让国宝开口说话的新颖角度、适应网络传播的“微记录”样式、贴近年轻人的“萌言萌语”、各路高科技齐上阵的视觉奇效，都是        这部文物纪录片成功的要素。但真实记录，才是纪录片的生命，一切的创新和包装都是为“真实”服务的。如果                ，单纯地去追求视觉冲击、画面质感等表现元素而令内容失真，反而是                ，丢掉了纪录片的本位特征。\n依次填入画横线处最恰当的一 选南塘路","C":"丙或者选南塘路或者选北海路","D":"丁或者选西河路或者选北海路"},"answer":"B","explanation":"第一步：整理题干信息。\n① 每人各选两条道路，每条道路恰有两人选择，乙与丙始终没有在一组；\n② 甲东风\u003cimg data-k=\"7b6029b3bbde\">丁东风； \n③ 丙南塘\u003cimg data-k=\"7b6029b3bbde\">丁南塘；\n④ \u003cimg data-k=\"e752a8ae1a16\">甲南塘；\n⑤ \u003cimg data-k=\"e752a8ae1a16\">乙东风。\n根据99题结论可知，条件⑥甲选西河路和北海路，不选东风路和南塘路，又条件①乙与丙始终没有在一组，对于东风路和南塘路，甲不选，乙和丙也不能同时选，则丁必然要选东风路和南塘路，又根据条件⑤ \u003cimg data-k=\"e752a8ae1a16\">乙东风，可填写表格如下：\n\u003cimg data-k=\"c7d09286dc4e\" style=\"max-width:564px\">\n第二步：逐一分析选项。\nA项：根据分析可知甲选西河路和北海路，不可能选东风路或者选南塘路，不能推出，排除；\nB项：根据分析可知乙有三种情况，可以选西河路和北海路/西河路和南塘路/南塘路和北海路，对于三种情况，选项说法选西河路或者选南塘路均成立，可以推出，当选；\nC项：根据分析可知丙有三种情况，可以选东风路和西河路/东风路和南塘路/东风路和北海路，对于三种情况，选项说法选南塘路或者选北海路不一定成立，不能推出，排除；\nD项：根据分析可知丁选东风路和南塘路，不可能选西河路或者选北海路，不能推出，排除。\n故正确答案为B。","no":66,"missingImage":false},{"qid":"2367849","cat":"类比推理","stem":"贫困：脱贫：共同富裕","options":{"A":"协商：参与：社会治理","B":"输液：治疗：身体康复","C":"干旱：施肥：粮食丰收","D":"污染：治污：绿水青山"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n贫困是脱贫的必要条件，共同富裕是脱贫的目的。\n第二步：判断选项词语间逻辑关系。\nA项：协商不是参与的必要条件，社会治理不是参与的目的，与题干逻辑关系不一致，排除；\nB项：输液不是治疗的必要条件，身体健康是治疗的目的，前两个词与题干逻辑关系不一致，排除；\nC项：干旱是一种气候现象，干旱不是施肥的必要条件，粮食丰收是施肥的目的，前两个词与题干逻辑关系不一致，排除；\nD项：污染是治污的必要条件，绿水青山是治污的目的，与题干逻辑关系一致，当选。\n故正确答案为D。","no":67,"missingImage":false},{"qid":"2367850","cat":"类比推理","stem":"花丛：蜜蜂：采蜜","options":{"A":"餐厅：厨师：炒菜","B":"农田：农民：收割","C":"宇宙：恒星：运行","D":"树林：柳树：发芽"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n蜜蜂在花丛采蜜。采蜜是蜜蜂的工作，花丛是蜜蜂工作的地点，三者是对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：厨师在餐厅炒菜，炒菜是厨师的工作，餐厅是厨师工作的地点，三者是对应关系，与题干逻辑关系一致，保留；\nB项：农民在农田收割，收割是农民的工作，农田是农民工作的地点，三者是对应关系，与题干逻辑关系一致，保留；\nC项：恒星在宇宙运行，运行不是恒星的工作，与题干逻辑关系不一致，排除；\nD项：柳树在树林发芽，发芽不是柳树的工作，与题干逻辑关系不一致，排除。\n比对A、B，题干中的采蜜是个动宾词组，选项A中的炒菜是动宾词组，而选项B中的收割是个动词，因此，A的逻辑关系与题干更为接近。\n故正确答案为A。","no":68,"missingImage":false},{"qid":"2367851","cat":"类比推理","stem":"路霸：打击：黑恶势力","options":{"A":"功课：复习：基础课程","B":"友谊：维护：世界和平","C":"诚信：讲究：社会和谐","D":"铅笔：购买：学习用品"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n打击路霸，二者是动宾关系，路霸是黑恶势力的一种，二者是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：复习功课，二者是动宾关系，基础课程是功课的一种，与题干顺序相反，与题干逻辑关系不一致，排除；\nB项：维护友谊，二者是动宾关系，但友谊不是世界和平的一种，与题干逻辑关系不一致，排除；\nC项：讲究诚信，二者是动宾关系，但诚信不是社会和谐的一种，与题干逻辑关系不一致，排除；\nD项：购买铅笔，二者是动宾关系，铅笔是学习用品的一种，与题干逻辑关系一致，当选。\n故正确答案为D。","no":69,"missingImage":false},{"qid":"2367852","cat":"类比推理","stem":"理智：情感：悲伤","options":{"A":"冷漠：热情：热点","B":"科学：艺术：雕塑","C":"蓝天：白云：云霞","D":"陆地：河流：黄河"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n理智和情感是并列关系。悲伤是情感的一种，二者是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：冷漠和热情是反义关系，热点和热情不是种属关系，与题干逻辑关系不一致，排除；\nB项：科学和艺术是并列关系。雕塑是艺术的一种，与题干逻辑关系一致，保留；\nC项：蓝天和白云是并列关系，云霞是彩云，与白云是并列关系 ，与题干逻辑关系不一致，排除；\nD项：陆地和河流是并列关系，黄河是河流的一种，与题干逻辑关系一致，保留；\n比较B、D项，从种属关系细化的角度看，D项中黄河是一个特指，而题干悲伤不是特指，B项的雕塑也不是特指，因此B项相比D项与题干更一致。\n故正确答案为B。","no":70,"missingImage":false},{"qid":"2367853","cat":"类比推理","stem":"眼睛：眼镜：隐形眼镜","options":{"A":"脚踝：护膝：运动护膝","B":"耳机：耳朵：蓝牙耳机","C":"手掌：手套：纯棉手套","D":"假牙：牙套：烤瓷牙套"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n眼镜是矫正视力和保护眼睛的，两者是对应关系，隐形眼镜是眼镜的一种，两者是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：护膝是保护膝盖的，不是保护脚踝的，运动护膝是护膝的一种，前两者与题干逻辑关系不一致，排除； \nB项：耳朵不是用来保护耳机的，蓝牙耳机也不是耳朵的一种，与题干逻辑关系不一致，排除；\nC项：手套是保护手掌的，纯棉手套是手套的一种，与题干逻辑关系一致，当选；\nD项：牙套是矫正牙齿的，不是矫正假牙的，烤瓷牙套是牙套的一种，前两词与题干逻辑关系不一致，排除。\n故正确答案为C。","no":71,"missingImage":false},{"qid":"2367824","cat":"类比推理","stem":"高原：藏羚羊","options":{"A":"中国：金丝猴","B":"战场：指战员","C":"海洋：大白鲨","D":"大学：研究员"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n藏羚羊在高原生活，二者为生存环境与物种的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：金丝猴在中国生活，但中国是一个国家，范围太广，不是具体的生存环境对应，与题干逻辑关系不一致，排除；\nB项：指战员是指挥员和战斗员的统称，战场不是指战员的生存环境，与题干逻辑关系不一致，排除；\nC项：大白鲨在海洋生活，二者是生存环境与物种的对应关系，与题干逻辑关系一致，当选；\nD项：大学是研究员的工作地点，二者是工作地点的对应关系，不是生存环境，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":72,"missingImage":false},{"qid":"2367776","cat":"类比推理","stem":"楷体 之于（    ）相当于（    ）之于 水果","options":{"A":"字体——苹果","B":"字号——果汁","C":"隶书——食物","D":"书法——鸭梨"},"answer":"A","explanation":"逐一代入选项。\nA项：楷体是字体的一种；苹果是水果的一种，前后均为种属关系，前后逻辑关系一致，当选；\nB项：楷体是字体的一种，字号是指字体的大小，二者没有必然的逻辑关系；水果是果汁的原材料，二者为对应关系，前后逻辑关系不一致，排除；\nC项：楷体和隶书均是字体，二者为并列关系；水果是食物的一种，二者为种属关系，前后逻辑关系不一致，排除；\nD项：书法是艺术作品，楷体是字体，书法可以用到不同的字体，二者是对应关系；鸭梨是水果的一种，二者为种属关系，前后逻辑关系不一致，排除。\n故正确答案为A。","no":73," \n\u003cimg data-k=\"89e84fddc16b\" style=\"max-width:663px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"将原展开图标上序号，逐一分析。\n\u003cimg data-k=\"0c01f300bea4\" style=\"max-width:700px\">\nA项：该项必然存在面e和面f，由于面f和面b是相对面，故右侧面只能是面d，以面d和面e的公共边为唯一边，对面d进行顺时针画边，如下图所示，选项中边4对应的是面f，而在展开图中边4对应的是面b，故选项与题干不一致，排除；\n\u003cimg data-k=\"5076578fefc5\" style=\"max-width:700px\">\nB项：与题干一致，当选；\nC项：该项由面f、面b、面d组成，面f和面b是相对面，在选项中不可能同时存在，排除；\nD项：该项必然存在面e和面f，由于面e和面c是相对面，故顶面只能是面a，以面a和面f的公共边为唯一边（如下图所示），对面f进行顺时针画边，选项中边2对应的是面e，而展开图中边2对应的是面c，故选项与展开图不一致，排除。\n\u003cimg data-k=\"7124465873b1\" style=\"max-width:700px\">\n故正确答案为B。","no":87,"missingImage":false},{"qid":"2367800","cat":"图形推理","stem":"左边给定的是纸盒外表面的展开图，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"e0a0e394834f\" style=\"max-width:554px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"将原展开图标上序号，逐一分析。\n\u003cimg data-k=\"4626740a7e9d\" style=\"max-width:700px\">\nA项：该项出现面a、面e和面c，在展开图中面a和面c的公共边与面a的黑色直角边重合（如下图），而选项中面a和面c的公共边不与面a的黑色直角边重合，选项与题干不一致，排除；\n\u003cimg data-k=\"40a6f71bdc0a\" style=\"max-width:700px\">\nB项：与题干一致，当选；\nC项：该项由面c、面b和面f组成，在展开图中面c和面f是相对面，不能同时出现，选项与题干不一致，排除；\nD项：该项出现面e、面d、面f，选项中面e与面d公共边与面e中阴影三角形的直角边重合（如下图），而展开图中没有重合，选项与题干不一致，排除。\n\u003cimg data-k=\"c6c86b0e6764\" style=\"max-width:700px\">\n故正确答案为B。","no":88,"missingImage":false},{"qid":"2367815","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"a91fff768d1a\" style=\"max-width:626px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，优先考虑属性规律。九宫格优先按横行看，第一行图形均由直线构成，第二行图形均由曲线构成，第三行图形均由直线和曲线构成，因此“？”处图形应由直线和曲线构成，只有A项符合。\n故正确答案为A。","no":89,"missingImage":false},{"qid":"2367819","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"9bab1d3e079d\" style=\"max-width:481px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查图形的实际意义，寻找最大共同点。观察发现，题干所有图形都是枝干弯曲的一枝花，九宫格优先按横行来看，从第一行到二行，花枝朝向依次为右、左、右，左、右、左，规律为左右交替出现，第三行前两个图花枝朝向为右、左，因此“？”处花枝朝向应为右，A、C项花枝朝向为左，B项花枝干是直的，只有D项满足题干图形特征。\n故正确答案为D。","no":90,"missingImage":false},{"qid":"2367822","cat":"图形推理","stem":"左图为给定的立体，从任意角度剖开，右边哪一项不可能是它的截面图？\n\u003cimg data-k=\"df7d23d42d6a\" style=\"max-width:640px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查截面图，逐一分析选项。\n如下图所示，A、B、C三项均可截出，D项无法截出，因为竖着切中间的空的，所以D项左右两侧中间是看不到竖线的。\n\u003cimg data-k=\"c19c24ec54fd\" style=\"max-width:700px\">\n本题为选非题，故正确答案为D。","no":91,"missingImage":false},{"qid":"2367831","cat":"逻辑判断","stem":"没有人民支持和参与，任何改革都不可能取得成功。只有充分尊重人民意愿，形成广泛共识，人民才会积极支持改革、踊跃投身改革。要坚持人民主体地位，发挥群众首创精神，紧紧依靠人民推动改革开放。\n根据以上陈述，可以得出以下哪项？","options":{"A":"只有人民支持和参与，改革才可能取得成功","B":"只有坚持人民主体地位，才能发挥群众首创精神","C":"如果人民踊跃投身改革，则说明形成了广泛共识","D":"如果没有充分尊重人民意愿，人民就不会积极支持改革"},"answer":"A","explanation":"第一步：翻译题干。\n① 改革取得成功\u003cimg data-k=\"7b6029b3bbde\">人民支持和参与；\n② 人民积极支持改革且踊跃投身改革\u003cimg data-k=\"7b6029b3bbde\">充分尊重人民意愿且形成广泛共识。\n第二步：逐一分析选项。\nA项：翻译为改革可能取得成功\u003cimg data-k=\"7b6029b3bbde\">人民支持和参与，肯前必肯后，根据条件①可以推出，当选；\nB项：题干中人民主体地位和群众首创精神，无明显推出关系，无法翻译，排除；\nC项：翻译为人民踊跃投身改革\u003cimg data-k=\"7b6029b3bbde\">形成广泛共识，只肯定了条件②前件中的一个条件，无法推出后件，排除；\nD项：翻译为没有充分尊重人民意愿\u003cimg data-k=\"7b6029b3bbde\">不会积极支持改革，可逆否等价为：积极支持改革\u003cimg data-k=\"7b6029b3bbde\">充分尊重人民意愿，只肯定了条件②前件中的一个条件，无法推出后件，排除。\n故正确答案为A。","no":92,"missingImage":false},{"qid":"2367843","cat":"逻辑判断","stem":"食品安全已成为现代社会关注的热点问题。今年针对某市的一项社会调查显示，\u003cimg data-k=\"19ad8c53504e\">的受访者在吃的方面有安全感，\u003cimg data-k=\"5922132b4378\">的受访者没有安全感，而去年相应的调查数据分别是\u003cimg data-k=\"b8bdcea8405c\">和\u003cimg data-k=\"d035522d3327\">。调查人员由此断言，今年该市公众对食品的安全感有所提高，食品安全的总体状况好于上年。\n以下哪项如果为真，最能质疑上述调查结论？","options":{"A":"今年有些受访者没有表达自己对食品安全的态度","B":"今年该市政府加大了对食品安全工作的管理力度","C":"该市媒体今年报道了多起假奶粉等食品安全事件","D":"今年的社会调查中增加了不少餐饮经营者的样本"},"answer":"D","explanation":"第一步:找出论点和论据。\n论点:今年该市公众对食品的安全感有所提高，食品安全的总体状况好于去年。\n论据:今年\u003cimg data-k=\"19ad8c53504e\">的受访者在吃的方面有安全感，\u003cimg data-k=\"5922132b4378\">的受访者没有安全感，而去年相应的调查数据分别是\u003cimg data-k=\"b8bdcea8405c\">和\u003cimg data-k=\"d035522d3327\">。\n本题通过对今年和去年受访者对食品有无安全感的数据对比，得出今年该市公众对食品的安全感有所提高，食品安全的总体状况好于上年。论据是一组对比实验，可以通过指出两组对比对象情况不一致进行削弱，即说明今年和去年的受访者存在不同。\n第二步:逐一分析选项。\nA项：有些受访者没有表达自己的态度，并不能质疑论据中表达态度的受访者数据的真实性，无法削弱，排除；\nB项：该市政府加大了食品安全的管理力度，解释了今年食品安全度上升的原因，属加强项，无法削弱，排除；\nC项：今年该市媒体报道了多起假奶粉事件，与今年食品安全的总体状况无关，无关项，排除；\nD项：今年受访样本中增加了不少餐饮经营者，而餐饮经营者会更加偏向于认定食品是安全的，那么由此得出的数据高于去年显然不能得出食品安全的总体状况，属于拆桥，可以削弱，当选。\n故正确答案为D。","no":93,"missingImage":false},{"qid":"2367858","cat":"逻辑判断","stem":"并不是所有的老年人都适合参与投资活动，绝大多数的投资品种都要求投资人具有丰富的专业知识，但多数老年人在这方面有所欠缺，以至于只能听任一些骗子的忽悠。相比股市、基金等证券类投资，老年人投资艺术品更容易上当。如果没有足够的鉴别能力，他们就会受骗，被骗了心里还想着遇到了“捡漏”的美事。\n根据以上陈述，可以得出以下哪项？","options":{"A":"有些老年人专业知识丰富，适合参与投资活动","B":"有些老年人没有足够的鉴别能力，但也会遇到“捡漏”的美事","C":"有些老年人如果不想上当受骗，就要有足够的鉴别能力","D":"老年人不适合参与投资活动，无论是股市、基金还是艺术品投资"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干第一句话可知，有的老年人不适合参与投资活动，投资需要有丰富的专业知识，多数老年人缺少丰富的专业知识，因此无法推出有些专业知识丰富的老年人适合参与投资活动，排除；\nB项：题干中最后一句只是强调被骗了心里还想着“捡漏”的美事，没有提及是否会遇到“捡漏”的美事，无中生有，排除；\nC项：翻译为有些老年人\u003cimg data-k=\"e752a8ae1a16\">受骗\u003cimg data-k=\"7b6029b3bbde\">有足够的鉴别能力，题干中最后一句话可以翻译为：\u003cimg data-k=\"e752a8ae1a16\">足够的鉴别能力\u003cimg data-k=\"7b6029b3bbde\">受骗，可逆否等价为：\u003cimg data-k=\"e752a8ae1a16\">受骗\u003cimg data-k=\"7b6029b3bbde\">有足够的鉴别能力，“所有可以推出有的”，故根据题干可以推出，当选；\nD项：根据题干第一句话可知，有的老年人不适合参与投资活动，而D选项的说法过于绝对，排除。\n故正确答案为C。","no":94,"missingImage":false},{"qid":"2367860","cat":"逻辑判断","stem":"智能手机流行的时代，我们每天发送信息，也收到信息。人际之间的电子信息交往已成为当今时代一种独特的交往方式。在面对重要的人或关系时，很多人往往发出信息后就期待被秒回，如果没有被秒回，他们就产生一种怀疑感或被弃感，从而陷入深深的烦恼和焦虑之中。\n以下哪项最可能是他们陷入深深烦恼和焦虑所需的假设？","options":{"A":"当前技术已能实现智能手机的即时通信，方便快捷，且基本免费","B":"有些聊天软件能在发送者手机中反馈信息接收者是否阅读了信息","C":"有些人工作很忙，总习惯在忙完一天工作后才统一处理相关信息","D":"有些人一天收到的信息太多，容易遗漏某人期待秒回的重要信息"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：在面对重要的人或关系时，很多人往往发出信息后就期待被秒回，如果没有被秒回，他们就产生一种怀疑感或被遗弃感，从而陷入深深的烦恼和焦虑之中。\n论据：无。\n本题无论据，只能通过补充论据进行加强。提问方式是假设类，优先考虑补充必要条件，即没有这个选项，论点则无法成立。\n第二步：逐一分析选项。\nA项：如果智能手机不能即时通信，那么发出的信息就无法被即时接收，发出者就不会期待秒回，因此A项是信息能够被秒回的必要条件，当选；\nB项：有些聊天软件能在发送者手机中反馈信息接收者是否阅读了信息，可以解释部分发出者为什么没有被秒回就会产生怀疑感或被弃感，但是力度较弱，且不是论点成立的必要条件，排除；\nC项：接收者什么时候阅读信息与发出者没被秒回就会产生烦恼和焦虑无关，排除； \nD项：接收者是否遗漏了重要信息与发出者没被秒回就会产生烦恼和焦虑无关，排除。\n故正确答案为A。\n附：通过查证原文，本题答案为A项。\n\u003cimg data-k=\"6b2f2c14ad9a\" style=\"max-width:700px\">","no":95,"missingImage":false},{"qid":"2367861","cat":"逻辑判断","stem":"某区对所辖钟山、长江、梅园、星海4个街道进行抽样调查，并按照人均收入为其排序。有人根据以往经验对4个街道的人均收入排序作出如下预测：\n（1）如果钟山街道排第三，那么梅园街道排第一；\n（2）如果长江街道既不排第一也不排第二，那么钟山街道排第三；\n（3）钟山街道排序与梅园街道相邻，但与长江街道不相邻。\n事后得知，上述预测符合调查结果。\n根据以上信息，可以得出以下哪项？","options":{"A":"钟山街道不排第一就排第四","B":"长江街道不排第二就排第三","C":"梅园街道不排第二就排第四","D":"星海街道不排第一就排第三"},"answer":"A","explanation":"第一步：分析题干条件。\n① 钟山第三\u003cimg data-k=\"7b6029b3bbde\">梅园第一；\n② 长江\u003cimg data-k=\"e752a8ae1a16\">第一 且 \u003cimg data-k=\"e752a8ae1a16\">第二\u003cimg data-k=\"7b6029b3bbde\">钟山第三；\n③ 钟山与梅园相邻，与长江不相邻。\n第二步：根据题干条件进行推理。\n钟山出现次数最多，为最大信息，可作为突破口。根据③可知：钟山与梅园相邻，结合①可知：钟山第三\u003cimg data-k=\"7b6029b3bbde\">梅园第一，故钟山不能排名第三。\u003cimg data-k=\"e752a8ae1a16\">钟山第三是对②的否后，否后必否前，故长江排名第一或者第二。\n如果长江排第一，根据③可知钟山只能排第四，故梅园排第三，星海排第二，排除B、C、D项，只有A项成立；\n如果长江排第二，根据③可知钟山只能排第四，故梅园排第三，星海排第一，A项依然成立。\n故正确答案为A。","no":96,"missingImage":false},{"qid":"2368009","cat":"逻辑判断","stem":"我国家长们对儿童阅读越来越重视，大多数家长希望孩子多读书读好书。2018年，某市\u003cimg data-k=\"e98b0b40299a\">的家庭有父母陪孩子读书的习惯，亲子阅读的图书量比2017年提高了1.8个百分点，时长也比去年有所增加。但是，2018年该市的儿童人均图书阅读量仅为4.72本，比2017年还下降了0.6个百分点。\n以下哪项如果为真，最能解释上述现象？","options":{"A":"近年来孩子课业负担较重，对课外阅读很多人是“心有余而时不足”","B":"在亲子阅读中很多孩子习惯“听书”，这种情况2018年未计算在内","C":"大多数80后、90后家长都受过高等教育，比较看重亲子阅读的意义","D":"孩子在手机、电脑上的电子阅读一直未纳入儿童图书阅读的考虑范围"},"answer":"B","explanation":"第一步：找出题干矛盾。\n2018年，某市亲子阅读的图书量比2017年提高了1.8个百分点，时长也比去年有所增加。但2018年该市的儿童人均图书阅读量比2017年还下降了0.6个百分点。\n第二步：逐一分析选项。\nA项：孩子课业负担较重，对课外阅读很多人是“心有余而时不足”，提及了儿童阅读量不高，但是并没有涉及亲子阅读的影响，不能解释题干矛盾，排除；\nB项：在亲子阅读中很多孩子习惯“听书”，这种情况未计算在图书阅读量内，既提及了亲子阅读，又涉及了读书量计算的方式，能够解释为什么2018年亲子阅读量增加而儿童阅读量并没有增加的情况，可以解释题干矛盾，当选；\nC项：大多数80后、90后家长比较看重亲子阅读的意义，提及了亲子阅读的图书量可能更多，但并没有涉及儿童的人均读书量为何下降，不能解释题干矛盾，排除；\nD项：孩子在手机、电脑上的电子阅读一直未纳入儿童图书阅读的考虑范围，没有涉及亲子阅读的影响，而且选项说的是一直，也就是说2017年和2018年均未考虑在内，不能解释题干矛盾，排除。\n故正确答案为B。","no":97,"missingImage":false},{"qid":"2367863","cat":"逻辑判断","stem":"某县新一届党政领导班子刚组建完成，一心想为群众做一些实事。面对有限的财力，新一届领导班子明确表示，今年只能完成两件大事。对于众多排进公共政策议程的大事，他们认为：如果建一条乡村公路，则不能建污水处理厂；如果建污水处理厂，则要建排污管道；如果建排污管道，则不能建垃圾处理厂。\n按照这届领导班子的想法，以下哪项不可能是他们今年同时要建设的？","options":{"A":"乡村公路、排污管道","B":"乡村公路、垃圾处理厂","C":"污水处理厂、排污管道","D":"污水处理厂、垃圾处理厂"},"answer":"D","explanation":"第一步：翻译题干。\n①  建公路\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">建污水处理厂；\n②  建污水处理厂\u003cimg data-k=\"7b6029b3bbde\">建排污管道；\n③  建排污管道\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">建垃圾处理厂；\n将③和②可以递推出：④ 建污水处理厂\u003cimg data-k=\"7b6029b3bbde\">建排污管道\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">建垃圾处理厂；\n⑤  只能完成两件大事。\n第二步：逐一分析选项。\nA项：若建公路和排污管道，根据①得到不建污水处理厂，根据③得到不建垃圾处理厂，此时完成两件大事，与题干已知条件不矛盾，可以推出，排除；\nB项：若建公路和垃圾处理厂，根据①得到不建污水处理厂，根据④得到不建排污管道以及不建污水处理厂，此时完成两件大事，与题干已知条件不矛盾，可以推出，排除；\nC项：若建污水处理厂和排污管道，根据①的否后必否前，得到不建公路，根据④得到不建垃圾处理厂，此时完成两件大事，与题干已知条件不矛盾，可以推出，排除；\nD项：根据④可知，建污水处理厂\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">建垃圾处理厂，故不可能同时建污水处理厂和垃圾处理厂，不能推出，当选。\n本题为选非题，故正确答案为D。","no":98,"missingImage":false},{"qid":"2367896","cat":"逻辑判断","stem":"科幻小说《三体》中提出的“黑暗森林理论”告诉我们，人类千万不能向宇宙透露我们地球的位置，否则就会被外星文明毁灭。但是，早在《三体》出版之前的1974年，人类就向距离地球超过2.2万光年的武仙座星团发送了一段无线电信号，以光速主动向宇宙宣告了自身的存在。这个编号为M13的武仙座星团拥有数十万颗恒星。科学家认为，恒星周围一般会伴有行星，但恒星上不可能存在生命体，行星上却可能有。深信黑暗森林理论的人不禁为人类这一鲁莽举动感到担心，认为人类的美好期望有可能会迎来残酷的现实。\n以下哪项如果为真，最能说明这种担心是不必要的？","options":{"A":"迄今为止人类并没有发现任何外星生命存在的迹象","B":"类地行星也并不罕见，平均每5颗恒星就拥有1颗","C":"恒星密集分布的武仙座星团内不存在任何行星系统","D":"即使武仙座星团文明收到信号也要在2.2万年以后"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：人类的美好期望有可能会迎来残酷的现实。\n论据：科幻小说《三体》中提出的“黑暗森林理论”告诉我们，人类千万不能向宇宙透露我们地球的位置，否则就会被外星文明毁灭。但是，早在《三体》出版之前的1974年，人类就向距离地球超过2.2万光年的武仙座星团发送了一段无线电信号，以光速主动向宇宙宣告了自身的存在。这个编号为M13的武仙座星团拥有数十万颗恒星。科学家认为，恒星周围一般会伴有行星，但恒星上不可能存在生命体，行星上却可能有。\n文段较长而且问法比较特殊，问“说明这种担心是不必要的”可以理解成是削弱题，论点是担心人类未来，论据是这种担心产生的依据，论点是对未来的预测，可优先考虑削弱论据。\n第二步：逐一分析选项。\nA项：指出迄今为止还没有发现任何外星生命存在的迹象，但是没有发现不代表以后不存在，属于不明确选项，无法削弱，排除；\nB项：指出类地行星不罕见，而行星上可能存在生命体，意味着存在其他生命体的可能性增加，人类会因此而担心，具有加强作用，排除；\nC项：指出武仙座星团不存在任何行星系统，也就是说不会存在生命体，就不会给人类带来危害，削弱论据，可以削弱，当选； \nD项：指出武仙星团接收到信号的时间会在2.2万年以后，之后是否会给地球上的人类带来危害，不得而知，属于不明确选项，无法削弱，排除。\n故正确答案为C。","no":99,"missingImage":false},{"qid":"2367802","cat":"定义判断","stem":"公众充权：指在公共政策的制定、执行、评估、监督过程中，公众积极参与，充分表达自己的利益主张，以推动公共政策过程的民主化与科学化。\n下列属于公众充权的是","options":{"A":"清明节到来前夕，一些社会人士在市文明办支持下创建了文明祭扫网站，号召民众祭扫时不放鞭炮，不烧纸钱，改用虚拟鲜花、电子蜡烛等绿色环保的方式","B":"快递小哥小李当选市人大代表后，在广泛走访充分调研的基础上，提交了一份关于如何保障快递员权益、促进快递行业健康发展的议案","C":"某市将要召开天然气价格调整听证会，有关部门要求辖区各街道、居委会搞好宣传动员工作，按照下达名额推举市民代表，确保公开公平公正","D":"在某县未来五年发展规划制定过程中，县委、县政府通过召开居民座谈会、专家听证会等形式，征求到了许多宝贵的意见"},"answer":"D","explanation":"第一步：找出定义关键词。\n“在公共政策的制定、执行、评估、监督过程中”、“公众积极参与，充分表达自己的利益主张”、“推动公共政策过程的民主化与科学化”。\n第二步：逐一分析选项。\nA项：创建文明祭扫网站，号召改用绿色环保的方式，不符合“在公共政策的制定、执行、评估、监督过程中”，不符合定义，排除；\nB项：提交议案，不符合“在公共政策的制定、执行、评估、监督过程中”，不符合定义，排除；\nC项：召开天然气价格调整听证会可以理解为“在公共政策的制定、执行、评估、监督过程中”，但按照下达名额推举市民代表，不符合“公众积极参与，充分表达自己的利益主张”，不符合定义，排除；\nD项：在某县未来五年发展规划制定过程中，符合“在公共政策的制定、执行、评估、监督过程中”，通过召开居民座谈会、专家听证会等形式，征求到了许多宝贵的意见，符合“公众积极参与，充分表达自己的利益主张”，符合定义，当选。\n故正确答案为D。","no":100,"missingImage":false},{"qid":"2367806","cat":"定义判断","stem":"危机公关：指政府部门、社会团体或企业面对可能造成严重后果的突发事件时，有组织、有计划地采取各种应对措施，避免损害或者降低损害程度，以期获得公众谅解的管理活动。\n下列不属于危机公关的是：","options":{"A":"某公司生产的多批次药品标注虚假生产日期的消息曝光后，公司领导立即在报纸、电视台向全国公众道歉，宣布召回这些批次的产品，承诺通过合适渠道赔偿受害者，迅速查清并如实公布事件真相，请社会各界人士监督","B":"某地曝出高考答题卡被掉包的传闻后，当地政府部门迅速成立联合调查组，网上公布高考命题、监考、阅卷等环节的操作规范，并及时发布调查进展情况，公众情绪逐渐平复，最终查明这一传闻完全是谣言","C":"“某品牌火腿肠使用过期猪肉”的消息在网络上蔓延，公司迅速查实后道歉、召回、赔偿，并制定了详细整改措施，承诺绝不会再出现此类事件，媒体和消费者慢慢平静下来","D":"某商场管理层吸取毗邻商场因电路老化引起火灾、损失惨重的教训，定期组织专业人员加强对线路安全的检查，及时更换老旧电线，并且张贴《规范用电须知》提醒商家，商家都非常配合，防火意识显著增强"},"answer":"D","explanation":"第一步：找出定义关键词。\n“政府部门、社会团体或企业面对可能造成严重后果的突发事件时”、“有组织、有计划地采取各种应对措施，避免损害或者降低损害程度”、“以期获得公众谅解”。\n第二步：逐一分析选项。\nA项：某公司生产的多批次药品标注虚假生产日期的消息曝光后，符合“企业面对可能造成严重后果的突发事件时”，立即在报纸、电视台道歉，宣布召回产品，承诺赔偿受害者等，符合“有组织、有计划地采取各种应对措施，避免损害或者降低损害程度，以期获得公众谅解”，符合定义，排除；\nB项：某地曝出高考答题卡被掉包的传闻后，符合“面对可能造成严重后果的突发事件时”，迅速成立联合调查组，网上公布操作规范，及时发布调查进展情况，查明这一传闻是谣言，符合“有组织、有计划地采取各种应对措施，避免损害或者降低损害程度，以期获得公众谅解”，符合定义，排除；\nC项：“某品牌火腿肠使用过期猪肉”的消息在网络上蔓延，符合“面对可能造成严重后果的突发事件时”，迅速查实后道歉、召回、赔偿，并制定整改措施，符合“有组织、有计划地采取各种应对措施，避免损害或者降低损害程度，以期获得公众谅解”，符合定义，排除；\nD项：某商场管理层吸取毗邻商场因电路老化引起火灾、损失惨重的教训，未体现“面对可能造成严重后果的突发事件时”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":101,"missingImage":false},{"qid":"2367810","cat":"定义判断","stem":"信息扶贫：指政府或社会群体借助信息技术手段来解决因信息闭塞而导致的经济、文化上的贫困问题。\n下列属于信息扶贫的是","options":{"A":"某物流公司联手互联网巨头在边远山区定向从贫困户中招聘一批快递员，经过专业培训之后上岗，帮他们走上了脱贫致富的道路","B":"某手机生产厂家面向农村市场，推出了一款低成本、易操作、大屏幕、待机时间长的时尚智能手机，村民们纷纷换掉了原来的旧手机","C":"省城某重点中学建立网络课堂，向某贫困县的中学进行远程同步直播，使两地师生共享优质教学资源。几年来，该县考上重点大学的人数明显增多","D":"毕业返乡的小周带着几个同学开了家网店，在网上销售自家种植的红枣，销量逐步上升，日子越来越红火"},"answer":"C","explanation":"第一步：找出定义关键词。\n“政府或社会群体借助信息技术手段”、“解决因信息闭塞而导致的经济、文化上的贫困问题”。\n第二步：逐一分析选项。\nA项：招聘快递员，经过专业培训之后上岗，未体现“借助信息技术手段”，不符合定义，排除；\nB项：某手机生产厂家面向农村市场推出时尚智能手机，未体现“解决贫困问题”，也未体现“借助信息技术手段”，不符合定义，排除；\nC项：建立网络课堂，进行远程同步直播，符合“借助信息技术手段”，共享优质教学资源，该县考上重点大学的人数明显增多，符合“解决因信息闭塞而导致的文化上的贫困问题”，符合定义，当选；\nD项：开网店可以理解为“信息技术手段”，但未体现“解决因信息闭塞而导致的经济、文化上的贫困问题”，不符合定义，排除。\n故正确答案为C。","no":102,"missingImage":false},{"qid":"2367816","cat":"定义判断","stem":"社会性处罚：指存在失信行为的人员所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚。\n下列属于社会性处罚的是","options":{"A":"以“站不起来”为理由强占他人座位的高铁“霸座男”，当场受到了乘警的严肃批评，下车后被移送公安机关接受治安处罚。这一事件曝光后，当事人的恶劣行为又遭到了全国网民的一致谴责","B":"由于数据造假，某教授在国际期刊上发表的论文被撤稿。在网民的谴责声中，该教授又被撤销了基于该论文所获得的绩效奖励、省部级科研项目、荣誉称号、社会兼职","C":"春节前夕，恶意拖欠农民工工资的部分包工头，被有关部门和各种媒体曝光，引起社会各界密切关注。根据银行、保险、铁路等部门的规定，这些违规者申请信用卡、购买保险以及动车和高铁票时都将受到限制","D":"长江沿岸的一家化工企业，多次不顾禁令向长江偷偷排污，最近被省有关部门通报批评，吊销了企业生产执照，它的上级主管部门及主要负责人也都受到了严厉的处罚"},"answer":"C","explanation":"第一步：找出定义关键词。\n“存在失信行为的人员”、“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”。\n第二步：逐一分析选项。\nA项：以“站不起来”为理由强占他人座位的高铁“霸座男”，符合“存在失信行为的人员”，当场受到了乘警的严肃批评，被移送公安机关接受治安处罚，这是与自身失信行为有直接关联的限制和处罚，不符合“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”，不符合定义，排除；\nB项：某教授数据造假，符合“存在失信行为的人员”，论文被撤稿，撤销了基于该论文所获得的绩效奖励、省部级科研项目、荣誉称号、社会兼职，均是与自身失信行为有直接关联的处罚，不符合“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”，不符合定义，排除；\nC项：恶意拖欠农民工工资的包工头，符合“存在失信行为的人员”，申请信用卡、购买保险以及动车和高铁票时都将受到限制，符合“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”，符合定义，当选；\nD项：长江沿岸的一家化工企业，多次不顾禁令向长江偷偷排污，不符合“存在失信行为的人员”，不符合定义，排除。\n故正确答案为C。","no":103,"missingImage":false},{"qid":"2367818","cat":"定义判断","stem":"隐形植入：指通过周边信息、符号体系等不易察觉的形式，使受众在不知不觉中受到影响的宣传策略。\n下列属于隐形植入的是：","options":{"A":"在某电视剧中，所有角色均使用同一品牌的手机，并使用这个品牌的经典铃声","B":"城运会到来之前，商家把印有城运会会徽的各类文化创意产品陆续摆上了柜台","C":"在某市博物馆馆标设计征集中，8号方案以浓郁的地域文化元素受到了评委的关注","D":"结婚纪念日快到了，为了提醒粗心又忙碌的丈夫，小李偷偷把他的手机屏保换成了婚纱照"},"answer":"A","explanation":"第一步：找出定义关键词。\n“不易察觉的形式”、“不知不觉受到影响”、“宣传策略”。\n第二步：逐一分析选项。\nA项：在电视剧中使用同一品牌手机，用该品牌经典铃声符合“不易察觉的形式”，“不知不觉受到影响”，也是“宣传策略”，符合定义，当选；\nB项：印有城运会会徽，不符合“不易察觉的形式”，不符合定义，排除；\nC项：馆标设计受到评委关注，不属于“宣传策略”，不符合定义，排除；\nD项：小李提醒丈夫结婚纪念日，把丈夫手机屏保换成婚纱照，符合“不易察觉的形式”，但不属于“宣传策略”，不符合定义，排除。\n故正确答案为A。","no":104,"missingImage":false},{"qid":"2367821","cat":"定义判断","stem":"情感性劳动：指服务业员工在与顾客面对面交往时，将个人情感融入工作过程，对顾客、企业以及服务人员自己产生积极影响的行为。\n下列属于情感性劳动的是：","options":{"A":"某航空公司空姐站在登机口两旁欢迎乘客，时不时还会微笑着摸摸小孩的头","B":"小刘总是面带微笑、语气亲切热情地接打电话，连续多年被评为最美接线员","C":"某酒店智能客服“小青”善解人意，语音甜美，入住的客人都喜欢和她互动","D":"小秦在信访局工作多年，每次接待来访者，都非常耐心，细致了解具体情况"},"answer":"A","explanation":"第一步：找出定义关键词。\n“服务业员工”、“顾客”、“面对面”、“个人感情”、“对顾客、企业及自己产生积极影响”。\n第二步：逐一分析选项。\nA项：空姐属于“服务业员工”，站在登机口欢迎属于“面对面”，微笑摸摸小孩的头符合“个人感情”，符合定义，当选；\nB项：接打电话不符合“面对面”，不符合定义，排除；\nC项：小青是智能客服，不符合“个人情感”，不符合定义，排除；\nD项：小秦耐心、细致了解只体现工作负责，未体现“个人感情”，不符合定义，排除。\n故正确答案为A。","no":105,"missingImage":false},{"qid":"2367823","cat":"定义判断","stem":"大数据“杀熟”：指商家在提供相同的商品或服务时，根据大数据的甄别结果，对有多次消费记录或消费能力较高的客户，以偏高标准收费的销售策略。\n下列属于大数据“杀熟”的是：","options":{"A":"小李负责单位的接待工作，经常要预约商务车接送。后来只要他打车，网约平台就直接推送高价的商务车，无奈之下小李只好注册一个新号供自己日常出行","B":"经常在网上预订酒店的老张在预订某酒店的单人间时，价格一直为380元。他的侄子暑假来看望他，也在网上预定了该酒店同样的房间，价格却便宜四分之一","C":"位于市中心金融服务区的某超市由于环境优越，客户购买力强，某品牌饮料在这里售价高达15元，而这种饮料在居民小区便利店只需要10元","D":"某购物网站推出新用户推广活动，每位新注册用户都可免费获赠抵用券，算下来买同样的商品新会员比老会员还要便宜好多，这让老会员们郁闷不已"},"answer":"B","explanation":"第一步：找出定义关键词。\n“相同的产品或服务”、“大数据甄别结果”、“多次消费记录或消费能力较高的顾客”、“偏高标准收费”。\n第二步：逐一分析选项。\nA项：小李经常预约商务车，符合“多次消费记录或消费能力较高的顾客”，但单位的接送服务和日常的出行服务不属于“相同的产品或服务”，也未体现对相同的产品有偏高的收费，不符合“偏高标准收费”，不符合定义，排除；\nB项：老张经常在网上预订酒店符合“多次消费记录或消费能力较高的顾客”，在网上预订符合“大数据”，侄子预订该酒店同样的房间符合“相同的产品或服务”，老张380元，侄子价格便宜了四分之一符合“偏高标准收费”，符合定义，当选；\nC项：金融服务区同品牌饮料比居民小区便利店高，符合“相同的产品或服务”、“偏高标准收费”，但不符合“大数据甄别结果”，不符合定义，排除；\nD项：新用户买同样商品比老用户便宜符合“相同的产品或服务”，但不属于针对“多次消费记录或消费能力较高的顾客”，是因为为了推广而赠送抵用券所以便宜，不符合定义，排除。\n故正确答案为B。","no":106,"missingImage":false},{"qid":"2367826","cat":"定义判断","stem":"语码转换：指说话人在同一对话过程中使用多种语言或方言进行交流的现象。\n下列不属于语码转换的是：","options":{"A":"约翰先生在中国生活多年，与单位同事交谈时总是坚持用汉语，有时实在不知道怎样准确表达自己的意思，也会夹杂三两个英语单词","B":"马经理接待来访客户，用普通话向他们介绍了自己公司的情况。得知客户中有两位陕西老乡后，当即操起陕西话与他们攀谈了几句","C":"在一次国际学术会议上，陈教授用英语作报告时带了一股浓浓的四川口音，参加会议的大多数外国学者几乎都没有听懂他的发言","D":"来到留学生宿舍后，班主任方老师询问了他们的日常生活情况，当他发现一个学生流露出不解的神情时，立刻又用英语解释了一番"},"answer":"C","explanation":"第一步：找出定义关键词。\n“同一对话过程”、“多种语言或方言”。\n第二步：逐一分析选项。\nA项：约翰和同事交谈坚持用汉语，夹杂两三个英语单词，符合“同一对话过程”，英语和汉语两种语言符合“多种语言或方言”，符合定义，排除；\nB项：马经理接待客户符合“同一对话过程”，普通话、陕西话符合“多种语言或方言”，符合定义，排除；\nC项：陈教授作报告符合“同一对话过程”，四川口音的英语只有英语一种语言，不符合“多种语言或方言”，不符合定义，当选；\nD项：方老师询问学生日常生活符合“同一对话过程”、用英语解释表明之前说的不是英语，符合“多种语言或方言”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":107,"missingImage":false},{"qid":"2367829","cat":"定义判断","stem":"信息焦虑：指人们在过量信息包围下因为难以获取、处理、利用所需信息而产生的厌倦、烦躁、紧张等负面情绪。\n下列属于信息焦虑的是","options":{"A":"小敏热衷于娱乐八卦，她时刻关注微博更新，看到手机上的未读信息就忍不住想去点击，每天用于浏览信息的时间远远超过她自己的工作时间","B":"在开发商那里登记过购房意向后，闵先生每天都会接到几十个乃至上百个电话和信息，卖房的、装修的、投资的、理财的、贷款的，让他不胜其烦","C":"小谢沉迷于网络游戏，一玩就是一通宵，白天上课总是想着游戏，久而久之产生了严重的厌学情绪，精神状态萎靡不振，身体素质越来越差","D":"小李在外文数据库查资料，每输入一个关键词就跳出几十篇相关论文，因英语欠佳，没法筛选，完全不知道哪些才是自己真正要用的，感觉精神马上就要崩溃了"},"answer":"D","explanation":"第一步：找出定义关键词。\n“人们在过量信息包围下因为难以获取、处理、利用所需信息”、“而产生的厌倦、烦躁、紧张等负面情绪”。\n第二步：逐一分析选项。\nA项：每天用于浏览信息的时间远远超过她自己的工作时间，该选项没有体现出厌倦、烦躁、紧张等负面情绪，不符合定义，排除； \nB项：在开发商登记过购房意向后，接到几十个乃至上百个电话和信息，而这些信息大部分都是闵先生所不需要的，体现不出闵先生“难以获取、处理、利用所需信息”，不符合定义，排除；\nC项：小谢沉迷于游戏，白天上课也总想着游戏，该选项没有体现出“过量的信息”，不符合定义，排除；\nD项：小李查询资料，每输入一个关键词就跳出几十篇相关论文，因英语欠佳，没法筛选，不知道哪个是自己要用的，符合“人们在过量信息包围下因为难以获取、处理、利用所需信息”，感觉精神马上就要崩溃了，符合“产生的厌倦、烦躁、紧张等负面情绪”，符合定义，当选。\n故正确答案为D。","no":108,"missingImage":false},{"qid":"2367833","cat":"定义判断","stem":"不见面审批：指有关部门通过网络渠道接受、审核各种申请材料，并将批复结果及时通知申请人的公务处理方式。\n下列不属于不见面审批的是","options":{"A":"家住农村的小李在朋友指点下，按照当地社保网站的各项提示填好了个人的信息材料，当天就在村委会拿到了自己的社保证明","B":"小赵向市长信箱发送电子邮件，举报一家企业向河中偷排污水的情况，涉事企业被环保部门责令停产整改，小赵收到了关于处罚结果的邮件回复","C":"小王打算开一家餐饮店，在市工商局网站上提交了全部材料，没想到的是，一周之内就拿到了营业执照","D":"小丁根据工作人员提示，在网上录完了办理房产证的申请材料，第二天登录网站发现，他的材料不完整，需要补充材料重新提交"},"answer":"B","explanation":"第一步：找出定义关键词。\n“有关部门通过网络渠道接受、审核各种申请材料”、“并将批复结果及时通知申请人的公务处理方式”。\n第二步：逐一分析选项。\nA项：小李在朋友的指点下，按照当地社保网站的各项提示填好了个人信息材料，符合“有关部门通过网络渠道接受、审核各种申请材料”，当天就在村委会拿到了自己的社保证明，符合“并将批复结果及时通知申请人的公务处理方式”，符合定义，排除； \nB项：小赵的举报行为不符合行政申请，小赵收到关于处罚结果的回复也不是“批复结果”，不符合“将批复结果及时通知申请人的公务处理方式”，不符合定义，当选；\nC项：小王在市工商局网站上提交了全部材料，符合“有关部门通过网络渠道接受、审核各种申请材料”，一周之内拿到了营业执照，符合“将批复结果及时通知申请人的公务处理方式”，符合定义，排除；\nD项：小丁根据工作人员提示，在网上录完了办理房产证的申请材料，符合“有关部门通过网络渠道接受、审核各种申请材料”，第二天登录网站发现需要补充材料重新提交，符合“将批复结果及时通知申请人的公务处理方式”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":109,"missingImage":false},{"qid":"2367834","cat":"定义判断","stem":"友善采购：指因自然灾害或其他无法抗拒的因素而造成产品大量积压时，购买方按照不低于甚至略高于批发价或市场价的方式购买这些产品，以帮助生产者渡过难关的行为。\n下列属于友善采购的是：","options":{"A":"近期原材料价格上涨，各种电子器件供应紧张，某企业主动加价，从长期供货商那里购入了大批急需的电子器件，保证了企业生产的正常进行","B":"因连日暴雨引发山洪，造成当地瓜农数十亩即将上市的西瓜被淹，对口帮扶城市得知消息后，以市场价收购了该地瓜农的全部西瓜","C":"南方某地水果大获丰收，造成大量积压滞销，采购商得知东北销路很好，从忧心忡忡的果农那里大量购进，转销东北，获利颇丰","D":"某少数民族的传统手工艺虽然已成功申遗，其产品却始终打不开销路，经过民俗专家在媒体上的大力推介，终于走出了大山，市场反响很好"},"answer":"B","explanation":"第一步：找出定义关键词。\n“因自然灾害或其他无法抗拒的因素而造成产品大量积压”、“购买方按照不低于甚至略高于批发价或市场价的方式购买这些产品”、“以帮助生产者渡过难关”。\n第二步：逐一分析选项。\nA项：该选项中的企业是为了保障生产的正常运行而主动提出加价，没有体现出生产者因自然灾害或其他无法抗拒的因素而造成产品大量积压，也不符合“以帮助生产者渡过难关”，不符合定义，排除；\nB项：连日暴雨引发山洪，符合“因自然灾害或其他无法抗拒的因素”，数十亩，符合“造成产品大量积压”，对口帮扶城市以市场价收购了瓜农的全部西瓜，符合“购买方按照不低于甚至略高于批发价或市场价的方式购买这些产品”和“以帮助生产者渡过难关”，符合定义，当选；\nC项：南方某地水果大丰收，造成大量积压，“大丰收”不符合“因自然灾害或其他无法抗拒的因素”，且该选项也没有体现出“购买方按照不低于甚至略高于批发价或市场价的方式购买这些产品”，不符合定义，排除；\nD项：某少数民族的传统手工艺产品打不开销路，没有体现出“因自然灾害或其他无法抗拒的因素而造成产品大量积压”，不符合定义，排除。\n故正确答案为B。","no":110,"missingImage":false},{"qid":"2367837","cat":"定义判断","stem":"粉丝滤镜效应：指年轻人看待自己崇拜的对象时，自动过滤其缺点、过度放大其优点的心理现象。\n下列属于粉丝滤镜效应的是","options":{"A":"小李爱看战争剧，不管什么影片只要里面有枪有炮有军队，就会想方设法找过来从头到尾看一遍","B":"五岁的小刚很喜欢自己的父亲，在他眼里，父亲就是一个无所不能、顶天立地的超人","C":"某著名艺人在国外吸毒被捕的消息传开后，粉丝们在微博上为他找出了五花八门的理由开脱","D":"某老师在“百家讲坛”举办过多次讲座，他的课堂总是座无虚席，挤满了从各个学院跑来蹭课的学生"},"answer":"C","explanation":"第一步：找出定义关键词。\n“年轻人看待自己崇拜的对象时”、“自动过滤其缺点、过度放大其优点的心理现象”。\n第二步：逐一分析选项。\nA项：小李爱看战争剧，喜欢找有关于枪、炮、军队的影片来看，该行为未体现出小李的崇拜对象，且没有体现出“自动过滤其缺点、过度放大其优点的心理现象”，不符合定义，排除； \nB项：五岁的小刚，这个年龄属于“幼儿期”，而不属于“年轻人”，不符合“年轻人看待自己崇拜的对象时”，不符合定义，排除；\nC项：某著名艺人在国外吸毒被捕，粉丝们为他找出了五花八门的理由开脱，由“粉丝们”可知为其开脱的都是崇拜该明星的人，粉丝们为他找出了五花八门的理由开脱，符合“自动过滤其缺点、过度放大其优点的心理现象”，符合定义，当选；\nD项：某老师的课堂座无虚席，挤满了从各个学院跑来蹭课的学生，该选项没有体现“自动过滤其缺点、过度放大其优点的心理现象”，不符合定义，排除。\n故正确答案为C。","no":111,"missingImage":false},{"qid":"2367838","cat":"定义判断","stem":"差异化竞争：指同一行业的多家企业在短期的激烈竞争中，采用灵活多变的个性化手段，树立良好企业形象，赢得市场的经营方式。\n下列属于差异化竞争的是：","options":{"A":"春节期间，几大网络短视频平台纷纷推出抢红包活动，你发五亿，他发八亿，竞争到了白热化的程度","B":"在其他房地产开发商纷纷降价促销的状况下，某楼盘提升楼盘品质，引进名校资源，销量遥遥领先于同期其他楼盘","C":"每到逢年过节的时候，市区的几家大型电器商场都会推出赠送小家电、延长保修期等优惠活动，市民们往往等到这时集中采购","D":"在实体书店普遍不景气的大环境下，位于繁华街区的某书店一直保持自身的市场定位，致力于销售高品位的专业图书，成为了当地的文化地标"},"answer":"B","explanation":"第一步：找出定义关键词。\n“同一行业企业”、“短期竞争”、“个性化手段”、“赢得市场”。\n第二步：逐一分析选项。\nA项：春节期间短视频平台符合“同一行业企业”、“短期竞争”，但是纷纷推出抢红包活动没有体现“个性化手段”，不符合定义，排除；\nB项：房地产开发商符合“同一行业企业”，其他房地产开发商降价促销，某楼盘提升楼盘品质，引进名校资源销量高于其他楼盘，符合“个性化手段”、“赢得市场”，符合定义，当选；\nC项：几家大型电器商场符合“同一行业企业”，过年期间符合“短期竞争”，赠送小家电、延长保修期等优惠活动没有体现出“个性化手段”，不符合定义，排除；\nD项：某书店定位销售高品位的专业图书符合“个性化手段”，实体书店普遍不景气的大环境说明是长期状态且没有体现竞争，不符合“短期竞争”，不符合定义，排除。\n故正确答案为B。","no":112,"missingImage":false},{"qid":"2367839","cat":"定义判断","stem":"互联网公益：指民间团体或企业通过网络平台，发动社会公众参与的具有门槛低、透明度高、互动性强等特点的公益活动。\n下列属于互联网公益的是：","options":{"A":"某公司每年拨出专款开展公益活动，在官网上征集白内障患者并向符合特定条件的患者提供全部医疗费用","B":"得知老张遭遇车祸，他的老同学通过班级群、朋友圈很快募集了三万多元捐款全部转交到他家","C":"某爱心服务站每年开学前在自己的主页上公布来自各界的网络捐款账目，并邀请部分捐款人一起把善款送到山区小学","D":"某村委会通过网络平台发起“一帮一”捐资助学活动，帮助本村特困家庭的大学生解决了学费问题"},"answer":"C","explanation":"第一步：找出定义关键词。\n“民间团体或企业”、“通过网络平台”、“公众参与”、“门槛低、透明度高、互动性强公益活动”。\n第二步：逐一分析选项。\nA项：某公司符合“民间团体或企业”，在官网符合“通过网络平台”，并向符合特定条件的患者提供全部医疗费用，不符合“门槛低、透明度高、互动性强公益活动”，不符合定义，排除；\nB项：通过班级群、朋友圈募集捐款符合“通过网络平台”，但其同学是发起人不符合“民间团体或企业”，不符合定义，排除；\nC项：爱心服务站符合“民间团体或企业”，网络捐款账目符合“通过网络平台”，邀请部分捐款人一起把善款送到山区小学说明活动互动性强，符合定义，当选；\nD项：通过网络平台捐资助学符合“通过网络平台”，但村委会不符合“民间团体或企业”，不符合定义，排除。\n故正确答案为C。","no":113,"missingImage":false},{"qid":"2367845","cat":"逻辑判断","stem":"N后置编码：指按照下列规则对一个符号串进行处理得到一个新符号串，N表示一个数字。\n（1）确认初始符号串中每个符号的顺序位置；\n（2）将初始符号串的第一个符号跳过其后面的一个符号放置，得到一个新符号串；\n（3）在新符号串中，将初始符号串的第二个符号跳过其后面的两个符号放置，······，依此类推，直到将初始符号串的第N个符号跳过其后面N个符号放置（数到最后一个符号再接着从头数起）。\n初始符号串\u003cimg data-k=\"5c465af27079\" style=\"max-width:237px\">的“4后置编码”是：","options":{"A":"\u003cimg data-k=\"ff433a047860\" style=\"max-width:235px\">","B":"\u003cimg data-k=\"b83e9dc08c86\" style=\"max-width:247px\">","C":"\u003cimg data-k=\"d6be0e6a3351\" style=\"max-width:240px\">","D":"\u003cimg data-k=\"56301db6bb78\" style=\"max-width:253px\">"},"answer":"A","explanation":"4后置编码\n（1）初始符号为1号位车、2号位马、3号位象、4号位士、5号位炮、6号位兵，即 \u003cimg data-k=\"e721c7523706\" style=\"max-width:222px\">；\n（2）将初始符号中第一号位“车”跳过其后面的的一个符号放置，放在“马”后，得到新符号串1号位马、2号位车、3号位象、4号位士、5号位炮、6号位兵，即 \u003cimg data-k=\"10a48ca9c717\" style=\"max-width:78px\">\u003cimg data-k=\"2e8675b99646\" style=\"max-width:155px\"> ；\n（3）将初始符号中第二号位“马”，在得到的新符号串（2）中跳过其后面的两个符号放置，得到1号位车、2号位象、3号位马、4号位士、5号位炮、6号位兵，即\u003cimg data-k=\"0ed25e325d86\" style=\"max-width:36px\">\u003cimg data-k=\"f59eee547b13\" style=\"max-width:75px\">\u003cimg data-k=\"a4dc7619536a\" style=\"max-width:111px\">   ；\n（4）将初始符号中第三号位“象”，在得到的新符号串（3）中跳过其后面的三个符号放置，得到1号位车、2号位马、3号位士、4号位炮、5号位象、6号位兵，即  \u003cimg data-k=\"be1136665130\" style=\"max-width:77px\">\u003cimg data-k=\"6380ef8c047b\" style=\"max-width:72px\">\u003cimg data-k=\"958a224ac0c7\" style=\"max-width:75px\"> ；\n（5）将初始符号中第四号位“士”，在得到的新符号串（4）中跳过其后面的四个符号放置，题干提示数到最后一个符号再接着从头数起，得到1号位车、2号位士、3号位马、4号位炮、5号位象、6号位兵，即 \u003cimg data-k=\"26866492186c\" style=\"max-width:226px\">。\n故正确答案为A。","no":114,"missingImage":false}]}],"count":50,"answerable":50,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2018年国家统计局组织开展了第二次全国时间利用的随机抽样调查，共调查48580人。结果显示，受访居民在一天的活动中，有酬劳动平均用时4小时24分钟。其中，男性5小时15分钟，女性3小时35分钟；城镇居民3小时59分钟，农村居民5小时1分钟；工作日4小时50分钟，休息日3小时19分钟。受访居民有酬劳动的参与率为\u003cimg data-k=\"74cf63505124\">\u003cimg data-k=\"86981204eabb\">，其中城镇居民\u003cimg data-k=\"fc7875dd7ffb\">\u003cimg data-k=\"86981204eabb\">。受访居民无酬劳动平均用时2小时42分钟。其中，女性3小时48分钟；农村居民2小时39分钟；工作日2小时34分钟。受访居民无酬劳动的参与率为\u003cimg data-k=\"323c08e9e514
