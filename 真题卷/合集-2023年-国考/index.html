优秀传统文化”后文并未提及，无中生有，与后文衔接不当，排除；\nC项，“文化自信”后文并未提及，无中生有，与后文衔接不当，排除。\n故正确答案为D。\n【文段出处】《求是网评论员：坚持和发展马克思主义必须做好“两个结合”》","no":45,"missingImage":false},{"type":"question","qid":"5445703","cat":"片段阅读","stem":"肺鱼是一类可用“肺”呼吸的肉鳍鱼，它们的“肺”是特化的鱼鳔，能吸收空气。这一特殊技能使其可以摆脱水的束缚，在河水干涸时潜入洞穴，躲在分泌物形成的茧中，等待雨季到来。此外，肺鱼还是能“啃硬骨头”的鱼，它们咬合力强大，一些带壳的无脊椎动物也是其捕食对象，这种能吃带壳动物的能力，被称为食壳性或甲食性。泥盆纪早期的奇异鱼被认为是最原始的肺鱼，已经具有典型的肺鱼食壳性特征，比如有发达的齿板与短而粗壮的下颌。而杨氏鱼的系统发育位置较奇异鱼更为原始，是研究肺鱼类食壳性起源的关键。\n这段文字接下来最可能介绍：","options":{"A":"关于杨氏鱼的最新研究成果","B":"动物食壳性特征的产生原因","C":"肺鱼在生物演化史上的重要意义","D":"杨氏鱼与其他泥盆纪物种的区别"},"answer":"A","explanation":"根据提问方式可知，本题为接语选择题。文段开篇介绍肺鱼是可用“肺”呼吸的肉鳍鱼，接着介绍肺鱼这一特殊技能在河水干涸时的作用，后文介绍肺鱼的咬合力强大，具有吃带壳动物的能力，并介绍此种能力被称为食壳性或甲食性，接着指出奇异鱼被认为是最原始的肺鱼，其已经具有食壳性特征，尾句强调杨氏鱼较奇异鱼更为原始，是研究肺鱼类食壳性起源的关键。故后文应继续围绕“杨氏鱼”这一话题展开论述，介绍“杨氏鱼”的相关研究，对应A项。\nB项，“动物食壳性特征”范围扩大，与文段最后讨论的核心话题不一致，无法与文段衔接，排除；\nC项，“生物演化史”与文段最后讨论的核心话题不一致，无法与文段衔接，排除；\nD项，“其他泥盆纪物种”属于无中生有的内容，无法与文段衔接，排除。\n故正确答案为A。\n【文段出处】《这种用“肺”呼吸的鱼，吃肉不吐壳》","no":46,"missingImage":false},{"type":"question","qid":"5445707","cat":"片段阅读","stem":"我国在改革开放后逐渐认识到保护民间文学艺术作品的重要性，并在1990年著作权法规定保护办法另行规定。但时隔三十余年，保护办法仍未出台。尽管如此，在著作权法颁布后，学界就民间文学艺术作品法律保护展开研究讨论，提出多种保护方案，涉及权利客体、权利主体、权利内容、保护期限、权利限制等方面的问题。当然，也有个别学者反对用著作权法保护民间文学艺术作品，主张通过公法加以保护。与此同时，国家版权局也加快推进相关立法，但因质疑声音过大而夭折。\n作者可能赞同下列哪一观点？","options":{"A":"通过公法保护民间文学艺术作品是最可行的路径","B":"围绕民间文学艺术作品法律保护的争议流于表面","C":"国家版权局应就民间文学保护倾听多方面意见","D":"民间文学艺术作品法律保护缺位状态亟须改变"},"answer":"D","explanation":"文段开篇指出我国认识到保护民间文学艺术作品的重要性，并在著作权法中规定对保护办法另行规定。随后通过“但”表转折，指出当前民间文学艺术作品的保护办法仍然没有出台。接着介绍著作权法颁布后，学界针对民间文学艺术作品法律保护曾提出多种保护方案，涉及多方面问题，并指出个别学者主张通过公法加以保护。最后通过“与此同时”表示并列，介绍国家版权局也加快推进相关立法，但因受到强烈质疑而夭折。整个文段都是围绕民间文学艺术作品法律保护缺失这一问题展开论述，意在强调当前亟须出台民间文学艺术作品的保护法，对应D项。\nA项，“通过公法保护民间文学艺术作品”仅为个别学者的观点，“最可行”表述过于绝对，排除；\nB项，文段指出学界就民间文学艺术作品法律保护展开的研究讨论涉及多方面问题，“流于表面”与文意相悖，排除；\nC项，仅对应“与此同时”之后的内容，表述片面，且文段指出国家版权局的立法工作因受到质疑而夭折，并非没有“倾听多方面意见”，排除。\n故正确答案为D。\n【文段出处】《中国特色民间文学艺术作品著作权保护理论的构建》","no":47,"missingImage":false},{"type":"question","qid":"5445711","cat":"片段阅读","stem":"传统X射线在对抗癌细胞时，无法主动辨别正常细胞和癌细胞，在进入人体后实施无差别杀伤。与之不同，重离子束在穿越生物组织的过程中，不会在沿途不断地释放能量，而会在某个深度形成一个剂量高峰，科学界称之为“布拉格峰”。也就是说，在穿透过程中，重离子束只是路过，并不施加伤害；当它到达癌细胞时，才开始杀敌。这样，正常细胞终于可以不再被误伤，这有利于保护正常组织和关键器官。\n根据这段文字，与传统射线相比，重离子束：","options":{"A":"堪称“蒙面杀手”","B":"采用“游击战术”","C":"具有更强的“穿透力”","D":"能精确“区分敌我”"},"answer":"D","explanation":"A项，文段并未提及“重离子束”在杀伤癌细胞时会隐蔽自身，“蒙面杀手”无中生有，排除；\nB项，文段并未提及“重离子束”在杀伤癌细胞时采用的具体方式，“游击战术”无中生有，排除；\nC项，文段并未提及“重离子束”的穿透力，更无比较，“更强的‘穿透力’”无中生有，排除；\nD项，根据“也就是说······正常细胞终于可以不再被误伤，这有利于保护正常组织和关键器官”可知，“重离子束”可以精准分辨正常细胞和癌细胞，“区分敌我”表述正确，当选。\n故正确答案为D。\n【文段出处】人民网《重离子束：打败癌细胞的新一代“杀手”》","no":48,"missingImage":false},{"type":"question","qid":"5445690","cat":"片段阅读","stem":"传统成像技术都是对视域内的物体进行观测，非视域成像技术则能够对隐藏在视线外的物体进行拍照，实现“视线拐弯”“隔墙观物”，极大地拓展了人类的成像能力。这一技术的实现过程通常是将激光脉冲发射到中介墙上，利用中介墙使激光散射到被遮挡的非视域场景中，该场景中的隐藏物体再次将激光散射到中介墙上，最终由中介墙散射至接收系统，整个过程激光经历了3次漫反射，通过记录光量子的飞行时间实现对非视域场景的重构。然而，由于激光经过多次漫反射，整个光路存在巨大的衰减，使得非视域成像目前仅能在实验室内进行短距离的原理性验证。此外，多次漫反射导致的时空信息混杂，使得成像算法成为一个科研难题。\n关于非视域成像技术，这段文字未提及：","options":{"A":"基本原理","B":"突出优势","C":"应用前景","D":"技术难题"},"answer":"C","explanation":"A项，根据“这一技术的实现过程通常是将激光脉冲发射到中介墙上，利用中介墙使激光散射到被遮挡的非视域场景中，该场景中的隐藏物体再次将激光散射到中介墙上，最终由中介墙散射至接收系统，整个过程激光经历了3次漫反射，通过记录光量子的飞行时间实现对非视域场景的重构”可知，“基本原理”已提及，排除；\nB项，根据“非视域成像技术则能够对隐藏在视线外的物体进行拍照，实现‘视线拐弯’‘隔墙观物’，极大地拓展了人类的成像能力”可知，“突出优势”已提及，排除；\nC项，文段并未提及“应用前景”，当选；\nD项，根据“由于激光经过多次漫反射，整个光路存在巨大的衰减，使得非视域成像目前仅能在实验室内进行短距离的原理性验证。此外，多次漫反射导致的时空信息混杂，使得成像算法成为一个科研难题”可知，“技术难题”已提及，排除。\n本题为选非题，故正确答案为C。\n【文段出处】中国航空报《中国科学家实现远距离非视域成像》","no":49,"missingImage":false},{"type":"question","qid":"5445694","cat":"语句表达","stem":"事实推定是指法官在确证基础事实之上，借助经验法则推定待证事实的一种司法认知方法，这实际上是法官价值判断的过程。受个人经验、情感、家庭背景等因素的影响，法官进行价值判断时可能具有个体特征。价值判断联通了基础事实与推定事实，对各类事实所作的价值判断不同，得出的判决结论也将不同。因此，                    。\n填入画横线部分最恰当的一项是：","options":{"A":"对事实推定价值判断的说理可提升判决的可接受性","B":"需要对事实推定中的价值判断进行规范","C":"程序正义有助于减少法官个体差异对判决的影响","D":"价值判断不仅要符合形式合理性也要及时回应社会关切"},"answer":"B","explanation":"横线在文段结尾，由“因此”可知，横线处内容应总结前文。文段开篇引出“事实推定”这一话题，指出事实推定实际上是法官价值判断的过程，会受到多种因素的影响。接着指出法官进行价值判断时可能具有个体特征，对各类事实的价值判断不同，使得最终得出的判决结论也不同，故文段重在强调，法官在事实推定的过程中，对于价值判断的不同可能会影响判决结论这一问题，故尾句可针对这一问题提出对策，对应B项。\nA项，“对事实推定价值判断的说理”文段未提及，无法衔接上文，排除；\nC项，缺少核心话题“事实推定”，文段重在讨论事实的重要性，“程序正义”文段未提及，无中生有，排除；\nD项，缺少核心话题“事实推定”，且“要符合形式合理性也要及时回应社会关切”文段未提及，无法衔接上文，排除。\n故正确答案为B。\n【文段出处】《规范裁判文书对事实推定的价值判断说理》","no":50,"missingImage":false},{"type":"question","qid":"5445695","cat":"语句表达","stem":"①同样，市场规模更大的企业将能够更好地摊薄其供应链成本，从而在低毛利环境中生存下来，打败竞争对手\n②有些生鲜平台称呼其商业模式为“自来水模式”，立志要让好的食材像自来水一样，触手可得\n③在互联网领域，生鲜电商能否盈利不是问题，谁能成为最后的赢家才是问题\n④由于生鲜电商平台具备很强的消费者粘性，先占据更多核心区消费者的企业便能获得先发优势，后进入者往往需要付出更高的获客成本\n⑤这种现象在经济学上被称作“自然垄断”，即某些产品和服务由单个企业大规模生产经营比多个企业同时生产经营更有效率\n⑥而“自来水行业”便是自然垄断最普遍出现的行业\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②⑤⑥①④③","B":"②④⑤①③⑥","C":"④①⑤②⑥③","D":"④⑤③①②⑥"},"answer":"C","explanation":"对比选项，确定首句。②句指出有些生鲜平台的商业模式为“自来水模式”，④句指出消费者对生鲜电商平台非常重要，均可作首句。\n继续观察文段，①句出现“同样”，表示并列关系，可寻找捆绑关系，①句指出市场规模更大的企业能够减少成本，从而打败竞争对手，故前文应介绍企业在竞争中能够成为赢家的其他优势。结合选项分析，①句前分别是③④⑤⑥四句，④句指出拥有更多消费者的企业能获得先发优势，故④①两句均介绍了企业能够打败竞争对手、成为赢家的优势，可构成并列关系，而③句指出生鲜电商面临的问题，⑤句介绍了“自然垄断”这一概念，⑥句介绍了自然垄断最普遍出现的行业是“自来水行业”，均无法和①句构成捆绑，排除A、B、D三项，锁定C项。\n故正确答案为C。\n【文段出处】《谁是赢家？生鲜电商的崛起》","no":51,"missingImage":false},{"type":"question","qid":"5445697","cat":"语句表达","stem":"①这会使病情恶化，并最终导致相关的关节功能障碍\n②大量临床及基础研究显示，软骨病理性钙化是导致骨关节病软骨退变的关键致病机制之一\n③软骨病理性钙化通过诱导软骨细胞表型改变，最终呈现出一种病理状态\n④关节软骨渐进性退变是骨关节病最主要的病理改变\n⑤这些病态的软骨细胞通过有丝分裂增加自身数量，并通过分泌炎症因子、降解软骨基质引发组织炎症，最终发生凋亡\n⑥凋亡小体在吸收钙离子后，又会成为新的病理性矿化结晶，循环往复，致使软骨退变加重、剥脱\n将以上6个句子重新排列，语序正确的是：","options":{"A":"④②③⑤⑥①","B":"④③⑤①②⑥","C":"②③⑤⑥④①","D":"②⑤④③①⑥"},"answer":"A","explanation":"对比选项，确定首句。②句指出骨关节病软骨退变的致病机制，④句通过“最主要”引出关节软骨渐进性退变这一话题，按照逻辑顺序，应先引出话题，再具体论述其致病机制，故④句更适合作为首句，排除C、D两项。\n继续对比选项，A、B两项的区别在于④句之后接②句还是③句，②句是对④句的具体论述，符合逻辑。③句围绕话题“软骨病理性钙化”展开论述，与④句话题不一致，无法衔接，排除B项。\n故正确答案为A。\n【文段出处】科技日报《导致关节软骨病理性钙化的元凶找到了》","no":52,"missingImage":false},{"type":"question","qid":"5445700","cat":"片段阅读","stem":"“高精尖”产业是辐射带动力强的产业集群，对经济具有极强的拉动作用，不仅能实现中心城市的经济高质量发展，而且能带动周边地区的产业联动转型。京津冀协同发展中，产业对接协作是区域战略的核心内容之一，产业升级是三地的共同任务，在疏解非首都核心功能的过程中，天津和河北是北京产业转移的主要承接者。然而，两地仅简单承接北京转移的一般产业是远远不够的，迫切需要发展“高精尖”产业，带动区域科技创新与成果转化，促进区域产业联动，形成经济协同发展的格局。\n这段文字意在说明：","options":{"A":"“高精尖”产业承担着高水平创新的重大使命","B":"形成“高精尖”产业是城市群建设的长远目标","C":"我国区域经济发展应以“高精尖”产业为依托","D":"“高精尖”产业对京津冀协同发展有重要意义"},"answer":"D","explanation":"文段开篇引出话题“高精尖”产业，并指出其对经济的拉动作用，能够带动周边地区的产业联动转型，接着介绍了京津冀协同发展中的区域战略和任务，并指出天津和河北是北京产业转移的主要承接者，尾句通过关联词“然而”转折，指出两地仅简单承接北京转移的一般产业是远远不够的，接着通过“迫切需要”引出对策，强调要发展“高精尖”产业，以实现京津冀地区的协同发展。故文段重点强调尾句对策，即发展“高精尖”产业对实现京津冀地区协同发展的重要性，对应D项。\nA项，强调“高精尖”产业对高水平创新的重要性，缺少文段核心话题“京津冀协同发展”，排除；\nB项，“城市群建设的长远目标”文段并未提及，无中生有，且“城市群建设”范围扩大，文段重点讨论“京津冀”地区，排除；\nC项，强调我国应如何发展区域经济，文段讨论的话题是如何实现“京津冀”地区的协同发展，表述不够准确，排除。\n故正确答案为D。\n【文段出处】中国共产党新闻网《贾品荣：创新驱动“高精尖”产业发展》","no":53,"missingImage":false},{"type":"question","qid":"5445702","cat":"片段阅读","stem":"要推动老旧小区的适老化改造和无障碍环境建设，关键是提升整个社会对适老化改造的思想认识，实现适老化改造特别是居家适老化改造“心理无障碍”。要多渠道、全方位宣传引导居家适老化改造的政策与价值，转变老人、子女和社会对居家适老化改造的认知；同时，要通过养老服务中心、居家养老服务中心等载体，打造居家适老化改造样板房，强化直观感受，转变老人的传统观念，让老人逐步形成“为养老服务买单”、让子女形成更加关注父母居家养老环境的社会意识，提升适老化改造的家庭主观能动性。\n这段文字强调要：","options":{"A":"平衡主体利益，因地制宜推动适老化改造","B":"统筹各方资源，激活适老化改造的多元力量","C":"补位标准规范，提升适老化改造的品质与效率","D":"加强宣传引导，做到适老化改造“心理无障碍”"},"answer":"D","explanation":"文段开篇通过“要······关键是”提出对策，强调提升整个社会对适老化改造的思想认识，对实现适老化改造特别是居家适老化改造“心理无障碍”的重要性，接着围绕这一对策论述其具体措施，首先要通过多渠道、全方位宣传引导转变老人、子女和社会对居家适老化改造的认知，然后通过并列关联词“同时”引出另一方面提升适老化改造思想认识的具体措施，即通过多种载体打造居家适老化改造样板房，转变老人的传统观念，提升适老化改造的家庭主观能动性，故整个文段重在强调通过宣传和引导的方式实现适老化改造“心理无障碍”，对应D项。\nA项，“因地制宜推动适老化改造”文段并未提及，无中生有，排除；\nB项，文段强调要实现适老化改造“心理无障碍”，选项“激活适老化改造的多元力量”偏离文段讨论的核心重点，排除；\nC项，“补位标准规范”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】《改造只是起步 更多适老化堵点有待打通》","no":54,"missingImage":false},{"type":"question","qid":"5445721","cat":"片段阅读","stem":"科学家早就知道月球有两面：面向地球的一面较为平坦，背向地球的一面凹凸不平，遍布撞击坑，月球为何具有截然不同的两副面孔，是其众多谜团之一。近日，科学家提出一种全新解释：数十亿年前，形成月球背面盆地的巨大撞击，产生了足以传遍月球的巨大热量，促成月幔物质的熔化，其中的稀土和放射性生热元素钍以及钾、磷等被携带到与撞击区域对称的月面，形成克里普岩，分布在月球正面风暴洋及其周围，放射性生热元素的集中，产生了月球表面的熔岩流，最终形成月球正面的火山平原。\n最适合做这段文字标题的是：","options":{"A":"盆地与平原：两副面孔，两种材质","B":"月球上的熔岩流：亟待开发的宝藏","C":"双面月球：一次撞击，两种结局","D":"放射性生热元素：月球的化妆师"},"answer":"C","explanation":"文段开头提出问题，即月球为何有两副面孔，接下来给出解释说明，详细分析了撞击过后月球背面盆地与正面火山平原是如何形成的。故文段通过后文对撞击的分析解释月球正反两面截然不同的原因，对应C项。\nA项，未提及“月球”，且根据文意可知，月球正反面并非“两种材质”，排除；\nB项，熔岩流属于后文解释部分的内容，且文段未论述其价值，无中生有，排除；\nD项，“放射性生热元素”属于后文解释部分的内容，且文段主要回答“月球为何有两幅面孔”这一问题，非重点，排除。\n故正确答案为C。\n【文段出处】《双面月球：一次巨大撞击的两种结局》","no":55,"missingImage":false},{"type":"question","qid":"5445724","cat":"片段阅读","stem":"生态修复请求分为生态修复的行为请求和费用请求，前者是为了防止生态环境权益损害的发生或扩大，请求责任人停止污染破坏行为；当被破坏的生态环境无法恢复时，请求责任人进行人工修复。如果责任人不具有修复能力或意愿，可请求责任人承担修复费用。因此，修复行为请求应作为首要诉求，在责任人不能或不愿进行修复时，才能提出修复费用请求。在司法实践中，很多公益诉讼人却往往将修复费用请求作为首要诉求，但由于诉求和判决的修复费用数额不易确定，责任主体短期内难以承担修复费用，生态修复工作很难有效开展。\n这段文字意在说明：","options":{"A":"应该制定生态修复费用的分级标准","B":"修复费用请求往往很难得到有效落实","C":"应根据责任人的能力确定生态修复诉求","D":"生态修复诉讼应当首先提出修复行为请求"},"answer":"D","explanation":"文段开篇指出生态修复请求分为“行为请求”与“费用请求”两种，然后围绕“行为请求”进行介绍，并说明“如果责任人不具有修复能力或意愿，可请求责任人承担修复费用”。接着通过结论标志词“因此”对前文进行总结，提出观点，即修复行为请求应排在修复费用请求之前，来作为生态修复的首要诉求。尾句通过阐述将修复费用请求作为首要诉求时很难有效开展工作这一现状，站在反面的角度论证前文观点。故文段重在强调生态修复的“修复行为请求应作为首要诉求”，对应D项。\nA项，“制定生态修复费用的分级标准”文段未提及，无中生有，排除；\nB项，“修复费用请求往往很难得到有效落实”对应文段尾句，为反面论证内容，非文段重点，排除；\nC项，文段重在强调“生态修复行为请求”，“责任人的能力”偏离文段重点，排除。\n故正确答案为D。\n【文段出处】《生态修复责任在环境公益诉讼中的实现路径》","no":56,"missingImage":false},{"type":"question","qid":"5445728","cat":"片段阅读","stem":"在银河系中，恒星形成于巨型分子云的引力塌缩。而塌缩的残留物会围绕着新生的恒星转动，形成一个富含尘埃的气体盘，称为“原行星盘”。在年轻恒星中，周围存在原行星盘的比例会随恒星年龄增长而下降，存在的时长中值约为200万～300万年。然而，正是通过原行星盘获得气体及所需物质，许多行星才能在这短短几百万年内大致演化成型。对于类似地球的其他行星而言，经历了原行星盘阶段，早期物质至少演化成了行星胚胎，并在原行星盘消散后经历进一步的碰撞和演化，最终形成现在的类地行星。\n根据这段文字，下列说法正确的是：","options":{"A":"恒星和原行星盘的存在时间大致相同","B":"原行星盘是类地行星形成中的必经阶段","C":"巨型分子云引力塌缩后随即形成行星和恒星","D":"行星在运动中不断从原行星盘中获取所需物质"},"answer":"B","explanation":"A项，根据“而塌缩的残留物会围绕着新生的恒星转动，形成一个富含尘埃的气体盘，称为‘原行星盘’”可知，原行星盘形成的时间晚于恒星，“存在时间大致相同”表述错误，排除；\nB项，根据“对于类似地球的其他行星而言，经历了原行星盘阶段，早期物质至少演化成了行星胚胎，并在原行星盘消散后经历进一步的碰撞和演化，最终形成现在的类地行星”可知，形成类地行星要经过原行星盘阶段，表述正确，当选；\nC项，根据“恒星形成于巨型分子云的引力塌缩。而塌缩的残留物会围绕着新生的恒星转动，形成一个富含尘埃的气体盘，称为‘原行星盘’”可知，“形成行星”文段未提及，无中生有，排除；\nD项，根据“正是通过原行星盘获得气体及所需物质，许多行星才能在这短短几百万年内大致演化成型”可知，文段并未表明行星是在运动中不断获取物质，“在运动中”文段未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】微信公众号《用磁场重现太阳星云演化》","no":57,"missingImage":false},{"type":"question","qid":"5445732","cat":"片段阅读","stem":"从“市场体系”到“统一市场”再到“全国统一大市场”，实际就是从建设市场到建设一体化市场，再到建设大市场和强市场。我们的市场人均收入和消费水平低，虽然人口多，但是市场呈现为行政分割状态，因此只是潜在规模大，实际规模并不具有竞争优势。对此，除了要通过深化改革，释放生产力、提升工资水平、分好国民收入这块蛋糕，还要处理好两个重要问题：一是大力纠正导致市场分割的因素；二是加快资本市场化建设，提高财产性收入比重。这是在扩大工资占比条件受限的前提下，迅速做大做强市场的关键。\n这段文字针对的主要问题是：","options":{"A":"行政区域分割和非一体化抑制了有效竞争","B":"财产性收入在国民收入中的比重还比较低","C":"我国市场潜在规模优势还未转化为现实优势","D":"消费需求疲软阻碍了全国统一大市场的形成"},"answer":"C","explanation":"文段首先指出从“市场体系”到“统一市场”再到“全国统一大市场”的实质，接着指出问题，强调我们的市场潜在规模大，但实际规模并不具有竞争优势，后文给出对策，具体介绍如何做大做强市场。由此可知，文段针对的主要问题是我们的市场潜在规模大而实际并不具有竞争优势，同义替换对应C项。\nA项，“行政区域分割”是导致问题的原因之一，“非一体化”无中生有，排除；\nB项，“财产性收入比重比较低”无中生有，且并非文段重点强调的问题，排除；\nD项，“消费需求疲软”无中生有，排除。\n故正确答案为C。\n【文段出处】学习时报《刘志彪：塑造“有效市场+有为政府”的全国统一大市场》","no":58,"missingImage":false},{"type":"question","qid":"5445734","cat":"片段阅读","stem":"颠覆性技术在军事领域的应用，使现代空袭作战向陆、海、空、天、电、网等领域发展。电子战飞机、预警指挥机在现代空袭体系中的作用愈发重要；第四代隐身飞机投入实战大大增强了空袭体系的突防能力；空射导弹等精确制导弹药智能化水平、抗干扰能力和目标识别能力增强，作战效能大大提高。未来将进一步提高精确制导弹药的命中精度，空袭体系的精确打击能力将进一步增强。同时，运用小型或超小型无人机，在战场上对重要目标实施“蜂群”式打击，会给重要目标的防护造成很大困难。\n这段文字意在说明：","options":{"A":"颠覆性技术提高了空袭作战的综合打击能力","B":"军事领域的颠覆性技术研究取得突破性进展","C":"精确打击能力的增强提升了空袭作战的效能","D":"智能化时代的空中防御体系面临着空前挑战"},"answer":"D","explanation":"文段开篇交待背景，即颠覆性技术使现代空袭作战领域得以发展，接着通过两个“；”引导三方面并列，说明现代空袭领域作战效能大大提高，后文通过并列关联词“同时”，指出小型或超小型无人机会给重要目标的防护造成很大困难。故该文段为并列结构，强调现代军事空袭领域作战时打击能力增强，也就意味着现代空中防御体系面临巨大挑战，对应D项。\nA项，“颠覆性技术”仅对应文段交待背景部分的内容，非重点，排除；\nB项，缺少文段核心话题“空中”，排除；\nC项，“精确打击能力”仅对应文段中“导弹”部分的内容，表述片面，排除。\n故正确答案为D。\n【文段出处】《现代防空面临“空袭之变”》","no":59,"missingImage":false},{"type":"question","qid":"5445737","cat":"语句表达","stem":"立案登记制改革的初衷是保护当事人依法享有的诉权，所谓“有案必立、有诉必理”，只是指那些符合法律规定立案条件的案件，起诉到人民法院后，法院必须立案，否则法院就没有必要受理。所以，                    ，对此，可能有人认为，设立立案标准等于为立案设置了门槛，很难保障当事人通过诉讼解决纠纷的权利。其实任何权利都有限度，不存在没有边界的权利，当事人通过诉讼解决纠纷的权利同样如此。只有符合立案标准，这种权利才能通过法院诉讼得以实现。\n填入画横线部分最恰当的一项是：","options":{"A":"推行立案登记制并不意味着“是案就立”","B":"不能将“立案难”与司法公正简单关联起来","C":"明确立案标准才能保障当事人的合法权益","D":"应正确理解司法资源作为公共产品的有限性"},"answer":"C","explanation":"横线位于文段中间，需结合上下文语境进行分析。文段开头引出话题“立案登记制改革”并介绍其初衷，即“有案必立、有诉必理”，并指出针对符合法律规定立案条件的案件法院必须立案。横线后指出设立立案标准很难保障当事人的权利，尾句通过“只有······才”对“立案标准”和“当事人权利”展开论述。因此，横线处所填句子应围绕“立案标准”和“当事人权利”展开论述，C项与前后文连接紧密，当选。\nA项，缺少“当事人权利”的话题，且“立案登记制”非文段核心话题，排除；\nB项“司法公正”、D项“司法资源的有限性”文段均未提及，与文段话题不一致，排除。\n故正确答案为C。\n【文段出处】《最高法院：多措并举切实保障诉权》","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"5445717","cat":"数学运算","stem":"一项工作甲独立完成需要3小时，乙独立完成的用时比其与甲合作完成多4小时，且乙和丙合作完成需要4小时。问丙独立完成需要多少小时？","options":{"A":"10","B":"12","C":"6","D":"8"},"answer":"B","explanation":"赋值工作总量为12，则甲的效率为\u003cimg data-k=\"12e46ad3f574\">，乙、丙合作的效率为\u003cimg data-k=\"bb72aef9e41b\">。设乙的效率为x，根据“乙独立完成的用时比其与甲合作完成多4小时”，可得：\u003cimg data-k=\"6d01e969d52b\">，解得：x=2，即乙的效率为2，则丙的效率为3-2=1。因此，丙独立完成需要\u003cimg data-k=\"0c28cf008977\">小时。\n故正确答案为B。","no":61,"missingImage":false},{"type":"question","qid":"5445739","cat":"数学运算","stem":"在一块正方形土地中，画一条经过某个顶点的规划线，将其分割为三角形和梯形两块土地，且梯形土地的面积正好是三角形土地的2倍。问三角形和梯形土地的周长之比是多少？","options":{"A":"1：2","B":"5：7","C":"\u003cimg data-k=\"be693f01f3af\">","D":"\u003cimg data-k=\"18cc585fbaf5\">"},"answer":"D","explanation":"\u003cimg data-k=\"02eb6d16df42\" style=\"max-width:245px\">\n赋值正方形土地的边长为3，根据题意，梯形土地的面积正好是三角形土地的2倍，则正方形土地的面积是三角形土地的3倍，设三角形土地BE边长为x，则\u003cimg data-k=\"c841c9dd219e\">\u003cimg data-k=\"7cb7a70345b9\">，代入数据得\u003cimg data-k=\"f6ea98218c55\">\u003cimg data-k=\"96a18023de84\">，解得x=2，则ED=BD-BE=3-2=1。根据勾股定理，\u003cimg data-k=\"1043cd1faacc\">\u003cimg data-k=\"15c4aec4ed54\">，则三角形土地的周长\u003cimg data-k=\"5950cc1487ce\">\u003cimg data-k=\"3b445064a4f2\">，梯形土地的周长\u003cimg data-k=\"c2302620f84e\">\u003cimg data-k=\"e17a95f6574f\">，故三角形和梯形土地的周长之比为\u003cimg data-k=\"18cc585fbaf5\">。\n故正确答案为D。","no":62,"missingImage":false},{"type":"question","qid":"5445722","cat":"数学运算","stem":"已知A、B两种设备定价相同，C设备单价为8000元/台。现A、B两种设备分别打六折、七折促销，购买1台B设备的费用比购买A、C设备各1台的总费用高2万元。问促销期间1000万元预算最多可以购买多少台A设备？","options":{"A":"35","B":"51","C":"59","D":"77"},"answer":"C","explanation":"设A、B两种设备每台定价均为x万元，则促销期间A设备单价为0.6x万元，B设备为0.7x万元。8000元=0.8万元，根据题意，可列方程：0.7x=0.6x+0.8+2，解得x=28，则促销期间A设备单价为28×0.6=16.8万元。促销期间1000万元可以购买\u003cimg data-k=\"faf1afc96578\">台A设备，则最多可以购买59台A设备。\n故正确答案为C。","no":63,"missingImage":false},{"type":"question","qid":"5445725","cat":"数学运算","stem":"某单位有甲和乙2个办公室，分别有职工5人和4人。每周从这9名职工中随机抽取1人下沉社区担任志愿者（同一人有可能被连续、重复选中）。问7月前2周的志愿者均来自甲办公室的概率在以下哪个范围内？","options":{"A":"不到25%","B":"25%~35%之间","C":"35%~45%之间","D":"超过45%"},"answer":"B","explanation":"根据题意可知，7月前2周的志愿者总情况数为\u003cimg data-k=\"bf3479173dec\">种，7月前2周的志愿者均来自甲办公室的情况数为\u003cimg data-k=\"1e5faee2dce1\">种。因此所求概率\u003cimg data-k=\"e21baa5382ca\">\u003cimg data-k=\"fef84b251841\">，在25%~35%之间。\n故正确答案为B。","no":64,"missingImage":false},{"type":"question","qid":"5445716","cat":"数学运算","stem":"公园里有一片四边形草坪，沿对角线修建的小道相交于O点，O到四个顶点A、B、C、D的距离之比正好为1：2：3：4，一名工人花费1天正好完成AOB区域的修剪，问第二天至少需要额外增加多少名效率相同的工人一起工作，才能在当天内完成剩余草坪的修剪？\n\u003cimg data-k=\"3c8936527a5d\" style=\"max-width:178px\">","options":{"A":"8","B":"10","C":"11","D":"12"},"answer":"B","explanation":"根据题意，设\u003cimg data-k=\"cc6c58aaa773\">的面积为S。因为\u003cimg data-k=\"cc6c58aaa773\">与\u003cimg data-k=\"8b219c70504d\">的高相同，底边BO：DO=2：4=1：2，根据结论“两个三角形的高相同，面积之比等于底之比”可得：\u003cimg data-k=\"66d8e655f7a1\">；同理，\u003cimg data-k=\"8b219c70504d\">与\u003cimg data-k=\"fedac096f80c\">的高相同，底边AO：CO=1：3，则\u003cimg data-k=\"b9d4c6f97490\">\u003cimg data-k=\"e79f47696ef8\">；\u003cimg data-k=\"cc6c58aaa773\">与\u003cimg data-k=\"dd07c372644c\">的高相同，底边AO：CO=1：3，则\u003cimg data-k=\"9a697329f687\">。故四边形ABCD的面积=S+2S+6S+3S=12S。根据题意可知，一名工人花费1天正好完成AOB区域的修剪，即一名工人花费1天修剪的面积为S，剩余面积为12S-S=11S，则要在第二天完成修剪至少需要11S÷S=11名效率相同的工人，故至少需要额外增加11-1=10名效率相同的工人一起工作。\n故正确答案为B。","no":65,"missingImage":false},{"type":"question","qid":"5445723","cat":"数学运算","stem":"单位将10个培训名额分配给4个分公司，要求在每个分公司至少分配1个名额的所有分配方案中，随机选择1个方案实施，问4个分公司中有3个分配名额数量相同的概率为多少？","options":{"A":"\u003cimg data-k=\"8a2daf14bb43\">","B":"\u003cimg data-k=\"90d98ef5aa66\">","C":"\u003cimg data-k=\"330f95787889\">","D":"\u003cimg data-k=\"311f5c2d861c\">"},"answer":"D","explanation":"根据题意可知，将10个相同的培训名额分配给4个不同的分公司，每个分公司至少分配1个名额，可使用插板法解题，共有\u003cimg data-k=\"9cabc17ac817\">种分配方案。\n方法一：4个分公司中有3个分公司分配到的名额数量相同，设3个分公司分配到的名额数量均为a个，另外一个分公司分配到的名额数量为b个，则3a+b=10，且\u003cimg data-k=\"2c86c2768cde\">，符合要求的情况有3大类（a=1，b=7；a=2，b=4；a=3，b=1），那么符合条件的情况数有\u003cimg data-k=\"2211b09a2594\">种，则题干所求概率为\u003cimg data-k=\"e55dab9b0305\">\u003cimg data-k=\"46c0b694a70d\">。\n方法二：根据公式：概率\u003cimg data-k=\"7e189b75f5fa\">，则题目所求概率为\u003cimg data-k=\"c752840ae820\">，即选项的分母部分为84的因子，结合选项，只有D项符合。\n故正确答案为D。","no":66,"missingImage":false},{"type":"question","qid":"5445729","cat":"数学运算","stem":"某次会议邀请4所高校每所各2位学者作报告。在某日上午、下午和晚上的三个时间段分别安排3位、3位和2位学者依次作报告，且同一所高校的2位学者不安排在同一时间段内作报告。问8人的报告次序有多少种不同的安排方式？","options":{"A":"不到5000种","B":"5000~10000种之间","C":"10001~20000种之间","D":"超过20000种"},"answer":"C","explanation":"对上午、下午和晚上的三个时间段报告次序进行分步讨论：\n第一步，上午需要从4所高校中选3所高校，每所高校各选1位学者进行排序，有\u003cimg data-k=\"2dceea9ffe5e\">种情况；\n第二步，下午需要从上午未选高校中选1位学者，再从上午已选3所高校中选2位学者进行排序，有\u003cimg data-k=\"4680845cf90a\">种情况；\n第三步，对晚上剩余的2位学者进行排序，有\u003cimg data-k=\"79ffa592ef20\">种情况。\n则这8人的报告次序共有192×36×2=13824种不同的安排方式，在C项范围内。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"5445731","cat":"数学运算","stem":"一辆汽车从甲地开往乙地，先以40千米/小时的速度匀速行驶一半的路程，然后均匀加速；行驶完剩下路程的一半时，速度达到80千米/小时；此后均匀减速，到达乙地时的速度正好降为0。问其全程的平均速度在以下哪个范围内？","options":{"A":"不到44千米/小时","B":"在44~45千米/小时之间","C":"在45~46千米/小时之间","D":"超过46千米/小时"},"answer":"A","explanation":"如下图所示，A地为甲、乙两地的中点，B地为A地、乙地的中点。由A地到B地汽车均匀加速，则该段的平均速度为\u003cimg data-k=\"04efb67930d3\">千米/小时；由B地到乙地汽车均匀减速，则该段的平均速度为\u003cimg data-k=\"3decd36ec6aa\">千米/小时。因B地为A地、乙地的中点，根据等距离平均速度公式，可得汽车从A地到乙地的平均速度为\u003cimg data-k=\"b9fcbbf7ddd4\">千米/小时；又因A地为甲、乙两地的中点，根据等距离平均速度公式，可得汽车全程的平均速度为\u003cimg data-k=\"551cc5c28c20\">千米/小时，在A项范围内。\n\u003cimg data-k=\"987465bb86e1\" style=\"max-width:584px\">\n故正确答案为A。\n注：匀变速运动的平均速度公式为\u003cimg data-k=\"b5856cdfff9b\">，等距离平均速度公式为\u003cimg data-k=\"e345668452bf\">。","no":68,"missingImage":false},{"type":"question","qid":"5445712","cat":"数学运算","stem":"甲、乙、丙三家科技企业2021年的收入之和比2020年提升了20%。其中甲企业的收入上升了400万元，乙企业的收入下降了100万元且是甲企业收入的一半，丙企业的收入上升了30%且其2020年的收入与甲、乙两企业同年收入之和相同。问2020年甲企业的收入比乙企业高多少万元？","options":{"A":"900","B":"1100","C":"400","D":"600"},"answer":"D","explanation":"设2021年乙企业的收入为x万元，则根据题干条件甲、乙、丙三家企业的收入如下表所示：\n\u003cimg data-k=\"a1453a5ca2bc\" style=\"max-width:700px\">\n2021年甲、乙、丙三家企业的收入之和为2x+x+3.9x-390=6.9x-390，2020年甲、乙、丙三家企业的收入之和为\u003cimg data-k=\"cee9602bda38\">。因甲、乙、丙三家企业2021年的收入之和比2020年提升了20%，即\u003cimg data-k=\"8357534dafc8\">，解得x=1100，则2020年甲企业的收入比乙企业高（2x-400）-（x+100）=x-500=600万元。\n故正确答案为D。","no":69,"missingImage":false},{"type":"question","qid":"5445718","cat":"数学运算","stem":"一个圆柱体零件A和一个圆锥体零件B分别用甲、乙两种合金铸造而成。A的底面半径和高相同，B的底面半径是高的2倍，两个零件的高相同，质量也相同。问甲合金的密度是乙合金的多少倍？","options":{"A":"\u003cimg data-k=\"e3b01bf26d59\">","B":"\u003cimg data-k=\"170ce8fc8ae0\">","C":"\u003cimg data-k=\"ff1b1de9ab8e\">","D":"\u003cimg data-k=\"4ee864913a4b\">"},"answer":"A","explanation":"赋值零件A与零件B的高均为1，则A的底面半径为1，B的底面半径为2，可得零件A的体积为\u003cimg data-k=\"ad12dfc1b843\">，零件B的体积为\u003cimg data-k=\"542212431c73\">。根据公式：质量=密度×体积，可知质量相同时，密度和体积成反比，即\u003cimg data-k=\"2f45a88dfe4d\">。\n故正确答案为A。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>6天休假期间，单位需要每天安排一人值班。财务、研发、人事、后勤、法务和销售6个部门各推荐了2人，值班人员从这12人中选择，每人至多值班一天。安排要求：\u003c/p>\u003cp>（1）第二天和第四天不安排法务部门的人值班；\u003c/p>\u003cp>（2）若安排后勤部门的人值班，则只能安排在法务部门的人值班的前一天；\u003c/p>\u003cp>（3）若安排研发部门的人值班，则只能安排在后勤部门的人值班的前一天。\u003c/p>","questions":[{"qid":"5445782","cat":"逻辑判断","stem":"关于6天中的人选，以下哪项安排符合上述条件？","options":{"A":"财务、人事、后勤、法务、财务、人事","B":"销售、财务、法务、人事、财务、销售","C":"人事、财务、法务、研发、法务、后勤","D":"法务、销售、人事、后勤、财务、销售"},"answer":"B","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天。\n第二步：根据题干条件进行推理。\n本题题干信息确定，选项信息充分，优先考虑排除法。\n根据条件（1）“法务部\u003cimg data-k=\"645831205161\">第二、四天”，排除A项。\n根据条件（2）“后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天”，排除C、D两项。\n经验证，B项满足题干所有条件，当选。\n故正确答案为B。","no":71,"missingImage":false},{"qid":"5445805","cat":"类比推理","stem":"后勤部门的人可以安排在哪几天值班？","options":{"A":"只有第二天、第四天、第五天","B":"只有第一天、第三天、第五天","C":"只有第二天、第六天","D":"只有第一天、第三天"},"answer":"A","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天。\n第二步：根据题干条件进行推理。\n提问为“可以”，优先考虑代入选项。因为选项表述均为“只有”，说明是要列举后勤部门值班的所有可能情况，此时可以从选项中只出现一次的情况入手，即A项中的“后勤部门的人是否可以安排在第四天”，如果可以，即A项当选，如果不可以，即排除A项。\n如果后勤部门安排在第四天，根据条件（2）可知，法务部门安排在第五天，题干所有条件均可满足，即后勤部门可以安排在第四天，排除B、C、D三项。\n故正确答案为A。","no":72,"missingImage":false},{"qid":"5445808","cat":"逻辑判断","stem":"如果安排后勤部门的两人值班，则以下哪项一定是错误的？","options":{"A":"第一天安排研发部门的人值班","B":"第六天安排人事部门的人值班","C":"第三天安排财务部门的人值班","D":"第五天安排法务部门的人值班"},"answer":"C","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天；\n（4）后勤有两人值班。\n第二步：根据题干条件进行推理。\n条件（4）表明后勤有两人值班，结合条件（2）可知，法务也应有两人值班，且后勤紧挨在法务值班的前一天，据此可知，法务不能安排在第一天。\n再结合条件（1）可知，法务的两人只能安排在第三天、第五天、第六天这三天中的两天。由于法务两人值班的前一天均应是后勤的人在值班，所以法务的两人不能同时安排在第五天和第六天，因此法务一定有一人是安排在第三天的，则C项第三天安排财务部门的人值班是错误的。\n本题为选非题，故正确答案为C。","no":73,"missingImage":false},{"qid":"5445817","cat":"类比推理","stem":"如果在第三天、第五天分别安排两个财务部门的人值班，则第一天、第六天可安排的值班人员可能分别来自：","options":{"A":"后勤部门和法务部门","B":"法务部门和销售部门","C":"财务部门和销售部门","D":"研发部门和人事部门"},"answer":"B","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天；\n（4）在第三天、第五天分别安排两个财务部门的人值班。\n第二步：根据题干条件进行推理。\n提问方式为“可能”，优先使用代入法。\n代入A项：如果第一天、第六天安排的值班人员分别来自后勤部门和法务部门，根据条件（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天，可知第二天为法务，不满足条件（1），排除；\n代入B项：如果第一天、第六天安排的值班人员分别来自法务部门和销售部门，根据条件（4）在第三天、第五天分别安排财务，根据条件（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天，可知第二天和第四天不能安排后勤，根据条件（1），可知第二天和第四天不能安排法务，根据条件（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天，可知第二天和第四天不能安排研发，所以第二天和第四天可以安排人事或者销售，可进行如下安排，满足题干条件，当选；\n\u003cimg data-k=\"c52329b09348\" style=\"max-width:685px\">\n代入C项：如果第一天、第六天安排的值班人员分别来自财务部门和销售部门，此时第一天、第三天和第五天安排的值班人员均来自财务部门，不符合题干条件“6个部门各推荐2人”，不满足题干条件，排除；\n代入D项：如果第一天、第六天安排的值班人员分别来自研发部门和人事部门，根据条件（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天，可知第二天的值班人员来自后勤部门，根据条件（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天，可知第三天的值班人员来自法务部门，此时不符合条件（4）“第三天安排财务部门的人值班”，不满足题干条件，排除。\n故正确答案为B。","no":74,"missingImage":false},{"qid":"5445818","cat":"逻辑判断","stem":"如果没有安排财务和后勤部门的人值班，则以下哪项一定是正确的？","options":{"A":"第四天安排销售部门的人值班","B":"第五天安排法务部门的人值班","C":"第二天安排销售部门或者人事部门的人值班","D":"第三天安排法务部门或者人事部门的人值班"},"answer":"C","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天；\n（4）没有安排财务和后勤部门的人值班。\n第二步：根据题干条件进行推理。\n根据条件（4）没有安排后勤部门的人值班，可知研发部门不可能安排在后勤部门的前一天，结合条件（3）可知，没有安排研发部门的人值班。此时已知没有安排研发、财务和后勤这3个部门的人值班，结合题干开头给出的信息可知，值班人员只能从剩下的人事、法务、销售这3个部门中选择。再结合条件（1）可知，第二天不能安排法务部门的人值班，所以第二天只能安排销售部门或者人事部门的人值班。\n故正确答案为C。","no":75,"missingImage":false},{"qid":"5445797","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"9e36759fbb21\" style=\"max-width:581px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"图形元素组成不同，无明显属性规律，考虑数量规律。题干图形明显被分割，优先考虑面数量，发现题干图形均为4个面，据此排除A项；继续观察发现题干图形均由几个图形拼接而成，还可以考虑图形间关系。题干图形均有一个黑块，观察发现题干图形中黑块均与3个白块存在公共边，选项中只有C项符合。\n故正确答案为C。","no":76,"missingImage":false},{"qid":"5445778","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"2be79c89c52c\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"图形元素组成不同，优先考虑属性规律。观察发现，题干图形均由内外两部分组成，考虑分内外看，且题干出现等腰三角形、平行四边形等特征图形，考虑对称性。题干图形外部均为轴对称图形，内部均为中心对称图形，故？处图形也应满足此规律，只有D项符合。\n故正确答案为D。","no":77,"missingImage":false},{"qid":"5445802","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"74b5cbbe6d55\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相同，优先考虑位置规律。题干图形由黑色三角形构成，且数量较多、角度也较乱，考虑相邻比较。观察发现：从图1到图2，最上方一行相同位置上的黑色三角形均顺时针旋转了\u003cimg data-k=\"dd44efe89e5a\">，其余位置的黑色三角形保持不变；从图2到图3，最右侧一列相同位置上的黑色三角形均顺时针旋转了\u003cimg data-k=\"dd44efe89e5a\">，其余位置的黑色三角形保持不变；从图3到图4，最下方一行相同位置上的黑色三角形均顺时针旋转了\u003cimg data-k=\"dd44efe89e5a\">，其余位置的黑色三角形保持不变；从图4到图5，最左侧一列相同位置上的黑色三角形均顺时针旋转了\u003cimg data-k=\"dd44efe89e5a\">，其余位置的黑色三角形保持不变。因此，？处图形与图5相比，应为只有最上方一行相同位置上的黑色三角形顺时针旋转\u003cimg data-k=\"dd44efe89e5a\">，其余位置的黑色三角形均保持不变，只有B项符合。\n故正确答案为B。","no":78,"missingImage":false},{"qid":"5445769","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"50feec4b01db\" style=\"max-width:430px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"图形元素组成相似，优先考虑样式规律。观察发现，题干图形均由黑球和白球构成，考虑黑白运算。九宫格优先横向观察，第一行图形的黑白运算规律为：黑+黑=白，黑+白=白，白+黑=白，白+白=黑，第二行图形经验证符合此规律，第三行图形应用此规律，只有A项符合。\n故正确答案为A。","no":79,"missingImage":false},{"qid":"5445822","cat":"图形推理","stem":"将一张直角三角形形状的纸片进行两次折叠，展开后的折痕将该三角形分成如图所示的a、b、c、d四个部分，则两次折叠后的纸片投影面积为：\n\u003cimg data-k=\"eb9bfd252e21\" style=\"max-width:363px\">","options":{"A":"b+d+c-a","B":"b+d-c","C":"b+c-a","D":"b+d-a"},"answer":"D","explanation":"第一步，将直角三角形先沿水平折痕进行折叠，即将面c和面d向下折叠，覆盖面b和面a，得到如下图形，此时折叠后面积为：b+d；\n\u003cimg data-k=\"f8fa35908807\" style=\"max-width:316px\">\n第二步，将直角三角形沿着竖直折痕进行折叠，即将面b和面c向右折叠，覆盖面d和面a，得到如下图形，此时折叠后面积为：d+b-a。\n\u003cimg data-k=\"3fd2d478e850\" style=\"max-width:223px\">\n故正确答案为D。","no":80,"missingImage":false},{"qid":"5445823","cat":"图形推理","stem":"左图为给定的立体图形，从任一角度观看，下面哪项不可能是该立体图形的视图？\n\u003cimg data-k=\"ab81941b5138\" style=\"max-width:598px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查三视图。如下图所示，A、B、D三项按图中箭头方向观察，均可看到，排除；C项为从上往下观察图形，则左右两侧应有两条竖线，当选。\n\u003cimg data-k=\"06b5e2c509f8\" style=\"max-width:598px\">\n本题为选非题，故正确答案为C。","no":81,"missingImage":false},{"qid":"5445798","cat":"图形推理","stem":"左图为等大的3个灰色正方体和15个白色正方体组合成的多面体，其可以切割为①、②和③三个小多面体，问③代表的多面体可能是：\n\u003cimg data-k=\"71b5912122c2\" style=\"max-width:570px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查立体拼合。如下图所示，将图①、图②进行旋转，结合A项，即可拼合成为左图的多面体。\n\u003cimg data-k=\"5b991e427b43\" style=\"max-width:585px\">\n\u003cimg data-k=\"736e1d4a45b1\" style=\"max-width:500px\">\n故正确答案为A。","no":82,"missingImage":false},{"qid":"5445799","cat":"图形推理","stem":"把下面六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"930786362135\" style=\"max-width:557px\">","options":{"A":"①②⑤，③④⑥","B":"①②④，③⑤⑥","C":"①④⑤，②③⑥","D":"①③⑤，②④⑥"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形基本都由圆和正方形构成，优先考虑元素的个数，圆的数量依次为5、0、1、3、4、2，正方形的数量依次为4、1、2、2、3、3，单独看数量无规律，考虑二者运算图①④⑤中，圆的数量-正方形的数量=1；图②③⑥中，正方形的数量-圆的数量=1。故图①④⑤为一组，图②③⑥为一组。\n故正确答案为C。","no":83,"missingImage":false},{"qid":"5445768","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"02bdbdf7af29\" style=\"max-width:547px\">","options":{"A":"①③⑤，②④⑥","B":"①④⑥，②③⑤","C":"①③④，②⑤⑥","D":"①②④，③⑤⑥"},"answer":"D","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图2为“日”字变形图，图3为多端点图形，优先考虑笔画数。图①②④为一笔画图形，图③⑤⑥为两笔画图形，即图①②④为一组，图③⑤⑥为一组。\n故正确答案为D。","no":84,"missingImage":false},{"qid":"5445793","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"78526a7dba46\" style=\"max-width:564px\">","options":{"A":"①③④，②⑤⑥","B":"①②④，③⑤⑥","C":"①②⑥，③④⑤","D":"①⑤⑥，②③④"},"answer":"B","explanation":"解析一：本题为分组分类题目。元素组成不同，且封闭面明显，考虑数面。观察发现，图①②④中有4个面；图③⑤⑥中有5个面，即图①②④为一组，图③⑤⑥为一组。\n故正确答案为B。\n解析二：本题为分组分类题目。元素组成不同，优先考虑属性规律。观察发现，题干每幅图中均出现多个全开放图形，优先考虑开闭性。图①②④中有5个全开放图形、4个全封闭图形；图③⑤⑥中有4个全开放图形、5个全封闭图形，即图①②④为一组，图③⑤⑥为一组。\n故正确答案为B。","no":85,"missingImage":false},{"qid":"5445804","cat":"定义判断","stem":"微量鉴定是指运用物理学、化学和仪器分析等方法，通过对案件现场有关物质材料（材料特点多为体小量微、不易注意）的成分及其结构进行定性、定量分析，对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定。\n根据以上定义，下列涉及交通事故的鉴定属于微量鉴定的是：","options":{"A":"对车辆驾驶人采血，分析血液中的酒精含量，判断驾驶人是否存在酒后驾车嫌疑","B":"现场提取、检验受害人毛发、衣物纤维，认定受害人是否与嫌疑人车辆存在接触","C":"拆解车辆特定部位，查明车辆故障原因，用以鉴定其属于人为责任还是机械故障","D":"通过人体损伤程度检验，确定伤害损伤部位与交通事故伤害后果的关联程度"},"answer":"B","explanation":"第一步：找出定义关键词。\n“对案件现场体小量微、不易注意的物质材料成分及其结构进行分析”、“对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定”。\n第二步：逐一分析选项。\nA项：对车辆驾驶人采血，分析血液中的酒精含量，“血液”不符合“体小量微、不易注意的物质材料”，并且也不涉及与嫌疑样本的比对，不符合定义，排除；\nB项：现场提取、检验受害人毛发、衣物纤维，“毛发，衣物纤维”符合“体小量微、不易注意的物质材料”，认定受害人是否与嫌疑人车辆存在接触，符合“对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定”，符合定义，当选；\nC项：拆解车辆特定部位，查明车辆故障原因，“车辆特定部位”不符合“体小量微、不易注意的物质材料”，并且也不涉及与嫌疑样本的比对，不符合定义，排除；\nD项：通过人体损伤程度检验，确定伤害损伤部位与交通事故伤害后果的关联程度，“人体”不符合“体小量微、不易注意的物质材料”，并且也不涉及与嫌疑样本的比对，不符合定义，排除。\n故正确答案为B。","no":86,"missingImage":false},{"qid":"5445820","cat":"定义判断","stem":"架构创新是指组成产品的基本元件不变，但是整体结构布局改变，即将相同元件进行整体结构的重新调整，进而产生新功能的创新。\n根据上述定义，下列属于架构创新的是：","options":{"A":"陶瓷底板电熨斗与传统不锈钢底板电熨斗相比，其底板的耐磨性更强，具有更高的光滑度，使用起来更顺畅","B":"某款手机聊天软件增加了拜年红包功能，用户可以在给亲朋好友发送红包时，编辑拜年吉祥语、自定义红包图片，满足个性化需求","C":"可拆卸手柄锅将原手柄设计成可从锅具上拆卸下来，并提供多个手柄可安装在锅具边缘的任意位置上，满足烹饪需要","D":"某板材厂改良制作工艺，将原来的轧制工序分成两步进行，同时增加砂光工序，生产出满足市场需要的薄板"},"answer":"C","explanation":"第一步：找出定义关键词。\n“组成产品的基本元件不变”、“重新调整相同元件的整体结构”、“产生新功能的创新”。\n第二步：逐一分析选项。\nA项：陶瓷底板电熨斗与传统不锈钢底板电熨斗，二者的底板分别为陶瓷和不锈钢，说明二者的基本元件不同，不符合“组成产品的基本元件不变”，不符合定义，排除；\nB项：手机聊天软件增加了拜年红包功能，用户可以在红包上编辑拜年吉祥语、自定义红包图片，但是以前发红包不能自定义红包图片，现在能自己选择了，其实是新开发的功能，不是因整体结构布局改变而产生的功能，不符合“重新调整相同元件的整体结构”、“产生新功能的创新”，不符合定义，排除；\nC项：可拆卸手柄锅提供多个手柄可安装在锅具边缘的任意位置上，说明安装手柄的结构布局改变，符合“重新调整相同元件的整体结构”，但有同学觉得 “提供多个手柄”，数量多了，不符合“组成产品的基本元件不变”，此处确实是C项纠结的地方，但宏观来看其实基本原件还是锅和手柄，但是商家给了多个手柄，其实就是提供了更多结构调整时的功能选择，比如一个手柄可以做炒锅，两个手柄可以做汤锅，取下手柄还可以当盘子用等，产生了很多的新功能（注：烹饪功能也可以细化成炒煮蒸炸等，不同的手柄带来了不同的功能），整体来说，比B项更符合关键词“重新调整相同元件的整体结构”、“产生新功能的创新”，择优选择C项；\nD项：板材厂将原来的轧制工序分成两步进行，同时增加砂光工序，说明是产品的制作工艺改变，不符合“重新调整相同元件的整体结构”，不符合定义，排除。\n故正确答案为C。","no":87,"missingImage":false},{"qid":"5445821","cat":"定义判断","stem":"民宿是指利用当地民居等相关闲置资源，经营用客房不超过4层、建筑面积不超过800平方米，主人参与接待，为游客提供体验当地自然、文化与生产生活方式的小型住宿设施。\n根据上述定义，下列属于民宿的是：","options":{"A":"王某在市中心有一套两居室的房子，过了马路就是知名的景区公园。王某将闲置房间租给那些节假日来旅游的家庭，并提供导游服务","B":"某家庭农场开发亲子休闲旅游业务，建设了农业科普、亲子游玩场所，为孩子和家长营造一处寓教于乐的乡村乐园","C":"李某通过某网上平台找到心仪城市的会员“交换”旅行，即双方各自为对方提供住宿，住在对方家中深入体验当地的风土人情","D":"张某在古镇上有一所老宅。他和某平台签订合同，将老宅租给该平台运营。该平台将老宅装修，并提供完善的酒店式服务机制"},"answer":"A","explanation":"第一步：找出定义关键词。\n“利用当地民居等相关闲置资源”、“经营用客房不超过4层、建筑面积不超过800平方米”、“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”。\n第二步：逐一分析选项。\nA项：王某有一套两居室的房子，将闲置房间租给旅游家庭，符合“利用当地民居等相关闲置资源”、“经营用客房不超过4层、建筑面积不超过800平方米”，并提供导游服务，符合“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”，符合定义，当选；\nB项：某家庭农场开发亲子休闲旅游业务，未提及该农场是否为闲置资源，不符合“利用当地民居等相关闲置资源”，也未提及该农场是否有经营用客房，不符合“经营用客房不超过4层、建筑面积不超过800平方米”，建设了农业科普、亲子游玩场所，不符合“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”，不符合定义，排除；\nC项：李某与心仪城市的会员“交换”旅行，双方各自为对方提供住宿，说明双方是互相为对方提供住宿，而非用于经营，不符合“经营用客房”，不符合定义，排除；\nD项：张某将古镇的老宅租给某平台，符合“利用当地民居等相关闲置资源”，将老宅租给该平台运营，由该平台提供完善的酒店式服务机制，说明该老宅的主人张某并不提供接待服务，不符合“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”，不符合定义，排除。\n故正确答案为A。","no":88,"missingImage":false},{"qid":"5445801","cat":"定义判断","stem":"体验式采访是指直接投入到所要报道的新闻事件中去体验生活，以获得新闻报道所需要的素材，以及对新闻事件的认识。\n根据上述定义，下列不属于体验式采访的是：","options":{"A":"某报社要求年轻记者沉入生活，了解基层，以改变写官话、说套话的文风","B":"某作家为了解包身工的悲惨遭遇，深入到工厂中，写出报告文学《包身工》","C":"某记者为了解传销组织的真面目，打入到传销组织内部，揭示传销组织的骗局","D":"某电视台推出专栏《体验三百六十行》，派记者体验各职业一周并进行系列报道"},"answer":"A","explanation":"第一步：找出定义关键词。\n“直接投入到所要报道的新闻事件中”、“以获得新闻素材及认识”。\n第二步：逐一分析选项。\nA项：某报社要求年轻记者深入基层以改变写官话、说套话的文风，其目的是改变文风，而非获得新闻素材及认识，不符合“以获得新闻素材及认识”，不符合定义，当选；\nB项：某作家深入到工厂中，符合“直接投入到所要报道的新闻事件中”，其目的是了解包身工的悲惨遭遇，之后写出报告文学《包身工》，而报告文学兼有新闻和文学的特点，用文学手段处理新闻题材，符合“以获得新闻素材及认识”，符合定义，排除；\n\u003cimg data-k=\"f75197d7b4c3\" style=\"max-width:400px\">\nC项：某记者打入到传销组织内部，符合“直接投入到所要报道的新闻事件中”，其目的是了解传销组织的真面目以揭示其骗局，符合“以获得新闻素材及认识”，符合定义，排除；\nD项：记者体验各职业一周，符合“直接投入到所要报道的新闻事件中”，其目的是了解各行业以完成专栏《体验三百六十行》，符合“以获得新闻素材及认识”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":89,"missingImage":false},{"qid":"5445814","cat":"定义判断","stem":"伴性遗传是指控制性状的基因位于性染色体上，遗传总是与性别相关联，不同性别出现某一性状的概率不同的遗传。限性遗传是指控制性状的基因位于性染色体上，性状只在一种性别上得以表现，而在另一性别上完全不能表现的遗传。从性遗传是指控制性状的基因位于常染色体上，但由于受到性激素的作用，基因在不同性别中表达不同的遗传。\n根据上述定义，下列属于限性遗传的是：","options":{"A":"抗维生素D佝偻病是伴X染色体显性遗传病，女性发病率高，常表现为世代遗传","B":"人类外耳道多毛症为伴Y染色体遗传病，在家族男性亲属中代代遗传","C":"遗传性斑秃为常染色体显性遗传病，男性会出现早秃，而女性则不会出现","D":"红绿色盲症是伴X染色体隐性遗传病，男性发病率高，表现出交叉遗传和隔代遗传"},"answer":"B","explanation":"第一步：找出定义关键词。\n伴性遗传：“控制性状的基因位于性染色体上”、“不同性别出现某一性状的概率不同”；\n限性遗传：“控制性状的基因位于性染色体上”、“只在一种性别上得以表现，而在另一性别上完全不能表现”；\n从性遗传：“控制性状的基因位于常染色体上”、“由于受到性激素的作用，基因在不同性别中表达不同”。\n第二步：逐一分析选项。\nA项：抗维生素D佝偻病在女性中的发病率高，说明在女性中出现的概率高，符合“不同性别出现某一性状的概率不同”，符合伴性遗传定义，不符合“性状只在一种性别上得以表现，而在另一性别上完全不能表现”，不符合限性遗传定义，排除；\nB项：人类外耳道多毛症为伴Y染色体遗传病，在家族男性亲属中代代遗传，说明该病仅在家族男性中遗传，符合“性状只在一种性别上得以表现，而在另一性别上完全不能表现”，符合限性遗传定义，当选；\n\u003cimg data-k=\"ceb2fecc677d\" style=\"max-width:600px\">\nC项：遗传性斑秃为常染色体显性遗传病，说明其控制性状的基因位于常染色体上，不符合“控制性状的基因位于性染色体上”，不符合限性遗传定义，下面资料显示，遗传性斑秃属于从性遗传，排除；\n\n\u003cimg data-k=\"38b4a03e7be5\" style=\"max-width:600px\">\nD项：红绿色盲症在男性中发病率高，说明在男性中出现的概率高，符合“不同性别出现某一性状的概率不同”，符合伴性遗传定义，不符合“性状只在一种性别上得以表现，而在另一性别上完全不能表现”，不符合限性遗传定义，排除。\n故正确答案为B。","no":90,"missingImage":false},{"qid":"5445800","cat":"定义判断","stem":"预判设计是一种能够引导用户、缩短用户行为路径的有效设计手段。它可以根据用户的行为或用户所在的场景，让功能“主动找到”用户，并让用户与之产生自然的交互，为用户提供更好的使用体验，本质就是为用户多想一步，让用户使用起来尽量简单。\n根据上述定义，下列不属于预判设计的是：","options":{"A":"某购物软件，根据用户输入的搜索关键词，将商品按与关键词的相关性排列","B":"某翻译软件，用户第一次点击播放，语音速度正常；再次点击，语音速度变慢","C":"某外卖软件，当用户对店家给出差评，系统自动勾选“将评价设为匿名评价”","D":"某购物软件，所选商品缺货时，出现“找相似”按钮，点击可看到同款、相似商品"},"answer":"A","explanation":"第一步：找出定义关键词。\n“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”。\n第二步：逐一分析选项。\nA项：用户在购物软件输入搜索关键词以后，购物软件列出与用户搜索关键词相关的商品，此时仅仅是该软件配合了用户的搜索行为，并没有对其下一步行为进行预判，更没有引导用户，不符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，不符合定义，当选；\nB项：某翻译软件第一次点击播放，语速正常，再次点击，语速变慢，体现了产品会预判用户可能是刚刚没听清楚、或者想听清某个词的念法等，从而不用等用户自行操作，而主动将语音播放速度变慢，符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，符合定义，排除；\nC项：某外卖软件，当用户给差评时，系统自动勾选“匿名评价”，因为绝大多数用户给商家差评时都不希望商家看到自己的身份，所以该软件不等用户自行勾选匿名评价，而自动帮用户勾选，缩短了用户行为路径，为用户多想一步，符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，符合定义，排除；\nD项：大多数用户在购物软件上遇到想要的商品缺货时，接下来最可能的就是去找一些相似的商品，所以某购物软件为用户多想了一步，不用等用户自行搜索相似商品，而是当所选商品缺货时，自动出现“找相似”按钮，点击可看到同款、相似商品，符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":91,"missingImage":false},{"qid":"5445785","cat":"定义判断","stem":"负性偏向是指负性信息比其他信息得到优先的注意和加工，这是人类在先天遗传和后天经验基础上存在的一种普遍性认知倾向，即给予负性事物更大的权重，并在注意、记忆、情绪、决策等方面遵循“坏比好重要”的心理原则。\n根据上述定义，下列没有体现负性偏向的是：","options":{"A":"“3·15”晚会报道侵犯消费者权益的违法行为，以期政府各级管理部门有效管理","B":"被试对负面词汇的再认正确率比正面词汇高，能更精准识别某负面词汇是否在语料中","C":"新闻传播过程中，模糊信息中的一些负面细节更容易被人们关注并作进一步负面解读","D":"应聘者的优缺点与职位具有同等相关性，但招聘者往往更关注应聘者的缺点"},"answer":"A","explanation":"第一步：找出定义关键词。\n“负性信息比其他信息得到优先的注意和加工”、“坏比好重要”。\n第二步：逐一分析选项。\nA项：“3·15”晚会报道违法行为，该项仅提及了“负性信息”，没有提到“其他信息”，也不存在“负性信息”与“其他信息”之间的比较，不符合“负性信息比其他信息得到优先的注意和加工”、“坏比好重要”，不符合定义，当选；\nB项：该项说被试对负面词汇的再认正确率比正面词汇高，能更精准识别负面词汇，体现了被试对负性信息更加注意，“比”和“更”体现了“负性信息”和“其他信息”之间的比较，符合“负性信息比其他信息得到优先的注意和加工”、“坏比好重要”，符合定义，排除；\nC项：该项说模糊信息中的一些负面细节更容易被人们关注并作进一步负面解读，说明相较于“其他信息”，人们更优先注意和加工“负性信息”，符合“负性信息比其他信息得到优先的注意和加工”、“坏比好重要”，符合定义，排除；\nD项：该项说在应聘者的优缺点中，招聘者更关注其缺点，说明相较于“其他信息”，招聘者更优先注意“负性信息”，符合“负性信息比其他信息得到优先的注意和加工”、“坏比好重要”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":92,"missingImage":false},{"qid":"5445787","cat":"定义判断","stem":"单元素导语是指在撰写新闻导语（即消息的开头）时，突出表现一个新闻事实的导语。单元素导语按新闻五要素可分为：①何人导语，突出报道显要或影响大的新闻人物；②何事导语，突出报道新闻事实本身；③何时导语，突出报道读者关心的事情什么时候会发生或进行；④何地导语，突出报道一些重要或有特殊意义的地方发生重大变化的消息；⑤为什么导语，突出报道一个事件的起因。\n根据上述定义，下列导语与其分类对应正确的是：","options":{"A":"亲爱的读者，你知道为什么夏天夜空里看到的星星比冬天夜空里看到的多？——④","B":"1964年10月16日，我国第一颗原子弹爆炸成功——②","C":"杨先生带着2岁的女儿到市医院看病，没想到看一个“咳嗽”就要花1000多元——①","D":"谁是高考状元？这个一年一度的热门话题，今年却在XX省消失了——③"},"answer":"B","explanation":"第一步：找出定义关键词。\n单元素导语：“在撰写新闻导语（即消息的开头）时，突出表现一个新闻事实”；\n何人导语：“突出报道显要或影响大的新闻人物”；\n何事导语：“突出报道新闻事实本身”；\n何时导语：“突出报道读者关心的事情什么时候会发生或进行”；\n何地导语：“突出报道一些重要或有特殊意义的地方发生重大变化的消息”；\n为什么导语：“突出报道一个事件的起因”。\n第二步：逐一分析选项。\nA项：为什么夏天夜空看到的星星比冬天夜空里看到的多是想要表现事件的起因，符合“突出报道一个事件的起因”，符合“为什么导语”定义，不符合“何地导语”定义，对应错误，排除；\nB项：1964年10月16日，第一颗原子弹爆炸成功是新闻事实本身，符合“突出报道新闻事实本身”，符合“何事导语”定义，对应正确，当选；\nC项：杨先生带着女儿到医院看病，一个“咳嗽”花费1000多元是新闻事实本身，符合“突出报道新闻事实本身”，符合“何事导语”定义，不符合“何人导语”定义，对应错误，排除；\nD项：高考状元今年在XX省消失了，报道该省发生的重大变化，符合“突出报道一些重要或有特殊意义的地方发生重大变化的消息”，符合“何地导语”定义，不符合“何时导语”定义，对应错误，排除。\n故正确答案为B。","no":93,"missingImage":false},{"qid":"5445764","cat":"定义判断","stem":"子弹时间即计算机辅助的摄影技术模拟变速特效，是一种使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效，例如强化的慢镜头、时间静止等效果。\n根据上述定义，下列描述符合子弹时间的是：","options":{"A":"电视剧中，男主角因车祸去世，女主角目睹了这个过程，此后很多年，她的眼前无数次闪现出车祸发生的过程","B":"江阿姨的丈夫去世之后，她每天的大部分时间都用来反复看他们以前拍摄的视频，时间在她身上似乎静止了","C":"科幻小说中，小明因考试结束时还没有答完卷子，祈祷时间暂停，然后他发现时间真的静止了，只有他可以答卷","D":"通过电视转播，观众们看到滑雪运动员的身体缓慢地在空中划出优美的曲线，翻转瞬间的每个动作都无比清晰"},"answer":"D","explanation":"第一步：找出定义关键词。\n“使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效”。\n第二步：逐一分析选项。\nA项：电视剧中女主角的眼前无数次闪现出男主角车祸发生的过程，并没有涉及摄影技术模拟变速特效，不符合“使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效”，不符合定义，排除；\nB项：江阿姨反复看以前拍摄的视频，并未涉及到电影、电视节目或电脑游戏等领域，时间在她身上似乎静止了，也没有使用摄影技术模拟变速特效，不符合“使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效”，不符合定义，排除；\nC项：科幻小说中的时间静止，并没有涉及摄影技术模拟变速特效，不符合“使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效”，不符合定义，排除；\nD项：通过电视转播，观众们看到滑雪运动员在滑雪过程中的一些慢动作，符合“使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效”，符合定义，当选。\n故正确答案为D。","no":94,"missingImage":false},{"qid":"5445786","cat":"定义判断","stem":"联合式构词法是由两个意义相同、相反或相对的词根联合起来构成新词的方法，在词内两个词根是平等的，没有主从、正副之分。\n根据上述定义，下列使用了联合式构词法的是：","options":{"A":"“叮当”，因摹拟动作的声音而构成的词","B":"“椅子”，在单字“椅”后面附加“子”而构成的词","C":"“蹉跎”，由韵母相同的两个单字组合构成意义与单字无关的词","D":"“开关”，由“开”和“关”两个单字组合而构成的词"},"answer":"D","explanation":"第一步：找出定义关键词。\n“由两个意义相同、相反或相对的词根联合起来构成新词”、“两个词根是平等的，没有主从、正副之分”。\n第二步：逐一分析选项。\nA项：“叮”和“当”代表两个不同的声音，二者不符合“由两个意义相同、相反或相对的词根联合起来构成新词”，不符合定义，排除；\nB项：“椅子”中侧重于“椅”，即“椅”为主，“子”为从，不符合“两个词根是平等的，没有主从、正副之分”，不符合定义，排除；\nC项：“蹉”的意思有失足、差错等，而“跎”的意思有背负、驼背等，二者不符合“由两个意义相同、相反或相对的词根联合起来构成新词”，不符合定义，排除；\nD项：“开关”是指电器装置上接通和截断电路的设备，“开”有打开的意思，“关”有关闭的意思，二者意思相反且无主从之分，符合“由两个意义相同、相反或相对的词根联合起来构成新词”、“两个词根是平等的，没有主从、正副之分”，符合定义，当选。\n故正确答案为D。","no":95,"missingImage":false},{"qid":"5445780","cat":"类比推理","stem":"铜镜：化妆镜","options":{"A":"门帘：纱帘","B":"木碗：汤碗","C":"金簪：发簪","D":"瓷瓶：古瓶"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n铜镜一般是指由含锡量较高的青铜铸造的镜子，化妆镜一般指专门用于化妆的镜子。有的铜镜是化妆镜，有的铜镜不是化妆镜，有的化妆镜是铜镜，有的化妆镜不是铜镜，二者为交叉关系，且前者是根据材质命名，后者是根据功能命名。\n第二步：判断选项词语间逻辑关系。\nA项：有的门帘是纱帘，有的门帘不是纱帘，有的纱帘是门帘，有的纱帘不是门帘，二者为交叉关系，但前者是根据悬挂的位置命名，与题干逻辑关系不一致，排除；\nB项：有的木碗是汤碗，有的木碗不是汤碗，有的汤碗是木碗，有的汤碗不是木碗，二者为交叉关系，且前者是根据材质命名，后者是根据功能命名，与题干逻辑关系一致，当选；\nC项：金簪是发簪的一种，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：古瓶可指古董瓶子或古代的瓶子，有的瓷瓶是古瓶，有的瓷瓶不是古瓶，有的古瓶是瓷瓶，有的古瓶不是瓷瓶，二者为交叉关系，但后者是根据历史时代命名，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":96,"missingImage":false},{"qid":"5445781","cat":"类比推理","stem":"小计：总计","options":{"A":"平均值：总值","B":"被乘数：总数","C":"单科分：总分","D":"分目录：总目"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“小计”是数字列表中一部分数字的总和，“总计”是数字列表中所有数字的总和，因此，所有“小计”相加可以得到“总计”，二者是对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“平均值”乘以群体总个数等于“总值”，与题干逻辑关系不一致，排除；\nB项：“被乘数”指乘法中被乘的数字，一般放在算式的前面，“总数”是所有数的总和，二者无明显逻辑关系，与题干逻辑关系不一致，排除；\nC项：所有“单科分”相加可以得到“总分”，二者是对应关系，与题干逻辑关系一致，当选；\nD项：“分目录”指在各部分之前的目录，“总目”指在整个文档之前的目录，“总目”是对“分目录”的汇总，不存在相加的计算关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":97,"missingImage":false},{"qid":"5445775","cat":"类比推理","stem":"海棠红：南瓜橙","options":{"A":"苏丹红：景泰蓝","B":"孔雀蓝：柠檬黄","C":"日落黄：鱼肚白","D":"橄榄绿：梅子青"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“海棠红”和“南瓜橙”是两种不同的颜色，二者为并列关系，且都是根据植物命名的。\n第二步：判断选项词语间逻辑关系。\nA项：“苏丹红”是一种化学染色剂，而“景泰蓝”正名“铜胎掐丝珐琅”，是一种在铜质的胎型上，用柔软的扁铜丝，掐成各种花纹焊上，然后把珐琅质的色釉填充在花纹内烧制而成的器物，且二者不是根据植物命名的，“景泰蓝”是因“明代景泰年间”该工艺技术制作达到巅峰而得名的，与题干逻辑关系不一致，排除；\nB项：“孔雀蓝”和“柠檬黄”是两种不同的颜色，二者为并列关系，但“孔雀蓝”不是根据植物命名的，与题干逻辑关系不一致，排除；\nC项：“日落黄”和“鱼肚白”是两种不同的颜色，二者为并列关系，但二者不是根据植物命名的，与题干逻辑关系不一致，排除；\nD项：“橄榄绿”和“梅子青”是两种不同的颜色，二者为并列关系，且二者都是根据植物命名的，与题干逻辑关系一致，当选。\n故正确答案为D。","no":98,"missingImage":false},{"qid":"5445762","cat":"类比推理","stem":"脱脂棉：原棉","options":{"A":"白酒：烧酒","B":"黑陶：黏土","C":"摄像头：镜头","D":"视力：视力表"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n原棉是制造脱脂棉的原材料，二者为原材料对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：烧酒也称白酒，二者为全同关系，与题干逻辑关系不一致，排除；\nB项：黏土是制造黑陶的原材料，二者为原材料对应关系，与题干逻辑关系一致，当选；\nC项：镜头是摄像头的组成部分，二者为组成关系，与题干逻辑关系不一致，排除；\nD项：视力表用于测量视力，二者不是原材料对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":99,"missingImage":false},{"qid":"5445816","cat":"类比推理","stem":"匿名投票：实名投票：现场投票","options":{"A":"早间会议：午间会议：工作会议","B":"战国文字：象形文字：古代汉字","C":"金融危机：粮食危机：生态危机","D":"油料作物：糖料作物：经济作物"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n匿名投票与实名投票是两种投票方式，二者为并列关系；有的现场投票是匿名投票，有的现场投票是实名投票，前两个词语与第三个词语均为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：早间会议和午间会议是两种会议类型，二者为并列关系；有的工作会议是早间会议，有的工作会议是午间会议，前两个词语与第三个词语均为交叉关系，与题干逻辑关系一致，当选；\nB项：战国文字是战国时期不同地区使用的汉字的统称；象形文字是由图画文字演化而来的一种最古老的字体，如埃及的象形文字、苏美尔文、古印度文以及中国的甲骨文。战国文字是一种古代汉字，二者为种属关系；有的象形文字是古代汉字，有的象形文字不是古代汉字，有的古代汉字是象形文字，有的古代汉字不是象形文字，二者为交叉关系，与题干逻辑关系不一致，排除；\nC项：金融危机是指金融资产、金融机构、金融市场的危机；粮食危机指因粮食供应不足造成的危机；生态危机指生态环境被严重破坏使人类的生存与发展受到威胁的现象，三者是不同领域的危机，为并列关系，与题干逻辑关系不一致，排除；\nD项：油料作物和糖料作物是两种经济作物，前两个词语为并列关系，与第三个词语均为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":100,"missingImage":false},{"qid":"5445779","cat":"类比推理","stem":"春季过敏：花粉：喷嚏","options":{"A":"肺炎：咳嗽：支原体","B":"乙型脑炎：病毒：发热","C":"失眠：恐惧：噩梦","D":"秋季腹泻：饮食：脱水"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n花粉可能会导致春季过敏，前两词为因果关系；打喷嚏是春季过敏的症状，第一词和第三词为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：咳嗽是肺炎的症状，前两词为对应关系；支原体感染可能会导致肺炎，第一词和第三词为因果关系，与题干逻辑关系不一致，排除；\nB项：病毒感染可能会导致乙型脑炎，前两词为因果关系；发热是乙型脑炎的症状，第一词和第三词为对应关系，与题干逻辑关系一致，当选；\nC项：恐惧可能会导致失眠，前两词为因果关系；噩梦不是失眠的症状，与题干逻辑关系不一致，排除；\nD项：秋季腹泻指发生在秋冬季的腹泻病，原因可能是饮食不当或饮食不洁，而非饮食，前两词不是因果关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":101,"missingImage":false},{"qid":"5445777","cat":"类比推理","stem":"资产评估：审核通过：股票发售","options":{"A":"预定新车：加装内饰：购买车险","B":"修剪草坪：设备检修：园林养护","C":"选购家电：上门安装：维修保养","D":"收看节目：视频连线：观众互动"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n先资产评估，再审核通过，最后股票发售，三者为时间先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：先预定新车，但购买车险和加装内饰并无固定的先后顺序，与题干逻辑关系不一致，排除；\nB项：修剪草坪是园林养护的一部分，与题干逻辑关系不一致，排除；\nC项：先选购家电，再上门安装，最后维修保养，三者为时间先后顺序的对应关系，与题干逻辑关系一致，当选；\nD项：视频连线是观众互动的一种方式，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":102,"missingImage":false},{"qid":"5445790","cat":"类比推理","stem":"标清：高清：超清","options":{"A":"亚音速：音速：超音速","B":"厅级：市级：省级","C":"迁怒：愤怒：暴怒","D":"幽静：寂静：安静"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n三者均对清晰度进行分类，构成并列关系，且清晰度依次递增。\n第二步：判断选项词语间逻辑关系。\nA项：三者均对速度进行分类，构成并列关系，且速度依次递增，与题干逻辑关系一致，当选；\nB项：厅级是我国的一个行政级别，而市级和省级属于我国的行政区划，三者不构成并列关系，与题干逻辑关系不一致，排除；\nC项：迁怒为动词，指把怒气发泄到别人身上，愤怒为形容词，指因极度不满而情绪激动，暴怒指极端愤怒，三者不构成并列关系，与题干逻辑关系不一致，排除；\nD项：幽静指清幽寂静，寂静指没有声音、很静，安静指安稳平静、没有声音，三者均是对静的描述，构成并列关系，但不是静的程度从低到高的依次递增，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":103,"missingImage":false},{"qid":"5445788","cat":"类比推理","stem":"深空探测 对于 （    ） 相当于 （    ） 对于 公益组织","options":{"A":"无人采样；慈善捐款","B":"遥感技术；红十字会","C":"宇宙空间；公益事业","D":"火星探测；社会组织"},"answer":"D","explanation":"逐一代入选项。\nA项：深空探测是指脱离地球引力场，进入太阳系空间和宇宙空间的探测。探测方式上，一般包括飞越、硬着陆（撞击）、环绕、软着陆（+巡视）、无人采样返回、载人探测等形式，无人采样是一种深空探测的方式，二者为种属关系；公益组织一般为组织慈善捐款的主体，二者为对应关系，前后逻辑关系不一致，排除；\nB项：遥感技术是从人造卫星、飞机或其他飞行器上收集地物目标的电磁辐射信息，判认地球环境和资源的技术，在深空探测中会应用到遥感技术，二者为对应关系；红十字会是公益组织，二者为种属关系，前后逻辑关系不一致，排除；\nC项：深空探测的对象之一是宇宙空间，二者为工作对象的对应关系；公益组织是致力于社会公益事业和解决各种社会性问题的民间志愿性的社会中介组织，公益组织的工作对象之一是公益事业，二者为工作对象的对应关系，但前后顺序相反，前后逻辑关系不一致，排除；\nD项：火星探测是一种深空探测，二者为种属关系；公益组织是一种社会组织，二者为种属关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":104,"missingImage":false},{"qid":"5445791","cat":"类比推理","stem":"刑事警察 对于 （    ） 相当于 （    ） 对于 对外交涉","options":{"A":"公安机关；维护主权","B":"刑事案件；驻外武官","C":"打击犯罪；外交人员","D":"交通警察；外交领事"},"answer":"C","explanation":"逐一代入选项。\nA项：刑事警察是构成公安机关的一部分，二者为组成关系；对外交涉的目的是为了维护主权，二者为方式目的对应关系，前后逻辑关系不一致，排除；\nB项：刑事警察的主要任务是侦查刑事案件，刑事案件本身是一个名词，只是刑事警察的工作对象，二者为职业与工作对象的对应关系；驻外武官的主要任务是对外交涉，二者为职业与工作内容的对应关系，前后逻辑关系不一致，排除；\nC项：刑事警察的工作内容是打击犯罪，二者为职业与工作内容的对应关系；外交人员的工作内容是对外交涉，二者为职业与工作内容的对应关系，前后逻辑关系一致，当选；\nD项：刑事警察和交通警察都是警察，二者为并列关系中的反对关系；外交领事是一国根据协议派驻他国某城市或某地区的代表，是进行对外交涉的代表人物，二者是职业与工作内容的对应关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":105,"missingImage":false},{"qid":"5445784","cat":"逻辑判断","stem":"深度学习是一系列复杂的算法，使计算机能够识别数据中的模式并作出预测。研究人员利用深度学习技术训练AI系统自动读取视网膜扫描数据，并识别那些在接下来的一年中患心脏病风险较高的人。研究人员认为该项技术有可能彻底改变传统的心脏病筛查方式。\n上述论证的成立须补充以下哪项作为前提？","options":{"A":"视网膜扫描数据反映的微小血管变化是预测心脏疾病较为灵敏的指标","B":"心脏病筛查需要进行复杂且昂贵的超声心动图或心脏磁共振成像检查","C":"视网膜扫描相对便宜，并且在许多配镜服务中被使用","D":"AI系统是解开自然界中存在的复杂模式的绝佳工具"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：深度学习技术有可能彻底改变传统的心脏病筛查方式。\n论据：研究人员利用深度学习技术训练AI系统自动读取视网膜扫描数据，并识别那些在接下来的一年中患心脏病风险较高的人。\n本题提问为“须补充以下哪项作为前提”，优先考虑搭桥和必要条件。论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，而论据讨论的是利用深度学习技术可以训练AI系统自动读取视网膜扫描数据，二者话题不一致，优先考虑搭桥，即建立“视网膜扫描数据”和“心脏病筛查”的联系。\n第二步：逐一分析选项。\nA项：该项说的是视网膜扫描数据反映的微小血管变化可以用来预测心脏疾病，将“视网膜扫描数据”和“心脏病筛查”建立了联系，属于搭桥项，可以加强，当选；\nB项：该项说的是心脏病筛查需要进行复杂且昂贵的超声心动图或心脏磁共振成像检查，而论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，话题不一致，无法加强，排除；\nC项：该项说的是视网膜扫描相对便宜且在配镜中使用很多，而论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，话题不一致，无法加强，排除；\nD项：该项说的是AI系统是解开自然界中存在的复杂模式的绝佳工具，而论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，话题不一致，无法加强，排除。\n故正确答案为A。","no":106,"missingImage":false},{"qid":"5445794","cat":"逻辑判断","stem":"人们感受气味通过嗅觉受体实现。研究发现：随着人类的演化，编码人类嗅觉受体的基因不断突变，许多在过去能强烈感觉气味的嗅觉受体已经突变为对气味不敏感的受体，与此同时，人类嗅觉受体的总体数目也随时间推移逐渐变少。由此可以认为，人类的嗅觉经历着不断削弱、逐渐退化的过程。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"随着人类进化，嗅觉中枢在大脑皮层中所占面积逐渐减少","B":"相对于视觉而言，嗅觉在人类感觉系统中的重要性较低","C":"人类有大约1000个嗅觉受体相关基因，其中只有390个可以编码嗅觉受体","D":"不同人群之间嗅觉存在很大差异，老年人的嗅觉敏感性明显低于年轻人"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：人类的嗅觉经历着不断削弱、逐渐退化的过程。\n论据：随着人类的演化，编码人类嗅觉受体的基因不断突变，许多在过去能强烈感觉气味的嗅觉受体已经突变为对气味不敏感的受体，与此同时，人类嗅觉受体的总体数目也随时间推移逐渐变少。\n本题论点论据均在讨论人类的嗅觉在逐渐退化，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出嗅觉中枢在大脑皮层中所占面积逐渐减少，说明嗅觉能力在降低，补充论据，可以加强，当选；\nB项：该项比较了视觉和嗅觉在人类感觉系统中的重要性，而论点讨论的是人类的嗅觉是否退化，话题不一致，无法加强，排除；\nC项：该项指出了人类的1000个嗅觉受体相关基因中有390个可以编码嗅觉受体，没有体现出数量变化的多少，而题干讨论的是嗅觉逐渐退化的过程，话题不一致，无法加强，排除；\nD项：该项讨论的是老年人和年轻人的嗅觉敏感性，而论点讨论的是人类的嗅觉是否退化，话题不一致，无法加强，排除。\n故正确答案为A。","no":107,"missingImage":false},{"qid":"5445773","cat":"逻辑判断","stem":"调查显示，84.8%的家长倾向于给孩子购买标有“儿童”字样的食品。几乎每一款“儿童食品”都宣称“无添加，适合孩子健康成长”。家长热衷于购买有“儿童”标签的食品是因为他们觉得，标有“儿童”字样的食品更加营养健康，更适合儿童。\n以下哪项如果为真，最能质疑家长的观点？","options":{"A":"我国目前并没有设置专门的“儿童食品”分类，“儿童食品”缺乏专门的法律法规与食品安全国家标准","B":"孩子在不同年龄阶段，对各种营养物质的需求量会发生变化，而几乎所有“儿童食品”都没有明确的年龄分段和食用提示","C":"所谓的“儿童食品”，成分通常与普通食品没什么区别，甚至可能因为添加过量的调味物质而有害儿童健康","D":"儿童食品的外包装设计和食品形状设计都更符合儿童的审美，会导致儿童因为喜欢外形而过量进食"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：家长热衷于购买有“儿童”标签的食品是因为他们觉得，标有“儿童”字样的食品更加营养健康，更适合儿童。\n论据：无。\n本题只有论点没有论据，削弱可以优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：选项说的是“儿童食品”缺乏专门的法律法规与食品安全国家标准，但不明确“儿童食品”本身是否营养健康，为不明确项，无法削弱，排除；\nB项：选项说的是“儿童食品”没有明确的年龄分段和食用提示，但不明确“儿童食品”是否具备不同年龄阶段所需的营养物质，为不明确项，无法削弱，排除；\nC项：选项说的是“儿童食品”成分和普通食品一样，甚至可能对儿童产生危害，说明“儿童食品”并不是营养健康的，否定论点，可以削弱，当选；\nD项：选项说的是儿童会因为产品的外形而过量进食，而论点讨论的是“儿童食品”是否营养健康，与论点讨论的话题不一致，为无关项，无法削弱，排除。\n故正确答案为C。","no":108,"missingImage":false},{"qid":"5445783","cat":"逻辑判断","stem":"电商直播可以为农产品的营销提供一条有效的渠道，在农产品供应链的运作上要明显优于传统的“农户\u003cimg data-k=\"a37757d411ef\">批发商\u003cimg data-k=\"a37757d411ef\">分销商\u003cimg data-k=\"a37757d411ef\">消费者”模式。但目前在很多地方，电商直播营销模式并没有有效解决农产品卖难买难的问题。有从业者认为只要完善农产品物流配送体系，提高直播人员素质，就能有效解决这一问题。\n以下哪项如果为真，不能支持上述从业者的观点？","options":{"A":"直播内容重复单调，易引起消费者审美疲劳，不利于树立起良好的产品形象，影响了农产品直播的效果","B":"部分地区没有对农产品的生产、包装、运输以及销售等环节制定统一的标准，对农产品的质检投入不足","C":"在电商直播模式下，对物流的需求会增加，现有的冷链物流水平无法满足日益增长的农产品消费需求","D":"许多地区的农户居住比较分散，农产品出村进城“最先一公里”的物流运输难题，始终未能完全得到解决"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：只要完善农产品物流配送体系，提高直播人员素质，就能有效解决农产品卖难买难的问题。\n论据：无。\n本题只有论点没有论据，加强优先考虑补充论据，因是加强选非题，找到说明完善农产品物流配送体系或提高直播人员素质能有效解决农产品卖难买难的问题的选项排除即可。\n第二步：逐一分析选项。\nA项：该项说明目前直播内容重复单调，易引起消费者审美疲劳，影响了农产品直播的效果，直播内容和直播人员素质有关，也就是说提高人员素质可以有效解决农产品卖难买难的问题，可以加强，排除；\nB项：该项说明部分地区还存在对农产品的质检投入不足等问题，而论点说只要“完善农产品物流配送体系”“提高直播人员素质”，就能有效解决卖难买难的问题，选项却指出“即使完善农产品物流配送体系，提高直播人员素质，因为农产品还存在其他问题，也不一定能解决卖难买难的问题”，具有削弱力度，无法加强，当选；\nC项：该项说明现有的冷链物流水平无法满足农产品消费需求，即物流配送体系不完善，也就是说完善农产品物流配送体系能有效解决农产品卖难买难的问题，可以加强，排除；\nD项：该项说明农产品出村进城的物流运输难题未能得到解决，即物流配送体系不完善，也就是说完善农产品物流配送体系能有效解决农产品卖难买难的问题，可以加强，排除。\n本题为选非题，故正确答案为B。","no":109,"missingImage":false},{"qid":"5445803","cat":"逻辑判断","stem":"R行星是位于太阳系的一颗小行星，质量不大，平均直径不足500米。在对R行星进行长达一年的观测后，人们发现其表面长期漂浮着砂粒，且砂粒在漂浮一段时间后，还会重新落在行星表面。由于R行星表面没有稳定的大气层，因此人们认为砂粒漂浮的现象主要来自静电，原因是太阳风进入行星表面产生电场时，砂粒会因静电力的作用离开行星表面漂浮游动起来，当没有太阳风时，砂粒又会回落下来。\n以下哪项如果为真，没有质疑上述观点？","options":{"A":"R行星与彗星组成类似，彗星靠近太阳时，受太阳风产生的静电影响，其表面砂粒将会漂浮","B":"R行星表面存在一氧化碳、干冰等挥发性物质，其升华会带动砂粒的释放与漂浮","C":"R行星质量小，静电作用只能扬起毫米级的砂粒，但目前其表面漂浮的砂粒尺寸都很大","D":"R行星自转速度快，星球上的物体受到离心作用强，其表面尘埃与石块会脱离引力束缚，剥落散逸"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：R行星砂粒漂浮的现象主要来自静电。\n论据：R行星表面没有稳定的大气层，太阳风进入行星表面产生电场时，砂粒会因静电力的作用离开行星表面漂浮游动起来，当没有太阳风时，砂粒又会回落下来。\n本题论点和论据讨论的都是砂粒漂浮和静电的关系，论点论据话题一致，本题为削弱选非题，排除能够削弱的选项即可。\n第二步：逐一分析选项。\nA项：该项指出R行星与彗星组成类似，彗星表面砂粒漂浮的原因是静电，所以R行星表面砂粒漂浮的原因也可能是静电，属于类比加强，无法削弱，当选；\nB项：该项指出R行星表面的一氧化碳、干冰等挥发性物质升华会带动砂粒漂浮，说明R行星砂粒漂浮存在其他原因，他因削弱，可以削弱，排除；\nC项：该项指出R行星的静电只能扬起毫米级的砂粒，但其表面漂浮的砂粒尺寸很大，因此R行星的静电无法使R行星砂粒漂浮，说明R行星砂粒漂浮的现象并非主要来自静电，削弱论点，可以削弱，排除；\nD项：该项指出R行星自转速度快导致砂粒漂浮，说明R行星砂粒漂浮存在其他原因，他因削弱，可以削弱，排除。\n本题为选非题，故正确答案为A。","no":110,"missingImage":false}]}],"count":40,"answerable":40,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"26eb52bff28e\" style=\"max-width:700px\">\u003c/p>","ques <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){
  var base=(window.__EXAM__&&window.__EXAM__.imgBase)||"";
  return base+((window.__IMGS__ && window.__IMGS__[k]) || "");
}
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
