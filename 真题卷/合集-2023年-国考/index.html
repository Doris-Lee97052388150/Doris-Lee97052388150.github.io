观点。故文段重在强调生态修复的“修复行为请求应作为首要诉求”，对应D项。\nA项，“制定生态修复费用的分级标准”文段未提及，无中生有，排除；\nB项，“修复费用请求往往很难得到有效落实”对应文段尾句，为反面论证内容，非文段重点，排除；\nC项，文段重在强调“生态修复行为请求”，“责任人的能力”偏离文段重点，排除。\n故正确答案为D。\n【文段出处】《生态修复责任在环境公益诉讼中的实现路径》","no":57,"missingImage":false},{"type":"question","qid":"5445836","cat":"片段阅读","stem":"早在1938年，毛泽东同志就说过：“我们这个民族有数千年的历史，有它的特点，有它的许多珍贵品。对于这些，我们还是小学生。今天的中国是历史的中国的一个发展；我们是马克思主义的历史主义者，我们不应当割断历史。从孔夫子到孙中山，我们应当给以总结，承继这一份珍贵的遗产。这对于指导当前的伟大的运动，是有重要的帮助的。”\n这段文字最适合做下列哪一观点的例证？","options":{"A":"拥有马克思主义科学理论指导是我们党坚定信仰信念、把握历史主动的根本所在","B":"我们党历来用历史唯物主义的立场观点方法看待中华民族历史，继承和弘扬中华优秀传统文化","C":"中华文明源远流长、博大精深，是中华民族独特的精神标识，是当代中国文化的根基","D":"我们党的每一段革命历史，都是一部理想信念的生动教材"},"answer":"B","explanation":"文段开篇通过毛泽东同志的话指出中华民族的历史是有特点，有许多珍贵品的。接着提出对策，我们不应当割断历史，应当继承中华民族历史的珍贵遗产，并指出这一对策的重要意义。故文段重在强调我们应当继承中华民族历史的珍贵遗产，即中华优秀传统文化，对应B项。\nA项，“马克思主义”并非文段重点，文段重在强调要继承中华民族历史的珍贵遗产这一对策，与文意不符，排除；\nC项，文段并非强调中华文明的重要性，而是强调要继承中华民族历史的珍贵遗产这一对策，与文意不符，排除；\nD项，“理想信念”文段未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《王伟光：坚定文化自信 传承和弘扬中华优秀传统文化-新华网》","no":58,"missingImage":false},{"type":"question","qid":"5445837","cat":"片段阅读","stem":"我国在经济快速发展的同时，培育和形成了全球少有的超大规模内需市场。与小规模经济体相比，超大规模经济体在全球经济运行中通常发挥着“锚”的作用。改革开放以来，我国之所以能够成功应对亚洲金融危机、国际金融危机等的冲击，一定程度上就得益于此。另外，超大规模市场的多样性意味着更强的内部稳定性。产业发展、区域发展的差异性可以减少冲击的影响，局部的内部冲击不易在全国形成共振效应；部分行业、部分区域发展面临困境，并不会对宏观经济总体稳定产生巨大冲击。\n这段文字意在说明：","options":{"A":"我国既是经济全球化的受益者也是贡献者","B":"多措并举对保障内需市场稳定有重大意义","C":"超大规模市场有助于我国经济保持稳定","D":"超大规模经济体助力全球经济平稳运行"},"answer":"C","explanation":"文段开篇指出我国形成了超大规模内需市场，随后论述超大规模经济体的优势，即可以在全球经济运行中发挥如“锚”一般的稳定作用，让我国得以成功应对亚洲金融危机、国际金融危机等的冲击，接着通过关联词“另外”引导并列关系，指出超大规模市场的多样性意味着更强的内部稳定性，后文围绕这一观点进行具体的解释说明，故整个文段为并列结构，需对文段进行全面概括，文段通过两个方面的论述重在强调超大规模市场对于我国经济保持稳定的重要作用，对应C项。\nA项，未提及文段核心话题“超大规模市场”，偏离文段核心，排除；\nB项，“内需市场”对应并列的第一个方面，表述片面，且“多措并举”强调同时采取多个措施，文段并未提及，无中生有，排除；\nD项，文段重在强调超大规模市场在我国经济中发挥的作用，“全球经济”范围扩大，排除。\n故正确答案为C。\n【文段出处】《充分发挥超大规模市场优势》","no":59,"missingImage":false},{"type":"question","qid":"5445835","cat":"语句表达","stem":"。我们要结合我国发展需要和可能，做好我国数字经济发展顶层设计和体制机制建设。要加强形势研判，抓住机遇，赢得主动。各级领导干部要提高数字经济思维能力和专业素质，增强发展数字经济本领，强化安全意识，推动数字经济更好服务和融入新发展格局。要提高全民全社会数字素养和技能，夯实我国数字经济发展社会基础。\n填入画横线部分最恰当的一项是：","options":{"A":"数字经济事关国家发展大局","B":"要把发展数字经济自主权牢牢掌握在自己手中","C":"数字经济影响程度之深前所未有","D":"数字经济有利于推动各级资源要素快速流动"},"answer":"A","explanation":"横线出现在文段开头，需结合后文内容分析。文段首先指出我们要结合我国发展做好数字经济建设，随后提出各级领导干部要推动数字经济更好服务和融入新发展格局，尾句论述要提高全民全社会数字素养和技能，夯实我国数字经济发展社会基础。故文段通过“要”引导对策，从三个方面论述如何做好数字经济建设以推动我国发展，故横线处可以引出数字经济对我国发展的重要性，对应A项。\nB项，“发展数字经济自主权牢牢掌握在自己手中”强调要把握主动性，文段未提及，无中生有，排除；\nC项，强调了数字经济的重要性，但未提及“国家发展”，“影响程度之深”表述不明确，排除；\nD项，“各级资源要素快速流动”文段未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】求是《（讲话）习近平：不断做强做优做大我国数字经济》","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"5445874","cat":"数学运算","stem":"商店销售某种商品，打八折销售时卖2件的利润与按定价销售时卖1件的利润相同，相当于降价120元/件销售时卖3件的利润。问该商品的定价为多少元/件？","options":{"A":"360","B":"450","C":"540","D":"720"},"answer":"B","explanation":"设该商品每件定价为x元，成本为y元，根据题意可得：x-y=（80%x-y）×2······①，x-y=（x-120-y）×3······②，联立①②，解得x=450，即该商品的定价为450元/件。\n故正确答案为B。","no":61,"missingImage":false},{"type":"question","qid":"5445875","cat":"数学运算","stem":"农科院在某村287名淡水鱼养殖人员中开展防病培训和育种培训。已知参加防病培训的养殖人员中，参加育种培训的人数比未参加的多21%；参加育种培训的养殖人员中，参加防病培训的人数比未参加的多76人。问共有多少人未参加任何一项培训？","options":{"A":"21","B":"23","C":"25","D":"27"},"answer":"A","explanation":"根据“参加防病培训的养殖人员中，参加育种培训的人数比未参加的多21%”，可知只参加防病培训的人数是100的倍数。由于总人数为287人，当只参加防病培训的人数是200人时，参加防病培训的共有200×（1+21%）+200＞287人，排除。则只参加防病培训的人数为100人，此时既参加防病培训又参加育种培训的有100×（1+21%）=121人，只参加育种培训的有121-76=45人。未参加培训的人数=总数-只参加防病培训的人数-只参加育种培训的人数-两者都参加的人数=287-100-45-121=21人，即共有21人未参加任何一项培训。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"5445877","cat":"数学运算","stem":"社区计划采购10份年货礼包发放给10户独居老人，每户发放1份。年货礼包有100元/份和150元/份的两种供选择，总预算不能超过1250元。如采购了150元/份的年货礼包，则需要优先在3户孤寡老人中选择发放对象。问共有多少种不同的发放方式？","options":{"A":"21","B":"28","C":"36","D":"55"},"answer":"C","explanation":"设购买150元/份的年货礼包x份，则购买100元/份的年货礼包（10-x）份，故可列式：\u003cimg data-k=\"e7ee04814190\">，解得：\u003cimg data-k=\"068505db5079\">。因此年货礼包采购数量情况可分为以下6类：\n（1）150元的0份，100元的10份，有\u003cimg data-k=\"74741a536237\">种发放方式；\n（2）150元的1份，100元的9份，有\u003cimg data-k=\"45e3b2eceead\">种不同的发放方式；\n（3）150元的2份，100元的8份，有\u003cimg data-k=\"d2967eebf331\">种不同的发放方式；\n（4）150元的3份，100元的7份，有\u003cimg data-k=\"83fbe40ed773\">种发放方式；\n（5）150元的4份，100元的6份，有\u003cimg data-k=\"c44d505281a5\">种不同的发放方式；\n（6）150元的5份，100元的5份，有\u003cimg data-k=\"93670a4de40e\">种不同的发放方式。\n分类用加法，共有1+3+3+1+7+21=36种不同的发放方式。\n故正确答案为C。","no":63,"missingImage":false},{"type":"question","qid":"5445879","cat":"数学运算","stem":"甲和乙两个工程队共同承担某项工程的施工任务。两队合作时各自的效率均比单独施工时高20%。已知两队合作施工需要25天完工；如甲先施工15天后乙加入，两队合作15天后剩余工作乙单独施工还需要10天完成。问甲队的效率是乙队的多少倍？","options":{"A":"\u003cimg data-k=\"4ee864913a4b\">","B":"\u003cimg data-k=\"e3b01bf26d59\">","C":"\u003cimg data-k=\"54d707f15b45\">","D":"\u003cimg data-k=\"ff1b1de9ab8e\">"},"answer":"D","explanation":"设甲队和乙队单独施工时的效率分别为x、y，根据题意可知：甲队和乙队合作施工时的效率分别为1.2x、1.2y。根据工程总量相等，则（1.2x+1.2y）×25=15x+（1.2x+1.2y）×15+10y，解得\u003cimg data-k=\"d91081bff66a\">，即甲队的效率是乙队的\u003cimg data-k=\"ff1b1de9ab8e\">。\n故正确答案为D。","no":64,"missingImage":false},{"type":"question","qid":"5445716","cat":"数学运算","stem":"公园里有一片四边形草坪，沿对角线修建的小道相交于O点，O到四个顶点A、B、C、D的距离之比正好为1：2：3：4，一名工人花费1天正好完成AOB区域的修剪，问第二天至少需要额外增加多少名效率相同的工人一起工作，才能在当天内完成剩余草坪的修剪？\n\u003cimg data-k=\"3c8936527a5d\" style=\"max-width:178px\">","options":{"A":"8","B":"10","C":"11","D":"12"},"answer":"B","explanation":"根据题意，设\u003cimg data-k=\"cc6c58aaa773\">的面积为S。因为\u003cimg data-k=\"cc6c58aaa773\">与\u003cimg data-k=\"8b219c70504d\">的高相同，底边BO：DO=2：4=1：2，根据结论“两个三角形的高相同，面积之比等于底之比”可得：\u003cimg data-k=\"66d8e655f7a1\">；同理，\u003cimg data-k=\"8b219c70504d\">与\u003cimg data-k=\"fedac096f80c\">的高相同，底边AO：CO=1：3，则\u003cimg data-k=\"b9d4c6f97490\">\u003cimg data-k=\"e79f47696ef8\">；\u003cimg data-k=\"cc6c58aaa773\">与\u003cimg data-k=\"dd07c372644c\">的高相同，底边AO：CO=1：3，则\u003cimg data-k=\"9a697329f687\">。故四边形ABCD的面积=S+2S+6S+3S=12S。根据题意可知，一名工人花费1天正好完成AOB区域的修剪，即一名工人花费1天修剪的面积为S，剩余面积为12S-S=11S，则要在第二天完成修剪至少需要11S÷S=11名效率相同的工人，故至少需要额外增加11-1=10名效率相同的工人一起工作。\n故正确答案为B。","no":65,"missingImage":false},{"type":"question","qid":"5445881","cat":"数学运算","stem":"甲和乙两人8：00同时从A地出发前往B地，其中乙全程匀速，甲出发时的速度是乙的一半，但全程均匀加速。已知10：00甲追上乙，11：00甲到达B地。问乙什么时间到达B地？","options":{"A":"11：30","B":"11：45","C":"12：00","D":"12：15"},"answer":"B","explanation":"赋值出发时甲的速度为1，乙的速度为2。从8：00至10：00，甲和乙的路程相同，即该时段甲的平均速度=乙的速度=2。根据匀加速运动的平均速度\u003cimg data-k=\"20b596462f3b\">，则10：00时甲的速度为2×2-1=3。因此，甲的速度每小时增加\u003cimg data-k=\"5a88cc2642e0\">，故甲11：00时的速度为3+1=4。根据甲可计算，从A地到B地的路程为\u003cimg data-k=\"a2cbb7182e88\">，则乙全程所需时间为\u003cimg data-k=\"eff178ce6a0a\">小时\u003cimg data-k=\"6a92b46d1a23\">小时=3小时45分钟，即乙在11：45到达B地。\n故正确答案为B。","no":66,"missingImage":false},{"type":"question","qid":"5445876","cat":"数学运算","stem":"工厂从某周第一天开始生产某种零件，每周生产7天，从第二天开始每一天都比前一天多生产200件。已知工厂第三周的产量是第一周的2倍，问第几天其日产量第一次达到1万件？","options":{"A":"37","B":"38","C":"39","D":"40"},"answer":"D","explanation":"根据题意可知，每天的零件产量构成等差数列。设第一天的零件产量为x件，根据等差数列通项公式\u003cimg data-k=\"495a8c0505f2\">，可得第一周第四天的零件产量\u003cimg data-k=\"b8ab999f3721\">件。结合等差数列求和公式\u003cimg data-k=\"94152fe2dbfd\">，则第一周的零件产量\u003cimg data-k=\"528f4e7058d5\">件。同理，第三周第四天的产量（即第18天）的产量\u003cimg data-k=\"41172d42e3a6\">件，则第三周的产量\u003cimg data-k=\"892d62197412\">件。根据“第三周的产量是第一周的2倍”可列式：7x+23800=2（7x+4200），解得x=2200。设该工厂第n天的日产量第一次达到1万件，则可列式：2200+（n-1）×200=10000，解得n=40，即第40天其日产量第一次达到1万件。\n故正确答案为D。","no":67,"missingImage":false},{"type":"question","qid":"5445880","cat":"数学运算","stem":"从A地前往B地的道路前40%的路程为上坡路，其余为下坡路。张某驾驶满载的汽车从A地去B地卸货，然后空车返回A地。已知他满载时上坡的速度是下坡速度的一半，空车时上、下坡的速度分别是满载时的1.5倍和1.2倍。问他返程的用时是去程的多少倍？","options":{"A":"\u003cimg data-k=\"7dc7ea6810bf\">","B":"\u003cimg data-k=\"d310323cfa88\">","C":"\u003cimg data-k=\"51a31561e09a\">","D":"\u003cimg data-k=\"1f1561651a22\">"},"answer":"C","explanation":"赋值去程上坡路段长度为40，则去程下坡路段长度为60；赋值满载时上坡的速度为1，则满载时下坡速度为2。根据题意可知，空车时上坡速度=满载时上坡速度×1.5=1×1.5=1.5，空车时下坡速度=满载时下坡速度×1.2=2×1.2=2.4。去程时间为\u003cimg data-k=\"eaf4dff62e12\">，返程时间为\u003cimg data-k=\"a8c681d40e36\">，则所求倍数\u003cimg data-k=\"7b7ad1bfd6cd\">。\n故正确答案为C。","no":68,"missingImage":false},{"type":"question","qid":"5445882","cat":"数学运算","stem":"甲、乙两名职工负责国庆7天长假的值班工作，每天安排1人值班。已知乙至少值了2天班，且在国庆期间任一天结束后，甲的累计值班天数都比乙的多。问两人的值班日期安排有多少种不同的可能？","options":{"A":"6","B":"9","C":"10","D":"14"},"answer":"D","explanation":"因乙至少值了2天班，且在国庆期间任一天结束后，甲的累计值班天数都比乙的多，则乙值班2天或者3天，且乙最早从第三天开始值班。分情况讨论如下：\n①乙值班2天：当乙从第三天开始值班时，则剩下的1天可以从第五天、第六天和第七天中选1天，有3种情况；当乙从第四天开始值班时，则剩下的1天可以从第五天、第六天和第七天中选1天，有3种情况；当乙从第五天开始值班时，则剩下的1天可以从第六天和第七天中选1天，有2种情况；当乙从第六天开始值班时，则剩下的1天为第七天，有1种情况，共有3+3+2+1=9种情况；\n②乙值班3天：当乙从第三天开始值班时，则剩下的2天可以为第五天和第七天、第六天和第七天，有2种情况；当乙从第四天开始值班时，则剩下的2天可以为第五天和第七天、第六天和第七天，有2种情况；当乙从第五天开始值班时，则剩下的2天为第六天和第七天，有1种情况，共有2+2+1=5种情况。\n因此，两人的值班日期安排有9+5=14种不同的可能。\n故正确答案为D。","no":69,"missingImage":false}],"count":9,"answerable":9,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>6天休假期间，单位需要每天安排一人值班。财务、研发、人事、后勤、法务和销售6个部门各推荐了2人，值班人员从这12人中选择，每人至多值班一天。安排要求：\u003c/p>\u003cp>（1）第二天和第四天不安排法务部门的人值班；\u003c/p>\u003cp>（2）若安排后勤部门的人值班，则只能安排在法务部门的人值班的前一天；\u003c/p>\u003cp>（3）若安排研发部门的人值班，则只能安排在后勤部门的人值班的前一天。\u003c/p>","questions":[{"qid":"5445782","cat":"逻辑判断","stem":"关于6天中的人选，以下哪项安排符合上述条件？","options":{"A":"财务、人事、后勤、法务、财务、人事","B":"销售、财务、法务、人事、财务、销售","C":"人事、财务、法务、研发、法务、后勤","D":"法务、销售、人事、后勤、财务、销售"},"answer":"B","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天。\n第二步：根据题干条件进行推理。\n本题题干信息确定，选项信息充分，优先考虑排除法。\n根据条件（1）“法务部\u003cimg data-k=\"645831205161\">第二、四天”，排除A项。\n根据条件（2）“后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天”，排除C、D两项。\n经验证，B项满足题干所有条件，当选。\n故正确答案为B。","no":70,"missingImage":false},{"qid":"5445805","cat":"类比推理","stem":"后勤部门的人可以安排在哪几天值班？","options":{"A":"只有第二天、第四天、第五天","B":"只有第一天、第三天、第五天","C":"只有第二天、第六天","D":"只有第一天、第三天"},"answer":"A","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天。\n第二步：根据题干条件进行推理。\n提问为“可以”，优先考虑代入选项。因为选项表述均为“只有”，说明是要列举后勤部门值班的所有可能情况，此时可以从选项中只出现一次的情况入手，即A项中的“后勤部门的人是否可以安排在第四天”，如果可以，即A项当选，如果不可以，即排除A项。\n如果后勤部门安排在第四天，根据条件（2）可知，法务部门安排在第五天，题干所有条件均可满足，即后勤部门可以安排在第四天，排除B、C、D三项。\n故正确答案为A。","no":71,"missingImage":false},{"qid":"5445808","cat":"逻辑判断","stem":"如果安排后勤部门的两人值班，则以下哪项一定是错误的？","options":{"A":"第一天安排研发部门的人值班","B":"第六天安排人事部门的人值班","C":"第三天安排财务部门的人值班","D":"第五天安排法务部门的人值班"},"answer":"C","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天；\n（4）后勤有两人值班。\n第二步：根据题干条件进行推理。\n条件（4）表明后勤有两人值班，结合条件（2）可知，法务也应有两人值班，且后勤紧挨在法务值班的前一天，据此可知，法务不能安排在第一天。\n再结合条件（1）可知，法务的两人只能安排在第三天、第五天、第六天这三天中的两天。由于法务两人值班的前一天均应是后勤的人在值班，所以法务的两人不能同时安排在第五天和第六天，因此法务一定有一人是安排在第三天的，则C项第三天安排财务部门的人值班是错误的。\n本题为选非题，故正确答案为C。","no":72,"missingImage":false},{"qid":"5445817","cat":"类比推理","stem":"如果在第三天、第五天分别安排两个财务部门的人值班，则第一天、第六天可安排的值班人员可能分别来自：","options":{"A":"后勤部门和法务部门","B":"法务部门和销售部门","C":"财务部门和销售部门","D":"研发部门和人事部门"},"answer":"B","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天；\n（4）在第三天、第五天分别安排两个财务部门的人值班。\n第二步：根据题干条件进行推理。\n提问方式为“可能”，优先使用代入法。\n代入A项：如果第一天、第六天安排的值班人员分别来自后勤部门和法务部门，根据条件（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天，可知第二天为法务，不满足条件（1），排除；\n代入B项：如果第一天、第六天安排的值班人员分别来自法务部门和销售部门，根据条件（4）在第三天、第五天分别安排财务，根据条件（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天，可知第二天和第四天不能安排后勤，根据条件（1），可知第二天和第四天不能安排法务，根据条件（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天，可知第二天和第四天不能安排研发，所以第二天和第四天可以安排人事或者销售，可进行如下安排，满足题干条件，当选；\n\u003cimg data-k=\"c52329b09348\" style=\"max-width:685px\">\n代入C项：如果第一天、第六天安排的值班人员分别来自财务部门和销售部门，此时第一天、第三天和第五天安排的值班人员均来自财务部门，不符合题干条件“6个部门各推荐2人”，不满足题干条件，排除；\n代入D项：如果第一天、第六天安排的值班人员分别来自研发部门和人事部门，根据条件（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天，可知第二天的值班人员来自后勤部门，根据条件（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天，可知第三天的值班人员来自法务部门，此时不符合条件（4）“第三天安排财务部门的人值班”，不满足题干条件，排除。\n故正确答案为B。","no":73,"missingImage":false},{"qid":"5445818","cat":"逻辑判断","stem":"如果没有安排财务和后勤部门的人值班，则以下哪项一定是正确的？","options":{"A":"第四天安排销售部门的人值班","B":"第五天安排法务部门的人值班","C":"第二天安排销售部门或者人事部门的人值班","D":"第三天安排法务部门或者人事部门的人值班"},"answer":"C","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天；\n（4）没有安排财务和后勤部门的人值班。\n第二步：根据题干条件进行推理。\n根据条件（4）没有安排后勤部门的人值班，可知研发部门不可能安排在后勤部门的前一天，结合条件（3）可知，没有安排研发部门的人值班。此时已知没有安排研发、财务和后勤这3个部门的人值班，结合题干开头给出的信息可知，值班人员只能从剩下的人事、法务、销售这3个部门中选择。再结合条件（1）可知，第二天不能安排法务部门的人值班，所以第二天只能安排销售部门或者人事部门的人值班。\n故正确答案为C。","no":74,"missingImage":false},{"qid":"5445855","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"6daa50a05e49\" style=\"max-width:584px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，优先考虑属性规律。观察发现，整体无规律，题干所有图形均由黑球和白球构成，考虑黑白分开看，继续观察发现，每幅图形的白色区域均为轴对称图形，且对称轴每次顺时针旋转\u003cimg data-k=\"5f65827c69cc\">，因此？处图形的白色区域应为轴对称图形，且对称轴应为竖直方向。B项图形的白色区域为轴对称图形，但对称轴为水平方向，C、D两项图形的白色区域为非对称图形，均排除。只有A项符合。\n\u003cimg data-k=\"b9b1d777264d\" style=\"max-width:583px\">\n故正确答案为A。","no":75,"missingImage":false},{"qid":"5445797","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"9e36759fbb21\" style=\"max-width:581px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"图形元素组成不同，无明显属性规律，考虑数量规律。题干图形明显被分割，优先考虑面数量，发现题干图形均为4个面，据此排除A项；继续观察发现题干图形均由几个图形拼接而成，还可以考虑图形间关系。题干图形均有一个黑块，观察发现题干图形中黑块均与3个白块存在公共边，选项中只有C项符合。\n故正确答案为C。","no":76,"missingImage":false},{"qid":"5445839","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"dd0f96b5815b\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"题干图形均由相同数量的黑色三角形和被分成5行的矩形框架组成，元素组成相同，优先考虑位置规律。观察发现，每幅图形分行明显，优先按行看。黑色三角形于其所在行内每次向右移动一格，且移动到最右侧时循环走，回到最左侧从头 再来，方向不变继续向右移动，排 C、D两项。继续观察发现，黑色三角形在移动的过程中依次顺时针旋转 90°，排除B项，只有A项符合。\n故正确答案为A。","no":77,"missingImage":false},{"qid":"5445842","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"e72a4f35e070\" style=\"max-width:489px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"题干每行图形元素组成相似，优先考虑样式规律。九宫格中优先横向看，第一行中，图一和图二求异得到图三；经验证，第二行也满足此规律；第三行应用此规律，图一和图二求异，只有C项符合。\n故正确答案为C。","no":78,"missingImage":false},{"qid":"5445843","cat":"图形推理","stem":"下图是给定的立体图形（大圆柱内的虚线部分为挖空部分），将其从任一面剖开，下面哪一项不可能是该立体图形的截面？\n\u003cimg data-k=\"e7ae00e0446e\" style=\"max-width:493px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查截面图。逐一分析选项。\nA项：无法截出，当选；\nB项：如下图所示，从上方圆柱向下经过空心圆柱竖切，可以截出，排除；\n\u003cimg data-k=\"3e98f6ff9786\" style=\"max-width:256px\">\nC项：如下图所示，从上方圆柱向下经过空心圆柱斜切，可以截出，排除；\n\u003cimg data-k=\"e8f572789415\" style=\"max-width:283px\">\nD项：如下图所示，斜切下方圆柱同时经过空心部分，可以截出，排除。\n\u003cimg data-k=\"e3c695f5f107\" style=\"max-width:248px\">\n本题为选非题，故正确答案为A。","no":79,"missingImage":false},{"qid":"5445822","cat":"图形推理","stem":"将一张直角三角形形状的纸片进行两次折叠，展开后的折痕将该三角形分成如图所示的a、b、c、d四个部分，则两次折叠后的纸片投影面积为：\n\u003cimg data-k=\"eb9bfd252e21\" style=\"max-width:363px\">","options":{"A":"b+d+c-a","B":"b+d-c","C":"b+c-a","D":"b+d-a"},"answer":"D","explanation":"第一步，将直角三角形先沿水平折痕进行折叠，即将面c和面d向下折叠，覆盖面b和面a，得到如下图形，此时折叠后面积为：b+d；\n\u003cimg data-k=\"f8fa35908807\" style=\"max-width:316px\">\n第二步，将直角三角形沿着竖直折痕进行折叠，即将面b和面c向右折叠，覆盖面d和面a，得到如下图形，此时折叠后面积为：d+b-a。\n\u003cimg data-k=\"3fd2d478e850\" style=\"max-width:223px\">\n故正确答案为D。","no":80,"missingImage":false},{"qid":"5445798","cat":"图形推理","stem":"左图为等大的3个灰色正方体和15个白色正方体组合成的多面体，其可以切割为①、②和③三个小多面体，问③代表的多面体可能是：\n\u003cimg data-k=\"71b5912122c2\" style=\"max-width:570px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查立体拼合。如下图所示，将图①、图②进行旋转，结合A项，即可拼合成为左图的多面体。\n\u003cimg data-k=\"5b991e427b43\" style=\"max-width:585px\">\n\u003cimg data-k=\"736e1d4a45b1\" style=\"max-width:500px\">\n故正确答案为A。","no":81,"missingImage":false},{"qid":"5445768","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"02bdbdf7af29\" style=\"max-width:547px\">","options":{"A":"①③⑤，②④⑥","B":"①④⑥，②③⑤","C":"①③④，②⑤⑥","D":"①②④，③⑤⑥"},"answer":"D","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图2为“日”字变形图，图3为多端点图形，优先考虑笔画数。图①②④为一笔画图形，图③⑤⑥为两笔画图形，即图①②④为一组，图③⑤⑥为一组。\n故正确答案为D。","no":82,"missingImage":false},{"qid":"5445852","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"f497d79b81fe\" style=\"max-width:531px\">","options":{"A":"①⑤⑥，②③④","B":"①④⑥，②③⑤","C":"①②⑥，③④⑤","D":"①③④，②⑤⑥"},"answer":"B","explanation":"本题为分组分类题目。元素组成相同，但无明显位置规律和属性规律，考虑数量规律。观察发现，题干每个图形均存在黑球或白球被分隔开的情况，考虑部分数。图①④⑥中，黑球的部分数均为1，白球的部分数均为3；图②③⑤中，黑球的部分数均为3，白球的部分数均为1。即图①④⑥为一组，图②③⑤为一组。\n故正确答案为B。","no":83,"missingImage":false},{"qid":"5445799","cat":"图形推理","stem":"把下面六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"930786362135\" style=\"max-width:557px\">","options":{"A":"①②⑤，③④⑥","B":"①②④，③⑤⑥","C":"①④⑤，②③⑥","D":"①③⑤，②④⑥"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形基本都由圆和正方形构成，优先考虑元素的个数，圆的数量依次为5、0、1、3、4、2，正方形的数量依次为4、1、2、2、3、3，单独看数量无规律，考虑二者运算图①④⑤中，圆的数量-正方形的数量=1；图②③⑥中，正方形的数量-圆的数量=1。故图①④⑤为一组，图②③⑥为一组。\n故正确答案为C。","no":84,"missingImage":false},{"qid":"5445804","cat":"定义判断","stem":"微量鉴定是指运用物理学、化学和仪器分析等方法，通过对案件现场有关物质材料（材料特点多为体小量微、不易注意）的成分及其结构进行定性、定量分析，对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定。\n根据以上定义，下列涉及交通事故的鉴定属于微量鉴定的是：","options":{"A":"对车辆驾驶人采血，分析血液中的酒精含量，判断驾驶人是否存在酒后驾车嫌疑","B":"现场提取、检验受害人毛发、衣物纤维，认定受害人是否与嫌疑人车辆存在接触","C":"拆解车辆特定部位，查明车辆故障原因，用以鉴定其属于人为责任还是机械故障","D":"通过人体损伤程度检验，确定伤害损伤部位与交通事故伤害后果的关联程度"},"answer":"B","explanation":"第一步：找出定义关键词。\n“对案件现场体小量微、不易注意的物质材料成分及其结构进行分析”、“对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定”。\n第二步：逐一分析选项。\nA项：对车辆驾驶人采血，分析血液中的酒精含量，“血液”不符合“体小量微、不易注意的物质材料”，并且也不涉及与嫌疑样本的比对，不符合定义，排除；\nB项：现场提取、检验受害人毛发、衣物纤维，“毛发，衣物纤维”符合“体小量微、不易注意的物质材料”，认定受害人是否与嫌疑人车辆存在接触，符合“对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定”，符合定义，当选；\nC项：拆解车辆特定部位，查明车辆故障原因，“车辆特定部位”不符合“体小量微、不易注意的物质材料”，并且也不涉及与嫌疑样本的比对，不符合定义，排除；\nD项：通过人体损伤程度检验，确定伤害损伤部位与交通事故伤害后果的关联程度，“人体”不符合“体小量微、不易注意的物质材料”，并且也不涉及与嫌疑样本的比对，不符合定义，排除。\n故正确答案为B。","no":85,"missingImage":false},{"qid":"5445845","cat":"定义判断","stem":"政策工具是指实现政策目标所要运用的手段与方法。政策工具可分为以下三种：\n（1）供给型政策工具，对政策目标起直接促进作用，通常体现政府的重要政策导向，包含资金、人才、设施、技术、信息等方面的有效支持；（2）需求型政策工具，对政策目标起到拉动作用，释放对政策目标的需求，减少外部干扰，包括服务外包、直接采购、国际交流与贸易管制等；（3）环境型政策工具，对政策目标起到间接促进作用，通常体现为通过目标、计划、法规、金融与税收等方式提供有利的政策环境，包括目标规划、金融服务、税收优惠、法规管制以及策略性措施等。\n根据上述定义，下列属于促进养老服务的需求型政策工具的是：","options":{"A":"政府向养老机构购买居家养老服务，为低保家庭60周岁以上失能老人提供服务","B":"政府提供资金建设社区食堂，解决失能、独居、空巢等老年人“舌尖养老”难题","C":"政府鼓励技工院校开设老年服务与管理、健康服务与管理、护理等养老服务相关专业","D":"商务部发布《关于推动养老服务产业发展的指导意见》，提出打造养老服务品牌"},"answer":"A","explanation":"第一步：找出定义关键词。\n供给型政策工具：“对政策目标起直接促进作用”、“通常体现政府的重要政策导向”、“包含资金、人才、设施、技术、信息等方面的有效支持”；\n需求型政策工具：“对政策目标起到拉动作用，释放对政策目标的需求，减少外部干扰”、“包括服务外包、直接采购、国际交流与贸易管制等”；\n环境型政策工具：“对政策目标起到间接促进作用”、“通常体现为通过目标、计划、法规、金融与税收等方式提供有利的政策环境”、“包括目标规划、金融服务、税收优惠、法规管制以及策略性措施等”。\n第二步：逐一分析选项。\nA项：政府向养老机构购买居家养老服务，体现了将服务外包给养老机构，符合“对政策目标起到拉动作用，释放对政策目标的需求，减少外部干扰”、“包括服务外包、直接采购、国际交流与贸易管制等”，符合“需求型政策工具”定义，当选；\nB项：政府提供资金建设社区食堂，说明政府直接提供资金支持，不符合“包括服务外包、直接采购、国际交流与贸易管制等”，不符合“需求型政策工具”定义，符合“供给型政策工具”定义，排除；\nC项：政府鼓励技工院校开设养老服务相关专业，说明进行人才培养，提供人才支持，不符合“包括服务外包、直接采购、国际交流与贸易管制等”，不符合“需求型政策工具”定义，符合“供给型政策工具”定义，排除；\nD项：国务院发布《关于推动养老服务产业发展的指导意见》，说明提供有利的政策环境，提出目标规划，不符合“包括服务外包、直接采购、国际交流与贸易管制等”，不符合“需求型政策工具”定义，符合“环境型政策工具”定义，排除。\n故正确答案为A。","no":86,"missingImage":false},{"qid":"5445821","cat":"定义判断","stem":"民宿是指利用当地民居等相关闲置资源，经营用客房不超过4层、建筑面积不超过800平方米，主人参与接待，为游客提供体验当地自然、文化与生产生活方式的小型住宿设施。\n根据上述定义，下列属于民宿的是：","options":{"A":"王某在市中心有一套两居室的房子，过了马路就是知名的景区公园。王某将闲置房间租给那些节假日来旅游的家庭，并提供导游服务","B":"某家庭农场开发亲子休闲旅游业务，建设了农业科普、亲子游玩场所，为孩子和家长营造一处寓教于乐的乡村乐园","C":"李某通过某网上平台找到心仪城市的会员“交换”旅行，即双方各自为对方提供住宿，住在对方家中深入体验当地的风土人情","D":"张某在古镇上有一所老宅。他和某平台签订合同，将老宅租给该平台运营。该平台将老宅装修，并提供完善的酒店式服务机制"},"answer":"A","explanation":"第一步：找出定义关键词。\n“利用当地民居等相关闲置资源”、“经营用客房不超过4层、建筑面积不超过800平方米”、“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”。\n第二步：逐一分析选项。\nA项：王某有一套两居室的房子，将闲置房间租给旅游家庭，符合“利用当地民居等相关闲置资源”、“经营用客房不超过4层、建筑面积不超过800平方米”，并提供导游服务，符合“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”，符合定义，当选；\nB项：某家庭农场开发亲子休闲旅游业务，未提及该农场是否为闲置资源，不符合“利用当地民居等相关闲置资源”，也未提及该农场是否有经营用客房，不符合“经营用客房不超过4层、建筑面积不超过800平方米”，建设了农业科普、亲子游玩场所，不符合“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”，不符合定义，排除；\nC项：李某与心仪城市的会员“交换”旅行，双方各自为对方提供住宿，说明双方是互相为对方提供住宿，而非用于经营，不符合“经营用客房”，不符合定义，排除；\nD项：张某将古镇的老宅租给某平台，符合“利用当地民居等相关闲置资源”，将老宅租给该平台运营，由该平台提供完善的酒店式服务机制，说明该老宅的主人张某并不提供接待服务，不符合“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”，不符合定义，排除。\n故正确答案为A。","no":87,"missingImage":false},{"qid":"5445862","cat":"定义判断","stem":"背信规避是指当风险来源为另一个体而不是自然条件时，人们普遍更不愿意冒险，即在同等条件下，人们对于人为风险的规避程度高于对客观风险的规避程度，体现在人们面对人为风险时比面对客观风险时表现得更保守。\n根据上述定义，下列没有体现背信规避的是：","options":{"A":"在对客观题阅卷方式意愿的调查中，学生更愿意选择机器阅卷而非人工阅卷","B":"决定谁先开球时，双方球员都倾向于由裁判抛硬币决定而非裁判随机指定","C":"在老师打算指派一个人多承担一项任务时，同学们纷纷表示要抽签决定","D":"与老司机相比，坐新手司机开的车时，后排座上的乘客主动系安全带的更多"},"answer":"D","explanation":"第一步：找出定义关键词。\n定义中比较易懂的关键词在于：“风险来源为另一个体而不是自然条件时”、“人为风险的规避程度高于对客观风险的规避程度”。\n第二步：逐一分析选项。\nA项：在客观题阅卷方式中，学生更愿意选择机器阅卷而非人工阅卷，机器阅卷对应客观风险，人工阅卷对应人为风险，“学生更愿意选择机器阅卷而非人工阅卷”，符合“人为风险的规避程度高于对客观风险的规避程度”，符合定义，排除；\nB项：在决定谁先开球时，双方球员都倾向于由裁判抛硬币决定而非裁判随机指定，抛硬币对应客观风险，裁判指定对应人为风险，“双方球员都倾向于由裁判抛硬币决定而不是裁判指定”，符合“人为风险的规避程度高于对客观风险的规避程度”，符合定义，排除；\nC项：在老师打算指派一个人多承担一项任务时，同学们纷纷表示要抽签决定，抽签对应客观风险，老师指派对应人为风险，“同学们纷纷表示要抽签决定”，符合“人为风险的规避程度高于对客观风险的规避程度”，符合定义，排除；\nD项：与老司机相比，坐新手司机开的车时，后排座上的乘客主动系安全带的更多，老司机开车与新手司机开车都对应人为风险，没有体现客观风险，“坐新手司机开的车时后排座上的乘客主动系安全带的更多”，只是人为风险规避程度的比较，不符合“人为风险的规避程度高于对客观风险的规避程度”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":88,"missingImage":false},{"qid":"5445859","cat":"定义判断","stem":"小中取大法是指在决策时，首先计算各方案在不同自然状态下的收益，并找出各方案在最差自然状态下的收益，然后进行比较，选择在最差自然状态下收益最大或损失最小的方案作为最终方案的一种决策方法。大中取大法是指在决策时，首先计算各方案在不同自然状态下的收益，并找出各方案在最好自然状态下的收益，然后进行比较，选择在最好自然状态下收益最大的方案作为最终方案的一种决策方法。\n\u003cimg data-k=\"2e3ebfd87d45\" style=\"max-width:600px\">\n根据上述定义，分别使用小中取大法和大中取大法对上述方案进行决策，所选择的方案依次是：","options":{"A":"方案二和方案二","B":"方案二和方案一","C":"方案三和方案一","D":"方案三和方案二"},"answer":"D","explanation":"第一步：找出定义关键词。\n小中取大法：“找出各方案在最差自然状态下的收益”、“选择在最差自然状态下收益最大或损失最小的方案”；\n大中取大法：“找出各方案在最好自然状态下的收益”、“选择在最好自然状态下收益最大的方案作为最终方案”。\n第二步：逐一分析选项。\n依据设问使用“小中取大法”，需要符合“找出各方案在最差自然状态下的收益”、“选择在最差自然状态下收益最大或损失最小的方案”，表格中销路差此列对应的数据就是最差自然状态下的收益，方案三是销路差中收益最大的方案，因此根据“小中取大法”应选择方案三；\n依据设问使用“大中取大法”，需要符合“找出各方案在最好自然状态下的收益”、“选择在最好自然状态下收益最大的方案作为最终方案”，表格中销路好此列对应的数据就是最好自然状态下的收益，方案二是销路好中收益最大的方案，因此根据“大中取大法”应选择方案二，只有D项符合。\n故正确答案为D。","no":89,"missingImage":false},{"qid":"5445848","cat":"定义判断","stem":"异业合作是指两个或两个以上不同行业的企业，通过分享市场营销中的资源，以达到降低成本、提高效率、增强市场竞争力等目的的一种营销策略。\n根据上述定义，下列体现了异业合作的是：","options":{"A":"某集团下属的两家餐饮公司通过公众号互推产品信息，提升了各自的品牌影响力","B":"某互联网公司和商业银行共同发行联名信用卡，办卡成员将享受更大购物优惠","C":"某日用品企业将不同尺寸的收纳盒组成套装促销，销量剧增，其他企业也纷纷效仿","D":"某运动品牌在奥运会期间推出绘有奥运标志的限量款球鞋，搭配赠送新奥运吉祥物"},"answer":"B","explanation":"第一步：找出定义关键词。\n“两个或两个以上不同行业的企业”、“分享市场营销中的资源”、“降低成本、提高效率、增强市场竞争力”。\n第二步：逐一分析选项。\nA项：某集团下属的两家餐饮公司，都是餐饮行业，不符合“两个或两个以上不同行业的企业”，不符合定义，排除；\nB项：某互联网公司和商业银行，分属两个不同的行业，符合“两个或两个以上不同行业的企业”，共同发行联名信用卡，符合“分享市场营销中的资源”，办卡成员将享受更大购物优惠，说明可以通过更大的购物优惠来吸引客户办卡，增强市场竞争力，符合“降低成本、提高效率、增强市场竞争力”，符合定义，当选；\nC项：某日用品企业将不同尺寸的收纳盒组成套装促销的行为被其他企业效仿，说明其他企业也卖收纳盒，没有体现出是不同的行业，不符合“两个或两个以上不同行业的企业”，且其他企业只是效仿该企业的做法，并没有涉及到“分享市场营销中的资源”，不符合定义，排除；\nD项：某运动品牌在奥运会期间推出绘有奥运标志的限量款球鞋，搭配赠送新奥运吉祥物，只涉及某运动品牌一个企业，不符合“两个或两个以上不同行业的企业”，不符合定义，排除。\n故正确答案为B。","no":90,"missingImage":false},{"qid":"5445856","cat":"定义判断","stem":"植物病害分为侵染性病害和非侵染性病害。侵染性病害是由病原物引起的，可以在植物个体间互相传染的病害；非侵染性病害是由于环境不良、营养元素不足等非生物因素造成的病害，由于没有病原物的侵袭，所以不会在植物间相互传染。\n根据上述定义，下列属于非侵染性病害的是：\n①需要微酸性生长环境的杜鹃花，种植在偏碱性土壤中，叶片会黄化\n②植株浇水过多，盆土积水后，由于植株根系缺氧，会导致植株萎蔫\n③除草剂使用不当会引起西瓜苗嫩叶黄化，叶片枯焦，植株萎缩\n④灰葡萄孢真菌会引起番茄灰霉病，发病后造成番茄大量烂果","options":{"A":"仅①④","B":"仅①②","C":"仅①②③","D":"仅②③④"},"answer":"C","explanation":"第一步：找出定义关键词。\n侵染性病害：“由病原物引起”、“可以在植物个体间互相传染”；\n非侵染性病害：“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”。\n第二步：逐一进行分析。\n①：杜鹃花由于生长在偏碱性土壤环境中而导致其叶片黄化，其中偏碱性土壤属于环境因素，符合“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”，符合“非侵染性病害”的定义；\n②：植株由于盆土积水后，根系缺氧导致其萎蔫，其中盆土积水属于环境因素，符合“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”，符合“非侵染性病害”的定义；\n③：西瓜苗由于除草剂使用不当而导致其嫩叶黄化等后果，其中除草剂使用不当属于非生物因素，符合“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”，符合“非侵染性病害”的定义；\n④：番茄大量烂果是由灰葡萄孢真菌引起的，其中灰葡萄孢真菌属于病原物，而不是非生物因素，并且番茄因感染灰霉病而大量烂果，符合“由病原物引起”、“可以在植物个体间互相传染”，符合“侵染性病害”定义，不符合“非侵染性病害”的定义。\n综上，仅①②③符合“非侵染性病害”的定义。\n故正确答案为C。","no":91,"missingImage":false},{"qid":"5445786","cat":"定义判断","stem":"联合式构词法是由两个意义相同、相反或相对的词根联合起来构成新词的方法，在词内两个词根是平等的，没有主从、正副之分。\n根据上述定义，下列使用了联合式构词法的是：","options":{"A":"“叮当”，因摹拟动作的声音而构成的词","B":"“椅子”，在单字“椅”后面附加“子”而构成的词","C":"“蹉跎”，由韵母相同的两个单字组合构成意义与单字无关的词","D":"“开关”，由“开”和“关”两个单字组合而构成的词"},"answer":"D","explanation":"第一步：找出定义关键词。\n“由两个意义相同、相反或相对的词根联合起来构成新词”、“两个词根是平等的，没有主从、正副之分”。\n第二步：逐一分析选项。\nA项：“叮”和“当”代表两个不同的声音，二者不符合“由两个意义相同、相反或相对的词根联合起来构成新词”，不符合定义，排除；\nB项：“椅子”中侧重于“椅”，即“椅”为主，“子”为从，不符合“两个词根是平等的，没有主从、正副之分”，不符合定义，排除；\nC项：“蹉”的意思有失足、差错等，而“跎”的意思有背负、驼背等，二者不符合“由两个意义相同、相反或相对的词根联合起来构成新词”，不符合定义，排除；\nD项：“开关”是指电器装置上接通和截断电路的设备，“开”有打开的意思，“关”有关闭的意思，二者意思相反且无主从之分，符合“由两个意义相同、相反或相对的词根联合起来构成新词”、“两个词根是平等的，没有主从、正副之分”，符合定义，当选。\n故正确答案为D。","no":92,"missingImage":false},{"qid":"5445858","cat":"定义判断","stem":"细胞学检查是指对患者病变部位脱落、刮取或穿刺抽取的细胞，进行病理形态学的观察并做出定性诊断的检查方式。细胞学检查主要应用于肿瘤的诊断，也可用于某些疾病的检查和诊断，如内部器官炎症性疾病的诊断和激素水平的判定等。\n根据上述定义，下列属于细胞学检查的是：","options":{"A":"采集患者血液样本，分析血细胞比例变化，判断患者是否出现感染","B":"针对外伤患者皮肤纤维细胞的过度增生，实行激光打磨法，抑制炎性细胞浸润，修复再生皮肤组织","C":"通过拉网法收集食道癌患者的食道脱落细胞，鉴定细胞形态，明确癌变性质","D":"对脑疝患者脑室穿刺，放出脑室液以降低脑压，后再次穿刺注入造影剂，诊断其颅内占位病变的情况"},"answer":"C","explanation":"第一步：找出定义关键词。\n“患者病变部位脱落、刮取或穿刺抽取的细胞”、“进行病理形态学的观察”、“做出定性诊断的检查方式”。\n第二步：逐一分析选项。\nA项：采集患者血液样本，分析血细胞比例变化，不涉及病变部位的细胞，不符合“患者病变部位脱落、刮取或穿刺抽取的细胞”，不符合定义，排除；\nB项：激光打磨抑制炎性细胞浸润，修复再生皮肤组织，属于一种治疗方法，而不是定性诊断的检查方式，不符合“做出定性诊断的检查方式”，不符合定义，排除；\nC项：食道癌患者的食道脱落细胞，符合“患者病变部位脱落的细胞”，鉴定细胞形态，符合“进行病理形态学的观察”，明确癌变性质，符合“做出定性诊断的检查方式”，符合定义，当选；\nD项：放出脑室液以降低脑压，后再次穿刺注入造影剂，诊断其颅内占位病变的情况，是通过注入造影剂进行观察诊断，而不是对细胞进行观察诊断，不符合“患者病变部位脱落、刮取或穿刺抽取的细胞”，不符合定义，排除。\n故正确答案为C。","no":93,"missingImage":false},{"qid":"5445800","cat":"定义判断","stem":"预判设计是一种能够引导用户、缩短用户行为路径的有效设计手段。它可以根据用户的行为或用户所在的场景，让功能“主动找到”用户，并让用户与之产生自然的交互，为用户提供更好的使用体验，本质就是为用户多想一步，让用户使用起来尽量简单。\n根据上述定义，下列不属于预判设计的是：","options":{"A":"某购物软件，根据用户输入的搜索关键词，将商品按与关键词的相关性排列","B":"某翻译软件，用户第一次点击播放，语音速度正常；再次点击，语音速度变慢","C":"某外卖软件，当用户对店家给出差评，系统自动勾选“将评价设为匿名评价”","D":"某购物软件，所选商品缺货时，出现“找相似”按钮，点击可看到同款、相似商品"},"answer":"A","explanation":"第一步：找出定义关键词。\n“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”。\n第二步：逐一分析选项。\nA项：用户在购物软件输入搜索关键词以后，购物软件列出与用户搜索关键词相关的商品，此时仅仅是该软件配合了用户的搜索行为，并没有对其下一步行为进行预判，更没有引导用户，不符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，不符合定义，当选；\nB项：某翻译软件第一次点击播放，语速正常，再次点击，语速变慢，体现了产品会预判用户可能是刚刚没听清楚、或者想听清某个词的念法等，从而不用等用户自行操作，而主动将语音播放速度变慢，符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，符合定义，排除；\nC项：某外卖软件，当用户给差评时，系统自动勾选“匿名评价”，因为绝大多数用户给商家差评时都不希望商家看到自己的身份，所以该软件不等用户自行勾选匿名评价，而自动帮用户勾选，缩短了用户行为路径，为用户多想一步，符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，符合定义，排除；\nD项：大多数用户在购物软件上遇到想要的商品缺货时，接下来最可能的就是去找一些相似的商品，所以某购物软件为用户多想了一步，不用等用户自行搜索相似商品，而是当所选商品缺货时，自动出现“找相似”按钮，点击可看到同款、相似商品，符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":94,"missingImage":false},{"qid":"5445781","cat":"类比推理","stem":"小计：总计","options":{"A":"平均值：总值","B":"被乘数：总数","C":"单科分：总分","D":"分目录：总目"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“小计”是数字列表中一部分数字的总和，“总计”是数字列表中所有数字的总和，因此，所有“小计”相加可以得到“总计”，二者是对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“平均值”乘以群体总个数等于“总值”，与题干逻辑关系不一致，排除；\nB项：“被乘数”指乘法中被乘的数字，一般放在算式的前面，“总数”是所有数的总和，二者无明显逻辑关系，与题干逻辑关系不一致，排除；\nC项：所有“单科分”相加可以得到“总分”，二者是对应关系，与题干逻辑关系一致，当选；\nD项：“分目录”指在各部分之前的目录，“总目”指在整个文档之前的目录，“总目”是对“分目录”的汇总，不存在相加的计算关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":95,"missingImage":false},{"qid":"5445863","cat":"类比推理","stem":"猛药去疴：重典治乱","options":{"A":"民生在勤：勤则不匮","B":"从善如登：从恶如崩","C":"静以修身：俭以养德","D":"名非天造：必从其实"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“猛药去疴”意思是通过威力大的药达到去除疾病的目的，“重典治乱”意思是通过严酷的刑罚达到惩治坏人的目的，二者都可指问题很严重，必须采取有力的措施来处理，二者是近义关系，但选项没有近义关系，考虑拆词看结构，“猛药去疴”和“重典治乱”拆词后都能构成方式目的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“民生在勤”的意思是人民的生计在于勤劳，“勤则不匮”意思是勤劳就不会缺乏财物，二者拆词之后不存在方式目的对应关系，与题干逻辑关系不一致，排除；\nB项：“从善如登”意思是顺随良善像登山一样难，比喻学好向善很难，“从恶如崩”意思是顺随恶行像山崩一样容易，比喻学坏很容易，二者拆词之后不存在方式目的对应关系，与题干逻辑关系不一致，排除；\nC项：“静以修身”意思是通过内心安静精力集中来修养身心，“俭以养德”意思是通过俭朴的作风来培养品德，二者拆词后都能构成方式目的对应关系，与题干逻辑关系一致，当选；\nD项：“名非天造”的意思是名称不是天生就有的，“必从其实”的意思是必须依据其客观现实，二者拆词之后不存在方式目的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":96,"missingImage":false},{"qid":"5445873","cat":"类比推理","stem":"强光照射：视力损伤","options":{"A":"台风过境：渔业停产","B":"网络招聘：业务扩张","C":"原油进口：能源紧缺","D":"风险防范：消防演练"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“强光照射”会导致“视力损伤”，二者为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“台风过境”会导致“渔业停产”，二者为因果对应关系，与题干逻辑关系一致，当选；\nB项：“业务扩张”会导致“网络招聘”，二者为因果对应关系，但词语顺序与题干相反，与题干逻辑关系不一致，排除；\nC项：“能源紧缺”会导致“原油进口”，二者为因果对应关系，但词语顺序与题干相反，与题干逻辑关系不一致，排除；\nD项：“风险防范”是“消防演练”的目的，二者为方式与目的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":97,"missingImage":false},{"qid":"5445780","cat":"类比推理","stem":"铜镜：化妆镜","options":{"A":"门帘：纱帘","B":"木碗：汤碗","C":"金簪：发簪","D":"瓷瓶：古瓶"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n铜镜一般是指由含锡量较高的青铜铸造的镜子，化妆镜一般指专门用于化妆的镜子。有的铜镜是化妆镜，有的铜镜不是化妆镜，有的化妆镜是铜镜，有的化妆镜不是铜镜，二者为交叉关系，且前者是根据材质命名，后者是根据功能命名。\n第二步：判断选项词语间逻辑关系。\nA项：有的门帘是纱帘，有的门帘不是纱帘，有的纱帘是门帘，有的纱帘不是门帘，二者为交叉关系，但前者是根据悬挂的位置命名，与题干逻辑关系不一致，排除；\nB项：有的木碗是汤碗，有的木碗不是汤碗，有的汤碗是木碗，有的汤碗不是木碗，二者为交叉关系，且前者是根据材质命名，后者是根据功能命名，与题干逻辑关系一致，当选；\nC项：金簪是发簪的一种，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：古瓶可指古董瓶子或古代的瓶子，有的瓷瓶是古瓶，有的瓷瓶不是古瓶，有的古瓶是瓷瓶，有的古瓶不是瓷瓶，二者为交叉关系，但后者是根据历史时代命名，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":98,"missingImage":false},{"qid":"5445868","cat":"类比推理","stem":"片剂：散剂：气雾剂","options":{"A":"边塞诗：山水诗：抒情诗","B":"口头契约：君子协定：书面协议","C":"泉水：湖水：天然水","D":"头部理疗：腰部理疗：腿部理疗"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n片剂是药物与辅料均匀混合后压制而成的片状或异形片状的固体制剂，散剂是指药物或与适宜的辅料经粉碎、均匀混合制成的干燥粉末状制剂，气雾剂是指药物和抛射剂共同封装于带有阀门的耐压容器中，使用时借抛射剂气化所产生的压力，定量或非定量地将药物以雾状喷出的制剂。三者是根据药物的剂型划分的，为并列关系中的反对关系。\n第二步：判断选项词语间逻辑关系。\nA项：边塞诗是以边疆地区军民生活和自然风光为题材的诗，山水诗是描写山水风景的诗，抒情诗是抒发诗人思想感情的诗，三者互为交叉关系，与题干逻辑关系不一致，排除；\nB项：口头契约是指不用书面的形式，通过口头达成的协议，书面协议指以书面形式达成的协议，二者均以协议形式进行划分，为并列关系，但君子协定是借指彼此之间互相信任的约定，并不是以协议形式进行划分，与另外两词不构成并列关系，与题干逻辑关系不一致，排除；\nC项：泉水是指从地下流出来的水，一般是天然水，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：头部理疗、腰部理疗和腿部理疗是根据理疗的身体部位划分的，三者为并列关系中的反对关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":99,"missingImage":false},{"qid":"5445779","cat":"类比推理","stem":"春季过敏：花粉：喷嚏","options":{"A":"肺炎：咳嗽：支原体","B":"乙型脑炎：病毒：发热","C":"失眠：恐惧：噩梦","D":"秋季腹泻：饮食：脱水"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n花粉可能会导致春季过敏，前两词为因果关系；打喷嚏是春季过敏的症状，第一词和第三词为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：咳嗽是肺炎的症状，前两词为对应关系；支原体感染可能会导致肺炎，第一词和第三词为因果关系，与题干逻辑关系不一致，排除；\nB项：病毒感染可能会导致乙型脑炎，前两词为因果关系；发热是乙型脑炎的症状，第一词和第三词为对应关系，与题干逻辑关系一致，当选；\nC项：恐惧可能会导致失眠，前两词为因果关系；噩梦不是失眠的症状，与题干逻辑关系不一致，排除；\nD项：秋季腹泻指发生在秋冬季的腹泻病，原因可能是饮食不当或饮食不洁，而非饮食，前两词不是因果关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":100,"missingImage":false},{"qid":"5445790","cat":"类比推理","stem":"标清：高清：超清","options":{"A":"亚音速：音速：超音速","B":"厅级：市级：省级","C":"迁怒：愤怒：暴怒","D":"幽静：寂静：安静"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n三者均对清晰度进行分类，构成并列关系，且清晰度依次递增。\n第二步：判断选项词语间逻辑关系。\nA项：三者均对速度进行分类，构成并列关系，且速度依次递增，与题干逻辑关系一致，当选；\nB项：厅级是我国的一个行政级别，而市级和省级属于我国的行政区划，三者不构成并列关系，与题干逻辑关系不一致，排除；\nC项：迁怒为动词，指把怒气发泄到别人身上，愤怒为形容词，指因极度不满而情绪激动，暴怒指极端愤怒，三者不构成并列关系，与题干逻辑关系不一致，排除；\nD项：幽静指清幽寂静，寂静指没有声音、很静，安静指安稳平静、没有声音，三者均是对静的描述，构成并列关系，但不是静的程度从低到高的依次递增，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":101,"missingImage":false},{"qid":"5445777","cat":"类比推理","stem":"资产评估：审核通过：股票发售","options":{"A":"预定新车：加装内饰：购买车险","B":"修剪草坪：设备检修：园林养护","C":"选购家电：上门安装：维修保养","D":"收看节目：视频连线：观众互动"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n先资产评估，再审核通过，最后股票发售，三者为时间先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：先预定新车，但购买车险和加装内饰并无固定的先后顺序，与题干逻辑关系不一致，排除；\nB项：修剪草坪是园林养护的一部分，与题干逻辑关系不一致，排除；\nC项：先选购家电，再上门安装，最后维修保养，三者为时间先后顺序的对应关系，与题干逻辑关系一致，当选；\nD项：视频连线是观众互动的一种方式，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":102,"missingImage":false},{"qid":"5445788","cat":"类比推理","stem":"深空探测 对于 （    ） 相当于 （    ） 对于 公益组织","options":{"A":"无人采样；慈善捐款","B":"遥感技术；红十字会","C":"宇宙空间；公益事业","D":"火星探测；社会组织"},"answer":"D","explanation":"逐一代入选项。\nA项：深空探测是指脱离地球引力场，进入太阳系空间和宇宙空间的探测。探测方式上，一般包括飞越、硬着陆（撞击）、环绕、软着陆（+巡视）、无人采样返回、载人探测等形式，无人采样是一种深空探测的方式，二者为种属关系；公益组织一般为组织慈善捐款的主体，二者为对应关系，前后逻辑关系不一致，排除；\nB项：遥感技术是从人造卫星、飞机或其他飞行器上收集地物目标的电磁辐射信息，判认地球环境和资源的技术，在深空探测中会应用到遥感技术，二者为对应关系；红十字会是公益组织，二者为种属关系，前后逻辑关系不一致，排除；\nC项：深空探测的对象之一是宇宙空间，二者为工作对象的对应关系；公益组织是致力于社会公益事业和解决各种社会性问题的民间志愿性的社会中介组织，公益组织的工作对象之一是公益事业，二者为工作对象的对应关系，但前后顺序相反，前后逻辑关系不一致，排除；\nD项：火星探测是一种深空探测，二者为种属关系；公益组织是一种社会组织，二者为种属关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":103,"missingImage":false},{"qid":"5445853","cat":"类比推理","stem":"缄口不言 对于 （    ） 相当于 （    ） 对于 虚怀若谷","options":{"A":"三缄其口；大智若愚","B":"畅所欲言；放荡不羁","C":"守口如瓶；礼贤下士","D":"口若悬河；矜功伐善"},"answer":"D","explanation":"逐一代入选项。\nA项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。三缄其口形容说话极其谨慎、不轻易开口，二者为近义关系；大智若愚指有智慧有才能的人，看起来好像很愚笨，也比喻有智慧的人极有涵养，不露锋芒。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者不是近义关系，前后逻辑关系不一致，排除；\nB项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。畅所欲言指尽情地说出想说的话，没有约束地把心里话吐露出来，二者为反义关系；放荡不羁意思是放纵任性，不加检点，不受约束。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者不是反义关系，前后逻辑关系不一致，排除；\nC项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。守口如瓶意思是闭口不谈，像瓶口塞紧了一般，形容说话谨慎，严守秘密，二者为近义关系；礼贤下士形容重视人才。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者不是近义关系，前后逻辑关系不一致，排除；\nD项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。口若悬河意为说话滔滔不绝，像河水倾泄一样，形容能说善辩，话语不断，二者为反义关系；矜功伐善意思是夸耀自己的功劳和才能，形容极不虚心。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者为反义关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":104,"missingImage":false},{"qid":"5445784","cat":"逻辑判断","stem":"深度学习是一系列复杂的算法，使计算机能够识别数据中的模式并作出预测。研究人员利用深度学习技术训练AI系统自动读取视网膜扫描数据，并识别那些在接下来的一年中患心脏病风险较高的人。研究人员认为该项技术有可能彻底改变传统的心脏病筛查方式。\n上述论证的成立须补充以下哪项作为前提？","options":{"A":"视网膜扫描数据反映的微小血管变化是预测心脏疾病较为灵敏的指标","B":"心脏病筛查需要进行复杂且昂贵的超声心动图或心脏磁共振成像检查","C":"视网膜扫描相对便宜，并且在许多配镜服务中被使用","D":"AI系统是解开自然界中存在的复杂模式的绝佳工具"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：深度学习技术有可能彻底改变传统的心脏病筛查方式。\n论据：研究人员利用深度学习技术训练AI系统自动读取视网膜扫描数据，并识别那些在接下来的一年中患心脏病风险较高的人。\n本题提问为“须补充以下哪项作为前提”，优先考虑搭桥和必要条件。论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，而论据讨论的是利用深度学习技术可以训练AI系统自动读取视网膜扫描数据，二者话题不一致，优先考虑搭桥，即建立“视网膜扫描数据”和“心脏病筛查”的联系。\n第二步：逐一分析选项。\nA项：该项说的是视网膜扫描数据反映的微小血管变化可以用来预测心脏疾病，将“视网膜扫描数据”和“心脏病筛查”建立了联系，属于搭桥项，可以加强，当选；\nB项：该项说的是心脏病筛查需要进行复杂且昂贵的超声心动图或心脏磁共振成像检查，而论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，话题不一致，无法加强，排除；\nC项：该项说的是视网膜扫描相对便宜且在配镜中使用很多，而论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，话题不一致，无法加强，排除；\nD项：该项说的是AI系统是解开自然界中存在的复杂模式的绝佳工具，而论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，话题不一致，无法加强，排除。\n故正确答案为A。","no":105,"missingImage":false},{"qid":"5445857","cat":"逻辑判断","stem":"调查显示，某地区第二产业从业人员与五年前相比减少了10.4%，对于第二产业从业人员减少的原因，一种观点认为，产业优化升级是第二产业从业人员减少的原因，第二产业在实现产业规模快速扩大的同时，不断加快技术改造，实现“机器换工”，客观上降低了工业企业的用工需求。另一种观点则认为，这与第二产业的优化升级无关，第三产业的蓬勃发展发挥了就业“蓄水池”的功能，吸纳了大量第二产业从业人员。\n以下哪项如果为真，最能削弱第二种观点？","options":{"A":"第二产业优化升级拉动了第三产业蓬勃发展","B":"该地区第三产业的整体规模比第二产业要小","C":"第三产业的发展得益于持续优化的营商环境","D":"第二产业和第三产业都对吸纳就业作出贡献"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：第二产业从业人员减少的原因，与第二产业的优化升级无关，第三产业的蓬勃发展发挥了就业“蓄水池”的功能，吸纳了大量第二产业从业人员。\n论据：无。\n本题只有论点没有论据，削弱优先考虑直接否定论点。\n第二步：逐一分析选项。\nA项：该项说的是第二产业优化升级拉动了第三产业蓬勃发展，进而导致第二产业从业人员减少，也就是说，导致第二产业从业人员减少的根本原因还是第二产业优化升级，直接削弱了论点，可以削弱，当选；\nB项：该项说的是该地区第三产业的整体规模比第二产业要小，与题干讨论的第二产业从业人员减少的原因无关，话题不一致，无法削弱，排除；\nC项：该项说的是第三产业发展的原因，与题干讨论的第二产业从业人员减少的原因无关，话题不一致，无法削弱，排除；\nD项：该项说的是第二产业和第三产业都对吸纳就业作出贡献，与题干讨论的第二产业从业人员减少的原因无关，话题不一致，无法削弱，排除。\n故正确答案为A。","no":106,"missingImage":false},{"qid":"5445896","cat":"逻辑判断","stem":"太平洋中部的海底，散落着大量的矿石，这些矿石名为“多金属结核”，是镍、钴、锰等稀有金属的混合物。支持深海开采的人认为，多金属结核可以提供开发清洁能源所需的矿物，同时海洋每年吸收约四分之一的全球碳排放量，开采结核的过程本身对海洋的碳吸收能力影响不大，反对者则认为海洋本就已经受到过度捕捞、工业污染和塑料垃圾等人类活动的威胁，在这种情况下，深海开采将加剧人类活动对海洋产生不利的影响。\n以下哪项如果为真，最能支持反对者的观点？","options":{"A":"目前人类对深海生物及环境的研究还不够深入，还不足以支持对深海进行大规模开采矿物的活动","B":"即使海洋开采活动能够为日益增加的能源需求提供更多的金属，人类对金属的需求仍然得不到满足，只会与日俱增","C":"地球上的海洋彼此相连，并共享一个环绕地球的洋流系统，开采活动的评估应该进行全局考虑","D":"深海开采过程中释放的泥浆会威胁矿区之上深海中层水域的生态环境，还会产生很大的噪音向上层水域扩散"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：海洋本就已经受到过度捕捞、工业污染和塑料垃圾等人类活动的威胁，在这种情况下，深海开采将加剧人类活动对海洋产生不利的影响。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据，即解释原因或举例。\n第二步：逐一分析选项。\nA项：该项讨论的是已有研究还不够深入，无法支持在深海大规模开采矿物，但不清楚深海开采后会不会对海洋环境产生不利影响，为不明确项，不能加强，排除；\nB项：该项讨论的是深海开采的金属能否满足人类的需要，和论点讨论的深海开采对海洋环境的影响无关，话题不一致，不能加强，排除；\nC项：该项讨论的是地球上的海洋彼此相连并相互影响，开采活动的评估应该进行全局考虑，但是没有明确说明是否开采深海，以及深海开采后会不会对海洋环境产生不利影响，为不明确项，不能加强，排除；\nD项：该项指出深海开采中释放的泥浆影响中层水域，噪音污染向上层水域扩散，补充说明深海开采会影响海洋水域、造成噪音污染等不利影响，解释原因，可以加强，当选。\n故正确答案为D。","no":107,"missingImage":false},{"qid":"5445884","cat":"逻辑判断","stem":"传统污水处理，或通过重力沉降、混凝澄清、浮力浮上、离心力分离、磁力分离等物理方法对不溶态污染物进行分离，或通过酸碱中和法、化学沉淀法、氧化还原法等化学方法让污染物发生转化，而新兴的微生物治理技术则是通过水体微生物来净化污水。有专家认为，与传统手段相比，微生物治理技术是一种处理污水的更佳手段。\n以下哪项如果为真，不能支持上述观点？","options":{"A":"近年来，微生物技术的科研投入持续扩大，相关技术成果在土壤改良等领域已经得到了有效转化","B":"物理方法进行污水治理的处理厂，通常占地面积大，基建费、运行费高，能耗大，易出现污泥膨胀现象","C":"化学方法进行污水治理运行成本高，需消耗大量的化学试剂，易产生二次污染","D":"微生物技术污水治理的能耗低，效率高，剩余污泥量少，操作管理方便"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：与传统手段相比，微生物治理技术是一种处理污水的更佳手段。\n论据：传统污水处理，或通过重力沉降、混凝澄清、浮力浮上、离心力分离、磁力分离等物理方法对不溶态污染物进行分离，或通过酸碱中和法、化学沉淀法、氧化还原法等化学方法让污染物发生转化，而新兴的微生物治理技术则是通过水体微生物来净化污水。\n本题论点和论据话题一致，都是在对传统手段和微生物治理技术进行比较，加强优先考虑补充论据，本题为选非题，将可以加强的选项排除即可。\n第二步：逐一分析选项。\nA项：该项指出近年来微生物技术的科研投入持续扩大，相关技术成果在土壤改良等领域已经得到了有效转化，仅说明微生物技术对土壤改良的作用，没有提及对污水处理的作用，为无关项，无法加强，当选；\nB项：该项指出物理方法进行污水治理的处理厂，通常占地面积大，基建费、运行费高，能耗大，易出现污泥膨胀现象，补充说明传统手段具有成本高、能耗高、污染环境等缺点，补充论据，可以加强，排除；\nC项：该项指出化学方法进行污水治理运行成本高，需消耗大量的化学试剂，易产生二次污染，补充说明传统手段存在成本高、污染环境等缺点，补充论据，可以加强，排除；\nD项：该项指出微生物技术污水治理的能耗低，效率高，剩余污泥量少，操作管理方便，补充说明微生物技术治理污水有优势，补充论据，可以加强，排除。\n本题为选非题，故正确答案为A。","no":108,"missingImage":false},{"qid":"5445883","cat":"逻辑判断","stem":"近来，国际大宗商品市场中，原油和天然气价格达到近十年以来的高位，锌矿价格也上涨了7%左右，有分析人士认为，大宗商品市场将进入“超级周期”（大宗商品价格高于长期平均价格的时期）。从宏观层面看，大宗商品进入“超级周期”是全球经济出现新的增长动力的结果。历史上大宗商品进入“超级周期”往往会带动全球经济复苏，这也预示着当下全球经济正在复苏。\n以下哪项如果为真，最能削弱上述论证？","options":{"A":"地缘政治的风险加剧了大宗商品供应的紧张局势，引发本轮大宗商品价格上涨","B":"飙升的天然气价格推高了化肥的主要成分——氨的价格，进而推高全球粮食价格","C":"全球经济将更注重环保，碳中和与碳达峰将改变能源产业格局，进而影响金属和原油产业的发展远景","D":"全球主要经济体正在加紧出台强有力的救市计划，以寻求本国新的经济增长动力"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：大宗商品市场将进入“超级周期”（大宗商品价格高于长期平均价格的时期）。从宏观层面看，大宗商品进入“超级周期”是全球经济出现新的增长动力的结果。历史上大宗商品进入“超级周期”往往会带动全球经济复苏，这也预示着当下全球经济正在复苏。\n论据：无。\n本题的论点的逻辑是“全球经济出现新的增长动力”导致大宗商品市场将进入“超级周期”，进而预示当下全球经济正在复苏，本题只有论点，没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：论点的逻辑是“全球经济新的增长动力导致大宗商品价格上涨”，该项给出了导致“大宗商品价格上涨”的另一个原因，削弱论点，可以削弱，当选；\nB项：该项说的是天然气价格推高了氨的价格，进而推高全球粮食价格，只说明了部分商品之间的价格关联度，而论点讨论的是大宗商品价格高于平均的原因以及产生的结果，话题不一致，无法削弱，排除；\nC项：该项说的是全球经济将更注重环保，碳中和与碳达峰将改变能源产业格局，而论点讨论的是大宗商品价格高于平均的原因以及产生的结果，话题不一致，无法削弱，排除；\nD项：该项说的是全球主要经济体为寻求本国新的经济增长动力而出台救市计划，而论点讨论的是大宗商品价格高于平均的原因以及产生的结果，话题不一致，无法削弱，排除。\n故正确答案为A。","no":109,"missingImage":false}]}],"count":40,"answerable":40,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"aac2a3de5400\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"5445749","cat":"综合","stem":"2021年四季度，Z省有几个市的中心城市道路机动车依法礼让率高于上季度水平？","options":{"A":"5","B":"6","C":"7","D":"8"},"answer":"C","explanation":"定位表格材料可得：2021年四季度Z省各市中心城市道路机动车依法礼让率高于上季度水平的有A市（98.8%＞98.0%）、B市（98.8%＞96.0%）、D市（99.6%＞97.3%）、E市（98.3%＞96.5%）、F市（98.2%＞96.0%）、G市（100.0%＞94.8%）、H市（99.3%＞98.2%），共7个。\n故正确答案为C。","no":110,"missingImage":false},{"qid":"5445756","cat":"增长","stem":"2021年三季度Z省中心城市道路非机动车遵守交通信号灯率最低的城市，其四季度中心城市道路非机动车遵守交通信号灯率比上季度增长了：","options":{"A":"4~6个百分点之间","B":"超过6个百分点","C":"不到2个百分点","D":"2~4个百分点之间"},"answer":"B","explanation":"定位表格材料可得：2021年三季度Z省中心城市道路非机动车遵守交通信号灯率最低的城市是G市（90.9%）。2021年四季度以及三季度G市中心城市道路非机动车遵守交通信号灯率分别为98.2%、90.9%。则2021年四季度G市中心城市道路非机动车遵守交通信号灯率比上季度增长了98.2%-90.9%=7.3%，即增长了7.3个百分点，在B项范围内。\n故正确答案为B。","no":111,"missingImage":false},{"qid":"5445759","cat":"平均数","stem":"如用求各市算术平均值的方式计算全省数值，则2021年四季度Z省中心城市道路汽车前排驾乘人员安全带使用率比上季度：","options":{"A":"下降了不到2个百分点","B":"下降了2个百分点以上","C":"提升了不到2个百分点","D":"提升了2个百分点以上"},"answer":"D","explanation":"根据题干“如用求各市算术平均值的方式计算全省数值，则2021年四季度······比上季度”，结合选项为下降/提升+百分点，可判定本题为平均数的增长量问题。定位表格材料可得：2021年四季度Z省各市中心城市道路汽车前排驾乘人员安全带使用率分别为99.2%、98.8%、98.0%、98.6%、99.8%、99.1%、98.2%、99.4%，2021年三季度分别为99.6%、96.5%、96.0%、97.4%、92.5%、96.1%、91.9%、98.8%。则所求\u003cimg data-k=\"9a258c4636dc\">\u003cimg data-k=\"7e2832eb0693\">\u003cimg data-k=\"f5b472d7ad35\">，即约比上季度提升了2个百分点以上。\n故正确答案为D。","no":112,"missingImage":false},{"qid":"5445766","cat":"综合","stem":"如单纯从统计数据判断，则2021年四季度B市在提升中心城市道路交通守法率方面，工作相比三季度最有成效的是：","options":{"A":"机动车依法礼让","B":"行人、非机动车遵守交通信号灯","C":"摩托车驾乘人员佩戴安全头盔","D":"汽车前排驾乘人员使用安全带"},"answer":"A","explanation":"定位表格材料可得2021年三季度、四季度B市在选项四个方面的城市道路交通守法率，具体情况为：\n\u003cimg data-k=\"1e0827151352\" style=\"max-width:531px\">\n对比可得，B市2021年三季度的机动车依法礼让率最低（96.0%），而四季度最高（98.8%），差值最大，即工作相比三季度最有成效。\n故正确答案为A。","no":113,"missingImage":false},{"qid":"5445771","cat":"综合","stem":"以下条形图反映了2021年四季度Z省哪个城市中心城市道路交通守法率五项指标之间的大小关系？\n\u003cimg data-k=\"cdd11287f4a8\" style=\"max-width:616px\">","options":{"A":"E市","B":"F市","C":"G市","D":"H市"},"answer":"B","explanation":"定位表格材料可得2021年四季度E市、F市、G市、H市中心城市道路交通五项指标 :"根据题干“2018年······同比增速······百分点”，可判定本题为一般增长率问题。定位统计表可得2017、2018年中国超算服务4类细分市场的市场规模。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，可知2018年，中国超算服务4类细分市场的市场规模同比增速分别为：\n尖端超算：\u003cimg data-k=\"717dff23ca63\">；\n通用超算：\u003cimg data-k=\"d7370fdd1666\">；\n业务超算：\u003cimg data-k=\"0e86b06d03dd\">；\n人工智能超算：\u003cimg data-k=\"40bdb48106fb\">。\n则增速最快的市场为人工智能超算，最慢的市场为尖端超算，所求=58%-5%=53%，即相差约53个百分点。\n故正确答案为C。","no":117,"missingImage":false},{"qid":"5445851","cat":"增长","stem":"如保持2021年同比增量不变，则到哪一年第三方互联网超算服务商提供的服务市场规模将第一次超过第三方独立超算服务商？","options":{"A":"2025年","B":"2026年","C":"2027年","D":"2028年"},"answer":"B","explanation":"根据题干“如保持2021年同比增量不变，则到哪一年······将第一次超过······”，可判定本题为现期追赶问题。定位统计图可知2020年、2021年中国第三方独立超算和互联网超算服务商市场规模。根据公式：增长量=现期量-基期量，则2021年第三方互联网超算服务商市场规模同比增量=13.8-9.5=4.3亿元，2021年第三方独立超算服务商市场规模同比增量=18.3-15.0=3.3亿元。根据公式：现期量=基期量+n×增长量，可列式：13.8+n×4.3＞18.3+n×3.3，解得n＞4.5，则n至少为5，即到2026年第三方互联网超算服务商提供的服务市场规模将第一次超过第三方独立超算服务商。\n故正确答案为B。","no":118,"missingImage":false},{"qid":"5445854","cat":"综合","stem":"能够从上述资料中推出的是：","options":{"A":"2016～2020年，通用超算服务市场累计规模超过160亿元","B":"2016～2017年，业务超算服务市场累计规模比人工智能超算服务高30多亿元","C":"2018～2021年，第三方独立超算服务市场规模同比增量逐年递增","D":"2017～2020年，第三方互联网超算服务市场规模同比增速逐年递减"},"answer":"D","explanation":"A项：定位统计表可得2016~2020年通用超算服务市场规模分别为23.9亿元、26.9亿元、29.7亿元、32.2亿元、37.8亿元。则所求=23.9+26.9+29.7+32.2+37.8\u003cimg data-k=\"8215ae184a6a\">\u003cimg data-k=\"627d6c0bc1b3\">亿元＜160亿元，错误；\nB项：定位统计表可得2016~2017年业务超算服务市场规模分别为15.6亿元、24.1亿元，人工智能超算服务市场规模分别为4.7亿元、7.9亿元。则所求=（15.6+24.1）-（4.7+7.9）=39.7-12.6=27.1亿元＜30亿元，错误；\nC项：定位统计图可得2017~2021年中国第三方独立超算服务市场规模。根据公式：增长量=现期量-基期量，则2018年同比增量=8.7-7.1=1.6亿元；2019年同比增量=11.7-8.7=3.0亿元；2020年同比增量=15.0-11.7=3.3亿元；2021年同比增量=18.3-15.0=3.3亿元。因2021年同比增量与2020年相等，则非逐年递增，错误；\nD项：定位统计图可得2016~2020年中国第三方互联网超算服务市场规模。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，则2017年同比增速\u003cimg data-k=\"b6c2e745dc9b\">；2018年同比增速\u003cimg data-k=\"137fb2a1a7ab\">；2019年同比增速\u003cimg data-k=\"76886d7d4a40\">；2020年同比增速\u003cimg data-k=\"8e2b076fb9f8\">。则2017~2020年中国第三方互联网超算服务市场规模同比增速逐年递减，正确。\n故正确答案为D 境电商进出口交易额为2018.3亿元，其中，出口1475.5亿元，同比增长15.7%；进口542.8亿元，同比增长16.0%。进出口交易额=出口额+进口额，根据混合增长率口诀“混合后居中”可知，2021年跨境电商进出口交易额的同比增速在15.7%~16.0%之间，错误；\nB项：定位材料第一段可得：2021年H省商品、服务类电子商务交易额为11526.13亿元，比上年同期增长21.8%（b）······H省网上零售额为2948.2亿元，同比增长12.5%（a）。根据两期比重比较结论：当部分增长率（a）＜整体增长率（b）时，比重下降。12.5%＜21.8%，即2021年网上零售额占商品、服务类电子商务交易额的比重低于上年水平，错误；\nC项：定位材料第一段可得：2021年H省商品、服务类电子商务交易额为11526.13亿元（B），比上年同期增长21.8%（b）；定位材料第二段可得：（2021年H省）对个人电子商务交易额为4271.38亿元（A），同比增长25.4%（a）。根据公式：基期比重\u003cimg data-k=\"5d19e88a3fa9\">，则2020年占比为\u003cimg data-k=\"aef004e23cd9\">，2020年对个人电子商务交易额占商品、服务类电子商务交易额的比重不足38%，错误；\nD项：定位材料第三段可得：（2021年H省）在本省电商平台上······收取的平台交易服务费为3.17亿元，同比增长49.5%。根据公式：基期量\u003cimg data-k=\"eb4ccfb62ef4\">，则2020年省内电子商务平台收取的平台交易服务费为\u003cimg data-k=\"b0b2af278bfe\">亿元，正确。\n故正确答案为D。","no":129,"missingImage":false},{"qid":"5445878","cat":"倍数","stem":"甲、乙二人合伙成立公司，约定每年利润的60%留作公司发展用途，40%按二人投资比例分配。已知公司成立第三年的利润比第二年高300万元，是第一年利润的3倍；甲第二年分配的金额是第三年的一半，且比第一年多20万元。问乙的投资额占比为多少？","options":{"A":"40%","B":"50%","C":"60%","D":"75%"},"answer":"B","explanation":"设该公司第一年的利润为x万元，根据题意可得，第三年的利润为3x万元，第二年的利润为（3x-300）万元。已知每年二人将利润的40%按投资比例分配，且甲第二年分配的金额是第三年的一半，设甲的投资额占比为y，可列方程：\u003cimg data-k=\"f451f01a068f\">，解得x=200。则第一年的利润为200万元，第二年的利润为3×200-300=300万元。又因甲第二年分配的金额比第一年多20万元，可列方程：300×40%×y=200×40%×y+20，解得y=50%，故甲的投资额占比为50%，则乙的投资额占比为1-50%=50%。\n故正确答案为B。","no":130,"missingImage":false}]}],"count":21,"answerable":21,"pointsOf":16}],"total":130,"affected":[],"subtitle":"2023年 · 国考 · 6/6 模块"},{"slug":"2023-国考-行政执法卷","title":"2023年国家公务员录用考试《行测》题（行政执法卷网友回忆版）","year":"2023","group":"国考","modules":[{"label":"政治理论","items":[{"type":"question","qid":"5445752","cat":"时事政治","stem":"党的二十大报告指出，从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。下列对中国式现代化的理解，正确的有几项？\n①坚持把实现人民对美好生活的向往作为现代化建设的出发点和落脚点\n②共同富裕是社会主义的本质要求，是中国式现代化的重要特征\n③在物质文明方面超越西方发达国家，是中国式现代化的主要目标\n④遵循世界各国现代化的共同模式，是中国式现代化道路的基本经验\n⑤中国式现代化新道路，创造了人类文明新形态","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"B","explanation":"本题考查政治常识。\n①②正确，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色······中国式现代化是全体人民共同富裕的现代化。共同富裕是中国特色社会主义的本质要求，也是一个长期的历史过程。我们坚持把实现人民对美好生活的向往作为现代化建设的出发点和落脚点，着力维护和促进社会公平正义，着力促进全体人民共同富裕，坚决防止两极分化。”\n③错误，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“中国式现代化是物质文明和精神文明相协调的现代化。物质富足、精神富有是社会主义现代化的根本要求。物质贫困不是社会主义，精神贫乏也不是社会主义。我们不断厚植现代化的物质基础，不断夯实人民幸福生活的物质条件，同时大力发展社会主义先进文化，加强理想信念教育，传承中华文明，促进物的全面丰富和人的全面发展。”西方式现代化是由工业革命催生出来的，是一种以工业化为主要标准的现代化，这使得西方式现代化在追求工业化发展的同时，无法兼顾到其他领域的发展，由此就导致了物质进步与道德文明进步之间的冲突。然而，中国式现代化绝不是一种单一向度的现代化，而是一种“并联式”的现代化。\n④错误，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色······中国式现代化是人口规模巨大的现代化。我国十四亿多人口整体迈进现代化社会，规模超过现有发达国家人口的总和，艰巨性和复杂性前所未有，发展途径和推进方式也必然具有自己的特点。我们始终从国情出发想问题、作决策、办事情，既不好高骛远，也不因循守旧，保持历史耐心，坚持稳中求进、循序渐进、持续推进。”\n⑤正确，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“中国式现代化的本质要求是：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。”\n故①②⑤正确，共3项。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"5445755","cat":"时事政治","stem":"党的二十大报告指出，要发展全过程人民民主，保障人民当家作主。关于人民民主，下列表述正确的是：\n①人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义\n②全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主\n③协商民主是实践全过程人民民主的重要形式\n④党内民主是全过程人民民主的重要体现","options":{"A":"①③④","B":"①②④","C":"①②③","D":"②③④"},"answer":"C","explanation":"本题考查政治常识。\n①②正确，二十大报告中“六、发展全过程人民民主，保障人民当家作主”部分指出：“我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家，国家一切权力属于人民。人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义。全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。”\n③正确，二十大报告中“六、发展全过程人民民主，保障人民当家作主”部分指出：“（二）全面发展协商民主。协商民主是实践全过程人民民主的重要形式。完善协商民主体系，统筹推进政党协商、人大协商、政府协商、政协协商、人民团体协商、基层协商以及社会组织协商，健全各种制度化协商平台，推进协商民主广泛多层制度化发展。”\n④错误，二十大报告中“六、发展全过程人民民主，保障人民当家作主”部分指出：“（三）积极发展基层民主。基层民主是全过程人民民主的重要体现。健全基层党组织领导的基层群众自治机制，加强基层组织建设，完善基层直接民主制度体系和工作体系，增强城乡社区群众自我管理、自我服务、自我教育、自我监督的实效。”\n综上所述，①②③正确。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"5445757","cat":"时事政治","stem":"党的二十大报告指出，要增进民生福祉，提高人民生活品质。下列有关表述正确的是：","options":{"A":"就业是人民生活的安全网和社会运行的稳定器","B":"人民健康是最基本的民生","C":"健全的社会保障体系是民族昌盛和国家强盛的重要标志","D":"分配制度是促进共同富裕的基础性制度"},"answer":"D","explanation":"本题考查政治常识。\nA项错误，二十大报告中“九、增进民生福祉，提高人民生活品质”部分指出：“（三）健全社会保障体系。社会保障体系是人民生活的安全网和社会运行的稳定器。健全覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次社会保障体系。完善基本养老保险全国统筹制度，发展多层次、多支柱养老保险体系。实施渐进式延迟法定退休年龄。”\nB项错误，二十大报告中“九、增进民生福祉，提高人民生活品质”部分指出：“（二）实施就业优先战略。就业是最基本的民生。强化就业优先政策，健全就业促进机制，促进高质量充分就业。健全就业公共服务体系，完善重点群体就业支持体系，加强困难群体就业兜底帮扶。”\nC项错误，二十大报告中“九、增进民生福祉，提高人民生活品质”部分指出：“（四）推进健康中国建设。人民健康是民族昌盛和国家强盛的重要标志。把保障人民健康放在优先发展的战略位置，完善人民健康促进政策。优化人口发展战略，建立生育支持政策体系，降低生育、养育、教育成本。实施积极应对人口老龄化国家战略，发展养老事业和养老产业，优化孤寡老人服务，推动实现全体老年人享有基本养老服务。”\nD项正确，二十大报告中“九、增进民生福祉，提高人民生活品质”部分指出：“（一）完善分配制度。分配制度是促进共同富裕的基础性制度。坚持按劳分配为主体、多种分配方式并存，构建初次分配、再分配、第三次分配协调配套的制度体系。努力提高居民收入在国民收入分配中的比重，提高劳动报酬在初次分配中的比重。”\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"5445760","cat":"时事政治","stem":"党的二十大报告指出，新时代十年来“党和国家事业取得历史性成就、发生历史性变革”。关于新时代十年来取得的历史性成就，下列表述错误的是：","options":{"A":"谷物总产量稳居世界首位","B":"制造业规模、外汇储备稳居世界第一","C":"全社会研发经费支出跃居世界第一","D":"建成世界最大的高速铁路网"},"answer":"C","explanation":"本题考查政治常识。\nC项错误，A、B、D三项正确，二十大报告中“一、过去五年的工作和新时代十年的伟大变革”部分指出：“我们提出并贯彻新发展理念，着力推进高质量发展，推动构建新发展格局，实施供给侧结构性改革，制定一系列具有全局性意义的区域重大战略，我国经济实力实现历史性跃升······谷物总产量稳居世界首位，十四亿多人的粮食安全、能源安全得到有效保障。城镇化率提高十一点六个百分点，达到百分之六十四点七。制造业规模、外汇储备稳居世界第一。建成世界最大的高速铁路网、高速公路网，机场港口、水利、能源、信息等基础设施建设取得重大成就。我们加快推进科技自立自强，全社会研发经费支出从一万亿元增加到二万八千亿元，居世界第二位，研发人员总量居世界首位······”\n本题为选非题，故正确答案为C。","no":4,"missingImage":false}],"count":4,"answerable":4,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"5445761","cat":"地理国情","stem":"中共中央、国务院印发了《黄河流域生态保护和高质量发展规划纲要》，根据该纲要，下列表述错误的是：","options":{"A":"到2035年黄河流域生态保护和高质量发展取得重大战略成果","B":"河湟-藏羌文化区是农耕文化与游牧文化交汇相融的过渡地带","C":"支持青海、甘肃等风能、太阳能丰富地区构建风光水多能互补系统","D":"水土保持区以内蒙古高原南缘、宁夏中部等为主"},"answer":"D","explanation":"本题考查政治常识。\n《黄河流域生态保护和高质量发展规划纲要》以下简称《纲要》。\nA项正确，《纲要》在“第二章 总体要求”的“第四节 发展目标”中指出：“······到2035年，黄河流域生态保护和高质量发展取得重大战略成果，黄河流域生态环境全面改善，生态系统健康稳定，水资源节约集约利用水平全国领先，现代化经济体系基本建成，黄河文化大发展大繁荣，人民生活水平显著提升······”\nB项正确，《纲要》在“第二章 总体要求”的“第五节 战略布局”中指出：“构建多元纷呈、和谐相容的黄河文化彰显区。河湟-藏羌文化区，主要包括上游大通河、湟水河流域和甘南、若尔盖、红原、石渠等地区，是农耕文化与游牧文化交汇相融的过渡地带，民族文化特色鲜明······”\nC项正确，《纲要》在“第九章 建设特色优势现代产业体系”的“第三节 建设全国重要能源基地”中指出：“······发挥黄河上游水电站和电网系统的调节能力，支持青海、甘肃、四川等风能、太阳能丰富地区构建风光水多能互补系统。加大青海、甘肃、内蒙古等省区清洁能源消纳外送能力和保障机制建设力度······”\nD项错误，《纲要》在“第二章 总体要求”的“第五节 战略布局”中指出：“构建黄河流域生态保护‘一带五区多点’空间布局······‘五区’，是指以三江源、秦岭、祁连山、六盘山、若尔盖等重点生态功能区为主的水源涵养区，以内蒙古高原南缘、宁夏中部等为主的荒漠化防治区，以青海东部、陇中陇东、陕北、晋西北、宁夏南部黄土高原为主的水土保持区，以渭河、汾河、涑水河、乌梁素海为主的重点河湖水污染防治区，以黄河三角洲湿地为主的河口生态保护区······”\n本题为选非题，故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"5445765","cat":"经济常识","stem":"下列与金融活动相关的说法错误的是：","options":{"A":"有价证券的债务人可以请求债权人支付相应对价","B":"开展储蓄业务有助于实现货币购买力和商品供应量的平衡","C":"分红型商业保险的收益与保险公司的经营状况有关","D":"办理国家助学贷款的学生不需要办理贷款担保或抵押"},"answer":"A","explanation":"本题考查经济常识。\nA项错误，有价证券，是指标有票面金额，用于证明持有人或该证券指定的特定主体对特定财产拥有所有权或债权的凭证。有价证券的法律特征有：（一）有价证券与证券上所记载的财产权利不能分离。（二）有价证券的债务人是特定的，即证券的权利人只能向证券上记载的债务人请求实现债权。（三）有价证券的债务人的支付是单方义务，债务人不得请求权利人支付相应对价。\nB项正确，储蓄是指每个人或家庭，把节约的钱存到银行的经济活动。居民储蓄被银行积累起来，相应地增加社会可用的资金总量，支援社会生产发展，促进了社会积累的形成或增长。国家通过开展储蓄业务，可以有效地减少需求压力，实现货币购买力和商品供应量的平衡，调节货币流通。\nC项正确，分红型商业保险指保险公司将其实际经营成果优于定价假设的盈余，按一定比例向保单持有人进行分配的人寿保险产品。保单持有人可以分享保险公司经营成果的保险种类，保单持有人每年都有权获得建立在保险公司经营成果基础上的红利分配。\nD项正确，国家助学贷款是由政府主导，金融机构向高校家庭经济困难学生提供的信用助学贷款，帮助解决在校期间的学费和住宿费。国家助学贷款是信用贷款，学生不需要办理贷款担保或抵押，但需要承诺按期还款，并承担相关法律责任。\n本题为选非题，故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"5445770","cat":"法律常识","stem":"根据《中华人民共和国乡村振兴促进法》，下列说法正确的是：","options":{"A":"全面实施乡村振兴战略，应当坚持乡村城镇融合、城镇优先发展带动乡村原则","B":"国家构建以高质量绿色发展为导向的新型农业补贴政策体系","C":"省、自治区、直辖市人民政府应当采取措施确保耕地总量稳步增加","D":"乡镇人民政府应设立法律顾问和公职律师，根据需要在村民委员会建立公共法律服务工作室"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国乡村振兴促进法》第四条第一项规定：“全面实施乡村振兴战略，应当坚持中国共产党的领导，贯彻创新、协调、绿色、开放、共享的新发展理念，走中国特色社会主义乡村振兴道路，促进共同富裕，遵循以下原则：（一）坚持农业农村优先发展，在干部配备上优先考虑，在要素配置上优先满足，在资金投入上优先保障，在公共服务上优先安排。”因此，应坚持农业农村优先发展，而非乡村城镇融合、城镇优先发展带动乡村原则。\nB项正确，根据《中华人民共和国乡村振兴促进法》第六十条规定：“国家按照增加总量、优化存量、提高效能的原则，构建以高质量绿色发展为导向的新型农业补贴政策体系。”\nC项错误，根据《中华人民共和国乡村振兴促进法》第十四条第一款规定：“国家建立农用地分类管理制度，严格保护耕地，严格控制农用地转为建设用地，严格控制耕地转为林地、园地等其他类型农用地。省、自治区、直辖市人民政府应当采取措施确保耕地总量不减少、质量有提高。”因此，省、自治区、直辖市人民政府应当采取措施确保耕地总量不减少，而非确保耕地总量稳步增加。\nD项错误，根据《中华人民共和国乡村振兴促进法》第四十八条规定：“地方各级人民政府应当加强基层执法队伍建设，鼓励乡镇人民政府根据需要设立法律顾问和公职律师，鼓励有条件的地方在村民委员会建立公共法律服务工作室，深入开展法治宣传教育和人民调解工作，健全乡村矛盾纠纷调处化解机制，推进法治乡村建设。”因此，鼓励乡镇人民政府根据需要设立法律顾问和公职律师，而非应设立法律顾问和公职律师；鼓励有条件的地方在村民委员会建立公共法律服务工作室，而非根据需要在村民委员会建立公共法律服务工作室。\n故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"5445795","cat":"法律常识","stem":"根据《中华人民共和国退役军人保障法》，下列说法正确的是：","options":{"A":"参战退役军人的随迁子女入学可以得到优先保障","B":"退役的军士和义务兵可以逐月领取退役金","C":"已被大学录取的现役军人可以在退伍后四年内入学","D":"退役军人创办企业可以享受免税、贷款免息等优惠政策"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国退役军人保障法》第二十九条第四款第一项规定：“随迁子女需要转学、入学的，安置地人民政府教育行政部门应当予以及时办理。对下列退役军人的随迁子女，优先保障：（一）参战退役军人。”\nB项错误，根据《中华人民共和国退役军人保障法》第二十一条第一款规定：“对退役的军官，国家采取退休、转业、逐月领取退役金、复员等方式妥善安置。”第二十二条第一款规定：“对退役的军士，国家采取逐月领取退役金、自主就业、安排工作、退休、供养等方式妥善安置。”第二十三条第一款规定：“对退役的义务兵，国家采取自主就业、安排工作、供养等方式妥善安置。”因此，退役的军官与军士可适用逐月领取退役金的安置方式，对于退役的义务兵并未规定可适用逐月领取退役金的安置方式。\nC项错误，根据《中华人民共和国退役军人保障法》第三十五条规定：“现役军人入伍前已被普通高等学校录取或者是正在普通高等学校就学的学生，服现役期间保留入学资格或者学籍，退役后两年内允许入学或者复学，可以按照国家有关规定转入本校其他专业学习。达到报考研究生条件的，按照国家有关规定享受优惠政策。”因此，已被大学录取的现役军人可以在退伍后两年内入学，而非四年。\nD项错误，根据《中华人民共和国退役军人保障法》第四十六条规定：“退役军人创办小微企业，可以按照国家有关规定申请创业担保贷款，并享受贷款贴息等融资优惠政策。退役军人从事个体经营，依法享受税收优惠政策。”因此，退役军人创办企业可以享受税收优惠、贷款贴息等优惠政策，而非享受免税、贷款免息等优惠政策。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"5445796","cat":"法律常识","stem":"根据《中华人民共和国生物安全法》，下列说法错误的是：","options":{"A":"境外组织不得在我国从事中、高风险的生物技术研究、开发活动","B":"任何单位和个人未经批准，不得擅自引进、释放或者丢弃外来物种","C":"对高致病性的病原微生物，一律不得从事相关实验活动","D":"国家对我国人类遗传资源和生物资源享有主权"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国生物安全法》第三十八条第一款规定：“从事高风险、中风险生物技术研究、开发活动，应当由在我国境内依法成立的法人组织进行，并依法取得批准或者进行备案。”\nB项正确，根据《中华人民共和国生物安全法》第六十条第三款规定：“任何单位和个人未经批准，不得擅自引进、释放或者丢弃外来物种。”\nC项错误，根据《中华人民共和国生物安全法》第四十六条第一款规定：“高等级病原微生物实验室从事高致病性或者疑似高致病性病原微生物实验活动，应当经省级以上人民政府卫生健康或者农业农村主管部门批准，并将实验活动情况向批准部门报告。”\nD项正确，根据《中华人民共和国生物安全法》第五十三条第二款规定：“国家对我国人类遗传资源和生物资源享有主权。”\n本题为选非题，故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"5445819","cat":"法律常识","stem":"根据《中华人民共和国噪声污染防治法》，下列噪声污染情形与作出责令改正或处罚决定的主体对应错误的是：","options":{"A":"甲企业在噪声敏感建筑物集中区域改建厂房造成工业噪声污染——住房和城乡建设部门","B":"乙企业无排污许可证排放工业噪声——生态环境主管部门","C":"丙商场在促销时持续使用高音喇叭发出噪声——地方人民政府指定的部门","D":"丁驾驶拆除消声器的机动车轰鸣行驶——公安机关交通管理部门"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国噪声污染防治法》第七十四条第二款规定：“违反本法规定，在噪声敏感建筑物集中区域改建、扩建工业企业，未采取有效措施防止工业噪声污染的，由生态环境主管部门责令改正，处十万元以上五十万元以下的罚款；拒不改正的，报经有批准权的人民政府批准，责令关闭。”因此，甲企业在噪声敏感建筑物集中区域改建厂房造成工业噪声污染，应由生态环境主管部门责令改正。\nB项正确，根据《中华人民共和国噪声污染防治法》第七十五条规定：“违反本法规定，无排污许可证或者超过噪声排放标准排放工业噪声的，由生态环境主管部门责令改正或者限制生产、停产整治，并处二万元以上二十万元以下的罚款；情节严重的，报经有批准权的人民政府批准，责令停业、关闭。”\nC项正确，根据《中华人民共和国噪声污染防治法》第八十一条规定：“违反本法规定，有下列行为之一，由地方人民政府指定的部门责令改正，处五千元以上五万元以下的罚款；拒不改正的，处五万元以上二十万元以下的罚款，并可以报经有批准权的人民政府批准，责令停业：（一）超过噪声排放标准排放社会生活噪声的；（二）在商业经营活动中使用高音广播喇叭或者采用其他持续反复发出高噪声的方法进行广告宣传的；（三）未对商业经营活动中产生的其他噪声采取有效措施造成噪声污染的。”\nD项正确，根据《中华人民共和国噪声污染防治法》第七十九条第一款规定：“违反本法规定，驾驶拆除或者损坏消声器、加装排气管等擅自改装的机动车轰鸣、疾驶，机动车运行时未按照规定使用声响装置，或者违反禁止机动车行驶和使用声响装置的路段和时间规定的，由县级以上地方人民政府公安机关交通管理部门依照有关道路交通安全的法律法规处罚。”\n本题为选非题，故正确答案为A。","no":10,"missingImage":false},{"type":"question","qid":"5445806","cat":"法律常识","stem":"关于个人信息保护，下列说法不符合我国法律规定的是：","options":{"A":"通过自动化决策方式向个人进行商业营销，应同时提供不针对其个人特征的选项或便捷的拒绝方式","B":"通过人脸识别技术所收集的个人图像、身份识别信息只能用于维护公共安全目的","C":"个人信息和隐私有密切的关系，个人信息当中的私密信息适用有关隐私权的规定","D":"用户量巨大的个人信息处理者需要定期发布个人信息保护社会责任报告"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国个人信息保护法》第二十四条第二款规定：“通过自动化决策方式向个人进行信息推送、商业营销，应当同时提供不针对其个人特征的选项，或者向个人提供便捷的拒绝方式。”\nB项错误，根据《中华人民共和国个人信息保护法》第二十六条规定：“在公共场所安装图像采集、个人身份识别设备，应当为维护公共安全所必需，遵守国家有关规定，并设置显著的提示标识。所收集的个人图像、身份识别信息只能用于维护公共安全的目的，不得用于其他目的；取得个人单独同意的除外。”故若取得个人单独同意，可以用于其他目的。\nC项正确，根据《中华人民共和国民法典》第一千零三十四条第三款规定：“个人信息中的私密信息，适用有关隐私权的规定；没有规定的，适用有关个人信息保护的规定。”\nD项正确，根据《中华人民共和国个人信息保护法》第五十八条规定：“提供重要互联网平台服务、用户数量巨大、业务类型复杂的个人信息处理者，应当履行下列义务：（四）定期发布个人信息保护社会责任报告，接受社会监督。”\n本题为选非题，故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"5445807","cat":"科技常识","stem":"关于电信诈骗，下列说法错误的是：","options":{"A":"非法使用“伪基站”实施电信诈骗的以非法侵入计算机信息系统罪追究刑事责任","B":"实施电信诈骗最高可被判处无期徒刑","C":"电信诈骗受害人可以通过诉讼程序要求服务存在缺陷的电信运营商承担相应责任","D":"负责招募他人实施电信网络诈骗犯罪活动的，以共同犯罪论处"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《关于办理电信网络诈骗等刑事案件适用法律若干问题的意见》第三节第一点规定：“（一）在实施电信网络诈骗活动中，非法使用‘伪基站’‘黑广播’，干扰无线电通讯秩序，符合刑法第二百八十八条规定的，以扰乱无线电通讯管理秩序罪追究刑事责任。同时构成诈骗罪的，依照处罚较重的规定定罪处罚。”因此，非法使用“伪基站”实施电信网络诈骗活动，可能构成扰乱无线电通讯管理秩序罪或诈骗罪，不构成非法侵入计算机信息系统罪。\nB项正确，根据《中华人民共和国刑法》第二百六十六条规定：“诈骗公私财物，数额较大的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；数额巨大或者有其他严重情节的，处三年以上十年以下有期徒刑，并处罚金；数额特别巨大或者有其他特别严重情节的，处十年以上有期徒刑或者无期徒刑，并处罚金或者没收财产。本法另有规定的，依照规定。”若是诈骗数额特别巨大或者有其他特别严重情节的可被判处无期徒刑。\nC项正确，根据《中华人民共和国反电信网络诈骗法》第四十六条第二款规定：“电信业务经营者、银行业金融机构、非银行支付机构、互联网服务提供者等违反本法规定，造成他人损害的，依照《中华人民共和国民法典》等法律的规定承担民事责任。”第六条第五款规定：“电信业务经营者、银行业金融机构、非银行支付机构、互联网服务提供者承担风险防控责任，建立反电信网络诈骗内部控制机制和安全责任制度，加强新业务涉诈风险安全评估。”因此，电信运营商服务存在缺陷违反了《中华人民共和国反电信网络诈骗法》规定，受害人可以通过诉讼程序要求其承担相应责任。\nD项正确，根据《关于办理电信网络诈骗等刑事案件适用法律若干问题的意见》第四节第四点规定：“负责招募他人实施电信网络诈骗犯罪活动，或者制作、提供诈骗方案、术语清单、语音包、信息等的，以诈骗共同犯罪论处。”\n本题为选非题，故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"5445815","cat":"人文常识","stem":"下列与交通安全有关的说法错误的是：","options":{"A":"机动车载运放射性危险物品应当经公安机关批准后按指定的时间、路线、速度行驶","B":"在允许拖拉机通行的道路上，拖拉机可以从事货运，但是不得用于载人","C":"行人故意碰撞机动车造成交通事故的，机动车一方承担次要责任","D":"前车为执行紧急任务的救护车、工程救险车的，后车不得超车"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国道路交通安全法》第四十八条第三款规定：“机动车载运爆炸物品、易燃易爆化学物品以及剧毒、放射性等危险物品，应当经公安机关批准后，按指定的时间、路线、速度行驶，悬挂警示标志并采取必要的安全措施。”\nB项正确，根据《中华人民共和国道路交通安全法》第五十五条第二款规定：“在允许拖拉机通行的道路上，拖拉机可以从事货运，但是不得用于载人。”\nC项错误，根据《中华人民共和国道路交通安全法》第七十六条第二款规定：“交通事故的损失是由非机动车驾驶人、行人故意碰撞机动车造成的，机动车一方不承担赔偿责任。”由此说明机动车一方无需承担次要责任。\nD项正确，根据《中华人民共和国道路交通安全法》第四十三条第三项规定：“同车道行驶的机动车，后车应当与前车保持足以采取紧急制动措施的安全距离。有下列情形之一的，不得超车：（三）前车为执行紧急任务的警车、消防车、救护车、工程救险车的。”\n本题为选非题，故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"5445792","cat":"法律常识","stem":"根据《中华人民共和国职业教育法》，关于企业开展职业教育，下列说法错误的是：","options":{"A":"企业设立产教融合实训基地的，在公共事业费用上享受高于职业学校的优惠政策","B":"企业应当按照职工工资总额一定比例提取使用职工教育经费","C":"用于一线职工职业教育的经费应当达到国家规定的比例","D":"企业安排职工到职业学校接受职业教育的，应支付职业教育期间工资"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国职业教育法》第五十八条第二款规定：“企业设立具备生产与教学功能的产教融合实习实训基地所发生的费用，可以参照职业学校享受相应的用地、公用事业费等优惠。”题中，应是参照职业学校享受相应的公用事业费优惠，而非享受高于职业学校的优惠政策。\nB、C、D三项正确，根据《中华人民共和国职业教育法》第五十八条第一款规定：“企业应当根据国务院规定的标准，按照职工工资总额一定比例提取和使用职工教育经费。职工教育经费可以用于举办职业教育机构、对本单位的职工和准备招用人员进行职业教育等合理用途，其中用于企业一线职工职业教育的经费应当达到国家规定的比例。用人单位安排职工到职业学校或者职业培训机构接受职业教育的，应当在其接受职业教育期间依法支付工资，保障相关待遇。”\n本题为选非题，故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"5445789","cat":"科技常识","stem":"近年来，我国不断推进水生态修复保护工作。生态塘是包含水生动植物和微生物的一种水生态修复方式。下列与之相关的说法，错误的是：","options":{"A":"狐尾藻可用于富营养化水体的生态修复是因其可吸收氮磷","B":"可以用生石灰对生态塘沿岸土壤进行消毒处理","C":"池塘中的水体出现黑臭时可通过种植芦苇等植物进行改善","D":"生态塘中的青鱼等肉食性鱼类主要在池塘上层水体活动"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，狐尾藻是小二仙草科狐尾藻属植物，多年生粗壮沉水草本。根状茎发达，在水底泥中蔓延，节部生根，对富营养化水中的氮磷均有较好的净化作用。\nB项正确，蛋白质在遇到高温、强碱、强酸、重金属离子时会变性，蛋白质就失去了生物活性。生石灰遇水会发生反应放出大量的热，并且生成强碱，可以使细菌的蛋白质失去活性从而起到杀菌消毒的作用。\nC项正确，芦苇的根状茎十分发达，其叶、叶鞘、茎、根状茎和不定根都具有通气组织。当黑臭污水通过芦苇湿地系统时，芦苇能从污水中吸收营养物质加以利用，并能吸附和富集重金属及一些有毒有害物质，使水质得到净化。\nD项错误，青鱼是鲤科、青鱼属鱼类，体长可达145厘米，通常栖息在水的中下层，生性不活泼。其主要的食物来源为螺蛳、蚌、蚬、蛤等，偶尔也捕食虾和昆虫幼虫。\n本题为选非题，故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"5445699","cat":"人文常识","stem":"下列与古人出行有关的说法错误的是：","options":{"A":"“开远门前万里堠”中的“堠”是一种路标，可以用来导航和计程","B":"“乘舟而惑者，不知东西，见斗极则寤矣”中的“极”就是北极星","C":"“东有启明，西有长庚”中指示方向的“启明”“长庚”是不同天体","D":"“过洋牵星术”是通过测量星辰的高度指数来确定船只所处位置的"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“开远门前万里堠”出自唐代元稹的《和李校书新题乐府十二首·西凉伎》，其中“堠”是古代人们为了丈量路程，设置的一种路标，即在官道旁边每隔一段距离堆个石堆或土堆，作为标记，既可指明道路走向，又可计程。\nB项正确，“乘舟而惑者，不知东西，见斗极则寤矣”出自西汉刘安编撰的《淮南子》，表明在水路上迷路的人们，利用北斗星和北极星就能找到方向。其中“极”就是指北极星。\nC项错误，“东有启明，西有长庚”出自先秦的《大东》。“启明”和“长庚”都是指金星。因为其轨道位于地球之内，从地球上观察，金星时而在日出前现于东方，人们将其称为“启明星”；时而在日落后现于西方，人们称其为“长庚星”。\nD项正确，“过洋牵星术”是中国古代航海所用的天文观察导航技术，是指用牵星板测量所在地的星辰高度，然后计算出该处的地理纬度，以此测定船只所处位置。\n本题为选非题，故正确答案为C。","no":16,"missingImage":false},{"type":"question","qid":"5445705","cat":"人文常识","stem":"下列关于化石的说法正确的是：","options":{"A":"三叶虫化石是侏罗纪地层中的典型化石","B":"硅化木是树木埋入地下后形成的化石","C":"琥珀的硬度比和田玉大","D":"大多数化石是在侵入岩中被发现的"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，三叶虫化石，古时称作燕子石，也叫蝙蝠石。三叶虫属古生节肢动物，属三叶虫纲，生于海底，其种类繁多，生于古生代的寒武纪，至奥陶纪最盛，消亡于二叠纪末期的二叠纪大灭绝事件。侏罗纪界于三叠纪和白垩纪之间，是恐龙的鼎盛时期。\nB项正确，硅化木是真正的木化石，是几百万年或更早以前的树木被迅速埋入地下后，被地下水中的二氧化硅替换而成的树木化石，它保留了树木的木质结构和纹理。\nC项错误，琥珀，一种透明的生物化石，是松柏科、云实科、南洋杉科等植物的树脂化石。树脂滴落，掩埋在地下千万年，在压力和热力的作用下石化形成琥珀。其硬度比较低，一般莫氏硬度为2-3。和田玉属镁质大理岩与中酸性岩浆岩接触交代而形成的变质岩，内含透闪石、角闪石、阳起石等多矿物集合体，化学成分是含水的钙镁硅酸盐，莫氏硬度在6-6.5之间。\nD项错误，沉积岩，又称为水成岩，是三种组成地球岩石圈的主要岩石之一（另外两种是岩浆岩和变质岩）。沉积岩保留了许多地球的历史信息，包括大多数古代动植物化石，沉积岩的层理也有地球气候环境变化的信息。侵入岩是指当上覆岩层压力减轻时，软流层中的岩浆就钻出，在地壳深处冷凝而形成的岩石。\n故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"5445706","cat":"科技常识","stem":"下列与氢燃料电池车有关的说法错误的是：","options":{"A":"氢燃料电池车的最终排出物是水","B":"氢气可以通过生物发酵和电解水等方法制取","C":"北京冬奥会中大量使用了氢燃料电池车","D":"氢气和氧气在内燃机中反应产生电能"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，氢燃料电池是将氢气和氧气的化学能直接转换成电能的发电装置。因为产物只有水，所以氢燃料电池对环境无污染。 \nB项正确，制氢的方法有很多，包括电解水、金属与酸反应、水煤气法、生物发酵法等。\nC项正确，北京2022年冬奥会以氢能出行为主，作为新能源的“种子选手”，氢能零排放、储运便捷、来源与应用范围广泛。在这届冬奥会上，投入使用的氢燃料电池客车不仅动力强劲，其乘坐舒适度也高于传统燃油客车。北京市还投入运行首座冬奥会配套加氢站——福田加氢站。\nD项错误，氢燃料电池的本质是一个发电装置，利用氢气和氧气产生电化学反应释放出电能和热能，而不是让氢气和氧气在内燃机中直接反应。氢燃料电池车的工作原理是：将氢气送到燃料电池的阳极板（负极），经过催化剂（铂）的作用，氢原子中的电子被分离出来，失去电子的氢离子（质子）穿过质子交换膜，到达燃料电池的阴极板（正极），而电子是不能通过质子交换膜的，这个电子只能经外部电路，到达燃料电池的阴极板，从而在外电路中产生电流。\n本题为选非题，故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"5445709","cat":"人文常识","stem":"关于自然节律变化，下列说法错误的是：","options":{"A":"惊蛰后华北地区可能会出现“万里雪飘”的现象","B":"2月北回归线附近会出现“儿童急走追黄蝶，飞入菜花无处寻”的现象","C":"冬至时，在广东汕头竖直立杆会出现“立竿无影”的现象","D":"谷雨前后江浙地区可能会出现“一把青秧趁手青，轻烟漠漠雨冥冥”的现象"},"answer":"C","explanation":"本题考查地理国情。\nA项正确，惊蛰，又名“启蛰”，是二十四节气中的第三个节气，于每年公历3月5-6日交节。有谚语“雪打惊蛰节，四十五天阴”，意思是惊蛰节气出现下雪天气，后期天气持续阴冷。即惊蛰后华北地区可能出现“万里雪飘”的景象。\nB项正确，选项中诗句出自宋代杨万里的《宿新市徐公店》，意思是小孩子奔跑着追赶黄蝴蝶，可是蝴蝶飞入菜花丛中就再也找不到了。北回归线自西向东穿过中国云南、广西、广东、福建（海域）、台湾五省区。2月我国北回归线附近的地区平均气温在\u003cimg data-k=\"7181b1a2264f\">，金黄色的油菜花会开放，所以可以出现诗句中的景象。\nC项错误，立竿无影是一种自然景象，即直立在地上的物体没有阴影显现。在夏至正午时分，太阳直射北回归线呈绝对（接近）直射状，北回归线地区就会出现短暂的“立竿无影”现象。冬至时，太阳直射南回归线，在广东汕头竖直立杆，日影应朝北而不是无影。\nD项正确，选项中诗句出自宋代虞似良的《横溪堂春晓》，意思是将一把青色的秧苗，插入水中，那秧苗瞬间变得青葱，就好似农夫的手，将它染绿，天空中，飘洒着朦胧如烟的细雨。谷雨，是二十四节气中的第六个节气，春季的最后一个节气，于每年公历4月19日-21日交节。谷雨取自“雨生百谷”之意，此时降水明显增加，田中的秧苗初插、作物新种，最需要雨水的滋润。故谷雨前后江浙地区可能会出现诗句中的景象。\n本题为选非题，故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"5445713","cat":"科技常识","stem":"关于人体的生理现象，下列说法正确的是：","options":{"A":"人体在流汗时汗腺内的盐分浓度会降低","B":"蚊虫叮咬造成的皮肤发痒属于过敏反应","C":"打嗝声是由胃部痉挛和声带闭合造成的","D":"皮肤受伤流血处的血管会先扩张后收缩"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，汗液的形成一般是由于外界气温升高或者体内产热导致热刺激，激活汗腺功能，分泌大量液体，通过汗孔排到体表。由于汗腺还具备从产生出的汗液中再次将盐分吸收回体内的功能，所以通过再次吸收盐分，可以将盐分的流失抑制到最小程度。因此人体在流汗时汗腺内的盐分浓度会升高。\nB项正确，蚊虫叮咬引起的过敏症状有皮肤出现红肿、瘙痒，这是比较常见的过敏症状，也是比较轻微的过敏症状。出现这些症状是因为蚊虫叮咬所释放的唾液在皮肤组织产生刺激性的反应。\nC项错误，打嗝指气从胃中上逆，喉间频频作声，声音急而短促。这是一个生理上常见的现象，是由横膈膜痉挛收缩引起的。健康人打嗝多与饮食有关，特别是饮食过快、过饱，摄入很热或冷的食物饮料、饮酒等，外界温度变化和过度吸烟亦可引起。\nD项错误，当皮肤受伤流血后，血管会立即收缩，而不是先扩张后收缩。其收缩的目的是减少流向受伤部位的血液。过一段时间受伤部位的血液就会自动凝结变成血块，不让血液继续流出。\n故正确答案为B。","no":20,"missingImage":false}],"count":16,"answerable":16,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"5445692","cat":"逻辑填空","stem":"“双减”政策带给作业改革的最大变化，是理念的改变，让我们回到了作业的原点：为什么要布置作业？归根到底，是为了育人。这彻底扭转了之前作业管理中的“            ”现象，改变了传统作业管理中“眼中有作业、有分数，但唯独没有人”的痼疾，厘清了“好作业”的标准或者尺度。\n填入画横线部分最恰当的一项是：","options":{"A":"揠苗助长","B":"本末倒置","C":"缘木求鱼","D":"徒有其表"},"answer":"B","explanation":"根据横线后文可知，传统作业管理中存在“眼中有作业、有分数，但唯独没有人”的痼疾，而横线前文强调布置作业是为了育人。故横线处表达之前的作业管理中存在把育人与作业、分数的地位弄颠倒了的现象，B项“本末倒置”比喻把主要的和次要的、本质和非本质的关系弄颠倒了，符合文意，当选。\nA项“揠苗助长”比喻违反事物的发展规律，急于求成，反而坏事，文段未体现“违反事物的发展规律”，与文意不符，排除；C项“缘木求鱼”比喻行事方向、方法不对，一定达不到目的，D项“徒有其表”指空有其外表，不实在，均无法体现出“颠倒”的含义，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《作业改革应回到育人原点》","no":21,"missingImage":false},{"type":"question","qid":"5445696","cat":"逻辑填空","stem":"红树林的地下部分长期处于厌氧环境，减缓了根系和凋落物的分解速率，加速了碳埋藏速率。此外，红树林大多分布于沉积型海岸河口，由上游河流和海洋潮汐共同作用带来的大量外源性碳，被它们固定并快速沉积下来。这“            ”的组合拳使得红树林成为海岸带蓝碳碳汇的主要贡献者。\n填入画横线部分最恰当的一项是：","options":{"A":"取长补短","B":"标本兼治","C":"开源节流","D":"一举两得"},"answer":"C","explanation":"根据“减缓了根系和凋落物的分解速率，加速了碳埋藏速率”及“此外······由上游河流和海洋潮汐共同作用带来的大量外源性碳，被它们固定并快速沉积下来”可知，横线处体现红树林两方面的作用和好处，且双引号引导形象表达。C项“开源节流”比喻在财政经济上增加收入，节省开支，置于此处，“开源”可以对应红树林固定并沉积外源性碳，“节流”对应“减缓了根系和凋落物的分解速率”，符合文意，当选。\nA项“取长补短”表示在同类事物中吸取这个的长处来弥补那个的短处，文段并未涉及两者的“长处”与“短处”，与文意不符，排除；B项“标本兼治”指对事物的枝节和根本都加以治理，文段并未涉及“枝节”和“根本”，与文意不符，排除；D项“一举两得”意为做一件事得到两方面的好处，文段的结论仅提及“成为海岸带蓝碳碳汇的主要贡献者”这一个结果，并未体现出两方面的好处，与文意不符，排除。\n故正确答案为C。\n【文段出处】《会打“组合拳”的“武林高手”——红树林》","no":22,"missingImage":false},{"type":"question","qid":"5445704","cat":"逻辑填空","stem":"人造血即血氧液，能够用来代替人类血液，满足临床需求，缓解血液短缺状况。而且人造血标准化的生产流程能够确保其          ，输入人造血不用再担心会感染艾滋病、肝炎等疾病，可最大程度降低输血相关传染病的风险。因此，研制和批量生产人造血成为当前的热点。\n填入画横线部分最恰当的一项是：","options":{"A":"安全性","B":"可靠性","C":"规范性","D":"稳定性"},"answer":"A","explanation":"根据“输入人造血不用再担心会感染艾滋病、肝炎等疾病，可最大程度降低输血相关传染病的风险”可知，横线处所填词语应体现出人造血不会给人体造成危害之意。A项“安全性”指不受威胁、没有危险、危害、损失，符合文意，当选。\nB项“可靠性”指可以信赖，可以相信，侧重强调事物本身可以依靠或真实可信，与对人体没有危害无关，排除；C项“规范性”形容合乎一定标准的特点，D项“稳定性”指保持稳定不变的特点，均与文意不符，排除。\n故正确答案为A。\n【文段出处】人民网《将动物血变人血？硬核科技有望缓解临床血液短缺》","no":23,"missingImage":false},{"type":"question","qid":"5445710","cat":"逻辑填空","stem":"“反觇”思维是从事物甲和乙之间的联系，反推出乙同甲的另一种联系的方法。在作战指挥中，敢于“反道而觇之”，往往能跳出局部观全局、打破常规辟蹊径。面对复杂多变的战场形势，指挥员若能换位于敌、        定式，从侧面甚至反向来决策，及时        行动部署，就会拥有战场制敌的更大胜算。\n依次填入画横线部分最恰当的一项是：","options":{"A":"突破 扭转","B":"摒弃 校正","C":"摆脱 规划","D":"忽略 调整"},"answer":"B","explanation":"第一空，根据“、”可知，横线处与“换位于敌”构成并列关系，且根据前文“打破常规辟蹊径”可知，横线处应体现出站在敌人角度，打破常规定式之意，A项“突破”指打开缺口，超过或打破，B项“摒弃”指排除并抛弃，C项“摆脱”指脱离（牵制、束缚、困难等不利的情况），均符合文意，保留。D项“忽略”指疏忽，没有注意到，与文意不符，排除。\n第二空，搭配“行动部署”，且根据前文“面对复杂多变的战场形势”可知，横线处应体现及时调整改变行动部署之意，B项“校正”指校对改正，符合文意，当选。A项“扭转”指纠正或改变事物的发展方向，多搭配“局面”“态势”等，与“行动部署”搭配不当，排除；C项“规划”指筹划、计划，无法体现“调整改变”之意，且规划多用于事前筹划的语境，与文段“在作战指挥中”的语境不符，排除。\n故正确答案为B。\n【文段出处】解放军报《多一些“反觇”思维》","no":24,"missingImage":false},{"type":"question","qid":"5445715","cat":"逻辑填空","stem":"相比于其他全球卫星导航系统采取单一轨道星座构型，北斗系统            ，坚定选择了混合星座的特色发展之路，并首创短文通报模式，开创了通信导航一体化的独特服务模式，信息发送能力从一次120个汉字提升到一次1200个汉字，遇到突发情况时无需            ，足以将情节一次性说清楚。\n依次填入画横线部分最恰当的一项是：","options":{"A":"与众不同 言简意赅","B":"独树一帜 字斟句酌","C":"遥遥领先 删繁就简","D":"迎难而上 惜墨如金"},"answer":"B","explanation":"第一空，搭配“北斗系统”，且根据后文“特色发展之路”“首创短文通报模式，开创了······独特服务模式”可知，“北斗系统”与其他卫星导航系统不同，具有独特性。B项“独树一帜”指单独树立起一面旗帜，指自成一家，A项“与众不同”指与大家不一样，二者均能够体现出独特性，符合文意，保留；C项“遥遥领先”指远远地走在最前面，D项“迎难而上”形容不怕困难挫折，勇敢地挑战，二者均与文意无关，排除。\n第二空，对应前文“信息发送能力从一次120个汉字提升到一次1200个汉字”，后文“一次性说清楚”，可知，北斗系统信息发送能力得到提升，遇到突发情况不必过分推敲，删减字数。B项“字斟句酌”指写文章或说话慎重细致，一字一句地推敲琢磨，与文意相符，当选；A项“言简意赅”指语言简明而意思完备，“无需言简意赅”指的是表述啰嗦、繁复冗长，北斗系统的信息发送能力提升，并不意味着表述啰嗦、冗长，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《圆梦！中国北斗正式登上世界舞台》；中国经济网《“北斗三号”收官，正式服务全球》","no":25,"missingImage":false},{"type":"question","qid":"5445720","cat":"逻辑填空","stem":"课程思政的显性功能是提升课程的内涵和质量。不少教师认为课程思政是        于传统教学之外的附加行为，这种认识是错误的。对教学而言，课程思政不是            ，更不是特立独行，它首先是为提升教学质量服务的，是深层次的教学改革，因为只有高水平的教学活动才能吸引学生，进而影响学生。\n依次填入画横线部分最恰当的一项是：","options":{"A":"游离 喧宾夺主","B":"隔绝 照本宣科","C":"徘徊 削足适履","D":"独立 敷衍了事"},"answer":"A","explanation":"第一空，根据“传统教学之外的附加行为”可知，横线处所填词语应体现在不少教师的认知中，课程思政并不包含在传统教学之中，A项“游离”比喻离开集体或依附的事物而存在，D项“独立”指脱离原来所属单位成为另一单位或不依靠他人，均可体现课程思政不属于传统教学，符合文意，保留。B项“隔绝”指隔断，一般用于强调空间上的隔断，置于此处强调课程思政与传统教学是隔断的、没有联系，与文中的“附加行为”表意矛盾，排除；C项“徘徊”指在一个地方来回地走，比喻犹豫不决，也比喻事物在某个范围内来回浮动、起伏，文中仅体现课程思政不属于传统教学，并未涉及课程思政在某个范围内来回浮动，与文意不符，排除。\n第二空，根据后文“更不是特立独行，它首先是为提升教学质量服务的，是深层次的教学改革”可知，横线处所填成语要体现课程思政与教学之间的关系，强调其不仅不是独立的，而且是为教学服务的，有其自身的重要价值，A项“喧宾夺主”比喻客人占了主人的地位或外来的、次要的事物侵占了原有的、主要的事物的地位，与横线前的否定词连用，可与后文的“更不是特立独行”构成递进关系，符合文意，当选。D项“敷衍了事”指办事马马虎虎，只求应付过去就算完事，与横线前的否定词连用，指不马虎，认真，与文意无关，排除。\n故正确答案为A。\n【文段出处】《课程思政——如何在知识传授中呈现思政元素》","no":26,"missingImage":false},{"type":"question","qid":"5445726","cat":"逻辑填空","stem":"翻开古代农书，几千年间古人对于土地的保养，几乎与当代耕作学关注的措施            ，其中历代农书涉及最多的是施肥。在中国古人的摸索中，施肥成为一种讲究，何时、何地施肥，施何种肥，怎样施肥，形成了一个        的体系，在每个年度的农业生产进程中，精心安排在各个时节。\n依次填入画横线部分最恰当的一项是：","options":{"A":"一脉相承 科学","B":"如出一辙 固定","C":"别无二致 完整","D":"不谋而合 复杂"},"answer":"C","explanation":"第一空，形容古人对土地的保养方法与当代耕作措施的关系。B项“如出一辙”比喻两件事情非常相似，C项“别无二致”指区分不出两者的差别，D项“不谋而合”指事先没有商量过，意见或行动却完全一致，均有相似之意，符合文段语境，保留。A项“一脉相承”比喻某种思想、行为或学说之间有继承关系，一般用法为“现在的情况”和“之前的情况”一脉相承，不能说“古人的做法”与“当代的措施”一脉相承，用法不当，排除。\n第二空，根据“何时、何地施肥，施何种肥”“精心安排在各个时节”可以看出，古人经过摸索，施肥的措施已经十分完善和周到。C项“完整”指具有或保持着应有的部分，没有损坏或残缺，符合文意，当选。B项“固定”指不变动或不移动的，文段并没有体现出“不变”，排除；D项“复杂”指（事物的种类、头绪等）多而杂，文段没有体现出“复杂”，且感情色彩较为消极，排除。\n故正确答案为C。\n【文段出处】《古代农业中的人地关系》","no":27,"missingImage":false},{"type":"question","qid":"5445746","cat":"逻辑填空","stem":"指尖上的形式主义是“以痕迹论政绩”的错误政绩观，关注点在于形式美观，而        了根本政绩——人民群众的满意度。指尖上减负就是要把基层干部从            的“虚功”中解救出来，务求实效、扎根基层，用实践检验政绩，把工作落实与否、群众满意与否作为衡量政绩的客观标准。\n依次填入画横线部分最恰当的一项是：","options":{"A":"偏离 阳奉阴违","B":"遗忘 哗众取宠","C":"淡化 花拳绣腿","D":"忽视 华而不实"},"answer":"D","explanation":"本题从第二空入手，横线处搭配“虚功”，由前文“关注点在于形式美观······满意度”以及后文“务求实效、扎根基层”可知，横线处所填成语应体现出“不务实、只注重形式”之意。C项“花拳绣腿”比喻只做些表面上好看实际上并无用处的工作，D项“华而不实”比喻外表好看而内容空虚，二者均符合文意，保留。A项“阳奉阴违”指表面上遵从，暗地里违背，B项“哗众取宠”指用浮夸的言词或做作的行动去迎合群众，以博取好感和支持，二者均与“不务实”无关，排除。\n第一空，根据横线前“关注点在于形式美观”可知，横线处应体现出对“根本政绩”不关注、不重视之意。D项“忽视”指疏忽，不重视，符合文意，当选。C项“淡化”指逐渐冷淡下来，变得不被重视或无关紧要，文段并没有体现出从重视到不重视这个“逐渐冷淡”的过程，与文意不符，排除。\n故正确答案为D。\n【文段出处】《破除“指尖上的形式主义”》","no":28,"missingImage":false},{"type":"question","qid":"5445754","cat":"逻辑填空","stem":"我们确立和坚持马克思主义在意识形态领域指导地位的根本制度，新时代党的创新理论            ，社会主义核心价值观广泛传播，中华优秀传统文化得到创造性转化、创新性发展，文化事业日益繁荣，网络生态持续向好，意识形态领域形势发生          、根本性转变。\n依次填入画横线部分最恰当的一项是：","options":{"A":"振聋发聩 历史性","B":"深入人心 全局性","C":"高屋建瓴 实质性","D":"硕果累累 显著性"},"answer":"B","explanation":"第一空，搭配“党的创新理论”，且根据“社会主义核心价值观广泛传播”可知，横线处应体现党的创新理论得到广泛传播之意，B项“深入人心”指理论、学说、政策等为人们深切了解和信服，可以体现出被人们了解、得到广泛传播之意，保留。A项“振聋发聩”比喻用语言文字唤醒糊涂麻木的人，使他们清醒过来，侧重说的话非常正确，能对大家产生影响，文段并非强调产生影响，排除；C项“高屋建瓴”指对事物把握全面，了解透彻，D项“硕果累累”本义是指秋天丰收时树上的果实茂盛的样子，现在常引申为某人的作品很多，取得了很大的成就，均无法表示得到广泛传播之意，排除。\n第二空，代入验证，根据顿号可知，横线处与“根本性”表意接近，B项“全局性”强调的是整个局面，可以与“根本性”形成对应，当选。\n故正确答案为B。\n【文段出处】新华网《高举中国特色社会主义伟大旗帜 为全面建设社会主义现代化国家而团结奋斗》","no":29,"missingImage":false},{"type":"question","qid":"5445758","cat":"逻辑填空","stem":"补齐公共服务短板，首先要善于发现深层次问题。要深入调研、综合分析、精准掌握，弄清问题的本质和关键，做到            。同时，补齐公共服务短板不是简单地打打补丁，也不会            。有一些短板和弱项是随着时代发展而凸显的系统性问题，只有通过推动经济社会高质量发展才能从根本上解决。\n依次填入画横线部分最恰当的一项是：","options":{"A":"循序渐进 一成不变","B":"细致入微 完美无缺","C":"一针见血 水到渠成","D":"有的放矢 一劳永逸"},"answer":"D","explanation":"第一空，根据“要深入调研、综合分析、精准掌握，弄清问题的本质和关键”可知，横线处强调要依据问题的本质和关键有针对性地补齐短板。C项“一针见血”比喻说话直截了当，切中要害，D项“有的放矢”比喻说话做事有针对性，均能体现出有针对性，保留。A项“循序渐进”指（学习、工作等）按照一定的步骤逐渐深入或提高，侧重强调按步骤，此处并无要按步骤行事的意思，与语境无关，排除；B项“细致入微”比喻看问题非常全面，连很细小的问题都考虑到了，侧重强调“细微”，与语境无关，排除。\n第二空，根据后文“有一些短板和弱项是随着时代发展而凸显的系统性问题”可知，公共服务的短板会随时代变化而变化，不是一次性就能补齐的。D项“一劳永逸”指辛苦一次，把事情办好，以后就不再费事了，符合文意，当选。C项“水到渠成”比喻条件成熟，事情自然成功，与后文“随着时代发展而凸显的系统性问题”这一语境无关，排除。\n故正确答案为D。\n【文段出处】《加快补齐公共服务短板——扎实开展“我为群众办实事”系列谈之四》","no":30,"missingImage":false},{"type":"question","qid":"5445767","cat":"逻辑填空","stem":"对于新业态新模式冲击本地的传统产业，是包容审慎，还是            ？对于非本地人才就业创业、非本地企业项目立项推广，能否            ，甚至千方百计降门槛、清路障以留人留项目？纵观先进制造业集群所在地，无一不是当地政府部门怀着“开放之心”，营造出良好的创新生态。\n依次填入画横线部分最恰当的一项是：","options":{"A":"如芒在背 一视同仁","B":"退避三舍 不偏不倚","C":"拒之门外 开诚布公","D":"推三阻四 海纳百川"},"answer":"A","explanation":"第一空，根据“是······还是”可知，横线处与“包容审慎”构成反义并列，体现出与“包容”相对的态度，即不接受新业态、新模式。A项“如芒在背”意为像芒刺扎在背上一样，形容坐立不安，C项“拒之门外”意为把人挡在门外，形容拒绝协商或共事，D项“推三阻四”意为以各种借口推托，三者均符合文意，保留。B项“退避三舍”泛指对人让步，不与相争，与文意不符，排除。\n第二空，依据“甚至千方百计降门槛、清路障以留人留项目”可知，横线处所填内容与后文相似，但是程度比后文轻，且横线处修饰“当地部门”与“非本地人才、非本地企业项目”关系。A项“一视同仁”意为同样看待，不分亲疏厚薄，能够表达当地部门对待本地创业的人和项目与非本地创业的人和项目同等看待、公平公正的态度，“同等看待”到“对非本地人才、非本地企业项目有政策倾斜”，能够形成很好的语义加重，当选。C项“开诚布公”意为诚意待人，坦白无私，强调真诚、坦诚、坦白，和后文的“政策倾斜”无法构成递进关系，排除。D项“海纳百川”比喻接纳和包容的东西非常广泛，而且数量很大，用于此处程度过重，且与后文的递进关系不及A项准确，排除。\n故正确答案为A。\n【文段出处】《开放是创新的最佳滋养（观象台）》","no":31,"missingImage":false},{"type":"question","qid":"5445772","cat":"逻辑填空","stem":"法律惩罚的正当性一定程度上源于公众朴素的道德期待。在具体执法时，不能仅仅        地依赖客观后果，进行简单归责和惩戒，而应全面考察当事人的主观认知、动机目的等情节，并综合        其社会危害性，由此来审慎决定是否启动惩罚机制。\n依次填入画横线部分最恰当的一项是：","options":{"A":"机械 评估","B":"单纯 辨别","C":"盲目 分析","D":"草率 判断"},"answer":"A","explanation":"第一空，形容对客观后果的依赖，根据“不能······而应······”可知，横线处与“全面考察”语意相反，应体现出对客观后果的绝对依赖，而不考虑其他方面之意，A项“机械”意为方式拘泥死板，B项“单纯”意为简单、不复杂、单一，填入此处均能体现对客观后果的绝对依赖，保留。C项“盲目”意为认识不清，D项“草率”意为不认真、敷衍了事，均与文意不符，排除。\n第二空，搭配“社会危害性”，A项“评估”意为评价估量，填入此处，“评估社会危害性”为常见搭配，当选。B项“辨别”意为对不同的事物在认识上加以区别，通常搭配“真伪”“好坏”等，与“社会危害性”搭配不当，排除。\n故正确答案为A。\n【文段出处】《“以罚代征”案中的法律认识错误》","no":32,"missingImage":false},{"type":"question","qid":"5445774","cat":"逻辑填空","stem":"在普通人看来，法律都是            的，自己一辈子都不会和法律打交道。但在瞬息万变的社会里，人们随时可能触及法律的红线。很多人平时法律观念和意识不强，柔性执法不仅可以起到        作用，而且有利于提高群众的学法懂法意识。\n依次填入画横线部分最恰当的一项是：","options":{"A":"高高在上 教育","B":"高深莫测 预防","C":"遥不可及 警戒","D":"事不关己 提醒"},"answer":"C","explanation":"第一空，横线后出现关联词“但”表示转折，前后语义相反。根据后文“自己一辈子都不会和法律打交道”、“人们随时可能触及法律的红线”可知，横线处所填成语应体现普通人认为与“法律”存在距离感，法律离生活很遥远。C项“遥不可及”指非常遥远而不可到达，D项“事不关己”指事情同自己没有关系，均符合文意，保留。A项“高高在上”形容领导者脱离群众，不深入实际，与“法律”搭配不当，排除；B项“高深莫测”指高深的程度无法揣测，形容使人难以理解，与“距离遥远”无关，与后文无法构成转折，排除。\n第二空，所填词语表示“柔性执法”的作用，C项“警戒”表示警示告诫，使人注意，D项“提醒”表示从旁指点，引起注意，“执法”对于可能触及法律红线的行为不是通过语言提醒，而是起到警示的作用，“警戒”填入文段更加恰当，排除D项。\n故正确答案为C。\n【文段出处】《柔性执法兼容法理与人情》","no":33,"missingImage":false},{"type":"question","qid":"5445776","cat":"逻辑填空","stem":"长期以来，城管执法部门对职责内的执法事项通常是        “用力”，对所有的执法对象“一碗水端平”，以体现执法的公平性、公正性。但对于超大城市而言，由于城管执法事项繁多，涉及市场主体庞杂，而城管执法力量是有限的，实践中很难做到            ，进而可能会影响执法效果和执行力。\n依次填入画横线部分最恰当的一项是：","options":{"A":"精准 滴水不漏","B":"均衡 百无一失","C":"精确 精益求精","D":"平均 面面俱全"},"answer":"D","explanation":"第一空，根据后文“对所有的执法对象‘一碗水端平’，以体现执法的公平性、公正性”可知，横线处要体现出城管执法部门对职责内的执法事项不偏不倚，B项“均衡”指平衡，D项“平均”指没有轻重或多少的分别，均符合文意，保留。A项“精准”指非常准确，精确，C项“精确”指非常准确，文段并非要表达执法的准确性，均与文意不符，排除。\n第二空，根据“由于城管执法事项繁多，涉及市场主体庞杂，而城管执法力量是有限的”，且横线前有“很难做到”的表述可知，横线处要体现执法全面没有遗漏之意，D项“面面俱全”指各方面都能照顾到，没有遗漏疏忽，符合文意，当选。B项“百无一失”形容极有把握，不会出差错，文段并未体现把握大，不出差错之意，与文意不符，排除。\n故正确答案为D。\n【文段出处】中工网-工人日报《期待分类分级执法推动城市治理效能提升》","no":34,"missingImage":false},{"type":"question","qid":"5445701","cat":"逻辑填空","stem":"开展未成年人网络环境整治，势在必行且            。网络上可能存在的色情、暴力、过度娱乐等有害信息，会对普遍拥有智能设备、全面触网的未成年人产生潜移默化的不良影响。只有        清朗洁净的网络空间，才能让青少年健康成长。实现这一愿景，需要发挥多主体多领域联动优势，        合力，撑起清朗网络蓝天。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蓄势待发 创设 形成","B":"刻不容缓 营造 凝聚","C":"迫在眉睫 构筑 集成","D":"任重道远 共建 汇聚"},"answer":"B","explanation":"第一空，根据“势在必行”“网络上可能存在的色情······不良影响”可知，文段表达“开展未成年人网络环境整治”的必要性及紧迫性，故横线处应体现亟需采取行动之意，B项“刻不容缓”形容形势非常紧迫，片刻也不能拖延，C项“迫在眉睫”比喻事情已到眼前，急迫得就像逼近了眉毛和睫毛一样，二者均与文意相符，保留。A项“蓄势待发”指贮备随时可以展现的实力，待机而发，D项“任重道远”比喻肩负的责任重大，并需要长期的艰苦努力，二者均无法体现事情的紧迫性，排除。\n第二空，搭配“网络空间”，B项“营造”指有目的、有计划地造，C项“构筑”指构建，二者均搭配恰当，保留。\n第三空，搭配“合力”，根据前文“需要发挥多主体多领域联动优势”这一对策可知，横线处需体现将多方力量集中在一起共同发力的过程，B项“凝聚”指聚集，与文意相符且搭配恰当，当选。C项“集成”指总体，强调结果，与文意不符，排除。\n故正确答案为B。\n【文段出处】《多方发力，为未成年人撑起清朗网络蓝天》","no":35,"missingImage":false},{"type":"question","qid":"5445708","cat":"逻辑填空","stem":"随着技术发展，以数字手段为支撑的“沉浸式”“交互式”网上博物馆日益增多，提高了展览的          。但随着智能终端的普及，人们难免会对数字博物馆产生        。博物馆在利用数字技术的基础上，也不能忽视实物展览内涵的提升，使之兼备文化和教育功能，突出            的特点。\n依次填入画横线部分最恰当的一项是：","options":{"A":"科技性  排斥  润物无声","B":"便捷性  厌倦  触手可及","C":"趣味性  疲劳  寓教于乐","D":"交融性  失望  与时俱进"},"answer":"C","explanation":"本题可从第三空入手，根据横线前“博物馆在利用数字技术的基础上······兼备文化和教育功能”可知，横线处应表达数字博物馆能够通过“沉浸式”“交互式”的方式使人们在娱乐中受到教育之意。C项“寓教于乐”指把教育跟娱乐融合为一体，使人在娱乐中受到教育，符合文意，保留。A项“润物无声””指有大胸怀者，做了贡献而不张扬，默默奉献，文段并未体现出“默默奉献”之意，与文意不符，排除；B项“触手可及”指一伸手便可接触到，形容距离很近，文段此处强调的是数字博物馆在“文化和教育”上的特点，并非强调“距离很近”，与文意不符，排除；D项“与时俱进”指随着时代的发展而不断发展、前进，与文意无关，排除。\n第一空，代入验证。C项“趣味性”强调能够使人感到愉快，引起兴趣的特性，与横线前“‘沉浸式’‘交互式’网上博物馆”对应恰当，符合文意，保留。\n第二空，代入验证。C项“疲劳”指因体力或脑力消耗过多而需要休息，置于此处强调智能终端普及之后，人们会对数字博物馆失去新鲜感之意，符合文意，当选。\n故正确答案为C。\n【文段出处】光明日报《发挥好博物馆的教育功能》","no":36,"missingImage":false},{"type":"question","qid":"5445714","cat":"逻辑填空","stem":"传统戏曲中所蕴含的价值理念以及            的表演节奏，很难与当代青年人的生活节奏与审美趣味相合拍。因而，关于戏曲衰亡的声音            。事实上，戏曲相对于互联网时代知识文化的           、快餐式传播，其可重复欣赏和耐咀嚼的品格显得更为可贵，其特有的艺术价值决定了它不可能退出历史舞台，更不会走向消亡。\n依次填入画横线部分最恰当的一项是：","options":{"A":"不疾不徐 如雷贯耳 碎片化","B":"从容不迫 不绝于耳 肤浅化","C":"四平八稳 甚嚣尘上 机械化","D":"慢条斯理 此起彼伏 泡沫化"},"answer":"D","explanation":"第一空，横线处所填成语应体现出传统戏曲表演节奏的特点。A项“不疾不徐”指处事能掌握适度的节律，不太快或不太慢，B项“从容不迫”形容遇事镇定自若，不慌不忙，C项“四平八稳”形容做事只求不出差错，缺乏创新精神，也可指说话、做事稳当，D项“慢条斯理”指说话做事慢腾腾，不慌不忙，均可体现出传统戏曲表演节奏的特点，保留。\n第二空，搭配“声音”。B项“不绝于耳”指声音在耳边不断鸣响，C项“甚嚣尘上”多指某种言论十分嚣张，也比喻对传闻之事议论纷纷，D项“此起彼伏”形容高潮迭起，从未止息，均与“声音”搭配恰当，保留。A项“如雷贯耳”指像雷声传入耳朵，形容名声很大，此处“声音”并非人的名声，与“声音”搭配不当，排除。\n第三空，顿号表并列，故横线处所填词语与“快餐式”构成近义并列，应体现出“快”之意，且由后文“可重复欣赏和耐咀嚼”可知，横线处所填词语也应体现出互联网时代知识文化不可重复的特点。D项“泡沫化”比喻某一事物所存在的表面上繁荣、兴旺而实际上虚浮不实，像泡沫一样，一碰就破，瞬间消失，可体现出“快且不可重复”之意，符合文意，当选。B项“肤浅化”指局限于表面的、浅薄的、不深刻的，强调不深刻，C项“机械化”形容事物如机械动作般缺少变化，强调缺少变化、不灵活，均无法与“快”、“可重复欣赏和耐咀嚼”进行对应，与文意不符，排除。\n故正确答案为D。\n【文段出处】中国作家网《中国戏曲现状观察之一：信息时代说戏曲》","no":37,"missingImage":false},{"type":"question","qid":"5445719","cat":"逻辑填空","stem":"没有中华文化沃土的滋养，就不可能有中国特色社会主义制度的            。我们过去对制度的实践基础强调比较多，对制度的文化支撑关注不够。其实，制度绝不只是一系列外在的        行为规范，还是内在的文化思维价值认同。这种文化不可能是外来的强加或移植，必须是内在的演化和        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"勃勃生机  强制性  积淀","B":"枝繁叶茂  约束性  渗透","C":"历久弥新  指导性  转化","D":"欣欣向荣  系统性  升华"},"answer":"A","explanation":"第一空，根据“没有中华文化沃土的滋养”可知，横线处体现中国特色社会主义制度发展好之意，且与“沃土”构成形象表达对应，A项“勃勃生机”形容生命力旺盛的样子，B项“枝繁叶茂”形容枝叶繁密茂盛，D项“欣欣向荣”指草木长得茂盛，生机勃勃的样子，均符合文意，保留。C项“历久弥新”指经历长久的时间而更加鲜活，更加有活力，更显价值，无法与“沃土”构成形象表达对应，不符合语境，排除。\n第二空，根据“这种文化不可能是外来的强加或移植”可知，横线处应体现制度绝不只是一系列强行规范性的约束，A项“强制性”指必须依照法律适用、不能以个人意志予以变更，B项“约束性”有限制、管束使不越出范围之意，均符合文意，保留。D项“系统性”强调的是整体性，与文意不符，排除。\n第三空，根据文意可知，横线处应体现文化的内在发展，A项“积淀”形容一些非物质化（如精神、品质、文化等）的积累过程，符合文意，当选。B项“渗透”指液体缓慢地透到里面或比喻一种思想或势力逐渐向其它方面扩展，无法体现文化的内在发展，排除。\n故正确答案为A。\n【文段出处】中国青年网《迈向伟大复兴的制度自信》","no":38,"missingImage":false},{"type":"question","qid":"5445727","cat":"逻辑填空","stem":"环境整治关键要不留死角、不存盲点，光靠人为监管恐怕会            。目前，“互联网＋”数字技术已成为环境监测的利器，为生态环境监测布下“天罗地网”。这张网使任何“            ”都能充分暴露在数据“阳光”之下，让环境监测和污染防治变得更加        、更加具象。\n依次填入画横线部分最恰当的一项是：","options":{"A":"捉襟见肘 一举一动 有效","B":"力不从心 风吹草动 精细","C":"顾此失彼 小打小闹 动态","D":"收效甚微 蛛丝马迹 直观"},"answer":"B","explanation":"第一空，根据“环境整治关键要不留死角、不存盲点”可知，横线处应体现出光靠人为监管恐怕不够之意，A项“捉襟见肘”指顾此失彼，应付不过来，B项“力不从心”指心里想做，可是能力或力量够不上，C项“顾此失彼”指顾了这个，顾不了那个，均符合文意，保留。D项“收效甚微”指付出的努力基本没什么效果，文段强调的是只靠人为监管可能会不够，而不是人为的监管基本没有效果，置于此处程度过重，排除。\n第二空，横线处应体现出“为生态环境监测布下‘天罗地网’”的结果，即这张网能够让任何小的变动暴露在数据下之意，A项“一举一动”指人的每一个动作，B项“风吹草动”比喻轻微的动荡或变故，均符合文意，保留。C项“小打小闹”指小规模、零零碎碎地做事，文段并无做事规模大小之意，排除。\n第三空，横线处对应前文“充分暴露在数据‘阳光’之下”，且与“具象”构成并列关系，应体现出环境监测和污染防治能够更加具体之意，B项“精细”指精密细致，符合文意，当选。A项“有效”指能实现预期目的，有效果，无法与“具象”构成并列关系，排除。\n故正确答案为B。\n【文段出处】《用好环境监测的“智慧大脑”》","no":39,"missingImage":false},{"type":"question","qid":"5445730","cat":"逻辑填空","stem":"竞争与创新总是            。平台反垄断最终要在抑制垄断与鼓励创新之间达到平衡。一方面，要加快健全市场准入制度、公平竞争审查机制，预防和        滥用行政权力限制竞争，充分        市场竞争机制的强大动能；另一方面，要引导和激励平台企业把更多精力用在创新上。唯有如此，平台经济方能为全社会注入持久的创新活力。\n依次填入画横线部分最恰当的一项是：","options":{"A":"如影随形  约束  调控","B":"互为表里  杜绝  挖掘","C":"相辅相成  打击  激发","D":"息息相关  制止  释放"},"answer":"D","explanation":"第一空，根据“平台反垄断最终要在抑制垄断与鼓励创新之间达到平衡”可知，竞争与创新二者关系是密切的，横线处所填成语应体现两者之间的关系非常密切，A项“如影随形”比喻两个事物关系密切或两个人关系密切不能分离，D项“息息相关”指彼此呼吸都相互关联，形容关系非常密切，均符合文意，保留。B项“互为表里”指甲为乙的外表，乙为甲的内里，比喻互相依存，互相接受，文段并非强调二者是互相依存的关系，与文意不符，排除；C项“相辅相成”指两件事物互相配合，互相补充，缺一不可，文段侧重强调的是竞争与创新之间有密切的关系，而非强调二者互相配合，互相补充，与文意不符，排除。\n第二空，根据“要加快健全市场准入制度、公平竞争审查机制”可知，横线处所填词语应体现要营造公平竞争的环境，使滥用行政权力限制竞争这类行为不再发生，D项“制止”指强迫使停止，不允许继续，符合文意，保留。A项“约束”指限制管束使不越出范围，置于此处程度过轻，文段强调的是“使之不再发生”，排除。\n第三空，代入验证，横线处所填词语搭配“动能”，根据文意可知，需体现发挥市场竞争机制的强大动能的含义，D项“释放”符合文意，且与“动能”为常见搭配，当选。\n故正确答案为D。\n【文段出处】广州日报《平台反垄断要用好“两手”》","no":40,"missingImage":false},{"type":"question","qid":"5445735","cat":"片段阅读","stem":"当前，社会治理形势复杂，仅靠职能部门、专业力量远远不够，迫切需要人民群众和社会各界的积极支持与参与，共同创造公共价值。众包是公众和外包的组合词，意指发包方依托互联网或其衍生工具，在数字平台上设计规则与任务并向广泛、非确定的公众发包，公众根据自身能力自愿接包并完成特定事务。众包强调大众参与的开放式合作，促使组织边界向更广泛的大众群体开放，旨在挖掘隐藏在公众中的巨大潜力。因此，相较于政府购买等专业性较强的政府合同外包服务，政府众包展现出更开放的社会治理格局。\n最适合做这段文字标题的是：","options":{"A":"众包：共享经济下的新型用工模式","B":"政府众包：公众参与社会治理新方式","C":"公众参与：开放式合作的新形式","D":"“互联网+”：公共管理新范式"},"answer":"B","explanation":"文段开篇交代背景，指出社会治理形势存在的问题，并论述其需要人民群众和社会各界共同创造公共价值。接着引出“众包”的话题并给出定义，即公众可根据自身能力自愿接包并完成特定事务。接下来指出众包强调大众参与，旨在挖掘公众潜力。最后尾句通过“因此”总结前文，得出结论，并通过程度词“更”强调政府众包可以让社会治理格局更加开放。故文段重点围绕“政府众包”进行论述，强调其可解决当下社会治理存在的问题，对应B项。\nA项，“共享经济”为文段未提及内容，无中生有，且“众包”将文段核心话题“政府众包”范围扩大，排除；\nC项，缺少文段核心话题“政府众包”，排除；\nD项，“互联网+”为文段未提及内容，无中生有，且缺少文段核心话题“政府众包”，排除。\n故正确答案为B。\n【文段出处】中国社会科学网《政府众包：公众参与社会治理的新趋势》","no":41,"missingImage":false},{"type":"question","qid":"5445689","cat":"片段阅读","stem":"在市场经济时期，劳动密集型制造工厂普遍采用流水线技术，工人被高度“去技能化”，几乎不需要技能便可完成装配操作，企业没有需求也没有动力去培养中高级技术工人。但是，当一个国家的产业结构向中高端迈进时，高水平职业教育的支撑作用就会显现出来。技术进步与人力资本相互影响、相互促进：企业引进的高端生产线，需要技术工人去操作和维护，否则技术改造和升级就无法实现；如果没有配套的职业技能培训体系，企业的转型升级就难以达到预期效果。\n这段文字意在说明：","options":{"A":"产业结构转型升级需要职业教育的支撑","B":"技术进步对人力资本提出了更高要求","C":"“技工荒”会随产业结构升级更趋严重","D":"职业技能培训需求与经济增长有相关性"},"answer":"A","explanation":"文段开篇介绍了在市场经济时期，流水线上的工人几乎不需要技能便可完成装配操作，企业无需去培养中高级技术工人，随后通过转折词“但是”提出观点，即在产业结构向中高端升级时，高水平职业教育会起着支撑作用。尾句通过对技术进步和人力资本的双向作用进行阐述，进一步支撑论证了转折后的观点。故文段重点在转折之后，强调高水平职业教育对于产业结构升级的支撑作用，对应A项。\nB项，缺少主题词“职业教育”和“产业结构”，偏离文段核心话题，排除；\nC项，“技工荒”无中生有，且缺少主题词“职业教育”，偏离文段核心话题，排除；\nD项，“经济增长”偷换概念，文段重在强调职业教育对于产业结构升级的支撑作用，排除。\n故正确答案为A。\n【文段出处】《向上的阶梯——经济转型时期新技术工人的社会流动》","no":42,"missingImage":false},{"type":"question","qid":"5445691","cat":"片段阅读","stem":"作为经典的艺术门类，绘画在历史长河中并非独立发展。在原始艺术中，音乐、诗歌、舞蹈三位一体，密不可分，绘画则将载歌载舞的场景留存于世。不同艺术门类成熟之后各自独立，但在发展的过程中又相互吸收、相互依托、相互影响。各艺术门类之间的吸收与借鉴、配合与结合，是艺术发展创新的重要手段。古典名画是人类审美情趣的集中体现，很长一段时间是深藏在博物馆中的高雅艺术，名画想要真正“活”化，还需要借助跨界融合。\n这段文字意在强调：","options":{"A":"绘画是诗歌和舞蹈传承的重要载体","B":"不同艺术门类的跨界融合由来已久","C":"古典名画可以借助跨界融合重焕生机","D":"打破形式壁垒是艺术创新的重要手段"},"answer":"C","explanation":"文段开篇引出绘画发展的话题，随后指出绘画可留存载歌载舞的场景。紧接着通过转折关联词“但”强调不同艺术门类在成熟后的发展过程中是相互借鉴的，并表明此种方式对艺术发展创新很重要。接下来指出古典名画是一种高雅艺术，尾句通过“需要”引出对策，强调古典名画需要借助跨界融合来实现“活”化。故文段强调古典名画需要跨界融合，核心话题为“古典名画”“跨界融合”，对应C项。\nA项，对应文段转折之前的内容，非重点，且偏离文段核心话题“古典名画”“跨界融合”，排除；\nB、D两项，均偏离文段核心话题“古典名画”，排除。\n故正确答案为C。\n【文段出处】人民网《名画“活”了 传统文化“火”了》","no":43,"missingImage":false},{"type":"question","qid":"5445693","cat":"片段阅读","stem":"火山灰是指火山爆炸性喷发形成的，直径小于2毫米的喷发碎屑。在爆炸性火山活动中，围岩和岩浆被炸碎成细小的颗粒，形成火山灰。火山灰从火山口喷发到大气中，经过大气搬运再沉降到各类环境中，整个过程通常只有数年，从地质时间尺度来看，几乎只是瞬间。所以在各种地质记录中，火山灰是一种高精度的绝对时间标志层。火山灰年代学正是利用地质记录中的火山灰层来确定地质年代的科学，该学科可以解决一些重要的科学问题，比如大型火山喷发事件与气候变化、人类演化之间的关系，以及气候快速变化的区域差异等。\n这段文字主要介绍了：","options":{"A":"火山灰的形成过程与主要特点","B":"火山灰年代学的研究思路和价值","C":"火山灰在自然环境中的分布状态","D":"火山喷发对环境和人类的影响"},"answer":"B","explanation":"文段开篇引出火山灰的话题，并指出其形成与爆炸性火山活动有关，紧接着又指出火山灰形成的过程非常的短暂，随后通过结论词“所以”进行总结，指出在各种地质记录中，火山灰是一种高精度的绝对时间标志层，接着通过程度词“正是”强调，火山灰年代学是利用地质记录中的火山灰层来确定地质年代的科学，并且其可以解决一些重要的科学问题，最后通过“比如”进行举例说明。故文段重点强调了火山灰年代学是一门利用火山灰层来确定地质年代的科学，并且还可以解决一些重要的科学问题，对应B项。\nA项，“火山灰的形成过程”对应文段开篇，属于分述句部分内容，非重点，排除；\nC项，偏离文段核心话题“火山灰年代学”，且“分布状态”文段并未提及，无中生有，排除；\nD项，偏离文段核心话题“火山灰年代学”，且“火山喷发对环境和人类的影响”文段并未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《我科学家用贝叶斯统计方法厘清了准确的火山喷发年龄》","no":44,"missingImage":false},{"type":"question","qid":"5445698","cat":"语句表达","stem":"。十八大以来，国内外形势新变化和实践新要求，迫切需要我们从理论和实践的结合上深入回答关系党和国家事业发展、党治国理政的一系列重大时代课题。我们党勇于进行理论探索和创新，以全新的视野深化对共产党执政规律、社会主义建设规律、人类社会发展规律的认识，取得重大理论创新成果，集中体现为新时代中国特色社会主义思想。\n填入画横线部分最恰当的一项是：","options":{"A":"马克思主义是我们立党立国、兴党兴国的根本指导思想","B":"坚持和发展马克思主义，必须同中华优秀传统文化相结合","C":"我们必须坚定历史自信、文化自信，坚持古为今用、推陈出新","D":"推进马克思主义中国化时代化是一个追求真理、揭示真理、笃行真理的过程"},"answer":"D","explanation":"横线出现在文段开头，需结合后文内容进行分析。文段先交待理论需结合实践，后文说明探索理论、创新理论的成果即为新时代中国特色社会主义思想。故理论结合实践中实践指的是中国实际发展情况。故整个后文着重说明了理论需结合中国实际发展情况，对应D项，且“追求真理”对应文段“进行理论探索和创新”，“揭示真理”对应文段“取得重大理论创新成果”。\nA项，仅强调了理论的重要性，而文段强调的是理论与中国实际发展情况相结合，与D项相比，与后文衔接不当，排除；\nB项，“中华
