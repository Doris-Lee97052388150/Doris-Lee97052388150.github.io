x-width:532px\">","options":{"A":"①③⑥，②④⑤","B":"①③⑤，②④⑥","C":"①②⑥，③④⑤","D":"①⑤⑥，②③④"},"answer":"D","explanation":"元素组成不同，优先考虑属性规律。观察发现，题干图形均为轴对称图形，画出题干中每个图形的对称轴发现，图①⑤⑥的对称轴穿过图形的三个面，图②③④的对称轴穿过图形的一个面，即图①⑤⑥为一组，图②③④为一组。\n\u003cimg data-k=\"54ef4a3be3eb\" style=\"max-width:554px\">\n故正确答案为D。","no":82,"missingImage":false},{"type":"question","qid":"5445852","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"f497d79b81fe\" style=\"max-width:531px\">","options":{"A":"①⑤⑥，②③④","B":"①④⑥，②③⑤","C":"①②⑥，③④⑤","D":"①③④，②⑤⑥"},"answer":"B","explanation":"本题为分组分类题目。元素组成相同，但无明显位置规律和属性规律，考虑数量规律。观察发现，题干每个图形均存在黑球或白球被分隔开的情况，考虑部分数。图①④⑥中，黑球的部分数均为1，白球的部分数均为3；图②③⑤中，黑球的部分数均为3，白球的部分数均为1。即图①④⑥为一组，图②③⑤为一组。\n故正确答案为B。","no":83,"missingImage":false},{"type":"question","qid":"5445911","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"dae699dd811a\" style=\"max-width:476px\">","options":{"A":"①③⑥，②④⑤","B":"①④⑤，②③⑥","C":"①②⑥，③④⑤","D":"①③④，②⑤⑥"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，无明显属性规律，考虑数量规律。观察发现，题干图形封闭面较多，可优先考虑数面数量，但面数量无规律。继续观察发现，题干图形存在多个封闭面相交，均为“多圆相切”的变形图，考虑笔画数，图①②⑥均为一笔画图形，图③④⑤均为两笔画图形。即图①②⑥为一组，图③④⑤为一组。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"5445913","cat":"定义判断","stem":"化学动力学是研究化学反应速率和反应机理的化学分支学科，主要内容包括：（1）确定化学反应的速率以及温度、压力、催化剂、溶剂和光照等外界因素对反应速率的影响；（2）研究化学反应机理，揭示化学反应速率本质；（3）探求物质结构与反应能力之间的关系和规律。\n根据上述定义，下列没有体现化学动力学研究的是：","options":{"A":"研究表面积不同的各类煤块在相同温度条件下燃烧速率的变化","B":"研究不同光照和温湿度条件下植物叶片蒸腾作用的强度和效率","C":"在馒头制作的过程中，研究酵母菌对面粉发酵的催化反应模型","D":"在铁制品表面喷涂不同种类油漆，研究铁与水、氧气的反应情况，判断防锈效果"},"answer":"B","explanation":"第一步：找出定义关键词。\n“研究化学反应速率和反应机理的化学分支学科”、“确定化学反应的速率以及温度、压力、催化剂、溶剂和光照等外界因素对反应速率的影响”、“研究化学反应机理，揭示化学反应速率本质”、“探求物质结构与反应能力之间的关系和规律”。\n第二步：逐一分析选项。\nA项：研究的是外界温度对不同煤块燃烧速率的影响，燃烧是化学变化，符合“研究化学反应速率和反应机理的化学分支学科”、“确定化学反应的速率以及温度、压力、催化剂、溶剂和光照等外界因素对反应速率的影响”，符合定义，排除；\nB项：研究的是不同光照和温湿度条件下植物叶片蒸腾作用的强度和效率，植物叶片的蒸腾作用是指植物体内的水通过叶片上的气孔散发出去的过程，也就是水从液态变成了气态，没有生成新的物质，所以是物理变化，不符合“研究化学反应速率和反应机理的化学分支学科”，不符合定义，当选；\nC项：研究的是酵母菌对面粉发酵的催化反应模型，发酵是化学变化，符合“研究化学反应速率和反应机理的化学分支学科”、“研究化学反应机理，揭示化学反应速率本质”，符合定义，排除；\nD项：研究的是铁与水、氧气的反应情况，判断防锈效果，生锈是化学变化，符合“研究化学反应速率和反应机理的化学分支学科”、“确定化学反应的速率以及温度、压力、催化剂、溶剂和光照等外界因素对反应速率的影响”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":85,"missingImage":false},{"type":"question","qid":"5445845","cat":"定义判断","stem":"政策工具是指实现政策目标所要运用的手段与方法。政策工具可分为以下三种：\n（1）供给型政策工具，对政策目标起直接促进作用，通常体现政府的重要政策导向，包含资金、人才、设施、技术、信息等方面的有效支持；（2）需求型政策工具，对政策目标起到拉动作用，释放对政策目标的需求，减少外部干扰，包括服务外包、直接采购、国际交流与贸易管制等；（3）环境型政策工具，对政策目标起到间接促进作用，通常体现为通过目标、计划、法规、金融与税收等方式提供有利的政策环境，包括目标规划、金融服务、税收优惠、法规管制以及策略性措施等。\n根据上述定义，下列属于促进养老服务的需求型政策工具的是：","options":{"A":"政府向养老机构购买居家养老服务，为低保家庭60周岁以上失能老人提供服务","B":"政府提供资金建设社区食堂，解决失能、独居、空巢等老年人“舌尖养老”难题","C":"政府鼓励技工院校开设老年服务与管理、健康服务与管理、护理等养老服务相关专业","D":"商务部发布《关于推动养老服务产业发展的指导意见》，提出打造养老服务品牌"},"answer":"A","explanation":"第一步：找出定义关键词。\n供给型政策工具：“对政策目标起直接促进作用”、“通常体现政府的重要政策导向”、“包含资金、人才、设施、技术、信息等方面的有效支持”；\n需求型政策工具：“对政策目标起到拉动作用，释放对政策目标的需求，减少外部干扰”、“包括服务外包、直接采购、国际交流与贸易管制等”；\n环境型政策工具：“对政策目标起到间接促进作用”、“通常体现为通过目标、计划、法规、金融与税收等方式提供有利的政策环境”、“包括目标规划、金融服务、税收优惠、法规管制以及策略性措施等”。\n第二步：逐一分析选项。\nA项：政府向养老机构购买居家养老服务，体现了将服务外包给养老机构，符合“对政策目标起到拉动作用，释放对政策目标的需求，减少外部干扰”、“包括服务外包、直接采购、国际交流与贸易管制等”，符合“需求型政策工具”定义，当选；\nB项：政府提供资金建设社区食堂，说明政府直接提供资金支持，不符合“包括服务外包、直接采购、国际交流与贸易管制等”，不符合“需求型政策工具”定义，符合“供给型政策工具”定义，排除；\nC项：政府鼓励技工院校开设养老服务相关专业，说明进行人才培养，提供人才支持，不符合“包括服务外包、直接采购、国际交流与贸易管制等”，不符合“需求型政策工具”定义，符合“供给型政策工具”定义，排除；\nD项：国务院发布《关于推动养老服务产业发展的指导意见》，说明提供有利的政策环境，提出目标规划，不符合“包括服务外包、直接采购、国际交流与贸易管制等”，不符合“需求型政策工具”定义，符合“环境型政策工具”定义，排除。\n故正确答案为A。","no":86,"missingImage":false},{"type":"question","qid":"5445862","cat":"定义判断","stem":"背信规避是指当风险来源为另一个体而不是自然条件时，人们普遍更不愿意冒险，即在同等条件下，人们对于人为风险的规避程度高于对客观风险的规避程度，体现在人们面对人为风险时比面对客观风险时表现得更保守。\n根据上述定义，下列没有体现背信规避的是：","options":{"A":"在对客观题阅卷方式意愿的调查中，学生更愿意选择机器阅卷而非人工阅卷","B":"决定谁先开球时，双方球员都倾向于由裁判抛硬币决定而非裁判随机指定","C":"在老师打算指派一个人多承担一项任务时，同学们纷纷表示要抽签决定","D":"与老司机相比，坐新手司机开的车时，后排座上的乘客主动系安全带的更多"},"answer":"D","explanation":"第一步：找出定义关键词。\n定义中比较易懂的关键词在于：“风险来源为另一个体而不是自然条件时”、“人为风险的规避程度高于对客观风险的规避程度”。\n第二步：逐一分析选项。\nA项：在客观题阅卷方式中，学生更愿意选择机器阅卷而非人工阅卷，机器阅卷对应客观风险，人工阅卷对应人为风险，“学生更愿意选择机器阅卷而非人工阅卷”，符合“人为风险的规避程度高于对客观风险的规避程度”，符合定义，排除；\nB项：在决定谁先开球时，双方球员都倾向于由裁判抛硬币决定而非裁判随机指定，抛硬币对应客观风险，裁判指定对应人为风险，“双方球员都倾向于由裁判抛硬币决定而不是裁判指定”，符合“人为风险的规避程度高于对客观风险的规避程度”，符合定义，排除；\nC项：在老师打算指派一个人多承担一项任务时，同学们纷纷表示要抽签决定，抽签对应客观风险，老师指派对应人为风险，“同学们纷纷表示要抽签决定”，符合“人为风险的规避程度高于对客观风险的规避程度”，符合定义，排除；\nD项：与老司机相比，坐新手司机开的车时，后排座上的乘客主动系安全带的更多，老司机开车与新手司机开车都对应人为风险，没有体现客观风险，“坐新手司机开的车时后排座上的乘客主动系安全带的更多”，只是人为风险规避程度的比较，不符合“人为风险的规避程度高于对客观风险的规避程度”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":87,"missingImage":false},{"type":"question","qid":"5445856","cat":"定义判断","stem":"植物病害分为侵染性病害和非侵染性病害。侵染性病害是由病原物引起的，可以在植物个体间互相传染的病害；非侵染性病害是由于环境不良、营养元素不足等非生物因素造成的病害，由于没有病原物的侵袭，所以不会在植物间相互传染。\n根据上述定义，下列属于非侵染性病害的是：\n①需要微酸性生长环境的杜鹃花，种植在偏碱性土壤中，叶片会黄化\n②植株浇水过多，盆土积水后，由于植株根系缺氧，会导致植株萎蔫\n③除草剂使用不当会引起西瓜苗嫩叶黄化，叶片枯焦，植株萎缩\n④灰葡萄孢真菌会引起番茄灰霉病，发病后造成番茄大量烂果","options":{"A":"仅①④","B":"仅①②","C":"仅①②③","D":"仅②③④"},"answer":"C","explanation":"第一步：找出定义关键词。\n侵染性病害：“由病原物引起”、“可以在植物个体间互相传染”；\n非侵染性病害：“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”。\n第二步：逐一进行分析。\n①：杜鹃花由于生长在偏碱性土壤环境中而导致其叶片黄化，其中偏碱性土壤属于环境因素，符合“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”，符合“非侵染性病害”的定义；\n②：植株由于盆土积水后，根系缺氧导致其萎蔫，其中盆土积水属于环境因素，符合“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”，符合“非侵染性病害”的定义；\n③：西瓜苗由于除草剂使用不当而导致其嫩叶黄化等后果，其中除草剂使用不当属于非生物因素，符合“由于环境不良、营养元素不足等非生物因素造成”、“不会在植物间相互传染”，符合“非侵染性病害”的定义；\n④：番茄大量烂果是由灰葡萄孢真菌引起的，其中灰葡萄孢真菌属于病原物，而不是非生物因素，并且番茄因感染灰霉病而大量烂果，符合“由病原物引起”、“可以在植物个体间互相传染”，符合“侵染性病害”定义，不符合“非侵染性病害”的定义。\n综上，仅①②③符合“非侵染性病害”的定义。\n故正确答案为C。","no":88,"missingImage":false},{"type":"question","qid":"5445787","cat":"定义判断","stem":"单元素导语是指在撰写新闻导语（即消息的开头）时，突出表现一个新闻事实的导语。单元素导语按新闻五要素可分为：①何人导语，突出报道显要或影响大的新闻人物；②何事导语，突出报道新闻事实本身；③何时导语，突出报道读者关心的事情什么时候会发生或进行；④何地导语，突出报道一些重要或有特殊意义的地方发生重大变化的消息；⑤为什么导语，突出报道一个事件的起因。\n根据上述定义，下列导语与其分类对应正确的是：","options":{"A":"亲爱的读者，你知道为什么夏天夜空里看到的星星比冬天夜空里看到的多？——④","B":"1964年10月16日，我国第一颗原子弹爆炸成功——②","C":"杨先生带着2岁的女儿到市医院看病，没想到看一个“咳嗽”就要花1000多元——①","D":"谁是高考状元？这个一年一度的热门话题，今年却在XX省消失了——③"},"answer":"B","explanation":"第一步：找出定义关键词。\n单元素导语：“在撰写新闻导语（即消息的开头）时，突出表现一个新闻事实”；\n何人导语：“突出报道显要或影响大的新闻人物”；\n何事导语：“突出报道新闻事实本身”；\n何时导语：“突出报道读者关心的事情什么时候会发生或进行”；\n何地导语：“突出报道一些重要或有特殊意义的地方发生重大变化的消息”；\n为什么导语：“突出报道一个事件的起因”。\n第二步：逐一分析选项。\nA项：为什么夏天夜空看到的星星比冬天夜空里看到的多是想要表现事件的起因，符合“突出报道一个事件的起因”，符合“为什么导语”定义，不符合“何地导语”定义，对应错误，排除；\nB项：1964年10月16日，第一颗原子弹爆炸成功是新闻事实本身，符合“突出报道新闻事实本身”，符合“何事导语”定义，对应正确，当选；\nC项：杨先生带着女儿到医院看病，一个“咳嗽”花费1000多元是新闻事实本身，符合“突出报道新闻事实本身”，符合“何事导语”定义，不符合“何人导语”定义，对应错误，排除；\nD项：高考状元今年在XX省消失了，报道该省发生的重大变化，符合“突出报道一些重要或有特殊意义的地方发生重大变化的消息”，符合“何地导语”定义，不符合“何时导语”定义，对应错误，排除。\n故正确答案为B。","no":89,"missingImage":false},{"type":"question","qid":"5445915","cat":"定义判断","stem":"数字农业是指用数字化技术，按人类需要的目标，对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业。\n根据上述定义，下列没有体现数字农业的是：","options":{"A":"在大数据平台，点击任一块田地，就可以看到这块田地的土壤酸碱度、肥水条件、环境温度湿度等指标，农民可以根据这些信息进行田地管理","B":"某柑橘生产大省建立“柑橘产业大数据中心”，以数据驱动柑橘产业结构性改革和高质量发展","C":"通过电子标签等技术，对单个产品赋予身份编码及认证信息，在生产管理、仓储、物流、销售等环节实现信息追溯","D":"遇到连绵阴雨天，果蔬容易滋生病害，需要及时喷药，采用轻型直升机几个小时就可以完成传统作业方式十多人几天才能完成的工作"},"answer":"D","explanation":"第一步：找出定义关键词。\n“用数字化技术”、“对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业”。\n第二步：逐一分析选项。\nA项：在大数据平台，点击任一块田地就可以看到田地的一系列指标，符合“用数字化技术”，农民可以根据这些信息进行田地管理，符合“对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业”，符合定义，排除；\nB项：建立“柑橘产业大数据中心”，符合“用数字化技术”，以数据驱动柑橘产业结构性改革和高质量发展，符合“对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业”，符合定义，排除；\nC项：通过电子标签等技术对单个产品赋予身份编码及认证信息，符合“用数字化技术”，在各种环节实现信息追溯，符合“对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业”，符合定义，排除；\nD项：采用轻型直升机对果蔬进行喷药，只是提高了工作效率，没有体现利用数字化技术以及全程数字化和可视化表达等，不符合“用数字化技术”、“对农业所涉及的对象和全过程进行数字化和可视化表达、设计、控制、管理等的农业”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":90,"missingImage":false},{"type":"question","qid":"5445859","cat":"定义判断","stem":"小中取大法是指在决策时，首先计算各方案在不同自然状态下的收益，并找出各方案在最差自然状态下的收益，然后进行比较，选择在最差自然状态下收益最大或损失最小的方案作为最终方案的一种决策方法。大中取大法是指在决策时，首先计算各方案在不同自然状态下的收益，并找出各方案在最好自然状态下的收益，然后进行比较，选择在最好自然状态下收益最大的方案作为最终方案的一种决策方法。\n\u003cimg data-k=\"2e3ebfd87d45\" style=\"max-width:600px\">\n根据上述定义，分别使用小中取大法和大中取大法对上述方案进行决策，所选择的方案依次是：","options":{"A":"方案二和方案二","B":"方案二和方案一","C":"方案三和方案一","D":"方案三和方案二"},"answer":"D","explanation":"第一步：找出定义关键词。\n小中取大法：“找出各方案在最差自然状态下的收益”、“选择在最差自然状态下收益最大或损失最小的方案”；\n大中取大法：“找出各方案在最好自然状态下的收益”、“选择在最好自然状态下收益最大的方案作为最终方案”。\n第二步：逐一分析选项。\n依据设问使用“小中取大法”，需要符合“找出各方案在最差自然状态下的收益”、“选择在最差自然状态下收益最大或损失最小的方案”，表格中销路差此列对应的数据就是最差自然状态下的收益，方案三是销路差中收益最大的方案，因此根据“小中取大法”应选择方案三；\n依据设问使用“大中取大法”，需要符合“找出各方案在最好自然状态下的收益”、“选择在最好自然状态下收益最大的方案作为最终方案”，表格中销路好此列对应的数据就是最好自然状态下的收益，方案二是销路好中收益最大的方案，因此根据“大中取大法”应选择方案二，只有D项符合。\n故正确答案为D。","no":91,"missingImage":false},{"type":"question","qid":"5445924","cat":"定义判断","stem":"对称推断法是辨析文言词义的一种方法，是指通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析，推断其位置相对的文言词义的一种方法。\n根据上述定义，下列使用了对称推断法的是：","options":{"A":"归有光《项脊轩志》：“项脊轩，旧南阁子也。”其中的“也”，表判断的语气词，可不译","B":"吴均《与朱元思书》：“急湍甚箭，猛浪若奔。”其中的“箭”为名词，可据此推断“奔”也为名词，为“奔马”的意思","C":"《荀子·劝学》：“故木受绳则直，金就砺则利。”其中的“砺”，形旁为“石”，说明“砺”与“石”有关，意思是磨刀石","D":"《旧五代史·冯道传》：“臣所陈虽小，可以喻大。”成语“不言而喻”中的“喻”为“知晓”的意思，可据此推断此句中的“喻”为“知晓”的意思"},"answer":"B","explanation":"第一步：找出定义关键词。\n“通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析”、“推断其位置相对的文言词义”。\n第二步：逐一分析选项。\nA项：“项脊轩，旧南阁子也。”的意思是项脊轩，是过去的南阁楼，这句话没有运用对偶修辞格或排比修辞格，不符合“通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析”，不符合定义，排除；\nB项：“急湍甚箭，猛浪若奔。”的意思是湍急的水流比箭还快，凶猛的巨浪就像奔腾的骏马，这句话运用了对偶修辞格，“箭”和“奔”是位置相对的词语，可用“箭”推断“奔”的含义为“奔马”，符合“通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析”、“推断其位置相对的文言词义”，符合定义，当选；\nC项：“故木受绳则直，金就砺则利。”的意思是所以木材经墨线比量过就变得笔直，金属制的刀剑拿到磨刀石上去磨就能变得锋利，选项根据“砺”与“石”有关，推断其意思是磨刀石，但“石”并不是句子内部的词语，不符合“通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析”，不符合定义，排除；\nD项：“臣所陈虽小，可以喻大。”的意思是臣所说的这件事虽小，却可以说明大道理，这句话没有运用对偶修辞格或排比修辞格，不符合“通过对运用了对偶修辞格或排比修辞格的句子内部已知词语词义的分析”，不符合定义，排除。\n故正确答案为B。","no":92,"missingImage":false},{"type":"question","qid":"5445919","cat":"定义判断","stem":"分布区是指某生物的活动、生存范围。如下图所示，用黑色方块表示该生物已知、推断或预计出现的位点。分布区的划定是环绕所有已知、推断或预计出现的位点的最短连续边界所包含的面积，经常用最小凸边形来表示。该最小凸边形的每个内角不能超过180度，并要包含所有出现的位点。\n根据上述定义，对于下列位点所划定的分布区正确的是：\n\u003cimg data-k=\"5980c2cbc244\" style=\"max-width:400px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"第一步：找出定义关键词。\n“环绕所有已知、推断或预计出现的位点的最短连续边界所包含的面积”、“用最小凸边形来表示”、“该最小凸边形的每个内角不能超过180度，并要包含所有出现的位点”。\n第二步：逐一分析选项。\nA项：该项所示的区域划定范围为所有位点的最短连续边界，且范围的形状为每个内角不超过180度的凸边形，同时包含所有出现的位点，符合定义，当选；\nB项：该项所示的区域划定范围内包含超过180度的内角，不符合“该最小凸边形的每个内角不能超过180度，并要包含所有出现的位点”，不符合定义，排除；\nC项：该项所示的区域划定范围外存在位点，不符合“该最小凸边形的每个内角不能超过180度，并要包含所有出现的位点”，不符合定义，排除；\nD项：该项所示的区域划定范围左下角及右侧未连接位点，不属于最短连续边界，不符合“环绕所有已知、推断或预计出现的位点的最短连续边界所包含的面积”，不符合定义，排除。\n故正确答案为A。","no":93,"missingImage":false},{"type":"question","qid":"5445858","cat":"定义判断","stem":"细胞学检查是指对患者病变部位脱落、刮取或穿刺抽取的细胞，进行病理形态学的观察并做出定性诊断的检查方式。细胞学检查主要应用于肿瘤的诊断，也可用于某些疾病的检查和诊断，如内部器官炎症性疾病的诊断和激素水平的判定等。\n根据上述定义，下列属于细胞学检查的是：","options":{"A":"采集患者血液样本，分析血细胞比例变化，判断患者是否出现感染","B":"针对外伤患者皮肤纤维细胞的过度增生，实行激光打磨法，抑制炎性细胞浸润，修复再生皮肤组织","C":"通过拉网法收集食道癌患者的食道脱落细胞，鉴定细胞形态，明确癌变性质","D":"对脑疝患者脑室穿刺，放出脑室液以降低脑压，后再次穿刺注入造影剂，诊断其颅内占位病变的情况"},"answer":"C","explanation":"第一步：找出定义关键词。\n“患者病变部位脱落、刮取或穿刺抽取的细胞”、“进行病理形态学的观察”、“做出定性诊断的检查方式”。\n第二步：逐一分析选项。\nA项：采集患者血液样本，分析血细胞比例变化，不涉及病变部位的细胞，不符合“患者病变部位脱落、刮取或穿刺抽取的细胞”，不符合定义，排除；\nB项：激光打磨抑制炎性细胞浸润，修复再生皮肤组织，属于一种治疗方法，而不是定性诊断的检查方式，不符合“做出定性诊断的检查方式”，不符合定义，排除；\nC项：食道癌患者的食道脱落细胞，符合“患者病变部位脱落的细胞”，鉴定细胞形态，符合“进行病理形态学的观察”，明确癌变性质，符合“做出定性诊断的检查方式”，符合定义，当选；\nD项：放出脑室液以降低脑压，后再次穿刺注入造影剂，诊断其颅内占位病变的情况，是通过注入造影剂进行观察诊断，而不是对细胞进行观察诊断，不符合“患者病变部位脱落、刮取或穿刺抽取的细胞”，不符合定义，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"5445920","cat":"类比推理","stem":"花海：书山","options":{"A":"怒火：苦雨","B":"车流：人潮","C":"雪白：麦浪","D":"龙舟：木马"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n花海指的是像海洋般广阔的花群，书山指的是像山峰般高耸的书籍，二者为并列关系，且后一个字修饰前一个字。\n第二步：判断选项词语间逻辑关系。\nA项：怒火和苦雨不是并列关系，并且是“苦”修饰“雨”，前一个字修饰后一个字，与题干顺序不一致，排除；\nB项：车流指的是像河流般连续不断的车辆，人潮指的是像潮水一样的人群，二者为并列关系，且“流”修饰“车”，“潮”修饰“人”，与题干逻辑关系一致，当选；\nC项：雪白和麦浪无明显逻辑关系，与题干逻辑关系不一致，排除；\nD项：龙舟和木马为并列关系，但龙舟是指龙形船，“龙”修饰“舟”，“木”修饰“马”，都是前一个字修饰后一个字，与题干顺序不一致，排除。\n故正确答案为B。","no":95,"missingImage":false},{"type":"question","qid":"5445863","cat":"类比推理","stem":"猛药去疴：重典治乱","options":{"A":"民生在勤：勤则不匮","B":"从善如登：从恶如崩","C":"静以修身：俭以养德","D":"名非天造：必从其实"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“猛药去疴”意思是通过威力大的药达到去除疾病的目的，“重典治乱”意思是通过严酷的刑罚达到惩治坏人的目的，二者都可指问题很严重，必须采取有力的措施来处理，二者是近义关系，但选项没有近义关系，考虑拆词看结构，“猛药去疴”和“重典治乱”拆词后都能构成方式目的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“民生在勤”的意思是人民的生计在于勤劳，“勤则不匮”意思是勤劳就不会缺乏财物，二者拆词之后不存在方式目的对应关系，与题干逻辑关系不一致，排除；\nB项：“从善如登”意思是顺随良善像登山一样难，比喻学好向善很难，“从恶如崩”意思是顺随恶行像山崩一样容易，比喻学坏很容易，二者拆词之后不存在方式目的对应关系，与题干逻辑关系不一致，排除；\nC项：“静以修身”意思是通过内心安静精力集中来修养身心，“俭以养德”意思是通过俭朴的作风来培养品德，二者拆词后都能构成方式目的对应关系，与题干逻辑关系一致，当选；\nD项：“名非天造”的意思是名称不是天生就有的，“必从其实”的意思是必须依据其客观现实，二者拆词之后不存在方式目的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":96,"missingImage":false},{"type":"question","qid":"5445873","cat":"类比推理","stem":"强光照射：视力损伤","options":{"A":"台风过境：渔业停产","B":"网络招聘：业务扩张","C":"原油进口：能源紧缺","D":"风险防范：消防演练"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“强光照射”会导致“视力损伤”，二者为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“台风过境”会导致“渔业停产”，二者为因果对应关系，与题干逻辑关系一致，当选；\nB项：“业务扩张”会导致“网络招聘”，二者为因果对应关系，但词语顺序与题干相反，与题干逻辑关系不一致，排除；\nC项：“能源紧缺”会导致“原油进口”，二者为因果对应关系，但词语顺序与题干相反，与题干逻辑关系不一致，排除；\nD项：“风险防范”是“消防演练”的目的，二者为方式与目的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":97,"missingImage":false},{"type":"question","qid":"5445912","cat":"类比推理","stem":"一望无垠：辽阔","options":{"A":"人云亦云：重复","B":"耳提面命：教导","C":"方兴未艾：失败","D":"厉兵秣马：战斗"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“一望无垠”意思是宽广、辽阔，一眼望去看不到边际，与“辽阔”是近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“人云亦云”意思是人家怎么说，自己也跟着怎么说，指没有主见，随声附和别人，是贬义词；“重复”指相同的事物又一次出现，“重复”并不局限于重复他人的观点，且是中性的词语，二者不是近义关系，与题干逻辑关系不一致，排除；\nB项：“耳提面命”意思是拉着耳朵，面对面地教导，形容恳切地教诲，与“教导”是近义关系，与题干逻辑关系一致，当选；\nC项：“方兴未艾”意思是事物正在兴起、发展，一时不会终止，与“失败”是反义关系，与题干逻辑关系不一致，排除；\nD项：“厉兵秣马”意思是把兵器磨快，把战马喂饱，形容做好战前准备，强调的是事前做好准备工作，与“战斗”不是近义关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":98,"missingImage":false},{"type":"question","qid":"5445916","cat":"类比推理","stem":"特征提取：模式匹配：语音识别","options":{"A":"接诊病人：网上挂号：健康宣教","B":"提交资料：资格审核：报名成功","C":"询问证人：勘验现场：接到报警","D":"海事损害：请求赔偿：租赁船只"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n先特征提取，再模式匹配，最后语音识别，三者为时间先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：先网上挂号，再接诊病人，第一词与第二词的顺序与题干相反，与题干逻辑关系不一致，排除；\nB项：先提交资料，再资格审核，最后报名成功，与题干逻辑关系一致，当选；\nC项：先接到报警，再询问证人和勘验现场，与题干逻辑关系不一致，排除；\nD项：先租赁船只，再海事损害，最后请求赔偿，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":99,"missingImage":false},{"type":"question","qid":"5445779","cat":"类比推理","stem":"春季过敏：花粉：喷嚏","options":{"A":"肺炎：咳嗽：支原体","B":"乙型脑炎：病毒：发热","C":"失眠：恐惧：噩梦","D":"秋季腹泻：饮食：脱水"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n花粉可能会导致春季过敏，前两词为因果关系；打喷嚏是春季过敏的症状，第一词和第三词为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：咳嗽是肺炎的症状，前两词为对应关系；支原体感染可能会导致肺炎，第一词和第三词为因果关系，与题干逻辑关系不一致，排除；\nB项：病毒感染可能会导致乙型脑炎，前两词为因果关系；发热是乙型脑炎的症状，第一词和第三词为对应关系，与题干逻辑关系一致，当选；\nC项：恐惧可能会导致失眠，前两词为因果关系；噩梦不是失眠的症状，与题干逻辑关系不一致，排除；\nD项：秋季腹泻指发生在秋冬季的腹泻病，原因可能是饮食不当或饮食不洁，而非饮食，前两词不是因果关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":100,"missingImage":false},{"type":"question","qid":"5445868","cat":"类比推理","stem":"片剂：散剂：气雾剂","options":{"A":"边塞诗：山水诗：抒情诗","B":"口头契约：君子协定：书面协议","C":"泉水：湖水：天然水","D":"头部理疗：腰部理疗：腿部理疗"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n片剂是药物与辅料均匀混合后压制而成的片状或异形片状的固体制剂，散剂是指药物或与适宜的辅料经粉碎、均匀混合制成的干燥粉末状制剂，气雾剂是指药物和抛射剂共同封装于带有阀门的耐压容器中，使用时借抛射剂气化所产生的压力，定量或非定量地将药物以雾状喷出的制剂。三者是根据药物的剂型划分的，为并列关系中的反对关系。\n第二步：判断选项词语间逻辑关系。\nA项：边塞诗是以边疆地区军民生活和自然风光为题材的诗，山水诗是描写山水风景的诗，抒情诗是抒发诗人思想感情的诗，三者互为交叉关系，与题干逻辑关系不一致，排除；\nB项：口头契约是指不用书面的形式，通过口头达成的协议，书面协议指以书面形式达成的协议，二者均以协议形式进行划分，为并列关系，但君子协定是借指彼此之间互相信任的约定，并不是以协议形式进行划分，与另外两词不构成并列关系，与题干逻辑关系不一致，排除；\nC项：泉水是指从地下流出来的水，一般是天然水，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：头部理疗、腰部理疗和腿部理疗是根据理疗的身体部位划分的，三者为并列关系中的反对关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":101,"missingImage":false},{"type":"question","qid":"5445790","cat":"类比推理","stem":"标清：高清：超清","options":{"A":"亚音速：音速：超音速","B":"厅级：市级：省级","C":"迁怒：愤怒：暴怒","D":"幽静：寂静：安静"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n三者均对清晰度进行分类，构成并列关系，且清晰度依次递增。\n第二步：判断选项词语间逻辑关系。\nA项：三者均对速度进行分类，构成并列关系，且速度依次递增，与题干逻辑关系一致，当选；\nB项：厅级是我国的一个行政级别，而市级和省级属于我国的行政区划，三者不构成并列关系，与题干逻辑关系不一致，排除；\nC项：迁怒为动词，指把怒气发泄到别人身上，愤怒为形容词，指因极度不满而情绪激动，暴怒指极端愤怒，三者不构成并列关系，与题干逻辑关系不一致，排除；\nD项：幽静指清幽寂静，寂静指没有声音、很静，安静指安稳平静、没有声音，三者均是对静的描述，构成并列关系，但不是静的程度从低到高的依次递增，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":102,"missingImage":false},{"type":"question","qid":"5445791","cat":"类比推理","stem":"刑事警察 对于 （    ） 相当于 （    ） 对于 对外交涉","options":{"A":"公安机关；维护主权","B":"刑事案件；驻外武官","C":"打击犯罪；外交人员","D":"交通警察；外交领事"},"answer":"C","explanation":"逐一代入选项。\nA项：刑事警察是构成公安机关的一部分，二者为组成关系；对外交涉的目的是为了维护主权，二者为方式目的对应关系，前后逻辑关系不一致，排除；\nB项：刑事警察的主要任务是侦查刑事案件，刑事案件本身是一个名词，只是刑事警察的工作对象，二者为职业与工作对象的对应关系；驻外武官的主要任务是对外交涉，二者为职业与工作内容的对应关系，前后逻辑关系不一致，排除；\nC项：刑事警察的工作内容是打击犯罪，二者为职业与工作内容的对应关系；外交人员的工作内容是对外交涉，二者为职业与工作内容的对应关系，前后逻辑关系一致，当选；\nD项：刑事警察和交通警察都是警察，二者为并列关系中的反对关系；外交领事是一国根据协议派驻他国某城市或某地区的代表，是进行对外交涉的代表人物，二者是职业与工作内容的对应关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":103,"missingImage":false},{"type":"question","qid":"5445853","cat":"类比推理","stem":"缄口不言 对于 （    ） 相当于 （    ） 对于 虚怀若谷","options":{"A":"三缄其口；大智若愚","B":"畅所欲言；放荡不羁","C":"守口如瓶；礼贤下士","D":"口若悬河；矜功伐善"},"answer":"D","explanation":"逐一代入选项。\nA项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。三缄其口形容说话极其谨慎、不轻易开口，二者为近义关系；大智若愚指有智慧有才能的人，看起来好像很愚笨，也比喻有智慧的人极有涵养，不露锋芒。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者不是近义关系，前后逻辑关系不一致，排除；\nB项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。畅所欲言指尽情地说出想说的话，没有约束地把心里话吐露出来，二者为反义关系；放荡不羁意思是放纵任性，不加检点，不受约束。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者不是反义关系，前后逻辑关系不一致，排除；\nC项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。守口如瓶意思是闭口不谈，像瓶口塞紧了一般，形容说话谨慎，严守秘密，二者为近义关系；礼贤下士形容重视人才。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者不是近义关系，前后逻辑关系不一致，排除；\nD项：缄口不言意思是封住嘴巴，不开口说话，形容畏惧权势，言语谨慎，怕招惹是非，应当说的而不敢说或不愿意说。口若悬河意为说话滔滔不绝，像河水倾泄一样，形容能说善辩，话语不断，二者为反义关系；矜功伐善意思是夸耀自己的功劳和才能，形容极不虚心。虚怀若谷指胸怀像山谷一样深广，形容十分谦虚，能容纳别人的意见，二者为反义关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":104,"missingImage":false},{"type":"question","qid":"5445794","cat":"逻辑判断","stem":"人们感受气味通过嗅觉受体实现。研究发现：随着人类的演化，编码人类嗅觉受体的基因不断突变，许多在过去能强烈感觉气味的嗅觉受体已经突变为对气味不敏感的受体，与此同时，人类嗅觉受体的总体数目也随时间推移逐渐变少。由此可以认为，人类的嗅觉经历着不断削弱、逐渐退化的过程。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"随着人类进化，嗅觉中枢在大脑皮层中所占面积逐渐减少","B":"相对于视觉而言，嗅觉在人类感觉系统中的重要性较低","C":"人类有大约1000个嗅觉受体相关基因，其中只有390个可以编码嗅觉受体","D":"不同人群之间嗅觉存在很大差异，老年人的嗅觉敏感性明显低于年轻人"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：人类的嗅觉经历着不断削弱、逐渐退化的过程。\n论据：随着人类的演化，编码人类嗅觉受体的基因不断突变，许多在过去能强烈感觉气味的嗅觉受体已经突变为对气味不敏感的受体，与此同时，人类嗅觉受体的总体数目也随时间推移逐渐变少。\n本题论点论据均在讨论人类的嗅觉在逐渐退化，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出嗅觉中枢在大脑皮层中所占面积逐渐减少，说明嗅觉能力在降低，补充论据，可以加强，当选；\nB项：该项比较了视觉和嗅觉在人类感觉系统中的重要性，而论点讨论的是人类的嗅觉是否退化，话题不一致，无法加强，排除；\nC项：该项指出了人类的1000个嗅觉受体相关基因中有390个可以编码嗅觉受体，没有体现出数量变化的多少，而题干讨论的是嗅觉逐渐退化的过程，话题不一致，无法加强，排除；\nD项：该项讨论的是老年人和年轻人的嗅觉敏感性，而论点讨论的是人类的嗅觉是否退化，话题不一致，无法加强，排除。\n故正确答案为A。","no":105,"missingImage":false},{"type":"question","qid":"5445803","cat":"逻辑判断","stem":"R行星是位于太阳系的一颗小行星，质量不大，平均直径不足500米。在对R行星进行长达一年的观测后，人们发现其表面长期漂浮着砂粒，且砂粒在漂浮一段时间后，还会重新落在行星表面。由于R行星表面没有稳定的大气层，因此人们认为砂粒漂浮的现象主要来自静电，原因是太阳风进入行星表面产生电场时，砂粒会因静电力的作用离开行星表面漂浮游动起来，当没有太阳风时，砂粒又会回落下来。\n以下哪项如果为真，没有质疑上述观点？","options":{"A":"R行星与彗星组成类似，彗星靠近太阳时，受太阳风产生的静电影响，其表面砂粒将会漂浮","B":"R行星表面存在一氧化碳、干冰等挥发性物质，其升华会带动砂粒的释放与漂浮","C":"R行星质量小，静电作用只能扬起毫米级的砂粒，但目前其表面漂浮的砂粒尺寸都很大","D":"R行星自转速度快，星球上的物体受到离心作用强，其表面尘埃与石块会脱离引力束缚，剥落散逸"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：R行星砂粒漂浮的现象主要来自静电。\n论据：R行星表面没有稳定的大气层，太阳风进入行星表面产生电场时，砂粒会因静电力的作用离开行星表面漂浮游动起来，当没有太阳风时，砂粒又会回落下来。\n本题论点和论据讨论的都是砂粒漂浮和静电的关系，论点论据话题一致，本题为削弱选非题，排除能够削弱的选项即可。\n第二步：逐一分析选项。\nA项：该项指出R行星与彗星组成类似，彗星表面砂粒漂浮的原因是静电，所以R行星表面砂粒漂浮的原因也可能是静电，属于类比加强，无法削弱，当选；\nB项：该项指出R行星表面的一氧化碳、干冰等挥发性物质升华会带动砂粒漂浮，说明R行星砂粒漂浮存在其他原因，他因削弱，可以削弱，排除；\nC项：该项指出R行星的静电只能扬起毫米级的砂粒，但其表面漂浮的砂粒尺寸很大，因此R行星的静电无法使R行星砂粒漂浮，说明R行星砂粒漂浮的现象并非主要来自静电，削弱论点，可以削弱，排除；\nD项：该项指出R行星自转速度快导致砂粒漂浮，说明R行星砂粒漂浮存在其他原因，他因削弱，可以削弱，排除。\n本题为选非题，故正确答案为A。","no":106,"missingImage":false},{"type":"question","qid":"5445857","cat":"逻辑判断","stem":"调查显示，某地区第二产业从业人员与五年前相比减少了10.4%，对于第二产业从业人员减少的原因，一种观点认为，产业优化升级是第二产业从业人员减少的原因，第二产业在实现产业规模快速扩大的同时，不断加快技术改造，实现“机器换工”，客观上降低了工业企业的用工需求。另一种观点则认为，这与第二产业的优化升级无关，第三产业的蓬勃发展发挥了就业“蓄水池”的功能，吸纳了大量第二产业从业人员。\n以下哪项如果为真，最能削弱第二种观点？","options":{"A":"第二产业优化升级拉动了第三产业蓬勃发展","B":"该地区第三产业的整体规模比第二产业要小","C":"第三产业的发展得益于持续优化的营商环境","D":"第二产业和第三产业都对吸纳就业作出贡献"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：第二产业从业人员减少的原因，与第二产业的优化升级无关，第三产业的蓬勃发展发挥了就业“蓄水池”的功能，吸纳了大量第二产业从业人员。\n论据：无。\n本题只有论点没有论据，削弱优先考虑直接否定论点。\n第二步：逐一分析选项。\nA项：该项说的是第二产业优化升级拉动了第三产业蓬勃发展，进而导致第二产业从业人员减少，也就是说，导致第二产业从业人员减少的根本原因还是第二产业优化升级，直接削弱了论点，可以削弱，当选；\nB项：该项说的是该地区第三产业的整体规模比第二产业要小，与题干讨论的第二产业从业人员减少的原因无关，话题不一致，无法削弱，排除；\nC项：该项说的是第三产业发展的原因，与题干讨论的第二产业从业人员减少的原因无关，话题不一致，无法削弱，排除；\nD项：该项说的是第二产业和第三产业都对吸纳就业作出贡献，与题干讨论的第二产业从业人员减少的原因无关，话题不一致，无法削弱，排除。\n故正确答案为A。","no":107,"missingImage":false},{"type":"question","qid":"5445918","cat":"逻辑判断","stem":"杂草稻是稻田里不种自生、伴随栽培稻生长的一种“杂草型稻”。研究者在杂草稻基因组中发现了与干旱胁迫下叶片干枯程度显著相关的基因——PAPH1。消除该基因后的株系，其叶肉细胞膜内外钙离子和钾离子流速降低；而PAPH1基因过度表达的株系，其叶肉细胞膜内外钙离子和钾离子流速增加。因此研究者指出，PAPH1基因在杂草稻抗旱性中发挥关键作用。\n上述论证的成立须补充以下哪项作为前提？","options":{"A":"正常状态下的栽培稻长期生长在有水的环境中，不含PAPH1基因","B":"叶肉细胞膜内外钙离子和钾离子的流速也促进PAPH1基因的表达","C":"叶肉细胞膜内外钙离子和钾离子流速越高，杂草稻的抗旱性越强","D":"杂草稻与栽培稻存在基因交流，其演化与栽培稻选育品种密切相关"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：PAPH1基因在杂草稻抗旱性中发挥关键作用。\n论据：研究者在杂草稻基因组中发现了与干旱胁迫下叶片干枯程度显著相关的基因——PAPH1。消除该基因后的株系，其叶肉细胞膜内外钙离子和钾离子流速降低；而PAPH1基因过度表达的株系，其叶肉细胞膜内外钙离子和钾离子流速增加。\n本题的论点谈论的是“PAPH1基因”与“杂草稻抗旱性”的关系，论据谈论的是“PAPH1基因”与“钙离子和钾离子流速”的关系，话题不一致，加强优先考虑搭桥，即建立“杂草稻抗旱性”与“钙离子和钾离子流速”的关系。\n第二步：逐一分析选项。\nA项：指出“栽培稻”生长在有水环境下且不含PAPH1基因，但没提到“杂草稻”是否具有抗旱性，无法说明PAPH1基因在“杂草稻抗旱性”中是否发挥关键作用，主体不一致，无法加强，排除；\nB项：指出“钙离子和钾离子的流速”可以“促进PAPH1基因的表达”，是对论据的因果倒置，可以削弱，无法加强，排除；\nC项：指出“钙离子和钾离子流速”越高，“杂草稻的抗旱性”越强，建立了“杂草稻抗旱性”与“钙离子和钾离子流速”的关系，属于搭桥项，可以加强，当选；\nD项：指出杂草稻与栽培稻存在“基因交流”，且杂草稻的演化与栽培稻选育品种密切相关，但没提到“抗旱性”，无法说明PAPH1基因在“杂草稻抗旱性”中是否发挥关键作用，话题不一致，无法加强，排除。\n故正确答案为C。","no":108,"missingImage":false},{"type":"question","qid":"2579001","cat":"逻辑判断","stem":"汞在环境中有三种存在形态：金属汞、无机汞、有机汞。这三种形态下的汞均有毒性，其毒性由小到大依次为：无机汞＜金属汞＜有机汞。其中，金属汞是常温下唯一的液态金属。烷基汞是已知毒性最大的汞化合物，甲基汞毒性比无机汞大50~100倍。\n由此不能推出的是：","options":{"A":"烷基汞属于有机汞","B":"甲基汞不是无机汞","C":"有机汞和无机汞不能呈现出液态","D":"常温下的金属，除汞外均不呈液态"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干指出汞在环境中三种存在形态的毒性大小为：无机汞＜金属汞＜有机汞，且烷基汞是已知毒性最大的汞化合物，说明烷基汞是有机汞，可以推出，排除；\nB项：题干指出甲基汞毒性比无机汞大50~100倍，说明甲基汞不是无机汞，可以推出，排除；\nC项：题干只指出金属汞是常温下唯一的液态“金属”，而有机汞和无机汞均不是金属，因此无法推出“有机汞和无机汞不能呈现出液态”，当选；\nD项：题干指出金属汞是常温下唯一的液态金属，说明在常温下其他金属都不呈现出液态，可以推出，排除。\n本题为选非题，故正确答案为C。","no":109,"missingImage":false},{"type":"question","qid":"5445884","cat":"逻辑判断","stem":"传统污水处理，或通过重力沉降、混凝澄清、浮力浮上、离心力分离、磁力分离等物理方法对不溶态污染物进行分离，或通过酸碱中和法、化学沉淀法、氧化还原法等化学方法让污染物发生转化，而新兴的微生物治理技术则是通过水体微生物来净化污水。有专家认为，与传统手段相比，微生物治理技术是一种处理污水的更佳手段。\n以下哪项如果为真，不能支持上述观点？","options":{"A":"近年来，微生物技术的科研投入持续扩大，相关技术成果在土壤改良等领域已经得到了有效转化","B":"物理方法进行污水治理的处理厂，通常占地面积大，基建费、运行费高，能耗大，易出现污泥膨胀现象","C":"化学方法进行污水治理运行成本高，需消耗大量的化学试剂，易产生二次污染","D":"微生物技术污水治理的能耗低，效率高，剩余污泥量少，操作管理方便"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：与传统手段相比，微生物治理技术是一种处理污水的更佳手段。\n论据：传统污水处理，或通过重力沉降、混凝澄清、浮力浮上、离心力分离、磁力分离等物理方法对不溶态污染物进行分离，或通过酸碱中和法、化学沉淀法、氧化还原法等化学方法让污染物发生转化，而新兴的微生物治理技术则是通过水体微生物来净化污水。\n本题论点和论据话题一致，都是在对传统手段和微生物治理技术进行比较，加强优先考虑补充论据，本题为选非题，将可以加强的选项排除即可。\n第二步：逐一分析选项。\nA项：该项指出近年来微生物技术的科研投入持续扩大，相关技术成果在土壤改良等领域已经得到了有效转化，仅说明微生物技术对土壤改良的作用，没有提及对污水处理的作用，为无关项，无法加强，当选；\nB项：该项指出物理方法进行污水治理的处理厂，通常占地面积大，基建费、运行费高，能耗大，易出现污泥膨胀现象，补充说明传统手段具有成本高、能耗高、污染环境等缺点，补充论据，可以加强，排除；\nC项：该项指出化学方法进行污水治理运行成本高，需消耗大量的化学试剂，易产生二次污染，补充说明传统手段存在成本高、污染环境等缺点，补充论据，可以加强，排除；\nD项：该项指出微生物技术污水治理的能耗低，效率高，剩余污泥量少，操作管理方便，补充说明微生物技术治理污水有优势，补充论据，可以加强，排除。\n本题为选非题，故正确答案为A。","no":110,"missingImage":false},{"type":"question","qid":"5445883","cat":"逻辑判断","stem":"近来，国际大宗商品市场中，原油和天然气价格达到近十年以来的高位，锌矿价格也上涨了7%左右，有分析人士认为，大宗商品市场将进入“超级周期”（大宗商品价格高于长期平均价格的时期）。从宏观层面看，大宗商品进入“超级周期”是全球经济出现新的增长动力的结果。历史上大宗商品进入“超级周期”往往会带动全球经济复苏，这也预示着当下全球经济正在复苏。\n以下哪项如果为真，最能削弱上述论证？","options":{"A":"地缘政治的风险加剧了大宗商品供应的紧张局势，引发本轮大宗商品价格上涨","B":"飙升的天然气价格推高了化肥的主要成分——氨的价格，进而推高全球粮食价格","C":"全球经济将更注重环保，碳中和与碳达峰将改变能源产业格局，进而影响金属和原油产业的发展远景","D":"全球主要经济体正在加紧出台强有力的救市计划，以寻求本国新的经济增长动力"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：大宗商品市场将进入“超级周期”（大宗商品价格高于长期平均价格的时期）。从宏观层面看，大宗商品进入“超级周期”是全球经济出现新的增长动力的结果。历史上大宗商品进入“超级周期”往往会带动全球经济复苏，这也预示着当下全球经济正在复苏。\n论据：无。\n本题的论点的逻辑是“全球经济出现新的增长动力”导致大宗商品市场将进入“超级周期”，进而预示当下全球经济正在复苏，本题只有论点，没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：论点的逻辑是“全球经济新的增长动力导致大宗商品价格上涨”，该项给出了导致“大宗商品价格上涨”的另一个原因，削弱论点，可以削弱，当选；\nB项：该项说的是天然气价格推高了氨的价格，进而推高全球粮食价格，只说明了部分商品之间的价格关联度，而论点讨论的是大宗商品价格高于平均的原因以及产生的结果，话题不一致，无法削弱，排除；\nC项：该项说的是全球经济将更注重环保，碳中和与碳达峰将改变能源产业格局，而论点讨论的是大宗商品价格高于平均的原因以及产生的结果，话题不一致，无法削弱，排除；\nD项：该项说的是全球主要经济体为寻求本国新的经济增长动力而出台救市计划，而论点讨论的是大宗商品价格高于平均的原因以及产生的结果，话题不一致，无法削弱，排除。\n故正确答案为A。","no":111,"missingImage":false},{"type":"question","qid":"5445925","cat":"逻辑判断","stem":"考古人员对岳阳新墙河流域的大马古城址及其相关东周遗存进行调查研究，推测这里是东周时期麋子国城的遗址。东周时期麋子国被楚灭亡后迁徙江南，最后定居在今岳阳新墙河流域，因此大马古城址应是麋子国遗民南迁后所筑的麋子国城遗址。凤形嘴山、将军潭、尧岭山所在的这一区域应是麋子国遗民生产活动和生活栖息的地方。\n以下哪项如果为真，不能支持考古人员的推测？","options":{"A":"据明隆庆《岳州府志》记载，先秦时期被楚灭国后迁来岳州的有罗、麋、许三国遗民，其中麋子国遗民定居在巴陵（今湖南岳阳）境内","B":"大马古城址、凤形嘴山、将军潭、尧岭山墓地均为楚系，而麋与楚本来同源同祖同姓，二者在文化上相通是顺理成章的","C":"麋子国原为周初的一个子爵小国，与楚国同姓。它最早居于今山东梁山县，又辗转多地，后定居锡穴（今陕西白河县）","D":"大马古城位于今岳阳市东南，与《读史方舆纪要》中记载的岳州“府东三十里，相传古麋子国”所记位置大体一致"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：大马古城址应是麋子国遗民南迁后所筑的麋子国城遗址。\n论据：东周时期麋子国被楚灭亡后迁徙江南，最后定居在今岳阳新墙河流域。凤形嘴山、将军潭、尧岭山所在的这一区域应是麋子国遗民生产活动和生活栖息的地方。\n本题为选非题，可以使用排除法，将可以加强的选项排除，选择无法加强的选项。且本题论点、论据讨论的都是麋子国的遗址，二者讨论的话题一致，可以通过补充论据的方式进行加强。\n第二步：逐一分析选项。\nA项：《岳州府志》记载，先秦时期被楚灭国后的麋子国遗民定居在巴陵（今湖南岳阳）境内，通过列举史书记载，说明麋子国遗民确实定居在今岳阳境内，补充论据，可以加强，排除；\nB项：大马古城址、凤形嘴山、将军潭、尧岭山墓地均为楚系，而麋与楚在文化上相通，说明大马城址、凤形嘴山、将军潭、尧岭山墓地等区域确实有可能是麋子国遗民生产活动和生活栖息的地方，补充论据，可以加强，排除；\nC项：麋子国最早居于今山东梁山县，又辗转多地，后定居在今陕西白河县，讨论的是麋子国曾经的定居地点，但这些地点中是否包含大马古城址并不明确，为不明确项，无法加强，当选；\nD项：大马古城的位置与《读史方舆纪要》中所记关于麋子国的位置大体一致，说明大马古城址确实可能是麋子国的遗址，补充论据，可以加强，排除。\n本题为选非题，故正确答案为C。","no":112,"missingImage":false},{"type":"question","qid":"5445921","cat":"逻辑判断","stem":"面对需求收缩、供给冲击、预期转弱三重压力，要想实现国内经济发展稳中求进，关键是要稳住市场主体。只有围绕市场主体需求实施更大力度减税降费，才能帮助其渡过资金难关。除了减税降费外，还需继续深化“放管服”改革，才能为市场主体营造更加市场化、法治化的营商环境。只有营商环境更加市场化、法治化，市场主体才会获得内生动力，从而进一步增强国内经济的吸引力、创造力、竞争力。\n由此可以推出：","options":{"A":"实施更大力度减税降费，是帮助市场主体渡过资金难关的必要举措","B":"只要稳住市场主体，就能实现国内经济发展稳中求进","C":"如果深化“放管服”改革，就能营造更加市场化、法治化的营商环境","D":"若市场主体不具有内生动力，国内经济就不会有吸引力、创造力、竞争力"},"answer":"A","explanation":"第一步：翻译题干。\n①实现国内经济发展稳中求进\u003cimg data-k=\"a37757d411ef\">稳住市场主体；\n②帮助市场主体渡过资金难关\u003cimg data-k=\"a37757d411ef\">围绕市场主体需求实施更大力度减税降费；\n③为市场主体营造更加市场化、法治化的营商环境\u003cimg data-k=\"a37757d411ef\">减税降费 且 继续深化“放管服”改革；\n④市场主体获得内生动力\u003cimg data-k=\"a37757d411ef\">营商环境更加市场化、法治化；\n⑤进一步增强国内经济的吸引力、创造力、竞争力\u003cimg data-k=\"a37757d411ef\">市场主体获得内生动力。\n第二步：逐一分析选项。\nA项：该项翻译为“帮助市场主体渡过资金难关\u003cimg data-k=\"a37757d411ef\">实施更大力度减税降费”，是对②的肯前，肯前必肯后，可以推出，当选；\nB项：该项翻译为“稳住市场主体\u003cimg data-k=\"a37757d411ef\">实现国内经济发展稳中求进”，是对①的肯后，但肯后得不到确定性的结论，无法推出，排除；\nC项：该项翻译为“深化‘放管服’改革\u003cimg data-k=\"a37757d411ef\">营造更加市场化、法治化的营商环境”，肯定了③后“且”关系中的一项，得不到确定性的结论，无法推出，排除；\nD项：该项翻译为“市场主体不具有内生动力\u003cimg data-k=\"a37757d411ef\">国内经济就不会有吸引力、创造力、竞争力”，是对⑤的否后，否后必否前，得到“\u003cimg data-k=\"0be436194951\">进一步增强国内经济的吸引力、创造力、竞争力”，但进一步增强即“本来就有”且需要增强，否后得到的“不会进一步增强”国内经济的吸引力、创造力、竞争力与选项的“不会有”吸引力、创造力、竞争力，不是同义替换，无法推出，排除。\n故正确答案为A。","no":113,"missingImage":false},{"type":"question","qid":"5445922","cat":"逻辑判断","stem":"石、方、白、于、叶5人参加单板滑雪、跳台滑雪、越野滑雪和高山滑雪4个项目的比赛，每人参加一个项目，每个项目均有1-2人参加。\n已知：（1）如果石和白至少有一人参加高山滑雪，则方参加单板滑雪，而于参加高山滑雪；\n（2）如果于和方至少有一人参加高山滑雪，则白和叶均参加单板滑雪。\n如果叶未参加高山滑雪，则可以得出以下哪项？","options":{"A":"方参加了越野滑雪","B":"叶未参加单板滑雪","C":"石参加了高山滑雪","D":"白未参加跳台滑雪"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）每人参加一个项目，每个项目均有1-2人参加；\n（2）石高山滑雪 或 白高山滑雪\u003cimg data-k=\"a37757d411ef\">方单板滑雪 且 于高山滑雪；\n（3）于高山滑雪 或 方高山滑雪\u003cimg data-k=\"a37757d411ef\">白单板滑雪 且 叶单板滑雪；\n（4）\u003cimg data-k=\"0be436194951\">叶高山滑雪；\n将（2）和（3）串联得到条件（5）石高山滑雪 或 白高山滑雪\u003cimg data-k=\"a37757d411ef\">方单板滑雪 且 于高山滑雪\u003cimg data-k=\"a37757d411ef\">白单板滑雪 且 叶单板滑雪。\n第二步：根据题干条件进行推理。\n题干条件（4）为确定信息，根据条件（4）\u003cimg data-k=\"0be436194951\">叶高山滑雪可知，其余4人均可能参加高山滑雪，考虑采用假设法做题。根据条件（5）假设石高山滑雪 或 白高山滑雪，能够推出方参加单板滑雪，进而得出白和叶都参加单板滑雪，此时有3人参加单板滑雪，明显违背条件（1）每人参加一个项目，每个项目均有1-2人参加，因此石和白均不参加高山滑雪，排除C项；此时再结合条件（4）可知，叶、石和白均不参加高山滑雪，故而得出于高山滑雪 或 方高山滑雪，代入条件（3）可知白和叶均参加单板滑雪，排除B项；结合条件（1）每人参加一个项目，因此白不可能再参加跳台滑雪，D项正确。\n故正确答案为D。","no":114,"missingImage":false}],"count":40,"answerable":40,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        截至2021年底，我国固定互联网宽带接入用户数比上年底净增5224万户。其中，100Mbps及以上接入速率的用户比上年底净增6385万户。\u003c/p>\u003cp>        按接入方式划分，固定互联网宽带接入用户可分为xDSL用户、光纤用户和其他用户；按接入速率划分，固定互联网宽带接入用户可分为100Mbps速率以上用户和其他用户。\u003c/p>\u003cp>\u003cimg data-k=\"373ca5dfad08\" style=\"max-width:694px\">\u003c/p>","questions":[{"qid":"5445929","cat":"增长","stem":"2021年1~2月，我国固定互联网宽带接入用户数月均约增加多少万户？","options":{"A":"867","B":"629","C":"434","D":"315"},"answer":"C","explanation":"根据题干“2021年1~2月······月均约增加······万户”，可判定本题为年均增长量问题。定位文字材料第一段可得：截至2021年底，我国固定互联网宽带接入用户数比上年底净增5224万户；定位统计表可得：2021年2月末我国固定互联网宽带接入用户数为49222万户，12月末为53579万户。根据公式：基期量=现期量-增长量，可得2020年12月末我国固定互联网宽带接入用户数为53579-5224=48355万户。根据公式：年均增长量\u003cimg data-k=\"ef392bd0cc6f\">，则2021年1~2月，我国固定互联网宽带接入用户数月均增加\u003cimg data-k=\"6737f74ea4e1\">\u003cimg data-k=\"961ddabc95a9\">万户。\n故正确答案为C。","no":115,"missingImage":false},{"qid 171=37亿块。可知2019年与2020年同比增量相等，即折线图中第三和第四个点高度一致，只有A项符合。\n故正确答案为A。","no":124,"missingImage":false}]},{"type":"material","material":"\u003cp>        超级计算，也被称为高性能计算。从算力资源的需求看，高性能计算可以分为尖端超算、通用超算、业务超算和人工智能超算四大类。\u003c/p>\u003cp>\u003cimg data-k=\"1cc3c267f4ff\" style=\"max-width:672px\">\u003c/p>\u003cp>\u003cimg data-k=\"a7f6132c1854\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"5445847","cat":"综合","stem":"2020～2021年，中国超算服务市场累计规模约为多少亿元？","options":{"A":"328","B":"354","C":"371","D":"396"},"answer":"B","explanation":"定位统计表可得2020年中国尖端超算、通用超算、业务超算和人工智能超算服务市场规模分别为28.3亿元、37.8亿元、64.4亿元、27.7亿元；2021年这四类超算服务市场规模分别为31.4亿元、40.3亿元、85.6亿元、38.3亿元。则2020～2021年，中国超算服务市场累计规模=28.3+37.8+64.4+27.7+31.4+40.3+85.6+38.3\u003cimg data-k=\"b90a7b7e5ea0\">亿元。\n故正确答案为B。","no":125,"missingImage":false},{"qid":"5445850","cat":"增长","stem":"2018年，中国超算服务4类细分市场中，同比增速最快和最慢的市场当年市场规模同比增速相差约多少个百分点？","options":{"A":"41","B":"47","C":"53","D":"59"},"answer":"C","explanation":"根据题干“2018年······同比增速······百分点”，可判定本题为一般增长率问题。定位统计表可得2017、2018年中国超算服务4类细分市场的市场规模。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，可知2018年，中国超算服务4类细分市场的市场规模同比增速分别为：\n尖端超算：\u003cimg data-k=\"717dff23ca63\">；\n通用超算：\u003cimg data-k=\"d7370fdd1666\">；\n业务超算：\u003cimg data-k=\"0e86b06d03dd\">；\n人工智能超算：\u003cimg data-k=\"40bdb48106fb\">。\n则增速最快的市场为人工智能超算，最慢的市场为尖端超算，所求=58%-5%=53%，即相差约53个百分点。\n故正确答案为C。","no":126,"missingImage":false},{"qid":"5445849","cat":"综合","stem":"2019年，中国第三方超算服务市场规模约占同年超算服务总体市场规模的：","options":{"A":"15%","B":"18%","C":"21%","D":"24%"},"answer":"A","explanation":"根据题干“2019年······占同年······”，结合材料时间为2019年，可判定本题为现期比重问题。定位统计表可得2019年中国尖端超算、通用超算、业务超算和人工智能超算的市场规模；定位统计图可得2019年中国第三方独立超算服务商和互联网超算服务商的市场规模。则所求比重\u003cimg data-k=\"73c3659cb5d0\">\u003cimg data-k=\"69ef8c90566c\">，与A项最接近。\n故正确答案为A。","no":127,"missingImage":false},{"qid":"5445851","cat":"增长","stem":"如保持2021年同比增量不变，则到哪一年第三方互联网超算服务商提供的服务市场规模将第一次超过第三方独立超算服务商？","options":{"A":"2025年","B":"2026年","C":"2027年","D":"2028年"},"answer":"B","explanation":"根据题干“如保持2021年同比增量不变，则到哪一年······将第一次超过······”，可判定本题为现期追赶问题。定位统计图可知2020年、2021年中国第三方独立超算和互联网超算服务商市场规模。根据公式：增长量=现期量-基期量，则2021年第三方互联网超算服务商市场规模同比增量=13.8-9.5=4.3亿元，2021年第三方独立超算服务商市场规模同比增量=18.3-15.0=3.3亿元。根据公式：现期量=基期量+n×增长量，可列式：13.8+n×4.3＞18.3+n×3.3，解得n＞4.5，则n至少为5，即到2026年第三方互联网超算服务商提供的服务市场规模将第一次超过第三方独立超算服务商。\n故正确答案为B。","no":128,"missingImage":false},{"qid":"5445854","cat":"综合","stem":"能够从上述资料中推出的是：","options":{"A":"2016～2020年，通用超算服务市场累计规模超过160亿元","B":"2016～2017年，业务超算服务市场累计规模比人工智能超算服务高30多亿元","C":"2018～2021年，第三方独立超算服务市场规模同比增量逐年递增","D":"2017～2020年，第三方互联网超算服务市场规模同比增速逐年递减"},"answer":"D","explanation":"A项：定位统计表可得2016~2020年通用超算服务市场规模分别为23.9亿元、26.9亿元、29.7亿元、32.2亿元、37.8亿元。则所求=23.9+26.9+29.7+32.2+37.8\u003cimg data-k=\"8215ae184a6a\">\u003cimg data-k=\"627d6c0bc1b3\">亿元＜160亿元，错误；\nB项：定位统计表可得2016~2017年业务超算服务市场规模分别为15.6亿元、24.1亿元，人工智能超算服务市场规模分别为4.7亿元、7.9亿元。则所求=（15.6+24.1）-（4.7+7.9）=39.7-12.6=27.1亿元＜30亿元，错误；\nC项：定位统计图可得2017~2021年中国第三方独立超算服务市场规模。根据公式：增长量=现期量-基期量，则2018年同比增量=8.7-7.1=1.6亿元；2019年同比增量=11.7-8.7=3.0亿元；2020年同比增量=15.0-11.7=3.3亿元；2021年同比增量=18.3-15.0=3.3亿元。因2021年同比增量与2020年相等，则非逐年递增，错误；\nD项：定位统计图可得2016~2020年中国第三方互联网超算服务市场规模。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，则2017年同比增速\u003cimg data-k=\"b6c2e745dc9b\">；2018年同比增速\u003cimg data-k=\"137fb2a1a7ab\">；2019年同比增速\u003cimg data-k=\"76886d7d4a40\">；2020年同比增速\u003cimg data-k=\"8e2b076fb9f8\">。则2017~2020年中国第三方互联网超算服务市场规模同比增速逐年递减，正确。\n故正确答案为D。","no":129,"missingImage":false}]},{"type":"material","material":"\u003cp>        2021年，全国纺织品服装出口3155亿美元，同比增长8.4%。其中，纺织品出口1452.2亿美元，同比下降5.6%，较2019年增长22.0%；服装出口1702.8亿美元，同比增长24.0%，较2019年增长16.0%。其中，针织服装及衣着附件出口864.8亿美元，同比增长39.0%；梭织服装及衣着附件出口701.2亿美元，同比增长12.6%。\u003c/p>\u003cp>        2021年，中国对美国、东盟、欧盟和日本的纺织品服装出口合计1724.9亿美元。其中，对美国出口额为563.5亿美元，同比增长4.0%；向东盟十国出口纺织品服装491.2亿美元，同比增长24.9%；对欧盟27国出口纺织品服装469.9亿美元，同比下降11.1%；对日本出口纺织品服装200.3亿美元，同比下降7.2%。\u003c/p>\u003cp>        2021年，中国向全球出口纺织纱线138亿美元，出口织物667亿美元，分别同比增长41.5%和34.3%。纺织制品当中，防疫类口罩出口额为129.5亿美元，出口金额、数量同比分别下降76.0%和13.0%。除防疫类口罩外，其他纺织制品出口额为517.2亿美元，同比增长27.5%。\u003c/p>\u003cp>        20 盟27国（\u003cimg data-k=\"6726743d0d24\">亿美元）。\n故正确答案为D。","no":132,"missingImage":false},{"qid":"5445741","cat":"比重","stem":"2020年中国出口的纺织制品总额中，防疫类口罩出口额占比约为：","options":{"A":"57%","B":"72%","C":"33%","D":"45%"},"answer":"A","explanation":"根据题干“2020年······占比······”，结合材料时间为2021年，可判定本题为基期比重问题。定位文字材料第三段可知：2021年······纺织制品当中，防疫类口罩出口额为129.5亿美元，出口金额同比下降76.0%。除防疫类口罩外，其他纺织制品出口额为517.2亿美元，同比增长27.5%。根据公式：基期量\u003cimg data-k=\"37fde96738fb\">，可得2020年防疫类口罩出口额\u003cimg data-k=\"47b520895af6\">亿美元；2020年其他纺织制品出口额\u003cimg data-k=\"533011e3abdb\">亿美元。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，可得所求\u003cimg data-k=\"6ca46ef4131c\">。\n故正确答案为A。","no":133,"missingImage":false},{"qid":"5445744","cat":"综合","stem":"2020年，中国对“一带一路”沿线国家纺织品服装贸易顺差额约为多少亿美元？","options":{"A":"1129","B":"1253","C":"808","D":"1006"},"answer":"C","explanation":"根据题干“2020年······贸易顺差额约为多少亿美元”，结合材料时间为2021年，且贸易顺差额=出口额-进口额，可判定本题为基期和差问题。定位文字材料最后一段可得：2021年，中国向“一带一路”沿线国家出口纺织品服装1137.9亿美元，同比增长24.5%；同时，中国自“一带一路”沿线国家进口纺织品服装131.6亿美元，同比增长24.5%。根据公式：基期量\u003cimg data-k=\"37fde96738fb\">，可得所求\u003cimg data-k=\"92bc0faf66b9\">\u003cimg data-k=\"49e837846bc2\">\u003cimg data-k=\"c43062ff739e\">亿美元，与C项最接近。\n故正确答案为C。","no":134,"missingImage":false},{"qid":"5445878","cat":"倍数","stem":"甲、乙二人合伙成立公司，约定每年利润的60%留作公司发展用途，40%按二人投资比例分配。已知公司成立第三年的利润比第二年高300万元，是第一年利润的3倍；甲第二年分配的金额是第三年的一半，且比第一年多20万元。问乙的投资额占比为多少？","options":{"A":"40%","B":"50%","C":"60%","D":"75%"},"answer":"B","explanation":"设该公司第一年的利润为x万元，根据题意可得，第三年的利润为3x万元，第二年的利润为（3x-300）万元。已知每年二人将利润的40%按投资比例分配，且甲第二年分配的金额是第三年的一半，设甲的投资额占比为y，可列方程：\u003cimg data-k=\"f451f01a068f\">，解得x=200。则第一年的利润为200万元，第二年的利润为3×200-300=300万元。又因甲第二年分配的金额比第一年多20万元，可列方程：300×40%×y=200×40%×y+20，解得y=50%，故甲的投资额占比为50%，则乙的投资额占比为1-50%=50%。\n故正确答案为B。","no":135,"missingImage":false}]}],"count":21,"answerable":21,"pointsOf":16}],"total":135,"affected":[],"subtitle":"2023年 · 国考 · 6/6 模块"},{"slug":"2023-国考-地市级","title":"2023年国家公务员录用考试《行测》题（地市级网友回忆版）","year":"2023","group":"国考","modules":[{"label":"政治理论","items":[{"type":"question","qid":"5445885","cat":"时事政治","stem":"党的二十大报告指出，全面建成社会主义现代化强国，总的战略安排是分两步走。关于到二〇三五年我国发展的总体目标，下列表述正确的有几项？\n①经济实力、科技实力、综合国力大幅跃升，人均国内生产总值迈上新的大台阶，达到中等发达国家水平\n②实现高水平科技自立自强，力争进入创新型国家行列\n③建成现代化经济体系，形成新发展格局，基本实现新型工业化、信息化、城镇化、农业现代化\n④广泛形成绿色生产生活方式，基本实现“碳中和”目标，生态环境根本好转，美丽中国目标全面实现\n⑤把我国建设成为综合国力和国际影响力领先的社会主义现代化强国","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"A","explanation":"本题考查政治常识。\n①正确，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“到二〇三五年，我国发展的总体目标是：经济实力、科技实力、综合国力大幅跃升，人均国内生产总值迈上新的大台阶，达到中等发达国家水平······”\n②错误，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“到二〇三五年，我国发展的总体目标是：经济实力、科技实力、综合国力大幅跃升······实现高水平科技自立自强，进入创新型国家前列······”故应进入创新型国家“前列”。\n③正确，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“到二〇三五年，我国发展的总体目标是：经济实力、科技实力、综合国力大幅跃升······建成现代化经济体系，形成新发展格局，基本实现新型工业化、信息化、城镇化、农业现代化······”\n④错误，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“到二〇三五年，我国发展的总体目标是：经济实力、科技实力、综合国力大幅跃升······广泛形成绿色生产生活方式，碳排放达峰后稳中有降，生态环境根本好转，美丽中国目标基本实现······”其中“碳排放达峰后稳中有降”为“碳达峰”目标；“排出的二氧化碳或温室气体被植树造林、节能减排等形式抵消”为“碳中和”目标。\n⑤错误，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“在基本实现现代化的基础上，我们要继续奋斗，到本世纪中叶，把我国建设成为综合国力和国际影响力领先的社会主义现代化强国。”\n综上所述，正确的有①③，共2项。\n故正确答案为A。","no":1,"missingImage":false},{"type":"question","qid":"5445755","cat":"时事政治","stem":"党的二十大报告指出，要发展全过程人民民主，保障人民当家作主。关于人民民主，下列表述正确的是：\n①人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义\n②全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主\n③协商民主是实践全过程人民民主的重要形式\n④党内民主是全过程人民民主的重要体现","options":{"A":"①③④","B":"①②④","C":"①②③","D":"②③④"},"answer":"C","explanation":"本题考查政治常识。\n①②正确，二十大报告中“六、发展全过程人民民主，保障人民当家作主”部分指出：“我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家，国家一切权力属于人民。人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义。全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。”\n③正确，二十大报告中“六、发展全过程人民民主，保障人民当家作主”部分指出：“（二）全面发展协商民主。协商民主是实践全过程人民民主的重要形式。完善协商民主体系，统筹推进政党协商、人大协商、政府协商、政协协商、人民团体协商、基层协商以及社会组织协商，健全各种制度化协商平台，推进协商民主广泛多层制度化发展。”\n④错误，二十大报告中“六、发展全过程人民民主，保障人民当家作主”部分指出：“（三）积极发展基层民主。基层民主是全过程人民民主的重要体现。健全基层党组织领导的基层群众自治机制，加强基层组织建设，完善基层直接民主制度体系和工作体系，增强城乡社区群众自我管理、自我服务、自我教育、自我监督的实效。”\n综上所述，①②③正确。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"5445760","cat":"时事政治","stem":"党的二十大报告指出，新时代十年来“党和国家事业取得历史性成就、发生历史性变革”。关于新时代十年来取得的历史性成就，下列表述错误的是：","options":{"A":"谷物总产量稳居世界首位","B":"制造业规模、外汇储备稳居世界第一","C":"全社会研发经费支出跃居世界第一","D":"建成世界最大的高速铁路网"},"answer":"C","explanation":"本题考查政治常识。\nC项错误，A、B、D三项正确，二十大报告中“一、过去五年的工作和新时代十年的伟大变革”部分指出：“我们提出并贯彻新发展理念，着力推进高质量发展，推动构建新发展格局，实施供给侧结构性改革，制定一系列具有全局性意义的区域重大战略，我国经济实力实现历史性跃升······谷物总产量稳居世界首位，十四亿多人的粮食安全、能源安全得到有效保障。城镇化率提高十一点六个百分点，达到百分之六十四点七。制造业规模、外汇储备稳居世界第一。建成世界最大的高速铁路网、高速公路网，机场港口、水利、能源、信息等基础设施建设取得重大成就。我们加快推进科技自立自强，全社会研发经费支出从一万亿元增加到二万八千亿元，居世界第二位，研发人员总量居世界首位······”\n本题为选非题，故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"5445886","cat":"新思想","stem":"习近平经济思想是习近平新时代中国特色社会主义思想的重要组成部分。关于习近平经济思想，下列表述正确的有几项？\n①进入新发展阶段是我国经济发展的历史方位\n②推动高质量发展是我国经济发展的鲜明主题\n③坚持新发展理念是我国经济发展的指导原则\n④坚持对外开放是我国经济发展的第一动力\n⑤大力发展制造业和实体经济是我国经济发展的主要着力点","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"C","explanation":"本题考查政治常识。\n①②③⑤正确，④错误。由中共中央宣传部、国家发展和改革委员会组织编写的《习近平经济思想学习纲要》，将习近平经济思想基本内容梳理归纳为十三个方面：（1）加强党对经济工作的全面领导是我国经济发展的根本保证；（2）坚持以人民为中心的发展思想是我国经济发展的根本立场；（3）进入新发展阶段是我国经济发展的历史方位；（4）坚持新发展理念是我国经济发展的指导原则；（5）构建新发展格局是我国经济发展的路径选择；（6）推动高质量发展是我国经济发展的鲜明主题；（7）坚持和完善社会主义基本经济制度是我国经济发展的制度基础；（8）坚持问题导向部署实施国家重大发展战略是我国经济发展的战略举措；（9）坚持创新驱动发展是我国经济发展的第一动力；（10）大力发展制造业和实体经济是我国经济发展的主要着力点；（11）坚定不移全面扩大开放是我国经济发展的重要法宝；（12）统筹发展和安全是我国经济发展的重要保障；（13）坚持正确工作策略和方法是做好经济工作的方法论。\n综上所述，正确的有①②③⑤，共4项。\n故正确答案为C。","no":4,"missingImage":false},{"type":"question","qid":"5445887","cat":"新思想","stem":"习近平总书记指出，共同富裕是社会主义的本质要求，是中国式现代化的重要特征。下列对共同富裕的理解，正确的有几项？\n①共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕\n②鼓励各地因地制宜探索有效路径，按照城市、农村以及东部、中部、西部，确定各自指标，分阶段促进共同富裕\n③要处理好效率和公平的关系，构建初次分配、再分配、三次分配协调配套的基础性制度安排\n④实现共同富裕的目标，首先要通过全国人民共同奋斗把“蛋糕”做大做好，然后通过合理的制度安排正确处理增长和分配关系，把“蛋糕”切好分好","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查政治常识。\n①正确，在2021年第20期《求是》杂志刊发的《扎实推动共同富裕》一文中，习近平总书记强调，共同富裕是社会主义的本质要求，是中国式现代化的重要特征。我们说的共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义。\n②错误，2021年8月17日，中央财经委第十次会议召开，议题之一是研究扎实促进共同富裕问题。会议强调，要坚持循序渐进，对共同富裕的长期性、艰巨性、复杂性有充分估计，鼓励各地因地制宜探索有效路径，总结经验，逐步推开。在2021年第20期《求是》杂志刊发的《扎实推动共同富裕》一文中，习近平总书记提出，我总的认为，像全面建成小康社会一样，全体人民共同富裕是一个总体概念，是对全社会而言的，不要分成城市一块、农村一块，或者东部、中部、西部地区各一块，各提各的指标，要从全局上来看。\n③正确，2021年8月17日，中央财经委员会召开第十次会议强调，要坚持以人民为中心的发展思想，在高质量发展中促进共同富裕，正确处理效率和公平的关系，构建初次分配、再分配、三次分配协调配套的基础性制度安排。\n④正确，2021年中央经济工作报告指出，实现共同富裕目标，首先要通过全国人民共同奋斗把“蛋糕”做大做好，然后通过合理的制度安排把“蛋糕”切好分好。这是一个长期的历史过程。\n故正确的有①③④，共3项。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"5445869","cat":"新思想","stem":"习近平主席在二〇二二年新年贺词中提到了“祝融”探火、“羲和”逐日、“天和”遨游星辰。下列与之相关的说法正确的是：","options":{"A":"“祝融号”火星车使用的是核动力电池","B":"“羲和号”是我国首颗太阳探测科学技术试验卫星","C":"“祝融”“羲和”“天和”都是古代神话中的人物","D":"聂海胜等三名航天员搭乘神舟十四号前往天和核心舱"},"answer":"B","explanation":"本题考查政治常识。\nA项错误，中国的“祝融号”火星车并没有配备核电池，在火星上的一切行动依靠太阳能帆板来提供动力。“祝融号”火星车采用了4块超大型太阳能帆板，而且会随着太阳光的照射进行旋转，确保能吸收充足的太阳能。\nB项正确，2021年10月14日18时51分，我国在太原卫星发射中心采用长征二号丁运载火箭，成功发射首颗太阳探测科学技术试验卫星“羲和号”，实现我国太阳探测零的突破，这标志着我国正式步入“探日”时代。\nC项错误，祝融，号赤帝，中国古代神话中的火神、南方神、南岳神、南海神、夏神、灶神，五行神之一。羲和，中国上古神话中的太阳女神与制定时历的女神。羲和的原始形态来源于远古神话，在时代的更迭中她由最初的“日母”演变成“日御”，在后来的不断演化发展中，羲和又作为太阳神话、天文史官的代表人物。“天和”一词，最早出自《庄子·知北游》：若正汝形，一汝视，天和将至。天和指人的元气，也指天地祥和之气，自然和顺之理，天地之和气，并非古代神话中的人物。\nD项错误，2022年6月5日，搭载神舟十四号载人飞船的长征二号F遥十四运载火箭点火发射并取得圆满成功。当天，在神舟十四号载人飞船与空间站组合体成功实现自主快速交会对接后，航天员陈冬、刘洋、蔡旭哲依次进入中国空间站天和核心舱，正式开启为期6个月的在轨驻留。\n故正确答案为B。","no":6,"missingImage":false}],"count":6,"answerable":6,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"5445888","cat":"人文常识","stem":"《“十四五”全国农业绿色发展规划》是我国首部农业绿色发展专项规划，对“十四五”农业绿色发展工作作出了系统部署和具体安排。下列与之相关的说法错误的是：","options":{"A":"到2035年，农村生态环境根本好转，绿色生产生活方式广泛形成","B":"以果菜茶优势区为重点推动粪肥还田利用，减少化肥用量","C":"在西北地区支持一批用膜大县整县推进农膜回收","D":"在长江中下游、西南地区等南方粮食主产区集中示范耕作压盐技术模式"},"answer":"D","explanation":"本题考查政治常识。\n《“十四五”全国农业绿色发展规划》以下简称《规划》。\nA项正确，《规划》第二章第三节“发展目标”部分指出：“到2035年，农业绿色发展取得显著成效，农村生态环境根本好转，绿色生产生活方式广泛形成，农业生产与资源环境承载力基本匹配，生产生活生态相协调的农业发展格局基本建立，美丽宜人、业兴人和的社会主义新乡村基本建成。”\nB项正确，《规划》第四章第一节“推进化肥农药减量增效”部分指出：“推进化肥减量增效。技术集成驱动，以化肥减量增效为重点，集成推广科学施肥技术。在粮食主产区、园艺作物优势产区和设施蔬菜集中产区，推广机械施肥、种肥同播等措施，示范推广缓释肥、水溶肥等新型肥料，改进施肥方式。有机肥替代推动，以果菜茶优势区为重点推动粪肥还田利用，减少化肥用量，增加优质绿色产品供给。引导地方加大投入，在更大范围推进有机肥替代化肥。新型经营主体带动，培育扶持一批专业化服务组织，开展肥料统配统施社会化服务。鼓励农企合作推进测土配方施肥。”\nC项正确，《规划》第四章第三节“加强白色污染治理”部分指出：“推进农膜回收利用。落实严格的农膜管理制度，加强农膜生产、销售、使用、回收、再利用等环节管理。推广普及标准地膜，开展地膜覆盖技术适宜性评估，因地制宜调减作物覆膜面积。强化市场监管，禁止企业生产、采购、销售不符合国家强制性标准的地膜。积极探索推广环境友好生物可降解地膜。促进废旧地膜加工再利用，培育专业化农膜回收主体，发展废旧地膜机械化捡拾，建设农膜储存加工场点。建立健全农膜回收利用机制，在西北地区支持一批用膜大县整县推进农膜回收，加强长江经济带农膜回收利用，健全回收网络体系。开展区域农膜回收补贴制度试点，探索建立地膜生产者责任延伸制度。建立健全农田地膜残留监测点，开展常态化、制度化监测评估。”\nD项错误，《规划》第三章第一节“加强耕地保护与质量建设”部分指出：“加强退化耕地治理。坚持分类分区治理，集成推广土壤改良、地力培肥、治理修复等技术，有序推进退化耕地治理。在长江中下游、西南地区、华南地区等南方粮食主产区集成推广施用土壤调理剂、绿肥还田等技术模式，逐步实现酸化耕地降酸改良。在西北灌溉区、滨海灌溉区和松嫩平原西部等盐碱集中地区集成示范施用土壤调理剂、耕作压盐等技术模式，逐步实现盐碱耕地压盐改良。‘十四五’期间累计治理酸化、盐碱化耕地1400万亩。”\n本题为选非题，故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"5445765","cat":"经济常识","stem":"下列与金融活动相关的说法错误的是：","options":{"A":"有价证券的债务人可以请求债权人支付相应对价","B":"开展储蓄业务有助于实现货币购买力和商品供应量的平衡","C":"分红型商业保险的收益与保险公司的经营状况有关","D":"办理国家助学贷款的学生不需要办理贷款担保或抵押"},"answer":"A","explanation":"本题考查经济常识。\nA项错误，有价证券，是指标有票面金额，用于证明持有人或该证券指定的特定主体对特定财产拥有所有权或债权的凭证。有价证券的法律特征有：（一）有价证券与证券上所记载的财产权利不能分离。（二）有价证券的债务人是特定的，即证券的权利人只能向证券上记载的债务人请求实现债权。（三）有价证券的债务人的支付是单方义务，债务人不得请求权利人支付相应对价。\nB项正确，储蓄是指每个人或家庭，把节约的钱存到银行的经济活动。居民储蓄被银行积累起来，相应地增加社会可用的资金总量，支援社会生产发展，促进了社会积累的形成或增长。国家通过开展储蓄业务，可以有效地减少需求压力，实现货币购买力和商品供应量的平衡，调节货币流通。\nC项正确，分红型商业保险指保险公司将其实际经营成果优于定价假设的盈余，按一定比例向保单持有人进行分配的人寿保险产品。保单持有人可以分享保险公司经营成果的保险种类，保单持有人每年都有权获得建立在保险公司经营成果基础上的红利分配。\nD项正确，国家助学贷款是由政府主导，金融机构向高校家庭经济困难学生提供的信用助学贷款，帮助解决在校期间的学费和住宿费。国家助学贷款是信用贷款，学生不需要办理贷款担保或抵押，但需要承诺按期还款，并承担相关法律责任。\n本题为选非题，故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"5445795","cat":"法律常识","stem":"根据《中华人民共和国退役军人保障法》，下列说法正确的是：","options":{"A":"参战退役军人的随迁子女入学可以得到优先保障","B":"退役的军士和义务兵可以逐月领取退役金","C":"已被大学录取的现役军人可以在退伍后四年内入学","D":"退役军人创办企业可以享受免税、贷款免息等优惠政策"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国退役军人保障法》第二十九条第四款第一项规定：“随迁子女需要转学、入学的，安置地人民政府教育行政部门应当予以及时办理。对下列退役军人的随迁子女，优先保障：（一）参战退役军人。”\nB项错误，根据《中华人民共和国退役军人保障法》第二十一条第一款规定：“对退役的军官，国家采取退休、转业、逐月领取退役金、复员等方式妥善安置。”第二十二条第一款规定：“对退役的军士，国家采取逐月领取退役金、自主就业、安排工作、退休、供养等方式妥善安置。”第二十三条第一款规定：“对退役的义务兵，国家采取自主就业、安排工作、供养等方式妥善安置。”因此，退役的军官与军士可适用逐月领取退役金的安置方式，对于退役的义务兵并未规定可适用逐月领取退役金的安置方式。\nC项错误，根据《中华人民共和国退役军人保障法》第三十五条规定：“现役军人入伍前已被普通高等学校录取或者是正在普通高等学校就学的学生，服现役期间保留入学资格或者学籍，退役后两年内允许入学或者复学，可以按照国家有关规定转入本校其他专业学习。达到报考研究生条件的，按照国家有关规定享受优惠政策。”因此，已被大学录取的现役军人可以在退伍后两年内入学，而非四年。\nD项错误，根据《中华人民共和国退役军人保障法》第四十六条规定：“退役军人创办小微企业，可以按照国家有关规定申请创业担保贷款，并享受贷款贴息等融资优惠政策。退役军人从事个体经营，依法享受税收优惠政策。”因此，退役军人创办企业可以享受税收优惠、贷款贴息等优惠政策，而非享受免税、贷款免息等优惠政策。\n故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"5445796","cat":"法律常识","stem":"根据《中华人民共和国生物安全法》，下列说法错误的是：","options":{"A":"境外组织不得在我国从事中、高风险的生物技术研究、开发活动","B":"任何单位和个人未经批准，不得擅自引进、释放或者丢弃外来物种","C":"对高致病性的病原微生物，一律不得从事相关实验活动","D":"国家对我国人类遗传资源和生物资源享有主权"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国生物安全法》第三十八条第一款规定：“从事高风险、中风险生物技术研究、开发活动，应当由在我国境内依法成立的法人组织进行，并依法取得批准或者进行备案。”\nB项正确，根据《中华人民共和国生物安全法》第六十条第三款规定：“任何单位和个人未经批准，不得擅自引进、释放或者丢弃外来物种。”\nC项错误，根据《中华人民共和国生物安全法》第四十六条第一款规定：“高等级病原微生物实验室从事高致病性或者疑似高致病性病原微生物实验活动，应当经省级以上人民政府卫生健康或者农业农村主管部门批准，并将实验活动情况向批准部门报告。”\nD项正确，根据《中华人民共和国生物安全法》第五十三条第二款规定：“国家对我国人类遗传资源和生物资源享有主权。”\n本题为选非题，故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"5445815","cat":"人文常识","stem":"下列与交通安全有关的说法错误的是：","options":{"A":"机动车载运放射性危险物品应当经公安机关批准后按指定的时间、路线、速度行驶","B":"在允许拖拉机通行的道路上，拖拉机可以从事货运，但是不得用于载人","C":"行人故意碰撞机动车造成交通事故的，机动车一方承担次要责任","D":"前车为执行紧急任务的救护车、工程救险车的，后车不得超车"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国道路交通安全法》第四十八条第三款规定：“机动车载运爆炸物品、易燃易爆化学物品以及剧毒、放射性等危险物品，应当经公安机关批准后，按指定的时间、路线、速度行驶，悬挂警示标志并采取必要的安全措施。”\nB项正确，根据《中华人民共和国道路交通安全法》第五十五条第二款规定：“在允许拖拉机通行的道路上，拖拉机可以从事货运，但是不得用于载人。”\nC项错误，根据《中华人民共和国道路交通安全法》第七十六条第二款规定：“交通事故的损失是由非机动车驾驶人、行人故意碰撞机动车造成的，机动车一方不承担赔偿责任。”由此说明机动车一方无需承担次要责任。\nD项正确，根据《中华人民共和国道路交通安全法》第四十三条第三项规定：“同车道行驶的机动车，后车应当与前车保持足以采取紧急制动措施的安全距离。有下列情形之一的，不得超车：（三）前车为执行紧急任务的警车、消防车、救护车、工程救险车的。”\n本题为选非题，故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"5445807","cat":"科技常识","stem":"关于电信诈骗，下列说法错误的是：","options":{"A":"非法使用“伪基站”实施电信诈骗的以非法侵入计算机信息系统罪追究刑事责任","B":"实施电信诈骗最高可被判处无期徒刑","C":"电信诈骗受害人可以通过诉讼程序要求服务存在缺陷的电信运营商承担相应责任","D":"负责招募他人实施电信网络诈骗犯罪活动的，以共同犯罪论处"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《关于办理电信网络诈骗等刑事案件适用法律若干问题的意见》第三节第一点规定：“（一）在实施电信网络诈骗活动中，非法使用‘伪基站’‘黑广播’，干扰无线电通讯秩序，符合刑法第二百八十八条规定的，以扰乱无线电通讯管理秩序罪追究刑事责任。同时构成诈骗罪的，依照处罚较重的规定定罪处罚。”因此，非法使用“伪基站”实施电信网络诈骗活动，可能构成扰乱无线电通讯管理秩序罪或诈骗罪，不构成非法侵入计算机信息系统罪。\nB项正确，根据《中华人民共和国刑法》第二百六十六条规定：“诈骗公私财物，数额较大的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；数额巨大或者有其他严重情节的，处三年以上十年以下有期徒刑，并处罚金；数额特别巨大或者有其他特别严重情节的，处十年以上有期徒刑或者无期徒刑，并处罚金或者没收财产。本法另有规定的，依照规定。”若是诈骗数额特别巨大或者有其他特别严重情节的可被判处无期徒刑。\nC项正确，根据《中华人民共和国反电信网络诈骗法》第四十六条第二款规定：“电信业务经营者、银行业金融机构、非银行支付机构、互联网服务提供者等违反本法规定，造成他人损害的，依照《中华人民共和国民法典》等法律的规定承担民事责任。”第六条第五款规定：“电信业务经营者、银行业金融机构、非银行支付机构、互联网服务提供者承担风险防控责任，建立反电信网络诈骗内部控制机制和安全责任制度，加强新业务涉诈风险安全评估。”因此，电信运营商服务存在缺陷违反了《中华人民共和国反电信网络诈骗法》规定，受害人可以通过诉讼程序要求其承担相应责任。\nD项正确，根据《关于办理电信网络诈骗等刑事案件适用法律若干问题的意见》第四节第四点规定：“负责招募他人实施电信网络诈骗犯罪活动，或者制作、提供诈骗方案、术语清单、语音包、信息等的，以诈骗共同犯罪论处。”\n本题为选非题，故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"5445792","cat":"法律常识","stem":"根据《中华人民共和国职业教育法》，关于企业开展职业教育，下列说法错误的是：","options":{"A":"企业设立产教融合实训基地的，在公共事业费用上享受高于职业学校的优惠政策","B":"企业应当按照职工工资总额一定比例提取使用职工教育经费","C":"用于一线职工职业教育的经费应当达到国家规定的比例","D":"企业安排职工到职业学校接受职业教育的，应支付职业教育期间工资"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国职业教育法》第五十八条第二款规定：“企业设立具备生产与教学功能的产教融合实习实训基地所发生的费用，可以参照职业学校享受相应的用地、公用事业费等优惠。”题中，应是参照职业学校享受相应的公用事业费优惠，而非享受高于职业学校的优惠政策。\nB、C、D三项正确，根据《中华人民共和国职业教育法》第五十八条第一款规定：“企业应当根据国务院规定的标准，按照职工工资总额一定比例提取和使用职工教育经费。职工教育经费可以用于举办职业教育机构、对本单位的职工和准备招用人员进行职业教育等合理用途，其中用于企业一线职工职业教育的经费应当达到国家规定的比例。用人单位安排职工到职业学校或者职业培训机构接受职业教育的，应当在其接受职业教育期间依法支付工资，保障相关待遇。”\n本题为选非题，故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"5445870","cat":"人文常识","stem":"“亲人送水来解渴，军民鱼水一家人。横断山，路难行。······乌江天险重飞渡，兵临贵阳逼昆明。敌人弃甲丢烟枪，我军乘胜赶路程。调虎离山袭金沙······”这是歌曲《四渡赤水出奇兵》中的一段歌词，下列与之相关的说法正确的是：","options":{"A":"“调虎离山袭金沙”是由毛泽东指挥的","B":"李白《蜀道难》描写的正是此地“路难行”的状况","C":"“军民鱼水”之情表现了沿途人民群众对新四军的支持","D":"“乌江天险”正是楚汉战争时项羽兵败自刎的地方"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，“调虎离山袭金沙”是指四渡赤水，南渡乌江后，中央红军就把敌人的追兵甩在了后面。此时，毛泽东指出：要实现从云南北渡金沙江入川的战略目标，就在于能否调出滇军，调出滇军就是胜利。毛泽东采取声东击西的战术，命一部分兵力向瓮安、黄平方向佯攻，做出东进湖南与二、六军团会合的姿态，主力则直逼贵阳。在贵阳督战的蒋介石，急调滇军三个旅驰援贵阳，中央红军突然调头西进云南，做出攻打昆明的态势。龙云惊恐万状，火速从金沙江边调回民团以解昆明之急，金沙江一线江防顿时空虚，红军主力则迅速兵分三路，从寻甸、嵩明之间穿过，以每日120里的急行军速度直插金沙江边的皎平、龙街和洪门渡口。\nB项错误，李白《蜀道难》描绘了秦蜀道路上奇丽惊险的山川，“蜀道”指的是今四川广元市境内剑门一带。而歌曲描述的四渡赤水的地点在贵州省、四川省、云南省交界地区，不是同一地方。\nC项错误，新四军即国民革命军陆军新编第四军，隶属于国民党军队战斗序列，是第二次国共合作期间由第五次反围剿失败后留在南方八省进行游击战争的中国工农红军和游击队改编的队伍。“军民鱼水”之情表现的是长征途中沿途人民群众对中央红军的支持。\nD项错误，“乌江天险”中的乌江，又名黔江，是贵州的第一道大江，自古有天险之称。而项羽的自刎之地是现在的安徽省和县乌江镇。\n故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"5445789","cat":"科技常识","stem":"近年来，我国不断推进水生态修复保护工作。生态塘是包含水生动植物和微生物的一种水生态修复方式。下列与之相关的说法，错误的是：","options":{"A":"狐尾藻可用于富营养化水体的生态修复是因其可吸收氮磷","B":"可以用生石灰对生态塘沿岸土壤进行消毒处理","C":"池塘中的水体出现黑臭时可通过种植芦苇等植物进行改善","D":"生态塘中的青鱼等肉食性鱼类主要在池塘上层水体活动"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，狐尾藻是小二仙草科狐尾藻属植物，多年生粗壮沉水草本。根状茎发达，在水底泥中蔓延，节部生根，对富营养化水中的氮磷均有较好的净化作用。\nB项正确，蛋白质在遇到高温、强碱、强酸、重金属离子时会变性，蛋白质就失去了生物活性。生石灰遇水会发生反应放出大量的热，并且生成强碱，可以使细菌的蛋白质失去活性从而起到杀菌消毒的作用。\nC项正确，芦苇的根状茎十分发达，其叶、叶鞘、茎、根状茎和不定根都具有通气组织。当黑臭污水通过芦苇湿地系统时，芦苇能从污水中吸收营养物质加以利用，并能吸附和富集重金属及一些有毒有害物质，使水质得到净化。\nD项错误，青鱼是鲤科、青鱼属鱼类，体长可达145厘米，通常栖息在水的中下层，生性不活泼。其主要的食物来源为螺蛳、蚌、蚬、蛤等，偶尔也捕食虾和昆虫幼虫。\n本题为选非题，故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"5445713","cat":"科技常识","stem":"关于人体的生理现象，下列说法正确的是：","options":{"A":"人体在流汗时汗腺内的盐分浓度会降低","B":"蚊虫叮咬造成的皮肤发痒属于过敏反应","C":"打嗝声是由胃部痉挛和声带闭合造成的","D":"皮肤受伤流血处的血管会先扩张后收缩"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，汗液的形成一般是由于外界气温升高或者体内产热导致热刺激，激活汗腺功能，分泌大量液体，通过汗孔排到体表。由于汗腺还具备从产生出的汗液中再次将盐分吸收回体内的功能，所以通过再次吸收盐分，可以将盐分的流失抑制到最小程度。因此人体在流汗时汗腺内的盐分浓度会升高。\nB项正确，蚊虫叮咬引起的过敏症状有皮肤出现红肿、瘙痒，这是比较常见的过敏症状，也是比较轻微的过敏症状。出现这些症状是因为蚊虫叮咬所释放的唾液在皮肤组织产生刺激性的反应。\nC项错误，打嗝指气从胃中上逆，喉间频频作声，声音急而短促。这是一个生理上常见的现象，是由横膈膜痉挛收缩引起的。健康人打嗝多与饮食有关，特别是饮食过快、过饱，摄入很热或冷的食物饮料、饮酒等，外界温度变化和过度吸烟亦可引起。\nD项错误，当皮肤受伤流血后，血管会立即收缩，而不是先扩张后收缩。其收缩的目的是减少流向受伤部位的血液。过一段时间受伤部位的血液就会自动凝结变成血块，不让血液继续流出。\n故正确答案为B。","no":16,"missingImage":false},{"type":"question","qid":"5445709","cat":"人文常识","stem":"关于自然节律变化，下列说法错误的是：","options":{"A":"惊蛰后华北地区可能会出现“万里雪飘”的现象","B":"2月北回归线附近会出现“儿童急走追黄蝶，飞入菜花无处寻”的现象","C":"冬至时，在广东汕头竖直立杆会出现“立竿无影”的现象","D":"谷雨前后江浙地区可能会出现“一把青秧趁手青，轻烟漠漠雨冥冥”的现象"},"answer":"C","explanation":"本题考查地理国情。\nA项正确，惊蛰，又名“启蛰”，是二十四节气中的第三个节气，于每年公历3月5-6日交节。有谚语“雪打惊蛰节，四十五天阴”，意思是惊蛰节气出现下雪天气，后期天气持续阴冷。即惊蛰后华北地区可能出现“万里雪飘”的景象。\nB项正确，选项中诗句出自宋代杨万里的《宿新市徐公店》，意思是小孩子奔跑着追赶黄蝴蝶，可是蝴蝶飞入菜花丛中就再也找不到了。北回归线自西向东穿过中国云南、广西、广东、福建（海域）、台湾五省区。2月我国北回归线附近的地区平均气温在\u003cimg data-k=\"7181b1a2264f\">，金黄色的油菜花会开放，所以可以出现诗句中的景象。\nC项错误，立竿无影是一种自然景象，即直立在地上的物体没有阴影显现。在夏至正午时分，太阳直射北回归线呈绝对（接近）直射状，北回归线地区就会出现短暂的“立竿无影”现象。冬至时，太阳直射南回归线，在广东汕头竖直立杆，日影应朝北而不是无影。\nD项正确，选项中诗句出自宋代虞似良的《横溪堂春晓》，意思是将一把青色的秧苗，插入水中，那秧苗瞬间变得青葱，就好似农夫的手，将它染绿，天空中，飘洒着朦胧如烟的细雨。谷雨，是二十四节气中的第六个节气，春季的最后一个节气，于每年公历4月19日-21日交节。谷雨取自“雨生百谷”之意，此时降水明显增加，田中的秧苗初插、作物新种，最需要雨水的滋润。故谷雨前后江浙地区可能会出现诗句中的景象。\n本题为选非题，故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"5445705","cat":"人文常识","stem":"下列关于化石的说法正确的是：","options":{"A":"三叶虫化石是侏罗纪地层中的典型化石","B":"硅化木是树木埋入地下后形成的化石","C":"琥珀的硬度比和田玉大","D":"大多数化石是在侵入岩中被发现的"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，三叶虫化石，古时称作燕子石，也叫蝙蝠石。三叶虫属古生节肢动物，属三叶虫纲，生于海底，其种类繁多，生于古生代的寒武纪，至奥陶纪最盛，消亡于二叠纪末期的二叠纪大灭绝事件。侏罗纪界于三叠纪和白垩纪之间，是恐龙的鼎盛时期。\nB项正确，硅化木是真正的木化石，是几百万年或更早以前的树木被迅速埋入地下后，被地下水中的二氧化硅替换而成的树木化石，它保留了树木的木质结构和纹理。\nC项错误，琥珀，一种透明的生物化石，是松柏科、云实科、南洋杉科等植物的树脂化石。树脂滴落，掩埋在地下千万年，在压力和热力的作用下石化形成琥珀。其硬度比较低，一般莫氏硬度为2-3。和田玉属镁质大理岩与中酸性岩浆岩接触交代而形成的变质岩，内含透闪石、角闪石、阳起石等多矿物集合体，化学成分是含水的钙镁硅酸盐，莫氏硬度在6-6.5之间。\nD项错误，沉积岩，又称为水成岩，是三种组成地球岩石圈的主要岩石之一（另外两种是岩浆岩和变质岩）。沉积岩保留了许多地球的历史信息，包括大多数古代动植物化石，沉积岩的层理也有地球气候环境变化的信息。侵入岩是指当上覆岩层压力减轻时，软流层中的岩浆就钻出，在地壳深处冷凝而形成的岩石。\n故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"5445871","cat":"人文常识","stem":"关于我国著名的资源调配工程，下列说法正确的是：","options":{"A":"南水北调中线工程的起点是小浪底水库","B":"西电东送中部通道的电力主要来源于火力发电","C":"北煤南运的主要通道包括兰新线和陇海线","D":"西气东输工程贯穿了新疆、甘肃、安徽等省区"},"answer":"D","explanation":"本题考查地理国情。\nA项错误，“南水北调工程”是中华人民共和国的战略性工程，分东、中、西三条线路，东线工程起点位于江苏扬州江都水利枢纽。中线工程起点位于汉江中上游丹江口水库，供水区域为河南、河北、北京和天津。\nB项错误，“西电东送”就是把煤炭、水能资源丰富的西部省区的能源转化成电力资源，输送到电力紧缺的东部沿海地区。西电东送主要形成了三大电力输送通道：北线由陕西、山西、内蒙古等省区向华北输送电力，以黄河中上游的水电和山西、内蒙古火电为主。中线主要有四川等省区向华东和华中输送电力，以三峡和金沙江的水电为主。南线主要是云南、贵州、广西等省区向华南输送电力，以水电为主。\nC项错误，北煤南运宏观上指中国北方地区煤炭向南方地区大量运输。北煤南运的主要通道是大同-秦皇岛，太原-青岛，侯马-石臼所，长治-连云港，长治-枝城，长治-武汉等铁路。陇海兰新线是贯穿我国东西的一条铁路大动脉，由陇海线与兰新线组成。\nD项正确，西气东输工程是我国距离最长、口径最大的输气管道，该工程贯穿了新疆、甘肃、安徽等省区，其路线有西气东输一线、西气东输二线、西气东输三线、西气东输四线。西气东输一线西起新疆塔里木盆地的轮南，东至上海；西气东输二线西起新疆霍尔果斯口岸，南至广州、香港；西气东输三线西起新疆霍尔果斯口岸，东至福建福州；西气东输四线西起新疆乌恰县，终点在宁夏中卫。\n故正确答案为D。","no":19,"missingImage":false},{"type":"question","qid":"5445872","cat":"科技常识","stem":"关于生活常识，下列说法错误的是：","options":{"A":"腹部核磁共振时憋气可让脏器显影更充分","B":"食用蜡可以用于防止微生物对果实的侵害","C":"马铃薯切开后浸泡于清水中可以防止氧化","D":"可以通过虫子取食痕迹判断蘑菇是否有毒"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，患者进行磁共振扫描检查需要憋气，是因为呼吸期间腹部可出现起伏运动，因为腹部脂肪、水分随着起伏运动出现伪影，影响检查的清晰度，甚至可出现异常的检查结果，导致疾病误诊、漏诊等。患者检查时憋气可让脏器显影更充分，得到较准确的检查结果。\nB项正确，在水果表皮打上食用蜡，不仅可以保鲜，还能防止微生物对果实进行侵害。食用蜡对健康无明显影响，但如果是工业蜡则对身体有害。\nC项正确，马铃薯切开之后浸泡到清水里能防止马铃薯氧化，避免马铃薯变黑，但是将马铃薯切好之后浸泡时间最好不要过长，因为虽然泡水可以去除马铃薯中过多的淀粉，但浸泡时间过长就会出现变质的情况，且也会造成营养流失，吃起来口感下降。\nD项错误，很多对人有毒的蘑菇是其他动物的美食，比如豹斑鹅膏经常被蛞蝓取食，白毒伞也有被虫啮食的记录。\n本题为选非题，故正确答案为D。","no":20,"missingImage":false}],"count":14,"answerable":14,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"5445827","cat":"语句表达","stem":"构建新发展格局的关键在于经济循环的            ，就像人们讲的要调理好统摄全身阴阳气血的任督二脉。经济活动需要各种生产要素的组合在生产、分配、流通、消费各环节有机衔接，从而实现循环流转。\n填入画横线部分最恰当的一项是：","options":{"A":"行之有效","B":"环环相扣","C":"畅通无阻","D":"井然有序"},"answer":"C","explanation":"根据“就像人们讲的要调理好统摄全身阴阳气血的任督二脉”“实现循环流转”可知，横线处应体现经济循环畅通之意。C项“畅通无阻”指毫无阻碍地通行或通过，符合文意，当选。A项“行之有效”指实行起来有成效，B项“环环相扣”指每一个相互关连的关键或事物紧密配合，D项“井然有序”指整整齐齐，次序分明，条理清楚，三者均无法体现“畅通”之意，排除。\n故正确答案为C。\n【文段出处】求是《习近平：把握新发展阶段，贯彻新发展理念，构建新发展格局》","no":21,"missingImage":false},{"type":"question","qid":"5445829","cat":"逻辑填空","stem":"“报得准”是气象监测预报预警的生命力。天气预报准确率高，防灾减灾才能            ，为有关部门正确决策提供科学客观的支撑，应急处置才能有力有效。\n填入画横线部分最恰当的一项是：","options":{"A":"有条不紊","B":"有的放矢","C":"全力以赴","D":"万无一失"},"answer":"B","explanation":"根据“‘报得准’是气象监测预报预警的生命力”可知，强调天气预报准确率高很重要，后文论证，天气预报的准确性高，让防灾减灾更精准，所以横线处需要体现精准、有针对性，B项“有的放矢”指对准靶子射箭，比喻言论、行动目标明确，符合文意，当选。A项“有条不紊”指有条理，有次序，一点儿不乱，文段并非强调防灾减灾的条理性，C项“全力以赴”指把全部力量投入进去，文段并非强调投入全部力量，均与文意不符，排除；D项“万无一失”形容有绝对把握，绝不会出差错，表述过于绝对，排除。\n故正确答案为B。\n【文段出处】人民日报《庄国泰：早预警早行动 筑牢气象防灾减灾第一道防线》","no":22,"missingImage":false},{"type":"question","qid":"5445696","cat":"逻辑填空","stem":"红树林的地下部分长期处于厌氧环境，减缓了根系和凋落物的分解速率，加速了碳埋藏速率。此外，红树林大多分布于沉积型海岸河口，由上游河流和海洋潮汐共同作用带来的大量外源性碳，被它们固定并快速沉积下来。这“            ”的组合拳使得红树林成为海岸带蓝碳碳汇的主要贡献者。\n填入画横线部分最恰当的一项是：","options":{"A":"取长补短","B":"标本兼治","C":"开源节流","D":"一举两得"},"answer":"C","explanation":"根据“减缓了根系和凋落物的分解速率，加速了碳埋藏速率”及“此外······由上游河流和海洋潮汐共同作用带来的大量外源性碳，被它们固定并快速沉积下来”可知，横线处体现红树林两方面的作用和好处，且双引号引导形象表达。C项“开源节流”比喻在财政经济上增加收入，节省开支，置于此处，“开源”可以对应红树林固定并沉积外源性碳，“节流”对应“减缓了根系和凋落物的分解速率”，符合文意，当选。\nA项“取长补短”表示在同类事物中吸取这个的长处来弥补那个的短处，文段并未涉及两者的“长处”与“短处”，与文意不符，排除；B项“标本兼治”指对事物的枝节和根本都加以治理，文段并未涉及“枝节”和“根本”，与文意不符，排除；D项“一举两得”意为做一件事得到两方面的好处，文段的结论仅提及“成为海岸带蓝碳碳汇的主要贡献者”这一个结果，并未体现出两方面的好处，与文意不符，排除。\n故正确答案为C。\n【文段出处】《会打“组合拳”的“武林高手”——红树林》","no":23,"missingImage":false},{"type":"question","qid":"5445831","cat":"逻辑填空","stem":"我国十四亿多人口整体迈向现代化社会，规模超过现有发达国家人口的总和，艰巨性和复杂性            ，发展途径和推进方式也必然具有自己的特点。我们始终从国情出发想问题、作决策、办事情，既不好高骛远，也不因循守旧，保持历史        ，坚持稳中求进、循序渐进、持续推进。\n依次填入画横线部分最恰当的一项是：","options":{"A":"无与伦比 清醒","B":"前所未有 耐心","C":"无以复加 自信","D":"异乎寻常 主动"},"answer":"B","explanation":"本题从第二空入手，根据横线后内容“坚持稳中求进、循序渐进、持续推进”可知，横线处表达不急于求成，B项“耐心”指不急躁，不厌烦，与文意相符，保留。A项“清醒”指清楚、明白，侧重不糊涂，C项“自信”指自己相信自己，侧重不自馁，D项“主动”指不待外力推动而行动，侧重不被动，三者均与文意不符，排除。\n第一空，代入验证，B项“前所未有”指以前从来没有过，可以体现“艰巨性和复杂性”在以往的历史上不曾出现，与前文“规模超过现有发达国家人口的总和”对应恰当，当选。\n故正确答案为B。\n【文段出处】瞭望《以中国式现代化全面推进中华民族伟大复兴》","no":24,"missingImage":false},{"type":"question","qid":"5445715","cat":"逻辑填空","stem":"相比于其他全球卫星导航系统采取单一轨道星座构型，北斗系统            ，坚定选择了混合星座的特色发展之路，并首创短文通报模式，开创了通信导航一体化的独特服务模式，信息发送能力从一次120个汉字提升到一次1200个汉字，遇到突发情况时无需            ，足以将情节一次性说清楚。\n依次填入画横线部分最恰当的一项是：","options":{"A":"与众不同 言简意赅","B":"独树一帜 字斟句酌","C":"遥遥领先 删繁就简","D":"迎难而上 惜墨如金"},"answer":"B","explanation":"第一空，搭配“北斗系统”，且根据后文“特色发展之路”“首创短文通报模式，开创了······独特服务模式”可知，“北斗系统”与其他卫星导航系统不同，具有独特性。B项“独树一帜”指单独树立起一面旗帜，指自成一家，A项“与众不同”指与大家不一样，二者均能够体现出独特性，符合文意，保留；C项“遥遥领先”指远远地走在最前面，D项“迎难而上”形容不怕困难挫折，勇敢地挑战，二者均与文意无关，排除。\n第二空，对应前文“信息发送能力从一次120个汉字提升到一次1200个汉字”，后文“一次性说清楚”，可知，北斗系统信息发送能力得到提升，遇到突发情况不必过分推敲，删减字数。B项“字斟句酌”指写文章或说话慎重细致，一字一句地推敲琢磨，与文意相符，当选；A项“言简意赅”指语言简明而意思完备，“无需言简意赅”指的是表述啰嗦、繁复冗长，北斗系统的信息发送能力提升，并不意味着表述啰嗦、冗长，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《圆梦！中国北斗正式登上世界舞台》；中国经济网《“北斗三号”收官，正式服务全球》","no":25,"missingImage":false},{"type":"question","qid":"5445834","cat":"逻辑填空","stem":"地方政府要以民众利益、公共利益、国家利益为重，不能只追求短期利益，只追求政绩，而做出            的事情来。对官员的政绩考核、对政府的绩效评估，更要注重民生，注重社会的长远发展。这样才能从根本上避免破坏可持续发展大局、损害民众利益等“            ”现象的继续发生。\n依次填入画横线部分最恰当的一项是：","options":{"A":"本末倒置 抱薪救火","B":"饮鸩止渴 掩耳盗铃","C":"扬汤止沸 移花接木","D":"竭泽而渔 杀鸡取卵"},"answer":"D","explanation":"第一空，根据横线前“不能只追求短期利益，只追求政绩”可知，横线处所填成语应表达只图眼前利益，不作长远打算之意。A项“本末倒置”比喻把主要事物和次要事物或事物的主要方面和次要方面弄颠倒了，置于此处可表达地方政府不以民众、公共、国家利益为重，而只追求政绩的短视行为，符合文意，保留；D项“竭泽而渔”比喻取之不留余地，只顾眼前利益，不作长远打算，符合文意，保留。B项“饮鸩止渴”比喻用错误的方法解决眼前的困难而不顾严重后果，文段并无“解决眼前的困难”之意，与文意不符，排除；C项“扬汤止沸”比喻办法不对头，不能从根本上解决问题，文段强调的是只图眼前利益，不作长远打算，与文意不符，排除。\n第二空，根据横线前“避免破坏可持续发展大局”及“损害民众利益”可知，横线处所填成语应表达不顾可持续发展大局，损害民众利益，只顾眼前利益之意。D项“杀鸡取卵”比喻只图眼前的好处而损害长远的利益，符合文意，当选。A项“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，文段并无要“消灭祸患”之意，与文意不符，排除。\n故正确答案为D。\n【文段出处】《世界地质公园遭破坏 保护环境就要肃清错误政绩观》","no":26,"missingImage":false},{"type":"question","qid":"5445726","cat":"逻辑填空","stem":"翻开古代农书，几千年间古人对于土地的保养，几乎与当代耕作学关注的措施            ，其中历代农书涉及最多的是施肥。在中国古人的摸索中，施肥成为一种讲究，何时、何地施肥，施何种肥，怎样施肥，形成了一个        的体系，在每个年度的农业生产进程中，精心安排在各个时节。\n依次填入画横线部分最恰当的一项是：","options":{"A":"一脉相承 科学","B":"如出一辙 固定","C":"别无二致 完整","D":"不谋而合 复杂"},"answer":"C","explanation":"第一空，形容古人对土地的保养方法与当代耕作措施的关系。B项“如出一辙”比喻两件事情非常相似，C项“别无二致”指区分不出两者的差别，D项“不谋而合”指事先没有商量过，意见或行动却完全一致，均有相似之意，符合文段语境，保留。A项“一脉相承”比喻某种思想、行为或学说之间有继承关系，一般用法为“现在的情况”和“之前的情况”一脉相承，不能说“古人的做法”与“当代的措施”一脉相承，用法不当，排除。\n第二空，根据“何时、何地施肥，施何种肥”“精心安排在各个时节”可以看出，古人经过摸索，施肥的措施已经十分完善和周到。C项“完整”指具有或保持着应有的部分，没有损坏或残缺，符合文意，当选。B项“固定”指不变动或不移动的，文段并没有体现出“不变”，排除；D项“复杂”指（事物的种类、头绪等）多而杂，文段没有体现出“复杂”，且感情色彩较为消极，排除。\n故正确答案为C。\n【文段出处】《古代农业中的人地关系》","no":27,"missingImage":false},{"type":"question","qid":"5445828","cat":"逻辑填空","stem":"要加强国际传播的理论研究，掌握国际传播的规律，构建对外话语体系，提高传播艺术。要采用        不同区域、不同国家、不同群体受众的精准传播方式，推进中国故事和中国声音的全球化表达、区域化表达、分众化表达，增强国际传播的          和实效性。\n依次填入画横线部分最恰当的一项是：","options":{"A":"满足 影响力","B":"贴近 亲和力","C":"融合 感染力","D":"细分 说服力"},"answer":"B","explanation":"第一空，根据文意可知，要针对不同区域、不同国家、不同群体受众采用精准的传播方式。B项“贴近”指靠近，D项“细分”指详细区分，置于文段均符合文意，保留。A项“满足”指使满足，填入此处应为“满足不同区域、不同国家、不同群体需求的精准传播方式”，故用法错误，排除；C项“融合”指几种不同的事物合为一体，置于文段意为采用一种传播方式，与后文“精准传播方式”矛盾，与文意不符，排除。\n第二空，根据文意可知，横线处所填词语应体现出“精准传播方式”对“国际传播”的意义。B项“亲和力”比喻使人亲近、愿意接触的力量，D项“说服力”指说话者运用各种可能的技巧去说服受众的能力，采用精准的方式进行“国际传播”可使传播内容更易被接受，而非说服别人，且B项“亲和力”与“贴近”能形成前后呼应，故B项更契合文意，当选，排除D项。\n故正确答案为B。\n【文段出处】《习近平在中共中央政治局第三十次集体学习时强调 加强和改进国际传播工作 展示真实立体全面的中国》","no":28,"missingImage":false},{"type":"question","qid":"5445767","cat":"逻辑填空","stem":"对于新业态新模式冲击本地的传统产业，是包容审慎，还是            ？对于非本地人才就业创业、非本地企业项目立项推广，能否            ，甚至千方百计降门槛、清路障以留人留项目？纵观先进制造业集群所在地，无一不是当地政府部门怀着“开放之心”，营造出良好的创新生态。\n依次填入画横线部分最恰当的一项是：","options":{"A":"如芒在背 一视同仁","B":"退避三舍 不偏不倚","C":"拒之门外 开诚布公","D":"推三阻四 海纳百川"},"answer":"A","explanation":"第一空，根据“是······还是”可知，横线处与“包容审慎”构成反义并列，体现出与“包容”相对的态度，即不接受新业态、新模式。A项“如芒在背”意为像芒刺扎在背上一样，形容坐立不安，C项“拒之门外”意为把人挡在门外，形容拒绝协商或共事，D项“推三阻四”意为以各种借口推托，三者均符合文意，保留。B项“退避三舍”泛指对人让步，不与相争，与文意不符，排除。\n第二空，依据“甚至千方百计降门槛、清路障以留人留项目”可知，横线处所填内容与后文相似，但是程度比后文轻，且横线处修饰“当地部门”与“非本地人才、非本地企业项目”关系。A项“一视同仁”意为同样看待，不分亲疏厚薄，能够表达当地部门对待本地创业的人和项目与非本地创业的人和项目同等看待、公平公正的态度，“同等看待”到“对非本地人才、非本地企业项目有政策倾斜”，能够形成很好的语义加重，当选。C项“开诚布公”意为诚意待人，坦白无私，强调真诚、坦诚、坦白，和后文的“政策倾斜”无法构成递进关系，排除。D项“海纳百川”比喻接纳和包容的东西非常广泛，而且数量很大，用于此处程度过重，且与后文的递进关系不及A项准确，排除。\n故正确答案为A。\n【文段出处】《开放是创新的最佳滋养（观象台）》","no":29,"missingImage":false},{"type":"question","qid":"5445772","cat":"逻辑填空","stem":"法律惩罚的正当性一定程度上源于公众朴素的道德期待。在具体执法时，不能仅仅        地依赖客观后果，进行简单归责和惩戒，而应全面考察当事人的主观认知、动机目的等情节，并综合        其社会危害性，由此来审慎决定是否启动惩罚机制。\n依次填入画横线部分最恰当的一项是：","options":{"A":"机械 评估","B":"单纯 辨别","C":"盲目 分析","D":"草率 判断"},"answer":"A","explanation":"第一空，形容对客观后果的依赖，根据“不能······而应······”可知，横线处与“全面考察”语意相反，应体现出对客观后果的绝对依赖，而不考虑其他方面之意，A项“机械”意为方式拘泥死板，B项“单纯”意为简单、不复杂、单一，填入此处均能体现对客观后果的绝对依赖，保留。C项“盲目”意为认识不清，D项“草率”意为不认真、敷衍了事，均与文意不符，排除。\n第二空，搭配“社会危害性”，A项“评估”意为评价估量，填入此处，“评估社会危害性”为常见搭配，当选。B项“辨别”意为对不同的事物在认识上加以区别，通常搭配“真伪”“好坏”等，与“社会危害性”搭配不当，排除。\n故正确答案为A。\n【文段出处】《“以罚代征”案中的法律认识错误》","no":30,"missingImage":false},{"type":"question","qid":"5445830","cat":"逻辑填空","stem":"在过去百年中，地球升温约1摄氏度，考虑到人类在大气中排放的温室气体的积累，这种变暖实际上与基础物理学的预期是        的。那么，问题其实并不在于是否在变暖，而在于变暖速度有多快，但科学家在利用现有模型预测未来变暖时仍然存在        ，尤其是，类似极端降水这样的关键变量将如何变化，仍有很大的不确定性。\n依次填入画横线部分最恰当的一项是：","options":{"A":"一致 分歧","B":"同步 短板","C":"吻合 瑕疵","D":"相符 漏洞"},"answer":"A","explanation":"本题可从第二空入手，根据“尤其是，类似极端降水这样的关键变量将如何变化，仍有很大的不确定性”可知，科学家在预测未来变暖时，对一些关键变量如何变化仍有不确定性，故横线处应体现科学家对于预测未来变暖的看法不一致，A项“分歧”指不一致、有差异，符合文意，保留。B项“短板”指人的短处、不擅长的地方，C项“瑕疵”指微小的缺点，D项“漏洞”指容易让东西透过或滴下的不该有的孔隙或裂缝，也指因说话、做事等不周密而留下的破绽，均体现不出不一致之意，与文意不符，排除。\n第一空，代入验证。A项“一致”意思是没有分歧，代入文段可体现出地球升温约1摄氏度与基础物理学的预期是一样的，符合文意，当选。\n故正确答案为A。\n【文段出处】原理公众号《10年、100年，甚至更久之后，地球会怎样？》","no":31,"missingImage":false},{"type":"question","qid":"5445776","cat":"逻辑填空","stem":"长期以来，城管执法部门对职责内的执法事项通常是        “用力”，对所有的执法对象“一碗水端平”，以体现执法的公平性、公正性。但对于超大城市而言，由于城管执法事项繁多，涉及市场主体庞杂，而城管执法力量是有限的，实践中很难做到            ，进而可能会影响执法效果和执行力。\n依次填入画横线部分最恰当的一项是：","options":{"A":"精准 滴水不漏","B":"均衡 百无一失","C":"精确 精益求精","D":"平均 面面俱全"},"answer":"D","explanation":"第一空，根据后文“对所有的执法对象‘一碗水端平’，以体现执法的公平性、公正性”可知，横线处要体现出城管执法部门对职责内的执法事项不偏不倚，B项“均衡”指平衡，D项“平均”指没有轻重或多少的分别，均符合文意，保留。A项“精准”指非常准确，精确，C项“精确”指非常准确，文段并非要表达执法的准确性，均与文意不符，排除。\n第二空，根据“由于城管执法事项繁多，涉及市场主体庞杂，而城管执法力量是有限的”，且横线前有“很难做到”的表述可知，横线处要体现执法全面没有遗漏之意，D项“面面俱全”指各方面都能照顾到，没有遗漏疏忽，符合文意，当选。B项“百无一失”形容极有把握，不会出差错，文段并未体现把握大，不出差错之意，与文意不符，排除。\n故正确答案为D。\n【文段出处】中工网-工人日报《期待分类分级执法推动城市治理效能提升》","no":32,"missingImage":false},{"type":"question","qid":"5445832","cat":"逻辑填空","stem":"设立国家公园有助于权责统一，改变过去“九龙治水”的情况，大幅度        国土资源的管理效能。尤其是国家公园内有相当多的偏远、人居密度较低的区域，被划入国家公园后也可明确产权归属，将其机制化地管理起来，避免出现生态环境恶化却            的情况。\n依次填入画横线部分最恰当的一项是：","options":{"A":"增强 听之任之","B":"发挥 鞭长莫及","C":"改善 爱莫能助","D":"提升 无人问津"},"answer":"D","explanation":"第一空，搭配“管理效能”，且根据“有助于权责统一，改变过去‘九龙治水’的情况”可知，横线处应体现出能够让国土资源的管理效能有所改变之意，A项“增强”指增进、加强，B项“发挥”指把内在的性质或能力表现出来，D项“提升”指提高，均与“管理效能”搭配恰当且符合文意，保留。C项“改善”指改变原有情况使好一些，常搭配“生活”“环境”等，与“管理效能”搭配不当，排除。\n第二空，“将其机制化地管理起来”中的“其”指代前文“偏远、人居密度较低的区域”，且横线前的“却”引导转折关系，根据前文“出现生态环境恶化”可知，当国家公园中偏远、人居密度较低的区域出现生态环境恶化的情况时，需要对这个情况进行管理，而不能出现没人管理的现象，故横线处搭配“区域”且应体现出没人管理之意，D项“无人问津”指没有人来探问、尝试或购买，与“区域”搭配恰当且符合文意，当选。A项“听之任之”指听任事情自然发展变化，不管不问，B项“鞭长莫及”指相隔太远，力量达不到，均与“区域”搭配不当，排除。\n故正确答案为D。\n【文段出处】光明网《第一批国家公园设立，意义重大》","no":33,"missingImage":false},{"type":"question","qid":"5445774","cat":"逻辑填空","stem":"在普通人看来，法律都是            的，自己一辈子都不会和法律打交道。但在瞬息万变的社会里，人们随时可能触及法律的红线。很多人平时法律观念和意识不强，柔性执法不仅可以起到        作用，而且有利于提高群众的学法懂法意识。\n依次填入画横线部分最恰当的一项是：","options":{"A":"高高在上 教育","B":"高深莫测 预防","C":"遥不可及 警戒","D":"事不关己 提醒"},"answer":"C","explanation":"第一空，横线后出现关联词“但”表示转折，前后语义相反。根据后文“自己一辈子都不会和法律打交道”、“人们随时可能触及法律的红线”可知，横线处所填成语应体现普通人认为与“法律”存在距离感，法律离生活很遥远。C项“遥不可及”指非常遥远而不可到达，D项“事不关己”指事情同自己没有关系，均符合文意，保留。A项“高高在上”形容领导者脱离群众，不深入实际，与“法律”搭配不当，排除；B项“高深莫测”指高深的程度无法揣测，形容使人难以理解，与“距离遥远”无关，与后文无法构成转折，排除。\n第二空，所填词语表示“柔性执法”的作用，C项“警戒”表示警示告诫，使人注意，D项“提醒”表示从旁指点，引起注意，“执法”对于可能触及法律红线的行为不是通过语言提醒，而是起到警示的作用，“警戒”填入文段更加恰当，排除D项。\n故正确答案为C。\n【文段出处】《柔性执法兼容法理与人情》","no":34,"missingImage":false},{"type":"question","qid":"5445833","cat":"逻辑填空","stem":"注册制改革越包容，市场主体越要        。随着注册制全面推进，新股上市数量势必增多，上市公司“            ”的时代一去不返。将自身相关信息说完整、说清楚，既是上市公司的法定责任，也是逐浪资本市场的立身之本。因此，企业应提升          和竞争意识，高度负责、抱诚守真地“自我介绍”。\n依次填入画横线部分最恰当的一项是：","options":{"A":"自律  待价而沽  紧迫感","B":"自重  滥竽充数  使命感","C":"自觉  奇货可居  危机感","D":"自强  一枝独秀  责任感"},"answer":"C","explanation":"本题可从第二空入手。根据“新股上市数量势必增多”“······的时代一去不返”可知，横线处所填成语应与“数量势必增多”语义相反，体现随着新股上市数量不断增多，上市公司变得不再少有、稀缺，C项“奇货可居”指把少有的货物囤积起来，等待高价出售，也比喻拿某种专长或独占的东西作为资本，等待时机，以捞取名利地位，D项“一枝独秀”指其他花都没有开放，只有这一枝在开着，比喻技高一筹，优势明显，均符合文意，保留。A项“待价而沽”原比喻等待时机出来做官，后多比喻等待有好的待遇、条件才肯答应任职或做事，侧重强调等待，无法体现上市公司变得不再稀有之意，与文意不符，排除；B项“滥竽充数”比喻无本领的冒充有本领，次货冒充好货，与文意无关，排除。\n第一空，根据“将自身相关信息说完整、说清楚······也是逐浪资本市场的立身之本”“企业应······高度负责、抱诚守真地‘自我介绍’”可知，市场主体将相关信息说完整、说清楚是其能够安身立命的资本，横线处所填词语应体现注册制改革越包容，市场主体越要主动、负责、诚实地介绍相关信息，C项“自觉”指自己有所认识而主动去做，符合文意，保留。D项“自强”指自己努力图强，与文意无关，排除。\n第三空，代入验证。横线处所填词语与“竞争意识”构成并列关系，应体现企业要认识到竞争增加，保有忧患意识，C项“危机感”指认识到已经发生或者预见到将要发生的问题或困难，并感到紧迫担心的一种忧患意识，符合文意，当选。\n故正确答案为C。\n【文段出处】经济日报《金观平：给投资者一个真实的上市公司》","no":35,"missingImage":false},{"type":"question","qid":"5445708","cat":"逻辑填空","stem":"随着技术发展，以数字手段为支撑的“沉浸式”“交互式”网上博物馆日益增多，提高了展览的          。但随着智能终端的普及，人们难免会对数字博物馆产生        。博物馆在利用数字技术的基础上，也不能忽视实物展览内涵的提升，使之兼备文化和教育功能，突出            的特点。\n依次填入画横线部分最恰当的一项是：","options":{"A":"科技性  排斥  润物无声","B":"便捷性  厌倦  触手可及","C":"趣味性  疲劳  寓教于乐","D":"交融性  失望  与时俱进"},"answer":"C","explanation":"本题可从第三空入手，根据横线前“博物馆在利用数字技术的基础上······兼备文化和教育功能”可知，横线处应表达数字博物馆能够通过“沉浸式”“交互式”的方式使人们在娱乐中受到教育之意。C项“寓教于乐”指把教育跟娱乐融合为一体，使人在娱乐中受到教育，符合文意，保留。A项“润物无声””指有大胸怀者，做了贡献而不张扬，默默奉献，文段并未体现出“默默奉献”之意，与文意不符，排除；B项“触手可及”指一伸手便可接触到，形容距离很近，文段此处强调的是数字博物馆在“文化和教育”上的特点，并非强调“距离很近”，与文意不符，排除；D项“与时俱进”指随着时代的发展而不断发展、前进，与文意无关，排除。\n第一空，代入验证。C项“趣味性”强调能够使人感到愉快，引起兴趣的特性，与横线前“‘沉浸式’‘交互式’网上博物馆”对应恰当，符合文意，保留。\n第二空，代入验证。C项“疲劳”指因体力或脑力消耗过多而需要休息，置于此处强调智能终端普及之后，人们会对数字博物馆失去新鲜感之意，符合文意，当选。\n故正确答案为C。\n【文段出处】光明日报《发挥好博物馆的教育功能》","no":36,"missingImage":false},{"type":"question","qid":"5445727","cat":"逻辑填空","stem":"环境整治关键要不留死角、不存盲点，光靠人为监管恐怕会            。目前，“互联网＋”数字技术已成为环境监测的利器，为生态环境监测布下“天罗地网”。这张网使任何“            ”都能充分暴露在数据“阳光”之下，让环境监测和污染防治变得更加        、更加具象。\n依次填入画横线部分最恰当的一项是：","options":{"A":"捉襟见肘 一举一动 有效","B":"力不从心 风吹草动 精细","C":"顾此失彼 小打小闹 动态","D":"收效甚微 蛛丝马迹 直观"},"answer":"B","explanation":"第一空，根据“环境整治关键要不留死角、不存盲点”可知，横线处应体现出光靠人为监管恐怕不够之意，A项“捉襟见肘”指顾此失彼，应付不过来，B项“力不从心”指心里想做，可是能力或力量够不上，C项“顾此失彼”指顾了这个，顾不了那个，均符合文意，保留。D项“收效甚微”指付出的努力基本没什么效果，文段强调的是只靠人为监管可能会不够，而不是人为的监管基本没有效果，置于此处程度过重，排除。\n第二空，横线处应体现出“为生态环境监测布下‘天罗地网’”的结果，即这张网能够让任何小的变动暴露在数据下之意，A项“一举一动”指人的每一个动作，B项“风吹草动”比喻轻微的动荡或变故，均符合文意，保留。C项“小打小闹”指小规模、零零碎碎地做事，文段并无做事规模大小之意，排除。\n第三空，横线处对应前文“充分暴露在数据‘阳光’之下”，且与“具象”构成并列关系，应体现出环境监测和污染防治能够更加具体之意，B项“精细”指精密细致，符合文意，当选。A项“有效”指能实现预期目的，有效果，无法与“具象”构成并列关系，排除。\n故正确答案为B。\n【文段出处】《用好环境监测的“智慧大脑”》","no":37,"missingImage":false},{"type":"question","qid":"5445841","cat":"逻辑填空","stem":"培育强大的创新实力，中小企业要有“十年磨一剑”的        和志气。要克服融资难、原料贵、订单少等重重困难，持续投入，迎难而上，才能在            中迈上发展新台阶。当前，一家家优质中小企业在自主创新的道路上            ，勇毅前行，成长为能打硬仗的科技尖兵、稳链强链的有生力量。\n依次填入画横线部分最恰当的一项是：","options":{"A":"定力  厚积薄发  自强不息","B":"决心  卧薪尝胆  稳扎稳打","C":"耐性  筚路蓝缕  兢兢业业","D":"智慧  山重水复  步步为营"},"answer":"A","explanation":"第一空，通过“和”可知，横线处所填词语应与“志气”语义相近，又根据横线前“十年磨一剑”可知，横线处应体现出中小企业的坚定意志，A项“定力”借指处变和把握自己的意志力，B项“决心”指坚定不移的意志，C项“耐性”指能忍耐、不急躁的性格，均符合文意，保留。D项“智慧”指辨析判断、发明创造的能力，与文意不符，排除。\n第二空，根据横线前“要克服······重重困难，持续投入，迎难而上”可知，横线处所填成语应体现出中小企业只有持续克服困难才能成功迈上发展新台阶之意，A项“厚积薄发”形容积累丰富的学问而不轻易表现出来，也形容准备充分才能办好事情，B项“卧薪尝胆”比喻刻苦自励，发愤图强，均符合文意，保留。C项“筚路蓝缕”多形容创业的艰辛，文段与创业无关，与文意不符，排除。\n第三空，与“勇毅前行”语义相近，又根据前后文“持续投入，迎难而上”“成长为能打硬仗的科技尖兵”可知，横线处所填成语应体现出中小企业在自主创新的道路上不畏困难，积极拼搏之意，A项“自强不息”指努力上进，永不懈怠，符合文意，当选。B项“稳扎稳打”比喻有步骤、有把握地做事，无法体现不畏艰难困苦和积极拼搏之意，与文意不符，排除。\n故正确答案为A。\n【文段出处】人民网《让更多“小巨人”撑起“大创新”（人民时评）》","no":38,"missingImage":false},{"type":"question","qid":"5445701","cat":"逻辑填空","stem":"开展未成年人网络环境整治，势在必行且            。网络上可能存在的色情、暴力、过度娱乐等有害信息，会对普遍拥有智能设备、全面触网的未成年人产生潜移默化的不良影响。只有        清朗洁净的网络空间，才能让青少年健康成长。实现这一愿景，需要发挥多主体多领域联动优势，        合力，撑起清朗网络蓝天。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蓄势待发 创设 形成","B":"刻不容缓 营造 凝聚","C":"迫在眉睫 构筑 集成","D":"任重道远 共建 汇聚"},"answer":"B","explanation":"第一空，根据“势在必行”“网络上可能存在的色情······不良影响”可知，文段表达“开展未成年人网络环境整治”的必要性及紧迫性，故横线处应体现亟需采取行动之意，B项“刻不容缓”形容形势非常紧迫，片刻也不能拖延，C项“迫在眉睫”比喻事情已到眼前，急迫得就像逼近了眉毛和睫毛一样，二者均与文意相符，保留。A项“蓄势待发”指贮备随时可以展现的实力，待机而发，D项“任重道远”比喻肩负的责任重大，并需要长期的艰苦努力，二者均无法体现事情的紧迫性，排除。\n第二空，搭配“网络空间”，B项“营造”指有目的、有计划地造，C项“构筑”指构建，二者均搭配恰当，保留。\n第三空，搭配“合力”，根据前文“需要发挥多主体多领域联动优势”这一对策可知，横线处需体现将多方力量集中在一起共同发力的过程，B项“凝聚”指聚集，与文意相符且搭配恰当，当选。C项“集成”指总体，强调结果，与文意不符，排除。\n故正确答案为B。\n【文段出处】《多方发力，为未成年人撑起清朗网络蓝天》","no":39,"missingImage":false},{"type":"question","qid":"5445730","cat":"逻辑填空","stem":"竞争与创新总是            。平台反垄断最终要在抑制垄断与鼓励创新之间达到平衡。一方面，要加快健全市场准入制度、公平竞争审查机制，预防和        滥用行政权力限制竞争，充分        市场竞争机制的强大动能；另一方面，要引导和激励平台企业把更多精力用在创新上。唯有如此，平台经济方能为全社会注入持久的创新活力。\n依次填入画横线部分最恰当的一项是：","options":{"A":"如影随形  约束  调控","B":"互为表里  杜绝  挖掘","C":"相辅相成  打击  激发","D":"息息相关  制止  释放"},"answer":"D","explanation":"第一空，根据“平台反垄断最终要在抑制垄断与鼓励创新之间达到平衡”可知，竞争与创新二者关系是密切的，横线处所填成语应体现两者之间的关系非常密切，A项“如影随形”比喻两个事物关系密切或两个人关系密切不能分离，D项“息息相关”指彼此呼吸都相互关联，形容关系非常密切，均符合文意，保留。B项“互为表里”指甲为乙的外表，乙为甲的内里，比喻互相依存，互相接受，文段并非强调二者是互相依存的关系，与文意不符，排除；C项“相辅相成”指两件事物互相配合，互相补充，缺一不可，文段侧重强调的是竞争与创新之间有密切的关系，而非强调二者互相配合，互相补充，与文意不符，排除。\n第二空，根据“要加快健全市场准入制度、公平竞争审查机制”可知，横线处所填词语应体现要营造公平竞争的环境，使滥用行政权力限制竞争这类行为不再发生，D项“制止”指强迫使停止，不允许继续，符合文意，保留。A项“约束”指限制管束使不越出范围，置于此处程度过轻，文段强调的是“使之不再发生”，排除。\n第三空，代入验证，横线处所填词语搭配“动能”，根据文意可知，需体现发挥市场竞争机制的强大动能的含义，D项“释放”符合文意，且与“动能”为常见搭配，当选。\n故正确答案为D。\n【文段出处】广州日报《平台反垄断要用好“两手”》","no":40,"missingImage":false},{"type":"question","qid":"5445844","cat":"语句表达","stem":"构建人类命运共同体是世界各国人民前途所在。                    。只有各国行天下之大道，和睦相处、合作共赢，繁荣才能持久，安全才有保障。中国提出了全球发展倡议、全球安全倡议，愿同国际社会一道努力落实。中国坚持对话协商，推动建设一个持久和平的世界；坚持共建共享，推动建设一个普遍安全的世界；坚持合作共赢，推动建设一个共同繁荣的世界；坚持交流互鉴，推动建设一个开放包容的世界；坚持绿色低碳，推动建设一个清洁美丽的世界。\n填入画横线部分最恰当的一项是：","options":{"A":"河海不择细流，故能就其深","B":"大道之行也，天下为公","C":"万物并育而不相害，道并行而不相悖","D":"芳林新叶催陈叶，流水前波让后波"},"answer":"C","explanation":"本题为语句填空题，横线在中间，故需结合前后文进行分析。横线前强调构建人类命运共同体事关世界各国人民的前途，横线后先是通过“只有······才”强调各国应该团结合作，然后介绍了中国提出的全球发展和全球安全倡议，希望同国际社会一起落实，并在尾句通过五个分句具体介绍了中国提出的倡议，再次强调各国应通过开放包容、合作共享来落实倡议的观点。故横线处应表达世界各国团结合作，和平共处之意。C项“万物并育而不相害，道并行而不相悖”意思是万物一起生长而互不妨害，遵循各自的规律运行而互不冲突，常用来比喻要以开放包容的心态对待他人，和谐共处，符合文意，当选。\nA项，“河海不择细流，故能就其深”意思是江河湖海不拒绝细小溪流的汇入，所以能成就它的深广，意在表达只有不排斥、不拒绝细小的力量，才能够成就真正的伟大，与文意不符，排除；\nB项，“大道之行也，天下为公”意思是在大道施行的时候，天下是人们所共有的，与“团结合作，和平共处”之意不符，排除；\nD项，“芳林新叶催陈叶，流水前波让后波”比喻新事物代替旧事物，后人接替前人的自然规律，与文意无关，排除。\n故正确答案为C。\n【文段出处】新华网《高举中国特色社会主义伟大旗帜 为全面建设社会主义现代化国家而团结奋斗》","no":41,"missingImage":false},{"type":"question","qid":"5445735","cat":"片段阅读","stem":"当前，社会治理形势复杂，仅靠职能部门、专业力量远远不够，迫切需要人民群众和社会各界的积极支持与参与，共同创造公共价值。众包是公众和外包的组合词，意指发包方依托互联网或其衍生工具，在数字平台上设计规则与任务并向广泛、非确定的公众发包，公众根据自身能力自愿接包并完成特定事务。众包强调大众参与的开放式合作，促使组织边界向更广泛的大众群体开放，旨在挖掘隐藏在公众中的巨大潜力。因此，相较于政府购买等专业性较强的政府合同外包服务，政府众包展现出更开放的社会治理格局。\n最适合做这段文字标题的是：","options":{"A":"众包：共享经济下的新型用工模式","B":"政府众包：公众参与社会治理新方式","C":"公众参与：开放式合作的新形式","D":"“互联网+”：公共管理新范式"},"answer":"B","explanation":"文段开篇交代背景，指出社会治理形势存在的问题，并论述其需要人民群众和社会各界共同创造公共价值。接着引出“众包”的话题并给出定义，即公众可根据自身能力自愿接包并完成特定事务。接下来指出众包强调大众参与，旨在挖掘公众潜力。最后尾句通过“因此”总结前文，得出结论，并通过程度词“更”强调政府众包可以让社会治理格局更加开放。故文段重点围绕“政府众包”进行论述，强调其可解决当下社会治理存在的问题，对应B项。\nA项，“共享经济”为文段未提及内容，无中生有，且“众包”将文段核心话题“政府众包”范围扩大，排除；\nC项，缺少文段核心话题“政府众包”，排除；\nD项，“互联网+”为文段未提及内容，无中生有，且缺少文段核心话题“政府众包”，排除。\n故正确答案为B。\n【文段出处】中国社会科学网《政府众包：公众参与社会治理的新趋势》","no":42,"missingImage":false},{"type":"question","qid":"5445846","cat":"片段阅读","stem":"农业是个生态产业，农村是生态系统的重要一环。要健全草原森林河流湖泊休养生息制度，巩固退牧还草、退耕还林成果，开展大规模国土绿化行动，加强生物多样性保护。这方面要有个科学规划，荒山、沙漠、滩涂、森林、草原等治理要因地制宜、符合实际，不能都是一种套路。长江、黄河流域是生态文明建设的主战场，农业农村任务十分艰巨。长江流域要抓好十年禁渔，加强执法监督和市场监管，妥善解决好渔民转产转业和社会保障问题。黄河流域要抓好农业深度节水控水，因水施种，发展节水农业、旱作农业，把农业用水效率提上去、总量省出来。\n这段文字意在说明：","options":{"A":"农业与农村生态文明建设任重道远","B":"农业发展与生态治理需做好统筹","C":"农业生态建设要做好科学规划","D":"生态文明建设要找准着力点"},"answer":"C","explanation":"文段开篇指出农村是生态系统的重要一环，随后指出应该从哪几个方面入手做好农村生态建设，紧接着通过“这方面”指代前文并通过“要”给出对策，强调做好农业生态文明建设要有科学规划，后文通过论述长江、黄河流域的具体做法进行解释说明。故文段强调做好农业生态文明建设要有科学规划，核心话题为“科学规划”，对应C项。\nA项，偏离文段核心话题“科学规划”，且“任重道远”为问题表述，非重点，排除；\nB项，对应文段解释说明部分，非重点，且偏离文段核心话题“科学规划”，排除；\nD项，“找准着力点”表述不明确，文段强调要进行“科学规划”，不如C项明确，排除。\n故正确答案为C。\n【文段出处】人民网《坚持把解决好“三农”问题作为全党工作重中之重 举全党全社会之力推动乡村振兴》","no":43,"missingImage":false},{"type":"question","qid":"5445838","cat":"片段阅读","stem":"银河系是星系考古学研究的“重点实验室”，恒星则是银河系考古的天然“化石”：恒星表面的化学元素，完整记录着其诞生时银河系星际环境的化学组成；恒星运动的相似性，也为天文学家研究恒星起源问题提供了重要线索。因此，实现对银河系形成和演化全面认识的关键，在于获取银河系中数量足够多、分布足够广、足够有代表性的恒星的位置、运动、年龄及化学组成等信息。\n这段文字接下来最可能讨论的是：","options":{"A":"获取恒星信息的方法和途径","B":"星系考古学的前沿研究领域","C":"恒星对宇宙起源研究的意义","D":"关于银河系诞生原因的假说"},"answer":"A","explanation":"根据提问方式可知，本题为接语选择题，应在通读全文的基础上，重点关注文段最后论述的核心话题。文段开篇指出恒星对于银河系考古具有重要价值并具体展开介绍，尾句通过结论词“因此”得出结论，强调实现对银河系全面认识的关键，在于获取银河系中恒星的相关信息。故文段最后论述的核心内容为“获取恒星信息”，下文应围绕这一话题展开具体论述，即如何获取恒星的相关信息，对应A项。\nB项“星系考古学的前沿研究领域”、D项“关于银河系诞生原因的假说”均与文段最后论述的核心话题“获取恒星信息”不一致，排除；\nC项，“恒星对宇宙起源研究的意义”前文已经论述过，后文不会再论述，排除。\n故正确答案为A。\n【文段出处】《银河系史册：揭开银河系早期形成之谜 | 赛先生天文》","no":44,"missingImage":false},{"type":"question","qid":"5445693","cat":"片段阅读","stem":"火山灰是指火山爆炸性喷发形成的，直径小于2毫米的喷发碎屑。在爆炸性火山活动中，围岩和岩浆被炸碎成细小的颗粒，形成火山灰。火山灰从火山口喷发到大气中，经过大气搬运再沉降到各类环境中，整个过程通常只有数年，从地质时间尺度来看，几乎只是瞬间。所以在各种地质记录中，火山灰是一种高精度的绝对时间标志层。火山灰年代学正是利用地质记录中的火山灰层来确定地质年代的科学，该学科可以解决一些重要的科学问题，比如大型火山喷发事件与气候变化、人类演化之间的关系，以及气候快速变化的区域差异等。\n这段文字主要介绍了：","options":{"A":"火山灰的形成过程与主要特点","B":"火山灰年代学的研究思路和价值","C":"火山灰在自然环境中的分布状态","D":"火山喷发对环境和人类的影响"},"answer":"B","explanation":"文段开篇引出火山灰的话题，并指出其形成与爆炸性火山活动有关，紧接着又指出火山灰形成的过程非常的短暂，随后通过结论词“所以”进行总结，指出在各种地质记录中，火山灰是一种高精度的绝对时间标志层，接着通过程度词“正是”强调，火山灰年代学是利用地质记录中的火山灰层来确定地质年代的科学，并且其可以解决一些重要的科学问题，最后通过“比如”进行举例说明。故文段重点强调了火山灰年代学是一门利用火山灰层来确定地质年代的科学，并且还可以解决一些重要的科学问题，对应B项。\nA项，“火山灰的形成过程”对应文段开篇，属于分述句部分内容，非重点，排除；\nC项，偏离文段核心话题“火山灰年代学”，且“分布状态”文段并未提及，无中生有，排除；\nD项，偏离文段核心话题“火山灰年代学”，且“火山喷发对环境和人类的影响”文段并未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《我科学家用贝叶斯统计方法厘清了准确的火山喷发年龄》","no":45,"missingImage":false},{"type":"question","qid":"5445707","cat":"片段阅读","stem":"我国在改革开放后逐渐认识到保护民间文学艺术作品的重要性，并在1990年著作权法规定保护办法另行规定。但时隔三十余年，保护办法仍未出台。尽管如此，在著作权法颁布后，学界就民间文学艺术作品法律保护展开研究讨论，提出多种保护方案，涉及权利客体、权利主体、权利内容、保护期限、权利限制等方面的问题。当然，也有个别学者反对用著作权法保护民间文学艺术作品，主张通过公法加以保护。与此同时，国家版权局也加快推进相关立法，但因质疑声音过大而夭折。\n作者可能赞同下列哪一观点？","options":{"A":"通过公法保护民间文学艺术作品是最可行的路径","B":"围绕民间文学艺术作品法律保护的争议流于表面","C":"国家版权局应就民间文学保护倾听多方面意见","D":"民间文学艺术作品法律保护缺位状态亟须改变"},"answer":"D","explanation":"文段开篇指出我国认识到保护民间文学艺术作品的重要性，并在著作权法中规定对保护办法另行规定。随后通过“但”表转折，指出当前民间文学艺术作品的保护办法仍然没有出台。接着介绍著作权法颁布后，学界针对民间文学艺术作品法律保护曾提出多种保护方案，涉及多方面问题，并指出个别学者主张通过公法加以保护。最后通过“与此同时”表示并列，介绍国家版权局也加快推进相关立法，但因受到强烈质疑而夭折。整个文段都是围绕民间文学艺术作品法律保护缺失这一问题展开论述，意在强调当前亟须出台民间文学艺术作品的保护法，对应D项。\nA项，“通过公法保护民间文学艺术作品”仅为个别学者的观点，“最可行”表述过于绝对，排除；\nB项，文段指出学界就民间文学艺术作品法律保护展开的研究讨论涉及多方面问题，“流于表面”与文意相悖，排除；\nC项，仅对应“与此同时”之后的内容，表述片面，且文段指出国家版权局的立法工作因受到质疑而夭折，并非没有“倾听多方面意见”，排除。\n故正确答案为D。\n【文段出处】《中国特色民间文学艺术作品著作权保护理论的构建》","no":46,"missingImage":false},{"type":"question","qid":"5445840","cat":"片段阅读","stem":"生物质炭由生物质在缺氧条件下经过高温转化而成，是一种富含碳素的多孔固体颗粒物质，大量有机废弃物都可用作制备原料。这一“古老”的新生事物能将生物质中不稳定的有机碳转化固定，具有多重潜在价值。在农业领域，土壤中添加生物质炭可以改善持水能力和养分供应，增加微生物活性，利于作物增产；在工业领域，生物质炭可以用作电池电极或催化剂，比如用作石墨的替代品；在环境领域，生物质炭作为优良的吸附材料，可以去除环境中的污染物，还可以吸附游离碳和氮化合物，减少生物质在转化过程中温室气体的排放。\n下列哪一说法无法从原文中得到支持？","options":{"A":"工业中使用生物质炭作为原料由来已久","B":"自然界中生物质炭一般以固体形式存在","C":"生物质炭可以由有机废弃物产生","D":"利用生物质炭可以有效改良土壤"},"answer":"A","explanation":"A项，根据“这一‘古老’的新生事物”及“在工业领域，生物质炭可以用作电池电极或催化剂，比如用作石墨的替代品”可知，文段仅论述生物质炭为“‘古老’的新生事物”，可用于工业领域，但并非代表生物质炭用于工业原料由来已久，无中生有，当选；\nB项，根据“生物质炭由生物质在缺氧条件下经过高温转化而成，是一种富含碳素的多孔固体颗粒物质”可知，“生物质炭一般以固体形式存在”可以从原文中得到支持，排除；\nC项，根据“大量有机废弃物都可用作制备原料”可知，“生物质炭可以由有机废弃物产生”可以从原文中得到支持，排除；\nD项，根据“在农业领域，土壤中添加生物质炭可以改善持水能力和养分供应，增加微生物活性，利于作物增产”可知，“生物质炭可以有效改良土壤”可以从原文中得到支持，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《生物质炭——转化固废“碳足迹”》","no":47,"missingImage":false},{"type":"question","qid":"5445867","cat":"片段阅读","stem":"步兵融入联合作战，是指在联合作战体系架构下，以指挥信息系统为平台，根据作战需求，及时对接指挥关系，合理区分作战行动和保障路径，以实现步兵作战与联合作战的无缝对接。在联合作战中，可以采取火力打、远程击、空中炸、地面围等手段，歼灭敌方有生力量。步兵持有轻武器，善于近战歼敌，且机动灵活，适应性强，是直达战场、一线冲锋的优选力量。因此，近战歼灭敌方是步兵在联合作战体系内的首要任务。这意味着步兵将在其他军兵种力量的支援配合下，发挥夜战、近战和灵活机动的特长，实现歼灭据守之敌、驱逐进犯之敌、围捕空降之敌等目标。\n这段文字主要分析联合作战中：","options":{"A":"步兵的独特优势","B":"步兵的主要任务","C":"歼灭敌方的重要手段","D":"步兵武器装备的特点"},"answer":"B","explanation":"文段开篇介绍步兵融入联合作战的定义，接着指出在联合作战中歼灭敌方有生力量的手段，后文介绍了步兵作战的优势。随后通过“因此”总结前文得出结论，强调步兵在联合作战体系内的首要任务是近战歼灭敌方，尾句通过指代词“这”指代前文的首要任务，后文对步兵如何完成近战歼灭敌方的任务进行进一步阐述。故文段重点围绕步兵在联合作战中的首要任务进行论述，对应B项。\nA项，“独特优势”对应结论前的内容，非重点，排除；\nC项，“重要手段”表述不明确，且缺少文段主题词“步兵”，偏离文段核心话题，排除；\nD项，“武器装备”对应结论前的内容，非重点，排除。\n故正确答案为B。\n【文段出处】《把准步兵融入联合作战的任务定位》","no":48,"missingImage":false},{"type":"question","qid":"5445703","cat":"片段阅读","stem":"肺鱼是一类可用“肺”呼吸的肉鳍鱼，它们的“肺”是特化的鱼鳔，能吸收空气。这一特殊技能使其可以摆脱水的束缚，在河水干涸时潜入洞穴，躲在分泌物形成的茧中，等待雨季到来。此外，肺鱼还是能“啃硬骨头”的鱼，它们咬合力强大，一些带壳的无脊椎动物也是其捕食对象，这种能吃带壳动物的能力，被称为食壳性或甲食性。泥盆纪早期的奇异鱼被认为是最原始的肺鱼，已经具有典型的肺鱼食壳性特征，比如有发达的齿板与短而粗壮的下颌。而杨氏鱼的系统发育位置较奇异鱼更为原始，是研究肺鱼类食壳性起源的关键。\n这段文字接下来最可能介绍：","options":{"A":"关于杨氏鱼的最新研究成果","B":"动物食壳性特征的产生原因","C":"肺鱼在生物演化史上的重要意义","D":"杨氏鱼与其他泥盆纪物种的区别"},"answer":"A","explanation":"根据提问方式可知，本题为接语选择题。文段开篇介绍肺鱼是可用“肺”呼吸的肉鳍鱼，接着介绍肺鱼这一特殊技能在河水干涸时的作用，后文介绍肺鱼的咬合力强大，具有吃带壳动物的能力，并介绍此种能力被称为食壳性或甲食性，接着指出奇异鱼被认为是最原始的肺鱼，其已经具有食壳性特征，尾句强调杨氏鱼较奇异鱼更为原始，是研究肺鱼类食壳性起源的关键。故后文应继续围绕“杨氏鱼”这一话题展开论述，介绍“杨氏鱼”的相关研究，对应A项。\nB项，“动物食壳性特征”范围扩大，与文段最后讨论的核心话题不一致，无法与文段衔接，排除；\nC项，“生物演化史”与文段最后讨论的核心话题不一致，无法与文段衔接，排除；\nD项，“其他泥盆纪物种”属于无中生有的内容，无法与文段衔接，排除。\n故正确答案为A。\n【文段出处】《这种用“肺”呼吸的鱼，吃肉不吐壳》","no":49,"missingImage":false},{"type":"question","qid":"5445824","cat":"片段阅读","stem":"《新青年》创刊时名为《青年杂志》，因与《上海青年》杂志的名称部分雷同，从第二卷第一号开始，正式改名为《新青年》。这次更名本是被迫与无奈之举，但在陈独秀的巧妙处理下，却成为促进刊物发展的绝佳机遇。在更名后第一期杂志的篇首，刊登了陈独秀的文章，重新定义了“新青年”这一概念，提出要以“生理心理”的标准，而非“年龄”来区分新旧青年。这一期杂志还刊登了一则通告，告知读者杂志更名事宜。变被动为主动，赋予“新青年”三个字鲜明的时代意义与先锋的思想价值，也让《新青年》有了更加精准的办刊定位。\n这段文字中的“巧妙处理”指的是：","options":{"A":"精准定位受众，激发情感共鸣","B":"采取差异策略，力求独树一帜","C":"明晰用户心理，精准投放内容","D":"借助事件传播，创造全新概念"},"answer":"D","explanation":"首先定位“巧妙处理”位于文段的中间，结合上下文语境，上文介绍《新青年》因名称与其他杂志部分雷同而被迫更名，本是无奈之举，随后，通过关联词“但”转折，指出陈独秀“巧妙处理”，随后后文对“巧妙处理”进行详细的解释说明，即在更名后的第一期杂志中刊登了陈独秀的文章，文章重新定义了“新青年”这一概念，同时，这期杂志还刊登了一则通告，告知读者杂志更名事宜，赋予“新青年”新的意义与价值。故“巧妙处理”指借助杂志更名事件传播全新的“新青年”概念，对应D项。\nA项，文段并未提及“精准定位受众”和“情感共鸣”，无中生有，排除；\nB项，文段并未论述《新青年》与其他刊物的策略区别，无中生有，排除；\nC项，文段并未提及“明晰用户心理”和“精准投放”，无中生有，排除。\n故正确答案为D。\n【文段出处】《&lt;新青年&gt;杂志的传播策略》","no":50,"missingImage":false},{"type":"question","qid":"5445697","cat":"语句表达","stem":"①这会使病情恶化，并最终导致相关的关节功能障碍\n②大量临床及基础研究显示，软骨病理性钙化是导致骨关节病软骨退变的关键致病机制之一\n③软骨病理性钙化通过诱导软骨细胞表型改变，最终呈现出一种病理状态\n④关节软骨渐进性退变是骨关节病最主要的病理改变\n⑤这些病态的软骨细胞通过有丝分裂增加自身数量，并通过分泌炎症因子、降解软骨基质引发组织炎症，最终发生凋亡\n⑥凋亡小体在吸收钙离子后，又会成为新的病理性矿化结晶，循环往复，致使软骨退变加重、剥脱\n将以上6个句子重新排列，语序正确的是：","options":{"A":"④②③⑤⑥①","B":"④③⑤①②⑥","C":"②③⑤⑥④①","D":"②⑤④③①⑥"},"answer":"A","explanation":"对比选项，确定首句。②句指出骨关节病软骨退变的致病机制，④句通过“最主要”引出关节软骨渐进性退变这一话题，按照逻辑顺序，应先引出话题，再具体论述其致病机制，故④句更适合作为首句，排除C、D两项。\n继续对比选项，A、B两项的区别在于④句之后接②句还是③句，②句是对④句的具体论述，符合逻辑。③句围绕话题“软骨病理性钙化”展开论述，与④句话题不一致，无法衔接，排除B项。\n故正确答案为A。\n【文段出处】科技日报《导致关节软骨病理性钙化的元凶找到了》","no":51,"missingImage":false},{"type":"question","qid":"5445825","cat":"语句表达","stem":"①例如位于我国四川的深地核天体物理实验室，其上覆盖的垂直岩石厚达2400米\n②因此，旨在直接探测暗物质的实验室通常会建于极深的地下或山里，尽最大可能屏蔽掉这些干扰\n③直接探测暗物质的方式类似于守株待兔\n④当然，这种能量波动极其微弱，而且宇宙中的各种射线同样也有机会与这个原子核来一场亲密的邂逅，从而对实验结果产生干扰\n⑤专家解释说，我们生活在一团暗物质云中，每秒钟可能有几百万甚至上千万的暗物质粒子穿过我们的身体\n⑥直接探测暗物质的方法之一，就是利用精密的仪器密切观察大量的原子核，如果足够幸运，某一时刻暗物质碰撞到某个原子核，会在原子核上留下残余能量\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑥②①⑤③④","B":"⑥④⑤②③①","C":"③⑤⑥④②①","D":"③⑥②⑤①④"},"answer":"C","explanation":"对比选项，确定首句，首句分别为③句和⑥句，③句引出“直接探测暗物质的方式”的话题，⑥句则具体解释了“直接探测暗物质的方法之一”，故⑥句是对③句的详细解释，根据观点+解释说明的逻辑顺序，③句更适合作首句，排除A、B两项。\n继续观察选项，①句出现“例如”为举例论述，之前应提出对应的观点。结合选项需判断①句之前是②句还是⑤句，②句提出直接探测暗物质的实验室通常会建于极深的地下或山里，与①句“四川的深地核天体物理实验室”衔接恰当，故②句应在①句之前，C项当选。⑤句提到暗物质粒子穿过我们的身体，与①句话题不一致，无法衔接，D项排除。\n故正确答案为C。\n【文段出处】《为何暗物质越来越少？能量低就会被宇宙“冰封”淘汰》","no":52,"missingImage":false},{"type":"question","qid":"5445694","cat":"语句表达","stem":"事实推定是指法官在确证基础事实之上，借助经验法则推定待证事实的一种司法认知方法，这实际上是法官价值判断的过程。受个人经验、情感、家庭背景等因素的影响，法官进行价值判断时可能具有个体特征。价值判断联通了基础事实与推定事实，对各类事实所作的价值判断不同，得出的判决结论也将不同。因此，                    。\n填入画横线部分最恰当的一项是：","options":{"A":"对事实推定价值判断的说理可提升判决的可接受性","B":"需要对事实推定中的价值判断进行规范","C":"程序正义有助于减少法官个体差异对判决的影响","D":"价值判断不仅要符合形式合理性也要及时回应社会关切"},"answer":"B","explanation":"横线在文段结尾，由“因此”可知，横线处内容应总结前文。文段开篇引出“事实推定”这一话题，指出事实推定实际上是法官价值判断的过程，会受到多种因素的影响。接着指出法官进行价值判断时可能具有个体特征，对各类事实的价值判断不同，使得最终得出的判决结论也不同，故文段重在强调，法官在事实推定的过程中，对于价值判断的不同可能会影响判决结论这一问题，故尾句可针对这一问题提出对策，对应B项。\nA项，“对事实推定价值判断的说理”文段未提及，无法衔接上文，排除；\nC项，缺少核心话题“事实推定”，文段重在讨论事实的重要性，“程序正义”文段未提及，无中生有，排除；\nD项，缺少核心话题“事实推定”，且“要符合形式合理性也要及时回应社会关切”文段未提及，无法衔接上文，排除。\n故正确答案为B。\n【文段出处】《规范裁判文书对事实推定的价值判断说理》","no":53,"missingImage":false},{"type":"question","qid":"5445702","cat":"片段阅读","stem":"要推动老旧小区的适老化改造和无障碍环境建设，关键是提升整个社会对适老化改造的思想认识，实现适老化改造特别是居家适老化改造“心理无障碍”。要多渠道、全方位宣传引导居家适老化改造的政策与价值，转变老人、子女和社会对居家适老化改造的认知；同时，要通过养老服务中心、居家养老服务中心等载体，打造居家适老化改造样板房，强化直观感受，转变老人的传统观念，让老人逐步形成“为养老服务买单”、让子女形成更加关注父母居家养老环境的社会意识，提升适老化改造的家庭主观能动性。\n这段文字强调要：","options":{"A":"平衡主体利益，因地制宜推动适老化改造","B":"统筹各方资源，激活适老化改造的多元力量","C":"补位标准规范，提升适老化改造的品质与效率","D":"加强宣传引导，做到适老化改造“心理无障碍”"},"answer":"D","explanation":"文段开篇通过“要······关键是”提出对策，强调提升整个社会对适老化改造的思想认识，对实现适老化改造特别是居家适老化改造“心理无障碍”的重要性，接着围绕这一对策论述其具体措施，首先要通过多渠道、全方位宣传引导转变老人、子女和社会对居家适老化改造的认知，然后通过并列关联词“同时”引出另一方面提升适老化改造思想认识的具体措施，即通过多种载体打造居家适老化改造样板房，转变老人的传统观念，提升适老化改造的家庭主观能动性，故整个文段重在强调通过宣传和引导的方式实现适老化改造“心理无障碍”，对应D项。\nA项，“因地制宜推动适老化改造”文段并未提及，无中生有，排除；\nB项，文段强调要实现适老化改造“心理无障碍”，选项“激活适老化改造的多元力量”偏离文段讨论的核心重点，排除；\nC项，“补位标准规范”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】《改造只是起步 更多适老化堵点有待打通》","no":54,"missingImage":false},{"type":"question","qid":"5445721","cat":"片段阅读","stem":"科学家早就知道月球有两面：面向地球的一面较为平坦，背向地球的一面凹凸不平，遍布撞击坑，月球为何具有截然不同的两副面孔，是其众多谜团之一。近日，科学家提出一种全新解释：数十亿年前，形成月球背面盆地的巨大撞击，产生了足以传遍月球的巨大热量，促成月幔物质的熔化，其中的稀土和放射性生热元素钍以及钾、磷等被携带到与撞击区域对称的月面，形成克里普岩，分布在月球正面风暴洋及其周围，放射性生热元素的集中，产生了月球表面的熔岩流，最终形成月球正面的火山平原。\n最适合做这段文字标题的是：","options":{"A":"盆地与平原：两副面孔，两种材质","B":"月球上的熔岩流：亟待开发的宝藏","C":"双面月球：一次撞击，两种结局","D":"放射性生热元素：月球的化妆师"},"answer":"C","explanation":"文段开头提出问题，即月球为何有两副面孔，接下来给出解释说明，详细分析了撞击过后月球背面盆地与正面火山平原是如何形成的。故文段通过后文对撞击的分析解释月球正反两面截然不同的原因，对应C项。\nA项，未提及“月球”，且根据文意可知，月球正反面并非“两种材质”，排除；\nB项，熔岩流属于后文解释部分的内容，且文段未论述其价值，无中生有，排除；\nD项，“放射性生热元素”属于后文解释部分的内容，且文段主要回答“月球为何有两幅面孔”这一问题，非重点，排除。\n故正确答案为C。\n【文段出处】《双面月球：一次巨大撞击的两种结局》","no":55,"missingImage":false},{"type":"question","qid":"5445826","cat":"片段阅读","stem":"在生命科学领域，观测和解析蛋白质结构一直是令科学家着迷的话题，但也面临着难度大、成本高、进展有限的局面。传统观测蛋白质结构的方法主要有三种：核磁共振、X射线、冷冻电镜。这些方法依赖大量试错和昂贵设备，每种结构的研究长达数年。现有的实验手段还不足以揭示一些重要的蛋白质结构，需借助更多计算生物学手段。用计算机来计算蛋白质结构，运算量惊人，连超级计算机也难以承受。为此，蛋白质结构预测成为结构生物学的重要分支。未来将通过人工智能算法，根据氨基酸序列预测其空间结构。\n这段文字没有解释：","options":{"A":"传统蛋白质结构观测方法存在哪些弊端","B":"人工智能算法预测蛋白质结构有何优势","C":"现有技术为何无法满足对蛋白质结构的探索","D":"蛋白质结构预测为何成为结构生物学的分支"},"answer":"B","explanation":"A项，根据“这些方法依赖大量试错和昂贵设备，每种结构的研究长达数年”可知，解释了“传统蛋白质结构观测方法存在哪些弊端”，排除；\nB项，文段并未解释“人工智能算法预测蛋白质结构有何优势”，当选；\nC项，根据“现有的实验手段还不足以揭示一些重要的蛋白质结构，需借助更多计算生物学手段。用计算机来计算蛋白质结构，运算量惊人，连超级计算机也难以承受”可知，解释了“现有技术为何无法满足对蛋白质结构的探索”，排除；\nD项，根据“现有的实验手段还不足以揭示一些重要的蛋白质结构，需借助更多计算生物学手段。用计算机来计算蛋白质结构，运算量惊人，连超级计算机也难以承受。为此，蛋白质结构预测成为结构生物学的重要分支”可知，解释了“蛋白质结构预测为何成为结构生物学的分支”，排除。\n本题为选非题，故正确答案为B。\n【文段出处】人民网《弥补传统观测方法不足 加速生命科学领域研究 人工智能预测蛋白质结构（新知）》","no":56,"missingImage":false},{"type":"question","qid":"5445724","cat":"片段阅读","stem":"生态修复请求分为生态修复的行为请求和费用请求，前者是为了防止生态环境权益损害的发生或扩大，请求责任人停止污染破坏行为；当被破坏的生态环境无法恢复时，请求责任人进行人工修复。如果责任人不具有修复能力或意愿，可请求责任人承担修复费用。因此，修复行为请求应作为首要诉求，在责任人不能或不愿进行修复时，才能提出修复费用请求。在司法实践中，很多公益诉讼人却往往将修复费用请求作为首要诉求，但由于诉求和判决的修复费用数额不易确定，责任主体短期内难以承担修复费用，生态修复工作很难有效开展。\n这段文字意在说明：","options":{"A":"应该制定生态修复费用的分级标准","B":"修复费用请求往往很难得到有效落实","C":"应根据责任人的能力确定生态修复诉求","D":"生态修复诉讼应当首先提出修复行为请求"},"answer":"D","explanation":"文段开篇指出生态修复请求分为“行为请求”与“费用请求”两种，然后围绕“行为请求”进行介绍，并说明“如果责任人不具有修复能力或意愿，可请求责任人承担修复费用”。接着通过结论标志词“因此”对前文进行总结，提出观点，即修复行为请求应排在修复费用请求之前，来作为生态修复的首要诉求。尾句通过阐述将修复费用请求作为首要诉求时很难有效开展工作这一现状，站在反面的角度论证前文
