<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">行测真题模拟考场<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",imgBase:"",papers:[{"slug":"2025-重庆","title":"2025年重庆市公务员录用考试《行测》题（网友回忆版）","year":"2025","group":"重庆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"13504475","cat":"新思想","stem":"习近平总书记强调，要坚持城乡融合发展，畅通城乡要素流动。关于城乡融合发展，下列说法正确的有几项？\n①城乡融合发展是中国式现代化的必然要求\n②推进以乡镇为重要载体的新型城镇化建设，发展各具特色的乡镇经济\n③发展新型农村集体经济，构建产权明晰、分配合理的运行机制\n④完善覆盖农村人口的常态化防止返贫致贫机制\n⑤允许农户合法拥有的住房通过出租、入股、合作等方式盘活利用","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议通过《中共中央关于进一步全面深化改革 推进中国式现代化的决定》（以下简称《决定》）。\n①正确，《决定》在“六、完善城乡融合发展体制机制”部分指出：“城乡融合发展是中国式现代化的必然要求。必须统筹新型工业化、新型城镇化和乡村全面振兴，全面提高城乡规划、建设、治理融合水平······”\n②错误，2024年11月4日至6日，习近平总书记在湖北考察时指出，推进以县城为重要载体的新型城镇化建设，发展各具特色的县域经济。故“乡镇经济”说法错误。\n③正确，《决定》在“六、完善城乡融合发展体制机制”部分指出：“（21）巩固和完善农村基本经营制度······发展新型农村集体经济，构建产权明晰、分配合理的运行机制，赋予农民更加充分的财产权益。”\n④正确，《决定》在“六、完善城乡融合发展体制机制”部分指出：“（22）完善强农惠农富农支持制度······完善覆盖农村人口的常态化防止返贫致贫机制，建立农村低收入人口和欠发达地区分层分类帮扶制度。”\n⑤正确，《决定》在“六、完善城乡融合发展体制机制”部分指出：“（23）深化土地制度改革······允许农户合法拥有的住房通过出租、入股、合作等方式盘活利用。”\n故正确的有①③④⑤，共4项。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"13504496","cat":"新思想","stem":"习近平总书记指出，纵观人类历史，教育兴则国家兴，教育强则国家强，世界强国无一不是教育强国，教育始终是强国兴起的关键因素。关于建设教育强国，下列表述正确的有几项？\n①要坚持不懈用新时代中国特色社会主义思想铸魂育人，着力加强社会主义核心价值观教育\n②必须以坚持党对教育事业的全面领导为根本保证\n③坚持把高速高效发展作为各级各类教育的生命线\n④建设教育强国，龙头是义务教育","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"B","explanation":"本题考查理论与政策。\n2023年5月29日，中共中央政治局就建设教育强国进行第五次集体学习，中共中央总书记习近平主持学习会议并发表讲话。\n①正确，习近平总书记指出，要坚持不懈用新时代中国特色社会主义思想铸魂育人，着力加强社会主义核心价值观教育，引导学生树立坚定的理想信念，永远听党话、跟党走，矢志奉献国家和人民。\n②正确，习近平总书记强调，我们要建设的教育强国，是中国特色社会主义教育强国，必须以坚持党对教育事业的全面领导为根本保证······\n③错误，习近平总书记强调，要坚持把高质量发展作为各级各类教育的生命线，加快建设高质量教育体系。建设教育强国，基点在基础教育······故“高速高效发展”说法错误。\n④错误，习近平总书记强调，建设教育强国，龙头是高等教育。要把加快建设中国特色、世界一流的大学和优势学科作为重中之重，大力加强基础学科、新兴学科、交叉学科建设······故“龙头是义务教育”说法错误。\n故表述正确的是①②，共2项。\n故正确答案为B。","no":2,"missingImage":false},{"type":"question","qid":"13504476","cat":"时事政治","stem":"习近平总书记指出，人心是最大的政治，统一战线是凝聚人心、汇聚力量的强大法宝，关于统一战线，下列表述正确的是：\n①统战工作的本质要求是大团结大联合，解决的就是人心和力量问题\n②统一战线是党领导的统一战线，其最鲜明的特征是坚持以人民为中心\n③发展壮大爱国爱港爱澳力量，增强港澳同胞的爱国精神，形成更广泛的国内外支持“一国两制”的统一战线\n④关键是要坚持求同存异，发扬“团结一批评一团结”的优良传统，在尊重多样性中寻求一致性","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"C","explanation":"本题考查理论与政策。\n①正确，在2022年7月29日至30日召开的中央统战工作会议上，习近平总书记指出，统一战线是党克敌制胜、执政兴国的重要法宝，是团结海内外全体中华儿女实现中华民族伟大复兴的重要法宝，必须长期坚持······统战工作的本质要求是大团结大联合，解决的就是人心和力量问题······\n②错误，在2022年7月29日至30日召开的中央统战工作会议上，习近平总书记指出，加强新时代统一战线工作，根本在于坚持党的领导。中国共产党领导是统一战线最鲜明的特征，坚持党的领导是统一战线最根本、最核心的问题。故“最鲜明的特征是坚持以人民为中心”说法错误。\n③正确，二十大报告在“十三、坚持和完善‘一国两制’，推进祖国统一”中指出：“‘一国两制’是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定的最佳制度安排，必须长期坚持······发展壮大爱国爱港爱澳力量，增强港澳同胞的爱国精神，形成更广泛的国内外支持‘一国两制’的统一战线······”\n④正确，《习近平总书记关于做好新时代党的统一战线工作的重要思想学习读本》中强调：“‘团结——批评——团结’是我们党处理党内矛盾和人民内部矛盾的基本原则和基本方式，也是党领导的统一战线的优良传统······习近平总书记指出：‘关键是要坚持求同存异，发扬‘团结——批评——团结’的优良传统，在尊重多样性中寻求一致性，找到最大公约数、画出最大同心圆。’”\n故正确的是①③④。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"13504477","cat":"新思想","stem":"习近平总书记指出，现代化产业体系是现代化国家的物质技术基础，关于现代化产业体系建设，下列表述正确的有几项？\n①坚持把发展经济的着力点放在国有企业上\n②推动制造业高端化、智能化、绿色化发展\n③推动战略性新兴产业融合集群发展\n④推动现代服务业同先进制造业、现代农业深度融合\n⑤优化基础设施布局、结构、功能和系统集成，构建现代化基础设施体系","options":{"A":"5项","B":"4项","C":"3项","D":"2项"},"answer":"B","explanation":"本题考查理论与政策。\n②③④⑤正确，①错误，二十大报告在“四、加快构建新发展格局，着力推动高质量发展”中指出“（二）建设现代化产业体系。坚持把发展经济的着力点放在实体经济上，推进新型工业化，加快建设制造强国、质量强国、航天强国、交通强国、网络强国、数字中国。实施产业基础再造工程和重大技术装备攻关工程，支持专精特新企业发展，推动制造业高端化、智能化、绿色化发展······推动战略性新兴产业融合集群发展，构建新一代信息技术、人工智能、生物技术、新能源、新材料、高端装备、绿色环保等一批新的增长引擎。构建优质高效的服务业新体系，推动现代服务业同先进制造业、现代农业深度融合······优化基础设施布局、结构、功能和系统集成，构建现代化基础设施体系。”故“发展经济的着力点放在国有企业上”说法错误。\n故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"13504414","cat":"新思想","stem":"习近平总书记指出，人无信不立，企业和企业家更是如此。下列属于引导企业和企业家诚信合规经营举措的有几项？\n①加快城市一刻钟便民生活圈建设\n②鼓励第三方机构开展服务消费评价\n③依托“信用中国”网站上线“信誉信息”板块\n④加强对相关经营主体行政处罚等信用信息的归集、公示","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查理论与政策。\n①错误，“加快城市一刻钟便民生活圈建设”主要是为了提升居民生活便利性，完善城市商业设施布局，该举措与引导企业和企业家诚信合规经营无关。\n②③④正确，《国务院关于促进服务消费高质量发展的意见》中“六、优化服务消费环境”的“（十六）引导诚信合规经营”部分指出：“依托‘信用中国’网站和国家企业信用信息公示系统，上线‘信誉信息’板块，加强对相关经营主体登记备案、行政许可、行政处罚等信用信息的归集、公示，引导更多经营主体守信重信。加强服务质量监测评价，完善评价指标体系，定期发布监测评价结果，鼓励第三方机构开展服务消费评价。”\n故②③④表述正确，有3项。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"13504415","cat":"新思想","stem":"习近平总书记强调，要持之以恒推进党的自我革命，确保党永远不变质、不变色。关于党的自我革命，下列说法正确的有几项？\n①坚持制度治党、依规治党，以党章为根本，以民主集中制为核心，完善党内法规制度体系\n②推进党的自我革命，要强化党的自我监督，完善党内监督的各项制度机制，不断健全党内监督体系\n③勇于自我革命是我们党最鲜明的品格和最大优势\n④推进党的自我革命必须坚持结果导向","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查理论与政策。\n①正确，党的二十大报告中“十五、坚定不移全面从严治党，深入推进新时代党的建设新的伟大工程”部分指出：“（三）完善党的自我革命制度规范体系。坚持制度治党、依规治党，以党章为根本，以民主集中制为核心，完善党内法规制度体系，增强党内法规权威性和执行力，形成坚持真理、修正错误，发现问题、纠正偏差的机制。”\n②正确，《求是》杂志发表的习近平总书记署名文章《深入推进党的自我革命》中指出：“第九，以自我监督和人民监督相结合为强大动力。自我监督和人民监督是有机统一、相辅相成的。推进党的自我革命，要强化党的自我监督，完善党内监督的各项制度机制，不断健全党内监督体系。”\n③正确，《求是》杂志发表的习近平总书记署名文章《深入推进党的自我革命》中指出：“勇于自我革命是我们党最鲜明的品格和最大优势。党的性质宗旨、初心使命决定了我们党始终代表最广大人民根本利益。”\n④错误，《求是》杂志发表的习近平总书记署名文章《深入推进党的自我革命》中指出：“推进党的自我革命必须坚持问题导向，保持战略定力，标本兼治、综合施策、协同发力、锲而不舍、久久为功，积小胜为大胜，在不断解决大党独有难题中彰显大党优势。”故“坚持结果导向”的说法错误。\n故①②③说法正确，共3项。\n故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"13504478","cat":"新思想","stem":"习近平总书记指出，如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队，是全面建设社会主义现代化国家的战略要求。关于实现建军一百年奋斗目标，下列举措恰当的是：\n①加强军史学习教育，繁荣发展强军文化，强化战斗精神培育\n②加强军人军属荣誉激励和权益保障，做好退役军人服务保障工作\n③积极开展军事斗争，塑造安全态势，遏控危机冲突，阻止局部战争\n④研究掌握信息化智能化战争特点规律，创新军事战略指导，发展人民战争战略战术","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n①正确，党的二十大报告在“十二、实现建军一百年奋斗目标，开创国防和军队现代化新局面”部分指出：“全面加强人民军队党的建设，确保枪杆子永远听党指挥······加强军史学习教育，繁荣发展强军文化，强化战斗精神培育。”\n②正确，党的二十大报告在“十二、实现建军一百年奋斗目标，开创国防和军队现代化新局面”部分指出：“加强军人军属荣誉激励和权益保障，做好退役军人服务保障工作。”\n③错误，党的二十大报告在“十二、实现建军一百年奋斗目标，开创国防和军队现代化新局面”部分指出：“加强军事力量常态化多样化运用，坚定灵活开展军事斗争，塑造安全态势，遏控危机冲突，打赢局部战争。”故\"积极开展军事斗争\"“阻止局部战争”表述错误，应为“灵活开展军事斗争”“打赢局部战争”。\n④正确，党的二十大报告在“十二、实现建军一百年奋斗目标，开创国防和军队现代化新局面”部分指出：“研究掌握信息化智能化战争特点规律，创新军事战略指导，发展人民战争战略战术。”\n故①②④表述正确。\n故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"13504422","cat":"毛中特","stem":"毛泽东同志带领人民锻造了伟大光荣正确的中国共产党，他明确提出要把党的建设作为一项“伟大的工程”来推进，并且成功领导实施了这一伟大工程。下列有关说法正确的有几项?\n①着重强调要从思想上建党，创造了通过批评和自我批评进行思想教育的整风形式\n②概括形成了党的“三大作风”，成为中国共产党区别于其他任何政党的显著标志\n③创造性地运用民主集中制原则正确处理党内关系、维护党的团结统一\n④在马克思主义政党史上第一次科学地阐明了党的建设同党的政治路线的关系，揭示了党的建设的基本规律","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查毛泽东思想。\n2023年12月26日，习近平总书记在纪念毛泽东同志诞辰130周年座谈会上的讲话中指出，毛泽东同志在马克思主义政党史上第一次科学地阐明了党的建设同党的政治路线的关系，揭示了党的建设的基本规律，为加强党的建设指明了方向；着重强调要从思想上建党，创造了通过批评和自我批评进行思想教育的整风形式；创造性地运用民主集中制原则正确处理党内关系、维护党的团结统一；概括形成了党的“三大作风”，成为中国共产党区别于其他任何政党的显著标志；在探索跳出历史周期率的深刻思考中，给出了第一个答案，那就是“让人民来监督政府”，等等。\n故①②③④表述正确。\n故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"13504416","cat":"时事政治","stem":"党的二十届三中全会提出，高水平社会主义市场经济体制是中国式现代化的重要保障，关于构建高水平社会主义市场经济体制，下列举措不恰当的是：","options":{"A":"完善市场准入制度，优化新业态新领域市场准入环境","B":"推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通","C":"加强财政政策和货币政策协调配合，着力扩大内需，增强消费对优化供给结构的基础性作用","D":"建立国有企业履行战略使命评价制度，完善国有企业分类考核评价体系，开展国有经济增加值核算"},"answer":"C","explanation":"本题考查理论与政策。\nA项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“二、构建高水平社会主义市场经济体制”部分指出：“（7）完善市场经济基础制度······完善市场准入制度，优化新业态新领域市场准入环境······”\nB项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“二、构建高水平社会主义市场经济体制”部分指出：“（6）构建全国统一大市场。推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。加强公平竞争审查刚性约束，强化反垄断和反不正当竞争······”\nC项错误，二十大报告在“四、加快构建新发展格局，着力推动高质量发展”部分指出：“（一）构建高水平社会主义市场经济体制······健全宏观经济治理体系，发挥国家发展规划的战略导向作用，加强财政政策和货币政策协调配合，着力扩大内需，增强消费对经济发展的基础性作用和投资对优化供给结构的关键作用。”故“消费对优化供给结构的基础性作用”的表述错误。\nD项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“二、构建高水平社会主义市场经济体制”部分指出：“（5）坚持和落实‘两个毫不动摇’······建立国有企业履行战略使命评价制度，完善国有企业分类考核评价体系，开展国有经济增加值核算。推进能源、铁路、电信、水利、公用事业等行业自然垄断环节独立运营和竞争性环节市场化改革，健全监管体制机制。”\n本题为选非题，故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"13504418","cat":"新思想","stem":"统一开放的交通运输市场是有效衔接供需、促进国民经济循环畅通的重要基础，关于加快建设统一开放的交通运输市场，下列举措不恰当的是：","options":{"A":"建立交通运输装备能源清洁替代机制，保障规划实施全类运输工具应用新能源、清洁能源","B":"对交通运输领域招标投标、政府采购等相关规章制度按照有关规定进行公平竞争审查","C":"依托全国一体化大数据中心协同创新体系布局，构建综合交通大数据中心体系","D":"防止利用数据、算法、技术等手段排除限制竞争、侵害从业人员合法权益"},"answer":"A","explanation":"本题考查理论与政策。\n2024年12月12日，《中共中央办公厅 国务院办公厅关于加快建设统一开放的交通运输市场的意见》（以下简称《意见》）发布。\nA项错误，《意见》在“二、深化交通运输重点领域改革”部分指出：“（六）推动交通运输绿色智慧转型升级······完善交通运输装备能源清洁替代政策，推动中重型卡车、船舶等运输工具应用新能源、清洁能源······”故并非“全类运输工具应用新能源、清洁能源”。\nB项正确，《意见》在“三、完善交通运输市场制度”部分指出：“（十）完善交通领域价格机制······对交通运输领域招标投标、政府采购、经营行为规范、资质标准等相关规章制度按照有关规定进行公平竞争审查，维护公平竞争市场秩序。”\nC项正确，《意见》在“四、优化交通运输市场要素资源配置”部分指出：“（十六）推进数据和技术赋能交通运输发展。依托全国一体化大数据中心协同创新体系布局，构建综合交通大数据中心体系······”\nD项正确，《意见》在“五、完善交通运输市场监管机制”部分指出：“（十九）强化反垄断和反不正当竞争。加强交通运输领域市场竞争状况评估，依法查处垄断和不正当竞争行为，防止利用数据、算法、技术等手段排除限制竞争、侵害从业人员合法权益······”\n本题为选非题，故正确答案为A。","no":10,"missingImage":false},{"type":"question","qid":"13504479","cat":"时事政治","stem":"党的二十届三中全会提出，健全因地制宜发展新质生产力体制机制，推动技术革命性突破、生产要素创新性配置、产业深度转型升级，推动劳动者、劳动资料、劳动对象优化组合和更新跃升，催生新产业、新模式、新动能，发展以高技术、高效能、高质量为特征的生产力。关于发展新质生产力，下列举措恰当的是：\n①加强新领域新赛道制度供给，建立未来产业投入增长机制\n②强化投资监管，限制私募股权投资，更好发挥政府投资基金作用\n③放开环保、安全等制度约束，加快形成同新质生产力相适应的生产关系\n④以国家标准提升引领传统产业优化升级，支持企业用数智技术、绿色技术改造提升传统产业","options":{"A":"①②","B":"①④","C":"②③④","D":"①②③④"},"answer":"B","explanation":"本题考查理论与政策。\n党的二十届三中全会通过了《中共中央关于进一步全面深化改革 推进中国式现代化的决定》，以下简称《决定》。\n①④正确，《决定》中“三、健全推动经济高质量发展体制机制”部分的“（8）健全因地制宜发展新质生产力体制机制”中指出：“加强关键共性技术、前沿引领技术、现代工程技术、颠覆性技术创新，加强新领域新赛道制度供给，建立未来产业投入增长机制，完善推动新一代信息技术、人工智能、航空航天、新能源、新材料、高端装备、生物医药、量子科技等战略性产业发展政策和治理体系，引导新兴产业健康有序发展。以国家标准提升引领传统产业优化升级，支持企业用数智技术、绿色技术改造提升传统产业。强化环保、安全等制度约束。”\n②错误，《决定》中“三、健全推动经济高质量发展体制机制”部分的“（8）健全因地制宜发展新质生产力体制机制”中指出：“鼓励和规范发展天使投资、风险投资、私募股权投资，更好发挥政府投资基金作用，发展耐心资本。”故“限制私募股权投资”说法错误。\n③错误，《决定》中“三、健全推动经济高质量发展体制机制”部分的“（8）健全因地制宜发展新质生产力体制机制”中指出：“强化环保、安全等制度约束。健全相关规则和政策，加快形成同新质生产力更相适应的生产关系，促进各类先进生产要素向发展新质生产力集聚，大幅提升全要素生产率。”故“放开环保、安全等制度约束”说法错误。\n故①④表述正确。\n故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"13504480","cat":"新思想","stem":"党的二十大强调，国家安全是民族复兴的根基，社会稳定是国家强盛的前提，必须坚定不移贯彻总体国家安全观，把维护国家安全贯穿党和国家工作各方面全过程，确保国家安全和社会稳定。下列表述不正确的是：","options":{"A":"坚持党中央对国家安全工作的集中统一领导，完善高效权威的国家安全领导体制","B":"坚持安全第一、应急为主，建立大安全大应急框架，完善公共安全体系","C":"加强海外安全保障能力建设，维护我国公民、法人在海外合法权益","D":"强化食品药品安全监管，健全生物安全监管预警防控体系"},"answer":"B","explanation":"本题考查理论与政策。\nA项正确，党的二十大报告中“十一、推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定”部分指出：“（一）健全国家安全体系。坚持党中央对国家安全工作的集中统一领导，完善高效权威的国家安全领导体制。”\nB项错误，党的二十大报告中“十一、推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定”部分指出：“（三）提高公共安全治理水平。坚持安全第一、预防为主，建立大安全大应急框架，完善公共安全体系，推动公共安全治理模式向事前预防转型。”因此“应急为主”表述错误。\nC项正确，党的二十大报告“十一、推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定”部分指出：“（二）增强维护国家安全能力。坚定维护国家政权安全、制度安全、意识形态安全，加强重点领域安全能力建设，确保粮食、能源资源、重要产业链供应链安全，加强海外安全保障能力建设，维护我国公民、法人在海外合法权益，维护海洋权益，坚定捍卫国家主权、安全、发展利益。”\nD项正确，党的二十大报告“十一、推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定”部分指出：“（三）提高公共安全治理水平······提高防灾减灾救灾和重大突发公共事件处置保障能力，加强国家区域应急力量建设。强化食品药品安全监管，健全生物安全监管预警防控体系。加强个人信息保护。”\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"13504486","cat":"时事政治","stem":"2024年6月，和平共处五项原则发表70周年纪念大会在北京举行，习近平总书记在会上指出，构建人类命运共同体理念与和平共处五项原则一脉相承，下列有关说法正确的是：\n①构建人类命运共同体理念顺应了平等和共生的时代潮流，开辟了和平和进步的新境界\n②和平共处五项原则的出发点就是维护弱小国家在强权政治环境中的利益和诉求\n③和平共处五项原则为不同社会制度国家建立和发展关系提供了正确指导\n④中国式现代化的本质要求之一就是推动构建人类命运共同体","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查理论与政策。\n①错误，习近平总书记在和平共处五项原则发表70周年纪念大会上的讲话中指出：“构建人类命运共同体理念······顺应和平、发展、合作、共赢的时代潮流，开辟了和平和进步的新境界。”故“平等和共生的时代潮流”说法错误。\n②正确，习近平总书记在和平共处五项原则发表70周年纪念大会上的讲话中指出：“第四，和平共处五项原则为国际秩序改革和完善贡献了历史智慧。五项原则的出发点就是维护弱小国家在强权政治环境中的利益和诉求，旗帜鲜明反帝、反殖、反霸，摒弃了穷兵黩武、以强凌弱的丛林法则，为推动国际秩序朝着更加公正合理方向发展奠定了重要思想基础。”\n③正确，习近平总书记在和平共处五项原则发表70周年纪念大会上的讲话中指出：“第二，和平共处五项原则为不同社会制度国家建立和发展关系提供了正确指导。”\n④正确，党的二十大报告提出：“中国式现代化的本质要求包括坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。”\n综上，②③④正确。\n故正确答案为D。","no":13,"missingImage":false},{"type":"question","qid":"13504465","cat":"新思想","stem":"建设中国特色社会主义法治体系，是全面推进依法治国的总抓手。下列举措不属于完善中国特色社会主义法治体系内容的是：","options":{"A":"健全人大对行政机关、监察机关、审判机关、检察机关监督制度","B":"健全国际商事仲裁和调解制度，培育国际一流仲裁机构、律师事务所","C":"完善行政处罚等领域行政裁量权基准制度，推动行政执法体系标准跨区域衔接","D":"加强和改进未成年人权益保护，强化未成年人犯罪预防和治理，制定专门矫治教育规定"},"answer":"A","explanation":"本题考查理论与政策。\nA项错误，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“八、健全全过程人民民主制度体系”部分指出：“（29）加强人民当家作主制度建设······健全人大对行政机关、监察机关、审判机关、检察机关监督制度，完善监督法及其实施机制，强化人大预算决算审查监督和国有资产管理、政府债务管理监督······”故本项为“健全全过程人民民主制度体系”而非“完善中国特色社会主义法治体系”的内容。\nB项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“九、完善中国特色社会主义法治体系”部分指出：“（37）加强涉外法治建设。建立一体推进涉外立法、执法、司法、守法和法律服务、法治人才培养的工作机制······健全国际商事仲裁和调解制度，培育国际一流仲裁机构、律师事务所。积极参与国际规则制定。”\nC项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“九、完善中国特色社会主义法治体系”部分指出：“（34）深入推进依法行政······深化行政执法体制改革，完善基层综合执法体制机制，健全行政执法监督体制机制。完善行政处罚等领域行政裁量权基准制度，推动行政执法标准跨区域衔接······”\nD项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“九、完善中国特色社会主义法治体系”部分指出：“（36）完善推进法治社会建设机制······改进法治宣传教育，完善以实践为导向的法学院校教育培养机制。加强和改进未成年人权益保护，强化未成年人犯罪预防和治理，制定专门矫治教育规定。”\n本题为选非题，故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"13504420","cat":"新思想","stem":"数字贸易是数字经济的重要组成部分，已成为国际贸易发展的新趋势和经济的新增长点，关于数字贸易改革创新发展，下列表述不正确的是：","options":{"A":"按照创新为要、安全为基，扩大开放、合作共赢，深化改革、系统治理，试点先行、重点突破的原则，促进数字贸易改革创新发展","B":"到2035年，可数字化交付的服务贸易规模占我国服务贸易总额的比重提高到50%以上","C":"发展云外包、平台分包等服务外包新业态新模式，推动服务外包加快数字化转型","D":"鼓励引入数据安全、数据资产、数字信用等第三方国际服务机构"},"answer":"D","explanation":"本题考查理论与政策。\n2024年11月28日，《中共中央办公厅 国务院办公厅关于数字贸易改革创新发展的意见》（以下简称《意见》）对外发布。\nA、B两项正确，《意见》在“一、总体要求”部分指出：“按照创新为要、安全为基，扩大开放、合作共赢，深化改革、系统治理，试点先行、重点突破的原则，促进数字贸易改革创新发展。主要目标是：到2029年，可数字化交付的服务贸易规模稳中有增，占我国服务贸易总额的比重提高到45%以上······到2035年，可数字化交付的服务贸易规模占我国服务贸易总额的比重提高到50%以上；有序、安全、高效的数字贸易治理体系全面建立，制度型开放水平全面提高。”\nC项正确，《意见》在“二、支持数字贸易细分领域和经营主体发展”中“（二）持续优化数字服务贸易”部分指出：“促进数字金融、在线教育、远程医疗、数字化交付的专业服务等数字服务贸易创新发展，提升品牌和标准影响力。发展云外包、平台分包等服务外包新业态新模式，推动服务外包加快数字化转型。”\nD项错误，《意见》在“四、完善数字贸易治理体系”中“（十一）加快构建数字信任体系”部分指出：“加快数字贸易认证体系建设，促进数字信任前沿技术的开发创新与应用推广，培育数字信任生态。推动数字证书、电子签名等国际互认。鼓励数据安全、数据资产、数字信用等第三方服务机构国际化发展。”\n本题为选非题，故正确答案为D。","no":15,"missingImage":false}],"count":15,"answerable":15,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"13504425","cat":"法律常识","stem":"下列关于法规的表述正确的是：","options":{"A":"国家监察委员会根据宪法、法律和行政法规，制定监察法规","B":"《中华人民共和国军事设施保护法》和《国际军事合作工作条例》都属于军事法规","C":"地方性法规是指各地方政府按照宪法、法律、行政法规的规定制定的规范性法律文件","D":"党内法规是体现党的统一意志，规范党的领导和党的建设活动、依靠党的纪律保证实施的专门规章制度"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国立法法》第一百一十八条规定：“国家监察委员会根据宪法和法律、全国人民代表大会常务委员会的有关决定，制定监察法规，报全国人民代表大会常务委员会备案。”因此，国家监察委员会制定监察法规的根据包含宪法和法律、全国人民代表大会常务委员会的有关决定，并不包括行政法规。\nB项错误，根据《中华人民共和国立法法》第十条第三款规定：“全国人民代表大会常务委员会制定和修改除应当由全国人民代表大会制定的法律以外的其他法律；在全国人民代表大会闭会期间，对全国人民代表大会制定的法律进行部分补充和修改，但是不得同该法律的基本原则相抵触。”第一百一十七条规定：“中央军事委员会根据宪法和法律，制定军事法规。”由此说明，《中华人民共和国军事设施保护法》属于法律，由全国人民代表大会常务委员会制定。《国际军事合作工作条例》属于军事法规，由中央军委制定。\nC项错误，根据《中华人民共和国立法法》第八十条规定：“省、自治区、直辖市的人民代表大会及其常务委员会根据本行政区域的具体情况和实际需要，在不同宪法、法律、行政法规相抵触的前提下，可以制定地方性法规。”第八十一条第一款规定：“设区的市的人民代表大会及其常务委员会根据本市的具体情况和实际需要，在不同宪法、法律、行政法规和本省、自治区的地方性法规相抵触的前提下，可以对城乡建设与管理、生态文明建设、历史文化保护、基层治理等方面的事项制定地方性法规······”因此，地方性法规是由特定的地方人大及其常委会制定，并非地方政府制定。\nD项正确，根据《中国共产党党内法规制定条例》第三条第一款规定：“党内法规是党的中央组织，中央纪律检查委员会以及党中央工作机关和省、自治区、直辖市党委制定的体现党的统一意志、规范党的领导和党的建设活动、依靠党的纪律保证实施的专门规章制度。”\n故正确答案为D。","no":16,"missingImage":false},{"type":"question","qid":"13504423","cat":"人文常识","stem":"“超级满月”是月球位于近地点时刚好出现满月，使月亮看起来又大又亮的现象。其发生需要满足的条件是：","options":{"A":"农历初一前后，地球运动到太阳与月球之间","B":"农历初一前后，月球运动到太阳与地球之间","C":"农历十五前后，地球运动到太阳与月球之间","D":"农历十五前后，月球运动到太阳与地球之间"},"answer":"C","explanation":"本题考查地理国情。\nC项正确，A、B、D三项错误，满月发生在农历十五前后，此时月球运行至地球背向太阳的一侧，即地球位于太阳和月球之间（三者近似直线），月球被太阳照亮的半球完全朝向地球，形成“满月”。若此时月球恰好位于近地点，则为“超级满月”。\n故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"13504489","cat":"人文常识","stem":"某商业银行拟为具有1年投资经历的客户李某提供理财服务，下列做法符合规定的是：","options":{"A":"向李某介绍理财产品的预期收益率","B":"允许李某提前赎回其所购买的封闭式理财产品","C":"向李某销售高于李某风险承受能力等级的理财产品","D":"其理财子公司在李某首次购买相关理财产品前通过电子渠道评估李某风险承受能力"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，根据《商业银行理财业务监督管理办法》第二十六条第三款规定：“商业银行发行理财产品，不得宣传理财产品预期收益率，在理财产品宣传销售文本中只能登载该理财产品或者本行同类理财产品的过往平均业绩和最好、最差业绩······”题中，该商业银行不能向李某介绍理财产品的预期收益率。\nB项错误，根据《商业银行理财业务监督管理办法》第十条第二款规定：“本办法所称封闭式理财产品是指有确定到期日，且自产品成立日至终止日期间，投资者不得进行认购或者赎回的理财产品。开放式理财产品是指自产品成立日至终止日期间，理财产品份额总额不固定，投资者可以按照协议约定，在开放日和相应场所进行认购或者赎回的理财产品。”题中，封闭式理财产品在投资期限内不允许提前赎回。\nC项错误，根据《商业银行理财业务监督管理办法》第二十九条第一款规定：“商业银行只能向投资者销售风险等级等于或低于其风险承受能力等级的理财产品，并在销售文件中明确提示产品适合销售的投资者范围，在销售系统中设置销售限制措施······”题中，该商业银行不能向李某销售高于其风险承受能力等级的理财产品。\nD项正确，根据《商业银行理财子公司管理办法》第二十七条第一款规定：“银行理财子公司销售理财产品的，应当在非机构投资者首次购买理财产品前通过本公司渠道（含营业场所和电子渠道）进行风险承受能力评估······”题中，其理财子公司在李某首次购买相关理财产品前通过电子渠道评估李某风险承受能力符合规定。\n故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"13504401","cat":"经济常识","stem":"中国外汇交易中心公布某日人民币兑美元中间价报7.1101，而一月前人民币兑美元中间价报6.8928，下列与之相关说法正确的是：","options":{"A":"人民币兑美元中间价属于人民币在岸价","B":"相较于一月前，人民币兑美元是相对升值","C":"中国证券监督管理委员会是负责全国外汇市场的监督管理机构","D":"人民币兑美元中间价为银行间外汇市场中人民币兑美元汇率的算术平均值"},"answer":"A","explanation":"本题考查经济常识。\nA项正确，D项错误，在岸人民币是指在中国大陆境内交易的人民币，其价格形成机制是基于中国外汇交易中心在每日银行间外汇市场开盘前，向各银行间外汇市场做市商询价，去掉最高和最低报价后，将剩余做市商报价加权平均得到人民币兑美元中间价，并非简单的算术平均值。这个中间价作为当日银行间即期外汇市场以及银行柜台交易汇率的中间价，对在岸人民币汇率的定价起到关键作用。所以，人民币兑美元中间价是在岸人民币价格体系中的重要参考指标，属于人民币在岸价的范畴。\nB项错误，一月前人民币兑美元中间价是6.8928，而某日是7.1101，说明同样数量的人民币能兑换的美元数量减少了，人民币相对美元是贬值的，而不是升值。\nC项错误，国家外汇管理局负责全国外汇市场的监督管理工作；承担结售汇业务监督管理的责任；培育和发展外汇市场，而不是中国证券监督管理委员会。\n故正确答案为A。","no":19,"missingImage":false},{"type":"question","qid":"13504399","cat":"科技常识","stem":"人们日常体检中的很多仪器，其原理都和射线有关，目前最常用的是伽马射线和伦琴射线，下列关于这两种射线的说法错误的是（    ）。","options":{"A":"这两种射线都属于电磁波","B":"伽马射线的辐射性较强，不能用于食品杀菌","C":"伦琴射线可用于CT（电子计算机断层扫描）检查中","D":"这两种射线的辐射伤害可以用不同厚度的铅板来阻挡"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，电磁波按照波长从长到短（频率从低到高）可分为无线电波、微波、红外线、可见光、紫外线、伦琴射线（X射线）、伽马射线等。\nB项错误，伽马射线是原子核受激发后产生的，波长极短，频率极高。利用伽马射线进行食品杀菌是一种常见的食品辐照保鲜技术。该技术利用放射性元素（如钴-60、铯-137）产生的伽马射线对食品进行照射，能够杀死食品中的细菌、霉菌、酵母菌等微生物，还可以抑制食品中害虫的生长和繁殖，从而达到延长食品保质期、防止食品腐败变质的目的。\nC项正确，伦琴射线是原子内层电子受激发后产生的，具有较高的频率和能量。CT检查主要是利用精确准直的X射线（即伦琴射线）束对人体进行断层扫描，X射线穿过人体时，由于人体不同组织对X射线的吸收和衰减程度不同，探测器会接收穿过人体后的X射线强度信息，这些信息被传输到计算机中，计算机利用专门的算法对数据进行处理和重建，从而生成人体被扫描部位的断层图像，医生可以根据这些图像来观察人体内部的结构和病变情况。\nD项正确，伽马射线和伦琴射线都具有较强的穿透能力，而铅板具有高密度、高原子序数的特点，能够有效地吸收和散射这些射线，从而起到防护作用。一般来说，射线能量越高，需要的铅板厚度就越大，以达到足够的防护效果，阻挡射线对人体或其他物体的伤害。所以，可以根据实际情况，使用不同厚度的铅板来阻挡伽马射线和伦琴射线的辐射伤害。\n本题为选非题，故正确答案为B。","no":20,"missingImage":false},{"type":"question","qid":"13504400","cat":"人文常识","stem":"以下关于我国航母的说法错误的是：","options":{"A":"目前我国列装的航母满载排水量均超过5万吨","B":"“福建舰”是我国自主建造的弹射型国产航母，采用平直通长飞行板","C":"我国首艘国产航母“辽宁舰”于2012年入列，目前已形成体系作战能力","D":"2019年12月，中国第二艘航母被正式命名为“山东舰”，其突破了船体结构，动力核心设备这两项重大技术瓶颈"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，目前我国列装的航母包括辽宁舰、山东舰和福建舰三艘。其中辽宁舰和山东舰属于6万吨级的中型航母，而福建舰是满载排水量8万余吨的大型航母，所以目前我国列装的航母满载排水量均超过5万吨。\nB项正确，“福建舰”是我国完全自主设计建造的首艘弹射型航空母舰，采用平直通长飞行甲板，配置电磁弹射和阻拦装置。\nC项错误，我国首艘国产航母是“山东舰”，2019年入列。“辽宁舰”2012年入列，前身是苏联海军的“瓦良格”号，并非我国首艘国产航母。\nD项正确，2019年12月17日，中国第二艘航母（第一艘国产航母）正式交付海军。山东舰入列仪式在海南三亚某军港举行，经中央军委批准，中国第一艘国产航母命名为“中国人民解放军海军山东舰”，舷号为“17”。山东舰突破了船体结构、动力核心设备这两项制约中国航母事业发展的重大技术瓶颈，以及发电机组、综合电力系统、节能减排装置等船舶动力产品设计建造关键技术。\n本题为选非题，故正确答案为C。","no":21,"missingImage":false},{"type":"question","qid":"13504402","cat":"人文常识","stem":"下列诗文涉及的人物或事件对应的时期错误的是：","options":{"A":"合从离衡，佩印者六——战国","B":"饮马瀚海，封狼居胥——东汉","C":"被遇神宗，致位宰相——北宋","D":"血战歼倭，勋垂闽浙——明朝"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，“合从离衡，佩印者六”出自《史记·苏秦列传》，指的是苏秦游说六国合作抗秦，佩有六国相印。苏秦为战国时期人物。\nB项错误，“饮马瀚海，封狼居胥”出自《史记·卫将军骠骑列传》，指的是霍去病带领汉军深入漠北，大败匈奴，在狼居胥山举行祭天封礼，在瀚海让马饮水，彰显了汉朝军队的赫赫战功和强大军威。霍去病为西汉而非东汉时期人物。\nC项正确，“被遇神宗，致位宰相”出自《宋史·王安石传》，指的是王安石受到宋神宗的知遇之恩，得以官至宰相。王安石是北宋时期人物。\nD项正确，“血战歼倭，勋垂闽浙”出自《明神宗实录》，指的是戚继光等人经过残酷激烈的战斗，歼灭了倭寇，在福建和浙江地区立下了不朽的功勋。戚继光为明朝时期人物。\n本题为选非题，故正确答案为B。","no":22,"missingImage":false},{"type":"question","qid":"13504417","cat":"科技常识","stem":"藻蓝蛋白是一种可从螺旋藻中提取分离得到的色素蛋白，可制成营养保健品，以下关于藻蓝蛋白说法错误的是：","options":{"A":"藻蓝蛋白在强酸环境下不稳定","B":"藻蓝蛋白是一种可食用的天然色素","C":"藻蓝蛋白至少由C、H、O、N四种元素组成","D":"藻蓝蛋白呈现蓝色是由于其吸收了蓝光的缘故"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，藻蓝蛋白是蛋白质，强酸会破坏其空间结构（变性），故蛋白质在强酸环境下不稳定。\nB项正确，藻蓝蛋白是天然色素，且属于可食用的天然色素，现已广泛应用于食品（如冰淇淋、饮料）和保健品中。\nC项正确，氨基酸是蛋白质的基本组成单位，至少含C、H、O、N四种元素。藻蓝蛋白是蛋白质，故藻蓝蛋白至少由C、H、O、N四种元素组成。\nD项错误，物质颜色由其反射或透射的光决定。藻蓝蛋白主要吸收红光和橙黄光等，而对蓝光的吸收较少，故藻蓝蛋白因反射或透射蓝光而呈蓝色。\n本题为选非题，故正确答案为D。","no":23,"missingImage":false},{"type":"question","qid":"13504403","cat":"科技常识","stem":"细菌A能产生水解氨苄青霉素的酶而具有氨苄青霉素抗性，细菌B没有，将细菌A和细菌B放在一起培养一段时间，发现部分细菌B也获得了氨苄青霉素抗性，把具有氨苄青霉素抗性的细菌B继续培养，其子代均具有氨苄青霉素抗性，由此可以推断，细菌B获得了细菌A的哪种物质而具有氨苄青霉素抗性？","options":{"A":"DNA","B":"RNA","C":"蛋白质","D":"氨苄青霉素"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，细菌的遗传物质是DNA，抗性基因通常位于DNA上。在细菌A和B共同培养时，可能发生了基因转移现象，比如通过转化、转导或接合等方式，使细菌A中携带氨苄青霉素抗性基因的DNA片段进入细菌B，使细菌B获得抗性。\nB项错误，细菌的遗传物质是DNA，RNA不是细菌遗传信息的主要载体，不具备像DNA那样稳定的遗传特性，难以将抗性基因稳定地传递给子代。\nC项错误，蛋白质是生命活动的主要承担者，不具备遗传物质的特性，不能将抗性相关的遗传信息传递给细菌B。即使细菌B摄入了细菌A的蛋白质，这些蛋白质也会在细菌B的细胞内被分解为氨基酸等基本单位。\nD项错误，氨苄青霉素是一种抗生素，不是遗传物质，不具备传递遗传信息和赋予细菌抗性的能力。\n故正确答案为A。","no":24,"missingImage":false},{"type":"question","qid":"13504404","cat":"科技常识","stem":"以下生活常识正确的是：","options":{"A":"飞机舷窗采用椭圆状设计可以减少飞机内外压力差","B":"如果汽车挡风玻璃出现小裂缝，可以通过在裂纹末尾钻一个适当大小的洞来阻止裂缝的扩散","C":"在地面上将一堆苹果堆成圆锥状，底部正中央的那个苹果，受到的压力最大，最容易被压坏","D":"往烧得通红的滚烫铁板上滴几滴水，如果看到水滴悬浮在空中，没有马上蒸发，是因为铁板温度不够高"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，飞机舷窗采用椭圆状设计，主要是因为飞机在高空飞行时，机舱内压力高于外部，机身会向外膨胀。圆形或椭圆状设计能让压力均匀分布，避免应力集中，降低舷窗破裂风险。而不是减少飞机内外压力差。\nB项正确，通过在汽车挡风玻璃的裂缝的末端钻孔，可以消除应力集中点，防止裂缝进一步扩散，这种方法被称为“止裂孔”，是一种常见的临时修复方法。需要注意的是，这种方法只能暂时解决问题，最终仍需要专业修复或更换挡风玻璃。止裂孔的原理是中断裂纹的扩展路径，减少应力集中。\nC项错误，当苹果堆成圆锥状时，由于颗粒物质的成拱现象，压力会沿着堆叠的方向向下传递并分散到果堆外围部分，从而形成中间颗粒受力小的“压力凹陷”情况。所以，底部正中央的苹果所受压强比同一层中附近的其他苹果要小，不是最容易被压坏的。\nD项错误，莱顿弗罗斯特效应是指液体在接触远高于其沸点的高温表面时，液体底部迅速汽化形成一层蒸气层，使液体悬浮并减缓蒸发速度的现象。往烧得通红的滚烫铁板上滴几滴水，如果看到水滴悬浮在空中，没有马上蒸发，恰恰说明铁板温度非常高，而不是不够高。\n故正确答案为B。","no":25,"missingImage":false}],"count":10,"answerable":10,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"13504421","cat":"逻辑填空","stem":"司马迁说：“余读孔氏书，想见其为人。适鲁，观仲尼庙堂······祗回留之，不能去。”“余读《离骚》······悲其志。适长沙，观屈原所自沉渊······想见其为人。”《史记》的“太史公曰”据信有120余篇，大多            ，彰显客观公正的史学观。唯有对孔子和屈原则是带着浓烈的个人情感，以基本相同的笔调，发出了触动人们心灵的赞叹。\n填入画横线部分最恰当的一项是：","options":{"A":"隐晦曲折","B":"直言不讳","C":"秉笔直评","D":"光明正大"},"answer":"C","explanation":"横线后“彰显客观公正的史学观”对横线处进行解释说明，且需要与后文“唯有对孔子和屈原则是带着浓烈的个人情感”形成语义相反，因此横线处应体现《史记》的“太史公曰”是秉持客观公正的态度、不带有过多个人情感来进行书写。C项“秉笔直评”指拿起笔不加隐讳地径直写出，置于文段可体现出《史记》的“太史公曰”不隐瞒、不夸大、真实地反映情况之意，符合文意，当选。A项“隐晦曲折”指写文章或说话时用隐隐约约、转弯抹角的方式来表达某种思想，无法体现出客观公正之意，与文意不符，排除；B项“直言不讳”指说话坦率，毫无顾忌，侧重表达方式的直白坦率，与文段强调《史记》“太史公曰”的内容客观公正无关，与文意不符，排除；D项“光明正大”形容襟怀坦白，行为正派，而横线处修饰《史记》“太史公曰”的写作内容，并非行为，搭配不当，排除。\n故正确答案为C。\n【文段出处】《屈原的文化高度：与日月同辉》","no":26,"missingImage":false},{"type":"question","qid":"13504398","cat":"逻辑填空","stem":"在其他动物体内，抗体的重轻链配对组成的Y形结构可以对抗种类繁多的微生物入侵者。这种结构久经考验，是重链和轻链蛋白质的编码基因片段混合重排的结果。由于每一条链对应的基因排列方式多种多样，所以组合起来就可以千变万化，而纳米抗体只有重链，多样性          。\n填入画横线部分最恰当的一项是：","options":{"A":"大打折扣","B":"寥寥无几","C":"微乎其微","D":"乏善可陈"},"answer":"A","explanation":"搭配“多样性”，且根据“抗体的重轻链配对组成的Y形结构······所以组合起来就可以千变万化，而纳米抗体只有重链”可知，横线处应体现纳米抗体的多样性与正常抗体相比有所减少之意。A项“大打折扣”指由于某种原因，使某物或某事的价值、功能、作用、影响等方面的程度有了大幅度的减少，符合文意，当选。\nB项“寥寥无几”指数量很少，没有几个，通常用于形容可数事物的数量，与“多样性”搭配不当，排除；C项“微乎其微”指非常少或非常小，程度过重，且不如“大打折扣”能体现与正常抗体多样性的对比，与文意不符，排除；D项“乏善可陈”指说不出有什么优点，没有什么好称道的，无法体现多样性变少之意，排除。\n故正确答案为A。\n【文段出处】澎湃新闻《“瘦身版”纳米抗体，能庇佑人类走多远》","no":27,"missingImage":false},{"type":"question","qid":"13504424","cat":"逻辑填空","stem":"不同国家和民族之间的对话，很大一部分是建立在世界意识的基础之上。世界之大，个人只能涉足有限的处所；作为一种彼此相知的语汇，文学可以帮助不同民族的人们            ，乃至共同参与世界。所以，世界范围            的文学经典展示了“人类”的存在。“人类”生活在地球的各个角落，然而，他们是相互联系的共同体——不论他们自己能否意识到这一点。\n依次填入画横线部分最恰当的一项是：","options":{"A":"心中有数 形形色色","B":"心心相印 跃然纸上","C":"心领神会 林林总总","D":"融会贯通 多姿多彩"},"answer":"C","explanation":"第一空，根据前文“不同国家和民族之间的对话”以及“作为一种彼此相知的语汇，文学可以帮助不同民族的人们······”可知，横线处要表达出文学能帮助不同民族的人们相互理解的意思，C项“心领神会”指对方没有明说，心里已经领会，符合文意，保留。A项“心中有数”指对情况和问题有基本的了解，处理事情有一定把握，无法体现出不同民族的人们相互理解的意思，与文意不符，排除；B项“心心相印”指彼此的心意不用说出，就可以互相了解，形容彼此的思想感情完全一致，置于此处程度过重，排除；D项“融会贯通”指各方面的知识或道理融合贯穿起来，从而得到系统透彻的理解，与文意无关，排除。\n第二空，代入验证，横线处与“文学经典”搭配，且根据前文“世界范围”可知，横线处要表达出世界上众多文学经典的意思，C项“林林总总”形容人或事物众多，与文意相符，当选。\n故正确答案为C。\n【文段出处】光明日报《以文学这门“世界语言”沟通心灵》","no":28,"missingImage":false},{"type":"question","qid":"13504391","cat":"逻辑填空","stem":"说起中国的民居建筑，人们想到的多是南徽北晋，其实关中的建筑风格            ，中国最早的房屋建筑便出现在关中临潼姜寨仰韶文化村落遗址。从关中各地聚集而成的关中民俗博物院，将古时关中民宅的建筑风格        呈现，让我们在艺术的熏陶中感受到关中建筑的伟大。\n依次填入画横线部分最恰当的一项是：","options":{"A":"青出于蓝 透彻","B":"后来居上 畅快","C":"技高一筹 全面","D":"更胜一筹 淋漓"},"answer":"D","explanation":"第一空，搭配“建筑风格”，且根据文意可知，横线处所填成语应表达关中的建筑风格更好之意。D项“更胜一筹”指技艺或技能比较起来，比别人更好一些，符合文意，保留。A项“青出于蓝”比喻学生超过老师或后人胜过前人，B项“后来居上”指后来的超过先前的，二者均侧重后者超越前者，文段并未涉及后者与前者的比较，与文意不符，排除；C项“技高一筹”指技术高人一等，与“建筑风格”搭配不当，排除。\n第二空，代入验证。根据“让我们在艺术的熏陶中感受到关中建筑的伟大”可知，横线处应体现关中民俗博物馆将古时关中民宅的建筑风格充分呈现之意。D项“淋漓”形容文章或说话表达得非常充分、透彻；也可形容非常痛快，符合文意，当选。\n故正确答案为D。\n【文段出处】人民周刊《关中民居中的秦人风骨》","no":29,"missingImage":false},{"type":"question","qid":"13504458","cat":"逻辑填空","stem":"消极语言行为有其情绪输出的          ，但因其具有关注度高、“杀伤力”大、传播迅速等特点，消极语言行为一旦社会化就会造成          不良影响。所以，消极语言行为需要及时治理。另外，消极语言行为对语言学习者语言价值观的塑造及形成有很强的影响力，危害显而易见。\n依次填入画横线部分最恰当的一项是:","options":{"A":"恰当性 极大的","B":"合理性 持久的","C":"应急性 客观的","D":"正当性 主观的"},"answer":"B","explanation":"第一空，横线后出现“但”，故前后文存在转折关系，由“但因其具有关注度高、‘杀伤力’大、传播迅速等特点······不良影响”可知，横线处需体现消极语言行为虽有危害，但在情绪输出这个层面也有其存在的道理之意。B项“合理性”指合乎道理或事理，D项“正当性”指合理合法，基本符合文意，保留。A项“恰当性”该词作为一个文化术语，意指创设恰当的情境，发现问题、解决问题的过程，很少作为一个普通语义的词语进行使用，用于横线处使用不当，排除；C项“应急性”指应付迫切的需要，与文意无关，排除。\n第二空，搭配“不良影响”，且根据“所以”引导的结论“消极语言行为需要及时治理”反推可知，横线处强调消极语言行为社会化之后造成较为严重的不良影响，B项“持久的”符合文意且与“不良影响”搭配恰当，当选。D项“主观的”无法体现出“不良影响”的严重性，不符合文意，排除。\n故正确答案为B。\n【文段出处】社会科学战线《【语言规划与治理】高宁，宋晖|论语言治理的问题域、困境与原则》","no":30,"missingImage":false},{"type":"question","qid":"13504426","cat":"逻辑填空","stem":"江南文化的价值不仅局限于文化典籍和文物古迹之中，更        在人们的日常生活之中。具有几千年江河湖海水韵的江南文化，以其精神文明、文化特征和风俗习惯，        和影响着一代又一代民众创造有烟火气、有温度的诗性生活。\n依次填入画横线部分最恰当的一项是：","options":{"A":"包含 汇聚","B":"蕴含 融汇","C":"酝酿 叠合","D":"孕育 萦绕"},"answer":"B","explanation":"第一空，根据“江南文化的价值不仅局限于······中，更······”可知，横线处应表示江南文化的价值还存在于人们的日常生活中。B项“蕴含”指包含、内部含有，符合文意，保留。A项“包含”指某事物内部含有其他内容或成分，常用于描述具体事物的组成或归属，与“江南文化价值”无法搭配，排除；C项“酝酿”是造酒的发酵过程，比喻做准备工作，江南文化的价值已存在，并非事前准备，与文意不符，排除；D项“孕育”指怀胎生育，比喻既存的事物中酝酿着新事物，江南文化的价值已存在，并非新事物，与文意不符，排除。\n第二空，代入验证，B项“融汇”指汇聚融合，置于此处既体现江南文化对多元元素的整合，又与“影响”形成逻辑并列，凸显文化对民众生活的渗透与塑造，当选。\n故正确答案为B。\n【文段出处】旅游时报《曹伟明：文化江南——“上善若水”的智慧特质》","no":31,"missingImage":false},{"type":"question","qid":"13504469","cat":"逻辑填空","stem":"古人说寿县“恃水以为固”，            。五代十国时期，后周大军将寿县重重包围，守将刘仁瞻誓死守城。后遇大雨，淮河淝水暴涨后周兵营水深数尺，死伤严重，不战而退。春秋战国时，寿县是可与洛阳、邯郸、临淄        的重要都会。自晋到唐、宋，寿县也以繁华著称于世，舟楫如梭，商贾如云。\n依次填入画横线部分最恰当的一项是：","options":{"A":"所言不虚 比肩","B":"言之有理 媲美","C":"当之无愧 鼎峙","D":"名不虚传 扛鼎"},"answer":"A","explanation":"第一空，根据后文“五代十国时期······后周兵营水深数尺，死伤严重，不战而退”可知，横线处所填成语应体现“古人说寿县‘恃水以为固’”的说法是正确的，符合客观事实的，A项“所言不虚”指所说的话真实可靠，D项“名不虚传”指流传的名声和实际相符合，均符合文意，保留。B项“言之有理”指说的话有道理，侧重强调说话有道理，文段强调古人对寿县的点评是正确的，而非有道理，排除；C项“当之无愧”指担得起某种荣誉或某个职务，无须感到惭愧，文段并未涉及荣誉或职务，排除。\n第二空，根据“春秋战国时，寿县是······重要都会”以及“自晋到唐、宋，寿县也以繁华著称于世”可知，寿县在当时是非常重要的城市，与洛阳、邯郸、临淄的地位不相上下，A项“比肩”指并肩，也比喻地位相等，符合文意，当选。D项“扛鼎”指举鼎，常用来比喻有大才，能负重任，也比喻攘夺国家政权，其词义均与文意无关，排除。\n故正确答案为A。","no":32,"missingImage":false},{"type":"question","qid":"13504428","cat":"逻辑填空","stem":"网络直播本质而言是一种“眼球经济”，极具效仿意味和引导效应。如果本该弘扬正能量、        真善美的镜头，却频频出现打擦边球、违背社会公序良俗的行为，那么长此以往不仅会        直播行业的健康发展，也会        风清气正的环境。\n依次填入画横线部分最恰当的一项是：","options":{"A":"散布 妨碍 损害","B":"撒播 阻挠 腐化","C":"传递 干扰 摧毁","D":"传播 阻碍 侵蚀"},"answer":"D","explanation":"第一空，搭配“真善美”，C项“传递”指由一方交给另一方，D项“传播”指广泛散布、传递，均与“真善美”搭配恰当，保留。A项“散布”指分散到各处或广泛传播，多用于消极语境，如“散布谣言”等，与横线处的感情色彩不符，排除；B项“撒播”一般指把种子均匀地撒在田地里，常搭配具体对象，与“真善美”这一抽象概念搭配不当，排除。\n第二空，根据“却频频出现打擦边球、违背社会公序良俗的行为”可知，横线处应体现不良的网络直播行为对直播行业健康发展产生消极影响之意。C项“干扰”意思是打扰、妨碍，D项“阻碍”指使不能顺利通过或发展，均符合文意，保留。\n第三空，搭配“环境”，且根据前文可知，横线处应体现不良的网络直播行为对风清气正的环境产生不利影响之意。D项“侵蚀”指逐渐侵害使变坏，与“环境”搭配恰当，且符合文意，当选。C项“摧毁”指用强大的力量破坏，“摧毁风清气正的环境”程度过重，排除。\n故正确答案为D。\n【文段出处】人民网《人民艺起评：莫让低俗成为网络直播的标签》","no":33,"missingImage":false},{"type":"question","qid":"13504467","cat":"逻辑填空","stem":"在实现第二个百年奋斗目标的新征程上，我们既拥有了强大的思想伟力、显著的制度优势，积累了        的物质基础、建立了        的产业体系和超大规模的国内市场，又面临着诸多风险挑战，甚至可能遇到难以想象的惊涛骇浪般的        考验。\n依次填入画横线部分最恰当的一项是：","options":{"A":"雄厚 完备 严峻","B":"丰厚 完善 巨大","C":"厚实 完美 严酷","D":"浑厚 完整 重大"},"answer":"A","explanation":"第一空，搭配“物质基础”，且由后文的“超大规模的国内市场”，可知所填词语需体现物质基础很充足的意思，A项“雄厚”指（人力、物力等）充足，B项“丰厚”指丰富、多，C项“厚实”指深厚扎实，均符合文意，保留。D项“浑厚”指朴实厚重，也形容说话、唱歌、朗诵等声音低沉有力，常与“声音、气势、力量”等搭配，与“物质基础”搭配不当，排除。\n第二空，搭配“产业体系”，A项“完备”指应该具备的全部具备，B项“完善”指完备良好，均与“产业体系”搭配恰当，保留。C项“完美”指完备美好，没有缺陷，强调事物没有任何缺点，由后文“面临着诸多风险挑战，甚至可能遇到难以想象的惊涛骇浪般的······考验”可知，当前的产业体系并非完美无瑕，排除。\n第三空，搭配“考验”，且由前文提到\"面临着诸多风险挑战，甚至可能遇到难以想象的惊涛骇浪般的······考验\"可知，这些考验具有极高的难度和挑战性。A项“严峻” 意为严厉、严肃、严重，常与 “考验、挑战、形势” 等搭配，能够突出这些考验的艰难程度高、具有较强的紧迫性，与前文 “诸多风险挑战”“难以想象的惊涛骇浪般” 所营造的紧张、艰难的语境相契合，符合文意，当选。B项 “巨大” 主要侧重于形容规模、数量、程度等方面非常大，比如 “巨大的工程”“巨大的力量” 等，“巨大的考验” 更多强调的是考验在规模或程度上的庞大，无法准确体现出此处所面临考验的艰巨性，与文意不符，排除。\n故正确答案为A。\n【文段出处】《理解伟大建党精神的三个重要维度》","no":34,"missingImage":false},{"type":"question","qid":"13504436","cat":"逻辑填空","stem":"青春的样子，本就是有理想、敢担当、能        、肯奋斗的样子。树立积极的就业观念，到祖国和人民最需要的地方发挥光和热，在乡村振兴、卫国戍边等各领域各方面工作中争当排头兵和生力军，不仅能够留下无悔的青春记忆，而且将在基层        中获得受用终身的精神财富，为走好职业生涯提供            的滋养。\n依次填入画横线部分最恰当的一项是：","options":{"A":"作为 磨难 日久弥新","B":"刻苦 磨练 经久不衰","C":"吃苦 磨砺 源源不断","D":"奉献 磨炼 滔滔不竭"},"answer":"C","explanation":"第一空，搭配“能”，且体现青春的样子。C项“吃苦”指经受艰苦，D项“奉献”指付出，不求回报，均与“能”搭配恰当且符合文意，保留。A项“作为”指建树，成就，通常表述为“有作为”而非“能作为”，排除；B项“刻苦”指肯下苦功夫、能吃苦，为形容词，置于文段用法错误，排除。\n第二空，横线处所填词语体现在基层历练中获得精神财富。C项“磨砺”和D项“磨炼”均指在艰难困苦的环境中锻炼，符合文意，保留。\n第三空，搭配“滋养”，且根据“获得受用终身的精神财富”可知，精神财富可以滋养终身。C项“源源不断”形容接连不断，符合文意，当选。D项“滔滔不竭”意思是像流水一样连续不断，形容话多，与“滋养”搭配不当，排除。\n故正确答案为C。\n【文段出处】人民日报《人民时评：树立正确的就业观》","no":35,"missingImage":false},{"type":"question","qid":"13504468","cat":"片段阅读","stem":"起伏越多越大的地形，越不利于上方气流的稳定，因此，在山地丘陵和城镇的上空，哪怕雷暴云产生了滚轴云，也很容易因地形的扰乱而被迅速破坏。而在广袤、平坦的海洋上空，滚轴云却可以经久不散。同样广袤的内蒙古大草原，看起来也理应利于滚轴云的频繁生成。但是，与大海低空湿润的空气相比，草原低空的空气未必湿润，而暖湿气流是雷暴云生长的基础。如果低空湿度不够，雷暴云即使形成，也难以在低空中形成大量的云体。\n这段文字主要介绍了：","options":{"A":"滚轴云是雷暴云生长的前提","B":"暖湿气流是滚轴云形成的基础","C":"地形和湿度是雷暴云形成的关键","D":"内陆中滚轴云比海洋更少的原因"},"answer":"D","explanation":"文段开篇指出起伏大的地形不利于滚轴云稳定，山地丘陵和城镇上空的滚轴云易被破坏，接着指出海洋上空地形平坦，滚轴云可经久不散。紧接着引出内蒙古大草原，指出草原理应利于滚轴云的频繁生成，随后通过“但是”反驳前文观点，指出草原低空空气湿度不够，难以在低空中形成大量的云体。故文段并列从山地丘陵和城镇地形角度和草原低空的空气湿度两个方面说明内陆比海洋滚轴云少的原因，对应D项。\nA项，文段强调雷暴云对滚轴云形成有影响，“滚轴云是雷暴云生长的前提”因果倒置，排除；\nB项，“暖湿气流”仅对应湿度一个方面，表述片面，排除；\nC项，文段中强调的是内陆与海洋滚轴云形成情况的对比，偏离重点，且文段重点强调“滚轴云”，“雷暴云”偷换概念，排除。\n故正确答案为D。\n【文段出处】中国国家地理《海岛 海上天象奇观的最佳观景台》","no":36,"missingImage":false},{"type":"question","qid":"13504473","cat":"片段阅读","stem":"在海洋中，人们一直认为固氮作用多是通过蓝细菌完成的，但实际上也有其他的固氮菌在大海中进行固氮作用。研究人员在固氮作用活跃海域的海水样本中发现了编码固氮酶的基因片段，不过，这些基因并不属于蓝细菌，反而与在陆地上能和豆类共生的根瘤菌关系密切。因此研究人员推测，这些基因所属的固氮菌很可能也是一种共生根瘤菌。这种固氮菌总是集中出现在硅藻体内的同一位置。新发现成功地将根瘤菌的宿主范围从陆地上的豆科植物扩展至海洋中的硅藻，进一步观测发现，这种共生现象在海洋中广泛存在。\n这段文字意在说明：","options":{"A":"大海中存在着很多共生的固氮菌","B":"海洋中的硅藻是根瘤菌的主要宿主","C":"根瘤菌-硅藻共生体也是海洋固氮的主要参与者","D":"除蓝细菌外，海洋中还有其他固氮菌进行固氮作用"},"answer":"C","explanation":"文段开篇指出人们一直以来认为固氮作用多是通过蓝细菌完成的，随后通过转折“但实际上”指出还有其他的固氮菌。接下来介绍了研究人员发现了编码固氮酶的基因片段，并通过转折“不过”强调这些基因和根瘤菌关系密切，随后通过“因此”进行总结，指出这些基因所属的固氮菌很可能也是一种共生根瘤菌，随后指出这种固氮菌出现在硅藻体内的同一位置，尾句进一步论述该发现的意义。故文段重在说明研究人员的新发现，即在硅藻体内的这一共生根瘤菌也能参与海洋的固氮作用，对应C项。\nA项，对应文段尾句，非重点，且未提及文段主题词“根瘤菌”，排除；\nB项，未提及根瘤菌“固氮”这一重要作用，偏离文段重点，排除；\nD项，“还有其他固氮菌”表述不及C项明确，排除。\n故正确答案为C。","no":37,"missingImage":false},{"type":"question","qid":"13504411","cat":"片段阅读","stem":"历史早期季节体系的发展演变与农事周期之间具有紧密联系。殷商及其以前的“二时”观念是围绕种植粟、黍等农作物的农事活动而产生的一种社会时间，殷商以来对冬小麦的推广种植并使其嵌入到固有的农业结构中，推动了先秦时期人们“四时”观念的萌生与演进。所以，“四时”观念的产生，是在对既有的“二时”观念进一步细化的基础上得以实现的，而冬小麦的推广种植及其在农业生产中重要地位的逐渐凸显，成为人们细化“二时”观念为“四时”观念的契机。\n这段文字主要讲述的是：","options":{"A":"社会时间超过自然时间之外而独立存在","B":"先秦“四时”观念与“二时”观念的联系","C":"冬小麦的推广种植在农业生产中的重要地位","D":"冬小麦的推广种植与先秦“四时”观念的产生"},"answer":"D","explanation":"文段开篇指出历史早期季节体系与农事周期联系紧密，接着说明殷商及其以前的“二时”观念与农事活动相关，随后指出殷商以来冬小麦的推广种植推动了先秦时期“四时”观念的萌生与演进，最后通过结论词“所以”强调冬小麦的推广种植是人们将“二时”观念细化为“四时”观念的契机。故文段主要论述冬小麦的推广种植促进先秦“四时”观念的产生，对应D项。\nA项，“社会时间”对应结论词前的内容“殷商······一种社会时间”，非重点，且“超过自然时间之外而独立存在”文段未提及，无中生有，排除；\nB项未提及文段主题词“冬小麦”，C项未提及文段主题词“四时”，均排除。\n故正确答案为D。\n【文段出处】《小麦的推广种植与先秦时期“四时”观念的强化》","no":38,"missingImage":false},{"type":"question","qid":"13504427","cat":"片段阅读","stem":"在中老年患者中，动脉硬化是个常见病。当血管出现硬化病变后，很多人认为只要将硬化的血管变“软”就可以改善病情。事实上，动脉硬化是以脂质代谢障碍为基础的一类病变，以胆固醇及低密度脂蛋白为主的脂质首先在血管内膜下沉积，然后逐渐在局部形成血栓，进一步通过纤维化及钙化形成动脉硬化斑块，最终导致动脉壁增厚变硬、血管腔狭窄。动脉硬化是一个不可逆的过程，出现硬化后的血管是无法恢复到正常状态的，因此动脉硬化的进程只能延缓，不能逆转。\n这段文字旨在说明：","options":{"A":"硬化的血管难再“软”","B":"老年人难逃动脉硬化","C":"动脉硬化是个常见病","D":"动脉硬化是基础病变"},"answer":"A","explanation":"文段开篇介绍动脉硬化在中老年患者这一群体中是常见病，引出动脉硬化这一话题，接着指出很多人认为将硬化的血管变“软”可以改善病情，随后通过转折词“事实上”介绍动脉硬化的具体形成过程，尾句强调硬化后的血管是无法恢复到正常状态的，最后通过“因此”对前文进行总结，表明动脉硬化的进程只能延缓，不能逆转，即动脉硬化后的血管是无法恢复到“软”状态的，故文段为分总结构，强调硬化后的血管是无法再变“软”的，对应A项。\nB项，“难逃动脉硬化”表述过于绝对，排除；\nC项、D项，分别对应前文“动脉硬化是个常见病”、“动脉硬化是以脂质代谢障碍为基础的一类病变”，为结论前的内容，非重点，均排除。\n故正确答案为A。\n【文段出处】北京青年报《洋葱沙拉、凉拌木耳、保健醋、深海鱼油······竟都是吃了个“寂寞”——原来血管是没办法被软化的》","no":39,"missingImage":false},{"type":"question","qid":"13504490","cat":"片段阅读","stem":"人工智能所带来的智能化和自动化社会发展趋势提升了社会生产效率，并对传统公共管理者的决策和服务角色带来挑战。人工智能作为新型的权利所有者逐渐代替传统公共管理者，作为基于计算逻辑、算法规则和数据的公共管理者参与到社会治理过程之中，从而使未来人工智能场景下的公共管理者角色由“事务性供给”转向“公共性维护”，这一趋势在将传统的公共管理者从社会事务管理中解放出来的同时，也淡化了传统公共管理者在社会中的管理者角色，使社会治理逐渐呈现由自由平等的生产者联合治理的特点。\n这段话所要表达的中心思想是：","options":{"A":"人工智能消除公共权利","B":"人工智能加速生产者联合","C":"人工智能提高技术治理能力","D":"人工智能推动社会自主管理的实现"},"answer":"D","explanation":"文段开篇指出人工智能提升了社会生产效率，同时也为传统公共管理带来了挑战，接着指出人工智能参与到社会治理过程之中，使传统公共管理者角色由“事务性供给”转向“公共性维护”，之后通过“这一趋势”总结前文，指出人工智能对传统公共管理者带来的影响，最后通过因果标志词“使”得出结论，强调人工智能使得社会治理呈现出新特点，即社会治理由自由生产者联合治理，对应D项。\nA项，“消除公共权利”文段并未提及，无中生有，且“消除”程度过重，文段仅为“淡化了传统公共管理者在社会中的管理者角色”，排除；\nB项，文段强调“社会治理”模式的转变，而不是单纯强调生产者联合这一现象本身，偏离文段核心话题，排除；\nC项，“技术治理能力”文段并未提及，无中生有，且文段核心话题为“社会治理”，“技术治理”概念偷换，排除。\n故正确答案为D。","no":40,"missingImage":false},{"type":"question","qid":"13504392","cat":"片段阅读","stem":"与工业经济、数字经济相比，生物经济最大的特点是打破了数字经济“赢者通吃”的商业模式，具有资源依赖性强、技术多样性高、市场垄断程度低等特点，为生物资源丰富、生物技术相对落后的国家提供了一次难得的、可能实现跨越式发展的机遇。我国生物资源丰富、市场潜力大，生物技术已有良好基础，做强做大生物经济，不仅能有效缓解甚至最终解决粮食安全、能源安全、环境安全、生物安全等问题，而且能够大幅度提高人民健康水平，推进新一轮经济增长。\n这段文字旨在说明：","options":{"A":"我国生物经济的发展现状与前景研判","B":"全球生物经济演进的规律和发展布局","C":"中国面临生物经济的巨大机遇和挑战","D":"生物经济对构建新发展格局意义重大"},"answer":"A","explanation":"文段开篇引出“生物经济”的话题，详细介绍了生物经济的特点，并指出生物经济“为生物资源丰富、生物技术相对落后的国家提供了一次难得的、可能实现跨越式发展的机遇”。接着指出我国有良好的生物基础，并点明做大做强生物经济，不仅能有效缓解甚至最终解决粮食安全、能源安全、环境安全、生物安全等问题，而且能够大幅度提高人民健康水平，推进新一轮经济增长。故文段重在围绕“生物经济”及“我国”展开论述，强调我国发展生物经济有良好的基础，及做大做强生物经济的好处，对应A项。\nB项，缺少文段核心话题“我国”，且“全球生物经济演进的规律和发展布局”无中生有，排除；\nC项，“中国面临生物经济的挑战”无中生有，排除；\nD项，缺少文段核心话题“我国”，且“新发展格局”无中生有，排除。\n故正确答案为A。\n【文段出处】光明网《我国生物经济发展现状与前景研判》","no":41,"missingImage":false},{"type":"question","qid":"13504494","cat":"片段阅读","stem":"在距今约1.26亿年至7200万年之间，树脂产量和沉积量特别大，地层里的琥珀十分丰富，该时段称为白垩纪树脂时期，比白垩纪树脂时期更早期的琥珀非常稀少，且很少包含生物；白垩纪结束后琥珀数量明显下降，近乎消失，直到6100万年前新生代地层中才开始出现新的琥珀。白垩纪树脂时期全球气候温暖湿润，大气中二氧化碳和甲烷等温室气体含量较高，频繁的火山活动促进气候变暖、改变大气成分，有利于松柏类植物生长，生物活跃、病虫害增加使树木分泌更多树脂，野火频发，促进树脂产生与埋藏，海平面上升使许多内陆低地被淹没，土层中石化树脂被冲刷、搬运、沉积形成琥珀矿藏。\n这段文字主要介绍了白垩纪树脂时期琥珀化石的：","options":{"A":"形态特征","B":"科学价值","C":"形成原因","D":"类别划分"},"answer":"C","explanation":"文段开篇指出白垩纪树脂时期琥珀非常丰富，接着论述这一时期气候温暖湿润、温室气体含量较高，以及频繁的火山活动有利于植物生长，生物活跃、病虫害增加使得树木分泌更多树脂，接着进一步指出，野火频发促进了树脂的产生与埋藏，之后论述海平面的上升使得石化树脂沉积，从而最终形成了琥珀矿藏，故整个文段重点围绕白垩纪树脂时期琥珀化石形成的全过程，介绍了其具体原因，对应C项。\nA项“形态特征”、B项“科学价值”、D项“类别划分”文段均未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】新华网《新研究解析白垩纪琥珀化石丰富的原因》","no":42,"missingImage":false},{"type":"question","qid":"13504493","cat":"片段阅读","stem":"不少消费者在选择食品时会关注其添加剂种类及含量，尽管他们对很多添加剂并不了解，但是配料表成分简单、化学名称成分少，成为他们购买食品的主要考量。事实上，规范使用的食品添加剂本身是安全的，完全不使用食品添加剂的食品在现代食品工业环境里很难找到。食品添加剂被认为是食品工业的标志产物，正因为食品工业的成熟，才让更丰富的食品进入消费者的视野。目前看来，食品安全和添加剂知识科普道阻且长。\n这段文字意在说明：","options":{"A":"食品安全和食品添加剂的关系","B":"消费者应理性看待食品添加剂","C":"食品添加剂是食品工业成熟的标志","D":"需要不断加强食品添加剂知识科普"},"answer":"D","explanation":"文段开篇指出消费者选择食品时会关注添加剂，且倾向于购买配料表成分简单、化学名称成分少的食品，接着通过“事实上”进行转折，指出规范使用的食品添加剂是安全的，且正因为食品工业的成熟，才让更多丰富食品进入消费者视野，即公众对食品添加剂存在误解，尾句指出目前食品安全和添加剂知识科普道阻且长。故文段层层铺垫，最后提出问题，即食品安全和添加剂知识科普道阻且长，选项需围绕“食品添加剂知识科普”给出针对性对策，对应D项。\nA、C两项，均对应文段非重点的部分，且缺少文段主题词“知识科普”，偏离文段中心，排除；\nB项，文段并非强调消费者应如何看待食品添加剂，而是强调要通过“知识科普”这一对策纠正消费者对于食品添加剂的错误认知，因此B项偏离文段中心，排除。\n故正确答案为D。\n【文段出处】消费日报《食品企业为配料表“瘦身”》","no":43,"missingImage":false},{"type":"question","qid":"13504471","cat":"语句表达","stem":"蝶翅是承载着复杂功能的器官。例如，蝶翅上的鳞片能够帮助蝶类调控体温，主要作用原理是通过张开或闭合鳞片，调节入射光线的角度，减少或增加对阳光中热能的吸收，将体温维持在正常范围。雄蝶的蝶翅可能具有一些特殊的发香鳞，这些发香鳞混于普通鳞片之中，具有腺体，可产生挥发性的信息素以便在求偶过程中吸引雌蝶。此外，很多蝶翅的图案和花纹还具有吓退捕食者或转移捕食者攻击目标的作用。可见，                    ，在蝶类生命活动中发挥着不可或缺的作用。\n填入画横线部分最恰当的一项是:","options":{"A":"鳞片和多形态的翅纹提高了蝴蝶的自我保护能力","B":"蝶翅鳞片具体功能因蝴蝶种类不同而有差异","C":"具有多种功能的蝶翅是成为拟态高手的关键","D":"蝶翅集控温、求偶、御敌等功能于一体"},"answer":"D","explanation":"横线位于文段结尾，且由“可见”引导，所填句子应对前文内容进行总结。文段开篇提出蝶翅承载复杂的功能，接着通过“例如”举例说明，介绍蝶翅上的鳞片能够帮助蝶类调控体温，随后又介绍雄蝶蝶翅上的发香鳞可用于求偶，紧接着通过并列标志词“此外”介绍蝶翅的图案和花纹有吓退捕食者或转移捕食者攻击目标的作用，横线处所填内容是对前文的总结，强调蝶翅具有多种功能，对应D项。\nA项，“提高了蝴蝶的自我保护能力”仅涉及其中一个方面，表述片面，排除；\nB项，“蝶翅鳞片具体功能因蝴蝶种类不同而有差异”文段未提及，无中生有，排除；\nC项，“拟态高手”文段未提及，无中生有，排除。\n故正确答案为D。","no":44,"missingImage":false},{"type":"question","qid":"13504488","cat":"语句表达","stem":"从事实际活动的现实的人，是马克思主义的出发点。实现人的自由全面发展是马克思主义的最高价值追求。要坚持以人民为中心，坚持人民主体地位，将人民作为改革与发展的实践主体和核心动力，将实现、维护和发展最广大人民根本利益、                     、促进人的自由全面发展作为改革与发展的根本目的和最高价值，激发人民的历史主动性和创造性，促进社会公正，增进民生福祉，不断实现人民对美好生活的向往，使人民群众有更多的获得感、幸福感、安全感。\n填入画横线部分最恰当的一项是：","options":{"A":"大力发展教育培训","B":"尊重人民各项权利","C":"完善各项法律法规","D":"推动人民参与治理"},"answer":"B","explanation":"本题为语句填空题，横线在文段中间，需联系上下文分析，且横线为所在句子的分句，重点把握句内的衔接。文段首先指出马克思主义这一话题，随后强调马克思主义的最高价值追求是人的自由全面发展，即保证人民的权益和主体性地位。横线前后通过并列形式分别强调“实现、维护和发展最广大人民根本利益”“促进人的自由全面发展”，这三者均是改革与发展的根本目的和最高价值，即“坚持以人民为中心，坚持人民主体地位”。故横线处也应体现重视“人民”的主体性地位。后文又提到“增进民生福祉，不断实现人民对美好生活的向往，使人民群众有更多的获得感、幸福感、安全感”，即要实现人的利益与权益，对应B项。\nA项“大力发展教育培训”，C项“完善各项法律法规”，均没有提及与人民相关的话题，排除；\nD项“推动人民参与治理”这一对策文段并未提及，且横线处应体现改革与发展的目的和价值，并非改革与发展的具体做法，表述错误，排除。 \n故正确答案为B。","no":45,"missingImage":false},{"type":"question","qid":"13504413","cat":"片段阅读","stem":"我们都知道很多植物的种子是靠动物来传播的，很多木本植物，喜欢利用鸟类来帮助它们传播种子。但对草本植物来说，有更适合它们的“工具人”——蚂蚁，而这些利用蚂蚁传播种子的植物有一个专有名词——蚁播植物。蚂蚁小，蚁播植物的种子也非常不起眼。原来，草本植物在种子上带了块营养丰富的“肉”，这个“肉”富含蚂蚁所需的油脂或者其他营养成分，而被叫做“油质体”。不管油质体种类是有多么丰富多彩，外形是有多么天差地别，但都逃不了两项原则：既要充当着诱惑蚂蚁的食物，还要作为蚂蚁叼着这些种子的抓手。\n接下来最有可能讲的是：","options":{"A":"蚂蚁如何处理蚁播植物","B":"“油质体”如何充当着诱惑蚂蚁的食物","C":"鸟类如何帮助木本植物传播它们的种子","D":"草本植物的“油质体”被其他植物“偷食”"},"answer":"B","explanation":"本题为接语选择题，应在通读全文的基础上，重点关注文段最后论述的核心话题。文段开篇指出很多植物的种子靠动物来传播，接着通过转折关联词“但”指出草本植物更适合靠蚂蚁传播种子，接着介绍草本植物种子上存在“油质体”，既要充当诱惑蚂蚁的食物，又要作为蚂蚁叼种子的抓手。故文段最后论述的核心话题为“油质体”和“蚂蚁”，且根据逻辑应先论述“油质体”如何作为食物诱惑蚂蚁，对应B项。\nA项“蚂蚁如何处理蚁播植物”、C项“鸟类如何帮助木本植物传播种子”均偏离文段最后论述的核心话题“油质体”，排除；\nD项“其他植物”偏离文段最后论述的核心话题“蚂蚁”，无法和尾句衔接，排除。\n故正确答案为B。\n【文段出处】《什么，蚂蚁竟然也能“种地”？！》","no":46,"missingImage":false},{"type":"question","qid":"13504396","cat":"片段阅读","stem":"从交通出行到餐饮消费，从垃圾分类到噪声治理，群众的日常生活与城市治理息息相关。提升城市治理精细化水平，也是适应城市发展新阶段、新要求，打造宜居、韧性、智慧城市的必然要求。过去5年，我国常住人口城镇化率稳步提升，由大规模增量建设转为存量提质改造和增量结构调整并重。在这样的大背景下，燃气管网、桥梁等如何实现实时监测，红绿灯如何配时，公园绿地如何布局等，都考验着城市治理精细化水平。\n这段文字接下来最可能介绍的是：","options":{"A":"城市治理智能化带来的新问题","B":"如何进行城市软硬件增量建设","C":"城市精细化治理与百姓的关联性","D":"如何提升城市治理的精细化水平"},"answer":"D","explanation":"本题为接语选择题，需通读全文，重点关注文段最后谈论的核心话题。文段开篇引出“城市治理”这一话题，指出群众的日常生活与城市治理息息相关，随后通过“必然要求”强调提升城市治理精细化水平的重要性，并简单介绍过去5年我国城镇化发展情况，尾句通过“在这样的大背景下”对前文总结，强调诸多民生事宜都考验着城市治理精细化水平。故文段最后讨论的核心话题为“城市治理精细化水平”，根据话题一致原则，后文应继续围绕这一话题展开，对应D项。\nA项“城市治理智能化”、B项“城市软硬件增量建设”文段均未提及，无中生有，且均未提及文段最后讨论的核心话题“城市治理精细化水平”，排除；\nC项，文段开头以及尾句已经论述过群众的日常生活与城市精细化治理息息相关，后文不会再继续论述，且未提及文段最后讨论的核心话题“城市治理精细化水平”，排除。\n故正确答案为D。\n【文段出处】人民日报《城市治理要下足绣花功夫（人民时评）》","no":47,"missingImage":false},{"type":"question","qid":"13504412","cat":"片段阅读","stem":"近年来，预制菜的种类和形制不断丰富，逐渐走上了大众餐桌。预制菜的方便、高效，顺应了当前快节奏生活和年轻消费群体的需求，具有广阔发展前景。预制菜产业的发展壮大，催生了更加细分的市场需求。撑起这些细分市场的，不仅是冷链物流等技术的发展进步，还有互联网营销模式的创新。预制菜不仅为群众餐桌增添了选择，也为餐饮企业经营创造了新的增长点。无论是原料生产采购、食材加工烹饪，还是物流运输、市场售卖，每个环节都规范有序，才能保证菜品质量过硬，保障消费者的身体健康和合法权益。\n这段文字重在说明：","options":{"A":"要拓宽预制菜销售渠道","B":"预制菜的潜在风险消费评估","C":"要推动预制菜产业健康发展","D":"制定预制菜质量评价规范刻不容缓"},"answer":"C","explanation":"文段开篇交代预制菜走上大众餐桌的背景，引出预制菜的话题，接着介绍了预制菜的优点，并指出其具有广阔的发展前景，随后指出预制菜产业的发展壮大，催生了细分的市场需求，之后介绍了预制菜带来的积极影响，尾句通过“······才”引出对策，强调预制菜多个环节都做到规范有序的重要性，文段重点为尾句的对策，对应C项。\nA项，文段强调预制菜每个环节都要规范有序，“拓宽预制菜销售渠道”偏离文段重点，排除；\nB项、文段整体对预制菜的态度倾向是积极正向的，“潜在风险消费评估”表意消极，与文意不符，排除；\nD项，文段尾句重在强调预制菜的各个环节必须规范有序的进行，才能保证其过硬的品质，并非仅仅局限于“制定质量评价规范”，且“刻不容缓”强调情势紧迫，必须马上去做，片刻不可拖延，文中并无如此紧急的问题和形势，无中生有，排除。\n故正确答案为C。\n【文段出处】人民网《推动预制菜产业健康发展（微观）》","no":48,"missingImage":false},{"type":"question","qid":"13504433","cat":"片段阅读","stem":"典籍版本资源有多种形式。除书籍外，印刷古籍的雕版，有文字记录的简帛、金石器物、石刻、碑刻、拓本、绘画、纸币、档案及近代以来各种类型的媒介等，均可纳入典籍版本资源的范畴。从广义上来说，凡是能够印证中华文明、以物证史、以物叙史、可以直观感受或触摸的实物，都可视为典籍版本资源。典籍版本资源是中华文明的“活化石”，是中国历史不绝如缕、一脉相承的“见证人”，也是中国文化影响世界的“实证者”。它为全面深入了解中华文明提供了一把钥匙，具有不可比拟的独特优势，在推动建设中华民族现代文明方面发挥着重要作用。\n这段文字重在讨论典籍版本：","options":{"A":"资源范畴与文化价值","B":"文献属性与社会作用","C":"形式类型与历史意蕴","D":"实物来源与优势地位"},"answer":"A","explanation":"文段开篇介绍典籍版本资源具有多种形式，包括书籍、雕版、简帛等，从广义上来说凡是能印证中华文明的实物都可视为典籍版本资源。此部分重点论述了典籍版本的资源范畴。随后介绍典籍版本资源是中华文明的“活化石”、是中国历史的“见证人”、是中国文化影响世界的“实证者”，为全面深入了解中华文明提供了钥匙，在推动建设中华民族现代文明方面发挥着重要作用。此部分重点强调典籍版本的文化价值。故文段为并列结构，分别论述了典籍版本的资源范畴及其文化价值，对应A项。\nB项，文段并未提及典籍版本的“文献属性”，无中生有，排除；\nC项，“历史意蕴”对应文段“是中国历史不绝如缕、一脉相承的‘见证人’”，仅为“文化价值”的一部分，表述片面，排除；\nD项，“实物来源”文段并未提及，且“优势地位”相比于“文化价值”表述不明确，排除。\n故正确答案为A。\n【文段出处】社科院专刊总第674期《发挥典籍版本资源作用推动建设中华民族现代文明》","no":49,"missingImage":false},{"type":"question","qid":"13504388","cat":"片段阅读","stem":"压力感和焦虑都是情绪反应。处于压力之下的人会出现烦躁、疲劳等心理和身体症状，而焦虑的人会出现持续和过度担忧，即使没有压力来源，这种担忧也不会消失。压力感是身体对危险或压力情况的自然和必要反应，可以由特定事件或情况触发，即所谓的压力源。通常，一旦压力情况得到解决，这些症状就会消失。焦虑的特点是过度担心或持续恐惧，在压力源消失后仍会继续存在。焦虑的症状可能与压力感的症状相似，但往往更持久。控制压力感和焦虑，可以尝试使用一些放松技巧，如保持均衡饮食、定期锻炼等。\n与这段文字意思不符的一项是：","options":{"A":"压力感和焦虑两者之间存在差别","B":"压力感的症状往往比焦虑的症状短暂","C":"压力源消失后，压力感和焦虑就会消失","D":"通过身心锻炼有利于减轻压力感和焦虑"},"answer":"C","explanation":"A项，根据“压力感是身体对危险或压力情况的自然和必要反应······焦虑的症状可能与压力感的症状相似，但往往更持久”可知，压力感与焦虑之间存在区别，表述正确，排除；\nB项，根据“焦虑的症状可能与压力感的症状相似，但往往更持久”可知，表述正确，排除；\nC项，根据“焦虑的特点是过度担心或持续恐惧，在压力源消失后仍会继续存在”可知，焦虑不会因为压力源消失而消失，与文意相悖，当选；\nD项，根据“控制压力感和焦虑，可以尝试使用一些放松技巧，如保持均衡饮食、定期锻炼等”可知，表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】参考消息网《紧张和焦虑，傻傻分不清？》","no":50,"missingImage":false},{"type":"question","qid":"13504390","cat":"片段阅读","stem":"中国科学院大气物理研究所开发的起沙模型很好地模拟出了2001年至2017年东亚沙尘暴频次的年际变化和减弱趋势，模拟的起沙通量与观测的沙尘天数具有很好的相关关系，相关系数达0.75。从变化的原因来看，沙尘源区上地表风速减弱、植被覆盖增加、土壤变湿均起到了重要作用，贡献率分别为46%、30%、24%。可见，风速减弱起主导作用，而植被覆盖增加和土壤变湿也有关键作用。\n由此可以推知：","options":{"A":"沙尘暴的起因有三方面","B":"起沙模型还有提升空间","C":"风速减弱属于人为因素","D":"增加植被覆盖率能够减弱沙尘暴"},"answer":"D","explanation":"A项，文段并未介绍“沙尘暴的起因”，文段介绍的是2001-2017年沙尘暴频次的年际变化和减弱趋势的原因，无中生有，排除；\nB项，文段并未提及起沙模型是否还有提升空间，无中生有，排除；\nC项，文段并未提及风速减弱属于人为因素，无中生有，排除；\nD项，根据“中国科学院大气物理研究所开发的起沙模型很好地模拟出了2001年至2017年东亚沙尘暴频次的年际变化和减弱趋势，······从变化的原因来看，沙尘源区上地表风速减弱、植被覆盖增加、土壤变湿均起到了重要作用，贡献率分别为46%、30%、24%。可见风速减弱起主导作用，而植被覆盖增加和土壤变湿也有关键作用”可知，增加植被覆盖率能够减弱沙尘暴，当选。\n故正确答案为D。\n【文段出处】中国科学院《大气所等揭示近20年来东亚沙尘暴活动减弱的原因》","no":51,"missingImage":false},{"type":"question","qid":"13504456","cat":"片段阅读","stem":"人类古基因组研究，就是通过解析过去的人类骨骼化石或是人类遗址沉积物里残存的古代人类的DNA信息，来了解他们的形成和演化过程。通过获取数十万年至数百年以前人群的DNA信息，能够解析他们的亲代及子代之间，以及和我们现在生活着的人群之间的遗传差异和亲缘联系，从而追溯到相关人群的来源。自首例尼安德特人和丹尼索瓦人的基因组数据发布以来，世界范围内已有超过6000例人类古基因组数据发表。世界各地人群基因组数据及相关研究不仅揭示出人类遗传图谱里许多新的支系，而且大致勾勒出全球人群过去数十万年迁徙、演化、交流与适应的历史脉络。\n由此可以推出：","options":{"A":"人类古基因组包含的信息量十分庞大","B":"古基因组捕获技术广泛应用于人类古基因研究中","C":"人类古基因组研究确定了全球人群演化的历史脉络","D":"目前已有超过6000例尼安德特人和丹尼索瓦人的古基因组数据发表"},"answer":"A","explanation":"A项，根据“通过获取数十万年至数百年以前人群的DNA信息，能够解析他们的亲代及子代之间，以及和我们现在生活着的人群之间的遗传差异和亲缘联系，从而追溯到相关人群的来源”可知，表述正确，当选；\nB项，“古基因组捕获技术”文段并未提及，无中生有，排除；\nC项，根据“世界各地人群基因组数据及相关研究不仅揭示出人类遗传图谱里许多新的支系，而且大致勾勒出全球人群过去数十万年迁徙、演化、交流与适应的历史脉络”可知，“确定”一词表述过于绝对，排除；\nD项，根据“自首例尼安德特人和丹尼索瓦人的基因组数据发布以来，世界范围内已有超过6000例人类古基因组数据发表”可知，“超过6000例尼安德特人和丹尼索瓦人”偷换概念，排除。\n故正确答案为A。\n【文段出处】中国科学《古DNA探秘东亚人群演化图谱》","no":52,"missingImage":false},{"type":"question","qid":"13504492","cat":"片段阅读","stem":"隐私计算作为一项可以实现数据在流转过程中“可用不可见”的技术，其价值被快速发掘并放大，成为数据安全、数据保护市场的关注焦点。隐私计算为解决数据存证、数据流通安全及隐私保护等问题提供了基础支撑，为海量复杂数据要素的全面流通提供了坚实的技术保障。这使隐私计算等技术成为驱动金融科技纵深发展的重要引擎。然而，隐私计算也面临着算力挑战。未来应重点探索隐私计算安全、性能、效果的平衡与统一，构建高安全、高效率、高可能的数据流通生态，实现隐私计算扩大应用落地范围，更好地推动数字经济发展。\n这段文字未谈论隐私计算的：","options":{"A":"应用前景","B":"技术保障","C":"发展难题","D":"发展方向"},"answer":"B","explanation":"A项，根据“隐私计算为解决数据存证、数据流通安全及隐私保护等问题提供了基础支撑······这使隐私计算等技术成为驱动金融科技纵深发展的重要引擎”可知，“应用前景”文段已谈论，排除；\nB项，根据“隐私计算为解决数据存证、数据流通安全及隐私保护等问题提供了基础支撑，为海量复杂数据要素的全面流通提供了坚实的技术保障”可知，隐私计算是海量复杂数据要素全面流通的技术保障，但文段并未提及隐私计算的技术保障，无中生有，当选；\nC项，根据“然而，隐私计算也面临着算力挑战”可知，“发展难题”文段已谈论，排除；\nD项，根据“未来应重点探索隐私计算安全、性能、效果的平衡与统一······实现隐私计算扩大应用落地范围，更好地推动数字经济发展”可知，“发展方向”文段已谈论，排除。\n本题为选非题，故正确答案为B。","no":53,"missingImage":false},{"type":"question","qid":"13504495","cat":"语句表达","stem":"①这种电池可以被用于驱动各种低功率、一次性可丢弃的电子器件\n②加上一点水，纸带上的盐会溶解，释放出带电离子，这些离子在纸带上弥散激活电池组\n③纸张和锌的生物可降解性，使这种电池能够最大程度减少可丢弃、低功率电子器件带来的环境影响\n④纸带上分布着氯化钠，纸带较短端浸了蜡，含有石墨薄片的油墨印制在纸带一面，有锌粉的油墨印制在纸带的另一面\n⑤一种新电池，主要由一个1平方厘米的电池单元组成，还包含3种印在长方形纸带上的油墨\n⑥这种油墨将电池组正负极和两根电线连接起来，电线位于有蜡的那端\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑤①⑥④②③","B":"⑤③④⑥①②","C":"⑤④⑥②①③","D":"⑤⑥④③②①"},"answer":"C","explanation":"观察选项，首句均为⑤句，可通过对比⑤句之后的内容进行判断。⑤句引出“新电池”的话题，并介绍了其主要组成部分，包括1平方厘米的电池单元以及印在长方形纸带上的3种油墨，⑤句之后有①、③、④、⑥四个句子。①句介绍的是“这种电池”的功用范围，①句解题线索不明显；④句详细描述了纸带的物质分布情况，包括纸带较短端浸了蜡以及纸带两面分别印制有含石墨薄片和锌粉的油墨，而③句介绍了纸张和锌的生物可降解性对电池性能的影响，根据逻辑顺序，应先指出纸带上有“锌”再论述其具体作用，故④句在③句之前，排除B项；⑥句介绍的是油墨的功能及“电线位于有蜡的那端”，根据逻辑顺序，应先指出纸带上有油墨和蜡，之后再论述油墨的功能及与“蜡”相关内容，故④句在⑥句之前，排除A、D两项，锁定C项。\n验证C项，⑤句引出话题，介绍新电池的组成部分，④⑥②三句对新电池组成部分及如何激活电池组作了介绍，①③两句对新电池的优势作了阐述，逻辑恰当，当选。\n故正确答案为C。\n【文段出处】光明网《加点水，激活纸电池》","no":54,"missingImage":false},{"type":"question","qid":"13504497","cat":"语句表达","stem":"①受此启发，科学家另辟蹊径，使用一组空中机器人，在人类监管下集群自行建造3D结构\n②而科学家们注意到，自然界中的黄蜂和家燕等都是高度灵活且可以在飞行中建造巢穴的动物\n③这些空中机器人使用泡沫和水泥样材料建造了概念验证的圆柱体，精度很高，符合建筑要求\n④未来这种飞行机器人能在偏远或难以抵达的地点提供房屋或重要基础设施的建造支持\n⑤最新论文展示了一组受动物启发建造的飞行机器人，可以在飞行中建造3D打印结构\n⑥用于现场建造的地面机器人安全性更好、生产力更高，但可操作的高度有限且需要电源\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑥②①⑤④③","B":"⑥②①③④⑤","C":"⑤②①③④⑥","D":"⑤④⑥②①③"},"answer":"D","explanation":"对比选项，确定首句。⑤句指出受动物启发建造的飞行机器人可在飞行中建造3D打印结构，⑥句介绍用于现场建造的地面机器人的特点及局限，两句均无明显的非首句特征，无法判断首句。\n继续寻找其他线索，④句中出现指代词“这种飞行机器人”，前文有指代内容，④句前分别是⑤句和③句，⑤句通过最新论文引出“飞行机器人”这一话题，与④句衔接恰当，③句同样出现指代词“这些空中机器人”无法与④句衔接，故⑤④捆绑，排除B、C两项；\n继续观察A、D两项，对比⑤④两句与⑥②①三句的先后顺序，⑤句中提出可以在飞行中建造3D打印结构的飞行机器人，是受到动物的启发而建造的。④句进一步指出这种飞行机器人重要的使用场景。⑥②①捆绑组合中的第②句详细的提到黄蜂、家燕等动物在飞行中建造巢穴这一现象，①句指出受动物启发科学家用空中机器人集群自行建造3D结构，可见②①两句是对⑤句的具体解释说明，因此⑥②①应在⑤④之后。且A项中①句和⑤句也无法衔接。排除A项，D项当选。\n故正确答案为D。\n【文段出处】科技日报《仿生无人机实现空中建造3D“楼阁”》","no":55,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"13504430","cat":"数学运算","stem":"小明在网络二手交易平台按照每张150元的价格转手了两张珍藏版CD，其中一张盈利25%，另一张亏损25%，则小明转手这两张CD总的盈亏情况是：","options":{"A":"不盈不亏","B":"盈利20元","C":"亏损20元","D":"亏损25元"},"answer":"C","explanation":"每张CD转手价格为150元，则盈利25%的CD原价为\u003cimg data-k=\"e4d0761d556d\">元；亏损25%的CD原价为\u003cimg data-k=\"5c63cf679783\">元。可得小明购买两张CD原价为120+200=320元，转手价格为150×2=300元，亏损了20元钱。\n故正确答案为C。","no":56,"missingImage":false},{"type":"question","qid":"13504431","cat":"数学运算","stem":"某小区组织“情满金秋”柑橘采摘活动，参加人员按年龄分成老、中、青三组，老年组、中年组的人数之比为5：2，中年组、青年组的人数之比为3：4。老年组、中年组、青年组平均每人采摘速度之比为1：2：3。已知青年组共采摘80斤柑橘，那么三组人员一共采摘柑橘：","options":{"A":"170斤","B":"212斤","C":"255斤","D":"298斤"},"answer":"A","explanation":"根据题干“老年组、中年组的人数之比为5：2，中年组、青年组的人数之比为3：4”，则老年组、中年组、青年组的人数之比为15：6：8，设老年组、中年组、青年组的人数分别为15a、6a、8a，根据题干“老年组、中年组、青年组平均每人采摘速度之比为1：2：3”，设老年组、中年组、青年组平均每人采摘速度分别为b、2b、3b，由题意得，青年组一共采摘8a×3b=80，解得\u003cimg data-k=\"a31f6740b2c9\">。老年组与中年组共采摘的柑橘重量为\u003cimg data-k=\"04ecf7995256\">\u003cimg data-k=\"fdaf08315e9d\">斤，故三组人员一共采摘的柑橘重量为90+80=170斤。\n故正确答案为A。","no":57,"missingImage":false},{"type":"question","qid":"13504438","cat":"数学运算","stem":"某企业到A大学招聘，小张、小李和小王3位毕业生前去应聘。若小张、小李2人中至少有1人签约的概率是\u003cimg data-k=\"170ce8fc8ae0\">，小王签约的概率是\u003cimg data-k=\"5ef3a129e326\">，那么3人中至少有1人签约该企业的概率是多少？","options":{"A":"\u003cimg data-k=\"62886ffdfcd1\">","B":"\u003cimg data-k=\"54d707f15b45\">","C":"\u003cimg data-k=\"ff1b1de9ab8e\">","D":"\u003cimg da
