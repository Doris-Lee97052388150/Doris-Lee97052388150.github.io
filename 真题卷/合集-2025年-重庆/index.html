=\"3ef63e75aaad\" style=\"max-width:203px\">\n故正确答案为D。","no":70,"missingImage":false}],"count":15,"answerable":15,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"13504460","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"a7a68dd93183\" style=\"max-width:500px\">","options":{"A":"①④⑤，②③⑥","B":"①②⑥，③④⑤","C":"①④⑥，②③⑤","D":"①②⑤，③④⑥"},"answer":"A","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。题干图形均由多个小元素组成，考虑元素的种类或个数。观察发现，图①④⑤中元素种类均为2，图②③⑥中元素种类均为1，即图①④⑤为一组，图②③⑥为一组。\n故正确答案为A。","no":71,"missingImage":false},{"type":"question","qid":"13504504","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"ca66e357a681\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，无明显属性规律，考虑数量规律。观察发现，题干图形中出现明显曲线和多边形，考虑线的数量。题干图形中既有曲线又有直线，考虑曲线和直线分开数。题干图形中曲线数量均为2，所以“？”处图形的曲线数量应为2，排除A项；直线数量均为7，所以“？”处图形的直线数量应为7，只有B项符合。\n故正确答案为B。","no":72,"missingImage":false},{"type":"question","qid":"13504521","cat":"图形推理","stem":"下面三视图依次与三个几何图形对应，三个几何图形的正确顺序是：\n\u003cimg data-k=\"8913ee89dd97\" style=\"max-width:500px\">","options":{"A":"②①③","B":"②③①","C":"①③②","D":"③①②"},"answer":"D","explanation":"本题考查三视图。图一左上方是③的主视图，图一右上方是③的左视图，图一左下方是③的俯视图；图二左上方是①的主视图，图二右上方是①的左视图，图二左下方是①的俯视图；图三左上方是②的主视图，图三右上方是②的左视图，图三左下方是②的俯视图。\n故正确答案为D。","no":73,"missingImage":false},{"type":"question","qid":"13504515","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"a31d60178814\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相同，考虑位置规律。观察第一组图形位置可知，从图一到图三，田字格中每一区域都是由前一幅图同位置顺时针旋转\u003cimg data-k=\"dd44efe89e5a\">得到，第二组应遵循相同的旋转规律，田字格中每一区域都是由前一幅图同位置顺时针旋转\u003cimg data-k=\"dd44efe89e5a\">得到，只有C项符合。\n故正确答案为C。","no":74,"missingImage":false},{"type":"question","qid":"13504506","cat":"图形推理","stem":"下图左侧给定的是3×3×3的正方体被分解后的多面体，切去的部分可以由给定的①、②和③三个多面体组合而成。以下哪项能填入问号处？\n\u003cimg data-k=\"7768193704e3\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查立体拼合。题干正方体中切去的部分可以由①、②以及B项三个多面体旋转后拼合而成，具体拼合过程如下图所示：\n\u003cimg data-k=\"cd896c96a437\" style=\"max-width:600px\">\n故正确答案为B。","no":75,"missingImage":false},{"type":"question","qid":"13504502","cat":"定义判断","stem":"拓扑绝缘体是一种内部绝缘、界面允许电荷移动的材料，在拓扑绝缘体的内部，电子能带结构和常规的绝缘体相似，但在其表面或边界上存在特殊的量子态，这些量子态位于块体能带结构的带隙之中，从而能够导电。\n根据上述定义，以下哪项是拓扑绝缘体?","options":{"A":"量子点接触是一种纳米尺度的电子器件，其整体的导电性质可以通过调整器件的尺寸和形状来调控","B":"氮化镓中由半导体异质结中的特殊电子结构形成的二维电子气，虽然其并不是一种材料，但在一定条件下能够导电","C":"纯石墨烯本身不导电，但是经过一些工艺加工后，会表现出在一定条件下可以允许表面电荷移动形成导电能力的一种量子效应","D":"镧钡铜氧体系的超导陶瓷，是一类在临界温度时电阻为零的陶瓷材料，它还表现出完全抗磁性的行为，在传输过程中几乎没有能量消耗"},"answer":"C","explanation":"第一步：找出定义关键词。\n“内部绝缘、界面允许电荷移动的材料”。\n第二步：逐一分析选项。\nA项：量子点接触可以通过调整器件的尺寸和形状来调控整体的导电性，未提及其内部和外部的导电情况，不符合“内部绝缘、界面允许电荷移动的材料”，不符合定义，排除；\nB项：氮化镓中的二维电子气在一定条件下能够导电，不符合“内部绝缘、界面允许电荷移动的材料”，不符合定义，排除；\nC项：纯石墨烯本身不导电，符合“内部绝缘”，经过一些工艺加工后可以允许表面电荷移动形成导电能力，符合“界面允许电荷移动”，符合定义，当选；\nD项：镧钡铜氧体系的超导陶瓷是一类在临界温度时电阻为零的陶瓷材料，没有提及其导电性，不符合“内部绝缘、界面允许电荷移动的材料”，不符合定义，排除。\n故正确答案为C。","no":76,"missingImage":false},{"type":"question","qid":"13504507","cat":"定义判断","stem":"马氏体相变是一种晶体结构变化。由于外界物理作用，比如温度、外力或者磁场的变化，一些材料的晶体结构会失去稳定性，原子发生短距离的移动，导致结构畸变。这种非原子扩散型的结构变化被称为马氏体相变。马氏体相变的一个重要特性是形状记忆效应，即基于两种结构相互转变和变体滑移，材料外形发生明显变化并能恢复原态。\n根据上述定义，下列未体现马氏体相变的是：","options":{"A":"将形状扭曲的别针放到热水里，别针立刻就能恢复原状","B":"起扩张血管作用的心脏支架用在外周血管时，因为挤压而变形","C":"通过电流加热控制合金网状结构变化，制造了能模仿蠕虫前进的机器人","D":"采用镍钛弓丝的牙齿矫形器受口腔温度影响，可产生形状恢复力，为牙齿矫形提供所需的力量"},"answer":"B","explanation":"第一步：找出定义关键词。\n“由于外界物理作用，比如温度、外力或者磁场的变化”、“材料外形发生明显变化并能恢复原态”。\n第二步：逐一分析选项。\nA项：形状扭曲的别针放到热水里，立刻就能恢复原状，说明由于温度的作用，别针的外形发生变化并恢复原状，符合“由于外界物理作用，比如温度、外力或者磁场的变化”、“材料外形发生明显变化并能恢复原态”，符合定义，排除；\nB项：心脏支架因为挤压而变形，说明由于外力的作用，支架的外形发生变化，但未体现支架是否可以恢复原状，不符合“材料外形发生明显变化并能恢复原态”，不符合定义，当选；\nC项：通过加热控制合金网状结构变化，制造了能模仿蠕虫前进的机器人，蠕虫的前进需要重复进行肢体的伸缩，说明由于温度的作用，机器人的外形发生变化并恢复原状，符合“由于外界物理作用，比如温度、外力或者磁场的变化”、“材料外形发生明显变化并能恢复原态”，符合定义，排除；\nD项：镍钛弓丝的牙齿矫形器受口腔温度影响，可产生形状恢复力，说明由于温度的作用，牙齿矫形器的外形发生变化并恢复原状，符合“由于外界物理作用，比如温度、外力或者磁场的变化”、“材料外形发生明显变化并能恢复原态”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":77,"missingImage":false},{"type":"question","qid":"13504484","cat":"逻辑判断","stem":"在某个定义域上有加减乘除等多种二元运算（用★代表其中一种），如果在定义域内存在一个数w，对于定义域范围内的每个数m（包括w），都有w★m=m，则称w为该种二元运算上的左幺元。\n以下关于左幺元的叙述正确的是：","options":{"A":"在整数范围内的乘法运算中，1是左幺元","B":"在整数范围内的加法运算中，1是左幺元","C":"在整数范围内的减法运算中，0是左幺元","D":"在整数范围内的除法运算中，0是左幺元"},"answer":"A","explanation":"第一步：找出定义关键词。\n“如果w，对于定义域范围内的每个数m（包括w），都有w★m=m”。\n第二步：逐一分析选项。\nA项：1乘以任何整数都等于原来的数，符合“如果w，对于定义域范围内的每个数m（包括w），都有w★m=m”，符合定义，当选；\nB项：1加任何整数都不等于原来的数，不符合“如果w，对于定义域范围内的每个数m（包括w），都有w★m=m”，不符合定义，排除；\nC项：0减去除0外的任何整数都不等于原来的数，不符合“如果w，对于定义域范围内的每个数m（包括w），都有w★m=m”，不符合定义，排除；\nD项：0除以除0外的任何整数都不等于原来的数，不符合“如果w，对于定义域范围内的每个数m（包括w），都有w★m=m”，不符合定义，排除。\n故正确答案为A。","no":78,"missingImage":false},{"type":"question","qid":"13504474","cat":"定义判断","stem":"物质循环是指在生态系统中，各种元素物质沿着特定途径从周围环境中被生物体吸收利用，再从生物体回到周围环境的循环变化过程，即各种元素物质在生物体和非生物环境之间的往复循环运转过程。\n下列诗句中所描写的内容最能体现物质循环的是：","options":{"A":"时有落花至，远随流水香","B":"莫作绕山云，循环无定期","C":"黄河之水天上来，奔流到海不复回","D":"落红不是无情物，化作春泥更护花"},"answer":"D","explanation":"第一步：找出定义关键词。\n“各种元素物质”、“在生物体和非生物环境之间”、“往复循环运转”。\n第二步：逐一分析选项。\nA项：选项意思是：不时有落花随溪水飘流而至，远远地就可闻到水中的芳香。表明落花及其香味在非生物环境中运转，但未提及生物体环境，不符合“在生物体和非生物环境之间”，不符合定义，排除；\nB项：选项意思是：不要像绕山云般循环往复，没有固定的周期。表明云在非生物环境中循环运转，但未提及生物体环境，不符合“在生物体和非生物环境之间”，不符合定义，排除；\nC项：选项意思是：那黄河之水犹如从天上倾泻而来，波涛翻滚直奔大海从来不会再往回流。表明黄河水在非生物环境中流动，但未提及生物体环境，且流动过程不是往复循环的，不符合“在生物体和非生物环境之间”、“往复循环运转”，不符合定义，排除；\nD项：选项意思是：从枝头上掉下来的落花不是无情之物，即使化作春泥，也甘愿化作养料，滋养美丽的春花成长。表明落花的元素物质在生物体和非生物环境之间运转，符合“各种元素物质”、“在生物体和非生物环境之间”、“往复循环运转”，符合定义，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"13504455","cat":"定义判断","stem":"免疫电镜技术是将抗原抗体反应的特异性和电子显微镜的高分辨率相结合，在亚细胞和超微结构水平上对抗原进行定位分析的一种高精确度的技术。\n根据上述定义，下列不属于免疫电镜技术的是：","options":{"A":"酶的催化作用对其底物的反应可形成不同的电子密度，运用电子显微镜来观察，可确定酶的存在，从而对抗原进行定位","B":"胶体金与铁蛋白一样具有高电子密度，将沙门氏菌的抗血清与胶体金颗粒结合，可以明确病原物抗原在电镜水平的定位","C":"铁蛋白通过交联剂与抗体等物质的共价结合，其分辨率高、散射能力强，借助电镜可以准确描述抗原抗体复合物的定位","D":"微流体检测芯片中的免疫电极体系有镀金基层、导电聚合物层和抗体层，三者自下而上依次贴合，提高检测定位的水平"},"answer":"D","explanation":"第一步：找出定义关键词。\n“将抗原抗体反应的特异性和电子显微镜的高分辨率相结合”、“在亚细胞和超微结构水平上对抗原进行定位分析”。\n第二步：逐一分析选项。\nA项：该项中运用电子显微镜观察酶的催化作用，符合“将抗原抗体反应的特异性和电子显微镜的高分辨率相结合”，通过确定酶的存在来对抗原进行定位，符合“在亚细胞和超微结构水平上对抗原进行定位分析”，符合定义，排除；\nB项：该项中将沙门氏菌的抗血清与胶体金颗粒结合，利用电子显微镜明确抗原定位，符合“将抗原抗体反应的特异性和电子显微镜的高分辨率相结合”、“在亚细胞和超微结构水平上对抗原进行定位分析”，符合定义，排除；\nC项：该项中铁蛋白通过交联剂与抗体等物质的共价结合，借助电镜准确描述抗原抗体复合物的定位，符合“将抗原抗体反应的特异性和电子显微镜的高分辨率相结合”、“在亚细胞和超微结构水平上对抗原进行定位分析”，符合定义，排除；\nD项：该项中只是提到微流体检测芯片中的免疫电极体系有不同的层结构来提高检测定位水平，但没有提及使用电子显微镜，不符合“将抗原抗体反应的特异性和电子显微镜的高分辨率相结合”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":80,"missingImage":false},{"type":"question","qid":"13504508","cat":"定义判断","stem":"近零碳建筑是指建筑物通过适应气候特征和场地条件，最大幅度地降低建筑对能源的需求，运行过程中全电化，不使用燃气，建筑排放的碳量处于较低水平。近零碳建筑不仅利用各种方法减少自身产生的碳排放，还收集并利用雨水、太阳能等可再生能源，最终达到零废水、零能耗、零废弃物的理想状态。\n下列做法不符合近零碳建筑理念的是：","options":{"A":"加大物联网、大数据、人工智能等技术在建筑上的应用","B":"淘汰预制模块化建筑技术，采用传热系数高的幕墙建材","C":"实现建筑内空调精细化运行，始终保持温湿度的独立控制","D":"利用集成地源热泵、空气源热泵、光伏发电等可再生能源"},"answer":"B","explanation":"第一步：找出定义关键词。\n“建筑物通过适应气候特征和场地条件”、“最大幅度地降低建筑对能源的需求”、“运行过程中全电化，不使用燃气”、“建筑排放的碳量处于较低水平”、“利用雨水、太阳能等可再生能源”、“零废水、零能耗、零废弃物”。\n第二步：逐一分析选项。\nA项：加大物联网、大数据和人工智能技术在建筑上的应用，各项技术能够实现智能化识别、定位、跟踪、监管等功能，有利于能源管理和优化，符合“建筑物通过适应气候特征和场地条件”、“最大幅度地降低建筑对能源的需求”，符合定义，排除；\nB项：建筑技术采用传热系数高的幕墙建材，会导致传热更快，保温隔热性能更差，反而增加建筑的能耗，不利于低碳，不符合“最大幅度地降低建筑对能源的需求”，不符合定义，当选；\nC项：实现建筑内空调精细化运行，可以减少能源的消耗，符合“最大幅度地降低建筑对能源的需求”、“建筑排放的碳量处于较低水平”，符合定义，排除；\nD项：利用集成地源热泵、空气源热泵、光伏发电等可再生能源，符合“建筑物通过适应气候特征和场地条件”、“利用雨水、太阳能等可再生能源”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":81,"missingImage":false},{"type":"question","qid":"13504472","cat":"定义判断","stem":"意思主义和表示主义是解释确定语言含义的两种方法。当语言发生歧义时，意思主义认为应当按照言语者内心所欲表达的真实意思来确定语言含义，而无需在意别人如何理解；反之，表示主义主张语言一旦表达出来便与言语者没有关系了，应当按照社会公众的通常理解来确定语言的含义。\n根据上述定义，下列说法最能体现意思主义的是：","options":{"A":"误载不害真意","B":"人同此心，心同此理","C":"一千个读者有一千个哈姆雷特","D":"横看成岭侧成峰，远近高低各不同"},"answer":"A","explanation":"第一步：找出定义关键词。\n意思主义：“按照言语者内心所欲表达的真实意思来确定语言含义”；\n表示主义：“按照社会公众的通常理解来确定语言的含义”。\n第二步：逐一分析选项。\nA项：“误载不害真意”指表意人与相对人已达成意思表示一致，不因合同文本中出现的用词错误而影响双方已经达成的真实合意，强调要按照表意人（言语者）内心真实的意思来确定，符合“按照言语者内心所欲表达的真实意思来确定语言含义”，符合“意思主义”定义，当选；\nB项：“人同此心，心同此理”的意思是合情合理的事，大家想法都会相同，不符合“按照言语者内心所欲表达的真实意思来确定语言含义”，不符合“意思主义”定义，排除；\nC项：“一千个读者有一千个哈姆雷特”指人们对同一艺术作品的解读因个体差异而呈现多样性，不符合“按照言语者内心所欲表达的真实意思来确定语言含义”，不符合“意思主义”定义，排除；\nD项：“横看成岭侧成峰，远近高低各不同”的意思是从正面、侧面看庐山山岭连绵起伏、山峰耸立，从远处、近处、高处、低处看庐山，庐山呈现各种不同的样子，不符合“按照言语者内心所欲表达的真实意思来确定语言含义”，不符合“意思主义”定义，排除。\n故正确答案为A。","no":82,"missingImage":false},{"type":"question","qid":"13504510","cat":"逻辑判断","stem":"假定有一个理想化的纯黑体，它能将所有吸收的能量以“光”的形式释放，则称之为绝对黑体，它从绝对零度（单位为“K”即开尔文，\u003cimg data-k=\"34bd75760464\">）开始被加热升温会由黑变为发红光、黄光、白光、蓝光。加热到N（K）时，绝对黑体发光所含的光谱成分就称N（K）色温；某发光物与N（K）温度下绝对黑体发光所含的光谱成分相同，就称其色温为N（K）。\n以下关于色温的叙述正确的是：","options":{"A":"把红、黄划分为暖色调，白、蓝划分为冷色调是由色温而来的","B":"一天内，肉眼看到的太阳颜色的变化是温差引起的色温变化导致的","C":"某发光体的光谱成分与绝对黑体在\u003cimg data-k=\"45fb306fb935\">时的相同，则它的色温是3000K","D":"某灯光的色温是1000K，则与之光谱成分相同的绝对黑体温度是\u003cimg data-k=\"cc7f0fe32a09\">"},"answer":"C","explanation":"第一步：找出定义关键词。\n绝对黑体：“能将所有吸收的能量以‘光’的形式释放”；\n色温：“从绝对零度（单位为‘K’即开尔文，\u003cimg data-k=\"34bd75760464\">）开始被加热升温会由黑变为发红光、黄光、白光、蓝光”、“加热到N（K）时，绝对黑体发光所含的光谱成分就称N（K）色温”、“发光物与N（K）温度下绝对黑体发光所含的光谱成分相同”。\n第二步：逐一分析选项。\nA项：根据“从绝对零度开始被加热升温会由黑变为发红光、黄光、白光、蓝光”可以推出光的颜色与温度有关，但是并不能由此推出色温是否是划分冷、暖色调的依据，说法错误，排除；\nB项：根据“从绝对零度开始被加热升温会由黑变为发红光、黄光、白光、蓝光”可知光的颜色与温度有关，但是选项并未提及一天内太阳具体的温差变化，实际上一天内太阳颜色的变化主要是由于大气散射引起的，并非色温变化导致，说法错误，排除；\nC项：根据“从绝对零度（单位为‘K’即开尔文，\u003cimg data-k=\"34bd75760464\">）开始被加热升温会由黑变为发红光、黄光、白光、蓝光”、“发光物与N（K）温度下绝对黑体发光所含的光谱成分相同”，因此可知N（K）就是绝对黑体从\u003cimg data-k=\"4be2e3585bfc\">加热到有光的色温，发光物和绝对黑体光谱相同时色温就是N（K），二者的换算关系为：\u003cimg data-k=\"0627e0b3d2bc\">，因此，某发光体相同的绝对温度在\u003cimg data-k=\"45fb306fb935\">时，对应的色温为\u003cimg data-k=\"ff552bd75590\">，说法正确，当选；\nD项：根据“从绝对零度（单位为‘K’即开尔文，\u003cimg data-k=\"34bd75760464\">）开始被加热升温会由黑变为发红光、黄光、白光、蓝光”、“发光物与N（K）温度下绝对黑体发光所含的光谱成分相同”，因此可知N（K）就是绝对黑体从\u003cimg data-k=\"4be2e3585bfc\">加热到有光的色温，发光物和绝对黑体光谱相同时色温就是N（K），二者的换算关系为：\u003cimg data-k=\"317f47cfa43d\">，某灯光的色温是1000K，则与之光谱成分相同的绝对黑体温度\u003cimg data-k=\"dedc6c1b235b\">，并非\u003cimg data-k=\"cc7f0fe32a09\">，说法错误，排除。\n故正确答案为C。","no":83,"missingImage":false},{"type":"question","qid":"13504509","cat":"定义判断","stem":"合意是指当事人双方或者多方意思表示达成一致。决议是指多个主体根据表决原则做出的决定，是经由多数决策程序机制得出的意思表示，决议结果对团体内部全体成员都有效。\n根据上述定义，下列属于决议的是：","options":{"A":"李某、王某驾车和陈某的车相撞，经过调解员调解，李某、王某和陈某就交通事故的赔偿金额达成一致意见","B":"某上市公司召开股东会就增加注册资本事宜进行投票，虽然有12%的股东投反对票，但仍通过了决定","C":"黄某要求解除婚姻关系，他的妻子坚决不同意：“离婚不是一个人说了算”","D":"某学院组织全体50名教师投票推选年度优秀教师"},"answer":"B","explanation":"第一步：找出定义关键词。\n合意：“当事人双方或者多方意思表示达成一致”；\n决议：“多个主体”、“根据表决原则做出的决定”、“经由多数决策程序机制得出的意思表示”、“决议结果对团体内部全体成员都有效”。\n第二步：逐一分析选项。\nA项：李某、王某驾车和陈某的车相撞，最后就交通事故赔偿金额达成一致意见，是当事人双方意思达成一致，并非由决策程序机制得出的意思表示，符合“当事人双方或者多方意思表示达成一致”，不符合“经由多数决策程序机制得出的意思表示”，符合合意的定义，不符合决议的定义，排除；\nB项：上市公司召开股东会进行投票，最终通过了决定，是多个主体经过决策程序机制得出的结果，对团体内部成员都有效，符合“多个主体”、“根据表决原则做出的决定”、“经由多数决策程序机制得出的意思表示”、“决议结果对团体内部全体成员都有效”，符合决议的定义，当选；\nC项：黄某要求解除婚姻关系，其妻子不同意，只是夫妻双方的意见分歧，并非是由多数决策程序机制得出的意思表示，不符合“经由多数决策程序机制得出的意思表示”，不符合决议的定义，排除；\nD项：学院组织全体教师投票推选优秀教师，只是处在投票阶段，并未做出最后的决定，不符合“根据表决原则做出的决定”、“决议结果对团体内部全体成员都有效”，不符合决议的定义，排除。\n故正确答案为B。","no":84,"missingImage":false},{"type":"question","qid":"13504511","cat":"定义判断","stem":"计算亲属关系亲疏远近的单位是亲等，国际最为通用的是罗马法亲等计算法和寺院法亲等计算法，二者关于旁系血亲的计算法有所不同：罗马法亲等计算法是从己身往上数至双方共同的直系血亲即同源人，每经一代为一亲等，再往下数至要计算的人，也是每经一代为一亲等，所有数字相加就是双方之间的亲等数；寺院法亲等计算法是从己身和所要计算的人分别往上数至血缘同源人，两边的亲等数相等时，就采用一边的亲等数，如果亲等数不等，则采用多的一方的亲等数。\n根据上述定义，下列符合罗马法亲等计算法的是：","options":{"A":"自己与外甥的女儿之间的亲等是三亲等","B":"表妹与堂妹之间的亲等，都是四亲等","C":"姑侄之间的亲等是二亲等","D":"自己与伯父之间是三亲等"},"answer":"D","explanation":"第一步：找出定义关键词。\n罗马法亲等计算法：“从己身往上数至双方共同的直系血亲即同源人，每经一代为一亲等”、“再往下数至要计算的人，也是每经一代为一亲等”、“所有数字相加”；\n寺院法亲等计算法：“从己身和所要计算的人分别往上数至血缘同源人”、“两边的亲等数相等时，就采用一边的亲等数”、“亲等数不等，则采用多的一方的亲等数”。\n第二步：逐一分析选项。\nA项：自己与外甥的女儿的同源人是自己的父母，从自己到父母经过“自己\u003cimg data-k=\"a37757d411ef\">父母”，共1代，从父母到外甥的女儿经过“父母\u003cimg data-k=\"a37757d411ef\">姐姐/妹妹\u003cimg data-k=\"a37757d411ef\">外甥\u003cimg data-k=\"a37757d411ef\">外甥的女儿”，共3代，1+3=4，因此为四亲等，不符合定义，排除；\nB项：当表妹为妈妈的兄弟姐妹的女儿时，与堂妹（父亲的兄弟的女儿）没有共同的直系血亲，无血缘关系和亲等关系，不符合定义，排除；\nC项：姑姑和侄子的同源人是侄子的爷爷，从姑姑到侄子的爷爷经过“姑姑\u003cimg data-k=\"a37757d411ef\">爷爷”，共1代，从爷爷到侄子经过“爷爷\u003cimg data-k=\"a37757d411ef\">父亲\u003cimg data-k=\"a37757d411ef\">侄子”，共2代，1+2=3，因此为三亲等，不符合定义，排除；\nD项：自己与伯父的同源人是自己的爷爷，从自己到爷爷经过“自己\u003cimg data-k=\"a37757d411ef\">父亲\u003cimg data-k=\"a37757d411ef\">爷爷”，共2代，从爷爷到伯父经过“爷爷\u003cimg data-k=\"a37757d411ef\">伯父”，共1代，2+1=3，因此为三亲等，符合定义，当选。\n故正确答案为D。","no":85,"missingImage":false},{"type":"question","qid":"13504429","cat":"类比推理","stem":"低碳排放：保护环境","options":{"A":"候鸟迁徙：气候变化","B":"昆虫叮咬：过敏反应","C":"收集数据：调查研究","D":"滴水成冰：热胀冷缩"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n低碳排放是为了保护环境，二者为方式目的的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：候鸟迁徙是因为气候变化，二者为因果的对应关系，与题干逻辑关系不一致，排除；\nB项：昆虫叮咬会导致过敏反应，二者为因果的对应关系，与题干逻辑关系不一致，排除；\nC项：收集数据是为了调查研究，二者为方式目的的对应关系，与题干逻辑关系一致，当选；\nD项：滴水成冰意思是水滴下去就结成冰，形容天气十分寒冷；热胀冷缩指物体受热时会膨胀，遇冷时会收缩的特性，二者不是方式目的的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":86,"missingImage":false},{"type":"question","qid":"13504453","cat":"类比推理","stem":"言之无文：行之不远","options":{"A":"一叶障目：不见泰山","B":"宁为玉碎：不为瓦全","C":"藏诸名山：传之其人","D":"取之不尽：用之不竭"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“言之无文，行之不远”的意思是说话没有文采，就传播不远，因为“言之无文”，所以“行之不远”，二者为因果关系。\n第二步：判断选项词语间逻辑关系。\nA项：“一叶障目，不见泰山”的意思是一片树叶挡住了眼睛，连面前高大的泰山都看不见，因为“一叶障目”，所以“不见泰山”，二者为因果关系，与题干逻辑关系一致，当选；\nB项：“宁为玉碎，不为瓦全”的意思是指宁愿做高贵的玉器而破碎，也不愿做低贱的瓦器得以保全，二者不是因果关系，与题干逻辑关系不一致，排除；\nC项：“藏诸名山，传之其人”的意思是指把著作藏在名山，传给后来志趣相投的人，二者不是因果关系，与题干逻辑关系不一致，排除；\nD项：“取之不尽，用之不竭”的意思是指拿不完用不尽，二者为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"13504483","cat":"类比推理","stem":"宜居带：液态水","options":{"A":"舒适区： 页岩气","B":"生物圈：有机物","C":"无人区：可燃冰","D":"地震带：火山岩"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n液态水是成为宜居带的必要条件，二者为必要条件的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：页岩气与舒适区没有必然关系，二者不是必要条件的对应关系，与题干逻辑关系不一致，排除；\nB项：生物圈是地表有机体包括微生物及其自下而上环境的总称，是行星地球特有的圈层，有机物是生物圈的必要条件，二者为必要条件的对应关系，与题干逻辑关系一致，当选；\nC项：可燃冰分布于深海或陆域永久冻土中，与无人区没有必然联系，二者不是必要条件的对应关系，与题干逻辑关系不一致，排除；\nD项：地震带和火山岩都是板块运动形成的，火山岩经常分布在地震带上，但二者并非必要条件的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":88,"missingImage":false},{"type":"question","qid":"13504482","cat":"类比推理","stem":"细菌：真菌","options":{"A":"鸳：鸯","B":"地下水：饮用水","C":"原子：电子","D":"蛾眉月：下弦月"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n细菌和真菌都是微生物的一种，细菌是原核微生物，真菌为真核微生物，除此之外还有非细胞类微生物，比如病毒，二者为并列关系中的反对关系。\n第二步：判断选项词语间逻辑关系。\nA项：鸳鸯中的鸳意指雄鸟，鸯意指雌鸟，二者为并列关系中的矛盾关系，与题干逻辑关系不一致，排除；\nB项：地下水是指赋存于地面以下岩石空隙中的水，饮用水是指可以不经处理、直接供给人体饮用的水，有的地下水是饮用水，有的地下水不是饮用水，有的饮用水是地下水，有的饮用水不是地下水，二者为交叉关系，与题干逻辑关系不一致，排除；\nC项：原子包含带一个基本电荷的正电的质子和不带电的中子组成的原子核以及与质子数相同的核外电子，二者为组成关系，与题干逻辑关系不一致，排除；\nD项：蛾眉月，农历月底和月初的月亮或月相，下弦月，农历每月二十二、二十三日的月亮或月相，除此之外还有上弦月等，二者为并列关系中的反对关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":89,"missingImage":false},{"type":"question","qid":"13504485","cat":"类比推理","stem":"车辆：货车：运输","options":{"A":"温室气体：甲烷：二氧化碳","B":"未来产业：量子信息：研究监管","C":"自我意识：人格：心理调节","D":"绿色能源：太阳能：发电"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n货车是一种车辆，前两词为种属关系，货车可以用来运输，后两词为功能对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：甲烷和二氧化碳均是一种温室气体，第一词与后两词分别构成种属关系，且后两词为并列关系，与题干逻辑关系不一致，排除；\nB项：量子信息是一种未来产业，前两词为种属关系，研究监管不是量子信息的功能，后两词不是功能对应关系，与题干逻辑关系不一致，排除；\nC项：自我意识对人格的形成、发展有作用，前两词不是种属关系，心理调节不是人格的功能，后两词不是功能对应关系，与题干逻辑关系不一致，排除；\nD项：太阳能是一种绿色能源，前两词为种属关系，太阳能可以用来发电，后两词为功能对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":90,"missingImage":false},{"type":"question","qid":"13504491","cat":"逻辑判断","stem":"某研究团队发布了一项关于睡眠习惯、时间与癌症风险的研究。研究分析了近1.5万人，发现睡眠时间短导致癌症风险升高，和睡眠时间为6-8小时的参与者相比，夜间睡眠时间少于6小时的人，患癌风险升高41%，和午睡时间多于60分钟的参与者相比，从不午睡的参与者患癌风险升高60%。\n以下哪项如果为真，最能加强上述观点：","options":{"A":"睡眠时间短会损害免疫功能、降低人体对肿瘤细胞的识别和消灭能力","B":"人类环境、卫生资源和睡眠习惯的变化，导致癌症发病原因发生了变化","C":"夜间睡眠时间短或不午睡的参与者，大多年龄较大且缺少锻炼，健康状况不佳","D":"和总睡眠时间为7-8小时的参与者相比，总睡眠时间少于7小时的男性，患癌风险升高69%"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：睡眠时间短导致癌症风险升高。\n论据：和睡眠时间为6-8小时的参与者相比，夜间睡眠时间少于6小时的人，患癌风险升高41%，和午睡时间多于60分钟的参与者相比，从不午睡的参与者患癌风险升高60%。\n论据在说夜间睡眠时间短和从不午睡的参与者患癌风险高，论点在说睡眠时间短导致癌症风险升高，二者话题一致，加强考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出“睡眠时间短会损害免疫功能、降低人体对肿瘤细胞的识别和消灭能力”，解释了睡眠时间短与患癌风险高之间的关系，补充论据，可以加强，保留；\nB项：该项指出人类环境、卫生资源和睡眠习惯的变化使得癌症发病原因发生了变化，并未说明睡眠时间短和癌症风险高有关系，无法加强，排除；\nC项：该项指出夜间睡眠时间短或不午睡的参与者，年龄较大且缺少锻炼，但并未说明年龄较大、缺少锻炼是否癌症风险就会高，为不明确项，无法加强，排除；\nD项：该项指出睡眠时间短于7小时的男性患癌风险升高了69%，举例说明睡眠时间短与患癌风险高之间存在关系，补充论据，可以加强，保留。\n比较A、D两项，A项是解释原因，D项举例，解释原因的加强力度大于举例，A项的加强力度更强。\n故正确答案为A。","no":91,"missingImage":false},{"type":"question","qid":"13504470","cat":"逻辑判断","stem":"在长期的进化过程中，蝙蝠（狐蝠除外）获得了对夜间飞行十分有利的回声定位能力，可以将喉咙和鼻子处生成的超声波以短脉冲形式发射到周围，并且能用耳朵接收反射回的声波，以此来确定自身到物体的距离、物体所在方向以及物体形状等。一般来说，蝙蝠的寿命比其他相同体型的哺乳类动物要长3.5倍，有科学家推测，蝙蝠的夜行性和飞行能力可以降低它们被捕食的风险，这可能对其寿命的延长有所帮助。\n以下哪项如果为真，最能加强上述科学家的推测：","options":{"A":"在夜间飞行时，如果蝙蝠的耳朵被堵住，它们就无法顺利地躲避障碍物","B":"倒挂姿势不仅有助于蝙蝠起飞，还可以使它们睡在洞穴顶部等隐蔽场所","C":"黑暗中蝙蝠能够正确识别周围环境，这有助于它们成功躲避天敌的侵扰","D":"蝙蝠体内抑制病毒感染和增殖的蛋白质较多，即使感染病毒也不会发病"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：蝙蝠的夜行性和飞行能力可以降低它们被捕食的风险，这可能对其寿命的延长有所帮助。\n论据：在长期的进化过程中，蝙蝠（狐蝠除外）获得了对夜间飞行十分有利的回声定位能力，可以将喉咙和鼻子处生成的超声波以短脉冲形式发射到周围，并且能用耳朵接收反射回的声波，以此来确定自身到物体的距离、物体所在方向以及物体形状等。一般来说，蝙蝠的寿命比其他相同体型的哺乳类动物要长3.5倍。\n本题论点和论据均在讨论蝙蝠的夜行性、飞行能力及其寿命，论点和论据话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：选项说的是在夜间飞行时，如果蝙蝠的耳朵被堵住，它们就无法顺利地躲避障碍物，说明蝙蝠的耳朵对其顺利地躲避障碍物的重要性，是在重复论据，与论点讨论的蝙蝠的夜行性和飞行能力是否可以降低它们被捕食的风险，以及这是否可能对其寿命的延长有所帮助无关，无关项，无法加强，排除；\nB项：选项说的是倒挂姿势不仅有助于蝙蝠起飞，还可以使它们睡在洞穴顶部等隐蔽场所，是在讨论蝙蝠倒挂姿势的好处，但论点讨论的是蝙蝠的夜行性和飞行能力是否可以降低它们被捕食的风险，以及这是否可能对其寿命的延长有所帮助，话题不一致，无法加强，排除；\nC项：选项说的是黑暗中蝙蝠能够正确识别周围环境，这有助于它们成功躲避天敌的侵扰，是在解释为什么蝙蝠的夜行性可以降低它们被捕食的风险，补充论据，可以加强，当选；\nD项：选项说的是蝙蝠体内抑制病毒感染和增殖的蛋白质较多，即使感染病毒也不会发病，但论点讨论的是蝙蝠的夜行性和飞行能力是否可以降低它们被捕食的风险，以及这是否可能对其寿命的延长有所帮助，话题不一致，无法加强，排除。\n故正确答案为C。","no":92,"missingImage":false},{"type":"question","qid":"13504487","cat":"逻辑判断","stem":"有研究人员针对素食对心血管疾病高危人群的影响进行数据分析发现，素食与低密度脂蛋白胆固醇、葡萄糖水平和体重的显著改善有关，因此，研究人员提出素食可有效降低胆固醇、血糖和体重。\n以下哪项如果为真，不能削弱上述结论：","options":{"A":"快餐店素食套餐含有精制碳水化合物、蔗糖、玉米糖浆等，热量更高","B":"部分素食含有大量反式脂肪酸，反式脂肪酸的摄入会引起胆固醇升高","C":"广义上的素食不仅包括蔬菜等纯素食，还包括鸡蛋、奶和乳制品","D":"素食中的蔬菜多是油炸的，这使素食者变胖的风险更大"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：素食可有效降低胆固醇、血糖和体重。\n论据：素食与低密度脂蛋白胆固醇、葡萄糖水平和体重的显著改善有关。\n本题论点和论据讨论的均是“素食”和“胆固醇、血糖和体重”的关系，二者话题一致，且本题为选非题，排除能够削弱的选项即可。\n第二步：逐一分析选项。\nA项：选项指出“快餐店素食套餐含有精制碳水化合物、蔗糖、玉米糖浆等，热量更高”，说明素食可能无法降低血糖和体重，削弱论点，可以削弱，排除；\nB项：选项指出“部分素食含有大量反式脂肪酸，反式脂肪酸的摄入会引起胆固醇升高”，说明素食无法降低胆固醇，削弱论点，可以削弱，排除；\nC项：选项指出“广义上的素食”包含哪些，但并未说明素食是否能够“有效降低胆固醇、血糖和体重”，话题不一致，为无关项，无法削弱，当选；\nD项：选项指出“素食中的蔬菜多是油炸的，这使素食者变胖的风险更大”，说明素食无法降低体重，削弱论点，可以削弱，排除。\n本题为选非题，故正确答案为C。","no":93,"missingImage":false},{"type":"question","qid":"13504459","cat":"逻辑判断","stem":"景德镇是著名的瓷器之都，一条名为昌河的河流从景德镇北方流过。船通过昌河进入鄱阳湖再进入长江，最终入海把景德镇的瓷器行销世界。为什么瓷器的辉煌是在景德镇？专家认为，这与景德镇地处河流密布的水运区紧密相关。\n要使上述结论成立，还需基于以下哪一前提：","options":{"A":"昌河的水质适合烧制瓷器，为景德镇的瓷器提供了丰富水源","B":"水运适合运输贵重物品，航行十分平稳，虽有摇晃，但无颠簸","C":"有人考证外国人把中国称为“China”，音译是“昌南”，即昌江之南的意思","D":"历史上，水路是中国贸易的重要渠道，瓷器大部分是通过水路运往全国乃至世界各地的"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：这（瓷器的辉煌在景德镇）与景德镇地处河流密布的水运区紧密相关。\n论据：景德镇是著名的瓷器之都，一条名为昌河的河流从景德镇北方流过。船通过昌河进入鄱阳湖再进入长江，最终入海把景德镇的瓷器行销世界。\n本题论点和论据都在讨论景德镇瓷器的辉煌与水运密切相关，二者话题一致，提问为“前提”，加强优先考虑必要条件。\n第二步：逐一分析选项。\nA项：昌河为景德镇烧制瓷器提供了合适、丰富的水源，说明昌河水作为“原材料”有助于烧制景德镇瓷器，而论点讨论的是景德镇瓷器的辉煌是否与水运密切相关，话题不一致，为无关项，无法加强，排除；\nB项：水运平稳的特点适合运输贵重物品，但并不清楚其中是否包含瓷器，为不明确项，无法加强，排除；\nC项：有人考证China是昌江之南的音译，而论点讨论的是景德镇瓷器的辉煌是否与水运密切相关，话题不一致，为无关项，无法加强，排除；\nD项：如果水路不是中国贸易的重要渠道，瓷器大部分不是通过水路运往全国乃至世界各地的，那么说明瓷器的贸易与水运关系不大，景德镇瓷器的辉煌就不可能与水运密切相关，论点无法成立，因此该项是论点成立的必要条件，可以加强，当选。\n故正确答案为D。","no":94,"missingImage":false},{"type":"question","qid":"13504516","cat":"类比推理","stem":"有研究发现，儿童受试者考夫曼简明智力测验得分下降与其居住地点黑碳浓度的提高有关。此外，在老年男性群体中，黑碳浓度水平升高1倍，其简易智力状态检查量表（MMSE）得分小于25的OR值为1.3，相当于衰老1.9年。由此，专家认为，黑碳暴露会导致神经系统损伤。\n以下哪项如果为真，最能削弱上述论证：","options":{"A":"相关研究所关注的儿童和老人群体本身血脑屏障较脆弱，易受黑碳暴露影响","B":"颗粒物可以通过嗅球，沿嗅觉神经元传输到大脑，对神经系统产生不良影响","C":"最新研究表明，黑碳因其特有的物化属性可能具有比细颗粒物更大的健康影响","D":"黑碳暴露与男孩在考夫曼简明智力测验中的反应时间延长和错误率增加有关，而在女孩中未观察到显著相关性"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：黑碳暴露会导致神经系统损伤。\n论据：有研究发现，儿童受试者考夫曼简明智力测验得分下降与其居住地点黑碳浓度的提高有关。此外，在老年男性群体中，黑碳浓度水平升高1倍，其简易智力状态检查量表（MMSE）得分小于25的OR值为1.3，相当于衰老1.9年。\n论据说的是“黑碳暴露与智力下降有关”，进而得出论点“黑碳暴露会导致神经系统损伤”，话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出论据中的儿童和老人群体的血脑屏障较为脆弱，易受黑碳暴露影响，解释了为什么这些人容易受到黑碳暴露的影响，具有加强作用，无法削弱，排除；\nB项：指出颗粒物可以通过嗅球，沿嗅觉神经元传输到大脑，对神经系统产生不良影响，黑碳属于颗粒物，解释了黑碳暴露会导致神经系统损伤的原因，属于加强项，无法削弱，排除；\nC项：指出黑碳因其特有的物化属性可能具有比细颗粒物更大的健康影响，但不知道是什么样的影响，不明确是否会导致神经系统损伤，无法削弱，排除；\nD项：指出黑碳暴露与男孩在考夫曼简明智力测验中的反应时间延长和错误率增加有关，而在女孩中未观察到显著相关性，补充女孩的反例，说明该结论不具有普遍性，削弱论点，当选。\n故正确答案为D。\n备注：以下为已查询到的原文，D项在原文中明确作为例证出现，供大家参考。\n\u003cimg data-k=\"522eff07c486\" style=\"max-width:643px\">","no":95,"missingImage":false},{"type":"question","qid":"13504503","cat":"逻辑判断","stem":"大蚕蛾具有其他昆虫无法比拟的巨大翅膀，长度可达28cm，是自然界中最为绚丽灿烂的昆虫之一。在自然界中，为了吸引异性，许多动物都拥有鲜艳美丽的外形，因此，科学家认为，大蚕蛾的“锦衣华服”是用于吸引异性，从而增加交配繁殖的几率。\n以下哪项如果为真，最能削弱上述结论：","options":{"A":"绝大部分种类的大蚕蛾生存繁衍于群山密林之中，昼伏夜出，无法看清同类的翅膀","B":"大蚕蛾翅膀的绚丽来自于鳞片的密集排布，能折射和衍射光线，从而让天敌分心或疑惑","C":"大蚕蛾头顶的触角是重要的感觉器官，主要起到嗅觉和触觉作用，可以通过触角进行信息交流","D":"大蚕蛾雌雄两性的色泽不同，雄性大体呈橘黄色，翅膀以杏黄色为主，雌性为青白色，翅膀以淡绿色为主"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：大蚕蛾的“锦衣华服”是用于吸引异性，从而增加交配繁殖的几率。\n论据：在自然界中，为了吸引异性，许多动物都拥有鲜艳美丽的外形。\n本题论点和论据均在讨论“外形”和“吸引异性”的关系，二者话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出绝大部分种类的大蚕蛾生存繁衍于群山密林，无法看清同类的翅膀，说明大蚕蛾无法依靠外形吸引异性，增加交配繁殖的几率，削弱论点，可以削弱，当选；\nB项：该项指出大蚕蛾翅膀绚丽的原因，绚丽的翅膀能让天敌分心或疑惑，但并未提及绚丽翅膀能否吸引异性，增加交配繁殖的几率，话题不一致，无法削弱，排除；\nC项：该项指出大蚕蛾头顶的触角能起到哪些作用，而论点讨论的是大蚕蛾的绚丽翅膀能否吸引异性，增加交配繁殖的几率，话题不一致，无法削弱，排除；\nD项：该项指出大蚕蛾雌雄两性的色泽区别，而论点讨论的是大蚕蛾的绚丽翅膀能否吸引异性，增加交配繁殖的几率，话题不一致，无法削弱，排除。\n故正确答案为A。","no":96,"missingImage":false},{"type":"question","qid":"13504512","cat":"类比推理","stem":"某研究指出，阻力训练可以帮助预防或延缓阿尔茨海默病（AD）。研究者给小鼠的尾部绑上拉力带，将其放置在一个倾斜的木板上并训练向上爬，训练四周后，小鼠的血液样本分析表明，参与阻力训练小鼠的大脑中很少出现\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积，皮质酮（相当于人类分泌的皮质醇）也处于正常水平。除此之外，阻力训练增加了小鼠大脑中小胶质细胞的数量，这种细胞在AD早期对大脑有重要保护作用，比如清除\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白的多肽和细胞碎片，减轻大脑局部炎症。\n以上论述如果为真，必须基于的前提是：","options":{"A":"皮质醇水平在AD早期阶段会呈现升高的趋势","B":"大脑中累积的\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白是导致罹患AD的元凶","C":"阻力训练会使小胶质细胞从促炎状态转变成抗炎症状态","D":"皮质醇会在压力过大时生成并使得个体容易焦虑和躁动"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：阻力训练可以帮助预防或延缓阿尔茨海默病。\n论据：研究者给小鼠的尾部绑上拉力带，将其放置在一个倾斜的木板上并训练向上爬，训练四周后，小鼠的血液样本分析表明，参与阻力训练小鼠的大脑中很少出现\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积，皮质酮（相当于人类分泌的皮质醇）也处于正常水平。除此之外，阻力训练增加了小鼠大脑中小胶质细胞的数量，这种细胞在AD早期对大脑有重要保护作用。\n本题论点讨论的是阻力训练可以帮助预防或延缓阿尔茨海默病（AD），论据讨论的是阻力训练可以减少\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积、使皮质醇处于正常水平；同时阻力训练也可以增加小胶质细胞的数量，从而保护早期AD患者的大脑。其中，论据中的“减少\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积、使皮质醇处于正常水平”与论点中的“帮助预防或延缓阿尔茨海默病（AD）”话题不一致，且提问方式为“前提”，优先考虑搭桥，即建立“减少\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积、使皮质醇处于正常水平”与“帮助预防或延缓阿尔茨海默病（AD）”的联系。\n第二步：逐一分析选项。\nA项：指出皮质醇水平在AD早期阶段会呈现升高的趋势，但不明确使皮质醇处于正常水平是否有助于预防或延缓阿尔茨海默病，为不明确项，无法加强，排除；\nB项：指出\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白积累会导致罹患AD，说明\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白是AD的病因，即减少\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白有助于预防罹患AD，在“减少\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积”与“帮助预防或延缓阿尔茨海默病”之间建立联系，为搭桥项，是论述成立的前提，当选；\nC项：指出阻力训练会使小胶质细胞从促炎状态转变成抗炎症状态，而减少炎症在AD早期对大脑有保护作用，解释了阻力训练有可能帮助预防或延缓阿尔茨海默病，补充论据，但并非论述成立的前提，排除；\nD项：指出皮质醇会在压力过大时生成并使得个体容易“焦虑和躁动”，与论点讨论的“阿尔茨海默病”无关，为无关项，无法加强，排除。\n故正确答案为B。","no":97,"missingImage":false},{"type":"question","qid":"13504447","cat":"逻辑判断","stem":"与人类的眼球是一整个球形不同，鸟类眼球是由一大一小的两个半球构成，小的半球是角膜，大的半球是视网膜，在角膜周围有一圈小骨片形成的一个环状的支撑性的脊，这个骨片环即巩膜环，保护眼球的同时也限制了眼球的转动，人类在走路时，通过眼球的转动抵消走路时的振动来保持视觉的稳定，而鸟类无法大幅度地转动眼球。因此，很多鸟类走路时，让头部先移至前方保持稳定，身体再前进。保持不动的头部像是向后缩了一样，于是就成了脖子一伸一缩的样子。\n由此可以推出：","options":{"A":"鸟类的眼球构造有助于形成更锐利的远视力","B":"鸟类走路时脖子的伸缩有助于维持身体的平衡","C":"鸟类通过颈部运动让眼睛成像保持更持久的稳定","D":"鸟类通过运动头部来获得视差以增强空间的深度感知"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干中第一句介绍了鸟类的眼球构造，但没有提及此眼球构造有助于形成更锐利的远视力，无中生有，排除；\nB项：题干中指出鸟类走路时脖子的伸缩有助于保持视觉的稳定，但没有提及有助于维持身体的平衡，无中生有，排除；\nC项：题干中指出鸟类无法大幅度地转动眼球来保持视觉的稳定。因此，鸟类走路时，让头部先移至前方保持稳定，身体再前进，出现脖子一伸一缩的样子，可以推出鸟类是通过颈部运动让眼睛成像保持更持久的稳定，当选；\nD项：题干中指出鸟类通过运动头部来保持视觉的稳定，但没有提及通过运动头部来获得视差以增强空间的深度感知，无中生有，排除。\n故正确答案为C。","no":98,"missingImage":false},{"type":"question","qid":"13504446","cat":"逻辑判断","stem":"某公园计划从桃树、李树、杨树、柳树、松树中选择几种树种植，树种的选择满足下列条件：\n（1）如果选桃树，那么不选松树； \n（2）要么选桃树，要么选李树；\n（3）至少选3种树种植；\n（4）桃树和杨树至多选1种；\n（5）李树和柳树至多选1种。\n由此可以推出：","options":{"A":"种李树和桃树，不种松树","B":"种桃树和柳树，不种杨树","C":"种李树和杨树，不种松树","D":"种杨树和松树，不种桃树"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）桃树\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">松树；\n（2）要么选桃树，要么选李树；\n（3）至少选3种树种植；\n（4）\u003cimg data-k=\"0be436194951\">桃树 或 \u003cimg data-k=\"0be436194951\">杨树；\n（5）\u003cimg data-k=\"0be436194951\">李树 或 \u003cimg data-k=\"0be436194951\">柳树。\n第二步：根据题干条件进行推理。\n题干条件中“桃树”提及次数最多，可优先从此处入手进行推理。\n若种桃树，结合条件（1）（2）（4）可得，不能种松树、李树和杨树，结合题干信息共有“桃树、李树、杨树、柳树、松树”这5种树，则此时只能种桃树和柳树这两种树，与条件（3）矛盾，故不能种桃树。\n不种桃树，结合条件（2）可得，要种植李树；结合条件（5）否一推一可得，不种柳树。结合题干信息共有“桃树、李树、杨树、柳树、松树”这5种树，根据上述结论“不种桃树”和“不种柳树”，结合条件（3）可得，种李树、杨树和松树，只有D项说法完全正确。\n故正确答案为D。","no":99,"missingImage":false},{"type":"question","qid":"13504432","cat":"类比推理","stem":"某市举办智能数控技能大赛，小周、小吴、小郑、小王、小钱进入了决赛。比赛后，有记者询问他们的感受，他们回答如下：\n小周：小郑整场发挥得都很好，我觉得冠军非他莫属；\n小吴：我觉得冠军一定会在我、小周、小钱三人之中产生；\n小郑：我自我感觉不好，这次与冠军无缘了；\n小钱：我连季军都拿不到；\n小王：我不会是亚军。\n已知本次比赛产生了冠军、亚军、季军各一人，且在五人中只有一个人的回答与比赛结果相符。那么，获得亚军的是：","options":{"A":"小王","B":"小吴","C":"小郑","D":"小钱"},"answer":"A","explanation":"第一步：找出题干矛盾命题。\n小周：小郑冠军；\n小吴：小吴冠军 或 小周冠军 或 小钱冠军；\n小郑：\u003cimg data-k=\"0be436194951\">小郑冠军；\n小钱：\u003cimg data-k=\"0be436194951\">小钱前三；\n小王：\u003cimg data-k=\"0be436194951\">小王亚军。\n分析题干条件可知，小周和小郑说的话为矛盾关系，必有一真一假。\n第二步：根据题干条件推理。\n根据题干条件可知，只有一个人的回答为真，则回答为真的人一定在小周和小郑之间，小吴、小钱和小王的回答均为假。小王说自己不是亚军为假，则小王是亚军，对应A项。\n故正确答案为A。","no":100,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"7f1ccb0f84aa\" style=\"max-width:700px\">\u003c/p>\u003cp>\u003cimg data-k=\"5fdc6e62fb40\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"13504461","cat":"平均数","stem":"2015-2022年期间，我国A股市场新上市公司平均每家首次募资金额最大的年份是：","options":{"A":"2018年","B":"2019年","C":"2021年","D":"2022年"},"answer":"D","explanation":"根据题干“2015-2022年期间······平均每家······”，结合材料时间为2015-2022年，可判定本题为现期平均数问题。定位统计图可得2015-2022年我国A股市场新上市公司数量与首次募资金额情况。根据新上市公司平均每家首次募资金额\u003cimg data-k=\"caeb92ae2fdb\">，可得下列年份我国A股市场新上市公司平均每家首次募资金额分别为：\n2018年，\u003cimg data-k=\"b2da368761d5\">亿元/家；\n2019年，\u003cimg data-k=\"bcdfa9f726f8\">亿元/家；\n2021年，\u003cimg data-k=\"11c345b7fbf0\">亿元/家；\n2022年，\u003cimg data-k=\"61b42dab970d\">亿元/家。\n比较可得，2022年我国A股市场新上市公司平均每家首次募资金额最大。\n故正确答案为D。","no":101,"missingImage":false},{"qid":"13504462","cat":"增长","stem":"2016-2022年期间，我国A股市场新上市公司的首次募资金额同比增长超过15%的年份有：","options":{"A":"3个","B":"4个","C":"5个","D":"6个"},"answer":"A","explanation":"根据题干“2016-2022年期间······同比增长超过15%的年份有”，可判定本题为一般增长率问题。定位统计图可知2015-2022年我国A股市场新上市公司的首次募资金额。根据公式：一般增长率\u003cimg data-k=\"7a919ee92a2e\">，则2016-2022年期间，我国A股市场新上市公司的首次募资金额同比增长率分别为：\n2016年，\ 90千克","C":"2023年纸及纸板产量超过100万吨的18个省（区、市）都不属于西部地区","D":"2023年全国2567家造纸及纸板生产企业的营业收入不超过利润总额的30倍"},"answer":"D","explanation":"A项：定位文字材料第一段可得：2023年，我国纸浆、纸及纸板和纸制品产量合计29139万吨，纸及纸板产量12965万吨。材料并未给出2023年全国纸浆或纸制品产量的相关数据，无法直接或间接计算2023年全国纸浆的产量，错误；\nB项：定位文字材料第二段可得：2023年，全国纸及纸板人均年消费量93.37千克，同比增长6.30%。根据公式：基期量\u003cimg data-k=\"4ec2c10dc29a\">，则2022年全国纸及纸板人均年消费量\u003cimg data-k=\"38a7bc906ee1\">千克，即人均年消费量低于90千克，错误；\nC项：定位文字材料第四段可得：2023年，我国西部地区12个省（区、市）占比为12.6%，我国有18个省（区、市）纸及纸板产量超过100万吨，产量合计12597万吨，占全国纸及纸板总产量的97.16%。97.16%+12.6%=109.76%&gt;100%，即纸及纸板产量超过100万吨的省（区、市）与我国西部地区12个省（区、市）之和超过整体，说明二者之间必然有交集，则2023年纸及纸板产量超过100万吨的18个省（区、市）一定有属于西部地区的，错误；\nD项：定位文字材料第三段可得：2023年，全国2567家造纸及纸板生产企业的营业收入8019亿元，利润总额269亿元。则所求倍数\u003cimg data-k=\"ecd39666f08c\">倍，即不超过利润总额的30倍，正确。\n故正确答案为D。","no":115,"missingImage":false}]},{"type":"material","material":"\u003cp>        2023年，我国数字经济规模持续扩大。数字经济核心产业增加值超过12万亿元，约占GDP的10%。电子信息制造业增加值同比增长3.4%；电信业务收入1.68万亿元；互联网业务收入1.75万亿元；软件业务收入12.33万亿元。以云计算、大数据、物联网等为代表的新兴业务中，云计算、大数据业务收入同比增长37.5%，物联网业务收入同比增长20.3%。高技术制造业、高技术服务业投资分别同比增长9.9%、11.4%。高技术制造业中，计算机、通信和其他电子设备制造业投资同比增长9.3%。\u003c/p>\u003cp>\u003cimg data-k=\"30b654c86674\" style=\"max-width:582px\">\u003c/p>\u003cp>\u003cimg data-k=\"bfd78551678d\" style=\"max-width:582px\">\u003c/p>","questions":[{"qid":"13504448","cat":"综合","stem":"2022年我国软件业务收入在以下哪个范围：","options":{"A":"10.7-10.9万亿元","B":"10.9-11.1万亿元","C":"11.1-11.3万亿元","D":"11.3-11.5万亿元"},"answer":"A","explanation":"根据题干“2022年······在以下哪个范围”，结合材料时间为2023年，可判定本题为基期计算问题。定位文字材料可得：2023年，我国软件业务收入12.33万亿元；定位统计表可得：2023年我国软件业务收入同比增速为13.40%。根据公式：基期量\u003cimg data-k=\"4ec2c10dc29a\">，则2022年我国软件业务收入\u003cimg data-k=\"a4265cb89d48\">万亿元，在A项范围内。\n故正确答案为A。","no":116,"missingImage":false},{"qid":"13504449","cat":"增长","stem":"2019-2023年，互联网业务收入同比增速高于电子信息制造业增加值同比增速的年份有：","options":{"A":"1个","B":"2个","C":"3个","D":"4个"},"answer":"D","explanation":"定位表格材料可得：2019-2023年，互联网业务收入同比增速分别为21.40%、12.50%、21.20%、-1.10%、6.80%；2019-2023年，电子信息制造业增加值同比增速分别为9.30%、7.70%、15.70%、7.60%、3.40%。则2019-2023年，互联网业务收入同比增速高于电子信息制造增加值同比增速的年份有2019年、2020年、2021年、2023年，共4个年份。\n故正确答案为D。","no":117,"missingImage":false},{"qid":"13504450","cat":"增长","stem":"按照2023年的同比增速，2025年互联网业务收入预计在以下哪个范围：","options":{"A":"1.6-1.8万亿元","B":"1.8-2.0万亿元","C":"2.0-2.2万亿元","D":"超过2.2万亿元"},"answer":"B","explanation":"根据题干“按照2023年的同比增速，2025年······在以下哪个范围”，可判定本题为现期计算问题。定位文字材料可得：2023年互联网业务收入1.75万亿元；定位表格材料可得：2023年我国互联网业务收入同比增速为6.80%。根据公式：现期量\u003cimg data-k=\"93a89bf94bde\">，可得2025年互联网业务收入\u003cimg data-k=\"8e0597770109\">\u003cimg data-k=\"e8d03a8d09e7\">\u003cimg data-k=\"16c2b0888d1b\">\u003cimg data-k=\"201062a0bfdc\">\u003cimg data-k=\"c86c9c6c6407\">，略小于1.9999，在B项范围内。\n故正确答案为B。","no":118,"missingImage":false},{"qid":"13504451","cat":"增长","stem":"2019-2023年数字经济指标的同比增速趋势与如下折线图相符的是：\n\u003cimg data-k=\"451485bf4867\" style=\"max-width:355px\">","options":{"A":"电子信息制造业增加值","B":"互联网业务收入","C":"软件业务收入","D":"全国固定资产投资"},"answer":"A","explanation":"定位统计表可得选项中各数字经济指标2019-2023年的同比增速。观察折线图可知，该数字经济指标同比增速在整体上呈现下降-上升-下降的趋势；2021年的同比增速最高，2023年的同比增速最低，且2020年和2022年同比增速接近。只有电子信息制造业增加值同比增速符合折线图所示。\n故正确答案为A。","no":119,"missingImage":false},{"qid":"13504452","cat":"综合","stem":"能够从上述资料中推出的是：","options":{"A":"2023年，高技术制造业投资低于高技术服务业投资","B":"2021-2023年新兴业务收入与电信业务收入的比值逐年上升","C":"2023年，电信业务收入与互联网业务收入之和高于软件业务收入","D":"2023年计算机、通信和其他电子设备制造业投资较2020年翻了一番"},"answer":"B","explanation":"A项：定位文字材料可得：2023年，高技术制造业、高技术服务业投资分别同比增长9.9%、11.4%，但无投资额具体数值，无法推出，错误；\nB项：定位柱状图可得：2021-2023年新兴业务收入分别为0.2372万亿元、0.3060万亿元、0.3564万亿元；电信业务收入分别为1.47万亿元、1.58万亿元、1.68万亿元。则2021-2023年新兴业务收入与电信业务收入的比值分别为：2021年，\u003cimg data-k=\"e3a2845c4c69\">；2022年，\u003cimg data-k=\"cc3ec8e48eb4\">；2023年，\u003cimg data-k=\"fad83e939be6\">。故2021-2023年新兴业务收入与电信业务收入的比值逐年上升，正确；\nC项：定位文字材料可得：2023年，电信业务收入1.68万亿元；互联网业务收入1.75万亿元；软件业务收入12.33万亿元。电信业务收入与互联网业务收入之和（1.68+1.75=3.43万亿元）&lt;软件业务收入（12.33万亿元），并非高于，错误；\nD项：定位表格材料可得：2021-2023年计算机、通信和其他电子设备制造业投资同比增速分别为22.30%、18.80%、9.30%。根据公式：现期量=基期量×（1+增长率），有2023年投资额=2020年投资额×（1+22.30%）（1+18.80%）（1+9.30%），则\u003cimg data-k=\"29871d702c82\">\u003cimg data-k=\"063629cd9983\">\u003cimg data-k=\"53a2414f0206\">，即不到2倍，并非翻一番，错误。\n故正确答案为B。","no":120,"missingImage":false}]}],"count":20,"answerable":20,"pointsOf":16}],"total":120,"affected":[],"subtitle":"2025年 · 重庆 · 6/6 模块"},{"slug":"2025-重庆-定向","title":"2025年重庆市定向选调优秀大学生到基层工作考试《行测》题","year":"2025","group":"重庆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"14096533","cat":"时事政治","stem":"党的二十届三中全会明确提出，进一步全面深化改革的总目标是继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。下列与之相关说法正确的是（    ）。\n①2029年——完成二十届三中全会决定提出的改革任务\n②2030年——基本实现国家治理体系和治理能力现代化\n③2035年——全面建成高水平社会主义市场经济体制\n④2049年——基本实现社会主义现代化","options":{"A":"①②","B":"①③","C":"②③","D":"②④"},"answer":"B","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议通过《中共中央关于进一步全面深化改革 推进中国式现代化的决定》（以下简称《决定》）。\n①正确，《决定》在“一、进一步全面深化改革、推进中国式现代化的重大意义和总体要求”中指出：“到二〇二九年中华人民共和国成立八十周年时，完成本决定提出的改革任务。”\n③正确，②④错误，《决定》在“一、进一步全面深化改革、推进中国式现代化的重大意义和总体要求”中指出：“进一步全面深化改革的总目标。继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。到二〇三五年，全面建成高水平社会主义市场经济体制，中国特色社会主义制度更加完善，基本实现国家治理体系和治理能力现代化，基本实现社会主义现代化，为到本世纪中叶全面建成社会主义现代化强国奠定坚实基础。”故②④均为到2035年的目标。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"14096532","cat":"时事政治","stem":"2024年6月28日，国家主席习近平在和平共处五项原则发表70周年纪念大会上的重要讲话中指出，和平共处五项原则是国际关系史上的伟大创举，具有划时代的重大意义。下列关于和平共处五项原则的历史意义，说法错误的是（    ）。","options":{"A":"和平共处五项原则为国际关系重塑树立了法治标杆","B":"和平共处五项原则为国际秩序改革和完善贡献了历史智慧","C":"和平共处五项原则为发展中国家团结合作、联合自强汇聚了强大合力","D":"和平共处五项原则为不同社会制度国家建立和发展关系提供了正确指导"},"answer":"A","explanation":"本题考查理论与政策。\n2024年6月28日，国家主席习近平在和平共处五项原则发表70周年纪念大会上发表《弘扬和平共处五项原则 携手构建人类命运共同体》的重要讲话（以下简称“讲话”）。\nA项错误，讲话指出：“和平共处五项原则为国际关系和国际法治树立了历史标杆。五项原则充分体现联合国宪章宗旨和原则，顺应国际关系发展的时代潮流，符合世界各国人民根本利益。同时，强调国与国关系相互、平等的实践要求，凸显了各国权利、义务、责任相统一的国际法治精神。”故“为国际关系重塑树立了法治标杆”表述有误，应为“为国际关系和国际法治树立了历史标杆”。\nB项正确，讲话指出：“和平共处五项原则为国际秩序改革和完善贡献了历史智慧。五项原则的出发点就是维护弱小国家在强权政治环境中的利益和诉求，旗帜鲜明反帝、反殖、反霸，摒弃了穷兵黩武、以强凌弱的丛林法则，为推动国际秩序朝着更加公正合理方向发展奠定了重要思想基础。”\nC项正确，讲话指出：“和平共处五项原则为发展中国家团结合作、联合自强汇聚了强大合力。五项原则凝结了发展中国家对改变自身命运、追求变革进步的深刻思考。在五项原则激励和鼓舞下，越来越多亚非拉国家相互声援和支持，奋起抵御外来干涉，成功走出独立自主的发展道路。五项原则还促进了南南合作，推动了南北关系改善和发展。”\nD项正确，讲话指出：“和平共处五项原则为不同社会制度国家建立和发展关系提供了正确指导。凡是遵循五项原则，即使社会制度和意识形态不同、历史文化和宗教信仰不同、发展水平和体量规模不同的国家，也完全可以建立和发展相互信任和友好合作的关系。”\n本题为选非题，故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"14096540","cat":"时事政治","stem":"2024年7月4日，国家主席习近平在“上海合作组织+”阿斯塔纳峰会上发表重要讲话，就牢固树立命运共同体意识，始终秉持“上海精神”，坚定不移走契合本国国情、符合本地区实际的发展道路，共同建设更加美好的上海合作组织家园，让各国人民安居、乐业、幸福，提出来相关建议。下列属于建议内容的有几项？（    ）\n①建设团结互信的共同家园\n②建设和平安宁的共同家园\n③建设繁荣发展的共同家园\n④建设公平正义的共同家园\n⑤建设睦邻友好的共同家园\n⑥建设独立自主的共同家园","options":{"A":"3项","B":"4项","C":"5项","D":"6项"},"answer":"C","explanation":"本题考查理论与政策。\n①②③④⑤正确，⑥错误，2024年7月4日，国家主席习近平在阿斯塔纳出席“上海合作组织+”阿斯塔纳峰会并发表题为《携手构建更加美好的上海合作组织家园》的重要讲话。习近平提出五点建议：第一，建设团结互信的共同家园；第二，建设和平安宁的共同家园；第三，建设繁荣发展的共同家园；第四，建设睦邻友好的共同家园；第五，建设公平正义的共同家园。\n综上，属于建议内容的是①②③④⑤，共5项。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"14096544","cat":"新思想","stem":"习近平总书记指出，发展新质生产力是推动高质量发展的内在要求和重要着力点。下列关于新质生产力的说法正确的是（    ）。\n①新质生产力是创新起主导作用\n②具有高科技、高效能、高速度的特征\n③以全要素生产率大幅提升为核心标志\n④以劳动者、劳动资料、劳动对象及其优化组合的跃升为基本内涵","options":{"A":"①②③","B":"①②④","C":"②③④","D":"①③④"},"answer":"D","explanation":"本题考查理论与政策。\n①③④正确，②错误，2024年1月31日，中共中央政治局就扎实推进高质量发展进行第十一次集体学习。习近平总书记强调，新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效能、高质量特征，符合新发展理念的先进生产力质态。它由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生，以劳动者、劳动资料、劳动对象及其优化组合的跃升为基本内涵，以全要素生产率大幅提升为核心标志，特点是创新，关键在质优，本质是先进生产力。故②中“高速度”表述错误，应为“高质量”。\n故正确答案为D。","no":4,"missingImage":false}],"count":4,"answerable":4,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"14096528","cat":"法律常识","stem":"党的二十届三中全会提出，高水平社会主义市场经济体制是中国式现代化的重要保障。关于高水平社会主义市场经济体制，下列说法正确的有几项？（    ）\n①创造更加公平、更有活力的市场环境，实现资源配置效率最优化和效益最大化\n②更好维护市场秩序、弥补市场失灵，畅通国民经济循环，激发全社会内生动力\n③保证各种所有制经济地位平等，依法平等使用生产要素、公平参与市场竞争\n④构建基础制度规则统一、监管公平统一、设施高标准联通的全国统一大市场","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议通过《中共中央关于进一步全面深化改革 推进中国式现代化的决定》（以下简称《决定》）。\n①②正确，《决定》在“二、构建高水平社会主义市场经济体制”中指出：“高水平社会主义市场经济体制是中国式现代化的重要保障。必须更好发挥市场机制作用，创造更加公平、更有活力的市场环境，实现资源配置效率最优化和效益最大化，既‘放得活’”又‘管得住’，更好维护市场秩序、弥补市场失灵，畅通国民经济循环，激发全社会内生动力和创新活力。”\n③错误，《决定》在“二、构建高水平社会主义市场经济体制”中指出：“（5）坚持和落实‘两个毫不动摇’。毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展，保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护，促进各种所有制经济优势互补、共同发展。”故“保证各种所有制经济地位平等”表述有误。\n④正确，《决定》在“二、构建高水平社会主义市场经济体制”中指出：“（6）构建全国统一大市场。推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。加强公平竞争审查刚性约束，强化反垄断和反不正当竞争，清理和废除妨碍全国统一市场和公平竞争的各种规定和做法。”\n综上，①②④正确，共3项。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"14096546","cat":"人文常识","stem":"耐心资本是一种专注于长期投资的资本形式，不以追求短期收益为首要目标，而更重视长期回报的项目或投资活动，通常不受市场短期波动干扰，是对资本回报有较长期限展望且对风险有较高承受力的资本。下列属于耐心资本的是（    ）。\n①定期存款\n②社保基金\n③企业年金\n④个人养老金","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查经济常识。\n①错误，定期存款是银行与存款人双方在存款时事先约定期限、利率，到期后支取本息的存款。虽然有较高的安全性，但其主要目的是为了获取固定的利息收入，并不具备长期投资的特性。\n②③④正确，从全球实践看，耐心资本主要来源于政府投资基金、养老基金（包括社保基金、企业年金、个人养老金）、保险资本以及具有长期投资理念的个人投资者等，是私募创投基金、公募基金等引入中长期资金的重要来源，能够为投资项目、资本市场提供长期稳定的资金支持，是科技创新和产业创新的关键要素保障，是发展新质生产力的重要条件和推动力。\n综上，②③④正确。\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"14096534","cat":"人文常识","stem":"诗句“女贞花白草迷离，江南梅雨时”所描述的天气现象的直接成因是（    ）。","options":{"A":"准静止锋","B":"亚洲高压","C":"热带气旋","D":"东北冷涡"},"answer":"A","explanation":"本题考查地理国情。\n“女贞花白草迷离，江南梅雨时”出自《阮郎归·女贞花白草迷离》，意思是女贞花白点缀在草地之中，星星点点，江南到了梅雨时节。“梅雨”在中国是长江中下游特有的天气现象。\nA项正确，“梅雨”是指每年5月中旬到7月上、中旬的初夏，中国长江中下游指宜昌以东的\u003cimg data-k=\"4752bbd91bde\">范围内或称江淮流域，至日本南部这狭长区域内出现的一段连阴雨天气。此时来自海洋的暖湿气流与北方残留的冷空气在江淮地区相遇。冷暖气流势力相当，无法快速推进或后退，形成相对静止的锋面，即“准静止锋”。暖湿气流沿锋面爬升，冷却凝结，持续产生降雨，形成梅雨天气。\nB项错误，亚洲高压又称西伯利亚高压或蒙古—西伯利亚高压，是多因素的共同作用而产生的在西伯利亚上空形成的大型半永久性高压区。多发生于秋分、冬至之间，冬季位于西伯利亚、蒙古地区的大范围高气压（反气旋）中心，是典型的大陆气团。亚洲高压会推动冷空气南下，导致我国大部分地区寒冷干燥，与夏季的梅雨无关。\nC项错误，热带气旋是生成于热带或副热带洋面上，具有有组织的对流和确定的气旋性环流的非锋面性的天气尺度涡旋的统称。热带气旋本质是低压系统，常见于西太平洋及其临近海域、大西洋和东北太平洋以及印度洋和南太平洋，会带来短时强风、暴雨，但梅雨是持续阴雨。\nD项错误，东北冷涡，是活动于我国东北地区或其附近的高空大型冷涡。它是能够维持3-4天或更长时间的深厚系统。东北冷涡是造成东北地区低温冷害、持续阴雨洪涝、冰雹和雷雨大风等突发性强对流天气的重要天气系统，对东北地区的天气气候有重大影响。与江南梅雨的区域和成因均不相关。\n故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"14096545","cat":"科技常识","stem":"下列成语中所包含的动物错误的是（    ）。","options":{"A":"“蛛丝马迹”中的“马”——灶马","B":"“爱屋及乌”中的“乌”——乌鸦","C":"“豺狼虎豹”中的“豺”——狐狸","D":"“狼奔豕突”中的“豕”——猪"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“蛛丝马迹”出自唐代杨筠松《龙经·武曲星》与清代王家贲《别雅序》，意思是通过蛛丝可寻蜘蛛所在、依灶马痕迹可查其去向，后比喻事情留下的隐约可循的痕迹或线索。这里的“马”并非指哺乳动物马，而是指名为“灶马”的昆虫（学名：突灶螽），常出现在厨房灶台附近。\nB项正确，“爱屋及乌”出自《尚书大传·大战》，意思是因为爱一个人而连带他屋上的乌鸦都一起爱。“乌”指乌鸦，雀形目鸦科鸦属鸟类的通称，中大型鸟类，体长一般在40-70厘米之间。\nC项错误，“豺狼虎豹”泛指危害人畜的各种猛兽，也比喻凶残的恶人。“豺”是真实存在的食肉动物，属于犬科豺属，外形似狼但体型更小、耳朵更圆，性情凶猛，常与狼、虎、豹并列作为凶猛野兽的代表。\nD项正确，“狼奔豕突”出自明末清初归庄《万古愁》，形容成群的坏人乱冲乱撞、肆意骚扰，亦可指敌人仓皇逃窜的状态。“豕”指猪。\n本题为选非题，故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"14096538","cat":"科技常识","stem":"体育运动场景中蕴含了大量的物理知识，下列说法正确的是（    ）。","options":{"A":"人在跑步时有惯性，停下来后惯性消失","B":"大力扣球时，手给球的力大于球给手的力","C":"举着杠铃稳定站立的过程中，人对杠铃做了功","D":"篮球撞击篮板后反弹回来说明了力能改变物体的运动状态"},"answer":"D","explanation":"本题考查科技常识。\nA项错误，物体保持静止状态或匀速直线运动状态的性质，称为惯性。惯性是物体的固有属性，只与物体的质量有关，与运动状态无关。人跑步时有惯性，停下来后质量不变，惯性依然存在。\nB项错误，手给球的力和球给手的力，是一对相互作用力。相互作用力是物理学中描述两个物体间相互作用的力，其基本特征为大小相等、方向相反且作用线重合，遵循同时产生与消失的规律，因此手给球的力和球给手的力大小相等。\nC项错误，物理学中“做功”的两个必要条件：一是作用在物体上的力，二是物体在力的方向上移动了距离。举着杠铃稳定站立时，杠铃受到向上的力，但没有在力的方向上移动距离，有力无距离，不满足做功条件。\nD项正确，物体的运动状态包括速度大小和运动方向，两者任一改变，都属于运动状态改变。篮球撞击篮板前向篮板运动，反弹后向相反方向运动，运动方向发生改变，说明篮板对篮球的力改变了篮球的运动状态。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"14096570","cat":"法律常识","stem":"2023年9月1日，《中华人民共和国无障碍环境建设法》开始正式施行。依据该法，下列说法错误的是（    ）。","options":{"A":"国家鼓励高等学校、中等职业学校等开设无障碍环境建设相关专业和课程","B":"各级人民政府及其有关部门应当为残疾人、老年人获取公共信息提供便利","C":"电视台应当在播出电视节目时配备同步字幕，每周至少播放一次配播手语的新闻节目","D":"停车场应当按照无障碍设施工程建设标准，设置无障碍停车位，并设置显著标志标识"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国无障碍环境建设法》第五十五条第二款规定：“国家鼓励高等学校、中等职业学校等开设无障碍环境建设相关专业和课程，开展无障碍环境建设理论研究、国际交流和实践活动。”\nB项正确，根据《中华人民共和国无障碍环境建设法》第二十九条规定：“各级人民政府及其有关部门应当为残疾人、老年人获取公共信息提供便利；发布涉及自然灾害、事故灾难、公共卫生事件、社会安全事件等突发事件信息时，条件具备的同步采取语音、大字、盲文、手语等无障碍信息交流方式。”\nC项错误，根据《中华人民共和国无障碍环境建设法》第三十条第一款规定：“利用财政资金设立的电视台应当在播出电视节目时配备同步字幕，条件具备的每天至少播放一次配播手语的新闻节目，并逐步扩大配播手语的节目范围。”本项中，电视节目配备同步字幕的前提是利用财政资金设立的电视台；配播手语的新闻节目应当是每天至少播放一次，而非每周。\nD项正确，根据《中华人民共和国无障碍环境建设法》第二十四条第一款规定：“停车场应当按照无障碍设施工程建设标准，设置无障碍停车位，并设置显著标志标识。”\n本题为选非题，故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"14096535","cat":"科技常识","stem":"转基因食品指的是利用转基因生物技术获得的转基因生物品系，并以该转基因生物为直接食品或为原料加工生产的食品。下列与之相关的说法正确的是（    ）。","options":{"A":"2018年，市场上第一个转基因食品出现在英国，是一种保鲜番茄","B":"转基因食品分为植物性转基因食品、动物性转基因食品、原生生物性转基因食品、微生物性转基因食品四类","C":"目前转基因食品对于人体健康是安全的，但将来是否会对人体健康带来负面影响一直存在争议，科学界至今未达成明确的共识","D":"《食品标识管理规定》中明确规定，生产经营转基因食品，食品标识上应显著标示“转基因”字样，否则需要标注“不含转基因”“非转基因”等字样"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，1994年，美国的转基因耐贮藏番茄——“FlavrSavr”获批上市，成为世界上首个被允许销售的转基因食品。该转基因番茄主要通过抑制细胞壁降解或抑制乙烯合成来实现。\nB项错误，转基因食品按原料来源可分为三类：植物源（如转基因大豆、玉米等），动物源（如转基因鱼类等）和微生物源（如转基因微生物发酵制得的奶酪、啤酒等）。该项中“原生生物性转基因食品”并非公认的分类类别，且极少用于食品生产，也未形成商业化的转基因食品品类。\nC项正确，2021年11月24日《中国纪检监察报》文章《转基因技术为保障粮食安全注入新动能——访中国工程院院士吴孔明、万建民》指出：“从国际上看，经济合作与发展组织、世界卫生组织和联合国粮食及农业组织在充分研究后得出结论，目前上市的转基因食品都是安全的。”故目前已商业化的转基因食品对人体健康是安全的。由于转基因技术应用时间较短（仅30余年），关于其长期食用对人体健康的潜在影响（如基因漂移、过敏原变化等），科学界尚未形成完全统一的结论，争议仍在持续。\nD项错误，根据《食品标识管理规定》第十六条第三项：“食品有以下情形之一的，应当在其标识上标注中文说明：（三）属于转基因食品或者含法定转基因原料的；”但“不含转基因”“非转基因”等字样属于反向标注，法规并未要求非转基因食品必须标注此类内容。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"14096543","cat":"人文常识","stem":"厄尔尼诺现象发生时，对我国产生的影响不包括（    ）。","options":{"A":"西北地区冬季平均气温比往年要低","B":"华北地区夏季高温日数达30天以上","C":"秋冬季南方降水量猛增，部分城市出现内涝","D":"黄淮部分地区夏秋连旱，影响粮食产量与质量"},"answer":"A","explanation":"本题考查地理国情。\n“厄尔尼诺现象”是指每隔数年在东太平洋地区出现的海水温度异常升高的现象。东南信风减弱，南北赤道暖流减弱、赤道逆流增强、离岸海水减少，就会造成太平洋东侧地区的冷水上泛减少或停止，甚至被暖流取代，从而形成大范围的海水温度异常增暖的现象。\nA项错误，西北地区位于我国北方，其冬季气温主要取决于冷空气南下的频率和强度。冷空气变弱、南下次数减少，西北地区不仅不会降温，反而会出现“暖冬”，冬季平均气温会比往年偏高，而非偏低。\nB项正确，夏季厄尔尼诺导致副热带高压偏南——华北地区位于副热带高压的北侧，会长期处于副热带高压外围下沉气流控制下，从而使得降水偏少、晴天增多，太阳辐射强，高温日数容易达到30天以上，符合实际影响。\nC项正确，厄尔尼诺秋冬季会让我国南方暖湿气流活跃，暖湿气流从海洋带来大量水汽，与北方南下的弱冷空气在南方交汇，降水量显著增加，部分城市因降雨集中、排水压力大，容易出现内涝，符合实际影响。\nD项正确，厄尔尼诺夏季会导致黄河流域降水偏少，若夏秋季节降水持续不足，易引发“夏秋连旱”，进而影响农作物生长，导致粮食产量和质量下降，符合实际影响。\n本题为选非题，故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"14096550","cat":"人文常识","stem":"下列情形中，劳动者可通过劳动行政部门维护自身合法权益的有几项?（    ）\n①甲企业无故拖欠员工小张工资、奖金等8000余元\n②乙公司要求所有员工遵循企业规定，按工作需求无偿加班\n③丙公司非法限制员工小赵人身自由，强迫其延长工作时间\n④员工小李与丁公司解除劳动合同后，丁公司未依照劳动法给予小李经济补偿","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查法律常识。\n①②④正确，根据《中华人民共和国劳动法》第九十一条第一、二、四项规定：“用人单位有下列侵害劳动者合法权益情形之一的，由劳动行政部门责令支付劳动者的工资报酬、经济补偿，并可以责令支付赔偿金：（一）克扣或者无故拖欠劳动者工资的；（二）拒不支付劳动者延长工作时间工资报酬的；（四）解除劳动合同后，未依照本法规定给予劳动者经济补偿的。”因此，①②④中的劳动者可通过劳动行政部门维护自身合法权益。\n③正确，根据《中华人民共和国劳动法》第三十二条第二项规定：“有下列情形之一的，劳动者可以随时通知用人单位解除劳动合同：（二）用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动的；”第九十条规定：“用人单位违反本法规定，延长劳动者工作时间的，由劳动行政部门给予警告，责令改正，并可以处以罚款。”因此，小赵可通过劳动行政部门维护自身合法权益。\n故①②③④表述正确，共4项。\n故正确答案为D。","no":13,"missingImage":false},{"type":"question","qid":"14096560","cat":"人文常识","stem":"周某单独投资成立润泽水果有限公司，决定不设股东会，也不设董事会，日常经营管理由其亲自负责，同时聘请了3名员工。因市场行情不好，润泽公司一直未能实现盈利，对外拖欠了大量债务。下列与之相关的说法错误的是（    ）。","options":{"A":"周某可以再单独投资设立一家蔬菜公司","B":"债权人可以直接要求周某清偿公司债务","C":"周某负有证明公司财产独立于自己财产的责任","D":"润泽公司可以单独投资设立一家子公司经营水果"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国公司法》第四十二条规定：“有限责任公司由一个以上五十个以下股东出资设立。”《中华人民共和国公司法》并无设立公司股东数量的限制，题中，周某可以再单独投资设立一家蔬菜公司。\nB项错误，根据《中华人民共和国公司法》第三条第一款规定：“公司是企业法人，有独立的法人财产，享有法人财产权。公司以其全部财产对公司的债务承担责任。”题中，润泽水果有限公司以其公司财产承担债务，债权人不得直接要求周某清偿公司债务。\nC项正确，根据《中华人民共和国公司法》第二十三条第三款规定：“只有一个股东的公司，股东不能证明公司财产独立于股东自己的财产的，应当对公司债务承担连带责任。”题中，周某作为一人股东，负有证明公司财产独立于自己财产的责任。\nD项正确，根据《中华人民共和国公司法》第十三条第一款规定：“公司可以设立子公司。子公司具有法人资格，依法独立承担民事责任。”\n本题为选非题，故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"14096548","cat":"经济常识","stem":"田某是一家有限责任公司的股东，在公司设立时以机器设备出资，评估作价80万元，同时以一套房产出资，评估作价420万元。公司成立后第二年，因扩大经营规模的需要，吸收陆某以货币出资200万元入股。第三年年底资产盘查时，公司发现田某作价出资的机器设备在当时实际只值50万元，出资房产因为近两年房地产市场不景气已贬值为360万元。下列与之相关说法正确的是（    ）。","options":{"A":"田某应对机器设备的差额30万元承担补足责任","B":"田某应对房产贬值的差额60万元承担补足责任","C":"陆某应对机器设备的差额30万元承担连带责任","D":"陆某应对房产贬值的差额60万元承担连带责任"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，B、C、D三项错误，根据《中华人民共和国公司法》第五十条规定：“有限责任公司设立时，股东未按照公司章程规定实际缴纳出资，或者实际出资的非货币财产的实际价额显著低于所认缴的出资额的，设立时的其他股东与该股东在出资不足的范围内承担连带责任。”田某在公司设立时以机器设备出资，评估作价80万元，机器设备在当时实际只值50万元，田某应对机器设备的差额30万元承担补足责任，陆某在公司设立时还不是股东，因此，无需对机器设备的差额30万元承担连带责任。田某在公司设立时以房产出资，评估作价420万元，房屋贬值的情形，不属于田某、陆某应对房产贬值的差额60万元承担补足责任的情形。\n故正确答案为A。","no":15,"missingImage":false}],"count":11,"answerable":11,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"18649875","cat":"逻辑填空","stem":"人工智能是引领未来的新兴战略技术之一，气候变化是当今世界面临的最紧迫挑战之一。人工智能革命和绿色能源革命            ，已成为大国竞争必须抢占的科技制高点。我们既期盼更绿色环保的人工智能，也期盼更智能可控的绿色能源，就像期盼盛夏不再酷热难耐。\n填入画横线部分最恰当的一项是（    ）。","options":{"A":"相得益彰","B":"齐头并进","C":"缺一不可","D":"殊途同归"},"answer":"B","explanation":"根据“我们既期盼更绿色环保的人工智能，也期盼更智能可控的绿色能源”可知，横线处应体现人工智能革命和绿色能源革命不分先后，同时进行之意，B项“齐头并进”指不分先后地一齐前进或同时进行，符合文意，当选。A项“相得益彰”指相互配合得好，各方的长处就更能显现，文段并非强调二者配合会有更好的效果，而是强调二者不分先后，同时进行，与文意不符，排除；C项“缺一不可”指两种因素或多种因素中，缺少哪一个也不行，无法体现不分先后，同时进行之意，与文意不符，排除；D项“殊途同归”比喻采用不同方法最终达成相同结果，文段并未体现达到相同效果之意，与文意不符，排除。\n故正确答案为B。\n【文段出处】经济日报《人工智能如何应对气候变化》","no":16,"missingImage":false},{"type":"question","qid":"18649890","cat":"逻辑填空","stem":"如何引导帮助老人更健康地在短视频平台“冲浪”，需要各方努力。有关部门要做好科普宣传，有针对性地指导老人辨别网络骗局、保护个人隐私，增强安全意识。子女也要尽力给予父母更多陪伴，多回家看看，还可帮助他们给手机设置健康模式，从而更好地            ，健康“冲浪”。\n填入画横线部分最恰当的一项是（    ）。","options":{"A":"化险为夷","B":"趋利避害","C":"防微杜渐","D":"未雨绸缪"},"answer":"B","explanation":"根据“更健康地在短视频平台‘冲浪’”“有针对性地指导老人辨别网络骗局、保护个人隐私，增强安全意识”“帮助他们给手机设置健康模式”以及后文“健康‘冲浪’”可知，横线处需要体现出在帮助老人规避网络骗局等安全隐患的同时，也能让他们正常享受短视频平台带来的正面价值。B项“趋利避害”意为趋向有利的一面，避开有害的一面，“趋利”对应享受平台带来的乐趣与便利，“避害”对应前文提及的防范骗局、保护隐私等安全措施，符合文意，当选。\nA项“化险为夷”指使危险的情况或处境变为平安，文段并未涉及老人身处危险之中的语境，与文意不符，排除；\nC项“防微杜渐”指在错误、或坏事刚露出苗头的时候就加以制止，不使其发展，其重点在于对问题苗头的警惕与阻断，但无法涵盖让老人享受短视频好处这层含义，与文意不符，排除；\nD项“未雨绸缪”比喻事先做好准备工作，强调提前做准备，仅体现提前预防之意，未能对应后文让老人享受短视频平台好处的内容，与文意不符，排除。\n故正确答案为B。\n【文段出处】人民政协网《农村老人刷短视频怎样开启“健康模式”？》","no":17,"missingImage":false},{"type":"question","qid":"18649895","cat":"逻辑填空","stem":"即便专注于        的科研之路，也能凭借“有趣的灵魂”让旁人为之瞩目。石教授在《中国化学》期刊封面上把自己P成了补天的女娲，这一创意正是来自其科研设计对轴手性大家族骨架空缺的弥补。在科研这片看似高冷的天空里，用一块            的石头补上了略显空缺的一隅，让学术得以“破圈”。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"理性 巧夺天工","B":"严谨 五彩斑斓","C":"严肃 妙趣横生","D":"枯燥 惟妙惟肖"},"answer":"C","explanation":"本题可从第二空入手，根据“在科研这片看似高冷的天空里，用一块······的石头补上了略显空缺的一隅”及前文“凭借‘有趣的灵魂’让旁人为之瞩目”可知，横线处应体现石教授的创意有趣、生动之意。C项“妙趣横生”指充满了美妙的情趣、意味，符合文意，保留。A项“巧夺天工”指精巧的人工胜过天然，形容技艺极其精巧，B项“五彩斑斓”表示颜色非常好看，色彩相当丰富，D项“惟妙惟肖”指描写或模仿得非常好，非常逼真，但文段侧重创意有趣，均与文意不符，排除。\n第一空，代入验证。根据“即便······也······”可知，横线处应与“有趣”语义相反，C项“严肃”形容严格认真，与“有趣”语义相反，符合文意，当选。\n故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"18649916","cat":"逻辑填空","stem":"天赋基因决定论并不符合人才培养的内在规律。孩子能否成才，关键是要看后天的兴趣与努力。家长与其        天赋基因检测结论，将孩子的未来寄托在不靠谱的“电子算命”上，不如重视孩子自身的兴趣，切实发挥后天培养的作用。只有在学习和生活中逐渐发现孩子的兴趣和特长，            ，鼓励培养，每个孩子才能获得属于自己的成功。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"困惑 顺水推舟","B":"执着 因材施教","C":"纠结 听之任之","D":"迷信 因势利导"},"answer":"D","explanation":"第一空，根据“将孩子的未来寄托在不靠谱的‘电子算命’上”可知，横线处应体现过度信赖之意，且感情色彩偏消极。D项“迷信”泛指盲目地信仰崇拜，感情色彩偏消极，符合文意，且与“电子算命”相呼应，保留。A项“困惑”指感到疑难，不知道该怎么办，C项“纠结”指互相缠绕，均无法体现出过度信赖之意，与文意不符，排除；B项“执着”指固执或拘泥，若置于文段，应添加介词“于”，表述为“执着于天赋基因检测结论”，置于此处用法错误，且无法体现出过度信赖之意，排除。\n第二空，代入验证。根据“发现孩子的兴趣和特长”可知，横线处应体现顺应孩子自身特点加以培养之意，D项“因势利导”指顺着事情的发展趋势加以引导，符合文意，当选。\n故正确答案为D。\n【文段出处】北京青年报《天赋基因检测绝非人才培养捷径》","no":19,"missingImage":false},{"type":"question","qid":"18649894","cat":"逻辑填空","stem":"前进道路上，有人循光而行，有人成为光。各行各业的正能量故事不断涌现，这些榜样            ，笃定前行，以热血和奋斗点亮微光，用自己的方式承担着时代        的责任。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"踔厉奋发 赋予","B":"踵事增华 交托","C":"责无旁贷 托付","D":"义不容辞 给与"},"answer":"A","explanation":"本题可从第二空入手，搭配“时代”“责任”，且根据文意可知，横线处应体现时代将责任交给他人承担之意，A项“赋予”指交给（重大任务、使命等），D项“给与”同“给予”，表达给的意思，均与“时代”“责任”搭配恰当，保留。B项“交托”指交付委托，C项“托付”指委托别人照料或办理，均多与“人”搭配，与“时代”搭配不当，排除。\n第一空，修饰“榜样”，且根据“笃定前行，以热血和奋斗点亮微光”可知，横线处应体现榜样积极行动、热血奋斗的状态，A项“踔厉奋发”形容精神振奋，意气昂扬，符合文意，当选。D项“义不容辞”指道义上不容许推辞、拒绝，常用于形容为了正义事业，敢于挺身而出，不作推辞，无法体现热血奋斗的状态，且后文体现了“承担着责任”，置于此处与后文语义重复，排除。\n故正确答案为A。\n【文段出处】《中新网评：循光而行 看见榜样背后的正能量》","no":20,"missingImage":false},{"type":"question","qid":"18649906","cat":"逻辑填空","stem":"“社会比较”理论认为，人们会为了        自己在社会中的地位、能力和观点等社会特征，而与他人或群体进行比较。通常来说，平行比较有助于形成更为真实和客观的自我认知；下行比较可以提高一个人的自尊心和满足感，让人感到相对        ；上行比较则是一把双刃剑，可能会引发自我        和挫折感，也可能会促使个体努力提升自己。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"评估 优越 贬低","B":"评价 优秀 排斥","C":"品评 优胜 否定","D":"评论 优良 怀疑"},"answer":"A","explanation":"第一空，搭配“地位”“能力”和“观点”，A项“评估”指评议估计，评价，B项“评价”指评定价值高低，与“地位”“能力”“观点”搭配恰当，保留。C项“品评”指评论高下、优劣，强调评论一件东西或事物的好坏，常与“墨宝”“口感”搭配，与“地位”搭配不当，排除；D项“评论”指批评或议论，不符合文意，排除。\n第二空，根据前文“提高一个人的自尊心和满足感”可知，横线处表达下行比较让人感觉自己胜过别人，A项“优越”指优胜，优良，B项“优秀”指非常好，均符合文意，保留。\n第三空，根据“和”可知，横线处应与“挫败感”并列，体现出上行比较可能会让人产生一种自己不好、很失败的自卑感，A项“贬低”指故意对人或事物给与较低的评价，可体现出自卑，符合文意，当选。B项“排斥”指使别的人或事物离开自己这方面，程度过重，排除。\n故正确答案为A。\n【文段出处】科普中国《别再刷短视频了，真的会越刷越抑郁！》","no":21,"missingImage":false},{"type":"question","qid":"18649898","cat":"逻辑填空","stem":"人力筛选海量简历十分费时且          大，不同面试官的标准与意见难以统一，导致评价缺乏          ，而AI工具可以用于概括简历要点、          提取信息，以提升简历筛选的成效。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"随机性 稳定性 针对性","B":"随意性 专业性 选择性","C":"偶然性 客观性 统一化","D":"主观性 公平性 规模化"},"answer":"A","explanation":"第一空，根据“不同面试官的标准与意见难以统一”可知，横线处需体现出人力筛选简历这件事存在很多变量，A项“随机性”、C项“偶然性”、D项“主观性”均可体现，保留。B项“随意性”侧重态度不认真，与文段感情色彩不符，排除。\n第二空，根据“不同面试官的标准与意见难以统一”以及横线前“缺乏”可知，横线处需体现出评价不会变来变去之意，A项“稳定性”可以体现，保留。C项“客观性”、D项“公平性”均无法体现，且文段侧重强调不同面试官的标准与意见难以统一，而非面试官的评价不够客观、公正，排除。\n第三空，代入验证，A项“针对性”置于此处与“概括简历要点”构成并列结构共同体现可以提升简历筛选的成效，符合文意，当选。\n故正确答案为A。\n【文段出处】新华网《“五一”微观察：AI在职场中的这些应用你了解吗？》","no":22,"missingImage":false},{"type":"question","qid":"18649905","cat":"逻辑填空","stem":"今年越来越多骑行爱好者已经从去年的城市骑行，慢慢        为相对专业的公路骑行。从公路骑行所需的公路车整车成交量来看，市场呈现消费        趋势，万元以上高档整车的市场份额        了一倍以上。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"进阶 升级 扩张","B":"转化 上升 增长","C":"进化 换代 扩大","D":"转变 上涨 增加"},"answer":"A","explanation":"第一空，根据“从去年的城市骑行，慢慢······为相对专业的公路骑行”可知，横线处所填词语应体现骑行爱好者骑行方式从相对简单的城市骑行向更具专业性的公路骑行提升转变之意。A项“进阶”指层次或等级提高，C项“进化”指事物由简单到复杂，由低级到高级逐渐发展变化，均符合文意，保留。B项“转化”指变易，改变，D项“转变”指改变，改换，均未能体现向更高层次提升之意，排除。\n第二空，搭配“消费”，A项“升级”指从较低的等级或班级升到较高的等级或班级，与“消费”搭配恰当，保留。C项“换代”指产品在结构、性能等方面比原来的有明显的改进和发展，或指旧的朝代为新的朝代所代替，与“消费”搭配不当，排除。\n第三空，代入验证，A项“扩张”指扩大范围、势力等，置于此处可表示随着市场消费升级，万元以上高档整车在整个市场中所占的份额增长，就如同扩大了势力范围，符合文意，当选。\n故正确答案为A。\n【文段出处】新华网《春日消费正当时，这组数据活力四射！》","no":23,"missingImage":false},{"type":"question","qid":"18649903","cat":"逻辑填空","stem":"没有新漆，没有新瓦，没有被现代审美        过，山西古建筑有时显得过于        。区区一处木头搭建的藻井，古人绘以丹青，饰以琉璃，就呈现出一片璀璨宇宙。千百年后，这些低调的古建筑会冷不丁释放一种审美暴击，让不经意间抬头的游人            。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"侵蚀 拘谨  过目难忘","B":"改造 朴素  心悦诚服","C":"粉饰 陈旧\t 心旷神怡","D":"同化 保守  耳目一新"},"answer":"B","explanation":"第一空，根据“没有新漆，没有新瓦”可知，横线处应体现山西古建筑没有被现代审美改变之意。B项“改造”指原有的事物加以修改或变更，使适合需要，D项“同化”指不相同的事物逐渐变得相近或相同，均符合文意，保留。A项“侵蚀”指逐渐侵害使变坏，侧重于侵害，与文意不符，排除；C项“粉饰”指涂饰表面，掩盖污点或缺点，与文意不符，排除。\n第二空，根据前文“没有新漆，没有新瓦”可知，横线处应体现山西古建筑看起来比较简单、质朴之意。B项“朴素”指朴实，不浮夸，不虚假，符合文意，保留。D项“保守”指维持原状，不求改进，与文意不符，排除。\n第三空，代入验证。B项“心悦诚服”指发自内心的高兴，真心实意地服从或佩服，可体现出游人被古建筑的审美暴击所折服之意，符合文意，当选。\n故正确答案为B。\n【文段出处】新周刊《去一次山西，我被中式审美暴击了》","no":24,"missingImage":false},{"type":"question","qid":"18649913","cat":"逻辑填空","stem":"艺术生活化、生活艺术化对青年群体来说不再只是一个口号，当他们            来获取审美体验和文化记忆时，传统文化不再是高高在上、            ，而是可以触碰，可以体验，可以参与，这比任何        和说教都更有效果，更有意义。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"身体力行 遥不可及 灌输","B":"亲力亲为 望尘莫及 宣传","C":"身临其境 不可向迩 推行","D":"笃志力行 曲高和寡 倡导"},"answer":"A","explanation":"第一空，形容青年群体获取审美体验和文化记忆的方式。根据前文“不再只是一个口号”可知，横线处应体现青年将艺术生活化、生活艺术化变为现实，通过实际行动参与其中。A项“身体力行”意为亲身体验，B项“亲力亲为”强调亲自做事，均符合语境，保留。C项“身临其境”指亲自到达某种境地获得切身感受，侧重真实、生动的感受，D项“笃志力行”意为坚定信念，努力实践，侧重志向坚定，均与文意不符，排除。\n第二空，顿号表示近义并列，“高高在上”形容领导者脱离实际，横线处应表示传统文化不再是难以触碰的。A项“遥不可及”指非常遥远而不可到达，形容难以企及的事物或目标，符合语境，保留。B项“望尘莫及”形容望着远去的人马行走时扬起的阵阵尘土，却不能追上他们，比喻远远地落在了别人的后面，相差甚远，无法追上，一般用于比较的语境中，与文意不符，排除。\n第三空，代入验证。A项“灌输”与“说教”并列，感情色彩均消极，侧重强调一种强制的教育方式，符合语境，当选。\n故正确答案为A。\n【文段出处】经济参考报《文化消费新偏好折射青年一代文化自信》","no":25,"missingImage":false},{"type":"question","qid":"18649900","cat":"片段阅读","stem":"推动资源循环利用和减少环境污染是以旧换新政策的重要目标，通过回收旧的消费品，更好推动经济循环和绿色发展。完善便利的回收体系，是推动消费品以旧换新的重要环节。必须加快建立便捷高效、覆盖广泛、操作便利的消费品回收体系，更好释放消费市场以旧换新的潜力和动力。此外，政府部门还应进一步加强对以旧换新市场的监督和管理，对回收的旧产品进行严格的质量检测和处理。\n这段文字意在强调（    ）。","options":{"A":"以旧换新政策将进一步推动消费的持续增长","B":"推动消费品以旧换新要在“旧”字上做文章","C":"完善的回收体系是推动绿色发展的重要环节","D":"以旧换新行动重在不断创造更多消费新需求"},"answer":"B","explanation":"文段开篇指出通过回收旧的消费品，更好推动经济循环和绿色发展，接着指出完善便利的回收体系是推动消费品以旧换新的重要环节，后文通过并列关联词“此外”引导两方面的对策，强调既要建立消费品回收体系，又要对回收的旧产品进行严格的质量检测和处理，故文段重点强调推动消费品以旧换新需要在完善消费品回收体系和对回收的旧产品进行严格的质量检测和处理等“旧”的方面下功夫，对应B项。\nA项“将进一步推动消费的持续增长”、D项“创造更多消费新需求”文段均未提及，无中生有，排除；\nC项，“完善的回收体系”仅对应并列的一方面内容，表述片面，排除。\n故正确答案为B。\n【文段出处】临泽县人民政府《以旧换新 诠释消费新活力》","no":26,"missingImage":false},{"type":"question","qid":"18649908","cat":"片段阅读","stem":"购买盲盒前，个体无法知道其具体款式，这一信息缺口能激发消费者的好奇心。同时，由于产品的非确定性，消费者们常对其展开联合推测并互相分享、推荐。因此享乐型购买动机和幸运感知水平高的个体更易对非确定性产品产生好奇，并参与购买。高社会支持的消费者个人对不确定性的包容度更高，人们更愿意购买非确定性产品；享乐型产品、适度暴露信息的产品更能够通过提升消费者积极情绪体验，进而促进其购买、分享非确定性产品。\n根据这段文字，影响非确定性产品购买决策的因素不包括（    ）。","options":{"A":"产品的类型","B":"社会的支持度","C":"消费者的个体差异","D":"信息暴露的可信度"},"answer":"D","explanation":"A项，根据“享乐型产品、适度暴露信息的产品更能够通过提升消费者积极情绪体验，进而促进其购买、分享非确定性产品”可知，“享乐型产品”属于产品类型的划分，故该项是影响非确定性产品购买决策的因素，排除；\nB项，根据“高社会支持的消费者个人对不确定性的包容度更高，人们更愿意购买非确定性产品”可知，社会的支持度与购买意愿直接相关，该项是影响非确定性产品购买决策的因素，排除；\nC项，根据“享乐型购买动机和幸运感知水平高的个体更易对非确定性产品产生好奇，并参与购买”可知，不同个体在“购买动机”“幸运感知”上的差异，属于消费者个体差异，该项是影响非确定性产品购买决策的因素，排除；\nD项，根据“享乐型产品、适度暴露信息的产品更能够通过提升消费者积极情绪体验，进而促进其购买、分享非确定性产品”可知，适度暴露信息的产品更能促使人们购买非确定性产品，而非“信息暴露”是否具备可信度，该项并非影响非确定性产品购买决策的因素，当选。\n本题为选非题，故正确答案为D。\n【文段出处】知乎网《揭开神秘盲盒的面纱：非确定性产品如何掏空你的钱包》","no":27,"missingImage":false},{"type":"question","qid":"18649899","cat":"片段阅读","stem":"玉器是一个人群宇宙观、世界观的体现，是文明进程与社会复杂化的见证。新石器时代玉器玉文化发展的两次高峰，一次见证了古国的形成与发展，另一次孕育了王国的形成，两次玉文化发展高峰构成了玉器时代的主要内容。尤其是第二次高峰阶段的发展，统一了中华文化圈内玉文化的整体面貌，整合了玉器制作工艺技术，接纳了各类玉器所蕴含的深刻意义，奠定了中国玉器玉文化的发展趋势。从此以后，无论新增什么样的器类、纹样如何变化，无论玉文化的因素如何多元，从玉文化的整体面貌上看，中华文化圈都展现出统一性、一致性的特点。\n根据这段文字，下列说法正确的是（    ）。","options":{"A":"制作工艺的整合奠定了中国玉器的发展趋势","B":"中国玉文化在历史上经历了两次高峰阶段","C":"中国玉器的纹样与种类具有统一性特质","D":"玉器是文化与社会发展的见证"},"answer":"D","explanation":"A项，根据“尤其是第二次高峰阶段的发展，统一了中华文化圈内玉文化的整体面貌，整合了玉器制作工艺技术，接纳了各类玉器所蕴含的深刻意义，奠定了中国玉器玉文化的发展趋势”可知，“制作工艺的整合”与“奠定了中国玉器的发展趋势”是并列关系，偷换逻辑，排除；\nB项，根据“新石器时代玉器玉文化发展的两次高峰······两次玉文化发展高峰构成了玉器时代的主要内容”可知，新石器时代玉器玉文的发展经历了两次高峰，“中国玉文化”偷换概念，排除；\nC项，根据“从此以后，无论新增什么样的器类、纹样如何变化，无论玉文化的因素如何多元，从玉文化的整体面貌上看，中华文化圈都展现出统一性、一致性的特点”可知，从玉文化的整体面貌上看，中华文化圈都展现出统一性特质，并非玉器的纹样与种类具有统一性，偷换概念，排除；\nD项，根据“玉器是一个人群宇宙观、世界观的体现，是文明进程与社会复杂化的见证······一次见证了古国的形成与发展，另一次孕育了王国的形成，两次玉文化发展高峰构成了玉器时代的主要内容”可知，玉器可以见证文化和社会发展，表述正确，当选。\n故正确答案为D。","no":28,"missingImage":false},{"type":"question","qid":"18649904","cat":"片段阅读","stem":"山峰的重心一般在山体的中间部位，山峰越高，其重心就越高，累加在山峰上的重力也就越大。要想减轻重力对自身的压迫，就得增加山峰的底座面积，这就和建造高楼大厦是一个道理，楼越高，需要的地基面积就必须越大、越深厚。但作为大自然造物，早已被设定好底座面积的珠穆朗玛峰（简称“珠峰”），则显然不行。喜马拉雅山全长2450千米，宽200~350千米，这样的地基面积不足以支撑起万米高峰，所以超过1万米的珠峰的最终结局必然是被自身重力压垮。\n这段文字意在说明：","options":{"A":"喜马拉雅山的底座面积过小","B":"珠峰不会超过1万米的原因","C":"山峰高度受到重心的影响","D":"建造高楼要考虑地基面积"},"answer":"B","explanation":"文段开篇指出山峰重心与高度、底座面积的关系，即山峰越高重心越高，需更大底座面积支撑，并通过高楼与地基的关系进行解释。接着通过转折词“但”强调珠穆朗玛峰作为大自然造物，底座面积（喜马拉雅山的底座面积）已被设定好，不足以支撑万米高峰，最后通过“所以”得出结论：超过1万米的珠峰最终会被自身重力压垮。故文段重点解释了珠峰高度存在上限，无法超过1万米的原因，对应B项。\nA项，仅提及“喜马拉雅山的底座面积过小”，这是解释珠峰不会超过1万米原因的部分内容，表述片面，且未提及主题词“珠峰”，排除；\nC项，“山峰高度受到重心的影响”是对山峰一般原理的阐述，属于解释说明部分，非重点，且未提及主题词“珠峰”，排除；\nD项，“建造高楼要考虑地基面积”是为了类比说明山峰的情况，非重点，且未提及主题词“珠峰”，排除。\n故正确答案为B。\n【文段出处】光明日报《珠峰会不会超过1万米》","no":29,"missingImage":false},{"type":"question","qid":"18649909","cat":"片段阅读","stem":"盛唐之前，线条和色彩是绘画的主要造型手段，如顾恺之《女史箴图》《洛神赋图》等，墨只是作为黑色颜料，借用笔来勾勒对象的外形轮廓，处于附庸地位。唐代画家吴道子独创“兰叶描”画法，表现人物画中衣纹的曲折向背，开笔法向墨法转化之先。“兰叶描”的特点在于运笔中时提时顿，压力不均，从而在一根线条中产生忽粗忽细的效果，这与顾恺之“高古游丝描”细而均匀的用笔方式截然不同，可以看作“墨法”运用之萌芽。张彦远《历代名画记》称赞其“运墨而五色具”，可谓水墨登上绘画艺术舞台的宣言，墨法由此获得承认，笔法也因墨的广泛使用而愈加丰富。\n从这段文字无法推知（    ）。","options":{"A":"同时代人对吴道子的评价","B":"盛唐之际绘画艺术的突破","C":"《女史箴图》中的衣纹特点","D":"“兰叶描”画法的创新过程"},"answer":"C","explanation":"A项，根据“张彦远《历代名画记》称赞其‘运墨而五色具’”可知，“同时代人对吴道子的评价”可以推知，排除；\nB项，根据“盛唐之前，线条和色彩是绘画的主要造型手段······墨只是作为黑色颜料，借用笔来勾勒对象的外形轮廓，处于附庸地位。唐代画家吴道子独创‘兰叶描’画法，表现人物画中衣纹的曲折向背，开笔法向墨法转化之先。······墨法由此获得承认，笔法也因墨的广泛使用而愈加丰富”可知，“盛唐之际绘画艺术的突破”可以推知，排除；\nC项，文段仅提及顾恺之使用“高古游丝描”且线条“细而均匀”，但并未具体描述《女史箴图》中的衣纹特点，故“《女史箴图》中的衣纹特点”无法推知，当选；\nD项，根据“吴道子独创‘兰叶描’画法······开笔法向墨法转化之先。‘兰叶描’的特点在于运笔中时提时顿，压力不均······墨法由此获得承认，笔法也因墨的广泛使用而愈加丰富”可知，“‘兰叶描’画法的创新过程”可以推知，排除。\n本题为选非题，故正确答案为C。","no":30,"missingImage":false},{"type":"question","qid":"18649915","cat":"片段阅读","stem":"“显眼包”的行为特点符合心理学上所谓的“出丑效应”。这种效应指出，精明的人无意中犯点小错误，反而更使人觉得他具有和别人一样会犯错的缺点，反而成为其优点，让人更加喜爱他。在生活中，拥有显眼特质的人通常会在社交场合中做出非常活泼、搞笑的行为。他们勇于表达自己，拥有自信和独特的魅力。这种社交魅力不仅是一种表面的现象，更是一种内心的力量。在保持自信的同时，不去过分在意他人目光，同时保持良好的社交心态，面对困难和挫折都有足够的心理韧性。\n这段文字未提及（    ）。","options":{"A":"“显眼包”的语义变化","B":"“显眼包”的性格特质","C":"“显眼包”的心理学解释","D":"“显眼包”受欢迎的原因"},"answer":"A","explanation":"A项，文段并未提及“显眼包”一词的语义变化，无中生有，当选；\nB项，根据“拥有显眼特质的人通常会在社交场合中做出非常活泼、搞笑的行为。他们勇于表达自己，拥有自信和独特的魅力”可知，“‘显眼包’的性格特质”文段有提及，排除；\nC项，根据“‘显眼包’的行为特点符合心理学上所谓的‘出丑效应’。这种效应······更加喜爱他”可知，“‘显眼包’的心理学解释”文段有提及，排除；\nD项，根据“精明的人无意中犯点小错误，反而更使人觉得他具有和别人一样会犯错的缺点，反而成为其优点，让人更加喜爱他。在生活中，拥有显眼特质的人通常会在社交场合中做出非常活泼、搞笑的行为。他们勇于表达自己，拥有自信和独特的魅力”可知，“‘显眼包’受欢迎的原因”文段有提及，排除。\n本题为选非题，故正确答案为A。\n【文段出处】科普中国《让孩子成为“显眼包”，竟然还有这种好处？》","no":31,"missingImage":false},{"type":"question","qid":"18649918","cat":"片段阅读","stem":"按道理来说，逆风运动受到的阻力更大，顺风运动受到的推力更大。但鸟类的飞行与飞机飞行的原理有点类似，鸟类大多数时候更喜欢逆风而飞，因为这时的风与鸟儿相向而行，气流滑过鸟的翅膀的速度更快，在翅膀上下形成气压差，产生一个上升的力，使鸟飞得更高；并且鸟的体型是由前向后的流线型，羽毛都是由前向后生长，逆着风飞，可以减少空气阻力，如果顺着风飞行，羽毛就会被吹翻起来，像一把被倒着吹的雨伞，增大鸟的飞行阻力。\n这段文字意在说明（    ）。","options":{"A":"鸟类为什么喜欢逆风飞行","B":"鸟类飞行的原理类似飞机","C":"鸟类体型具有流线型特征","D":"鸟类飞行受到风向的影响"},"answer":"A","explanation":"文段首句指出正常情况下顺风运动受到的推力更大，然后由转折关联词“但”引出鸟类则相反，多数时候更喜欢逆风而飞这一观点。继而由关联词“因为”引出原因解释：一方面，鸟儿逆风飞行时气流滑过鸟的翅膀的速度更快，在翅膀上下形成气压差，产生一个上升的力，使鸟能飞得更高。另一方面，鸟的体型是由前向后的流线型，逆风飞行可以减少空气阻力。文段整体结构为：先提出鸟类大多数时候更喜欢逆风而飞这一结论，再以并列的两方面去解释原因。故文段中心句为首句，指出鸟类喜欢逆风飞行，且后文进行了原因解释，对应A项。\nB项，文段中的飞机只是用来作为对比，引出鸟类喜欢逆风飞行这一观点，且后文再未提及，非重点，排除；\nC项，“鸟类体型具有流线型特征”只对应题干中第二个原因，表述片面，排除；\nD项，“鸟类飞行受到风向的影响”只对应题干中第一个原因，表述片面，排除。\n故正确答案为A。\n【文段出处】文摘报、光明网《逆流而上的鱼和鸟》","no":32,"missingImage":false},{"type":"question","qid":"18649919","cat":"片段阅读","stem":"在冬季，树木内运输养分的液体会减缓或停止流动，此时修枝作业可以最大限度减少对树木生长的干扰；冬季土壤冻结，作业对土壤干扰也较小。同时冬季是部分害虫和病菌的休眠期，其活动相对较少，此时清除枯木和病腐木可有效减少害虫和病菌对森林的危害。此外，冬季树干的水分含量比生长季时低，枝脆干轻，便于修枝、集材和运材。\n这段文字意在说明（    ）。","options":{"A":"冬季森林抚育在各地均有开展","B":"冬季是森林抚育作业的黄金期","C":"冬季森林抚育具有严格的作业标准","D":"森林抚育有助于缩短森林培育周期"},"answer":"B","explanation":"文段开篇介绍冬季修枝作业可以最大程度减少对树木生长的干扰，接下来通过“同时”指出冬季清除枯木和病腐木可以减少病虫害对森林的危害，最后通过“此外”继续说明冬季的树干便于修枝、集材和运材。故文段为并列结构，重点介绍在冬季开展森林抚育的原因及积极影响，即冬季是森林抚育作业的黄金期，对应B项。\nA项，文段并未提及多个地点，排除；\nC项，文段并未提及“作业标准”，排除；\nD项，文段并未提及“缩短森林培育周期”，且缺少文段主题词“冬季”，排除。\n故正确答案为B。\n【文段出处】文摘报《森林抚育，冬季为何很重要》","no":33,"missingImage":false},{"type":"question","qid":"18649950","cat":"语句表达","stem":"基因不过是细胞合成蛋白质的指南，真正在人体中发挥生理作用的是蛋白质。不同的蛋白质有时候会相互结合，形成复合体，调节各种功能。基因突变之所以会引发疾病，很大程度上是因为突变会影响这些蛋白质的功能。                    。比如说，在身体里，有两个蛋白质会形成一个关键的复合体，修复受损的DNA。一旦编码这两个蛋白质的基因出现变异，这两个蛋白质的结构就可能发生变化。如果这些变化让它们无法相互作用，就无法形成蛋白复合体来修复DNA，久而久之，细胞里的受损DNA就会越积越多，最终发生质变，引起癌症。\n填入画横线部分最恰当的一项是（    ）。","options":{"A":"癌症相关蛋白会激活不同的信号通路","B":"蛋白质功能与两者间的结合方式有关","C":"致癌因子可能使蛋白复合体发生变化","D":"这能让我们更好地理解癌症如何发生"},"answer":"D","explanation":"横线出现在文段中间，需要结合前后文内容进行分析。前文论述了真正在人体中发挥生理作用的是蛋白质，并指出蛋白质的功能受基因突变影响会引起疾病，横线后举例说明蛋白质功能受到基因突变影响最终引起癌症，故横线处应表达蛋白质功能受损会引发癌症之意，对应D项。\nA项，“激活不同的信号通路”无中生有，文段未提及，排除；\nB项，文段说明蛋白质功能与形成的复合体有关，是受基因突变影响，而非“两者间的结合方式”，表述错误，排除；\nC项，“致癌因子”无中生有，文段未提及，排除。\n故正确答案为D。\n【文段出处】《三篇&lt;科学&gt;齐发！科学家对癌症发病有了新的认识》","no":34,"missingImage":false},{"type":"question","qid":"18649959","cat":"语句表达","stem":"①再加上有些兰花自然分布范围极端狭窄，任何一个小种群的状态都可能关系整个物种的存亡\n②绝大多数兰科植物对环境要求相对苛刻，仅能接受特定生境类型，对真菌、传粉昆虫种类也有要求\n③兰科被纳入《国家重点保护野生植物名录》的重要原因是，它们通常个体少、分布狭隘且面临风险\n④典型例子是暖地杓兰和象鼻兰，二者都是新增的国家一级重点保护植物，分布范围小，已知个体数量少，且均为我国特有物种\n⑤值得庆幸的是，暖地杓兰的人工繁育难题已经取得突破，象鼻兰已能实现规模化人工繁育\n⑥一旦这些环境条件发生改变，即使没有受到人类直接影响，也足以引起居群走向衰退\n将以上六个句子重新排列，语序正确的一项是（    ）。","options":{"A":"②①④⑤③⑥","B":"②①④⑤⑥③","C":"③②⑥①④⑤","D":"③④⑤⑥②①"},"answer":"C","explanation":"对比选项，确定首句。②句阐述绝大多数兰科植物对环境、真菌及传粉昆虫种类都有严苛的要求，③句点明兰科被纳入《国家重点保护野生植物名录》的重要原因是个体少、分布狭隘且面临风险，均可作首句，无法排除。\n继续观察所给语句，寻找线索。⑥句中出现指代词“这些环境条件”，可寻找捆绑句子。结合选项，⑥句前分别为②、③、⑤三句，②句具体阐述兰科植物对生存环境的苛刻要求，与⑥句话题一致，可构成捆绑，C项当选。③句说明兰科被纳入《国家重点保护野生植物名录》的重要原因，⑤句介绍暖地杓兰和象鼻兰的人工繁育取得的新进展，均与“环境条件”无关，不能与⑥句构成捆绑，排除A、B、D三项。\n故正确答案为C。\n【文段出处】澎湃新闻《天价交易下历尽劫难的野生兰花，终于有了“护身符”》","no":35,"missingImage":false}],"count":20,"answerable":20,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"14096255","cat":"数学运算","stem":"以下每一行的数列都有相同的规律，问“？”处应填入的数字为（    ）。\n\u003cimg data-k=\"44aa237e2ad9\" style=\"max-width:327px\">","options":{"A":"-3","B":"3","C":"-11","D":"11"},"answer":"A","explanation":"题干出现图形，判定为图形数阵。\n方法一：观察表格数据，按行查找规律可得：（6-4）×4=10-2；（7-8）×4=5-9；（3-2）×4=5-1。即在每行中满足规律：（第二列数字-第一列数字）×4=第四列数字-第三列数字，则（7-12）×4=（？-17），？=-3。\n方法二：观察表格数据，每一行两两作差可得：第一行，2、-4、8，第二行，-1、2、-4，第三行，1、-2、4，即每一行作差之后均是公比为-2的等比数列。第四行两两作差可得：-5、10、（    ），则下一项为10×（-2）=-20，？-17=-20，？=-3。\n故正确答案为A。","no":36,"missingImage":false},{"type":"question","qid":"14096254","cat":"数学运算","stem":"以下为6×6的数独，其每行、每列和每个小方块的6个格子中都包含1~6的数字。问“？”处应填入的数字为（    ）。\n\u003cimg data-k=\"c5ddd3e03aae\" style=\"max-width:354px\">","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"B","explanation":"题干出现图形，判定为图形数阵。观察空缺数字较少的第二列，所缺数字是2和4，因第四行出现了数字4，则第二列第四行只能是2，第二列第二行是4。观察倒数第二行数字，所缺数字是1、2、4，因第四列和第六列均出现了数字4，则第一列的空格处只能是4。\n如下图，橙色小方块右下角的空格处只能是1或2，结合黄色小方块的最右侧两个空格中必有2，则橙色小方块右下角的空格处只能是1，故“？”处应填入的数字是2。\n\u003cimg data-k=\"a8cca863a8bf\" style=\"max-width:353px\">\n故正确答案为B。","no":37,"missingImage":false},{"type":"question","qid":"14096270","cat":"数学运算","stem":"以下二维数列的首项为灰色方格中数字。每组上下相邻的数字呈现一种固定规律，每组左右相邻的数字呈现另一种固定的规律。问“？”处应填入的数字为（    ）。\n\u003cimg data-k=\"a362b2d6b1b8\" style=\"max-width:600px\">","options":{"A":"20","B":"24","C":"40","D":"44"},"answer":"D","explanation":"题干出现图形，判定为图形数阵。观察上下相邻的数字，查找规律可得：第一组，6×2-10=2；第二组，9×2-10=8，8×2-10=6；第三组，11×2-10=12。即上下相邻的数字满足规律：上×2-10=下，则第三组空格数字=12×2-10=14。观察左右相邻的数字，查找规律可得：第一组，2×2-1=3，3×2-1=5，5×2-1=9；第二组，6×2-1=11。即左右相邻的数字满足规律：左×2-1=右，则第三组第二列空格数字=14×2-1=27。故“？”处应填入的数字为27×2-10=44。\n故正确答案为D。","no":38,"missingImage":false},{"type":"question","qid":"14096252","cat":"数学运算","stem":"商店购进一批服装，按进价的2倍定价销售。如打八折销售，每天比原价销售时多卖20件，每天的利润与原价销售时相同；如每件降价120元，每天销量比原价销售时多2倍，每天的利润是原价销售时的1.2倍。问原价销售时每天能获利多少元？","options":{"A":"3600","B":"4000","C":"6000","D":"7200"},"answer":"C","explanation":"设每件服装进价x元，原价销售时每天可卖y件，则定价为2x元，原价销售时每天可获利（2x-x）y=xy元。根据题意，可列式：\u003cimg data-k=\"e1a28058f736\">······①，\u003cimg data-k=\"c194e293fb57\">······②，解得x=200，y=30。则原价销售时每天能获利200×30=6000元。\n故正确答案为C。","no":39,"missingImage":false},{"type":"question","qid":"14096269","cat":"数学运算","stem":"甲、乙两企业共同投资建厂，约定前三年的收益70%归甲，30%归乙，往后每年的收益中，归乙的比例都比上一年高10个百分点，直到乙的收益占比达到70%为止，已知第一年工厂收益3x元，往后每一年的收益都比上一年高x元。问乙企业的累计收益第一次超过甲是在第几年？","options":{"A":"7","B":"8","C":"9","D":"10"},"answer":"B","explanation":"根据题意，乙企业的收益可列表如下：\n\u003cimg data-k=\"babc552c2551\" style=\"max-width:576px\">\n代入A项：第7年时，根据等差数列求和公式：\u003cimg data-k=\"063245b5a725\">，可得工厂累计收益为\u003cimg data-k=\"8eeb2475ada2\">，乙企业的累计收益为0.9x+1.2x+1.5x+2.4x+3.5x+4.8x+6.3x＝20.6x，则甲企业的累计收益为42x-20.6x＝21.4x。20.6x&lt;21.4x，可知第7年乙企业的累计收益未超过甲，排除；\n代入B项：第8年时，工厂累计收益为42x+10x=52x，乙企业的累计收益为20.6x+7x=27.6x，则甲企业的累计收益为52x-27.6x＝24.4x。27.6x&gt;24.4x，可知第8年乙企业的累计收益第一次超过甲，当选。无需再验证C、D两项。\n故正确答案为B。","no":40,"missingImage":false},{"type":"question","qid":"14096258","cat":"数学运算","stem":"甲、乙工程队共同实施某个路面铺装工程，如每天各工作8小时，正好20天完成任务，实际工作5天后，甲工程队引入新设备效率提升10%，乙工程队每天多工作2小时，结果提前2天完成任务。则甲、乙工程队原始效率的比值为（    ）。","options":{"A":"\u003cimg data-k=\"d59755563ca3\">","B":"\u003cimg data-k=\"cd2546cfdf85\">","C":"\u003cimg data-k=\"89507e97188a\">","D":"\u003cimg data-k=\"02ac35569f98\">"},"answer":"D","explanation":"赋值甲工程队原始效率为每小时10，设乙工程队原始效率为每小时x。\n方法一：工作5天后的剩余工程量为\u003cimg data-k=\"de828d0540a3\">。根据“提前2天完成任务”，即在甲、乙工程队改变工作模式之后实际工作20-2-5=13天完成，可列方程：\u003cimg data-k=\"9f6791a8c1b7\">\u003cimg data-k=\"9d07ea5bcae2\">，解得x=5.6。则甲、乙工程队原始效率的比值为\u003cimg data-k=\"b130f87b8c31\">。\n方法二：根据“提前2天完成任务”，即原计划20-5=15天的工程量实际15-2=13天完成。根据“总量一定，效率与时间成反比”，可列方程：\u003cimg data-k=\"815b2c541790\">，解得x＝5.6。则甲、乙工程队原始效率的比值为\u003cimg data-k=\"b130f87b8c31\">。\n故正确答案为D。","no":41,"missingImage":false},{"type":"question","qid":"14096271","cat":"数学运算","stem":"一个不规则八面体零件的每个面都是不同的三角形，7个面是白色，1个面是黑色，现选择2个白色面分别涂成红色和黄色，要求红、黄色两个面与黑色面均不相邻（仅共顶点不算相邻）。问有多少种不同的涂色方案？","options":{"A":"6","B":"8","C":"10","D":"12"},"answer":"D","explanation":"八面体即八个面，每个面都是三角形，则每个面均有3个相邻面（公共边），仅1个面是黑色，则与黑色面相邻的面有3个，那么与黑色面不相邻的面有4个，从不相邻的面中任意选2个，一定不会与黑色面相邻，共有\u003cimg data-k=\"a20f0bbca763\">种涂色方案。\n故正确答案为D。","no":42,"missingImage":false},{"type":"question","qid":"14096253","cat":"数学运算","stem":"某集团甲、乙、丙三个分公司共有100多人，甲、乙、丙分公司销售人员分别占总人数的40%、44%和34%，且甲分公司销售人员比乙分公司多13人，问销售人员最多和最少的分公司，非销售人员相差多少人？","options":{"A":"16","B":"18","C":"20","D":"22"},"answer":"D","explanation":"根据“甲、乙、丙分公司销售人员分别占总人数的40%、44%和34%”，可得\u003cimg data-k=\"447713bf81dc\">\u003cimg data-k=\"3b7c5bcb2c6b\">；\u003cimg data-k=\"fa09959e189a\">\u003cimg data-k=\"a2c74b753e4f\">；\u003cimg data-k=\"b259bc78d080\">\u003cimg data-k=\"1a810a1f9a5d\">。假设甲分公司销售人员人数为2x人，乙分公司销售人员人数为11y人，又因“甲分公司销售人员比乙分公司多13人”，可列式2x-11y=13，2x为偶数，13为奇数，则11y为奇数，y可取1，3，5，······，当y=1时，x=12，即甲分公司销售人员人数为24人，甲分公司总人数为60人；乙分公司销售人员人数为11人，乙分公司总人数为25人，那么丙分公司的总人数为50人或100人都满足题意；\n当y=3时，x=23，即甲分公司销售人员人数为46人，甲分公司总人数为115人；乙分公司销售人员人数为33人，乙分公司总人数为75人，那么丙分公司的总人数为50人时，不满足题意。因此当y取3及以上时，皆不满足题意。\n综上，若甲分公司销售人员人数为24人、乙分公司销售人员人数为11人、丙分公司销售人员人数为17人时，销售人员最多的是甲公司，最少的是乙公司，则所求为（60-24）-（25-11）=22人。\n故正确答案为D。","no":43,"missingImage":false},{"type":"question","qid":"14096259","cat":"数学运算","stem":"张、王和李从甲地出发匀速前往乙地，到达后均原速度返回。张比王早出发20分钟，比李晚出发30分钟。出发2小时后张追上李，又用了1小时张到达乙地，又用了1小时返程中的李与王迎面相遇。问王从甲地到乙地单程的用时（    ）。","options":{"A":"不到4小时15分","B":"在4小时15分~4小时30分之间","C":"在4小时30分~4小时45分之间","D":"超过4小时45分"},"answer":"C","explanation":"根据题意，出发2小时后张追上李，张所用时间为2小时，李所用时间为2.5小时，\u003cimg data-k=\"64efa66875ff\">；根据路程相同，时间与速度呈反比，可知\u003cimg data-k=\"56871b601ce0\">。假设\u003cimg data-k=\"b533b68354ea\">，\u003cimg data-k=\"3f65650ee009\">，张从甲地到乙地一共走了2+1=3小时，即180分钟，则\u003cimg data-k=\"c8e25d15fb0a\">。根据题干“又用了1小时返程中的李与王迎面相遇”，此时张用时3+1=4小时，即240分钟，再根据题干“张比王早出发20分钟，比李晚出发30分钟”，可得李用时240+30=270分钟，王用时240-20=220分钟。李走的总路程为4×270=1080，即走完甲到乙的900后返程走了1080-900=180，此时与王相遇，那么王走的距离为900-180=720，则\u003cimg data-k=\"241c62747aad\">，故王从甲地到乙地单程的用时为\u003cimg data-k=\"10e8d705847a\">分钟，即4小时35分，在C项范围内。\n故正确答案为C。","no":44,"missingImage":false},{"type":"question","qid":"14096256","cat":"数学运算","stem":"甲和乙两条生产线4小时可以生产320个零件，乙和丙两条生产线6小时可以生产420个零件。如果甲的效率提高25%，其3小时生产的零件数量与丙生产5小时相同。问乙生产210个零件需要多长时间？","options":{"A":"5小时15分","B":"6小时","C":"7小时","D":"7小时30分"},"answer":"A","explanation":"根据题意可得，4（甲+乙）=320①；6（乙+丙）=420②，整理得甲-丙=10。根据“甲的效率提高25%，其3小时生产的零件数量与丙生产5小时相同”，可列式1.25×甲×3=5×丙，整理得\u003cimg data-k=\"48ca6b5338bd\">，甲比丙多1份，结合甲-丙=10，则1份=10，故甲=40，丙=30，乙=40。那么所求为\u003cimg data-k=\"9a61281f5901\">小时，\u003cimg data-k=\"62886ffdfcd1\">小时\u003cimg data-k=\"aa317c180511\">分钟，即乙生产210个零件需要5小时15分。\n故正确答案为A。","no":45,"missingImage":false},{"type":"question","qid":"14096262","cat":"数学运算","stem":"书店A、B、C三种图书，每本售价分别是20元、28元、40元，利润分别是3元、2.8元、4元。已知某学校用1000元购买其中两种图书，合计40本，问书店的利润最大是多少元？","options":{"A":"112","B":"115","C":"120","D":"130"},"answer":"D","explanation":"根据公式：利润率\u003cimg data-k=\"5a49a0b0b9f9\">，则出售A图书的利润率为\u003cimg data-k=\"37d52e00094f\">，出售B图书的利润率为\u003cimg data-k=\"b72dc2bed372\">，出售C图书的利润率为\u003cimg data-k=\"0d3244b77f57\">，比较可知书店出售A图书的利润率最大，若要书店的利润最大，则应尽可能多地购买A图书，即学校可能购买A、B两种图书或A、C两种图书。\n（1）学校购买A、B两种图书：设购买A图书m本，则购买B图书（40-m）本，根据题意可列式：20m+28×（40-m）=1000，解得m=15，即学校购买A图书15本，B图书40-15=25本，此时书店的利润为3×15+2.8×25=115元。\n（2）学校购买A、C两种图书：设购买A图书n本，则购买C图书（40-n）本，根据题意可列式：20n+40×（40-n）=1000，解得n=30，即学校购买A图书30本，C图书40-30=10本，此时书店的利润为3×30+4×10=130元。\n综上，书店的利润最大是130元。\n故正确答案为D。","no":46,"missingImage":false},{"type":"question","qid":"14096267","cat":"数学运算","stem":"某学院艺术特长生招生，学员平均成绩88分，其中男生的平均成绩86分，女生的平均成绩92分。后扩招了2名女生，使得男、女生平均成绩相同，已知扩招的女生的成绩均不超过70分，问扩招后，至少有几名学员？","options":{"A":"12","B":"14","C":"20","D":"26"},"answer":"C","explanation":"根据线段法“距离与量成反比”，则扩招前男生人数：女生人数=（92-88）：（88-86）=2：1，故设扩招前有男生2n人，女生n人。\n\u003cimg data-k=\"a61c427d5006\" style=\"max-width:466px\">\n根据题意可知，扩招了2名女生后，女生的平均成绩也为86分。\n方法一：设扩招的2名女生的平均成绩为x，则可列式：92n+2x=86（n+2），整理可得：x=86-3n。根据“已知扩招的女生的成绩均不超过70分”，则\u003cimg data-k=\"1bd66dc632c9\">，解得\u003cimg data-k=\"e3bfa41c6e27\">，且n为整数，故n最小为6。当n=6时，扩招后至少有学员2n+n+2=3n+2=20人。\n方法二：扩招前男女生人数比为2：1，即扩招前总人数是3的倍数，则扩招后的总人数减2应为3的倍数，结合选项可排除A项。题目问“至少”，将选项从小到大依次代入验证：\n代入B项：扩招后共有14人，则扩招前有女生\u003cimg data-k=\"b62877b35ab1\">人，扩招后有女生4+2=6人，总成绩为6×86=516分，故扩招的2名女生的总成绩为516-92×4=148分，148÷2=74分&gt;70分，不符合题意，排除；\n代入C项：扩招后共有20人，则扩招前有女生\u003cimg data-k=\"fd3fbeeb1c76\">人，扩招后有女生6+2=8人，总成绩为8×86=688分，故扩招的2名女生的总成绩为688-92×6=136分，136÷2=68分&lt;70分，符合题意，当选。无需验证剩余选项。\n故正确答案为C。","no":47,"missingImage":false},{"type":"question","qid":"14096265","cat":"数学运算","stem":"一个圆柱体容器内装有水，其底面半径是一圆台下底面半径的1.5倍，且圆台上底面半径是其下底面半径的一半，圆台完全浸没于圆柱体水中时，水面上升2厘米，问圆台高是多少厘米？","options":{"A":"不到5厘米","B":"5厘米到6厘米","C":"6厘米到7厘米","D":"超过7厘米"},"answer":"D","explanatio
