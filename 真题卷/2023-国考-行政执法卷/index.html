<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

    <div class="spacer"></div>

</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2023-国考-行政执法卷","title":"2023年国家公务员录用考试《行测》题（行政执法卷网友回忆版）","year":"2023","group":"国考","modules":[{"label":"政治理论","items":[{"type":"question","qid":"5445752","cat":"时事政治","stem":"党的二十大报告指出，从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。下列对中国式现代化的理解，正确的有几项？\n①坚持把实现人民对美好生活的向往作为现代化建设的出发点和落脚点\n②共同富裕是社会主义的本质要求，是中国式现代化的重要特征\n③在物质文明方面超越西方发达国家，是中国式现代化的主要目标\n④遵循世界各国现代化的共同模式，是中国式现代化道路的基本经验\n⑤中国式现代化新道路，创造了人类文明新形态","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"B","explanation":"本题考查政治常识。\n①②正确，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色······中国式现代化是全体人民共同富裕的现代化。共同富裕是中国特色社会主义的本质要求，也是一个长期的历史过程。我们坚持把实现人民对美好生活的向往作为现代化建设的出发点和落脚点，着力维护和促进社会公平正义，着力促进全体人民共同富裕，坚决防止两极分化。”\n③错误，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“中国式现代化是物质文明和精神文明相协调的现代化。物质富足、精神富有是社会主义现代化的根本要求。物质贫困不是社会主义，精神贫乏也不是社会主义。我们不断厚植现代化的物质基础，不断夯实人民幸福生活的物质条件，同时大力发展社会主义先进文化，加强理想信念教育，传承中华文明，促进物的全面丰富和人的全面发展。”西方式现代化是由工业革命催生出来的，是一种以工业化为主要标准的现代化，这使得西方式现代化在追求工业化发展的同时，无法兼顾到其他领域的发展，由此就导致了物质进步与道德文明进步之间的冲突。然而，中国式现代化绝不是一种单一向度的现代化，而是一种“并联式”的现代化。\n④错误，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色······中国式现代化是人口规模巨大的现代化。我国十四亿多人口整体迈进现代化社会，规模超过现有发达国家人口的总和，艰巨性和复杂性前所未有，发展途径和推进方式也必然具有自己的特点。我们始终从国情出发想问题、作决策、办事情，既不好高骛远，也不因循守旧，保持历史耐心，坚持稳中求进、循序渐进、持续推进。”\n⑤正确，二十大报告中“三、新时代新征程中国共产党的使命任务”部分指出：“中国式现代化的本质要求是：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。”\n故①②⑤正确，共3项。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"5445755","cat":"时事政治","stem":"党的二十大报告指出，要发展全过程人民民主，保障人民当家作主。关于人民民主，下列表述正确的是：\n①人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义\n②全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主\n③协商民主是实践全过程人民民主的重要形式\n④党内民主是全过程人民民主的重要体现","options":{"A":"①③④","B":"①②④","C":"①②③","D":"②③④"},"answer":"C","explanation":"本题考查政治常识。\n①②正确，二十大报告中“六、发展全过程人民民主，保障人民当家作主”部分指出：“我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家，国家一切权力属于人民。人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义。全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。”\n③正确，二十大报告中“六、发展全过程人民民主，保障人民当家作主”部分指出：“（二）全面发展协商民主。协商民主是实践全过程人民民主的重要形式。完善协商民主体系，统筹推进政党协商、人大协商、政府协商、政协协商、人民团体协商、基层协商以及社会组织协商，健全各种制度化协商平台，推进协商民主广泛多层制度化发展。”\n④错误，二十大报告中“六、发展全过程人民民主，保障人民当家作主”部分指出：“（三）积极发展基层民主。基层民主是全过程人民民主的重要体现。健全基层党组织领导的基层群众自治机制，加强基层组织建设，完善基层直接民主制度体系和工作体系，增强城乡社区群众自我管理、自我服务、自我教育、自我监督的实效。”\n综上所述，①②③正确。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"5445757","cat":"时事政治","stem":"党的二十大报告指出，要增进民生福祉，提高人民生活品质。下列有关表述正确的是：","options":{"A":"就业是人民生活的安全网和社会运行的稳定器","B":"人民健康是最基本的民生","C":"健全的社会保障体系是民族昌盛和国家强盛的重要标志","D":"分配制度是促进共同富裕的基础性制度"},"answer":"D","explanation":"本题考查政治常识。\nA项错误，二十大报告中“九、增进民生福祉，提高人民生活品质”部分指出：“（三）健全社会保障体系。社会保障体系是人民生活的安全网和社会运行的稳定器。健全覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次社会保障体系。完善基本养老保险全国统筹制度，发展多层次、多支柱养老保险体系。实施渐进式延迟法定退休年龄。”\nB项错误，二十大报告中“九、增进民生福祉，提高人民生活品质”部分指出：“（二）实施就业优先战略。就业是最基本的民生。强化就业优先政策，健全就业促进机制，促进高质量充分就业。健全就业公共服务体系，完善重点群体就业支持体系，加强困难群体就业兜底帮扶。”\nC项错误，二十大报告中“九、增进民生福祉，提高人民生活品质”部分指出：“（四）推进健康中国建设。人民健康是民族昌盛和国家强盛的重要标志。把保障人民健康放在优先发展的战略位置，完善人民健康促进政策。优化人口发展战略，建立生育支持政策体系，降低生育、养育、教育成本。实施积极应对人口老龄化国家战略，发展养老事业和养老产业，优化孤寡老人服务，推动实现全体老年人享有基本养老服务。”\nD项正确，二十大报告中“九、增进民生福祉，提高人民生活品质”部分指出：“（一）完善分配制度。分配制度是促进共同富裕的基础性制度。坚持按劳分配为主体、多种分配方式并存，构建初次分配、再分配、第三次分配协调配套的制度体系。努力提高居民收入在国民收入分配中的比重，提高劳动报酬在初次分配中的比重。”\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"5445760","cat":"时事政治","stem":"党的二十大报告指出，新时代十年来“党和国家事业取得历史性成就、发生历史性变革”。关于新时代十年来取得的历史性成就，下列表述错误的是：","options":{"A":"谷物总产量稳居世界首位","B":"制造业规模、外汇储备稳居世界第一","C":"全社会研发经费支出跃居世界第一","D":"建成世界最大的高速铁路网"},"answer":"C","explanation":"本题考查政治常识。\nC项错误，A、B、D三项正确，二十大报告中“一、过去五年的工作和新时代十年的伟大变革”部分指出：“我们提出并贯彻新发展理念，着力推进高质量发展，推动构建新发展格局，实施供给侧结构性改革，制定一系列具有全局性意义的区域重大战略，我国经济实力实现历史性跃升······谷物总产量稳居世界首位，十四亿多人的粮食安全、能源安全得到有效保障。城镇化率提高十一点六个百分点，达到百分之六十四点七。制造业规模、外汇储备稳居世界第一。建成世界最大的高速铁路网、高速公路网，机场港口、水利、能源、信息等基础设施建设取得重大成就。我们加快推进科技自立自强，全社会研发经费支出从一万亿元增加到二万八千亿元，居世界第二位，研发人员总量居世界首位······”\n本题为选非题，故正确答案为C。","no":4,"missingImage":false}],"count":4,"answerable":4,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"5445761","cat":"地理国情","stem":"中共中央、国务院印发了《黄河流域生态保护和高质量发展规划纲要》，根据该纲要，下列表述错误的是：","options":{"A":"到2035年黄河流域生态保护和高质量发展取得重大战略成果","B":"河湟-藏羌文化区是农耕文化与游牧文化交汇相融的过渡地带","C":"支持青海、甘肃等风能、太阳能丰富地区构建风光水多能互补系统","D":"水土保持区以内蒙古高原南缘、宁夏中部等为主"},"answer":"D","explanation":"本题考查政治常识。\n《黄河流域生态保护和高质量发展规划纲要》以下简称《纲要》。\nA项正确，《纲要》在“第二章 总体要求”的“第四节 发展目标”中指出：“······到2035年，黄河流域生态保护和高质量发展取得重大战略成果，黄河流域生态环境全面改善，生态系统健康稳定，水资源节约集约利用水平全国领先，现代化经济体系基本建成，黄河文化大发展大繁荣，人民生活水平显著提升······”\nB项正确，《纲要》在“第二章 总体要求”的“第五节 战略布局”中指出：“构建多元纷呈、和谐相容的黄河文化彰显区。河湟-藏羌文化区，主要包括上游大通河、湟水河流域和甘南、若尔盖、红原、石渠等地区，是农耕文化与游牧文化交汇相融的过渡地带，民族文化特色鲜明······”\nC项正确，《纲要》在“第九章 建设特色优势现代产业体系”的“第三节 建设全国重要能源基地”中指出：“······发挥黄河上游水电站和电网系统的调节能力，支持青海、甘肃、四川等风能、太阳能丰富地区构建风光水多能互补系统。加大青海、甘肃、内蒙古等省区清洁能源消纳外送能力和保障机制建设力度······”\nD项错误，《纲要》在“第二章 总体要求”的“第五节 战略布局”中指出：“构建黄河流域生态保护‘一带五区多点’空间布局······‘五区’，是指以三江源、秦岭、祁连山、六盘山、若尔盖等重点生态功能区为主的水源涵养区，以内蒙古高原南缘、宁夏中部等为主的荒漠化防治区，以青海东部、陇中陇东、陕北、晋西北、宁夏南部黄土高原为主的水土保持区，以渭河、汾河、涑水河、乌梁素海为主的重点河湖水污染防治区，以黄河三角洲湿地为主的河口生态保护区······”\n本题为选非题，故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"5445765","cat":"经济常识","stem":"下列与金融活动相关的说法错误的是：","options":{"A":"有价证券的债务人可以请求债权人支付相应对价","B":"开展储蓄业务有助于实现货币购买力和商品供应量的平衡","C":"分红型商业保险的收益与保险公司的经营状况有关","D":"办理国家助学贷款的学生不需要办理贷款担保或抵押"},"answer":"A","explanation":"本题考查经济常识。\nA项错误，有价证券，是指标有票面金额，用于证明持有人或该证券指定的特定主体对特定财产拥有所有权或债权的凭证。有价证券的法律特征有：（一）有价证券与证券上所记载的财产权利不能分离。（二）有价证券的债务人是特定的，即证券的权利人只能向证券上记载的债务人请求实现债权。（三）有价证券的债务人的支付是单方义务，债务人不得请求权利人支付相应对价。\nB项正确，储蓄是指每个人或家庭，把节约的钱存到银行的经济活动。居民储蓄被银行积累起来，相应地增加社会可用的资金总量，支援社会生产发展，促进了社会积累的形成或增长。国家通过开展储蓄业务，可以有效地减少需求压力，实现货币购买力和商品供应量的平衡，调节货币流通。\nC项正确，分红型商业保险指保险公司将其实际经营成果优于定价假设的盈余，按一定比例向保单持有人进行分配的人寿保险产品。保单持有人可以分享保险公司经营成果的保险种类，保单持有人每年都有权获得建立在保险公司经营成果基础上的红利分配。\nD项正确，国家助学贷款是由政府主导，金融机构向高校家庭经济困难学生提供的信用助学贷款，帮助解决在校期间的学费和住宿费。国家助学贷款是信用贷款，学生不需要办理贷款担保或抵押，但需要承诺按期还款，并承担相关法律责任。\n本题为选非题，故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"5445770","cat":"法律常识","stem":"根据《中华人民共和国乡村振兴促进法》，下列说法正确的是：","options":{"A":"全面实施乡村振兴战略，应当坚持乡村城镇融合、城镇优先发展带动乡村原则","B":"国家构建以高质量绿色发展为导向的新型农业补贴政策体系","C":"省、自治区、直辖市人民政府应当采取措施确保耕地总量稳步增加","D":"乡镇人民政府应设立法律顾问和公职律师，根据需要在村民委员会建立公共法律服务工作室"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国乡村振兴促进法》第四条第一项规定：“全面实施乡村振兴战略，应当坚持中国共产党的领导，贯彻创新、协调、绿色、开放、共享的新发展理念，走中国特色社会主义乡村振兴道路，促进共同富裕，遵循以下原则：（一）坚持农业农村优先发展，在干部配备上优先考虑，在要素配置上优先满足，在资金投入上优先保障，在公共服务上优先安排。”因此，应坚持农业农村优先发展，而非乡村城镇融合、城镇优先发展带动乡村原则。\nB项正确，根据《中华人民共和国乡村振兴促进法》第六十条规定：“国家按照增加总量、优化存量、提高效能的原则，构建以高质量绿色发展为导向的新型农业补贴政策体系。”\nC项错误，根据《中华人民共和国乡村振兴促进法》第十四条第一款规定：“国家建立农用地分类管理制度，严格保护耕地，严格控制农用地转为建设用地，严格控制耕地转为林地、园地等其他类型农用地。省、自治区、直辖市人民政府应当采取措施确保耕地总量不减少、质量有提高。”因此，省、自治区、直辖市人民政府应当采取措施确保耕地总量不减少，而非确保耕地总量稳步增加。\nD项错误，根据《中华人民共和国乡村振兴促进法》第四十八条规定：“地方各级人民政府应当加强基层执法队伍建设，鼓励乡镇人民政府根据需要设立法律顾问和公职律师，鼓励有条件的地方在村民委员会建立公共法律服务工作室，深入开展法治宣传教育和人民调解工作，健全乡村矛盾纠纷调处化解机制，推进法治乡村建设。”因此，鼓励乡镇人民政府根据需要设立法律顾问和公职律师，而非应设立法律顾问和公职律师；鼓励有条件的地方在村民委员会建立公共法律服务工作室，而非根据需要在村民委员会建立公共法律服务工作室。\n故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"5445795","cat":"法律常识","stem":"根据《中华人民共和国退役军人保障法》，下列说法正确的是：","options":{"A":"参战退役军人的随迁子女入学可以得到优先保障","B":"退役的军士和义务兵可以逐月领取退役金","C":"已被大学录取的现役军人可以在退伍后四年内入学","D":"退役军人创办企业可以享受免税、贷款免息等优惠政策"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国退役军人保障法》第二十九条第四款第一项规定：“随迁子女需要转学、入学的，安置地人民政府教育行政部门应当予以及时办理。对下列退役军人的随迁子女，优先保障：（一）参战退役军人。”\nB项错误，根据《中华人民共和国退役军人保障法》第二十一条第一款规定：“对退役的军官，国家采取退休、转业、逐月领取退役金、复员等方式妥善安置。”第二十二条第一款规定：“对退役的军士，国家采取逐月领取退役金、自主就业、安排工作、退休、供养等方式妥善安置。”第二十三条第一款规定：“对退役的义务兵，国家采取自主就业、安排工作、供养等方式妥善安置。”因此，退役的军官与军士可适用逐月领取退役金的安置方式，对于退役的义务兵并未规定可适用逐月领取退役金的安置方式。\nC项错误，根据《中华人民共和国退役军人保障法》第三十五条规定：“现役军人入伍前已被普通高等学校录取或者是正在普通高等学校就学的学生，服现役期间保留入学资格或者学籍，退役后两年内允许入学或者复学，可以按照国家有关规定转入本校其他专业学习。达到报考研究生条件的，按照国家有关规定享受优惠政策。”因此，已被大学录取的现役军人可以在退伍后两年内入学，而非四年。\nD项错误，根据《中华人民共和国退役军人保障法》第四十六条规定：“退役军人创办小微企业，可以按照国家有关规定申请创业担保贷款，并享受贷款贴息等融资优惠政策。退役军人从事个体经营，依法享受税收优惠政策。”因此，退役军人创办企业可以享受税收优惠、贷款贴息等优惠政策，而非享受免税、贷款免息等优惠政策。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"5445796","cat":"法律常识","stem":"根据《中华人民共和国生物安全法》，下列说法错误的是：","options":{"A":"境外组织不得在我国从事中、高风险的生物技术研究、开发活动","B":"任何单位和个人未经批准，不得擅自引进、释放或者丢弃外来物种","C":"对高致病性的病原微生物，一律不得从事相关实验活动","D":"国家对我国人类遗传资源和生物资源享有主权"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国生物安全法》第三十八条第一款规定：“从事高风险、中风险生物技术研究、开发活动，应当由在我国境内依法成立的法人组织进行，并依法取得批准或者进行备案。”\nB项正确，根据《中华人民共和国生物安全法》第六十条第三款规定：“任何单位和个人未经批准，不得擅自引进、释放或者丢弃外来物种。”\nC项错误，根据《中华人民共和国生物安全法》第四十六条第一款规定：“高等级病原微生物实验室从事高致病性或者疑似高致病性病原微生物实验活动，应当经省级以上人民政府卫生健康或者农业农村主管部门批准，并将实验活动情况向批准部门报告。”\nD项正确，根据《中华人民共和国生物安全法》第五十三条第二款规定：“国家对我国人类遗传资源和生物资源享有主权。”\n本题为选非题，故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"5445819","cat":"法律常识","stem":"根据《中华人民共和国噪声污染防治法》，下列噪声污染情形与作出责令改正或处罚决定的主体对应错误的是：","options":{"A":"甲企业在噪声敏感建筑物集中区域改建厂房造成工业噪声污染——住房和城乡建设部门","B":"乙企业无排污许可证排放工业噪声——生态环境主管部门","C":"丙商场在促销时持续使用高音喇叭发出噪声——地方人民政府指定的部门","D":"丁驾驶拆除消声器的机动车轰鸣行驶——公安机关交通管理部门"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国噪声污染防治法》第七十四条第二款规定：“违反本法规定，在噪声敏感建筑物集中区域改建、扩建工业企业，未采取有效措施防止工业噪声污染的，由生态环境主管部门责令改正，处十万元以上五十万元以下的罚款；拒不改正的，报经有批准权的人民政府批准，责令关闭。”因此，甲企业在噪声敏感建筑物集中区域改建厂房造成工业噪声污染，应由生态环境主管部门责令改正。\nB项正确，根据《中华人民共和国噪声污染防治法》第七十五条规定：“违反本法规定，无排污许可证或者超过噪声排放标准排放工业噪声的，由生态环境主管部门责令改正或者限制生产、停产整治，并处二万元以上二十万元以下的罚款；情节严重的，报经有批准权的人民政府批准，责令停业、关闭。”\nC项正确，根据《中华人民共和国噪声污染防治法》第八十一条规定：“违反本法规定，有下列行为之一，由地方人民政府指定的部门责令改正，处五千元以上五万元以下的罚款；拒不改正的，处五万元以上二十万元以下的罚款，并可以报经有批准权的人民政府批准，责令停业：（一）超过噪声排放标准排放社会生活噪声的；（二）在商业经营活动中使用高音广播喇叭或者采用其他持续反复发出高噪声的方法进行广告宣传的；（三）未对商业经营活动中产生的其他噪声采取有效措施造成噪声污染的。”\nD项正确，根据《中华人民共和国噪声污染防治法》第七十九条第一款规定：“违反本法规定，驾驶拆除或者损坏消声器、加装排气管等擅自改装的机动车轰鸣、疾驶，机动车运行时未按照规定使用声响装置，或者违反禁止机动车行驶和使用声响装置的路段和时间规定的，由县级以上地方人民政府公安机关交通管理部门依照有关道路交通安全的法律法规处罚。”\n本题为选非题，故正确答案为A。","no":10,"missingImage":false},{"type":"question","qid":"5445806","cat":"法律常识","stem":"关于个人信息保护，下列说法不符合我国法律规定的是：","options":{"A":"通过自动化决策方式向个人进行商业营销，应同时提供不针对其个人特征的选项或便捷的拒绝方式","B":"通过人脸识别技术所收集的个人图像、身份识别信息只能用于维护公共安全目的","C":"个人信息和隐私有密切的关系，个人信息当中的私密信息适用有关隐私权的规定","D":"用户量巨大的个人信息处理者需要定期发布个人信息保护社会责任报告"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国个人信息保护法》第二十四条第二款规定：“通过自动化决策方式向个人进行信息推送、商业营销，应当同时提供不针对其个人特征的选项，或者向个人提供便捷的拒绝方式。”\nB项错误，根据《中华人民共和国个人信息保护法》第二十六条规定：“在公共场所安装图像采集、个人身份识别设备，应当为维护公共安全所必需，遵守国家有关规定，并设置显著的提示标识。所收集的个人图像、身份识别信息只能用于维护公共安全的目的，不得用于其他目的；取得个人单独同意的除外。”故若取得个人单独同意，可以用于其他目的。\nC项正确，根据《中华人民共和国民法典》第一千零三十四条第三款规定：“个人信息中的私密信息，适用有关隐私权的规定；没有规定的，适用有关个人信息保护的规定。”\nD项正确，根据《中华人民共和国个人信息保护法》第五十八条规定：“提供重要互联网平台服务、用户数量巨大、业务类型复杂的个人信息处理者，应当履行下列义务：（四）定期发布个人信息保护社会责任报告，接受社会监督。”\n本题为选非题，故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"5445807","cat":"科技常识","stem":"关于电信诈骗，下列说法错误的是：","options":{"A":"非法使用“伪基站”实施电信诈骗的以非法侵入计算机信息系统罪追究刑事责任","B":"实施电信诈骗最高可被判处无期徒刑","C":"电信诈骗受害人可以通过诉讼程序要求服务存在缺陷的电信运营商承担相应责任","D":"负责招募他人实施电信网络诈骗犯罪活动的，以共同犯罪论处"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《关于办理电信网络诈骗等刑事案件适用法律若干问题的意见》第三节第一点规定：“（一）在实施电信网络诈骗活动中，非法使用‘伪基站’‘黑广播’，干扰无线电通讯秩序，符合刑法第二百八十八条规定的，以扰乱无线电通讯管理秩序罪追究刑事责任。同时构成诈骗罪的，依照处罚较重的规定定罪处罚。”因此，非法使用“伪基站”实施电信网络诈骗活动，可能构成扰乱无线电通讯管理秩序罪或诈骗罪，不构成非法侵入计算机信息系统罪。\nB项正确，根据《中华人民共和国刑法》第二百六十六条规定：“诈骗公私财物，数额较大的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；数额巨大或者有其他严重情节的，处三年以上十年以下有期徒刑，并处罚金；数额特别巨大或者有其他特别严重情节的，处十年以上有期徒刑或者无期徒刑，并处罚金或者没收财产。本法另有规定的，依照规定。”若是诈骗数额特别巨大或者有其他特别严重情节的可被判处无期徒刑。\nC项正确，根据《中华人民共和国反电信网络诈骗法》第四十六条第二款规定：“电信业务经营者、银行业金融机构、非银行支付机构、互联网服务提供者等违反本法规定，造成他人损害的，依照《中华人民共和国民法典》等法律的规定承担民事责任。”第六条第五款规定：“电信业务经营者、银行业金融机构、非银行支付机构、互联网服务提供者承担风险防控责任，建立反电信网络诈骗内部控制机制和安全责任制度，加强新业务涉诈风险安全评估。”因此，电信运营商服务存在缺陷违反了《中华人民共和国反电信网络诈骗法》规定，受害人可以通过诉讼程序要求其承担相应责任。\nD项正确，根据《关于办理电信网络诈骗等刑事案件适用法律若干问题的意见》第四节第四点规定：“负责招募他人实施电信网络诈骗犯罪活动，或者制作、提供诈骗方案、术语清单、语音包、信息等的，以诈骗共同犯罪论处。”\n本题为选非题，故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"5445815","cat":"人文常识","stem":"下列与交通安全有关的说法错误的是：","options":{"A":"机动车载运放射性危险物品应当经公安机关批准后按指定的时间、路线、速度行驶","B":"在允许拖拉机通行的道路上，拖拉机可以从事货运，但是不得用于载人","C":"行人故意碰撞机动车造成交通事故的，机动车一方承担次要责任","D":"前车为执行紧急任务的救护车、工程救险车的，后车不得超车"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国道路交通安全法》第四十八条第三款规定：“机动车载运爆炸物品、易燃易爆化学物品以及剧毒、放射性等危险物品，应当经公安机关批准后，按指定的时间、路线、速度行驶，悬挂警示标志并采取必要的安全措施。”\nB项正确，根据《中华人民共和国道路交通安全法》第五十五条第二款规定：“在允许拖拉机通行的道路上，拖拉机可以从事货运，但是不得用于载人。”\nC项错误，根据《中华人民共和国道路交通安全法》第七十六条第二款规定：“交通事故的损失是由非机动车驾驶人、行人故意碰撞机动车造成的，机动车一方不承担赔偿责任。”由此说明机动车一方无需承担次要责任。\nD项正确，根据《中华人民共和国道路交通安全法》第四十三条第三项规定：“同车道行驶的机动车，后车应当与前车保持足以采取紧急制动措施的安全距离。有下列情形之一的，不得超车：（三）前车为执行紧急任务的警车、消防车、救护车、工程救险车的。”\n本题为选非题，故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"5445792","cat":"法律常识","stem":"根据《中华人民共和国职业教育法》，关于企业开展职业教育，下列说法错误的是：","options":{"A":"企业设立产教融合实训基地的，在公共事业费用上享受高于职业学校的优惠政策","B":"企业应当按照职工工资总额一定比例提取使用职工教育经费","C":"用于一线职工职业教育的经费应当达到国家规定的比例","D":"企业安排职工到职业学校接受职业教育的，应支付职业教育期间工资"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国职业教育法》第五十八条第二款规定：“企业设立具备生产与教学功能的产教融合实习实训基地所发生的费用，可以参照职业学校享受相应的用地、公用事业费等优惠。”题中，应是参照职业学校享受相应的公用事业费优惠，而非享受高于职业学校的优惠政策。\nB、C、D三项正确，根据《中华人民共和国职业教育法》第五十八条第一款规定：“企业应当根据国务院规定的标准，按照职工工资总额一定比例提取和使用职工教育经费。职工教育经费可以用于举办职业教育机构、对本单位的职工和准备招用人员进行职业教育等合理用途，其中用于企业一线职工职业教育的经费应当达到国家规定的比例。用人单位安排职工到职业学校或者职业培训机构接受职业教育的，应当在其接受职业教育期间依法支付工资，保障相关待遇。”\n本题为选非题，故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"5445789","cat":"科技常识","stem":"近年来，我国不断推进水生态修复保护工作。生态塘是包含水生动植物和微生物的一种水生态修复方式。下列与之相关的说法，错误的是：","options":{"A":"狐尾藻可用于富营养化水体的生态修复是因其可吸收氮磷","B":"可以用生石灰对生态塘沿岸土壤进行消毒处理","C":"池塘中的水体出现黑臭时可通过种植芦苇等植物进行改善","D":"生态塘中的青鱼等肉食性鱼类主要在池塘上层水体活动"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，狐尾藻是小二仙草科狐尾藻属植物，多年生粗壮沉水草本。根状茎发达，在水底泥中蔓延，节部生根，对富营养化水中的氮磷均有较好的净化作用。\nB项正确，蛋白质在遇到高温、强碱、强酸、重金属离子时会变性，蛋白质就失去了生物活性。生石灰遇水会发生反应放出大量的热，并且生成强碱，可以使细菌的蛋白质失去活性从而起到杀菌消毒的作用。\nC项正确，芦苇的根状茎十分发达，其叶、叶鞘、茎、根状茎和不定根都具有通气组织。当黑臭污水通过芦苇湿地系统时，芦苇能从污水中吸收营养物质加以利用，并能吸附和富集重金属及一些有毒有害物质，使水质得到净化。\nD项错误，青鱼是鲤科、青鱼属鱼类，体长可达145厘米，通常栖息在水的中下层，生性不活泼。其主要的食物来源为螺蛳、蚌、蚬、蛤等，偶尔也捕食虾和昆虫幼虫。\n本题为选非题，故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"5445699","cat":"人文常识","stem":"下列与古人出行有关的说法错误的是：","options":{"A":"“开远门前万里堠”中的“堠”是一种路标，可以用来导航和计程","B":"“乘舟而惑者，不知东西，见斗极则寤矣”中的“极”就是北极星","C":"“东有启明，西有长庚”中指示方向的“启明”“长庚”是不同天体","D":"“过洋牵星术”是通过测量星辰的高度指数来确定船只所处位置的"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“开远门前万里堠”出自唐代元稹的《和李校书新题乐府十二首·西凉伎》，其中“堠”是古代人们为了丈量路程，设置的一种路标，即在官道旁边每隔一段距离堆个石堆或土堆，作为标记，既可指明道路走向，又可计程。\nB项正确，“乘舟而惑者，不知东西，见斗极则寤矣”出自西汉刘安编撰的《淮南子》，表明在水路上迷路的人们，利用北斗星和北极星就能找到方向。其中“极”就是指北极星。\nC项错误，“东有启明，西有长庚”出自先秦的《大东》。“启明”和“长庚”都是指金星。因为其轨道位于地球之内，从地球上观察，金星时而在日出前现于东方，人们将其称为“启明星”；时而在日落后现于西方，人们称其为“长庚星”。\nD项正确，“过洋牵星术”是中国古代航海所用的天文观察导航技术，是指用牵星板测量所在地的星辰高度，然后计算出该处的地理纬度，以此测定船只所处位置。\n本题为选非题，故正确答案为C。","no":16,"missingImage":false},{"type":"question","qid":"5445705","cat":"人文常识","stem":"下列关于化石的说法正确的是：","options":{"A":"三叶虫化石是侏罗纪地层中的典型化石","B":"硅化木是树木埋入地下后形成的化石","C":"琥珀的硬度比和田玉大","D":"大多数化石是在侵入岩中被发现的"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，三叶虫化石，古时称作燕子石，也叫蝙蝠石。三叶虫属古生节肢动物，属三叶虫纲，生于海底，其种类繁多，生于古生代的寒武纪，至奥陶纪最盛，消亡于二叠纪末期的二叠纪大灭绝事件。侏罗纪界于三叠纪和白垩纪之间，是恐龙的鼎盛时期。\nB项正确，硅化木是真正的木化石，是几百万年或更早以前的树木被迅速埋入地下后，被地下水中的二氧化硅替换而成的树木化石，它保留了树木的木质结构和纹理。\nC项错误，琥珀，一种透明的生物化石，是松柏科、云实科、南洋杉科等植物的树脂化石。树脂滴落，掩埋在地下千万年，在压力和热力的作用下石化形成琥珀。其硬度比较低，一般莫氏硬度为2-3。和田玉属镁质大理岩与中酸性岩浆岩接触交代而形成的变质岩，内含透闪石、角闪石、阳起石等多矿物集合体，化学成分是含水的钙镁硅酸盐，莫氏硬度在6-6.5之间。\nD项错误，沉积岩，又称为水成岩，是三种组成地球岩石圈的主要岩石之一（另外两种是岩浆岩和变质岩）。沉积岩保留了许多地球的历史信息，包括大多数古代动植物化石，沉积岩的层理也有地球气候环境变化的信息。侵入岩是指当上覆岩层压力减轻时，软流层中的岩浆就钻出，在地壳深处冷凝而形成的岩石。\n故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"5445706","cat":"科技常识","stem":"下列与氢燃料电池车有关的说法错误的是：","options":{"A":"氢燃料电池车的最终排出物是水","B":"氢气可以通过生物发酵和电解水等方法制取","C":"北京冬奥会中大量使用了氢燃料电池车","D":"氢气和氧气在内燃机中反应产生电能"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，氢燃料电池是将氢气和氧气的化学能直接转换成电能的发电装置。因为产物只有水，所以氢燃料电池对环境无污染。 \nB项正确，制氢的方法有很多，包括电解水、金属与酸反应、水煤气法、生物发酵法等。\nC项正确，北京2022年冬奥会以氢能出行为主，作为新能源的“种子选手”，氢能零排放、储运便捷、来源与应用范围广泛。在这届冬奥会上，投入使用的氢燃料电池客车不仅动力强劲，其乘坐舒适度也高于传统燃油客车。北京市还投入运行首座冬奥会配套加氢站——福田加氢站。\nD项错误，氢燃料电池的本质是一个发电装置，利用氢气和氧气产生电化学反应释放出电能和热能，而不是让氢气和氧气在内燃机中直接反应。氢燃料电池车的工作原理是：将氢气送到燃料电池的阳极板（负极），经过催化剂（铂）的作用，氢原子中的电子被分离出来，失去电子的氢离子（质子）穿过质子交换膜，到达燃料电池的阴极板（正极），而电子是不能通过质子交换膜的，这个电子只能经外部电路，到达燃料电池的阴极板，从而在外电路中产生电流。\n本题为选非题，故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"5445709","cat":"人文常识","stem":"关于自然节律变化，下列说法错误的是：","options":{"A":"惊蛰后华北地区可能会出现“万里雪飘”的现象","B":"2月北回归线附近会出现“儿童急走追黄蝶，飞入菜花无处寻”的现象","C":"冬至时，在广东汕头竖直立杆会出现“立竿无影”的现象","D":"谷雨前后江浙地区可能会出现“一把青秧趁手青，轻烟漠漠雨冥冥”的现象"},"answer":"C","explanation":"本题考查地理国情。\nA项正确，惊蛰，又名“启蛰”，是二十四节气中的第三个节气，于每年公历3月5-6日交节。有谚语“雪打惊蛰节，四十五天阴”，意思是惊蛰节气出现下雪天气，后期天气持续阴冷。即惊蛰后华北地区可能出现“万里雪飘”的景象。\nB项正确，选项中诗句出自宋代杨万里的《宿新市徐公店》，意思是小孩子奔跑着追赶黄蝴蝶，可是蝴蝶飞入菜花丛中就再也找不到了。北回归线自西向东穿过中国云南、广西、广东、福建（海域）、台湾五省区。2月我国北回归线附近的地区平均气温在\u003cimg data-k=\"7181b1a2264f\">，金黄色的油菜花会开放，所以可以出现诗句中的景象。\nC项错误，立竿无影是一种自然景象，即直立在地上的物体没有阴影显现。在夏至正午时分，太阳直射北回归线呈绝对（接近）直射状，北回归线地区就会出现短暂的“立竿无影”现象。冬至时，太阳直射南回归线，在广东汕头竖直立杆，日影应朝北而不是无影。\nD项正确，选项中诗句出自宋代虞似良的《横溪堂春晓》，意思是将一把青色的秧苗，插入水中，那秧苗瞬间变得青葱，就好似农夫的手，将它染绿，天空中，飘洒着朦胧如烟的细雨。谷雨，是二十四节气中的第六个节气，春季的最后一个节气，于每年公历4月19日-21日交节。谷雨取自“雨生百谷”之意，此时降水明显增加，田中的秧苗初插、作物新种，最需要雨水的滋润。故谷雨前后江浙地区可能会出现诗句中的景象。\n本题为选非题，故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"5445713","cat":"科技常识","stem":"关于人体的生理现象，下列说法正确的是：","options":{"A":"人体在流汗时汗腺内的盐分浓度会降低","B":"蚊虫叮咬造成的皮肤发痒属于过敏反应","C":"打嗝声是由胃部痉挛和声带闭合造成的","D":"皮肤受伤流血处的血管会先扩张后收缩"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，汗液的形成一般是由于外界气温升高或者体内产热导致热刺激，激活汗腺功能，分泌大量液体，通过汗孔排到体表。由于汗腺还具备从产生出的汗液中再次将盐分吸收回体内的功能，所以通过再次吸收盐分，可以将盐分的流失抑制到最小程度。因此人体在流汗时汗腺内的盐分浓度会升高。\nB项正确，蚊虫叮咬引起的过敏症状有皮肤出现红肿、瘙痒，这是比较常见的过敏症状，也是比较轻微的过敏症状。出现这些症状是因为蚊虫叮咬所释放的唾液在皮肤组织产生刺激性的反应。\nC项错误，打嗝指气从胃中上逆，喉间频频作声，声音急而短促。这是一个生理上常见的现象，是由横膈膜痉挛收缩引起的。健康人打嗝多与饮食有关，特别是饮食过快、过饱，摄入很热或冷的食物饮料、饮酒等，外界温度变化和过度吸烟亦可引起。\nD项错误，当皮肤受伤流血后，血管会立即收缩，而不是先扩张后收缩。其收缩的目的是减少流向受伤部位的血液。过一段时间受伤部位的血液就会自动凝结变成血块，不让血液继续流出。\n故正确答案为B。","no":20,"missingImage":false}],"count":16,"answerable":16,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"5445692","cat":"逻辑填空","stem":"“双减”政策带给作业改革的最大变化，是理念的改变，让我们回到了作业的原点：为什么要布置作业？归根到底，是为了育人。这彻底扭转了之前作业管理中的“            ”现象，改变了传统作业管理中“眼中有作业、有分数，但唯独没有人”的痼疾，厘清了“好作业”的标准或者尺度。\n填入画横线部分最恰当的一项是：","options":{"A":"揠苗助长","B":"本末倒置","C":"缘木求鱼","D":"徒有其表"},"answer":"B","explanation":"根据横线后文可知，传统作业管理中存在“眼中有作业、有分数，但唯独没有人”的痼疾，而横线前文强调布置作业是为了育人。故横线处表达之前的作业管理中存在把育人与作业、分数的地位弄颠倒了的现象，B项“本末倒置”比喻把主要的和次要的、本质和非本质的关系弄颠倒了，符合文意，当选。\nA项“揠苗助长”比喻违反事物的发展规律，急于求成，反而坏事，文段未体现“违反事物的发展规律”，与文意不符，排除；C项“缘木求鱼”比喻行事方向、方法不对，一定达不到目的，D项“徒有其表”指空有其外表，不实在，均无法体现出“颠倒”的含义，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《作业改革应回到育人原点》","no":21,"missingImage":false},{"type":"question","qid":"5445696","cat":"逻辑填空","stem":"红树林的地下部分长期处于厌氧环境，减缓了根系和凋落物的分解速率，加速了碳埋藏速率。此外，红树林大多分布于沉积型海岸河口，由上游河流和海洋潮汐共同作用带来的大量外源性碳，被它们固定并快速沉积下来。这“            ”的组合拳使得红树林成为海岸带蓝碳碳汇的主要贡献者。\n填入画横线部分最恰当的一项是：","options":{"A":"取长补短","B":"标本兼治","C":"开源节流","D":"一举两得"},"answer":"C","explanation":"根据“减缓了根系和凋落物的分解速率，加速了碳埋藏速率”及“此外······由上游河流和海洋潮汐共同作用带来的大量外源性碳，被它们固定并快速沉积下来”可知，横线处体现红树林两方面的作用和好处，且双引号引导形象表达。C项“开源节流”比喻在财政经济上增加收入，节省开支，置于此处，“开源”可以对应红树林固定并沉积外源性碳，“节流”对应“减缓了根系和凋落物的分解速率”，符合文意，当选。\nA项“取长补短”表示在同类事物中吸取这个的长处来弥补那个的短处，文段并未涉及两者的“长处”与“短处”，与文意不符，排除；B项“标本兼治”指对事物的枝节和根本都加以治理，文段并未涉及“枝节”和“根本”，与文意不符，排除；D项“一举两得”意为做一件事得到两方面的好处，文段的结论仅提及“成为海岸带蓝碳碳汇的主要贡献者”这一个结果，并未体现出两方面的好处，与文意不符，排除。\n故正确答案为C。\n【文段出处】《会打“组合拳”的“武林高手”——红树林》","no":22,"missingImage":false},{"type":"question","qid":"5445704","cat":"逻辑填空","stem":"人造血即血氧液，能够用来代替人类血液，满足临床需求，缓解血液短缺状况。而且人造血标准化的生产流程能够确保其          ，输入人造血不用再担心会感染艾滋病、肝炎等疾病，可最大程度降低输血相关传染病的风险。因此，研制和批量生产人造血成为当前的热点。\n填入画横线部分最恰当的一项是：","options":{"A":"安全性","B":"可靠性","C":"规范性","D":"稳定性"},"answer":"A","explanation":"根据“输入人造血不用再担心会感染艾滋病、肝炎等疾病，可最大程度降低输血相关传染病的风险”可知，横线处所填词语应体现出人造血不会给人体造成危害之意。A项“安全性”指不受威胁、没有危险、危害、损失，符合文意，当选。\nB项“可靠性”指可以信赖，可以相信，侧重强调事物本身可以依靠或真实可信，与对人体没有危害无关，排除；C项“规范性”形容合乎一定标准的特点，D项“稳定性”指保持稳定不变的特点，均与文意不符，排除。\n故正确答案为A。\n【文段出处】人民网《将动物血变人血？硬核科技有望缓解临床血液短缺》","no":23,"missingImage":false},{"type":"question","qid":"5445710","cat":"逻辑填空","stem":"“反觇”思维是从事物甲和乙之间的联系，反推出乙同甲的另一种联系的方法。在作战指挥中，敢于“反道而觇之”，往往能跳出局部观全局、打破常规辟蹊径。面对复杂多变的战场形势，指挥员若能换位于敌、        定式，从侧面甚至反向来决策，及时        行动部署，就会拥有战场制敌的更大胜算。\n依次填入画横线部分最恰当的一项是：","options":{"A":"突破 扭转","B":"摒弃 校正","C":"摆脱 规划","D":"忽略 调整"},"answer":"B","explanation":"第一空，根据“、”可知，横线处与“换位于敌”构成并列关系，且根据前文“打破常规辟蹊径”可知，横线处应体现出站在敌人角度，打破常规定式之意，A项“突破”指打开缺口，超过或打破，B项“摒弃”指排除并抛弃，C项“摆脱”指脱离（牵制、束缚、困难等不利的情况），均符合文意，保留。D项“忽略”指疏忽，没有注意到，与文意不符，排除。\n第二空，搭配“行动部署”，且根据前文“面对复杂多变的战场形势”可知，横线处应体现及时调整改变行动部署之意，B项“校正”指校对改正，符合文意，当选。A项“扭转”指纠正或改变事物的发展方向，多搭配“局面”“态势”等，与“行动部署”搭配不当，排除；C项“规划”指筹划、计划，无法体现“调整改变”之意，且规划多用于事前筹划的语境，与文段“在作战指挥中”的语境不符，排除。\n故正确答案为B。\n【文段出处】解放军报《多一些“反觇”思维》","no":24,"missingImage":false},{"type":"question","qid":"5445715","cat":"逻辑填空","stem":"相比于其他全球卫星导航系统采取单一轨道星座构型，北斗系统            ，坚定选择了混合星座的特色发展之路，并首创短文通报模式，开创了通信导航一体化的独特服务模式，信息发送能力从一次120个汉字提升到一次1200个汉字，遇到突发情况时无需            ，足以将情节一次性说清楚。\n依次填入画横线部分最恰当的一项是：","options":{"A":"与众不同 言简意赅","B":"独树一帜 字斟句酌","C":"遥遥领先 删繁就简","D":"迎难而上 惜墨如金"},"answer":"B","explanation":"第一空，搭配“北斗系统”，且根据后文“特色发展之路”“首创短文通报模式，开创了······独特服务模式”可知，“北斗系统”与其他卫星导航系统不同，具有独特性。B项“独树一帜”指单独树立起一面旗帜，指自成一家，A项“与众不同”指与大家不一样，二者均能够体现出独特性，符合文意，保留；C项“遥遥领先”指远远地走在最前面，D项“迎难而上”形容不怕困难挫折，勇敢地挑战，二者均与文意无关，排除。\n第二空，对应前文“信息发送能力从一次120个汉字提升到一次1200个汉字”，后文“一次性说清楚”，可知，北斗系统信息发送能力得到提升，遇到突发情况不必过分推敲，删减字数。B项“字斟句酌”指写文章或说话慎重细致，一字一句地推敲琢磨，与文意相符，当选；A项“言简意赅”指语言简明而意思完备，“无需言简意赅”指的是表述啰嗦、繁复冗长，北斗系统的信息发送能力提升，并不意味着表述啰嗦、冗长，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《圆梦！中国北斗正式登上世界舞台》；中国经济网《“北斗三号”收官，正式服务全球》","no":25,"missingImage":false},{"type":"question","qid":"5445720","cat":"逻辑填空","stem":"课程思政的显性功能是提升课程的内涵和质量。不少教师认为课程思政是        于传统教学之外的附加行为，这种认识是错误的。对教学而言，课程思政不是            ，更不是特立独行，它首先是为提升教学质量服务的，是深层次的教学改革，因为只有高水平的教学活动才能吸引学生，进而影响学生。\n依次填入画横线部分最恰当的一项是：","options":{"A":"游离 喧宾夺主","B":"隔绝 照本宣科","C":"徘徊 削足适履","D":"独立 敷衍了事"},"answer":"A","explanation":"第一空，根据“传统教学之外的附加行为”可知，横线处所填词语应体现在不少教师的认知中，课程思政并不包含在传统教学之中，A项“游离”比喻离开集体或依附的事物而存在，D项“独立”指脱离原来所属单位成为另一单位或不依靠他人，均可体现课程思政不属于传统教学，符合文意，保留。B项“隔绝”指隔断，一般用于强调空间上的隔断，置于此处强调课程思政与传统教学是隔断的、没有联系，与文中的“附加行为”表意矛盾，排除；C项“徘徊”指在一个地方来回地走，比喻犹豫不决，也比喻事物在某个范围内来回浮动、起伏，文中仅体现课程思政不属于传统教学，并未涉及课程思政在某个范围内来回浮动，与文意不符，排除。\n第二空，根据后文“更不是特立独行，它首先是为提升教学质量服务的，是深层次的教学改革”可知，横线处所填成语要体现课程思政与教学之间的关系，强调其不仅不是独立的，而且是为教学服务的，有其自身的重要价值，A项“喧宾夺主”比喻客人占了主人的地位或外来的、次要的事物侵占了原有的、主要的事物的地位，与横线前的否定词连用，可与后文的“更不是特立独行”构成递进关系，符合文意，当选。D项“敷衍了事”指办事马马虎虎，只求应付过去就算完事，与横线前的否定词连用，指不马虎，认真，与文意无关，排除。\n故正确答案为A。\n【文段出处】《课程思政——如何在知识传授中呈现思政元素》","no":26,"missingImage":false},{"type":"question","qid":"5445726","cat":"逻辑填空","stem":"翻开古代农书，几千年间古人对于土地的保养，几乎与当代耕作学关注的措施            ，其中历代农书涉及最多的是施肥。在中国古人的摸索中，施肥成为一种讲究，何时、何地施肥，施何种肥，怎样施肥，形成了一个        的体系，在每个年度的农业生产进程中，精心安排在各个时节。\n依次填入画横线部分最恰当的一项是：","options":{"A":"一脉相承 科学","B":"如出一辙 固定","C":"别无二致 完整","D":"不谋而合 复杂"},"answer":"C","explanation":"第一空，形容古人对土地的保养方法与当代耕作措施的关系。B项“如出一辙”比喻两件事情非常相似，C项“别无二致”指区分不出两者的差别，D项“不谋而合”指事先没有商量过，意见或行动却完全一致，均有相似之意，符合文段语境，保留。A项“一脉相承”比喻某种思想、行为或学说之间有继承关系，一般用法为“现在的情况”和“之前的情况”一脉相承，不能说“古人的做法”与“当代的措施”一脉相承，用法不当，排除。\n第二空，根据“何时、何地施肥，施何种肥”“精心安排在各个时节”可以看出，古人经过摸索，施肥的措施已经十分完善和周到。C项“完整”指具有或保持着应有的部分，没有损坏或残缺，符合文意，当选。B项“固定”指不变动或不移动的，文段并没有体现出“不变”，排除；D项“复杂”指（事物的种类、头绪等）多而杂，文段没有体现出“复杂”，且感情色彩较为消极，排除。\n故正确答案为C。\n【文段出处】《古代农业中的人地关系》","no":27,"missingImage":false},{"type":"question","qid":"5445746","cat":"逻辑填空","stem":"指尖上的形式主义是“以痕迹论政绩”的错误政绩观，关注点在于形式美观，而        了根本政绩——人民群众的满意度。指尖上减负就是要把基层干部从            的“虚功”中解救出来，务求实效、扎根基层，用实践检验政绩，把工作落实与否、群众满意与否作为衡量政绩的客观标准。\n依次填入画横线部分最恰当的一项是：","options":{"A":"偏离 阳奉阴违","B":"遗忘 哗众取宠","C":"淡化 花拳绣腿","D":"忽视 华而不实"},"answer":"D","explanation":"本题从第二空入手，横线处搭配“虚功”，由前文“关注点在于形式美观······满意度”以及后文“务求实效、扎根基层”可知，横线处所填成语应体现出“不务实、只注重形式”之意。C项“花拳绣腿”比喻只做些表面上好看实际上并无用处的工作，D项“华而不实”比喻外表好看而内容空虚，二者均符合文意，保留。A项“阳奉阴违”指表面上遵从，暗地里违背，B项“哗众取宠”指用浮夸的言词或做作的行动去迎合群众，以博取好感和支持，二者均与“不务实”无关，排除。\n第一空，根据横线前“关注点在于形式美观”可知，横线处应体现出对“根本政绩”不关注、不重视之意。D项“忽视”指疏忽，不重视，符合文意，当选。C项“淡化”指逐渐冷淡下来，变得不被重视或无关紧要，文段并没有体现出从重视到不重视这个“逐渐冷淡”的过程，与文意不符，排除。\n故正确答案为D。\n【文段出处】《破除“指尖上的形式主义”》","no":28,"missingImage":false},{"type":"question","qid":"5445754","cat":"逻辑填空","stem":"我们确立和坚持马克思主义在意识形态领域指导地位的根本制度，新时代党的创新理论            ，社会主义核心价值观广泛传播，中华优秀传统文化得到创造性转化、创新性发展，文化事业日益繁荣，网络生态持续向好，意识形态领域形势发生          、根本性转变。\n依次填入画横线部分最恰当的一项是：","options":{"A":"振聋发聩 历史性","B":"深入人心 全局性","C":"高屋建瓴 实质性","D":"硕果累累 显著性"},"answer":"B","explanation":"第一空，搭配“党的创新理论”，且根据“社会主义核心价值观广泛传播”可知，横线处应体现党的创新理论得到广泛传播之意，B项“深入人心”指理论、学说、政策等为人们深切了解和信服，可以体现出被人们了解、得到广泛传播之意，保留。A项“振聋发聩”比喻用语言文字唤醒糊涂麻木的人，使他们清醒过来，侧重说的话非常正确，能对大家产生影响，文段并非强调产生影响，排除；C项“高屋建瓴”指对事物把握全面，了解透彻，D项“硕果累累”本义是指秋天丰收时树上的果实茂盛的样子，现在常引申为某人的作品很多，取得了很大的成就，均无法表示得到广泛传播之意，排除。\n第二空，代入验证，根据顿号可知，横线处与“根本性”表意接近，B项“全局性”强调的是整个局面，可以与“根本性”形成对应，当选。\n故正确答案为B。\n【文段出处】新华网《高举中国特色社会主义伟大旗帜 为全面建设社会主义现代化国家而团结奋斗》","no":29,"missingImage":false},{"type":"question","qid":"5445758","cat":"逻辑填空","stem":"补齐公共服务短板，首先要善于发现深层次问题。要深入调研、综合分析、精准掌握，弄清问题的本质和关键，做到            。同时，补齐公共服务短板不是简单地打打补丁，也不会            。有一些短板和弱项是随着时代发展而凸显的系统性问题，只有通过推动经济社会高质量发展才能从根本上解决。\n依次填入画横线部分最恰当的一项是：","options":{"A":"循序渐进 一成不变","B":"细致入微 完美无缺","C":"一针见血 水到渠成","D":"有的放矢 一劳永逸"},"answer":"D","explanation":"第一空，根据“要深入调研、综合分析、精准掌握，弄清问题的本质和关键”可知，横线处强调要依据问题的本质和关键有针对性地补齐短板。C项“一针见血”比喻说话直截了当，切中要害，D项“有的放矢”比喻说话做事有针对性，均能体现出有针对性，保留。A项“循序渐进”指（学习、工作等）按照一定的步骤逐渐深入或提高，侧重强调按步骤，此处并无要按步骤行事的意思，与语境无关，排除；B项“细致入微”比喻看问题非常全面，连很细小的问题都考虑到了，侧重强调“细微”，与语境无关，排除。\n第二空，根据后文“有一些短板和弱项是随着时代发展而凸显的系统性问题”可知，公共服务的短板会随时代变化而变化，不是一次性就能补齐的。D项“一劳永逸”指辛苦一次，把事情办好，以后就不再费事了，符合文意，当选。C项“水到渠成”比喻条件成熟，事情自然成功，与后文“随着时代发展而凸显的系统性问题”这一语境无关，排除。\n故正确答案为D。\n【文段出处】《加快补齐公共服务短板——扎实开展“我为群众办实事”系列谈之四》","no":30,"missingImage":false},{"type":"question","qid":"5445767","cat":"逻辑填空","stem":"对于新业态新模式冲击本地的传统产业，是包容审慎，还是            ？对于非本地人才就业创业、非本地企业项目立项推广，能否            ，甚至千方百计降门槛、清路障以留人留项目？纵观先进制造业集群所在地，无一不是当地政府部门怀着“开放之心”，营造出良好的创新生态。\n依次填入画横线部分最恰当的一项是：","options":{"A":"如芒在背 一视同仁","B":"退避三舍 不偏不倚","C":"拒之门外 开诚布公","D":"推三阻四 海纳百川"},"answer":"A","explanation":"第一空，根据“是······还是”可知，横线处与“包容审慎”构成反义并列，体现出与“包容”相对的态度，即不接受新业态、新模式。A项“如芒在背”意为像芒刺扎在背上一样，形容坐立不安，C项“拒之门外”意为把人挡在门外，形容拒绝协商或共事，D项“推三阻四”意为以各种借口推托，三者均符合文意，保留。B项“退避三舍”泛指对人让步，不与相争，与文意不符，排除。\n第二空，依据“甚至千方百计降门槛、清路障以留人留项目”可知，横线处所填内容与后文相似，但是程度比后文轻，且横线处修饰“当地部门”与“非本地人才、非本地企业项目”关系。A项“一视同仁”意为同样看待，不分亲疏厚薄，能够表达当地部门对待本地创业的人和项目与非本地创业的人和项目同等看待、公平公正的态度，“同等看待”到“对非本地人才、非本地企业项目有政策倾斜”，能够形成很好的语义加重，当选。C项“开诚布公”意为诚意待人，坦白无私，强调真诚、坦诚、坦白，和后文的“政策倾斜”无法构成递进关系，排除。D项“海纳百川”比喻接纳和包容的东西非常广泛，而且数量很大，用于此处程度过重，且与后文的递进关系不及A项准确，排除。\n故正确答案为A。\n【文段出处】《开放是创新的最佳滋养（观象台）》","no":31,"missingImage":false},{"type":"question","qid":"5445772","cat":"逻辑填空","stem":"法律惩罚的正当性一定程度上源于公众朴素的道德期待。在具体执法时，不能仅仅        地依赖客观后果，进行简单归责和惩戒，而应全面考察当事人的主观认知、动机目的等情节，并综合        其社会危害性，由此来审慎决定是否启动惩罚机制。\n依次填入画横线部分最恰当的一项是：","options":{"A":"机械 评估","B":"单纯 辨别","C":"盲目 分析","D":"草率 判断"},"answer":"A","explanation":"第一空，形容对客观后果的依赖，根据“不能······而应······”可知，横线处与“全面考察”语意相反，应体现出对客观后果的绝对依赖，而不考虑其他方面之意，A项“机械”意为方式拘泥死板，B项“单纯”意为简单、不复杂、单一，填入此处均能体现对客观后果的绝对依赖，保留。C项“盲目”意为认识不清，D项“草率”意为不认真、敷衍了事，均与文意不符，排除。\n第二空，搭配“社会危害性”，A项“评估”意为评价估量，填入此处，“评估社会危害性”为常见搭配，当选。B项“辨别”意为对不同的事物在认识上加以区别，通常搭配“真伪”“好坏”等，与“社会危害性”搭配不当，排除。\n故正确答案为A。\n【文段出处】《“以罚代征”案中的法律认识错误》","no":32,"missingImage":false},{"type":"question","qid":"5445774","cat":"逻辑填空","stem":"在普通人看来，法律都是            的，自己一辈子都不会和法律打交道。但在瞬息万变的社会里，人们随时可能触及法律的红线。很多人平时法律观念和意识不强，柔性执法不仅可以起到        作用，而且有利于提高群众的学法懂法意识。\n依次填入画横线部分最恰当的一项是：","options":{"A":"高高在上 教育","B":"高深莫测 预防","C":"遥不可及 警戒","D":"事不关己 提醒"},"answer":"C","explanation":"第一空，横线后出现关联词“但”表示转折，前后语义相反。根据后文“自己一辈子都不会和法律打交道”、“人们随时可能触及法律的红线”可知，横线处所填成语应体现普通人认为与“法律”存在距离感，法律离生活很遥远。C项“遥不可及”指非常遥远而不可到达，D项“事不关己”指事情同自己没有关系，均符合文意，保留。A项“高高在上”形容领导者脱离群众，不深入实际，与“法律”搭配不当，排除；B项“高深莫测”指高深的程度无法揣测，形容使人难以理解，与“距离遥远”无关，与后文无法构成转折，排除。\n第二空，所填词语表示“柔性执法”的作用，C项“警戒”表示警示告诫，使人注意，D项“提醒”表示从旁指点，引起注意，“执法”对于可能触及法律红线的行为不是通过语言提醒，而是起到警示的作用，“警戒”填入文段更加恰当，排除D项。\n故正确答案为C。\n【文段出处】《柔性执法兼容法理与人情》","no":33,"missingImage":false},{"type":"question","qid":"5445776","cat":"逻辑填空","stem":"长期以来，城管执法部门对职责内的执法事项通常是        “用力”，对所有的执法对象“一碗水端平”，以体现执法的公平性、公正性。但对于超大城市而言，由于城管执法事项繁多，涉及市场主体庞杂，而城管执法力量是有限的，实践中很难做到            ，进而可能会影响执法效果和执行力。\n依次填入画横线部分最恰当的一项是：","options":{"A":"精准 滴水不漏","B":"均衡 百无一失","C":"精确 精益求精","D":"平均 面面俱全"},"answer":"D","explanation":"第一空，根据后文“对所有的执法对象‘一碗水端平’，以体现执法的公平性、公正性”可知，横线处要体现出城管执法部门对职责内的执法事项不偏不倚，B项“均衡”指平衡，D项“平均”指没有轻重或多少的分别，均符合文意，保留。A项“精准”指非常准确，精确，C项“精确”指非常准确，文段并非要表达执法的准确性，均与文意不符，排除。\n第二空，根据“由于城管执法事项繁多，涉及市场主体庞杂，而城管执法力量是有限的”，且横线前有“很难做到”的表述可知，横线处要体现执法全面没有遗漏之意，D项“面面俱全”指各方面都能照顾到，没有遗漏疏忽，符合文意，当选。B项“百无一失”形容极有把握，不会出差错，文段并未体现把握大，不出差错之意，与文意不符，排除。\n故正确答案为D。\n【文段出处】中工网-工人日报《期待分类分级执法推动城市治理效能提升》","no":34,"missingImage":false},{"type":"question","qid":"5445701","cat":"逻辑填空","stem":"开展未成年人网络环境整治，势在必行且            。网络上可能存在的色情、暴力、过度娱乐等有害信息，会对普遍拥有智能设备、全面触网的未成年人产生潜移默化的不良影响。只有        清朗洁净的网络空间，才能让青少年健康成长。实现这一愿景，需要发挥多主体多领域联动优势，        合力，撑起清朗网络蓝天。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蓄势待发 创设 形成","B":"刻不容缓 营造 凝聚","C":"迫在眉睫 构筑 集成","D":"任重道远 共建 汇聚"},"answer":"B","explanation":"第一空，根据“势在必行”“网络上可能存在的色情······不良影响”可知，文段表达“开展未成年人网络环境整治”的必要性及紧迫性，故横线处应体现亟需采取行动之意，B项“刻不容缓”形容形势非常紧迫，片刻也不能拖延，C项“迫在眉睫”比喻事情已到眼前，急迫得就像逼近了眉毛和睫毛一样，二者均与文意相符，保留。A项“蓄势待发”指贮备随时可以展现的实力，待机而发，D项“任重道远”比喻肩负的责任重大，并需要长期的艰苦努力，二者均无法体现事情的紧迫性，排除。\n第二空，搭配“网络空间”，B项“营造”指有目的、有计划地造，C项“构筑”指构建，二者均搭配恰当，保留。\n第三空，搭配“合力”，根据前文“需要发挥多主体多领域联动优势”这一对策可知，横线处需体现将多方力量集中在一起共同发力的过程，B项“凝聚”指聚集，与文意相符且搭配恰当，当选。C项“集成”指总体，强调结果，与文意不符，排除。\n故正确答案为B。\n【文段出处】《多方发力，为未成年人撑起清朗网络蓝天》","no":35,"missingImage":false},{"type":"question","qid":"5445708","cat":"逻辑填空","stem":"随着技术发展，以数字手段为支撑的“沉浸式”“交互式”网上博物馆日益增多，提高了展览的          。但随着智能终端的普及，人们难免会对数字博物馆产生        。博物馆在利用数字技术的基础上，也不能忽视实物展览内涵的提升，使之兼备文化和教育功能，突出            的特点。\n依次填入画横线部分最恰当的一项是：","options":{"A":"科技性  排斥  润物无声","B":"便捷性  厌倦  触手可及","C":"趣味性  疲劳  寓教于乐","D":"交融性  失望  与时俱进"},"answer":"C","explanation":"本题可从第三空入手，根据横线前“博物馆在利用数字技术的基础上······兼备文化和教育功能”可知，横线处应表达数字博物馆能够通过“沉浸式”“交互式”的方式使人们在娱乐中受到教育之意。C项“寓教于乐”指把教育跟娱乐融合为一体，使人在娱乐中受到教育，符合文意，保留。A项“润物无声””指有大胸怀者，做了贡献而不张扬，默默奉献，文段并未体现出“默默奉献”之意，与文意不符，排除；B项“触手可及”指一伸手便可接触到，形容距离很近，文段此处强调的是数字博物馆在“文化和教育”上的特点，并非强调“距离很近”，与文意不符，排除；D项“与时俱进”指随着时代的发展而不断发展、前进，与文意无关，排除。\n第一空，代入验证。C项“趣味性”强调能够使人感到愉快，引起兴趣的特性，与横线前“‘沉浸式’‘交互式’网上博物馆”对应恰当，符合文意，保留。\n第二空，代入验证。C项“疲劳”指因体力或脑力消耗过多而需要休息，置于此处强调智能终端普及之后，人们会对数字博物馆失去新鲜感之意，符合文意，当选。\n故正确答案为C。\n【文段出处】光明日报《发挥好博物馆的教育功能》","no":36,"missingImage":false},{"type":"question","qid":"5445714","cat":"逻辑填空","stem":"传统戏曲中所蕴含的价值理念以及            的表演节奏，很难与当代青年人的生活节奏与审美趣味相合拍。因而，关于戏曲衰亡的声音            。事实上，戏曲相对于互联网时代知识文化的           、快餐式传播，其可重复欣赏和耐咀嚼的品格显得更为可贵，其特有的艺术价值决定了它不可能退出历史舞台，更不会走向消亡。\n依次填入画横线部分最恰当的一项是：","options":{"A":"不疾不徐 如雷贯耳 碎片化","B":"从容不迫 不绝于耳 肤浅化","C":"四平八稳 甚嚣尘上 机械化","D":"慢条斯理 此起彼伏 泡沫化"},"answer":"D","explanation":"第一空，横线处所填成语应体现出传统戏曲表演节奏的特点。A项“不疾不徐”指处事能掌握适度的节律，不太快或不太慢，B项“从容不迫”形容遇事镇定自若，不慌不忙，C项“四平八稳”形容做事只求不出差错，缺乏创新精神，也可指说话、做事稳当，D项“慢条斯理”指说话做事慢腾腾，不慌不忙，均可体现出传统戏曲表演节奏的特点，保留。\n第二空，搭配“声音”。B项“不绝于耳”指声音在耳边不断鸣响，C项“甚嚣尘上”多指某种言论十分嚣张，也比喻对传闻之事议论纷纷，D项“此起彼伏”形容高潮迭起，从未止息，均与“声音”搭配恰当，保留。A项“如雷贯耳”指像雷声传入耳朵，形容名声很大，此处“声音”并非人的名声，与“声音”搭配不当，排除。\n第三空，顿号表并列，故横线处所填词语与“快餐式”构成近义并列，应体现出“快”之意，且由后文“可重复欣赏和耐咀嚼”可知，横线处所填词语也应体现出互联网时代知识文化不可重复的特点。D项“泡沫化”比喻某一事物所存在的表面上繁荣、兴旺而实际上虚浮不实，像泡沫一样，一碰就破，瞬间消失，可体现出“快且不可重复”之意，符合文意，当选。B项“肤浅化”指局限于表面的、浅薄的、不深刻的，强调不深刻，C项“机械化”形容事物如机械动作般缺少变化，强调缺少变化、不灵活，均无法与“快”、“可重复欣赏和耐咀嚼”进行对应，与文意不符，排除。\n故正确答案为D。\n【文段出处】中国作家网《中国戏曲现状观察之一：信息时代说戏曲》","no":37,"missingImage":false},{"type":"question","qid":"5445719","cat":"逻辑填空","stem":"没有中华文化沃土的滋养，就不可能有中国特色社会主义制度的            。我们过去对制度的实践基础强调比较多，对制度的文化支撑关注不够。其实，制度绝不只是一系列外在的        行为规范，还是内在的文化思维价值认同。这种文化不可能是外来的强加或移植，必须是内在的演化和        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"勃勃生机  强制性  积淀","B":"枝繁叶茂  约束性  渗透","C":"历久弥新  指导性  转化","D":"欣欣向荣  系统性  升华"},"answer":"A","explanation":"第一空，根据“没有中华文化沃土的滋养”可知，横线处体现中国特色社会主义制度发展好之意，且与“沃土”构成形象表达对应，A项“勃勃生机”形容生命力旺盛的样子，B项“枝繁叶茂”形容枝叶繁密茂盛，D项“欣欣向荣”指草木长得茂盛，生机勃勃的样子，均符合文意，保留。C项“历久弥新”指经历长久的时间而更加鲜活，更加有活力，更显价值，无法与“沃土”构成形象表达对应，不符合语境，排除。\n第二空，根据“这种文化不可能是外来的强加或移植”可知，横线处应体现制度绝不只是一系列强行规范性的约束，A项“强制性”指必须依照法律适用、不能以个人意志予以变更，B项“约束性”有限制、管束使不越出范围之意，均符合文意，保留。D项“系统性”强调的是整体性，与文意不符，排除。\n第三空，根据文意可知，横线处应体现文化的内在发展，A项“积淀”形容一些非物质化（如精神、品质、文化等）的积累过程，符合文意，当选。B项“渗透”指液体缓慢地透到里面或比喻一种思想或势力逐渐向其它方面扩展，无法体现文化的内在发展，排除。\n故正确答案为A。\n【文段出处】中国青年网《迈向伟大复兴的制度自信》","no":38,"missingImage":false},{"type":"question","qid":"5445727","cat":"逻辑填空","stem":"环境整治关键要不留死角、不存盲点，光靠人为监管恐怕会            。目前，“互联网＋”数字技术已成为环境监测的利器，为生态环境监测布下“天罗地网”。这张网使任何“            ”都能充分暴露在数据“阳光”之下，让环境监测和污染防治变得更加        、更加具象。\n依次填入画横线部分最恰当的一项是：","options":{"A":"捉襟见肘 一举一动 有效","B":"力不从心 风吹草动 精细","C":"顾此失彼 小打小闹 动态","D":"收效甚微 蛛丝马迹 直观"},"answer":"B","explanation":"第一空，根据“环境整治关键要不留死角、不存盲点”可知，横线处应体现出光靠人为监管恐怕不够之意，A项“捉襟见肘”指顾此失彼，应付不过来，B项“力不从心”指心里想做，可是能力或力量够不上，C项“顾此失彼”指顾了这个，顾不了那个，均符合文意，保留。D项“收效甚微”指付出的努力基本没什么效果，文段强调的是只靠人为监管可能会不够，而不是人为的监管基本没有效果，置于此处程度过重，排除。\n第二空，横线处应体现出“为生态环境监测布下‘天罗地网’”的结果，即这张网能够让任何小的变动暴露在数据下之意，A项“一举一动”指人的每一个动作，B项“风吹草动”比喻轻微的动荡或变故，均符合文意，保留。C项“小打小闹”指小规模、零零碎碎地做事，文段并无做事规模大小之意，排除。\n第三空，横线处对应前文“充分暴露在数据‘阳光’之下”，且与“具象”构成并列关系，应体现出环境监测和污染防治能够更加具体之意，B项“精细”指精密细致，符合文意，当选。A项“有效”指能实现预期目的，有效果，无法与“具象”构成并列关系，排除。\n故正确答案为B。\n【文段出处】《用好环境监测的“智慧大脑”》","no":39,"missingImage":false},{"type":"question","qid":"5445730","cat":"逻辑填空","stem":"竞争与创新总是            。平台反垄断最终要在抑制垄断与鼓励创新之间达到平衡。一方面，要加快健全市场准入制度、公平竞争审查机制，预防和        滥用行政权力限制竞争，充分        市场竞争机制的强大动能；另一方面，要引导和激励平台企业把更多精力用在创新上。唯有如此，平台经济方能为全社会注入持久的创新活力。\n依次填入画横线部分最恰当的一项是：","options":{"A":"如影随形  约束  调控","B":"互为表里  杜绝  挖掘","C":"相辅相成  打击  激发","D":"息息相关  制止  释放"},"answer":"D","explanation":"第一空，根据“平台反垄断最终要在抑制垄断与鼓励创新之间达到平衡”可知，竞争与创新二者关系是密切的，横线处所填成语应体现两者之间的关系非常密切，A项“如影随形”比喻两个事物关系密切或两个人关系密切不能分离，D项“息息相关”指彼此呼吸都相互关联，形容关系非常密切，均符合文意，保留。B项“互为表里”指甲为乙的外表，乙为甲的内里，比喻互相依存，互相接受，文段并非强调二者是互相依存的关系，与文意不符，排除；C项“相辅相成”指两件事物互相配合，互相补充，缺一不可，文段侧重强调的是竞争与创新之间有密切的关系，而非强调二者互相配合，互相补充，与文意不符，排除。\n第二空，根据“要加快健全市场准入制度、公平竞争审查机制”可知，横线处所填词语应体现要营造公平竞争的环境，使滥用行政权力限制竞争这类行为不再发生，D项“制止”指强迫使停止，不允许继续，符合文意，保留。A项“约束”指限制管束使不越出范围，置于此处程度过轻，文段强调的是“使之不再发生”，排除。\n第三空，代入验证，横线处所填词语搭配“动能”，根据文意可知，需体现发挥市场竞争机制的强大动能的含义，D项“释放”符合文意，且与“动能”为常见搭配，当选。\n故正确答案为D。\n【文段出处】广州日报《平台反垄断要用好“两手”》","no":40,"missingImage":false},{"type":"question","qid":"5445735","cat":"片段阅读","stem":"当前，社会治理形势复杂，仅靠职能部门、专业力量远远不够，迫切需要人民群众和社会各界的积极支持与参与，共同创造公共价值。众包是公众和外包的组合词，意指发包方依托互联网或其衍生工具，在数字平台上设计规则与任务并向广泛、非确定的公众发包，公众根据自身能力自愿接包并完成特定事务。众包强调大众参与的开放式合作，促使组织边界向更广泛的大众群体开放，旨在挖掘隐藏在公众中的巨大潜力。因此，相较于政府购买等专业性较强的政府合同外包服务，政府众包展现出更开放的社会治理格局。\n最适合做这段文字标题的是：","options":{"A":"众包：共享经济下的新型用工模式","B":"政府众包：公众参与社会治理新方式","C":"公众参与：开放式合作的新形式","D":"“互联网+”：公共管理新范式"},"answer":"B","explanation":"文段开篇交代背景，指出社会治理形势存在的问题，并论述其需要人民群众和社会各界共同创造公共价值。接着引出“众包”的话题并给出定义，即公众可根据自身能力自愿接包并完成特定事务。接下来指出众包强调大众参与，旨在挖掘公众潜力。最后尾句通过“因此”总结前文，得出结论，并通过程度词“更”强调政府众包可以让社会治理格局更加开放。故文段重点围绕“政府众包”进行论述，强调其可解决当下社会治理存在的问题，对应B项。\nA项，“共享经济”为文段未提及内容，无中生有，且“众包”将文段核心话题“政府众包”范围扩大，排除；\nC项，缺少文段核心话题“政府众包”，排除；\nD项，“互联网+”为文段未提及内容，无中生有，且缺少文段核心话题“政府众包”，排除。\n故正确答案为B。\n【文段出处】中国社会科学网《政府众包：公众参与社会治理的新趋势》","no":41,"missingImage":false},{"type":"question","qid":"5445689","cat":"片段阅读","stem":"在市场经济时期，劳动密集型制造工厂普遍采用流水线技术，工人被高度“去技能化”，几乎不需要技能便可完成装配操作，企业没有需求也没有动力去培养中高级技术工人。但是，当一个国家的产业结构向中高端迈进时，高水平职业教育的支撑作用就会显现出来。技术进步与人力资本相互影响、相互促进：企业引进的高端生产线，需要技术工人去操作和维护，否则技术改造和升级就无法实现；如果没有配套的职业技能培训体系，企业的转型升级就难以达到预期效果。\n这段文字意在说明：","options":{"A":"产业结构转型升级需要职业教育的支撑","B":"技术进步对人力资本提出了更高要求","C":"“技工荒”会随产业结构升级更趋严重","D":"职业技能培训需求与经济增长有相关性"},"answer":"A","explanation":"文段开篇介绍了在市场经济时期，流水线上的工人几乎不需要技能便可完成装配操作，企业无需去培养中高级技术工人，随后通过转折词“但是”提出观点，即在产业结构向中高端升级时，高水平职业教育会起着支撑作用。尾句通过对技术进步和人力资本的双向作用进行阐述，进一步支撑论证了转折后的观点。故文段重点在转折之后，强调高水平职业教育对于产业结构升级的支撑作用，对应A项。\nB项，缺少主题词“职业教育”和“产业结构”，偏离文段核心话题，排除；\nC项，“技工荒”无中生有，且缺少主题词“职业教育”，偏离文段核心话题，排除；\nD项，“经济增长”偷换概念，文段重在强调职业教育对于产业结构升级的支撑作用，排除。\n故正确答案为A。\n【文段出处】《向上的阶梯——经济转型时期新技术工人的社会流动》","no":42,"missingImage":false},{"type":"question","qid":"5445691","cat":"片段阅读","stem":"作为经典的艺术门类，绘画在历史长河中并非独立发展。在原始艺术中，音乐、诗歌、舞蹈三位一体，密不可分，绘画则将载歌载舞的场景留存于世。不同艺术门类成熟之后各自独立，但在发展的过程中又相互吸收、相互依托、相互影响。各艺术门类之间的吸收与借鉴、配合与结合，是艺术发展创新的重要手段。古典名画是人类审美情趣的集中体现，很长一段时间是深藏在博物馆中的高雅艺术，名画想要真正“活”化，还需要借助跨界融合。\n这段文字意在强调：","options":{"A":"绘画是诗歌和舞蹈传承的重要载体","B":"不同艺术门类的跨界融合由来已久","C":"古典名画可以借助跨界融合重焕生机","D":"打破形式壁垒是艺术创新的重要手段"},"answer":"C","explanation":"文段开篇引出绘画发展的话题，随后指出绘画可留存载歌载舞的场景。紧接着通过转折关联词“但”强调不同艺术门类在成熟后的发展过程中是相互借鉴的，并表明此种方式对艺术发展创新很重要。接下来指出古典名画是一种高雅艺术，尾句通过“需要”引出对策，强调古典名画需要借助跨界融合来实现“活”化。故文段强调古典名画需要跨界融合，核心话题为“古典名画”“跨界融合”，对应C项。\nA项，对应文段转折之前的内容，非重点，且偏离文段核心话题“古典名画”“跨界融合”，排除；\nB、D两项，均偏离文段核心话题“古典名画”，排除。\n故正确答案为C。\n【文段出处】人民网《名画“活”了 传统文化“火”了》","no":43,"missingImage":false},{"type":"question","qid":"5445693","cat":"片段阅读","stem":"火山灰是指火山爆炸性喷发形成的，直径小于2毫米的喷发碎屑。在爆炸性火山活动中，围岩和岩浆被炸碎成细小的颗粒，形成火山灰。火山灰从火山口喷发到大气中，经过大气搬运再沉降到各类环境中，整个过程通常只有数年，从地质时间尺度来看，几乎只是瞬间。所以在各种地质记录中，火山灰是一种高精度的绝对时间标志层。火山灰年代学正是利用地质记录中的火山灰层来确定地质年代的科学，该学科可以解决一些重要的科学问题，比如大型火山喷发事件与气候变化、人类演化之间的关系，以及气候快速变化的区域差异等。\n这段文字主要介绍了：","options":{"A":"火山灰的形成过程与主要特点","B":"火山灰年代学的研究思路和价值","C":"火山灰在自然环境中的分布状态","D":"火山喷发对环境和人类的影响"},"answer":"B","explanation":"文段开篇引出火山灰的话题，并指出其形成与爆炸性火山活动有关，紧接着又指出火山灰形成的过程非常的短暂，随后通过结论词“所以”进行总结，指出在各种地质记录中，火山灰是一种高精度的绝对时间标志层，接着通过程度词“正是”强调，火山灰年代学是利用地质记录中的火山灰层来确定地质年代的科学，并且其可以解决一些重要的科学问题，最后通过“比如”进行举例说明。故文段重点强调了火山灰年代学是一门利用火山灰层来确定地质年代的科学，并且还可以解决一些重要的科学问题，对应B项。\nA项，“火山灰的形成过程”对应文段开篇，属于分述句部分内容，非重点，排除；\nC项，偏离文段核心话题“火山灰年代学”，且“分布状态”文段并未提及，无中生有，排除；\nD项，偏离文段核心话题“火山灰年代学”，且“火山喷发对环境和人类的影响”文段并未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《我科学家用贝叶斯统计方法厘清了准确的火山喷发年龄》","no":44,"missingImage":false},{"type":"question","qid":"5445698","cat":"语句表达","stem":"。十八大以来，国内外形势新变化和实践新要求，迫切需要我们从理论和实践的结合上深入回答关系党和国家事业发展、党治国理政的一系列重大时代课题。我们党勇于进行理论探索和创新，以全新的视野深化对共产党执政规律、社会主义建设规律、人类社会发展规律的认识，取得重大理论创新成果，集中体现为新时代中国特色社会主义思想。\n填入画横线部分最恰当的一项是：","options":{"A":"马克思主义是我们立党立国、兴党兴国的根本指导思想","B":"坚持和发展马克思主义，必须同中华优秀传统文化相结合","C":"我们必须坚定历史自信、文化自信，坚持古为今用、推陈出新","D":"推进马克思主义中国化时代化是一个追求真理、揭示真理、笃行真理的过程"},"answer":"D","explanation":"横线出现在文段开头，需结合后文内容进行分析。文段先交待理论需结合实践，后文说明探索理论、创新理论的成果即为新时代中国特色社会主义思想。故理论结合实践中实践指的是中国实际发展情况。故整个后文着重说明了理论需结合中国实际发展情况，对应D项，且“追求真理”对应文段“进行理论探索和创新”，“揭示真理”对应文段“取得重大理论创新成果”。\nA项，仅强调了理论的重要性，而文段强调的是理论与中国实际发展情况相结合，与D项相比，与后文衔接不当，排除；\nB项，“中华优秀传统文化”后文并未提及，无中生有，与后文衔接不当，排除；\nC项，“文化自信”后文并未提及，无中生有，与后文衔接不当，排除。\n故正确答案为D。\n【文段出处】《求是网评论员：坚持和发展马克思主义必须做好“两个结合”》","no":45,"missingImage":false},{"type":"question","qid":"5445703","cat":"片段阅读","stem":"肺鱼是一类可用“肺”呼吸的肉鳍鱼，它们的“肺”是特化的鱼鳔，能吸收空气。这一特殊技能使其可以摆脱水的束缚，在河水干涸时潜入洞穴，躲在分泌物形成的茧中，等待雨季到来。此外，肺鱼还是能“啃硬骨头”的鱼，它们咬合力强大，一些带壳的无脊椎动物也是其捕食对象，这种能吃带壳动物的能力，被称为食壳性或甲食性。泥盆纪早期的奇异鱼被认为是最原始的肺鱼，已经具有典型的肺鱼食壳性特征，比如有发达的齿板与短而粗壮的下颌。而杨氏鱼的系统发育位置较奇异鱼更为原始，是研究肺鱼类食壳性起源的关键。\n这段文字接下来最可能介绍：","options":{"A":"关于杨氏鱼的最新研究成果","B":"动物食壳性特征的产生原因","C":"肺鱼在生物演化史上的重要意义","D":"杨氏鱼与其他泥盆纪物种的区别"},"answer":"A","explanation":"根据提问方式可知，本题为接语选择题。文段开篇介绍肺鱼是可用“肺”呼吸的肉鳍鱼，接着介绍肺鱼这一特殊技能在河水干涸时的作用，后文介绍肺鱼的咬合力强大，具有吃带壳动物的能力，并介绍此种能力被称为食壳性或甲食性，接着指出奇异鱼被认为是最原始的肺鱼，其已经具有食壳性特征，尾句强调杨氏鱼较奇异鱼更为原始，是研究肺鱼类食壳性起源的关键。故后文应继续围绕“杨氏鱼”这一话题展开论述，介绍“杨氏鱼”的相关研究，对应A项。\nB项，“动物食壳性特征”范围扩大，与文段最后讨论的核心话题不一致，无法与文段衔接，排除；\nC项，“生物演化史”与文段最后讨论的核心话题不一致，无法与文段衔接，排除；\nD项，“其他泥盆纪物种”属于无中生有的内容，无法与文段衔接，排除。\n故正确答案为A。\n【文段出处】《这种用“肺”呼吸的鱼，吃肉不吐壳》","no":46,"missingImage":false},{"type":"question","qid":"5445707","cat":"片段阅读","stem":"我国在改革开放后逐渐认识到保护民间文学艺术作品的重要性，并在1990年著作权法规定保护办法另行规定。但时隔三十余年，保护办法仍未出台。尽管如此，在著作权法颁布后，学界就民间文学艺术作品法律保护展开研究讨论，提出多种保护方案，涉及权利客体、权利主体、权利内容、保护期限、权利限制等方面的问题。当然，也有个别学者反对用著作权法保护民间文学艺术作品，主张通过公法加以保护。与此同时，国家版权局也加快推进相关立法，但因质疑声音过大而夭折。\n作者可能赞同下列哪一观点？","options":{"A":"通过公法保护民间文学艺术作品是最可行的路径","B":"围绕民间文学艺术作品法律保护的争议流于表面","C":"国家版权局应就民间文学保护倾听多方面意见","D":"民间文学艺术作品法律保护缺位状态亟须改变"},"answer":"D","explanation":"文段开篇指出我国认识到保护民间文学艺术作品的重要性，并在著作权法中规定对保护办法另行规定。随后通过“但”表转折，指出当前民间文学艺术作品的保护办法仍然没有出台。接着介绍著作权法颁布后，学界针对民间文学艺术作品法律保护曾提出多种保护方案，涉及多方面问题，并指出个别学者主张通过公法加以保护。最后通过“与此同时”表示并列，介绍国家版权局也加快推进相关立法，但因受到强烈质疑而夭折。整个文段都是围绕民间文学艺术作品法律保护缺失这一问题展开论述，意在强调当前亟须出台民间文学艺术作品的保护法，对应D项。\nA项，“通过公法保护民间文学艺术作品”仅为个别学者的观点，“最可行”表述过于绝对，排除；\nB项，文段指出学界就民间文学艺术作品法律保护展开的研究讨论涉及多方面问题，“流于表面”与文意相悖，排除；\nC项，仅对应“与此同时”之后的内容，表述片面，且文段指出国家版权局的立法工作因受到质疑而夭折，并非没有“倾听多方面意见”，排除。\n故正确答案为D。\n【文段出处】《中国特色民间文学艺术作品著作权保护理论的构建》","no":47,"missingImage":false},{"type":"question","qid":"5445711","cat":"片段阅读","stem":"传统X射线在对抗癌细胞时，无法主动辨别正常细胞和癌细胞，在进入人体后实施无差别杀伤。与之不同，重离子束在穿越生物组织的过程中，不会在沿途不断地释放能量，而会在某个深度形成一个剂量高峰，科学界称之为“布拉格峰”。也就是说，在穿透过程中，重离子束只是路过，并不施加伤害；当它到达癌细胞时，才开始杀敌。这样，正常细胞终于可以不再被误伤，这有利于保护正常组织和关键器官。\n根据这段文字，与传统射线相比，重离子束：","options":{"A":"堪称“蒙面杀手”","B":"采用“游击战术”","C":"具有更强的“穿透力”","D":"能精确“区分敌我”"},"answer":"D","explanation":"A项，文段并未提及“重离子束”在杀伤癌细胞时会隐蔽自身，“蒙面杀手”无中生有，排除；\nB项，文段并未提及“重离子束”在杀伤癌细胞时采用的具体方式，“游击战术”无中生有，排除；\nC项，文段并未提及“重离子束”的穿透力，更无比较，“更强的‘穿透力’”无中生有，排除；\nD项，根据“也就是说······正常细胞终于可以不再被误伤，这有利于保护正常组织和关键器官”可知，“重离子束”可以精准分辨正常细胞和癌细胞，“区分敌我”表述正确，当选。\n故正确答案为D。\n【文段出处】人民网《重离子束：打败癌细胞的新一代“杀手”》","no":48,"missingImage":false},{"type":"question","qid":"5445690","cat":"片段阅读","stem":"传统成像技术都是对视域内的物体进行观测，非视域成像技术则能够对隐藏在视线外的物体进行拍照，实现“视线拐弯”“隔墙观物”，极大地拓展了人类的成像能力。这一技术的实现过程通常是将激光脉冲发射到中介墙上，利用中介墙使激光散射到被遮挡的非视域场景中，该场景中的隐藏物体再次将激光散射到中介墙上，最终由中介墙散射至接收系统，整个过程激光经历了3次漫反射，通过记录光量子的飞行时间实现对非视域场景的重构。然而，由于激光经过多次漫反射，整个光路存在巨大的衰减，使得非视域成像目前仅能在实验室内进行短距离的原理性验证。此外，多次漫反射导致的时空信息混杂，使得成像算法成为一个科研难题。\n关于非视域成像技术，这段文字未提及：","options":{"A":"基本原理","B":"突出优势","C":"应用前景","D":"技术难题"},"answer":"C","explanation":"A项，根据“这一技术的实现过程通常是将激光脉冲发射到中介墙上，利用中介墙使激光散射到被遮挡的非视域场景中，该场景中的隐藏物体再次将激光散射到中介墙上，最终由中介墙散射至接收系统，整个过程激光经历了3次漫反射，通过记录光量子的飞行时间实现对非视域场景的重构”可知，“基本原理”已提及，排除；\nB项，根据“非视域成像技术则能够对隐藏在视线外的物体进行拍照，实现‘视线拐弯’‘隔墙观物’，极大地拓展了人类的成像能力”可知，“突出优势”已提及，排除；\nC项，文段并未提及“应用前景”，当选；\nD项，根据“由于激光经过多次漫反射，整个光路存在巨大的衰减，使得非视域成像目前仅能在实验室内进行短距离的原理性验证。此外，多次漫反射导致的时空信息混杂，使得成像算法成为一个科研难题”可知，“技术难题”已提及，排除。\n本题为选非题，故正确答案为C。\n【文段出处】中国航空报《中国科学家实现远距离非视域成像》","no":49,"missingImage":false},{"type":"question","qid":"5445694","cat":"语句表达","stem":"事实推定是指法官在确证基础事实之上，借助经验法则推定待证事实的一种司法认知方法，这实际上是法官价值判断的过程。受个人经验、情感、家庭背景等因素的影响，法官进行价值判断时可能具有个体特征。价值判断联通了基础事实与推定事实，对各类事实所作的价值判断不同，得出的判决结论也将不同。因此，                    。\n填入画横线部分最恰当的一项是：","options":{"A":"对事实推定价值判断的说理可提升判决的可接受性","B":"需要对事实推定中的价值判断进行规范","C":"程序正义有助于减少法官个体差异对判决的影响","D":"价值判断不仅要符合形式合理性也要及时回应社会关切"},"answer":"B","explanation":"横线在文段结尾，由“因此”可知，横线处内容应总结前文。文段开篇引出“事实推定”这一话题，指出事实推定实际上是法官价值判断的过程，会受到多种因素的影响。接着指出法官进行价值判断时可能具有个体特征，对各类事实的价值判断不同，使得最终得出的判决结论也不同，故文段重在强调，法官在事实推定的过程中，对于价值判断的不同可能会影响判决结论这一问题，故尾句可针对这一问题提出对策，对应B项。\nA项，“对事实推定价值判断的说理”文段未提及，无法衔接上文，排除；\nC项，缺少核心话题“事实推定”，文段重在讨论事实的重要性，“程序正义”文段未提及，无中生有，排除；\nD项，缺少核心话题“事实推定”，且“要符合形式合理性也要及时回应社会关切”文段未提及，无法衔接上文，排除。\n故正确答案为B。\n【文段出处】《规范裁判文书对事实推定的价值判断说理》","no":50,"missingImage":false},{"type":"question","qid":"5445695","cat":"语句表达","stem":"①同样，市场规模更大的企业将能够更好地摊薄其供应链成本，从而在低毛利环境中生存下来，打败竞争对手\n②有些生鲜平台称呼其商业模式为“自来水模式”，立志要让好的食材像自来水一样，触手可得\n③在互联网领域，生鲜电商能否盈利不是问题，谁能成为最后的赢家才是问题\n④由于生鲜电商平台具备很强的消费者粘性，先占据更多核心区消费者的企业便能获得先发优势，后进入者往往需要付出更高的获客成本\n⑤这种现象在经济学上被称作“自然垄断”，即某些产品和服务由单个企业大规模生产经营比多个企业同时生产经营更有效率\n⑥而“自来水行业”便是自然垄断最普遍出现的行业\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②⑤⑥①④③","B":"②④⑤①③⑥","C":"④①⑤②⑥③","D":"④⑤③①②⑥"},"answer":"C","explanation":"对比选项，确定首句。②句指出有些生鲜平台的商业模式为“自来水模式”，④句指出消费者对生鲜电商平台非常重要，均可作首句。\n继续观察文段，①句出现“同样”，表示并列关系，可寻找捆绑关系，①句指出市场规模更大的企业能够减少成本，从而打败竞争对手，故前文应介绍企业在竞争中能够成为赢家的其他优势。结合选项分析，①句前分别是③④⑤⑥四句，④句指出拥有更多消费者的企业能获得先发优势，故④①两句均介绍了企业能够打败竞争对手、成为赢家的优势，可构成并列关系，而③句指出生鲜电商面临的问题，⑤句介绍了“自然垄断”这一概念，⑥句介绍了自然垄断最普遍出现的行业是“自来水行业”，均无法和①句构成捆绑，排除A、B、D三项，锁定C项。\n故正确答案为C。\n【文段出处】《谁是赢家？生鲜电商的崛起》","no":51,"missingImage":false},{"type":"question","qid":"5445697","cat":"语句表达","stem":"①这会使病情恶化，并最终导致相关的关节功能障碍\n②大量临床及基础研究显示，软骨病理性钙化是导致骨关节病软骨退变的关键致病机制之一\n③软骨病理性钙化通过诱导软骨细胞表型改变，最终呈现出一种病理状态\n④关节软骨渐进性退变是骨关节病最主要的病理改变\n⑤这些病态的软骨细胞通过有丝分裂增加自身数量，并通过分泌炎症因子、降解软骨基质引发组织炎症，最终发生凋亡\n⑥凋亡小体在吸收钙离子后，又会成为新的病理性矿化结晶，循环往复，致使软骨退变加重、剥脱\n将以上6个句子重新排列，语序正确的是：","options":{"A":"④②③⑤⑥①","B":"④③⑤①②⑥","C":"②③⑤⑥④①","D":"②⑤④③①⑥"},"answer":"A","explanation":"对比选项，确定首句。②句指出骨关节病软骨退变的致病机制，④句通过“最主要”引出关节软骨渐进性退变这一话题，按照逻辑顺序，应先引出话题，再具体论述其致病机制，故④句更适合作为首句，排除C、D两项。\n继续对比选项，A、B两项的区别在于④句之后接②句还是③句，②句是对④句的具体论述，符合逻辑。③句围绕话题“软骨病理性钙化”展开论述，与④句话题不一致，无法衔接，排除B项。\n故正确答案为A。\n【文段出处】科技日报《导致关节软骨病理性钙化的元凶找到了》","no":52,"missingImage":false},{"type":"question","qid":"5445700","cat":"片段阅读","stem":"“高精尖”产业是辐射带动力强的产业集群，对经济具有极强的拉动作用，不仅能实现中心城市的经济高质量发展，而且能带动周边地区的产业联动转型。京津冀协同发展中，产业对接协作是区域战略的核心内容之一，产业升级是三地的共同任务，在疏解非首都核心功能的过程中，天津和河北是北京产业转移的主要承接者。然而，两地仅简单承接北京转移的一般产业是远远不够的，迫切需要发展“高精尖”产业，带动区域科技创新与成果转化，促进区域产业联动，形成经济协同发展的格局。\n这段文字意在说明：","options":{"A":"“高精尖”产业承担着高水平创新的重大使命","B":"形成“高精尖”产业是城市群建设的长远目标","C":"我国区域经济发展应以“高精尖”产业为依托","D":"“高精尖”产业对京津冀协同发展有重要意义"},"answer":"D","explanation":"文段开篇引出话题“高精尖”产业，并指出其对经济的拉动作用，能够带动周边地区的产业联动转型，接着介绍了京津冀协同发展中的区域战略和任务，并指出天津和河北是北京产业转移的主要承接者，尾句通过关联词“然而”转折，指出两地仅简单承接北京转移的一般产业是远远不够的，接着通过“迫切需要”引出对策，强调要发展“高精尖”产业，以实现京津冀地区的协同发展。故文段重点强调尾句对策，即发展“高精尖”产业对实现京津冀地区协同发展的重要性，对应D项。\nA项，强调“高精尖”产业对高水平创新的重要性，缺少文段核心话题“京津冀协同发展”，排除；\nB项，“城市群建设的长远目标”文段并未提及，无中生有，且“城市群建设”范围扩大，文段重点讨论“京津冀”地区，排除；\nC项，强调我国应如何发展区域经济，文段讨论的话题是如何实现“京津冀”地区的协同发展，表述不够准确，排除。\n故正确答案为D。\n【文段出处】中国共产党新闻网《贾品荣：创新驱动“高精尖”产业发展》","no":53,"missingImage":false},{"type":"question","qid":"5445702","cat":"片段阅读","stem":"要推动老旧小区的适老化改造和无障碍环境建设，关键是提升整个社会对适老化改造的思想认识，实现适老化改造特别是居家适老化改造“心理无障碍”。要多渠道、全方位宣传引导居家适老化改造的政策与价值，转变老人、子女和社会对居家适老化改造的认知；同时，要通过养老服务中心、居家养老服务中心等载体，打造居家适老化改造样板房，强化直观感受，转变老人的传统观念，让老人逐步形成“为养老服务买单”、让子女形成更加关注父母居家养老环境的社会意识，提升适老化改造的家庭主观能动性。\n这段文字强调要：","options":{"A":"平衡主体利益，因地制宜推动适老化改造","B":"统筹各方资源，激活适老化改造的多元力量","C":"补位标准规范，提升适老化改造的品质与效率","D":"加强宣传引导，做到适老化改造“心理无障碍”"},"answer":"D","explanation":"文段开篇通过“要······关键是”提出对策，强调提升整个社会对适老化改造的思想认识，对实现适老化改造特别是居家适老化改造“心理无障碍”的重要性，接着围绕这一对策论述其具体措施，首先要通过多渠道、全方位宣传引导转变老人、子女和社会对居家适老化改造的认知，然后通过并列关联词“同时”引出另一方面提升适老化改造思想认识的具体措施，即通过多种载体打造居家适老化改造样板房，转变老人的传统观念，提升适老化改造的家庭主观能动性，故整个文段重在强调通过宣传和引导的方式实现适老化改造“心理无障碍”，对应D项。\nA项，“因地制宜推动适老化改造”文段并未提及，无中生有，排除；\nB项，文段强调要实现适老化改造“心理无障碍”，选项“激活适老化改造的多元力量”偏离文段讨论的核心重点，排除；\nC项，“补位标准规范”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】《改造只是起步 更多适老化堵点有待打通》","no":54,"missingImage":false},{"type":"question","qid":"5445721","cat":"片段阅读","stem":"科学家早就知道月球有两面：面向地球的一面较为平坦，背向地球的一面凹凸不平，遍布撞击坑，月球为何具有截然不同的两副面孔，是其众多谜团之一。近日，科学家提出一种全新解释：数十亿年前，形成月球背面盆地的巨大撞击，产生了足以传遍月球的巨大热量，促成月幔物质的熔化，其中的稀土和放射性生热元素钍以及钾、磷等被携带到与撞击区域对称的月面，形成克里普岩，分布在月球正面风暴洋及其周围，放射性生热元素的集中，产生了月球表面的熔岩流，最终形成月球正面的火山平原。\n最适合做这段文字标题的是：","options":{"A":"盆地与平原：两副面孔，两种材质","B":"月球上的熔岩流：亟待开发的宝藏","C":"双面月球：一次撞击，两种结局","D":"放射性生热元素：月球的化妆师"},"answer":"C","explanation":"文段开头提出问题，即月球为何有两副面孔，接下来给出解释说明，详细分析了撞击过后月球背面盆地与正面火山平原是如何形成的。故文段通过后文对撞击的分析解释月球正反两面截然不同的原因，对应C项。\nA项，未提及“月球”，且根据文意可知，月球正反面并非“两种材质”，排除；\nB项，熔岩流属于后文解释部分的内容，且文段未论述其价值，无中生有，排除；\nD项，“放射性生热元素”属于后文解释部分的内容，且文段主要回答“月球为何有两幅面孔”这一问题，非重点，排除。\n故正确答案为C。\n【文段出处】《双面月球：一次巨大撞击的两种结局》","no":55,"missingImage":false},{"type":"question","qid":"5445724","cat":"片段阅读","stem":"生态修复请求分为生态修复的行为请求和费用请求，前者是为了防止生态环境权益损害的发生或扩大，请求责任人停止污染破坏行为；当被破坏的生态环境无法恢复时，请求责任人进行人工修复。如果责任人不具有修复能力或意愿，可请求责任人承担修复费用。因此，修复行为请求应作为首要诉求，在责任人不能或不愿进行修复时，才能提出修复费用请求。在司法实践中，很多公益诉讼人却往往将修复费用请求作为首要诉求，但由于诉求和判决的修复费用数额不易确定，责任主体短期内难以承担修复费用，生态修复工作很难有效开展。\n这段文字意在说明：","options":{"A":"应该制定生态修复费用的分级标准","B":"修复费用请求往往很难得到有效落实","C":"应根据责任人的能力确定生态修复诉求","D":"生态修复诉讼应当首先提出修复行为请求"},"answer":"D","explanation":"文段开篇指出生态修复请求分为“行为请求”与“费用请求”两种，然后围绕“行为请求”进行介绍，并说明“如果责任人不具有修复能力或意愿，可请求责任人承担修复费用”。接着通过结论标志词“因此”对前文进行总结，提出观点，即修复行为请求应排在修复费用请求之前，来作为生态修复的首要诉求。尾句通过阐述将修复费用请求作为首要诉求时很难有效开展工作这一现状，站在反面的角度论证前文观点。故文段重在强调生态修复的“修复行为请求应作为首要诉求”，对应D项。\nA项，“制定生态修复费用的分级标准”文段未提及，无中生有，排除；\nB项，“修复费用请求往往很难得到有效落实”对应文段尾句，为反面论证内容，非文段重点，排除；\nC项，文段重在强调“生态修复行为请求”，“责任人的能力”偏离文段重点，排除。\n故正确答案为D。\n【文段出处】《生态修复责任在环境公益诉讼中的实现路径》","no":56,"missingImage":false},{"type":"question","qid":"5445728","cat":"片段阅读","stem":"在银河系中，恒星形成于巨型分子云的引力塌缩。而塌缩的残留物会围绕着新生的恒星转动，形成一个富含尘埃的气体盘，称为“原行星盘”。在年轻恒星中，周围存在原行星盘的比例会随恒星年龄增长而下降，存在的时长中值约为200万～300万年。然而，正是通过原行星盘获得气体及所需物质，许多行星才能在这短短几百万年内大致演化成型。对于类似地球的其他行星而言，经历了原行星盘阶段，早期物质至少演化成了行星胚胎，并在原行星盘消散后经历进一步的碰撞和演化，最终形成现在的类地行星。\n根据这段文字，下列说法正确的是：","options":{"A":"恒星和原行星盘的存在时间大致相同","B":"原行星盘是类地行星形成中的必经阶段","C":"巨型分子云引力塌缩后随即形成行星和恒星","D":"行星在运动中不断从原行星盘中获取所需物质"},"answer":"B","explanation":"A项，根据“而塌缩的残留物会围绕着新生的恒星转动，形成一个富含尘埃的气体盘，称为‘原行星盘’”可知，原行星盘形成的时间晚于恒星，“存在时间大致相同”表述错误，排除；\nB项，根据“对于类似地球的其他行星而言，经历了原行星盘阶段，早期物质至少演化成了行星胚胎，并在原行星盘消散后经历进一步的碰撞和演化，最终形成现在的类地行星”可知，形成类地行星要经过原行星盘阶段，表述正确，当选；\nC项，根据“恒星形成于巨型分子云的引力塌缩。而塌缩的残留物会围绕着新生的恒星转动，形成一个富含尘埃的气体盘，称为‘原行星盘’”可知，“形成行星”文段未提及，无中生有，排除；\nD项，根据“正是通过原行星盘获得气体及所需物质，许多行星才能在这短短几百万年内大致演化成型”可知，文段并未表明行星是在运动中不断获取物质，“在运动中”文段未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】微信公众号《用磁场重现太阳星云演化》","no":57,"missingImage":false},{"type":"question","qid":"5445732","cat":"片段阅读","stem":"从“市场体系”到“统一市场”再到“全国统一大市场”，实际就是从建设市场到建设一体化市场，再到建设大市场和强市场。我们的市场人均收入和消费水平低，虽然人口多，但是市场呈现为行政分割状态，因此只是潜在规模大，实际规模并不具有竞争优势。对此，除了要通过深化改革，释放生产力、提升工资水平、分好国民收入这块蛋糕，还要处理好两个重要问题：一是大力纠正导致市场分割的因素；二是加快资本市场化建设，提高财产性收入比重。这是在扩大工资占比条件受限的前提下，迅速做大做强市场的关键。\n这段文字针对的主要问题是：","options":{"A":"行政区域分割和非一体化抑制了有效竞争","B":"财产性收入在国民收入中的比重还比较低","C":"我国市场潜在规模优势还未转化为现实优势","D":"消费需求疲软阻碍了全国统一大市场的形成"},"answer":"C","explanation":"文段首先指出从“市场体系”到“统一市场”再到“全国统一大市场”的实质，接着指出问题，强调我们的市场潜在规模大，但实际规模并不具有竞争优势，后文给出对策，具体介绍如何做大做强市场。由此可知，文段针对的主要问题是我们的市场潜在规模大而实际并不具有竞争优势，同义替换对应C项。\nA项，“行政区域分割”是导致问题的原因之一，“非一体化”无中生有，排除；\nB项，“财产性收入比重比较低”无中生有，且并非文段重点强调的问题，排除；\nD项，“消费需求疲软”无中生有，排除。\n故正确答案为C。\n【文段出处】学习时报《刘志彪：塑造“有效市场+有为政府”的全国统一大市场》","no":58,"missingImage":false},{"type":"question","qid":"5445734","cat":"片段阅读","stem":"颠覆性技术在军事领域的应用，使现代空袭作战向陆、海、空、天、电、网等领域发展。电子战飞机、预警指挥机在现代空袭体系中的作用愈发重要；第四代隐身飞机投入实战大大增强了空袭体系的突防能力；空射导弹等精确制导弹药智能化水平、抗干扰能力和目标识别能力增强，作战效能大大提高。未来将进一步提高精确制导弹药的命中精度，空袭体系的精确打击能力将进一步增强。同时，运用小型或超小型无人机，在战场上对重要目标实施“蜂群”式打击，会给重要目标的防护造成很大困难。\n这段文字意在说明：","options":{"A":"颠覆性技术提高了空袭作战的综合打击能力","B":"军事领域的颠覆性技术研究取得突破性进展","C":"精确打击能力的增强提升了空袭作战的效能","D":"智能化时代的空中防御体系面临着空前挑战"},"answer":"D","explanation":"文段开篇交待背景，即颠覆性技术使现代空袭作战领域得以发展，接着通过两个“；”引导三方面并列，说明现代空袭领域作战效能大大提高，后文通过并列关联词“同时”，指出小型或超小型无人机会给重要目标的防护造成很大困难。故该文段为并列结构，强调现代军事空袭领域作战时打击能力增强，也就意味着现代空中防御体系面临巨大挑战，对应D项。\nA项，“颠覆性技术”仅对应文段交待背景部分的内容，非重点，排除；\nB项，缺少文段核心话题“空中”，排除；\nC项，“精确打击能力”仅对应文段中“导弹”部分的内容，表述片面，排除。\n故正确答案为D。\n【文段出处】《现代防空面临“空袭之变”》","no":59,"missingImage":false},{"type":"question","qid":"5445737","cat":"语句表达","stem":"立案登记制改革的初衷是保护当事人依法享有的诉权，所谓“有案必立、有诉必理”，只是指那些符合法律规定立案条件的案件，起诉到人民法院后，法院必须立案，否则法院就没有必要受理。所以，                    ，对此，可能有人认为，设立立案标准等于为立案设置了门槛，很难保障当事人通过诉讼解决纠纷的权利。其实任何权利都有限度，不存在没有边界的权利，当事人通过诉讼解决纠纷的权利同样如此。只有符合立案标准，这种权利才能通过法院诉讼得以实现。\n填入画横线部分最恰当的一项是：","options":{"A":"推行立案登记制并不意味着“是案就立”","B":"不能将“立案难”与司法公正简单关联起来","C":"明确立案标准才能保障当事人的合法权益","D":"应正确理解司法资源作为公共产品的有限性"},"answer":"C","explanation":"横线位于文段中间，需结合上下文语境进行分析。文段开头引出话题“立案登记制改革”并介绍其初衷，即“有案必立、有诉必理”，并指出针对符合法律规定立案条件的案件法院必须立案。横线后指出设立立案标准很难保障当事人的权利，尾句通过“只有······才”对“立案标准”和“当事人权利”展开论述。因此，横线处所填句子应围绕“立案标准”和“当事人权利”展开论述，C项与前后文连接紧密，当选。\nA项，缺少“当事人权利”的话题，且“立案登记制”非文段核心话题，排除；\nB项“司法公正”、D项“司法资源的有限性”文段均未提及，与文段话题不一致，排除。\n故正确答案为C。\n【文段出处】《最高法院：多措并举切实保障诉权》","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"5445717","cat":"数学运算","stem":"一项工作甲独立完成需要3小时，乙独立完成的用时比其与甲合作完成多4小时，且乙和丙合作完成需要4小时。问丙独立完成需要多少小时？","options":{"A":"10","B":"12","C":"6","D":"8"},"answer":"B","explanation":"赋值工作总量为12，则甲的效率为\u003cimg data-k=\"12e46ad3f574\">，乙、丙合作的效率为\u003cimg data-k=\"bb72aef9e41b\">。设乙的效率为x，根据“乙独立完成的用时比其与甲合作完成多4小时”，可得：\u003cimg data-k=\"6d01e969d52b\">，解得：x=2，即乙的效率为2，则丙的效率为3-2=1。因此，丙独立完成需要\u003cimg data-k=\"0c28cf008977\">小时。\n故正确答案为B。","no":61,"missingImage":false},{"type":"question","qid":"5445739","cat":"数学运算","stem":"在一块正方形土地中，画一条经过某个顶点的规划线，将其分割为三角形和梯形两块土地，且梯形土地的面积正好是三角形土地的2倍。问三角形和梯形土地的周长之比是多少？","options":{"A":"1：2","B":"5：7","C":"\u003cimg data-k=\"be693f01f3af\">","D":"\u003cimg data-k=\"18cc585fbaf5\">"},"answer":"D","explanation":"\u003cimg data-k=\"02eb6d16df42\" style=\"max-width:245px\">\n赋值正方形土地的边长为3，根据题意，梯形土地的面积正好是三角形土地的2倍，则正方形土地的面积是三角形土地的3倍，设三角形土地BE边长为x，则\u003cimg data-k=\"c841c9dd219e\">\u003cimg data-k=\"7cb7a70345b9\">，代入数据得\u003cimg data-k=\"f6ea98218c55\">\u003cimg data-k=\"96a18023de84\">，解得x=2，则ED=BD-BE=3-2=1。根据勾股定理，\u003cimg data-k=\"1043cd1faacc\">\u003cimg data-k=\"15c4aec4ed54\">，则三角形土地的周长\u003cimg data-k=\"5950cc1487ce\">\u003cimg data-k=\"3b445064a4f2\">，梯形土地的周长\u003cimg data-k=\"c2302620f84e\">\u003cimg data-k=\"e17a95f6574f\">，故三角形和梯形土地的周长之比为\u003cimg data-k=\"18cc585fbaf5\">。\n故正确答案为D。","no":62,"missingImage":false},{"type":"question","qid":"5445722","cat":"数学运算","stem":"已知A、B两种设备定价相同，C设备单价为8000元/台。现A、B两种设备分别打六折、七折促销，购买1台B设备的费用比购买A、C设备各1台的总费用高2万元。问促销期间1000万元预算最多可以购买多少台A设备？","options":{"A":"35","B":"51","C":"59","D":"77"},"answer":"C","explanation":"设A、B两种设备每台定价均为x万元，则促销期间A设备单价为0.6x万元，B设备为0.7x万元。8000元=0.8万元，根据题意，可列方程：0.7x=0.6x+0.8+2，解得x=28，则促销期间A设备单价为28×0.6=16.8万元。促销期间1000万元可以购买\u003cimg data-k=\"faf1afc96578\">台A设备，则最多可以购买59台A设备。\n故正确答案为C。","no":63,"missingImage":false},{"type":"question","qid":"5445725","cat":"数学运算","stem":"某单位有甲和乙2个办公室，分别有职工5人和4人。每周从这9名职工中随机抽取1人下沉社区担任志愿者（同一人有可能被连续、重复选中）。问7月前2周的志愿者均来自甲办公室的概率在以下哪个范围内？","options":{"A":"不到25%","B":"25%~35%之间","C":"35%~45%之间","D":"超过45%"},"answer":"B","explanation":"根据题意可知，7月前2周的志愿者总情况数为\u003cimg data-k=\"bf3479173dec\">种，7月前2周的志愿者均来自甲办公室的情况数为\u003cimg data-k=\"1e5faee2dce1\">种。因此所求概率\u003cimg data-k=\"e21baa5382ca\">\u003cimg data-k=\"fef84b251841\">，在25%~35%之间。\n故正确答案为B。","no":64,"missingImage":false},{"type":"question","qid":"5445716","cat":"数学运算","stem":"公园里有一片四边形草坪，沿对角线修建的小道相交于O点，O到四个顶点A、B、C、D的距离之比正好为1：2：3：4，一名工人花费1天正好完成AOB区域的修剪，问第二天至少需要额外增加多少名效率相同的工人一起工作，才能在当天内完成剩余草坪的修剪？\n\u003cimg data-k=\"3c8936527a5d\" style=\"max-width:178px\">","options":{"A":"8","B":"10","C":"11","D":"12"},"answer":"B","explanation":"根据题意，设\u003cimg data-k=\"cc6c58aaa773\">的面积为S。因为\u003cimg data-k=\"cc6c58aaa773\">与\u003cimg data-k=\"8b219c70504d\">的高相同，底边BO：DO=2：4=1：2，根据结论“两个三角形的高相同，面积之比等于底之比”可得：\u003cimg data-k=\"66d8e655f7a1\">；同理，\u003cimg data-k=\"8b219c70504d\">与\u003cimg data-k=\"fedac096f80c\">的高相同，底边AO：CO=1：3，则\u003cimg data-k=\"b9d4c6f97490\">\u003cimg data-k=\"e79f47696ef8\">；\u003cimg data-k=\"cc6c58aaa773\">与\u003cimg data-k=\"dd07c372644c\">的高相同，底边AO：CO=1：3，则\u003cimg data-k=\"9a697329f687\">。故四边形ABCD的面积=S+2S+6S+3S=12S。根据题意可知，一名工人花费1天正好完成AOB区域的修剪，即一名工人花费1天修剪的面积为S，剩余面积为12S-S=11S，则要在第二天完成修剪至少需要11S÷S=11名效率相同的工人，故至少需要额外增加11-1=10名效率相同的工人一起工作。\n故正确答案为B。","no":65,"missingImage":false},{"type":"question","qid":"5445723","cat":"数学运算","stem":"单位将10个培训名额分配给4个分公司，要求在每个分公司至少分配1个名额的所有分配方案中，随机选择1个方案实施，问4个分公司中有3个分配名额数量相同的概率为多少？","options":{"A":"\u003cimg data-k=\"8a2daf14bb43\">","B":"\u003cimg data-k=\"90d98ef5aa66\">","C":"\u003cimg data-k=\"330f95787889\">","D":"\u003cimg data-k=\"311f5c2d861c\">"},"answer":"D","explanation":"根据题意可知，将10个相同的培训名额分配给4个不同的分公司，每个分公司至少分配1个名额，可使用插板法解题，共有\u003cimg data-k=\"9cabc17ac817\">种分配方案。\n方法一：4个分公司中有3个分公司分配到的名额数量相同，设3个分公司分配到的名额数量均为a个，另外一个分公司分配到的名额数量为b个，则3a+b=10，且\u003cimg data-k=\"2c86c2768cde\">，符合要求的情况有3大类（a=1，b=7；a=2，b=4；a=3，b=1），那么符合条件的情况数有\u003cimg data-k=\"2211b09a2594\">种，则题干所求概率为\u003cimg data-k=\"e55dab9b0305\">\u003cimg data-k=\"46c0b694a70d\">。\n方法二：根据公式：概率\u003cimg data-k=\"7e189b75f5fa\">，则题目所求概率为\u003cimg data-k=\"c752840ae820\">，即选项的分母部分为84的因子，结合选项，只有D项符合。\n故正确答案为D。","no":66,"missingImage":false},{"type":"question","qid":"5445729","cat":"数学运算","stem":"某次会议邀请4所高校每所各2位学者作报告。在某日上午、下午和晚上的三个时间段分别安排3位、3位和2位学者依次作报告，且同一所高校的2位学者不安排在同一时间段内作报告。问8人的报告次序有多少种不同的安排方式？","options":{"A":"不到5000种","B":"5000~10000种之间","C":"10001~20000种之间","D":"超过20000种"},"answer":"C","explanation":"对上午、下午和晚上的三个时间段报告次序进行分步讨论：\n第一步，上午需要从4所高校中选3所高校，每所高校各选1位学者进行排序，有\u003cimg data-k=\"2dceea9ffe5e\">种情况；\n第二步，下午需要从上午未选高校中选1位学者，再从上午已选3所高校中选2位学者进行排序，有\u003cimg data-k=\"4680845cf90a\">种情况；\n第三步，对晚上剩余的2位学者进行排序，有\u003cimg data-k=\"79ffa592ef20\">种情况。\n则这8人的报告次序共有192×36×2=13824种不同的安排方式，在C项范围内。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"5445731","cat":"数学运算","stem":"一辆汽车从甲地开往乙地，先以40千米/小时的速度匀速行驶一半的路程，然后均匀加速；行驶完剩下路程的一半时，速度达到80千米/小时；此后均匀减速，到达乙地时的速度正好降为0。问其全程的平均速度在以下哪个范围内？","options":{"A":"不到44千米/小时","B":"在44~45千米/小时之间","C":"在45~46千米/小时之间","D":"超过46千米/小时"},"answer":"A","explanation":"如下图所示，A地为甲、乙两地的中点，B地为A地、乙地的中点。由A地到B地汽车均匀加速，则该段的平均速度为\u003cimg data-k=\"04efb67930d3\">千米/小时；由B地到乙地汽车均匀减速，则该段的平均速度为\u003cimg data-k=\"3decd36ec6aa\">千米/小时。因B地为A地、乙地的中点，根据等距离平均速度公式，可得汽车从A地到乙地的平均速度为\u003cimg data-k=\"b9fcbbf7ddd4\">千米/小时；又因A地为甲、乙两地的中点，根据等距离平均速度公式，可得汽车全程的平均速度为\u003cimg data-k=\"551cc5c28c20\">千米/小时，在A项范围内。\n\u003cimg data-k=\"987465bb86e1\" style=\"max-width:584px\">\n故正确答案为A。\n注：匀变速运动的平均速度公式为\u003cimg data-k=\"b5856cdfff9b\">，等距离平均速度公式为\u003cimg data-k=\"e345668452bf\">。","no":68,"missingImage":false},{"type":"question","qid":"5445712","cat":"数学运算","stem":"甲、乙、丙三家科技企业2021年的收入之和比2020年提升了20%。其中甲企业的收入上升了400万元，乙企业的收入下降了100万元且是甲企业收入的一半，丙企业的收入上升了30%且其2020年的收入与甲、乙两企业同年收入之和相同。问2020年甲企业的收入比乙企业高多少万元？","options":{"A":"900","B":"1100","C":"400","D":"600"},"answer":"D","explanation":"设2021年乙企业的收入为x万元，则根据题干条件甲、乙、丙三家企业的收入如下表所示：\n\u003cimg data-k=\"a1453a5ca2bc\" style=\"max-width:700px\">\n2021年甲、乙、丙三家企业的收入之和为2x+x+3.9x-390=6.9x-390，2020年甲、乙、丙三家企业的收入之和为\u003cimg data-k=\"cee9602bda38\">。因甲、乙、丙三家企业2021年的收入之和比2020年提升了20%，即\u003cimg data-k=\"8357534dafc8\">，解得x=1100，则2020年甲企业的收入比乙企业高（2x-400）-（x+100）=x-500=600万元。\n故正确答案为D。","no":69,"missingImage":false},{"type":"question","qid":"5445718","cat":"数学运算","stem":"一个圆柱体零件A和一个圆锥体零件B分别用甲、乙两种合金铸造而成。A的底面半径和高相同，B的底面半径是高的2倍，两个零件的高相同，质量也相同。问甲合金的密度是乙合金的多少倍？","options":{"A":"\u003cimg data-k=\"e3b01bf26d59\">","B":"\u003cimg data-k=\"170ce8fc8ae0\">","C":"\u003cimg data-k=\"ff1b1de9ab8e\">","D":"\u003cimg data-k=\"4ee864913a4b\">"},"answer":"A","explanation":"赋值零件A与零件B的高均为1，则A的底面半径为1，B的底面半径为2，可得零件A的体积为\u003cimg data-k=\"ad12dfc1b843\">，零件B的体积为\u003cimg data-k=\"542212431c73\">。根据公式：质量=密度×体积，可知质量相同时，密度和体积成反比，即\u003cimg data-k=\"2f45a88dfe4d\">。\n故正确答案为A。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>6天休假期间，单位需要每天安排一人值班。财务、研发、人事、后勤、法务和销售6个部门各推荐了2人，值班人员从这12人中选择，每人至多值班一天。安排要求：\u003c/p>\u003cp>（1）第二天和第四天不安排法务部门的人值班；\u003c/p>\u003cp>（2）若安排后勤部门的人值班，则只能安排在法务部门的人值班的前一天；\u003c/p>\u003cp>（3）若安排研发部门的人值班，则只能安排在后勤部门的人值班的前一天。\u003c/p>","questions":[{"qid":"5445782","cat":"逻辑判断","stem":"关于6天中的人选，以下哪项安排符合上述条件？","options":{"A":"财务、人事、后勤、法务、财务、人事","B":"销售、财务、法务、人事、财务、销售","C":"人事、财务、法务、研发、法务、后勤","D":"法务、销售、人事、后勤、财务、销售"},"answer":"B","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天。\n第二步：根据题干条件进行推理。\n本题题干信息确定，选项信息充分，优先考虑排除法。\n根据条件（1）“法务部\u003cimg data-k=\"645831205161\">第二、四天”，排除A项。\n根据条件（2）“后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天”，排除C、D两项。\n经验证，B项满足题干所有条件，当选。\n故正确答案为B。","no":71,"missingImage":false},{"qid":"5445805","cat":"类比推理","stem":"后勤部门的人可以安排在哪几天值班？","options":{"A":"只有第二天、第四天、第五天","B":"只有第一天、第三天、第五天","C":"只有第二天、第六天","D":"只有第一天、第三天"},"answer":"A","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天。\n第二步：根据题干条件进行推理。\n提问为“可以”，优先考虑代入选项。因为选项表述均为“只有”，说明是要列举后勤部门值班的所有可能情况，此时可以从选项中只出现一次的情况入手，即A项中的“后勤部门的人是否可以安排在第四天”，如果可以，即A项当选，如果不可以，即排除A项。\n如果后勤部门安排在第四天，根据条件（2）可知，法务部门安排在第五天，题干所有条件均可满足，即后勤部门可以安排在第四天，排除B、C、D三项。\n故正确答案为A。","no":72,"missingImage":false},{"qid":"5445808","cat":"逻辑判断","stem":"如果安排后勤部门的两人值班，则以下哪项一定是错误的？","options":{"A":"第一天安排研发部门的人值班","B":"第六天安排人事部门的人值班","C":"第三天安排财务部门的人值班","D":"第五天安排法务部门的人值班"},"answer":"C","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天；\n（4）后勤有两人值班。\n第二步：根据题干条件进行推理。\n条件（4）表明后勤有两人值班，结合条件（2）可知，法务也应有两人值班，且后勤紧挨在法务值班的前一天，据此可知，法务不能安排在第一天。\n再结合条件（1）可知，法务的两人只能安排在第三天、第五天、第六天这三天中的两天。由于法务两人值班的前一天均应是后勤的人在值班，所以法务的两人不能同时安排在第五天和第六天，因此法务一定有一人是安排在第三天的，则C项第三天安排财务部门的人值班是错误的。\n本题为选非题，故正确答案为C。","no":73,"missingImage":false},{"qid":"5445817","cat":"类比推理","stem":"如果在第三天、第五天分别安排两个财务部门的人值班，则第一天、第六天可安排的值班人员可能分别来自：","options":{"A":"后勤部门和法务部门","B":"法务部门和销售部门","C":"财务部门和销售部门","D":"研发部门和人事部门"},"answer":"B","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天；\n（4）在第三天、第五天分别安排两个财务部门的人值班。\n第二步：根据题干条件进行推理。\n提问方式为“可能”，优先使用代入法。\n代入A项：如果第一天、第六天安排的值班人员分别来自后勤部门和法务部门，根据条件（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天，可知第二天为法务，不满足条件（1），排除；\n代入B项：如果第一天、第六天安排的值班人员分别来自法务部门和销售部门，根据条件（4）在第三天、第五天分别安排财务，根据条件（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天，可知第二天和第四天不能安排后勤，根据条件（1），可知第二天和第四天不能安排法务，根据条件（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天，可知第二天和第四天不能安排研发，所以第二天和第四天可以安排人事或者销售，可进行如下安排，满足题干条件，当选；\n\u003cimg data-k=\"c52329b09348\" style=\"max-width:685px\">\n代入C项：如果第一天、第六天安排的值班人员分别来自财务部门和销售部门，此时第一天、第三天和第五天安排的值班人员均来自财务部门，不符合题干条件“6个部门各推荐2人”，不满足题干条件，排除；\n代入D项：如果第一天、第六天安排的值班人员分别来自研发部门和人事部门，根据条件（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天，可知第二天的值班人员来自后勤部门，根据条件（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天，可知第三天的值班人员来自法务部门，此时不符合条件（4）“第三天安排财务部门的人值班”，不满足题干条件，排除。\n故正确答案为B。","no":74,"missingImage":false},{"qid":"5445818","cat":"逻辑判断","stem":"如果没有安排财务和后勤部门的人值班，则以下哪项一定是正确的？","options":{"A":"第四天安排销售部门的人值班","B":"第五天安排法务部门的人值班","C":"第二天安排销售部门或者人事部门的人值班","D":"第三天安排法务部门或者人事部门的人值班"},"answer":"C","explanation":"第一步：分析题干条件。\n6天假期每天需安排一人值班，6个部门各推荐2人，从12人中选择6人，每人值班一天。安排要求如下：\n（1）法务部\u003cimg data-k=\"645831205161\">第二、四天；\n（2）后勤值班\u003cimg data-k=\"a37757d411ef\">后勤安排在法务前一天；\n（3）研发值班\u003cimg data-k=\"a37757d411ef\">研发安排在后勤前一天；\n（4）没有安排财务和后勤部门的人值班。\n第二步：根据题干条件进行推理。\n根据条件（4）没有安排后勤部门的人值班，可知研发部门不可能安排在后勤部门的前一天，结合条件（3）可知，没有安排研发部门的人值班。此时已知没有安排研发、财务和后勤这3个部门的人值班，结合题干开头给出的信息可知，值班人员只能从剩下的人事、法务、销售这3个部门中选择。再结合条件（1）可知，第二天不能安排法务部门的人值班，所以第二天只能安排销售部门或者人事部门的人值班。\n故正确答案为C。","no":75,"missingImage":false},{"qid":"5445797","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"9e36759fbb21\" style=\"max-width:581px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"图形元素组成不同，无明显属性规律，考虑数量规律。题干图形明显被分割，优先考虑面数量，发现题干图形均为4个面，据此排除A项；继续观察发现题干图形均由几个图形拼接而成，还可以考虑图形间关系。题干图形均有一个黑块，观察发现题干图形中黑块均与3个白块存在公共边，选项中只有C项符合。\n故正确答案为C。","no":76,"missingImage":false},{"qid":"5445778","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"2be79c89c52c\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"图形元素组成不同，优先考虑属性规律。观察发现，题干图形均由内外两部分组成，考虑分内外看，且题干出现等腰三角形、平行四边形等特征图形，考虑对称性。题干图形外部均为轴对称图形，内部均为中心对称图形，故？处图形也应满足此规律，只有D项符合。\n故正确答案为D。","no":77,"missingImage":false},{"qid":"5445802","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"74b5cbbe6d55\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相同，优先考虑位置规律。题干图形由黑色三角形构成，且数量较多、角度也较乱，考虑相邻比较。观察发现：从图1到图2，最上方一行相同位置上的黑色三角形均顺时针旋转了\u003cimg data-k=\"dd44efe89e5a\">，其余位置的黑色三角形保持不变；从图2到图3，最右侧一列相同位置上的黑色三角形均顺时针旋转了\u003cimg data-k=\"dd44efe89e5a\">，其余位置的黑色三角形保持不变；从图3到图4，最下方一行相同位置上的黑色三角形均顺时针旋转了\u003cimg data-k=\"dd44efe89e5a\">，其余位置的黑色三角形保持不变；从图4到图5，最左侧一列相同位置上的黑色三角形均顺时针旋转了\u003cimg data-k=\"dd44efe89e5a\">，其余位置的黑色三角形保持不变。因此，？处图形与图5相比，应为只有最上方一行相同位置上的黑色三角形顺时针旋转\u003cimg data-k=\"dd44efe89e5a\">，其余位置的黑色三角形均保持不变，只有B项符合。\n故正确答案为B。","no":78,"missingImage":false},{"qid":"5445769","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"50feec4b01db\" style=\"max-width:430px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"图形元素组成相似，优先考虑样式规律。观察发现，题干图形均由黑球和白球构成，考虑黑白运算。九宫格优先横向观察，第一行图形的黑白运算规律为：黑+黑=白，黑+白=白，白+黑=白，白+白=黑，第二行图形经验证符合此规律，第三行图形应用此规律，只有A项符合。\n故正确答案为A。","no":79,"missingImage":false},{"qid":"5445822","cat":"图形推理","stem":"将一张直角三角形形状的纸片进行两次折叠，展开后的折痕将该三角形分成如图所示的a、b、c、d四个部分，则两次折叠后的纸片投影面积为：\n\u003cimg data-k=\"eb9bfd252e21\" style=\"max-width:363px\">","options":{"A":"b+d+c-a","B":"b+d-c","C":"b+c-a","D":"b+d-a"},"answer":"D","explanation":"第一步，将直角三角形先沿水平折痕进行折叠，即将面c和面d向下折叠，覆盖面b和面a，得到如下图形，此时折叠后面积为：b+d；\n\u003cimg data-k=\"f8fa35908807\" style=\"max-width:316px\">\n第二步，将直角三角形沿着竖直折痕进行折叠，即将面b和面c向右折叠，覆盖面d和面a，得到如下图形，此时折叠后面积为：d+b-a。\n\u003cimg data-k=\"3fd2d478e850\" style=\"max-width:223px\">\n故正确答案为D。","no":80,"missingImage":false},{"qid":"5445823","cat":"图形推理","stem":"左图为给定的立体图形，从任一角度观看，下面哪项不可能是该立体图形的视图？\n\u003cimg data-k=\"ab81941b5138\" style=\"max-width:598px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查三视图。如下图所示，A、B、D三项按图中箭头方向观察，均可看到，排除；C项为从上往下观察图形，则左右两侧应有两条竖线，当选。\n\u003cimg data-k=\"06b5e2c509f8\" style=\"max-width:598px\">\n本题为选非题，故正确答案为C。","no":81,"missingImage":false},{"qid":"5445798","cat":"图形推理","stem":"左图为等大的3个灰色正方体和15个白色正方体组合成的多面体，其可以切割为①、②和③三个小多面体，问③代表的多面体可能是：\n\u003cimg data-k=\"71b5912122c2\" style=\"max-width:570px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查立体拼合。如下图所示，将图①、图②进行旋转，结合A项，即可拼合成为左图的多面体。\n\u003cimg data-k=\"5b991e427b43\" style=\"max-width:585px\">\n\u003cimg data-k=\"736e1d4a45b1\" style=\"max-width:500px\">\n故正确答案为A。","no":82,"missingImage":false},{"qid":"5445799","cat":"图形推理","stem":"把下面六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"930786362135\" style=\"max-width:557px\">","options":{"A":"①②⑤，③④⑥","B":"①②④，③⑤⑥","C":"①④⑤，②③⑥","D":"①③⑤，②④⑥"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形基本都由圆和正方形构成，优先考虑元素的个数，圆的数量依次为5、0、1、3、4、2，正方形的数量依次为4、1、2、2、3、3，单独看数量无规律，考虑二者运算图①④⑤中，圆的数量-正方形的数量=1；图②③⑥中，正方形的数量-圆的数量=1。故图①④⑤为一组，图②③⑥为一组。\n故正确答案为C。","no":83,"missingImage":false},{"qid":"5445768","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"02bdbdf7af29\" style=\"max-width:547px\">","options":{"A":"①③⑤，②④⑥","B":"①④⑥，②③⑤","C":"①③④，②⑤⑥","D":"①②④，③⑤⑥"},"answer":"D","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图2为“日”字变形图，图3为多端点图形，优先考虑笔画数。图①②④为一笔画图形，图③⑤⑥为两笔画图形，即图①②④为一组，图③⑤⑥为一组。\n故正确答案为D。","no":84,"missingImage":false},{"qid":"5445793","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"78526a7dba46\" style=\"max-width:564px\">","options":{"A":"①③④，②⑤⑥","B":"①②④，③⑤⑥","C":"①②⑥，③④⑤","D":"①⑤⑥，②③④"},"answer":"B","explanation":"解析一：本题为分组分类题目。元素组成不同，且封闭面明显，考虑数面。观察发现，图①②④中有4个面；图③⑤⑥中有5个面，即图①②④为一组，图③⑤⑥为一组。\n故正确答案为B。\n解析二：本题为分组分类题目。元素组成不同，优先考虑属性规律。观察发现，题干每幅图中均出现多个全开放图形，优先考虑开闭性。图①②④中有5个全开放图形、4个全封闭图形；图③⑤⑥中有4个全开放图形、5个全封闭图形，即图①②④为一组，图③⑤⑥为一组。\n故正确答案为B。","no":85,"missingImage":false},{"qid":"5445804","cat":"定义判断","stem":"微量鉴定是指运用物理学、化学和仪器分析等方法，通过对案件现场有关物质材料（材料特点多为体小量微、不易注意）的成分及其结构进行定性、定量分析，对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定。\n根据以上定义，下列涉及交通事故的鉴定属于微量鉴定的是：","options":{"A":"对车辆驾驶人采血，分析血液中的酒精含量，判断驾驶人是否存在酒后驾车嫌疑","B":"现场提取、检验受害人毛发、衣物纤维，认定受害人是否与嫌疑人车辆存在接触","C":"拆解车辆特定部位，查明车辆故障原因，用以鉴定其属于人为责任还是机械故障","D":"通过人体损伤程度检验，确定伤害损伤部位与交通事故伤害后果的关联程度"},"answer":"B","explanation":"第一步：找出定义关键词。\n“对案件现场体小量微、不易注意的物质材料成分及其结构进行分析”、“对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定”。\n第二步：逐一分析选项。\nA项：对车辆驾驶人采血，分析血液中的酒精含量，“血液”不符合“体小量微、不易注意的物质材料”，并且也不涉及与嫌疑样本的比对，不符合定义，排除；\nB项：现场提取、检验受害人毛发、衣物纤维，“毛发，衣物纤维”符合“体小量微、不易注意的物质材料”，认定受害人是否与嫌疑人车辆存在接触，符合“对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定”，符合定义，当选；\nC项：拆解车辆特定部位，查明车辆故障原因，“车辆特定部位”不符合“体小量微、不易注意的物质材料”，并且也不涉及与嫌疑样本的比对，不符合定义，排除；\nD项：通过人体损伤程度检验，确定伤害损伤部位与交通事故伤害后果的关联程度，“人体”不符合“体小量微、不易注意的物质材料”，并且也不涉及与嫌疑样本的比对，不符合定义，排除。\n故正确答案为B。","no":86,"missingImage":false},{"qid":"5445820","cat":"定义判断","stem":"架构创新是指组成产品的基本元件不变，但是整体结构布局改变，即将相同元件进行整体结构的重新调整，进而产生新功能的创新。\n根据上述定义，下列属于架构创新的是：","options":{"A":"陶瓷底板电熨斗与传统不锈钢底板电熨斗相比，其底板的耐磨性更强，具有更高的光滑度，使用起来更顺畅","B":"某款手机聊天软件增加了拜年红包功能，用户可以在给亲朋好友发送红包时，编辑拜年吉祥语、自定义红包图片，满足个性化需求","C":"可拆卸手柄锅将原手柄设计成可从锅具上拆卸下来，并提供多个手柄可安装在锅具边缘的任意位置上，满足烹饪需要","D":"某板材厂改良制作工艺，将原来的轧制工序分成两步进行，同时增加砂光工序，生产出满足市场需要的薄板"},"answer":"C","explanation":"第一步：找出定义关键词。\n“组成产品的基本元件不变”、“重新调整相同元件的整体结构”、“产生新功能的创新”。\n第二步：逐一分析选项。\nA项：陶瓷底板电熨斗与传统不锈钢底板电熨斗，二者的底板分别为陶瓷和不锈钢，说明二者的基本元件不同，不符合“组成产品的基本元件不变”，不符合定义，排除；\nB项：手机聊天软件增加了拜年红包功能，用户可以在红包上编辑拜年吉祥语、自定义红包图片，但是以前发红包不能自定义红包图片，现在能自己选择了，其实是新开发的功能，不是因整体结构布局改变而产生的功能，不符合“重新调整相同元件的整体结构”、“产生新功能的创新”，不符合定义，排除；\nC项：可
