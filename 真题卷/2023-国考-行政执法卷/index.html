拆卸手柄锅提供多个手柄可安装在锅具边缘的任意位置上，说明安装手柄的结构布局改变，符合“重新调整相同元件的整体结构”，但有同学觉得 “提供多个手柄”，数量多了，不符合“组成产品的基本元件不变”，此处确实是C项纠结的地方，但宏观来看其实基本原件还是锅和手柄，但是商家给了多个手柄，其实就是提供了更多结构调整时的功能选择，比如一个手柄可以做炒锅，两个手柄可以做汤锅，取下手柄还可以当盘子用等，产生了很多的新功能（注：烹饪功能也可以细化成炒煮蒸炸等，不同的手柄带来了不同的功能），整体来说，比B项更符合关键词“重新调整相同元件的整体结构”、“产生新功能的创新”，择优选择C项；\nD项：板材厂将原来的轧制工序分成两步进行，同时增加砂光工序，说明是产品的制作工艺改变，不符合“重新调整相同元件的整体结构”，不符合定义，排除。\n故正确答案为C。","no":87,"missingImage":false},{"qid":"5445821","cat":"定义判断","stem":"民宿是指利用当地民居等相关闲置资源，经营用客房不超过4层、建筑面积不超过800平方米，主人参与接待，为游客提供体验当地自然、文化与生产生活方式的小型住宿设施。\n根据上述定义，下列属于民宿的是：","options":{"A":"王某在市中心有一套两居室的房子，过了马路就是知名的景区公园。王某将闲置房间租给那些节假日来旅游的家庭，并提供导游服务","B":"某家庭农场开发亲子休闲旅游业务，建设了农业科普、亲子游玩场所，为孩子和家长营造一处寓教于乐的乡村乐园","C":"李某通过某网上平台找到心仪城市的会员“交换”旅行，即双方各自为对方提供住宿，住在对方家中深入体验当地的风土人情","D":"张某在古镇上有一所老宅。他和某平台签订合同，将老宅租给该平台运营。该平台将老宅装修，并提供完善的酒店式服务机制"},"answer":"A","explanation":"第一步：找出定义关键词。\n“利用当地民居等相关闲置资源”、“经营用客房不超过4层、建筑面积不超过800平方米”、“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”。\n第二步：逐一分析选项。\nA项：王某有一套两居室的房子，将闲置房间租给旅游家庭，符合“利用当地民居等相关闲置资源”、“经营用客房不超过4层、建筑面积不超过800平方米”，并提供导游服务，符合“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”，符合定义，当选；\nB项：某家庭农场开发亲子休闲旅游业务，未提及该农场是否为闲置资源，不符合“利用当地民居等相关闲置资源”，也未提及该农场是否有经营用客房，不符合“经营用客房不超过4层、建筑面积不超过800平方米”，建设了农业科普、亲子游玩场所，不符合“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”，不符合定义，排除；\nC项：李某与心仪城市的会员“交换”旅行，双方各自为对方提供住宿，说明双方是互相为对方提供住宿，而非用于经营，不符合“经营用客房”，不符合定义，排除；\nD项：张某将古镇的老宅租给某平台，符合“利用当地民居等相关闲置资源”，将老宅租给该平台运营，由该平台提供完善的酒店式服务机制，说明该老宅的主人张某并不提供接待服务，不符合“主人参与接待，为游客提供体验当地自然、文化与生产生活方式”，不符合定义，排除。\n故正确答案为A。","no":88,"missingImage":false},{"qid":"5445801","cat":"定义判断","stem":"体验式采访是指直接投入到所要报道的新闻事件中去体验生活，以获得新闻报道所需要的素材，以及对新闻事件的认识。\n根据上述定义，下列不属于体验式采访的是：","options":{"A":"某报社要求年轻记者沉入生活，了解基层，以改变写官话、说套话的文风","B":"某作家为了解包身工的悲惨遭遇，深入到工厂中，写出报告文学《包身工》","C":"某记者为了解传销组织的真面目，打入到传销组织内部，揭示传销组织的骗局","D":"某电视台推出专栏《体验三百六十行》，派记者体验各职业一周并进行系列报道"},"answer":"A","explanation":"第一步：找出定义关键词。\n“直接投入到所要报道的新闻事件中”、“以获得新闻素材及认识”。\n第二步：逐一分析选项。\nA项：某报社要求年轻记者深入基层以改变写官话、说套话的文风，其目的是改变文风，而非获得新闻素材及认识，不符合“以获得新闻素材及认识”，不符合定义，当选；\nB项：某作家深入到工厂中，符合“直接投入到所要报道的新闻事件中”，其目的是了解包身工的悲惨遭遇，之后写出报告文学《包身工》，而报告文学兼有新闻和文学的特点，用文学手段处理新闻题材，符合“以获得新闻素材及认识”，符合定义，排除；\n\u003cimg data-k=\"f75197d7b4c3\" style=\"max-width:400px\">\nC项：某记者打入到传销组织内部，符合“直接投入到所要报道的新闻事件中”，其目的是了解传销组织的真面目以揭示其骗局，符合“以获得新闻素材及认识”，符合定义，排除；\nD项：记者体验各职业一周，符合“直接投入到所要报道的新闻事件中”，其目的是了解各行业以完成专栏《体验三百六十行》，符合“以获得新闻素材及认识”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":89,"missingImage":false},{"qid":"5445814","cat":"定义判断","stem":"伴性遗传是指控制性状的基因位于性染色体上，遗传总是与性别相关联，不同性别出现某一性状的概率不同的遗传。限性遗传是指控制性状的基因位于性染色体上，性状只在一种性别上得以表现，而在另一性别上完全不能表现的遗传。从性遗传是指控制性状的基因位于常染色体上，但由于受到性激素的作用，基因在不同性别中表达不同的遗传。\n根据上述定义，下列属于限性遗传的是：","options":{"A":"抗维生素D佝偻病是伴X染色体显性遗传病，女性发病率高，常表现为世代遗传","B":"人类外耳道多毛症为伴Y染色体遗传病，在家族男性亲属中代代遗传","C":"遗传性斑秃为常染色体显性遗传病，男性会出现早秃，而女性则不会出现","D":"红绿色盲症是伴X染色体隐性遗传病，男性发病率高，表现出交叉遗传和隔代遗传"},"answer":"B","explanation":"第一步：找出定义关键词。\n伴性遗传：“控制性状的基因位于性染色体上”、“不同性别出现某一性状的概率不同”；\n限性遗传：“控制性状的基因位于性染色体上”、“只在一种性别上得以表现，而在另一性别上完全不能表现”；\n从性遗传：“控制性状的基因位于常染色体上”、“由于受到性激素的作用，基因在不同性别中表达不同”。\n第二步：逐一分析选项。\nA项：抗维生素D佝偻病在女性中的发病率高，说明在女性中出现的概率高，符合“不同性别出现某一性状的概率不同”，符合伴性遗传定义，不符合“性状只在一种性别上得以表现，而在另一性别上完全不能表现”，不符合限性遗传定义，排除；\nB项：人类外耳道多毛症为伴Y染色体遗传病，在家族男性亲属中代代遗传，说明该病仅在家族男性中遗传，符合“性状只在一种性别上得以表现，而在另一性别上完全不能表现”，符合限性遗传定义，当选；\n\u003cimg data-k=\"ceb2fecc677d\" style=\"max-width:600px\">\nC项：遗传性斑秃为常染色体显性遗传病，说明其控制性状的基因位于常染色体上，不符合“控制性状的基因位于性染色体上”，不符合限性遗传定义，下面资料显示，遗传性斑秃属于从性遗传，排除；\n\n\u003cimg data-k=\"38b4a03e7be5\" style=\"max-width:600px\">\nD项：红绿色盲症在男性中发病率高，说明在男性中出现的概率高，符合“不同性别出现某一性状的概率不同”，符合伴性遗传定义，不符合“性状只在一种性别上得以表现，而在另一性别上完全不能表现”，不符合限性遗传定义，排除。\n故正确答案为B。","no":90,"missingImage":false},{"qid":"5445800","cat":"定义判断","stem":"预判设计是一种能够引导用户、缩短用户行为路径的有效设计手段。它可以根据用户的行为或用户所在的场景，让功能“主动找到”用户，并让用户与之产生自然的交互，为用户提供更好的使用体验，本质就是为用户多想一步，让用户使用起来尽量简单。\n根据上述定义，下列不属于预判设计的是：","options":{"A":"某购物软件，根据用户输入的搜索关键词，将商品按与关键词的相关性排列","B":"某翻译软件，用户第一次点击播放，语音速度正常；再次点击，语音速度变慢","C":"某外卖软件，当用户对店家给出差评，系统自动勾选“将评价设为匿名评价”","D":"某购物软件，所选商品缺货时，出现“找相似”按钮，点击可看到同款、相似商品"},"answer":"A","explanation":"第一步：找出定义关键词。\n“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”。\n第二步：逐一分析选项。\nA项：用户在购物软件输入搜索关键词以后，购物软件列出与用户搜索关键词相关的商品，此时仅仅是该软件配合了用户的搜索行为，并没有对其下一步行为进行预判，更没有引导用户，不符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，不符合定义，当选；\nB项：某翻译软件第一次点击播放，语速正常，再次点击，语速变慢，体现了产品会预判用户可能是刚刚没听清楚、或者想听清某个词的念法等，从而不用等用户自行操作，而主动将语音播放速度变慢，符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，符合定义，排除；\nC项：某外卖软件，当用户给差评时，系统自动勾选“匿名评价”，因为绝大多数用户给商家差评时都不希望商家看到自己的身份，所以该软件不等用户自行勾选匿名评价，而自动帮用户勾选，缩短了用户行为路径，为用户多想一步，符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，符合定义，排除；\nD项：大多数用户在购物软件上遇到想要的商品缺货时，接下来最可能的就是去找一些相似的商品，所以某购物软件为用户多想了一步，不用等用户自行搜索相似商品，而是当所选商品缺货时，自动出现“找相似”按钮，点击可看到同款、相似商品，符合“引导用户、缩短用户行为路径”、“让功能‘主动找到’用户”、“为用户多想一步，让用户使用起来尽量简单”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":91,"missingImage":false},{"qid":"5445785","cat":"定义判断","stem":"负性偏向是指负性信息比其他信息得到优先的注意和加工，这是人类在先天遗传和后天经验基础上存在的一种普遍性认知倾向，即给予负性事物更大的权重，并在注意、记忆、情绪、决策等方面遵循“坏比好重要”的心理原则。\n根据上述定义，下列没有体现负性偏向的是：","options":{"A":"“3·15”晚会报道侵犯消费者权益的违法行为，以期政府各级管理部门有效管理","B":"被试对负面词汇的再认正确率比正面词汇高，能更精准识别某负面词汇是否在语料中","C":"新闻传播过程中，模糊信息中的一些负面细节更容易被人们关注并作进一步负面解读","D":"应聘者的优缺点与职位具有同等相关性，但招聘者往往更关注应聘者的缺点"},"answer":"A","explanation":"第一步：找出定义关键词。\n“负性信息比其他信息得到优先的注意和加工”、“坏比好重要”。\n第二步：逐一分析选项。\nA项：“3·15”晚会报道违法行为，该项仅提及了“负性信息”，没有提到“其他信息”，也不存在“负性信息”与“其他信息”之间的比较，不符合“负性信息比其他信息得到优先的注意和加工”、“坏比好重要”，不符合定义，当选；\nB项：该项说被试对负面词汇的再认正确率比正面词汇高，能更精准识别负面词汇，体现了被试对负性信息更加注意，“比”和“更”体现了“负性信息”和“其他信息”之间的比较，符合“负性信息比其他信息得到优先的注意和加工”、“坏比好重要”，符合定义，排除；\nC项：该项说模糊信息中的一些负面细节更容易被人们关注并作进一步负面解读，说明相较于“其他信息”，人们更优先注意和加工“负性信息”，符合“负性信息比其他信息得到优先的注意和加工”、“坏比好重要”，符合定义，排除；\nD项：该项说在应聘者的优缺点中，招聘者更关注其缺点，说明相较于“其他信息”，招聘者更优先注意“负性信息”，符合“负性信息比其他信息得到优先的注意和加工”、“坏比好重要”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":92,"missingImage":false},{"qid":"5445787","cat":"定义判断","stem":"单元素导语是指在撰写新闻导语（即消息的开头）时，突出表现一个新闻事实的导语。单元素导语按新闻五要素可分为：①何人导语，突出报道显要或影响大的新闻人物；②何事导语，突出报道新闻事实本身；③何时导语，突出报道读者关心的事情什么时候会发生或进行；④何地导语，突出报道一些重要或有特殊意义的地方发生重大变化的消息；⑤为什么导语，突出报道一个事件的起因。\n根据上述定义，下列导语与其分类对应正确的是：","options":{"A":"亲爱的读者，你知道为什么夏天夜空里看到的星星比冬天夜空里看到的多？——④","B":"1964年10月16日，我国第一颗原子弹爆炸成功——②","C":"杨先生带着2岁的女儿到市医院看病，没想到看一个“咳嗽”就要花1000多元——①","D":"谁是高考状元？这个一年一度的热门话题，今年却在XX省消失了——③"},"answer":"B","explanation":"第一步：找出定义关键词。\n单元素导语：“在撰写新闻导语（即消息的开头）时，突出表现一个新闻事实”；\n何人导语：“突出报道显要或影响大的新闻人物”；\n何事导语：“突出报道新闻事实本身”；\n何时导语：“突出报道读者关心的事情什么时候会发生或进行”；\n何地导语：“突出报道一些重要或有特殊意义的地方发生重大变化的消息”；\n为什么导语：“突出报道一个事件的起因”。\n第二步：逐一分析选项。\nA项：为什么夏天夜空看到的星星比冬天夜空里看到的多是想要表现事件的起因，符合“突出报道一个事件的起因”，符合“为什么导语”定义，不符合“何地导语”定义，对应错误，排除；\nB项：1964年10月16日，第一颗原子弹爆炸成功是新闻事实本身，符合“突出报道新闻事实本身”，符合“何事导语”定义，对应正确，当选；\nC项：杨先生带着女儿到医院看病，一个“咳嗽”花费1000多元是新闻事实本身，符合“突出报道新闻事实本身”，符合“何事导语”定义，不符合“何人导语”定义，对应错误，排除；\nD项：高考状元今年在XX省消失了，报道该省发生的重大变化，符合“突出报道一些重要或有特殊意义的地方发生重大变化的消息”，符合“何地导语”定义，不符合“何时导语”定义，对应错误，排除。\n故正确答案为B。","no":93,"missingImage":false},{"qid":"5445764","cat":"定义判断","stem":"子弹时间即计算机辅助的摄影技术模拟变速特效，是一种使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效，例如强化的慢镜头、时间静止等效果。\n根据上述定义，下列描述符合子弹时间的是：","options":{"A":"电视剧中，男主角因车祸去世，女主角目睹了这个过程，此后很多年，她的眼前无数次闪现出车祸发生的过程","B":"江阿姨的丈夫去世之后，她每天的大部分时间都用来反复看他们以前拍摄的视频，时间在她身上似乎静止了","C":"科幻小说中，小明因考试结束时还没有答完卷子，祈祷时间暂停，然后他发现时间真的静止了，只有他可以答卷","D":"通过电视转播，观众们看到滑雪运动员的身体缓慢地在空中划出优美的曲线，翻转瞬间的每个动作都无比清晰"},"answer":"D","explanation":"第一步：找出定义关键词。\n“使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效”。\n第二步：逐一分析选项。\nA项：电视剧中女主角的眼前无数次闪现出男主角车祸发生的过程，并没有涉及摄影技术模拟变速特效，不符合“使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效”，不符合定义，排除；\nB项：江阿姨反复看以前拍摄的视频，并未涉及到电影、电视节目或电脑游戏等领域，时间在她身上似乎静止了，也没有使用摄影技术模拟变速特效，不符合“使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效”，不符合定义，排除；\nC项：科幻小说中的时间静止，并没有涉及摄影技术模拟变速特效，不符合“使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效”，不符合定义，排除；\nD项：通过电视转播，观众们看到滑雪运动员在滑雪过程中的一些慢动作，符合“使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效”，符合定义，当选。\n故正确答案为D。","no":94,"missingImage":false},{"qid":"5445786","cat":"定义判断","stem":"联合式构词法是由两个意义相同、相反或相对的词根联合起来构成新词的方法，在词内两个词根是平等的，没有主从、正副之分。\n根据上述定义，下列使用了联合式构词法的是：","options":{"A":"“叮当”，因摹拟动作的声音而构成的词","B":"“椅子”，在单字“椅”后面附加“子”而构成的词","C":"“蹉跎”，由韵母相同的两个单字组合构成意义与单字无关的词","D":"“开关”，由“开”和“关”两个单字组合而构成的词"},"answer":"D","explanation":"第一步：找出定义关键词。\n“由两个意义相同、相反或相对的词根联合起来构成新词”、“两个词根是平等的，没有主从、正副之分”。\n第二步：逐一分析选项。\nA项：“叮”和“当”代表两个不同的声音，二者不符合“由两个意义相同、相反或相对的词根联合起来构成新词”，不符合定义，排除；\nB项：“椅子”中侧重于“椅”，即“椅”为主，“子”为从，不符合“两个词根是平等的，没有主从、正副之分”，不符合定义，排除；\nC项：“蹉”的意思有失足、差错等，而“跎”的意思有背负、驼背等，二者不符合“由两个意义相同、相反或相对的词根联合起来构成新词”，不符合定义，排除；\nD项：“开关”是指电器装置上接通和截断电路的设备，“开”有打开的意思，“关”有关闭的意思，二者意思相反且无主从之分，符合“由两个意义相同、相反或相对的词根联合起来构成新词”、“两个词根是平等的，没有主从、正副之分”，符合定义，当选。\n故正确答案为D。","no":95,"missingImage":false},{"qid":"5445780","cat":"类比推理","stem":"铜镜：化妆镜","options":{"A":"门帘：纱帘","B":"木碗：汤碗","C":"金簪：发簪","D":"瓷瓶：古瓶"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n铜镜一般是指由含锡量较高的青铜铸造的镜子，化妆镜一般指专门用于化妆的镜子。有的铜镜是化妆镜，有的铜镜不是化妆镜，有的化妆镜是铜镜，有的化妆镜不是铜镜，二者为交叉关系，且前者是根据材质命名，后者是根据功能命名。\n第二步：判断选项词语间逻辑关系。\nA项：有的门帘是纱帘，有的门帘不是纱帘，有的纱帘是门帘，有的纱帘不是门帘，二者为交叉关系，但前者是根据悬挂的位置命名，与题干逻辑关系不一致，排除；\nB项：有的木碗是汤碗，有的木碗不是汤碗，有的汤碗是木碗，有的汤碗不是木碗，二者为交叉关系，且前者是根据材质命名，后者是根据功能命名，与题干逻辑关系一致，当选；\nC项：金簪是发簪的一种，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：古瓶可指古董瓶子或古代的瓶子，有的瓷瓶是古瓶，有的瓷瓶不是古瓶，有的古瓶是瓷瓶，有的古瓶不是瓷瓶，二者为交叉关系，但后者是根据历史时代命名，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":96,"missingImage":false},{"qid":"5445781","cat":"类比推理","stem":"小计：总计","options":{"A":"平均值：总值","B":"被乘数：总数","C":"单科分：总分","D":"分目录：总目"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“小计”是数字列表中一部分数字的总和，“总计”是数字列表中所有数字的总和，因此，所有“小计”相加可以得到“总计”，二者是对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“平均值”乘以群体总个数等于“总值”，与题干逻辑关系不一致，排除；\nB项：“被乘数”指乘法中被乘的数字，一般放在算式的前面，“总数”是所有数的总和，二者无明显逻辑关系，与题干逻辑关系不一致，排除；\nC项：所有“单科分”相加可以得到“总分”，二者是对应关系，与题干逻辑关系一致，当选；\nD项：“分目录”指在各部分之前的目录，“总目”指在整个文档之前的目录，“总目”是对“分目录”的汇总，不存在相加的计算关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":97,"missingImage":false},{"qid":"5445775","cat":"类比推理","stem":"海棠红：南瓜橙","options":{"A":"苏丹红：景泰蓝","B":"孔雀蓝：柠檬黄","C":"日落黄：鱼肚白","D":"橄榄绿：梅子青"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“海棠红”和“南瓜橙”是两种不同的颜色，二者为并列关系，且都是根据植物命名的。\n第二步：判断选项词语间逻辑关系。\nA项：“苏丹红”是一种化学染色剂，而“景泰蓝”正名“铜胎掐丝珐琅”，是一种在铜质的胎型上，用柔软的扁铜丝，掐成各种花纹焊上，然后把珐琅质的色釉填充在花纹内烧制而成的器物，且二者不是根据植物命名的，“景泰蓝”是因“明代景泰年间”该工艺技术制作达到巅峰而得名的，与题干逻辑关系不一致，排除；\nB项：“孔雀蓝”和“柠檬黄”是两种不同的颜色，二者为并列关系，但“孔雀蓝”不是根据植物命名的，与题干逻辑关系不一致，排除；\nC项：“日落黄”和“鱼肚白”是两种不同的颜色，二者为并列关系，但二者不是根据植物命名的，与题干逻辑关系不一致，排除；\nD项：“橄榄绿”和“梅子青”是两种不同的颜色，二者为并列关系，且二者都是根据植物命名的，与题干逻辑关系一致，当选。\n故正确答案为D。","no":98,"missingImage":false},{"qid":"5445762","cat":"类比推理","stem":"脱脂棉：原棉","options":{"A":"白酒：烧酒","B":"黑陶：黏土","C":"摄像头：镜头","D":"视力：视力表"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n原棉是制造脱脂棉的原材料，二者为原材料对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：烧酒也称白酒，二者为全同关系，与题干逻辑关系不一致，排除；\nB项：黏土是制造黑陶的原材料，二者为原材料对应关系，与题干逻辑关系一致，当选；\nC项：镜头是摄像头的组成部分，二者为组成关系，与题干逻辑关系不一致，排除；\nD项：视力表用于测量视力，二者不是原材料对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":99,"missingImage":false},{"qid":"5445816","cat":"类比推理","stem":"匿名投票：实名投票：现场投票","options":{"A":"早间会议：午间会议：工作会议","B":"战国文字：象形文字：古代汉字","C":"金融危机：粮食危机：生态危机","D":"油料作物：糖料作物：经济作物"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n匿名投票与实名投票是两种投票方式，二者为并列关系；有的现场投票是匿名投票，有的现场投票是实名投票，前两个词语与第三个词语均为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：早间会议和午间会议是两种会议类型，二者为并列关系；有的工作会议是早间会议，有的工作会议是午间会议，前两个词语与第三个词语均为交叉关系，与题干逻辑关系一致，当选；\nB项：战国文字是战国时期不同地区使用的汉字的统称；象形文字是由图画文字演化而来的一种最古老的字体，如埃及的象形文字、苏美尔文、古印度文以及中国的甲骨文。战国文字是一种古代汉字，二者为种属关系；有的象形文字是古代汉字，有的象形文字不是古代汉字，有的古代汉字是象形文字，有的古代汉字不是象形文字，二者为交叉关系，与题干逻辑关系不一致，排除；\nC项：金融危机是指金融资产、金融机构、金融市场的危机；粮食危机指因粮食供应不足造成的危机；生态危机指生态环境被严重破坏使人类的生存与发展受到威胁的现象，三者是不同领域的危机，为并列关系，与题干逻辑关系不一致，排除；\nD项：油料作物和糖料作物是两种经济作物，前两个词语为并列关系，与第三个词语均为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":100,"missingImage":false},{"qid":"5445779","cat":"类比推理","stem":"春季过敏：花粉：喷嚏","options":{"A":"肺炎：咳嗽：支原体","B":"乙型脑炎：病毒：发热","C":"失眠：恐惧：噩梦","D":"秋季腹泻：饮食：脱水"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n花粉可能会导致春季过敏，前两词为因果关系；打喷嚏是春季过敏的症状，第一词和第三词为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：咳嗽是肺炎的症状，前两词为对应关系；支原体感染可能会导致肺炎，第一词和第三词为因果关系，与题干逻辑关系不一致，排除；\nB项：病毒感染可能会导致乙型脑炎，前两词为因果关系；发热是乙型脑炎的症状，第一词和第三词为对应关系，与题干逻辑关系一致，当选；\nC项：恐惧可能会导致失眠，前两词为因果关系；噩梦不是失眠的症状，与题干逻辑关系不一致，排除；\nD项：秋季腹泻指发生在秋冬季的腹泻病，原因可能是饮食不当或饮食不洁，而非饮食，前两词不是因果关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":101,"missingImage":false},{"qid":"5445777","cat":"类比推理","stem":"资产评估：审核通过：股票发售","options":{"A":"预定新车：加装内饰：购买车险","B":"修剪草坪：设备检修：园林养护","C":"选购家电：上门安装：维修保养","D":"收看节目：视频连线：观众互动"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n先资产评估，再审核通过，最后股票发售，三者为时间先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：先预定新车，但购买车险和加装内饰并无固定的先后顺序，与题干逻辑关系不一致，排除；\nB项：修剪草坪是园林养护的一部分，与题干逻辑关系不一致，排除；\nC项：先选购家电，再上门安装，最后维修保养，三者为时间先后顺序的对应关系，与题干逻辑关系一致，当选；\nD项：视频连线是观众互动的一种方式，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":102,"missingImage":false},{"qid":"5445790","cat":"类比推理","stem":"标清：高清：超清","options":{"A":"亚音速：音速：超音速","B":"厅级：市级：省级","C":"迁怒：愤怒：暴怒","D":"幽静：寂静：安静"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n三者均对清晰度进行分类，构成并列关系，且清晰度依次递增。\n第二步：判断选项词语间逻辑关系。\nA项：三者均对速度进行分类，构成并列关系，且速度依次递增，与题干逻辑关系一致，当选；\nB项：厅级是我国的一个行政级别，而市级和省级属于我国的行政区划，三者不构成并列关系，与题干逻辑关系不一致，排除；\nC项：迁怒为动词，指把怒气发泄到别人身上，愤怒为形容词，指因极度不满而情绪激动，暴怒指极端愤怒，三者不构成并列关系，与题干逻辑关系不一致，排除；\nD项：幽静指清幽寂静，寂静指没有声音、很静，安静指安稳平静、没有声音，三者均是对静的描述，构成并列关系，但不是静的程度从低到高的依次递增，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":103,"missingImage":false},{"qid":"5445788","cat":"类比推理","stem":"深空探测 对于 （    ） 相当于 （    ） 对于 公益组织","options":{"A":"无人采样；慈善捐款","B":"遥感技术；红十字会","C":"宇宙空间；公益事业","D":"火星探测；社会组织"},"answer":"D","explanation":"逐一代入选项。\nA项：深空探测是指脱离地球引力场，进入太阳系空间和宇宙空间的探测。探测方式上，一般包括飞越、硬着陆（撞击）、环绕、软着陆（+巡视）、无人采样返回、载人探测等形式，无人采样是一种深空探测的方式，二者为种属关系；公益组织一般为组织慈善捐款的主体，二者为对应关系，前后逻辑关系不一致，排除；\nB项：遥感技术是从人造卫星、飞机或其他飞行器上收集地物目标的电磁辐射信息，判认地球环境和资源的技术，在深空探测中会应用到遥感技术，二者为对应关系；红十字会是公益组织，二者为种属关系，前后逻辑关系不一致，排除；\nC项：深空探测的对象之一是宇宙空间，二者为工作对象的对应关系；公益组织是致力于社会公益事业和解决各种社会性问题的民间志愿性的社会中介组织，公益组织的工作对象之一是公益事业，二者为工作对象的对应关系，但前后顺序相反，前后逻辑关系不一致，排除；\nD项：火星探测是一种深空探测，二者为种属关系；公益组织是一种社会组织，二者为种属关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":104,"missingImage":false},{"qid":"5445791","cat":"类比推理","stem":"刑事警察 对于 （    ） 相当于 （    ） 对于 对外交涉","options":{"A":"公安机关；维护主权","B":"刑事案件；驻外武官","C":"打击犯罪；外交人员","D":"交通警察；外交领事"},"answer":"C","explanation":"逐一代入选项。\nA项：刑事警察是构成公安机关的一部分，二者为组成关系；对外交涉的目的是为了维护主权，二者为方式目的对应关系，前后逻辑关系不一致，排除；\nB项：刑事警察的主要任务是侦查刑事案件，刑事案件本身是一个名词，只是刑事警察的工作对象，二者为职业与工作对象的对应关系；驻外武官的主要任务是对外交涉，二者为职业与工作内容的对应关系，前后逻辑关系不一致，排除；\nC项：刑事警察的工作内容是打击犯罪，二者为职业与工作内容的对应关系；外交人员的工作内容是对外交涉，二者为职业与工作内容的对应关系，前后逻辑关系一致，当选；\nD项：刑事警察和交通警察都是警察，二者为并列关系中的反对关系；外交领事是一国根据协议派驻他国某城市或某地区的代表，是进行对外交涉的代表人物，二者是职业与工作内容的对应关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":105,"missingImage":false},{"qid":"5445784","cat":"逻辑判断","stem":"深度学习是一系列复杂的算法，使计算机能够识别数据中的模式并作出预测。研究人员利用深度学习技术训练AI系统自动读取视网膜扫描数据，并识别那些在接下来的一年中患心脏病风险较高的人。研究人员认为该项技术有可能彻底改变传统的心脏病筛查方式。\n上述论证的成立须补充以下哪项作为前提？","options":{"A":"视网膜扫描数据反映的微小血管变化是预测心脏疾病较为灵敏的指标","B":"心脏病筛查需要进行复杂且昂贵的超声心动图或心脏磁共振成像检查","C":"视网膜扫描相对便宜，并且在许多配镜服务中被使用","D":"AI系统是解开自然界中存在的复杂模式的绝佳工具"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：深度学习技术有可能彻底改变传统的心脏病筛查方式。\n论据：研究人员利用深度学习技术训练AI系统自动读取视网膜扫描数据，并识别那些在接下来的一年中患心脏病风险较高的人。\n本题提问为“须补充以下哪项作为前提”，优先考虑搭桥和必要条件。论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，而论据讨论的是利用深度学习技术可以训练AI系统自动读取视网膜扫描数据，二者话题不一致，优先考虑搭桥，即建立“视网膜扫描数据”和“心脏病筛查”的联系。\n第二步：逐一分析选项。\nA项：该项说的是视网膜扫描数据反映的微小血管变化可以用来预测心脏疾病，将“视网膜扫描数据”和“心脏病筛查”建立了联系，属于搭桥项，可以加强，当选；\nB项：该项说的是心脏病筛查需要进行复杂且昂贵的超声心动图或心脏磁共振成像检查，而论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，话题不一致，无法加强，排除；\nC项：该项说的是视网膜扫描相对便宜且在配镜中使用很多，而论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，话题不一致，无法加强，排除；\nD项：该项说的是AI系统是解开自然界中存在的复杂模式的绝佳工具，而论点讨论的是深度学习技术有可能彻底改变传统的心脏病筛查方式，话题不一致，无法加强，排除。\n故正确答案为A。","no":106,"missingImage":false},{"qid":"5445794","cat":"逻辑判断","stem":"人们感受气味通过嗅觉受体实现。研究发现：随着人类的演化，编码人类嗅觉受体的基因不断突变，许多在过去能强烈感觉气味的嗅觉受体已经突变为对气味不敏感的受体，与此同时，人类嗅觉受体的总体数目也随时间推移逐渐变少。由此可以认为，人类的嗅觉经历着不断削弱、逐渐退化的过程。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"随着人类进化，嗅觉中枢在大脑皮层中所占面积逐渐减少","B":"相对于视觉而言，嗅觉在人类感觉系统中的重要性较低","C":"人类有大约1000个嗅觉受体相关基因，其中只有390个可以编码嗅觉受体","D":"不同人群之间嗅觉存在很大差异，老年人的嗅觉敏感性明显低于年轻人"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：人类的嗅觉经历着不断削弱、逐渐退化的过程。\n论据：随着人类的演化，编码人类嗅觉受体的基因不断突变，许多在过去能强烈感觉气味的嗅觉受体已经突变为对气味不敏感的受体，与此同时，人类嗅觉受体的总体数目也随时间推移逐渐变少。\n本题论点论据均在讨论人类的嗅觉在逐渐退化，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出嗅觉中枢在大脑皮层中所占面积逐渐减少，说明嗅觉能力在降低，补充论据，可以加强，当选；\nB项：该项比较了视觉和嗅觉在人类感觉系统中的重要性，而论点讨论的是人类的嗅觉是否退化，话题不一致，无法加强，排除；\nC项：该项指出了人类的1000个嗅觉受体相关基因中有390个可以编码嗅觉受体，没有体现出数量变化的多少，而题干讨论的是嗅觉逐渐退化的过程，话题不一致，无法加强，排除；\nD项：该项讨论的是老年人和年轻人的嗅觉敏感性，而论点讨论的是人类的嗅觉是否退化，话题不一致，无法加强，排除。\n故正确答案为A。","no":107,"missingImage":false},{"qid":"5445773","cat":"逻辑判断","stem":"调查显示，84.8%的家长倾向于给孩子购买标有“儿童”字样的食品。几乎每一款“儿童食品”都宣称“无添加，适合孩子健康成长”。家长热衷于购买有“儿童”标签的食品是因为他们觉得，标有“儿童”字样的食品更加营养健康，更适合儿童。\n以下哪项如果为真，最能质疑家长的观点？","options":{"A":"我国目前并没有设置专门的“儿童食品”分类，“儿童食品”缺乏专门的法律法规与食品安全国家标准","B":"孩子在不同年龄阶段，对各种营养物质的需求量会发生变化，而几乎所有“儿童食品”都没有明确的年龄分段和食用提示","C":"所谓的“儿童食品”，成分通常与普通食品没什么区别，甚至可能因为添加过量的调味物质而有害儿童健康","D":"儿童食品的外包装设计和食品形状设计都更符合儿童的审美，会导致儿童因为喜欢外形而过量进食"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：家长热衷于购买有“儿童”标签的食品是因为他们觉得，标有“儿童”字样的食品更加营养健康，更适合儿童。\n论据：无。\n本题只有论点没有论据，削弱可以优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：选项说的是“儿童食品”缺乏专门的法律法规与食品安全国家标准，但不明确“儿童食品”本身是否营养健康，为不明确项，无法削弱，排除；\nB项：选项说的是“儿童食品”没有明确的年龄分段和食用提示，但不明确“儿童食品”是否具备不同年龄阶段所需的营养物质，为不明确项，无法削弱，排除；\nC项：选项说的是“儿童食品”成分和普通食品一样，甚至可能对儿童产生危害，说明“儿童食品”并不是营养健康的，否定论点，可以削弱，当选；\nD项：选项说的是儿童会因为产品的外形而过量进食，而论点讨论的是“儿童食品”是否营养健康，与论点讨论的话题不一致，为无关项，无法削弱，排除。\n故正确答案为C。","no":108,"missingImage":false},{"qid":"5445783","cat":"逻辑判断","stem":"电商直播可以为农产品的营销提供一条有效的渠道，在农产品供应链的运作上要明显优于传统的“农户\u003cimg data-k=\"a37757d411ef\">批发商\u003cimg data-k=\"a37757d411ef\">分销商\u003cimg data-k=\"a37757d411ef\">消费者”模式。但目前在很多地方，电商直播营销模式并没有有效解决农产品卖难买难的问题。有从业者认为只要完善农产品物流配送体系，提高直播人员素质，就能有效解决这一问题。\n以下哪项如果为真，不能支持上述从业者的观点？","options":{"A":"直播内容重复单调，易引起消费者审美疲劳，不利于树立起良好的产品形象，影响了农产品直播的效果","B":"部分地区没有对农产品的生产、包装、运输以及销售等环节制定统一的标准，对农产品的质检投入不足","C":"在电商直播模式下，对物流的需求会增加，现有的冷链物流水平无法满足日益增长的农产品消费需求","D":"许多地区的农户居住比较分散，农产品出村进城“最先一公里”的物流运输难题，始终未能完全得到解决"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：只要完善农产品物流配送体系，提高直播人员素质，就能有效解决农产品卖难买难的问题。\n论据：无。\n本题只有论点没有论据，加强优先考虑补充论据，因是加强选非题，找到说明完善农产品物流配送体系或提高直播人员素质能有效解决农产品卖难买难的问题的选项排除即可。\n第二步：逐一分析选项。\nA项：该项说明目前直播内容重复单调，易引起消费者审美疲劳，影响了农产品直播的效果，直播内容和直播人员素质有关，也就是说提高人员素质可以有效解决农产品卖难买难的问题，可以加强，排除；\nB项：该项说明部分地区还存在对农产品的质检投入不足等问题，而论点说只要“完善农产品物流配送体系”“提高直播人员素质”，就能有效解决卖难买难的问题，选项却指出“即使完善农产品物流配送体系，提高直播人员素质，因为农产品还存在其他问题，也不一定能解决卖难买难的问题”，具有削弱力度，无法加强，当选；\nC项：该项说明现有的冷链物流水平无法满足农产品消费需求，即物流配送体系不完善，也就是说完善农产品物流配送体系能有效解决农产品卖难买难的问题，可以加强，排除；\nD项：该项说明农产品出村进城的物流运输难题未能得到解决，即物流配送体系不完善，也就是说完善农产品物流配送体系能有效解决农产品卖难买难的问题，可以加强，排除。\n本题为选非题，故正确答案为B。","no":109,"missingImage":false},{"qid":"5445803","cat":"逻辑判断","stem":"R行星是位于太阳系的一颗小行星，质量不大，平均直径不足500米。在对R行星进行长达一年的观测后，人们发现其表面长期漂浮着砂粒，且砂粒在漂浮一段时间后，还会重新落在行星表面。由于R行星表面没有稳定的大气层，因此人们认为砂粒漂浮的现象主要来自静电，原因是太阳风进入行星表面产生电场时，砂粒会因静电力的作用离开行星表面漂浮游动起来，当没有太阳风时，砂粒又会回落下来。\n以下哪项如果为真，没有质疑上述观点？","options":{"A":"R行星与彗星组成类似，彗星靠近太阳时，受太阳风产生的静电影响，其表面砂粒将会漂浮","B":"R行星表面存在一氧化碳、干冰等挥发性物质，其升华会带动砂粒的释放与漂浮","C":"R行星质量小，静电作用只能扬起毫米级的砂粒，但目前其表面漂浮的砂粒尺寸都很大","D":"R行星自转速度快，星球上的物体受到离心作用强，其表面尘埃与石块会脱离引力束缚，剥落散逸"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：R行星砂粒漂浮的现象主要来自静电。\n论据：R行星表面没有稳定的大气层，太阳风进入行星表面产生电 <script>
(function(){

var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
