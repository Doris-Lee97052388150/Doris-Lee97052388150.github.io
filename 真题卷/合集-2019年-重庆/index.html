no":67,"missingImage":false},{"type":"question","qid":"2423309","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"2626780629f8\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"九宫格优先横向看，每一行三幅图中黑球的数量相同，元素组成相同，优先考虑位置规律。每幅图都可看作由内圈4个“格子”和外圈12个“格子”构成，第一行图形中，内圈的小黑球在4个“格子”中每次逆时针移动一格，外圈的小黑球均在12个“格子”中每次顺时针移动一格。验证第二行图形符合此规律，对第三行图形应用此规律，问号处图形内圈的小黑球应在右下角，只有A项符合规律，此时满足外圈的小黑球每次顺时针移动一格。\n故正确答案为A。","no":68,"missingImage":false},{"type":"question","qid":"2423313","cat":"图形推理","stem":"左边给定的是纸盒的外表面，下列哪一项能由它折叠而成？\n\u003cimg data-k=\"704a7971d011\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"将原展开图标上序号如下图，逐一进行分析。\n\u003cimg data-k=\"8f8bc3cb4aeb\" style=\"max-width:554px\">\nA项：正面是面d，顶面是面c，右面是面a，展开图里面a中的白色部分挨着面c中的灰色直角三角形，而选项面a中的白色部分挨着面d中的白色直角三角形，选项与题干不一致，排除；\nB项：正面是面f，顶面是面c，右面是面d，选项与题干一致，当选；\nC项：正面是面a，右面是面c，展开图里面a中的白色部分挨着面c，而选项面a中的黑色部分挨着面c，选项与题干不一致，排除；\nD项：顶面是面c，右面是面f，由于面c和面e是相对面，故正面是面b，展开图面b挨着面f中的白色直角三角形，而选项面b挨着面f中的黑色直角三角形，选项与题干不一致，排除。\n故正确答案为B。","no":69,"missingImage":false},{"type":"question","qid":"2423322","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"779220451dc0\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"图形元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，图五出现“五角星”变形图，图四、选项C、D中出现了多端点图形，考虑笔画数。图一有2个奇点，图二有2个奇点，图三有2个奇点，图四有2个奇点，图五有0个奇点，题干中图形均为一笔画图形，所以“？”处应为一笔画图形。A项两笔画，B项一笔画，C项两笔画，D项两笔画。\n故正确答案为B。","no":70,"missingImage":false},{"type":"question","qid":"2423323","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"dae32f21bb65\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"图形元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，题干和选项均是线与线相交，线条交叉明显，考虑数点。题干第一组图形的交点数依次为2、3、4，第二组图形的交点数依次为3、4，“？”处图形应有5个交点。A项有5个交点，B项有3个交点，C项有3个交点，D有4个交点。\n故正确答案为A。","no":71,"missingImage":false},{"type":"question","qid":"2423328","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"ca9c4f217a79\" style=\"max-width:700px\">","options":{"A":"①②③，④⑤⑥","B":"①②⑤，③④⑥","C":"①②⑥，③④⑤","D":"①④⑤，②③⑥"},"answer":"D","explanation":"本题为分组分类题目。元素组成不同，无明显属性规律，考虑数量规律。观察发现，题干图形均为方块内线条相交构成图。图①内部线条与四个端点相交的个数有2个，图②有3个，图③有3个，图④有2个，图⑤有2个，图⑥有3个。图①④⑤内部线条与四个端点相交的个数有2个，图②③⑥内部线条与四个端点相交的个数有3个。即①④⑤一组，②③⑥一组。\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"2423318","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"e9fb89a4971b\" style=\"max-width:679px\">","options":{"A":"①②③，④⑤⑥","B":"①②⑤，③④⑥","C":"①②④，③⑤⑥","D":"①③⑤，②④⑥"},"answer":"D","explanation":"本题为分组分类题目。元素组成不同，无明显属性规律，考虑数量规律。观察发现，题干中均为内部线条与外框相交构成图形，其中①③⑤所有面都跟外框相连，②④⑥中间都有1个面与外框不相连。即①③⑤一组，②④⑥一组。\n故正确答案为D。","no":73,"missingImage":false},{"type":"question","qid":"2423327","cat":"定义判断","stem":"群落的分层现象是指不同的生物种出现于地面以上不同的高度和地面以下不同的深度，从而使整个群落在垂直方向上呈现上下分层分布的现象，这一现象也被称为群落的垂直结构。\n根据上述定义，下列没有反映群落分层现象的是：","options":{"A":"森林中层栖息着山雀、啄木鸟等鸟类，林冠层则栖息着柳莺、交嘴雀等鸟类","B":"自然保护区中的松柏高低错落，有的树根交错，互相缠绕，形成独特的层次感","C":"海洋中，上层生活着浮游生物，中层生活着不同的鱼类，下层生活着海星等底栖生物","D":"热带雨林中，乔木植物由于高大往往遮住了阳光，其下方生长着耐阴喜湿的草本植物"},"answer":"B","explanation":"第一步：找出定义关键词。\n“不同的生物种出现于地面以上不同的高度和地面以下不同的深度”、“整个群落在垂直方向上呈现上下分层分布的现象”。\n第二步：逐一分析选项。\nA项：森林中层栖息着山雀、啄木鸟等鸟类，林冠层栖息着柳莺、交嘴等鸟类。符合“不同的生物种出现于地面以上不同的高度”、“整个群落在垂直方向上呈现上下分层分布的现象”，符合定义，排除； \nB项：自然保护区中的松柏高低错落，具有独特的层次感，只出现了松柏一个生物物种。不符合“不同的生物种出现于地面以上不同的高度和地面以下不同的深度”，不符合定义，当选；\nC项：海洋中，上层、中层、下层分别生活着浮游生物、鱼类和底栖生物。符合“不同的生物种出现于地面以下不同的深度”、“整个群落在垂直方向上呈现上下分层分布的现象”，符合定义，排除；\nD项：热带雨林中，乔木植物的下方生长着草本植物。符合“不同的生物种出现于地面以上不同的高度”、“整个群落在垂直方向上呈现上下分层分布的现象”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":74,"missingImage":false},{"type":"question","qid":"2423340","cat":"定义判断","stem":"化学抗性是指人或动植物由于长期大量使用抗生素或化学药物，使机体内外的病原体产生适应性或抵抗力，使得原药效降低的现象。其中，病原体是指造成人或动植物感染疾病的微生物、寄生虫或其他媒介。\n根据上述定义，下列没有反映化学抗性的是：","options":{"A":"对玉米地使用呋喃丹后线虫骤减，但5年后，线虫不再对药物敏感，又开始繁殖","B":"某产棉区种棉过程中发现一些棉株能天然抵抗棉铃虫侵害，于是广泛种植该种类棉花","C":"喂鸡饲料中含有抗生素，当鸡体内的细菌产生抗药性后，人们食用了鸡肉，也会被该细菌感染","D":"为防治水稻白叶枯病，某县城村庄在田间大量施用药物噻枯唑，几年后白叶枯病菌产生了抗药性"},"answer":"B","explanation":"第一步：找出定义关键词。\n“人或动植物由于长期大量使用抗生素或化学药物，使机体内外的病原体产生适应性或抵抗力，使得原药效降低的现象”；\n第二步：逐一分析选项。\nA项：玉米地使用呋喃丹使得线虫减少，属于对植物使用了化学药物，而线虫属于病原体。5年后线虫不再对药物敏感，又开始繁殖，说明原药效降低了。符合“植物由于长期大量使用抗生素或化学药物，使机体内外的病原体产生适应性或抵抗力，使得原药效降低的现象”，符合定义，排除； \nB项：某产棉区广泛种植能天然抵抗棉铃虫的棉株。没有对植物使用抗生素或化学药物，不符合“人或动植物由于长期大量使用抗生素或化学药物，使机体内外的病原体产生适应性或抵抗力，使得原药效降低的现象”，不符合定义，当选；\nC项：喂鸡的饲料含有抗生素，鸡体内细菌会产生抗药性。符合“动物由于长期大量使用抗生素或化学药物，使机体内外的病原体产生适应性或抵抗力，使得原药效降低的现象”，符合定义，排除；\nD项：白叶枯病菌属于水稻的外在病原体，大量使用药物噻枯唑使得白叶枯病菌产生抗药性。符合“植物由于长期大量使用抗生素或化学药物，使机体内外的病原体产生适应性或抵抗力，使得原药效降低的现象”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":75,"missingImage":false},{"type":"question","qid":"2423348","cat":"定义判断","stem":"作为人体的生理功能，免疫能识别“自己”和“非己”成分，破坏和排斥进入人体的抗原物质（如病菌等），或自身产生的损伤细胞和肿瘤细胞等，以维持健康。非消除性免疫是免疫的一种类型，指宿主感染寄生虫后不能清除或不能完全清除已经建立了感染的寄生虫，但对同种寄生虫的再感染具有一定程度的抵抗力。\n根据上述定义，下列反映了非消除性免疫的是：","options":{"A":"热带利什曼原虫引起疖肿，当人体获得免疫力后原虫完全被清除，临床症状消失，不再感染","B":"人体感染疟原虫后，体内疟原虫未被清除，维持低虫血症，但人体对这类感染具有一定的抵抗力","C":"人体被血吸虫感染后出现发热、肝脾肿大症状，使用驱虫药后治愈，再感染时对入侵的童虫有一定的抵抗力","D":"甲流病毒H1N1感染了某些人群后，这些人体内的吞噬类细胞会将病毒吞噬从而治愈，获得免疫力，但他们仍会感染H7N9型甲流"},"answer":"B","explanation":"第一步：找出定义关键词。\n“宿主感染寄生虫后不能清除或不能完全清除已经建立了感染的寄生虫，但对同种寄生虫的再感染具有一定程度的抵抗力”；\n第二步：逐一分析选项。\nA项：人体获得免疫力后热带利什曼原虫完全被清除。不符合“宿主感染寄生虫后不能清除或不能完全清除已经建立了感染的寄生虫”，不符合定义，排除； \nB项：人体感染疟原虫后，体内疟原虫未被清除，同时人体对这类感染具有一定的抵抗力。符合“宿主感染寄生虫后不能清除或不能完全清除已经建立了感染的寄生虫，但对同种寄生虫的再感染具有一定程度的抵抗力”，符合定义，当选；\nC项：使用驱虫药能完全治愈被血吸虫感染后出现的发热、肝脾肿大症状。不符合“宿主感染寄生虫后不能清除或不能完全清除已经建立了感染的寄生虫”，不符合定义，排除；\nD项：人体内的吞噬类细胞会将甲流病毒H1N1吞噬，从而治愈，获得免疫力。没有体现出人体感染了寄生虫，不符合“宿主感染寄生虫后不能清除或不能完全清除已经建立了感染的寄生虫”，不符合定义，排除。\n故正确答案为B。","no":76,"missingImage":false},{"type":"question","qid":"2423351","cat":"定义判断","stem":"人们通常把因环境污染和环境破坏而对公众和社会所造成的危害叫做公害。公害病是公害发生的地区性疾病。其特征包括：①由人类活动造成的环境污染所引起；②损害健康的环境污染因素复杂；③其流行一般具有长期陆续发病的特征，还可能累及胎儿，危害后代；④属新病种，有些发病机制还不清楚，缺乏特效疗法。\n根据上述定义，下列不属于公害病的是：","options":{"A":"人们食用了被镉污染的水稻后罹患骨痛病，骨骼疼痛难忍，无特效疗法","B":"某地区玉米、小麦受到霉菌（尤其是镰刀菌）感染后会产生毒素，人们食用后会破坏人体骨骼生长，导致四肢短小","C":"某地区使用重油燃料，排出废气中含有大量的二氧化硫，造成了严重的大气污染，引起当地居民罹患支气管哮喘、肺气肿等疾病","D":"含无机汞的工业废水排入水体后，被细菌转化为毒性更强的甲基汞，富集于水生生物体内，人们长期食用后出现神经系统损伤，波及后代"},"answer":"B","explanation":"第一步：找出定义关键词。\n公害：因环境污染和环境破坏而对公众和社会所造成的危害。\n公害病：公害发生的地区性疾病。其特征包括：①由人类活动造成的环境污染所引起；②损害健康的环境污染因素复杂；③其流行一般具有长期陆续发病的特征，还可能累及胎儿，危害后代；④属新病种，有些发病机制还不清楚，缺乏特效疗法。\n第二步：逐一分析选项。\nA项：镉污染符合“①由人类活动造成的环境污染所引起”、“②损害健康的环境污染因素复杂”，骨骼疼痛难忍，无特效疗法符合“④属新病种，有些发病机制还不清楚，缺乏特效疗法”，符合定义，排除； \nB项：某地区玉米、小麦受到霉菌(尤其是镰刀菌)感染，不符合“①由人类活动造成的环境污染所引起”，不符合定义，当选；\nC项：某地区使用重油燃料，排出废气中含有大量的二氧化硫，造成了严重的大气污染，符合“①由人类活动造成的环境污染所引起，②损害健康的环境污染因素复杂”，引起当地居民罹患支气管哮喘、肺气肿等疾病符合“③其流行一般具有长期陆续发病的特征，还可能累及胎儿，危害后代”，符合定义，排除；\nD项：含无机汞的工业废水排入水体后，被细菌转化为毒性更强的甲基汞，富集于水生生物体内，符合“①由人类活动造成的环境污染所引起”，人们长期食用后出现神经系统损伤，波及后代，符合“③其流行一般具有长期陆续发病的特征，还可能累及胎儿，危害后代”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":77,"missingImage":false},{"type":"question","qid":"2423354","cat":"定义判断","stem":"清洁生产是指不断采取改进设计、使用清洁的能源和原料、采用先进的工艺技术与设备、改善管理、综合利用等措施，从源头削减污染，提高资源利用效率，减少或者避免生产、服务和产品使用过程中污染物的产生和排放，以减轻或者消除环境危害的生产方式。\n根据上述定义，下列不涉及清洁生产的是：","options":{"A":"企业淘汰有毒有害的原材料，并在全部排放物和废物离开生产过程以前，尽最大可能减少它们的排放量和毒性","B":"企业采用少废、无废的生产工艺技术和高效生产设备，减少生产过程中的各种危险因素和有毒有害的中间产品","C":"企业选择再使用与再循环性的材料，这样可以通过提高环境质量和减少成本获得经济与环境收益","D":"企业主动设置控制污染物排放标准，严格控制内部各部门污染物排污口，引进治污设备，使排放的污染物通过治理达到排放标准"},"answer":"D","explanation":"第一步：找出定义关键词。\n“不断采取改进设计、使用清洁的能源和原料、采用先进的工艺技术与设备、改善管理、综合利用等措施”、“从源头削减污染，提高资源利用效率，减少或者避免生产、服务和产品使用过程中污染物的产生和排放”、“减轻或者消除环境危害”、“生产方式”。\n第二步：逐一分析选项。\nA项：企业淘汰有毒有害的原材料符合“使用清洁的能源和原料”，并在全部排放物和废物离开生产过程以前尽最大可能减少它们的排放量和毒性，符合“从源头削减污染、减少生产产品过程中污染物的产生和排放”，符合“减轻或者消除环境危害的生产方式”，符合定义，排除； \nB项：企业采用少废、无废的生产工艺技术和高效生产设备符合“采用先进的工艺技术与设备”，减少生产过程中的各种危险因素和有毒有害的中间产品符合“从源头削减污染、减少生产产品过程中污染物的产生和排放”，符合“减轻或者消除环境危害的生产方式”，符合定义，排除；\nC项：企业选择再使用与再循环性的材料，通过提高环境质量和减少成本获得经济与环境收益，符合“使用清洁的能源和原料”，符合“从源头削减污染、减少生产产品过程中污染物的产生和排放”，符合“减轻或者消除环境危害”，符合定义，排除；\nD项：设置控制污染物排放标准，严格控制内部各部门污染物排污口，引进治污设备，是产品生产过程之后的污染治理过程，不是一种“生产方式”，不符合“从源头削减污染、减少生产产品过程中污染物的产生和排放”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"2423358","cat":"定义判断","stem":"叙述视角是指叙述语言中对故事内容进行观察和讲述的特定角度。其中，内视角指的是叙述者只借助某个人物的感觉和意识，从他的视觉、听觉及感受的角度去传达一切，叙述者等同于该人物本身，即叙述者所知道的同该人物知道的一样多。\n根据上述定义，下列反映了内视角的是：","options":{"A":"《金锁记》中，作者采用全知全能的叙述方式，揭示了曹七巧等人的悲剧命运","B":"《白象似的群山》中，作者置身于所有角色之外，客观叙述故事中的人物命运","C":"《孔乙己》中，作者即故事中的小伙计，用旁观者的口吻描写其所见所闻","D":"《包法利夫人》中，作者以局外人的身份展示情节，给读者极大的想象空间"},"answer":"C","explanation":"第一步：找出定义关键词。\n叙述视角：“对故事内容进行观察和讲述”。\n内视角：“只借助某个人物的感觉和意识”、“从他的视觉、听觉及感受的角度去传达一切”、“叙述者所知道的同该人物知道的一样多”。\n第二步：逐一分析选项。\nA项：全知全能的叙述方式，不符合“只借助某个人物的感觉和意识”，也不符合“从他的视觉、听觉及感受的角度去传达一切”，不符合定义，排除； \nB项：作者置身于所有角色之外，客观叙述故事中的人物命运，不符合“只借助某个人物的感觉和意识”，也不符合“从他的视觉、听觉及感受的角度去传达一切”，不符合定义，排除； \nC项：作者即故事中的小伙计，符合“只借助某个人物的感觉和意识”，也符合“叙述者所知道的同该人物知道的一样多”，描写其所见所闻符合“从他的视觉、听觉及感受的角度去传达一切”，符合定义，当选；\nD项：以局外人的身份展示情节，不符合“只借助某个人物的感觉和意识”，也不符合“从他的视觉、听觉及感受的角度去传达一切”，不符合定义，排除。\n故正确答案为C。","no":79,"missingImage":false},{"type":"question","qid":"2423361","cat":"定义判断","stem":"光周期指的是昼夜周期中光照期和暗期长短的交替变化。植物在生长发育进程中，必须经过一定时间的适宜光周期后才能开花，否则会一直处于营养生长状态而不开花。这种昼夜长短影响植物开花的现象称为光周期现象。\n根据上述定义，下列没有反映光周期现象的是：","options":{"A":"大豆性喜暖，种子在10～12\u003cimg data-k=\"a4f8cb3af98a\">开始发芽，如遇低温则结荚延迟，低于14\u003cimg data-k=\"a4f8cb3af98a\">不能开花","B":"天仙子必须满足一定天数的8.5～11.5小时日照才能开花，如果日照长度短于8.5小时它就不能开花","C":"秋菊在每天14小时的长日照下进行茎叶营养生长，在每天12小时以上的黑暗与10\u003cimg data-k=\"a4f8cb3af98a\">的夜温下才能够开花","D":"芹菜是长日照型植物，需要14小时以上的日照才可抽薹开花，冬季需适当人工补充光照以满足其生长需求"},"answer":"A","explanation":"第一步：找出定义关键词。\n“昼夜周期中光照期和暗期长短的交替变化”、“必须经过一定时间的适宜光周期后才能开花”。\n第二步：逐一分析选项。\nA项：大豆需要在10°～12\u003cimg data-k=\"a4f8cb3af98a\">发芽，不涉及光照变化，不符合定义，当选； \nB项：天仙子必须满足一定天数的日照才能开花，符合“昼夜周期中光照期和暗期长短的交替变化”，也符合“必须经过一定时间的适宜光周期后才能开花”，符合定义，排除；\nC项：秋菊每天需要12小时以上的黑暗才能开花，符合“昼夜周期中光照期和暗期长短的交替变化”，也符合“必须经过一定时间的适宜光周期后才能开花”，符合定义，排除；\nD项：芹菜需要14小时以上日照才能开花，符合“昼夜周期中光照期和暗期长短的交替变化”，也符合“必须经过一定时间的适宜光周期后才能开花”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":80,"missingImage":false},{"type":"question","qid":"2423362","cat":"定义判断","stem":"似不注意和似注意都是注意的一种，其中似不注意是指貌似不注意一事物而实际的心理活动却十分注意这一事物，而似注意是指表面上注意某些事物，但实际上心里却想着其他事物。\n根据上述定义，下列属于似不注意的是：","options":{"A":"小李参加部门会议时，心里一直在想下个月休假去哪里玩","B":"传说王羲之在书法创作时太过投入，有一次竟将馒头蘸着墨汁食用","C":"学生在教室里听课，突然从外面进来一个人，这时学生就会中断听课，不由自主地注意进来的人","D":"刑事侦查人员在人群中发现了侦缉对象，为了不打草惊蛇，往往选择假装没看见，然后悄悄靠近，最后出其不意地将对象抓获"},"answer":"D","explanation":"第一步：找出定义关键词。\n似不注意：貌似不注意一事物而实际的心理活动却十分注意这一事物；\n似注意：指表面上注意某些事物，但实际上心里却想着其他事物。\n第二步：逐一分析选项。\nA项：小李参加会议时想着休假的事情，符合“表面上注意某些事物，但实际上心里却想着其他事物”，符合“似注意”定义，不符合“似不注意”定义，排除； \nB项：王羲之投入到书法创作中，是全神贯注地注意，不涉及不注意，不符合任何一个定义，排除；\nC项：学生听课的注意力被突然出现的人打断，不涉及不注意，不符合任何一个定义，排除；\nD项：刑侦人员注意到了侦缉对象行踪，假装没看见，符合“貌似不注意一事物而实际的心理活动却十分注意这一事物”，符合“似不注意”定义，不符合“似注意”定义，当选。\n故正确答案为D。","no":81,"missingImage":false},{"type":"question","qid":"2423324","cat":"定义判断","stem":"岩石在基本上处于固体状态下，受到温度、压力及化学活动性流体的作用，发生矿物成分、化学成分、岩石结构与构造变化的地质作用，称为变质作用。地表的风化作用和其他外生作用（沉积作用等）引起岩石的物理变化，不属于变质作用。\n根据上述定义，下列反映了变质作用的是：","options":{"A":"沙漠昼夜温差大，岩石在日间受热膨胀，晚间冷却收缩，逐渐形成砂砾","B":"煤在隔绝空气条件下加热到850℃，保持7分钟，其成分会分解成气体和液体","C":"含有盐分的溶液渗入火成岩的裂缝中，当溶液蒸发留下盐晶体，盐晶受热后膨胀令岩石瓦解","D":"宇宙中的巨大陨石高速降至地球表面，冲击岩石发生爆炸形成陨石坑，坑内岩石变化形成各种冲击岩"},"answer":"D","explanation":"第一步：找出定义关键词。\n“岩石受到温度、压力及化学活动性流体的作用”、“发生矿物成分、化学成分、岩石结构与构造变化的地质作用”、“物理变化不属于变质作用”。\n第二步：逐一分析选项。\nA项：沙漠的岩石热胀冷缩变成砂砾，是物理变化，物理变化不属于变质作用，不符合定义，排除； \nB项：把煤隔绝空气，持续加热一定温度，是人为的过程，不属于地质作用，不符合定义，排除；\nC项：火山岩被含盐溶液瓦解，是物理变化，物理变化不属于变质作用，不符合定义，排除；\nD项：宇宙中的巨大陨石高速降至地球表面冲击岩石发生爆炸形成陨石坑，符合“岩石受到温度、压力及化学活动性流体的作用”，坑内岩石变化形成各种冲击岩，符合“发生矿物成分、化学成分、岩石结构与构造变化的地质作用”，符合定义，当选。\n故正确答案为D。","no":82,"missingImage":false},{"type":"question","qid":"2423325","cat":"类比推理","stem":"舍生取义：苟且偷生","options":{"A":"爱财如命：乐于助人","B":"古为今用：今非昔比","C":"异口同声：一言九鼎","D":"祸不单行：鸿运当头"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n舍生取义指舍弃生命以取得正义，指为正义而牺牲生命；苟且偷生指得过且过，勉强活着，两者为反义关系。\n第二步：判断选项词语间逻辑关系。\nA项：爱财如命指把钱财看得跟生命一样重要，形容极端吝啬；乐于助人指很乐意主动帮助有需要的人们；两者不是反义关系，与题干逻辑关系不一致，排除；\nB项：古为今用指批判、借鉴古代的东西，继承其中优秀的文化遗产，使之为今天所用，常指文化遗产的继承；今非昔比指现在不是过去能比得上的，多指形势、自然面貌等发生了巨大的变化；两者不是反义关系，与题干逻辑关系不一致，排除；\nC项：异口同声指不同的人说同样的话，形容意见一致；一言九鼎指形容说的话分量大，起决定作用；两者不是反义关系，与题干逻辑关系不一致，排除；\nD项：祸不单行指不幸的事接二连三地发生；鸿运当头指正是走好运的时候；两者是反义关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":83,"missingImage":false},{"type":"question","qid":"2423326","cat":"类比推理","stem":"文物：出土：鉴定","options":{"A":"乌龙茶：封装：销售","B":"投影仪：切换：播放","C":"温度计：显示：测量","D":"降落伞：加速：着陆"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n出土文物与鉴定文物均是一种行为，且先出土，后鉴定，二者存在先后顺序。\n第二步：判断选项词语间逻辑关系。\nA项：封装乌龙茶与销售乌龙茶均是一种行为，且先封装，后销售，二者存在先后顺序，与题干逻辑关系一致，当选；\nB项：切换投影仪与播放投影仪搭配不当，与题干逻辑关系不一致，排除；\nC项：显示温度计与测量温度计搭配不当，与题干逻辑关系不一致，排除；\nD项：加速降落伞与着陆降落伞搭配不当，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":84,"missingImage":false},{"type":"question","qid":"2423329","cat":"类比推理","stem":"生产要素：土地：资本","options":{"A":"自然现象：彩虹：沙漠","B":"社会福利：社会保险：社会救助","C":"油料作物：花生：水稻","D":"市场调查：产品原料：客户反馈"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n土地和资本都是生产要素的一种，是种属关系，土地和资本是并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：彩虹是自然现象，沙漠是地貌，不是自然现象，与题干逻辑关系不一致，排除；\nB项：社会保险和社会救助都是社会福利的一种，是种属关系。就社会福利而言，它是可以包括社会救助和社会保险的（社会保险包含在社会福利内。社会保险保障人员最基本的生活，如养老、医疗、失业等，而社会福利内容更广泛，如养老院、孤儿院的建设、孤寡老人的补贴、大病救助、遗属福利等）；社会保险和社会救助是并列关系，与题干逻辑关系一致，当选；\nC项：花生是油料作物，水稻不是油料作物，与题干逻辑关系不一致，排除；\nD项：客户反馈是市场调查的内容，产品原料不是市场调查，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":85,"missingImage":false},{"type":"question","qid":"2423330","cat":"类比推理","stem":"上市：停牌：退市","options":{"A":"水洗：熨烫：干洗","B":"写书：出书：编纂","C":"听题：抢答：得分","D":"谱曲：演唱：伴舞"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n先上市，然后停牌，最后再退市，三者是时间先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：水洗和干洗是不同的洗涤方式，二者是并列关系，与题干逻辑关系不一致，排除；\nB项：编纂应该在出书之前，与题干逻辑关系不一致，排除；\nC项：先听题，然后抢答，最后得分，三者是时间先后顺序的对应关系，与题干逻辑关系一致，当选；\nD项：演唱和伴舞一般同时发生，二者没有明显的时间先后顺序，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":86,"missingImage":false},{"type":"question","qid":"2423331","cat":"类比推理","stem":"治本 对于（  ）相当于 忠诚 对于（  ）","options":{"A":"釜底抽薪  披肝沥胆","B":"一步到位  一如既往","C":"正本清源  呕心沥血","D":"扬汤止沸  矢志不渝"},"answer":"A","explanation":"逐一代入选项。\nA项：釜底抽薪意思是将柴火从锅底抽掉，才能使水止沸，比喻从根本上解决问题，即“治本”，二者是近义关系；披肝沥胆比喻开诚相见，竭尽忠诚，即“忠诚”，二者也是近义关系；前后逻辑关系一致，当选；\nB项：一步到位指一次就达到预定的目标，与“治本”无明显逻辑关系；一如既往指态度或做法没有任何变化，还是像从前一样，与“忠诚”无明显逻辑关系；前后逻辑关系不一致，排除；\nC项：正本清源比喻从根本上整顿，从源头上清理，即“治本”，二者是近义关系；呕心沥血形容费尽心思和精力，与“忠诚”无明显逻辑关系；前后逻辑关系不一致，排除；\nD项：扬汤止沸指把锅里开着的水舀起来再倒回去，使它凉下来不沸腾，比喻办法不对头，不能从根本上解决问题，不是“治本”，二者是反义关系；矢志不渝指立志不会改变，表示永远不变心，与 “忠诚”是近义关系；前后逻辑关系不一致，排除。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"2423332","cat":"类比推理","stem":"跳跃 对于（  ）相当于 拟人 对于（  ）","options":{"A":"静止  枯燥乏味","B":"动作  修辞手法","C":"高度  栩栩如生","D":"跳远  夸大其词"},"answer":"B","explanation":"逐一代入选项。\nA项：跳跃是动态的，与静止是反义关系，拟人与枯燥乏味没有明显逻辑关系，前后逻辑关系不一致，排除；\nB项：跳跃是一种动作，二者是种属关系，拟人是一种修辞手法，二者也是种属关系，前后逻辑关系一致，当选；\nC项：高度是描述跳跃的一个指标，栩栩如生不是描述拟人的一个指标，前后逻辑关系不一致，排除；\nD项：跳远是一种跳跃，二者是种属关系，夸大其词意思是把事情说得超过原有的程度，拟人是一种修辞手法，二者没有明显的逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":88,"missingImage":false},{"type":"question","qid":"2423333","cat":"类比推理","stem":"特种部队 对于（  ）相当于 （  ）对于 狙击步枪","options":{"A":"特种兵  霰弹枪","B":"冲锋舟  瞄准镜","C":"定位系统  侦查人员","D":"反恐部队  自动步枪"},"answer":"D","explanation":"逐一代入选项。\nA项：特种兵是特种部队的组成部分，霰弹枪是指无膛线（滑膛）并以发射霰弹为主的枪械，与狙击步枪是并列关系，前后逻辑关系不一致，排除；\nB项：冲锋舟是特种部队在执行某些特殊任务时使用的装备，瞄准镜是狙击步枪的一个组成部分，前后逻辑关系不一致，排除；\nC项：特种部队和定位系统没有明显逻辑关系，侦查人员使用狙击步枪，前后逻辑关系不一致，排除；\nD项：特种部队和反恐部队是交叉关系，自动步枪和狙击步枪也是交叉关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":89,"missingImage":false},{"type":"question","qid":"2423334","cat":"逻辑判断","stem":"内啡肽是人体大脑中含有的一种化学物质，它可与大脑中阿片受体结合，产生天然的止痛效果。研究人员发现，在人群中，那些拥有更多朋友，社交网络更广的人往往耐受疼痛的能力也更强。因此，研究人员认为社交活动会让人产生更强的耐痛力。\n要得到上述结论，需要补充的前提是：","options":{"A":"人们的疼痛感往往和疼痛阈值有关，而疼痛阈的个体差异极大","B":"当人们压力较大或者情绪低落时，机体的内啡肽系统会被打乱","C":"社交行为的数量和质量使人心情愉悦，从而让人们更愿意社交","D":"社会活动会促进大脑分泌更多的内啡肽，产生积极良好的情绪"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：社交活动会让人产生更强耐痛力。\n论据：内啡肽是人体大脑中含有的一种化学物质，它可与大脑中阿片受体结合，产生天然的止痛效果。研究人员发现，在人群中，那些拥有更多朋友，社交网络更广的人往往耐受疼痛的能力也更强。\n第二步：逐一分析选项。\nA项：该项强调是疼痛阈的个体差异大导致人们的疼痛感不同，并没有提到与社交活动之间的关系，无法加强，排除；\nB项：该项强调的是人们压力大或者情绪低落时机体的内啡肽系统会被打乱，并没有提到与社交活动之间的关系，无法加强，排除；\nC项：该项说的是社交行为的数量和质量，论点说的是社交活动会让人产生更强耐痛力，话题不一致，无法加强，排除；\nD项：该项说明社会活动会促进大脑分泌更多的内啡肽，而内啡肽与阿片受体结合，有止痛效果，因此社交活动会让人产生更强的耐痛力，搭桥，当选。\n故正确答案为D。","no":90,"missingImage":false},{"type":"question","qid":"2423315","cat":"类比推理","stem":"甲、乙、丙、丁四人驾车外出，遇到交警排查酒驾，四人因司机酒后驾车害怕受到惩罚而弃车逃跑，很快被交警擒获。当询问谁是驾驶员时，甲说：“不是我。”乙说：“是甲。”丙说：“不是我。”丁说：“是乙。”若四人中有且仅有两人说了假话，那么谁一定说了假话？","options":{"A":"甲","B":"乙","C":"丙","D":"丁"},"answer":"D","explanation":"最后一句题干说“4人中有且只有2人说假话”，说明这是一道2真2假的真假推理。\n先整理题干条件：\n甲：—甲\n乙：甲\n丙：—丙\n丁：乙\n解法1——推理法：\n甲乙矛盾，必然是1真1假。条件是2真2假，则剩下的丙丁也必然1真1假。若丁说真话，即乙是驾驶员，那么丙说的也是真话，不满足1真1假，因此丁说的一定是假话。\n故正确答案为D。\n注：得出丁说假话，丙说真话后，只能得到乙和丙都不是驾驶员，但是到底驾驶员是甲还是丁，推不出来，因此无法确定甲乙两人话的真假。\n解法2——假设法：\n假设甲是驾驶员，那么甲说了假话，乙说了真话，丙说了真话，丁说了假话——2真2假；\n若乙是驾驶员，那么甲说了真话，乙说了假话，丙说了真话，丁说了真话——3真；\n若丙是驾驶员，那么甲说了真话，乙说了假话，丙说了假话，丁说了假话——3假；\n若丁是驾驶员，那么甲说了真话，乙说了假话，丙说了真话，丁说了假话——2真2假；\n因为题干条件要求四人中有且仅有两人说了假话，所以甲、丁均有可能是驾驶员，而乙和丙不可能是驾驶员，可知丁说了假话，丙说了真话，甲乙两人不能判断谁真谁假。\n故正确答案为D。","no":91,"missingImage":false},{"type":"question","qid":"2423339","cat":"逻辑判断","stem":"在自然选择中，只有有性繁殖才能产生随机变异，环境压力（如疾病侵害）会使有益的突变（如获得抗病性）固定下来。但在无性繁殖中，后代的遗传物质不会随繁殖代数的增加发生变异。由于华蕉（香蕉的一个品种）主要通过扦插繁殖，全球范围内种植的所有华蕉均为同一植物的无性繁殖后代。因此，一旦有新型病菌开始侵染，华蕉很可能会和19世纪中期因感染病菌而绝迹的大麦克香蕉品种一样全军覆没。\n根据这段文字，可以推出：","options":{"A":"若后代的遗传物质不通过繁殖发生变异，那么这种繁殖就不是无性繁殖","B":"若环境变化不能使有益的突变固定下来，那么有性繁殖就没有产生变异","C":"只要被新型病菌感染，华蕉品种就会像大麦克香蕉的品种一样逐渐消亡","D":"如果华蕉品种采用扦插繁殖来繁殖后代，那么这种方式一定是无性繁殖"},"answer":"D","explanation":"第一步：翻译题干。\n①随机变异\u003cimg data-k=\"7b6029b3bbde\">有性繁殖\n②无性繁殖\u003cimg data-k=\"7b6029b3bbde\">不会发生变异\n③华蕉\u003cimg data-k=\"7b6029b3bbde\">无性繁殖\n第二步：逐一分析选项。\nA项：翻译为不发生变异\u003cimg data-k=\"2dfb7d1f72f3\">不是无性繁殖，是对条件②的肯后，肯后无必然结论，无法推出，排除；\nB项：翻译为环境变化不能使有益的突变固定下来\u003cimg data-k=\"7b6029b3bbde\">有性繁殖不产生变异，而根据题干第一句话，这两者不能翻译，无法推出，排除；\nC项：题干第四句话提到，一旦有新型病菌开始侵染，华蕉很可能全军覆没，而选项说的是华蕉就会全军覆没，过于绝对，无法推出，排除；\nD项：翻译为 扦插繁殖的华蕉\u003cimg data-k=\"7b6029b3bbde\">无性繁殖，根据条件③可知，所有的华蕉都是无性繁殖，而题干倒数第二句话提到，华蕉主要通过扦插繁殖，那么就可以推出 扦插繁殖的华蕉是无性繁殖的，可以推出，当选。\n故正确答案为D。","no":92,"missingImage":false},{"type":"question","qid":"2423350","cat":"逻辑判断","stem":"对许多人来说，阿尔茨海默病是一种熟悉而可怕的疾病，虽进展缓慢但无情剥夺着患者的记忆力、辨别力还有认知力，使他们无法进行日常生活。一些研究认为，这种病主要是由于大脑内部蛋白质的异常积聚导致的，这些异常积聚会在脑中形成\u003cimg data-k=\"e2edf9579f08\">淀粉样斑块和缠结，最终导致突触（大脑中的连接节点）减少，从而降低认知能力。\n以下哪项如果为真，最能\u003cb>削弱\u003c/b>上述结论？","options":{"A":"在正常人群中，大脑组织里也会有一定数量的蛋白质存在，时多时少","B":"在该病形成早期，神经突触就开始减少，这种减少引发了蛋白质的堆积","C":"动物实验显示，如果消除动物脑部已形成的淀粉样斑块，并不能让突触减少","D":"作为大脑中的神经连接，突触会被不断修剪，这是大脑正常发育的重要过程"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：阿尔茨海默病主要是由于大脑内部蛋白质的异常积聚导致的，这些异常积聚会在脑中形成\u003cimg data-k=\"e2edf9579f08\">淀粉样斑块和缠结，最终导致突触（大脑中的连接节点）减少，从而降低认知能力。\n论据：无。\n本题的论点是因果型论点，可以考虑因果倒置或他因削弱的方法来削弱。\n第二步：逐一分析选项。\nA项：讨论正常人群大脑组织中也存在一定数量的蛋白质，没有提及这些蛋白质是否异常积聚以及对认知能力的影响，与题干讨论的话题无关，无关项，排除；\nB项：该项讨论的是神经突触的减少导致了蛋白质的堆积，而论点讨论的是，蛋白质的积聚导致了突触减少，该项将论点中的原因和结果互换，因果倒置选项，可以削弱，当选；\nC项：讨论动物实验的情况，题干主体是人，主体与题干不一致，无关项，排除；\nD项：“突触会被不断修剪”不一定导致突触数量减少，且没有提及蛋白质异常积聚，不能削弱，排除。\n故正确答案为B。","no":93,"missingImage":false},{"type":"question","qid":"2423352","cat":"逻辑判断","stem":"关于青藏高原中部隆升的时间和幅度，不少研究认为高原中部在3500万年前已经达到了4500米的高度。然而近日，某研究团队在位于青藏高原中部的藏北伦坡拉盆地采集到了一些大型棕榈化石。这些化石形成于2500万年前，其中所埋藏的棕榈叶叶片宽阔，叶柄极长。研究团队由此推测：在2500万年前，青藏高原中部的海拔高度不超过2500米，并未隆升，这也将青藏高原中部的抬升历史推后了至少约1000万年。\n要得到上述研究推论，需要补充的前提是：","options":{"A":"目前，人们还没有在青藏高原中部发现3500万年前的植物化石","B":"这些化石，加上早期已发现的大量植物化石，显示出当时青藏高原的生物具有多样性","C":"棕榈科植物主要分布在热带地区，极少数在亚热带地区，如果海拔超过2500米，棕榈科植物根本不可能存活","D":"在2500万年前，青藏高原中部有一条东西向的峡谷，峡谷里生长着棕榈，而峡谷两侧则是海拔约4000米的高山"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：在2500万年前，青藏高原中部的海拔高度不超过2500米，并未隆升。\n论据：某研究团队在位于青藏高原中部的藏北伦坡拉盆地采集到了一些大型棕榈化石。这些化石形成于2500万年前，其中所埋藏的棕榈叶叶片宽阔，叶柄极长。\n本题的论点讨论的是2500万年前青藏高原中部的海拔高度不超过2500米，而论据讨论采集的大型棕榈化石情况，论点和论据话题不一致，且提问方式为“需要补充的前提”，优先考虑搭桥。\n第二步：逐一分析选项。\nA项：该项说的是没有在青藏高原中部发现3500万年前的植物化石，而论点说的是2500万年前的青藏高原中部的海拔高度，二者讨论的话题不一致，无关项，不能加强，排除；\nB项：说明当时青藏高原的生物具有多样性，与题干讨论的2500万年前青藏高原的海拔高度无关，因此该项属于无关项，不能加强，排除；\nC项：说明棕榈科植物只能在海拔2500米以下的地区存活，那么在2500万年前青藏高原中部的海拔高度必须不超过2500米，才能形成棕榈化石，因此该项是搭桥项，当选；\nD项：2500万年前青藏高原中部峡谷两岸的海拔高度与青藏高原中部的海拔高度无关，该项属于无关项，不能加强，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"2423353","cat":"逻辑判断","stem":"一项研究发现，常食用人类食物的熊冬眠时间会明显缩短，最多时可达50天，这些熊与保持天然饮食习惯的熊相比，染色体端粒显著减少。因此有人推测：经常食用人类食物，熊的寿命会随之缩短。\n要得到上述结论，需要补充的重要前提是：","options":{"A":"一般来说，癌细胞内的染色体端粒的长度可以长时间保持不变","B":"当动物机体的细胞端粒数量显著减少后，染色体也会变得不稳定","C":"端粒减少后，动物机体内细胞老化、受损的速度更快，衰老进程加剧","D":"冬眠时间缩短后，熊类在冬季变得更为活跃，但其繁衍能力却日趋下降"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：经常食用人类食物，熊的寿命会随之缩短。\n论据：常食用人类食物的熊冬眠时间会明显缩短，最多时可达50天，这些熊与保持天然饮食习惯的熊相比，染色体端粒显著减少。\n本题的论点说的是经常食用人类食物，熊的寿命会随之缩短，而论据说的是熊冬眠时间减少和染色体端粒减少，二者话题不一致，且提问方式为“需要补充的前提”，优先考虑搭桥。\n第二步：逐一分析选项。\nA项：讨论的是癌细胞内的染色体端粒的长度，题干说的是染色体端粒的数量，与题干讨论的话题不一致，因此属于无关项，排除；\nB项：讨论的是细胞端粒数量，题干说的是染色体端粒的数量，与题干讨论的话题不一致，因此属于无关项，排除；\nC项：说明端粒减少会加速熊的衰老进程，因此熊的寿命会缩短，在端粒减少与缩短寿命之间建立联系，因此该项属于搭桥项，当选；\nD项：说的是冬眠时间减少对其繁衍能力的影响，未提及对寿命的影响，因此该项属于无关项，排除。\n故正确答案为C。","no":95,"missingImage":false},{"type":"question","qid":"2423355","cat":"逻辑判断","stem":"海冰是海水冻结而成的咸水冰，在南极、北极都有大量分布。随着全球变暖，北极海冰急剧减少，而南极海冰不仅没有减少，还缓慢增加。研究表明，当南极海冰在生长季早期形成并积累起来时，它们会在风力作用下，往北漂远离海岸，形成了一个由较老较厚的冰构成的环南极洲的冰带，而北极并没有这样的情况。研究人员由此推测，正是这一冰带的出现让海冰的数量不断增加。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"冰带中的海冰形成时间较早，冰雪的日积月累会导致其厚度逐渐增加","B":"受南极大陆的地形影响，冰带会不断向大陆方向移动，使得海冰分散漂流","C":"一般过高的盐度会抑制海水成冰，而近年来南极冰架开始融水，但海水盐度并没有降低","D":"冰带将新形成的薄冰封在后部的流冰群中，防止其受到风浪侵蚀，有助于海冰生长"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：环南极洲冰带的出现让海冰的数量不断增加。\n论据：当南极海冰在生长季早期形成并积累起来时，它们会在风力作用下，往北漂远离海岸，形成了一个由较老较厚的冰构成的环南极洲的冰带，而北极并没有这样的情况。\n本题根据南极洲形成冰带，而北极没有冰带形成推测冰带的出现让海冰的数量不断增加，论点、论据均讨论冰带与海冰的数量情况，二者话题一致，考虑补充论据。\n第二步：逐一分析选项。\nA项：指出冰雪导致海冰厚度增加，仅说明冰带自身厚度变化，未提及海冰的数量是否增加，无关项，无法加强，排除；\nB项：海冰分散漂流不涉及海冰的数量，未提及海冰的数量，无关项，无法加强，排除；\nC项：指出南极海水盐度未降低，未提及海冰的数量，无关项，无法加强，排除；\nD项：说明冰带的形成有助于海冰生长，解释了冰带的出现让海冰数量增加的原因，补充论据，当选。\n故正确答案为D。","no":96,"missingImage":false},{"type":"question","qid":"2423356","cat":"逻辑判断","stem":"不要超出城市周边自然环境的承受能力是一座城市适宜向周边更大范围扩张的必要条件。不幸的是，有些城市的扩张超出了它周边自然环境的承受能力。\n由此可以推出：","options":{"A":"这些城市适宜于向周边更大的范围扩张","B":"这些城市向周边更大范围的扩张是充分的","C":"这些城市不适宜于向周边更大的范围扩张","D":"这些城市向周边更大范围的扩张是不充分的"},"answer":"C","explanation":"第一步：翻译题干。\n（1）一座城市适宜向周边更大范围扩张\u003cimg data-k=\"7b6029b3bbde\">不要超出城市周边自然环境的承受能力；\n（2）有些城市的扩张超出了它周边自然环境的承受能力。\n（2）为事实信息，即这些城市的扩张超出了它周边自然环境的承受能力，是对条件（1）的否后，可以推出否前，即这些城市不适宜向周边更大范围扩张，C项当选。\n第二步：逐一分析选项。\nA项：与C项意思相反，无法推出，排除；\nB、D项：这些城市向周边更大范围扩张是否充分，与题干逻辑关系无关，无法推出，排除。\n故正确答案为C。","no":97,"missingImage":false},{"type":"question","qid":"2423357","cat":"逻辑判断","stem":"关于味觉感受的某研究表明：在亚洲，迟钝味觉者在印度人中占\u003cimg data-k=\"2705a7c2a3ff\">，而在日本人中则占\u003cimg data-k=\"7b63c376ca57\">。印度人喜欢辣椒，其实源于对味觉感知的不足，这也因此解释了印度菜和日本料理的巨大差别。研究者认为：这种不同人群对味道的偏好其实早已写在了人们的遗传密码之中。\n要得到上述结论，需要补充的前提是：","options":{"A":"由于注重健康的生活方式，日本人大多坚持清淡饮食，很少吃辣，代代如此","B":"在印度，许多人虽然对辣椒不敏感，但对其他食物的味道非常敏感","C":"迟钝味觉者携带了两个隐性遗传等位基因，而敏感味觉者通常同时表达两个显性遗传等位基因","D":"敏感味觉者的舌头上分布着高密度的菌状乳头，而迟钝味觉者舌乳头的分布密度则要低很多"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：这种不同人群对味道的偏好其实早已写在了人们的遗传密码之中。\n论据：在亚洲，迟钝味觉者在印度人中占\u003cimg data-k=\"2705a7c2a3ff\">，而在日本人中则占\u003cimg data-k=\"7b63c376ca57\">。印度人喜欢辣椒，其实源于对味觉感知的不足，这也因此解释了印度菜和日本料理的巨大差别。\n本题的提问方式为“前提”，加强优先考虑搭桥和必要条件。论点讨论的是味道偏好与遗传密码之间的关系，而论据讨论的是不同人种的味觉感受不同，二者话题不一致，优先考虑搭桥，即在味觉与遗传密码之间建立联系。\n第二步：逐一分析选项。\nA项：讨论日本人饮食习惯，与味道偏好与遗传密码之间的关系无关，话题不一致，无法加强，排除；\nB项：讨论印度对其他食物味道敏感，与味道偏好与遗传密码之间的关系无关，话题不一致，无法加强，排除；\nC项：指出迟钝味觉者与敏感味觉者所携带基因不同，说明味觉与遗传密码存在联系，建立了论点论据之间的联系，搭桥，当选；\nD项：讨论的是味觉不同的人舌头上的菌状乳头分布是不同的，无法判断是否与基因有关，无法加强，排除。\n故正确答案为C。","no":98,"missingImage":false},{"type":"question","qid":"2423359","cat":"逻辑判断","stem":"与今天的大熊猫不同，大熊猫祖先的饮食非常多元，那么大熊猫是从什么时候开始以食用竹子为主的呢？早期研究认为这一食性转变大约发生在5000年前，但最新研究中，人们通过测定大熊猫骨骼和牙齿中稳定的同位素揭示了它们晚年和牙釉质形成早期的饮食状况，得出新结论：大熊猫的食性变化发生在较近的几百年，而不是之前所称的几千年。\n以下哪项为真，最能质疑上述新结论？","options":{"A":"大熊猫的食性特征和栖息地分布远比研究人员预想的更为复杂和多样化","B":"研究者选取的古代大熊猫样本很大比例上来自生活在距今二三百年的熊猫标本","C":"即使是现存的大熊猫，野生的和人工圈养的大熊猫在骨骼等机体组织的同位素分析中也存在一些差别","D":"大熊猫进食肉类或植物后，食物的化学标记（即同位素）会留在机体内，如果取样全面就可推测出它们的食物类型"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：大熊猫的食性变化发生在较近的几百年，而不是之前所称的几千年。\n论据：人们通过测定大熊猫骨骼和牙齿中稳定的同位素揭示了它们晚年和牙釉质形成早期的饮食状况。\n本题论点讨论的是大熊猫的食性变化在近几百年，论据是通过测定大熊猫骨骼和牙齿同位素来反应早期的饮食状况，二者话题不一致，削弱优先考虑拆桥，即测定大熊猫骨骼和牙齿同位素无法推出大熊猫的食性是近几百年发生变化的。\n第二步：逐一分析选项。\nA项：大熊猫的食性特征和栖息地分布比预想得复杂和多样，与大熊猫食性变化的时间无关，话题不一致，无法削弱，排除；\nB项：研究者选取的熊猫样本大多来自二三百年前，无法代表古代大熊猫，说明样本选择得不科学，根据此研究无法推出论点，拆桥项，当选；\nC项：讨论的是野生的和人工圈养的大熊猫同位素分析中存在一些差别，只能说明这两种大熊猫的食性不同或进食种类可能有所不同，但与早期的大熊猫食性发生变化的时间无关，无法削弱，排除；\nD项：指出如果取样全面根据同位素可推测出大熊猫食物类型，说明根据同位素确定推测出大熊猫食性变化的时间，具有加强作用，排除。\n故正确答案为B。","no":99,"missingImage":false},{"type":"question","qid":"2423360","cat":"逻辑判断","stem":"对于植物而言，固氮作用是不可或缺的自然过程，即植物将空气中的氮元素转化成其可用的形式并固定在根部。一直以来，人们认为只有配备了根瘤这种独特装备的豆科植物（如大豆、三叶草、苜蓿和羽扇豆）才能从细菌—植物共生关系中获益。然而新研究发现，固氮作用同样可以发生在树的其他部位，这一过程并不需要根瘤的参与。\n以下哪项如果为真，最能支持上述发现？","options":{"A":"一些松树的树根部位没有根瘤，但却有真菌生长，可以与松树互换营养","B":"一些没有根瘤的植物与豆科植物间隔种植时，也能发生固氮作用，增加产量","C":"某些在氮元素稀少的环境中生长的柳树，如果施用氮肥，也能获取生长所需的氮","D":"杨树枝条富含微生物，枝条可与其所含的固氮菌相互作用来获取生长所需的氮"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：固氮作用同样可以发生在树的其他部位，这一过程并不需要根瘤的参与。\n论据：无。\n本题只有论点，没有论据，加强只能考虑补充论据，即解释原因或者举例子。\n第二步：逐一分析选项。\nA项：指出真菌与一些没有根瘤的松树互换营养，互换营养不代表发生了固氮作用，且无法判断互换营养发生的部位，属于不明确选项，无法加强，排除；\nB项：指出没有根瘤的植物与豆科植物间隔种植时会发生固氮作用，无法判断没有这些间隔种植的豆科植物是否还会发生固氮作用，也无法确定固氮作用是发生在植物根部还是其他部位，无法加强，排除；\nC项：说的是利用氮肥获取营养，与植物是否有固氮作用无关，话题不一致，无法加强，排除；\nD项：指出杨树枝条可与其所含的固氮菌相互作用获取空气中的氮，举例子说明树的其他部位可以发生固氮作用，且枝条上没有根瘤参与，补充论据，加强论点，当选。\n故正确答案为D。","no":100,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2018年全国网络零售额90100亿元，同比增长\u003cimg data-k=\"8ad027887894\">。其中，实物商品网上零售额为70200亿元，同比增长\u003cimg data-k=\"1d6d10703b44\">；非实物商品网上零售额19900亿元，同比增长\u003cimg data-k=\"b8748e5ebf4f\">。\u003c/p>\u003cp>        2018年全国农村网络零售额为13700亿元。其中，农村实物商品网络零售额为10900亿元，同比增长\u003cimg data-k=\"0622c0b9df42\">；农村非实物商品网络零售额2800亿元，同比增长\u003cimg data-k=\"3fb317b2f5f7\">。分品类看，农村实物商品零售额前三位的品类分别为服装鞋帽针织品、日用品、粮油食品及饮料烟酒，分别占农村实物商品零售额的\u003cimg data-k=\"34f8fda710c9\">、\u003cimg data-k=\"31e97f397d68\">和\u003cimg data-k=\"acdf8b35772d\">，同比增速分别为\u003cimg data-k=\"a1f51a060389\">、\u003cimg data-k=\"0accf9ba2c67\">和\u003cimg data-k=\"fa0de4871c60\">。\u003c/p>\u003cp>        2018年全国农产品网络零售额达2305亿元，比全国网络零售额同比增速高9.9个百分点。其中，休闲食品、茶叶、滋补食品零售额排名前三，占比分别为\u003cimg data-k=\"236ac81604f7\">、\u003cimg data-k=\"3ecbcd01978f\">和\u003cimg data-k=\"fa702c5a4d02\">，同比增速分别为\u003cimg data-k=\"e464c849c460\">、\u003cimg data-k=\"f9dc6e20a0f1\">和\u003cimg data-k=\"91b7673cdc27\">。\u003c/p>","questions":[{"qid":"2423305","cat":"比重","stem":"2018年全国网络零售额中，实物商品网上零售额的比重约为：","options":{"A":"\u003cimg data-k=\"77c9df82ee00\">","B":"\u003cimg data-k=\"71ed06f6177f\">","C":"\u003cimg data-k=\"09e1da8ea90a\">","D":"\u003cimg data-k=\"bf884c18e228\">"},"answer":"C","explanation":"根据问题“2018年······比重约为”，结合材料时间为2018年，判定本题为现期比重问题。定位材料第一段“2018年全国网络零售额90100亿元，······，其中，实物商品网上零售额为70200亿元”。故所求占比\u003cimg data-k=\"1e3454085bab\">\u003cimg data-k=\"1fa712b21de0\">，对应C选项。\n故正确答案为C。","no":101,"missingImage":false},{"qid":"24233 estion","qid":"2668473","cat":"经济常识","stem":"以下是改革开放以来，我国历届党和国家领导人的重要论断，对其按时间先后排序，排列正确的一项是：\n①改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标，实现中华民族伟大复兴的关键一招。\n②经济全球化是世界经济发展的客观趋势，对我国的发展有利也有弊。不能看到有风险，有不利因素，就因噎废食，不敢参与进去，同时又要对风险保持清醒认识，坚持独立自主，加强防范工作，增强抵御和化解能力。\n③判断姓“社”还是姓“资”的标准，应该主要看是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平。\n④落实好人才强国战略，必须树立适应新形势新任务要求的科学人才观，使我国由人口大国转化为人才资源强国。","options":{"A":"③①②④","B":"③②①④","C":"③②④①","D":"③④②①"},"answer":"C","explanation":"本题考查政治。\n①：2018年12月18日，习近平总书记在庆祝改革开放40周年大会上的讲话中指出：“40年的实践充分证明，改革开放是党和人民大踏步赶上时代的重要法宝，是坚持和发展中国特色社会主义的必由之路，是决定当代中国命运的关键一招，也是决定实现‘两个一百年’奋斗目标、实现中华民族伟大复兴的关键一招。”\n②：1998年8月28日，江泽民同志在第九次驻外使节会议上的讲话指出：“经济全球化是世界经济发展的客观趋势，对我国的发展有利也有弊。不能看到有风险、有不利因素，就因噎废食，不敢参与进去，同时又要对风险保持清醒认识，坚持独立自主，加强防范工作，增强抵御和化解能力。”\n③：1992年1月18日―2月21日，邓小平同志在南巡中发表重要讲话，讲话指出：“（是姓‘资’还是姓‘社’）判断的标准，应主要看是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平。”\n④：2003年12月19日至20日，胡锦涛同志在全国人才工作会议上的讲话指出：“做好人才工作，落实好人才强国战略，必须以马克思主义为指导，从当代世界和中国深刻变化着的实际出发，根据党和国家事业发展的迫切需要，解放思想、实事求是、与时俱进，树立适应新形势新任务要求的科学人才观。”\n综上所述，按时间先后排序顺序为③②④①。\n故正确答案为C。","no":1,"missingImage":false},{"type":"question","qid":"2668475","cat":"经济常识","stem":"下列经济常识不正确的是：","options":{"A":"物价水平的持续下降意味着实际利率的上升","B":"通过公开市场业务出售政府证券属于紧缩性货币政策","C":"当通货膨胀严重时提高存款准备金率","D":"经济衰退时期，应提高税率以扩大内需"},"answer":"D","explanation":"本题考查经济常识。\nA项正确，物价水平的持续下降意味着实际利率的上升，投资成本变得昂贵，投资项目的吸引力下降，投资减少必然导致经济增长的下降，可能形成经济衰退。\nB项正确，紧缩性的货币政策是通过货币供应的增长率来降低总需求水平，在这种政策下，取得信贷较为困难，利息率也随之提高。公开市场业务是货币政策工具之一，是指中央银行通过买进或卖出有价证券，吞吐基础货币，调节货币供应量的活动。题干中，通过公开市场业务出售政府证券，吸收市场中的货币，从而降低市场中的货币供应量，属于紧缩性货币政策。常见的紧缩性货币政策还有提高存款准备金率、提高再贴现率等。\nC项正确，通货膨胀是指在货币流通条件下，因货币实际需求小于货币供给，也即现实购买力大于产出供给,导致货币贬值，而引起的一段时间内物价持续而普遍地上涨现象。其实质是社会总供给小于社会总需求（供远小于求）。提高存款准备金率，商业银行需要上缴中央银行的法定存款准备金增加，商业银行的可用资金减少，在其他情况不变的条件下，商业银行贷款或投资下降，导致货币供应量减少，有助于缓解通货膨胀。\nD项错误，在经济衰退时期，通过降低税率、增加公共投资、完善社会保障等方法能够有效刺激消费、扩大内需。\n本题为选非题，故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"2668477","cat":"法律常识","stem":"十三届全国人民代表大会第一次会议通过了宪法修正案，完成了宪法修改的重大历史任务，实现了我国宪法的又一次与时俱进。下列哪一项不属于我国第五次宪法修改的内容？","options":{"A":"将“健全社会主义法制”修改为“健全社会主义法治”","B":"将“全国人民代表大会设立法律委员会”修改为“全国人民代表大会设立宪法和法律委员会”","C":"增加“国家倡导社会主义核心价值观”","D":"增加“国家尊重和保护人权”"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，2018年《宪法修正案（五）》第三十二条规定：“······‘健全社会主义法制’修改为‘健全社会主义法治’；······”\nB项正确，2018年《宪法修正案（五）》第四十四条规定：“······宪法第七十条第一款中‘全国人民代表大会设立民族委员会、法律委员会、财政经济委员会、教育科学文化卫生委员会、外事委员会、华侨委员会和其他需要设立的专门委员会。’修改为：‘全国人民代表大会设立民族委员会、宪法和法律委员会、财政经济委员会、教育科学文化卫生委员会、外事委员会、华侨委员会和其他需要设立的专门委员会。’”\nC项正确，2018年《宪法修正案（五）》第三十九条规定：“宪法第二十四条第二款中‘国家提倡爱祖国、爱人民、爱劳动、爱科学、爱社会主义的公德’修改为‘国家倡导社会主义核心价值观，提倡爱祖国、爱人民、爱劳动、爱科学、爱社会主义的公德’。这一款相应修改为：‘国家倡导社会主义核心价值观，提倡爱祖国、爱人民、爱劳动、爱科学、爱社会主义的公德，在人民中进行爱国主义、集体主义和国际主义、共产主义的教育，进行辩证唯物主义和历史唯物主义的教育，反对资本主义的、封建主义的和其他的腐朽思想。’”\nD项错误，2004年《宪法修正案（四）》第二十四条规定：“宪法第三十三条增加一款，作为第三款：‘国家尊重和保障人权。’第三款相应地改为第四款。”\n本题为选非题，故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"2668480","cat":"人文常识","stem":"在中国古代，一支从长安出发的和平使团，开始打通东方通往西方的道路，完成了“凿空之旅”，这就是著名的：","options":{"A":"张骞出使西域","B":"王昭君出塞和亲","C":"郑和七下西洋","D":"唐玄奘西天取经"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，张骞出使西域，指的是汉武帝时期希望联合月氏夹击匈奴，派遣张骞出使西域各国的历史事件。张骞出使西域本为贯彻汉武帝联合大月氏抗击匈奴之战略意图，但出使西域后汉夷文化交往频繁，中原文明通过“丝绸之路”迅速向四周传播。张骞对开辟从中国通往西域的丝绸之路有卓越贡献，被称为“凿空之旅”，至今举世称道。\nB项错误，公元前33年，匈奴单于呼韩邪稽侯珊第三次来到汉朝的京师长安城，觐见汉元帝刘奭，表示归附中央王朝的诚意和对汉元帝的尊敬，并且请求“婿汉氏以自亲”。元帝应允，后宫宫女王昭君挺身而出“请掖庭令求行”，担当“和蕃使者”的角色。这就是中国历史上著名的“昭君出塞和亲”。昭君到匈奴后，被封为“宁胡阏氏”（意思是王后），象征她将给匈奴带来和平、安宁和兴旺。\nC项错误，郑和下西洋是明代永乐、宣德年间的一场海上远航活动，首次航行始于永乐三年（1405年），末次航行结束于宣德八年（1433年），共计七次。郑和下西洋是中国古代规模最大、船只和海员最多、时间最久的海上航行，也是15世纪末欧洲的地理大发现的航行以前世界历史上规模最大的一系列海上探险。\nD项错误，玄奘，唐代著名高僧，法相宗创始人，是我国历史上伟大的思想家、哲学家、外交家、中外文化交流的使者。玄奘西行5万里，历时17年，到印度取真经，并穷一生译经，其足迹遍布印度，影响远至日本、韩国以至全世界，其思想与精神如今已是中国、亚洲乃至世界人民的共同财富。\n故正确答案为A。","no":4,"missingImage":false},{"type":"question","qid":"2668481","cat":"人文常识","stem":"去年8月，挪威和芬兰的北极圈内区域多次记录到了超过\u003cimg data-k=\"d5bd0bee2a7f\">的高温，比往年均温高出\u003cimg data-k=\"3373017e8506\">，然而北极熊并没有受到热潮的威胁。其原因有可能是：","options":{"A":"北极熊分布很广，不局限于挪威和芬兰的北极圈内区域","B":"斯堪的纳维亚北部区域属于北极圈中较暖的地方，北极圈中心区域依然比较凉爽","C":"春天到初夏才是北极熊捕食的主要时期","D":"热浪对于海冰覆盖率的影响是需要时间累积的"},"answer":"B","explanation":"本题考查地理国情。\n作为地理区划，北极圈占据了23.5个纬度，它的边缘地区在夏天其实并不是很冷，7月均温通常在10摄氏度左右；斯堪的纳维亚北部区域属于北极圈中较暖的地方，如挪威北部的巴纳克位于北纬70度，夏季最高温通常在17摄氏度左右。2018年的热浪打破了多地的夏季气温记录，虽然北极圈局部地区面临异常高温，但此刻北极圈的中心地区还比较凉爽，因而北极熊并没有受到热潮的威胁。\n故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"2668482","cat":"人文常识","stem":"2016年，启动5G技术研究试验；2018年，多地开展5G试点；2020年，5G全面投入商用······中国5G正按照规划时间表有序发展，并走在世界前列。5G主要有三类典型业务场景，其中不包括：","options":{"A":"超密集组网","B":"增强型移动宽带","C":"海量机器类通信","D":"高可靠低时延通信"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，未来5G应用有三大场景，包括增强型移动宽带、海量机器类通信、高可靠低时延通信。超密集组网是5G的关键技术，不属于应用场景。\nB项正确，增强型移动宽带，是指5G的峰值速率将达到4G网络的10倍以上。增强型移动宽带是为了发挥5G传输速率快与网络连接容量大的优势、满足人们对多媒体产品与服务等的接入需求与消费。\nC项正确，海量机器类通信，是指5G将实现从消费到生产的全环节、从人到物的全场景覆盖，即“万物互联”。\nD项正确，高可靠低时延通信，是指5G的通信响应速度将降至毫秒级，如自动驾驶汽车探测到障碍后的响应速度将比人的反应更快，将助推自动驾驶汽车从实验室开到路上。\n本题为选非题，故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"2668486","cat":"人文常识","stem":"入夏以来，强对流天气造成严重灾害的事件时有发生。以下不属于强对流天气的是：","options":{"A":"雷雨大风","B":"冰雹","C":"台风","D":"短时强降水"},"answer":"C","explanation":"本题考查地理国情。\n强对流天气是指出现短时强降水、雷雨大风、龙卷风、冰雹和飑线等现象的灾害性天气，它发生在对流云系或单体对流云块中，在气象上属于中小尺度天气系统。\nA项正确，雷雨大风，指在出现雷、雨天气现象时，平均风力大于等于6级、阵风大于等于8级的天气现象。当雷雨大风发生时，乌云滚滚，电闪雷鸣，狂风夹伴强降水，有时伴有冰雹，风速极大。它涉及的范围一般只有几公里至几十公里。\nB项正确，冰雹也叫“雹”，是一种天气现象，夏季或春夏之交最为常见。冰雹是一些小如绿豆、黄豆，大似栗子、鸡蛋的冰粒。\nC项错误，台风，属于热带气旋的一种。热带气旋是发生在热带或副热带洋面上的低压涡旋，是一种强大而深厚的“热带天气系统”。我国把南海与西北太平洋的热带气旋按其底层中心附近最大平均风力（风速）大小划分为6个等级，其中风力达12级或以上的，统称为台风。\nD项正确，短时强降雨，指的是1小时内某地降雨量超过20毫米，短时强降雨是一种强对流天气。\n本题为选非题，故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"2668487","cat":"人文常识","stem":"中国传统节日形式多样，内容丰富，蕴涵着深邃丰厚的文化内涵，是中华民族悠久历史文化的重要组成部分。下列古诗词描写的传统节日中，对应有误的一项是：","options":{"A":"春节——爆竹声中一岁除，春风送暖入屠苏","B":"上元节——众里寻他千百度，蓦然回首，那人却在，灯火阑珊处","C":"中秋节——暮云收尽溢清寒，银汉无声转玉盘","D":"下元节——尘世难逢开口笑，菊花须插满头归"},"answer":"D","explanation":"本题考查人文常识。\nA项正确，“爆竹声中一岁除，春风送暖入屠苏”出自宋代王安石的《元日》，意思是阵阵轰鸣的爆竹声中，旧的一年已经过去；和暖的春风吹来了新年，人们欢乐地畅饮着新酿的屠苏酒。此诗描写的是春节除旧迎新的景象。\nB项正确，“众里寻他千百度，蓦然回首，那人却在，灯火阑珊处”出自南宋辛弃疾的《青玉案·元夕》，意思是对着众多走过的女人一一辨认，偶一回头，却发现自己的心上人站立在昏黑的幽暗之处。此词描绘出元宵佳节通宵灯火的热闹场景。元宵节，又称上元节、小正月、元夕或灯节，是中国的传统节日之一，时间为每年农历正月十五。\nC项正确，“暮云收尽溢清寒，银汉无声转玉盘”出自宋代苏轼的《阳关曲·中秋月》，意思是夜幕降临，云气收尽，天地间充满了寒气；银河流泻无声，皎洁的月儿转到了天空，就像玉盘那样洁白晶莹。月到中秋分外明，是中秋月的特点，两句并没有写赏月的人，但全是赏心悦目之意，而人自在其中。\nD项错误，“尘世难逢开口笑，菊花须插满头归”出自唐代杜牧的《九日齐山登高》，意思是尘世烦扰平生难逢让人开口一笑的事，满山盛开的菊花我定要插满头才归。九日指旧历九月九日，为重阳节。下元节，又称“下元日”、“下元”，是中国民间传统节日之一，为农历十月十五。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"2668490","cat":"人文常识","stem":"我们通常认为，声音传播的速度为340米/秒，其实这是在气温\u003cimg data-k=\"934e92007e49\">且干燥的空气中的声速。空气的温度、湿度以及传播的介质都会影响声速。下列有关声速的判断中，错误的一项是：","options":{"A":"声速在\u003cimg data-k=\"934e92007e49\">的干燥空气中比在\u003cimg data-k=\"d2daacc1686b\">的干燥空气中传播得快","B":"声速在\u003cimg data-k=\"d2daacc1686b\">的干燥空气中比在\u003cimg data-k=\"d2daacc1686b\">的氦气中传播得快","C":"声速在水中比在水蒸气中传播得快","D":"声速在冰中比在水中传播得快"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，声音在空气中的传播速度与温度有关，气温越高，声音的传播速度越快。\u003cimg data-k=\"d2daacc1686b\">时海平面声音在空气中的传播速度约为331.5米/秒，\u003cimg data-k=\"3373017e8506\">时为340米/秒。温度每升高\u003cimg data-k=\"1ff57d90215a\">，声速约增加0.6米/秒。\nB项错误，构成气体的原子和分子组成发生变化时，声速也会随之改变。比如在\u003cimg data-k=\"d2daacc1686b\">的氦气中，声速为970米/秒，接近干燥空气中的3倍。\nC、D两项正确，物质的状态不同，声速会有很大的区别，如水蒸气中声速为473米/秒，水中声速为1500米/秒，冰中声速为3230米/秒。一般来说，在固体中声速最快、液体次之、气体最慢。\n本题为选非题，故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"2668491","cat":"人文常识","stem":"草书、行书、楷书、隶书四种字体中哪一种是其余三种的起源？","options":{"A":"草书","B":"行书","C":"楷书","D":"隶书"},"answer":"D","explanation":"本题考查人文常识。\n草书、行书、楷书、隶书四种字体中，“隶书”是其余三种的起源。一般认为隶书由篆书发展而来，时间上早于行书、草书和楷书。\nA项错误，草书，作为一种特定的字体，形成于汉代，是为了书写简便，在隶书基础上演变出来的。草书代表人物是唐朝的张旭和怀素，合称“颠张狂素”。\nB项错误，行书，是一种书法统称，分为行楷和行草两种。它在楷书的基础上发展起源，是介于楷书、草书之间的一种字体，是为了弥补楷书的书写速度太慢和草书的难于辨认而产生的。行书代表人物是东晋书法家王羲之，他的《兰亭序》被誉为“天下第一行书”。\nC项错误，楷书，由隶书逐渐演变而来，更趋简化，横平竖直。《辞海》中解释说它“形体方正，笔画平直，可作楷模”。这种汉字字体端正，就是现代通行的汉字手写正体字。著名的“楷书四大家”为：唐朝的欧阳询、唐颜真卿、柳公权和元朝的赵孟頫。\nD项正确，隶书，一般认为由篆书发展而来，字形多呈宽扁，横画长而竖画短，讲究“蚕头燕尾”、“一波三折”。唐代隶书历来有韩择木、蔡有邻、李潮、史惟则四家平分秋色。\n故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"2668492","cat":"人文常识","stem":"2018年12月13日，维珍银河公司一架载有两名宇航员的飞船到达了距离地面82.7千米高的天空，相当于已到达地球大气层的哪一层？","options":{"A":"对流层","B":"平流层","C":"中间层","D":"外层"},"answer":"C","explanation":"本题考查地理国情。\nA项错误，对流层，是指最接近地球表面的一层大气，也是大气的最下层，密度最大，所包含的空气质量几乎占整个大气质量的\u003cimg data-k=\"6f4ae0e851d1\">，以及几乎所有的水蒸气及气溶胶。其下界与地面相接，上界高度随地理纬度和季节而变化，它的高度因纬度而不同，在低纬度地区平均高度为17～18公里，在中纬度地区平均为10～12公里，极地平均为8～9公里，并且夏季高于冬季。\nB项错误，平流层，亦称同温层，是地球大气层里上热下冷的一层，此层被分成不同的温度层，当中高温层置于顶部，而低温层置于低部。它与位于其下贴近地表的对流层刚好相反，对流层是上冷下热。在中纬度地区，平流层位于离地表10公里至50公里的高度，而在极地，此层则始于离地表8公里左右。\nC项正确，中间层，又称中层，是指自平流层顶到85千米之间的大气层。该层内因臭氧含量低，同时，能被氮、氧等直接吸收的太阳短波辐射已经大部分被上层大气所吸收，所以温度垂直递减率很大，对流运动强盛。\nD项错误，散逸层，又称“外层”、“逃逸层”，是热层（暖层）以上的大气层，也是地球大气的最外层。这层空气在太阳紫外线和宇宙射线的作用下，大部分分子发生电离，使质子和氦核的含量大大超过中性氢原子的含量。逃逸层空气极为稀薄，其密度几乎与太空密度相同，故又常称为外大气层。散逸层的下界距离地表800千米以上，而顶界约为2000~3000千米的高度。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"2668493","cat":"科技常识","stem":"化学与人类生活密切相关，下列说法正确的是：","options":{"A":"苯酚有一定毒性，不能做消毒剂和防腐剂","B":"白磷着火点高且无毒，可用于制造安全火柴","C":"油脂发生皂化反应生成的高级脂肪酸钠是肥皂的有效成分","D":"用食醋去除水壶中的水垢时所发生的反应是水解反应"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，苯酚是一种有机化合物，是具有特殊气味的无色针状晶体，有毒，是生产某些树脂、杀菌剂、防腐剂以及药物（如阿司匹林）的重要原料。也可用于消毒外科器械和排泄物的处理，皮肤杀菌、止痒及中耳炎。\nB项错误，白磷的着火点是\u003cimg data-k=\"b39ed34f2e79\">，白磷易自燃且有毒，所以不能用于制造安全火柴，用于制造安全火柴的是红磷。\nC项正确，油脂在碱溶液的作用下发生水解，叫皂化反应。皂化反应生成硬脂酸钠，硬脂酸钠用于制造肥皂，即肥皂的主要成分是硬脂酸钠。\nD项错误，水垢的主要成分是碳酸钙、氢氧化镁，用食醋去除水壶中的水垢时所发生的反应是复分解反应。复分解反应是由两种化合物互相交换成分，生成另外两种化合物的反应，其实质是发生复分解反应的两种化合物在水溶液中交换离子，结合成难电离的沉淀、气体或弱电解质（最常见的为水），使溶液中离子浓度降低，化学反应向着离子浓度降低的方向进行的反应。\n故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"2668496","cat":"人文常识","stem":"2018年11月，第26届国际计量大会正式更新，包括国际标准质量单位“千克”在内的4项基本单位定义，至此，国际计量单位制的7个基本单位全部实现由常数定义。国际单位制和市制都是我国的基本计量制度，下列计量单位与我国市制计量单位的换算正确的一项是：","options":{"A":"\u003cimg data-k=\"fef4baa697df\">","B":"\u003cimg data-k=\"335a6aeca40f\">","C":"\u003cimg data-k=\"44be6203da60\">","D":"\u003cimg data-k=\"03bd1c659975\">"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，钱是最小的重量单位，在中药方、黄金、食谱中仍沿用这一计量单位。\u003cimg data-k=\"349d126f02d8\">。\nB项错误，最早用大指与中指的跨度为一尺，一尺相当于八寸，但不利于计算。后改成一尺为十寸并规制沿用而成为市尺。\u003cimg data-k=\"4a8d241dc341\">。\nC项正确，公顷为面积的公制单位（国际单位）。一块面积一公顷的土地为10000平方米。\u003cimg data-k=\"44be6203da60\">。\nD项错误，斗的本义是一种盛酒的器具，又用作计量粮食的工具，后来才引申为单位。\u003cimg data-k=\"b7c35d0176d4\">。\n故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"2668497","cat":"人文常识","stem":"下列有关饮食的常识，说法正确的一项是：","options":{"A":"粗粮富含膳食纤维，脂肪很少，吃粗粮有助于降低血糖","B":"反式脂肪在炸鸡、爆米花、饼干、蛋糕等食品中比较常见","C":"人体内的胆固醇主要经膳食摄入","D":"食品一旦过期，便会对人体健康造成危害，因此不能食用"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，粗粮是相对精米白面等细粮而言的，主要包括谷类中的玉米、紫米、高粱、以及各种干豆类，如黄豆、青豆、绿豆等。食用粗粮血糖上升较慢，有助于控制血糖，但是并不能降低血糖。\nB项正确，反式脂肪，又称为反式脂肪酸、逆态脂肪酸，是一种不饱和脂肪酸（单元不饱和或多元不饱和）。反式脂肪存在于植物油、糖果、巧克力、蛋糕、面包、披萨、人造奶油、曲奇饼等常见食物中。\nC项错误，人体胆固醇的来源有两种，一种是从食物中获取，一种是机体以乙酰辅酶A为原料自身合成的。食物的主要来源是动物的内脏、蛋黄、奶油及肉等动物性食品。\nD项错误，食品包装上的保质期是指食品的最佳食用期，一般是指在生产厂家规定的贮藏条件下，能够保持食品优良品质的期限。有些食物虽已过了保质期，也是可以食用的，但它的品质可能有某种程度的下降。\n故正确答案为B。","no":14,"missingImage":false}],"count":14,"answerable":14,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        中国是茶的故乡。茶树原生于秀美的川滇山区，是智慧的古人从葳蕤草木中择出了茶叶，自此\u003cu>        \u003c/u>世人种茶、制茶、品茶的历史。在千百年的漫长岁月中，茶叶\u003cu>        \u003c/u>着泱泱中华文明，跨越无尽的山海，推动各个民族以茶会友、因茶结缘。正如日本思想家冈仓天心所说：“东西方彼此差异的人心，在茶碗里才真正地相知相遇。”茶与茶文化走出国门、走向世界的历史，也是中华文明参与构建人类命运共同体的历史。\u003c/p>","questions":[{"qid":"2669061","cat":"逻辑填空","stem":"填入画横线部分最恰当的一项是：","options":{"A":"启迪  承受","B":"开启  承载","C":"开放  承袭","D":"启发  承担"},"answer":"B","explanation":"第一空，搭配“历史”。B项“开启”指开始、从某一点起，与“历史”搭配得当，保留。A项“启迪”指开导、启发，与“历史”搭配不当，排除；C项“开放”指打开，释放，解除限制等含义，与“历史”搭配不当，排除；D项“启发”指开导其心，使之领悟，强调引导他人领悟，不符合语境，排除。\n第二空，代入验证，B项“承载”与“中华文明”搭配得当，当选。\n故正确答案为B。\n【文段出处】《一杯茶的世界之路》","no":15,"missingImage":false},{"qid":"2669066","cat":"片段阅读","stem":"接下来最不可能重点讲述的是：","options":{"A":"中国人吃茶习俗的崛起","B":"各时各地茶文化的多样性","C":"不同种类茶的功效比较","D":"中外“茶马”互市的历史"},"answer":"C","explanation":"接语选择题重点关注尾句。尾句话题为茶与茶文化走向世界，故下文应对茶与茶文化的内容进行展开。A项“吃茶习俗”为茶文化的一个方面，后文可以进行论述，排除；B项“各时各地”的茶文化，对应茶文化的海外传播，与尾句话题一致，排除；C项“不同种类茶的功效”，与茶文化无关，与尾句话题不一致，当选；D项“中外‘茶马’互市”对应茶与茶文化的海外传播，与尾句话题一致，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《一杯茶的世界之路》","no":16,"missingImage":false}]},{"type":"material","material":"\u003cp>        对于互联网平台而言，以最低的成本谋求最大的效益是其存在的意义，一般不会主动降低对利益的诉求。这就导致数据收集对象难以获得收益的索取权利，只能选择付出最少成本的平台，即实质上的“用脚投票”。这样互联网平台又进入了传统的企业间成本领先或者差异化的竞争。然而互联网平台的崛起实质上源于共享经济的理念，而现在共享性随着垄断收益的增加而逐渐消失，聚集效应成为主导。\u003c/p>\u003cp>        问题的核心在于从互联网平台的崛起到大数据收集进入瓶颈的期间内，到底是什么发生了改变。终端从计算机变成手机等一系列智能设备，它们不仅更方便，而且更快，功能更多；人们无论从事什么行业，多大年龄，都主动或被动地完成了信息技术技能的更新，整个人类社会在极短的时间里完成了大范围的信息科技设备的“高端化”；同时，随着信息和知识总量的增加以及获取信息渠道的拓宽，人类社会也整体得到了大幅度的知识水平提高和思想意识觉醒。这会使互联网平台不再满足其中介的身份，而是力争获取大部分甚至全部的数据收益。同时，人们也具备了参与价值分配的能力、设备和技术。在这种情况下，区块链的应运而生与其说是区块链的技术被发现或得到了突破，不如说是这种技术普及和推广的条件已经成熟。\u003c/p>","questions":[{"qid":"2669071","cat":"片段阅读","stem":"上述文段主要介绍了：","options":{"A":"区块链的发展潜力","B":"区块链的现实基础","C":"互联网平台式微和区块链的崛起","D":"互联网平台与区块链的竞争关系"},"answer":"C","explanation":"文章分两个自然段，第一自然段通过转折指出，互联网平台的崛起源于共享经济理念，但共享性却在逐渐消失。第二自然段详细分析了互联网平台大数据收集进入瓶颈的原因，并指出“在这种情况下”，区块链应运而生。故文段详细分析了互联网平台的衰落和区块链崛起的现象，C项当选。\nA项，文段主要围绕互联网平台进行详细论述，分析区块链应运而生的背景和原因，并没有介绍其“发展潜力”，排除；B项，文段从互联网发展的角度介绍了区块链是如何应运而生的，并非全面介绍区块链的现实基础，排除；D项，文段并未着重论述二者的“竞争关系”，无中生有，排除。\n故正确答案为C。\n【文段出处】《基于区块链的互联网平台大数据收集研究》","no":17,"missingImage":false},{"qid":"2669075","cat":"片段阅读","stem":"根据上述文字，区块链技术将有望：","options":{"A":"创造更多的数据价值","B":"削弱互联网平台存在的价值","C":"实现数据创造者利益均分","D":"突破互联网平台大数据收集的困境"},"answer":"D","explanation":"第二自然段分析了互联网平台大数据收集进入瓶颈的原因，随后指出在这种情况下区块链应运而生，故可以推断出，区块链的出现可以突破大数据收集的瓶颈，D项当选。\nA、B、C三项均为无中生有，文段并未提及，排除。\n故正确答案为D。","no":18,"missingImage":false}]},{"type":"material","material":"\u003cp>        \u003cu>                    \u003c/u>，当存在其他基因序列与需要编辑的目的基因相似时，就有可能被基因组编辑错误识别，产生意料之外的基因改变。也就是说，基因组编辑有可能会偏离目标，这被称作“脱靶”。在受精卵的阶段开展基因组编辑，如果偏离目标基因的变异没有被发现的话，就会波及婴儿全身细胞，产生难以预料的后果。如果真的发生这样的事情，就是重大的医疗事故了。另一种情况是，在接受基因组编辑之前受精卵便发生了细胞分裂，这样就可能产生没有被编辑的细胞。随着胚胎发育，胎儿全身就将部分由编辑过的细胞、部分由未编辑的细胞构成，这被称作“胚胎嵌合”。这或许不会造成更严重的后果，但基因组编辑治疗的目标却很有可能无法达成。此外，基因组编辑的效率也是一个问题，在最早的人类胚胎基因组编辑研究中，只有大约一半的胚胎中致病基因被剔除，极少数成功表达了加入的正确基因。\u003c/p>","questions":[{"qid":"2669087","cat":"语句表达","stem":"填入画横线部分最恰当的一项是：","options":{"A":"基因组编辑技术的效率和准确率并非完美无缺","B":"基因组编辑技术的关键在于准确识别目的基因","C":"基因组编辑存在较大风险且在道德上不可接受","D":"基因组编辑作为治疗手段，其必要性值得探讨"},"answer":"A","explanation":"横线出现在文段开头，需结合后文内容分析。横线后指出在特定情况下，基因组编辑会产生意料之外的基因改变，也就是可能会“脱靶”，接下来详细介绍可能会“脱靶”的情况。“此外”指出基因组编辑的“效率”也是一个问题。A项“效率和准确率”对应后文的两个方面，当选。\nB项，横线后着重讲基因组编辑可能导致的不良后果，而非介绍技术的关键，排除；C项，后文没有涉及“道德”问题，排除；D项，后文介绍的是技术方面的问题，而非“必要性”，排除。\n故正确答案为A。\n【文段出处】《“设计婴儿”还有多远?》","no":19,"missingImage":false},{"qid":"2669092","cat":"片段阅读","stem":"对上文理解不准确的一项是：","options":{"A":"“脱靶”可能比“胚胎嵌合”的后果更为严重","B":"早期人类基因组编辑很难发现偏离目标基因的变异","C":"对基因组编辑后的受精卵进行详细的基因检查是十分必要的","D":"基因组编辑进入临床应用值得审慎"},"answer":"B","explanation":"A项，根据文段，“脱靶”会“产生难以预料的后果”，“胚胎嵌合”“或许不会造成更严重的后果”，可以推断“脱靶”可能后果更严重，表述正确，排除；B项，原文表述为“如果偏离目标基因的变异没有被发现的话”，而非“很难发现”，表述错误，当选；C项，根据文意，基因组编辑后可能会“产生意料之外的基因改变”，因此进行详细的基因检查是十分必要的，表述正确，排除；D项，根据文意，基因组编辑可能会出现很多严重后果，因此进入临床应用应当审慎，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《“设计婴儿”还有多远? 》","no":20,"missingImage":false},{"qid":"2668909","cat":"逻辑填空","stem":"一些人对于书法传统的“离经叛道”，导致书法艺术价值和审美标准            ，趋于解构，广大群众觉得书法变得越来越看不懂。《光明日报》此前曾发问“书法的美学标准变了吗？”“当今书法艺术评价标准在哪儿？”表达了许多书法爱好者和书法教育工作者所共同关心的问题。\n填入画横线部分最恰当的一项是：","options":{"A":"众口一词","B":"莫衷一是","C":"鞭辟入里","D":"异口同声"},"answer":"B","explanation":"根据横线后的内容可知，书法的审美标准和艺术价值没有定论，没有统一的标准和观点。B项“莫衷一是”指意见有分歧，没有一致的看法，符合文意，当选。\nA项“众口一词”指所有的人都说同样的话，与文意相悖，排除。\nC项“鞭辟入里”指分析透彻，切中要害，形容“深入”，与文意无关，排除。\nD项“异口同声”指大家说的完全一致，与文意相悖，排除。\n故正确答案为B。\n【文段出处】《书法教育的当务之急是“守正”》","no":21,"missingImage":false},{"qid":"2668917","cat":"逻辑填空","stem":"从概念迈向应用，从            到广受追捧，诞生于德国的工业4.0已进入第七个发展年头。根据德国信息技术、电信和新媒体协会的数据，工业4.0相关产值增长迅速，2018年预计达70亿欧元。\n填入画横线部分最恰当的一项是：","options":{"A":"阳春白雪","B":"趋之若鹜","C":"万人空巷","D":"曲高和寡"},"answer":"D","explanation":"根据“从概念迈向应用”可知，横线处与“广受追捧”为反义并列，表示没有什么人知道，D项“曲高和寡”可以形容了解的人很少，符合文意，当选。\nA项“阳春白雪”指高深的文学艺术，与文段“德国工业”搭配不当，排除。\nB项“趋之若鹜”比喻许多人争着去追逐，与文意相悖，排除。\nC项“万人空巷”指庆祝欢迎的盛况，与文意不符，排除。\n故正确答案为D。\n【文段出处】《体验德国工业4.0》","no":22,"missingImage":false},{"qid":"2668926","cat":"逻辑填空","stem":"“诗和远方终于走在了一起！”文化和旅游部的挂牌与职责整合，引发不少网友点赞。贵州的“赤水竹编杯”、杭州的“宋城千古情”、查干湖的冬捕、傣族的泼水节、青海的花儿、南宁的民歌······旅游离不开文化的        ，文化也需要旅游的        。让文化牵手旅游、把文化基因注入旅游资源，更有利于实现良性循环、合作增值。\n填入画横线部分最恰当的一项是：","options":{"A":"引导  丰富","B":"体验  承载","C":"体验  传承","D":"引导  承载"},"answer":"B","explanation":"第一空，B项和C项“体验”指亲身经历，实地领会，填入文段中，说明旅游离不开体验、感受文化，搭配恰当，符合文意，均保留。A项和D项的“引导”指带领、启发，与“旅游”和“文化”搭配不当，均排除。\n第二空，B项“承载”指承受支撑，置于文段中，形容文化需要旅游的支撑，符合文意，当选。C项“传承”指传授和继承，与“旅游”和“文化”搭配不当，排除。\n故正确答案为B。\n【文段出处】《让文化和旅游更好融合》","no":23,"missingImage":false},{"qid":"2668931","cat":"逻辑填空","stem":"在互联网这棵大树上，新模式、新业态的长势越是欣欣向荣，就越要创新监管方式。把握节奏和关键，        市场和趋势，以监管之剪        那些歪枝烂花，才能让新模式、新业态更好地服务于人民、契合于时代。\n填入画横线部分最恰当的一项是：","options":{"A":"洞察  修剪","B":"明察  剔除","C":"洞察  剔除","D":"明察  修剪"},"answer":"C","explanation":"第一空，搭配“市场和趋势”，“洞察”指观察得非常透彻、清楚，形容把市场和趋势看得清楚，与文段搭配恰当，符合文意，保留A、C两项。“明察”指观察入微、不受蒙蔽，严明苛察，与文段缺少对应，文段没有观察入微、不受蒙蔽的语境，排除B、D两项。\n第二空，对应后文“歪枝烂花”，说明要除掉不好的，C项“剔除”指去除、清除，符合文意，当选。A项“修剪”没有除掉的含义，与文意不符，排除。\n故正确答案为C。\n【文段出处】《“粉丝集资”别成糊涂账》","no":24,"missingImage":false},{"qid":"2668937","cat":"逻辑填空","stem":"著名社会学家费孝通曾将中国社会概括为“熟人社会”，而今天，这种社会关系结构正面临冲击。现代商业社会为老楼带来新房客的同时，也逐渐        着传统的邻里关系。虽一墙之隔，互相却并不了解，虽两门相对，见面也未曾说话。从熟人到陌生人，从有机连接的邻里到鲜有往来的          生存，人与人之间的谅解与共识，似乎比从前更难达成。\n填入画横线部分最恰当的一项是：","options":{"A":"消解  个体化","B":"稀释  原子化","C":"分化  原始化","D":"离散  大众化"},"answer":"B","explanation":"本题可以从第二空入手，对应“有机连接的邻里”和“鲜有往来”，说明横线处表示独自生存，C项“原始化”和D项“大众化”都没有独自、孤独的含义，与文段语境不符，排除。保留A项“个体化”和B项“原子化”。\n第一空，搭配“传统的邻里关系”，B项“稀释”置于文段中指邻里关系变淡了，符合文意，当选。A项“消解”指消释、消除，与“邻里关系”搭配不当，排除。\n故正确答案为B。\n【文段出处】《给老楼房安上“心”电梯》","no":25,"missingImage":false},{"qid":"2668944","cat":"逻辑填空","stem":"那个很有主见的少年天子，就这样一步步沦为被海瑞唾骂的“竭民脂膏，滥兴土木，二十余年不视朝，法纪弛矣”的腐朽皇帝。杨金英或许不会想到，她们的弑君行为，不仅成为嘉靖皇帝个人生涯的拐点，也让大明王朝的剧情            ，从此走向            。\n填入画横线部分最恰当的一项是：","options":{"A":"一波三折  万丈深渊","B":"急转直下  万劫不复","C":"跌宕起伏  穷途末路","D":"峰回路转  日暮途穷"},"answer":"B","explanation":"第一空，根据文意，可知弑君行为让嘉靖皇帝从很有主见的少年天子，变成了一个腐朽皇帝，大明王朝也同时走向了不好的方向，B项“急转直下”形容突然转变，并且很快地顺势发展下去，符合文意，保留。A项“一波三折”指事物进行中意外很多，C项“跌宕起伏”指事物多变，不稳定，均强调变化和意外多，与文意不符，排除；D项“峰回路转”指事情经历挫折之后出现新的转机，语义积极，与文段感情色彩不符，排除。\n第二空，代入验证，B项“万劫不复”强调无法挽救，符合文意，当选。\n故正确答案为B。\n【文段出处】《午门以深》","no":26,"missingImage":false},{"qid":"2668951","cat":"逻辑填空","stem":"随着日军的包围圈越来越小，张将军的右肩、左臂先后被炸伤。看到卫兵们            ，张将军按住了伤口，满不在乎地说：“没什么，不要大惊小怪。我是上将衔，今天如果牺牲了，明年的今天一定很热闹喽！”            ，下午4时左右，张将军“身受七伤，腹为之穿”，英勇殉国。\n填入画横线部分最恰当的一项是：","options":{"A":"惊慌失措  一语成谶","B":"失魂落魄  果不其然","C":"束手无策  一语中的","D":"胆战心惊  一语成谶"},"answer":"A","explanation":"第一空，对应“随着日军的包围圈越来越小，张将军的右肩、左臂先后被炸伤”“不要大惊小怪”，说明士兵们面对这种情况都很害怕，不知道该怎么办。A项“惊慌失措”指吓得慌了手脚，不知道怎么办好，符合文意，保留。B项“失魂落魄”指极度惊慌，心神不宁的样子，D项“胆战心惊”形容非常害怕，均只能体现害怕，但是不能体现不知道该怎么办，排除；C项“束手无策”形容遇到问题毫无解决的办法，不能体现出士兵们害怕，排除。\n代入第二空验证，A项“一语成谶”指不吉利的话应验了，符合文意，当选。\n故正确答案为A。\n【文段出处】《1937.暗战北平》","no":27,"missingImage":false},{"qid":"2668958","cat":"逻辑填空","stem":"唐代文学家段成式有言：“人不读书，其犹夜行。”当前，人们对文化的需求已呈井喷之势，        与其比较碎片化与严肃阅读的高低优劣，        顺应碎片化阅读这一难以逆转的趋势，不断丰富优质精神食粮的供给，        地满足不同群体的多元阅读需求。\n填入画横线部分最恰当的一项是：","options":{"A":"所以  不如  更好","B":"因为  不如  更快","C":"所以  不如  更快","D":"因为  不如  更好"},"answer":"A","explanation":"第一空，“人们对文化的需求已呈井喷之势”为当前的情况，“与其比较碎片化与严肃阅读的高低优劣，不如顺应碎片化阅读这一难以逆转的趋势”为结论，A项和C项“所以”表结论，均保留。B项和D项“因为”表原因，均与文段不符，排除。\n第三空，根据“不断丰富优质精神食粮的供给”可知，后文应该为更好地满足不同群体的多元阅读需求，A项符合文意，当选。C项“更快”强调速度，与文段缺少对应，排除。\n故正确答案为A。\n【文段出处】《向碎片化阅读要质量》","no":28,"missingImage":false},{"qid":"2668967","cat":"逻辑填空","stem":"走近这片被岁月        的艺术品，逼人的炫美令人顿生敬意：墙壁上        着《旧约》中的耶和华与大力神赫利克斯，栩栩如生，不能不称之为雕刻中的神品，而墙顶上站着的日月二神，更是神采飞扬，飘飘欲仙。不难想象，在曾经围合得            的高墙之内，奥多汉尼克宫的屋宇厅堂必是金碧辉煌，珍宝无数，现在虽断壁残垣，依然不失端庄威严，富丽堂皇。\n填入画横线部分最恰当的一项是：","options":{"A":"驳蚀  雕刻  神秘莫测","B":"剥蚀  篆刻  水泄不通","C":"腐蚀  镌刻  神秘莫测","D":"侵蚀  雕琢  水泄不通"},"answer":"A","explanation":"第一空，搭配“岁月”和“艺术品”，A项“驳蚀”和B项“剥蚀”指古代碑刻因年久和风化而剥落，均符合文意，保留。C项“腐蚀”指在周围介质作用下产生损耗与破坏的过程，与“岁月”搭配不当，排除。D项“侵蚀”指侵入腐蚀，与“岁月”搭配不当，排除。\n第二空，搭配“墙壁”，A项“雕刻”指雕塑，符合文意，保留。B项“篆刻”是汉字独有的一种艺术形式，用来制作印章，与文意不符，排除。\n第三空，代入验证，A项“神秘莫测”指非常神秘、难以推测，常用来形容一些不可理解的事物或现象，符合文意，当选。\n故正确答案为A。\n【文段出处】《本真之美》","no":29,"missingImage":false},{"qid":"2668975","cat":"语句表达","stem":"经济发展带动了社会的流动性，人才与市场有了充分的双向选择，于是辞职不再是以前老一辈所说的“天要塌下来”的那种境况，反而是有了“                    ”的自由维度。但“裸辞”又不尽然，它没有计划表，也没有线路图，几乎就是“一言不合”之下的产物。\n填入画横线部分最恰当的一项是：","options":{"A":"柳暗花明又一村","B":"良禽择木而栖","C":"春风又绿江南岸","D":"女为悦己者容"},"answer":"B","explanation":"“不再是······反而是”表反义并列，横线处应与前文内容表意相反，前文指出以前辞职就会出现“天要塌下来”的境况，故横线处应表示不会出现“天要塌下来”的不好情况，而是体现一种“人才与市场可双向选择”的自由维度，B项，“良禽择木而栖”比喻优秀的人才应该选择能发挥自己才能的好单位和善用自己的好领导，可体现人才的自由选择，符合文意，当选。\nA项，“柳暗花明又一村”原形容前村的美好春光，后借喻突然出现新的好形势，表意不明确，排除；\nC项，“春风又绿江南岸”指春风吹来了，吹绿了江南岸边的花草树木，形容的是一种思乡之情，与文意无关，排除；\nD项，“女为悦己者容”指女孩子喜欢为了取悦那些喜欢自己的人梳妆打扮，与文意无关，排除。\n故正确答案为B。\n【文段出处】《青年任性“裸辞”需要实力兜底》","no":30,"missingImage":false},{"qid":"2668981","cat":"语句表达","stem":"①这是典型的神话宇宙观的表现\n②提起中国的神话，人们会联想到“女娲补天”“后羿射日”“嫦娥奔月”等故事\n③但神话是作为文化基因而存在的，比如构成我们国名的两个汉字，“中”和“国”，均出于神话想象，华夏先民把大地想象成四方形的，四边之外有海环绕（所谓“四海五洲”），而自认为是大地上的中央之国（九州或神州）\n④从这个意义上讲，神话遗产，是我们进入中国传统本源的有效门径\n⑤神话是文化和文学的源头\n⑥许多人认为，与西方神话相比，中国的神话只是远古时代人类的思考与探索自然并结合自己的想象所产生的并不成体系的东西\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑥②③①④⑤","B":"④⑤⑥②③①","C":"②①⑥③⑤④","D":"⑤②⑥③①④"},"answer":"D","explanation":"先判断首句，④句出现指代词“这个意义”，不适合作首句，排除B项。②句论述提及中国的神话会联想到一系列的故事，⑤句阐述神话的内涵，⑥句论述许多人对中国神话的看法，对比可发现，⑤句是对神话下定义，②句和⑥句均在具体阐述中国神话的内容，故⑤句更适合作首句，排除A、C两项。\n验证D项，文段先提出“神话”的话题，然后引出别人的观点认为中国的神话是不成体系的，紧接着利用转折词“但”强调神话是进入中国传统本源的有效门径，逻辑通顺，当选。\n故正确答案为D。\n【文段出处】《重新解读中国神话：进入中国传统本源的有效门径》","no":31,"missingImage":false},{"qid":"2668992","cat":"语句表达","stem":"下列选项中没有语病的是：","options":{"A":"乡村是农耕经济的载体，也是继承乡愁记忆和农耕文明的载体。","B":"真实的情境往往都是逻辑的、线性的，也是多变的、复杂的，是结构不良的现实情境。","C":"随着高等教育普及和人才流动，地域符号逐渐成为身份认同的文化资源。","D":"当产能过剩与经营不善互相叠加，后果就是：开门时好不热闹，不久前门庭若市，最终锈迹斑斑。"},"answer":"C","explanation":"本题为病句辨析题。\nA项，“继承”与“乡愁记忆”搭配不当，可将“继承”改为“传承”，排除；\nB项，真实的情境并不都是逻辑的、线性的，往往是多变的、复杂的，排除；\nC项，句子没有语病，句意明确，当选；\nD项，根据“产能过剩与经营不善”可知，会产生两种相反的后果，而“开门时好不热闹”和“不久前门庭若市”均表示热闹的意思，语意重复，应把“门庭若市”改为“门可罗雀”，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《留住农耕文明的乡愁记忆》","no":32,"missingImage":false},{"qid":"4695897","cat":"片段阅读","stem":"昆曲，毫无疑问是古典戏曲的代表，极端者甚至认为昆曲只保留和传承古典的文学、音乐和表演艺术，就能实现在当代乃至后世的无限延续。虽然一个时代需要有一个时代的创造，昆曲也试图在不同的时代中与时俱进，但历史却显示出近百年来“昆班所演，无非旧曲”的尴尬，众多的新创作品在古典经典的映衬下，多少显得黯淡无光。由此，观曲界似乎更加坚信了一点：                    。\n填入画线部分最恰当的一句是：","options":{"A":"昆曲只属于古典","B":"昆曲依托其古典品质能无限延续","C":"当前时代不适合昆曲创作","D":"古典戏曲无法超越"},"answer":"A","explanation":"横线出现在文段结尾，且由“由此”引导观曲界的观点，可知横线处所填句子是对前文的总结。文段开篇指出昆曲是古典戏曲的代表，并介绍了极端者的观点。接着说明了昆曲试图在不同的时代中与时俱进，但都没能成功，依然是古典经典作品更具魅力。文段尾句通过“由此”对前文进行总结，故横线处所填句子强调昆曲与古典密不可分，对应A项。\nB项，“依托其古典品质能无限延续”仅对应前文极端者的观点，并非是对前文内容的总结，且无法与尾句“观曲界”衔接，排除；\nC项，“当前时代”非重点，文段提到昆曲试图在不同时代中与时俱进都没能成功，并未强调“当前时代”，排除；\nD项，缺少文段主题词“昆曲”，排除。\n故正确答案为A。\n【文段出处】《创造的光彩 现代的光彩——看昆曲&lt;春江花月夜&gt;》","no":33,"missingImage":false},{"qid":"4695902","cat":"片段阅读","stem":"“复兴号”是我国具有完全自主知识产权的中国标准动车组，它的成功研制生产，标志着我国的铁路成套技术装备特别是高速动车组已经走在世界先进行列。目前，“复兴号”中国标准动车组有“CR400AF”和“CR400BF ”两种型号，“CR”是中国铁路总公司英文缩写，也是指覆盖不同速度等级的中国标准动车组系列化产品平台，型号中的“400” 为速度等级代码，代表该型动车组试验速度可达400km/h及以上，持续运行速度为350km/h。“A”和“B”为企业标识代码，代表生产厂家；“F”为技术类型代码，代表动力分散电动车组，红色车头的是中车四方的AF，黄色车头是中车长客的BF。\n根据这段文字可知，不正确的一项是：","options":{"A":"目前，“复兴号”中国标准动车组有“CR400AF” 和“CR400BF”两种型号","B":"“复兴号”的顺利生产，标志着我国的铁路成套技术装备特别是高速动车组已经走在世界先进行列","C":"“CR400AF”和“CR400BF”中的“A”和“B”为企业标识代码，代表生产厂家","D":"“复兴号”是我国具有完全自主知识产权的中国标准动车组.其运行速度为400km/h及以上，持续运行速度为350km/h"},"answer":"D","explanation":"A项，根据 “目前，‘复兴号’中国标准动车组有‘CR400AF’和‘CR400BF ’两种型号”可知，表述正确，排除；\nB项，根据 “‘复兴号’······它的成功研制生产，标志着我国的铁路成套技术装备特别是高速动车组已经走在世界先进行列” 可知，表述正确，排除；\nC项，根据“‘A’和‘B’为企业标识代码，代表生产厂家”可知，表述正确，排除；\nD项，根据“型号中的‘400’为速度等级代码，代表该型动车组试验速度可达400km/h及以上”可知，“运行速度为400km/h”表述错误，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《＂复兴号＂具有完全自主知识产权》","no":34,"missingImage":false},{"qid":"4695907","cat":"片段阅读","stem":"毫无疑问，美国应该发展他们具有贸易优势的高科技产业，这样不仅可以提高美国的福利水平，提高世界各国的福利水平，而且能使美国维持自身的优势，使企业获得丰厚的利润，目前美国对中国的贸易逆差恰恰是对中国出口高科技产品进行人为限制的困境，也就是说，是美国自身的政策限制了他们发挥自己的贸易优势，显然，美国贸易优势并不在于普通制造业，这些部门的盲目回归不符合国际贸易的原理，也不符合美国的利益。美国受教育程度不高的非熟练工人失业是经济模式转型造成的阵痛，是一种结构性失业，不能单纯指望保护贸易政策得到解决。底特律的衰败就是一个典型的例子。\n不符合文段所表达意思的是：","options":{"A":"中国实现对美国贸易顺差主要归功于高科技产品的出口","B":"美国采取以邻为壑的贸易保护政策不利于其应对自身危机","C":"美国对中国的贸易逆差是其作茧自缚的后果","D":"美国将国内的失业问题归咎于中国制造业的崛起"},"answer":"A","explanation":"A项，根据文段“目前美国对中国的贸易逆差······发挥自己的贸易优势”可知，中国对美国实现贸易顺差是因为美国人为制造的贸易保护政策，而非“中国出口高科技产品”本身这一行为，偷换概念，当选；\nB项，根据文段“也就是说······也不符合美国的利益”可知，美国贸易保护政策并不能解决其自身危机，表述正确，排除；\nC项，根据文段“目前美国对中国的贸易逆差······发挥自己的贸易优势”可知，美国对中国的贸易逆差是其自身原因导致的，表述正确，排除；\nD项，根据文段“也就是说······不在于普通制造业”“美国受教育程度······保护贸易政策得到解决”可知，美国出台贸易保护政策的目的是解决其国内失业问题，具体做法是限制中国制造业发展，所以可理解为美国将其国内失业问题归咎为中国制造业的发展，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《以治理推进全球化：评估与展望》","no":35,"missingImage":false},{"qid":"2668999","cat":"片段阅读","stem":"夜晚的西部大沙漠，显得无边的苍茫、无边的寂寥，如同踏上另外一个星球。仿佛就在一刹那，嘈杂和纷乱的世俗生活消失了。冥冥之中，似闻天籁之声。此间，你会真正用大宇宙的角度来观照生命，观照人类的历史和现实。在这个孤寂而无声的世界里，你期望生活的场景会无比开阔，你体会生命的意义会更加深刻。你感到人是这样渺小，又感到人的不可思议的巨大。\n文段意在告知我们：","options":{"A":"沙漠旅行是一种很好的心灵治愈方式","B":"要打破自己固有的思维局限","C":"人对于宇宙万物而言是极其渺小的","D":"要以更广阔的视野来看待生活和生命"},"answer":"A","explanation":"文段开篇阐述在夜晚的大沙漠就像踏上了另一个星球，之后具体阐述在沙漠生活期间对人身心的影响，一是会让嘈杂的世俗生活消失，世界变得宁静，二是在这期间，人们会用大宇宙的角度来观照生命，期望生活的场景会更加开阔，感受到更深刻的生命意义，故文段强调的是在沙漠生活对于人身心的益处，对应A项。\nB、C、D三项均为沙漠旅行对人身心好处的一方面，表述片面，排除。\n故正确答案为A。\n【文段出处】《大漠石油花》","no":36,"missingImage":false},{"qid":"3938948","cat":"片段阅读","stem":"孩子们需要培养，但更需要高质量的陪伴，一些家长或因工作繁忙，或为休闲娱乐，和孩子们在一起时，也不愿放下手机，关上电脑。让陪伴仅限于空间上的“在一起”，而忽略了心理上的“零距离”。实际上，更好的陪伴，是在面对面的交流中，营造积极互动的语言环境，温润孩子的思想，爱抚幼小的心灵，让他们能更真切地感受到家庭的温暖、亲情的润泽。优质的教育，莫不源于用心的投入。孩子只有一个童年，别让手机阻碍情感的交融，把专注的目光更多投射到孩子身上，才能陪伴子女度过一段好时光。\n根据文段内容，作者旨在呼吁：","options":{"A":"给予孩子高质量的陪伴","B":"家长应兼顾工作和孩子","C":"别让手机毁了孩子童年","D":"关注孩子们的心理问题"},"answer":"A","explanation":"文段开篇介绍问题，指出很多家长的陪伴都仅限于空间上的“在一起”，而忽略了心理上的“零距离”，存在陪伴低质量的现象。之后“实际上”表转折，提出解决问题的对策，即通过营造积极互动的语言环境，温润孩子的思想等方面，给予孩子高质量的家庭陪伴，尾句再次强调要将更多的精力放在陪伴孩子身上，故文段重点讲述的是要给予孩子高质量的陪伴，对应A项。\nB项，文段并未阐述“工作”与“孩子”的关系，无中生有，排除；\nC项，文段强调的是家长对孩子的陪伴，并非手机对孩子的影响，非重点，排除；\nD项，“心理问题”无中生有，排除。\n故正确答案为A。\n【文段出处】《给孩子高质量陪伴》","no":37,"missingImage":false},{"qid":"2669012","cat":"片段阅读","stem":"《世说新语》讲过割席断交的故事，管宁、华歆“尝同席读书，有乘轩冕过门者，宁读如故，歆废书出看。宁割席分坐，曰：‘子非吾友也。’”故事表达了对待无聊无谓的事物，管宁是漠视不理，华歆是趋之若鹜。从当前的舆论场来说，就存在不少无聊无谓的话题，经常形成现象级的话题旋涡，动辄成千上万人参与进来，一起制造出一场场金玉其外、败絮其中的舆论盛宴。我们参与无谓的话题，不经意间可能就汇聚成人家的流量。往小里说，浪费大家的时间和精力；往大里说，不利于社会不良情绪的疏导，甚至会撕裂社会情绪，不可不察。当然，应对之道也简单，漠视、无视、蔑视。任凭你跳脚喊叫，我自岿然不动。\n根据文段内容，作者意在强调：","options":{"A":"要学会漠视无谓的话题","B":"不要贪慕荣华富贵","C":"注意力是可以变现的资源","D":"制造无谓的话题能收割流量"},"answer":"A","explanation":"文段开篇通过《世说新语》中的故事引出当下舆论场中存在的问题，即经常出现一些无聊无谓的话题，之后分析参与无谓话题会出现的危害，尾句提出对策，应对之道就是漠视、无视、蔑视这种无谓的话题，故文段为提出问题—分析问题—解决问题的结构，解决问题的对策是文段的重点，对应A项。\nB项，“贪慕荣华富贵”无中生有，排除；\nC项，“注意力是资源”无中生有，排除；\nD项，为分析问题部分的内容，非重点，排除。\n故正确答案为A。\n【文段出处】《学会漠视无谓的话题》","no":38,"missingImage":false},{"qid":"2669023","cat":"片段阅读","stem":"结束了暴胀的区域会变成大爆炸宇宙，但是，在两个大爆炸宇宙之间的空间里，暴胀仍然在持续，而且，\u003cu>那个空间\u003c/u>的暴胀速度应该远远高于我们生活的宇宙的膨胀速度，正在迅猛地急剧膨胀。结果，两个大爆炸宇宙之间的距离会随着时间的流逝而越来越远，所以，两个大爆炸宇宙是不会相撞的，这意味着，即便在未来，我们也不可能观测到位于我们生活的宇宙尽头之外的另一个宇宙。\n对于文段中加横线的“那个空间”，下列哪个图的标示是正确的？\n\u003cimg data-k=\"82c3a6d325f7\" style=\"max-width:606px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"“那个空间”中的“那个”指代的是前文的内容，定位文段可得，此空间指的是“两个大爆炸宇宙之间的空间”，对应C项。根据“两个大爆炸宇宙之间的空间”，可排除A、B两项。D项，根据“两个大爆炸宇宙之间的距离会随着时间的流逝而越来越远，所以，两个大爆炸宇宙是不会相撞的”可知，不会出现相交的空间，排除。\n故正确答案为C。\n【文段出处】《一个大难题！宇宙膨胀率的宇宙学》","no":39,"missingImage":false},{"qid":"2669028","cat":"片段阅读","stem":"很难说哪种思想，乐观的或悲观的，是对人工智能导致的“创造性破坏”的正确评价。希望是乐观的观点，概括了未来发展的创造性特征。正如历史所展示的，革命性的技术运动在最后实现时，能发展出更好的社会，即使其曾经是非常具有破坏性的，伴随着公司的起起伏伏，熟练技术代替大量的非娴熟技术。因此，对于积极的观点，一个重要的前提是这个社会准备好通过教育、学习和研究来掌控未来，愿意接纳变化，有应对未来不确定性，包括“创造性破坏”的弹性。\n根据文段内容，以下与作者观点最为接近的一项是：","options":{"A":"应该审慎对待革命性的技术运动","B":"人工智能对未来技术革新造成的影响是难以被评价的","C":"乐观看待技术革新带来的“创造性破坏”，并积极应对","D":"未来的社会有能力承受一系列变化，包括“创造性破坏”"},"answer":"C","explanation":"文段开篇阐述很难判断哪种思想是对人工智能导致的“创造性破坏”的正确评价，之后指出乐观的观点，概括了未来发展的创造性特征，并具体解释，尾句通过“因此”引出结论，指出积极观点的前提是社会准备好通过教育、学习等来掌控未来，愿意接纳变化，有应对未来不确定的能力，故文段强调的重点是要想有积极的观点，人们要做好积极应对的准备，对应C项。\nA项，文段是对“积极观点”的阐述，并未体现出作者认为应该持“审慎对待”的态度，无中生有，排除；\nB项，对应文段开头，非重点，且尾句作者给出了结论，只要人类做好准备，积极应对，是可以持积极观点的，非重点，排除；\nD项，文段并未提及“有能力”，而是指准备好获得这个承受能力，表述过于绝对，排除。\n故正确答案为C。\n【文段出处】《重新审视大国工业化运行机制》","no":40,"missingImage":false},{"qid":"2669031","cat":"片段阅读","stem":"人们常对哲学寄予不切实际的期待和希望，认为哲学将提供其他具体学科无法提供的更高级的“特等知识”或解决问题的“万能方法”，这种观点所体现的正是马克思所批判的“解释世界”的哲学观。但如果从“改变世界”这一哲学视角出发，我们就会将自觉放弃哲学的这种自我理解，并自觉到：通过“思想治疗”，揭示人们思维与观念中所存在的“病症”及其种种症候，改变人们看待事物的视角和眼光，转变人们理解世界的思维方式，并以此为“改变世界”开辟现实的道路，是哲学的重要功能之一。\n对上述文字理解最准确的一项是：","options":{"A":"世界是因人们的思维方式改变而改变的","B":"哲学能够通过改变人们的思维方式进而改变世界","C":"哲学的功能是改变世界而非解释世界","D":"哲学并不有助于我们理解世界"},"answer":"B","explanation":"文段开篇论述传统上人们认为哲学是解决问题的万能方法的观点，正是马克思批判的哲学观，之后转折强调，如果从“改变世界”这一哲学视角出发，就会发现哲学会通过改变人们看待事物的视角和眼光，转变理解世界的思维方式，进而改变世界，故文段强调的重点是哲学具有的功能之一，就是可以通过转变人们理解世界的思维方式来改变世界，对应B项。\nA项，文段强调的是哲学对世界的影响，缺少哲学，排除；\nC项，文段未提及哲学不具有解释世界的功能，无中生有，排除；\nD项，“哲学并不有助于我们理解世界”与文意相悖，排除。\n故正确答案为B。\n【文段出处】《贺来:哲学以何种方式改变世界》","no":41,"missingImage":false},{"qid":"2669037","cat":"片段阅读","stem":"囊链藻细胞中产生蓝色和绿色是通过一种常规方式将微小的油粒紧密地包裹在一起。这种结构类似于猫眼石中紧密包裹着的硅球体，它会产生衍射光，并产生令人渴望的宝石般的颜色。这些类似于猫眼石的光子晶体的功能尚不清楚。一条线索是：在强烈的光线下，这种有序的结构会进入无序状态，让颜色很快消失。但当黑暗条件回归时，颜色也会回归。科学家表示，这可能有助于植物应对低光照条件。\n根据文章内容可以推知：","options":{"A":"硅球体是囊链藻细胞发光的关键","B":"包裹在一起的油粒呈无序状态","C":"囊链藻在黑暗环境下会闪烁光芒","D":"海藻通常呈现蓝色和绿色的光泽"},"answer":"C","explanation":"A项，原文表述为“这种结构类似于猫眼石中紧密包裹着的硅球体”，可知“硅球体”是猫眼石中的结构，而非囊链藻细胞中的，排除；\nB项，原文表述为“在强烈的光线下，这种有序的结构会进入无序状态”，可知油粒可以呈“有序”和“无序”状态，排除；\nC项，根据原文“但当黑暗条件回归时，颜色也会回归”，可以推断出囊链藻在黑暗环境下会发光，当选；\nD项，原文表述为“囊链藻细胞中产生蓝色和绿色”，而非海藻呈现蓝色和绿色，偷换概念，排除。\n故正确答案为C。\n【文段出处】《海藻发光秘密揭示》","no":42,"missingImage":false},{"qid":"2669040","cat":"片段阅读","stem":"有学者认为，大数据的长项是对资料进行相关分析，而不用进行详尽的因果分析。但对此，学界尚有争议。因果关系需要两个变量在统计上有相关性，在时间上有先后顺序，即自变量在前，因变量在后；在逻辑上自变量的发生导致因变量的发生，即如果自变量没出现则因变量也不会出现。在传统的回归分析中，统计学注重对假设的检验和模型的显著性，但是在大数据时代，机器学习采用交叉验证的方法，根据结果的准确程度来判断模型好坏，不会深入分析各变量间的关系。因此，在大数据应用中，即使研究人员不知道变量间的因果关系，也可以根据数据间的相关关系得到想要的模型。\n由上文可以推知：","options":{"A":"相关分析和因果分析都能够建立模型","B":"在大数据时代，对数据进行因果分析已不重要","C":"统计意义上的相关不能代替因果关系，这一规则将在大数据时代被改写","D":"机器学习的方法显著优于传统回归分析"},"answer":"C","explanation":"A项，原文表述为“在大数据应用中，即使研究人员不知道变量间的因果关系，也可以根据数据间的相关关系得到想要的模型”，可知二者均可以建立模型，但需要以“大数据应用”为前提，选项表述过于绝对，排除；\nB项，文段并没有指出因果分析“已不重要”，无中生有，排除；\nC项，根据“在传统的回归分析中，统计学注重对假设的检验和模型的显著性，但是在大数据时代，机器学习采用交叉验证的方法，根据结果的准确程度来判断模型好坏，不会深入分析各变量间的关系。”可知，传统统计分析中需要分析各变量因果关系，也就是相关不能替代因果，又根据“在大数据应用中，即使研究人员不知道变量间的因果关系，也可以根据数据间的相关关系得到想要的模型。”可知，在大数据时代相关分析可以替代因果关系，由此可知C项表述正确，当选；\nD项，文段并没有对二者进行比较，排除。\n故正确答案为C。\n【文段出处】《漆海霞：大数据与国际关系研究创新》","no":43,"missingImage":false},{"qid":"2669051","cat":"片段阅读","stem":"提倡“用头脑作画”的塞尚，将看到的风景和静物做了主观性的加工，简化成圆柱体、圆锥体和其他几何体；立体主义大师毕加索更是把人（物）分解得支离破碎。倘若我们从精神科学的角度来分析他们的画，不难发现他们探索视觉机制的尝试。我们已经知道，视网膜把接收到的信息传递给大脑的初级视皮层后，视皮层就会对视觉信息进行筛选，初步识别出一些垂直线、水平线和拐角等简单特征。然后大脑启用“自下而上”方式对这些信息进行粗加工，这时候就可能获取更多关于图像里的几何体分层、切片的信息，就跟毕加索的立体主义绘画差不多。最后大脑再用“自上而下”方式，借助存储的信息库对视觉信息做进一步加工，最后得到栩栩如生，看起来十分真切，然而并不真实的画面。由于人类完成这样一个视觉过程的时间只能以千分之一秒来计量，根本来不及发现中间的过渡性画面。设想如果我们能够用高科技使这一过程放慢1000倍也就是视觉的图像转换在一秒内完成，那么也许我们真的可以看到其中有类似于塞尚、毕加索的作品的图像呢！\n从上文我们可以得出：","options":{"A":"接收、加工和识别视觉信息都是靠大脑来完成的","B":"塞尚、毕加索的作品是对我们大脑形成的初步视觉图像的还原","C":"塞尚、毕加索都对视觉机制进行了深入的探索和研究","D":"塞尚、毕加索的艺术创作过程和追求效果与视觉的运作过程是类似的"},"answer":"D","explanation":"A项，根据文段所述“视网膜把接收到的信息传递给大脑的初级视皮层后”，可知“接受”视觉信息不是靠大脑完成的，排除；\nB项，根据文段所述，大脑形成初步视觉图像是“视皮层就会对视觉信息进行筛选”，而毕加索的立体主义绘画还需要“自下而上”的大脑加工，排除；\nC项，文段并没有介绍塞尚、毕加索对视觉机制进行过直接的研究，无中生有，排除；\nD项，文段将塞尚、毕加索的作品作为例子，介绍这一类型的作品涉及的内在的视觉机制，故可以推断出二者具有相似性，当选。\n故正确答案为D。\n【文段出处】《几何抽象画：追求秩序与平衡》","no":44,"missingImage":false}]}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2668504","cat":"数学运算","stem":"-2，7，6，19，22，（    ）","options":{"A":"33","B":"39","C":"42","D":"54"},"answer":"B","explanation":"数列无明显特征，且\u003cspan style=\"color:#rgb(89,89,89)\">作\u003c/span>差无规律，考虑\u003cspan style=\"color:#rgb(89,89,89)\">作\u003c/span>和。两两\u003cspan style=\"color:#rgb(89,89,89)\">作\u003c/span>和形成新数列：5、13、25、41、（    ），新数列的后项减去前项可得：8、12、16、（20），是公差为4的等差数列，则新数列的下一项为\u003cimg data-k=\"47186fb4fffc\">，所求项为\u003cimg data-k=\"2a369b47b6cf\">。\n故正确答案为B。","no":45,"missingImage":false},{"type":"question","qid":"2668510","cat":"数学运算","stem":"-3，\u003cimg data-k=\"95b056430212\">，\u003cimg data-k=\"8c3342040bcf\">，2，\u003cimg data-k=\"9e1dcc15e152\">，（    ）","options":{"A":"\u003cimg data-k=\"7741ec85eaf0\">","B":"\u003cimg data-k=\"1db62206ff71\">","C":"\u003cimg data-k=\"1aa2b603a5cf\">","D":"\u003cimg data-k=\"d4677fa6f997\">"},"answer":"B","explanation":"题干为分数数列且存在整数，考虑反约分，得到新数列：\u003cimg data-k=\"7ae270c61b50\">、\u003cimg data-k=\"95b056430212\">、\u003cimg data-k=\"8c3342040bcf\">、\u003cimg data-k=\"382d154df3e6\">、\u003cimg data-k=\"9e1dcc15e152\">、（    ）。分母是连续自然数列，则所求项的分母为6；分子部分为-3、-1、2、8、19、（    ），后项减去前项得到新数列2、3、6、11、（    ），无明显规律，再次\u003cspan style=\"color:#rgb(89 ation":"题干元素组成不同，优先考虑属性规律。观察发现，题干每幅图形中都有等腰三角形且图形规整，优先考虑对称性。题干均是轴对称图形，且对称轴均为竖直方向，所以“？”处应为关于竖轴对称的图形，只有D项符合。\n故正确答案为D。","no":61,"missingImage":false},{"type":"question","qid":"2670592","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"972c93b36704\" style=\"max-width:700px\">","options":{"A":"①②⑤，③④⑥","B":"①②④，③⑤⑥","C":"①②③，④⑤⑥","D":"①⑤⑥，②③④"},"answer":"B","explanation":"题干元素组成不同，优先考虑属性规律。观察发现，图①②④均为全直线图形，图③⑤⑥均为曲线\u003cimg data-k=\"3d6d1f96db11\">直线图形，因此①②④为一组，③⑤⑥为一组。\n故正确答案为B。","no":62,"missingImage":false},{"type":"question","qid":"2670594","cat":"定义判断","stem":"风化，是指使岩石发生破坏和改变的各种物理、化学和生物作用。物理风化是指使岩石发生机械破碎，而没有显著的化学成分变化的风化；化学风化是指岩石在水、氧气、二氧化碳等作用下发生的化学分解。区分物理和化学风化的重点是有没有新物质的产生。生物风化是指生物活动对岩石的机械破坏。\n根据上述定义，下列不属于风化的是：","options":{"A":"长期高温暴晒环境下岩石出现裂隙","B":"从遗址中挖出的青铜器上带有锈迹","C":"古代石刻上的字迹、图案等变得模糊","D":"石灰岩遇水被溶解"},"answer":"B","explanation":"第一步：找出定义关键词。\n风化：“使岩石发生破坏和改变的各种物理、化学和生物作用”。\n物理风化：“使岩石发生机械破碎”、“没有显著的化学成分变化的风化”。\n化学风化：“岩石在水、氧气、二氧化碳等作用下发生的化学分解”、“区分物理和化学风化的重点是有没有新物质的产生”。\n生物风化：“生物活动对岩石的机械破坏”。\n第二步：逐一分析选项。\nA项：长期高温暴晒环境下岩石出现裂隙，符合“使岩石发生破坏和改变的各种物理、化学和生物作用”，符合定义，排除；\nB项：青铜器上带有锈迹，青铜器不是岩石，不符合“使岩石发生破坏和改变的各种物理、化学和生物作用”，不符合定义，当选；\nC项：古代石刻上的字迹、图案等变得模糊，符合“使岩石发生破坏和改变的各种物理、化学和生物作用”，符合定义，排除；\nD项：石灰岩遇水被溶解，符合“使岩石发生破坏和改变的各种物理、化学和生物作用”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":63,"missingImage":false},{"type":"question","qid":"2670595","cat":"定义判断","stem":"开放式决策，是指政府在进行重大决策时，充分听取、吸纳公众意见，并将公众意见作为行政决策的重要参考，使行政决策公开、透明，实现政府与公众有机互动的一种决策形式。\n根据上述定义，下列不属于开放式决策的是：","options":{"A":"发改委就天然气涨价事宜举行听证","B":"政府常委会邀请人大代表、政协委员和市民代表列席会议发表意见","C":"市民通过网上留帖或网上视频直播，参与重大民生事项讨论","D":"对社会高度关注的案件，司法机关邀请公众参与庭审旁听"},"answer":"D","explanation":"第一步：找出定义关键词。\n“政府”、“在进行重大决策时”、“充分听取、吸纳公众意见”、“将公众意见作为行政决策的重要参考”、“使行政决策公开、透明，实现政府与公众有机互动”、“决策形式”。\n第二步：逐一分析选项。\nA项：发改委就天然气涨价事宜举行听证，符合“政府”、“在进行重大决策时”、“充分听取、吸纳公众意见”、“将公众意见作为行政决策的重要参考”等关键词，符合定义，排除；\nB项：政府常委会邀请人大代表、政协委员和市民代表列席会议发表意见，符合“政府”、“在进行重大决策时”、“充分听取、吸纳公众意见”、“将公众意见作为行政决策的重要参考”等关键词，符合定义，排除；\nC项：市民通过网上留帖或网上视频直播，参与重大民生事项讨论，符合“政府”、“在进行重大决策时”、“充分听取、吸纳公众意见”、“将公众意见作为行政决策的重要参考”等关键词，符合定义，排除；\nD项：司法机关邀请公众参与庭审旁听，司法机关不是“政府”，且旁听不符合“充分听取、吸纳公众意见”、“将公众意见作为行政决策的重要参考”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":64,"missingImage":false},{"type":"question","qid":"2670596","cat":"定义判断","stem":"达克效应，是指能力欠缺的人由于欠缺考虑而得出错误结论，他们无法正确认识到自身的不足，常常沉浸在自我营造的虚幻优势之中，无法客观评价自己和他人的能力。\n根据上述定义，下列体现了达克效应的是：","options":{"A":"某患者家属不懂医，却对医生的诊断结果持有异议、极力争辩","B":"某新员工抱怨上司专业素养不如自己，只会瞎指挥","C":"某技校毕业生认为自己已经掌握某技能","D":"某考生觉得自己高考超常发挥，预计能上重本"},"answer":"B","explanation":"第一步：找出定义关键词。\n“能力欠缺的人”、“由于欠缺考虑而得出错误结论”、“无法正确认识到自身的不足”、“常常沉浸在自我营造的虚幻优势之中”、“无法客观评价自己和他人的能力”。\n第二步：逐一分析选项。\nA项：患者家属不懂医，却对医生的诊断结果持有异议，只评价了医生的能力，不符合“无法客观评价自己和他人的能力”，不符合定义，排除；\nB项：新员工抱怨上司专业素养不如自己，符合“能力欠缺的人”、“由于欠缺考虑而得出错误结论”、“无法正确认识到自身的不足”、“常常沉浸在自我营造的虚幻优势之中”、“无法客观评价自己和他人的能力”，符合定义，当选；\nC项：某技校毕业生认为自己已经掌握某技能是一个客观的评价，不符合“能力欠缺的人”，也不符合“无法客观评价自己和他人的能力”，不符合定义，排除；\nD项：某考生觉得自己高考超常发挥，预计能上重本，不符合“无法客观评价自己和他人的能力”，不符合定义，排除。\n故正确答案为B。","no":65,"missingImage":false},{"type":"question","qid":"2670597","cat":"定义判断","stem":"时间悖论，通常是指因时间旅行或穿梭时空而导致的逻辑上可以推导出互相矛盾的结论。例如，12点01分的你，回到12点00分杀死了自己，问题是12点00分的你已经死了，那么执行杀死自己任务的人是谁？逻辑上就会出现这一矛盾。\n根据上述定义，下列虚构的时空穿梭示例中，几乎不会出现时间悖论的是：","options":{"A":"一名时间旅行者回到过去成功阻止了他的父母结婚","B":"你知道某期彩票中奖号码后，回到开奖前去买了这一组彩票","C":"某小区发生重大盗窃案，警察回到案发前目睹了这一切的发生","D":"一位科学家造了一架时间机器，回到过去并把这个时间旅行的秘密告诉了年轻时的自己"},"answer":"C","explanation":"第一步：找出定义关键词。\n“因时间旅行或穿梭时空”、“导致的逻辑上可以推导出互相矛盾的结论”。\n第二步：逐一分析选项。\nA项：回到过去阻止父母结婚，符合“因时间旅行或穿梭时空”，但阻止了父母结婚，那这名时间旅行者根本不会出生，就不会有回到过去的时间旅行者，符合“导致的逻辑上可以推导出互相矛盾的结论”，符合定义，排除；\nB项：回到开奖前符合“因时间旅行或穿梭时空”，你回到过去买了中奖的彩票，现在已经中奖了根本不需要再回到过去了，那回到过去的又是谁？，符合“导致的逻辑上可以推导出互相矛盾的结论”，符合定义，排除；\nC项：警察回到案发前目睹了这一切的发生，符合“因时间旅行或穿梭时空”，但是警察回到过去只是目睹了这一切的发生，并没有阻止案件发生的行为，不符合“导致的逻辑上可以推导出互相矛盾的结论”，不符合定义，当选；\nD项：一位科学家造了一架时间机器，回到过去，符合“因时间旅行或穿梭时空”，把时间旅行的秘密告诉了年轻时的自己，那么年轻时的自己早就知道时间旅行的秘密了，不需要现在的科学家再回到过去进行告知，符合“导致的逻辑上可以推导出互相矛盾的结论”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"2670599","cat":"定义判断","stem":"毒物兴奋反应，是毒理学用来描述毒性因子（刺激）的双相剂量效应的一个术语，即高剂量致毒因素（包括毒物、辐射等）对生物体有害，而低剂量致毒因素对生物体有益。\n根据上述定义，下列选项所描述的事实属于毒物兴奋反应的是：","options":{"A":"低剂量TCDD可使脑垂体、子宫、乳腺和胰腺的肿瘤发生率降低，却使肝、肺、舌和鼻咽喉的肿瘤发生率增加","B":"低剂量的青霉素可以增加感染伤寒埃氏杆菌的小白鼠的死亡率，较高剂量时却可以降低其死亡率","C":"高剂量吡虫啉能够显著抑制桃蚜产卵行为，低剂量时却能刺激桃蚜产卵行为","D":"磺胺二甲氧嘧啶对千翅藻的根、子叶、叶柄总是呈现毒性作用，而对节间和叶片长度则没有"},"answer":"C","explanation":"第一步：找出定义关键词。\n“高剂量致毒因素（包括毒物、辐射等）对生物体有害”、“低剂量致毒因素对生物体有益”。\n第二步：逐一分析选项。\nA项：低剂量的TCDD对人体不同器官的益害不同，不符合“高剂量致毒因素（包括毒物、辐射等）对生物体有害”、“低剂量致毒因素对生物体有益”，不符合定义，排除；\nB项：低剂量的青霉素会增加感染的小白鼠的死亡率，而较高剂量时可以降低死亡率，不符合“高剂量致毒因素（包括毒物、辐射等）对生物体有害”、“低剂量致毒因素对生物体有益”，不符合定义，排除；\nC项：高剂量吡虫啉能抑制桃蚜产卵行为，即对生物体有害；低剂量能刺激桃蚜产卵行为，即对生物体有益，符合“高剂量致毒因素（包括毒物、辐射等）对生物体有害”、“低剂量致毒因素对生物体有益”，符合定义，当选；\nD项：磺胺二甲氧嘧啶对千翅藻的不同部位毒性不同，没有提到剂量高低对生物体的影响，不符合“高剂量致毒因素（包括毒物、辐射等）对生物体有害”、“低剂量致毒因素对生物体有益”，不符合定义，排除。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"2670601","cat":"逻辑判断","stem":"对于基本粒子物理学而言，发现中微子振荡具有极其重要的意义，这是因为只有在中微子有质量时，才会发生中微子振荡。\n下列哪一论断是错误的？","options":{"A":"中微子不存在振荡现象，则证明中微子没有质量","B":"中微子存在振荡现象，则证明中微子有质量","C":"中微子不存在振荡现象，不能证明中微子没有质量","D":"中微子没有质量时，不会发生中微子振荡"},"answer":"A","explanation":"第一步：翻译题干。\n中微子振荡\u003cimg data-k=\"2dfb7d1f72f3\">中微子有质量\n第二步：逐一分析选项。\nA项：翻译为“\u003cimg data-k=\"e752a8ae1a16\">中微子振荡\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">中微子有质量”，是对题干条件的否前，否前推不出必然结论，论断错误，当选；\nB项：翻译为“中微子振荡\u003cimg data-k=\"2dfb7d1f72f3\">中微子有质量”，对题干条件的肯前，肯前必肯后，论断正确，排除；\nC项：选项是对题干条件的否前，否前推不出否后，所以中微子不存在振荡现象，不能证明中微子没有质量，论断正确，排除；\nD项：翻译为“\u003cimg data-k=\"e752a8ae1a16\">中微子有质量\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">中微子振荡”，是对题干条件的否后，否后必否前，论断正确，排除。\n本题为选非题，故正确答案为A。","no":68,"missingImage":false},{"type":"question","qid":"2670602","cat":"逻辑判断","stem":"来自公安机关的资料显示，娱乐圈中有人赌博，高级知识分子中也有人赌博。赌博中有些人是女性，而抢劫犯中有些人是赌博者。\n由此可以推出：","options":{"A":"高级知识分子中也有抢劫犯","B":"抢劫犯中赌博者占了大多数","C":"有些抢劫犯可能是女性","D":"有些抢劫犯不是女性"},"answer":"C","explanation":"第一步：翻译题干。\n①有的娱乐圈的人\u003cimg data-k=\"2dfb7d1f72f3\">赌博\n②有的高级知识分子\u003cimg data-k=\"2dfb7d1f72f3\">赌博\n③有的赌博者\u003cimg data-k=\"2dfb7d1f72f3\">女性\n④有的抢劫犯\u003cimg data-k=\"2dfb7d1f72f3\">赌博\n第二步：逐一分析选项。\nA项：翻译为“有的高级知识分子\u003cimg data-k=\"2dfb7d1f72f3\">抢劫犯”，根据条件②和条件④，两个“有的”推不出必然结论，不能推出，排除；\nB项：由条件④可知有些抢劫犯也是赌博者，但是赌博者是否占了大多数，无法判断，排除；\nC项：由条件③和条件④可以推出：有些抢劫犯是赌博者，而赌博者中有女性，所以有些抢劫犯中可能有女性，可以推出，当选；\nD项：由条件③和条件④可以推出C项中“有些抢劫犯可能是女性”的结论，但不能得到确定结论抢劫犯不是女性，无法推出，排除。\n故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"2670605","cat":"逻辑判断","stem":"中华鲟是我国特有的珍稀鱼类，也是世界上洄游距离最远、体型最大的淡水鱼类之一，它们一生大部分时间都是在海洋里度过的。在葛洲坝截流前，性成熟的中华鲟会洄游至长江上游与金沙江下游进行产卵交配。目前，中华鲟野生种群仍在持续衰退，为此，有人将中华鲟的濒危完全归咎于葛洲坝的建设。\n以下哪项如果为真，最不能削弱上述观点？","options":{"A":"葛洲坝没有修建过鱼设施，因为中华鲟作为大型的底层鱼，极难找到鱼道入口，也几乎不可能通过鱼道上游，且中华鲟生育后需要重返大海，而鱼道既不能让亲鱼上行，也无法使产后的亲鱼下行，对保护中华鲟毫无帮助","B":"长江非中华鲟唯一的繁殖地带，直到20世纪70年代，珠江中还能偶见中华鲟，并且有中华鲟分布于金沙江、钱塘江、黄河等的记录","C":"据观测，葛洲坝工程1981年完成大江截流后，中华鲟在坝下形成了新的产卵场，且长江口的幼鱼数量在20世纪八九十年代仍保持基本稳定，直到2000年才开始出现明显下降趋势","D":"长江中只有中华鲟需要从大海洄游至葛洲坝上游地区繁殖，大部分鱼类仅在长江干支流生活，或做短距离的洄游，但从渔获量来看，这些不受大坝截流影响的鱼类，它们的数量也在大幅下降"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：中华鲟的濒危完全归咎于葛洲坝的建设。\n论据：在葛洲坝截流前，性成熟的中华鲟会洄游至长江上游与金沙江下游进行产卵交配。目前，中华鲟野生种群仍在持续衰退。\n本题论点是因为葛洲坝的建设导致了中华鲟的濒危，论据是葛洲坝截流，中华鲟野生种群仍在持续衰退。二者都认为葛洲坝建设危害了中华鲟，论点论据话题一致。\n第二步：逐一分析选项。\nA项：该项说明葛洲坝既不能让亲鱼上行，也无法使产后的亲鱼下行，即葛洲坝的建设确实对中华鲟造成了不利影响，属于加强项，不能削弱，当选；\nB项：该项说明中华鲟的繁殖地带有很多，所以中华鲟的濒危不能完全归咎于葛洲坝的建设，可以削弱，排除；\nC项：该项说明葛洲坝工程完成大江截流后，长江口的幼鱼数量在20世纪八九十年代仍保持基本稳定，直到2000年才开始出现明显下降趋势，则意味着中华鲟的濒危与葛洲坝的建成没有直接关系，可以削弱，排除；\nD项：不受大坝截流影响的鱼类，它们的数量也在大幅下降，说明可能是其他外部原因导致中华鲟及其他鱼类的数量都整体下降，因此中华鲟的濒危不能完全归咎于葛洲坝的建设，属于可能性削弱，排除。\n本题为选非题，故正确答案为A。","no":70,"missingImage":false},{"type":"question","qid":"4695845","cat":"类比推理","stem":"前不久，网上流行一种说法，称中国疫苗接种非常落后，还在用减毒活疫苗，而国外十几年前就全部改成灭活疫苗了，安全性好太多了。\n假设下列论述为真，哪些有助于推翻上述说法？\n①有的疫苗只有减毒活疫苗，国内外都在用，例如卡介苗。\n②有的疫苗国内外用的都是灭活疫苗，例如流感疫苗。\n③有的疫苗国内外用的都不是减毒活疫苗，例如破伤风疫苗。\n④有的疫苗既有减毒活疫苗也有灭活疫苗，例如流脑疫苗。","options":{"A":"①②","B":"①②③","C":"①②④","D":"①②③④"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：中国疫苗接种非常落后，还在用减毒活疫苗，而国外十几年前就全部改成灭活疫苗了，安全性好太多了。\n论据：无。\n本题只有论点，没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\n①指出有的疫苗只有减毒活疫苗，国内外都在用，说明国外也在用减毒活疫苗，并没有都改成灭活疫苗，削弱论点；\n②指出有的疫苗国内外用的都是灭活疫苗，说明国内也在用灭活疫苗，不是只用减毒活疫苗，削弱论点；\n③指出有的疫苗国内外用的都不是减毒活疫苗，说明国内不是只用减毒活疫苗，削弱论点；\n④指出有的疫苗既有减毒活疫苗也有灭活疫苗，但并未提及国内外具体的使用情况，与论点话题不一致，无法削弱。\n综上所述，①②③均能够削弱题干论点，对应B项。\n故正确答案为B。","no":71,"missingImage":false},{"type":"question","qid":"2670610","cat":"逻辑判断","stem":"美国三位传播学者在1970年提出了“知识沟假设”，认为随着大众传媒向社会传播的信息日益增多，处于不同社会经济地位的人获得媒介知识的速度是不同的，社会经济地位较高的人将比社会经济地位较低的人以更快的速度获取这类信息。因此，这两类人之间的知识差距将呈扩大之势。\n对上述“知识沟假设”能够做出合理解释的不包括：","options":{"A":"社会经济地位较高的人往往受教育程度高，具有更强的信息处理能力，这会有助于他们对知识的获取","B":"在特定的时间范围内，经媒介大量报道的话题上，人们获取信息和知识的速度与受教育程度有着很高的相关性","C":"传播有一定深度的科学知识的媒介主要是印刷媒介，它们的受众主要是社会经济地位较高的人","D":"社会经济地位较高的人日常交际圈更大，能参与更多的社会团体，拥有更多与他人进行深度讨论的机会，理解和接受知识的能力更强"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：社会经济地位较高与社会经济地位较低这两类人之间的知识差距将呈扩大之势。\n论据：随着大众传媒向社会传播的信息日益增多，处于不同社会经济地位的人获得媒介知识的速度是不同的，社会经济地位较高的人将比社会经济地位较低的人以更快的速度获取这类信息。\n本题论点和论据话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说明社会经济地位较高的人因具有更强的信息处理能力会有助于对知识的获取，通过解释原因补充了论据，可以加强，排除；\nB项：该项说明获取信息和知识的速度与受教育程度有相关性，但并没有说明社会经济地位较高和社会经济地位较低的这两类人之间的知识差距将呈扩大之势，无关选项，无法加强，当选；\nC项：该项说明社会经济地位较高的人更容易获取有一定深度的科学知识，通过解释原因补充了论据，可以加强，排除；\nD项：该项说明社会经济地位较高的人理解和接受知识的能力更强，通过解释原因补充了论据，可以加强，排除。\n本题为选非题，故正确答案为B。","no":72,"missingImage":false},{"type":"question","qid":"4695853","cat":"类比推理","stem":"这是一段专家关于人工智能和人类的对话：\n雷·科兹威尔：当下仍然不知道机器能否思考，虽然人工智能能够执行程序非常复杂的任务，其精确度和速度都超过了人类，但它缺少人类智力的灵活特征。\n尼古拉斯·汤普森：人类不需要更复杂的人工智能来知道机器能否思考，因为人类是机器，我们自己思考。\n尼古拉斯·汤普森对雷·科兹威尔的反驳是基于哪个词语的重新理解？","options":{"A":"人工智能","B":"思考","C":"机器","D":"复杂"},"answer":"C","explanation":"第一步：分析题干条件。\n雷·科兹威尔：当下仍然不知道机器能否思考，虽然人工智能能够执行程序非常复杂的任务，其精确度和速度都超过了人类，但它缺少人类智力的灵活特征。\n尼古拉斯·汤普森：人类不需要更复杂的人工智能来知道机器能否思考，因为人类是机器，我们自己思考。\n第二步：逐一分析选项。\n雷·科兹威尔认为当下不知道机器能否思考，人工智能也无法验证，其中的“机器”指的是传统意义上的由部件组装成的装置；而尼古拉斯·汤普森认为人类能思考，且人类是机器，说明机器能够思考，对“机器”进行了重新理解，从而反驳了雷·科兹威尔的观点，对应C项。\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"4695859","cat":"逻辑判断","stem":"近年来，虽然全球主要国家甲状腺癌的发生率都在增加，但并不代表甲状腺癌与碘营养状况之间存在关系。\n以下哪项最可能是上述结论所假设的？","options":{"A":"当前甲状腺癌的“流行”部分归因于甲状腺筛查的普及","B":"高分辨率B超的广泛应用使得隐匿癌或微小癌能够被准确诊断","C":"这些甲状腺癌发生率增加的国家，既有碘摄入量增加的，也有稳定或下降的","D":"近20年来美国、英国等西方发达国家居民的碘营养状况趋于稳定"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：近年来，虽然全球主要国家甲状腺癌的发生率都在增加，但并不代表甲状腺癌与碘营养状况之间存在关系。\n论据：无。\n本题只有论点，没有论据，且问题为“假设”，优先考虑必要条件。\n第二步：逐一分析选项。\nA项：该项说的是甲状腺癌“流行”的部分原因，而论点说的是甲状腺癌与碘营养状况的关系，话题不一致，无法加强，排除；\nB项：该项说的是隐匿癌或微小癌能够被准确诊断，无法判断是否包括甲状腺癌，与论点无关，排除；\nC项：该项说的是甲状腺癌发生率增加的国家，碘摄入量情况不同，证明了甲状腺癌与碘营养状况之间不存在关系，且如果各国碘摄入量变化情况相同，就能够得到甲状腺癌与碘摄入量存在关系，此时论点无法成立，即该项是论点成立的必要条件，当选；\nD项：该项说的是近20年来西方发达国家居民的碘营养状况趋于稳定，但没有提及这些居民甲状腺癌发生率的变化，不明确项，无法加强，排除。\n故正确答案为C。","no":74,"missingImage":false},{"type":"question","qid":"2670612","cat":"逻辑判断","stem":"甲、乙、丙是大学同班同学，且同住一室。其中，一个北京人，一个重庆人，一个上海人。甲和重庆人不同岁，丙的年龄比上海人小，重庆人比乙年龄大。\n根据题干所述，可以推出以下哪项结论？","options":{"A":"甲是北京人，乙是重庆人，丙是上海人","B":"甲是重庆人，乙是北京人，丙是上海人","C":"甲是重庆人，乙是上海人，丙是北京人","D":"甲是上海人，乙是北京人，丙是重庆人"},"answer":"D","explanation":"本题为组合排列题型，从最大信息入手。\n题干中“重庆人”出现次数最多。结合“甲和重庆人不同岁”，可知甲不是重庆人，排除B、C两项。再结合“重庆人比乙年龄大”，可知乙不是重庆人，排除A项。\n故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"4695868","cat":"逻辑判断","stem":"美国从事安全工作的承包商在一些安卓手机上发现了一款来自中国公司的预装软件，这种软件监视用户去过哪里、与什么人聊过天、短信中写了什么。美国当局认为这是一种收集情报的行为。\n以下哪项如果为真，最能够质疑美国当局的判断？","options":{"A":"软件是预装在手机上的，但没有向用户披露这种监视功能","B":"该软件监视用户上述行为的目的是帮助客户识别垃圾短信和骚扰电话","C":"分析师注意到安装有该软件的手机在向位于上海的一个服务器发送短信内容","D":"谷歌官员表示，公司曾告诫该中国公司将该软件的监视功能删除"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：“预装软件监视用户去过哪里、与什么人聊过天、短信中写了什么”是一种收集情报的行为。\n论据：无。\n本题只有论点没有论据，削弱优先考虑削弱论点，即指出预装软件对用户的监视并不是为了收集情报。\n第二步：逐一分析选项。\nA项：是否告知用户与该预装软件监视用户的目的无关，为无关项，无法削弱，排除；\nB项：指出该预装软件对用户的监视是为了帮助客户识别垃圾短信和骚扰电话，而不是为了收集情报，削弱论点，可以削弱，当选；\nC项：指出安装有该软件的手机在向上海的服务器发送短信内容，但无法判断发送的目的，无法削弱，排除；\nD项：谷歌官员的表态与该预装软件监视用户的目的无关，为无关项，无法削弱，排除。\n故正确答案为B。","no":76,"missingImage":false},{"type":"question","qid":"4695905","cat":"逻辑判断","stem":"小冰期是自末次冰盛期以来地球气温最低的一段时期，一般指1430-1850年间，高潮部分发生在1600年左右，其间北半球气温相比于基准温度（现在的温度）下降了\u003cimg data-k=\"27176e2f0257\">。小冰期的成因有多种假说。近年来，有学者认为其成因为欧洲对美洲的殖民导致美洲本土农业社会崩溃，大量农田被废弃为森林，从而固定了太多大气中的二氧化碳，最终导致气候变冷。\n假设下列陈述为真，那么，最有可能驳斥上述假说的是：","options":{"A":"能够造成二氧化碳浓度下降的森林面积，经推算远大于美洲原住民在工业化之前能够开垦的森林面积","B":"北美洲的大部分原住民是在18世纪中叶英法七年战争的时候才受到严重影响的","C":"南美洲在16世纪中后期爆发了几次严重疫情，原住民损失惨重","D":"气温变化与二氧化碳浓度之间并不是简单的线性对应关系"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：小冰期的成因为欧洲对美洲的殖民导致美洲本土农业社会崩溃，大量农田被废弃为森林，从而固定了太多大气中的二氧化碳，最终导致气候变冷。\n论据：无。\n本题只有论点，没有论据，削弱优先考虑削弱论点，即指出欧洲对美洲的殖民不会导致气候变冷。\n第二步：逐一分析选项。\nA项：指出美洲原住民在工业化之前能够开垦的森林面积远低于能够造成二氧化碳浓度下降的森林面积，说明即使殖民让原住民废弃所有开垦的农田，且这些农田也都变成了森林也不足以造成二氧化碳的浓度下降，也就不会导致气候变冷，削弱论点，当选；\nB项：指出北美洲的大部分原住民在18世纪受到了战争的严重影响，而题干讨论的是殖民、森林、二氧化碳以及气候变冷间的关系，话题不一致，无法削弱，排除；\nC项：指出南美洲的原住民在16世纪中后期因疫情损失惨重，而题干讨论的是殖民、森林、二氧化碳以及气候变冷间的关系，话题不一致，无法削弱，排除；\nD项：指出气温变化与二氧化碳浓度之间并不是简单的线性对应关系，但二者之间是否存在其他关系无法判断，可能是其他形式的影响关系，不明确项，无法削弱，排除。\n故正确答案为A。","no":77,"missingImage":false},{"type":"question","qid":"2670614","cat":"类比推理","stem":"厂家：展销会","options":{"A":"旅客：黄金周","B":"演员：颁奖礼","C":"阿姨：广场舞","D":"企鹅：南极圈"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n厂家参加展销会，构成主宾关系，且展销会的目的就是展览与销售，以目的命名。\n第二步：判断选项词语间逻辑关系。\nA项：游客享受黄金周，二者为主宾关系，但黄金周指的是我国五一、十一、春节的休息时间与前后双休日拼接形成的假期，并非以目的命名，与题干逻辑关系不一致，排除；\nB项：演员参加颁奖礼，二者为主宾关系，且颁奖礼的目的就是颁奖，以目的命名，与题干逻辑关系一致，当选；\nC项：阿姨跳广场舞，二者为主宾关系，但广场舞是以跳舞的地点命名，不是以目的命名，与题干逻辑关系不一致，排除；\nD项：企鹅生活在南极圈，南极圈是以地点命名，不是以目的命名，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":78,"missingImage":false},{"type":"question","qid":"2670616","cat":"类比推理","stem":"音箱：家庭影院","options":{"A":"青霉素：抗生素","B":"网管：门户网站","C":"叔父：旁系亲属","D":"食肉动物：食物链"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n音箱是家庭影院的组成部分，二者为包容关系中的组成关系。\n第二步：判断选项词语间逻辑关系。\nA项：青霉素是一种抗生素，二者为包容关系中的种属关系，与题干逻辑关系不一致，排除；\nB项：网管负责管理门户网站，二者为对应关系，与题干逻辑关系不一致，排除；\nC项：叔父是一种旁系亲属，二者为包容关系中的种属关系，与题干逻辑关系不一致，排除；\nD项：食肉动物是食物链的组成部分，二者为包容关系中的组成关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"2670618","cat":"类比推理","stem":"救助：燃眉之急","options":{"A":"诉说：难言之隐","B":"诬陷：欲加之罪","C":"慰问：丧子之痛","D":"避免：无妄之灾"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n救助能减轻燃眉之急，二者为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：难言之隐是指隐藏在内心深处不便说出口的事情，诉说不能减轻难言之隐，与题干逻辑关系不一致，排除；\nB项：欲加之罪是指随心所欲的诬陷人，诬陷并不能减轻欲加之罪，与题干逻辑关系不一致，排除；\nC项：慰问能减轻丧子之痛，二者为对应关系，与题干逻辑关系一致，当选；\nD项：无妄之灾是指平白无故受到的灾祸或损害，是不能避免的，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":80,"missingImage":false},{"type":"question","qid":"2670621","cat":"逻辑判断","stem":"林黛玉：心似比干多一窍，病如西子胜三分","options":{"A":"李商隐：君问归期未有期，巴山夜雨涨秋池","B":"杜甫：随风潜入夜，润物细无声","C":"陈胜：燕雀安知鸿鹊之志哉","D":"李广：但使龙城飞将在，不教胡马度阴山"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“心似比干多一窍，病如西子胜三分”是《红楼梦》中描述林黛玉的话，二者为对应关系，且是他人描述林黛玉。\n第二步：判断选项词语间逻辑关系。\nA项：“君问归期未有期，巴山夜雨涨秋池”出自李商隐的《夜雨寄北》，描述的是巴蜀环境而非李商隐，与题干逻辑关系不一致，排除；\nB项：“随风潜入夜，润物细无声”出自杜甫的《春夜喜雨》，描述的是春夜降雨、润泽万物的美景，而不是描述杜甫，与题干逻辑关系不一致，排除；\nC项：“燕雀安知鸿鹊之志哉”描述的是陈胜的远大志向，但这是陈胜自己说出的话，不是他人来描述陈胜，与题干逻辑关系不一致，排除；\nD项：“但使龙城飞将在，不教胡马度阴山”出自王昌龄的《出塞二首》，其中“飞将”指的就是李广，是王昌龄对李广的描述，与题干逻辑关系一致，当选。\n故正确答案为D。","no":81,"missingImage":false},{"type":"question","qid":"2670626","cat":"类比推理","stem":"消费者 对于 （    ） 相当于 （    ） 对于 调查","options":{"A":"促销 问题","B":"纠纷 干扰","C":"维权 记者","D":"反映 结果"},"answer":"C","explanation":"逐一代入选项。\nA项：消费者可能会参加促销，两者为对应关系；调查问题，两者为动宾关系，前后逻辑关系不一致，排除；\nB项：消费者可能会有纠纷，两者为对应关系；调查可能会有干扰，两者为对应关系，但二者顺序反了，前后逻辑关系不一致，排除；\nC项：消费者有维权的权利，两者为对应关系；记者有调查的权利，两者为对应关系，前后逻辑关系一致，当选；\nD项：消费者和反映之间没有必然的逻辑关系；调查可能会有结果，两者为对应关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":82,"missingImage":false},{"type":"question","qid":"2670631","cat":"类比推理","stem":"造纸术 对于 （    ） 相当于 端砚 对于 （    ）","options":{"A":"印刷术 司南","B":"火药 印章","C":"指南针 湖笔","D":"造纸 宣纸"},"answer":"C","explanation":"逐一代入选项。\nA项：造纸术和印刷术都是中国古代四大发明，二者是并列关系；端砚与司南无明显逻辑关系，前后逻辑关系不一致，排除；\nB项：造纸术和火药都是中国古代四大发明，二者是并列关系；印章是一种用作印于文件上表示鉴定或签署的文具，与端砚是并列关系，前后逻辑关系一致，保留；\nC项：造纸术和指南针都是中国古代四大发明，二者是并列关系；端砚和湖笔都是文房四宝，二者是并列关系，前后逻辑关系一致，保留；\nD项：造纸术的功能是造纸，二者是对应关系；端砚和宣纸都是文具，二者是并列关系，前后逻辑关系不一致，排除。\n对比B项和C项，B项印章和端砚仅是文具中的并列关系，而C项端砚和湖笔是文具并且是文房四宝中的并列关系，与前面四大发明逻辑关系更一致，因此C项更符合。\n故正确答案为C。","no":83,"missingImage":false},{"type":"question","qid":"2670636","cat":"类比推理","stem":"机械唯物主义 对于 （    ） 相当于 （    ） 对于 生物学家","options":{"A":"唯物主义者 宇宙大爆炸","B":"哲学家 自然选择","C":"辩证唯物主义 细胞学","D":"地质学家 板块漂移说"},"answer":"B","explanation":"逐一代入选项。\nA项：机械唯物主义由唯物主义者提出，二者为理论与提出者之间的对应关系；宇宙大爆炸不是由生物学家提出，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nB项：机械唯物主义由哲学家提出，二者为理论与提出者之间的对应关系；自然选择由生物学家提出，二者为理论与提出者之间的对应关系，前后逻辑关系一致，当选；\nC项：机械唯物主义和辩证唯物主义二者为并列关系；细胞学由生物学家提出，二者为理论与提出者之间的对应关系，前后逻辑关系不一致，排除；\nD项：机械唯物主义不是由地质学家提出，二者无明显逻辑关系；板块漂移说不是由生物学家提出，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":84,"missingImage":false},{"type":"question","qid":"2670640","cat":"类比推理","stem":"PM2.5：能见度","options":{"A":"\u003cimg data-k=\"bc62204aa7ed\">：气温","B":"民心：获得感","C":"CPI：物价","D":"脂肪：卡路里"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\nPM2.5是影响能见度的一个因素，二者为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：\u003cimg data-k=\"bc62204aa7ed\">是影响气温的一个因素，二者为对应关系，与题干逻辑关系一致，当选；\nB项：获得感是影响民心的一个因素，但二者顺序反了，与题干逻辑关系不一致，排除；\nC项：CPI是消费者物价指数，是反映物价的一个指标，不是影响物价的一个因素，与题干逻辑关系不一致，排除；\nD项：卡路里是一种热量单位，脂肪产生的能量单位是卡路里，不是影响卡路里的一个因素，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":85,"missingImage":false},{"type":"question","qid":"2670642","cat":"类比推理","stem":"歌曲：作词：作曲","options":{"A":"钢琴曲：钢琴：钢琴家","B":"香烟：烟农：收获","C":"城市：街道：商铺","D":"诉讼：原告：被告"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n歌曲需要作词和作曲，二者与歌曲为对应关系，且作词与作曲为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：钢琴与钢琴家不是并列关系，是职业与工具的对应关系，与题干逻辑关系不一致，排除；\nB项：烟农与收获不是并列关系，与题干逻辑关系不一致，排除；\nC项：街道和商铺是城市的组成部分，后两个词与第一个词是组成关系，与题干逻辑关系不一致，排除；\nD项：诉讼需要原告和被告，第一个词与后两个词之间是对应关系；且原告与被告为并列关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"2670644","cat":"类比推理","stem":"工人：农民：公民","options":{"A":"学生：老师：学校","B":"冰箱：橱柜：家电","C":"硬盘：显卡：电脑","D":"图书：期刊：出版物"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n工人与农民是并列关系，且工人和农民都是公民，前两个词与第三个词是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：学生和老师是并列关系，但学校只是学生和老师学习、工作的场所，不是种属关系，与题干逻辑关系不一致，排除；\nB项：冰箱和橱柜是并列关系，且冰箱是一种家电，但橱柜并不是一种家电，与题干逻辑关系不一致，排除；\nC项：硬盘和显卡是并列关系，且二者都是电脑的组成部分，与题干逻辑关系不一致，排除；\nD项：图书和期刊是两种不同类型的出版物，二者是并列关系，且前两个词与第三个词为种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":87,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"91dfddd37166\" style=\"max-width:650px\">\u003c/p>\u003cp>\u003cimg data-k=\"4d02da8ce54b\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"2669872","cat":"增长","stem":"2013-2016年，人均GDP增长率最高的一年是：","options":{"A":"2013年","B":"2014年","C":"2015年","D":"2016年"},"answer":"A","explanation":"根据题干“·····人均GDP增长率最高的一年是”，可判定本题为一般增长率比较问题。定位表1
