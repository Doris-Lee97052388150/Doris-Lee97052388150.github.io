<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">行测真题模拟考场<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>
<div class="toast" id="toast"></div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",imgBase:"",papers:[{"slug":"2019-重庆-法检","title":"2019年重庆市法检系统招录考试《行测》题（网友回忆版）","year":"2019","group":"重庆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2423270","cat":"新思想","stem":"党的十九大报告深刻总结了过去五年所取得的历史性成就，其中提出：“开放型经济新体制逐步健全，对外贸易、对外投资、外汇储备稳居世界前列。”下列属于开放型经济新体制成果的是：","options":{"A":"中国稀土出口额占据全世界的一半以上","B":"中国公民出境旅游人数稳居世界第一位","C":"中国是120多个国家和地区的最大贸易伙伴","D":"《财富》世界500强中，中国企业的数量最多"},"answer":"C","explanation":"本题考查政治常识。党的十八届三中全会对全面深化改革做出系统部署，强调“构建开放型经济新体制”。开放型经济的主要特征是：要素、商品与服务在不同国家之间自由流动，从而实现全球范围内的最优资源配置和最高经济效率。作为开放型经济体的国家必须尽可能充分地参加国际分工，同时在国际分工中发挥出本国经济的比较优势。构建开放型经济新体制，必须建立健全适合开放型经济发展、参与国际分工与竞争的组织机构和法律法规，涵盖组织体制、程序体制、管理体制以及与之配套的法律法规等诸多方面。\nA项错误，构建开放型经济新体制要求实施质量效益导向型的外贸政策。该项中，稀土出口属于初级资源类对外贸易，且在开放型经济新体制之前即大量存在，不属于开放型经济新体制成果。\nB项错误，中国公民出境旅游人数稳居第一，体现了我国人民财富得到不断积累，出国旅游人员多，并非开放型经济新体制的成果。\nC项正确，构建开放型经济新体制要求加快实施自由贸易区战略。现如今中国已成为120多个国家和地区的最大贸易伙伴，这是开放型经济新体制的成果。\nD项错误，《财富》世界500强中，中国企业的数量最多，说明我国企业不断壮大，实力雄厚，并未体现开放型经济。\n故正确答案为C。","no":1,"missingImage":false},{"type":"question","qid":"2423273","cat":"新思想","stem":"2013年秋天，习近平总书记提出共建“一带一路”的倡议。经过夯基垒台、立柱架梁的6年，共建“一带一路”正在向落地生根、持久发展的阶段迈进。下列属于实施共建“一带一路”倡议内容的是：","options":{"A":"大力倡导构建人类命运共同体","B":"举办二十国集团领导人杭州峰会","C":"发起创办亚洲基础设施投资银行","D":"推动达成应对气候变化的《巴黎协定》"},"answer":"C","explanation":"本题考查政治常识。“一带一路”是“丝绸之路经济带”和“21世纪海上丝绸之路”的简称，2013年9月和10月由中国国家主席习近平分别提出建设“新丝绸之路经济带”和“21世纪海上丝绸之路”的合作倡议。\nA项错误，2012年11月，中共十八大明确提出：“要倡导人类命运共同体意识，在追求本国利益时兼顾他国合理关切”，人类命运共同体这一全球价值观包含相互依存的国际权力观、共同利益观、可持续发展观和全球治理观。\nB项错误，二十国集团领导人杭州峰会于2016年9月4-5日在中国杭州举办的，这也是二十国集团领导人举办的第十一次峰会。G20峰会是一个国际经济合作论坛，属于非正式对话的一种机制，由原八国集团以及其余12个重要经济体组成，我国也是G20的重要成员，它不属于我国主导的“一带一路”倡议的内容。\nC项正确，亚洲基础设施投资银行，简称亚投行，是一个政府间性质的亚洲区域多边开发机构，成立宗旨是为了促进亚洲区域的建设互联互通化和经济一体化的进程，并且加强中国及其他亚洲国家和地区的合作，是实施“一带一路”战略后由中国倡议设立的多边金融机构。\nD项错误，《巴黎协定》是2015年12月12日在巴黎气候变化大会上通过、2016年4月22日在纽约签署的气候变化协定，该协定为2020年后全球应对气候变化行动作出安排。《巴黎协定》是继1992年《联合国气候变化框架公约》、1997年《京都议定书》之后，人类历史上应对气候变化的第三个里程碑式的国际法律文本，形成2020年后的全球气候治理格局。《巴黎协定》并非是中国实施“一带一路”战略而倡导的内容。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"2423284","cat":"新思想","stem":"习近平总书记指出：“生态文明建设事关中华民族永续发展和‘两个一百年’奋斗目标的实现，保护生态环境就是保护生产力，改善生态环境就是发展生产力。”下列不属于党的十八大以来生态文明建设举措的是：","options":{"A":"中共中央国务院印发《关于加快推进生态文明建设的意见》","B":"中央全面深化改革委员会审议通过《天然林保护修复制度方案》","C":"国务院批准实施《青海三江源国家生态保护综合试验区总体方案》","D":"国务院印发《关于支持福建省深入实施生态省战略加快生态文明先行示范区建设的若干意见》"},"answer":"C","explanation":"本题考查政治。党的十八大于2012年11月8日在北京人民大会堂隆重召开。\nA项正确，2015年5月5日，新华社受权播发了中共中央、国务院印发《关于加快推进生态文明建设的意见》，这是继党的十八大和十八届三中、四中全会对生态文明建设作出顶层设计后，中央对生态文明建设的一次全面部署。\nB项正确，2019年7月，中共中央办公厅、国务院办公厅印发了《天然林保护修复制度方案》。方案指出，天然林是森林资源的主体和精华，是自然界中群落最稳定、生物多样性最丰富的陆地生态系统。全面保护天然林，对于建设生态文明和美丽中国、实现中华民族永续发展具有重大意义。\nC项错误，2011年11月16日，国务院第181次常务会议批准实施《青海三江源国家生态保护综合试验区总体方案》，标志着三江源生态保护和经济社会发展进入了一个新的阶段。\nD项正确，2014年3月10日，国务院正式印发《关于支持福建省深入实施生态省战略加快生态文明先行示范区建设的若干意见》，福建省成为党的十八大以来国务院确定的全国第一个生态文明先行示范区。\n本题为选非题，故正确答案为C。","no":3,"missingImage":false}],"count":3,"answerable":3,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2423287","cat":"法律常识","stem":"下列关于我国宪法修正的说法错误的是：","options":{"A":"宪法宣誓制度在2018年宪法修正案中得到修改","B":"自我国宪法颁布以来，共公布了五次宪法修正案","C":"2018年宪法修正案中首次明确全国人大设立宪法和法律委员会","D":"宪法的修改须由全国人民代表大会全体代表三分之二以上通过"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国宪法修正案》2018年版第四十条规定：“宪法第二十七条增加一款，作为第三款：‘国家工作人员就职时应当依照法律规定公开进行宪法宣誓。’”宪法宣誓制度是在2018年修正案中设立，而非修改。\nB项正确，我国于1988年、1993年、1999年、2004年和2018年五次公布了《中华人民共和国宪法修正案》，对《中华人民共和国宪法》进行修改。\nC项正确，根据《中华人民共和国宪法修正案》2018年版第四十四条规定，宪法第七十条第一款中“全国人民代表大会设立民族委员会、法律委员会、财政经济委员会、教育科学文化卫生委员会、外事委员会、华侨委员会和其他需要设立的专门委员会。”修改为：“全国人民代表大会设立民族委员会、宪法和法律委员会、财政经济委员会、教育科学文化卫生委员会、外事委员会、华侨委员会和其他需要设立的专门委员会。”因此，宪法和法律委员会是在2018年宪法修正案中首次明确设立。\nD项正确，根据《宪法》第六十四条第一款规定：“宪法的修改，由全国人民代表大会常务委员会或者五分之一以上的全国人民代表大会代表提议，并由全国人民代表大会以全体代表的三分之二以上的多数通过。”\n本题为选非题，故正确答案为A。","no":4,"missingImage":false},{"type":"question","qid":"2423294","cat":"人文常识","stem":"下列不属于推进农业现代化措施的是：","options":{"A":"大规模推进高标准农田建设","B":"实施山水林田湖生态保护和修复工程","C":"将职业农民培育纳入国家教育培训发展规划","D":"突出抓好在城镇就业的农业转移人口落户工作"},"answer":"D","explanation":"本题考查政治。\nA项正确，《中国农业现代化规划（2016-2020)》指出创新是农业现代化的第一动力，必须着力推进供给创新、科技创新和体制机制创新，加快实施藏粮于地、藏粮于技战略和创新驱动发展战略，培育更健康、更可持续的增长动力。增强粮食等重要农产品安全保障能力，大规模推进高标准农田建设。\nB项正确，《中国农业现代化规划（2016-2020)》指出绿色是农业现代化的重要标志，必须牢固树立绿水青山就是金山银山的理念，推进农业发展绿色化，补齐生态建设和质量安全短板，实现资源利用高效、生态系统稳定、产地环境良好、产品质量安全。推进资源保护和生态修复，加强林业和湿地资源保护。\nC项正确，《中国农业现代化规划（2016-2020)》指出加快构建新型职业农民队伍。加大农村实用人才带头人、现代青年农场主、农村青年创业致富“领头雁”和新型经营主体带头人培训力度，到“十三五”末，实现新型经营主体带头人轮训一遍。将新型职业农民培育纳入国家教育培训发展规划，鼓励农民采取“半农半读”等方式就近地接受职业教育。\nD项错误，突出抓好在城镇就业的农业转移人口落户工作是由农村户口转移到城市户口，是民生问题，与农业现代化无关。\n本题为选非题，故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"2423295","cat":"人文常识","stem":"为发展中国家走向现代化贡献中国智慧和中国方案不包括：","options":{"A":"以平等互信为基础，坚持走和平发展的道路","B":"以开放促发展，主动参与和推动经济全球化进程","C":"以经济发展为核心，把消除贫困、改善民生放在首位","D":"以执政党建设为统领，为国家发展和民族振兴提供保障"},"answer":"A","explanation":"本题考查政治。\nA项错误，坚持走和平发展的道路是政治道路，与走向现代化贡献中国智慧和方案无关。\nB项正确，改革开放以来中国的伟大成就表明，开放发展是正确的战略抉择。当前，在西方保护主义趋势愈加明显之际，中国作为全球化和自由贸易区的坚定捍卫者，通过“一带一路”和自由贸易区等建设，不断推动建设更加开放的世界经济，引领经济全球化向更加包容普惠的方向发展，值得其他国家借鉴。\nC项正确，经济腾飞一直以来都被国际社会认为是中国特色社会主义道路最显著的成功标志。改革开放以来，中国就确立了以经济建设为中心的发展战略，切实把推动发展、消除贫困、改善民生放在首位。党的十八大以来，中国深入贯彻以人民为中心的发展思想，提出精准扶贫政策，6000多万贫困人口稳定脱贫，贫困发生率从\u003cimg data-k=\"17a98a3a09dd\">下降到\u003cimg data-k=\"0cea19887188\">以下。中国探索出的成功方案为世界提供了发展经济、改善民生的有益借鉴。\nD项正确，中国特色社会主义道路之所以具有巨大优势，呈现出“风景这边独好”的强大制度自信，根本在于有中国特色社会主义事业的领导核心。作为中国特色社会主义事业的领导核心，中国共产党以总揽全局、协调各方的战略姿态，切实避免了党派政治掣肘、利益集团内耗的不良影响；作为长期执政党，中国共产党一直重视并以改革创新的精神加强党的建设，使我们党成为始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的执政党，为实现国家富强和民族振兴提供坚强保障。\n本题为选非题，故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"2423298","cat":"人文常识","stem":"关于我国地貌旅游资源，下列说法错误的是：","options":{"A":"重庆老瀛山是典型的丹霞地貌","B":"敦煌魔鬼城属于雅丹地貌群落","C":"桂林的七星岩是典型的岩溶洞穴","D":"华山为著名的石英砂岩峰林地貌"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，老瀛山，位于重庆市綦江区境内。老瀛山是一个独特的山脉，遍布山上的丹霞地貌，赢得了重庆“红色处女地”的美誉。老瀛山面积不大，只有20多平方公里（海拔800米以上的面积），但是它平畴突起，陡峭险峻，其气势磅礴而壮观，古有“山盘四十八面险，云暗三百六旬秋”之说。\nB项正确，敦煌魔鬼城是指敦煌雅丹的俗称，位于新疆、甘肃交界处，距玉门关西北80余公里处，是一座典型的雅丹地貌群落。它土质坚硬，呈浅红色，与青色的戈壁滩形成了强烈的对比，在蓝天白云的映衬下格外引人注目，整个雅丹地貌布局有序、造型奇特、是一座罕见的天然雕塑博物馆。\nC项正确，七星岩位于广西桂林市，隋唐称栖霞洞，宋代称仙李岩、碧虚岩，位于桂林七星公园内普陀山腹，东西贯通。七星岩是石灰岩发育较完全，保护较完好的地下宫殿。洞内石乳、石笋、石柱、石幔、石花，是典型的喀斯特岩溶洞穴。\nD项错误，砂岩峰林峡谷地貌是由石英砂岩所构成的山地形成的，砂岩因地壳大幅度的上升成为丘陵山地，又经漫长的雨河水冲刷，成为砂岩峰林，而被风化侵蚀掉的那部分砂岩变成了泥沙，被流水重新带回大海，形成了许多纵横交织的峡谷。华山古称“西岳”，为中国著名的五岳之一，它是典型的花岗岩峰林地貌。花岗岩峰林地貌主要发育在高差的山区，多由岩株状的花岗岩体组成，花岗岩岩石裸露，岩体内多组断裂和节理发育，受冰川或流水强烈切断和风化侵蚀后形成了雄伟高耸的奇峰深壑。因此，华山是花岗岩峰林地貌，而不是砂岩峰林峡谷地貌。\n本题为选非题，故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"2423299","cat":"人文常识","stem":"关于我国寺庙，下列说法正确的是：","options":{"A":"拉卜楞寺属于藏传佛教寺院","B":"洛阳白马寺建于西汉年间","C":"少林寺位于南岳嵩山之上","D":"飞来峰是大昭寺的著名景点"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，拉卜楞寺，位于甘肃省甘南藏族自治州夏河县。拉卜楞寺是藏语“拉章”的变音，意思为活佛大师的府邸。是藏传佛教格鲁派六大寺院之一，被世界誉为“世界藏学府”， 拉卜楞寺保留有全国最好的藏传佛教教学体系。\nB项错误，白马寺位于河南省洛阳市老城以东12公里，洛龙区白马寺镇内。创建于东汉永平十一年（公元68年），中国第一古刹，世界著名伽蓝，是佛教传入中国后兴建的第一座官办寺院，有中国佛教的“祖庭”和“释源”之称。\nC项错误，少林寺是中国佛教禅宗祖庭和中国功夫的发源地，位于河南省郑州市登封市嵩山五乳峰下，因坐落于嵩山腹地少室山茂密丛林之中，故名“少林寺”。嵩山始称“中岳嵩山”；而南岳是指衡山。\nD项错误，飞来峰，又名灵鹫峰，飞来峰山高168米，山体由石灰岩构成。飞来峰面朝灵隐寺的山坡上，遍布五代以来的佛教石窟造像，多达三百四十余尊，为我国江南少见的古代石窟艺术瑰宝。而大昭寺位于拉萨老城区中心，是一座藏传佛教寺院，是藏王松赞干布建造。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"2423301","cat":"科技常识","stem":"关于南北极，下列说法错误的是：","options":{"A":"南极长城站可进行卫星多普勒观测","B":"南极拥有地球一半以上的淡水资源","C":"我国自主研发的无人冰站已经成功在北极布放","D":"沿北极圈顺时针依次经过加拿大、格陵兰岛、俄罗斯"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，长城站的科研功能是多样的，不仅可以从事气象观测、固体潮观测，还可以进行卫星多普勒观测、地震观测等多种观测项目。多普勒观测基本原理是利用多普勒频移与信号源和接收机的相对位移关系，通过观测即可获得信号源与接收机的相对位移，进而达到对测站进行定位和导航的目的。\nB项正确，南极洲\u003cimg data-k=\"04556babf3ab\">以上的面积常年被冰雪覆盖，占全球冰雪总量的\u003cimg data-k=\"98d1a3adb731\">以上，储存了全世界约\u003cimg data-k=\"ab1d29cfd57c\">的可用淡水。\nC项正确，中国第9次北极科学考察队成功在北极海域布放海-冰-气无人冰站观测系统并完成信号测试。该系统完全由我国自主研发集成，将在北冰洋中心区域就大气、积雪、海冰、上层海洋等多要素开展长期无人值守在线观测，并为国际北极观测网建设提供核心装备。\nD项错误，沿北极圈顺时针方向依次经过加拿大、俄罗斯、格陵兰岛。\n\u003cimg data-k=\"f10f7afbaeda\" style=\"max-width:700px\">\n本题为选非题，故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"2423303","cat":"地理国情","stem":"关于文物遗址，下列说法错误的是：","options":{"A":"太阳神鸟金饰出土于新疆楼兰遗址","B":"重庆古城墙是古代山地城池防御建筑的范例","C":"甘肃马家塬遗址分布有大面积齐家类型的文化遗存","D":"高昌故城遗址反映了多民族文化在吐鲁番盆地的交流"},"answer":"A","explanation":"本题考查历史常识。\nA选项错误，太阳神鸟金饰（亦称“四鸟绕日”金饰），是2001年出土于四川省成都市金沙遗址的一张金箔，属商代晚期作品。\nB选项正确，城池的兴建起于防御功能，南宋末期的重庆城作为山城防御体系的核心和指挥中心，其城墙筑造蕴含了“道法自然”的营建思想和“山、水、城”合一的规划设计，是古代山地城池防御建筑的杰出代表和范例。\nC选项正确，齐家文化遗址，主要分布在甘肃、青海两省境内的黄河、洮河、大夏河、渭河、湟水流域。马家塬遗址位于甘肃省天水市张家川回族自治区木河乡桃园村马家塬，分布有大面积属常山、齐家类型的文化遗存。\nD选项正确，高昌故城是吐鲁番盆地中心城镇，历经西汉高昌壁、高昌郡、高昌国、唐代西州和高昌回鹘等时期，时间跨度长达1400年左右，故城的结构分布、城内壁画、塑像展示的文化风貌都体现了多民族文化在吐鲁番盆地的融合。\n本题为选非题，故正确答案为A。","no":10,"missingImage":false},{"type":"question","qid":"2423278","cat":"人文常识","stem":"关于我国海洋国土，下列说法错误的是：","options":{"A":"北纬36度线经过了我国东海海域","B":"朝鲜和越南既与我国相邻又隔海相望","C":"渤海和黄海全部位于大洋边缘的大陆架上","D":"三沙市下辖西沙群岛、中沙群岛、南沙群岛"},"answer":"A","explanation":"本题考查地理国情。\nA项错误，黄海和东海的分界线是长江口北岸的启东角与韩国济州岛西南角的连线。北纬36度线经过的是我国黄海海域。\nB项正确，朝鲜是我国的陆上邻国，又隔渤海和我国相望；越南是我国的陆上邻国，又隔南海与我国隔海相望。\nC项正确，渤海是深入我国大陆的近封闭型的一个浅海，仅通过东面的渤海海峡与黄海相沟通，其北、西、南三面均被陆地所包围；黄海是全部位于大陆架上的一个半封闭的浅海。在我国近海四个海区中，渤海和黄海全部位于大洋边缘的大陆架上。\nD项正确，三沙市于 2012年7月24日正式揭牌成立，隶属海南省，管辖西沙群岛、中沙群岛、南沙群岛的岛礁及其海域。是我国位置最南、面积最大、陆地面积最小及人口最少的地级市。\n本题为选非题，故正确答案为A。","no":11,"missingImage":false},{"type":"question","qid":"2423279","cat":"人文常识","stem":"下列诗词与所描述的地区对应错误的是：","options":{"A":"渭城朝雨浥轻尘，客舍青青柳色新——咸阳","B":"羌笛何须怨杨柳，春风不度玉门关——张掖","C":"钟山风雨起苍黄，百万雄师过大江——南京","D":"玉露凋伤枫树林，巫山巫峡气萧森——重庆"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，出自唐代王维的《送元二使安西》。渭城指咸阳，即秦代咸阳古城，位于陕西省西安市西北方。\nB项错误，出自唐代王之涣的《凉州词二首•其一》。玉门关，汉武帝置，因西域输入玉石取道于此而得名。故址在今甘肃敦煌西北小方盘城,是古代通往西域的要道。因此，该诗所描述的地区对应的是敦煌，而不是张掖。\nC项正确，出自毛泽东的《七律•人民解放军占领南京》。1949年，中华大地发生了翻天覆地的巨变。人民解放军取得了辽沈、淮海、平津三大战役的胜利。百万雄师以摧枯拉朽之势强渡长江，占领了国民党中央政府所在地南京。\nD项正确，出自唐代杜甫的《秋兴八首•其一》。巫山巫峡：即指夔州（今奉节）一带的长江和峡谷，位于今重庆市。\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"2423280","cat":"人文常识","stem":"关于大气污染，下列说法正确的是：","options":{"A":"臭氧可吸收紫外线，不属于污染物","B":"口罩中的活性炭只会吸附污染气体","C":"火山喷发所产生的气体会加剧大气的污染","D":"燃放烟花爆竹有污染，但不增加PM2.5值"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，由于分子结构使其可以与某种特定能量的紫外线发生共振，因此臭氧可以吸收紫外线。臭氧是一种环境空气的污染物，在近地面层空气中超过一定含量，会对环境产生影响、对人体健康导致危害。\nB项错误，活性炭具有很强的吸附性能，能在它的表面上吸附气体、液体或胶态固体，对于气体、液体，吸附物质的质量可接近于活性炭本身的质量。口罩中的活性炭主要是吸附污染气体的，它还可以吸附一些液体或胶态固体。\nC项正确，火山喷发的有毒气体中含有硫磺和氯气，形成酸雨、昏暗的白昼和狂风暴雨，甚至会困扰当地居民长达数月之久，如果被喷到高空中去，它们就会随风散布到很远的地方。这些火山物质会遮住阳光，导致气温下降，农作物减产，严重的将导致物种灭绝，因此，火山喷发产生的气体会加剧大气的污染。\nD项错误，鞭炮和烟花的化学成分很复杂，主要是硝酸钾、木炭和硫磺。被引燃后，这些物质便发生一系列复杂的化学反应，产生二氧化碳、一氧化碳、二氧化硫、一氧化氮、二氧化氮等气体以及PM2.5等污染物，同时产生大量光和热而引起鞭炮爆炸。\n故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"2423281","cat":"人文常识","stem":"关于处方药，下列说法错误的是：","options":{"A":"不可自行购买和使用","B":"催眠安定药不属于处方药","C":"不良反应发生率较高","D":"须在医生指导下服用药物"},"answer":"B","explanation":"本题考查科技常识。处方药就是必须凭执业医师或执业助理医师处方才可调配、购买和使用的药品；而非处方药则不需要凭医师处方即可自行判断、购买和使用的药品。\nA项正确，根据《处方管理办法》第四条第二款规定：“处方药应当凭医师处方销售、调剂和使用。”处方药不能自行购买和使用。\nB项错误，安眠药是精神药品，经营此类药品，必须由县以上卫生行政部门指定，其他任何单位和个人均不得经营。现在到药店购买安眠药，一定要出示医生处方。因此，安眠药属于处方药。\nC项正确，处方药一般不良反应发生概率较大，有一定的治疗风险，需要在医生评估过用药风险和健康收益后再决定是否使用。\nD项正确，处方药必须凭执业医师开具的处方才可以调配、购买，并且要在医生、护士、药师及其他医疗专业人员的监督和指导下才可使用，处方药不能凭自己判断使用。\n本题为选非题，故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"2423282","cat":"科技常识","stem":"关于生活常识，下列说法错误的是：","options":{"A":"胆囊B超、尿常规检查均需空腹进行","B":"装修时使用铜线成本高，但电损耗低","C":"复方甘草片中含有容易使人成瘾的成分","D":"葡萄表面附着的白霜是一种糖醇类物质"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，胆囊属于肝胆系统，检查肝胆系统必须空腹，因为一旦进食后胆汁分泌会导致胆囊充盈，胆管扩张，不能充分客观反应胆道系统是否有问题；尿常规检查不需要空腹，但是要注意外阴清洁，在检查之前最好是冲洗外阴，消毒尿道口，用无菌试管留取中段尿送检。\nB项正确，铜线载流量大、电压损失低、电损耗低、价格高。\nC项正确，复方甘草片含有阿片粉或罂粟果提取物粉等容易上瘾的成分，一般食用复方甘草片最好是不要超过五天，避免形成药物依赖。\nD项正确，葡萄表面的“白霜”是葡萄本身分泌的糖醇类物质，被称为果粉，对人体无害。\n本题为选非题，故正确答案为A。","no":15,"missingImage":false},{"type":"question","qid":"2423285","cat":"科技常识","stem":"关于生命的起源与进化，下列说法正确的是：","options":{"A":"越古老的地层中的生物结构越复杂","B":"原始哺乳类是由某些古代鸟类进化而来","C":"新生代中占优势的陆地植物是裸子植物","D":"澄江生物群为寒武纪生命大爆发提供了证据"},"answer":"D","explanation":"本题考查科技常识。\nA项错误，越古老的地层中的生物结构越简单、越低等，水生生物越多；越晚期的地层中的生物结构越复杂、越高等，陆生生物越多。这说明生物进化的趋势是：从简单到复杂，由低等到高等，从水生到陆生。\nB项错误，在地球上最早出现的脊椎动物是古代的鱼类，并逐渐进化为原始的两栖类，古两栖类又进化为爬行类，某些爬行类又进化为古代的鸟类和哺乳类。所以，鸟类和哺乳类都是由古代的爬行类进化而来的。\nC项错误，新生代是地球历史上最新的一个地质时代，由于板块的分离或聚合，气候的分化，使得被子植物迅速发展、广泛分布。新生代以被子植物占优势。\nD项正确，1984年7月1日，在国际上被誉为“20世纪最惊人的发现之一”的“澄江生物群”，在云南省澄江县首次被发现，这一多门类动物化石群动物类型众多，且十分珍稀地保存了动物软体构造，首次栩栩如生地再现了远古海洋生命的壮丽景观和现生动物的原始特征，以丰富的生物学信息为“寒武纪大爆发”研究提供了直接证据。\n故正确答案为D。","no":16,"missingImage":false},{"type":"question","qid":"2423286","cat":"人文常识","stem":"关于天文现象，下列说法错误的是：","options":{"A":"反气旋过境时，常会带来晴朗、干燥的天气","B":"“日中无影”现象常出现在南北回归线之间","C":"火星地表土为一种酸性土壤，因此呈橘红色","D":"大气层中平流层的温度会随高度增加而增高"},"answer":"C","explanation":"本题考查地理国情。\nA项正确，反气旋，又称高压，是水平中心气压比四周高的空气涡旋。反气旋过境时常常多晴朗、干燥天气，如长江流域的伏旱、北方“秋高气爽”的天气等。\nB项正确，“日中无影”是指当天上的太阳日光正垂直于地面时，人或者其他物体站在太阳之下是没有影子的现象。在南北回归线之间的地区，一年有两次太阳直射机会，此时正午太阳高度最大为90°，因而会出现“日中无影”现象。\nC项错误，火星土壤是指火星岩石受风化后产生的碎屑物质，其中含铁量较地球土壤高，尤以氧化铁的含量最高。火星呈现出橘红色的外表就是因为地表含有大量的氧化铁。\nD项正确，自对流层顶至50—55公里的高空为平流层。平流层内水汽和尘埃稀少，基本上无云雨天气，因其是地球大气层里上热下冷的一层，所以温度随着高度的增加而上升。\n本题为选非题，故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"2423288","cat":"法律常识","stem":"下列精神损害赔偿不予支持的是：","options":{"A":"甲被人殴打致重伤二级，其提出刑事附带民事诉讼要求精神损害赔偿","B":"乙被错误逮捕，后案件被撤销，乙在申请国家赔偿的同时要求精神损害赔偿","C":"丙父去世后，其仇人散布谣言侮辱其父名誉，丙诉至法院要求精神损害赔偿","D":"丁保留的与其生母唯一一张合影被人恶意损毁，丁诉至法院要求精神损害赔偿"},"answer":"A","explanation":"A项正确，《最高人民法院关于适用&lt;中华人民共和国刑事诉讼法&gt;的解释》第一百七十五条规定：“被害人因人身权利受到犯罪侵犯或者财物被犯罪分子毁坏而遭受物质损失的，有权在刑事诉讼过程中提起附带民事诉讼；被害人死亡或者丧失行为能力的，其法定代理人、近亲属有权提起附带民事诉讼。因受到犯罪侵犯，提起附带民事诉讼或者单独提起民事诉讼要求赔偿精神损失的，人民法院一般不予受理。”甲提起刑事附带民事诉讼不得要求精神损害赔偿。\nB项错误，《国家赔偿法》第十七条规定：“行使侦查、检察、审判职权的机关以及看守所、监狱管理机关及其工作人员在行使职权时有下列侵犯人身权情形之一的，受害人有取得赔偿的权利：······（二）对公民采取逮捕措施后，决定撤销案件、不起诉或者判决宣告无罪终止追究刑事责任的；······”第三十五条规定：“有本法第三条或者第十七条规定情形之一，致人精神损害的，应当在侵权行为影响的范围内，为受害人消除影响，恢复名誉，赔礼道歉；造成严重后果的，应当支付相应的精神损害抚慰金。”乙被错误逮捕可以提出精神损害赔偿金的要求。\nC项错误，《最高人民法院关于确定民事侵权精神损害赔偿责任若干问题的解释》第三条规定：“死者的姓名、肖像、名誉、荣誉、隐私、遗体、遗骨等受到侵害，其近亲属向人民法院提起诉讼请求精神损害赔偿的，人民法院应当依法予以支持。”丙提出的精神损害赔偿应予支持。\nD项错误，《最高人民法院关于确定民事侵权精神损害赔偿责任若干问题的解释》第一条规定：“因人身权益或者具有人身意义的特定物受到侵害，自然人或者其近亲属向人民法院提起诉讼请求精神损害赔偿的，人民法院应当依法予以受理。”丁与生母唯一的一张合影是具有人身意义的特定物，因此提出的精神损害赔偿应予支持。\n故正确答案为A。","no":18,"missingImage":false},{"type":"question","qid":"2423290","cat":"人文常识","stem":"某超市为顾客提供免费寄存服务。一日超市顶上商户水管漏水，水淹到低层寄存柜，致王某放在柜中的手机进水损坏。对此，下列说法正确的是：","options":{"A":"超市有过失，应当承担全部赔偿责任","B":"漏水属不可抗力，超市不承担赔偿责任","C":"超市系无偿保管且无重大过失，不予赔偿","D":"主要责任在漏水商户，超市承担部分赔偿责任"},"answer":"C","explanation":"本题考查法律常识。《民法典》第八百九十七条规定：“保管期内，因保管人保管不善造成保管物毁损、灭失的，保管人应当承担赔偿责任。但是，无偿保管人证明自己没有故意或者重大过失的，不承担赔偿责任。”本题中，王某手机进水损坏是因超市顶上商户水管漏水而致，超市无重大过失，且超市系免费提供寄存服务，不承担损害赔偿责任。因此，ABD项不符合题意。\n故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"2423292","cat":"法律常识","stem":"根据我国《立法法》，下列说法正确的是：","options":{"A":"设区的市制定的地方性法规须报省政府备案","B":"省人大常委会须对地方性法规的合法性进行审查","C":"设区的市制定的地方性法规，其立法主体为市政府","D":"经省人大常委会授权后，设区的市才能制定地方性法规"},"answer":"B","explanation":"本题考查法律常识。《立法法》第七十二条第二款规定：“设区的市的人民代表大会及其常务委员会根据本市的具体情况和实际需要，在不同宪法、法律、行政法规和本省、自治区的地方性法规相抵触的前提下，可以对城乡建设与管理、环境保护、历史文化保护等方面的事项制定地方性法规，法律对设区的市制定地方性法规的事项另有规定的，从其规定。设区的市的地方性法规须报省、自治区的人民代表大会常务委员会批准后施行。省、自治区的人民代表大会常务委员会对报请批准的地方性法规，应当对其合法性进行审查，同宪法、法律、行政法规和本省、自治区的地方性法规不抵触的，应当在四个月内予以批准。”\nA项错误，设区的市制定的地方性法规无须报省政府备案，须报省、自治区的人民代表大会常务委员会批准后施行。\nB项正确，省、自治区的人民代表大会常务委员会对报请批准的地方性法规，应当对其合法性进行审查。\nC项错误，设区的市的人民代表大会及其常务委员会是制定地方性法规的主体。因此，该项表述中立法主体为市政府不符合题意。\nD项错误，设区的市的人民代表大会及其常务委员会根据本市的具体情况和实际需要制定地方性法规，须报省、自治区的人民代表大会常务委员会批准后施行。因此，制定无需经省人大常委会授权。\n故正确答案为B。","no":20,"missingImage":false}],"count":17,"answerable":17,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2423263","cat":"逻辑填空","stem":"学会质疑并养成质疑的习惯，关键就是多读书、读好书，一旦知识积累多了，视野开阔了，就容易对相关知识的学习理解做到      。革命导师列宁曾说过，不懂黑格尔的全部逻辑学就不能完全理解马克思的《资本论》。事实上，许多知识都有着纵横关联，只有打通其关节，一些疑问才能迎刃而解。\n填入划横线部分最恰当的一项是：","options":{"A":"触类旁通","B":"举一反三","C":"事半功倍","D":"独出己见"},"answer":"A","explanation":"分析文意可知，横线前面，“就容易对相关知识的学习做到”，横线后面“不懂黑格尔的全部逻辑学就不能完全理解马克思的《资本论》”，“许多知识都有着纵横关联，只有打通其关节，一些疑问才能迎刃而解”都在说明对某一知识的学习能够对其他知识的学习有帮助，对应A项，“触类旁通”比喻掌握了某一事物的规律，就能推知同类事物，符合文意，当选。\nB项，“举一反三”指从懂得的一点，类推而知道其它的，从含义上和“触类旁通”是近义词，只不过从文段内容呼应上，文中“只有打通其关节，一些疑问才能迎刃而解”此处“触类旁通”更好；\nC项，“事半功倍”指做事得法，因而费力小，收效大；\nD项，“独出己见”指的是与别人不同地提出自己的见解和主张，二者含义均和文段不符，文中侧重强调对其他知识的作用，排除。\n故正确答案为A。\n【文段出处】《质疑，是读书的长跑》","no":21,"missingImage":false},{"type":"question","qid":"2423264","cat":"逻辑填空","stem":"1955年我进入南开大学历史学系读书，老师告诉我们治史有“三求”：求真、求新、求用。到现在，我在史学园地已经耕耘60多年，对“三求”有了一些自己的体会，特别是认识到，学术研究不能照搬照抄、跟在别人后面      ，而应在独立思考精神观照下进行研究，这样才有可能实现“三求”。\n填入划横线部分最恰当的一项是：","options":{"A":"傍人门户","B":"邯郸学步","C":"穿凿附会","D":"亦步亦趋"},"answer":"D","explanation":"由横线前面出现的顿号可知表达并列关系，横线处所填成语和“照搬照抄”的含义相近，同时，横线后面出现关联词“而”，这里的“而”表达转折关系，转折前后含义相反，转折后重在强调“独立思考精神”，那么横线处含义也要与“独立思考”相反，综合前后对应D项，“亦步亦趋”比喻由于缺乏主张，或为了讨好，事事模仿或追随别人，符合文意，当选。\nA项，“傍人门户”比喻依赖别人，不能自立，侧重于依赖性，与文意无关，排除；\nB项，“邯郸学步”比喻模仿人不到家，反把原来自己会的东西忘了，文中并没有体现出把原来自己会的东西忘了这一含义，与文意不符，排除；\nC项，“穿凿附会”把讲不通的或不相干的道理、事情硬扯在一起进行解释。和文中“一味模仿、不会创新”无关，排除。\n故正确答案为D。\n【文段出处】《人民日报大家手笔：治史应求真求新求用》","no":22,"missingImage":false},{"type":"question","qid":"2423265","cat":"逻辑填空","stem":"为了迎合家长急于求成的心理需求，不少美术类培训机构纷纷带孩子参加各类绘画大赛和少儿绘画考级活动。这必然是      的做法，绘画是人们认识和感受世界，表达个人情绪和看法的一种方式，是培养孩子对现实世界的认知能力。作为家长，不要急于让孩子出成果、获大奖，而应该      孩子用更加丰富的手段认识世界。\n依次填入划横线部分最恰当的一项是：","options":{"A":"拔苗助长  辅助","B":"缘木求鱼  激励","C":"舍本逐末  引导","D":"得不偿失  启发"},"answer":"C","explanation":"第一空，根据前文可知，文段意在表达为了迎合家长急于求成的心理需求，一些美术类培训机构采取了不恰当的做法，且根据后文“绘画是培养孩子对现实世界的认知能力”可知，让孩子学习绘画的本意应为培养能力而非考级，故横线处应体现出培训机构的做法违背了让孩子学习绘画的本意。\nC项“舍本逐末”比喻做事不注意根本，而只抓细微末节，“本”即对应“培养能力”，“末”即对应“考级”，符合文意，当选；\nA项“拔苗助长”比喻违反事物发展的客观规律，急于求成反而坏事，文段虽然可以体现出急于求成之意，但并未体现出让事情变坏之意，故与文意不符，排除；\nB项“缘木求鱼”比喻方向不对，不可能达到目的，文段虽然可以体现出方法错误之意，但并未论述达不到目的，并非必然无法出成果获奖，与文意不符，排除；\nD项“得不偿失”指所得的利益抵偿不了所受的损失，文中并未体现出损失之意，排除。\n第二空代入验证，横线处体现家长对孩子的做法。C项“引导”有指引、带领之意，符合文意，当选。\n故正确答案为C。\n【文段出处】《艺术只能“培训”吗》","no":23,"missingImage":false},{"type":"question","qid":"2423266","cat":"逻辑填空","stem":"德国科学家和科学政策制定者的      意识在德国科技强国之路上扮演了极为重要的角色。当处于落后地位时，虚心向比自己发达的国家学习；而当处于领先地位时，又      ，克服内外压力，精益求精，从不满足，才使得德国的科研体制永葆活力，长盛不衰。\n依次填入划横线部分最恰当的一项是：","options":{"A":"忧患  未雨绸缪","B":"责任  高瞻远瞩","C":"创新  革故鼎新","D":"风险  如履薄冰"},"answer":"A","explanation":"第一空，横线处搭配“意识”，且根据 “处于落后的地位时，虚心向比自己发达的国家学习”及“处于领先地位时，克服内外压力，精益求精”可知，文段意在表达德国会考虑到当前及未来可能会遇到的困难、祸患。\nA项“忧患”及D项“风险”均与“意识”搭配得当，且能体现出对当前或未来祸患的考虑，保留；B项“责任”、C项“创新”均无法体现出会考虑到当前及未来可能会遇到的困难、祸患之意，与文意不符，故排除B、C两项。\n第二空，根据“克服内外压力，精益求精，从不满足”可知，横线处所填词语应体现出德国好上还要求更好，不满足于现状，对未来有不懈的追求之意。\nA项，“未雨绸缪”意为天还没有下雨，先修缮房屋、门窗，比喻事先做好准备工作，可以体现出德国不满足现状，对未来有不懈的追求之意，符合文意，当选；D项，“如履薄冰”比喻行事极为谨慎，存有戒心，无法与文段对应，排除。\n故正确答案为A。\n【文段出处】《持续不间断地推进科研体制创新》","no":24,"missingImage":false},{"type":"question","qid":"2423267","cat":"逻辑填空","stem":"很多人都喜欢将自己眼中的世界分门别类，并用固有的认知打上标签。这种“刻板印象”的存在，确实在某种程度上提高了我们的认知      ，但也将我们的思维框定到已有的版图中，周边世界千变万化，而我们却在熟悉的境地里      、停滞不前。\n依次填入划横线部分最恰当的一项是：","options":{"A":"层次  泥足深陷","B":"水平  闭门造车","C":"效率  固步自封","D":"能力  一意孤行"},"answer":"C","explanation":"第一空，横线处所填词语和“提高”搭配，四个选项均可填入文段中。\n第二空，横线后出现顿号，故横线处所填词语与“停滞不前”构成并列关系，含义相近，“停滞不前”强调停止下来，不继续前进。C项“固步自封”比喻守着老一套，不求进步，体现出“不前进”的含义，符合文意，当选。\nA项“泥足深陷”比喻陷入麻烦的境地却无法轻易脱离或陷于某件事已不能自拔，“陷入麻烦”与“不继续前进”侧重点不一致，且该词语程度过重，排除；\nB项“闭门造车”强调不考虑客观实际情况，只凭主观想法办事，与“停滞不前”无法构成近义并列，排除；\nD项“一意孤行”指不接受别人的劝告，顽固地按照自己的主观想法去做，与“停滞不前”语义相反，排除。\n故正确答案为C。\n【文段出处】《光明时评：我学计算机的，但真不会修电脑，谢谢》","no":25,"missingImage":false},{"type":"question","qid":"2423269","cat":"逻辑填空","stem":"要实现从数据大国向数据强国转变，满足我国经济社会全面数字化转型对高质量海量多源异构数据资源的迫切需求，数据的“盘活”是我们面临的一大难题。所谓“盘活”，关键是要解决数据      、流通、      的问题。“流水不腐，户枢不蠹。”只有不同系统、不同领域的数据实现大范围的流通与融合，才能实现多源数据的融合分析，从而赋予人类观察事物的全方位视角。\n依次填入划横线部分最恰当的一项是：","options":{"A":"整理  加工","B":"确权  安全","C":"获取  应用","D":"开放  共享"},"answer":"D","explanation":"依据后文“流水不腐、户枢不蠹”以及“不同领域的数据实现大范围的流通与融合”可知横线上所填词语要体现出流动、流转的含义。\nA项“整理”为整理合并的含义，体现不出“流动、流转”的语义，排除；\nB项“确权”强调确认某事物的权属，将某物确定为自己的东西，与“流转”含义相反，排除；\nC项“获取”含义为获得，取得，与“流转”语义不一致，排除；\nD项“开放”强调敞开，也就是允许事物进出，与文意相符，故选该项。\n将第二空代入验证，“共享”含义为共同享有，既然一个事物为多方共同享有，说明该事物是能够流转的，符合文意。\n故正确答案为D。\n【文段出处】《人民日报整版探讨“如何建设智慧社会”》","no":26,"missingImage":false},{"type":"question","qid":"2423272","cat":"逻辑填空","stem":"自然资源并非是取之不尽、用之不竭的。现在，大自然被过度开发，因此保护自然迫在眉睫，而保护观念的改变则是      。以前，我们觉得保护动物就要把动物从自然里拿出来，放在一个我们      提供的很好的环境中来保护，但结果      。只有依赖自然环境和生态系统才能真正保护好生物多样性。\n依次填入划横线部分最恰当的一项是：","options":{"A":"万全之策  精心  适得其反","B":"当务之急  统一  一败涂地","C":"重中之重  单独  事与愿违","D":"大势所趋  专门  南辕北辙"},"answer":"C","explanation":"第一空，搭配“保护观念”，并根据前文可知，横线体现保护观念的改变对于保护自然很重要。\nA项“万全之策”指最完全最好的办法，观念的改变并不能完全解决大自然被过度开发的问题，还需要付诸行动，且表述绝对，所以“万全之策”填入横线处不符合文意，排除A项。B项“当务之急”指当前急切应办的要事，C项“重中之重”强调重要性，D项“大势所趋”指整个局势发展的趋向，均可体现出保护观念改变的重要性，保留。\n第三空，根据后文“只有依赖自然环境和生态系统才能真正保护好生物多样性”可知，横线处应体现出结果不理想之意。C项“事与愿违”指事情的发展与愿望相反，符合文意，当选。B项“一败涂地”形容彻底失败，用于此处程度过重，排除；D项“南辕北辙”指行动和目的地完全相反，搭配“行动”和“目的地”，而横线处搭配“结果”，排除。\n第二空，代入验证，“单独”提供的很好的环境中来保护，符合文意，当选。\n故正确答案为C。\n【文段出处】《用大数据推动生物多样性研究》","no":27,"missingImage":false},{"type":"question","qid":"2423274","cat":"逻辑填空","stem":"长期以来，如何准确      贫困学生和资助对象，始终是资助工作有效、精准开展的难题。为此，不少高校      。如让学生填写家庭经济收入情况、自述家贫等。这些做法既伤害了学生的自尊心，也无法保障资助工作的      界定。而如今大数据手段的运用，为破解这一难题带来了曙光。\n依次填入划横线部分最恰当的一项是：","options":{"A":"识别  煞费苦心  科学","B":"判断  推陈出新  真实","C":"分辨  深谋远虑  客观","D":"鉴定  绞尽脑汁  专业"},"answer":"A","explanation":"本题可从第二空入手，横线后的“如”可知，后文“让学生填写家庭经济收入情况、自述家贫等”是对所填内容的举例说明。\nB项“推陈出新”指去掉旧事物的糟粕，取其精华，并使它向新的方向发展。所举例子并无去掉旧的对策，采用新对策之意，排除；\nC项“深谋远虑”指计划得很周密，考虑得很长远；后文的例子体现不出此意，排除；\nA项“煞费苦心”与D项“绞尽脑汁”均指用尽心思，填入文段符合语境，均保留。\n第三空，之前一些高校采取的“让学生填写家庭经济收入情况、自述家贫等”方式与如今采用的“大数据手段”进行对比，强调了之前的方式不恰当，这体现的是之前方式的“不科学性”，而不是“不专业”，排除D项。\n验证第一空，“识别”贫困学生和资助对象，搭配恰当。\n故正确答案为A。\n【文段出处】《“隐形资助”的有形张力》","no":28,"missingImage":false},{"type":"question","qid":"2423275","cat":"逻辑填空","stem":"量子保密通信从量子力学不确定性原理和量子态不可克隆定理出发，从      上保证了保密性，即通信双方能够检测到窃听者的存在并采取相应的措施。这是由量子物理的基本原理所      的，因为观察或者测量一个量子系统均会造成量子态的扰动，造成可以检测出的      ，从而可以提醒通信双方泄密。\n依次填入划横线部分最恰当的一项是：","options":{"A":"根本  推导  错误","B":"基础  体现  异动","C":"源头  保障  结果","D":"理论  保证  反常"},"answer":"D","explanation":"第一空，根据前文“不确定性原理”与“量子态不可克隆定理”可知，横线处体现“原理、定理”之意，观察选项，D项“理论”最符合文意，其他三项均不能表达此意，排除；答案基本锁定为D项。\n第二空，代入验证，横线处所填词语对应前文“保证了保密性”，D项“保证”符合文意。\n第三空，代入验证，根据前文“造成……扰动”和后文“提醒通信双方泄密”可知，横线处所填词语应表达和平时情况不同之意，D项“反常”符合文意，当选。\n故正确答案为D。\n【文段出处】《“墨子号”卫星亮绝技 量子通信概念脉动》","no":29,"missingImage":false},{"type":"question","qid":"2423277","cat":"逻辑填空","stem":"进入新世纪以来，新诗与旧体诗有各执一端、      的倾向。一些新诗人强调新诗的自由，自由到谁都看不懂的程度。而有些旧体诗人特别是有些刊物又过分强调格律，不得越雷池一步。他们虽然也同意“求正容变”，但实行起来却只求正、不容变。究其原因，都是正确创作方向的      。\n依次填入划横线部分最恰当的一项是：","options":{"A":"背道而驰  丧失","B":"格格不入  放弃","C":"分道扬镳  迷失","D":"分崩离析  背离"},"answer":"C","explanation":"第一空，通过横线前文“、”可知，此处与“各执一端”构成并列的关系，“各执一端”指各自坚持各自的观点或道理，D项“分崩离析”形容国家、集团或组织分裂瓦解，与文段搭配对象“新诗与旧体诗”搭配不当，排除；其他三项均可，均能体现两者之间各走各的之意。\n第二空，搭配“方向”，“迷失方向”为惯用搭配，故锁定答案为C项。A项“丧失”指失去，与“方向”搭配不当，且程度过重，排除；B项“放弃”指抛弃，丢掉，可以搭配“财产”等，与“方向”搭配有误。\n故正确答案为C。\n【文段出处】《新诗与旧体诗都应与时代同行》","no":30,"missingImage":false},{"type":"question","qid":"2423293","cat":"逻辑填空","stem":"让机器人听懂人说话，并不容易。机器要能够      识别语音并像人一样通过理解判断作出回应，需要基于大量的“学习”，与人一样根据      进行判断预测。这种“学习”有两种方法：通过在数据中找寻类似事例来提供解决方案，或是通过       许多数据样本的共性来对这件事情做出判断。\n依次填入划横线部分最恰当的一项是：","options":{"A":"准确  经验  归纳","B":"完整  信息  识别","C":"高效  知识  提炼","D":"自动  思维  总结"},"answer":"A","explanation":"第一空，根据“让机器人听懂人说话······”可知，文段强调“听懂”，故横线处强调机器能够识别语音，进而听懂人话的过程。A项“准确”指正确，B项“完整”指完好无损，“准确识别”“完整识别”都是能够“听懂”人话所必须的，符合文意；D项“自动”指自己主动，符合机器的特点，保留。C项“高效”指效率高，文段没有强调机器识别语音必须效率高，排除。\n第二空，横线处需体现出“像人一样”。A项“经验”指从多次实践中得到的知识或技能，人能够根据经验来进行判断预测，符合文意；B项，根据“信息”作出反应并非人的特点，机器自身也可以根据输入的信息执行指令，作出反应，排除。D项“思维”指人脑借助于语言对客观事物的概括和间接的反应过程，是作出反应的过程，而非依据，故“根据思维”搭配不当，排除。锁定A项。\n第三空代入验证，“归纳”指由一系列具体的事实概括出一般原理的思维过程，“归纳共性”搭配得当且符合文意。\n故正确答案为A。\n【文段出处】《“说话”间，走进“人工智能+”时代 》","no":31,"missingImage":false},{"type":"question","qid":"2423302","cat":"逻辑填空","stem":"当前对于中国债务风险的很多分析，往往聚焦于中国的债务存量，较少关注到与债务相对应的资产，这在国际机构的评估中尤为      。事实上，正是由于中国政府拥有大量的存量资产且高于存量债务，才使得在应对债务风险问题上      ，任何脱离资产仅论负债的做法，对于中国债务风险的评估都是      的。\n依次填入划横线部分最恰当的一项是：","options":{"A":"重要  独当一面  狭隘","B":"突出  随心所欲  错误","C":"常见  游刃有余  片面","D":"关注  驾轻就熟  偏颇"},"answer":"C","explanation":"第一空，“这”指的是前文所述的现象，B项“突出”指明显，C项“常见”指经常见到，与前文“往往”对应，在文中指这种错误的分析方法特别普遍，符合文意。A项“重要”指具有重大影响或后果的，文段并非要指出这种错误的分析方法很重要，而是强调其普遍，排除；D项“关注”指关心重视，为动词，空缺处应填入形容词，不符合文段语法要求，排除。\n第二空，根据文段进行推断，“由于中国政府拥有大量的存量资产且高于存量债务”，所以导致中国在应对债务风险方面具有一定的实力，具备较高的容纳风险的能力。C项“游刃有余”比喻技术熟练，经验丰富，解决问题丝毫不费力。B项“随心所欲”指随着自己的意思，想要干什么就干什么，程度过重，排除。锁定C项。\n第三空代入验证，C项“片面”指不全面的，偏向某一局部的，在文中指分析的不够全面，符合文意。\n故正确答案为C。\n【文段出处】《权威解读国家资产负债表：有什么用？怎么编？》","no":32,"missingImage":false},{"type":"question","qid":"2423307","cat":"逻辑填空","stem":"实战化程度再高的对抗演习，和真正的实战都是有      的，只能无限趋近而不能划等号。实战中，作战双方是      的较量和厮杀，不可避免会有流血与伤亡；而在对抗演习中，一般是“不流血”或尽量“少流血”。如此，既要提高演习中的实战性、锤炼出实战能力，同时又要保证参训参演人员的安全，这就需要为演习制定      的对抗行动规则。\n依次填入划横线部分最恰当的一项是：","options":{"A":"抗衡  真刀实枪  灵活","B":"差距  弱肉强食  明确","C":"区别  枪林弹雨  完善","D":"距离  针锋相对  刚性"},"answer":"D","explanation":"第一空，与后文“只能无限趋近而不能划等号”对应，强调演习和实战终究不同，B项“差距”表示事物之间相差的程度，C项“区别”指区分、辨别，D项“距离”是指（两物体）在空间或时间上相隔或间隔的长度，在文中均可体现有物体之间有差异，符合文意。A项“抗衡”指对抗、匹敌，文段强调演习与实战存在不同，而非存在对抗，排除。\n第二空，用于形容“双方······的较量和厮杀”，D项“针锋相对”意思是针尖对锋芒，比喻双方在策略、论点及行动方式等方面尖锐对立，在文中可以体现战斗的激烈，符合文意。B项“弱肉强食”原指动物中弱者被强者吞食，比喻弱的被强的吞并，侧重强调自然竞争，排除。C项“枪林弹雨”用来形容激烈的战场，与“作战双方”搭配不当，排除。\n第三空，形容“对抗行动规则”，且结合前文可知，对演习而言“对抗行动规则”十分重要。D项“刚性”指不能改变或通融的，能够体现出对行动规则的要求，符合文意。\n故正确答案为D。\n【文段出处】《“刚柔并济”方能把“兵”演活》","no":33,"missingImage":false},{"type":"question","qid":"2423310","cat":"逻辑填空","stem":"每一次工业革命都会孕育出新的国际规则，第四次工业革命也不例外。但迄今为止，智能化和自动化等领域的国际规则并不      。在前三次工业革命中，发展中国家未能参与国际规则的制定，仅仅是这些规则的被动接受者。在第四次工业革命中，发展中国家应加强团结合作，积极提出符合自身发展需要的国际规则，既与发达国家开展合作，又      ，维护自身发展利益。\n依次填入划横线部分最恰当的一项是：","options":{"A":"合理  直抒己见","B":"成熟  独立自主","C":"完备  据理力争","D":"平等  各司其职"},"answer":"C","explanation":"本题从第二空入手，前文提出问题“在前三次工业革命中，发展中国家未能参与国际规则的制定，仅仅是这些规则的被动接受者”，即发展中国家没有发言权或未能充分维护自身权益，故横线处应针对问题提出对策，C项“据理力争”指依据道理，竭力维护自己方面的权益、观点等，符合文意，当选。\nA项“直抒己见”即坦率地发表自己的意见，“发表意见”与“维护权益”无必然关联，排除；\nB项“独立自主”多指国家或政党维护主权，不受别人的控制或支配，文段的问题并非主权问题，而是国际规则不利于发展中国家的问题，与语境不符，排除；\nD项“各司其职”是指各自负责掌握自己的职责，侧重解决不负责或责任不明确的问题，与不能“维护权益”无关，排除。\n代入验证第一空，C项“完备”指健全、齐全，与“国际规则”搭配得当，可选。\n故正确答案为C。\n【文段出处】《发展中国家合作的新动力》","no":34,"missingImage":false},{"type":"question","qid":"2423312","cat":"逻辑填空","stem":"说起中国历代典籍的数量，过去人们常常习惯用“      ”来形容。这既表明中华文脉之绵长、积累之深厚，也显露出我们对传世古籍的数量没有做过精准的统计，只能用一些      的语言来描述。\n依次填入划横线部分最恰当的一项是：","options":{"A":"学富五车  粗略","B":"浩如烟海  模糊","C":"汗牛充栋  平淡","D":"数不胜数  主观"},"answer":"B","explanation":"第一空，横线处形容“中国历代典籍的数量”多，B项“浩如烟海”形容文献、资料、书籍等多得无法计算；C项“汗牛充栋”形容藏书很多；D项“数不胜数”指数都数不过来，形容数量极多，很难计算；三项语义均可。A项“学富五车”形容人读书多，学识丰富，无法形容“典籍”，排除。\n第二空，根据前文“······我们对传世古籍的数量没有做过精准的统计······”，故只能用一些不精准的语言来描述，横线处表达“不精准”之意，对应B项“模糊”。C项“平淡”、D项“主观”与文意无关，排除。\n故正确答案为B。\n【文段出处】《摸清古籍家底 保护方能精准》","no":35,"missingImage":false},{"type":"question","qid":"2423314","cat":"逻辑填空","stem":"地方戏是流行于一定地区，具有地方特色的戏曲剧种的通称。浓郁的乡土气息是地方戏      的特征。不同地区的地方戏，反映的是不同地区的乡土味，体现的是当地的乡土文化与生活风貌。乡村要振兴，文化应先行。散发着浓郁乡土气息的地方戏，理应当好乡土文化的      ，为乡村振兴注入文化动能。\n依次填入划横线部分最恰当的一项是：","options":{"A":"与生俱来  表达者","B":"与众不同  先锋队","C":"独一无二  火车头","D":"得天独厚  垫脚石"},"answer":"A","explanation":"第一空，形容地方戏“乡土气息”的特征，根据下文“不同地区的地方戏，反映的是不同地区的乡土味，体现的是当地乡土文化与生活风貌”可知，地方戏的乡土气息源于当地乡土文化与生活风貌，即天然形成的，具备好的条件。\nA项“与生俱来”表示个人的特别、不可替代性，生来如此，符合文意，保留；D项“得天独厚”表示具有特殊优越的条件，多指人的资质或自然环境特别好，符合文意，保留。B项“与众不同”表示与其他人不一样；C项“独一无二”指没有相同的或没有可以相比的，侧重强调唯一性或十分稀少；两项需置于与他者比较的语境中，与文段语境不符，排除。\n第二空，A项“表达者”可对应前文“不同地区的地方戏，反映的是不同地区的乡土味，体现的是当地乡土文化与生活风貌”，语义合适，当选。D项“垫脚石”感情色彩偏消极，不符合文意，排除。\n故正确答案为A。\n【文段出处】《土味不土：地方戏如何当好乡土文化表达者》","no":36,"missingImage":false},{"type":"question","qid":"2423316","cat":"逻辑填空","stem":"随着贵金属货币演化成纸币，货币借助于信用发展出了金融产业。金融一旦成为一个产业，就可以与实体经济      ，就有了自己独立的利益，就会      赚取利润。然而，经济过度金融化以及金融业丰厚的利润会带来两方面的      后果：一方面导致资金脱实向虚，另一方面助长投机。\n依次填入划横线部分最恰当的一项是：","options":{"A":"并驾齐驱  想方设法  消极","B":"相提并论  处心积虑  被动","C":"取长补短  急功近利  严重","D":"相得益彰  不择手段  可怕"},"answer":"A","explanation":"第一空，根据文段可知，“金融一旦成为一个产业”，那么金融产业和实体经济的力量就不分高下了，也可以放在一起来看待了。\nA项“并驾齐驱”比喻彼此的力量或才能不分高下；B项“相提并论”把不同的人或不同的事放在一起谈论或看待，两者均符合题意，保留。\nC项“取长补短”指吸取别人的长处，来弥补自己的不足之处，文段并无此意，排除；D项“相得益彰”指两个人或两件事物互相配合，双方的能力和作用更能显示出来，文段并没有体现出两者之间的配合，排除。\n第二空，形容金融产业想尽一切办法赚取利润，A项“想方设法”指想种种办法，B项“处心积虑”形容蓄谋已久，两者均符合题意，保留。\n第三空，根据文段“一方面导致资金脱实向虚，另一方面助长投机”可知，这是两种不利的结果，A项“消极”指不利的，阻碍发展的，符合题意。B项“被动”指受外力推动而动或受他人的影响或牵制而发生行动，文中并无此意，排除。\n故正确答案为A。\n【文段出处】《马克思经济学对防范金融风险的启示》","no":37,"missingImage":false},{"type":"question","qid":"2423317","cat":"片段阅读","stem":"在高等教育精英化时代，高等教育在一定程度上确实是阶层流动的重要工具。但进入高等教育普及化时代后，这种刚性就业观便应逐渐向弹性就业观转型。高等教育普及化时代的主要宗旨是为各个阶层的人们在人生、事业的各个阶段提供样态更为丰富的高等教育服务，这意味着更多的大学毕业生或者家长应该把接受高等教育看成人生的一种有益的经历，或者把它作为一种丰富自我的储备。接受高等教育后也许会获得一份工作，也许不会；也许会多次更换工作，也许工作后又返回学校再接受教育······如果这个阶段还苛求高校人才培养要和每一个潜在的工作岗位一一对应，高等教育将承受不能承受之重。\n这段文字意在说明：","options":{"A":"就业观的选择必须要与社会发展相适应","B":"高等教育普及化时代的就业观应该转变","C":"高等教育推动阶层流动的功能正在消失","D":"普及高等教育会带来一定的社会负效应"},"answer":"B","explanation":"文段开篇指出高等教育的重要性，接下来用转折词“但”强调高等教育普及化时代应逐渐向弹性就业观转型，后文通过论述高等教育普及化时代的宗旨以及高等教育后就业的多元性对这一观点进行了解释说明，尾句通过反面论证进一步证明不能将高等教育培养和就业岗位一一对应。故文段结构为“\u003cimg data-k=\"bf3a7925d670\">”，重点为首句观点，即“高等教育普及化时代的就业观应该转变”，对应B项。\nA项，表述不明确，没有指出如何适应，也没有提到文段主题词“高等教育普及化时代”，排除；\nC项，无中生有，文段并没有指出“高等教育推动阶层流动的功能正在消失”，排除；\nD项，“社会负效应”无中生有，排除。\n故正确答案为B。\n【文段出处】《高等教育普及化时代的就业观须转型》","no":38,"missingImage":false},{"type":"question","qid":"2423319","cat":"片段阅读","stem":"尽管在《史记》之前，已经出现了《尚书》《春秋》《国语》，甚至出现了成熟的编年体史书《左传》，然而后世史家最崇奉的，却不是这些更古老的作品；相反，是《史记》创立的纪传体，成为历代正史的标准体例。《史记》之所以影响如此深远，除了司马迁超凡的史识和文笔之外，其创立的纪传体体例，无疑是最重要的原因之一。正如清儒章学诚所言：“自《隋·经籍志》著录，以纪传为正史，编年为古史，历代依之，遂分正附，莫不甲纪传而乙编年。”之所以如此，是因为这一体例更为全面地包罗了人类历史的诸多侧面，且适应了史学的发展。\n这段文字意在说明：","options":{"A":"纪传体体例丰富了人类历史的记录角度","B":"史书体例创新必须与史学的发展相适应","C":"《史记》创立的体例是对后世最重要的影响","D":"《史记》的纪传体体例具有重要的史学意义"},"answer":"D","explanation":"文段首句列举了一些史书，并通过“相反”进行转折，指出《史记》创立的纪传体成为历代正史的标准体例，然后指出《史记》影响之所以深远的最重要的原因之一是其创立的纪传体体例，接着通过引用清儒章学诚的观点进一步论证首句观点，尾句对纪传体体例重要的原因进行分析，指出其更为全面地包罗了人类历史的诸多侧面，且适应了史学的发展。故整个文段均围绕《史记》的纪传体体例展开，文段的主题词是“《史记》的纪传体体例”重点说明这一体例的重要史学意义，对应D项。\nA项：缺少主题词“《史记》的纪传体体例”，且“人类历史的记录角度”阐述片面，排除；\nB项：缺少主题词“《史记》的纪传体体例”，且“必须与史学的发展相适应”无中生有，文段只是提到《史记》的纪传体体例适应了史学的发展。排除；\nC项：“《史记》的体例”范围扩大，文段主要指《史记》的纪传体体例，排除。\n故正确答案为D。\n【文段出处】《“史记”与纪传体体例的史学意义》","no":39,"missingImage":false},{"type":"question","qid":"2423320","cat":"片段阅读","stem":"徜徉在中国国家博物馆，老挝出土的史前铜鼓、公元前3世纪的叙利亚组装画、公元前4世纪的沙特石雕映入眼帘，亚细亚的辉煌文明扑面而来；流连于红墙黄瓦的故宫博物院，来自“一带一路”沿线国家的艺术家们用他们的双手和智慧，将不同的文化以版画形式加以呈现······时代的前行、技术的进步、观念的更新，让博物馆的角色不断发生改变。如今，博物馆已不仅是留存文明记忆、呈现文明魅力的“全息视窗”，更是多元文化的“超级链接”、文明交流的“社交网络”。带着欣赏的目光来到博物馆，就如同走进一个气象万千的文明世界。\n最适合做这段文字标题的是：","options":{"A":"博物馆里的“一带一路”","B":"在博物馆共赏文明之美","C":"新时代博物馆的角色转变","D":"现代博物馆：多元文化之窗"},"answer":"B","explanation":"文段首先通过并列分号分别介绍了中国国家博物馆的一些历史文明，和故宫博物馆中“一带一路”沿线国家的各种文化。然后论述博物馆的角色发生了转变，不再是单一的展览，更多的作用是进行文化和文明的交流。文段最后一句总结全文，“带着欣赏的目光来到博物馆，就如同走进一个气象万千的文明世界”说明在博物馆中可欣赏到世界多元文明的美，对应B项。\nA项,“一带一路”为开篇并列句式中一个分句论述的内容，表述片面，排除；\nC项，通过反推文段可知，如果文段主要论述博物馆的角色转变，前后文应当着重对比转变前后的不同，而文中并无此意，排除；\nD项，根据文段“不仅是呈现文明魅力的全息视窗”可知，该项阐述片面，排除。\n故正确答案为B。\n【文段出处】《辛识平：在博物馆共赏文明之美》","no":40,"missingImage":false},{"type":"question","qid":"2423253","cat":"片段阅读","stem":"上世纪50年代以来，人类的需求使得塑料产量呈指数级翻倍。到了今天，即使已经意识到塑料无孔不入，人类依然对其无限依赖。目前，世界范围内每年消耗5000亿个塑料袋，每分钟有100万个塑料瓶的销量······研究显示，人类活动与垃圾排放，让大量塑料涌入海洋，其中体积大的最终会分解为微粒。而人们一度认为无比纯净的海冰中，已有数以万亿计的塑料微粒——每立方米海冰含240个塑料微粒，这一密度约是大太平洋垃圾漂浮带塑料微粒的2000倍。分析认为，北冰洋中部的塑料微粒分布非常复杂，而因海冰消融释放出的塑料微粒，将轻易“攻占”深水区域，被海洋中的滤食性动物吃掉，存留在它们体内，再经过食物链层层传递。\n这段文字主要讲的是：","options":{"A":"海洋塑料垃圾将带来严重的环境问题","B":"塑料微粒将在整个食物链中不断循环","C":"北冰洋的塑料垃圾数量超过人们的认知","D":"海洋垃圾问题需要引起人们极大的重视"},"answer":"A","explanation":"文段首先说明人类对塑料产品的依赖性，然后通过分析塑料产品的消耗、排放、等方面，来论述其对海洋和海冰造成的塑料微粒污染问题，最后通过塑料微粒进一步说明海洋塑料垃圾所带来的严重环境问题，对应A项。\nB项，缺少主题词“海洋塑料垃圾”，并且将“经过食物链层层传递”偷换为“在整个食物链中不断循环”，与文意不符，排除；\nC项，无中生有，文段没有论述“北冰洋”中塑料垃圾的数量，而是论述“海冰”中的塑料微粒超出人们认为“无比纯净”的认知，排除；\nD项，扩大概念，文段主要论述的是“海洋塑料微粒”所引起的污染问题，不是“海洋垃圾问题”，排除。\n故正确答案为A。\n【文段出处】《塑料垃圾充斥着我们的天空与海洋——人民网》","no":41,"missingImage":false},{"type":"question","qid":"2423254","cat":"片段阅读","stem":"所有燃烧燃料的飞机都会留下废气和烟尘的痕迹。在高海拔地区，水蒸气经常凝结在烟尘颗粒上，并冻结形成卷云。后者根据温度和湿度的不同，可持续几秒钟到几小时。云既能起到降温作用，也能起到增温作用。它们将一些太阳光反射回太空，但也阻挡了地球表面辐射的一些热量。平均而言，薄的自然卷云和尾迹都有净变暖效应。科学家利用一种大气计算机模型，估算了飞机尾迹在2006年引起多大程度的变暖以及到2050年可能引发的变暖程度。最终结论是，到2050年，飞机尾迹的升温效应将从2006年的每平方米50毫瓦上升到每平方米160毫瓦。\n这段文字意在强调：","options":{"A":"未来飞机尾迹增暖效应将日益显著","B":"积极应对飞机尾迹增暖效应刻不容缓","C":"自然卷云和飞机尾迹会产生较强的变暖效应","D":"需研发新的替代燃料以减轻飞机尾迹升温效应"},"answer":"A","explanation":"文段首先介绍燃烧燃料的飞机会留下废气等尾迹，接着介绍在高海拔地区，烟尘颗粒与水蒸气凝结形成卷云，然后由云既能降温也能增温引出薄的自然卷云和尾迹都有净变暖效应的话题。文段最后根据大气计算机模型的估算得出最终结论：到2050年飞机尾迹增暖效应将日益明显，对应A项；B项，文段只强调未来飞机尾迹增暖效应日益明显的现象，并没有说这是一个问题，需要解决，引申过度，排除；C项，文段的主题词是“飞机尾迹”而不是“飞机尾迹和卷云”，卷云是由飞机尾迹和水蒸气结合形成的，文段重点强调飞机尾迹增暖效益日益明显的现象，主题词错误，排除；D项，文段没有提到“研发新的替代燃料”，无中生有，排除。\n故正确答案为A。\n【文段出处】《德国研究发现：飞机尾迹引起地球变暖效应明显》","no":42,"missingImage":false},{"type":"question","qid":"2423255","cat":"片段阅读","stem":"中国是一个古代典籍十分丰富的国家，中华民族自古就是一个爱书、读书的民族。尽管因为各种天灾人祸，历代典籍遗留至今的十不存一，但据不完全统计，我国现存古籍仍有约19万种，其中保存在公共图书馆系统的就有2750万册，可列入善本的约有250万册。在长期的藏书、聚书活动中，古代读书人养成了鉴书、校书的传统，如西汉河间献王刘德从民间征购藏书，必留献书人的正本，且只收先秦古文字写成的旧籍；宋人欧阳修读书，闻人有善本者，必求而改正之。值得一提的是，不同历史时期的人们对书籍的选择形成了近乎相同的标准，即都把目光投向了善本。\n根据这段文字，接下来最可能讲的是：","options":{"A":"鉴书和校书传统对当代文化的影响","B":"古代文人书籍选择标准的形成过程","C":"善本在当代文化研究与传播中的作用","D":"善本的具体概念及其文化、学术价值"},"answer":"D","explanation":"文段开篇指出中国典籍丰富，中华民族是爱书、读书的民族，随后指出尽管经历灾祸、典籍散佚，现存古籍仍数量很多。随后介绍古人的鉴书、校书传统，并举例进行解释说明。尾句指出不同历史时期人们对书籍的选择标准近乎相同，这个标准就是“善本”。故文段最后谈论的核心话题为“善本”，D项，“善本的具体概念及其文化、学术价值”，与文段最后谈论的核心话题“善本”相一致，且先介绍“善本”的概念，再介绍其价值，符合逻辑顺序，当选。\nA项，“鉴书和校书”是前文提到的内容，下文不会重复阐述，且与文段最后谈论的核心话题“善本”不一致，排除；\nB项，“古代文人书籍选择标准的形成过程”没有具体指出文段最后重点强调的“善本”这一标准，与文段最后谈论的核心话题“善本”不一致，排除；\nC项，文段没有关于“当代文化研究与传播”的描述，且下文应先介绍什么是善本，再接着介绍善本的作用、价值等，不符合逻辑顺序，排除。\n故正确答案为D。\n【文段出处】《李明杰：古籍善本在当代中国传播的文化意义》","no":43,"missingImage":false},{"type":"question","qid":"2423256","cat":"片段阅读","stem":"大多数人在和朋友一起闲聊、聚会时，都会感到非常放松。但也有一部分人和朋友在一起时会觉得精疲力尽，感到紧张不安，心中不免会产生这样的疑问，我是不是得了社交恐惧症？社交恐惧症，又称社交焦虑障碍，患者极力回避社交场合，当处于社交场合时则会出现脸红、出汗、四肢颤抖，不敢与人对视，更有甚者会出现昏厥。社交恐惧症是一种十分常见的精神疾病，其发生机制不甚清楚，过去一直没有令人满意的治疗方法。\n根据这段文字，接下来最可能讲的是：","options":{"A":"如何正确应对和规避社交恐惧症的风险","B":"社交恐惧症的危害和对患者生活的影响","C":"当前社交恐惧症在治疗方法上取得的突破","D":"关于社交恐惧症发生机制的几种主流理论"},"answer":"C","explanation":"根据提问方式可知，本题为接语选择题，应在阅读全文基础上，重点关注文段最后谈论的核心话题。文段首先指出大多数人和朋友在一起会感到放松，随后通过转折词“但”指出一部分人和朋友呆在一起会觉得精疲力尽，感到紧张不安，接着引出“社交恐惧症”这一话题，\n阐述了“社交恐惧症”的发病症状，最后指出过去没有治疗 “社交恐惧症”的方法，故文段最后围绕“社交恐惧症”论述，接下来也应围绕这一话题展开论述，且应论述“社交恐惧症”的治疗方法，对应C项。\nA、B、D三项均未提及“治疗方法”，与文段衔接不当，均排除。\n故正确答案为C。\n【文段出处】《脸红、出汗、四肢颤抖  科学家揭示社交恐惧的神经环路机制》","no":44,"missingImage":false},{"type":"question","qid":"2423257","cat":"片段阅读","stem":"关于月球的形成和演化有分裂模型、捕获模型、共增生模型和巨碰撞模型四种假设和理论。其中，分裂模型假定早期地球旋转特别快，致使自身转动变得不稳定，从而造成赤道地区的物质被甩入轨道生成月球。捕获模型认为，月球形成于太阳系的另一个地方，最终因近距离遇到地球，经重力捕获从而进入一个受约束而稳定的绕地运行轨道。而共增生模型则认为，在地球增生期间，通过多种机制可能会形成一个环绕地球的星体物质盘，这个星体物质盘在地球整个增生期间都存在，月球由较小的绕日抛射物构成。不过，如今被普遍认可的却是巨碰撞模型。这种理论认为，在太阳系形成早期，地球与其他天体相撞，碰撞抛出的地壳等物质在地球轨道上反复累积增生，从而形成月球。\n根据这段文字，下列说法正确的是：","options":{"A":"巨碰撞模型目前已得到相关研究的证明","B":"关于月球形成的假说基本都和地球有关","C":"捕获模型成立的前提是地球引力达到极值","D":"共增生模型认为月球属于绕日星体物质盘"},"answer":"B","explanation":"A项，文段仅说明巨碰撞模型被普遍认可，“已得到相关研究的证明”表述无中生有，排除；\nB项，根据文段可知，分裂模型认为月球源于地球旋转；捕获模型认为月球被地球重力捕获；共增生模型认为月球源于地球增生期产生的绕日抛射物；巨碰撞模型认为月球源于地球与其他天体相撞，故可知假说均与地球有关，表述正确，当选；\nC项，文段仅说明捕获模型的理论是月球因为近距离被地球重力捕获，“地球引力”达到极值表述无中生有，排除；\nD项，文段说明共增生模型认为月球由“绕日抛射物”构成，故“认为月球属于绕日星体物质盘”表述错误，排除。\n故正确答案为B。\n【文段出处】《月球从何而来？ “嫦娥”正接近答案》","no":45,"missingImage":false},{"type":"question","qid":"2423258","cat":"片段阅读","stem":"如果我们把病毒性感染视为一个定时炸弹，在它“爆炸”之前，细菌只有几分钟的时间来拆除这个炸弹。因此，许多细菌都有一种叫做CRISPR的适应性免疫系统，这个系统能够探测到病毒DNA并将其破坏。而Cas9蛋白能在向导RNA的介导下靶向切割病毒DNA。科学家们基于Cas9的这一功能，将其开发为一种基因操作技术，精确删除或插入特定的DNA片段。\u003cimg data-k=\"0ed144517f8b\">技术之所以受到众多科学家的热捧，是因为它有一系列优点。它操作简便、成本低、周期大大缩短，已被广泛应用于医学、农学、微生物学等研究领域。\n根据这段文字，下列说法正确的是：","options":{"A":"大多数病毒的DNA都含有Cas9蛋白质","B":"\u003cimg data-k=\"0ed144517f8b\">技术主要用来对基因进行操作","C":"CRISPR适应性免疫系统是细菌最重要的特性之一","D":"操作简单、环境要求低是\u003cimg data-k=\"0ed144517f8b\">技术的重要优点"},"answer":"B","explanation":"A项，根据“Cas9蛋白能在向导RNA的介导下靶向切割病毒DNA”可知，Cas9蛋白只是能够割除病毒DNA，而非“大多数病毒的DNA都含有Cas9蛋白质”，故无中生有，排除。\nB项，根据“许多细菌都有一种叫做CRISPR的适应性免疫系统，这个系统能够探测到病毒DNA并将其破坏。而Cas9蛋白能在向导RNA的介导下靶向切割病毒DNA。科学家们基于Cas9的这一功能，将其开发为一种基因操作技术”可知，\u003cimg data-k=\"0ed144517f8b\">技术是一项主要针对基因即DNA操作的技术，故符合文意，当选。\nC项，“细菌最重要的特性”无中生有，排除。\nD项，根据尾句可知，文段仅指出“\u003cimg data-k=\"0ed144517f8b\">技术操作简便、成本低、周期大大缩短”并未提及“环境要求低”，故无中生有，排除。\n故正确答案为B。\n【文段出处】《基因编辑如此耳熟，但如有人愿闻其详，您能说出一二吗？》","no":46,"missingImage":false},{"type":"question","qid":"2423259","cat":"片段阅读","stem":"温湿度的控制是美术馆展陈、藏品库房环境管理的最重要环节。改革开放前，我国的美术馆很难做到恒温恒湿；改革开放以来，展陈区全场域恒温恒湿的新建美术馆则越来越多。但许多美术馆还是严格局限于画库和固定陈列室，临展厅温湿度的控制措施和设备配置显得相对薄弱。一些美术馆采用封闭式玻璃画框，将作品置于玻璃框内或展墙外加置玻璃空间。这些与展陈功能合一的装置虽然让作品得到一定保护，但也只是防尘、防污和防触摸。虽然有些馆在展墙外加建的玻璃空间确实能够达到和保持标准温湿度，但因空间高度和宽度的限制，大作品和超大作品无法置于其中。\n这段文字意在说明：","options":{"A":"美术馆温湿度控制尚存在一些问题","B":"我国美术馆普遍缺乏专业展陈设备","C":"标准展陈设备的普及不应局限于部分区域","D":"我国美术馆设备的标准化水平仍有待提高"},"answer":"A","explanation":"文段开篇指出“温湿度”的控制对于美术馆很重要。接着通过改革前后的对比，说明现在恒温恒湿的新建美术馆变多了，“但”表示转折，说明美术馆的临展厅温湿度的控制依然存在很多不足，故文段重点强调许多美术馆临展厅的温湿度控制还有不足，对应A项。\nB、C、D项，均缺少文段主题词“温湿度”，且B项“普遍缺乏专业展陈设备”无中生有，均排除。\n故正确答案为A。\n【文段出处】《美术馆的功能空间与设备》","no":47,"missingImage":false},{"type":"question","qid":"2423260","cat":"语句表达","stem":"①另外，煤矿冒顶事故的发生一般都会有征兆，但人的认知能力有限，有的征兆可以发现，有的却难以发现\n②冒顶的类型众多，发生原因也多样，绝大多数是由矿山压力变化的活动所造成\n③煤矿冒顶事故是较常见的煤矿事故之一，在煤矿所发生的顶板事故中占据很大比重\n④煤矿冒顶，就是在煤矿地下开采中，巷道上部矿岩层塌落下来的现象\n⑤在矿山开采过程中，顶板会因压力变化发生不同程度变形，一般先沿顶板节理出现裂隙，并伴有离层现象产生\n⑥如果此时防护不当或支护的质量不好，压力持续增大，岩石变形超过极限，就会出现断裂、垮落、片帮或局部冒顶\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"③②①⑤④⑥","B":"②③①⑤⑥④","C":"⑤⑥①④③②","D":"④③②⑤⑥①"},"answer":"D","explanation":"对比首句，②句提到冒顶的类型多和多数发生冒顶的原因，③句介绍了煤矿冒顶事故频发，④句介绍了煤矿冒顶是什么现象，给冒顶下定义，⑤句介绍了开采矿山时会出现顶板受压变形等情况，按照首句原则，应先介绍煤矿冒顶的概念是什么，再具体介绍其发生的次数和冒顶的成因等，故④句适合做首句，锁定D项；\n验证D项，文段先介绍煤矿冒顶的定义和发生比重，指出冒顶多因矿山压力变化造成，再详细分析，即压力产生顶板变形、变形极限引发冒顶，又用“另外”表示并列，指出人们难以发现冒顶征兆，符合逻辑，当选。\n故正确答案为D。\n【文段出处】《神木煤矿冒顶事故中的“冒顶”到底是个啥？》","no":48,"missingImage":false},{"type":"question","qid":"2423261","cat":"片段阅读","stem":"气泡模型的思想类似于DGP模型。DGP模型认为，我们这个四维的宇宙镶嵌在一个五维的空间当中，我们所观测到的所有物质都被限制在这个四维宇宙之中。引力在小尺度上是四维的，会比较强；但在距离更远的大尺度上是五维的，引力相应地也就变弱了，这样也可以解释宇宙为什么会加速膨胀。而气泡模型认为，在两个能量不同的五维空间的边界存在一个四维空间，这就像二维圆面的边界是一维圆周，三维球体的边界是二维的球面一样，我们的宇宙就在两个五维空间的边界——四维空间之中。由此可见，我们的宇宙也不容易，“它在夹缝中顽强地活着”。\n根据这段文字，下列说法正确的是：","options":{"A":"空间维度数量越多引力就会越小","B":"DGP模型的思想起源于气泡模型","C":"世界所有物质都存在于一个四维空间里","D":"四维宇宙存在于两个五维空间的边界中"},"answer":"A","explanation":"A项，由“引力在小尺度上是四维的，会比较强；但在距离更远的大尺度上是五维的，引力相应地也就变弱了”可知，随着空间维度数量增多，引力可以变小，故符合文意，当选；\nB项，由“气泡模型的思想类似于DGP模型”可知，两者只是类似，DGP模型起源与气泡模型无关，排除；\nC项，由“我们观测到的所有物质都被限制在这个四维宇宙之中”可知，“世界所有物质”范围扩大，排除；\nD项，根据文意可知，DGP模型认为四维的宇宙镶嵌在五维空间中；气泡模型认为“我们的宇宙就在两个五维空间的边界——四维空间之中”，即四维宇宙在两个五维空间的边界，故可知DGP模型和气泡模型存在不同看法。“四维宇宙在两个五维空间的边界”只是在气泡模型理论框架下存在的，并非全部情况适用，故缺乏“气泡模型”这一前提限定，排除。\n故正确答案为A。\n【文段出处】《是谁给了宇宙膨胀一个加速度》","no":49,"missingImage":false},{"type":"question","qid":"2423262","cat":"片段阅读","stem":"小说家时常在小说之外抛头露面，这若让主张作者应从作品背后消失的福楼拜来评判，简直是犯了大忌。昆德拉曾对福楼拜深表赞同并加以发挥：小说家一旦自居为公众人物，就会使其作品陷入危险境地。昆德拉的观点，与本雅明所说的“小说诞生于离群索居的个人”可谓殊途同归，均意在强调小说乃是独立观察和思考的产物。不过，也不必过于忧虑。小说家如能秉持真正的专业情怀，即便偶尔抛头露面，也不至于变成通常意义上的公众人物。优秀的小说家自有其智慧与策略，与人群和聚光灯保持必要的距离，使自己得以独立观察和思考。\n这段文字意在说明：","options":{"A":"小说家是否具有专业情怀非常关键","B":"优秀的小说家一般都是离群索居的","C":"没必要过分担心小说家是否抛头露面","D":"和公众保持距离是小说家的基本修养"},"answer":"C","explanation":"文段开篇指出“福楼拜”、“昆德拉”、“本雅明”这些人看来，小说家不应该抛头露面。后利用转折关联词“不过”强调，不必过于忧虑小说家是否抛头露面。后文对这一观点进行了详细的解释说明。故文段重点为转折之后，强调“不必过于忧虑小说家是否抛头露面”，对应C项。\nA项，“是否具有专业情怀”为解释说明的内容，非重点，排除。\nB项，“离群索居”为本雅明的观点，为转折之前的内容，非重点，排除。\nD项，“基本修养”无中生有，文段未提及小说家的基本修养是什么，排除。\n故正确答案为C。\n【文段出处】《‘小说课’的兴起与文学生活的变迁》","no":50,"missingImage":false},{"type":"question","qid":"2423268","cat":"片段阅读","stem":"电影修复需要将技术和艺术巧妙结合。老电影具有鲜明的年代特征，比如胶片画面的颗粒度、具有年代感的影片色调等。在解决这类问题时，要充分考虑影片的历史艺术性，不能一味追求修复效果，把影片修复得太新。对影片做降噪处理时，也并非把噪点降到最低就是好的修复效果，而是需要把握好降噪的程度，抑制住令观众感到不适的噪点，保留下影片画面原有的颗粒质感。对影片做调色处理时，要充分尊重老旧影片的色彩特点，通过调色改善画面层次、偏色、变色和褪色等问题，不能对影片在色调上做二次创作而改变老影片的原有风格，需要真实还原老电影的“旧颜”。\n最适合做这段文字标题的是：","options":{"A":"老电影修复的技与艺","B":"让老电影重焕“旧颜”","C":"电影修复，让经典不褪色","D":"电影修复，没那么简单"},"answer":"C","explanation":"文段开篇指出电影修复需要将技术和艺术相结合，之后指出老电影具有“鲜明的年代特征”，后文通过“比如”进行举例论证，然后通过“解决这类问题······要······”引出具体对策，即电影修复需要考虑“历史艺术性”，要注意保留其“鲜明的年代特征”。之后通过“降噪处理”及“调色处理”两个方面进行具体论述。故文段所强调的电影修复技术要与“艺术”结合，即电影修复要注重保留老电影“鲜明的年代特征”，保留其质感、面貌，故对应C项。\nA项，文段重在论述电影修复的技术要与艺术性相结合，即保留电影原有的质感、面貌，而并非强调电影修复有哪些的具体技术与艺术，偏离文段核心话题，排除。\nB项，“旧颜”对应文段“调色处理”部分内容，而根据文段可知，“降噪处理”与“调色处理”为并列的两部分内容，故表述片面，排除。\nD项，并未提及，电影修复需要注意艺术感，需要保留电影原有的质感、面貌，故“没那么简单”表述不明确，排除。\n故正确答案为C。\n【文段出处】《电影修复，让经典不褪色》","no":51,"missingImage":false},{"type":"question","qid":"2423271","cat":"片段阅读","stem":"传拓技术在现代，不仅被考古学所利用，成为考古学获取金石文物原始信息的一种重要的技术手段，也是呈现漫漶不清原始图像的一种手段，为现代考古学做出了重要的贡献，而且金石拓本也成为考古学研究的对象。在一个历史的发展过程当中，拓片作为文物的附加价值，作为文物在移动过程中另一种形态的展现，其艺术特质正是那种斑驳的与古代人类文明创造相关联的特别的视觉图像。它与文物不同，又与类如摄影等手段获取的图像不同，是文物图像的另外一种呈现方式。\n这段文字意在强调：","options":{"A":"金石拓本是考古学重要的研究对象","B":"拓片作为文物具有很高的附加价值","C":"传拓技术在考古学领域得到广泛运用","D":"拓片是一种独特的文物图像呈现形式"},"answer":"D","explanation":"文段首先引出“传拓技术”的概念，并介绍其在现代考古学方面的作用，接着指出“金石拓本”在考古研究方面的价值，之后说明了“拓片”的特点，并通过程度词“正是”强调拓片的艺术特质是“特别的视觉图像”，最后通过与“文物”“摄影”的对比，再次强调突出重点，即“是文物图像的另外一种呈现方式”，对应D项。\nA项，“金石拓本”只对应文段中“金石拓本也成为考古学研究的对象”部分内容，属于具体的一类拓本，故表述片面，排除；\nB项，“作为······作为······”句式相同表并列，故文段不仅强调了“拓片作为文物的附加价值”，还强调了“拓片作为文物在移动过程中另一种形态的展现”，故“附加价值”表述片面，排除；\nC项，“传拓技术”对应了文段首句内容，属于话题引入部分，非文段重点，排除。\n故正确答案为D。\n【文段出处】《传拓技艺的技术标准和审美原则》","no":52,"missingImage":false},{"type":"question","qid":"2423276","cat":"语句表达","stem":"解读作品是难事。古往今来，文学家、评论家、思想家，甚至革命家都对一部部经典作品有所解读。然而，这种现象更多的存在于“大作家”和“重头作品”上。因为“大”和“重”，文本所要表达的信息就更多，生出的议论也就更多。______？恐怕只有通过阅读文本本身才能有机会体会到。但是，阅读的主体总是千差万别，无论多么专业的评论者，都无法避免站在自身的立场和角度，带着自己对于文学的要求，从自身感兴趣的点出发进行解读。\n填入画横线部分最恰当的一项是：","options":{"A":"如何才能做到客观公正地解读呢","B":"而作家真正的本意究竟是什么呢","C":"如何从作者的角度来理解这些解读呢","D":"而怎样才能弄明白作家的创作动机呢"},"answer":"B","explanation":"横线出现在文段中间，需要结合前后文内容进行分析，且横线结尾处为“问号”，故横线处应提出一个问题。前文指出解读作品是难事，很多人物都对经典作品有所解读，转折后强调在解读“大”和“重”的作品上，关于文本想要传达的信息而产生的议论很多。横线后给出对策，并且是对横线处的问题进行回答，即要通过阅读文本本身才能体会到。随后通过转折指出，无法避免的站在自己的角度去解读，前后语义相反，故横线处应体现如何站在作者的角度去体会文本本身的意图，对应B项。\nA项，“公正”在文段中并没有提及，排除；\nC项， 文段论述的是应站在何种角度解读作品，并非如何理解已有的解读，偏离文段的核心话题，排除；\nD项，“创作动机”即趋使作者创作的动机，文段并未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《阅读本身是最好的解读》","no":53,"missingImage":false},{"type":"question","qid":"2423283","cat":"片段阅读","stem":"很多人觉得，只要孩子听力没问题，掌握母语是一件自然而然的事情。到了学龄阶段，则以为孩子的语言学习和教育交给学校和老师就可以了。事实上，认为学校能解决一切问题恐怕只是家长的一厢情愿，家庭才是孩子语言能力形成的最初场所，也是最重要场所。在博纳德·斯波斯基语言实践、语言管理和语言意识的三维理论框架下，尤其是面对复杂的多语言环境，家长的语言意识显得异常重要。费什曼认为，家庭是母语代际传递、连接、使用和稳定的基础。已有研究显示，传承语或者双语能力的保持更多依赖家庭，而不是学校；而如果没有家庭支持，学校语言政策的效果也难以保证。\n这段文字意在强调：","options":{"A":"家庭语言教育具有重要意义","B":"母语学习不能“自然而然”","C":"家庭是母语学习的最佳场所","D":"家长支持是语言学习的前提"},"answer":"A","explanation":"文段开篇论述了一种传统的观点，即很多人认为掌握母语是件自然而然的事，且语言学习只与学校有关，之后紧接着出现“事实上”表转折，强调家庭对孩子语言能力形成的重要性，后文通过博纳德·斯波斯基的理论和费什曼的研究，进一步论证强调了家庭对孩子语言学习的重要性，故文段强调的重点为家庭对孩子语言学习的重要性，对应A项。\nB项，未提及家庭对语言学习的作用，表述不明确，排除；\nC项，文段重在强调“语言能力”，故“母语”概念缩小，与文意不符，且文段论述的是“最初和最重要场所”，与“最佳场所”概念不一致，排除；\nD项，“家长支持”为论证部分的内容，非重点，且未提及“家庭”，排除。\n故正确答案为A。\n【文段出处】《家庭语言教育不可小视》","no":54,"missingImage":false},{"type":"question","qid":"2423289","cat":"片段阅读","stem":"相比于其他脊椎动物，鸟类骨骼系统最大的特点是骨骼愈合程度高，以适应飞行需要。最明显的是，手部的远端腕骨和三个掌骨愈合而成腕掌骨，腰带的髂骨、耻骨和坐骨围绕着髋臼愈合在一起。这些骨骼在爬行类，特别是鸟类的近亲恐龙中很少发生愈合，但亦有例外。由于缺少过渡环节的化石，以及对现生鸟类骨骼愈合过程研究较少，骨骼愈合在鸟类演化历史中是如何发生的尚不清楚。研究人员发现的一件距今约1.2亿年的早白垩世反鸟类化石，保存了完全愈合的腕掌骨和腰带，这是目前已知最早的同时具有愈合的腕掌骨和腰带的鸟类。\n根据这段文字，下列说法正确的是：","options":{"A":"爬行类动物缺乏骨骼愈合的外在环境","B":"脊椎动物中骨骼愈合程度最高的是鸟类","C":"鸟类骨骼愈合最早的部位是手部远端和腰带","D":"在约1.2亿年前鸟类已开始了骨骼愈合的演化"},"answer":"D","explanation":"A项，文段未提及“缺乏骨骼愈合的外在环境”，无中生有，排除；\nB项，根据“相比于其它脊椎动物，鸟类骨骼系统最大的特点是骨骼愈合程度高”可知，“愈合程度高”是其“最大特点”，无法说明鸟类是脊椎动物中骨骼愈合程度最高的，表述过于绝对，排除；\nC项，文段并未提及“鸟类骨骼愈合最早的部位”，无中生有，排除；\nD项，根据文段尾句中发现的鸟类化石可知，在1.2亿年前鸟类的骨骼愈合就开始演化了，表述正确。\n故正确答案为D。\n【文段出处】《鸟类骨骼愈合演化或反映发育可塑性》","no":55,"missingImage":false}],"count":35,"answerable":35,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2423297","cat":"数学运算","stem":"甲和乙两个小组共同植树，计划共同花10个小时完成。但实际上甲组先单独开工，2小时后乙组加入，又过1小时后还剩3/4没有完成。已知甲组比乙组每个小时多植树10棵，问两个小组一共要植树多少棵？","options":{"A":"200","B":"220","C":"240","D":"300"},"answer":"A","explanation":"设乙每小时植树\u003cimg data-k=\"5320a525f2bc\">棵，则甲每小时植树\u003cimg data-k=\"3f0ad912296f\">棵，植树总棵数\u003cimg data-k=\"38e61226bc9f\">。因甲先独自开工2小时，然后两人合作1小时，则甲共干3小时，乙共干1小时，此时完成总量的\u003cimg data-k=\"a8b04cd19bab\">，则可得：\u003cimg data-k=\"c149597c10d9\">\u003cimg data-k=\"6fb9700beaee\">，解得\u003cimg data-k=\"43edc63c34e0\">。则植树总棵数\u003cimg data-k=\"8967bc149245\">棵。\n故正确答案为A。","no":56,"missingImage":false},{"type":"question","qid":"2423308","cat":"数学运算","stem":"A和B两块农田种植不同品种的粮食，总产量相同。已知A农田亩产为\u003cimg data-k=\"644e20a10d24\">吨，B农田亩产为\u003cimg data-k=\"2962e04d3100\">吨。问两块农田总体平均亩产多少吨？","options":{"A":"\u003cimg data-k=\"e9b9f22971a5\">","B":"\u003cimg data-k=\"80a687663118\">","C":"\u003cimg data-k=\"3b36c0df9942\">","D":"\u003cimg data-k=\"852bb3a2f509\">"},"answer":"D","explanation":"方法一：\u003cimg data-k=\"997997e0cf51\">，设A、B农田的亩数分别为\u003cimg data-k=\"f82036fad5c4\">、\u003cimg data-k=\"b0b4715579ef\">，根据总产量相同可得：\u003cimg data-k=\"9803985a17ca\">，解得\u003cimg data-k=\"c0993bcd78c2\">。赋值A、B农田的亩数分别为15、8，则每块田地的总产量\u003cimg data-k=\"eabdfe362dcf\">。两块农田总体的平均亩产\u003cimg data-k=\"cc310307e48f\">\u003cimg data-k=\"5d3a72a26977\">。\n方法二：将总产量看作总路程，平均亩产看作平均速度，直接套用等距离平均速度公式求解。代入公式：\u003cimg data-k=\"ff7c54f6b647\">\u003cimg data-k=\"24249c02f9ab\">\u003cimg data-k=\"fbb110517f74\">。\n故正确答案为D。","no":57,"missingImage":false},{"type":"question","qid":"2423306","cat":"数学运算","stem":"某网站销售10个不同档次的衬衣，其中最高档的每年销售500件，每件利润为300元。往下每降低1个档次，每年销量增加1000件，每件利润降低30元。问年总利润最高的3个档次的衬衣，全年销量之和为多少万件？","options":{"A":"1.05","B":"1.50","C":"1.65","D":"1.80"},"answer":"C","explanation":"设最高档降低\u003cimg data-k=\"5320a525f2bc\">档后利润最高，设利润为\u003cimg data-k=\"c1beececd683\">，则可得\u003cimg data-k=\"a530a57eb6c0\">\u003cimg data-k=\"d9e0c5ad1806\">，解一元二次函数的两个根得：\u003cimg data-k=\"a8bce95e4bb3\">，\u003cimg data-k=\"b27ed4d2bec7\">。当\u003cimg data-k=\"5320a525f2bc\">取函数对称轴上的点时，\u003cimg data-k=\"c1beececd683\">取最大值，此时\u003cimg data-k=\"d83003fc7fe3\">\u003cimg data-k=\"421aa3e3d636\">\u003cimg data-k=\"eb6c77bcc1ad\">。\u003cimg data-k=\"5320a525f2bc\">只能取整数，\u003cimg data-k=\"5320a525f2bc\">离峰值4.75的距离越近则函数越大，故\u003cimg data-k=\"5320a525f2bc\">应依次取值5、4、6，即分别比最高档降低了5、4、6档，则三档总计增加的销量\u003cimg data-k=\"ec4c98689759\">\u003cimg data-k=\"1c1f1cc9281c\">，那么利润最高的3个档次的衬衣总计销量\u003cimg data-k=\"871cb8afb712\">\u003cimg data-k=\"803ba82401e2\">\u003cimg data-k=\"62aaad25cffd\">万件。\n故正确答案为C。","no":58,"missingImage":false},{"type":"question","qid":"2423311","cat":"数学运算","stem":"某地区招聘卫生人才，共接到600份不同求职者的简历，其中临床、口腔、公共卫生和护理专业分别有200人、160人、140人和100人。问至少有多少人被录用，才能保证一定有140名被录用的人专业相同？","options":{"A":"141","B":"240","C":"379","D":"518"},"answer":"D","explanation":"根据问法“至少······才能保证······”，可判定本题为最不利构造型最值问题。考虑最不利情况为每个专业均录用139人，但护理专业总计只有100人需要全部录用，则四个专业最不利的情况下共招录\u003cimg data-k=\"b21670a31ebf\">\u003cimg data-k=\"5c199adec07b\">人。在此基础上再多录用一人，就可以保证一定有140名被录用的人专业相同。故至少需要录用\u003cimg data-k=\"57adbd9cff6c\">人。\n故正确答案为D。","no":59,"missingImage":false},{"type":"question","qid":"2423321","cat":"数学运算","stem":"地上画有45行、2列的方格阵列，45名运动员在靠左的一列站成纵队，每人站在一个方格内，且所有运动员从前到后按1～45依次编号。当听到第一声哨响时，所有编号为1的倍数的人移动到自己所在位置同一行的另外一个方格中，往后听到第n次哨响时，所有编号为n的倍数的人都要移动到自己所在位置同一行的另外一个方格中。那么哨响4次之后，站在左边一列的人比站在右边一列的人：","options":{"A":"少5人","B":"少9人","C":"多5人","D":"多9人"},"answer":"B","explanation":"方法一：\n根据题意，听到第一声哨响时，所有人编号均为1的倍数，因此45人均移动到自己的右侧。\n第二声哨响时，所有编号为2倍数的人均移动到自己的另一侧，即左侧，由于\u003cimg data-k=\"7dc51cc3435d\">\u003cimg data-k=\"ae762405ab83\">，因此编号是2倍数的有22人，他们移动到左侧后，左边一列有22人，右边一列有\u003cimg data-k=\"7ac2c4a9e3aa\">人。\n第三声哨响时，所有编号为3倍数的人均移动到自己的另一侧，由于\u003cimg data-k=\"3589ea67f2ec\">\u003cimg data-k=\"13107ca9f0ed\">，因此编号是3倍数的有15人，其中同时满足是3和2的倍数，即6倍数的有\u003cimg data-k=\"d76904b483a8\">\u003cimg data-k=\"af5a8aeda55f\">，即7人，他们在左侧一
