<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2019-广东-乡镇卷","title":"2019年广东省公务员录用考试《行测》题（乡镇卷）（网友回忆版）","year":"2019","group":"广东","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2374804","cat":"新思想","stem":"习近平总书记在庆祝改革开放40周年大会上的重要讲话指出：（    ）是五四运动以来我国发生的三大历史性事件，是近代以来实现中华民族伟大复兴的三大里程碑。\n①建立中国共产党\n②成立中华人民共和国\n③全面建成小康社会\n④推进改革开放和中国特色社会主义事业","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②④"},"answer":"B","explanation":"本题考查政治常识。\n习近平总书记在庆祝改革开放40周年大会上的重要讲话指出：“建立中国共产党、成立中华人民共和国、推进改革开放和中国特色社会主义事业，是五四运动以来我国发生的三大历史性事件，是近代以来实现中华民族伟大复兴的三大里程碑。”据此可知，①②④符合题意。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"2374673","cat":"新思想","stem":"2019年3月，习近平总书记对欧洲三国进行了国事访问，推动共建“一带一路”在亚欧大陆开辟新的空间。这三国分别是（    ）。","options":{"A":"以色列  乌克兰  英国","B":"墨西哥  奥地利  瑞典","C":"意大利  摩纳哥  法国","D":"新西兰  葡萄牙  德国"},"answer":"C","explanation":"本题考查政治常识。\n2019年3月21日至26日，国家主席习近平应邀对意大利、摩纳哥、法国进行国事访问。此次欧洲之行是中国国家最高领导人2019年首次出访，对中意、中摩、中法关系发展具有重要历史意义，为中欧全面战略伙伴关系注入了新的动力。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"2374806","cat":"新思想","stem":"2018年10月，习近平总书记在广东考察时提出“要加快形成区域协调发展新格局”，把粤东、粤西的（    ）作为重要发展极，打造现代化沿海经济带。","options":{"A":"珠海、肇庆","B":"深圳、清远","C":"广州、韶关","D":"汕头、湛江"},"answer":"D","explanation":"本题考查政治常识。\n2018年10月，习近平总书记在广东考察时提出：要加快形成区域协调发展新格局，做优做强珠三角核心区，加快珠海、汕头两个经济特区发展，把汕头、湛江作为重要发展极，打造现代化沿海经济带。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"2374688","cat":"新思想","stem":"习近平总书记提出“绿水青山就是金山银山”的发展理念。以下最能体现这一理念的是（    ）。","options":{"A":"精准扶贫","B":"共建“一带一路”","C":"实行“河长制”","D":"加强知识产权保护"},"answer":"C","explanation":"本题考查政治常识。\n十九大报告中提出：“坚持人与自然和谐共生。建设生态文明是中华民族永续发展的千年大计。必须树立和践行绿水青山就是金山银山的理念，坚持节约资源和保护环境的基本国策，像对待生命一样对待生态环境，统筹山水林田湖草系统治理，实行最严格的生态环境保护制度，形成绿色发展方式和生活方式，坚定走生产发展、生活富裕、生态良好的文明发展道路。”\nA项错误，精准扶贫是粗放扶贫的对称，指针对不同贫困区域环境、不同贫困农户状况，运用科学有效程序对扶贫对象实施精确识别、精确帮扶、精确管理的治贫方式。\nB项错误，“一带一路”是“丝绸之路经济带”和“21世纪海上丝绸之路”的简称。旨在借用古代丝绸之路的历史符号，高举和平发展的旗帜，积极发展与沿线国家的经济合作伙伴关系，共同打造政治互信、经济融合、文化包容的利益共同体、命运共同体和责任共同体。\nC项正确，实行“河长制”指建立健全以党政领导负责制为核心的责任体系，负责组织领导相应河湖的管理和保护工作。全面推行河长制是落实绿色发展理念、推进生态文明建设的内在要求。此举体现了“绿水青山就是金山银山”的发展理念。\nD项错误，知识产权保护与我国经济发展动能转换、结构优化相辅相成，发挥着重要驱动作用。加强知识产权保护已成为完善产权保护制度最重要的内容，也是提高中国经济竞争力最大的激励。\n故正确答案为C。","no":4,"missingImage":false}],"count":4,"answerable":4,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2374794","cat":"科技常识","stem":"风能是一种清洁的可再生能源，很早就被人们所利用。下列关于利用风能发电的说法不正确的是（    ）。","options":{"A":"风力发电场可以建在海上","B":"风力发电是将风的动能转换为电能","C":"风力发电的能量最终来源于太阳能","D":"风力发电的过程中不会有能量的损失"},"answer":"D","explanation":"A项：由于海上没有山丘和建筑物的遮挡，海水对风的摩擦阻力也明显小于陆地对风的摩擦阻力，所以海上风力更大，海上可以建造风力发电厂，正确；\nB项：风力发电的原理是风吹动桨转动，桨叶的转动带动发电机发电，故风力发电是将风的动能转化为电能，正确；\nC项：太阳照射地面，地表温度不同，地表温度高的地区空气受热上升，产生气压差，周围气压较高的空气在气压作用下向低气压地区运动，产生了风，所以太阳能是风能的根本来源，正确；\nD项：在风力发电过程中，桨叶运转、发电机工作，因为摩擦和散热都会伴随有热量的散失，所以不可能没有能量损失，错误。\n本题为选非题，故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"2374795","cat":"科技常识","stem":"人在短时间内从低海拔处上升至高海拔处时，环境气压变化大，但鼓膜内的气压不变，鼓膜会感觉不适。这时，可通过做咀嚼运动或大口呼吸缓解，其原理是（    ）。","options":{"A":"通过转移人的注意力，减少不适感","B":"吸入更多的氧气，使机体的新陈代谢加快","C":"疏通咽鼓管，使外耳道与鼓室之间的气压平衡","D":"提高鼓膜的震动频率，缓解不适症状"},"answer":"C","explanation":"海拔越高、气压越低，在短时间内突然从低海拔上升至高海拔处，外界气压突然减小，而鼓膜内的气压不变，因此容易造成不适。做咀嚼运动或大口呼吸，可以使连通咽部和鼓膜内鼓室的咽鼓管打开，保持鼓膜内的气压与鼓膜外的气压平衡，解除不适。\n故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"2374796","cat":"科技常识","stem":"下图是具有起钉功能的锤子，要使锤子起钉时更省力，最科学的做法是（    ）。\n\u003cimg data-k=\"122049c5bcf2\" style=\"max-width:369px\">","options":{"A":"适当延长把手BC的长度","B":"适当延长起钉部位OA的长度","C":"增加锤子的重量","D":"增加把手的重量"},"answer":"A","explanation":"根据杠杆原理，动力\u003cimg data-k=\"1667c9c4f593\">动力臂\u003cimg data-k=\"e6c7a9c8511f\">阻力\u003cimg data-k=\"1667c9c4f593\">阻力臂，若要使锤子起钉时更省力，则需要增大动力臂或者减小阻力臂。如图，支点为O，增大BC的长度或者减小OA的长度，可使动力臂增加或者阻力臂减少，而增加锤子和把手的重量，并不能省力。\n故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"2374797","cat":"科技常识","stem":"将瘪了的乒乓球放在热水里一段时间后，乒乓球便会恢复原来的圆形状态。其原理是（    ）。","options":{"A":"乒乓球内部气体溢出，内部气体减少","B":"乒乓球受热后球壁变软，恢复原来形状","C":"乒乓球内部气体受热膨胀，挤压乒乓球内壁","D":"水蒸气流入乒乓球内部，乒乓球内部压强增大"},"answer":"C","explanation":"瘪了的乒乓球放到热水中时，乒乓球内部气体温度升高，热胀冷缩，气体受热体积膨胀，挤压乒乓球内壁，乒乓球就会重新鼓起来。\n故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"2374798","cat":"科技常识","stem":"如图所示，货车停在某处卸货时货物从倾斜的货箱滑下。那么，下列关于货车车轮所受的摩擦力说法正确的是（    ）。\n\u003cimg data-k=\"00674150e3d4\" style=\"max-width:350px\">","options":{"A":"货车车轮与地面之间没有摩擦力","B":"货车车轮所受摩擦力的方向水平向右","C":"货车车轮所受摩擦力的方向水平向左","D":"货车车轮与地面之间的摩擦力大小和方向都不确定"},"answer":"B","explanation":"货物自己下滑，一定是重力的分力大于摩擦力，故加速下滑。\n设物体沿斜面向下的加速度为\u003cimg data-k=\"f82036fad5c4\">，斜面倾角为\u003cimg data-k=\"dba22c8eb7eb\">，货物质量为\u003cimg data-k=\"f412308ad916\">，受力分析如下图所示。\n\u003cimg data-k=\"58156ea5337f\" style=\"max-width:207px\">\n此时，\u003cimg data-k=\"7d5a01a7dab1\">， \u003cimg data-k=\"8dcf47f73aaa\">；\n根据力的作用是相互的，货车的受力分析如下图所示。\n\u003cimg data-k=\"0c32f36df462\" style=\"max-width:251px\">\n\u003cimg data-k=\"572af33c7d4a\">水平方向的力为方向向左的\u003cimg data-k=\"0594bf4375b0\">，\u003cimg data-k=\"dd559a2e8177\">水平方向的力为方向向右的\u003cimg data-k=\"a300a8d4fb94\">，货车水平方向上受到\u003cimg data-k=\"572af33c7d4a\">和\u003cimg data-k=\"dd559a2e8177\">的合力为\u003cimg data-k=\"49514a0631a0\">\u003cimg data-k=\"0b9c6f524558\">，方向水平向左。\n若保持货车静止不动，需受到地面方向向右的摩擦力。\n故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"2374663","cat":"科技常识","stem":"如图所示，将一只充了气的密封小气球放在针筒壁内，封闭针筒孔后向外抽拉针筒推杆，忽略摩擦力的影响，则在这一过程中（    ）。\n\u003cimg data-k=\"6c6044d4a99c\" style=\"max-width:375px\">","options":{"A":"小气球体积会变大","B":"针筒内的压强保持不变","C":"小气球受到的合力为零","D":"针筒内的气体温度会升高"},"answer":"A","explanation":"对于封闭针筒向外拉推杆的过程中，针筒封闭气体体积增大，压强变小，B项错误；小气球外部气体压强减小，小气球在内部气体压强作用下膨胀，故小气球体积变大，A项正确；由于气球膨胀，导致气球重心上升，将气球看成一个质点，气球并非静止不动，而是由静止变为向上运动，因此受到合力不为零，C项错误；在向外拉推杆的过程中，针筒内气体对外做功，消耗气体内能，相对抽拉针筒推杆前，针筒内气体温度不会升高，D项错误。\n故正确答案为A。","no":10,"missingImage":false},{"type":"question","qid":"2374669","cat":"科技常识","stem":"物质的用途与性质密切相关。下列说法正确的是（    ）。","options":{"A":"木炭能作为炼钢的原料，是利用了木炭的可燃性","B":"钨常用作灯丝，是因为钨在高温下化学性质稳定","C":"活性炭可以去除水中杂质，是因为其具有很强的吸附能力","D":"铝制品的表面可以不做防锈处理，是因为铝的金属活动性不强"},"answer":"C","explanation":"A项错误，木炭能作为炼钢的原料，使用的是木炭的还原性，而非可燃性。在高温下，木炭作为还原剂，与矿石（主要为金属氧化物）中的氧结合，生成二氧化碳，而使金属被还原。\nB项错误，钨常用作灯丝，是因为钨丝的熔点高，不容易因过热而熔化，而非钨在高温下化学性质稳定。\nC项正确，活性炭具有吸附性，能吸附水中的杂质，可用活性炭净水。\nD项错误，铝的金属活动性强，化学性质活泼，因此能在空气中和氧气反应生成氧化铝，在金属表面形成致密的保护膜，防止生锈，因而不需要防锈。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"2374664","cat":"科技常识","stem":"办公室里的四盏灯型号相同，电路如下图所示。如果逐一打开这四盏灯，在电源的输出电压不变的情况下，下列说法正确的是（    ）。\n\u003cimg data-k=\"c90d4640e3c3\" style=\"max-width:378px\">","options":{"A":"打开的灯越多，通过各灯的电流变得越大","B":"打开的灯越多，各灯两端的电压变得越小","C":"打开的灯越多，通过电源的电流变得越大","D":"打开的灯越多，各灯变得越暗"},"answer":"C","explanation":"由于灯泡均与电源并联，所以所有灯泡两端的电压均为电源输出电压，保持不变，B项错误；由于四盏灯型号相同，电阻相等，根据欧姆定律\u003cimg data-k=\"93554d43eaaa\">，所以流经每个灯泡支路的电流不变，A项错误；由于干路电流等于各支路电流之和，所以打开的灯越多，干路电流越大，即通过电源的电流变得越大，C项正确；而根据功率公式\u003cimg data-k=\"7374c11fee76\">，可知灯泡功率不变，即亮度不变，D项错误。\n故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"2374676","cat":"科技常识","stem":"冬天气温很低的时候往玻璃杯里倒开水，杯壁较厚的玻璃杯更容易发生炸裂，这是因为（    ）。","options":{"A":"内壁和外壁受热不均","B":"开水遇到玻璃后温度迅速降低","C":"空气对杯壁的压力超过杯壁的承受范围","D":"倒水时水的冲击力将玻璃杯击破"},"answer":"A","explanation":"杯子内倒入开水后，厚玻璃杯内壁温度迅速升高，受热膨胀，而外壁温度变化慢，膨胀程度小。内外壁受热膨胀不均匀，内外壁膨胀程度不同，导致玻璃杯发生炸裂。\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"2374674","cat":"科技常识","stem":"如图所示，甲、乙两个大小相同的实心金属球放置在光滑水平面上，甲球以水平向右的速度碰撞静止的乙球。已知甲球质量大于乙球，则有关碰撞后的情形，下列说法正确的是（    ）。\n\u003cimg data-k=\"bae1f36e8999\" style=\"max-width:305px\">","options":{"A":"甲球可能静止","B":"乙球可能静止","C":"甲球可能向左运动","D":"甲球一定向右运动"},"answer":"D","explanation":"根据碰撞过程动量守恒可得：\u003cimg data-k=\"96cbefcde6d9\">\u003cimg data-k=\"0e9d9b3804f1\">\u003cimg data-k=\"ebbefa3194ce\">——①\n根据动能守恒可得：\u003cimg data-k=\"46bf4cf4844a\">\u003cimg data-k=\"6a399abf7718\">\u003cimg data-k=\"313fe2f0f086\">——②\n连立①②，分别消去\u003cimg data-k=\"3c93d424475c\"> 、\u003cimg data-k=\"fb0bb5f59b8c\">，可得：\n\u003cimg data-k=\"f3db88748673\">\u003cimg data-k=\"3b5854a7538c\">——③\n\u003cimg data-k=\"777df80f6cdd\">\u003cimg data-k=\"825a3011baba\">——④\n由④可得，\u003cimg data-k=\"7acbd50ede5e\">，方向与\u003cimg data-k=\"24d1db182100\">方向相同，水平向右运动，故B项错误；\n因为\u003cimg data-k=\"af3780a7051c\">，由③可得，所以\u003cimg data-k=\"fb0bb5f59b8c\">的方向与\u003cimg data-k=\"24d1db182100\">方向相同，水平向右运动，故A项、C项错误，D项正确。\n故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"2374799","cat":"科技常识","stem":"细胞膜能够防止细胞外物质自由进入细胞，保证细胞内环境的相对稳定。这是因为（    ）。","options":{"A":"细胞膜具有流动性","B":"细胞膜具有选择透过性","C":"细胞膜主要由氨基酸构成","D":"细胞膜具有维持细胞形状的功能"},"answer":"B","explanation":"细胞膜主要由脂质（主要为磷脂）、蛋白质和糖类等物质组成；其中以蛋白质和脂质为主。细胞膜的主要功能有：1、将细胞与外界环境分开；2、控制物质进出细胞；3、进行细胞间的物质交流。流动性为细胞膜的结构特点，选择透过性为细胞膜的功能特性。\nA项：细胞膜的流动性是结构特点，不能够防止细胞外物质自由进入细胞，错误；\nB项：细胞膜具有选择透过性，可以控制物质进出细胞，防止细胞外物质自由进入细胞，保证细胞内环境的相对稳定，正确；\nC项：细胞膜主要由脂质（主要为磷脂）、蛋白质和糖类等物质组成，氨基酸是蛋白质分解之后的产物，错误；\nD项：细胞膜主要是保护和控制物质进出的作用，可以起到维持细胞形状的结构是细胞壁，错误。\n故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"2374668","cat":"科技常识","stem":"人们在乘坐小船时，应尽量坐下，站立会降低小船的稳定性，其根本原因是（    ）。","options":{"A":"人和船的整体重量增加","B":"人和船的整体重心变高","C":"船的行驶速度增加","D":"水流波动幅度变大"},"answer":"B","explanation":"当人坐下时，人和船整体重心更低，当倾斜相同的角度时，重心低的物体，其重心偏移不易超出它的底部的支撑范围，因而不易倾倒，所以重心越低越稳定；而人站立时，刚好相反。而无论人站立、坐下，整体重量都不变，也不会引起速度变化，更不影响水面波动幅度。\n故正确答案为B。","no":16,"missingImage":false},{"type":"question","qid":"2374682","cat":"科技常识","stem":"“后驱”是指发动机的动力通过传动轴传递给后轮，从而推动车辆前进的一种驱动形式。当后驱车在水平公路上匀速前进时，下列说法正确的是（    ）。","options":{"A":"前轮和后轮受到的摩擦力均向前","B":"前轮和后轮受到的摩擦力均向后","C":"前轮受到的摩擦力向前，后轮受到的摩擦力向后","D":"前轮受到的摩擦力向后，后轮受到的摩擦力向前"},"answer":"D","explanation":"车辆前进时，后轮是驱动轮，主动转动，对地面的力是向后的，所以受到的反作用力即摩擦力是向前的；但是对前轮来说，被动转动，受到来自地面向后的摩擦力。\n故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"2374672","cat":"科技常识","stem":"如图所示，将所点燃的一高一矮两只蜡烛放入圆筒，圆筒顶端不封闭，并从圆筒侧壁缓慢注入二氧化碳气体。则最可能发生的情况是（    ）。\n\u003cimg data-k=\"fd8f30b99fee\" style=\"max-width:194px\">","options":{"A":"高蜡烛先熄灭","B":"矮蜡烛先熄灭","C":"两只蜡烛的火苗没有变化","D":"两只蜡烛的火苗都变矮并逐渐熄灭"},"answer":"B","explanation":"二氧化碳本身不燃烧，也不支持燃烧，密度比空气大。如图，从上方注入二氧化碳，由于二氧化碳密度比空气大，因此下沉。又因为二氧化碳不支持燃烧，下沉的二氧化碳，自下而上逐渐排出容器内的空气，包裹火焰、隔绝氧气，使蜡烛熄灭。因此，逐渐注入二氧化碳，矮蜡烛先熄灭，高蜡烛后熄灭。\n故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"2374679","cat":"科技常识","stem":"为了整治超速，交警采用了一套系统。在某一路段，系统会自动记录车辆进入和离开的时间，从而判断该车辆是否超速。这种方法是计算车辆的（    ）。","options":{"A":"平均速率","B":"瞬时速率","C":"加速度","D":"位移"},"answer":"A","explanation":"平均速率是指物体运动的路程和通过这段路程所用时间的比。题干中“某一路段”是指路程，“进入和离开所用的时间”是通过这段路程所用的时间，二者的比值就是该车辆在这段时间的平均速率，可用该速率来估测车辆是否超速。\n故正确答案为A。","no":19,"missingImage":false},{"type":"question","qid":"2374675","cat":"人文常识","stem":"2019年3月12日，十三届全国人大二次会议举行第三次全体会议，听取审议最高人民法院工作报告和最高人民检察院工作报告。这体现了人民代表大会的（    ）。","options":{"A":"立法权","B":"决定权","C":"任免权","D":"监督权"},"answer":"D","explanation":"本题考查法律常识。\n全国人大有权监督由它产生的其他国家机关的工作，这些国家机关主要包括全国人大常委会、国务院、国家监察委员会、最高人民法院、最高人民检察院等，它们都要向全国人大负责，并报告工作。具体来说，全国人大听取并通过全国人大常委会的工作报告；听取最高人民法院、最高人民检察院的工作报告；改变或者撤销全国人民代表大会常务委员会不适当的决定等。\n故正确答案为D。","no":20,"missingImage":false},{"type":"question","qid":"2374680","cat":"人文常识","stem":"人才是实施乡村振兴战略的关键因素。以下举措不属于推动乡村人才振兴的是（    ）。","options":{"A":"大力支持乡村休闲旅游","B":"实施新乡贤返乡工程","C":"扩大“三支一扶”计划人员招募规模","D":"完善农村劳动力技能培训补贴机制"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，大力支持乡村休闲旅游，属于发展农村产业经济，并未体现出吸引、培育人才等方面的举措。\nB项正确，实施新乡贤返乡工程，属于吸引人才的举措，把更多从农村走出来的精英群体引回乡村创新创业。\nC项正确，扩大“三支一扶”计划人员招募规模，属于吸纳高校毕业生到基层工作的举措，大学生村官计划是向农村提供人才支撑的重要途径，能为建设高素质专业化“三农”工作干部队伍提供源头活水。\nD项正确，完善农村劳动力技能培训补贴机制，属于提升农村劳动力技能的举措，通过培训提高、吸引发展、培育储备，加快构建一支有文化、懂技术、善经营、会管理的新型职业农民队伍。\n本题为选非题，故正确答案为A。","no":21,"missingImage":false},{"type":"question","qid":"2374691","cat":"人文常识","stem":"近几年，我国政府出台了一系列减税降费的举措。减税降费有利于（    ）。\n①减轻企业负担、稳定就业\n②优化经济和收入分配结构\n③畅通小微企业融资渠道","options":{"A":"①②","B":"①③","C":"②③","D":"①②③"},"answer":"A","explanation":"本题考查经济常识。\n2019年3月21日，李克强总理考察财政部、税务总局并主持召开座谈会指出，要坚持以习近平新时代中国特色社会主义思想为指导，贯彻党中央、国务院决策部署，把大规模减税降费作为重大改革举措和宏观调控“当头炮”。这既利当前又利长远，不仅减轻企业负担、稳定就业，而且优化经济和收入分配结构，培育税源、促进财政可持续。要把减税加快落实到位，以企业活力更大释放保持经济运行在合理区间，推动高质量发展。因此①②正确。\n故正确答案为A。","no":22,"missingImage":false},{"type":"question","qid":"2374805","cat":"人文常识","stem":"2018年8月，国家提出衡量贫困人口是否脱贫的标准是“两不愁、三保障”，其中“两不愁”是指不愁吃、不愁穿。以下不属于“三保障”的是（    ）。","options":{"A":"基本医疗","B":"义务教育","C":"住房安全","D":"环境优美"},"answer":"D","explanation":"2015年中共中央、国务院制定的《关于打赢脱贫攻坚战的决定》是当前脱贫攻坚工作的总遵循。《决定》明确提出：到2020年，要稳定实现农村贫困人口不愁吃、不愁穿，义务教育、基本医疗、住房安全有保障，实现贫困地区农民人均可支配收入增长幅度高于全国平均水平，基本公共服务主要领域指标接近全国平均水平。《“十三五”脱贫攻坚规划》指出：现行标准下农村建档立卡贫困人口实现脱贫。贫困户有稳定收入来源，人均可支配收入稳定超过国家扶贫标准，实现“两不愁、三保障”。据此可知，A、B、C三项属于“三保障”，D项不属于。\n本题为选非题，故正确答案为D。","no":23,"missingImage":false},{"type":"question","qid":"2374670","cat":"人文常识","stem":"粤港澳大湾区包括香港特别行政区、澳门特别行政区和珠三角九市，是我国经济活力最强的区域之一，在国家发展大局中具有重要战略地位。以下关于粤港澳大湾区发展基础的说法，错误的是（    ）。","options":{"A":"经济实力雄厚","B":"创新要素集聚","C":"内部发展差距小","D":"国际化水平领先"},"answer":"C","explanation":"本题考查政治常识。2019年2月18日，中共中央、国务院印发了《粤港澳大湾区发展规划纲要》，《纲要》第一节指出，粤港澳大湾区发展基础为：区位优势明显、经济实力雄厚、创新要素集聚、国际化水平领先、合作基础良好。\nA项正确，粤港澳大湾区经济实力雄厚。经济发展水平全国领先，产业体系完备，集群优势明显，经济互补性强，香港、澳门服务业高度发达，珠三角九市已初步形成以战略性新兴产业为先导、先进制造业和现代服务业为主体的产业结构，2017年大湾区经济总量约10万亿元。\nB项正确，粤港澳大湾区创新要素集聚。创新驱动发展战略深入实施，广东全面创新改革试验稳步推进，国家自主创新示范区加快建设。粤港澳三地科技研发、转化能力突出，拥有一批在全国乃至全球具有重要影响力的高校、科研院所、高新技术企业和国家大科学工程，创新要素吸引力强，具备建设国际科技创新中心的良好基础。\nC项错误，内部发展差距小并非粤港澳大湾区的发展基础。\nD项正确，粤港澳大湾区国际化水平领先。香港作为国际金融、航运、贸易中心和国际航空枢纽，拥有高度国际化、法治化的营商环境以及遍布全球的商业网络，是全球最自由经济体之一。澳门作为世界旅游休闲中心和中国与葡语国家商贸合作服务平台的作用不断强化，多元文化交流的功能日益彰显。珠三角九市是内地外向度最高的经济区域和对外开放的重要窗口，在全国加快构建开放型经济新体制中具有重要地位和作用。\n本题为选非题，故正确答案为C。","no":24,"missingImage":false},{"type":"question","qid":"2374692","cat":"人文常识","stem":"只要把握住历史发展大势，抓住历史变革时机，奋发有为，锐意进取，人类社会就能更好前进。这句话体现的哲学原理是（    ）。","options":{"A":"物质和意识的辩证关系","B":"规律是可以认识和利用的","C":"事物发展是前进性和曲折性的统一","D":"实践是检验认识正确与否的唯一标准"},"answer":"B","explanation":"本题考查马克思主义哲学。\nA项错误，辩证唯物主义认为，世界的本原是物质的，物质决定意识，意识是物质的反映，意识对物质又具有能动作用。题干并未体现这一原理。\nB项正确，规律是可以认识和利用的。人们可以认识和把握规律，并根据规律发生作用的条件和形式，利用规律，改造客观世界，造福人类。题干中强调只要抓住历史发展大势，抓住历史变革时机，锐意进取，人类社会就能更好前进，体现了认识和利用规律的原理。\nC项错误，事物发展的总趋势是前进的，而发展的道路则是迂回曲折的。任何事物的发展都是前进性与曲折性的统一。前途是光明的，道路是曲折的，在前进中有曲折，在曲折中向前进，是一切新事物发展的途径。选项本身表述无误，但题干未体现这一原理。\nD项错误，实践是检验认识正确与否的唯一标准，选项本身表述无误，但题干未体现这一原理。\n故正确答案为B。","no":25,"missingImage":false},{"type":"question","qid":"2374808","cat":"人文常识","stem":"扶贫先扶智，治贫先治愚。以下扶贫举措中不属于“扶智”的是（    ）。","options":{"A":"在贫困村建设图书室","B":"开展农业实用技能培训","C":"组织大学生到贫困地区支教","D":"向贫困户发放现代化农业机具"},"answer":"D","explanation":"本题考查政治常识。\nA项正确，摆脱贫困首要并不是摆脱物质的贫困，而是摆脱意识和思路的贫困。贫困村建设图书室，有利于丰富贫困地区文化活动，武装贫困群众思想，振奋贫困地区和贫困群众精神风貌。\nB项正确，脱贫攻坚，群众动力是基础。必须坚持依靠人民群众，激发贫困群众内生动力。培养贫困群众发展生产和务工经商技能，组织、引导、支持贫困群众用自己的辛勤劳动实现脱贫致富，用人民群众的内生动力支撑脱贫攻坚。\nC项正确，扶贫先扶智，重点是要推进教育精准脱贫，把下一代的教育工作做好。大学生到贫困地区支教，帮助贫困人口子女接受良好教育，可以提升文化水平及思想道德素质，有利于阻断贫困代际传递，让每一个孩子都对自己有信心、对未来有希望。\nD项错误，治贫先治愚。贫穷并不可怕，怕的是智力不足、头脑空空，怕的是知识匮乏、精神委顿。对贫困地区来说，现代化农业机具终究只是外力，“扶智”才是内力，外力帮扶固然重要，但如果自身不努力、不作为，即使外力帮扶再大，也难以有效发挥作用。\n本题为选非题，故正确答案为D。","no":26,"missingImage":false},{"type":"question","qid":"2374809","cat":"人文常识","stem":"自2018年起，我国将每年农历（    ）定为“中国农民丰收节”，作为亿万农民庆祝丰收、享受丰收的节日。","options":{"A":"立春","B":"芒种","C":"秋分","D":"冬至"},"answer":"C","explanation":"本题考查政治常识。\n2018年6月7日，经党中央批准、国务院批复，自2018年起，将每年农历秋分设立为“中国农民丰收节”。这是第一个在国家层面专门为农民设立的节日。\n故正确答案为C。","no":27,"missingImage":false},{"type":"question","qid":"2374817","cat":"人文常识","stem":"消除贫困、改善民生、逐步实现（    ），是社会主义的本质要求，是我们党的重要使命。","options":{"A":"共同富裕","B":"同步富裕","C":"同时富裕","D":"全体富裕"},"answer":"A","explanation":"本题考查政治常识。\n习近平同志曾多次在扶贫工作会议中指出，消除贫困、改善民生、逐步实现共同富裕，是社会主义的本质要求，是我们党的重要使命。\n中国人多地广，共同富裕不是同时富裕，也不是同步富裕，而是一部分人一部分地区先富起来，先富的帮助后富的，逐步实现共同富裕。因此B、C、D三项错误。\n故正确答案为A。","no":28,"missingImage":false},{"type":"question","qid":"2374726","cat":"地理国情","stem":"广东属于岭南地区，具有深厚的岭南文化。以下诗句中描写岭南风物的是（    ）。","options":{"A":"此地空余黄鹤楼","B":"罗浮山下四时春","C":"风吹草低见牛羊","D":"不识庐山真面目"},"answer":"B","explanation":"本题考查地理国情。\n岭南，所谓 “岭南”，一般指南岭（又称 “五岭”）山脉以南， 包括今天广东 、广西 、海南、香港、澳门等地在内的广大地区 。\nA项错误，“昔人已乘黄鹤去，此地空余黄鹤楼”出自唐朝诗人崔颢的《黄鹤楼》。黄鹤楼，位于湖北省武汉市，紧依长江，自古就享有“天下江山第一楼”的赞誉。因此该诗描写的不属于岭南风物。\nB项正确，“罗浮山下四时春，卢橘杨梅次第新。日啖荔枝三百颗，不辞长作岭南人。”出自宋代苏轼的《惠州一绝》。罗浮山，位于广东省，是岭南四大名山之一。因此该诗描写的属于岭南风物。\nC项错误，“敕勒川，阴山下。天似穹庐，笼盖四野。天苍苍，野茫茫。风吹草低见牛羊。”出自《敕勒歌》，是南北朝时代敕勒族的一首民歌，描绘了北方草原壮丽富饶的风光。因此该诗描写的不属于岭南风物。\nD项错误，“不识庐山真面目，只缘身在此山中”出自宋代苏轼《题西林壁》。该诗作描绘的是庐山景色。庐山位于江西省九江市，因此该诗描写的不属于岭南风物。\n故正确答案为B。","no":29,"missingImage":false},{"type":"question","qid":"2374826","cat":"地理国情","stem":"港珠澳大桥跨越（    ），东接香港，西接广东珠海和澳门，总长约55公里，是粤港澳三地首次合作共建的超大型跨海交通工程。","options":{"A":"渤海","B":"东海","C":"北部湾","D":"伶仃洋"},"answer":"D","explanation":"本题主要考查政治常识。\n港珠澳大桥于2009年12月15日动工建设，2018年10月24日上午9时开通运营，是中国境内一座连接香港、珠海和澳门的桥隧工程，位于中国广东省伶仃洋区域内，为珠江三角洲地区环线高速公路南环段。港珠澳大桥东起香港国际机场附近的香港口岸人工岛，向西横跨南海伶仃洋后连接珠海和澳门人工岛，止于珠海洪湾立交。港珠澳大桥跨越的是伶仃洋，因此D项正确，ABC项错误。\n故正确答案为D。","no":30,"missingImage":false},{"type":"question","qid":"2374699","cat":"科技常识","stem":"“山上多植物，胜似修水库，有雨它能吞，无雨它能吐”。这一谚语形象地说明了森林具有（    ）的功能。","options":{"A":"净化空气","B":"过滤尘埃","C":"减小噪音","D":"涵养水源"},"answer":"D","explanation":"本题考查地理国情。\n“山上多植物，胜似修水库，有雨它能吞，无雨它能吐”这句谚语形象地说明了山上如果有多种植物，在雨水多的时候它能储水。在下雨时节，森林可以通过林冠和地面的残枝落叶等截住雨滴，减轻雨滴对地面的冲击，增加雨水渗入土地的速度和土壤涵养水分的能力；又由于森林中植物蒸腾作用巨大，不断向大气中散失水蒸气，此时森林地区空气湿度大，降水多，体现了无雨它能“吐”。\nABC项错误，净化空气、过滤尘埃、减小噪音都是森林的功能，但是与题意不符。\nD项正确，涵养水源功能是森林所具有的重要功能之一，题中正体现了森林的这一功能。\n故正确答案为D。","no":31,"missingImage":false},{"type":"question","qid":"2374687","cat":"人文常识","stem":"全面建成小康社会，最艰巨最繁重的任务在（    ），特别是在贫困地区。","options":{"A":"城市","B":"城镇","C":"社区","D":"农村"},"answer":"D","explanation":"本题考查政治常识。\n习近平总书记在河北省阜平县考察扶贫开发工作时的讲话中强调：“全面建成小康社会，最艰巨最繁重的任务在农村，特别是在贫困地区。没有农村的小康，特别是没有贫困地区的小康，就没有全面建成小康社会。”\n故正确答案为D。","no":32,"missingImage":false},{"type":"question","qid":"2374834","cat":"人文常识","stem":"俗话说：正月十五闹元宵。“闹”元宵的习俗包括张灯、观灯、舞龙、舞狮等。以下诗句与元宵节有关的是（    ）。","options":{"A":"火树银花合","B":"千里共婵娟","C":"遍插茱萸少一人","D":"爆竹声中一岁除"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，“火树银花合”出自唐代苏味道的《正月十五夜》，这首诗描写了洛阳城里元宵之夜的景色。\nB项错误，“婵娟”指嫦娥，也就是代指明月，“但愿人长久，千里共婵娟”出自苏轼的《水调歌头》，“千里共婵娟”与中秋节相关。\nC项错误，“遍插茱萸少一人”出自王维的《九月九日忆山东兄弟》，与重阳节相关。\nD项错误，“爆竹声中一岁除”出自王安石的《元日》，“元日”是农历正月初一。\n故正确答案为A。","no":33,"missingImage":false},{"type":"question","qid":"2374839","cat":"科技常识","stem":"2018年12月，中国发射的（    ）成为人类第一个着陆月球背面的探测器。","options":{"A":"神舟七号","B":"长征三号","C":"嫦娥四号","D":"天宫一号"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，神舟七号载人航天飞船是于2008年9月25日21点10分从中国酒泉卫星发射中心载人航天发射场发射升空的中国第三个载人航天飞船。\nB项错误，长征三号是以“长征二号丙”为原型加氢氧第三级组成的三级运载火箭。\nC项正确，嫦娥四号探测器于2018年12月8日2时23分发射升空飞向月球，2019年1月3日嫦娥四号成功着陆在了月球背面东经177.6度、南纬45.5度附近的预选着陆区，月球背面真正意义上第一次成功留下了人类探测器的身影。\nD项错误，天宫一号是中国第一个目标飞行器和空间实验室，于2011年9月29日21时16分在酒泉卫星发射中心发射。\n故正确答案为C。","no":34,"missingImage":false},{"type":"question","qid":"2374694","cat":"人文常识","stem":"地球内部具有巨大的热量，并通过不同途径由内向外散发地热能。以下现象与地热能有关的是（    ）。","options":{"A":"台风生成","B":"火山喷发","C":"山洪暴发","D":"岩石风化"},"answer":"B","explanation":"本题考查自然常识。\nA项错误，台风发源于热带海面，那里温度高，大量的海水被蒸发到了空中，形成一个低气压中心。随着气压的变化和地球自身的运动，流入的空气也旋转起来，形成一个逆时针旋转的空气漩涡，这就是热带气旋。只要气温不下降，这个热带气旋就会越来越强大，最后形成了台风，台风属于大气的运动，与地热能无关。\nB项正确，火山喷发是一种奇特的地质现象，是岩浆等喷出物在短时间内从火山口向地表的释放，是地壳运动的一种表现形式，也是地球内部热能在地表的一种最强烈的显示。\nC项错误，一般山洪泥石流形成于中高山区，这里相对高差大，河谷坡度陡峻，且大都表层为植皮覆盖有较厚的土体，土体下面为中深断裂及其派生级断裂切割的破碎岩石层，加之短历时雷暴雨，降水量巨大，就会引发山洪，因此山洪主要是由短时降雨引发的，与地热能无关。\nD项错误，岩石风化是指岩石在太阳辐射、大气、水和生物作用下出现破碎、疏松及矿物成分次生变化的现象。温度变化是引起岩石物理风化作用的最主要因素。由于温度的变化产生温差，温差可促使岩石膨胀和收缩交替地进行，久之则引起岩石破裂。岩石风化与地热能无关。\n故正确答案为B。","no":35,"missingImage":false}],"count":31,"answerable":31,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2374685","cat":"逻辑填空","stem":"多元的发展机会和自由的成长空间，是时代给予每个追梦人的馈赠；（    ）每个追梦人在前进道路上迈出的每一步，（    ）都在推动时代的进步。","options":{"A":"而  也","B":"但  却","C":"如果  就","D":"只有  才"},"answer":"A","explanation":"文段通过“；”表并列，体现出时代和追梦人两者之间的联系，时代给追梦人馈赠，追梦人推动时代进步。A项“而”和“也”均可表示并列，符合文意，当选。\nB项“但”和“却”均表转折；C项“如果······就”表假设；D项“只有······才”表示必要条件关系，三项均与文意不符，排除。\n故正确答案为A。","no":36,"missingImage":false},{"type":"question","qid":"2374800","cat":"逻辑填空","stem":"只要我们迈出的步伐足够坚实，前进的意志足够（    ），奋斗路上的困难终将被克服，前进路上的沟壑终将被跨越。","options":{"A":"强硬","B":"奋勇","C":"坚定","D":"坚硬"},"answer":"C","explanation":"括号处搭配“意志”。C项“坚定”指意志坚强，不动摇，“意志坚定”为常见搭配，体现出意志不动摇之意，且和后文“奋斗路上的困难终将被克服，前进路上的沟壑终将被跨越”形成对应，当选。\nA项，“强硬”指强有力的，倔强的，不作任何让步的，通常搭配为“态度强硬”；B项，“奋勇”指鼓起勇气；D项，“坚硬”侧重指硬度大，三项均与“意志”搭配不当，排除。\n故正确答案为C。 \n【文段出处】《半月谈评论：2019，让脚步更有力量》","no":37,"missingImage":false},{"type":"question","qid":"2374707","cat":"逻辑填空","stem":"近年来，各地纷纷大刀阔斧地开展（    ），向不担当不作为亮剑。","options":{"A":"整理","B":"整治","C":"修理","D":"梳理"},"answer":"B","explanation":"所填词语与“开展”搭配，分析文意可知，文段强调开展一些整顿、治理的工作来解决不担当不作为的问题。\nA项“整理”指使有条理有秩序，文段并非强调要使得“不担当不作为”这样一些情况变得有条理，而是侧重要解决这样一些不好的问题，不符合文意，故排除A项。\nB项“整治”含义为整顿、治理，填入文段当中与语境相符，当选。\nC项“修理”指对已损坏的东西给予加工，以便恢复原来的形状或作用，多搭配具体实物，如“修理工具”、“修理门窗”等，而文段当中需要解决的是“不担当不作为”等一些问题，故置于此处搭配不当，排除C项。\nD项“梳理”比喻对事物进行整理，与文段强调的解决“不担当不作为”的问题无关，不符合文意，故排除D项。\n故正确答案为B。\n【文段出处】《半月谈评论：惩治不担当不作为，不宜当成“万金油”》","no":38,"missingImage":false},{"type":"question","qid":"2374710","cat":"逻辑填空","stem":"在落实乡村振兴战略的过程中，一定要科学规划，（    ），才能最终实现目标，任何希望（    ）的想法都是不切实际的。","options":{"A":"循序渐进  一蹴而就","B":"寻根究底  一鼓作气","C":"蔚然成风  一劳永逸","D":"未雨绸缪  一马当先"},"answer":"A","explanation":"第一空，和“科学规划”构成同义并列表达，“科学规划”有规划、准备、渐进的意思，A项“循序渐进”指按照一定的步骤逐渐深入或提高（指学习或工作）；D项“未雨绸缪”比喻事先做好准备，两者都能体现深入事物、提前准备的意思，且和后文“最终实现目标”构成对应，符合文意，均保留；B项“寻根究底”指追究根底，泛指弄清一件事的来龙去脉，文段没有说要探求来源，不符合文意，排除；C项“蔚然成风”形容一件事情逐渐发展、盛行，形成一种风气（多指好的），文段没有说形成了一种风气，不符合文意，排除。\n第二空，结合文意体现振兴战略在慢慢规划中希望慢慢实现，希望马上能实现的想法是不切实际的。A项“一蹴而就”比喻事情轻而易举，很容易成功，体现马上实现，符合文意，当选。D项“一马当先”形容领先，也比喻工作走在群众前面，积极带头，文段没有说积极带头，且无对比的语境，不符合文意，排除。\n故正确答案为A。\n【出处】《乡村振兴不可急于求成，不能机械教条》","no":39,"missingImage":false},{"type":"question","qid":"2374700","cat":"逻辑填空","stem":"持续深入的人才发展体制机制改革，为（    ）、（    ）、（    ）、（    ）打牢了坚实基础，有力推进了新时代中国特色社会主义伟大事业不断夺取新的伟大胜利。","options":{"A":"引才  聚才  用才  育才","B":"聚才  用才  育才  引才","C":"用才  育才  引才  聚才","D":"育才  引才  聚才  用才"},"answer":"D","explanation":"本题可从第四空入手。所填的四个词语通过顿号表并列，且根据“持续深入的人才发展体制机制改革”可知，所填词语体现语义上的顺承关系，“育才”即培育新的人才，“引才”即引入人才，“聚才”即汇聚人才，这三种做法最终要达到的结果是“用才”，即把人才用好，所以第四空填入“用才”最契合文意，锁定D项。A项“育才”、B项“引才”、C项“聚才”都不是最终要达到的结果，排除A、B、C三项。\n故正确答案为D。\n【文段出处】光明日报《爱才敬才成就人尽其才》","no":40,"missingImage":false},{"type":"question","qid":"2374801","cat":"片段阅读","stem":"回顾40年，改革开放旗帜之所以始终高高飘扬，关键得益于基层求新求变的强大意愿以及敢闯敢试的探索精神。改革再扬帆，也必须尊重基层干部群众在改革进程中的主体性作用。\n对这段文字理解准确的是（    ）。","options":{"A":"实践是改革开放最关键的一环","B":"基层的探索精神完全决定于改革的效果","C":"改革必须发挥基层干部群众的主观能动性","D":"改革开放促使基层创新求变"},"answer":"C","explanation":"根据文段“改革再扬帆，也必须尊重基层干部群众在改革进程中的主体性作用”可知，C项表述正确，当选；\nA项，“实践是改革开放最关键的一环”，文段并未提及，无中生有，排除；\nB项，因果倒置，文段说的是改革的效果“得益于基层求新求变的强大意愿以及敢闯敢试的探索精神”，且“完全决定于”表述过于绝对，文段说的是“得益于”；同时，“基层的探索精神”表述片面，文段通过“以及”并列表述还包含有“强大意愿”，故表述不准确，排除；\nD项，逻辑错误，“促使”无中生有，文段意在强调“改革开放旗帜之所以始终高高飘扬，关键得益于基层求新求变的强大意愿”，故表述不准确，排除。\n故正确答案为C。\n【出处】《改革开放再出发，基层跑起来》","no":41,"missingImage":false},{"type":"question","qid":"2374802","cat":"片段阅读","stem":"尽管从农业社会走向现代社会，是经济社会发展的必然，但这样不是促使农业农村的“消亡”。做好“三农”工作，建设好农村，发展好农业，使广大农民获得感、幸福感、安全感不断提升，依然是社会主义建设的主要内容。\n这段文字主要说明了（    ）。","options":{"A":"我国目前仍然处于农业社会","B":"“三农”工作的重要性","C":"农业农村会随着经济社会的发展“消亡”","D":"广大农民的获得感、幸福感、安全感有待提升"},"answer":"B","explanation":"文段开篇交待背景“从农业社会走向现代社会，是经济社会发展的必然”，紧接着通过转折词“但”引出文段的重点，强调“做好‘三农’工作，依然是社会主义建设的重要内容”，故整个文段重点强调做好“三农”工作的重要性，对应B项。\nA项，“农业社会”为文段转折之前交待背景的内容，非重点，排除；\nC项，“农业农村会随着经济社会的发展‘消亡’”与文意相悖，文段说的是“不是促使农业农村的‘消亡’”，排除； \nD项，“广大农民的获得感、幸福感、安全感”的提升是做好“三农”工作之后带来的效果，非重点，排除。\n故正确答案为B。\n【文段出处】《半月谈评论：强化优先意识，做好“三农”工作》","no":42,"missingImage":false},{"type":"question","qid":"2374671","cat":"片段阅读","stem":"扶贫干部自掏腰包到基层扶贫，是真扶贫、扶真贫的体现。但若一味宣扬扶贫干部自掏腰包扶贫，不仅会加重扶贫干部的经济负担，还会在一定程度上让贫困群众产生依赖心理。\n对这段文字理解准确的是（    ）。","options":{"A":"一味宣扬扶贫干部自掏腰包扶贫具有一定的副作用","B":"应该大力提倡扶贫干部自掏腰包支持贫困户","C":"当前存在大量扶贫干部自掏腰包扶贫的情况","D":"扶贫干部自掏腰包扶贫是不得已而为之的"},"answer":"A","explanation":"根据提问方式可知，本题为细节判断题。\nA项，根据文段“一味宣扬扶贫干部自掏腰包扶贫，不仅会加重······负担······还会······”可知，一味宣扬扶贫干部自掏腰包扶贫会带来一些危害，表述正确，当选；\nB项的“大力提倡”与文意相悖，文段表述为一味提倡有危害，排除；\nC、D两项的“存在大量······情况”“不得已而为之”均在文段中没有体现，无中生有，排除。\n故正确答案为A。\n【文段出处】《干部为扶贫自掏腰包，该不该提倡》","no":43,"missingImage":false},{"type":"question","qid":"2374803","cat":"片段阅读","stem":"完善村民自治，应推动乡村治理重心下移，尽可能把资源、服务、管理下放到基层，培育打造服务性、公益性、互助性农村社会组织，开展农村社会工作和志愿服务，发挥新乡贤作用。\n对这段文字理解准确的是（    ）。","options":{"A":"完善村民自治需要大量引进志愿者","B":"完善村民自治需要让乡贤发挥主要作用","C":"完善村民自治需要把所有资源下放到基层","D":"完善村民自治需要发展农村社会组织"},"answer":"D","explanation":"文段开篇指出完善村民自治，应推动乡村治理重心下移，把管理等下放到基层，即政府要简政放权，由“政府管理”转变为“社会治理”，之后论述要培育农村社会组织，开展社会工作和志愿服务，发挥新乡贤作用。\n由“培育打造服务性、公益性、互助性农村社会组织”可知，D项正确。\nA项，“大量引进志愿者”偷换概念，文段表述为通过农村社会组织“开展志愿服务”，排除；\nB项，“乡贤发挥主要作用”文段未提及，无中生有，排除；\nC项，“把所有资源下放到基层”，表述过于绝对，文段为“尽可能把资源下放到基层”，排除。\n故正确答案为D。\n【文段出处】《中共中央、国务院关于实施乡村振兴战略的意见》","no":44,"missingImage":false},{"type":"question","qid":"2374714","cat":"片段阅读","stem":"推动媒体融合发展，事关推进国家治理体系和治理能力现代化。在全媒体时代，媒体不仅是信息的提供者和传播者，而且在国家治理中也发挥着重要作用。因此，媒体融合不仅仅是一个传播命题，还是一个治理命题。\n这段文字的主旨是（    ）。","options":{"A":"国家治理现代化需要促进媒体融合","B":"媒体融合发展有利于促进信息传播","C":"媒体融合发展是信息技术发展的需要","D":"媒体在国家治理中应承担主要责任"},"answer":"A","explanation":"文段开篇点明推动媒体融合发展对于国家治理很重要，引出“媒体融合”这一话题，后文分析媒体对信息提供传播和国家治理有重要作用，尾句通过“因此”总结，媒体融合不仅是传播命题还是治理命题。“不仅仅······还是······”，更多强调是媒体融合是个治理命题。首尾呼应，故文段重点强调“媒体融合”对于国家治理很重要，对应A项。\nB项，信息传播对应的是“因此”之前的内容，非重点，排除；\nC项，“信息技术发展”无中生有，文段并未提及，排除；\nD项，文段话题为“媒体融合”而非“媒体”，偷换概念，排除。\n故正确答案为A。\n【出处】《人民日报:推动媒体融合发展 事关国家治理能力现代化》","no":45,"missingImage":false}],"count":10,"answerable":10,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2374845","cat":"数学运算","stem":"4  7  10  13  （    ）","options":{"A":"15","B":"16","C":"17","D":"18"},"answer":"B","explanation":"观察数列，此数列是公差为3的等差数列，所求项为\u003cimg data-k=\"e9f88ac8b84e\">。\n故正确答案为B。","no":46,"missingImage":false},{"type":"question","qid":"2374847","cat":"数学运算","stem":"5  9  17  33  （    ）","options":{"A":"35","B":"45","C":"65","D":"85"},"answer":"C","explanation":"数列起伏较小，首先考虑作差。作差后得到新数列：4、8、16、（ ），是公比为2的等比数列，故括号内应为32。题干所求项为\u003cimg data-k=\"d73e6e9e17db\">。\n故正确答案为C。","no":47,"missingImage":false},{"type":"question","qid":"2374848","cat":"数学运算","stem":"5  15  45  135  （    ）","options":{"A":"185","B":"225","C":"355","D":"405"},"answer":"D","explanation":"观察数列，此数列是公比为3的等比数列，所求项为\u003cimg data-k=\"317fe6b3ccf7\">。\n故正确答案为D。","no":48,"missingImage":false},{"type":"question","qid":"2374849","cat":"数学运算","stem":"64  32  16  8  （    ）","options":{"A":"4","B":"5","C":"6","D":"7"},"answer":"A","explanation":"观察数列，此数列是公比为\u003cimg data-k=\"0f1fa1d0536c\">的等比数列，所求项为\u003cimg data-k=\"3323a68976f7\">。\n故正确答案为A。","no":49,"missingImage":false},{"type":"question","qid":"2374850","cat":"数学运算","stem":"\u003cimg data-k=\"0f1fa1d0536c\">  \u003cimg data-k=\"97dceef419de\">  \u003cimg data-k=\"99b62428eced\">  \u003cimg data-k=\"b28026563097\">  （    ）","options":{"A":"\u003cimg data-k=\"2844f6787086\">","B":"\u003cimg data-k=\"335ec885ebfa\">","C":"\u003cimg data-k=\"fea6f0bebfdd\">","D":"\u003cimg data-k=\"b2b6bdddf99b\">"},"answer":"A","explanation":"观察数列特征，此数列为分数数列。分别观察分子分母的 le=\"max-width:468px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题为空间重构题。\n在立体图形中，三条虚线面两两相邻，没有构成相对面。而A项中，存在一组虚线面是相对面（如下图所示），不可能同时出现在立体图形中。\n\u003cimg data-k=\"f2b8b0e113b7\" style=\"max-width:206px\">\n本题为选非题，故正确答案为A。","no":68,"missingImage":false},{"type":"question","qid":"2374748","cat":"图形推理","stem":"一个正方形旋转\u003cimg data-k=\"ba8af23e56ca\">后，其旋转轨迹不可能形成的图形是（    ）。\n\u003cimg data-k=\"ca62ba4a0545\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"逐一分析选项。\n\u003cimg data-k=\"bd7e1dca3b36\" style=\"max-width:700px\">\nA项：沿正方形的对角线旋转\u003cimg data-k=\"ba8af23e56ca\">可得到选项（如上图），排除；\nB项：沿正方形的轴对称线旋转\u003cimg data-k=\"ba8af23e56ca\">可得到选项（如上图），排除；\nC项：选项无法由正方形旋转而成，当选；\nD项：沿正方形的某一边旋转\u003cimg data-k=\"ba8af23e56ca\">可得到选项（如上图），排除。\n本题为选非题，故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"2374815","cat":"类比推理","stem":"如图所示，所给物体的俯视图不可能是（    ）。\n\u003cimg data-k=\"1a1ac1dd59b0\" style=\"max-width:562px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"给定物体可看作由从前往后4排小正方体组成，且右上角最后一排从侧面看到已有小正方体存在，所以在俯视图上，右上角不可能缺了一个小正方形，如下图所示。\n\u003cimg data-k=\"32539463d145\" style=\"max-width:560px\">\n本题为选非题，故正确答案为B。","no":70,"missingImage":false},{"type":"question","qid":"2374818","cat":"类比推理","stem":"民风：淳朴","options":{"A":"阳光：灿烂","B":"书本：文化","C":"树木：开花","D":"喜悦：笑容"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“淳朴”的“民风”，“淳朴”用来形容“民风”，且“淳朴”是形容词，二者之间是偏正关系。\n第二步：判断选项词语间逻辑关系。\nA项：“灿烂”的“阳光”，“灿烂”用来形容“阳光”，且“灿烂”是形容词，二者之间是偏正关系，与题干逻辑关系一致，当选；\nB项：通过“书本”可以获得“文化”，二者属于对应关系，与题干逻辑关系不一致，排除；\nC项：“开花”是“树木”的一种或然形式，且“开花”是动宾短语，与题干逻辑关系不一致，排除；\nD项：“喜悦”时会露出“笑容”，二者属于对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":71,"missingImage":false},{"type":"question","qid":"2374820","cat":"类比推理","stem":"纺织：布匹","options":{"A":"矿石：金属","B":"努力：收获","C":"工作：奉献","D":"耕种：粮食"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“纺织”是动作，“布匹”是成品，通过“纺织”得到“布匹”，二者是动作和成品的对应关系，且“布匹”是实物。\n第二步：判断选项词语间逻辑关系。\nA项：“矿石”是指可从中提取有用组分或其本身具有某种可被利用的性能的矿物集合体，可分为金属矿物、非金属矿物。“矿石”和“金属”二者是交叉关系，与题干逻辑关系不一致，排除；\nB项：通过“努力”获得“收获”，但“收获”是抽象名词，与题干逻辑关系不一致，排除；\nC项：“工作”中需要“奉献”精神，二者不是动作和成品的对应关系，与题干逻辑关系不一致，排除；\nD项：“耕种”是动作，“粮食”是成品，通过“耕种”得到“粮食”，二者是动作和成品的对应关系，且“粮食”是实物，与题干逻辑关系一致，当选。\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"2374824","cat":"类比推理","stem":"水稻：植物","options":{"A":"木耳：银耳","B":"香蕉：水果","C":"动物：田鼠","D":"米饭：面条"},"answer":"B","explanation":"第一步，判断题干词语间逻辑关系。\n题干中“水稻”是一种“植物”，二者是种属关系。\n第二步，判断选项词语间逻辑关系。\nA项：“木耳”和“银耳”都是一种真菌，二者是并列关系，与题干逻辑关系不一致，排除；\nB项：“香蕉”是一种“水果”，二者是种属关系，与题干逻辑关系一致，当选；\nC项：“田鼠”是一种“动物”，但是顺序反了，与题干逻辑关系不一致，排除；\nD项：“米饭”和“面条”是两种不同的食物，二者是并列关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":73,"missingImage":false},{"type":"question","qid":"2374829","cat":"类比推理","stem":"丰富：贫乏","options":{"A":"体贴：粗犷","B":"精致：丑恶","C":"拘束：随意","D":"振奋：高兴"},"answer":"C","explanation":"第一步，判断题干词语间逻辑关系。\n“丰富”指种类多或数量大，“贫乏”指缺少，二者为反义关系。\n第二步，判断选项词语间逻辑关系。\nA项：“体贴”指细心忖度别人的心情和处境，给予关切、照顾，“粗犷”指粗鲁豪放，二者无语义关系，与题干逻辑关系不一致，排除；\nB项：“精致”指精巧细致，“丑恶”指丑陋恶劣，二者无语义关系，与题干逻辑关系不一致，排除；\nC项：“拘束”指过分约束，“随意”指任凭自己的意思，不约束，二者为反义关系，与题干逻辑关系一致，当选；\nD项：“振奋”指精神振作奋发，“高兴”指心情好，二者无语义关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":74,"missingImage":false},{"type":"question","qid":"2374832","cat":"类比推理","stem":"贫困：扶贫：脱贫","options":{"A":"垃圾：清扫：整洁","B":"拥堵：交警：畅通","C":"噪音：抑制：平静","D":"羸弱：锻炼：健壮"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“贫困”需要“扶贫”，达到“脱贫”的目的，题干为状态、方式、目的的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“垃圾”是名词，不是一种状态，题干逻辑关系不一致，排除；\nB项：“拥堵”需要的是“疏通”，“交警”不是方式，与题干逻辑关系不一致，排除；\nC项：“噪音”需要“抑制”，但目的应该是“安静”，不是“平静”，与题干逻辑关系不一致，排除；\nD项：“羸弱”是一种状态，“羸弱”需要通过“锻炼”变“健壮”，与题干逻辑关系一致，当选。\n故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"2374736","cat":"逻辑判断","stem":"一座城市要想发展好会展产业，就需要“筑巢引凤”——先具备软硬件基础，再吸引会展活动。拥有完备的会展设施和理想的交通条件，只是说明一座城市具备了发展会展产业的硬件基础，要想吸引足够数量的高质量会展活动，还需要提高公共服务水平、构建良好的营商环境，从而加强软实力的建设。\n如果上述表述为真，则以下情况中不可能发生的是（    ）。","options":{"A":"甲市具备了发展会展产业的硬件基础，却发展不好会展产业","B":"乙市大力提升公共服务水平，吸引了足够数量的高质量会展活动","C":"丙市的会展产业非常发达，但市政设施老化的问题日渐突出","D":"丁市会展设施完备、交通条件理想，但未具备发展会展产业的硬件基础"},"answer":"D","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：据题干第一句话可知，发展会展产业需要软硬件基础，而甲市只具备硬件基础，软件基础不明确，所以是有可能发展不好会展产业的，排除；\nB项：据题干第二句话可知，要想吸引足够数量的高质量会展活动，需要提高公共服务水平、构建良好的营商环境，乙市已经提高公共服务水平了，构建良好的营商环境不明确，所以有可能可以吸引足够数量的高质量会展活动，排除；\nC项：据题干第一句话可知，要想发展好会展产业，就需要具备软硬件基础，丙市会展产业非常发达，说明具备软硬件基础，但市政设施如何题干没有提及，即不明确，是有可能发生的，排除；\nD项：据题干第二句话可知，拥有完备的会展设施和理想的交通条件，就说明这座城市具备了发展会展产业的硬件基础，丁市会展设施完备、交通条件理想，是具备了发展会展产业的硬件基础的，因此不可能发生，当选。\n本题为选非题，故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"2374753","cat":"逻辑判断","stem":"G市经济发达、教育资源丰富，许多在G市就读的大学生毕业后都选择留在G市工作生活。但在今年，G市周边的几个城市都出台了一系列针对大学生落户的优惠政策，许多G市大学生因此选择将户口迁往周边城市。由此可以预测，今年留在G市的大学生将会更容易找到工作。\n以下最能反驳上述论证的是（    ）。","options":{"A":"G市周边的几个城市中，大学生同样不容易找到心仪的工作","B":"与去年相比，今年G市的几个大型工厂招收工人数量有所减少","C":"绝大多数将户口迁往周边城市的G市大学生仍然选择在G市工作","D":"有调查指出，过去几年在G市的大学生并没有面临很大的就业压力"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：今年留在G市大学生将会更容易找到工作。\n论据：在今年，G市周边的几个城市都出台了一系列针对大学生落户的优惠政策，许多G市大学生因此选择将户口迁往周边城市。\n本题的论点讨论的是找工作的难易程度，而论据讨论的是出台政策使得大学生迁户口，两者讨论的话题不一致，优先考虑通过拆桥削弱，说明大学生迁户口与找工作的难易程度没关系。\n第二步：逐一分析选项。\nA项：题干讨论的是G市的就业情况，而该选项讨论的是其他周边几个城市，话题不一致，无法削弱，排除；\nB项：与去年相比，今年G市的几个大型工厂招收工人数量有所减少，但大学生原本会不会去这几个大型工厂当工人并不明确，无法削弱，排除；\nC项：绝大多数将户口迁往周边城市的G市大学生仍然选择留在G市工作，说明即使大学生将户口迁离G市，但是绝大多数人都选择在G市工作，找工作的人并不会减少，说明论据的迁户口和论点的找工作容易度没有关系，拆断了论点和论据的联系，可以削弱，当选；\nD项：过去几年在G市的大学生没有面临很大的就业压力，该选项讨论的是过去几年的事情，而题干论点讨论的是今年的就业会不会更容易，话题不一致，无法削弱，排除。\n故正确答案为C。","no":77,"missingImage":false},{"type":"question","qid":"2374741","cat":"逻辑判断","stem":"在发达国家的产业结构中，服务业占了很高的比重。根据他们的经验，提高服务业占比就可以促进就业。但是，服务业具有较高的进入壁垒，这也是我国服务业发展相对滞后的一个重要原因。因此，我国可以通过打破服务业的行业壁垒进一步促进就业。\n以下最可能是上述论证潜在假设的是（    ）。","options":{"A":"服务业促进就业的规律适用于我国","B":"我国创造就业的能力弱于发达国家","C":"发达国家的服务业也存在行业壁垒","D":"其他行业对促进就业没有显著作用"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：我国可以通过打破服务业的行业壁垒进一步促进就业。\n论据：在发达国家的产业结构中，服务业占了很高的比重。根据他们的经验，提高服务业占比就可以促进就业。但是，服务业具有较高的进入壁垒，这也是我国服务业发展相对滞后的一个重要原因。\n本题的问法为“假设”，论点是我国可以打破服务业壁垒来促进就业，论据是提高服务业占比就可以促进就业，而服务业壁垒影响到服务业发展。二者话题一致，考虑必要条件，即服务业促进就业是可行的。\n第二步：逐一分析选项。\nA项：说明在我国服务业是可以促进就业的，那么打破服务业壁垒促进服务业发展就可以进一步促进就业，是论证成立的假设，当选；\nB项：论点说的是服务业和就业之间的关系，该项说的是创造就业能力和发达国家之间的对比，话题不一致，不是论证成立的假设，排除；\nC项：论点说的是我国服务业和就业之间的关系，该项说的是发达国家的服务业存在行业壁垒，话题不一致，不是论证成立的假设，排除；\nD项：论点说的是服务业和就业之间的关系，该项说的是其他行业和促进就业之间的关系，主体不一致，不是论证成立的假设，排除。\n故正确答案为A。","no":78,"missingImage":false},{"type":"question","qid":"2374757","cat":"定义判断","stem":"近年来随着大型野生动物园的兴起，有人提出，传统城市动物园已经没有存在的必要性。但传统城市动物园具有票价低、交通便利等优点，中小学组织参观十分方便，因而具有很强的教育功能，所以传统城市动物园不可或缺。\n以下不属于上述论证缺陷的是（    ）。","options":{"A":"忽视了野生动物园和传统城市动物园具有并存的可能性","B":"默认了具有很强教育功能的传统城市动物园就应该保留","C":"忽视了票价低、交通便利不等同于方便中小学组织参观","D":"默认了方便中小学组织参观的动物园都具有很强的教育功能"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：传统城市动物园不可或缺。\n论据：传统城市动物园具有票价低、交通便利等优点，中小学组织参观十分方便，因而具有很强的教育功能。\n本题的问法较为新颖，其实论证缺陷就是题干中的漏洞，而该题问的是“不属于上述论证缺陷的是”，即排除能够指出题干中存在漏洞的选项即可。\n第二步：逐一分析选项。\nA项：该项讨论的是“野生动物园和传统城市动物园能否并存”，而论点讨论的是“传统城市动物园是否不可或缺”，话题不一致，无法指出论证缺陷，当选；\nB项：默认了论据“教育功能”与论点“传统城市动物园不可或缺”之间的关系，指出论点论据具有联系，通过搭桥指出论证缺陷，排除；\nC项：忽视了“票价低、交通便利不等同于方便中小学组织参观”，也就是票价低、交通便利不一定方便参观，并非不可或缺，拆断论点论据联系，通过拆桥指出论证缺陷，排除；\nD项：默认了“方便中小学组织参观的动物园都具有很强的教育功能”，指出论点论据具有联系，通过搭桥指出论证缺陷，排除。\n本题为选非题，故正确答案为A。","no":79,"missingImage":false},{"type":"question","qid":"2374745","cat":"逻辑判断","stem":"历史经验告诉我们，世界经济危机往往伴随着巨大的世界变革：1857年世界经济危机后的电气革命，推动人类社会从蒸汽时代进入电气时代；1929年世界经济危机引发了第二次世界大战，客观上推动了科学技术的发展。由此可知，是经济危机造成了巨大的世界变革。\n以下和该论证过程的逻辑最为类似的是（    ）。","options":{"A":"不正确的坐姿会加重颈部负担，因而是腰酸背痛的主要诱因","B":"海底地震是海啸的主要成因，因为海啸发生前往往能观测到海底地震","C":"宇航员的预期寿命明显高于一般人，因此太空旅行中的辐射暴露并不会危害人体","D":"许多体弱多病的人都不喜欢吃蔬菜，所以想保持身体健康就必须从蔬菜中摄入足量的膳食纤维"},"answer":"B","explanation":"第一步：分析题干逻辑关系。\n题干是在说发生世界经济危机之后，会发生巨大的世界变革，得出的结论是经济危机造成了巨大的世界变革。\n即A、B先后发生，则先发生的A为因，后发生的B为果(认为先后顺序代表因果关系)。\n第二步：逐一分析选项。\nA项：指出不正确的坐姿加重颈部负担，而结论是腰酸背痛的主要诱因，出现了不正确坐姿、加重颈部负担和腰酸背痛3件事，与题干中逻辑关系不一致，排除；\nB项：先观测到海底地震，再发生海啸，得出结论海底地震是海啸的主要成因，符合A、B先后发生，则先发生的A为因，后发生的B为果，与题干中逻辑关系一致，当选；\nC项：宇航员的预期寿命明显高于一般人，因此太空旅行中的辐射暴露并不会伤害人体，完全没有指明具有先后发生的两件事，与题干中逻辑关系不一致，排除；\nD项：许多体弱多病的人都不喜欢吃蔬菜，看不出体弱多病和不喜欢吃蔬菜的先后顺序，与题干中逻辑关系不一致，排除。\n故正确答案为B。","no":80,"missingImage":false}],"count":20,"answerable":20,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        过去5年，我国统筹开展交通扶贫和“   return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');

  };
}

function openSettings(){

    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;

  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

    +'</select>';

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
