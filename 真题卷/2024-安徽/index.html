">","options":{"A":"\u003cimg data-k=\"16e92dbe89c6\">","B":"\u003cimg data-k=\"2bcf67cfddd7\">","C":"\u003cimg data-k=\"c6419186d2a5\">","D":"\u003cimg data-k=\"f2a7d5711535\">"},"answer":"D","explanation":"如下图所示，扇形GEF与AC相切于点H，连接GH，则\u003cimg data-k=\"94b12a2abc94\">，且三角形GEF为正三角形，则GE=GF=EF=GH=AB，即三角形GEF的边长与正方形ABDC的边长相等。已知\u003cimg data-k=\"a8cb3dd64ad7\">，则EF=AB=5cm，\u003cimg data-k=\"5074d2575fd8\">。由于正三角形内角为\u003cimg data-k=\"86c1f89cc9f5\">，\u003cimg data-k=\"6e9a29b49cb8\">，则所求钻头的截面积\u003cimg data-k=\"f8ef01e1d728\">\u003cimg data-k=\"9518bc932334\">\u003cimg data-k=\"f5d3e0fecbc0\">。\n\u003cimg data-k=\"9e075890ccf3\" style=\"max-width:241px\">\n故正确答案为D。","no":60,"missingImage":false}],"count":15,"answerable":15,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"16593027","cat":"类比推理","stem":"兵符：信物","options":{"A":"七律：绝句","B":"汉字：偏旁","C":"干戈：战争","D":"寒露：节气"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n兵符是古代帝王授予兵权和调发军队的信物，兵符是一种信物，二者为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：七律是律诗的一种，绝句和律诗均是格律诗的一种，七律和绝句不是种属关系，与题干逻辑关系不一致，排除；\nB项：偏旁是组成汉字的一部分，二者为组成关系，与题干逻辑关系不一致，排除；\nC项：干为防具，戈为武器，二者均为古代兵器，因此后以“干戈”用作兵器的通称，后来引申为指战争，干戈和战争为比喻象征义，与题干逻辑关系不一致，排除；\nD项：寒露，是二十四节气之第十七个节气，秋季的第五个节气，寒露是一种节气，二者为种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":61,"missingImage":false},{"type":"question","qid":"16593010","cat":"类比推理","stem":"伸延：延伸","options":{"A":"登攀：攀登","B":"喜欢：欢喜","C":"生产：产生","D":"等次：次等"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n伸延，指的是伸展、延伸；延伸，指的是延长伸展，二者为近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：登攀，指攀援登高，也指进取；攀登，指的是抓住东西向上爬，也比喻不畏艰险,积极进取，二者为近义关系，与题干逻辑关系一致，保留；\nB项：喜欢，指的是对人或事物有好感或感兴趣，也指愉快、高兴；欢喜，指快乐、高兴，也指喜欢、喜爱，二者是近义关系，与题干逻辑关系一致，保留；\nC项：生产，指的是人们通过工具来创造各种生活和生产资料；产生，指的是由已有的事物中派生出新的事物，二者不是近义关系，与题干逻辑关系不一致，排除；\nD项：等次，指的是等级高下次序；次等，指的是第二等的，低于或次于最好的，二者不是近义关系，与题干逻辑关系不一致，排除。\n比较A、B两项，题干和A选项的词汇都只是动词，而B选项的欢喜既可以做动词也可以做形容词，故A项与题干逻辑关系更一致。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"16593210","cat":"类比推理","stem":"网箱养殖：深海养殖","options":{"A":"网络设备：无线网卡","B":"成人教育：职业教育","C":"载人飞船：返回舱","D":"娱乐项目：剧本杀"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n有的网箱养殖是深海养殖，有的网箱养殖不是深海养殖，有的深海养殖是网箱养殖，有的深海养殖不是网箱养殖，二者为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：无线网卡是一种网络设备，二者为种属关系，与题干逻辑关系不一致，排除；\nB项：有的成人教育是职业教育，有的成人教育不是职业教育，有的职业教育是成人教育，有的职业教育不是成人教育，二者为交叉关系，与题干逻辑关系一致，当选；\nC项：返回舱是载人飞船的一部分，二者为组成关系，与题干逻辑关系不一致，排除；\nD项：剧本杀是一种娱乐项目，二者为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":63,"missingImage":false},{"type":"question","qid":"10204456","cat":"类比推理","stem":"不胜枚举：寥若晨星","options":{"A":"指鹿为马：颠倒黑白","B":"众望所归：不负众望","C":"国泰民安：安居乐业","D":"杀鸡取卵：高瞻远瞩"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n不胜枚举指无法一个一个全部列举出来，形容同一类的人或事物很多；寥若晨星指稀疏得像早晨的星星一样，形容为数极少，二者是反义关系。\n第二步：判断选项词语间逻辑关系。\nA项：指鹿为马的意思是指着鹿说是马，比喻有意颠倒黑白，混淆是非；颠倒黑白指把黑的说成白的，白的说成黑的，颠倒是非，二者是近义关系，与题干逻辑关系不一致，排除；\nB项：众望所归指某人得到大家的信赖，希望他担任某项工作或完成事情；不负众望指不辜负大家的期望，二者是近义关系，与题干逻辑关系不一致，排除；\nC项：国泰民安指国家太平，人民生活安定，形容社会安定，人民生活幸福；安居乐业指安定地生活，愉快地工作，二者不是反义关系，与题干逻辑关系不一致，排除；\nD项：杀鸡取卵比喻贪图眼前微小的好处而损害长久的利益；高瞻远瞩指站得高、看得远，比喻目光远大，二者是反义关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":64,"missingImage":false},{"type":"question","qid":"16593015","cat":"类比推理","stem":"服装：唐装：西装","options":{"A":"刷牙：牙刷：牙膏","B":"豪车：赛车：轿车","C":"旗帜：国旗：红旗","D":"武术：太极拳：咏春拳"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n唐装和西装是两种不同的服装，后两词为并列关系，且均与第一词构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：牙刷和牙膏是刷牙时配套使用的工具，后两词为配套使用关系，与题干逻辑关系不一致，排除；\nB项：豪车、赛车和轿车是从不同的划分角度命名的汽车，三者互为交叉关系，与题干逻辑关系不一致，排除；\nC项：有的国旗是红旗，有的国旗不是红旗，有的红旗是国旗，有的红旗不是国旗，后两词为交叉关系，与题干逻辑关系不一致，排除；\nD项：太极拳和咏春拳是两种不同的武术，后两词为并列关系，且均与第一词构成种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":65,"missingImage":false},{"type":"question","qid":"16593007","cat":"类比推理","stem":"锁骨：肋骨：坐骨","options":{"A":"头脑：头皮：头发","B":"腹腔：口腔：鼻腔","C":"盲肠：大肠：直肠","D":"颈椎：胸椎：腰椎"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n锁骨、肋骨、坐骨是三种不同的人体骨骼，三者为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：头脑由头发、头皮、肌肉、骨骼和脑体组成，后两词均与第一词构成组成关系，与题干逻辑关系不一致，排除；\nB项：腹腔、口腔、鼻腔是三种不同的人体部位，三者为并列关系，与题干逻辑关系一致，保留；\nC项：大肠是消化管的下段，可分为盲肠、阑尾、结肠、直肠和肛管5部分，第一词与第三词为并列关系，且均与第二词构成组成关系，与题干逻辑关系不一致，排除；\nD项：颈椎、胸椎、腰椎是三种不同的椎骨，三者为并列关系，与题干逻辑关系一致，保留。\n对比B、D两项，题干中锁骨、肋骨、坐骨所在的位置依次为从上到下，B项中腹腔、口腔、鼻腔所在的位置依次为从下到上，而D项中颈椎、胸椎、腰椎所在的位置依次为从上到下，因此D项与题干逻辑关系更为一致，当选。\n故正确答案为D。","no":66,"missingImage":false},{"type":"question","qid":"16592936","cat":"类比推理","stem":"热传递：热传导：热辐射","options":{"A":"隔离：冷却：灭火","B":"混合物：化合物：纯净物","C":"播种：撒播：条播","D":"说明文：举例子：作比较"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n热传递是物理学上的一个物理现象，是指由于温度差引起的热能传递现象，热传递主要存在三种基本形式：热传导、热辐射和热对流。热传导和热辐射为并列关系，分别与热传递构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：隔离和冷却是两种不同的灭火方式，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：混合物是指由两种或两种以上的单质或化合物混合而成的物质，化合物是指由两种或两种以上不同元素组成的纯净物，纯净物是指由一种单质或一种化合物组成的聚合物。混合物与纯净物为并列关系，化合物与纯净物为种属关系，与题干逻辑关系不一致，排除；\nC项：撒播是指把作物的种子均匀地撒在地里，必要时进行覆土的播种方式，条播是指沿着一条浅犁沟撒布种子的播种方式。撒播和条播是两种不同的播种方式，二者为并列关系，分别与播种构成种属关系，与题干逻辑关系一致，当选；\nD项：举例子和作比较是写说明文采用的两种不同的写作手法，二者为并列关系，分别与说明文构成对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"16593206","cat":"类比推理","stem":"泡沫经济：实体经济：通货膨胀","options":{"A":"生态农业：传统农业：稻田养鱼","B":"清洁能源：传统能源：污染减少","C":"生理反应：心理反应：望梅止渴","D":"自然现象：社会现象：火山爆发"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n泡沫经济指因投机交易极度活跃，金融证券、房地产等的市场价格脱离实际价值大幅上涨，造成表面繁荣的经济现象；实体经济指一个国家生产的商品价值总量，是人们通过思想、使用工具在地球上创造的经济；当泡沫经济越多而实体经济越少时，就会产生通货膨胀的现象，三者为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：生态农业是指按照生态学原理，应用现代科学技术进行集约经营管理的综合农业生产体系，传统农业是指采用传统手工劳动方式和生产技术的农业，二者为并列关系，稻田养鱼是一种生态农业，二者为种属关系，与题干逻辑关系不一致，排除；\nB项：清洁能源是指开发利用过程中不产生或很少产生污染物的能源，如风能、水能、太阳能、地热能等，传统能源是指已经大规模生产和广泛利用的能源，当使用的清洁能源越多而传统能源越少时，能让污染减少，三者为因果对应关系，与题干逻辑关系一致，当选；\nC项：生理反应是个体受到外界刺激而使机体有所反应的一种紧张状态，心理反应是指人们在面对客观事物时产生的主观体验，包括情感、思维和行为等方面的变化，二者为并列关系，望梅止渴是一种生理反应，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：自然现象是指自然界中由于大自然的运作规律自发形成的某种状况，社会现象是指所有与同物种共同体有关的活动产生、存在和发展密切联系的现象，二者为并列关系，火山爆发是一种自然现象，二者为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":68,"missingImage":false},{"type":"question","qid":"16593030","cat":"类比推理","stem":"数字经济 对于 （    ） 相当于 （    ） 对于 人工智能","options":{"A":"信息工具 家用电器","B":"信息技术 无人驾驶","C":"数字资源 现代农业","D":"数字货币 远程医疗"},"answer":"B","explanation":"逐一代入选项。\nA项：数字经济是以新一代信息技术为依托的一种新经济形态，数字经济一定需要利用信息工具，二者为必然利用的对应关系；家用电器可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除；\nB项：数字经济一定需要利用信息技术，二者为必然利用的对应关系；无人驾驶一定需要利用人工智能，二者为必然利用的对应关系，前后逻辑关系一致，当选；\nC项：数字经济一定需要利用数字资源，二者为必然利用的对应关系；现代农业可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除；\nD项：数字经济的发展导致了数字货币的产生，二者为产物的对应关系；远程医疗可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":69,"missingImage":false},{"type":"question","qid":"16593000","cat":"类比推理","stem":"缘木求鱼 对于 （    ） 相当于 （    ） 对于 抱薪救火","options":{"A":"事与愿违 抽薪止沸","B":"南辕北辙 通宵达旦","C":"刻舟求剑 纵风止燎","D":"扬汤止沸 凿壁偷光"},"answer":"C","explanation":"逐一代入选项。\nA项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“事与愿违”指事情的发展与主观愿望相反，二者无明显逻辑关系；“抽薪止沸”意思是抽掉锅底下的柴火，使锅里的水不再翻滚，比喻从根本上解决问题，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者是反义关系，前后逻辑关系不一致，排除；\nB项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“南辕北辙”指心里想往南去，却驾车往北走，比喻行动和目的相反，二者无明显逻辑关系；“通宵达旦”指的是从入夜直到天亮，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“刻舟求剑”比喻看问题做事情死板不灵活，不知情随势变，二者是近义关系；“纵风止燎”指的是用鼓风的方法灭火，比喻本欲消弭其事，却反而助长其声势，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者是近义关系，前后逻辑关系一致，当选；\nD项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“扬汤止沸”指把锅里烧的沸水舀起来再倒回去，想叫它不沸腾，比喻办法不对头，不能从根本上解决问题，二者是近义关系；“凿壁偷光”原指西汉匡衡凿穿墙壁引邻舍之烛光读书，后用来形容家贫而读书刻苦，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":70,"missingImage":false},{"type":"question","qid":"16593026","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"2484be947de2\" style=\"max-width:500px\">","options":{"A":"①④⑥，②③⑤","B":"①②③，④⑤⑥","C":"①⑤⑥，②③④","D":"①③⑤，②④⑥"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，且题干出现很多等腰三角形，优先考虑对称性。观察发现，图②③④均是轴对称图形，图①⑤⑥均不是轴对称图形，即图①⑤⑥为一组，图②③④为一组。\n\u003cimg data-k=\"48e131fefe36\" style=\"max-width:500px\">\n故正确答案为C。\n注1：可能有部分同学根据对称轴数量是1还是3将题干分为①③⑤一组和②④⑥一组，然而本题图①、图⑥均存在由斜线构成的阴影，考虑到斜线也是图形的一部分，而斜线之间并不对称，因此认为图①和图⑥均不是轴对称图形。此外，若认为图⑤存在从右上到左下的对称轴，则画出该“对称轴”后，可以发现“对称轴”两侧的线条并不完全对应等长，图⑤也不是轴对称图形。\n注2：分组分类题目优先考虑两组图形分别具有各自的规律，无法分成具有各自规律的两组时，才考虑将图形分成一组具有该规律，一组不具有该规律。","no":71,"missingImage":false},{"type":"question","qid":"16593204","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"192ac635ed44\" style=\"max-width:500px\">","options":{"A":"①④⑥，②③⑤","B":"①②③，④⑤⑥","C":"①⑤⑥，②③④","D":"①②⑥，③④⑤"},"answer":"D","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。题干出现“日”字和“田”字变形图、交圆切圆变形图，优先考虑笔画数。观察发现，图①②⑥的笔画数均为1，图③④⑤的笔画数均为2，即图①②⑥为一组，图③④⑤为一组。\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"16593031","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"e91a8ba555a7\" style=\"max-width:602px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相同，优先考虑位置规律。观察发现，题干图形内圈和外圈的黑球数量均相同，优先内外分开看。如下图所示，标记为①的黑球在内圈每次逆时针移动一格，标记为②③的黑球在外圈每次顺时针移动三格，只有C项符合规律。\n\u003cimg data-k=\"fc97634bec3d\" style=\"max-width:630px\">\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"16593023","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"c098baeb4e76\" style=\"max-width:400px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"九宫格横行观察无规律，但竖着看发现，相同线条重复出现，优先考虑样式规律中的加减同异。第一列图1和图2求异得到图3；经验证，第二列满足此规律；第三列应用此规律，故“？”处应选择图1和图2求异得到的图形，只有D项符合。\n故正确答案为D。","no":74,"missingImage":false},{"type":"question","qid":"16593126","cat":"图形推理","stem":"下列两图分别是从正面和后面观察某个多面体所得的立体图形，下列哪项是其正确的外表面展开图？\n\u003cimg data-k=\"e1f8cfd61ca4\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题为空间重构题。\n由题干立体图形可知，存在3个灰色面，因此展开图中也应有3个灰色面，排除B项。\n继续观察发现，本题图形存在唯一且明显的大L型面（即底面），将其标记为面e。观察A、C、D三项，可以发现灰色面与面e的相邻关系不同，在立体图形中，从正面观察面e，面e最右侧的边（最凸出的顶端）与白色长方形面相邻，不与灰色面相邻，而C、D两项中面e最凸出的顶端均与灰色面相邻，因此排除C、D两项。\n\u003cimg data-k=\"1e51b02be913\" style=\"max-width:570px\">\n故正确答案为A。","no":75,"missingImage":false},{"type":"question","qid":"16592937","cat":"定义判断","stem":"正常化偏见，就是指大家对某个事物感到习惯后，就会产生安于现状、不愿意再去尝试新事物的惰性心理。\n根据上述定义，下列不属于正常化偏见的是：","options":{"A":"某些喜欢看西医的病人排斥看中医","B":"上了年纪的老年人更倾向去菜市场买菜","C":"只要吃外卖，小张就只使用某平台下单","D":"当人们试吃样品满意后更有可能进店消费"},"answer":"D","explanation":"第一步：找出定义关键词。\n“对某个事物感到习惯后”、“产生安于现状、不愿意再去尝试新事物的惰性心理”。\n第二步：逐一分析选项。\nA项：习惯看西医的病人会不愿意去尝试看中医，符合“对某个事物感到习惯后”、“产生安于现状、不愿意再去尝试新事物的惰性心理”，符合定义，排除；\nB项：老年人更倾向去菜市场买菜，即老年人习惯了去菜市场而不愿意去别的地方（商超、线上平台等）买菜，符合“对某个事物感到习惯后”、“产生安于现状、不愿意再去尝试新事物的惰性心理”，符合定义，排除；\nC项：小张只使用某一个平台下单点外卖，说明小张习惯了使用该平台而不愿意使用其他平台，符合“对某个事物感到习惯后”、“产生安于现状、不愿意再去尝试新事物的惰性心理”，符合定义，排除；\nD项：人们试吃样品满意后会更有可能进店消费，人们进店消费是因为“试吃样品满意”，不符合“对某个事物感到习惯后”、“产生安于现状、不愿意再去尝试新事物的惰性心理”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"16593013","cat":"定义判断","stem":"在统计学中，生态谬误是指用一种高层次的分析单位做调查，却用另一种低层次的分析单位做结论，即运用数据时错误地将整组的汇总结果应用到组内的单位中。\n根据以上定义，下列属于生态谬误的是：","options":{"A":"一项调研发现甲地居民的收入普遍比乙地居民的收入更高，由此认为甲地教师的收入高于乙地教师的收入","B":"服务业占比大的区域比服务业占比小的区域更容易吸引高层次人才，由此认为服务业占比大的区域高层次人才更多","C":"某杂志开设了读者意见反馈邮箱，几天后收到28个不喜欢时装栏目的反馈邮件。某编辑认为有读者不喜欢，就一定有读者喜欢","D":"某公司规定，上一年工资数额在公司前6%的要降低工资，小王上一年的工资低于公司的平均水平，可以推出小王今年的工资可能降低"},"answer":"A","explanation":"第一步：找出定义关键词。\n“运用数据时错误地将整组的汇总结果应用到组内的单位中”。\n第二步：逐一分析选项。\nA项：根据“甲地居民普遍比乙地居民的收入高”，得到“甲地教师比乙地教师的收入高”，即将整组数据的结果用来得到部分个体的结论，符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，符合定义，当选；\nB项：根据“服务业占比大的区域更容易吸引高层次人才”，得到“服务业占比大的区域高层次人才更多”，前后均为服务业占比大的区域和服务业占比小的区域的对比，不符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，不符合定义，排除；\nC项：根据“有28个不喜欢时装栏目的反馈邮件”，得到“有读者不喜欢，就一定有读者喜欢”，不涉及数据间的错误运用，不符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，不符合定义，排除；\nD项：根据“小王上一年的工资低于公司的平均水平”，得到“小王今年的工资可能降低”，前后均为小王的工资，是根据过去的数据推导现在的情况，不符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，不符合定义，排除。\n故正确答案为A。","no":77,"missingImage":false},{"type":"question","qid":"16592979","cat":"定义判断","stem":"相变指的是物质微观粒子在不同聚集状态间的转变。在等温等压条件下，从一相转变为另一相时吸收或放出的热量是相变潜热。第一类相变是指伴有相变潜热和体积突变的相变。第二类相变则不伴有相变潜热和体积突变，但有热容跃变。\n根据上述定义，下列属于第一类相变的是：","options":{"A":"热致变色印刷工艺采用遇热可产生色变的物质，如金属碘化物、络合物等，制成油墨在印品上形成色变层","B":"在1个大气压\u003cimg data-k=\"51748cf53c00\">的情况下，1公斤的冰转变成同温度的水，要吸收79.6千卡的热量，与此同时体积亦收缩","C":"含羞草叶茎部的叶褥含有很多水分，当叶片振动时，叶褥中的水分流向其它地方，叶片逐渐干瘪蜷缩到一起","D":"核磁共振成像是通过使人体本身的磁场和仪器自身的磁性物质相互作用形成检测显影，进而查看到病变的位置"},"answer":"B","explanation":"第一步：找出定义关键词。\n相变：“物质微观粒子在不同聚集状态间的转变”；\n相变潜热：“在等温等压条件下”、“从一相转变为另一相时”、“吸收或放出的热量”；\n第一类相变：“伴有相变潜热和体积突变的相变”；\n第二类相变：“不伴有相变潜热和体积突变，但有热容跃变”。\n第二步：逐一分析选项。\nA项：热致变色印刷工艺采用“遇热”可产生色变的物质，“遇热”表明温度发生了变化，不符合“在等温等压条件下”，不符合“相变潜热”定义，故也不符合“伴有相变潜热和体积突变的相变”，不符合“第一类相变”定义，排除；\nB项：在1个大气压\u003cimg data-k=\"51748cf53c00\">的情况下，符合“在等温等压条件下”，1公斤的冰转变成同温度的水，符合“从一相转变为另一相时”，要吸收79.6千卡的热量，符合“吸收或放出的热量”，符合“相变潜热”定义，与此同时体积亦收缩，符合“伴有相变潜热和体积突变的相变”，符合“第一类相变”定义，当选；\nC项：当含羞草的叶片振动时，叶褥中的水分流向其它地方，叶片逐渐干瘪蜷缩到一起，不符合“物质微观粒子在不同聚集状态间的转变”，不符合“相变”定义，故也不符合“第一类相变”定义，排除；\nD项：核磁共振成像是通过使人体本身的磁场和仪器自身的磁性物质相互作用形成检测显影，进而查看到病变的位置，不符合“物质微观粒子在不同聚集状态间的转变”，不符合“相变”定义，故也不符合“第一类相变”定义，排除。\n故正确答案为B。","no":78,"missingImage":false},{"type":"question","qid":"16592981","cat":"定义判断","stem":"合同法大多属于缺省规则，当事人可以就同一事项做出不同约定，只有在没有约定时，才把合同法规定填补到合同中。缺省规则包括两种类型：一种是符合当事人预期的正向缺省规则，当事人无需事无巨细地对合同进行约定，只要适用合同法规定就能实现合同目的，有利于节约订立合同的成本；另一种是与当事人预期相悖的反向缺省规则，适用该类缺省规则会产生与合同目的相反的结果，以督促当事人事先对相关事项做出约定。\n根据上述定义，下列属于反向缺省规则的是：","options":{"A":"标的数量没有约定的，视为合同没有成立","B":"质量要求没有约定的，按照强制性国家标准履行","C":"价款没有约定的，按照缔约时履行地的市场价格履行","D":"履行方式没有约定的，按照有利于实现合同目的的方式履行"},"answer":"A","explanation":"第一步：找出定义关键词。\n正向缺省规则：“当事人无需事无巨细地对合同进行约定”、“只要适用合同法规定就能实现合同目的”；\n反向缺省规则：“与当事人预期相悖”、“适用该类缺省规则会产生与合同目的相反的结果”。\n第二步：逐一分析选项。\nA项：标的数量没有约定的，视为合同没有成立，当事人签订合同，应是期望合同可以继续生效，符合“与当事人预期相悖”、“适用该类缺省规则会产生与合同目的相反的结果”，符合“反向缺省规则”定义，当选；\nB项：质量要求没有约定的，按照强制性国家标准履行，说明合同对这方面即便是没有做出约定，该情况下也可以使用合同法规定继续履行合同，符合“当事人无需事无巨细地对合同进行约定”、“只要适用合同法规定就能实现合同目的”，符合“正向缺省规则”定义，不符合“反向缺省规则”定义，排除；\nC项：价款没有约定的，按照缔约时履行地的市场价格履行，说明合同对这方面即便是没有做出约定，该情况下也可以使用合同法规定继续履行合同，符合“当事人无需事无巨细地对合同进行约定”、“只要适用合同法规定就能实现合同目的”，符合“正向缺省规则”定义，不符合“反向缺省规则”定义，排除；\nD项：履行方式没有约定的，按照有利于实现合同目的的方式履行，说明合同对这方面即便是没有做出约定，该情况下也可以使用合同法规定继续履行合同，符合“当事人无需事无巨细地对合同进行约定”、“只要适用合同法规定就能实现合同目的”，符合“正向缺省规则”定义，不符合“反向缺省规则”定义，排除。\n故正确答案为A。","no":79,"missingImage":false},{"type":"question","qid":"16592932","cat":"定义判断","stem":"蒸发冷却是一种通过水的蒸发来冷却空气的过程，即水会吸收空气的热量而蒸发从而冷却空气。空气越干燥，其容纳水分的能力越强，当用水喷淋空气时，则空气温度的降低幅度越大。如果采用温度更低的自来水或井水，其空气的降温效果更佳。\n根据上述定义，下列未体现蒸发冷却的是:","options":{"A":"用喷水壶装满冰凉刺骨的井水，然后喷淋房屋周边","B":"在逆风处设置风井，使空气沿风井流入楼内喷泉处","C":"沿海国家在风口建造风车，利用空气流动驱动扇叶","D":"将冷水输送到屋顶，冷水从房檐四周流下形成水帘"},"answer":"C","explanation":"第一步：找出定义关键词。\n“水会吸收空气的热量而蒸发从而冷却空气”。\n第二步：逐一分析选项。\nA项：用喷水壶装满冰凉刺骨的井水喷淋房屋周边时，水接触到空气会吸收空气中的热量而蒸发，从而冷却空气，符合“水会吸收空气的热量而蒸发从而冷却空气”，符合定义，排除；\nB项：在逆风处设置风井，使空气沿风井流入楼内喷泉处时，喷泉中的水接触到空气会吸收空气中的热量而蒸发，从而冷却空气，符合“水会吸收空气的热量而蒸发从而冷却空气”，符合定义，排除；\nC项：沿海国家在风口建造风车，利用空气流动驱动扇叶时，没有体现水会接触到空气而蒸发，不符合“水会吸收空气的热量而蒸发从而冷却空气”，不符合定义，当选；\nD项：将冷水输送到屋顶，冷水从房檐四周流下形成水帘时，水接触到空气会吸收空气中的热量而蒸发，从而冷却空气，符合“水会吸收空气的热量而蒸发从而冷却空气”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":80,"missingImage":false},{"type":"question","qid":"16593022","cat":"定义判断","stem":"湖陆风是指湖陆之间相互转换的热力环流现象。入夜以后，陆地降温速度比湖水快，近地面空气变冷变重，而湖水降温慢，温度比陆地高，空气暖而轻，形成上升气流，陆上气流流向湖心形成陆风。太阳升起后，陆地吸热和升温速度比湖水快，直至陆上空气升温形成上升气流，湖面空气流向陆地形成湖风。\n根据上述定义，下列诗句最能体现湖陆风现象的是：","options":{"A":"轮台九月风夜吼，一川碎石大如斗，随风满地石乱走","B":"潮没具区薮，潦深云梦田。朝随北风去，暮逐南风旋","C":"鸱枭养子庭树上，曲墙空屋多旋风","D":"鹊飞山月曙，蝉噪野风秋"},"answer":"B","explanation":"第一步：找出定义关键词。\n“湖陆之间相互转换的热力环流现象”。\n第二步：逐一分析选项。\nA项：诗句的意思是轮台九月整夜里狂风怒号，到处的碎石块块大如斗，狂风吹得斗大乱石满地走。诗句只涉及陆地上的风，没有涉及湖水，不符合“湖陆之间相互转换的热力环流现象”，不符合定义，排除；\nB项：诗句的意思是潮水沉没于太湖，潮水沉没于云梦泽里的田地，早上顺着北风驾船进入湖中打鱼采菱，傍晚乘着南风，可以毫不费力地驾船回家。诗句描写了湖水和陆地之间风的形成情况，符合“湖陆之间相互转换的热力环流现象”，符合定义，当选；\nC项：诗句的意思是庭院里的树上，凶猛的猫头鹰都养出了小雏；曲折的院墙，空荡的房屋，多有旋风翻卷。诗句只涉及陆地上的风，没有涉及湖水，不符合“湖陆之间相互转换的热力环流现象”，不符合定义，排除；\nD项：诗句的意思是曙光微明，月挂西山，鹊鸟出林，寒蝉在初秋的野外晨风中嘶声噪鸣。诗句只涉及陆地上的风，没有涉及湖水，不符合“湖陆之间相互转换的热力环流现象”，不符合定义，排除。\n故正确答案为B。","no":81,"missingImage":false},{"type":"question","qid":"16592935","cat":"定义判断","stem":"供应商绿色压力是指企业供应商的环保意识和环保行为对企业绿色创新的影响。它会促使企业显著改进产品生产流程，以减少对自然资源的使用，并在产品生命周期内减少有害物质的释放。研究表明，供应商的绿色环保意识越强，绿色环保行为越主动，就越有可能通过供应链来影响链上企业的绿色创新行为。\n根据上述定义，下列属于供应商绿色压力的是:","options":{"A":"随着绿色意识的增强，消费者更愿意选择资源节约和环境友好的产品","B":"随着国家生态建设的推进，企业会更加谨慎地选择自己的下游客户","C":"供应商可以为链上企业提供“绿色创新”方面的资源和知识","D":"供应商的绿色环保行为倒逼企业进行绿色创新行为"},"answer":"D","explanation":"第一步：找出定义关键词。\n“企业供应商的环保意识和环保行为”、“对企业绿色创新的影响”。\n第二步：逐一分析选项。\nA项：随着绿色意识的增强，消费者更愿意选择资源节约和环境友好的产品，未提及企业，不符合“企业供应商的环保意识和环保行为”、“对企业绿色创新的影响”，不符合定义，排除；\nB项：随着国家生态建设的推进，企业会更加谨慎地选择自己的下游客户，未提及企业的环保意识和绿色创新行为，不符合“企业供应商的环保意识和环保行为”、“对企业绿色创新的影响”，不符合定义，排除；\nC项：供应商为链上企业提供“绿色创新”方面的资源和知识，但不明确是否对这些企业产生了绿色创新的影响，不符合“对企业绿色创新的影响”，不符合定义，排除；\nD项：供应商的绿色环保行为，符合“企业供应商的环保意识和环保行为”，倒逼企业进行绿色创新行为，符合“对企业绿色创新的影响”，符合定义，当选。\n故正确答案为D。","no":82,"missingImage":false},{"type":"question","qid":"16593020","cat":"定义判断","stem":"磁滞现象指的是磁场把未带磁性的铁磁性物质（如铁、钴、镍及其合金等）磁化，使之带有磁性，但外加磁场去除后，铁磁性物质的磁性也不会马上消除，仍保有磁性的现象。\n根据上述定义，下列属于磁滞现象的是：","options":{"A":"当水中溶解了某些铁磁性物质，水在强磁场下流过时，周围金属物体中会产生磁感应现象，金属中有电流流过","B":"由导线将电池、小灯泡、电流表、开关连接成闭合电路，闭合开关时，灯泡亮暗、电流表指针的指向等都会有变化","C":"电饭锅中的温控元件都有设置好的温度值，电饭锅运行达到一定温度后，感温磁钢会消磁，依靠弹簧的反作用力断开电源","D":"把烧红的铁片放置在子午线的方向，使铁分子顺着地球磁场方向排列，达到磁化目的，之后挪动铁片，铁分子仍然按照磁场方向排列"},"answer":"D","explanation":"第一步：找出定义关键词。\n“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”、“外加磁场去除后，铁磁性物质的磁性也不会马上消除”。\n第二步：逐一分析选项。\nA项：带有铁磁性物质的水在强磁场下流过时，周围的金属物体会产生磁感应现象，但未提及磁场去除后，是否还会有磁感应现象，不符合“外加磁场去除后，铁磁性物质的磁性也不会马上消除”，不符合定义，排除；\nB项：由导线将电池、小灯泡、电流表、开关连接成闭合电路，闭合开关时，灯泡亮暗、电流表指针指向会有变化，没有涉及磁化，不符合“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”，不符合定义，排除；\nC项：电饭锅运行达到设定温度后，感温磁钢会消磁，说明感温磁钢本身具有磁性，不符合“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”，不符合定义，排除；\nD项：把烧红的铁片放置在子午线方向，铁分子顺着地球磁场方向排列，磁场使铁片磁化，符合“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”，挪动铁片后铁分子仍然按照磁场方向排列，说明铁片磁性没有马上消除，符合“外加磁场去除后，铁磁性物质的磁性也不会马上消除”，符合定义，当选。\n故正确答案为D。","no":83,"missingImage":false},{"type":"question","qid":"16593009","cat":"定义判断","stem":"肿瘤侵犯，指的是肿块发展后引起相邻部位的反应和变化。肿瘤浸润，是指肿瘤细胞发展扩大透过原发部位的浆膜层转移到相邻组织和器官。肿瘤转移，指肿瘤由原发器官通过血液、淋巴等方式到达另一个远处器官。\n根据上述定义，下列属于肿瘤侵犯的是：","options":{"A":"宋阿姨近期体检发现患有乳腺癌，医生告知癌细胞已到达胸壁组织","B":"经检查，老赵的肺部有五个毛玻璃结节，医生提醒他要定期复查","C":"老王的胰腺肿瘤经过三个月的无效治疗已经蔓延到肝脏","D":"老张肺部的肿块碰触心脏薄膜，引起心包积液"},"answer":"D","explanation":"第一步：找出定义关键词。\n肿瘤侵犯：“肿块发展后引起相邻部位的反应和变化”；\n肿瘤浸润：“肿瘤细胞发展扩大透过原发部位的浆膜层转移到相邻组织和器官”；\n肿瘤转移：“肿瘤由原发器官通过血液、淋巴等方式到达另一个远处器官”。\n第二步：逐一分析选项。\nA项：癌细胞到达了胸壁组织，但无法确定是否引起了胸壁组织的反应和变化，不符合“引起相邻部位的反应和变化”，不符合“肿瘤侵犯”定义，排除；\nB项：检查出老赵的肺部有结节，并未涉及其他部位，不符合“肿块发展后引起相邻部位的反应和变化”，不符合“肿瘤侵犯”定义，排除；\nC项：胰腺肿瘤蔓延到了肝脏，但无法确定是否引起了肝脏的反应和变化，不符合“引起相邻部位的反应和变化”，不符合“肿瘤侵犯”定义，排除；\nD项：肺部肿块碰触心脏薄膜，符合“肿块发展”，引起心包积液，符合“引起相邻部位的反应和变化”，符合“肿瘤侵犯”定义，当选。\n故正确答案为D。","no":84,"missingImage":false},{"type":"question","qid":"16592930","cat":"定义判断","stem":"生物学重复是指对不同生物个体或者不同生物群体的样品采用相同的处理方式进行实验。技术重复则是指对同一样品进行的多次相同实验。\n根据上述定义，下列属于生物学重复的是：","options":{"A":"采集小王的血样一次并采用三种不同方式分别进行一次检测","B":"采用三种不同方式对分三次采集的小王血样各进行一次检测","C":"采集小王、小李、小张三人的血样并用同样方式分别进行一次检测","D":"采集小王、小李、小张三人的血样混合后用三种方式进行三次检测"},"answer":"C","explanation":"第一步：找出定义关键词。\n生物学重复：“不同生物个体或者不同生物群体的样品”、“采用相同的处理方式”；\n技术重复：“同一样品”、“多次相同实验”。\n第二步：逐一分析选项。\nA项：仅采集小王的血样一次，不符合“不同生物个体或者不同生物群体的样品”，采用三种不同方式，不符合“采用相同的处理方式”，不符合“生物学重复”定义，排除；\nB项：采用三种不同方式，不符合“采用相同的处理方式”，分三次采集的都是小王血样，不符合“不同生物个体或者不同生物群体的样品”，不符合“生物学重复”定义，排除；\nC项：采集小王、小李、小张三人的血样，符合“不同生物个体或者不同生物群体的样品”，用同样方式分别进行一次检测，符合“采用相同的处理方式”，符合“生物学重复”定义，当选；\nD项：用三种方式进行三次检测，不符合“采用相同的处理方式”，不符合“生物学重复”定义，排除。\n故正确答案为C。","no":85,"missingImage":false},{"type":"question","qid":"16593029","cat":"逻辑判断","stem":"河西走廊西部的荒原地处内陆，气候干燥，大部分地方都是戈壁沙漠，绿洲面积仅占总面积的很小一部分。千百年来，这里留下了一座又一座的古城址，它们有的彼此连缀，仿佛庞大的星座，有的则间断闪耀，形成多层结构。专家认为，水源变化是形成多个古城址的原因。\n以下哪项如果为真，最能支持上述专家的观点？","options":{"A":"河西走廊西部的部分地区素有“世界风库”之称，每年三分之一的时间刮着七级以上大风","B":"一旦水量减少，耕地很快会沙化，古城烟火无以为继，人们就会寻找新的绿洲再建一座城","C":"在1000多年的时间中，河西走廊骆驼城的地下水位下降了几十米","D":"在河西走廊，古城都是依水而建"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：水源变化是形成多个古城址的原因。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：该项讨论的是河西走廊部分地区每年的刮风情况，而论点讨论的是水源变化是否是形成多个古城址的原因，话题不一致，无法加强，排除；\nB项：该项讨论的是水量减少会引起耕地沙化，人们就会寻找新的绿洲再建一座城，所以一旦水源变化，那么就要换新城址，解释了为什么水源变化是形成多个古城址的原因，补充论据，可以加强，当选；\nC项：该项讨论的是在1000多年中，河西走廊骆驼城地下水位的变化，但是不明确其他城址的水源变化，无法判断水源变化是否是形成多个古城址的原因，为不明确项，无法加强，排除；\nD项：该项讨论的是在河西走廊，古城都是依水而建，说明河西走廊的古城都坐落在水源的附近，但是无法判断水源变化是否是形成多个古城址的原因，为不明确项，无法加强，排除。\n故正确答案为B。","no":86,"missingImage":false},{"type":"question","qid":"16592994","cat":"逻辑判断","stem":"白居易在《荔枝图序》中言道：“若离本枝，一日而色变，二日而香变，三日而味变，四五日外，色香味尽去矣。”研究表明，荔枝难以保鲜是因为果实的呼吸强度很高，导致果实品质急剧下降。\n以下哪项如果为真，最能支持上述研究结论？","options":{"A":"荔枝的可食用部位不是像桃子那样的果皮，而是“假果皮”，它与外皮之间没有直接的维管束相连，外皮失水时不能直接从果肉处获得补充","B":"荔枝离枝后会继续分解糖分：氧气充足时，糖分会分解为二氧化碳；氧气不足时，糖分会转化为一些影响风味的醇、醛类物质","C":"荔枝自身会不断产生乙烯，加速果实成熟甚至腐烂，自然更容易变质","D":"荔枝花能产生花蜜，并且它们的蜜腺很发达，是很好的蜜源植物"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：荔枝难以保鲜是因为果实的呼吸强度很高，导致果实品质急剧下降。\n论据：无。\n本题只有论点没有论据，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：该项讨论的是荔枝的可食用部位是“假果皮”以及外皮失水时的情况，但外皮失水与论点中果实的呼吸强度无明确关联，话题不一致，无法加强，排除；\nB项：该项讨论的是荔枝离枝后会继续分解糖分，以及分别在氧气充足时和氧气不足时的糖分转化情况，说明荔枝的果实确实存在呼吸作用，补充论据，可以加强，当选；\nC项：该项讨论的是荔枝自身不断产生的乙烯会导致其变质，但乙烯的产生与论点中果实的呼吸强度无明确关联，话题不一致，无法加强，排除；\nD项：该项讨论的是荔枝花能产生花蜜，与论点中果实的呼吸强度完全无关，话题不一致，无法加强，排除。\n故正确答案为B。","no":87,"missingImage":false},{"type":"question","qid":"16593018","cat":"逻辑判断","stem":"心理学家曾做过一个实验，将被试者分为两组，给他们看同一张交通事故的照片，并询问有关车速的问题。对第一组问“你认为是以多快的速度相撞的”，而对第二组则问“你认为是以多快的速度猛烈撞击到一起的”。后者是让人想到撞击非常猛烈的表达方式。一周后，再询问被试者“汽车的挡风玻璃是否撞碎了”（实际上并没有撞碎）。结果显示，回答“是”的人，第二组的比例比第一组多两倍以上。心理学家由此得出结论：人类的记忆并不是固定的，而是根据之后获取的信息而变化。\n以下哪项如果为真，最能削弱心理学家的结论？","options":{"A":"第二组被试者的人数比第一组的多","B":"第二组被试者的记忆力本来就偏弱","C":"时隔一周再询问的合理性有待斟酌","D":"两组被试者在认知水平上没有差距"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：人类的记忆并不是固定的，而是根据之后获取的信息而变化。\n论据：让两组被试者看同一张交通事故的照片，并询问有关车速的问题。第二组的问题是让人想到撞击非常猛烈的表达方式。一周后，再询问被试者“汽车的挡风玻璃是否撞碎了”（实际上并没有撞碎）。结果显示，回答“是”的人，第二组的比例比第一组多两倍以上。\n本题论据是用实验表明回答不同的问题对人的记忆力存在影响，论点是基于此得出的结论，二者话题一致，削弱优先考虑削弱论点，且论据是对比实验，也可指出实验起点不一致或实验不可靠。\n第二步：逐一分析选项。\nA项：该项指出两组被试者的人数存在差异，但实验对比的是各组中回答“是”的比例，与各组被试者的人数无关，为无关项，无法削弱，排除；\nB项：该项指出第二组被试者的记忆力本来就“偏弱”，说明两组被试者的“记忆力”本身就存在差异，即实验起点不一致，可以削弱，当选；\nC项：该项指出时隔一周再询问的合理性“有待斟酌”，不明确时隔一周再询问对被试者的回答是否会产生影响，为不明确项，无法削弱，排除；\nD项：该项指出两组被试者在认知水平上没有差距，说明实验起点一致，为加强项，无法削弱，排除。\n故正确答案为B。","no":88,"missingImage":false},{"type":"question","qid":"16592940","cat":"逻辑判断","stem":"某智库调查表明，某省2022年的长租房成交量呈不断上涨的趋势，排在全国前列，成交总量超过3000套，较去年增长超过40%，有效解决了新市民、青年人等群体的住房难题。因此有专家认为，加快发展长租房市场是我国解决住房难题的一剂良药。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"长租房市场发展时间短，目前缺乏有效监管","B":"2022年，我国的长租房市场规模已达1.73万亿元","C":"长租房无法享受与购房者同等的公共服务，在一二线城市难以推广","D":"有数据表明，我国租赁人口约有2.2亿，占流动人口总数的90%左右"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：加快发展长租房市场是我国解决住房难题的一剂良药。\n论据：某省2022年的长租房成交量呈不断上涨的趋势，排在全国前列，成交总量超过3000套，较去年增长超过40%，有效解决了新市民、青年人等群体的住房难题。\n本题的论点和论据均在讨论发展长租房能有效解决住房难题，二者话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项说的是长租房市场缺乏有效监管，论点说的是发展长租房能有效解决住房难题，话题不一致，无法削弱，排除；\nB项：该项说的是我国长租房市场的规模比较大，论点说的是发展长租房能有效解决住房难题，话题不一致，无法削弱，排除；\nC项：该项说的是长租房在一二线城市难以推广，说明发展长租房无法解决我国一二线城市的住房难题，削弱论点，可以削弱，当选；\nD项：该项说的是我国租赁人口多、占流动人口的比例大，说明我国租房需求大，需要发展租赁市场，补充论据，无法削弱，排除。\n故正确答案为C。","no":89,"missingImage":false},{"type":"question","qid":"16593211","cat":"类比推理","stem":"学校计划开展暑期夏令营活动，就陈老师和林老师是否担任夏令营带队老师，几个家长纷纷猜测：\n吴妈妈：如果陈老师没去带队，林老师肯定也没去；\n李妈妈：陈老师是这个夏令营活动的策划者，她一定会去带队；\n郑妈妈：你们等着看吧，陈老师和林老师至少有一个人会去；\n张妈妈：我认为林老师会去带队，陈老师要回家探亲不会去。\n结果发现其中两个妈妈猜对了，两个妈妈猜错了。请问猜对了的妈妈是：","options":{"A":"李妈妈和郑妈妈","B":"吴妈妈和张妈妈","C":"吴妈妈和李妈妈","D":"郑妈妈和张妈妈"},"answer":"D","explanation":"第一步：分析题干找关系。\n吴妈妈：\u003cimg data-k=\"0be436194951\">陈老师带队\u003cimg data-k=\"b3a86cb4840e\">林老师带队；\n李妈妈：陈老师带队；\n郑妈妈：陈老师带队 或 林老师带队；\n张妈妈：林老师带队 且 \u003cimg data-k=\"0be436194951\">陈老师带队。\n吴妈妈和张妈妈的猜测为矛盾关系，必有一真一假。\n第二步：看其余。\n根据题干可知，四人的猜测为两真两假，故李妈妈和郑妈妈也必有一真一假。若李妈妈的猜测为真，那么郑妈妈的猜测也为真，不符合一真一假，因此李妈妈的猜测为假，郑妈妈的猜测为真，即陈老师没带队，再结合“或关系否一推一”可知，林老师带队，进而可以得出张妈妈的猜测为真。\n故正确答案为D。","no":90,"missingImage":false},{"type":"question","qid":"16592978","cat":"逻辑判断","stem":"与储存能量的白色脂肪细胞不同，棕色脂肪细胞会将能量以热的形式消耗掉。实验发现，正在死亡的棕色脂肪细胞会分泌出大量肌苷。接收到肌苷分子信号后，不仅周围的棕色细胞被激活，就连周围的白色脂肪细胞也被转化成棕色脂肪细胞。但是肌苷转运蛋白能将肌苷转至细胞内降低了细胞外的肌苷浓度，致使肌苷的“促燃”作用大打折扣。对照实验证实，喂食高能量饮食并同时使用肌苷转运蛋白抑制剂的小鼠仍然较瘦，且免受糖尿病的困扰。\n由此可以推出：","options":{"A":"肌苷能调节棕色脂肪细胞在生物体中的产热过程","B":"棕色脂肪细胞有助于身体维持体温，抵御寒冬","C":"刺激棕色脂肪细胞，能够增加身体能量燃烧","D":"干扰转运蛋白活性的物质可用于肥胖症治疗"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据第四句话“肌苷转运蛋白能将肌苷转至细胞内降低了细胞外的肌苷浓度，致使肌苷的‘促燃’作用大打折扣”可知，是“肌苷转运蛋白”可以调节产热过程，而不是“肌苷”，偷换概念，无法推出，排除；\nB项：根据第一句话“棕色脂肪细胞会将能量以热的形式消耗掉”可知，没有提及是否能维持体温，无中生有，无法推出，排除；\nC项：根据第一句话“棕色脂肪细胞会将能量以热的形式消耗掉”和第三句话“接收到肌苷分子信号后，不仅周围的棕色细胞被激活”可知，刺激棕色细胞后，棕色细胞会将能量燃烧，可以推出，当选；\nD项：题干讨论的是“肌苷转运蛋白”，但该项讨论的是“转运蛋白”，因此无法推出，排除。\n故正确答案为C。","no":91,"missingImage":false},{"type":"question","qid":"16592934","cat":"逻辑判断","stem":"人的跖趾关节将其脚趾与脚的其他部位相连，使得双脚在行走和跑步中更加平稳，动作更加迅速。有研究认为，当跖趾关节向上弯曲时，连接着脚趾骨和跟骨的足底腱膜会变得更加紧绷，产生一个向上的力，来抵消脚纵弓承受的一部分压力，从而让双脚在前进中更加稳定。因此，一些常见的运动鞋或者老年健步鞋会有一个特征——具有鞋尖翘度。当人们穿上一双鞋尖向上翘起的鞋时，跖趾关节会顺着鞋尖翘起的弧度向上翘起，产生相似的效果。\n以下哪项如果为真，最能削弱上述研究者的观点？","options":{"A":"这些具有足弓支持、缓冲等作用的鞋出现的时间并不长","B":"脚发力过程中，鞋尖翘度会明显影响跖趾关节的弯曲范围，限制其活动","C":"穿上鞋尖有翘度的鞋行走感觉更轻盈，这是由于脚纵弓承受的压力减少所导致的","D":"跖趾关节向上弯曲产生的向上力虽可抵消脚纵弓承受的一部分压力，但十分微弱，对人类稳定行走的影响不大"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：当人们穿上一双鞋尖向上翘起的鞋时，跖趾关节会顺着鞋尖翘起的弧度向上翘起，产生相似的效果（即会抵消脚纵弓承受的一部分压力，从而让双脚在前进中更加稳定）。\n论据：当跖趾关节向上弯曲时，连接着脚趾骨和跟骨的足底腱膜会变得更加紧绷，产生一个向上的力，来抵消脚纵弓承受的一部分压力，从而让双脚在前进中更加稳定。\n本题论点和论据均在说当跖趾关节向上弯曲时，可以让双脚在前进中更加稳定，论点论据话题一致，削弱可以考虑削弱论点和削弱论据。\n第二步：逐一分析选项。\nA项：指出具有足弓支持、缓冲等作用的鞋出现的时间并不长，但论点讨论的是鞋尖翘度导致的跖趾关节向上弯曲能否让双脚在前进中更加稳定，话题不一致，不能削弱，排除；\nB项：指出脚发力过程中，鞋尖翘度会限制跖趾关节的活动，但论点讨论的是鞋尖翘度导致的跖趾关节向上弯曲能否让双脚在前进中更加稳定，话题不一致，不能削弱，排除；\nC项：指出穿上鞋尖有翘度的鞋行走感觉更轻盈是由于脚纵弓承受的压力减少所导致的，说明当跖趾关节向上弯曲时，会抵消脚纵弓承受的一部分压力，为加强项，不能削弱，排除；\nD项：指出跖趾关节向上弯曲产生的向上力所抵消的脚纵弓承受的压力十分微弱，对人类稳定行走的影响不大，削弱论据，当选。\n故正确答案为D。","no":92,"missingImage":false},{"type":"question","qid":"16593011","cat":"类比推理","stem":"某单位由于工作需要，本周六必须安排赵、钱、孙、李、周、吴、郑7名工作人员值班，每个人都要值半天班，上午安排4人一起值班，下午安排3人一起值班。值班人员的分配满足下列条件：\n(1）赵和孙不在一起值班；\n(2）周和孙不在一起值班；\n(3）如果郑在下午值班，那么赵和李也在下午值班；\n(4）或者钱在上午值班，或者郑在下午值班。\n根据以上信息，必须在上午值班的工作人员是：","options":{"A":"钱和郑","B":"赵和郑","C":"赵和周","D":"吴和孙"},"answer":"A","explanation":"第一步：分析题干条件。\n(1）赵和孙不在一起值班；\n(2）周和孙不在一起值班；\n(3）郑下午值班\u003cimg data-k=\"a37757d411ef\">赵 且 李下午值班；\n(4）钱上午值班 或 郑下午值班；\n(5）上午4人值班，下午3人值班。\n第二步：根据题干条件进行推理。\n根据条件（1）（2）可知，赵和孙不在一起值班，周和孙也不在一起值班，那么赵和周在一起值班；结合条件（3），如果郑在下午值班，那么赵和李也在下午值班，此时周也应该在下午值班，下午值班的人数为4，与条件（5）矛盾，因此郑一定在上午值班；再结合条件（4），钱上午值班或郑下午值班，根据或关系“否一推一”可知，钱一定在上午值班，即钱和郑在上午值班。\n故正确答案为A。","no":93,"missingImage":false},{"type":"question","qid":"16593064","cat":"逻辑判断","stem":"目前，研究人员已可以利用基因组编辑技术，破坏致病基因或插入外源基因，来预防或治疗疾病。艾滋病（AIDS）是具有免疫功能的淋巴细胞感染了艾滋病病毒（HIV）造成的，在感染淋巴细胞时，HIV通过识别淋巴细胞表面一种名为CCR5的蛋白质，以此为记号并进行侵入。研究人员可以从患者身上采集淋巴细胞，对其进行基因组编辑，再把编辑后的淋巴细胞送回患者体内，达到治疗效果。\n要得到上述结论，需要补充的前提是：","options":{"A":"CCR5基因是AIDS的相关基因","B":"患者的淋巴细胞可以由直系亲属的淋巴细胞代替","C":"HIV面对丧失功能的CCR5，会找到淋巴细胞上的另一种CXCR4细胞来侵入","D":"基因组编辑技术可以使CCR5基因丧失功能，这样HIV就无法感染淋巴细胞了"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：研究人员可以从患者身上采集淋巴细胞，对其进行基因组编辑，再把编辑后的淋巴细胞送回患者体内，达到治疗效果。\n论据：艾滋病(AIDS）是具有免疫功能的淋巴细胞感染了艾滋病病毒(HIV）造成的，在感染淋巴细胞时，HIV通过识别淋巴细胞表面一种名为CCR5的蛋白质，以此为记号并进行侵入。\n本题提问为“需要补充的前提”，优先考虑搭桥和必要条件。论据讨论的是“淋巴细胞表面的CCR5”，论点讨论的是“对淋巴细胞进行基因组编辑”，二者话题不一致，优先考虑搭桥，即建立“CCR5”和“基因组编辑”之间的关系。\n第二步：逐一分析选项。\nA项：CCR5基因是艾滋病相关的基因，也就说明论据中所提到的艾滋病病毒会通过识别CCR5来侵入是真的，补充论据，可以加强，保留；\nB项：患者的淋巴细胞可以由直系亲属的淋巴细胞代替，但是不知道对淋巴细胞进行编辑了之后，是否能够治疗艾滋病，话题不一致，无法加强，排除；\nC项：HIV面对丧失功能的CCR5，会找另一种细胞进行侵入，说的是HIV对人体的攻击，但是论点讨论的是通过基因组编辑是否可以治疗艾滋病，话题不一致，无法加强，排除；\nD项：基因组编辑技术可以使CCR5基因丧失功能，题干中提到HIV是通过识别CCR5来侵入，而现在基因组编辑技术可以使CCR5基因丧失功能，因此HIV无法感染淋巴细胞，达到治疗效果，为搭桥项，可以加强，保留。\n比较A、D两项，A项为补充论据，D项为搭桥，搭桥的力度大于补充论据，D项当选。\n故正确答案为D。","no":94,"missingImage":false},{"type":"question","qid":"16593021","cat":"逻辑判断","stem":"对世界上最常见的火山类型而言，含水量较高的岩浆往往储存在地壳更深处。水在很大程度上引发并助长了火山爆发，岩浆的含水量越多，岩浆上升得越快，喷发就越猛烈。此时，岩浆的浮力不再是岩浆喷发的关键，岩浆中越多的水分含量才意味着越多的气泡和潜在更猛烈的喷发。\n以下哪项如果为真，最能加强上述研究发现？","options":{"A":"岩浆之所以能通过地壳裂缝上升，是因为岩浆比周围岩石的浮力更大","B":"若除水外还有额外的浮力，也会在火山被触发时将更多的岩浆带到地面","C":"水和岩浆的混合物在上升过程中有时会发生脱气现象，使混合物变得更加粘稠，导致上升缓慢甚至停滞","D":"水和岩浆的混合物储存在火山中，当岩浆上升到地表附近后，压力下降就会形成气泡，气泡迅速膨胀导致岩浆喷射而出"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：水在很大程度上引发并助长了火山爆发，岩浆的含水量越多，岩浆上升得越快，喷发就越猛烈。此时，岩浆的浮力不再是岩浆喷发的关键，岩浆中越多的水分含量才意味着越多的气泡和潜在更猛烈的喷发。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是因为岩浆浮力更大，所以岩浆能上升，强调了浮力对岩浆上升的重要性，而论点说的是岩浆的含水量越多则岩浆喷发得越猛烈，浮力并不是岩浆喷发的关键，削弱论点，无法加强，排除；\nB项：该项说的是除水之外的浮力对岩浆喷发的影响，而论点讨论的是岩浆的含水量对岩浆喷发的影响，为无关项，无法加强，排除；\nC项：该项说的是水和岩浆的混合物有时会导致岩浆上升缓慢，而论点说的是岩浆的含水量越多则岩浆喷发得越猛烈，削弱论点，无法加强，排除；\nD项：该项说的是水和岩浆的混合物在上升到地表附近后会因为压力下降形成气泡，气泡迅速膨胀导致岩浆喷射，解释了水越多就意味着气泡越多，进而会造成岩浆的猛烈喷发，补充论据，可以加强，当选。\n故正确答案为D。","no":95,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2022年，全国共有260家银行机构和29家理财公司累计新发理财产品2.94万只，同比下降38.23%，降幅比上年同期扩大7.22个百分点；累计募集资金89.62万亿元，同比减少32.57万亿元。\u003c/p>\u003cp>        截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，共存续产品3.47万只，同比下降4.41%；存续规模27.65万亿元，同比下降4.66%。分机构类型来看，理财公司存续产品13947只，存续规模22.24万亿元，同比增长29.36%。银行机构中，城商行存续产品9064只，存续规模2.45万亿元，同比下降32.34%；农村金融机构存续产品7808只，存续规模1.09万亿元，同比下降2.63%；股份制银行存续产品1208只，存续规模0.88万亿元，同比下降82.99%；大型银行存续产品668只，存续规模0.92万亿元，同比下降49.26%；其他机构存续产品1980只，存续规模0.07万亿元，同比下降13.42%。\u003c/p>\u003cp>        截至2022年底，持有理财产品的投资者数量为9671.27万个，较年初增长18.96%，其中机构投资者数量为95.95万个，数量占比同比提升了0.22个百分点；在持有理财产品的个人投资者中，数量最多的是风险偏好为二级（稳健型）的投资者，占比35.44%。\u003c/p>","questions":[{"qid":"16592960","cat":"综合","stem":"2022年全国银行机构和理财公司累计新发理财产品只数与2020年相比约：","options":{"A":"下降45%","B":"下降57%","C":"下降66%","D":"下降69%"},"answer":"B","explanation":"根据题干“2022年······与2020年相比约”，结合选项均为“下降+百分数”，可判定本题为间隔增长率问题。定位文字材料第一段可得：2022年，全国银行机构和理财公司累计新发理财产品2.94万只，同比下降38.23%（\u003cimg data-k=\"fa1503d6e290\">），降幅比上年同期扩大7.22个百分点。则2021年全国银行机构和理财公司累计新发理财产品只数的同比增速\u003cimg data-k=\"6b917c7b0d74\">\u003cimg data-k=\"fc789467b372\">。根据间隔增长率公式：\u003cimg data-k=\"d0430f3090d8\">，则题干所求\u003cimg data-k=\"dc4cf6abf819\">\u003cimg data-k=\"5b30c21f23ac\">\u003cimg data-k=\"ad480ff03e5c\">，即约下降57%。\n故正确答案为B。","no":96,"missingImage":false},{"qid":"10204588","cat":"综合","stem":"2021年银行机构存续的理财产品存续规模约为多少万亿元？","options":{"A":"5.4","B":"6.7","C":"10.5","D":"11.8"},"answer":"D","explanation":"根据题干“2021年银行机构存续的理财产品存续规模约为······万亿元”，结合材料所给的是2022年银行机构和理财公司存续的理财产品总存续规模及理财公司的存续规模，可以判定本题为基期和差问题。定位文字材料第二段可得：2022年全国银行机构和理财公司存续的理财产品总存续规模27.65万亿元，同比下降4.66%；理财公司存续的理财产品存续规模22.24万亿元，同比增长29.36%。根据公式：基期量\u003cimg data-k=\"4ec2c10dc29a\">，则2021年银行机构存续的理财产品存续规模为\u003cimg data-k=\"61445727573a\">\u003cimg data-k=\"c82be54451f0\">\u003cimg data-k=\"b2315e46e7ea\">万亿元，与D项最接近。\n故正确答案为D。","no":97,"missingImage":false},{"qid":"16592961","cat":"平均数","stem":"2022年不同机构每只存续理财产品平均存续金额从大到小排前三名的是：","options":{"A":"大型银行、理财公司、城商行","B":"理财公司、大型银行、城商行","C":"大型银行、理财公司、股份制银行","D":"理财公司、大型银行、股份制银行"},"answer":"D","explanation":"根据题干“2022年······每只存续理财产品平均存续金额······”，结合材料时间为2022年，可判定本题为现期平均数问题。定位文字材料第二段可得∶截至2022年底，理财公司存续产品13947只，存续规模22.24万亿元；城商行存续产品9064只，存续规模2.45万亿元；股份制银行存续产品1208只，存续规模0.88万亿元；大型银行存续产品668只，存续规模0.92万亿元。根据每只存续理财产品平均存续金额\u003cimg data-k=\"62dccbe1a3a9\">，则2022年下列机构每只存续理财产品平均存续金额分别为：理财公司，\u003cimg data-k=\"1822aae875c1\">\u003cimg data-k=\"6fa4319c63c8\">亿元/只；城商行，\u003cimg data-k=\"cb2ea160d365\">\u003cimg data-k=\"10df01451260\">亿元/只；股份制银行，\u003cimg data-k=\"1e2115999c4a\">\u003cimg data-k=\"8c38acccd334\">亿元/只；大型银行，\u003cimg data-k=\"c923860054ee\">\u003cimg data-k=\"8ebe00099edb\">亿元/只。比较可知，2022年不同机构每只存续理财产品平均存续金额从大到小排前三名的是理财公司、大型银行、股份制银行。\n故正确答案为D。","no":98,"missingImage":false},{"qid":"16592965","cat":"综合","stem":"以存续规模计算市场份额，2022年理财公司存续理财产品的市场份额是2021年理财公司的多少倍？","options":{"A":"0.45","B":"0.78","C":"1.36","D":"1.56"},"answer":"C","explanation":"根据题干“······2022年······是2021年······的多少倍”，结合材料时间为2022年，可判定本题为现期倍数问题。定位文字材料第二段可得：截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，存续规模同比下降4.66%（b）。分机构类型来看，理财公司存续规模同比增长29.36%（a）。以存续规模计算市场份额，理财公司存续理财产品的市场份额为其存续规模占全国存续规模的比重。根据公式：现期比重\u003cimg data-k=\"65b25cab126e\">，基期比重\u003cimg data-k=\"5d19e88a3fa9\">，则所求倍数\u003cimg data-k=\"7fdf8c1f5fa4\">\u003cimg data-k=\"9245ed4c6ade\">\u003cimg data-k=\"6708d2eac42a\">倍。\n故正确答案为C。","no":99,"missingImage":false},{"qid":"16592967","cat":"综合","stem":"能够从上述资料中推出的是：","options":{"A":"2021年持有理财产品的个人投资者数量占比为98.88%","B":"2022年新发理财产品中平均每只产品募集资金低于2021年","C":"2022年城商行存续产品存续金额在银行机构存续产品中比例为8.85%","D":"2022年持有理财产品的个人投资者中风险偏好为二级的数量约为3393万个"},"answer":"D","explanation":"A项：定位文字材料第三段可得：截至2022年底，持有理财产品的投资者数量为9671.27万个，其中机构投资者数量为95.95万个，数量占比同比提升了0.22个百分点。根据公式：比重\u003cimg data-k=\"155c064d29d7\">，则2021年机构投资者数量占持有理财产品的投资者数量的比重为\u003cimg data-k=\"b3cdd4024388\">\u003cimg data-k=\"9d81a6ea2816\">，故2021年持有理财产品的个人投资者数量占比&gt;1-0.78%=99.22%，不可能为98.88%，错误；\nB项：定位文字材料第一段可得：2022年，全国共有260家银行机构和29家理财公司累计新发理财产品2.94万只，同比下降38.23%（b）；累计募集资金89.62万亿元，同比减少32.57万亿元。根据公式：增长率\u003cimg data-k=\"52798dda76db\">，则累计募集资金同比增速\u003cimg data-k=\"69c7c35b13ad\">\u003cimg data-k=\"f032211b4959\">。根据两期平均数比较结论：当a&gt;b时，平均数上升，-26.7%&gt;-38.23%，则2022年新发理财产品中平均每只产品募集资金高于2021年，错误；\nC项：定位文字材料第二段可得：截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，共存续产品3.47万只，存续规模27.65万亿元。分机构类型来看，理财公司存续产品13947只，存续规模22.24万亿元。银行机构中，城商行存续产品9064只，存续规模2.45万亿元。根据公式：比重\u003cimg data-k=\"155c064d29d7\">，则2022年城商行存续产品存续金额在银行机构存续产品中比例\u003cimg data-k=\"e5144d629409\">，远高于8.85%，错误；\nD项：定位文字材料第三段可得：截至2022年底，持有理财产品的投资者数量为9671.27万个，其中机构投资者数量为95.95万个，在持有理财产品的个人投资者中，数量最多的是风险偏好为二级（稳健型）的投资者，占比35.44%。根据公式：部分=整体×比重，则2022年持有理财产品的个人投资者中风险偏好为二级的数量\u003cimg data-k=\"3c913563e2d2\">\u003cimg data-k=\"3239c99d42b9\">万个，非常接近于3393万个，正确。\n故正确答案为D。","no":100,"missingImage":false}]},{"type":"mate var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
