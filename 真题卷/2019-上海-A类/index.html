o":111,"missingImage":false},{"type":"question","qid":"2295530","cat":"图形推理","stem":"把下列图形分成两类，分类正确的是（  ）。\n\u003cimg data-k=\"6ded9f2b66b8\" style=\"max-width:398px\">","options":{"A":"①②⑤；③④⑥","B":"①②⑥；③④⑤","C":"①③⑤；②④⑥","D":"①③⑥；②④⑤"},"answer":"D","explanation":"本题为分组分类题目。观察题干图形，每根线段的两端均连接了小元素，观察发现，图①③⑥中线段的两端连接的是不同的小元素，图②④⑤中线段的两端连接的是相同的小元素。故①③⑥一组，②④⑤一组。\n故正确答案为D。","no":112,"missingImage":false},{"type":"question","qid":"2295572","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是\u003cu>      \u003c/u>。\n\u003cimg data-k=\"24cbb9e47193\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"观察发现，第一组图中，将所有位置的小黑三角形拼在一起，可以得到一个完整的黑色正方形；第二组图应用规律，故？处应左下角区域有一个小黑三角形，只有D项符合。\n故正确答案为D。","no":113,"missingImage":false},{"type":"question","qid":"2295532","cat":"图形推理","stem":"下列选项中，与所给图形规律相同的是（  ）。\n\u003cimg data-k=\"1e306a2a17c2\" style=\"max-width:392px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"黑块数量不一致，元素组成相似，优先考虑样式规律，但黑白运算无规律。继续观察发现，题干中所有黑块全部都能一笔画成，只有C项符合。\n故正确答案为C。","no":114,"missingImage":false},{"type":"question","qid":"2295534","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是（）。\n\u003cimg data-k=\"0d0f59c04ee2\" style=\"max-width:262px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相似，优先考虑样式规律。观察发现，每个图形均可分为上、下两部分。第一横行中，上面部分出现菱形、圆形和米字形，下面部分出现朝右箭头、朝左箭头和双箭头；经验证，第二横行满足此规律；故第三横行应用此规律，？处应上面部分为菱形、下面部分为朝左箭头，只有C项符合。\n故正确选项为C。","no":115,"missingImage":false},{"type":"question","qid":"2295537","cat":"图形推理","stem":"下列选项中，符合所给图形的变化规律的是（    ）。\n\u003cimg data-k=\"97551d646985\" style=\"max-width:321px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，优先考虑属性规律。图形整体比较规整，优先考虑对称性。第一横行，图形均为轴对称图形，且对称轴数量依次为1、2、3；经验证，第二横行满足此规律；第三横行，前两个图形的对称轴数量依次为1、2，故？处应填入有3条对称轴的轴对称图形，只有D项符合。\n故正确选项为D。","no":116,"missingImage":false},{"type":"question","qid":"2295539","cat":"逻辑判断","stem":"实现伟大梦想从来都不是在风平浪静、一马平川中顺利进行的，必然是在应对挑战、化解风险中艰难奋进的。只有增强忧患意识，深刻认识到发展起来以后的问题并不比不发展的时候少，进入深水区的改革并不比改革初期的开创更容易，才能在遇见一系列复杂的矛盾和难题时沉着应对，确保伟大梦想顺利实现。\n如果上述论断为真，那么下列      项也一定为真。","options":{"A":"只要应对挑战，就能确保伟大梦想顺利实现","B":"发展起来以后的问题比不发展的时候多很多，进入深水区的改革比改革初期难很多","C":"只有在风平浪静中，才有增强忧患意识的必要","D":"如果不能增强忧患意识，那么就无法在遇见一系列复杂矛盾和难题时沉着应对"},"answer":"D","explanation":"第一步：翻译题干。\n①实现伟大梦想\u003cimg data-k=\"7b6029b3bbde\">应对挑战、化解风险中艰难奋进\n②沉着应对、伟大梦想顺利实现\u003cimg data-k=\"a37757d411ef\">增强忧患意识\n第二步：逐一分析选项。\nA项：翻译为应对挑战\u003cimg data-k=\"7b6029b3bbde\">伟大梦想顺利实现，是对①的肯后，肯后无必然性结论，排除；\nB项：根据题干第二句话可知，发展起来以后的问题并不比不发展的时候少，但“不比······少”不代表“比······多很多”，进入深水区的改革并不比改革初期的开创更容易，但“比······更容易”也不代表“比······难很多”，无法推出，排除；\nC项：翻译为增强忧患意识\u003cimg data-k=\"7b6029b3bbde\">风平浪静，是对②的肯后，肯后无必然性结论，排除；\nD项：翻译为\u003cimg data-k=\"e752a8ae1a16\">增强忧患意识\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"8a927501c838\">沉着应对，是对②的否后，否后必否前，可以得出“\u003cimg data-k=\"8a927501c838\">沉着应对”，当选。\n故正确答案为D。","no":117,"missingImage":false},{"type":"question","qid":"2295276","cat":"逻辑判断","stem":"对所有的静脉血标本进行检测，没有发现阳性HIV抗体。\n如果上述断定为假，则下列      项一定为真。","options":{"A":"要发现阳性HIV抗体，必须对所有静脉血标本进行检测","B":"对所有静脉血标本进行检测，未必能发现阳性HIV抗体","C":"部分静脉血标本尚未进行检测，或者已经发现了阳性HIV抗体","D":"部分静脉血标本尚未进行检测，但是已经发现了阳性HIV抗体"},"answer":"C","explanation":"第一步：分析题干条件。\n对所有静脉血标本检测 且 \u003cimg data-k=\"0be436194951\">发现现阳性HIV抗体。\n已知题干为假，那么其矛盾命题：\u003cimg data-k=\"0be436194951\">（对所有静脉血标本检测 且 \u003cimg data-k=\"0be436194951\">发现了阳性HIV抗体）一定为真，即：有的静脉血标本没有检测 或 发现了阳性HIV抗体。\n第二步：逐一分析选项。\nA项：翻译为发现阳性HIV抗体\u003cimg data-k=\"2dfb7d1f72f3\">所有静脉血标本检测，是对题干矛盾命题“或”关系的肯定，无法得出确定性结论，排除；\nB项：翻译为对所有静脉血标本检测\u003cimg data-k=\"2dfb7d1f72f3\">未必发现阳性HIV抗体，是对题干矛盾命题“或”关系的否定，根据“否一推一”可知，一定发现了阳性HIV抗体，与题干不一致，排除；\nC项：翻译为有的静脉血标本没有检测 或 发现了阳性HIV抗体，与题干的矛盾命题一致，一定为真，当选；\nD项：翻译为有的静脉血标本没有检测 且 发现了阳性HIV抗体，题干矛盾命题为“或”关系而不是“且”关系，排除。\n故正确答案为C。","no":118,"missingImage":false},{"type":"question","qid":"2295280","cat":"逻辑判断","stem":"当今社会，二维码支付方式在餐饮门店、超市、便利店等线下小额支付场景中得到了广泛的应用。但在条码生成机制和传输过程中仍存在风险隐患，也引发了不少涉及支付安全风险的案件。\n下列      项能够对题干中的结论起到解释的作用。","options":{"A":"静态条码容易被篡改或变造，容易携带木马或病毒","B":"线下扫码支付为用户带来了便捷的消费体验","C":"商家利用线下扫码支付可以帮助自身提高经营收益","D":"采用先进的令牌技术进行变异处理后，可以保护真实卡号信息"},"answer":"A","explanation":"第一步：找出题干结论。\n “在条码生成机制和传输过程中仍存在风险隐患，引发了不少涉及支付安全风险的案件。”\n第二步：逐一分析选项。\nA项：该项解释了二维码支付隐患是由于静态条码容易被篡改或变造，容易携带木马或病毒，可以解释题干结论，当选；\nB项：该项讨论的是线下扫码支付为用户带来了便捷的消费体验，题干讨论的是二维码支付会带来安全隐患，讨论话题不一致，不能解释题干结论，排除；\nC项：该项讨论的是商家利用线下扫码支付可以帮助自身提高经营收益，题干讨论的是二维码支付会带来安全隐患，讨论话题不一致，不能解释题干结论，排除；\nD项：该项讨论的是提高移动支付安全性的方法，不能解释为什么存在风险隐患，不能解释题干结论，排除。\n故正确答案为A。","no":119,"missingImage":false},{"type":"question","qid":"2295540","cat":"逻辑判断","stem":"木星是气态巨行星，也是太阳系中最大的行星，质量是太阳系中其他七大行星质量总和的2.5倍。观测发现，围绕木星的70多颗卫星大部分由水冰构成。因此，木星的大气层里应含有相当数量的水。\n下列      项如果为真，最能支持以上论述。","options":{"A":"经过若干亿年之后，卫星可能慢慢地跌落到行星上","B":"星际空间的水，很多是以气态形式存在的","C":"天王星也是气态巨行星，已经证实它含有大量水冰","D":"卫星和它所环绕的行星是在同一时期由相同的气体和灰尘所形成的"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：木星的大气层里应含有相当数量的水。\n论据：围绕木星的70多颗卫星大部分由水冰构成。\n论点讨论的是“木星”和“水”的关系，论据讨论的是“木星的卫星”和“水”的关系，论点论据话题不一致，加强优先考虑搭桥，即建立“木星”和“卫星”之间的联系。\n第二步：逐一分析选项。\nA项：该项说的经过若干亿年之后，题干没有提及时间，不明确卫星现在是否跌落到行星上，是不明确项，无法加强，排除；\nB项：该项说的是星际空间水的存在形式，而论点说的是木星的大气层里应含有相当数量的水，话题不一致，无法加强，排除；\nC项：该项说的是天王星被证实有大量水冰，而论点说的是木星的大气层里应含有相当数量的水，主体不一致，无法加强，排除；\nD项：该项说的是卫星和它所环绕的行星是在同一时期由相同的气体和灰尘所形成的，根据题干木星的70多颗卫星大部分由水冰构成，可以得出木星也应由水冰构成，在“卫星”和“行星”的组成成分之间建立联系，为搭桥项，可以加强，当选。\n故正确答案为D。","no":120,"missingImage":false},{"type":"question","qid":"2295290","cat":"逻辑判断","stem":"研究人员研究了来自110万人的DNA，得出了一个评分系统。利用该系统可以通过检测某人的DNA来大致预测某人的受教育程度。结果发现，那些基因得分最低的人只有\u003cimg data-k=\"fc324c3b9ecb\">的机会从大学毕业；相比之下，那些基因得分在前五分之一的人，有\u003cimg data-k=\"e172e0ad0a10\">的机会从大学毕业。这是有史以来最大规模的人类认知遗传学研究。有些人据此以为，人类的基因与学历之间有极大联系。\n下列\u003cu>      \u003c/u>项如果为真，最能质疑这些人的观点。","options":{"A":"在110万被研究者中，抽样显示，只有不到\u003cimg data-k=\"a1f51a060389\">的人是大学毕业的","B":"在大学毕业的被研究者中，其父母之一是大学毕业的超过\u003cimg data-k=\"e172e0ad0a10\">","C":"在110万被研究者中，有超过\u003cimg data-k=\"1a67739c8245\">的人是大学毕业的","D":"基因得分最居中的人，也有\u003cimg data-k=\"2c6adc1698b0\">的机会从大学毕业"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：人类的基因与学历之间有极大联系。\n论据：基因得分最低的人只有\u003cimg data-k=\"fc324c3b9ecb\">的机会从大学毕业；基因得分在前五分之一的人，有\u003cimg data-k=\"e172e0ad0a10\">的机会从大学毕业。\n第二步：逐一分析选项。\nA项：110万被研究者中只有不到\u003cimg data-k=\"a1f51a060389\">的人是大学毕业的，此时前五分之一确实高于平均水平，得分最低的确实低于平均水平，补充论据支持题干论点，可以加强，排除；\nB项：被研究者们的父母与该研究无关，属于无关选项，不能削弱，排除；\nC项：110万被研究者中有超过\u003cimg data-k=\"1a67739c8245\">的人是大学毕业的，说明所选的研究样本中，绝大部分人都有高学历，否定了题干论点基因得分在前五分之一的人，有\u003cimg data-k=\"e172e0ad0a10\">的机会从大学毕业，削弱了题干观点，可以削弱，当选；\nD项：基因得分最居中的人也有\u003cimg data-k=\"2c6adc1698b0\">的机会从大学毕业的，此时前五分之一确实高于居中水平，得分最低的确实低于居中水平，说明基因与学历有关系，补充论据支持题干论点，可以加强，排除。\n故正确答案为C。","no":121,"missingImage":false},{"type":"question","qid":"2295297","cat":"类比推理","stem":"G镇A小区内老王家出现了不少飞蛾，除非小区里业主家出现了飞蛾，否则小区不能向居委会申请除蛾的药剂。G镇B小区可以向居委会申请除蛾的药剂。\n如果上述断定为真，则下列      项不能断定真假。\nⅠA小区有的业主家中没有发现飞蛾。\nⅡA小区可以申请除蛾的药剂。\nⅢB小区的业主家均出现了飞蛾。","options":{"A":"只有Ⅰ","B":"只有Ⅱ","C":"只有Ⅰ和Ⅲ","D":"Ⅰ、Ⅱ和Ⅲ"},"answer":"D","explanation":"第一步：分析题干。\n①G镇A小区内老王家出现了不少飞蛾；\n②小区能向居委会申请除蛾的药剂\u003cimg data-k=\"2dfb7d1f72f3\">小区里业主家出现了飞蛾；\n③G镇B小区可以向居委会申请除蛾的药剂；\n第二步：逐一分析选项。\nⅠ：已知A小区内老王家出现了不少飞蛾，只能说明A小区有的业主家中发现飞蛾，不能推出ⅠA小区有的业主家中没有发现飞蛾，即Ⅰ项无法判断真假；\nⅡ：已知A小区内老王家出现了不少飞蛾，为②的肯后不能推出确定性结论，即Ⅱ项无法判断真假；\nⅢ：G镇B小区可以向居委会申请除蛾的药剂，根据②可以推出B小区里业主家出现了飞蛾。但不能推出B小区的业务家均出现了飞蛾，即Ⅲ项无法判断真假。\n综上所述Ⅰ、Ⅱ、Ⅲ均无法判断真假。\n本题为选非题，故正确答案为D。","no":122,"missingImage":false},{"type":"question","qid":"2295544","cat":"逻辑判断","stem":"日益严重的抗生素抗药性使得人们将来可能死于今天很容易治愈的疾病。有研究称，蚂蚁可能成为新型抗生素的来源。\n上述结论的成立需要补充下列      项作为前提。","options":{"A":"侵袭蚂蚁的病原体没有对蚂蚁产生的抗菌素形成抗药性","B":"蚂蚁使用身上特殊腺体分泌的化学成分包裹自己来抵御病菌","C":"不同蚂蚁所产生的化学物质，其杀菌效力各不相同","D":"有些真菌可以释放化学成分劫持蚂蚁的神经中枢而杀死蚂蚁"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：蚂蚁可能成为新型抗生素的来源。\n论据：日益严重的抗生素抗药性使得人们将来可能死于今天很容易治愈的疾病。\n第二步：逐一分析选项。\nA项：侵袭蚂蚁的病原体没有对蚂蚁产生的抗菌素形成抗药性，说明如果蚂蚁成为新型抗生素的来源，就不会形成抗生素的抗药性，在论点和论据之间建立联系，是搭桥项，可以加强，当选；\nB项：蚂蚁使用身上特殊腺体分泌的化学成分包裹自己来抵御病菌，与论点讨论的蚂蚁能否成为新型抗生素的来源无关，是无关项，排除；\nC项：不同蚂蚁产生化学物质的杀菌效力各不相同，杀菌效力与论点讨论的蚂蚁能否成为新型抗生素的来源无关，是无关项，排除；\nD项：有些真菌可以劫持蚂蚁的神经中枢而杀死蚂蚁，与论点讨论的蚂蚁能否成为新型抗生素的来源无关，是无关项，排除。\n故正确答案为A。","no":123,"missingImage":false},{"type":"question","qid":"2295285","cat":"逻辑判断","stem":"工厂对技术工人的学历情况进行了调查，发现过去五年间新进厂的技术工人学历层次有大幅度提高。因此，工厂技术工人的素质整体有较大提升。\n如果上述情况属实，下列      项无法对结论起到支持。","options":{"A":"过去五年间的新进厂的技术工人现在仍在工厂上班","B":"素质高的技术工人生产的产品较少出现不合格的情况","C":"学历越高的人，素质也越高","D":"学历高的人会带动其他同事提高素质"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：工厂技术工人的素质整体有较大提升。\n论据：过去五年间新进厂的技术工人学历层次有大幅度提高。\n本题的论点是说工厂技术工人的素质有提高，而论据说的是近5年间新进厂技术工人的学历有提高，论点关键词是“技术工人的素质”，论据关键词是“技术工人的学历”，论点与论据话题不一致，因此这道题既可以考查加强论点与论据之间的关系，又可以考查补充新的论据。\n第二步：逐一分析选项。\nA项：题干论据表明过去五年新进厂的技术工人学历有大幅提高，而选项又补充了现在这些新技术工人仍然在工厂上班，这就补充了新论据，说明现在工厂技术工人的学历仍然是高的，可以加强论据，排除；\nB项：技术工人素质高使得产品较少出现不合格的情况，与题干论点现有工人素质是否提升无关，属于无关选项，无法加强，当选；\nC项：选项将论据中的“技术工人的学历高”与论点中的“技术工人的素质高”建立联系，属于搭桥，可以加强，排除； \nD项：选项可以说明随着近5年间学历高的技术工人来到工厂，他们会带动身边其他同事整体素质会提升，进而使得整个工厂技术工人的素质提高，在论据与论点之间建立联系，属于搭桥，可以加强，排除。\n本题为选非题，故正确答案为B。","no":124,"missingImage":false},{"type":"question","qid":"2295282","cat":"逻辑判断","stem":"爱因斯坦对人类最大的贡献就是相对论的提出，它是人类研究宇宙强有力的工具。爱因斯坦通过相对论进行过宇宙质量的计算，结果发现宇宙的质量总和竟然为零。爱因斯坦认为，宇宙在大爆炸后产生的物质有正反两种形式，反物质和正物质完全相反，而且正、反物质质量相等。但科学家在宇宙中只发现了很小量的反物质，那大部分的反物质去哪里了？如果它们不存在于宇宙中，爱因斯坦通过相对论的计算也不会发现宇宙质量总和为零。但是宇宙的质量为零，这说明反物质应该还是存在于宇宙当中。\n下列      项是以上论述所假设的前提。","options":{"A":"只存在一个宇宙","B":"爱因斯坦通过相对论的计算是正确的","C":"人类如果不能利用反物质的巨大能量，就不能进行星际探索","D":"科学家在实验室中发现了反物质，而且现在也可以在实验室制造一部分反物质"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：大部分的反物质应该还是存在于宇宙当中。\n论据：爱因斯坦通过相对论进行过宇宙质量的计算，结果发现宇宙的质量总和竟然为零。爱因斯坦认为，宇宙在大爆炸后产生的物质有正反两种形式，反物质和正物质完全相反，而且正、反物质质量相等。但科学家在宇宙中只发现了很小量的反物质。\n第二步：逐一分析选项。\nA项：该项说的是宇宙的数量，与论点说的大部分的反物质是否存在于宇宙中无关，是无关项，排除；\nB项：只有爱因斯坦相对论的计算是正确的，才能通过宇宙的质量总和为零，得知反物质应大量存在，是结论成立的必要条件，当选；\nC项：该项说的是反物质能力的作用与应用，与论点说的大部分的反物质是否存在于宇宙中无关，是无关项，排除；\nD项：科学家可以在实验室发现、制造出反物质，说明反物质是存在的，但无法证明宇宙中是否存在大部分的反物质，无法加强，排除。\n故正确答案为B。","no":125,"missingImage":false},{"type":"question","qid":"2295546","cat":"逻辑判断","stem":"一直以来，大气中二氧化碳的作用存在正反两面：其浓度的升高一方面能促进陆地生态系统光合产物积累，增加土壤碳储量，形成土壤的固碳效应，这是正面作用；另一方面，它又会增加陆地生态系统甲烷和氧化亚氮等温室气体排放，加剧温室效应，这是负面作用。因此，二氧化碳在大气中还是负面作用居多。\n下列      项能够对题干中的结论起到解释的作用。","options":{"A":"二氧化碳形成的土壤固碳效应比温室效应更重要","B":"二氧化碳是植物光合作用的必备原料，其含量增多对植物有好处","C":"二氧化碳浓度增加是好是坏关键看人类如何加以利用","D":"根据观测数据，二氧化碳产生的温室效应抵消并超过了固碳效应"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：二氧化碳在大气中还是负面作用居多。\n论据：其（二氧化碳）浓度的升高一方面能促进陆地生态系统光合产物积累，增加土壤碳储量，形成土壤的固碳效应，这是正面作用；它（二氧化碳）会增加陆地生态系统甲烷和氧化亚氮等温室气体排放，加剧温室效应，这是负面作用。\n第二步：逐一分析选项。\nA项：说明二氧化碳形成的土壤的固碳效应比温室效应更重要，说明了二氧化碳的正面效应比负面效应多，无法解释，排除；\nB项：二氧化碳是植物光合作用的必备原料，提出了二氧化碳的一方面好处，但与负面作用相比较谁更多仍不清楚，无法解释，排除；\nC项：二氧化碳是好是坏关键看人类如何加以利用，而其正面作用与负面作用相比较谁更多仍不清楚，无法解释，排除；\nD项：二氧化碳产生的温室效应抵消并超过了固碳效应，说明了二氧化碳所产生的负面作用抵消并且超过了其所带来的正面效应，可以解释，当选。\n故正确答案为D。","no":126,"missingImage":false},{"type":"question","qid":"2295548","cat":"类比推理","stem":"在国家社科基金重大项目招标中，甲、乙、丙、丁、戊、己等六所高校参与了投标。根据相关规则，最终只能有一所高校中标。关于究竟哪所高校是中标者，公布结果前参与投票的三位评审专家谈了各自的看法：\n（1）中标的高校不是甲就是乙；\n（2）中标的高校不是丙；\n（3）戊和己两所高校均未中标。\n对照后来公布的中标结果，发现上述三位专家中只有一人的看法是正确的。\n根据以上信息，可以确定下列      项中的三所高校均未中标。","options":{"A":"甲、戊、己","B":"丙、戊、己","C":"甲、乙、丁","D":"甲、丙、丁"},"answer":"C","explanation":"本题为真假推理题，分析题干条件。\n甲、乙、丙、丁、戊、己只有一所高校中标\n（1）要么甲，要么乙；\n（2）-丙；\n（3）-戊 且 -己。\n以上无明显矛盾的关系，分别假设进行分析。\n假设（1）为真，那就说明甲乙之间一定有一人中标，那么丙就一定不能中标，也就是（2）一定为真，所以（1）一定为假，并且甲、乙都不能中标。那就说明真话一定在（2）、（3）之间，所以分为两种情况：\n假设（2）为真，则丙未中标，（3）为假，则戊和己至少有1个中标，此时可知甲、乙、丙、丁都未中标；\n假设（3）为真，则戊和己都没有中标，（2）为假，则丙中标，此时可知甲、乙、丁、戊、己都未中标。\n根据上述两种情况，可以推出甲、乙、丁这三者一定不可能中标\n故正确答案为C。","no":127,"missingImage":false},{"type":"question","qid":"2295550","cat":"类比推理","stem":"近期女子乒乓球世界排名前7名（没有并列）在甲、乙、丙、丁、戊、己和庚（这不是排名顺序）7人中产生。已知：\n（1）甲排名第4；\n（2）乙和丙的排名在甲之前；\n（3）丁的排名在乙之前；\n（4）排名第6的是一名外国选手；\n（5）在排名中，每一名外国选手的前一名都是中国选手；\n（6）戊是一名外国选手。\n如果己和丙排名之间隔着两人，则可以得出下列      项。","options":{"A":"己排名第7","B":"庚排名第5","C":"乙和庚排名之间隔着两人","D":"乙和庚排名之间隔着三人"},"answer":"D","explanation":"本题为排列组合题目。\n第一步：分析题干。\n根据条件（1）（2）（3）可知，前四名的排列顺序从前到后为丁乙丙甲或丁丙乙甲。又因为己和丙之间隔两人。故七人排列可能为以下两种情况。\n第一种情况：\n\u003cimg data-k=\"1898b48f60b6\" style=\"max-width:505px\">\n根据条件（4）可知，排名第六为外国选手， 根据条件（5）可知，外国选手前必为中国选手，所以排名第5的是中国选手，并且排名第7的也不是外国选手，根据条件（6）可知，戊是一名外国选手，所以戊排名第6，此时与丙隔着两个人的是戊，与己和丙排名之间隔着两人不符。故此种情况不正确。\n第二种情况：\n\u003cimg data-k=\"b34d4ee31cc1\" style=\"max-width:505px\">\n根据条件（4）可知，排名第六为外国选手， 根据条件（5）可知，外国选手前必为中国选手，所以排名第5的是中国选手，并且排名第7的也不是外国选手，根据条件（6）可知，戊是一名外国选手，所以第6是戊，第7是庚。则七人排名如下：\n\u003cimg data-k=\"d6e17db513dc\" style=\"max-width:505px\">\n第二步：逐一分析选项。\nA项：己排名第5，选项错误，排除；\nB项：庚排名第7，选项错误，排除；\nC项：乙和庚之间间隔三人，选项错误，排除，；\nD项：乙和庚之间间隔三人，选项正确，当选。\n故正确答案为D。","no":128,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"e53b566ea76b\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"2295581","cat":"增长","stem":"将长江经济带中部地区省份（安徽、江西、湖北、湖南）按2015年出口额同比增速从低到高排序，以下正确的是      。","options":{"A":"湖北、江西、安徽、湖南","B":"湖南、江西、湖北、安徽","C":"湖南、安徽、江西、湖北","D":"安徽、湖南、湖北、江西"},"answer":"C","explanation":"根据题干“将长江经济带中部地区省份（安徽、江西、湖北、湖南）按2015年出口额同比增速从低到高排序”可知本题为一般增长率问题。安徽、江西、湖北、湖南四省2015年出口额同比增速分别为：\n安徽：\u003cimg data-k=\"cccf0d8bf32a\">；\n江西：\u003cimg data-k=\"2012ea4232b4\">；\n湖北：\u003cimg data-k=\"9de2157d01f6\">;\n湖南：\u003cimg data-k=\"a190a588a068\">为负值。\n所以将它们按照同比增速从低到高排序应为：湖南、安徽、江西、湖北。\n故正确答案为C。","no":129,"missingImage":false}]},{"type":"material","material":"\u003cp>        2017年1月17日国家能源局公布《能源发展“十三五”规划》《天然气“十三五”规划》，首次明确“发挥市场配置资源的决定性作用”，到2020年天然气综合保供能力应达到3600亿立方米以上，天然气消费占一次能源消费比例达到\u003cimg data-k=\"a844a7e8064c\">-\u003cimg data-k=\"fc324c3b9ecb\">。\u003c/p>\u003cp>        2017年，我国天然气消费总量2373亿立方米，同比增长\u003cimg data-k=\"4b8f3a899668\">；全年天然气进口量920亿立方米，同比增长\u003cimg data-k=\"4e507f602a32\">。\u003c/p>\u003cp>\u003cimg data-k=\"76185c40243d\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"2295393","cat":"增长","stem":"假设2020年全国天然气消费总量达到3600亿立方米，且2017-2020年天然气进口量同比增速相同，则2020年天然气进口量将达到消费总量的      。","options":{"A":"不到两成","B":"三成多","C":"五成多","D":"八成以上"},"answer":"C","explanation":"由题干“······2020年天然气进口量将达到消费总量的多少成”可判断本题为现期比重问题。定位文字材料第二段“2017年···全年天然气进口量920亿立方米，同比增长\u003cimg data-k=\"4e507f602a32\">”，且2017-2020年天然气进口量同比增速相同，根据\u003cimg data-k=\"df9732257379\">可得，则\u003cimg data-k=\"59f10265a6fe\">，故2020年天然气进口量将达到消费总量的比重为\u003cimg data-k=\"880436ba1073\">，为五成多。\n故正确答案为C。","no":130,"missingImage":false}]}],"count":2,"answerable":2,"pointsOf":16}],"total":130,"affected":[],"subtitle":"2019年 · 上海 · 6/6 模块"}]};

<script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
