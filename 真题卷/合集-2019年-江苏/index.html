odules":[{"label":"政治理论","items":[{"type":"question","qid":"2367770","cat":"新思想","stem":"党的十八大以来，党中央团结带领全党全国各族人民，深刻回答了重大时代课题，形成了习近平新时代中国特色社会主义思想。关于习近平新时代中国特色社会主义思想，下列表述正确的是\n①根本立场是以人民为中心，坚持人民主体地位\n②核心要义是坚持和发展中国特色社会主义\n③精髓是为人民谋幸福、为民族谋复兴、为世界作贡献\n④理论特色是体现了理论与实际相结合、战略和战术相一致","options":{"A":"①②③","B":"①③④","C":"②③④","D":"①②③④"},"answer":"D","explanation":"本题考查政治常识。\n①正确，习近平新时代中国特色社会主义思想始终强调“以人民为中心”的根本立场。坚持以人民为中心的发展思想，是习近平新时代中国特色社会主义思想的核心价值取向，是对马克思主义人民观的继承和发展，与中国共产党的初心一脉相承。\n②正确，坚持和发展中国特色社会主义，是改革开放以来我们党全部理论和实践的鲜明主题，是习近平新时代中国特色社会主义思想的核心要义。\n③正确，习近平新时代中国特色社会主义思想的精髓是为人民谋幸福、为民族谋复兴、为世界作贡献，集中反映了当代中国共产党人的人民立场、民族抱负、世界责任。\n④正确，《习近平新时代中国特色社会主义思想三十讲》指出：“八个明确”、“十四个坚持”有机融合、有机统一，凝结着我们党坚持和发展中国特色社会主义的经验总结，凝结着以习近平同志为核心的党中央对中国特色社会主义规律认识的深化、拓展、升华，体现了理论与实际相结合、战略与战术相一致、认识论和方法论相统一的理论特色。因此①②③④正确。\n故正确答案为D。","no":1,"missingImage":false}],"count":1,"answerable":1,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2367955","cat":"经济常识","stem":"改革开放40多年来，中国人民在富起来、强起来的征程上迈出了决定性的步伐，一些经济指标已处于世界前列。下列指标中我国处于世界首位的是","options":{"A":"货物贸易额","B":"商品消费额","C":"外资流入额","D":"黄金储备量"},"answer":"A","explanation":"本题考查政治常识。\n庆祝改革开放40周年大会于2018年12月18日上午10时在人民大会堂举行。中共中央总书记、国家主席、中央军委主席习近平出席大会并发表重要讲话。讲话指出：“现在，我国是世界第二大经济体、制造业第一大国、货物贸易第一大国、商品消费第二大国、外资流入第二大国，我国外汇储备连续多年位居世界第一，中国人民在富起来、强起来的征程上迈出了决定性的步伐！”\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"2367777","cat":"人文常识","stem":"今年是中华人民共和国成立70周年。下列对中华人民共和国成立意义的表述，正确的是\n①标志着新民主主义社会的结束\n②基本完成了民族独立和人民解放的任务\n③为实现中华民族的伟大复兴开辟了新纪元\n④为中国的进步和发展创造了最重要的前提","options":{"A":"①②③","B":"①③④","C":"②③④","D":"①②③④"},"answer":"C","explanation":"本题考查政治常识。\n①错误，1949年10月新中国成立，标志着我国进入到新民主主义社会。到1956年社会主义改造基本完成，标志着新民主主义社会结束。\n②③正确，中国共产党领导全国各族人民，推翻了压在人民头上的帝国主义、封建主义和官僚资本主义三座大山，取得新民主主义革命的基本胜利并建立了中华人民共和国，使中国结束了一百多年来被侵略被奴役的屈辱历史，真正成为了独立自主的国家，中国人民从此站起来了，成为国家的主人。所以，新中国的成立，基本完成了民族独立和人民解放的任务，开辟了中国历史的新纪元。\n④正确，习近平在庆祝改革开放40周年大会上的讲话上指出：“以毛泽东同志为主要代表的中国共产党人，把马克思列宁主义基本原理同中国革命具体实践结合起来，创立了毛泽东思想，团结带领全党全国各族人民，经过长期浴血奋斗，完成了新民主主义革命，建立了中华人民共和国，确立了社会主义基本制度，成功实现了中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了根本政治前提和制度基础。”\n①错误，②③④正确。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"2367781","cat":"人文常识","stem":"1919年爆发的五四运动，是中国近代史上一个划时代的事件。下列关于五四运动的表述，正确的是","options":{"A":"直接导火线是第一次世界大战的爆发","B":"具备了旧民主主义革命的一些基本特点","C":"青年学生在五四运动中发挥了决定性的作用","D":"为中国共产党成立作了思想和干部上的准备"},"answer":"D","explanation":"本题主要考查人文常识。\n第一次世界大战期间，欧洲列强无暇东顾，日本乘机加强对中国的侵略，严重损害了中国的主权，中国人民的反日情绪日渐增长。一战结束后，1919年召开巴黎和会，会上中国外交失败，引发了伟大的五四运动，这就是在1919年5月4日发生在北京的一场以青年学生为主，广大群众、市民、工商人士等阶层共同参与的，通过示威游行、请愿、罢工、暴力对抗政府等多种形式进行的爱国运动，这是中国人民彻底的反对帝国主义、封建主义的爱国运动。\nA项错误，五四运动的直接导火线是中国在“巴黎和会”上的外交失败。1919年召开的巴黎和会将战前德国在山东的特权转交给日本，严重损害了中国的利益，消息传到国内引发了五四运动。而第一次世界大战的时间是1914年7月28日—1918年11月11日，五四运动爆发时第一次世界大战已经结束。\nB项错误，五四运动是中国新民主主义革命的开端，在此之前的近代以来的资产阶级民主革命为中国的旧民主主义革命。新民主主义革命是无产阶级领导的、人民大众的、反对帝国主义、封建主义、官僚资本主义的革命。它的目标是无产阶级（通过中国共产党）牢牢掌握革命领导权，彻底完成革命的任务，并及时实现由新民主主义向社会主义的过渡。而旧民主主义革命是资产阶级领导的，以建立资产阶级共和国为目的的资产阶级民主革命。所以五四运动并不具有旧民主主义革命的特点。\nC项错误，工人阶级在五四运动中发挥了决定性的作用,青年学生发挥了先锋作用。\nD项正确，五四运动波及中国思想文化、政治发展方向、社会经济潮流、教育，同时对中国共产党的建立和发展起到了重要的作用。五四运动传播了马克思主义，且当时参与的代表比如瞿秋白、周恩来等人，后期也担任了我党的重要领导人，所以说五四运动为党的成立作了思想和干部上的准备。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"2367784","cat":"人文常识","stem":"今年是我国全面建成小康社会、实现第一个百年奋斗目标的关键之年。下列对2020年全面建成小康社会目标的理解，不正确的是","options":{"A":"科技实力跃升，跻身创新型国家前列","B":"现行标准下农村贫困人口实现脱贫","C":"人民的生活水平和生活质量普遍提高","D":"主要污染物的排放总量大幅度减少"},"answer":"A","explanation":"本题主要考查政治常识。\n“十三五”规划指出，“十三五”时期是全面建成小康社会的决胜阶段。必须认真贯彻党中央战略决策和部署，准确把握国内外发展环境和条件的深刻变化，积极适应把握引领经济发展新常态，全面推进创新发展、协调发展、绿色发展、开放发展、共享发展，确保全面建成小康社会。\nA项错误，“十三五”规划指出：创新驱动发展成效显著。创新驱动发展战略深入实施，创业创新蓬勃发展，全要素生产率明显提高。科技与经济深度融合，创新要素配置更加高效，重点领域和关键环节核心技术取得重大突破，自主创新能力全面增强，迈进创新型国家和人才强国行列。因此“跻身创新型国家前列”的说法错误。\nB、C两项正确，“十三五”规划指出：人民生活水平和质量普遍提高。就业、教育、文化体育、社保、医疗、住房等公共服务体系更加健全，基本公共服务均等化水平稳步提高。教育现代化取得重要进展，劳动年龄人口受教育年限明显增加。就业比较充分，收入差距缩小，中等收入人口比重上升。我国现行标准下农村贫困人口实现脱贫，贫困县全部摘帽，解决区域性整体贫困。\nD项正确，“十三五”规划指出：生态环境质量总体改善。生产方式和生活方式绿色、低碳水平上升。能源资源开发利用效率大幅提高，能源和水资源消耗、建设用地、碳排放总量得到有效控制，主要污染物排放总量大幅减少，主体功能区布局和生态安全屏障基本形成。\n本题为选非题，故正确答案为A。","no":5,"missingImage":false},{"type":"question","qid":"2367792","cat":"人文常识","stem":"王某向县规划部门申请旧房改建，获得批准。张某认为王某的改建严重影响了其通行和采光，遂以阻挡消防通道为由向县消防部门举报。消防部门调查后，责令王某停止施工，并限期拆除已建部分。下列关于本案的说法，不正确的是","options":{"A":"规划部门有权要求消防部门撤销处罚决定","B":"张某有权向规划部门申请撤销改建许可","C":"消防部门可以请求县政府撤销改建许可","D":"改建许可被撤销前应中止处罚决定的执行"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，可撤销的具体行政行为必须经过法定程序由国家有权机关作出撤销决定，才能否定其法律效力。法定程序是指行政复议、行政诉讼和行政监督程序。行政相对人可以通过复议和诉讼途径，由复议机关和法院撤销该行政行为，行政监督程序中，上级主管部门有权撤销该具体行政行为，机关发现行政行为有可撤销情形的，也能撤销该具体行政行为。因此，本题中，规划局和消防部门属于平级单位，无权要求消防部门撤销处罚决定。\nB、C两项正确，《行政许可法》第七条规定：“公民、法人或者其他组织对行政机关实施行政许可，享有陈述权、申辩权；有权依法申请行政复议或者提起行政诉讼；其合法权益因行政机关违法实施行政许可受到损害的，有权依法要求赔偿。”《行政许可法》第六十九条第一款规定：“有下列情形之一的，作出行政许可决定的行政机关或者其上级行政机关，根据利害关系人的请求或者依据职权，可以撤销行政许可：（一）行政机关工作人员滥用职权、玩忽职守作出准予行政许可决定的；（二）超越法定职权作出准予行政许可决定的；（三）违反法定程序作出准予行政许可决定的；（四）对不具备申请资格或者不符合法定条件的申请人准予行政许可的；（五）依法可以撤销行政许可的其他情形。” 张某作为利害关系人，有权向规划部门申请撤销改建许可。消防部门可以请求县规划部门的上级机关（县政府）撤销改建许可。\nD项正确，信赖保护原则是行政法的一项重要原则，指的是行政行为作出后，行政相对人基于对行政行为的信赖，而做出的行为是受到保护的，行政机关不得擅自撤销、变更已生效的行政行为。本题中，王某改建房屋是获得了规划部门批准的，改建许可不得随意撤销。如果此时继续进行处罚执行，拆除王某已建房屋，会对王某利益造成重大损害。因此，改建许可被最终撤销前，处罚中止执行。\n本题为选非题，故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"2367966","cat":"人文常识","stem":"某物业服务公司登记了业主苏某的电话号码。下列属于物业公司非法使用苏某电话号码的情形是：","options":{"A":"苏某的房屋漏水，物业公司将苏某的电话告知楼下邻居杨某","B":"苏某的房屋需要装修，物业公司将苏某的电话告知某装修公司","C":"苏某的煤气管道未经检测，物业公司将苏某的电话告知市燃气公司","D":"苏某的汽车阻挡了冯某开车出行，物业公司将苏某的电话告知冯某"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《民法典》第二百九十六条规定：“不动产权利人因用水、排水、通行、铺设管线等利用相邻不动产的，应当尽量避免对相邻的不动产权利人造成损害。”本题中，苏某和杨某是楼上楼下的邻居，属于相邻关系范畴，苏某房屋漏水，可能会对杨某造成损失，物业及时将苏某电话告知杨某，便于降低相关损失或者落实责任。\nB项错误，《物业管理条例》第五十二条规定：“业主需要装饰装修房屋的，应当事先告知物业服务企业。物业服务企业应当将房屋装饰装修中的禁止行为和注意事项告知业主。”但是房屋装修是业主的个人行为，物业服务企业不得擅自将业主电话号码告知装修公司，《物业管理条例》并未授予物业服务企业该项权利，擅自告知的行为可能会对业主生活造成骚扰。\nC项正确，《物业管理条例》第五十一条规定：“供水、供电、供气、供热、通信、有线电视等单位，应当依法承担物业管理区域内相关管线和设施设备维修、养护的责任。”物业将苏某电话告知市燃气公司，便于燃气公司及时联系苏某，尽快完成燃气管道检测、养护工作，以确保燃气使用安全。\nD项正确，《物业管理条例》第二条规定：“本条例所称物业管理，是指业主通过选聘物业服务企业，由业主和物业服务企业按照物业服务合同约定，对房屋及配套的设施设备和相关场地进行维修、养护、管理，维护物业管理区域内的环境卫生和相关秩序的活动。”物业公司将苏某电话告知冯某，便于疏导小区交通状况，也是物业履行维护物业管理区域内相关秩序职责的体现。\n本题为选非题，故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"2367967","cat":"人文常识","stem":"村民刘某欲将6亩承包地以每亩每年900元的价格流转。外地种田大户马某、本村村民孙某都有意流转刘某的承包地。下列关于该承包地流转的说法，正确的是","options":{"A":"该承包地的流转收益全部归刘某所有","B":"该承包地的流转期限可超过承包期的剩余期限","C":"马某是种田大户有技术优势，对承包地的流转有优先权","D":"刘某流转承包地后，与村农民集体的承包关系自动解除"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，根据《农村土地承包法》第三十九条的规定：“土地经营权流转的价款，应当由当事人双方协商确定。流转的收益归承包方所有，任何组织和个人不得擅自截留、扣缴。”所以，流转的收益归承包方所有，归刘某所有。\nB、C项错误，根据《农村土地承包法》第三十八条的规定：“土地经营权流转应当遵循以下原则：… (三)流转期限不得超过承包期的剩余期限;… (五)在同等条件下，本集体经济组织成员享有优先权。”所以，本村村民孙某是比马某享有优先权的。\nD项错误，《农村土地承包法》第四十四条规定：“承包方流转土地经营权的，其与发包方的承包关系不变。”所以，刘某与村民集体的承包关系不会改变。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"2367803","cat":"人文常识","stem":"楚汉相争在我国历史文化中留下了深深的印迹。下列表述不正确的是","options":{"A":"象棋中的“楚河汉界”源自于这段历史","B":"成语“破釜沉舟”源于楚汉相争中的一场战役","C":"琵琶曲《十面埋伏》反映了楚汉垓下决战情形","D":"诗句“生当作人杰，死亦为鬼雄”以此为题材"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，楚河汉界，为象棋棋盘中的分界线，来源于楚汉战争。《史记》中对于刘邦和项羽之战的记载有“鸿沟而西者为汉，鸿沟而东者为楚”，历史就这样使鸿沟成了“楚河汉界”。\nB项错误，“破釜沉舟”来源于项羽一战成名的巨鹿之战，公元前207年，项羽的起义军与秦将章邯率领的秦军主力部队在巨鹿（今河北邢台市）展开大战；项羽不畏强敌，引兵渡漳水（由巨鹿东北流向东南的一条河）。渡河后，项羽命令全军：“皆沉船，破釜甑，烧庐舍，持三日粮，以示士卒必死，无一还心。”最终，项羽大获全胜，巨鹿一战，是项羽和秦军的一场战役，不是楚汉相争中的战役。\nC项正确，“十面埋伏” 这个典故出自楚汉相争的垓下之战，楚汉相争时期，汉王刘邦麾下韩信率30万大军和彭越的军队会师，把项羽围困在垓下（今安徽省宿州市灵璧县东南），他采取十面埋伏的战术，逼使项羽在乌江自刎，取得决定性的胜利。\nD项正确，宋代女词人李清照写的《夏日绝句》：“生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东”，写的正是楚汉相争中项羽乌江自刎的情形。\n本题为选非题，故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"2367805","cat":"人文常识","stem":"对下列诗句所描写活动的解释，正确的是","options":{"A":"“清风如可托，终共白云飞”描写的是射箭","B":"“平明寻白羽，没在石棱中”描写的是捉迷藏","C":"“嘈嘈切切错杂弹，大珠小珠落玉盘”描写的是弹琵琶","D":"“三五步行遍天下，六七人百万雄兵“描写的是下象棋"},"answer":"C","explanation":"本题考查人文常识。\nA项错误，“清风如可托，终共白云飞”出自北宋诗人寇准的《纸鸢》。全诗歌风筝以咏志，通过写风筝需要外力依托才能飞翔，以物喻人，尽显辩证唯物主义思想。\nB项错误，“平明寻白羽，没在石棱中”出自唐代诗人卢纶的《和张仆射塞下曲·其二》，描写了天明寻找（昨晚射出的）白羽箭，发现箭头已深深没入在巨大石块中，突出了将军射箭技艺的高超。\nC项正确，“嘈嘈切切错杂弹，大珠小珠落玉盘”出自唐代诗人白居易的《琵琶行》。诗句描写了琵琶声错落有致，疾乱中自有章法，像珍珠掉落玉盘一样清脆动听。\nD项错误，“三五步行遍天下，六七人百万雄兵”突出了京剧表演中成队的随从或兵卒在台上表现大场景的演出特点，因此描写的是戏台，而不是下象棋。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"2367809","cat":"人文常识","stem":"对下列词语的解释，不正确的是（    ）。","options":{"A":"风树之悲——因父母去世而悲伤","B":"金兰之交——亲如兄弟的友情","C":"期颐之年——八九十岁的年龄","D":"弄璋之喜——生了男孩的喜庆"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“风树之悲”出自《韩诗外传》卷九，原文是“树欲静而风不止，子欲养而亲不待”。指因父母亡故，不能奉养的悲伤。\nB项正确，“金兰之交”最早出自《周易\u003cimg data-k=\"d4f0d11b53cc\">系辞上》“二人同心，其利断金；同心之言，其臭如兰”。原指牢固而融洽的友情，后用做结拜为兄弟姐妹的代称。\nC项错误，“期颐之年”出自《礼记\u003cimg data-k=\"d4f0d11b53cc\">曲礼上》中“百年曰期颐”一句，意为百岁老人饮食起居不能自理，一切需期待别人供养或照顾。因此，“期颐之年”指一百岁，而不是八、九十岁。\nD项正确，“弄璋”指的是古人把璋给男孩玩，希望他将来有玉一样的品德。因此，“弄璋之喜”旧时常用以祝贺生了男孩的喜庆。\n本题为选非题，故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"2367962","cat":"人文常识","stem":"下列成语与经济学用语对应不恰当的是","options":{"A":"凿壁偷光——外部性","B":"郑人买履——机会成本","C":"扬长避短——比较优势","D":"狡兔三窟——投资组合"},"answer":"B","explanation":"本题主要考查经济常识。\nA项正确，外部性，指一个人或一群人的行动和决策使另一个人或一群人受损或受益的情况。其中，正外部性是某个经济行为使他人或社会受益，而受益者无须花费代价，负外部性是某个经济行为使他人或社会受损，而造成负外部性的人却没有为此承担成本。“凿壁偷光”讲的是西汉大文学家匡衡的故事。匡衡勤奋好学，但家中没有蜡烛。邻家有蜡烛，可光亮照不到他家，匡衡就在墙壁上凿了洞引来邻家的光亮，让光亮照在书上读书。从典故的本意来看，“凿壁偷光”体现的是邻居家的光亮使匡衡受益，符合正外部性的原理。\nB项错误，机会成本是指当把一定的经济资源用于生产某种产品时，放弃的另一些产品生产上最大的收益。“郑人买履”，主要说的是郑国的人因过于相信“尺度”，造成买不到鞋子的故事。揭示了郑人拘泥于教条心理，依赖数据的习惯。这则寓言讽刺了那些墨守成规的教条主义者，说明因循守旧，不思变通，终将一事无成。因此“郑人买履”与机会成本的对应不恰当。\nC项正确，比较优势是指一个生产者以低于另一个生产者的机会成本生产一种物品的行为。比较优势的原理本来是国际贸易学中的重要概念，现在广泛的用在各种竞争合作的比较当中，指有限的时间和精力都用来做自己最擅长的事。扬长避短的意思是发扬长处，回避短处，体现了比较优势的原理。\nD项正确，投资组合是由投资人或金融机构所持有的股票、债券、金融衍生产品等组成的集合，目的是分散风险。“狡兔三窟”的意思是狡猾的兔子准备好几个藏身的窝，比喻隐蔽的地方或方法多。兔子准备好几个窝目的也是分散风险，与投资组合的理念是一样的。\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"2367968","cat":"科技常识","stem":"下列词语隐含化学变化的是","options":{"A":"春风化雨","B":"腐草为萤","C":"积沙成塔","D":"滴水成冰"},"answer":"B","explanation":"本题考查科技常识。\n物理变化和化学变化的根本区别在于是否有新物质生成，如果有新物质生成，则属于化学变化；反之，则是物理变化。\nA项错误，春风化雨指适宜于草木生长的风雨。春风吹拂，化云为雨，这过程主要是空气中水汽凝结成小水滴，没有新物质生成，属于物理变化。\nB项正确，古代有腐草化为萤火虫的说法。萤火虫在夏季多就水草产卵，幼虫入土化蛹，次年春变成虫，古人误以为萤火虫是由腐草本身变化而成。草木腐烂（腐草）会被分解生成养料等其他物质，属于化学变化。\nC项错误，积沙成塔意思是把细沙积聚成宝塔，比喻聚少成多，仅指物质量的积累，不涉及化学变化。\nD项错误，滴水成冰是指天气十分寒冷，滴下的水马上就冻成了冰，没有新物质生成，属于物理变化。\n故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"2367817","cat":"人文常识","stem":"下列关于水资源的说法，不正确的是","options":{"A":"地球上水资源的主体是咸水","B":"海洋水与陆地水在不断循环","C":"地球上水体大多以液态存在","D":"地球上淡水主体是江河湖水"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，地球上的水按其存在的领域可分为海洋水（咸水）、陆地水（既有咸水也有淡水）、大气水（淡水），海洋水占全部水体的\u003cimg data-k=\"17b81ad60902\">，因此，地球上水资源的主体是咸水。\nB项正确，由于太阳辐射和重力作用，地球上存在水循环。地球表面各种形式的水体是不断地相互转化的，水以气态，液态和固态的形式在陆地、海洋和大气间不断循环的过程就是水循环。\nC项正确，地球上水的存在形态有三种：固态、液态、气态。大部分以液态的形态存在；在寒冷的极地和高山上水常常以固态的形态存在；空气中的水主要以气态的形态存在。自然界的水随着温度的改变，状态也会发生变化。\nD项错误，冰川水是地球上最宝贵、最丰富的淡水资源，蕴藏了所有淡水资源的\u003cimg data-k=\"8c3342040bcf\">。但多处于极端的特殊地理位置，要么在南极、北极，要么在极高山上，所以冰川水具有极高的价值，但开采条件极其艰难。\n本题为选非题，故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"2367969","cat":"科技常识","stem":"下列关于土壤污染及其治理的说法，不正确的是","options":{"A":"土壤污染会影响江河湖海的水质","B":"有些污染物可能永久残留在土壤中","C":"一些植物可有效降低土壤重金属污染","D":"治理土壤污染的主要方式是灌溉清洗"},"answer":"D","explanation":"本题考查科技常识。\n土壤污染是指因人为因素导致某种物质进入陆地表层土壤，引起土壤化学、物理、生物等方面特性的改变，影响土壤功能和有效利用，危害公众健康或者破坏生态环境的现象。\nA项正确，由于一些能溶于水的污染物，可从土壤中淋洗到地下水里，使得地下水受到污染；另一些悬浮物及土壤所吸附的污染物，可随地表径流迁移，造成地表水污染。因此，土壤污染会影响到江河湖海的水质。\nB项正确，由于土壤中的有些污染物不易分解，因此可能永久残留在土壤中。\nC项正确，针对土壤污染物的种类，可以种植有较强吸收力的植物，降低有毒物质的含量，例如羊齿类铁角蕨属的植物能吸收土壤中的重金属。\nD项错误，对土壤污染的治理，首先要减少农药使用。同时还要采取防治措施，如通过生物降解净化土壤。此外，还可以通过增施有机肥、改变耕作制度、换土、深翻等手段，治理土壤污染。\n本题为选非题，故正确答案为D。","no":15,"missingImage":false}],"count":14,"answerable":14,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>①一面是城镇化大潮冲击下的村庄，一面是\u003cu>        \u003c/u>在工业文明入口处的农民，面对着社会结构转型几乎\u003cu>        \u003c/u>整个乡村的现实，人们日益感到“激发农村的活力”同“解决农业人口的出路”一样重要。也正因此，“乡村振兴”的呼声日益高涨。\u003c/p>\u003cp>②乡村的振兴，首先要解决的是经济问题。道理很简单，放下手中“犁和耙”的年轻人，之所以选择从熟悉的乡村走向陌生的城市，也不过是为了过上一种更好的生活。如果留在乡村便能过上这样的日子，也就会有更多的人选择留下。这些年来，乡村旅游便是在这样的大背景下兴盛起来的。浙江安吉的“美丽乡村”、四川成都的“田园城市”等等，都是依托旅游产业带富一方乡土的极好的例子。\u003c/p>\u003cp>③然而，乡村的问题从来都不是个单纯的经济问题。即就当下风生水起的乡村旅游来说，也在发展过程中遇到了新的难题。过度的商业开发就是其中之一。一些地方的乡村虽然被以乡村旅游等形式包装起来，也在一定程度上提升了村民的收入，却因村庄完全被改装成了商品，充满着商业的气息，而全无传统乡村原先的文化与味道。\u003c/p>\u003cp>④尤其是对于那些本就有些资源和名气的乡村，由政府或企业出面圈建起来，村子里的人们悉数迁走，不出几年，沉淀了多少代乡村文化的地方就会变成一个人造的景区，再难见到“乡村”的影子了。如此过度的商业开发，消失的不仅是乡村的底色，更是村庄本身。而这与乡村振兴的初衷显然是南辕北辙的。\u003c/p>\u003cp>⑤乡村生活，本就是一种文化。就像沈从文《湘行散记》中写到的，“河面静静的，木筏上火光小了······。另外一处吊脚楼上，又有了妇人唱小曲的声音，灯光摇摇不定，且有猜拳声音······”最吸引人的，也就是吊脚楼上人们的那种生活。\u003c/p>\u003cp>⑥如今即使走进湘西那有名的“边城”，看到的也大多是人造的景观：作为商业项目之一的对歌，已经完全进入程式化的模式；沱江两岸的吊脚楼上，除了游客便是做生意的主家；再往里走，满街都是为游客专设的店铺，虽然也是古老的房子，出售的也是当地的腊肉、熏肉，却已看不出有多少“镇筸”生活的味道了。转来转去，给人的感觉更像是个换了壳的农贸市场。远不如沿着迂回的山路走进去，偶尔碰到一位背着背篓的老婆婆来得亲切、自然。\u003c/p>\u003cp>⑦乡村，并不纯然是被改造的。乡村振兴，也应该遵循着这样的认知，重在经营，前提却是尊重。首当其冲就是尊重乡村的文化。那些来源于乡村生活，即老百姓柴米油盐、喜怒哀乐里的生活文化，尤其需要关注。\u003c/p>","questions":[{"qid":"2367994","cat":"逻辑填空","stem":"依次填入第①自然段中画横线处最恰当的一项是","options":{"A":"徘徊  席卷","B":"停滞  改变","C":"逗留  影响","D":"盘桓  覆盖"},"answer":"A","explanation":"第一空，搭配“农民”且根据“在工业文明入口处”可知，横线处表达农民对于“入口”不知如何是好，A项“徘徊”指来回走，犹豫不决，D项“盘桓”指徘徊的意思，均符合文意，保留。B项“停滞”指受到阻碍，不能顺利地进行或发展，文段没有体现阻碍的意思，与文意不符，排除；C项“逗留”指打断旅程，中途停留，与文意不符，排除。\n第二空，根据“几乎”“整个乡村”可知，横线处表达“社会结构转型”涉及范围广，A项“席卷”指像卷起席子一样把东西全部卷进去，与前文“城镇化大潮冲击”构成形象表达，符合文意，当选。D项“覆盖”指遮盖，文段不是强调社会结构转型遮盖住乡村，排除。\n故正确答案为A。\n【文段出处】《再造乡村——重在经营，但前提是尊重》","no":16,"missingImage":false},{"qid":"2367995","cat":"片段阅读","stem":"人们发出“乡村振兴”呼声，主要是因为他们意识到","options":{"A":"“解决农业人口出路”很重要","B":"“激发农村的活力”十分重要","C":"很多乡村传统文化在日益消失","D":"乡村对年轻人吸引力越来越小"},"answer":"B","explanation":"“乡村振兴”呼声出现在①段。根据“也正因此，乡村振兴的呼声日益高涨”可知，前文的“人们日益感到激发农村的活力同解决农业人口的出路一样重要”是呼声出现的原因，且文段将“激发农村的活力”同“解决农业人口的出路”作比较强调其重要性，对应B项。\nA项，“解决农业人口出路”是为了与“激发农村的活力”作比较，突出“激发农村的活力”的重要性，非重点，排除；\nC项、D项均非程度词“也正因此”前强调的原因，排除。\n故正确答案为B。","no":17,"missingImage":false},{"qid":"2367997","cat":"片段阅读","stem":"以下概括与作者引用《湘行散记》用意不符的是：","options":{"A":"对原汁原味乡村文化的追怀","B":"对乡村生活程式化表演的反感","C":"对泛滥的人造景观的不满","D":"对乡村开展商业活动的鄙夷"},"answer":"D","explanation":"A项，依据⑦段“乡村，并不纯然是被改造的······首当其冲就是尊重乡村的文化。那些来源于乡村生活，即老百姓柴米油盐、喜怒哀乐里的生活文化，尤其需要关注。”可知，选项表述正确，排除。\nB项，依据⑥段“作为商业项目之一的对歌，已经完全进入程式化的模式······给人的感觉更像是个换了壳的农贸市场。远不如沿着迂回的山路走进去，偶尔碰到一位背着背篓的老婆婆来得亲切、自然”可知，选项表述正确，排除。\nC项，依据④段“沉淀了多少代乡村文化的地方就会变成一个人造的景区，再难见到“乡村”的影子了······而这与乡村振兴的初衷显然是南辕北辙的”可知，选项表述正确，排除。\nD项，依据⑥段“作为商业项目之一的对歌，已经完全进入程式化的模式······给人的感觉更像是个换了壳的农贸市场。远不如沿着迂回的山路走进去，偶尔碰到一位背着背篓的老婆婆来得亲切、自然”可知作者仅想强调“商业活动”不如“偶尔碰到一位背着背篓的老婆婆来得亲切、自然”，而选项“鄙夷”指轻视，鄙薄，文段并无此意，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《再造乡村——重在经营，但前提是尊重》","no":18,"missingImage":false},{"qid":"2367998","cat":"片段阅读","stem":"下列对文章层次划分最恰当的一项是：","options":{"A":"①/②/③④/⑤⑥⑦","B":"①②/③④/⑤⑥/⑦","C":"①/②/③④⑤⑥/⑦","D":"①②/③④⑤/⑥⑦"},"answer":"C","explanation":"篇章第①段介绍背景，引出“乡村振兴”的话题。第②段提出对策，说明乡村振兴首先要解决经济问题，解决经济问题就会有更多人选择留下。接着第③、④、⑤、⑥段分析问题，说明乡村振兴不是个单纯的经济问题，过度的商业开发与乡村振兴的初衷背道，并介绍乡村生活的本质是文化。第⑦段引出正确的对策，即乡村振兴，首先要尊重乡村文化，对应C项。\n故正确答案为C。","no":19,"missingImage":false},{"qid":"2368000","cat":"片段阅读","stem":"这篇文章的中心论点是：","options":{"A":"改善农村生态迫切需要乡村振兴","B":"发展乡村经济应注重保留乡村本色","C":"乡村最富吸引力的是其蕴含的传统文化","D":"乡村振兴需同时关注经济和文化问题"},"answer":"D","explanation":"篇章首先交代背景，引出乡村振兴的话题，并给出对策，说明乡村振兴要解决经济问题，接着篇章指出只关注经济问题、过度商业开发是会适得其反的，最后篇章给出解决问题的对策，即振兴乡村，还要尊重乡村文化。故篇章意在说明，振兴乡村，需关注乡村经济与文化，对应D项。\nA项，对应篇章介绍背景、引出话题部分的内容，而篇章重点在于说明如何进行乡村振兴，排除；\nB项，未提及本篇章的核心话题“乡村振兴”，且“保留乡村本色”非篇章论述重点，篇章重点在于强调振兴的前提是要尊重乡村文化和关注乡村经济发展，排除；\nC项，未提及本篇章的核心话题“乡村振兴”，排除。\n故正确答案为D。\n【文段出处】《乡村建设重在经营，但前提是尊重》","no":20,"missingImage":false},{"qid":"2367869","cat":"片段阅读","stem":"城镇化是一个长期的历史过程。在这个过程中，既有人口从农村向城镇迁移的正向城镇化，也不可避免地会出现农民工返乡等逆城镇化现象。通过加快户籍制度改革，促进农业转移人口市民化，可以保证城镇化持续推进；同时，实施乡村振兴战略，不仅可以为农村人才和劳动力创造更广阔的用武之地，也使城镇化的推进更加行稳致远。\n下列说法与文意不符的是","options":{"A":"推进城镇化不等于只允许人口向城镇迁移","B":"推进城镇化进程中应倡导农民工返乡创业","C":"实施乡村振兴战略与城镇化进程并不矛盾","D":"城镇化过程中户籍制度改革是关键的一步"},"answer":"B","explanation":"A项，文段“既有人口从农村向城镇迁移的正向城镇化，也不可避免地会出现农民工返乡等逆城镇化现象”中“既······也······”表示并列，故“人口向城镇迁移”只是城镇化的一种情况，故选项“不等于只允许······”表述正确，排除；\nB项，“倡导农民返乡创业”文段未提及，无中生有，当选；\nC项，由文段“实施乡村振兴战略······也使城镇化的推进更加行稳致远”可知，二者不矛盾，表述正确，排除；\nD项，“户籍制度改革是关键的一步”由文段“通过加快户籍制度改革······促进······可以保证······”可知，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《如何让新型城镇化走得更远》","no":21,"missingImage":false},{"qid":"2367886","cat":"片段阅读","stem":"按照溶解性能来分，农药可以分为水溶性和脂溶性两种。传统用水浸泡的方法，只能去除果蔬表面的水溶性农药，却不能除去其主要残留物质——脂溶性农药。而且，在浸泡过程中，水溶性农药会溶解在水中并形成具有一定浓度的水溶液，若浸泡时间过久，则很有可能导致水中的农药被果蔬重新吸附，还会造成蔬菜中的许多水溶性营养素如维生素C以及钙、镁、铁、锌等溶解在水中，从而造成其营养成分损失。\n以下对文意的概括最恰当的是","options":{"A":"水浸泡法清洗果蔬的弊大于利","B":"水浸泡法清洗果蔬如何控制时长","C":"脂溶性农药清洗难度大于水溶性农药","D":"水浸泡法清洗果蔬具有局限性"},"answer":"D","explanation":"文段开篇提到农药按溶解性分为水溶性和脂溶性两类，接着引出传统用水浸泡的清洗方法，随后通过转折词“却”强调这种方法不能去除主要残留物质脂溶性农药，可知水浸泡的方法效果不好。之后又用“而且”进一步强调，在浸泡过程中可能导致农药重新被果蔬吸附，还会造成营养成分损失。故文段重点水浸泡法清洗果蔬效果不好，有局限性，对应D项，当选；A项“弊大于利”，文段并没有进行利弊的对比，排除；B项“如何控制时长”文段没有体现，表述无中生有，排除；C项“清洗难度”并非文段强调的重点，文段围绕水浸泡方法的效果展开论述，排除。 \n故正确答案为D。\n【文段出处】《农药残留会致癌？蔬菜浸泡太久可能更脏》","no":22,"missingImage":false},{"qid":"2367970","cat":"片段阅读","stem":"在知情同意方面，由于绝大部分没有专业知识的受试者对基因治疗的原理无法准确理解，因而很难真正完全知晓其所承担的风险。另一个风险是由于很多基因治疗所针对的是严重的遗传疾病，因而通常需要在病人婴儿或儿童时期治疗，但此时是否做基因治疗的知情同意和选择将取决于其父母或监护人。父母或监护人是否有权为病人选择可能改变其体内部分细胞的基因目前也没有明确的共识。\n这段文字意在强调","options":{"A":"知情同意在基因治疗中的实现难度","B":"基因治疗中医患关系的特殊性","C":"基因治疗中医疗风险的特殊性","D":"知情同意在基因治疗中的观念分歧"},"answer":"A","explanation":"文段开篇介绍了在知情同意方面，因为专业知识受限，所以受试者很难真正知晓基因治疗的风险。“另一个风险”表并列，后文介绍了由于需要在病人婴幼儿时期治疗，而这时知情同意和选择权在于父母或者监护人，所以病人知情同意也是很难做到的。总结文段，文段通过两个并列部分，说明病人知情同意实现很有难度，对应选项，A项符合文意，当选。\nB项和C项没有提及文段的主题词“知情同意”，与文段不符，排除。\nD项“观念分歧”无中生有，文段并没有介绍知情同意在治疗中存在什么样的分歧，而是介绍了知情同意的实现有难度，与文段不符，排除。\n故正确答案为A。\n【文段出处】《基因治疗时代真的要来临了吗》","no":23,"missingImage":false},{"qid":"2367884","cat":"语句表达","stem":"①农业生产中农用机械、灌溉设施和相关技术上的投入，有很大一部分是所谓的固定成本，它们不随经营规模增加而变化。\n②农业生产与工业一样，存在“规模经济效应”，理解这一现象需要用到经济学的固定成本和可变成本的概念。\n③因此，每单位土地上的平均成本会随规模增加而减少。\n④而事实上，农场规模成为限制这些新技术、新知识广泛采用的一大影响因素。\n⑤当前，关于控制农业面源污染的主流做法是研发技术、培训农民、知识“下乡”等知识传递路线。\n⑥当农业经营规模较小时，农民在计算相关的成本和收益后，会发现投入固定成本较大的项目是不划算的。\n将以上6个句子重新排序，语序正确的是：","options":{"A":"⑤-④-②-③-①-⑥","B":"①-⑥-③-②-④-⑤","C":"②-①-③-⑥-⑤-④","D":"⑥-②-①-③-⑤-④"},"answer":"C","explanation":"观察选项，对比首句。⑤句“当前”论述背景，适合作首句，保留。①句介绍“固定成本”的具体内容，⑥句“投入固定成本”，②句提出“固定成本和可变成本”的概念，故①⑥两句应在②句之后，不适合作首句，排除B、D两项。\n观察题干，③句出现结论词“因此”，从该句入手。结合A、C两项，需要判断③句之前接②句还是①句。③句总结了每单位土地上的平均成本和规模的关系，②句提及了规模经济和两个成本概念，①句论述了固定成本和规模的关系，①③两句话题一致，衔接恰当，进行捆绑。\n故正确答案为C。\n【文段出处】《浙大团队研究发现：耕地减“肥”，适度扩大规模很关键！》","no":24,"missingImage":false},{"qid":"2367890","cat":"语句表达","stem":"沉浸在自然环境的多样性生物中，有助于维持肌肤不可或缺的健康微生物群系和肠道菌群。研究显示，如果儿童在很小的时候没有用足够的时间去亲近大自然，那么随着年龄的增长他们就不会形成适当的免疫功能来保护自我。沐浴在大自然中，可以摄取那些能产生大量健康微生物群系的东西。由于一些城市缺少公园，树木稀少，这种大自然赋予的免疫力不足，                    。\n填入画横线处最恰当的是：","options":{"A":"微生物群系和肠道菌群减少了","B":"孩子们的免疫功能退化了","C":"大自然中的生物多样性降低了","D":"成年人的健康水平下降了"},"answer":"B","explanation":"横线出现在文段结尾，要注意与前文的关系。前文通过“研究显示”引出结论，儿童在很小的时候没有用足够的时间去亲近大自然，随着年龄的增长他们就不会形成适当的免疫功能来保护自我。之后的内容是对这一研究结论进行解释说明，横线前指出，大自然赋予的免疫力不足，故孩子们的免疫功能将受到影响，对应B项，当选；A项“微生物群系和肠道菌群”、C项“大自然中的生物多样性”均对应首句的内容，并非研究显示的结论，研究结论重点强调的是亲近大自然与儿童免疫力的关系，均排除；D项“成年人的健康水平”无中生有，前文强调的是“儿童”这一话题，排除。\n故正确答案为B。\n【文段出处】《大自然的治愈力量：精油、冥想、森林疗法有多科学？》","no":25,"missingImage":false},{"qid":"2367911","cat":"片段阅读","stem":"在传统文化的早期阶段，文化呈现出一种综合的形态，这种形态成为孕育中国传统医学和古典文学的共同摇篮。在这两个学科尚未独立分离出来的时候，中国传统医学与古典文学之间存在着明显的杂糅现象。无论是诗歌、民歌、民谣，还是市井小调，都是古代医学重要的传播载体。另一方面，很多医学古籍本身就是有着丰富文学价值的作品。在阅读这些古典医学著作时，往往能够体验到文学中的那份必然和深邃。\n下列说法与文意不符的是","options":{"A":"医学和文学在传统文化早期阶段并非泾渭分明","B":"阅读经典医学古籍可能获得审美体验","C":"中国传统医学与古典文学植根于共同的文化土壤","D":"研读古典文学作品是研究传统医学的基础"},"answer":"D","explanation":"A项，根据文段“在这两个学科尚未独立分离出来的时候，中国传统医学与古典文学之间存在着明显的杂糅现象”可知，文学与医学的界限在传统文化早期并不明显，表述正确；\nB项，根据文段“很多医学古籍本身就是有着丰富文学价值的作品。在阅读这些古典医学著作时，往往能够体验到文学中的那份必然和深邃”可知，阅读医学古籍可体会到文学所展现的美，表述正确；\nC项，根据文段“在传统文化的早期阶段，文化呈现出一种综合的形态，这种形态成为孕育中国传统医学和古典文学的共同摇篮”可知，医学与文学均是基于早期的传统文化，表述正确；\nD项，文段并未陈述古典文学作品是研究传统医学的基础，无中生有。\n本题为选非题，故正确答案为D。\n【文段出处】《中国传统医学与古典文学》","no":26,"missingImage":false},{"qid":"2367887","cat":"片段阅读","stem":"当前，人们往往简单地将“积极老龄化”理解为“老有所为”，但其真正含义远超后者。通常，我国“老有所为”的主体主要是老干部、老专业科技人才、老知识分子等，但他们只是老年人中的一部分。“积极老龄化”是面向全体老年人群体的，不仅老干部、老知识分子要“积极老龄化”，普通老人也要“积极老龄化”。“老有所为”着重强调老年人“参与”的一面，“积极老龄化”还强调“健康”和“保障”以及三者之间的有机统一和结合，参与社会仅是“积极老龄化”的一个方面。\n这段文字意在阐明","options":{"A":"“积极老龄化”比“老有所为”内涵更丰富","B":"“老有所为”和“积极老龄化”的主体不同","C":"“老有所为”比“积极老龄化”更重视参与","D":"“积极老龄化”概念长期被误读的根本原因"},"answer":"A","explanation":"文段首先引出“积极老龄化”这一话题，接下来通过转折词 “但”强调“积极老龄化”的含义远超“老有所为”，其含义更丰富。后文从两个概念的主体和内容两个方面进行解释说明，“老有所为”的主体只是老年人的一部分，“积极老龄化”面向全体老年人群体； “老有所为”强调老年人“参与”的一面、“积极老龄化”还强调“健康”和“保障”以及三者之间的有机统一和结合。故文段强调的是“积极老龄化”比“老有所为”内涵更丰富，对应A项，当选；B项“主体不同”、C项“重视参与”仅为解释说明中的一个方面，表述片面，且非重点，均排除；D项对应首句转折之前的内容，非重点，且“根本原因”无中生有，排除。\n故正确答案为A。\n【文段出处】《用科学诠释“积极老龄化”》","no":27,"missingImage":false},{"qid":"2367908","cat":"片段阅读","stem":"读了大量的唐代诗人传记之后，发现中唐以前的诗人大多狂傲之士，自炫、自夸、自矜、自傲是一种稀松平常的事。杜甫应该是一个温厚谨重的人，但自夸起来一点也不含糊：“甫昔少年日，早充观国宾。读书破万卷，下笔如有神。赋料扬雄敌，诗看子建亲。”李白的“我本楚狂人，凤歌笑孔丘”“仰天大笑出门去，我辈岂是蓬蒿人”“安能摧眉折腰事权贵，使我不得开心颜”，大家耳熟能详。“天子呼来不上船，自称臣是酒中仙”，虽然出自杜甫笔下，却与李白的个性可谓合榫合卯，堪称知音。\n根据文意，作者对李杜诗中表现出的狂傲之气","options":{"A":"并不意外","B":"十分欣赏","C":"略有微词","D":"有褒有贬"},"answer":"A","explanation":"文段开篇指出中唐以前诗人大多是狂傲之士，指出他们的自炫、自夸、自矜、自傲是稀松平常的这一观点，后面接着列举杜甫和李白的相关作品作为例子进行解释说明，论证前文的观点，故文段为观点+解释说明的结构，首句“稀松平常”即代表作者的态度，说明作者并不意外，对应A项，当选。B项“十分欣赏”无中生有，文中没有强调作者对他们夸奖称赞，排除；C项“略有微词”指有一点的不满，排除；D项“有褒有贬”指有肯定也有否定，文中没有不满否定之意，排除。\n故正确答案为A。\n【文段出处】《狂傲背面是卑微》","no":28,"missingImage":false},{"qid":"2367877","cat":"片段阅读","stem":"根据新的刑事证据规则，鉴定检材的真实性和同一性已经成为鉴定意见转化为定案根据的前提条件。这显然是我国刑事证据制度发生的重大变化。透过这一变化，我们可以发现司法改革的决策者们已经具有了一种新的理论认识：实物证据鉴真是司法鉴定程序启动的前提和基础；未经鉴真过程，任何专业人士对实物证据所作的“司法鉴定意见”都将是没有法律意义的；实物证据作为一种“送检材料”，在其真实性和同一性存在合理疑问的情况下，鉴定意见将不具有作为定案根据的资格。\n这段文字中提取的关键词最恰当的是","options":{"A":"刑事证据  实物证据鉴真  定案根据","B":"司法改革  司法鉴定意见  定案根据","C":"鉴定检材  刑事证据制度  司法改革","D":"证据制度  司法鉴定程序  送检材料"},"answer":"A","explanation":"文段开篇引出新的刑事证据的话题，接着说明我国刑事证据制度的重大变化体现实物证据鉴真的重要性，即实物证据鉴真直接影响实物证据能否成为定案根据。故文段就是强调“刑事证据制度的重大变化即实物证据鉴真直接影响实物证据能否成为定案根据”关键词为“刑事证据、实物证据鉴真、定案根据”，对应A项，当选。\nB项、C项“司法改革”对应“司法改革的决策者······”，仅为决策者身份的限定词，非文段核心话题，排除。\nD项“证据制度”表述不准确，文段围绕“刑事证据”相关制度、规则展开论述，“司法鉴定程序”对应“是司法鉴定程序的启动的前提和基础”，而该句强调的核心话题是“实物证据鉴真”，排除。\n故正确答案为A。","no":29,"missingImage":false},{"qid":"2367873","cat":"片段阅读","stem":"动物体型缩小和气候升温之间的联系不止出现在远古时期。随着全球变暖，现生的许多物种体型也在减小。大蟾蜍、蛇、乌龟、蝾螈、林鼠、粪蝇、北极地区的蝴蝶、多种北海鱼和一种绵羊——这些动物的体型都变得越来越小了。这种现象一度让科学家们感到困惑，但是，通过多组实验、野外观测和对化石的研究，答案似乎越来越明显。\n下列选项与文意不符的是：","options":{"A":"小体型动物个体在气候变暖中具有生存优势","B":"科学家对动物体型变化与气候变暖的相关性早有关注","C":"气候升温导致动物体型缩小在现阶段仅限于理论构想","D":"远古时期已经出现气候升温引发动物体型变化"},"answer":"C","explanation":"A项，根据文段论述的全球变暖，很多物种体型在缩小，可知在气候变暖中，小体型物种个体具有生存优势，符合文意，排除。\nB项，由文段“这种现象一度让科学家们感到困惑”可知，科学家们早已开始关注这一现象，故选项表述正确，排除。\nC项，文段论述“通过多组实验、野外观测和对化石的研究，答案似乎越来越明显”，故不仅仅是停留在理论构想阶段，已开始实践研究，选项表述有误，当选。\nD项，由文段首句“动物体型缩小和气候升温之间的联系不止出现在远古时期”可知，远古时期已经出现这种现象，选项表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《全球气候开始急速变暖，动物却变得越来越小了》","no":30,"missingImage":false},{"qid":"2367882","cat":"片段阅读","stem":"生态文明首先是一种世界观，也就是如何看待人与自然和人与人之间的关系。实际上，人与自然的关系和人与人之间的关系是同一事物的相互映衬，同时，人与自然的关系也在一定程度上决定了人与人之间的关系。当人与自然关系紧张，如一定的自然资源和生态环境承载不了已有的人口数量时，就会产生人与人之间关系的对抗。\n下列说法与文意不符的是","options":{"A":"人与自然的和谐相处事实上有利于协调人与人之间的关系","B":"处理好人与人的关系比处理好人与自然之间的关系更为重要","C":"正确的世界观可以引导我们处理好人与人及人与自然的关系","D":"人与人的关系发生对抗可能和人与自然关系的紧张相关"},"answer":"B","explanation":"A项，根据“人与自然的关系也在一定程度上决定了······对抗”可知，人与自然的关系决定了人与人的关系，如果人与自然的关系紧张，人与人的关系也就会紧张，那么人与自然和谐相处，也就有利于协调人与人的关系，选项与文意相符，排除。\nB项，“比······更为重要”涉及比较，而文段并未将人与人的关系、人与自然的关系进行对比，无关对比，当选。\nC项，根据文段首句表明世界观就是如何看待人与自然、人与人的关系，所以正确的世界观可以更好地引导我们处理好这些关系，选项与文意相符，排除。\nD项，根据文段尾句可知，人与自然关系紧张是人与人关系发生对抗的原因之一，选项与文意相符，排除。\n本题为选非题，故正确答案为B。","no":31,"missingImage":false},{"qid":"2367865","cat":"片段阅读","stem":"语言的发展、维持或衰落从来不是一个纯粹的语言学问题，而是复杂的社会、政治和经济力量相互博弈的结果。当前，学界主要从社会学、政治学以及经济学等视角探讨方言保护问题，而有关方言的法律保护尤其是行政法保护的研究尚不多见。因此，建立和完善我国方言保护的行政法机制，协调普通话与方言的冲突，从而在语言的通用性、规范性与多样性之间寻求均衡保护，具有重要的理论与应用价值。\n这段文字之后最有可能讨论的是：","options":{"A":"方言保护具有的理论与实践价值","B":"语言规范化和多样化平衡的方法","C":"普通话与方言的冲突并非不可调和","D":"如何通过行政立法对方言进行保护"},"answer":"D","explanation":"本题为接语选择题，需在通读全文的基础上重点关注文段最后谈论的核心话题。文段开篇指出语言的发展是复杂力量博弈的结果，“当前”指出语言方面存在的问题，即“有关方言的行政法保护研究尚不多见”。尾句“因此”得出结论，说明建立和完善方言保护的行政法机制意义重大。故下文应该围绕“行政法”的建立和完善继续论述，D项与尾句话题一致，当选。\nA、B、C三项均没有提及尾句的核心话题“行政法”，与文段无法衔接，排除。\n故正确答案为D。\n【文段出处】《论汉学方言的行政法保护》","no":32,"missingImage":false},{"qid":"2367866","cat":"片段阅读","stem":"以人均收入衡量的发展差距，本身隐含着一个资源禀赋结构上的差异，即发达地区具有相对丰富的资本要素，从而在资本密集型产业上具有比较优势；而相对不发达地区则具有劳动力丰富和生产成本低的比较优势。东中西部地区之间存在的资源禀赋结构差异，无疑可以成为中西部地区经济发展赶超的机遇。\n下列说法与文意不符的是：","options":{"A":"不同地区资源禀赋的差异有利有弊","B":"发达地区相对来说劳动力比较缺乏","C":"中西部可以利用劳动力丰富的优势","D":"资本密集型产业多集中在东部地区"},"answer":"A","explanation":"A项，“有利有弊”与文段不符，文段中只提及了资源禀赋的“优势”，没有提及“弊端”，故选项与文段不符，当选。\nB项，根据“相对不发达地区则具有劳动力丰富和生产成本低的比较优势”可知，“发达地区相对来说劳动力比较缺乏”符合文意，排除。\nC项，根据“相对不发达地区则具有劳动力丰富和生产成本低的比较优势”以及“无疑可以成为中西部地区经济发展赶超的机遇”可知，中西部为经济相对不发达的地区，具有劳动力丰富和生产成本低的比较优势，符合文意，排除。\nD项，根据“发达地区具有相对丰富的资本要素，从而在资本密集型产业上具有比较优势”以及“无疑可以成为中西部地区经济发展赶超的机遇”可知，东部为经济相对发达的地区，具有丰富的资本要素，符合文意，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《中国经济增长如何转向全要素生产率驱动型》","no":33,"missingImage":false},{"qid":"2367907","cat":"片段阅读","stem":"当前，乡村间或是城乡间的交流日益增加，因拆迁、移居等因素在新区域形成新的社区群体，乡村正面临“去熟人化”阶段。用一种共通的地域文化将其联系起来，是乡村治理的有效形式。从历史上看，以血缘或是某种被认可的文化组织起来的群体，具有很强的生命力和稳定性。在一定层面上，乡村社会关系、乡村冲突的调适与乡村社会秩序的维系不仅仅靠法制体系，而且还依靠乡村礼俗、村社伦理、村规乡约等非正式制度。\n这段文字主要强调","options":{"A":"乡村社会秩序的历史渊源与当下处境","B":"当下乡村社会秩序发生变化的主要原因","C":"新的乡村社会秩序维护需要探寻更有效的治理方法","D":"乡村治理实践中非正式制度往往比法律手段更有效"},"answer":"C","explanation":"文段开篇指出乡村面临“去熟人化”阶段这一背景，接着提到用共通的地域文化将其联系起来是乡村治理的有效形式，后面介绍了历史上用血缘或文化来组织群体，最后提出对策，乡村社会关系等不仅要靠法制体系、还要靠村规乡约等非正式制度。故文段重点强调乡村社会秩序维护需要有效的方法，对应C项，当选。A项对应首句背景引入的内容，并非文段重点，排除；B项“主要原因”无中生有，文中没有提到，排除；D项表述错误，文中没有将非正式制度与法律手段的有效性进行比较，排除。\n故正确答案为C。","no":34,"missingImage":false},{"qid":"2367913","cat":"片段阅读","stem":"国家审计独立性得到充分保障决定了审计法治的实现程度，决定了审计质量水平和审计结果的公正程度，也决定了审计能否在国家治理活动中发挥其“免疫系统”的功能，进而决定审计反腐的使命能否顺利完成。\n下列说法与画线部分表述的意义最为相似的是","options":{"A":"国家审计独立性得到充分保障与否决定了审计法治的实现可能性","B":"国家充分保障审计独立性与否决定了审计法治的实现程度","C":"国家审计独立性能否得到充分保障决定了审计法治的实现程度","D":"国家能否充分保障审计独立性决定了审计法治的实现可能性"},"answer":"C","explanation":"定位画横线句子“国家审计独立性得到充分保障决定了审计法治的实现程度”，根据句子可知，画线部分强调“审计独立性得到充分保障”是“审计法治的实现程度”的基础，对应C项，当选。\nA项，偷换概念，文段表述的是审计法治的实现程度，不是实现的可能性，排除。\nB项，表述错误，“与否”不能决定“实现程度”，“否”的情况下可能无法实现“审计法治”。并且主语错误，文段并没有表述“审计独立性”是国家保障的，排除。\nD项，主语错误，文段并没有表述“审计独立性”是国家保障的，排除。\n 故正确答案为C。","no":35,"missingImage":false},{"qid":"2367872","cat":"逻辑填空","stem":"古典诗歌热潮兴起不是                的，其中体现了先贤诗人几千年的智慧与情感。结合新的时代条件传承和        中华优秀传统文化，也必将有效提升我们的文化自信，为中华民族伟大复兴创造条件。\n依次填入画横线处最恰当的一项是","options":{"A":"理所当然  发扬","B":"必然  宣传","C":"自然而然  倡导","D":"偶然  弘扬"},"answer":"D","explanation":"第一空，根据“古典诗歌中体现了先贤诗人几千年的智慧与情感”可知，它的兴起是长期发展的结果，是一种必然的趋势，D项“偶然”与“不是”搭配，表必然的意思，符合文意，当选。A项“理所当然”指按道理应当这样，B项“必然”指客观事物联系和发展的合乎规律的、确定不移的趋势，与文意相悖，排除；C项“自然而然”指非人力干预而自然如此，“非人力干预”文段未涉及，排除。答案锁定D项。\n第二空，代入验证，“弘扬中华优秀传统文化”搭配恰当，符合文意，当选。\n故正确答案为D。\n【文段出处】《让传统文化浸润时代人心》","no":36,"missingImage":false},{"qid":"2367974","cat":"逻辑填空","stem":"善良是洞穿黑暗的阳光，是心与心的亲和与信赖，是爱与爱的共振与        。善良让世界充满仁爱，让岁月溢满温馨。更多的时候，善良是危难时毫不犹豫地向你伸出的一双帮扶的手，是在你                时，向你坦然敞开的一扇门。\n依次填入画横线处最恰当的一项是","options":{"A":"交融  走投无路","B":"汇合  山穷水尽","C":"集聚  日暮途穷","D":"结晶  束手无策"},"answer":"A","explanation":"第一空，“是……是……”为相同句式，构成并列，第一句中“信赖”“亲和”均是动词，“信赖”表示相信、依赖，语义程度比“亲和”重。横线前“共振”指两个振动频率相同的物体，当一个发生振动时，引起另一个物体振动，为动词，故横线处也应填入动词，且语义程度比“共振”重。D项“结晶”指珍贵的劳动成果，为名词，置于此处用法不符，排除；B项“汇合”指集聚、会合，C项“集聚”指集合、聚合，应当首先集合，再产生共振，故二者语义程度均不比“共振”重，不符合语境，排除；A项“交融”指融合在一起，为动词，且语义程度比“共振”重，符合文意，保留。\n第二空，代入验证，论述当你处于困境时，善良的作用，A项“走投无路”比喻处境极困难，找不到出路，符合文意，且与横线后“一扇门”对应恰当，当选。\n故正确答案为A。\n【文段出处】《坚守善良》","no":37,"missingImage":false},{"qid":"2367915","cat":"逻辑填空","stem":"青藏高原的特殊生物环境和生物资源，为我国科学家开展原创性的工作提供了                的条件。我们需要建设一支年富力强、野外经验丰富、多民族        的科研团队，寻找高端人才培养的学术援藏新模式，让西藏的生态学研究真正实现可持续发展。\n依次填入画横线处最恰当的一项是","options":{"A":"无可比拟  结合","B":"独一无二  组合","C":"绝无仅有  整合","D":"得天独厚  融合"},"answer":"D","explanation":"第一空，根据“青藏高原的特殊生物环境和生物资源”可知，横线处表达青藏高原提供的条件是特殊的，D项“得天独厚”指有特殊优越的条件，符合文段意思。A项“无可比拟”指没有可以相比的；B项“独一无二”指没有相同的，没有可以相比的；C项“绝无仅有”指只有一个，再没有别的，都体现的是没有其他的可以比较，程度过重，文段强调是比较特殊的条件，排除。\n第二空，代入验证，多个民族合在一起的科研团队，D项“融合”指的是不同的事物合在一起，符合意思，当选。\n故正确答案为D。\n【文段出处】《与时间赛跑的人——钟扬教授的两个昼夜》","no":38,"missingImage":false},{"qid":"2367978","cat":"逻辑填空","stem":"在生物钟的作用下，蓝藻在日出之前即可提前动员光合作用系统，在阳光一出现的时候就可以        能量，比那些纯粹依靠光线启动光合系统的生物领先一步。与之类似，日落之后，蓝藻的光合系统会遵循生物钟的指令而关闭，避免那些夜间无须调动的能量被        浪费。\n依次填入画横线处最恰当的一项是","options":{"A":"提取  无故","B":"摄取  无谓","C":"吸取  过度","D":"汲取  超额"},"answer":"B","explanation":"第一空，搭配“能量”，表示光合作用系统吸收能量。A项“提取”表示经过提炼而取得，蓝藻的光合作用系统不能对太阳光的能量进行提炼，排除。B项“摄取”、C项“吸取”、D项“汲取”均表示吸收，符合文意，搭配恰当，保留。\n第二空，根据横线前“无须调动的能量”可知，这些能量不应该被浪费，故横线处应体现“不应当”的含义，对应B项“无谓”，表示没有意义。C项“过度”、D项“超额”表示过量，文段无此意，排除。\n故正确答案为B。\n【文段出处】《了解你的生物钟》","no":39,"missingImage":false},{"qid":"2367876","cat":"逻辑填空","stem":"中国传统文化中的“和而不同”与共享观念，                地成为“人类命运共同体”以及“民心相通”的价值观的注脚。中国向世界提出了“人类共同命运”的全球倡议，包含了对全球“普遍联结”与“价值关联”等发展特征的        概括，是中国特色全球传播的生动表述。\n依次填入画横线处最恰当的一项是","options":{"A":"恰逢其时  高度","B":"无可替代  简洁","C":"恰如其分  凝练","D":"正当其时  有力"},"answer":"C","explanation":"第一空，根据文意，该空表示中国的“和而不同”与共享观念，恰好符合对“人类命运共同体”以及“民心相通”价值观的解释，C 项“恰如其分”指办事或说话十分恰当合适，符合文意，当选。A 项“恰逢其时”指恰恰遇到这个时候，D 项“正当其时”指正是时候，文段并未涉及时间，排除；B 项“无可替代”指没有什么能够取代、替换，程度过重，排除。\n第二空，代入验证，根据“人类命运共同体”包含了“普遍联结”与“价值关联”等发展特征可知，它是对多种发展特征的非常简洁的概括，C 项“凝练”指紧凑简练，符合文意，当选。\n故正确答案为C。\n文段出处：《提升“一带一路”背景下中国价值观国际传播力的思考》","no":40,"missingImage":false},{"qid":"2367879","cat":"逻辑填空","stem":"支付工具的多样化组合，提升了我国支付体系运行的质量和效率，满足了公众            支付需求。从未来支付趋势看，现金支付和非现金支付工具相互        、相互补充、共存共生的局面将长期存在。但是对我国这样一个地域广、人口多、发展很不均衡的大国来说，由于核心技术水平的限制，过度依赖非现金支付会大大增加支付体系的脆弱性。因此，必须长期        现金作为国家法定支付方式的地位，切实保障广大人民使用现金的合法权益。\n依次填入画横线处最恰当的一项是","options":{"A":"区别化  支持  确保","B":"差异化  支撑  确立","C":"个性化  支援  确认","D":"多元化  支应  确证"},"answer":"B","explanation":"第一空，根据“支付工具的多样化组合”可知，横线处表达满足公众不同的支付需求，选项均符合文意。\n第二空，通过顿号与“相互补充”构成并列结构，横线处对应“补充”，表示现金支付与非现金支付长期共存，“相互支持”、“相互支撑”符合文意。C项“支援”指用人力、物力、财力或其他实际行动去支持和援助，D项“支应”指敷衍、应付，均与文意不符。\n第三空，与“地位”搭配，B项“确立地位”搭配恰当，当选。A项“确保”指切实保持或保证，搭配不当，用在此处应表述为“必须长期确保现金的首要地位不动摇”，排除。\n故正确答案为B。\n【文段出处】《中国金融》：现金的价值与生命力","no":41,"missingImage":false},{"qid":"2367981","cat":"逻辑填空","stem":"家庭农场的出现、成长、壮大，一方面顺应了新型城镇化发展和农民进城转变身份的要求，让农民进城居住、生活无                ；另一方面也改变了农业生产关系，重新        农业生产秩序，将留守在农村的老人、妇女从        的农户劳动中解放出来，可以像城镇居民一样，依靠工资和政府提供的公共服务过上“体面”生活。\n依次填入画横线处最恰当的一项是","options":{"A":"衣食之忧  调整  困顿","B":"生存之虞  治理  芜杂","C":"燃眉之急  整理  沉重","D":"后顾之忧  整合  繁重"},"answer":"D","explanation":"第一空，由“依靠工资和政府提供的公共服务过上‘体面’生活”可知，农民进城居住生活有所保证，横线处词语表示担心忧虑之意，A项“衣食之忧”指对于衣物食物的担心，B项“生存之虞”指有关于生存方面的忧虑，D项“后顾之忧”形容担心后方或者将来会产生的忧虑，均符合文意，保留。C项“燃眉之急”比喻非常紧迫的情况，不表示内心的担忧，与文意不符，排除。\n第二空，横线处词语与“秩序”搭配，A项“调整”、D项“整合”均符合文意，保留。B项“治理”表示统治管理或整修，与“秩序”搭配不当，排除。\n第三空，横线处词语与“劳动”搭配，D项“繁重”形容繁多而沉重，符合农户劳动的特点，当选。A项“困顿”指劳累到不能支持或者终日劳碌生计或境遇，艰难窘迫，程度过重，且与“劳动”搭配不当，排除。\n故正确答案为D。\n【文段出处】《居村农民转变身份的依托》","no":42,"missingImage":false},{"qid":"2367878","cat":"逻辑填空","stem":"地方戏曲是中华文化的重要组成部分，在新时代受到诸多新兴事物的冲击而略显暗淡，甚至濒临消亡。作为新时期的文化工作者，我们        着传承和保护中华传统文化的使命，如何在整个社会大环境中，营造出戏曲文化氛围，不断传承和发展地方戏曲，使其兼具传统韵味和时代气息，赢得更多人的喜爱，是我们需要始终                探索的课题。\n依次填入画横线处最恰当的一项是","options":{"A":"背负  矢志不渝","B":"承担  孜孜以求","C":"担负  持之以恒","D":"肩负  坚持不懈"},"answer":"D","explanation":"第一空，横线处与“使命”搭配，B项“承担”指担负、担当，C项“担负”指承当，D项“肩负”指担负，三项均可与“使命”搭配，均保留。A项“背负”指担负，多搭配偏消极或中性词，如“包袱、重任、债务”等，与“使命”搭配不当，排除。\n第二空，与“探索”搭配且通过“始终”进行修饰，用来形容对课题的探索自始至终一直进行下去。D项“坚持不懈”指坚持到底，毫不松懈，侧重点在不松懈，形容探索的过程，符合文意，当选。B项“孜孜以求”比喻不知疲倦地探求，本身包含“求”的语境，与后文“探索”语义重复，排除；C项“持之以恒”指长久坚持下去，“恒”与“始终”语义重复，排除。\n故正确答案为D。\n【文段出处】《论如何实现地方戏曲的传承与保护》（文段有更改）","no":43,"missingImage":false},{"qid":"2367985","cat":"逻辑填空","stem":"中国是最早筑城的国家之一。数千年来，中国先后修建了至少数千座不同等级的各类城池，        了辉煌的古代城市文化，                、自成系统、独树一帜，是人类文明史中                的组成部分。\n依次填入画横线处最恰当的一项是：","options":{"A":"制造  生生不息  不可替代","B":"创造  绵延不绝  不可或缺","C":"积累  经久不息  必不可少","D":"积淀  络绎不绝  举足轻重"},"answer":"B","explanation":"第一空，搭配“城市文化”，B项“创造”指想出新方法、建立新理论、做出新的成绩或东西，C项“积累”指逐渐积聚，D项“积淀”指在长期积累中形成（多用于抽象事物），均搭配恰当，符合文意，保留。A项“制造”指造成某种气氛或局面，与“文化”搭配不当，排除。\n第二空，根据“自成系统、独树一帜”可知，横线处也应表示古代城市文化好的特点，B项“绵延不绝”形容连续不断，一直延续，可形容城市文化的旺盛的生命力，符合文意，保留。C项“经久不息”代表着一种动作所受到欢迎程度，多用在鼓掌或欢呼时，D项“络绎不绝”形容行人车马来来往往，接连不断，均无法形容城市文化的特点，排除。\n第三空，代入验证，B项“不可或缺”指非常重要，指中国城市文化是人类文明史的重要组成部分，符合文意，当选。\n故正确答案为B。\n【文段出处】《《中国古城墙》：城市从何而来，到何处去》","no":44,"missingImage":false},{"qid":"2367888","cat":"逻辑填空","stem":"应当看到，农业调结构是一个动态的过程，不可能一调到位、                。农业也是慢热型产业，培育一个成熟品牌，要三五年、十多年，甚至更长时间，靠政府部门                不行，必须尊重农业发展规律和市场规律，扎扎实实、                、一步一步走。\n依次填入画横线处最恰当的一项是","options":{"A":"一挥而就  大刀阔斧  锲而不舍","B":"一劳永逸  揠苗助长  持之以恒","C":"一蹴而就  快马加鞭  孜孜矻矻","D":"一步登天  越俎代庖  水滴石穿"},"answer":"B","explanation":"第一空，“、”引导并列，横线处与“一调到位”构成并列，表达一下子就完成之意；B项“一劳永逸”指辛苦一次，把事情办好，以后就可以不再费力；C项“一蹴而就”指事情轻而易举，一下子就成功，均符合文意。A项“一挥而就”指才思敏捷，一动笔就写成，文段说的是农业而不是写作，排除；D项“一步登天”指一下子达到很高的境界或爬上高位，与文段“农业调结构”的语境不符，排除。\n\n第二空，根据文意可知，横线所填词语体现出没有尊重事物发展规律的意思，B项“揠苗助长”比喻违反事物的发展规律，急于求成，反而坏事，符合文意。C项“快马加鞭”强调快上加快，没有体现不尊重事物规律的意思，排除。\n第三空，代入验证，与“扎扎实实”、“一步一步”构成并列，表达农业是一个长期的过程，尊重发展规律，B项“持之以恒”长久地坚持下去，语意符合，当选。\n故正确答案为B。\n【文段出处】《“菜园子”要跟上“菜篮子”》","no":45,"missingImage":false}]}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2367977","cat":"数学运算","stem":"51.03，52.06，54.12，57.24，61.48，（    ）","optio m":"左边给定的是纸盒外表面的展开图，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"6cec14732759\" style=\"max-width:554px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"将题干展开图中的面依次标注为面a、b、c、d，如下图：\n\u003cimg data-k=\"8c29cad4709a\" style=\"max-width:554px\">\nA项：以面d黑尖为起点顺时针画边，题干中第1条边对着的是面a，选项中第1条边对着的不是面a，选项与题干不一致，排除；\n\u003cimg data-k=\"9d03e72121b9\" style=\"max-width:554px\">\nB项：选项由面a、面d构成，以面d黑尖为起点顺时针画边，题干中第1条边对着的是面a，选项中第3条边对着的是面a，选项与题干不一致，排除；\n\u003cimg data-k=\"0c040dd0ea15\" style=\"max-width:553px\">\nC项：与题干一致，当选；\nD项：选项由面b、面c构成，题干中面b、面c内的线段交点在公共边上，选项中面b、面c内的线段交点不在公共边上，选项与题干不一致，排除。\n故正确答案为C。","no":84,"missingImage":false},{"qid":"2367988","cat":"图形推理","stem":"左边给定的是纸盒外表面的展开图，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"5c29136ddea7\" style=\"max-width:554px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"将题干展开图中的面依次标注为面a、b、c、d，如下图：\n\u003cimg data-k=\"74d024f70094\" style=\"max-width:553px\">\nA项：选项由面a、面b构成，题干中面a和面b的公共边是白色直角三角形的斜边，选项中面a和面b的公共边是黑色直角三角形的斜边，选项与题干不一致，排除；\n\u003cimg data-k=\"39340f2e6ac9\" style=\"max-width:554px\">\nB项：选项由面a、面d构成，题干中面a和面d的公共边是黑色直角三角形短直角边，而选项中，面a和面d的公共边是黑色直角三角形的斜边，选项与题干不一致，排除；\u003cimg data-k=\"c376a237b1a1\" style=\"max-width:553px\">\nC项：选项由b、面c构成，题干中面b和面c的公共边是面b中白色梯形的下底边，而选项中面b和面c的公共边不是面b中白色梯形的下底边，选项与题干不一致，排除；\n\u003cimg data-k=\"935f0c8b5e8e\" style=\"max-width:553px\">\nD项：与题干一致，当选。\n故正确答案为D。","no":85,"missingImage":false},{"qid":"2367989","cat":"图形推理","stem":"左边给定的是纸盒外表面的展开图，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"f9ea365f7587\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查六面体的空间重构。将展开图中的各面进行标号，如图1所示：\n\u003cimg data-k=\"a68f5bdfeeb2\" style=\"max-width:700px\">\nA项：与题干展开图一致，当选；\nB项：展开图中，\u003cspan style=\"color:#rgb(89,89,89)\">面\u003c/span>c中白正方形的红点与\u003cspan style=\"color:#rgb(89,89,89)\">面\u003c/span>f中黑正方形的黄点不重合（如图2所示），而选项中二者是重合的，选项与题干不一致，排除；\nC项：展开图中，\u003cspan style=\"color:#rgb(89,89,89)\">面\u003c/span>a和\u003cspan style=\"color:#rgb(89,89,89)\">面\u003c/span>f是相对面，\u003cspan style=\"color:#rgb(89,89,89)\">面\u003c/span>c和\u003cspan style=\"color:#rgb(89,89,89)\">面\u003c/span>e是相对面，这两对相对面均不能同时在立体图中出现，但选项的黑三角形面不管是\u003cspan style=\"color:#rgb(89,89,89)\">面\u003c/span>a还是\u003cspan style=\"color:#rgb(89,89,89)\">面\u003c/span>e，选项中均有相对面，选项与题干不一致，排除；\nD项：展开图中，\u003cspan style=\"color:#rgb(89,89,89)\">面\u003c/span>b中灰色三角形的直角边挨着f面中的黑正方形，而选项中二者无此关系，选项与题干不一致，排除。\n故正确答案为A。","no":86,"missingImage":false},{"qid":"2367990","cat":"图形推理","stem":"左边给定的是纸盒外表面的展开图，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"54413e13760a\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查六面体的空间重构。将平面图中的各面进行标号，如图1所示：\n\u003cimg data-k=\"698d183ef4ca\" style=\"max-width:477px\">\nA项：展开图中，面a黑色三角形的黑色直角边挨着面c，而选项中面a黑色三角形的黑色直角边没有挨着面c，选项与题干不一致，排除；\nB项：展开图中，面a和面d是相对面，相对面不能同时出现，但选项中两个面是相邻面，选项与题干不一致，排除；\nC项：与题干展开图一致，当选；\nD项：展开图中，面b和面e是相对面，相对面不能同时出现，而选项中二个面是相邻面，选项与题干不一致，排除。\n故正确答案为C。","no":87,"missingImage":false},{"qid":"2367991","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"39493788bb75\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查三视图，九宫格优先按横行找规律。观察发现，第一行立体图形的左视图均相同（呈“L”形），第二行立体图形的左视图均相同（呈“L”形），第三行前两幅立体图形的左视图均相同（呈“L”形），只有A项符合这一规律（C项立体图形的左视图也是L形，但方向与题干不同）。\n故正确答案为A。","no":88,"missingImage":false},{"qid":"2367946","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"bdf915d76430\" style=\"max-width:592px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查图形的实际意义，寻找最大共同点。观察发现，题干所有图形都是一根枝干上长满了相同的叶子或花，九宫格优先按横行来看，第一行，花枝朝向依次为左、右、左；第二行，花枝朝向依次是右、左、右，规律均为左右交替出现，第三行前两个图花枝朝向为左、右，因此“？”处花枝朝向应为左，C、D两项花枝朝向不是左（注：C项可能存在争议，有部分同学觉得是朝上，无论是朝右还是朝上，均不是朝左），均排除；A项花枝最上面是3朵花，下面是3片叶子，一根枝干上元素不相同，只有B项满足题干图形特征。\n故正确答案为B。","no":89,"missingImage":false},{"qid":"2367993","cat":"图形推理","stem":"左图为给定的立体，从任意角度剖开，右边哪一项不可能是它的截面图？\n\u003cimg data-k=\"f1d2aa136134\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查截面图。逐一分析选项。如下图所示，A、C、D项均可截出，如下图所示。B项无法截出，因为三棱柱是空心部分，B项中间矩形的两侧不应该有线。\n\u003cimg data-k=\"708cb3ec00b8\" style=\"max-width:700px\">\n本题为选非题，故正确答案为B。","no":90,"missingImage":false},{"qid":"2367996","cat":"逻辑判断","stem":"马克思是顶天立地的伟人，也是有血有肉的常人。他热爱生活，真诚朴实，重情重义。马克思、恩格斯的革命友谊长达40年。正如列宁所说：“古老传说中有各种非常动人的友谊故事”，但马克思、恩格斯的友谊“超过了古人关于人类友谊的一切最动人的传说”。\n根据以上陈述，可以得出以下哪项？","options":{"A":"有的顶天立地的伟人热爱生活、重情重义","B":"古代各种非常动人的友谊一般都不超过40年","C":"恩格斯同样热爱生活，真诚朴实，重情重义","D":"列宁也是顶天立地的伟人和有血有肉的常人"},"answer":"A","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干第一句和第二句可知，马克思是一个顶天立地的伟人，他热爱生活、重情重义，可以得到有的顶天立地的伟人热爱生活、重情重义，可以推出，当选；\nB项：题干中只是说明马克思和恩格斯的友谊长达40年，没有提及古代所有非常动人的友谊持续的时间情况，无中生有，排除；\nC项：题干中没有提及恩格斯是否热爱生活，真诚朴实，重情重义，无中生有，排除；\nD项：题干中没有提及列宁是什么样的人，无中生有，排除。\n故正确答案为A。","no":91,"missingImage":false},{"qid":"2367951","cat":"逻辑判断","stem":"人饿了会吃东西，一旦摄入碳水化合物、脂肪、蛋白质等能量营养素，就能消除饥饿感，这种缺乏能量营养素的饥饿是显性饥饿；然而，人体健康还需铁、锌等16种矿物元素及维生素A、维生素E等13种维生素，如果缺乏这些微量营养素，则会造成隐性饥饿。显然，显性饥饿只要“吃饱”就能解决，而隐性饥饿只有“吃好”才能应对。\n根据以上陈述，可以得出以下哪项？","options":{"A":"既要“吃饱”又要“吃好”，如此就能保证人体的健康","B":"消除显性饥饿对人更重要，只有“吃饱”才能“吃好”","C":"隐性饥饿并不同于显性饥饿，“吃不好”不等于“吃不饱”","D":"隐性饥饿对人体健康的危害比显性饥饿更大、更隐蔽"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干可知，“吃饱”可以解决显性饥饿，“吃好”可以解决隐性饥饿，但题干未提及二者同时成立是否就能保证人体健康，无法推出，排除；\nB项：题干中并未比较消除显性饥饿与消除隐性饥饿哪个更重要，无法推出，排除；\nC项：根据题干最后一句话可知，显性饥饿只要“吃饱”就能解决，而隐性饥饿只有“吃好”才能应对，说明这两种饥饿是不同的，其解决方式也并不相同，可以推出，当选；\nD项：题干中并未比较显性饥饿与隐性饥饿哪个对人体的健康危害更大，无法推出，排除。\n故正确答案为C。","no":92,"missingImage":false},{"qid":"2367861","cat":"逻辑判断","stem":"某区对所辖钟山、长江、梅园、星海4个街道进行抽样调查，并按照人均收入为其排序。有人根据以往经验对4个街道的人均收入排序作出如下预测：\n（1）如果钟山街道排第三，那么梅园街道排第一；\n（2）如果长江街道既不排第一也不排第二，那么钟山街道排第三；\n（3）钟山街道排序与梅园街道相邻，但与长江街道不相邻。\n事后得知，上述预测符合调查结果。\n根据以上信息，可以得出以下哪项？","options":{"A":"钟山街道不排第一就排第四","B":"长江街道不排第二就排第三","C":"梅园街道不排第二就排第四","D":"星海街道不排第一就排第三"},"answer":"A","explanation":"第一步：分析题干条件。\n① 钟山第三\u003cimg data-k=\"7b6029b3bbde\">梅园第一；\n② 长江\u003cimg data-k=\"e752a8ae1a16\">第一 且 \u003cimg data-k=\"e752a8ae1a16\">第二\u003cimg data-k=\"7b6029b3bbde\">钟山第三；\n③ 钟山与梅园相邻，与长江不相邻。\n第二步：根据题干条件进行推理。\n钟山出现次数最多，为最大信息，可作为突破口。根据③可知：钟山与梅园相邻，结合①可知：钟山第三\u003cimg data-k=\"7b6029b3bbde\">梅园第一，故钟山不能排名第三。\u003cimg data-k=\"e752a8ae1a16\">钟山第三是对②的否后，否后必否前，故长江排名第一或者第二。\n如果长江排第一，根据③可知钟山只能排第四，故梅园排第三，星海排第二，排除B、C、D项，只有A项成立；\n如果长江排第二，根据③可知钟山只能排第四，故梅园排第三，星海排第一，A项依然成立。\n故正确答案为A。","no":93,"missingImage":false},{"qid":"2367950","cat":"逻辑判断","stem":"当今社会，不少老人为了帮助子女照顾下一代而漂泊异乡成为“老漂族”。在最近一项城市调查中，\u003cimg data-k=\"fc8bc69f3f98\">的受访青年坦言，自己的父母就是老漂族，自己与爱人事业刚刚起步，工作压力较大，根本没有时间照顾孩子和做家务。有专家据此断言，我国城市中的老漂族群体还会进一步扩大。\n以下哪项如果为真，最能支持上述专家的观点？","options":{"A":"老人在城市养老可拥有比乡村更好的医疗条件","B":"有些老人故土难离事务缠身更愿意生活在家乡","C":"国家二孩政策的实施将会促使更多的孩子出生","D":"二孩政策实施后城市的二孩出生率要低于农村"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：我国城市中的老漂族群体还会进一步扩大。\n论据：\u003cimg data-k=\"fc8bc69f3f98\">的受访青年坦言，自己的父母就是老漂族，自己与爱人事业刚刚起步，工作压力较大，根本没有时间照顾孩子和做家务。\n题干论点探讨的是老漂族群体会进一步扩大，可以通过补充论据说明老漂族群体在增加或照顾孩子和做家务的人员短缺等进行加强。\n第二步：逐一分析选项。\nA项：说的是城市养老医疗条件比乡村更好，与论点说的老漂族群体会进一步扩大无关，话题不一致，无法加强，排除；\nB项：说的是老人更愿意生活在家乡，老人的意愿与论点说的老漂族群体会进一步扩大无关，无法加强，排除；\nC项：国家二孩政策会促使更多的孩子出生，补充论据说明需要照顾孩子的情况会更多，对老漂族群体扩大进行了加强，可以支持，当选；\nD项：二孩出生率农村更高，农村的照顾孩子的需求会更多些，老漂族应该会减少而不是扩大，无法加强，排除。\n故正确答案为C。","no":94,"missingImage":false},{"qid":"2367999","cat":"逻辑判断","stem":"某机关举行职工秋季田径运动会。已知：所有报名参加短跑比赛的职工都报名参加铅球比赛，所有报名参加跳远比赛的职工都没有报名参加铅球比赛，报名参加跳高比赛的职工也都报名参加了跳远比赛，而没有报名参加跳高比赛的职工也都没有报名参加长跑比赛。\n根据以上陈述，可以得出以下哪项？","options":{"A":"有的报名参加铅球比赛的职工没有报名参加短跑比赛","B":"有的报名参加跳高比赛的职工没有报名参加长跑比赛","C":"所有报名参加跳远比赛的职工都报名参加长跑比赛","D":"所有报名参加短跑比赛的职工都没有报名参加长跑比赛"},"answer":"D","explanation":"第一步：翻译题干。\n（1）短跑→铅球；\n（2）跳远→-铅球；\n（3）跳高→跳远；\n（4）-跳高→-长跑。\n将条件进行串联，可得短跑→铅球→-跳远→-跳高→-长跑。\n第二步：逐一分析选项。\nA项翻译：有的铅球→-短跑，由条件（1）只能得到“有的铅球→短跑”，根据“有的①是②”不能推出“有的①不是②”，无法推出，排除；\nB项翻译：有的跳高→-长跑，由条件（4）只能得到“有的跳高→长跑”，根据“有的①是②”不能推出“有的①不是②”，无法推出，排除；\nC项翻译：跳远→长跑，由题干可知-跳远→-跳高→-长跑，跳远是否定条件的前件，得不到确定性的结论，无法推出，排除；\nD项翻译：短跑→-长跑，根据上述分析串联，可以得到短跑→铅球→-跳远→-跳高→-长跑，可以推出，当选。\n故正确答案为D。","no":95,"missingImage":false},{"qid":"2368009","cat":"逻辑判断","stem":"我国家长们对儿童阅读越来越重视，大多数家长希望孩子多读书读好书。2018年，某市\u003cimg data-k=\"e98b0b40299a\">的家庭有父母陪孩子读书的习惯，亲子阅读的图书量比2017年提高了1.8个百分点，时长也比去年有所增加。但是，2018年该市的儿童人均图书阅读量仅为4.72本，比2017年还下降了0.6个百分点。\n以下哪项如果为真，最能解释上述现象？","options":{"A":"近年来孩子课业负担较重，对课外阅读很多人是“心有余而时不足”","B":"在亲子阅读中很多孩子习惯“听书”，这种情况2018年未计算在内","C":"大多数80后、90后家长都受过高等教育，比较看重亲子阅读的意义","D":"孩子在手机、电脑上的电子阅读一直未纳入儿童图书阅读的考虑范围"},"answer":"B","explanation":"第一步：找出题干矛盾。\n2018年，某市亲子阅读的图书量比2017年提高了1.8个百分点，时长也比去年有所增加。但2018年该市的儿童人均图书阅读量比2017年还下降了0.6个百分点。\n第二步：逐一分析选项。\nA项：孩子课业负担较重，对课外阅读很多人是“心有余而时不足”，提及了儿童阅读量不高，但是并没有涉及亲子阅读的影响，不能解释题干矛盾，排除；\nB项：在亲子阅读中很多孩子习惯“听书”，这种情况未计算在图书阅读量内，既提及了亲子阅读，又涉及了读书量计算的方式，能够解释为什么2018年亲子阅读量增加而儿童阅读量并没有增加的情况，可以解释题干矛盾，当选；\nC项：大多数80后、90后家长比较看重亲子阅读的意义，提及了亲子阅读的图书量可能更多，但并没有涉及儿童的人均读书量为何下降，不能解释题干矛盾，排除；\nD项：孩子在手机、电脑上的电子阅读一直未纳入儿童图书阅读的考虑范围，没有涉及亲子阅读的影响，而且选项说的是一直，也就是说2017年和2018年均未考虑在内，不能解释题干矛盾，排除。\n故正确答案为B。","no":96,"missingImage":false},{"qid":"2367949","cat":"逻辑判断","stem":"某地开展企业结对扶贫创新活动，倡导企业家与贫困家庭互选，要求每户贫困家庭只能选1位企业家，而每位企业家只能在选他的贫困家庭中选择1-2户开展帮扶活动。现有企业家甲、乙、丙3人面对张、王、李、赵4户贫困家庭，已知：\n（1）张、王2户至少有1户选择甲；\n（2）王、李、赵3户中至少有2户选择乙；\n（3）张、李2户中至少有1户选择丙。\n事后得知，互选顺利完成，每户贫困家庭均按自己心愿选到了企业家，而每位企业家也按要求选到了贫困家庭。\n根据以上信息，可以得出以下哪项？","options":{"A":"企业家甲选到了张户","B":"企业家乙选到了赵户","C":"企业家丙选到了李户","D":"企业家甲选到了王户"},"answer":"B","explanation":"分析题干。\n（1）张或王选甲\n（2）王、李、赵中至少2户选乙\n（3）张或李选丙\n由题干“每户贫困家庭只能选1位企业家，每位企业家只能在选他的贫困家庭中选择1-2户开展帮扶活动”可知：甲互选的帮扶家庭数为1，乙互选的帮扶家庭数为2，丙互选的帮扶家庭数为1；再根据条件（1）可知，张或王选甲，说明李和赵不选甲；由条件（2）可知，张不选乙，由条件（3）可知，王和赵不选丙，此时赵即不选甲也不选丙，又已知“每户贫困家庭均按自己心愿选到了企业家”，因此，赵只能选企业家乙，即企业家乙选到了赵户。\n故正确答案为B。","no":97,"missingImage":false},{"qid":"2367860","cat":"逻辑判断","stem":"智能手机流行的时代，我们每天发送信息，也收到信息。人际之间的电子信息交往已成为当今时代一种独特的交往方式。在面对重要的人或关系时，很多人往往发出信息后就期待被秒回，如果没有被秒回，他们就产生一种怀疑感或被弃感，从而陷入深深的烦恼和焦虑之中。\n以下哪项最可能是他们陷入深深烦恼和焦虑所需的假设？","options":{"A":"当前技术已能实现智能手机的即时通信，方便快捷，且基本免费","B":"有些聊天软件能在发送者手机中反馈信息接收者是否阅读了信息","C":"有些人工作很忙，总习惯在忙完一天工作后才统一处理相关信息","D":"有些人一天收到的信息太多，容易遗漏某人期待秒回的重要信息"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：在面对重要的人或关系时，很多人往往发出信息后就期待被秒回，如果没有被秒回，他们就产生一种怀疑感或被遗弃感，从而陷入深深的烦恼和焦虑之中。\n论据：无。\n本题无论据，只能通过补充论据进行加强。提问方式是假设类，优先考虑补充必要条件，即没有这个选项，论点则无法成立。\n第二步：逐一分析选项。\nA项：如果智能手机不能即时通信，那么发出的信息就无法被即时接收，发出者就不会期待秒回，因此A项是信息能够被秒回的必要条件，当选；\nB项：有些聊天软件能在发送者手机中反馈信息接收者是否阅读了信息，可以解释部分发出者为什么没有被秒回就会产生怀疑感或被弃感，但是力度较弱，且不是论点成立的必要条件，排除；\nC项：接收者什么时候阅读信息与发出者没被秒回就会产生烦恼和焦虑无关，排除； \nD项：接收者是否遗漏了重要信息与发出者没被秒回就会产生烦恼和焦虑无关，排除。\n故正确答案为A。\n附：通过查证原文，本题答案为A项。\n\u003cimg data-k=\"6b2f2c14ad9a\" style=\"max-width:700px\">","no":98,"missingImage":false},{"qid":"2367802","cat":"定义判断","stem":"公众充权：指在公共政策的制定、执行、评估、监督过程中，公众积极参与，充分表达自己的利益主张，以推动公共政策过程的民主化与科学化。\n下列属于公众充权的是","options":{"A":"清明节到来前夕，一些社会人士在市文明办支持下创建了文明祭扫网站，号召民众祭扫时不放鞭炮，不烧纸钱，改用虚拟鲜花、电子蜡烛等绿色环保的方式","B":"快递小哥小李当选市人大代表后，在广泛走访充分调研的基础上，提交了一份关于如何保障快递员权益、促进快递行业健康发展的议案","C":"某市将要召开天然气价格调整听证会，有关部门要求辖区各街道、居委会搞好宣传动员工作，按照下达名额推举市民代表，确保公开公平公正","D":"在某县未来五年发展规划制定过程中，县委、县政府通过召开居民座谈会、专家听证会等形式，征求到了许多宝贵的意见"},"answer":"D","explanation":"第一步：找出定义关键词。\n“在公共政策的制定、执行、评估、监督过程中”、“公众积极参与，充分表达自己的利益主张”、“推动公共政策过程的民主化与科学化”。\n第二步：逐一分析选项。\nA项：创建文明祭扫网站，号召改用绿色环保的方式，不符合“在公共政策的制定、执行、评估、监督过程中”，不符合定义，排除；\nB项：提交议案，不符合“在公共政策的制定、执行、评估、监督过程中”，不符合定义，排除；\nC项：召开天然气价格调整听证会可以理解为“在公共政策的制定、执行、评估、监督过程中”，但按照下达名额推举市民代表，不符合“公众积极参与，充分表达自己的利益主张”，不符合定义，排除；\nD项：在某县未来五年发展规划制定过程中，符合“在公共政策的制定、执行、评估、监督过程中”，通过召开居民座谈会、专家听证会等形式，征求到了许多宝贵的意见，符合“公众积极参与，充分表达自己的利益主张”，符合定义，当选。\n故正确答案为D。","no":99,"missingImage":false},{"qid":"2367816","cat":"定义判断","stem":"社会性处罚：指存在失信行为的人员所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚。\n下列属于社会性处罚的是","options":{"A":"以“站不起来”为理由强占他人座位的高铁“霸座男”，当场受到了乘警的严肃批评，下车后被移送公安机关接受治安处罚。这一事件曝光后，当事人的恶劣行为又遭到了全国网民的一致谴责","B":"由于数据造假，某教授在国际期刊上发表的论文被撤稿。在网民的谴责声中，该教授又被撤销了基于该论文所获得的绩效奖励、省部级科研项目、荣誉称号、社会兼职","C":"春节前夕，恶意拖欠农民工工资的部分包工头，被有关部门和各种媒体曝光，引起社会各界密切关注。根据银行、保险、铁路等部门的规定，这些违规者申请信用卡、购买保险以及动车和高铁票时都将受到限制","D":"长江沿岸的一家化工企业，多次不顾禁令向长江偷偷排污，最近被省有关部门通报批评，吊销了企业生产执照，它的上级主管部门及主要负责人也都受到了严厉的处罚"},"answer":"C","explanation":"第一步：找出定义关键词。\n“存在失信行为的人员”、“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”。\n第二步：逐一分析选项。\nA项：以“站不起来”为理由强占他人座位的高铁“霸座男”，符合“存在失信行为的人员”，当场受到了乘警的严肃批评，被移送公安机关接受治安处罚，这是与自身失信行为有直接关联的限制和处罚，不符合“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”，不符合定义，排除；\nB项：某教授数据造假，符合“存在失信行为的人员”，论文被撤稿，撤销了基于该论文所获得的绩效奖励、省部级科研项目、荣誉称号、社会兼职，均是与自身失信行为有直接关联的处罚，不符合“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”，不符合定义，排除；\nC项：恶意拖欠农民工工资的包工头，符合“存在失信行为的人员”，申请信用卡、购买保险以及动车和高铁票时都将受到限制，符合“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”，符合定义，当选；\nD项：长江沿岸的一家化工企业，多次不顾禁令向长江偷偷排污，不符合“存在失信行为的人员”，不符合定义，排除。\n故正确答案为C。","no":100,"missingImage":false},{"qid":"2367829","cat":"定义判断","stem":"信息焦虑：指人们在过量信息包围下因为难以获取、处理、利用所需信息而产生的厌倦、烦躁、紧张等负面情绪。\n下列属于信息焦虑的是","options":{"A":"小敏热衷于娱乐八卦，她时刻关注微博更新，看到手机上的未读信息就忍不住想去点击，每天用于浏览信息的时间远远超过她自己的工作时间","B":"在开发商那里登记过购房意向后，闵先生每天都会接到几十个乃至上百个电话和信息，卖房的、装修的、投资的、理财的、贷款的，让他不胜其烦","C":"小谢沉迷于网络游戏，一玩就是一通宵，白天上课总是想着游戏，久而久之产生了严重的厌学情绪，精神状态萎靡不振，身体素质越来越差","D":"小李在外文数据库查资料，每输入一个关键词就跳出几十篇相关论文，因英语欠佳，没法筛选，完全不知道哪些才是自己真正要用的，感觉精神马上就要崩溃了"},"answer":"D","explanation":"第一步：找出定义关键词。\n“人们在过量信息包围下因为难以获取、处理、利用所需信息”、“而产生的厌倦、烦躁、紧张等负面情绪”。\n第二步：逐一分析选项。\nA项：每天用于浏览信息的时间远远超过她自己的工作时间，该选项没有体现出厌倦、烦躁、紧张等负面情绪，不符合定义，排除； \nB项：在开发商登记过购房意向后，接到几十个乃至上百个电话和信息，而这些信息大部分都是闵先生所不需要的，体现不出闵先生“难以获取、处理、利用所需信息”，不符合定义，排除；\nC项：小谢沉迷于游戏，白天上课也总想着游戏，该选项没有体现出“过量的信息”，不符合定义，排除；\nD项：小李查询资料，每输入一个关键词就跳出几十篇相关论文，因英语欠佳，没法筛选，不知道哪个是自己要用的，符合“人们在过量信息包围下因为难以获取、处理、利用所需信息”，感觉精神马上就要崩溃了，符合“产生的厌倦、烦躁、紧张等负面情绪”，符合定义，当选。\n故正确答案为D。","no":101,"missingImage":false},{"qid":"2367839","cat":"定义判断","stem":"互联网公益：指民间团体或企业通过网络平台，发动社会公众参与的具有门槛低、透明度高、互动性强等特点的公益活动。\n下列属于互联网公益的是：","options":{"A":"某公司每年拨出专款开展公益活动，在官网上征集白内障患者并向符合特定条件的患者提供全部医疗费用","B":"得知老张遭遇车祸，他的老同学通过班级群、朋友圈很快募集了三万多元捐款全部转交到他家","C":"某爱心服务站每年开学前在自己的主页上公布来自各界的网络捐款账目，并邀请部分捐款人一起把善款送到山区小学","D":"某村委会通过网络平台发起“一帮一”捐资助学活动，帮助本村特困家庭的大学生解决了学费问题"},"answer":"C","explanation":"第一步：找出定义关键词。\n“民间团体或企业”、“通过网络平台”、“公众参与”、“门槛低、透明度高、互动性强公益活动”。\n第二步：逐一分析选项。\nA项：某公司符合“民间团体或企业”，在官网符合“通过网络平台”，并向符合特定条件的患者提供全部医疗费用，不符合“门槛低、透明度高、互动性强公益活动”，不符合定义，排除；\nB项：通过班级群、朋友圈募集捐款符合“通过网络平台”，但其同学是发起人不符合“民间团体或企业”，不符合定义，排除；\nC项：爱心服务站符合“民间团体或企业”，网络捐款账目符合“通过网络平台”，邀请部分捐款人一起把善款送到山区小学说明活动互动性强，符合定义，当选；\nD项：通过网络平台捐资助学符合“通过网络平台”，但村委会不符合“民间团体或企业”，不符合定义，排除。\n故正确答案为C。","no":102,"missingImage":false},{"qid":"2367821","cat":"定义判断","stem":"情感性劳动：指服务业员工在与顾客面对面交往时，将个人情感融入工作过程，对顾客、企业以及服务人员自己产生积极影响的行为。\n下列属于情感性劳动的是：","options":{"A":"某航空公司空姐站在登机口两旁欢迎乘客，时不时还会微笑着摸摸小孩的头","B":"小刘总是面带微笑、语气亲切热情地接打电话，连续多年被评为最美接线员","C":"某酒店智能客服“小青”善解人意，语音甜美，入住的客人都喜欢和她互动","D":"小秦在信访局工作多年，每次接待来访者，都非常耐心，细致了解具体情况"},"answer":"A","explanation":"第一步：找出定义关键词。\n“服务业员工”、“顾客”、“面对面”、“个人感情”、“对顾客、企业及自己产生积极影响”。\n第二步：逐一分析选项。\nA项：空姐属于“服务业员工”，站在登机口欢迎属于“面对面”，微笑摸摸小孩的头符合“个人感情”，符合定义，当选；\nB项：接打电话不符合“面对面”，不符合定义，排除；\nC项：小青是智能客服，不符合“个人情感”，不符合定义，排除；\nD项：小秦耐心、细致了解只体现工作负责，未体现“个人感情”，不符合定义，排除。\n故正确答案为A。","no":103,"missingImage":false},{"qid":"2368002","cat":"定义判断","stem":"气候移民：指因为气候或自然环境的恶化，人们在原居住地无法继续生存而大规模迁移的现象。\n下列属于气候移民的是：","options":{"A":"为了恢复草原生态，保护天然牧场，原来散居的牧民搬迁到了统一规划建成的定居点","B":"每到冬天，为了躲避严寒，一批又一批东北老人成群结队地跑到气候温暖的海南过冬","C":"非洲一些地方长期干旱，农作物常年歉收。当地居民陆陆续续离开家园，四处寻找新的居住地","D":"随着全球气候变暖，海平面逐渐上升，不少岛屿被海水淹没，岛上居民被迫搬迁异地"},"answer":"D","explanation":"第一步：找出定义关键词。\n“因为气候或自然环境恶化”、“原居住地无法生存”、“大规模迁移”。\n第二步：逐一分析选项。\nA项：散居牧民搬迁到统一定居点是为了恢复草原生态，不符合“因为原居住地无法生存”，不符合定义，排除；\nB项：东北老人为了躲避严寒到海南过冬，是从严寒地区转移到温暖地区度过一段时间，不符合“原居住地无法生存”，不符合定义，排除；\nC项：干旱是气候现象，歉收是指农作物产量低于一般水平，没有提及“原居住地无法生存”，且“陆陆续续”不符合“大规模”，不符合定义，排除；\nD项：气候变暖符合“气候或自然环境恶化”，岛屿被淹没符合“原居住地无法生存”，岛上居民搬迁符合“大规模迁移”，符合定义，当选。\n故正确答案为D。","no":104,"missingImage":false},{"qid":"2367818","cat":"定义判断","stem":"隐形植入：指通过周边信息、符号体系等不易察觉的形式，使受众在不知不觉中受到影响的宣传策略。\n下列属于隐形植入的是：","options":{"A":"在某电视剧中，所有角色均使用同一品牌的手机，并使用这个品牌的经典铃声","B":"城运会到来之前，商家把印有城运会会徽的各类文化创意产品陆续摆上了柜台","C":"在某市博物馆馆标设计征集中，8号方案以浓郁的地域文化元素受到了评委的关注","D":"结婚纪念日快到了，为了提醒粗心又忙碌的丈夫，小李偷偷把他的手机屏保换成了婚纱照"},"answer":"A","explanation":"第一步：找出定义关键词。\n“不易察觉的形式”、“不知不觉受到影响”、“宣传策略”。\n第二步：逐一分析选项。\nA项：在电视剧中使用同一品牌手机，用该品牌经典铃声符合“不易察觉的形式”，“不知不觉受到影响”，也是“宣传策略”，符合定义，当选；\nB项：印有城运会会徽，不符合“不易察觉的形式”，不符合定义，排除；\nC项：馆标设计受到评委关注，不属于“宣传策略”，不符合定义，排除；\nD项：小李提醒丈夫结婚纪念日，把丈夫手机屏保换成婚纱照，符合“不易察觉的形式”，但不属于“宣传策略”，不符合定义，排除。\n故正确答案为A。","no":105,"missingImage":false},{"qid":"2367826","cat":"定义判断","stem":"语码转换：指说话人在同一对话过程中使用多种语言或方言进行交流的现象。\n下列不属于语码转换的是：","options":{"A":"约翰先生在中国生活多年，与单位同事交谈时总是坚持用汉语，有时实在不知道怎样准确表达自己的意思，也会夹杂三两个英语单词","B":"马经理接待来访客户，用普通话向他们介绍了自己公司的情况。得知客户中有两位陕西老乡后，当即操起陕西话与他们攀谈了几句","C":"在一次国际学术会议上，陈教授用英语作 <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){
  var base=(window.__EXAM__&&window.__EXAM__.imgBase)||"";
  return base+((window.__IMGS__ && window.__IMGS__[k]) || "");
}
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
