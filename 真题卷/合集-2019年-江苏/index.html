<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">行测真题模拟考场<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",imgBase:"",papers:[{"slug":"2019-江苏-A类","title":"2019年江苏省公务员录用考试《行测》题（A类）（网友回忆版）","year":"2019","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2367770","cat":"新思想","stem":"党的十八大以来，党中央团结带领全党全国各族人民，深刻回答了重大时代课题，形成了习近平新时代中国特色社会主义思想。关于习近平新时代中国特色社会主义思想，下列表述正确的是\n①根本立场是以人民为中心，坚持人民主体地位\n②核心要义是坚持和发展中国特色社会主义\n③精髓是为人民谋幸福、为民族谋复兴、为世界作贡献\n④理论特色是体现了理论与实际相结合、战略和战术相一致","options":{"A":"①②③","B":"①③④","C":"②③④","D":"①②③④"},"answer":"D","explanation":"本题考查政治常识。\n①正确，习近平新时代中国特色社会主义思想始终强调“以人民为中心”的根本立场。坚持以人民为中心的发展思想，是习近平新时代中国特色社会主义思想的核心价值取向，是对马克思主义人民观的继承和发展，与中国共产党的初心一脉相承。\n②正确，坚持和发展中国特色社会主义，是改革开放以来我们党全部理论和实践的鲜明主题，是习近平新时代中国特色社会主义思想的核心要义。\n③正确，习近平新时代中国特色社会主义思想的精髓是为人民谋幸福、为民族谋复兴、为世界作贡献，集中反映了当代中国共产党人的人民立场、民族抱负、世界责任。\n④正确，《习近平新时代中国特色社会主义思想三十讲》指出：“八个明确”、“十四个坚持”有机融合、有机统一，凝结着我们党坚持和发展中国特色社会主义的经验总结，凝结着以习近平同志为核心的党中央对中国特色社会主义规律认识的深化、拓展、升华，体现了理论与实际相结合、战略与战术相一致、认识论和方法论相统一的理论特色。因此①②③④正确。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"2367956","cat":"时事政治","stem":"2018年12月召开的中央经济工作会议指出，当前我国经济运行稳中有变、变中有忧，宏观政策要强化逆周期调节。下列属于逆周期调节措施的是","options":{"A":"财政部决定2019年适度降低地方政府专项债券规模","B":"生态环境部拟在2019年完成2.5万个建制村的环境综合整治任务","C":"发改委2019年要推动1亿非户籍人口在城市落户工作取得明显进展","D":"中国人民银行宣布2019年1月下调金融机构存款准备金率1个百分点"},"answer":"D","explanation":"本题考查经济常识。逆周期调控就是用宏观政策，包括货币和财政政策，对经济运行当中的系统性风险在一定程度上进行对冲和缓释。在经济扩散增长阶段，经济发展环境日益向好，市场需求旺盛，订单饱和，产能不足，投资意愿强烈，资金周转顺畅，此时的“逆周期调节”往往偏向通过政策工具抑制经济增长过热；相反，在经济收敛增长阶段，经济发展环境不确定性增加，市场需求和订单萎缩，产能过剩，投资意愿低迷，资金周转紧张，此时的“逆周期调节”势必侧重通过政策工具避免经济增长“失速”。\nA项错误，2018年12月召开的中央经济工作会议指出，宏观政策要强化逆周期调节，继续实施积极的财政政策和稳健的货币政策，适时预调微调，稳定总需求；积极的财政政策要加力提效，实施更大规模的减税降费，较大幅度增加地方政府专项债券规模。所以，适度提高地方政府专项债券规模才属于逆周期调控。\nB、C项错误，逆周期调节主要是指运用财政和货币政策调控经济环境，B、C项措施不属于财政和货币政策。\nD项正确，2019年1月4日，央行宣布下调金融机构存款准备金率1个百分点。央行下调法定存款准备金率也就意味着商业银行需要存放在央行的货币减少了，即留在商业银行的货币增加了。那么，市场上流通的货币将会增加，就会起到带动内需，刺激经济增长的作用。而我国现在经济处于一定的下滑阶段，需要通过宏观调控来刺激经济的增长。所以选项属于逆周期调节措施。\n故正确答案为D。","no":2,"missingImage":false}],"count":2,"answerable":2,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2367955","cat":"经济常识","stem":"改革开放40多年来，中国人民在富起来、强起来的征程上迈出了决定性的步伐，一些经济指标已处于世界前列。下列指标中我国处于世界首位的是","options":{"A":"货物贸易额","B":"商品消费额","C":"外资流入额","D":"黄金储备量"},"answer":"A","explanation":"本题考查政治常识。\n庆祝改革开放40周年大会于2018年12月18日上午10时在人民大会堂举行。中共中央总书记、国家主席、中央军委主席习近平出席大会并发表重要讲话。讲话指出：“现在，我国是世界第二大经济体、制造业第一大国、货物贸易第一大国、商品消费第二大国、外资流入第二大国，我国外汇储备连续多年位居世界第一，中国人民在富起来、强起来的征程上迈出了决定性的步伐！”\n故正确答案为A。","no":3,"missingImage":false},{"type":"question","qid":"2367773","cat":"科技常识","stem":"2019年1月3日，嫦娥四号探测器在月球背面成功着陆，并与玉兔二号巡视器顺利分离，实现了多个国际首次。对此，下列说法不正确的是","options":{"A":"首次进行了月基低频射电天文观测","B":"首次在月球背面软着陆和巡视探测","C":"首次实测了月球表面浅层月壤温度","D":"首次实现地球和月球背面的中继通信"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，2019年1月3日，嫦娥四号探测器登陆月球背面，搭载了由中国科学院空天信息研究院研制的巡视器（“玉兔二号”月球车）测月雷达和着陆器低频射电频谱仪有效载荷。1月4日00时20分，低频射电频仪成功加电开机，设备自检正常；当日8时42分，测月雷达成功加电开机，设备自检正常。我国成为国际上首次实现在月球背面开展低频射电天文观测的国家，填补了对100KHz\u003cimg data-k=\"6d86a19033e0\">10MHz低频射电天文方面的科学空白。\nB项正确，2018年12月8日凌晨2时23分，我国探月工程再次出发——嫦娥四号成功发射。嫦娥四号最终将降落在月球背面，实现人类首次月球背面软着陆和巡视探测。\nC项错误，2019年1月14日，在第一个月夜降临后，嫦娥四号着陆器和玉兔二号探测器陆续进入了休眠状态。 在第一个月夜休眠期间，着陆器上配置的同位素温差电池为月夜温度采集器供电，该采集器于测点位置成功监测第一月夜温度变化情况，月表温度在月夜期间最低达到\u003cimg data-k=\"f2237348c418\">，这是我国探月工程首次获取月夜温度探测数据。这也是国内首次实测月夜期间浅层月壤温度，并不是国际上首次。\nD项正确，2019年1月3日上午10点26分，“嫦娥四号”探测器成功着陆在月球背面东经177.6度、南纬45.5度附近的预选着陆区，并通过“鹊桥”中继星传回了世界第一张近距离拍摄的月背影像图，揭开了古老月背的神秘面纱。这是人类首次月背与地球的中继通信，开启了人类月球探测新篇章。\n本题为选非题，故正确答案为C。","no":4,"missingImage":false},{"type":"question","qid":"2367777","cat":"人文常识","stem":"今年是中华人民共和国成立70周年。下列对中华人民共和国成立意义的表述，正确的是\n①标志着新民主主义社会的结束\n②基本完成了民族独立和人民解放的任务\n③为实现中华民族的伟大复兴开辟了新纪元\n④为中国的进步和发展创造了最重要的前提","options":{"A":"①②③","B":"①③④","C":"②③④","D":"①②③④"},"answer":"C","explanation":"本题考查政治常识。\n①错误，1949年10月新中国成立，标志着我国进入到新民主主义社会。到1956年社会主义改造基本完成，标志着新民主主义社会结束。\n②③正确，中国共产党领导全国各族人民，推翻了压在人民头上的帝国主义、封建主义和官僚资本主义三座大山，取得新民主主义革命的基本胜利并建立了中华人民共和国，使中国结束了一百多年来被侵略被奴役的屈辱历史，真正成为了独立自主的国家，中国人民从此站起来了，成为国家的主人。所以，新中国的成立，基本完成了民族独立和人民解放的任务，开辟了中国历史的新纪元。\n④正确，习近平在庆祝改革开放40周年大会上的讲话上指出：“以毛泽东同志为主要代表的中国共产党人，把马克思列宁主义基本原理同中国革命具体实践结合起来，创立了毛泽东思想，团结带领全党全国各族人民，经过长期浴血奋斗，完成了新民主主义革命，建立了中华人民共和国，确立了社会主义基本制度，成功实现了中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了根本政治前提和制度基础。”\n①错误，②③④正确。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"2367781","cat":"人文常识","stem":"1919年爆发的五四运动，是中国近代史上一个划时代的事件。下列关于五四运动的表述，正确的是","options":{"A":"直接导火线是第一次世界大战的爆发","B":"具备了旧民主主义革命的一些基本特点","C":"青年学生在五四运动中发挥了决定性的作用","D":"为中国共产党成立作了思想和干部上的准备"},"answer":"D","explanation":"本题主要考查人文常识。\n第一次世界大战期间，欧洲列强无暇东顾，日本乘机加强对中国的侵略，严重损害了中国的主权，中国人民的反日情绪日渐增长。一战结束后，1919年召开巴黎和会，会上中国外交失败，引发了伟大的五四运动，这就是在1919年5月4日发生在北京的一场以青年学生为主，广大群众、市民、工商人士等阶层共同参与的，通过示威游行、请愿、罢工、暴力对抗政府等多种形式进行的爱国运动，这是中国人民彻底的反对帝国主义、封建主义的爱国运动。\nA项错误，五四运动的直接导火线是中国在“巴黎和会”上的外交失败。1919年召开的巴黎和会将战前德国在山东的特权转交给日本，严重损害了中国的利益，消息传到国内引发了五四运动。而第一次世界大战的时间是1914年7月28日—1918年11月11日，五四运动爆发时第一次世界大战已经结束。\nB项错误，五四运动是中国新民主主义革命的开端，在此之前的近代以来的资产阶级民主革命为中国的旧民主主义革命。新民主主义革命是无产阶级领导的、人民大众的、反对帝国主义、封建主义、官僚资本主义的革命。它的目标是无产阶级（通过中国共产党）牢牢掌握革命领导权，彻底完成革命的任务，并及时实现由新民主主义向社会主义的过渡。而旧民主主义革命是资产阶级领导的，以建立资产阶级共和国为目的的资产阶级民主革命。所以五四运动并不具有旧民主主义革命的特点。\nC项错误，工人阶级在五四运动中发挥了决定性的作用,青年学生发挥了先锋作用。\nD项正确，五四运动波及中国思想文化、政治发展方向、社会经济潮流、教育，同时对中国共产党的建立和发展起到了重要的作用。五四运动传播了马克思主义，且当时参与的代表比如瞿秋白、周恩来等人，后期也担任了我党的重要领导人，所以说五四运动为党的成立作了思想和干部上的准备。\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"2367958","cat":"法律常识","stem":"下列不属于《中华人民共和国监察法》所规定的监督对象的是","options":{"A":"某居民委员会的主任","B":"某国有企业工会的主席","C":"某农民专业合作社的理事长","D":"某省属高校学报的主编"},"answer":"C","explanation":"本题考查法律常识。《监察法》第十五条规定：“监察机关对下列公职人员和有关人员进行监察：（一）中国共产党机关、人民代表大会及其常务委员会机关、人民政府、监察委员会、人民法院、人民检察院、中国人民政治协商会议各级委员会机关、民主党派机关和工商业联合会机关的公务员，以及参照《中华人民共和国公务员法》管理的人员；（二）法律、法规授权或者受国家机关依法委托管理公共事务的组织中从事公务的人员；（三）国有企业管理人员；（四）公办的教育、科研、文化、医疗卫生、体育等单位中从事管理的人员；（五）基层群众性自治组织中从事管理的人员；（六）其他依法履行公职的人员。”\nA项正确，符合上述第（五）项的规定。\nB项正确，符合上述第（三）项的规定。\nC项错误，《农民专业合作社法》第二条规定：“农民专业合作社是在农村家庭承包经营基础上，同类农产品的生产经营者或者同类农业生产经营服务的提供者、利用者，自愿联合、民主管理的互助性经济组织。” 农民专业合作社的理事长不属于公职人员，不属于《监察法》的监督对象。\nD项正确，符合上述第（二）项的规定。\n本题为选非题，故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"2367959","cat":"人文常识","stem":"下列情形中，公民基本权利未受侵犯的是：","options":{"A":"小学生王某学习成绩很差，其父直接让他辍学去工厂上班","B":"某保安公司招聘夜班保安，在招聘启事中注明“男性优先”","C":"某公司的封闭车间夏季未装空调，小芳在车间工作时汗如雨下发生晕厥","D":"张先生和李女士结婚时约定，李女士有义务为张先生生育两个孩子"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，《宪法》第四十六条第一款规定：“中华人民共和国公民有受教育的权利和义务。”王某的父亲让王某辍学的行为侵犯了王某的受教育权。\nB项正确，《宪法》第四十八条规定：“中华人民共和国妇女在政治的、经济的、文化的、社会的和家庭的生活等各方面享有同男子平等的权利。国家保护妇女的权利和利益，实行男女同工同酬，培养和选拔妇女干部。”该保安公司在招工时虽然限定了“男性优先”，但不是“只限男性”，没有侵犯妇女平等工作的权利。\nC项错误，《劳动法》第三条第一款规定：“劳动者享有平等就业和选择职业的权利、取得劳动报酬的权利、休息休假的权利、获得劳动安全卫生保护的权利、接受职业技能培训的权利、享受社会保险和福利的权利、提请劳动争议处理的权利以及法律规定的其他劳动权利。”劳动者向公司要求工作环境符合劳动环境，是劳动者的基本权利。公司在封闭车间不安装空调导致劳动者晕厥侵犯了劳动者的基本权利。\nD项错误，我国《妇女权益保障法》第五十一条第一款规定：“妇女有按照国家有关规定生育子女的权利，也有不生育的自由。”妇女生育子女不需要夫妻双方约定，应该尊重女性的生育自由权。故与妻子约定生育两个孩子的做法侵犯了妻子的生育自由权。\n故正确答案为B。","no":8,"missingImage":false},{"type":"question","qid":"2367960","cat":"法律常识","stem":"张某在某电子商务平台定做了一张沙发，购买了一盏台灯、一台热水器和一台燃气灶。下列情形中，不符合法律规定的是","options":{"A":"张某自收到沙发之日起七日内有权退货，且无需说明理由","B":"张某购买的台灯被快递公司丢失，有权要求卖方重新发货","C":"张某因热水器缺陷而受伤，有权向生产者或销售者请求赔偿","D":"张某购买的燃气灶为冒牌货，有权要求平台提供卖方的信息"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《消费者权益保护法》第二十五条第一款规定：“经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货，且无需说明理由，但下列商品除外：（一）消费者定作的；（二）鲜活易腐的；（三）在线下载或者消费者拆封的音像制品、计算机软件等数字化商品；（四）交付的报纸、期刊。”故定做的沙发不适用“七日无理由退货”。\nB项正确，根据《电子商务法》第二十条规定：“电子商务经营者（指通过电子商务平台销售商品或者提供服务的电子商务经营者）应当按照承诺或者与消费者约定的方式、时限向消费者交付商品或者服务，并承担商品运输中的风险和责任。但是，消费者另行选择快递物流服务提供者的除外。”故该项中台灯丢失风险应由卖方承担，故张某有权要求卖方重新发货。\nC项正确，根据《消费者权益保护法》第四十条第二款规定：“消费者或者其他受害人因商品缺陷造成人身、财产损害的，可以向销售者要求赔偿，也可以向生产者要求赔偿。属于生产者责任的，销售者赔偿后，有权向生产者追偿。属于销售者责任的，生产者赔偿后，有权向销售者追偿。”\nD项正确，根据《消费者权益保护法》第四十四条规定：“消费者通过网络交易平台购买商品或者接受服务，其合法权益受到损害的，可以向销售者或者服务者要求赔偿。网络交易平台提供者不能提供销售者或者服务者的真实名称、地址和有效联系方式的，消费者也可以向网络交易平台提供者要求赔偿。” 张某购买的燃气灶为冒牌货，其合法权益已受到损害，有权要求平台提供卖方的信息。\n本题为选非题，故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"2367803","cat":"人文常识","stem":"楚汉相争在我国历史文化中留下了深深的印迹。下列表述不正确的是","options":{"A":"象棋中的“楚河汉界”源自于这段历史","B":"成语“破釜沉舟”源于楚汉相争中的一场战役","C":"琵琶曲《十面埋伏》反映了楚汉垓下决战情形","D":"诗句“生当作人杰，死亦为鬼雄”以此为题材"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，楚河汉界，为象棋棋盘中的分界线，来源于楚汉战争。《史记》中对于刘邦和项羽之战的记载有“鸿沟而西者为汉，鸿沟而东者为楚”，历史就这样使鸿沟成了“楚河汉界”。\nB项错误，“破釜沉舟”来源于项羽一战成名的巨鹿之战，公元前207年，项羽的起义军与秦将章邯率领的秦军主力部队在巨鹿（今河北邢台市）展开大战；项羽不畏强敌，引兵渡漳水（由巨鹿东北流向东南的一条河）。渡河后，项羽命令全军：“皆沉船，破釜甑，烧庐舍，持三日粮，以示士卒必死，无一还心。”最终，项羽大获全胜，巨鹿一战，是项羽和秦军的一场战役，不是楚汉相争中的战役。\nC项正确，“十面埋伏” 这个典故出自楚汉相争的垓下之战，楚汉相争时期，汉王刘邦麾下韩信率30万大军和彭越的军队会师，把项羽围困在垓下（今安徽省宿州市灵璧县东南），他采取十面埋伏的战术，逼使项羽在乌江自刎，取得决定性的胜利。\nD项正确，宋代女词人李清照写的《夏日绝句》：“生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东”，写的正是楚汉相争中项羽乌江自刎的情形。\n本题为选非题，故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"2367805","cat":"人文常识","stem":"对下列诗句所描写活动的解释，正确的是","options":{"A":"“清风如可托，终共白云飞”描写的是射箭","B":"“平明寻白羽，没在石棱中”描写的是捉迷藏","C":"“嘈嘈切切错杂弹，大珠小珠落玉盘”描写的是弹琵琶","D":"“三五步行遍天下，六七人百万雄兵“描写的是下象棋"},"answer":"C","explanation":"本题考查人文常识。\nA项错误，“清风如可托，终共白云飞”出自北宋诗人寇准的《纸鸢》。全诗歌风筝以咏志，通过写风筝需要外力依托才能飞翔，以物喻人，尽显辩证唯物主义思想。\nB项错误，“平明寻白羽，没在石棱中”出自唐代诗人卢纶的《和张仆射塞下曲·其二》，描写了天明寻找（昨晚射出的）白羽箭，发现箭头已深深没入在巨大石块中，突出了将军射箭技艺的高超。\nC项正确，“嘈嘈切切错杂弹，大珠小珠落玉盘”出自唐代诗人白居易的《琵琶行》。诗句描写了琵琶声错落有致，疾乱中自有章法，像珍珠掉落玉盘一样清脆动听。\nD项错误，“三五步行遍天下，六七人百万雄兵”突出了京剧表演中成队的随从或兵卒在台上表现大场景的演出特点，因此描写的是戏台，而不是下象棋。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"2367809","cat":"人文常识","stem":"对下列词语的解释，不正确的是（    ）。","options":{"A":"风树之悲——因父母去世而悲伤","B":"金兰之交——亲如兄弟的友情","C":"期颐之年——八九十岁的年龄","D":"弄璋之喜——生了男孩的喜庆"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“风树之悲”出自《韩诗外传》卷九，原文是“树欲静而风不止，子欲养而亲不待”。指因父母亡故，不能奉养的悲伤。\nB项正确，“金兰之交”最早出自《周易\u003cimg data-k=\"d4f0d11b53cc\">系辞上》“二人同心，其利断金；同心之言，其臭如兰”。原指牢固而融洽的友情，后用做结拜为兄弟姐妹的代称。\nC项错误，“期颐之年”出自《礼记\u003cimg data-k=\"d4f0d11b53cc\">曲礼上》中“百年曰期颐”一句，意为百岁老人饮食起居不能自理，一切需期待别人供养或照顾。因此，“期颐之年”指一百岁，而不是八、九十岁。\nD项正确，“弄璋”指的是古人把璋给男孩玩，希望他将来有玉一样的品德。因此，“弄璋之喜”旧时常用以祝贺生了男孩的喜庆。\n本题为选非题，故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"2367962","cat":"人文常识","stem":"下列成语与经济学用语对应不恰当的是","options":{"A":"凿壁偷光——外部性","B":"郑人买履——机会成本","C":"扬长避短——比较优势","D":"狡兔三窟——投资组合"},"answer":"B","explanation":"本题主要考查经济常识。\nA项正确，外部性，指一个人或一群人的行动和决策使另一个人或一群人受损或受益的情况。其中，正外部性是某个经济行为使他人或社会受益，而受益者无须花费代价，负外部性是某个经济行为使他人或社会受损，而造成负外部性的人却没有为此承担成本。“凿壁偷光”讲的是西汉大文学家匡衡的故事。匡衡勤奋好学，但家中没有蜡烛。邻家有蜡烛，可光亮照不到他家，匡衡就在墙壁上凿了洞引来邻家的光亮，让光亮照在书上读书。从典故的本意来看，“凿壁偷光”体现的是邻居家的光亮使匡衡受益，符合正外部性的原理。\nB项错误，机会成本是指当把一定的经济资源用于生产某种产品时，放弃的另一些产品生产上最大的收益。“郑人买履”，主要说的是郑国的人因过于相信“尺度”，造成买不到鞋子的故事。揭示了郑人拘泥于教条心理，依赖数据的习惯。这则寓言讽刺了那些墨守成规的教条主义者，说明因循守旧，不思变通，终将一事无成。因此“郑人买履”与机会成本的对应不恰当。\nC项正确，比较优势是指一个生产者以低于另一个生产者的机会成本生产一种物品的行为。比较优势的原理本来是国际贸易学中的重要概念，现在广泛的用在各种竞争合作的比较当中，指有限的时间和精力都用来做自己最擅长的事。扬长避短的意思是发扬长处，回避短处，体现了比较优势的原理。\nD项正确，投资组合是由投资人或金融机构所持有的股票、债券、金融衍生产品等组成的集合，目的是分散风险。“狡兔三窟”的意思是狡猾的兔子准备好几个藏身的窝，比喻隐蔽的地方或方法多。兔子准备好几个窝目的也是分散风险，与投资组合的理念是一样的。\n本题为选非题，故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"2367817","cat":"人文常识","stem":"下列关于水资源的说法，不正确的是","options":{"A":"地球上水资源的主体是咸水","B":"海洋水与陆地水在不断循环","C":"地球上水体大多以液态存在","D":"地球上淡水主体是江河湖水"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，地球上的水按其存在的领域可分为海洋水（咸水）、陆地水（既有咸水也有淡水）、大气水（淡水），海洋水占全部水体的\u003cimg data-k=\"17b81ad60902\">，因此，地球上水资源的主体是咸水。\nB项正确，由于太阳辐射和重力作用，地球上存在水循环。地球表面各种形式的水体是不断地相互转化的，水以气态，液态和固态的形式在陆地、海洋和大气间不断循环的过程就是水循环。\nC项正确，地球上水的存在形态有三种：固态、液态、气态。大部分以液态的形态存在；在寒冷的极地和高山上水常常以固态的形态存在；空气中的水主要以气态的形态存在。自然界的水随着温度的改变，状态也会发生变化。\nD项错误，冰川水是地球上最宝贵、最丰富的淡水资源，蕴藏了所有淡水资源的\u003cimg data-k=\"8c3342040bcf\">。但多处于极端的特殊地理位置，要么在南极、北极，要么在极高山上，所以冰川水具有极高的价值，但开采条件极其艰难。\n本题为选非题，故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"2367820","cat":"地理国情","stem":"下列对有关气候效应的解释，正确的是","options":{"A":"阳伞效应是指由于天空中大块乌云的阻挡而削弱太阳短波辐射，使气温降低","B":"热岛效应是指由于城市下垫面特性和人类活动影响，使市区的气温比郊区高","C":"温室效应是指温室气体透过太阳长波辐射，大量吸收地面短波辐射，使气温升高","D":"海洋沙漠化效应是指海洋因受周围陆地沙漠化的影响，失去了对气温的调节功能"},"answer":"B","explanation":"本题考查地理国情。\nA项错误，阳伞效应指由于大气中固、液体粒子对太阳辐射的强烈阻挡作用，而使地表气温降低的现象。大气中的固、液体粒子来源于人为排放和自然过程如火山喷发、森林火灾等。它们能直接吸收和反射太阳辐射能，还能作为凝结核，使天空云量增加，加大反射率，这些都能使地表所获得的太阳辐射能减少。\nB项正确，热岛效应指城市气温较四周郊区为高，好像一个温暖的岛屿分布于农村较凉的“海洋”之中。其形成原因主要是：人类活动导致有大量人为热释放；产生污染物质增多，加强了大气保温作用；下垫面吸收的辐射热量，主要用于加热市区空气。\nC项错误，温室效应是指由于地球表面空气中的二氧化碳等温室气体浓度增加，而导致地表附近气温的升高的现象。其形成原因是：温室气体可以使太阳短波辐射透过，地表由于吸收短波辐射被加热，提高了温度，再以长波向外辐射，而长波又被温室气体吸收，使气温升高。\nD项错误，海洋沙漠化效应是指倾注到海洋中的废油，在海面形成油膜，起到抑制海水蒸发的作用，同时又减少了海面潜热的转移，使海洋失去调节气温的作用，因而海洋上的空气变得愈来愈干燥，故称之为“海洋沙漠化效应”。\n故正确答案为B。","no":15,"missingImage":false}],"count":13,"answerable":13,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        知识产权广义上是关于无形智力成果的专有权利，是通过排除他人的主张和干预而独占智力成果的开发和使用，进而获得独占权益的制度。基于知识产权的\u003cu>                         \u003c/u>属性，财产理论成为知识产权制度的核心理论。具体到知识产权与公共领域的二元关系中，则是一方面强调权利人作为财产权主体控制其权属范围内的一切资源而排除资源自由流动的可能性；另一方面将\u003cu>公共领域作为知识产权潜在的“对手”\u003c/u>，主张公共领域的边界和层次的发展压缩了知识产权的权属范围，限制了知识产权作为一项财产权利的功能实现。\u003c/p>\u003cp>        为了避免公共资源的过度使用而造成资源损耗，通过财产制度赋予主体对特定资源的所有权，可以确保资源的使用受到合理规范和控制。同时，财产所有权的确立在减少资源损耗的基础上增加财产使用带来的收益，引导财产主体进一步投入、开发和使用资源本身，形成资源不断增值和收益的良性循环。\u003c/p>\u003cp>        智力成果作为知识产权的客体具有无形属性，在创造、传播和使用过程中不会产生“公有物的悲剧”中资源过度使用的困境。然而智力成果缺少法律制度的规范而允许不受限制的自由使用，造成的不利后果则是权利主体无法就智力成果的价值进行有效的收益，最终导致智力创造活动激励不足而无以为继。巧合的是，财产化智力资源能提供充裕的行为激励而解决这个问题。在经济学理论的背景下，知识产权依托财产理论实现重要的制度功能——鼓励智力创造活动，这又与知识产权制度的根本目的相契合。\u003c/p>\u003cp>        问题在于，财产理论并不能完全解释资源的开发和使用。资源的财产化发展到一定程度反而会阻碍后续开发和使用行为。\u003cu>知识产权领域也有类似的矛盾\u003c/u>。在传统的生物制药领域，基于专利申请而不断增加的专利数量不仅没有进一步促进研发创新，反而由于权属复杂分散难以整合而导致后续研发的成本过高，最终阻碍生物制药行业的发展。类似的，版权领域内的演绎行为的权利传统上归属于作品原作者。然而，滑稽戏仿等创作行为本身是对原作品进行丰富和发展的合理手段，通过转化性的创作来体现不同于原作者的目的和意图，能有效丰富社会整体文化艺术作品的数量和质量。实践中各国在版权立法方面将滑稽戏仿规定为版权的例外并允许类似行为的实施。显然，坚持绝对的演绎权利必然压缩演绎作者创作的空间，抑制基于原作品的演绎行为。因此，知识产权制度在理论构建过程中不能依赖财产化思路将智力资源完全专有化，而应该在财产化的过程中兼顾其他策略来实现知识产权的制度目的。\u003c/p>","questions":[{"qid":"2367891","cat":"语句表达","stem":"填入文中画横线处最恰当的一项是","options":{"A":"专有和排他","B":"专属和高端","C":"独有和专业","D":"独创和稀缺"},"answer":"A","explanation":"横线所在句子在文段中间，起着承上启下的作用，应结合上下文。首句指出“知识产权广义上是······的专有权利，是通过排除他人······独占权益的制度。”强调知识产权的专有和排他的两面性。后文对“知识产权与公共领域的关系”从两方面进行介绍，横线处应体现“知识产权的属性”，结合文段可知应为A项。B、C两项仅提到“专属”“独有”仅属于知识产权的一方面属性，表述片面，排除。D项“独创和稀缺”为无中生有，排除。\n故正确答案为A。\n【文段出处】《孙阳：论公共领域的功能实现》","no":16,"missingImage":false},{"qid":"2367892","cat":"片段阅读","stem":"对文章第一段中“公共领域作为知识产权潜在的‘对手’”理解不正确的是","options":{"A":"知识产权理论上就是一种私人财产权","B":"公共领域的活动可能会影响知识产权实现","C":"知识产权作为私人财产不可用于公共领域","D":"权利人不希望被公共领域侵犯其权益"},"answer":"C","explanation":"A项，根据“财产理论成为知识产权制度的核心理论”及“权利人作为财产权主体控制其权属范围内的一切资源而排除资源自由流动的可能性”可知，表述正确，排除；\nB项、D项，根据“主张公共领域的边界和层次的发展压缩了知识产权的权属范围，限制了知识产权作为一项财产权利的功能实现”可知，此处强调权利人主张要明晰“公共领域的边界和层次”来保护其权利，故“公共领域活动”可能会侵犯权利人的权利，B、D选项表述均正确，排除；\nC项，文段并未明确指出“不可用于公共领域”，表述过于绝对，表述错误，当选。\n本题为选非题，故正确答案为C。","no":17,"missingImage":false},{"qid":"2367893","cat":"片段阅读","stem":"作者认为，知识产权不受限制自由使用最终将会导致","options":{"A":"智力成果的权利人无法得到相应的收益","B":"智力创造活动由于激励不足而无以为继","C":"无法形成知识产权资源收益的不断增值","D":"知识产权的使用缺乏合理的规范和控制"},"answer":"B","explanation":"根据篇章第3段“然而智力成果缺少法律制度的规范而允许不受限制的自由使用，造成的不利后果则是权利主体无法就智力成果的价值进行有效的收益，最终导致智力创造活动激励不足而无以为继”可知，最终会导致的结果是智力创造活动激励不足而无以为继，对应选项为B。\nA项“无法得到相应的收益”、C项“无法形成资源收益的增值”均为知识产权不受限制自由使用的不利后果，而并非最终会导致的结果，排除；\nD项，“缺乏合理的规范和控制”为知识产权不受限制自由使用的原因，而非结果，排除。\n故正确答案为B。\n【文段出处】《孙阳：论公共领域的功能实现》","no":18,"missingImage":false},{"qid":"2367894","cat":"片段阅读","stem":"对文章最后一段中“知识产权领域也有类似的矛盾”解释不恰当的是","options":{"A":"专利数量不断增加有时并未促进研发创新","B":"知识产权的财产化导致后续研发成本过高","C":"版权领域内的演绎权利只能归属于原作者","D":"后人从事转化性创作有时也缺乏必要空间"},"answer":"C","explanation":"“类似的矛盾”指代上文，即资源的财产化发展到一定程度反而会阻碍后续开发和使用行为。且后文详细介绍了这种矛盾的两种情况，一种是由于专利数量不断增加导致研发成本过高，最终阻碍发展，对应A、B两项。一种是由于坚持绝对的演绎权利，压缩了演绎作者创作的空间，抑制基于原作品的演绎行为，对应D项。\nC项，根据“类似的，版权领域内的演绎行为的权利传统上归属于作品原作者”以及后文“实践中各国在版权立法方面将滑稽戏仿规定为版权的例外并允许类似行为的实施”可知，各国允许其他作者对原作品通过丰富和发展的合理手段，进行转化性的创作，故表述错误，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《孙阳：论公共领域的功能实现》","no":19,"missingImage":false},{"qid":"2367895","cat":"片段阅读","stem":"这篇文章着重说明的是","options":{"A":"知识产权过度保护也将造成危害","B":"知识产权实质上是财产权问题","C":"知识产权与公共领域的相互关系","D":"知识产权保护需注意其两面性"},"answer":"D","explanation":"篇章首先介绍了知识产权及其核心理论财产理论，并说明了两者间的关系，引出话题。接着文段提出观点，说明为了避免公共资源的过度使用而造成资源损耗，通过财产制度赋予主体对特定资源的所有权，可以确保资源的使用受到合理规范和控制，以此详细说明知识产权的客体智力成果依托财产理论的重要性。最后文段指出问题，财产理论并不能完全适用于知识产权，并通过“因此”给出结论，即知识产权应该在财产化的过程中兼顾其他策略来实现知识产权的制度目的。\n故篇章主要论述了知识产权需要财产理论的保护，并说明其不能只依赖财产理论的保护，否则会产生问题。即论述了用财产理论保护知识产权是把双刃剑，对应选项为D。\nA项，未提及通过财产理论保护知识产权的好处及必要性，表述片面，排除；\nB项，财产理论仅是知识产权的核心理论，且文段表明还需兼顾其他策略，故表述过于绝对，排除；\nC项，“相互关系”表述不具体明确，且文段主要论述的是知识产权与财产理论间的关系，排除。\n故正确答案为D。\n【文段出处】《孙阳：论公共领域的功能实现》","no":20,"missingImage":false},{"qid":"2367864","cat":"片段阅读","stem":"财政作为国家治理的基础和重要支柱，对促进科技创新具有重要的支撑、引领、提升与保障作用。具体来看，财政政策可以通过有的放矢的精准化财政投入，为科技创新输入供给端推力；通过有扶有控的差异化税收优惠通道，为科技创新构筑引导性激励；通过导向明确的选择性政府采购渠道，为科技创新设定需求端拉力。\n这段文字重点说明的是","options":{"A":"财政政策促进科技创新的主要途径","B":"财政政策在科技创新中的提升作用","C":"财政政策对科技创新所产生的影响","D":"财政政策制定要考虑科技创新需要"},"answer":"A","explanation":"文段开篇指出财政对于科技创新有重要的支撑、引领、提升、保障作用，“具体来看”引出对策，后文通过三个并列的分句详细说明财政如何对科技创新起作用。故文段重在说明财政政策促进科技创新的途径，对应A项，当选。\nB项“提升作用”表述片面，文段中说明还有引领、保障、支撑作用，排除。\nC项“所产生的影响”表述不明确，“影响”可以是积极的作用也可以是消极的作用，文段中为积极的作用，排除。\nD项“要考虑科技创新的需要”无中生有，文段没有提及，排除。\n故正确答案为A。\n【文段出处】《创新驱动导向下财政政策促进科技创新的路径探索》","no":21,"missingImage":false},{"qid":"2367867","cat":"片段阅读","stem":"在整个地图学史上，有效使用地图意味着看懂绘制在平面上的一系列抽象符号，然后将这些符号与当地环境的各种三维特征联系起来，从而成功地确定自己的位置。但这并不是所有普通人都能够做到的，而且不久之前，地图本身也还是一种稀缺的人工制品，有些地图还属于军事上敏感的机密。但是，能够在手机屏幕上看到的地图改变了这一切。\n这段文字重在说明","options":{"A":"地图学发展经历了漫长的历史过程","B":"地图绘制使用中存在诸多技术难题","C":"智能手机的出现促进了地图学发展","D":"智能手机大大提升了人类生活质量"},"answer":"C","explanation":"文段开篇介绍在地图学的历史上，有效使用地图对人们的要求极高。“但”表转折，强调不是所有人都能看懂地图，而且地图还是一种稀缺品，不是所有人都能看到地图。尾句“但是”表转折，强调手机上的地图改变了这一情况。故文段重在强调手机上的地图改变了地图原来的情况，使所有人都能看到、看懂地图，对应C项，当选。\nA项和B项没有提及文段的重点“手机”，排除；D项没有提及“地图”这一核心话题，且“提升了人类生活质量”无中生有，排除。\n故正确答案为C。","no":22,"missingImage":false},{"qid":"2367901","cat":"片段阅读","stem":"在日益现代化的时代，数字化全智能工业和目前的大工业是社会发展最仰赖的生产力，手工艺作为人类古老的生产、生活方式也能发挥它的经济辅助作用，但它的文化功能意义将日益凸显。类似于精神乌托邦的不可或缺，手工艺的存在将给现代人提供复归淳朴人性、回望人类童年的机会，传统工艺的振兴也将开启现代生活与文化创造的新境。\n这段文字意在强调","options":{"A":"手工艺能够对经济发展起到辅助作用","B":"现代社会手工艺生产方式是不可或缺的","C":"文化创造与传统手工艺有着密切的关系","D":"手工艺的存在更在于其文化功能意义"},"answer":"D","explanation":"文段开篇引出话题，说明在数字化的工业时代，手工艺也能发挥自身的经济作用，“但”表转折，转折之后强调手工艺的文化功能日益凸显。后文介绍了手工艺存在的文化功能有哪些。总结全文，文段的重点在于转折之后，即手工艺的存在更在于它的文化功能，D项符合文意，当选。\nA项“对经济发展起到辅助作用”对应转折之前的内容，非重点 ，排除；\nB项“手工艺生产方式是不可或缺的”表述不明确，没有强调其“文化功能”，与文段不符，排除；\nC项“文化创造”非重点，且表述片面，对应文段“文化功能”的一方面，与文意不符，排除。\n故正确答案为D。\n【文段出处】《走在复兴传统文化的前列》","no":23,"missingImage":false},{"qid":"2367903","cat":"语句表达","stem":"①可以说，手术同意书的签署过程，是一次医疗实践过程中极其重要的医患沟通环节。\n②主要的意义在于，要使医生养成对患者高度负责、保护患者健康和生命的工作作风，在临床实践中尽力避免医疗伤害。\n③在医学伦理中，知情同意权的本质，体现在尊重原则与不伤害原则。\n④患者在充分知悉相关信息之后，有权就自己的疾病如何处置作出理性的决定。\n⑤在尊重原则中，除了对患者生命价值的尊重外，更主要的其实是尊重患者的医疗自主权。\n⑥而不伤害原则的意思，并不是要求医生在所有的医疗行为中避免一切医源性的伤害，这样的要求在当下不太现实。\n将以上6个句子重新排列，语序正确的是","options":{"A":"①-③-⑥-②-⑤-④","B":"③-④-⑥-②-①-⑤","C":"①-②-③-⑤-④-⑥","D":"③-⑤-④-⑥-②-①"},"answer":"D","explanation":"对比选项，判断首句，①“可以说······”、③“在医学伦理中······”均无明显首句特征，不易判断。\n继续观察文段，寻找其他解题线索，③“尊重原则与不伤害原则”属于“A和B”结构，应先论述“尊重原则”，再论述“不伤害原则”，⑤提及“尊重原则”，⑥提及“不伤害原则”、②“避免医疗伤害”也为“不伤害原则”，故⑤应在⑥、②之前，锁定D项。\n故正确答案为D。\n【文段出处】《手术知情同意书要不要签，谁能帮帮我？》","no":24,"missingImage":false},{"qid":"2367882","cat":"片段阅读","stem":"生态文明首先是一种世界观，也就是如何看待人与自然和人与人之间的关系。实际上，人与自然的关系和人与人之间的关系是同一事物的相互映衬，同时，人与自然的关系也在一定程度上决定了人与人之间的关系。当人与自然关系紧张，如一定的自然资源和生态环境承载不了已有的人口数量时，就会产生人与人之间关系的对抗。\n下列说法与文意不符的是","options":{"A":"人与自然的和谐相处事实上有利于协调人与人之间的关系","B":"处理好人与人的关系比处理好人与自然之间的关系更为重要","C":"正确的世界观可以引导我们处理好人与人及人与自然的关系","D":"人与人的关系发生对抗可能和人与自然关系的紧张相关"},"answer":"B","explanation":"A项，根据“人与自然的关系也在一定程度上决定了······对抗”可知，人与自然的关系决定了人与人的关系，如果人与自然的关系紧张，人与人的关系也就会紧张，那么人与自然和谐相处，也就有利于协调人与人的关系，选项与文意相符，排除。\nB项，“比······更为重要”涉及比较，而文段并未将人与人的关系、人与自然的关系进行对比，无关对比，当选。\nC项，根据文段首句表明世界观就是如何看待人与自然、人与人的关系，所以正确的世界观可以更好地引导我们处理好这些关系，选项与文意相符，排除。\nD项，根据文段尾句可知，人与自然关系紧张是人与人关系发生对抗的原因之一，选项与文意相符，排除。\n本题为选非题，故正确答案为B。","no":25,"missingImage":false},{"qid":"2367906","cat":"片段阅读","stem":"实施节能目标责任制和考核评价制度，实际上建立了一种科层制的节约能源监管模式，意味着节能工作地方政府负总责制度的确立。其特色是将节能工作与地方政府的人事考核评价制度挂钩，目的是以政府为主导，为推进地方开展节能工作，提供强大的政治动力。而节能减排市场化则是充分赋予节能企业（或者其他单位）自主性，以发挥市场在资源配置中的决定性作用。\n这段文字接下来最有可能讨论的是","options":{"A":"如何有效实施节能减排市场化","B":"为什么要实施节能减排市场化","C":"如何有效推进节能目标责任制","D":"人事考评如何与节能减排挂钩"},"answer":"A","explanation":"本题为接语选择题，重点把握文段最后谈论的核心话题。文段开篇介绍实施节能目标责任制和考核评价制度实质、特色及目的，文段尾句“而节能减排市场化则是······”将话题转到“节能减排市场化”上，论述了节能减排市场化的意义、作用。根据话题一致原则，后文应继续围绕“节能减排市场化”展开论述，故排除C、D项。\nA、B项均围绕“节能减排市场化”展开论述，但B项“为什么要实施······”对应文段尾句，节能减排市场化有作用就是实施的原因，前文已经论述过的，后文不再赘述，排除B项。\n故正确答案为A。\n【文段出处】《张忠利：气候变化背景下&lt;节约能源法&gt;面临的挑战及其思考 》","no":26,"missingImage":false},{"qid":"2367907","cat":"片段阅读","stem":"当前，乡村间或是城乡间的交流日益增加，因拆迁、移居等因素在新区域形成新的社区群体，乡村正面临“去熟人化”阶段。用一种共通的地域文化将其联系起来，是乡村治理的有效形式。从历史上看，以血缘或是某种被认可的文化组织起来的群体，具有很强的生命力和稳定性。在一定层面上，乡村社会关系、乡村冲突的调适与乡村社会秩序的维系不仅仅靠法制体系，而且还依靠乡村礼俗、村社伦理、村规乡约等非正式制度。\n这段文字主要强调","options":{"A":"乡村社会秩序的历史渊源与当下处境","B":"当下乡村社会秩序发生变化的主要原因","C":"新的乡村社会秩序维护需要探寻更有效的治理方法","D":"乡村治理实践中非正式制度往往比法律手段更有效"},"answer":"C","explanation":"文段开篇指出乡村面临“去熟人化”阶段这一背景，接着提到用共通的地域文化将其联系起来是乡村治理的有效形式，后面介绍了历史上用血缘或文化来组织群体，最后提出对策，乡村社会关系等不仅要靠法制体系、还要靠村规乡约等非正式制度。故文段重点强调乡村社会秩序维护需要有效的方法，对应C项，当选。A项对应首句背景引入的内容，并非文段重点，排除；B项“主要原因”无中生有，文中没有提到，排除；D项表述错误，文中没有将非正式制度与法律手段的有效性进行比较，排除。\n故正确答案为C。","no":27,"missingImage":false},{"qid":"2367908","cat":"片段阅读","stem":"读了大量的唐代诗人传记之后，发现中唐以前的诗人大多狂傲之士，自炫、自夸、自矜、自傲是一种稀松平常的事。杜甫应该是一个温厚谨重的人，但自夸起来一点也不含糊：“甫昔少年日，早充观国宾。读书破万卷，下笔如有神。赋料扬雄敌，诗看子建亲。”李白的“我本楚狂人，凤歌笑孔丘”“仰天大笑出门去，我辈岂是蓬蒿人”“安能摧眉折腰事权贵，使我不得开心颜”，大家耳熟能详。“天子呼来不上船，自称臣是酒中仙”，虽然出自杜甫笔下，却与李白的个性可谓合榫合卯，堪称知音。\n根据文意，作者对李杜诗中表现出的狂傲之气","options":{"A":"并不意外","B":"十分欣赏","C":"略有微词","D":"有褒有贬"},"answer":"A","explanation":"文段开篇指出中唐以前诗人大多是狂傲之士，指出他们的自炫、自夸、自矜、自傲是稀松平常的这一观点，后面接着列举杜甫和李白的相关作品作为例子进行解释说明，论证前文的观点，故文段为观点+解释说明的结构，首句“稀松平常”即代表作者的态度，说明作者并不意外，对应A项，当选。B项“十分欣赏”无中生有，文中没有强调作者对他们夸奖称赞，排除；C项“略有微词”指有一点的不满，排除；D项“有褒有贬”指有肯定也有否定，文中没有不满否定之意，排除。\n故正确答案为A。\n【文段出处】《狂傲背面是卑微》","no":28,"missingImage":false},{"qid":"2367877","cat":"片段阅读","stem":"根据新的刑事证据规则，鉴定检材的真实性和同一性已经成为鉴定意见转化为定案根据的前提条件。这显然是我国刑事证据制度发生的重大变化。透过这一变化，我们可以发现司法改革的决策者们已经具有了一种新的理论认识：实物证据鉴真是司法鉴定程序启动的前提和基础；未经鉴真过程，任何专业人士对实物证据所作的“司法鉴定意见”都将是没有法律意义的；实物证据作为一种“送检材料”，在其真实性和同一性存在合理疑问的情况下，鉴定意见将不具有作为定案根据的资格。\n这段文字中提取的关键词最恰当的是","options":{"A":"刑事证据  实物证据鉴真  定案根据","B":"司法改革  司法鉴定意见  定案根据","C":"鉴定检材  刑事证据制度  司法改革","D":"证据制度  司法鉴定程序  送检材料"},"answer":"A","explanation":"文段开篇引出新的刑事证据的话题，接着说明我国刑事证据制度的重大变化体现实物证据鉴真的重要性，即实物证据鉴真直接影响实物证据能否成为定案根据。故文段就是强调“刑事证据制度的重大变化即实物证据鉴真直接影响实物证据能否成为定案根据”关键词为“刑事证据、实物证据鉴真、定案根据”，对应A项，当选。\nB项、C项“司法改革”对应“司法改革的决策者······”，仅为决策者身份的限定词，非文段核心话题，排除。\nD项“证据制度”表述不准确，文段围绕“刑事证据”相关制度、规则展开论述，“司法鉴定程序”对应“是司法鉴定程序的启动的前提和基础”，而该句强调的核心话题是“实物证据鉴真”，排除。\n故正确答案为A。","no":29,"missingImage":false},{"qid":"2367909","cat":"片段阅读","stem":"在照相技术诞生以前，那些已经损坏消失或因种种原因无法收藏的文物，就是依靠墨拓进入研究者的视域的。而且许多文物需要妥善收藏与精心保护，不能反复触碰，通过墨拓，研究者既可以取得研究所需的材料，又能避免多次接触文物，使文物遭受污染或损坏。现代照相技术十分发达，但是细节上的呈现仍然不如墨拓直观清晰。墨拓可以将石刻、古器物上的文字和图案清晰地显现在纸上，供研究者利用。\n这段文字主要说明的是","options":{"A":"墨拓在文物保存文献研究方面比照相技术更为优越","B":"研究者利用墨拓研究石刻与古器物已具有悠久历史","C":"墨拓对于研究历史文献与保存文物具有重要的价值","D":"墨拓对于照相技术在文献研究保护方面具有不同价值"},"answer":"C","explanation":"文段开篇引出话题“墨拓”，并介绍其对于文物收藏和保护的重要作用，之后对比照相技术，强调了墨拓在历史文物的文字和图案等细节呈现上更加清晰，故文段为并列结构，共同强调了墨拓对于文物收藏和文字图案研究的重要意义，对应C项，当选。\nA项，仅为文段后半部分的内容，片面，排除；\nB项，文段并未论述研究者利用墨拓研究文物的历史，无中生有，排除；\nD项，文段重点强调的主体为“墨拓”，照相技术非重点，排除。\n故正确答案为C。\n【文段出处】《墨拓用上马鬃刷，创新技艺呵护甲骨文这块“心头肉” 》","no":30,"missingImage":false},{"qid":"2367910","cat":"片段阅读","stem":"从顶层设计上看，我国工匠精神培育建设需立足于搭建协同保障平台、开展不同主体间的多元对话、建构产教研协同发展机制以及强化职业院校精神培育功能。从协同发展的视角看，我国工匠精神的培养主体亟须根据自身的角色定位与职能属性，强化市场管理制度，培育高品质消费市场，不断完善技术技能人员薪酬体系，构建职业院校、实训中心、企业三站式互动机制。\n这段文字意在说明","options":{"A":"我国工匠精神培育的主要策略","B":"我国工匠精神培育的顶层设计","C":"必须强化工匠精神培育工作的管理","D":"搭建协同平台是工匠精神培育重心"},"answer":"A","explanation":"文段开篇“从顶层设计上看”论述了我国工匠精神培育建设的做法，之后“从协同发展的视角看”论述了我国工匠精神培育主体亟需做什么，故文段为并列结构，从两个角度论述了我国工匠精神培育当前应该如何做，对应A项，当选。\nB项“顶层设计”和D项“搭建协同平台”，均仅为文段“从顶层设计上看”的内容，表述片面，排除；\nC项，“强化管理”为“从协同发展的视角看”的做法，仅为对策的一方面，表述片面，排除。\n故正确答案为A。","no":31,"missingImage":false},{"qid":"2367911","cat":"片段阅读","stem":"在传统文化的早期阶段，文化呈现出一种综合的形态，这种形态成为孕育中国传统医学和古典文学的共同摇篮。在这两个学科尚未独立分离出来的时候，中国传统医学与古典文学之间存在着明显的杂糅现象。无论是诗歌、民歌、民谣，还是市井小调，都是古代医学重要的传播载体。另一方面，很多医学古籍本身就是有着丰富文学价值的作品。在阅读这些古典医学著作时，往往能够体验到文学中的那份必然和深邃。\n下列说法与文意不符的是","options":{"A":"医学和文学在传统文化早期阶段并非泾渭分明","B":"阅读经典医学古籍可能获得审美体验","C":"中国传统医学与古典文学植根于共同的文化土壤","D":"研读古典文学作品是研究传统医学的基础"},"answer":"D","explanation":"A项，根据文段“在这两个学科尚未独立分离出来的时候，中国传统医学与古典文学之间存在着明显的杂糅现象”可知，文学与医学的界限在传统文化早期并不明显，表述正确；\nB项，根据文段“很多医学古籍本身就是有着丰富文学价值的作品。在阅读这些古典医学著作时，往往能够体验到文学中的那份必然和深邃”可知，阅读医学古籍可体会到文学所展现的美，表述正确；\nC项，根据文段“在传统文化的早期阶段，文化呈现出一种综合的形态，这种形态成为孕育中国传统医学和古典文学的共同摇篮”可知，医学与文学均是基于早期的传统文化，表述正确；\nD项，文段并未陈述古典文学作品是研究传统医学的基础，无中生有。\n本题为选非题，故正确答案为D。\n【文段出处】《中国传统医学与古典文学》","no":32,"missingImage":false},{"qid":"2367913","cat":"片段阅读","stem":"国家审计独立性得到充分保障决定了审计法治的实现程度，决定了审计质量水平和审计结果的公正程度，也决定了审计能否在国家治理活动中发挥其“免疫系统”的功能，进而决定审计反腐的使命能否顺利完成。\n下列说法与画线部分表述的意义最为相似的是","options":{"A":"国家审计独立性得到充分保障与否决定了审计法治的实现可能性","B":"国家充分保障审计独立性与否决定了审计法治的实现程度","C":"国家审计独立性能否得到充分保障决定了审计法治的实现程度","D":"国家能否充分保障审计独立性决定了审计法治的实现可能性"},"answer":"C","explanation":"定位画横线句子“国家审计独立性得到充分保障决定了审计法治的实现程度”，根据句子可知，画线部分强调“审计独立性得到充分保障”是“审计法治的实现程度”的基础，对应C项，当选。\nA项，偷换概念，文段表述的是审计法治的实现程度，不是实现的可能性，排除。\nB项，表述错误，“与否”不能决定“实现程度”，“否”的情况下可能无法实现“审计法治”。并且主语错误，文段并没有表述“审计独立性”是国家保障的，排除。\nD项，主语错误，文段并没有表述“审计独立性”是国家保障的，排除。\n 故正确答案为C。","no":33,"missingImage":false},{"qid":"2367914","cat":"片段阅读","stem":"在一项研究中，研究者发现由于关于慢阻肺（慢性阻塞性肺炎）的刻板印象根深蒂固，有可能导致罹患这种疾病的女性患者不能被及时确诊。研究者请192位医生诊断一批中年患者，他们是长期咳嗽以及有吸烟史的男性或女性。在初次检查中，只有\u003cimg data-k=\"29980f8660cf\">的女性患者被诊断为慢阻肺，而男性患者则达到了\u003cimg data-k=\"675c3b4f494e\">的诊断率。随后，研究者提供了指向慢阻肺的医学检验报告，这时诊断率的性别差距缩小了，但仍然没有完全消失。\n文段中“刻板印象”指的是：","options":{"A":"女性患慢阻肺疾病的可能性较小","B":"女性患慢阻肺不容易被诊断","C":"男性由于吸烟史导致患慢阻肺","D":"男性慢阻肺很容易被诊断"},"answer":"A","explanation":"词句理解题，“刻板印象”出现在文段首句，首句说明刻板印象会导致罹患慢阻肺的女性患者不能被及时确诊，后文又通过列举研究数据论述了刻板印象导致的结果即女性被诊断为慢阻肺的比率明显低于男性，能够导致这种结果的原因为“人们具有女性患慢阻肺疾病的可能性较小”这样的观念，所以“刻板印象”就是指“女性患慢阻肺疾病的可能性较小”，对应A项。\nB项“不容易被诊断”为刻板印象导致的结果，而非刻板印象本身，排除。\nC、D项，根据文段首句“刻板印象有可能导致······女性患者······”可知，刻板印象的作用主体为女性，男性患病原因、是否容易被诊断，与女性无关，排除。\n故正确答案为A。","no":34,"missingImage":false},{"qid":"2367887","cat":"片段阅读","stem":"当前，人们往往简单地将“积极老龄化”理解为“老有所为”，但其真正含义远超后者。通常，我国“老有所为”的主体主要是老干部、老专业科技人才、老知识分子等，但他们只是老年人中的一部分。“积极老龄化”是面向全体老年人群体的，不仅老干部、老知识分子要“积极老龄化”，普通老人也要“积极老龄化”。“老有所为”着重强调老年人“参与”的一面，“积极老龄化”还强调“健康”和“保障”以及三者之间的有机统一和结合，参与社会仅是“积极老龄化”的一个方面。\n这段文字意在阐明","options":{"A":"“积极老龄化”比“老有所为”内涵更丰富","B":"“老有所为”和“积极老龄化”的主体不同","C":"“老有所为”比“积极老龄化”更重视参与","D":"“积极老龄化”概念长期被误读的根本原因"},"answer":"A","explanation":"文段首先引出“积极老龄化”这一话题，接下来通过转折词 “但”强调“积极老龄化”的含义远超“老有所为”，其含义更丰富。后文从两个概念的主体和内容两个方面进行解释说明，“老有所为”的主体只是老年人的一部分，“积极老龄化”面向全体老年人群体； “老有所为”强调老年人“参与”的一面、“积极老龄化”还强调“健康”和“保障”以及三者之间的有机统一和结合。故文段强调的是“积极老龄化”比“老有所为”内涵更丰富，对应A项，当选；B项“主体不同”、C项“重视参与”仅为解释说明中的一个方面，表述片面，且非重点，均排除；D项对应首句转折之前的内容，非重点，且“根本原因”无中生有，排除。\n故正确答案为A。\n【文段出处】《用科学诠释“积极老龄化”》","no":35,"missingImage":false},{"qid":"2367872","cat":"逻辑填空","stem":"古典诗歌热潮兴起不是                的，其中体现了先贤诗人几千年的智慧与情感。结合新的时代条件传承和        中华优秀传统文化，也必将有效提升我们的文化自信，为中华民族伟大复兴创造条件。\n依次填入画横线处最恰当的一项是","options":{"A":"理所当然  发扬","B":"必然  宣传","C":"自然而然  倡导","D":"偶然  弘扬"},"answer":"D","explanation":"第一空，根据“古典诗歌中体现了先贤诗人几千年的智慧与情感”可知，它的兴起是长期发展的结果，是一种必然的趋势，D项“偶然”与“不是”搭配，表必然的意思，符合文意，当选。A项“理所当然”指按道理应当这样，B项“必然”指客观事物联系和发展的合乎规律的、确定不移的趋势，与文意相悖，排除；C项“自然而然”指非人力干预而自然如此，“非人力干预”文段未涉及，排除。答案锁定D项。\n第二空，代入验证，“弘扬中华优秀传统文化”搭配恰当，符合文意，当选。\n故正确答案为D。\n【文段出处】《让传统文化浸润时代人心》","no":36,"missingImage":false},{"qid":"2367915","cat":"逻辑填空","stem":"青藏高原的特殊生物环境和生物资源，为我国科学家开展原创性的工作提供了                的条件。我们需要建设一支年富力强、野外经验丰富、多民族        的科研团队，寻找高端人才培养的学术援藏新模式，让西藏的生态学研究真正实现可持续发展。\n依次填入画横线处最恰当的一项是","options":{"A":"无可比拟  结合","B":"独一无二  组合","C":"绝无仅有  整合","D":"得天独厚  融合"},"answer":"D","explanation":"第一空，根据“青藏高原的特殊生物环境和生物资源”可知，横线处表达青藏高原提供的条件是特殊的，D项“得天独厚”指有特殊优越的条件，符合文段意思。A项“无可比拟”指没有可以相比的；B项“独一无二”指没有相同的，没有可以相比的；C项“绝无仅有”指只有一个，再没有别的，都体现的是没有其他的可以比较，程度过重，文段强调是比较特殊的条件，排除。\n第二空，代入验证，多个民族合在一起的科研团队，D项“融合”指的是不同的事物合在一起，符合意思，当选。\n故正确答案为D。\n【文段出处】《与时间赛跑的人——钟扬教授的两个昼夜》","no":37,"missingImage":false},{"qid":"2367876","cat":"逻辑填空","stem":"中国传统文化中的“和而不同”与共享观念，                地成为“人类命运共同体”以及“民心相通”的价值观的注脚。中国向世界提出了“人类共同命运”的全球倡议，包含了对全球“普遍联结”与“价值关联”等发展特征的        概括，是中国特色全球传播的生动表述。\n依次填入画横线处最恰当的一项是","options":{"A":"恰逢其时  高度","B":"无可替代  简洁","C":"恰如其分  凝练","D":"正当其时  有力"},"answer":"C","explanation":"第一空，根据文意，该空表示中国的“和而不同”与共享观念，恰好符合对“人类命运共同体”以及“民心相通”价值观的解释，C 项“恰如其分”指办事或说话十分恰当合适，符合文意，当选。A 项“恰逢其时”指恰恰遇到这个时候，D 项“正当其时”指正是时候，文段并未涉及时间，排除；B 项“无可替代”指没有什么能够取代、替换，程度过重，排除。\n第二空，代入验证，根据“人类命运共同体”包含了“普遍联结”与“价值关联”等发展特征可知，它是对多种发展特征的非常简洁的概括，C 项“凝练”指紧凑简练，符合文意，当选。\n故正确答案为C。\n文段出处：《提升“一带一路”背景下中国价值观国际传播力的思考》","no":38,"missingImage":false},{"qid":"2367878","cat":"逻辑填空","stem":"地方戏曲是中华文化的重要组成部分，在新时代受到诸多新兴事物的冲击而略显暗淡，甚至濒临消亡。作为新时期的文化工作者，我们        着传承和保护中华传统文化的使命，如何在整个社会大环境中，营造出戏曲文化氛围，不断传承和发展地方戏曲，使其兼具传统韵味和时代气息，赢得更多人的喜爱，是我们需要始终                探索的课题。\n依次填入画横线处最恰当的一项是","options":{"A":"背负  矢志不渝","B":"承担  孜孜以求","C":"担负  持之以恒","D":"肩负  坚持不懈"},"answer":"D","explanation":"第一空，横线处与“使命”搭配，B项“承担”指担负、担当，C项“担负”指承当，D项“肩负”指担负，三项均可与“使命”搭配，均保留。A项“背负”指担负，多搭配偏消极或中性词，如“包袱、重任、债务”等，与“使命”搭配不当，排除。\n第二空，与“探索”搭配且通过“始终”进行修饰，用来形容对课题的探索自始至终一直进行下去。D项“坚持不懈”指坚持到底，毫不松懈，侧重点在不松懈，形容探索的过程，符合文意，当选。B项“孜孜以求”比喻不知疲倦地探求，本身包含“求”的语境，与后文“探索”语义重复，排除；C项“持之以恒”指长久坚持下去，“恒”与“始终”语义重复，排除。\n故正确答案为D。\n【文段出处】《论如何实现地方戏曲的传承与保护》（文段有更改）","no":39,"missingImage":false},{"qid":"2367917","cat":"逻辑填空","stem":"近年来，自动驾驶成为汽车产业的制高点，各国纷纷加快立法，推动路面测试，加速产业        。国内有关部门和地方应                ，加强对自动驾驶车辆上路测试的全方位监管，让自动驾驶产业        起步的过程更加平稳、安全。\n依次填入画横线处最恰当的一项是","options":{"A":"孵化  未雨绸缪  摸索","B":"催化  有的放矢  创新","C":"发展  出谋划策  创业","D":"成长  奋起直追  探索"},"answer":"A","explanation":"第一空，搭配“产业”，根据“自动驾驶成为汽车产业的制高点”“各国纷纷加快立法”可知，横线所填词语要体现出加速产业的前进发展，A项“孵化”、C项“发展”、D项“成长”符合，保留。B项“催化”指的是促使化学反应的速率发生改变，与“产业”搭配不当，排除。\n第二空，根据“让自动驾驶······起步的过程更加平稳、安全”可知，横线处表达要提前做好准备的意思，A项“未雨绸缪”指事先做好准备，符合文意，保留。C项“出谋划策”指出主意，定计策，D项“奋起直追”形容振作起来，奋勇赶上，紧紧的追赶上去，均无法体现出提前做好准备保障产业发展更平稳之意，排除。\n第三空，代入验证，自动驾驶产业是才开始的一个产业，A项“摸索”符合，当选。\n故正确答案为A。","no":40,"missingImage":false},{"qid":"2367879","cat":"逻辑填空","stem":"支付工具的多样化组合，提升了我国支付体系运行的质量和效率，满足了公众            支付需求。从未来支付趋势看，现金支付和非现金支付工具相互        、相互补充、共存共生的局面将长期存在。但是对我国这样一个地域广、人口多、发展很不均衡的大国来说，由于核心技术水平的限制，过度依赖非现金支付会大大增加支付体系的脆弱性。因此，必须长期        现金作为国家法定支付方式的地位，切实保障广大人民使用现金的合法权益。\n依次填入画横线处最恰当的一项是","options":{"A":"区别化  支持  确保","B":"差异化  支撑  确立","C":"个性化  支援  确认","D":"多元化  支应  确证"},"answer":"B","explanation":"第一空，根据“支付工具的多样化组合”可知，横线处表达满足公众不同的支付需求，选项均符合文意。\n第二空，通过顿号与“相互补充”构成并列结构，横线处对应“补充”，表示现金支付与非现金支付长期共存，“相互支持”、“相互支撑”符合文意。C项“支援”指用人力、物力、财力或其他实际行动去支持和援助，D项“支应”指敷衍、应付，均与文意不符。\n第三空，与“地位”搭配，B项“确立地位”搭配恰当，当选。A项“确保”指切实保持或保证，搭配不当，用在此处应表述为“必须长期确保现金的首要地位不动摇”，排除。\n故正确答案为B。\n【文段出处】《中国金融》：现金的价值与生命力","no":41,"missingImage":false},{"qid":"2367883","cat":"逻辑填空","stem":"去年冬天，我终于再次回到家乡。踏上这片                的土地，不觉中满眼尽是熟悉的情景。猛地回到现实中，我早已泪眼        。街市的路面依然那样光亮，如同镜面一样，反衬着天空和街道两侧时常变换的店舍，时间似乎并没有在此停留，而是平静地        着正在发生的一切。\n依次填入画横线处最恰当的一项是","options":{"A":"魂牵梦绕  婆娑  诉说","B":"知根知底  朦胧  讲述","C":"牵肠挂肚  模糊  呈现","D":"日思夜想  迷离  反映"},"answer":"A","explanation":"第一空，搭配“土地”，根据“再次回到家乡”“满眼熟悉的场景”“早已泪眼”可知，横线所填词语表达对这片土地非常熟悉和思念的意思，A项“魂牵梦绕 bbde\">丁南塘；\n④\u003cimg data-k=\"e752a8ae1a16\">甲南塘。\n题干信息不确定，可用假设法。\n根据①可知，乙或丙肯定有人会跟甲一组，有两种情况：\n（1）假如，乙和甲一组，根据条件②可知，如果甲东风，那么乙和丁也得东风，与题干每条道路恰有两人选择矛盾，所以，甲不选东风，根据条件④可知，甲不选南塘，所以甲只能选西河和北海；\n（2）假如，丙和甲一组，根据条件②可知，如果甲东风，那么丙和丁也得东风，与题干每条道路恰有两人选择矛盾，所以，甲不选东风，根据条件④可知，甲不选南塘，所以甲只能选西河和北海。\n无论哪种情况，最后甲只能选西河和北海。\n故正确答案为A。","no":65,"missingImage":false},{"qid":"2367870","cat":"逻辑判断","stem":"如果乙不选东风路，则可以得出以下哪项？","options":{"A":"甲或者选东风路或者选南塘路","B":"乙或者选西河路或者选南塘路","C":"丙或者选南塘路或者选北海路","D":"丁或者选西河路或者选北海路"},"answer":"B","explanation":"第一步：整理题干信息。\n① 每人各选两条道路，每条道路恰有两人选择，乙与丙始终没有在一组；\n② 甲东风\u003cimg data-k=\"7b6029b3bbde\">丁东风； \n③ 丙南塘\u003cimg data-k=\"7b6029b3bbde\">丁南塘；\n④ \u003cimg data-k=\"e752a8ae1a16\">甲南塘；\n⑤ \u003cimg data-k=\"e752a8ae1a16\">乙东风。\n根据99题结论可知，条件⑥甲选西河路和北海路，不选东风路和南塘路，又条件①乙与丙始终没有在一组，对于东风路和南塘路，甲不选，乙和丙也不能同时选，则丁必然要选东风路和南塘路，又根据条件⑤ \u003cimg data-k=\"e752a8ae1a16\">乙东风，可填写表格如下：\n\u003cimg data-k=\"c7d09286dc4e\" style=\"max-width:564px\">\n第二步：逐一分析选项。\nA项：根据分析可知甲选西河路和北海路，不可能选东风路或者选南塘路，不能推出，排除；\nB项：根据分析可知乙有三种情况，可以选西河路和北海路/西河路和南塘路/南塘路和北海路，对于三种情况，选项说法选西河路或者选南塘路均成立，可以推出，当选；\nC项：根据分析可知丙有三种情况，可以选东风路和西河路/东风路和南塘路/东风路和北海路，对于三种情况，选项说法选南塘路或者选北海路不一定成立，不能推出，排除；\nD项：根据分析可知丁选东风路和南塘路，不可能选西河路或者选北海路，不能推出，排除。\n故正确答案为B。","no":66,"missingImage":false},{"qid":"2367849","cat":"类比推理","stem":"贫困：脱贫：共同富裕","options":{"A":"协商：参与：社会治理","B":"输液：治疗：身体康复","C":"干旱：施肥：粮食丰收","D":"污染：治污：绿水青山"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n贫困是脱贫的必要条件，共同富裕是脱贫的目的。\n第二步：判断选项词语间逻辑关系。\nA项：协商不是参与的必要条件，社会治理不是参与的目的，与题干逻辑关系不一致，排除；\nB项：输液不是治疗的必要条件，身体健康是治疗的目的，前两个词与题干逻辑关系不一致，排除；\nC项：干旱是一种气候现象，干旱不是施肥的必要条件，粮食丰收是施肥的目的，前两个词与题干逻辑关系不一致，排除；\nD项：污染是治污的必要条件，绿水青山是治污的目的，与题干逻辑关系一致，当选。\n故正确答案为D。","no":67,"missingImage":false},{"qid":"2367927","cat":"类比推理","stem":"男博士：女教授：教授","options":{"A":"政治家：文学家：作家","B":"无理数：正整数：正数","C":"电动车：电冰箱：电器","D":"公路桥：铁路桥：桥梁"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n有的男博士是教授，有的男博士不是教授，并且有的教授是男博士，有的教授不是男博士，二者为交叉关系。女教授是教授，二者为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：政治家和作家是交叉关系，与作家相比，文学家一般范围更大，故文学家不是作家的一种，与题干逻辑关系不一致，排除；\nB 确答案为D。","no":72,"missingImage":false},{"qid":"2367931","cat":"类比推理","stem":"茶壶 之于 （    ） 相当于 （    ） 之于 桃花","options":{"A":"茶艺——桃红","B":"茶叶——桃仁","C":"壶嘴——桃树","D":"茶馆——桃园"},"answer":"C","explanation":"逐一代入选项。\nA项：茶壶是展示茶艺的工具，二者是工具对应关系，桃花是桃红色的，二者是属性对应关系，前后逻辑关系不一致，排除；\nB项：茶壶是用来冲泡茶叶的，二者是工具对应关系，桃仁和桃花是并列关系，前后逻辑关系不一致，排除；\nC项：壶嘴是茶壶的组成部分，桃花是桃树的组成部分，都是组成关系，前后逻辑关系一致，当选；\nD项：茶馆是使用茶壶的地方，桃园是桃花盛开的地方，但两词的顺序相反，前后逻辑关系不一致，排除；\n故正确答案为C。","no":73,"missingImage":false},{"qid":"2367778","cat":"类比推理","stem":"燃气 之于（    ）相当于（    ）之于 语言","options":{"A":"管道——信息","B":"火源——表演","C":"灶具——文字","D":"沼气——交际"},"answer":"A","explanation":"逐一代入选项。\nA项：管道输送燃气，二者为对应关系；语言传递信息，二者为对应关系，前后逻辑关系一致，当选；\nB项：燃气是可燃物，火源是指能点燃可燃物的能量来源，二者为能量来源的对应关系；用语言表演，二者为方式的对应关系，前后逻辑关系不一致，排除；\nC项：灶具使用燃气作为燃料，二者为对应关系；语言和文字为并列关系，前后逻辑关系不一致，排除；\nD项：沼气是燃气的一种，二者为种属关系；用语言交际，二者为工具对应关系，前后逻辑关系不一致，排除。\n故正确答案为A。","no":74,"missingImage":false},{"qid":"2367932","cat":"类比推理","stem":"日曰曰日戊戍戍戊白","options":{"A":"己巳巳己愕谔愕谔鄂","B":"甲由由甲申喂喂伸神","C":"嚄噢噢嚄哑咔咔哑娅","D":"嗒呾怛嗒嚓察察嚓檫"},"answer":"C","explanation":"第一步：分析题干汉字间关系。\n从相同汉字的位置入手：位置1、4的汉字相同；位置2、3的汉字相同，位置5、8的汉字相同，位置6、7的汉字相同。\n第二步：判断选项符号间关系。\nA项：位置5、8汉字不相同，与题干不一致，排除；\nB项：位置5、8汉字不相同，与题干不一致，排除；\nC项：位置1、4的汉字相同；位置2、3的汉字相同，位置5、8的汉字相同，位置6、7的汉字相同，与题干一致，当选；\nD项：位置2、3汉字不相同，与题干不一致，排除。\n故正确答案为C。","no":75,"missingImage":false},{"qid":"2367933","cat":"逻辑判断","stem":"\u003cimg data-k=\"10e884c47eea\" style=\"max-width:422px\">","options":{"A":"\u003cimg data-k=\"64aace06a9d9\" style=\"max-width:413px\">","B":"\u003cimg data-k=\"93faed389e64\" style=\"max-width:411px\">","C":"\u003cimg data-k=\"da7c844c220a\" style=\"max-width:425px\">","D":"\u003cimg data-k=\"c3d0b8039861\" style=\"max-width:413px\">"},"answer":"B","explanation":"第一步：分析题干符号间关系。\n从相同符号的位置入手：位置1、4的符号相同；位置2、6、8符号相同；位置7、9符号相同。\n第二步：判断选项符号关系。\nA项：相同位置与题干一致，但位置3、5符号相同，而题干3、5符号不相同，与题干逻辑关系不一致，排除；\nB项：位置1、4的符号相同；位置2、6、8符号相同；位置7、9符号相同，与题干逻辑关系一致，当选；\nC项：位置5、7、9符号相同，而题干5、7符号不相同，与题干逻辑关系不一致，排除；\nD项：位置7、9符号不相同，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":76,"missingImage":false},{"qid":" ":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"将题干展开图中的面依次标注为面a、b、c、d，如下图：\n\u003cimg data-k=\"9c9ff7e32722\" style=\"max-width:693px\">\nA项：选项由面b和面d构成，题干展开图中面b和面d的箭头指向的边是两个面的公共边，选项中箭头指向的边不是两个面的公共边，选项与题干不一致，排除；\n\u003cimg data-k=\"20c70af50a82\" style=\"max-width:683px\">\nB项：选项由面a和面c构成，与题干一致，当选；\nC项：选项由面b和面c构成，题干展开图中面b和面c的公共边与面c内的直线相交于面c的一个顶点，选项中面b和面c的公共边与面c内的直线相交于公共边的中点，选项与题干不一致，排除；\n\u003cimg data-k=\"edd3985c9179\" style=\"max-width:684px\">\nD项：选项由面a和面d构成，题干展开图中面a和面d的公共边与面a内的虚线相交于面a的一个顶点，选项中面a和面d的公共边与面a内的虚线相交于公共边的中点，选项与题干不一致，排除。\n\u003cimg data-k=\"366505f1f2d9\" style=\"max-width:694px\">\n故正确答案为B。","no":86,"missingImage":false},{"qid":"2367944","cat":"图形推理","stem":"左边给定的是纸盒外表面的展开图，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"1e05b89a10f2\" style=\"max-width:631px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"将题干展开图中的面依次标号，如下图：\n\u003cimg data-k=\"34eab3aeab9f\" style=\"max-width:531px\">\nA项：选项由面a、b、e构成，以面e中与小短线有交点的那条边为起点在面e中顺时针画边，题干中第2边对着面d，选项中第2边对着面b，选项与题干不一致，排除；\n\u003cimg data-k=\"b4f18fe2f84f\" style=\"max-width:547px\">\nB项：选项由面b、c、e构成，题干中面b和面c的公共边是小直角三角形的斜边，选项中的公共边是大直角三角形的直角边，选项与题干不一致，排除；\n\u003cimg data-k=\"128906b6acf5\" style=\"max-width:526px\">\nC项：选项由面a、d、e构成，题干中面a和面d的公共边是面a中纯白矩形的短边，而选项中面a和面d的公共边是纯白矩形的长边，选项与题干不一致，排除；\n\u003cimg data-k=\"22a2ab24373f\" style=\"max-width:529px\">\nD项：选项与题干一致，当选。\n故正确答案为D。","no":87,"missingImage":false},{"qid":"2367945","cat":"图形推理","stem":"左边给定的是纸盒外表面的展开图，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"337f31cf8e3e\" style=\"max-width:691px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"将题干展开图中的面依次标号，如下图：\n\u003cimg data-k=\"91a710729af0\" style=\"max-width:693px\">\nA项：选项由面b、c、d构成，以面c白色直角为起点在面c中顺时针画边，题干中第4条边对着面b，选项中第4条边对着面d，选项与题干不一致，排除；\n\u003cimg data-k=\"8cdd0114d69e\" style=\"max-width:693px\">\nB项：选项由面b、e、f构成，题干中面b和面e是相对面，不能同时出现，选项与题干不一致，排除；\n\u003cimg data-k=\"0ac91e93e2dc\" style=\"max-width:689px\">\nC项：选项由面a、b、f构成，以面a和面b的对角线的交点为起点在面a内顺时针画边，题干中顺时针第1条边对着面b，选项中顺时针第4条边对着面b，选项与题干不一致，排除；\n\u003cimg data-k=\"ffc524ecc38d\" style=\"max-width:700px\">\nD项：选项与题干一致，当选。\n故正确答案为D。","no":88,"missingImage":false},{"qid":"2367815","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"a91fff768d1a\" style=\"max-width:626px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，优先考虑属性规律。九宫格优先按横行看，第一行图形均由直线构成，第二行图形均由曲线构成，第三行图形均由直线和曲线构成，因此“？”处图形应由直线和曲线构成，只有A项符合。\n故正确答案为A。","no":89,"missingImage":false},{"qid":"2367946","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"bdf915d76430\" style=\"max-width:592px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查图形的实际意义，寻找最大共同点。观察发现，题干所有图形都是一根枝干上长满了相同的叶子或花，九宫格优先按横行来看，第一行，花枝朝向依次为左、右、左；第二行，花枝朝向依次是右、左、右，规律均为左右交替出现，第三行前两个图花枝朝向为左、右，因此“？”处花枝朝向应为左，C、D两项花枝朝向不是左（注：C项可能存在争议，有部分同学觉得是朝上，无论是朝右还是朝上，均不是朝左），均排除；A项花枝最上面是3朵花，下面是3片叶子，一根枝干上元素不相同，只有B项满足题干图形特征。\n故正确答案为B。","no":90,"missingImage":false},{"qid":"2367947","cat":"图形推理","stem":"左图为给定的立体，从任意角度剖开，右边哪一项不可能是它的截面图？\n\u003cimg data-k=\"f936c403f333\" style=\"max-width:697px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查截面图，逐一分析选项。\n如下图所示，B、C、D项均可截出，A项无法截出，因为长方形空心部分上面不应有实线，实际截面图应为凹字型。\n\u003cimg data-k=\"524aa325b545\" style=\"max-width:584px\">\n故正确答案为A。","no":91,"missingImage":false},{"qid":"2367948","cat":"逻辑判断","stem":"信仰、信念、信心，任何时候都至关重要。小到一个人、一个集体，大到一个政党、一个民族、一个国家。只要有信仰、信念、信心，就会愈挫愈奋、愈战愈勇，否则就会不战自败、不打自垮。\n根据以上陈述，可以得出以下哪项？","options":{"A":"没有信仰、信念、信心，我们就会不战自败、不打自垮","B":"没有信仰、信念、信心，我们就不会愈挫愈奋，愈战愈勇","C":"如果不战自败、不打自垮，就说明我们没有信仰、信念、信心","D":"如果愈挫愈奋、愈战愈勇，我们就不会不战自败、不打自垮"},"answer":"A","explanation":"第一步：翻译题干。\n①信仰、信念、信心\u003cimg data-k=\"7b6029b3bbde\">愈挫愈奋、愈战愈勇；\n②\u003cimg data-k=\"e752a8ae1a16\">（不战自败、不打自垮）\u003cimg data-k=\"7b6029b3bbde\">信仰、信念、信心。\n将①②串联后可递推出：③\u003cimg data-k=\"e752a8ae1a16\">（不战自败、不打自垮）\u003cimg data-k=\"2dfb7d1f72f3\">信仰、信念、信心\u003cimg data-k=\"2dfb7d1f72f3\">愈挫愈奋、愈战愈勇。\n第二步：逐一分析选项。\nA项：翻译为\u003cimg data-k=\"e752a8ae1a16\">（信仰、信念、信心）\u003cimg data-k=\"7b6029b3bbde\">不战自败、不打自垮，属于②的逆否等价，可以推出，当选；\nB项：翻译为\u003cimg data-k=\"e752a8ae1a16\">（信仰、信念、信心）\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">（愈挫愈奋、愈战愈勇），是对条件①箭头前内容的否定，否前得不到确定性的结论，无法推出，排除；\nC项：翻译为不战自败、不打自垮\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">（信仰、信念、信心），是对条件②箭头前内容的否定，否前得不到确定性的结论，无法推出，排除；\nD项：翻译为愈挫愈奋、愈战愈勇\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">（不战自败、不打自垮），是对条件③箭头后内容的肯定，肯后得不到确定性的结论，无法推出，排除。\n故正确答案为A。","no":92,"missingImage":false},{"qid":"2367860","cat":"逻辑判断","stem":"智能手机流行的时代，我们每天发送信息，也收到信息。人际之间的电子信息交往已成为当今时代一种独特的交往方式。在面对重要的人或关系时，很多人往往发出信息后就期待被秒回，如果没有被秒回，他们就产生一种怀疑感或被弃感，从而陷入深深的烦恼和焦虑之中。\n以下哪项最可能是他们陷入深深烦恼和焦虑所需的假设？","options":{"A":"当前技术已能实现智能手机的即时通信，方便快捷，且基本免费","B":"有些聊天软件能在发送者手机中反馈信息接收者是否阅读了信息","C":"有些人工作很忙，总习惯在忙完一天工作后才统一处理相关信息","D":"有些人一天收到的信息太多，容易遗漏某人期待秒回的重要信息"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：在面对重要的人或关系时，很多人往往发出信息后就期待被秒回，如果没有被秒回，他们就产生一种怀疑感或被遗弃感，从而陷入深深的烦恼和焦虑之中。\n论据：无。\n本题无论据，只能通过补充论据进行加强。提问方式是假设类，优先考虑补充必要条件，即没有这个选项，论点则无法成立。\n第二步：逐一分析选项。\nA项：如果智能手机不能即时通信，那么发出的信息就无法被即时接收，发出者就不会期待秒回，因此A项是信息能够被秒回的必要条件，当选；\nB项：有些聊天软件能在发送者手机中反馈信息接收者是否阅读了信息，可以解释部分发出者为什么没有被秒回就会产生怀疑感或被弃感，但是力度较弱，且不是论点成立的必要条件，排除；\nC项：接收者什么时候阅读信息与发出者没被秒回就会产生烦恼和焦虑无关，排除； \nD项：接收者是否遗漏了重要信息与发出者没被秒回就会产生烦恼和焦虑无关，排除。\n故正确答案为A。\n附：通过查证原文，本题答案为A项。\n\u003cimg data-k=\"6b2f2c14ad9a\" style=\"max-width:700px\">","no":93,"missingImage":false},{"qid":"2367949","cat":"逻辑判断","stem":"某地开展企业结对扶贫创新活动，倡导企业家与贫困家庭互选，要求每户贫困家庭只能选1位企业家，而每位企业家只能在选他的贫困家庭中选择1-2户开展帮扶活动。现有企业家甲、乙、丙3人面对张、王、李、赵4户贫困家庭，已知：\n（1）张、王2户至少有1户选择甲；\n（2）王、李、赵3户中至少有2户选择乙；\n（3）张、李2户中至少有1户选择丙。\n事后得知，互选顺利完成，每户贫困家庭均按自己心愿选到了企业家，而每位企业家也按要求选到了贫困家庭。\n根据以上信息，可以得出以下哪项？","options":{"A":"企业家甲选到了张户","B":"企业家乙选到了赵户","C":"企业家丙选到了李户","D":"企业家甲选到了王户"},"answer":"B","explanation":"分析题干。\n（1）张或王选甲\n（2）王、李、赵中至少2户选乙\n（3）张或李选丙\n由题干“每户贫困家庭只能选1位企业家，每位企业家只能在选他的贫困家庭中选择1-2户开展帮扶活动”可知：甲互选的帮扶家庭数为1，乙互选的帮扶家庭数为2，丙互选的帮扶家庭数为1；再根据条件（1）可知，张或王选甲，说明李和赵不选甲；由条件（2）可知，张不选乙，由条件（3）可知，王和赵不选丙，此时赵即不选甲也不选丙，又已知“每户贫困家庭均按自己心愿选到了企业家”，因此，赵只能选企业家乙，即企业家乙选到了赵户。\n故正确答案为B。","no":94,"missingImage":false},{"qid":"2367950","cat":"逻辑判断","stem":"当今社会，不少老人为了帮助子女照顾下一代而漂泊异乡成为“老漂族”。在最近一项城市调查中，\u003cimg data-k=\"fc8bc69f3f98\">的受访青年坦言，自己的父母就是老漂族，自己与爱人事业刚刚起步，工作压力较大，根本没有时间照顾孩子和做家务。有专家据此断言，我国城市中的老漂族群体还会进一步扩大。\n以下哪项如果为真，最能支持上述专家的观点？","options":{"A":"老人在城市养老可拥有比乡村更好的医疗条件","B":"有些老人故土难离事务缠身更愿意生活在家乡","C":"国家二孩政策的实施将会促使更多的孩子出生","D":"二孩政策实施后城市的二孩出生率要低于农村"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：我国城市中的老漂族群体还会进一步扩大。\n论据：\u003cimg data-k=\"fc8bc69f3f98\">的受访青年坦言，自己的父母就是老漂族，自己与爱人事业刚刚起步，工作压力较大，根本没有时间照顾孩子和做家务。\n题干论点探讨的是老漂族群体会进一步扩大，可以通过补充论据说明老漂族群体在增加或照顾孩子和做家务的人员短缺等进行加强。\n第二步：逐一分析选项。\nA项：说的是城市养老医疗条件比乡村更好，与论点说的老漂族群体会进一步扩大无关，话题不一致，无法加强，排除；\nB项：说的是老人更愿意生活在家乡，老人的意愿与论点说的老漂族群体会进一步扩大无关，无法加强，排除；\nC项：国家二孩政策会促使更多的孩子出生，补充论据说明需要照顾孩子的情况会更多，对老漂族群体扩大进行了加强，可以支持，当选；\nD项：二孩出生率农村更高，农村的照顾孩子的需求会更多些，老漂族应该会减少而不是扩大，无法加强，排除。\n故正确答案为C。","no":95,"missingImage":false},{"qid":"2367861","cat":"逻辑判断","stem":"某区对所辖钟山、长江、梅园、星海4个街道进行抽样调查，并按照人均收入为其排序。有人根据以往经验对4个街道的人均收入排序作出如下预测：\n（1）如果钟山街道排第三，那么梅园街道排第一；\n（2）如果长江街道既不排第一也不排第二，那么钟山街道排第三；\n（3）钟山街道排序与梅园街道相邻，但与长江街道不相邻。\n事后得知，上述预测符合调查结果。\n根据以上信息，可以得出以下哪项？","options":{"A":"钟山街道不排第一就排第四","B":"长江街道不排第二就排第三","C":"梅园街道不排第二就排第四","D":"星海街道不排第一就排第三"},"answer":"A","explanation":"第一步：分析题干条件。\n① 钟山第三\u003cimg data-k=\"7b6029b3bbde\">梅园第一；\n② 长江\u003cimg data-k=\"e752a8ae1a16\">第一 且 \u003cimg data-k=\"e752a8ae1a16\">第二\u003cimg data-k=\"7b6029b3bbde\">钟山第三；\n③ 钟山与梅园相邻，与长江不相邻。\n第二步：根据题干条件进行推理。\n钟山出现次数最多，为最大信息，可作为突破口。根据③可知：钟山与梅园相邻，结合①可知：钟山第三\u003cimg data-k=\"7b6029b3bbde\">梅园第一，故钟山不能排名第三。\u003cimg data-k=\"e752a8ae1a16\">钟山第三是对②的否后，否后必否前，故长江排名第一或者第二。\n如果长江排第一，根据③可知钟山只能排第四，故梅园排第三，星海排第二，排除B、C、D项，只有A项成立；\n如果长江排第二，根据③可知钟山只能排第四，故梅园排第三，星海排第一，A项依然成立。\n故正确答案为A。","no":96,"missingImage":false},{"qid":"2367951","cat":"逻辑判断","stem":"人饿了会吃东西，一旦摄入碳水化合物、脂肪、蛋白质等能量营养素，就能消除饥饿感，这种缺乏能量营养素的饥饿是显性饥饿；然而，人体健康还需铁、锌等16种矿物元素及维生素A、维生素E等13种维生素，如果缺乏这些微量营养素，则会造成隐性饥饿。显然，显性饥饿只要“吃饱”就能解决，而隐性饥饿只有“吃好”才能应对。\n根据以上陈述，可以得出以下哪项？","options":{"A":"既要“吃饱”又要“吃好”，如此就能保证人体的健康","B":"消除显性饥饿对人更重要，只有“吃饱”才能“吃好”","C":"隐性饥饿并不同于显性饥饿，“吃不好”不等于“吃不饱”","D":"隐性饥饿对人体健康的危害比显性饥饿更大、更隐蔽"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干可知，“吃饱”可以解决显性饥饿，“吃好”可以解决隐性饥饿，但题干未提及二者同时成立是否就能保证人体健康，无法推出，排除；\nB项：题干中并未比较消除显性饥饿与消除隐性饥饿哪个更重要，无法推出，排除；\nC项：根据题干最后一句话可知，显性饥饿只要“吃饱”就能解决，而隐性饥饿只有“吃好”才能应对，说明这两种饥饿是不同的，其解决方式也并不相同，可以推出，当选；\nD项：题干中并未比较显性饥饿与隐性饥饿哪个对人体的健康危害更大，无法推出，排除。\n故正确答案为C。","no":97,"missingImage":false},{"qid":"2367863","cat":"逻辑判断","stem":"某县新一届党政领导班子刚组建完成，一心想为群众做一些实事。面对有限的财力，新一届领导班子明确表示，今年只能完成两件大事。对于众多排进公共政策议程的大事，他们认为：如果建一条乡村公路，则不能建污水处理厂；如果建污水处理厂，则要建排污管道；如果建排污管道，则不能建垃圾处理厂。\n按照这届领导班子的想法，以下哪项不可能是他们今年同时要建设的？","options":{"A":"乡村公路、排污管道","B":"乡村公路、垃圾处理厂","C":"污水处理厂、排污管道","D":"污水处理厂、垃圾处理厂"},"answer":"D","explanation":"第一步：翻译题干。\n①  建公路\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">建污水处理厂；\n②  建污水处理厂\u003cimg data-k=\"7b6029b3bbde\">建排污管道；\n③  建排污管道\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">建垃圾处理厂；\n将③和②可以递推出：④ 建污水处理厂\u003cimg data-k=\"7b6029b3bbde\">建排污管道\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">建垃圾处理厂；\n⑤  只能完成两件大事。\n第二步：逐一分析选项。\nA项：若建公路和排污管道，根据①得到不建污水处理厂，根据③得到不建垃圾处理厂，此时完成两件大事，与题干已知条件不矛盾，可以推出，排除；\nB项：若建公路和垃圾处理厂，根据①得到不建污水处理厂，根据④得到不建排污管道以及不建污水处理厂，此时完成两件大事，与题干已知条件不矛盾，可以推出，排除；\nC项：若建污水处理厂和排污管道，根据①的否后必否前，得到不建公路，根据④得到不建垃圾处理厂，此时完成两件大事，与题干已知条件不矛盾，可以推出，排除；\nD项：根据④可知，建污水处理厂\u003cimg data-k=\"7b6029b3bbde\">\u003cimg data-k=\"e752a8ae1a16\">建垃圾处理厂，故不可能同时建污水处理厂和垃圾处理厂，不能推出，当选。\n本题为选非题，故正确答案为D。","no":98,"missingImage":false},{"qid":"2367896","cat":"逻辑判断","stem":"科幻小说《三体》中提出的“黑暗森林理论”告诉我们，人类千万不能向宇宙透露我们地球的位置，否则就会被外星文明毁灭。但是，早在《三体》出版之前的1974年，人类就向距离地球超过2.2万光年的武仙座星团发送了一段无线电信号，以光速主动向宇宙宣告了自身的存在。这个编号为M13的武仙座星团拥有数十万颗恒星。科学家认为，恒星周围一般会伴有行星，但恒星上不可能存在生命体，行星上却可能有。深信黑暗森林理论的人不禁为人类这一鲁莽举动感到担心，认为人类的美好期望有可能会迎来残酷的现实。\n以下哪项如果为真，最能说明这种担心是不必要的？","options":{"A":"迄今为止人类并没有发现任何外星生命存在的迹象","B":"类地行星也并不罕见，平均每5颗恒星就拥有1颗","C":"恒星密集分布的武仙座星团内不存在任何行星系统","D":"即使武仙座星团文明收到信号也要在2.2万年以后"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：人类的美好期望有可能会迎来残酷的现实。\n论据：科幻小说《三体》中提出的“黑暗森林理论”告诉我们，人类千万不能向宇宙透露我们地球的位置，否则就会被外星文明毁灭。但是，早在《三体》出版之前的1974年，人类就向距离地球超过2.2万光年的武仙座星团发送了一段无线电信号，以光速主动向宇宙宣告了自身的存在。这个编号为M13的武仙座星团拥有数十万颗恒星。科学家认为，恒星周围一般会伴有行星，但恒星上不可能存在生命体，行星上却可能有。\n文段较长而且问法比较特殊，问“说明这种担心是不必要的”可以理解成是削弱题，论点是担心人类未来，论据是这种担心产生的依据，论点是对未来的预测，可优先考虑削弱论据。\n第二步：逐一分析选项。\nA项：指出迄今为止还没有发现任何外星生命存在的迹象，但是没有发现不代表以后不存在，属于不明确选项，无法削弱，排除；\nB项：指出类地行星不罕见，而行星上可能存在生命体，意味着存在其他生命体的可能性增加，人类会因此而担心，具有加强作用，排除；\nC项：指出武仙座星团不存在任何行星系统，也就是说不会存在生命体，就不会给人类带来危害，削弱论据，可以削弱，当选； \nD项：指出武仙星团接收到信号的时间会在2.2万年以后，之后是否会给地球上的人类带来危害，不得而知，属于不明确选项，无法削弱，排除。\n故正确答案为C。","no":99,"missingImage":false},{"qid":"2367802","cat":"定义判断","stem":"公众充权：指在公共政策的制定、执行、评估、监督过程中，公众积极参与，充分表达自己的利益主张，以推动公共政策过程的民主化与科学化。\n下列属于公众充权的是","options":{"A":"清明节到来前夕，一些社会人士在市文明办支持下创建了文明祭扫网站，号召民众祭扫时不放鞭炮，不烧纸钱，改用虚拟鲜花、电子蜡烛等绿色环保的方式","B":"快递小哥小李当选市人大代表后，在广泛走访充分调研的基础上，提交了一份关于如何保障快递员权益、促进快递行业健康发展的议案","C":"某市将要召开天然气价格调整听证会，有关部门要求辖区各街道、居委会搞好宣传动员工作，按照下达名额推举市民代表，确保公开公平公正","D":"在某县未来五年发展规划制定过程中，县委、县政府通过召开居民座谈会、专家听证会等形式，征求到了许多宝贵的意见"},"answer":"D","explanation":"第一步：找出定义关键词。\n“在公共政策的制定、执行、评估、监督过程中”、“公众积极参与，充分表达自己的利益主张”、“推动公共政策过程的民主化与科学化”。\n第二步：逐一分析选项。\nA项：创建文明祭扫网站，号召改用绿色环保的方式，不符合“在公共政策的制定、执行、评估、监督过程中”，不符合定义，排除；\nB项：提交议案，不符合“在公共政策的制定、执行、评估、监督过程中”，不符合定义，排除；\nC项：召开天然气价格调整听证会可以理解为“在公共政策的制定、执行、评估、监督过程中”，但按照下达名额推举市民代表，不符合“公众积极参与，充分表达自己的利益主张”，不符合定义，排除；\nD项：在某县未来五年发展规划制定过程中，符合“在公共政策的制定、执行、评估、监督过程中”，通过召开居民座谈会、专家听证会等形式，征求到了许多宝贵的意见，符合“公众积极参与，充分表达自己的利益主张”，符合定义，当选。\n故正确答案为D。","no":100,"missingImage":false},{"qid":"2367810","cat":"定义判断","stem":"信息扶贫：指政府或社会群体借助信息技术手段来解决因信息闭塞而导致的经济、文化上的贫困问题。\n下列属于信息扶贫的是","options":{"A":"某物流公司联手互联网巨头在边远山区定向从贫困户中招聘一批快递员，经过专业培训之后上岗，帮他们走上了脱贫致富的道路","B":"某手机生产厂家面向农村市场，推出了一款低成本、易操作、大屏幕、待机时间长的时尚智能手机，村民们纷纷换掉了原来的旧手机","C":"省城某重点中学建立网络课堂，向某贫困县的中学进行远程同步直播，使两地师生共享优质教学资源。几年来，该县考上重点大学的人数明显增多","D":"毕业返乡的小周带着几个同学开了家网店，在网上销售自家种植的红枣，销量逐步上升，日子越来越红火"},"answer":"C","explanation":"第一步：找出定义关键词。\n“政府或社会群体借助信息技术手段”、“解决因信息闭塞而导致的经济、文化上的贫困问题”。\n第二步：逐一分析选项。\nA项：招聘快递员，经过专业培训之后上岗，未体现“借助信息技术手段”，不符合定义，排除；\nB项：某手机生产厂家面向农村市场推出时尚智能手机，未体现“解决贫困问题”，也未体现“借助信息技术手段”，不符合定义，排除；\nC项：建立网络课堂，进行远程同步直播，符合“借助信息技术手段”，共享优质教学资源，该县考上重点大学的人数明显增多，符合“解决因信息闭塞而导致的文化上的贫困问题”，符合定义，当选；\nD项：开网店可以理解为“信息技术手段”，但未体现“解决因信息闭塞而导致的经济、文化上的贫困问题”，不符合定义，排除。\n故正确答案为C。","no":101,"missingImage":false},{"qid":"2367963","cat":"定义判断","stem":"“一门式”政务服务：指为了方便群众，将原本需要跑多个政府部门才能办成的事项集中到一个服务中心或简化到一个窗口办结的服务行为。\n下列属于“一门式”政务服务的是：","options":{"A":"某市建立了一个社会综合治理云平台，将多种渠道发现的社会问题按照标准化流程推送到相应的职能部门，明确责任人并限时解决，避免了部门之间推诿扯皮的情况","B":"某市新近成立了一个残疾人服务站，以前残疾人申请生活补贴需要携带申请表到各级残联审批盖章，现在只需到服务站提出申请，各级审批部门就会即时看到并办妥","C":"市医院为了解决患者就医难的问题，在一楼大厅开设了便民门诊，挑选了一批医术精湛的医生坐诊，患者可以一站式完成挂号、收诊、缴费、取药的全部流程","D":"某市非本地户籍的适龄儿童入学过去需要监护人现场提交户口、住房、工作证明等材料，现在只要通过教育部门专设的网上报名登记系统，就可一键提交全部材料"},"answer":"B","explanation":"第一步：找出定义关键词。\n“为了方便群众”、“将原本需要跑多个政府部门才能办成的事项集中到一个服务中心或简化到一个窗口办结”。\n第二步：逐一分析选项。\nA项：将多种渠道发现的社会问题按照标准化流程推送到相应的职能部门，未体现“集中到一个服务中心或简化到一个窗口办结”，且未体现“群众原本需要跑多个政府部门才能办成事项”，不符合定义，排除；\nB项：以前残疾人申请生活补贴需要携带申请表到各级残联审批盖章，体现了“原本需要跑多个政府部门”，现在只需到服务站提出申请，各级审批部门就会即时看到并办妥，体现了“集中到一个服务中心或简化到一个窗口办结”，且体现了“方便群众”，符合定义，当选；\nC项：市医院不属于政府部门，并且市医院为了解决患者就医难的问题，未体现“原本需要跑多个政府部门”，也不属于“政务服务”，不符合定义，排除；\nD项：过去需要监护人现场材料，未体现“原本需要跑多个政府部门”，“通过教育部门专设的网报名登记系统一键提交全部材料”是线上报名，未体现“集中到一个服务中心或简化到一个窗口办结”，不符合定义，排除。\n故正确答案为B。","no":102,"missingImage":false},{"qid":"2367816","cat":"定义判断","stem":"社会性处罚：指存在失信行为的人员所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚。\n下列属于社会性处罚的是","options":{"A":"以“站不起来”为理由强占他人座位的高铁“霸座男”，当场受到了乘警的严肃批评，下车后被移送公安机关接受治安处罚。这一事件曝光后，当事人的恶劣行为又遭到了全国网民的一致谴责","B":"由于数据造假，某教授在国际期刊上发表的论文被撤稿。在网民的谴责声中，该教授又被撤销了基于该论文所获得的绩效奖励、省部级科研项目、荣誉称号、社会兼职","C":"春节前夕，恶意拖欠农民工工资的部分包工头，被有关部门和各种媒体曝光，引起社会各界密切关注。根据银行、保险、铁路等部门的规定，这些违规者申请信用卡、购买保险以及动车和高铁票时都将受到限制","D":"长江沿岸的一家化工企业，多次不顾禁令向长江偷偷排污，最近被省有关部门通报批评，吊销了企业生产执照，它的上级主管部门及主要负责人也都受到了严厉的处罚"},"answer":"C","explanation":"第一步：找出定义关键词。\n“存在失信行为的人员”、“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”。\n第二步：逐一分析选项。\nA项：以“站不起来”为理由强占他人座位的高铁“霸座男”，符合“存在失信行为的人员”，当场受到了乘警的严肃批评，被移送公安机关接受治安处罚，这是与自身失信行为有直接关联的限制和处罚，不符合“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”，不符合定义，排除；\nB项：某教授数据造假，符合“存在失信行为的人员”，论文被撤稿，撤销了基于该论文所获得的绩效奖励、省部级科研项目、荣誉称号、社会兼职，均是与自身失信行为有直接关联的处罚，不符合“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”，不符合定义，排除；\nC项：恶意拖欠农民工工资的包工头，符合“存在失信行为的人员”，申请信用卡、购买保险以及动车和高铁票时都将受到限制，符合“所受到的与自身失信行为没有直接关联的来自其他部门的限制和处罚”，符合定义，当选；\nD项：长江沿岸的一家化工企业，多次不顾禁令向长江偷偷排污，不符合“存在失信行为的人员”，不符合定义，排除。\n故正确答案为C。","no":103,"missingImage":false},{"qid":"2367834","cat":"定义判断","stem":"友善采购：指因自然灾害或其他无法抗拒的因素而造成产品大量积压时，购买方按照不低于甚至略高于批发价或市场价的方式购买这些产品，以帮助生产者渡过难关的行为。\n下列属于友善采购的是：","options":{"A":"近期原材料价格上涨，各种电子器件供应紧张，某企业主动加价，从长期供货商那里购入了大批急需的电子器件，保证了企业生产的正常进行","B":"因连日暴雨引发山洪，造成当地瓜农数十亩即将上市的西瓜被淹，对口帮扶城市得知消息后，以市场价收购了该地瓜农的全部西瓜","C":"南方某地水果大获丰收，造成大量积压滞销，采购商得知东北销路很好，从忧心忡忡的果农那里大量购进，转销东北，获利颇丰","D":"某少数民族的传统手工艺虽然已成功申遗，其产品却始终打不开销路，经过民俗专家在媒体上的大力推介，终于走出了大山，市场反响很好"},"answer":"B","explanation":"第一步：找出定义关键词。\n“因自然灾害或其他无法抗拒的因素而造成产品大量积压”、“购买方按照不低于甚至略高于批发价或市场价的方式购买这些产品”、“以帮助生产者渡过难关”。\n第二步：逐一分析选项。\nA项：该选项中的企业是为了保障生产的正常运行而主动提出加价，没有体现出生产者因自然灾害或其他无法抗拒的因素而造成产品大量积压，也不符合“以帮助生产者渡过难关”，不符合定义，排除；\nB项：连日暴雨引发山洪，符合“因自然灾害或其他无法抗拒的因素”，数十亩，符合“造成产品大量积压”，对口帮扶城市以市场价收购了瓜农的全部西瓜，符合“购买方按照不低于甚至略高于批发价或市场价的方式购买这些产品”和“以帮助生产者渡过难关”，符合定义，当选；\nC项：南方某地水果大丰收，造成大量积压，“大丰收”不符合“因自然灾害或其他无法抗拒的因素”，且该选项也没有体现出“购买方按照不低于甚至略高于批发价或市场价的方式购买这些产品”，不符合定义，排除；\nD项：某少数民族的传统手工艺产品打不开销路，没有体现出“因自然灾害或其他无法抗拒的因素而造成产品大量积压”，不符合定义，排除。\n故正确答案为B。","no":104,"missingImage":false},{"qid":"2367821","cat":"定义判断","stem":"情感性劳动：指服务业员工在与顾客面对面交往时，将个人情感融入工作过程，对顾客、企业以及服务人员自己产生积极影响的行为。\n下列属于情感性劳动的是：","options":{"A":"某航空公司空姐站在登机口两旁欢迎乘客，时不时还会微笑着摸摸小孩的头","B":"小刘总是面带微笑、语气亲切热情地接打电话，连续多年被评为最美接线员","C":"某酒店智能客服“小青”善解人意，语音甜美，入住的客人都喜欢和她互动","D":"小秦在信访局工作多年，每次接待来访者，都非常耐心，细致了解具体情况"},"answer":"A","explanation":"第一步：找出定义关键词。\n“服务业员工”、“顾客”、“面对面”、“个人感情”、“对顾客、企业及自己产生积极影响”。\n第二步：逐一分析选项。\nA项：空姐属于“服务业员工”，站在登机口欢迎属于“面对面”，微笑摸摸小孩的头符合“个人感情”，符合定义，当选；\nB项：接打电话不符合“面对面”，不符合定义，排除；\nC项：小青是智能客服，不符合“个人情感”，不符合定义，排除；\nD项：小秦耐心、细致了解只体现工作负责，未体现“个人感情”，不符合定义，排除。\n故正确答案为A。","no":105,"missingImage":false},{"qid":"2367818","cat":"定义判断","stem":"隐形植入：指通过周边信息、符号体系等不易察觉的形式，使受众在不知不觉中受到影响的宣传策略。\n下列属于隐形植入的是：","options":{"A":"在某电视剧中，所有角色均使用同一品牌的手机，并使用这个品牌的经典铃声","B":"城运会到来之前，商家把印有城运会会徽的各类文化创意产品陆续摆上了柜台","C":"在某市博物馆馆标设计征集中，8号方案以浓郁的地域文化元素受到了评委的关注","D":"结婚纪念日快到了，为了提醒粗心又忙碌的丈夫，小李偷偷把他的手机屏保换成了婚纱照"},"answer":"A","explanation":"第一步：找出定义关键词。\n“不易察觉的形式”、“不知不觉受到影响”、“宣传策略”。\n第二步：逐一分析选项。\nA项：在电视剧中使用同一品牌手机，用该品牌经典铃声符合“不易察觉的形式”，“不知不觉受到影响”，也是“宣传策略”，符合定义，当选；\nB项：印有城运会会徽，不符合“不易察觉的形式”，不符合定义，排除；\nC项：馆标设计受到评委关注，不属于“宣传策略”，不符合定义，排除；\nD项：小李提醒丈夫结婚纪念日，把丈夫手机屏保换成婚纱照，符合“不易察觉的形式”，但不属于“宣传策略”，不符合定义，排除。\n故正确答案为A。","no":106,"missingImage":false},{"qid":"2367964","cat":"定义判断","stem":"逆城镇化：指由于工作、生活、环境等原因，城市居民主动从城区流向郊区或农村生活的现象。\n下列属于逆城镇化的是：","options":{"A":"市民李先生在市中心工作生活多年，去年跳槽到郊区一家企业，并在单位附近买了一套房，感觉工作生活十分方便","B":"随着业务量扩大，某物流企业的库房不能满足业务需要，在城里另租场地成本太高，公司在租金较低的农村租用了一处大型库房","C":"近年来，因为城里交通拥堵，压力太大，不少城市白领纷纷到周边乡村度假，享受田园生活的乐趣","D":"由于编制体制调整，林女士的丈夫从大城市换防到千里之外的戈壁滩，为了支持丈夫工作，林女士打算带着儿子到新的驻地附近安家"},"answer":"A","explanation":"第一步：找出定义关键词。\n“由于工作、生活、环境等原因”、“城市居民”、“主动”、“从城区流向郊区或农村生活”。\n第二步：逐一分析选项。\nA项：市民李先生符合“城市居民”，跳槽到郊区一家企业并在单位附近买房符合“由于工作、生活、环境等原因”、“从城区流向郊区或农村生活”，跳槽是一种个人选择，符合“主动”，符合定义，当选；\nB项：某物流企业因业务需要在租金较低的农村租用了一处大型库房是商业行为，不属于生活，不符合“城市居民”，“主动从城区流向郊区或农村生活”，不符合定义，排除；\nC项：到周边乡村度假，享受生活乐趣不是去乡村生活，不符合“主动从城区流向郊区或农村生活”，不符合定义，排除；\nD项：从大城市换防到千里之外的戈壁滩，林女士打算带着儿子到新的驻地附近安家，符合“由于工作、生活、环境等原因”、“从城区流向郊区或农村生活”，但丈夫是由于编制调整去到戈壁滩，不符合“主动”，不符合定义，排除。\n故正确答案为A。","no":107,"missingImage":false},{"qid":"2367965","cat":"定义判断","stem":"剧场效应：指由于个体成员追求自身利益最大化，引发其他成员效仿而导致集体秩序失衡，整体利益受损的现象。\n下列属于剧场效应的是：","options":{"A":"小明参加了一个高价辅导班，小芳的家长知道后，给她报了一个更贵的，他们觉得如果不上，小芳的成绩就可能比不上小明了","B":"电商平台在小长假推出了五花八门的促销方式，其中的个别商家玩起了先提价、后打折的把戏，严重影响了平台的整体信誉","C":"近年来汽车销售大战愈演愈烈，几大厂商最初是在电视台、报纸打广告，后来演变成高价请明星代言，成本投入越来越高，利润却越来越低","D":"考虑到仙霞路上有大型活动，小王选择了平时不大走的春光路上班，没想到由于大家不约而同地走这条路，导致春光路严重堵塞，仙霞路反而畅通无阻"},"answer":"C","explanation":"第一步：找出定义关键词。\n“由于个体成员追求自身利益最大化，引发其他成员效仿”、“导致集体秩序失衡，整体利益受损的现象”。\n第二步：逐一分析选项。\nA项：小明参加高价辅导班，小芳的家长给小芳报了一个更贵的，没有体现“导致集体秩序失衡，整体利益受损的现象”，不符合定义，排除；\nB项：电商平台推出促销方式，个别商家先提价、后打折，未体现出引起其他成员的效仿；结果是严重影响了平台的整体信誉，虽然最终结果是负面的，但是“信誉受损”不等同于“集体秩序失衡，整体利益受损”，不符合定义，排除；\nC项：汽车销售大战越演越烈，几大厂家从最初的打广告，演变成高价请明星代言，虽未体现出引起其他成员效仿，但是恶化演变的最终结果是“利润却越来越低”，体现出“导致集体秩序失衡，整体利益受损”，符合定义，当选；\nD项：仙霞路上有大型活动，每个人都选择了一条自认为畅通的道路，结果仙霞路反而畅通无阻，每个人不约而同的走这条路，不符合“引发其他成员效仿”，不符合定义，排除。\n故正确答案为C。","no":108,"missingImage":false},{"qid":"2367838","cat":"定义判断","stem":"差异化竞争：指同一行业的多家企业在短期的激烈竞争中，采用灵活多变的个性化手段，树立良好企业形象，赢得市场的经营方式。\n下列属于差异化竞争的是：","options":{"A":"春节期间，几大网络短视频平台纷纷推出抢红包活动，你发五亿，他发八亿，竞争到了白热化的程度","B":"在其他房地产开发商纷纷降价促销的状况下，某楼盘提升楼盘品质，引进名校资源，销量遥遥领先于同期其他楼盘","C":"每到逢年过节的时候，市区的几家大型电器商场都会推出赠送小家电、延长保修期等优惠活动，市民们往往等到这时集中采购","D":"在实体书店普遍不景气的大环境下，位于繁华街区的某书店一直保持自身的市场定位，致力于销售高品位的专业图书，成为了当地的文化地标"},"answer":"B","explanation":"第一步：找出定义关键词。\n“同一行业企业”、“短期竞争”、“个性化手段”、“赢得市场”。\n第二步：逐一分析选项。\nA项：春节期间短视频平台符合“同一行业企业”、“短期竞争”，但是纷纷推出抢红包活动没有体现“个性化手段”，不符合定义，排除；\nB项：房地产开发商符合“同一行业企业”，其他房地产开发商降价促销，某楼盘提升楼盘品质，引进名校资源销量高于其他楼盘，符合“个性化手段”、“赢得市场”，符合定义，当选；\nC项：几家大型电器商场符合“同一行业企业”，过年期间符合“短期竞争”，赠送小家电、延长保修期等优惠活动没有体现出“个性化手段”，不符合定义，排除；\nD项：某书店定位销售高品位的专业图书符合“个性化手段”，实体书店普遍不景气的大环境说明是长期状态且没有体现竞争，不符合“短期竞争”，不符合定义，排除。\n故正确答案为B。","no":109,"missingImage":false},{"qid":"2367823","cat":"定义判断","stem":"大数据“杀熟”：指商家在提供相同的商品或服务时，根据大数据的甄别结果，对有多次消费记录或消费能力较高的客户，以偏高标准收费的销售策略。\n下列属于大数据“杀熟”的是：","options":{"A":"小李负责单位的接待工作，经常要预约商务车接送。后来只要他打车，网约平台就直接推送高价的商务车，无奈之下小李只好注册一个新号供自己日常出行","B":"经常在网上预订酒店的老张在预订某酒店的单人间时，价格一直为380元。他的侄子暑假来看望他，也在网上预定了该酒店同样的房间，价格却便宜四分之一","C":"位于市中心金融服务区的某超市由于环境优越，客户购买力强，某品牌饮料在这里售价高达15元，而这种饮料在居民小区便利店只需要10元","D":"某购物网站推出新用户推广活动，每位新注册用户都可免费获赠抵用券，算下来买同样的商品新会员比老会员还要便宜好多，这让老会员们郁闷不已"},"answer":"B","explanation":"第一步：找出定义关键词。\n“相同的产品或服务”、“大数据甄别结果”、“多次消费记录或消费能力较高的顾客”、“偏高标准收费”。\n第二步：逐一分析选项。\nA项：小李经常预约商务车，符合“多次消费记录或消费能力较高的顾客”，但单位的接送服务和日常的出行服务不属于“相同的产品或服务”，也未体现对相同的产品有偏高的收费，不符合“偏高标准收费”，不符合定义，排除；\nB项：老张经常在网上预订酒店符合“多次消费记录或消费能力较高的顾客”，在网上预订符合“大数据”，侄子预订该酒店同样的房间符合“相同的产品或服务”，老张380元，侄子价格便宜了四分之一符合“偏高标准收费”，符合定义，当选；\nC项：金融服务区同品牌饮料比居民小区便利店高，符合“相同的产品或服务”、“偏高标准收费”，但不符合“大数据甄别结果”，不符合定义，排除；\nD项：新用户买同样商品比老用户便宜符合“相同的产品或服务”，但不属于针对“多次消费记录或消费能力较高的顾客”，是因为为了推广而赠送抵用券所以便宜，不符合定义，排除。\n故正确答案为B。","no":110,"missingImage":false},{"qid":"2367826","cat":"定义判断","stem":"语码转换：指说话人在同一对话过程中使用多种语言或方言进行交流的现象。\n下列不属于语码转换的是：","options":{"A":"约翰先生在中国生活多年，与单位同事交谈时总是坚持用汉语，有时实在不知道怎样准确表达自己的意思，也会夹杂三两个英语单词","B":"马经理接待来访客户，用普通话向他们介绍了自己公司的情况。得知客户中有两位陕西老乡后，当即操起陕西话与他们攀谈了几句","C":"在一次国际学术会议上，陈教授用英语作报告时带了一股浓浓的四川口音，参加会议的大多数外国学者几乎都没有听懂他的发言","D":"来到留学生宿舍后，班主任方老师询问了他们的日常生活情况，当他发现一个学生流露出不解的神情时，立刻又用英语解释了一番"},"answer":"C","explanation":"第一步：找出定义关键词。\n“同一对话过程”、“多种语言或方言”。\n第二步：逐一分析选项。\nA项：约翰和同事交谈坚持用汉语，夹杂两三个英语单词，符合“同一对话过程”，英语和汉语两种语言符合“多种语言或方言”，符合定义，排除；\nB项：马经理接待客户符合“同一对话过程”，普通话、陕西话符合“多种语言或方言”，符合定义，排除；\nC项：陈教授作报告符合“同一对话过程”，四川口音的英语只有英语一种语言，不符合“多种语言或方言”，不符合定义，当选；\nD项：方老师询问学生日常生活符合“同一对话过程”、用英语解释表明之前说的不是英语，符合“多种语言或方言”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":111,"missingImage":false},{"qid":"2367806","cat":"定义判断","stem":"危机公关：指政府部门、社会团体或企业面对可能造成严重后果的突发事件时，有组织、有计划地采取各种应对措施，避免损害或者降低损害程度，以期获得公众谅解的管理活动。\n下列不属于危机公关的是：","options":{"A":"某公司生产的多批次药品标注虚假生产日期的消息曝光后，公司领导立即在报纸、电视台向全国公众道歉，宣布召回这些批次的产品，承诺通过合适渠道赔偿受害者，迅速查清并如实公布事件真相，请社会各界人士监督","B":"某地曝出高考答题卡被掉包的传闻后，当地政府部门迅速成立联合调查组，网上公布高考命题、监考、阅卷等环节的操作规范，并及时发布调查进展情况，公众情绪逐渐平复，最终查明这一传闻完全是谣言","C":"“某品牌火腿肠使用过期猪肉”的消息在网络上蔓延，公司迅速查实后道歉、召回、赔偿，并制定了详细整改措施，承诺绝不会再出现此类事件，媒体和消费者慢慢平静下来","D":"某商场管理层吸取毗邻商场因电路老化引起火灾、损失惨重的教训，定期组织专业人员加强对线路安全的检查，及时更换老旧电线，并且张贴《规范用电须知》提醒商家，商家都非常配合，防火意识显著增强"},"answer":"D","explanation":"第一步：找出定义关键词。\n“政府部门、社会团体或企业面对可能造成严重后果的突发事件时”、“有组织、有计划地采取各种应对措施，避免损害或者降低损害程度”、“以期获得公众谅解”。\n第二步：逐一分析选项。\nA项：某公司生产的多批次药品标注虚假生产日期的消息曝光后，符合“企业面对可能造成严重后果的突发事件时”，立即在报纸、电视台道歉，宣布召回产品，承诺赔偿受害者等，符合“有组织、有计划地采取各种应对措施，避免损害或者降低损害程度，以期获得公众谅解”，符合定义，排除；\nB项：某地曝出高考答题卡被掉包的传闻后，符合“面对可能造成严重后果的突发事件时”，迅速成立联合调查组，网上公布操作规范，及时发布调查进展情况，查明这一传闻是谣言，符合“有组织、有计划地采取各种应对措施，避免损害或者降低损害程度，以期获得公众谅解”，符合定义，排除；\nC项：“某品牌火腿肠使用过期猪肉”的消息在网络上蔓延，符合“面对可能造成严重后果的突发事件时”，迅速查实后道歉、召回、赔偿，并制定整改措施，符合“有组织、有计划地采取各种应对措施，避免损害或者降低损害程度，以期获得公众谅解”，符合定义，排除；\nD项：某商场管理层吸取毗邻商场因电路老化引起火灾、损失惨重的教训，未体现“面对可能造成严重后果的突发事件时”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":112,"missingImage":false},{"qid":"2367839","cat":"定义判断","stem":"互联网公益：指民间团体或企业通过网络平台，发动社会公众参与的具有门槛低、透明度高、互动性强等特点的公益活动。\n下列属于互联网公益的是：","options":{"A":"某公司每年拨出专款开展公益活动，在官网上征集白内障患者并向符合特定条件的患者提供全部医疗费用","B":"得知老张遭遇车祸，他的老同学通过班级群、朋友圈很快募集了三万多元捐款全部转交到他家","C":"某爱心服务站每年开学前在自己的主页上公布来自各界的网络捐款 位车、2号位士、3号位马、4号位炮、5号位象、6号位兵，即 \u003cimg data-k=\"26866492186c\" style=\"max-width:226px\">。\n故正确答案为A。","no":114,"missingImage":false}]}],"count":50,"answerable":50,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2018年国家统计局组织开展了第二次全国时间利用的随机抽样调查，共调查48580人。结果显示，受访居民在一天的活动中，有酬劳动平均用时4小时24分钟。其中，男性5小时15分钟，女性3小时35分钟；城镇居民3小时59分钟，农村居民5小时1分钟；工作日4小时50分钟，休息日3小时19分钟。受访居民有酬劳动的参与率为\u003cimg data-k=\"74cf63505124\">\u003cimg data-k=\"86981204eabb\">，其中城镇居民\u003cimg data-k=\"fc7875dd7ffb\">\u003cimg data-k=\"86981204eabb\">。受访居民无酬劳动平均用时2小时42分钟。其中，女性3小时48分钟；农村居民2小时39分钟；工作日2小时34分钟。受访居民无酬劳动的参与率为\u003cimg data-k=\"323c08e9e514\">\u003cimg data-k=\"86981204eabb\">，其中男性\u003cimg data-k=\"383475ac1b71\">\u003cimg data-k=\"86981204eabb\">。\u003c/p>\u003cp>        无酬劳动包括家务劳动、陪伴照料孩子生活、护送辅导孩子学习、陪伴照料成年家人、购买商品或服务、看病就医和公益活动。受访居民家务劳动平均用时1小时26分钟，参与率为\u003cimg data-k=\"656d7f5d611b\">\u003cimg data-k=\"86981204eabb\">。其中，女性2小时6分钟，参与率\u003cimg data-k=\"305208014806\">\u003cimg data-k=\"86981204eabb\">。受访居民陪伴照料孩子生活平均用时36分钟，参与率为\u003cimg data-k=\"f09bdeff5846\">\u003cimg data-k=\"86981204eabb\">；护送辅导孩子学习平均用时9分钟，参与率为\u003cimg data-k=\"d9776f5f08f9\">\u003cimg data-k=\"86981204eabb\">；陪伴照料成年家人平均用时8分钟，参与率为\u003cimg data-k=\"5575e6e1bee5\">\u003cimg data-k=\"86981204eabb\">；看病就医平均用时4分钟，参与率为\u003cimg data-k=\"5c03a8d58cbc\">\u003cimg data-k=\"86981204eabb\">；公益活动平均用时3分钟，参与率为\u003cimg data-k=\"9598220710e3\">\u003cimg data-k=\"86981204eabb\">。\u003c/p>","questions":[{"qid":"2368023","cat":"平均数","stem":"受访农村居民每日无酬劳动平均用时占其劳动平均用时的比重为","options":{"A":"\u003cimg data-k=\"ba3120be6c61\">","B":"\u003cimg data-k=\"1722ea3d957e\">","C":"\u003cimg data-k=\"ba3c5cd2c489\">","D":"\u003cimg data-k=\"bdd6fb011431\">"},"answer":"B","explanation":"“居民在一天的活动中，有酬劳动······农村居民5小时1分钟；无酬劳动······农村居民2小时39分钟”，统一单位为分钟，则受访农村居民在一天的活动中，有酬劳动301分钟；无酬劳动159分钟，故受访农村居民每日无酬劳动平均用时占其劳动平均用时的比重\u003cimg data-k=\"c5594c8ce5b4\">\u003cimg data-k=\"061b8f290d3c\">\u003cimg data-k=\"185d2be381f3\">\u003cimg data-
