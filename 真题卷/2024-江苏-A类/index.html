<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2024-江苏-A类","title":"2024年江苏省公务员录用考试《行测》题（A类）（网友回忆版）","year":"2024","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"13628288","cat":"时事政治","stem":"党的二十大报告指出，中国式现代化既有各国现代化的共同特征，更有基于自己国情的中国特色。关于中国式现代化的内涵和意义，下列表述正确的是：\n①有与世界各国现代化相同的任务\n②是人类历史上难度最大的现代化\n③是独立自主、和平发展的现代化\n④创造了一种全新的人类文明形态","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"本题考查政治常识。\n①错误，②正确，习近平总书记在《中国式现代化是强国建设、民族复兴的康庄大道》的文章中指出：“第一，人口规模巨大的现代化。这是中国式现代化的显著特征。人口规模不同，现代化的任务就不同，其艰巨性、复杂性就不同，发展途径和推进方式也必然具有自己的特点。现在，全球进入现代化的国家也就20多个，总人口10亿左右。中国14亿多人口整体迈入现代化，规模超过现有发达国家人口的总和，将极大地改变现代化的世界版图。这是人类历史上规模最大的现代化，也是难度最大的现代化。”\n③正确，习近平总书记在《中国式现代化是强国建设、民族复兴的康庄大道》的文章中指出：“第五，走和平发展道路的现代化。坚持和平发展，在坚定维护世界和平与发展中谋求自身发展，又以自身发展更好维护世界和平与发展，推动构建人类命运共同体，是中国式现代化的突出特征······中国式现代化坚持独立自主、自力更生，依靠全体人民的辛勤劳动和创新创造发展壮大自己，通过激发内生动力与和平利用外部资源相结合的方式来实现国家发展，不以任何形式压迫其他民族、掠夺他国资源财富，而是为广大发展中国家提供力所能及的支持和帮助。”\n④正确，党的二十大报告中“三、新时代新征程中国共产党的使命任务”指出：“中国式现代化的本质要求是：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。”\n故②③④表述正确。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"17900950","cat":"时事政治","stem":"2023年10月18日，习近平主席在第三届“一带一路”国际合作高峰论坛上宣布，中国将采取行动支持高质量共建“一带一路”。关于中国将采取的行动，下列表述正确的有：\n①支持建设开放型世界经济\n②完善“一带一路”国际合作机制\n③构建“一带一路”立体互联互通网络\n④启动“一带一路”科技创新行动计划","options":{"A":"①②③","B":"①②④","C":"②③④","D":"①③④"},"answer":"A","explanation":"本题考查政治常识。\n①②③正确：2023年10月18日，习近平主席在第三届“一带一路”国际合作高峰论坛开幕式上发表了题为《建设开放包容、互联互通、共同发展的世界》的主旨演讲，宣布了中国支持高质量共建“一带一路”的八项行动，包括：构建“一带一路”立体互联互通网络、支持建设开放型世界经济、开展务实合作、促进绿色发展、推动科技创新、支持民间交往、建设廉洁之路、完善“一带一路”国际合作机制。\n④错误：习近平主席在讲话中指出，中方将继续实施“一带一路”科技创新行动计划，举办首届“一带一路”科技交流大会，未来5年把同各方共建的联合实验室扩大到100家，支持各国青年科学家来华短期工作。故“启动‘一带一路’科技创新行动计划”说法错误。\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"13628287","cat":"时事政治","stem":"近期举行的中央金融工作会议提出，要坚定不移走中国特色金融发展之路，加快建设中国特色现代金融体系。关于中国特色现代金融体系的建设要求，下列表述正确的是：\n①要突出政治性、人民性\n②要加快国际金融一体化进程\n③需要更完善的金融监管体系\n④需要打造现代金融机构和市场体系","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"C","explanation":"本题考查政治常识。\n中央金融工作会议于2023年10月30日至31日在北京举行。中共中央总书记、国家主席、中央军委主席习近平出席会议并发表重要讲话。\n①正确，会议强调，当前和今后一个时期，做好金融工作必须坚持和加强党的全面领导，以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大精神，完整、准确、全面贯彻新发展理念，深刻把握金融工作的政治性、人民性，以加快建设金融强国为目标······不断开创新时代金融工作新局面。\n②错误，国际金融一体化是随着国际经济一体化的发展，各国金融市场和各类金融市场之间的界限逐步消失，全球性的多功能的国际金融市场逐步形成的趋势。但此次会议未提及有关国际金融一体化的内容。\n③正确，会议强调，金融是国民经济的血脉，是国家核心竞争力的重要组成部分，要加快建设金融强国，全面加强金融监管，完善金融体制，优化金融服务，防范化解风险，坚定不移走中国特色金融发展之路，推动我国金融高质量发展，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力支撑。\n④正确，会议指出，高质量发展是全面建设社会主义现代化国家的首要任务，金融要为经济社会发展提供高质量服务······要着力打造现代金融机构和市场体系，疏通资金进入实体经济的渠道。\n故①③④正确。\n故正确答案为C。","no":3,"missingImage":false}],"count":3,"answerable":3,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"17900947","cat":"经济常识","stem":"党的二十届二中全会通过的《党和国家机构改革方案》提出，要设立新的党中央决策议事协调机构，组建新的党中央职能部门和办事机构，在重要领域设立新的党中央派出机关。下列新设立或组建的党中央机构与其性质对应正确的是：","options":{"A":"中央金融工作委员会——党中央办事机构","B":"中央社会工作部——党中央派出机关","C":"中央港澳工作办公室——党中央职能部门","D":"中央科技委员会——党中央决策议事协调机构"},"answer":"D","explanation":"本题考查政治常识。\nA项错误：《党和国家机构改革方案》在“一、深化党中央机构改革”部分指出：“（二）组建中央金融工作委员会。统一领导金融系统党的工作，指导金融系统党的政治建设、思想建设、组织建设、作风建设、纪律建设等，作为党中央派出机关，同中央金融委员会办公室合署办公。”故中央金融工作委员会为党中央派出机关。\nB项错误：《党和国家机构改革方案》在“一、深化党中央机构改革”部分指出：“（四）组建中央社会工作部。负责统筹指导人民信访工作，指导人民建议征集工作，统筹推进党建引领基层治理和基层政权建设，统一领导全国性行业协会商会党的工作，协调推动行业协会商会深化改革和转型发展，指导混合所有制企业、非公有制企业和新经济组织、新社会组织、新就业群体党建工作，指导社会工作人才队伍建设等，作为党中央职能部门。”故中央社会工作部为党中央职能部门。\nC项错误：《党和国家机构改革方案》在“一、深化党中央机构改革”部分指出：“（五）组建中央港澳工作办公室。承担在贯彻‘一国两制’方针、落实中央全面管治权、依法治港治澳、维护国家安全、保障民生福祉、支持港澳融入国家发展大局等方面的调查研究、统筹协调、督促落实职责，在国务院港澳事务办公室基础上组建，作为党中央办事机构，保留国务院港澳事务办公室牌子。”故中央港澳工作办公室为党中央办事机构。\nD项正确：《党和国家机构改革方案》在“一、深化党中央机构改革”部分指出：“（三）组建中央科技委员会。加强党中央对科技工作的集中统一领导，统筹推进国家创新体系建设和科技体制改革，研究审议国家科技发展重大战略、重大规划、重大政策，统筹解决科技领域战略性、方向性、全局性重大问题，研究确定国家战略科技任务和重大科研项目，统筹布局国家实验室等战略科技力量，统筹协调军民科技融合发展等，作为党中央决策议事协调机构。”\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"13628291","cat":"经济常识","stem":"2023年是我国自贸试验区建设十周年。十年来，自贸试验区在贸易、投资、金融、航运、人才等方面对接国际通行规则，取得一系列突破性创新成果。下列不属于突破性创新成果的是：","options":{"A":"创设境外金融投资账户，加快推进资本市场国际化","B":"实施外商投资准入前国民待遇加负面清单管理模式","C":"建立以国际贸易“单一窗口”为核心的贸易便利化模式","D":"实施跨境服务贸易负面清单管理，推进服务业综合开放"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，B、C、D三项正确，2023年9月27日，在国新办举行的自贸试验区建设十周年新闻发布会上，商务部副部长盛秋平用“五个率先”概括了十年来自贸区试验区取得的一系列突破性、引领性的创新成果，即：“一是率先实施外商投资准入前国民待遇加负面清单管理模式，推动投资管理体制实现历史性变革。二是率先建立以国际贸易‘单一窗口’为核心的贸易便利化模式，有力支撑贸易强国建设。三是率先以跨境服务贸易负面清单管理模式为代表推进服务业综合开放，推动各类高端要素自由便捷流动。四是率先实施‘证照分离’等政府管理改革，促进营商环境改善和政府职能加速转变。五是率先探索自由贸易账户，金融开放创新稳步推进。”\n本题为选非题，故正确答案为A。","no":5,"missingImage":false},{"type":"question","qid":"17900952","cat":"法律常识","stem":"清末思想家魏源说：“强人之所不能，事必不立；禁人之所必犯，法必不行。”下列西方名句最契合魏源这句话含义的是：","options":{"A":"法律之内，应有天理人情在","B":"立法者通过塑造公民的习惯而使他们变好","C":"无国家强制力之法，犹如不燃烧的火、不发亮的光","D":"只要法律不再有力量，一切合法的东西也都不会再有力量"},"answer":"A","explanation":"本题考查法律常识。\n“强人之所不能，事必不立；禁人之所必犯，法必不行。”这句话的含义是：强迫他人做力不能及的事情，这件事肯定不能成功；以人必定会违背的规定来禁止他人，这样的法令必定不能施行。该句强调尊重实际，顺应人性，方能取得实效。\nA项正确：“法律之内，应有天理人情在”强调的是法理与情理的关系，从法的历史来看，最好的法往往发轫于习惯、民俗、社会道德、公义等“人情细节”，它代表着公理和所有的公民人情。与题干表述的含义一致。\nB项错误：“立法者通过塑造公民的习惯而使他们变好”强调的是法的作用，说明法能够指引人民塑造良好的习惯。题干表述并未体现这一点。\nC项错误：“无国家强制力之法，犹如不燃烧的火、不发亮的光”强调的是国家强制力对法的重要性，说明法由国家强制力保障实施。题干表述并未体现这一点。\nD项错误：“只要法律不再有力量，一切合法的东西也都不会再有力量”强调的是法的地位，说明法律在整个社会调整机制和全部社会规范体系中居于主导地位，一切国家及社会行为均须以法律为依据。题干表述并未体现这一点。\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"13628307","cat":"法律常识","stem":"我国《公务员法》规定，公务员不得从事或者参与营利性活动，在企业或者其他营利性组织中兼任职务。下列情形属于违反规定的是：","options":{"A":"副市长何某兼任市工商业联合会主席","B":"法官赵某开设证券账户并买卖公司股票","C":"警察张某转让继承取得的某有限责任公司股权","D":"税务人员熊某作为小股东出资设立有限责任公司"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，工商业联合会是中国共产党领导的以民营企业和民营经济人士为主体，具有统战性、经济性、民间性有机统一基本特征的人民团体和商会组织，并非营利性组织，何某可以兼任职务。\nB项错误，根据《中共中央办公厅、国务院办公厅关于党政机关工作人员个人证券投资行为若干规定》第三条规定：“党政机关工作人员个人可以买卖股票和证券投资基金······”选项中，赵某可以买卖公司股票。\nC项错误，根据《中华人民共和国民法典》第一百二十四条第一款规定：“自然人依法享有继承权。”选项中，张某作为自然人有权继承股权，其转让股权属于合法行使对该股权的所有权，不属于从事营利性活动。\nD项正确，根据《中华人民共和国民法典》第七十六条规定：“以取得利润并分配给股东等出资人为目的成立的法人，为营利法人。营利法人包括有限责任公司、股份有限公司和其他企业法人等。”选项中，有限责任公司属于营利法人，其目的是取得利润并分配给股东等出资人，熊某作为小股东出资设立有限责任公司属于从事营利性活动。\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"13628318","cat":"人文常识","stem":"保安李某值班时看到马路上王某失控翻车，立即前往救助，途中不慎摔倒而受伤。施救时，李某因方法不当致王某面部受伤。在众人的救助下王某获救。对此，下列说法正确的是：","options":{"A":"李某救助中不慎摔伤，王某应给予其适当的补偿","B":"李某施救时致王某面部受伤，应承担损害赔偿责任","C":"李某的救助效果不佳，无权请求王某承担部分损失","D":"李某的救助属于维护公共利益，其受伤应视同工伤"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，C项错误，根据《中华人民共和国民法典》第一百八十三条规定：“因保护他人民事权益使自己受到损害的，由侵权人承担民事责任，受益人可以给予适当补偿。没有侵权人、侵权人逃逸或者无力承担民事责任，受害人请求补偿的，受益人应当给予适当补偿。”题干中，李某因救助王某不慎摔倒而受伤，王某应给予其适当的补偿，李某不会因为救助效果不佳而丧失请求王某给予适当补偿的权利。\nB项错误，根据《中华人民共和国民法典》第一百八十四条规定：“因自愿实施紧急救助行为造成受助人损害的，救助人不承担民事责任。”题干中，李某属于自愿救助王某，因自愿实施紧急救助行为造成王某面部受伤，李某无需承担损害赔偿责任。\nD项错误，根据《工伤保险条例》第十五条规定：“职工有下列情形之一的，视同工伤：（一）在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的；（二）在抢险救灾等维护国家利益、公共利益活动中受到伤害的；（三）职工原在军队服役，因战、因公负伤致残，已取得革命伤残军人证，到用人单位后旧伤复发的。”题干中，李某并不是在抢险救灾等维护公共利益的活动中受到伤害，不能认定为工伤。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"17900949","cat":"科技常识","stem":"谚语“蜻蜓低飞，天要下雨”，是人类通过观察动物的活动来预报天气所得到的经验总结。这一经验总结所体现的哲理是：","options":{"A":"人类只有通过自己的实践活动才能把握信息","B":"人类的意识或思想活动是信息及其运动的中介","C":"人类通过意识活动把握客观事物运动变化的规律","D":"人类观察动物活动所获得的信息是一种自然信息"},"answer":"C","explanation":"本题考查政治常识。\nA项错误：实践是认识的唯一来源，但认识的途径却包括直接经验和间接经验两种：前者是指由亲身参加变革现实的实践所获得的知识；后者是指从别人或书本那里学习得来的知识。\nB项错误：信息是意识活动借以展开的中介，人类的意识活动能够帮助我们建立起正常的信息机制，在获得、储存和处理信息这三者之间建立起完整的连接链条和意义秩序。\nC项正确：所谓“蜻蜓低飞，天要下雨”，并不是蜻蜓向我们发出了某种特定信息，而是人类意识或思维活动在不同的事件之间建立了联系，使得一种事物或现象的出现，在某种程度上代表了另一种事物或现象的存在，究其本质，是人的意识活动把握了客观事物运动变化的相互联系及其规律的结果。\nD项错误：自然信息是指一切自然物发出的信息，它包括来自无机界和生物界的信息，如：我们观察到的宇宙间星球的运动变化；地球上的各种自然现象；我们欣赏的风景等。社会信息是指反映人类社会运动状态和方式的信息，其来源有两大方面：一是来源于人们对自然信息的观察研究；二是来源于人们构成社会时，社会系统联系沟通的需要，以及反映和交流人们的思想感情及意识形态的需要。人类观察动物活动所获得的信息来源于人们对自然信息的观察研究，属于社会信息。\n故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"17900959","cat":"科技常识","stem":"古往今来，人类逐水而居，文明伴随而生，人类生产生活同湿地有着密切联系。下列关于湿地的说法不正确的是：","options":{"A":"能吸收二氧化碳气体","B":"是哺乳动物种群的栖息地","C":"会排放出甲烷、氨气","D":"具有不可替代的综合功能"},"answer":"C","explanation":"本题考查地理国情。\n湿地被称为地球的“肾”，可分为自然和人工两大类。自然湿地包括沼泽地、泥炭地、湖泊、河流、海滩和盐沼等，人工湿地主要有水稻田、水库、池塘等。\nA项正确：湿地丰富的水分条件适宜植物生长，大部分湿地都有茂盛的植物，它们可以大量吸收空气中的二氧化碳。\nB项正确：湿地为动物提供了丰富的食物来源 ，是哺乳动物、两栖动物、鸟类等的重要栖息地，也是鸟类长途迁徙中的理想落脚地。\nC项错误：由于湿地水体的厌氧环境，且拥有大量微生物，被固定的碳在湿地环境中会通过呼吸作用或微生物的分解作用再次释放到大气中，碳释放以二氧化碳和甲烷为主。（氨气主要来自于化肥施用和家畜蓄养等农业活动，同时也有少量来自交通运输和工业等排放。）\nD项正确：湿地不仅为人类的生产、生活提供多种资源，而且具有巨大的环境功能和效益，在抵御洪水、调节径流、蓄洪防旱、控制污染、调节气候、控制土壤侵蚀、促淤造陆、美化环境等方面有其他系统不可替代的综合功能。\n本题为选非题，故正确答案为C。\n【备注】本题存在瑕疵。C项中，湿地特别是使用氮肥的人工湿地，会释放一定的氨气。","no":10,"missingImage":false},{"type":"question","qid":"17900958","cat":"法律常识","stem":"2023年7月，我国多部门联合公布《生成式人工智能服务管理暂行办法》，对具有文本图片、音频、视频等内容生成能力的模型及相关技术的服务应用加以规范。对此，下列说法正确的是：","options":{"A":"我国将对生成式人工智能应用场景实施统一管理","B":"我国开始重视对内容生成能力这一人工智能关键要素的管理","C":"该办法对生成式人工智能的规范可以解决“网络杀熟”问题","D":"我国对人工智能的运用还处于起步阶段是该办法“暂行”的原因之一"},"answer":"B","explanation":"本题考查政治常识。\n2023年7月，国家网信办联合国家发展改革委、教育部、科技部、工业和信息化部、公安部、广电总局公布《生成式人工智能服务管理暂行办法》（以下简称《办法》）。\nA项错误：《办法》在“第二章 技术发展与治理”部分指出：“鼓励生成式人工智能技术在各行业、各领域的创新应用，生成积极健康、向上向善的优质内容，探索优化应用场景，构建应用生态体系。”由此可见，我国并未对生成式人工智能应用场景实施统一管理。\nB项正确：《办法》作为全球范围内针对生成式人工智能的首部专门立法，以鼓励创新发展为基调，以个人合法权益、公共利益、国家安全为底线，在原则理念和规制范围上统筹发展与安全，不仅是监管生成式人工智能的中国探索，也为全球人工智能治理开辟了新的道路。由此可见，我国开始重视对内容生成能力这一人工智能关键要素的管理。\nC项错误：《中华人民共和国个人信息保护法》第二十四条第一款规定：“个人信息处理者利用个人信息进行自动化决策，应当保证决策的透明度和结果公平、公正，不得对个人在交易价格等交易条件上实行不合理的差别待遇。”由此可知，《中华人民共和国个人信息保护法》的相关规定可以解决“网络杀熟”问题。\nD项错误：近年来，我国人工智能的运用处于蓬勃发展阶段，诸如图像分类、语音识别、知识问答、人机对弈、无人驾驶等人工智能技术实现了从“不能用、不好用”到“可以用”的技术突破，迎来爆发式增长的新高潮。《办法》“暂行”的主要原因是接受实践的检验，发现、修改问题，然后正式颁布。\n故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"17900960","cat":"人文常识","stem":"下图描绘的是被称为“二牛抬杠”的我国传统农业耕作场景，其中最能体现的管理职能是：\n\u003cimg data-k=\"649ce78851ce\" style=\"max-width:500px\">","options":{"A":"激励","B":"控制","C":"计划","D":"组织"},"answer":"D","explanation":"本题考查管理常识。\n“二牛抬杠”是南诏时期的一种特殊耕作方式，也称“二牛三夫”耕作法。耕作时，两牛相距约七八尺，中间横抬一“杠”，“杠”后接续辕犁。一人在前牵牛；一人坐于“杠”上，脚踏辕犁，控制犁铧入土深浅；一人在后扶持犁把。\nA项错误：激励职能是企业管理者用科学的方法调动职工的积极性和创造性，挖掘职工的内在潜力的一系列管理活动。与“二牛抬杠”无关。\nB项错误：控制职能是管理者要对组织的运行状况加以监督，通过控制可发现当初的计划与实际的偏差，采取有利的行动纠正偏差，保证计划的实行，确保原来的目标得以实现。与“二牛抬杠”无关。\nC项错误：计划职能是指管理者预测未来、确定目标、制定实现这些目标的行动方针的过程，它涉及原因与目的、活动与内容、人员安排、时间安排、空间安排以及手段与方法的选择等问题。与“二牛抬杠”无关。\nD项正确：组织职能是指所确定的任务由谁来完成以及如何管理和协调这些任务的过程。“二牛抬杠”中，牛与人均有明确具体的分工，也展现了人管理、协调这些任务的过程，体现了组织职能。\n故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"17900956","cat":"人文常识","stem":"近日，商务部等部门对中华老字号进行复核，将多个存在经营问题甚至丧失商标所有权和使用权的品牌移出中华老字号名录。对此，下列说法不正确的是：","options":{"A":"被移出中华老字号名录的品牌将退出市场","B":"我国对中华老字号采取的是动态管理机制","C":"复核后的中华老字号不得超越原有经营范围","D":"通过复核可以提升中华老字号品牌的竞争力"},"answer":"A","explanation":"本题考查管理常识。\nA项错误：中华老字号是指历史底蕴深厚、文化特色鲜明、工艺技术独特、设计制造精良、产品服务优质、营销渠道高效、社会广泛认同的品牌（字号、商标等），并不等同于经营许可，因此，被移出中华老字号名录的品牌并不意味着就退出市场了，其仍然可以继续经营，只是不能再使用中华老字号标识。\nB项正确：2023年，商务部、文化和旅游部、国家市场监督管理总局、国家文物局、国家知识产权局联合印发了《中华老字号示范创建管理办法》（以下简称《办法》）。《办法》第四条规定：“中华老字号示范创建遵循‘自愿申报、自主创建、优中择优、动态管理’的原则。”\nC项正确：《办法》第二十一条规定：“商务部会同相关部门原则上每3年对中华老字号开展复核。对复核中发现已经不符合中华老字号条件的，商相关部门作出移出中华老字号名录、收回中华老字号标识使用权及牌匾的决定。”复核只审核其是否还符合中华老字号条件，并不会增加其经营范围，且企业经营范围由经营许可决定，复核后企业仍旧应当按照原有经营范围开展生产经营活动。\nD项正确：复核后，管理部门会将存在经营问题甚至丧失商标所有权和使用权的品牌移出中华老字号名录，这种做法有利于倒逼企业合法合规经营，及时改善生产经营过程中存在的问题，从而提升品牌的竞争力。\n本题为选非题，故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"17900957","cat":"人文常识","stem":"在公共场所规范设置包括禁烟标识、室外吸烟点标识及引导标识在内的控烟标识，有利于推进无烟环境建设。关于控烟标识，下列说法正确的是：","options":{"A":"所有公共场所的室内外都应设置控烟标识","B":"控烟标识属于禁止性标识，按标准应使用红色","C":"设置控烟标识要符合人们的行为习惯和平均视高","D":"控烟标识应该有统一的材质、尺寸、形状和内容"},"answer":"C","explanation":"本题考查管理常识。\nA项错误：禁烟场所应当设置禁烟标识；公共场所非禁止吸烟的室外区域，可以设置吸烟区，吸烟点应当张贴明显的引导标识。“所有公共场所的室内外都应设置控烟标识”的说法过于绝对。\nB项错误：控烟标识包括禁烟标识、室外吸烟点标识及引导标识，并不仅仅是禁止性标识。\nC项正确：控烟标识是为了正确引导群众控制吸烟，所以其设置必须符合人们的行为习惯和平均视高，在显著位置张贴，以便吸引进入该场所人员的注意。\nD项错误：各单位可根据自身实际情况，在禁止吸烟标识基本图形基础上制作不同形式的警示标识、提示牌及控烟宣传台卡、桌签等控烟宣传品。\n故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"17900964","cat":"科技常识","stem":"我国“十四五”规划和2035年远景目标中明确提出了“分级分类推进新型智慧城市建设”的目标，这要求城市治理要实现从数据汇集到数据使用。智慧城市建设可由①城市运行中心、②一网通办、③电子政务、④数字化决策四个阶段构成。按照从数据汇集到数据使用的顺序，下列对四个阶段排序正确的是：","options":{"A":"③—②—④—①","B":"③—①—②—④","C":"①—④—③—②","D":"①—④—②—③"},"answer":"A","explanation":"本题考查管理常识。\n智慧城市的本质特征是人类智慧驱动城市发展，一般认为，智慧城市发展需要经历四个阶段：数字化、网络化、智能化、智慧化。\n①城市运行中心即城市运管服平台，以物联网、大数据、人工智能等技术为支撑，实现城市运行管理“一网统管”。其属于智慧城市建设的第四阶段，即万物互联阶段，城市各部分功能在人类智慧的驱使下优化运行，实现城市智慧化，基本建成智慧城市。\n②一网通办即进一张网办全部事，指打通不同部门的信息系统，群众只需操作一个办事系统，就能办成不同领域的事项，解决办不完的手续、盖不完的章、跑不完的路这些“关键小事”。其属于智慧城市建设的第二阶段，即通过互联网将数字化的城市部件传输连接起来，实现网络化。\n③电子政务是指利用信息技术手段，实现政府的组织结构和工作流程的优化重组，提高服务效率和公开性的政务信息化系统。其属于智慧城市建设的第一阶段，即推进数字化，使我们生活的世界可以通过数字表述出来。\n④数字化决策是指决策者需要所有可用的工具，以帮助他们对数据提出正确的问题。决策智能可以帮助领导者获得有意义、可操作的业务见解和建议。随着数据和见解变得越来越重要，帮助做出明智决策并提供预测结果的决策智能将成为数字化转型新趋势。其属于智慧城市建设的第三阶段，即在网络传输的基础上实现局部智能反应与调控。\n故排序正确的为③②④①。\n故正确答案为A。","no":15,"missingImage":false}],"count":12,"answerable":12,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        提示词工程师，一个与人工智能（AI）相关的新职业悄然兴起。其职责是与生成式人工智能进行高质量对话，用设计、管理与优化相关行业的提示词来进行大模型训练，配合技术提升整体产品表现。可以这么理解：人工智能已经开始进入无数具体的行业领域，如同刚入职的“新人”，需要一位行业资深前辈贴身“传帮带”，助其快速适应业务、成为“熟手”。\u003c/p>\u003cp>        这些“传帮带”的师父们，就是AI训练应用场景下的提示词工程师。在国内招聘平台上，这个岗位仍处于动态定义的过程中，未必严谨地以“提示词工程师”的字样出现，可能名为AI训练师，或是AI产品运营，也可能叫作AI“文生图”绘画师，但岗位描述都指向人工智能生成内容训练。毫无疑问，从需求端已经能感受到这一职业的水涨船高。\u003c/p>\u003cp>        初看这个新职业，总有些\u003cu>            \u003c/u>，因为它超出了专业对口的思维方式。说它是与AI技术相关吧，它要求从业者有其他垂直领域的专业性，尤其是法律、宗教、艺术这样的领域；说它是内容生产吧，它的从业者又必须高度理解AI逻辑，有产品经理思维打底。它非文非理、非农非工，既跨界又难以充分量化，要求的是一种人文与技术的综合性，以及一种高度开放的思维、技术伴随式学习能力。\u003c/p>\u003cp>        有论者分析，这个职业可能是暂时的，因为它适配的是大语言模型进入具体应用场景的阶段。但其实，这个职业本身也正处于生成之中，谁又能定论没有新的发育可能呢？其所内含的职业精神本就指向人文精神与人工智能的动态调适。当AI快速进入人类生存的各个层面、各个细分领域，这种调适每个人都要经历，并指向了两个相辅相成的方面——既包含我们对AI的适应（使用、伴随学习、合作创造），也包括我们对AI的规训（日常训练、伦理制约）。未来，\u003cu>这就是一个人的社会化的基本内容\u003c/u>，而“提示词工程师”则会成为每个现代人的一个侧面。\u003c/p>\u003cp>        值得注意的是，对于我们怎么找工作、怎么看待工作，“提示词工程师”兴起还带来了另外一个重要的信号：未来，最容易被替代的工作是那些易于标准化的职业、易于模式化的流程，不容易被替代的则是那些具有“人”的综合性特征的职业。后者，可能是独特的艺术家、具有原创性的创作者、技术人文复合型人才，也可能是插花师、护士、电工这样具有人的“具身性”的职业。换句话说，在AI的吞噬中稍稍保持的竞争性，要么来自一个确实高度复杂的思维，要么来自一个可以面对面的肉身。\u003c/p>\u003cp>        风吹云走，这样的职业分化已经近在眼前。此刻看似能“上岸”的职业、此刻被争抢的“饭碗”，是否有想象中那么稳定？可能还需选择者长思。\u003c/p>","questions":[{"qid":"13628198","cat":"逻辑填空","stem":"填入文章第三自然段画横线处最恰当的一项是：","options":{"A":"光彩耀目","B":"莫可名状","C":"不堪言状","D":"不知所以"},"answer":"B","explanation":"根据“初看这个新职业······说它是与AI技术相关吧，它要求······法律、宗教、艺术这样的领域；说它是内容生产吧，它······有产品经理思维打底”及“它非文非理、非农非工，既跨界又难以充分量化”可知，横线处所填成语应体现新职业涉及专业较多，比较复杂，难以描述之意。B项“莫可名状”指事物极复杂微妙，无法描述，符合文意，当选。A项“光彩耀目”指光采鲜明，视之耀眼，文段并非强调新职业光彩耀眼，与文意不符，排除；C项“不堪言状”指无法用语言来形容，形容某种情况极其严重或恶劣，常用于贬义，与文段感情色彩不符，排除；D项“不知所以”指不知道事情发生的原因，文段并未讨论新职业产生的原因，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《透过泡沫，看看那些不容易被替代的职业》","no":16,"missingImage":false},{"qid":"13628200","cat":"语句表达","stem":"文章第四自然段画横线句子中的“这”指的是：","options":{"A":"人类对AI的适应和规训","B":"每个人对社会的适应过程","C":"人文精神与AI动态调适","D":"提示词工程师适配的对象"},"answer":"A","explanation":"定位文章第四段结尾，首先根据画横线句子“这就是一个人的社会化的基本内容”可知，“这”指代的内容应属于人的社会化的基本内容，结合指代词之前的内容进行分析，前文先指出提示词工程师所内含的职业精神指向人文精神与人工智能的动态调适，随后指出这种调适指向两个相辅相成的方面，即人类对AI的适应和规训，故画横线句子中的“这”指的是人类对AI的适应和规训，对应A项。\nB项，“每个人对社会的适应过程”范围扩大，文段强调的是人类与“AI”之间的关系，排除；\nC项，“动态调适”属于提示词工程师的职业精神，并非人的社会化的基本内容，排除；\nD项，“提示词工程师适配的对象”文段并未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】光明网《透过泡沫，看看那些不容易被替代的职业》","no":17,"missingImage":false},{"qid":"13628202","cat":"片段阅读","stem":"关于提示词工程师，下列说法与文意不符的是：","options":{"A":"与之相关的岗位尚处于动态定义的过程之中","B":"是近期兴起的一个与人工智能相关的新职业","C":"是一个暂时存在但又较容易被替换掉的职业","D":"从业者需要具备创新思维和较高的学习能力"},"answer":"C","explanation":"A项，根据第二段“······提示词工程师。在国内招聘平台上，这个岗位仍处于动态定义的过程中”可知，“相关的岗位尚处于动态定义的过程之中”符合文意，排除；\nB项，根据第一段“提示词工程师，一个与人工智能（AI）相关的新职业悄然兴起”可知，该职业是近期兴起的新职业，且与人工智能相关，符合文意，排除；\nC项，根据第四段“有论者分析，这个职业可能是暂时的······这个职业本身也正处于生成之中，谁又能定论没有新的发育可能呢”可知，该职业并不一定是暂时的、易被替换的，表述过于绝对，与文意不符，当选；\nD项，根据第三段“它非文非理、非农非工······以及一种高度开放的思维、技术伴随式学习能力”可知，从业者是需要具备创新思维及较高学习能力的，符合文意，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明网《透过泡沫，看看那些不容易被替代的职业》","no":18,"missingImage":false},{"qid":"13628205","cat":"片段阅读","stem":"根据文意，下列职业在未来最有可能被AI替代的是：","options":{"A":"非遗传承人","B":"美发师","C":"幼儿保育员","D":"播音员"},"answer":"D","explanation":"根据文章第五段“未来，最容易被替代的工作是那些易于标准化的职业、易于模式化的流程······在AI的吞噬中稍稍保持的竞争性，要么来自一个确实高度复杂的思维，要么来自一个可以面对面的肉身”可知，易于标准化、模式化的职业容易被替代，而拥有高度复杂的思维或需要面对面服务的职业则不容易被替代。\nA项，“非遗传承人”符合“拥有高度复杂的思维”的特性，且非遗大部分只能依靠活态传承，不容易被替代，排除；\nB项，“美发师”符合“面对面服务”的特性，不容易被替代，排除；\nC项，“幼儿保育员”符合“面对面服务”的特性，不容易被替代，排除；\nD项，“播音员”符合“易于标准化、模式化”的特性，最可能被替代，当选。\n故正确答案为D。\n【文段出处】光明网《透过泡沫，看看那些不容易被替代的职业》","no":19,"missingImage":false},{"qid":"13628207","cat":"片段阅读","stem":"这篇文章的主要意图是：","options":{"A":"告知读者提示词工程师这一职业悄然兴起的原因","B":"引导读者透过提示词工程师对职业选择进行思考","C":"说明现在的热门职业未来不一定具有良好的前景","D":"介绍提示词工程师所具有的职业特征与市场需求"},"answer":"B","explanation":"文章第一段引出提示词工程师这一职业，并说明这一职业产生的原因，文段第二段说明提示词工程师的定义，第三段说明提示词工程师的特征，第四段指出提示词工程师尚在生成，有新发育的可能，未来会成为每个现代人的一个侧面，第五段通过“值得注意的是”、第六段通过“需”引出文段对策，即需要对职业选择进行思考，故文段主要通过对提示词工程师的讨论，说明我们在职业选择的时候应进行长远思考，对应B项。\nA项，仅对应第一段“人工智能已经开始进入无数具体的行业领域······助其快速适应业务、成为‘熟手’”，非重点，排除；\nC项，仅对应第六段“此刻看似能‘上岸’的职业、此刻被争的‘饭碗’，是否有想象中那么稳定？”问题表述部分，非重点，文章强调选择职业时需要谨慎思考，且缺少文段核心话题“提示词工程师”，排除；\nD项，“职业特征与市场需求”对应第二段和第三段内容，非重点，排除。\n故正确答案为B。\n【文段出处】光明网《透过泡沫，看看那些不容易被替代的职业》","no":20,"missingImage":false},{"qid":"5919286","cat":"片段阅读","stem":"改革开放以来，中国经济发展取得了举世瞩目的成就，但在加速工业化和城镇化过程中消耗了大量能源、水、土地、矿产等资源。“高投入、高消耗、低产出”的粗放发展方式未得到彻底扭转，高质量发展面临的资源约束长期偏紧。党的十八大以来，我国部署实施全面节约战略，大幅降低能源、水、土地利用强度。大力发展循环经济，推动资源节约集约高效利用，取得积极成效。进入新发展阶段，实现高质量发展、推动产业转型升级、更好满足美好生活需要，都对资源节约和高效利用提出了更高要求。\n这段文字意在强调：","options":{"A":"高质量发展以资源大量消耗作为代价","B":"我国资源消耗总量曾经长期居高不下","C":"经济发展与资源的开发利用息息相关","D":"新发展阶段需科学配置高效利用资源"},"answer":"D","explanation":"文段首先指出改革开放以来中国经济发展取得的成就，接着通过转折词“但”指出在发展过程中存在资源消耗过大、发展方式粗放以及资源约束长期偏紧等问题，接着指出党的十八大以来我国通过一系列做法在资源节约方面取得了积极成效，进入了新发展阶段，最后尾句通过“提出了更高要求”提出对策，强调新发展阶段需要更好地节约及高效利用资源，对应D项。\nA、B两项，“以资源大量消耗作为代价”和“资源消耗总量曾经长期居高不下”均对应文段提出问题部分的内容，非重点，排除；\nC项，“息息相关”偏离文段中心，文段重点强调新发展阶段提出的更高要求，并非强调关联性，排除。\n故正确答案为D。\n【文段出处】人民日报《科学配置促进资源节约和高效利用（新论）》","no":21,"missingImage":false},{"qid":"17900902","cat":"片段阅读","stem":"当古籍遇上高科技，人们可以从一个特别的角度触摸到中华优秀传统文化细腻的肌理。文明与技艺相生相伴，中国古代的印刷术对书籍制作和知识传播产生了深远的影响，深刻改变了世界文明发展的进程。当我们通过VR技术沉浸式体验古人制作书籍的过程时，当我们借助数字博物馆点开一本古籍时，源远流长的传统文化不仅是可知的，更是可感的。随着科技的发展，传统文化传播的方式也获得了新拓展。\n这段文字意在说明：","options":{"A":"技术推动了文明的发展与知识传播","B":"高科技正在改变人们对古籍的认识","C":"借助科技手段能更好传播传统文化","D":"应以高科技守护中华优秀传统文化"},"answer":"C","explanation":"文段开篇引出话题，即在高科技的帮助下，人们可以通过古籍感受中华优秀传统文化。随后用“中国古代的印刷术”及“VR技术”举例，论证以古籍作为媒介，通过科技可以更好地传播和感受传统文化。最后点明观点，即科技发展可以拓展传统文化传播的方式。故文段重点强调借助科技手段能更好地传播传统文化，对应C项。\nA项：“技术推动了文明的发展与知识传播”对应举例论证部分，非重点，排除。\nB项：文段并未提及人们对古籍本身的认识和想法，“改变人们对古籍的认识”无中生有，排除。\nD项：“守护中华优秀传统文化”文段并未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】《当古籍遇上高科技》","no":22,"missingImage":false},{"qid":"17900912","cat":"片段阅读","stem":"近年来，“个人碳账户”逐渐走进人们的日常生活。打开手机应用软件，骑行、购买节能产品、不选一次性餐具等都可折算成“减排量”，在个人账户里一目了然。登录“碳普惠”“碳积分”“碳宝包”等小程序，低碳行动就可转换为减碳积分，积分还能进行绿色消费。这些包含个人碳排放场景应用、数据采集核算、积分跨界兑换等功能在内的碳减排支持体系，就属于“个人碳账户”。它简便又直观，能够帮助普通人算清“碳账”。\n根据文意，建立“个人碳账户”的主要意义在于：","options":{"A":"引导人们在日常生活中采取低碳行动","B":"通过个人“碳账”管理推动绿色消费","C":"可利用信息技术完善碳减排系统建设","D":"有助于更好地采集个人碳排放数据"},"answer":"B","explanation":"文段开篇引出“个人碳账户”的话题，并介绍低碳行为的“减排量”在“个人碳账户”可以一目了然，接着介绍在一些小程序中低碳行动能带来的好处，后文指出这些碳减排支持体系就属于“个人碳账户”，最后通过指代词“它”进行总结，强调“个人碳账户”简便直观，能够帮助人们算清“碳账”。故文段为“分—总”结构，重点强调“个人碳账户”简便直观，能帮助人们算清绿色消费相关的“碳账”，更好地推动绿色消费，对应B项。\nA项：文段重点论述“碳账”对于“消费”的作用，“采取低碳行动”不及B项“绿色消费”与文段对应准确，排除。\nC项：“完善碳减排系统建设”偏离文段重点，文段重点论述帮助人们算清“碳账”，推动绿色消费，排除。\nD项：“采集个人碳排放数据”仅对应“数据采集核算”，表述片面，文段还介绍了“积分跨界兑换”等，排除。\n故正确答案为B。\n【文段出处】《“个人碳账户”还应更多些》","no":23,"missingImage":false},{"qid":"17900923","cat":"片段阅读","stem":"我们常说，雨水会将空气中的污染物、颗粒物冲刷下来，变成近似污水的“初期雨水”。其实，只有降雨达到天气预报所说的“中雨”，才有这种效果。如果只是微微细雨，不足以将颗粒物沉降。空气湿度增大，颗粒物尤其细颗粒物的吸湿性会增长，就是说PM2.5遇到湿气会膨胀，导致浓度不降反升。即使在强降雨时，前两个小时PM2.5浓度也有可能出现不降反升的情况。另外，湿度大的时候，近地面大气一般比较稳定，扩散能力弱，许多污染物易溶于水并发生化学反应，产生新的污染物，导致空气更浑浊。\n最适合做这段文字标题的是：","options":{"A":"雨后的空气质量","B":"当PM2.5遇到雨水","C":"雨后空气就会清新吗","D":"为何雨后空气质量会变差"},"answer":"C","explanation":"文段开篇指出雨水会将空气中的污染物、颗粒物冲刷下来，变成近似污水的“初期雨水”，即雨后空气质量会变好。随后通过转折词“其实”引出重点，即只有降雨达到天气预报所说的“中雨”，才会将空气中的污染物、颗粒物冲刷下来，空气质量才会变好。后文通过由“另外”构成的并列结构分别论述“‘微微细雨’和‘强降雨’的情况下PM2.5浓度会上升”以及“湿度大的时候空气会更浑浊”，对前文观点进行解释说明。故文段重点在转折之后，即只有降雨达到天气预报所说的“中雨”时，才会将空气中的污染物、颗粒物冲刷下来，空气才会变好，而非下雨后空气就会变好，对应C项。\nA项：“雨后的空气质量”偏离文段核心话题，文段意在强调只有降雨达到天气预报所说的“中雨”时，空气质量才会变好，而非介绍雨后的空气质量如何，排除；\nB项：“PM2.5”对应后文解释说明部分的内容，非重点，排除；\nD项：“雨后空气质量会变差”偏离文段核心话题，文段意在强调只有降雨达到天气预报所说的“中雨”时，空气质量才会变好，而非介绍“为何雨后空气质量会变差”，且雨后空气质量变差的原因对应后文解释说明部分的内容，非重点，排除。\n故正确答案为C。","no":24,"missingImage":false},{"qid":"17900951","cat":"片段阅读","stem":"通过“线下生产+线上数据分析”模式，传统产业能够在规模化生产之外，探索开展个性化定制服务。比如，先生产小批量产品投放市场，再通过数据分析细分需求决定是否扩大生产。这种“轻资产、快反应”的柔性供应链模式，增加了产品研发、制造和流通的弹性，能帮助解决传统供应链模式下机会成本高、运转周期长等问题。这样的生产变革，能够通过精细化运营实现供需精准匹配，是一种更加适合中小企业数字化转型的模式，能让中小企业以“小单快返”的新模式轻装上阵，形成独特的竞争优势。\n这段文字意在说明：","options":{"A":"传统产业需借助数据分析突破固有局限","B":"数字赋能可助力中小企业提升竞争优势","C":"供需的动态平衡是中小企业发展的关键","D":"企业的数字化转型重在构建柔性供应链"},"answer":"B","explanation":"文段开篇介绍传统产业可以通过“线下生产+线上数据分析”模式探索开展个性化定制服务，随后通过“比如”进行举例说明，介绍“轻资产、快反应”的柔性供应链模式可以解决传统供应链模式下的一系列问题，最后通过指代词“这样”总结前文，强调数字化可以帮助中小企业形成竞争优势，对应B项。\nA项：“借助数据分析突破固有局限”对应举例的内容，非重点，排除。\nC项：缺少文段主题词“数字化”，排除。\nD项：“柔性供应链”对应举例的内容，非重点，且“企业”范围扩大，文段强调“中小企业”，排除。\n故正确答案为B。\n【文段出处】《促进数字技术和实体经济深度融合（人民时评）》","no":25,"missingImage":false},{"qid":"17900726","cat":"片段阅读","stem":"与射电望远镜相比，大型光学望远镜对环境的要求更加苛刻，比如晴夜数、天光背景亮度、视宁度等，所以优质的光学观测台址是稀缺资源。此前国际优质的大型光学望远镜几乎都集中在西半球。而我国青海省冷湖台址区域每年可观测时间达300天，可沉降水汽柱也远优于其他地区的大型光学天文台。冷湖所在的经度区域尚属世界大型光学望远镜的空白区，由于天文观测常需要接力观测，随着冷湖天文观测基地的建设，这里将成为国际光学天文研究的重要基地。\n下列说法与文意不符的是：","options":{"A":"东半球优质光学观测设施相对稀缺","B":"大型光学天文台建设选址难度大","C":"大型光学望远镜对环境要求高，故观测精度高于射电望远镜","D":"冷湖地区得天独厚的环境将使其成为天文科学研究重镇"},"answer":"C","explanation":"A项：根据“此前国际优质的大型光学望远镜几乎都集中在西半球”可知，西半球优质光学观测设施较多，东半球优质光学观测设施相对稀缺，该项表述正确，排除。\nB项：根据“与射电望远镜相比，大型光学望远镜对环境的要求更加苛刻，比如晴夜数、天光背景亮度、视宁度等，所以优质的光学观测台址是稀缺资源”可知，该项表述正确，排除。\nC项：文段并未比较大型光学望远镜与射电望远镜的“观测精度”，该项无中生有，且文段并未论述“对环境要求高”与“观测精度高”之间的因果关系，该项强加因果，当选。\nD项：根据“冷湖所在的经度区域尚属世界大型光学望远镜的空白区，由于天文观测常需要接力观测，随着冷湖天文观测基地的建设，这里将成为国际光学天文研究的重要基地”可知，该项表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《在冷湖，追逐最亮的星（科技自立自强）》","no":26,"missingImage":false},{"qid":"17900924","cat":"语句表达","stem":"博物馆研学，要“研之有物”“学而广博”。博物馆研学不是“打卡”拍照的旅游，也不仅是提供托管服务，而是要让年轻一代明白，生而为中国人，最根本的是有中国人独特的精神世界，有百姓日用而不觉的价值观。近年来，中华文明探源工程等重大工程的研究成果，进一步证实了我国悠久的人类史和璀璨的文化史，其中也包含着中华优秀传统文化、革命文化和社会主义先进文化。这些都被缩影于文物当中。因此，博物馆研学，就是要                    。\n填入画横线部分最恰当的一项是：","options":{"A":"从文物中学习这些文化","B":"深入了解中华文明的独特性","C":"不断提高自身文化素养","D":"有的放矢地学习历史和文化"},"answer":"A","explanation":"横线位于文段尾句，且由横线前的“因此”可知，横线处是对前文的总结。文段开篇指出博物馆研学要“研之有物”“学而广博”，随后强调博物馆研学要让年轻一代明白生而为中国人，最根本的是有中国人独特的精神世界，接着指出近年来一系列重大工程的研究成果证实了我国的历史中包含着各种文化，之后通过“这些”总结前文，指出文化都被缩影于文物之中，故前文强调文物对文化的载体作用，对应A项。\nB、C两项：B项“中华文明的独特性”及C项“提高自身文化素养”文段均未提及，无中生有，与前文衔接不当，且均未提及文段核心话题“文物”，偏离文段核心话题，排除。\nD项：未提及文段核心话题“文物”，偏离文段核心话题，排除。\n故正确答案为A。\n【文段出处】《博物馆研学，如何研之有物、学而广博》","no":27,"missingImage":false},{"qid":"17900918","cat":"片段阅读","stem":"有人认为，知识本来是一个整体，学科拆散了它，跨学科便是将分散的知识重新整合，是对过度专业化的反对。不过，我们可能低估了跨学科的难度。使用几个不同学科的概念，或与其他学科的研究者合写一篇论文，把那些本无多少新意的内容转换成混杂多个学科术语的表述，并不是真正的跨学科研究。“跨学科”不同于“多学科”，后者指两个或两个以上学科的简单组合，例如由不同学科教师团队讲授的特定课程。在这种情况下，学科之间仅是一种相邻关系，并没有真正结合。\n这段文字意在说明：","options":{"A":"跨学科需要对知识重新整合","B":"跨学科需不同学科的交叉融合","C":"多学科和跨学科存在着差异","D":"当下对跨学科的认识存在误区"},"answer":"D","explanation":"文段开篇提出某人的观点，即知识本来是一个整体，学科拆散了它，接着引出“跨学科”的话题，指出跨学科便是将分散的知识重新整合，随后通过转折词“不过”强调我们可能低估了跨学科的难度，然后通过使用不同学科的概念和与其他学科的研究者合写一篇论文都不是真正的跨学科研究、“跨学科”不同于“多学科”等内容进行具体解释说明。故文段意在强调我们当下对跨学科认识不足，低估了跨学科的难度，对应D项。\nA项：“对知识重新整合”属于转折词“不过”之前的内容，非重点，排除。\nB项：“需不同学科的交叉融合”文段未提及，无中生有，排除。\nC项：“存在着差异”属于后文解释说明的内容，非重点，排除。\n故正确答案为D。\n【文段出处】《文科人“跨学科”，一种修辞，一场苦修》","no":28,"missingImage":false},{"qid":"17900935","cat":"片段阅读","stem":"电力作为一种特殊商品，供求实时平衡尤其重要。近年来，我国以风电、光伏发电为代表的新能源发展成效显著，装机规模连续多年稳居全球首位。发展新能源综合效益巨大，但要立得住、立得稳、立得好，需要电网输配、电源、储能等协同支撑。新能源供给消纳体系有助于提升能源安全保障能力，推动绿色低碳发展。只有供给和消纳双管齐下、整体谋划，才能切实推动新能源大规模、高比例、市场化、高质量发展。\n这段文字意在强调：","options":{"A":"我国新能源的装机规模位居世界首位","B":"我国应完善新能源供给消纳体系建设","C":"新能源高质量发展事关国家能源安全","D":"新能源电力需要具有实时平衡的特性"},"answer":"B","explanation":"文段开篇引出“电力”的话题，指出供求实时平衡对电力的重要性，接着介绍我国新能源发展成效显著、装机规模大的背景，之后通过转折词“但”指出发展新能源需要多方面协同支撑，随后指出新能源供给消纳体系能保障能源安全，推动绿色低碳发展，尾句通过“只有······才······”强调推动新能源向好发展离不开供给和消纳的支持。故文段核心话题为“新能源供给消纳体系”，对应B项。\nA项：缺少文段主题词“新能源供给消纳体系”，并且“装机规模位居世界首位”为文段转折前的内容，非重点，排除。\nC、D两项：均缺少文段主题词“新能源供给消纳体系”，排除。\n故正确答案为B。\n【文段出处】《让新能源发得出供得上用得好（经济新方位·巩固经济回升向好趋势）》","no":29,"missingImage":false},{"qid":"10204658","cat":"片段阅读","stem":"汉代农业生产水平逐渐提高，生活物资较为丰富，上层社会在饮食上更加考究，饮食文化随之蓬勃发展。这一时期，烹饪技艺也大幅提升，尤其是中原地区与周边民族的饮食文化交流频繁，一些新的烹饪方法如“羌煮貊炙”即被引入。“羌煮”即煮或涮羊肉、鹿肉；而“貊炙”则类似于烤全羊，较之中原烤法，所烤之物更大。《释名》中说：“貊炙，全体炙之，各自以刀割，出于胡貊之为也。”“羌煮貊炙”做出的肉食鲜嫩味美，此类烹饪方法在黄河流域逐渐流传开来，受到人们的青睐。\n这段文字重在说明：","options":{"A":"社会发展是汉代饮食文化蓬勃发展的重要因素","B":"“羌煮貊炙”一词是胡汉饮食文化交流的表征","C":"汉代中原地区吸收了不少其他民族的烹饪方法","D":"汉代烹饪技艺的提升与民族文化交融密切相关"},"answer":"D","explanation":"文段开篇交代背景，指出随着汉代农业生产水平的提高，饮食文化也蓬勃发展。随后通过指代词“这一时期”及程度词“尤其是”，强调在此期间烹饪技艺在频繁的民族文化交流中大幅提升，紧接着以“‘羌煮貊炙’”进行举例说明。故文段意在强调民族间的文化交流促进了烹饪技艺的发展，对应D项。\nA项，对应开篇背景引入内容，非重点，排除；\nB项，对应举例说明内容，非重点，排除；\nC项，偏离文段核心话题“文化交流”，排除。\n故正确答案为D。\n 【文段出处】光明网《汉代“美食风尚”——烧烤》","no":30,"missingImage":false},{"qid":"17900722","cat":"片段阅读","stem":"近年来，我国数据产量每年保持约30%的增速，厘清各主体的数据权利与义务，有利于优化数据资产管理，促进数据有序流通。从安全角度看，数据分类分级是数据安全的基础。对于关系国家安全或重大公共利益的公共数据，要明确其公有性质，所有权归国家，根据数据级别采取不同的保护措施。对于承载个人信息的数据，应划定隐私与一般数据的边界，在保护隐私的同时通过脱敏、加密等技术手段促进一般数据流通使用。\n这段文字意在强调：","options":{"A":"我国数据生产增长迅猛","B":"需创新研发数据使用流通技术手段","C":"数据保护事关国家安全","D":"应分类分级推进数据确权授权使用"},"answer":"D","explanation":"文段开篇介绍我国数据产量每年递增的背景，并指出厘清各主体的数据权利与义务的意义。随后从安全角度指出数据分类分级是数据安全的基础，并从公共数据和个人信息数据两方面具体论述数据分级分类对数据安全的意义。故文段重点强调数据分级分类对数据安全的重要性，对应D项。\nA项：“数据生产增长迅猛”对应文段开头背景引入部分，非重点，排除；\nB项：“创新研发数据使用流通技术手段”文段并未提及，无中生有，排除；\nC项：数据保护对国家安全的重要性对应后文解释说明部分，非重点，且后文除了国家安全还提到了重大公共利益、个人信息数据，表述片面，排除。\n故正确答案为D。\n【文段出处】《加快建立完善数据产权制度（经济时评）》","no":31,"missingImage":false},{"qid":"5919289","cat":"片段阅读","stem":"一般来说，高速公路扩容改造方案主要有两种：一种是改扩建，即通过对既有高速公路进行拼宽或分离增建车道，提高通行能力；另一种是在既有高速公路通道内另建新线。在无特殊条件制约情况下，扩容改造项目应优先利用既有高速公路改扩建。因为既有高速公路一般占据了通道内较为理想的线位，周边相关路网及配套产业设施已基本形成，另建新线，往往难以取代既有公路承担的交通功能，若选择新线，工程、征拆、投资等规模都较大。\n关于优先利用既有高速公路改扩建的理由，文段未涉及的是：","options":{"A":"工程造价征拆投资等投入相对较低","B":"既有高速公路线的线位已充分论证","C":"可以大大减少设计周期以缩短工期","D":"与现有路网和经济带的适应性最佳"},"answer":"C","explanation":"A项，根据“若选择新线，工程、征拆、投资等规模都较大”可知，文段提及了利用既有高速公路改扩建的“工程造价征拆投资等投入相对较低”，表述正确，排除；\nB项，根据“既有高速公路一般占据了通道内较为理想的线位”“另建新线，往往难以取代既有公路承担的交通功能”可知，既有高速公路线位通常较为理想，建新线难以取代其交通功能，故“既有高速公路线的线位已充分论证”表述正确，排除；\nC项，文段未提及“设计周期”“工期”相关的话题，无中生有，当选；\nD项，根据“既有高速公路······周边相关路网及配套产业设施已基本形成，另建新线，往往难以取代既有公路承担的交通功能”可知，另建新线往往无法与现有的相关路网和配套产业设施相匹配，故“与现有路网和经济带的适应性最佳”表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】人民日报《扩容改造，让高速公路筋骨更强健》","no":32,"missingImage":false},{"qid":"17900922","cat":"片段阅读","stem":"几千年来，中医药生生不息。“传承不泥古，创新不离宗”，是中医药长盛不衰的秘诀。所谓“传承不泥古”，就是要领悟和把握中医药的精髓，不拘泥于经典，不死记方药，而是举一反三、灵活应用，不断超越古人的局限。所谓“创新不离宗”，就是在守住中医根本的基础上，与时俱进，大胆创新，正确处理变与不变的关系，因时制宜、因地制宜、因人制宜，使古老的中医药焕发新光彩。\n这段文字主要说明的是：","options":{"A":"中医药应如何承前启后代代相传","B":"中医药发展需要超越古方的局限","C":"中医药传承必须坚守中医的根本","D":"中医药创新需要处理好哪些问题"},"answer":"A","explanation":"文段开篇提出观点，即“传承不泥古，创新不离宗”是中医药长盛不衰的秘诀，随后通过并列的形式分别介绍“传承不泥古”和“创新不离宗”的具体做法。故文段重点强调中医药如何长盛不衰、代代相传，对应A项。\nB项：“超越古方的局限”仅对应“传承不泥古”的做法，表述片面，排除。\nC项：“坚守中医的根本”仅对应“创新不离宗”的做法，表述片面，排除。\nD项：文段重点强调中医药如何传承，“中医药创新”偏离文段重点，排除。\n故正确答案为A。\n【文段出处】《让中医代代薪火相传（无影灯）》","no":33,"missingImage":false},{"qid":"5919292","cat":"片段阅读","stem":"生产性服务业包括研发设计、信息数据、人力资源、现代物流等领域，涉及农业、工业等产业的多个环节，具有专业性强、创新活跃、产业融合度高、带动作用显著等特点。国际经验表明，制造业发展到一定阶段后，其附加值和市场竞争力的提升更多的是靠现代生产性服务业的支撑。相较而言，我国生产性服务业发展相对滞后，总量不足、结构不合理等问题仍较突出。推动中国制造由大到强，需要我们推动生产性服务业向专业化和价值链高端延伸，更好服务制造业高质量发展。\n这段文字意在强调：","options":{"A":"应进一步推动生产性服务业高质量发展","B":"生产性服务业包括多领域涉及众多产业","C":"生产性服务业与制造业的发展息息相关","D":"更好服务制造业是生产性服务业的目标"},"answer":"A","explanation":"文段开篇引出“生产性服务业”这一话题，接着介绍其对于制造业的重要性，随后提出我国生产性服务业发展的突出问题，尾句通过“需要”针对前文问题提出对策，即要推动生产性服务业向专业化和价值链高端延伸。故文段重点为尾句对策，对应A项，其中“高质量发展”对应“向专业化和价值链高端延伸”。\nB项“包括多领域涉及众多产业”、C项“与制造业的发展息息相关”均对应对策前的内容，非重点，排除；\nD项，没有体现生产性服务业未来的发展方向是“高质量”，且选项为非对策表述，排除。\n故正确答案为A。\n【文段出处】人民日报《进一步推动生产性服务业发展（观象台）》","no":34,"missingImage":false},{"qid":"13628170","cat":"语句表达","stem":"①这样经济潜能才能得到充分释放，经济增长的边界才会不断拓展\n②产权制度发挥着重要作用\n③能不能让各种资源都参与到经济活动中并充分发挥作用\n④通过有效的组合配置充分发挥要素价值，进而产生更大的经济效益\n⑤在经济发展中实现“人尽其才，物尽其用”，就是要求各种资源作为生产要素都参与到经济活动中\n⑥能不能保证生产要素的组合配置以最优的方式稳定地实现进而提高全要素生产率\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑤⑥②①③④","B":"⑤④①③⑥②","C":"③⑥②①⑤④","D":"③④⑤⑥①②"},"answer":"B","explanation":"对比选项，判断首句。⑤句指出要在经济发展中实现“人尽其才，物尽其用”的目标，要求各种资源作为生产要素都参与到经济活动中，③句提出问题，论述能不能让各种资源都参与到经济中并发挥作用，对比发现，首句特征不明显，无法确定首句。\n继续寻找文段线索发现，①句中出现指代词“这样”且结合后文的必要条件关联词“才”可知，重在论述由对策带来的效果，即经济潜能得到充分释放，经济边界得到拓展，故“这样”应指代前文中带来这种效果的对策。观察选项，①句前有②句、④句和⑥句，④句出现表示对策的标志词“通过······”，论述借助有效的组合配置充分发挥要素的价值，产生更大的经济效益，可以与①句构成指代词捆绑，而②句强调产权制度的重要性，⑥句通过“能不能”提出问题，均未出现具体做法，无法与①句构成捆绑，排除A、C、D三项，锁定B项。\n故正确答案为B。\n【文段出处】人民网《社会主义市场经济本质上是法治经济》","no":35,"missingImage":false},{"qid":"17900928","cat":"逻辑填空","stem":"“不一则不专，不专则不能。”持之以恒的专注追求，不仅是科研求索的唯一捷径，也是成就一切事业的关键基石。古往今来，多少有所建树者，正是在坚守一个人、一辈子、一件事的信念中，创造了令人            的非凡业绩，留下了让世界惊叹的不朽        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"刮目相看 成就","B":"另眼相待 丰碑","C":"叹为观止 华章","D":"拍案叫绝 功绩"},"answer":"A","explanation":"第一空，搭配“业绩”，且“创造了令人······的非凡业绩，留下了让世界······的不朽······”相同句式表并列，故横线处应体现创造了令人惊叹的业绩之意。A项“刮目相看”指用新的眼光来看待，C项“叹为观止”形容所见到的事物好到了极点，均符合文意，保留。B项“另眼相待”指用另一种眼光看待，多指看待某个人（或某种人）不同于一般，与文意不符，排除；D项“拍案叫绝”指拍着桌子叫好，形容非常赞赏，强调对某人的作品或者话语等赞赏，与“业绩”搭配不当，排除。\n第二空，根据相同句式表并列可知，横线处需对应“业绩”，即所取得的事业成绩。A项“成就”指成绩、业绩，符合文意，当选。C项“华章”指称颂他人诗文华丽的赞美之词，文段此处指有所建树者自己所取得的事业成绩，并非称颂他人的赞美之词，与文意不符，排除。\n故正确答案为A。\n【文段出处】《“一辈子办成一件事”的人生价值》","no":36,"missingImage":false},{"qid":"17900933","cat":"逻辑填空","stem":"随着人工智能和机器人研发的迅猛发展，与此相关的伦理问题也引起多方关注。令人欣慰的是，一些科研单位            ，面对人工智能等新兴科技带来的挑战，         不同学科、不同领域的力量，积极探索如何解决诸如人工智能和机器人伦理问题。\n依次填入画横线部分最恰当的一项是：","options":{"A":"迎难而上 聚集","B":"一马当先 汇聚","C":"因势利导 融合","D":"高瞻远瞩 整合"},"answer":"D","explanation":"第一空，根据后文“面对人工智能等新兴科技带来的挑战······积极探索如何解决诸如人工智能和机器人伦理问题”可知，横线处应体现“一些科研单位”敢于直面问题，主动寻求解决方法之意，A项“迎难而上”意思是就算遇到困难也不退缩，迎着困难去克服它，符合文意，保留；D项“高瞻远瞩”形容目光远大，放于此处体现科研单位面对新兴科技的挑战及问题，思考谋划，积极应对的态度，符合文意，保留。B项“一马当先”形容领先，走在前列，也比喻工作走在群众前面，积极带头，文段并未强调积极带头，且无对比的语境，不符合文意，排除；C项“因势利导”指顺着事物发展的趋势很好地加以引导，侧重强调发挥引导作用，而文段则强调主动探索解决问题的方法，与文意无关，排除。\n第二空，横线处搭配“力量”，D项“整合”指通过调整、整顿、协调重新组合，填入横线处意为科研单位将不同学科领域的力量协调组合，实现彼此的资源共享和协同工作，形成有价值有效率的一个整体，使其共同发力，从而解决新兴科技带来的诸多问题，符合文意，当选。A项“聚集”指集合、凑在一起，填入文段表示单纯把不同力量集合起来，填入横线处表达让不同学科领域力量共同发力解决新兴科技问题的举措时，不如D项更加贴切，排除。\n故正确答案为D。\n【文段出处】长江日报《我们当然不能把机器人只视为“钳子”》","no":37,"missingImage":false},{"qid":"5919300","cat":"逻辑填空","stem":"北极和南极是地球的极巅，它们遥相呼应，各据一方。冰天雪地是极地的特色，寒冷干燥是那里的常态，那里            ，生态环境却别有洞天，企鹅在南极雪地疾走，白熊在北极冰水游泳，苍鹰在高峰之巅盘旋······神奇的世界、迷人的景象，令人            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"与世隔绝 心旷神怡","B":"寸草不生 怦然心动","C":"人迹罕至 心驰神往","D":"冰冻三尺 赏心悦目"},"answer":"C","explanation":"第一空，横线前“那里”指代的是极地，根据前文“冰天雪地”“寒冷干燥”可知，横线处成语也应体现极地的特点，且根据横线后转折词“却”可知，横线前后语义相反，横线后描写极地生态环境别有洞天，各类动物在此处生存，故横线处成语应体现极地的环境不适合生物的生存。C项“人迹罕至”指人的足迹很少到达，符合文意，保留。A项“与世隔绝”指与外界社会隔断往来，置于此处程度过重，排除；B项“寸草不生”形容土地贫瘠，环境恶劣，连一点儿草都不长，与后文的“生态环境却别有洞天”相互矛盾，排除；D项“冰冻三尺”比喻事态的严重不是一天造成的，是日积月累而成的，形容长时间形成的问题，与文意无关，排除。\n第二空，代入验证，根据前文“神奇的世界、迷人的景象”可知，横线处成语应形容极地景象带给人类的美好感受，C项“心驰神往”形容思想集中在追求和向往的事情或地方上，置于此处能够体现极地风景美丽，人们想要到达之意，当选。\n故正确答案为C。\n【文段出处】人民日报《极地科考 造福人类》","no":38,"missingImage":false},{"qid":"5919324","cat":"逻辑填空","stem":"国防教育应面向全民，没有一个人、一个行业、一个领域可以            ，国防意识和国防素养不可能自发形成，必须            地推动国防教育进机关、进学校、进企业、进社区、进乡村、进军营、进网络等，实现全民国防教育“全覆盖”。\n依次填入画横线部分最恰当的一项是：","options":{"A":"漠不关心 全力以赴","B":"置身事外 坚持不懈","C":"袖手旁观 持之以恒","D":"作壁上观 矢志不渝"},"answer":"B","explanation":"第一空，根据“面向全民”“不可能自发形成”“实现全民国防教育‘全覆盖’”可知，要让所有人、行业、领域都参与到国防教育当中，B项“置身事外”指把自己放在事情之外，毫不关心，与“没有”搭配，可以体现出“国防教育应面向全民”，保留。A项“漠不关心”指对人或事情一点儿也不关心，侧重强调不关心，与文段“面向全民”对应不当，排除；C项“袖手旁观”比喻置身事外，既不过问，也不协助别人，D项“作壁上观”比喻站在一旁看着，不动手帮助，均侧重强调“不提供帮助”，文段并无“提供帮助”之意，排除。\n第二空，代入验证，B项“坚持不懈”指坚持到底，一点不松懈，与“不可能自发形成”“实现全民国防教育‘全覆盖’”等内容相对应，可以体现进行国防教育是一个需要持续发力、久久为功的过程，符合文意，当选。\n故正确答案为B。\n【文段出处】《新时代全民国防教育工作大家谈》","no":39,"missingImage":false},{"qid":"5919311","cat":"逻辑填空","stem":"人们很早就发现太阳并非一成不变，而是源源不断地往外喷发物质和能量，时而        、时而猛烈。黑子、耀斑、日冕物质抛射等太阳活动            ，所引发的太阳风暴不断搅动着日地、太阳系空间和行星周围的环境，在太空中产生各种各样短时间尺度的变化。\n依次填入画横线部分最恰当的一项是：","options":{"A":"平缓 此起彼伏","B":"舒缓 瞬息万变","C":"温和 接踵而至","D":"平和 绵延不绝"},"answer":"A","explanation":"本题可从第二空入手。横线处搭配“太阳活动”，且根据后文“引发的太阳风暴不断搅动着太阳系空间和行星周围的环境”可知，横线处应表达太阳活动接连不断之意。A项“此起彼伏”指这里起来，那里落下，表示连续不断，与“太阳活动”搭配恰当，且与文意相符，保留。B项“瞬息万变”指在极短的时间内变化快而多，文段强调多种不同类型的太阳活动接连不断，而非变化多，与文意不符，且置于此处程度过重，排除；C项“接踵而至”指人们前脚跟着后脚，接连不断地来，形容人接连而来或事情持续发生，侧重强调事情发生得很紧凑，间隔很短，而A项“此起彼伏”强调多个事物无规律地连续出现，两项对比，A项“此起彼伏”与“黑子、耀斑、日冕物质抛射等太阳活动”的出现规律更契合，故排除C项；D项“绵延不绝”指接连不断，一直延续下去，多搭配“山川”“文化”“文明”等，与“太阳活动”搭配不当，排除。\n第一空，代入验证。根据“时而······时而······”可知，横线处词语与“猛烈”语义相反。A项“平缓”指平稳、缓慢，与“猛烈”语义相反，符合文意，当选。\n故正确答案为A。\n【文段出处】《“太空天气预报”的作用（开卷知新）》","no":40,"missingImage":false},{"qid":"5919341","cat":"逻辑填空","stem":"社会治理现代化是中国式现代化社会治理领域的具体表现，        于中国式现代化道路的生成脉络中，凝结了改革开放以来特别是新时代以来我国社会治理的新理念、          ，现代治理精神和中华善治传统在新时代            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"孕育 新方法 一脉相承","B":"蕴含 新经验 交相辉映","C":"贯通 新举措 并驾齐驱","D":"发轫 新视野 相辅相成"},"answer":"B","explanation":"本题从第二空入手，搭配“凝结”。B项“经验”指从多次实践中得到的知识或技能，与“凝结”搭配恰当，保留。A项“方法”指达到某种目的而采取的途径、步骤、手段等，C项“举措”指举动、行为，均非抽象概念，且与“凝结”搭配不当，排除；D项“视野”即通过眼睛所能看到的事物，同时也指人的思想或知识的领域，通常搭配“拓展”，与“凝结”搭配不当，排除。\n再看第三空，代入验证。横线处形容“现代治理精神”和“中华善治传统”的关系，B项“交相辉映”指各种光亮、色彩等互相映照，置于此处可表示二者在新时代共同闪耀，均发展很好，符合文意，保留。\n第一空，代入验证。B项“蕴含”指包含在内，置于此处表示社会治理现代化包含在中国式现代化道路的生成脉络之中，符合文意，当选。\n故正确答案为B。\n【文段出处】《郭晔：中国社会治理为人类治理文明注入新内涵》","no":41,"missingImage":false},{"qid":"13628175","cat":"逻辑填空","stem":"识才爱才敬才用才，是我们党的优秀传统。我们必须积极营造尊重人才、            的社会环境，公正平等、竞争择优的制度环境，待遇适当、保障        的生活环境，为人才            钻研业务创造良好条件。\n依次填入画横线处最恰当的一项是：","options":{"A":"唯才是举 合理 坚定不移","B":"任人唯贤 全面 凝神聚力","C":"求贤若渴 有力 心无旁骛","D":"量才录用 完善 竭尽所能"},"answer":"C","explanation":"第一空，根据“、”可知，横线处所填成语与“尊重人才”构成并列关系，语义相近，应体现出对人才的重视，A项“唯才是举”指只要是有才能的人就提拔或推荐，B项“任人唯贤”指任用德才兼备的人，而不管他跟自己的关系是否亲密，C项“求贤若渴”指寻求贤才的心情非常迫切，均可体现对于人才的重视，符合文意，保留。D项“量才录用”指根据才能的大小来录取任用人才，更强调要有选择性地任用人才而非重视人才，与文意无关，排除。\n第二空，搭配“保障”，且根据“待遇适当”“钻研业务创造良好条件”可知，横线处应体现我们党对人才的生活环境予以保障，B项“全面”指所有方面，各个方面的总和，C项“有力”指有力量，分量重，均可体现我们党努力为人才创造良好的生活环境，符合文意，保留。A项“合理”指合乎道理或事理，与“保障”搭配不当，排除。\n第三空，根据“我们必须积极营造尊重人才······竞争择优的制度环境”“待遇适当······的生活环境”可知，横线处应体现我们党为人才提供良好制度环境和生活环境，是为了让人才能够安心钻研业务，C项“心无旁骛”指心中没有另外的杂念，形容心思集中，专心致志，可体现让人才集中心思钻研业务，没有后顾之忧，符合文意，当选。B项“凝神聚力”指统一思想，团结力量，文段中并未体现人才要团结，与文意不符，排除。\n故正确答案为C。\n【文段出处】人民日报《建设人才强国，厚植人才资源竞争优势》","no":42,"missingImage":false},{"qid":"13628187","cat":"逻辑填空","stem":"构建高水平全民健身公共服务体系，体现在以人民为中心的系统性建构中。从按人口要素        资源布局，到推动全民健身公共服务城乡区域        发展；从构建多层级健身设施网络和城镇社区15分钟健身圈，到建立分学段、跨区域的四级青少年体育赛事体系，人民对高品质生活的需求，决定了体育是            的内容。\n依次填入画横线部分最恰当的一项是：","options":{"A":"规划 平衡 举足轻重","B":"调整 协同 必不可少","C":"统筹 均衡 不可或缺","D":"优化 协调 至关重要"},"answer":"C","explanation":"第一空，根据“从······到······；从······到······”可知，后文内容是对首句“构建高水平全民健身公共服务体系，体现在以人民为中心的系统性建构中”的具体展开，“构建”指建立，侧重从无到有的过程，横线处也应体现从无到有之意，A项“规划”指比较全面的、长远的发展计划，C项“统筹”指通盘筹划，均可体现从无到有的过程，保留。B项“调整”指重新调配整顿，D项“优化”指采取一定措施使变得优秀，均侧重于在已有的基础上做些调配，并非是从无到有的过程，排除。\n第二空，搭配“发展”，形容全民健身公共服务城乡区域发展的情况，A项“平衡”指倾向于保持稳定的情况，C项“均衡”指平衡，均与“发展”搭配恰当，保留。\n第三空，搭配“内容”，C项“不可或缺”表示非常重要，不能有一点点的缺失，通常形容必不可少的因素或部分，与“内容”搭配恰当，当选。A项“举足轻重”比喻能起到影响全局的关键作用，通常搭配“地位”“作用”等，与“内容”搭配不当，排除。\n故正确答案为C。\n【文段出处】人民 "},"answer":"C","explanation":"因丈夫每周一、三、五游泳，且2023年12月1日为周五，所以2023年12月丈夫前三次游泳的日期为1日（周五）、4日（周一）、6日（周三），以7天一星期的周期进行推算，2023年12月丈夫游泳的日期如下表所示：\n\u003cimg data-k=\"85a48e164576\" style=\"max-width:700px\">\n其中日期为质数的有11日、13日、29日，共3天，即该夫妇2023年12月同日游泳的天数是3天。\n故正确答案为C。","no":59,"missingImage":false},{"type":"question","qid":"5919099","cat":"数学运算","stem":"甲、乙、丙三人合作完成一项任务。乙先做9天，再和甲合作6天，完成了任务的60%，剩下的任务，若由丙做，恰好10天完成。甲、乙、丙三人的工作效率之比是：","options":{"A":"5：4：6","B":"6：4：5","C":"10：15：12","D":"12：15：10"},"answer":"A","explanation":"根据题意可得，9×乙+6×（甲+乙）=60%×工作总量······①，10×丙=（1-60%）×工作总量······②，①÷②可得：\u003cimg data-k=\"e5144ec142a2\">\u003cimg data-k=\"2d72742ce427\">，则2甲+5乙=5丙，依次代入选项：\nA项：赋值甲、乙、丙三人的工作效率分别为5、4、6，则2×5+5×4=30=5×6，满足题干条件，当选；\nB项：赋值甲、乙、丙三人的工作效率分别为6、4、5，则\u003cimg data-k=\"2890418bb4d9\">\u003cimg data-k=\"645831205161\">\u003cimg data-k=\"ddef199521b1\">，不满足题干条件，排除；\nC项：赋值甲、乙、丙三人的工作效率分别为10、15、12，则\u003cimg data-k=\"328b3b28927a\">\u003cimg data-k=\"645831205161\">\u003cimg data-k=\"c6cbeda34f87\">，不满足题干条件，排除；\nD项：赋值甲、乙、丙三人的工作效率分别为12、15、10，则\u003cimg data-k=\"c6634bb76614\">\u003cimg data-k=\"645831205161\">\u003cimg data-k=\"bf96319c26e6\">，不满足题干条件，排除。\n故正确答案为A。","no":60,"missingImage":false},{"type":"question","qid":"5919100","cat":"数学运算","stem":"某公司派出5名人力资源专员去2个一线城市和2个二线城市参加秋季招聘会。若每名专员只去其中1个城市，每个一线城市至少派1名专员，每个二线城市只派1名专员，则不同的派出方法共有（    ）。","options":{"A":"60种","B":"72种","C":"120种","D":"144种"},"answer":"C","explanation":"5名专员分配到4个城市，其中每个一线城市至少派1名专员，每个二线城市只派1名专员，则5名专员中有3名专员分配到2个一线城市（分别为2名专员和1名专员），其余2名专员分配到2个二线城市（各1名专员）。从5名专员中选出2名专员，再从剩下3名专员中选出1名专员，这两组人分配到2个一线城市，有\u003cimg data-k=\"e38caead9cc7\">种；剩下2名专员分配到2个二线城市，有\u003cimg data-k=\"79ffa592ef20\">种。分步用乘法，则不同的派出方法共有60×2=120种。\n故正确答案为C。","no":61,"missingImage":false},{"type":"question","qid":"5919101","cat":"数学运算","stem":"小陆参加植树活动，他到达植树地点时，第一排预设点位中的9个已有人在植树，若他在第一排剩余的任意点位上植树，都恰好有一个相邻点位有人在植树，则该植树点第一排的预设点位最多有：","options":{"A":"27个","B":"28个","C":"29个","D":"30个"},"answer":"A","explanation":"根据题意，小陆在第一排剩余的任意点位上植树，都恰好有一个相邻点位有人在植树，且要求预设点位数尽可能多，则每个已有人在植树的点位之间应该有两个无人植树的点位，如下图所示。（圆形和三角形分别代表无人植树和已有人在植树的点位）\n\u003cimg data-k=\"b34611d13afe\" style=\"max-width:560px\">\n为使预设点位数尽可能多，则第一个已有人在植树的点位左侧最多可安排一个无人植树的点位，最后一个已有人在植树的点位右侧最多可安排一个无人植树的点位，如下图所示。\n\u003cimg data-k=\"95abb0df72e8\" style=\"max-width:587px\">\n即相当于每3个点位为一个周期，每个周期中有1个已有人在植树的点位，且位于中间位置。根据已有人在植树的点位有9个，则该植树点第一排最多有9×3=27个预设点位。\n\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"5919108","cat":"数学运算","stem":"某基层工会共有180名会员，举行甲、乙两项工会活动，60%的会员参加甲活动，50%的会员参加乙活动，若只参加甲活动的会员有80人，则只参加乙活动的会员有（    ）。","options":{"A":"10人","B":"28人","C":"62人","D":"72人"},"answer":"C","explanation":"根据题意可得，参加甲活动的会员人数为180×60%=108人，参加乙活动的会员人数为180×50%=90人，根据“只参加甲活动的会员有80人”，可得甲、乙两项活动都参加的会员人数为108-80=28人，如下图所示：\n\u003cimg data-k=\"398a1b4fc994\" style=\"max-width:310px\">\n则只参加乙活动的会员有90-28=62人。\n故正确答案为C。","no":63,"missingImage":false},{"type":"question","qid":"5919119","cat":"数学运算","stem":"如图所示，ABCDEF是一个边长为2的正六边形，圆O是\u003cimg data-k=\"410143a03c97\">的内切圆，则圆O的面积是（    ）。\n\u003cimg data-k=\"b48cf7d7f66c\" style=\"max-width:246px\">","options":{"A":"\u003cimg data-k=\"9be50071e859\">","B":"\u003cimg data-k=\"b75a56087b81\">","C":"\u003cimg data-k=\"4d9c8735c390\">","D":"\u003cimg data-k=\"b6a468a80030\">"},"answer":"A","explanation":"方法一：由于ABCDEF是正六边形，可得AC=CE=EA，即\u003cimg data-k=\"410143a03c97\">为正三角形，则\u003cimg data-k=\"410143a03c97\">内切圆的圆心O即为正六边形ABCDEF的中心。作\u003cimg data-k=\"410143a03c97\">的中线AH，连接FO，\u003cimg data-k=\"ffd28ac1b0aa\">为正三角形，如下图所示：\n\u003cimg data-k=\"e59154d92934\" style=\"max-width:257px\">\n已知AF=FE=2，且正六边形内角\u003cimg data-k=\"ac8129521b67\">，则\u003cimg data-k=\"0a631be72879\">，\u003cimg data-k=\"7afe82f86deb\">。在直角\u003cimg data-k=\"8d7d252abb42\">中，\u003cimg data-k=\"7404a2ee9d4f\">，\u003cimg data-k=\"a7f5db37e1ff\">，且AO=AF=2，所以所求圆半径OH=AH-AO=3-2=1，所求圆面积\u003cimg data-k=\"dbe728ebdd80\">。\n方法二：如下图所示，连接AO、FO，\u003cimg data-k=\"ffd28ac1b0aa\">为正三角形，由于AO为\u003cimg data-k=\"410143a03c97\">的中线且\u003cimg data-k=\"95de63063f58\">，则\u003cimg data-k=\"0d1cbe01fb19\">，AG为\u003cimg data-k=\"ffd28ac1b0aa\">的中线，即所求圆半径\u003cimg data-k=\"05e8c58ef869\">，所求圆面积\u003cimg data-k=\"dbe728ebdd80\">。\n\u003cimg data-k=\"05f89083343a\" style=\"max-width:245px\">\n故正确答案为A。","no":64,"missingImage":false}],"count":19,"answerable":19,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>某企业的生产部、研发部和财务部分别需要招聘1名员工，有3名博士生、3名硕士生和3名本科生前来应聘。该公司人事部小王对招聘结果做了如下预测：\u003c/p>\u003cp>（1）如果生产部录用本科生，那么研发部录用硕士生；\u003c/p>\u003cp>（2）如果研发部录用博士生，那么生产部录用博士生；\u003c/p>\u003cp>（3）如果财务部录用本科生或者硕士生，那么研发部录用本科生。\u003c/p>","questions":[{"qid":"16095257","cat":"逻辑判断","stem":"如果3个部门录用的人员学历各不相同，那么以下哪种情况符合小王的预测？","options":{"A":"生产部录用硕士生，财务部录用本科生","B":"研发部录用博士生，财务部录用硕士生","C":"生产部录用博士生，研发部录用本科生","D":"财务部录用本科生，研发部录用硕士生"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）生产部录用本科生\u003cimg data-k=\"a37757d411ef\">研发部录用硕士生；\n（2）研发部录用博士生\u003cimg data-k=\"a37757d411ef\">生产部录用博士生；\n（3）财务部录用本科生 或 财务部录用硕士生\u003cimg data-k=\"a37757d411ef\">研发部录用本科生；\n（4）有3名博士生、3名硕士生和3名本科生；\n（5）3个部门录用的人员学历各不相同。\n第二步：根据题干条件进行推理。\n根据条件（2）和条件（5）可以推出研发部没有录用博士生，因为如果“研发部录用博士生”，根据条件（2）可以推出生产部也录用博士生，与条件（5）矛盾，所以研发部没有录用博士生，排除B项；\n根据条件（3）和条件（5）可以推出财务部没有录用本科生，因为如果“财务部录用本科生”，根据条件（3）可以推出研发部也录用本科生，与条件（5）矛盾，所以财务部没用录用本科生，排除A、D两项。\n故正确答案为C。","no":65,"missingImage":false},{"qid":"16095260","cat":"类比推理","stem":"如果研发部录用硕士生，那么以下哪种情况不符合小王的预测？","options":{"A":"生产部录用博士生","B":"财务部录用博士生","C":"生产部录用本科生","D":"财务部录用硕士生"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）生产部录用本科生\u003cimg data-k=\"a37757d411ef\">研发部录用硕士生；\n（2）研发部录用博士生\u003cimg data-k=\"a37757d411ef\">生产部录用博士生；\n（3）财务部录用本科生 或 财务部录用硕士生\u003cimg data-k=\"a37757d411ef\">研发部录用本科生；\n（4）有3名博士生、3名硕士生和3名本科生；\n（5）研发部录用硕士生。\n第二步：根据题干条件进行推理。\n条件（5）为确定信息，以此为起点开始推理。\n根据条件（5）“研发部录用硕士生”以及题干条件“每个部门只招聘1名员工”，可以推出“研发部没有录用本科生”，是对条件（3）的否后，否后必否前，可以推出“财务部没有录用本科生 且 财务部没有录用硕士生”，即财务部只能录用博士生，D项不符合小王的预测，当选。\n本题为选非题，故正确答案为D。","no":66,"missingImage":false}]},{"type":"material","material":"\u003cp>市住建局3名工作人员小郑、小周、小刘打算参加“青年党员下基层”调研活动。可选的有小微堵点改造、跨区断头路建设、小型城市客厅打造、历史街区微改造4个调研项目。指导调研的有王教授、钱教授、马教授，且他们只能指导上述三位工作人员，已知：\u003c/p>\u003cp>（1）每位工作人员参加的项目都必须有教授指导，每位教授至少指导一位工作人员；\u003c/p>\u003cp>（2）每位工作人员只能参加一个项目，提倡多人合作；\u003c/p>\u003cp>（3）每位教授只能指导一个项目，一个项目也可由多位教授共同指导；\u003c/p>\u003cp>（4）小郑参加小微堵点改造或跨区断头路建设项目，钱教授指导历史街区微改造项目。\u003c/p>","questions":[{"qid":"16095254","cat":"类比推理","stem":"参加或指导小微堵点改造项目的不可能同时有以下哪两个人？","options":{"A":"王教授和马教授","B":"马教授和小刘","C":"小刘和小周","D":"小周和王教授"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）每位工作人员参加的项目都必须有教授指导，每位教授至少指导一位工作人员；\n（2）每位工作人员只能参加一个项目，提倡多人合作；\n（3）每位教授只能指导一个项目，一个项目也可由多位教授共同指导；\n（4）小郑参加小微堵点改造或跨区断头路建设项目，钱教授指导历史街区微改造项目。\n第二步：根据题干条件进行推理。\n提问方式为“不可能”，优先考虑代入法。\n代入A项，若指导小微堵点改造项目的是王教授和马教授，由条件（4）可知，指导历史街区微改造项目的是钱教授，结合条件（1）中的“每位教授至少指导一位工作人员”可知，历史街区微改造项目必须有工作人员参加，此时只要这两个项目都分别有至少一位工作人员参加即可，与题干条件不矛盾，该项可能成立，排除；\n代入B项，若指导小微堵点改造项目的是马教授，参加小微堵点改造项目的是小刘，由条件（4）可知，指导历史街区微改造项目的是钱教授，结合条件（1）中的“每位教授至少指导一位工作人员”可知，历史街区微改造项目必须有工作人员参加，小郑参加小微堵点改造或跨区断头路建设项目，那么此时小周参加历史街区微改造项目即可，与题干条件不矛盾，该项可能成立，排除；\n代入C项，若参加小微堵点改造项目的是小刘和小周，由条件（4）可知，小郑参加小微堵点改造或跨区断头路建设项目，此时3名工作人员中没有人可以参加由钱教授指导的历史街区微改造项目，不符合条件（1）中的“每位教授至少指导一位工作人员”，该项不可能成立，当选；\n代入D项，若参加小微堵点改造项目的是小周，指导小微堵点改造项目的是王教授，由条件（4）可知，小郑参加小微堵点改造或跨区断头路建设项目，钱教授指导历史街区微改造项目，结合条件（1）中的“每位教授至少指导一位工作人员”可知，历史街区微改造项目必须有工作人员参加，此时小刘参加历史街区微改造项目即可，与题干条件不矛盾，该项可能成立，排除。\n本题为选非题，故正确答案为C。","no":67,"missingImage":false},{"qid":"16095256","cat":"类比推理","stem":"如果小周参加小型城市客厅打造项目，则以下哪一项一定为真？","options":{"A":"小刘参加历史街区微改造项目","B":"王教授指导小型城市客厅打造项目","C":"马教授指导小微堵点改造项目","D":"小郑参加跨区断头路建设项目"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）每位工作人员参加的项目都必须有教授指导，每位教授至少指导一位工作人员；\n（2）每位工作人员只能参加一个项目，提倡多人合作；\n（3）每位教授只能指导一个项目，一个项目也可由多位教授共同指导；\n（4）小郑参加小微堵点改造或跨区断头路建设项目，钱教授指导历史街区微改造项目；\n（5）小周参加小型城市客厅打造项目。\n第二步：根据题干条件进行推理。\n条件（4）与条件（5）中有确定信息，优先从确定信息入手推理。由条件（4）可知，钱教授指导历史街区微改造项目，结合条件（1）中的“每位教授至少指导一位工作人员”可知，历史街区微改造项目一定有工作人员参加；由条件（4）可知，小郑参加小微堵点改造或跨区断头路建设项目，由条件（5）可知，小周参加小型城市客厅打造项目，结合条件（2）中的“每位工作人员只能参加一个项目”可知，参加历史街区微改造项目的工作人员不可能是小郑、小周，且只有3名工作人员，所以小刘一定参加历史街区微改造项目，对应A项。\n故正确答案为A。","no":68,"missingImage":false},{"qid":"5919637","cat":"类比推理","stem":"保护知识产权：保护创新","options":{"A":"人之初：性本善","B":"德不孤：必有邻","C":"勤有功：戏无益","D":"经一事：长一智"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“保护知识产权”是“保护创新”的重要手段和举措，通过“保护知识产权”能达到“保护创新”的目的，二者为方式与目的的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“人之初，性本善”的意思是人出生之初，禀性本身都是善良的。“人之初”与“性本善”不是方式与目的的对应关系，与题干逻辑关系不一致，排除。\nB项：“德不孤，必有邻”的意思是有道德的人是不会孤单的，必定会有志同道合的人来与他为伴。“德不孤”与“必有邻”不是方式与目的的对应关系，与题干逻辑关系不一致，排除。\nC项：“勤有功，戏无益”的意思是人只要勤奋努力，就会有所成就；而嬉戏贪玩则对人没有任何好处。“勤有功”与“戏无益”不是方式与目的的对应关系，与题干逻辑关系不一致，排除。\nD项：“经一事，长一智”的意思是亲身经历了某件事情，就能增长关于这方面的知识。通过“经一事”能达到“长一智”的目的，二者为方式与目的的对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":69,"missingImage":false},{"qid":"5919659","cat":"类比推理","stem":"年华未暮：容貌先秋","options":{"A":"十年树木：百年树人","B":"宁为玉碎：不为瓦全","C":"言者无心：听者有意","D":"人无远虑：必有近忧"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“年华未暮，容貌先秋”的意思是未到衰老的年纪，而容颜已经老去，虽然“年华未暮”，但是“容貌先秋”，二者为转折的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“十年树木，百年树人”的意思是培植树木需要十年，培育人才需要百年，指培养人才很不容易，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：“宁为玉碎，不为瓦全”的意思是宁愿做高贵的玉器而破碎，也不愿做低贱的瓦器得以保全，比喻宁为正义事业而牺牲，也不苟且偷生，二者为并列关系，与题干逻辑关系不一致，排除；\nC项：“言者无心，听者有意”的意思是说话的人不注意，而听话的人却很留神，虽然“言者无心”，但是“听者有意”，二者为转折的对应关系，与题干逻辑关系一致，当选；\nD项：“人无远虑，必有近忧”的意思是人若没有长远的谋虑，一定很快就有忧患，二者为条件的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":70,"missingImage":false},{"qid":"5919643","cat":"类比推理","stem":"吴王好剑客：百姓多创瘢","options":{"A":"白日依山尽：黄河入海流","B":"问君何能尔：心远地自偏","C":"海上生明月：天涯共此时","D":"烽火连三月：家书抵万金"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“吴王好剑客，百姓多创瘢”的意思是吴王喜爱精通剑术的侠客，为此老百姓身上伤痕累累。因为“吴王好剑客”，所以“百姓多创瘢”，二者为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“白日依山尽，黄河入海流”的意思是太阳依傍着西山慢慢地沉落，滔滔黄河朝着大海汹涌奔流。“白日依山尽”与“黄河入海流”为并列关系，与题干逻辑关系不一致，排除。\nB项：“问君何能尔？心远地自偏”的意思是问我如何能做到这样，只要心中所想远离世俗，自然就会觉得所处地方僻静了。“问君何能尔”不是“心远地自偏”的原因，二者不是因果对应关系，与题干逻辑关系不一致，排除。\nC项：“海上生明月，天涯共此时”的意思是茫茫的海上升起一轮明月，使人忆起远隔天涯海角的亲友，此时应该都在望着这轮明月。“海上生明月”不是“天涯共此时”的原因，二者不是因果对应关系，与题干逻辑关系不一致，排除。\nD项：“烽火连三月，家书抵万金”的意思是连绵的战火已经持续很长时间了，家书难得，一封抵得上万两黄金。因为“烽火连三月”，所以“家书抵万金”，二者为因果对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":71,"missingImage":false},{"qid":"12334408","cat":"类比推理","stem":"停：行：止","options":{"A":"日：月：星","B":"满：亏：盈","C":"没：有：无","D":"萌：荣：枯"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“停”和“止”均指“停止”，第一词与第三词为全同关系，“行”指“走、移动”，“停”、“止”与“行”是两种不同的状态，且除了“停（止）”就是“行”，第一词和第三词均与第二词构成矛盾关系。\n第二步：判断选项词语间逻辑关系。\nA项：“日”、“月”、“星”三者为并列关系，与题干逻辑关系不一致，排除；\nB项：“满”指“达到容量的极点”，“盈”指“充满、多出来”，第一词与第三词为近义关系，“亏”指“受损失、欠缺”，“盈”和“亏”语义相反，第二词与第三词构成反义关系，且生意除了“盈”和“亏”外还有“不盈不亏”，第一词和第三词与第二词并不构成矛盾关系，与题干逻辑关系不一致，排除；\nC项：“没”和“无”均指“没有、不存在”，第一词与第三词为全同关系，“有”指“存在”，“没”、“无”与“有”是两种不同的状态，且除了“没（无）”就是“有”，第一词和第三词均与第二词构成矛盾关系，与题干逻辑关系一致，当选；\nD项：“萌”、“荣”、“枯”分别指植物或草木“发芽”、“茂盛”、“失去水分”，三者为状态先后顺序的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":72,"missingImage":false},{"qid":"5919658","cat":"类比推理","stem":"球赛：球员：裁判","options":{"A":"教学：教师：家长","B":"庭审：被告：法官","C":"球场：球员：观众","D":"手术：患者：护士"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“球员”参与“球赛”，二者为活动与主体的对应关系；“裁判”判罚“球员”，二者为主体与被判罚对象的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“教师”参与“教学”，二者为活动与主体的对应关系，但“家长”不能判罚“教师”，与题干逻辑关系不一致，排除。\nB项：“被告”参与“庭审”，二者为活动与主体的对应关系；“法官”判罚“被告”，二者为主体与被判罚对象的对应关系。与题干逻辑关系一致，当选。\nC项：“球员”在“球场”打球，二者是地点与主体的对应关系，与题干逻辑关系不一致，排除。\nD项：“患者”接受“手术”，而不是参与“手术”，且“护士”不能判罚“患者”，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":73,"missingImage":false},{"qid":"17900967","cat":"类比推理","stem":"戏剧：壁画：生活","options":{"A":"陈设：衣饰：性格","B":"字形：字音：情感","C":"文章：书法：人品","D":"时针：钟表：时间"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“戏剧”和“壁画”是两种不同的艺术形式，二者为并列关系中的反对关系；“戏剧”和“壁画”都能够反映“生活”，前两个词分别与第三个词构成反映对象的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“陈设”和“衣饰”是两种不同的外在表现，二者为并列关系中的反对关系；“陈设”和“衣饰”都能够反映“性格”，前两个词分别与第三个词构成反映对象的对应关系。与题干逻辑关系一致，当选。\nB项：“字形”指字的形体，“字音”指字的读音，二者为并列关系中的反对关系，但二者均不能反映“情感”，与题干逻辑关系不一致，排除。\nC项：“文章”和“书法”是两种不同的艺术作品，二者为并列关系中的反对关系，但“书法”不能反映“人品”，与题干逻辑关系不一致，排除。\nD项：“时针”是“钟表”的组成部分，二者为包容关系中的组成关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":74,"missingImage":false},{"qid":"17900968","cat":"类比推理","stem":"海军装备：军事装备：维护","options":{"A":"田径比赛：跳高比赛：举行","B":"舞蹈表演：艺术表演：观赏","C":"购车补贴：购房补贴：发放","D":"数字贸易：新兴贸易：互惠"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“海军装备”是一种“军事装备”，二者为包容关系中的种属关系；“维护海军装备”“维护军事装备”，第三个词与前两个词分别构成动宾关系。\n第二步：判断选项词语间逻辑关系。\nA项：“跳高比赛”是一种“田径比赛”，二者为包容关系中的种属关系，但词语顺序与题干相反，与题干逻辑关系不一致，排除。\nB项：“舞蹈表演”是一种“艺术表演”，二者为包容关系中的种属关系；“观赏舞蹈表演”“观赏艺术表演”，第三个词与前两个词分别构成动宾关系。与题干逻辑关系一致，当选。\nC项：“购车补贴”和“购房补贴”是两种不同的补贴，二者为并列关系，与题干逻辑关系不一致，排除。\nD项：“数字贸易”是一种“新兴贸易”，二者为包容关系中的种属关系；“互惠”是贸易的特点，第三个词与前两个词分别构成属性对应关系。与题干逻辑关系不一致，排除。\n故正确答案为B。","no":75,"missingImage":false},{"qid":"17900969","cat":"类比推理","stem":"实践成果：阶段成果：理论成果","options":{"A":"经济创新：文化创新：政治创新","B":"阅读辅导：读写辅导：写作辅导","C":"环岛旅行：红色旅行：太空旅行","D":"物质文明：现代文明：精神文明"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n根据获取途径的不同，成果可分为“实践成果”和“理论成果”，二者为矛盾关系；“阶段成果”指一定时间或任务阶段取得的工作成果，与“实践成果”和“理论成果”分别构成交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：创新可分为“经济创新”“文化创新”“政治创新”等，三者为并列关系，与题干逻辑关系不一致，排除。\nB项：“读写辅导”是针对阅读、写作开展的辅导，由“阅读辅导”和“写作辅导”组成，第二个词与第一、三个词分别构成组成关系，与题干逻辑关系不一致，排除。\nC项：根据旅行的目的地不同，旅行可分为“环岛旅行”“太空旅行”等，二者为反对关系，与题干逻辑关系不一致，排除。\nD项：根据形式不同，文明可分为“物质文明”和“精神文明”，二者为矛盾关系；“现代文明”与“物质文明”和“精神文明”分别构成交叉关系。与题干逻辑关系一致，当选。\n故正确答案为D。","no":76,"missingImage":false},{"qid":"5919649","cat":"类比推理","stem":"杞人忧天 之于 （    ） 相当于  （    ） 之于 自不量力","options":{"A":"庸人自扰；螳臂当车","B":"局促不安；蜉蝣撼树","C":"叶公好龙；夜郎自大","D":"郑人买履；自以为是"},"answer":"A","explanation":"逐一代入选项。\nA项：“杞人忧天”借指为不必要忧虑的事情而忧虑，“庸人自扰”指本来没有问题而自己瞎着急或自找麻烦，二者为近义关系；“螳臂当车”比喻不正确估计自己的力量，去做办不到的事情，必然招致失败，“自不量力”指不能正确估计自己的力量（多指做力不能及的事情），二者为近义关系。前后逻辑关系一致，当选。\nB项：“杞人忧天”借指为不必要忧虑的事情而忧虑，“局促不安”的意思是拘谨不自然，形容举止拘束，心中不安，二者无明显逻辑关系；“蜉蝣撼树”比喻通过贬低他人来抬高自己，“自不量力”指不能正确估计自己的力量（多指做力不能及的事情），二者无明显逻辑关系。前后逻辑关系不一致，排除。\nC项：“杞人忧天”借指为不必要忧虑的事情而忧虑，“叶公好龙”比喻说是爱好某事物，其实并不真爱好，二者无明显逻辑关系；“夜郎自大”指妄自尊大，“自不量力”指不能正确估计自己的力量（多指做力不能及的事情），二者为近义关系。前后逻辑关系不一致，排除。\nD项：“杞人忧天”借指为不必要忧虑的事情而忧虑，“郑人买履”指照搬条文，不考虑客观实际的教条做法，二者无明显逻辑关系；“自以为是”指认为自己的看法和做法都正确，不接受别人的意见，“自不量力”指不能正确估计自己的力量（多指做力不能及的事情），二者无明显逻辑关系。前后逻辑关系不一致，排除。\n故正确答案为A。","no":77,"missingImage":false},{"qid":"5919655","cat":"类比推理","stem":"牙齿磨损 之于 （    ） 相当于 （    ） 之于 经济活力","options":{"A":"年龄大小；用电总量","B":"牙齿脱落；社会效益","C":"骨骼磨损；发展指数","D":"坚硬食物；经济疲软"},"answer":"A","explanation":"逐一代入选项。\nA项：牙齿磨损程度可以反映年龄大小，用电总量大小可以反映经济活力，二者均为对应关系，前后逻辑关系一致，当选；\nB项：牙齿磨损可能会导致牙齿脱落，二者为因果关系；经济活力是指一国一定时期内经济中总供给和总需求的增长速度及其潜力，社会效益是指各种经济活动及科学技术、教育、文学、艺术等在社会上产生的非经济性效果和利益，与经济活力为并列关系，前后逻辑关系不一致，排除；\nC项：牙齿磨损不是一种骨骼磨损，二者无明显逻辑关系；经济活力是指一国一定时期内经济中总供给和总需求的增长速度及其潜力，而发展指数是指衡量某一领域发展程度的一种数据标准，经济活力会影响发展指数，二者为对应关系，前后逻辑关系不一致，排除；\nD项：食用坚硬食物会导致牙齿磨损，二者为因果关系；经济疲软说明经济活力低，二者为对应关系，前后逻辑关系不一致，排除。\n故正确答案为A。","no":78,"missingImage":false},{"qid":"17900833","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"26f9d571c878\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图形中出现类似天平的示意图，将两端小元素转化为质量关系，可得：\u003cimg data-k=\"1b758df92627\" style=\"max-width:32px\">&gt;\u003cimg data-k=\"70c17bf0fe05\" style=\"max-width:41px\">，\u003cimg data-k=\"1b178e556f68\" style=\"max-width:38px\">&gt;\u003cimg data-k=\"1bb1ea5c9d8b\" style=\"max-width:35px\">，\u003cimg data-k=\"2f02c05e9c03\" style=\"max-width:39px\">&gt;\u003cimg data-k=\"1b178e556f68\" style=\"max-width:38px\">，\u003cimg data-k=\"1bb1ea5c9d8b\" style=\"max-width:35px\">&gt;\u003cimg data-k=\"1b758df92627\" style=\"max-width:32px\">，\u003cimg data-k=\"2f02c05e9c03\" style=\"max-width:39px\">&gt;\u003cimg data-k=\"70c17bf0fe05\" style=\"max-width:41px\">。串联后可得：\u003cimg data-k=\"2f02c05e9c03\" style=\"max-width:39px\">&gt;\u003cimg data-k=\"1b178e556f68\" style=\"max-width:38px\">&gt;\u003cimg data-k=\"1bb1ea5c9d8b\" style=\"max-width:35px\">&gt;\u003cimg data-k=\"1b758df92627\" style=\"max-width:32px\">&gt;\u003cimg data-k=\"70c17bf0fe05\" style=\"max-width:41px\">。故问号处图形中两个小元素也应符合此规律，排除B、C两项。继续观察发现，题干图形中天平依次倾向于左侧、右侧、左侧、右侧、左侧、？，故问号处图形中的天平应倾向于右侧，只有D项符合。\n故正确答案为D。","no":79,"missingImage":false},{"qid":"16095253","cat":"图形推理","stem":"请从四个选项中选出最恰当的一项填入问号处，使题干图形呈现一定的规律性。\n\u003cimg data-k=\"0b2d03218e85\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成基本相同，题干每幅图形都是由直线和小白圆组成，考虑功能元素的标记作用。观察发现，小白圆只标记1条线，且若把每幅图的最外面那条线当作第1条线，那么小白圆依次标记在第1条线、第2条线、第3条线、第4条线、第5条线上，故？处图形中的小白圆应只标记在第6条线上，只有B项符合。\n故正确答案为B。","no":80,"missingImage":false},{"qid":"12334416","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"f21fba396ab8\" style=\"max
