0px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"若想展开图还原成正方体后，存在同一个公共顶点的三个面上的数字之和为8，需要“面1、面2、面5”或者“面1、面3、面4”相邻，即三个面存在公共点。\nA项：面1和面4为相对面，故面1、面3和面4不存在公共点；面2和面5为相对面，故面1、面2和面5不存在公共点。两种情况均不符合要求，排除。\nB项：面1和面4为相对面，故面1、面3和面4不存在公共点；面2和面5为相对面，故面1、面2和面5不存在公共点。两种情况均不符合要求，排除。\nC项：面1、面2和面5两两相邻，即三个面存在公共点，符合要求，当选。\nD项：面3和面4为相对面，故面1、面3和面4不存在公共点；面1和面5为相对面，故面1、面2和面5不存在公共点。两种情况均不符合要求，排除。\n故正确答案为C。","no":90,"missingImage":false},{"qid":"16095252","cat":"图形推理","stem":"将下列三棱锥的展开图还原成三棱锥后，有一个与其他三个不一样，请把它找出来。\n\u003cimg data-k=\"9c0f870784da\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查空间重构。在选项展开图中，以只有两个扇形的面上的空白顶点作为起始点，进行顺时针画边，如下图所示，逐一分析选项。\n\u003cimg data-k=\"0b4611233408\" style=\"max-width:600px\">\nA项：选项中右边两个面为图案一样的面，边1不挨着其中任意一个面中的小扇形。\nB项：选项中最左边和最右边两个面为图案一样的面，边1不挨着其中任意一个面中的小扇形。\nC项：选项中最上边和左下边为图案一样的面，边1不挨着其中任意一个面中的小扇形。\nD项：选项中最上边和右下边为图案一样的面，边1与最上边面中的小扇形有公共点。\n本题为选非题，故正确答案为D。","no":91,"missingImage":false},{"qid":"17900755","cat":"图形推理","stem":"下列立体图形的视图不可能是所给四个选项中的哪一个？\n\u003cimg data-k=\"cd1d7894abe9\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查三视图。B、C、D三项：如下图所示，按图中箭头方向观察，均可看到，排除。\n\u003cimg data-k=\"d03d9b8dc399\" style=\"max-width:450px\">\nA项：如下图所示，按图中箭头方向观察立体图形，圆柱与下方立体图形的连接处应有一条横线，故该项不是题干立体图形的视图，当选。\n\u003cimg data-k=\"c249f3462bac\" style=\"max-width:300px\">\n本题为选非题，故正确答案为A。","no":92,"missingImage":false},{"qid":"12304865","cat":"逻辑判断","stem":"一只鸟除非两翼健壮并以共同的力量来推动身体，否则它不能飞向天空。根据以上陈述，可以推出以下哪些结论？\n①一只鸟如果两翼健壮并以共同的力量来推动身体，那么它能够飞向天空\n②一只鸟如果能够飞向天空，那么它两翼健壮并以共同的力量来推动身体\n③一只鸟若两翼不健壮或不能以共同的力量来推动身体，那么它不能飞向天空\n④一只鸟如果不能飞向天空，那么它两翼不健壮或不能以共同力量来推动身体","options":{"A":"①②","B":"②③","C":"③④","D":"②④"},"answer":"B","explanation":"第一步：翻译题干。\n题干翻译为：飞向天空\u003cimg data-k=\"a37757d411ef\">两翼健壮 且 以共同的力量来推动身体。\n第二步：逐一分析选项。\n①翻译为：两翼健壮 且 以共同的力量来推动身体\u003cimg data-k=\"a37757d411ef\">飞向天空，是对题干逻辑关系的肯后，肯后无必然结论，无法推出；\n②翻译为：飞向天空\u003cimg data-k=\"a37757d411ef\">两翼健壮 且 以共同的力量来推动身体，是对题干逻辑关系的肯前，肯前必肯后，可以推出；\n③翻译为：\u003cimg data-k=\"0be436194951\">两翼健壮 或 \u003cimg data-k=\"0be436194951\">以共同的力量来推动身体\u003cimg data-k=\"b3a86cb4840e\">飞向天空，是对题干逻辑关系的否后，否后必否前，可以推出；\n④翻译为：\u003cimg data-k=\"0be436194951\">飞向天空\u003cimg data-k=\"b3a86cb4840e\">两翼健壮 或 \u003cimg data-k=\"0be436194951\">以共同的力量来推动身体，是对题干逻辑关系的否前，否前无必然结论，无法推出。\n综上所述，②③可以推出，对应B项。\n故正确答案为B。","no":93,"missingImage":false},{"qid":"10975246","cat":"逻辑判断","stem":"某学校模拟派出骨干教师指导山区教师人才培训项目。甲、乙、丙、丁四位教师积极报名参加，学校决定从他们四人中挑选出若干人员，考虑到各方面情况，派出人员要符合以下要求：\n①只有乙参加，甲才参加；\n②如果丙参加，那么丁不参加；\n③如果乙参加，那么丙也参加。\n根据以上信息，以下哪项不可能为真？","options":{"A":"甲和丙参加","B":"丁参加，乙不参加","C":"甲和丁参加","D":"甲参加，丁不参加"},"answer":"C","explanation":"第一步：翻译题干条件。\n（1）甲\u003cimg data-k=\"a37757d411ef\">乙；\n（2）丙\u003cimg data-k=\"b3a86cb4840e\">丁；\n（3）乙\u003cimg data-k=\"a37757d411ef\">丙。\n将（1）（2）（3）串联可得：（4）甲\u003cimg data-k=\"a37757d411ef\">乙\u003cimg data-k=\"a37757d411ef\">丙\u003cimg data-k=\"b3a86cb4840e\">丁。\n第二步：根据题干条件进行推理。\n根据条件（4）可知，甲参加时丁一定不参加，因此C项不可能为真。\n本题为选非题，故正确答案为C。","no":94,"missingImage":false},{"qid":"2579002","cat":"逻辑判断","stem":"马王堆汉墓由长沙国丞相及其妻儿三座墓组成，在墓群中出土的帛书《道德经》与传世本《道德经》存在文字出入，如帛书中的“道可道非恒道，名可名非恒名”，在传世本中为“道可道非常道，名可名非常名”，考虑到古代存在帝王讳名制，有学者据此断定帛书《道德经》至少问世于汉文帝刘恒在位（公元前179-公元前157年）之前。\n以下哪项为真，可以支持该学者？","options":{"A":"长沙国丞相死于公元前186年","B":"长沙国丞相的妻儿死于公元前168年之后","C":"“道可道非恒道，名可名非恒名”与“道可道非常道，名可名非常名”同义","D":"帝王讳名制在秦朝从宗族内部扩展到社会整体，汉朝继承了秦朝的许多制度"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：帛书《道德经》至少问世于汉文帝刘恒在位（公元前179-公元前157年）之前。\n论据：在墓群中出土的帛书《道德经》与传世本《道德经》存在文字出入，如帛书中的“道可道非恒道，名可名非恒名”，在传世本中为“道可道非常道，名可名非常名”，考虑到古代存在帝王讳名制。\n本题论点指出帛书《道德经》至少问世于刘恒在位之前，论据是帛书《道德经》并没有避讳刘恒的名字，且古代存在帝王讳名制，论点论据话题紧密，可以理解为话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：指出长沙国丞相死于公元前186年，即在刘恒在位之前去世，但根据去世时间无法判断墓中物品的问世时间，不能加强，排除；\nB项：指出长沙国丞相的妻儿死于公元前168年之后，无法确定死亡时间，且根据去世时间无法判断墓中物品的问世时间，不能加强，排除；\nC项：指出帛书《道德经》与传世本《道德经》的两句话含义相同，无法确定“恒”改为“常”的原因，也无法确定帛书《道德经》的问世时间，话题不一致，不能加强，排除；\nD项：指出帝王讳名制是秦朝的制度，而汉朝继承了秦朝的许多制度，即汉朝很可能存在帝王讳名制，而帛书《道德经》中没有避讳刘恒的名字，那就很可能出现在汉文帝刘恒在位之前，有利于论点的成立，补充论据，当选。\n故正确答案为D。","no":95,"missingImage":false},{"qid":"2172762","cat":"逻辑判断","stem":"近年来，V国巴沙鱼因在进口时已完成分割、切块、去刺等工序，加工成本比国产黑鱼低，一直是制作酸菜鱼的重要原料。但今年酸菜鱼市场对V国巴沙鱼的需求减弱，其份额逐渐被国产黑鱼占据。\n以下哪项为真，最能解释上述现象？","options":{"A":"随着国产黑鱼产、供、销体系完善，其价格降低","B":"V国巴沙鱼进入中国需要经有关部门食品安全检测，需较长时间","C":"过去几年爆火的以V国巴沙鱼为原料的酸菜鱼预制菜今年销售份额降低","D":"以国产黑鱼为原料的酸菜鱼味道更鲜美，受到对价格不敏感的消费者喜爱"},"answer":"A","explanation":"第一步：找出题干矛盾。\nV国巴沙鱼加工成本比国产黑鱼低，一直是制作酸菜鱼的重要原料，但今年酸菜鱼市场对V国巴沙鱼的需求减弱，其份额逐渐被国产黑鱼占据。\n第二步：逐一分析选项。\nA项：该项指出国产黑鱼价格降低了，之前对V国巴沙鱼需求强是因为加工成本低，而现在随着国产黑鱼价格的降低，V国巴沙鱼逐渐失去价格优势，因此酸菜鱼市场就会减少对V国巴沙鱼的需求，其份额逐渐被价格降低的国产黑鱼占据，可以解释题干矛盾，当选；\nB项：该项指出V国巴沙鱼进入中国需要较长的检测时间，但该问题一直存在，无法解释为何“今年”酸菜鱼市场对V国巴沙鱼的需求减弱，其份额逐渐被国产黑鱼占据，无法解释题干矛盾，排除；\nC项：该项指出今年以V国巴沙鱼为原料的酸菜鱼预制菜销售份额降低，可以导致对V国巴沙鱼的一部分需求减弱，但不能解释为什么其份额逐渐被国产黑鱼占据，无法解释题干矛盾，排除；\nD项：该项指出以国产黑鱼为原料的酸菜鱼味道更鲜美，受到对价格不敏感的消费者喜爱，但该情况一直存在，不只出现在“今年”，且无法判断“对价格不敏感的消费者”数量多少，是否可以代表全部消费者，无法解释题干矛盾，排除。\n故正确答案为A。","no":96,"missingImage":false},{"qid":"17900831","cat":"逻辑判断","stem":"人体总能量代谢主要由静息代谢水平和活动能量代谢水平决定。静息代谢指人体在静止状态下消耗的能量，活动能量代谢指人们在日常活动或运动状态下所消耗的能量。近年来，M市成年人的总能量代谢水平呈现下降趋势。有人据此认为，M市成年人的静息代谢水平近年来也呈下降趋势。\n以下哪项如果为真，最能支持上述人士的观点？","options":{"A":"近年来，M市成年人逐渐重视饮食结构均衡，减少各种高能量食物摄入","B":"近年来，M市成年人开始重视身体锻炼，平均每天的锻炼时长有所增加","C":"近年来，M市成年人劳动强度普遍降低，许多人不再从事高强度体力劳动","D":"近年来，M市成年人总能量代谢水平下降幅度比活动能量代谢水平下降幅度小"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：M市成年人的静息代谢水平近年来也呈下降趋势。\n论据：人体总能量代谢主要由静息代谢水平和活动能量代谢水平决定。近年来，M市成年人的总能量代谢水平呈现下降趋势。\n本题论点说的是“静息代谢水平呈下降趋势”，即部分下降，而论据说的是“总能量代谢水平呈下降趋势”，即整体下降，加强优先考虑补充论据，即说明另一部分（活动能量代谢水平）的情况。\n第二步：逐一分析选项。\nA项：该项指出M市的成年人减少高能量食物摄入，而论点说的是静息代谢水平呈下降趋势，话题不一致，无法加强，排除。\nB项：该项指出M市的成年人平均每天的锻炼时长有所增加，说明活动能量代谢水平在上升，结合论据中总能量代谢水平下降，可以推出静息代谢水平下降，补充论据，可以加强，当选。\nC项：该项指出M市的成年人劳动强度降低，说明活动能量代谢水平在下降，结合论据中总能量代谢水平下降，无法推出静息代谢水平一定下降了（静息代谢水平也可能上升了，但上升幅度小于活动能量代谢水平的下降幅度），为不明确项，无法加强，排除。\nD项：该项指出M市成年人总能量代谢水平下降幅度比活动能量代谢水平下降幅度小，当整体下降的幅度小于一个因素下降的幅度时，另一个因素的变化情况无法确定，为不明确项，无法加强，排除。\n故正确答案为B。","no":97,"missingImage":false},{"qid":"16095272","cat":"类比推理","stem":"甲：小明十岁就能用英语与英国人流利对话，语言天赋真是出类拔萃。\n乙：小明跟着父母在英国住了两年，能流利对话不足为奇。\n以下哪项与题干对话方式最为相似？","options":{"A":"甲：这款热水器的价格比市面上常见的热水器高出一倍，太不划算了\n乙：这款产品用的是航天级别的材料，在同材质热水器中性价比很高","B":"甲：小李以前容易冲动，进入职场一年后稳重多了\n乙：小李承担了单位大量重要工作，变得稳重一点理所当然","C":"甲：小张的数学一直很好，进入高中后，物理、化学等科目的学习很轻松\n乙：数学强调科学思维，掌握科学思维的人学习物理、化学当然没有难度","D":"甲：小刘在过去的一年中连续犯下三起盗窃案，真是无可救药\n乙：人非圣贤，孰能无过，相信在经过改造之后他会洗心革面"},"answer":"A","explanation":"第一步：分析题干逻辑关系。\n甲根据“小明十岁就能用英语与英国人流利对话”的现象，得出“小明的语言天赋出类拔萃”的结论，而乙提出“小明跟着父母在英国住了两年”的理由来解释现象，用“能流利对话不足为奇”来否定甲的结论。\n第二步：逐一分析选项。\nA项：甲根据“这款热水器的价格比市面上常见的热水器高出一倍”的现象，得出“这款热水器不划算”的结论，乙提出“这款产品用的是航天级别的材料”的理由来解释现象，用“在同材质热水器中性价比很高”来否定甲的结论，与题干对话方式一致，当选；\nB项：甲提出“小李以前容易冲动，进入职场一年后稳重多了”的结论，乙提出“小李承担了单位大量重要工作，变得稳重一点理所当然”的理由来解释甲的结论，与题干对话方式不一致，排除；\nC项：甲提出“小张的数学一直很好，进入高中后，物理、化学等科目的学习很轻松”的结论，乙提出“数学强调科学思维，掌握科学思维的人学习物理、化学当然没有难度”的理由来解释甲的结论，与题干对话方式不一致，排除；\nD项：甲根据“小刘在过去的一年中连续犯下三起盗窃案”的现象，得出“小刘无可救药”的结论，乙得出的观点“相信在经过改造之后小刘会洗心革面”是一种预测，而非事实，用预测否定甲的结论，与题干对话方式不一致，排除。\n故正确答案为A。","no":98,"missingImage":false},{"qid":"12304873","cat":"逻辑判断","stem":"卖早点、修家电、配钥匙·····老百姓家门口的社区商业，是以社区居民为服务对象、服务半径为步行15分钟左右范围内的商业形态。近年来，许多城市大力推进社区商业建设，以更好地满足居民的消费需求。不过，也有专家担忧，家门口商业服务的完善，在给居民生活带来便利的同时可能也会使快递业逐步萎缩。\n以下哪项如果为真，最能缓解上述专家的担忧？","options":{"A":"为了方便居民，很多城市推进社区商业建设时，都将快递驿站作为社区商业的重要组成部分","B":"社区商业主要提供汽车保养、幼儿托管等服务类业态，社区购物在居民整体购物消费中占比很少","C":"社会经济发展必然包含新旧行业的更迭，社区商业作为新的消费增长点，吸纳了大量传统行业的劳动者就业","D":"许多大型商超组建了自己的配送车队，可为周边5公里范围内居民提供商品一小时送达服务"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：家门口商业服务的完善，在给居民生活带来便利的同时可能也会使快递业逐步萎缩。\n论据：无。\n本题提问为“缓解上述专家的担忧”即削弱上述专家的担忧，且只有论点没有论据，削弱优先考虑削弱论点，即说明家门口商业服务的完善不会使快递业逐步萎缩。\n第二步：逐一分析选项。\nA项：该项说的是很多城市将快递驿站作为社区商业的重要组成部分，说明家门口商业服务完善后快递驿站依然很重要，可能不会使快递业逐步萎缩，削弱论点，可以削弱，保留；\nB项：该项说的是社区购物在居民整体购物消费中占比很少，说明社区商业的建设对居民原有的购物方式影响不大，也就不会使快递业逐步萎缩，削弱论点，可以削弱，保留；\nC项：该项说的是社区商业吸纳了大量传统行业的劳动者就业，是在说社区商业促进了就业，并未提及对快递业的影响，为无关项，无法削弱，排除；\nD项：该项说的是许多大型商超提供限时配送服务，大型商超不属于社区商业，提供的配送服务不属于快递业，为无关项，无法削弱，排除。\n对比A、B两项，A项说的是快递驿站的重要性，但是快递驿站重要并不能明确说明快递业的情况，而B项明确说明了对居民原有的购物方式影响不大，即不会对快递业有影响，综合对比，B项比A项更加明确，因此优选B项。\n故正确答案为B。","no":99,"missingImage":false},{"qid":"10975252","cat":"逻辑判断","stem":"某学校举办田径运动会，所有参加800米跑的运动员都参加了100米跑，所有参加100米跑的运动员都参加了跳高，有些参加跳远的运动员参加了投掷链球，所有参加跳远的运动员都没有参加跳高。\n根据以上陈述，不能推出以下哪项？","options":{"A":"所有参加800米跑的运动员都参加了跳高","B":"所有参加投掷链球的运动员都没有参加跳高","C":"所有参加跳远的运动员都没有参加100米跑","D":"有些参加800米跑的运动员参加了跳远"},"answer":"D","explanation":"第一步：翻译题干。\n（1）参加800米跑\u003cimg data-k=\"a37757d411ef\">参加100米跑；\n（2）参加100米跑\u003cimg data-k=\"a37757d411ef\">参加跳高；\n（3）有的参加跳远\u003cimg data-k=\"a37757d411ef\">参加投掷链球；\n（4）参加跳远\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">参加跳高。\n将（1）（2）（4）串联可得：（5）参加800米跑\u003cimg data-k=\"a37757d411ef\">参加100米跑\u003cimg data-k=\"a37757d411ef\">参加跳高\u003cimg data-k=\"b3a86cb4840e\">参加跳远。\n第二步：逐一分析选项。\nA项：翻译为“参加800米跑\u003cimg data-k=\"a37757d411ef\">参加跳高”，“参加800米跑”是对条件（5）的肯前，肯前必肯后，可以推出，排除。\nB项：翻译为“参加投掷链球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">参加跳高”，将条件（3）换位可得“有的参加投掷链球\u003cimg data-k=\"a37757d411ef\">参加跳远”，与条件（4）串联可得“有的参加投掷链球\u003cimg data-k=\"a37757d411ef\">参加跳远\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">参加跳高”，“有的”无法推出“所有”，即“所有参加投掷链球的运动员都没有参加跳高”可能为真，也可能为假，保留。\nC项：翻译为“参加跳远\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">参加100米跑”，“参加跳远”是对条件（5）的否后，否后必否前，可以推出，排除。\nD项：翻译为“有的参加800米跑\u003cimg data-k=\"a37757d411ef\">参加跳远”，与条件（5）矛盾，无法推出，保留。\n对比B、D两项，B项可能为真，D项一定为假，择优选D项。\n本题为选非题，故正确答案为D。","no":100,"missingImage":false},{"qid":"16095269","cat":"逻辑判断","stem":"评价某份试卷中的试题质量通常有难度和区分度等指标，一道单选题的难度通常用正确选择试题答案的人数与参加测验的总人数的比值来表示。区分度指的是试题对考生实际水平的区分程度和区分的有效性，一道单选题的区分度指数D的计算公式为：\u003cimg data-k=\"f287c3f35c71\">，其中\u003cimg data-k=\"22da3014f620\">为高分组（试卷总得分排在前27%的考生）该题的难度，\u003cimg data-k=\"2a02174672ba\">为低分组（试卷总得分排在后27%的考生）该题的难度。\n根据以上陈述，可以推出以下哪项？","options":{"A":"一道难度为1的单选题区分度指数为0.1","B":"任一单选题的区分度指数不可能为负值","C":"一道难度为0.27的单选题的最大区分度指数为0.5","D":"一道单选题的难度也可以表示为该题的平均得分与该题分值的比值"},"answer":"D","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：若一道单选题的难度为1，意味着参加测验的所有人都答对了，则高分组和低分组的人都答对了，说明高分组该题的难度\u003cimg data-k=\"27763a9e80e2\">，低分组该题的难度\u003cimg data-k=\"8d8b04b1f92c\">，则区分度指数D=0，而不是0.1，该项表述错误，排除；\nB项：若有一道题高分组答对的人数少于低分组，此时高分组该题的难度小于低分组该题的难度，即\u003cimg data-k=\"ae365f3f845a\">，则这道题的区分度指数D为负数，该项表述错误，排除；\nC项：若一道单选题的难度为0.27，说明正确选择试题答案的人数与参加测验的总人数的比值为0.27，假设参加测验的总人数为100人，则正确选择试题答案的人数为27人，并且此时高分组与低分组均各有27人，如果想要计算最大区分度指数，则需要使\u003cimg data-k=\"f287c3f35c71\">的值尽可能大，即\u003cimg data-k=\"22da3014f620\">尽可能取最大值，同时\u003cimg data-k=\"2a02174672ba\">尽可能取最小值，即需要使正确选择试题答案的27人均属于高分组，即\u003cimg data-k=\"b9b90e796c1d\">\u003cimg data-k=\"74922c1f054b\">，同时，低分组全部答错，即\u003cimg data-k=\"52d3a145e31e\">\u003cimg data-k=\"f8e5a145aad6\">，则此时这道题的最大区分度指数\u003cimg data-k=\"2d3c406b1d09\">，而不是0.5，该项表述错误，排除；\nD项：\u003cimg data-k=\"dece090481fc\">\u003cimg data-k=\"c87ed9d21de2\">\u003cimg data-k=\"84af52015324\">\u003cimg data-k=\"c8fa11d9bdb2\">，该项表述正确，当选。\n故正确答案为D。","no":101,"missingImage":false},{"qid":"12304874","cat":"逻辑判断","stem":"一项研究发现，成年小白鼠去除一个关键生物钟基因后，昼夜节律完全消失，虽然生活质量有所下降，但寿命并未受到显著影响，心血管健康状况甚至有所改善。据此，研究人员推断昼夜节律缺失对健康的危害可能没有我们想象得那么大。\n回答以下哪个问题最有助于评价上述研究人员所做出的推断？","options":{"A":"成年小白鼠去除生物钟基因后出现的心血管情况改善是否会延长小白鼠的寿命","B":"成年小白鼠去除生物钟基因之后的休息时间是否与未去除之前的休息时间相同","C":"成年小白鼠去除生物钟基因后的寿命和心血管健康状况能否代表整体健康状况","D":"成年小白鼠去除生物钟基因之后的生活质量是否会影响小白鼠的整体健康状况"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：昼夜节律缺失对健康的危害可能没有我们想象得那么大。\n论据：成年小白鼠去除一个关键生物钟基因后，昼夜节律完全消失，虽然生活质量有所下降，但寿命并未受到显著影响，心血管健康状况甚至有所改善。\n本题论点讨论的是“昼夜节律缺失”和“整体健康状况”之间的关系，论据讨论的是“昼夜节律缺失”和“寿命、心血管健康状况”之间的关系，二者话题不一致，且提问方式为“最有助于”评价研究人员的推断，可以考虑搭桥，即建立“寿命、心血管健康状况”与“整体健康状况”之间的关系。\n第二步：逐一分析选项。\nA项：该项讨论的是“心血管健康状况”与“寿命”之间的关系，而不是“寿命、心血管健康状况”与“整体健康状况”之间的关系，即使心血管状况改善能够延长寿命，仍无法得知整体健康状况如何，无助于评价研究人员的推断，排除；\nB项：该项讨论的是“去除生物钟基因前后的休息时间”，论点说的是“昼夜节律缺失”和“整体健康状况”的关系，话题不一致，无助于评价研究人员的推断，排除；\nC项：该项讨论的是“寿命、心血管健康状况”与“整体健康状况”之间的关系，如果寿命和心血管健康状况能代表整体健康状况，则说明研究人员的推断成立，有助于评价研究人员的推断，当选；\nD项：该项讨论的是“生活质量”与“整体健康状况”之间的关系，但研究人员是通过“寿命”与“心血管健康状况”得出的论点，不如C项更有助于评价研究人员的推断，排除。\n故正确答案为C。","no":102,"missingImage":false},{"qid":"16095268","cat":"定义判断","stem":"迭代学习：指学习者通过不间断的目标训练，更好地理解学习内容，不断提升技能完善自身能力的学习方式。\n下列不属于迭代学习的是：","options":{"A":"小周参加专业技能大赛，实操环节丢了不少分，他不断强化训练，再次参加就获得了二等奖。又经过一年训练，综合技能有了显著提高，自己也十分自信","B":"学习者要熟练掌握数学运算需经历数年大致相同的过程，先是加减法，之后是乘除法，接下来是混合运算，逐渐进入更高阶的运算","C":"李教授经常深入社区举办科普讲座，最初因为专业性过强，听众很少，后来引入了市民关注的鲜活案例，听众越来越多；最近又融入了不少优秀传统文化元素，感染力越来越强","D":"多家公司推出了各自的AI自然语言处理模型，有的只能与人进行简单对话，有的能在收到指令后几秒钟内交出一份质量不错的作业，有些已经能够针对各种问题给出比较专业的建议"},"answer":"D","explanation":"第一步：找出定义关键词。\n“学习者”、“通过不间断的目标训练”、“更好地理解学习内容，不断提升技能完善自身能力”。\n第二步：逐一分析选项。\nA项：小周通过不断强化训练，从一开始参加专业技能大赛的实操环节丢不少分，到再次参加获得二等奖，到最后综合技能显著提高，符合“学习者”、“通过不间断的目标训练”、“更好地理解学习内容，不断提升技能完善自身能力”，符合定义，排除；\nB项：学习者通过不断的学习，掌握的数学运算从一开始的加减法、乘除法到混合运算，到最后进入更高阶的运算，符合“学习者”、“通过不间断的目标训练”、“更好地理解学习内容，不断提升技能完善自身能力”，符合定义，排除；\nC项：李教授的科普讲座从一开始的专业性强、听众少到引入市民关注的案例后听众越来越多，到最后融入文化元素、感染力越来越强，符合“学习者”、“通过不间断的目标训练”、“更好地理解学习内容，不断提升技能完善自身能力”，符合定义，排除；\nD项：多家公司推出各自的AI自然语言处理模型，有的只能简单与人对话，有的能写作业，有的已能给出比较专业的建议，这些是不同AI对于自然语言处理的不同结果，并没有体现AI不间断学习的过程，不符合“学习者”、“通过不间断的目标训练”、“更好地理解学习内容，不断提升技能完善自身能力”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":103,"missingImage":false},{"qid":"10975250","cat":"定义判断","stem":"钝感力：指在工作、生活中能够尽快摆脱消极情绪或困扰，从容应对外部压力，或者冷静面对个人成绩，坚持既定目标的心理防御机制。\n下列不属于钝感力的是：","options":{"A":"谷先生每次回顾自己的创业经历，都把成功归因于百折不挠的韧劲：无论碰到多少磨难，始终没有被困难打倒，一直沿着目标不断地向前","B":"邱奶奶已经90岁，眼不花，耳不聋，腿脚麻利。她的体会是：人生在世，不如意事十之八九，迅速忘掉不愉快的事，保持乐观情绪就能长寿","C":"杜先生从去年开始坚持在健身中心锻炼，提高身体素质，缓解工作压力。现在再也不像以前那样容易感冒，即使工作到深夜也不觉得累","D":"钟先生性格稳重，听到表扬从不得意忘形，遇到批评也不垂头丧气，心无旁骛地钻研业务，近几年取得了很多令人羡慕的专业成就"},"answer":"C","explanation":"第一步：找出定义关键词。\n“能够尽快摆脱消极情绪或困扰，从容应对外部压力”“冷静面对个人成绩，坚持既定目标”。\n第二步：逐一分析选项。\nA项：谷先生创业时始终没有被困难打倒，一直沿着目标不断地向前，说明其没有因困难长期处于消极情绪之中，符合“能够尽快摆脱消极情绪或困扰，从容应对外部压力”，符合定义，排除。\nB项：邱奶奶认为自己长寿的秘诀是迅速忘掉不愉快的事，保持乐观情绪，符合“能够尽快摆脱消极情绪或困扰，从容应对外部压力”，符合定义，排除。\nC项：杜先生坚持健身，身体素质明显提高，未提及心理和思想方面的感受，不符合“能够尽快摆脱消极情绪或困扰，从容应对外部压力”“冷静面对个人成绩，坚持既定目标”，不符合定义，当选。\nD项：钟先生听到表扬从不得意忘形，符合“冷静面对个人成绩，坚持既定目标”，遇到批评也不垂头丧气，符合“能够尽快摆脱消极情绪或困扰，从容应对外部压力”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":104,"missingImage":false},{"qid":"10975251","cat":"定义判断","stem":"潮汐式管理：指管理者根据时间的不同，差异化、精细化管理特定公共资源，最大限度开发和利用现有资源，有效提升公众幸福指数的管理方法。\n下列不属于潮汐式管理的是：","options":{"A":"某市在主城区的一些特定道路上划定特殊停车位，实行“夜停晨走”制度，老城区停车位不足的问题得到了有效缓解","B":"某街道对摆摊经营实行定时定点画线管理，商贩按指定时间、地点出摊，既不影响交通，又方便了周围居民生活","C":"每年的旅游旺季，某景区附近的居民小区让外地游客免费使用地下停车场车位，大家在网上对此纷纷点赞","D":"某市实行居民电动汽车充电桩分时电价政策，峰谷收费标准不同。高峰时段按照正常标准，低谷时段则按照不同的优惠幅度收费"},"answer":"C","explanation":"第一步：找出定义关键词。\n“管理者根据时间的不同”、“差异化、精细化管理特定公共资源”、“最大限度开发和利用现有资源，有效提升公众幸福指数”。\n第二步：逐一分析选项。\nA项：某市划定特殊停车位，实行“夜停晨走”制度，符合“管理者根据时间的不同”、“差异化、精细化管理特定公共资源”，停车位不足的问题得到了有效缓解，符合“最大限度开发和利用现有资源，有效提升公众幸福指数”，符合定义，排除。\nB项：某街道对摆摊经营实行定时定点画线管理，符合“管理者根据时间的不同”、“差异化、精细化管理特定公共资源”，商贩出摊既不影响交通又方便了周围居民生活，符合“最大限度开发和利用现有资源，有效提升公众幸福指数”，符合定义，排除。\nC项：某居民小区让外地游客免费使用地下停车场车位，该举措是小区做的，没有提及管理者管理公共资源，不符合“管理者根据时间的不同”、“差异化、精细化管理特定公共资源”，并且只是免费使用了车位，体现不出对资源的最大限度开发，不符合“最大限度开发和利用现有资源，有效提升公众幸福指数”，不符合定义，当选。\nD项：某市实行居民电动汽车充电桩分时电价政策，峰谷收费标准不同，符合“管理者根据时间的不同”、“差异化、精细化管理特定公共资源”，低谷时段优惠收费，符合“最大限度开发和利用现有资源，有效提升公众幸福指数”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":105,"missingImage":false},{"qid":"10975253","cat":"定义判断","stem":"城市漫游：指按照预定主题和路线，漫步城市街区，在向导带领下深度体验城市变迁或历史文化的旅游方式。\n下列属于城市漫游的是：","options":{"A":"韩先生周末带外地同学游览本市的步行街——河西大道，聊得口干舌燥，买了两杯竹筒奶茶，在“我在河西大道很想你”路牌下拍了很多照片","B":"小方周六日经常把年迈的父母接到城里游玩。由于父母腿脚不太利索，一天通常只游玩一两个景点。周围邻居都夸小方很孝顺","C":"在外漂泊多年的任女士今年回到了故乡，昔日一览无余的小城现在到处高楼林立，为了寻找童年的记忆，她已经走遍了这里的大街小巷","D":"某地旅行社推出了主打“像本地人一样行走在运河边”的新产品，三四个小时的穿城徒步让游客累得抬不起腿，大家仍觉得意犹未尽"},"answer":"D","explanation":"第一步：找出定义关键词。\n“漫步城市街区”、“在向导带领下”、“深度体验城市变迁或历史文化”。\n第二步：逐一分析选项。\nA项：韩先生带外地同学游览步行街，并不是向导带领，不符合“在向导带领下”，且只是在路牌下拍照，没有深度体验城市变迁或历史文化，不符合“深度体验城市变迁或历史文化”，不符合定义，排除。\nB项：小方父母是在小方的陪同下游玩景点，不符合“在向导带领下”，且游玩的景点不确定是否在城市街区，不符合“漫步城市街区”，不符合定义，排除。\nC项：任女士回到故乡并自己走遍了大街小巷，并没有向导带领，不符合“在向导带领下”，不符合定义，排除。\nD项：某旅行社推出了穿城徒步的产品，且该产品让游客像本地人一样体验当地文化，符合“漫步城市街区”、“在向导带领下”、“深度体验城市变迁或历史文化”，符合定义，当选。\n故正确答案为D。","no":106,"missingImage":false},{"qid":"10975254","cat":"定义判断","stem":"数字游民：指工作时间不受限制，地域可以自主选择，利用网络数字手段完成本职工作的从业人员。\n下列属于数字游民的是：","options":{"A":"小雷辞职后游走在不同的城市，白天在市区游玩特色街区，晚上到热闹的广场跟着市民一起跳舞，随时随地向天南地北的粉丝直播，月收入比以前多得多","B":"康女士居住在很远的小区，每天通勤时间差不多需要三四个小时，工作十分辛苦。最近，她的居家办公申请得到了批准，不用天天去公司打卡了","C":"黄先生年初被公司派驻到某山区工作，闲暇之余利用微信公众号帮助当地乡亲销售土特产，并通过网络众筹建起了雪乡旅舍，有时亲自担任导游。默默无闻的小山村很快变成了远近闻名的旅游村","D":"潮玩设计师周先生到新公司后，再也不担心迟到早退。昨天也许还是短裤、T恤和凉鞋，明天就换成了密不透风的户外运动装。他要做的只是每天晚上将自己的灵感、新想法报告给部门主管"},"answer":"A","explanation":"第一步：找出定义关键词。\n“工作时间不受限制”、“地域可以自主选择”、“利用网络数字手段完成本职工作”。\n第二步：逐一分析选项。\nA项：小雷作为自媒体从业者，游走在不同城市，符合“地域可以自主选择”，随时随地向粉丝直播，说明其工作并不受时间的限制，且利用互联网完成工作，符合“工作时间不受限制”、“利用网络数字手段完成本职工作”，符合定义，当选。\nB项：康女士因通勤时间很长申请了居家办公，说明其工作地点虽然是家里但还是受公司管理，工作时间受到限制，不符合“工作时间不受限制”，不符合定义，排除。\nC项：黄先生被公司派驻到某山区工作，说明其工作地点比较固定，不符合“地域可以自主选择”，不符合定义，排除。\nD项：周先生的新工作不需要考虑迟到早退，但仍需要每天晚上汇报工作，说明其工作时间仍受到一定的限制，不符合“工作时间不受限制”，同时，未明确体现周先生可自由选择办公地点，不符合“地域可以自主选择”，不符合定义，排除。\n故正确答案为A。","no":107,"missingImage":false},{"qid":"10975256","cat":"定义判断","stem":"代际责任：指在不超出自身能力的前提下，相邻两代人的一方向另一方主动提供经济帮扶、生活照顾、健康保障、精神抚慰等各种支持的行为。\n下列不属于代际责任的是：","options":{"A":"苏女士把父母接到身边后，忙乎了一个多月，带着父母熟悉小区健身器材，到社区老年活动中心打牌下棋，在公园找人聊天，终于帮他们重新找到了“组织”","B":"邵先生和妻子一直在城里忙于打拼，女儿正在读小学。每到寒暑假，邵先生的父母都会专程赶到城里，把孙女接回农村老家痛痛快快地玩上整个假期","C":"罗奶奶像无数为孩子婚事发愁的长辈一样，每到周末就去附近公园的相亲角浏览展板上的照片、简历，觉得合适的就记下基本情况、电话号码。虽然快三十岁的孙女根本不着急，她却一直乐此不疲","D":"毛先生喜欢第一时间把遇到的趣事分享到家族微信群，却很少得到期待的回应，一怒之下退了群。后来，儿子又把他请回，还邀约了几位有同样爱好的长辈，群里逐渐热闹起来，他也时不时点赞或评论几句"},"answer":"C","explanation":"第一步：找出定义关键词。\n“不超出自身能力的前提下”、“相邻两代人”、“一方向另一方主动提供经济帮扶、生活照顾、健康保障、精神抚慰等各种支持”。\n第二步：逐一分析选项。\nA项：苏女士将把父母接到身边，且主动协助他们适应环境、找到“组织”，符合“相邻两代人”、“一方向另一方主动提供经济帮扶、生活照顾、健康保障、精神抚慰等各种支持”，符合定义，排除。\nB项：邵先生的父母会在寒暑假时专程把孙女接回农村老家，这减轻了忙于工作的邵先生夫妇的负担，符合“相邻两代人”、“一方向另一方主动提供经济帮扶、生活照顾、健康保障、精神抚慰等各种支持”，符合定义，排除。\nC项：罗奶奶乐此不疲地去相亲角浏览照片、简历以帮助孙女完成婚事，但这属于祖孙之间的支持，不符合“相邻两代人”，不符合定义，当选。\nD项：毛先生因不能得到期待的回应而生气退群，儿子请回他，且邀约了几位有同样爱好的长辈，使父亲情绪好转，符合“相邻两代人”、“一方向另一方主动提供经济帮扶、生活照顾、健康保障、精神抚慰等各种支持”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":108,"missingImage":false},{"qid":"16095273","cat":"定义判断","stem":"消费者教育：指通过有计划的宣传或培训，引导民众更新消费观念，掌握消费技能，培养消费习惯，使其形成产品购买的合理预期。\n下列属于消费者教育的是：","options":{"A":"丁先生根据亲身经历写出了一份新疆自驾游的攻略，包括具体线路、沿途景点门票、酒店、美食等，还推荐了几个口碑很好的当地导游，发布到了多家网站上，大批网友经过验证后给予了好评","B":"某网站的帖子图文并茂地分析了各种榨汁机、豆浆机、养生壶、料理机的优缺点，推荐了一款黑科技“破壁机”，详细介绍了它的材质、功能、操作方法以及明星的使用体验，最后还附上了商家的二维码","C":"某购物网站邀请网络写手连载长篇小说，让员工发动亲朋好友评论转发，大批粉丝追更到凌晨，网站贴心地附上了缓解眼睛疲劳的新产品供大家免费试用，两三个月后，访问量和营业额都有了显著提高","D":"某知名品牌菜刀拍蒜后刀身断裂的视频在多个社交网站引发网友吐槽，厂家回应称视频中的菜刀属于高科技新品，硬度高，材质脆，受横向冲击时容易断裂，不适合拍蒜"},"answer":"B","explanation":"第一步：找出定义关键词。\n“有计划的宣传或培训”、“引导民众更新消费观念，掌握消费技能，培养消费习惯”、“形成产品购买的合理预期”。\n第二步：逐一分析选项。\nA项：丁先生写出新疆自驾游攻略，目的是为了方便大家更便捷的出游，并非为了引导民众更新消费观念，不符合“引导民众更新消费观念，掌握消费技能，培养消费习惯”，不符合定义，排除；\nB项：某网站分析了一些小家电的优缺点，让消费者了解相关产品的不同性能，符合“有计划的宣传或培训”，其中推荐了一款“破壁机”，并附上商家的二维码，目的是为了让消费者选择购买，符合“引导民众更新消费观念，掌握消费技能，培养消费习惯”、“形成产品购买的合理预期”，符合定义，当选；\nC项：某购物网站邀请网络写手连载长篇小说，并为熬夜追更的粉丝免费提供缓解眼睛疲劳的新产品，目的是为了提高网站的访问量和营业额，并非为了引导民众更新消费观念，不符合“引导民众更新消费观念，掌握消费技能，培养消费习惯”，不符合定义，排除；\nD项：厂家对菜刀质量问题的回应，目的是为了解释菜刀因拍蒜而刀身断裂的原因，并非为了引导民众更新消费观念，不符合“引导民众更新消费观念，掌握消费技能，培养消费习惯”，不符合定义，排除。\n故正确答案为B。","no":109,"missingImage":false},{"qid":"16095297","cat":"定义判断","stem":"灯谜是独具特色的中华优秀传统文化，可以根据谜面和谜底的关系分为多种类型。其中，摘顶格指去掉谜底的共同部首就扣合谜面；秋千格指从后往前读谜底就扣合谜面；白头格指谜底的第一个字作谐音读就扣合谜面。\n根据上述定义，对下列三个灯谜的类型判断正确的是：\n（1）谜面：黄昏（打一地名）。谜底：洛阳\n（2）谜面：郎貌（打一花名）。谜底：芙蓉\n（3）谜面：思量（打一文具）。谜底：算盘","options":{"A":"（1）秋千格，（2）白头格，（3）摘顶格","B":"（1）白头格，（2）摘顶格，（3）秋千格","C":"（1）白头格，（2）秋千格，（3）摘顶格","D":"（1）秋千格，（2）摘顶格，（3）白头格"},"answer":"B","explanation":"第一步：找出定义关键词。\n摘顶格：“去掉谜底的共同部首就扣合谜面”；\n秋千格：“从后往前读谜底就扣合谜面”；\n白头格：“谜底的第一个字作谐音读就扣合谜面”。\n第二步：逐一分析选项。\n（1）“洛”谐音“落”，太阳落下就是黄昏，符合“谜底的第一个字作谐音读就扣合谜面”，属于白头格。\n（2）“芙蓉”去掉共同部首“艹”即为夫容，也就是郎貌，符合“去掉谜底的共同部首就扣合谜面”，属于摘顶格。\n（3）“算盘”从后往前读即为“盘算”，“盘算”有思量的意思，符合“从后往前读谜底就扣合谜面”，属于秋千格。\n综上，（1）为白头格，（2）为摘顶格，（3）为秋千格。\n故正确答案为B。","no":110,"missingImage":false}]}],"count":46,"answerable":46,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2023年第二季度末，全国跨省联网定点医疗机构54.3万家。其中，住院费用跨省联网定点医疗机构7.4万家，环比增长10.2%；普通门诊费用跨省联网定点医疗机构15.1万家，环比增长28.9%；门诊慢特病相关治疗费用跨省联网定点医疗机构3.9万家，环比增长75.9%；跨省联网定点零售药店27.9万家，环比增长12.8%。\u003c/p>\u003cp>        2023年第二季度，全国跨省联网异地就医费用直接结算2854.1万人次，减少个人垫付394.1亿元，环比分别增长46.0%和32.6%。其中，住院费用跨省联网直接结算282.6万人次，减少个人垫付354.3亿元，环比分别增长32.9%和31.8%；门诊费用跨省联网直接结算2571.6万人次，减少个人垫付39.8亿元，环比分别增长47.6%和40.1%。\u003c/p>\u003cp>        2023年第二季度，全国门诊费用跨省联网直接结算中，普通门诊费用跨省联网直接结算1886.7万人次，减少个人垫付26.5亿元，环比分别增长49.6%和36.8%。门诊慢特病相关治疗费用跨省联网直接结算59.7万人次，减少个人垫付5.5亿元，环比分别增长89.5%和97.9%。跨省联网定点零售药店直接结算625.2万人次，减少个人垫付7.8亿元，环比分别增长39.0%和24.6%。通过国家统一线上备案渠道成功办理备案177.0万人次，环比增长3.5%。\u003c/p>","questions":[{"qid":"5919124","cat":"增长" /* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);

  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};

  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){

  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
