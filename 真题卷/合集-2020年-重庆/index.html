003cimg data-k=\"c1beececd683\">必为3的倍数，对应C项，\u003cimg data-k=\"3f20133cb110\">时，\u003cimg data-k=\"7d3a247758cf\">，\u003cimg data-k=\"be9e720c3998\">，符合题意，排除。 \n本题为选非题，故正确答案为D。","no":65,"missingImage":false},{"type":"question","qid":"2616068","cat":"数学运算","stem":"某学习平台的学习内容由观看视频、阅读文章、收藏分享、论坛交流、考试答题五个部分组成。某学员要先后学完这五个部分，若观看视频和阅读文章不能连续进行，该学员学习顺序的选择有：","options":{"A":"24种","B":"72种","C":"96种","D":"120种"},"answer":"B","explanation":"根据题意，观看视频和阅读文章不连续，可用插空法，先安排其它三部分学习内容，顺序有\u003cimg data-k=\"a6bfbd5c06d2\">种，这三部分学习内容共形成四个空，再插入不能连续进行的观看视频和阅读文章这两部分，有\u003cimg data-k=\"5d8244de707d\">种，因此总的学习顺序的选择有\u003cimg data-k=\"e1472cfe320e\">种。\n故正确答案为B。","no":66,"missingImage":false},{"type":"question","qid":"2616076","cat":"数学运算","stem":"甲乙丙丁四人通过手机的位置共享，发现乙在甲正南方向2公里处，丙在乙北偏西\u003cimg data-k=\"c1ec48dc2933\">方向2公里处，丁在甲北偏西\u003cimg data-k=\"9db8d28c1db3\">方向。若丁与甲、丙的距离相等，则该距离为：","options":{"A":"1公里","B":"\u003cimg data-k=\"00851e5575b3\">公里","C":"\u003cimg data-k=\"53018f93ac55\">公里","D":"2公里"},"answer":"B","explanation":"根据题意，四人的位置关系如下图所示：\n\u003cimg data-k=\"2a85e3c16d1f\" style=\"max-width:596px\">\n因为丙在乙北偏西\u003cimg data-k=\"c1ec48dc2933\">方向，且乙与甲、丙的距离均为2公里，所以甲乙丙三人的位置构成等边三角形，则甲到丙的距离为2公里。丁在甲北偏西\u003cimg data-k=\"9db8d28c1db3\">方向，则丁-甲-丙构成的角度为\u003cimg data-k=\"1028faf35364\">，且丁与甲、丙的距离相等，则甲丁丙三人的位置构成等腰直角三角形，因此所求的距离为\u003cimg data-k=\"5eb126184ff4\">公里。\n故正确答案为B。","no":67,"missingImage":false},{"type":"question","qid":"2616079","cat":"数学运算","stem":"某电商平台每隔5千米有一座仓库，共有A、B、C、D四座仓库，图中数字表示各仓库库存货物的吨数。现需要把所有的货物集中存放在其中某一个仓库中，如果每吨货物运输1千米需要运费3元，要使运费最少，则需将货物集中到哪座仓库？\n\u003cimg data-k=\"4c8669070e3c\" style=\"max-width:700px\">","options":{"A":"仓库A","B":"仓库B","C":"仓库C","D":"仓库D"},"answer":"C","explanation":"方法一：根据题意直接代入选项计算总运费。\n若将货物集中到仓库A，则运费为\u003cimg data-k=\"714a711bdffd\">\u003cimg data-k=\"2c7c992983a5\">元;\n若将货物集中到仓库B，则运费为\u003cimg data-k=\"c3e04d913c0d\">\u003cimg data-k=\"69b193782b78\">元；\n若将货物集中到仓库C，则运费为\u003cimg data-k=\"8e720650d09c\">\u003cimg data-k=\"707f77badfcf\">元；\n若将货物集中到仓库D，则运费为\u003cimg data-k=\"3e4c2f9ab787\">\u003cimg data-k=\"69616e208c30\">元；\n则运费最少的是将货物集中到仓库C。\n方法二：货物集中问题，只与各个仓库的存放量有关，与距离及运费无关。先考虑AB打包，CD打包，显然前者存放量（30吨）不如后者（40吨）多，因此AB的货物均需要向CD方向移动，先移到仓库C中。此时仓库C共有货物\u003cimg data-k=\"9ab1aebbf92a\">吨，仓库D有25吨，则仓库D向仓库C移动，最后货物都集中到仓库C中。\n故正确答案为C。","no":68,"missingImage":false},{"type":"question","qid":"2616143","cat":"数学运算","stem":"村民陶某承包一块长方形种植地，他将地分割成如图所示的4个小长方形，在A、B、C、D四块长方形土地上分别种植西瓜、花生、地瓜、水稻。其中长方形A、B、C的周长分别是20米、24米、28米，那么长方形D的最大面积是：\n\u003cimg data-k=\"a90ea58194d1\" style=\"max-width:358px\">","options":{"A":"42平方米","B":"49平方米","C":"64平方米","D":"81平方米"},"answer":"C","explanation":"如下图所示，假设标注的四条边长分别为\u003cimg data-k=\"f82036fad5c4\">、\u003cimg data-k=\"b0b4715579ef\">、\u003cimg data-k=\"8f718a1d31a8\">、\u003cimg data-k=\"404fa585d81b\">，已知长方形A、B、C的周长分别是20米、24米、28米，根据长方形周长\u003cimg data-k=\"1c5ef02fbd80\">，可得\u003cimg data-k=\"3cd05f9e1987\">\u003cimg data-k=\"0d3e039fbd3a\">\u003cimg data-k=\"202a04808e52\">，化简得\u003cimg data-k=\"2ad551beb585\">，即\u003cimg data-k=\"7c51929707e4\">，解得\u003cimg data-k=\"846737d5ba32\">。而c、d分别代表长方形D的长和宽，\u003cimg data-k=\"cdb9873791e7\">和一定时，当且仅当\u003cimg data-k=\"e8e86061d2da\">时面积最大，此时\u003cimg data-k=\"317b05770fe1\">米，故长方形D的最大面积\u003cimg data-k=\"a6c0face8bb7\">平方米。\n\u003cimg data-k=\"87f761fbd9ba\" style=\"max-width:422px\">\n故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"2616072","cat":"数学运算","stem":"野外生存需要用一个简易的圆锥型过滤器（如下图所示）装满溪水进行过滤。过滤器的底面直径为20cm，高为6cm。问全部过滤完毕后，在不考虑损耗的情况下，可使底面半径为5cm，高为15cm的圆柱型容器的水面高度达到：\n\u003cimg data-k=\"1d45fc292962\" style=\"max-width:179px\">","options":{"A":"4cm","B":"6cm","C":"8cm","D":"12cm"},"answer":"C","explanation":"根据圆锥体积公式\u003cimg data-k=\"8b10f5c2eb7b\">可知，过滤溪水体积为\u003cimg data-k=\"2d88c8ed5378\">\u003cimg data-k=\"744d78616e9b\">。根据圆柱体积公式\u003cimg data-k=\"457443ebf2e7\">可得，圆柱型容器的水面高度达到\u003cimg data-k=\"e63ebbd020b3\">cm。\n故正确答案为C。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"2616108","cat":"图形推理","stem":"把下面六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"62fb5b1df835\" style=\"max-width:700px\">","options":{"A":"①②④，③⑤⑥","B":"①③④，②⑤⑥","C":"①③⑥，②④⑤","D":"①④⑤，②③⑥"},"answer":"D","explanation":"本题为分组分类题目。每个正方体中均出现一个三角形阴影，观察发现，图①④⑤中的三角形均为等腰三角形，图②③⑥中的三角形均不是等腰三角形。即①④⑤一组，②③⑥一组。\n故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"2616105","cat":"图形推理","stem":"把下面六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"29670f176ac6\" style=\"max-width:583px\">","options":{"A":"①⑤⑥，②③④","B":"①②⑤，③④⑥","C":"①②④，③⑤⑥","D":"①③⑤，②④⑥"},"answer":"A","explanation":"元素组成不同，优先考虑属性规律。对称、曲直均无明显规律，考虑开闭性。图①⑤⑥均为带有封闭区域的图形，图②③④均为全开放的图形，即①⑤⑥为一组，②③④为一组。\n故正确答案为A。","no":72,"missingImage":false},{"type":"question","qid":"2616003","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"a9b75cf330e6\" style=\"max-width:363px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相同，优先考虑位置规律。九宫格图形优先按横行来看，观察第一行图形，发现图1通过顺时针旋转\u003cimg data-k=\"96fd88320156\">得到图2，图2通过左右翻转得到图3。第二行验证，同样满足此规律。因此问号处的图形应该是第三行中的图2通过左右翻转得到，四个选项中只有C项符合。\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"2615983","cat":"图形推理","stem":"从所给的四个选项中，选择最适合的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"4e17ea20b133\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，优先考虑属性规律。题干图形规整，考虑轴对称。观察对称轴，题干对称轴数量依次为2、1、2、1、3，无明显规律。属性无规律，考虑数量规律。再次观察图形发现，图1和图5出现“相交圆”，即笔画数的特征图，题干笔画数依次为1、1、2、2、1，无规律。题干图形线与线交叉明显，考虑交点数量。题干交点数依次为2、3、4、5、6、？，即“？”处应选择交点数为7的图形。选项交点数依次为18、8、7、8，C项符合。\n故正确答案为C。","no":74,"missingImage":false},{"type":"question","qid":"2616106","cat":"图形推理","stem":"如下图所示，左侧为大立方体，右侧为其部分立体截面，问哪个选项能够与其拼成完整的大立方体：\n\n\u003cimg data-k=\"27c7dd5250cf\" style=\"max-width:607px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查立体拼合，解题原则为凹凸一致。根据题干要求，可知正确选项和右侧图形拼合后应为左侧正方体。如下图所示，将选项C进行转动后，可与题干右侧图形拼合成左侧正方体。\n\u003cimg data-k=\"c230e9f77e5f\" style=\"max-width:141px\">\n故正确答案为C。","no":75,"missingImage":false},{"type":"question","qid":"2615963","cat":"类比推理","stem":"鸳：鸯","options":{"A":"蚱蜢：蝗虫","B":"白猫：黑猫","C":"雄鸡：雌鸡","D":"红男：绿女"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n鸳鸯是一种鸟类，鸳指雄鸟，鸯指雌鸟，二者为并列关系，且为并列关系中的矛盾关系。\n第二步：判断选项词语间逻辑关系。\nA项：蚱蜢和蝗虫的关系较有争议，多数资料显示二者为全同关系，与题干逻辑关系不一致，排除；\nB项：白猫和黑猫是并列关系，但为并列关系中的反对关系，与题干逻辑关系不一致，排除；\nC项：雄鸡和雌鸡是并列关系，且为并列关系中的矛盾关系，与题干逻辑关系一致，当选；\nD项： 红男绿女，意思是指穿着各种漂亮服装的青年男女，二者为并列关系，但不是矛盾关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":76,"missingImage":false},{"type":"question","qid":"2615964","cat":"类比推理","stem":"售后：品控","options":{"A":"数据：科学","B":"融资：风投","C":"龙骨：地板","D":"听证：监管"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n售后需要品控，二者为对应关系，且品控不只是售后阶段存在，所有阶段都需要品控。\n第二步：判断选项词语间逻辑关系。\nA项：科学研究需要数据，但两词顺序与题干相反，与题干逻辑关系不一致，排除；\nB项：风投是一种融资方式，二者为种属关系，与题干逻辑关系不一致，排除；\nC项：龙骨是用来支撑造型、固定结构的一种建筑材料，龙骨用来支撑地板，与题干逻辑关系不一致，排除；\nD项：听证需要监管，二者为对应关系，且监管不只是听证阶段存在，所有阶段都需要监管，与题干逻辑关系一致，当选。\n故正确答案为D。","no":77,"missingImage":false},{"type":"question","qid":"2615965","cat":"类比推理","stem":"牵牛花：喇叭花","options":{"A":"乞巧节：七夕节","B":"七巧板：橡皮泥","C":"人行道：车行道","D":"防腐剂：添加剂"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n牵牛花又称喇叭花，二者为全同关系。\n第二步：判断选项词语间逻辑关系。\nA项：乞巧节又称七夕节，二者为全同关系，与题干逻辑关系一致，当选；\nB项：七巧板和橡皮泥均为儿童玩具，二者为并列关系，与题干逻辑关系不一致，排除；\nC项：人行道和车行道为并列关系，与题干逻辑关系不一致，排除；\nD项：防腐剂是添加剂的一种，二者为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":78,"missingImage":false},{"type":"question","qid":"2616137","cat":"类比推理","stem":"牡丹：洛阳：郑州","options":{"A":"荷花：青岛：济南","B":"木芙蓉：成都：成都","C":"菊花：太原：石家庄","D":"凤凰花：厦门：福州"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n牡丹是洛阳市花，郑州是河南省的省会城市，洛阳和郑州均为河南省的城市。\n第二步：判断选项词语间逻辑关系。\nA项：荷花是济南市花，青岛是山东省的城市，济南是山东省的省会城市，与题干逻辑关系不一致，排除；\nB项：木芙蓉是成都市花，成都是四川省的省会城市，但成都和成都为同一个城市，与题干逻辑关系不一致，排除；\nC项：菊花是太原市花，太原是山西省的省会城市，石家庄是河北省的省会城市，太原和石家庄是不同省份的城市，与题干逻辑关系不一致，排除；\nD项：凤凰花又叫凤凰木，为厦门市树，厦门是福建省的城市，福州是福建省的省会城市，与题干逻辑关系一致，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"2615969","cat":"类比推理","stem":"空运：海运：运输","options":{"A":"平装：精装：装帧","B":"货轮：客轮：邮轮","C":"晚会：聚会：集会","D":"试飞：试航：航天"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n空运和海运是两种不同的运输方式，前两词为并列关系，并与第三词构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：平装和精装是两种不同的装帧方式，前两词为并列关系，并与第三词构成种属关系，与题干逻辑关系一致，当选；\nB项：货轮和客轮分别是用来运载货物和乘客的船舶，二者为并列关系，邮轮指的是在海洋中航行的旅游客轮，所以邮轮是客轮的一种，与货轮不构成种属关系，与题干逻辑关系不一致，排除；\nC项：晚会是指在晚上举行的集会，多以文娱活动为主，聚会是指人数较多，有明确主题的集体活动，二者不构成并列关系，与题干逻辑关系不一致，排除；\nD项：试飞是指在飞机交付使用前进行的试验性飞行，试航是指飞机、船只等在正式航行前进行的试验性航行，二者和航天没有必然关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":80,"missingImage":false},{"type":"question","qid":"2615968","cat":"类比推理","stem":"初伏：中伏：末伏","options":{"A":"火星：木星：土星","B":"大雨：小雨：谷雨","C":"上旬：中旬：下旬","D":"大暑：小暑：处暑"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n初伏、中伏、末伏，三者之间是并列关系，并且三者按照三伏天的时间先后顺序排列，先初伏，再中伏，最后末伏。\n第二步：判断选项词语间逻辑关系。\nA项：火星、木星、土星是太阳系八大行星中的三个行星，三者之间是并列关系，但是没有时间先后顺序，与题干逻辑关系不一致，排除；\nB项：大雨、小雨是两种不同的天气，谷雨是二十四节气之一，三者不构成并列关系，与题干逻辑关系不一致，排除；\nC项：上旬、中旬、下旬，三者之间是并列关系，并且三者按照一个月份的不同时间段的时间先后顺序排列，先上旬，再中旬，最后下旬，与题干逻辑关系一致，当选；\nD项：大暑、小暑、处暑是二十四节气中的三个节气，三者之间是并列关系，但是它们的时间先后顺序应该是先小暑，再大暑，最后处暑，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":81,"missingImage":false},{"type":"question","qid":"2615967","cat":"类比推理","stem":"羊：羊奶：腥膻","options":{"A":"蚕：蚕丝：雪白","B":"蜘蛛：蛛丝：粘缚","C":"蜂：蜂蜜：甘甜","D":"雨燕：燕窝：营养"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n羊奶是羊的产出物，腥膻是羊奶的必然属性，且腥膻是一种味道。\n第二步：判断选项词语间逻辑关系。\nA项：蚕丝是蚕的产出物，但雪白不是蚕丝的必然属性，且雪白也不是一种味道，与题干逻辑关系不一致，排除；\nB项：蛛丝是蜘蛛的产出物，但粘缚是蛛丝的功能，而非属性，与题干逻辑关系不一致，排除；\nC项：蜂蜜是蜂的产出物，甘甜是蜂蜜的必然属性，且甘甜是一种味道，与题干逻辑关系一致，当选；\nD项：燕窝是雨燕科几种金丝燕分泌的唾液及其绒羽混合粘结所筑成的巢穴，而燕窝并非是雨燕直接产出的，且营养也不是一种味道，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":82,"missingImage":false},{"type":"question","qid":"2616134","cat":"类比推理","stem":"十年寒窗：悬梁刺股：囊萤映雪","options":{"A":"七月流火：以荻画地：临池学书","B":"三月肉味：蓝田种玉：程门立雪","C":"一寸光阴：凿壁偷光：闻鸡起舞","D":"一日三秋：卧薪尝胆：铁杆磨针"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n十年寒窗、悬梁刺股和囊萤映雪都是形容刻苦攻读，勤学上进，三者为近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：七月流火指夏去秋来，寒天将至；以荻画地是指用荻杆在地上写字画画；临池学书指刻苦练习书法；三者语义没有关系，与题干逻辑关系不一致，排除；\nB项：三月肉味形容专心一意，全神贯注；蓝田种玉比喻男女获得了称心如意的美好姻缘；程门立雪指尊敬师长，重视自己的教育事业；三者语义没有关系，与题干逻辑关系不一致，排除；\nC项：一寸光阴是指时间非常宝贵；凿壁偷光用来形容家贫而读书刻苦；闻鸡起舞是指听到鸡啼就起来舞剑，比喻有志报国的人及时奋起；三者均形容珍惜时间，勤学刻苦，为近义关系，与题干逻辑关系一致，当选；\nD项：一日三秋比喻分别时间虽短，却觉得很长，形容思念殷切；卧薪尝胆比喻刻苦自励、发奋图强；铁杆磨针比喻只要有决心，肯下工夫，多么难的事情也能做成功；三者语义没有关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":83,"missingImage":false},{"type":"question","qid":"2615970","cat":"类比推理","stem":"了如指掌  对于（    ）相当于（    ）对于  坚固","options":{"A":"知道；铁板一块","B":"明白；坚不可摧","C":"理解；铜墙铁壁","D":"了解；固若金汤"},"answer":"D","explanation":"逐一代入选项。\nA项：“了如指掌”是指对事物了解得非常清楚，“知道”是指有一定的了解和认识，二者为近义关系；“铁板一块”比喻结合紧密、不可分割的整体，“坚固”是指结实牢固，不容易破坏，二者无明显的关系，前后逻辑关系不一致，排除；\nB项：“了如指掌”是指对事物了解得非常清楚，“明白”有知道、了解的意思，二者为近义关系；“坚不可摧”形容非常坚固，与“坚固”为近义关系，前后逻辑关系一致，保留；\nC项：“了如指掌”是指对事物了解得非常清楚，“理解”是指懂、了解，二者为近义关系；“铜墙铁壁”是指防御十分坚固，与“坚固”为近义关系，前后逻辑关系一致，保留；\nD项：“了如指掌”是指对事物了解得非常清楚，与“了解”为近义关系；“固若金汤”形容防守非常坚固，与“坚固”为近义关系，前后逻辑关系一致，保留。\n对比B、C、D三项，题干的“了如指掌”和D项的“固若金汤”都含有比喻义，词语结构更加贴近，D项当选。\n故正确答案为D。","no":84,"missingImage":false},{"type":"question","qid":"2615978","cat":"类比推理","stem":"（    ）对于 世味年来薄似纱 相当于 达观 对于（    ）","options":{"A":"忧郁；前度刘郎今又来","B":"感伤；莫道谗言如浪深","C":"讽刺；道是无晴却有晴","D":"斥责；金陵王气黯然收"},"answer":"B","explanation":"逐一代入选项。\nA项：“世味年来薄似纱”出自南宋陆游的《临安春雨初霁》，体现了诗人对世态炎凉的无奈和客籍京华的蹉跎，与“忧郁”无明显逻辑关系，“前度刘郎今又来”出自唐代刘禹锡的《再游玄都观》，描写的是曾经被排挤的人又回来了，暗寓自己不屈之志，与“达观”无明显逻辑关系，前后逻辑关系不一致，排除；\nB项：“世味年来薄似纱”出自南宋陆游的《临安春雨初霁》，表达了诗人的“感伤”之情，“莫道谗言如浪深”出自唐代刘禹锡的《杂曲歌辞·浪淘沙》，描写的是不要说流言蜚语如同凶恶的浪涛一样令人恐惧，体现了诗人拼搏、乐观的心境，表达了“达观”之情，前后逻辑关系一致，当选；\nC项：“世味年来薄似纱”与“讽刺”无明显逻辑关系，“道是无晴却有晴”出自唐代刘禹锡的《竹枝词二首·其一》，表面是说无晴但还有晴，实际上想表达说是没有感情但其实有情，是运用谐音双关的手法，把天“晴”和爱“情”这两件不相关的事物巧妙地联系起来，表现出初恋少女忐忑不安的微妙感情，与“达观”无明显逻辑关系，前后逻辑关系不一致，排除；\nD项：“世味年来薄似纱”与“斥责”无明显逻辑关系，“金陵王气黯然收”出自唐代刘禹锡的《西塞山怀古》，描写的是东吴的王气黯然消逝，表明国家统一是人心所向，与“达观”无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":85,"missingImage":false},{"type":"question","qid":"2616104","cat":"定义判断","stem":"印象管理是指人试图控制他人对自己形成的印象的过程。一个人留给他人的印象表明了他人对其的知觉、评价，甚至会使他人形成对其的特定应对方式。因而，为了给他人留下好的印象，得到他人好的评价与对待，人会用一种给他人造成特定印象的方式来自我表现。印象管理的运用，尤其要避免某些表演崩溃，包括无意动作、不合时宜的闯入、闹剧等。\n根据上述定义，下列选项最能体现印象管理运用的是：","options":{"A":"沙子龙在夜静人稀时，关好门，舞出一套断魂枪，微微一笑说：“不传不传”","B":"许衡看到人们摘食路边的梨解渴，不为所动，说：“梨虽无主，而吾心有主”","C":"一向沉静温柔的小美在毕业之际，承受不住与同学离别的感伤，突然嚎啕大哭","D":"岳飞的母亲为了激励岳飞奋勇抗金，用针在其背上刺了四个字：“精忠报国”"},"answer":"B","explanation":"第一步：找出定义关键词。\n印象管理：“试图控制他人对自己形成的印象的过程”、“为了给他人留下好的印象······用一种给他人造成特定印象的方式来自我表现”、“避免某些表演崩溃，包括无意动作、不合时宜的闯入、闹剧等”。\n第二步：逐一分析选项。\nA项：沙子龙在夜静人稀时，关门武枪，此时只有他自己，并非是想在他人面前树立自己形象，不符合“试图控制他人对自己形成的印象的过程”，也不符合“为了给他人留下好的印象······用一种给他人造成特定印象的方式来自我表现”，不符合定义，排除； \nB项：“梨虽无主,而吾心有主”的意思是梨虽然没有主人，但是我的心灵是有主见的，对比人们摘食路边的梨解渴的行为，体现了许衡“为了给他人留下好的印象······用一种给他人造成特定印象的方式来自我表现”，也符合“避免某些表演崩溃，包括无意动作”，符合定义，当选；\nC项：一向沉静温柔的小美毕业之际嚎啕大哭，说明在毕业之际，小美的情绪崩溃了，不符合“避免某些表演崩溃”，不符合定义，排除；\nD项：岳飞的母亲为了激励岳飞而刺字，并非是想在他人面前树立自己形象，不符合“试图控制他人对自己形成的印象的过程”，也不符合“为了给他人留下好的印象······用一种给他人造成特定印象的方式来自我表现”，不符合定义，排除。\n故正确答案为B。","no":86,"missingImage":false},{"type":"question","qid":"2615980","cat":"定义判断","stem":"联觉是一种感觉器官受到刺激时引起性质完全不同的其他感觉的现象。它是不同感觉间相互作用的结果，也是一种条件反射现象。联觉现象在所有感觉中都存在，表现有个别差异。在现实生活中，由于某一种事物属性的出现经常伴随着另一种事物属性的出现，这两种事物属性所引起的感觉之间就形成了固定的条件联系。\n根据上述定义，下列选项不属于联觉的是：","options":{"A":"小徐看到涂成蓝色的墙壁，浑身充满凉意","B":"各种菜肴香味飘来，小刘听到了旋律变化","C":"小李对人十分热情，人们都说他好像一团火","D":"看到写在纸上的手机号，小冯感到阵阵发麻"},"answer":"C","explanation":"第一步：找出定义关键词。\n“一种感觉器官受到刺激时引起性质完全不同的其他感觉的现象”。\n第二步：逐一分析选项。\nA项：小徐看到涂成蓝色的墙壁，浑身充满凉意，是视觉受到刺激后引起了触觉的变化，符合“一种感觉器官受到刺激时引起性质完全不同的其他感觉的现象”，符合定义，排除； \nB项：各种菜肴香味飘来，小刘听到了旋律变化，是嗅觉受到刺激后引起了听觉的变化，符合“一种感觉器官受到刺激时引起性质完全不同的其他感觉的现象”，符合定义，排除；\nC项：小李对人十分热情，人们都说他好像一团火，是对小李的整体评价，没有涉及多种感觉，不符合“一种感觉器官受到刺激时引起性质完全不同的其他感觉的现象”，不符合定义，当选；\nD项：看到写在纸上的手机号，小冯感到阵阵发麻，是视觉受到刺激后引起了触觉的变化，符合“一种感觉器官受到刺激时引起性质完全不同的其他感觉的现象”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":87,"missingImage":false},{"type":"question","qid":"2615995","cat":"定义判断","stem":"疼痛共情的偏好性，是指个体对他人疼痛的感知、判断和情绪反应，总是由于个体与他人之间的亲疏远近关系或情感认同程度不同而不同。\n根据上述定义，下列没有体现疼痛共情的偏好性的是（    ）。","options":{"A":"小明看到《西游记》里的白骨精被孙悟空打死，高兴得跳了起来","B":"小张看到外来游客不幸溺水而亡，从此再也不敢去那条河里游泳","C":"小李在看歌剧《白毛女》时跳上戏台拉住喜儿，不让黄世仁抢走","D":"小红听奶奶回忆自己在旧社会的苦日子时，禁不住潸然泪下"},"answer":"B","explanation":"第一步：找出定义关键词。\n“个体对他人疼痛的感知、判断和情绪反应”、“由于个体与他人之间的亲疏远近关系或情感认同程度不同而不同”。\n第二步：逐一分析选项。\nA项：小明看到《西游记》里的白骨精被孙悟空打死，高兴得跳了起来。小明对孙悟空和白骨精的情感认同程度不同，《西游记》中，孙悟空是正面形象，而白骨精是反面形象，通常人们对作品中的正义形象是支持和赞同的，所以小明看到正义获胜会很高兴、很支持，符合“个体对他人疼痛的感知、判断和情绪反应”、“由于个体与他人之间的亲疏远近关系或情感认同程度不同而不同”，符合定义，排除；\nB项：小张看到外来游客不幸溺水而亡，从此再也不敢去那条河里游泳，小张与溺水游客属于陌生的关系，但溺水的不论是谁，小张都不会再去那条河里游泳，没有因为关系或认同感的不同而有区别，而是一种经验教训，不符合“由于个体与他人之间的亲疏远近关系或情感认同程度不同而不同”，不符合定义，当选；\nC项：小李在看歌剧《白毛女》时跳上戏台拉住喜儿，不让黄世仁抢走，歌剧中喜儿的角色让观众怜惜，黄世仁的角色让观众厌恶，因此小李认知上会亲近喜儿，疏远黄世仁，最终跳上戏台阻止，符合“个体对他人疼痛的感知、判断和情绪反应”、“由于个体与他人之间的亲疏远近关系或情感认同程度不同而不同”，符合定义，排除；\nD项：小红听奶奶回忆自己在旧社会的苦日子时，禁不住潸然泪下，小红正因为是她亲近的奶奶曾遭受了痛苦，所以忍不住得哭了，正常来讲大家对苦难的生活都有一定经历和承受力，如果是陌生人或者是讨厌的经历了苦难生活，我们未必会有特别大的情绪反应，符合“个体对他人疼痛的感知、判断和情绪反应”、“由于个体与他人之间的亲疏远近关系或情感认同程度不同而不同”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":88,"missingImage":false},{"type":"question","qid":"2615988","cat":"定义判断","stem":"热传导是介质内无宏观运动时的传热现象，其在固体、液体和气体中均可发生。但严格而言，只有在固体中才是纯粹的热传导，在流体（泛指液体和气体）中又是另外一种情况，流体即使处于静止状态，也会由于温度梯度所造成的密度差而产生自然对流，因此在流体中热对流与热传导可能会同时发生。\n根据上述定义，下列选项不存在热传导现象的是：","options":{"A":"海洋上层高温水体和下层低温水体因温度差而交换","B":"铁棒的一端放入热水中，另一端温度升高","C":"太阳照射，导致地球表面温度升高","D":"在热水中加入冷水，热水变成温水"},"answer":"C","explanation":"第一步：找出定义关键词。\n“介质内无宏观运动”、“传热现象”、“流体中由于温度梯度所造成的密度差”。\n第二步：逐一分析选项。\nA项：海洋内部水体交换，符合“介质内无宏观运动”，海洋上层高温水体和下层低温水体因温度差而交换，符合“传热现象”、“流体中由于温度梯度所造成的密度差”，符合定义，排除； \nB项：铁棒的一端放入热水中，符合“介质内无宏观运动”，热量沿着铁棒传递到另一端，使得温度升高，符合“传热现象”，符合定义，排除；\nC项：太阳照射，使地球表面温度升高，太阳与地球表面之间是真空环境，没有介质，不符合“介质内无宏观运动”，不符合定义，当选；\nD项：热水中加入冷水，符合“介质内无宏观运动”，冷水和热水因温度差而发生热传递，最终变成温水，符合“传热现象”、“流体中由于温度梯度所造成的密度差”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":89,"missingImage":false},{"type":"question","qid":"2615984","cat":"定义判断","stem":"亲环境行为是指个体通过减少或消除自身活动对环境的负面影响以达到改善生态系统结构的行为。它的本质是通过有效减轻环境问题实现环境改善，核心任务是构造环境稳态友好型的社会。\n根据上述定义，下列选项属于亲环境行为的是：","options":{"A":"植树造林","B":"低碳出行","C":"细水长流","D":"围海造田"},"answer":"B","explanation":"第一步：找出定义关键词。\n“个体通过减少或消除自身活动对环境的负面影响”、“改善生态系统结构”。\n第二步：逐一分析选项。\nA项：植树造林是新造或更新森林的生产活动，不符合“个体通过减少或消除自身活动对环境的负面影响”，不符合定义，排除； \nB项：低碳出行是一种降低“碳”的出行方式，符合“个体通过减少或消除自身活动对环境的负面影响”，符合“改善生态系统结构”，符合定义，当选；\nC项：细水长流是指节约使用财物，精细安排，长远打算，与生态环境无关，不符合“个体通过减少或消除自身活动对环境的负面影响”，也不符合“改善生态系统结构”，不符合定义，排除；\nD项：围海造田是把海洋变成陆地、田地，有效利用海洋空间，不符合“个体通过减少或消除自身活动对环境的负面影响”，也不符合“改善生态系统结构”，不符合定义，排除。\n故正确答案为B。\n注——本题出处如下：\n王玉珏的论文《亲环境行为研究综述》中提到：个体亲环境行为可分为四类，其中私人领域的环保行为就包括“使用环保的出行工具”，即本题B项的“低碳出行”。\n\u003cimg data-k=\"b8eccd066136\" style=\"max-width:700px\">","no":90,"missingImage":false},{"type":"question","qid":"2615985","cat":"定义判断","stem":"积极强化是指用某种有吸引力的结果对某一行为进行奖励和肯定，以期在类似条件下重复这一行为。消极强化是指在行为出现时把不愉快的刺激撤销或减少，这样也可以增加行为频率。\n根据上述定义，下列选项属于积极强化的是（    ）。","options":{"A":"君子一日三省其身","B":"杀鸡骇猴以儆效尤","C":"重赏之下必有勇夫","D":"从轻发落戴罪立功"},"answer":"C","explanation":"第一步：找出定义关键词。\n积极强化：“用某种有吸引力的结果”、“对某一行为进行奖励和肯定”、“以期在类似条件下重复这一行为”；\n消极强化：“在行为出现时把不愉快的刺激撤销或减少”、“可以增加行为频率”。\n第二步：逐一分析选项。\nA项：君子一日三省其身，意思是君子多次自觉地检查自己，不符合“对某一行为进行奖励和肯定”，也不符合“在行为出现时把不愉快的刺激撤销或减少”，不符合任何一个定义，排除；\nB项：杀鸡骇猴以儆效尤，意思是用惩罚一个人的办法来警告别人，未体现奖励或减少不愉快的刺激，不符合“对某一行为进行奖励和肯定”，也不符合“在行为出现时把不愉快的刺激撤销或减少”，不符合任何一个定义，排除；\nC项：重赏之下必有勇夫，意思是用重金悬赏，就会有勇于出来干事的人，符合“用某种有吸引力的结果”、“对某一行为进行奖励和肯定”、“以期在类似条件下重复这一行为”，符合“积极强化”定义，当选；\nD项：从轻发落戴罪立功，意思是处罚从宽，争取立下功劳，借以赎罪，不符合“对某一行为进行奖励和肯定”，也不符合“在行为出现时把不愉快的刺激撤销或减少”，不符合任何一个定义，排除。\n故正确答案为C。","no":91,"missingImage":false},{"type":"question","qid":"2616001","cat":"定义判断","stem":"社会计算的内涵包括两个层面：一是社会的计算化，二是计算的社会化。社会的计算化是指通过人们在互联网上留下的海量而且相互关联的数据足迹，对人们的社会活动进行追踪、检索、汇编、计量和运算。计算的社会化则是指互联网创造了一种环境、一个平台，使人们能够广泛地参与计算过程，从而在数据的挖掘、分析和应用等方面获得更高效率。\n根据上述定义，下列现象符合计算的社会化的是（    ）。","options":{"A":"某购物平台根据用户购物经历，定期向用户推荐商品","B":"某手机导航软件能为用户自动生成一个月来的行踪图","C":"全班同学在暑假田野调查结束后合作制成精美的相册","D":"小陈在众筹平台匿名捐款后，受助者上门送来感谢信"},"answer":"D","explanation":"第一步：找出定义关键词。\n社会的计算化：“人们在互联网上留下的海量而且相互关联的数据足迹”、“对人们的社会活动进行追踪、检索、汇编、计量和运算”；\n计算的社会化：“互联网创造了一种环境、一个平台”、“人们能够广泛地参与”、“获得更高效率”。\n第二步：逐一分析选项。\nA项：购物平台根据用户购物经历，符合“人们在互联网上留下的海量而且相互关联的数据足迹”，定期向用户推荐商品，符合“对人们的社会活动进行追踪、检索、汇编、计量和运算”，符合“社会的计算化”定义，不符合“计算的社会化”定义，排除；\nB项：手机导航软件能为用户自动生成一个月来的行踪图，符合“人们在互联网上留下的海量而且相互关联的数据足迹”，符合“对人们的社会活动进行追踪、检索、汇编、计量和运算”，符合“社会的计算化”定义，不符合“计算的社会化”定义，排除；\nC项：全班同学合作制成精美的相册，不符合“互联网创造了一种环境、一个平台”，也不符合“人们在互联网上留下的海量而且相互关联的数据足迹”，不符合任何一个定义，排除；\nD项：小陈在众筹平台匿名捐款,其中众筹平台符合“互联网创造了一种环境、一个平台”、众筹这种方式符合“人们能够广泛地参与”、“获得更高效率”，符合“计算的社会化”定义，当选。\n故正确答案为D。","no":92,"missingImage":false},{"type":"question","qid":"2615992","cat":"定义判断","stem":"外部性是指经济当事人的生产和消费行为对其他经济当事人的生产和消费行为施加的有益或者有害影响的效应。正外部性是指某个经济行为个体的活动使他人或社会受益，而受益者无需花费代价。负外部性是指某个经济行为个体的活动使他人或社会受损，而造成负外部性的人却没有为此承担成本。\n根据上述定义，下列选项属于正外部性的是：","options":{"A":"经过农田的蒸汽机车，喷出火花飞到农民种植的麦穗上","B":"飞速行驶的火车尖锐的汽笛声吓跑在农田吃稻谷的小鸟","C":"某工厂在村庄建起了扶贫车间，为村民就近就业提供便利","D":"某工厂排出了大量废水和有害气体，给周围居民带来健康危害"},"answer":"B","explanation":"第一步：找出定义关键词。\n正外部性：“某个经济行为个体的活动使他人或社会受益”、“受益者无需花费代价”；\n负外部性：“某个经济行为个体的活动使他人或社会受损”、“造成负外部性的人却没有为此承担成本”。\n第二步：逐一分析选项。\nA项：火花飞到农民种植的麦穗上，对植物造成损害，符合“某个经济行为个体的活动使他人或社会受损”，不符合“某个经济行为个体的活动使他人或社会受益”，符合“负外部性”定义，不符合“正外部性”定义，排除；\nB项：尖锐的汽笛声吓跑在农田吃稻谷的小鸟，保护了稻谷，符合“某个经济行为个体的活动使他人或社会受益”，且“受益者无需花费代价”，符合“正外部性”定义，当选；\nC项：某工厂在村庄建起了扶贫车间，为村民就近就业提供便利，符合“某个经济行为个体的活动使他人或社会受益”，但村民到车间工作也需要付出劳动力等成本，不符合“受益者无需花费代价”，不符合任何一个定义，排除；\nD项：某工厂排出了大量废水和有害气体，给周围居民带来健康危害，不符合“某个经济行为个体的活动使他人或社会受益”，不符合“正外部性”定义，排除。\n故正确答案为B。\n注：原文如下：\n\u003cimg data-k=\"8a48b7ea34ee\" style=\"max-width:700px\">","no":93,"missingImage":false},{"type":"question","qid":"2616103","cat":"定义判断","stem":"错觉是完全不符合刺激本身特征的失真的或扭曲事实的知觉经验，生活中，凭知觉经验所作的解释显然是失真的，甚至是错误的。幻觉是在没有相应的外界客观事物直接作用下发生的不真实感知。幻觉具有与真实知觉类似的特点，但它是虚幻的。正常人在某些特殊的状态下，如强烈的情绪体验并伴有生动的想象、回忆，或期待的心情、紧张的情绪，或处于催眠状态，都可能会出现幻觉。在入眠或醒觉状态的过程中，也会发生幻觉。\n根据上述定义，下列属于幻觉的是：","options":{"A":"杯弓有蛇影，草木疑皆兵","B":"相看两不厌，唯有敬亭山","C":"寝兴目存形，遗音犹在耳","D":"蝉噪林逾静，鸟鸣山更幽"},"answer":"C","explanation":"第一步：找出定义关键词。\n错觉：“不符合刺激本身特征”、“失真的或扭曲事实的”、“凭知觉经验所作的解释显然是失真的，甚至是错误的”；\n幻觉：“没有相应的外界客观事物”、“不真实感知”。\n第二步：逐一分析选项。\nA项：杯弓有蛇影，出自东汉学者应劭的《风俗通义·怪神》，意思是将映在酒杯里的弓影误认为蛇；草木疑皆兵，出自《晋书·苻坚载记》，意思是把山上的草木都当做敌兵，符合“不符合刺激本身特征”、“失真的或扭曲事实的”，符合“错觉”定义，不符合“幻觉”定义，排除；\nB项：相看两不厌，唯有敬亭山，出自唐代李白的《独坐敬亭山》，意思是敬亭山和我对视着，谁都看不够，看不厌，看来理解我的只有这敬亭山了，不符合“失真的或扭曲事实的”以及“没有相应的外界客观事物”，不符合任何一个定义，排除；\nC项：寝兴目存形，遗音犹在耳，出自魏晋诗人潘安的《悼亡诗三首》，意思是睡下和起床的时候都还能看到你，你的声音仿佛还在我的耳边，表达了对亡妻深深的思念之情，符合“没有相应的外界客观事物”、“不真实感知”，也能对应题干“在入眠或醒觉状态的过程中”，符合“幻觉”定义，当选；\nD项：蝉噪林逾静，鸟鸣山更幽，出自南朝王籍的《入若耶溪》，意思是蝉声高唱，树林却显得格外宁静，鸟鸣声声，深山里倒比往常更清幽，不符合“失真的或扭曲事实的”以及“没有相应的外界客观事物”，不符合任何一个定义，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"2615991","cat":"定义判断","stem":"社会收缩是指人类聚落中人口持续流失，由此引发相应地区经济社会环境和文化在空间上的衰退过程。根据收缩行为是否是聚落行为主体主动采取的规划策略或管理措施，可以分为主动社会收缩和被动社会收缩。\n根据上述定义，下列选项属于主动社会收缩的是（    ）。","options":{"A":"某市因疏解核心区功能导致城区人口下降","B":"2019年我国春运人口迁移规模近30亿人次","C":"某产煤大县因资源枯竭导致就业吸纳能力下降","D":"某制造业基地因产业升级导致房屋空置率居高不下"},"answer":"A","explanation":"第一步：找出定义关键词。\n社会收缩：“人类聚落中人口持续流失，由此引发相应地区经济社会环境和文化在空间上的衰退过程”；\n主动社会收缩：“收缩行为是聚落行为主体主动采取的规划策略或管理措施”；\n被动社会收缩：“收缩行为不是聚落行为主体主动采取的规划策略或管理措施”。\n第二步：逐一分析选项。\nA项：某市疏解核心区功能是主动的行为，符合“收缩行为是聚落行为主体主动采取的规划策略或管理措施”，城区人口下降，符合“人类聚落中人口持续流失”，符合“主动社会收缩”定义，当选；\nB项：春运人口大规模迁移，只是人口转移，不符合“人类聚落中人口持续流失”，不符合“社会收缩”定义，排除；\nC项：某产煤大县资源枯竭不是主动的行为，不符合“收缩行为是聚落行为主体主动采取的规划策略或管理措施”，就业吸纳能力下降，不代表人口流失，不符合“人类聚落中人口持续流失”，不符合“主动社会收缩”定义，排除；\nD项：某制造业基地产业升级导致房屋空置率居高不下，不代表人口流失，不符合“人类聚落中人口持续流失”，不符合“社会收缩”定义，排除。\n故正确答案为A。","no":95,"missingImage":false},{"type":"question","qid":"2616036","cat":"逻辑判断","stem":"食品添加剂是现代食品工业的重要组成部分，按规定使用食品添加剂既对人体无害，而且能够改善食品品质，起到防腐、保鲜的作用。正是因为有了食品添加剂的发展，才有了大量的方便食品，给人们的生活带来极大的便利。如果不加入食品添加剂，大部分食品要么难看、难吃或者难以保鲜，要么就是价格昂贵。\n下列说法能够支持上面论点的是（    ）。","options":{"A":"食品添加剂和人类文明史一样悠久，例如点豆腐用的卤水","B":"如果不使用添加剂，食品会因微生物作用而引起食物中毒","C":"宣称无食品添加剂往往是商家迎合消费者心理造成的噱头","D":"三聚氰胺也是一种添加剂，在水泥里能够作为高效减水剂"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：食品添加剂是现代食品工业的重要组成部分，按规定使用食品添加剂既对人体无害，而且能够改善食品品质，起到防腐、保鲜的作用。正是因为有了食品添加剂的发展，才有了大量的方便食品，给人们的生活带来极大的便利。如果不加入食品添加剂，大部分食品要么难看、难吃或者难以保鲜，要么就是价格昂贵。\n论据：无\n本题只有论点，没有论据，加强优先考虑补充论据，即解释为什么食品添加剂按规定添加既对人体无害，并且能够改善食品品质，防腐，保鲜，或举例证明某些食品添加剂对人体无害，并且能够改善食品品质，防腐，保鲜。\n第二步：逐一分析选项。\nA项：论点说的是食品添加剂按规定添加既对人体无害，并且能够改善食品品质，防腐，保鲜，该项说的是食品添加剂和人类文明一样历史悠久，话题不一致，无法加强，排除；\nB项：若不使用食品添加剂，食品会因微生物作用而导致食物中毒，说明食品添加剂对于食品是有好处的，解释了为什么我们要在食品中添加食品添加剂，当选；\nC项：论点说的是食品添加剂按规定添加既对人体无害，并且能够改善食品品质，防腐，保鲜，该项说的是商家会以什么样的噱头来吸引消费者，话题不一致，无法加强，排除；\nD项：论点强调的是食品添加剂按规定添加既对人体无害，并且能够改善食品品质，防腐，保鲜，该项说的是三聚氰胺在不同的环境中所起到的作用，与题干话题不一致，排除。\n故正确答案为B。","no":96,"missingImage":false},{"type":"question","qid":"2616034","cat":"逻辑判断","stem":"二氧化碳的排放量剧增导致全球气候变暖，使珠穆朗玛峰所在的喜马拉雅地区冰川面临急剧缩小的危险。研究显示，珠峰海拔在5000米到6000米的冰川集中区域出现快速融化的现象，这些地方将只在冬季而不是在温暖的季节时看到结冰。专家推论说，根据未来的气候变化趋势，喜马拉雅地区的冰川减少的速度还有可能加快，如果本世纪内气温如预计的一样继续升高，该地区的冰川最终将消失殆尽。\n如果以下各项为真，最能削弱上述论证的是：","options":{"A":"喜马拉雅冰川每年缩小约\u003cimg data-k=\"c6f98ff2683d\">到\u003cimg data-k=\"8e91150a03d7\">","B":"喜马拉雅其他地区冰川对温度不敏感","C":"过去50年珠峰周边冰川覆盖面积减少了\u003cimg data-k=\"643552e3c332\">","D":"珠穆朗玛峰7000米以上区域未出现冰川快速融化现象"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：根据未来的气候变化趋势，喜马拉雅地区的冰川减少的速度还有可能加快，如果本世纪内气温如预计的一样继续升高，该地区的冰川最终将消失殆尽。\n论据：珠峰海拔在5000米到6000米的冰川集中区域出现快速融化的现象，这些地方将只在冬季而不是在温暖的季节时看到结冰。\n论点说的是喜马拉雅地区的冰川将会消失殆尽，论据是珠峰海拔在5000米到6000米的冰川集中区域出现快速融化的现象，因此本题目的论证关系是通过珠穆朗玛峰5000米-6000米区域的变化，来预测喜马拉雅山未来整体的情况，论点和论据的话题不一致，要想否定论证，可以补充5000米-6000米之外的地方冰川不会消融来进行否定，即通过局部是推不出整体这种方式来进行否定。\n第二步：逐一分析选项。\nA项：选项说喜马拉雅冰川每年缩小约\u003cimg data-k=\"c6f98ff2683d\">到\u003cimg data-k=\"8e91150a03d7\">，补充论据说明冰川在不断缩小，有加强力度，排除；\nB项：选项说喜马拉雅其他地区冰川对温度不敏感，说明在珠穆朗玛峰5000米-6000米之外的其他地区冰川并不会受温度的影响，那么就说明从题干中的论据是推不出论点的，可以削弱，当选；\nC项：过去50年珠峰周边冰川覆盖面积减少了\u003cimg data-k=\"643552e3c332\">，补充论据说明冰川在不断缩小，有加强力度，排除；\nD项：珠穆朗玛峰7000米以上区域未出现冰川快速融化现象，通过举反例来证明冰川不会完全消失，但该项只是举出了7000米以上的地区，不如B项包含的范围广，可以削弱，但是力度比B项弱，排除。\n故正确答案为B。","no":97,"missingImage":false},{"type":"question","qid":"2616032","cat":"逻辑判断","stem":"在市场竞争十分激烈的时候，一个企业要是不激流勇进，创造出富有竞争力的产品，也不适时撤退、主动割爱，放弃没有前景的市场，那么这个企业最后一定会陷入危机之中。\n如果以上论断为真，下列说法正确的是（    ）。","options":{"A":"某企业未能创造出富有竞争力的产品，最后一定会惨遭淘汰","B":"某企业紧要关头急流勇退，转向其它市场，就可以避免危机","C":"某企业放弃已显颓势的产业，转向新产品的开发，它可能不会被淘汰","D":"某企业研发出了富有竞争力的产品，它最后一定不会陷入危机之中"},"answer":"C","explanation":"第一步：翻译题干。\n-（激流勇进，创造出富有竞争力的产品）且-（适时撤退，主动割爱，放弃没有前景的市场）→陷入危机\n第二步：逐一分析选项。\nA项：翻译为-创造出有市场竞争力的产品→淘汰，“-创造出有市场竞争力的产品”是对题干翻译前件“且”关系一部分的肯定，据此无法判断整个“且”关系的真假，进而无法得出确定性结论，不能推出，排除；\nB项：翻译为“急流勇退，转向其他市场\u003cimg data-k=\"f4b418543638\">陷入危机”，“急流勇退，转向其他市场”即“适时撤退、主动割爱，放弃没有前景的市场”，是对题干翻译前件“且”关系的一部分的否定，否前不能得到确定性结论，不能推出，排除；\nC项：翻译为放弃已显颓势的产业→可能不会被淘汰，放弃已显颓势的产业是否定题干翻译前件“且关系”的一部分，否前不能得到确定性结论，但是C选项后面说的是可能不会被淘汰，是一种可能性的表述，可以推出，当选；\nD项：翻译为富有竞争力的产品→-陷入危机，是否定题干翻译前件“且关系”的一部分，否前不能得到确定性结论，不能推出，排除。\n故正确答案为C。","no":98,"missingImage":false},{"type":"question","qid":"2615997","cat":"逻辑判断","stem":"学界一直认为第一个到达澳大利亚的是欧洲人。但有研究指出，来自今天的坦桑尼亚的东非人率先到达了澳大利亚，考古学家在澳大利亚的埃尔科岛上发现了一枚来自非洲中部的贸易城市基卢瓦（今属坦桑尼亚）的硬币。因此，有人提出，东非人到达澳大利亚的时间可能要比第一批欧洲探险者早数百年。\n以下各项如果为真，最能支持上述观点的是：","options":{"A":"该硬币的重量尺寸与常见的基卢瓦硬币存在差异","B":"基卢瓦岛从13世纪开始与印度一直存在贸易联系","C":"东非与大洋洲在11世纪到16世纪间商贸往来十分频繁","D":"葡萄牙人于1505年先后袭击了基卢瓦和埃尔科岛并留下了这枚硬币"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：东非人到达澳大利亚的时间可能要比第一批欧洲探险者早数百年。\n论据：来自今天的坦桑尼亚的东非人率先到达了澳大利亚，考古学家在澳大利亚的埃尔科岛上发现了一枚来自非洲中部的贸易城市基卢瓦（今属坦桑尼亚）的硬币。\n本题论点是东非人到达澳大利亚的时间可能要比第一批欧洲探险者要早，论据是通过在澳大利亚的埃尔科岛上发现的一枚来自非洲中部的贸易城市基卢瓦（今属坦桑尼亚）的硬币确定来自今天的坦桑尼亚的东非人率先到达了澳大利亚。二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：选项说该硬币的重量尺寸与常见的基卢瓦硬币存在差异，硬币的尺寸存在差异，说明发现的硬币不一定是东非人带来的，具有削弱作用，无法加强，排除；\nB项：选项说基卢瓦岛从13世纪开始与印度一直存在贸易联系，题干论点与论据均与印度的贸易联系无关，话题不一致，无法加强，排除；\nC项：选项说东非与大洋洲在11世纪到16世纪间商贸往来十分频繁，澳大利亚是大洋洲的主要组成部分，证明东非与澳大利亚之间很有可能早在11世纪到16世纪间就存在频繁的商贸往来，有利于论点的成立，补充论据，当选；\nD项：选项说葡萄牙人于1505年先后袭击了基卢瓦和埃尔科岛并留下了这枚硬币，说明是葡萄牙人留下的这枚硬币，而不是东非人，具有削弱作用，排除。\n故正确答案为C。\n注：由于题目中完全没有涉及到欧洲人到达澳大利亚的具体时间，也没有涉及到东非人到达澳大利亚的具体时间，因此选项中的时间无法准确判断早晚，因此C项虽然只是一种可能性的加强，但其他选项无任何加强作用，故答案确定为C。而根据原文（如下图中最后一句）可知，已知确定的率先到达澳大利亚的欧洲人时间在1606年（17世纪），而C项中东非与大洋洲的贸易时间在11世纪到16世纪，早于1606年，因此根据原文C项具有加强作用。\n\u003cimg data-k=\"a87079c0fb29\" style=\"max-width:669px\">","no":99,"missingImage":false},{"type":"question","qid":"2616035","cat":"逻辑判断","stem":"心理学家考察了450位中年男性和女性，他们中有白领阶层，也有蓝领阶层；有技能判断型人群，也有决策制定型人群。结果发现，那些身居重要职位的高管人士普遍比一般员工更胖。研究者认为，做出许多决定所承受的压力通过饮食方式得到排解，这最终在一定程度上改变了高管人士之前的饮食习惯，如果你的职位幸运地得到晋升，你将发现不仅是薪水变多，自己的腰围也在变粗，伴随着体重上升。\n以下哪项如果为真，最能质疑上述结论？（    ）","options":{"A":"比较而言，技能判断型人群的腰围较小，决策制定型人群的腰围较大","B":"比较而言，身居要职的高管人士更难抽出时间投入锻炼以缩小腰围","C":"每晋升一次，技能判断型人群的腰围平均会减少0.5厘米","D":"每晋升一次，决策制定型人群的腰围平均会增大0.28厘米"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：做出许多决定所承受的压力通过饮食方式得到排解，这最终在一定程度上改变了高管人士之前的饮食习惯，如果你的职位幸运地得到晋升，你将发现不仅是薪水变多，自己的腰围也在变粗，伴随着体重上升。\n论据：心理学家考察了450位中年男性和女性，他们中有白领阶层，也有蓝领阶层；有技术判断性人群，也有决策判断性人群，结果发现，那些身居重要职位的高管人士普遍比一般职员更胖。\n本题的论据是做了一个研究，论点是研究之后的结果，并且以因果的方式呈现，所以可以考虑他因削弱和因果倒置。\n第二步：逐一分析选项。\nA项：比较技术判断型人和决策制定型人的腰围大小，和题干压力大饮食习惯变化导致腰围增加的论点没有关系，属于无关选项，排除；\nB项：高管难抽出时间锻练无法减少腰围，论点是高管因为压力大饮食习惯发生变化导致腰围增加，而选项说明腰围变化的原因在于是否进行锻练，属于他因削弱，当选；\nC项：技术判断型人群平均腰围随着晋升减少，题干说的是高管，而职级晋升不一定就是高管，属于不明确选项，排除；\nD项：决策制定型人群平均腰围随着晋升增加，题干说的是高管，而职级晋升不一定就是高管，属于不明确选项，排除。\n故正确答案为B。","no":100,"missingImage":false},{"type":"question","qid":"2616135","cat":"逻辑判断","stem":"一项最新研究发现，世界上的绿海龟越来越“雌性化”。专家估计，到2100年，约有\u003cimg data-k=\"d72b79c76fcb\">的新生绿海龟为雌性。研究表明，决定绿海龟性别的主要因素是绿海龟孵化时周围沙子的温度。如果沙子的温度在28到30度之间，孵化出来的绿海龟雌雄比例差不多；如果温度高出这个范围，那孵化出来的绿海龟大多数是雌性，相反，则大多数为雄性。\n以下哪项如果为真，最能支持上述论断？","options":{"A":"绿海龟终将无法正常繁殖最后在地球上灭绝","B":"绿海龟是一种由孵化时温度决定性别的动物","C":"温室效应将导致全球气候变暖问题日趋严重","D":"温度的持续升高使绿海龟孵化的死亡率增加"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：到2100年，约有\u003cimg data-k=\"d72b79c76fcb\">的新生绿海龟为雌性。\n论据：决定绿海龟性别的主要因素是海龟孵化时周围沙子的温度。如果沙子的温度在28到30度之间，孵化出来的绿海龟雌雄比例差不多；如果温度高出这个范围，那孵化出来的绿海龟大多数是雌性，相反，则大多数为雄性。\n本题的论点讨论的是绿海龟到2100年新生绿海龟将有\u003cimg data-k=\"d72b79c76fcb\">的为雌性，而论据讨论的是决定海龟性别的是温度，温度达到\u003cimg data-k=\"33e36b8f516a\">以上孵化的绿海龟中雌性的比例较大，论点论据话题不一致，优先考虑搭桥，即建立起“2100年”与“温度达到\u003cimg data-k=\"8f0968e643f1\">以上”的关系。\n第二步：逐一分析选项。\nA项：该项说的是绿海龟繁殖和灭绝之间的关系，论点论据讨论的是绿海龟性别和孵化温度的关系，话题不一致，无法加强，排除；\nB项：该项只是指出了绿海龟孵化的性别与温度有关，没有明确说明雌性与温度的具体关系，也不明确未来温度是否会达到30度以上，属于不明确选项，无法加强，排除；\nC项：该项讨论了温室效应将导致未来全球变暖更加严重，表明了未来温度将会升高，因此2100年的气温很有可能超过\u003cimg data-k=\"33e36b8f516a\">，如果气温超过\u003cimg data-k=\"33e36b8f516a\">孵化出的绿海龟大多数将为雌性海龟，搭桥项，可以加强，当选；\nD项：论点说的是绿海龟性别和孵化温度的关系，该项讨论的是温度与绿海龟死亡率之间的关系，话题不一致，无法加强，排除。\n故正确答案为C。","no":101,"missingImage":false},{"type":"question","qid":"2615990","cat":"逻辑判断","stem":"地球距离火星最近约为5500万公里，最远则超过4亿公里，只有地球与火星夹角为\u003cimg data-k=\"6751196a67e2\">时发射探测器才能如期抵达火星。2020年，我国发射了火星探测器，预计2021年登陆火星。一位航天专家对此评论道：“如果没抓住2020年这个机会，那么，下一次合适的发射时间至少要推迟到2022年之后。”\n上述专家的评论若要成立，需要补充的前提是：","options":{"A":"火星探测器发射后，需要经过不少于7个月的飞行，才能抵达火星轨道","B":"我国于2020年发射了火星探测器，缩小了与西方航天大国的差距","C":"地球与火星的相对近点约每15年出现一次，二者距离近的年份是登陆火星的最佳时机","D":"发射火星探测器须等到地球和火星形成一定夹角，而这个机会每隔26个月才出现一次"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：如果没抓住2020年这个机会，那么，下一次合适的发射时间至少要推迟到2022年之后。\n论据：地球距离火星最近约为5500万公里，最远则超过4亿公里，只有地球与火星夹角为\u003cimg data-k=\"6751196a67e2\">时发射探测器才能如期抵达火星。\n本题问题为“前提”，加强考虑搭桥和必要条件。论点说的是下一次合适的发射时间是2年后，而论据说的是只有地球与火星夹角为\u003cimg data-k=\"6751196a67e2\">时发射探测器才能如期抵达火星，二者话题不一致，优先考虑搭桥，即在地球与火星夹角与下一次合适的发射时间是2年后之间建立联系。\n第二步：逐一分析选项。\nA项：指出火星探测器发射后需要经过不少于7个月的飞行，才能抵达火星轨道，与火星探测器下一次合适的发射时间无关，话题不一致，无法加强，排除；\nB项：指出我国2020年发射了火星探测器，缩小了与西方航天大国的差距，与火星探测器下一次合适的发射时间无关，话题不一致，无法加强，排除；\nC项：指出地球与火星距离近的年份是登陆火星的最佳时机，而论点说的是火星探测器下一次合适的发射时间，登陆与发射时间并不相同，且选项中说的是地球与火星的相对近点约每15年出现一次，而论点中说的是火星探测器下一次合适的发射时间是在2022年后，二者时间的长短差距较大，无法加强，排除；\nD项：指出发射火星探测器须等到地球和火星形成一定夹角，而这个机会每隔26个月才出现一次，在地球与火星夹角与火星探测器下一次合适的发射时间是2年后之间建立联系，属于搭桥项，可以加强，当选。\n故正确答案为D。","no":102,"missingImage":false},{"type":"question","qid":"2615998","cat":"逻辑判断","stem":"肌萎缩侧索硬化症（ALS），俗称“渐冻症”。某科研团队研究发现，ALS的疾病发展与肠道微生物AM菌的数量密切相关。研究人员观察和比较了37名ALS患者及29名健康亲属的肠道菌群和血液、脑脊液样本。他们发现肠道细菌菌株有差异，其中有一种菌株与烟酰胺的产生有关。此外，在这些ALS患者的血液和脑脊液中，烟酰胺水平有所下降。\n若要上述研究发现成立，需要补充的前提是：","options":{"A":"人类肠道中的微生物非常复杂","B":"烟酰胺是肠道微生物AM菌的代谢物","C":"小鼠补充烟酰胺后，ALS症状得到了减轻","D":"人体肠道细菌的变化与ALS的疾病发展速度有关"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点： ALS的疾病发展与肠道微生物AM菌的数量密切相关。\n论据： 研究人员观察和比较了37名ALS患者及29名健康亲属的肠道菌群和血液、脑脊液样本。他们发现肠道细菌菌株有差异，其中有一种菌株与烟酰胺的产生有关。此外，在这些ALS患者的血液和脑脊液中，烟酰胺水平有所下降。\n本题论点说的是ALS疾病与AM菌数量的关系，论据说的是ALS疾病与烟酰胺水平的关系，论点论据话题不一致，优先考虑搭桥的加强方式，即说明烟酰胺和AM菌之间存在关系。\n第二步:逐一分析选项。\nA项：人类肠道中微生物复杂，未提及“AM菌”与“ALS疾病”的关系，与论点话题不一致，属于无关项，无法加强，排除；\nB项：烟酰胺是肠道微生物AM菌的代谢物，在“烟酰胺”和“AM菌”之间建立了关系，说明通过ALS患者烟酰胺水平下降可以判断ALS疾病与AM菌数量之间存在关系，搭桥项，可以加强，当选；\nC项：小鼠补充烟酰胺后，ALS症状得到了减轻，说的是“ALS疾病”与“烟酰胺”的关系，未提及“ALS疾病”与“AM菌”或“烟酰胺”与“AM菌”之间的关系，与论点话题不一致，属于无关项，无法加强，排除；\nD项：人体肠道细菌的变化与ALS的疾病发展速度有关，说的是“ALS疾病”与“人体肠道细菌”的关系，肠道细菌指的是不是“AM菌”不明确，属于不明确项，无法加强，排除。\n故正确答案为B。","no":103,"missingImage":false},{"type":"question","qid":"2616000","cat":"逻辑判断","stem":"地球表面的大部分都被海洋覆盖，生命也诞生于海洋之中。然而，据估计，地球有\u003cimg data-k=\"cd4db1324e77\">的物种生活在陆地上，而海洋中仅为\u003cimg data-k=\"0c486c1399ce\">，剩下的\u003cimg data-k=\"0ef566a32600\">生活在淡水中。研究者认为，陆地栖息地的物理布局相对海洋可能更加支离破碎，是导致陆地物种更加多样化的主要原因之一。\n以下哪项如果为真，最能加强上述研究者的观点？","options":{"A":"地球表面可分成热带、南温带、北温带、南寒带、北寒带五个温度带，各温度带物种差异性大，种类丰富","B":"深海相对于有阳光照射的浅海岸地区而言，基本上像个冰箱，而且门已经关上很久，物种远不如浅海丰富","C":"根据某群岛记录显示，随着时间推移，自然选择甚至可以把两个岛屿上相同物种的不同族群变成截然不同的物种","D":"森林覆盖许多陆地，而树叶和枝干形成新的生态环境，海洋中的珊瑚也起同样作用，但覆盖海底的面积没那么大"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：陆地栖息地的物理布局相对海洋可能更加支离破碎，是导致陆地物种更加多样化的主要原因之一。\n论据：无。\n本题只有论点没有论据，优先考虑补充论据，补充能够证明陆地栖息地的物理布局比海洋更复杂和破碎，能影响陆地物种多样化的原因或例子。\n第二步：逐一分析选项。\nA项：该项说的是地球表面温度差异导致各温度带物种差异大，与论点讨论的陆地栖息地的物理布局更加支离破碎导致陆地物种更加多样化无关，话题不一致，无法加强，排除；\nB项：该项说的是深海物种不如浅海丰富，与论点讨论的陆地栖息地的物理布局更加支离破碎导致陆地物种更加多样化无关，话题不一致，无法加强，排除；\nC项：该项说的是自然选择可以让两个岛屿上的同一物种变得不同，即说明陆地栖息地的物理布局的破碎导致陆地物种更加多样化，通过举例的方式进行加强，当选； \nD项：该项说的是森林中树叶和枝干能形成新的生态环境，而且比海洋中起同样作用的珊瑚覆盖的面积更广，只能说明陆地与海洋相比，相似的生态环境面积要广，但是否一定带来物种的多样性不明确，不能加强，排除。\n故正确答案为C。\n注：【原文链接】http://www.360doc.com/content/17/0724/10/5554415_673699256.shtml\n原文讨论的是陆地的物种多样性远超海洋的原因，根据文段结构，C项为“陆地栖息地的物理布局可能更加支离破碎，更加多样化”的例子，即本题论点的例子。而D项为解释海洋物理障碍少，陆地可以“建造出精品”的例子。\n\u003cimg data-k=\"650e1cf06b26\" style=\"max-width:700px\">\n\u003cimg data-k=\"d219bda2cf84\" style=\"max-width:700px\">","no":104,"missingImage":false},{"type":"question","qid":"2616067","cat":"逻辑判断","stem":"近年来，“类脑计算”从理念走向实践，正走出一条制造类人智能的新途径。所谓“类脑计算”，是指仿真、模拟和借鉴大脑神经系统结构和信息处理过程的装置、模型和方法，其目标是制造类脑计算机。然而有人提出质疑：大脑奥秘尚未揭示，我们还不了解智能背后的基本原理，怎么能制造出具有“大脑智能”的类脑计算机呢？\n以下哪项如果为真，最能反驳上述质疑？","options":{"A":"类脑计算机的器件速度是生物神经元和突触的百万倍，一旦产生智能，后果难以预料","B":"关于“类脑计算”的伦理制度和风险评估等必须与“类脑计算”的技术发明同步展开","C":"揭示大脑奥秘和发明类脑计算机是相互作用的复杂过程，不是“前者决定后者”的简单关系","D":"国内已经启动集合各高校、科研机构和企业优势研究力量的10多项“类脑计算”研究项目"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：大脑奥秘尚未揭示，我们还不了解智能背后的基本原理，怎么能制造出具有“大脑智能”的类脑计算机。\n论据：无。\n本题论点讨论揭示大脑奥秘，了解智能背后的基本原理和制造“大脑智能”的类脑计算机之间的关系，没有论据，优先考虑否定论点，即揭示大脑奥秘，了解智能背后的基本原理和制造“大脑智能”的类脑计算机之间没有必然联系。\n第二步：逐一分析选项。\nA项：选项讨论类脑计算机产生智能的后果，论点讨论的是能否制造出类脑计算机，话题不一致，无法削弱，排除；\nB项：选项讨论的是“类脑计算”的伦理制度和风险评估，论点讨论的是能否制造出类脑计算机，话题不一致，无法削弱，排除；\nC项：论点意为因为没有揭示大脑奥秘，不了解智能背后的基本原理，所以不能制造类脑计算机，选项指出了揭示大脑奥秘和发明类脑计算机不是简单的“前者决定后者”的关系，否定论点，可以削弱，当选；\nD项：选项讨论的是国内已启动多项“类脑计算”研究项目，启动了项目不等于就能制造出类脑计算机，话题不一致，无法削弱，排除。\n故正确答案为C。","no":105,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"2a664bef758d\" style=\"max-width:689px\"> \u003c/p>","questions":[{"qid":"2616071","cat":"比重 做了政府工作报告，下列表述中错误的是（    ）。","options":{"A":"新冠肺炎疫情是新中国成立以来我国遭遇的传播速度最快、感染范围最广、防控难度最大的重大突发公共卫生事件","B":"没有提出全年经济增速具体目标","C":"提出重点支持加强新型基础设施建设，加强新型城镇化建设，加强交通、水利等重大工程建设的“两新一重”建设","D":"为抵御疫情对经济的冲击，要实施积极的财政政策和积极的货币政策"},"answer":"D","explanation":"本题考查政治常识。\nA项正确，《2020年国务院政府工作报告》在引言部分指出：“这次新冠肺炎疫情，是新中国成立以来我国遭遇的传播速度最快、感染范围最广、防控难度最大的重大突发公共卫生事件。在以习近平同志为核心的党中央坚强领导下，经过全国上下和广大人民群众艰苦卓绝努力并付出牺牲，疫情防控取得重大战略成果。当前，疫情尚未结束，发展任务异常艰巨。要努力把疫情造成的损失降到最低，努力完成今年经济社会发展目标任务。”\nB项正确，《2020年国务院政府工作报告》在“二、今年发展主要目标和下一阶段工作总体部署”部分指出：“需要说明的是，我们没有提出全年经济增速具体目标，主要因为全球疫情和经贸形势不确定性很大，我国发展面临一些难以预料的影响因素。这样做，有利于引导各方面集中精力抓好‘六稳’、‘六保’。”\nC项正确，《2020年国务院政府工作报告》在“五、实施扩大内需战略，推动经济发展方式加快转变”部分指出：“我国内需潜力大，要深化供给侧结构性改革，突出民生导向，使提振消费与扩大投资有效结合、相互促进······重点支持既促消费惠民生又调结构增后劲的‘两新一重’建设，主要是：加强新型基础设施建设，发展新一代信息网络，拓展5G应用，建设数据中心，增加充电桩、换电站等设施，推广新能源汽车，激发新消费需求、助力产业升级。加强新型城镇化建设，大力提升县城公共设施和服务能力，以适应农民日益增加的到县城就业安家需求。新开工改造城镇老旧小区3.9万个，支持管网改造、加装电梯等，发展居家养老、用餐、保洁等多样社区服务。加强交通、水利等重大工程建设。”\nD项错误，《2020年国务院政府工作报告》在“二、今年发展主要目标和下一阶段工作总体部署”部分指出：“积极的财政政策要更加积极有为。今年赤字率拟按3.6%以上安排，财政赤字规模比去年增加1万亿元，同时发行1万亿元抗疫特别国债······稳健的货币政策要更加灵活适度。综合运用降准降息、再贷款等手段，引导广义货币供应量和社会融资规模增速明显高于去年。保持人民币汇率在合理均衡水平上基本稳定。”\n本题为选非题，故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"4678564","cat":"时事政治","stem":"2019年4月，习近平总书记在重庆主持召开解决“两不愁三保障”突出问题座谈会时强调，到（    ）年稳定实现农村贫困人口不愁吃、不愁穿，义务教育、基本医疗、住房安全有保障。","options":{"A":"2020","B":"2021","C":"2022","D":"2023"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，B、C、D三项错误，习近平总书记在会上强调：“到2020年稳定实现农村贫困人口不愁吃、不愁穿，义务教育、基本医疗、住房安全有保障，是贫困人口脱贫的基本要求和核心指标，直接关系攻坚战质量。”\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"4678605","cat":"新思想","stem":"《中华人民共和国民法典》是一部适应新时代中国特色社会主义发展要求，符合我国国情和实际，体例科学、结构严谨、规范合理、内容完整并协调一致的法典。民法典共分为7编，其中不包括（    ）。","options":{"A":"物权编","B":"人格权编","C":"劳动关系编","D":"继承编"},"answer":"C","explanation":"本题考查法律常识。\nA、B、D三项正确，C项错误，《中华人民共和国民法典》共7编、1260条，各编依次为总则、物权、合同、人格权、婚姻家庭、继承、侵权责任，以及附则。被称为“社会生活的百科全书”，是新中国第一部以法典命名的法律，在法律体系中居于基础性地位，也是市场经济的基本法。通篇贯穿以人民为中心的发展思想，着眼满足人民对美好生活的需要，对公民的人身权、财产权、人格权等作出明确详实的规定，并规定侵权责任，明确权利受到削弱、减损、侵害时的请求权和救济权等，体现了对人民权利的充分保障，也被誉为“新时代人民权利的宣言书”。\n本题为选非题，故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"4678601","cat":"新思想","stem":"1929年，中国共产党红四军第九次代表大会通过的《关于纠正党内的错误思想》成为中国共产党及其领导的人民军队建设的纲领性文件。这次会议史称（    ）。","options":{"A":"八七会议","B":"遵义会议","C":"古田会议","D":"瓦窑堡会议"},"answer":"C","explanation":"本题考查毛中特。\nA项错误，八七会议是大革命失败以后，在关系党和革命事业前途和命运的严重危机时刻，中共中央于1927年8月7日在湖北汉口召开的紧急会议。会议批判和纠正了陈独秀右倾机会主义错误，撤销了他在党内的职务，选出了新的临时中央政治局，确定了土地革命和武装斗争的总方针。毛泽东出席了这次会议，并提出了著名的“枪杆子里出政权”的论断。\nB项错误，遵义会议是指1935年1月中共中央政治局在贵州遵义召开的独立自主地解决中国革命问题的一次极其重要的扩大会议。是在红军第五次反“围剿”失败和长征初期严重受挫的情况下，为了纠正博古、王明、李德等人“左”倾领导在军事指挥上的错误而召开的。这是中国共产党第一次独立自主地运用马克思列宁主义基本原理解决自己的路线、方针和政策方面问题的会议，在极端危急的历史关头，挽救了党，挽救了红军，挽救了中国革命，是党的历史上生死攸关的转折点。\nC项正确，《关于纠正党内的错误思想》是由毛泽东同志起草的著名的古田会议决议的第一部分，是在中国人民最困难的时期里指导革命势力使之重新发展起来的一篇重要文件。它在中国破天荒第一次系统完整地按照马克思列宁主义的原理解决了如何使军队成为革命的人民军队的问题，同时也解决了如何建立一个能够领导革命斗争使之走向胜利前途的布尔什维克化的共产党的问题，成为中国共产党及其领导的人民军队建设的纲领性文献。\nD项错误，瓦窑堡会议是六届中央政治局于1935年12月17日至25日在陕北安定县瓦窑堡举行扩大会议，会议分析了华北事变后国内阶级关系的新变化，讨论了抗日民族统一战线、国防政府和抗日联军等问题，批判了党内长期存在着的“左”倾冒险主义和关门主义错误，制定了正确的策略。\n故正确答案为C。","no":4,"missingImage":false}],"count":4,"answerable":4,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"4678573","cat":"人文常识","stem":"根据《中华人民共和国香港特别行政区维护国家安全法》中央人民政府在香港特别行政区设立（    ）。","options":{"A":"维护国家安全委员会","B":"维护国家安全公署","C":"维护国家安全局","D":"维护国家安全部队"},"answer":"B","explanation":"本题考查法律常识。\nB项正确，A、C、D三项错误，根据《中华人民共和国香港特别行政区维护国家安全法》第四十八条第一款规定：“中央人民政府在香港特别行政区设立维护国家安全公署。中央人民政府驻香港特别行政区维护国家安全公署依法履行维护国家安全职责，行使相关权力。”\n故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"4678610","cat":"科技常识","stem":"下列关于化学元素应用的描述，错误的是（    ）。","options":{"A":"铂可用于汽车尾气的净化","B":"铯可用于制作原子钟","C":"氩在焊接中常被作为助燃剂","D":"硅广泛应用于集成电路制造"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，铂的化学符号为Pt，是贵金属之一，银白色有光泽，其单质俗称白金，较软，有良好的延展性、导热性和导电性。铂、钯和铑是铂族金属中的其中三种，它们在化学、物理和结构上都很相似。在汽车行业，铂、钯和铑是汽车催化剂的关键组成部分，用以减少汽车的有害尾气排放，并改善空气质量。\nB项正确，铯的化学符号为Cs，是制造真空件器、光电管等的重要材料。铯原子的最外层的电子绕着原子核旋转的速度，总是极其精确地在几十亿分之一秒的时间内转完一圈，稳定性比地球绕轴自转高得多。利用铯原子的这个特点，人们制成了一种新型的钟——铯原子钟，规定一秒就是铯原子“振动”9192631770次所需要的时间。\nC项错误，氩的化学符号为Ar。氩是单原子分子，单质为无色、无臭和无味的气体。氩是空气中含量最多、最早发现的稀有气体，化学性极不活泼，不能燃烧，也不能助燃。在电弧焊接不锈钢、镁铝等时用作保护气体。\nD项正确，硅的化学符号为Si，有无定形硅和晶体硅两种同素异形体，高纯的单晶硅是重要的半导体材料。集成电路在电子学中是一种把电路（主要包括半导体装置，也包括被动元件等）小型化的方式，并通常制造在半导体晶圆表面上。因此硅广泛应用于集成电路制造。\n本题为选非题，故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"4678545","cat":"人文常识","stem":"截止2020年6月底，新冠肺炎疫情累计确诊病例最多的国家是（    ）。","options":{"A":"美国","B":"巴西","C":"印度","D":"英国"},"answer":"A","explanation":"本题考查政治常识。\n2020年，美国约翰斯·霍普金斯大学发布的疫情数据显示，截至北京时间7月1日（美国时间6月30日左右）左右，美国累计确诊新冠肺炎病例2623217例；据巴西卫生部当地时间6月30日晚公布的最新数据，累计确诊1402041例；印度卫生部官方网站6月30日公布的数据显示，截至当地时间当天上午，印度新冠肺炎确诊病例已升至566840例；据英国政府网站当地时间6月30日下午公布的最新统计结果，累计确诊312654例。故截止2020年6月底，新冠肺炎疫情累计确诊病例最多的国家是美国。\n故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"4678555","cat":"人文常识","stem":"下列关于数字经济的说法，哪项是错误的？","options":{"A":"数字经济是可实现资源快速优化配置与再生、实现经济高质量发展的经济形态","B":"数字经济广泛依托于互联网、云计算、区块链、物联网等信息技术","C":"数字经济正成为推动重庆经济增长和社会发展的重要引擎","D":"数字经济时代，大数据将消除个体差异，成就一元化的经济体系"},"answer":"D","explanation":"本题考查经济常识。\nA项正确，作为经济学概念的数字经济是人类通过大数据的识别-选择-过滤-存储-使用，引导、实现资源快速优化配置与再生、实现经济高质量发展的经济形态。\nB项正确，数字经济在技术层面，包括大数据、云计算、物联网、区块链、人工智能、5G通信等新兴技术。\nC项正确，近年来，重庆市深入实施以大数据智能化为引领的创新驱动发展战略，统筹推进数字产业化、产业数字化，推动数字经济和实体经济深度融合，优化完善“芯屏器核网”全产业链、“云联数算用”全要素群、“住业游乐购”全场景集，促进智能产业、智能制造、智能化应用协同发展，集中力量建设“智造重镇”“智慧名城”，大数据智能化发展取得显著成效。数字经济正成为推动重庆经济增长和社会发展的重要引擎。\nD项错误，大数据来源于大量的网络活动及其记录，经济社会中的大数据，是经济活动的网络化、账户化、数字化的产物，是经济人自由意志的集合映射。大数据就是社会经济活动的一层“数据化的外衣”而已，不能本末倒置经济体系。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"4678565","cat":"人文常识","stem":"2015年7月31日，北京携手张家口获得2022年冬奥会举办权。这是中国历史上第一次举办冬季奥运会，北京将成为奥运史上第一个举办过夏奥会和冬奥会的城市。亚洲第一个主办冬奥会的城市是（    ）。","options":{"A":"北京","B":"札幌","C":"首尔","D":"索契"},"answer":"B","explanation":"本题考查政治常识。\nB项正确，A、C、D三项错误，冬季奥林匹克运动会（Olympic Winter Games）简称为冬季奥运会、冬奥会，是世界规模最大的冬季综合性运动会。第十一届冬季奥运会于1972年2月3日至13日在日本札幌举行。这是冬奥会第一次在欧洲和美国以外的地区举办，也是亚洲举办的第一届奥运会。\n故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"4678598","cat":"人文常识","stem":"以下哪一项的作者与其他三项的作者不在同一个朝代？（    ）","options":{"A":"文章千古事，得失寸心知","B":"不识庐山真面目，只缘身在此山中","C":"春风又绿江南岸，明月何时照我还","D":"生当作人杰，死亦为鬼雄"},"answer":"A","explanation":"本题考查人文常识。\nA项，“文章千古事，得失寸心知”出自唐代杜甫的《偶题》，表达杜甫晚年对诗歌创作的见解，意思是写文章是留传久远，关系重大的事，对于文章，作者本人的理解感知最为明白。\nB项，“不识庐山真面目，只缘身在此山中”出自北宋苏轼的《题西林壁》，意思是之所以辨不清庐山真正的面目，是因为我身处在庐山之中。\nC项，“春风又绿江南岸，明月何时照我还”出自北宋王安石的《泊船瓜洲》，意思是温柔的春风又吹绿了大江南岸，天上的明月呀，你什么时候才能够照着我回家呢？表达了一种思乡之情。\nD项，“生当作人杰，死亦为鬼雄”出自南宋李清照的《夏日绝句》，意思是活着就要当人中的俊杰，死了也要做鬼中的英雄。无关功利，为给生命一个交代。\n故A项的作者与其他三项的作者不在同一朝代。\n本题为选非题，故正确答案为A。","no":10,"missingImage":false},{"type":"question","qid":"4678613","cat":"科技常识","stem":"①中国第一艘核潜艇下水；②中国第一颗人造卫星发射成功；③中国第一颗原子弹爆炸成功；④中国第一颗导弹发射成功。\n上述事件按照发生的时间顺序排序正确的一项是（    ）。","options":{"A":"④③②①","B":"③②①④","C":"③④②①","D":"①③②④"},"answer":"A","explanation":"本题考查科技常识。\n①1970年12月26日，我国自主研制的第一艘核潜艇成功下水，成为世界上第五个拥有核潜艇的国家。1974年8月1日，第一艘核潜艇被命名为“长征一号”，正式编入海军战斗序列。\n②“东方红一号”卫星是我国发射的第一颗人造地球卫星，于1970年4月24日由“长征一号”运载火箭在酒泉卫星发射中心成功发射。\n③中国自行制造的第一颗原子弹于1964年10月16日在新疆罗布泊爆炸成功。\n④1960年11月5日，我国第一枚导弹“东风一号”发射成功，标志着中国向掌握导弹技术方面迈出了突破性的一步。\n故按照发生的时间顺序排列为④③②①。\n故正确答案为A。","no":11,"missingImage":false},{"type":"question","qid":"4678595","cat":"人文常识","stem":"歌剧是一门西方舞台表演艺术，简单而言就是主要或完全以歌唱和音乐来交代和表达剧情的戏剧，它源自古希腊戏剧的剧场音乐。而中国的歌剧则以（    ）的问世为诞生标志。","options":{"A":"《小小画家》","B":"《白毛女》","C":"《刘三姐》","D":"《运河谣》"},"answer":"B","explanation":"本题考查人文常识。\nA项错误，《小小画家》是我国儿童音乐作曲家黎锦晖在20世纪20年代创作的儿童歌舞剧。剧中描写了一个有绘画才能的儿童，母亲为他请了三位老师强迫他死背经书，他十分苦恼。后来老师发现了他的绘画天赋，使他的特长得到发展。\nB项正确，白毛女起源于晋察冀边区白毛仙姑的民间传说故事中的主人公“喜儿”，其因饱受旧社会的迫害而成为少白头，顾名思义被称作“白毛女”。1945年延安鲁迅艺术学院据此集体创作出歌剧《白毛女》。《白毛女》是我国歌剧创作的一座里程碑，它的诞生是中国歌剧正式形成的标志。\nC项错误，《刘三姐》是长春电影制片厂于1961年摄制的故事片，根据广西壮族民间传说改编。是中国大陆第一部风光音乐故事片，主要讲述了刘三姐用山歌反抗财主莫怀仁的故事。\nD项错误，《运河谣》是国家大剧院2012年推出的首部原创民族歌剧，该剧以民族唱法为载体，以京杭大运河为故事背景，描述了剧中人物在运河上跌宕起伏的命运际遇。\n故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"4678617","cat":"人文常识","stem":"下列景点与所处省份对应正确的是（    ）。","options":{"A":"玉门关——甘肃","B":"雁门关——河北","C":"剑门关——山西","D":"山海关——山东"},"answer":"A","explanation":"本题考查地理国情。\nA项正确，玉门关始置于汉武帝开通西域道路、设置河西四郡之时，因西域输入玉石时取道于此而得名。汉时为通往西域各地的门户，故址在今甘肃敦煌西北小方盘城。\nB项错误，雁门关位于中国山西省忻州市代县县城以北约20公里处的雁门山中，是长城上的重要关隘，以“险”著称，被誉为“中华第一关”，有“天下九塞，雁门为首”之说。\nC项错误，剑门关地处四川省广元市剑阁县城南15公里处，因唐代大诗人李白《蜀道难》中“剑阁峥嵘而崔嵬，一夫当关，万夫莫开”而闻名。\nD项错误，山海关位于河北省秦皇岛市东北15千米处，是明长城的东北关隘之一，在1990年以前被认为是明长城东端起点，素有中国长城“三大奇观之一”（东有山海关、中有镇北台、西有嘉峪关）、“天下第一关”、“边郡之咽喉，京师之保障”之称，与万里之外的嘉峪关遥相呼应，闻名天下。\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"4678629","cat":"科技常识","stem":"在下列科学成就中，其影响远远超越其学科范围，扩展到社会和经济思想领域，并对中国近代民主思想产生了重要影响的是：","options":{"A":"相对论","B":"经典力学","C":"进化论","D":"量子论"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，相对论是关于时空和引力的理论，主要由爱因斯坦创立，依其研究对象的不同可分为狭义相对论和广义相对论。相对论极大地改变了人类对宇宙和自然的“常识性”观念，提出了“同时的相对性”“四维时空”“弯曲时空”等全新的概念。相对论直接和间接地催生了量子力学的诞生，也为研究微观世界的高速运动确立全新的数学模型。 \nB项错误，经典力学的基本定律是牛顿运动定律或与牛顿定律有关且等价的其他力学原理，它是20世纪以前的力学，有两个基本假定：其一是假定时间和空间是绝对的，长度和时间间隔的测量与观测者的运动无关，物质间相互作用的传递是瞬时到达的；其二是一切可观测的物理量在原则上可以无限精确地加以测定。\nC项正确，进化论最早由布丰和拉马克提出，达尔文为公认的集大成者，是对物种起源的一种猜测而提出的一种假说。达尔文的《物种起源》中对进化论的阐述不仅开创了生物学发展史上的新纪元，使进化论思想渗透到自然科学的各个领域，而且引起了整个人类思想的巨大革命。近代资产阶级启蒙家严复翻译了英国生物学家赫胥黎的《进化与伦理》，宣传了“物竞天择，适者生存”的观点，其所译《天演论》对中国近代民主思想产生了重要的影响，并奠定了严复在中国近代思想界的地位。\nD项错误，量子论是现代物理学的两大基石之一（另一个是相对论）。量子论揭示了微观物质世界的基本规律，为原子物理学、固体物理学、核物理学、粒子物理学以及现代信息技术奠定了理论基础。它能很好地解释原子结构、原子光谱的规律性、化学元素的性质、光的吸收与辐射，粒子的无限可分和信息携带等。尤其它的开放性和不确定性，启发人类更多地发现和创造。量子论提供了新的关于自然界的观察、思考和表述的方法。 \n故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"4678639","cat":"人文常识","stem":"小明在厨房炒菜时油锅突然起火了，这时小明所采取的做法错误的是：","options":{"A":"迅速用灭火毯盖住油锅","B":"用大量水将火浇灭","C":"迅速用锅盖盖住油锅","D":"将切好的蔬菜沿油锅边缘倒入锅内"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，用灭火毯盖住油锅时，燃烧着的油火接触不到空气，便会因缺氧而立即被压制并熄灭。\nB项错误，油的性质很特别，密度是小于水的，油会浮在水的表面，并且，热油中加入水会飞溅。所以油锅起火万万不可用水来灭，否则会让火势更大，还可能让自己受伤。\nC项正确，迅速用锅盖从人体处朝前倾斜着遮盖到起火的油锅上，燃烧着的油火接触不到空气，便会因缺氧而立即熄灭。\nD项正确，如果厨房里有切好的蔬菜或其他生冷食物，可沿着油锅边缘倒入锅内，利用蔬菜、食物与着火油的温度差，使锅里燃烧着的油温度迅速下降，当油品达不到自燃点时，火就自动熄灭了。\n本题为选非题，故正确答案为B。","no":15,"missingImage":false}],"count":11,"answerable":11,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        如今，在不少城市的大型商场，书店几乎成了“标配”。它既可以是逛商场购物的人们中场休息的“加油站”，也可以是去商场观影、聚餐的人们打发零散时间的等候区，甚至也常成为部分人逛街的目的地。一些书店品牌随之兴起，在一地或多地商场连锁办店，和电影院等一道成为知名的“时尚”门面。\u003c/p>\u003cp>        书店与商场结合成为“标配”，其实也是最近几年才盛行起来的，但立身于人气旺盛的地带，却是它早已享受过的待遇。许多人的少年、青年记忆中都有一家在城市中心地带、备受关注的书店。所以，如今书店在这些大型商场的出现，看起来好像只是一次“重回”。也只是看起来——其实，“重回”的过程中，已经经历深刻变化。实体书店的衰落，一度成为人们为之焦虑的话题。且不去论人们阅读方式变化这样的大背景，单是网上书城的兴起，就对实体书店形成了巨大的冲击。论成本，实体书店偏向于在人流密集、交通便利地段开店，多了一笔不小的房租开支；论配送，获得强大物流加持的网上书城已能做到高效送货到家；论价格与书目的丰富，因为客源覆盖面广，容量超大，网上书城与实体书店相比，更有压倒性的优势······许多实体书店因为客流萎缩、收入锐减，先是逐渐搬家，改开在房租便宜的地方，接着又往往因此陷入客流更少的循环，最终关张。\u003c/p>","questions":[{"qid":"4678602","cat":"片段阅读","stem":"对“‘重回’的过程中，已经经历深刻变化”理解最恰当的一项是：","options":{"A":"书店与商场结合成为“时尚”","B":"实体书店遭遇了巨大冲击","C":"人们阅读的时间、地点发生了变化","D":"书店的样式更加多元化"},"answer":"B","explanation":"“‘重回’的过程中，已经经历深刻变化”出现在文章第二段。文段先介绍了书店与商场结合成为“标配”虽是近几年流行，但书店早已享受过人气旺盛，并通过“所以”得出“重回”的结论，接着通过“其实”指出“‘重回’的过程中，已经经历深刻变化”，后文进一步说明，这种“已经经历深刻变化”是实体书店的衰落，并通过与网上书城的对比，详细论述了实体书店的劣势。故“‘重回’的过程中，已经经历深刻变化”指的是实体书店不再是以前的人气旺盛，而是经历了衰落，对应B项。\nA项，“书店与商场结合成为‘时尚’”指的是实体书店的现状，并非过去“已经经历深刻变化”，时态不符，排除；\nC项，“人们阅读的时间、地点发生了变化”强调的是人们的改变，并非实体书店经历的变化，且“阅读的时间、地点”无中生有，排除；\nD项，“样式更加多元化”无中生有，且感情色彩较为积极，与文段感情色彩不符，排除。\n故正确答案为B。\n【文段出处】《书店的模样（半日闲谭）》","no":16,"missingImage":false},{"qid":"4678609","cat":"片段阅读","stem":"根据文章内容，接下来最有可能阐述的是：","options":{"A":"实体书店遭遇的冲击","B":"实体书店“重回”后的主要形态","C":"网上书城的发展优势","D":"实体书店“重回”的原因"},"answer":"D","explanation":"文章第一段主要介绍了实体书店的现状，即与大型商场相结合，成为商场的“标配”；第二段论述实体书店在“重回”的过程中，已经经历深刻变化，并对“重回”的变化进行具体阐述，故文章接下来可能继续围绕实体书店的“重回”展开介绍，对应D项。\nA项“遭遇的冲击”对应第二段“单是网上书城的兴起······更有压倒性的优势”，B项“主要形态”对应第二段“书店与商场结合成为‘标配’”，均为前文论述过的内容，后文不会再次论述，排除；\nC项，偏离文章核心话题“实体书店”，排除。\n故正确答案为D。\n【文段出处】《书店的模样（半日闲谭）》","no":17,"missingImage":false}]},{"type":"material","material":"\u003cp>        我们强调优秀文艺作品与生命体验的关系，并不是将这种关系\u003cu>          \u003c/u>，而是将创作者从固有的生命体验中解放出来，鼓励创作者不断拓展生命体验，将更多的时代经验纳入其中。每一个个体都处于一定的社会关系与社会结构之中，其生命体验必定受到个体的局限；当时代变化超出个人熟悉的经验与想象，我们如果不能打开生命体验的边界，便只能\u003cu>            \u003c/u>，无从理解和展现这个时代。\u003c/p>\u003cp>        艺术创新不一定能够创作出精品，但创作精品一定离不开艺术创新。20世纪80年代以来，很多创作者热衷于创新，但大多只是形式、技巧与叙述方式上的创新。真正的创新来自表达的“刚需”，即现有的艺术方法与艺术形式已经无法表现创作者要表达的内容，创作者在表达的过程中自然而然就会创造出新的艺术形式与方法。契诃夫的戏剧是这样、鲁迅的《野草》是这样，许多现代主义经典作品也是这样。\u003c/p>\u003cp>        当谈及“盛唐气象”，我们会想到李白、杜甫、王维等；当谈及“魏晋风度”，我们会想到“竹林七贤”等。正是这些经典作家作品，直接凸显了一个时代的个性与气质。对于一个创作者来说，能否创作出精品乃至创作出代表一个时代的经典，既取决于个人主观努力，也取决于其创作追求与时代精神的契合程度。可以说，精品创作面临着诸多理论与实践上的问题，需要我们做出深入细致的梳理与分析。\u003c/p>","questions":[{"qid":"4678615","cat":"逻辑填空","stem":"依次填入画横线部分最恰当一项是：","options":{"A":"通俗化 革故鼎新","B":"神秘化 抱残守缺","C":"通俗化 萧规曹随","D":"神秘化 自我作古"},"answer":"B","explanation":"第一空，搭配“关系”，B、D两项“神秘化”指使难以捉摸、高深莫测，与“关系”搭配恰当，保留。A、C两项“通俗化”指使通俗的过程，与“关系”搭配不当，排除。\n第二空，根据“受到个体的局限”“无从理解和展现这个时代”可知，横线处所填成语感情色彩偏消极，B项“抱残守缺”指固守旧有事物或思想，而不知改进变通，感情色彩偏消极，与文段感情色彩相符，当选。D项“自我作古”指由自己创造，不沿袭前人，推陈出新，与文段感情色彩不符，排除。\n故正确答案为B。\n【文段出处】《在实践中推动精品创作》","no":18,"missingImage":false},{"qid":"4678623","cat":"片段阅读","stem":"根据文段内容，接下来最不可能做出“深入细致的梳理与分析”的是：","options":{"A":"“精品”与观众“刚需”的关系","B":"“精品”与艺术创新的关系","C":"“精品”与时代精神的关系","D":"“精品”与创作者主体性的关系"},"answer":"B","explanation":"本题为接语选择题，重点关注文段尾句。由尾句“精品创作面临着诸多理论与实践上的问题，需要我们做出深入细致的梳理与分析”可知，文段接下来将详细分析可能影响“精品创作”的要素。\nA项，涉及到“精品”创作，且影响因素“观众‘刚需’”是上文还未详细分析的，后文可能会做出“深入细致的梳理与分析”，排除；\nB项，根据第二段可知，“‘精品’与艺术创新的关系”已经详细分析，后文不会再重复论述，当选；\nC项，涉及到“精品”创作，且影响因素“时代精神”仅在尾段提及，并未详细分析，后文可能会做出“深入细致的梳理与分析”，排除；\nD项，涉及到“精品”创作，且影响因素“创作者主体性”仅在尾段提及，并未详细分析，后文可能会做出“深入细致的梳理与分析”，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《李云雷：在实践中推动精品创作》","no":19,"missingImage":false}]},{"type":"material","material":"\u003cp>        人工智能近些年的快速发展与行业人才的需求特点，导致人工智能人才出现了巨大缺口。据数据显示，中国人工智能人才缺口已超过500万。巨大的人才缺口下，高校的人工智能人才教育不能缺位。但中国人工智能人才的教育现状并非无可挑剔。\u003c/p>\u003cp>        就目前来看，中国缺乏顶尖的人工智能人才。国际人工智能协会评选出的208位院士中，中国籍仅占4席，不仅如此，中国高校还缺乏相应的人工智能师资力量。目前，全球人工智能领域在整体上存在人才匮乏的现状，大约只有10万人工智能人才。近些年来，受到企业高薪酬、大数据研究条件等因素影响，高校中人工智能师资的流失率不断增加。\u003c/p>\u003cp>        据研究报告显示，全球共有超过360所具有人工智能研究方向的高校，其中美国拥有近170所，中国仅30多所。虽然一些中国高校开设了相关课程，但总体上缺乏人工智能的基础教学能力，在独自培养具有动手能力的应用型人才上有所欠缺。\u003c/p>\u003cp>        随着人工智能站上风口，相关人才成为企业争夺的焦点，科大讯飞董事长刘庆峰表示，人工智能领域确实存在人才短缺的问题，导致中国目前人工智能人才的工资比硅谷、英国要高很多。人工智能发展作为国家战略，必须人才先行。\u003c/p>","questions":[{"qid":"4678636","cat":"片段阅读","stem":"最适合做文段标题的是：","options":{"A":"人工智能人才缺口巨大","B":"中美人工智能人才的差异","C":"高校人工智能师资流失严重","D":"企业是人工智能人才最主要的聚集地"},"answer":"A","explanation":"文段第一段指出人工智能人才出现巨大缺口，第二、三段进行具体论述，介绍人工智能人才出现缺口的原因，尾段再次指出人工智能领域存在人才短缺问题，故文段重点论述人工智能人才缺口巨大，对应A项。\nB项，文段并非强调中美人工智能人才之间的差异，而是论述当前人工智能人才短缺，故与文段重点不符，排除；\nC项，对应文段第二段，为解释说明，非重点，排除；\nD项，“企业”非文段重点，文段重点论述人工智能人才出现巨大缺口，排除。\n故正确答案为A。\n【文段出处】《高校加大人工智能人才培养力度 “机器人工程”专业成热门》","no":20,"missingImage":false},{"qid":"4678640","cat":"片段阅读","stem":"对于高校人工智能师资短缺的原因，以下理由不符合原文意思的是：","options":{"A":"高校人工智能师资薪酬低","B":"高校的人工智能课程应用性不足","C":"人工智能人才总体缺口大","D":"企业拥有更好的大数据研究条件"},"answer":"B","explanation":"A项，根据第二段“近些年来，受到企业高薪酬、大数据研究条件等因素影响，高校中人工智能师资的流失率不断增加”可知，“高校人工智能师资薪酬低”是高校人工智能师资短缺的原因之一，排除；\nB项，根据第三段“虽然一些中国高校开设了相关课程，但总体上缺乏人工智能的基础教学能力，在独自培养具有动手能力的应用型人才上有所欠缺”可知，“高校的人工智能课程应用性不足”是中国人工智能人才的教育现状之一，不是高校人工智能师资短缺的原因之一，当选；\nC项，根据第二段“目前，全球人工智能领域在整体上存在人才匮乏的现状，大约只有10万人工智能人才”可知，“人工智能人才总体缺口大”是高校人工智能师资短缺的原因之一，排除；\nD项，根据第二段“近些年来，受到企业高薪酬、大数据研究条件等因素影响，高校中人工智能师资的流失率不断增加”可知，“企业拥有更好的大数据研究条件”是高校人工智能师资短缺的原因之一，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《高校加大人工智能人才培养力度 “机器人工程”专业成热门》","no":21,"missingImage":false},{"qid":"4678563","cat":"逻辑填空","stem":"家中            的藏书和频繁造访的文学界人士，是她踏上文学之路的启蒙，而严肃理性与唯美浪漫并重的家庭教育，则培养她从小具备独立人格与深刻思想。\n填入画横线部分最恰当的一项是：","options":{"A":"俯拾皆是","B":"浩如烟海","C":"鳞次栉比","D":"寥若晨星"},"answer":"B","explanation":"横线处搭配“藏书”，且通过“和”与“频繁造访的文学界人士”构成并列，强调藏书多。B项“浩如烟海”形容书籍、文献、资料等极为丰富，符合文意，当选。\nA项“俯拾皆是”形容到处都有，很容易取得，侧重于多且易得，文段无易得之意，排除；C项“鳞次栉比”指像鱼鳞和梳齿那样相次排列，形容建筑物排列的密集，与“藏书”搭配不当，排除；D项“寥若晨星”指稀少得像早晨的星星，形容数量稀少，与文意相悖，排除。\n故正确答案为B。\n【文段出处】《追逐思维的轨迹》","no":22,"missingImage":false},{"qid":"4678569","cat":"逻辑填空","stem":"在认识世界和改造世界的过程中，旧的问题解决了，新的问题又会产生，同时各方面体制、机制总是需要不断完善，因而改革不可能            。\n填入画横线部分最恰当的一项是：","options":{"A":"一无所获","B":"一挥而就","C":"一劳永逸","D":"一气呵成"},"answer":"C","explanation":"根据横线前“因而”可知，横线处与前文构成因果关系，根据前文“新的问题又会产生······总是需要不断完善”可知，改革还需要不断解决问题，不断完善各方面体制、机制，故横线处意为改革不可能一下子解决所有问题，C项“一劳永逸”形容辛苦一次把事情办好，以后就可以不再费力了，符合文意，当选。\nA项“一无所获”侧重于什么东西都没有获得，文段并没有强调做什么事后毫无收获，不符合文意，排除；\nB项“一挥而就”形容写字、写文章、画画快，与“改革”搭配不当，排除；\nD项“一气呵成”比喻做一件事安排紧凑，迅速不间断地完成，文段并未体现不间断之意，排除。\n故正确答案为C。\n【文段出处】《打好全面深化改革这场攻坚战》","no":23,"missingImage":false},{"qid":"4678592","cat":"逻辑填空","stem":"一直以来，我国文化产业发展方式比较粗放，存在战略规划宏大而实现路径模糊以及生产成本高、附加值低等问题，从长远看，        依靠资源投入来实现发展，必然会影响文化产业发展的质量和收益。因此，实行          经营，不仅是转变文化产业发展方式的题中应有之义，还是提高文化产业发展水平的必由之路。\n依次填入画横线部分最恰当的一项是：","options":{"A":"过渡 集约化","B":"过度 集约化","C":"适当 规模化","D":"充分 规模化"},"answer":"B","explanation":"第一空，根据“······依靠资源投入来实现发展，必然会影响文化产业发展的质量和收益”可知，依靠资源投入实现发展会带来消极影响，文段感情色彩偏消极，横线处所填词语感情色彩应与文段保持一致。B项“过度”指超过适当的限度，感情色彩偏消极，符合文段语境，保留。A项“过渡”指事物由一个阶段或一种状态逐渐发展变化而转入另一个阶段或另一种状态，与文意无关，排除；C项“适当”指合适，D项“充分”指足够或尽量，均为中性词，与文段感情色彩不符，排除。\n第二空，代入验证。B项“集约化”指集合要素优势、节约生产成本以提高单位效益，“集约化经营”可解决文中“存在战略规划宏大而实现路径模糊以及生产成本高、附加值低”的问题，符合文意，当选。\n故正确答案为B。\n【文段出处】《把握文化产业发展的时代特征》","no":24,"missingImage":false},{"qid":"4678600","cat":"逻辑填空","stem":"马克思曾说：“社会不是以法律为基础的。那是法学家们的幻想。相反地，法律应该以社会为基础。法律          社会共同的、由一定物质生产方式所产生的利益和需要的表现，          单个的个人恣意横行。”\n依次填入画横线部分最恰当的一项是：","options":{"A":"应该是 而不是","B":"即便是 也是","C":"与其是 不如是","D":"不仅是 还是"},"answer":"A","explanation":"根据“法律应该以社会为基础”可知，法律具有社会性，即“社会共同的、由一定物质生产方式所产生的利益和需要的表现”，而非“单个的个人恣意横行”，二者之间形成反义并列，A项“应该是······而不是”为反义并列关联词，符合文意，当选。\nB项，“即便是······也是”为让步假设关联词，重在强调后者，与文意不符，排除；\nC项，“与其是······不如是”为选择关联词，重在强调后者，与文意不符，排除；\nD项，“不仅是······还是”为递进关联词，重在强调后者，与文意不符，排除。\n故正确答案为A。\n【文段出处】人民日报《开启法治中国建设新征程（深入学习宣传贯彻党的十九大精神）》","no":25,"missingImage":false},{"qid":"4678604","cat":"逻辑填空","stem":"春天万物复苏，面对烂漫春光，有人在“红杏枝头”        春意，于“拂堤杨柳”陶醉氤氲春雾，有人却            、词不达意，停留在“哇”“超赞”的简单感叹。尽管众人眼中的景色“远近高低各不同”，但网络语言风靡、文化内涵缺失的现象，不经意间影响着越来越多人的日常交流和情感表达。\n依次填入画横线部分最恰当的一项是：","options":{"A":"欣赏 理屈词穷","B":"体味 张口结舌","C":"品味 语竭词穷","D":"鉴赏 无言以对"},"answer":"C","explanation":"本题可以从第二空入手，根据“、”可知，横线处所填成语与“词不达意”语义相近，“词不达意”指词句不能确切地表达出意思和感情， C项“语竭词穷” 指无法用更恰当、更绝妙的文字去表达，符合文意，保留。A项“理屈词穷”指由于理亏而无话可说，B项“张口结舌”形容由于理屈词穷或紧张、害怕而说不出话来，文段没有体现理亏的含义，均与文意不符，排除；D项“无言以对”指完全没有理由来用语言反驳，文段没有体现反驳的含义，与文意不符，排除。\n第一空，代入验证。“品味春意”搭配得当，C项当选。\n故正确答案为C。\n【文段出处】《善用我们的语言宝库》","no":26,"missingImage":false},{"qid":"4678544","cat":"逻辑填空","stem":"眼下的人工智能似乎麻烦不少。研究界对底层技术缺乏突破的争论，产业界对商业应用未达预期的质疑，再加上前段时间“人工智能代表性应用”自动驾驶出现了几次事故等，把人工智能产业推上了            。在一些领域，人工智能应用推进的难度超乎意料。然而，每一次对技术关键点的攻关，也都是突破的机会。技术的突破常常是            ，只有积累到一定阶段，才可能带动质变，迎来整体的爆发。此前的艰难之处，如同破晓之前。\n依次填入画横线部分最恰当的一项是：","options":{"A":"风口浪尖 厚积薄发","B":"刀山火海 韬光养晦","C":"龙潭虎穴 韬光养晦","D":"悬崖峭壁 厚积薄发"},"answer":"A","explanation":"本题可从第二空入手，根据“只有积累到一定阶段，才可能带动质变，迎来整体的爆发”可知，横线处所填成语需体现只有经过长期的积累，才能够有所突破之意。A、D两项“厚积薄发”形容经过长时间的积累和准备而获得巨大的成功，符合文意，保留。B、C两项“韬光养晦”比喻隐藏才能，不使外露，不符合文意，排除。\n第一空，横线处搭配“推上”，且根据“研究界对底层技术缺乏突破的争论······自动驾驶出现了几次事故等”可知，关于人工智能的争论极为激烈。A项“风口浪尖”比喻社会斗争极为激烈、尖锐的地方，符合文意，且“推上风口浪尖”属于常用搭配，当选。D项“悬崖峭壁”形容山势非常险峻，与文意无关，排除。\n故正确答案为A。\n【文段出处】《人民日报新语：拥抱风潮，更需脚踏实地》","no":27,"missingImage":false},{"qid":"4678549","cat":"逻辑填空","stem":"社交媒体巨头自称将            地保护个人隐私，为此不惜与美国政府            ，这些公司的做法一度得到了公众的支持。现在，如果新的证据表明，外国曾利用社交媒体影响2016年美国大选，那么，互联网巨头处理用户数据的方式将再度遭受质疑。\n依次填入画横线部分最恰当的一项是：","options":{"A":"全心全意 当面对质","B":"不遗余力 对簿公堂","C":"倾巢而出 当面对质","D":"倾巢而出 对簿公堂"},"answer":"B","explanation":"第一空，由后文“为此不惜与美国政府······这些公司的做法一度得到了公众的支持”可知，横线处表示社交媒体巨头保护个人隐私的态度或决心，且感情色彩偏积极，A项“全心全意”指投入全部精力，一点没有保留，B项“不遗余力”指毫不保留，竭尽全力，均可体现社交媒体巨头用尽全部精力的保护个人隐私的态度，符合文意，保留。C、D两项“倾巢而出”比喻敌人出动全部兵力进行侵扰，文段并未体现社交媒体巨头要全部出动的含义，且感情色彩偏消极，与文意不符，排除。\n第二空，根据文意可知，横线处表示社交媒体巨头与美国政府对抗，B项“对簿公堂”指原被告双方在法庭上公开审问、争讼，以辨是非，符合文意，当选。A项“当面对质”指双方当面对证，意思虽然可以，但是搭配主体为政府，“当面对质”不如B项“对簿公堂”更恰当，排除。\n故正确答案为B。\n【文段出处】《美三大网络巨头“引火烧身”？》","no":28,"missingImage":false},{"qid":"4678557","cat":"逻辑填空","stem":"有风有雨是         ，风雨无阻是         ，风雨兼程是         。今天的中国，正经历成长的风雨。“莫听穿林打叶声，何妨吟啸且徐行”。无论什么样的风雨，都无法阻挡中国人民奔向美好生活的脚步。\n依次填入画横线部分最恰当的一项是：","options":{"A":"正态 常态 心态","B":"心态 状态 正态","C":"常态 心态 状态","D":"状态 正态 常态"},"answer":"C","explanation":"第一空，修饰“有风有雨”，根据“今天的中国，正经历成长的风雨”可知，横线处表达今天的中国在成长道路上遇到风雨是很正常的事情，A项“正态”、C均“常态”均符合文意，保留。B项“心态”指人的心理状态，不符合文意，排除；D项“状态”无法体现出经常、正常的意思，排除。\n第二空，修饰“风雨无阻”，对应“莫听穿林打叶声，何妨吟啸且徐行”，侧重强调不怕风雨、从容旷达的心境，C项“心态”符合文意，保留。A项“常态”侧重状态，而非心境，排除。\n第三空，代入验证，“风雨兼程是状态”体现出中国无论面对什么样的风雨仍不断前行、勇往直前的状态，C项“状态”符合文意，当选。\n故正确答案为C。\n【文段出处】《人民日报：风雨无阻创造美好生活》","no":29,"missingImage":false},{"qid":"4678566","cat":"逻辑填空","stem":"用“            ”精准捕捉扶贫协作点，以“            ”精准诊断对口帮扶点，拿“            ”精准瞄向持续发展点，方能打赢脱贫攻坚战，实现全面小康。\n依次填入画横线部分最恰当的一项是：","options":{"A":"望远镜 放大镜 显微镜","B":"望远镜 显微镜 放大镜","C":"放大镜 望远镜 显微镜","D":"放大镜 显微镜 望远镜"},"answer":"D","explanation":"本题可从第三空入手，根据后文“精准瞄向持续发展点”并结合选项可知，横线处所填的“观察工具”应体现出观察远处的功能，D项“望远镜”指用来观察天体或远处物体的仪器，具有观察远处的功能，符合文意，保留。A、C两项“显微镜”指一种观察微小物体所使用的光学仪器，B项“放大镜”指用来观察物体微小细节的简单目视光学器件，均为放大功能，不具备观察远处的功能，排除。\n验证前两空，第一空，用“放大镜”精准捕捉扶贫协作点，第二空，以“显微镜”精准诊断对口帮扶点，均符合文意，D项当选。\n故正确答案为D。\n【文段出处】《人民日报人民时评：统筹供需，做好对口帮扶》","no":30,"missingImage":false},{"qid":"4678577","cat":"语句表达","stem":"文艺创作需要个性，                    。缺乏理性的所谓艺术个性往往格调不高。不过是个人意气或情绪宣泄。想以此引领时代，那必定文不对题。因为还没有达到那个艺术和思想高度，不具备那个资格。我们说个性是艺术的生命，但缺乏理性的个性就是偏执，没有真正艺术价值，哗众取宠一时可以，注定不能传之久远。\n填入画横线部分最恰当的一项是：","options":{"A":"但文艺创作更需要理性","B":"因为艺术个性能够提升格调","C":"个性创作才能引领时代","D":"这是真正艺术价值所在"},"answer":"A","explanation":"横线位于文段开头，是对全文内容的概括。横线前指出文艺创作需要个性，横线后指出缺乏理性的艺术格调不高，多为个人意气或情绪的宣泄，想以此引领时代是文不对题的，随后进行原因解释，尾句进一步总结，指出缺乏理性的文艺创作注定不能传之久远。故横线处应与上半句构成转折，强调“理性”对文艺创作的重要性，对应A项。\nB、C、D三项，均偏离文段核心话题“理性”，与下文衔接不恰当，排除。\n故正确答案为A。\n【文段出处】《文论经纬：深入体悟生活 才能引领时代》","no":31,"missingImage":false},{"qid":"4678597","cat":"语句表达","stem":"人们熟闻种种“尬X”，“尬”字究竟为何意，却并非人尽确知。若以为“尬”就是“尴尬”之意，                    。以“尬舞”为例。这里的“尬”是一个动词，意为“比赛、较量”。“尬舞”的本源是“较舞”，闽南语中比拼舞技的意思。闽南语中将“较”读作gà，在内地引用、传播时，许多人知其音却不知其字，便索性找了一个同音字代替，造出“尬舞”一词，却未成想，新造的词居然火遍大江南北。\n填入画横线部分最恰当的一项是：","options":{"A":"那就泛化了“尬”的含义","B":"显然窄化了“尬”的含义","C":"则强化“尬”本来的含义","D":"实则曲解了“尬”的含义"},"answer":"B","explanation":"语句填空题，横线出现在文段中间，需要承上启下。横线前指出“尬”字究竟为何意，并不是人尽确知的，横线后通过“尬舞”的例子，具体论述“尬”字除了有尴尬之意外，还有较量等多重含义，故横线处应体现出“尬”字有多重含义，并不只有尴尬的意思，即缩小了“尬”字的含义范围之意，对应B项。\nA项，“泛化”是指扩大，而文段是缩小了“尬”字含义范围，表述相悖，排除；\nC项，“强化”指的是加强了“尬”字的本身含义，不能与后文举例内容进行衔接，排除；\nD项，“曲解”指的是误解了“尬”字本身的含义，而文段强调的是“尬”字有多重含义，并不是误解，无法与后文衔接，排除。\n故正确答案为B。\n【文段出处】人民日报《“尬文化”何以流行起来?》","no":32,"missingImage":false},{"qid":"4678603","cat":"片段阅读","stem":"对下面6个句子语序排列正确的一项是：\n①对于任何一个民族文化而言\n②人类历史的前进\n③方能获得文化补偿\n④拥有文化输出与文化接受的健全机制\n⑤离不开文化的交流融合\n⑥赢得空间上的拓宽和时间上的延展","options":{"A":"①④③⑥②⑤","B":"②⑤①④⑥③","C":"②⑤①④③⑥","D":"①④⑥③②⑤"},"answer":"C","explanation":"首句无法确定，结合选项，对比①④和②⑤的顺序。②⑤指出人类历史离不开“文化的交流融合”，①④进一步围绕“民族文化输出与文化接受”详细展开阐述，根据逻辑顺序，②⑤应排在①④之前，排除A、D两项。\n比较B、C两项，⑥“赢得空间上的拓宽和时间上的延展”是“获得文化补偿”的具体表现，应排在③之后，锁定C项。\n故正确答案为C。\n【文段出处】《中国文化概论-读后感》","no":33,"missingImage":false},{"qid":"4678626","cat":"语句表达","stem":"下列各句中，没有语病的一句是：","options":{"A":"现在医学发达，移植记忆也许不是完全可能的事。","B":"一部文学作品具有强大的生命力在于能否为读者奉上丰富、新颖、优质的精神食粮。","C":"在金融危机席卷全球的形势下，广大出口加工型企业只有大力开拓国内外市场，学会内销与外销两条腿走路，才能逐步完善企业销售网络，实现自救。","D":"当代大众文化以其消遣娱乐作用满足了人的感性需要，从而在一定程度上解决了理性的压抑，因此具有某种历史的合理性。"},"answer":"C","explanation":"A项，根据“现代医学发达”可知，句子强调移植记忆是可能实现的，“不是完全可能”表示否定含义，肯否矛盾，应改为“不是完全不可能”或“是完全可能”，排除；\nB项，“生命力”对应“能否为读者奉上精神食粮”属于一面对两面，应改为“是否具有强大的生命力在于能否······精神食粮”或“具有强大的生命力在于能······精神食粮”，排除；\nC项，句子没有语病，句意明确，当选；\nD项，“解决了理性的压抑”动宾搭配不当，应改为“解除了理性的压抑”，排除。\n故正确答案为C。","no":34,"missingImage":false},{"qid":"4678630","cat":"片段阅读","stem":"所谓“黑箱”就是指那些既不能打开，又不能从外部直接观察其内部状态的系统。比如人的大脑只能通过信息的输入和输出来确定其结构和参数。\n通过这句话我们不能推导出：","options":{"A":"黑箱的定义","B":"黑箱的参数","C":"人的大脑就是黑箱","D":"黑箱可以通过信息的输入和输出来确定参数"},"answer":"B","explanation":"A项，根据“所谓‘黑箱’就是指那些既不能打开，又不能从外部直接观察其内部状态的系统”可知，黑箱的定义已提及，表述正确，排除；\nB项，文段并未提及黑箱的参数，无中生有，当选；\nC项，根据“比如人的大脑”可知，文段以人的大脑为例解释说明“黑箱”，所以人的大脑也是黑箱的一种，表述正确，排除；\nD项，根据“比如人的大脑只能通过信息的输入和输出来确定其结构和参数”可知，文段以人的大脑为例，对黑箱进行解释说明，所以黑箱确定参数的方式应与人的大脑是相似的，表述正确，排除。\n本题为选非题，故正确答案为B。","no":35,"missingImage":false},{"qid":"4678635","cat":"片段阅读","stem":"健康类APP主要分为四种。健康数据管理类APP：通过用户健康数据输入评测，并记录每天的饮食、运动、生活规律等数据，测评其未来健康状况并提出一些改善建议，为用户定制方案、规划行动。健康信息咨询类APP：对用户健康数据进行管理，使用户从健康传播来获得自己想要的健康信息，输入体征数据进行自诊，也可以在线向专家进行问诊等。健康方式养成类APP：主要包括饮食类APP和体育锻炼类APP，是针对日常饮食以及运动开发出的软件应用。问诊类APP：可以实现一对一的个性化健康管理，但需支付一定的费用，在中国普及率极低。\n根据这段文字可知，不正确的一项是：","options":{"A":"健康数据管理类APP可以帮助用户测评其未来健康状况","B":"相较于其他健康类APP，问诊类APP更适合用户的需求","C":"健康信息咨询类APP可以帮助用户进行自诊","D":"健康方式养成类APP主要包括饮食类APP和体育锻炼类APP"},"answer":"B","explanation":"A项，根据“健康数据管理类APP······测评其未来健康状况并提出一些改善建议”可知，表述正确，排除；\nB项，根据“问诊类APP：可以实现一对一的个性化健康管理，但需支付一定的费用，在中国普及率极低”可知，问诊类APP因收费而不被选择，故相较于其他健康类APP，问诊类APP不太适合用户需求，与文意相悖，当选；\nC项，根据“健康信息咨询类APP······输入体征数据进行自诊”可知，表述正确，排除；\nD项，根据“健康方式养成类APP：主要包括饮食类APP和体育锻炼类APP”可知，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《健康类APP现状分析与研究》","no":36,"missingImage":false},{"qid":"4678550","cat":"片段阅读","stem":"细胞膜作为一个屏障，使细胞内液成分不完全相同于细胞外液，并保持相对稳定。但是，细胞在进行新陈代谢的过程中，需要不断选择性地摄入和排出多种多样的物质，这些物质的交换是通过细胞膜有选择性地进行的。物质通过细胞膜的运输途径大体是：脂溶性的小分子物质，可通过物理扩散透过细胞膜；水溶性的小分子物质或离子，需要借助相关蛋白质的介导才能完成跨膜运输；大分子物质或颗粒性物质，则通过细胞膜的整装转运进出细胞。\n根据题意，接下来最有可能阐述的是：","options":{"A":"细胞膜的分类","B":"蛋白质的介导原理","C":"物质跨膜运输的障碍","D":"新陈代谢中的物质交换"},"answer":"C","explanation":"本题为接语选择题，重点把握文段最后谈论的核心话题。文段开篇引出细胞膜这一话题，并介绍了多种物质需要通过细胞膜进出，最后具体论述了“物质通过细胞膜的运输途径”，并通过并列的三方面对其进行了解释说明。故接下来应继续围绕“物质通过细胞膜”这一话题展开论述，即“物质跨膜运输”，对应C项。\nA项，文段最后并非只是重点介绍“细胞膜”，与文段最后论述核心话题不符，排除；\nB项，“蛋白质的介导”为最后解释说明中的一部分，表述片面，且并非最后论述的核心话题，排除；\nD项，对应文段“细胞在进行新陈代谢的过程中，需要不断选择性地摄入和排出多种多样的物质”，为前文已论述过的内容，后文不会重复论述，排除。\n故正确答案为C。\n【文段出处】《物质跨膜运输的方式》","no":37,"missingImage":false},{"qid":"4678561","cat":"片段阅读","stem":"看不清东西几乎是老年人的普遍现象，由眼睛疾病造成看不清的原因主要有4种：老花眼、飞蚊症、白内障、眼底黄斑疾病。但是，看不清东西，不都是眼睛的问题。单眼或双眼一过性视力下降或丧失，医学上称“一过性黑矇”，多数是因供应眼球的脑动脉缺血造成的，常见于短暂性脑缺血病人。复视患者单眼视线清晰，但双眼看东西尤其向某一方向看时，出现双影或重影，不排除脑梗死、脑出血、脑肿瘤、糖尿病神经病变、重症肌无力等原因。双眼视物不全的人，表现为只能看到视野内一部分，比如吃饭时总有一半的碗内剩有饭粒，这种情况常见于脑肿瘤病人，需及早诊治。\n根据文段内容，作者意在强调：","options":{"A":"看不清东西不一定是眼睛的问题","B":"“一过性黑矇”是老年人的常见问题","C":"脑肿瘤是导致视线模糊的重要原因","D":"眼睛疾病往往跟脑部因素紧密相关"},"answer":"A","explanation":"文段开篇引出老年人看不清东西的话题，并提出四种主要原因，接着通过转折标志词“但是”强调看不清东西不全是眼睛的问题，后文详细介绍了“一过性黑矇”“复视患者”“双眼视物不全的人”看物不清的原因，故文段主要强调看不清东西不全是眼睛的问题，对应A项。\nB项，“一过性黑矇”对应解释说明部分，非重点，且“是老年人的常见问题”无中生有，排除；\nC项，“脑肿瘤是导致视线模糊的重要原因”无中生有，排除；\nD项，“眼睛疾病”表述不明确，文段主要强调“看不清东西”，排除。\n故正确答案为A。\n【文段出处】《看不清不一定是老花――可能是飞蚊症、白内障等其他眼病》","no":38,"missingImage":false},{"qid":"4678572","cat":"片段阅读","stem":"最近许多城市对形象提出了所谓高标准的要求，最为典型的案例就是连街道店铺的门面和招牌都要统一标准。这种做法已经遭到了社会舆论的诟病。其实游客一般选择在城市的什么地方留影拍照，最能够说明问题。我想没有人愿意在地产商开发的居民楼或者大的购物中心拍照吧，毕竟这些地方全世界几乎都一样。拍照选择的景点最多的是历史和文化遗迹，当然还有特色景观和建筑，甚至包括广场。很多人到欧洲，喜欢在欧洲城市街区拍照，原因是建筑的风格和街区的文化特征的丰富多样性，使自己流连忘返。这些建筑，包括街区形象的文化特色，都是建立在个性化风格组合的基础之上，经过千百年的洗礼，给予了我们最好的视觉享受。\n根据文段内容，作者意在强调：","options":{"A":"城市建设应当注重文化视觉效果","B":"旅游拍照当选择历史和文化遗迹","C":"应大力推崇特色的历史文化遗迹","D":"城市形象管理要尊重个性化选择"},"answer":"D","explanation":"文段开篇引出城市形象的话题，并提出当前“所谓高标准”这一要求深受社会舆论的诟病这一问题，接着通过转折词“其实”指出了解游客对拍照地点的偏爱，可以知晓大家喜欢的城市形象，找到解决问题的方法。随后指出游客更喜欢在有特色的地点拍照，后文通过欧洲的例子进一步解释说明，人们喜欢的是欧洲的个性化风格组合，故文段重点强调城市形象的正确方向应该是具有特色的，是要建立在个性化的基础上的，D项“尊重个性化选择”为文段重点的同义替换，当选。\nA项，文段强调的是“个性化”，而非“文化视觉效果”，排除；\nB项，“旅游拍照”偏离文段的核心话题，文段重在讨论“城市形象”，排除；\nC项，文段强调的是城市形象要尊重“个性化选择”，而“特色的历史文化遗迹”缩小范围，排除。\n故正确答案为D。\n【文段出处】《城市形象的管理要尊重个性化的选择》","no":39,"missingImage":false},{"qid":"4678611","cat":"片段阅读","stem":"三国魏晋南北朝期间，虽然也有较安定的时候，但毕竟很短暂，社会动乱是主流，士人也像普通人一样把保命作为第一要务，诸葛亮说的“苟全性命于乱世，不求闻达于诸侯”颇有代表性。而竹林七贤、兰亭雅士，则是当生命稍有保障时便抓紧时间享乐的典型代表。乱世的残酷现实与求生的强烈愿望交织促进人性的觉醒，士人感觉到纯粹本我更重要，所以属于角色意识的士节被淡化了。\n画线文句想表达的意思是：","options":{"A":"在乱世里保全好自己的性命，并努力为诸侯建功立业","B":"在面对复杂局面以及危难的时候，要沉得住气，不要急于出头","C":"在乱世里保全好自己的性命，不去打听诸侯的事","D":"在乱世里好好享乐，保全好自己的性命，不追求在诸侯中做官扬名"},"answer":"D","explanation":"画线文句位于文段第一句，结合“颇有代表性”可知，诸葛亮说的这句话想表达的意思呼应前文“士人也像普通人一样把保命作为第一要务”，强调在社会动乱时士人的士节被淡化，而更注重保全自己的性命，对应D项。\nA项，“努力为诸侯建功立业”与画线文句想表达的意思相悖，排除；\nB项，“要沉得住气，不要急于出头”无中生有，排除；\nC项，“不求闻达于诸侯”指的是不求在诸侯中扬名显贵，而非“不去打听诸侯的事”，表述有误，排除。\n故正确答案为D。\n【文段出处】《王学泰：说“士节”》","no":40,"missingImage":false},{"qid":"4678616","cat":"片段阅读","stem":"现在我深刻理解了“文学源于生活而高于生活”这句话是什么意思，文章都有个主题，但是生活没有。生活不是写文章，能提炼出一个中心思想，最后还要总结升华，生活真的只是一个过程而已。不过我仍旧怀揣美好的希望，希望在未来的某一天，能为我珍藏的好故事找到一个好的主题。\n从这段文字中我们可以看出，作者认为“生活的主题”：","options":{"A":"高于文章的主题","B":"是文学主题的来源","C":"是自己寻求的一种期望","D":"是对生活过程的提炼和升华"},"answer":"C","explanation":"文段开篇通过“文学源于生活而高于生活”引出生活没有主题这一观点，随后对生活与写文章的不同展开解释。尾句通过转折词“不过”提出，仍希望能为生活找一个好的主题。故文段为分总结构，重在强调期望能为生活找到一个好的主题，对应C项。\nA项，文段并未提及“高于文章的主题”，无中生有，排除；\nB项，“文学主题的来源”文段并未提及，无中生有，排除；\nD项，由“生活不是写文章······最后还要总结升华，生活真的只是一个过程而已”可知，“是对生活过程的提炼和升华”与文意相悖，排除。\n故正确答案为C。","no":41,"missingImage":false},{"qid":"4678547","cat":"片段阅读","stem":"河南安阳新发现一处金代砖雕壁画墓。这是豫北地区第一次发现金代高僧墓葬。考古发掘显示，该墓为仿木结构八边形单室砖墓，南北向，墓道向南，墓葬全长9.35米，由墓道、墓门、甬道及墓室等组成。墓室平面呈八边形，北壁、西壁和东壁各砌有一个耳室，耳室内共放置了四件陶罐，里面装有火化后的骨灰。结合出土的墓志，考古人员判断骨灰分属于四名高僧。据介绍，这处墓葬的壁画独具特色。墓室的西北、西南、东北和东南均绘制有彩画，其中童子启门图和行医图尤为罕见。根据记载，该墓为金代“正隆四年”（1159）相州洪福寺文殊院院主洪论为几位高僧修建。专家表示，该墓纪年明确，设计独特，墓志内容丰富，保存完整的壁画真实地反映金代人们的宗教信仰、求医问药、社会生活形态等，具有重要的历史和艺术价值。\n以下说法与文段内容相符的是：","options":{"A":"这是豫北地区首次发现的高僧墓葬","B":"墓室主人是洪福寺文殊院院主洪论","C":"童子启门图是该墓壁画的独特设计","D":"墓志内容表明四名高僧皆擅长行医"},"answer":"C","explanation":"A项，根据“这是豫北地区第一次发现金代高僧墓葬”可知，“首次发现的高僧墓葬”偷换概念，排除；\n\nB项，根据“该墓为金代‘正隆四年’（1159）相州洪福寺文殊院院主洪论为几位高僧修建”可知，墓室主人是几位高僧，而非洪论，排除；\nC项，根据“墓室的西北、西南、东北和东南均绘制有彩画，其中童子启门图和行医图尤为罕见”可知，表述正确，当选；\nD项，“四名高僧皆擅长行医”文中并未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】《豫北地区首次发现金代高僧壁画墓》","no":42,"missingImage":false},{"qid":"4678553","cat":"片段阅读","stem":"澳大利亚的一项新研究发现，内陆河流支流的不良水质，尤其是洪灾后水中的废弃物、地表沉积物和营养污染物等流进海水后，将使白化珊瑚自愈速度变缓，且更容易遭到病害侵袭。如将内陆河流支流水质改善6%至17%很可能会减少近海地区珊瑚白化现象。澳大利亚海洋学研究所、澳大利亚研究理事会珊瑚礁研究项目中心、阿德莱德大学等机构的研究人员在1995年至2017年期间，采集了大堡礁46个地点的珊瑚覆盖数据，以评估热带气旋、疾病暴发和珊瑚白化对珊瑚礁所造成的影响，同时还检测了珊瑚从损害中自我修复的情况。不过研究人员也提示，仅改善地区水质并不能保护对海水温度敏感的热敏珊瑚。近年来，澳大利亚东北沿海的大堡礁珊瑚出现大规模白化迹象。除气候变化引起的海洋温度变化外，大堡礁还面临海洋污染、过度捕捞等威胁。\n以下说法与文段内容不符的是：","options":{"A":"改善地区水质有助于白化珊瑚自愈","B":"海洋温度变化是大堡礁珊瑚白化的重要原因","C":"内陆河流的污染是珊瑚礁受到的最大威胁","D":"不良水质容易使白化珊瑚遭受疾病侵害"},"answer":"C","explanation":"A项，根据“如将内陆河流支流水质改善6%至17%很可能会减少近海地区珊瑚白化现象”可知，改善水质有利于白化珊瑚自愈，表述正确，排除；\nB项，根据“不过研究人员也提示，仅改善地区水质并不能保护对海水温度敏感的热敏珊瑚······除气候变化引起的海洋温度变化外，大堡礁还面临海洋污染、过度捕捞等威胁”可知，海洋温度对大堡礁珊瑚的白化有较大影响，表述正确，排除；\nC项，文段并未提及珊瑚礁所受最大威胁是内陆河流污染，无中生有，当选；\nD项，根据“内陆河流支流的不良水质，尤其是洪灾后水中的废弃物、地表沉积物和营养污染物等流进海水后，将使白化珊瑚自愈速度变缓，且更容易遭到病害侵袭”可知，不良水质会使白化珊瑚遭受病害侵袭，表述正确，排除；\n本题为选非题，故正确答案为C。\n【文段出处】《改善地区水质有助于大堡礁珊瑚“自愈”》","no":43,"missingImage":false},{"qid":"4678562","cat":"片段阅读","stem":"畅游一时爽，淹溺转瞬间。炎炎夏日，不少人喜欢到江、河、水塘里游泳，总是有人“一去不回”。溺水事故频发的背后既有安全设施不足、监管缺位，也有漠视规则和安全常识缺乏。一个人的生命只有一次，生命安全高于一切。江河湖泊、水塘水库水渠旁边的警示牌不只是善意的提醒，更是不可逾越的红线。只有安全意识“浮上来”，生命才不会“沉下去”。\n最适合做这段文字标题的是：","options":{"A":"夏日溺水事故频发","B":"只有安全意识“浮上来”，生命才不会“沉下去”","C":"生命安全高于一切","D":"游泳不可逾越警示牌"},"answer":"B","explanation":"文段开篇说明在夏日人们喜欢畅游，但是经常有人在游泳时发生意外，随后对溺水事故频发的原因进行了分析。后文强调生命安全的重要性，并通过“警示牌是不可逾越的红线”再次论证了生命安全很重要。尾句通过“只有······才······”提出对策，说明了提升安全意识才能实现生命安全。故文段重点即为尾句所强调的“提升安全意识”，对应B项，且B项表述较为生动形象，符合标题特点。\nA项，对应文段首句，属于话题引入，非重点，排除；\nC项，文段重点强调对策，即如何实现生命安全，该项为重要性表述，非重点，排除；\nD项，“警示牌”偏离文段核心话题“安全意识”，且该项表述不如B项生动形象，排除。\n故正确答案为B。\n【文段出处】《新华网评：安全意识“浮上来”，生命才不会“沉下去”》","no":44,"missingImage":false},{"qid":"4678571","cat":"片段阅读","stem":"《2017年中国互联网网络安全报告》提到，我国网络空间法治进程进入新时代，网络反诈工作正在持续推进，但“钓鱼网站”域名注册向境外转移，“网络武器库”泄露后风险威胁凸显。敲诈勒索和“挖矿”等牟利、恶意攻击事件数量大幅增长，应用软件供应链安全问题触发连锁反应。\n由此可推知，作者接下来最可能谈及的内容是：","options":{"A":"如何推进网络安全工作","B":"加快网络空间法治进程","C":"网络安全问题存在的原因","D":"持续推进网络反诈工作"},"answer":"A","explanation":"本题为接语选择题，需通读全文，重点把握文段最后论述的核心话题。文段开篇提出我国维护网络安全的对策，即网络空间法治和网络反诈工作持续推进，后文通过转折词说明目前网络安全领域出现的新问题。依据“话题一致”原则，后文应围绕“网络安全”展开论述，且应当说明如何解决网络安全领域出现的新问题，对应A项。\nB项“网络空间法治”和D项“网络反诈”均与文段核心话题“网络安全”不符，且为前文论述过的内容，排除；\nC项，依据文段脉络，文段先说明对策，接着说明对策无法解决新问题，后文应当围绕对策展开，说明如何优化对策解决新问题，且文段尾句已提及产生敲诈、“挖矿”这一系列问题的原因就是牟利，故后文不会继续论述原因，排除。\n故正确答案为A。\n【文段出处】《2018中国网络安全年会举行 业界呼吁：漏洞管理亟待加强》","no":45,"missingImage":false}]}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"4677881","cat":"数学运算","stem":"\u003cimg data-k=\"0f1fa1d0536c\">，\u003cimg data-k=\"4708371a12d0\">，\u003cimg data-k=\"bec3fe75cd62\">，\u003cimg data-k=\"a8b04cd19bab\">，（    ）","options":{"A":"\u003cimg data-k=\"5e907678c197\">","B":"\u003cimg data-k=\"6f9d0abe3e0f\">","C":"\u003cimg data-k=\"3541cedda7ac\">","D":"\u003cimg data-k=\"72020bbb1525\">"},"answer":"B","explanation":"数列均为分数，考虑分数数列。观察分子分母，增减规律不统一，考虑反约分。将原数列转化为：\u003cimg data-k=\"e20626189fde\">，\u003cimg data-k=\"4708371a12d0\">，\u003cimg data-k=\"32fe2de8aef9\">，\u003cimg data-k=\"8c32142a8f57\">，（    ）。分母部分均为12，则所求项分母部分也为12；分子部分为6，5，4，3，是公差为-1的等差数列，则所求项分子部分为2。故所求项为\u003cimg data-k=\"6e18ea78f9ed\">。\n故正确答案为B。","no":46,"missingImage":false},{"type":"question","qid":"4677894","cat":"数学运算","stem":"（4，12），（8，6），（16，3），（12，x）。x应为（    ）。","options":{"A":"2","B":"4","C":"6","D":"8"},"answer":"B","explanation":"原数列两两一组，考虑组内数字相乘：4×12=48，8×6=48，16×3=48，乘积为固定值48，所以\u003cimg data-k=\"d041c8af35a6\">，所求x=4。\n故正确答案为B。","no":47,"missingImage":false},{"type":"question","qid":"4677908","cat":"数学运算","stem":"\u003cimg data-k=\"0f1fa1d0536c\">，\u003cimg data-k=\"8c3342040bcf\">，\u003cimg data-k=\"732258bb32ee\">，\u003cimg data-k=\"8d313893f3a8\">，（    ）","options":{"A":"\u003cimg data-k=\"e138951cf7eb\">","B":"\u003cimg data-k=\"9bf59b9915e3\">","C":"\u003cimg data-k=\"7ed35d6161a4\">","D":"\u003cimg data-k=\"923b442d24b0\">"},"answer":"C","explanation":"方法一：数列均为分数，考虑分数数列，分数分子不是递增或递减趋势，考虑反约分。将原数列转化为：\u003cimg data-k=\"0f1fa1d0536c\">，\u003cimg data-k=\"8c3342040bcf\">，\u003cimg data-k=\"732258bb32ee\">，\u003cimg data-k=\"aba05f381b0f\">，（    ）。分子部分：1，2，3，4，是连续自然数列，则所求项分子为5；每一项分子分母的乘积形成新数列：2，6，24，120，有明显倍数关系，6÷2=3，24÷6=4，120÷24=5，商是公差为1的等差数列，则新数列下一项为120×6=720，则所求项分母为\u003cimg data-k=\"015b6c454a29\">，故所求项为\u003cimg data-k=\"7ed35d6161a4\">。\n方法二：数列均为分数，考虑分数数列，分数分子不是递增或递减趋势，考虑反约分。将原数列转化为：\u003cimg data-k=\"0f1fa1d0536c\">，\u003cimg data-k=\"8094fee892e0\">，\u003cimg data-k=\"c77d35638779\">，\u003cimg data-k=\"907e2f52fb86\">，（    ）。观察发现分子为幂次数列：\u003cimg data-k=\"7f87e04491d3\">，\u003cimg data-k=\"06892f33e3d9\">，\u003cimg data-k=\"9afc744d4ae7\">，\u003cimg data-k=\"21592fe5e98a\">，则所求项分子为\u003cimg data-k=\"cc38ec7113e1\">；观察发现分母相邻两项有明显倍数关系，为\u003cspan style=\"color:#rgb(89,89,89)\">作\u003c/span>商数列，后项÷前项得到：3，4，5，则所求项分母为120×6=720，故所求项为\u003cimg data-k=\"c692d2b7f829\">。\n故正确答案为C。","no":48,"missingImage":false},{"type":"question","qid":"4677903","cat":"数学运算","stem":"一条公路沿线顺次有甲、乙、丙、丁、戊5个仓库，相邻仓库间隔100千米。甲仓库有10吨货物，乙仓库有20吨货物，戊仓库有40吨货物，其余两个仓库无货物。现在准备把所有货物集中到一个仓库里，如果每吨货物运输成本是每千米1元运费，那么运费最少是多少元？","options":{"A":"9000","B":"10000","C":"11000","D":"12000"},"answer":"B","explanation":"方法一：\n分情况讨论：\n全部放到甲仓库：总运费为(20×100+40×400)×1=18000元；\n全部放到乙仓库：总费用为(10×100+40×300)×1=13000元；\n全部放到丙仓库：总费用为(10×200+20×100+40×200)×1=12000元；\n全部放到丁仓库：总费用为(10×300+20×200+40×100)×1=11000元；\n全部放到戊仓库：总费用为(10×400+20×300)×1=10000元。\n即所有货物集中到戊仓库运费最少，为10000元。\n方法二：货物集中问题，最佳方案只与各个仓库的存放量有关，与距离及运费无关。根据甲、乙两个仓库分别有10吨、20吨货物，戊仓库有40吨货物，丙、丁两个仓库无货物。单独看甲、乙两个仓库，同样运输距离下，乙仓库存放量更多，因此应运到乙仓库；合并甲、乙两个仓库之后和戊仓库比较，戊仓库的存放量比甲、乙两个仓库加起来的总和还多，因此应集中到戊仓库。所有货物集中到戊仓库运费为(10×400+20×300)×1=10000元。\n故正确答案为B。","no":49,"mi
