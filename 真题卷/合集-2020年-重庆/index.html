\">分钟，此时乙跑的路程是220×12.5=2750米，即乙跑的圈数是\u003cimg data-k=\"3ab7eabd969c\">圈。\n故正确答案为B。","no":53,"missingImage":false},{"type":"question","qid":"4678570","cat":"数学运算","stem":"某办公室7人中有3人精通德语。如果从中任意选出3人，其中恰有1人精通德语的概率是（    ）。","options":{"A":"0.514","B":"0.623","C":"0.544","D":"0.675"},"answer":"A","explanation":"从办公室7人中任意选出3人，共有\u003cimg data-k=\"6d8e963ff89c\">种组合方式；而选出的3人中恰有1人精通德语，应从3个精通德语的人中选出1人，从剩下的4人中选出2人，则共有\u003cimg data-k=\"297233b0d51c\">\u003cimg data-k=\"ddd0f3ffc8b1\">种组合方式。故选出的3人中，恰有1人精通德语的概率为：\u003cimg data-k=\"8f8339e9e09c\">。\n故正确答案为A。","no":54,"missingImage":false},{"type":"question","qid":"4678607","cat":"数学运算","stem":"工厂有一种测量中控工件内径的方法，就是用半径为R的钢珠放在圆柱形内孔上，只要测得钢珠顶端与工件顶端面之间的距离X，就可以求出工件内孔径（如下图所示）。已知X=5cm，R=3cm，那么该工件内径的直径是（    ）。\n\u003cimg data-k=\"514f365c4fd4\" style=\"max-width:272px\">","options":{"A":"\u003cimg data-k=\"740bbf132b19\">cm","B":"\u003cimg data-k=\"6ca7dbc6af43\">cm","C":"\u003cimg data-k=\"a17b4f1baa45\">cm","D":"4cm"},"answer":"A","explanation":"\u003cimg data-k=\"2a9e218cdd5c\" style=\"max-width:300px\">\n如图所示，连接钢珠与圆柱内径的交点A、B，连接钢珠的圆心O与点B，连接钢珠的最高点C与圆心O，并延长交AB于点D，则三角形ODB为直角三角形。OC、OB为钢珠的半径，OC=OB= 3cm，OD=5-3=2cm。根据勾股定理得\u003cimg data-k=\"8b93d2e88d67\">\u003cimg data-k=\"5a97aa3e10d4\">\u003cimg data-k=\"8968d02ecba7\">cm，则AB的长度为\u003cimg data-k=\"740bbf132b19\">cm，即该工件内径的直径是\u003cimg data-k=\"740bbf132b19\">cm。\n故正确答案为A。","no":55,"missingImage":false},{"type":"question","qid":"4678614","cat":"数学运算","stem":"某美容美发店有两位理发师，现同时来了5位有不同理发需求的顾客，他们分别需要10分钟、12分钟、15分钟、20分钟和24分钟，那么5人全部理完最少要（    ）。","options":{"A":"38分钟","B":"42分钟","C":"46分钟","D":"49分钟"},"answer":"B","explanation":"若要5人全部理完所用时间最少，则让两位理发师的理发时长尽量接近，则5人全部理完的时间\u003cimg data-k=\"fe0103c7eda3\">分钟，排除A项。代入B项：当5人全部理完最少要42分钟时，即其中一位理发师（A）的理发时长为42分钟，其顾客的理发时长分别为10分钟、12分钟、20分钟，另外一位理发师（B）的顾客理发时长为15分钟、24分钟，15+24=39分钟&lt;42分钟，符合题意，且为最少时间，当选。\n\u003cimg data-k=\"ae0dba38167b\" style=\"max-width:482px\">\n故正确答案为B。","no":56,"missingImage":false},{"type":"question","qid":"4678620","cat":"数学运算","stem":"某种细菌在培养过程中，每20分钟分裂一次（一个分裂成2个），经过2小时，这种细菌由3个分裂成（    ）个。","options":{"A":"64","B":"96","C":"192","D":"381"},"answer":"C","explanation":"2小时=60×2分钟=120分钟，则这种细菌共会分裂120÷20=6次，每个细菌分裂次数与分裂后的细菌数量关系如下表所示：\n\u003cimg data-k=\"48a4e27922cb\" style=\"max-width:700px\">\n则2小时后3个细菌分裂成\u003cimg data-k=\"d1f2e126ee3d\">个。\n故正确答案为C。","no":57,"missingImage":false},{"type":"question","qid":"4678637","cat":"数学运算","stem":"某大学生利用课余时间开网店销售某种服装，才开始销售时知名度不高。为了吸引顾客，就按原定售价打对折销售。一段时间后，生意红火起来，他悄悄地加价14.5元出售。一段时间后他发现顾客又少了，于是又降价2.5元以96.4元出售。已知他当初原定售价是在进货价上加40.5元，那么这种服装的进货价是（    ）。","options":{"A":"128.65元","B":"64.15元","C":"168.8元","D":"128.3元"},"answer":"D","explanation":"设这种服装的进货价为x元，原定售价为（x+40.5）元。根据题意可列式：\u003cimg data-k=\"fee825e06239\">，解得x=128.3，即这种服装的进货价是128.3元。\n故正确答案为D。","no":58,"missingImage":false}],"count":13,"answerable":13,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"4678594","cat":"图形推理","stem":"根据图形规律，填入问号处最合适的一项是：\n\u003cimg data-k=\"53dea2964ee4\" style=\"max-width:688px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"图形元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图形线条交叉明显，考虑交点数。题干图形的交点数分别为6、7、8、9、10、？，因此？处图形的交点数应为11，只有B项符合规律。\n故正确答案为B。","no":59,"missingImage":false},{"type":"question","qid":"4678606","cat":"图形推理","stem":"根据图形规律，填入问号处最合适的一项是：\n\u003cimg data-k=\"fcc2dec38875\" style=\"max-width:466px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"图形元素组成不同，优先考虑属性规律。观察发现，题干出现全直线、全曲线图形，优先考虑曲直性。九宫格优先横行看，第一行图形均由直线组成，第二行图形均由曲线组成，第三行图1和图2均由曲线和直线构成，故？处图形应该由曲线和直线构成，只有D项符合规律。\n故正确答案为D。","no":60,"missingImage":false},{"type":"question","qid":"4678625","cat":"图形推理","stem":"根据图形规律，填入问号处最合适的一项是：\n\u003cimg data-k=\"f22408a21c01\" style=\"max-width:324px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，九宫格优先横向看，观察发现，第一行汉字的第一笔均为“丶”，第二行汉字的第一笔均为“一”，第三行前两个汉字的第一笔均为“丨”，则问号处应选择第一笔为“丨”的汉字，只有C项符合。\n故正确答案为C。","no":61,"missingImage":false},{"type":"question","qid":"4678632","cat":"图形推理","stem":"左边给定的是纸盒的外表面，下列哪一项能由它折叠而成？\n\u003cimg data-k=\"f4f89a58edb5\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"将原展开图标上序号如下图，逐一进行分析。\n\u003cimg data-k=\"d55e0b659d85\" style=\"max-width:600px\">\nA项：选项前面是面e，面e的相对面是面c，相对面不能同时出现，所以选项右面是面d，选项中面e与面d的公共边挨着面e的两个小正方形，而展开图中面e与面d的公共边没有挨着面e的两个小正方形，选项与题干展开图不一致，排除；\nB项：选项前面是面f，右面是面e，选项中面f挨着面e的大长方形长边，而展开图中面f没有挨着面e的大长方形长边，选项与题干展开图不一致，排除；\nC项：选项由面b、面d与面e构成，选项与题干展开图一致，当选；\nD项：选项前面是面b，上面是面a，面a的相对面是面d，相对面不能同时出现，所以选项右面是面c，选项中三个面的公共点（如图所示）引出的1条直线是由面c发出来的，而展开图中，三个面的公共点引出的1条直线是由面b发出来的，选项与题干展开图不一致，排除。\n故正确答案为C。","no":62,"missingImage":false},{"type":"question","qid":"4678642","cat":"图形推理","stem":"把下面六组图形分成两类，使每一类都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"de56384a6c39\" style=\"max-width:535px\">","options":{"A":"①④⑤，②③⑥","B":"①③⑥，②④⑤","C":"①③⑤，②④⑥","D":"①②③，④⑤⑥"},"answer":"B","explanation":"本题为分组分类题目。元素组成不同，无明显属性规律，优先考虑数量规律。观察发现，每幅图形均由黑白两部分构成，且图⑥中黑色部分与白色部分面积相等，考虑黑白两部分的面积。图①③⑥中黑色部分与白色部分面积相等，图②④⑤中黑色部分面积为白色部分面积的三分之一。故图①③⑥为一组，图②④⑤为一组。\n注：图③当中白色扇形的半径和黑色圆形的直径相等，且扇形圆心角为\u003cimg data-k=\"c16e5a8b3239\">，假设圆形半径r为1，则扇形半径R为2，可知黑色圆形面积\u003cimg data-k=\"c47d251e9797\">，白色扇形面积\u003cimg data-k=\"d2e8b06e8df2\">，两者面积相等。\n故正确答案为B。","no":63,"missingImage":false},{"type":"question","qid":"4678648","cat":"定义判断","stem":"重大飞行事故罪，是指航空人员违反规章制度，因而发生重大飞行事故，危及公共安全，造成严重后果的行为。\n根据上述定义，下列行为属于重大飞行事故罪的是：","options":{"A":"某航空公司飞行员邀请“网红”进入驾驶舱就座。“网红”在驾驶舱拍摄的照片在微博引起热议，当事飞行员被处以终身禁飞","B":"某客机因目的地机场下大雨，不适合降落，被迫在临近机场降落，结果导致乘客延误时间6小时","C":"飞行员违反航空管理的有关规定，在未看见跑道的情况下，违规操纵飞机实施着陆，致使飞机着火坠毁","D":"恐怖分子劫持客机，导致客机坠毁"},"answer":"C","explanation":"第一步：找出定义关键词。\n“航空人员违反规章制度”、“因而发生重大飞行事故，危及公共安全，造成严重后果”。\n第二步：逐一分析选项。\nA项：飞行员邀请“网红”进入驾驶舱并拍照，违反了规章制度，但是否因此发生了重大飞行事故并未提及，不符合“因而发生重大飞行事故，危及公共安全，造成严重后果”，不符合定义，排除；\nB项：客机因天气原因被迫在临近机场降落，航空人员并未违反规章制度，不符合“航空人员违反规章制度”，不符合定义，排除；\nC项：飞行员违反航空管理的有关规定违规着陆，符合“航空人员违反规章制度”，致使飞机着火坠毁，符合“因而发生重大飞行事故，危及公共安全，造成严重后果”，符合定义，当选；\nD项：恐怖分子劫持客机，导致客机坠毁，造成客机坠毁的原因是恐怖分子的劫持，并未提及航空人员是否违反规章制度，不符合“航空人员违反规章制度”，不符合定义，排除。\n故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"4678651","cat":"定义判断","stem":"罗森塔尔效应亦称“皮格马利翁效应”“人际期望效应”，是一种社会心理效应，指的是教师对学生的殷切希望能戏剧性地收到预期效果的现象。\n根据上述定义，下列不属于罗森塔尔效应的是：","options":{"A":"某小学一年级学生小明期末考试考了双百分，父母非常高兴，带他去上海迪士尼尽情玩了一周，以资鼓励，希望他再接再厉。果然不负父母所望，第二学期期末考试小明又考了双百分","B":"某小学班主任在选择班干部时，把学习成绩作为重要标准，期望这些班干部能带动班上其他学生的学习积极性。一年以后，这些班干部的成绩继续在班上名列前茅","C":"一名研究者根据某小学的学生名册随机挑选了一些名字组成了一份“最有发展前途者”名单，并以赞许的口吻将其交给了校长和相关老师。一年后，该研究者再次对该小学的学生进行调查，结果显示，名单上的学生成绩都有了较大进步，且都有着很强的求知欲","D":"罗尔斯从小顽皮、逃课、打架、斗殴，无所事事，令人头疼。有一次，当罗尔斯从窗台上跳下时，被校长保罗看见了，校长不但没有责备他，反而对他说：“我一看就知道，你将来是纽约州的州长。”校长的话对他的震动特别大。从此，罗尔斯记下了这句话，并在51岁那年成为纽约州州长"},"answer":"A","explanation":"第一步：找出定义关键词。\n“教师对学生的殷切希望”、“收到预期效果的现象”。\n第二步：逐一分析选项。\nA项：父母奖励小明并希望他再接再厉，是父母对孩子的殷切希望，不符合关键词“教师对学生的殷切希望”，不符合定义，保留；\nB项：班主任期望班干部能带动班上其他学生的学习积极性，符合关键词“教师对学生的殷切希望”，但是一年以后这些班干部的成绩继续名列前茅，不明确是否带动了班上其他学生的学习积极性，不明确项，保留；\nC项：研究者给了校长和相关老师一份“最有发展前途者”的学生名单，可能会让相关老师对这些学生产生期望，符合关键词“教师对学生的殷切希望”，最后名单上的学生成绩都有了较大进步，符合关键词“收到预期效果的现象”，符合定义，排除；\nD项：校长跟罗尔斯说他将来是纽约州的州长，符合关键词“教师对学生的殷切希望”，罗尔斯在51岁那年确实成为了纽约州的州长，符合关键词“收到预期效果的现象”，符合定义，排除。\n对比A、B两项，A项主体不符合，B项只是不明确，对比择优，选择A项。\n本题为选非题，故正确答案为A。","no":65,"missingImage":false},{"type":"question","qid":"4678653","cat":"定义判断","stem":"湿垃圾，是指日常生活垃圾中在自然条件下容易分解的有机物质部分，其主要来源为家庭厨房、餐厅、饭店、食堂、市场及食品加工企业等。\n根据上述定义，以下属于湿垃圾的是：","options":{"A":"蛤蜊壳","B":"塑料袋","C":"瓜子壳","D":"口香糖"},"answer":"C","explanation":"第一步：找出定义关键词。\n“在自然条件下容易分解”、“有机物质部分”。\n第二步：逐一分析选项。\nA项：蛤蜊壳的主要成分是碳酸钙，碳酸钙是无机物，且在自然条件下不容易分解，不符合“在自然条件下容易分解”、“有机物质部分”，不符合定义，排除；\nB项：日常生活中常见的塑料袋主要成分为聚丙烯、聚酯、尼龙等有机物质，符合“有机物质部分”，但常见的塑料袋在自然条件下不易降解，不符合“在自然条件下容易分解”，不符合定义，排除；\nC项：瓜子壳的主要成分是纤维素、木质素、半木质素及少量的糖类、矿物质等，以有机物为主，符合“有机物质部分”，而且生活中将瓜子壳放置一段时间后易发生霉变，属于易腐垃圾，在自然条件下较容易降解，符合“在自然条件下容易分解”，符合定义，当选；\nD项：口香糖的主要成分是胶基，由石油衍生聚合物、天然乳胶、树脂和蜡等大分子有机物混合而成，符合“有机物质部分”，但口香糖进入自然环境后难以降解和清除，不符合“在自然条件下容易分解”，不符合定义，排除。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"4678655","cat":"定义判断","stem":"反事实推理又称反事实思维，是指对过去已经发生的事实进行否定而重新表征，以建构一种可能性假设的思维活动。反事实推理在头脑中是以条件命题的形式表现出来的，包括前提和结果两个部分，其典型形式为：如果当时······，就会（不会）······。\n根据上述定义，以下诗句明确表达了反事实推理的是：","options":{"A":"若非群玉山头见，会向瑶台月下逢","B":"东风不与周郎便，铜雀春深锁二乔","C":"从今若许闲乘月，拄杖无时夜叩门","D":"忽见陌头杨柳色，悔教夫婿觅封侯"},"answer":"B","explanation":"第一步：找出定义关键词。\n“对过去已经发生的事实进行否定而重新表征”、“以建构一种可能性假设的思维活动”。\n第二步：逐一分析选项。\nA项：出自唐代李白的《清平调·其一》，意思是如此天姿国色，不是群玉山头所见的飘飘仙子，就是瑶台殿前月光照耀下的神女，“不是······就是······”表示的是选择关系而非可能性假设，也没有对过去已经发生的事实进行否定，不符合“对过去已经发生的事实进行否定而重新表征”、“以建构一种可能性假设的思维活动”，不符合定义，排除；\nB项：出自唐代杜牧的《赤壁》，意思是倘若当年东风不帮助周瑜的话，那么铜雀台就会深深地锁住东吴二乔了，此处作者提出了一个与历史事实相反的假设，符合“对过去已经发生的事实进行否定而重新表征”、“以建构一种可能性假设的思维活动”，符合定义，当选；\nC项：出自宋代陆游的《游山西村》，意思是今后如果还能乘大好月色出外闲游，我随时会拄着拐杖来敲你的家门，没有对过去已经发生的事实进行否定，不符合“对过去已经发生的事实进行否定而重新表征”，不符合定义，排除；\nD项：出自唐代王昌龄的《闺怨》，意思是忽然见到路边杨柳新绿，心中一阵忧愁，悔不该叫夫君去从军建功封爵，没有对过去已经发生的事实进行否定，不符合“对过去已经发生的事实进行否定而重新表征”、“以建构一种可能性假设的思维活动”，不符合定义，排除。\n故正确答案为B。","no":67,"missingImage":false},{"type":"question","qid":"4678657","cat":"定义判断","stem":"智能投顾是指利用大数据分析、量化模型和算法，根据投资者的个人收益和风险偏好提供匹配的资产组合建议，并自动完成投资交易过程，再根据市场变化情况动态调整，让组合始终处于最优状态的财富管理服务。\n根据上述定义，下列属于智能投顾的是：","options":{"A":"甲把上个月的工资8000元借给朋友解燃眉之急","B":"乙为低风险偏好者，购买了银行App为其推荐的保本型理财产品","C":"丙因为预算有限，从银行贷款购买了一辆价值12万的小轿车","D":"丁利用信用卡分期付款买了一部苹果手机"},"answer":"B","explanation":"第一步：找出定义关键词。\n“利用大数据分析、量化模型和算法”、“根据投资者的个人收益和风险偏好提供匹配的资产组合建议，并自动完成投资交易过程”。\n第二步：逐一分析选项。\nA项：甲把工资借给朋友，甲并没有进行投资，不符合“利用大数据分析、量化模型和算法”、“根据投资者的个人收益和风险偏好提供匹配的资产组合建议，并自动完成投资交易过程”，不符合定义，排除； \nB项：银行APP为低风险偏好者推荐了保本型理财产品，符合“利用大数据分析、量化模型和算法”、“根据投资者的个人收益和风险偏好提供匹配的资产组合建议，并自动完成投资交易过程”，符合定义，当选；\nC项：丙从银行贷款购买小轿车，丙并没有进行投资，不符合“利用大数据分析、量化模型和算法”、“根据投资者的个人收益和风险偏好提供匹配的资产组合建议，并自动完成投资交易过程”，不符合定义，排除；\nD项：丁利用信用卡分期付款购买手机，丁并没有进行投资，不符合“利用大数据分析、量化模型和算法”、“根据投资者的个人收益和风险偏好提供匹配的资产组合建议，并自动完成投资交易过程”，不符合定义，排除。\n故正确答案为B。","no":68,"missingImage":false},{"type":"question","qid":"4678689","cat":"逻辑判断","stem":"“只有努力才能成功，只有成功才能得到他人的尊重。”\n如果上述断定为真，那么以下哪项一定为真？","options":{"A":"如果不成功，那么一定没有努力","B":"如果得到他人尊重了，那么一定努力了","C":"如果没有得到他人的尊重，那么一定没有成功","D":"如果成功了，一定会得到他人尊重"},"answer":"B","explanation":"第一步：翻译题干。\n①成功\u003cimg data-k=\"2dfb7d1f72f3\">努力；\n②得到他人尊重\u003cimg data-k=\"2dfb7d1f72f3\">成功；\n将①和②串联可以递推出：③得到他人尊重\u003cimg data-k=\"2dfb7d1f72f3\">成功\u003cimg data-k=\"2dfb7d1f72f3\">努力。\n第二步：逐一分析选项。\nA项：翻译为：\u003cimg data-k=\"e752a8ae1a16\">成功\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">努力，是对①的否前，否前无必然结论，无法推出，排除；\nB项：翻译为：得到他人尊重\u003cimg data-k=\"2dfb7d1f72f3\">努力，是对③的肯前，肯前必肯后，可以推出，当选；\nC项：翻译为：\u003cimg data-k=\"e752a8ae1a16\">得到他人尊重\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">成功，是对②的否前，否前无必然结论，无法推出，排除；\nD项：翻译为：成功\u003cimg data-k=\"2dfb7d1f72f3\">得到他人尊重，是对②的肯后，肯后无必然结论，无法推出，排除。\n故正确答案为B。","no":69,"missingImage":false},{"type":"question","qid":"4678694","cat":"逻辑判断","stem":"到安徽旅游过的一名游客说过：“不到黄山，不算游过安徽；不去西递宏村，白来黄山。”\n根据这句话，以下最能推出的结果是：","options":{"A":"游黄山，只要去西递宏村就行了","B":"西递宏村集中了安徽最精华的自然景观","C":"游黄山，最令人难忘的是西递宏村","D":"游安徽，应该先去西递宏村"},"answer":"C","explanation":"第一步：翻译题干。\n①游过安徽\u003cimg data-k=\"2dfb7d1f72f3\">到黄山；\n②来黄山\u003cimg data-k=\"2dfb7d1f72f3\">去西递宏村；\n将①和②串联可以递推出③：游过安徽\u003cimg data-k=\"2dfb7d1f72f3\">到黄山\u003cimg data-k=\"2dfb7d1f72f3\">去西递宏村。\n第二步：逐一分析选项。\nA项：翻译为“去西递宏村\u003cimg data-k=\"2dfb7d1f72f3\">游黄山”，是对②的肯后，肯后无必然结论，无法推出，排除；\nB项：题干没有提及“最精华的自然景观”，无法从题干信息中推出，排除；\nC项：选项说的是“游黄山，最令人难忘的是西递宏村”，这句话表达的意思是只有去了西递宏村，才会发现黄山最难忘的景色是什么，所以可以推出“游黄山\u003cimg data-k=\"508f0e7dbbe5\">去西递宏村”，是对②的肯前，肯前推肯后，可以推出，当选；\nD项：题干没有提及先后顺序，游安徽只要去了西递宏村就行，故“应该先去西递宏村” 无法从题干信息中推出，排除。\n故正确答案为C。","no":70,"missingImage":false},{"type":"question","qid":"4678703","cat":"类比推理","stem":"某次数学考试之后，班长跑去向老师打听成绩，老师给了他如下三个结果，并且告诉他，在这三个结果中只有一个是真的。\n（1）有的同学考试成绩不及格；\n（2）有的同学考试成绩及格了；\n（3）数学课代表考试成绩不及格。\n以下哪个选项一定为真？","options":{"A":"只有数学课代表的考试成绩及格了","B":"数学课代表的考试成绩不及格","C":"班上所有同学的考试成绩都及格了","D":"班上所有同学的考试成绩都不及格"},"answer":"C","explanation":"第一步：找关系。\n（1）有的同学考试成绩不及格；\n（2）有的同学考试成绩及格了；\n（3）数学课代表考试成绩不及格。\n根据条件（1）“有的同学考试成绩不及格”和条件（2）“有的同学考试成绩及格了”分别为“有的不是”、“有的是”的形式，二者中必有一真；再根据“三个结果中只有一个是真的”可知，条件（3）为假。\n第二步：看其余。\n根据条件（3）为假可知，数学课代表考试成绩及格了，可以推出条件（2）一定为真，那么条件（1）必然为假，则其矛盾命题为真，即所有同学的考试成绩都及格了，对应C项。\n故正确答案为C。","no":71,"missingImage":false},{"type":"question","qid":"2003164","cat":"逻辑判断","stem":"如果选购了股票，则不能投资期货；只有投资期货，才能投资邮票；或者投资邮票，或者投资外汇；但是最近投资外汇风险太大，不能操作。\n据此，可以推出：","options":{"A":"选购股票","B":"不选购股票","C":"不投资邮票","D":"不投资期货"},"answer":"B","explanation":"第一步：翻译题干。\n①选购股票\u003cimg data-k=\"2dfb7d1f72f3\">-投资期货；\n②投资邮票\u003cimg data-k=\"2dfb7d1f72f3\">投资期货；\n③投资邮票 或 投资外汇；\n④-投资外汇。\n第二步：根据题干条件进行推理。\n从确定信息条件④入手，-投资外汇是对条件③或关系的其中一项进行否定，根据“或关系否一推一”，可以推出投资邮票；投资邮票是对条件②的肯前，肯前必肯后，可以推出投资期货；投资期货是对条件①的否后，否后必否前，可以推出不选购股票，对应B项。\n故正确答案为B。","no":72,"missingImage":false},{"type":"question","qid":"4678707","cat":"逻辑判断","stem":"基因编辑是指对基因组进行定点修饰的一项新技术，利用该技术，可以精确定位到基因组的某一位点上，在这个位点上剪断靶标DNA片段并插入新的基因片段，此过程既模拟了基因的自然突变，又修改并编辑了原有的基因组。该技术在过去几十年里得到了快速发展。然而，一些学者认为，应尽快采取各种禁止性或限制性措施，以防止对人类造成不可逆的危害。\n以下哪项将严重削弱上述学者的观点？","options":{"A":"近年来，基因编辑技术在植物、动物、微生物等领域的研究与应用突飞猛进","B":"在人体上进行的基因编辑试验更多是针对体细胞而非生殖细胞，既能实现对疾病的治疗，还避免了被修改的基因遗传的问题","C":"基因编辑技术是一项新技术，存在构建复杂、价格昂贵，以及较大概率的脱靶效应等问题","D":"科学狂人的冲动，有可能让中立的基因编辑技术越界，从而带来无法挽回的风险隐患和伦理悲剧"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：针对基因编辑技术，应尽快采取各种禁止性或限制性措施，以防止对人类造成不可逆的危害。\n论据：无。\n本题只有论点没有论据，优先考虑削弱论点，即基因编辑技术不会对人类造成不可逆的危害，或不需要尽快禁止或限制基因编辑技术。\n第二步：逐一分析选项。\nA项：该项讨论的是基因编辑技术在植物、动物、微生物等领域的研究与应用突飞猛进，而论点讨论的基因编辑技术对人类的影响，讨论的话题不一致，无法削弱，排除；\nB项：该项指出人体的基因编辑更多是针对体细胞，以实现疾病的治疗，说明人体的基因编辑具有积极意义，还指出人体的基因编辑并非针对生殖细胞，这避免了被修改的基因遗传的问题，说明人体的基因编辑不会对人类造成不可逆的危害，即不需要禁止和限制基因编辑技术，削弱论点，当选；\nC项：该项讨论的是基因编辑技术构建复杂、价格昂贵，较大概率的脱靶效应等问题，并未指出基因编辑技术是否会对人类造成不可逆的危害，以及是否需要尽快禁止或限制基因编辑技术，为无关项，无法削弱，排除；\nD项：该项指出科学狂人的冲动可能使基因编辑技术带来无法挽回的风险隐患和伦理悲剧，补充说明了基因编辑技术可能带来的消极影响，即需要禁止或限制基因编辑技术，为加强项，无法削弱，排除。\n故正确答案为B。","no":73,"missingImage":false},{"type":"question","qid":"4678671","cat":"逻辑判断","stem":"陈燕、李婷和赵伟被同一所大学的英语、经济和法律三个专业录取，对于她们的录取情况，同学们有以下猜测：\n甲：陈燕是经济专业的，赵伟是法律专业的；\n乙：陈燕是法律专业的，李婷是经济专业的；\n丙：陈燕是英语专业的，赵伟是经济专业的；\n结果出来后，每位同学都只对了一半。\n那么，下列结论正确的是：","options":{"A":"陈燕、李婷和赵伟分别是英语、经济和法律专业的","B":"陈燕、李婷和赵伟分别是经济、法律和英语专业的","C":"陈燕、李婷和赵伟分别是英语、法律和经济专业的","D":"陈燕、李婷和赵伟分别是法律、英语和经济专业的"},"answer":"A","explanation":"题干信息不确定，优先考虑代入法。\nA项：代入到题干中，每个人的猜测都对了一半，符合题干要求，当选；\nB项：代入到题干中，乙的猜测都是错的，不符合题干要求，排除；\nC项：代入到题干中，甲的猜测都是错的，不符合题干要求，排除；\nD项：代入到题干中，甲的猜测都是错的，不符合题干要求，排除。\n故正确答案为A。","no":74,"missingImage":false},{"type":"question","qid":"4678672","cat":"逻辑判断","stem":"王军说：“只有正式代表才可以发言。”刘念说：“不对吧！梁正也是正式代表但他并未发言。”\n刘念的回答把王军的话错误地理解为以下哪项？","options":{"A":"所有发言的人都是正式代表","B":"所有正式代表都发言了","C":"没有正式代表发言","D":"梁正不是正式代表"},"answer":"B","explanation":"第一步：翻译题干。\n王军的话翻译为：发言\u003cimg data-k=\"2dfb7d1f72f3\">正式代表；\n刘念的话翻译为：正式代表 且 \u003cimg data-k=\"e752a8ae1a16\">发言。\n题干的问法为刘念的回答把王军的话错误的理解为什么，刘念认为王军的话说错了，故拿梁正举例子反驳王军，所以刘念认为梁正的例子为王军的话的矛盾命题，故找到刘念例子的矛盾命题即为刘念的错误理解。\n第二步：逐一分析选项。\nA项：翻译为发言\u003cimg data-k=\"2dfb7d1f72f3\">正式代表，与刘念的话并非矛盾关系，无法推出，排除；\nB项：翻译为正式代表\u003cimg data-k=\"2dfb7d1f72f3\">发言，与刘念的话为矛盾关系，即为刘念对王军的话的错误理解，可以推出，当选；\nC项：翻译为\u003cimg data-k=\"e752a8ae1a16\">正式代表发言，与刘念的话并非矛盾关系，无法推出，排除；\nD项：翻译为\u003cimg data-k=\"e752a8ae1a16\">梁正是正式代表，与刘念的话并非矛盾关系，无法推出，排除。\n故正确答案为B。","no":75,"missingImage":false},{"type":"question","qid":"4678706","cat":"逻辑判断","stem":"甲大学的所有女生都爱吃油炸食品。所有爱吃油炸食品的人都不会嫌弃自己不健康。而只有甲大学的女生才会注意别人的评价。\n假设上述论断都是真的，以下哪项也一定是真的？\nⅠ.所有不嫌弃自己不健康的人都注重别人的评价\nⅡ.所有注重别人评价的人都爱吃油炸食品\nⅢ.嫌弃自己不健康的人中没有一个注重别人的评价","options":{"A":"仅Ⅰ","B":"仅Ⅱ","C":"仅Ⅰ和Ⅱ","D":"仅Ⅱ和Ⅲ"},"answer":"D","explanation":"第一步：翻译题干。\n①甲大学的女生\u003cimg data-k=\"2dfb7d1f72f3\">爱吃油炸食品；\n②爱吃油炸食品\u003cimg data-k=\"2dfb7d1f72f3\">不会嫌弃自己不健康；\n③注意别人的评价\u003cimg data-k=\"2dfb7d1f72f3\">甲大学的女生。\n以上条件可以递推出：④注意别人的评价\u003cimg data-k=\"2dfb7d1f72f3\">甲大学的女生\u003cimg data-k=\"2dfb7d1f72f3\">爱吃油炸食品\u003cimg data-k=\"2dfb7d1f72f3\">不会嫌弃自己不健康。\n第二步：逐一判断选项。\nⅠ：不嫌弃自己不健康\u003cimg data-k=\"2dfb7d1f72f3\">注重别人的评价，是对④的肯后，肯后无法得出确定结论，无法推出，排除；\nⅡ：注重别人的评价\u003cimg data-k=\"2dfb7d1f72f3\">爱吃油炸食品，是对④的肯前，肯前必肯后，可以推出，当选；\nⅢ：\u003cimg data-k=\"e752a8ae1a16\">不会嫌弃自己不健康\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">注重别人的评价，是对④的否后，否后必否前，可以推出，当选。\n因此仅Ⅱ和Ⅲ可以推出，只有D项符合。\n故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"4678710","cat":"逻辑判断","stem":"小张需要一定数量的特定液体。目前，小张有一个容积为11品脱、装满了该液体且刻度模糊的容器，不满足他的需求，于是他向好友小刚寻求帮助，小刚拿出了两个刻度模糊、容积分别为5品脱和6品脱的容器，说小张将这两个容器都利用到就可以得到想要的液体数量。\n由此可以推出，小张需要的液体数量可能是：","options":{"A":"5品脱、7品脱、8品脱、10品脱","B":"6品脱、7品脱、8品脱、9品脱","C":"7品脱、8品脱、9品脱、10品脱","D":"8品脱、9品脱、10品脱、11品脱"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）有一个11品脱刻度模糊的容器，且此容器装满了特定溶液；\n（2）有两个刻度模糊的容器分别为5品脱和6品脱；\n（3）5品脱和6品脱容器都要利用到。\n第二步：根据题干条件进行推理。\n根据条件（3）可知，5品脱和6品脱的容器都要利用到，不能只使用其中一个，故小张需要的液体数量肯定不能是单独的5品脱、6品脱或11品脱，排除A、B、D三项；而C项中的液体数量都可以利用这三个容器得到，如下表所示：\n\u003cimg data-k=\"3140b0dd7e36\" style=\"max-width:502px\">\n故正确答案为C。","no":77,"missingImage":false},{"type":"question","qid":"4678712","cat":"逻辑判断","stem":"一粒骰子的六面分别是1、2、3、4、5、6点。如果满足：①1的对面是5；②4和6相邻；③2和4相邻这三个条件。\n那么下面结论错误的是：","options":{"A":"1与4相邻","B":"4的对面是3","C":"2与6相邻","D":"5与3相邻"},"answer":"C","explanation":"第一步：分析题干条件。\n①1的对面是5；\n②4和6相邻；\n③2和4相邻。\n第二步：根据题干条件进行推理。\n根据题干信息构建出该骰子的一种情况，如下图所示：\n\u003cimg data-k=\"d825671852dd\" style=\"max-width:300px\">\n由上图可知，1与4相邻，4的对面是3，2的对面是6，5与3相邻，只有C项错误。\n本题为选非题，故正确答案为C。","no":78,"missingImage":false},{"type":"question","qid":"4678644","cat":"类比推理","stem":"纸张：钢笔","options":{"A":"司机：汽车","B":"牙齿：牙刷","C":"河流：水","D":"森林：树木"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n用钢笔在纸张上写字，二者为工具和作用对象的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：司机驾驶汽车，二者为职业和工具的对应关系，与题干逻辑关系不一致，排除；\nB项：用牙刷清理牙齿，二者为工具和作用对象的对应关系，与题干逻辑关系一致，当选；\nC项：河流是水资源的一种，二者为包容关系中的种属关系，与题干逻辑关系不一致，排除；\nD项：树木是森林的组成部分，二者为包容关系中的组成关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":79,"missingImage":false},{"type":"question","qid":"4678650","cat":"类比推理","stem":"信息：语言","options":{"A":"感觉：快乐","B":"教学：教育","C":"状态：水","D":"股东：股份"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n语言是信息的一种，二者为包容关系中的种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：快乐是感觉的一种，二者为包容关系中的种属关系，与题干逻辑关系一致，当选；\nB项：教学是教育活动的一种，与教育不是种属关系，与题干逻辑关系不一致，排除；\nC项：水具有多种状态，如固态、液态、气态，二者为对应关系，与题干逻辑关系不一致，排除；\nD项：股东持有股份，二者为主宾关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":80,"missingImage":false},{"type":"question","qid":"4678664","cat":"类比推理","stem":"中国：亚洲","options":{"A":"迪拜：亚洲","B":"伊拉克：非洲","C":"墨西哥：南美洲","D":"新西兰：大洋洲"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n中国是位于亚洲的国家，二者为地点的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：迪拜是位于亚洲的城市，而不是国家，与题干逻辑关系不一致，排除；\nB项：伊拉克是位于亚洲的国家，而不是非洲，与题干逻辑关系不一致，排除；\nC项：墨西哥是位于北美洲的国家，而不是南美洲，与题干逻辑关系不一致，排除；\nD项：新西兰是位于大洋洲的国家，二者为地点的对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":81,"missingImage":false},{"type":"question","qid":"4678677","cat":"类比推理","stem":"压轴：最后一个","options":{"A":"七月流火：天气转凉","B":"空穴来风：必有根据","C":"美轮美奂：景色美丽","D":"目无全牛：得心应手"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n压轴指倒数第二个节目，不是指最后一个。\n第二步：判断选项词语间逻辑关系。\nA项：七月流火意思是在农历七月天气转凉的时节，天刚擦黑的时候，可以看见大火星从西方落下去，说的就是天气转凉的时候，与题干逻辑关系不一致，排除；\nB项：空穴来风比喻消息和传说不是完全没有根据，现多用来指消息和传说毫无根据，两种用法均可，与题干逻辑关系不一致，排除；\nC项：美轮美奂形容房屋等建筑高大众多，富丽堂皇，而不是形容景色美丽，与题干逻辑关系一致，当选；\nD项：目无全牛形容技艺达到极纯熟的境界，得心应手形容技术纯熟，能运用自如，二者为近义关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":82,"missingImage":false},{"type":"question","qid":"4678692","cat":"类比推理","stem":"往：来：往来","options":{"A":"牙：齿：牙齿","B":"去：留：去留","C":"拼：搏：拼搏","D":"耻：辱：耻辱"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n往和来是反义关系，且二者构成了词语“往来”。\n第二步：判断选项词语间逻辑关系。\nA项：牙和齿都可以指牙齿，二者不是反义关系，与题干逻辑关系不一致，排除；\nB项：去和留是反义关系，且二者构成了词语“去留”，与题干逻辑关系一致，当选；\nC项：拼和搏都有奋斗的意思，二者是近义关系，与题干逻辑关系不一致，排除；\nD项：耻和辱都有羞耻、羞愧的意思，二者是近义关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":83,"missingImage":false},{"type":"question","qid":"4678681","cat":"类比推理","stem":"黄色：橙色：红色","options":{"A":"儿童：成人：老人","B":"小学：大学：中学","C":"晴天：阴天：雨天","D":"语文：数学：英语"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n黄色、橙色、红色是3种不同的颜色，三者为并列关系，且颜色不断加深。\n第二步：判断选项词语间逻辑关系。\nA项：成人指成年的人，老人属于成人，二者为种属关系，与题干逻辑关系不一致，排除；\nB项：小学、大学、中学是3种不同的学校，三者为并列关系，但小学、中学、大学才是学历的不断加深，选项顺序不对，与题干逻辑关系不一致，排除；\nC项：晴天、阴天、雨天是3种不同的天气，三者为并列关系，且天气糟糕程度不断加深，与题干逻辑关系一致，当选；\nD项：语文、数学、英语是3种不同的学科，三者为并列关系，但不存在程度的不断加深，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"4678684","cat":"类比推理","stem":"阅览：阅读：审阅","options":{"A":"要求：命令：建议","B":"道理：理论：理据","C":"尊重：尊敬：尊崇","D":"局长：市长：领导"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n阅览指观看、观赏，阅读指阅览诵读，审阅指审查核阅，三者是近义关系，且程度逐渐加深。\n第二步：判断选项词语间逻辑关系。\nA项：要求指提出的具体愿望或条件，希望做到或实现，命令指发出号令，使人遵行，建议指向人提出的主张，三者是近义关系，但“建议”的程度比“要求”轻，与题干逻辑关系不一致，排除；\nB项：道理指事物的规律；理由、情理，理论指由实践概括出来的有系统的结论，理据指理由、根据，第二个词与第一、三词不是近义关系，与题干逻辑关系不一致，排除；\nC项：尊重指重视，尊敬指敬重，尊崇指尊敬推崇，三者是近义关系，且程度逐渐加深，与题干逻辑关系一致，当选；\nD项：局长与市长都是领导的一种，前两词与第三词构成种属关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":85,"missingImage":false},{"type":"question","qid":"4678688","cat":"类比推理","stem":"曹雪芹：红楼梦：贾宝玉","options":{"A":"罗贯中：三国演义：关二爷","B":"施耐庵：西游记：沙和尚","C":"吴承恩：水浒传：林冲","D":"许仲琳：封神演义：申公豹"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n曹雪芹是红楼梦的作者，贾宝玉是红楼梦中的人物，三者是作者、作品和人物的对应关系，且红楼梦是四大名著之一。\n第二步：判断选项词语间逻辑关系。\nA项：罗贯中是三国演义的作者，关二爷是三国演义中的人物，三者是作者、作品和人物的对应关系，且三国演义是四大名著之一，与题干逻辑关系一致，当选；\nB项：西游记的作者是吴承恩，而不是施耐庵，前两词不是作者与作品的对应关系，与题干逻辑关系不一致，排除；\nC项：水浒传的作者是施耐庵，而不是吴承恩，前两词不是作者与作品的对应关系，与题干逻辑关系不一致，排除；\nD项：封神演义的作者是许仲琳存在争议，申公豹是封神演义中的人物，但封神演义不是四大名著之一，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":86,"missingImage":false},{"type":"question","qid":"4678693","cat":"类比推理","stem":"感冒∶病毒∶传染","options":{"A":"花朵∶蜜蜂∶传粉","B":"癌症∶绝症∶化疗","C":"血友病∶基因∶遗传","D":"伤口∶感染∶愈合"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n感染病毒可能会引起感冒，二者为因果关系，感冒具有传染性，二者为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：花朵并非蜜蜂引起，二者不是因果关系，花朵也不具有传粉性，与题干逻辑关系不一致，排除；\nB项：癌症并非绝症引起，二者不是因果关系，癌症也不具有化疗性，与题干逻辑关系不一致，排除；\nC项：基因突变可能会引起血友病，二者为因果关系，血友病具有遗传性，二者为对应关系，与题干逻辑关系一致，当选；\nD项：伤口可能引发感染，二者为因果关系，但和题干顺序相反，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":87,"missingImage":false},{"type":"question","qid":"4678704","cat":"类比推理","stem":"（    ） 对于 “一国两制” 相当于 马克思 对于 （    ）","options":{"A":"邓小平；唯物主义","B":"毛泽东；剩余价值理论","C":"邓小平；剩余价值理论","D":"毛泽东；唯物史观"},"answer":"C","explanation":"逐一代入选项。\nA项：“邓小平”是“一国两制”的提出者，“唯物主义”与“马克思”无明显逻辑关系，前后逻辑关系不一致，排除；\nB项：“毛泽东”与“一国两制”无明显逻辑关系，“马克思”是“剩余价值理论”的提出者，前后逻辑关系不一致，排除；\nC项：“邓小平”是“一国两制”的提出者，“马克思”是“剩余价值理论”的提出者，前后逻辑关系一致，当选；\nD项：“毛泽东”与“一国两制”无明显逻辑关系，“马克思”是“唯物史观”的提出者，前后逻辑关系不一致，排除。\n故正确答案为C。","no":88,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        据国家统计局测算，妇女就业规模继续扩大。2016年全国女性就业人员占全社会就业人员的比重为43.1%，超过《中国妇女发展纲要（2011-2020年）》规定的40%的目标。\u003c/p>\u003cp>        女职工的合法权益得到进一步维护，为减少和解决女职工在工作中因生理特点造成的特殊困难发挥了积极作用。2016年，执行《女职工劳动保护特别规定》的企业比重明显提高，达73%，比2010年提高18个百分点。\u003c/p>\u003cp>        农村贫困妇女人数大幅度减少，基本实现应保尽保。按照年人均收入2300元的农村贫困标准计算，2016年全国农村贫困人口 保险人数的：","options":{"A":"46.6%","B":"38.3%","C":"22.5%","D":"35%"},"answer":"C","explanation":"根据题干“2016年······占······”，结合材料时间为2016年，可判定本题为现期比重问题。定位文字材料最后一段可知：2016年，全国参加基本养老保险人数8.9亿人，其中女性3.5亿人；参加城镇职工基本养老保险人数3.8亿人，其中女性1.8亿人。则参加城镇职工基本养老保险的男性人数=3.8-1.8=2亿人，根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，则2016年参加城镇职工基本养老保险的男性约占全国参加基本养老保险人数的比重\u003cimg data-k=\"539c9c871870\">，与C项最接近。\n故正确答案为C。","no":92,"missingImage":false},{"qid":"4678673","cat":"比重","stem":"按2016年参加四种保险的女性占比从大到小排列，正确的顺序为：","options":{"A":"城镇职工基本养老保险，城乡居民基本养老保险，失业保险，工伤保险","B":"城镇职工基本养老保险，失业保险，城乡居民基本养老保险，工伤保险","C":"城镇职工基本养老保险，失业保险，工伤保险，城乡居民基本养老保险","D":"失业保险，城镇职工基本养老保险，工伤保险，城乡居民基本养老保险"},"answer":"C","explanation":"定位材料最后一段可知：2016年，参加城镇职工基本养老保险人数3.8亿人，其中女性1.8亿人，占比为46.6%；参加城乡居民基本养老保险人数5.1亿人，其中女性超过1.7亿人；全国参加失业保险的人数超过1.8亿人，其中女性7551万人；参加工伤保险人数2.2亿人，其中女性8129万人。则2016年，参加四种保险的女性占比分别为：\n城镇职工基本养老保险：46.6%；\n城乡居民基本养老保险：\u003cimg data-k=\"f1fc13b25178\">；\n失业保险：\u003cimg data-k=\"3d046fba0a04\">；\n工伤保险：\u003cimg data-k=\"1f6921d4a6a8\">。\n则从大到小为：城镇职工基本养老保险&gt;失业保险&gt;工伤保险&gt;城乡居民基本养老保险，对应C项。\n故正确答案为C。","no":93,"missingImage":false}]},{"type":"material","material":"\u003cp>\u003cimg data-k=\"032243ffc459\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"4678699","cat":"比重","stem":"该省年初金融机构人民币贷款余额占存款余额的比重约为：","options":{"A":"73.1%","B":"80.5%","C":"90.3%","D":"95.1%"},"answer":"A","explanation":"根据题干“年初······占······比重约为”，可判定本题为基期比重问题。定位表格材料可知：本月金融机构人民币贷款余额为87478.20亿元，比年初增加8608.8亿元；本月金融机构人民币存款余额为119919.39亿元，比年初增加12046.4亿元。根据公式：基期比重\u003cimg data-k=\"a16347d02b11\">，可得所求\u003cimg data-k=\"e22432495829\">\u003cimg data-k=\"44071abe5644\">\u003cimg data-k=\"ca7320aaae0b\">\u003cimg data-k=\"18508e24022c\">，与A项最接近。\n故正确答案为A。","no":94,"missingImage":false},{"qid":"4678701","cat":"增长","stem":"该省本月金融机构人民币存贷款的下列项目中，余额比年初增加最少的是：","options":{"A":"境内存款中的非金融企业存款","B":"境内住户贷款中的短期贷款","C":"金融机构人民币贷款","D":"非金融企业及机关团体贷款中的各项垫款"},"answer":"D","explanation":"根据题干“······比年初增加最少”，结合表格所给数据，可判定本题为直接找数问题。定位表格材料可知：境内存款中的非金融企业存款增长量为6113.7亿元；境内住户贷款中的短期贷款增长量为70.3亿元；金融机构人民币贷款增长量为8608.8亿元；非金融企业及机关团体贷款中的各项垫款增长量为8.1亿元，故选项中，余额比年初增加最少的是非金融企业及机关团体贷款中的各项垫款（8.1亿元）。\n故正确答案为D。","no":95,"missingImage":false},{"qid":"4678705","cat":"比重","stem":"该省本月下列项目在金融机构人民币存款余额中的占比较年初增长最小的是：","options":{"A":"境内存款","B":"住户存款","C":"非金融企业存款","D":"广义政府存款"},"answer":"B","explanation":"根据题干“在······中的占比较······增长最小”，可判定本题为两期比重问题。定位表格可知：本月金融机构人民币存款余额为119919.39亿元，比年初增加12046.4亿元；本月境内存款为119629.80亿元，比年初增加12021.0亿元；本月住户存款为43313.71亿元，比年初增加2750.7亿元；本月非金融企业存款为45047.05亿元，比年初增加6113.7亿元；本月广义政府存款为23861.36亿元，比年初增加3118.0亿元。\n方法一：根据公式：比重\u003cimg data-k=\"32bbe9558060\">可得，境内存款占比较年初增长\u003cimg data-k=\"91cb6efe44ec\">\u003cimg data-k=\"138de953b93e\">，即0.004个百分点；住户存款占比较年初增长\u003cimg data-k=\"2c5f50bda0a0\">\u003cimg data-k=\"cf6b3ac7c89e\">，即-1.5个百分点；非金融企业存款占比较年初增长\u003cimg data-k=\"e042260351f6\">\u003cimg data-k=\"d232840efcac\">，即1.5个百分点；广义政府存款占比较年初增长\u003cimg data-k=\"175557aef282\">\u003cimg data-k=\"feba18711048\">，即0.7个百分点；比较可知-1.5个百分点最小，所以该省本月在金融机构人民币存款余额中的占比较年初增长最小的是住户存款。\n方法二：根据两期比重结论：部分增长率（a）＞整体增长率（b），则比重上升；部分增长率（a）＜整体增长率（b），则比重下降；部分增长率（a）=整体增长率（b），则比重不变。可得本月金融机构人民币存款余额的增长率\u003cimg data-k=\"b0b4715579ef\">\u003cimg data-k=\"e5cd37bfc1f5\">\u003cimg data-k=\"363e096769d9\">，境内存款的增长率\u003cimg data-k=\"f648d4673408\">\u003cimg data-k=\"e69f4b1164c7\">，\u003cimg data-k=\"553128d2fa89\">，则比重不变，即两期比重增长近似为零；住户存款的增长率\u003cimg data-k=\"7db320eb3d6c\">\u003cimg data-k=\"a86b509d3af8\">，\u003cimg data-k=\"84fc288d58bf\">，则比重下降，即两期比重增长为负数；非金融企业存款的增长率\u003cimg data-k=\"cc772792370e\">\u003cimg data-k=\"4f6d868456e6\">，\u003cimg data-k=\"24df849f2e26\">，则比重上升，即两期比重增长为正数；广义政府存款的增长率\u003cimg data-k=\"f0e3fa30f0dc\">\u003cimg data-k=\"b244d0af4829\">，\u003cimg data-k=\"af45cb23e605\">，说明比重上升，即两期比重增长为正数，比较可得负数一定最小，即该省本月在金融机构人民币存款余额中的占比较年初增长最小的是住户存款。\n故正确答案为B。","no":96,"missingImage":false},{"qid":"4678708","cat":"综合","stem":"该省本月金融机构人民币境内住户存贷款之差相比年初约：","options":{"A":"减少了1329亿元","B":"增加了1329亿元","C":"减少了1903亿元","D":"增加了1903亿元"},"answer":"A","explanation":"根据题干“· <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){
  var base=(window.__EXAM__&&window.__EXAM__.imgBase)||"";
  return base+((window.__IMGS__ && window.__IMGS__[k]) || "");
}
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
