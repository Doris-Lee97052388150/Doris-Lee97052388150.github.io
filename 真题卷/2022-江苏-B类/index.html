时间为（t-1.5）小时。根据S=V×T，可得：10t=15（t-1.5），解得t=4.5。故出发时间为12:30前推4.5小时，即上午8:00。\n方法二：甲地到乙地的路程一定，则速度与时间成反比。速度之比为10：15=2：3，对应时间之比为3：2。相差的1份对应1.5小时。当速度为10公里/小时，所用时间为3×1.5=4.5小时，中午12:30到达，对应出发时间为上午8:00。\n故正确答案为D。","no":55,"missingImage":false},{"type":"question","qid":"4651680","cat":"数学运算","stem":"某单位拟开展3场文化交流活动，安排给3个部门进行策划。若每个部门最多承担2场活动的策划，每场活动只安排给1个部门，则不同的安排方法共有：","options":{"A":"16种","B":"24种","C":"32种","D":"48种"},"answer":"B","explanation":"因为每个部门最多承担2场活动的策划，不同的分类方式为：\n情况1：三个部门各承担1场活动，共\u003cimg data-k=\"a6bfbd5c06d2\">种安排方法；\n情况2：从三个部门选出1个部门承担2场活动，有\u003cimg data-k=\"692f557e7632\">种，从三场活动中选取两个活动，有\u003cimg data-k=\"20b23fd6eb04\">种，最后一场活动由剩余的两个部门其中1个进行承担，有\u003cimg data-k=\"0ef18b551e0a\">种。共\u003cimg data-k=\"caf636fb8dec\">\u003cimg data-k=\"d8a4e3bac9e3\">种安排方法。\n则共有6+18=24种安排方法。\n故正确答案为B。","no":56,"missingImage":false},{"type":"question","qid":"4651682","cat":"数学运算","stem":"某金融机构向9家“专精特新”企业共发放了4500万元贷款，若这9家企业获得的贷款额从少到多排列，恰好为一个等差数列，且排第3的企业获得420万元贷款，排第8的企业获得的贷款额为：","options":{"A":"620万元","B":"660万元","C":"720万元","D":"760万元"},"answer":"A","explanation":"由题干可知：9家企业共发放4500万元且贷款额从少到多排列，恰好为一个等差数列。根据等差数列求和公式：\u003cimg data-k=\"bf0656016282\">，可知排名第5的企业（中位数）获得=4500÷9=500万元。又已知排名第3的企业获得420万元，则根据等差数列的通项公式：\u003cimg data-k=\"3fa01e6c705b\">\u003cimg data-k=\"1e2694dbe37c\">可知，等差数列的公差为：\u003cimg data-k=\"95a600fd92d1\">万元，排名第8的企业获得\u003cimg data-k=\"d94c1e73cf49\">\u003cimg data-k=\"f344ea25d7ef\">万元。\n故正确答案为A。","no":57,"missingImage":false},{"type":"question","qid":"4651463","cat":"数学运算","stem":"有5支足球队进行单循环比赛，每场比赛胜者得3分，负者不得分，平局双方各得1分。比赛结束后，若5支球队的总得分为25分，冠军得12分，则亚军得：","options":{"A":"5分","B":"6分","C":"7分","D":"8分"},"answer":"A","explanation":"根据题意可得，5支足球队进行单循环比赛，总场次有\u003cimg data-k=\"08d882d77edf\">场。设10场比赛中分出胜负的有x场，平局有y场。根据每场胜负共得3+0=3分，每场平局共得1+1=2分，总得分为25分，可列方程组：x+y=10……①；3x+2y=25……②。联立①②，解得x=5，y=5。由于每支球队均要进行4场比赛，冠军总得分为12分，可知冠军4场全胜，则亚军必有1胜（5-4=1）、1负(输于冠军)，剩余2场为平局，故总得分为3+0+1+1=5分。\n故正确答案为A。","no":58,"missingImage":false},{"type":"question","qid":"4651514","cat":"数学运算","stem":"某机构对全运会收视情况进行调查，在1000名受访者中，观看过乒乓球比赛的占87%，观看过跳水比赛的占75%，观看过田径比赛的占69%。这1000名受访者中，乒乓球、跳水和田径比赛都观看过的至少有：","options":{"A":"310人","B":"440人","C":"620人","D":"690人"},"answer":"A","explanation":"根据“都······至少”判定本题为多集合反向构造问题。\n第一步反向：乒乓球比赛、跳水比赛、田径比赛没有看过的分别为：1000-1000×87%=130人、1000-1000×75%=250人、1000-1000×69%=310人。\n第二步作和：乒乓球比赛、跳水比赛、田径比赛没有看过的最多为130+250+310=690人。\n第三步作差：乒乓球、跳水和田径比赛都观看过的至少有1000-690=310人。\n故正确答案为A。","no":59,"missingImage":false},{"type":"question","qid":"4651689","cat":"数学运算","stem":"如图所示，考古队在B和C两处发现重要遗址，根据对周边环境考察，确定以A和D为顶点划出一个正方形挖掘区域。已知AB、CD都与BC垂直，AB=7米，BC=7米，CD=42米，则这个正方形挖掘区域的边长为：\n\u003cimg data-k=\"4733d0b66441\" style=\"max-width:288px\">","options":{"A":"49米","B":"45米","C":"40米","D":"35米"},"answer":"D","explanation":"B、C两处为重要遗址，因此以A和D为顶点划出的正方形挖掘区域，需要包含B、C两点，才能对遗址进行挖掘。同时由题意可知，AD的长度大于42+7=49米，若AD为正方形的一条边，则所给选项均不满足，故AD只能为正方形的对角线。如下图所示，设正方形挖掘区域的边长AE和DE为x米，过点A作DC的垂线，与DC的延长线相交于点F，则DF=FC+CD=AB+CD=7+42=49米，AF=BC=7米。根据勾股定理，在三角形ADF和三角形ADE中，\u003cimg data-k=\"2bca60a59e5d\">\u003cimg data-k=\"f8ed3a0d5840\">，即\u003cimg data-k=\"33599ec87c0a\">，解得x=35，即这个正方形挖掘区域的边长为35米。\n\u003cimg data-k=\"3bfa71b69c5c\" style=\"max-width:285px\">\n故正确答案为D。","no":60,"missingImage":false},{"type":"question","qid":"4651674","cat":"数学运算","stem":"甲、乙、丙三个物流公司合作完成两个仓库K和L的货物搬运任务。已知两个仓库的工作量相同，他们先在K工作2小时，完成了K工作量的75%；然后乙、丙先去L工作，甲留在K继续工作，并用3小时完成了K的剩余工作量后再去L工作，直至任务全部完成。甲在L工作的总时间为：","options":{"A":"20分钟","B":"30分钟","C":"40分钟","D":"50分钟"},"answer":"A","explanation":"甲用3小时完成K工作总量的1-75%=25%，赋值甲的工作效率为1，则K的工作总量为\u003cimg data-k=\"b28fcd535ad3\">，L的工作总量也为12。甲、乙、丙合作2小时完成K的工作量为12×75%=9，则甲、乙、丙的工作效率之和为\u003cimg data-k=\"a59b37908c24\">，乙、丙的工作效率之和为4.5-1=3.5。乙、丙在L工作3小时完成的工作量为3.5×3=10.5，L剩余的工作量为12-10.5=1.5。因此甲在L工作的总时间为\u003cimg data-k=\"0cc8e9ddcaa0\">小时，即20分钟。\n故正确答案为A。","no":61,"missingImage":false},{"type":"question","qid":"4651677","cat":"数学运算","stem":"正方体\u003cimg data-k=\"770c8489243c\">中，E、F分别为棱\u003cimg data-k=\"2f9face6f4fa\">和\u003cimg data-k=\"f0778af906c8\">的中点，则平面\u003cimg data-k=\"42e8e0c45916\">截该正方体所得截面的形状是：","options":{"A":"三角形","B":"四边形","C":"五边形","D":"六边形"},"answer":"B","explanation":"如图所示，设正方体的中心点为O，E、F分别分别为\u003cimg data-k=\"e2b220efe3e0\">、\u003cimg data-k=\"330a1a91e3d3\">的中点，\u003cimg data-k=\"16210dfd629d\">为正方体的体对角线，连接\u003cimg data-k=\"cee809ab9500\">、EB、BF、\u003cimg data-k=\"8b51cca10548\">、\u003cimg data-k=\"16210dfd629d\">、EF，易得此六条线段在同一平面上，则故平面\u003cimg data-k=\"1c5472324a6d\">截该正方体所得截面即为四边形\u003cimg data-k=\"8db0824f8e86\">。\n\u003cimg data-k=\"10d669e70403\" style=\"max-width:367px\">\n故正确答案为B。","no":62,"missingImage":false},{"type":"question","qid":"4651458","cat":"数学运算","stem":"某餐饮公司甲、乙两种外卖每份的售价分别为30元和50元，若该公司某天售出这两种外卖共500份，销售收入为21400元，则售出的两种外卖数量相差：","options":{"A":"140份","B":"160份","C":"180份","D":"200份"},"answer":"A","explanation":"假设甲外卖和乙外卖当天分别卖出x份和y份。根据题干条件可知，这两种外卖共售出500份，可列式为x+y=500······①；这两种外卖的销售收入为21400元，可列式为30x+50y=21400······②。联立方程组，解得x=180，y=320，故售出的两种外卖数量相差320-180=140份。\n故正确答案为A。","no":63,"missingImage":false},{"type":"question","qid":"4651461","cat":"数学运算","stem":"某学者认为，人类的体力、情绪、智力自出生日起分别以22天、28天、33天为周期开始往复循环变化，前半个周期是“高潮期”，后半个周期是“低潮期”。根据该学者的观点，我们过公历生日时，体力、情绪和智力同时处于“高潮期”的最小年龄是：","options":{"A":"4周岁","B":"3周岁","C":"2周岁","D":"1周岁"},"answer":"C","explanation":"根据题意利用代入排除法，问最小年龄，从小到大进行代入。代入D项若最小年龄为1周岁，即365天，体力处于\u003cimg data-k=\"e845fcf56723\">个周期⋯⋯13天，22天前半个周期11天是“高潮期”，13天不满足题意，排除D项；代入C项若最小年龄为2周岁，即365×2=730天，体力处于\u003cimg data-k=\"b7177be2717a\">个周期⋯⋯4天，情绪处于\u003cimg data-k=\"17ec6d334878\">个周期······2天，智力处于\u003cimg data-k=\"9dfa7213784c\">个周期······4天，均处于以22天、28天、33天为周期的前半个周期“高潮期”，满足题意。\n备注：即使在2周岁时经历了闰年366天，所有余数均加一，仍然均处于前半个周期“高潮期”。\n故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"4651482","cat":"数学运算","stem":"如图所示，为测量珠穆朗玛峰上某点C的海拔高度，测量队选择了两个海拔高度相差100米的珠峰测量点A和B，测得\u003cimg data-k=\"35b06c4758da\">为\u003cimg data-k=\"c16e5a8b3239\">，从A观测B、C的仰角分别为\u003cimg data-k=\"5608ab142532\">和\u003cimg data-k=\"f0149b2f4575\">，从B观测C的仰角也为30°，则C点的海拔高度比A点高：\n\u003cimg data-k=\"45588fc14006\" style=\"max-width:187px\">","options":{"A":"\u003cimg data-k=\"2b9a8eb6ce28\">米","B":"150米","C":"\u003cimg data-k=\"55ce2497345c\">米","D":"200米"},"answer":"D","explanation":"\u003cimg data-k=\"3f97dea9d75f\" style=\"max-width:435px\">\n如图所示，A和B两个海拔高度相差100米（即BE=100米），从A观测B的仰角为\u003cimg data-k=\"5608ab142532\">，因\u003cimg data-k=\"aacaa1996ffb\">是\u003cimg data-k=\"5608ab142532\">的直角三角形，则三边关系为\u003cimg data-k=\"98e0cffdc94f\">，所以AB=100×2=200米。从B观测C的仰角也为\u003cimg data-k=\"5608ab142532\">，根据题意，设CO=X米，则CD=（X-100）米，因\u003cimg data-k=\"199a72db98d4\">是\u003cimg data-k=\"5608ab142532\">的直角三角形，则三边关系为\u003cimg data-k=\"98e0cffdc94f\">，所以BC=2（X-100）=（2X-200）米。又因为从A观测C的仰角为\u003cimg data-k=\"f0149b2f4575\">，\u003cimg data-k=\"e85a0a395f35\">是\u003cimg data-k=\"f0149b2f4575\">的直角三角形，则三边关系为\u003cimg data-k=\"9fee48657c1f\">，所以\u003cimg data-k=\"1638db350b3a\">米。在\u003cimg data-k=\"5240f0876e41\">中，\u003cimg data-k=\"35b06c4758da\">为\u003cimg data-k=\"c16e5a8b3239\">，根据勾股定理可知，\u003cimg data-k=\"d9b8968e3a41\">，即\u003cimg data-k=\"8a0ad1134485\">\u003cimg data-k=\"7efce4eacf17\">，解得X=200，则C点的海拔高度比A点高200米。\n故正确答案为D。","no":65,"missingImage":false}],"count":20,"answerable":20,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>运动会的3000米比赛中，运动员你追我赶，其中选手甲、乙、丙、丁表现特别出色，交替领先。观众张、王、李、赵分别预测了4位选手的最终名次：\u003c/p>\u003cp>张：甲第四，乙第三，丙第二，丁第一；\u003c/p>\u003cp>王：甲第三，乙第二，丙第四，丁第一；\u003c/p>\u003cp>李：甲第四，乙第二，丙第一，丁第三；\u003c/p>\u003cp>赵：甲第二，乙第三，丙第一，丁第四。\u003c/p>\u003cp>比赛结束后，甲、乙、丙、丁确实位列前四名，而且不存在并列情况。但他们的具体名次，张全猜错了，而其余3人分别猜对了1个。\u003c/p>","questions":[{"qid":"4651560","cat":"逻辑判断","stem":"根据以上陈述，以下哪项可能为真？","options":{"A":"丙第一，甲第二，丁第三，乙第四","B":"乙第一，丁第二，甲第三，丙第四","C":"乙第一，甲第二，丁第三，丙第四","D":"甲第一，丁第二，丙第三，乙第四"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）张：甲第四，乙第三，丙第二，丁第一；\n（2）王：甲第三，乙第二，丙第四，丁第一；\n（3）李：甲第四，乙第二，丙第一，丁第三；\n（4）赵：甲第二，乙第三，丙第一，丁第四；\n（5）甲、乙、丙、丁位列前四名，且不存在并列；\n（6）张全猜错了，其余3人分别猜对了1个。\n第二步：根据题干条件进行推理。\n本题题干信息不确定，选项信息充分，优先考虑代入法。\n代入A项，王全猜错，不符合条件（6）王猜对1个，排除；\n代入B项，王猜对2个，不符合条件（6）王猜对1个，排除；\n代入C项，满足题干所有条件，当选；\n代入D项，王全猜错，不符合条件（6）王猜对1个，排除。\n故正确答案为C。","no":66,"missingImage":false},{"qid":"4651563","cat":"逻辑判断","stem":"假如王猜对了甲的名次，那么以下哪项一定为真?","options":{"A":"丁第四","B":"丙第一","C":"乙第二","D":"乙第一"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）张：甲第四，乙第三，丙第二，丁第一；\n（2）王：甲第三，乙第二，丙第四，丁第一；\n（3）李：甲第四，乙第二，丙第一，丁第三；\n（4）赵：甲第二，乙第三，丙第一，丁第四；\n（5）甲、乙、丙、丁位列前四名，且不存在并列；\n（6）张全猜错了，其余3人分别猜对了1个；\n（7）王猜对了甲的名次。\n第二步：根据题干条件进行推理。\n从确定信息条件（7）入手进行推理，与条件（2）（6）结合，可以推出甲第三，乙不是第二，丙不是第四，丁不是第一；\n根据条件（5）以及甲第三可知，乙、丙、丁都不是第三；\n根据条件（6）张全猜错以及条件（1）可以推出，乙不是第三，丙不是第二，丁不是第一；\n综合上述推理可知，丙不是第二、三、四，那么丙只能是第一，对应B项。\n故正确答案为B。","no":67,"missingImage":false}]},{"type":"material","material":"\u003cp>张研究员要在甲、乙、丙、丁、戊、己、庚7个村中选取4个进行乡村文明建设调研。因为地点、时间、经费等原因，选择还要符合以下条件：\u003c/p>\u003cp>（1）如果不选择甲，就要选乙；\u003c/p>\u003cp>（2）如果选丙，则不能选乙；\u003c/p>\u003cp>（3）如果选丁，则不能选庚；\u003c/p>\u003cp>（4）如果选戊，则要选丁；\u003c/p>\u003cp>（5）己和庚有且只有一个入选。\u003c/p>","questions":[{"qid":"4651757","cat":"逻辑判断","stem":"根据以上信息，以下哪项可能是张研究员选择的4个村？","options":{"A":"甲、丙、丁、戊","B":"甲、乙、丁、己","C":"丙、丁、戊、己","D":"乙、丙、戊、庚"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）\u003cimg data-k=\"e752a8ae1a16\">甲\u003cimg data-k=\"2dfb7d1f72f3\">乙；\n（2）丙\u003cimg data-k=\"2dfb7d1f72f3\"> \u003cimg data-k=\"e752a8ae1a16\">乙；\n（3）丁\u003cimg data-k=\"2dfb7d1f72f3\"> \u003cimg data-k=\"e752a8ae1a16\">庚；\n（4）戊\u003cimg data-k=\"2dfb7d1f72f3\">丁；\n（5）己/庚。\n第二步：逐一验证选项。\n提问方式问可能，优先考虑代入法。\n代入A项，不满足条件（5）己和庚有且只有一个入选，不符合题干条件，排除；\n代入B项，符合题干条件，当选；\n代入C项，结合条件（2）可知，丙入选了，则乙不能入选，又结合条件（1）可知，甲一定入选，与选项矛盾，排除；\n代入D项，结合条件（2）可知，乙入选了，则丙不能入选，与选项矛盾，排除。\n故正确答案为B。","no":68,"missingImage":false},{"qid":"4651759","cat":"类比推理","stem":"如果张研究员选择了乙，再得知以下哪个村入选就可以确定4个要调研的村？","options":{"A":"甲","B":"丁","C":"己","D":"庚"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）\u003cimg data-k=\"e752a8ae1a16\">甲\u003cimg data-k=\"2dfb7d1f72f3\">乙；\n（2）丙\u003cimg data-k=\"a3a13b026980\">乙；\n（3）丁\u003cimg data-k=\"a3a13b026980\">庚；\n（4）戊\u003cimg data-k=\"2dfb7d1f72f3\">丁；\n（5）己/庚。\n第二步：根据题干条件分析选项。\n张研究员选择了乙，根据条件（2）可知，丙不入选。题干所给条件较多，问法为“再得知以下哪个村入选就可以确定4个要调研的村”，可以采用代入法。\n代入A项：如果甲入选，此时能够确定的是甲和乙入选，丙不入选。一共有4个村子入选，此时需要在丁、戊、己、庚中选两个。根据条件（5）可知己、庚中只能选一个，那么丁和戊中也只能选一个。如果选戊，根据条件（4）可知一定要选丁，与丁、戊只能选一个矛盾，所以选丁不选戊；根据条件（3）可知若选庚，那么就不能选丁，与之前的结论矛盾，因此只能选己。那么能够确定被选的4个村子分别是甲、乙、丁、己，当选；\n代入B项：丁入选，根据条件（3）可知庚不入选，根据条件（5）可知己入选，但是甲、戊之中选哪个村子并不能确定，排除；\n代入C项：己入选，根据条件（5）可知庚不入选，但是甲、丁、戊之中选哪两个村子并不能确定，排除；\n代入D项：庚入选，根据条件（3）可知丁不入选，根据条件（4）得出戊不入选，同时根据条件（5）可知己不入选。最终不入选的有4个村子，分别是丙、丁、戊、己，只能有3个村子入选，与题干要求不符，排除。\n故正确答案为A。","no":69,"missingImage":false},{"qid":"4651699","cat":"类比推理","stem":"新教师：老教师","options":{"A":"计划：总结","B":"序言：结尾","C":"草稿：定稿","D":"初赛：决赛"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n新教师是教师，老教师是教师，二者为并列关系，且由新教师变成老教师，存在内在的转变。\n第二步：判断选项词语间逻辑关系。\nA项：计划是工作前的提纲，总结是工作后的评价，故二者不是并列关系，与题干逻辑关系不一致，排除；\nB项：书籍或文章的开头叫“序言”，与结尾不构成并列关系，与题干逻辑关系不一致，排除；\nC项：草稿指在进行文学创作前提前整理的文本内容，定稿指创作内容全部确定的最后完成稿，二者为并列关系，且由草稿变成定稿，存在内在的转变，与题干逻辑关系一致，当选；\nD项：初赛和决赛为并列关系，但不是由初赛变为决赛，二者不存在内在的转变，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":70,"missingImage":false},{"qid":"4651529","cat":"类比推理","stem":"冬：暖冬","options":{"A":"妻：未婚妻","B":"人：植物人","C":"菜：平价菜","D":"书：有声书"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n暖冬是冬天，二者为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：未婚妻指已与某男子订婚尚未结婚的女子，故在法律意义上，未婚妻不是妻子，与题干逻辑关系不一致，排除；\nB项：植物人是与植物生存状态相似的特殊人体状态，植物人是人，与题干逻辑关系一致，保留；\nC项：平价菜是菜，二者为种属关系，与题干逻辑关系一致，保留；\nD项：有声书指用声音来表达内容的书，二者为种属关系，与题干逻辑关系一致，保留；\n对比BCD三项，冬天一般是冷的，暖冬是与冬天特性相反的特殊情况；D项书一般是无声的，有声书是书特性相反的特殊情况，D项与题干更为接近。\n故正确答案为D。","no":71,"missingImage":false},{"qid":"4651537","cat":"类比推理","stem":"灭蚊剂：蚊子","options":{"A":"居家隔离：病毒","B":"市场经济：垄断","C":"首问负责：推诿","D":"民意测验：分歧"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n灭蚊剂是用来消灭蚊子的，所以二者为功能对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：居家隔离是为了阻断病毒的传播，但是并不能消灭病毒，而题干中灭蚊剂是对蚊子存在致命性伤害，与题干逻辑关系不一致，排除；\nB项：市场经济和垄断没有必然的关系，与题干逻辑关系不一致，排除；\nC项：首问负责的意思是谁接到问题，谁就负责到底。具体内容为最先接到来访或来办理业务时，其作为首问负责的人，首问负责是用来消除工作人员对来访人员推诿的，二者为功能对应关系，与题干逻辑关系一致，当选；\nD项：民意测验是为了了解公众对特定问题的看法和意见，与分歧没有明显关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":72,"missingImage":false},{"qid":"4651541","cat":"类比推理","stem":"水中捞月：白费功夫","options":{"A":"霸王之兵：勇往直前","B":"天涯海角：杳无音信","C":"棋逢对手：不相上下","D":"蚍蜉撼树：不自量力"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n水中捞月比喻去做根本做不到的事情，只能白费力气。水中捞月可以用来形容白费功夫，二者为比喻象征义，且水中捞月为贬义词。\n第二步：判断选项词语间逻辑关系。\nA项：霸王之兵出自《孙子兵法》，形容强大的国家必须要有一支强大的军队。勇往直前形容不怕艰险，奋勇地一直往前进。两者无明显语义关系，与题干逻辑关系不一致，排除；\nB项：天涯海角形容极远的地方，或相隔极远。杳无音信形容没有一点消息。两者无明显语义关系，与题干逻辑关系不一致，排除；\nC项：棋逢对手是指下棋碰上了水平相当的对手，比喻双方本领不相上下。棋逢对手可以用来形容不相上下，二者为比喻象征义，但棋逢对手为褒义词，与题干逻辑关系不一致，排除；\nD项：蚍蜉撼树是指蚂蚁想摇动大树，比喻狂妄，不自量力。蚍蜉撼树可以用来形容不自量力，二者为比喻象征义，且蚍蜉撼树为贬义词，与题干逻辑关系一致，当选。\n故正确答案为D。","no":73,"missingImage":false},{"qid":"4651531","cat":"类比推理","stem":"峰：山峰：碳达峰","options":{"A":"界：世界：思想界","B":"潮：海潮：移民潮","C":"子：儿子：菜篮子","D":"羊：山羊：领头羊"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“山峰”指山突出来的顶端，山峰中的“峰”指山的尖顶。“碳达峰”指在某一个时点，二氧化碳的排放达到峰值后不再增长，之后逐步回落，碳达峰中的“峰”即峰值的意思，两个“峰”的意思不一致。题干中山峰是具体的事物，而碳达峰是抽象概念。\n第二步：判断选项词语间逻辑关系。\nA项：“世界”广义上来讲，就是指全部、所有、一切，世界中的“界”指范围。“思想界”指的是思想这个范畴，两个“界”的意思一致，与题干逻辑关系不一致，排除；\nB项：“海潮”中的“潮”指的是潮汐、潮水，“移民潮”指的是移民的潮流，移民潮中的“潮”是比喻大规模的社会变动或运动发展的起伏形。两个“潮”的意思是不一致的。海潮是具体的事物，而移民潮是抽象概念，与题干逻辑关系一致，当选；\nC项：“儿子”是指父母对孩子的一种称谓，“菜篮子”指的是装菜的一种器具。这两个“子”都是附加在名词、动词、形容词后，具有名词性（读轻声）的意思，与题干逻辑关系不一致，排除；\nD项：“山羊”指的是一种动物、家畜，“领头羊”是指羊群中领头的羊，借指带领大家前进的领头人或单位。对于本意来说两个“羊”的意思是一致的，而且领头羊不是抽象概念，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":74,"missingImage":false},{"qid":"4651542","cat":"类比推理","stem":"电气：煤气：气","options":{"A":"酸奶：羊奶：奶","B":"银河：运河：河","C":"正面：反面：面","D":"榆钱：金钱：钱"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n电气是利用电产生能量的方式，与煤气无关，而且电气不是气。煤气是气的一种，后两者是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：酸奶与奶是原材料与制成品的关系，羊奶是奶的一种，后两者是种属关系，与题干逻辑关系不一致，排除；\nB项：银河与运河无关，而且银河不是河。运河是河的一种，后两者是种属关系，与题干逻辑关系一致，当选；\nC项：正面与反面属于事物的两面性，二者为并列关系，二者均与面构成种属关系，与题干逻辑关系不一致，排除；\nD项：榆钱是植物，不是钱，金钱和钱为全同关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":75,"missingImage":false},{"qid":"4651700","cat":"类比推理","stem":"地砖：方砖：长条砖","options":{"A":"菜肴：荤菜：白菜","B":"零食：素食：热食","C":"青茄：紫茄：番茄","D":"木船：客船：货船"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“方砖”和“长条砖”是两种不同形状的砖，二者为并列关系，同时均与“地砖”为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：荤菜指的是所有含有动物性成分的菜，荤菜是菜肴的一种，二者是种属关系，与题干逻辑关系不一致，排除；\nB项：零食、素食、热食两两之间是交叉关系，与题干逻辑关系不一致，排除；\nC项：青茄、紫茄、番茄为三种蔬菜，三者为并列关系，与题干逻辑关系不一致，排除；\nD项：“客船”和“货船”是两种不同功能的船，二者为并列关系，同时均与“木船”为交叉关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":76,"missingImage":false},{"qid":"4651550","cat":"类比推理","stem":"东北亚 之于 （    ） 相当于 （    ） 之于 树冠","options":{"A":"韩国；树墩","B":"南亚；树根","C":"东半球；树洞","D":"日本海；树荫"},"answer":"B","explanation":"逐一代入选项。\nA项：韩国是东北亚的一部分，二者是组成关系，树墩与树冠都是树木的组成部分，二者为并列关系，前后逻辑关系不一致，排除；\nB项：东北亚和南亚是不同的地理区域，二者是并列关系，树根和树冠都是树木的组成部分，二者为并列关系，前后逻辑关系一致，当选；\nC项：东北亚是东半球的一部分，二者是组成关系，树洞和树冠都是树木的组成部分，二者为并列关系，前后逻辑关系不一致，排除；\nD项：日本海是东北亚的一部分，二者为组成关系，树荫是指树下日光照不到的地方，树冠经阳光照射后能形成树荫，二者为对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":77,"missingImage":false},{"qid":"4651702","cat":"类比推理","stem":"（    ） 之于 帐篷 相当于 进餐 之于 （    ）","options":{"A":"敖包；餐厅","B":"野营；碗筷","C":"宿营；用餐","D":"探险；烤鸭"},"answer":"B","explanation":"逐一代入选项。\nA项：敖包是指蒙古族人民做路标和界标的堆子，用土、石、草等堆成，与帐篷无明显对应关系；在餐厅进餐，两者是地点对应关系，前后逻辑关系不一致，排除；\nB项：野营需要用到帐篷，两者是工具对应关系；进餐需要用到碗筷，两者也是工具对应关系，前后逻辑关系一致，当选；\nC项：宿营是指军队行军或战斗后的临时住宿，宿营可能需要用到帐篷，两者是工具对应关系；进餐和用餐都表示“用餐”的意思，两者是全同关系，前后逻辑关系不一致，排除；\nD项：探险可能需要用到帐篷，两者是工具对应关系；进餐可以吃烤鸭，两者是对象对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":78,"missingImage":false},{"qid":"4651706","cat":"类比推理","stem":"（    ） 之于 高洁 相当于 红色 之于 （    ）","options":{"A":"高尚：红花","B":"典雅：色彩","C":"牡丹：喜庆","D":"莲花：革命"},"answer":"C","explanation":"逐一代入选项。\nA项：高尚和高洁都是形容品行高尚纯洁，二者是近义关系，红花是红色的，二者是属性对应关系，前后逻辑关系不一致，排除；\nB项：典雅形容高雅而不浅俗，高洁形容高尚纯洁，二者均为美好品质，是并列关系，红色是色彩，二者是种属关系，前后逻辑关系不一致，排除；\nC项：牡丹象征高洁、端庄秀雅，二者是比喻象征义，红色象征喜庆，二者是比喻象征义，前后逻辑关系一致，保留；\nD项：莲花象征清白纯洁、高尚谦虚，二者是比喻象征义，红色象征革命，二者是比喻象征义，前后逻辑关系一致，保留；\n比较C、D两项，题干高洁是形容词，C项喜庆是形容词，D项革命为动词，所以C项比D项更接近题干。\n故正确答案为C。","no":79,"missingImage":false},{"qid":"4651701","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"57fe68c53170\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，优先考虑属性规律。观察题干图形，出现等腰三角形、等腰梯形等明显轴对称图形，考虑对称性。题干对称轴数量均为1，排除C项。继续观察发现，题干对称轴依次顺时针旋转\u003cimg data-k=\"f0149b2f4575\">，则“？”处应该填入对称轴方向为右上-左下的图形，只有A项符合。\n故正确答案为A。","no":80,"missingImage":false},{"qid":"4651720","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"7422a1ff4737\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，无明显属性规律，考虑数量规律。观察发现题干出现较多生活化图形，考虑部分数。题干图形的部分数均为2，故？处要选一个部分数为2的图形，只有B项符合。\n故正确答案为B。","no":81,"missingImage":false},{"qid":"4651708","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"f4617bd3384e\" style=\"max-width:693px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"图形元素组成相同，优先考虑位置规律。观察发现，题干图形中两个黑球沿九宫格的外圈进行平移。优先考虑就近假设，图一左上角黑球保持位置不动，但图四不符合此规律，因此图一左上角黑球对应图二右下角黑球。如下图所示，从图一到图五，黑球1沿外圈每次顺时针平移4格，黑球2沿外圈每次逆时针平移3格，因此？处图形也应满足此规律，黑球位置如下图所示，对应A项。\n\u003cimg data-k=\"67be9e1218ad\" style=\"max-width:694px\">\n故正确答案为A。","no":82,"missingImage":false},{"qid":"4651783","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"8388ce55f61a\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成相同，优先考虑位置规律。观察发现，三角形沿着正方形的四个角依次顺时针移动一个角的位置，？处应移动到左上角，排除A项；继续观察题干，发现小圆数量发生变化，内圈小圆数量依次为1、2、1、2、1、？，？处应选择内圈有2个小圆的图形，排除B项；外圈小圆数量均为6个，排除C项，只有D项符合规律。\n故正确答案为D。","no":83,"missingImage":false},{"qid":"4651707","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现出一定的规律性。\n\u003cimg data-k=\"69e2d260ae97\" style=\"max-width:450px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"图形元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形中出现明显单一直线及多边形，优先考虑数直线，发现整体数直线无规律，而题干图形中横线、竖线较多，因此考虑分开数横竖线。九宫格优先横行看，三行图形的横线数依次为3、4、3、4、3、4、4、3，三行图形的竖线数依次为2、3、2、3、2、3、3、2，单看横竖线数无规律，考虑二者做运算。发现题干所有图形的横线数减竖线数均为1，故？处应选择横线数减竖线数等于1的图形，只有A项符合规律。\n故正确答案为A。","no":84,"missingImage":false},{"qid":"4651744","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现出一定的规律性：\n\u003cimg data-k=\"f78b708220f9\" style=\"max-width:418px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成相似，优先考虑样式规律，且相同线条重复出现，因此考虑样式规律中的加减同异。九宫格优先按行看，观察发现，第一行中，图2逆时针旋转\u003cimg data-k=\"f0149b2f4575\">，再与图1求异得到图3。经验证，第二行也满足此规律。因此第三行应用此规律，图2逆时针旋转\u003cimg data-k=\"f0149b2f4575\">，再与图1求异，得到A项图形。\n故正确答案为A。","no":85,"missingImage":false},{"qid":"4651582","cat":"图形推理","stem":"下边四个图形中，只有一个是由上边的四个图形拼合（只能通过上、下、左、右平移）而成的，请把它找出来。\n\u003cimg data-k=\"246d7ba0d7c2\" style=\"max-width:618px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查平面拼合，可采用平行且等长相消的方式解题。消去平行且等长的线段后进行组合即可得到轮廓图，即为A项。平行且等长相消的方式如下图所示：\n\n\u003cimg data-k=\"6b78c9bcd630\" style=\"max-width:640px\">\n故正确答案为A。","no":86,"missingImage":false},{"qid":"4651713","cat":"图形推理","stem":"下边四个图形中，只有一个是由上边的四个图形拼合（只能通过上、下、左、右平移）而成的，请把它找出来。\n\u003cimg data-k=\"8b66f289ed5e\" style=\"max-width:678px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考察平面拼合，可采用平行且等长相消的方式解题。消去平行且等长的线段后进行组合即可得到轮廓图，即为B项。平行且等长相消的方式如下图所示：\n\u003cimg data-k=\"faa8a4ae5d5a\" style=\"max-width:678px\">\n\u003cimg data-k=\"fded39612937\" style=\"max-width:188px\">\n故正确答案为B。","no":87,"missingImage":false},{"qid":"4651697","cat":"图形推理","stem":"下边四个图形中，只有一个是由上边的四个图形拼合（只能通过上、下、左、右平移）而成的，请把它找出来。\n\u003cimg data-k=\"f8f8300d15af\" style=\"max-width:518px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查平面拼合。消去凹凸匹配的线条后进行组合可得到轮廓图，即为A项。具体拼合方式如下图所示：\n\u003cimg data-k=\"fe492c1e036f\" style=\"max-width:218px\">\n故正确答案为A。","no":88,"missingImage":false},{"qid":"4651743","cat":"类比推理","stem":"上边四张纸片，每张纸片一面是黑色，另一面是白色，下边仅有一项能由其拼合（可以平移、旋转、翻转）而成，请把它找出来。\n\u003cimg data-k=\"4de6560dcdaa\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查平面拼合，可以平移、旋转、翻转，且每张纸片一面是黑色，另一面是白色，需要考虑翻转后的颜色变化。将题干图形标上序号，如下图所示，逐一分析选项。\n\u003cimg data-k=\"b4f91a7d8bf8\" style=\"max-width:465px\">\nA项：可以由题干图形拼合而成，拼合方式如上图所示，当选；\nB项：左下角的五边形是由图③平移过去的，颜色应该是白色，而选项是黑色，排除；\n\nC项：右下角的白色三角形是由图④翻转后平移过去的，颜色应该是黑色，而选项是白色，排除；\n\nD项：左下角的五边形是由图③平移过去的，颜色应该是白色，而选项是黑色；且右下角的三角形是由图②翻转后平移得到的，颜色应该是白色，而选项是黑色。排除。\n\n故正确答案为A。","no":89,"missingImage":false},{"qid":"4651714","cat":"类比推理","stem":"上边四张纸片，每张纸片一面是黑色，另一面是白色，下边仅有一项能由其拼合（可以平移、旋转、翻转）而成，请把它找出来。\n\u003cimg data-k=\"4719ed595421\" style=\"max-width:619px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查平面拼合，题干已知每张纸片一面是黑色，另一面是白色，且可以涉及转动，故可知，平移和旋转时纸片颜色不会改变，翻转时颜色会发生改变。经过拼合后只能得到C项。如下图所示：\n\u003cimg data-k=\"27dd273ffc99\" style=\"max-width:138px\">\n故正确答案为C。","no":90,"missingImage":false},{"qid":"4651717","cat":"图形推理","stem":"左边给定的是多面体的外表面，右边哪一项能由它折叠而成？\n\u003cimg data-k=\"d290c5a08f51\" style=\"max-width:639px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"将题干展开图标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"4f5413a5c065\" style=\"max-width:663px\">\nA项：选项由面b和面c构成，选项与题干展开图一致，当选；\nB项：选项由面b和面c构成，以面c中空白顶点为起点进行画边（如上图蓝线所示），展开图中边1对应面b，选项中边3对应面b，选项与题干展开图不一致，排除；\nC项：选项由面a和面c构成，展开图中，二者的公共边与面a内部阴影小三角形的顶点重合，选项中不重合（如下图绿线所示），选项与题干展开图不一致，排除；\n\u003cimg data-k=\"e6254860028d\" style=\"max-width:657px\">\nD项：选项由面b和面d构成，展开图中，二者的公共边与面d内部三角形的边重合，选项中不重合（如下图红线所示），选项与题干展开图不一致，排除。\n\u003cimg data-k=\"edfb6c68d7ff\" style=\"max-width:652px\">\n故正确答案为A。","no":91,"missingImage":false},{"qid":"4651741","cat":"图形推理","stem":"左边给定的是多面体的外表面，右边哪一项能由它折叠而成？\n\u003cimg data-k=\"e3ebfa3c2f98\" style=\"max-width:672px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"将题干展开图标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"2beb030c998b\" style=\"max-width:673px\">\nA项：选项由面b、面a或面c构成，题干展开图中面b内白色三角形的顶点（如下图蓝点所示）只与面a或面c中白色三角形相邻，而选项中面b内白色三角形的顶点与面a或面c中阴影三角形和白色三角形均相邻，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"70616c4c3376\" style=\"max-width:674px\">\nB项：选项由面b、面d构成，题干展开图中面d的白色部分挨着面b，而选项中面d的灰色部分挨着面b，选项与题干展开图不一致，排除；\nC项：选项由面a、面c构成，选项与题干展开图一致，当选；\nD项：选项由面d、面a或面c构成，题干展开图中面d白色部分的最长边挨着面b，而选项中面d白色部分的最长边没有挨着面b，选项与题干展开图不一致，排除。\n故正确答案为C。","no":92,"missingImage":false},{"qid":"4651722","cat":"图形推理","stem":"左边给定的是多面体的外表面，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"b1e6c7f6c3c5\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"将原展开图标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"046f52469af5\" style=\"max-width:600px\">\nA项：选项中出现了面a和面e，面a中黑点所在矩形的长边（如下图线1所示）与面e相邻，而展开图中该矩形的长边与面b相邻，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"89a9e15275a7\" style=\"max-width:600px\">\nB项：选项中出现了面c、面f，面f中白圆所在矩形的长边（如下图线2所示）与面c相邻，而展开图中该矩形的长边与面e相邻，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"d94923cb4fff\" style=\"max-width:600px\">\nC项：选项中出现了面c、面d和面f，选项与题干展开图一致，当选；\nD项：选项中出现了面a、面e，顶面为面b或面d，面e挨着顶面的空白三角形（如下图线3所示），但展开图中面e挨着面b或面d内的阴影三角形，选项与题干展开图不一致，排除。\n\u003cimg data-k=\"062a0612906a\" style=\"max-width:600px\">\n故正确答案为C。","no":93,"missingImage":false},{"qid":"4651747","cat":"图形推理","stem":"左边给定的是多面体的外表面，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"c7633194a2a3\" style=\"max-width:646px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查六面体，将原展开图标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"3b57cfeccbd9\" style=\"max-width:655px\">\nA项：选项中必然存在面b、面c和面d，题干展开图中三个面的公共点没有引出面c中的小短线，而选项中三个面的公共点引出了面c中的小短线，选项与题干展开图不一致，排除；\nB项：选项中必然存在面b、面d和面f，题干展开图中三个面的公共点引出面d中的斜线，而选项中三个面的公共点没有引出面d中的斜线，选项与题干展开图不一致，排除；\nC项：选项中必然存在面a、面e和面f，选项与题干展开图一致，当选；\nD项：选项中必然存在面a、面c和面e，题干展开图中三个面的公共点在面a中对应的是大矩形，而选项中三个面的公共点在面a中对应的是小矩形，选项与题干展开图不一致，排除。\n故正确答案为C。","no":94,"missingImage":false},{"qid":"4651753","cat":"逻辑判断","stem":"新信息技术的不断发展，使生产要素配置发生变化；生产要素配置的变化又使企业运营模式发生变化，进而使市场对人才的需求发生变化；而市场对人才的需求发生了变化，就会促使高校重新制定人才培养方案。\n以上陈述如果为真，可以推出以下哪项？","options":{"A":"市场对人才的需求发生变化会导致企业运营模式发生变化","B":"如果高校没有重新制定人才培养方案，说明市场对人才的需求没有什么变化","C":"如果没有新信息技术的不断发展，市场对人才的需求就不会发生变化","D":"企业运营模式的变化不一定会导致高校重新制定人才培养方案"},"answer":"B","explanation":"第一步：翻译题干。\n①新信息技术的不断发展\u003cimg data-k=\"2dfb7d1f72f3\">生产要素配置发生变化；\n②生产要素配置的变化\u003cimg data-k=\"2dfb7d1f72f3\">企业运营模式发生变化\u003cimg data-k=\"2dfb7d1f72f3\">市场对人才的需求发生变化；\n③市场对人才的需求发生了变化\u003cimg data-k=\"2dfb7d1f72f3\">高校重新制定人才培养方案；\n以上条件可以递推出：④新信息技术的不断发展\u003cimg data-k=\"2dfb7d1f72f3\">生产要素配置发生变化\u003cimg data-k=\"2dfb7d1f72f3\">企业运营模式发生变化\u003cimg data-k=\"2dfb7d1f72f3\">市场对人才的需求发生变化\u003cimg data-k=\"2dfb7d1f72f3\">高校重新制定人才培养方案。\n第二步：逐一分析选项。\nA项：翻译为市场对人才的需求发生变化\u003cimg data-k=\"2dfb7d1f72f3\">企业运营模式发生变化，是对②的肯后，肯后得不出必然结论，无法推出，排除；\nB项：翻译为\u003cimg data-k=\"e752a8ae1a16\">高校重新制定人才培养方案\u003cimg data-k=\"a3a13b026980\">市场对人才的需求发生变化，是对③的否后，否后必否前，可以推出，当选；\nC项：翻译为\u003cimg data-k=\"e752a8ae1a16\">新信息技术的不断发展\u003cimg data-k=\"a3a13b026980\">市场对人才的需求发生变化，是对④的否前，否前得不出必然结论，无法推出，排除；\nD项：根据④可知，企业运营模式的变化一定会导致高校重新制定人才培养方案，故此项无法推出，排除。\n故正确答案为B。","no":95,"missingImage":false},{"qid":"4651719","cat":"逻辑判断","stem":"盲盒是指消费者不能提前得知包装盒内具体产品的销售方式。现在许多商家大量销售盲盒，文具盲盒、零食盲盒等“盲盒+”商业模式迅速走红。心理学研究表明，打开盲盒时的不确定性会刺激人们尤其是青少年重复购买。对此，有专家认为，盲盒这种销售方式如果不加监管会给青少年的身心健康造成负面影响。\n以下哪项如果为真，最能支持上述专家的观点？","options":{"A":"越来越多的青少年对盲盒已从单纯的猎奇逐步升级到追求美感、情感等价值层面","B":"打开盲盒时的不确定性令身心发育不成熟的青少年沉迷，激发其跟风攀比之心","C":"盲盒销售的价格通常远高于其实际价值，大大加重了青少年家长的经济负担","D":"许多商家将盲盒销售当作清理库存商品的方式，严重损害了消费者的合法权益"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：盲盒这种销售方式如果不加监管会给青少年的身心健康造成负面影响。\n论据：打开盲盒时的不确定性会刺激人们尤其是青少年重复购买。\n本题论点和论据讨论的都是盲盒会给青少年造成负面影响，话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是青少年对盲盒的追求变化，从猎奇升级到追求美感、情感等价值层面，但这种追求的变化是否会给青少年的身心健康造成负面影响并不明确，无法加强，排除；\nB项：该项说的是打开盲盒时的不确定性会让青少年沉迷，激发他们的跟风攀比之心，解释了为什么盲盒这种销售方式会给青少年的身心健康造成负面影响，补充论据，可以加强，当选；\nC项：该项说的是盲盒的销售模式加重家长的经济负担，讲的是对家长的负面影响，没有提及是否会给青少年的身心健康造成负面影响，话题不一致，无法加强，排除；\nD项：该项说的是盲盒的销售模式损害消费者的合法权益，没有提及是否会给青少年的身心健康造成负面影响，话题不一致，无法加强，排除。\n故正确答案为B。","no":96,"missingImage":false},{"qid":"4651721","cat":"逻辑判断","stem":"近年来，我国企业在设计产品时，注重融入中国元素，例如，在T恤上印上京剧脸谱等图案，推出中国航天系列文创产品······这些产品一上市，就受到消费者的热捧，“国货即潮流”的新消费观念正逐渐形成。有专家就此认为，正是这些中国元素的融入让国潮商品获得了国内消费者的青睐。\n以下哪项如果为真，最能支持上述专家的观点？","options":{"A":"中国文化五千年来绵延不绝，传统文化已深深刻在中国人的骨子里","B":"“中国制造”的高品质、高性能提升了消费者对其的认可度和忠诚度","C":"随着视野的开阔，消费者渐趋理性，对明显溢价的洋品牌不再盲目追捧","D":"中国文化的软实力已经深深影响着我国民众日常生活的方方面面"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：正是这些中国元素的融入让国潮商品获得了国内消费者的青睐。\n论据：近年来，我国企业在设计产品时，注重融入中国元素，这些产品一上市，就受到消费者的热捧，“国货即潮流”的新消费观念正逐渐形成。\n论据说的是注重融入中国元素的设计产品会受到消费者的热捧，而论点说正是这些中国元素的融入让国潮商品获得了国内消费者的青睐。论点论据话题一致，所以加强可以优先考虑补充论据，可以举例子，也可以解释原因。\n第二步：逐一分析选项。\nA项：该项说的是中国传统文化对中国人的影响深刻，正是由于传统文化的深刻影响，才让融入中国传统文化元素的国货产品获得了国内消费者的青睐，能够解释论点，可以加强，保留；\nB项：该项说的是“中国制造”的高品质、高性能会影响消费者对产品的认可度和忠诚度，但并没有说明中国元素的融入是否会影响消费者对产品的青睐程度，和论点话题不一致，无法加强，排除；\nC项：该项说的是消费者对洋品牌不再盲目追捧，但对洋品牌不追捧不代表就会青睐融入中国元素的国潮商品，和论点话题不一致，无法加强，排除；\nD项：该项说的是中国文化的软实力已经深深影响着我国民众日常生活的方方面面，正是由于中国文化的软实力的深刻影响，才让融入中国元素的国潮商品获得了国内消费者的青睐，能够解释论点，可以加强，保留。\n对比A、D两项，A项只提及了传统文化，而D项的中国文化软实力不仅包括传统文化，还包括其他内容，论点中的中国元素不仅包括传统文化元素，还包括了航天等非传统文化元素，这也是中国文化软实力的一部分，所以D项的加强力度优于A项，D项当选。\n故正确答案为D。","no":97,"missingImage":false},{"qid":"4651564","cat":"类比推理","stem":"某高校选派甲、乙、丙、丁4位专家组成乡村振兴调研小组，担任组长的专家为男性、党员、教授。已知这4位专家中：\n（1）每位专家都至少具有组长的一个特征；\n（2）有党员3人，男性2人，教授1人；\n（3）甲和乙性别相同；\n（4）乙是党员当且仅当丙是党员；\n（5）丙和丁不全是党员。\n由此推出，担任组长的是：","options":{"A":"甲","B":"乙","C":"丙","D":"丁"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）担任组长的专家为男性、党员、教授；\n（2）每位专家都至少具有组长的一个特征；\n（3）有党员3人；\n（4）男性2人；\n（5）教授1人；\n（6）甲和乙性别相同；\n（7）乙、丙要么都是党员，要么都不是党员；\n（8）丙不是党员或丁不是党员。\n第二步：根据题干条件进行推理。\n根据条件（3）和（7），得出乙和丙都是党员，再根据条件（3）和（8）得出丁不是党员，甲是党员，根据条件（4）和（6），假设甲和乙都是男性，那么丁既不是党员也不是男性，又根据条件（2），得出丁必须是教授，再根据条件（5），得出其他人都不是教授，此时并没有一个人具有担任组长的三个特征，与条件（1）矛盾，因此假设不成立；故甲和乙都不是男性，丙和丁都是男性，此时只有丙既是党员又是男性，再根据条件（1）和（5），得出丙必须也是教授。因此同时具有担任组长三个特征的专家是丙。表格如下：\n\u003cimg data-k=\"a427bbe59301\" style=\"max-width:479px\">\n故正确答案为C。","no":98,"missingImage":false},{"qid":"4651553","cat":"逻辑判断","stem":"麦子大约在五千年前由西亚传入中国，但由麦子做成的面食直到唐宋时期才成为北方人的主食。在此之前，北方的主粮是粟，也就是小米。秦汉时期的老百姓很不愿意种麦子，汉朝曾为增加粮食产量两次大力推广种麦子，但老百姓并没有积极响应。\n以下哪项如果为真，最能解释上述历史现象？","options":{"A":"外来作物很多，除了麦子，还有番薯、胡麻等，不是每种作物一传入就被接受","B":"磨粉技术传播较晚，东汉时只有官宦人家才拥有上下两扇带有磨齿的磨盘","C":"麦粒直接煮成的“麦饭”生硬难咽、口感很差，秦汉时期的绝大多数人都不爱吃","D":"东汉以后磨盘磨粉和“热汤饼”等面食技术逐渐推广开来，麦子才变得“好吃”了"},"answer":"C","explanation":"第一步：找出题干矛盾。\n秦汉时期的老百姓很不愿意种麦子，汉朝曾两次大力推广种麦子，但老百姓并没有积极响应。\n第二步：逐一分析选项。\nA项：该项说的是有些外来作物并不能马上被接受，但是汉朝已经两次大力推广了，为什么还是不能被接受，不能解释题干矛盾，排除；\nB项：该项说的是东汉时期只有官宦人家才能将麦子磨粉，那在麦子不能被磨粉时，为什么老百姓不愿意种植，选项并没有明确说明，不能解释题干矛盾，排除；\nC项：该项说的是由麦粒直接煮成的“麦饭”口感很差，秦汉时期的绝大多数人都不爱吃，因为麦粒不好吃所以不种麦子，可以解释即使国家大力推广，老百姓也不积极响应的原因，可以解释题干矛盾，当选；\nD项：该项说的是麦子从东汉以后因为磨盘磨粉和面食技术才变得好吃，题干要解释的矛盾点是为什么国家推广也不种，C项很直接地说明因为不好吃，所以不种；D项在解释怎么才变得“好吃”，没有C项直接，排除。\n故正确答案为C。","no":99,"missingImage":false},{"qid":"4651733","cat":"逻辑判断","stem":"近年来，某小区流浪猫泛滥成灾。去年年初该小区的物业对流浪猫进行了绝育处理。然而在今年年初，业主们发现该小区流浪猫的数量至少有去年年初的1.5倍之多。\n以下哪项如果为真，最能解释上述现象？","options":{"A":"该小区多年来环境保护良好，有许多鸟类在此栖息，流浪猫极易获得食物","B":"该小区少数业主去年成立了爱猫小组，定期在该小区投放食物喂养流浪猫","C":"该小区有一些养宠物猫的租户今年退租后，将宠物猫遗弃在小区内","D":"该小区紧邻其他大型小区，流浪猫可以在这些小区间自由流动"},"answer":"D","explanation":"第一步：找出题干矛盾。\n去年年初该小区的物业对流浪猫进行了绝育处理，但今年年初该小区流浪猫的数量至少有去年年初的1.5倍之多。\n第二步：逐一分析选项。\nA项：该小区多年来环境保护良好，流浪猫极易获得食物，可以解释为什么多年来该小区有流浪猫，但是无法解释为什么去年年初对流浪猫进行绝育处理后，今年年初流浪猫的数量至少有去年年初的1.5倍之多，不能解释题干矛盾，排除；\nB项：业主成立爱猫小组，投放食物，可以解释为什么该小区有流浪猫，但是无法解释为什么去年年初对流浪猫进行绝育处理后，今年年初流浪猫的数量至少有去年年初的1.5倍之多，不能解释题干矛盾，排除；\nC项：一些租户将宠物猫遗弃在该小区，可以解释为什么流浪猫的数量增加了，但“一些”仅是少数，无法解释为什么今年年初流浪猫的数量至少有去年年初的1.5倍之多，不能解释题干矛盾，排除；\nD项：该小区紧邻其他大型小区，流浪猫可以在小区间进行流动，说明一方面别的小区的流浪猫能流动到本小区，另一方面它们仍可以繁衍新的小猫。且“其他大型小区”体现出很有可能紧邻小区的非绝育猫咪数量不少，解释了为什么去年对本小区的流浪猫绝育，但今年年初流浪猫的数量至少有去年年初的1.5倍之多，可以解释题干矛盾，当选。\n故正确答案为D。","no":100,"missingImage":false},{"qid":"4651718","cat":"逻辑判断","stem":"教育部出台“双减”政策后，某市教育部门对中小学课外补习制定了具体规定：针对义务教育阶段的学科类补习只能在工作日晚上9点之前进行，周末可以进行艺术类补习。\n根据上述陈述，以下哪项陈述的情况违反了该市教育部门的规定？","options":{"A":"四年级同学小明在周三放学之后参加了两个艺术类辅导班","B":"初三学生小红在工作日晚上九点之后仍在刻苦学习各学科知识","C":"某培训机构针对上班族推出英语口语培训班，吸引了许多学员","D":"某培训机构在国庆假期为小升初学生补上因疫情耽搁的数学课程"},"answer":"D","explanation":"逐一分析选项。\nA项：四年级同学小明在周三放学之后参加了两个艺术类辅导班，小明参加的是艺术类补习，而题干中没有说工作日晚上是否可以进行艺术类补习，因此没有违反该市教育部门的规定，排除；\nB项：初三学生小红在工作日晚上九点之后仍在刻苦学习各学科知识，小红是自己刻苦学习，并没有参加任何补习班，没有违反该市教育部门的规定，排除；\nC项：某培训机构针对上班族推出英语口语培训班，这个培训机构针对的是上班族，而不是针对的义务教育阶段的学生，没有违反该市教育部门的规定，排除；\nD项：某培训机构在国庆假期为小升初学生补上因疫情耽搁的数学课程，小升初学生是在义务教育阶段，国庆假期补习数学课程违反了学科类补习只能在工作日晚上9点之前进行的规定，当选。\n故正确答案为D。","no":101,"missingImage":false},{"qid":"4651561","cat":"类比推理","stem":"甲：这本小说太精彩了，你喜欢里面的哪个角色呢？\n乙：我对小说不感兴趣，没有读过这本小说\n以下哪项的对话与上述对话最为相似？","options":{"A":"教师：你不努力学习以后怎么能考上理想的大学呢？\n学生：我理想的大学太难考了，再努力也不一定能考上","B":"员工甲：总经理的讲话中，你认可哪些呢？\n员工乙：总经理的讲话我都赞成，我会尽全力执行讲话中的要求","C":"孩子：爸爸，夏天游泳更能锻炼身体呢，还是冬天游泳更能锻炼身体呢？\n父亲：游泳是非常好的锻炼方式，在任何时候游泳都能锻炼人","D":"商户：您上个月在我们商店购买的冰箱好用吗？\n顾客：你可能记错了，我上个月在你们店购买的是洗衣机"},"answer":"D","explanation":"第一步：分析题干逻辑关系。\n甲以“看过这本小说”为前提，问乙“喜欢哪个角色”，乙表示“没有读过这本小说”，没有直接回答甲的问题，而是对甲问题的前提进行否定。\n第二步：逐一分析选项。\nA项：教师问“不努力学习以后怎么能考上理想的大学”，学生表示“因为理想的大学太难考，再努力也不一定能考上”，是直接回答了教师的问题，没有否定问题的前提，与题干对话方式不一致，排除；\nB项：员工甲问“认可总经理的哪些讲话”，员工乙表示“都赞成”，是直接回答了员工甲的问题，没有否定问题的前提，与题干对话方式不一致，排除；\nC项：孩子问“是夏天游泳更能锻炼身体，还是冬天游泳更能锻炼身体”，父亲表示“任何时候游泳都能锻炼人”，是直接回答了孩子的问题，没有否定问题的前提，与题干对话方式不一致，排除；\nD项：商户以“购买过冰箱”为前提，问顾客“是否好用”，顾客表示“购买的不是冰箱，而是洗衣机”，没有直接回答商户的问题，而是对商户问题的前提进行否定，与题干对话方式一致，当选。\n故正确答案为D。","no":102,"missingImage":false},{"qid":"4651711","cat":"逻辑判断","stem":"张先生的孩子简直就是一个“麻烦制造者”，在学校上课经常与身旁同学交头接耳，不时还与老师唱反调；在家里边写作业边听音乐，不到10分钟就又开始上蹿下跳；批评两句他根本不放在心上，反而嘻皮笑脸对你做个鬼脸。张先生觉得自家的孩子浑身上下到处是缺点，对他的未来充满了焦虑。\n以下哪项如果为真，最有助于缓解张先生目前的焦虑？","options":{"A":"每个孩子都有自己的行为和性格特点，这些特点可能与其父母或他人不尽相同，但不一定是真正的缺点","B":"孩子思维活跃、行动自在，敢于打破常规、表达自我，恰恰是其充满活力、有创新潜能的表现","C":"孩子不把家长批评放在心上，是因为在他们看来，家长的批评实际上是关心爱护自己的表现","D":"如果孩子过于安静，不喜欢结交同学，对家长的批评总保持沉默，家长也会感到焦虑"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：张先生觉得自家的孩子浑身上下到处是缺点，对他的未来充满了焦虑。\n论据：张先生的孩子简直就是一个“麻烦制造者”，在学校上课经常与身旁同学交头接耳，不时还与老师唱反调；在家里边写作业边听音乐，不到10分钟就又开始上蹿下跳；批评两句他根本不放在心上，反而嘻皮笑脸对你做个鬼脸。\n论点说的是张先生因觉得孩子充满缺点而对其未来充满焦虑，论据说的是孩子的一些表现，二者均讨论孩子充满缺点，话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：说的是孩子与他人不同的特点不一定是真正的缺点，但孩子与他人不同的特点是否会影响孩子未来的发展并不清楚，不明确选项，无法削弱，排除；\nB项：说的是孩子的表现从另一个角度看恰恰是优点，说明孩子并非充满缺点，进而也无须对其未来充满焦虑，直接削弱论点，可以削弱，当选；\nC项：说的是孩子为什么不把家长批评放在心上，只解释了孩子其中一个缺点的形成原因，与张先生对孩子未来充满焦虑无关，无法削弱，排除；\nD项：说的是即使孩子的表现与现在完全相反，张先生也会焦虑，但不能明确说明目前孩子的表现张先生是否会对其未来充满焦虑，二者话题不一致，无关项，无法削弱，排除。\n故正确答案为B。","no":103,"missingImage":false},{"qid":"4651712","cat":"逻辑判断","stem":"青山村山清水秀，环境优美，村民们在村委会带领下规划自己的美好未来。他们计划：\n（1）如果兴建葡萄庄园或修建民宿，就要开发乡村旅游；\n（2）如果发展水产养殖或开发乡村旅游，则要修建民宿；\n（3）如果不兴建葡萄庄园，就发展水产养殖；\n（4）如果开发乡村旅游，则要改造村容村貌。\n如果上述计划得以实施，可以得出以下哪项？","options":{"A":"青山村会兴建葡萄庄园","B":"青山村会改造村容村貌","C":"青山村不会修建民宿","D":"青山村不会发展水产养殖"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）兴建葡萄庄园 或 修建民宿\u003cimg data-k=\"508f0e7dbbe5\">开发乡村旅游；\n（2）发展水产养殖 或 开发乡村旅游\u003cimg data-k=\"508f0e7dbbe5\">修建民宿；\n（3）\u003cimg data-k=\"e752a8ae1a16\">兴建葡萄庄园\u003cimg data-k=\"508f0e7dbbe5\">发展水产养殖；\n（4）开发乡村旅游\u003cimg data-k=\"508f0e7dbbe5\">改造村容村貌。\n第二步：根据题干条件进行推理。\n解题思路一：\n题干信息较多没有明显推理起点，可从最大信息入手，条件（1）、（2）、（4）均提到了开发乡村旅游，故从开发乡村旅游这个最大信息开始假设。\n假设开发乡村旅游，依据条件（2），或关系一真即真，可得：修建民宿。再依据条件（1），或关系一真即真，可得：开发乡村旅游。开发乡村旅游是对条件（4）的肯前，可得：改造村容村貌。此种假设（开发乡村旅游）与题干信息均无矛盾。\n假设不开发乡村旅游，这是对条件（1）的否后，可得：\u003cimg data-k=\"e752a8ae1a16\">兴建葡萄庄园 且 \u003cimg data-k=\"e752a8ae1a16\">修建民宿。\u003cimg data-k=\"e752a8ae1a16\">兴建葡萄庄园是对条件（3）的肯前，可得：发展水产养殖。再依据条件（2），或关系一真即真，可得：修建民宿，此时与已推出的不修建民宿的信息矛盾，所以第二种假设（不开发乡村旅游）不成立。\n综上所述，开发乡村旅游一定成立，开发乡村旅游是对条件（4）的肯前，可得：改造村容村貌，因此，B项可以推出。\n解题思路二：\n条件（1）、（3）均提到“兴建葡萄庄园”，且一个是肯定一个是否定，可优先从是否兴建葡萄庄园进行假设。\n假设“兴建葡萄庄园”，依据条件（1）可知，“开发乡村旅游”成立，结合条件（2）、（4）可知，“修建民宿”和“改造村容村貌”也成立；\n假设“不兴建葡萄庄园”，依据条件（3）可知，“发展水产养殖”成立，结合条件（2）可知，“修建民宿”成立，根据条件（1）、（4）可知，“开发乡村旅游”、“改造村容村貌”也成立；\n综上所述，无论是否兴建葡萄庄园，“开发乡村旅游”“修建民宿”“改造村容村貌”一定成立，因此，B项可以推出。\n故正确答案为B。","no":104,"missingImage":false},{"qid":"4651745","cat":"逻辑判断","stem":"某游戏公司规定，登录游戏必须实名验证，未成年人每天最多只能在线100分钟，晚上8点至次日上午6点不能使用。然而，后台的账户登录数据显示，规定实施后，未成年人账户登录游戏的平均时长与之前相比增加了15％。\n以下哪项如果为真，最能解释上述现象？","options":{"A":"规定实施后，许多家长通过为孩子注册未成年人账户来限制其长时间玩游戏","B":"许多未成年人通过购买成年人账号或者使用其父母账号登录游戏","C":"未成年人有逆反心理，新规定反而刺激了他们在节假日过度玩游戏","D":"规定实施后，公司推出在线满90分钟送装备活动，吸引了许多购买力不强的玩家"},"answer":"C","explanation":"第一步：找出题干矛盾。\n登录游戏必须实名验证，未成年人每天最多只能在线100分钟，但后台的账户登录数据显示，规定实施后，未成年人账户登录游戏的平均时长与之前相比增加了15％。\n第二步：逐一分析选项。\nA项：许多家长为孩子注册未成年人账户限制其游戏时长，说明家长在限制孩子游戏的时间，无法解释为何实名验证后未成年人账户登录时长增加，不能解释题干矛盾，排除；\nB项：许多未成年人购买成年人账号或使用父母账号登录游戏，说明他们登录游戏的账户是成年人账户，但是题干说的是未成年人账户的使用情况，不能解释题干矛盾，排除；\nC项：在新规之后，未成年人在节假日会过度游戏，即在节假日未成年人账户登录时长增加，可以导致未成年人账户登录游戏的平均时长比之前增加，可以解释题干矛盾，当选；\nD项：规定实施后，新活动吸引许多购买力不强的玩家，但购买力不强的玩家不明确是否一定是未成年人，也可能是很多不喜欢在游戏中充值的成年人，不能解释题干矛盾，排除。\n故正确答案为C。","no":105,"missingImage":false},{"qid":"4651573","cat":"定义判断","stem":"闲置经济：指将一些还有使用价值但闲置未用的物品，以较低的价格通过网络平台进行交易的经济现象。\n下列属于闲置经济的是：","options":{"A":"某品牌电器官网举办以旧换新活动，孔女士便把家里用了三年的电磁炉寄去换了一台新款，比直接购买省了一半的钱","B":"每到毕业季，大学生就会在操场、寝室门口等校园网上公布的位置摆摊设点，将自己的专业书籍低价转让给学弟学妹","C":"近年来，老陈在网上买到了不少便宜货，如老旧缝纫机、修鞋机、磅秤等，他用这些别人眼中的废品做成了再生艺术品","D":"小佳在社交平台看到了一则北方小镇遭受雪灾的消息，就将自己前些年穿过的厚衣物寄给平台，统一消毒后发往灾区"},"answer":"C","explanation":"第一步：找出定义关键词。\n“一些还有使用价值但闲置未用的物品”、“以较低的价格”、“通过网络平台进行交易”。\n第二步：逐一分析选项。\nA项：孔女士用于置换的物品是家里用了三年的电磁炉，不清楚该电磁炉是否为闲置未用的物品，不符合“一些还有使用价值但闲置未用的物品”，电磁炉以旧换新的活动并非是直接以低价进行交易，也不符合“以较低的价格进行交易”，不符合定义，排除；\nB项：大学生只是通过网上公布的位置摆摊设点，但是实际交易的时候应该是在摊点通过线下的方式，不符合“通过网络平台进行交易”，不符合定义，排除；\nC项：老陈在网上买到了便宜货，符合“通过网络平台进行交易”，也符合“以较低的价格”，且在别人眼中是废品，但是老陈用它们做成了再生艺术品，说明在别人眼里是闲置未用的物品，但对老陈有用，符合“一些还有使用价值但闲置未用的物品”，符合定义，当选；\nD项：小佳将自己前些年穿过的厚衣物寄给平台，属于向灾区的捐赠行为，不属于交易，不符合“以较低的价格”，也不符合“通过网络平台进行交易”，不符合定义，排除。\n故正确答案为C。","no":106,"missingImage":false},{"qid":"4651577","cat":"定义判断","stem":"信用联动奖惩：指有关部门或组织在法定范围内根据企业、个人信用记录，采取部门联动、社会协同等方式，对其依法联合实施奖励或惩戒的行为。\n下列属于信用联动奖惩的是：","options":{"A":"某市设立了无偿献血“五星级志愿者”、志愿服务终身荣誉奖，获奖市民可以免除市管公园门票，免费乘坐市内公交车，享受市属公立医院诊察费半价优惠","B":"餐馆老板李先生在当地政务服务网提交了经营性临时占道申请，由于其信用等级为A级，可以享受审批绿色通道，第二天就收到了城管和其他相关部门的许可短信","C":"阮先生在承租的公租房里开设棋牌室，违背了申请公租房时的诚信承诺，被住房保障部门扣罚了住房保证金，并纳入五年内不得申请公租房的名单。阮先生对自己的失信行为深感后悔，保证以后一定做一个诚信公民","D":"某区政府接到媒体举报，辖区内一超市以次充好，将普通猪肉当黑猪肉售卖，区政府立即召集市场监管、税务等职能部门赶到超市，现场联合办公，对相关责任人进行查处"},"answer":"B","explanation":"第一步：找出定义关键词。\n“根据企业、个人信用记录”、“部门联动、社会协同”、“依法联合实施奖励或惩戒”。\n第二步：逐一分析选项。\nA项：根据无偿献血的志愿行为来实施奖励，不符合“根据企业、个人信用记录”，不符合定义，排除； \nB项：由于李先生的信用等级为A级，符合“根据企业、个人信用记录”，可以享受审批绿色通道，且收到城管和其他相关部门的许可短信，符合“部门联动、社会协同”，也符合“依法联合实施奖励或惩戒”，符合定义，当选；\nC项：阮先生在公租房开设棋牌室是违背了诚信承诺，符合“根据企业、个人信用记录”，扣罚住房保证金、纳入五年内不得申请公租房的名单均为惩戒手段，符合“依法联合实施奖励或惩戒”，但该行为均由住房保障部门实施，未提及其他有关部门，不符合“部门联动、社会协同”，不符合定义，排除；\nD项：市场监管、税务等职能部门联合办公，符合“部门联动、社会协同”，但以次充好，将普通猪肉当黑猪肉售卖，属于不诚信经营的行为，并未提及商家的信用记录，不符合“根据企业、个人信用记录”，不符合定义，排除。\n故正确答案为B。","no":107,"missingImage":false},{"qid":"4651556","cat":"定义判断","stem":"微躺青年：指面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状，而在专注于本职工作的同时，合理调整工作方向，追求自我价值实现的年轻人。\n下列属于微躺青年的是：","options":{"A":"设计师小谭研究生毕业后，因与投资人理念不合，离开了加盟三年的设计公司到外地改做陶瓷设计。最艰难的时候，天天工作到深夜，终于设计出大受市场欢迎的产品，实现了大学以来的梦想","B":"随着新冠肺炎疫情防控形势好转，各地游客都明显增多，商家纷纷推出低价游，抢占旅游市场。小李把自己的旅行社转让出去后，开始在网络上进行家乡景点直播，很快就成为直播达人，带动了家乡旅游产业的发展","C":"今年大学毕业的小柳投递了许多份求职信，但都石沉大海。索性在网上当起了自律监督师，每天要定十几个闹钟，最多同时监督20多个人。刚开始觉得工作枯燥乏味，但现在已经收到了数百条好评，让他很有成就感","D":"小何毕业后一直在互联网公司工作，公司内部竞争压力很大，常常加班到深夜。虽然收入十分可观，但他觉得高强度工作损害了身心健康，决定每年给自己放个小长假"},"answer":"A","explanation":"第一步：找出定义关键词。\n“面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状”、“专注于本职工作的同时，合理调整工作方向”、“追求自我价值实现”。\n第二步：逐一分析选项。\nA项：设计师小谭离开原来的设计公司后并没有消极接受现状，而是调整了工作方向，改做陶瓷设计，符合“面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状”、“专注于本职工作的同时，合理调整工作方向”，经过不懈努力，设计的产品获得市场欢迎，最终实现了自身的梦想，符合“追求自我价值实现”，符合定义，当选；\nB项：商家纷纷推出低价游，抢占旅游市场，小李把自己的旅行社转让出去后，在网络上进行家乡景点直播，符合“面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状”，但小李是迫于市场的压力转出了旅行社，改做网络直播，不符合“追求自我价值实现”，不符合定义，排除；\nC项：大学刚毕业的小柳投递的许多份求职信石沉大海，于是在网上当起了自律监督师，符合“面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状”，但没有体现专注本职工作及工作方向上的调整，不符合“专注于本职工作的同时，合理调整工作方向”，不符合定义，排除；\nD项：在互联网公司工作的小何由于工作强度高，决定每年给自己放个小长假，符合“面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状”，但放小长假不属于工作方向上的调整，不符合“专注于本职工作的同时，合理调整工作方向”，不符合定义，排除。\n注：本题正确率很低，粉笔通过多次教研并查询原文，如下图所示：\n1.A项是微躺青年的典型案例，而且A项在原文的基础上最后加了“实现大学以来的梦想”，更符合定义关键词“自我价值实现”；\n2.有同学质疑A项“天天工作到深夜”根本不微躺，但是注意A项说“最艰难的时候”，并不是每天都卷；\n3.ACD这三个选项都是“大学毕业/研究生毕业”，都能够体现出“青年、年轻人”，而B项只是说“小李”，身份不明确，这个点也不如A项。\n\u003cimg data-k=\"4b15bb0cc14f\" style=\"max-width:700px\">\n故正确答案为A。","no":108,"missingImage":false},{"qid":"4651710","cat":"定义判断","stem":"积极性休息：指工作、学习、运动过程中为降低强度、消除疲劳而主动变换形式或内容的调节方式。\n下列属于积极性休息的是：","options":{"A":"小亮昨天晚上从健身房回到家中，进门就躺倒在床上，醒来时已经是早上八点","B":"小郑周末接到两个朋友电话，只好放下手里的活儿，跟他们到远郊爬了一天的山","C":"疫情期间天天上网课，小丁每次听到枯燥的内容，就会偷偷地拿出手机听听音乐","D":"讲座持续了两个多小时，口干舌燥的主讲人插播了一段案例小视频，现场气氛轻松起来，自己也感觉好了许多"},"answer":"D","explanation":"第一步：找出定义关键词。\n“工作、学习、运动过程中”、“为降低强度、消除疲劳”、“主动变换形式或内容的调节方式”。\n第二步：逐一分析选项。\nA项：小亮昨天晚上从健身房回家后休息到第二天早上八点，不是健身过程中的休息，而是健身结束以后，不符合“工作、学习、运动过程中”，不符合定义，排除；\nB项：小郑接到朋友电话后只好放下手里的工作去爬山，小郑不是主动选择的休息，而是被动接受了朋友的邀请，不符合“主动变换形式或内容的调节方式”，不符合定义，排除；\nC项：小丁在上网课时听到枯燥的内容会拿出手机听音乐，不是因为课程强度大、学习疲劳，而是因为课程内容枯燥，不符合“为降低强度、消除疲劳”，不符合定义，排除；\nD项：讲座持续了两个多小时，主讲人已经口干舌燥，所以插播了一段小视频，缓解了自己的疲劳，现场气氛也轻松起来，符合“工作、学习、运动过程中”、“为降低强度、消除疲劳”、“主动变换形式或内容的调节方式”，符合定义，当选。\n故正确答案为D。","no":109,"missingImage":false},{"qid":"4651723","cat":"定义判断","stem":"网约护士服务：指经过官方许可，以“线上申请、线下服务”的方式，为老弱病残孕等行动不便的人上门提供慢病管理、康复护理或专项护理等延续性的便捷服务。\n下列不属于网约护士服务的是：","options":{"A":"谭女士因治疗原因留置了PICC管，每周需要更换一次贴膜，家住得比较远，每次去医院换膜都要耗费大量时间。家人在线下单预约后，医院护士准备好护理用品，到谭女士家中为她更换PICC管专用贴膜，同时对其家人进行了护理指导","B":"颜奶奶在医院进行了胆总管探查术，出院后需要定期进行T管维护，家属利用小程序预购了医院护理服务。接到订单后，肝胆外科护士上门为颜奶奶进行T管冲洗。家属感激地说：“护士上门服务真方便，以后再也不用发愁去医院了”","C":"某民营医院最近推出了一项新的便民服务措施，慢病患者下载“医者仁心”术后护理APP，进入平台选择自己所需要的服务项目，只要详细填写服务需求，上传就医证明，完成预约后，就可以等待护士上门服务","D":"刘爷爷平时独居在家，一天因高血压晕倒，被邻居及时送到医院才脱离危险。在外工作的子女急忙回家到医院为他申请定期看护服务，护士会在每次服务后将他的健康报告上传到系统中，以便子女了解刘爷爷的健康情况"},"answer":"D","explanation":"第一步：找出定义关键词。\n“以‘线上申请、线下服务’的方式”、“为老弱病残孕等行动不便的人上门提供慢病管理、康复护理或专项护理等延续性的便捷服务”。\n第二步：逐一分析选项。\nA项：家人在线下单预约，符合“以‘线上申请、线下服务’的方式”，护士到谭女士家中为她更换PICC管专用贴膜，符合“为老弱病残孕等行动不便的人上门提供慢病管理、康复护理或专项护理等延续性的便捷服务”，符合定义，排除；\nB项：家属利用小程序预购医院护理服务，符合“以‘线上申请、线下服务’的方式”，护士上门为颜奶奶进行T管冲洗，符合“为老弱病残孕等行动不便的人上门提供慢病管理、康复护理或专项护理等延续性的便捷服务”，符合定义，排除；\nC项：慢病患者通过APP选择服务项目，符合“以‘线上申请、线下服务’的方式”，之后护士会上门服务，符合“为老弱病残孕等行动不便的人上门提供慢病管理、康复护理或专项护理等延续性的便捷服务”，符合定义，排除；\nD项：刘爷爷的子女到“医院”申请定期看护服务，不符合“线上申请”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":110,"missingImage":false},{"qid":"4651583","cat":"定义判断","stem":"去雇主化职业：指作为独立个体不受雇于任何雇主，依托网络平台提供商品或服务并获得相应报酬的就业形式。\n下列属于去雇主化职业的是：","options":{"A":"林先生辞职后来到南方注册了一家绿植盆景网店，在一个多月的时间里，租赁场地，筹措资金，完善平台，忙得不亦乐乎","B":"专业买手陈女士每月穿梭在世界各地，寻找带有当季流行元素或者可能在国内热卖的款式和品牌服装，并将其带回国内","C":"小李加入了一个微信群，里面提供了许多可兼职工作的岗位，经过一番挑选，他选择了一份帮忙代取快递的兼职，用赚来的钱贴补每月生活费","D":"喜欢写作的大二学生小孟在某平台网文写手的影响下，也开始在这家平台上更新写的小说，得到了许多粉丝的打赏，他很有成就感"},"answer":"D","explanation":"第一步：找出定义关键词。\n“作为独立个体不受雇于任何雇主”、“依托网络平台提供商品或服务”、“获得相应报酬”。\n第二步：逐一分析选项。\nA项：林先生辞职后注册网店提供绿植盆景，符合“作为独立个体不受雇于任何雇主”、“依托网络平台提供商品或服务”，但未体现出获得报酬，不符合“获得相应报酬”，不符合定义，排除；\nB项：陈女士把服装从世界各地带回国内，但未体现出是否依托网络平台售卖，是否获得报酬，不符合“依托网络平台提供商品或服务”、“获得相应报酬”，不符合定义，排除；\nC项：小李通过微信群找到代取快递的兼职，不符合“作为独立个体不受雇于任何雇主”，不符合定义，排除；\nD项：小孟依托网络平台更新写的小说，符合“作为独立个体不受雇于任何雇主”、“依托网络平台提供商品或服务”，且得到了许多粉丝的打赏，符合“获得相应报酬”，符合定义，当选。\n故正确答案为D。","no":111,"missingImage":false},{"qid":"4651580","cat":"定义判断","stem":"鲜活性效应：指重在依据自己耳闻目睹的具体个案而不是权威性、科学性信息做出选择的现象。\n下列不属于鲜活性效应的是：","options":{"A":"众所周知，飞机的事故率在所有交通工具中是最低的。但是李先生在电视上看到一则民航客机失事的新闻后，再也没有乘坐过飞机","B":"小罗看中了某知名品牌的洗衣机，正打算付款，一个好朋友打来电话告诉她，自家这个牌子的洗衣机经常出故障，小罗当场放弃了购买计划","C":"王大伯非常注重养生，本来滴酒不沾，后来他看到80岁高龄的邻居老赵每天都要小酌几杯，身体一直很好。于是，他逐渐不再刻意回避喝酒","D":"小缪常用的视频网站总是会给她推送某品牌的按摩椅，父亲节的时候小缪想给父亲送按摩椅当礼物，就登录该品牌的官网购买"},"answer":"D","explanation":"第一步：找出定义关键词。\n“依据自己耳闻目睹的具体个案”。\n第二步：逐一分析选项。\nA项：李先生决定不再乘坐飞机的依据是从新闻里看到了一则民航客机失事的新闻，符合“依据自己耳闻目睹的具体个案”，符合定义，排除； \nB项：小罗决定不买该品牌洗衣机的依据是听说好朋友家里那个该品牌的洗衣机质量不好，符合“依据自己耳闻目睹的具体个案”，符合定义，排除；\nC项：王大伯决定不再刻意回避喝酒的依据是看到某个邻居每天小酌并且身体一直很好，符合“依据自己耳闻目睹的具体个案”，符合定义，排除；\nD项：小缪决定购买官网中按摩椅的依据是常用的视频网站经常推送该品牌的按摩椅，但没有提及视频网站的推送视频是否是利用个案来宣传，不符合“依据自己耳闻目睹的具体个案”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":112,"missingImage":false},{"qid":"4651716","cat":"定义判断","stem":"信息瀑布：指现实生活中，当受到前人信息的影响时，放弃自己原有的想法，跟着他人选择的现象。\n下列属于信息瀑布的是：","options":{"A":"小李从单位离职后在家里呆了一段时间，上个月他发现了几份适合自己的工作，就分别递交了求职信。这几天收到了多封邮件，招聘单位大都以他失业太久为理由而拒绝了他","B":"公司去陌生小镇组织团建活动，午餐时看到街边的一排小餐馆，不爱吃辣的胡先生纠结了一会，最终还是跟着几位湖南同事进了一家湘菜馆","C":"消费者们通常认为十多年前的服装款式已经过时，但经过时装周推广、明星带货，那些款式往往又会成为新的时尚，重新受到追捧","D":"某家具厂的一款外壳酷似史前巨型昆虫的黑色办公椅，全厂上下都觉得像是用回收垃圾做的，对它的市场前景表示悲观，却意外地受到了办公人士的喜爱，最终成了该厂建厂以来最畅销的椅子"},"answer":"C","explanation":"第一步：找出定义关键词。\n“当受到前人信息的影响时”、“放弃自己原有的想法，跟着他人选择的现象”。\n第二步：逐一分析选项。\nA项：招聘单位拒绝小李的理由是他失业太久，做出该决定并没有受到前人的影响，不符合“当受到前人信息的影响时”，不符合定义，排除；\nB项：不爱吃辣的胡先生是自己纠结午餐吃什么，并未体现出同事对他的影响，不符合“当受到前人信息的影响时”，不符合定义，排除；\nC项：消费者们受到时装周和明星的影响，重新接受了之前认为过时的服装，符合“当受到前人信息的影响时”、“放弃自己原有的想法，跟着他人选择的现象”，符合定义，当选；\nD项：该家具厂的办公椅意外地受到办公人士的喜爱，没有体现全厂员工和这些办公人士的选择受到前人信息的影响，不符合“当受到前人信息的影响时”，不符合定义，排除。\n故正确答案为C。","no":113,"missingImage":false},{"qid":"4651732","cat":"定义判断","stem":"自发性秩序：指在特定群体中存在的由众人行为自发形成并对个体成员具有内在影响或约束的社会习惯。\n下列不属于自发性秩序的是：","options":{"A":"某县是远近闻名的武术之乡，老老少少都会个一招半式","B":"来中国不久，娅妮很快就学会了用“吃了吗”和别人打招呼","C":"早高峰时段的路口车水马龙，没有一辆私家车占用公交专用车道","D":"某村多年以来形成了孝敬老人的风气，小辈和长辈吵架会被全村人看不起"},"answer":"C","explanation":"第一步：找出定义关键词。\n“由众人行为自发形成”、“对个体成员具有内在影响或约束的社会习惯”。\n第二步：逐一分析选项。\nA项：武术之乡的老老少少都会个一招半式，符合“由众人行为自发形成”，其中的单个人会个一招半式，符合“对个体成员具有内在影响或约束的社会习惯”，符合定义，排除；\nB项：中国人用“吃了吗”和别人打招呼，符合“由众人行为自发形成”，娅妮受此影响很快学会这种打招呼的方式，符合“对个体成员具有内在影响或约束的社会习惯”，符合定义，排除；\nC项：私家车不在早高峰时段占用公交专用车道是交通法规的要求，不符合“由众人行为自发形成”，不符合定义，当选；\nD项：某村形成孝敬老人的风气，符合“由众人行为自发形成”，小辈和长辈吵架会被全村人看不起，符合“对个体成员具有内在影响或约束的社会习惯”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":114,"missingImage":false},{"qid":"4651755","cat":"定义判断","stem":"网络考古：指针对多年前网络上发布的各种文字、图片、影像等资料，重新查看或考证，从中发现有价值的信息。\n下列属于网络考古的是：","options":{"A":"为了写一篇回忆大学生活的散文，王先生把十多年前在社交软件上的好友、大学图书馆的借书记录、当年在各种网站的帖文都翻了出来","B":"小吴夫妇很细心，从孩子出生前的每次产前检查，到出生时测量的数据建档、医学证明，再到数码相机里面每次留下的成长照片，都储存在了网络云相册里","C":"程序员小陆从公司报废的硬盘中恢复出了公司内部的宣传资料、业务调整、人员变更等文档，交给了公司有关部门","D":"多年前，网络上进行了一场“三星堆起源”的大辩论，吸引了几十万人围观留言。辩论的参与者老张回想起当年的唇枪舌剑，感慨万千"},"answer":"A","explanation":"第一步：找出定义关键词。\n“针对多年前网络上发布的各种文字、图片、影像等资料”、“重新查看或考证”、“从中发现有价值的信息”。\n第二步：逐一分析选项。\nA项：该项说的是王先生为了写一篇回忆大学生活的散文，把当年在各种网站的帖文都翻了出来，说明王先生重新查看了这些帖文，符合关键词“针对多年前网络上发布的各种文字、图片、影像等资料”、“重新查看或考证”，符合定义，当选；\nB项：该项说的是小吴夫妇将孩子的产前检查、数据建档、医学证明、成长照片等资料储存在网络云相册里，并没有体现重新查看或考证这些资料，不符合关键词“重新查看或考证”，不符合定义，排除；\nC项：该项说的是程序员小陆从公司报废的硬盘中恢复出了公司内部的资料，从硬盘中恢复的公司内部资料不属于网络上的资料，不符合关键词“针对多年前网络上发布的各种文字、图片、影像等资料”，不符合定义，排除；\nD项：该项说的是老张回想起多年前的“三星堆起源”大辩论，并没有体现老张重新查看或考证有关该辩论的资料，不符合关键词“重新查看或考证”，不符合定义，排除。\n故正确答案为A。","no":115,"missingImage":false}]}],"count":50,"answerable":50,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2021年1—7月，某市累计客运量97638万人，同比增长40.8%。其中，公共汽电车客运量37465万人、增长33.4%；轨道交通客运量55863万人，增长46.7%；出租车客运量4175万人、增长36.5%；轮渡客运量135万人、增长42.1%。2021年1—6月，出租车客运量分别为576万人、472万人、659万人、666万人、651万人和630万人。\u003c/p>\u003cp>\u003cimg data-k=\"9ba3669acf34\" style=\"max-width:600px\">\u003c/p>","questions":[{"qid":"4651656","cat":"平均数","stem":"2021年一季度，该市公共汽电车月平均客运量是：","options":{"A":"5223万人","B":"5568万人","C":"5612万人","D":"5911万人"},"answer":"A","explanation":"根据题干“2021年一季度······月平均······”，结合材料时间为2021年，可判定本题为现期平均数问题。定位统计图可得，2021年1—3月该市公共汽电车客运量分别为5782万人、4564万人、5324万人。则2021年一季度该市公共汽电车月平均客运量\u003cimg data-k=\"0ee072c18932\">\u003cimg data-k=\"5a6e3a890147\">万人。\n故正确答案为A。","no":116,"missingImage":false},{"qid":"4651658","cat":"增长","stem":"2021年1—7月，该市客运量增速最大的客运方式是：","options":{"A":"公共汽电车","B":"轨道交通","C":"出租车","D":"轮渡"},"answer":"B","explanation":"定位文字材料可知：2021年1—7月公共汽电车客运量增长33.4%，轨道交通客运量增长46.7%，出租车客运量增长36.5%，轮渡客运量增长42.1%。其中轨道交通客运量增速最大。\n故正确答案为B。","no":117,"missingImage":false},{"qid":"4651659","cat":"比重","stem":"2021年上半年，该市轨道交通客运量占全市客运量比重最大的月份是：","options":{"A":"3月","B":"4月","C":"5月","D":"6月"},"answer":"A","e \"f80e42161cca\">）高于1—7月同比增速（46.7%），可判定7月同比增速应小于1—7月同比增速（46.7%），错误；\nC项：定位文字材料第一段可得：2021年1—7月，某市······公共汽电车客运量37465万人、增长33.4%。根据公式：基期量\u003cimg data-k=\"eb4ccfb62ef4\">，2020年1—7月，该市公共汽电车客运量为\u003cimg data-k=\"4026c5fed8b6\">\u003cimg data-k=\"82357140d850\">万人，超过25000万人，错误；\nD项：定位统计图可得：2021年6月，该市轨道交通客运量为8357万人，公共汽电车客运量为5491万人。8357-5491=2866万人，多2000万人以上，正确。\n故正确答案为D。","no":120,"missingImage":false}]},{"type":"material","material":"\u003cp>        2020年江苏省实现以新产业、新业态、新模式为主要内容的“三新”经济增加值25177亿元，比上年增长5.6%，比全省地区生产总值的增速快1.5个百分点，占全省地区生产总值的比重为24.5%。全省战略性新兴产业产值增长11.0%，快于规模以上工业5.5个百分点。其中新能源汽车、数字创意、新能源和高端装备制造业的产值增速分别为21.0%、19.8%、15.6%和15.5%。高技术制造业增加值增长10.3%，占规模以上工业的比重为23.5%，提高1.7个百分点。高技术服务业营业收入增长14.1%，占规模以上服务业的比重为37.9%，提高2.4个百分点。全省碳纤维增强复合材料、新能源汽车、城市轨道车辆、集成电路、太阳能电池等新产品的产量分别增长48.9%、42.0%、24.5%、22.3%和16.5%。全省现代设施农业占地面积100.5万公顷，其中属于战略性新兴产业的中药材种植业种植面积1.8万公顷，实现产值32亿元，产值增长138.1%。全省网上零售额10602亿元，增长10.0%。其中，实物商品网上零售额增长13.9%，增速比上年快5.2个百分点，占社会消费品零售总额37086亿元的比重为24.9%，提高2.7个百分点。\u003c/p>","questions":[{"qid":"4651464","cat":"增长","stem":"2020年江苏数字创意产业产值增速比规模以上工业产值增速快：","options":{"A":"5.5个百分点","B":"10.1个百分点","C":"14.3个百分点","D":"15.5个百分点"},"answer":"C","explanation":"定位文字材料“2020年······全省战略性新兴产业产值增长11.0%，快于规模以上工业5.5个百分点。其中······数字创意······产值增速为19.8%”。则2020年规模以上工业产值增速为11.0%-5.5%=5.5%，所求差值为19.8%-5.5%=14.3%，即2020年江苏数字创意产业产值增速比规模以上工业产值增速快14.3个百分点。\n故正确答案为C。","no":121,"missingImage":false},{"qid":"4651465","cat":"平均数","stem":"2020年江苏中药材种植业平均每公顷产值为：","options":{"A":"14.4万元","B":"15.4万元","C":"16.3万元","D":"17.8万元"},"answer":"D","explanation":"根据题干“2020年江苏中药材种植业平均每公顷产值为”，结合材料时间为2020年，可判定本题为现期平均数计算问题。定位文字材料可知，2020年，属于战略性新兴产业的中药材种植业种植面积1.8万公顷，实现产值32亿元，根据平均每公顷产值\u003cimg data-k=\"0ab4f88ae3b4\">，可得2020年江苏中药材种植业平均每公顷产值\u003cimg data-k=\"b8c636bb92a0\">万元。\n故正确答案为D。","no":122,"missingImage":false},{"qid":"4651467","cat":"比重","stem":"2019年江苏“三新”经济增加值占全省地区生产总值的比重是：","options":{"A":"20.5%","B":"24.2%","C":"27.1%","D":"30.0%"},"answer":"B","explanation":"根据题干“2019年······占······的比重是”，结合材料时间为2020年，可判定本题为基期比重计算问题。定位文 <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
