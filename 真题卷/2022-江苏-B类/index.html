<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2022年江苏省公务员录用考试《行测》题（B类）（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2022-江苏-B类","title":"2022年江苏省公务员录用考试《行测》题（B类）（网友回忆版）","year":"2022","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"4651524","cat":"时事政治","stem":"党的十九届六中全会通过的《中共中央关于党的百年奋斗重大成就和历史经验的决议》。在十九大报告“八个明确”的基础上，用“十个明确”对习近平新时代中国特色社会主义思想的核心内容作了进一步概括，增加的两个“明确”的主要内容是（    ）。\n①必须坚持和完善社会主义基本经济制度\n②坚持和发展中国特色社会主义的总任务\n③中国特色大国外交要推动构建人类命运共同体\n④全面从严治党的战略方针和新时代党的建设总要求","options":{"A":"①②","B":"②③","C":"①④","D":"③④"},"answer":"C","explanation":"本题考查政治常识。\n①④正确，②③错误，《中共中央关于党的百年奋斗重大成就和历史经验的决议》在党的十九大报告“八个明确”的基础上，增加的两个“明确”，主要内容是：明确必须坚持和完善社会主义基本经济制度，使市场在资源配置中起决定性作用，更好发挥政府作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，统筹发展和安全；明确全面从严治党的战略方针，提出新时代党的建设总要求，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，落实管党治党政治责任，以伟大自我革命引领伟大社会革命。\n故正确答案为C。","no":1,"missingImage":false},{"type":"question","qid":"4651568","cat":"马克思主义","stem":"习近平总书记在全国脱贫攻坚总结表彰大会上指出：“伟大事业孕育伟大精神，伟大精神引领伟大事业。”上述重要论断蕴含的哲理是（    ）。","options":{"A":"本质是现象的根据，现象从特定方面表现事物的本质","B":"质变是量变的必然结果，质变体现和巩固量变的成果","C":"内容是事物存在的基础，形式对事物的内容具有反作用","D":"实践是认识发生和发展的基础，认识对实践有指导作用"},"answer":"D","explanation":"本题考查政治常识。\n习近平总书记在全国脱贫攻坚总结表彰大会上指出：“伟大事业孕育伟大精神，伟大精神引领伟大事业。脱贫攻坚伟大斗争，锻造形成了‘上下同心、尽锐出战、精准务实、开拓创新、攻坚克难、不负人民’的脱贫攻坚精神。”其中“伟大事业”指的是推进中国特色社会主义伟大事业，属于实践层面的内容，“伟大精神”指的是脱贫攻坚精神，属于认识层面的内容。\nA项错误，本质是事物的根本性质，是构成事物的诸要素之间的内在联系；现象是事物的外部联系和表面特征，是事物本质的外在表现。本质决定现象，本质总是通过一定的现象表现自己的存在；现象表现本质，现象的存在和变化归根到底依赖于本质。选项表述正确，但与题干无关。\nB项错误，量变是事物数量的增减和组成要素排列次序的变动，是保持事物的质的相对稳定性的不显著变化，体现了事物发展渐进过程的连续性；质变是事物性质的根本变化，是事物由一种质态向另一种质态的飞跃。量变是质变的必要准备；质变是量变的必然结果；量变和质变相互渗透、相互依存、相互贯通。选项表述正确，但与题干无关。\nC项错误，内容指构成事物的一切要素的总和；形式指把事物的内容诸要素统一起来的结构或外部表现方式。任何事物都是内容与形式的统一。内容是事物存在的基础，对形式具有决定作用；形式对内容具有反作用。适合内容的形式，对内容的发展起积极的推动作用；不适合内容的形式，对内容的发展起消极的阻碍作用。选项表述正确，但与题干无关。\nD项正确，实践在认识活动中起着决定作用：实践是认识的来源，认识的内容是在实践活动的基础上产生和发展的；实践是认识发展的动力，实践的需要推动认识的产生和发展，推动人类的科学发现和技术发明，推动人类的思想进步和理论创新。实践是认识的目的，人们通过实践获得认识，其最终目的是为实践服务，指导实践，以满足人们生活和生产的需要。实践是检验认识真理性的唯一标准，认识是否具有真理性只有在实践中才能得到验证。“伟大事业”即实践，“伟大精神”即认识，“伟大事业孕育伟大精神”体现了实践是认识发生和发展的基础，“伟大精神引领伟大事业”体现了认识对实践具有指导作用。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"4651640","cat":"新思想","stem":"习近平总书记指出：“法律是准绳，任何时候都必须遵循；道德是基石，任何时候都不可忽视。”下列古语与习近平总书记这句话的内涵相契合的是：","options":{"A":"德明而易从，法约而易行","B":"观时而制法，因事而制礼","C":"法度行则国治，私意行则国乱","D":"德礼为政教之本，刑罚为政教之用"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，该句出自《盐铁论·刑德》，意思是道德标准明确，人们就容易遵从；法律简要，人们就容易实行。与题干中总书记的话内涵不相符。\nB项错误，该句出自《战国策·赵策二》，意思是根据变化的时代来制定法令，根据具体的情况来制定礼教。强调的是法律与道德的与时俱进，与题干中习总书记的话内涵不相符。\nC项错误，该句出自《管子·明法解》，意思是法令制度能够推行，国家就能得到治理；私人不依法度，随意专断，国家就会发生祸乱。只强调了法治的重要性，与题干中总书记的话内涵不相符。\nD项正确，该句出自《唐律疏议·名例》，意思是以礼义教化作为治理国家的基本方法，而以刑罚制裁作为治理国家的辅助手段，礼仪教化与刑罚本用互补。同时强调了德礼和刑罚对政教的不可或缺。题干中习总书记这句话即在强调法治和德治不可分离，国家治理需要法律和道德协同发力，与题干中总书记的话内涵相符。\n故正确答案为D。","no":3,"missingImage":false}],"count":3,"answerable":3,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"4651641","cat":"人文常识","stem":"我国要坚持以人民为中心的发展思想，在高质量发展中促进共同富裕。下列对我国共同富裕的理解正确的是（    ）。","options":{"A":"全体人民共同富裕是一个总体概念","B":"共同富裕是人民群众的物质生活富裕","C":"共同富裕主要通过第三次分配来实现","D":"共同富裕的目标将在2035年基本实现"},"answer":"A","explanation":"本题考查政治常识。\n2021年10月16日出版的第20期《求是》杂志发表了习近平总书记的重要文章《扎实推动共同富裕》（以下简称文章）。\nA项正确，文章指出：“我总的认为，像全面建成小康社会一样，全体人民共同富裕是一个总体概念，是对全社会而言的，不要分成城市一块、农村一块，或者东部、中部、西部地区各一块，各提各的指标，要从全局上来看。”\nB项错误，文章指出：“共同富裕是社会主义的本质要求，是中国式现代化的重要特征。我们说的共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义。”\nC项错误，文章指出：“促进共同富裕总的思路是，坚持以人民为中心的发展思想，在高质量发展中促进共同富裕，正确处理效率和公平的关系，构建初次分配、再分配、三次分配协调配套的基础性制度安排，加大税收、社保、转移支付等调节力度并提高精准性，扩大中等收入群体比重，增加低收入群体收入，合理调节高收入，取缔非法收入，形成中间大、两头小的橄榄型分配结构，促进社会公平正义，促进人的全面发展，使全体人民朝着共同富裕目标扎实迈进。”\nD项错误，文章指出：“到2035年，全体人民共同富裕取得更为明显的实质性进展，基本公共服务实现均等化。到本世纪中叶，全体人民共同富裕基本实现，居民收入和实际消费水平差距缩小到合理区间。”\n故正确答案为A。","no":4,"missingImage":false},{"type":"question","qid":"4651642","cat":"法律常识","stem":"2021年8月，第十三届全国人大常委会通过的《中华人民共和国个人信息保护法》，奠定了我国网络社会和数字经济的法律之基，根据该法规定，下列不属于敏感个人信息的是：","options":{"A":"生物识别","B":"特定身份","C":"文化程度","D":"医疗健康"},"answer":"C","explanation":"本题考查法律常识。\nA、B、D三项正确，C项错误，根据《中华人民共和国个人信息保护法》第二十八条第一款规定：“敏感个人信息是一旦泄露或者非法使用，容易导致自然人的人格尊严受到侵害或者人身、财产安全受到危害的个人信息，包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息，以及不满十四周岁未成年人的个人信息。”题中，属于敏感个人信息的是生物识别、特定身份和医疗健康信息，文化程度不属于敏感个人信息。\n本题为选非题，故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"4651450","cat":"科技常识","stem":"近年来我国基础研究和原始创新取得重要进展，战略高技术领域实现新跨越。下列属于实现了战略高技术新跨越的成就是：","options":{"A":"“嫦娥五号”月球探测器实现地外天体采样返回","B":"76个光子的量子计算原型机“九章”成功问世","C":"“慧眼号”硬X射线调制望远镜直接测量到迄今宇宙最强磁场","D":"“墨子号”量子科学实验卫星实现无中继千公里级量子密钥分发"},"answer":"D","explanation":"本题考查政治常识。\n2021年5月28日，习近平总书记在北京出席中国科学院第二十次院士大会、中国工程院第十五次院士大会、中国科协第十次全国代表大会并发表讲话。\nA、B、C三项错误，习近平总书记在讲话中指出：“基础研究和原始创新取得重要进展。基础研究整体实力显著加强，化学、材料、物理、工程等学科整体水平明显提升。在量子信息、干细胞、脑科学等前沿方向上取得一批重大原创成果。成功组织了一批重大基础研究任务，‘嫦娥五号’实现地外天体采样返回，‘天问一号’开启火星探测，‘怀柔一号’引力波暴高能电磁对应体全天监测器卫星成功发射，‘慧眼号’直接测量到迄今宇宙最强磁场，500米口径球面射电望远镜首次发现毫秒脉冲星，新一代‘人造太阳’首次放电，‘雪龙2’号首航南极，76个光子的量子计算原型机‘九章’、62比特可编程超导量子计算原型机‘祖冲之号’成功问世。散裂中子源等一批具有国际一流水平的重大科技基础设施通过验收。”\nD项正确，习近平总书记在讲话中指出：“几年来，在党中央坚强领导下，在全国科技界和社会各界共同努力下，我国科技实力正在从量的积累迈向质的飞跃、从点的突破迈向系统能力提升，科技创新取得新的历史性成就······战略高技术领域取得新跨越。在深海、深空、深地、深蓝等领域积极抢占科技制高点。‘海斗一号’完成万米海试，‘奋斗者’号成功坐底，北斗卫星导航系统全面开通，中国空间站天和核心舱成功发射，‘长征五号’遥三运载火箭成功发射，世界最强流深地核天体物理加速器成功出束，‘神威·太湖之光’超级计算机首次实现千万核心并行第一性原理计算模拟，‘墨子号’实现无中继千公里级量子密钥分发。‘天鲲号’首次试航成功。‘国和一号’和‘华龙一号’三代核电技术取得新突破。”\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"4651468","cat":"科技常识","stem":"2021年10月16日，我国神舟十三号载人航天飞船发射成功，翟志刚、王亚平、叶光富三名航天员执行此次飞行任务，按照计划他们将在天和核心舱驻留半年，按照计划，他们回到地面后即将迎来的首个节气是：","options":{"A":"雨水","B":"惊蛰","C":"谷雨","D":"小满"},"answer":"C","explanation":"本题考查地理国情。\n2021年10月16日，神舟十三号载人航天飞船发射成功，计划半年回到地面，故回到地面的时间大致是2022年4月16日。\nA项错误，雨水是二十四节气中的第二个节气，通常在每年公历的2月18日-20日，表示天渐回暖，雨量增多。\nB项错误，惊蛰是二十四节气中的第三个节气，通常在每年公历的3月5日或6日，表示冬眠动物开始苏醒。\nC项正确，谷雨是二十四节气中的第六个节气，通常在每年公历的4月19日-21日，表示降水明显增多，有利于谷物生长。故按照计划，他们回到地面后即将迎来的首个节气是谷雨。\nD项错误，小满是二十四节气中的第八个节气，通常在每年公历的5月20日-22日，表示麦类作物籽粒开始饱满。\n故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"4651474","cat":"法律常识","stem":"春节燃放烟花爆竹，是我国的传统习俗，近年来，不少地方出台文件，管控烟花爆竹的燃放，但违规燃放仍屡禁不止。对此，下列说法正确的是：","options":{"A":"历史悠久的习俗凝聚了民众的正确信念","B":"法律的运行效果受到习俗的影响与制约","C":"习俗具有高度稳定性，法律无法改变习俗","D":"习俗通过道德教化来改变，不受法律调整"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，历史悠久的习俗并不都凝聚着民众正确的信念，有一些习俗是落后的、消极的。\nB项正确，法的运行受政治、经济、文化等社会因素的制约。法总是十分依赖其外部条件，其作用总是容易受到社会因素的制约。其中的主要因素有经济体制、政治体制、执法机关的工作状况、各级领导干部及普通公民的法律观、传统法律文化等等。因此法律的运行效果会受到习俗的影响和制约，这也就是即使管控烟花爆竹燃放，还是有违规燃放行为的原因。\nC项错误，有些习俗随着社会发展被法律所禁止，比如《民法典》第一千零四十一条第二款规定：“实行婚姻自由、一夫一妻、男女平等的婚姻制度。”将以往“父母之命，媒妁之言”这一习俗改变。\nD项错误，习俗若违背法律，就会受到法律的调整，比如过年燃放烟花爆竹是习俗，但被多地出台文件所禁止，例如《南京市关于禁止燃放烟花爆竹的规定》第三条规定：“在本市玄武区、秦淮区、建邺区、鼓楼区、雨花台区，栖霞区尧化、迈皋桥、马群、燕子矶、仙林街道，江宁区东山街道、江宁经济技术开发区、江宁高新技术产业园，浦口区江浦、泰山、顶山、沿江街道，以及六合区长芦、大厂街道范围内，禁止任何单位和个人销售、燃放烟花爆竹。其他禁放区域由所在区人民政府确定并公布。”\n故正确答案为B。","no":8,"missingImage":false},{"type":"question","qid":"4651644","cat":"法律常识","stem":"王某因殴打他人被处行政拘留5日。王某已离异，4岁女儿在外地。对此，公安机关恰当的做法是：","options":{"A":"将行政拘留换处罚为罚款","B":"停止执行行政拘留处罚","C":"将王某的女儿接到拘留场所便于王某照看","D":"为王某女儿安排必要的临时生活照料措施"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，行政拘留，是根据《治安管理处罚法》的规定，对当事人进行处罚的一种类型，是公安机关对违反行政法律规范的人，在短期内限制人身自由的一种行政处罚。也是最严厉的一种行政处罚，通常适用于严重违反治安管理但不构成犯罪，而警告、罚款处罚不足以惩戒的情况。因此法律对它的设定及实施条件和程序均有严格的规定，不得随意进行变更。\nB项错误，根据《治安管理处罚法》第二十一条规定：“违反治安管理行为人有下列情形之一，依照本法应当给予行政拘留处罚的，不执行行政拘留处罚：（一）已满14周岁不满16周岁的；（二）已满16周岁不满18周岁，初次违反治安管理的；（三）70周岁以上的；（四）怀孕或者哺乳自己不满1周岁婴儿的。”题中，王某不符合上述情形。\nC项错误，D项正确，将王某女儿接到拘留场所不利于其身心健康，也会扰乱拘留所工作秩序。《民法典》第三十四条第四款规定：“因发生突发事件等紧急情况，监护人暂时无法履行监护职责，被监护人的生活处于无人照料状态的，被监护人住所地的居民委员会、村民委员会或者民政部门应当为被监护人安排必要的临时生活照料措施。”故为王某女儿安排必要的临时生活照料措施符合法律规定。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"4651645","cat":"法律常识","stem":"下列行政执法文书部分内容的表述，符合《行政处罚法》等法律规定的是：","options":{"A":"某非法运营案件处罚决定书的违法事实：“非法经营客运出租汽车”","B":"某治安行政案件的物品扣押清单：“宝马3系（320）小轿车一辆”","C":"某交通事故认定书的事故地点：“312国道南京方向286公里处”","D":"某广告违法案件处罚决定书的法律依据：“依据《广告法》相关规定”"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，案件事实就是案件发生时的一切真实情况，行政处罚决定书上的案件事实表述要完整准确，包括：案件来源、违法行为发生的时间、地点、经过、情节和结果等要素。“非法经营客运出租汽车”过于简单。\nB项正确，《扣押物品清单》是指公安机关侦查人员在办案过程中依法制作的专门记载扣押物品的文书。填写时，应填清编号、物品名称、数量、单位、特征，“宝马3系（320）小轿车一辆”符合本项规定。\nC项错误，交通事故认定书，是指公安交通管理部门通过对交通事故现场勘察、技术分析和有关检验、鉴定结论，分析查明交通事故的基本事实、成因和当事人责任后所作的技术性结论。其中，交通事故地点的填写应当具体，“312国道南京方向286公里处”过于笼统。\nD项错误，根据《行政处罚法》第五十九条第一款规定：“行政机关依照本法第五十七条的规定给予行政处罚，应当制作行政处罚决定书。行政处罚决定书应当载明下列事项：（一）当事人的姓名或者名称、地址；（二）违反法律、法规、规章的事实和证据；（三）行政处罚的种类和依据；（四）行政处罚的履行方式和期限；（五）申请行政复议、提起行政诉讼的途径和期限；（六）作出行政处罚决定的行政机关名称和作出决定的日期。”作出行政处罚的依据应当具体到条款，“依据《广告法》相关规定”不符合规定。\n故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"4651709","cat":"法律常识","stem":"陈某眼镜店张贴有“验光费30元，配镜验光免费”的告示。李某验光后没有配镜，就应否付费与陈某发生争执，但最终还是付了款。李某忿忿不平，在多个微信群称陈某的眼镜店是“黑店”，王某将微信截图转发到朋友圈。对此，下列说法正确的是：","options":{"A":"李某的行为侵害了眼镜店的名誉权","B":"王某转发朋友圈的行为不构成侵权","C":"李某有权以重大误解为由，请求返还验光费","D":"陈某眼镜店的告示显失公平，不具有法律效力"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，B项错误，根据《民法典》第一千零二十四条规定：“民事主体享有名誉权。任何组织或者个人不得以侮辱、诽谤等方式侵害他人的名誉权。名誉是对民事主体的品德、声望、才能、信用等的社会评价。”第一千零二十五条第二项规定：“行为人为公共利益实施新闻报道、舆论监督等行为，影响他人名誉的，不承担民事责任，但是有下列情形之一的除外：······（二）对他人提供的严重失实内容未尽到合理核实义务；······”李某恶意造谣陈某眼镜店是“黑店”，侵害了眼镜店的名誉权。即使王某属于舆论监督，但其并未合理审核李某发送的消息，导致更多的人误解眼镜店，也构成侵权。\nC项错误，重大误解是指由于行为人在对行为的性质、对方当事人以及标的物的品种、质量、规格和数量等方面的错误认识，使行为的后果与自己的意思相悖，并造成较大损失情况下而为的民事法律行为。题中，就“验光费30元，配镜验光免费”这一告示，李某并未产生任何误解，不构成重大误解。\nD项错误，《民法典》第一百五十一条规定：“一方利用对方处于危困状态、缺乏判断能力等情形，致使民事法律行为成立时显失公平的，受损害方有权请求人民法院或者仲裁机构予以撤销。”第一百五十五条规定：“无效的或者被撤销的民事法律行为自始没有法律约束力。”首先，显失公平是指民事主体双方的权利义务不对等。题中，陈某眼镜店的告示并未使自身享受过多权利，也未使李某承担过多义务，并不显失公平。其次，即使李某付费的行为显失公平，该行为也不是陈某利用李某处于危困状态、缺乏判断能力等情形下成立的，不属于可撤销的民事法律行为。因此，李某的付费行为有效。\n故正确答案为A。","no":11,"missingImage":false},{"type":"question","qid":"4651648","cat":"人文常识","stem":"甲从乙网店购买葡萄酒，指定丙为收货人，乙网店将酒交给丁公司运输，丙收到货时发现酒瓶有破裂，经核实是运输不当所致，关于葡萄酒的损失，下列说法正确的是：","options":{"A":"甲有权要求丁公司赔偿","B":"乙网店有权要求丁公司赔偿","C":"丙有权要求乙网店赔偿","D":"丙有权要求丁公司赔偿"},"answer":"B","explanation":"本题考查法律常识。\n合同相对性是指原则上合同项下的权利义务只能赋予给当事人或加在当事人身上，合同只能对合同当事人产生拘束力，而非合同当事人不能诉请强制执行合同。\nA项错误，题中红酒的运输合同双方当事人为乙网店和丁公司，甲与乙网店之间存在买卖合同，甲不能请求丁公司承担运输不当的赔偿责任。\nB项正确，乙网店是运输合同的托运人，因丁公司原因导致红酒损失，乙网店可以请求丁公司承担运输不当的赔偿责任。\nC、D两项错误，丙并非红酒买卖合同的当事人，无权要求乙网店、丁公司承担赔偿责任。\n故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"4651480","cat":"人文常识","stem":"因家中失窃，谢某在楼道里安装了摄像头，该摄像头能拍摄到邻居胡女士家的大门，胡女士为此要求拆除，遭拒后，便将摄像头砸坏。对此，下列说法不正确的是：","options":{"A":"谢某安装摄像头无须经小区业主委员会同意","B":"谢某的行为侵害了胡女士的隐私权","C":"小区物业服务公司有权直接强行拆除摄像头","D":"胡女士应当向谢某赔偿被其破坏的摄像头"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《民法典》第二百八十六条第二款规定：“业主大会或者业主委员会，对任意弃置垃圾、排放污染物或者噪声、违反规定饲养动物、违章搭建、侵占通道、拒付物业费等损害他人合法权益的行为，有权依照法律、法规以及管理规约，请求行为人停止侵害、排除妨碍、消除危险、恢复原状、赔偿损失。”题中，业主委员会的职权在于管理涉及小区业主共同利益的事务，谢某安装摄像头的行为虽然侵犯了胡女士的隐私权，但是并未侵害小区业主共同利益，因此只需要得到胡女士的同意，而不需要得到业主委员会的同意。\nB项正确，根据《民法典》第一千零三十三条第二项规定：“除法律另有规定或者权利人明确同意外，任何组织或者个人不得实施下列行为：······（二）进入、拍摄、窥视他人的住宅、宾馆房间等私密空间；······”题中，谢某在楼道装摄像头，其监控范围涉及到邻居胡女士的大门，可能拍摄到进出胡女士房屋人员以及房屋内部分区域等胡女士的私密空间，侵犯了胡女士的隐私权。\nC项错误，根据《民法典》第九百四十二条规定：“物业服务人应当按照约定和物业的使用性质，妥善维修、养护、清洁、绿化和经营管理物业服务区域内的业主共有部分，维护物业服务区域内的基本秩序，采取合理措施保护业主的人身、财产安全。对物业服务区域内违反有关治安、环保、消防等法律法规的行为，物业服务人应当及时采取合理措施制止、向有关行政主管部门报告并协助处理。”题中，物业服务公司对于谢某的行为可以采取劝导等措施，若谢某仍不拆除，物业可以向有关部门报告，而无权直接拆除。\nD项正确，根据《民法典》第一千一百七十七条规定：“合法权益受到侵害，情况紧迫且不能及时获得国家机关保护，不立即采取措施将使其合法权益受到难以弥补的损害的，受害人可以在保护自己合法权益的必要范围内采取扣留侵权人的财物等合理措施；但是，应当立即请求有关国家机关处理。受害人采取的措施不当造成他人损害的，应当承担侵权责任。”第一百二十条规定：“民事权益受到侵害的，被侵权人有权请求侵权人承担侵权责任。”谢某的行为虽然侵犯了胡女士的隐私权，但不属于可以采取私力救济的情形，胡女士应当向谢某赔偿被其破坏的摄像头。\n本题为选非题，故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"4651471","cat":"人文常识","stem":"城市微治理就是要以“绣花功夫”来实现大城善治，这种治理理念在我国古已有之。下列古语最能体现微治理理念的是：","options":{"A":"夫祸患常积于忽微，而智勇多困于所溺","B":"利民之事，丝发必兴；厉民之事，毫末必去","C":"亲亲而仁民，仁民而爱物；治国有常，而利民为本","D":"求木之长者，必固其根本；欲流之远者，必浚其泉源"},"answer":"B","explanation":"本题考查管理常识。\n从题干可知，城市微治理理念就是要以“绣花功夫”来实现大城善治，亦即立足实际、服务群众，在细微之处着力。\nA项错误，“夫祸患常积于忽微，而智勇多困于所溺”语出欧阳修的《五代史伶官传序》，意思是祸患常常是由一点一滴极小的不良细节积累而酿成的，纵使是聪明有才能的和英勇果敢的人也多半沉溺于某种不良的嗜好中，受其迷惑而陷于困顿。表明不良的嗜好、习惯一旦养成，久而久之就会成为你本性的一部分，日后则会成为你成功的绊脚石。强调的是防微杜渐的重要性。与城市微治理理念不符。\nB项正确，“利民之事，丝发必兴；厉民之事，毫末必去”是一个典故，出自清·万斯大《周官辨非》，释义是圣人治理天下所用之道，但凡是于民有利的事情，一丝一发也要推行；于民有害之事，一毫一末也必须革除。2014年1月20日，习近平在群众路线教育实践活动第一批总结暨第二批部署会上的讲话中引用了该典故。意在告诫党员干部，不要放过与群众有关的任何细节。每一分错误，在群众那里都会加倍负担；每一分改进，也都会具备乘数效应。与城市微治理理念相符合。\nC项错误，“亲亲而仁民，仁民而爱物”出自《孟子》的《尽心章句上》，意思是亲爱亲人而仁爱百姓，仁爱百姓而爱惜万物。“治国有常，而利民为本”出自《淮南子·汜论训》，意思是治理国家有不变的法则，但最根本的是让人民获利。强调的是均是以人民为中心的思想。与城市微治理理念不符。\nD项错误，“求木之长者，必固其根本；欲流之远者，必浚其泉源”出自魏征《谏太宗十思疏》，意思是想要树木生长，一定要稳固它的根；想要泉水流得远，一定要疏通它的源泉；想要国家安定，一定要厚积道德仁义。与城市微治理理念不符。\n故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"4651649","cat":"法律常识","stem":"某木材加工厂非法占用耕地建造厂房，经土地承包经营人张某举报，当地主管部门对该厂作出行政处理决定：责令限期拆除厂房，退还土地；没收建筑物和其他设施；涉案人员移送公安机关立案侦查。该厂收到处理决定后未提出异议，超过规定期限2年仍未拆除厂房及退还土地；主管部门也未将涉案人员移送公安机关立案侦查。关于本案，下列说法不正确的是：","options":{"A":"木材加工厂违法占地建房，主管部门的行政处理决定合法","B":"木材加工厂放弃异议、逾期未拆除厂房，主管部门应申请法院强制执行","C":"当地检察机关有权向主管部门发出检察建议，督促其履行职责","D":"张某对主管部门的行政不作为行为有权提起行政诉讼"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《土地管理法》第七十七条第一款规定：“未经批准或者采取欺骗手段骗取批准，非法占用土地的，由县级以上人民政府自然资源主管部门责令退还非法占用的土地，对违反土地利用总体规划擅自将农用地改为建设用地的，限期拆除在非法占用的土地上新建的建筑物和其他设施，恢复土地原状，对符合土地利用总体规划的，没收在非法占用的土地上新建的建筑物和其他设施，可以并处罚款；对非法占用土地单位的直接负责的主管人员和其他直接责任人员，依法给予处分；构成犯罪的，依法追究刑事责任。”木材加工厂占用的土地为耕地而非建设用地，不符合土地利用总体规划，主管部门只可以要求木材加工厂拆除厂房退还土地，无权没收建筑物和其他设施。\nB项正确，根据《土地管理法》第八十三条规定：“依照本法规定，责令限期拆除在非法占用的土地上新建的建筑物和其他设施的，建设单位或者个人必须立即停止施工，自行拆除；对继续施工的，作出处罚决定的机关有权制止。建设单位或者个人对责令限期拆除的行政处罚决定不服的，可以在接到责令限期拆除决定之日起十五日内，向人民法院起诉；期满不起诉又不自行拆除的，由作出处罚决定的机关依法申请人民法院强制执行，费用由违法者承担。”木材加工厂放弃异议、逾期未拆除厂房，主管部门应申请法院强制执行。\nC项正确，根据《行政诉讼法》第二十五条第四款规定：“人民检察院在履行职责中发现生态环境和资源保护、食品药品安全、国有财产保护、国有土地使用权出让等领域负有监督管理职责的行政机关违法行使职权或者不作为，致使国家利益或者社会公共利益受到侵害的，应当向行政机关提出检察建议，督促其依法履行职责。行政机关不依法履行职责的，人民检察院依法向人民法院提起诉讼。”木材加工厂非法占用耕地属于迫害自然资源的行为，主管部门不履行申请强制执行的职责，当地检察机关可以发出检察建议。\nD项正确，根据《行政诉讼法》第十二条第一款第六项规定：“人民法院受理公民、法人或者其他组织提起的下列诉讼：（六）申请行政机关履行保护人身权、财产权等合法权益的法定职责，行政机关拒绝履行或者不予答复的。”主管部门未将涉案人员移送公安机关立案侦查，也未申请法院强制执行，没有履行保护张某财产权益的职责，属于行政不作为，张某有权提起行政诉讼。\n本题为选非题，故正确答案为A。","no":15,"missingImage":false},{"type":"question","qid":"4651651","cat":"法律常识","stem":"某面包店虽然规模不大，但在S市有较高知名度，其招牌面包被市民赞誉为“最好吃的面包”。店主觉得很自豪，便将这几个字印在包装袋上。不久，该店被市民举报，市场监管部门认定该店的宣传行为违法，作出罚款30万元的处罚决定。面包店不服，向人民法院提起行政诉讼。关于本案，下列说法不正确的是：","options":{"A":"面包店的宣传行为违反我国《广告法》","B":"面包店贬损同行商誉，构成不正当竞争","C":"市场监管部门的处罚有违过罚相当原则","D":"人民法院有权对罚款处罚作出变更判决"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国广告法》第九条规定：“广告不得有下列情形：······（三）使用“国家级”、“最高级”、“最佳”等用语；······。”故面包店将“最好吃的面包”几个字印在包装袋上违反了该条规定。\nB项错误，根据《中华人民共和国反不正当竞争法》第八条规定：“经营者不得对其商品的性能、功能、质量、销售状况、用户评价、曾获荣誉等作虚假或者引人误解的商业宣传，欺骗、误导消费者。经营者不得通过组织虚假交易等方式，帮助其他经营者进行虚假或者引人误解的商业宣传。”题中，面包店仅宣传自己的面包最好吃，未编造、传播虚假信息或者误导性信息，损害竞争对手。\nC项正确，根据《中华人民共和国广告法》第五十七条规定，使用“国家级”、“最高级”、“最佳”等用语的，由市场监督管理部门责令停止发布广告，对广告主处二十万元以上一百万元以下的罚款，情节严重的，并可以吊销营业执照，由广告审查机关撤销广告审查批准文件、一年内不受理其广告审查申请。题中，面包店老板情节较为轻微，予以30万元的罚款不符合过罚相当原则。\nD项正确，根据《中华人民共和国行政诉讼法》第七十七条规定：“行政处罚明显不当，或者其他行政行为涉及对款额的确定、认定确有错误的，人民法院可以判决变更。人民法院判决变更，不得加重原告的义务或者减损原告的权益。但利害关系人同为原告，且诉讼请求相反的除外。”市场监管部门的处罚明显不当，因此人民法院可以做出变更判决。\n本题为选非题，故正确答案为B。","no":16,"missingImage":false},{"type":"question","qid":"4651652","cat":"法律常识","stem":"市民孙某未经批准将已故父母的农村住宅进行了扩建，出售给市民江某。当地执法机关接到举报后，认定孙某扩建房屋违法，但因该房屋坐落的地块将被征收，故未作出拆除违建的处理决定。关于本案，下列说法正确的是：","options":{"A":"孙某不具有村民身份，无权继承宅基地使用权","B":"孙某与江某的房屋买卖有效，但不能办理宅基地使用权变更登记","C":"因该房屋坐落的地块将被征收，执法机关的行为合法合理","D":"孙某虽然有违法扩建行为，但仍有权获得相关的拆迁补偿"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，根据《民法典》第一千一百二十二条规定：“遗产是自然人死亡时遗留的个人合法财产。依照法律规定或者根据其性质不得继承的遗产，不得继承。”此外，根据自然资源部经商住房城乡建设部、民政部、国家保密局、最高人民法院、农业农村部、国家税务总局，对“十三届全国人大三次会议第3226号建议”作出答复，就建议中提到的“关于农村宅基地使用权登记问题”，答复明确：农民的宅基地使用权可以依法由城镇户籍的子女继承并办理不动产登记。由此可知，孙某已故父母的农村住宅，是其父母的个人合法财产，孙某可以继承。既然可以继承宅基上的住宅，那么“地随房走，房随地走”，孙某也有权继承宅基地使用权。\nB项错误，根据《国务院办公厅关于加强土地转让管理严禁炒卖土地的通知》规定：“农民的住宅不得向城市居民出售，也不得批准城市居民占用农民集体土地建住宅，有关部门不得为违法建造和购买的住宅发放土地使用证和房产证。”由此可知，孙某与江某的房屋买卖因违背国务院相关规定而无效。\nC项错误，执法机关的行为是错误的，既然孙某扩建房屋的行为违法，行政机关就应该依据法的规定作出拆除违建的处理决定，与该房屋坐落的地块是否将被征收无关。\nD项正确，根据《民法典》第一百一十七条规定：“为了公共利益的需要，依照法律规定的权限和程序征收、征用不动产或者动产的，应当给予公平、合理的补偿。”由此可知，虽然孙某的行为属于违法扩建，但是其对于原有宅基地上的合法房屋具有继承权，既然该地块要被征收，孙某就有权获得相关补偿。\n故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"4651653","cat":"法律常识","stem":"村民钱某承包的林地被依法征收。征收补偿协议规定，林木由钱某自行采伐，归钱某所有。补偿协议生效后，两名小学生在钱某承包的林地玩火导致火灾，五分之二面积的林木被烧毁。关于本案，下列说法不正确的是：","options":{"A":"钱某自行采伐林木，应当取得采伐许可","B":"因五分之二面积林木被毁，征收部门应当减少相应补偿","C":"两名小学生玩火导致火灾，其监护人应当承担赔偿责任","D":"钱某获得的征收补偿款，无需缴纳个人所得税"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国森林法》第五十六条第一款规定：“采伐林地上的林木应当申请采伐许可证，并按照采伐许可证的规定进行采伐；采伐自然保护区以外的竹林，不需要申请采伐许可证，但应当符合林木采伐技术规程。”\nB项错误，补偿协议已生效，征收部门应当按照协议将补偿款发放给钱某。林木毁损所造成的损害应由林木所有人钱某向侵权人主张。\nC项正确，根据《民法典》第一千一百八十八条第一款规定：“无民事行为能力人、限制民事行为能力人造成他人损害的，由监护人承担侵权责任。监护人尽到监护职责的，可以减轻其侵权责任。”小学生属于无民事行为能力人或限制民事行为能力人，给钱某造成的损害应由其监护人承担赔偿责任。\nD项正确，根据《个人所得税法》第二条第一款规定：“下列各项个人所得，应当缴纳个人所得税：（一）工资、薪金所得；（二）劳务报酬所得；（三）稿酬所得；（四）特许权使用费所得；（五）经营所得；（六）利息、股息、红利所得；（七）财产租赁所得；（八）财产转让所得；（九）偶然所得。”征收补偿款不属于个人所得税的范畴，无需缴纳个人所得税。\n本题为选非题，故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"4651654","cat":"法律常识","stem":"某市执法机关扣押了甲公司的一批药材，致使甲公司无法向乙公司履行合同。甲公司向人民法院提起行政诉讼，要求撤销扣押决定。经审理，法院认定扣押行为违法。因该批药已经灭失，甲公司在承担违约责任后，提起行政赔偿诉讼。关于本案，下列说法不正确的是：","options":{"A":"甲公司因药材被扣押无法履行合同不构成情势变更","B":"乙公司在两起行政诉讼中均不具有共同原告资格","C":"甲公司提起行政赔偿诉讼须经赔偿义务机关先行处理","D":"执法机关的行政赔偿范围包括甲公司承担的违约责任"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，根据《民法典》第五百三十三条规定：“合同成立后，合同的基础条件发生了当事人在订立合同时无法预见的、不属于商业风险的重大变化，继续履行合同对于当事人一方明显不公平的，受不利影响的当事人可以与对方重新协商；在合理期限内协商不成的，当事人可以请求人民法院或者仲裁机构变更或者解除合同。人民法院或者仲裁机构应当结合案件的实际情况，根据公平原则变更或者解除合同。”情势变更是指合同在履行过程中，由于发生了当事人在订立合同时无法预见的非商业风险，继续履行合同可能会使当事人一方负担明显加重。情势变更中的“情势”指合同赖以订立的客观基础事实，“变更”一般表现为超出市场波动范围重大变化，例如物价异常上涨、国家产业政策的重大调整等。题中，首先甲公司的药材被扣押不属于甲乙公司药材买卖合同赖以订立的客观基础事实，其次甲公司不是履行合同会明显不公，而是根本无法再履行合同。因此，所述事实不构成情势变更。\nB项正确，根据《行政诉讼法》第二十五条第一款规定：“行政行为的相对人以及其他与行政行为有利害关系的公民、法人或者其他组织，有权提起诉讼。”在第一个行政诉讼中，扣押这一具体行政行为的相对人和因该扣押行为受到损失的一方是甲公司，只有甲公司能作为原告。根据《国家赔偿法》第六条第一款的规定，行政赔偿的申请人包括受害的公民、法人和其他组织。在第二个行政诉讼中，只有甲公司是受害方。因此，乙公司在两起行政诉讼中均不具有共同原告资格。\nC项正确，根据《国家赔偿法》第九条规定：“赔偿义务机关有本法第三条、第四条规定情形之一的，应当给予赔偿。赔偿请求人要求赔偿应当先向赔偿义务机关提出，也可以在申请行政复议或者提起行政诉讼时一并提出。”第十四条规定：“赔偿义务机关在规定期限内未作出是否赔偿的决定，赔偿请求人可以自期限届满之日起三个月内，向人民法院提起诉讼。赔偿请求人对赔偿的方式、项目、数额有异议的，或者赔偿义务机关作出不予赔偿决定的，赔偿请求人可以自赔偿义务机关作出赔偿或者不予赔偿决定之日起三个月内，向人民法院提起诉讼。”题中，甲公司应当先向赔偿义务机关申请赔偿，只有在赔偿义务机关超过决定期限未作出决定、对决定有异议或者赔偿义务机关作出不予赔偿的决定时才可以提起行政赔偿诉讼。\nD项错误，根据《国家赔偿法》第三十六条第二至四项规定：“侵犯公民、法人和其他组织的财产权造成损害的，按照下列规定处理：（二）查封、扣押、冻结财产的，解除对财产的查封、扣押、冻结，造成财产损坏或者灭失的，依照本条第三项、第四项的规定赔偿；（三）应当返还的财产损坏的，能够恢复原状的恢复原状，不能恢复原状的，按照损害程度给付相应的赔偿金；（四）应当返还的财产灭失的，给付相应的赔偿金；”题中，执法机关只需赔偿药材损失。\n本题为选非题，故正确答案为D。","no":19,"missingImage":false},{"type":"question","qid":"4651657","cat":"法律常识","stem":"村民姜某承包了村里的果园。因铁路建设需要，征地部门在未与姜某签订征收补偿协议的情况下强制清除了果园的果树。姜某不服，申请行政复议，请求确认强制清除行为违法并赔偿损失，复议机关作出由征地部门与姜某补签补偿协议的决定，姜某不服复议决定，向人民法院提起行政诉讼。关于本案，下列说法正确的是：","options":{"A":"复议机关与征地部门是本案的共同被告","B":"复议机关的复议决定合法合理，法院应当判决维持","C":"征地部门应当赔偿姜某的损失，赔偿数额不低于补偿标准","D":"姜某应当对清除果园所造成的损失数额承担举证责任"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国行政诉讼法》第二十六条规定：“公民、法人或者其他组织直接向人民法院提起诉讼的，作出行政行为的行政机关是被告。经复议的案件，复议机关决定维持原行政行为的，作出原行政行为的行政机关和复议机关是共同被告；复议机关改变原行政行为的，复议机关是被告。复议机关在法定期限内未作出复议决定，公民、法人或者其他组织起诉原行政行为的，作出原行政行为的行政机关是被告；起诉复议机关不作为的，复议机关是被告。两个以上行政机关作出同一行政行为的，共同作出行政行为的行政机关是共同被告。”本案中，复议机关作出了由征地部门与姜某补签补偿协议的决定，改变了原行政行为，姜某不服复议决定，复议机关应作为被告。\nB项错误，根据《中华人民共和国行政诉讼法》第五十四条第一款规定：“具体行政行为证据确凿，适用法律、法规正确，符合法定程序的，判决维持。”复议机关的决定明显违法，人民法院可以做出变更判决，而不是维持。\nC项正确，根据《中华人民共和国国家赔偿法》第四条规定：“行政机关及其工作人员在行使行政职权时有下列侵犯财产权情形之一的，受害人有取得赔偿的权利：（一）违法实施罚款、吊销许可证和执照、责令停产停业、没收财物等行政处罚的；（二）违法对财产采取查封、扣押、冻结等行政强制措施的；（三）违法征收、征用财产的；（四）造成财产损害的其他违法行为。”被征收人作为赔偿权利人可以请求国家赔偿。由于赔偿与补偿指向的客体基本相同，这种赔偿的范围、标准和方式除依照《中华人民共和国国家赔偿法》的有关规定执行，赔偿的金额原则上不能低于补偿的数额。\nD项错误，根据《中华人民共和国行政诉讼法》第三十八条第二款规定：“在行政赔偿、补偿的案件中，原告应当对行政行为造成的损害提供证据。因被告的原因导致原告无法举证的，由被告承担举证责任。”本案中，果树已经被强制清除，姜某无法举证，应当由被告承担举证责任。\n故正确答案为C。","no":20,"missingImage":false}],"count":17,"answerable":17,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        我们习惯了出门要先看看天气预报。其实在太空中也是如此——空间环境预报对保证航天员的工作、保障载人空间站的安全非常重要。\u003c/p>\u003cp>        中科院空间环境预报中心承担着空间环境预报的任务，不仅要为发射任务提供空间环境保障服务，还将开启\u003cu>          \u003c/u>的空间环境保障模式，不间断地为我国载人空间站的在轨安全运行保驾护航。\u003c/p>\u003cp>        影响载人空间站发射和运行安全的轨道空间环境主要是大气环境、高能辐射环境和流星体环境等。这些环境的变化主要受太阳活动和地磁活动的制约。太阳活动是近地空间环境的扰动源，大的太阳爆发活动直接影响近地空间环境，如产生太阳质子事件引起高能辐射环境的变化。地磁暴期间，高层大气密度会迅速上升，导致低轨道上航天器的阻力增加，从而改变航天器的正常运行轨道，增大航天器定轨和轨道预测的误差。\u003c/p>\u003cp>        载人空间站各个舱段的发射期（2021-2022年）处于第25太阳活动周的开始和上升阶段，太阳爆发活动的强度和频次相对低一些。但是这并不意味着空间环境就可以平静无虞了。太阳上的冕洞经常连续几个太阳自转周（27天）引起地磁扰动，偶发的日冕物质抛射也会时不时引起地磁暴。\u003c/p>\u003cp>        最重要的是，载人空间站的运行期为10余年，将横跨第25太阳活动周，甚至延长至第26太阳活动周。长期的在轨运行，工程任务将越来越复杂，也将面临更加复杂多变的空间环境要素威胁。\u003c/p>\u003cp>        首先，空间站是一个大型航天器，更容易遭受空间粒子辐射、原子氧腐蚀、碎片撞击等效应影响。它在轨时间很长，这就使得空间环境影响的累计效应非常突出。其次，空间站要正常运行，必备一个高压供电系统，太空中的等离子体环境会导致弧光放电、电流泄露等效应突出。再次，空间站将一直运行在低轨道区域，大气环境和碎片环境恶劣，轨道衰变、机械碰撞效应更为显著。对于航天员而言，需要常驻在空间站，并开展出舱、交会对接等航天活动，遭受空间辐射的概率大大增加。空间站长期运行任务中，将包括核心舱、货运飞船、载人飞船、实验舱1、实验舱2、光学舱等频繁的发射和回收，航天任务重。要保障这些飞行任务的空间安全，需要的空间环境安全窗口更多。\u003c/p>\u003cp>        预报中心早在天和核心舱发射前一年就进入保障状态，对空间站任务期的整体空间环境态势及其对任务的可能影响进行了全面的分析，为后续预报任务的制定和实行奠定了基础。\u003c/p>\u003cp>        自2020年6月以来，预报中心对现有的空间环境预报保障系统进行了全面的升级和改造，重点增加了针对空间站轨道预报的支持产品和针对航天员辐射安全的预警评估产品，并于2021年1月完成了整个系统的建设和改造任务。\u003c/p>\u003cp>        从核心舱发射前三个月开始，预报中心持续不断地向工程有关部门提供空间环境预报报告，对发射窗口的空间环境状况进行精密的分析和预测，并分析空间环境可能对核心舱的影响，给出了精确的短期预报结论：太阳不会发生强爆发活动，地磁不会发生强扰动，预计发射窗口的空间环境是安全的。从4月29日核心舱入轨开始，预报中心进入空间站在轨飞行空间环境保障任务状态。空间环境预报员24小时值班，时刻监视空间环境的变化，及时报告空间环境态势，评估空间环境变化对载人空间站可能带来的威胁，协助空间站系统和航天员及时规避未知的空间环境危害，保障载人空间站的安全稳定运行。\u003c/p>","questions":[{"qid":"4651520","cat":"逻辑填空","stem":"填入文中画横线处最恰当的一项是：","options":{"A":"一站式","B":"无缝隙","C":"全天候","D":"定制型"},"answer":"C","explanation":"横线出现在第二段，搭配“空间环境保障模式”，根据横线后“不间断地为我国载人空间站的在轨安全运行保驾护航”可知，这一空间环境保障模式是一直连续、没有中断的，故横线处应体现连续不停之意。C项“全天候”即不受任何条件限制、能二十四小时使用，符合文意，当选。\nA项“一站式”指一次性完成、一步到位，俗称一条龙服务，B项“无缝隙”指事物没有空隙或缝合的痕迹，D项“定制型”指按个别客户自身要求，为其提供适合其需求的、令其满意的服务，均无法体现连续、不间断之意，与文意不符，排除。\n故正确答案为C。\n【文段出处】《这些新科技，为航天员护航》","no":21,"missingImage":false},{"qid":"4651523","cat":"片段阅读","stem":"作者认为影响载人空间站发射和运行安全的最大因素在于：","options":{"A":"太阳质子引发高能辐射环境变化","B":"空间环境高层大气密度迅速上升","C":"太阳活动周循环进入新上升阶段","D":"太阳的强爆发活动及地磁暴活动"},"answer":"D","explanation":"“影响载人空间站发射和运行安全的因素”出现在文章第三段，根据“影响载人空间站发射和运行安全的轨道空间环境主要是大气环境、高能辐射环境和流星体环境等。这些环境的变化主要受太阳活动和地磁活动的制约”以及“大的太阳爆发活动直接影响近地空间环境”“地磁暴期间，高层大气密度会迅速上升，导致低轨道上航天器的阻力增加，从而改变航天器的正常运行轨道，增大航天器定轨和轨道预测的误差”可知，最大的影响因素是“太阳爆发活动”和“地磁暴活动”，对应D项。\nA项，根据“太阳活动是近地空间环境的扰动源，大的太阳爆发活动直接影响近地空间环境，如产生太阳质子事件引起高能辐射环境的变化”可知，“太阳质子”仅对应“太阳爆发活动”，表述片面，排除；\nB项，根据文段“地磁暴期间，高层大气密度会迅速上升”可知，“高层大气密度迅速上升”仅对应“地磁暴活动”，表述片面，排除；\nC项，“太阳活动周循环进入新上升阶段”文章并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】《这些新科技，为航天员护航》","no":22,"missingImage":false},{"qid":"4651528","cat":"片段阅读","stem":"根据文意，载人空间站的发射期定于2021-2022年的原因主要是：","options":{"A":"第25太阳活动周尚在开始阶段","B":"空间环境处于相对的平静时期","C":"方便航天器进入正常轨道运行","D":"减少航天器定轨时产生的误差"},"answer":"B","explanation":"“载人空间站的发射期定于2021-2022年”出现在文章第四段。根据“载人空间站各个舱段的发射期（2021-2022年）处于第25太阳活动周的开始和上升阶段，太阳爆发活动的强度和频次相对低一些”可知，将载人空间站的发射期定于2021-2022年主要是因为此时的太阳爆发活动强度与频次相对较低，即空间环境是相对平静的，对应B项。\nA项，仅为客观背景的表述，并非选择该时期的主要原因，且根据“处于第25太阳活动周的开始和上升阶段”可知，“尚在开始阶段”表述片面，排除；\nC项，文段并未提及“航天器进入正常轨道运行”，无中生有，排除；\nD项，根据第三段“地磁暴期间，高层大气密度会迅速上升，导致低轨道上航天器的阻力增加，从而改变航天器的正常运行轨道，增大航天器定轨和轨道预测的误差”可知，“航天器定轨时产生的误差”仅为影响载人空间站发射众多因素中的一方面，并非是决定发射期的主要原因，排除。\n故正确答案为B。\n【文段出处】《这些新科技，为航天员护航》","no":23,"missingImage":false},{"qid":"4651532","cat":"片段阅读","stem":"空间环境预报中心时刻监测空间环境变化，其任务不包括：","options":{"A":"密切监控防止空间站高压供电系统电流泄露","B":"评估空间环境变化对空间站可能带来的威胁","C":"针对空间站航天员辐射安全发出预警评估","D":"协助航天员及时规避未知的空间环境危害"},"answer":"A","explanation":"A项，“防止空间站高压供电系统电流泄露”文章未提及，无中生有，当选；\nB项，根据文章第九段“空间环境预报员24小时值班，时刻监视空间环境的变化，及时报告空间环境态势，评估空间环境变化对载人空间站可能带来的威胁”可知，表述正确，排除；\nC项，根据文章第八段“预报中心对现有的空间环境预报保障系统进行了全面的升级和改造，重点增加了针对空间站轨道预报的支持产品和针对航天员辐射安全的预警评估产品”可知，表述正确，排除；\nD项，根据文章第九段“时刻监视空间环境的变化······协助空间站系统和航天员及时规避未知的空间环境危害”可知，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《这些新科技，为航天员护航》","no":24,"missingImage":false},{"qid":"4651536","cat":"片段阅读","stem":"作为文章标题，最切合文意的一项是：","options":{"A":"空间“晴雨”早知道","B":"规避航天风险的“利器”","C":"保障航天安全 监测提前预报","D":"空间环境预报 守护航天安全"},"answer":"D","explanation":"文章第一、二段引出空间环境预报的话题，并表明其对航空安全的重要性；第三段至第六段具体说明影响载人空间站发射和运行安全的轨道空间环境因素，以及空间站面临的复杂环境；第七段至第九段论述空间环境预报中心分析并时刻监测空间环境，保障载人空间站安全平稳运行。故文章重点强调空间环境预报能保证航天员的工作、保障载人空间站的安全，核心话题为“空间环境预报”与“航天安全”，对应D项。\nA、B、C三项，均偏离核心话题“空间环境预报”，且 A项无法体现出对于航天安全的意义，均可排除。\n故正确答案为D。\n【文段出处】《这些新科技，为航天员护航》","no":25,"missingImage":false},{"qid":"4651505","cat":"片段阅读","stem":"城市治理活动中海量数据的背后，隐藏着人们对公共治理需求的偏好，也隐藏着公共治理需求的优先顺序和变化趋势。数字化治理致力于运用大数据、云计算、区块链、人工智能等技术，优化甚至重塑治理流程、组织结构、运行机制。通过数字化改革，治理主体能够更加精确地掌握不同区域、不同群体甚至不同个体的治理需求及其动态变化，进而优化公共资源配置和服务流程，实现城市治理的智能化。\n这段文字意在强调：","options":{"A":"精准化与智能化是数字化治理终极目标","B":"数字化治理将会引发公共治理性质的革命性变革","C":"数字化治理的基础是公共治理的数据化","D":"数字化治理将有效提升公共治理主体的治理水平"},"answer":"D","explanation":"文段首句论述了城市治理的背后隐藏着人们对公共治理需求的偏好及优先顺序和变化趋势，引出公共治理这一话题，接着指出数字化治理致力于运用各种技术优化甚至重塑治理流程等，即介绍数字化治理的目的，最后进一步指明数字化改革可以提升治理主体的水平进而提升城市治理的智能化，即强调数字化对公共治理的作用，对应D项。\nA项，缺少主题词“公共治理”，且“终极目标”文段并未提及，无中生有，排除；\nB项，“公共治理性质的革命性变革”文段并未提及，无中生有，排除；\nC项，“数字化治理的基础”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】《数字化让城市更智慧（思想纵横）》","no":26,"missingImage":false},{"qid":"4651731","cat":"片段阅读","stem":"文物承载着灿烂文明，传承着历史文化，是华夏先祖留给我们的宝贵遗产，赋予我们奋进新征程的精神力量，不久前受到普遍关注。在这次被大家称作“三星堆上新”的考古过程中，人们通过网络直播与新闻报道，热烈而深入地参与到考古互动中。当古代文化与现代生活相遇，人们展现出探讨历史、关注文化的浓厚兴趣，使得考古不再“冷门”，文物不再“高高在上”。\n关于“三星堆上新”的意义，文中未涉及的是：","options":{"A":"必将带动古代文化特色旅游的勃兴","B":"充分体现了文化自信和民族自豪感","C":"拓展了公众对历史文化的认知兴趣","D":"被称为一次极为成功的考古科普活动"},"answer":"A","explanation":"A项，文段并未提及“三星堆上新”会为古代文化特色旅游的发展起到带动作用，无中生有，当选；\nB项，根据“文物承载着灿烂文明，传承着历史文化，是华夏先祖留给我们的宝贵遗产，赋予我们奋进新征程的精神力量”可知，“体现了文化自信和民族自豪感”符合文意，排除；\nC项，根据“人们展现出探讨历史、关注文化的浓厚兴趣”可知，“拓展了公众对历史文化的认知兴趣”符合文意，排除；\nD项，根据“人们通过网络直播与新闻报道，热烈而深入地参与到考古互动中”可知，“一次极为成功的考古科普活动”符合文意，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《引人注目的“三星堆上新”考古过程》","no":27,"missingImage":false},{"qid":"4651496","cat":"片段阅读","stem":"截至2020年底，全球氢燃料电池汽车保有量较上一年度增长38%。氢能的大规模应用正从汽车领域逐步拓展至其他交通、建筑和工业等领域。应用在轨道交通和船舶上，氢能可降低长距离、高负荷交通运输对传统油气燃料的依赖。应用于分布式发电，氢能可为家庭住宅、商业建筑供电供暖。氢能还可直接为石化、钢铁、冶金等行业提供高效原料、还原剂和高品质热源，有效减少碳排放。\n这段文字着重介绍的是：","options":{"A":"氢能热效率高于传统能源","B":"氢能利用将取代传统的工业原料","C":"氢能有着多元的应用场景","D":"氢能利用将成为节能减排新举措"},"answer":"C","explanation":"文段开篇介绍氢燃料电池汽车保有量增长，随后提出观点，氢能应用从汽车领域正拓展至其他各领域。随后进行具体的解释说明，指出氢能应用到轨道交通和船舶、应用于分布式发电、作为高效原料等带来的诸多好处，论证氢能应用范围的广泛。故文段为分总分结构，重在论述氢能的应用范围非常广泛，对应C项。\nA项，文段核心话题为“氢能”，“氢能热效率”偏离核心话题，排除；\nB项，“取代传统的工业原料”无中生有，排除；\nD项，“节能减排”对应文段尾句解释说明的内容，非重点且无法全面概括，排除。\n故正确答案为C。\n【文段出处】《氢能缘何受瞩目》","no":28,"missingImage":false},{"qid":"4651735","cat":"片段阅读","stem":"教育与产业毕竟有不同的利益诉求，双方是否能够采取产教融合的共同行动？有学者认为，德国的传统中小企业中存在大量的非研发创新或低技术创新的需求，正是这类创新，而不是大企业的技术研发，确保了德国制造业的长盛不衰。中国的中小企业数量远远多于德国，其技术能力远远落后于大企业，有大量的非研发创新或低技术创新的需求。这正是职业教育可以发挥作用的空间。\n这段文字意在强调：","options":{"A":"职业教育实施产教融合是可能与可行的","B":"中小企业要注重学习德国既有的成功经验","C":"职业教育需要强化服务中小企业的意识","D":"中小企业要关注非研发创新与低技术创新"},"answer":"A","explanation":"文段开篇提出问题，即教育与产业能否采取产教融合的共同行动，并以后文内容进行了回答。先以德国为例，说明德国传统中小企业中的非研发创新或低技术创新的需求保证了制造业的活力，接着对比指出中国中小企业也有大量的非研发创新或低技术创新的需求，尾句通过指代词“这”指代前文，强调职业教育大有可为。故尾句是对首句问题的回答，即职业教育可以采取产教融合的共同行动，对应A项。\nB项，缺少主题词“职业教育”，且“学习德国既有的成功经验”文段未提及，无中生有，排除；\nC项，“强化服务中小企业的意识”文段未提及，无中生有，排除。\nD项，缺少主题词“职业教育”，且“要关注非研发创新与低技术创新”的对策无中生有，排除。\n故正确答案为A。","no":29,"missingImage":false},{"qid":"4651738","cat":"片段阅读","stem":"射电望远镜是一种利用无线电波来“观看”远方物体的科学仪器。通过天线、接收机和一系列设备，射电望远镜把远处物体发射的无线电波接收进来，然后转变为可视的信号，例如荧屏上的亮点、记录仪上的曲线、电脑打印的数字和图表等，然后再进行观看。因而是一种间接的“观看”，与普通光学望远镜是大不相同的。\n文中“观看”二字加引号的理由不包括：","options":{"A":"媒介是肉眼看不见的无线电波","B":"所观测的都是极其遥远的物体","C":"所获得的只是信号而并非物象","D":"不同于光学望远镜的直接观看"},"answer":"B","explanation":"A项，根据“射电望远镜是一种利用无线电波来‘观看’远方物体的科学仪器”可知，“媒介是肉眼看不见的无线电波”属于“观看”二字加引号的理由，排除；\nB项，根据“通过天线、接收机和一系列设备，射电望远镜把远处物体发射的无线电波接收进来，然后转变为可视的信号”可知，射电望远镜接收的是远处物体发射的无线电波而非直接观测远方的具体物体，因此“所观测的都是极其遥远的物体”不属于“观看”二字加引号的理由，当选；\nC项，根据“······把远处物体发射的无线电波接收进来，然后转变为可视的信号，例如荧屏上的亮点、记录仪上的曲线······”可知，“所获得的只是信号而并非物象”属于“观看”二字加引号的理由，排除；\nD项，根据“因而是一种间接的‘观看’，与普通光学望远镜是大不相同的”可知，“不同于光学望远镜的直接观看”属于“观看”二字加引号的理由，排除。\n本题为选非题，故正确答案为B。","no":30,"missingImage":false},{"qid":"4651527","cat":"片段阅读","stem":"农村金融需求是否满足，对农村发展的进程有极大影响。全面疏解农村地区信贷供给，是我国推进农业农村优先发展的重要一环。要不断完善金融支农的激励约束机制，加快农村金融回归“三农”本源的进程，促进金融资源向农业农村流动，以打通农村金融供需“梗阻”。持续推进农村金融供给侧结构性改革，增强农村金融服务农村实体经济的能力。同时，大力发展农村普惠金融，鼓励各金融机构为农业农村优先发展提供多层次、广覆盖、低成本、可持续的金融服务。\n这段文字中提取的关键词最恰当的是：","options":{"A":"农村金融 农村发展 金融支农","B":"农村金融 金融机构 金融服务","C":"农村金融 金融资源 农业农村","D":"农村金融 普惠金融 服务农村"},"answer":"A","explanation":"文章开篇指出农村金融需求的满足对农村发展的重要性，并指出其积极意义。后文围绕如何满足农村金融需求促进农村发展的措施展开，一方面要完善激励约束机制，加快农村金融回归“三农”本源的进程，持续推进农村金融供给侧结构性改革；另一方面要大力发展农村普惠金融，两方面措施均属于农村金融促进农村发展的方式，即利用金融支农的方式。故文段重在说明要通过一系列金融支农的方式让农村金融促进农村发展，围绕的核心话题为农村金融、农村发展、金融支农，对应A项。\nB项，“金融机构”与“金融服务”对应“同时”之后的内容，表述片面，排除；\nC项，“金融资源”对应“同时”之前的内容，表述片面，排除；\nD项，“普惠金融”对应“同时”之后的内容，表述片面，排除。\n故正确答案为A。\n【文段出处】《稳步实现农业农村高质量发展》","no":31,"missingImage":false},{"qid":"4651726","cat":"片段阅读","stem":"大数据为审判执行赋能。大数据在众多司法活动领域如类案推送、量刑辅助、偏离预警、裁判文书自动生成、虚假诉讼识别、判决结果预测、诉讼风险评估等都有应用前景，给审判执行工作现代化带来新机遇。大数据可实现类案自动关联、法律法规推送，为法官工作提供个性化、精细化、智能化服务，便于统一法律适用标准，避免“同案不同判”。通过区块链技术统一证据标准，还能辅助案件办理过程中的证据采集和认定工作。\n下列说法文中未涉及的是：","options":{"A":"运用司法大数据可以有效地避免适用法律不当","B":"运用司法大数据有助于证据采集认定","C":"运用司法大数据有助于实现审判执行的精准化","D":"运用司法大数据有助于提升普法成效"},"answer":"D","explanation":"A项，根据文段中“大数据可实现······便于统一法律适用标准，避免‘同案不同判’”可知，表述正确，排除；\nB项，根据文段尾句“通过区块链······证据采集和认定工作”可知，表述正确，排除；\nC项，根据文段中“大数据可实现······精细化、智能化服务”可知，表述正确，排除；\nD项，文段并未提及司法大数据的运用是否“有助于提升普法成效”，无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《让大数据更好为司法赋能》","no":32,"missingImage":false},{"qid":"4651504","cat":"语句表达","stem":"互联网新闻业颠覆了新闻媒介和职业记者是公众与消息来源和信息准确可靠性之间权威通道的传统理念。以往优秀的职业记者和强大公信力的媒介机构在获取消息来源、验证信息准确度方面具有得天独厚的资源和优势，这也是职业与非职业新闻业之间的分野所在。然而今天，除了各类消息来源都可以直接面对公众之外，遍布全球、专业高效的互联网用户，也使得信息的交叉验证变得比以往更为便捷。简而言之，媒介机构不再是新闻事件的权威阐释主体，新闻报道的价值和意义                    。\n填入画横线处最恰当的是：","options":{"A":"已然掌握在互联网各类新媒体手中","B":"不再由传统的权威新闻媒体所定义","C":"由互联网用户的广泛参与而消解","D":"经由公众的集体参与而被重塑"},"answer":"D","explanation":"横线出现在文段结尾，且由“简而言之”引导，可知是对前文的总结。文段开篇引出“互联网新闻业”这一话题，接着介绍了以往职业记者和媒介机构是获取消息来源、验证信息准确性的权威通道，随后通过转折词“然而”强调在今天公众可以直接获取各类消息来源，并通过互联网快速验证信息，尾句对前文进行总结，即媒介机构不再是新闻事件的权威阐释主体，公众的参与让新闻报道的价值和意义和以往大不相同，对应D项。\nA项，“互联网各类新媒体”文段并未提及，无中生有，排除；\nB项，未提及前文核心话题“公众”，且填入横线后不如D项表述更加明确，排除；\nC项，“互联网用户”表述片面，且“消解”程度过重，排除。\n故正确答案为D。\n【文段出处】《读&lt;“液态”的新闻业：新传播形态与新闻专业主义再思考&gt;有感》","no":33,"missingImage":false},{"qid":"4651727","cat":"片段阅读","stem":"螳螂大臂的锯齿和木工锯子如出一辙，鱼鳔和潜水艇的压载水舱也是异曲同工。然而，同样也很明显，蝙蝠的耳朵和雷达长相完全不同，人类捆扎上翅膀并不能飞行，而最终制造出来的飞机既没有羽毛，也没有翅膀上下扇动。这说明，仿生学是人类向自然求教、收获知识并改造世界的一条有效路径，却未必是唯一路径。比如飞行能力背后的依据是抽象的空气动力学，这种能力的实现固然需要载体，但载体之间的差异可能非常大。\n下列说法与文意不符的是：","options":{"A":"仿生学原理引发了多种不同的发明创造","B":"鸟类能够飞行激起人类建造飞机的愿望","C":"飞机具有的飞行能力与仿生学并无关系","D":"发明创造更依赖于大量抽象的科学理论"},"answer":"D","explanation":"A项，根据文段“螳螂大臂的锯齿和木工锯子如出一辙，鱼鳔和潜水艇的压载水舱也是异曲同工”可知，一些发明创造正是源于仿生学原理，表述正确，排除；\nB项，根据文段“人类捆扎上翅膀并不能飞行，而最终制造出来的飞机既没有羽毛”可知，人们是想通过模仿鸟类飞行的，建造飞机的愿望即表达对飞行的愿望，表述正确，排除；\nC项，根据文段“比如飞行能力背后的依据是抽象的空气动力学”可知，表述正确，排除；\nD项，根据文段“这说明，仿生学是人类向自然求教、收获知识并改造世界的一条有效路径，却未必是唯一路径”可知，不论是仿生学还是其它抽象的科学理论均是学习改造的路径，并没有更加突出其中一方，该项属于无关对比，表述错误，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《人工智能与心理学的迷思》","no":34,"missingImage":false},{"qid":"4651728","cat":"语句表达","stem":"①此外，对社会秩序的维护和对国民生活及生命安全的保护，也不只是专业团体的责任\n②对公共事务的参与，应该被视为他们的天职\n③另一方面，专业群体对职业规范的遵守，各行各业的正常运行，无不与人们的财产、经济生活、居住生活、食品安全、环境安全及生命健康等等息息相关\n④在现代社会尤其是城市社会中，任何行业的从业人员都需要受到相关法律和职业规范的约束\n⑤也因此，任何职业的从业人员的责任和权利，都具有天然的公共性\n⑥它需要各种社会团体的有效运作和相互协作\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"④③⑤②①⑥","B":"④⑤⑥②①③","C":"④①②⑤⑥③","D":"④②③①⑤⑥"},"answer":"A","explanation":"观察选项，首句相同，寻找其他解题突破口。⑥句出现指代词“它”，且根据“需要”可知，此句提出了对策，即需要各种社会团体的有效运作和相互协作，结合选项寻找其指代对象，判断⑥句之前是①句还是⑤句，①句介绍对社会秩序的维护和国民安全的保护不只是专业团体的责任，可与⑥句构成指代词捆绑，即强调对社会秩序的维护和国民安全的保护不只是专业团体的责任，还需要各种社会团体的共同努力，保留A项。⑤句论述任何职业的从业人员的责任和权利都具有天然的公共性，与⑥句的语义无关，无法与⑥句指代词“它”构成指代词捆绑，排除B、C、D三项。\n验证A项，文段首先指出任何行业的从业人员都需要受到相关法律和职业规范的约束，且对职业规范的遵守与人们的财产、生活等方面息息相关，随后通过“因此”进行总结，得出结论，强调任何职业的从业人员的责任和权利都有天然的公共性，对公共事务的参与也是他们的天职，最后提出对策，即对社会秩序的维护和国民安全的保护不只是专业团体的责任，还需要各种社会团体的共同努力，逻辑得当，当选。\n故正确答案为A。\n【文段出处】《陈映芳：“保卫张医生”，我们想要保护什么？》","no":35,"missingImage":false},{"qid":"4651724","cat":"逻辑填空","stem":"数字时代，            的科技进步为红色文创开拓了新的发展空间。一些设计师顺势而为，积极借助数字技术        红色资源，创新体验形式。\n依次填入画横线处最恰当的一项是：","options":{"A":"突飞猛进 利用","B":"日新月异 转化","C":"一日千里 借鉴","D":"一飞冲天 依托"},"answer":"B","explanation":"第一空，横线处所填成语用来修饰“科技进步”且对应后文“开拓了新的发展空间”，B项“日新月异”指每天每月都有新的变化，形容进步、发展很快，C项“一日千里”指发展极快，均可以修饰“科技进步”，并与后文形成对应，保留。A项“突飞猛进”指事业、学问等进展非常迅速，与“科技进步”中的“进步”语义重复，排除；D项“一飞冲天”指平时没有特殊表现，一下做出了惊人的成绩，与文段语境无关，排除。\n第二空，横线处所填词语搭配“资源”且对应后文“创新体验形式”，B项“转化”指转变、改变，与“资源”搭配恰当，也能体现出数字技术对红色资源的创新性开发，符合文意，当选。C项“借鉴”指跟别的人或事相对照，以便取长补短或吸取教训，多搭配“经验、理念”等，与“资源”搭配不当，排除。\n故正确答案为B。\n【文段出处】《红色文创焕发新活力》","no":36,"missingImage":false},{"qid":"4651730","cat":"逻辑填空","stem":"面对国际金融危机冲击，我们之所以能            ，率先重返平稳较快发展轨道，靠的就是扩大内需，以内需的确定性和稳定性        外需的不确定性和不稳定性。相应地，我国经济的对外依存度有了明显下降。\n依次填入画横线处最恰当的一项是：","options":{"A":"处变不惊 缓解","B":"化险为夷 对冲","C":"有惊无险 消弭","D":"处之泰然 中和"},"answer":"B","explanation":"第一空，根据“面对国际金融危机冲击”“率先重返平稳较快发展轨道”可知，横线处成语应体现我们渡过了国际金融危机的冲击，已稳步发展之意，B项“化险为夷”指化危险为平安，转危为安，C项“有惊无险”形容过程形势严峻，但是最终达到了预期的结果，均符合文意，保留。A项“处变不惊”指处在变乱之中，能沉着应付，一点儿也不惊慌，D项“处之泰然”指遇到事情时态度镇定，神色安恬自若，二者只能表现遇到变化困难等情况所展现出来的态度，均无法体现我们已稳步发展之意，排除。\n第二空，根据“相应地，我国经济的对外依存度有了明显下降”可知，横线处词语应体现降低外部风险之意，B项“对冲”指特意减低另一项投资风险的投资，符合文意，当选。C项“消弭”指清除、消除某些事情，程度过重，排除。\n故正确答案为B。\n【文段出处】《构建新发展格局须统筹发展和安全》","no":37,"missingImage":false},{"qid":"4651517","cat":"逻辑填空","stem":"广大进城务工人员常常在医疗、社保、子女入学等涉及公共服务均等化的民生保障问题上面临        ，这些都是摆在我们面前的现实问题。城镇化是一个渐进过程，很多问题的解决无法            ，但至少应该在发展的过程中，努力体现解决问题的诚意。\n依次填入画横线处最恰当的一项是：","options":{"A":"挫折 迎刃而解","B":"窘境 一蹴而就","C":"劣势 急功近利","D":"困难 立竿见影"},"answer":"B","explanation":"第一空，搭配“面临”，A项“挫折”、B项“窘境”、D项“困难”均搭配恰当，保留。C项“劣势”一般搭配“处于”“处在”等，与“面临”搭配不当，排除。\n第二空，由“城镇化是一个渐进过程”可知，城镇化是一个长期过程，横线处应体现问题无法短期、快速解决之意。B项“一蹴而就”形容做事轻而易举，一下子就能成功，与文意相符，且该词多用于否定句，当选。A项“迎刃而解”比喻处理事情、解决问题很顺利，体现不出“时间短”的含义，排除；D项“立竿见影”指收效非常迅速，常见搭配如“政策立竿见影”“效果立竿见影”等，强调的是效果好，与文段解决问题的语境不符，且与“问题的解决”搭配不当，排除。\n故正确答案为B。\n【文段出处】《称“农民工”为“建设者”是好开端》（光明网）","no":38,"missingImage":false},{"qid":"4651736","cat":"逻辑填空","stem":"关于江南的意象，古代诗词中            。这些意象的产生，半是源于江南人对故乡的回望，半是来自异乡人的反观。在这中间，运河作为出入江南的重要通道，成了古典诗词的审美对象，因而有着“唐诗之河”“宋词之河”等        。\n依次填入画横线处最恰当的一项是：","options":{"A":"不计其数 代称","B":"车载斗量 雅号","C":"琳琅满目 别称","D":"俯拾皆是 美誉"},"answer":"D","explanation":"第一空，搭配“意象”，A项“不计其数”指没法计算数目，形容极多，B项“车载斗量”指用车来装，用斗来量，形容数量极多，D项“俯拾皆是”形容数量非常多，极容易得到，均可以体现出诗词中关于江南的意象很多，搭配得当，符合文意，保留。C项“琳琅满目”比喻充满了美好珍贵的事物，常用来形容商品、工艺品，与“意象”搭配不当，排除。\n第二空，搭配“运河”，且根据横线前的“因而”可知，横线处词语与“运河作为出入江南的重要通道，成了古典诗词的审美对象”构成因果关系，应体现运河的重要与美好，表达积极的感情色彩，D项“美誉”指美好的名誉，符合文意，当选。A项“代称”指代替正式名称的另一名称，为中性词，与文段感情色彩不一致，排除；B项“雅号”指高雅的名号，多用于尊称他人的名字，与“运河”搭配不当，排除。\n故正确答案为D。\n【文段出处】《古典诗词中的“下江南”意象》","no":39,"missingImage":false},{"qid":"4651725","cat":"逻辑填空","stem":"根据相关规定，当事人之间        串通，企图通过诉讼、调解等方式        他人合法权益的，人民法院应当驳回其请求，并根据情节轻重予以罚款、拘留；构成犯罪的，依法追究刑事责任。\n依次填入画横线处最恰当的一项是：","options":{"A":"故意 侵犯","B":"恶意 侵害","C":"有意 侵占","D":"蓄意 侵吞"},"answer":"B","explanation":"本题可从第二空入手，搭配“合法权益”，A项“侵犯”指非法干涉别人，损害其权益，B项“侵害”指用暴力或非法手段损害，均与“合法权益”搭配得当，保留。C项“侵占”指非法占有财产或用武力侵略、占有别国的领土等，D项“侵吞”指用武力吞并或占有别国的领土，或暗中非法占有别人的东西或公共的财物、土地等，均与“合法权益”搭配不当，排除。\n第一空，搭配“串通”，且根据后文可知，此处应体现消极的感情色彩，B项“恶意”指不良的居心或坏的用意，搭配得当且符合文意，当选。A项“故意”指存心或有意识地，为中性词，与文段感情色彩不符，排除。\n故正确答案为B。\n【文段出处】《中华人民共和国民事诉讼法》","no":40,"missingImage":false},{"qid":"4651544","cat":"逻辑填空","stem":"以都市圈视角来看，超大城市的城区和郊区应该互相        、互相补充并            ：城区是超大集聚，郊区则应该是中型或小型集聚；城区是尽显        的超级都市，郊区则是各有特色的市镇体系和生态田园；城区是高容积率和高密度的，郊区则是相对低容积率和低密度的。\n依次填入画横线处最恰当的一项是：","options":{"A":"提携 美美与共 气势","B":"呼应 融为一体 实力","C":"错位 相得益彰 魅力","D":"借鉴 珠联璧合 优势"},"answer":"C","explanation":"第一空，横线处形容“城区和郊区”之间的关系，根据横线所在句子后的“：”可知，后文是对横线处的解释说明，根据后文可知，文段表达城区和郊区应采用两种不同的思路发展，C项“错位”指离开原来的或应有的位置，置于此处表达两者错开，位置不同，可体现走不同路线，不同思路之意，与文意相符，保留。A项“提携”比喻在事业上扶植后辈或携手合作，与“城区和郊区”搭配不当，排除；B项“呼应”指彼此关联、照应，D项“借鉴”指把别的人或事当镜子，对照自己，以便吸取经验或教训，均无法体现出“城区和郊区”之间互不相同的关系，与文意不符，排除。\n第二空，代入验证，C项“相得益彰”指相互帮助、互相补充，更能显出好处，置于此处表达城区和郊区两者相互配合，相互补充，更好发展，与文意相符，保留。\n第三空，代入验证，搭配“尽显”，尽显“魅力”指魅力全部显露，搭配恰当且符合文意，C项当选。\n故正确答案为C。\n【文段出处】《谋划“十四五”⑧求解超大城市土地发展难题》","no":41,"missingImage":false},{"qid":"4651526","cat":"逻辑填空","stem":"“微改造”的城市更新模式遵循“修旧如旧，建新如故”的原则，采取            的办法进行修复改造，很好地保留了历史建筑的整体        和空间肌理，同时        文创产业，为历史街区增添了活力。\n依次填入画横线处最恰当的一项是：","options":{"A":"精雕细刻 风貌 导入","B":"返璞归真 面貌 植入","C":"一丝不苟 样貌 融入","D":"纤毫毕现 容貌 引入"},"answer":"A","explanation":"第一空，横线处成语搭配“办法”，且根据后文“很好地保留了历史建筑的整体······和空间肌理”可知，该办法所达到的效果既能呈现历史建筑的整体还能呈现细节，A项“精雕细刻”指精心细致地雕刻，多用于形容做事认真细致，符合文意，保留。B项“返璞归真”指去掉外在的装饰，恢复原来的质朴状态，侧重于回归本初，但是文段“修旧如旧，建新如故”指城市更新要与历史风貌不冲突，而不是回到原来的状态，与文意不符，排除；C项“一丝不苟”形容办事认真，多形容做事态度，与“办法”搭配不当，排除；D项“纤毫毕现”形容极细微的东西都显现了出来，与“办法”搭配不当，排除。\n第二空，代入验证，根据前文“遵循‘修旧如旧，建新如故’的原则”可知，历史建筑保留了原来的样子，A项“风貌”指风格和面貌，符合文意，保留。\n第三空，代入验证，搭配“文创产业”，且根据后文“为历史街区增添了活力”可知，横线处应体现历史街区增加了文创产业，A项“导入”指引入，与“文创产业”搭配恰当，符合文意，当选。\n故正确答案为A。\n【文段出处】《永庆坊的悠长时光》","no":42,"missingImage":false},{"qid":"4651734","cat":"逻辑填空","stem":"作为传统文化数千年一系的文明古国，中国数字文化产业发展有着得天独厚的            。中华文化源远流长、博大精深、丰厚多样，文化知识        巨大。我国数字文化产业能够萃取获得和转化创新的文化资源是海量和多元的。传承发扬中华文化，赋予中国传统优秀文化以精当表达，向世界准确        中国文化的当代价值，是数字文化产业的责任担当，也是巨大机遇。\n依次填入画横线处最恰当的一项是：","options":{"A":"发展空间 数量 传输","B":"先天优势 体量 传扬","C":"战略储备 能量 传播","D":"资源禀赋 存量 传递"},"answer":"D","explanation":"第一空，搭配“中国数字文化产业发展”，表示中国数字文化产业发展的环境或条件。D项“资源禀赋”指资源条件，符合文意，保留。A项“发展空间”的“发展”与前文的“中国数字文化产业发展”语义重复，搭配不当，排除。B项“先天优势”与前文的“得天独厚”语义重复，排除。C项“战略储备”是人为创造的条件，不能用“得天独厚”来修饰，排除。\n第二空，代入验证。 “文化知识存量”搭配恰当，且可体现出中华文化源远 一局，第六局胜，概率\u003cimg data-k=\"bb48575e5c28\">；③第四、五、六局中胜一局败两局，第七局胜，概率\u003cimg data-k=\"420ea710b933\">。故小王获胜概率\u003cimg data-k=\"dbcfdd95c241\">，正确。\n故正确答案为B。\n备注：①考场上排除C、D、A三项后，无需验证B项，直接选即可。\n②A项概率也可反面求解：获胜概率\u003cimg data-k=\"0992cddbcae9\">\u003cimg data-k=\"5358c3ad9501\">。","no":51,"missingImage":false},{"type":"question","qid":"4651667","cat":"数学运算","stem":"甲、乙两人对100个家庭进行电话调查。若甲、乙完成对1个家庭的调查需要的时间分别是12分钟和20分钟，则他们完成这次电话调查需要的时间至少是：","options":{"A":"12小时28分钟","B":"12小时32分钟","C":"12小时36分钟","D":"12小时40分钟"},"answer":"C","explanation":"方法一：甲、乙完成对1个家庭的调查需要的时间分别是12分钟和20分钟，因此每小时（60分钟）甲调查5个家庭，乙调查3个家庭，合计调查5+3=8个家庭。\u003cimg data-k=\"b5a2aed14eae\">小时······4个家庭，剩余4个家庭由甲调查3个，乙调查1个，用时是最少的，需要36分钟。因此两人合计用时最少为12小时36分钟，对应C项。\n方法二：由于选项都是12小时多，且问“至少”，故可利用代入排除法。12小时调查数量为：甲\u003cimg data-k=\"1f468e513393\">个家庭，乙\u003cimg data-k=\"3e461dd5b7ac\">个家庭，合计60+36=96个家庭，还剩4个家庭未调查。问题问“至少”，从最小的开始代入。\nA项：28分钟，甲可调查2个家庭，乙可调查1个家庭，合计2+1=3个，不足4个，排除；\nB项：32分钟，甲可调查2个家庭，乙可调查1个家庭，合计2+1=3个，不足4个，排除；\nC项：36分钟，甲可调查3个家庭，乙可调查1个家庭，合计3+1=4个，当选。\n故正确答案为C。","no":52,"missingImage":false},{"type":"question","qid":"4651510","cat":"数学运算","stem":"下列图形中，阴影部分面积为2的是：","options":{"A":"\u003cimg data-k=\"ea18b1b78273\" style=\"max-width:278px\">","B":"\u003cimg data-k=\"6a591a060f3b\" style=\"max-width:278px\">","C":"\u003cimg data-k=\"fccd1185c00a\" style=\"max-width:278px\">","D":"\u003cimg data-k=\"011e71ffd874\" style=\"max-width:278px\">"},"answer":"B","explanation":"方法一：根据微积分原理，如果f(x)是区间[a，b]上的连续函数，并且\u003cimg data-k=\"636e72f3aef8\">，则\u003cimg data-k=\"4032850ea2bd\">。\nA项：直线x=-1，x=1，以及曲线\u003cimg data-k=\"b3cbeeb5165f\">和x轴围成的图形的面积可表示，x在[-1，1]上的积分，被积函数为\u003cimg data-k=\"b3cbeeb5165f\">，所以所求面积\u003cimg data-k=\"cf4f8f008f5c\">\u003cimg data-k=\"c96e422bfaae\">\u003cimg data-k=\"d765158602f1\">\u003cimg data-k=\"5bddaad34d93\">\u003cimg data-k=\"fa127e2331b3\">，不符合题意；\nB项：直线\u003cimg data-k=\"70299b030749\">，\u003cimg data-k=\"f74876248541\">，以及曲线\u003cimg data-k=\"7889635dd266\">和x轴围成的图形的面积可表示，x在[\u003cimg data-k=\
