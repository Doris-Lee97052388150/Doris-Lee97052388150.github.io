<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2021年山东省公务员录用考试《行测》试题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2021-山东","title":"2021年山东省公务员录用考试《行测》试题（网友回忆版）","year":"2021","group":"山东","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2741640","cat":"新思想","stem":"下列表述没有体现习近平生态文明思想的是：","options":{"A":"“宁要绿水青山，不要金山银山”，绝不以牺牲环境为代价去换取一时的经济增长","B":"“先发展，后治理”，在经济欠发达、生态环境良好的地区坚持发展优先、保护为主的方针","C":"“山水林田湖草是一个生命共同体”，坚持综合治理，对自然生态空间进行统一确权登记","D":"“环境就是民生”，发展经济是为了民生，保护生态环境同样也是为了民生"},"answer":"B","explanation":"本题考查政治常识。\nA项正确，2013年9月7日，习近平总书记在哈萨克斯坦纳扎尔巴耶夫大学发表演讲并回答学生们提出的问题，在谈到环境保护问题时他指出：“我们既要绿水青山，也要金山银山。宁要绿水青山，不要金山银山，而且绿水青山就是金山银山”。要尊重自然、顺应自然，绝不以牺牲环境为代价去换取一时的经济增长。\nB项错误，习近平总书记提出了“生态兴则文明兴，生态衰则文明衰”这一重要论断。实践证明先污染后治理的老路是行不通的，发展不能以牺牲环境为代价，因此“先发展，后治理”的理论不符合习近平总书记的生态文明思想。\nC项正确，2018年5月18日，习近平总书记在全国生态环境保护大会上的讲话中指出：“山水林田湖草是生命共同体，要统筹兼顾、整体施策、多措并举，全方位、全地域、全过程开展生态文明建设”。2013年，党的十八届三中全会审议通过了《中共中央关于全面深化改革若干重大问题的决定》。《决定》提出，健全自然资源资产产权制度和用途管制制度。对水流、森林、山岭、草原、荒地、滩涂等自然生态空间进行统一确权登记，形成归属清晰、权责明确、监管有效的自然资源资产产权制度。\nD项正确，2015年3月6日，习近平在参加全国两会江西代表团审议时指出：“环境就是民生，青山就是美丽，蓝天也是幸福”。保护生态环境就是保护生产力，改善生态环境就是发展生产力。发展经济和保护环境都是为了民生。\n本题为选非题，故正确答案为B。","no":1,"missingImage":false}],"count":1,"answerable":1,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2741643","cat":"地理国情","stem":"“十三五”时期，山东省在对外开放、区域协调发展、基础设施建设等方面取得显著成就。下列相关表述错误的是：","options":{"A":"构建了“一群两心三圈”的区域发展总体格局","B":"“齐鲁号”欧亚班列已将西向运行最远端延伸到波兰","C":"省内高速公路通车里程突破7200公里，重回全国第一方阵","D":"打造“山水圣人”中华文化枢轴，建设尼山世界儒学中心"},"answer":"B","explanation":"本题考查政治常识。\nA项正确，2020年山东省印发的《贯彻落实〈中共中央、国务院关于建立更加有效的区域协调发展新机制的意见〉的实施方案》提出，构建“一群两心三圈”的区域发展格局。“一群”即打造具有全球影响力的山东半岛城市群；“两心”即支持济南、青岛建设成为国家中心城市；“三圈”即推进省会、胶东、鲁南三大经济圈区域一体化发展。\nB项错误，2020年11月12日，由山东高速集团统筹运营的“齐鲁号”欧亚班列（济南－荷兰芬洛）首班顺利开行。该班列装载服饰、箱包等货品，由济南南站发出，经二连浩特出境，预计18天后到达荷兰芬洛。本次班列的发运，标志着“齐鲁号”已将西向运行最远端延伸到荷兰，为山东省及周边地区外贸企业开拓荷兰市场搭建起一条便捷、高效的物流大通道。\nC项正确，2020年11月26日，京沪高速莱芜至临沂（鲁苏界）段改扩建项目、济南绕城高速二环线东环段、岚山至罗庄高速公路、潍日高速潍坊连接线正式建成通车，创山东省高速公路同日建成通车数量和里程之最。上述项目建成通车后，山东高速公路通车里程达到7204公里，重回全国第一方阵。\nD项正确，2019年8月25日，由教育部、山东省人民政府和相关教育研究机构牵头筹建的“尼山世界儒学中心”在孔子诞生地山东曲阜尼山揭牌成立，标志着全球儒学研究实体平台的诞生。2020年6月8日，山东省政府新闻办召开的发布会上，提出要“以文旅合作为切入点，加快济南、泰安、曲阜三地文旅合作，联合各市打造‘山水圣人’中华文化枢轴”。\n本题为选非题，故正确答案为B。","no":2,"missingImage":false},{"type":"question","qid":"2741646","cat":"经济常识","stem":"下列经济状况与国家的应对措施对应正确的是：","options":{"A":"通货膨胀——增发专项基建国债","B":"通货紧缩——增加税收","C":"经济下行——实行赤字财政","D":"经济过热——降低再贴现率"},"answer":"C","explanation":"本题考查经济常识。\nA项错误，国债可以分为建设性国债和减少货币供应量的国债。建设性国债是指政府发行国债所得用于基础建设，增发建设性国债会导致市场上的货币供应量变多。减少货币供应量的国债是指政府发行国债所得不流向市场，增发减少货币供应量的国债会导致市场上的货币量减少。因此，发生通货膨胀时，应该减发建设性国债，即减发专项基建国债。\nB项错误，税收增加，市场上的货币量会流向政府，市场中流通的货币总量减少，会加剧通货紧缩。\nC项正确，财政赤字是指财政支出超过财政收入。实行赤字财政会导致政府增加支出，市场上的货币供应量增多，有利于拉动经济增长，抵制经济下行。\nD项错误，再贴现率是指商业银行到中央银行兑换未到期的票据时，中央银行将利息先行扣除所使用的利率。降低再贴现率会增加市场上的货币供应量，不利于缓解经济过热。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"2741655","cat":"法律常识","stem":"下列行为符合我国法律规定的是（    ）。","options":{"A":"甲面包食品有限公司在其生产的面包外包装上使用“哈哈娃”标识","B":"乙酒店向送乘客到酒店就餐的出租车司机发送餐券作为奖励，因金额较小，不在公司账面上详细记录","C":"经丙百货公司同意，某快递公司在丙公司官网上插入其快递服务链接","D":"丁超市举办购物抽奖活动，某副经理小张未购物却获得一等奖"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，根据《反不正当竞争法》第六条规定：“经营者不得实施下列混淆行为，引人误认为是他人商品或者与他人存在特定联系：（一）擅自使用与他人有一定影响的商品名称、包装、装潢等相同或者近似的标识；（二）擅自使用他人有一定影响的企业名称（包括简称、字号等）、社会组织名称（包括简称等）、姓名（包括笔名、艺名、译名等）；（三）擅自使用他人有一定影响的域名主体部分、网站名称、网页等；（四）其他足以引人误认为是他人商品或者与他人存在特定联系的混淆行为。”本案中，甲面包食品有限公司在其生产的面包外包装上使用“哈哈娃”标识，构成擅自使用与他人有一定影响的商品名称近似的标识的违法行为。\nB项错误，根据《反不正当竞争法》第七条规定：“经营者不得采用财物或者其他手段贿赂下列单位或者个人，以谋取交易机会或者竞争优势：（一）交易相对方的工作人员；（二）受交易相对方委托办理相关事务的单位或者个人；（三）利用职权或者影响力影响交易的单位或者个人。经营者在交易活动中，可以以明示方式向交易相对方支付折扣，或者向中间人支付佣金。经营者向交易相对方支付折扣、向中间人支付佣金的，应当如实入账。接受折扣、佣金的经营者也应当如实入账······”酒店向出租车司机发送餐券应当如实入账。\nC项正确，根据《反不正当竞争法》第十二条规定：“经营者利用网络从事生产经营活动，应当遵守本法的各项规定。经营者不得利用技术手段，通过影响用户选择或者其他方式，实施下列妨碍、破坏其他经营者合法提供的网络产品或者服务正常运行的行为：（一）未经其他经营者同意，在其合法提供的网络产品或者服务中，插入链接、强制进行目标跳转；（二）误导、欺骗、强迫用户修改、关闭、卸载其他经营者合法提供的网络产品或者服务；（三）恶意对其他经营者合法提供的网络产品或者服务实施不兼容；（四）其他妨碍、破坏其他经营者合法提供的网络产品或者服务正常运行的行为。”快递公司在丙公司官网上插入服务链接得到了丙公司的同意，故快递公司与丙公司的约定有效。\nD项错误，根据《反不正当竞争法》第十条规定：“经营者进行有奖销售不得存在下列情形：······（二）采用谎称有奖或者故意让内定人员中奖的欺骗方式进行有奖销售······”本案中，丁超市故意让未购物的副经理中奖，构成违法行为。\n故正确答案为C。","no":4,"missingImage":false},{"type":"question","qid":"2741657","cat":"人文常识","stem":"下列哪一诗句的主题与其他三项不同？","options":{"A":"南有乔木，不可休思。汉有游女，不可求思","B":"呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙","C":"野有蔓草，零露漙兮。有美一人，清扬婉兮","D":"风雨如晦，鸡鸣不已。既见君子，云胡不喜"},"answer":"B","explanation":"本题考查人文常识。\nA项，“南有乔木，不可休思。汉有游女，不可求思”出自《国风·周南·汉广》，意为南有大树枝叶高，树下行人休憩少。汉江有个漫游女，想要追求只徒劳。这首诗是男子追求女子而不能得的情歌，写的是爱情。\nB项，“呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙”出自曹操的《短歌行》，意为一群鹿儿呦呦欢鸣，在那原野悠然自得的啃食艾蒿。一旦四方贤才光临舍下，我将奏瑟吹笙宴请宾客。表示了曹操渴求贤才的愿望。\nC项，“野有蔓草，零露漙兮。有美一人，清扬婉兮”出自《国风·郑风·野有蔓草》，意为野草蔓蔓连成片，草上露珠亮闪闪。有位美女路上走，眉清目秀美又艳。表现了浪漫而自由的爱情。\nD项，“风雨如晦，鸡鸣不已。既见君子，云胡不喜”出自《诗经·郑风·风雨》，意为风吹雨打天地昏，雄鸡啼叫声不停。既然已见到意中人，心中怎能不欢喜。表现了见到意中人喜出望外之情。\n综上，B项主题与其他三项不同。\n故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"2741638","cat":"法律常识","stem":"小王和小张系工友，因琐事发生纠纷后互殴，小王将小张打成轻伤，公安机关立案后双方达成和解协议，小张也表示了谅解，下列说法错误的是：","options":{"A":"人民检察院可以作出不起诉的决定","B":"公安机关可以向人民检察院提出从宽处理的建议","C":"人民检察院可以向人民法院提出从宽处罚的建议","D":"公安机关可以撤销刑事立案并作出行政处罚的决定"},"answer":"D","explanation":"本题考查法律常识。\nA、B、C三项均正确，根据《刑事诉讼法》第二百九十条规定：“对于达成和解协议的案件，公安机关可以向人民检察院提出从宽处理的建议。人民检察院可以向人民法院提出从宽处罚的建议；对于犯罪情节轻微，不需要判处刑罚的，可以作出不起诉的决定。人民法院可以依法对被告人从宽处罚。”\nD项错误，根据《刑事诉讼法》第一百一十二条规定：“人民法院、人民检察院或者公安机关对于报案、控告、举报和自首的材料，应当按照管辖范围，迅速进行审查，认为有犯罪事实需要追究刑事责任的时候，应当立案；认为没有犯罪事实，或者犯罪事实显著轻微，不需要追究刑事责任的时候，不予立案，并且将不立案的原因通知控告人······”。根据我国刑事诉讼法的规定，刑事案件不同于民事案件，需要案件撤销的，应当是人民检察院撤销立案。\n本题为选非题，故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"2741644","cat":"人文常识","stem":"下图中①代表金砖国家，③代表联合国安理会常任理事国，则关于②所代表的国家说法正确的是：\n\u003cimg data-k=\"becb7553cb9f\" style=\"max-width:439px\">","options":{"A":"领土接壤","B":"官方语言相同","C":"属于同一大洲","D":"同属四大文明古国"},"answer":"A","explanation":"本题考查地理国情。\n金砖国家包括巴西、俄罗斯、印度、中国、南非。联合国安理会常任理事国包括中国、俄罗斯、英国、法国、美国。因此，既属于金砖国家又属于联合国常任理事国的是中国和俄罗斯。\nA项正确，中国陆地边界长达2.28万公里，东邻朝鲜，北邻蒙古，东北邻俄罗斯，西北邻哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦，西和西南与阿富汗、巴基斯坦、印度、尼泊尔、不丹等国家接壤，南与缅甸、老挝、越南相连。东部和东南部同韩国、日本、菲律宾、文莱、马来西亚、印度尼西亚隔海相望。因此，中国与俄罗斯领土接壤。\nB项错误，中国的官方语言是汉语（通用普通话）；俄罗斯的官方语言为俄语。\nC项错误，中国位于亚洲东部，太平洋西岸，陆地面积约960万平方千米，国土面积位于世界第三；俄罗斯位于欧亚大陆北部，地跨欧亚两大洲，是世界上面积最大的国家，俄罗斯被认为是属于欧洲。\nD项错误，四大文明古国分别是中国、古巴比伦、古埃及、古印度。因此，俄罗斯不属于四大文明古国。\n故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"2741651","cat":"人文常识","stem":"发热是临床上常见的症状。关于发热，下列说法正确的是：","options":{"A":"体温超过\u003cimg data-k=\"ae95019a54fb\">说明病人已经发热","B":"一定程度的发热可使人体免疫功能增强","C":"手术后就发热说明病人发生了伤口感染","D":"病人发热后没有食欲主要因为唾液淀粉酶失去活性"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，正常情况下，人的体温会保持在\u003cimg data-k=\"3b7fff804129\">，因为人体有自带的体温调节系统。以口腔温度为标准，可将发烧程度分为：低烧，体温为\u003cimg data-k=\"705c5d12e4b1\">；中等烧，体温为\u003cimg data-k=\"d03cb73deb10\">；高烧，体温为\u003cimg data-k=\"a456b2013bf7\">；超高烧，体温为\u003cimg data-k=\"3606b34cf639\">以上。但要注意，有时体温升高不一定都是疾病引起的，某些情况可有生理性体温升高，如剧烈运动、月经前期及妊娠期，进入高温环境或热水浴等均可使体温较平时略高，但这些可以通过自身调节很快恢复正常。\nB项正确，一定程度的发热时，人体内的免疫细胞和免疫因子的活性提高了，当体温在\u003cimg data-k=\"5725460c911e\">时，机体免疫活动非常活跃，在某种程度上增强了身体的免疫力。\nC项错误，术后一些患者会出现发热症状，但只有一小部分是由于感染引起。非感染性发热如输血引起的发热反应、部分药物引起的发热反应等一般在术后24-48小时内出现，且体温\u003cimg data-k=\"a68e226e64ed\">左右。感染性发热往往体温较高（\u003cimg data-k=\"3395ee527915\">），多在术后第3天以后才开始出现连续发热。\nD项错误，人身体内的消化是由酶控制的，酶的活性直接影响人的新陈代谢。人体在发热时，体温升高，消化酶（唾液淀粉酶为消化酶的一种）活性降低，表现为食欲减退。因此，唾液淀粉酶是活性降低，而非失去活性。\n故正确答案为B。","no":8,"missingImage":false},{"type":"question","qid":"2741652","cat":"人文常识","stem":"宋徽宗酷爱书法和绘画，以下哪幅画他不可能鉴赏过?","options":{"A":"《富春山居图》","B":"《步辇图》","C":"《千里江山图》","D":"《簪花仕女图》"},"answer":"A","explanation":"本题考查人文常识。\n宋徽宗即赵佶，号宣和主人，宋朝第八位皇帝（1100年2月23日-1126年1月18日在位），书画家。\nA项错误，《富春山居图》是元代画家黄公望于1350年创作的纸本水墨画，是中国十大传世名画之一。因此，宋徽宗不可能鉴赏过《富春山居图》。\nB项正确，《步辇图》是唐朝画家阎立本的名作之一，是中国十大传世名画之一。\nC项正确，《千里江山图》是北宋王希孟创作的绢本设色画。\nD项正确，《簪花仕女图》传为唐代周昉绘制的一幅粗绢本设色画。\n本题为选非题，故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"2741656","cat":"科技常识","stem":"下列鉴别物质的方法错误的是（    ）。","options":{"A":"用肥皂水鉴别硬水与软水","B":"用稀硫酸鉴别锌片与铜片","C":"用酚酞试液鉴别纯碱与烧碱","D":"用燃着的木条鉴别氧气与二氧化碳"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，硬水，是指含有较多可溶性钙镁化合物的水。软水指的是不含或含较少可溶性钙镁化合物的水。肥皂的主要成分是硬脂酸钠(\u003cimg data-k=\"b3af4f714636\">)，在水中硬脂酸钠被水电离，形成硬脂酸根离子和钠离子。硬脂酸根离子会和镁离子和钙离子结合生成硬脂酸镁和硬脂酸钙，硬脂酸镁和硬脂酸钙都是不溶于水的沉淀。因此，如果是将肥皂投入到硬水中，会出现有沉淀的现象；如果是将肥皂投入到软水中，不会出现有沉淀的现象，水是纯净透明的。\nB项正确，锌片可以和稀硫酸反应生成氢气，而铜片不行，因此，把锌片放入稀硫酸中会产生大量的气泡，锌片不断溶解，而铜片不会产生反应。\nC项错误，纯碱即碳酸钠，是一种无机化合物，分子式为\u003cimg data-k=\"dbe5563a0bed\">。烧碱即氢氧化钠，无机化合物，化学式\u003cimg data-k=\"579f9659eb76\">。酚酞是一种有机化合物，分子式为\u003cimg data-k=\"9e2854931c73\">，其特性是在酸性和中性溶液中为无色，在碱性溶液中为紫红色。纯碱和烧碱都可以使酚酞变红，因此不能用酚酞试液鉴别纯碱与烧碱。可以用稀盐酸来进行鉴别，纯碱与盐酸反应生成二氧化碳，会产生气泡，烧碱与盐酸反应则无明显现象。\nD项正确，氧气具有助燃性，能使燃着的木条燃烧更旺，二氧化碳不具有助燃性，能使燃着的木条熄灭。\n本题为选非题，故正确答案为C。","no":10,"missingImage":false}],"count":9,"answerable":9,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2741681","cat":"逻辑填空","stem":"促进技术创新、产业升级，实现经济高质量发展，离不开人才的        作用，但是，有的地方并没有认真思考自身实际条件对吸引人才、发挥人才积极作用的影响，恨不得引进一批人才后立刻就让当地经济社会发生翻天覆地的变化，在引进人才工作上出现            的问题。\n依次填入画横线部分最恰当的一项是：","options":{"A":"引导 拔苗助长","B":"辅助 一拥而上","C":"支撑 急功近利","D":"推动 因噎废食"},"answer":"C","explanation":"本题可从第二空入手，根据“有的地方并没有认真思考······引进一批人才后立刻就让当地经济社会发生翻天覆地的变化”可知，横线处表达一些地方在引进人才时不考虑实际情况，急于让人才发挥作用、实现变化之意。C项“急功近利”指急于求成，贪图眼前的成效和利益。对应当地引进人才时急于让其发挥作用，符合文意，保留。A项“拔苗助长”指把苗拔起来，帮助其成长。比喻违反事物的发展规律，急于求成，最后事与愿违。文段并非表示要帮助“人才”成长之意，排除；B项“一拥而上”形容周围的人同时向一个目标猛挤过去，D项“因噎废食”比喻要做的事情由于出了点小毛病或怕出问题就索性不去干，均与文意不符，排除。\n第一空，代入验证，“离不开人才的支撑作用”，指人才对实现经济高质量发展起到重要作用，符合文意且搭配恰当，当选。\n故正确答案为C。\n【文段出处】江西日报《县域引才须避免四个误区》","no":11,"missingImage":false},{"type":"question","qid":"2741686","cat":"逻辑填空","stem":"一把剪刀、一个镊子、一支毛笔、一碗糨糊、一盏台灯······在图书馆的古籍中心，古籍修复师们年复一年重复着手中的工作。在需要修复的珍贵古籍面前，他们始终            。\n填入画横线部分最恰当的一项是：","options":{"A":"不苟言笑","B":"如履薄冰","C":"精益求精","D":"视若珍宝"},"answer":"B","explanation":"由横线前“珍贵古籍”可知，横线处填入的成语需体现古籍修复师们在修复珍贵古籍时的状态，B项“如履薄冰”比喻行事极为谨慎，存有戒心，填入横线处可体现他们在修复珍贵古籍时始终是小心谨慎的，符合文意，当选。A项“不苟言笑”指不随便说笑，形容态度庄重严肃，常用于形容人的神情状态，他们在修复古籍时不需要一直表情严肃，与文意不符，排除；C项“精益求精”比喻已经很好了，还要求更好，文段并没有体现出他们在修复工作中已经做得很好了，与文意不符，排除；D项“视若珍宝”形容十分珍爱，将其当成无价之宝，填入横线处可表示他们对古籍的珍爱程度，但体现不出他们修复古籍时的状态，与文意不符，且搭配不当，常用搭配应该是“他们始终对其视若珍宝”，排除。\n故正确答案为B。\n【文段出处】《河南古籍保护十年路：沉睡的“宝贝”亟待唤醒》","no":12,"missingImage":false},{"type":"question","qid":"2741688","cat":"逻辑填空","stem":"侦探小说的长久流行，部分原因是读者对世理人情中的阴暗面            的好奇心。安宁与平静只是一种表象，只要稍微留心，便能觉察到看似            的日常中处处有大大小小的危机。平凡生活的危机就是侦探小说最广泛和丰富的素材来源。\n依次填入画横线部分最恰当的一项是：","options":{"A":"与生俱来 悠然自得","B":"历久弥新 百无聊赖","C":"自然而然 波澜不惊","D":"经久不衰 一成不变"},"answer":"D","explanation":"第一空，搭配“好奇心”，且根据“侦探小说的长久流行，部分原因是读者对······的好奇心”可知， 读者对于世理人情中的阴暗面存在着‘长久’的好奇心。B 项“历久弥新”指经历长久的时间而更加鲜活，D 项“经久不衰”形容某事或某人经历很长时间仍旧保持较高的旺盛状态，均符合文意，保留。A 项“与生俱来”指从一生下来就有，C项“自然而然”指不经外力作用而如此，均与“长久”无关，排除。\n第二空，根据“安宁与平静”、“平凡生活”可知，横线处所在句子说明表面平凡的生活背后有大大小小的危机，横线处要体现生活平凡、平常之意。D项“一成不变”指一经形成不再改变，符合文意，当选；B项“百无聊赖”指思想情感没有依托，精神极度空虚无聊，与文意不符，排除。\n故正确答案为D。\n【文段出处】品略图书馆《平凡生活的危机》","no":13,"missingImage":false},{"type":"question","qid":"2741691","cat":"逻辑填空","stem":"一项新的研究表明，包括狩猎和徒步旅行在内的人类活动正在促使世界各地的哺乳动物在夜间变得更加        ，表现出夜行性增强的趋势。因为只有在这个时候它们才不太可能碰到人类，这种转变所造成的后果尚不清楚，但科学家怀疑，这可能会        到一些动物种群的生存。\n依次填入画横线部分最恰当的一项是：","options":{"A":"敏感 影响","B":"亢奋 侵犯","C":"活跃 威胁","D":"冲动 妨碍"},"answer":"C","explanation":"第一空，根据“表现出夜行性增强的趋势”“它们才不太可能碰到人类”等解释性内容可知，横线处应表达哺乳动物在夜间活动得更加频繁之意。B项“亢奋”指极度兴奋，C项“活跃”指行动积极活泼，均可体现哺乳动物活动得更加频繁，符合文意，保留。A项“敏感”指生理上或心理上对外界事物反应很快，与“活动频繁”之意不符，排除；D项“冲动”指不能理智地控制自己的行为，无法对应“不太可能碰到人类”这一原因解释，排除。\n第二空，搭配“生存”，横线前“这”指代前文哺乳动物习性的“转变”，体现出对“动物种群”的影响。C项“威胁”指使遭遇危险，与“生存”为常见搭配，当选。B项“侵犯”指非法干涉，多搭配“权利、权益等”，正确搭配为“侵犯生存环境”，无法与“生存”直接搭配，排除。\n故正确答案为C。\n【文段出处】《人类活动让动物拥抱黑夜》","no":14,"missingImage":false},{"type":"question","qid":"2741742","cat":"逻辑填空","stem":"戏曲电影是丰富人们精神文化生活的重要方式，更是用新的科技手段传播中华传统文艺             的措施。但我们要把握电影环境的新变化，找准戏曲电影的        观众，培育更适宜其生存发展的优质土壤，只要根据新的社会环境对症下药，戏曲电影的第二春不久定会到来。\n依次填入画横线部分最恰当的一项是：","options":{"A":"有的放矢 潜在","B":"行之有效 目标","C":"独具匠心 特定","D":"得天独厚 新兴"},"answer":"B","explanation":"第一空，横线处搭配“措施”， A项“有的放矢”指说话或做事有明确的目的，B项“行之有效”指实行起来有成效，均与“措施”搭配恰当，保留。C项“独具匠心”指具有与众不同的巧妙的构思，多形容一件产品或作品的独特性和创造性，与“措施”搭配不当，排除；D项“得天独厚”意为独具特殊的优越条件，常搭配“优势”等，与“措施”搭配不当，排除。\n第二空，横线处搭配“找准”，A项“潜在”即存在于事物内部尚未显露出来的部分，无法准确找到，故与“找准”搭配不当，排除；B项“目标”即有明确、准确的目的，与前文“找准”搭配恰当，当选。\n故正确答案为B。\n【文段出处】《戏曲电影应有新的运营思路》","no":15,"missingImage":false},{"type":"question","qid":"2741689","cat":"逻辑填空","stem":"街头艺术是一座开放的城市重要的一部分。一方面，街头艺术是城市的品味和气质，它比鳞次栉比的高楼大厦更温润人心。另一方面，文艺应让所有人都能够        ，街头也应该成为表现艺术的“基层”。我们的文化自信、主旋律和正能量，不仅仅表达在严谨的大舞台，亦可以展现在        的小天地。\n依次填入画横线部分最恰当的一项是：","options":{"A":"认同 自由","B":"欣赏 活泼","C":"理解 随意","D":"接触 温馨"},"answer":"B","explanation":"第一空，由横线后“也”以及“基层”可知，横线处应表达文艺应让所有人“靠近”之意，B项“欣赏”、D项“接触”填入均可表达文艺应让所有人“靠近”之意，保留；A项“认同”指体认与模仿他人或团体之态度行为，使其成为个人人格一个部分的心理历程，与文意不符，排除；C项“理解”指了解、明白，与“基层”对应不当，排除。\n第二空，根据横线前后的“大舞台”和“小天地”可知，横线处应与“严谨”语义相反，体现出不严肃、不谨慎之意，B项“活泼”指自然生动而不呆板，与文意相符，当选；D项“温馨”意为温暖、体贴，不能与“严谨”形成相反的语义，排除。\n故正确答案为B。\n【文段出处】《开放都市容得下持证的街头艺人》","no":16,"missingImage":false},{"type":"question","qid":"2741693","cat":"逻辑填空","stem":"在互联网已经进入下半场的背景下，技术成为驱动企业发展的        ，人工智能不仅是下一代信息技术的核心和焦点，也是最有可能改变人类生活的技术。当前，不少企业尤其是行业龙头企业已经在着手进行研发、应用人工智能，想在这一次的科技革命中抢占先机，从而        拥有新的核心竞争力，        自己的行业地位。\n依次填入画横线部分最恰当的一项是：","options":{"A":"关键 持续 树立","B":"支柱 真正 打造","C":"动力 迅速 维护","D":"引擎 率先 巩固"},"answer":"D","explanation":"第一空，根据“驱动”可知，横线处应体现技术“推动”企业发展之意，C项“动力”、D项“引擎”均可体现“推动”之意，保留。A项“关键”、B项“支柱”均强调“重要”之意，而非“推动”，与文意不符，排除。\n第二空，根据“抢占先机”以及“从而”可知，横线处应体现“领先”之意，D项“率先”，可体现“领先”之意，符合文意，保留。C项“迅速”强调“速度快”，无法体现“领先”之意，排除。\n第三空，代入验证，“巩固行业地位”搭配恰当，当选。\n故正确答案为D。\n【文段出处】人民网《无人配送或改变高额人力成本困境》","no":17,"missingImage":false},{"type":"question","qid":"2741694","cat":"逻辑填空","stem":"文学研究一直离不开两个维度：一个倾向于艺术的、内部结构的审美研究；另一个倾向于社会的、外部关系的意义揭示。两者原本可以            ，互为补充，但在不同时代，由于对文学本体的追问，以及文学的主体性和文学的社会价值性上思考不同，使两者关系变得复杂，甚至紧张和        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"珠联璧合 僵持","B":"相得益彰 对立","C":"互通有无 尖锐","D":"并行不悖 冲突"},"answer":"B","explanation":"第一空，横线处成语与“互为补充”形成并列关系，应体现出文学研究的两个维度之间相互补充配合。对比选项，B项“相得益彰”指两个人或两件事物互相配合，双方的能力和作用更能显示出来，与文意相符，保留。A项“珠联璧合”比喻杰出的人才或美好的事物结合在一起，文段未提及两个维度结合成一种，与文意不符，排除；C项“互通有无”指拿出自己多余的东西给对方并与之进行交换，以得到自己所缺少的东西，搭配主体为人或具体事物而不是文学研究维度，例如“两国人民互通有无”“古老的丝绸之路上经贸交往互通有无”，故搭配不当，排除；D项“并行不悖”指同时进行，不相冲突，未体现出双方补充配合的关系，与文意不符，排除。\n第二空，代入验证，B项“对立”是指两种事物或两种力量之间敌对、互相抵触。文段提及两个维度的关系复杂，并通过“甚至”提出二者紧张对立的关系，环环相扣，语义逐渐加重，符合文意，当选。\n故正确答案为B。\n【文段出处】光明网《文学社会学视野里的明清诗文》","no":18,"missingImage":false},{"type":"question","qid":"2741745","cat":"逻辑填空","stem":"当前，以数字化的知识和信息作为关键生产要素的数字经济蓬勃发展，新技术、新业态、新模式            。各国纷纷将发展数字经济作为推动实体经济提质增效、        核心竞争力的重要举措，推动数字经济取得的创新成果        于实体经济各个领域，围绕新一轮科技和产业制高点展开积极竞合。\n依次填入画横线部分最恰当的一项是：","options":{"A":"层出不穷 重塑 融合","B":"乏善可陈 形成 应用","C":"方兴未艾 提升 实践","D":"纷至沓来 培育 落实"},"answer":"A","explanation":"第一空，由“数字经济蓬勃发展”可知，横线处表达“新技术、新业态、新模式”不断出现之意，且呈现一种积极发展的良好态势。A项“层出不穷”形容事物连续出现，没有穷尽；C项“方兴未艾”形容事物正在蓬勃发展，一时不会终止；D项“纷至沓来”形容连续不断地到来，均符合语境，保留。B项“乏善可陈”指说不出有什么优点，没有什么好称道的，感情色彩与文段不符，排除。\n第二空，搭配“核心竞争力”，三者均可，保留。\n第三空，搭配“创新成果”，A项“融合”指不同的事物合为一体，用于此处，可体现为“创新成果”与“实体经济各个领域”间的结合，语境相符，搭配得当，当选。C项“实践”与“成果”搭配不当，排除；D项“落实”多搭配“方针、行动等”，与“成果”搭配不当，且通常表述为“落实到······”而非“落实于······”，排除。\n故正确答案为A。\n【文段出处】《全球数字经济十大发展趋势》","no":19,"missingImage":false},{"type":"question","qid":"2741695","cat":"逻辑填空","stem":"所谓“做对的事情”，就是要把握        ，清晰利弊，在做事之前要仔细考虑，分析判断，着眼于长远，理清            ，找出关键点。而“把事情做对”则将关注重点引向了        ，强调做事情方法要正确，二者缺一不可。\n依次填入画横线部分最恰当的一项是：","options":{"A":"原则 是非曲直 源头","B":"方向 来龙去脉 过程","C":"规律 轻重缓急 结果","D":"趋势 千头万绪 目的"},"answer":"B","explanation":"第一空，横线处所填词语对应“着眼于长远”，应体现“做对的事情”要形成一种长远的、发展的眼光，B项“把握方向”、C项“把握规律”、D项“把握趋势”，均符合文意，保留。A项“原则”指说话或行事所依据的法则或标准，“把握原则”仅可体现现有准则，与“着眼于长远”无关，排除。\n第二空，根据“在做事之前要仔细考虑，分析判断，着眼于长远”可知，横线处所填成语应体现对事情进行全面、宏观地分析。B项“来龙去脉”比喻人、物的来历或事情的前因后果，放入文中可体现对事情分析全面，符合文意，保留。C项“轻重缓急”指事情有次要的、主要的、缓办的、急办的区别，文段未体现“轻重”“缓急”，而是强调对事情要分析全面，排除。D项“千头万绪”形容事物繁杂，头绪很多，“理清千头万绪”侧重体现事情很复杂，文段并无此意，而是强调做事要分析全面，眼光长远，以保证所做的事情一直是对的，排除。\n第三空，代入验证，B项“过程”指事情进行或事物发展所经过的程序，后文“做事情方法要正确”能体现做事情时应使用正确的方法，体现过程，符合文意，当选。\n此外，本题“做对的事情”与“把事情做对”是两个不同方面。“做对的事情”，就是要把握方向，着眼于长远，侧重于强调“未来”；“把事情做对”重点关注过程，侧重于“当下”，前后呼应得当，B项当选。\n故正确答案为B。\n【文段出处】《做领导者之前先做有效的追随者》","no":20,"missingImage":false},{"type":"question","qid":"2741709","cat":"片段阅读","stem":"或许是农业文明的缘故，中国人的衣食住用里，一直透着对自然的敏感。漆器是最典型的一种。这些器物，小至盘碗碟盒、大至桌椅箱柜，几乎可以覆盖我们日常生活的所有方面，可见漆器的巨大包容性，可以含纳不同品类的事物。漆器上雕饰的图案，除了山水人物，出现最多的当是各种花卉，让我们在吃穿住用间，视野可以穿越纷杂的俗世，与山林田野相通。在故宫博物院所藏17707件漆器里，几乎找不出几件上面没有花卉图案的漆器，即使以龙螭鸟禽、亭台殿阁为主题，也一样是花团锦簇。所以，在这些漆器上，花卉几乎是通用的语言。\n这段文字意在说明：","options":{"A":"花卉是传统漆器重要的创作主题","B":"农业文明对中国人衣食住用有深刻的影响","C":"漆器有助于了解中国古人的日常生活","D":"漆器作为装饰品反映了创作者的审美情趣"},"answer":"A","explanation":"文段首先通过程度词“最”引出“漆器”这一话题，接下来介绍漆器的包容性、漆器上的图案，并指出图案中出现最多的是各种花卉，而后论述故宫博物馆里花卉图案的漆器非常普遍。尾句通过“所以”总结全文，故文段意在强调“花卉”几乎是漆器的通用语言，对应A项。\nB项，对应文段首句内容，非重点，且文段没有体现“深刻的影响”，无中生有，排除；\nC项，缺少主题词“花卉”，且文段没有体现可以通过漆器了解中国古人的日常生活，无中生有，排除；\nD项，缺少主题词“花卉”，且文段没有提及“创作者的审美情趣”，无中生有，排除。\n故正确答案为A。\n【文段出处】《故宫的古物之美》","no":21,"missingImage":false},{"type":"question","qid":"2741711","cat":"片段阅读","stem":"彩色摄影是饱含缤纷色彩的造型语言，黑白摄影是经典的、表达独特艺术思考的视觉化工具，它们之间不存在哪个更好、表现力更强的问题。无论是使用经验，还是作品所呈现的视觉效果，这两者都是完全不同的事物。今天的黑白摄影，即使不再是摄影艺术性和技术性的代表，也并不是什么过时的事物。黑白摄影仍具有自身独特的语言和能力，发挥着自己的特色，展现着新的可能，依然是解决、分析、阐述艺术问题的方法手段和需要研究探索的课题。\n这段文字意在说明，黑白摄影：","options":{"A":"与彩色摄影不具有可比性","B":"在当今语境下仍有较高的艺术价值","C":"需要与时俱进不断发展","D":"自身具有独特的艺术评价标准"},"answer":"B","explanation":"文段开篇通过彩色摄影与黑白摄影之间的对比，引出“黑白摄影”这一话题。接下来引出观点，表明当今的黑白摄影虽然不是技术性等的代表，但依然不过时，换言之，当今的黑白摄影依然是具有价值的。后文通过“具有自身独特的语言和能力”“发挥着自己的特色”“展现着新的可能”“依然是解决······问题的方法手段”等对黑白摄影当今价值进行解释说明。故整个文段意在强调黑白摄影在当今的价值，对应B项。\nA项，文段论述彩色摄影与黑白摄影是不同事物，不存在对比，“不具有可比性”与文意相悖，排除；\nC项，文段并未提到黑白摄影存在的问题，“需要与时俱进不断发展”为无关对策，排除；\nD项，“艺术评价标准”文段未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《当代影像艺术创作中的黑白摄影》","no":22,"missingImage":false},{"type":"question","qid":"2741713","cat":"语句表达","stem":"随着越来越多的国家投入到军用机器人的研究与开发中去，世界已在不知不觉中滑进了一场机器人军备竞赛，毋庸置疑，军事机器人相比于士兵，在功能、体能、效能方面具有极大优势。它可以同时承担多项复杂任务，作战更加持久，在程序设定完成后能够高效精准地达成目标，失误率较低，特别是完全自主机器人，与人类战士相比，具有持续作战时间长、反应能力快、生存能力强等优势，将会进一步增加战争的强度。然而                      ：参战的自主机器人到底是不是战斗员？又应当承担何种战争责任？\n填入画横线部分最恰当的一项是：","options":{"A":"自主机器人在战争中的角色引人深思","B":"机器人参战可以重塑未来战争的图景","C":"机器人军备竞赛的发展前景尚不明朗","D":"有关战争责任的伦理问题也随之出现"},"answer":"D","explanation":"横线位于文段尾句，前面出现“然而”，所填内容需要与前文构成转折关系，且由横线后的标点符号“：”可知，横线后是对空缺处的解释说明。前文首先指出世界不知不觉进入机器人军备竞赛的背景。接着介绍了军事机器人相比士兵存在的优势，通过程度词“特别是”强调完全自主机器人与人类战士相比的优势及作用。尾句冒号后强调自主机器人是不是战斗员和应承担何种责任两个问题。结合转折词“然而”可知，横线处应与前文语义相反，横线处应该体现出问题的存在，且该问题与自主机器人在战争中的责任问题有关，“伦理问题”是对后文“角色”“责任”的概括表述，对应D项。\nA项，“角色”只是后文问题其中之一，表述片面，且“角色引人深思”并未体现消极感情色彩，排除；\nB项，“机器人”概念扩大，应是“自主机器人”，且“重塑未来战争的图景”表述积极，不能与转折词“然而”形成前后语义相反，排除；\nC项，“发展前景”文段并未论述，无中生有，且根据“参战的自主机器人到底是不是战斗员？又应当承担何种战争责任？”可知，文段已给出具体问题，“尚不明朗”表述不明确，排除。\n故正确答案为D。\n【文段出处】《谁在作战——军事AI正在走向未来战场》","no":23,"missingImage":false},{"type":"question","qid":"2741714","cat":"片段阅读","stem":"研制超材料就是按照特定的规则组合，搭配出不同电磁响应属性的人工复合材料。这些材料的属性除由材料本身决定外，还与其结构的形状、尺寸、排列和组合方式等紧密相关。通过改变超材料关键位置的结构和尺寸，人们就可以像搭积木一般实现对光波、雷达波、无线电波、声波乃至地震波的任意弯曲和精细“裁减”。比如，研究人员借助超材料薄层能让光线绕过物体的属性，开始研究使物体无影无踪的“隐身斗篷”。\n这段文字主要介绍了超材料的（    ）。","options":{"A":"研制原理","B":"应用领域","C":"分类标准","D":"设计意图"},"answer":"A","explanation":"文段开篇指出研制超材料的做法，并介绍这些材料的属性，接下来用对策标志词“通过”指出利用这一做法“改变超材料关键位置的结构和尺寸”就可以实现“对光波、雷达波、无线电波、声波乃至地震波的任意弯曲和精细‘裁减’”这些目的，尾句通过“比如”举例论证，故整个文段旨在强调让超材料发挥作用的方法，即研发原理，对应A项。\nB项“应用领域”、C项“分类标准”，均无中生有，排除；\nD项“设计意图”对应“对光波、雷达波、无线电波、声波乃至地震波的任意弯曲和精细‘裁减’”，非重点，排除。\n故正确答案为A。\n【文段出处】《超材料：会改写未来战争吗？》","no":24,"missingImage":false},{"type":"question","qid":"2741715","cat":"语句表达","stem":"早期人们对质量的认识并不清晰，质量管理专家给出的质量定义也不统一，比较有代表性的定义是“质量是产品符合规定要求的程度”，这是从生产角度来定义的质量，即强调产品要达到规定要求或标准。20世纪60年代美国质量管理专家提出，质量是产品的适应性，强调产品要适合用户的使用需要，任何产品如果不能满足顾客需要，不管它多么符合产品标准，也不是好的质量，这是人们首次从用户的角度认识和定义质量。                        ，这是质量观的一次重大转变。\n填入画横线部分最恰当的一项是：","options":{"A":"从满足生产需求转变到供给需求","B":"从对产品的保量要求转变到保质要求","C":"从强调产品转变到强调服务","D":"从关注生产方转变到关注需求方"},"answer":"D","explanation":"横线位于文段结尾，是对前文的总结。前文首先指出早期人们对质量认识不清晰，专家是从生产角度定义质量，强调产品要达到规定要求或标准。接着指出20世纪60年代美国专家提出产品要适合用户的需求，即从用户角度认识和定义质量。由此可知，横线前主要强调人们对质量的定义从生产方的角度转向用户需求的角度，即“从关注生产方转变到关注需求方”，对应D项。\nA项，偷换概念，“供给需求”是产品的供给方的需求，而文段说的是“从用户的角度认识和定义质量”，是关注用户的需求，排除；\nB项，“保量要求”无中生有，排除；\nC项，文段说的是“适合用户的使用需要”“从用户的角度认识和定义质量”，即关注需求方，选项中的“服务”只是用户需求中的一个方面，范围缩小，排除。\n故正确答案为D。\n【文段出处】《质量观是质量管理创新的原动力》","no":25,"missingImage":false},{"type":"question","qid":"2741719","cat":"片段阅读","stem":"日前，被称为“互联网原住民”的年轻人正在成为影视剧等文化产品的消费主体，他们的喜好左右着市场方向和创作方向。从积极的方面来说，这有利于文创产品供应和需求之间形成有效对接，以需求拉动生产，激活市场潜力，但另一方面，过度依赖市场需求也可能导致创作方的中长期迷失。新一代年轻人兴趣多元，关注力持续度不高，由此构成的市场需求很多情况下并不具备中长期生命力，创作者和制作方如果一味跟进年轻人多变的兴趣，难免顾此失彼、陷入被动。因此，创作者和制作方更应该仔细研究这些兴趣背后的社会基础和真实有效的需求。\n这段文字着重指出文创产业存在的哪一问题？","options":{"A":"盲目迎合受众喜好","B":"缺乏中长期规划","C":"产品供应能力不足","D":"内容和形式缺乏创新"},"answer":"A","explanation":"文段开篇指出年轻人的喜好左右着文化产品市场的方向，紧接着从积极层面分析其作用，可以激活市场潜力，而后通过转折词“但”引出问题，过度依赖市场需求会导致创作方的中长期迷失，后文针对迷失的原因进行详细论述，尾句通过结论词“因此”，总结全文并提出对策，创作者和制作方应仔细研究真实的需求。由于题干问的是文段的主要问题，故正确答案应为问题的同义替换，即过度依赖市场需求，对应A项。\nB项，“缺乏中长期规划”对应文段提出问题后的具体解释部分，非重点，排除；\nC项，“产品供应能力”文段并未提及，无中生有，排除；\nD项，“缺乏创新”文段并未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】光明日报《讨好年轻观众不能只是噱头》","no":26,"missingImage":false},{"type":"question","qid":"2741720","cat":"片段阅读","stem":"当人脑在发育阶段接触到视觉刺激，也就是通过眼睛看到外界事物时，视皮层上的神经元会被激活，也就是说这些神经元会对不同的图像特征如颜色、形状、亮度、朝向、距离等进行加工。如果人正处于视觉功能的发育关键期，而视觉神经元未被充分激活，未来在看到某些图像特征时就不会产生反应或反应比较弱，导致看不见或看不清。\n这段文字最适合作为下列哪个观点的论据？","options":{"A":"人体的不同机能存在着不同的发育关键期","B":"人体功能发育不充分有可能造成终生影响","C":"图像特征对视皮层神经元的激活至关重要","D":"错过发育关键期有可能丧失部分人体机能"},"answer":"D","explanation":"文段开篇提出视觉刺激的工作原理，即人脑在发育阶段时，视觉刺激能激活视皮层上的神经元，被激活的神经元会对不同的图像特征进行加工。后文从反面强调，如果在视觉功能的发育关键期，视觉神经元未被充分激活，未来在视觉功能上可能存在一定程度的问题或丧失。通过提问方式可知，文段要作为论据来支持论点，故文段支持的论点为发育关键期的重要性，对应D项。\nA项，文中只提到一种人体机能，无法作为“人体的不同机能”的论据，排除；\nB项，“造成终生影响”中的“终生”表述程度过重，排除；\nC项，“图像特征”并非文段重点，文段支持的论点是发育关键期的重要性，偏离文段核心话题，排除。\n故正确答案为D。\n【文段出处】《北大心理学教授方方：过度识字影响学龄前儿童的想象力》","no":27,"missingImage":false},{"type":"question","qid":"2741721","cat":"语句表达","stem":"①故宫中共有铁、铜、鎏金铜大缸308口，这些都是明清两代为防火而设置的储水缸\n②作为明清两代的皇宫，故宫一直注重防火\n③同时，金水河也是故宫自古以来的消防水源\n④目前，这些古代流传下来的防火传统仍然适用\n⑤“冬凿冰、夏注水、春除草、秋清叶”是故宫的防火传统\n⑥每口缸大约可储水3000升，时刻保持满盈状态\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②①⑥⑤④③","B":"⑤①⑥②③④","C":"⑤④②①⑥③","D":"②⑤①⑥③④"},"answer":"D","explanation":"根据选项判断首句。②句介绍故宫一直非常注重防火，引出话题，⑤句介绍故宫的防火传统，对比②⑤两句可知，应先介绍故宫注重防火这一话题，再介绍故宫的防火传统，故②句在⑤句之前，排除B、C两项。\n观察句子，③句中含有“同时”，说明③句前的内容也应对故宫使用的消防水源进行介绍，①⑥两句共同介绍了故宫为防火而设置的储水缸，故①⑥两句和③句可构成捆绑，D项当选。而⑤④两句共同介绍了故宫的防火传统，无法与③句中消防水源这一话题进行捆绑，排除A项。\n故正确答案为D。\n【文段出处】《600岁故宫如何防火？》","no":28,"missingImage":false},{"type":"question","qid":"2741723","cat":"片段阅读","stem":"距今200万~100万年前，在类人猿向现代智人进化期间，人类祖先的大脑就进化出了支持合作的功能，以支持狩猎活动。这使人类祖先前额皮层里的记忆与思考中心变得比其他灵长类动物的更发达。随着群体变得比个体更强大，大脑不断进化出管理更大群体的能力，群体之间的竞争就变得比个体之间的竞争更重要，同时拥有更多合作性个体的群体发展得更好，这一进化使得利他意识、伦理观、良知和尊严意识发展起来。\n这段文字意在说明：","options":{"A":"人类祖先的狩猎活动离不开群体的合作","B":"大脑在群体生活中的进化可以激发美德","C":"大脑的构造会因生活方式的变化而演化","D":"群体发展取决于拥有合作性个体的数量"},"answer":"B","explanation":"文段开篇提出人类祖先的大脑进化出支持合作的功能来支持狩猎活动，而后通过指代词“这”强调这一进化使得人类大脑中记忆与思考中心更发达，紧接着进一步指出随着群体更强大，群体之间竞争、合作更重要，大脑也随之进化出管理更大群体的能力，文段最后通过指代词“这”指代前文大脑进化，重点强调最终演变出“利他意识、伦理观、良知和尊严意识”这些美德，对应B项。\nA项，“狩猎活动离不开群体的合作”对应文段尾句结论之前，非文段重点，排除；\nC项，“大脑的构造”“生活方式的变化”文段均未提及，无中生有，排除；\nD项，“拥有合作性个体的数量”文段未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《原则》","no":29,"missingImage":false},{"type":"question","qid":"2741738","cat":"片段阅读","stem":"南朝文学批评家钟嵘在《诗品》中评论晋人刘琨的作品“善为凄戾之词，自有清拔之气。琨既体良才，又罹厄运，故善叙丧乱，多感恨之词”。这是用刘琨罹逢厄运的经历，来解释其诗作何以多感慨悲愤之词。当代的文学评论家更是自觉地运用这种方法考察作品。某位研究清末小说《孽海花》的学者曾说，要理解这部作品，就要“知人论世”，有必要探索曾朴的生活、思想历程与创作过程。可知，“知人论世”是他研究《孽海花》的重要方法。\n这段文字意在说明：","options":{"A":"“知人论世”历来是重要的文学研究方法","B":"作家的经历会对作品产生深刻的影响","C":"“知人论世”被奉为古代作品研究的圭臬","D":"当代学者继承了中国古人的文学研究模式"},"answer":"A","explanation":"文段先指出文学批评家钟嵘在《诗品》中用刘琨的个人经历来解释其作品为何多感慨悲愤之词，紧接着指出当代文学评论家也运用结合人生经历这种方法考察作品，然后列举了某位学者在研究《孽海花》时也采用“知人论世”的方法，通过探索作者曾朴的生活、思想历程与创作过程来理解这部作品，故文段重点强调“知人论世”自古都是文学研究的重要方法，文段的核心话题为“知人论世”的文学研究方法，对应A项。\nB项，未提及文段论述的核心话题“知人论世”的文学研究方法，排除；\nC项，“被奉为古代作品研究的圭臬”表述片面，当代的文学评论家也运用这种方法研究作品，且“圭臬”表述过于绝对，排除；\nD项，“文学研究模式”表述不明确，且“继承”并未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】中华读书报《也谈“知人论世”》","no":30,"missingImage":false},{"type":"question","qid":"2578978","cat":"片段阅读","stem":"唐代是中国园艺起步的时代。唐以前不管是皇家园林还是寻常百姓，栽培树木草本多以实用为主。而到了唐代，人们栽培植物逐渐向观赏性发展，果实不堪食用的海棠便因此开始得到重视。到了宋代，海棠成为园林观赏植物中的明星，宋人常以海棠牡丹并论，在宋代花鸟画中便有以海棠为题的古画留传。而宋代之后，海棠已然是中国传统的名花，历代都不少见。中国人喜欢海棠，于是中国古典园林中的海棠植于庭院，正是应了“金玉满堂”的谐音。\n这段文字主要介绍了：","options":{"A":"中国古典园艺史的发展脉络","B":"海棠在中国古典园艺史上的地位变迁","C":"海棠作为中国古典园林栽培植物的文化象征","D":"中国古典园林发展后期的主要特征"},"answer":"B","explanation":"文段开篇指出唐以前栽培树木草本多以实用为主；到了唐代，栽培植物逐渐向观赏性发展，海棠因此开始得到重视；宋代，海棠成为园林观赏植物中的明星；宋代之后，海棠已然是中国传统的名花，深受后世喜爱。最后指出于园林庭院中种植海棠，呼应金玉满堂的谐音。故文段按照时间顺序，介绍了海棠在我国古典园艺史上的地位变迁，对应B项。\nA、D两项，文段围绕“海棠”这一核心话题展开论述，选项缺少主题词，排除；\nC项，文段侧重强调了“海棠”在我国古典园艺中的地位变化，而非“文化象征”，排除。\n故正确答案为B。\n【文段出处】《海棠依旧》","no":31,"missingImage":false},{"type":"question","qid":"2741724","cat":"片段阅读","stem":"在游戏的世界里，人们不用承担现实生活中同样行为造成的后果，游戏输了可以点击“再来一次”一键复活。因此游戏提供了一种低成本低风险的自我实现方式。当个体在现实生活中受挫，游戏可以成为一种短暂的对现实世界的逃避。在游戏里建立社交关系，不断升级，提供了持续的挑战和个体存在的意义。\n最适合做这段文字标题的是：","options":{"A":"游戏成瘾，如何解决","B":"游戏社交：安全无负担","C":"现实越受挫，游戏越成瘾","D":"游戏：另一种“自我实现”"},"answer":"D","explanation":"文段开篇提出观点，在游戏的世界可以“一键复活”，其提供了一种自我实现方式。随后通过“个体在现实生活中受挫后，在游戏中可以逃避现实并且找到自己存在的意义”进行举例，进一步论证前文观点，即“游戏”提供了一种自我实现方式，对应D项。\nA项，文段未提及解决游戏成瘾的方法，“如何解决”，无中生有，排除；\nB项，“社交”对应尾句内容，非重点，且“无负担”表述过于绝对，排除；\nC项，“越受挫”，“越成瘾”，文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】搜狐网《游戏成瘾被列为精神障碍 DSM-5提出9条诊断标准》","no":32,"missingImage":false},{"type":"question","qid":"2741727","cat":"片段阅读","stem":"随着我国科技对经济社会发展贡献率的增大，以及科技介入生活程度的加深，普通人与科技的关系也变得更加密切。科普走进生活，越来越成为人们的普遍期待。而这又对科普创新提出了更高的要求。科普创新当然首先是要及时更新科普的理念和内容，把日新月异的科技发展成果通俗易懂地告诉民众。同时，它也意味着科普形式和手段的创新。增添文艺的元素，则是其题中应有之义。                    。老一辈科学工作者十分善于借用文学艺术的力量。例如，当我们翻阅竺可桢先生《说飓风》《说云》等科普文章时，就会被其准确而又生动的文字所折服。\n填入画横部分最恰当的一项是：","options":{"A":"人们对科普作品文艺性的期待越来越高","B":"文学艺术是推动科普创新的重要驱动力","C":"事实上，科普本身就具有文学性","D":"如何兼顾科普内容和形式的创新是当务之急"},"answer":"C","explanation":"横线位于文段中间，需要结合上下文进行分析。前文首先指出科技与普通人的关系越来越密切，人们期待科普走进生活，进而对科普创新提出更高的要求，随后针对科普创新提出具体对策，即“增添文艺的元素”。横线后的内容指出我国已经有老一辈的科学家在做科普工作时运用了文学艺术的力量，并举例进行论证。那么横线处填入的内容应体现科普中运用了文学艺术的意思，对应C项。\nA项，与后文对应不恰当，后文没有体现“期待越来越高”，排除；\nB项，“重要驱动力”与后文对应不恰当，后文没有体现出文学艺术是如何推动科普创新的，排除；\nD项，“如何兼顾科普内容和形式的创新”表述不明确，前文已经论述了可以通过增添文艺元素的方式进行创新，排除。\n故正确答案为C。\n【文段出处】《科普不妨用用“文艺梗”》","no":33,"missingImage":false},{"type":"question","qid":"2741730","cat":"片段阅读","stem":"对于古希腊人来说，各种形式和内容的比赛活动无所不在，凡是有竞赛的地方就有规则的存在。体育比赛有严格和严密的竞赛规则，裁判员在赛场上依据规则来进行判罚，只有如此才能产生没有任何争议的优胜者。这些活动的背后，如何用好的规则引导竞争，规范竞争，使人向善，使社会更为公正，是古希腊思想家们热衷探讨的话题。\n这段文字意在说明：","options":{"A":"古希腊人强调竞争中规则的重要性","B":"公平是古希腊思想家们持续关注的话题","C":"遵守规则是古希腊体育比赛的核心理念","D":"严密的规则才能实现社会的公正"},"answer":"A","explanation":"文段首句指出规则在古希腊竞赛中的普遍性，紧接着通过“只有······才”强调规则对体育比赛的重要性，尾句通过“这些”指代前文的体育比赛，引出结论，强调古希腊思想家们热衷探讨如何用规则引导和规范竞争，故文段重在说明古希腊人看中竞争中的规则性，对应A项。\nB项，偏离文段核心话题，文段重在强调古希腊人眼中“规则”对“竞争”的重要性，排除；\nC项，“体育比赛”对应尾句前的内容，为非重点，排除；\nD项，偏离文段核心话题，文段重在强调古希腊人眼中“规则”对“竞争”的重要性，且“社会的公正”表述片面，排除。\n故正确答案为A。\n【文段出处】《“尚争”与“崇让”：古代希腊和古代中国的竞争观念比较》","no":34,"missingImage":false},{"type":"question","qid":"2578979","cat":"片段阅读","stem":"研究发现，地震前岩石中氡值会有明显变化，就此可对地壳活动作出研判。氡观测是国际上普遍认可的地震监测手段之一，氡值是我国地震观测台网中最重要的测项之一。地震行业氡观测仪主要采用固体氡源进行校准，但固体氡源属于受国家严格监管的放射类源，由于存在运输不便等问题，氡观测仪无法实现全国统一校准。由于监测仪器标准不统一，A地区测出的氡气含量100Bq/L可能跟B地区测出的50Bq/L是一回事。这样的话，测出的数据就没有意义。因此，                    。\n填入画横部分最恰当的一项是：","options":{"A":"氡观测仪器难以在全国范围内广泛应用","B":"地震监测手段需丰富和多元化","C":"地震行业亟须统一氡观测仪器的标准","D":"在不同地区应采用不同的地震监测"},"answer":"C","explanation":"文段开篇指出氡观测是受人们认可的地震监测手段，后指出地震行业氡观测仪主要采用固体氡源进行校准，但由于存在运输不便等问题，氡观测仪无法实现全国统一校准，即标准不统一。但如果氡观测仪器标准不统一，测出的数据就没有意义。故为了保证地震数据的有效性，应当统一氡观测仪器的标准，对应C项。\nA项，文段侧重强调“氡观测仪无法实现全国统一校准”，未提及“氡观测仪器”难以在全国应用，排除；\nB、D两项，文段侧重强调“氡观测仪无法实现全国统一校准”，B项“地震监测手段需丰富和多元化”和D项“在不同地区应采用不同的地震监测”均与前文侧重点无关，排除。\n故正确答案为C。\n【文段出处】《有了校准平台，氡观测仪预测地震更准》","no":35,"missingImage":false}],"count":25,"answerable":25,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2741634","cat":"数学运算","stem":"甲地在乙地的正东方，在丙地的正南方。甲乙之间距离为2.1千米。小张从甲地骑车直线前往丙地，回程时以相同速度直线前往乙地再直线返回甲地，回程时的路程比去程长\u003cimg data-k=\"bec3fe75cd62\">。问甲丙之间的距离在以下哪个范围内？","options":{"A":"不到5千米","B":"在5~6千米之间","C":"在6~7千米之间","D":"超过7千米"},"answer":"D","explanation":"设去程路程甲、丙之间距离为3x千米，回程路程为丙\u003cimg data-k=\"508f0e7dbbe5\">乙\u003cimg data-k=\"508f0e7dbbe5\">甲，比去程多\u003cimg data-k=\"bec3fe75cd62\">为4x千米，则乙、丙之间距离为4x-2.1千米，甲、乙、丙之间位置如图所示：\n\u003cimg data-k=\"a594de59eff5\" style=\"max-width:202px\">\n根据直角三角形勾股定理可列方程为：\u003cimg data-k=\"12a51f6f1542\">，解得x=2.4，3x=7.2。\n故正确答案为D。","no":36,"missingImage":false},{"type":"question","qid":"2741641","cat":"数学运算","stem":"甲、乙、丙三人投资成立一家公司，初期共投入700万元。公司估值上涨\u003cimg data-k=\"e172e0ad0a10\">时三人进行了二期投资，甲投入了与其初期投资相同的金额，乙投入了其初期投资金额的2倍，丙投入了其初期投资金额的\u003cimg data-k=\"0f1fa1d0536c\">，二期总投入刚好也是700万元，此时甲、乙、丙三人的持股比例为5：14：16，那么初期投资乙比甲投入：","options":{"A":"多100万元","B":"多50万元","C":"少100万元","D":"少50万元"},"answer":"A","explanation":"设甲、乙、丙初期投资额分别为\u003cimg data-k=\"5320a525f2bc\">、\u003cimg data-k=\"c1beececd683\">、\u003cimg data-k=\"08caa03ce8e3\">万元。根据题意可得，公司估值上涨\u003cimg data-k=\"e172e0ad0a10\">，则甲持股金额为\u003cimg data-k=\"10a85274ac24\">，二期投资\u003cimg data-k=\"5320a525f2bc\">万元，此时甲持股金额为\u0 给12个部门各分配一人，再从12个部门中挑选2个，分别再分配2人和1人，即满足有部门获取的名额是3，情况数为\u003cimg data-k=\"90b3f056c456\">种；当有部门获取的名额是4人时，即先给12个部门各分配一人，再将剩下3人分配到同一部门，即可满足有部门获取的名额是4，情况数为\u003cimg data-k=\"60151d9ddbd4\">种；则所求倍数\u003cimg data-k=\"e6c7a9c8511f\">（有部门获取的名额是3的概率）\u003cimg data-k=\"bbebf78c6993\">（有部门获取的名额是4的概率）\u003cimg data-k=\"e9d65d670574\">\u003cimg data-k=\"17f7a7138d5f\">倍。\n故正确答案为C。","no":44,"missingImage":false},{"type":"question","qid":"2741667","cat":"数学运算","stem":"将5个相同的圆锥体零件表面涂上红、黄、蓝三种颜色。要求同一个零件的底面只能用一种颜色，同一个零件的斜面也只能用一种颜色，且5个零件的颜色彼此不完全相同，问总共有多少种不同的涂色方式？","options":{"A":"84","B":"126","C":"172","D":"180"},"answer":"B","explanation":"同一个零件的底面只能用同一种颜色，则底面有3种涂色方式；同一个零件的斜面也只能用一种颜色，则斜面有3种涂色方式，则每一个圆锥体的涂色方式有\u003cimg data-k=\"89aaa2fdc9da\">种。5个零件的颜色彼此不完全相同，则需要在9种涂色方式中选出5种，故有\u003cimg data-k=\"c0a1a0cae69e\">种涂色方式。\n故正确答案为B。\n备注：本题“彼此不完全相同”中“彼此”指的是任意两个圆锥体，即任意两个圆锥体颜色不完全相同，也就是说5个圆锥体颜色各不相同，否则本题无正确答案。","no":45,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"2741620","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"c60b876e22a7\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，题干图形均有圆，并且线条将圆明显分割成多个面，故考虑圆内面数量。题干图形圆内面数量从左到右依次为1、2、3、4、5，故“？”处圆内面数量应为6，A项圆内面数量为6，B项圆内面数量为5，C项圆内面数量为9，D项圆内面数量为2，只有A项符合规律。\n故正确答案为A。","no":46,"missingImage":false},{"type":"question","qid":"2741623","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"cb8e001c1747\" style=\"max-width:634px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相似，优先考虑样式规律。九宫格优先看横行，观察发现，第一行，由长方形、梯形、三角形和黑白点组成，且每行黑白点的位置有三种，都在图形内、都在图形外、白点在图形内黑点在图形外；第二行验证符合此规律；第三行应用此规律，后两幅图形出现了三角形和长方形，则“？”处应有梯形，排除A项；继续观察，后两幅图的黑白点位置分别为都在图形内、都在图形外，则“？”处白点应在图形内黑点应在图形外，排除C、D两项。\n\n故正确答案为B。","no":47,"missingImage":false},{"type":"question","qid":"2741626","cat":"图形推理","stem":"左图为给定的立体图形，将其从任一面剖开，右边哪一项不可能是该立体图形的截面？\n\u003cimg data-k=\"e729ea2e0589\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"A项：如图所示可切出\u003cimg data-k=\"53f3674f5200\" style=\"max-width:175px\">，排除；\nB项：如图所示可切出\u003cimg data-k=\"13c5475a0bb0\" style=\"max-width:179px\">，排除；\nC项：如图所示可切出\u003cimg data-k=\"e4d66a82d414\" style=\"max-width:178px\">，排除；\nD项：无法切出，当选。\n本题为选非题，故正确答案为D。","no":48,"missingImage":false},{"type":"question","qid":"2741630","cat":"图形推理","stem":"左图是给定的立体图形，下面选项哪个是该立体图形的外表面展开图？\n\u003cimg data-k=\"798abc34e392\" style=\"max-width:552px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题为空间重构题。观察选项，主要区别在于左下角的小矩形和右下角的矩形位置不同。\n \u003cimg data-k=\"0eec8b484fa0\" style=\"max-width:228px\">\n回到原图中观察G面（从正面看到的七边形面），如上图，在其面上以凸出的三角底边为起点，顺时针分别标出序号1、2、3，边3对应相邻矩形面的短边，而在A、D项中边3对应的是矩形的长边,如下图，排除A、D项；\n  \u003cimg data-k=\"ecd58030401f\" style=\"max-width:379px\">\n再次观察题干立体图形，边1对应的是H面（最左侧的面），H面与其相邻的较大的长矩形面F（立体图中标阴影的面）有一条等长且完全重合的公共边4，对比B、C项，C选项中两个面的公共边等长且完全重合，而B选项中两个面的公共边不完全重合，排除B项。\n\u003cimg data-k=\"34598616730a\" style=\"max-width:386px\"> \n故正确答案为C。","no":49,"missingImage":false},{"type":"question","qid":"2741632","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"3f8088afba6b\" style=\"max-width:662px\">","options":{"A":"①③④，②⑤⑥","B":"①③⑤，②④⑥","C":"①②⑤，③④⑥","D":"①④⑥，②③⑤"},"answer":"C","explanation":"本题为分组分类题目。观察题干图形发现，题干图形均为正六面体展开图，且出现小黑块。继续观察图形特征发现，图①②⑤中的小黑块互为相邻面，图③④⑥中的小黑块其中两个组成一组相对面，故①②⑤分为一组，③④⑥分为一组。\n故正确答案为C。","no":50,"missingImage":false},{"type":"question","qid":"2741726","cat":"定义判断","stem":"见微知著是指见到一点儿苗头，就能知道它的发展趋向或问题的实质。下列最能体现见微知著的是：","options":{"A":"见一叶落而知秋之将至。","B":"千里之堤，毁于蚁穴。","C":"岁寒，然后知松柏之后凋也。","D":"路遥知马力，日久见人心。"},"answer":"A","explanation":"第一步：找出定义关键词。\n“见到一点儿苗头”、“知道它的发展趋向或问题的实质”。\n第二步：逐一分析选项。\nA项：意思是从一片树叶的凋落，知道秋天的到来，符合“见到一点儿苗头”、“知道它的发展趋向或问题的实质”，符合定义，当选；\nB项：意思是千里长的大堤，往往因蚂蚁（白蚁）洞穴而崩溃，不符合“见到一点儿苗头”、“知道它的发展趋向或问题的实质”，不符合定义，排除；\nC项：意思是到了每年天气最冷的时候，就知道其他植物都凋零，只有松柏挺拔、不落，不符合“见到一点儿苗头”、“知道它的发展趋向或问题的实质”，不符合定义，排除；\nD项：意思是路途遥远，才可以知道马的力气的大小，不符合“见到一点儿苗头”、“知道它的发展趋向或问题的实质”，不符合定义，排除。\n故正确答案为A。","no":51,"missingImage":false},{"type":"question","qid":"2741729","cat":"定义判断","stem":"一个论证是一组陈述，其中的一个或多个陈述（即前提）被用来为另外一个陈述（即结论）提供支持的理由。\n根据上述定义，下列属于论证的是：","options":{"A":"食物的基因改造存在风险。基因改造过程中，会把意料之外的改变引入到为人类提供食物的生物DNA中，这些改变对于消费者来说可能是有害的。","B":"我们相信我们的公司能为我们的客户提供最好的产品，我们相信我们的产品一定比我们竞争对手的好。","C":"1648~1789年是欧洲主要君主国之间激烈竞争的年代之一，强国之间战争频繁，期间法国成为最重要的国家，在权力之间的平衡阻止了法国的扩张。","D":"不管位置如何，固体都保持各自的形状和体积，液体则占有一定的体积，但其形状与盛装容器的形状有关。"},"answer":"A","explanation":"第一步：找出定义关键词。\n“一组陈述，其中的一个或多个陈述（即前提）”、“被用来为另外一个陈述（即结论）提供支持的理由”。\n第二步：逐一分析选项。\nA项：基因改造过程中意料之外的改变可能对消费者有害，此前提可用来证明食物的基因改造存在风险，符合“一组陈述，其中的一个或多个陈述（即前提）”，也符合“被用来为另外一个陈述（即结论）提供支持的理由”，符合定义，当选；\nB项：相信我们的公司能为我们的客户提供最好的产品，相信我们的产品比竞争对手的好，两个陈述互相无法提供支持，不符合“被用来为另外一个陈述（即结论）提供支持的理由”，不符合定义，排除；\nC项：该项中关于1648~1789年间的历史只是对客观事实的陈述，几个陈述句中不存在结论句，不符合“被用来为另外一个陈述（即结论）提供支持的理由”，不符合定义，排除；\nD项：固体保持自己的形状，液体占有一定体积，陈述之间无法互相支持，不符合“被用来为另外一个陈述（即结论）提供支持的理由”，不符合定义，排除。\n故正确答案为A。","no":52,"missingImage":false},{"type":"question","qid":"2741732","cat":"定义判断","stem":"衬托是为了突出主要事物，用类似的事物或反面的、有差别的事物作陪衬的一种修辞方法。对比是指用相反或相似的两种事物互相比照，以共同表现某种思想或意境的一种修辞方法。二者的区别在于衬托是以次要事物为陪衬来突出主要事物，而对比中体现的两种事物不分主次。\n根据上述定义，下列同时使用了上述两种修辞方法的是：","options":{"A":"朱门酒肉臭，路有冻死骨。","B":"桃花潭水深千尺，不及汪伦送我情。","C":"蝉噪林逾静，鸟鸣山更幽。","D":"千里黄云白日曛，北风吹雁雪纷纷。"},"answer":"C","explanation":"第一步：找出定义关键词。\n衬托：“用类似的事物或反面的、有差别的事物作陪衬”、“次要事物为陪衬来突出主要事物”；\n对比：“相反或相似的两种事物互相比照”、“共同表现某种思想或意境”、“两种事物不分主次”。\n第二步：逐一分析选项。\nA项：“朱门酒肉臭，路有冻死骨”的意思是富贵人家门前飘出酒肉的味道，穷人们却在街头因冻饿而死，将封建统治集团的穷奢极欲、醉生梦死，与劳动人民的被奴役、被掠夺、冻死路旁的悲惨状况作了鲜明的对照，符合“相反或相似的两种事物互相比照”，也符合“两种事物不分主次”，符合“对比”的定义，不符合“衬托”的定义，排除；\nB项：“桃花潭水深千尺，不及汪伦送我情”的意思是桃花潭水即使深至千尺，也比不上汪伦送我之情，用桃花潭的水深“衬托”出作者与汪伦的友情更深，有主有次，符合“衬托”的定义，但不符合“对比”的定义，排除；\nC项：“蝉噪林逾静，鸟鸣山更幽”的意思是蝉噪阵阵，林间愈见寂静，鸟鸣声声，山中更觉幽深。静为主，动为次，运用以动显静的手法来渲染山林的幽静，使用了“衬托”的手法；将蝉鸣与鸟鸣、林静与山幽这些相似的事物进行对照，不分主次，使用了“对比”的手法，同时满足“衬托”和“对比”两种修辞手法，当选；\nD项：“千里黄云白日曛，北风吹雁雪纷纷”的意思是千里黄云遮天蔽日，天气阴沉，北风送走雁群又吹来纷扬大雪，使用了夸张的手法，不符合“衬托”的定义，也不符合“对比”的定义，排除。\n故正确答案为C。","no":53,"missingImage":false},{"type":"question","qid":"2741737","cat":"定义判断","stem":"类比论证是根据两个对象在某些属性上的相同或相似，推论两者在其他属性上也有相同或相似。其逻辑形式为：对象A具有a、b、c、d的属性。对象B具有a、b、c的属性。所以对象B具有d的属性。\n根据上述定义，下列属于类比论证的是：","options":{"A":"陶渊明不为五斗米折腰，李白不摧眉折腰事权贵······这说明有志气的人都不以高官厚禄为荣。","B":"光和声都具有直线传播、折射、反射等现象，所以光和声一样，也具有波动性。","C":"与一些工作不负责任、拈轻怕重的人相比，白求恩同志对工作极端负责，对同志、对人民极端热情，这说明白求恩同志具有毫不利己，专门利人的伟大精神。","D":"银与铜都是金属，都具有导电性，但是银的电阻率更低，因此银比铜更适宜做导电材料。"},"answer":"B","explanation":"第一步：找出定义关键词。\n“根据两个对象在某些属性上的相同或相似”、“推论两者在其他属性上也有相同或相似”。\n第二步：逐一分析选项。\nA项：该项说的是二人都有志气，但没有体现出二人在其他方面也有共性，不符合“根据两个对象在某些属性上的相同或相似”、“推论两者在其他属性上也有相同或相似”，不符合定义，排除；\nB项：该项根据光和声都具有直线传播、折射、反射等现象，推出光和声一样，也具有波动性，符合“根据两个对象在某些属性上的相同或相似”、“推论两者在其他属性上也有相同或相似”，符合定义，当选；\nC项：该项说的是白求恩与不负责任的人有什么区别，而不是共性，不符合“根据两个对象在某些属性上的相同或相似”，不符合定义，排除；\nD项：该项根据银和铜电阻率的区别，得出银更适宜做导电材料，是根据二者的区别，得出谁更适合，不符合“根据两个对象在某些属性上的相同或相似”、“推论两者在其他属性上也有相同或相似”，不符合定义，排除。\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"2741740","cat":"定义判断","stem":"比例原则是指行政机关实施行政行为应兼顾行政目标的实现和适当性手段的选择，保障公共利益和相对人权益的均衡，如为实现行政目标可能对相对人权益造成某种不利影响时，应将这种不利影响限制在尽可能小的范围和限度内，保持二者处于适度的比例。\n根据上述定义，行政机关的下列行为最符合比例原则的是：","options":{"A":"夫妻二人在家中发生口角，吵闹声较大，公安机关以扰乱公共秩序为由对二人处以罚款500元的处罚。","B":"交通运输局交通执法员黄某在查处车辆超载的过程中，殴打超载冲卡企图逃逸的司机。","C":"规划局批准某公司建造九层商业楼，该公司私自加盖至十二层，规划局认定为违章建筑，要求其把楼房全部拆除。","D":"市政府计划建设化工项目，论证后认为该项目会对附近的国家级风景区和居民生活区造成严重污染，遂将该项目叫停。"},"answer":"D","explanation":"第一步：找出定义关键词。\n“行政机关实施行政行为”、“兼顾行政目标的实现和适当性手段的选择”、“保障公共利益和相对人权益的均衡”。\n第二步：逐一分析选项。\nA项：公安机关对在家发生口角的夫妻以扰乱公共秩序为由处罚500元，该处罚相对较重，不符合“兼顾行政目标的实现和适当性手段的选择”、“保障公共利益和相对人权益的均衡”，不符合定义，排除；\nB项：执法员黄某殴打超载冲卡企图逃逸的司机，不属于正常的执法方式，不符合“兼顾行政目标的实现和适当性手段的选择”、“保障公共利益和相对人权益的均衡”，不符合定义，排除；\nC项：该公司加盖的部分楼层属于违章建筑，但要求拆除的是整栋楼房，不符合“兼顾行政目标的实现和适当性手段的选择”、“保障公共利益和相对人权益的均衡”，不符合定义，排除；\nD项：市政府叫停会造成严重污染的化工项目，符合“兼顾行政目标的实现和适当性手段的选择”、“保障公共利益和相对人权益的均衡”，符合定义，当选。\n故正确答案为D。","no":55,"missingImage":false},{"type":"question","qid":"2741617","cat":"类比推理","stem":"桂：广西","options":{"A":"皖：江西","B":"杜鹃花：映山红","C":"河流：湖泊","D":"西红柿：圣女果"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n桂是广西的简称，二者为全同关系。\n第二步：判断选项词语间逻辑关系。\nA项：皖是安徽的简称，与江西不是全同关系，与题干逻辑关系不一致，排除；\nB项：映山红是杜鹃花的别名，二者为全同关系，与题干逻辑关系一致，当选；\nC项：河流与湖泊是两种不同的水体，二者为并列关系，与题干逻辑关系不一致，排除；\nD项：圣女果指小西红柿，是西红柿的一种，二者为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":56,"missingImage":false},{"type":"question","qid":"2741619","cat":"类比推理","stem":"水生动物：卵生动物","options":{"A":"腔肠动物：软体动物","B":"甲壳纲动物：节肢动物","C":"飞行动物：哺乳动物","D":"脊椎动物：无脊椎动物"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n有的水生动物是卵生动物，有的水生动物不是卵生动物，有的卵生动物是水生动物，有的卵生动物不是水生动物，二者为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：腔肠动物和软体动物都是无脊椎动物的一种，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：甲壳纲动物是节肢动物门中的一个亚门，故甲壳纲动物是节肢动物的一种，二者为种属关系，与题干逻辑关系不一致，排除；\nC项：有的飞行动物是哺乳动物，有的飞行动物不是哺乳动物，有的哺乳动物是飞行动物，有的哺乳动物不是飞行动物，二者为交叉关系，与题干逻辑关系一致，当选；\nD项：脊椎动物是指有脊椎骨的动物，无脊椎动物是背侧没有脊椎骨的动物，二者为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":57,"missingImage":false},{"type":"question","qid":"2741622","cat":"类比推理","stem":"诗：赋：词","options":{"A":"纸：丝绸：竹简","B":"昆曲：戏剧：京剧","C":"油画：水墨画：工笔画","D":"甲骨文：隶书：楷书"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n诗、赋、词均属于中国传统文学体裁，三者为并列关系，且三者出现顺序从早到晚。\n第二步：判断选项词语间逻辑关系。\nA项：纸、丝绸和竹简是我国古今文字的载体，但纸的发明时间晚于丝绸和竹简，与题干逻辑关系不一致，排除；\nB项：昆曲又称昆剧，与京剧是并列关系；昆曲和京剧都属于我国戏剧的剧种，二者与戏剧是种属关系，与题干逻辑关系不一致，排除；\nC项：油画是以快干性的植物油为颜料作画的画种，水墨画即中国画，是由水和墨调配成墨色作画的画种，二者为并列关系；工笔画是工整细致的一类画法，水墨、浅绛、青绿、金碧、界画等艺术形式均可表现工笔画，因此工笔画和水墨画是交叉关系，与题干逻辑关系不一致，排除；\nD项：甲骨文、隶书和楷书均属于中国古代文字形体，三者为并列关系，且三者出现顺序从早到晚，与题干逻辑关系一致，当选。\n故正确答案为D。","no":58,"missingImage":false},{"type":"question","qid":"2741625","cat":"类比推理","stem":"油田：钻探：石油","options":{"A":"房产：交易：证书","B":"车站：驾驶：乘客","C":"渔场：捕捞：海鲜","D":"灯塔：搭建：轮船"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n钻探与石油构成动宾关系，油田是钻探石油的场所，油田与钻探石油构成场所对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：房产交易证书，证书是房产进行交易的凭证，与题干逻辑关系不一致，排除；\nB项：驾驶与乘客不构成动宾关系，与题干逻辑关系不一致，排除；\nC项：捕捞与海鲜构成动宾关系，渔场是捕捞海鲜的场所，渔场与捕捞海鲜构成场所对应关系，与题干逻辑关系一致，当选；\nD项：搭建轮船构成动宾关系，但灯塔不是搭建轮船的场所，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":59,"missingImage":false},{"type":"question","qid":"2741629","cat":"类比推理","stem":"铁：铜：镁","options":{"A":"棒球：排球：台球","B":"高跟鞋：高帮鞋：增高鞋","C":"高筋粉：米粉：面粉","D":"羊肉：牛肉：腊肉"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n铁、铜、镁是三种金属元素，三者是并列关系中的反对关系。\n第二步：判断选项词语间逻辑关系。\nA项：棒球、排球、台球是三种运动，三者是并列关系中的反对关系，与题干逻辑关系一致，当选；\nB项：有的增高鞋是高帮鞋，有的增高鞋不是高帮鞋，有的高帮鞋是增高鞋，有的高帮鞋不是增高鞋，二者是交叉关系，与题干逻辑关系不一致，排除；\nC项：高筋粉是面粉，二者是种属关系，米粉与面粉为并列关系，与题干逻辑关系不一致，排除；\nD项：羊肉和牛肉是并列关系，腊肉指肉经腌制后再经过烘烤（或日光下曝晒）的过程所制成的加工品，羊肉、牛肉是制作腊肉的原材料，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":60,"missingImage":false},{"type":"question","qid":"2741624","cat":"类比推理","stem":"策划：编排：直播","options":{"A":"测试：上线：研发","B":"育苗：移栽：收割","C":"学车：年检：考证","D":"选房：入住：装修"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n先策划，再编排，最后直播，三者为时间先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：先测试后上线，但是研发应该在测试和上线之前，与题干逻辑关系不一致，排除；\nB项：先育苗，再移栽，最后收割，三者为时间先后顺序的对应关系，与题干逻辑关系一致，当选；\nC项：先学车后考证，但是年检一般是在考证之后，与题干逻辑关系不一致，排除；\nD项：先选房，再装修，最后入住，装修应该在入住之前发生，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":61,"missingImage":false},{"type":"question","qid":"2741627","cat":"类比推理","stem":"老鹰：树枝：天空","options":{"A":"蜜蜂：蜂箱：花丛","B":"蟒蛇：山涧：森林","C":"蚊子：沟渠：野外","D":"鲈鱼：江河：海洋"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n老鹰在树枝上休息，老鹰在天空中飞翔，前后均是动物与地点的对应关系，并且第二个词是休息状态对应的地点，第三个词是忙碌状态对应的地点。\n第二步：判断选项词语间逻辑关系。\nA项：蜜蜂在蜂箱中休息，蜜蜂在花丛中飞翔，前后均是动物与地点的对应关系，并且第二个词是休息状态对应的地点，第三个词是忙碌状态对应的地点，与题干逻辑关系一致，当选；\nB项：蟒蛇与山涧和森林也均能组成动物与地点的对应关系，但是在这两个地点中，蟒蛇没有明显的休息和忙碌的两种状态区分，与题干逻辑关系不一致，排除；\nC项：蚊子与沟渠和野外也均能组成动物与地点的对应关系，但是在这两个地点中，蚊子没有明显的休息和忙碌的两种状态区分，与题干逻辑关系不一致，排除；\nD项：鲈鱼与江河和海洋也均能组成动物与地点的对应关系，但是在这两个地点中，鲈鱼没有明显的休息和忙碌的两种状态区分，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"2741631","cat":"类比推理","stem":"粘土：陶瓷杯：器具","options":{"A":"门窗：房屋：财产","B":"蚕丝：旗袍：服饰","C":"纸张：扉页：图书","D":"牛肉：肉馅：饺子"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n粘土是制作陶瓷杯的原材料，二者为原材料的对应关系；陶瓷杯是一种器具，二者为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：门窗是房屋的组成部分，二者为组成关系，与题干逻辑关系不一致，排除；\nB项：蚕丝是制作旗袍的原材料，二者为原材料的对应关系；旗袍是一种服饰，二者为种属关系，与题干逻辑关系一致，当选；\nC项：纸张是制作图书的原材料，二者为原材料的对应关系；扉页是图书的组成部分，二者为组成关系，与题干逻辑关系不一致，排除；\nD项：牛肉是制作肉馅的原材料，二者为原材料的对应关系；肉馅是饺子的组成部分，二者为组成关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":63,"missingImage":false},{"type":"question","qid":"2741633","cat":"类比推理","stem":"天然气：气体：燃料","options":{"A":"读后感：感想：散文","B":"量角器：圆规：文具","C":"金银花：花卉：中药","D":"互联网：网络：网站"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n天然气是一种气体，故天然气与气体为种属关系；天然气是一种燃料，故天然气与燃料为种属关系；有的气体是燃料，有的气体不是燃料，有的燃料是气体，有的燃料不是气体，故气体和燃料为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：读后感是感想的一种，二者为种属关系，但是有的读后感是散文，有的读后感不是散文，有的散文是读后感，有的散文不是读后感，故读后感和散文是交叉关系，与题干逻辑关系不一致，排除；\nB项：量角器与圆规都是文具的一种，故量角器与圆规为并列关系，量角器与文具为种属关系，圆规与文具也为种属关系，与题干逻辑关系不一致，排除；\nC项：金银花是一种花卉，故金银花与花卉为种属关系；金银花是一种中药，故金银花与中药为种属关系；有的花卉是中药，有的花卉不是中药，有的中药是花卉，有的中药不是花卉，故花卉和中药为交叉关系，与题干逻辑关系一致，当选；\nD项：互联网是网络的一种，构成种属关系，但是互联网和网站之间并无此关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"2741636","cat":"类比推理","stem":"食品：蔬菜：绿色食品","options":{"A":"电影：历史片：科幻片","B":"中国：海口市：海南省","C":"地图：交通图：单色地图","D":"孔雀：绿孔雀：蓝孔雀"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n蔬菜是食品的一种，二者为种属关系；绿色食品是指产自优良生态环境、按照绿色食品标准生产、实行全程质量控制并获得绿色食品标志使用权的安全、优质食用农产品及相关产品，绿色食品是食品的一种，二者为种属关系；有的蔬菜是绿色食品，有的蔬菜不是绿色食品，有的绿色食品是蔬菜，有的绿色食品不是蔬菜，二者为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：有的电影是历史片，有的电影不是历史片，有的历史片是电影，有的历史片不是电影，二者为交叉关系，与题干逻辑关系不一致，排除；\nB项：海口市是海南省的省会，是海南省的组成部分，二者为组成关系；海南省是中国的一个省份，是中国的组成部分，二者为组成关系，与题干逻辑关系不一致，排除；\nC项：交通图是地图的一种，二者为种属关系；单色地图是地图的一种，二者为种属关系；有的交通图是单色地图，有的交通图不是单色地图，有的单色地图是交通图，有的单色地图不是交通图，二者为交叉关系，与题干逻辑关系一致，当选；\nD项：孔雀从颜色可以分成三种，分别是蓝孔雀、绿孔雀和变种白孔雀，绿孔雀和蓝孔雀都是孔雀的一种，二者为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":65,"missingImage":false},{"type":"question","qid":"2741733","cat":"逻辑判断","stem":"运动会长跑成绩公布后，小张说：“我的排名在前五名，小夏的名次不好，小王是最后过终点的。”小夏说：“我的长跑成绩一直都在这个水平，我紧跟着小王的后面跑过终点。”小王说：“小张和小夏的成绩都比我好。”三个人中最多一个人说假话。\n据此，可以推出：","options":{"A":"小张说了假话","B":"小夏说了假话","C":"小王说了假话","D":"三人都没说假话"},"answer":"B","explanation":"第一步：找关系。\n小张：我的排名在前五名，小夏的名次不好，小王是最后过终点的；\n小夏：我的长跑成绩一直都在这个水平，我紧跟着小王的后面跑过终点；\n小王：小张和小夏的成绩都比我好；\n小张和小夏说的话不可能同时为真，根据题干“三个人中最多一个人说假话”可知，小张和小夏说的话为一真一假。\n第二步：看其余。\n根据小张和小夏说的话一真一假可知，小王说的“小张和小夏的成绩都比我好”为真，即小张和小夏在小王的前面过终点，所以小夏所说“我紧跟着小王的后面跑过终点”为假话。\n故正确答案为B。","no":66,"missingImage":false},{"type":"question","qid":"2741735","cat":"逻辑判断","stem":"不用“管住嘴，迈开腿”就能成功瘦身，大概是很多人的梦想。然而一边吃的很饱一边掉体重却成了宇航员们的噩梦，因为这会使宇航员损失骨骼和肌肉，还会影响心血管系统的正常运作。宇航员总是表示已经吃饱了，然而与此同时，他们的体重却减轻了，为什么宇航员摄入的食物不够？一位航空研究所人员提出，这是因为食物在失重环境下不会像地球上一样老实待在胃里，它们在胃里漂动，撑开胃部，会更快给大脑送去“你已经吃饱了，别再吃了”的信号。\n以下哪项如果为真，最能驳斥这个研究员的解释？","options":{"A":"宇航员必须坚持每周六天的高强度锻炼，否则低重力环境会让肌肉萎缩，但这也意味着他们会消耗更多的热量","B":"吃饭习惯于细嚼慢咽的人，通常在摄入过多的食物之前，大脑就会接受到饱胀感，从而减低食欲，避免进食过多","C":"实验证明，在失重情况下，胃壁本身的张力并不会受到太大影响，胃的内部压力也没有太大变化","D":"太空食物通常不需要太多咀嚼，研究显示，咀嚼次数越多，口腔活动会刺激体内消化和吸收活动更加活跃，热量消耗也越多"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：因为食物在失重环境下不会像地球上一样老实待在胃里，它们在胃里漂动，撑开胃部，会更快给大脑送去“你已经吃饱了，别再吃了”的信号。\n论据：无。\n本题只有论点，没有论据，优先考虑否定论点进行削弱，即食物在失重环境下不会在胃里漂动，撑开胃部，给大脑送去“你已经吃饱了，别再吃了”的信号。\n第二步：逐一分析选项。\nA项：该项讨论的是宇航员必须坚持高强度锻炼，也因此消耗更多的热量，而论点讨论的是食物在失重环境下在胃里漂动，撑开胃部，给大脑送去“你已经吃饱了，别再吃了”的信号，坚持锻炼消耗热量与食物在失重环境下在胃里的情况无关，二者话题不一致，无法削弱，排除；\nB项：该项讨论的是吃饭细嚼慢咽的人容易产生饱胀感，从而减低食欲，避免进食过多，而论点讨论的是食物在失重环境下在胃里漂动，撑开胃部，给大脑送去“你已经吃饱了，别再吃了”的信号，细嚼慢咽减低食欲与食物在失重环境下在胃里的情况无关，二者话题不一致，无法削弱，排除；\nC项：该项说明在失重情况下，胃壁本身的张力并不会受到太大影响，胃的内部压力也没有太大变化，即食物在失重环境下不会在胃里漂动，撑开胃部，否定论点，可以削弱，当选；\nD项：该项讨论的是咀嚼次数越多，热量消耗也越多，而论点讨论的是食物在失重环境下在胃里漂动，撑开胃部，给大脑送去“你已经吃饱了，别再吃了”的信号，二者话题不一致，无法削弱，排除。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"2741739","cat":"逻辑判断","stem":"环境与生活方式能使基因表达发生改变，但不涉及DNA序列的变化，研究人员发现，喝茶也能让人发生这种变化，但其作用仅限于女性。研究结果显示，经常喝茶的女性的确也出现了基因表达改变的现象，并且不少变异的基因与癌症和雌激素水平有关。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"不饮茶的女性较少出现基因表达改变的情况","B":"女性经常喝茶能减少炎症的发生","C":"常饮茶和常饮咖啡的女性雌激素水平有较大差异","D":"女性和男性体内含有的激素水平不同"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：喝茶也能让人基因表达发生改变，但其作用仅限于女性。\n论据：经常喝茶的女性的确也出现了基因表达改变的现象，并且不少变异的基因与癌症和雌激素水平有关。\n本题的论点是说喝茶会使女性的基因表达发生改变，论据是说经常喝茶的女性发生基因表达改变的现象，且不少变异的基因与癌症和雌激素水平有关。论点和论据均在讨论女性喝茶与基因表达改变的关系，话题一致，加强优先考虑补充论据，即解释原因和举例子。\n第二步：逐一分析选项。\nA项：该项指出不饮茶的女性较少出现基因表达改变的情况，补充了反面论证，补充论据，可以加强，当选；\nB项：该项指出女性经常喝茶能减少炎症的发生，但减少炎症与基因表达改变无关，话题不一致，无法加强，排除；\nC项：该项指出经常饮茶和饮咖啡的女性雌激素水平有较大差异，但题干并没有比较饮茶和饮咖啡的关系，话题不一致，无法加强，排除；\nD项：该项指出女性和男性体内含有的激素水平不同，题干并没有比较女性和男性激素水平的差异，话题不一致，无法加强，排除。\n故正确答案为A。","no":68,"missingImage":false},{"type":"question","qid":"2741741","cat":"逻辑判断","stem":"某国针对本国本科毕业生的调查数据显示，该国的大多数本科毕业生为工学类，也有一部分本科毕业生为人文社科类，在这些毕业生中，大多数在毕业时就已经就业，只有少部分未就业。\n由此一定可以推出的是：","options":{"A":"大多数工学类本科毕业生在毕业时已就业","B":"有些人文社科类本科毕业生在毕业时未就业","C":"有些工学类本科毕业生在毕业时已就业","D":"有些人文社科类毕业生在毕业时已就业"},"answer":"C","explanation":"第一步：翻译题干。\n①大多数（＞50％）本科毕业生是工学类；\n②一部分本科毕业生是人文社科类；\n③大多数（＞50％）本科毕业生在毕业时已经就业；\n④少部分本科毕业生在毕业时未就业。\n（注：逻辑上“大多数”的含义是大于50％）\n第二步：逐一分析选项。\nA项：涉及到“工学类”和“已就业”的是条件①和③，通过“大多数A是B，大多数A是C”可以得到“有的B是C”，结合条件①和③，可以得到“有的工学类毕业生在毕业时已经就业”，但是因为“有的”无法推出“大多数”，所以无法通过“有的工学类毕业生在毕业时已经就业”得到“大多数工学类毕业生在毕业时已经就业”，所以该项无法推出，排除；\nB项：涉及到“人文社科类”和“未就业”的是条件②和④，通过“有的A是B，有的A是C”无法得到“有的B是C”，所以该项无法推出，排除；\nC项：涉及到“工学类”和“已就业”的是条件①和③，通过“大多数A是B，大多数A是C”可以得到“有的B是C”，结合条件①和③，可以得到“有的工学类毕业生在毕业时已经就业”，可以推出，当选。\nD项：涉及到“人文社科类”和“已就业”的是条件②和③，因为“大多数”可以推出“有的”，所以条件③可以推出“有的本科毕业生在毕业时已经就业”，通过“有的A是B，有的A是C”无法得到“有的B是C”，所以该项无法推出，排除。\n故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"2741743","cat":"逻辑判断","stem":"日常生活中，摄像头几乎与我们如影随形。不同部门、单位甚至个人都安装了摄像头，出现了人们所到之处几乎处处都有摄像头的乱象。有专家指出，“摄像头乱象”的出现，主要原因是与视频监控系统管理相关的法律法规不健全、不完善，体现在使用主体的权限、设备的规格、监控人员的资质及素质要求、监控资料及数据的复制、传播等方面。因此，完善与视频监控系统管理相关的法律法规即可以解决“摄像头乱象”。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"在使用和管理方面，还存在视频监控资料未经合法程序即被复制、传播的现象","B":"在解决其他社会问题上，法律法规的完善并没有起到立竿见影的作用","C":"一些人对公共空间和个人空间的认识不清也是“摄像头乱象”产生的原因","D":"视频监控系统的技术标准在行业内部已基本达成共识"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：完善与视频监控系统管理相关的法律法规即可以解决“摄像头乱象”。\n论据：“摄像头乱象”的出现，主要原因是与视频监控系统管理相关的法律法规不健全、不完善，体现在使用主体的权限、设备的规格、监控人员的资质及素质要求、监控资料及数据的复制、传播等方面。\n本题的论点和论据都在讨论“摄像头乱象”和相关法律法规之间的关系，二者话题一致，优先考虑削弱论点，即完善与视频监控系统管理相关的法律法规不能解决“摄像头乱象”。\n第二步：逐一分析选项。\nA项：该项指出存在视频监控资料未经合法程序被复制、传播的现象，这与论点讨论的是否可以解决“摄像头乱象”无关，排除；\nB项：该项指出在解决其他社会问题上，完善法律法规不能起到立竿见影的作用，而论点说的是“摄像头乱象”的问题，话题不一致，无法削弱，排除；\nC项：该项指出一些人对公共空间和个人空间的认识不清也是“摄像头乱象”产生的原因，但完善相关法律法规不能解决“对公共空间和个人空间的认识不清”这一问题，证明了即使完善相关的法律法规也不能彻底解决“摄像头乱象”的问题，削弱论点，当选；\nD项：该项指出视频监控系统的技术标准在行业内部已基本达成共识，但论点说的是完善相关法律法规是否能解决“摄像头乱象”的问题，话题不一致，无法削弱，排除。\n故正确答案为C。","no":70,"missingImage":false},{"type":"question","qid":"2741725","cat":"逻辑判断","stem":"F、G、H、J四个人是大学同学，他们都参加了研究生考试，但最后只有一个人考上了研究生。而其余三人分别成为了作曲家、高中老师和公务员。在研究生考试复习期间，有一天他们坐在一起预测大家将来的生活，F说：G肯定不会成为作曲家；G说：H肯定可以考上研究生；H说：J不会成为公务员；J预测他自己将来会娶一名外国妻子。可是他们的预测中只有一个是正确的，且预测正确的那个人考上了研究生。\n据此可以推断出以下哪项是错误的？","options":{"A":"J并未娶外国人为妻","B":"F考上了研究生","C":"G成为了高中老师","D":"H成为了公务员"},"answer":"D","explanation":"第一步：分析题干条件。\nF：G肯定不会成为作曲家；\nG：H肯定可以考上研究生；\nH：J不会成为公务员；\nJ：J将来会娶一名外国妻子。\n第二步：根据题干条件进行推理。\n条件为“他们的预测中只有一个是正确的，且预测正确的那个人考上了研究生”，所以先从研究生入手。“H肯定可以考上研究生”涉及研究生，假设“H肯定可以考上研究生”为真，则与“预测正确的那个人考上了研究生”矛盾，所以H没有考上研究生，即G的预测是错误的，则G也没有考上研究生，那么H的预测也是错误的，所以J成为了公务员。因此，考上研究生的是F，则F的预测是正确的，G、H、J的预测均是错误的，即G不是作曲家，J是公务员，J没有娶外国妻子，可以推出G是高中老师，H是作曲家，即A、B、C三项均正确，D项错误。\n本题为选非题，故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"2578997","cat":"逻辑判断","stem":"研究人员对1728名抑郁症患者以及7199名非抑郁症患者进行了检查，结果显示，在这些抑郁症患者中，有65%的人患有复发性抑郁症。研究发现，患有复发性抑郁症的患者大脑中的海马体明显小很多。研究人员据此得出结论，海马体缩小是复发性抑郁症的原因。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"轻度抑郁症患者的海马体未出现缩小的现象","B":"存在认知障碍的中老年人的海马体也会缩小","C":"复发性抑郁症患者普遍伴有注意力不集中的现象","D":"社交越少，患精神类疾病时间越长，其海马体萎缩越严重"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：海马体缩小是复发性抑郁症的原因。\n论据：患有复发性抑郁症的患者大脑中的海马体明显小很多。\n本题论点和论据都是在讨论“海马体大小”与“复发性抑郁症”之间的关系，论点和论据话题一致，且论点中存在因果关系，削弱优先考虑因果倒置和他因削弱。\n第二步：逐一分析选项。\nA项：该项说明“轻度抑郁症”患者海马体的情况，而论点讨论的是“复发性抑郁症”患者海马体的情况，“轻度抑郁症”与“复发性抑郁症”并不完全一样，不明确选项，无法削弱，排除；\nB项：该项说明“认知障碍”的中老年人海马体也会缩小，而论点讨论的对象是“复发性抑郁症”患者，“认知障碍”与“复发性抑郁症”并不完全一样，二者讨论的对象不一致，无法削弱，排除；\nC项：该项说明复发性抑郁症患者存在一些症状，是在讨论患上复发性抑郁症后有哪些具体表现，而论点讨论的是复发性抑郁症的得病原因，二者讨论的话题不一致，无法削弱，排除；\nD项：社交少、患精神疾病时间长会导致海马体萎缩，题干中复发性抑郁症是精神类疾病，所以复发性抑郁症是海马体萎缩的原因，将论点中的因果关系进行了颠倒，因果倒置，当选。\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"2741728","cat":"逻辑判断","stem":"在成功的道路上，所有捷径都是弯路，所有弯路都是必经之路。因此，依附强者并不是成功道路上的捷径。\n补充以下哪项作为前提，可以使上述结论成立？","options":{"A":"所有捷径都是必经之路","B":"依附强者不是必经之路","C":"所有弯路都不是捷径","D":"依附强者都是弯路"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：依附强者并不是成功道路上的捷径。\n论据：在成功的道路上，所有捷径都是弯路，所有弯路都是必经之路。\n本题的论点可翻译为“依附强者\u003cimg data-k=\"a3a13b026980\">捷径”，论据可翻译为“捷径\u003cimg data-k=\"2dfb7d1f72f3\">弯路，弯路\u003cimg data-k=\"2dfb7d1f72f3\">必经之路”，即“捷径\u003cimg data-k=\"7b6029b3bbde\">弯路\u003cimg data-k=\"7b6029b3bbde\">必经之路”，要想使上述结论成立，可以在“依附强者与弯路”或“依附强者与必经之路”之间建立联系来进行搭桥。\n第二步：逐一分析选项。\nA项：论点讨论的是依附强者并不是成功道路上的捷径，该项指出所有捷径都是必经之路，没有提及与依附强者的关系，不是结论成立的前提，排除；\nB项：论点讨论的是依附强者并不是成功道路上的捷径，该项指出依附强者不是必经之路，是对论据的否后，否后推否前，可以得到“依附强者\u003cimg data-k=\"1ea22d0695fd\">捷径”，在“依附强者与必经之路”之间建立了联系，是结论成立的前提，当选；\nC项：论点讨论的是依附强者并不是成功道路上的捷径，该项指出所有弯路都不是捷径，没有提及与依附强者的关系，不是结论成立的前提，排除；\nD项：论点讨论的是依附强者并不是成功道路上的捷径，该项指出依附强者都是弯路，是对论据的肯后，得不到“依附强者\u003cimg data-k=\"1ea22d0695fd\">捷径”，不是结论成立的前提，排除。\n故正确答案为B。","no":73,"missingImage":false},{"type":"question","qid":"2741731","cat":"逻辑判断","stem":"一项最新研究表明，火星表面可能包含着一种叫做高氯酸镁的有毒化合物，它在紫外线下能够摧毁细菌。在实验室里，研究人员将枯草杆菌放置在短波紫外线辐射下，其状况类似于火星表面。他们发现，在此状况下，高氯酸镁具有强杀菌性，使得枯草杆菌短短几分钟之内就失去生存能力。研究人员认为，这表明火星不适宜生命存活。\n以下哪项如果为真，最能加强上述论证？","options":{"A":"枯草杆菌是太空飞船中常见的细菌","B":"地球自然界土壤中高氯酸镁的含量很低","C":"高氯酸镁对生物体的皮肤、粘膜和上呼吸道有刺激作用，危害健康","D":"火星表面的氧化铁和过氧化氢与高氯酸镁结合后杀菌性能增强十倍"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：火星不适宜生命存活。\n论据：火星表面可能包含着一种叫做高氯酸镁的有毒化合物，它在紫外线下能够摧毁细菌。在实验室里，研究人员将枯草杆菌放置在短波紫外线辐射下，其状况类似于火星表面。他们发现，在此状况下，高氯酸镁具有强杀菌性，使得枯草杆菌短短几分钟之内就失去生存能力。\n本题论点与论据均在讨论火星因为高氯酸镁的存在而不适宜生命存活，二者话题一致，加强可以考虑补充论据。\n第二步：逐一分析选项。\nA项：该项描述的是太空飞船中的情况，与题干论点讨论的话题无关，无法加强，排除；\nB项：该项描述的是地球上的情况，与题干论点讨论的话题无关，无法加强，排除；\nC项：该项表明高氯酸镁会危害健康，但是健康与生命存活的关系不明确，是不明确选项，排除；\nD项：该项表明在一定条件下高氯酸镁的杀菌性会增强，说明火星的环境确实不适宜生命的存活，补充论据，可以加强，当选。\n故正确答案为D。","no":74,"missingImage":false},{"type":"question","qid":"2741734","cat":"逻辑判断","stem":"今年入夏以来，全球持续出现高温天气。对于高温天气产生的原因，一种观点认为，入夏以来，高温天气的出现是由全球气候变暖造成的。在全球气候变暖的大背景下，高温这样的灾害性天气会有增多的趋势。反对者则认为高温天气的出现并不一定是由全球气候变暖造成的，而是与大气环流特征的变化相关。大气环流特征的变化会导致多种极端天气频繁地发生，包括高温天气。\n以下哪项如果为真，最能支持第一种观点？","options":{"A":"全球气候变暖是由大气环流特征变化导致的","B":"高温天气是暖气团控制下的温度较高的炎热天气","C":"全球气候变暖通过改变大气环流特征来改变高温等极端天气事件的强度和发生频率","D":"气象学家们认为，造成持续高温天气的原因很复杂，既有直接原因，也有间接原因"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：本题要求支持第一种观点，先找到第一种观点，即入夏以来，高温天气的出现是由全球气候变暖造成的。\n论据：在全球气候变暖的大背景下，高温这样的灾害性天气会有增多的趋势。\n本题论点和论据都在强调高温天气和全球气候变暖的关系，话题一致，因此优先考虑补充论据的方式进行加强。且本题中“第一种观点”和“第二种观点”在“打架”，因此如果能反驳第二种观点，即说明大气环流特征的变化不会导致高温天气的出现，也可以起到支持第一种观点的效果。\n第二步：逐一分析选项。\nA项：该项说的是大气环流特征变化导致全球气候变暖，说明大气环流特征变化确实会导致高温天气的出现，而论点说的是全球气候变暖导致高温天气的出现，削弱论点，无法加强，排除；\nB项：该项解释了高温天气的具体内容，与论点讨论的全球气候变暖导致高温天气的出现无关，无法加强，排除；\nC项：该项说的是全球气候变暖通过改变大气环流特征来影响高温天气，解释了全球气候变暖影响高温天气的内在机理，说明全球气候变暖是导致高温天气出现的根本原因，可以加强，当选；\nD项：该项说的是造成持续高温天气的原因既有直接原因，也有间接原因，但不明确全球气候变暖是否为高温天气出现的原因，无法加强，排除。\n故正确答案为C。","no":75,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>根据所给材料，回答76~80题。\u003c/p>\u003cp>        2019年，我国电信业务收入累计完成金额1.31万亿元，固定通信业务收入完成4161亿元，同比增长\u003cimg data-k=\"795f8d51863f\">，在电信业务收入中所占比重较上年提高2.6个百分点；移动通信业务实现收入8942亿元，同比减少\u003cimg data-k=\"e1677dab49ca\">。2014~2019年，全国移动电话4G及非4G基站数变化情况如下图所示：\u003c/p>\u003cp>\u003cimg data-k=\"c8ffa52165dc\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"2741706","cat":"综合","stem":"2019年电信业务收入比2018年：","options":{"A":"增加了不到1000亿元","B":"增加了1000亿元以上","C":"减少了不到1000亿元","D":"减少了1000亿元以上"},"answer":"A","explanation":"根据题干“2019年······比2018年”，结合选项“增加/减少\u003cimg data-k=\"3d6d1f96db11\">单位”，可判定本题为增长量计算问题。定位文字材料可得：2019年，我国电信业务收入累计完成金额1.31万亿元，固定通信业务收入完成4161亿元，同比增长\u003cimg data-k=\"795f8d51863f\">，移动通信业务实现收入8942亿元，同比减少\u003cimg data-k=\"e1677dab49ca\">。根据“电信业务收入\u003cimg data-k=\"e6c7a9c8511f\">固定通信业务收入\u003cimg data-k=\"3d6d1f96db11\">移动通信业务收入”，则电信业务收入增长量\u003cimg data-k=\"e6c7a9c8511f\">固定通信业务收入增长量\u003cimg data-k=\"3d6d1f96db11\">移动通信业务收入增长量。根据公式：增长量\u003cimg data-k=\"8614eab52def\">，可得所求\u003cimg data-k=\"cb2b58acb998\">\u003cimg data-k=\"b30ebef7d373\">\u003cimg data-k=\"1d407ddaa9d4\">\u003cimg data-k=\"ef9984f2fcf7\">\u003cimg data-k=\"29907f91f1ea\">\u003cimg data-k=\"3f1576c925b8\">\u003cimg data-k=\"8ca2a2bdc708\">亿元，即增加了不到1000亿元。\n故正确答案为A。","no":76,"missingImage":false},{"qid":"2741707","cat":"增长","stem":"2015~2019年，移动电话基站总量同比增速最快的年份是：","options":{"A":"2015年","B":"2016年","C":"2017年","D":"2019年"},"answer":"A","explanation":"根据题干“2015~2019年，移动电话基站总量同比增速最快的年份”，可判定本题为一般增长率比较问题。定位图形材料可得2014~2019年移动电话基站总量分别为：\n2014年：\u003cimg data-k=\"47097822efa5\">万个；\n2015年：\u003cimg data-k=\"8ca74073de3c\">万个；\n2016年：\u003cimg data-k=\"682c9984dccd\">万个；\n2017年：\u003cimg data-k=\"9507f7fd4a16\">万个；\n2018年：\u003cimg
