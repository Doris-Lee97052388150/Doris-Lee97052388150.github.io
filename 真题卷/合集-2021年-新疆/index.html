<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">行测真题模拟考场<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>
<div class="toast" id="toast"></div>

window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",imgBase:"",papers:[{"slug":"2021-新疆","title":"2021年新疆公务员录用考试《行测》试题（网友回忆版）","year":"2021","group":"新疆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"4629878","cat":"新思想","stem":"习近平总书记在庆祝中国共产党成立100周年大会上发表重要讲话，指出一百年前，中国共产党的先驱们创建了中国共产党，形成了（    ）的伟大建党精神，这是中国共产党的精神之源。\n①坚持真理、坚守理想\n②践行初心、担当使命\n③不怕牺牲、英勇斗争\n④对党忠诚、不负人民","options":{"A":"①②③","B":"①③④","C":"②③④","D":"①②③④"},"answer":"D","explanation":"本题考查政治常识。\n①②③④均正确，习近平总书记在庆祝中国共产党成立100周年大会上的讲话中指出：“一百年前，中国共产党的先驱们创建了中国共产党，形成了坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民的伟大建党精神，这是中国共产党的精神之源。”\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"4629885","cat":"毛中特","stem":"习近平总书记在党史学习教育动员大会上强调，我们党的百年历史，就是一部践行党的初心使命的历史，就是一部党与人民（    ）的历史。历史充分证明，江山就是人民，人民就是江山，人心向背关系党的生死存亡。\n①心连心\n②同呼吸\n③共命运\n④齐奋斗","options":{"A":"①②③","B":"①③④","C":"②③④","D":"①②③④"},"answer":"A","explanation":"本题考查政治常识。\n①②③正确，④错误，习近平总书记在党史学习教育动员大会上的讲话“二、开展党史学习教育要突出重点”部分的第三点指出：“我们党的百年历史，就是一部践行党的初心使命的历史，就是一部党与人民心连心、同呼吸、共命运的历史。”\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"4629893","cat":"新思想","stem":"习近平总书记在第三次中央新疆工作座谈会上强调，要统筹疫情防控和经济社会发展，做好“六稳”工作、落实“六保”任务，持之以恒抓好（    ）和（    ）两件大事。","options":{"A":"社会稳定 经济发展","B":"脱贫攻坚 促进就业","C":"深化改革 干部培训","D":"意识形态 社会治理"},"answer":"B","explanation":"本题考查政治常识。\nB项正确，A、C、D三项错误，习近平总书记在座谈会上强调：“要统筹疫情防控和经济社会发展，做好‘六稳’工作、落实‘六保’任务，持之以恒抓好脱贫攻坚和促进就业两件大事。要健全完善防止返贫监测和帮扶制度机制，接续推进全面脱贫与乡村振兴有机衔接，着重增强内生发展动力和发展活力，确保脱贫后能发展、可持续。要加大政策支持力度，创新体制机制，坚持就近就地就业和有序转移输出就业有机结合。要大力推动南疆经济社会发展和民生改善。要多层次、全方位、立体式讲好新疆故事，理直气壮宣传新疆社会稳定的大好局势、人民安居乐业的幸福生活。”\n故正确答案为B。","no":3,"missingImage":false},{"type":"question","qid":"4629897","cat":"时事政治","stem":"2021年2月1日，新疆维吾尔自治区第十三届人民代表大会第四次会议的政府工作报告指出，推动工业强基增效和转型升级，提升新型工业化发展水平，加快建设国家“三基地一通道”。此处，“一通道”是指：","options":{"A":"国家能源资源陆上大通道","B":"大型油气能源进口通道","C":"大型风电外送通道","D":"中俄东线天然气管道"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，B、C、D三项错误，新疆的“三基地一通道”指：大型油气生产加工和储备基地、大型煤炭煤电煤化工基地、大型风电基地，以及国家能源资源陆上大通道。\n故正确答案为A。","no":4,"missingImage":false}],"count":4,"answerable":4,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"4629890","cat":"人文常识","stem":"《中共中央 国务院关于全面推进乡村振兴加快农业农村现代化的意见》指出，要加强党对“三农”工作的全面领导，将脱贫攻坚工作中形成的组织推动、要素保障、政策支持、协作帮扶、考核督导等工作机制，根据实际需要运用到推进乡村振兴，建立健全（    ）的乡村振兴工作体系。","options":{"A":"创新引领、协调高效、融合共治","B":"顶层设计、着眼长远、协调创新","C":"上下贯通、精准施策、一抓到底","D":"基层治理、公众参与、法治保障"},"answer":"C","explanation":"本题考查政治常识。\nC项正确，A、B、D三项错误，《中共中央 国务院关于全面推进乡村振兴加快农业农村现代化的意见》在“五、加强党对‘三农’工作的全面领导”部分指出：“强化五级书记抓乡村振兴的工作机制。全面推进乡村振兴的深度、广度、难度都不亚于脱贫攻坚，必须采取更有力的举措，汇聚更强大的力量。要深入贯彻落实《中国共产党农村工作条例》，健全中央统筹、省负总责、市县乡抓落实的农村工作领导体制，将脱贫攻坚工作中形成的组织推动、要素保障、政策支持、协作帮扶、考核督导等工作机制，根据实际需要运用到推进乡村振兴，建立健全上下贯通、精准施策、一抓到底的乡村振兴工作体系。”\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"4629901","cat":"地理国情","stem":"“十四五”时期，新疆将深入实施新型城镇化战略，培育乌鲁木齐都市圈，构建北疆城市带以（    ）为中心、打造南疆城市群以喀什为中心，形成规模适度、功能完备、布局合理的城镇体系。","options":{"A":"克拉玛依市","B":"伊宁市","C":"霍尔果斯市","D":"吐鲁番市"},"answer":"B","explanation":"本题考查政治常识。\nB项正确，A、C、D三项错误，2020年12月8日至9日，新疆维吾尔族自治区党委九届十一次全会召开，明确“十四五”时期，新疆将深入实施新型城镇化战略，培育乌鲁木齐都市圈，构建以伊宁市为中心的北疆城市带，打造以喀什为中心的南疆城市群，形成规模适度、功能完备、布局合理的城镇体系。\n故正确答案为B。","no":6,"missingImage":false},{"type":"question","qid":"4629903","cat":"地理国情","stem":"（    ）是在新疆准噶尔盆地发现的10亿吨级砾岩油区，也是世界最大的砾岩油田，其埋藏的环烷基原油属于原油中的稀缺资源。","options":{"A":"白碱滩油田","B":"彩南油田","C":"塔里木油田","D":"玛湖油田"},"answer":"D","explanation":"本题考查政治常识。\nD项正确，A、B、C三项错误，2017年，中国石油新疆油田公司在准噶尔盆地玛湖凹陷中心区发现了10亿吨级玛湖砾岩大油区，这是世界上首次在凹陷中心区发现十亿吨级砾岩大油区，为目前世界上发现的最大砾岩油田。\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"4629917","cat":"地理国情","stem":"2021年6月，国务院公布了第五批国家级非物质文化遗产代表性项目名录，其中新疆有5项入选，包括伊宁市俄罗斯族巴扬艺术、塔城市俄罗斯族踢踏舞、（    ）、青河县姑娘追、（    ）。\n①于田县维吾尔族曲棍球\n②阿图什市柯尔克孜族约隆歌\n③木垒县哈萨克族刺绣\n④莎车县维吾尔达瓦孜杂技","options":{"A":"①③","B":"①④","C":"②④","D":"③④"},"answer":"A","explanation":"本题考查政治常识。\n①③正确，②④错误，新疆入选第五批国家级非物质文化遗产代表性项目名录的有：伊宁市俄罗斯族巴扬艺术、塔城市俄罗斯族踢踏舞、于田县曲棍球（维吾尔族曲棍球）、青河县姑娘追、木垒县哈萨克族刺绣。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"4629921","cat":"地理国情","stem":"下列说法正确的是：","options":{"A":"艾比湖位于吐鲁番市，海拔-154.31米，是中国陆地的最低点","B":"新疆且末县，面积约20.23万平方公里，是全国面积最大的县","C":"慕士塔格冰川位于喀什地区塔什库尔干县，是中国最大的冰川","D":"塔里木盆地面积40多万平方公里，是全国面积最大的内陆盆地"},"answer":"D","explanation":"本题考查地理国情。\nA项错误，艾丁湖，位于吐鲁番市南50公里的恰特卡勒乡境内，海拔低于海平面155米，是中国陆地的最低点，也是世界上除死海外离地球中心最近的地方。艾比湖，位于准噶尔盆地，是新疆最大的咸水湖，湖区气候极端干旱，湖区景观极度荒凉。\nB项错误，若羌县，地处新疆巴音郭楞蒙古自治州东南部，行政面积20.23万平方千米，是全国辖区总面积最大的县，曾是古“丝绸之路”的必经要道。且末县，位于新疆维吾尔自治区南部，总面积138680平方千米，为全国面积第二大县。\nC项错误，中国最大的冰川是音苏盖提冰川，位于中国新疆自治区喀喇昆仑山脉乔戈里峰北坡，冰川总长约42公里，冰舌长约4200米，覆盖面积达380平方千米。慕士塔格冰川位于喀什地区的塔什库尔干县，但不是中国最大冰川。\nD项正确，塔里木盆地，位于中国新疆南部，约40多万平方千米，是中国面积最大的内陆盆地，里面蕴藏着丰富的石油、天然气资源，分别约占全国油、气资源蕴藏量的\u003cimg data-k=\"6f9d0abe3e0f\">和\u003cimg data-k=\"a8b04cd19bab\">。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"4629928","cat":"地理国情","stem":"2021年6月30日，京新高速全线建成通车，途径北京、河北、山西、内蒙古、甘肃、新疆六省份，至此北京至乌鲁木齐开通了一条高速公路通道。关于“京新高速”，下列说法正确的是：","options":{"A":"连接东北、华北、西北最快捷大通道，被称为“三北大捷道”","B":"途经温带季风气候、温带草原气候、温带大陆性气候、高原山地气候","C":"途经平原、山岭、高原、沙漠、盆地、丘陵等典型地形","D":"世界上穿越沙漠最长的高速，是我国第六条进出疆高速公路"},"answer":"A","explanation":"本题考查地理国情。\nA项正确，D项错误，“京新高速”横贯东北、华北、西北，是西北新疆和河西走廊连接首都北京、华北、东北及内地东部地区的最快捷的公路通道，也称“三北大捷道”。其全长约2739公里，是我国第二条进出疆高速公路，也是世界上穿越沙漠最长的高速公路。\nB项错误，“京新高速”途经北京、河北、山西、内蒙古、甘肃、新疆六省份，其中，北京、河北、山西属于温带季风气候；内蒙古、甘肃、新疆属于温带大陆性气候。\nC项错误，“京新高速”途经北京、河北、山西、内蒙古、甘肃、新疆六省份，分别是平原、山岭、高原、沙漠等典型地形，但没有盆地、丘陵两种地形。中国四大盆地指新疆南部的塔里木盆地、四川盆地、青海西北部的柴达木盆地、新疆北部准噶尔盆地；中国丘陵地形主要分布在东部地区，自北向南主要有：辽东丘陵、山东丘陵、东南丘陵。\n故正确答案为A。","no":10,"missingImage":false},{"type":"question","qid":"4629931","cat":"地理国情","stem":"2021年4月29日11时23分，中国空间站（    ）在海南文昌航天发射场发射升空，准确进入预定轨道，任务取得成功。建造空间站、建成国家太空实验室，是实现我国载人航天工程“三步走”战略的重要目标，是建设科技强国、航天强国的重要引领性工程。","options":{"A":"天问核心舱","B":"天舟核心舱","C":"天和核心舱","D":"玉兔核心舱"},"answer":"C","explanation":"本题考查科技常识。\n我国载人航天“三步走”的发展战略为：第一步，发射载人飞船，建成初步配套的试验性载人飞船工程，开展空间应用实验；第二步，突破航天员出舱活动技术、空间飞行器交会对接技术，发射空间实验室，解决有一定规模的、短期有人照料的空间应用问题；第三步，建造空间站，解决有较大规模的、长期有人照料的空间应用问题。2021年4月29日11时23分，长征五号B遥二运载火箭搭载空间站天和核心舱，在海南文昌航天发射场发射升空，发射任务取得圆满成功。天和核心舱是中国空间站发射入轨的首个舱段，主要用于空间站统一控制和管理，具备长期自主飞行能力，可支持航天员长期驻留，开展航天医学、空间科学实验和技术试验，此次发射任务成功，标志着中国空间站在轨组装建造全面展开，为后续关键技术验证和空间站组装建造顺利实施奠定了坚实基础。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"4629934","cat":"人文常识","stem":"关于“一带一路”沿线国家，下列说法错误的是：","options":{"A":"科威特是石油输出国组织成员国之一","B":"新加坡毗邻世界上最大的海湾","C":"土耳其横跨欧亚两大洲","D":"希腊是共和制国家"},"answer":"B","explanation":"本题考查地理国情。\nA项正确，石油输出国组织简称“欧佩克”（OPEC），是亚、非、拉石油生产国为协调成员国石油政策、反对西方石油垄断资本的剥削和控制而建立的国际组织，于1960年9月成立，总部设在奥地利维也纳。其宗旨是：协调和统一成员国石油政策，维持国际石油市场价格稳定，确保石油生产国获得稳定收入。现有13个成员国是：阿尔及利亚、安哥拉、刚果、赤道几内亚、加蓬、伊朗、伊拉克、科威特、利比亚、尼日利亚、沙特阿拉伯、阿拉伯联合酋长国、委内瑞拉。\nB项错误，新加坡是东南亚的一个岛国，北隔柔佛海峡与马来西亚为邻，南隔新加坡海峡与印度尼西亚相望，毗邻马六甲海峡南口，国土除新加坡岛（占全国面积的88.5%）之外，还包括周围63个小岛。孟加拉湾是世界上最大的海湾，属于印度洋的一个海湾。孟加拉湾沿岸有七国：斯里兰卡、印度、孟加拉国、缅甸、泰国、马来西亚和印度尼西亚。新加坡不与孟加拉湾毗邻。\nC项正确，土耳其是一个横跨欧亚两洲的国家，国土包括西亚的小亚细亚半岛（安纳托利亚半岛）和南欧巴尔干半岛的东色雷斯地区。北临黑海，南临地中海，东南与叙利亚、伊拉克接壤，西临爱琴海并与希腊以及保加利亚接壤，东部与格鲁吉亚、亚美尼亚、阿塞拜疆和伊朗接壤。土耳其地理位置和地缘政治战略意义极为重要，是连接欧亚的十字路口。\nD项正确，共和制作为“君主制”的对称，是指通过选举产生最高国家机关或国家元首的一种政治制度，通常与代议民主制通用。希腊是地处欧洲东南角、巴尔干半岛南端的共和制国家，全国由半岛南部的伯罗奔尼撒半岛和爱琴海中的3000余座岛屿构成。\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"4629935","cat":"地理国情","stem":"下列我国重要地理分界线对应错误的一项是：","options":{"A":"黑河——腾冲一线：人口密度分界线","B":"秦岭——淮河一线：南方与北方地区分界线","C":"大兴安岭——贺兰山一线：外流与内流区界线","D":"鸭绿江口——天山—线：干旱与半干旱区界线"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，黑河——腾冲一线，即瑷珲——腾冲线，又名胡焕庸线，是一条贯穿中国版图的假想直线段，是我国著名地理学家胡焕庸（1901～1998）在1935年提出的划分我国人口密度的对比线。该线从中国东北边境的黑龙江省黑河市（原名“瑷珲”）一直延伸到中国西南边境的云南省腾冲市（县级市），大致地划分出了中国人口在区域上的分布，体现了中国人口东南和西北的分布区域之悬殊差异。\nB项正确，秦岭——淮河一线是中国地理区分北方地区和南方地区的地理分界线。在此线的北面和南面，自然条件、地理风貌、农业生产或是人民生活习俗，均有明显不同。\nC项正确，外流区和内流区的界线北段大体沿大兴安岭——阴山——贺兰山——祁连山（东端）一线，南段比较接近200毫米等降水量线。最终能流入海洋的河流叫外流河，外流河的流域称为外流区。最终流入内陆湖泊或在内陆断流的河流叫内流河，内流河的流域称为内流区。主要外流河：黑龙江、辽河、海河、黄河、长江、淮河、闽江、珠江、澜沧江、怒江、雅鲁藏布江、额尔齐斯河。主要内流河：塔里木河、黑河。\nD项错误，鸭绿江口——长城(山西境内稍偏南)——祁连山——天山一线是暖温带与中温带的分界线”。干旱地区与半干旱地区分界线是从内蒙古自治区西部经河西走廊西部以及藏北高原一线，与200mm等降水量线重合。\n本题为选非题，故正确答案为D。","no":13,"missingImage":false},{"type":"question","qid":"4629942","cat":"科技常识","stem":"新冠肺炎疫情爆发后，世界各国陆续开展新冠疫苗的研制和接种工作。截止目前，中国已研制并接种多种疫苗。关于新冠疫苗，下列说法正确的是：","options":{"A":"接种后发热疼痛反应越明显则疫苗效果越好","B":"接种疫苗是实现群体免疫的有效途径","C":"接种疫苗后接种者核酸检测呈阳性","D":"新冠疫苗均属于RNA疫苗"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，新冠病毒疫苗不良反应分为一般反应和异常反应，前者主要表现为接种部位红肿、硬结、疼痛等局部反应，以及发热、乏力、头痛等全身反应，是一过性的、轻微的机体反应，通常不需要治疗；后者主要指造成受种者的器官或功能损害的相关反应，常表现为急性严重过敏性反应等，极少发生，需要及时就诊治疗。接种新冠病毒疫苗后不良反应因人而异，存在个体差异。接种完疫苗后反应明显，并不意味着疫苗效果好，两者没有直接关系。\nB项正确，一般而言，传染病的传染力越强，则需要越高的人群免疫力。人群免疫力跟疫苗保护效力和疫苗的接种率呈正比。因此，要达到足够的人群免疫力，需要有足够高的接种率，也就是绝大多数人都接种疫苗。反之，如果不接种的人比较多或大多数人不愿去接种，就形成不了牢固的免疫屏障，有传染源存在时，容易出现疾病的传播。因此，接种疫苗是实现群体免疫的有效途径。\nC项错误，《全员新型冠状病毒核酸检测组织实施指南（第二版）》明确，被采样人员采样前48小时不能接种新冠病毒疫苗。因为接种新冠病毒疫苗后48小时内进行核酸检测可能检出假阳性结果。而超过48小时后可以进行核酸检测，核酸检测大多采集的是呼吸道标本，而新冠病毒疫苗是在上臂三角肌处进行接种，且我国目前接种的新冠病毒疫苗是把病毒灭活后制成的，并不会在体内增殖，也不会使人感染病毒，因此不会出现由于接种疫苗后接种者核酸检测呈阳性的情况。题干之说接种疫苗后核酸检测呈阳性，说法不准确。\nD项错误，目前新冠疫苗的种类主要有核酸疫苗（分为RNA疫苗和DNA疫苗）、灭活病毒疫苗、基因工程亚单位疫苗、重组病毒载体疫苗等。\n故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"4629948","cat":"人文常识","stem":"下列行为构成侵犯著作权罪的是：","options":{"A":"小李在某音乐节目中翻唱其他歌手的歌曲而未标明原唱","B":"小王假冒著名画家的署名出售自己的美术作品获利12万元","C":"小张在某大型摄影展中拍摄一幅作品，后临摹出售获利10万元","D":"博物馆为陈列及保存版本的需要，未经著者同意复制本馆收藏的作品"},"answer":"B","explanation":"本题考查法律常识。\nB项正确，A、C、D三项错误，根据《刑法》第二百一十七条规定，以营利为目的，有下列侵犯著作权或者与著作权有关的权利的情形之一，违法所得数额较大或者有其他严重情节的，处三年以下有期徒刑，并处或者单处罚金；违法所得数额巨大或者有其他特别严重情节的，处三年以上十年以下有期徒刑，并处罚金：（一）未经著作权人许可，复制发行、通过信息网络向公众传播其文字作品、音乐、美术、视听作品、计算机软件及法律、行政法规规定的其他作品的；（二）出版他人享有专有出版权的图书的；（三）未经录音录像制作者许可，复制发行、通过信息网络向公众传播其制作的录音录像的；（四）未经表演者许可，复制发行录有其表演的录音录像制品，或者通过信息网络向公众传播其表演的；（五）制作、出售假冒他人署名的美术作品的；（六）未经著作权人或者与著作权有关的权利人许可，故意避开或者破坏权利人为其作品、录音录像制品等采取的保护著作权或者与著作权有关的权利的技术措施的。根据《最高人民法院、最高人民检察院关于办理侵犯知识产权刑事案件具体应用法律若干问题的解释》第五条的规定，以营利为目的，实施刑法第二百一十七条所列侵犯著作权行为之一，违法所得数额在三万元以上的，属于“违法所得数额较大”······B项，小王假冒著名画家的署名出售自己的美术作品获利12万元，属于《刑法》第二百一十七条规定的“制作、出售假冒他人署名的美术作品”的行为，且数额达到犯罪标准，构成侵犯著作权罪。\n故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"4629952","cat":"经济常识","stem":"如果王先生作为一位退伍军人享受到由国家财政拨款对其及家属的优待。那么他享受到的社会保障制度是：","options":{"A":"社会优抚","B":"社会福利","C":"社会保险","D":"社会救济"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，社会优抚是针对军人及其家属所建立的社会保障制度，是指国家和社会对军人及其家属所提供的各种优待、抚恤、养老、就业安置。优抚优待的资金主要由国家财政支出。优抚对象主要包括中国人民解放军现役军人和武警官兵；革命伤残军人；复员退伍军人；革命烈士家属；因公牺牲军人家属；病故军人家属；现役军人家属等。\nB项错误，社会福利是指国家依法为所有公民普遍提供旨在保证一定生活水平和尽可能提高生活质量的资金和服务的社会保障制度。一般社会福利主要指社会服务事业及设施。\nC项错误，社会保险是指一种为丧失劳动能力、暂时失去劳动岗位或因健康原因造成损失的人口提供收入或补偿的一种社会和经济制度，主要项目包括养老保险、医疗保险、失业保险、工伤保险、生育保险。在中国，社会保险是社会保障体系的重要组成部分，其在整个社会保障体系中居于核心地位。另外，社会保险是一种缴费性的社会保障，资金主要是用人单位和劳动者本人缴纳，政府财政给予补贴并承担最终的责任。但是劳动者只有履行了法定的缴费义务，并在符合法定条件的情况下，才能享受相应的社会保险待遇。\nD项错误，社会救济是指国家和社会对陷入生活困境的公民，给予物质接济和扶助，以保障其最低生活标准的制度。国家和社会为保证每个公民享有基本生活权利，而对贫困者提供物质帮助。国家和社会以多种形式对因自然灾害、意外事故和残疾等原因而无力维持基本生活的灾民、贫民提供救助。包括提供必要的生活资助、福利设施，急需的生产资料、劳务、技术、信息服务等。\n故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"4629954","cat":"人文常识","stem":"建党100周年前夕，中国正式获得无疟疾认证，被世卫组织正式宣布成为完全消灭疟疾的国家。关于疟疾，下列说法正确的是：","options":{"A":"中国是全世界唯一全面消灭疟疾的国系","B":"青蒿素是治疗疟疾的特效药","C":"疟疾是一种呼吸道传染病","D":"黑死病是疟疾的一种"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，无疟疾国家，是指在世界卫生组织获得无疟疾认证的国家。如果该国可以证明，在至少连续3年内，按蚊引起的本地疟疾传播链在全国范围内已被阻断，世卫组织就会予以认证。此外，该国还必须证明其有能力防止疟疾再次传播。2021年6月30日，世卫组织宣布中国获得无疟疾认证。全球范围内共有40个国家和地区获得了世卫组织的无疟疾认证。\nB项正确，青蒿素来源于我国传统药用植物黄花蒿，是治疗疟疾的特效药，以青蒿素类药物为主的联合疗法，也是当下治疗疟疾的最有效最重要手段。\nC项错误，呼吸道传染病是指病原体从人体的鼻腔、咽喉、气管和支气管等呼吸道感染侵入而引起的有传染性的疾病。疟疾是经按蚊叮咬或输入带疟原虫者的血液而感染疟原虫所引起的虫媒传染病，主要表现为周期性规律发作，全身发冷、发热、多汗，长期多次发作后，可引起贫血和脾肿大。疟疾不属于呼吸道传染病。\nD项错误，鼠疫在十四世纪时被称为“黑死病”，曾在欧洲造成约5000万人死亡。鼠疫是鼠疫耶尔森菌借鼠蚤传播为主的烈性传染病，系广泛流行于野生啮齿类动物间的一种自然疫源性疾病，临床主要表现为高热、淋巴结肿痛、出血倾向、肺部炎症等。鼠疫传染性强，如果不治疗，病死率高达30%~60%。\n故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"4629957","cat":"人文常识","stem":"水保持液态时，水温变化\u003cimg data-k=\"96e33e2f1423\">吸收或者释放的热量是空气温度变化\u003cimg data-k=\"96e33e2f1423\">吸收或释放热量的三倍左右。以下充分利用了水的这一特性的是：\n①空气干燥时，使用加湿器保持空气湿润\n②病人发热时，为病人擦身以便降低体温\n③汽车行驶时，通过水循环为发动机降温\n④寒冷的冬季，人们经常使用暖水袋取暖","options":{"A":"①②","B":"②③","C":"②④","D":"③④"},"answer":"D","explanation":"本题考查科技常识。\n“水保持液态时，水温变化\u003cimg data-k=\"b5588e7a7ce5\">吸收或者释放的热量是空气温度变化\u003cimg data-k=\"b5588e7a7ce5\">吸收或释放热量的三倍左右”阐述的是水的比热容比空气的比热容大的原理。比热容是指单位质量的某种物质升高（或下降）单位温度所吸收（或放出）的热量。\n①错误，加湿器是一种增加房间湿度的家用电器。加湿器按用途主要分为家用加湿器和工业用加湿器两种类型。其主要作用就是增加空气中水蒸气的含量，使环境湿度增加，与比热容无关。\n②错误，发热时为病人擦身体降低体温利用的是蒸发吸热的原理，身体表面的水蒸发时会吸收身体的热量，使病人身体温度降低，与比热容无关。\n③正确，用水给汽车发动机降温时，热量从发动机传递到水，发动机温度降低，水的温度升高，因为水的比热容较大，水与空气升高温度相同时，水可以吸收更多的热量，从而使发动机的温度降得更低。\n④正确，用暖水袋取暖是因为水的比热容较大，暖水袋中的水由热变冷时，在降低温度相同的情况下，水会比空气放出更多热量。\n综上，③④正确。\n故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"4629960","cat":"人文常识","stem":"关于棉花，下列说法正确的是：","options":{"A":"中国是世界最大的棉花生产国、第二大棉花消费国","B":"棉籽表面的一层短绒是制作火药的重要原材料之一","C":"棉籽里富含多种有机成分，是理想的食用菌培养基","D":"棉籽壳经过粉碎加工制成的纤维板可用来制造家具"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，棉花是中国主要商业作物，中国34个省份中就有24个种植棉花。根据产量看，我国是世界第一大棉花生产国；根据面积看，印度是世界第一大棉花生产国。同时，我国是第一大的棉花消费国。\nB项正确，棉籽表面的一层短绒即棉短绒，是经过轧花后的棉籽（毛籽）上残留着的短纤维，是棉籽上面、没有正常发育长成的棉纤维细胞。棉短绒是制作火药的重要原材料之一，如1000克二类绒制成的无烟火药可装配子弹1000多发。棉短绒是国防、纺织、化纤、造纸等轻、化工业的重要原料，是重要的战略物资。\nC项错误，棉籽是棉花作物的种籽。由棉铃中采取的棉花称籽棉，由籽棉上轧下来的棉纤维称皮棉，籽棉除去皮棉后，即可取得棉籽。棉籽仁富含蛋白质和多种氨基酸，其含量是小麦的1-2倍，粉碎后用途广泛。棉籽壳含纤维素、木质素和氮、磷、钾等营养成分，且酸碱适中、保水通气，是理想的食用菌培养基。\nD项错误，棉花秸秆是棉花种植业的副产物，是指除去枝叶及棉桃的棉花茎秆，棉秆是半木质化秸秆，其纤维长度和长宽比与木材相近，可造出质量优于稻草、麦秸秆的坚实牛皮纸、包装纸和纸板箱纸，而且可部分代替木质浆，生产中低档纸质用品，降低木质浆的消耗。棉秆的化学组成与木材类似，全纤维素含量为56%，含木质素22%。利用棉秆可生产刨花板、中密度纤维板、纸板箱等，可用来制造家具。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"4629964","cat":"科技常识","stem":"关于能源的说法，下列不正确的是：","options":{"A":"可燃冰是以甲烷为主的可燃固体","B":"石油、天然气和煤都属于化石燃料","C":"汽油、煤油、天然气都属于二次能源","D":"柴油牌号是按照柴油的凝固点划分"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，天然气水合物即可燃冰，是天然气与水在高压低温条件下形成的类冰状结晶物质，外观像冰，遇火即燃，分布于深海沉积物或陆域永久冻土中，有强大的燃烧力，主要由水分子和烃类气体分子（主要是甲烷）组成。其主要成分是甲烷。\nB项正确，化石燃料也称矿石燃料，是一种烃或烃的衍生物的混合物，包括煤、石油和天然气等。化石燃料是由古代生物的遗骸经过一系列复杂变化而形成的，是不可再生资源。\nC项错误，能源按基本形态分类，可分为一次能源和二次能源。一次能源是指自然界中以原有形式存在的、未经加工转换的能量资源，又称天然能源，如煤炭、石油、天然气、太阳能等；二次能源是指由一次能源经过加工转换以后得到的能源，如电能、汽油、柴油、液化石油气、煤油等。\nD项正确，我国柴油牌号是根据凝点分级的。柴油分为轻柴油（沸点范围约180-370\u003cimg data-k=\"3aa3bde13251\">）和重柴油（沸点范围约350-410\u003cimg data-k=\"8afadf6ce3b2\">）两大类。柴油按凝点分级，轻柴油有5、0、-10、-20、-35、-50六个牌号，重柴油有10、20、30三个牌号。凝点是评定柴油流动性的重要指标，它表示燃料不经加热而能输送的最低温度。柴油的凝点是指油品在规定条件下冷却至丧失流动性时的最高温度。\n本题为选非题，故正确答案为C。","no":20,"missingImage":false},{"type":"question","qid":"4629966","cat":"人文常识","stem":"关于气象现象的说法，下列不正确的是：","options":{"A":"彩虹俗称龙吸水，如果条件合适的话，可以看见整圈圆形的彩虹","B":"气象灾害预警信号依次分为黄色、蓝色、橙色、红色四个等级","C":"雪花之所以多呈六角形是因为冰的分子以六角形为最多","D":"处暑即“出暑”，是炎热离开的意思，该节气已是秋天"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，彩虹在民间俗称“杠吃水”、“龙吸水”，是因为阳光射到空中接近圆型的小水滴，太阳光发生色散及反射形成的。我们平时看见的彩虹只是半弧形的，这是因为地平线挡住了它的下半部分。而太阳的高度可以决定彩虹弧度的多少，太阳在天空中越低，彩虹的底部就越高。因此站得越高，看到的彩虹弧度就越完整。科学证明，所有的彩虹都是全圆形的，只是我们平时无法从地面上看到，通常只有飞行员才能见到这种自然奇观。\nB项错误，气象灾害预警信号总体上分为蓝色、黄色、橙色和红色四个等级（Ⅳ、Ⅲ、Ⅱ、Ⅰ级），分别代表一般、较重、严重和特别严重。\nC项正确，雪花是由小冰晶增大变来的，而冰的分子以六角形的为最多，因而形成雪花多是六角形的。雪花多呈六角形与水汽凝华结晶时的晶体习性有关，水汽凝华结晶成的雪花和天然水冻结的冰都属于六方晶系。六方晶系由四个结晶轴构成，其中三个辅轴在一个基面上，互相以\u003cimg data-k=\"c1ec48dc2933\">的角度相交，第四轴（主晶轴）与三个辅轴所形成的基面垂直。当水汽凝华结晶时，倘若主晶轴发育得比另外三个辅轴快，并且延伸很长，那么晶体就会形成柱状；而如果主晶轴发育慢，且很短，那么晶体就形成片状。雪花之所以都是六角形，是因为它沿主晶轴方向晶体生长的速度要比沿三个辅轴方向慢得多。\nD项正确，处暑是二十四节气之第十四个节气，是一个反映气候变化的节气，于每年公历8月22-24日交节。处暑，即为“出暑”，是炎热离开的意思。这时三伏已过或近尾声，初秋炎热将结束。处暑的到来同时也意味着进入干支历申月的下半月。从处暑开始，气温逐步走低的趋势进一步明显。\n本题为选非题，故正确答案为B。","no":21,"missingImage":false},{"type":"question","qid":"4629969","cat":"人文常识","stem":"下列关于中国远古文化的说法，不正确的是：","options":{"A":"龙山文化是铜石并用时代文化","B":"河姆渡文化是中国长江流域下游地区的文化","C":"红山文化的社会形态初期处于母系氏族社会","D":"仰韶文化制陶业发达，在考古上常将其称为黑陶文化"},"answer":"D","explanation":"本题考查人文常识。\nA项正确，龙山文化，泛指中国黄河中、下游地区的约新石器时代晚期的一类文化遗存，属于铜石并用时代文化，因首次发现于山东省济南市历城县龙山镇（今属济南市章丘区）而得名。龙山文化挖掘出了许多薄、硬、光、黑的陶器，尤其是蛋壳黑陶（分布日照、济南）最具特色，所以也叫它“黑陶文化”。\nB项正确，河姆渡文化，是指中国长江流域下游以南地区的新石器时代文化，因第一次发现于浙江宁波余姚的河姆渡镇而命名，以黑陶和“干栏式房屋”为特色。在这个遗址发现了大量人工栽培的稻谷遗存，这是目前世界上最古老、最丰富的稻作文化遗址，它的发现改变了中国栽培水稻从印度引进的传统传说。\nC项正确，红山文化，发源于东北地区西南部，以辽河流域中的支流西拉沐沦河、老哈河、大凌河为中心，距今五六千年前左右，延续时间达两千年之久。其社会形态初期处于母系氏族社会的全盛时期，主要社会结构是以女性血缘群体为纽带的部落集团，晚期逐渐向父系氏族过渡；经济形态以农业为主，兼以牧、渔、猎并存。\nD项错误，仰韶文化，是指黄河中游地区的一种新石器时代彩陶文化，距今约7000年至5000年，持续时长2000年左右，因1921年首次在河南省三门峡市渑池县仰韶村发现而命名。这一时期彩陶大范围传播，被考古学家认为是代表了史前第一次艺术浪潮，达到史前艺术的高峰。黑陶文化是指龙山文化。\n本题为选非题，故正确答案为D。","no":22,"missingImage":false},{"type":"question","qid":"4629971","cat":"人文常识","stem":"下列说法中，最有可能出现的情景是：","options":{"A":"华佗曾拜读了《伤寒杂病论》","B":"医师曾用《千金方》的药方给司马炎治病","C":"关汉卿生病时安排家丁按《本草纲目》的说明上山采药","D":"秦朝时期部分王公贵族通过操练“五禽戏”来加强锻炼"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，《伤寒杂病论》作者是东汉末年张仲景，是一部论述外感病与内科杂病为主要内容的医学典籍，系统地分析了伤寒的原因、症状、发展阶段和处理方法，创造性地确立了对伤寒病的“六经分类”的辨证施治原则，奠定了理、法、方、药的理论基础。华佗，东汉末年著名的医学家，主要成就是发明麻沸散、五禽戏，被后人称为“外科圣手”、“外科鼻祖”，与董奉、张仲景并称为“建安三神医”。华佗和张仲景生活在同一时期，故有可能拜读了《伤寒杂病论》。\nB项错误，《千金方》又称《千金要方》，作者是唐朝孙思邈，此书总结了唐代以前医学成就，被誉为中国最早的临床百科全书。司马炎，晋朝开国皇帝，在位初期，革新政治，振兴经济，使得经济社会呈现繁荣景象，史称“太康之治”。司马炎生活年代早于唐朝，故医师不可能用《千金方》的药方给他治病。\nC项错误，关汉卿，元杂剧奠基人，著有《窦娥冤》《救风尘》《拜月亭》等作品，与白朴、马致远、郑光祖并称为“元曲四大家”。《本草纲目》作者是明代医药学家李时珍，集我国16世纪之前药学之大成，收载药物1892种，附药图1000余幅，阐发药物的性味、主治、用药法则、产地、形态、采集、炮制、方剂配伍等，被誉为中国古代的百科全书。关汉卿的生活年代早于明代，故不可能在生病时安排家丁按照《本草纲目》的说明上山采药。\nD项错误，“五禽戏”是中国传统的一个养生功法，“五禽”分别是指虎、鹿、熊、猿、鸟，创编者是东汉末年医学家华佗。秦朝时“五禽戏”还不存在，王公贵族不可能通过操练“五禽戏”来加强锻炼。\n故正确答案为A。","no":23,"missingImage":false},{"type":"question","qid":"4629975","cat":"人文常识","stem":"有关避免雷击的方法，下列错误的是：","options":{"A":"在户外遇到雷雨天气，可在汽车内躲避","B":"如果在雷电交加时头发突然竖起，说明马上要发生雷击，应尽快逃离现场，找寻干燥室内躲避","C":"户外露营应选择整体地势和植被高度较低，并且能与高大植株或建筑保持一定距离的地点扎营","D":"如果在户外看到高压线遭雷击断裂，则应双脚并拢，跳离现场"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，汽车外壳是金属制作的，十分接近于法拉第笼的条件。当驾驶员在雷雨天行驶时，即便很不幸地被雷电击中，由于法拉第笼效应的存在，汽车内部的电磁环境基本不受影响，车内的人就可以安全待在里面。同时，雷电流会借助雨水通过车体表面达到车轴的位置，通过潮湿的轮胎很快就会将电流传递到地面。所以，车内是在室外较为理想的避雷场所。（“法拉第笼”原理简单来说，就是当有高压电产生时，根据接地导体静电平衡的条件，笼体是一个等位体，内部电势差为零，电场为零，所以笼体的内部不会有电流通过，即使待在笼体内部也不会触电。）\nB项错误，如果雷电交加时在户外遇到头发竖立时，应该下蹲，两脚并拢，两手抱头藏在两膝间，捂住耳朵。原因是，下蹲可以减少自身的高度，避免自己成为高高竖立的目标，从而把雷引过来。\nC项正确，越高的导体，雷电会越先击中。所以在户外露营搭建帐篷的时候尽量选择地势稍低的地方，同时也要避免紧邻高点扎营，否则照样会被电弧击中。理想的方式是选择整体地势和植被高度较低，并且能与高大植株或建筑保持一定距离的地点扎营。\nD项正确，如果在户外看到高压线遭雷击断裂，此时应提高警惕，因为高压线断点附近存在跨步电压，身处附近的人此时千万不要跑动，而应双脚并拢，跳离现场。\n本题为选非题，故正确答案为B。","no":24,"missingImage":false},{"type":"question","qid":"4629977","cat":"人文常识","stem":"根据伯努利效应，当流体经过物体表面时，流速较快的一面压力越小，流速越慢的一面压力越大，当物体两面的压力差达到一定程度时，便会发生位移。以下物体没有利用伯努利效应的是：","options":{"A":"赛车尾翼","B":"飞机机翼","C":"潜艇外壳","D":"帆船船帆"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，赛车尾翼的上下表面曲率不同，空气流过赛车尾翼时，通过下表面的路程更长，流速更快，而通过上表面时路程短，流速慢，根据伯努利效应可知，赛车尾翼上表面的压强大于下表面的压强，从而空气对赛车产生向下的压力，即赛车产生较大的对地面的附着力。它能抵消一部分升力，有效控制汽车上浮，使风阻系数相应减小，使赛车能紧贴在路面行驶，从而提高行驶的稳定性。\nB项正确，飞机机翼横截面设计成上下不对称的形状，使得飞机飞行时机翼上方的空气流速大，下方的空气流速小。根据伯努利效应可知，机翼上方的压强小，下方的压强大，产生了作用在机翼上的方向向上的升力。\nC项错误，双壳潜艇艇体分内壳和外壳，内壳是钢制的耐压艇体，保证潜艇在水下活动时，能承受与深度相对应的静水压力；外壳是钢制的非耐压艇体，不承受海水压力，控制潜艇上浮下潜的流水孔、保证空气流通的通风阀和作战使用的潜望镜都通过外壳进行连接，内壳与外壳之间是主压载水舱和燃油舱等。单壳潜艇只有耐压艇体，主压载水舱布置在耐压艇体内。一个半壳潜艇，在耐压艇体两侧设有部分不耐压的外壳作为潜艇的主压载水舱。潜艇艇体多呈流线型（先进的潜艇一般设计成水滴形或者雪茄形），以减少水下运动时的阻力，保证潜艇有良好的操纵性。潜艇外壳的设计与伯努利效应无关。\nD项正确，帆船船帆具有像飞机机翼一样的弧形，当气流通过船帆时，由于船帆前面（鼓起的一侧）的气流要走更长的距离来船帆后面的气流相会合，因而船帆前面的空气流速快，船帆后面的空气流速慢，根据伯努利效应可知，流速慢处的压强比流速快处的压强大，这个压强差使帆获得了向前的动力。\n本题为选非题，故正确答案为C。","no":25,"missingImage":false}],"count":21,"answerable":21,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"4630385","cat":"逻辑填空","stem":"民间故事与个人创作最大的不同在于它们            的特质。众多无名故事家不断讲述它们，使每一个流传的故事成为集体智慧的结晶。\n填入画横线部分最恰当的一项是：","options":{"A":"口口相传","B":"锻炼逻辑","C":"奔走相告","D":"道听途说"},"answer":"A","explanation":"根据“众多无名故事家不断讲述它们，使每一个流传的故事成为集体智慧的结晶”可知，民间故事具有口头相传的特质。A项“口口相传”指不著文字，口头相传，符合文意，当选。\n\nB项“锻炼逻辑”不是成语，填入也不符合文意，排除；C项“奔走相告“指有重大的消息时，人们奔跑着相互转告，“民间故事”并非重大消息，与文意不符，排除；D项“道听途说”指没有根据的传闻，感情色彩偏消极，与文段感情色彩不符，排除。\n故正确答案为A。\n【文段出处】《用优秀民间故事滋润童年》","no":26,"missingImage":false},{"type":"question","qid":"4630401","cat":"逻辑填空","stem":"在实际生活中，很多人并不        血型性格说的起源和原理，只是在直观感受上觉得“有些准”。其实无论从色彩、星座、笔迹还是血型看性格，所对应的性格描述都是如此，相信的人只看见说对的部分，却        了说不准的部分。\n依次填入画横线部分最恰当的一项是：","options":{"A":"清楚 否定","B":"关心 忽略","C":"重视 忽视","D":"理解 屏蔽"},"answer":"B","explanation":"本题从第二空入手。由第二空横线前“却”可知，转折前后语义相反，转折前论述“只看见说对的部分”，故转折后的横线处要表达没看见的意思。B项“忽略”指疏忽，不在意，没注意到，C项“忽视”指不在意、不重视，均可表达没看见的意思，符合文意，保留。A项“否定”指对事物作不赞成的决定，D项“屏蔽”指遮蔽、遮挡，均无法表达没看见的意思，与文意不符，排除。\n第一空，由后文“直观感受上觉得‘有些准’”、“无论从色彩、星座、笔迹还是血型看性格，所对应的性格描述都是如此”可知，血型性格说实际上是一种没有科学依据、没有价值的学说，针对这种没有价值的学说，对于其起源和原理人们是不在意、不会想去了解的，B项“关心”指留意、在意，当选。C项“重视”指认为重要而认真对待，文段并非认为血型性格说的起源和原理不重要，而是完全不在意、不想去了解，排除。\n故正确答案为B。\n【文段出处】《血型星座与性格无关》","no":27,"missingImage":false},{"type":"question","qid":"4630432","cat":"逻辑填空","stem":"中国历史很长，地域广袤，社会发展的状况也不尽相同，经常有新的东西出现。因此，研究和学习历史，一定要有        ，靠一个人的力量要兼顾到各方面是不可能的，必致            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"侧重 事半功倍","B":"取舍 囫囵吞枣","C":"重点 挂一漏万","D":"方向 顾此失彼"},"answer":"C","explanation":"第一空，根据文段“靠一个人的力量要兼顾到各方面是不可能的”可知，横线处强调的是研究和学习要有选择性、不能兼顾所有，A项“侧重”、B项“取舍”、C项“重点”均符合文意，保留。D项“方向”指前进的目标，侧重于目的，不迷失，与语境不符，排除。\n第二空，对应“兼顾到各方面是不可能的”，横线处要体现出“无法顾全所有”的意思，C项“挂一漏万”形容列举不周，选了一个，但遗漏很多，符合文意，当选。A项“事半功倍”形容用力小而收效大，B项“囫囵吞枣”比喻读书等不加分析地笼统接受，均与“顾全所有方面”无关，排除。\n故正确答案为C。\n【文段出处】郑天挺《漫谈治史》","no":28,"missingImage":false},{"type":"question","qid":"4630435","cat":"逻辑填空","stem":"文物看似没有生命、没有声音，但是它们        了历史的风云，寄托着先人的情怀，充满了生命的活力。在博物馆，我们通过对文物的瞻仰，与先人的生命接续了起来，在        中实现了与历史的对话、与先人的情感交流，这也是博物馆所追求的文化目标。\n依次填入画横线部分最恰当的一项是：","options":{"A":"经历 凝重","B":"浸透 宁静","C":"蕴含 平淡","D":"折射 沧桑"},"answer":"B","explanation":"本题可从第二空入手，横线所在句子表示我们是在博物馆里通过观察文物，去达到“与历史对话”等目的，因此横线处填入的内容要与博物馆文物相关，根据“文物看似没有生命、没有声音”可知，博物馆处于十分安静的状态，“我们”也应是在安静的环境中实现对话、交流，故横线处应体现安静之意。B项“宁静”指环境安静，符合文意，保留。A项“凝重”指庄重、稳重或浓重，C项“平淡”指平常，D项“沧桑”比喻世事变化很大，均无法体现安静之意，不符合文意，排除。\n第一空，代入验证，B项“浸透”有“饱含”的语义，“浸透了历史的风云”表明文物虽没有声音、生命，但本身的存在就是历史风云的体现之意，符合文意，当选。\n故正确答案为B。\n【文段出处】《光明日报刊文评“跑男”跑进杭博:博物馆最不需要的就是热闹》","no":29,"missingImage":false},{"type":"question","qid":"4630439","cat":"逻辑填空","stem":"教师承担着立德育人的神圣使命，对教师的要求比其他行业高            ，但高到什么程度，要有客观标准和现实考量。如果把教师的育人细节不加选择、            地置于舆论场，可能会给教师和学校制造不必要的麻烦和干扰。\n依次填入画横线部分最恰当的一项是：","options":{"A":"无可厚非 随心所欲","B":"公平合理 杂乱无章","C":"不容置喙 毫无保留","D":"由来已久 轻而易举"},"answer":"A","explanation":"第一空，根据前文“教师承担着立德育人的神圣使命”以及“但高到什么程度”可知横线处应体现对教师要求高的“合理性”。A项“无可厚非”意为做的事情不能算错，不必过分地加以责备，B项“公平合理”指处理事情公正符合情理，均符合文意，保留。C项“不容置喙”指不容许插嘴，程度过重，排除；D项“由来已久”指事情从发生到现在已经过了很长时间了，文段没有体现出时间的延续性，排除。\n第二空，根据顿号可知，前后构成近义并列，故横线处应体现“不加选择”的意思，A项“随心所欲”意为凭着自己的意愿，想干什么就干什么，能体现出随意不加选择的意思，当选。B项“杂乱无章”形容杂乱而没有条理，与文意不符，排除。\n故正确答案为A。\n【文段出处】《如何防止教育舆情“跑偏”》","no":30,"missingImage":false},{"type":"question","qid":"4630381","cat":"逻辑填空","stem":"有些景区借助热播影视剧，不仅提高了人气，而且带来了可观的经济收入，可谓            。其实，仔细分析这些成功案例，不难发现，这些景区就是影视剧的拍摄地，剧中的元素与景区高度        ，游客带着观感游览，很容易引发情感共鸣。\n依次填入画横线部分最恰当的一项是：","options":{"A":"一举多得 相似","B":"名利双收 契合","C":"两全其美 匹配","D":"公私兼顾 重叠"},"answer":"B","explanation":"第一空，根据“可谓”可知，前文“不仅提高了人气，而且带来了可观的经济收入”是对横线处成语的解释说明，故横线处需表达有些景区借助热播影视剧收获两方面的好处。B项“名利双收”指既得名声、又获利益，与文意相符，保留。A项“一举多得”比喻一种举动同时兼收多利，文段只提到“人气”和“经济收入”两方面的好处，与“多”对应不恰当，排除；C项“两全其美”指做事顾全双方，使两方面都得到好处，与前文“人气”和“经济收入”的对应上，不如B项“名利双收”更恰当，排除；D项“公私兼顾”意思是既照顾到公家的利益，也照顾到私人的利益，文段未体现“公私利益”，排除。\n第二空，代入验证，根据文意可知，横线处所填词语应体现剧中的元素与景区具有很高的相似度。B项“契合”指符合，可以体现剧中元素与景区实景的高度相似，当选。\n故正确答案为B。\n【文段出处】《新华网评：景点改名“琅琊阁”，就可以名利双收吗？》","no":31,"missingImage":false},{"type":"question","qid":"4630414","cat":"片段阅读","stem":"回顾媒介发展的历程，每一种新媒介的诞生都对社会产生了深刻的影响。印刷媒介造成社会场景之间的隔离，从而促成知识的垄断和权威的得势；电子媒介则倾向于打破隔离，融合社会场景，从而模糊角色，消解权威。在新媒体环境下，“社会精英”们的话语影响力被“草根英雄”“平民英雄”抢尽风头。作为舆论引导主体的政府，在社会化媒体众声喧哗的媒介环境中，“被引导”“被议程设置”。“微博反腐”就是很好的例证。\n这段文字旨在强调新媒体：","options":{"A":"对传播权力的消解","B":"对社会结构的改变","C":"对政府管理的影响","D":"对信息传播的冲击"},"answer":"A","explanation":"文段首先指出新媒介的出现会对社会产生深刻影响，接着通过举例解释说明，随后强调在新媒体环境下，“社会精英”的话语影响力被“草根英雄”“平民英雄”抢占，作为舆论引导主体的“政府”被“大众”所引导，并通过“微博反腐”的例子来解释说明，即“新媒体环境下”的传播权力发生改变，对应A项。\nB项，“社会结构”文段未提及，无中生有，排除；\nC项，“政府”对应举例说明部分的内容，非重点，排除；\nD项，文段重点强调的是“新媒体”对传播权力的影响，“信息传播”表述不明确，排除。\n故正确答案为A。\n【文段出处】《媒介环境学视域下新媒体价值的消解与统合》","no":32,"missingImage":false},{"type":"question","qid":"4630418","cat":"片段阅读","stem":"抽象的价值，存留在理论之中；具体的公正，则需体现在每一个人身上，不像喊喊口号那样简单。医疗改革既需协调利益魔方，更需面对海量刚需和分布不均的现实；收入分配改革“分好蛋糕”理论明确，具体调整却是复杂的系统工程。不存在一种简单的理论，可以立竿见影搞定所有中国式问题。\n这段文字强调的是改革中需解决好以下哪项关系？","options":{"A":"偏与全","B":"快与慢","C":"知与行","D":"难与易"},"answer":"C","explanation":"文段开篇先指出理论是抽象的，公正这种理论的具体落实则不像喊口号那样简单，即理论应用到实际很难。后列举“医疗改革”和“收入分配改革”例子指出，改革落实均面临重重困难。尾句进一步重申，不存在一种简单的理论可以立刻解决所有问题。故本文强调在改革中要处理好理论与实践的关系，对应C项。\nA项“偏与全”、B项“快与慢”文段均未提及，无中生有，排除；\nD项，文段主要围绕理论与实践谈论，“难与易”表述模糊，排除。\n故正确答案为C。\n【文段出处】《有“问题意识”，也要有“过程意识”》","no":33,"missingImage":false},{"type":"question","qid":"4630422","cat":"片段阅读","stem":"之前普遍认为，曾侯乙编钟的发现打破了“中国的七声音阶源自欧洲”的结论，事实并非如此。从1984年开始，在贾湖遗址先后出土了30多支用丹顶鹤尺骨制成的骨笛，磨制精细，共7孔，已经能吹出七声音阶。贾湖骨笛是新石器时代晚期的产物，也就是说，在8000多年前，中国就已经有七音了，曾侯乙编钟的出土只是又一个重要佐证而已。\n这段文字意在说明：","options":{"A":"打破“中国的七声音阶源自欧洲”结论的是贾湖骨笛","B":"贾湖骨笛证明中国在八千多年前就出现了七声音阶","C":"贾湖骨笛是世界上七声音阶产生的最早证明","D":"贾湖骨笛证明七声音阶是从中国流传出去的"},"answer":"B","explanation":"文段开篇指出曾侯乙编钟的发现打破了“中国的七声音阶源自欧洲”，随后通过“事实并非如此”指出前文并非事实。后文通过贾湖骨笛证明中国早在8000多年前已产生了七声音阶，曾侯乙编钟的出土只不过是中国有七音的佐证。故文段重点强调贾湖骨笛可证明中国八千多年前就已经产生了七声音阶，对应B项。\nA项，文段强调贾湖骨笛证明中国八千多年前出现七声音阶，并非打破“中国的七声音阶源自欧洲”结论，偏离文段重点，排除；\nC项“最早证明”、D项“从中国流传出去的”均无中生有，排除。\n故正确答案为B。\n【文段出处】《中国的“七声”从哪里来》","no":34,"missingImage":false},{"type":"question","qid":"4630425","cat":"片段阅读","stem":"从近些年中国电视节目的格局来看，综艺节目的几大模板几乎全部移植于国外，鲜有本土原创，文化传统和民族特质越来越淡，中国电视的本土化创新进入困境。实际上，早在十几年前，有识之士便开始呼吁电视媒体应在努力学习外国优秀节目经验的同时，更注重植根本土文化，在源远流长的中华文明中寻找创新的源动力。现在以《中国诗词大会》为代表的文化类节目的兴起，用特有的中国气派和较强的原创魅力，证明以传统文化助推电视节目创新的路径是可行的。\n这段文字意在强调中国的电视综艺节目：","options":{"A":"应避免一味照搬国外模式","B":"应以传统文化为创新源泉","C":"应担负起发扬传统文化的责任","D":"激发了观众对传统文化的兴趣"},"answer":"B","explanation":"文段开篇提出中国电视本土化创新有困难，后通过转折关联词“实际上”以及程度词“更”引出核心对策，应注重在源远流长的中华文明中寻找创新的源动力，即以传统文化为创新源动力，尾句以《中国诗词大会》进行举例说明，故文段为分总分结构，重点强调中国的电视综艺节目应以传统文化为创新源动力，对应B项。\nA项，文段强调中国的电视综艺节目应以传统文化为创新源泉，“避免一味照搬国外模式”表述不明确，排除；\nC项，“发扬传统文化”文段并未提及，无中生有，排除；\nD项，“激发了观众对传统文化的兴趣”文段并未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《光明日报：文化类节目如何做“文章”》","no":35,"missingImage":false},{"type":"question","qid":"4630387","cat":"片段阅读","stem":"我国天气预报、气候、大气化学等方面的业务主要依靠风云系列气象卫星完成，但高分系列卫星提供的高空间分辨率数据产品起到了很好的补充作用。尤其在应对特殊天气和地表灾害方面，高分卫星的作用更为关键。例如在此前发射的高分系列卫星中，高分一号、二号可以为地震、泥石流、森林火灾等提供高分辨率图像；高分三号的雷达成像模式不受云雾影响，可以实现全天候立体监测；位于地球静止轨道的高分四号，可以观测到台风内部的精细结构，并实现对台风的高精度定位。而在新增的两颗高分卫星中，高分六号可以说是高分一号的“升级版”，而高分五号的高光谱作用更是独一无二。\n这段文字意在说明：","options":{"A":"高分系列卫星的作用是不可替代的","B":"高分系列卫星功能强大、用途广泛","C":"高分系列卫星拍得更清、测得更准","D":"高分系列卫星是风云系列的重要补充"},"answer":"D","explanation":"文段开篇先介绍风云系列气象卫星的作用，紧接着通过“但”转折，强调“高分系列卫星”的产品对“风云系列气象卫星”能起到很好的补充，随后通过程度词“尤其”与“更”进一步指出高分系列卫星在“应对特殊天气和地表灾害”方面的补充作用很关键，后文举例说明高分系列卫星补充作用的相关表现。故文段开头即阐明论点，强调“高分系列卫星”是对“风云系列气象卫星”的良好补充，对应D项。\nA项，“作用不可替代”文段并未提及，无中生有，排除；\nB项“功能强大、用途广泛”与C项“拍得更清、测得更准”均对应举例部分内容，为高分系列卫星对风云系列气象卫星重要补充的具体表现，非重点，排除。\n故正确答案为D。\n【文段出处】高分五号、六号卫星投入使用 这双“天眼”看得更清 (huanqiu.com)","no":36,"missingImage":false},{"type":"question","qid":"4630394","cat":"片段阅读","stem":"从历史上看，改革开放初期，全国各省（区市）的城市化大致处于共同进步的阶段，除了上海这样早就有市场经济元素的大城市外，绝大多数地区都需要经过一个农村转向城市的“原始积累阶段”。而进入新世纪之后，国内城市之间发展差距变大，不同层级的城市规模出现了不同的发展轨迹，一线城市更容易吸引年轻人的目光，而一些二三线城市也不甘落后，纷纷加入新一轮的城市竞争中。这两年兴起的二三线城市的“抢人竞争”就是基于这种背景出现的，这是中国城市化必然经历的一个阶段，在一线城市格局逐渐明确之后，对二线城市、国家中心城市地区的抢夺，则成为新一轮的竞争。\n这段文字主要讲的是：","options":{"A":"未来中国城市化发展的方向和趋势","B":"中国城市化发展的不同阶段及特点","C":"中国城市化发展过程中的地域特色","D":"二三线城市“抢人竞争”的大背景"},"answer":"A","explanation":"文段首先通过改革开放初期城市化发展的情况引出城市化发展的话题，紧接着通过“而进入新世纪之后”重点介绍其后城市化发展的现状，即城市之间的发展差距变大，出现了一线城市和二三线城市的区分，并说明一线城市更容易吸引年轻人的目光，而一些二三线城市也不甘落后，纷纷加入新一轮的城市竞争中。尾句通过“这是中国城市化必然经历的一个阶段”进行总结，强调在一线城市格局逐渐明确之后，对二线城市、国家中心城市地区的抢夺，成为新一轮的竞争，即接下来城市化的发展方向是二线城市、国家中心城市地区。对应A项。\nB项，文段并非并列陈述城市化发展的不同阶段，后文侧重强调现有情况下城市化的发展重点，“不同阶段”非重点，排除；\nC项，“地域特色”文段并未提及，无中生有，排除；\nD项，“抢人竞争”为城市竞争的表现，非重点，且偏离文段核心话题“城市化发展”，排除。\n故正确答案为A。\n【文段出处】中国青年报《一线城市不是年轻人唯一选择》","no":37,"missingImage":false},{"type":"question","qid":"4630403","cat":"片段阅读","stem":"德国慕尼黑工业大学研究人员模仿自然系统创建了一种分子化合物，当添加“燃料”（一种称为碳化二亚胺的高能分子）时，开始自由移动，组装成水凝胶。只要能源供应持续，化学反应能使该材料稳定。当能源耗尽，这些材料简单地分解为其基本分子。控制最初给定燃料的多少，研究者能按需设置，实现需要的有效自毁。研究人员说，这种技术近期内就能用作靶向药物的传递系统，以球状结构将药物带到身体各处，在需要的地方自动溶解，释放有效载荷。另一个设想是设计成组织工程的支架结构，植入身体来帮助愈合，并在身体自身细胞接管后降解。此外，可用这类材料制成塑料件或电子装置，它们在垃圾填埋场会自毁，避免堆积。\n关于这种能自毁的材料，文中没有介绍:","options":{"A":"化学成分","B":"应用前景","C":"自毁原理","D":"研发过程"},"answer":"D","explanation":"A项，根据文段“当添加燃料（一种称为碳化二亚胺的高能分子）时，开始自由移动组装成水凝胶”及“只要能源供应持续，化学反应能使该材料稳定；当能源耗尽，这些材料简单地分解为其基本分子”可知，自毁材料是由研究人员创建的分子化合物和燃料产生化学反应而形成的，所以自毁材料中包含了添加的燃料，即碳化二亚胺。故文段已提及“化学成分”，排除；\nB项，根据“这种技术近期内就能用作靶向药物的传递系统”“另一个设想是设计成组织工程的支架结构”以及“此外，可用这类材料制成塑料件或电子装置”可知，文段已提及“应用前景”，排除；\nC项，根据“当能源耗尽，这些材料简单地分解为其基本分子”可知，文段已提及“自毁原理”，排除；\nD项，根据文意可知，文段仅介绍了自毁材料的化学原理及可应用领域，并未提及自毁材料的研究与开发的各阶段过程，故“研发过程”无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《光明网：能自毁的材料用处大》","no":38,"missingImage":false},{"type":"question","qid":"4630409","cat":"片段阅读","stem":"顶端优势是指植物的顶芽优先生长，对侧芽萌发、侧枝生长的抑制作用，也包括对侧枝、叶子生长角度的影响。顶端优势强的植物，几乎不生分枝，如长日照植物向日葵，棉花等。番茄等植物顶端优势弱，能长出许多分枝。灌木顶端优势极弱，几乎没有主茎与分枝的区别。多数植物属中间类型，如稻、麦、泡桐等。顶端优势的强弱随植株年龄而变化，同时受营养和环境条件的影响，幼龄植物顶端优势强，老龄时减弱。顶端对侧芽的抑制程度，随距离增加而减弱，因此对下部侧芽的抑制比对上部侧芽的轻。许多树木因此形成宝塔形树冠。\n由此我们可以推出：","options":{"A":"距离根系越近，则顶端对侧芽的抑制程度会越高","B":"宝塔形树冠是顶端优势弱的植株的典型外部形态","C":"顶端优势现象的表现形式和程度因植物种类而异","D":"生存在恶劣环境下的植物，其顶端优势较为明显"},"answer":"C","explanation":"A项，根据“顶端对侧芽的抑制程度，随距离增加而减弱，因此对下部侧芽的抑制比对上部侧芽的轻”可知，越靠近根部，顶端对侧芽的抑制程度应该越低，表述错误，排除；\nB项，根据“顶端对侧芽的抑制程度，随距离增加而减弱，因此对下部侧芽的抑制比对上部侧芽的轻。许多树木因此形成宝塔形树冠”可知，宝塔形树冠是顶端优势随着距离增加而减弱的表现，文段并未论述宝塔形树冠植物的顶端优势强弱，无中生有，排除；\nC项，根据“顶端优势强的植物，几乎不生分枝，如······番茄等植物顶端优势弱······灌木顶端优势极弱······多数植物属中间类型，如······等”可知，表述正确，当选；\nD项，文段并未论述生存在恶劣环境下的植物顶端优势如何，无中生有，排除。\n故正确答案为C。","no":39,"missingImage":false},{"type":"question","qid":"4630411","cat":"片段阅读","stem":"日本东北部的宫城县有一片富饶的稻米产区。江合川、鸣濑川等河流，从这里穿行而过，大片沼泽地和湿地，为种植水稻提供了基础条件，但洪涝、干旱、冻害等自然灾害也经常光顾这里。数百年前，当地农民用智慧和汗水把这里变成适合稻作生产的地区。这里就是“大崎耕土”地区。2017年，大崎耕土的传统水资源管理系统被联合国粮农组织评选为全球重要农业文化遗产。\n这段文字接下来最可能讲的是:","options":{"A":"大崎耕土传统水资源管理系统的运行方式","B":"恶劣气候给大崎地区农业生产带来的影响","C":"大崎成为日本为数不多的稻米之乡的原因","D":"政府与社会团体对大崎耕土的保护与发展"},"answer":"A","explanation":"本题为接语选择题，重点关注文段尾句。文段首先引出了日本富饶稻米产区的话题，并强调河流、沼泽、湿地为水稻种植提供了基础条件，但也经常有自然灾害，接着说明当地农民把这里改造成了适合稻作生产的地区——“大崎耕土”地区，尾句强调大崎耕土的传统水资源管理系统被评为农业文化遗产，故接下来应该围绕大崎耕土的传统水资源管理系统展开分析，对应A项。\nB项，“恶劣气候”对应文段“洪涝、干旱、冻害等自然灾害也经常光顾这里”，为前文已经论述的内容，后文不再赘述，排除；\nC项，对应文段“江合川、鸣濑川等河流，从这里穿行而过，大片沼泽地和湿地，为种植水稻提供了基础条件”，为前文已经论述的内容，后文不再赘述，排除；\nD项，文段并未论述“政府与社会团体”，无中生有，与尾句衔接不当，排除。\n故正确答案为A。\n【文段出处】《日本：水资源科学利用助力可持续稻作生产》","no":40,"missingImage":false},{"type":"question","qid":"4630382","cat":"片段阅读","stem":"在电子传播的时代提倡有纸阅读，也许会被看成一种矫情，从知识传播和阅读效率角度讲，这种阅读也是高成本的，但读书本身不只是单纯的信息输入，而是一种文化生活，拥有丰富的心理探索和绵密的感情体验，这些微妙不可或缺，触屏阅读是一种更便捷更高效的阅读方式，但恰恰因为便捷与高效在某种意义上剥夺了纸质阅读的慢与精细，消化的时间与反刍的机会，冥想的诗意与活在历史中的觉悟，由此可能会遗漏那些被作者放在字里行间的更隐秘和更重要的信息。\n这段文字旨在强调:","options":{"A":"纸质阅读与触屏阅读存在巨大差异","B":"触屏阅读难以取代纸质阅读的地位","C":"电子传播时代更应提倡纸质阅读","D":"传统阅读能带来独特的心理体验"},"answer":"C","explanation":"文段开篇引出“有纸阅读”的话题，并论述了从知识传播和阅读效率角度讲，有纸阅读是高成本的，紧接着通过转折词“但”强调读书的体验是不可或缺的，触屏阅读虽然便捷与高效，却剥夺了纸质阅读消化的时间，会遗漏重要信息。也就是说，有纸阅读可以带来好的读书体验，是值得提倡的。故文段旨在强调电子传播时代需要提倡有纸阅读，对应C项。\nA项，“巨大差异”表述不明确，文段重点强调的是纸质阅读的好处和无可替代性，排除；\nB项，“难以取代纸质阅读的地位”文段未提及，无中生有，排除；\nD项，文段核心话题为“有纸阅读”，“传统阅读”偷换概念，排除。\n故正确答案为C。\n【文段出处】《愿你的手边还有纸质书籍相伴》","no":41,"missingImage":false},{"type":"question","qid":"4630389","cat":"片段阅读","stem":"翻译是文化交流的重要媒介，传统翻译理论认为原文与译文应该相互等同，因此，“忠实”是翻译的基本标准。20世纪70年代兴起的翻译研究理论，受到后现代主义哲学思潮的影响，反对本质主义，反对“译文的本质是原文”这一传统思想。这种翻译研究的新思潮，强调翻译过程中的“创造性叛逆”，即认为不忠实于原文是正常甚至必然的。在阅读原文的基础上，翻译者根据自己对原文的理解，进行独特的翻译创作，翻译者被认为是文本的另一个作者。\n这段文字主要介绍：","options":{"A":"新兴翻译理论与后现代主义哲学的关系","B":"翻译者对翻译文本的创造性贡献","C":"新兴翻译理论与传统理论的区别","D":"翻译工作应该遵循的基本标准"},"answer":"C","explanation":"文段开篇引出“翻译”这一话题，接着介绍了传统翻译理论的本质，即原文与译文之间是相互等同的，后文介绍了新兴翻译理论与传统翻译理论的区别，即新兴翻译理论认为翻译不忠实于原文是正常甚至必然的，其本质与传统翻译理论截然不同，尾句则对新兴翻译理论的翻译机制进行了解释说明，即新兴翻译理论是翻译者进行的独特翻译创作。故文段重点强调的是新兴翻译理论与传统翻译理论的区别，对应C项。\nA项，缺少文段核心话题“传统翻译理论”，排除；\nB项，“创造性贡献”文段未提及，无中生有，排除；\nD项，“应该遵循的基本标准”无中生有，排除。\n故正确答案为C。","no":42,"missingImage":false},{"type":"question","qid":"4630395","cat":"片段阅读","stem":"书法创作不外乎两种：一是有意识创作，二是无意识创作。有意识创作，即作者在艺术构思上以明显的主观追求为目的，或设境或立意，或以原蓝本风格为尺规，或集字等，时时想着自己在创作，以及为什么在创作，如何创作。因此，这种创作出来的作品不可能具有超脱和个性鲜明的风格与境界，即使他的技能含量再高、再精湛，也属于初级创作阶段。而无意识创作，即作者的技能含量已经高度纯熟，学识修养相当丰富，获得了创作上的大自由，将自己与创作物件融为一体，进入无意识状态、无自我之境界，任性所之，自然流露。这是书法艺术创作的高级阶段，书法艺术贵求自然，自然也即是真。\n这段文字意在说明：","options":{"A":"书法艺术创作贵在“内心自由”","B":"求真才能达到创作上的大自由","C":"纯熟的技能是一切书法创作的基础","D":"无意识状态是书法创作的高级阶段"},"answer":"A","explanation":"文段开篇指出书法创作有两种：有意识创作和无意识创作，接着对有意识创作进行了解释，并通过“因此”指出这种在构思规则内的有意识创作属于初级创作阶段。随后文段又指出无意识创作有着创作上的大自由，并通过尾句指出这种获得自由的无意识创作是书法艺术创作的高级阶段，故文段通过对比有意识创作与无意识创作，重点强调当人处于无意识创作，也就是获得创作自由时，才能够创作出更好的书法艺术作品，对应A项。\nB项，缺乏主题词“书法创作”，排除；\nC项，文段强调的并非“纯熟的技能”，选项偏离文段核心话题，排除；\nD项，“无意识状态”是无意识创作中的一部分内容，表述片面，排除。\n故正确答案为A。\n【文段出处】《&lt;石鼓文&gt;书法二题之一》","no":43,"missingImage":false},{"type":"question","qid":"4630400","cat":"片段阅读","stem":"艾滋病病毒与其他逆转录病毒一样，在繁殖时，其遗传物质会整合到人体宿主基因组上进行复制。虽然目前的抗逆转录病毒疗法可有效抑制艾滋病病毒繁殖，但却不能根除这类整合性病毒，因此病毒可以在治疗期间潜伏休眠，一旦治疗中止，又重新开始复制。近日，德国研究人员利用名为Brec1的重组酶，可以准确定位识别90%以上临床常见的艾滋病毒株，并能安全准确地在受感染细胞的染色体组中完全“剪除”整合的原病毒。原病毒被清除后，受艾滋病病毒遗传物质干扰而失灵的免疫系统有望恢复正常。\n下列说法与原文不相符的是：","options":{"A":"如果在细胞染色体组中识别并清除艾滋病病毒，或许可能治疗艾滋病","B":"存在于宿主染色体内的潜在病毒基因组是艾滋病爆发的根源","C":"艾滋病病毒一旦侵入机体细胞，病毒将会和细胞整合在一起","D":"逆转录病毒可将自身基因组整合入宿主细胞基因组"},"answer":"B","explanation":"A项，根据“利用名为Brec1的重组酶，可以准确定位识别······原病毒被清除后，受艾滋病病毒遗传物质干扰而失灵的免疫系统有望恢复正常”可知，识别并清除艾滋病病毒，可能治疗艾滋病，表述正确，排除；\nB项，文段并未提及艾滋病爆发的根源，无中生有，当选；\nC项，根据“其遗传物质会整合到人体宿主基因组上进行复制······这类整合性病毒”可知，艾滋病病毒和细胞整合在一起，表述正确，排除；\nD项，根据“艾滋病病毒与其他逆转录病毒一样，在繁殖时，其遗传物质会整合到人体宿主基因组上进行复制”可知，逆转录病毒的自身基因组可整合入宿主细胞基因组，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《清除艾滋病病毒新法动物实验成功》","no":44,"missingImage":false},{"type":"question","qid":"4630407","cat":"片段阅读","stem":"自从2013年，中国台北故宫博物院“朕知道了”胶带问世以来，文化创意已经蔓延至我国整个文博领域。不少博物馆都纷纷推出文创产品，从文具套装到钥匙扣，从生活用品到旅游用品，不一而足。可以说，文创已成为弘扬传统文化的重要载体。事实上，博物馆做文创与其说是在“卖产品”，不如说是在利用文化元素“讲故事”。而我国博物馆文创总体起步较晚，经验与市场都还不够成熟，要走好中国特色的博物馆文创之路，既需要政府部门在政策上给予更多的扶持和激励，也需要博物馆发挥积极性、主动性，与社会力量深度合作，平衡好艺术和商业之间的关系，努力做到创新有道，成熟有方。\n最适合做这段文字标题的是：","options":{"A":"博物馆文创要创新有道","B":"讲好中国博物馆的文创故事","C":"走好中国特色博物馆文创之路","D":"文创之路需要兼顾艺术和商业"},"answer":"C","explanation":"文段开篇引出“文创”这一话题，并介绍了我国很多博物馆均推出文创产品。接着通过“可以说”指出文创对弘扬传统文化的重要性，再通过“事实上”进行转折，之后提出问题，即我国博物馆文创起步晚，经验与市场不成熟，尾句通过“要”提出对策，介绍走好中国特色的博物馆文创之路的具体做法，故文段重点为对策，强调走好中国特色的博物馆文创之路，对应C项。\nA项，“创新有道”对应尾句，为博物馆走好文创之路具体做法中的部分内容，表述片面且非重点，排除；\nB项，“讲好中国博物馆的文创故事”为对策之前的内容，非重点，且偏离文段核心话题，文段重点强调走好中国特色博物馆的文创之路，并非“讲好文创故事”，排除；\nD项，“兼顾艺术和商业”对应尾句，为博物馆走好文创之路具体做法中的部分内容，表述片面且非重点，排除。\n故正确答案为C。\n【文段出处】《破解博物馆文创“同质化”》","no":45,"missingImage":false},{"type":"question","qid":"4630417","cat":"语句表达","stem":"①学界一般认为美学是以美、美的本质为主要研究对象的学问\n②尤其应该辩证综合地研究主客体之间即人与世界之间的审美关系，并以此作为美学研究的主要对象\n③但对于美学研究对象问题，历来存在多种不同看法，迄今并无定论\n④其实，我们关于美学研究对象的认识可以更加宽泛一些\n⑤同所有学科一样，美学的研究对象在某种程度上决定着它的学科性质\n⑥不仅要研究作为审美客体的美，同时要研究审美主体的美感\n将以上6个句子重新排列，语序正确的是：","options":{"A":"①⑤③④②⑥","B":"①③④②⑤⑥","C":"⑤①④②③⑥","D":"⑤③①④⑥②"},"answer":"D","explanation":"首先对比选项，判断首句。首句有①⑤两句，①句指出美学的主要研究对象是什么，⑤句强调美学的研究对象和学科性质的关系。均可作为首句，不好判断。进一步观察文段发现，②句出现递进关联词“尤其”，通过“应该”提出对策，“应该辩证综合地研究主客体之间即人与世界之间的审美关系”，故前一句也应提出对策，并且话题与“主客体”相关。观察选项，②句前有④句和⑥句，⑥句通过“要”提出对策，强调要研究审美主客体的美，与②句话题一致且衔接紧密。④句强调关于美学研究对象的认识可以宽泛一些，不如⑥句与②句衔接紧密，故排除A、B、C三项，D项当选。\n故正确答案为D。\n【文段出处】《美学聚焦人与世界审美关系》","no":46,"missingImage":false},{"type":"question","qid":"4630423","cat":"语句表达","stem":"①尤其在一个国家经历艰难转型的过渡期，这些声音会时强时弱地凸显出来\n②就像英国作家塞缪尔·约翰逊说过的，“爱国主义是无赖最后的避难所”\n③他们在爱国这个话题上所表现出来的真实情感才会凝聚出强大的精神力量\n④可是，任何社会，沉默的大多数才是主流和基石\n⑤这时，爱国主义容易被情绪化、被断章取义、被利用，从而转化为各种抵制、冲击和谩骂\n⑥任何社会都不缺偏激的叛逆者、狂热的偏执者、迷惘的盲从者、恶意的唱衰者\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②⑥③①④⑤","B":"⑥①⑤②④③","C":"②⑤①④⑥③","D":"⑥②⑤④③①"},"answer":"B","explanation":"对比选项，判断首句。②句出现“就像”，属于举例论证内容，不适合作首句，排除A、C两项。⑥句指出任何社会都不缺偏激、狂热、迷惘、恶意的人，适合作首句，保留B、D两项。\n继续观察发现。⑤句中出现指代词“这时”，根据指代词捆绑，判断⑤句前衔接①句还是②句，①句指出在一个国家经历艰难转型的过渡时期，会有时强时弱的声音凸显出来，可以与⑤句中的“这时”构成指代关系，①⑤两句构成捆绑，锁定B项。而②句通过引用塞缪尔·约翰逊的话进行举例论证，未出现表示时间的指代对象，无法和⑤句中的“这时”构成指代关系，排除D项。\n故正确答案为B。\n【文段出处】《爱国是一种静水流深的感情》","no":47,"missingImage":false},{"type":"question","qid":"4630426","cat":"语句表达","stem":"①在一定程度上设置付费按摩座椅取代普通座椅有助于改善候车条件，丰富出行体验\n②车站是交通出行的公共场所，候车大厅的座椅首要功能是满足旅客候车休息的需要\n③但设置付费按摩座椅不应与为旅客候车提供基本的休息服务相冲突\n④并且座椅数量、位置设计等都要满足车站客流量和便于旅客通行的要求\n⑤因此在设置付费按摩座椅替代普通座椅的过程中，不应减少座椅的数量\n⑥任何时候，商业利益都不能凌驾于公共利益之上\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②④①③⑤⑥","B":"①⑥②③④⑤","C":"②①③⑤④⑥","D":"①③②④⑤⑥"},"answer":"A","explanation":"对比选项，判断首句。①句介绍“付费按摩座椅”的意义，②句介绍“候车大厅的座椅”的作用，根据逻辑顺序，应先提出“候车大厅的座椅”这一话题，再介绍“按摩付费座椅”，所以②句应在①句之前，排除B、D两项。\n比较A、C两项，④句通过并列关联词来进一步论述“座椅”的数量、位置设计等要满足车站和旅客的要求，仍然是在介绍“座椅”的作用，可与②句构成并列关系，①句则论述“付费按摩座椅”，故④句与②句话题衔接更为恰当，排除C项。\n故正确答案为A。\n【文段出处】《候车室普通座被拆换按摩椅 车站商业化不能妨害公共利益》","no":48,"missingImage":false},{"type":"question","qid":"4630427","cat":"语句表达","stem":"①这种谜一样的存在被科学家称为“暗物质”\n②天文观测表明，宇宙中的暗物质比人类目前熟悉的普通物质要多5倍，其物理本质是目前国际上粒子物理和天体物理领域的重大问题之一\n③正是瞄准了这一世界科学前沿，2011年底，我国暗物质粒子探测卫星正式立项\n④2015年“悟空”号的成功发射实现了我国天文卫星零的突破，使中国天文学家首次拥有了属于我们自己的卫星数据，改变了此前全球约200颗天文卫星均属于国外的历史\n⑤在浩瀚无垠的宇宙中，存在一个巨大的谜团：宇宙的绝大部分质量是人类不可见的\n⑥《自然》杂志发表评论称其“开辟了中国空间科学新时代”\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑤②①⑥③④","B":"②③⑤①⑥④","C":"⑤①②③④⑥","D":"②①⑤③④⑥"},"answer":"C","explanation":"对比选项，确定首句。②句介绍暗物质很多，且其物理本质是物流学重大问题之一，⑤句介绍宇宙中的谜团，均可作为首句。寻找其他解题线索，①句通过“称为”引出“暗物质”的话题，故应先引出话题，再具体论述，即①句应在②句之前，排除A、B、D三项，锁定C项。\n验证C项，⑤①两句先引出“暗物质”的存在，接着②句论述“暗物质”研究的重要性，③④两句指出我国所做的努力，⑥句总结前文，逻辑合理流畅。\n故正确答案为C。\n【文段出处】光明网《在“星辰大海”中捕捉暗物质的猎手》","no":49,"missingImage":false},{"type":"question","qid":"4630428","cat":"语句表达","stem":"①有的人整天忙碌，却不清楚究竟做了什么；而有的人无论碰到多急多难的事情，总能从容不迫，轻松化解\n②我们周围常有这种情况，有的人一生没有干几件出彩的事，有的人只要用心干的事，件件精彩\n③提高工作水平是每一位年轻干部的迫切期盼\n④分析后者，他们在进入重要领导岗位之前，通过理论学习、专业训练和经验积累，一般具有较强的基本功、鲜明的角色认知和境界、方法上的充分储备\n⑤有了这些准备，无论到什么岗位，只要熟悉业务、注意方法，工作都会干得很好，工作水平一定会很快提高\n⑥工作水平的提高离不开科学合理安排，离不开对事物深厚的感悟积累，这就要求持续加强理论学习\n将以上6个句子重新排列，语序正确的是：","options":{"A":"①⑥④③⑤②","B":"③⑥②①④⑤","C":"②①③④⑤⑥","D":"⑥③①②④⑤"},"answer":"B","explanation":"观察选项，判断首句，①句介绍了两种人的不同情况，②句介绍了我们周围存在的情况，③句介绍了每一位年轻干部都期盼提高工作水平，⑥句介绍了如何提高工作水平，从内容上分析，难以判断首句，寻找其他线索。\n⑤句出现指代词“有了这些准备”，故前文应该提到“准备”，对比选项，④句提到了“充分储备”，可以与⑤句形成指代词捆绑，B、C、D三项保留，③句并未提到“准备”，不能与④句捆绑，排除A项；\n继续对比选项，④句出现“分析后者”，证明④句前应论述多个不同主体，①句、②句存在论述了两个主体，能够与④句捆绑，B、D两项保留，而③句只介绍了“每一位年轻干部”的期盼，不能与④句的“后者”构成捆绑，排除C项；\n对比B、D两项，可以判断①句和②句的位置，②句通过“我们周围常有这种情况”引出话题，之后具体论述“有的人······有的人······”，①句也在通过“有的人······有的人······”进行具体阐述，故②句在①句前更为合理，排除D项。\n故正确答案为B。\n【文段出处】《把理论学习作为党性修养的终生之需》","no":50,"missingImage":false}],"count":25,"answerable":25,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"4630392","cat":"数学运算","stem":"-7，-4，-3，-10，3，（    ），-3","options":{"A":"5","B":"2","C":"-4","D":"-6"},"answer":"C","explanation":"观察数列，变化较为平缓，项数较多，考虑多重数列。观察发现，除第一项以外，可两两分组，即：-7，（-4，-3），（-10，3），由此发现规律，括号内两数加和等于-7，即为第一项，故所求项应为-7-（-3）=-4。\n故正确答案为C。","no":51,"missingImage":false},{"type":"question","qid":"4630406","cat":"数学运算","stem":"甲、乙、丙、丁四人捐款，甲、乙、丙共捐款240元，甲、丙、丁共捐款190元，甲捐款额是丙的两倍，甲比乙少捐款40元。问丁捐款多少元？","options":{"A":"70","B":"80","C":"90","D":"120"},"answer":"A","explanation":"根据题意，设丙捐款x元，则甲捐款2x元，乙捐款（2x+40）元，丁捐款190-2x-x=190-3x元。由甲、乙、丙共捐款240元，可得：2x+（2x+40）+x=240，解得x=40。故丁捐款=190-3×40=70元。\n故正确答案为A。","no":52,"missingImage":false},{"type":"question","qid":"4629982","cat":"数学运算","stem":"王和张现在是同小区的邻居，3年之后，王比张年龄的3倍少2岁，再过5年王比张年龄的两倍多五岁，再在此基础上过10年王的年龄是多少岁？","options":{"A":"31","B":"34","C":"39","D":"49"},"answer":"D","explanation":"方法一：年龄问题，考虑代入排除法。结合选项设置，A和B、B和C、C和D分别差3、5、10，猜测答案可能是D选项，代入D选项验证。王再过10年为49岁，则10年前为39岁，“比张年龄的两倍多五岁”，则张的年龄为（39-5）÷2=17岁，往前推5年，即题目开头的“3年后”王39-5=34岁，张17-5=12岁，34=3×12-2，满足条件“王比张年龄的3倍少2岁”，因此D选项满足所有条件。\n故正确答案为D。\n方法二：设3年之后，张的年龄为x岁，则王的年龄为（3x-2）岁；再过5年，张的年龄为（x+5）岁，王的年龄为（3x-2+5）岁。根据 56个，平板车每趟至多可运纸箱\u003cimg data-k=\"441a2d20075f\">个，即4个，则至少需要拉\u003cimg data-k=\"aba9b7915b9b\">趟。\n故正确答案为B。","no":59,"missingImage":false},{"type":"question","qid":"4630419","cat":"数学运算","stem":"现有100升、120升和150升三种容积的油桶共16个，总容积为2030升，其中150升规格的油桶有x个。现将若干个150升规格的油桶换为同样数量的100升油桶，使得100升规格的油桶达到x个，此时所有油桶的容积为1880升，问x的值为多少？","options":{"A":"2","B":"4","C":"5","D":"9"},"answer":"C","explanation":"设原有100升的油桶y个，则120升的油桶有（16-x-y）个。\n方法一：根据“将若干个150升规格的油桶换为同样数量的100升油桶”，可知交换的每桶容积相差150-100=50升，交换前后总容积相差2030-1880=150升，则共交换\u003cimg data-k=\"615fa638b164\">个油桶，即y=x-3。根据题意可列方程：100（x-3）+120[16-x-（x-3）]+150x=2030，解得x=5。\n方法二：根据题意可列方程：100y+120（16-x-y）+150x=2030，化简得：3x-2y=11，根据2y是偶数，11是奇数，则3x应为奇数，即x为奇数，排除A、B两项。代入C项：当x=5时，y=2，满足题意，当选；代入D项：当x=9时，y=8，\u003cimg data-k=\"13664e52d95a\">，不满足题意，排除。\n故正确答案为C。","no":60,"missingImage":false},{"type":"question","qid":"4630438","cat":"数学运算","stem":"甲工艺品厂x名工人平均每人生产y件某种工艺品，正好完成生产任务。如调入1名工人，则每人只需要完成y-2件这种工艺品即可。问以下哪个坐标图能准确反映x（横轴）与y（纵轴）之间的关系?","options":{"A":"\u003cimg data-k=\"11a42f284869\" style=\"max-width:144px\">","B":"\u003cimg data-k=\"734e411990f0\" style=\"max-width:145px\">","C":"\u003cimg data-k=\"0e289d6ec4ec\" style=\"max-width:145px\">","D":"\u003cimg data-k=\"574ef6b00425\" style=\"max-width:145px\">"},"answer":"D","explanation":"根据生产任务总量不变，可列方程：xy=（x+1）×（y-2），化简得：y=2x+2，当x=0时，y=2，只有D项符合。\n故正确答案为D。","no":61,"missingImage":false}],"count":11,"answerable":11,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"4630364","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"8eda7f5eacaa\" style=\"max-width:605px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查翻折。图一从水平中间位置进行翻折可得到图二，图二从竖直中间位置进行翻折可得到图三，图三从水平中间位置进行翻折可得到图四，因此，问号处应该是图四从竖直中间位置进行翻折得到，只有A项符合。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"4630369","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"02a51ecb1238\" style=\"max-width:604px\">","options":{"A":"A","B":"B","C":"C",
