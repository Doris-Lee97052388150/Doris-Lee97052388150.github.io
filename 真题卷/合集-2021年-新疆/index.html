,"answer":"D","explanation":"将题干展开图标上序号，如下图所示，逐一分析选项。\n\u003cimg data-k=\"c1d81f57d461\" style=\"max-width:336px\">\nA项：选项中必然存在面a与面f，题干展开图中面a和面f为相对面，不能同时出现，选项与题干展开图不一致，排除；\nB项：选项由面a、面b与面c构成，题干展开图中面a、面b与面c的公共点引出3条线，而选项中三个面的公共点只引出1条线，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"87cd1020c083\" style=\"max-width:500px\">\nC项：选项中必然存在面b，题干展开图中面b与面d为相对面，不能同时出现，故选项由面a、面b与面e构成，题干展开图中面a、面b与面e的公共点引出2条线，而选项中三个面的公共点引出3条线，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"79e0f1b3a1bb\" style=\"max-width:544px\">\nD项：选项由面b、面e与面f构成，与题干展开图一致，当选。\n故正确答案为D。","no":62,"missingImage":false},{"type":"question","qid":"4004569","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"88de11eace97\" style=\"max-width:494px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相似，优先考虑样式规律。观察发现，第一行前两个图形去同存异得到第三个图形，经验证第二行图形满足此运算规律，第三行前两个图形去同存异得到B项。\n故正确答案为B。","no":63,"missingImage":false},{"type":"question","qid":"4004575","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"090e3ddfe62a\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"图形元素组成不同，属性与数量没有明显规律。观察发现，题干图形出现箭头较多，且前三幅图形箭头指向明显，箭头指向依次为上、左、下，第四幅图形存在变形，可将月亮右侧突出的弧线看成指向右的箭头，即题干图形中箭头的指向依次逆时针旋转\u003cimg data-k=\"c16e5a8b3239\">，故“？”处应选择箭头指向为上的图形，只有D项满足此规律。\n\u003cimg data-k=\"2e8df8a07536\" style=\"max-width:700px\">\n故正确答案为D。","no":64,"missingImage":false},{"type":"question","qid":"4004584","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"08f3e803e3f1\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"观察发现，第一组三幅图形均由圆形和五边形构成，且两个图形间的关系依次为圆形位于五边形上方、圆形位于五边形内部（不相交）、圆形位于五边形外部（相交）。第二组前两幅图形均由三角形和矩形构成，且两个图形间的关系依次为三角形位于矩形上方、三角形位于矩形内部（不相交），故“？”处图形应由三角形和矩形构成，且三角形应位于矩形外部（相交），只有C项符合。\n故正确答案为C。","no":65,"missingImage":false},{"type":"question","qid":"4004594","cat":"定义判断","stem":"我们对一个难题束手无策，不知从何入手时，思维就进入了“酝酿阶段”。直到有一天，当我们抛开面前的问题去做其他的事情时，百思不得其解的答案却突然出现在我们面前，这就叫“酝酿效应”。\n根据上述定义，下列哪一诗句是这一效应的写照？","options":{"A":"云外经年见双阙，马头乘兴数前山","B":"不识庐山真面目，只缘身在此山中","C":"山重水复疑无路，柳暗花明又一村","D":"风飒沉思眼忽开，尘埃污得是庸才"},"answer":"C","explanation":"第一步：找出定义关键词。\n“对一个难题束手无策，不知从何入手时”、“抛开面前的问题去做其他的事情时，百思不得其解的答案却突然出现在我们面前”。\n第二步：逐一分析选项。\nA项：出自韩元吉的《同叶梦锡赵德庄游牛首山》，描写的是诗人游览牛首山的情景，没有体现“对一个难题束手无策”，也没有体现“抛开面前的问题去做其他的事情”和“百思不得其解的答案却突然出现在我们面前”，不符合定义，排除；\nB项：出自苏轼的《题西林壁》，意思是之所以认不清庐山真正的面目，是因为我人身处在庐山之中，只是解释了为什么会“不识庐山真面目”，没有体现“抛开面前的问题去做其他的事情时，百思不得其解的答案却突然出现在我们面前”，不符合定义，排除；\nC项：出自陆游的《游山西村》，意思是山峦重叠水流曲折正担心无路可走，柳绿花艳忽然眼前又出现一个山村，现被用来形容已陷入绝境，忽然又出现转机，“疑无路”体现了“对一个难题束手无策，不知从何入手”，“又一村”体现了“百思不得其解的答案却突然出现在我们面前”，符合定义，当选；\nD项：出自刘得仁的《寄友人》，描述的是突然想明白了一些事情，没有体现“对一个难题束手无策，不知从何入手”，也没有体现“抛开面前的问题去做其他的事情时，百思不得其解的答案却突然出现在我们面前”，不符合定义，排除。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"4004610","cat":"定义判断","stem":"幸存者偏差指的是当取得资讯的渠道，仅来自于幸存者时，此资讯可能会与实际情况存在偏差。\n根据上述定义，下列结论的得出存在幸存者偏差的是：","options":{"A":"李老师通过小刚的成绩单看出小刚偏好文科","B":"警察通过调查监控发现小赵并没有偷超市里的东西","C":"王老师分别与小明、小亮谈话后总结出了他们俩打架的原因","D":"媒体对长寿老人进行采访发现他们都喜欢喝葡萄酒，便得出喝葡萄酒可以长寿的结论"},"answer":"D","explanation":"第一步：找出定义关键词。\n“当取得资讯的渠道，仅来自于幸存者时”、“资讯可能会与实际情况存在偏差”。\n第二步：逐一分析选项。\nA项：李老师的资讯来自于成绩单，而小刚的成绩单是可以体现小刚偏好科目的资讯，不符合“仅来自于幸存者时”，也不符合“与实际情况存在偏差”，不符合定义，排除；\nB项：警察的资讯来自于监控，不符合“当取得资讯的渠道，仅来自于幸存者时”，不符合定义，排除；\nC项：王老师的资讯来自于打架的双方，说明得到的资讯是全面的，不符合“当取得资讯的渠道，仅来自于幸存者时”，不符合定义，排除；\nD项：媒体的资讯来自于活着的长寿老人，这些人是同样年龄中的幸存者，符合“当取得资讯的渠道，仅来自于幸存者时”，由于获得的资讯不全面，故结论不一定准确，符合“资讯可能会与实际情况存在偏差”，符合定义，当选。\n故正确答案为D。","no":67,"missingImage":false},{"type":"question","qid":"4004617","cat":"定义判断","stem":"共生营销就是两个或两个以上的企业通过分享市场营销中的资源，达到降低成本、提高效率、增强市场竞争力目的的一种营销策略。\n根据上述定义，下列属于共生营销的是：","options":{"A":"某印刷厂和图书发行公司决定整合资源，成立新的集团公司","B":"安踏公司推出的安踏和漫威联名款产品，受到漫威狂热粉的争相抢购","C":"某企业售卖自己公司产品的同时，也在帮忙售卖朋友公司推出的新产品","D":"五个家具企业整合各自品牌优势，联合共同举办看样订货会，吸引了更多商客"},"answer":"D","explanation":"第一步：找出定义关键词。\n“两个或两个以上的企业”、“分享市场营销中的资源”、“降低成本、提高效率、增强市场竞争力”。\n第二步：逐一分析选项。\nA项：整合资源成立新的集团公司，意味着所有资源都进行了整合分享，不仅仅是“分享市场营销中的资源”，不符合定义，排除；\nB项：热销的是安踏公司的产品，而不是漫威的产品，并未体现安踏公司分享市场营销中的资源给漫威，不符合“两个或两个以上的企业”、“分享市场营销中的资源”，不符合定义，排除；\nC项：某企业帮忙售卖朋友公司推出的新产品，只有一家公司分享了市场营销中的资源，不符合“两个或两个以上的企业”、“分享市场营销中的资源”，不符合定义，排除；\nD项：五个家具企业联合举办看样订货会，吸引了更多商客，符合“两个或两个以上的企业”、“分享市场营销中的资源”、“降低成本、提高效率、增强市场竞争力”，符合定义，当选。\n故正确答案为D。","no":68,"missingImage":false},{"type":"question","qid":"4004650","cat":"定义判断","stem":"阳性强化法是建立、训练某种良好行为的治疗技术或矫正方法，也称“正强化法”或“积极强化法”。通过及时奖励目标行为，忽视或淡化异常行为，促进目标行为的产生。\n根据上述定义，如果要纠正一名经常乱扔玩具、把饭撒桌子上等不断制造麻烦的儿童的行为，下列治疗方法不属于阳性强化法的是：","options":{"A":"当他乱扔玩具时，及时制止，并让他旁观其他小朋友整理玩具的过程，然后引导他将自己的玩具放置好","B":"当他出现认真收拾饭桌上自己撒的饭渣行为时，家长和老师及时积极鼓励和表扬，让他感受到更多的关注，促进他不断重复目标行为","C":"当他随便乱扔玩具、哭闹不停时，周围人对他的这种不良行为不予关注，没有半分反应","D":"家长对于他乱扔玩具的行为，每减少一次就奖励一次他自己喜欢的东西，慢慢的他乱扔玩具的频率越来越低"},"answer":"A","explanation":"第一步：找出定义关键词。\n“及时奖励目标行为”、“忽视或淡化异常行为”、“促进目标行为的产生”。\n第二步：逐一分析选项。\nA项：乱扔玩具属于异常行为，制止乱扔玩具不符合“忽视或淡化异常行为”，不符合定义，当选； \nB项：家长和老师及时积极鼓励和表扬，促进他不断重复目标行为，符合“及时奖励目标行为”、“促进目标行为的产生”，符合定义，排除；\nC项：周围人对他的不良行为不予关注，符合“忽视或淡化异常行为”，符合定义，排除；\nD项：家长的奖励降低了乱扔玩具的频率，符合“及时奖励目标行为”、“促进目标行为的产生”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":69,"missingImage":false},{"type":"question","qid":"4004668","cat":"定义判断","stem":"旁观者效应也称为责任分散效应，是指对某一件事来说，如果是单个个体被要求单独完成任务，责任感就会很强，会做出积极的反应。但如果是要求一个群体共同完成任务，群体中的每个个体的责任感就会很弱，面对困难或遇到责任往往会退缩。\n根据上述定义，下列属于旁观者效应的是：","options":{"A":"小赵开车在公路上行驶时，车辆发生故障，小赵在车道设立警示标识，示意后面车辆绕行","B":"运送水果的货车在高速路上发生侧翻，附近居民一哄而上捡拾水果带回家","C":"小李看到路旁停放的自行车被风吹倒，跟着行人一起绕开走了","D":"小孙看到有人在路边突然晕倒，见周围无人见证，怕承担责任不敢上前帮助"},"answer":"C","explanation":"第一步：找出定义关键词。\n“单个个体被要求单独完成任务，责任感就会很强，会做出积极的反应”、“要求一个群体共同完成任务，群体中的每个个体的责任感就会很弱，面对困难或遇到责任往往会退缩”。\n第二步：逐一分析选项。\nA项：小赵车辆发生故障，在车道设立警示标识，没有涉及被要求单独完成任务，不符合“单个个体被要求单独完成任务，责任感就会很强，会做出积极的反应”，也没有体现出群体中每个个体的责任感很弱，不符合“要求一个群体共同完成任务，群体中的每个个体的责任感就会很弱，面对困难或遇到责任往往会退缩”，不符合定义，排除；\nB项：运送水果的货车侧翻后遭到居民哄抢，没有体现出单个个体的责任感增强，也没有体现出群体遇到困难或遇到责任会退缩，不符合“单个个体被要求单独完成任务，责任感就会很强，会做出积极的反应”、“要求一个群体共同完成任务，群体中的每个个体的责任感就会很弱，面对困难或遇到责任往往会退缩”，不符合定义，排除；\nC项：小李看到路旁停放的自行车被风吹倒，跟着行人一起绕开走了，说明群体中的个体责任感很弱，遇到责任会退缩，符合“要求一个群体共同完成任务，群体中的每个个体的责任感就会很弱，面对困难或遇到责任往往会退缩”，符合定义，当选；\nD项：小孙看到有人晕倒，但周围并没有其他人，不敢上前帮助，不存在群体，不符合“要求一个群体共同完成任务，群体中的每个个体的责任感就会很弱，面对困难或遇到责任往往会退缩”，不符合定义，排除。\n故正确答案为C。","no":70,"missingImage":false},{"type":"question","qid":"4004681","cat":"定义判断","stem":"知觉恒常性是指，当客观条件在一定范围内改变时，我们的知觉印象在相当程度上，保持着它的稳定性。即对物体某种特性的知觉，在外界条件与感觉信号输入改变时，仍保持常定的倾向。\n根据上述定义，下列未体现出知觉恒常性的是：","options":{"A":"在观察一本书时，不管从正上方看还是从斜上方看，看起来都是长方形的","B":"一个成人从近处走向远处，眼睛看到的人像虽然相应缩小，但不会把他当成儿童","C":"室内的家具，在不同色光照明下，对其颜色知觉仍保持相对不变","D":"古语说：窥一斑而知全豹，就是通过豹子的一个斑点，就可以得出这个动物是豹子"},"answer":"D","explanation":"第一步：找出定义关键词。\n“当客观条件在一定范围内改变时”、“知觉印象在相当程度上，保持着它的稳定性”、“对物体某种特性的知觉，在外界条件与感觉信号输入改变时，仍保持常定的倾向”。\n第二步：逐一分析选项。\nA项：从不同的角度观察一本书，符合“当客观条件在一定范围内改变时”，不同角度看起来都是长方形的，符合“知觉印象在相当程度上，保持着它的稳定性”，符合定义，排除；\nB项：从近处和远处分别看一个成人，符合“当客观条件在一定范围内改变时”，远处看人像虽然缩小，但不会觉得是儿童，符合“知觉印象在相当程度上，保持着它的稳定性”，符合定义，排除；\nC项：不同色光照明下的室内家具，符合“当客观条件在一定范围内改变时”，对其颜色知觉仍保持相对不变，符合“知觉印象在相当程度上，保持着它的稳定性”，符合定义，排除；\nD项：通过观察豹子身上的一个斑点就可以得出这个动物是豹子，整个过程中客观条件并没有发生改变，也没有体现出知觉印象的稳定性，不符合“当客观条件在一定范围内改变时”、“知觉印象在相当程度上，保持着它的稳定性”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"4004693","cat":"定义判断","stem":"气候贫穷，是指由于全球气候变化带来的影响及产生的灾害所导致的贫穷或使得贫穷加剧的现象。\n根据上述定义，下列不属于气候贫穷的是：","options":{"A":"西北地区夏季增温幅度大而降水增加量少，影响农业生产导致农民返贫","B":"突然发生的地震给人们的生命财产造成了极大的损失，使他们一夜致贫","C":"气候变化增加了疾病的发生和传播的机会，危害人类健康，贫困地区劳动力不断减少，贫者愈贫","D":"全球气温不断升高，冰川面积缩减进一步加剧了某地的水资源矛盾，给他们的生产生活造成极大影响，使贫困加剧"},"answer":"B","explanation":"第一步：找出定义关键词。\n“由于全球气候变化带来的影响及产生的灾害”、“导致的贫穷或使得贫穷加剧”。\n第二步：逐一分析选项。\nA项：西北地区夏季增温幅度大而降水增加量少，符合“由于全球气候变化带来的影响及产生的灾害”，影响农业生产导致农民返贫，符合“导致的贫穷或使得贫穷加剧”，符合定义，排除；\nB项：突然发生的地震给人们的生命财产造成了极大的损失，但地震属于地质灾害，不符合“由于全球气候变化带来的影响及产生的灾害”，不符合定义，当选；\nC项：气候变化增加了疾病的发生和传播的机会，危害人类健康，符合“由于全球气候变化带来的影响及产生的灾害”，贫困地区劳动力不断减少，贫者愈贫，符合“导致的贫穷或使得贫穷加剧”，符合定义，排除；\nD项：全球气温不断升高给某地居民的生产生活造成极大影响，符合“由于全球气候变化带来的影响及产生的灾害”，使他们的贫困加剧，符合“导致的贫穷或使得贫穷加剧”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":72,"missingImage":false},{"type":"question","qid":"4004699","cat":"定义判断","stem":"反馈原来是物理学中的一个概念，心理学借用这一概念，以说明学习者对自己学习结果的了解，而这种对结果的了解又起到了强化作用，促进了学习者更加努力学习，从而提高学习效率。这一心理现象被称作“反馈效应”。\n根据上述定义，下列说法符合反馈效应的是：","options":{"A":"小李参加公司的新员工培训成绩最差，心灰意冷，未过试用期就提出了辞职","B":"老师习惯于按照学习成绩的好坏来划分学生的优劣，并据此来指导学生的学习","C":"让学生自己来评改练习作业，比由老师来评改所起到的激励作用要大，学习效果更佳","D":"小明帮妈妈打扫卫生，妈妈却嫌弃小明打扫得不干净"},"answer":"C","explanation":"第一步：找出定义关键词。\n“学习者对自己学习结果的了解起到了强化作用”、“促进了学习者更加努力学习，从而提高学习效率”。\n第二步：逐一分析选项。\nA项：小李因为培训成绩最差，心灰意冷，不符合“学习者对自己学习结果的了解起到了强化作用”，未过试用期就提出了辞职，不符合“促进了学习者更加努力学习，从而提高学习效率”，不符合定义，排除；\nB项：老师按照学习成绩的好坏来指导学生学习，老师不是学习者，不符合“学习者对自己学习结果的了解起到了强化作用”，不符合定义，排除；\nC项：学生自己评改作业，其激励作用更大，学习效果更佳，符合“学习者对自己学习结果的了解起到了强化作用”、“促进了学习者更加努力学习，从而提高学习效率”，符合定义，当选；\nD项：妈妈嫌弃小明卫生打扫得不干净，不符合“学习者对自己学习结果的了解起到了强化作用”、也不符合“促进了学习者更加努力学习，从而提高学习效率”，不符合定义，排除。\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"4004710","cat":"定义判断","stem":"法的适用，通常是指国家司法机关根据法定职权和法定程序，具体应用法律处理案件的专门活动。\n根据上述定义，下列属于法的适用的是：","options":{"A":"某科技公司根据法律相关规定和李某签订了劳动合同","B":"张某依法将子女送入学校进行义务教育","C":"某海关工作人员认为刘某涉嫌走私手机，因而对其进行查办","D":"某地检察机关对王某的渎职案依法进行侦查"},"answer":"D","explanation":"第一步：找出定义关键词。\n“国家司法机关”、“根据法定职权和法定程序，具体应用法律处理案件”。\n第二步：逐一分析选项。\nA项：选项的主体为某科技公司，不符合“国家司法机关”，不符合定义，排除；\nB项：选项的主体为张某，不符合“国家司法机关”，不符合定义，排除；\nC项：选项的主体为某海关工作人员，不符合“国家司法机关”，不符合定义，排除；\nD项：选项的主体为“某地检察机关”，符合“国家司法机关”，对渎职案依法进行侦查，符合“根据法定职权和法定程序，具体应用法律处理案件”，符合定义，当选。\n故正确答案为D。","no":74,"missingImage":false},{"type":"question","qid":"4004720","cat":"定义判断","stem":"蝴蝶效应，是指在一个动力系统中，初始条件下微小的变化能带动整个系统长期巨大的连锁反应。它是一种混沌现象，说明了任何事情发展均存在定数与变数，事物在发展过程中，其发展轨迹有规律可循，同时也存在不可测的变数，往往还会适得其反，一个微小的变化能影响事物的发展，证实了事物的发展具有复杂性。\n根据上述定义，下列没有反映蝴蝶效应的是：","options":{"A":"美国发现一宗疑假疯牛病案例，牛肉产业遭到冲击，作为养牛业主要饲料来源的美国玉米和大豆业，期货价格呈现下降趋势。美国消费者对牛肉产品出现的信心下降，给刚刚复苏的美国经济带来一场破坏性很强的飓风","B":"某员工因不公平待遇离职，带走了有同样遭遇的几名员工，他们自主创业后，与原公司竞争，导致原公司破产","C":"丢失一个钉子，坏了一只蹄铁；坏了一只蹄铁，折了一匹战马；折了一匹战马，伤了一位骑士；伤了一位骑士，输了一场战斗；输了一场战斗，亡了一个帝国","D":"某公司因经济不景气面临破产的危机，为了节源，他们裁掉了很大一部分员工，只留下骨干员工"},"answer":"D","explanation":"第一步：找出定义关键词。\n“在一个动力系统中”、“初始条件下微小的变化”、“带动整个系统长期巨大的连锁反应”。\n第二步：逐一分析选项。\nA项：一宗疑假疯牛病案例，符合“初始条件下微小的变化”，影响了美国玉米和大豆业的期货价格，破坏了美国经济，符合“带动整个系统长期巨大的连锁反应”，上述所有事件均“在一个动力系统中”，符合定义，排除；\nB项：某员工因不公平待遇离职，符合“初始条件下微小的变化”，离职后带走了几名同样遭遇的员工，然后他们进行自主创业，与原公司竞争，最终导致原公司破产，符合“带动整个系统长期巨大的连锁反应”，上述所有事件均“在一个动力系统中”，符合定义，排除；\nC项：丢失一个钉子，符合“初始条件下微小的变化”，进而影响了蹄铁质量、战马生存、骑士征战、战斗结果、帝国走向，符合“带动整个系统长期巨大的连锁反应”，上述所有事件均“在一个动力系统中”，符合定义，排除；\nD项：某公司因经济不景气面临破产的危机，对于该公司这个动力系统来说是比较大的变化，不符合“初始条件下微小的变化”，同时也没有体现出“带动整个系统长期巨大的连锁反应”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"4004740","cat":"类比推理","stem":"文科：历史","options":{"A":"手提包：双肩包","B":"咸水湖：鄱阳湖","C":"桃：水果","D":"微量元素：铅"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n历史属于文科，二者为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：手提包和双肩包是两种不同类型的包，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：鄱阳湖是淡水湖，不是咸水湖，二者为反向种属关系，与题干逻辑关系不一致，排除；\nC项：桃是一种水果，二者为种属关系，但顺序与题干相反，与题干逻辑关系不一致，排除；\nD项：微量元素指生物体正常生理活动所必需但需求量很少的元素，铅是一种微量元素，二者为种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"4004748","cat":"类比推理","stem":"患得患失：三三两两","options":{"A":"好大喜功：浑浑噩噩","B":"居安思危：口口声声","C":"能屈能伸：兢兢业业","D":"捕风捉影：茕茕孑立"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n患得患失指对于个人的利害得失斤斤计较；三三两两指三个一群两个一伙（多指人），二者没有语义关系，考虑成语拆分，患得患失的第一个字和第三个字相同，且“得”和“失”为反义关系，三三两两的前两个字相同，后两个字也相同。\n第二步：判断选项词语间逻辑关系。\nA项：好大喜功的第一个字和第三个字不相同，且“大”和“功”不是反义关系，与题干逻辑关系不一致，排除；\nB项：居安思危的第一个字和第三个字不相同，与题干逻辑关系不一致，排除；\nC项：能屈能伸的第一个字和第三个字相同，且“屈”和“伸”为反义关系，兢兢业业的前两个字相同，后两个字也相同，与题干逻辑关系一致，当选；\nD项：捕风捉影的第一个字和第三个字不相同，且“风”和“影”不是反义关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":77,"missingImage":false},{"type":"question","qid":"4004756","cat":"类比推理","stem":"教练：学员","options":{"A":"歌唱家：唱歌","B":"医生：病人","C":"律师：法庭","D":"作家：读者"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n教练教学员，二者是主宾关系，且教练给学员提供服务，为提供服务和被服务的关系。\n第二步：判断选项词语间逻辑关系。\nA项：歌唱家唱歌，二者是主谓宾关系，与题干逻辑关系不一致，排除；\nB项：医生治疗病人，二者是主宾关系，且医生给病人提供服务，为提供服务和被服务的关系，与题干逻辑关系一致，当选；\nC项：律师在法庭，二者是人物和地点的对应关系，与题干逻辑关系不一致，排除；\nD项：作家和读者不是主宾关系，且作家给读者提供的是作品而不是服务，并非提供服务和被服务的关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":78,"missingImage":false},{"type":"question","qid":"4004765","cat":"类比推理","stem":"布：衣服","options":{"A":"牛奶：酸奶","B":"粮食：酒","C":"木材：餐桌","D":"朱古力：巧克力"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n布经过加工可以制成衣服，二者为原材料的对应关系，且制作过程是物理变化。\n第二步：判断选项词语间逻辑关系。\nA项：牛奶经过发酵可以制成酸奶，二者为原材料的对应关系，但发酵是化学变化，与题干逻辑关系不一致，排除；\nB项：粮食经过发酵可以制成酒，二者为原材料的对应关系，但发酵是化学变化，与题干逻辑关系不一致，排除；\nC项：木材经过加工可以制成餐桌，二者为原材料的对应关系，且制作过程是物理变化，与题干逻辑关系一致，当选；\nD项：朱古力和巧克力是同一种事物的不同称谓，二者为全同关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":79,"missingImage":false},{"type":"question","qid":"4004774","cat":"类比推理","stem":"手：足","options":{"A":"口：鼻","B":"钢：铁","C":"心：肝","D":"男：女"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n手和足均是人体器官，二者为并列关系当中的反对关系，且二者均为人体外部器官。\n第二步：判断选项词语间逻辑关系。\nA项：口和鼻均是人体器官，二者为并列关系当中的反对关系，且二者均为人体外部器官，与题干逻辑关系一致，当选；\nB项：钢是含碳量介于\u003cimg data-k=\"abda13146ad8\">至\u003cimg data-k=\"99c761e0b216\">之间的铁碳合金，铁是一种金属元素，可用铁与少量的碳制成钢，所以铁是制作钢的原材料之一，且二者均为金属材料，与题干逻辑关系不一致，排除；\nC项：心和肝均是人体器官，二者为并列关系当中的反对关系，但二者均为人体内脏器官，而非人体外部器官，与题干逻辑关系不一致，排除；\nD项：男和女均表示性别，二者为并列关系当中的矛盾关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":80,"missingImage":false},{"type":"question","qid":"4004781","cat":"类比推理","stem":"七上：八下","options":{"A":"五颜：六色","B":"三长：两短","C":"欺上：瞒下","D":"万紫：千红"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n七上八下形容心里慌乱不安。在词语中，七与八表示不同的数字，二者为并列关系，上与下，二者为反义关系。\n第二步：判断选项词语间逻辑关系。\nA项：五颜六色形容色彩复杂或花样繁多。在词语中，五与六表示不同的数字，二者为并列关系，但颜与色均表示色彩，二者为近义关系，与题干逻辑关系不一致，排除；\nB项：三长两短指意外的灾祸或事故。在词语中，三与两表示不同的数字，二者为并列关系，长与短，二者为反义关系，与题干逻辑关系一致，当选；\nC项：欺上瞒下指对上欺骗，博取信任，对下隐瞒，掩盖真相。在词语中，欺与瞒不是表示不同的数字，与题干逻辑关系不一致，排除；\nD项：万紫千红形容百花齐放，色彩艳丽。在词语中，万与千表示不同的数量，二者为并列关系，但紫与红表示不同的颜色，二者为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":81,"missingImage":false},{"type":"question","qid":"4004793","cat":"类比推理","stem":"黄果树瀑布：西江苗寨：贵州","options":{"A":"洪泽湖：洞庭湖：江苏","B":"黄山：太湖：浙江","C":"庐山：会稽山：江西","D":"泰山：大明湖：山东"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“黄果树瀑布”和“西江苗寨”均在贵州省，前两个词为并列关系，与第三个词均为地点对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“洪泽湖”在江苏省，但是“洞庭湖”在湖南省，不在江苏省，与题干逻辑关系不一致，排除；\nB项：“黄山”在安徽省，不在浙江省，“太湖”横跨江苏省和浙江省，与题干逻辑关系不一致，排除；\nC项：“庐山”在江西省，但是“会稽山”在浙江省，不在江西省，与题干逻辑关系不一致，排除；\nD项：“泰山”和“大明湖”均在山东省，前两个词为并列关系，与第三个词均为地点对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":82,"missingImage":false},{"type":"question","qid":"4004800","cat":"类比推理","stem":"负荆请罪：廉颇：蔺相如","options":{"A":"萧规曹随：萧何：曹奇","B":"一字之师：齐己：郑谷","C":"图穷匕见：张良：秦王","D":"手不释卷：吴蒙：孙权"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“负荆请罪”讲述的是“廉颇”跟“蔺相如”不和，后来廉颇认识到了这样对国家不利，便脱了上衣、背着荆条去向蔺相如谢罪的故事。主人公分别是“廉颇”和“蔺相如”，三者是历史典故与历史人物的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“萧规曹随”讲述的是萧何和曹参在西汉初期先后任丞相，萧何创立了一套规章制度，在他死后曹参继任，完全照章行事的故事。主人公分别是“萧何”和“曹参”，而非“曹奇”，与题干逻辑关系不一致，排除；\nB项：“一字之师”讲述的是齐己带着自己写好的诗前去请教“郑谷”，郑谷只提出一个字的修改意见，便使该诗变得更好的故事。主人公分别是“齐己”和“郑谷”，三者是历史典故与历史人物的对应关系，与题干逻辑关系一致，当选；\nC项：“图穷匕见”讲述的是荆轲以献地图为借口，在卷起的地图中藏了把匕首，以谋刺杀秦王，当地图展开后，匕首就露出来的故事。主人公分别是“荆轲”和“秦王”，而非“张良”，与题干逻辑关系不一致，排除；\nD项：“手不释卷”讲述的是孙权用自己和前人手不释卷的例子劝学，吕蒙深受感动，从此发奋学习的故事。主人公分别是“吕蒙”和“孙权”，而非“吴蒙”，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":83,"missingImage":false},{"type":"question","qid":"4004807","cat":"类比推理","stem":"莫愁前路无知己 对于 （    ） 相当于 （    ） 对于 感恩","options":{"A":"爱情 恩疏媒劳志多乖","B":"场所 千古兴亡多少事","C":"离别 报答平生未展眉","D":"送别 西出阳关无故人"},"answer":"C","explanation":"逐一代入选项。\nA项：“莫愁前路无知己”的意思是此去不要担心遇不到知己，表达了作者与朋友的离别之情，与“爱情”无明显逻辑关系；“恩疏媒劳志多乖”的意思是皇帝疏远，举荐徒劳，壮志难酬，与“感恩”无明显逻辑关系，前后逻辑关系不一致，排除；\nB项：“莫愁前路无知己”的意思是此去不要担心遇不到知己，表达了作者与朋友的离别之情，与“场所”无明显逻辑关系；“千古兴亡多少事”的意思是从古到今，有多少国家兴亡大事呢，表达了作者怀古的愁思和感慨，与“感恩”无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：“莫愁前路无知己”的意思是此去不要担心遇不到知己，表达了作者与朋友的“离别”之情，二者为对应关系；“报答平生未展眉”的意思是报答你一生的愁苦奔忙，表达了“感恩”之情，二者为对应关系，前后逻辑关系一致，当选；\nD项：“莫愁前路无知己”的意思是此去不要担心遇不到知己，表达了作者对朋友的“送别”之情，二者为对应关系；“西出阳关无故人”的意思是当你向西出了阳关后，就难以遇到故人了，表达了作者与朋友的离别之情，与“感恩”无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"4004812","cat":"类比推理","stem":"（    ） 对于 冰箱 相当于 （    ） 对于 教师","options":{"A":"空调 医生","B":"食物 教室","C":"冷冻 校长","D":"防腐 家长"},"answer":"A","explanation":"逐一代入选项。\nA项：空调和冰箱是两种不同的家电，二者为并列关系中的反对关系；医生和教师是两种不同的职业，二者为并列关系中的反对关系，前后逻辑关系一致，当选；\nB项：食物放在冰箱里保存，教师在教室上课，均为场所对应关系，但前后词语顺序相反，前后逻辑关系不一致，排除；\nC项：冰箱具有冷冻的功能，二者为功能对应关系；校长可以管理教师，二者为对应关系，前后逻辑关系不一致，排除；\nD项：冰箱具有防腐的功能，二者为功能对应关系，但不能说教师具有家长的功能，前后逻辑关系不一致，排除。\n故正确答案为A。","no":85,"missingImage":false},{"type":"question","qid":"4004816","cat":"逻辑判断","stem":"某社区公共财物被损毁，公安机关锁定了四名犯罪嫌疑人，并分别对他们进行了审问：\n甲：我没有做这件事，这件事是乙做的；\n乙：甲、丙、丁中肯定有一人做了这件事；\n丙：此事是由甲和乙中的一人做的；\n丁：甲说的是事实。\n经过调查，发现两个人说的真话，由此可以推出：","options":{"A":"甲是罪犯","B":"乙是罪犯","C":"丙是罪犯","D":"丁是罪犯"},"answer":"A","explanation":"第一步：找出题干矛盾命题。\n（1）甲∶\u003cimg data-k=\"e752a8ae1a16\">甲，乙；\n（2）乙∶甲、丙、丁中一人做了；\n（3）丙∶要么甲，要么乙；\n（4）丁∶\u003cimg data-k=\"e752a8ae1a16\">甲，乙。\n第二步：根据题干条件进行推理。\n题干两真两假，且甲和丁说的话一致，因此甲、丁要么都说真话，要么都说假话，可以采用假设法分别讨论。\n若甲、丁均说真话，可得甲不是罪犯，乙是罪犯，此时丙说的也是真话，共有三人说真话，与题干信息矛盾；\n若甲、丁均说假话，可得甲是罪犯，乙不是罪犯，此时乙、丙均说真话，与题干信息不矛盾，A项当选。\n故正确答案为A。","no":86,"missingImage":false},{"type":"question","qid":"4004819","cat":"逻辑判断","stem":"某兴趣小组成员都是艺术特长生，有的艺术特长生体育很好，小明体育很好。由此可以推出：","options":{"A":"小明是艺术特长生","B":"小明不是艺术特长生","C":"该兴趣小组成员体育都很好","D":"该兴趣小组成员可能体育都不好"},"answer":"D","explanation":"第一步：翻译题干。\n①兴趣小组成员\u003cimg data-k=\"2dfb7d1f72f3\">艺术特长生；\n②有的艺术特长生\u003cimg data-k=\"2dfb7d1f72f3\">体育很好；\n③小明体育很好。\n第二步：逐一分析选项。\nA项：根据条件②可换位为“有的体育很好的人\u003cimg data-k=\"2dfb7d1f72f3\">艺术特长生”，虽然已知③“小明体育很好”，但他是否属于“有的体育很好的人”并不确定，无法推出“小明是艺术特长生”，排除；\nB项：根据条件②可换位为“有的体育很好的人\u003cimg data-k=\"2dfb7d1f72f3\">艺术特长生”，虽然已知③“小明体育很好”，但无论他是否属于“有的体育很好的人”里，均无法推出“小明不是艺术特长生”，排除；\nC项：翻译为“兴趣小组成员\u003cimg data-k=\"2dfb7d1f72f3\">体育很好”，根据条件②可知“有的艺术特长生\u003cimg data-k=\"2dfb7d1f72f3\">体育很好”，虽然已知①“兴趣小组成员\u003cimg data-k=\"2dfb7d1f72f3\">艺术特长生”，但兴趣小组成员是否属于“有的艺术特长生”并不确定，无法推出，排除；\nD项：翻译为“兴趣小组成员\u003cimg data-k=\"2dfb7d1f72f3\">可能体育不好”，根据条件②可知“有的艺术特长生\u003cimg data-k=\"2dfb7d1f72f3\">体育很好”，虽然已知①“兴趣小组成员\u003cimg data-k=\"2dfb7d1f72f3\">艺术特长生”，但兴趣小组成员可能均不属于“有的艺术特长生”，所以他们可能体育都不好，可以推出，当选。\n故正确答案为D。","no":87,"missingImage":false},{"type":"question","qid":"4004823","cat":"逻辑判断","stem":"某研究团队最新研究显示，偏头痛患者的大脑视觉皮层会“过度兴奋”。招募60名志愿者参加了相关试验，其中有一半人患有偏头痛。试验中研究人员向志愿者展示了条纹栅格测试图，并让他们回答看后是否感到不舒服；进一步的测试中，还让他们在看图的同时接受脑电图测试。结果发现那些患偏头痛的志愿者在看到条纹栅格测试图后脑部的视觉皮层出现了较明显的反应。\n以下哪项为真，最不能削弱研究者的结论?","options":{"A":"在那些没有患偏头痛但对视觉刺激比较敏感的某些志愿者中，视觉皮层也会出现类似反应","B":"此项研究中所研究的样本数量过少没有说服力","C":"偏头痛患者看除条纹栅格测试图之外的其他测试图，大脑视觉皮层并未有明显反应","D":"志愿者在做此项试验之前并未受到其他因素干扰"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：偏头痛患者的大脑视觉皮层会“过度兴奋”。\n论据：招募60名志愿者参加了相关试验，其中有一半人患有偏头痛。试验中研究人员向志愿者展示了条纹栅格测试图，并让他们回答看后是否感到不舒服；进一步的测试中，还让他们在看图的同时接受脑电图测试。结果发现那些患偏头痛的志愿者在看到条纹栅格测试图后脑部的视觉皮层出现了较明显的反应。\n本题论点论据话题一致，削弱可以考虑削弱论点，即说明偏头痛患者的大脑视觉皮层不会“过度兴奋”，也可以考虑削弱论据，即证明试验的设置不科学，得到的结果不严谨。\n第二步：逐一分析选项。\nA项：没有患偏头痛的人大脑视觉皮层也会“过度兴奋”，通过举反例来否定论点，可以削弱，排除；\nB项：通过说明样本数量过少质疑试验严谨性，否定了论据，可以削弱，排除；\nC项：偏头痛患者看其他测试图时，大脑视觉皮层并未有明显反应，通过举反例来否定论点，可以削弱，排除；\nD项：该项说明研究团队排除了其他变量，保证了试验严谨性，属于必要条件加强，无法削弱，当选。\n本题为选非题，故正确答案为D。","no":88,"missingImage":false},{"type":"question","qid":"4004827","cat":"逻辑判断","stem":"发酵乳制品因为其丰富的营养和益生菌含量，给人们带来了广泛的健康益处，比如，益生菌中最突出的乳酸杆菌和双歧杆菌能够减少病理改变，刺激粘膜免疫与炎症介质相互作用和增强免疫系统。最近，有科学家通过对190多万人的研究得出，发酵乳制品能够降低肿瘤的发生风险。\n以下哪项如果为真，最能支持上述结论?","options":{"A":"目前国内未有此类明确的专业报道","B":"发酵物产生的益生菌都是对身体有益的","C":"喝酸奶能够降低19%的肿瘤发生风险，此说法受到权威专家的认可","D":"发酵乳制品中的益生菌可以维持肠道稳态并发挥潜在的抗癌作用"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：发酵乳制品能够降低肿瘤的发生风险。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据，可以通过解释原因或举例进行加强。\n第二步：逐一分析选项。\nA项：该项说的是目前未有此类明确的专业报道，没有说明发酵乳制品是否能够降低肿瘤的发生风险，属于不明确项，无法加强，排除；\nB项：该项说的是发酵物产生的益生菌都是对身体有益的，而论点在说发酵乳制品能够降低肿瘤的发生风险，对身体有益是否就能降低肿瘤的发生风险并不明确，属于不明确项，无法加强，排除；\nC项：该项说的是喝酸奶能够降低\u003cimg data-k=\"6296cd17c34b\">的肿瘤发生风险，酸奶属于发酵乳制品，举例补充论据，可以加强，保留；\nD项：该项说的是发酵乳制品中的益生菌可以维持肠道稳态并发挥潜在的抗癌作用，解释了为什么发酵乳制品能够降低肿瘤的发生风险，解释原因补充论据，可以加强，保留。\n对比C、D两项，C项是举例，D项是解释原因，解释原因的加强力度大于举例，D项当选。\n故正确答案为D。","no":89,"missingImage":false},{"type":"question","qid":"4004832","cat":"逻辑判断","stem":"相比那些不练习瑜伽的人来说，经常练习瑜伽的人体型更好一些。可见，瑜伽能锻炼人的柔韧性，塑造完美体型。\n以下哪项如果为真，最能对上述结论提出质疑？","options":{"A":"大部分人喜欢瑜伽，就是因为瑜伽能够让人拥有更好的体型","B":"塑造完美体型的方式不仅仅只有瑜伽","C":"瑜伽不仅能够塑造人的完美体型，还能预防关节炎","D":"真正体型不好的人一般不会选择练习瑜伽"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：瑜伽能锻炼人的柔韧性，塑造完美体型。\n论据：相比那些不练习瑜伽的人来说，经常练习瑜伽的人体型更好一些。\n本题的论点和论据讨论的都是瑜伽能塑造完美体型，论点和论据话题一致，削弱优先考虑削弱论点，且论点为因果关系，也可以考虑因果倒置（体型好的人才会练瑜伽），还可以考虑他因削弱（对于完美体型的人来说，除了练瑜伽还做了其他塑造体型的方式）。\n第二步：逐一分析选项。\nA项：该项说的是大部分人喜欢瑜伽，就是因为瑜伽可以让人拥有更好的体型，有加强作用，无法削弱，排除；\nB项：该项说的是塑造完美体型的方式不仅仅只有瑜伽，但是对于题干论据中练习瑜伽的群体是否还有其他塑造体型的方式，并不明确，无法削弱，排除；\nC项：该项说的是瑜伽除了塑造完美体型外还有其他的功能，有加强作用，无法削弱，排除；\nD项：该项说的是体型不好的人一般不会练瑜伽，即体型好的人才会练瑜伽，而论点在说瑜伽能塑造完美体型，该项颠倒了论点中的因果，属于因果倒置，可以削弱，当选。\n故正确答案为D。","no":90,"missingImage":false},{"type":"question","qid":"4004840","cat":"逻辑判断","stem":"某公司发生失窃案，公安机关经过调查锁定了犯罪嫌疑人是该公司会计张某。办案民警小王说：“一定不是他”，办案民警小李发表了反对观点：“当其他可能性被排除了，剩下的不管看起来多么不可能，但一定是事情的真相。”\n以下哪项如果为真，最能削弱小李的说法？","options":{"A":"追究违法行为最重要的是用证据说话","B":"办案民警无法极尽所有可能性","C":"办案民警小王比小李更了解案件经过","D":"公司职员评价张某平时为人老实诚恳"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：小李认为犯罪嫌疑人是该公司会计张某。\n论据：其他人是嫌疑人的可能性都被排除了。\n小王认为犯罪嫌疑人不是张某，小李和小王的观点相反，双方在“掐架”，此时要削弱小李的说法可以考虑削弱论据，即还有其他人是嫌疑人的可能性。\n第二步：逐一分析选项。\nA项：该项说的是追究违法行为最重要的是用证据说话，而论点说的是小李认为犯罪嫌疑人是张某，话题不一致，无法削弱，排除；\nB项：该项指出办案民警无法极尽所有可能性，与题干中小李说其他可能性被排除了相矛盾，直接削弱论据，可以削弱，当选；\nC项：该项说的是办案民警小王比小李更了解案件经过，而论点说的是小李认为犯罪嫌疑人是张某，话题不一致，无法削弱，排除；\nD项：该项说的是公司职员评价张某平时为人老实诚恳，而论点说的是小李认为犯罪嫌疑人是张某，张某老实诚恳不能说明其不是犯罪嫌疑人，无法削弱，排除。\n故正确答案为B。","no":91,"missingImage":false},{"type":"question","qid":"4004847","cat":"类比推理","stem":"只有市值超过100亿的企业才能加入企业联盟。只要加入企业联盟的企业就会被评为优秀企业。甲市的部分企业是企业联盟会员。乙市的企业市值都没有超过100亿。\n根据上述论断，不能推出的是：","options":{"A":"甲市的部分企业被评为优秀企业","B":"乙市有的企业被评为优秀企业","C":"乙市的企业都没有加入企业联盟","D":"甲市的部分企业市值超过100亿"},"answer":"B","explanation":"第一步：翻译题干。\n①加入企业联盟\u003cimg data-k=\"2dfb7d1f72f3\">市值超过100亿的企业；\n②加入企业联盟\u003cimg data-k=\"2dfb7d1f72f3\">被评为优秀企业；\n③有的甲市企业\u003cimg data-k=\"2dfb7d1f72f3\">加入企业联盟；\n④乙市的企业\u003cimg data-k=\"a3a13b026980\">市值超过100亿的企业；\n由①和③可知：⑤有的甲市企业\u003cimg data-k=\"2dfb7d1f72f3\">加入企业联盟\u003cimg data-k=\"2dfb7d1f72f3\">市值超过100亿的企业；\n由①和④可知：⑥乙市的企业\u003cimg data-k=\"a3a13b026980\">市值超过100亿的企业\u003cimg data-k=\"a3a13b026980\">加入企业联盟；\n由②和③可知：⑦有的甲市企业\u003cimg data-k=\"2dfb7d1f72f3\">加入企业联盟\u003cimg data-k=\"2dfb7d1f72f3\">被评为优秀企业。\n第二步：逐一分析选项。\nA项：由⑦可知，甲市的部分企业被评为优秀企业，可以推出，排除；\nB项：由⑥可知，乙市的企业没有加入企业联盟，这是对②的否前，否前得不到确定结论，故得不到乙市有的企业被评为优秀企业，无法推出，当选；\nC项：由⑥可知，乙市的企业没有加入企业联盟，可以推出，排除；\nD项：由⑤可知，甲市的部分企业市值超过100亿，可以推出，排除。\n本题为选非题，故正确答案为B。","no":92,"missingImage":false},{"type":"question","qid":"4004854","cat":"逻辑判断","stem":"要保证学生的视力健康，就必须让他们与不卫生的用眼习惯作斗争；如果不对他们错误的用眼行为加以纠正，就会助长他们的不卫生用眼习惯。因此：","options":{"A":"有不卫生的用眼习惯的人中没有学生","B":"只有学生才会与不卫生的用眼习惯作斗争","C":"如果不让学生与不卫生的用眼习惯作斗争就无法保证学生的视力健康","D":"所有学生都与不卫生的用眼习惯作斗争"},"answer":"C","explanation":"第一步：翻译题干。\n①保证学生的视力健康\u003cimg data-k=\"2dfb7d1f72f3\">与不卫生的用眼习惯作斗争；\n②\u003cimg data-k=\"e752a8ae1a16\">错误的用眼行为加以纠正\u003cimg data-k=\"2dfb7d1f72f3\">助长不卫生的用眼习惯。\n第二步：逐一分析选项。\nA项：翻译为“有不卫生的用眼习惯\u003cimg data-k=\"a3a13b026980\">学生”，推理前后话题均和题干话题不一致，无法推出，排除；\nB项：翻译为“与不卫生的用眼习惯作斗争\u003cimg data-k=\"2dfb7d1f72f3\">学生”，是对条件①的肯后，肯后得不出确定结论，且条件①的前件是保证学生的视力健康，而不是学生，话题也不一致，无法推出，排除；\nC项：翻译为“\u003cimg data-k=\"e752a8ae1a16\">与不卫生的用眼习惯作斗争\u003cimg data-k=\"a3a13b026980\">保证学生的视力健康”，是对条件①的否后，否后必否前，可以推出，当选；\nD项：翻译为“学生\u003cimg data-k=\"2dfb7d1f72f3\">与不卫生的用眼习惯作斗争”，学生与题干话题不一致，无法推出，排除。\n故正确答案为C。","no":93,"missingImage":false},{"type":"question","qid":"4004861","cat":"类比推理","stem":"小明根据明天的课程制定了预习计划，数学、语文、英语、政治、历史、地理、生物七科，每一科都要预习，但是预习的顺序必须符合如下要求：\n（1）预习地理之前要先预习英语，预习这两科之间还要预习另外两科（生物除外）；\n（2）第一科或者最后一科预习政治；\n（3）第三科预习历史；\n（4）预习生物要在地理之前或者刚预习完地理之后。\n如果小明首先预习英语，则可以确定他的预习顺序是：","options":{"A":"第二科预习语文","B":"第五科预习生物","C":"第五科预习地理","D":"第二科预习数学"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）英语XX地理（间隔不可生物）；\n（2）政治：要么第一，要么第七；\n（3）历史：第三；\n（4）生物要在地理之前或者紧挨着地理并且在地理之后；\n（5）英语：第一。\n第二步：根据题干条件分析选项。\n从确定性条件入手，根据条件（3）可知历史在第三，根据条件（5）可知英语在第一，再根据条件（2）可知政治在第七，又根据条件（1）（5）可知地理在第四。再根据条件（1）（4）可知英语和地理中间不可能是生物，而生物要么在地理前，要么紧挨在地理后，可知生物在第五。剩余科目数学和语文在第二和第六，不能确定具体排位。列表为下图：\n\u003cimg data-k=\"13a652cd8057\" style=\"max-width:700px\">\n故正确答案为B。","no":94,"missingImage":false},{"type":"question","qid":"4004867","cat":"逻辑判断","stem":"某次幼儿园的课堂上，老师拿出五种水果，并依次编号为①—⑤，然后要求小朋友说出其中任意两种水果的名称。\n小李说：③是苹果，②是龙眼。\n小赵说：④是香蕉，②是猕猴桃。\n小钱说：①是香蕉，⑤是梨子。\n小孙说：④是梨子，③是猕猴桃。\n小王说：②是苹果，⑤是龙眼。\n结果是他们每人只说对了一半，根据以上条件下列正确的是：","options":{"A":"①是香蕉，②是苹果","B":"②是猕猴桃，③是梨子","C":"③是苹果，④是梨子","D":"④是龙眼，⑤是梨子"},"answer":"C","explanation":"此题为组合排列题型，题干信息不确定，优先考虑代入法解题。\n代入A项，此时小李的说法均错误，不符合题干要求，排除；\n代入B项，此时小李的说法均错误，不符合题干要求，排除；\n代入C项，此时小李的前半句为真，即③是苹果，那么小孙的后半句为假，其前半句就为真，即④是梨子，那么小赵的前半句为假，后半句就为真，即②是猕猴桃，那么小王的前半句为假，后半句就为真，即⑤是龙眼，那么小钱的后半句为假，前半句就为真，即①是香蕉，符合题干要求，当选；\n代入D项，此时小赵和小孙的前半句都为假，那么小赵和小孙的后半句都为真，即②是猕猴桃和③是猕猴桃都为真，不符合题干要求，排除。\n故正确答案为C。","no":95,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2019年前三季度，全国居民人均可支配收入22882元，比上年同期名义增长8.8%。其中 案为B。","no":112,"missingImage":false},{"qid":"4004828","cat":"增长","stem":"2014年—2018年中年末移动电话用户数量同比增速大于3%的年份有几个？","options":{"A":"1个","B":"2个","C":"3个","D":"4个"},"answer":"B","explanation":"根据题干“2014年—2018年中······同比增速大于\u003cimg data-k=\"815ec268d3d4\">的年份有几个”，可判定本题为一般增长率问题。定位柱状图可得2014年—2018年各年年末移动电话用户数量，根据增长率\u003cimg data-k=\"2623f0dd96bb\">计算各年增长率即可。2015年为负增长，增速小于\u003cimg data-k=\"815ec268d3d4\">；2016年：\u003cimg data-k=\"e2137b0071f5\">\u003cimg data-k=\"f2cb8b388448\">；2017年：\u003cimg data-k=\"c1f3862b1f62\">\u003cimg data-k=\"43f27fd6c776\">；2018年：\u003cimg data-k=\"b63db59c6848\">\u003cimg data-k=\"35691a674735\">。同比增速大于\u003cimg data-k=\"815ec268d3d4\">的年份有2017年和2018年，共2个。\n故正确答案为B。\n注：本题题干表述有一定歧义，要求计算2014年—2018年每年的同比增速，但材料并未给出2013年相关数据，故2014年的同比增速无法计算。","no":113,"missingImage":false},{"qid":"4004834","cat":"综合","stem":"2016年全年全市健康和意外险业务保费收入约为多少亿元？","options":{"A":"7.5","B":"6.9","C":"6.4","D":"6.1"},"answer":"C","explanation":"根据题干“2016年全年······约为多少亿元”，结合材料时间为2018年，与2016年间隔了2017年，可判定本题为间隔基期问题。定位文字材料第三段可得：2018年全年全市······健康和意外险业务保费收入9.1亿元，增长\u003cimg data-k=\"3181e13a22fb\">，增速同比增加5个百分点。代入间隔增长率计算公式：\u003cimg data-k=\"452dcb0ecd2f\">，相对于2016年，2018年健康和意外险业务保费收入增长了\u003cimg data-k=\"705322b1e248\">\u003cimg data-k=\"18d3e0aec15f\">\u003cimg data-k=\"f79df4dffd99\">\u003cimg data-k=\"56ec90ac7c56\">\u003cimg data-k=\"18773e71800d\">，则2016年全年全市健康和意外险业务保费收入\u003cimg data-k=\"6173058548cf\">\u003cimg data-k=\"a736913a74cc\">亿元。\n故正确答案为C。","no":114,"missingImage":false},{"qid":"4004839","cat":"综合","stem":"下列不能从上述资料中推出的是：","options":{"A":"2018年秋粮的产量约是夏粮的62倍","B":"2017年邮政业务总量约占电信业务总量的75%","C":"2017年寿险业务保费赔付金额约0.85亿元","D":"2018年全年保费收入同比增速高于10%的业务类型有2个"},"answer":"C","explanation":"A项：定位文字材料第一段可得：2018年······夏粮2.4万吨，秋粮147.9万吨。则所求倍数为\u003cimg data-k=\"a81c9f2f56d0\">倍，正确；\nB项：定位文字材料第二段可得：2018年H市······邮政业务总量40.8亿元（\u003cimg data-k=\"5984c760e49f\">），同比增长\u003cimg data-k=\"fc2ad8c804a2\">（\u003cimg data-k=\"f82036fad5c4\">）；电信业务总量67.4亿元（\u003cimg data-k=\"99a8becf0246\">），同比增长\u003cimg data-k=\"e03a78782646\">（\u003cimg data-k=\"b0b4715579ef\">）。所求基期比重为\u003cimg data-k=\"401f837891ee\">\u003cimg data-k=\"14a8a7cdf492\">\u003cimg data-k=\"3f5a9e8ce80c\">，正确；\nC项：定位文字材料第三段可得：2018年全年全市······寿险业务保费赔付11.0亿元，增长\u003cimg data-k=\"4aca0196e875\">。则2017年寿险业务保费赔付金额为\u003cimg data-k=\"eaef17ba7afb\">\u003cimg data-k=\"53b664a95db2\">\u003cimg data-k=\"d765c46278f6\">亿元，远高于0.85亿元，错误；\nD项：定位文字材料第三段可得，全年保费收入同比增速高于\u003cimg data-k=\"fc324c3b9ecb\">的业务类型有健康和意外险（\u003cimg data-k=\"3181e13a22fb\">）、财产险（\u003cimg data-k=\"4754d896a0e0\">）2个，正确。\n本题为选非题，故正确答案为C。\n备注：B项不严谨。两者属于并列关系，不应考查比重概念。","no":115,"missingImage":false}]}],"count":20,"answerable":20,"pointsOf":16}],"total":115,"affected":[],"subtitle":"2021年 · 新疆 · 6/6 模块"},{"slug":"2021-新疆-兵团-2","title":"2021年新疆生产建设兵团面向社会招录公务员考试《行测》题（网友回忆版）","year":"2021","group":"新疆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"3522653","cat":"新思想","stem":"2020年10月14日，习近平总书记在深圳经济特区建立40周年庆祝大会上发表讲话，对经济特区建设给予了充分肯定。下列关于经济特区建设的表述不准确的是：","options":{"A":"1978年12月，党的十一届三中全会作出把党和国家工作重心转移到经济建设上来、实行改革开放的历史性决策","B":"1979年7月，党中央、国务院批准广东、福建两省实行“特殊政策、灵活措施、先行一步”，并试办出口特区","C":"1980年8月，党和国家批准在深圳、珠海、上海、厦门设置经济特区","D":"1988年4月，党和国家批准建立海南经济特区"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，1978年12月，党的十一届三中全会作出把党和国家工作重心转移到经济建设上来、实行改革开放的历史性决策，实现了新中国成立以来党的历史的伟大转折。\nB项正确，1979年7月，党中央、国务院批准广东、福建两省实行“特殊政策、灵活措施、先行一步”，并试办出口特区。\nC项错误，1980年8月，党和国家批准在深圳、珠海、汕头、厦门设置经济特区。\nD项正确，1988年4月，党和国家批准建立海南经济特区，明确要求发挥经济特区对全国改革开放和社会主义现代化建设的重要窗口和示范带动作用。\n本题为选非题，故正确答案为C。","no":1,"missingImage":false}],"count":1,"answerable":1,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"3522652","cat":"人文常识","stem":"下列对我国“十四五”时期经济社会发展主要目标表述错误的是：","options":{"A":"经济发展取得新成效和改革开放迈出新步伐","B":"创新驱动取得新优势和国内市场形成发展新格局","C":"民生福祉达到新水平和国家治理效能得到新提升","D":"社会文明程度得到新提高和生态文明建设实现新进步"},"answer":"B","explanation":"本题考查政治常识。\n2020年10月29日，中国共产党第十九届中央委员会第五次全体会议通过的《国民经济和社会发展第十四个五年规划和2035年远景目标纲要》中指出：“‘十四五’时期经济社会发展主要目标。锚定二〇三五年远景目标，综合考虑国内外发展趋势和我国发展条件，坚持目标导向和问题导向相结合，坚持守正和创新相统一，今后五年经济社会发展要努力实现以下主要目标：经济发展取得新成效；改革开放迈出新步伐；社会文明程度得到新提高；生态文明建设实现新进步；民生福祉达到新水平；国家治理效能得到新提升。”\n本题为选非题，故正确答案为B。","no":2,"missingImage":false},{"type":"question","qid":"3522663","cat":"人文常识","stem":"2020年12月17日凌晨1时59分，嫦娥五号返回器携带月球样品成功着陆，这标志着我国的探月工程—“嫦娥工程\"取得阶段性成功。下列关于我国探月工程的表述错误的是：","options":{"A":"2020年嫦娥五号成功采集月壤标志着中国探月工程“绕、落、采”三步走战略圆满收官","B":"“嫦娥工程”分为“无人月球探测”、“载人登月”和“建立月球基地”三个阶段","C":"2011年我国的嫦娥二号实现了环绕月球的目标","D":"2019年我国的嫦娥四号完成了首次月背登陆"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，嫦娥五号任务最重要的目标就是“采样返回”，这也是中国“探月工程”规划的“绕、落、回”中的第三步。2020年12月17日嫦娥五号返回器在内蒙古四子王旗预定区域成功着陆，标志着中国首次月球采样返回任务圆满完成。嫦娥五号任务的成功标志着我国探月工程“绕、落、回”三步走规划如期完成。该项“采”表述错误，应为“回”。\nB项正确，2004年，中国正式开展月球探测工程，并命名为“嫦娥工程”。嫦娥工程分为“无人月球探测”“载人登月”和“建立月球基地”三个阶段。\nC项正确，嫦娥二号，是中国探月计划中的第二颗绕月人造卫星。2010年10月1日，中国第二颗绕月探测卫星“嫦娥二号”在西昌卫星发射中心发射升空；2010年10月6日，嫦娥二号被月球捕获，进入环月轨道；2011年8月25日，嫦娥二号进入拉格朗日L2点环绕轨道；我国的嫦娥二号再次实现了环绕月球的目标。2012年12月15日，嫦娥二号工程宣布收官。嫦娥二号任务的圆满成功，标志着中国在深空探测领域突破并掌握了一大批新的具有自主知识产权的核心技术和关键技术，为后续实施探月二期工程的“落”和“回”以及下一步开展火星等深空探测奠定了坚实技术基础，中国从航天大国迈向航天强国的进程又跨出了重要的一步。\nD项正确，2019年1月3日，嫦娥四号探测器成功自主着陆在月球背面南极—艾特肯盆地内的冯·卡门撞击坑内，实现人类探测器首次在月球背面软着陆。\n本题为选非题，故正确答案为A。","no":3,"missingImage":false},{"type":"question","qid":"3523518","cat":"人文常识","stem":"下列关于讲政治的表述不准确的是：","options":{"A":"不忘初心，牢记使命是讲政治最本质的要求","B":"必须提高政治识别力、政治领悟力、政治执行力","C":"讲政治，概括起来说就是从政治上观察和处理问题","D":"党领导人民治国理政，最重要的就是坚持正确政治方向，始终保持我们党的政治本色，始终沿着中国特色社会主义道路前进"},"answer":"B","explanation":"本题考查政治常识。\nA项正确，不忘初心，牢记使命是讲政治最本质的要求。职位越高越要忠于人民，全心全意为人民服务。只有敬畏法律、敬畏纪律，自觉管住自己，在廉洁自律上作出表率，才能担起肩上的重任。而最与初心和使命相背离的就是种种腐化堕落、特权思想。\nB项错误，中共中央政治局于2020年12月24日至25日召开的民主生活会中，习近平指出，必须增强政治意识，善于从政治上看问题，善于把握政治大局，不断提高政治判断力、政治领悟力、政治执行力。\nC项正确，讲政治，概括起来说就是从政治上观察和处理问题。中共中央政治局于2020年12月24日至25日召开的民主生活会中，习近平指出，旗帜鲜明讲政治，既是马克思主义政党的鲜明特征，也是我们党一以贯之的政治优势。\nD项正确，中共中央政治局于2020年12月24日至25日召开的民主生活会中，习近平指出，党领导人民治国理政，最重要的就是坚持正确政治方向，始终保持我们党的政治本色，始终沿着中国特色社会主义道路前进。这就是讲政治背后的大逻辑。\n本题为选非题，故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"3523538","cat":"法律常识","stem":"下列关于2021年3月1日起施行的《中华人民共和国长江保护法》的亮点描述准确的是：\n①做好了统筹协调、系统保护的顶层设计\n②坚持把保护和修复长江流域生态环境放在压倒性位置\n③突出共抓大保护、不搞新开发\n④坚持责任导向，加大处罚力度\n⑤切实增强了长江保护和发展的系统性、整体性、协同性","options":{"A":"①③④","B":"②④⑤","C":"①②③④","D":"①②④⑤"},"answer":"D","explanation":"本题考查法律常识。\n①正确，该法中规定国家建立长江流域协调机制，统一指导、统筹协调、整体推进长江保护工作；按照中央统筹、省负总责、市县抓落实的要求，建立长江保护工作机制，明确各级政府及其有关部门、各级河湖长的职责分工；建立区域协调协作机制，明确长江流域相关地方根据需要在地方性法规和政府规章制定、规划编制、监督执法等方面开展协调与协作，切实增强长江保护和发展的系统性、整体性、协同性。故该法做好了统筹协调、系统保护的顶层设计。\n②正确，该法通过规定更高的保护标准、更严格的保护措施，加强山水林田湖草整体保护、系统修复。如强化水资源保护，加强饮用水水源保护和防洪减灾体系建设，完善水量分配和用水调度制度，保证河湖生态用水需求；落实党中央关于长江禁渔的决策部署，加强禁捕管理和执法工作等。故该法体现了把保护和修复长江流域生态环境放在压倒性位置。\n③错误，根据《中华人民共和国长江保护法》第三条规定：“长江流域经济社会发展，应当坚持生态优先、绿色发展，共抓大保护、不搞大开发。”“不搞新开发”表述错误。\n④正确，该法强化考核评价与监督，实行长江流域生态环境保护责任制和考核评价制度，建立长江保护约谈制度，规定国务院定期向全国人大常委会报告长江保护工作；坚持问题导向，针对长江禁渔、岸线保护、非法采砂等重点问题，在现有相关法律的基础上补充和细化有关规定，并大幅提高罚款额度，增加处罚方式，补齐现有法律的短板和不足，切实增强法律制度的权威性和可执行性。故该法体现了坚持责任导向，加大处罚力度。\n⑤正确，该法做好了统筹协调、系统保护的顶层设计，明确了各方职责分工，切实增强长江保护和发展的系统性、整体性、协同性。\n故①②④⑤正确。\n故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"3522668","cat":"法律常识","stem":"关于《中华人民共和国民法典》，下列说法错误的是：","options":{"A":"允许抵押耕地使用权","B":"将绿色原则作为民法的基本原则","C":"明确了生态环境损害的修复和赔偿规则","D":"将无民事行为能力人最高年龄标准调整为10周岁"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国民法典》第三百九十九条第二项规定：“下列财产不得抵押：······（二）宅基地、自留地、自留山等集体所有土地的使用权，但是法律规定可以抵押的除外；······”民法典删除了“耕地”不得抵押的情形，故允许抵押耕地使用权。\nB项正确，根据《中华人民共和国民法典》第九条规定：“民事主体从事民事活动，应当有利于节约资源、保护生态环境。”绿色原则是民法的基本原则之一。\nC项正确，根据《中华人民共和国民法典》第一千二百三十二条规定：“侵权人违反法律规定故意污染环境、破坏生态造成严重后果的，被侵权人有权请求相应的惩罚性赔偿。”第一千二百三十四条规定：“违反国家规定造成生态环境损害，生态环境能够修复的，国家规定的机关或者法律规定的组织有权请求侵权人在合理期限内承担修复责任。侵权人在期限内未修复的，国家规定的机关或者法律规定的组织可以自行或者委托他人进行修复，所需费用由侵权人负担。”故《民法典》明确了生态环境损害的修复和赔偿规则。\nD项错误，根据《中华人民共和国民法典》第二十条规定：“不满八周岁的未成年人为无民事行为能力人，由其法定代理人代理实施民事法律行为。”故无民事行为能力人最高年龄标准并没有调整为十周岁，而是八周岁。\n本题为选非题，故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"3522694","cat":"人文常识","stem":"下列历史名人按生活年代先后排序正确的是：","options":{"A":"周文王—管仲—孔子","B":"周公旦—李斯—楚庄王","C":"孙膑—诸葛亮—蒙恬","D":"屈原—勾践—伍子胥"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，周文王姬昌（前1152年―前1056年），周朝奠基者，其在位期间勤于政事，重视发展农业生产，礼贤下士，广罗人才。管仲（约公元前723年—公元前645年），春秋前期齐国著名的政治家、思想家，被齐桓公任命为相，在齐国进行了政治、经济等方面的一系列改革。孔子（公元前551年—公元前479年），春秋时期思想家、教育家，儒家学派的创始人。选项排序无误。\nB项错误，周公旦，西周初期杰出的政治家、军事家、思想家、教育家，曾两次辅佐周武王东伐纣王，并制作礼乐。李斯，战国末期楚国人，秦代著名的政治家、文学家和书法家，法家代表人物之一。楚庄王熊旅，春秋时期楚国国君，楚庄王元年（前613年）至楚庄王二十三年（前591年）在位，春秋五霸之一。选项排序有误，楚庄王生活的年代在李斯之前。\nC项错误，孙膑是战国时期齐国军事家，春秋战国时期诸子百家之一的兵家代表人物，其军事思想主要集中于《孙膑兵法》。诸葛亮是三国时期蜀汉丞相，先后辅佐刘备、刘禅两朝。蒙恬，秦朝时期名将，秦统一六国后，蒙恬三十万大军北击匈奴，收复河南之地，威震匈奴，被誉为“中华第一勇士”。选项排序有误，蒙恬生活的年代在诸葛亮之前。\nD项错误，屈原（约公元前340年—公元前278年），战国时期楚国诗人、政治家，被誉为“楚辞之祖”。越王勾践（约公元前520年-公元前464年），夏禹后裔，越王允常之子，春秋末年越国国君。伍子胥（约公元前559年-公元前484年），春秋末期吴国大夫、军事家。选项排序有误，屈原生活的年代在伍子胥、勾践之后。\n故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"3522662","cat":"人文常识","stem":"某小区业主拟将其住宅改变为经营性民宿，下列选项中不属于其应当具备的前提条件是：","options":{"A":"应当遵守国家有关公共防疫的规定","B":"应当遵守由业主共同制定的管理规约","C":"应当获得该业主所在楼栋的其他全体业主同意","D":"应当获得小区全体业主三分之二以上多数同意"},"answer":"D","explanation":"本题考查法律常识。\nA、B、C三项正确，D项错误。根据《民法典》第二百七十九条规定：“业主不得违反法律、法规以及管理规约，将住宅改变为经营性用房。业主将住宅改变为经营性用房的，除遵守法律、法规以及管理规约外，应当经有利害关系的业主一致同意。”故业主将住宅改变为经营性用房民宿，应当遵守法律、法规（国家有关公共防疫的规定等）及小区业主共同制定的管理规约，应当经有利害关系的业主（业主所在楼栋的其他全体业主）一致同意。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"3522675","cat":"人文常识","stem":"关于农谚“小雪雪满天，来岁必丰年”所涉及的原理，下列说法错误的是：","options":{"A":"新雪孔隙度高、空气多，对土壤有防冻保湿作用","B":"雪融化时吸收土壤内部热量，越冬虫卵不易存活","C":"雪中含有大量磷化物，融化后可为土壤提供肥料","D":"雪融化时入土壤，提高土壤含水量，缓解春旱"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，新雪的密度低、孔隙度高，贮藏在新雪中的空气多，而空气是热的不良导体，因此土壤中热量的散失较少，可以起到防冻保湿的作用。\nB项正确，雪融化时从土壤中吸收许多热量，这时土壤会突然变得非常寒冷，温度降低许多，越冬虫卵不易存活。\nC项错误，雪是大量白色不透明冰晶和其聚合物组成的降水，由大气中的水蒸气直接凝华而成。根据测定，雪水中含有一定量的氮化物。雪水渗入土壤，就等于施了一次氮肥。用雪水喂养家畜家禽、灌溉庄稼都可收到明显的效益。\nD项正确，寒潮以后，天气渐渐回暖，雪慢慢融化，雪融下去的水可以提高土壤含水量，给庄稼积蓄很多水，对春耕播种以及庄稼的生长发育都很有利。\n本题为选非题，故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"3522659","cat":"人文常识","stem":"新文化运动是一场思想文化革新、文学革命运动。下列新文化运动代表人物与其作品对应错误的是∶","options":{"A":"蔡元培—《中国伦理学史》","B":"陈独秀—《文学改良刍议》","C":"胡适—《中国哲学史大纲》","D":"李大钊—《布尔什维主义的胜利》"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，《中国伦理学史》是由蔡元培所作的第一部系统整理和研究中国古代伦理思想发生、发展及其变迁的学术著作，全书分绪论、先秦创史时代、汉唐继承时代、宋明理学时代四大部分32章，系统地介绍了中国古代伦理学界重要的流派及主要代表人物，并阐述了各家学说的要点、源流及发展。\nB项错误，《文学改良刍议》是由胡适所作，并于1917年1月发表。《文学改良刍议》是倡导文学革命的第一篇文章。\nC项正确，《中国哲学史大纲》是胡适写定于1918年9月的书，此书一出版即因其方法和见解的创新而极受注意，3年时间再版了7次。此书被誉为：用现代学术方法系统研究中国古代哲学史的第一部著作，它的出版被视为中国哲学史学科成立的标志。\nD项正确，《布尔什维主义的胜利》是由李大钊所作，于1918年11月载于《新青年》。文章热烈欢呼十月革命的胜利，认为这是民主主义的胜利，是布尔什维的胜利，是世界劳工阶级的胜利。\n本题为选非题，故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"3523535","cat":"人文常识","stem":"中华传统美德是中华文化精髓，蕴含着丰富的思想道德资源，凝聚着数千年来中华民族关于个人品德修养和行为规范的思考和表达。下列关于中华传统美德的表述正确的有几项？\n①天行健，君子以自强不息\n②天下兴亡，匹夫有责\n③美德即知识\n④仁者爱人","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查人文常识。\n①正确，“天行健，君子以自强不息”出自《易传》中的《象传》，意为宇宙不停运转，人应效法天地，永远不断地前进。体现了传统美德中的励志自强、崇尚精神境界。\n②正确，“天下兴亡，匹夫有责”是清朝初年著名儒者顾炎武的社会主张，意为国家的兴盛或衰亡，每个普通人都有一份责任。体现了传统美德中爱国奉献、以天下为己任的社会责任感。\n③错误，“美德即知识”是古希腊哲学家苏格拉底的道德伦理命题，出自公元前420年柏拉图的著作《美诺篇》。“美德”指人的所有优秀品质，“知识”指整个世界的理念知识和善的知识。苏格拉底认为，道德即知识，道德与知识是同一的，美德并非天生，而是得自于教育。其不属于中华传统美德的表述。\n④正确，“仁者爱人”出自《孟子·离娄章句下》，意为仁者是充满慈爱之心，满怀爱意的人；仁者是具有大智慧、人格魅力的人。体现了传统美德中乐群贵和，强调人际和谐的精神。\n综上所述，表述正确的有①②④三项。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"3522664","cat":"科技常识","stem":"关于诗词中反映的生物知识，下列说法错误的是：","options":{"A":"“有意栽花花不发，无心插柳柳成荫”描述的是柳树进行无性繁殖","B":"“银烛秋光冷画屏，轻罗小扇扑流萤”中的萤火虫发光是一种物理变化","C":"“野蚕作茧人不取，叶间扑扑秋蛾生”中的野蚕发育过程属于完全变态","D":"“等闲识得东风面，万紫千红总是春”中花色在红紫间变化是由于花青素"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，“有意栽花花不发，无心插柳柳成荫”指的是柳树用的扦插的方式进行繁殖的，扦插是常见的营养繁殖的方法，没有经过两性生殖细胞的结合过程，所以是无性生殖。\nB项错误，“银烛秋光冷画屏，轻罗小扇扑流萤”中的萤火虫发光，是因为萤火虫身体末端下方有发光器，体内的荧光素和荧光素酶反应后生成的黄绿色荧光，是一种化学变化。\nC项正确，完全变态是昆虫在个体发育中，经过卵、幼虫、蛹和成虫4个时期。“野蚕作茧人不取，叶间扑扑秋蛾生”中的野蚕发育过程是由卵到幼虫，再到蛹，最后成虫，是一个完全变态发育的过程。\nD项正确，花青素又称花色素，是自然界一类广泛存在于植物中的水溶性天然色素，这类色素的颜色，随细胞液的酸碱度变化而变化。花青素在碱性溶液中呈蓝色，在酸性溶液中呈红色，而在中性溶液中则呈紫色。因此凡是含有大量花青素的花瓣其颜色都在红、蓝、紫三色之间变化着。因此，“等闲识得东风面，万紫千红总是春”中花色在红紫间变化是由于花青素。\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"3522665","cat":"科技常识","stem":"下列说法符合医学常识的是：","options":{"A":"酒精浓度越高消毒效果越好","B":"使用含氯的牙膏有利于防龋齿","C":"缺碘可能会造成甲状腺素缺乏","D":"可作为麻醉剂的乙醚无色无味"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，酒精浓度越高，使蛋白质凝固的作用越强。当高浓度的酒精与细菌接触时，就能使菌体表面迅速凝固，形成一层包膜，阻止了酒精继续向菌体内部渗透，细菌内部的细胞没能彻底杀死，待到适当时机，包膜内的细胞可能将包膜冲破重新复活，则达不到消毒的效果。所以，选择浓度为\u003cimg data-k=\"6f4ae0e851d1\">的医用酒精最为适宜。\nB项错误，龋病是牙体硬组织脱矿与再矿化动态平衡被打破的结果。脱矿，就是牙齿中的矿物质溶解、流失；而再矿化，就是溶解的矿物盐重新在牙齿上沉积。氟化物可使再矿化作用大于脱矿作用，阻止龋病的发展。\nC项正确，碘是合成甲状腺激素的重要原料，如果缺碘就会导致甲状腺激素合成障碍，引起的代偿性的甲状腺肿。\nD项错误，可作为麻醉剂的乙醚，是一种带有刺激性气味、无色、易燃、极易挥发的液体。\n故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"3522670","cat":"人文常识","stem":"坐在火车里透过车窗观察远处的景物，下列说法正确的是：\n①远处景物朝火车前进的方向旋转\n②远处景物朝背离火车前进的方向旋转\n③远处景物相对观察者移动快\n④远处景物相对观察者移动慢","options":{"A":"①④","B":"①③","C":"②③","D":"②④"},"answer":"A","explanation":"本题考查科技常识。\n乘客坐在火车里，以火车为参照系，无论是近处还是远处的景物，看起来都是朝火车前进的相反方向运动，且运动速度相同。近处和远处的景物移动相同距离时，由于近处的景物对人的眼睛造成的视角更大，所以看起来移动的距离更大。因此，在火车上的人看来，近处的景物向后运动得快，而远处的景物向后运动得慢。故④表述正确。\n人在火车上同时看近处和远处的景物时，会不自觉地以近处的景物为参照物，这样远处的景物看起来就像在朝火车前进的方向旋转。故①表述正确。\n故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"3522696","cat":"人文常识","stem":"下列与地震有关的说法错误的是：","options":{"A":"冲击地震震源浅，影响范围小","B":"水库蓄水、地下抽水可诱发地震","C":"火山地震与构造地震常有密切关系","D":"我国的强震绝大部分是深源构造地震"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，冲击地震因山崩、滑坡等原因引起，或因碳酸盐岩地区岩层受地下水长期溶蚀形成许多地下溶洞，洞顶塌落引起，约占地震总数的\u003cimg data-k=\"815ec268d3d4\">，震源很浅，影响范围小，震级也不大。\nB项正确，在一定条件下，人类的工程活动可以诱发地震，诸如水库蓄水、城市或油田的抽水或注水、矿山坑道的崩塌、以及人工爆破或地下核爆炸等都能引起当地出现异常的地震活动，这类地震活动统称为诱发地震。\nC项正确，火山地震可以是直接由火山爆发引起，也可能是因火山活动引起构造变动，或是因构造变动引起火山喷发，从而导致地震。构造地震是由构造变动特别是断裂活动所产生的地震。因此，火山地震与构造地震常有密切关系。\nD项错误，全球绝大多数地震是构造地震，约占地震总数的\u003cimg data-k=\"98d1a3adb731\">。其中大多数又属于浅源地震，影响范围小，对地面及建筑物的破坏非常强烈，常引起生命财产的重大损失。我国的强震绝大部分是浅源构造地震，其中\u003cimg data-k=\"cd4db1324e77\">以上均与断裂活动有关。\n本题为选非题，故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"4703270","cat":"科技常识","stem":"中国向世界宣布，被誉为“中国天眼”的500米口径球面射电望远镜（FAST）2021年4月1日起将正式对全球科学界开放。下列有关“中国天眼”的说法中正确的是：","options":{"A":"“中国天眼”并非世界最大的球面射电望远镜","B":"“中国天眼”之父是姜鹏","C":"“中国天眼”可用来发现脉冲星","D":"“中国天眼”所在地区属于丹霞地貌"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，500米口径球面射电望远镜（FAST），是中国“十一五”重大科技基础设施建设项目，2020年1月11日通过国家验收工作。目前，“中国天眼”是世界上最大的也是最灵敏的球面射电望远镜。\nB项错误，南仁东曾任FAST工程首席科学家兼总工程师，负责500米口径球面射电望远镜（FAST）的科学技术工作，被誉为“中国天眼”之父。\nC项正确，FAST作为一个多学科基础研究平台，能够巡视宇宙中的中性氢，研究宇宙大尺度物理学，以探索宇宙起源和演化；观测脉冲星，研究极端状态下的物质结构与物理规律；搜索可能的星际通讯信号，搜寻外星文明等。\nD项错误，“中国天眼”位于贵州省黔南布依族苗族自治州平塘县大窝凼的喀斯特洼坑中，属于喀斯特地貌。\n故正确答案为C。","no":16,"missingImage":false},{"type":"question","qid":"3522702","cat":"地理国情","stem":"下列关于黄河流域的说法错误的是:","options":{"A":"陕西境内秦岭以北的河流皆属该流域","B":"以“水少沙多、水沙异源”为突出特点","C":"该流域下游常因泥沙堆积形成“地上河”","D":"“泾渭分明”的现象发生在该流域的上游"},"answer":"D","explanation":"本题考查地理国情。\n黄河发源于青海省中部，巴颜喀拉山北麓，流经青海、四川、甘肃、宁夏、内蒙古、陕西、山西、河南、山东9个省、自治区，注入渤海，全长5464千米，是中国第二大河。\nA项正确，陕西境内绝大部分为外流河，分属黄河、长江两大水系。从地域分布上看，秦岭以南的长江水系，流域面积占全省的\u003cimg data-k=\"25cf5647428a\">，水资源量占到全省总量的\u003cimg data-k=\"436f7ab7854d\">，而秦岭以北的黄河水系，流域面积占全省的\u003cimg data-k=\"6e5bbaa4a13d\">，水资源量仅占\u003cimg data-k=\"c78f19de7451\">。\nB项正确，黄河主要流经干旱、半干旱和半湿润区，降水量较少，蒸发量大，所以水量小，中游流经黄土高原地区，水土流失严重，含沙量大。黄河的水量主要来自兰州以上的上游河段，而泥沙主要来自中游的黄土高原，具有“水沙异源”的突出特点。\nC项正确，黄河流域西界巴颜喀拉山，北抵阴山，南至秦岭，东注渤海。流域内地势西高东低，高差悬殊，形成自西而东、由高及低三级阶梯。第三级阶梯地势低平，绝大部分为海拔低于100米的华北大平原，包括下游冲积平原、鲁中丘陵和河口三角洲。黄河流入冲积平原后，河道宽阔平坦，泥沙沿途沉降淤积，河床高出两岸地面3-5米，甚至10米，形成“地上河”。\nD项错误，黄河上游流经青海、四川、甘肃、宁夏、内蒙古五省区的19个市州。而“泾渭分明”是指黄河的支流“泾河”和“渭河”，两河位于黄河流域的中游。渭河位于黄河腹地大“几”字形基底部位，是黄河最大支流，同时也是向黄河输送水、沙最多的支流；泾河，发源于宁夏泾源县六盘山东麓，于陕西高陵县注入渭河，是渭河的主要来沙区。两条河流的清与浊常随着季节发生交替变化，夏季丰水期两条河流含沙量都很高，界限不清晰。到了冬季枯水期，泾河的含沙量会下降，这时候就会呈现出“泾渭分明”的标志性现象。\n本题为选非题，故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"3522701","cat":"人文常识","stem":"王某向李某借款1万元，李某当场向王某交付现金1万元，王某向李某出具借条一份，张某在该借条上签字，后王某没有按时还钱，李某将王某和张某同时起诉至法院，要求王某还钱，并要求张某承担连带责任。关于张某的责任，下列说法正确的是:","options":{"A":"张某只是作为见证人签字，无须承担任何责任","B":"张某在别人的借条上签字，应当推定为保证人，并承担保证责任","C":"张某在别人的借条上签字，视同共同借款人，应当承担共同还款责任","D":"只要借条上没有任何明确表述或其他事实表明张某愿意承担保证责任的，张某即无须承担任何责任"},"answer":"D","explanation":"本题考查法律常识。\n根据《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第二十条规定：“他人在借据、收据、欠条等债权凭证或者借款合同上签名或者盖章，但是未表明其保证人身份或者承担保证责任，或者通过其他事实不能推定其为保证人，出借人请求其承担保证责任的，人民法院不予支持。”故只要借条上没有任何明确表述或其他事实表明张某愿意承担保证责任的，张某即无须承担任何责任。\n故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"3522699","cat":"经济常识","stem":"下列关于数字货币和数字人民币的表述不准确的是:","options":{"A":"从2020年下半年开始，数字人民币已在深圳、苏州等地展开大规模试点测试","B":"数字人民币是由中国人民银行发行的具有国家信用背书的法定货币，是数字形式的人民币","C":"没有银行账户，同样可以享受支付等金融服务，但持有的数字人民币在数字钱包里不计付利息","D":"数字人民币装在无形的数字钱包里，可用于线下和线上交易，但没有网络就不可付款，即不能“离线”支付"},"answer":"D","explanation":"本题考查经济常识。\nA项正确，2020年下半年以来，数字人民币在深圳、苏州等地面向不定向公众展开大规模试点测试。\nB项正确，数字人民币是由中国人民银行发行的具有国家信用背书的法定货币，是数字形式的人民币。数字人民币的定位是替代一部分现金。\nC项正确，数字人民币以广义账户体系为基础、支持银行账户松耦合，即意味着用户如果没有银行账户，同样可以利用手机号等唯一身份标识开通数字钱包，使用数字人民币进行支付，但持有的数字人民币在数字钱包里不计付利息。\nD项错误，目前，现金主要以纸币和硬币等实物形态存在，而数字人民币可以理解为数字形态的现金。纸币、硬币装在有形的钱包里，携带较为不便，多用于线下交易；数字人民币装在无形的数字钱包里，可用于线下和线上交易，且数字人民币具有“离线”支付功能。所谓“离线”支付，是指在无网或弱网条件下，用户进行交易或转款时不连接后台系统，而是在数字钱包中验证用户身份、确认交易信息并进行支付的方式，即没有网络也能付款。\n本题为选非题，故正确答案为D。","no":19,"missingImage":false},{"type":"question","qid":"3523519","cat":"科技常识","stem":"下列根据特性规律组合而成的对应关系，错误的是：","options":{"A":"蜘蛛——昆虫——节肢动物","B":"花生——双子叶植物——被子植物","C":"乳腺——鸭嘴兽——哺乳动物","D":"种子——松树——裸子植物"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，蜘蛛不是昆虫，昆虫的基本特征是体躯分为头部、胸部、腹部三段，一对触角，一般有两对翅，三对足。昆虫属于节肢动物门昆虫纲，蜘蛛是节肢动物门、蛛形纲、蜘蛛目所有种的通称。\nB项正确，花生又名落花生、双子叶植物，叶脉为网状脉，种子有花生果皮包被。花生是被子植物，被子植物的主要特点是种子外有果皮包被。花生有根、茎、叶、花、果实和种子六大器官，种子外有果皮包被着。\nC项正确，鸭嘴兽是最原始的哺乳动物之一，它是未完全进化的哺乳动物，种类极少，同属之中只有鸭嘴兽一种动物，也是最低等的哺乳动物之一。鸭嘴兽的雌兽体内有乳腺，能分泌乳汁哺育幼兽。\nD项正确，松树是裸子植物。裸子植物的种子是暴露在空气中的。\n本题为选非题，故正确答案为A。","no":20,"missingImage":false}],"count":19,"answerable":19,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"3522654","cat":"逻辑填空","stem":"区块链的诸多特征使其成为一项备受期待的革命性技术，而目前这一技术的应用潜能还远未被完全开发。今天我们看到的区块链技术在金融、物流、医疗、保险等领域的应用，仅是             般的一瞥所见，尚有许多应用正在被尝试、推广。\n填入画横线部分最恰当的一项是：","options":{"A":"浮光掠影","B":"走马观花","C":"蜻蜓点水","D":"浅尝辄止"},"answer":"A","explanation":"根据“仅是······般的一瞥所见，尚有许多应用正在被尝试、推广”可知，文段要体现的是区块链现在所涉及的应用领域仅是我们观察到的一部分，还有正在发掘的领域，且横线要与“一瞥所见”构成对应，体现出我们一眼看到这些领域后得到的印象。A项“浮光掠影”比喻观察不细致，得到的只是事物的一些表面现象，侧重观察的结果是印象不深刻，符合文意，当选。\nB项“走马观花”比喻匆忙地不深入细致地观察事物，侧重于观察的过程很粗略，横线处对应看到的结果，而非看这些领域的过程，与文意不符，排除。C项“蜻蜓点水”比喻浮浅地接触，浮皮潦草，很不深入地做事，侧重做事情不深入，D项“浅尝辄止”比喻不往深处研究，不深入钻研，侧重于做事情不深入钻研，文段体现的是我们今天看到的区块链，强调的是“看”的结果，并非强调“做事”，均与文意不符，排除。\n故正确答案为A。\n【文段出处】《挖掘区块链商机 美国在行动》","no":21,"missingImage":false},{"type":"question","qid":"3522656","cat":"逻辑填空","stem":"教育，最终都是为了促进人的全面发展，帮助下一代提高生存能力。批评惩戒和赏识鼓励是            的两种方式，有些时候，“当头棒喝”甚至比温言软语更有效果。\n填入画横线部分最恰当的一项是：","options":{"A":"如影随形","B":"并行不悖","C":"各有所长","D":"不可或缺"},"answer":"B","explanation":"根据后文“有些时候，‘当头棒喝’甚至比温言软语更有效果”可知，横线处应表示，两种方式都有效果，并不存在“当头棒喝”就效果不好之意。B项“并行不悖”指同时进行，互相不违背，可体现出两种方式虽看似完全相反，但都可以起到教育作用之意，符合文意，当选。\nA项“如影随形”指好像影子总是跟着身体一样。比喻两个事物关系密切或两个人关系密切不能分离。“批评惩戒”与“赏识鼓励”并非如影随形，往往是单一出现，排除；\nC项“各有所长”指各有各的长处、优点，一般多指人才而言，且该词一般用于表示大家都有自己的优势，不相上下，与后文文意不符，排除；\nD项“不可或缺”表示非常重要，不能有一点缺失，文段并未体现出两种方式都不能少之意，与前后文语境不符，排除。\n故正确答案为B。\n【文段出处】《缺乏“棒喝”的教育有缺陷》","no":22,"missingImage":false},{"type":"question","qid":"3522671","cat":"逻辑填空","stem":"几乎所有成年人都只能使用左脑处理语句。但对儿童而言，任何一个大脑半球的损伤都不太可能影响语言学习，这说明在早期阶段人脑的两个半球都具有这种能力。美国乔治敦大学神经学家指出，这为神经损伤提供了一种        机制。例如，如果左半球受到围产期中风的        ，新生儿将使用右半球学习语言。\n依次填入画横线部分最恰当的一项是：","options":{"A":"赔偿 祸害","B":"补偿 损害","C":"补充 损失","D":"填充 毁坏"},"answer":"B","explanation":"第一空，搭配“机制”，体现早期阶段人脑的两个半球对于“神经损伤”的功用，结合横线后的例子可知，当新生儿大脑左半球遭受中风时，右半球可以有效补位，以减少对语言学习的影响。B项“补偿”指补足，用以抵消损失、消耗等，C项“补充”指原来不足或有损失时，增加一部分，二者均符合语境，保留。A项“赔偿”指由于自己的行动而使他人蒙受损失从而给予补偿，新生儿的这一机制是对自身神经损伤的补偿，而非他人，不符合文意，排除；D项“填充”多指对某个空间的填补，与文段语境不符，排除。\n第二空，搭配“中风”，体现中风对大脑左半球的伤害。B项“损害”指使事业、利益、健康、名誉等蒙受损失，与“中风”搭配得当，当选。C项“损失”指没有代价地消耗或失去，多与“金钱”“产品”等具象化事物搭配，与“中风”搭配不当，排除。\n故正确答案为B。\n【文段出处】《研究显示：儿童同时使用左右半脑进行语言学习》","no":23,"missingImage":false},{"type":"question","qid":"3523507","cat":"逻辑填空","stem":"我国有很庞大的老年群体，但他们却因为科技的发展，在生活中有很多地方            。不是他们            ，不想接触新事物，而是一辈子的习惯，不是说改就能改的。\n依次填入画横线部分最恰当的一项是：","options":{"A":"寸步难行 墨守成规","B":"步履艰难 画地为牢","C":"艰难跋涉 抱残守缺","D":"举步维艰 固步自封"},"answer":"D","explanation":"第一空，根据文意可知，老年人在科技发展的背景下，生活中会面临很多不便，因此横线处应表示老年人在很多地方不是很方便。B项“步履艰难”指行走困难、行动不方便，D项“举步维艰”指迈步艰难，比喻办事情每向前进行一步都十分不容易，均符合文意，保留。A项“寸步难行”指连一步都难以进行，形容走路、行动困难，比喻开展某项工作困难重重，用于此处程度过重，排除；C项“艰难跋涉”强调路程很艰苦，或者事业方面很艰辛，体现不出老年群体的不方便，排除。 \n第二空，根据后文“不想接触新事物”可知，横线处应体现古板、不肯接受新鲜事物之意。D项“固步自封”形容保守，安于现状，不求改进，符合文意，当选。B项“画地为牢”比喻只许在指定的范围内活动，表意与是否保守、不接受新事物无关，排除。\n故正确答案为D。\n【文段出处】《边亚峰：交医保拒收人民币是一种违法犯罪》","no":24,"missingImage":false},{"type":"question","qid":"3523498","cat":"逻辑填空","stem":"从长远看，电影产业的发展必然要拥抱网络平台，但是院线依然具有            的优势，观影社交仪式感、巨幕、3D沉浸式体验以及高度还原的环绕立体声，这些都是网上观影所不具备的，影院和互联网带来的始终是两种            的观影体验。\n依次填入画横线部分最恰当的一项是：","options":{"A":"遥遥领先 大相径庭","B":"独一无二 背道而驰","C":"不可替代 截然不同","D":"无与伦比 各有所长"},"answer":"C","explanation":"第一空，根据后文“观影社交仪式感······这些都是网上观影所不具备的”可知，横线处应体现院线的这些特点是网上观影所没有的，B项“独一无二”形容唯一的，没有与之相同的，C项“不可替代”指某人或某物是不能够用他人或他物来进行代替的，均符合文意，保留。A项“遥遥领先”指远远地走在最前面，强调比别人快，与文意不符，排除；D项“无与伦比”指事物非常完美，没有能跟他相比的，文段并未说明院线的这些特征是最好的，语义程度过重，排除。\n第二空，形容影院和互联网所带来的观影体验，根据前文可知，影院和互联网所带来的观影体验应该是不同的，C项“截然不同”形容两种事物没有一点共同之处，符合文意，当选。B项“背道而驰”指背离正确的目标，朝相反的方向走，文段并未强调偏离正道，与文意不符，排除。\n故正确答案为C。\n【文段出处】《&lt;囧妈&gt;等新片临时变阵 院线电影有了发行新模式》","no":25,"missingImage":false},{"type":"question","qid":"3522591","cat":"逻辑填空","stem":"国无德不兴，人无德不立。如果一个民族、一个国家没有共同的核心价值观，            ，行无依归，那这个民族、这个国家就无法前进。这样的情形，在我国历史上，在当今世界上，都            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"莫衷一是  屡见不鲜","B":"自以为是  数不胜数","C":"各行其是  不一而足","D":"积非成是  层出不穷"},"answer":"A","explanation":"第一空，根据横线前“没有共同的核心价值观”和后文“行无依归”可知，填入横线处的成语强调没有统一的思想作支撑。A项“莫衷一是”指各有各的意见，不能得出一致的结论，置于此处能够体现出思想不统一，符合文意，保留。B项“自以为是”形容认为自己的看法和做法都正确，不接受别人的意见，侧重强调认为自己是正确的，与文意无关，排除；C项“各行其是”形容按照各自认为对的去做，比喻各搞一套，侧重强调做法，与文意无关，排除；D项“积非成是”指长期所形成的错误，往往被当作正确的，与文意无关，排除。\n第二空，代入验证，根据前文“这样的情形，在我国历史上，在当今世界上”可知，填入横线处的成语表达这样的情形很常见。A项“屡见不鲜”意思是常常见到，并不新奇，符合文意，当选。\n故正确答案为A。\n【文段出处】《习近平：青年要自觉践行社会主义核心价值观——在北京大学师生座谈会上的讲话》","no":26,"missingImage":false},{"type":"question","qid":"3522596","cat":"逻辑填空","stem":"学术研究是一项严谨缜密的科学工作，            是其研究的前提基础。学术不求真便会没有标准，当真正的学术研究被        、舆论炒作成为风气之时，便意味着学术低谷的到来。\n依次填入画横线部分最恰当的一项是：","options":{"A":"实事求是 放弃","B":"有的放矢 遗忘","C":"去伪存真 冷落","D":"推陈出新 忽视"},"answer":"C","explanation":"第一空，根据文段“学术研究是一项严谨缜密的科学工作”“学术不求真便会没有标准”可知，横线处体现的是学术研究要严谨缜密、要求真，A项“实事求是”指从实际情况出发，C项“去伪存真”意思是除掉虚假的，留下真实的，均符合文意，保留。B项“有的放矢”比喻说话做事有针对性，文段未体现针对性，排除；D项“推陈出新”指去掉旧事物的糟粕，取其精华，并使它向新的方向发展，与文意不符，排除。\n第二空，根据后文“便意味着学术低谷的到来”可知，横线处词语程度较轻，C项“冷落”形容受到冷淡的待遇，置于此处程度较轻，符合文意，当选。A项“放弃”搭配“学术研究”，程度过重，排除。\n故正确答案为C。\n【文段出处】《造假与炒作的背后》","no":27,"missingImage":false},{"type":"question","qid":"3522599","cat":"逻辑填空","stem":"电视在家庭中基本可以保证固定的开机时长，这就给电视广告提供了足够大的“曝光”空间，不仅可以提高受众的          ，同时更容易在家庭成员之间产生共鸣，无形之中增强广告的        效果。\n依次填入画横线部分最恰当的一项是：","options":{"A":"积极性 营销","B":"多样化 吸引","C":"保有量 交互","D":"覆盖量 传播"},"answer":"D","explanation":"第一空，根据横线前“给电视广告提供了足够大的‘曝光’空间”以及“提高”可知，横线处应体现受众的数量有所提高之意。C项“保有量”指拥有的数量，D项“覆盖量”指在一定程度之内的数量，均符合文意，保留；A项“积极性”指进取向上的思想和表现，多搭配工作，文段未体现思想及表现，排除；B项“多样化”指种类多种多样，文段未提及种类，排除。\n第二空，搭配“广告”，根据“在家庭成员之间产生共鸣”可知，广告起到了传递信息的宣传作用，横线处应体现广告的宣传作用被增强之意。D项“传播”指广泛散布、信息传递，符合文意，当选；C项“交互”指相互联系交流，多用于人机交互，与广告搭配不当，排除。\n故正确答案为D。\n【文段出处】《互联网的下半场，电视产业的风口在哪里》","no":28,"missingImage":false},{"type":"question","qid":"3522604","cat":"逻辑填空","stem":"节约资源、减少垃圾生产成为某种意义上的公共事务，很容易遭遇“搭便车困境”——人人都想            ，最终会导致公共事务乏人问津。节约资源的功效并没有那么            ，需要人们久久为功；付出没有得到及时、有效的反馈与回报，难免会影响公众参与。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蜂拥而上 妙手回春","B":"鸠占鹊巢 神通广大","C":"据为己有 一劳永逸","D":"坐享其成 立竿见影"},"answer":"D","explanation":"第一空，由破折号可知，所填词语是对“搭便车困境”的解释说明。“搭便车”本义为自己不想开车，所以乘坐他人的便车；引申义为，自己不想付出努力而去享受他人带来的便利。D项“坐享其成”指的是自己不出力，而享受别人取得的成果，符合文意，保留。A项“蜂拥而上”指的是许多人一起涌上来，未体现出自己不出力，享受他人成果之意，不符合文意，排除；B项“鸠占鹊巢”指的是强占别人的房屋、土地、产业等，C项“据为己有”指的是占据为自己所拥有，“搭便车”并非强调占据别人的东西归自己所有，均与文意不符，排除。\n第二空，代入验证，根据“并没有······需要······”可知，横线处与后文“久久为功”语义相反，体现“时间短”之意。D项“立竿见影”指见效快，符合文意，当选。\n故正确答案为D。\n【文段出处】《“零浪费”用更深刻的环保观念拥抱美好生活》","no":29,"missingImage":false},{"type":"question","qid":"3522605","cat":"逻辑填空","stem":"世界上的一万多种鸟，其实各有各的美丽，从各种华丽的羽毛，到鸟喙的形状，到鸣唱的声音，不能不让我们        生物多样性的神奇。进化论之父达尔文在加拉帕戈斯群岛上通过观察当地鸟类发现，虽然这些鸟类很明显长得很相似，有着共同的祖先，但是它们的鸟喙形状却            。\n依次填入画横线部分最恰当的一项是:","options":{"A":"惊叹 大相径庭","B":"惊奇 毫无二致","C":"探索 云泥之别","D":"追寻 异曲同工"},"answer":"A","explanation":"本题可从第二空入手，横线前出现转折关联词“却”可知前后语义相反，横线前“鸟类很明显长得很相似，有着共同的祖先”体现“相似、一样”的含义，因此横线处应体现“不一样、不同”之意。A项“大相径庭”比喻相差很远，大不相同，符合文意，保留。B项“毫无二致”形容完全一样，D项“异曲同工”比喻一件事情的做法不同而都巧妙地达到目的，均与文意相悖，排除；C项“云泥之别”比喻地位的高下相差极大，文段并非论述地位的高下，仅在论述形状的不同，与文意不符，排除。\n第一空，代入验证，A项“惊叹”指惊奇赞叹，表达对生物多样性的赞美，感情色彩积极，符合文段语境，当选。\n故正确答案为A。\n【文段出处】《热带雨林中的鸟类和深海中的蠕虫，我们该保护哪个？》","no":30,"missingImage":false},{"type":"question","qid":"3522570","cat":"逻辑填空","stem":"量子计算将极大促进当前人工智能及其应用的发展，深刻地        包括基础教育在内的众多领域。特别是，借助于量子计算技术，人类对于微观世界的认识以及宏观世界的探索将得到极大扩展，从而引发人类思维能力的          提升。\n依次填入画横线部分最恰当的一项是：","options":{"A":"融合 战略性","B":"改变 根本性","C":"解决 突破性","D":"支持 阶段性"},"answer":"B","explanation":"第一空，搭配“领域”，“领域”指特定的范围或区域，B项“改变”指事物变得和原来不一样，与“领域”搭配恰当，保留。A项“融合”指融为一体，文中并无众多领域融为整体之意，不符合文意，排除；C项“解决”指处理使有结果，D项“支持”指支撑、赞同或鼓励，均与“领域”搭配不当，排除。\n第二空，代入验证。搭配“提升”，B项“根本性”意在强调基础或本质，根据文意可知，人类对世界的认识发生了本质上的改变，搭配恰当，符合文意，当选。\n故正确答案为B。\n【文段出处】《量子科技为何成为多国战略布局的重点领域》","no":31,"missingImage":false},{"type":"question","qid":"3522577","cat":"逻辑填空","stem":"原创是作品的生命力之源，抄袭无异于            。影视行业想要成为常青树，优质的原创作品是根基。如果任由抄袭之风盛行，        抄袭作者活跃在屏幕上，将        从业者的生存环境，消耗整个行业的未来前景。\n依次填入画横线部分最恰当的一项是：","options":{"A":"自相残杀 放纵 剥蚀","B":"自掘坟墓 纵容 腐蚀","C":"自投罗网 放任 消蚀","D":"自欺欺人 容许 磨蚀"},"answer":"B","explanation":"第一空，根据横线前的“无异于”可知，横线处所填词语是对前文的解释说明。由“原创是作品的生命力之源”可知，抄袭则会让作品失去生命。B项“自掘坟墓”是指自己的所作所为就像在替自己挖掘坟墓一样，比喻自寻死路，符合文意，保留。C项“自投罗网”指自己投到罗网里去，比喻自己送死，也可以体现让作品失去生命，保留。A项“自相残杀”指自己人互相杀害，文段未提及互相杀害，排除。D项“自欺欺人”指欺骗自己，也欺骗别人，文段未提及欺骗自己和欺骗别人，与文意无关，排除。\n第二空，根据横线前的“任由抄袭之风盛行”可知，横线处表示对抄袭作者不加约束，任由其发展，B项“纵容”指对错误行为不加制止、任其发展，C项“放任”指听其自然，不加约束或干涉，两项均符合文意，保留。\n第三空，搭配“生存环境”，根据横线后的“消耗整个行业的未来前景”可知，对抄袭不加约束会产生不好的结果，从业者的生存环境会遭到破坏，B项“腐蚀”比喻坏的思想或环境，使人逐渐变质堕落，与“生存环境”搭配恰当且符合文意，当选。C项“消蚀”意为消耗、消损，多指由于风或者其他气候因素所致的侵蚀而使地面降低，和题干中的“生存环境”搭配不当，排除。\n故正确答案为B。\n【文段出处】人民资讯《影视圈的抄袭之风，怎么破？》","no":32,"missingImage":false},{"type":"question","qid":"3522582","cat":"逻辑填空","stem":"2020年是紫禁城建成600年，也是故宫博物院成立95周年。紫禁城作为明清两代皇宫，它是中华民族宝贵的传统文化        ，也是著名的世界文化遗产。它不仅拥有中国古代最        的宫殿建筑群，还拥有一百八十余万件珍贵文物和大量的文献档案，承载着丰富的历史信息和文化印记，是中华民族记忆传统、        文脉、增强文化自信的重要资源。\n依次填入画横线部分最恰当的一项是：","options":{"A":"财产 巨大 继承","B":"产业 庞大 延续","C":"遗产 宏伟 传承","D":"象征 丰富 接续"},"answer":"C","explanation":"第一空，横线处所填词语要形容“紫禁城”，且需要搭配“传统文化”，C项“遗产”泛指历史上遗留下来的精神财富或物质财富，由“紫禁城建成600年”可知，它是历史遗留的宝贵财富，符合文意，且“遗产”与“传统文化”搭配得当，保留。A项“财产”指拥有的金钱、物资、房屋、土地等物质财富，与“传统文化”搭配不当，排除；B项“产业”可以指私有财产，如土地、房屋、工厂等，也可以指现代工业生产行业，“紫禁城”并非私有财产，也不是具体生产行业，排除；D项“象征”指能用来暗示特定的人、物或事理的具体的东西，如“白色是纯洁的象征”，而文段不存在这种暗示关系，排除。\n第二空，代入验证，横线处所填词语搭配“宫殿建筑群”，C项“宏伟”表示宏大雄伟，多与“建筑”类搭配，用于此处搭配得当，保留。\n第三空，代入验证，横线处所填词语搭配“文脉”，C项“传承”表示传授和继承，搭配得当，符合文意，当选。\n故正确答案为C。\n【文段出处】《600年的记忆：紫禁城历史上的几个关键词》","no":33,"missingImage":false},{"type":"question","qid":"3522589","cat":"逻辑填空","stem":"大多数群居的哺乳动物，雌性个体怀孕生育后，随着后代迅速        ，它们也会很快        原有的社会地位。然而在人类的大部分历史中，生育和照顾幼儿几乎是女性壮年时期的全职工作。有研究认为，人类婴儿的          ，让人类与母亲的关系与一般的动物相比更加紧密。\n依次填入画横线部分最恰当的一项是：","options":{"A":"成熟 改变 重要性","B":"分离 恢复 可塑性","C":"长大 获得 依附性","D":"独立 回归 脆弱性"},"answer":"D","explanation":"第一空，根据前后文可知，横线处应体现后代迅速成长之意，A项“成熟”、C项“长大”、D项“独立”均符合文意，保留。B项“分离”与“群居”矛盾，排除。\n第二空，通过转折词“然而”指出人类照顾幼儿是全职工作，可知“雌性哺乳动物”不是“全职”，“会很快回到‘原有的社会地位’”，D项“回归”符合文意，保留。A项“改变”、C项“获得”均未体现“会很快回到‘原有的社会地位’”之意，排除。\n第三空，代入验证，文段将动物的幼崽和人类的婴儿进行对比，其结果体现了人类婴儿的“脆弱性”，符合文意，D项当选。\n故正确答案为D。\n【文段出处】知识分子《站起来，双足走 | 36个月》","no":34,"missingImage":false},{"type":"question","qid":"3522595","cat":"逻辑填空","stem":"糖对健康有危害已经            ，大家也能很好地理解和接受“少糖”这一健康饮食的基本原则。但是人类对甜味的喜好是            的，“健康少糖”和“享受甜味”对于很多人来说是很        的选择。甜味剂的出现，为人们提供了二者兼得的可行选择。\n依次填入画横线部分最恰当的一项是：","options":{"A":"毋庸置疑 刻骨铭心 无奈","B":"深入人心 与生俱来 艰难","C":"显而易见 积重难返 被动","D":"妇孺皆知 根深蒂固 痛苦"},"answer":"B","explanation":"本题从第二空入手。横线处搭配“喜好”，且根据文意可知，横线处表达人类对甜味的喜好一直都有且很深刻。B项“与生俱来”指一出生就拥有的特性或行为，置于此处搭配恰当且符合文意，保留。A项“刻骨铭心”形容留下的印象极其深刻，永远忘不了，侧重将某物或某事“牢记于心”，与“喜好”搭配不当，排除；C项“积重难返”指积习深重，不易改变，常搭配“恶习”“弊端”，D项“根深蒂固”比喻基础稳固，不容易动摇，常搭配“思想”“观念”“主义”，均与“喜好”搭配不当，排除。\n第一空，代入验证，B项“深入人心”指理论、学说、政策等为人们深切了解和信服，填入横线处能体现出大家已理解和接受糖对健康的危害，符合文意，保留。\n第三空，代入验证，根据文意可知，很多人面对“健康少糖”和“享受甜味”时难以选择，B项“艰难”置于此处能体现出人们纠结、难以抉择的心理，符合文意，当选。\n故正确答案为B。\n【文段出处】《一种食品为什么要多种甜味剂？你最常听到的猜测都是错的》","no":35,"missingImage":false},{"type":"question","qid":"3523505","cat":"片段阅读","stem":"酸奶是以牛乳为原料，经灭菌、冷却、接种和发酵而制成，除保留了鲜牛奶的全部营养成分外，在发酵过程中还可产生人体所必需的多种维生素，同时钙含量比较高，且易被人体吸收；酸奶经发酵会产生酸性物质，可以促进肠胃蠕动，调节肠道微生态，进而促进消化和吸收，提高食欲，缓解便秘，促进排便，提高免疫力。\n这段文字没有谈到的是：","options":{"A":"酸奶的起源","B":"酸奶的成分","C":"酸奶的益处","D":"酸奶的制作"},"answer":"A","explanation":"A项，文段没有涉及酸奶的起源，表述错误，当选；\nB项，根据“除保留了鲜牛奶的全部营养成分外，在发酵过程中还可产生人体所必需的多种维生素，同时钙含量比较高”可知，文段介绍了酸奶的成分，表述正确，排除；\nC项，根据“易被人体吸收”“酸奶经发酵会产生酸性物质，可以促进肠胃蠕动，调节肠道微生态，进而促进消化和吸收，提高食欲，缓解便秘，促进排便，提高免疫力”可知，文段介绍了酸奶的益处，表述正确，排除；\nD项，根据“酸奶是以牛乳为原料，经灭菌、冷却、接种和发酵而制成”可知，文段介绍了酸奶的制作，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《老人喝酸奶好还是牛奶好？》","no":36,"missingImage":false},{"type":"question","qid":"3522580","cat":"片段阅读","stem":"资本天然是逐利的，本身并没有好坏之分。有序、合规的资本扩张，对于促进中国经济高质量发展具有重要意义，也是政策面所持续支持推动的。资本扩张有利于串联起产业链上下游企业，然而也带来了严峻的垄断问题。实际上，在这些行业融合、产业链整合的背后，是数字要素与传统生产要素的结合，根本上的要素垄断规律并没有改变，占据要素优势的企业仍然会获得垄断地位。而垄断将严重影响市场经济的竞争机制，降低市场效率，侵犯消费者权益，同时还会阻碍行业整体的创新进步，挫伤其他小微企业的积极性。\n接下来作者最有可能讲的是：","options":{"A":"需要遏制资本的进一步扩张","B":"加强对数字经济的立法管理","C":"对数字经济中的资本扩张的监管","D":"反垄断监管对保障经济发展的重要性"},"answer":"C","explanation":"文段首先引出“资本扩张”的话题并指出其作用，随后通过转折指出其会带来垄断的问题。接下来阐述数字要素与传统生产要素的结合，占据要素优势的企业会获得垄断地位，尾句进一步论述资本扩张导致的垄断所带来的问题与危害。所以接下来应该根据文段的问题提出对策，即应对资本扩张进行监管，防止资本扩张导致的垄断问题，对应C项。\nA项，“遏制资本的进一步扩张”表述不明确，排除；\nB项，未提及“资本扩张”这一话题，且文段并没有提到“立法”，排除；\nD项，强调的是反垄断监管的作用，但文段中强调的是资本扩张带来的垄断问题，且该项未提及“资本扩张”这一核心话题，排除。\n故正确答案为C。\n【文段出处】《数字经济时代的反垄断，重点在于对资本扩张的监管》","no":37,"missingImage":false},{"type":"question","qid":"3522584","cat":"片段阅读","stem":"2020年12月，德尔黑和三位同事在《当代生物学》上发表了文章，他们认为葛洛格将温度和湿度混为一谈了。潮湿的环境使植物生长茂盛，这为动物躲避捕食者提供了荫蔽。因此，动物在潮湿的地方往往颜色更深，以伪装自己。德尔黑说，许多温暖的地方是潮湿的，但潮湿又凉爽的森林也是有的，比如塔斯马尼亚的森林，那里也有最黑的鸟类。\n从这段文字可推断出：","options":{"A":"德尔黑的观点，动物的颜色在温度低的地方会是浅色的","B":"葛洛格的观点，温暖而潮湿的地区，鸟的羽毛颜色会是深色的","C":"葛洛格的观点，阳光充足的赤道地区，鸟的羽毛颜色会是深色的","D":"德尔黑的观点，阳光充足的赤道地区，鸟的羽毛颜色会是浅色的"},"answer":"C","explanation":"根据文段“2020年12月，德尔黑和三位同事在······以伪装自己”可知，德尔黑认为动物颜色深和湿度有关，德尔黑认为葛洛格将温度和湿度混为一谈，因此葛洛格认为动物颜色深和温度有关。由“德尔黑说，许多温暖的地方是潮湿的，但潮湿又凉爽的森林也是有的······最黑的鸟类”进一步确定，德尔黑认为动物颜色深和温度无关，与湿度相关。\nA项，与文段最后一句话德尔黑的观点相悖，排除；\nB项，文段中提到葛洛格将温度与湿度混为一谈，选项提到”温暖而潮湿“体现二者有区别，不符合葛洛格的观点，排除；\nC项，“阳光充足的赤道地区”代表温度高，符合葛洛格的观点，当选；\nD项，“阳光充足的赤道地区”没有提到湿度，和德尔黑的观点无关，排除。\n故正确答案为C。\n【文段出处】《&lt;科学&gt;：全球气候变暖会让动物颜色变深还是变浅？》","no":38,"missingImage":false},{"type":"question","qid":"3523491","cat":"片段阅读","stem":"传承弘扬传统民间艺术的深刻精神内涵，民间艺术能否带来经济效益也成为了至关重要的考量因素。越来越多的年轻人选择放弃手工技艺，离开村庄谋生。对于大多数普通艺人，传承和保护民间文化只是一个概念，维持基本生活需求和追求家庭收入最大化仍然是最先考虑的因素。传承文化和提高收入的矛盾始终贯穿于民间艺人的文化自觉过程之中。对于民间艺人，作为“理性人”去追求收入最大化无可厚非，而作为民间文艺工作者，我们需要思考的是如何在保证民间艺人基本生活和物质需要的基础上，提升民间艺人的文化自觉意识，真正让民间艺人扎得住根、沉得下心。\n这段文字意在强调：","options":{"A":"激发民间艺人的文化自觉意识","B":"经济效益影响民间艺术的传承","C":"提高民间艺人的经济收入","D":"民间艺术传承的断代危机"},"answer":"A","explanation":"文段开篇论述经济效益对于传承弘扬传统民间艺术很重要，接着通过很多年轻人放弃手工技艺，外出谋生的情况说明在民间艺人的文化自觉过程中始终存在着传承文化和提高收入的矛盾。后文通过“需要”针对上述矛盾提出对策，论述民间文艺工作者要在保证民间艺人物质生活的基础上提升民间艺人的文化自觉意识，故文段重点强调提升民间艺人的文化自觉意识，对应A项。\nB、C两项，分别强调“经济效益”和“经济收入”，均未提及文段主题词“文化自觉”，排除；\nD项，“断代危机”文段未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】《以人民为中心繁荣发展社会主义民间文艺》","no":39,"missingImage":false},{"type":"question","qid":"3522594","cat":"片段阅读","stem":"人体严密的免疫防御系统，会在细菌入侵时引起炎症反应，白细胞和大量“防御斗士”对病原体展开攻击。防御的一方通常会胜利，理论上讲，“刺激”消除后，炎症反应会逐渐消失，组织回到正常状态。但在某些特定情况下，炎症依然会持续，这种低度炎症不像通常的炎症那样可以明显感觉到它的存在，其更像人体内未被完全熄灭的“火苗”。机体通过炎症反应抵抗病原体的过程，保障了人类的生存，但是科学家发现，这种低度炎症会缩短生命，促进许多年龄相关性症状，如认知衰退、神经变性、动脉粥样硬化等。不过，引起和维持这些变化的机制，目前尚不能明确。\n这段文字主要介绍：","options":{"A":"人体免疫系统的防御机制","B":"低度炎症的发生机制与影响","C":"细菌对人类生存的影响","D":"年龄相关性症状的研究现状"},"answer":"B","explanation":"文段开篇介绍人体的免疫系统会在细菌入侵时引起炎症反应，理论上讲，“刺激”消除后，炎症反应会逐渐消失，组织回到正常状态，接着通过转折词“但”引出特定情况下这种低度炎症会持续存在。随后解释了低度炎症的产生原理以及其好、坏两方面影响。故文段主要围绕“低度炎症”展开，从低度炎症的产生原理和对人类的影响两个方面进行阐述，对应B项。\nA项，文段主要论述的核心话题为“低度炎症”，“人体免疫系统”范围扩大，排除；\nC项，仅对应文段首句内容，非重点，排除；\nD项，论述的是“年龄相关性症状的研究现状”，但文段论述的核心话题是“低度炎症”，排除。\n故正确答案为B。\n【文段出处】《增强巨噬细胞代谢能缓解认知衰退》","no":40,"missingImage":false},{"type":"question","qid":"3522576","cat":"片段阅读","stem":"从绘画类别上看，人物画发展最早，涵盖内容也最为广阔。从人物画的演进层次来看，先是由鬼神而至人间，其目的在于“用”；然后由丹青而趋水墨，其演变则在于“艺”。汉代人物画都与灵魂鬼神有关，宗教意识浓厚，艺术追求的意义不太明显，都应归于“用”之范畴；东晋顾恺之等人的绘画开始脱离“用”的范畴，转而追求艺术的本旨。唐代张彦远在《历代名画记》中说“夫画者，成教化，助人伦，穷神变，测幽微，与六籍同功”，说的正是前一半；“近于艺”的后半段，实际是从唐宋时期才开始的。\n下列说法与原文相符的是：","options":{"A":"汉代人物画基本以实用为目的","B":"张彦远对东晋人物画评价不高","C":"顾恺之带来了绘画工具的革新","D":"唐代人物画比汉代更具写实性"},"answer":"A","explanation":"A项，根据“汉代人物画都与灵魂鬼神有关······都应归于‘用’之范畴”可知，汉代人物画以实用为目的，表述正确，当选；\nB项，根据“唐代张彦远在《历代名画记》中说······说的正是前一半”可知，张彦远论述的是画的作用，而非对人物画水平高低的评价，无中生有，排除；\nC项，根据“东晋顾恺之等人的绘画开始脱离‘用’的范畴，转而追求艺术的本旨”可知，带来的不是“绘画工具”的革新，偷换概念，排除；\nD项，文段并没有涉及到唐代人物画与汉代人物画的比较，无关比较，排除。\n故正确答案为A。","no":41,"missingImage":false},{"type":"question","qid":"3522590","cat":"片段阅读","stem":"当前，“云观展”成为一种热潮。虽然线上展览已普遍拥有极度高清的分辨率，但仍有不少观众希望欣赏实物。这不仅是为了欣赏展品的结构和色彩，更是为了感受每个纹路中所体现的技法与质感，而这些仅仅通过图像是很难传递给观众的。除展品本身外，展览中的墙壁、地毯的质地、颜色，展厅中的光线甚至气味，展品之间实际的大小与尺寸比例，都是构建观众对展览认知的重要框架，是线上彼此割裂的单幅展品或虚拟观展体验所无法实现的。\n这段文字意在说明：","options":{"A":"线下展览仍具有难以替代的优势","B":"观众对观展体验的要求越来越高","C":"“云观展”与线下观展的比较分析","D":"构建观众对展览的认知框架很重要"},"answer":"A","explanation":"文段开篇引出背景，即“云观展”成为一种热潮，紧接着通过转折关联词“但”指出，仍有不少观众希望欣赏实物，接着从展品本身以及展览环境两个方面具体阐述了线上展览无法替代线下展览的原因，故文段强调的重点为线上展览仍无法替代线下展览，对应A项。\nB项，“要求越来越高”文段并未提及，无中生有，排除；\nC项，“比较分析”对应后文解释说明部分的内容，非重点，排除；\nD项，“构建观众对展览的认知框架”对应文段尾句，为解释说明的内容，非重点，排除。\n故正确答案为A。\n【文段出处】《疫情结束后，“云观展”能否取代线下展览？》","no":42,"missingImage":false},{"type":"question","qid":"3522579","cat":"片段阅读","stem":"田山歌，是以表现稻作生产和水乡生活风情为内容的山歌形式，曾广泛流传于长江三角洲部分水稻耕作地区。田山歌与其说是歌，不如说是一种文化现象，它记录了历史文化、婚姻爱情、民情风俗，反映人文语言心理、宗教等大量内容，有着江南稻作文化区域民歌中独特的艺术价值和欣赏价值。田山歌的历史源头，一直可以追溯到新石器时代，当太湖流域开始有原始的栽培水稻农业时，整个江南就已经产生田山歌的原始形态。作为我国典型的稻作农业区，太湖流域的自然条件十分有利。因此，这种悠久的稻作文化传统，为当地人们创作、传承田山歌奠定了重要的基础。\n这段文字主要介绍的是：","options":{"A":"田山歌特有的艺术价值","B":"田山歌特殊的环境条件","C":"田山歌独特的创作手法","D":"田山歌深厚的文化底蕴"},"answer":"D","explanation":"文段开篇下定义，引出“田山歌”这一话题，接着指出田山歌是一种文化现象，有着江南稻作文化独特的艺术价值和欣赏价值，又介绍了田山歌的历史源头，太湖流域的自然条件有利于栽培水稻。最后，通过结论词“因此”对前文进行总结，论述了这种悠久的稻作文化传统为田山歌的创作和传承奠定了基础，强调了稻作文化传统对于田山歌的重要作用，对应D项。\nA项“艺术价值”，B项“环境条件”，C项“创作手法”均对应尾句之前分述部分的内容，非文段重点，排除。\n故正确答案为D。\n【文段出处】《从松江“田山歌” 看如何保留传统音乐的生存土壤》","no":43,"missingImage":false},{"type":"question","qid":"3522583","cat":"片段阅读","stem":"做好群众工作，加强和创新社会治理，既要用好“老办法”，也要掌握“新办法”，走好网上群众路线。群众需求什么、期待什么，社会治理就应该重点关注什么。要了解群众的需求和期待，最基本的方法就是调查研究。调查研究是我们党一贯坚持的优良传统和群众工作的经验总结。用好这个“老办法”，当牢记基层是最好的课堂，群众是最好的老师。随着越来越多的群众通过互联网平台获取信息、表达诉求、提出建议、参与政治生活和社会治理，各级党政机关和领导干部也要掌握运用互联网，学会收集网络社情民意，了解网民所思所愿，积极回应网民的关切。\n根据这段文字，以下不属于“新办法”的是：","options":{"A":"把握网络舆情动向","B":"深入实地走访考察","C":"积极开展网络问政","D":"关注网民需求期待"},"answer":"B","explanation":"根据“也要掌握‘新办法’，走好网上群众路线”可知，“新办法”指“网上群众路线”。B项“深入实地走访考察”与“网上”无关，当选。\nA、C、D三项均与“网上群众路线”契合，且可与文段尾句“各级党政机关和领导干部也要掌握运用互联网，学会收集网络社情民意，了解网民所思所愿，积极回应网民的关切” 对应，故三项均为“新办法”，排除。\n本题为选非题，故正确答案为B。\n【文段出处】人民网《新论：创新方法推进基层社会治理》","no":44,"missingImage":false},{"type":"question","qid":"3523515","cat":"片段阅读","stem":"过去几十年我们主要依靠引进外国技术实现发展，短期看这不失为加快经济发展的捷径，从长期看只靠引进是不行的，它会使我们与国外的技术差距越拉越大，将我们长期锁定在产业分工格局的低端。关键核心技术是要不来、买不来、讨不来的。为此，要加快推进国家重大科技专项，深入推进知识创新和技术创新，增强原始创新、集成创新和引进消化吸收再创新能力。\n这段文字意在说明：","options":{"A":"我国要不断提高自主创新能力","B":"我国要逐步掌握关键核心技术","C":"我国要依靠技术推动经济发展","D":"我国要减少对国外技术的依赖"},"answer":"A","explanation":"文段开篇提出我国与国外的技术之间差距变大的问题，随后介绍“关键核心技术”靠引进是不行的，最后通过“为此”指代前文进行总结，并通过对策引导词“要”提出对策，即我国要深入推进创新，增强创新能力。故文段是分总结构，尾句为文段重点，核心话题为“创新”，对应A项。\nB项，缺乏主题词“创新”，且“核心技术”处在对策之前，非重点，排除。\nC项，缺乏主题词“创新”，且“依靠技术”对应文段开篇，非重点，排除。\nD项，缺乏主题词“创新”，如何“减少对国外技术的依赖”表述不明确，文段已表明要靠创新实现发展，排除。\n故正确答案为A。\n【文段出处】《产业链供应链自主可控 中国经济方能“气血充盈”》","no":45,"missingImage":false},{"type":"question","qid":"3522587","cat":"片段阅读","stem":"今年的寒冬，其实恰恰部分源于全球变暖，这种反常的现象，和一种极地涡旋的气候现象有关。极地涡旋是一种发生于极地、介于对流层和平流层的中上部、持续性长且规模大的气旋。最早记载极地涡旋现象的文献出现于1853年。在北半球的冬季，这种现象会导致突然性平流层暖化。1952年，无线电探空仪在海拔高度超过20公里的观测中发现了这种现象导致的平流层暖化。在2013年后的北美冬季，媒体报道中经常提到这种现象，使得该术语推广成为对极低温寒潮的解释。\n下列关于极地涡旋的表述正确的是：","options":{"A":"极地涡旋是全球气候变暖的“元凶”","B":"极地涡旋现象最早出现于1853年","C":"极地涡旋说明了极低温寒潮现象","D":"极地涡旋是一种反常的气候现象"},"answer":"C","explanation":"A项，根据“今年的寒冬，其实恰恰部分源于全球变暖，这种反常的现象，和一种极地涡旋的气候现象有关”可知，文段描述仅是有关，并未提及“元凶”，无中生有，排除；\nB项，根据“最早记载极地涡旋现象的文献出现于1853年”可知，文段介绍的是记载极地涡旋现象的文献最早出现的时间，并非“极地涡旋现象”最早出现的时间，偷换概念，排除；\nC项，根据 “媒体报道中经常提到这种现象，使得该术语推广成为对极低温寒潮的解释”可知，极地涡旋是对极低温寒潮现象的解释，表述正确，当选；\nD项，根据“今年的寒冬，其实恰恰部分源于全球变暖，这种反常的现象，和一种极地涡旋的气候现象有关”可知，反常的现象指的是寒冬，并非极地涡旋现象，偷换概念，排除。\n故正确答案为C。\n【文段出处】《这个冬天为什么这么冷》","no":46,"missingImage":false},{"type":"question","qid":"3522593","cat":"语句表达","stem":"①人们听音时，首先是要用耳朵去听而不是用仪器去测量，如何判断，依靠的就是人们的“音准感”\n②这种音准有着精确的物理意义，音是由物体的震动产生的，每个乐音震动的频率就是它的物理属性\n③另一种音准指的是人们对于音高的一种听力反应，严格来讲应该叫做“音准感”\n④而在音乐中使用的音并不是随意产生的，是人们在长期实践过程中挑选出来的\n⑤我们通常所说的音准，一般有两种含义\n⑥一种是音乐中的音高要遵循一定的规律，那就是音高的准确性，即音准\n请将上述语句重新排列，语序正确的是：","options":{"A":"⑤⑥④①③②","B":"①③②⑤⑥④","C":"①⑤⑥③②④","D":"⑤⑥②④③①"},"answer":"D","explanation":"根据选项判断首句，①句介绍人们听音时依靠的就是人们的“音准感”，⑤句最先引出“音准”，强调它有两种含义。对比之下⑤句更适合作首句，排除B、C两项。\n观察发现，②句出现指代词“这种”，指代对象为音准，且论述这种音准有着精确的物理意义，观察选项发现，②句之前分别为③句和⑥句，⑥句论述音准，介绍音高的准确性，⑥句和②句衔接很恰当，可以构成指代词捆绑，D项当选。③句论述音准感，介绍是人们对于音高的一种听力反应，与②中对“音准”精确性论述的话题无关，无法构成指代词捆绑，排除 A 项。\n故正确答案为D。\n【文段出处】《音乐有这些“神力”，你知道吗？》","no":47,"missingImage":false},{"type":"question","qid":"3522600","cat":"片段阅读","stem":"在半个世纪前撞上地球的巨大陨石内，科学家们发现了距今70亿年的星尘。这是地球上已知存在的最古老物质。这种古老的尘埃由比我们的太阳更古老的颗粒组成，通过垂死的恒星进入宇宙。这种尘埃最终借着1969年坠落于澳大利亚的默奇森陨石来到地球。这也是研究人员第一次在地球上的岩石中发现太阳前颗粒。在这项新的研究中，研究人员分析了来自默奇森陨石的颗粒。他们把颗粒碾碎后加入酸性物质，以溶解矿物和硅酸盐，从而仅留下太阳前颗粒。\n最适合做这段文字标题的是：","options":{"A":"太阳前颗粒的价值","B":"默奇森陨石的由来","C":"地球上最古老的物质","D":"陨石的科学研究价值"},"answer":"C","explanation":"文段首先指出在巨大陨石内发现了地球上已知存在的最古老物质，即星尘，接着通过指代词“这种尘埃”指代地球上已知存在的最古老物质星尘，指出其借助陨石来到地球，这也是研究人员第一次在地球上的岩石中发现太阳前颗粒，后文对这一研究进行详细论述，故文段重点围绕地球上最古老的物质来论述，对应C项。\nA项“价值”、D项“科学研究价值”文段均未论述，无中生有，排除；\nB项，“默奇森陨石”非重点，文段重在强调借助默奇森陨石来到地球的最古老物质，排除。\n故正确答案为C。\n【文段出处】《2020年十大科学新纪录》","no":48,"missingImage":false},{"type":"question","qid":"3523499","cat":"语句表达","stem":"2020年夏天无糖饮料火了，贴着无糖、低糖标签的饮料已经开始向饮料界传统“大咖”——可乐、酸梅汤、冰红茶等发起了挑战。据24小时连锁便利店便利蜂统计数据，7月饮料销售上涨\u003cimg data-k=\"2faa80ec365c\">，其中代糖水饮、高纯度果汁和中高端牛奶增速明显，毕竟在炎炎夏季，这些无糖、低糖饮料能让众多管不住嘴又怕发胖的人，在享受喝冰镇甜饮料过足嘴瘾的同时，心里又少了很多“罪恶感”，因此，\u003cu>                    \u003c/u>。\n填入画横线部分最恰当的一项是：","options":{"A":"无糖饮料并不如人们心目中所想的那么完美","B":"喝无糖饮料是不会对人体带来任何副作用的","C":"喝无糖饮料引起人体代谢的变化不是特别大","D":"在追求健康体型的人群中无糖饮料备受推崇"},"answer":"D","explanation":"横线在文段结尾，根据“因此“可知，是对前文内容进行概括总结。文段开头指出“无糖饮料火了”，即无糖饮料受到消费者的欢迎。然后通过连锁便利店便利蜂统计数据说明无糖、低糖饮料销售增加，接着通过“同时”引导的并列指出无糖、低糖饮料的两方面好处。D项“备受推崇”体现出无糖饮料因其优点受欢迎，与前文衔接恰当，当选。\nA项，“并不如人们心目中所想的那么完美”，文段没有说无糖饮料的不好，感情色彩与前文不符，排除；\nB项，“副作用”，前文未提及，且“任何”表述过于绝对，排除；\nC项，“人体代谢”前文未提及，与文段衔接不当，排除。\n故正确答案为D。\n【文段出处】《无糖饮料只是“看上去很美”》","no":49,"missingImage":false},{"type":"question","qid":"3522607","cat":"语句表达","stem":"农民卖粮舒心，源于市场之“手”用得好。2020年的夏粮生产，不仅数量增加，质量也在提升。一个重要指标就是专用麦比例高，全国优质强筋弱筋小麦面积占比\u003cimg data-k=\"6f4939f1fb4a\">，比上年提高2.8个百分点。从目前收购市场情况看，每斤优质小麦要比普通品种高出0.1元左右。这背后，\u003cu>                    \u003c/u>。如今，多元化市场主体入市收购，既让丰收粮有了更加多样化的销售渠道，也让优质粮食品种销路更好、价格更高，优粮优价成为种粮农民增收的“金钥匙”。\n填入画横线部分最恰当的一项是：","options":{"A":"说到底就是稳住这些农民的种粮收益，保护农民的种粮积极性","B":"正是粮食收储制度改革持续推进，市场机制作用得到更好发挥","C":"全国农户构成了粮食安全的坚强基石，稳住粮食生产的好形势","D":"通过优化供给体系，拓展粮食产加销增值空间，分享增值收益"},"answer":"B","explanation":"本题为语句填空题，横线在文段中间，需联系前后文把握话题的一致性。横线前首先指出农民粮食卖的好得益于市场，紧接着指出全国优质强筋弱筋小麦面积占比不断提高且价格也高于普通品种，横线后论述“多元化市场主体入市收购”使得优质粮食品种销路好、价格高，故横线处所填句子应体现优质粮食销路好、价格高的原因在于“市场”发挥作用，对应B项。\nA项，“稳住这些农民的种粮收益，保护农民的种粮积极性”，无法与后文“市场”衔接，排除；\nC项：“全国农户构成了粮食安全的坚强基石”强调农户的重要性，而文段重点围绕“市场”展开，并未提及农户的重要性，该项与前后文衔接不当，排除。\nD项：“通过优化供给体系”强调“供给”，而文段重点围绕“市场”展开，并未提及“供给”，该项与前后文衔接不当，排除。\n故正确答案为B。\n【文段出处】潇湘晨报《千方百计保护农民的种粮积极性（话说新农村）》","no":50,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"3523439","cat":"数学运算","stem":"一次2小时的在线会议，会议结束前半小时才有人开始退出且每分钟退出会议人数满足\u003cimg data-k=\"2f6ab4709122\">，（\u003cimg data-k=\"da47261cd4a4\">）。若会议开始后加入会议人数是退出人数的1.5倍，且会议结束时还有100人在线，问会议开始时可能有多少人在线？","options":{"A":"40","B":"50","C":"60","D":"70"},"answer":"A","explanation":"设会议开始时可能有\u003cimg data-k=\"5320a525f2bc\">人在线。由题意可知，会议结束前半小时每分钟退出会议人数分别为\u003cimg data-k=\"47ea5ec41ded\">人、\u003cimg data-k=\"61c610909647\">人、\u003cimg data-k=\"89f97857b02b\">人、\u003cimg data-k=\"6c9dbef57698\">人······，则会议结束前的半小时共退出\u003cimg data-k=\"f86805f955fa\">人，故会议开始后加入会议人数\u003cimg data-k=\"3473c9e88fd9\">人。会议结束时还有100人在线，则\u003cimg data-k=\"3ed3db508ca7\">，解得\u003cimg data-k=\"ff21c3e483e0\">，即会议开始时可能有40人在线。\n故正确答案为A。","no":51,"missingImage":false},{"type":"question","qid":"3523440","cat":"数学运算","stem":"张三与李四骑马观光，从东方村开始，途经幸福村到胜利村。从东方村骑行1小时后，张三：“已经走了多远？”李四：“刚好是到幸福村的一半。”两人又骑行20公里后，张三：“到胜利村还有多远？”李四：“刚巧是离幸福村的一半那样远。”则东方村到胜利村的距离是多少公里？","options":{"A":"30","B":"35","C":"40","D":"45"},"answer":"B","explanation":"此题对第二个过程的理解不同，会出现不同的答案。\n【解析一】将东方村、幸福村、胜利村分别看成A、B、C三地，全程分为两个过程，第一个过程：先行驶AB（东方村到幸福村）的一半，用时1小时；第二个过程：又行驶20公里后，所处位置距胜利村（C）的距离刚好是到幸福村（B）的一半，即再行驶AB的\u003cimg data-k=\"0f1fa1d0536c\">加上BC的\u003cimg data-k=\"8c3342040bcf\">共20公里。根据条件可得\u003cimg data-k=\"6ec291b9515d\">，则全长\u003cimg data-k=\"5b3b5dcd56e1\">\u003cimg data-k=\"02deebfd67c3\">\u003cimg data-k=\"4f24981af68d\">，排除C、D两项。代入A项，若全长为30公里，则可得\u003cimg data-k=\"f2bfe0a607be\">，\u003cimg data-k=\"f124c0c6e928\">，与全长为30公里矛盾。\n故正确答案为B。\n【解析二】将东方村、幸福村、胜利村分别看成A、B、C三地，全程分为两个过程，第一个过程：先行驶AB的一半，用时1小时；第二个过程：如果理解成到胜利村（C）的距离刚好是胜利村（C）离幸福村（B）的一半那么远，即再行驶AB的\u003cimg data-k=\"0f1fa1d0536c\">加上BC的\u003cimg data-k=\"0f1fa1d0536c\">共20公里，那么全长\u003cimg data-k=\"5b3b5dcd56e1\">\u003cimg data-k=\"b1f80f209a34\">公里。\n故正确答案为C。\n本题表述有争议，粉笔给出两种解题思路，但更倾向于选B。","no":52,"missingImage":false},{"type":"question","qid":"3523442","cat":"数学运算","stem":"某直播平台为3种特色农产品直播带货3小时，第1小时B产品销售额比A产品多50万元，C产品只有B产品的\u003cimg data-k=\"1a67739c8245\">；第2小时与第1小时相比：A翻倍，B增加幅度比A少\u003cimg data-k=\"798f1f286d1f\">，而C增加两倍；最后1小时共带货3090万元，且A产品带货额比第1小时大幅增加\u003cimg data-k=\"65570c2650eb\">，B、C均比第2小时增加\u003cimg data-k=\"e172e0ad0a10\">，问第2小时直播带货额是多少万元？","options":{"A":"1580","B":"1600","C":"1860","D":"2000"},"answer":"C","explanation":"题干给出A、B、C3种农产品在带货第1、2、3小时内销售额的关系，可设第1小时B产品销售额为\u003cimg data-k=\"5320a525f2bc\">万元，可得三类产品3小时内得销售额如下：\n\u003cimg data-k=\"8006a5da41b8\" style=\"max-width:700px\">\n根据最后1小时共带货3090万元可得：\u003cimg data-k=\"cb97164db506\">\u003cimg data-k=\"4ce91af122cf\">；化简得\u003cimg data-k=\"19bdfb6389f4\">，解得\u003cimg data-k=\"d6a4b7dafceb\">。\n代入\u003cimg data-k=\"d6a4b7dafceb\">，第2小时带货额为\u003cimg data-k=\"792acd1d0852\">万元。\n故正确答案为C。","no":53,"missingImage":false},{"type":"question","qid":"3522679","cat":"数学运算","stem":"某省在新冠疫情期间派出包括传染科医生、重症科医生和护士在内的三批援鄂医疗队。三批医疗队中三者人数之比分别为4：2：4、5：2：3和4：3：3。已知第二批医疗队中医生比护士多40人，且传染科医生数逐批增加并成等差数列，三批共派出护士113人，则三批医疗队共有多少人？","options":{"A":"339","B":"350","C":"360","D":"390"},"answer":"B","explanation":"根据第二批医疗队中三者人数之比为5：2：3且医生比护士多40人，可得第二批医疗队传染科医生、重症科医生和护士人数分别为\u003cimg data-k=\"3728f4272384\">人、\u003cimg data-k=\"c4d3854ee57a\">人、\u003cimg da
