","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不相同，且无明显属性规律，考虑数量规律。图形由若干白球和黑球组成，可以考虑分开看黑球和白球的数量。横行竖行单独看黑球数量和白球数量没有规律，且黑球均出现在九宫格的四角处，可以考虑“米”字型看。“米”字型的四条线上，除最中间的图形外，两端的黑球相加数量为10，两端白球数量相加为10，所以？处应为2个黑球，对应B项。\n\u003cimg data-k=\"db90c08dc51a\" style=\"max-width:266px\">\n故正确答案为B。\n备注：本题的框架参照我国古代文明图案“河图洛书”所命制（如下图），在河图上，排列成数阵的黑点和白点，蕴藏着无穷的奥秘；在洛书上，纵、横、斜三条线上的三个数字，其和皆等于15。本题选取的即是洛书的排列形式，因此考虑横向、纵向、斜向相加均为15也是可以的。\n\u003cimg data-k=\"2afe5a8153cc\" style=\"max-width:606px\">","no":61,"missingImage":false},{"type":"question","qid":"3523525","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个选项拼搭出题干中的图形。\n\u003cimg data-k=\"7bdedfe63481\" style=\"max-width:590px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查立体拼合。根据题干给出的立体图形可知该图形共由8个小立方体组成，观察选项发现，C、D两项均共有9个小正方体，与题干不符，排除；\n再逐一分析剩下两个选项：\nA项：将图①立起来，再将图②进行左右上下翻转，进行拼合即可得到题干立体图形，如图所示，当选；\n\u003cimg data-k=\"42d51aa4ad78\" style=\"max-width:320px\">\nB项：选项中包含两块凸起的小立方体，但是题干立体图形中只有一块小立方体是凸起的，所以无法得到题干立体图形，排除。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"3523526","cat":"图形推理","stem":"根据①②③图形的变化规律，编号④的图形中空缺的数字应该是：\n\u003cimg data-k=\"011c26a8b6de\" style=\"max-width:700px\">","options":{"A":"8","B":"1","C":"4","D":"2"},"answer":"C","explanation":"元素组成不同，无明显属性规律，考虑数量规律。观察发现，四幅图均为数字，考虑数面。图①②③内数字中面的总数都是3，则图④内数字中面的总数也应是3，故问号处应选择有1个面的数字，只有C项符合。\n故正确答案为C。","no":63,"missingImage":false},{"type":"question","qid":"3522632","cat":"图形推理","stem":"根据左右图形的变化规律，从所给四个选项中，选择最适合的一项填入问号处。\n\u003cimg data-k=\"13828d7908e6\" style=\"max-width:501px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相似，考虑样式规律。左右两侧宫格，每行均由\u003cimg data-k=\"905a128b2342\" style=\"max-width:61px\">和\u003cimg data-k=\"358b500c8b60\" style=\"max-width:59px\">构成，且左侧到右侧图形个数、位置不同。由左侧的四列变为右侧的三列，考虑相邻两列做黑白运算。观察发现，每行相邻的两个图形做运算，左侧宫格第一列和第二列做运算等于右侧宫格第一列，左侧宫格第二列和第三列做运算等于右侧宫格第二列，左侧宫格第三列和第四列做运算等于右侧宫格第三列，即\u003cimg data-k=\"905a128b2342\" style=\"max-width:61px\">\u003cimg data-k=\"3d6d1f96db11\">\u003cimg data-k=\"358b500c8b60\" style=\"max-width:59px\">\u003cimg data-k=\"e6c7a9c8511f\">\u003cimg data-k=\"358b500c8b60\" style=\"max-width:59px\">，\u003cimg data-k=\"358b500c8b60\" style=\"max-width:59px\">\u003cimg data-k=\"3d6d1f96db11\">\u003cimg data-k=\"905a128b2342\" style=\"max-width:61px\">\u003cimg data-k=\"e6c7a9c8511f\">\u003cimg data-k=\"358b500c8b60\" style=\"max-width:59px\">，\u003cimg data-k=\"905a128b2342\" style=\"max-width:61px\">\u003cimg data-k=\"3d6d1f96db11\">\u003cimg data-k=\"905a128b2342\" style=\"max-width:61px\">\u003cimg data-k=\"e6c7a9c8511f\">\u003cimg data-k=\"905a128b2342\" style=\"max-width:61px\">，\u003cimg data-k=\"358b500c8b60\" style=\"max-width:59px\">\u003cimg data-k=\"3d6d1f96db11\">\u003cimg data-k=\"358b500c8b60\" style=\"max-width:59px\">\u003cimg data-k=\"e6c7a9c8511f\">\u003cimg data-k=\"905a128b2342\" style=\"max-width:61px\">。经验证，每一行均满足此运算规律；第五行按照此运算规律得到B项。\n故正确答案为B。","no":64,"missingImage":false},{"type":"question","qid":"3522641","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"e95365d1cbee\" style=\"max-width:474px\">","options":{"A":"①②③，④⑤⑥","B":"①②④，③⑤⑥","C":"①③④，②⑤⑥","D":"①③⑥，②④⑤"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，优先考虑属性规律。题干出现等腰元素，考虑对称性。①③④三个图形均有一条对称轴，仅为轴对称图形；②⑤⑥三个图形均有两条相互垂直的对称轴，既是轴对称图形也是中心对称图形。即①③④为一组，②⑤⑥为一组。\n故正确答案为C。","no":65,"missingImage":false},{"type":"question","qid":"3522623","cat":"定义判断","stem":"化学沉积作用是指在水介质中，以胶体溶液和真溶液形式搬运的物质到达适宜场所后，当化学条件发生变化时，产生沉淀、堆积的过程。其中，胶体溶液是指含有一定大小的固体颗粒物质或高分子化合物的溶液，真溶液是指透明度较高的水溶液。\n根据上述定义，下列不属于化学沉积作用的是：","options":{"A":"干旱气候区，湖水很少外泄，蒸发作用使湖水的氯化钠增加、累积，变成咸水湖","B":"当海水中的绿色粘土矿物随水流动时，会和含有铝、铁的胶体物质聚合形成海绿石","C":"富含磷质的海水上升至浅海区，因压力减小，温度升高，磷质析出、沉积而形成磷矿","D":"湖泊里的生物骨骼，它们吸收了空气中的二氧化碳形成碳酸钙，当碳酸钙浓度达到一定程度就在海底堆积下来，形成石灰岩"},"answer":"D","explanation":"第一步：找出定义关键词。\n化学沉积作用：“水介质”、“以胶体溶液和真溶液形式搬运”、“当化学条件发生变化时，产生沉淀、堆积”；\n胶体溶液：“含有一定大小的固体颗粒物质或高分子化合物的溶液”；\n真溶液：“透明度较高的水溶液”。\n第二步：逐一分析选项。\nA项：湖水是水介质，符合“透明度较高的水溶液”，蒸发使湖水的氯化钠增加累积，变成咸水湖，即湖水搬运的最终物质是氯化钠，符合“当化学条件发生变化时，产生沉淀、堆积”，符合定义，排除；\nB项：海水是水介质，符合“透明度较高的水溶液”，绿色粘土矿物随海水流动和含有铝、铁的胶体物质聚合形成海绿石，符合“以胶体溶液和真溶液形式搬运”、“当化学条件发生变化时，产生沉淀、堆积”，符合定义，排除；\nC项：海水是水介质，符合“透明度较高的水溶液”，压力减小、温度升高导致磷质析出沉积形成磷矿，符合“以胶体溶液和真溶液形式搬运”、“当化学条件发生变化时，产生沉淀、堆积”，符合定义，排除；\nD项：湖泊是水介质，符合“透明度较高的水溶液”，但生物骨骼最终形成的石灰岩不是在真溶液形式搬运下发生的沉淀、堆积，属于生物沉积作用，不符合“当化学条件发生变化时，产生沉淀、堆积”，不符合定义，当选。\n本题是选非题，故正确答案为D。\n备注：本题很多学生比较纠结A项和D项，如下图所示，A项是在“化学沉积”相关文献中的典型案例，通过对比择优，本题问“不属于”，故小粉笔更倾向把答案给到D项。\n\u003cimg data-k=\"323ebb9443f6\" style=\"max-width:700px\">","no":66,"missingImage":false},{"type":"question","qid":"3523521","cat":"定义判断","stem":"生物浓缩，是指生物有机体或处于同一营养级上的许多生物种群，从周围环境中蓄积某种元素或难分解化合物，使生物有机体内该物质的浓度超过环境中该物质浓度的现象。\n根据上述定义，以下涉及到生物浓缩的是：","options":{"A":"农业上用于杀死昆虫的DDT通过食物链传递到白头鹰体内，导致生下的蛋皆是软壳的，无法孵化","B":"在湖泊、河流等地方出现的藻类及其他浮游生物迅速繁殖，水质恶化，鱼类及其他生物大量死亡的现象","C":"山羊吃多玉米粒之后，一时间难以消化，再加上山羊饮入水后，玉米长时间聚集在胃内，容易引起胃胀","D":"由于严重的白色污染，原本干净清洁的海滩，如今聚集了大量的塑料袋、瓶子等垃圾，以至于无人问津"},"answer":"A","explanation":"第一步：找出定义关键词。\n“生物有机体或处于同一营养级上的许多生物种群”、“从周围环境中蓄积某种元素或难分解化合物”、“使生物有机体内该物质的浓度超过环境中该物质浓度的现象”。\n第二步：逐一分析选项。\nA项：白头鹰体内，符合“生物有机体或处于同一营养级上的许多生物种群”，通过食物链传递导致白头鹰体内有DDT，符合“从周围环境中蓄积某种元素或难分解化合物”，白头鹰的蛋壳变软的原因在于有害化学物质DDT逐步在其体内积累的结果，符合“使生物有机体内该物质的浓度超过环境中该物质浓度的现象”，符合定义，当选；\nB项：藻类和浮游生物迅速繁殖，鱼类及其他生物大量死亡，是因为鱼类生存所需的营养物质被藻类和浮游生物抢占了，不符合“使生物有机体内该物质的浓度超过环境中该物质浓度的现象”，不符合定义，排除；\nC项：山羊吃多玉米粒之后，玉米聚集在胃里引起胃胀，不符合“使生物有机体内该物质的浓度超过环境中该物质浓度的现象”，不符合定义，排除；\nD项：干净清洁的海滩受到白色污染，没有涉及生物有机体或者生物种群，不符合“生物有机体或处于同一营养级上的许多生物种群”，不符合定义，排除。\n故正确答案为A。","no":67,"missingImage":false},{"type":"question","qid":"3522625","cat":"定义判断","stem":"增效作用指的是两种或两种以上药物同时或先后作用于机体所产生的防治作用大于各种药物单独对机体产生的总效应。\n根据上述定义，下列最能体现增效作用的是：","options":{"A":"石蒜是一种抗癌药，与大剂量维生素C配合使用，石蒜含有的石蒜碱毒性会增强","B":"风湿止痛药酒和安乃近片均具有止痛作用，共用会使安乃近片代谢加快药物半衰期缩短","C":"白掌施用亚硝酸铁化肥后可使发黄的叶子变绿，再施用磷酸二氢钾，会产生良好的催花效果","D":"赤霉素和生长素均能促进植物茎秆伸长，共用时赤霉素可抑制生长素的氧化过程从而提高生长素的含量"},"answer":"D","explanation":"第一步：找出定义关键词。\n“两种或两种以上药物”、“同时或先后作用于机体”、“防治作用大于药物单独对机体的总效应”。\n第二步：逐一分析选项。\nA项：石蒜含有的石蒜碱毒性会增强，不符合“防治作用大于药物单独对机体的总效应”，不符合定义，排除；\nB项：共用会使安乃近片代谢加快药物半衰期缩短，不符合“防治作用大于药物单独对机体的总效应”，不符合定义，排除；\nC项：施用亚硝酸铁化肥后施用磷酸二氢钾会产生良好的催花效果，不清楚是否防治作用大于单独使用的效果，不符合“防治作用大于药物单独对机体的总效应”，不符合定义，排除；\nD项：共用赤霉素和生长素，符合“两种或两种以上药物”、“同时或先后作用于机体”，共用能够提高生长素的含量，符合“防治作用大于药物单独对机体的总效应”，符合定义，当选。\n故正确答案为D。","no":68,"missingImage":false},{"type":"question","qid":"3523527","cat":"定义判断","stem":"背书品牌指出现在一个产品品牌与服务品牌背后的支持性品牌。背书品牌又叫做父母品牌，被背书的叫子品牌。分两类：一是硬背书品牌，采取企业总品牌\u003cimg data-k=\"3d6d1f96db11\">子品牌形式。企业总品牌一般是有较长历史，较高知名度及无形资产价值的大品牌，子品牌需借助总品牌吸引消费者。二是软背书品牌，即子品牌前并不直接冠以背书品牌，子品牌是流通的主角，企业总品牌只是为子品牌提供信誉担保。\n根据上述定义，下列属于硬背书品牌的是：","options":{"A":"别克、欧宝、雪佛莱、凯迪拉克是通用汽车旗下四大主力品牌","B":"某药企的产品都包含有“999”的品牌，如三九胃泰、999感冒灵","C":"浏阳河、京酒、金六福等产品包装上都没标明背书品牌五粮液","D":"无论是潘婷、汰渍，还是舒肤佳，它们都是宝洁公司的产品"},"answer":"B","explanation":"第一步：找出定义关键词。\n背书品牌：“在一个产品品牌与服务品牌背后的支持性品牌”。\n硬背书品牌：“总品牌\u003cimg data-k=\"3d6d1f96db11\">子品牌形式”、“总品牌一般是有较长历史，较高知名度及无形资产价值的大品牌”、“子品牌需借助总品牌吸引消费者”。\n软背书品牌：“子品牌前并不直接冠以背书品牌”、“子品牌是流通的主角”、“总品牌只是为子品牌提供信誉担保”。\n第二步：逐一分析选项。\nA项：别克、欧宝、雪佛莱、凯迪拉克是通用汽车旗下四大主力品牌，不符合“总品牌\u003cimg data-k=\"3d6d1f96db11\">子品牌形式”、“子品牌需借助总品牌吸引消费者”，不符合定义，排除；\nB项：“999”的品牌是总品牌，三九胃泰、999感冒灵是子品牌，符合“总品牌\u003cimg data-k=\"3d6d1f96db11\">子品牌形式”，符合定义，当选；\nC项：浏阳河、京酒、金六福等产品包装上都没标明背书品牌五粮液，符合“子品牌前并不直接冠以背书品牌”，属于软背书品牌，不符合定义，排除；\nD项：潘婷、汰渍、舒肤佳都是宝洁公司的产品，不符合“总品牌\u003cimg data-k=\"3d6d1f96db11\">子品牌形式”、“子品牌需借助总品牌吸引消费者”，不符合定义，排除。\n故正确答案为B。","no":69,"missingImage":false},{"type":"question","qid":"3522634","cat":"定义判断","stem":"相反相成修辞手法是指把通常相互对立、排斥的两个概念或判断巧妙地联系在一起，这样不仅能够揭示出存在于客观事物深层的矛盾辩证关系，还可以增加语言的意蕴。\n根据上述定义，下列不属于相反相成修辞手法的是：","options":{"A":"横眉冷对千夫指，俯首甘为孺子牛","B":"有的人活着，他已经死了；有的人死了，他还活着","C":"墙上芦苇，头重脚轻根底浅；山中竹笋，嘴尖皮厚腹中空","D":"这一天，死去的伟人在诗的国度里永生；这一天，活着的小丑在人们心上被埋葬"},"answer":"C","explanation":"第一步：找出定义关键词。\n“把通常相互对立、排斥的两个概念或判断巧妙地联系在一起”。\n第二步：逐一分析选项。\nA项：选项这句话意为对待敌人决不屈服，对人民大众甘愿服务。横眉和俯首是一个人的两个相互对立的态度，符合“把通常相互对立、排斥的两个概念或判断巧妙地联系在一起”，符合定义，排除； \nB项：选项这句话意为有的人虽然活着，但是他的道德败坏，就如已经死了一样没有价值，而有的人死了，他还活着，他的高尚的品格，代代相传，永远激励后人。活着和死了是一个人的两个相互对立的状态，符合“把通常相互对立、排斥的两个概念或判断巧妙地联系在一起”，符合定义，排除； \nC项：选项这句话用芦苇和竹笋比喻那些没有学问只会自吹自擂的人，芦苇和竹笋不符合“相互对立、排斥的两个概念或判断”，不符合定义，当选；\nD项：选项这句话表达了不同类型的人在“这一天”的情况，死去和永生、活着和埋葬是一个人的两个相互对立的状态，符合“把通常相互对立、排斥的两个概念或判断巧妙地联系在一起”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":70,"missingImage":false},{"type":"question","qid":"3522640","cat":"定义判断","stem":"涟漪效应是指在突发事件中，身处不同地区民众所呈现的不同心理状态，越靠近危机事件中心区域，人们对事件的风险认知和负性情绪越高。\n根据上述定义，下列符合涟漪效应的是：","options":{"A":"台风外围空气旋转剧烈，而处于中心的风力流动反而相对微弱，因此，灾民负性情绪从“暴风眼”区域向外逐渐增强","B":"地震带上的重灾区民众在风险认知、心理健康水平及应对行为上都显著高于非重灾区民众","C":"距离垃圾焚烧厂、核反应堆越近的民众，其风险认知程度越高，因而其忧虑感越强","D":"距离大规模传染疫情爆发的时间越短，民众的焦虑情绪及恐慌程度就越高"},"answer":"B","explanation":"第一步：找出定义关键词。\n“在突发事件中”、“身处不同地区民众所呈现的不同心理状态”、“越靠近危机事件中心区域，人们对事件的风险认知和负性情绪越高”。\n第二步：逐一分析选项。\nA项：灾民的负性情绪是从“暴风眼”区域向外逐渐增强的，不符合“越靠近危机事件中心区域，人们对事件的风险认知和负性情绪越高”，不符合定义，排除；\nB项：地震符合“在突发事件中”，地震带上的重灾区民众在心理健康水平及应对行为上都显著高于非重灾区民众，符合“身处不同地区民众所呈现的不同心理状态”，虽未提及“负性情绪”，但也符合“越靠近危机事件中心区域，人们对事件的风险认知越高”，符合定义，当选；\nC项：垃圾焚烧厂、核反应堆，不符合“在突发事件中”，不符合定义，排除；\nD项：距离大规模传染疫情爆发的时间越短，是所有人都会面临的，没有体现身处不同地区，不符合“身处不同地区民众所呈现的不同心理状态”，不符合定义，排除。\n故正确答案为B。\n附原文说明：\n\u003cimg data-k=\"7e0632f6acb8\" style=\"max-width:648px\">","no":71,"missingImage":false},{"type":"question","qid":"3522624","cat":"定义判断","stem":"自豪是一种产生于对自己的积极评价的情绪，其主要依赖于自我意识、自我评价以及自我反思。基于对成就的不同归因，自豪可分为真实自豪和自大自豪。真实自豪是以成就为导向的一种积极的自豪情绪，其主要来源于个体将成就归因于自身的努力；自大自豪是指一种偏向于消极的自豪情绪，其主要来源于个体将成就归因于自身的天赋。\n根据上述定义，下列最符合自大自豪的是：","options":{"A":"兴酣落笔摇五岳，诗成笑傲凌沧州","B":"黄金白璧买歌笑，一醉累月轻王侯","C":"俱怀逸兴壮思飞，欲上青天揽明月","D":"天生我材必有用，千金散尽还复来"},"answer":"D","explanation":"第一步：找出定义关键词。\n“偏向于消极的自豪情绪”、“主要来源于个体将成就归因于自身的天赋”。\n第二步：逐一分析选项。\nA项：“兴酣落笔摇五岳，诗成笑傲凌沧州”出自李白（唐）的《江上吟》，意思是我高兴起来落笔能让五岳震动，写出来的诗足以笑傲天下，表达出作者对自身诗才的自信，其态度是积极的，不符合“偏向于消极的自豪情绪”，不符合定义，排除；\nB项：“黄金白璧买歌笑，一醉累月轻王侯”出自李白（唐）的《忆旧游寄谯郡元参军》，意思是花黄金白璧买来宴饮与欢歌笑语时光，一次酣醉使我数月轻蔑王侯将相，作者借喝酒买醉后的情绪轻蔑王侯将相，不符合“主要来源于个体将成就归因于自身的天赋”，不符合定义，排除；\nC项：“俱怀逸兴壮思飞，欲上青天揽明月”出自李白（唐）的《宣州谢朓楼饯别校书叔云》，意思是我们都怀有豪情逸兴、雄心壮志，酒酣兴发，更是飘然欲飞，想登上青天摘取明月，不符合“偏向于消极的自豪情绪”，也不符合“主要来源于个体将成就归因于自身的天赋”，不符合定义，排除；\nD项：“天生我材必有用，千金散尽还复来”出自李白（唐）的《将进酒》，意思是上天造就了我的才干就必然是有用处的，千两黄金花完了也能够再次获得，该诗句为作者政治上遭遇挫折，符合“偏向于消极的自豪情绪”，有才能就一定有用处，符合“主要来源于个体将成就归因于自身的天赋”，符合定义，当选。\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"3522638","cat":"定义判断","stem":"转喻是指两个认知对象在空间上或时间上的邻近共存以及其中一个对另一个的凸显可及，从而通过另一种事物来理解和体验当前的事物。\n根据上述定义，下列不属于转喻的是：","options":{"A":"一间阴暗的小屋里，上面坐着两位老爷，一东一西。东边的一个是马褂，西边的一个是西装","B":"当一个游子想他家乡的时候我猜想它是像菜花一样金黄","C":"灾害是一把尺子，可以测量一个民族蹲下后跳跃的高度","D":"朱门酒肉臭，路有冻死骨"},"answer":"C","explanation":"第一步：找出定义关键词。\n“两个认知对象”、“在空间上或时间上的邻近共存”、“通过另一种事物来理解和体验当前的事物”。\n第二步：逐一分析选项。\nA项：一间小屋东西各坐着一位老爷，马褂指代东边的老爷，西装指代西边的老爷，人物和身穿的衣服，符合“两个认知对象在空间上的邻近共存”，在特定场合穿着打扮体现着人物的身份，符合“通过另一种事物来理解和体验当前的事物”，符合定义，排除；\nB项：选项取自《感情什么颜色》，用颜色来形容感情，家乡一般到处都种着菜花，菜花和家乡就有了空间上的邻近关系，符合“两个认知对象在空间上的邻近共存”，“金黄”的菜花，比喻春天的气息，生动刻画了游子对家乡的神往和思念，符合“通过另一种事物来理解和体验当前的事物”，符合定义，排除；\nC项：用灾害这把“尺子”测量“民族蹲下后跳跃的高度”，灾害和尺子不存在空间上或时间上的邻近共存，不符合“两个认知对象在空间上或时间上的邻近共存”，不符合定义，当选；\nD项：“朱门酒肉臭，路有冻死骨”意思是贵族人家的红漆大门里散发出酒肉的香味，路边就有冻死的骸骨。其中“朱门”指“贵族人家”，“冻死骨”指“穷苦百姓”，符合“两个认知对象”、“在空间上或时间上的邻近共存”，“朱门的酒肉臭”体现了贵族人家的骄奢淫逸，“路边的冻死骨”体现了穷苦人家的生活惨状，符合“通过另一种事物来理解和体验当前的事物”，符合定义，排除。\n本题为选非题，故正确答案为C。\n备注：如下图所示，从小粉笔查询到的相关文献来看，C项属于“隐喻”，而非“转喻”。\n\u003cimg data-k=\"27364b0a0155\" style=\"max-width:426px\">","no":73,"missingImage":false},{"type":"question","qid":"3522628","cat":"定义判断","stem":"软暴力是指行为人为谋取不法利益或形成非法影响，对他人或者在有关场所进行滋扰、纠缠、哄闹、聚众造势等，足以使他人产生恐惧、恐慌进而形成心理强制，或者足以影响、限制人身自由、危及人身财产安全，影响正常生活、工作、生产、经营的违法犯罪手段。\n根据上述定义，下列属于软暴力的是：","options":{"A":"张某威胁王法官，如不秉公判案就举报其贪污的事实","B":"甲公司为了在竞标中获胜，私下散布关于竞争对手的不利信息","C":"某恶势力团伙为了向王某讨要赌债将其堵在酒店房间，24小时看守并不让其睡觉","D":"网贷公司催收员长期使用群呼、群发短信、揭发隐私等手段滋扰欠款人及其紧急联系人、通讯录联系人"},"answer":"D","explanation":"第一步：找出定义关键词。\n“为谋取不法利益或形成非法影响”、“对他人或者在有关场所进行滋扰、纠缠、哄闹、聚众造势”、“使他人产生恐惧、恐慌或影响、限制人身自由、危及人身财产安全，影响正常生活、工作、生产、经营的违法犯罪手段”。\n第二步：逐一分析选项。\nA项：张某威胁王法官秉公判案，不符合“为谋取不法利益或形成非法影响”，不符合定义，排除；\nB项：甲公司为了在竞标中获胜，不符合“为谋取不法利益或形成非法影响”，不符合定义，排除；\nC项：某恶势力将王某堵在房间不让其睡觉长达24小时，属于严重的人身强制行为，不属于“对他人或者在有关场所进行滋扰、纠缠、哄闹、聚众造势等”，不符合定义，排除；\nD项：网贷公司使用群呼、群发、揭发隐私等手段滋扰欠款人及其紧急联系人、通讯录联系人，符合“对他人进行滋扰”，长期如此，符合“使他人产生恐惧、恐慌或影响”和“影响正常生活、工作、生产、经营的违法犯罪手段”，符合定义，当选。\n故正确答案为D。\n备注：下图中给出的示例，引自《光明日报》，该案是北京市首例网络“软暴力”的案件，与D项对应，而C项中的“24小时不让其睡觉”，直接限制了人身自由和行为且时间较长，二者比较，D项更符合定义。\n\u003cimg data-k=\"4e3c68dc7edd\" style=\"max-width:497px\">","no":74,"missingImage":false},{"type":"question","qid":"3522630","cat":"定义判断","stem":"气候保险是一种为遭受气候风险的资产、生计和生命损失提供支持的保障机制，它通过在一个比较大的空间和时间范围内，投保者定期支付确定的小额保费来应对不确定的气候风险损失，能够确保遭遇直接气候风险损失的投保者获得有效和迅速的资金支持。\n根据上述定义，下列属于气候保险承保范围的是：","options":{"A":"天气异常干旱造成水稻大面积减产","B":"地震引发山体滑坡，掩埋了山下一处工厂","C":"暴雪封路，导致大批牲畜得不到及时照料而被饿死","D":"上游泄洪造成下游地区发生溃堤，导致当地农作物大面积毁损"},"answer":"A","explanation":"第一步：找出定义关键词。\n“遭受气候风险”、“资产、生计和生命损失”、“投保者定期支付确定的小额保费”、“遭遇直接气候风险损失”、“获得有效和迅速的资金支持”。\n第二步：逐一分析选项。\nA项：天气异常干旱，属于气候因素，符合“遭受气候风险”，造成水稻大面积减产，符合“资产、生计和生命损失”，且减产是天气异常直接导致的，符合“遭遇直接气候风险损失”，符合定义，当选；\nB项：地震引发山体滑坡，属于地质灾害，不符合“遭受气候风险”，不符合定义，排除；\nC项：暴雪封路，符合“遭受气候风险”，但最后大批牲畜死亡是得不到及时照料导致的，并非气候因素直接导致的，不符合“遭遇直接气候风险损失”，不符合定义，排除；\nD项：上游泄洪造成下游地区发生溃堤，属于人为因素，不符合“遭受气候风险”，不符合定义，排除。\n故正确答案为A。","no":75,"missingImage":false},{"type":"question","qid":"3523523","cat":"类比推理","stem":"山有色：水发声","options":{"A":"山河在：草木深","B":"客舍青：柳色新","C":"鸟飞绝：人踪灭","D":"花作尘：鸟不惊"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n两个词语无明显的逻辑关系，考虑分开看。有色是对山的描述，发声是对水的描述。即后两个字是对第一个字的描述。\n第二步：判断选项词语间逻辑关系。\nA项：“在”是对“山河”的描述，“深”是对“草木”的描述，即第三个字是对前两个字的描述，与题干逻辑关系不一致，排除；\nB项：“青”是对“客舍”的描述，“新”是对“柳色”的描述，即第三个字是对前两个字的描述，与题干逻辑关系不一致，排除；\nC项：“飞绝”是对“鸟”的描述，即后两个字是对第一个字的描述，但是“灭”是对“人踪”的描述，即第三个字是对前两个字的描述，与题干逻辑关系不一致，排除；\nD项：“作尘”是对“花”的描述，“不惊”是对“鸟”的描述，即后两个字是对第一个字的描述，与题干逻辑关系一致，当选。\n故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"3522636","cat":"类比推理","stem":"匹马：单枪","options":{"A":"万水：千山","B":"花红：柳绿","C":"地久：天长","D":"猴年：马月"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n匹马是指一匹马，单枪是指一杆枪，二者属于并列关系，并且“匹”和“单”均可以用来表示数量。\n第二步：判断选项词语间逻辑关系。\nA项：万水和千山为并列关系，并且“万”与“千”均可以用来表示数量，与题干逻辑关系一致，当选；\nB项：花红和柳绿为并列关系，但“花”与“柳”不可用来表示数量，与题干逻辑关系不一致，排除；\nC项：地久和天长为并列关系，但“地”和“天”不可用来表示数量，与题干逻辑关系不一致，排除；\nD项：猴年和马月为并列关系，但“猴”和“马”不可用来表示数量，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":77,"missingImage":false},{"type":"question","qid":"3523522","cat":"类比推理","stem":"就地保护：易地保护","options":{"A":"汽车爆胎：汽车漏油","B":"防洪堤：绿化带","C":"纯种繁育：杂交繁育","D":"销售提成：股份分红"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n就地保护和易地保护是保护生物多样性的两种形式，二者为并列关系，且为并列中的矛盾关系。\n第二步：判断选项词语间逻辑关系。\nA项：汽车爆胎和汽车漏油均为汽车会出现的故障，二者为并列关系，但是汽车除了爆胎和漏油外还会出现其他故障，所以二者为并列中的反对关系，与题干逻辑关系不一致，排除；\nB项：防洪堤是为了防止河流泛滥而建立的堤坝，而绿化带是为了起到绿化的作用，美化环境，二者构不成并列关系，与题干逻辑关系不一致，排除；\nC项：纯种繁育是同一品种内进行后代繁育，杂交繁育是不同品种间进行后代繁育，二者为并列关系，且为并列中的矛盾关系，与题干逻辑关系一致，当选；\nD项：销售提成与股份分红均为获得收入的两种形式，二者为并列关系，但是获得收入除了销售提成与股份分红外还有其他形式，所以二者为并列关系中的反对关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":78,"missingImage":false},{"type":"question","qid":"3522627","cat":"类比推理","stem":"洪涝：干旱：防洪抗旱","options":{"A":"地震：海啸：抗震救灾","B":"滑坡：雪崩：道路抢修","C":"严寒：酷热：防冻消暑","D":"风沙：雾霾：防沙除霾"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n洪涝与干旱，二者为反义关系，且防洪与抗旱分别是前两种现象针对性的应对方法，与前两词构成对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：地震与海啸，二者并不是反义关系，抗震是地震的应对方法，但救灾范围太大，与海啸对应关系并不贴切，与题干逻辑关系不一致，排除；\nB项：滑坡与雪崩，二者并不是反义关系，且滑坡与雪崩都可能需要进行道路抢修，与题干逻辑关系不一致，排除；\nC项：严寒与酷热，二者为反义关系，防冻是严寒的应对方法，消暑是酷热的应对方法，是两种现象的应对方式，与题干逻辑关系一致，当选；\nD项：风沙与雾霾，二者并不是反义关系，与题干逻辑关系不一致，排除。\n故正确答案为C。\n注：本题有同学通过自然灾害选了D，这也是个角度，但是从题干特征来看，本题题干前两词反义关系明显，故优先考虑反义关系，不行的情况下再考虑是否是自然灾害，做题的首要原则是题干特征。","no":79,"missingImage":false},{"type":"question","qid":"3522629","cat":"类比推理","stem":"党员：干部：服务人民","options":{"A":"青年：才俊：报效国家","B":"科学：精英：科技立身","C":"大国：工匠：技术强国","D":"学校：教师：教书育人"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n有的党员是干部，有的党员不是干部，有的干部是党员，有的干部不是党员，二者为交叉关系，党员和干部都是服务人民的主体，与服务人民是对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：有的青年是才俊，有的青年不是才俊，有的才俊是青年，有的才俊不是青年，二者为交叉关系，青年和才俊都是报效国家的主体，与报效国家是对应关系，与题干逻辑关系一致，当选；\nB项：科学和精英不是交叉关系，且科学不是科技立身的主体，与题干逻辑关系不一致，排除；\nC项：大国和工匠不是交叉关系，且大国不是技术强国的主体，与题干逻辑关系不一致，排除；\nD项：学校是教师的工作地点，二者不是交叉关系，且学校也不是教书育人的主体，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":80,"missingImage":false},{"type":"question","qid":"3522633","cat":"类比推理","stem":"风能：核能：资源","options":{"A":"听筒：话筒：音乐","B":"保姆：保安：家政","C":"木柴：木炭：燃料","D":"包子：粽子：节庆"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n风能是一种资源，核能是一种资源，二者为并列关系，且均与资源构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：听筒、话筒是两种设备，二者为并列关系，但与音乐均不构成种属关系，与题干逻辑关系不一致，排除；\nB项：保姆、保安是两种职业，二者为并列关系，但保安与家政不构成种属关系，与题干逻辑关系不一致，排除；\nC项：木柴是一种燃料，木炭是一种燃料，二者为并列关系，且均与燃料构成种属关系，与题干逻辑关系一致，当选；\nD项：包子、粽子是两种食物，二者为并列关系，但与节庆均不构成种属关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":81,"missingImage":false},{"type":"question","qid":"3523528","cat":"类比推理","stem":"二氧化碳：珊瑚骨骼：腐蚀","options":{"A":"物种灭绝：动物：威胁","B":"天灾人祸：物种：减少","C":"土壤沙化：空气：雾霾","D":"气候变暖：冰川：消融"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“二氧化碳”会“腐蚀”“珊瑚骨骼”，题干为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“物种灭绝”本身就包含“动物”被“威胁”的意思，与题干逻辑关系不一致，排除；\nB项：“天灾人祸”会“减少”“物种”，为因果对应关系，与题干逻辑关系一致，保留；\nC项：“土壤沙化”会导致“雾霾”，与题干逻辑关系不一致，排除；\nD项：“气候变暖”会“消融”“冰川”，与题干逻辑关系一致，保留。\n对于BD两项，题干的“二氧化碳”和D项的“气候变暖”只是独立的一个原因，但B项的原因可以拆分为“天灾”和“人祸”两个原因，因此D项与题干更为一致。\n故正确答案为D。","no":82,"missingImage":false},{"type":"question","qid":"3522637","cat":"类比推理","stem":"乡风：民俗：乡村文化","options":{"A":"德治：法治：治理能力","B":"小学：中学：基础教育","C":"习惯：民约：社会规则","D":"通讯：网络：通信网络"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n乡风是指乡里的风俗，民俗是指一个国家或民族中广大民众所创造、享用和传承的生活文化，二者是并列关系；乡风和民俗是乡村文化，前两词与第三词均是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：德治和法治都是治理方式，与治理能力没有必然联系，与题干逻辑关系不一致，排除；\nB项：小学和中学为并列关系，小学和中学属于基础教育，前两词与第三词均是种属关系，与题干逻辑关系一致，当选；\nC项：习惯是指积久养成的生活方式，民约是指人们约定共同遵守的契约，民约是一种习惯，二者是种属关系，与题干逻辑关系不一致，排除；\nD项：通信网络是网络的一种，通讯和网络不是并列关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":83,"missingImage":false},{"type":"question","qid":"3522617","cat":"类比推理","stem":"绵羊 对于 （    ） 相当于 （    ） 对于 高粱","options":{"A":"麻雀 水稻","B":"老鹰 麦子","C":"羚羊 玉米","D":"山羊 玫瑰"},"answer":"C","explanation":"逐一代入选项。\nA项：绵羊与麻雀都是动物，但绵羊是哺乳动物，而麻雀是鸟类，二者范畴不一致，高粱与水稻都是粮食作物，二者为并列关系，前后逻辑关系不一致，排除；\nB项：绵羊与老鹰都是动物，但绵羊是哺乳动物，而老鹰是鸟类，二者范畴不一致，高粱与麦子都是粮食作物，二者为并列关系，前后逻辑关系不一致，排除；\nC项：绵羊与羚羊都是反刍类哺乳动物，二者为并列关系，高粱与玉米都是粮食作物，二者为并列关系，前后逻辑关系一致，当选；\nD项：绵羊与山羊都是反刍类哺乳动物，二者为并列关系，高粱与玫瑰都是植物，但高粱是粮食作物，玫瑰是观赏性植物，二者范畴不一致，前后逻辑关系不一致，排除。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"3522644","cat":"类比推理","stem":"少壮不努力：老大徒伤悲","options":{"A":"不入虎穴：焉得虎子","B":"己所不欲：勿施于人","C":"不忘初心：方得始终","D":"若要人不知：除非己莫为"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n因为 “少壮不努力”，所以“老大徒伤悲”，前者是因，后者是果，二者为因果关系。\n第二步：判断选项词语间逻辑关系。\nA项：“不入虎穴”是“焉得虎子”的充分条件，与题干逻辑关系不一致，排除；\nB项：因果关系必定有先后性，因在前，果在后，“己所不欲”和“勿施于人”没有必然先后性，所以不是因果关系，与题干逻辑关系不一致，排除；\nC项：因为“不忘初心”，所以“才得始终”，前者是因，后者是果，二者为因果关系，与题干逻辑关系一致，当选；\nD项：“人不知”是“己莫为”的充分条件，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":85,"missingImage":false},{"type":"question","qid":"3522618","cat":"逻辑判断","stem":"最新的两项研究成果引起人们关注：一是利用某种细菌来制造人造肉的蛋白质，该细菌靠吸收温室气体二氧化碳生长，每产生1千克蛋白质约需2千克二氧化碳；二是把从大气中回收的二氧化碳和水合成乙醇，生产1千克乙醇需要1.5千克二氧化碳。专家预测，这些新技术将有助于21世纪中期实现温室气体零排放的目标。\n由此可以推出：","options":{"A":"利用二氧化碳生产食品和酒类将成为一项新兴产业","B":"未来可以通过人造食品吃掉二氧化碳来减少其排放","C":"只有二氧化碳资源化利用才能实现温室气体零排放","D":"二氧化碳资源化利用可能实现温室气体零排放目标"},"answer":"D","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干前面介绍了两项研究成果，即二氧化碳可以用来制造人造肉的蛋白质以及合成乙醇，但没有提及利用二氧化碳生产食品和酒类将成为一项新兴行业，无中生有，排除；\nB项：题干第一项研究成果介绍了二氧化碳可以用来制造人造肉的蛋白质，最后说这些新技术将有助于21世纪中期实现温室气体零排放的目标，这是专家预测的未来的事情，但未来是否真的能通过人造食品吃掉二氧化碳来减少其排放，题干没有提及，无法推出，排除；\nC项：根据题干最后一句话，这些新技术将有助于21世纪中期实现温室气体零排放的目标，但没有提及只有二氧化碳资源化利用才能实现温室气体零排放，表述过于绝对，无法推出，排除；\nD项：题干前面介绍了两种利用二氧化碳的技术，最后说这些新技术将有助于21世纪中期实现温室气体零排放的目标，可以推出二氧化碳资源化利用可能实现温室气体零排放目标，可以推出，当选。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"3522650","cat":"逻辑判断","stem":"野生动物之间因病毒入侵会暴发传染病。最新研究发现，热带、亚热带或低海拔地区的动物，因生活环境炎热，一直面临着罹患传染病的风险。生活在高纬度或高海拔等低温环境的动物，过去因长久寒冬可免于病毒入侵，但现在冬季正变得越来越温暖，持续时间也越来越短。因此，气温升高将加剧野生动物传染病的暴发。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"无论气候如何变化，生活在炎热地带的动物始终面临着患传染病风险","B":"适应寒带和高海拔栖息地的动物物种遭遇传染病暴发的风险正在升高","C":"气温高低与野生动物患传染病风险之间存在正相关性，即气温越高患病风险越高","D":"寒冷气候可能让野生动物免受病毒入侵，炎热气候却更易导致野生动物感染病毒"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：气温升高将加剧野生动物传染病的暴发。\n论据：热带、亚热带或低海拔地区的动物，因生活环境炎热，一直面临着罹患传染病的风险。生活在高纬度或高海拔等低温环境的动物，过去因长久寒冬可免于病毒入侵，但现在冬季正变得越来越温暖，持续时间也越来越短。\n论据讨论的是炎热地区与低温地区对于动物罹患传染病的风险情况，论点讨论的是气温升高将加剧野生动物传染病的暴发，论据论点均在讨论气温与野生动物传染病的关系，话题一致，可以考虑补充论据进行加强。\n第二步：逐一分析选项。\nA项：该项指出炎热地带的动物始终面临着患传染病风险，而论点的主体为野生动物；同时该项并未说明气温升高是否会加剧野生动物传染病的暴发，话题不一致，无法加强，排除；\nB项：该项指出适应寒带和高海拔栖息地的动物物种遭遇传染病暴发的风险正在升高，但并未说明气温升高与野生动物传染病暴发之间的关系，话题不一致，无法加强，排除；\nC项：该项指出气温高低与野生动物患传染病风险之间存在正相关性，说明气温升高确实会加剧野生动物传染病的暴发，属于补充论据，可以加强，当选；\nD项：该项指出寒冷气候与炎热气候对野生动物感染病毒的风险存在差异，属于重复论据，无法得知气温升高是否会加剧野生动物传染病的暴发，且是一种“可能”的说法，加强力度小于C项，排除。\n故正确答案为C。","no":87,"missingImage":false},{"type":"question","qid":"3522621","cat":"逻辑判断","stem":"小米熬成稀粥后，大分子淀粉会发生水解反应，产生小分子的糊精和少量脂肪，这些成分都浮在粥的表面，稍稍冷却后形成一层薄薄的米油。有人说，小米粥上的这层米油营养价值极高，滋补能力极强，还可以保护胃黏膜。\n以下各项如果为真，最能质疑上述观点的组合是：\n①未精制的小米富含维生素Bl、B2和钾等成分\n②米油没有什么极高营养价值和极强的滋补能力\n③米油可助消化，但助消化并不等于营养价值高\n④研究证明，米油对胃黏膜没有明显的保护作用","options":{"A":"①③","B":"②④","C":"①③④","D":"②③④"},"answer":"D","explanation":"第一步：找出论点和论据。\n\n论点：小米粥上的这层米油营养价值极高，滋补能力极强，还可以保护胃黏膜。\n论据：无。\n本题只有论点，没有论据，削弱可以优先考虑削弱论点，即米油营养价值不高，滋补能力不强，不能保护胃黏膜。\n第二步：逐一分析选项。\n题干给出了4个条件，逐一分析4个条件。\n①该条件指出未精制的小米含有的成分，但是不代表这些成分的营养价值高低、滋补能力强弱和是否能保护胃黏膜，与论点讨论的话题无关，不能削弱；\n②该条件指出米油没有极高营养价值和极强的滋补能力，直接削弱论点；\n③该条件指出米油可助消化，但助消化不等于营养价值高，说明米油可能营养价值不高，能削弱论点；\n备注：因为第③句是否能削弱，有争议，故放上原文供大家参考，在原文中，作者是用“助消化并不等于营养价值高”来质疑论点“米油营养价值极高”这句，是有可以削弱的。\n\u003cimg data-k=\"87d9a71a7aab\" style=\"max-width:600px\">\n④该条件指出米油对胃黏膜没有明显的保护作用，直接削弱论点。\n因此，最能质疑观点的组合是②③④。\n故正确答案为D。","no":88,"missingImage":false},{"type":"question","qid":"3522622","cat":"逻辑判断","stem":"AI助手在医学应用上有着明显的优势：放射科医生每天要阅读并分析大量的影像，医生会因为疲劳导致效率降低，AI助手则不会，它甚至比人眼能更加迅捷地找到影像中的可疑病变，帮助医生做出初步诊断。\n 以下哪项如果为真，最能支持上述结论?","options":{"A":"甲医院医生借助AI技术将疑难影像分类归档","B":"乙医院呼吸科借助AI助手完成了一次远程会诊","C":"丙医院放射科利用AI技术半天就可完成对200多个患者的影像诊断","D":"丁医院借助AI助手检测出远程会诊患者胸腔部位的异常征象，并为其确定治疗方案"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：AI助手在医学应用上有着明显的优势。\n论据：放射科医生每天要阅读并分析大量的影像，医生会因为疲劳导致效率降低，AI助手则不会，它甚至比人眼能更加迅捷地找到影像中的可疑病变，帮助医生做出初步诊断。\n本题论据讨论的是AI助手与医生相比更不会疲劳、效率更高，可以更快帮助医生做出诊断，论点讨论的是AI助手有着明显的优势，论点和论据话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：甲医院医生借助AI助手将影像分类归档，但是并未和人类医生做比较，故无法判断AI助手是否在医学应用上有着明显的优势，无法加强，排除；\nB项：乙医院借助AI助手完成了一次远程会诊，但是并未和人类医生做比较，故无法判断AI助手是否在医学应用上有着明显的优势，无法加强，排除；\nC项：丙医院的放射科利用AI技术半天就可完成200多个患者的诊断，体现了AI助手不会疲惫，能更快帮助医生做出初步诊断，补充论据，可以加强，当选；\nD项：丁医院借助AI助手完成对患者的诊断并确定治疗方案，但是并未和人类医生做比较，故无法判断AI助手是否在医学应用上有着明显的优势，无法加强，排除。\n故正确答案为C。","no":89,"missingImage":false},{"type":"question","qid":"3522647","cat":"逻辑判断","stem":"研究表明，肉食中的化合物可能引发部分儿童气喘，进而导致哮喘或其他呼吸道疾病。这些化合物被称作“晚期糖基化终产物”，是肉类在高温烤炸烘焙时释放出的物质。所以，素食或者少吃肉可避免儿童患哮喘的风险。\n以下哪项如果为真，最能质疑上述观点？","options":{"A":"肉类在非高温烤炸烘焙情况下，不产生晚期糖基化终产物，与哮喘的关联性未知","B":"科学家研究显示，体内的晚期糖基化终产物主要来自于但又并非仅仅来自于肉类","C":"晚期糖基化终产物除导致哮喘外，还能加速人体衰老，引发各种慢性退化性疾病","D":"晚期糖基化终产物作为一种蛋白质，在人体中自然生成，并随着年龄的增长不断积聚"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：素食或者少吃肉可避免儿童患哮喘的风险。\n论据：肉食中的化合物可能引发部分儿童气喘，进而导致哮喘或其他呼吸道疾病。这些化合物被称作“晚期糖基化终产物”，是肉类在高温烤炸烘焙时释放出的物质。\n论据提出肉类烤炸烘焙时产生的晚期糖基化终产物可能引发部分儿童哮喘，论点认为素食或者少吃肉可避免儿童患哮喘的风险，二者话题一致，削弱优先考虑否定论点。\n第二步：逐一分析选项。\nA项：非高温烤炸烘焙肉类与哮喘关联性未知，因此素食或者少吃肉能否避免儿童患哮喘的风险并不明确，不明确选项，排除；\nB项：指出晚期糖基化终产物并非仅仅来自于肉类，说明其他途径也会产生晚期糖基化终产物，只是素食或者少吃肉并不能“避免”儿童患哮喘的风险，可以削弱，保留；\nC项：指出晚期糖基化终产物会带来其他不好的作用，与素食或者少吃肉可避免儿童患哮喘的风险无关，无法削弱，排除；\nD项：指出晚期糖基化终产物在人体中自然生成，说明晚期糖基化终产物不是仅通过吃肉得到的，人体本身也会产生该物质，只是素食或者少吃肉并不能“避免”儿童患哮喘的风险，可以削弱，保留；\n对比B、D两项，B、D两项都是从除了肉类之外还有其他途径会产生晚期糖基化终产物的角度来进行削弱；但题干论点是素食或者少吃肉可避免“儿童”患哮喘，D项的潜台词是人年龄越来越大，晚期糖基化终产物不断积聚，可能避免不了得哮喘，问题是到多大年纪，积聚了多少，才会得哮喘呢？如果是积聚到儿童阶段，就会得哮喘，那能削弱论点，说明素食或者少吃肉不可避免“儿童”患哮喘；但如果积聚到中老年阶段，才会得哮喘，那就与论点主体无关了，不确定素食或者少吃肉能不能避免“儿童”阶段患哮喘，综上所述B项比D项更明确。\n故正确答案为B。","no":90,"missingImage":false},{"type":"question","qid":"3522648","cat":"逻辑判断","stem":"所有卫星在返回地球大气层时都会焚毁并产生氧化铝微粒，这些微粒会在大气层中飘浮很长时间，最终对环境造成影响。目前大约有6000颗人造卫星环绕地球旋转，其中\u003cimg data-k=\"1a67739c8245\">的卫星已经停止运行，成为太空垃圾。专家警告称，随着人类不断发射卫星和太空飞船，太空垃圾极有可能坠向地球。据此科学家认为，应致力于研发木制人造卫星。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"1969年-2006年，我国发射的返回式卫星，其隔热罩由浸渍白橡木制成，\u003cimg data-k=\"37d7c36b367c\">时可安全燃烧","B":"木头不会阻挡电磁波或地球磁场，天线可放置在木制卫星主体内部，使卫星设计更加简单","C":"科学家已筛选出能有效承受极端温度和空间辐射轰击、可做卫星主体结构的合适木质材料","D":"木制卫星在回收时可直接燃烧，不会向地球大气层释放有害物质，也不会向地面倾泻碎片"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：应致力于研发木制人造卫星。\n论据：随着人类不断发射卫星和太空飞船，太空垃圾极有可能坠向地球。\n论点讨论的是应该研发木制人造卫星，论据讨论的是卫星等太空垃圾可能产生的危害，二者话题不一致，加强优先考虑搭桥。\n第二步：逐一分析选项。\nA项：该项说的是我国发射的返回式卫星可安全燃烧，但是并未说明是否会对环境造成影响，话题不一致，无法加强，排除；\nB项：该项说的是木制卫星的设计更加简单，但是并未说明木制卫星对环境的影响程度，话题不一致，无法加强，排除；\nC项：该项说的是科学家已筛选出可做卫星主体结构的合适木质材料，但是并未说明木制卫星对环境的影响程度，话题不一致，无法加强，排除；\nD项：该项说木制卫星在回收时可直接燃烧，不会产生危害，在论据“卫星等太空垃圾可能产生的危害”与论点“木制卫星”之间建立联系，为搭桥项，当选。\n故正确答案为D。","no":91,"missingImage":false},{"type":"question","qid":"3522649","cat":"逻辑判断","stem":"专家发现，传播疟疾的蚊子被人的气味分子吸引，抗击疟疾的设备负责消除空气中的人体气味，在人体周围制造一个范围为2平方米的电场，让气味分子掉落在地上。这样，传播疟疾的蚊子就找不到它们的猎物了，因为它们在没有气味的空间中会迷失方向。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"科学家已成功研发出吸引疟疾蚊子的芳香物质，可直接引诱和杀死这些蚊子","B":"现有实验已证实，传播疟疾的蚊子对疟疾患者散发出的人体气味特别感兴趣","C":"传播疟疾的蚊子必须长时间大量吸食血液才能获得繁殖的能量","D":"带疟疾病毒的蚊子无法嗅到人体气味，就会拒绝进食直至死亡"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：抗击疟疾的设备负责消除空气中的人体气味（即在人体周围制造一个范围为2平方米的电场，让气味分子掉落在地上），这样传播疟疾的蚊子就找不到它们的猎物了。\n论据：传播疟疾的蚊子在没有气味的空间中会迷失方向。\n论点和论据在讨论消除人体气味对传播疟疾的蚊子的影响，话题一致，考虑补充论据，可以通过解释原因或举例进行加强。\n第二步：逐一分析选项。\nA项：该项指出芳香物质可直接引诱和杀死传播疟疾的蚊子，与论点中消除人体气味对传播疟疾的蚊子的影响无关，话题不一致，无法加强，排除；\nB项：该项指出传播疟疾的蚊子对疟疾患者散发出的人体气味感兴趣，并未说明消除人体气味是否会影响到传播疟疾的蚊子找到猎物，话题不一致，无法加强，排除；\nC项：该项指出传播疟疾的蚊子如何获得繁殖的能量，与论点中消除人体气味对传播疟疾的蚊子的影响无关，话题不一致，无法加强，排除；\nD项：该项指出带疟疾病毒的蚊子无法嗅到人体气味，就会拒绝进食直至死亡，解释了为什么抗击疟疾的设备消除人体气味后就能使得传播疟疾的蚊子找不到它们的猎物了，属于解释原因，可以加强，当选。\n故正确答案为D。","no":92,"missingImage":false},{"type":"question","qid":"3523530","cat":"逻辑判断","stem":"黄烷醇是存在于许多水果，蔬菜和可可中的小分子物质，人们在日常生活中会很容易摄入含有黄烷醇的食物。如果食用富含黄烷醇的食物，将会促进心血管功能。心血管功能改善有助于提高脑血管功能。某种物质有益于脑血管功能，则会对认知功能产生积极影响。\n由此可以推出：","options":{"A":"如果要改善心血管功能，就要食用富含黄烷醇的食物","B":"如果要改善脑血管功能，就要食用富含黄烷醇的食物","C":"如果要改善认知功能，就要食用富含黄烷醇的食物","D":"如果要食用富含黄烷醇的食物，就对认知功能产生积极影响"},"answer":"D","explanation":"第一步：翻译题干。\n①食用富含黄烷醇的食物\u003cimg data-k=\"2dfb7d1f72f3\">促进心血管功能；\n②心血管功能改善\u003cimg data-k=\"2dfb7d1f72f3\">提高脑血管功能；\n③有益于脑血管功能\u003cimg data-k=\"2dfb7d1f72f3\">对认知功能产生积极影响。\n将①②③串联起来可以递推出：④食用富含黄烷醇的食物\u003cimg data-k=\"2dfb7d1f72f3\">促进心血管功能\u003cimg data-k=\"2dfb7d1f72f3\">提高脑血管功能\u003cimg data-k=\"2dfb7d1f72f3\">对认知功能产生积极影响。\n第二步：逐一分析选项。\nA项：翻译为改善心血管功能\u003cimg data-k=\"2dfb7d1f72f3\">食用富含黄烷醇的食物，是对条件①的肯后，但肯后得不到确定性的结论，无法推出，排除；\nB项：翻译为改善脑血管功能\u003cimg data-k=\"2dfb7d1f72f3\">食用富含黄烷醇的食物，是对条件④的肯后，但肯后得不到确定性的结论，无法推出，排除；\nC项：翻译为改善认知功能\u003cimg data-k=\"2dfb7d1f72f3\">食用富含黄烷醇的食物，是对条件④的肯后，但肯后得不到确定性的结论，无法推出，排除；\nD项：翻译为食用富含黄烷醇的食物\u003cimg data-k=\"2dfb7d1f72f3\">对认知功能产生积极影响，是对条件④的肯前，肯前必肯后，可以推出，当选。\n故正确答案为D。","no":93,"missingImage":false},{"type":"question","qid":"3522619","cat":"逻辑判断","stem":"某实验结果表明：源于植物的“天然化合物”组合可以分解新冠病毒与人细胞相连的刺突蛋白，从而能非常有效地抑制新冠病毒，该化合物组合很可能对抑制暴露在新冠病毒环境中的人群遭受感染方面具有立竿见影的效果。\n要得到上述研究推论，还需基于以下哪一前提：","options":{"A":"新冠病毒的刺突蛋白会随着传播过程发生突变","B":"新冠病毒主要是通过呼吸道飞沫和密切接触而传播","C":"刺突蛋白是病毒本身将其侵入人体细胞的组成部分","D":"刺突蛋白变异会使传染性更强，药物是否有效还待验证"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：源于植物的“天然化合物”组合可以分解新冠病毒与人细胞相连的刺突蛋白，从而能非常有效地抑制新冠病毒，该化合物组合很可能对抑制暴露在新冠病毒环境中的人群遭受感染方面具有立竿见影的效果。\n论据：无。\n本题论点讨论了“天然化合物”组合可以分解新冠病毒与人细胞相连的刺突蛋白，从而能有效地抑制新冠病毒，无明显论据，且提问方式为前提，加强优先考虑补充必要条件。\n第二步：逐一分析选项。\nA项：选项强调的是新冠病毒的刺突蛋白会发生突变，论点讨论的是“天然化合物”组合可以分解新冠病毒与人细胞相连的刺突蛋白，从而能有效地抑制新冠病毒，话题不一致，不是论点成立的前提条件，排除；\nB项：选项讨论的是新冠病毒的传播方式，论点讨论的是“天然化合物”组合可以分解新冠病毒与人细胞相连的刺突蛋白，从而能有效地抑制新冠病毒，话题不一致，不是论点成立的前提条件，排除；\nC项：选项表明刺突蛋白是病毒本身将其侵入人体细胞的组成部分，结合论点可以确认“天然化合物”组合能够用于分解新冠病毒与人细胞相连的刺突蛋白，说明该方法具有可行性，是论点成立的前提条件，当选；\nD项：选项重点强调的是现有药物是否有效有待验证，但不明确现有药物是否用到了“天然化合物”组合且是否能够有效地抑制新冠病毒，不是论点成立的前提条件，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"3523516","cat":"类比推理","stem":"三位房东甲、乙、丙将自己的房子分别租给租客小李、小张、小王。甲说他租给的是小李；小李说他租的是丙的房子；丙说他租给的是小王。\n若这三人均没有说真话，则下列选项正确的是：","options":{"A":"房东乙将房子租给了小张","B":"房东丙将房子租给了小李","C":"小王租的是房东乙的房子","D":"小李租的是房东乙的房子"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）甲房租给小李；\n（2）小李租丙房；\n（3）丙房租给小王；\n（4）三个人都没说真话。\n第二步：根据题干信息进行推理。\n三人都说假话，首先把假话变成真话为：\n（1）甲房没租给小李；\n（2）小李没租丙房；\n（3）丙房没租给小王。\n根据最大信息，条件（1）、（2）都提到小李，即小李没租甲房和丙房，则小李一定租的是乙房。\n故正确答案为D。","no":95,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>某公司全年销售甲、乙、丙、丁四种产品的销量，单位成本和销售单价如下：\u003c/p>\u003cp>\u003cimg data-k=\"c3bdb00bb56c\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"3523453","cat":"综合","stem":"某公司全年销量最大的是：","options":{"A":"甲产品","B":"乙产品","C":"丙产品","D":"丁产品"},"answer":"C","explanation":"定位表格材料可得：甲产品第1—4季度销量分别为20350件、22010件、18080件、19320件；乙产品第1—4季度销量分别为12260件、13130件、13280件、13550件；丙产品第1—4季度销量分别为46350件、48980件、45610件、45820件；丁产品第1—4季度销量分别为4360件、4578件、3940件、4256件。比较发现，丙产品每个季度的销量在四种产品中都是最大的，根据全年销量\u003cimg data-k=\"e6c7a9c8511f\">第1季度\u003cimg data-k=\"3d6d1f96db11\">第2季度\u003cimg data-k=\"3d6d1f96db11\">第3季度\u003cimg data-k=\"3d6d1f96db11\">第4季度，可得丙产品全年销量最大。\n故正确答案为C。","no":96,"missingImage":false},{"qid":"3523455","cat":"综合","stem":"某公司全年销售价格波动绝对值最大的是：","options":{"A":"甲产品","B":"乙产品","C":"丙产品","D":"丁产品"},"answer":"D","explanation":"定位表格材料可得：甲产品销售单价的最大值和最小值分别为13元、12元；乙产品4个季度销售单价都是15元；丙产品销售单价的最大值和最小值分别为5.0元、4.5元；丁产品销售单价的最大值和最小值分别为138元、128元；根据波动的绝对值\u003cimg data-k=\"e6c7a9c8511f\">最大值\u003cimg data-k=\"e752a8ae1a16\">最小值，可得甲产品销售价格波动的绝对值为\u003cimg data-k=\"08b52816f659\">，乙产品为0，丙产品为\u003cimg data-k=\"c0310f7c72a2\">，丁产品为\u003cimg data-k=\"12d697d83a78\">。故全年销售价格波动绝对值最大的是丁产品。\n故正确答案为D。\n备注：波动在数学理论上应该算方差，结合公考一贯的命题思路，不涉及复杂计算，可以将波动理解为变化，变化的绝对值最大，即差值最大。","no":97,"missingImage":false},{"qid":"3523456","cat":"比重","stem":"对于某公司丁产品，季度销售总额占全年销售总额比重最大的是：","options":{"A":"第1季度","B":"第2季度","C":"第3季度","D":"第4季度"},"answer":"B","explanation":"根据题干“······季度销售总额占全年销售总额比重最大的是”，可判定本题为现期比重问题。定位表格材料可得：丁产品第1—4季度销量分别为4360件、4578件、3940件、4256件；销售单价分别为130元、138元、128元、136元。比较发现，第2季度销量和销售单价在4个季度里都是最大的，根据销售总额\u003cimg data-k=\"e6c7a9c8511f\">销售单价\u003cimg data-k=\"d3c04dbcfd43\">销量可得，丁产品第2季度的销售总额最大。再根据比重\u003cimg data-k=\"c5594c8ce5b4\">，整体相同，部分越大，比重越大；全年销售总额相同，丁产品第2季度的销售总额最大，故第2季度销售总额占的比重最大。\n故正确答案为B。","no":98,"missingImage":false},{"qid":"3523487","cat":"综合","stem":"以下图形中，能够表示某公司甲产品四个季度销售利润趋势的是：","options":{"A":"\u003cimg data-k=\"3640b90d1ec5\" style=\"max-width:334px\">","B":"\u003cimg data-k=\"02f0063a49dc\" style=\"max-width:318px\">","C":"\u003cimg data-k=\"3135a78f40f0\" style=\"max-width:310px\">","D":"\u003cimg data-k=\"c3646008fc9b\" style=\"max-width:294px\">"},"answer":"C","explanation":"定位表格材料，甲产品四个季度的销量分别为20350件、22010件、18080件、19320件，单位成本分别为10元、10元、11元、10元，销售单价分别为12元、12元、13元、13元。根据利润总额\u003cimg data-k=\"e6c7a9c8511f\">单件利润\u003cimg data-k=\"d3c04dbcfd43\">销量\u003cimg data-k=\"fc424cadb417\">销售单价\u003cimg data-k=\"e752a8ae1a16\">单位成本\u003cimg data-k=\"85e3f683ac80\">销量，可知甲产品四个季度的利润总额分别为\u003cimg data-k=\"9c6672f767eb\">元、\u003cimg data-k=\"bdd29a278603\">元、\u003cimg data-k=\"70bdc942852e\">元、\u003cimg data-k=\"1cfcda14e081\">元，趋势为上升、下降、上升，符合此规律的只有C项。\n故正确答案为C。","no":99,"missingImage":false},{"qid":"3523488","cat":"综合","stem":"根据资料，下列选项说法正确的是：","options":{"A": <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){
  var base=(window.__EXAM__&&window.__EXAM__.imgBase)||"";
  return base+((window.__IMGS__ && window.__IMGS__[k]) || "");
}
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
