<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2026年新疆区考公务员录用考试《行测》试题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2026-新疆","title":"2026年新疆区考公务员录用考试《行测》试题（网友回忆版）","year":"2026","group":"新疆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"16069911","cat":"时事政治","stem":"党的二十大报告指出，坚持把发展经济的着力点放在实体经济上，推进新型工业化，加快建设制造强国、质量强国、航天强国、交通强国、网络强国、数字中国。关于发展实体经济，下列说法正确的是：\n①金融是实体经济的血脉，为实体经济服务是金融的天职\n②要增强资本市场服务实体经济功能，积极有序发展股权融资\n③要实现实体经济、科技创新、现代金融、人力资源协同发展\n④要促进实体经济和数字经济深度融合，有序推动实体经济脱实向虚\n⑤要推动资源要素向实体经济集聚、政策措施向实体经济倾斜、工作力量向实体经济加强","options":{"A":"①②③⑤","B":"②③④","C":"①②④⑤","D":"③④⑤"},"answer":"A","explanation":"本题考查新思想。\n①正确，2026年2月1日出版的第3期《求是》杂志发表了习近平总书记的重要文章《走好中国特色金融发展之路，建设金融强国》，文章指出：“······坚持把金融服务实体经济作为根本宗旨。实体经济是金融的根基，金融是实体经济的血脉，服务实体经济是金融的天职······”\n②正确，2017年7月召开的全国金融会议指出：“金融是国之重器，是国民经济的血脉······要增强资本市场服务实体经济功能，积极有序发展股权融资，提高直接融资比重······”\n③正确，党的十九大报告在“五、贯彻新发展理念，建设现代化经济体系”部分指出：“必须坚持质量第一、效益优先······着力加快建设实体经济、科技创新、现代金融、人力资源协同发展的产业体系，着力构建市场机制有效、微观主体有活力、宏观调控有度的经济体制，不断增强我国经济创新力和竞争力。”\n④错误，2026年2月1日出版的第3期《求是》杂志发表了习近平总书记的重要文章《走好中国特色金融发展之路，建设金融强国》，文章指出：“······我国金融必须守好服务实体经济本分，推动高质量发展，决不能脱实向虚。”十五五规划纲要在“第十三章 全方位推进数智技术赋能”部分指出：“促进实体经济和数字经济深度融合。”故“有序推动实体经济脱实向虚”表述有误。\n⑤正确，《习近平新时代中国特色社会主义思想学习纲要》在“九、以新发展理念引领经济高质量发展”部分指出：“······要加快发展先进制造业，坚定不移建设制造强国。推动互联网、大数据、人工智能同实体经济深度融合，推动资源要素向实体经济集聚、政策措施向实体经济倾斜、工作力量向实体经济加强······”\n故正确的有①②③⑤。\n故正确答案为A。","no":1,"missingImage":false},{"type":"question","qid":"16069904","cat":"时事政治","stem":"党的二十届四中全会指出，“十五五”时期是基本实现社会主义现代化夯实基础、全面发力的关键时期，在基本实现社会主义现代化进程中具有承前启后的重要地位。关于“十五五”规划，下列说法正确的是：","options":{"A":"加强原始创新和关键核心技术攻关，推动科技创新和产业创新深度融合","B":"把发展经济的着力点向传统实体产业转移，巩固壮大传统实体产业根基","C":"积极稳妥推进和实现碳达峰，发展集中式能源，逐步缩减全国碳排放权交易市场","D":"发挥积极财政政策作用，适当加强地方事权、提高地方财政支出比重，增加地方自主财力"},"answer":"A","explanation":"本题考查新思想。\n2025年10月23日，中国共产党第二十届中央委员会第四次全体会议通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》（以下简称《建议》）。\nA项正确，《建议》在“四、加快高水平科技自立自强，引领发展新质生产力”部分指出：“（11）加强原始创新和关键核心技术攻关。完善新型举国体制，采取超常规措施，全链条推动集成电路、工业母机、高端仪器、基础软件、先进材料、生物制造等重点领域关键核心技术攻关取得决定性突破······（12）推动科技创新和产业创新深度融合。统筹国家战略科技力量建设，增强体系化攻关能力。强化科技基础条件自主保障，统筹科技创新平台基地建设。完善区域创新体系，布局建设区域科技创新中心和产业科技创新高地，强化国际科技创新中心策源功能······”\nB项错误，《建议》在“三、建设现代化产业体系，巩固壮大实体经济根基”部分指出：“现代化产业体系是中国式现代化的物质技术基础。坚持把发展经济的着力点放在实体经济上，坚持智能化、绿色化、融合化方向，加快建设制造强国、质量强国、航天强国、交通强国、网络强国，保持制造业合理比重，构建以先进制造业为骨干的现代化产业体系。”故“把发展经济的着力点向传统实体产业转移，巩固壮大传统实体产业根基”表述错误，应为“坚持把发展经济的着力点放在实体经济上，巩固壮大实体经济根基”。\nC项错误，《建议》在“十二、加快经济社会发展全面绿色转型，建设美丽中国”部分指出：“（47）积极稳妥推进和实现碳达峰。实施碳排放总量和强度双控制度。深入实施节能降碳改造。推动煤炭和石油消费达峰。完善碳排放统计核算体系，稳步实施地方碳考核、行业碳管控、企业碳管理、项目碳评价、产品碳足迹等政策制度。发展分布式能源，建设零碳工厂和园区。扩大全国碳排放权交易市场覆盖范围，加快温室气体自愿减排交易市场建设······”故“发展集中式能源，逐步缩减全国碳排放权交易市场”表述错误，应为“发展分布式能源，扩大全国碳排放权交易市场覆盖范围”。\nD项错误，《建议》在“六、加快构建高水平社会主义市场经济体制，增强高质量发展动力”部分指出：“（20）提升宏观经济治理效能。发挥积极财政政策作用，增强财政可持续性······适当加强中央事权、提高中央财政支出比重。增加地方自主财力。加强财会监督。加快构建同高质量发展相适应的政府债务管理长效机制。”故“适当加强地方事权、提高地方财政支出比重”表述错误，应为“适当加强中央事权、提高中央财政支出比重”。\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"16069954","cat":"新思想","stem":"习近平总书记强调，要坚持以铸牢中华民族共同体意识为主线，不断推进民族团结进步事业，推动党的民族工作高质量发展。关于铸牢中华民族共同体意识，下列说法正确的有几项?\n①广泛交往交流交融是推进中华民族共同体建设的重要途径\n②加强对青少年的历史文化教育，全面推广普及国家通用语言文字，全面推行使用国家统编教材\n③要坚持和完善民族区域自治制度，逐步完善相关法律法规和差别化区域支持政策，依法保障各族群众合法权益\n④要引导各族群众不断增强对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n2024年9月27日，全国民族团结进步表彰大会在北京举行。习近平总书记出席大会并发表重要讲话。\n①正确，习近平总书记在讲话中指出：“第四，推动各民族全方位嵌入，积极促进各民族交往交流交融。广泛交往交流交融是推进中华民族共同体建设的重要途径。”\n②正确，习近平总书记在讲话中指出：“第二，着力构筑中华民族共有精神家园······加强对青少年的历史文化教育，全面推广普及国家通用语言文字，全面推行使用国家统编教材，把中华民族共同体意识从小就植入孩子们的心灵。”\n③正确，习近平总书记在讲话中指出：“第五，依法治理民族事务，不断提高民族事务治理能力和水平。要坚持和完善民族区域自治制度，逐步完善相关法律法规和差别化区域支持政策，依法保障各族群众合法权益。加强法治宣传教育，引导各族群众增强国家意识、公民意识、法治意识。”\n④正确，习近平总书记在讲话中指出：“第一，始终坚持党的领导，不断巩固各民族团结奋斗的共同思想政治基础······要引导各族群众不断增强对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同，牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念。”\n故①②③④表述正确，共4项。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"16069953","cat":"新思想","stem":"习近平总书记强调，要牢固树立和践行绿水青山就是金山银山的理念，坚定不移走生态优先、绿色发展之路。关于绿色发展，下列表述正确的有几项?\n①坚持绿色发展是发展观的一场深刻革命\n②要坚持经济优先、技术优先、人工恢复为主的方针，像保护眼睛一样保护自然和生态环境\n③应暂缓绿色发展领域的多边合作平台建设，以应对现有国际环境治理合作存在的诸多风险与挑战\n④不仅要从政策上加强管理和保护，而且要从全球变化、碳循环机理等方面加深认识，依靠科技创新破解绿色发展难题","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"B","explanation":"本题考查新思想。\n①正确，2017年6月21日至23日，习近平总书记在山西考察工作时强调：“坚持绿色发展是发展观的一场深刻革命。要从转变经济发展方式、环境污染综合治理、自然生态保护修复、资源节约集约利用、完善生态文明制度体系等方面采取超常举措，全方位、全地域、全过程开展生态环境保护。”\n②错误，2018年5月18日至19日，全国生态环境保护大会在北京召开，习近平总书记出席会议并发表重要讲话，他指出：“新时代推进生态文明建设，必须坚持好以下原则。一是坚持人与自然和谐共生，坚持节约优先、保护优先、自然恢复为主的方针，像保护眼睛一样保护生态环境，像对待生命一样对待生态环境，让自然生态美景永驻人间······”故“要坚持经济优先、技术优先、人工恢复为主的方针”表述有误，应为“坚持节约优先、保护优先、自然恢复为主的方针”。\n③错误，2024年7月18日，二十届三中全会通过的《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“七、完善高水平对外开放体制机制”中指出：“（28）完善推进高质量共建‘一带一路’机制。继续实施‘一带一路’科技创新行动计划，加强绿色发展、数字经济、人工智能、能源、税收、金融、减灾等领域的多边合作平台建设······”故“应暂缓绿色发展领域的多边合作平台建设”表述错误，应为“加强绿色发展······等领域的多边合作平台建设”。\n④正确，2016年5月30日，习近平总书记在全国科技创新大会、两院院士大会、中国科协第九次全国代表大会上强调：“绿色发展是生态文明建设的必然要求，代表了当今科技和产业变革方向，是最有前途的发展领域······不仅要研究生态恢复治理防护的措施，而且要加深对生物多样性等科学规律的认识；不仅要从政策上加强管理和保护，而且要从全球变化、碳循环机理等方面加深认识，依靠科技创新破解绿色发展难题，形成人与自然和谐发展新格局。”\n综上，①④表述正确，共2项。\n故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"16069901","cat":"新思想","stem":"城乡融合发展是中国式现代化的必然要求。关于城乡融合发展，下列说法正确的有几项？\n①要把乡村振兴战略这篇大文章做好，必须走城乡融合发展之路\n②在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败\n③要顺应城乡融合发展大趋势，破除妨碍城乡要素平等交换、双向流动的制度壁垒\n④振兴乡村，不能就乡村论乡村，还是要强化以工补农、以城带乡，加快形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n①正确，2018年9月21日，习近平总书记在十九届中央政治局第八次集体学习时讲话指出：“要把乡村振兴战略这篇大文章做好，必须走城乡融合发展之路。我们一开始就没有提城市化，而是提城镇化，目的就是促进城乡融合。要向改革要动力，加快建立健全城乡融合发展体制机制和政策体系。”\n②正确，2018年9月21日，习近平总书记在十九届中央政治局第八次集体学习时讲话指出：“我一直强调，没有农业农村现代化，就没有整个国家现代化。在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败。”\n③正确，2022年12月23日，习近平总书记在中央农村工作会议上讲话指出：“要顺应城乡融合发展大趋势，破除妨碍城乡要素平等交换、双向流动的制度壁垒，促进发展要素、各类服务更多下乡，率先在县域内破除城乡二元结构。”\n④正确，2020年12月28日，习近平总书记在中央农村工作会议上讲话指出：“第六，推动城乡融合发展见实效。振兴乡村，不能就乡村论乡村，还是要强化以工补农、以城带乡，加快形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系。”\n综上，①②③④说法正确，共4项。\n故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"16070240","cat":"新思想","stem":"就业是最基本的民生，事关人民群众切身利益，事关经济社会健康发展，事关国家长治久安。关于促进高质量充分就业，下列举措恰当的有几项？\n①引导退役军人围绕国家重点扶持领域创业\n②推动农村低收入人口就业帮扶常态化，防止因失业导致规模性返贫\n③鼓励支持企业吸纳就业、自主创业，统筹用好公益性岗位，确保不出现零就业家庭\n④对各种类型的就业困难高校毕业生均按照规定给予一定的社会保险补贴\n⑤提升青年就业服务效能，强化针对性职业指导、职业介绍、技能培训、见习实习，形成衔接校内校外、助力成长成才的服务支撑","options":{"A":"5项","B":"4项","C":"3项","D":"2项"},"answer":"C","explanation":"本题考查新思想。\n2024年9月15日，中共中央、国务院发布《关于实施就业优先战略促进高质量充分就业的意见》，以下简称《意见》。\n①正确，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十）做好退役军人就业服务保障。健全学历教育与职业技能培训、创业培训、个性化培训并行的退役军人教育培训体系······引导退役军人围绕国家重点扶持领域创业。”\n②正确，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十一）拓宽农村劳动力就业增收空间。壮大县域富民产业，推出一批适应乡村全面振兴需要的新职业，注重引导外出人才返乡、城市人才下乡创业，实施以工代赈，加快形成双向流动、互融互通的统筹城乡就业格局······推动农村低收入人口就业帮扶常态化，防止因失业导致规模性返贫。”\n③错误，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十二）完善困难人员就业援助制度······鼓励支持企业吸纳就业、自主创业，统筹用好公益性岗位，确保零就业家庭动态清零。”故“确保不出现零就业家庭”表述错误，应为“确保零就业家庭动态清零”。\n④错误，《意见》在“四、完善重点群体就业支持体系”部分指出：“（十三）优化自主创业灵活就业保障制度······对就业困难人员、离校2年内未就业高校毕业生灵活就业的，按照规定给予一定的社会保险补贴。”故“各种类型的就业困难高校毕业生”表述错误，应为“就业困难人员、离校2年内未就业高校毕业生灵活就业的”。\n⑤正确，《意见》在“四、完善重点群体就业支持体系”部分指出：“（九）拓展高校毕业生等青年就业成才渠道······提升青年就业服务效能，强化针对性职业指导、职业介绍、技能培训、见习实习，形成衔接校内校外、助力成长成才的服务支撑。”\n综上，①②⑤说法正确，共3项。\n故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"16070164","cat":"马克思主义","stem":"唯物辩证法认为，事物是普遍联系的，事物及事物各要素相互影响、相互制约，整个世界是相互联系的整体，也是相互作用的系统。下列有关说法正确的是：\n①系统的功能等于各个部分功能的简单相加\n②系统思维就是在确认事物普遍联系的基础上，具体揭示对象的系统存在、系统关系及其规律的观点和方法\n③系统是一个静态和复杂的整体，由不同要素无序构成\n④对于外来作用，系统能作为一个统一体作出反应，而不管这种外来作用直接作用于系统的哪一个部分\n⑤系统的相关性特征集中体现为事物之间、事物内部诸要素之间的相互作用","options":{"A":"①②③④⑤","B":"①②③⑤","C":"②③④⑤","D":"②④⑤"},"answer":"D","explanation":"本题考查马克思主义。\n①错误，唯物辩证法认为，系统具有整体性特征，整体功能不是部分功能的机械相加。当部分以合理、有序、优化的结构形成整体时，整体功能大于部分功能之和；若结构不合理，则整体功能小于部分功能之和。因此，系统功能并非各个部分功能的简单相加。\n②正确，唯物辩证法认为，世界是普遍联系的，任何事物都处在相互影响、相互制约、相互作用的关系之中。系统思维就是在确认事物普遍联系的基础上，把认识对象当作一个相互联系、相互作用的有机系统，进而具体揭示其系统存在、系统结构、系统关系及其运动发展规律的观点和方法。\n③错误，系统是一个动态的、有序的整体，而非静态无序的构成。系统的本质特征是动态性与有序性：系统始终处于运动、变化、发展之中，并非静态；系统内部各要素按照一定的秩序、结构、层次有机组合，而非无序堆砌。\n④正确，对于外来作用，系统能作为一个统一体作出反应，这体现了系统的整体性特征。由于系统内部各要素相互关联、相互制约，当外部作用直接作用于系统的某一局部时，这种影响会通过内在的联系传导至整个系统，从而使系统能够作为一个有机整体对外部刺激做出统一反应。\n⑤正确，系统的相关性特征集中体现为事物之间、事物内部诸要素之间的相互作用。相关性是系统存在的基础，它强调世界上的万事万物都不是孤立存在的，而是通过相互影响、相互制约、相互促进的相互作用联系在一起，这种相互作用构成了系统运动和发展的根本原因。\n综上，②④⑤表述正确。\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"16070340","cat":"新思想","stem":"优化政务服务、提升行政效能是优化营商环境、建设全国统一大市场的必然要求，对加快构建新发展格局、推动高质量发展具有重要意义。关于优化政务服务、提升行政效能，下列举措恰当的是：\n①推进关联事项集成办，为企业和群众提供“一件事一次办”“一类事一站办”服务\n②推进线下办事“只进一门”，要求所有的银行网点、邮政网点、园区等都要设置便民服务点\n③推进企业和群众诉求“一线应答”，根据需要设置重点领域专席，不断提升12345热线接办效率\n④推进线上办事“一网通办”，推动各类政务服务事项和应用“应接尽接、应上尽上”，政府服务事项全面纳入同级政务服务平台管理和办理","options":{"A":"①②","B":"①③","C":"②④","D":"③④"},"answer":"B","explanation":"本题考查新思想。\n2024年01月16日，《国务院关于进一步优化政务服务提升行政效能推动“高效办成一件事”的指导意见》（以下简称《意见》）发布。\n①正确，《意见》在“三、全面深化政务服务模式创新”部分指出：“（四）推进关联事项集成办。从企业和群众视角出发，将需要多个部门办理或跨层级办理，关联性强、办理量大、办理时间相对集中的多个事项集成办理，为企业和群众提供‘一件事一次办’、‘一类事一站办’服务。明确每个‘一件事’的牵头部门和配合部门及各自职责，强化跨部门政策、业务、系统协同和数据共享······”\n②错误，《意见》在“二、全面加强政务服务渠道建设”部分指出：“（一）推进线下办事‘只进一门’······有关部门单设的政务服务窗口应整合并入本级政务服务中心，确不具备整合条件的要纳入一体化管理，按统一要求提供规范服务。结合经济社会发展状况、人口分布情况，统筹推进乡镇（街道）便民服务中心和村（社区）便民服务站建设。鼓励在有条件、有需求的银行网点、邮政网点、园区等设置便民服务点，探索利用集成式自助终端提供‘24小时不打烊’服务。国务院部门可根据实际需要设立政务服务大厅，集中提供办事服务。”故“要求所有的银行网点、邮政网点、园区等都要设置便民服务点”表述错误，应为“鼓励在有条件、有需求的银行网点、邮政网点、园区等设置便民服务点”。\n③正确，《意见》在“二、全面加强政务服务渠道建设”部分指出：“（三）推进企业和群众诉求‘一线应答’。依托12345政务服务便民热线加强政务服务热线归并，根据需要设置重点领域专席，不断提升12345热线接办效率，高效受理政务服务咨询、投诉、求助、建议和在线办理指导等诉求。建立健全‘接诉即办’机制，更好发挥热线直接面向企业和群众的窗口作用，及时了解问题建议，推动解决服务问题······”。\n④错误，《意见》在“二、全面加强政务服务渠道建设”部分指出：“（二）推进线上办事‘一网通办’······加强省级政务服务平台网上统一受理端建设，推动办件信息实时共享，实现办事申请‘一次提交’、办理结果‘多端获取’。依托各级政务服务平台整合联通各类办事服务系统，推动各类政务服务事项和应用‘应接尽接、应上尽上’，除法律法规另有规定或涉及国家秘密等外，政务服务事项全部纳入同级政务服务平台管理和办理。”故“政府服务事项全面纳入同级政务服务平台管理和办理”表述错误，应为“除法律法规另有规定或涉及国家秘密等外，政务服务事项全部纳入同级政务服务平台管理和办理”。\n综上，①③表述正确。\n故正确答案为B。","no":8,"missingImage":false}],"count":8,"answerable":8,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"16069975","cat":"法律常识","stem":"《民营经济促进法》规定平等对待民营经济组织，保障公平竞争。下列做法符合该规定的是：","options":{"A":"某市规范性文件规定，限制信用等级B级以下的民营企业参加政府采购交易活动","B":"某市严格把控数据安全，限缩民营企业使用公共交通数据的授权范围","C":"某银行风控规范要求，民营企业信贷审批需要公司法人提供连带保证","D":"某银行合理设置小型民营企业不良贷款容忍度、健全尽职免责机制"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国民营经济促进法》第十四条第一款规定：“公共资源交易活动应当公开透明、公平公正，依法平等对待包括民营经济组织在内的各类经济组织。”本项中，以信用等级为由限制民营企业参与政府采购，属于排斥民营经济组织参与公共资源交易，违反平等对待、公平竞争原则，因此，某市限制信用等级B级以下的民营企业参加政府采购交易活动，不符合《中华人民共和国民营经济促进法》规定。\nB项错误，根据《中华人民共和国民营经济促进法》第十二条规定：“国家保障民营经济组织依法平等使用资金、技术、人力资源、数据、土地及其他自然资源等各类生产要素和公共服务资源，依法平等适用国家支持发展的政策。”第十三条规定：“各级人民政府及其有关部门依照法定权限，在制定、实施政府资金安排、土地供应、排污指标、公共数据开放、资质许可、标准制定、项目申报、职称评定、评优评先、人力资源等方面的政策措施时，平等对待民营经济组织。”因此，限缩民营企业使用公共数据的授权范围，剥夺其平等使用数据要素的权利，不符合《中华人民共和国民营经济促进法》规定。\nC项错误，根据《中华人民共和国民营经济促进法》第二十四条规定：“金融机构在授信、信贷管理、风控管理、服务收费等方面应当平等对待民营经济组织。金融机构违反与民营经济组织借款人的约定，单方面增加发放贷款条件、中止发放贷款或者提前收回贷款的，依法承担违约责任。”因此，对民营企业单独设置“法人连带保证”的额外担保要求，违反金融机构平等对待民营经济组织的原则，不符合《中华人民共和国民营经济促进法》规定。\nD项正确，根据《中华人民共和国民营经济促进法》第二十条规定：“国务院有关部门依据职责发挥货币政策工具和宏观信贷政策的激励约束作用，按照市场化、法治化原则，对金融机构向小型微型民营经济组织提供金融服务实施差异化政策，督促引导金融机构合理设置不良贷款容忍度、建立健全尽职免责机制、提升专业服务能力，提高为民营经济组织提供金融服务的水平。”因此，某银行合理设置小型民营企业不良贷款容忍度、健全尽职免责机制，符合《中华人民共和国民营经济促进法》规定。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"16070161","cat":"经济常识","stem":"关于金融知识，下列说法错误的是：","options":{"A":"外汇结构性理财产品可以挂钩大宗商品、对冲基金、黄金石油等标的","B":"股票净值，又称股票的票面价值，是指每股股票所包含的实际资产的价值","C":"开放式基金是指基金份额总额不固定，基金份额可以在基金合同约定的时间和场所申购或赎回的基金","D":"债券的票面利率取决于债券发行时的市场利率、债券期限、发行者信用水平、债券的流动性水平等因素"},"answer":"B","explanation":"本题考查经济常识。\nA项正确，外汇结构性理财产品是一种将固定收益类资产与金融衍生品结合的理财产品。它们通常会设定一个最低保本额，保本额上的浮动收益取决于产品挂钩标的的表现。这些挂钩标的可以非常广泛，包括大宗商品、境外上市的股票价格或指数、对冲基金和黄金石油等。\nB项错误，股票净值亦称“股票的账面价值”，指每个普通股能够分配到的公司会计账面上的净价值，是股票所含实际资产的价值。它等于公司净值减去流通在外的公司优先股总面额后的余额再除以流通在外的普通股数。“股票的票面价值”是一个固定的数值，主要用于表明股票所代表的资本数额和在公司总股本中的比例，但它并不直接反映股票的实际资产的价值。\nC项正确，按基金运作方式不同，基金可分为封闭式基金和开放式基金。其中开放式基金是指基金份额总额不固定，基金份额可以在基金合同约定的时间和场所申购或者赎回的基金。\nD项正确，债券的票面利率取决于债券发行时的市场利率、债券期限、发行者信用水平、债券的流动性水平等因素。发行时市场利率越高，票面利率就越高；债券期限越长，票面利率就越高；发行者信用水平越高，票面利率就越低；债券的流动性越高，票面利率就越低。\n本题为选非题，故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"16069956","cat":"人文常识","stem":"“二十四史”是中国历代史学家精心编撰的纪传体史书，是中华民族珍贵的文化遗产。下列说法正确的是：","options":{"A":"《后汉书》记载了侯景之乱","B":"《南史》是南朝范晔编撰的史书","C":"《汉书》中《艺文志》是记述经济制度的专篇","D":"《史记》卷次中《五帝本纪》排序在《殷本纪》之前"},"answer":"D","explanation":"本题考查人文常识。\nA项错误，《后汉书》是南朝宋范晔编撰的史书，创作于南朝宋元嘉年间，是一部记载东汉历史的纪传体断代史。《后汉书》主要记述了上起东汉的汉光武帝建武元年（25年），下至汉献帝建安二十五年（220年），共195年的史事。而侯景之乱发生在南北朝时期的梁朝，属于南朝历史事件，时间远晚于东汉，不可能出现在《后汉书》中。\nB项错误，《南史》是中国历代官修正史“二十四史”之一，记述上起宋武帝刘裕永初元年（420年），下迄陈后主陈叔宝祯明三年（589年），包含南朝宋、齐、梁、陈四个朝代共一百七十年的历史。《南史》与《北史》为姊妹篇，由李大师及其子李延寿两代人编撰完成，而非范晔。\nC项错误，《汉书》由东汉班固编撰，班昭、马续补作，是中国首部纪传体断代史，成书于汉和帝年间，与《史记》《后汉书》《三国志》并称“前四史”。《汉书》中的《艺文志》在西汉刘歆《七略》基础上改编而成，是中国古代第一部系统性的图书目录、学术源流专篇，主要记录当时存世典籍、分类与学术流派。而记述经济制度、财政、农业、工商业等内容的专篇是《食货志》。\nD项正确，《史记》是西汉史学家司马迁撰写的纪传体史书，是中国历史上第一部纪传体通史，记载了上至上古传说中的黄帝时代，下至汉武帝太初四年间共三千多年的历史。全书由十二本纪、十表、八书、三十世家、七十列传构成，其中“本纪”是全书提纲，以王朝的更替为体，按年月时间记述帝王的言行政绩，照历史时间顺序：《五帝本纪》居首，其后依次为《夏本纪》《殷本纪》《周本纪》等。五帝时代早于殷商，因此《五帝本纪》在卷次排序上位于《殷本纪》之前。\n故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"16070218","cat":"地理国情","stem":"极光是一种绚丽多彩的大气发光现象，一般只在南北两极的高纬度地区出现，它的形成与太阳活动、地球磁场和高层大气的相互作用有关。由此判断观测极光需要的条件是（    ）。","options":{"A":"太阳活动强烈，月圆的夜晚","B":"太阳活动强烈，晴朗的夜晚","C":"太阳活动微弱，多云的夜晚","D":"太阳活动微弱，下雨的夜晚"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，B项正确，极光的产生依赖于太阳活动释放的高能带电粒子与地球磁场的相互作用。当太阳活动强烈时，更多高能带电粒子进入地球两极，激发高层大气中的原子发光，形成极光。而极光亮度较低，需在无云层遮挡且无其他光污染的晴朗夜晚才能清晰观测。但月圆的夜晚通常月光强烈，明亮的月光会严重削弱极光的可见度，甚至使其完全不可见。故“太阳活动强烈，晴朗的夜晚”可以观测到极光。\n‌C、D两项错误，太阳活动微弱时，太阳风强度降低，进入地球两极的高能带电粒子减少，极光出现的频率和强度显著降低，甚至无法形成可见极光。下雨意味着云层厚密，而在多云的夜晚，云层会完全遮挡极光，不具备极光的观测条件。\n故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"16069915","cat":"科技常识","stem":"下列异常的体检指标，与其关联的疾病最不可能对应的是（    ）。","options":{"A":"白细胞数量高于参考范围的上限——阑尾炎","B":"谷丙转氨酶高于参考范围的上限——冠心病","C":"红细胞数量低于参考范围的下限——贫血症","D":"甲胎蛋白浓度高于参考范围的上限——肝癌"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，白细胞是人体免疫系统的核心功能细胞，外周血白细胞总数升高，是急性细菌性感染、化脓性炎症反应的标志性指标。阑尾炎的核心发病机制是阑尾管腔堵塞后继发肠道细菌感染，引发的急性化脓性炎症，属于典型的腹腔细菌感染性疾病。急性阑尾炎发作时，机体免疫系统快速激活，大量白细胞增殖并趋化至炎症病灶，直接导致外周血白细胞总数显著高于参考上限。\nB项错误，谷丙转氨酶90%以上储存于人体肝细胞的胞质中，心肌、骨骼肌等其他组织中含量极低。只有当肝细胞受损、细胞膜完整性被破坏时，大量谷丙转氨酶才会释放进入血液，导致外周血检测值显著升高。故谷丙转氨酶是临床诊断肝细胞损伤、肝脏疾病的特异性、敏感性核心指标，冠心病本身不会导致谷丙转氨酶升高。冠心病全称冠状动脉粥样硬化性心脏病，是冠状动脉粥样硬化导致血管狭窄、心肌缺血缺氧引发的心脏疾病，其特异性生物标志物是肌钙蛋白等。\nC项正确，贫血症指外周血中单位容积内的红细胞计数、血红蛋白浓度、红细胞比容低于同年龄、同性别、同地区健康人群的参考范围下限的一种病理状态。其中，红细胞数量减少是贫血最核心的病理表现之一。\nD项正确，甲胎蛋白是原发性肝细胞癌的特异性肿瘤标志物。生理状态下，甲胎蛋白主要由胎儿肝细胞合成，出生后合成能力迅速下降，健康成人外周血中甲胎蛋白浓度极低。当肝细胞发生癌变时，癌变的肝细胞可能重新获得合成甲胎蛋白的能力，导致外周血甲胎蛋白浓度显著升高。\n本题为选非题，故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"16069917","cat":"科技常识","stem":"下列选项体现的物理原理与其他选项不同的是（    ）。","options":{"A":"三角形的泡泡棒吹出的泡泡总是趋于球状","B":"植物根部的毛细管从土壤中吸收水分","C":"眼镜镜片的表面镀膜可以防蓝光","D":"雨后荷叶上的水珠呈球形"},"answer":"C","explanation":"本题考查科技常识。\nA、D两项正确，三角形的泡泡棒吹出的泡泡最终呈球形，雨后荷叶上的水珠呈球形，都是因为液体表面张力的作用，表面张力会使液体表面尽可能收缩到最小表面积（相同体积下球形表面积最小），因此体现的是表面张力原理。\nB项正确，毛细作用是液体表面对固体表面的吸引力。当毛细管插入浸润液体中，管内液面上升，高于管外液面；毛细管插入不浸润液体中，管内液体下降，低于管外液面。植物根部毛细管从土壤中吸水，利用的是毛细现象，而毛细现象本质上是液体表面张力与附着层分子相互作用力共同作用的结果，核心原理是表面张力。\nC项错误，眼镜镜片的表面镀膜防蓝光，利用的是光的干涉原理。镜片表面镀多层纳米级光学薄膜，蓝光入射时，在膜层上表面与下表面分别反射，两束反射光相位相反、发生相消干涉，大幅降低蓝光透过率。与表面张力无关。\n本题为选非题，故正确答案为C。","no":14,"missingImage":false}],"count":6,"answerable":6,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"16070155","cat":"逻辑填空","stem":"当前人类已全面进入知识经济时代，高质量发展越来越依靠知识和创新。教育强国、科技强国、人才强国具有共生性，            。科技强国要求高科技自立自强，成为世界主要科学中心；人才强国要求提高自主培养质量，成为世界重要人才中心。科技和人才离不开高质量教育体系，因此“三大强国”的统筹部署有利于支撑“两个中心”建设。\n填入画横线部分最恰当的一项是：","options":{"A":"异曲同工","B":"同气连枝","C":"同日而语","D":"同声相应"},"answer":"B","explanation":"根据“教育强国、科技强国、人才强国具有共生性”“科技强国要求高科技自立自强，成为世界主要科学中心；人才强国要求提高自主培养质量，成为世界重要人才中心。科技和人才离不开高质量教育体系”可知，横线处应体现三者互相离不开、联系紧密之意。B项“同气连枝” 比喻同胞的兄弟姐妹，现引申为彼此的关系很密切，互相依存，符合文意，当选。A项“异曲同工”指不同的做法收到同样效果，并未体现三者关系紧密之意，排除；C项“同日而语”指放在同一时间谈论，多用于否定句式，文段并未讨论时间关系，排除；D项“同声相应”指志趣、意见相同的人互相响应，自然地结合在一起，与文意不符，排除。\n故正确答案为B。\n【文段出处】华中师范大学国家教育治理研究院《教育科技人才三位一体 共同支撑高质量发展》","no":15,"missingImage":false},{"type":"question","qid":"16069963","cat":"逻辑填空","stem":"现有研究认为，虚拟孵化之所以能培育创业企业，是基于网络聚集了人力和资本资源，帮助创业企业实现了资源        。事实上，无论是传统孵化还是虚拟孵化，提供资源是孵化平台帮助创业企业克服新生        、获取竞争优势的重要方式。\n依次填入画横线部分最恰当的一项是：","options":{"A":"汇聚 颓势","B":"聚积 弱势","C":"聚拢 态势","D":"聚合 劣势"},"answer":"D","explanation":"本题可从第二空入手，根据文意及顿号可知，横线处所填词语与“新生”搭配且与后文的“优势”构成反义并列关系，表达创业企业处于新生阶段，面临着竞争中的不利条件或不足之处之意。B项“弱势”指力量弱小的地位或状态，D项“劣势”指在力量或态势上处于比对方不利的条件或地位，置于此处都能表达出新生企业在竞争中相对不利的状况，符合文意，保留。A项“颓势”指衰败、没落的趋势或形势，通常用于描述事物已经出现明显的衰败迹象，但新生企业处于起步和成长初期，只是相对基础薄弱、竞争力不足，而非已呈现出衰败的趋势，与文意不符，排除；C项“态势”指状态和形势，为中性词，无法体现出新生企业面临的不利状况，排除。\n第一空，搭配“资源”，且根据文意可知，横线处词语表示因网络聚集了人力和资本资源为创业企业带来的积极作用，应与前文的“聚集”在语义上构成对应。D项“聚合”指聚集并结合，强调不仅集中，还能整合为一体，常搭配“资源”，能很好地体现虚拟孵化将人力和资本资源整合为一个有机整体的过程，符合文意，当选。B项“聚积”强调的是通过长时间的积累使数量增多，常搭配“财富”“物资”等，侧重于积累的过程，而文段强调的是虚拟孵化借助网络对人力和资本资源进行整合，并非单纯数量上的积累，与文意不符，排除。\n故正确答案为D。\n【文段出处】知网《虚拟孵化对创业企业数字化的使能机理：组织学习视角的案例研究》","no":16,"missingImage":false},{"type":"question","qid":"16069931","cat":"逻辑填空","stem":"在一般印象里，香水是比较晚近的舶来品，但这里的“香水”指的是发展成熟的香精香水。20世纪初，香港的广生行和上海中西大药房        引进了淡香精香水“佛罗里达水”，借用欧阳修词中“花露重，草烟低，人家帘幕垂”的句子，命名为“花露水”。这种淡绿色香水主要使用玫瑰与麝香香精，在此后数十年里        中国，是中国最流行的香调。所以，有人将花露水称为中国最早的香水，也不能说没有依据。\n依次填入画横线部分最恰当的一项是：","options":{"A":"先后 遍及","B":"率先 风靡","C":"抢先 享誉","D":"分别 席卷"},"answer":"B","explanation":"第一空，根据“在一般印象里，香水是比较晚近的舶来品”“有人将花露水称为中国最早的香水”可知，横线处要体现出香港的广生行和上海中西大药房在较早的时候就引进了香水，B项“率先”指带头，首先，C项“抢先”指赶在别人前头，争先，均符合文意，保留。A项“先后”指前后相继，侧重香港的广生行和上海中西大药房这两家引进香水的先后顺序，D项“分别”指分头，各自，均与文意不符，排除。\n第二空，根据“是中国最流行的香调”可知，横线处要体现出花露水在此后数十年里很流行之意，B项“风靡”指草木随风而倒，形容事物很风行，符合文意，当选。C项“享誉”指在社会上取得声誉，以此体现其品质好口碑好之意，而文段仅仅表达流行之意，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《中国古代的“香水”》","no":17,"missingImage":false},{"type":"question","qid":"16069947","cat":"逻辑填空","stem":"史诗类电视剧可以被视为一种文化记忆的        ，其目的不仅是呈现特定时期的历史社会文本，而且也是向观众传递镌刻在历史中的社会价值和思想观念。经由历史重现，向观众传递正确的社会价值和思想观念，是史诗类电视剧创制的            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"表现 金科玉律","B":"投影 玉圭金臬","C":"展示 不二之选","D":"再现 应有之义"},"answer":"D","explanation":"第一空，横线处形容“史诗类电视剧”与“文化记忆”之间的关系，根据横线后“呈现特定时期的历史社会文本”可知，横线处应体现出“史诗类电视剧”能够把文化记忆呈现、还原出来之意，A项“表现”意为表示出来，C项“展示”指清楚地摆出来、明显地表现，D项“再现”指（过去的事情）再次出现，均符合文意且与“文化记忆”搭配恰当，保留。B项“投影”意为投射在一个面或一条线上的物体的影子或图形，比喻甲事物在乙事物上面表现出来的迹象，文段并无“投射”之意，排除。\n第二空，根据横线前“也是向观众传递镌刻在历史中的社会价值和思想观念”及“向观众传递正确的社会价值和思想观念”可知，横线处应体现“史诗类电视剧”应该通过其创作向观众传达正确的社会价值和思想观念之意，D项“应有之义”指应该有的义理，符合文意，当选。A项“金科玉律”比喻必须遵守、不能变更的信条，具有强制性和权威性，置于此处程度过重，排除；C项“不二之选”意为没有比这个选择更好的了，文段并无“选择”的语境，与文意不符，排除。\n故正确答案为D。\n【文段出处】光明日报《在酸甜苦辣中向阳而生》","no":18,"missingImage":false},{"type":"question","qid":"16070307","cat":"逻辑填空","stem":"考古学的早期实践是自然史的延伸，就是以进化模式来安排考古材料。人类的历史和文化被看作是一种        的过程，世界各地的文化发展遵循相同的轨迹，文化差异是由发展速率的快慢所造成。这种直线进化论存在明显弱点，导致种族主义考古学        ，把原住民文化看作生物学因素造成的        现象，无法发展到更高级的阶段。\n依次填入画横线部分最恰当的一项是：","options":{"A":"自然 泛滥 滞后","B":"加速 盛行 反常","C":"累进 流行 落后","D":"演变 胜出 极端"},"answer":"C","explanation":"第一空，根据“以进化模式来安排考古材料”“文化差异是由发展速率的快慢所造成”“这种直线进化论”可知，横线处应体现不断进化之意。C项“累进”指以一定方式逐步增加，D项“演变”指发展变化，均符合文意，保留。A项“自然”指自由发展，不受外界干预，侧重自发产生，无法体现进化之意，与文意不符，排除；B项“加速”指加快速度，与文意不符，排除。\n\n第二空，根据文意可知，横线处应体现种族主义考古学比较盛行之意，C项“流行”指广泛传布、盛行，可以体现种族主义考古学比较盛行之意，符合文意，保留。D项“胜出”指在比赛或竞争中胜过对手，文段并未体现战胜对手之意，与文意不符，排除。\n第三空，代入验证。根据“无法发展到更高级的阶段”可知，横线处应体现水平较低、不高级之意，C项“落后”指不先进，符合文意，当选。\n故正确答案为C。\n【文段出处】齐鲁学刊《考古学如何重建上古史》","no":19,"missingImage":false},{"type":"question","qid":"16069949","cat":"逻辑填空","stem":"托育服务是由3岁以下婴幼儿的法定监护人之外的人或机构，在特定时间内进行的一种组织化、系统化的照顾服务活动。在现代社会中，妇女外出就业造成的亲职抚育困境愈发        。家庭结构的小型化也造成婴幼儿照顾的代际支持        ，加之年轻父母对婴幼儿照护要求的精细化，托育服务作为一种          儿童福利，越来越成为城市工薪家庭的重要选择。\n依次填入画横线部分最恰当的一项是：","options":{"A":"突出 薄弱 辅助性","B":"明显 短缺 基础性","C":"普遍 不足 补充性","D":"典型 欠缺 支持性"},"answer":"C","explanation":"第一空，搭配“亲职抚育困境”“愈发”，A项“突出”指超过一般地显露出来，B项“明显”指清楚地显露出来，容易让人看出或感觉到，C项“普遍”指广泛而有共同性，均与“亲职抚育困境”“愈发”搭配恰当，保留。D项“典型”指具有代表性的人或事物，与“愈发”搭配不当，且文段未提及该困境代表了什么样的人或事物，排除。\n第二空，搭配“代际支持”，根据“托育服务作为一种······儿童福利，越来越成为城市工薪家庭的重要选择”可知，横线处所填词语应体现代际支持不够之意，B项“短缺”指缺乏，不足，C项“不足”表示数量或程度上的不充分，无法满足需求，均符合文意且搭配恰当，保留。A项“薄弱”指容易破坏或动摇，不雄厚，不坚强，一般搭配“兵力”“基础”“意志”，与“代际支持”搭配不当，排除。\n第三空，根据“托育服务是由3岁以下婴幼儿的法定监护人之外······系统化的照顾服务活动”可知，横线处所填词语应体现托育是额外的支持之意，C项“补充性”指因不足或损失而加以添补的，符合文意，当选。B项“基础性”指基本的，与文意不符，排除。\n故正确答案为C。\n【文段出处】学术论坛期刊《我国托育服务的社区化转向：逻辑与路径》","no":20,"missingImage":false},{"type":"question","qid":"16070308","cat":"逻辑填空","stem":"人工智能技术飞速发展，逐渐向人类智能水平逼近。科学家们在研究过程中愈发清晰地意识到，许多棘手的问题并非单凭一家公司之力就能成功解决。除了至今            的“电车难题”外，还有日益重要的价值观        问题——当AI拥有了自主设定目标的能力时，又该如何确保这些由AI自行确定的目标符合人类利益、与人类价值观相        ？\n依次填入画横线部分最恰当的一项是：","options":{"A":"争论不休 构建 吻合","B":"流口常谈 践行 出入","C":"悬而未决 对齐 契合","D":"束手无策 匹配 切合"},"answer":"C","explanation":"第一空，搭配“电车难题”，且根据“许多棘手的问题并非单凭一家公司之力就能成功解决”可知，横线处所填成语应表达“电车难题”至今没有解决之意，C项“悬而未决”指一直拖在那里，没有得到解决，符合文意，保留。A项“争论不休”比喻双方或多方对某一个问题各执一端，讨论不出最终的结果，谁也不肯停下来，B项“流口常谈”指人人挂在嘴上的老话，均无法体现没有解决之意，排除；D项“束手无策”形容遇到问题时毫无解决的办法，程度过重，且主语通常为人，一般表述为“令人束手无策的‘电车难题’”，排除。\n第二空，代入验证。搭配“价值观”，C项“对齐”指的是使两个或多个事物在位置、方向或功能上达到整齐、一致或协调的状态，与“价值观”搭配恰当，保留。\n第三空，代入验证。根据“、”可知，横线处所填词语与“符合”意思接近，C项“契合”指投合，符合，符合文意，当选。\n故正确答案为C。\n【文段出处】微信公众号：中国战略新兴产业《从互撕到约谈：马斯克与奥特曼的“AI冷战”突然破冰？》","no":21,"missingImage":false},{"type":"question","qid":"16069925","cat":"片段阅读","stem":"目前，以京津冀、长三角、粤港澳大湾区、成渝、中部地区城市群为核心的快递枢纽集群建设已基本成形，全球性国际寄递中心、境外地面网络和海外仓加快建设，农村寄递服务网络实现下乡进村，宅递、箱递、站递等多元化末端服务体系初步形成。我国快递业拥有专业物流园区400多个，营业网点41.3万处，快递运输汽车27万多辆，全货机近200架。重点城市群内快件1日达、国内重点城市间次日达已成为常态。\n这段文字意在说明：","options":{"A":"我国快递业通过完善基础设施推动了城乡寄送服务均衡发展","B":"我国快递业将聚焦全球寄递网络建设以提升国际运输时效","C":"我国快递业依托“枢纽+网络”建设实现了物流及寄递能力全面发展","D":"我国快递业在农村寄递网络建设及寄递时效提升上成效显著"},"answer":"C","explanation":"文段开篇指出“以城市群为核心的快递枢纽集群”已基本建设成形，随后指出“全球性国际寄递中心、境外地面网络和海外仓”加快建设、“农村寄递服务网络”实现下乡进村。接下来通过列数据的形式说明我国快递业物流能力显著增强，进而提升了寄递能力。故文段通过并列结构说明快递业依托枢纽集群与地面网络，提升了物流能力和寄递能力，对应C项。\nA项“城乡”、B项“全球寄递网络”、D项“农村”均仅对应文段部分内容，文段提及我国快递业覆盖城市与农村，同时“全球性国际寄递中心、境外地面网络和海外仓”也加快建设，表述片面，排除。\n故正确答案为C。\n【文段出处】求是网《更好发挥快递业引领作用 有效降低全社会物流成本》","no":22,"missingImage":false},{"type":"question","qid":"16069968","cat":"片段阅读","stem":"普惠金融体系面临的重要挑战之一是服务对象存在标准化数据少、个体风险高、抵押品少、个性化需求多等特征，因此发展普惠金融需要不同类型的金融机构和企业共同分担风险和损失，比如融资担保等风险共担机制即为解决上述问题的一种手段，不过费用设计、合作模式等都有待于进一步创新。\n这段文字意在说明：","options":{"A":"普惠金融体系费用设计和合作模式亟待创新","B":"普惠金融体系建设要逐步拓宽金融服务领域","C":"普惠金融体系建设有必要完善风险共担机制","D":"普惠金融体系面临来自服务对象的多重挑战"},"answer":"C","explanation":"文段首先介绍了普惠金融体系面临的一大重要挑战，为问题引入。随后以“因此”+“需要”引导对策“发展普惠金融需要不同类型的金融机构和企业共同分担风险和损失”，并以“比如”引导举例论证，结尾处虽出现转折词“不过”，但其引导的“费用设计、合作模式等都有待于进一步创新”实为对风险共担机制的具体完善。所以中心句仍为“因此”引导的对策句，对应C项。\nA项，对应文段尾句对“风险共担机制”补充说明的内容，非文段重点，且C项既包含文段的核心对策“风险共担机制”，又通过“有必要完善”概括了“费用设计、合作模式等都有待于进一步创新”，更为全面完整，故排除A项；\nB项，“逐步拓宽金融服务领域”文段未提及，无中生有，排除；\nD项，“面临来自服务对象的多重挑战”为问题表述，非重点，排除。\n故正确答案为C。\n【文段出处】《建设高质量普惠金融体系：目标任务、发展实践和挑战应对》","no":23,"missingImage":false},{"type":"question","qid":"16069966","cat":"片段阅读","stem":"市场是实现资源优化配置的有效手段，建设全国统一大市场是构建新发展格局的基础支撑。只有加快建设全国统一大市场，彻底破除地方保护和市场分割等造成的经济大循环中的堵点、卡点、断点，促进商品要素资源在更大范围畅通流动和高效配置，才能充分发挥我国超大规模市场优势，推动我国市场由大到强，进一步促进科技创新和产业升级，增强产业链供应链韧性，推动经济高质量发展。\n这段文字意在说明：","options":{"A":"应尽快实现资源的优化配置","B":"要加快建设全国统一大市场","C":"要充分发挥我国的市场优势","D":"必须彻底破除地方保护主义"},"answer":"B","explanation":"文段开篇通过“基础支撑”指出建设全国统一大市场对构建新发展格局的重要性，接着通过“只有······才······”强调要加快建设全国统一大市场，指出其对于发挥我国市场优势、推动经济高质量发展等方面的重要作用。故文段重在强调要加快建设全国统一大市场，主题词为“全国统一大市场”，对应B项。\nA项，“实现资源优化配置”对应文段首句，为引入话题的部分，非重点，且偏离文段核心话题“全国统一大市场”，排除；\nC项，“发挥我国市场优势”对应“才”之后的内容，是建设全国统一大市场带来的意义，非重点，排除；\nD项，偏离文段核心话题“全国统一大市场”，且“破除地方保护主义”属于具体举措之一，非重点且表述片面，排除。\n故正确答案为B。\n【文段出处】经济日报《建设统一大市场需坚持问题导向》","no":24,"missingImage":false},{"type":"question","qid":"16069878","cat":"片段阅读","stem":"智能社会的演进模糊了社会心态与社会行为的边界，呈现出线上线下虚实共生、心态风险与行动风险交织缠绕的特征，这对社会心态的治理策略与治理工具提出了新的挑战。社交软件的分享机制与算法推荐规律，都以对人类心理特征的精准利用为前提。此类技术往往把复杂的人类互动过程简化为点赞、转发等二元化的态度立场或简单行为，虽然便利了个体表达观点，却可能导致网络行为高度两极化，让许多事实错误但情绪饱满的虚假信息快速传播，成为网络空间治理的一大顽疾。\n这段文字意在强调：","options":{"A":"智能社会对社会心态治理提出了新的挑战","B":"智能化加速了从社会心态到社会行为的转化","C":"社交软件的算法可能导致网络行为高度两极化","D":"智能社会当务之急是要加强网络空间治理"},"answer":"A","explanation":"文段开篇介绍了智能社会演进所呈现的特征，并指出这对社会心态的治理提出了新挑战。随后指出社交软件的分享机制与算法推荐规律会简化人类的互动行为，导致网络行为高度两极化，让虚假信息传播，成为网络空间治理的一大顽疾，即对前文进行了解释说明。故文段重点在首句，强调智能社会的演进对社会心态治理提出了新挑战，对应A项。\nB项，“加速了从社会心态到社会行为的转化”无中生有，文段未提及，排除；\nC项，“可能导致网络行为高度两极化”对应分述句部分，非重点，且缺少文段主题词“智能社会”，排除；\nD项，文段的问题是“智能社会对社会心态的治理提出新挑战”，若想提对策，也应该是针对“社会心态”，“要加强网络空间治理”偏离文段核心，对策不具备针对性，排除。\n故正确答案为A。\n【文段出处】光明日报《以“智”臻“善”：社会心态治理的发展趋势》","no":25,"missingImage":false},{"type":"question","qid":"16069876","cat":"片段阅读","stem":"人形机器人的传感器像是人类的眼睛、耳朵和皮肤，扮演着感知器官的角色。视觉传感器通过摄像头捕捉环境图像；声音传感器接收并解析语音指令；力觉传感器仿效人体的力觉感受，精确感知与外界的接触力；触觉传感器模仿人类触觉，精准感知物体的形状和硬度。控制系统是人形机器人的大脑，借助计算单元和智能算法处理数据并作出决策。多种智能算法的应用让机器人越来越接近人类，比如利用深度神经网络，处理视觉、语音识别等任务。\n根据这段文字，对“人形机器人的设计原理”概括最准确的是：","options":{"A":"借助多功能传感器实现智能化处理","B":"仿生学与机械工程的有机融合","C":"赋予精准触觉，提升感知能力","D":"传感技术与控制理论的集成突破"},"answer":"D","explanation":"文段首先指出人形机器人的传感器扮演感知器官的角色，并具体介绍视觉、声音、力觉和触觉传感器的作用。随后指出控制系统如同人类大脑，借助计算单元和智能算法处理数据并作出决策，并说明智能算法的应用使其更接近人类。故文段为并列结构，从传感器与控制系统两个角度论述了人形机器人的设计原理，对应D项。\nA项“多功能传感器”、C项“触觉”和“提升感知能力”均仅对应传感器部分，未提及“控制系统”，表述片面，排除；\nB项，“机械工程”文段未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】人民日报《探索人形机器人的奥秘（开卷知新）》","no":26,"missingImage":false},{"type":"question","qid":"16069943","cat":"片段阅读","stem":"晚安牛奶的最大卖点在于“高褪黑素含量”。有品牌标明“褪黑素含量：12500pg/盒”，1pg等于万亿分之一克。而褪黑素的有效剂量在0.1~0.3毫克，这意味着需要喝约8000盒这种牛奶才能达到治疗剂量，因此晚安牛奶助眠更依赖于其安慰剂效应。如果某人有轻微的失眠困扰，还达不到临床上失眠的诊断标准，又能够排除器质性或精神疾病因素导致的失眠，个体比较相信晚安牛奶，或者喝后有效，在这种有益无害的前提下，不妨食用。\n这段文字意在强调：","options":{"A":"晚安牛奶的助眠效果主要源自心理作用","B":"晚安牛奶能助眠是商家的虚假宣传","C":"多喝晚安牛奶才能起到助眠作用","D":"晚安牛奶有较好的助眠效果"},"answer":"A","explanation":"文段首先通过晚安牛奶的最大卖点，引出“高褪黑素含量”话题，之后通过数据对比指出品牌标明的褪黑素含量远远达不到褪黑素的治疗剂量，随后通过结论词“因此”引出结论，即晚安牛奶助眠更依赖于其安慰剂效应。最后进行补充说明，指出在某些轻微、非器质性或精神疾病因素导致的失眠且在本人相信等情况下可以食用。故文段重在强调晚安牛奶助眠效果的真正来源是安慰剂作用，即心理作用，对应A项。\nB项，“商家的虚假宣传”文段并未提及，无中生有，排除；\nC项，“多喝晚安牛奶才能起到助眠作用”非重点，虽然文段提到“需要喝约8000盒”，但这只是为了证明晚安牛奶的褪黑素含量低，排除；\nD项，“晚安牛奶有较好的助眠效果”偏离重点，文段重点强调“晚安牛奶的助眠效果主要靠安慰剂作用”，排除。\n故正确答案为A。\n【文段出处】中华网《网红“晚安牛奶”真能助眠吗？医生：喝8000瓶才有效》","no":27,"missingImage":false},{"type":"question","qid":"16069894","cat":"片段阅读","stem":"在深度学习的过程中，实际确定误差并非易事。为解决这一问题，当前深度学习领域应用“损失函数”实现误差最小化，即在人工智能的学习过程中，找到能够最小化损失函数值的参数。但损失函数的形式会随具体情况而有所不同，难以全面掌握其特性，因此需要引入微分。微分主要用于分析某个变量的变化如何影响函数的值。通过对损失函数进行微分，可以明了参数变化时损失函数值的变化，进而调整参数值，让损失函数的值尽可能小。在针对性地进行编程后，人工智能能够自动完成上述任务。\n对这段文字概括最恰当的是：","options":{"A":"通过对损失函数进行微分，深度学习能实现误差最小化","B":"引入微分后，损失函数能帮助人工智能实现自主深度学习","C":"损失函数在深度学习中主要用于确定误差","D":"损失函数对深度学习的参数优化具有重要意义"},"answer":"A","explanation":"文段开篇介绍在深度学习过程中确定实际误差并非易事，接下来指出用“损失函数”实现误差最小化，随后“但”转折引出损失函数形式会随具体情况而有所不同，难以全面掌握其特性，紧接着通过“因此”强调需要引入微分，后文继续说明对损失函数微分能明确参数变化对损失值的影响，进而调整参数值让损失函数的值尽可能小，且进行针对性编程后人工智能就可自动完成任务。故文段核心在于对损失函数进行微分能帮助深度学习实现误差最小化，对应A项。\nB项，文段重点是“误差最小化”，并非“实现自主深度学习”，偏离文段中心，排除；\nC、D两项，均缺少“微分”这一主题词，偏离文段中心，排除。\n故正确答案为A。","no":28,"missingImage":false},{"type":"question","qid":"16069964","cat":"片段阅读","stem":"斑翅果蝇的雌虫会在多种软皮水果中产卵，其幼虫在果实内取食，导致水果腐烂。近日，科研人员利用“基因剪刀”技术将影响斑翅果蝇性别发育的基因修改成让雌虫无法正常产卵但对雄虫无影响的版本后，斑翅果蝇的绝大多数后代都会继承这个基因变化，实现基因驱动。科学家认为，人为实现基因驱动，让特定基因在生物群体中传播开来，可以控制有害生物的数量或增强濒危物种的抗病能力。此前已有研究团队用相关方法消灭传播疟疾的蚊子，此次用于斑翅果蝇这种农业害虫尚属首次。\n这段文字主要介绍了：","options":{"A":"“基因剪刀”技术是一项高效的抗虫害技术","B":"“基因剪刀”技术增强了濒危物种的抗病能力","C":"通过基因驱动可以控制有害生物的数量","D":"研究人员用“基因剪刀”技术对抗斑翅果蝇"},"answer":"D","explanation":"文段首先指出斑翅果蝇雌虫产卵会危害软皮水果，接着说明科研人员用“基因剪刀”技术修改其性别发育基因，实现基因驱动，随后介绍基因驱动具有控制有害生物数量或增强濒危物种抗病能力的作用，尾句进一步强调，此次将该技术用于斑翅果蝇这种农业害虫是首次尝试。故文段围绕“基因剪刀”技术与“斑翅果蝇”展开，重点强调研究人员运用“基因剪刀”技术对抗斑翅果蝇这一具体研究，对应D项。\nA项，“高效的抗虫害技术”侧重对技术本身的属性评价，但文段并未提及该技术是否“高效”，且文段核心是介绍该技术针对斑翅果蝇的具体应用实践，选项缺少文段主题词“斑翅果蝇”，偏离文段重点，排除；\nB项，“增强了濒危物种的抗病能力”仅为“基因剪刀”技术实现基因驱动后可能带来的效果之一，并非文段所阐述的核心内容，表述片面且非重点，且缺少文段主题词“斑翅果蝇”，排除；\nC项，“控制有害生物的数量”仅为基因驱动可能带来的效果之一，并非文段所阐述的核心内容，表述片面且非重点，且缺少文段主题词“基因剪刀”技术与“斑翅果蝇”，排除。\n故正确答案为D。\n【文段出处】新华网《美国研究用“基因剪刀”对抗农业害虫斑翅果蝇》","no":29,"missingImage":false},{"type":"question","qid":"16070239","cat":"片段阅读","stem":"当人们将光照程度作为城市发达程度的衡量标准时，大都市的星光也正在“黯淡消失”。曾几何时，夜晚璀璨的星空带给人无限的遐思，但是随着城市化进程的加快，越来越多生活在城市里的人发现，星星似乎“消失不见”了。天文学家表示，近年来光污染状况迅速恶化，超过三分之一的人类看不到夜空中明亮的银河。发光二极管和其他形式的照明正以惊人的速度照亮夜空。由于光污染的加剧，20年后人类可能无法看到夜晚的星空。\n最适合做这段文字标题的是：","options":{"A":"星光黯淡：寻找消失的星星","B":"光污染：亮了城市，暗了星空","C":"星星点灯：照不亮城市的夜空","D":"光污染：让星星们“无处可藏”"},"answer":"B","explanation":"文段开篇介绍人们将光照程度作为衡量城市发达程度的标准，同时大都市的星光在“黯淡消失”，接着指出随着城市化进程加快，城市的星星似乎“消失不见”了。后文通过天文学家的观点，强调城市光污染状况迅速恶化，部分人类已经看不到夜空中明亮的银河，最后指出未来人类可能看不见夜晚的星空，故文段整体围绕“光污染”展开，介绍其照亮城市的同时也“暗淡”了星空，对应B项。\nA项，未提及核心话题“光污染”，且“寻找消失的星星”文段并未提及，无中生有，排除；\nC项，未提及核心话题“光污染”，且“星星点灯”文段并未提及，无中生有，排除；\nD项，“无处可藏”与文意相悖，且缺少对城市的影响，表述片面，排除。\n故正确答案为B。\n【文段出处】中国科学报《光污染：亮了城市，暗了星空》科技日报《光污染或致20年后难见星空》","no":30,"missingImage":false},{"type":"question","qid":"16069897","cat":"片段阅读","stem":"绿色供应链是一种在整个供应链中综合考虑环境影响和资源效率的现代管理模式。它以绿色制造理论和供应链管理技术为基础，涉及供应商、生产商、销售商、消费者和回收商，目的是使产品从物料获取、加工、包装、仓储、运输、使用到报废处理的整个过程，对环境影响最小，资源利用率最高。资源材料是绿色供应链的基础，其可持续性供给是实现绿色供应链的根本条件。\n根据这段文字，可以推出的是：","options":{"A":"传统供应链对环境影响的关注度较低","B":"应用绿色供应链，生产商和供应商最为关键","C":"绿色供应链的核心目标是增强可持续发展","D":"若资源材料供给不可持续，绿色供应链则难以实现"},"answer":"D","explanation":"A项，文段仅介绍了绿色供应链“综合考虑环境影响”，未提及传统供应链对环境影响的关注度，无中生有，排除；\nB项，根据“它以绿色制造理论和供应链管理技术为基础，涉及供应商、生产商、销售商、消费者和回收商”可知，“生产商和供应商最为关键”表述过于绝对，排除；\nC项，根据“目的是使产品从物料获取、加工、包装、仓储、运输、使用到报废处理的整个过程，对环境影响最小，资源利用率最高”可知，“核心目标是增强可持续发展”表述错误，排除；\nD项，根据“资源材料是绿色供应链的基础，其可持续性供给是实现绿色供应链的根本条件”可知，若资源材料供给不可持续，作为根本条件缺失，绿色供应链则难以实现，表述正确，当选。\n故正确答案为D。\n【文段出处】中国知网《打造绿色供应链 如何让电机“转”得更省》","no":31,"missingImage":false},{"type":"question","qid":"16070287","cat":"片段阅读","stem":"20世纪中叶，分子生物学诞生，开启了在分子水平上研究生命及其活动的现代生命科学时代。这个时期的研究者采用“碎片化”的模式来研究生命及其生理或病理活动。但是，研究者逐渐认识到，生命活动并非是由一个个基因或蛋白质“零件”独立完成的，而是建立在生命体内众多基因、蛋白质和其他化学小分子形成的复杂相互作用之上；对于高等生物而言，除了分子层面复杂的相互作用网络外，还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用。\n根据这段文字，可以推出：","options":{"A":"生命活动是一种复杂系统的整体行为","B":"低等生物的生命活动由基因独立完成","C":"分子层面的研究是理解高等生物的关键","D":"现代科学主要采用“碎片化”模式研究生命活动"},"answer":"A","explanation":"A项，根据“生命活动并非是由一个个基因或蛋白质‘零件’独立完成的，而是建立在生命体内众多基因、蛋白质和其他化学小分子形成的复杂相互作用之上······还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用”可知，表述正确，当选；\nB项，根据“生命活动并非是由一个个基因或蛋白质‘零件’独立完成的”可知，文段是一个普遍性的陈述，并未区分低等生物和高等生物，尽管后文提及高等生物有额外的介观层面相互作用，但并不意味着低等生物的生命活动可以由基因独立完成，无中生有，排除；\nC项，根据“除了分子层面复杂的相互作用网络外，还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用”可知，除了“分子层面的研究”，还存在“细胞、组织和器官等不同介观层面”，未提及分子层面的研究是理解高等生物的“关键”，偷换逻辑，排除；\nD项，根据“20世纪中叶，分子生物学诞生······这个时期的研究者采用‘碎片化’的模式来研究生命及其生理或病理活动”和“但是，研究者逐渐认识到，生命活动并非是······”可知，20 世纪中叶使用了“碎片化”的模式，后来研究者逐渐认识到该模式的弊端，故无法得出现代科学“主要采用”“碎片化”模式研究生命活动，排除。\n故正确答案为A。\n【文段出处】中国网《生命大科学：从微观到介观的组学研究》","no":32,"missingImage":false},{"type":"question","qid":"16069930","cat":"片段阅读","stem":"在我国，对农业生产造成重大危害的多数昆虫都具有迁飞性。草地贪夜蛾、黏虫等具有“春夏北迁，秋冬南迁”的习性。由于昆虫个体小、重量轻，飞行能力有限，远距离迁飞主要借助气流运载。季风、台风、西太平洋副热带高压的位置与强度变化等因素都会对害虫的迁飞扩散产生重要影响。每年春夏，害虫大军从中南半岛等地随西南季风迁飞入我国，之后又随西南季风或东南季风暖湿气流继续北上。到了秋冬，草地贪夜蛾、黏虫等为逃避低温环境，只好迁回温暖的南方。这是昆虫逃避不良环境条件的一种生存对策。\n这段文字重在说明害虫大军迁飞的：","options":{"A":"地域密码","B":"季节规律","C":"环境影响","D":"生存策略"},"answer":"B","explanation":"文段开篇引出话题“多数昆虫都具有迁飞性”，随后提出观点，草地贪夜蛾、黏虫等具有“春夏北迁，秋冬南迁”的习性，即害虫大军迁飞的季节规律。后文对其进行原因解释，从季风、台风、西太平洋副热带高压的位置与强度变化等因素具体论述如何影响其迁飞的季节规律，文段最后一句通过“这”对前文“逃避低温环境”进行补充说明。故文段重在说明害虫大军迁飞的季节规律，对应B项。\nA项“地域密码”文段并非重点描述，虽然提及南北方，但“春夏北迁，秋冬南迁”重点是强调季节的规律，排除；\nC项“环境影响”对应“季风、台风、西太平洋副热带高压的位置与强度变化等因素”，为原因解释部分内容，非重点，排除；\nD项“生存策略”出现在尾句，是对“逃避低温环境”进行的补充说明，并非全文重点，排除。\n故正确答案为B。\n【文段出处】中国农业科学院植物保护研究所《一探究竟 “虫军”迁飞的气象“密码”》","no":33,"missingImage":false},{"type":"question","qid":"16069948","cat":"语句表达","stem":"如今，网络和数字媒介已成为未成年人生活的基本环境。短视频以沉浸式体验让他们轻松获得各种热点、热梗和表情包，“老铁”“666”等迅速进入他们的话语体系，甚至成为特定圈层的身份标识。在各大社交媒体上，家长们担心“孩子不好好说话”，老师们交流“如何引导学生正确用语”。诙谐幽默的网络语言在丰富人类表达的同时，                    。在“人机共生”时代，如何培育未成年人的语言文化素养值得重视。\n填入画横线处最恰当的是：","options":{"A":"也成为人们理解文化和世界的重要方式","B":"也对原有规范的语言文化体系造成冲击","C":"更需要思考机器智能环境下的文化素养提升问题","D":"越来越多的人感受到“文字失语”的困扰"},"answer":"B","explanation":"本题为语句填空题，横线在文段中间，需结合前后文进行分析。文段开篇指出各种网络语言进入了未成年人的话语体系，但与此同时，家长与老师对此种现象表示了担心并给予正确引导。可知，网络语言虽丰富了人类的表达，但仍有负面影响。B项中“对原有规范的语言文化体系造成冲击”准确对应概括了前文中“不好好说话”“引导学生正确用语”等问题，并且与后文“重视如何培育未成年人语言文化素养”这一对策高度契合，当选。\nA项，“理解文化和世界”文段并未提及，无中生有，排除；\nC项，缺少文段核心话题“语言”，且“机器智能”文段并未提及，无中生有，排除；\nD项，“文字失语”指因网络文化和流行语的影响，导致语言表达能力下降的现象，但横线之前强调“丰富人类表达”，与前文语义矛盾，无法衔接，排除。\n故正确答案为B。\n【文段出处】《“人机共生”时代更须注重语言规范》","no":34,"missingImage":false},{"type":"question","qid":"16069873","cat":"片段阅读","stem":"“低空风怪”也叫下击暴流，是一股从雷暴云中快速下沉的强烈气流。如同瀑布一泻千里直击山石，“风怪”在触及地面后向四周爆发出强大的冲击力。当“风怪”呼啸而下时，速度最高可达每秒100米，比高铁还快。不仅如此，它还会在低空形成猛然四散的强风，击中地面时爆发出的水平风力最大可达17级，足以掀翻火车、轮船。“风怪”造成的大风会在几百米内风向突变，对飞机起降危害很大。\n接下来作者最有可能讲述的是：","options":{"A":"“低空风怪”的定义及其特征","B":"“低空风怪”威力强、危害大","C":"能否对“低空风怪”作出预警","D":"“低空风怪”与龙卷风的差异"},"answer":"C","explanation":"本题为接语选择题，需要在通读全文的基础上，重点关注文段最后讨论的核心话题。文段开篇引出“低空风怪”这一话题，随后分别论述了其冲击力强、风速快、风力大的特点，尾句强调“低空风怪”的危害，即对飞机起降危害性很大。故下文应该继续围绕“低空风怪”的危害性进一步延伸，最有可能探讨预警“低空风怪”的相关话题，C项当选。\nA项“‘低空风怪’的定义及其特征”与B项“‘低空风怪’威力强、危害大”均为前文已论述过的内容，后文不会再次论述，排除；\nD项，“龙卷风”文段并未提及，与前文衔接不当，排除。\n故正确答案为C。\n【文段出处】光明网·文摘报《降服“低空风怪”》","no":35,"missingImage":false},{"type":"question","qid":"16070179","cat":"片段阅读","stem":"一年中的大部分时间，成年棕熊都是离群索居的动物。但当大量鲑鱼洄游到湖中繁殖时，常常会有几十头棕熊同时聚集在湖边。过高的种群密度和相对有限的理想捕鱼位置，决定了它们必须竞争进食序列。在这个巨大的“餐桌”周围，进食的座次是由实力来决定的，成年公熊之间常常为了争夺捕鱼位置在湖畔发生激烈打斗，胜者赢得一切。在这个时期，湖畔通常是被雄性棕熊所占据的，当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们，幼熊易遭到撕咬而死亡。\n由这段文字无法推出：","options":{"A":"成年棕熊在争夺食物时竞争非常激烈","B":"成年棕熊的进食序列主要由实力决定","C":"鲑鱼繁殖期的湖畔对幼熊会更加危险","D":"雌熊带幼熊靠近湖畔是为了捕食鲑鱼"},"answer":"D","explanation":"A项：根据“成年公熊之间常常为了争夺捕鱼位置在湖畔发生激烈打斗”可知，符合文意，排除；\nB项：根据“在这个巨大的‘餐桌’周围，进食的座次是由实力来决定的”可知，符合文意，排除；\nC项：根据“当大量鲑鱼洄游到湖中繁殖时，······在这个时期······当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们，幼熊易遭到撕咬而死亡”可知，符合文意，排除；\nD项：文段仅指出“当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们”，但并未提及它们靠近的目的是捕食鲑鱼，无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】中国国家地理网《堪察加棕熊 为森林“运氮”的鲑鱼猎手》","no":36,"missingImage":false},{"type":"question","qid":"16069944","cat":"片段阅读","stem":"近年来，一系列具有人文情怀的文化综艺类节目集体走红。在融媒体时代，文化综艺类节目如何创新成了摆在创作者面前的一道难题。创新要找到令年轻人感兴趣的点进行嫁接，但又不能丢掉主流媒体的审美、价值观和社会责任。文化综艺的创新，应该走文化传统和现代时尚相结合之路，不能脱离对传统经典文化的传承凭空打造所谓现代时尚，而是要把传统与时代精神相结合，走进人民群众最接地气的生活，在寓教于乐中让人受到启迪。\n下列选项与这段文字意思不符的是：","options":{"A":"文化综艺类节目的创新要扎根人民、扎根生活","B":"文化综艺类节目要以传承传统文化为首要目的","C":"文化综艺类节目不能流于说教而忽视其娱乐性","D":"文化综艺类节目创新要关注年轻人的精神需求"},"answer":"B","explanation":"A项，根据“走进人民群众最接地气的生活”可知，“扎根人民、扎根生活”与文意相符，排除；\nB项，根据“应该走文化传统和现代时尚相结合之路······要把传统与时代精神相结合”可知，“以传承传统文化为首要目的”文段并未提及，无中生有，当选；\nC项，根据“在寓教于乐中让人受到启迪”可知，“不能流于说教而忽视其娱乐性”与文意相符，排除；\nD项，根据“创新要找到令年轻人感兴趣的点进行嫁接”可知，“创新要关注年轻人的精神需求”与文意相符，排除。\n本题为选非题，故正确答案为B。\n【文段出处】中国文化报《文化综艺如何“玩转”传统文化？》","no":37,"missingImage":false},{"type":"question","qid":"16069928","cat":"语句表达","stem":"①一段时间里，长视频葆有一种艺术优越感，认为台网联动就是把影视作品切成片段挪到网上\n②这种长短阵营划分实际上是专业作品和民间段子的区分\n③但在当今短视频崛起的网络视频生态中，长视频不可再孤芳自赏，而应打开视野，与更多短视频及受众进行联结交流\n④剧场化不是让长视频成为网络视听阵营的“孤勇者”，而是在精品化战略基础上思考如何利用短视频为作品铺垫引流\n⑤的确，长视频是一种综合艺术，包含文学、戏剧、音乐、歌舞等多种艺术元素\n⑥网络视频原无长短之分，只因短视频的崛起，专业生产的影视作品才以长视频的概念区别于用户生产模式的短视频\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑥④①②③⑤","B":"④⑥②①⑤③","C":"⑤①②③⑥④","D":"①⑤③②④⑥"},"answer":"B","explanation":"观察选项，确定首句。①句指出长视频葆有艺术优越感及对台网联动的认识，④句对“剧场化”下定义，指出剧场化是在精品化战略基础上思考如何利用短视频为长视频作品铺垫引流，⑥句说明长短视频划分的由来，三句均可作首句，故保留A、B、D三项。⑤句以“的确”开头，“的确”指完全确实，多用于佐证前文观点，故不适合直接作首句，排除C项。\n继续观察发现，②句出现指代词“这”，可考虑指代词捆绑解题。②句核心围绕“长短视频的阵营划分”展开，前文需围绕此话题论述。观察A、B、D三项可知，②句前分别为①、③、⑥句。⑥句介绍因短视频的崛起才有了长短视频之分，与②句话题一致，可构成指代词捆绑，B项当选。①句介绍长视频葆有艺术优越感，③句介绍当下长视频的发展方向，二者均无法与②句构成指代词捆绑，排除A、D两项。\n故正确答案为B。\n【文段出处】光明日报《影视节目创作传播：长短视频互利共生》","no":38,"missingImage":false},{"type":"question","qid":"16069932","cat":"语句表达","stem":"①如今，有些文字砖在未被发现前就已经消匿了，尽量多地发现并解读文字砖，成为了钩沉历史的重要途径\n②我国古代的很多国家工程都实行“物勒工名”制\n③砖上的文字记录了长城修建者的信息，甚至还有远隔百里千里之外的地名\n④在今天河北、北京、山西等地的明长城上有一些带有文字的砖，它们被称为长城文字砖\n⑤长城文字砖上的每个文字都是史书之外的鲜活符号，为我们解锁那段历史提供了秘钥\n⑥透过文字砖，我们可以辨识出某段长城是由谁修造的，还可通过上面的地名探察明朝国防的客兵制度\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②③④⑥⑤①","B":"④⑤②⑥③①","C":"②④⑥⑤③①","D":"④③②⑥⑤①"},"answer":"D","explanation":"对比选项，确定首句。②句介绍中国古代很多国家都实行“物勒工名”这一制度，介绍“物勒工名”的背景，④句通过下定义，引出“长城文字砖”这一话题，二者均适合作为首句，无法排除选项。\n观察题干，可以发现①句、⑤句、⑥句都介绍了“长城文字砖”对解答历史的重要意义，③句介绍了长城文字砖上的文字信息。故根据行文逻辑可以判断，文段应先介绍文字砖上的信息内容，再介绍基于其具备的重要历史价值。因此③句应在①句、⑤句、⑥句之前，排除B、C两项，保留A、D两项。\n对比A、D两项发现，可通过确定③句和④句的顺序确定答案。③句介绍长城文字砖上记录的具体信息，④句通过下定义的方式引出长城文字砖的话题，应先引出文字砖的话题，再具体介绍砖上的信息内容，故④句应在③句之前，排除A项，D项当选。\n故正确答案为D。\n【文段出处】中国国家地理《透过文字砖 看明长城隐藏的历史信息》","no":39,"missingImage":false}],"count":25,"answerable":25,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"16070159","cat":"数学运算","stem":"运动心率即人体在运动时保持的心率状态，保持最佳的运动心率对于运动安全及运动效果来说都十分重要。一般来说，正常人最佳运动心率的范围是：最大运动心率=（220-年龄）×0.8次/分；最小运动心率=（220-年龄）×0.6次/分。那么正常人40岁时，最佳运动心率的范围为：","options":{"A":"108~132次/分","B":"132~144次/分","C":"108~144次/分","D":"144~176次/分"},"answer":"C","explanation":"根据题干给出的公式，当正常人40岁时，最大运动心率=（220-40）×0.8=144次/分；最小运动心率=（220-40）×0.6=108次/分。故正常人40岁时，最佳运动心率的范围为：108~144次/分。\n故正确答案为C。","no":40,"missingImage":false},{"type":"question","qid":"17467518","cat":"数学运算","stem":"某电影院即将开始检票，检票前已有人在排队。假设每人检票时间相同，且排队检票的人数均匀增加。若开一个检票口，10分钟可以检完；若开两个检票口，4分钟可以检完；若开三个检票口，则多少分钟可以检完？","options":{"A":"1.8","B":"2","C":"2.5","D":"2.8"},"answer":"C","explanation":"设检票前已有Y人排队，每分钟增加x人排队检票，每个检票口每分钟检1人。根据牛吃草公式：\u003cimg data-k=\"9f50c176dee7\">，可得：\u003cimg data-k=\"13ca385d90c4\">······①，\u003cimg data-k=\"b48e4183fc7b\">······②，联立①②两式，解得\u003cimg data-k=\"d8eabfade500\">，\u003cimg data-k=\"d945d06186ae\">。设开三个检票口，t分钟可以检完，则有\u003cimg data-k=\"2c09fc850fc1\">，解得t=2.5。\n故正确答案为C。","no":41,"missingImage":false},{"type":"question","qid":"16070160","cat":"数学运算","stem":"木星冲日，即木星、地球和太阳三者处于一条直线上，且地球位于太阳和木星之间。已知2024年12月8日发生了木星冲日，若木星绕太阳公转的周期约为12个地球年，则下一次木星冲日发生于下列哪个时间段？","options":{"A":"2025年7月~9月","B":"2026年1月~3月","C":"2026年4月~6月","D":"2026年7月~9月"},"answer":"B","explanation":"已知地球绕太阳公转的周期为1个地球年，相当于钟表的分针（短且快）；木星绕太阳公转的周期约为12个地球年，相当于钟表的时针（长且慢）。“木星冲日，即木星、地球和太阳三者处于一条直线上，且地球位于太阳和木星之间”，相当于分针和时针重合。两针角速度差为\u003cimg data-k=\"a6de9a3e197b\">圈/年，则重合周期为\u003cimg data-k=\"01cb92d0abf5\">年\u003cimg data-k=\"600da2a3d77d\">1年零33天。已知2024年12月8日发生了木星冲日，则下一次约为2026年1月10日，在B项范围内。\n故正确答案为B。","no":42,"missingImage":false},{"type":"question","qid":"16070173","cat":"数学运算","stem":"某县拟对某段运河开展河道治理。甲公司治理1米需要用时1.5天，投入5万元；乙公司治理1米需要用时2天，投入4万元。甲、乙两公司不能同时作业，若要求在365天内完成不少于200米的治理工作，则至少需要治理费用：","options":{"A":"832万元","B":"845万元","C":"860万元","D":"870万元"},"answer":"D","explanation":"根据题意要求总费用最少，则需治理总量尽量少，即完成200米的治理工作即可。又因甲公司治理费用为5万元/米，乙公司为4万元/米，要使总治理费用最低，则需乙公司治理距离尽量长。设乙公司治理x米，则甲公司治理（200-x）米，根据治理天数在365天内，可列式：\u003cimg data-k=\"c64ec555c9c9\">，解得\u003cimg data-k=\"bdbb4f17fbb9\">，x最大为130。则总治理费用最低为5×（200-130）+4×130=870万元。\n故正确答案为D。","no":43,"missingImage":false},{"type":"question","qid":"16070169","cat":"数学运算","stem":"为了节约资源，保护环境，某企业需要购买A、B两种型号的污水处理设备共8台。A型设备月污水处理能力为240吨，价格为每台12万元，B型设备月污水处理能力为160吨，价格为每台10万元，企业最多支出90万元购买设备，且要求月污水处理能力不低于1600吨。那么A型污水处理设备最多可购买：","options":{"A":"3台","B":"4台","C":"5台","D":"6台"},"answer":"C","explanation":"方法一：根据题意可得A、B两种型号的设备每万元月污水处理能力分别为\u003cimg data-k=\"ce694a08cda9\">吨、\u003cimg data-k=\"8ba04ab82e89\">吨，相同支出情况下A型设备污水处理能力更强，但A型设备价格较高，结合题目问A型污水处理设备最多可购买多少，可从最大选项开始代入验证：\n代入D项，A型设备6台，则B型设备8-6=2台，总费用=6×12+2×10=72+20=92万元，超过90万预算，排除；\n代入C项，A型设备5台，则B型设备8-5=3台，总费用=5×12+3×10=60+30=90万元，刚好符合预算，总处理能力\u003cimg data-k=\"ec6c0c8d9dfa\">，符合能力要求。\n故正确答案为C。\n方法二：设购买A型设备x台，则B型设备(8-x)台。根据企业最多支出90万元可得\u003cimg data-k=\"b48c8a5160fd\">，根据要求月污水处理能力不低于1600吨可得\u003cimg data-k=\"33ed400db5cc\">，解得\u003cimg data-k=\"3627f68fe40e\">，因此A型设备最多可购买5台。\n故正确答案为C。","no":44,"missingImage":false},{"type":"question","qid":"16070268","cat":"数学运算","stem":"一家三口去旅游，拍摄单人照、合照一共68张。合照的数量比单人照的两倍少一张；合照中，全家福占了三分之二，且孩子出现的次数为爸爸妈妈出现次数之和的一半；孩子的单人照比爸爸、妈妈单人照数量之和多1张。那么孩子出现的照片一共有：","options":{"A":"52张","B":"48张","C":"45张","D":"37张"},"answer":"A","explanation":"根据“单人照、合照一共68张。合照的数量比单人照的两倍少一张”，可得单人照为\u003cimg data-k=\"cc0fdea91ae0\">张，合照为68−23=45张。因为“孩子的单人照比爸爸、妈妈单人照数量之和多1张”，则孩子单人照为\u003cimg data-k=\"ea4c9de35ad5\">张，爸爸、妈妈单人照为23−12=11张。由于“合照中，全家福占了三分之二”，则全家福数量为\u003cimg data-k=\"25e5c7eeca78\">张，两人合照数量为45−30=15张。\n设有孩子的两人合照为x张，则没有孩子的两人合照为(15−x)张。根据 “合照中孩子出现的次数为爸爸妈妈出现次数之和的一半”，可得方程\u003cimg data-k=\"c57dd4abd35a\">，解得x=10。所以孩子出现的照片一共有12+30+10=52张。\n故正确答案为A。","no":45,"missingImage":false},{"type":"question","qid":"16070163","cat":"数学运算","stem":"随着新型清洁能源、现代生态农牧的发展，昔日戈壁荒滩不仅成为光伏“蓝海”，还变成了养殖数万只“光伏羊”的繁茂草原。牧民甲、乙家中都有若干只“光伏羊”，乙若给甲20只羊，甲的羊数将是乙的K倍；甲若给乙K只羊，乙的羊数将是甲的一半；若K为正整数，那么K的值可能有多少个？","options":{"A":"5","B":"6","C":"7","D":"8"},"answer":"D","explanation":"设牧民甲、乙家中的光伏羊分别有x只、y只。根据题意可列方程组：\u003cimg data-k=\"03caf59a898c\">，将①式x=k（y-20）-20代入②式可得：k（y-20）-20-k=2（y+k），整理可得\u003cimg data-k=\"309e2b3d132f\">，变形后可得\u003cimg data-k=\"93683c165367\">，根据题意y为正整数，且k为正整数，则k-2为66的约数。对66进行因式分解：66=1×66=2×33=3×22=6×11，因此66的约数共8个，k-2共8种情况：\n当k-2=1时，k=3，y=89只，x=187只；\n当k-2=2时，k=4，y=56只，x=124只；\n当k-2=3时，k=5，y=45只，x=105只；\n当k-2=6时，k=8，y=34只，x=92只；\n当k-2=11时，k=13，y=29只，x=97只；\n当k-2=22时，k=24，y=26只，x=124只；\n当k-2=33时，k=35，y=25只，x=155只；\n当k-2=66时，k=68，y=24只，x=252只。\n则k值共有8种可能。\n故正确答案为D。","no":46,"missingImage":false},{"type":"question","qid":"16070162","cat":"数学运算","stem":"某数字展馆沿入口两侧各设有3个展位。现需安排数字产品展位和人工智能展位各3个，且数字产品展位不能都安排在同一侧，那么共有多少种安排方式？","options":{"A":"244","B":"648","C":"684","D":"720"},"answer":"B","explanation":"方法一：根据题意，要求数字产品的3个展位不能都安排在同一侧，分类讨论如下：\n（1）左侧有1个数字产品展位和2个人工智能展位，其余展位在右侧，有\u003cimg data-k=\"4e407b9232a6\">\u003cimg data-k=\"971d23bf919e\">种安排方式；\n（2）左侧有2个数字产品展位和1个人工智能展位，其余展位在右侧，有\u003cimg data-k=\"33fcb76ad08f\">\u003cimg data-k=\"971d23bf919e\">种安排方式。\n综上，共有324+324=648种安排方式。\n方法二：可考虑逆向思维。总情况为将6个展位任意放置在左右两侧的6个位置，有\u003cimg data-k=\"b5af088a30fe\">种安排方式。要求数字产品的3个展位不能都安排在同一侧，反面为数字产品的3个展位均放在同一侧。从左、右两侧选择其中一侧，放入数字产品的3个展位，另一侧放入人工智能的3个展位，有\u003cimg data-k=\"b3430f62aacd\">种安排方式。因此，共有720-72=648种安排方式。\n故正确答案为B。","no":47,"missingImage":false
