h:290px\">\n故正确答案为B。","no":50,"missingImage":false},{"type":"question","qid":"16070196","cat":"数学运算","stem":"某风力发电机的三片风叶之间两两所成的角度为\u003cimg data-k=\"513220b8408e\">，当其中一片风叶OB与塔杆叠合时，一位身高1.8米的技术人员站在另一片风叶OA端头的正下方，测得塔杆顶部仰角为\u003cimg data-k=\"86c1f89cc9f5\">（如左下图所示）；若该技术人员站在离塔杆60米处，则测得塔杆顶部仰角为\u003cimg data-k=\"5f65827c69cc\">（如右下图所示）。那么风叶转动时叶片顶端最高离地面：\n\u003cimg data-k=\"b259ac2e2b05\" style=\"max-width:300px\">","options":{"A":"81.8米","B":"89.8米","C":"95.8米","D":"101.8米"},"answer":"D","explanation":"根据题意，在风叶转动过程中，叶片垂直地面达到最高点时顶端距地面最远，如图所示，最大距离=OA+OD+1.8米。\n\u003cimg data-k=\"80bdb83b907a\" style=\"max-width:200px\">\n根据题干右图所示，\u003cimg data-k=\"b2d8a7113c46\">且\u003cimg data-k=\"a790a1c6a949\">，可得\u003cimg data-k=\"97a84f5557d5\">为等腰直角三角形，技术人员离塔杆60米，可得OE=EP=60米；根据题干左图所示，\u003cimg data-k=\"2ec65cb8b3bb\">且\u003cimg data-k=\"db3910b14e7e\">，根据勾股定理可得，直角\u003cimg data-k=\"84460620214d\">三边之比为\u003cimg data-k=\"8203a47308a6\">，则\u003cimg data-k=\"e5431002f998\">\u003cimg data-k=\"00c47d9418b5\">米；根据题意，相邻风叶夹角均为\u003cimg data-k=\"513220b8408e\">，则\u003cimg data-k=\"e8c03c181b3c\">且\u003cimg data-k=\"14f8279717ab\">\u003cimg data-k=\"18179026085c\">，人在A点正下方，则\u003cimg data-k=\"0d7edf163977\">，\u003cimg data-k=\"7a7af2a3b611\">\u003cimg data-k=\"1419a0fd7b7a\">，同理可得直角\u003cimg data-k=\"aa502f60a1da\">三边之比为\u003cimg data-k=\"344e4ae36d24\">，则\u003cimg data-k=\"d8783108d583\">\u003cimg data-k=\"fa467a8a3c88\">米。\n综上，题干所求=OA+OD+1.8米=40米+60米+1.8米=101.8米。\n故正确答案为D。","no":51,"missingImage":false},{"type":"question","qid":"16070176","cat":"数学运算","stem":"为庆祝春节，某村计划在村口的两根圆柱体石柱上缠绕灯带。每根石柱需绕上3圈灯带，起始点为A，终点为B，如下图所示。若每根石柱高为5米，横截面圆的周长为4米，那么两根石柱所需的灯带总长度最短为多少米？\n\u003cimg data-k=\"752a3b574483\" style=\"max-width:138px\">","options":{"A":"13","B":"25","C":"26","D":"50"},"answer":"C","explanation":"根据题干要求“两根石柱所需的灯带总长度最短”，即求A点到B点的长度最短，已知每根石柱高为5米，横截面圆的周长为4米，将石柱侧面展开成平面图形（如下图所示），则所求AB长度最短即图中直角三角形的斜边。根据直角三角形勾股定理：\u003cimg data-k=\"e9f89b3285f4\">，则\u003cimg data-k=\"92f514f9bcaa\">，故两根石柱所需灯带总长度最短为13×2=26米。\n\u003cimg data-k=\"c585e1a4c286\" style=\"max-width:379px\">\n故正确答案为C。","no":52,"missingImage":false},{"type":"question","qid":"17467567","cat":"数学运算","stem":"某小区内有一块直角扇形的草坪如下图所示，两条互相垂直的小路AC与BC分别长4米和3米。物业公司准备在四边形OACB围成的区域种植丁香花。如果小路面积忽略不计，则丁香花种植面积为多少平方米？\n\u003cimg data-k=\"605958ee4e3a\" style=\"max-width:200px\">","options":{"A":"11","B":"12","C":"13","D":"14"},"answer":"A","explanation":"连接AB，且延长CB、AO相交于D点，如下图所示：\n\u003cimg data-k=\"ae600f483878\" style=\"max-width:260px\">\n已知\u003cimg data-k=\"ea51df9274c3\">，AC=4米，BC=3米，在直角三角形ABC中，斜边\u003cimg data-k=\"6ddf3881488c\">米。由于AD所对圆周角为\u003cimg data-k=\"dd44efe89e5a\">，故AD为直径，AO=OD，则\u003cimg data-k=\"cc6c58aaa773\">与\u003cimg data-k=\"e94dc7f9baa4\">全等，BD=AB=5米，CD=CB+BD=3+5=8米。\u003cimg data-k=\"5c3a33a086cb\">\u003cimg data-k=\"6708a0c54db6\">，\u003cimg data-k=\"a81548148cc7\">\u003cimg data-k=\"2c0288cffbb7\">，\u003cimg data-k=\"e5ca10832156\">\u003cimg data-k=\"130237a0e28e\">。所求面积\u003cimg data-k=\"5138c7e5542e\">。\n故正确答案为A。","no":53,"missingImage":false},{"type":"question","qid":"16070181","cat":"数学运算","stem":"某款蛋堡锅的锅盘为直径24厘米的圆，其中排布着7个全等的深度均为2厘米的圆柱状凹槽，锅盘的金属用料与表面积成正比（厚度忽略不计，锅盘可近似看作如右下图所示的图形）。厂家现推出凹槽加深30%的升级款，则升级后的锅盘用料约增加多少倍？\n\u003cimg data-k=\"2600fea7b6d3\" style=\"max-width:250px\">\u003cimg data-k=\"8723ebf1599e\" style=\"max-width:209px\">","options":{"A":"0.13","B":"0.21","C":"0.3","D":"0.69"},"answer":"A","explanation":"根据题意，锅盘的表面积=直径24厘米的圆形面积+7个等深的圆柱体侧面积。锅盘升级后，圆形面积不变，圆柱体的高变大30%。则锅盘半径\u003cimg data-k=\"a109674448a6\">cm，每个圆形小凹槽的半径\u003cimg data-k=\"6d14be48b0db\">cm，升级后的高为2×(1+30%)=2.6cm。根据圆柱侧面积公式\u003cimg data-k=\"e0c936e2a18d\">，则题干所求\u003cimg data-k=\"3d60aa69713b\">。\n故正确答案为A。","no":54,"missingImage":false}],"count":15,"answerable":15,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"17467529","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"2dbf7911a0bb\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形出现明显封闭区域，优先考虑数面。题干图形的面数量依次为10、9、8、？、6、5，故“？”处图形的面数量应为7，只有B项符合。\n故正确答案为B。","no":55,"missingImage":false},{"type":"question","qid":"17467550","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定规律。\n\u003cimg data-k=\"487e4170eae4\" style=\"max-width:450px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形线条交叉明显，优先考虑交点数。第一行图形的交点数依次为1、2、3，第二行图形的交点数依次为4、5、6，第三行图形的交点数依次为7、8、？，故？处应为9个交点的图形，只有A项符合。\n故正确答案为A。","no":56,"missingImage":false},{"type":"question","qid":"16070177","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律：\n\u003cimg data-k=\"9c4690f57410\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形均由黑块和白块构成，且分堆明显，考虑部分数。第一组图，黑块部分数明显无规律，白块部分数为2、3、4，依次递增1；第二组图，前两幅图白块部分数依次为2、3，故问号处图形白块部分数应为4，对应D项。\n故正确答案为D。","no":57,"missingImage":false},{"type":"question","qid":"16070180","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"b0e9872dc303\" style=\"max-width:500px\">","options":{"A":"①②④，③⑤⑥","B":"①②⑥，③④⑤","C":"①③⑥，②④⑤","D":"①④⑥，②③⑤"},"answer":"C","explanation":"本题为分组分类题目。元素组成相似，且相同元素“圆”重复出现，优先考虑样式规律中的遍历。观察发现，图①③⑥中的圆均位于图形内部，图②④⑤中的圆均位于图形外部，即图①③⑥为一组，图②④⑤为一组。\n故正确答案为C。","no":58,"missingImage":false},{"type":"question","qid":"16070184","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"a8ba7053a129\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查立体拼合。第一组图的图一由图二和图三拼合而成，第二组图的图一也应由图二与“？”处图形拼合而成，对应B项。 \n\u003cimg data-k=\"6b63d718dbae\" style=\"max-width:600px\">\n故正确答案为B。","no":59,"missingImage":false},{"type":"question","qid":"16070188","cat":"定义判断","stem":"凯伊效应是指当一束高粘度的假塑性流体倾倒至固体表面时，固体表面会把液束向上反弹出去。其原理为快速下落的液束冲击下方堆积的黏性流体，流体表面因为受到冲击粘度变小，受到撞击后形成一个酒窝状的凹坑，同时粘度降低的表面充当了润滑剂的作用，最终使得下落的液束被反弹出去。\n根据上述定义，下列属于凯伊效应的是：","options":{"A":"用肥皂水冲洗勺子，肥皂水碰到勺子后会沿着勺子曲面流下去","B":"在喷水池喷出的水柱上放乒乓球，水柱会托举乒乓球向上跳跃","C":"水流冲过土壤中的孔隙或裂缝时，形成了类似管道的水流通道","D":"将洗发水从高处快速倒向桌面，堆积的洗发水会突然跳起一束"},"answer":"D","explanation":"第一步：找出定义关键词。\n“高粘度的假塑性流体倾倒至固体表面”、“液束向上反弹出去”。\n第二步：逐一分析选项。\nA项：肥皂水碰到勺子后沿着勺子曲面流下去，液束没有反弹，不符合“液束向上反弹出去”，不符合定义，排除；\nB项：水柱托举乒乓球向上跳跃，不涉及液束反弹，不符合“液束向上反弹出去”，不符合定义，排除；\nC项：水流冲过孔隙或裂缝形成类似管道的水流通道，不涉及液束反弹，不符合“液束向上反弹出去”，不符合定义，排除；\nD项：将洗发水从高处快速倒向桌面，洗发水是高粘度假塑性流体，符合“高粘度的假塑性流体倾倒至固体表面”，堆积的洗发水突然跳起一束，符合“液束向上反弹出去”，符合定义，当选。\n故正确答案为D。","no":60,"missingImage":false},{"type":"question","qid":"16070199","cat":"定义判断","stem":"敏化电极法指的是在指示电极上覆盖一层物质，使电极能提高或改变其选择性，进而检测物质的方法，包括气敏电极法、酶电极法等。其中，气敏电极法在指示电极上覆盖的是特殊的透气膜或空隙间隔，使待测气体可以通过。酶电极法在电极敏感膜上覆盖的是含酶凝胶或悬浮液，待测物可以向酶膜扩散。\n根据上述定义，下列属于气敏电极法的是：","options":{"A":"在pH电极上覆盖乙烯材料，\u003cimg data-k=\"b507f0589a9a\">气体穿过覆盖物进入中介溶液，引起化学平衡移动，进而计算出浓度","B":"某种能将乙醇转化为电流的微生物经培养后可形成微生物膜，当电极放置在膜上时可检测出乙醇的浓度","C":"给pH电极装上葡萄糖氧化酶膜，当电极插入待测溶液时，酶催化产生化学反应，进而测定葡萄糖含量","D":"在植株鲜样中加偏磷酸溶液，打碎成浆后，取样品滤液加活性炭及硼酸钠溶液，进而测定抗坏血酸含量"},"answer":"A","explanation":"第一步：找出定义关键词。\n敏化电极法：“指示电极上覆盖一层物质”、“电极能提高或改变其选择性”、“检测物质”；\n气敏电极法：“指示电极上覆盖的是特殊的透气膜或空隙间隔”、“待测气体可以通过”；\n酶电极法：“电极敏感膜上覆盖的是含酶凝胶或悬浮液”、“待测物可以向酶膜扩散”。\n第二步：逐一分析选项。\nA项：在pH电极上覆盖乙烯材料，符合“指示电极上覆盖的是特殊的透气膜或空隙间隔”，\u003cimg data-k=\"b507f0589a9a\">气体穿过覆盖物进入中介溶液，从而计算出浓度，符合“待测气体可以通过”，符合“气敏电极法”定义，当选；\nB项：电极放置在微生物膜上检测出乙醇的浓度，乙醇不属于气体，不符合“待测气体可以通过”，不符合“气敏电极法”定义，排除；\nC项：给pH电极装上葡萄糖氧化酶膜，符合“电极敏感膜上覆盖的是含酶凝胶或悬浮液”，电极插入待测溶液时，酶催化产生化学反应，进而测定葡萄糖含量，符合“待测物可以向酶膜扩散”，符合“酶电极法”定义，不符合“气敏电极法”定义，排除；\nD项：在植株鲜样中加偏磷酸溶液，取样品滤液加活性炭及硼酸钠溶液来测定抗坏血酸含量，不涉及电极，不符合“指示电极上覆盖一层物质”，不符合“敏化电极法”，不符合定义，排除。\n故正确答案为A。","no":61,"missingImage":false},{"type":"question","qid":"16070198","cat":"定义判断","stem":"某些电介质在沿一定方向上受到外力的作用而变形时，其内部会产生极化现象，同时在它的两个相对表面上出现正负相反的电荷。当外力去掉后，它又会恢复到不带电的状态，这种现象被称为正压电效应。相反，当在电介质的极化方向上施加电场，电介质会发生变形，电场去掉后，电介质的变形随之消失，这种现象被称为逆压电效应。\n根据上述定义，下列体现了逆压电效应的是：","options":{"A":"超声波清洗是利用超声波的机械振动来清洗物体表面","B":"液晶显示器利用液晶材料改变光通过的方向和强度，从而显示动态图像","C":"打火机的打火器被按下后能瞬间产生高压，在极小的间隙下击穿空气，点燃气体","D":"风力发电机工作时将风的动能转化为风轮轴的机械能，发电机在风轮轴的带动下旋转发电"},"answer":"A","explanation":"第一步：找出定义关键词。\n正压电效应：“电介质受外力作用变形”、“内部产生极化现象”、“两个相对表面出现正负相反电荷”、“外力去掉后恢复不带电状态”；\n逆压电效应：“在电介质的极化方向上施加电场”、“电介质发生变形”、“电场去掉后，变形随之消失”。\n第二步：逐一分析选项。\nA项：超声波清洗是利用超声波的机械振动来清洗物体表面，超声波发生器在电介质极化方向施加电场，使电介质发生变形产生机械振动，符合“在电介质的极化方向上施加电场”、“电介质发生变形”，符合“逆压电效应”的定义，当选；\nB项：液晶显示器利用液晶材料改变光通过的方向和强度，从而显示动态图像，液晶显示器仅通过电场改变液晶分子排列来控光，未涉及电介质的变形，不符合“在电介质的极化方向上施加电场”、“电介质发生变形”，不符合“逆压电效应”的定义，排除；\nC项：打火机的打火器被按下后能瞬间产生高压，是对压电材料施加外力使其产生电荷，符合“电介质受外力作用变形”、“内部产生极化现象”、“两个相对表面出现正负相反电荷”，压力去掉后，电介质不带电，符合“外力去掉后恢复不带电状态”，符合“正压电效应”的定义，不符合“逆压电效应”的定义，排除；\nD项：风力发电机将“风的动能”转化为“机械能”，发电机在风轮轴的带动下旋转发电，没有在电介质的极化方向上施加电场，不符合“在电介质的极化方向上施加电场”、“电介质发生变形”、“电场去掉后，变形随之消失”，不符合“逆压电效应”的定义，排除。\n故正确答案为A。\n本题定义内容专业性较强，选项也涉及专业领域知识，仅靠常识较难直接判断。在结合下图资料表述进行匹配，综合关键限定条件比对后，A项更符合定义要求，优选A项。\n\u003cimg data-k=\"b4d2af23aa19\" style=\"max-width:700px\">","no":62,"missingImage":false},{"type":"question","qid":"17467530","cat":"定义判断","stem":"复冰现象是指当冰的表面受压，压力令其熔点降低，使得冰化成水，一旦压力消失，熔点提高至原来的水平，水又变为冰的现象。\n根据上述定义，下列不属于复冰现象的是：","options":{"A":"将两块水平放置的冰砖面对面压实，松手后两块冰砖粘在了一起","B":"在一块很大的冰上放一条金属线，金属线两端分别连着两个重物，金属线缓慢穿越冰块而且不会将其切开","C":"在滑冰场上滑冰时，冰刀留下道道痕迹，但很快刀痕会全部消失，留下完好如初的冰面","D":"水结冰时，所释放的热量在其内部形成压力、产生气泡，这使得结成的冰看上去不透明"},"answer":"D","explanation":"第一步：找出定义关键词。\n“冰受压化成水”、“压力消失水又变为冰”。\n第二步：逐一分析选项。\nA项：两块冰砖压实，说明冰在受压时先化成了水，松开粘一块说明刚刚化的水又结冰了，符合“冰受压化成水”、“压力消失水又变为冰”，符合定义，排除；\nB项：金属线能够穿过冰，说明冰受压化成了水，金属线穿过之后压力解除，但冰不会被切开，说明水又结冰，符合“冰受压化成水”、“压力消失水又变为冰”，符合定义，排除；\nC项：刀痕消失，说明冰刀离开冰面后，压力消失，水膜重新结冰，冰面恢复平整，符合“冰受压化成水”、“压力消失水又变为冰”，符合定义，排除；\nD项：水结冰时内部产生压力和气泡，仅仅是水结冰的单向凝固过程，并没有体现冰化水现象，不符合“冰受压化成水”、“压力消失水又变为冰”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":63,"missingImage":false},{"type":"question","qid":"16070186","cat":"定义判断","stem":"可编程物质是指一种可以根据用户输入或自主感应而以编程方式来改变自身物理性质的物质。\n根据上述定义，下列不涉及可编程物质的是：","options":{"A":"某智能水泥通过内嵌的传感器，自主控制水泥应力的释放以保持建筑物结构稳定","B":"某智能布料由高分子复合纤维织成，输入不同电压会改变其电场，从而根据预设编码显现不同图案","C":"通过添加纳米颗粒和化学反应物，某新型水泥可以实现自动修复裂缝和损坏，从而延长建筑的寿命","D":"某智能玻璃使用Socket网络编程技术，可根据外部光照强度和内部信号来改变透明度，调节室内光线以节省能源"},"answer":"C","explanation":"第一步：找出定义关键词。\n“根据用户输入或自主感应”、“以编程方式”、“改变自身物理性质”。\n第二步：逐一分析选项。\nA项：智能水泥通过内嵌的传感器自主控制应力的释放来保持建筑物结构稳定，属于“自主感应”、“以编程方式”、“改变自身物理性质”，符合定义，排除；\nB项：智能布料通过输入不同电压改变电场，根据预设编码显现不同图案，属于“用户输入”、“以编程方式”、“改变自身物理性质”，符合定义，排除；\nC项：新型水泥通过添加纳米颗粒和化学反应物实现自动修复，属于材料本身的化学特性，不符合“根据用户输入或自主感应”、“以编程方式”，不符合定义，当选；\nD项：智能玻璃通过网络编程技术，根据外部光照强度和内部信号来改变透明度，属于“自主感应”、“以编程方式”、“改变自身物理性质”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"16070185","cat":"定义判断","stem":"回归效应，是指极端样本在后续观测中更接近总体均值的趋势，表现为个体极端特征随时间推移逐渐减弱。\n根据上述定义，下列体现了回归效应的是：","options":{"A":"龙生龙，凤生凤，老鼠的儿子会打洞","B":"尺寸小的豌豆子代会变大，尺寸大的豌豆子代会变小","C":"一对父母身高近两米，他们的孩子成年后身高也近两米","D":"某篮球运动员平均每场得分为20分，但在某场比赛中得了40分"},"answer":"B","explanation":"第一步：找出定义关键词。\n“更接近总体均值”、“个体极端特征”、“随时间推移逐渐减弱”。\n第二步：逐一分析选项。\nA项：龙生龙、凤生凤强调的是遗传稳定性，个体极端特征没有减弱，反而保持，不符合定义，排除；\nB项：尺寸小（极端偏小）的豌豆子代变大，尺寸大（极端偏大）的豌豆子代变小，个体极端特征随时间推移逐渐减弱，都向中间的总体尺寸均值靠拢，符合定义，当选；\nC项：父母身高近两米，孩子身高也近两米，个体极端特征没有减弱，反而保持，不符合定义，排除；\nD项：只说了一场得40分（极端高分），但没有后续数据说明得分向20分的均值回归，不符合定义，排除。\n故正确答案为B。","no":65,"missingImage":false},{"type":"question","qid":"16070192","cat":"定义判断","stem":"新污染物筛查主要有两类：非靶向筛查是不针对特定的目标污染物，基于全扫描分析获取对样品成分的表达；疑似筛查是根据先验的化学结构信息和质谱采集的特征发现样品中可能存在的化学物质。\n根据上述定义，下列最能体现疑似筛查的是：","options":{"A":"小肖利用全二维气相色谱—质谱法分析废水样品，发现污水处理过程中产生了苯并三唑类化合物","B":"课题组筛查化工园区土壤中的污染物，对识别到的化合物的检测频率和相对含量进行打分，最终选出了36种优先污染物","C":"研究小组筛查了潜在内分泌干扰物列表中的化学物，发现一半以上的个人护理产品中含有与发育损害或内分泌干扰有关的成分","D":"吴教授采用效应导向分析方法筛查出石油和香烟浸出液中导致芳基烃受体（AhR）反应的组分，并鉴定出这些组分中导致AhR反应的化合物"},"answer":"C","explanation":"第一步：找出定义关键词。\n非靶向筛查：“不针对特定的目标污染物”、“基于全扫描分析获取对样品成分的表达”；\n疑似筛查：“根据先验的化学结构信息和质谱采集的特征”、“发现样品中可能存在的化学物质”。\n第二步：逐一分析选项。\nA项：小肖利用全二维气相色谱—质谱法分析废水样品发现了苯并三唑类化合物，符合“不针对特定的目标污染物”、“基于全扫描分析获取对样品成分的表达”，符合非靶向筛查定义，不符合疑似筛查定义，排除；\nB项：对识别到的化合物的检测频率和相对含量进行打分，最终“选出”了36种优先污染物，“选出”意味着不是新发现的，是对已有识别结果的后续处理，不符合“发现样品中可能存在的化学物质”，不符合疑似筛查定义，排除；\nC项：筛查潜在内分泌干扰物列表中的化学物，符合“根据先验的化学结构信息和质谱采集的特征”，发现一半以上的个人护理产品中含有与发育损害或内分泌干扰有关的成分，符合“发现样品中可能存在的化学物质”，符合疑似筛查定义，当选；\nD项：吴教授采用“效应导向”分析方法筛查出石油和香烟浸出液中导致芳基烃受体（AhR）反应的组分，是从效应倒推成分，不符合“根据先验的化学结构信息和质谱采集的特征”，不符合疑似筛查定义，排除。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"16070193","cat":"定义判断","stem":"玻尔兹曼宇宙是玻尔兹曼为了解释宇宙初始阶段的熵之谜提出的假说。基于“整个系统的熵增加，则系统某些部分的熵可以减少”的事实，它设想在宇宙初始物质的随机运动过程中偶然产生一个熵较低的区域，从这个区域诞生了我们所熟知的宇宙。玻尔兹曼大脑假说认为，如果一个新结构可由随机的熵减少所触发产生，那么一个拥有“宇宙记忆”的大脑因为比较简单，所以它的出现概率远比宇宙这种复杂结构的出现概率大得多。\n根据上述定义，最有可能得出的结论是：","options":{"A":"玻尔兹曼大脑假说是由玻尔兹曼提出的","B":"玻尔兹曼宇宙假说认为宇宙可能是唯一的","C":"玻尔兹曼大脑假说质疑玻尔兹曼宇宙假说的理论基础","D":"玻尔兹曼大脑假说反对存在玻尔兹曼宇宙，主张我们可能只是一些大脑"},"answer":"C","explanation":"第一步：找出定义关键词。\n玻尔兹曼宇宙假说：宇宙是随机运动中偶然出现的低熵区域。\n玻尔兹曼大脑假说：在同样的随机熵减机制下，简单的“大脑”比整个宇宙更容易出现。\n第二步：逐一分析选项。\nA项：题干中仅提及了“玻尔兹曼宇宙假说”是由玻尔兹曼提出的，但未提及“玻尔兹曼大脑假说”是由谁提出的，故无法推出，排除； \nB项：题干中“玻尔兹曼宇宙假说”仅仅是在假设宇宙是如何诞生的，但未提及宇宙是否是唯一的，无法推出，排除；\nC项：“玻尔兹曼宇宙假说”认为“宇宙”是随机运动偶然产生的，按照这个说法，题干最后一句说随机运动偶然产生的更应该是“简单的大脑”，而非“宇宙”，所以“玻尔兹曼大脑假说”是对“玻尔兹曼宇宙假说”的质疑，可以推出，当选；\nD项：题干中“玻尔兹曼大脑假说”并未提及我们是否可能是那些拥有“宇宙记忆”的大脑，无法推出，排除。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"17467562","cat":"定义判断","stem":"疤痕效应是指人在遭受创伤后，伤口经过一段时间的恢复会愈合，但留下的疤痕会时刻提醒人们过去的伤痛，并对人的心理造成持续的影响。在社会学中，疤痕效应泛指重大事件会使人们的行为模式趋于保守，更加厌恶风险，进而导致人们对于事物的看法和决策产生偏差。\n根据上述定义，下列未体现疤痕效应的是：","options":{"A":"一朝被蛇咬，十年怕井绳","B":"经历台风袭击后，老刘会经常囤积一些非必要生活用品，以备不时之需","C":"五年前老陈投资失败后，将所有积蓄存入银行，不再选择其他理财方式","D":"杨教授儿时经历过饥荒，深刻理解粮食的重要性，矢志培育优质高产的小麦种子"},"answer":"D","explanation":"第一步：找出定义关键词。\n“重大事件”、“趋于保守”、“更加厌恶风险”、“人们对于事物的看法和决策产生偏差”。\n第二步：逐一分析选项。\nA项：意思是被蛇咬伤的创伤事件后，长达十年里看到外形相似的绳子都会心生恐惧，被蛇咬属于重大创伤事件，怕井绳是行为上的风险回避，符合“重大事件”、“趋于保守”、“更加厌恶风险”、“人们对于事物的看法和决策产生偏差”，符合定义，排除；\nB项：经历台风袭击后，符合“重大事件”，老刘经常囤积非必要生活用品，说明行为模式转为保守，决策因过往创伤出现偏差，符合“趋于保守”、“更加厌恶风险”、“人们对于事物的看法和决策产生偏差”，符合定义，排除；\nC项：五年前投资失败后，符合“重大事件”，老陈将所有积蓄存银行，不再选择其他理财方式，说明他厌恶风险，决策因过往创伤发生根本性的保守转变，符合“趋于保守”、“更加厌恶风险”、“人们对于事物的看法和决策产生偏差”，符合定义，排除；\nD项：杨教授儿时经历过饥荒，矢志培育优质高产的小麦种子，说明他主动投身科研，并未厌恶风险，而是将经历转化为解决问题的动力，不符合“趋于保守”、“更加厌恶风险”、“人们对于事物的看法和决策产生偏差”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":68,"missingImage":false},{"type":"question","qid":"16070191","cat":"定义判断","stem":"偏序集是一个集合与其上元素之间的一种关系组成的整体，该关系需满足三个条件：\n①自反性：集合中每个元素与自身有此关系\n②反对称性：若元素A与B，B与A互有此关系，则A与B必为同一元素\n③传递性：若A与B，B与C有此关系，则A与C有此关系\n根据上述定义，下列属于偏序集的是：","options":{"A":"设集合为一天中所有的时间点，定义集合上的关系为某时间点不晚于另一时间点","B":"设集合为书架上所有的书，定义集合上的关系为某本书与另一本书摆在同一层","C":"设集合为某班级的所有同学，定义集合上的关系为朋友关系","D":"设集合为所有整数，定义集合上的关系为不等于"},"answer":"A","explanation":"第一步：找出定义关键词。\n“集合中每个元素与自身有此关系”、“若元素A与B，B与A互有此关系，则A与B必为同一元素”、“若A与B，B与C有此关系，则A与C有此关系”。\n第二步：逐一分析选项。\nA项：设A、B、C为一天中的三个时间点，即有“A不晚于A，B不晚于B，C不晚于C”，符合“集合中每个元素与自身有此关系”，若“A不晚于B且B不晚于A，可以得到A=B”，符合“若元素A与B，B与A互有此关系，则A与B必为同一元素”，若“A不晚于B，B不晚于C，则A不晚于C”，符合“若A与B，B与C有此关系，则A与C有此关系”，符合定义，当选；\nB项：设A、B为书架上的两本书，通过“A与B在同一层，B与A在同一层，无法得到A和B一定是同一本书”，不符合“若元素A与B，B与A互有此关系，则A与B必为同一元素”，不符合定义，排除；\nC项：设A、B、C为班级中的三位同学，若“A和B是朋友，B和C是朋友，无法得到A和C一定是朋友”，不符合“若A与B，B与C有此关系，则A与C有此关系”，不符合定义，排除；\nD项：任意整数都等于自身，即任意整数和自身都没有“不等于”关系，不符合“集合中每个元素与自身有此关系”，不符合定义，排除。\n故正确答案为A。","no":69,"missingImage":false},{"type":"question","qid":"16070292","cat":"逻辑判断","stem":"我国幅员辽阔，物产丰富。2022年海洋原油产量5800万吨，但是缺少高精度海洋勘测设备和技术，这严重制约了国家海洋油气勘探开发进程。2023年我国自主研发的海底地震勘探采集设备——“海脉”在渤海投入使用，这将极大提升我国海洋油气藏勘探精度。由此可以预期我国海洋原油产量将会提升。\n以下哪项是上述论证成立的必要前提？","options":{"A":"“海脉”可以“看”清埋藏几千米深的陆地油气储层","B":"“海脉”能捕捉到海底相当于蚊子声\u003cimg data-k=\"307a72636cab\">大小的信号","C":"当前我国已经具有开采海洋原油的各项技术、设备和能力","D":"成千上万个“海脉”节点采集的数据信息可以处理成地震剖面"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：我国海洋原油产量将会提升。\n论据：“海脉”在渤海投入使用，这将极大提升我国海洋油气藏勘探精度。\n本题论点讨论的是我国海洋原油产量将会提升，论据讨论的是“海脉”的使用将极大提升我国海洋油气藏勘探精度，二者话题不一致，提问为“必要前提”，加强优先考虑搭桥和补充必要条件。\nA项：该项指出“海脉”可以“看”清陆地油气储层，但并未说明“看”清陆地油气储层是否能提升我国海洋原油产量，为不明确项，无法加强，排除；\nB项：该项指出“海脉”能捕捉到海底的微弱信号，但并未说明捕捉到海底的微弱信号是否能提升我国海洋原油产量，为不明确项，无法加强，排除；\nC项：该项指出我国已经具有开采海洋原油的各项技术、设备和能力，只有具备开采能力，勘探精度提升才能带来产量提升，如果我国不具备开采海洋原油的各项技术、设备和能力，那么即使勘探精度提升，产量也无法提升，因此该项是论点成立的必要条件，当选；\nD项：该项指出成千上万个“海脉”节点采集的数据信息可以处理成地震剖面，但并未说明得到的地震剖面是否能提升我国海洋原油产量，为不明确项，无法加强，排除。\n故正确答案为C。","no":70,"missingImage":false},{"type":"question","qid":"16070200","cat":"逻辑判断","stem":"端粒是染色体末端的一段重复的核苷酸序列。当端粒长度变得非常短时，就更容易导致细胞的衰老和凋亡。有研究发现，每天每增加一杯速溶咖啡摄入量，端粒长度对应的等效年龄减少0.38年，因而速溶咖啡摄入量与端粒长度呈负相关。不过，研究结果也显示，研磨咖啡摄入量与端粒长度的相关性没有统计学意义，不能证实研磨咖啡也会减少端粒长度对应的等效年龄。该研究认为，饮用速溶咖啡会导致衰老，饮用研磨咖啡则不会，因而后者更健康。\n以下哪项如果为真，不能支持上述结论？","options":{"A":"速溶咖啡中往往会添加白砂糖、乳粉等，这些成分容易导致衰老","B":"实验中使用的部分速溶咖啡样本，其实是现场研磨咖啡豆制作的","C":"与相同量的研磨咖啡相比较，速溶咖啡中导致衰老的铅含量更高","D":"制作研磨咖啡时，会使用滤纸吸附咖啡白醇等对人体有害的物质"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：饮用速溶咖啡会导致衰老，饮用研磨咖啡则不会，因而后者更健康。\n论据：每天每增加一杯速溶咖啡摄入量，端粒长度对应的等效年龄减少0.38年，因而速溶咖啡摄入量与端粒长度呈负相关。不过，研究结果也显示，研磨咖啡摄入量与端粒长度的相关性没有统计学意义，不能证实研磨咖啡也会减少端粒长度对应的等效年龄。\n本题论点与论据都在说饮用速溶咖啡会导致衰老，但饮用研磨咖啡则不会。论点和论据话题一致，加强优先考虑补充论据，即解释原因或举例子，且本题为选非题，将可以加强的选项排除即可。\n第二步：逐一分析选项。\nA项：该项讨论的是速溶咖啡中往往会添加白砂糖、乳粉等，这些成分容易导致衰老，解释了为什么饮用速溶咖啡会导致衰老，补充论据，可以加强，排除；\nB项：该项讨论的是实验中使用的部分速溶咖啡样本，其实是现场研磨咖啡豆制作的，那么就不确定造成衰老的是否为速溶咖啡，说明实验不科学、不准确，可以削弱，不能加强，当选；\nC项：该项讨论的是与相同量的研磨咖啡相比较，速溶咖啡中导致衰老的铅含量更高，说明饮用速溶咖啡会导致衰老，饮用研磨咖啡则相较不会，补充论据，可以加强，排除；\nD项：该项讨论的是制作研磨咖啡时，会使用滤纸吸附咖啡白醇等对人体有害的物质，解释了为什么饮用研磨咖啡会更加健康，补充论据，可以加强，排除。\n本题为选非题，故正确答案为B。","no":71,"missingImage":false},{"type":"question","qid":"16070201","cat":"图形推理","stem":"近日，考古学家发现了一块展示约1.25亿年前肉食性哺乳动物爬兽袭击较大植食性恐龙鹦鹉嘴龙的化石。化石中，鹦鹉嘴龙呈俯卧姿态，后肢折叠在身体两侧；爬兽的身体向右盘绕，俯坐在鹦鹉嘴龙背侧，抓扒着猎物的下巴并撕咬肋骨，其小腿则被鹦鹉嘴龙的后腿夹住。研究者认为，这一发现挑战了“恐龙在白垩纪期间几乎没有受到同时代哺乳动物威胁”的观点。\n以下哪项如果为真，最不能支持上述研究者的结论？","options":{"A":"已能够确认爬兽与鹦鹉嘴龙纠缠在一起并同时葬身于火山喷发","B":"在发现该标本前就有其他观点认为爬兽会捕食鹦鹉嘴龙等恐龙","C":"通过恐龙骨架上的牙印证明了爬兽当时正啃食鹦鹉嘴龙的尸体","D":"在一块爬兽标本的胃中曾发现有鹦鹉嘴龙幼年个体的骨骼残留"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：恐龙在白垩纪期间受到过同时代哺乳动物威胁。\n论据：考古学家发现了一块展示约1.25亿年前肉食性哺乳动物爬兽袭击较大植食性恐龙鹦鹉嘴龙的化石。化石中，鹦鹉嘴龙呈俯卧姿态，后肢折叠在身体两侧；爬兽的身体向右盘绕，俯坐在鹦鹉嘴龙背侧，抓扒着猎物的下巴并撕咬肋骨，其小腿则被鹦鹉嘴龙的后腿夹住。\n从论据“化石显示二者身体纠缠在一起”到论点“恐龙受到过威胁”，注意身体纠缠\u003cimg data-k=\"645831205161\">威胁，所以论据到论点的推理是有漏洞的，可以补充论据填补漏洞，也可以直接加强论点。\n第二步：逐一分析选项。\nA项：该项指出能够确认爬兽与鹦鹉嘴龙纠缠在一起，论据讨论的也是二者在化石中呈现的纠缠在一起的形态，所以该项的表述是对论据内容的重复，保留；\nB项：该项指出在发现该标本前就有其他观点认为爬兽会捕食恐龙，补充了其他观点的论据说明哺乳动物对恐龙有威胁，保留；\nC项：该项指出可证明爬兽当时正啃食鹦鹉嘴龙的尸体，结合论据中“二者身体纠缠在一起”的表述，说明在鹦鹉嘴龙死之前有和爬兽纠缠的过程，可体现出哺乳动物对恐龙的威胁，保留；\nD项：该项指出在爬兽标本的胃中发现有鹦鹉嘴龙幼年个体的骨骼残留，结合论据中“二者身体纠缠在一起”的表述，说明爬兽对恐龙有威胁，保留；\n对比四个选项，从论据“纠缠”到论点“威胁”，\nA还在说纠缠，重复论据\nB举例加强论点，确实在捕食，有威胁\n论据（纠缠）+C（捕食），可以推出论点（威胁）\n论据（纠缠）+D（捕食），可以推出论点（威胁）\nB、C、D三项均从其他角度补充了论据，证明了可能有“威胁”，只有A项是对题干论据的重复，对于加强而言，补充其他角度的论据比单纯重复题干论据更有说服力，因此，对比择优，A项最不能支持。\n本题为选非题，故正确答案为A。","no":72,"missingImage":false},{"type":"question","qid":"16070293","cat":"逻辑判断","stem":"研究人员发现，与摄入盐水的对照组小鼠相比，摄入葡萄球菌肠毒素SEA的小鼠会出现明显干呕现象。人类癌症患者使用化疗药物也会有类似的恶心和呕吐反应。研究显示，小鼠肠道内的SEA毒素激活了肠内壁的肠嗜铬细胞，释放出血清素，血清素又与肠道的感觉神经元受体结合，将信号传递到脑干中的特定神经元从而引发干呕，当特定神经元被灭活后，小鼠干呕显著减少。研究还发现，特定神经元被灭活后，其他动物的干呕也会显著减少。\n由此可以推出：","options":{"A":"如果不摄入葡萄球菌肠毒素，那么小鼠就不会出现干呕现象","B":"开发出灭活特定神经元的药物或能帮助化疗病人减少呕吐","C":"SEA毒素与肠道的感觉神经元受体结合会引发动物的干呕","D":"切断小鼠脑干中特定神经元的信号传递或能引发干呕"},"answer":"B","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干指出“摄入葡萄球菌肠毒素SEA的小鼠会出现明显干呕现象”，并未提到不摄入葡萄球菌肠毒素的情况，无法推出，排除；\nB项：题干指出“人类癌症患者使用化疗药物也会有类似的恶心和呕吐反应”和“当特定神经元被灭活后，小鼠干呕显著减少。研究还发现，特定神经元被灭活后，其他动物的干呕也会显著减少”，说明灭活特定神经元能减少动物干呕，而化疗呕吐与此相似，因此开发出灭活特定神经元的药物有可能帮助化疗病人减少呕吐，可以推出，当选；\nC项：题干指出“小鼠肠道内的SEA毒素激活了肠内壁的肠嗜铬细胞，释放出血清素，血清素又与肠道的感觉神经元受体结合，将信号传递到脑干中的特定神经元从而引发干呕”，说明与受体结合的是血清素，并非SEA毒素，无法推出，排除；\nD项：题干指出“当特定神经元被灭活后，小鼠干呕显著减少”，说明切断信号传递能够减少干呕，而非引发干呕，无法推出，排除。\n故正确答案为B。","no":73,"missingImage":false},{"type":"question","qid":"17467534","cat":"逻辑判断","stem":"青藏高原被誉为“亚洲水塔”，是全球气候变化敏感区和指示区。这里分布着地球海拔最高数量最多的高原湖泊群，面积约占全国的百分之五十，对区域水循环、生态环境和气候调节具有重要意义。如果青藏高原降水增加或者冰川加速消融，那么青藏高原的湖泊将会持续扩张，并且导致潜在的流域合并或重组，威胁到该地区的基础设施和生态安全。由此可以推出：","options":{"A":"如果青藏高原的湖泊没有持续扩张，那么青藏高原的降水没有增加且冰川并没有加速消融","B":"如果青藏高原降水增加或者冰川加速消融，将会导致其潜在的流域合并","C":"如果青藏高原降水没有增加，那么其潜在的流域没有合并和重组","D":"如果青藏高原的流域合并或重组，那么青藏高原降水增加"},"answer":"A","explanation":"第一步：翻译题干。\n青藏高原降水增加 或 冰川加速消融\u003cimg data-k=\"a37757d411ef\">（青藏高原的湖泊将会持续扩张） 且 （潜在的流域合并 或 重组）。\n第二步：逐一分析选项。\nA项：翻译为：\u003cimg data-k=\"0be436194951\">青藏高原的湖泊将会持续扩张\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">青藏高原降水增加 且 \u003cimg data-k=\"0be436194951\">冰川加速消融，是否定题干箭头后“且关系”的一部分，否后必否前，可以推出，当选；\nB项：翻译为：青藏高原降水增加 或 冰川加速消融\u003cimg data-k=\"a37757d411ef\">潜在的流域合并，是对题干的肯前，肯前必肯后，应推出“潜在的流域合并 或 重组”，而非“潜在的流域合并”，不能推出，排除；\nC项：翻译为：\u003cimg data-k=\"0be436194951\">青藏高原降水增加\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">潜在的流域合并和重组，是否定题干箭头前“或关系”的一部分，不是否前，且否前得不到确定结论，不能推出，排除；\nD项：翻译为：青藏高原的流域合并 或 重组\u003cimg data-k=\"a37757d411ef\">青藏高原降水增加，是肯定题干箭头后“且关系”的一部分，不是肯后，且肯后得不到确定结论，不能推出，排除。\n故正确答案为A。","no":74,"missingImage":false},{"type":"question","qid":"16070197","cat":"逻辑判断","stem":"鱼通过鳃的呼吸作用，从水中吸收钙离子，进入耳石囊内与碳酸根离子结合形成碳酸钙、随后沉积形成耳石，它具有维持鱼身平衡及辅助听觉的作用。鱼耳石的日周轮、年轮和产卵轮等时间记号，记录了鱼类生长过程中的环境信息。通过分析鱼耳石形态和化学组成等方式，我们可以了解鱼类生活史特征及其栖息环境的变化。\n以下哪项如果为真，最能加强上述论证？","options":{"A":"许多鱼类的寿命可长达数十年之久","B":"环境污染可能导致鱼停止生长甚至死亡","C":"不同鱼类的耳石大小不同，难以据此判断鱼类的生长环境情况","D":"相对于鳞片、鳍条，鱼耳石的形态结构和化学组成更稳定，保存时间更长"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：通过分析鱼耳石形态和化学组成等方式，我们可以了解鱼类生活史特征及其栖息环境的变化。\n论据：鱼耳石的日周轮、年轮和产卵轮等时间记号，记录了鱼类生长过程中的环境信息。\n本题论点和论据均在讨论“分析鱼耳石有助于了解鱼类生活的环境”，二者话题一致，加强可以考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是许多鱼类的寿命很长，而论点讨论的是分析鱼耳石有助于了解鱼类生活的环境，话题不一致，不能加强，排除;\nB项：该项说的是环境污染对鱼的不良影响，而论点讨论的是分析鱼耳石有助于了解鱼类生活的环境，话题不一致，不能加强，排除;\nC项：该项说的是根据耳石难以判断鱼类的生长环境，是对论点进行削弱，不能加强，排除;\nD项：该项说的是鱼耳石形态结构和化学组成更稳定，保存时间更长，补充论据说明鱼耳石在了解鱼类的生活史特征及其栖息环境的变化方面更有优势，可以加强，当选。\n故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"16070289","cat":"逻辑判断","stem":"紫杉醇是治疗癌症的明星药物。紫杉醇通过作用于细胞内的微管蛋白，保持微管的稳定性来抑制细胞的有丝分裂，控制癌细胞发展，从而达到治疗目的。香榧中含有紫杉醇，因此，有观点认为，多食用香榧可以治疗癌症。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"紫杉醇对正常细胞产生的影响目前还未可知","B":"香榧中紫杉醇含量微乎其微，几乎可以忽略不计","C":"香榧含有丰富的蛋白质，可以增强癌症患者的免疫力","D":"对于分裂速度比正常细胞快的癌细胞，紫杉醇表现出更明显的抑制作用"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：多食用香榧可以治疗癌症。\n论据：香榧中含有紫杉醇，紫杉醇通过作用于细胞内的微管蛋白，保持微管的稳定性来抑制细胞的有丝分裂，控制癌细胞发展，从而达到治疗目的。\n本题论点在讨论“多食用香榧可以治疗癌症”，论据在讨论“香榧中的紫杉醇能治疗癌症”，论点和论据话题不一致，削弱优先考虑拆桥，即拆断“食用香榧”和“紫杉醇”之间的联系。\n第二步：逐一分析选项。\nA项：该项指出“紫杉醇对正常细胞产生的影响目前还未可知”，而题干讨论的是“紫杉醇对癌细胞的影响”，话题不一致，无法削弱，排除；\nB项：论点讨论的是“多食用香榧可以治疗癌症”，原因是“香榧中的紫杉醇能治疗癌症”，该项指出“香榧中紫杉醇含量微乎其微，几乎可以忽略不计”，即不能通过日常食用香榧取得治疗癌症的效果，断开了论点和论据之间的联系，为拆桥项，可以削弱，当选；\nC项：该项指出“香榧可以增强癌症患者的免疫力”，但增强免疫力不等于可以治疗癌症，话题不一致，无法削弱，排除；\nD项：该项指出“紫杉醇能抑制癌细胞”，补充论据，为加强项，无法削弱，排除。\n故正确答案为B。","no":76,"missingImage":false},{"type":"question","qid":"16070203","cat":"逻辑判断","stem":"一项关于离子通道Piezo2的介导性慢性疼痛超敏反应功能的研究表明，Piezo2是一个机械敏感通道，会在压力的刺激下激活伤害性感受器，当Piezo2发生功能丧失型突变时，患者对轻微的触摸或振动不再敏感；当它发生功能获得型突变时，患者通常被诊断为其它疾病。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"有的慢性疼痛综合征患者的伤害性感受器在无机械刺激时仍然活跃","B":"有的Piezo2功能丧失型突变患者在强烈挤压皮肤时激活了伤害性感受器","C":"有的患者发生Piezo2功能获得型突变，被诊断出患有复杂发育障碍疾病","D":"有的患者发生Piezo2功能丧失型突变，伤害性感受器对机械刺激更敏感"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：Piezo2是一个机械敏感通道，会在压力的刺激下激活伤害性感受器，当Piezo2发生功能丧失型突变时，患者对轻微的触摸或振动不再敏感；当它发生功能获得型突变时，患者通常被诊断为其它疾病。\n论据：无。\n本题论点讨论的是Piezo2会在压力的刺激下激活伤害性感受器，并给出Piezo2功能丧失型突变和功能获得型突变的两种表现。只有论点，没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出有的慢性疼痛综合征患者伤害性感受器在“无机械刺激时”仍活跃，而论点讨论的是Piezo2通道在“压力刺激时”的表现，话题不一致，无法削弱，排除；\nB项：该项指出有的Piezo2功能丧失型突变患者在“强烈挤压皮肤时”激活了伤害性感受器，但不明确其在“轻微的触摸或振动时”是否能激活伤害性感受器，不明确选项，无法削弱，排除；\nC项：该项指出有的患者发生Piezo2功能获得型突变，被诊断出患有复杂发育障碍疾病，对论点中“发生功能获得型突变时，患者通常被诊断为其它疾病”进行支持，具有一定加强力度，无法削弱，排除；\nD项：该项指出有的患者发生Piezo2功能丧失型突变，伤害性感受器对机械刺激更敏感，举例削弱论点中“Piezo2发生功能丧失型突变时，患者对轻微的触摸或振动不再敏感”，削弱论点，可以削弱，当选。\n故正确答案为D。","no":77,"missingImage":false},{"type":"question","qid":"17467563","cat":"类比推理","stem":"小王把仙女座、猎户座、大熊座、人马座、狮子座五个星座在星空图上的位置用A、B、C、D、E随机标记。已知：如果仙女座或猎户座中有一个在位置C上，则大熊座在位置B上；如果狮子座在位置C上，则人马座在位置E上。\n如果人马座在位置B上，那么下列哪项必然为真？","options":{"A":"大熊座在位置C上","B":"狮子座在位置C上","C":"仙女座在位置C上","D":"猎户座在位置C上"},"answer":"A","explanation":"第一步：翻译题干条件。\n（1）仙女座在位置C 或 猎户座在位置C\u003cimg data-k=\"a37757d411ef\">大熊座在位置B；\n（2）狮子座在位置C\u003cimg data-k=\"a37757d411ef\">人马座在位置E；\n（3）人马座在位置B。\n第二步：根据题干条件进行推理。\n根据条件（3）人马座在位置B，可知大熊座不在位置B，是对条件（1）的否后，根据否后必否前，可以推出仙女座不在位置C且猎户座不在位置C，排除C、D两项；\n根据条件（3）人马座在位置B，可知人马座不在位置E，是对条件（2）的否后，根据否后必否前，可以推出狮子座不在位置C，排除B项。\n故正确答案为A。","no":78,"missingImage":false},{"type":"question","qid":"16070296","cat":"逻辑判断","stem":"甲、乙、丙、丁、戊、己、庚7人分别去P、Q、R、S四个不同的值班点，根据工作安排，每个值班点至少有1人，至多有3人；每个人只能去1个值班点；要求Q值班点有3人值班。同时，还需满足下列条件：\n（1）去R值班点的人数与去P值班点的人数一样\n（2）如果甲、乙、丙中至多2人去Q值班点，那么只有丁去S值班点\n（3）只有乙和庚去S值班点，丁或戊才不去S值班点\n根据上述信息，下列哪项必然为真？","options":{"A":"乙去Q值班点，戊去S值班点","B":"甲去Q值班点，丁去P值班点","C":"己去P值班点，庚去R值班点","D":"丙去P值班点，戊去S值班点"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）甲、乙、丙、丁、戊、己、庚7人去P、Q、R、S四个值班点，每个值班点至少有1人，至多有3人，每个人只能去1个值班点，Q值班点有3人；\n（2）R值班点人数=P值班点人数；\n（3）甲、乙、丙至多2人去Q值班点\u003cimg data-k=\"a37757d411ef\">只有丁去S值班点；\n（4）丁 或 戊不去S值班点\u003cimg data-k=\"a37757d411ef\">乙和庚去S值班点。\n第二步：根据题干条件进行推理。\n由条件（1）（2）可确定各值班点的人数为Q值班点3人、S值班点2人、P值班点1人、R值班点1人。S值班点2人是对条件（3）的否后，否后必否前，可推知甲、乙、丙3人均去Q值班点。乙去Q值班点，就不能再去S值班点，是对条件（4）的否后，否后必否前，可推知丁、戊均去S值班点。己、庚的值班点无法确定，只有A项必然为真。\n故正确答案为A。","no":79,"missingImage":false},{"type":"question","qid":"16069970","cat":"类比推理","stem":"寓意：寓言","options":{"A":"序言：正文","B":"情节：童话","C":"报告文学：新闻","D":"著作：诗集"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n寓言是用假托的故事或自然物的拟人手法来说明某个道理或教训的文学作品，寓意是寓言所包含的核心内涵，二者是组成关系。\n第二步：判断选项词语间逻辑关系。\nA项：序言和正文是同一篇作品里的两个组成部分，二者是并列关系，与题干逻辑关系不一致，排除；\nB项：童话是通过丰富的想象、幻想和夸张来编写的适合于儿童欣赏的故事，情节是童话的核心组成部分，二者是组成关系，与题干逻辑关系一致，当选；\nC项：报告文学是一种散文体裁，以现实生活中具有典型意义的真人真事为题材,经过适当的艺术加工而成,兼有新闻报道特点，报告文学和新闻不是组成关系，与题干逻辑关系不一致，排除；\nD项：所有诗集都是著作，二者是种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":80,"missingImage":false},{"type":"question","qid":"17467545","cat":"类比推理","stem":"蛋白质：有机物","options":{"A":"故宫：北京","B":"5G基站：通讯设施","C":"显示屏：折叠屏","D":"固态硬盘：台式机硬盘"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n蛋白质是有机物，二者为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：故宫在北京，二者为地点对应关系，与题干逻辑关系不一致，排除；\nB项：5G基站是通讯设施，二者为种属关系，与题干逻辑关系一致，当选；\nC项：折叠屏是显示屏，二者为种属关系，但顺序与题干相反，与题干逻辑关系不一致，排除；\nD项：有的固态硬盘是台式机硬盘，有的固态硬盘不是台式机硬盘，有的台式机硬盘是固态硬盘，有的台式机硬盘不是固态硬盘，二者为交叉关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":81,"missingImage":false},{"type":"question","qid":"16069962","cat":"类比推理","stem":"鸡犬不宁：安居乐业","options":{"A":"羊质虎皮：色厉内荏","B":"莺歌燕舞：鸟语花香","C":"海底捞针：探囊取物","D":"蝇营狗苟：寡廉鲜耻"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“鸡犬不宁”意思是连鸡狗都不得安宁，形容搅扰得很厉害，“安居乐业”意思是安定地生活，愉快地工作，二者为反义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“羊质虎皮”意思是羊虽然披上虎皮，但怯弱的本性不变，比喻外强内弱，虚有其表，“色厉内荏”意思是外表强横，内心怯懦，形容外表凶恶强横，实际上内心虚弱怯懦，二者为近义关系，与题干逻辑关系不一致，排除；\nB项：“莺歌燕舞”意思是黄莺歌唱，燕子飞舞，形容大好春光或大好形势，“鸟语花香”意思是鸟儿叫，花儿飘香，多形容春天魅人的景象，二者为近义关系，与题干逻辑关系不一致，排除；\nC项：“海底捞针”比喻极难找到，“探囊取物”意思是伸手到袋子里取东西，比喻能够轻而易举地办成某件事情，二者为反义关系，与题干逻辑关系一致，当选；\nD项：“蝇营狗苟”意思是像苍蝇那样飞来飞去，像狗那样苟且偷生，形容人不顾廉耻，到处钻营，“寡廉鲜耻”意思是不廉洁，不知羞耻，二者为近义关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":82,"missingImage":false},{"type":"question","qid":"17467547","cat":"类比推理","stem":"杏仁：腰果：坚果","options":{"A":"餐具：饭碗：饭勺","B":"门框：门楣：门扇","C":"礼单：礼帖：礼仪","D":"火枪：火炮：火器"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n杏仁和腰果都是坚果，二者为并列关系中的反对关系，均与第三个词语构成包容关系中的种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：饭碗和饭勺都是餐具，二者为反对关系，均与第一个词语构成种属关系，词语顺序不同，与题干逻辑关系不一致，排除；\nB项：门楣是门框上部的横梁结构，二者为包容关系中的组成关系，与题干逻辑关系不一致，排除；\nC项：礼单和礼帖都是传统礼仪文书‌，二者为反对关系，但礼单和礼帖均是礼仪的体现，与第三个词语构成对应关系，与题干逻辑关系不一致，排除；\nD项：火枪和火炮都是火器，二者为反对关系，均与第三个词语构成种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":83,"missingImage":false},{"type":"question","qid":"16069961","cat":"类比推理","stem":"树枝：秸秆：柴火","options":{"A":"车前：沉香：中药","B":"尘土：烟雾：污染","C":"蚕蛾：蚊子：成虫","D":"火车：汽车：车厢"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n树枝和秸秆都是柴火，前两词为并列关系，均与第三词构成种属关系，且树枝、秸秆均为植物类。\n第二步：判断选项词语间逻辑关系。\nA项：车前和沉香都是中药，前两词为并列关系，均与第三词构成种属关系，且车前、沉香均为植物类，与题干逻辑关系一致，当选；\nB项：尘土和烟雾都是污染物，会导致污染，前两词为并列关系，均与第三词构成因果对应关系，与题干逻辑关系不一致，排除；\nC项：蚕和蚊子是完全变态昆虫，完全变态昆虫的发育需要经历卵、幼虫、蛹、成虫四个时期，蚕蛾和蚊子均是成虫，前两词为并列关系，均与第三词构成种属关系，但蚕和蚊子均为动物类，与题干逻辑关系不一致，排除；\nD项：火车和汽车都是交通工具，二者为并列关系，车厢为火车和汽车的组成部分，前两词均与第三词构成组成关系，与题干逻辑关系不一致，排除。\n\n故正确答案为A。","no":84,"missingImage":false},{"type":"question","qid":"16069965","cat":"类比推理","stem":"照相机：凸透镜：照相","options":{"A":"火炕：煤炭：取暖","B":"潜水艇：鱼鳔：潜水","C":"飞机：起落架：飞行","D":"微波炉：磁控管：烹饪"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n凸透镜是照相机的组成部分，二者为组成关系；照相是照相机的功能，且该功能依靠凸透镜实现。\n第二步：判断选项词语间逻辑关系。\nA项：煤炭在火炕里，二者为地点对应关系，不是组成关系，与题干逻辑关系不一致，排除；\nB项：鱼鳔是潜水艇设计灵感的来源，二者为仿生对应关系，不是组成关系，与题干逻辑关系不一致，排除；\nC项：起落架是飞机的组成部分，二者为组成关系；飞行是飞机的功能，但起落架的主要功能是帮助飞机起落，而非在飞行过程中使用，因此飞行功能不依靠起落架实现，与题干逻辑关系不一致，排除；\nD项：磁控管是微波炉的组成部分，二者为组成关系；烹饪是微波炉的功能，且该功能依靠磁控管实现，与题干逻辑关系一致，当选。\n故正确答案为D。","no":85,"missingImage":false},{"type":"question","qid":"17467543","cat":"类比推理","stem":"清明：传统节日：春节","options":{"A":"神话：民间文学：舞蹈","B":"手机：家用电器：冰箱","C":"电话：通讯工具：快递","D":"足球：体育用品：哑铃"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n清明和春节都是传统节日，二者为并列关系中的反对关系，且均与第二个词构成包容关系中的种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：舞蹈不是民间文学，后两词不构成种属关系，与题干逻辑关系不一致，排除；\nB项：手机不是家用电器，前两词不构成种属关系，与题干逻辑关系不一致，排除；\nC项：快递不是通讯工具，后两词不构成种属关系，与题干逻辑关系不一致，排除；\nD项：足球和哑铃都是体育用品，二者为反对关系，且均与第二个词构成种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"17467537","cat":"类比推理","stem":"光刻机 对于 （    ） 相当于 （    ） 对于 核燃料","options":{"A":"芯片  离心机","B":"计算器  核电站","C":"光盘  压铸机","D":"紫外线光源  核裂变"},"answer":"A","explanation":"逐一代入选项。\nA项：光刻机是生产芯片的设备，二者为生产设备与产品的对应关系；离心机是生产核燃料的设备，二者为生产设备与产品的对应关系，前后逻辑关系一致，当选；\nB项：光刻机是生产计算器中的芯片的设备，二者对应关系；核燃料是核电站的能量来源，二者为能量来源的对应关系，前后逻辑关系不一致，排除；\nC项：光刻机是生产芯片的设备，光盘是一种利用激光扫描记录和读取信息的光学存储介质，二者没有明显逻辑关系；压铸机是用于压力铸造的机器，核燃料是可在核反应堆中通过核裂变或核聚变释放核能的材料，二者没有明显逻辑关系，前后逻辑关系不一致，排除；\nD项：紫外线光源是光刻机的组成部分，二者为组成关系；核裂变是核燃料释放能量的方式，二者为对应关系，前后逻辑关系不一致，排除。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"16070195","cat":"类比推理","stem":"（    ）对于 庐山 相当于 车水马龙 对于（    ）","options":{"A":"游人如织 街市","B":"惊鸿一瞥 人群","C":"天然画卷 剧场","D":"鬼斧神工 陋巷"},"answer":"A","explanation":"逐一代入选项。\nA项：游人如织形容游人多得像织布的线一样，密密麻麻，可以用来形容庐山的景象，二者为特点与描述对象的对应关系；车水马龙指车如流水，马如游龙一般，形容热闹繁华的景象，可以用来形容街市，二者为特点与描述对象的对应关系，前后逻辑关系一致，当选；\nB项：惊鸿一瞥指人只是匆匆看了一眼，却给人留下极深的印象，与庐山无明显逻辑关系；车水马龙指车如流水，马如游龙一般，形容热闹繁华的景象，不能用来形容人群，前后逻辑关系不一致，排除；\nC项：天然画卷指自然形成的、未经人工加工修饰的美丽景观，可以用来形容庐山的景象；车水马龙指车如流水，马如游龙一般，形容热闹繁华的景象，不能用来形容剧场，前后逻辑关系不一致，排除；\nD项：鬼斧神工原意是像鬼神制作出来的，形容艺术技巧高超，不像是人力所能达到的，可以用来形容庐山的景象；车水马龙指车如流水，马如游龙一般，形容热闹繁华的景象，不能用来形容陋巷，前后逻辑关系不一致，排除。\n故正确答案为A。","no":88,"missingImage":false},{"type":"question","qid":"16070194","cat":"类比推理","stem":"龙葵碱 对于 （    ） 相当于 （    ） 对于 面团发酵","options":{"A":"芝麻开花；无氧呼吸","B":"土豆发芽；二氧化碳","C":"冬瓜落霜；线粒体","D":"香蕉成熟；葡萄糖"},"answer":"B","explanation":"逐一代入选项。\nA项：“芝麻开花”是芝麻植株生长的一个自然阶段，与“龙葵碱”无明显逻辑关系；“无氧呼吸”是“面团发酵”过程中酵母等微生物所采用的一种生理过程，二者为对应关系，前后逻辑关系不一致，排除；\nB项：“土豆发芽”会产生“龙葵碱”，二者为活动与其产物的对应关系；“面团发酵”过程中酵母等微生物代谢会产生“二氧化碳”，二者为活动与其产物的对应关系，前后逻辑关系一致，当选；\nC项：“冬瓜落霜”是指冬瓜在成熟的时候，表面会生出一层白霜，和“龙葵碱”无明显逻辑关系；“线粒体”是酵母菌的细胞器，酵母菌可以用来“面团发酵”，二者为对应关系，前后逻辑关系不一致，排除；\nD项：“香蕉成熟”与“龙葵碱”无明显逻辑关系；“葡萄糖”是“面团发酵”过程中酵母进行发酵作用的重要能量来源和底物，二者为对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":89,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        近年来，我国低空经济发展表现出巨大潜力，2023年底全国低空经济规模超5000亿元，2030年底有望达到2万亿元。截至2024年底，全国在册通用机场达475个，较2023年增加26个。截至2023年底，全国通用航空企业达689家，在册通用航空器数量3303架，通用航空完成飞行时长137.1万小时，同比增长12.4%。其中，载客类完成2.8万小时，同比增长55.1%，载人类完成14.5万小时，同比增长34.7%，其他类完成69.6万小时，同比增长8.3%；非经营性作业时长完成50.2万小时，同比增长11.2%。\u003c/p>\u003cp> function fmtClock(sec){

       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）

function resolveImgs(root){

    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,

};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);

  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')

  p.modules.forEach(function(m){

function questionHtml(q){

        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
