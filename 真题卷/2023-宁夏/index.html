<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2023-宁夏","title":"2023年宁夏公务员录用考试《行测》题（网友回忆版）","year":"2023","group":"宁夏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"5509458","cat":"时事政治","stem":"党的二十大报告指出，全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。下列事例体现了全过程人民民主的有几项？\n①某地人代会开会前，群众代表通过初审政府预算草案，提出修改意见，监督管好政府“钱袋子”，使公共资金使用更好反映人民意愿\n②某地居委会和社区一同组织居民讨论社区公共服务资金的分配使用规划，居民通过各种创新的基层协商民主方式，让财政决策更接地气\n③某直播平台开展了“最美建筑摄影”网络投票活动，众多摄影爱好者纷纷拍摄并投稿，网友们通过公平公正公开的方式评选出“最高人气奖”\n④某政府网络平台开辟了“领导留言板”栏目，群众可直接给政府主要负责同志留言，提出意见和诉求","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","explanation":"本题考查政治常识。\n①正确，党的二十大报告指出：“协商民主是实践全过程人民民主的重要形式。完善协商民主体系，统筹推进政党协商、人大协商、政府协商、政协协商、人民团体协商、基层协商以及社会组织协商，健全各种制度化协商平台，推进协商民主广泛多层制度化发展。”群众代表通过初审政府预算草案是协商民主的一种，体现了全过程人民民主。\n②正确，党的二十大报告指出：“基层民主是全过程人民民主的重要体现。健全基层党组织领导的基层群众自治机制，加强基层组织建设，完善基层直接民主制度体系和工作体系，增强城乡社区群众自我管理、自我服务、自我教育、自我监督的实效。”某地居委会和社区一同组织居民讨论社区公共服务资金的分配使用规划，属于基层民主，体现了全过程人民民主。\n③错误，某直播平台开展的网络投票活动属于平台自行开展的民间活动，与全过程人民民主无关。\n④正确，党的二十大报告指出：“发展全过程人民民主，保障人民当家作主。我们要健全人民当家作主制度体系，扩大人民有序政治参与，保证人民依法实行民主选举、民主协商、民主决策、民主管理、民主监督，发挥人民群众积极性、主动性、创造性，巩固和发展生动活泼、安定团结的政治局面。”某政府网络平台开辟了“领导留言板”栏目，属于民主监督，体现了全过程人民民主。\n综上所述，体现了全过程人民民主的有①②④，共3项。\n故正确答案为C。","no":1,"missingImage":false},{"type":"question","qid":"5509469","cat":"新思想","stem":"党的十八大以来，以习近平同志为核心的党中央不断推进人民代表大会制度理论创新和实践创新，主要体现在“六个方面”。下列不属于这“六个方面”内容的是：","options":{"A":"必须坚持全面依法治国，必须坚持民主集中制","B":"必须坚持全面从严治党，必须坚持进一步推进政治体制改革","C":"必须坚持中国共产党领导，必须坚持用制度体系保障人民当家作主","D":"必须坚持中国特色社会主义政治发展道路，必须坚持推进国家治理体系和治理能力现代化"},"answer":"B","explanation":"本题考查政治常识。\nA、C、D三项正确，B项错误，2021年10月，中央人大工作会议在北京召开，习近平同志发表重要讲话时强调，党的十八大以来，党中央统筹中华民族伟大复兴战略全局和世界百年未有之大变局，从坚持和完善党的领导、巩固中国特色社会主义制度的战略全局出发，继续推进人民代表大会制度理论和实践创新，提出一系列新理念新思想新要求，强调必须坚持中国共产党领导，必须坚持用制度体系保障人民当家作主，必须坚持全面依法治国，必须坚持民主集中制，必须坚持中国特色社会主义政治发展道路，必须坚持推进国家治理体系和治理能力现代化。\n本题为选非题，故正确答案为B。","no":2,"missingImage":false},{"type":"question","qid":"5509473","cat":"时事政治","stem":"为在新发展阶段持续深入推进依法行政，全面建设法治政府，中共中央、国务院印发了《法治政府建设实施纲要（2021—2025年）》。下列属于《法治政府建设实施纲要（2021—2025年）》内容的有几项？\n①深入学习贯彻习近平法治思想，努力实现法治政府建设全面突破\n②健全依法行政制度体系，加快推进政府治理规范化程序化法治化\n③健全社会矛盾纠纷行政预防调处化解体系，不断促进社会公平正义\n④推进公正司法，各级党政机关支持法院、检察院独立公正行使职权\n⑤将“实行依法治国，建设社会主义法治国家”写入宪法，法治建设揭开新篇章","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"B","explanation":"本题考查政治常识。\n2021年8月，中共中央、国务院印发了《法治政府建设实施纲要（2021—2025年）》（下文简称《纲要》），并发出通知，要求各地区各部门结合实际认真贯彻落实。\n①项正确，《纲要》指出：“一、深入学习贯彻习近平法治思想，努力实现法治政府建设全面突破。党的十八大以来，特别是《法治政府建设实施纲要（2015－2020年）》贯彻落实5年来，各地区各部门多措并举、改革创新，法治政府建设取得重大进展。”\n②项正确，《纲要》指出：“三、健全依法行政制度体系，加快推进政府治理规范化程序化法治化。坚持科学立法、民主立法、依法立法，着力实现政府立法质量和效率并重并进，增强针对性、及时性、系统性、可操作性，努力使政府治理各方面制度更加健全、更加完善。”\n③项正确，《纲要》指出：“七、健全社会矛盾纠纷行政预防调处化解体系，不断促进社会公平正义。坚持将矛盾纠纷化解在萌芽状态、化解在基层，着力实现人民群众权益受到公平对待、尊严获得应有尊重，推动完善信访、调解、仲裁、行政裁决、行政复议、诉讼等社会矛盾纠纷多元预防调处化解综合机制。”\n④项错误，《纲要》指出：“七、健全社会矛盾纠纷行政预防调处化解体系，不断促进社会公平正义······支持法院依法受理和审理行政案件，切实履行生效裁判。支持检察院开展行政诉讼监督工作和行政公益诉讼，积极主动履行职责或者纠正违法行为。”《纲要》原文中没有提及“推进公正司法，各级党政机关支持法院、检察院独立公正行使职权”。\n⑤项错误，1999年3月，九届全国人大二次会议将“依法治国，建设社会主义法治国家”载入宪法。这是社会主义民主政治发展的重要成果，标志着我国社会主义民主法制建设进入一个新阶段。《纲要》原文中没有提及。\n综上所述，属于《纲要》内容的有①②③，共3项。\n故正确答案为B。","no":3,"missingImage":false},{"type":"question","qid":"5509464","cat":"时事政治","stem":"党的二十大报告指出，全面建设社会主义现代化国家，必须有一支政治过硬、适应新时代要求、具备领导现代化建设能力的干部队伍。下列与之相关的说法正确的有几项？\n①加强实践锻炼、专业训练，注重在重大斗争中磨砺干部，增强干部推动高质量发展本领、服务群众本领、防范化解风险本领\n②坚持党管干部原则，坚持德才兼备、以德为先、五湖四海、任人唯贤，把新时代好干部标准落到实处\n③树立选人用人正确导向，选拔忠诚干净担当的高素质专业化干部，选优配强各级领导班子\n④坚持把政治标准放在首位，做深做实干部政治素质考察，突出把好政治关、廉洁关","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"D","explanation":"本题考查政治常识。\n党的二十大报告中“十五、坚定不移全面从严治党，深入推进新时代党的建设新的伟大工程”部分的“（四）建设堪当民族复兴重任的高素质干部队伍”指出：“······坚持党管干部原则，坚持德才兼备、以德为先、五湖四海、任人唯贤，把新时代好干部标准落到实处。树立选人用人正确导向，选拔忠诚干净担当的高素质专业化干部，选优配强各级领导班子。坚持把政治标准放在首位，做深做实干部政治素质考察，突出把好政治关、廉洁关。加强实践锻炼、专业训练，注重在重大斗争中磨砺干部，增强干部推动高质量发展本领、服务群众本领、防范化解风险本领······”\n综上所述，与之相关的说法正确的有①②③④，共4项。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"5509848","cat":"新思想","stem":"下列习近平总书记讲话内容与所涉及的省区对应正确的有几项：\n①盐湖资源是全国的战略性资源——青海\n②让黄花成为乡亲们的“致富花”——山西\n③奋力谱写雪域高原长治久安和高质量发展新篇章——西藏\n④从黄浦江畔搬到渭水之滨，你们打起背包就出发，舍小家顾大家——陕西","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"D","explanation":"本题考查政治常识。\n①正确，2016年8月，习近平总书记在青海考察时指出：“盐湖资源是青海的第一大资源，也是全国的战略性资源，务必处理好资源开发利用和生态环境保护的关系。发展循环经济是提高资源利用效率的必由之路，要牢固树立绿色发展理念，积极推动区内相关产业流程、技术、工艺创新，努力做到低消耗、低排放、高效益，让盐湖这一宝贵资源永续造福人民。”\n②正确，2020年5月11日，习近平总书记视察山西省大同市云州区有机黄花标准化种植基地时，嘱托当地百姓：“希望把黄花产业保护好、发展好，做成大产业，做成全国知名品牌，让黄花成为乡亲们的‘致富花’。”\n③正确，2021年7月，西藏和平解放70周年之际，习近平总书记来到雪域高原。在西藏考察期间，习近平总书记强调，要全面贯彻新时代党的治藏方略，坚持稳中求进工作总基调，立足新发展阶段，完整、准确、全面贯彻新发展理念，服务和融入新发展格局，推动高质量发展，加强边境地区建设，抓好稳定、发展、生态、强边四件大事，在推动青藏高原生态保护和可持续发展上不断取得新成就，奋力谱写雪域高原长治久安和高质量发展新篇章。\n④正确，2020年4月22日，在陕西考察的习近平总书记走进交大西迁博物馆，亲切会见14位西迁老教授。习近平总书记谈起老教授们两年前给他写的一封来信，“看了你们的信我非常感动，产生了强烈共鸣”。习近平总书记说：“从黄浦江畔搬到渭水之滨，你们打起背包就出发，舍小家顾大家。交大西迁对整个国家和民族来讲、对西部发展战略布局来讲，意义都十分重大。”\n综上所述，对应正确的有①②③④，共4项。\n故正确答案为D。","no":5,"missingImage":false}],"count":5,"answerable":5,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"5509767","cat":"人文常识","stem":"成语作为中国传统文化的一大特色，很多都来源于历史生活，下列成语、主要人物及时期对应正确的是：","options":{"A":"窃符救赵——魏无忌——春秋","B":"封狼居胥——卫青——汉朝","C":"东床坦腹——王羲之——东晋","D":"目不窥园——范仲淹——宋朝"},"answer":"C","explanation":"本题考查人文常识。\nA项错误，战国时期，秦国围困赵国都城邯郸，赵国求救于魏国，魏国惧怕秦国，不敢出兵救赵。情急之下，信陵君魏无忌听取侯赢之计，以国家利益为重，置生死度外，借魏王姬妾如姬之手窃得兵符，夺取了魏国兵权，不仅成功击败秦军、救援了赵国，也巩固了魏国在当时的地位。窃符救赵的主人公为战国时期的魏无忌，而非春秋时期。\nB项错误，封狼居胥，指西汉大将霍去病登狼居胥山筑坛祭天以告成功之事，出自于《汉书·霍去病传》，后来封狼居胥成为中华民族武将的最高荣誉之一。封狼居胥的主人公为霍去病，而非卫青。\nC项正确，东床坦腹，指东晋王羲之，面临高官选女婿时，在东边的床上露出肚皮看书，被高官看中，高官将女儿许配给了王羲之。\nD项错误，目不窥园，指西汉董仲舒读书非常刻苦认真，他的书房紧靠着姹紫嫣红的花园，他三年没有进过花园，无暇观赏花园中的景致。目不窥园的主人公为西汉董仲舒，而非宋朝范仲淹。\n故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"5509474","cat":"科技常识","stem":"关于微生物，下列说法错误的是：","options":{"A":"双歧杆菌是一种对人体有益的细菌","B":"感染幽门螺杆菌会导致急性肠胃炎","C":"食用未煮熟的鸡蛋可能感染沙门氏菌","D":"豆科植物根部的根瘤菌具有固氮作用"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，双歧杆菌是一种革兰氏阳性、不运动、细胞呈杆状、一端有时呈分叉状、严格厌氧的细菌属，是一种重要的肠道有益微生物。双歧杆菌作为一种生理性有益菌，对人体健康具有生物屏障、营养作用、抗肿瘤作用、免疫增强作用、改善胃肠道功能、抗衰老等多种重要的生理功能。\nB项错误，幽门螺杆菌是定植于胃内的一种细菌，幽门螺杆菌感染是慢性胃病的主要病因，与慢性胃炎、消化性溃疡、胃癌，以及胃黏膜相关组织淋巴瘤有着密切的关系。幽门螺杆菌喜欢胃内的酸性环境，不会定植于肠道。急性肠胃炎是指各种原因引起的胃肠黏膜的急性炎症，通常因进食不洁、生冷或刺激性食物而诱发，病因包括细菌、病毒、寄生虫感染等。\nC项正确，沙门氏菌是一种常见的食源性致病菌，在各种肉类、禽蛋、蔬菜、水果中都存在一定量的沙门氏菌；如果鸡蛋中携带沙门氏菌，未经加热而直接食用，或加热不完全，就有可能被沙门氏菌感染。\nD项正确，根瘤菌是能与豆科植物共生形成根瘤，并将空气中的氮还原成氨供植物营养的一类革兰氏阴性菌。在豆科植物的根瘤中，有能够固氮的根瘤菌与豆科植物共生，根瘤菌有固氮作用，能将空气中的氮转化为植物能吸收的含氮物质，而植物则为根瘤菌提供有机物。\n本题为选非题，故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"5509457","cat":"法律常识","stem":"下列属于《中华人民共和国劳动法》所调整的劳动关系的是：","options":{"A":"大学生小张利用假期到餐馆打工","B":"王某雇请保姆为其提供家务劳动","C":"村民老马在农忙时雇请他人为其收割庄稼","D":"大学英语教师小李在某国领事馆兼职从事翻译工作"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国劳动法》第二条第一款规定：“在中华人民共和国境内的企业、个体经济组织（以下统称用人单位）和与之形成劳动关系的劳动者，适用本法。”\nB、C两项错误，根据《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》第二条第四项、第六项规定：“下列纠纷不属于劳动争议：（四）家庭或者个人与家政服务人员之间的纠纷；（六）农村承包经营户与受雇人之间的纠纷。”\nD项错误，外国驻我国的大使馆属于外交代表机构，其性质属于国外的机关单位，不属于《中华人民共和国劳动法》规定的用人单位，小李与其不构成劳动关系。\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"5509480","cat":"人文常识","stem":"下列关于革命遗址及革命纪念建筑物的说法错误的是：","options":{"A":"广州农民运动讲习所旧址——毛泽东曾在此担任农民运动讲习所所长","B":"秋收起义文家市会师旧址——红军在此确立了“十六字诀”游击战术","C":"北京大学红楼——李大钊曾在此传播马克思主义和民主科学进步思想","D":"八路军总司令部旧址——彭德怀等人在此直接布置和指挥了百团大战"},"answer":"B","explanation":"本题考查毛中特。\nA项正确，广州农民运动讲习所是第一次国共合作时期培养农民运动干部的学校，1924年7月至1926年9月举办过六届，培养了800多名学员，为中国革命输送了大批干部。第六届农民运动讲习所由毛泽东担任所长。\nB项错误，1929年4月5日，毛泽东在《红军第四军前委给中共中央的信》中，将红军游击战争的作战原则，正式概括为“敌进我退，敌驻我扰，敌疲我打，敌退我追”。而秋收起义是1927年9月9日，由毛泽东在湖南东部和江西西部领导的工农革命军（即红军）举行的一次武装起义。\nC项正确，1918年初，李大钊在北京大学红楼创建了马克思主义研究小组，蔡元培时任北京大学校长。\nD项正确，武乡八路军总司令部旧址，是抗日战争期间八路军总部所在地，位于山西省长治市武乡县，由武乡县王家峪旧址和砖壁旧址组成。1961年，国务院将王家峪八路军总部旧址和砖壁八路军总部旧址列为全国第一批重点文物保护单位。彭德怀等人在此直接布置和指挥了百团大战。\n本题为选非题，故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"5509461","cat":"科技常识","stem":"激光技术指采用激光手段对特定目标进行加工或者检测的技术。下列与激光技术有关的说法错误的是：","options":{"A":"激光的理论基础由爱因斯坦在1917年提出","B":"激光技术可以实现材料加工、物态转变、尺度测量","C":"目前我国是世界上唯一能制造实用化深紫外全固态激光的国家","D":"我国于1960年成功制造出第一台激光器，促进了激光技术发展"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，激光的理论基础由物理学家爱因斯坦提出，1917年爱因斯坦提出了一套全新的技术理论“光与物质相互作用”。这一理论是说在组成物质的原子中，有不同数量的粒子（电子）分布在不同的能级上，在高能级上的粒子受到某种光子的激发，会从高能级跳到（跃迁）到低能级上。这时将会辐射出与激发它的光相同性质的光，即激光。\nB项正确，激光技术是采用激光的手段，对特定目标进行加工或者检测的技术。它可以实现材料加工、物态转变、尺度测量等。\nC项正确，2013年9月6日，由中科院承担的国家重大科研装备“深紫外固态激光源前沿装备研制项目”通过验收，使我国成为目前世界上唯一一个能够制造实用化、精密化深紫外全固态激光的国家。\nD项错误，世界上第一台激光器诞生于1960年。中国第一台激光器于1961年诞生于长春光机所，由“中国激光之父”、物理学家王之江等人研制。\n本题为选非题，故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"5509766","cat":"人文常识","stem":"下列关于我国传统乐器的说法错误的是：","options":{"A":"笛是汉族乐器中最具代表性最有民族特色的吹奏乐器","B":"唢呐在传统的定调方法里，是以使用的乐器为依据的","C":"埙是我国西北少数民族特有的吹奏乐器，形似笙而较大","D":"葫芦丝是云南少数民族乐器，其起源可追溯到先秦时期"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，笛子属于管乐类，是汉族乐器中最具代表性最有民族特色的吹奏乐器，也是迄今为止发现的最古老的汉族乐器。\nB项正确，唢呐在传统的定调方法里，是以使用的乐器为依据的。不论尺寸长短或木管粗细，一律以全按（把所有的音孔都按上，也就是筒音）称为“本调”。\nC项错误，埙是汉族特有的闭口吹奏乐器，音色朴拙，其起源与汉族先民的劳动生产活动有关，最初可能是先民们模仿鸟兽叫声而制作，用以诱捕猎物，后随社会进步而演化为单纯的乐器，在古代是用陶土烧制的一种吹奏乐器，圆形或椭圆形。\nD项正确，葫芦丝，又称“葫芦箫”，是云南少数民族乐器，其历史较为悠久，其渊源可追溯到先秦时代。\n本题为选非题，故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"5510081","cat":"科技常识","stem":"地球系统是指由大气圈、水圈、陆圈和生物圈组成的有机整体。下列相关的说法正确的是：","options":{"A":"地球系统的主要能量来源是太阳","B":"地球系统具有绝对的独立性和封闭性","C":"生态系统发生改变时不会影响地球系统的平衡","D":"与海水和大气相比，板块发生改变的时间比较短"},"answer":"A","explanation":"本题考查地理国情。\nA项正确，地球系统的主要能量来源是太阳，人类所需能量的绝大部分都直接或间接地来自太阳，各种植物通过光合作用把太阳能转变成化学能在体内贮存下来。\nB项错误，地球系统本身具有独特的发生、发展、演化特征，即具有相对的独立性和封闭性；同时也具有很强的开放性，其发生、发展与演化与所处的宇宙环境是分不开的。从某种意义上说，地球系统的封闭性只是相对的，而开放性则是绝对的和更重要的。\nC项错误，生态系统指在自然界的一定的空间内，生物与环境构成的统一整体，在这个统一整体中，生物与环境之间相互影响、相互制约，并在一定时期内处于相对稳定的动态平衡状态。地球系统的平衡主要就是生态系统的平衡，因此生态系统发生改变时，会影响地球系统的平衡。\nD项错误，板块构造运动始于约32亿年前，虽然这些板块以每年几厘米的速度缓慢移动着，但却能使地球的海陆面貌发生巨大的变化。而盛行风、地转偏向力等因素影响着海水运动；太阳辐射等因素影响着大气运动。相比之下，板块发生改变的时间很漫长。\n故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"5509831","cat":"科技常识","stem":"北京2022年冬残奥会闭幕式融入了天干地支元素，下列关于天干地支的说法正确的是：","options":{"A":"天干和地支的数目相同","B":"生肖与地支可以一一对应","C":"黄道十二宫以天干命名","D":"干支纪年周期为12周年"},"answer":"B","explanation":"本题考查人文常识。\nA项错误，天干地支，简称为干支，源自中国远古时代对天象的观测，有十天干和十二地支。\nB项正确，十二生肖和十二地支能够一一对应，为子鼠、丑牛、寅虎、卯兔、辰龙、巳蛇、午马、未羊、申猴、酉鸡、戌狗、亥猪。\nC项错误，黄道十二宫的宫名是借用附近的星座名字，即白羊宫、金牛宫、双子宫、巨蟹宫、狮子宫、室女宫、天秤宫、天蝎宫、人马宫、摩羯宫、宝瓶宫和双鱼宫。\nD项错误，干支是天干和地支的总称，十天干和十二地支依次相配，组成六十个基本单位，干支纪年周期为60周年。\n故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"5509525","cat":"人文常识","stem":"截止2022年底，中国位居全球风力发电装机总量第一位。下列与风力发电有关的说法错误的是：","options":{"A":"目前新式风力发电机发出的电通常为交流电","B":"风力发电的功率大小只取决于发电机的功率","C":"风力发电机组主要由风轮、发电机和塔筒组成","D":"全球风能总量远远超过可开发利用的水能总量"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，由于风量不稳定，风力发电机输出的是13-25V交流电，经过充电器整流后给蓄电池充电，这样风力发电机产生的电能就变成化学能。然后利用带保护电路的逆变电源将电池中的化学能转换成标准市电，保证稳定使用。\nB项错误，风力发电的实际功率大小主要由输入到风轮的风能（取决于风速、风轮扫掠面积和空气密度）以及整机的能量转换效率决定。发电机的额定功率仅为机组在额定工况下可达到的功率上限，而非决定因素。蓄电池是储能装置，其容量大小不影响实时发电功率，只决定电能的储存时长。\nC项正确，风力发电机组大体上可分风轮（包括尾舵）、发电机和塔筒三部分。风轮由若干只叶片组成，尾舵是用来保持风轮始终对准风向以获得最大的功率的机器，一般只有小型（包括家用型）才会拥有尾舵。发电机是将动能转换成电能的机器。塔筒是支承风轮、尾舵和发电机的构架。\nD项正确，风能是地球表面大量空气流动所产生的动能。据估算，全世界风能总量约1300亿千瓦，其中可利用的风能为200亿千瓦，比地球上可开发利用的水能总量还要多10倍，高达每年53万亿千瓦时。\n本题为选非题，故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"5509470","cat":"经济常识","stem":"宋朝是我国历史上商品经济、文化教育、科学创新高度繁荣的时代。下列选项中描述的景象，可能出现在宋朝的有几项？\n①社会出现严重通货膨胀\n②百姓用煤炭作燃料取暖做饭\n③农民使用水力翻车进行田间灌溉\n④士兵用火药制成的“震天雷”击退敌人","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"D","explanation":"本题考查人文常识。\n①正确，在宋朝初期，是以铜钱作为流通货币，而作为金属货币的铜钱带来的最大问题就是货币数量不足。在宋朝官府设立官方纸币发行机构以及制定相应的货币政策之后，开始大肆发行纸币，使货币的数量超出了正常的市场需求量，纸币由此贬值，物价持续普遍上涨，就出现了通货膨胀。“社会出现严重通货膨胀”在宋朝有可能出现。\n②正确，早在距今3500年前后，中国人就发现了煤炭，并且已经开采和利用。煤炭被大量用于生产和生活的记载是在汉代。当时还不叫煤炭，而是称作湮石、石涅、黑丹等。汉书有记载，“豫章出石，可燃为薪”。除了炼铁、烧饭，南北朝时期，还有记载表明，当时的人用煤炭来取暖。“百姓用煤炭作燃料取暖做饭”在宋朝有可能出现。\n③正确，宋朝，人们对人力翻车加以改进，创造出畜力翻车和水转翻车。水转翻车与牛转翻车结构相似，只是在由牛来带动的卧齿轮轮轴的下端，安装一个水轮，置于水流湍急处，以水力转动翻车车水上岸。如果水势适当，则卧轮和水轮都可能省掉，把原来的立齿轮改制成可以受力的水轮，带动翻车轮轴转动提水。\n④正确，据史料记载，“震天雷”是出现在北宋末年的一种火药武器，在南宋和蒙元时期的战事中得到了广泛的应用。根据实际使用需要的不同，“震天雷”可以被制造成各种形状，也可以选择人力投掷，或者是用投石机来发射。“士兵用火药制成的‘震天雷’击退敌人”在宋朝有可能出现。\n综上所述，可能出现在宋朝的有①②③④，共4项。\n故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"5509524","cat":"人文常识","stem":"商品宣传时应科学准确，避免误导消费者。下列商品宣传较为科学的是：","options":{"A":"某品牌无糖月饼，没有甜味，属于无糖食品","B":"某品牌鱼肝油含有丰富的维生素D，有助于宝宝骨骼健康","C":"某品牌运动饮料含有多种无机盐，可以补充人体运动时所消耗的能量","D":"某品牌八宝粥由丰富的莲子、桂圆等制作而成，适合糖尿病患者食用"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，无糖食品国际通用的概念是，无糖食品不能加入蔗糖和来自淀粉水解物的糖，包括葡萄糖、麦芽糖、果糖、淀粉糖浆、葡萄糖浆、果葡糖浆等。但是，它必须含有相应于糖的替代物，一般采用糖醇或低聚糖等不升高血糖的能替代蔗糖的甜味剂品种。因此，无糖未必无甜味，无甜味也未必无糖。\nB项正确，鱼肝油含有丰富的维生素D，维生素D的主要功用是促进小肠粘膜细胞对钙和磷的吸收，进而促进宝宝钙盐的更新及新骨生成，此外维生素D还有促进皮肤细胞生长、分化及调节免疫功能作用。\nC项错误，无机盐俗称矿物质，可以维持身体内的电解质平衡、维持心脏的规律搏动等。但是无机盐无法补充人体运动时所消耗的能量，能补充人体消耗能量的三大营养物质是糖类、脂肪和蛋白质。\nD项错误，莲子含糖偏低，属于升糖指数偏低的食物，但是桂圆中含有葡萄糖、蔗糖等物质，不适合糖尿病人食用。此外，八宝粥中通常会加入较多糯米、粳米和红枣，也含有大量糖分，因此不适合糖尿病患者食用。\n故正确答案为B。","no":16,"missingImage":false},{"type":"question","qid":"5509483","cat":"人文常识","stem":"《论语》中提到，“行夏之时，乘殷之辂，服周之冕”。下列与之相关的说法错误的是：","options":{"A":"“夏之时”指的是著名历法《大衍历》","B":"“辂”指的是车子，“冕”指的是礼帽","C":"“乘殷之辂”与“殷鉴不远”涉及同一朝代","D":"《论语》是记录孔子及其弟子言行的语录文集"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，“夏之时”指夏朝的历法，即《夏小正》，是中国现存最早的一部记录农事的历书。该历书记载先秦中原农业发展水平，保存了古代中国的天文历法知识。《夏小正》撰者无考，一般认为成书时间为战国时期、两汉之间。而《大衍历》是唐开元十七年（公元729年）起施行二十九年的历法，是僧一行参考《九执历》而撰的。\nB项正确，“辂”是古代车辕上用来挽车的横木或古代的一种大车；“冕”是中国古代帝王及地位在大夫以上的官员们戴的礼帽。\nC项正确，“乘殷之辂”出自《论语·卫灵公篇》，翻译为乘坐殷商的车子，是指主张质朴，治国要重视民生、节俭；“殷鉴不远”出自于先秦《诗经·大雅·荡》，指殷人灭夏，殷的子孙应以夏的灭亡作为鉴戒，后泛指前人的教训就在眼前。两者都涉及到了商朝。\nD项正确，《论语》由孔子弟子及再传弟子编写而成，主要记录孔子及其弟子的言行，是儒家学派的经典著作之一。\n本题为选非题，故正确答案为A。","no":17,"missingImage":false},{"type":"question","qid":"5509463","cat":"人文常识","stem":"“二十四节气”鲜明地体现了中国人尊重自然、顺应自然规律和可持续发展的理念。下列关于“二十四节气”的说法正确的是：","options":{"A":"起源于长江流域，是我国农历的重要组成部分","B":"立夏时北半球的白昼时间最长，且越往北越长","C":"是通过观察地球周年运动形成的时间知识体系","D":"春分日太阳直射地球赤道，南北半球昼夜平分"},"answer":"D","explanation":"本题考查地理国情。\nA项错误，二十四节气起源于黄河流域，为古代汉族劳动人民长期经验的积累和智慧的结晶，是我国农历特有的重要组成部分。\nB项错误，夏至，是二十四节气的第10个节气，于公历6月21-22日交节。夏至这天，太阳直射地面的位置到达一年的最北端，此时，北半球各地的白昼时间达到全年最长，且越往北越长。夏至过后，太阳直射点开始从北回归线向南移动，北半球白昼开始逐渐变短。\nC项错误，二十四节气是中华民族的特有文化，是中国古人通过观察太阳周年运动而形成的时间知识体系，是一项已经被二千多年的实践证明了的科学成就。\nD项正确，春分，是二十四节气的第四个节气，于公历3月19-22日交节。春分时太阳直射赤道，这天南北半球昼夜平分，自这天以后太阳直射位置继续由赤道向北半球推移，北半球各地白昼开始长于黑夜，南半球与之相反。\n故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"5509522","cat":"科技常识","stem":"关于体育项目中所蕴含的物理原理，下列说法错误的是：","options":{"A":"百米赛跑时运动员起跑快是指起跑加速度大","B":"拔河比赛时获胜一方对绳子的拉力更大一些","C":"举重比赛时运动员手上擦些“镁粉”目的是吸湿，增大摩擦力","D":"跳高比赛时会垫厚厚的垫子，是为了减小运动员落地时所受的冲击力"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，加速度是描述物体速度变化快慢的物理量，加速度的大小等于单位时间内速度的改变量，运动员起跑快说明其速度增大得快，即产生的加速度大。 \nB项错误，物体间力的作用是相互的，拔河比赛中获胜方和失败方对于绳子的拉力是相等的。获胜方获胜的主要原因是在拔河比赛中，获胜方与地面的静摩擦力大于失败方。\nC项正确，“镁粉”，化学名称叫碳酸镁，是一种镁的化合物，具有很好的吸湿功效。运动员在抓握器材的时候，手心很容易出汗，涂“镁粉”后，汗液被吸收，可以增大运动员抓举器械时的摩擦力。\nD项正确，跳高比赛时所用垫子具有缓冲作用，可以延长运动员与地面的接触时间，减小运动员落地时受到的冲击力，避免运动员受伤。\n本题为选非题，故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"5509643","cat":"人文常识","stem":"中国画，简称“国画”，在世界美术领域内自成独特体系。下列关于中国画的说法不正确的是：","options":{"A":"中国画在技法上可分为工笔画和写意画","B":"诗意画主要特点是画中有诗，诗中有画","C":"山水画通过留影与意境实现情与景统一","D":"水墨画是在黑、白、灰三种颜色上点彩"},"answer":"D","explanation":"本题考查人文常识。\nA项正确，中国画，简称“国画”，它是用毛笔、墨和颜料在特制的宣纸或绢上作画，题材主要有人物、山水、花鸟，技法可分工笔和写意两种，富于传统特色。\nB项正确，诗意画是以特定的单一诗文为题材，表达诗文内涵与意趣的绘画，通过画家对诗歌蕴意的理解，将抽象隐晦的诗歌意像转换为具体形象的视觉图像，并以此扩大诗文的流传途径。\nC项正确，山水画强调留影与意境。所谓留影，即反对“谨毛而失貌”，主张总体把握；所谓意境，即把表达来自生活的情思放在主导地位，实现情与景的统一。\nD项错误，水墨画是指水和墨调成墨色作画的画种。墨为主要原料加以清水的多少引为浓墨、淡墨、干墨、湿墨、焦墨等，画出不同浓淡（黑、白、灰）层次。\n本题为选非题，故正确答案为D。","no":20,"missingImage":false}],"count":15,"answerable":15,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"5509435","cat":"逻辑填空","stem":"城市文化是一座城市的气质所在，也是城市发展的内在动力。近年来，一些城市的景观规划动辄“大开大合”，形成            的整体风格，或者移栽网红花木，打造网红街景，将城市文化灌入流量。这些功利的城市治理行为也许会带动一段时间的消费热涨，却让城市失去了原本的生活底色。\n填入画横线部分最恰当的一项是：","options":{"A":"照猫画虎","B":"老生常谈","C":"因循守旧","D":"千篇一律"},"answer":"D","explanation":"横线处所填成语搭配“整体风格”，且前文强调“一些城市的景观规划动辄‘大开大合’”，“大开大合”本意为文思跌荡，放得开，收得拢，双引号在文段中表达特殊语义，结合文段主题可知，横线处应体现城市景观规划动作很大，声势很大的意思。在这种情况下，结合尾句中这些做法导致“城市失去了原本的生活底色”可知，城市景观规划虽然看上去搞得很大，但是最终呈现出的风格却失去了城市的特色及其本来的样子。D项“千篇一律”指的是事物只有一种形式，没有变化，符合文意且与“整体风格”搭配恰当，当选。\nA项“照猫画虎”指的是只从形式上模仿，实际上并不理解，文段未体现出“模仿”之意，排除；\nB项“老生常谈”指的是人们听惯了的没有新意的话，常搭配观点、话题等，一般不与“整体风格”搭配，排除；\nC项“因循守旧”指的是守着老样子不改，不求革新，文段未体现出“守旧”之意，排除。\n故正确答案为D。\n【文段出处】社会科学报《城市改造背后撼不动的是文化认同》","no":21,"missingImage":false},{"type":"question","qid":"5509449","cat":"逻辑填空","stem":"立于传统之上的创新，远比借        招徕粉丝难得多。因为对传统越是懂，越知道它的        之处在于“增之一分则太长，减之一分则太短”，越不敢越雷池一步。\n依次填入画横线部分最恰当的一项是：","options":{"A":"时兴 微妙","B":"流量 精细","C":"套路 巧妙","D":"流俗 精妙"},"answer":"D","explanation":"第一空，根据“远比”可知，文段意在比较两种不同方式之间的关系，故横线处对应“立于传统之上”，应体现当下流行之意。A项“时兴”指当时风行或时髦，B项“流量”指在规定期间内通过一指定点的车辆或行人数量，如今也可指人气值，D项“流俗”指社会上流行的风气、习惯，均符合文意，保留。C项“套路”指成套的技巧、程式、方法等，与文意不符，排除。\n第二空，根据“增之一分则太长，减之一分则太短”可知，横线处应体现对“传统”的分寸把握恰到好处，十分精湛。D项“精妙”指精致巧妙，符合文意，当选。A项“微妙”指精深复杂，难以捉摸，与文意不符，排除；B项“精细”指精致细密，侧重于“细”，与文意不符，排除。\n故正确答案为D。\n【文段出处】中国经济网《创新不是割蕉加梅，而是与虎添翼》","no":22,"missingImage":false},{"type":"question","qid":"5509450","cat":"逻辑填空","stem":"青色文化            ，繁复至极，但沿着牛顿的光谱学说看过去，青光的波长在425至445纳米之间，仅仅20纳米而已，又显得            了。两相对比，有一种摄人心魄的震撼。想来，这就是科学与文化的魅力吧。\n依次填入画横线部分最恰当的一项是：","options":{"A":"浩若烟海 不值一提","B":"源远流长 无足轻重","C":"绚丽多彩 平淡无奇","D":"洋洋大观 微乎其微"},"answer":"D","explanation":"第一空，横线处所填成语搭配“青色文化”，且由后文的“繁复至极”可知，此处应体现“青色文化”多而复杂的特征。C项“绚丽多彩”指各种各样的色彩灿烂美丽，D项“洋洋大观”形容美好的事物繁多，丰富多彩，均符合文意，保留。A项“浩若烟海”指广大繁多如茫茫大海，多指书籍、文献等数量多，与“青色文化”搭配不当，排除；B项“源远流长”比喻历史悠久，根底深厚，并未体现多而复杂之意，排除。\n第二空，由“仅仅20纳米而已”可知，横线处所填成语应体现“小”的意思。D项“微乎其微”形容非常小或非常少，符合文意，当选。C项“平淡无奇”形容事物没有什么突出的、出色的地方，与文意不符，排除。\n故正确答案为D。\n【文段出处】北京晚报《&lt;青色极简史&gt;：青色里的传统文化》","no":23,"missingImage":false},{"type":"question","qid":"5509446","cat":"逻辑填空","stem":"读书可以提高我们的眼光、境界、格局、胸怀。读书的好处，是可以让我们跳出此时此地的        ，穿透一时一地的迷雾，从更大的格局和更长远的眼光来把握眼前的各种        ，从而把不解和不安化成豁然开朗和淡定从容，最后养成战略上的        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"奴役 骚乱 毅力","B":"束缚 骚动 耐力","C":"局限 扰乱 致力","D":"限制 扰动 定力"},"answer":"D","explanation":"第一空，根据后文“穿透一时一地的迷雾”可知，横线处应体现被此时此地所迷惑，B项“束缚”指拘束、限制，C项“局限”指限制在一定范围，D项“限制”指约束，均符合文意，保留。A项“奴役”指没有自由，由得别人使唤的人，程度过重，排除。\n第二空，对应后文“把不解和不安化成豁然开朗和淡定从容”，横线处应体现眼前的状态是“不解和不安”，D项“扰动”指困扰和骚动，符合文意，保留。B项“骚动”指秩序紊乱，动荡不安，仅能对应“不安”的状态，排除；C项“扰乱”使混乱、慌乱，并未体现“不解”的状态，排除。\n第三空，代入验证，对应前文“豁然开朗和淡定从容”，D项“定力”指处变和把握自己的意志力，符合文意，当选。\n故正确答案为D。\n【文段出处】《宫玉振：士兵爱打仗，领导好读书》","no":24,"missingImage":false},{"type":"question","qid":"5509454","cat":"逻辑填空","stem":"AI（人工智能）的技术内核虽然        ，但“模拟人类智慧”这一理念本身却并不        。因此，该理念就很容易被一些        的思想先驱者转化为一些艺术形象，由此形成对于技术形态本身的“抢跑”态势。\n依次填入画横线部分最恰当的一项是：","options":{"A":"深奥 超前 敏感","B":"先进 抽象 前卫","C":"艰深 晦涩 敏锐","D":"高端 艰涩 睿智"},"answer":"C","explanation":"第一空、第二空，根据转折词“但”可知，横线前后呈转折关系，语义相反，且由第二空前“不”可知，第一空和第二空所填词语语义相近，C项“艰深”指高深而难以理解，“晦涩”指文辞等隐晦，不流畅，不易懂，二者语义相近，符合文意，保留。A项“深奥”指不易理解，高深不通俗，“超前”指超越当前正常条件的，B项“先进”指超前的、高级的，“抽象”指不具体、笼统的，D项“高端”指的是等级、档次、价位等在同类中较高的，“艰涩”指隐晦难懂，三项若置于文段中，前后文均不能构成转折关系，排除。\n第三空，代入验证，搭配“思想先驱者”，C项“敏锐”指反应灵敏，头脑灵活，目光尖锐，与“思想先驱者”搭配恰当，当选。\n故正确答案为C。\n【文段出处】《长期以来，我们是否误解了真正的人工智能？——科幻影视对人工智能的误读》","no":25,"missingImage":false},{"type":"question","qid":"5509761","cat":"逻辑填空","stem":"年度热词        大事小情，不仅反映国家大事、        时代主旋律，还有对老百姓日常生活的深切        ，展现了过去一年的社会变迁和生活万象。而透过“内卷”“躺平”“鸡娃”“双减”“干饭人”等热词，我们还可        当下独特的社会景观。\n依次填入画横线部分最恰当的一项是：","options":{"A":"描绘 切合 感触 了解","B":"体现 把握 体验 感受","C":"勾勒 蕴含 体察 窥见","D":"叙写 贴近 关怀 透视"},"answer":"C","explanation":"本题可从第二空入手，横线处词语搭配“年度热词”“时代主旋律”，形容“年度热词”对“时代主旋律”的作用，且根据顿号可知，横线处词语与前文“反映”构成并列，语义相近，故横线处词语应表达“年度热词”体现了“时代主旋律”之意，A项“切合”指十分符合，C项“蕴含”指包含在内，D项“贴近”指靠拢、紧紧靠近，均与“时代主旋律”搭配恰当，保留。B项“把握”指掌握，理解，与文意不符，排除。\n第三空，形容“年度热词”对“百姓生活”的作用，根据后文“展现了过去一年的社会变迁和生活万象”可知，横线处词语应表达在年度热词中可以观察到、了解到百姓的生活，C项“体察”指体验观察，符合文意，保留。A项“感触”指接触外界事物而引起的思想情绪，文段并未体现引起思想情绪之意，与文意不符，排除；D项“关怀”指关心，含有帮助、爱护、照顾之意，与文意不符，排除。\n第四空，代入验证，搭配“社会景观”，C项“窥见”指暗中看出或觉察到，与“社会景观”搭配恰当，保留。\n第一空，代入验证，C项“勾勒”指用简练的文笔叙述大概情况，可以体现年度热词的作用，当选。\n故正确答案为C。\n【文段出处】《从年度流行语中感受时代与社会脉动》","no":26,"missingImage":false},{"type":"question","qid":"5509512","cat":"片段阅读","stem":"亿万年前的超新星爆发产生的星云会孕育下一颗恒星，就像盘古开天地的传说一样。星云中重的元素汇聚在一起形成一个个核心，有的核心越聚越大，最终形成新的恒星；小的核心围着恒星旋转就形成了行星，星星们就这样组合在一起形成了星系，就像我们熟知的太阳系一样。同时，超新星爆发喷射出的高能粒子，还会为它所到达的平静的星云带来波澜和扰动，加速星云汇聚的速度。\n这段文字意在说明：","options":{"A":"太阳系源于一颗超新星的爆发","B":"重元素的汇聚形成了恒星和行星","C":"宇宙源于亿万年前的超新星爆发","D":"超新星爆发产生孕育恒星的星云"},"answer":"D","explanation":"文段开篇提出超新星爆发产生的星云会孕育下一颗恒星，接下来具体介绍了星云中重的元素如何形成恒星以及星系，尾句通过“同时”表示并列，进一步说明超新星爆发喷射出的高能粒子加速星云的汇聚，故文段首句提出观点，后文具体解释说明，重在强调超新星爆发产生孕育恒星的星云，对应D项。\nA项，“太阳系”对应解释说明部分，非重点，排除；\nB项，“重元素”对应解释说明部分，非重点，且表述片面，排除；\nC项，文段并未提及“宇宙”的起源，无中生有，排除。\n故正确答案为D。\n【文段出处】《壮丽的宇宙奇观，一部创造万物的史诗》","no":27,"missingImage":false},{"type":"question","qid":"5509499","cat":"语句表达","stem":"为什么                    ？一个重要原因是，在中国经济发展中，地方分权尤其是财政包干对地区经济发展产生了正向激励，由此也引发了一些地方的“一亩三分地”思维，政策取向更多考虑一地一域，而非站在全国角度通盘考虑。尤其是受唯GDP思维惯性影响，地方对能带动当地经济、增加财政收入的项目多有青睐，通过或明或暗的方式予以保护，造成了市场分割。\n填入画横线部分最恰当的一项是：","options":{"A":"地方保护主义难以根除","B":"国内大循环仍存在堵点","C":"有些地方产业的产能严重过剩","D":"地方保护范围主要在商品领域"},"answer":"A","explanation":"本题为语句填空题，横线出现在文段开头，需结合后文分析。横线后指出地方分权对地区经济发展有激励作用，并通过“由此”引导结论，即形成地方思维，并未考虑全国性。随后通过“尤其”强调，地方对能带动当地经济、增加财政收入的项目常采取保护措施，造成市场分割。故后文主要强调地方思维导致的政策取向仅限于保护地方的经济、财政项目，即“存在地方保护主义”，对应A项。\nB项，文段并未提及“国内大循环”，无中生有，排除；\nC项，文段并未提及“产能严重过剩”，无中生有，排除；\nD项，根据“地方对能带动当地经济、增加财政收入的项目多有青睐······予以保护”可知，“主要在商品领域”表述片面，无法概括后文内容，排除。\n故正确答案为A。\n【文段出处】经济日报《每到一地就要设分公司？经济日报：隐性地方保护主义必须打破！》","no":28,"missingImage":false},{"type":"question","qid":"5509511","cat":"语句表达","stem":"我们经常需要控制自己的欲望，晚一些再满足它，称之为“延迟满足”。与今晚享受大餐相比，推迟享受的大餐，其吸引力（价值）被打了折扣，心理学家称之为时间折扣。时间折扣越大，我们越无法接受延迟满足。但在面临诸多决策时，人们趋于采用单一策略：当现在和未来的时间距离不那么遥远，便直接“齐同”两者在时间维度的差别，不再给未来选择打一个时间折扣，让不同时间点之间的选择变得更加简单。\n下列与画横线部分意思相符的是：","options":{"A":"做决策时，不考虑时间因素","B":"不考虑延迟满足，选择享受当下","C":"做决策时，随机选择现在或者未来事项","D":"在不同的时间点上选一个平均“时间折扣”"},"answer":"A","explanation":"文段开篇引出“延迟满足”和“时间折扣”的概念，并说明二者之间的关系。接下来通过“但”进行转折，指出面临诸多决策的时候人们趋于采用单一策略，随即后文进行解释说明。画横线部分即为该策略的具体表现，且横线前后分句的内容即对横线处所在句子进行提示和解释。根据“当现在和未来的时间距离不那么遥远”“不再给未来选择打一个时间折扣”可知，“‘齐同’两者在时间维度的差别”强调的是在时间距离不是很遥远的前提下抹去时间的差别，将时间的维度保持“齐平”，即做决策的时候不考虑时间因素，对应A项。\nB项，文段只是强调不考虑时间因素，但没有指出一定是选择享受当下，排除；\nC项，“随机选择”表述错误，文段强调不考虑时间因素，从事项本身出发，并非随机做出决策，排除；\nD项，“平均‘时间折扣’”表述错误，文段强调的是在时间维度不打折扣，忽略时间因素，排除。\n故正确答案为A。\n【文段出处】科学辟谣《“选择困难症”又犯了？要不，这次就让音乐帮忙做决定》","no":29,"missingImage":false},{"type":"question","qid":"5509504","cat":"片段阅读","stem":"截至2021年，化石燃料的燃烧正式改变了北半球空气中碳同位素的组成，甚至足以抵消核武器试验发出的信号。而这可能会给有价值的碳年代测定技术带来问题。专家发现，从放射性碳年代测定法来看，现代物品看起来就像是20世纪早期的物品。专家表示，这种趋势“可能很快就会让人很难分辨一件东西是1000年前的还是现代的”。\n最适合做这段文字标题的是：","options":{"A":"化石燃料燃烧带来的影响","B":"放射性碳年代测定的原理","C":"如何分辨物品的年代属性","D":"碳年代测定技术可能不再准确"},"answer":"D","explanation":"文段开篇引出话题，即“化石燃料的燃烧”，接着通过指代词“这”，指出“化石燃料的燃烧”可能会给有价值的碳年代测定技术带来问题。后文通过“专家发现”“专家表示”进行具体解释说明，从专家的角度说明碳年代测定技术有可能出现不确定的结果，故文段重在强调碳年代测定技术可能出现的问题，对应D项。\nA项，“带来的影响”相较于D项表述不够明确，排除；\nB项“碳年代测定的原理”、C项“如何分辨物品的年代属性”文段均未论述，无中生有，排除。\n故正确答案为D。\n【文段出处】科学网《“碳定年”测不准了》","no":30,"missingImage":false},{"type":"question","qid":"5509494","cat":"片段阅读","stem":"现代社会是陌生人社会，以市场经济为基础，更广范围更大规模的交易如跨国贸易，更长距离的往来如海运空运，甚至是跨期买卖如期货交易，不再是在几个熟人之间进行，而是大规模的陌生人社会交往，因此，迫切需要一套交易规则来保障交易的正常进行。这个时候，规则与法律的作用就远远超过熟人社会的习俗礼节与乡规民约。\n根据这段文字，下列说法正确的是：","options":{"A":"现代社会通常会依照差序格局决定办事的难易程度","B":"市场经济需要习俗礼节与乡规民约保障交易的进行","C":"熟人社会是以家族亲属关系为主轴的社会网络关系","D":"现代社会人际关系的维系更依赖规约和法律的作用"},"answer":"D","explanation":"文段首句提出背景“现代社会是陌生人社会”，并指出现代社会的交易是大规模的陌生人社会交往，随后通过“因此”总结，提出需要交易规则保障交易正常进行，尾句“这个时候”指代前文再次进行总结，强调规则与法律对现代社会的重要性，即现代社会的陌生人交往交易需要规则与法律保障，对应D项。\nA项，“差序格局”文段并未提及，无中生有，排除；\nB项，“市场经济”对应文段首句“以市场经济为基础”，“习俗礼节与乡规民约”对应文段尾句，文段并未提及两者的关系，概念混搭，排除；\nC项，“家族亲属关系”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】《观澜｜不找熟人也能办好事，陌生人社会的新型人际关系》","no":31,"missingImage":false},{"type":"question","qid":"5509756","cat":"片段阅读","stem":"老子论“道”，强调人性的本然状态；孔子论“仁”，强调社会的应然状态。在理论逻辑上，老子从道德人心的角度，企图救赎异化的人性；孔子从伦理教化的角度，企图重构崩溃的秩序。在价值取向上，老子之“道”以具体的社会之“德”为理论归趣，其抽象哲学观与社会价值观并无判然界限；孔子之“仁”以社会之“道”为理论指向，其社会价值观与抽象哲学观也无判然界限。\n根据这段文字，下列说法不符合作者观点的是：","options":{"A":"老子之“道”与孔子之“仁”构成理论上的互补关系","B":"老子之“道”与孔子之“仁”构成价值观的辩证关系","C":"老子之“道”与孔子之“仁”彰显的价值观相互对立","D":"老子之“道”与孔子之“仁”虽表面相反但深层相济"},"answer":"C","explanation":"A项，根据“在理论逻辑上，老子从道德人心的角度······孔子从伦理教化的角度······”可知，老子和孔子分别从道德和伦理角度来谈论，构成了理论上的互补关系，表述正确，排除；\nB项，根据“在价值取向上，老子之‘道’以具体的社会之‘德’为理论归趣······孔子之‘仁’以社会之‘道’为理论指向······”可知，老子之“道”与孔子之“仁”构成价值观的辩证关系，表述正确，排除；\nC项，根据“在价值取向上，老子之‘道’以具体的社会之‘德’为理论归趣······孔子之‘仁’以社会之‘道’为理论指向······”可知，老子之“道”与孔子之“仁”的社会价值观没有巨大差异，“价值观相互对立”表述错误，当选；\nD项，根据文意可知，老子之“道”与孔子之“仁”在理论逻辑上有不同的角度，但在价值取向上没有大的差异，“虽表面相反但深层相济”表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明日报《老子之“道”和孔子之“仁”》","no":32,"missingImage":false},{"type":"question","qid":"5509501","cat":"语句表达","stem":"近年来，以南海一号沉船博物馆、秦始皇帝陵博物院、安阳殷墟博物馆、海昏侯国遗址博物馆等为代表的考古遗址博物馆，在旅游网站推荐榜单中排名渐次上升。                    。人们已不再单纯满足于简单的、传统的博物馆参观，而是产生了深入历史场景、触及历史语境的体验需求。\n填入画横线部分最恰当的一项是：","options":{"A":"这些变化反映了文化产品的不断更新换代","B":"新技术带来了文化消费场景的转换与创新","C":"这一新动态折射了文化消费的深化与转型","D":"这意味着新型博物馆成为旅游打卡的网红地"},"answer":"C","explanation":"本题为语句填空题，横线在中间，故需结合前后文进行分析。横线前介绍了近年来考古遗址博物馆在旅游网站推荐榜单中排名上升。横线后介绍了人们的文化旅游消费需求由简单的、传统的参观转变为深入的体验。故横线处应揭示考古遗址博物馆榜单排名上升现象背后的本质，即人们的文化旅游消费需求发生转变，对应C项。\nA项，文段侧重强调“文化旅游消费需求发生转变”，“文化产品不断更新换代”表述错误，排除；\nB项，文段并未涉及“新技术”，无中生有，排除；\nD项，仅能承接上文，无法衔接后文“人们文化旅游消费需求的转变”，排除。\n故正确答案为C。\n【文段出处】光明网-文化评析-《珍视“博物馆热”背后的文化寻根需求》","no":33,"missingImage":false},{"type":"question","qid":"5509505","cat":"片段阅读","stem":"国家实施文化数字化战略，出发点和落脚点之一都是为了满足人民日益增长的精神文化需要，这也决定了，尽管文化数字资源可以在市场上“开展数据交易”，但也要依法依规向民众开放，公共文化资源数据开发后的交易也要把社会效益放在首位。文化是实现共同富裕的重要变量，数字化无疑为这个变量增加了权重，文化数字化战略秉持以人为本、全民共享，坚持以文化公平促共同富裕。\n这段文字意在强调：","options":{"A":"文化数字化是人们精神文化需求的结果","B":"文化资源数据的开发与交易要以人为本","C":"文化数字化所带来的利益应由民众共享","D":"数字化是促进民众共同富裕的新动力"},"answer":"C","explanation":"文段开篇引出文化数字化战略的话题，并阐明了满足人民精神文化需要对于国家实施文化数字化战略的重要性，接着通过转折关联词“但”强调了文化数字资源要向民众开放，重视社会效益，并秉持以人为本、全民共享的原则，同时要坚持以文化公平促共同富裕。故文段重点在转折之后，意在强调文化数字化应以人民为主体，并且文化数字化的成果应惠及全体人民，对应C项。\nA项，对应文段开头部分，为转折前内容，非重点，排除；\nB项，“开发与交易”仅对应转折之后的部分内容，表述片面，排除；\nD项，文段的核心话题是“文化数字化”而不是“数字化”，偷换概念，排除。\n故正确答案为C。\n【文段出处】新华网《数字科技赋能文化自信》","no":34,"missingImage":false},{"type":"question","qid":"5509509","cat":"片段阅读","stem":"现代人的祖先智人，曾在很长时间内与丹尼索瓦人、尼安德特人生活在同一片大陆上。只有智人进化成现在的人类。越来越多的证据表明，现代人的基因组中仍然留存着许多尼安德特人和丹尼索瓦人的基因。这一切都要归功于近年来考古学和现代分子生物学测序的发展。从基因组的比对信息中，我们可以看到已经灭绝的尼安德特人、丹尼索瓦人与现代人之间密切的联系。\n从这段文字可以推出：","options":{"A":"丹尼索瓦人和尼安德特人之间的基因关系更为密切","B":"丹尼索瓦人、尼安德特人与智人共同进化成现代人","C":"尼安德特人与丹尼索瓦人出现在人类祖先智人之前","D":"现代人身上有丹尼索瓦人、尼安德特人和智人的基因"},"answer":"D","explanation":"A项，“更为密切”，文段并没有比较基因关系，无中生有，排除；\nB项，根据“只有智人进化成现在的人类”可知，丹尼索瓦人和尼安德特人并未进化成现代人，表述错误，排除；\nC项，“出现在人类祖先智人之前”文段未提及，无中生有，排除；\nD项，根据“只有智人进化成现在的人类”以及“现代人的基因组中仍然留存着许多尼安德特人和丹尼索瓦人的基因”可知，表述正确，当选。\n故正确答案为D。\n【文段出处】科普中国《我们身上流淌着哪些远古人类的基因？》","no":35,"missingImage":false},{"type":"question","qid":"5509795","cat":"片段阅读","stem":"莲子心发育过程中，多数叶绿素生物合成结构基因的表达是显著上调的，与叶绿素的积累模式一致。原叶绿素酸酯氧化还原酶参与催化的原叶绿素酸酯转化为叶绿素酸酯是一个关键步骤，生成的叶绿素酸酯进一步转化形成叶绿素。光依赖的原叶绿素酸酯氧化还原酶（LPOR）是被子植物中参与这一反应的关键酶，并且此过程是被子植物中叶绿素合成唯一需要光的反应。而一些裸子植物和微生物可以采用不依赖光的原叶绿素酸酯氧化还原酶（DPOR）完成这一反应；莲子心中并不存在DPOR编码基因，但鉴定到两个LPOR编码基因，且其表达模式与叶绿素的积累模式一致。\n这段文字意在说明：","options":{"A":"叶绿素的形成有两种不同的模式","B":"裸子植物依赖光反应形成叶绿素","C":"莲子心的叶绿素合成需要光参与","D":"莲子有裸子植物的两个编码基因"},"answer":"C","explanation":"文段开篇指出莲子心发育过程中多数叶绿素生物合成结构基因的表达与叶绿素的积累模式一致，接着具体分析叶绿素的形成过程，并指出被子植物中叶绿素合成过程中需要光，然后说明一些裸子植物和微生物可以不依赖光形成叶绿素，最后通过转折词“但”强调在莲子心中的LPOR编码基因的表达模式与叶绿素的积累模式一致，故整个文段讨论的核心话题是“莲子心”和“叶绿素”，重点强调莲子心的发育过程中叶绿素的形成需要光，对应C项。\nA、B两项，均未提及核心话题“莲子心”，排除；\nD项，未提及核心话题“叶绿素”，缺少文段主题词，排除。\n故正确答案为C。\n【文段出处】《你知道莲心是如何发育的吗？》","no":36,"missingImage":false},{"type":"question","qid":"5509452","cat":"逻辑填空","stem":"平衡好情怀与创新改编之间的关系，能使经典乐曲焕发            的魅力；我们也希望记忆中的歌声除了那些            的经典，还有不断诞生的新曲目。\n依次填入画横线部分最恰当的一项是：","options":{"A":"经久不衰 百听不厌","B":"生生不息 脍炙人口","C":"历久弥新 耳熟能详","D":"耳目一新 喜闻乐见"},"answer":"C","explanation":"第一空，搭配“魅力”并且要体现“经典乐曲”的特点，A项“经久不衰”形容某事或某人经历很长时间仍旧保持较高的旺盛状态，B项“生生不息”指不断地生长、繁殖，C项“历久弥新”指经历长久的时间而更加鲜活，更加有活力，更显价值，均既能搭配“魅力”又能够体现经典乐曲焕发长久的魅力，保留。D项“耳目一新”意思是听到的、看到的跟以前完全不同，常见用法为“令人/让人耳目一新”，不能直接搭配“魅力”，排除。\n第二空，搭配“经典”， A项“百听不厌”、B项“脍炙人口”、C项“耳熟能详”均可搭配“经典”，又根据前文“记忆中的歌声”说明歌声存在记忆中，C项“耳熟能详”指听得多了，能够很清楚、很详细地复述出来，能够说明存在“记忆中”，符合文意，当选。A项“百听不厌”是形容乐曲或歌曲好听，使人听多少遍也不厌烦，B项“脍炙人口”比喻好的事物受到人们的称赞和传颂，均不能体现存在“记忆中”，排除。\n故正确答案为C。\n【文段出处】人民网《人民艺起评：老歌新唱，声生不息既要怀旧也要创新》","no":37,"missingImage":false},{"type":"question","qid":"5509453","cat":"逻辑填空","stem":"大脑对于外界单调、规律的声音会产生谐振，同时会掩盖住其余声音，起到一种掩蔽效应，因为没有任何变化从而并不引起生理上的        与注意，会不自觉地        噪声对自己的影响，更容易        于当下的活动。\n依次填入画横线部分最恰当的一项是：","options":{"A":"不适 忽略 习惯","B":"反感 抵消 专注","C":"体验 消解 聚焦","D":"认知 弱化 沉浸"},"answer":"D","explanation":"本题可从第二空入手，根据前文“会掩盖住其余声音，起到一种掩蔽效应”可知，横线处应体现对于噪声起到的也是一种“掩蔽”作用，A项“忽略”指不在意，没注意到，C项“消解”指消释、解除，D项“弱化”指使削弱，均可以起到掩蔽噪声的作用，符合文意，保留。B项“抵消”指因作用相反而互相消除，文段并没有其他事物与噪声相互消除，排除。\n再看第三空，根据文意可知，横线处应表达减少噪声后不被外界干扰，更有利于当下的活动之意，D项“沉浸”比喻处于某种境界或思想活动中，可以体现出在活动中不被外界干扰的状态，符合文意，保留。A项“习惯”指由熟悉而适应，不能体现不被外界干扰的状态，排除；C项“聚焦”比喻视线、注意力等集中于一点，文段并未体现都集中于一点，排除。\n第一空，代入验证，根据横线前内容可知，因为没有任何变化，所以也就没有引起生理上对事物的注意，D项“认知”指通过思维活动认识、了解，符合文意，当选。\n故正确答案为D。\n【文段出处】今日头条《“白噪音”助眠，是科学还是忽悠》","no":38,"missingImage":false},{"type":"question","qid":"5509510","cat":"语句表达","stem":"传统村落传承着中华民族的历史记忆、生产生活智慧、文化艺术结晶和民族地域特色。传统村落的建筑设计工艺和技术值得现代建筑研究和挖掘，传统村落的空间格局、邻里关系、乡风民约等对于城市打造和谐的邻里关系，提高社区治理能力有很好的借鉴意义。对于长期生活在喧嚣城市中的居民来说，传统村落和乡村风貌有较强的吸引力。保护传统村落，发展乡村旅游，可为巩固拓展脱贫攻坚成果同乡村振兴有效衔接提供有力产业支撑。\n这段文字意在说明：","options":{"A":"传统村落和乡村风貌的价值是多元丰富的","B":"传统村落治理模式对城市建设有借鉴意义","C":"保护传统村落是推进乡村振兴的重要举措","D":"乡村振兴促进经济发展并承载传统的延续"},"answer":"A","explanation":"文段以“传统村落”为核心，从多个方面阐述了其重要价值，分别为传统村落对中华民族历史文化等多方面的传承作用；传统村落的建筑设计工艺和技术的研究价值；其空间格局、邻里关系、乡风民约等对城市社区治理的借鉴意义；其乡村风貌对城市居民的吸引力，以及基于此发展乡村旅游，可为巩固拓展脱贫攻坚成果同乡村振兴有效衔接提供有力产业支撑。因此，整个文段通篇均在论述传统村落和乡村风貌的多元价值，对应A项。\nB项，“传统村落治理模式”仅为多元价值中的一个方面，表述片面，排除；\nC项，“推进乡村振兴”仅对应尾句，未能对前文中传统村落的多元价值进行全面概括，排除；\nD项，未包含主题词“传统村落”，排除。\n故正确答案为A。\n【文段出处】经济日报《保护好传统村落和乡村风貌》","no":39,"missingImage":false},{"type":"question","qid":"5509489","cat":"语句表达","stem":"①由于亮度与光的强度成正比，因此行星看起来比恒星更亮\n②当我们仰望星空时，或许能分辨出哪一颗是恒星，哪一颗是行星——闪烁的是恒星，不闪烁的是行星\n③有趣的是，行星并不发光，而是反射恒星的光，但是从地球上看时，行星显得比恒星更亮\n④而我们看得到的行星距离地球相对较近，折射较少\n⑤这主要与行星和恒星到达地球的视距离有关，因为行星离地球较近，所以我们的眼睛感知行星的光的强度比离地球较远的恒星要高得多\n⑥这是因为绝大多数恒星离地球非常远，来自恒星的光经历多次折射，光速不断变化，因此产生了这种效果\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②⑥④③⑤①","B":"②④⑥③①⑤","C":"③⑤①②⑥④","D":"③①⑤②④⑥"},"answer":"A","explanation":"对比选项，确定首句。首句分别为②句和③句，②句介绍仰望星空时，可分辨出恒星和行星，引出“恒星和行星”的话题，③句具体介绍有关恒星和行星的有趣现象，按照行文逻辑，应先引出话题再具体展开论述，故②句应在③句之前，②句更适合作首句，排除C、D两项。\n继续观察文段，⑥句出现指代词“这是因为”，对比A、B两项，⑥句前分别是②句和④句，②句介绍仰望星空时，可分辨出恒星和行星，⑥句分析恒星的光经过多次折射，光速不断变化，产生了闪烁效果，是对②句的原因分析，故②⑥两句可以构成捆绑，对应A项。④句指出行星离地球相对较近，折射较少，与⑥句无法构成捆绑，排除B项。\n故正确答案为A。\n【文段出处】《为什么行星看起来比恒星亮？》","no":40,"missingImage":false},{"type":"question","qid":"5510099","cat":"逻辑填空","stem":"在漫长的发展历史中，二十四节气已经成为中华民族共有的认知文化系统，______着中国各族人民的伦理情感、生命意识、审美情趣和信仰，是增强中华民族共同体意识的______和粘合剂。二十四节气中______的尊重自然、效法自然、爱护自然、利用自然、扶助自然的天人合一思想，更是中国文化的精髓。\n填入画横线部分最恰当的一组是：","options":{"A":"凝结 连接 蕴藏","B":"聚集 桥梁 隐藏","C":"凝聚 纽带 蕴含","D":"粘合 枢纽 暗藏"},"answer":"C","explanation":"第一空，搭配“伦理情感、生命意识、审美情趣和信仰”。A项“凝结”指纠结，集聚，C项“凝聚”指聚集，积聚，均可与“伦理情感、生命意识、审美情趣和信仰”搭配，保留。B项“聚集”指集合，凑在一起，多用作“人员聚集”“产业聚集”，强调空间上集中于某一点，文段并非强调空间上的集中，排除；D项“粘合”指用粘性物质使物体粘在一起，与“伦理情感、生命意识、审美情趣和信仰”搭配不当，排除。\n第二空，搭配“二十四节气”，且要与“粘合剂”构成并列，体现其起到的“增强中华民族共同体意识”的作用。C项“纽带”指起联系作用的人或事物，符合文意，保留。A项“连接”指（事物）互相衔接，置于此处用法错误，应为“是连接中华民族共同体意识的······”，排除。\n第三空，代入验证。搭配“思想”，C项“蕴含”意思是包含在内，与“思想”搭配恰当，当选。\n故正确答案为C。\n【文段出处】澎湃新闻《毕旭玲：二十四节气已成为中华民族共有的认知文化系统》","no":41,"missingImage":false},{"type":"question","qid":"5509441","cat":"逻辑填空","stem":"面对错综复杂的形势，最根本的是要把我们自己的事情做好。改革开放以来，我们遭遇过很多外部风险冲击，最终都能            ，靠的就是办好自己的事、把发展立足点放在国内。要            走中国特色社会主义道路，坚持推进中国式现代化，把中国发展进步的命运牢牢掌握在自己手中。\n依次填入画横线部分最恰当的一项是：","options":{"A":"起死回生 一成不变","B":"化险为夷 毫不动摇","C":"绝处逢生 矢志不渝","D":"转败为胜 按部就班"},"answer":"B","explanation":"第一空，根据前文“遭遇过很多外部风险冲击······”和后文“靠的就是······”可知，横线处表达遭遇风险冲击而没有被打败的意思。B项“化险为夷”指使危险转变为平安，符合文意，保留。A项“起死回生”指把快要死的人救活，形容医术高明，也指将没有多少希望的事情挽救回来，C项“绝处逢生”指在陷入绝望的困境中遇到了生路，D项“转败为胜”指变失败为胜利，文中只是遇到风险冲击，并没有到达死亡、绝望或者失败的境地，程度过重，均排除。\n第二空，代入验证。根据后文“坚持推进中国式现代化······”可知，横线处表达坚持走中国特色社会主义道路的意思。B项“毫不动摇”意为丝毫不改变意志，符合文意，当选。\n故正确答案为B。\n【文段出处】人民日报《科学把握战略机遇和风险挑战（思想纵横）》","no":42,"missingImage":false},{"type":"question","qid":"5509447","cat":"逻辑填空","stem":"在延安中央大礼堂外，伫立着两棵柳树和一排松树。当年，毛泽东曾作“松柳之喻”：共产党员要像柳树一样，插到哪里就在那里活起来。但是柳树也有弱点，就是随风倒，软得很，所以还要学松树，松树的劲大得很，到冬天也不落叶子。松树有原则性，柳树有灵活性。像柳树那样        ，人人喜欢；像松树那样        ，稳当可靠。\n依次填入画横线部分最恰当的一项是：","options":{"A":"可亲 坚定","B":"可爱 坚固","C":"可敬 坚挺","D":"可贵 坚持"},"answer":"A","explanation":"第一空，根据横线后“，”可知，横线处所填词语应与“人人喜欢”语义相近，A项“可亲”指使人愿意亲近，B项“可爱”指令人喜爱，均符合文意，保留。C项“可敬”指值得尊敬，D项“可贵”指值得珍视或重视，文段并未提及柳树是否值得人们尊敬或珍视，均与文意不符，排除。\n第二空，根据横线后“，”可知，横线处所填词语应与“稳当可靠”语义相近，又根据横线前“松树的劲大得很”“松树有原则性”可知，横线处所填词语应体现出共产党员要像松树一样可靠、不动摇之意，A项“坚定”形容稳定坚强，不动摇，符合文意，当选。B项“坚固”指牢固、结实，侧重物理结构，与文意不符，排除。\n故正确答案为A。\n【文段出处】《松柳之喻悟党性》","no":43,"missingImage":false},{"type":"question","qid":"5509440","cat":"逻辑填空","stem":"我们常常讨论创造性的培养，好像创造性就一定意味着            ，一个问题有一百个解，不受约束。实际上，        地看待世界，明白局部与整体之间的联系和运作；做事情讲方法，有步骤，有恒心，能统合各方力量，这些才是创造性的基石。\n依次填入画横线部分最恰当的一项是：","options":{"A":"龙飞凤舞 壮观","B":"天马行空 宏观","C":"不拘一格 微观","D":"挥洒自如 乐观"},"answer":"B","explanation":"第一空，需要体现“创造性”的特点，根据横线后“一个问题有一百个解，不受约束”可知，横线处应表达创造不受约束、自由自在之意。B项“天马行空”比喻思想行为无拘无束，亦形容文笔超逸流畅，C项“不拘一格”指不局限于一种规格或一个格局，均符合文意，保留。A项“龙飞凤舞”原形容山势的蜿蜒雄壮，后也形容书法笔势有力，灵活舒展，多用来修饰书法笔势，D项“挥洒自如”形容画画、写字、作文，运笔能随心所欲，均无法用来形容创造性，排除。\n第二空，根据横线后“明白局部与整体之间的联系和运作”可知，横线处应体现能够看清局部和整体之意。B项“宏观”指大范围的或涉及整体的，可以体现能够看清局部和整体之意，当选。C项“微观”指小范围的或部分的，无法体现看清整体之意，排除。\n故正确答案为B。\n【文段出处】微信公众号《见识了德国小学生的“长期作业”，我觉得这些年学白上了》","no":44,"missingImage":false},{"type":"question","qid":"5509758","cat":"逻辑填空","stem":"包括儒家在内的中国传统思想对文艺的功利性            ，“文以载道”可谓天经地义，时时处处以人心与教化的标准来审视和介入文艺的生产与传播，未必都具有积极的社会意义。这需要具体问题具体分析，关键在于人心与教化的标准不能走偏或错谬，否则这种审视和介入就会        或戕害文艺的发展。\n填入画横线部分最恰当的一项是：","options":{"A":"情有独钟 妨碍","B":"不屑一顾 阻止","C":"背道而驰 助长","D":"一厢情愿 推动"},"answer":"A","explanation":"第一空，根据“‘文以载道’可谓天经地义，时时处处以人心与教化的标准来审视和介入文艺的生产与传播”可知，横线处所填成语应体现出中国传统思想始终都存在着文艺的功利性。A项“情有独钟”指因对某人或某事物十分喜爱而感情专一，D项“一厢情愿”指办事完全从主观愿望出发，不考虑客观条件是否允许，均能体现出中国传统思想对于文艺功利性的重视和偏爱，保留。B项“不屑一顾”形容对某事物看不起，认为不值得一看，文段并未提及中国传统思想看不起文艺的功利性，排除；C项“背道而驰”比喻彼此方向与目标完全相反，也比喻背离正确的目标，朝相反的方向走，与文意不符，排除。\n第二空，横线处所填词语与“戕害”构成并列，应体现出人心与教化的标准走偏会对文艺的发展产生不好的影响，感情色彩偏消极。A项“妨碍”指使事情不能顺利进行，符合文意，当选。D项“推动”指使事物前进或发展，与文意相悖且与文段感情色彩不符，排除。\n故正确答案为A。\n【文段出处】光明网《科学审视文艺与政治的关系》","no":45,"missingImage":false},{"type":"question","qid":"5509443","cat":"逻辑填空","stem":"与人类繁衍发展的漫长历史相比，科学的历史并不        。但就在科学有了一席之地的有限历史维度中，人类社会从关系架构、行为方式到思维模式都被科学深刻影响甚至颠覆性        。科学已经成为现代社会不可        的重要部分，是延续和推动现代社会发展的核心力量。\n依次填入画横线部分最恰当的一项是：","options":{"A":"久远 重构 分割","B":"深远 解构 分离","C":"永久 重建 分隔","D":"长久 创新 分裂"},"answer":"A","explanation":"第一空，搭配“历史”，且根据“与人类繁衍发展的漫长历史相比”可知，横线处所填词语应体现漫长之意。A项“久远”指长久、长远，多搭配“年代”“历史”等，搭配得当且符合文意，保留。B项“深远”指深刻而长远，多搭配“影响”“意义”等，与“历史”搭配不当，排除；C项“永久”指永远、长久，多搭配“禁止”“损伤”等，与“历史”搭配不当，排除；D项“长久”指时间很长，长远，多搭配“打算”“规划”等，与“历史”搭配不当，排除。\n第二空，代入验证。根据“被科学深刻影响甚至颠覆性······”可知，横线处所填词语应体现巨大变化之意。A项“重构”指重新构建，可体现巨大变化之意，保留。\n第三空，代入验证。根据“不可······的重要部分”“是延续和推动现代社会发展的核心力量”可知，横线处所填词语应体现分开、分离之意。A项“分割”指把整体或有联系的东西分开，符合文意，当选。\n故正确答案为A。\n【文段出处】《让科学文化 成为社会文化的底色》科技日报2022年8月19日刊","no":46,"missingImage":false},{"type":"question","qid":"5509448","cat":"逻辑填空","stem":"人类成就和文明进步的史诗，是通过历史上最有天赋和才能的个体对艺术、科学和所有其他领域所做的贡献        的。天资卓越、创造力出众的拔尖人才可以利用他们的天赋和才能来        人类社会的现状，也可以对其侵蚀破坏。而他们最终如何选择自己的道路，能否肩负起社会责任，创造更广泛的社会福祉，对于人类命运共同体的未来发展方向有            的影响。\n依次填入画横线部分最恰当的一项是：","options":{"A":"写就 改善 举足轻重","B":"造就 改变 举重若轻","C":"成就 提升 才轻任重","D":"铺就 提高 无关紧要"},"answer":"A","explanation":"第一空，搭配“人类成就和文明进步的史诗”，且根据文意可知，横线处应表达人类成就和文明进步是由历史上最有天赋和才能的个体创造实现的。A项“写就”中的“写”指“写作、描写”，“就”在用作动词的时候有“成功、完成”的意思，“写就”可以理解为描写成功、写成了，对应“史诗”符合形象表达的要求，B项“造就”指培养使有成就，均符合文意，保留。C项“成就”与前文“人类成就”语义重复，排除；D项“铺就”指铺好了、铺成了，与“史诗”搭配不当，排除。\n第二空，搭配“现状”，且根据“天资卓越、创造力出众的拔尖人才可以利用他们的天赋和才能······也可以对其侵蚀破坏”可知，横线处应表达拔尖人才对人类社会的积极作用。A项“改善”指使原来的状况变得好些，符合文意，保留。B项“改变”指事物发生显著的差别，为中性词，体现不出积极的感情色彩，排除。\n第三空，代入验证。A项“举足轻重”比喻所处地位重要，一举一动都会影响全局，置于此处可以表达天资卓越、创造力出众的拔尖人才对于人类命运共同体的未来发展方向有着至关重要的作用，符合文意，当选。\n故正确答案为A。\n【文段出处】光明网《社会责任感：拔尖人才的核心素养》","no":47,"missingImage":false},{"type":"question","qid":"5509763","cat":"片段阅读","stem":"黄色与红色一样，是中华民族偏爱的颜色。在与“五行说”相对应的“五色论”里，黄色代表土，居于四方的中央。东汉的儒家为了抬高君权，突出了“五行”和“五方”中“土居中央”的观点，把土说成是一切元素的根本，因此中央是至高无上的，这也极大地提高了黄色的地位。三国时期的魏文帝曹丕也接受了这一说法，把黄色定为正色之首，随后的隋、唐王朝都加以效仿。从唐代起，正黄色成为皇室的专用色，滥用即会获罪。时隔千年，虽然黄色早已进入寻常百姓家，但金黄色那高贵庄严的气质依然存在。\n对这段文字概括最恰当的一项是：","options":{"A":"分析中华民族偏爱黄色的原因","B":"追溯土居中央观念的形成历史","C":"探讨颜色与五行观念的内在渊源","D":"强调皇权观念对色彩文化的影响"},"answer":"A","explanation":"文段开篇指出黄色是中华民族偏爱的颜色，随后通过“东汉”“三国时期”“唐代”等多个时间维度展开论述，具体解释了中华民族历来偏爱黄色的原因，故文段首句为中心句，重点强调中华民族历来偏爱黄色的原因，对应A项。\nB项，“土居中央”对应文段“东汉”“三国”等时期，非重点，且表述片面，排除；\nC项“颜色”、D项“色彩”主题词范围扩大，文段重点论述“黄色”，均排除。\n故正确答案为A。\n【文段出处】《浅谈纺织品中的色彩》","no":48,"missingImage":false},{"type":"question","qid":"5509451","cat":"逻辑填空","stem":"应急科普能够及时解疑释惑，提升公众认知力，还可以        伪科学和谣言，        社会和网络环境。建立健全国家应急科普协调联动机制，完善各级政府应急管理预案中的应急科普措施，极为必要，更是            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"批驳 净化 未雨绸缪","B":"抵制 维护 重中之重","C":"对抗 清理 居安思危","D":"拆穿 建设 防微杜渐"},"answer":"A","explanation":"本题可从第二空入手，搭配“社会和网络环境”，且根据文意可知，应急科普可以打击伪科学和谣言，营造良好的社会网络环境，A项“净化”指清除杂质使物体纯净，B项“维护”指维持保护使免于遭受破坏，两项均搭配得当且符合文意，保留。C项“清理”指彻底整理或处理，与“社会和网络环境”搭配不当，排除；D项“建设”指创立新事业、增加新设施，如果要使用D项，原文应表述为“建设良好的社会和网络环境”，直接搭配“社会和网络环境”与文意不符，排除。\n再看第三空，根据“建立健全国家应急科普协调联动机制，完善各级政府应急管理预案中的应急科普措施”可知，横线处应与“机制、应急管理预案”对应，体现对未来风险的防范，A项“未雨绸缪”比喻事先做好准备工作，符合文意，保留。B项“重中之重”指重点中的重点，强调非常重要的意思，与“应急预案”无关，且和前文“极为必要”语义、程度相近，与文意不符，排除。\n第一空，代入验证，搭配“伪科学和谣言”，A项“批驳”指对错误的言论或行为加以批判和驳斥，符合文意，当选。\n故正确答案为A。\n【文段出处】人民网《人民网评：厚植公民科普之种，培育自立自强根基》","no":49,"missingImage":false},{"type":"question","qid":"5509507","cat":"片段阅读","stem":"研究表明，许多动物能够探测到人类无法感知的最微小的振动、细微的大气变化甚至磁场电流。从这个意义上说，啮齿动物和狗可以听到比人类能听到的高得多的频率。大象能感知到的频率则比我们能感知的更低，而许多昆虫的腿部对振动非常敏感。许多动物通过不同的感知获得的这种特殊敏感性的集合，可能是对它们能预感灾难来临的合理解释。\n最适合做这段文字标题的是：","options":{"A":"许多昆虫对振动非常敏感","B":"为什么动物能够预知灾难","C":"许多动物拥有敏锐的感官","D":"动物感知的频率远超人类"},"answer":"B","explanation":"文段开篇指出许多动物的感知能力强于人类，随后列举了啮齿动物、狗、大象以及昆虫的例子进行论证，尾句指出通过不同的感知获得的特殊敏感性的集合可能使动物能预感灾难来临，故文段重点分析了动物能预知灾难的原因，对应B项。\nA项“许多昆虫对振动非常敏感”、C项“许多动物拥有敏锐的感官”、D项“动物感知的频率远超人类”均属于结论前的内容，非重点，且均未提及核心话题“灾难”，排除。\n故正确答案为B。\n【文段出处】《为什么动物能够预知灾难》","no":50,"missingImage":false},{"type":"question","qid":"5509779","cat":"语句表达","stem":"①这种观念意识即“中和”。所谓“致中和，天地位焉，万物育焉”，展开了中华民族一幅内含阔大想象的宇宙图景\n②“尽善尽美”，要求美的原则与善的原则相伴而行，美感经验与价值理念一体交融\n③就礼乐关系而言，礼强调道德仪式对日常行为的规范，然而这种规范如果不是仅流于形式，就必须从内心获得情感的力量，实现内化的完成\n④就中华美育传统而言，美与善的关联性要远远大于差异性\n⑤总之，中华美育精神，讲求审美与道德的统一，二者统一于人格教育之中\n⑥乐呈现为愉悦的感性经验品格，然而这种愉悦本身，却为一种观念意识的直观呈现\n将以上6个句子重新排列，语序正确的是：","options":{"A":"④②⑥③⑤①","B":"②④③⑥①⑤","C":"④③②⑥①⑤","D":"②①③⑥⑤④"},"answer":"B","explanation":"对比选项，确定首句。②句介绍“尽善尽美”的要求，④句指出美与善的关联性远大于差异性，不好判断首句。观察其它句子，①句出现指代词“这种观念意识”，观察选项，①句之前有②、⑤、⑥三句，⑥句指出愉悦是一种观念意识的直观呈现，对应“这种观念意识”，故⑥①两句捆绑，保留B、C两项。而②句介绍“尽善尽美”的要求，⑤句通过“总之”引出结论，强调审美与道德统一于人格教育之中，两者均与“这种观念意识”无关，排除A、D两项。\n对比B、C两项，判断②句、③句与⑥句的关系。②句介绍“尽善尽美”的要求，③句引出“礼”和“乐”，并围绕“礼”的角度展开具体论述，而⑥句是围绕“乐”的角度展开具体论述的，根据行文逻辑，③⑥两句衔接紧密，B项当选。而②句与⑥句连接不紧密，排除C项。\n故正确答案为B。\n【文段出处】中国社会科学报《立足中华文化传统 感悟中华美育精神》","no":51,"missingImage":false},{"type":"question","qid":"5509514","cat":"片段阅读","stem":"汉代扬雄讲“言，心声也；书，心画也；声画形，君子小人见矣”，是将书法看作是人品与人格精神的象征，中国书法艺术美学中实际上蕴含着中华传统美学的道德精神，而作为“文房四宝”的笔墨纸砚，是中国书法与中国绘画艺术之间的直接纽带，中国书画艺术实现了两者之间的审美融通和形式共生，即所谓“书画同源”。中国书法和中国绘画艺术同属中华优秀文化典范，且共同植根中华美学思想、蕴含中华道德精神。\n根据这段文字，对“书画同源”的正确理解为：","options":{"A":"形成于同一时期的艺术样式","B":"相通的笔墨丹青与审美意境","C":"共同的精神内涵与艺术形式","D":"同属于中国的独特文化范式"},"answer":"C","explanation":"“书画同源”位于文段中间，需结合前后文内容分析。根据“书画同源”前“即所谓”可知，前句内容可以对其进行解释，中国书法、绘画艺术实现审美融通、形式共生，即二者具有共同的审美、形式，“书画同源”后介绍了中国书法、绘画艺术同属中华优秀文化典范，根植于共同的思想，蕴含相同的道德精神，故“书画同源”指的是中国书法、绘画艺术具有共同的精神内涵与艺术形式，对应C项。\nA项，“形成于同一时期”文段并未提及，无中生有，排除；\nB项，仅对应“审美融通和形式共生”，表述片面，文段还强调二者根植于共同的思想，蕴含相同的道德精神，排除；\nD项，仅对应“同属中华优秀文化典范”，表述片面，文段还强调二者具有共同的形式，排除。\n故正确答案为C。\n【文段出处】光明日报《【文化评析】荣宝斋350年：珍重传统，不忘创新》","no":52,"missingImage":false},{"type":"question","qid":"5509771","cat":"片段阅读","stem":"小镇是一种介于城乡之间的社会实体，在城市和农村之间，小镇扮演着一种沟通和过渡的角色。城市发展繁荣，人口密集，物质和精神消费品丰富，聚集了更多的资源和财富。而农村地区仍是以农业为主，教育、创新、产业发展处于落后水平。在城乡之间，喧嚣的小镇出现了，城乡居民在此处会集、落脚、定居，在乡愁和发展中找到欲望的栖息之地和财富生机。\n这段文字意在说明：","options":{"A":"消除城乡差距依靠小镇发展","B":"乡村与城市存在巨大的差距","C":"小镇使乡村获得了财富生机","D":"小镇于城市乡村之间的意义"},"answer":"D","explanation":"文段首先提出小镇在城市和农村之间扮演着一种沟通和过渡的角色，接下来介绍了城市和农村地区的巨大差距，同时指出小镇能使在此会集、落脚、定居的城乡居民在乡愁和发展中找到欲望的栖息之地和财富生机，具体解释说明了小镇在城乡之间的作用。故文段重点强调小镇在城市和农村之间所扮演的角色，即小镇于城市乡村之间的意义，对应D项。\nA项，文段强调的是小镇在城乡之间扮演“沟通和过渡”的角色，“消除城乡差距”表述过于绝对，且偏离文段重点，排除；\nB项，未包含文段主题词“小镇”，且“城乡差距”属于解释说明部分，非重点，排除；\nC项，文段强调的是小镇于城乡之间的意义，而非对乡村的意义，偷换概念，排除。\n故正确答案为D。\n【文段出处】新周刊《中国的故事，在小镇》","no":53,"missingImage":false},{"type":"question","qid":"5509498","cat":"语句表达","stem":"音乐绝不是仅仅用好听、悦耳、舒服等感官刺激所能概括得了的，简单地以好听与否作为音乐审美判断，                    ，难免有迎合大众，弱化、矮化音乐艺术价值和意义之嫌。\n填入画横线部分最恰当的一项是：","options":{"A":"一概拒绝理性的参与或诠释","B":"彻底否认情感的激荡与共鸣","C":"无视社会时代的影响及反映","D":"不去了解作曲者的心路历程"},"answer":"A","explanation":"横线在文段中间，应注意与前后文的衔接。横线前指出音乐不是仅仅用感官刺激所能概括的，用好听与否去判断音乐审美，横线后指出横线前论述的做法可能会弱化、矮化音乐艺术价值和意义，故横线处应体现不深入理解音乐、仅以好听与否判断音乐之意，对应A项。\nB项，横线处意在体现“不深入理解音乐”这一做法，而非“彻底否认情感的激荡与共鸣”，表述过于绝对，与前文衔接不当，排除；\nC、D两项，“社会时代的影响及反映”“作曲者的心路历程”文段均未提及，与前后文衔接不当，排除。\n故正确答案为A。\n【文段出处】《「经观讲堂第20期」周世斌：音乐需要懂，音乐可以懂，如何懂音乐》","no":54,"missingImage":false},{"type":"question","qid":"5509820","cat":"片段阅读","stem":"配音在当下是有市场的。有些人不喜欢看书，却喜欢“听书”；有些时候没办法解放双手双眼，却可以通过“听书”提高时间利用效率。有的人夜跑时听书，半年里也能听完十来本文学名著。一些地方设立“声音图书馆”，即使不识字也能“看书”；越来越多的阅读平台推出听书功能，实现“可听化”；一些有声小说不满足于“一人读”的传统配音，为每个角色和旁白招募配音者。移动互联时代，多元的阅读场景增加了人们对配音人员的需求，雨后春笋般涌现的配音兼职招聘信息自然也就不足为奇了。\n根据这段文字，听书配音市场需求增加的原因不包括：","options":{"A":"有听书功能的平台与日俱增","B":"有些人对“听书”有特别的偏好","C":"“听书”可以降低时间成本","D":"一人配多角时很难自如切换"},"answer":"D","explanation":"本题为选非细节判断题，主要讲述配音在当下的发展。根据文段内容讲述配音市场需求增加的原因论述，未提及一个人配多个角色时很难自如切换，文段讲述的是有声小说不满足于“一人读”，二者意思不一致，D项当选。\nA项，根据“越来越多的阅读平台推出听书功能，实现‘可听化’”可知，文段已提及，排除；\nB项，根据“有些人不喜欢看书，却喜欢‘听书’”可知，文段已提及，排除；\nC项，根据“有些时候没办法解放双手双眼，却可以通过‘听书’提高时间利用效率”可知，文段已提及，排除。\n本题为选非题，故正确答案为D。\n【文段出处】人民日报《理性对待配音兼职（金台随笔）》","no":55,"missingImage":false}],"count":35,"answerable":35,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"5509706","cat":"数学运算","stem":"轨道交通公司定期进行轨道检修工作，甲、乙两个工程队合作进行需4小时完成，甲队单独完成比乙队单独完成快15小时，则甲队单独完成需要的时间是：","options":{"A":"5小时","B":"6小时","C":"7小时","D":"8小时"},"answer":"A","explanation":"方法一：设甲队的完工时间为x小时，乙队的完工时间为（x+15）小时，赋值工作总量为1，则甲队的效率为\u003cimg data-k=\"8fb9171a4941\">，乙队的效率为\u003cimg data-k=\"2b49a94ece28\">，根据甲、乙两队合作需4小时可知，甲乙两队效率和为\u003cimg data-k=\"62886ffdfcd1\">，列方程：\u003cimg data-k=\"ec1acd455cb0\">，解得x=5或x=-12，其中x=-12不符合题意舍弃，则x=5。\n方法二：采用代入排除法。代入A项，甲队的完工时间为5小时，乙队的完工时间为20小时，赋值工作总量为20，则乙队的效率为20÷20=1，甲队的效率为20÷5=4，甲、乙两队合作需20÷（1+4）=4小时，符合题意。\n故正确答案为A。","no":56,"missingImage":false},{"type":"question","qid":"5509486","cat":"数学运算","stem":"某学院有新生两百多人，将学生从1开始依次编号，选取编号为3的倍数的学生，正好构成新生运动会开幕式方队，选取编号为m（3＜m＜10，且m为整数）的倍数的学生，恰好构成闭幕式方队，问该学院新生人数有多少人？","options":{"A":"242","B":"243","C":"245","D":"246"},"answer":"C","explanation":"根据题意，选取编号为3的倍数的新生正好构成开幕式方队，方队的人数应为平方数。代入选项，B、C两项除以3的商均为81，即编号为3的倍数的新生有81人，81是平方数，符合题意；A、D两项除以3的商分别为80、82，均不是平方数，排除。\n选取编号为m的倍数的新生，恰好构成闭幕式方队，即新生人数除以m的商仍为平方数。3&lt;m&lt;10，且m为整数，则当m=4时，代入B、C两项，除以4的商分别为60、61，均不为平方数，不符合题意；当m=5时，代入B、C两项，除以5的商分别是48、49，48不是平方数，49为平方数，故C项符合题意。\n故正确答案为C。","no":57,"missingImage":false},{"type":"question","qid":"5509496","cat":"数学运算","stem":"甲、乙两个商场营业日每天是否打折的概率均为\u003cimg data-k=\"54d707f15b45\">。某周，甲商场营业7天，而乙商场营业6天，休业1天。问在这一周，甲商场打折天数比乙商场多的概率为：","options":{"A":"\u003cimg data-k=\"c7ce0624c5b3\">","B":"\u003cimg data-k=\"5ef3a129e326\">","C":"\u003cimg data-k=\"54d707f15b45\">","D":"\u003cimg data-k=\"ffaab07ad81b\">"},"answer":"C","explanation":"乙商场休业1天，这一天甲商场是营业的，其打折概率为\u003cimg data-k=\"54d707f15b45\">，不打折概率也为\u003cimg data-k=\"54d707f15b45\">。甲、乙共同营业的6天可能会出现的情况共三种：打折天数甲&gt;乙、打折天数甲=乙、打折天数甲&lt;乙，三种情况的概率之和为1。\n在共同营业的6天中，甲、乙打折天数可能为0、1、2、3、4、5、6中的任一个，甲大于乙的情况数可能是甲为6乙为0-5中任一个、甲为5乙为0-4中任一个，以此类推；乙大于甲的情况数对等，可能是乙为6甲为0-5中任一个、乙为5甲为0-4中任一个，以此类推。由此可知，在共同营业的6天中，打折天数甲&gt;乙与乙&gt;甲的情况数相同，其对应概率也相同，均设为x；打折天数甲=乙的概率设为y。\n符合题意的情况有两种：\n①甲单独营业的1天打折，共同营业的6天中打折天数甲&gt;乙或甲=乙，则甲商场打折天数比乙商场多的概率为\u003cimg data-k=\"1368d9cd21f1\">；\n②甲单独营业的1天不打折，共同营业的6天中打折天数甲&gt;乙，则甲商场打折天数比乙商场多的概率为\u003cimg data-k=\"4538608577e0\">。\n因此，所求概率为\u003cimg data-k=\"29138aebf341\">\u003cimg data-k=\"2762dc91ab05\">。\n故正确答案为C。","no":58,"missingImage":false},{"type":"question","qid":"5509836","cat":"数学运算","stem":"某地计划在连接甲镇和乙镇的长度为60公里的公路上安装限速标志和测速仪器。具体方案是：从距离甲镇3公里处开始安装限速标志，然后每隔4公里再设置一个限速标志；从8公里处开始安装测速仪器，然后每隔9公里再设置一个测速仪器。假设单独安装一个限速标志费用为500元，单独安装一个测速仪器费用为800元，如果限速标志和测速仪刚好在同一个地点安装，则可以节约安装费用，此时安装两种设备总共只需要1000元。问最终安装总费用是多少元？","options":{"A":"10600","B":"11200","C":"12000","D":"12300"},"answer":"C","explanation":"根据题意可知，第a个（\u003cimg data-k=\"801aacac743b\">）限速标志安装的位置可表示为距离甲镇3+4（a-1）=（4a-1）公里处，第b个（\u003cimg data-k=\"89c56403798b\">）测速仪器安装的位置可表示为距离甲镇8+9（b-1）=（9b-1）公里处。根据同余定理，第n个（\u003cimg data-k=\"4ee661eb8f98\">）同一地点安装限速标志和测速仪器的位置距离甲镇（36n-1）公里处（36为4、9的最小公倍数）。根据“连接甲镇和乙镇的长度为60公里的公路”，可列式\u003cimg data-k=\"72fb9755eeb0\">，解得\u003cimg data-k=\"cb24553105a7\">，则限速标志可安装15个；\u003cimg data-k=\"c23a6c8c8c4d\">，解得\u003cimg data-k=\"4f72a74bd8af\">，则测速仪器可安装6个；\u003cimg data-k=\"173f30b35aaf\">，解得\u003cimg data-k=\"29ff7dafbea6\">，则只有1个地点可同时安装限速标志和测速仪器（距离甲镇35公里处）。故最终安装总费用为（15-1）×500+（6-1）×800+1×1000=12000元。\n故正确答案为C。","no":59,"missingImage":false},{"type":"question","qid":"5509855","cat":"数学运算","stem":"某地突发森林火灾，现有甲、乙两支消防队离火灾发生地距离相同，但路况不同，假设两支队伍接到命令后同时出发，并且按照一定速度匀速赶往火灾现场参与救援。已知当甲消防队走了\u003cimg data-k=\"5ef3a129e326\">路程时，乙消防队走了9公里，当乙消防队走了\u003cimg data-k=\"5ef3a129e326\">路程时，甲消防队走了16公里，问甲消防队到达目的地时，乙消防队距离目的地还有多少公里？","options":{"A":"9","B":"12","C":"27","D":"36"},"answer":"A","explanation":"设甲、乙两队离火灾发生地的距离均为S公里，当时间一定时，路程和速度成正比，根据题意可得\u003cimg data-k=\"3faa849b61ed\">，解得S=36。根据“当甲消防队走了\u003cimg data-k=\"5ef3a129e326\">路程时，乙消防队走了9公里”可得，甲消防队到达目的地时，乙消防队走了3×9=27公里，距离目的地还有36-27=9公里。\n故正确答案为A。","no":60,"missingImage":false},{"type":"question","qid":"5509544","cat":"数学运算","stem":"如下图所示，某地计划修建一个长50米，宽40米的长方形观光园。现在需要在观光园中修建几条鹅卵石小道供游客行走，其中一条是长为50米，宽为2米的水平直线型小路，另外两条修成斜线型，并且要求这两条斜线型小路任何地方的水平方向宽度都是1米，问修完小路后观光园剩下部分的面积是多少平方米？\n\u003cimg data-k=\"74db8fa2d56a\" style=\"max-width:154px\">","options":{"A":"1862","B":"1880","C":"1950","D":"1960"},"answer":"A","explanation":"根据题干，观光园如图所示：\n\u003cimg data-k=\"82a8bff25050\" style=\"max-width:349px\">\n题目所求剩余面积等于\u003cimg data-k=\"7919bf212445\">。\u003cimg data-k=\"79385909c58b\">平方米。\u003cimg data-k=\"8ff596e35b26\">平方米。由于两个平行四边形底边相同，则\u003cimg data-k=\"eb73a6fb897b\">\u003cimg data-k=\"8f587ca73e91\">\u003cimg data-k=\"2ed7ffce4659\">\u003cimg data-k=\"38dda7ce0620\">平方米。则题目所求剩余面积=2000-100-38=1862平方米。\n故正确答案为A。","no":61,"missingImage":false},{"type":"question","qid":"5509482","cat":"数学运算","stem":"为了保护生态环境，某单位需要购买一批污水处理设备，总的预算不超过120万元。现有甲、乙两种类型设备可供选择，如果购买2台甲型设备和3台乙型设备，将超出预算10万元；若购买3台甲型设备和2台乙型设备，将结余10万元。若该单位最终购买5台污水处理设备，问共有几种购买方案？","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","explanation":"设甲型设备单价为x万元，乙型设备单价为y万元。\n根据题意可得方程：2x+3y=120+10\u003cimg data-k=\"80d8f860aac9\">①，3x+2y=120-10\u003cimg data-k=\"80d8f860aac9\">②；联立①②解得x=14，y=34。\n最终购买5台设备，总费用不超过总预算120万元，\n第一种购买方案：5台甲设备，14×5=70&lt;120，符合题意；\n第二种购买方案：4台甲设备，1台乙设备，14×4+34=90&lt;120，符合题意；\n第三种购买方案：3台甲设备，2台乙设备，14×3+34×2=110&lt;120，符合题意；\n第四种购买方案：2台甲设备，3台乙设备，14×2+34×3=130&gt;120，不符合题意；\n第五种购买方案：1台甲设备，4台乙设备，14+34×4=150&gt;120，不符合题意；\n第六种购买方案：5台乙设备，34×5=170&gt;120，不符合题意。\n因此，共有3种购买方案。\n故正确答案为C。","no":62,"missingImage":false},{"type":"question","qid":"5509542","cat":"数学运算","stem":"某商场一楼到二楼有一部自动扶梯匀速上行，甲、乙二人共同乘梯上楼。甲在乘扶梯同时匀速登梯，乙在恰好半程后，也开始匀速登梯，但登梯速度是甲的\u003cimg data-k=\"54d707f15b45\">。甲乙二人分别登了36级、12级到达二楼，问这部扶梯静止时一楼到二楼的级数是多少？","options":{"A":"48","B":"60","C":"66","D":"72"},"answer":"D","explanation":"根据题意，甲乙二人均是从一楼沿扶梯上二楼，故路程相等，即总级数相等，扶梯的总级数=人行走的级数+扶梯运行的级数。设甲的速度为2v，乙的速度为v，扶梯的速度为\u003cimg data-k=\"77a1ec12c661\">，即\u003cimg data-k=\"4770edbdf135\">，整理可得：\u003cimg data-k=\"47b998210d2d\">，解得\u003cimg data-k=\"a2fd9d82f106\">，故扶梯的总级数\u003cimg data-k=\"8be428276123\">。\n故正确答案为D。","no":63,"missingImage":false},{"type":"question","qid":"5509713","cat":"数学运算","stem":"某电子元件制造厂有甲、乙、丙三个车间，甲、乙、丙三个车间的产量分别占总产量的5%、70%、25%，且甲、乙、丙三个车间的次品率依次为4%、3%、2%。任取一件产品，取到次品为乙车间制造的概率是：","options":{"A":"15%","B":"45%","C":"75%","D":"85%"},"answer":"C","explanation":"根据甲、乙、丙三个车间的产量分别占总产量的5%、70%、25%，赋值总产量为1000个，则甲、乙、丙三个车间的产量分别为50个、700个、250个。那么甲车间制造的次品为50×4%=2个，乙车间制造的次品为700×3%=21个，丙车间制造的次品为250×2%=5个。因此取到次品为乙车间制造的概率\u003cimg data-k=\"4a44be52f3fe\">。\n故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"5509708","cat":"数学运算","stem":"某医院因工作出现特殊情况需要从外科抽调医护人员支援呼吸科，如果少去4名护士，那么参与支援的护士与参与支援的医生人数一样多，如果少去2名医生，那么参与支援的护士人数是参与支援的医生人数的3倍，则外科参与支援呼吸科的医护人员总数是：","options":{"A":"8","B":"10","C":"12","D":"14"},"answer":"D","explanation":"设外科参与支援呼吸科的护士有x人，则参与支援呼吸科的医生有（x-4）人。根据题意可列方程：x=3[（x-4）-2]，解得x=9，则所求=x+（x-4）=2x-4=2×9-4=14人。\n故正确答案为D。","no":65,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"5510171","cat":"图形推理","stem":"从所给四个选项中，选出最合适的一个填入问号处，使之呈现一定规律性：\n\u003cimg data-k=\"1a35bdfd30f4\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，考虑数量规律。观察发现，题干线条交叉明显，且每幅图都有明显外框，考虑内外交点数，其中题干图形框内交点数分别为1、2、3、4、5，依次递增，故？处应为6个框内交点，只有D项满足规律。\n故正确答案为D。","no":66,"missingImage":false},{"type":"question","qid":"5509887","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"624eeabf6033\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"方法一：\n元素组成不同，优先考虑属性规律。观察发现，将黑色长条从高到低进行标号，如下图所示：\n\u003cimg data-k=\"89e7270d761d\" style=\"max-width:500px\">\n在两个黑色长条②中间画一条线，左右呈现对称性；在两个黑色长条①中间画一条线，左右也呈现对称性，故“？”填入黑色长条后，应使左边8块黑色长条和右边8块黑色长条的左右两边分别呈现对称性，具体如下图：\n\u003cimg data-k=\"1d8300d8aabf\" style=\"max-width:500px\">\n故正确答案为B。\n方法二：\n元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形由多个高低不一的黑色长条组成，且每种长度的黑色长条都出现了两次。将黑色长条从高到低进行标号，如下图所示，“？”处的黑色长条应该分别与③④⑤⑧号黑色长条的长度相等。只有B项符合。\n\n\u003cimg data-k=\"ae837f98083c\" style=\"max-width:500px\">\n故正确答案为B。\n注：本题不管是看对称性还是不同长度方块出现的次数，都可以选到唯一答案B。大家主要学习解题思维即可，考场上根据图形特征优先想到哪个规律选哪个，无需纠结。","no":67,"missingImage":false},{"type":"question","qid":"5509671","cat":"图形推理","stem":"下面四个正方体纸盒的外表面展开图中，与其他三个折叠成的纸盒不相同的是：\n\u003cimg data-k=\"4417964c86df\" style=\"max-width:655px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"将选项展开图中的面标上序号，如下图所示（各选项包含的面都相同，故相同的面用相同字母表示），选项存在相同面，可以通过相同面公共边解题，逐一分析选项。\n\u003cimg data-k=\"317dbd23add3\" style=\"max-width:650px\">\nA项：面a、面b是相邻面，存在公共边（如上图所示），公共边紧邻面a白色多边形长边、面b黑色直角梯形上底边；\nB项：面a、面b是相邻面，存在公共边（如上图所示），公共边紧邻面a白色多边形长边、面b白色矩形长边；\nC项：面a、面b存在公共边（如上图所示），公共边紧邻面a白色多边形长边、面b黑色直角梯形上底边；\nD项：面a、面b存在公共边（如上图所示），公共边紧邻面a白色多边形长边、面b黑色直角梯形上底边。\n综上，只有B项与其他三项不同。\n本题为选非题，故正确答案为B。","no":68,"missingImage":false},{"type":"question","qid":"5509938","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"46b38868550b\" style=\"max-width:550px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"题干图形无明显位置规律和属性规律，考虑数量规律。观察发现，题干图形均由灰色小方块和白色小方块构成，优先观察灰色小方块数量，数量依次为2、1、2、1、2，故？处图形应有1个灰色小方块，只有B项符合。\n故正确答案为B。","no":69,"missingImage":false},{"type":"question","qid":"5509593","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性：\n\u003cimg data-k=\"210ea46e4b4a\" style=\"max-width:508px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相同，优先考虑位置规律。观察上方第一组图形发现，图1以图2为轴经过左右翻转得到图3，图3再以图4为轴经过上下翻转得到图5。下方第二组图形应用此规律，图1以图2为轴经过上下翻转得到图3，图3再以图4为轴经过左右翻转得到？处图形。只有B项符合。\n故正确答案为B。","no":70,"missingImage":false},{"type":"question","qid":"5509554","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"bdf507785b2d\" style=\"max-width:653px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"观察发现，题干图形均存在灰色三角形，且灰色三角形数量依次递增，数量分别为1、2、3、4，故？处图形灰色三角形数量应为5，排除A项。继续观察发现，灰色三角形有明显的位置移动，故考虑灰色三角形的位置规律。题干图形灰色三角形每次顺时针移动2格且在最前面增加一个灰色三角形，只有D项符合。\n\u003cimg data-k=\"6baae606bfe0\" style=\"max-width:610px\">\n故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"5509552","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"5c51fc2e09af\" style=\"max-width:500px\">","options":{"A":"①②③，④⑤⑥","B":"①②⑥，③④⑤","C":"①②④，③⑤⑥","D":"①④⑥，②③⑤"},"answer":"B","explanation":"本题为分组分类题目。元素组成不同，无明显属性规律，考虑数量规律。每个图形均由黑圆和白圆构成，且有部分黑圆和白圆被分隔开，因此考虑数部分数。发现图①②⑥白圆部分均为两部分，图③④⑤白圆部分均为三部分，故图①②⑥为一组，图③④⑤为一组。\n故正确答案为B。","no":72,"missingImage":false},{"type":"question","qid":"5509801","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"98f99c4f2308\" style=\"max-width:450px\">","options":{"A":"①②③，④⑤⑥","B":"①②⑤，③④⑥","C":"①②⑥，③④⑤","D":"①④⑥，②③⑤"},"answer":"D","explanation":"本题为分组分类题目。元素组成不同，无明显属性规律，考虑数量规律。观察发现，题干图①、图⑤存在端点，图③为“田”字变形图，图⑥为“日”字变形图，考虑笔画数，图①④⑥均为一笔画图形，图②③⑤均为两笔画图形。即图①④⑥为一组，图②③⑤为一组。\n故正确答案为D。","no":73,"missingImage":false},{"type":"question","qid":"5509800","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"d9452bde4cac\" style=\"max-width:550px\">","options":{"A":"254","B":"235","C":"432","D":"215"},"answer":"A","explanation":"题干图形分为上下两组，观察发现，第一组图形均为字母，且沿箭头方向前一个图形中最右边的字母都在相邻的后一个图形的最左边。第二组图形均为数字，且沿箭头方向前一个图形中最右边的数字都在相邻的后一个图形的最左边，依此规律，？处所填数字最左边应为2，最右边应为4，只有A项符合。\n故正确答案为A。","no":74,"missingImage":false},{"type":"question","qid":"5509937","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"21d3c1cfe30e\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，无明显属性规律，考虑数量规律。题干图形均为多面体，优先考虑数面数量，图1至图3的面数量分别为6、8、4，均为偶数，故？处图形面数量也应为偶数，A项面数量为5，B项面数量为9，C项面数量为5，D项面数量为6，只有D项满足。\n故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"5509939","cat":"类比推理","stem":"（    ） 对于 有所作为 相当于 知行合一 对于 （    ）","options":{"A":"拼搏向上；学而不思","B":"勤奋进取；空谈误国","C":"自强不息；成就事业","D":"勇于开拓；温故知新"},"answer":"C","explanation":"逐一代入选项。\nA项：拼搏向上是形容一个人努力向上，有所作为是指可以做事情，并能取得较大的成绩，拼搏向上可能会有所作为，二者为因果对应关系；知行合一是指认识事物的道理与实行其事，是密不可分的一回事，学而不思是指只知道学习不知道思考，二者无明显逻辑关系，前后逻辑关系不一致，排除； \nB项：勤奋进取是指努力前进，有所作为是指可以做事情，并能取得较大的成绩，勤奋进取可能会有所作为，二者为因果对应关系；知行合一是指认识事物的道理与实行其事，是密不可分的一回事，空谈误国是指只泛泛而谈地讨论国家大事、不联系实际解决问题，会耽误国家的发展，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：自强不息指自己努力上进，永不懈怠，有所作为是指可以做事情，并能取得较大的成绩，自强不息可能会有所作为。二者为因果对应关系；知行合一是指认识事物的道理与实行其事，是密不可分的一回事，成就事业是指取得事业上的成功，做到知行合一可能会让人事业成功，二者为因果对应关系，前后逻辑关系一致，当选；\nD项：勇于开拓是指有勇气进入新的领域，有所作为是指可以做事情，并能取得较大的成绩，勇于开拓可能会有所作为，二者为因果对应关系；知行合一是指认识事物的道理与实行其事，是密不可分的一回事，温故知新指复习已学过的知识，会有新的体会和理解或者指通过回忆过去，吸取历史经验，给认识现在提供参考，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":76,"missingImage":false},{"type":"question","qid":"5510156","cat":"类比推理","stem":"（    ） 对于 明辨是非 相当于 清正廉洁 对于 （    ）","options":{"A":"公正公平；树立威信","B":"独立思考；风清气正","C":"热爱真理；口碑声望","D":"修身养性；政治生态"},"answer":"A","explanation":"逐一代入选项。\nA项：古语有云“公生明，廉生威”，意思是为官公正公平，才能明辨是非；为官清正廉洁，才能在百姓中树立威信，前者是后者的必要条件，前后逻辑关系一致，保留；\nB项：要想能明辨是非，需要独立思考；要想保持风清气正的政治环境，需要清正廉洁，前者是后者的条件，前后逻辑关系一致，保留；\nC项：热爱真理与明辨是非无明显逻辑关系；因为做官清正廉洁所以获得了口碑声望，二者为因果关系，前后逻辑关系不一致，排除；\nD项：修身养性是指通过自我反省体察，使身心达到完美的境界，与明辨是非无明显逻辑关系；清正廉洁是指为官正直廉洁，政治生态是指各类政治主体生存发展的环境和状态，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n对比A、B两项，A项有明显的历史出处，且如下图所示，“公生明，廉生威”是习近平总书记在中央政法工作会议上指出的原话，故粉笔教研团队一致认为，本题择优选择A项。\n\u003cimg data-k=\"8d706f2fcb31\" style=\"max-width:600px\">\n故正确答案为A。","no":77,"missingImage":false},{"type":"question","qid":"5509661","cat":"定义判断","stem":"环境知觉是人们在环境外观感觉的基础上对地理环境的整体认识和综合解释的过程，是环境刺激与个体已有知识经验相互作用的结果。环境认知是人们对环境信息再现大脑后的认识，它是人们对地理环境识记再现的一种形态，当人们对以前识记的地理环境再度感知的时候，觉得熟悉，仍能认识，经过进一步分析思考后能够做出知觉判断。\n根据上述定义，下列涉及环境认知的是：","options":{"A":"老杨是生活在一座超大城市的老居民，经常在没有地图导航的情况下从城市北边开车到南边去爬山","B":"小周是建筑设计师，认为红砖建筑直接暴露建筑材料是“纯粹”的表现，但小李却认为建筑物不加装修，外观蹩脚","C":"小朱平时喜欢观看介绍风景名胜的纪录片，特别是关于九寨沟的反复看了好多遍。当她第一次去九寨沟看到那些美景时，一种强烈的熟悉感涌上心头","D":"小王是专业的地图测绘员，工作时开着装有摄像头和激光雷达的测绘车，对所到之处的街景进行测绘后获得测绘数据，最终形成一份高精度的数字化地图"},"answer":"A","explanation":"第一步：找出定义关键词。\n环境知觉：“在环境外观感觉的基础上”、“对地理环境的整体认识和综合解释”、“环境刺激与个体已有知识经验相互作用”；\n环境认知：“人们对环境信息再现大脑后的认识”、“对以前识记的地理环境再度感知”、“觉得熟悉，仍能认识，经过进一步分析思考后能够做出知觉判断”。\n第二步：逐一进行分析。\nA项：老杨是一座超大城市的老居民，经常在没有地图导航的情况下从北边开车到南边去爬山，符合“对以前识记的地理环境再度感知”、“觉得熟悉，仍能认识，经过进一步分析能做出知觉判断”，符合“环境认知”定义，当选；\nB项：小周是建筑设计师，认为红砖建筑应该暴露建筑材料，但小李却认为建筑物不加装修，外观蹩脚，小周和小李对于建筑物是否加装修都有自己的看法，符合“在环境外观感觉的基础上”、“对地理环境的整体认识和综合解释”、“环境刺激与个体已有知识经验相互作用”，符合“环境知觉”定义，不符合“环境认知”定义，排除；\nC项：小朱看了很多遍九寨沟的纪录片，当她第一次去九寨沟看到那些美景时，觉得很熟悉，只能说明因为之前总是看九寨沟的纪录片，这一次身临其境了觉得很熟悉，但并没有提到熟悉了之后进一步分析做出知觉判断，不符合“经过进一步分析能做出知觉判断”，不符合“环境认知”定义，排除；\nD项：小王对所到之处的街景进行测绘后获得测绘数据，最终形成数字化地图，不符合“人们对环境信息再现大脑后的认识”、“对以前识记的地理环境再度感知”、“觉得熟悉，仍能认识，经过进一步分析能做出知觉判断”，不符合“环境认知”定义，排除。\n故正确答案为A。","no":78,"missingImage":false},{"type":"question","qid":"5509553","cat":"类比推理","stem":"斤：两：钱","options":{"A":"眼：口：手","B":"年：月：日","C":"天：时：秒","D":"孟：仲：季"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n重量单位包括：斤、两、钱、分。斤、两、钱是重量单位中的三个，三者是并列关系，且三者在重量单位中排列紧密连续。\n第二步：判断选项词语间逻辑关系。\nA项：眼、口、手是身体中的一部分，三者是并列关系，但是三者不存在紧密连续的关系，与题干逻辑关系不一致，排除；\nB项：年、月、日是计时单位中的三个，三者是并列关系，且三者在计时单位中排列紧密连续，与题干逻辑关系一致，当选；\nC项：天、时、秒是计时单位中的三个，三者是并列关系，但是三者在计时单位中的排列并不是紧密连续的（一般连续的顺序是天、时、分、秒），与题干逻辑关系不一致，排除；\nD项：孟、仲、季为兄弟间的长幼排名顺序，三者是并列关系，但是三者在长幼排名顺序上并不是紧密连续的（一般连续的顺序是孟、仲、叔、季），与题干逻辑关系不一致，排除。\n故正确答案为B。","no":79,"missingImage":false},{"type":"question","qid":"5509556","cat":"类比推理","stem":"奋斗：锤炼：本领","options":{"A":"磨砺：增长：才干","B":"实践：奉献：社会","C":"知识：获取：阅读","D":"思考：智慧：启迪"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n通过奋斗来锤炼本领，第一个词与后两个词构成方式目的的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：通过磨砺来增长才干，第一个词与后两个词构成方式目的的对应关系，与题干逻辑关系一致，保留；\nB项：通过实践来奉献社会，第一个词与后两个词构成方式目的的对应关系，与题干逻辑关系一致，保留；\nC项：通过阅读来获取知识，词语顺序与题干不同，与题干逻辑关系不一致，排除；\nD项：通过思考来启迪智慧，词语顺序与题干不同，与题干逻辑关系不一致，排除。\n对比A、B两项，题干的锤炼本领属于个人能力的提升，A项的增长才干也属于个人能力的提升，而B项的奉献社会不属于个人能力的提升，故A项与题干逻辑关系更一致，当选。\n故正确答案为A。","no":80,"missingImage":false},{"type":"question","qid":"5509621","cat":"类比推理","stem":"春兰：墨兰：兰花","options":{"A":"凤蝶：粉蝶：蝴蝶","B":"春茶：秋茶：茶馆","C":"蔬菜：水果：果蔬","D":"菊花：梅花：花卉"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n春兰和墨兰都是兰花的一种，二者为并列关系，与兰花均为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：凤蝶和粉蝶都是蝴蝶的一种，二者为并列关系，与蝴蝶均为种属关系，与题干逻辑关系一致，保留；\nB项：春茶一般指由越冬后茶树在春天里萌发的芽叶采制而成的茶叶，秋茶一般指由秋天采集的芽叶制成的茶叶，二者为并列关系，但二者与茶馆均不构成种属关系，与题干逻辑关系不一致，排除；\nC项：蔬菜和水果都是食物，二者为并列关系，果蔬包括水果和蔬菜，水果、蔬菜与果蔬均为组成关系，与题干逻辑关系不一致，排除；\nD项：菊花和梅花都是花卉，二者为并列关系，与花卉均为种属关系，与题干逻辑关系一致，保留。\n比较A、D两项，题干中春兰和墨兰均是兰花的细分，A项中凤蝶和粉蝶均是蝴蝶的细分，兰花和蝴蝶范围更小，D项中的花卉范围较大，故A项与题干逻辑关系更一致，当选。\n故正确答案为A。","no":81,"missingImage":false},{"type":"question","qid":"5509594","cat":"类比推理","stem":"道路：桥梁：市政设施","options":{"A":"教育：医疗：社会服务","B":"养老：托育：社区工作","C":"足球：球场：体育设施","D":"防汛：抗震：应急管理"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n道路和桥梁是两种不同的设施，二者为并列关系，且均与市政设施构成包容关系中的种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：教育和医疗是两种不同的社会服务，二者为并列关系，且均与社会服务构成种属关系，与题干逻辑关系一致，保留；\nB项：养老和托育是两种不同的社会保障，二者为并列关系，但与社区工作不构成种属关系，与题干逻辑关系不一致，排除；\nC项：在球场踢足球，前两个词为运动与地点的对应关系，足球不是体育设施，足球与体育设施不构成种属关系，与题干逻辑关系不一致，排除；\nD项：防汛和抗震是两种不同的应急管理，二者为并列关系，且均与应急管理构成种属关系，与题干逻辑关系一致，保留。\n比较A、D两项，题干道路和桥梁、A项教育和医疗均为名词，而D项防汛和抗震均为动宾关系，A项与题干逻辑关系更为一致，当选。\n故正确答案为A。","no":82,"missingImage":false},{"type":"question","qid":"5509798","cat":"类比推理","stem":"书籍：书桌：读书","options":{"A":"月圆：中秋：赏月","B":"纸张：纸篓：废纸","C":"蔬菜：菜篮：买菜","D":"净水：水杯：饮水"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“书籍”可以放在“书桌”上，二者构成物体与其空间的对应关系，“书桌”可以用来“读书”，二者为工具对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“月圆”是“中秋”的一种现象，二者为节日与其现象的对应关系，“赏月”是“中秋”的一种习俗，二者为节日与其习俗的对应关系，与题干逻辑关系不一致，排除；\nB项：“废纸”可以放在“纸篓”里，二者构成物体与其空间的对应关系，但“废纸”是“纸张”的一种，二者为种属关系，与题干逻辑关系不一致，排除；\nC项：“蔬菜”可以放在“菜篮”里，二者构成物体与其空间的对应关系，“菜篮”可以用来“买菜”，二者为工具对应关系，与题干逻辑关系一致，保留；\nD项：“净水”可以放在“水杯”里，二者构成物体与其空间的对应关系，“水杯”可以用来“饮水”，二者为工具对应关系，与题干逻辑关系一致，保留。\n对比C、D两项，题干中的“书籍”与C项中的“蔬菜”均为统称，而“净水”是“水”的一种，不是统称，因此C项与题干的逻辑关系更一致，当选。\n故正确答案为C。","no":83,"missingImage":false},{"type":"question","qid":"5509580","cat":"类比推理","stem":"提纲挈领 对于 （    ） 相当于 德才兼备 对于 （    ）","options":{"A":"网之一孔；德高望重","B":"中流砥柱；达士通人","C":"以一持万；才高行洁","D":"毛举细故；以德报怨"},"answer":"C","explanation":"逐一代入选项。\nA项：“提纲挈领”指提起渔网的总绳，拎起衣服的领子，比喻抓住事物的关键和要领，“网之一孔”比喻局部在整体中才能起作用，二者无明显逻辑关系；“德才兼备”指既有好的品德，又具有才能，“德高望重”指品德高尚，很有声望，二者是近义关系，前后逻辑关系不一致，排除；\nB项：“提纲挈领”指提起渔网的总绳，拎起衣服的领子，比喻抓住事物的关键和要领，“中流砥柱”比喻能担当重任，在艰难环境中起支柱作用的集体或个人，二者无明显逻辑关系；“德才兼备”指既有好的品德，又具有才能，“达士通人”指学识渊博，心胸豁达的人，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：“提纲挈领”指提起渔网的总绳，拎起衣服的领子，比喻抓住事物的关键和要领，“以一持万”形容抓住关键，可以控制全局，二者是近义关系；“德才兼备”指既有好的品德，又具有才能，“才高行洁”指才智高超，操行纯洁，二者是近义关系，前后逻辑关系一致，当选；\nD项：“提纲挈领”指提起渔网的总绳，拎起衣服的领子，比喻抓住事物的关键和要领，“毛举细故”意思是烦琐地列举像毫毛一样细小轻微的事情，多指用小事情攻击或责难别人，二者无明显逻辑关系；“德才兼备”指既有好的品德，又具有才能，“以德报怨”指用恩惠回报与别人之间的仇恨，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"5509598","cat":"类比推理","stem":"衣食住行 对于 （    ） 相当于 （    ） 对于 琴棋书画","options":{"A":"亭台楼阁；花鸟鱼虫","B":"油盐酱醋；望闻问切","C":"王侯将相；山川河岳","D":"锅碗瓢盆；笔墨纸砚"},"answer":"D","explanation":"逐一代入选项。\nA项：衣食住行泛指穿衣、吃饭、住房、行路四种日常生活中的基本需要，四字为并列关系，亭台楼阁是四种不同的建筑，四字为并列关系；花鸟鱼虫是观赏用的花草、鸟儿、鱼儿、爬虫，四字为并列关系，琴棋书画指古琴、围棋、书法、国画，四字为并列关系，前后逻辑关系一致，保留；\nB项：衣食住行泛指穿衣、吃饭、住房、行路四种日常生活中的基本需要，四字为并列关系，油盐酱醋是四种烹调佐料，四字为并列关系；望闻问切是中医诊断学四种诊察疾病的基本方法，四字为并列关系，琴棋书画指古琴、围棋、书法、国画，四字为并列关系，前后逻辑关系一致，保留；\nC项：衣食住行泛指穿衣、吃饭、住房、行路四种日常生活中的基本需要，四字为并列关系，王侯将相为古代社会的高级官职，四字为并列关系；山川河岳四字不是并列关系，琴棋书画指古琴、围棋、书法、国画，四字为并列关系，前后逻辑关系不一致，排除；\nD项：衣食住行泛指穿衣、吃饭、住房、行路四种日常生活中的基本需要，四字为并列关系，锅碗瓢盆是四种厨房日常生活用品，四字为并列关系；笔墨纸砚是四种书画用具，四字为并列关系，琴棋书画指古琴、围棋、书法、国画，四字为并列关系，前后逻辑关系一致，保留；\n对比ABD项，拆成单字后，内部均为并列关系，但D项的“衣食住行”与“锅碗瓢盆” 均属于生活范畴，“笔墨纸砚”与“琴棋书画” 均属于文化范畴，关系更为紧密，故择优选择D项。\n故正确答案为D。","no":85,"missingImage":false},{"type":"question","qid":"5509936","cat":"定义判断","stem":"新市民主要是指因本人创业就业、子女上学、投靠子女等原因来到城镇常住，未获得当地户籍或获得当地户籍不满三年的各类群体，包括但不限于进城务工人员、新就业大中专毕业生等，目前约有三亿人。\n根据上述定义，下列画横线部分不属于新市民的是:","options":{"A":"\u003cu>小张\u003c/u>2017年从乡下来到省会城市做快递员，理想是在本市安家立业","B":"\u003cu>老李夫妇\u003c/u>在其女儿读书的大学附近租门面做生意，不打算回农村老家了","C":"\u003cu>小王\u003c/u>2015年到市里工作，户口随即解决，今年想把乡下父母接来同住","D":"\u003cu>黄婆婆\u003c/u>体弱多病，她女儿是大学副教授，把黄婆婆从农村接到自己家里治病养老"},"answer":"C","explanation":"第一步：找出定义关键词。\n“因本人创业就业、子女上学、投靠子女等原因来到城镇常住”、“未获得当地户籍或获得当地户籍不满三年”。\n第二步：逐一分析选项。\nA项：小张从乡下来到省会城市做快递员，说明是因本人就业来到城镇常住，符合“因本人创业就业、子女上学、投靠子女等原因来到城镇常住”，理想是在本市安家立业，说明目前未获得当地户籍，符合“未获得当地户籍或获得当地户籍不满三年”，符合定义，排除；\nB项：老李夫妇在女儿读书的大学附近做生意，不打算回农村老家，说明是因子女上学来到城镇常住，符合“因本人创业就业、子女上学、投靠子女等原因来到城镇常住”，符合定义，排除；\nC项：小王到市里工作，说明是因本人就业来到城镇常住，符合“因本人创业就业、子女上学、投靠子女等原因来到城镇常住”，但2015年工作后户口随即解决，说明获得当地户籍已满三年，不符合“未获得当地户籍或获得当地户籍不满三年”，不符合定义，当选；\nD项：黄婆婆从农村到女儿家里治病养老，说明是因投靠子女来到城镇常住，符合“因本人创业就业、子女上学、投靠子女等原因来到城镇常住”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":86,"missingImage":false},{"type":"question","qid":"5509550","cat":"定义判断","stem":"档案管理是指档案馆（室）以维护档案的真实、完整、准确、安全，便于社会和其他各方面利用为原则，对档案进行收集、整理、保管、鉴定、统计并提供利用的各种业务工作。按管理门类分为文书档案管理和专业档案管理；按档案载体形式分为传统档案管理和电子档案管理。\n根据上述定义，下列属于档案管理的是：","options":{"A":"甲档案馆近期向社会开放经济、教育、科技、文化类档案查询","B":"乙知识网站从1999年开始向用户提供有偿资料查阅和下载服务","C":"丙资料库收录了从1995年至今的100多个社科专题全文复印资料","D":"丁单位的档案室决定建立档案工作责任制，依法健全档案管理制度"},"answer":"A","explanation":"第一步：找出定义关键词。\n“档案馆（室）”、“对档案进行收集、整理、保管、鉴定、统计并提供利用的各种业务工作”。\n第二步：逐一分析选项。\nA项：甲档案馆向社会开放各类档案查询，是对档案提供利用，符合“档案馆（室）”、“对档案进行收集、整理、保管、鉴定、统计并提供利用的各种业务工作”，符合定义，当选；\nB项：知识网站不是档案馆（室），不符合“档案馆（室）”，不符合定义，排除；\nC项：资料库不是档案馆（室），不符合“档案馆（室）”，不符合定义，排除；\nD项：建立档案工作责任制和依法健全档案管理制度，是对工作方法和制度的改进，不符合“对档案进行收集、整理、保管、鉴定、统计并提供利用的各种业务工作”，不符合定义，排除。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"5509555","cat":"定义判断","stem":"数字产业化，就是通过现代信息技术的市场化应用，将数字化的知识和信息转化为生产要素，通过信息技术创新、管理创新和商业模式创新融合，不断催生新产业、新业态、新模式，最终形成数字产业链和产业集群。\n根据上述定义，下列属于数字产业化的是：","options":{"A":"当下各类打车软件的推出，极大方便了人们的出行","B":"人工智能在汽车生产线中得到广泛应用，极大提升了生产效率","C":"物流公司运用仓储机器人分拣包裹，既减少了人力成本又提升了效率","D":"故宫博物院推出的“数字故宫”，让世界各地观众身临其境体验到参观故宫的乐趣"},"answer":"A","explanation":"第一步：找出定义关键词。\n“现代信息技术的市场化应用”、“将数字化的知识和信息转化为生产要素”、“信息技术创新、管理创新和商业模式创新融合”、“形成数字产业链和产业集群”。\n第二步：逐一分析选项。\nA项：各类打车软件的推出方便人们出行，打车软件符合“现代信息技术的市场化应用”、“将数字化的知识和信息转化为生产要素”，符合定义，当选；\nB项：人工智能在汽车生产线中得到广泛使用，说明在现代产业中运用到了人工智能，并非是运用人工智能而创新产业链，不符合“将数字化的知识和信息转化为生产要素”、“形成数字产业链和产业集群”，不符合定义，排除；\nC项：物流公司运用仓储机器人分拣包裹，说明在物流产业中运用到了智能机器，并非是运用人工智能而创新产业链，不符合“将数字化的知识和信息转化为生产要素”、“形成数字产业链和产业集群”，不符合定义，排除；\nD项：故宫博物院推出“数字故宫”，“数字故宫”是传统旅游业融入信息技术而做的创新，是对传统行业的创新和升级，不符合“将数字化的知识和信息转化为生产要素”、“形成数字产业链和产业集群”，不符合定义，排除。\n故正确答案为A。\n\u003cimg data-k=\"c1e75c678f5d\" style=\"max-width:700px\">","no":88,"missingImage":false},{"type":"question","qid":"5509588","cat":"定义判断","stem":"结构性进入壁垒是指企业自身无法支配的、外生的，由产品技术特点、资源供给条件、社会法律制度、政府行为以及消费者偏好等因素所形成的壁垒。策略性进入壁垒是指产业内的企业为保持在市场上的主导地位，获取垄断利润，利用自身的优势通过一系列的有意识的策略性行为构筑起的防止潜在进入者进入的壁垒。\n根据上述定义，下列属于策略性进入壁垒的是：","options":{"A":"我国拍摄一部动画片动辄需上百万、数千万人民币资金，且产业链尚未完善，使得规模较小的甲动画投资公司只能望而却步","B":"乙国汽车厂商在推出一款新车型之前，必须先由政府指定机构对车辆性能进行严格检验，未经检验或未通过检验的车型不得生产","C":"丙公司在疫情期间看到线上卖菜的商机，在某市设置了多个卖点。但因许多行业巨头已在该城市运营多年，导致丙公司迟迟打不开市场","D":"丁乳制品公司在某地方市场占有量极大，随着该地乳制品消费量增加，小公司纷纷试水。在此情况下，丁公司经常靠低价促销来巩固市场地位"},"answer":"D","explanation":"第一步：找出定义关键词。\n结构性进入壁垒：“企业自身无法支配的、外生的”、“由产品技术特点、资源供给条件、社会法律制度、政府行为以及消费者偏好等因素所形成的壁垒”；\n策略性进入壁垒：“产业内的企业为保持在市场上的主导地位，获取垄断利润”、“利用自身的优势”、“通过有意识的策略性行为”、“构筑防止潜在进入者进入的壁垒”。\n第二步：逐一分析选项。\nA项：动画片成本高、产业链尚未完善等问题是“产品技术特点、资源供给条件等形成的壁垒”，符合“结构性进入壁垒”定义，不符合“策略性进入壁垒”定义，排除；\nB项：推出新车型前需先由政府指定机构对车辆性能进行严格检验，属于由“政府行为形成的壁垒”，符合“结构性进入壁垒”定义，不符合“策略性进入壁垒”定义，排除；\nC项：丙公司难以打开市场是因为许多行业巨头已在该城市运营多年，这说明丙公司不是行业巨头，不具备在市场上的主导地位，不符合“产业内的企业为保持在市场上的主导地位，获取垄断利润”，不符合“策略性进入壁垒”定义，排除；\nD项：丁公司市场占有量极大，符合“产业内的企业为保持在市场上的主导地位，获取垄断利润”，经常靠低价促销来巩固市场地位，符合“利用自身的优势”、“通过有意识的策略性行为”、“构筑防止潜在进入者进入的壁垒”，符合“策略性进入壁垒”定义，当选。\n故正确答案为D。","no":89,"missingImage":false},{"type":"question","qid":"5509592","cat":"定义判断","stem":"情绪智力是指个体察觉、处理自我及他人情绪，并利用情绪信息指导行动的能力。\n根据上述定义，下列属于情绪智力的是：","options":{"A":"考试时由于过度紧张，小张脑子一片空白，经过一番调整，终于可以平静地答题了","B":"小赵在路上遇到一条恶狗，吓得她浑身冒冷汗，还好她强装镇定，恶狗终于走开了","C":"小钱与室友发生了矛盾并心生不满，但当她了解到事情原委后，立即主动向室友诚恳道歉","D":"列车乘务员小李被旅客无端指责后，仍然克制地向旅客耐心解释，最终帮旅客解决了问题"},"answer":"D","explanation":"第一步：找出定义关键词。\n“个体察觉、处理自我及他人情绪”、“利用情绪信息指导行动”。\n第二步：逐一分析选项。\nA项：小张平复自己紧张的情绪后答题，只是小张对自己情绪的处理，没有体现如何处理他人的情绪，不符合“个体察觉、处理自我及他人情绪”，不符合定义，排除；\nB项：小赵遇到恶狗后强装镇定，只是小赵对自己情绪的处理，没有体现如何处理他人的情绪，不符合“个体察觉、处理自我及他人情绪”，不符合定义，排除；\nC项：小钱是在得知事情原委后，才向室友道歉，并没有体现出小钱如何处理自己和他人的情绪，不符合“个体察觉、处理自我及他人情绪”，不符合定义，排除；\nD项：小李被旅客无端指责后，仍能克制地向其耐心解释，“克制”是对自己情绪的处理，利用克制住的情绪耐心地向旅客解释，符合“利用情绪信息指导行动”，最终问题得以解决，是对旅客情绪的处理，符合“个体察觉、处理自我及他人情绪”，符合定义，当选。\n故正确答案为D。","no":90,"missingImage":false},{"type":"question","qid":"5509609","cat":"定义判断","stem":"认识性好奇心是由新颖的知识、复杂的概念、晦涩难懂的理论或尚未解决的难题引起的个体想要探究知识的渴望，进而引起探索的行为。\n根据上述定义，下列属于认识性好奇心的是：","options":{"A":"小朋友被空中飞舞的雪花所吸引，试着伸手去抓","B":"孩子看到父亲在房间打游戏，不由自主凑了上去","C":"二年级的小学生遇到不认识的字会主动去查字典","D":"老师通过课堂提问的方式督促学生进行自主思考"},"answer":"C","explanation":"第一步：找出定义关键词。\n“由新颖的知识、复杂的概念、晦涩难懂的理论或尚未解决的难题”、“引起个体想要探究知识的渴望，进而引起探索的行为”。\n第二步：逐一分析选项。\nA项：小朋友被飞舞的雪花吸引，试着伸手去抓雪花，“飞舞的雪花”不符合“由新颖的知识、复杂的概念、晦涩难懂的理论或尚未解决的难题”，不符合定义，排除；\nB项：孩子看到父亲打游戏不由自主凑上去，这里只是孩子对父亲玩的游戏感兴趣，“游戏”不符合“由新颖的知识、复杂的概念、晦涩难懂的理论或尚未解决的难题”，且不由自主说明孩子是无意识的行为，不符合“引起个体想要探究知识的渴望，进而引起探索的行为”，不符合定义，排除；\nC项：小学生遇到自己不认识的字主动去查字典，“不认识的字”属于新颖的知识，符合“由新颖的知识、复杂的概念、晦涩难懂的理论或尚未解决的难题”，“主动查字典”符合“引起个体想要探究知识的渴望，进而引起探索的行为”，符合定义，当选；\nD项：老师通过课堂提问的方式督促学生自主思考，说明是老师引起学生思考，而学生是否想要探究，不得而知，不符合“引起个体想要探究知识的渴望，进而引起探索的行为”，不符合定义，排除。\n故正确答案为C。","no":91,"missingImage":false},{"type":"question","qid":"5509578","cat":"定义判断","stem":"生物多样性评估是指以生物多样性保护和可持续利用为目的而开展的基因、物种和生态系统多样性调查和评价活动。由于生物多样性评估依赖于数据的可获取性，许多情况下受直接测定的限制，人们不得不采取代理指标评估方法，即运用一类与生物多样性及其时空分布具有统计相关性的特殊生物类群或环境因子进行评估的方法。\n根据上述定义，下列体现了生物多样性代理指标评估方法的是：","options":{"A":"利用遥感数据绘制景观图像，评估某地区物种组成的丰富度","B":"采用野生鸟类（或蝴蝶）指数判断某区域生态系统的保护状态","C":"建立物种-面积关系模型，评估某栖息地丧失对特定生物种群的影响","D":"选择地理因子将某区域划分为5个生物大区、7个生物亚区和18个生物群区"},"answer":"B","explanation":"第一步：找出定义关键词。\n生物多样性评估：“以生物多样性保护和可持续利用为目的”、“基因、物种和生态系统多样性调查和评价活动”；\n代理指标评估方法：“与生物多样性及其时空分布具有统计相关性”、“特殊生物类群或环境因子”、“进行评估的方法”。\n第二步：逐一分析选项。\nA项：利用遥感数据绘制景观图，不符合“与生物多样性及其时空分布具有统计相关性”、“特殊生物类群或环境因子”，不符合“生物多样性代理指标评估方法”定义，排除；\nB项：采用野生鸟类（或蝴蝶）指数判断某区域生态系统的保护状态，符合“与生物多样性及其时空分布具有统计相关性”、“特殊生物类群或环境因子”，符合“生物多样性代理指标评估方法”定义，当选；\nC项：评估某栖息地丧失对特定生物种群的影响，不符合“与生物多样性及其时空分布具有统计相关性”、“特殊生物类群或环境因子”，不符合“生物多样性代理指标评估方法”定义，排除；\nD项：选择地理因子将某区域划分，不符合“与生物多样性及其时空分布具有统计相关性”、“特殊生物类群或环境因子”，不符合“生物多样性代理指标评估方法”定义，排除。\n故正确答案为B。","no":92,"missingImage":false},{"type":"question","qid":"5509789","cat":"定义判断","stem":"草地土壤是草原、草甸和草坪等草地植被下发育成的土壤。林地土壤是天然林、次生林和人工林等林地植被下发育成的土壤。农田土壤是人类开垦利用，通过耕种、施肥、灌排等措施长期种植农作物的土壤。\n根据上述定义，下列属于农田土壤的是：","options":{"A":"牧民甲今年把自家承包草场的部分土地深翻了一遍以期牧草丰收","B":"农户乙在自家屋后的荒坡上挖土开凿了一个水池，用于积蓄雨水","C":"果农丙利用自家承包的苹果山林土地播种枸杞，产量较为可观","D":"牧民丁在其草场一处湖边垦荒近千亩土地，年年种植小麦和玉米"},"answer":"D","explanation":"第一步：找出定义关键词。\n草地土壤：“草原、草甸和草坪等”、“草地植被下发育成的土壤”；\n林地土壤：“天然林、次生林和人工林等”、“林地植被下发育成的土壤”；\n农田土壤：“人类开垦利用”
