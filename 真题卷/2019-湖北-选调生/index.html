床每次能同时加工两个零件，每次只能加工零件的一面，加工一次需要1.5分钟，则每台机床加工9个零件最少需要多少时间？","options":{"A":"13.5分钟","B":"14分钟","C":"14.5分钟","D":"15分钟"},"answer":"A","explanation":"方法一：每次可以加工2面，耗时1.5分钟。9个零件共有\u003cimg data-k=\"4ee47f8959b8\">面，至少需要加工\u003cimg data-k=\"9800ab3d4e4e\">次，至少耗时\u003cimg data-k=\"3de787aab0ea\">分钟。\n方法二：本题也可以枚举出所有情况，第1次至第6次分别加工前6个零件的正反两面，第7次加工第7个零件的正面和第8个零件的正面，第8次加工第7个零件的反面和第9个零件的正面，第9次加工第8个零件的反面和第9个零件的反面，一共9次，至少用时\u003cimg data-k=\"720faae3c276\">分钟。\n故正确答案为A。","no":92,"missingImage":false},{"type":"question","qid":"2365992","cat":"数学运算","stem":"吕某回乡开办土鸡养殖基地，某天他收获一筐土鸡蛋。每4个一组取出则多2个；每5个一组取出则少1个；每6个一组取出则刚好；每7个一组取出多1个。已知一筐最多能装500个土鸡蛋，如果每6个一组取出，需要多少次刚好取完？","options":{"A":"67","B":"69","C":"70","D":"72"},"answer":"B","explanation":"由题意可知，土鸡蛋每5个一组取出少1个，所以土鸡蛋数量加1是5的倍数。直接代入选项，\u003cimg data-k=\"d22a3e3b4596\">，得到的结果分别为403、415、421、433，只有415是5的倍数，故土鸡蛋总数为414个，需要取69次。\n故正确答案为B。","no":93,"missingImage":false},{"type":"question","qid":"2365993","cat":"数学运算","stem":"因电路改造，电力公司计划未来十天对某小区选择三天停电，要求不能连续两天停电，则共有多少种停电方案？","options":{"A":"35","B":"56","C":"84","D":"120"},"answer":"B","explanation":"10天里面，7天正常供电，3天停电，要求不能连续2天停电，考虑插空法。7天的排布共有8个空，将停电的3天分别插入8个空，则有\u003cimg data-k=\"c97041567c63\">\u003cimg data-k=\"64c8763e3f8b\">种停电方案。\n故正确答案为B。","no":94,"missingImage":false},{"type":"question","qid":"2365994","cat":"数学运算","stem":"甲、乙、丙三人分别骑自行车同时同地沿同一公路追赶前面的骑车人丁。甲、乙、丙分别用了6分钟、10分钟、15分钟追赶上丁。已知甲每分钟行0.4千米，乙每分钟行0.3千米，则丙每分钟行多少千米？","options":{"A":"0.24","B":"0.25","C":"0.26","D":"0.27"},"answer":"B","explanation":"由题意可知，甲、乙、丙分别跟丁做追及运动。设甲、乙、丙和丁的追及距离为\u003cimg data-k=\"648049a6eba4\">，丁的速度为每分钟行\u003cimg data-k=\"5320a525f2bc\">千米。根据追及公式，甲和丁可得方程\u003cimg data-k=\"70a8f548f656\"> ，乙和丁可得方程\u003cimg data-k=\"5fda930b999c\">，联立方程组解得\u003cimg data-k=\"f3e303a8ea5a\">，\u003cimg data-k=\"36f842992ba8\">。设丙每分钟行\u003cimg data-k=\"c1beececd683\">千米，单独考虑丙和丁，代入追及公式可得\u003cimg data-k=\"f69f20c60920\">，解得\u003cimg data-k=\"59c2d968f36d\">。\n故正确答案为B。","no":95,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"2365995","cat":"图形推理","stem":"请将下面六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"f35449596bda\" style=\"max-width:517px\">","options":{"A":"①②⑤，③④⑥","B":"①④⑤，②③⑥","C":"①③⑥，②④⑤","D":"①②③，④⑤⑥"},"answer":"C","explanation":"元素组成不同，优先考虑属性规律。图2出现等腰三角形，可优先考虑对称性，图①③⑥是既轴对称又中心对称图形，图②④⑤为轴对称图形，故图①③⑥一组，图②④⑤一组。\n故正确答案为C。","no":96,"missingImage":false},{"type":"question","qid":"2365996","cat":"图形推理","stem":"从下列所给四个选项中选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"fd22179ada08\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"观察题干图形，每幅图的正方形的内部均由2条线段，及若干箭头构成，考虑位置规律。将题干中的线段进行标号，线段1每次逆时针旋转\u003cimg data-k=\"8546da544b6d\">，线段2每次逆时针旋转\u003cimg data-k=\"e88918d2ccd4\">，到？处线段1旋转至左上角，线段2旋转至左下角，对应C项。且题干中的箭头数量为1，2，1，2，箭头的指向为右，下，左，上，所以问号处箭头的数量为1，且方向指向右边，对应答案也为C项。\n\u003cimg data-k=\"bc52bcba261f\" style=\"max-width:700px\">\n 故正确答案为C。","no":97,"missingImage":false},{"type":"question","qid":"2365997","cat":"图形推理","stem":"从下列所给四个选项中选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"e41feee44529\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"\u003cimg data-k=\"7f2d64679622\" style=\"max-width:700px\">\n观察题干图形，每幅图均由一个大正方形，一个中正方形，若干个小正方形组成。小正方形的数量依次为0、1、2、3、？，有规律但无对应选项。再次观察发现，每个图形中的正方形都产生了相交，考虑数正方形与正方形相交产生的交点个数（无需数正方形本身的顶点）， 图1有2个交点，图2有4个交点，图3有6个，图4有8个，？处应该有10个交点，对应B项。\n故正确答案为B。","no":98,"missingImage":false},{"type":"question","qid":"2365998","cat":"定义判断","stem":"研究表明，城市化率越高，消费需求就越多元化，消费时间就越长；发达城市人群\u003cimg data-k=\"1a67739c8245\">以上的消费发生在夜间。据此，经济学界提出了“夜间经济”概念，即一种基于时段划分的商业形态，指从每日下午6点到次日凌晨6点所发生的三产服务业方面的商业活动，包括购物、餐饮、旅游、娱乐等。\n根据上述定义，以下属于夜间经济打造项目的是：","options":{"A":"H市计划打造9条特色商业示范街区，并在街区内培育100家连锁品牌商业企业","B":"N市今年的施政议题之一是让城市夜晚亮起来，人气聚起来，市民夜生活火起来","C":"M拟于今年年底前建成4个能满足市民和国内外游客多元消费需求的地标型夜市","D":"S市围绕三处名胜古迹建设三条商业步行街，方便所有人昼夜购物、进餐、娱乐"},"answer":"C","explanation":"第一步：找出定义关键词。\n“从每日下午6点到次日凌晨6点所发生的三产服务业方面的商业活动”、“购物、餐饮、旅游、娱乐”等。\n第二步：逐一分析选项。\nA项：H市计划打造9条特色商业示范街区，培育100家连锁品牌商业企业，没有提及具体的营业时间，不明确是否为“从每日下午6点到次日凌晨6点所发生的商业活动”，不符合定义，排除； \nB项：让城市夜晚亮起来，人气聚起来，市民夜生活火起来，市民的夜生活可以是多样的，比如健身、广场舞等休闲活动等，不一定会有商业行为，不符合“从每日下午6点到次日凌晨6点所发生的三产服务业方面的商业活动”，不符合定义，排除；\nC项：满足市民和国内外游客多元消费需求的地标型夜市，夜市就是夜间做买卖的市场，符合“从每日下午6点到次日凌晨6点所发生的商业活动”符合定义，当选；\nD项：方便所有人昼夜购物、进餐、娱乐，昼夜购物，说明不仅夜间有活动，而且白天也有活动，不符合“从每日下午6点到次日凌晨6点所发生的三产服务业方面的商业活动”，不符合定义，排除。\n故正确答案为C。","no":99,"missingImage":false},{"type":"question","qid":"2365999","cat":"定义判断","stem":"近几年，大学生“慢就业”渐渐成为一种现象。慢就业是指一些大学生毕业后既不打算马上就业也不打算继续深造，而是暂时选择游学、支教、备考、社区服务、在家陪父母或者创业考察等，慢慢考虑人生道路的现象。\n根据上述定义，以下各位应届大学毕业生中哪位选择的不是慢就业？","options":{"A":"张毅已开始北上广深游，打算边考察边学习边思考未来发展方向","B":"李明正积极备考选调生、公务员和事业单位，直到考上一个为止","C":"王莉在社区做义工，拟做到暑假结束，再去办理研究生入学手续","D":"赵芳一直找不到理想工作，决定先在家陪陪父母，等待合适机会"},"answer":"C","explanation":"第一步：找出定义关键词。\n“大学生毕业后既不打算马上就业也不打算继续深造”、“暂时选择游学、支教、备考、社区服务、在家陪父母或者创业考察等”。\n第二步：逐一分析选项。\nA项：张毅开始北上广深游，打算边考察边学习边思考未来发展方向，说明张毅毕业后没有就业和深造的打算，选择了“游学”，符合定义，排除； \nB项：李明积极备考选调生、公务员和事业单位，直到考上为止，符合“大学生毕业后既不打算马上就业也不打算继续深造”，而是备考公务员，符合“暂时选择备考”，符合定义，排除；\nC项：王莉在社区做义工，做到暑假结束，再去办理研究生入学手续，说明王莉选择了“继续深造”，不符合“大学生毕业后既不打算马上就业也不打算继续深造”，不符合定义，当选；\nD项：赵芳一直找不到理想工作，决定先在家陪陪父母，等待合适机会，说明赵芳毕业后没有马上找工作，符合“大学生毕业后既不打算马上就业也不打算继续深造”、“暂时选择在家陪父母”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":100,"missingImage":false},{"type":"question","qid":"2366000","cat":"定义判断","stem":"“C位”是2018年度十大网络用语之一。其中“C”有多种解释，最普遍的一种认为是英文单词center的缩写，是中央、中心的意思。“C位”一般指舞台中央或艺人在宣传海报的中间位置，现被引申为各种场合中最重要、最核心和最受关注的位置。\n根据上述定义，以下哪项表述没有涉及C位？","options":{"A":"专家合影时，德高望重的M院士坐在中间位置","B":"上海中心大厦高632米位于上海市东部功能区","C":"腾讯、阿里巴巴、百度是中国互联网核心企业","D":"B院士是我国量子通信研究领域的首席科学家"},"answer":"B","explanation":"第一步：找出定义关键词。\n“各种场合中最重要、最核心和最受关注的位置”。\n第二步：逐一分析选项。\nA项：德高望重的M院士坐在中间位置，符合“最重要、最核心和最受关注的位置”，符合定义，排除；\nB项：“上海中心大厦”只是大厦的名字，位于上海市东部功能区，未体现“最重要、最核心和最受关注的位置”，不符合定义，当选；\nC项：中国互联网核心企业，符合“最重要、最核心和最受关注的位置”，符合定义，排除；\nD项：首席科学家，符合“最重要、最核心和最受关注的位置”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":101,"missingImage":false},{"type":"question","qid":"2366001","cat":"定义判断","stem":"随意后注意是注意的一种，是指一种自觉的、有预定目的的、不需要意志努力的注意。\n根据上述定义，下列属于随意后注意的是：","options":{"A":"小明为买到某歌手的演唱会门票，熬夜关注网上售票信息","B":"小红因故上课迟到了，在进门的时候，全班的人都看着她","C":"小华不知不觉中被“夕阳西下，小桥流水”的美景所吸引","D":"小亮在掌握了文言文知识后，主动开始欣赏古典文学名著"},"answer":"D","explanation":"第一步：找出定义关键词。\n“自觉的、有预定目的的、不需要意志努力的”。\n第二步：逐一分析选项。\nA项：熬夜关注网上售票信息，不符合“不需要意志努力的”，不符合定义，排除；\nB项：在进门的时候，全班的人都看着她，不符合“自觉的、有预定目的”，不符合定义，排除；\nC项：不知不觉中被“夕阳西下，小桥流水”的美景所吸引，不符合“自觉的、有预定目的的”，不符合定义，排除；\nD项：小亮主动开始欣赏古典文学名著，符合“自觉的、有预定目的的”，且在掌握文言文知识的基础上欣赏古典文学名著是相对容易的，符合“不需要意志努力的”，符合定义，当选。\n故正确答案为D。","no":102,"missingImage":false},{"type":"question","qid":"2366002","cat":"定义判断","stem":"所谓手段善，也可以称之为“结果善”，它表现为手段自身为恶，而结果通常为善，并且结果的善与自身的恶相减，净余额为善。\n依据上述定义，以下不属于手段善的是：","options":{"A":"大风预警","B":"外科手术","C":"冬季冬泳","D":"断尾求生"},"answer":"A","explanation":"第一步：找出定义关键词。\n“手段自身为恶，而结果通常为善”、“结果的善与自身的恶相减，净余额为善”。\n第二步：逐一分析选项。\nA项：“大风预警”指气象部门通过气象监测在大风到来之前做出预警，未体现“手段自身为恶”，不符合定义，当选；\nB项：“手术”指医生用医疗器械对病人身体进行的切除、缝合等治疗，体现了“手段自身为恶”，且手术之后一般会达到比较好的效果，体现了“结果通常为善”，符合定义，排除；\nC项：“冬季冬泳”对人体会产生强烈刺激，体现了“手段自身为恶”，且冬季冬泳有一定的好处，体现了“结果通常为善”，符合定义，排除；\nD项：“断尾”指壁虎、蜥蜴等动物被天敌咬住尾巴或遭遇危险的时候，往往会自断尾巴，体现了“手段自身为恶”，“断尾”吸引敌人的注意，乘机逃跑而得以逃生，体现了“结果通常为善”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":103,"missingImage":false},{"type":"question","qid":"2366003","cat":"类比推理","stem":"卫星：月亮：皎洁","options":{"A":"行星：太阳：温暖","B":"柿子：水果：香甜","C":"家具：书桌：学习","D":"动物：乌龟：缓慢"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n月亮是卫星，二者是种属关系；皎洁是月亮的属性，二者是属性的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：太阳是恒星，不是行星，二者不是种属关系，与题干逻辑关系不一致，排除；\nB项：柿子是水果，二者是种属关系，但词语顺序与题干相反，与题干逻辑关系不一致，排除；\nC项：书桌是家具，二者是种属关系，书桌是供人伏案学习的，学习不是书桌的属性，与题干逻辑关系不一致，排除；\nD项：乌龟是动物，二者是种属关系；缓慢是乌龟的属性，二者是属性的对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":104,"missingImage":false},{"type":"question","qid":"2366004","cat":"类比推理","stem":"青蛙：水蛇：变温动物","options":{"A":"鳄鱼：蜥蜴：爬行动物","B":"海豚：企鹅：海洋动物","C":"海龟：鲸鱼：两栖动物","D":"羚羊：狮子：草原动物"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n青蛙和水蛇是两种不同的动物，二者是并列关系中的反对关系；青蛙和水蛇都是变温动物，二者均与第三个词构成种属关系，且变温是青蛙和水蛇具有的属性。\n第二步：判断选项词语间逻辑关系。\nA项：鳄鱼和蜥蜴是两种不同的动物，二者是并列关系中的反对关系；鳄鱼和蜥蜴都是爬行动物，二者均与第三个词构成种属关系，且爬行是鳄鱼和蜥蜴具有的属性，与题干逻辑关系一致，当选；\nB项：海豚和企鹅是两种不同的动物，二者是并列关系中的反对关系；但海洋是海豚和企鹅生活的场所而非属性，与题干逻辑关系不一致，排除；\nC项：海龟和鲸鱼是两种不同的动物，二者是并列关系中的反对关系；但海龟和鲸鱼都不是两栖动物，与题干逻辑关系不一致，排除；\nD项：羚羊和狮子是两种不同的动物，二者是并列关系中的反对关系；但草原是羚羊和狮子生活的场所而非属性，与题干逻辑关系不一致，排除。\n故正确答案为A。\n注：本题为争议题，有同学选D项，理由如下：青蛙和水蛇都属于变温动物，为种属关系，且水蛇是青蛙的天敌；而D项羚羊和狮子都是草原动物，为种属关系，且狮子是羚羊的天敌。其它选项均不符合。\n以上两种思路都各有道理，由于本题存在争议，建议考生不必过分纠结，重点学习解题思路即可。","no":105,"missingImage":false},{"type":"question","qid":"2366005","cat":"类比推理","stem":"相信：坚信：质疑","options":{"A":"希望：盼望：奢望","B":"报道：报告：封杀","C":"微词：批判：赞扬","D":"诚恳：诚信：伪装"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“相信”和“坚信”是近义关系，二者和“质疑”是反义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“希望”和“盼望”是近义关系，但“希望”和“奢望”不是反义关系，与题干逻辑关系不一致，排除；\nB项：“报道”、“报告”和“封杀”之间没有关系，与题干逻辑关系不一致，排除；\nC项：“微词”指隐含批评和不满的话语，和“批判”是近义关系，二者和“赞扬”是反义关系，与题干逻辑关系一致，当选；\nD项：“诚恳”指人的态度不虚伪，“诚信”泛指待人处事真诚、老实、讲信用等，二者不是近义关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":106,"missingImage":false},{"type":"question","qid":"2366006","cat":"类比推理","stem":"下单：付款：送货","options":{"A":"寄件：收件：派件","B":"撰稿：改稿：投稿","C":"耕地：施肥：播种","D":"复习：考试：阅卷"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n先“下单”，其次“付款”，然后被“送货”，共涉及两个主体。\n第二步：判断选项词语间逻辑关系。\nA项：先“寄件”，其次“收件”，然后“派件”，先后顺序正确，但是共涉及三个主体，与题干逻辑关系不一致，排除；\nB项：先“撰稿”，其次“改稿”，然后“投稿”，先后顺序正确，但共涉及一个主体，与题干逻辑关系不一致，排除；\nC项：先“耕地”，“施肥”和“播种”没有严格的先后顺序，并且共涉及一个主体，与题干逻辑关系不一致，排除；\nD项：先“复习”，其次“考试”，最后“阅卷”，共涉及两个主体，与题干逻辑关系一致，当选。\n故正确答案为D。","no":107,"missingImage":false},{"type":"question","qid":"2366007","cat":"类比推理","stem":"青年：村官：基层锻炼","options":{"A":"党史：国史：史海耕耘","B":"工人：农民：财富创造","C":"学者：儒商：市场打拼","D":"巾帼：须眉：同台竞技"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n有的青年是村官，有的村官是青年，有的青年不是村官，有的村官不是青年，“青年”和“村官”是交叉关系；“村官”在“基层锻炼”，二者是对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“党史”是党派自成立以来的发展过程，“国史”是一国或一个朝代的历史，二者是并列关系，与题干逻辑关系不一致，排除；\nB项：“工人”和“农民”是不同的职业，二者是并列关系，与题干逻辑关系不一致，排除；\nC项：“儒商”是儒与商的结合体，既有儒者的道德和才智，又有商人的财富与成功，“学者”指的是具有一定学识水平、能在相关领域表达思想、提出见解的人，有的学者是儒商，有的儒商是学者，有的学者不是儒商，有的儒商不是学者，二者是交叉关系；“儒商”在“市场打拼”，二者是对应关系，与题干逻辑关系一致，当选；\nD项：“巾帼”是对女子的代称，“须眉”是对男子的代称，二者是并列关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":108,"missingImage":false},{"type":"question","qid":"2366008","cat":"类比推理","stem":"望到青山：看见碧水：记住乡愁","options":{"A":"产业兴旺：生态宜居：生活富裕","B":"改善乡风：治理环境：建设乡村","C":"风土人情：方言俚语：田园牧歌","D":"良好家风：淳朴民风：文明习俗"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“望到青山”、“看见碧水”和“记住乡愁”均为动宾结构。\n第二步：判断选项词语间逻辑关系。\nA项：“产业兴旺”、“生态宜居”和“生活富裕”均为主谓结构，与题干逻辑关系不一致，排除；\nB项：“改善乡风”、“治理环境”和“建设乡村”均为动宾结构，与题干逻辑关系一致，当选；\nC项：“风土人情”、“方言俚语”和“田园牧歌”均为名词并列短语，与题干逻辑关系不一致，排除；\nD项：“良好家风”、“淳朴民风”和“文明习俗”均为形容词加名词构成的偏正短语，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":109,"missingImage":false},{"type":"question","qid":"2366009","cat":"逻辑判断","stem":"《自然》期刊发表的一项新研究表明，基因改造过的猪心脏，在被同位移植到狒狒体内后，保持完整功能地跳动了195天。这预示着未来人类也能受益于此，可以解决人类器官供应短缺的棘手问题。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"猪心脏与人的心脏在解剖学结构上非常相似","B":"猪心脏移植到狒狒身上具有非常高的生存率","C":"猪心脏异种移植距离实验成功仅仅一步之遥","D":"猪心脏可以在人类以外的灵长动物体内存活"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：这预示着未来人类也能受益于此，可以解决人类器官供应短缺的棘手问题。\n论据：基因改造过的猪心脏，在被同位移植到狒狒体内后，保持完整功能地跳动了195天。\n本题是通过论据的一个动物实验得到论点中人类的情况。如果要支持论点，需要在动物实验和人类之间进行搭桥，需要补充从这个动物实验得出人类可以因此受益的理由。\n第二步：逐一分析选项。\nA项：说明猪心脏和人的心脏在解剖学结构上非常相似，所以通过猪心脏成功被移植并成活的实验，可以得到人类也能受益于此，在论点和论据之间进行搭桥，可以加强，当选；\nB项：说明猪心脏移植到狒狒身上具有非常高的生存率，和论点讨论的此实验是否对人类未来有益无关，话题不一致，无法加强，排除；\nC项：说明猪心脏异种移植距离实验成功仅仅一步之遥，但这个实验成功与否，和论点讨论的人类是否会因此受益无关，话题不一致，无法加强，排除；\nD项：猪心脏是否可以在人类以外的灵长类动物体内存活，和论点讨论的人类是否会因此受益无关，话题不一致，无法加强，排除。\n故正确答案为A。","no":110,"missingImage":false},{"type":"question","qid":"2366010","cat":"逻辑判断","stem":"一项长达20年的研究表明，爱做家务的求职者比不爱做家务的求职者更容易成功就业，就业后的收入前者也比后者高\u003cimg data-k=\"798f1f286d1f\">。此外，爱做家务的求职者比不爱做家务的求职者生活幸福感更高。通过做家务，求职者能养成合理规划的习惯和不骄不躁的品质。从这个角度看，做家务有助于培养更多的社会精英。\n下列哪项如果为真，最能够加强上述论证？","options":{"A":"养成合理规划和不骄不躁的习惯为求职者所必需","B":"非常多的求职者都在被他们父母积极鼓励做家务","C":"合理规划和保持不骄不躁是社会精英的必备品质","D":"做家务可以提升求职者的规划能力和生活幸福感"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：做家务有助于培养更多的社会精英。\n论据：爱做家务的求职者比不爱做家务的求职者更容易成功就业，就业后的收入高，生活幸福感更高。通过做家务，求职者能养成合理规划的习惯和不骄不躁的品质。\n本题论据告知了爱做家务使求职者养成合理规划的习惯和不骄不躁的品质，论点是做家务有助于培养社会精英。要想加强论证，应说明合理规划的习惯和不骄不躁的品质和成为社会精英有关联。\n第二步：逐一分析选项。\nA项：合理规划和不骄不躁的习惯为求职者所必需，说的是求职者应具备的条件，与论点中说的社会精英无关，无关项，排除；\nB项：求职者被父母积极鼓励做家务，与论点中说的社会精英无关，无关项，无法加强，排除；\nC项：合理规划和保持不骄不躁是社会精英的必备品质，论据表明做家务，求职者能养成合理规划的习惯和不骄不躁的品质，选项在论据和论点中搭桥，可以加强，当选；\nD项：做家务可以提升求职者的规划能力和生活幸福感，重复论据观点，与论点社会精英无关，无法加强，排除。\n故正确答案为C。","no":111,"missingImage":false},{"type":"question","qid":"2366011","cat":"逻辑判断","stem":"A单位的一项实证调查指出，应当对单位内不断上升的差旅费用采取措施。这项实证调查的理由是，单位内人均差旅费用，每天高达52元。而在同等人数规模的B单位里，其人均差旅费则都在20元以内。\n下列哪项如果为真，最能构成对上述论点的驳斥？","options":{"A":"据其他调查，A单位人均差旅费用实际为每天35元","B":"实际上很难找到人均差旅费像B单位那么低的机构","C":"A单位的差旅费用和B单位的差旅费用标准完全不同","D":"对A单位不断上升的差旅费采取措施可能会不得人心"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：应对A单位的差旅费用采取措施。\n论据：A单位人均差旅费用每天高达52元，同等人数规模的B单位里，其人均差旅费则都在20元以内。\n本题根据A单位和B单位人均差旅费不同而决定对A单位的差旅费用采取措施，论点论据话题不一致。削弱题，可以优先考虑拆桥，即说明通过人均差旅费用不同，不能得出应对A单位的差旅费用采取措施。\n第二步：逐一分析选项。\nA项：A单位人均差旅费用实际为每天35元，仍比B单位人均差旅费则都在20元以内要高，无法削弱，排除；\nB项：很难找到人均差旅费像B单位那么低的机构，只能说明B单位差旅费低，但是A单位是否应该采取措施未知，无法削弱，排除；\nC项：A单位的差旅费用和B单位的差旅费用标准完全不同，说明A单位和B单位标准不同，A单位和B单位没有比较的必要，不能通过两个单位人均差旅费用不同，得出应对A单位的差旅费用采取措施，拆桥项，可以削弱，当选；\nD项：A单位不断上升的差旅费采取措施可能会不得人心，是否得人心和是否需要对差旅费采取措施无关，无关项，无法削弱，排除。\n故正确答案为C。","no":112,"missingImage":false},{"type":"question","qid":"2366012","cat":"逻辑判断","stem":"一位地铁安检员声称，他通过长期的地铁安检工作养成了一种特殊技能。即，他能够准确地识别一位乘客是否在欺骗他。他的根据是，在地铁安检入口检查时，他只需要与乘客进行短短的几句对话就能断定对方是否可疑；而在他认为可疑的乘客身上，无一例外地都查出了违禁物品。\n下列哪项如果为真，最能削弱上述地铁安检员的论证？","options":{"A":"在他认为不可疑而未经检查的乘客中有人无意地携带了违禁物品","B":"在他认为可疑而进行检查的乘客中大部分有意地携带了违禁物品","C":"在他认为可疑并查出违禁物品的乘客中有人无意地携带违禁物品","D":"在他认为不可疑而未经检查的乘客中大部分都没有携带违禁物品"},"answer":"C","explanation":"第一步:：找出论点和论据。\n\n论点：该地铁安检员能够准确地识别一位乘客是否在欺骗他。\n论据：该地铁安检员只需要与乘客进行短短的几句对话就能断定对方是否可疑；而在他认为可疑的乘客身上，无一例外地都查出了违禁物品。\n本题通过地铁安检员可以判断乘客可疑，且可疑的乘客都查出来违禁物品，得出他能识别乘客是否在欺骗他，论点论据话题不一致。削弱题，可以优先考虑拆桥，即说明通过地铁安检员认为可疑的乘客都查出来违禁物品，无法得出这个乘客在欺骗他。\n第二步：逐一分析选项。\nA项：该地铁安检员认为不可疑而未经检查的乘客，则没有进行对话，不存在判定其是否欺骗，无法削弱，排除；\nB项：该地铁安检员在他认为可疑而进行检查的乘客中大部分有意地携带了违禁物品，说明他认为可疑并进行对话的乘客有意携带并对他进行欺骗，说明安检员能够准确地识别一位乘客是否在欺骗他，加强选项，排除；\nC项：该地铁安检员在他认为可疑而进行检查的乘客中有人无意地携带了违禁物品，说明他认为可疑并进行对话的乘客虽然查出来违禁物品，但是并没对他进行欺骗，因为乘客是无意的，说明论据不能得出论点，拆桥项，当选；\nD项：该地铁安检员认为不可疑而未经检查的乘客，则没有进行对话，不存在判定其是否欺骗，无法削弱，排除。\n故正确答案为C。","no":113,"missingImage":false},{"type":"question","qid":"2366013","cat":"逻辑判断","stem":"一项针对两组行政单位科级职员的调查发现，第一组职员在10周内户外活动的次数不少于7次；第二组职员则10周内户外活动的次数不多于3次。调查结果显示，第二组职员面临的工作压力大于第一组职员。因此，调查得出结论，科级职员户外活动次数少导致他们工作压力大。\n下列哪项如果为真，最能对上述调查结论提出质疑？","options":{"A":"第一组中有的职员感到自己的工作压力并不大","B":"第一组中有职员工作压力比第二组的职员还高","C":"第二组中有一些职员的工作压力并不是非常大","D":"第二组职员因工作压力大导致户外活动次数少"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：科级职员户外活动次数少导致工作压力大。\n论据：10周内户外活动的次数不多于3次的职员压力大于10周内户外活动的次数不少于7次的职员。\n本题论点中存在因果关系，因为压力大，所以活动次数少。要想削弱论点，可以考虑因果倒置削弱方式。\n第二步：逐一分析选项。\nA项：有的职员感到自己的工作压力并不大，并不能代表该组的整体压力情况，无法削弱，排除；\nB项：第一组中有职员工作压力比第二组的职员还高，不能说明一组二组的整体压力情况，无法削弱，排除；\nC项：有一些职员的工作压力并不是非常大，并不能代表该组的整体压力情况，无法削弱，排除；\nD项：第二组职员因工作压力大导致户外活动次数少，因果倒置削弱论点，当选。\n故正确答案为D。","no":114,"missingImage":false},{"type":"question","qid":"2366014","cat":"逻辑判断","stem":"某地方政府计划削减财政预算，原计划削减\u003cimg data-k=\"d70907a2658d\">。为此，计划撤销两个部门，这两个部门的预算正好占地方政府总预算的\u003cimg data-k=\"d70907a2658d\">。计划实施后，上述两个部门被撤销，整个地方政府预算实际削减\u003cimg data-k=\"363071dac4a0\">。在此过程中，地方政府各部门预算有所调整。\n如果上述判定为真，则以下哪项一定为真？\n①上述计划实施后，有的职能部门预算增加。\n②上述计划实施后，没有一个职能部门预算增加额度超出地方政府原来总预算的\u003cimg data-k=\"815ec268d3d4\">。\n③上述计划实施后，被削减的财政预算，都来自于被撤销的两个部门原有的预算。","options":{"A":"只有①","B":"只有①和②","C":"只有②和③","D":"全部都为真"},"answer":"A","explanation":"日常结论题，根据题干信息逐一分析选项。\n①项：撤销占地方政府总预算的\u003cimg data-k=\"d70907a2658d\">的两个部门后，预算实际削减\u003cimg data-k=\"363071dac4a0\">，比原预算减少削减比例，说明有的部门预算增加，此项可以推出，为真；\n②项：撤销占地方政府总预算的\u003cimg data-k=\"d70907a2658d\">的两个部门后，预算实际削减\u003cimg data-k=\"363071dac4a0\">，可知其余职能部门整体预算增加\u003cimg data-k=\"815ec268d3d4\">，但无法确定是否有个别职能部门预算增加额度超出地方政府原来总预算的\u003cimg data-k=\"815ec268d3d4\">，此项过于绝对，为假；\n③项：撤销占地方政府总预算的\u003cimg data-k=\"d70907a2658d\">的两个部门后，预算实际削减\u003cimg data-k=\"363071dac4a0\">，可知其余职能部门整体预算增加\u003cimg data-k=\"815ec268d3d4\">，但无法确定其他部门的预算的具体变化，可能也存在个别增加或者削减的可能，此项过于绝对，为假。\n故正确答案为A。","no":115,"missingImage":false}],"count":20,"answerable":20,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        自改革开放以来，外商在华投资势头良好。今年两会期间，《中华人民共和国外商投资法（草案）》成为重要议题。2018年，外商直接在华投资（非金融类）新设立企业60533家。外商直接在华投资金额8856亿元，折1350亿美元。其中“一带一路”沿线国家对华直接投资新设立企业4479家，对华直接投资424亿元。全年 /* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;

    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}

  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
