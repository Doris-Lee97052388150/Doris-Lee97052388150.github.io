<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">

    <div class="brand">2019年湖北省选调生招录考试《综合知识和行政职业能力测验》题<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>

    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">

</div>

<div class="bottombar">

    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>

</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>
<div class="toast" id="toast"></div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2019-湖北-选调生","title":"2019年湖北省选调生招录考试《综合知识和行政职业能力测验》题","year":"2019","group":"湖北","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2365804","cat":"时事政治","stem":"中央经济工作会议2018年12月19日至21日在北京举行，会议强调：\n①坚持稳中求进工作总基调  ②坚持新发展理念  ③坚持推动高质量发展  ④坚持以供给侧结构性改革为主线  ⑤坚持深化市场化改革、扩大高水平开放","options":{"A":"①④⑤","B":"②③④","C":"①②⑤","D":"①②③④⑤"},"answer":"D","explanation":"本题考查政治。\n中央经济工作会议2018年12月19日至21日在北京举行。会议强调，2019年是新中国成立70周年，是全面建成小康社会关键之年，做好经济工作至关重要。要以习近平新时代中国特色社会主义思想为指导，全面贯彻党的十九大和十九届二中、三中全会精神，统筹推进“五位一体”总体布局，协调推进“四个全面”战略布局，坚持稳中求进工作总基调，坚持新发展理念，坚持推动高质量发展，坚持以供给侧结构性改革为主线，坚持深化市场化改革、扩大高水平开放，加快建设现代化经济体系，继续打好三大攻坚战。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"2365806","cat":"时事政治","stem":"2018年4月，习近平总书记在视察湖北时对湖北提出的“四个切实”的要求是：\n①切实推动高质量发展  ②切实实施乡村振兴战略  ③切实做好民生工作  ④切实加强作风建设  ⑤切实推动长江经济带发展","options":{"A":"①②③④","B":"①②③⑤","C":"②③④⑤","D":"①④⑤"},"answer":"A","explanation":"本题考查政治。\n2018年4月，习近平总书记视察湖北时对湖北提出的“四个切实”的要求，要求湖北切实推动高质量发展、切实实施乡村振兴战略、切实做好民生工作、切实加强作风建设。习近平总书记的殷殷嘱托，为湖北的改革发展进一步指明了方向。\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"2365811","cat":"新思想","stem":"党的十九大报告明确中国特色社会主义事业战略布局是：","options":{"A":"“五位一体”","B":"“四个全面”","C":"“四个意识”","D":"“四个自信”"},"answer":"B","explanation":"本题考查政治。\n十九大报告明确中国特色社会主义事业总体布局是“五位一体”，即经济建设、政治建设、文化建设、社会建设、生态文明建设“五位一体”，战略布局是“四个全面”，即全面建成小康社会，全面深化改革，全面依法治国，全面从严治党。\n故正确答案为B。\n备注：2020年党的十九届五中全会在北京胜利召开，会议审议通过了《中共中央关于制定国民经济和社会发展第十四个五年规划和二〇三五年远景目标的建议》。明确提出要“协调推进全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党的战略布局”。","no":3,"missingImage":false},{"type":"question","qid":"2365822","cat":"马克思主义","stem":"习近平总书记在哲学社会科学工作座谈会上说“在解读中国实践、构建中国理论上，我们应该最有发言权。”中国实践给理论创造、学术繁荣提供了强大动力和广阔空间，中国哲学社会科学唯有深深植根于中国实践，从中国特色社会主义伟大实践的源头汲取活水，方能具有强大的理论生命力。\n以上论述所蕴含的认识论原理是：","options":{"A":"认识是否有客观真理性，这是个实践问题","B":"实践是认识的基础，对认识具有决定作用","C":"认识只有回到实践中去才能得到检验发展","D":"认识是在实践基础上不断深化的发展过程"},"answer":"B","explanation":"本题考查政治。\n实践与认识的辩证关系原理：实践决定认识，实践是认识的基础，是认识的来源，是认识发展的动力，是检验认识的真理性的唯一标准，是认识的最终目的。认识对实践具有反作用。正确的认识促进实践的发展，错误的认识阻碍实践的发展。\nA项错误，题干强调的是实践的重要性，而非讨论认识是否具有客观真理性这一问题。\nB项正确，题干强调的是实践的重要性，“中国哲学社会科学唯有深深植根于中国实践，从中国特色社会主义伟大实践的源头汲取活水，方能具有强大的理论生命力”强调实践对于理论认识的重要性，植根实践方能有理论生命力。\nC项错误，题干强调的是实践的重要性，并未讨论认识如何检验这一问题。\nD项错误，选项表述正确，但题干强调的是实践的重要性，选项与题干无关。\n故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"2365828","cat":"马克思主义","stem":"我们既对全面建成小康社会作出全面部署，又强调“小康不小康，关键看老乡”；既对全面深化改革作出顶层设计，又强调突出抓好重要领域和关键环节的改革；既对全面推进依法治国作出系统部署，又强调以中国特色社会主义法治体系为总目标和总抓手；既对全面从严治党提出系列要求，又把党风廉政建设作为突破口，着力解决人民群众反映强烈的“四风”问题，着力解决不敢腐、不能腐、不想腐的问题。\n从唯物辩证法的角度看，这坚持了：","options":{"A":"对具体问题具体分析的工作方法","B":"“两点论”和“重点论”的统一","C":"“唯物论”和“辩证法”的统一","D":"从实际出发实事求是的思想路线"},"answer":"B","explanation":"本题考查政治。\n根据主要矛盾和次要矛盾、矛盾的主要方面和次要方面关系的原理，要求我们在实际工作中坚持“两点论”\"和“重点论”的统一。“两点论”是指认识复杂事物的发展过程时，既要看到主要矛盾，又不能忽视次要矛盾；在认识某一矛盾时，既要看到矛盾的主要方面，又不能忽视次要方面。“重点论”是指认识复杂事物的发展过程时，要着重抓住它的主要矛盾；在认识某一矛盾时，要着重把握矛盾的主要方面。\nA项错误，矛盾的特殊性即指具体事物所包含的矛盾以及每一矛盾的各个方面都有其特点，因此要坚持具体问题具体分析。与题干所述内容无关。\nB项正确，辩证法的两点论就是研究复杂事物的发展过程时，既要研究主要矛盾，又要研究次要矛盾；在研究某一种矛盾时，既要研究矛盾的主要方面，又要研究矛盾的次要方面。辩证法的重点论，就是在研究复杂事物的发展过程中，要着重把握它的主要矛盾；在研究某一种矛盾时，要着重把握它矛盾的主要方面。辩证法要求两点论和重点论的统一。“四个全面”即是坚持了“两点论”，把握矛盾着的事物的各个方面；在坚持“四个全面”的过程中重点把握某几个关键点即是坚持了“重点论”。\nC项错误，本题考查辩证法，与“唯物论”无关。\nD项错误，实事求是强调从实际情况出发，不夸大，不缩小，正确地对待和处理问题，与题干无关。\n故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"2365831","cat":"马克思主义","stem":"我们党强调理想信念是共产党人精神上的“钙”，强调“革命理想高于天”，这就是精神变物质、物质变精神的辩证法。广大党员、干部理想信念坚定、干事创业精气神足，人民群众精神振奋、发愤图强，就可以创造出很多人间奇迹。如果党员、干部理想动摇、宗旨淡化，人民群众精神萎靡、贪图安逸，那往往可以干成的事情也干不成。\n这段论述包含的哲学原理是：","options":{"A":"社会意识既依赖于社会存在又有其相对独立性","B":"物质决定意识，意识对物质具有能动的反作用","C":"社会意识与社会存在的发展具有不完全同步性","D":"先进社会意识对社会发展起着积极的促进作用"},"answer":"D","explanation":"本题考查政治。\n思维和存在的关系问题是哲学的基本问题。在社会历史领域中，这个问题表现为社会存在和社会意识的关系问题。社会存在和社会意识的相互关系体现在：社会存在是社会意识的基础和根源，社会意识的全部内容，都是社会存在决定的。社会意识对社会存在具有能动的反作用，能够阻碍或促进社会发展。社会意识具有相对独立性。\nA项错误，材料反映了党的理想信念作为精神上的“钙”对社会发展的作用，强调先进的社会意识可以促进社会的发展。\nB项错误，选项说的是物质与意识的辩证关系，属于唯物论的内容，且没有体现题干强调的先进的意识对物质社会发展的促进作用。\nC项错误，社会意识可能落后于社会存在，也可能先于社会存在，存在不完全同步性，选项表述正确，但没有体现出题干所强调的先进的社会意识对社会存在的促进作用。\nD项正确，广大党员、干部理想信念坚定、干事创业精气神足，人民群众精神振奋、发愤图强，就可以创造出很多人间奇迹，这体现了先进社会意识对社会发展起着积极的促进作用。\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"2365873","cat":"新思想","stem":"2018年3月11日，第十三届全国人民代表大会第一次会议通过了《中华人民共和国宪法修正案（2018）》，该修正案指出，中国特色社会主义最本质的特征是：","options":{"A":"坚持人民民主专政","B":"坚持民主集中制原则","C":"坚持人民代表大会制度","D":"坚持中国共产党的领导"},"answer":"D","explanation":"本题考查政治常识。\n十三届全国人大第一次会议表决通过了《中华人民共和国宪法修正案》，这是以习近平同志为核心的党中央从新时代坚持和发展中国特色社会主义全局和战略高度作出的重大决策，是推进全面依法治国、推进国家治理体系和治理能力现代化的重大举措。宪法修正案把“中国共产党领导是中国特色社会主义最本质的特征”写入宪法总纲第一条第二款，体现了对习近平新时代中国特色社会主义思想和党的十九大精神的贯彻落实，为坚持党的领导提供了强有力的宪法保障。\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"2365883","cat":"新思想","stem":"2018年3月20日，第十三届全国人民代表大会第一次会议通过了《中华人民共和国监察法》。根据该法，以下关于监察工作的表述正确的是：\n①要坚持中国共产党对国家监察工作的领导\n②监察工作要坚持惩前毖后、治病救人和刚柔相济\n③监察机关对所有行使公权力的公职人员进行监察\n④监察工作要构建不敢腐、不能腐、不想腐的长效机制","options":{"A":"②④","B":"①③","C":"①③④","D":"①②③④"},"answer":"D","explanation":"本题考查法律常识。\n①正确，《监察法》第二条规定：“坚持中国共产党对国家监察工作的领导，以马克思列宁主义、毛泽东思想、邓小平理论、‘三个代表’重要思想、科学发展观、习近平新时代中国特色社会主义思想为指导，构建集中统一、权威高效的中国特色国家监察体制。”\n②正确，《监察法》第五条规定：“国家监察工作严格遵照宪法和法律，以事实为根据，以法律为准绳；在适用法律上一律平等，保障当事人的合法权益；权责对等，严格监督；惩戒与教育相结合，宽严相济。” \n③正确，《监察法》第三条规定：“各级监察委员会是行使国家监察职能的专责机关，依照本法对所有行使公权力的公职人员（以下称公职人员）进行监察，调查职务违法和职务犯罪，开展廉政建设和反腐败工作，维护宪法和法律的尊严。”\n④正确，《监察法》第六条规定：“国家监察工作坚持标本兼治、综合治理，强化监督问责，严厉惩治腐败；深化改革、健全法治，有效制约和监督权力；加强法治教育和道德教育，弘扬中华优秀传统文化，构建不敢腐、不能腐、不想腐的长效机制。”\n可知，表述正确的是①②③④，故A、B、C三项错误，D项正确。\n故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"2365904","cat":"新思想","stem":"根据《中国共产党重大事项请示报告条例》，下列表述不正确的是：","options":{"A":"党组织请示报告工作不得以党组织负责同志名义代表党组织进行","B":"请示报告制度是中国共产党的一项重要政治纪律、组织纪律、工作纪律","C":"超出党组织和党员、领导干部自身职权范围的重要事情和情况属于重大事项","D":"开展重大事项请示报告工作应当坚持政治导向、权责明晰、客观真实、规范有序"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，根据《中国共产党重大事项请示报告条例》第六条第一款规定：“党组织请示报告工作一般应当以组织名义进行，向负有领导或者监督指导职责的上级党组织请示报告。特殊情况下，可以根据工作需要以党组织负责同志名义代表党组织请示报告。”\nB项正确，中共中央印发了《中国共产党重大事项请示报告条例》并发出通知。通知指出，请示报告制度是我们党的一项重要政治纪律、组织纪律、工作纪律，是执行民主集中制的有效工作机制，对于坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导，保证全党团结统一和行动一致，具有重要意义。\nC项正确，根据《中国共产党重大事项请示报告条例》第三条第二款规定：“本条例所称重大事项，是指超出党组织和党员、领导干部自身职权范围，或者虽在自身职权范围内但关乎全局、影响广泛的重要事情和重要情况，包括党组织贯彻执行党中央决策部署和上级党组织决定、领导经济社会发展事务、落实全面从严治党责任，党员履行义务、行使权利，领导干部行使权力、担负责任的重要事情和重要情况。”\nD项正确，根据《中国共产党重大事项请示报告条例》第四条规定，开展重大事项请示报告工作应当遵循以下原则：（一）坚持政治导向；（二）坚持权责明晰；（三）坚持客观真实；（四）坚持规范有序。\n本题为选非题，故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"2365953","cat":"时事政治","stem":"2019年3月，李克强总理在十三届全国人大二次会议所作的政府工作报告中，宣布实施更大规模减税时，人民大会堂内接连响起两次掌声。“减税降费”主要有利于：","options":{"A":"提高财政收入","B":"提振实体经济","C":"提振股市行情","D":"保持社会稳定"},"answer":"B","explanation":"本题考查经济常识。\nA项错误，2019年的政府工作报告中指出：“全年减轻企业税收和社保缴费负担近2万亿元。这会给各级财政带来很大压力。为支持企业减负，各级政府要过紧日子，想方设法筹集资金。”\nB项正确，“减税降费”政策是近年来我国重要的财政政策手段,有利于进一步减轻企业负担，促进经济结构转型升级，释放了进一步提高内需潜力、提振消费信心、优化营商环境的信号。“减税降费”将重点降低制造业和小微企业税收负担，有利于提振实体经济。\nC项错误，“减税降费”可以一定程度上提振市场情绪，改善市场对企业盈利的预期，但股市行情受多方面因素影响，“减税降费”的影响非常有限。\nD项错误，“减税降费”主要作用于经济领域，对社会稳定并无直接影响。\n故正确答案为B。","no":10,"missingImage":false}],"count":10,"answerable":10,"pointsOf":10},{"label":"常识判断","items":[{"type":"material","material":"\u003cp>        2018年6月，某市发生重大洪涝灾害。市领导亲临现场指挥，并由市政府授权市水利局全权负责抢险救灾实施工作。在严重的自然灾害面前，市水利局局长黄某勇于担当，积极组织当地干部群众，团结一心，奋力抢险救灾。黄某多次到相关街道进行宣传教育、沟通协调，保证了救灾工作的顺利进行，圆满地完成了抢险救灾任务。2018年水利局绩效考核中，群众满意度位居前列。\u003c/p>","questions":[{"qid":"2365928","cat":"人文常识","stem":"行政指挥者必须具备的能力素质有：\n①敢于指挥②善于指挥③精于指挥④亲临指挥","options":{"A":"①②③","B":"②③④","C":"①②","D":"①③"},"answer":"A","explanation":"本题考查管理学常识。\n行政指挥是指行政领导者按照既定的目标和计划，对所属下级的行政活动进行指导，以实现行政目标的行为。指挥者必须具备的条件：1、足够的权威基础；2、运用权威的能力：（1）敢于指挥，（2）善于指挥，（3）精于指挥。因此选择①②③，行政指挥不要求指挥者亲临指挥，故A项符合题意。\n故正确答案为A。","no":11,"missingImage":false},{"qid":"2365931","cat":"人文常识","stem":"案例中黄某采取的行政方法属于：","options":{"A":"强制性行政方法","B":"诱导性行政方法","C":"参与管理方法","D":"行政责任方法"},"answer":"B","explanation":"本题考查管理学常识。\nA项错误，强制性行政方法是指以事为中心的事务至上的行政方法，这种方法将人置于从属的地位，其作用的结果是人们不得不服从于行政目标并为之努力工作。\nB项正确，诱导性行政方法是一种以人为中心的人本主义管理方法，它通过利用非强制手段使机关工作人员和广大群众自觉自愿地去从事政府所鼓励的工作和活动。案例中黄某“积极组织群众，团结一心抢险救灾，沟通协调”等行为体现了诱导性行政方法。\nC项错误，参与管理方法是通过由下级行政主体或行政客体参加管理和决策来提高人们的积极性和管理效率的一种行政管理方法。\nD项错误，行政责任方法是现代行政管理当中一种综合性管理方法，它用行政体制中的权责机制将组织中的目标与人事中的职位有机地结合起来，从而使行政工作中的权、责、利诸要素达到一致，包括机关责任制与岗位责任制两个方面。\n故正确答案为B。","no":12,"missingImage":false},{"qid":"2365933","cat":"人文常识","stem":"在全部行政管理实践工作中，最实际、最经常、最具体的活动是：","options":{"A":"行政实施","B":"行政控制","C":"行政协调","D":"行政计划"},"answer":"A","explanation":"本题考查管理学常识。\nA项正确，行政实施指行政组织采取相应的手段和措施实现行政决策的过程。行政实施在行政管理活动中是非常重要的。在全部的行政管理工作中,最实际、最经常、最具体的活动就是行政实施。\nB项错误，行政控制指行政领导者以行动计划为标准衡量实际工作，采取必要的措施纠正偏差，以确保决策目标实现的管理活动。\nC项错误，行政协调指调整行政系统内各机构之间、人员之间、行政运行各环节之间、行政系统与行政环境之间的关系，以提高行政效能，实现行政目标的行为。\nD项错误，行政计划指行政机关为达成特定的行政目的，为履行行政职能就所面临的问题，从实际出发，对有关方法、步骤或措施等所做的设计与规划。\n故正确答案为A。","no":13,"missingImage":false},{"qid":"2365934","cat":"人文常识","stem":"市政府对市水利局的行政授权属于：","options":{"A":"特定授权","B":"充分授权","C":"复合授权","D":"柔性授权"},"answer":"B","explanation":"本题考查管理学常识。\nA项错误，特定授权也称不充分授权或刚性授权，是指上级领导对下级的工作范围、内容、应达到的绩效目标，完成工作的具体途径都有详细的规定，下级必须严格按照上级领导的意图开展工作，执行上级领导发布的各项指示。\nB项正确，充分授权也称一般授权，是指上级行政主体在给下级分派任务时，允许下级按照自己的思路和想法决定行动方案，发挥自己的积极性和创造性去努力工作，达到目标。本题目的为抢险救灾，时间紧迫，“市政府授权市水利局全权负责抢险救灾实施工作”，而水利局局长充分发挥创造性和积极性，灵活应变，动员群众，在最短时间内解除了灾情。因此这种授权属于充分授权。\nC项错误，复合授权也称制约授权，是把某项任务的职权，分解授予两个或多个子系统，使子系统之间产生互相制约的作用，以避免出现疏漏。\nD项错误，柔性授权指领导者对工作的具体安排，仅指示出一个大纲或轮廓，被授权者有较大的自由做随机应变的处理。\n故正确答案为B。","no":14,"missingImage":false},{"qid":"2365808","cat":"法律常识","stem":"深化党和国家机构改革，要遵循的原则是：\n①坚持党的全面领导  ②坚持以人民为中心  ③坚持改革创新、激发活力  ④坚持优化协同高效  ⑤坚持全面依法治国","options":{"A":"①②③","B":"①③⑤","C":"②③④⑤","D":"①②④⑤"},"answer":"D","explanation":"本题考查政治。\n党的十九届三中全会强调，深化党和国家机构改革必须遵循坚持党的全面领导、坚持以人民为中心、坚持优化协同高效、坚持全面依法治国的原则。学习贯彻党的十九届三中全会精神，就要牢牢把握深化党和国家机构改革的四个原则，增强推进改革的自觉性和坚定性。\n故正确答案为D。","no":15,"missingImage":false},{"qid":"2365810","cat":"人文常识","stem":"党的根本性建设是：","options":{"A":"党的思想建设","B":"党的作风建设","C":"党的政治建设","D":"党的组织建设"},"answer":"C","explanation":"本题考查政治。\n党的十九大报告指出：“把党的政治建设摆在首位。旗帜鲜明讲政治是我们党作为马克思主义政党的根本要求。党的政治建设是党的根本性建设，决定党的建设方向和效果。保证全党服从中央，坚持党中央权威和集中统一领导，是党的政治建设的首要任务。” \n故正确答案为C。","no":16,"missingImage":false},{"qid":"2365813","cat":"人文常识","stem":"我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。这表明：","options":{"A":"我国基本国情已经发生变化","B":"我国的国际地位发生了改变","C":"我国已进入到社会主义中级阶段","D":"我国仍处于并将长期处于社会主义初级阶段"},"answer":"D","explanation":"本题考查政治。\n习近平总书记在十九大报告中指出：“中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。”这一重要论断反映了我国社会发展的巨大进步，反映了发展的阶段性特征，对党和国家工作提出了新要求。习近平总书记在十九大报告中强调：“必须认识到，我国社会主要矛盾的变化，没有改变我们对我国社会主义所处历史阶段的判断，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。”\nA项错误，我国社会主要矛盾的变化，并没有改变我国的基本国情，我国仍处于并将长期处于社会主义初级阶段。\nB项错误，我国社会主要矛盾的变化，并未改变我国是世界最大发展中国家的国际地位。\nC项错误，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国并未进入社会主义中级阶段。\nD项正确，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变。\n故正确答案为D。","no":17,"missingImage":false},{"qid":"2365815","cat":"人文常识","stem":"全面深化改革的总目标是：","options":{"A":"着力解决好发展不平衡不充分问题","B":"实现社会主义现代化和中华民族伟大复兴","C":"推动我国经济实力、科技实力、国防实力、综合国力进入世界前列","D":"完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化"},"answer":"D","explanation":"本题考查政治。\n党的十八届三中全会《中共中央关于全面深化改革若干重大问题的决定》提出，全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。“明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化”是党的十九大报告中“八个明确”之一，是习近平新时代中国特色社会主义思想的重要内容，对于保证全面深化改革始终沿着正确方向和道路行进，至关重要。\n故正确答案为D。","no":18,"missingImage":false},{"qid":"2365817","cat":"人文常识","stem":"我国经济正在发生深刻变化，深化供给侧结构性改革要更多采取改革的办法，更多运用市场化、法治化手段，在        上下功夫。这八字方针是当前和今后一个时期深化供给侧结构性改革、推动经济高质量发展管总的要求。","options":{"A":"深化、激活、提高、加速","B":"巩固、激活、提升、加速","C":"巩固、增强、提升、畅通","D":"深化、增强、提高、畅通"},"answer":"C","explanation":"本题考查政治。\n我国经济正在发生深刻变化，深化供给侧结构性改革要更多采取改革的办法，更多运用市场化、法治化手段，在巩固、增强、提升、畅通上下功夫，具体而言：巩固——要巩固“三去一降一补”成果，推动更多产能过剩行业加快出清，降低全社会各类营商成本，加大基础设施等领域补短板力度；增强——要增强微观主体活力，发挥企业和企业家主观能动性，建立公平开放透明的市场规则和法治化营商环境，促进正向激励和优胜劣汰，发展更多优质企业；提升——要提升产业链水平，注重利用技术创新和规模效应形成新的竞争优势，培育和发展新的产业集群；畅通——要畅通国民经济循环，加快建设统一开放、竞争有序的现代市场体系，提高金融体系服务实体经济能力，形成国内市场和生产主体、经济增长和就业扩大、金融和实体经济良性循环。\n故正确答案为C。","no":19,"missingImage":false},{"qid":"2365820","cat":"地理国情","stem":"湖北省委十一届四次全会暨全省经济工作会议提出，要大力实施的区域和产业发展布局是：\n①一芯驱动  ②双核驱动  ③两带支撑  ④三区协同  ⑤多点支撑","options":{"A":"①③⑤","B":"②④⑤","C":"②③⑤","D":"①③④"},"answer":"D","explanation":"本题考查政治。\n湖北省委十一届四次全体会议暨全省经济工作会议上，省委省政府提出以“一芯驱动、两带支撑、三区协同”为主要内容的区域和产业发展战略布局。“一芯驱动”，要大力发展以集成电路为代表的高新技术产业、战略性新兴产业和高端成长型产业，培育国之重器的“芯”产业集群，将武汉、襄阳、宜昌等地打造成为综合性国家产业创新中心、“芯”产业智能创造中心、制造业高质量发展国家级示范区，加快形成中心带动、多极支撑的“心”引擎，加快形成高质量发展的“新”动能体系；“两带支撑”，要以长江经济带、汉江生态经济带为依托，以沿线重要城镇为节点，打造长江绿色经济和创新驱动发展带、汉随襄十制造业高质量发展带；“三区协同”，要按照区域统筹、产业集聚的思路，推动鄂西绿色发展示范区、江汉平原振兴发展示范区、鄂东转型发展示范区竞相发展，形成全省东、中、西三大片区高质量发展的战略纵深。\n故正确答案为D。","no":20,"missingImage":false},{"qid":"2365825","cat":"人文常识","stem":"山水林田湖草是生命共同体。生态是统一的自然系统，是相互依存、紧密联系的有机链条。人的命脉在田，田的命脉在水，水的命脉在山，山的命脉在土，土的命脉在林和草，这个生命共同体是人类生存发展的物质基础。\n以上论述体现的历史唯物主义观点是：\n①人类是自然界长期发展的产物和有机组成部分\n②生产方式是社会存在和发展的基础和决定力量\n③人们离开一定的自然条件就不可能生活和生产\n④一定的自然条件对社会发展起促进和延缓作用","options":{"A":"③④","B":"②③","C":"①④","D":"①③"},"answer":"D","explanation":"本题考查政治。\n①正确，题干强调人与自然是有机统一的生命共同体，换言之，人类是自然界长期发展的产物和有机组成部分。\n②错误，生产方式是指人类使用什么样的工具，在什么样的社会关系下从事物质生产活动，即生产力和生产关系的统一。生产方式是社会发展的决定力量。这一表述本身正确，但与题干无关。\n③正确，生命共同体是人类生存发展的物质基础，意味着人们离开一定的自然条件就不可能生活和生产。\n④错误，题干并未论述自然条件对社会发展的促进和延缓作用，而是强调自然条件是人类生存发展的基础。\n故正确答案为D。","no":21,"missingImage":false},{"qid":"2365826","cat":"人文常识","stem":"人民是共和国的坚实根基，人民是我们执政的最大底气。一路走来，中国人民自力更生、艰苦奋斗，创造了举世瞩目的中国奇迹。新征程上，不管乱云飞渡、风吹浪打，我们都要紧紧依靠人民，坚持自力更生、艰苦奋斗，以坚如磐石的信心，只争朝夕的劲头、坚忍不拔的毅力，一步一个脚印把前无古人的伟大事业推向前进。\n以上论述的哲学依据是：","options":{"A":"尊重人民的主体地位，把人民利益放在首位","B":"依靠人民，相信人民的创造力是无穷无尽的","C":"人民群众是社会历史的主体和历史的创造者","D":"群众路线是我们党的生命线和根本工作路线"},"answer":"C","explanation":"本题考查政治。\n马克思主义哲学认为：人民群众是历史的创造者，是历史的主体，是推动社会发展的决定力量。人民群众历史作用具体体现在：人民群众是社会物质财富的创造者；人民群众是社会精神财富的创造者；人民群众是实现社会变革的决定力量。\nA、B、D项错误，所述内容是历史唯物主义群众史观指导下的具体实践，不是题干所述内容的哲学依据。\nC项正确，题干中“人民是共和国的坚实根基”“紧紧依靠人民”的依据都是“人民群众是历史的创造者，是历史的主体，是推动社会发展的决定力量”。\n故正确答案为C。","no":22,"missingImage":false},{"qid":"2365830","cat":"科技常识","stem":"马克思主义哲学是研究中国国情最根本的科学的思想武器。掌握了这个思想武器，我们就有了观察宏观中国、外部中国的“望远镜”，也有了观察微观中国、内部中国的“显微镜”，才能够从宏观与微观、内部与外部等不同视角广泛而深刻地了解正在发展变化的当代中国。\n这段话表明马克思主义哲学是：","options":{"A":"科学世界观和方法论","B":"马克思主义理论基础","C":"改造世界的精神武器","D":"当今时代精神的精华"},"answer":"A","explanation":"本题考查政治。\n马克思主义哲学是科学世界观和方法论，擅长于用矛盾冲突的观点分析社会中利益存在冲突的社会群体，是一套“经典”的社会学理论。\nA项正确，马克思主义哲学深刻揭示了客观世界特别是人类社会发展一般规律。题干反映了马克思主义哲学是我们观察世界、认识世界的科学世界观和方法论。\nB项错误，题干强调的是马克思主义哲学作为思想武器在实践中的重要作用，而不是作为理论基础的重要性。\nC项错误，题干强调马克思主义作为思想武器，在观察中国的具体实践中发挥的重要作用，而非改造世界，选项扩大了话题范围。\nD项错误，题干强调的是马克思主义哲学作为思想武器在观察中国的具体实践中的重要作用，未直接体现其在时代精神中的重要性，选项偷换了话题。\n故正确答案为A。","no":23,"missingImage":false},{"qid":"2365833","cat":"人文常识","stem":"一个盲人到亲戚家做客。天黑回家时，亲戚点了个灯笼给他，说：“路黑，你打个灯笼回家吧！”盲人气愤地说：“你明知我是瞎子，还让我打灯笼照路，这不是奚落我吗！”亲戚说：“你在路上走，许多人也在路上走，你打着灯笼，别人可以看到你，就不会撞到你了。”\n在这件事中，盲人和他亲戚看问题方法的不同点表现为：\n①孤立还是联系地看问题\n②抽象还是具体地看问题\n③片面还是全面地看问题\n④主观还是客观地看问题","options":{"A":"②③","B":"③④","C":"①②","D":"①③"},"answer":"D","explanation":"本题考查政治。\n①正确，联系是事物之间以及事物内部诸要素之间的相互影响、相互制约和相互作用。盲人只孤立地从自己的角度看问题，而他亲戚是联系地看待问题，将盲人与路人联系起来。\n②错误，抽象是指在认识上把事物的规定、属性、关系从原来有机联系的整体中孤立地抽取出来。抽象是从众多的事物中抽取出共同的、本质性的特征，以达到对具体事物的某种本质方面的认识。具体是指尚未经过这种抽象的感性对象。盲人和他亲戚都是具体地看待问题，都是针对有无必要打灯笼这一具体问题。\n③正确，盲人只从自己角度片面看问题，他亲戚却还能考虑到路人，考虑问题全面。 \n④错误，主观地看问题是指不依据实际情况，单凭自己的偏见来看待问题；客观地看问题是指按照事物的本来面目去看待或考察，不加个人偏见。盲人认为自己夜行不需打灯笼符合其实际情况，属客观看待问题；亲戚认为盲人夜行打灯笼可以避免被人撞到也符合实际情况，亦属客观看待问题。故二者不存在主观看待问题与客观看待问题的区别。\n故正确答案为D。","no":24,"missingImage":false},{"qid":"2365834","cat":"人文常识","stem":"十七世纪末以前，欧洲人认为——所有天鹅都是白色的。因为当时他们在实践中看到的天鹅的确都是白色的，直到1697年探险家在澳大利亚发现了黑天鹅，人们才知道错了。马克思主义哲学有关理论认为，实践具有历史性和局限性，不可能对现有一切认识都作出确定的检验，既不能完全证实也不能完全驳倒一定时期提出的各种认识结论。\n这种哲学理论被称为：","options":{"A":"实践作为真理标准的唯一性","B":"实践标准的绝对性和确定性","C":"实践标准的相对性和不确定性","D":"实践的客观性、意识性和社会性"},"answer":"C","explanation":"本题考查政治。\nA项错误，实践作为真理标准的唯一性是指实践是检验真理的唯一标准，但与题干无关。\nB项错误，实践标准的绝对性和确定性是指只有实践才是检验认识真理性的唯一标准；实践最终一定能检验认识的真理性；凡经实践证实的一切认识都是客观真理，都有不可推翻的性质。这一理论与题干无关。\nC项正确，实践标准的相对性和不确定性是指实践是历史的、发展着的实践，具体的实践有其局限性，任何一个时代的实践往往又不能充分证实或驳倒人类认识的一切理论和观点；实践检验真理是一个过程，不是一次能够完成的；已被检验过的真理还要经受实践的检验。题干中，一开始实践证明了天鹅都是白色的，后来经实践的进一步检验，发现也有黑天鹅，体现了实践标准的相对性和不确定性。\nD项错误，实践具有客观性、意识性（主观能动性）和社会性，具体而言，客观性：实践是以客观事物为对象的物质性活动，是主体对于客体的改造；意识性：实践又是自觉能动的活动，与动物本能的、被动的适应性活动不同，人的活动总是有意识的、有目的的；社会性：实践还是社会的历史的活动，人只有结成一定的社会关系，构成一定的社会力量，才能进行改造自然的生产活动。选项表述正确，但与题干无关。\n故正确答案为C。","no":25,"missingImage":false},{"qid":"2365835","cat":"人文常识","stem":"“一带一路”倡议提出6年来，已成为世界上规模最大的合作和发展平台，目前已有123个国家和29个国际组织签署了共建“一带一路”合作文件，“七国集团”成员国意大利表态参与“一带一路”建设。通过合作，东非有了第一条高速公路，马尔代夫有了第一座跨海大桥，肯尼亚的世纪工程蒙内铁路建成通车······大量事实证明，参与“一带一路”合作，加快了相关各国和地区发展进程，改善了沿线民生需求，开辟了互利共赢的前景。\n从哲学角度看，这彰显出：","options":{"A":"相互联系必然促进事物运动发展","B":"事物多样性决定了联系的多样性","C":"整个世界是相互联系的统一整体","D":"发展有前进性、上升性和永恒性"},"answer":"C","explanation":"本题考查政治。\nA项错误，选项本身说法过于绝对，事物之间的联系不一定都能促进事物的发展，只有那些符合事物发展规律的联系才能促进事物的发展。\nB项错误，题干并未体现联系的多样性。 \nC项正确，众多国家参与“一带一路”合作，说明国家与国家之间是普遍联系的，整个世界是普遍联系的统一整体，沿线国家利用联系的这一特点促进了本国的发展，改善了民生的需求。\nD项错误，发展是具有前进性的运动，是事物由低级到高级、由简单到复杂、由无序到有序的上升运动，世界上的任何事物都处在发展之中，都有其产生、发展、灭亡的历史，世界是永恒发展的。选项说法正确，但是题干并未体现。\n故正确答案为C。","no":26,"missingImage":false},{"qid":"2365836","cat":"人文常识","stem":"关于认识辩证运动过程的哲学理论说，认识世界的目的是改造世界，此外再无别的目的。毛泽东同志指出：“马克思主义的哲学认为十分重要的问题，不在于懂得了客观世界的规律性，因而能够解释世界，而在于拿了这种对于客观规律性的认识去能动地改造世界”。同时指出：“如果有了正确的理论，只是把他空谈一阵束之高阁，并不实行，那么，这种理论再好也是没有意义的”。\n以下哪项体现了上述哲学理论？\n①理论不能用理论检验，只有回到实践中去才能得到检验、完善和发展\n②实现中国梦，必须苦干实干拼命干，否则再好的蓝图只能是一纸空文\n③把已经掌握的关于事物规律性的认识运用于实践，以“知”促“行”\n④社会主义是亿万人民撸起袖子干出来的，不干，半点马克思主义也没有","options":{"A":"①③","B":"②④","C":"②③④","D":"①②③④"},"answer":"C","explanation":"本题考查政治。\n题干中毛泽东同志的两段话都体现了实践是认识的最终目的和归宿这一哲学理论。\n①实践是检验认识（理论）真理性的唯一标准，选项表述正确，但题干并未讨论以实践检验认识（理论）这一话题，题干强调的是应将认识（理论）转变为实践，至于实践能否检验认识（理论）并未直接涉及。故①未体现题干中包含的哲学理论。\n②“苦干实干拼命干”强调实践的重要性，“否则再好的蓝图只能是一纸空文”则说明不注重实践，认识（理论）将失去意义，这一表述体现了实践是认识的最终目的和归宿这一哲学理论。\n③“把已经掌握的关于事物规律性的认识运用于实践”体现了认识（理论）的最终目的和归宿是实践这一哲学理论。\n④“社会主义是亿万人民撸起袖子干出来的”强调实践的重要性，“不干，半点马克思主义也没有”则说明不注重实践，认识（理论）将失去意义，这一表述体现了实践是认识的最终目的和归宿这一哲学理论。\n故正确答案为C。","no":27,"missingImage":false},{"qid":"2365837","cat":"人文常识","stem":"量变和质变辩证关系原理指出，量变是质变的必要准备。任何事物的变化都有一个量变的过程，没有量变的积累，质变就不会发生；质变是量变的必然结果。单纯的量变不会永远持续下去，量变达到一定程度必然引起质变。\n以下哪句话与上述原理无关？","options":{"A":"九层之台，从平地垒土起","B":"千丈之堤，以蝼蚁之穴溃","C":"百尺之室，以突隙之烟焚","D":"故夫变者，古今之公理也"},"answer":"D","explanation":"本题考查政治。\n量变和质变，是事物发展变化的两种基本形式，二者既有区别又有联系，在事物发展过程中，它们是相互依存、相互渗透的。\nA项正确，“九层之台，从平地垒土起”意思是九层的高台，是一筐土一筐土筑起来的，是量的积累，最终导致质变。\nB项正确，“千丈之堤，以蝼蚁之穴溃”意思是千里长的大堤，往往因蚂蚁洞穴而崩塌。比喻小事不慎将酿成大祸，体现了量变和质变的关系。\nC项正确，“百尺之室，以突隙之烟焚”意思是百尺高楼，可能因为烟囱的缝隙冒出火星引起火灾而焚毁，比喻小事不慎将酿成大祸，体现了量变和质变的关系。\nD项错误，“故夫变者，古今之公理也”意思是万事都不是一成不变的，每时每刻都处在变化之中，没有体现量变与质变之间的关系。\n本题为选非题，故正确答案为D。","no":28,"missingImage":false},{"qid":"2365838","cat":"人文常识","stem":"2019年中央1号文件强调，坚持农业农村优先发展，各级党委和政府必须把落实“四个优先”的要求作为做好“三农”工作的头等大事。“四个优先”是指：\n①在政策制定上优先决策  ②在干部配备上优先考虑  ③在规划布局上优先编制  ④在要素配置上优先满足  ⑤在资金投入上优先保障  ⑥在公共服务上优先安排","options":{"A":"①②③④","B":"①③⑤⑥","C":"②④⑤⑥","D":"②③④⑤"},"answer":"C","explanation":"本题考查政治。\n2019年中央1号文件指出：各级党委和政府必须把落实“四个优先”的要求作为做好“三农”工作的头等大事，扛在肩上、抓在手上，同政绩考核联系到一起，层层落实责任。优先考虑“三农”干部配备，把优秀干部充实到“三农”战线，把精锐力量充实到基层一线，注重选拔熟悉“三农”工作的干部充实地方各级党政班子；优先满足“三农”发展要素配置，坚决破除妨碍城乡要素自由流动、平等交换的体制机制壁垒，改变农村要素单向流出格局，推动资源要素向农村流动；优先保障“三农”资金投入，坚持把农业农村作为财政优先保障领域和金融优先服务领域，公共财政更大力度向“三农”倾斜，县域新增贷款主要用于支持乡村振兴；优先安排农村公共服务，推进城乡基本公共服务标准统一、制度并轨，实现从形式上的普惠向实质上的公平转变。\n故正确答案为C。","no":29,"missingImage":false},{"qid":"2365839","cat":"人文常识","stem":"根据打赢脱贫攻坚战的任务目标，到2020年，要确保现行标准下农村贫困人口实现脱贫，消除                ；确保贫困县全部摘帽，解决                。","options":{"A":"相对贫困  集中连片贫困","B":"绝对贫困  区域性整体贫困","C":"绝对贫困  集中连片贫困","D":"相对贫困  区域性整体贫困"},"answer":"B","explanation":"本题考查政治。\n中共中央、国务院《关于打赢脱贫攻坚战三年行动的指导意见》明确指出：到2020年，巩固脱贫成果，通过发展生产脱贫一批，易地搬迁脱贫一批，生态补偿脱贫一批，发展教育脱贫一批，社会保障兜底一批，因地制宜综合施策，确保现行标准下农村贫困人口实现脱贫，消除绝对贫困；确保贫困县全部摘帽，解决区域性整体贫困。\n故正确答案为B。","no":30,"missingImage":false},{"qid":"2365840","cat":"人文常识","stem":"实施乡村振兴战略，必须坚持城乡融合发展，加快形成新型工农城乡关系。新型工农城乡关系的内涵包括：\n①工农互促  ②以工促农  ③城乡互补  ④以城带乡\n⑤全面融合  ⑥一体统筹  ⑦共同繁荣  ⑧协调均衡","options":{"A":"②④⑥⑧","B":"①③⑥⑧","C":"②④⑤⑦","D":"①③⑤⑦"},"answer":"D","explanation":"本题考查政治常识。\n习近平总书记在2017年底召开的中央农村工作会议上指出，农业强不强、农村美不美、农民富不富，决定着亿万农民的获得感和幸福感，决定着我国全面小康社会的成色和社会主义现代化的质量。走中国特色社会主义乡村振兴道路，必须重塑城乡关系，走城乡融合发展之路；推动新型工业化、信息化、城镇化、农业现代化同步发展，加快形成工农互促、城乡互补、全面融合、共同繁荣的新型工农城乡关系。\n故正确答案为D。\n（备注：2020年党的十九届五中全会在北京胜利召开，党的十九届五中全会提出要全面推进乡村振兴，强化“以工补农、以城带乡，推动形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系”。只有将乡村放在新型工农城乡关系格局中理解，才能从全局上推进乡村振兴战略，促进乡村全面振兴。）","no":31,"missingImage":false},{"qid":"2365841","cat":"人文常识","stem":"在实施乡村振兴战略中要注意处理好的关系是：\n①长期目标和短期目标的关系  ②总体谋划和久久为功的关系\n③顶层设计和基层探索的关系  ④自身发展和协同发展的关系\n⑤充分发挥市场决定性作用和更好发挥政府作用的关系\n⑥增强群众获得感和适应发展阶段的关系","options":{"A":"①③⑤⑥","B":"②③④⑤","C":"②③④⑥","D":"①④⑤⑥"},"answer":"A","explanation":"本题考查政治。 \n习近平总书记强调，在实施乡村振兴战略中要注意处理好以下关系：一是长期目标和短期目标的关系。要遵循乡村建设规律，坚持科学规划、注重质量、从容建设，一件事情接着一件事情办，一年接着一年干，切忌贪大求快、刮风搞运动，防止走弯路、翻烧饼；二是顶层设计和基层探索的关系。党中央已经明确了乡村振兴的顶层设计，各地要制定符合自身实际的实施方案，科学把握乡村的差异性，因村制宜，发挥亿万农民的主体作用和首创精神，善于总结基层的实践创造。科学把握乡村的差异性，因村制宜，发挥亿万农民的主体作用和首创精神；三是充分发挥市场决定性作用和更好发挥政府作用的关系。要进一步解放思想，推进新一轮农村改革，发挥政府在规划引导、政策支持、市场监管、法治保障等方面的积极作用；四是增强群众获得感和适应发展阶段的关系。要围绕农民群众最关心最直接最现实的利益问题，加快补齐农村发展和民生短板，让亿万农民有更多实实在在的获得感、幸福感、安全感，同时要形成可持续发展的长效机制，坚持尽力而为、量力而行，不能提脱离实际的目标，更不能搞形式主义和“形象工程”。\n故正确答案为A。","no":32,"missingImage":false},{"qid":"2365842","cat":"人文常识","stem":"农业农村工作，说一千、道一万，        是关键。","options":{"A":"发展农业生产","B":"完善乡村治理","C":"美化农村环境","D":"增加农民收入"},"answer":"D","explanation":"本题考查政治。 \n2018年6月12日至14日，习近平总书记在山东考察时指出：农业农村工作，说一千、道一万，增加农民收入是关键。要加快构建促进农民持续较快增收的长效政策机制，让广大农民都尽快富裕起来。\n故正确答案为D。","no":33,"missingImage":false},{"qid":"2365846","cat":"人文常识","stem":"巩固和完善农村基本经营制度，要坚持                基础性地位，赋予双层经营体制新的内涵。","options":{"A":"企业经营","B":"家庭经营","C":"集体经营","D":"合作经营"},"answer":"B","explanation":"本题考查政治常识。\n2019年中央一号文件《中共中央　国务院关于坚持农业农村优先发展做好“三农”工作的若干意见》指出：“巩固和完善农村基本经营制度。坚持家庭经营基础性地位，赋予双层经营体制新的内涵。突出抓好家庭农场和农民合作社两类新型农业经营主体，启动家庭农场培育计划，开展农民合作社规范提升行动，深入推进示范合作社建设，建立健全支持家庭农场、农民合作社发展的政策体系和管理制度。”\n故正确答案为B。","no":34,"missingImage":false},{"qid":"2365848","cat":"人文常识","stem":"农村承包地“三权分置”中的“三权”是指：\n①所有权  ②承包权  ③使用权  ④经营权","options":{"A":"①②④","B":"②③④","C":"①③④","D":"①②③"},"answer":"A","explanation":"本题考查政治常识。\n2016年，国务院印发《关于完善农村土地所有权承包权经营权分置办法的意见》，将农村土地产权中的土地承包经营权进一步划分为承包权和经营权，实行所有权、承包权、经营权分置并行，这一意见的出台在现阶段具有非常重要的意义，是继家庭联产承包责任制后农村改革又一重大制度创新。党的十九大报告提出，巩固和完善农村基本经营制度，深化农村土地制度改革，完善承包地“三权”分置制度。2018年的中央一号文件《关于实施乡村振兴战略的意见》再次强调，完善农村承包地“三权分置”制度，在依法保护集体土地所有权和农户承包权前提下，平等保护土地经营权。\n故正确答案为A。","no":35,"missingImage":false},{"qid":"2365850","cat":"人文常识","stem":"大力发展现代农产品加工业，要以“粮头食尾”、“农头工尾”为抓手，支持主产区依托县域形成农产品加工产业集群，尽可能把        留在县域，改变农村卖原料、城市搞加工的格局。","options":{"A":"价值链","B":"产业链","C":"创新链","D":"销售链"},"answer":"B","explanation":"本题考查政治常识。\n2019年中央一号文件《中共中央　国务院关于坚持农业农村优先发展做好“三农”工作的若干意见》指出：“大力发展现代农产品加工业。以‘粮头食尾’、‘农头工尾’为抓手，支持主产区依托县域形成农产品加工产业集群，尽可能把产业链留在县域，改变农村卖原料、城市搞加工的格局。支持发展适合家庭农场和农民合作社经营的农产品初加工，支持县域发展农产品精深加工，建成一批农产品专业村镇和加工强县。”\n故正确答案为B。","no":36,"missingImage":false},{"qid":"2365852","cat":"人文常识","stem":"抓实建强农村基层党组织，要落实村党组织    年任期规定，推动全国                换届与县乡换届同步进行。","options":{"A":"3  村党组织","B":"5  村“两委”","C":"5  村委会","D":"3  村级组织"},"answer":"B","explanation":"本题考查政治常识。\n2019年中央一号文件《中共中央　国务院关于坚持农业农村优先发展做好“三农”工作的若干意见》指出，强化农村基层党组织领导作用。落实村党组织5年任期规定，推动全国村“两委”换届与县乡换届同步进行。优化农村党员队伍结构，加大从青年农民、农村外出务工人员中发展党员力度。健全县级党委抓乡促村责任制，县乡党委要定期排查并及时解决基层组织建设突出问题。加强和改善村党组织对村级各类组织的领导，健全以党组织为领导的村级组织体系。全面推行村党组织书记通过法定程序担任村委会主任，推行村“两委”班子成员交叉任职，提高村委会成员和村民代表中党员的比例。加强党支部对村级集体经济组织的领导。全面落实“四议两公开”，健全村级重要事项、重大问题由村党组织研究讨论机制。\n故正确答案为B。","no":37,"missingImage":false},{"qid":"2365856","cat":"人文常识","stem":"把提高脱贫质量放在首位，要强化        和        扶持，帮助有劳动能力的贫困人口摆脱贫困，这是可持续脱贫的根本之策。","options":{"A":"产业  就业","B":"技术  资金","C":"健康  教育","D":"项目  政策"},"answer":"A","explanation":"本题考查政治常识。\n2018年的中央一号文件《关于实施乡村振兴战略的意见》指出：“乡村振兴，摆脱贫困是前提。必须坚持精准扶贫、精准脱贫，把提高脱贫质量放在首位。”“对有劳动能力的贫困人口，强化产业和就业扶持，着力做好产销衔接、劳务对接，实现稳定脱贫。”“把扶贫同扶志、扶智结合起来，把救急纾困和内生脱贫结合起来，提升贫困群众发展生产和务工经商的基本技能，实现可持续稳固脱贫。” \n故正确答案为A。","no":38,"missingImage":false},{"qid":"2365861","cat":"人文常识","stem":"土地集体所有权的权利主体是：","options":{"A":"村党组织","B":"村民委员会","C":"农民集体","D":"村“两委”"},"answer":"C","explanation":"本题考查法律常识。《宪法》第十条规定：“城市的土地属于国家所有，农村和城市郊区的土地，除由法律规定属于国家所有的以外，属于集体所有；宅基地和自留地、自留山，也属于集体所有。”因此，我国土地集体所有权的权利主体是农民集体。\n故正确答案为C。","no":39,"missingImage":false},{"qid":"2365864","cat":"人文常识","stem":"调整优化农业结构，需要大力发展紧缺和绿色优质农产品生产，推进农业由        导向转向        导向。","options":{"A":"增量  提效","B":"增速  提质","C":"增收  提效","D":"增产  提质"},"answer":"D","explanation":"本题考查政治常识。\n2019年中央一号文件《中共中央　国务院关于坚持农业农村优先发展做好“三农”工作的若干意见》指出：“调整优化农业结构。大力发展紧缺和绿色优质农产品生产，推进农业由增产导向转向提质导向。深入推进优质粮食工程。实施大豆振兴计划，多途径扩大种植面积。实施农产品质量安全保障工程，健全监管体系、监测体系、追溯体系。”\n故正确答案为D。","no":40,"missingImage":false},{"qid":"2365866","cat":"人文常识","stem":"加强农村基层基础工作，要健全自治、法治、德治相结合的乡村治理体系。自治、法治、德治三者之间的关系是：","options":{"A":"自治为本、法治为先、德治为基","B":"自治为基、法治为先、德治为本","C":"自治为先、法治为本、德治为基","D":"自治为基、法治为本、德治为先"},"answer":"D","explanation":"本题考查政治常识。\n党的十九大报告指出：“加强农村基层基础工作，健全自治、法治、德治相结合的乡村治理体系。”这是一种以乡村振兴战略为方向，以聚焦“三农”问题为导向，以实现“产业兴旺、生态宜居、乡风文明、治理有效、生活富裕”为总要求的现代化乡村治理体系。在“三治结合”的乡村治理体系中，要贯彻自治为基、法治为本、德治为先的原则。\n故正确答案为D。","no":41,"missingImage":false},{"qid":"2365871","cat":"人文常识","stem":"加强社区治理体系建设，要推动社会治理重心向基层下移，打造        的社区治理格局。\n①共建  ②共创  ③共治  ④共生  ⑤共享","options":{"A":"①②③","B":"②④⑤","C":"①③⑤","D":"①②⑤"},"answer":"C","explanation":"本题考查政治常识。\n党的十九大报告指出：“要加强社区治理体系建设，推动社会治理重心向基层下移，发挥社会组织作用，实现政府治理和社会调节、居民自治良性互动。”理解和把握好“推动社会治理重心向基层下移”的要求，打造共建共治共享的社会治理格局，对于推进我国基层治理体系和治理能力的现代化，进一步提升人民群众的获得感、幸福感、安全感，具有十分重要的意义。\n故正确答案为C。","no":42,"missingImage":false},{"qid":"2365881","cat":"人文常识","stem":"根据《中华人民共和国民法总则》，以下行为中属于无效民事行为的是：","options":{"A":"年满10周岁的周某接受他人赠予的铅笔一支","B":"年满7周岁的李某到村头的小商店购买酱油一瓶","C":"年满9周岁的赵某到村头的小商店购买饮料一瓶","D":"年满16周岁，以自己的劳动收入为主要生活来源的王某到超市购买了彩电一台"},"answer":"B","explanation":"本题考查法律常识。《民法总则》第一百四十四条规定：“无民事行为能力人实施的民事法律行为无效。”第一百四十五条第一款规定：“限制民事行为能力人实施的纯获利益的民事法律行为或者与其年龄、智力、精神健康状况相适应的民事法律行为有效；实施的其他民事法律行为经法定代理人同意或者追认后有效。”\nA项错误，《民法总则》第十九条规定：“八周岁以上的未成年人为限制民事行为能力人，实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认，但是可以独立实施纯获利益的民事法律行为或者与其年龄、智力相适应的民事法律行为。”年满10周岁的周某属于限制民事行为能力人，接受他人赠予属于纯获利益民事行为，故其民事行为有效。\nB项正确，《民法总则》第二十条规定：“不满八周岁的未成年人为无民事行为能力人，由其法定代理人代理实施民事法律行为。”年满7周岁的李某为无民事行为能力人，其实施的民事法律行为无效。\nC项错误，年满9周岁的赵某属于限制民事行为能力人，购买饮料属于与其年龄、智力、精神健康状况相适应的民事法律行为，故其民事行为有效。\nD项错误，《民法总则》第十八条规定：“成年人为完全民事行为能力人，可以独立实施民事法律行为。十六周岁以上的未成年人，以自己的劳动收入为主要生活来源的，视为完全民事行为能力人。”故年满16周岁，以自己的劳动收入为主要生活来源的王某被视为完全民事行为能力人，其买彩电的民事行为有效。\n故正确答案为B。","no":43,"missingImage":false},{"qid":"2365887","cat":"法律常识","stem":"王某是某纺织公司员工，一日上班时间，王某在车间内突然晕倒，随即被紧急送往医院，并于当天晚上经医院抢救无效身亡。医院诊断其为脑溢血。经查，王某在纺织公司工作的半年时间里，纺织公司没有与其签订劳动合同，也没有为其购买任何保险。王某家属与纺织公司在事故是否属于工伤方面各执一词。\n请根据以上事实以及相关法律，判断以下说法正确的是：\n①因为王某没有和纺织公司签订劳动合同，所以和纺织公司不存在事实上的劳动关系\n②在没有签订劳动合同的情况下，根据“谁主张谁举证”的原则，王某的家属应该搜集工作证、工资条、工友证言等证据以证明双方存在事实上的劳动关系\n③根据《工伤保险条例》，职工在工作时间和工作岗位，突发疾病死亡或者在48小时以内经抢救无效死亡的，视同工伤。故本案中的王某属于视同工伤的情形\n④根据《工伤保险条例》，职工虽然符合工伤或视同工伤的情形，但有故意犯罪、醉酒或吸毒、自残或自杀等情形的，不得认定为工伤。因此，本案中的王某不存在该类被否定为工伤的事由","options":{"A":"①②③④","B":"②③④","C":"①③","D":"②④"},"answer":"B","explanation":"本题考查法律常识。\n①错误，《劳动合同法》第七条规定：“用人单位自用工之日起即与劳动者建立劳动关系。用人单位应当建立职工名册备查。”即法律对于没有订立书面劳动合同的情况视为劳动关系已建立，并加以保护。王某已在该公司工作半年，虽未签订劳动合同，但仍和纺织公司存在事实上的劳动关系。\n②正确，原劳动部《关于确立劳动关系有关事项的通知》第二条第（二）、（五）项规定：“用人单位未与劳动者签订劳动合同，认定双方存在劳动关系时可参照下列凭证：（二）用人单位向劳动者发放的‘工作证‘、’服务证‘等能够证明身份的证件；······（五）其他劳动者的证言等。”\n③正确，《工伤保险条例》第十五条第（一）项规定：“职工有下列情形之一的，视同工伤：（一）在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的”。王某上班时在车间内晕倒，并于当天晚上抢救无效身亡。\n④正确，《工伤保险条例》第十六条规定：“职工符合本条例第十四条、第十五条的规定，但是有下列情形之一的，不得认定为工伤或者视同工伤：（一）故意犯罪的；（二）醉酒或者吸毒的；（三）自残或者自杀的。”\n故正确答案为B。","no":44,"missingImage":false},{"qid":"2365888","cat":"法律常识","stem":"下列关于行政许可的说法不正确的是：","options":{"A":"实施行政许可，应当遵循便民的原则，提高办事效率，提供优质服务","B":"“行政机关可以通过事后监督等管理方式解决的事项”可以不设行政许可","C":"行政许可法定是行政合法性原则的具体表现","D":"行政许可既可以是依职权的行为也可以是依申请的行为"},"answer":"D","explanation":"本题考查法律常识。《行政许可法》第四条规定：“设定和实施行政许可，应当依照法定的权限、范围、条件和程序。”\nA项正确，《行政许可法》第六条规定：“实施行政许可，应当遵循便民的原则，提高办事效率，提供优质服务。”\nB项正确，《行政许可法》第十三条规定：“本法第十二条所列事项，通过下列方式能够予以规范的，可以不设行政许可：（四）行政机关采用事后监督等其他行政管理方式能够解决的。”\nC项正确，行政合法性原则是指行政权力的设立、行使、运用必须依据法律，符合法律要求，不能与法律相抵触。行政主体必须严格遵守行政法律规范，不得享有行政法规范以外的特权。依法制定行政许可正是这一原则的具体表现。\nD项错误，《行政许可法》第二条规定：“本法所称行政许可，是指行政机关根据公民、法人或者其他组织的申请，经依法审查，准予其从事特定活动的行为。”故行政许可是依申请的行为。而依职权的行政行为是指行政主体根据法律赋予的职权，不待相对一方当事人的请求而主动为之的行为，如行政命令、行政处罚等。\n本题为选非题，故正确答案为D。","no":45,"missingImage":false},{"qid":"2365891","cat":"法律常识","stem":"根据《中华人民共和国行政强制法》，以下不属于行政强制执行的是：","options":{"A":"甲行政机关对拒不履行罚款义务的乙依法加处罚款","B":"乙行政机关对拒不履行罚款义务的丙依法加处滞纳金","C":"丙行政机关对实施行政违法行为的丁处以500元的罚款","D":"丁行政机关对拒不履行排除妨碍、恢复原状义务的戊施以代履行"},"answer":"C","explanation":"本题考查法律常识。《行政强制法》第十二条规定：“行政强制执行的方式：（一）加处罚款或者滞纳金；（二）划拨存款、汇款；（三）拍卖或者依法处理查封、扣押的场所、设施或者财物；（四）排除妨碍、恢复原状；（五）代履行；（六）其他强制执行方式。”\nA项正确，甲行政机关对拒不履行罚款义务的乙依法加处罚款的行为符合《行政强制法》第十二条第（一）项的规定，属于行政强制执行。\nB项正确，乙行政机关对拒不履行罚款义务的丙依法加处滞纳金的行为符合《行政强制法》第十二条第（一）项的规定，属于行政强制执行。\nC项错误，丙行政机关对实施行政违法行为的丁处以500元的罚款属于行政处罚，而非行政强制执行。\nD项正确，丁行政机关对拒不履行排除妨碍、恢复原状义务的戊施以代履行的行为符合《行政强制法》第十二条第（五）项的规定，属于行政强制执行。\n本题为选非题，故正确答案为C。","no":46,"missingImage":false},{"qid":"2365895","cat":"法律常识","stem":"在公交车上，一位古稀老人对一位没有及时让座的少年予以掌掴。该事件被媒体报道后引起了很大的社会反响。有人认为，该老人倚老卖老，掌掴少年的行为是违法行为；也有人认为，该老人获得座位的优先权利应该被社会尊重；也有人认为，本案中少年买票乘车后对空座临时占有的法律权利更应该受到法律的保护。\n从法律和道德角度分析，以下说法正确的是：\n①该案中老人获得座位的优先权利并不必然高于少年买票乘车坐座的法律权利\n②尊重老人、为老弱病残孕让座是中华民族的传统美德，但本案中老人强行要求让座的行为并不存在法律上的依据\n③少年和老年人一样同属于弱势群体，其合法权利应该得到保护，不应受到来自同属于弱势群体中他方的侵害\n④在坚持依法治国的大背景下，“法律和道德相冲突的时候法律优先”不失为解决本案中法律与道德冲突困境的有效方法","options":{"A":"①②③④","B":"③④","C":"①②④","D":"①②③"},"answer":"A","explanation":"本题考查法律常识。\n①正确，虽然法律规定老人有享受社会服务和社会优待的权利，但其权利并不必然高于少年买票乘车坐座的法律权利。\n②正确，因为法和道德的调整规范不尽相同，让座是道德要求，但法律并未强制规定让座义务。\n③正确，老人掌掴少年的行为侵害了少年的人身权，少年和老年人一样同属于弱势群体，其合法权利应该得到保护，不应受到来自同属于弱势群体中他方的侵害。\n④正确，“在依法治国的大背景下，”法律和道德相冲突的时候应优先遵照法律。\n故正确答案为A。","no":47,"missingImage":false},{"qid":"2365896","cat":"法律常识","stem":"《中华人民共和国行政诉讼法》规定，公民、法人或者其他组织认为行政机关和行政机关工作人员的行政行为侵犯其合法权益，有权向人民法院提起行政诉讼。以下提起的诉讼中不属于行政诉讼受案范围的是：","options":{"A":"甲公民对乙公安机关对其作出的行政拘留决定不服","B":"乙公民对丙市政府制定、发布的地方政府规章不服","C":"丙公司对丁行政机关侵犯其经营自主权的行为不服","D":"丁公司对戊行政机关滥用行政权力排除或限制竞争的行为不服"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，《行政诉讼法》第十二条规定：“人民法院受理公民、法人或者其他组织提起的下列诉讼：（一）对行政拘留、暂扣或者吊销许可证和执照、责令停产停业、没收违法所得、没收非法财物、罚款、警告等行政处罚不服的。”\nB项错误，丙市政府制定、发布的地方政府规章不属于行政诉讼法规定的行政诉讼受案范围，故选项错误。\nC项正确，《行政诉讼法》第十二条规定：“人民法院受理公民、法人或者其他组织提起的下列诉讼：（七）认为行政机关侵犯其经营自主权或者农村土地承包经营权、农村土地经营权的。”\nD项正确，《行政诉讼法》第十二条规定：“人民法院受理公民、法人或者其他组织提起的下列诉讼：（八）认为行政机关滥用行政权力排除或者限制竞争的。”\n本题为选非题，故正确答案为B。","no":48,"missingImage":false},{"qid":"2365898","cat":"法律常识","stem":"根据《中华人民共和国刑法》的规定，下列主体中不应该承担刑事责任的是：","options":{"A":"已满十八周岁的公民甲持刀抢劫","B":"已满七十五周岁的公民乙因为过失致人死亡","C":"十五周岁的公民丙多次盗窃公私财物，数额较大","D":"丁公司明知对方是黑社会性质组织犯罪所得，还协助其将资金汇往境外"},"answer":"C","explanation":"本题考查法律常识。《刑法》第十七条规定：“已满十六周岁的人犯罪， 应当负刑事责任。已满十四周岁不满十六周岁的人，犯故意杀人、故意伤害致人重伤或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任。已满十二周岁不满十四周岁的人，犯故意杀人、故意伤害罪，致人死亡或者以特别残忍手段致人重伤造成严重残疾，情节恶劣， 经最高人民检察院核准追诉的，应当负刑事责任。对依照前三款规定追究刑事责任的不满十八周岁的人，应当从轻或者减轻处罚。因不满十六周岁不予刑事处罚的，责令其父母或者其他监护人加以管教；在必要的时候，依法进行专门矫治教育。”《刑法》第十七条之一规定：“已满七十五周岁的人故意犯罪的，可以从轻或者减轻处罚；过失犯罪的，应当从轻或者减轻处罚。”\nA项正确，公民甲已满十八周岁，持刀抢劫应当承担抢劫罪的刑事责任。\nB项正确，已满七十五周岁的公民乙因为过失致人死亡，应当承担过失致人死亡罪的刑事责任，但当从轻或者减轻处罚。\nC项错误，多次盗窃公私财物属于盗窃罪，不在我国刑法第十七条规定的已满十四周岁不满十六周岁应当负刑事责任的八种罪行之中，故十五周岁的公民丙不应该承担刑事责任。\nD项正确，丁公司明知对方是黑社会性质组织犯罪所得，还协助其将资金汇往境外，应当承担洗钱罪的刑事责任。\n本题为选非题，故正确答案为C。","no":49,"missingImage":false},{"qid":"2365901","cat":"法律常识","stem":"某公务员钱某饮酒后驾驶机动车交通肇事，后经检测构成醉驾。根据相关法律的规定，以下关于该公务员可能受到的处理或承担的法律责任，正确的是：\n①监察机关对公务员钱某进行政务处分\n②司法机关追究公务员钱某的刑事责任\n③公安机关交通管理部门对钱某进行相应的行政处罚\n④若交通肇事中的受害人提起民事诉讼，人民法院还可能追究钱某的民事责任","options":{"A":"①④","B":"①③","C":"②③","D":"①②③④"},"answer":"D","explanation":"本题考查法律常识。\n①正确，《监察法》第十一条第三项规定：“监察委员会依照本法和有关法律规定履行监督、调查、处置职责：（三）对违法的公职人员依法作出政务处分决定；对履行职责不力、失职失责的领导人员进行问责；对涉嫌职务犯罪的，将调查结果移送人民检察院依法审查、提起公诉；向监察对象所在单位提出监察建议。”故检察机关应对公务员钱某的违法行为进行政务处分。\n②正确，《刑法》第一百三十三条规定：“违反交通运输管理法规，因而发生重大事故，致人重伤、死亡或者使公私财产遭受重大损失的，处三年以下有期徒刑或者拘役；交通运输肇事后逃逸或者有其他特别恶劣情节的，处三年以上七年以下有期徒刑；因逃逸致人死亡的，处七年以上有期徒刑。”钱某醉驾且交通肇事，符合交通肇事罪构成要件，司法机关应追究公务员钱某的刑事责任。\n③正确，《道路交通安全法》第九十一条第二款、第五款规定：“醉酒驾驶机动车的，由公安机关交通管理部门约束至酒醒，吊销机动车驾驶证，依法追究刑事责任；五年内不得重新取得机动车驾驶证。饮酒后或者醉酒驾驶机动车发生重大交通事故，构成犯罪的，依法追究刑事责任，并由公安机关交通管理部门吊销机动车驾驶证，终生不得重新取得机动车驾驶证。”钱某的行为违反《道路交通安全法》的规定，公安机关交通管理部门应依法对钱某进行相应的行政处罚。\n④正确，钱某交通肇事侵害受害人的生命健康权，受害人有权提起民事诉讼主张权利，人民法院追究钱某的民事责任。\n故正确答案为D。","no":50,"missingImage":false},{"qid":"2365902","cat":"法律常识","stem":"根据我国农村土地承包相关法律规定，下列表述不正确的是：","options":{"A":"林地的承包期限为30年至70年","B":"农村土地承包后，承包方可以流转其土地经营权","C":"农村土地家庭承包的承包方是本集体经济组织的农民","D":"农村土地中不宜采取家庭承包方式的荒山可以采取公开协商承包方式"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，《农村土地承包法》第二十一条第一款规定：“耕地的承包期为三十年。草地的承包期为三十年至五十年。林地的承包期为三十年至七十年。”\nB项正确，《农村土地承包法》第九条规定：“承包方承包土地后，享有土地承包经营权，可以自己经营，也可以保留土地承包权，流转其承包地的土地经营权，由他人经营。”\nC项错误，《农村土地承包法》第十六条第一款规定：“家庭承包的承包方是本集体经济组织的农户。”故承包方不应为本集体经济组织的农民。\nD项正确，《农村土地承包法》第四十八条规定：“不宜采取家庭承包方式的荒山、荒沟、荒丘、荒滩等农村土地，通过招标、拍卖、公开协商等方式承包的，适用本章规定。”第五十条规定：“荒山、荒沟、荒丘、荒滩等可以直接通过招标、拍卖、公开协商等方式实行承包经营，也可以将土地经营权折股分给本集体经济组织成员后，再实行承包经营或者股份合作经营。”故农村土地中不宜采取家庭承包方式的荒山可以采取公开协商承包方式。\n本题为选非题，故正确答案为C。","no":51,"missingImage":false},{"qid":"2365906","cat":"人文常识","stem":"根据我国农业法相关规定，下列行为合法的是：","options":{"A":"甲县政府向辖区农民收取摊派性费用","B":"乙县政府在辖区农村开展集资活动","C":"丙县政府应该督促有关部门保障农产品运输畅通","D":"丁县教育局通过村小学向学生家长收教育费附加"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，《农业法》第六十七条第三款规定：“任何机关或者单位不得以任何方式向农民或者农业生产经营组织进行摊派。除法律、法规另有规定外，任何机关或者单位以任何方式要求农民或者农业生产经营组织提供人力、财力、物力的，属于摊派。农民和农业生产经营组织有权拒绝任何方式的摊派。”\nB项错误，《农业法》第六十八条规定：“各级人民政府及其有关部门和所属单位不得以任何方式向农民或者农业生产经营组织集资。没有法律、法规依据或者未经国务院批准，任何机关或者单位不得在农村进行任何形式的达标、升级、验收活动。”\nC项正确，《农业法》第二十八条第二款条规定：“县级以上人民政府应当采取措施，督促有关部门保障农产品运输畅通，降低农产品流通成本。有关行政管理部门应当简化手续，方便鲜活农产品的运输，除法律、行政法规另有规定外，不得扣押鲜活农产品的运输工具。”\nD项错误，《农业法》第七十条规定：“农村义务教育除按国务院规定收取的费用外，不得向农民和学生收取其他费用。禁止任何机关或者单位通过农村中小学校向农民收费。”\n故正确答案为C。","no":52,"missingImage":false},{"qid":"2365908","cat":"人文常识","stem":"关于我国现行个人所得税法，下列表述不正确的是：","options":{"A":"我国个人所得税实行超额累进税率","B":"继续教育支出可以在个人所得税应纳税所得中扣除","C":"个人取得单位发放的实物不属于个人所得税的应纳税所得","D":"非独生子女在进行个人所得税的赡养老人专项附加扣除时最高不超过1000元"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，《个人所得税法》第三条规定：“个人所得税的税率：（一）综合所得，适用百分之三至百分之四十五的超额累进税率；（二）经营所得，适用百分之五至百分之三十五的超额累进税率；（三）利息、股息、红利所得，财产租赁所得，财产转让所得和偶然所得，适用比例税率，税率为百分之二十。”因此，我国个人所得税实行超额累进税率。此外，超额累进税率是把征税对象的数额划分为若干等级，对每个等级部分的数额分别规定相应税率，分别计算税额，各级税额之和为应纳税额。\nB项正确，《个人所得税法》第六条第四款规定：“本条第一款第一项规定的专项扣除，包括居民个人按照国家规定的范围和标准缴纳的基本养老保险、基本医疗保险、失业保险等社会保险费和住房公积金等；专项附加扣除，包括子女教育、继续教育、大病医疗、住房贷款利息或者住房租金、赡养老人等支出，具体范围、标准和实施步骤由国务院确定，并报全国人民代表大会常务委员会备案。”\nC项错误，《个人所得税法实施条例》第八条规定：“个人所得的形式，包括现金、实物、有价证券和其他形式的经济利益；所得为实物的，应当按照取得的凭证上所注明的价格计算应纳税所得额，无凭证的实物或者凭证上所注明的价格明显偏低的，参照市场价格核定应纳税所得额；所得为有价证券的，根据票面价格和市场价格核定应纳税所得额；所得为其他形式的经济利益的，参照市场价格核定应纳税所得额。”因此，个人取得单位发放的实物属于个人所得税的应纳税所得。\nD项正确，《个人所得税专项附加扣除暂行办法》第二十二条规定：“纳税人赡养一位及以上被赡养人的赡养支出，统一按照以下标准定额扣除：（一）纳税人为独生子女的，按照每月2000元的标准定额扣除；（二）纳税人为非独生子女的，由其与兄弟姐妹分摊每月2000元的扣除额度，每人分摊的额度不能超过每月1000元。可以由赡养人均摊或者约定分摊，也可以由被赡养人指定分摊。约定或者指定分摊的须签订书面分摊协议，指定分摊优先于约定分摊。具体分摊方式和额度在一个纳税年度内不能变更。”\n本题为选非题，故正确答案为C。","no":53,"missingImage":false},{"qid":"2365910","cat":"法律常识","stem":"根据我国城乡建设规划相关法律，下列表述不符合规定的是：","options":{"A":"县政府所在镇的总体规划由县政府编制","B":"乡规划中应当包括本行政区域内的村庄发展布局","C":"直辖市的城市总体规划应由该市政府报省政府审批","D":"镇政府编制的镇总体规划应先经镇人大审议再报上一级政府审批"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，《城乡规划法》第十五条规定：“县人民政府组织编制县人民政府所在地镇的总体规划，报上一级人民政府审批。其他镇的总体规划由镇人民政府组织编制，报上一级人民政府审批。”\nB项正确，《城乡规划法》第十八条规定：“乡规划、村庄规划应当从农村实际出发，尊重村民意愿，体现地方和农村特色。乡规划、村庄规划的内容应当包括：规划区范围，住宅、道路、供水、排水、供电、垃圾收集、畜禽养殖场所等农村生产、生活服务设施、公益事业等各项建设的用地布局、建设要求，以及对耕地等自然资源和历史文化遗产保护、防灾减灾等的具体安排。乡规划还应当包括本行政区域内的村庄发展布局。”\nC项错误，《城乡规划法》第十四条规定：“城市人民政府组织编制城市总体规划。直辖市的城市总体规划由直辖市人民政府报国务院审批。省、自治区人民政府所在地的城市以及国务院确定的城市的总体规划，由省、自治区人民政府审查同意后，报国务院审批。其他城市的总体规划，由城市人民政府报省、自治区人民政府审批。”因此该项中的“报省政府审批”表述错误。\nD项正确，《城乡规划法》第十六条第二款规定：“镇人民政府组织编制的镇总体规划，在报上一级人民政府审批前，应当先经镇人民代表大会审议，代表的审议意见交由本级人民政府研究处理。”\n本题为选非题，故正确答案为C。","no":54,"missingImage":false},{"qid":"2365914","cat":"人文常识","stem":"根据我国商标法相关规定，下列表述正确的是：","options":{"A":"声音不可以作为商标申请注册","B":"行政机关可以成为商标权的主体","C":"注册商标的有效期自核准注册之日起计算","D":"商标的地理标志主要由该地区的经济因素所决定"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，根据《商标法》第八条规定：“任何能够将自然人、法人或者其他组织的商品与他人的商品区别开的标志，包括文字、图形、字母、数字、三维标志、颜色组合和声音等，以及上述要素的组合，均可以作为商标申请注册。”\nB项错误，根据《商标法》第四条规定：“自然人、法人或者其他组织在生产经营活动中，对其商品或者服务需要取得商标专用权的，应当向商标局申请商标注册。本法有关商品商标的规定，适用于服务商标。”行政机关不能作为商标权的主体。\nC项正确，根据《商标法》第三十九条规定：“注册商标的有效期为十年，自核准注册之日起计算。”\nD项错误，根据《商标法》第十六条规定：“商标中有商品的地理标志，而该商品并非来源于该标志所标示的地区，误导公众的，不予注册并禁止使用；但是，已经善意取得注册的继续有效。前款所称地理标志，是指标示某商品来源于某地区，该商品的特定质量、信誉或者其他特征，主要由该地区的自然因素或者人文因素所决定的标志。”\n故正确答案为C。","no":55,"missingImage":false},{"qid":"2365917","cat":"人文常识","stem":"根据我国村民委员会组织法和居民委员会组织法，下列表述正确的是：","options":{"A":"村民委员会委员可以由上级政府委派","B":"居民会议有权撤换和补选居民委员会成员","C":"村集体的宅基地使用方案应由村民委员会讨论决定","D":"机关、团体、部队、企业事业组织可以参加所在地的居民委员会"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，《村民委员会组织法》第十一条第一款规定：“村民委员会主任、副主任和委员，由村民直接选举产生。任何组织或者个人不得指定、委派或者撤换村民委员会成员。”因此，村民委员会委员不能由上级政府委派。\nB项正确，《城市居民委员会组织法》第十条第三款规定：“居民会议有权撤换和补选居民委员会成员。”\nC项错误，《村民委员会组织法》第二十四条第一款第六项规定：“涉及村民利益的下列事项，经村民会议讨论决定方可办理：（六）宅基地的使用方案。”因此，宅基地使用方案应由村民会议讨论决定。\nD项错误，《城市居民委员会组织法》第十九条第一款规定：“机关、团体、部队、企业事业组织，不参加所在地的居民委员会，但是应当支持所在地的居民委员会的工作。所在地的居民委员会讨论同这些单位有关的问题，需要他们参加会议时，他们应当派代表参加，并且遵守居民委员会的有关决定和居民公约。”\n故正确答案为B。","no":56,"missingImage":false},{"qid":"2365919","cat":"法律常识","stem":"根据我国土地管理相关法律，下列表述不正确的是：","options":{"A":"村集体的荒地属于国家所有","B":"土地登记资料可以公开查询","C":"镇人民政府应当按照土地利用总体规划组织制定土地整理方案","D":"开发未确定土地使用权的国有荒滩从事林业应经县级以上政府批准"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，《土地管理法》第八条规定：“城市市区的土地属于国家所有。农村和城市郊区的土地，除由法律规定属于国家所有的以外，属于农民集体所有；宅基地和自留地、自留山，属于农民集体所有。”故村集体的荒地属于农民集体所有。\nB项正确，《土地管理法实施条例》第三条第三款规定：“土地登记资料可以公开查询。”\nC项正确，《土地管理法实施条例》第十八条第一款规定：“县、乡（镇）人民政府应当按照土地利用总体规划，组织农村集体经济组织制定土地整理方案，并组织实施。”\nD项正确，《土地管理法》第四十条规定：“开发未确定使用权的国有荒山、荒地、荒滩从事种植业、林业、畜牧业、渔业生产的，经县级以上人民政府依法批准，可以确定给开发单位或者个人长期使用。”\n本题为选非题，故正确答案为A。","no":57,"missingImage":false},{"qid":"2365920","cat":"人文常识","stem":"现代行政管理多应用系统工程思想和方法，以减少人力、物力、财力和时间的支出，提高行政管理的：","options":{"A":"水平","B":"效率","C":"技巧","D":"效益"},"answer":"B","explanation":"本题考查管理常识。\n行政管理是运用国家权力对社会事务以及自身内部的一种管理活动，也可以泛指一切企业、事业单位的行政事务管理工作。行政管理系统是一类组织系统。它是社会系统的一个重要分系统。随着社会的发展，行政管理的对象日益广泛，包括经济建设、文化教育、市政建设、社会秩序、公共卫生、环境保护等各个方面。现代行政管理多应用系统工程思想和方法，以减少人力、物力、财力和时间的支出和浪费，提高行政管理的效能和效率。因此，A、C、D三项错误，B项正确。\n故正确答案为B。","no":58,"missingImage":false},{"qid":"2365941","cat":"人文常识","stem":"近年来，“大众创业，万众创新”方兴未艾。各地政府为促进“以创业带动就业”，从工商登记、资金筹措、信息咨询、技能培训、经营用地方面对农民工返乡创业给予大力支持，这主要体现了政府行政管理中的        职能。","options":{"A":"市场监管","B":"社会管理","C":"公共服务","D":"经济调节"},"answer":"C","explanation":"本题考查管理学常识。\nA项错误，市场监管即政府为确保市场运行畅通、保证公平竞争和公平交易、维护企业合法权益而对企业和市场所进行的管理和监督。\nB项错误，社会管理指政府对社会公共事务的一系列管理活动或过程，以改善和保障人民物质和文化生活为依归。\nC项正确，公共服务指提供公共产品和服务，包括加强城乡公共设施建设，发展社会就业、社会保障服务和教育、科技、文化、卫生、体育等公共事业，发布信息等，为公众生活和参与经济、政治、文化等活动提供保障和创造条件。题干中政府对农民工返乡创业的大力支持体现公共服务职能。\nD项错误，即宏观调控职能，政府通过制定和运用财政税收政策和货币政策，对整个国民经济运行进行间接的、宏观的调控。\n故正确答案为C。","no":59,"missingImage":false},{"qid":"2365944","cat":"人文常识","stem":"某市通过电视问政或电话调查了解公民对政府公共服务和公共管理的满意程度。公民满意度属于政府部门绩效考核的：","options":{"A":"业绩指标","B":"效能指标","C":"效率指标","D":"成本指标"},"answer":"A","explanation":"本题考查管理学常识。政府部门的绩效考核指标可以分四方面：业绩、效率、效能和成本。\nA项正确，业绩指标通常包括：公共服务的数量和质量、公共管理目标的实现情况、政策制定水平与实施效果、公共管理的效益、公民对公共管理和公共服务的满意程度等。故公民满意度属于业绩指标的考核范围。\nB项错误，效能指标从两方面考核：（1）行为的合理化水平；（2）政府机关效能。\nC项错误，效率指标通常包括：提供公共服务与产品的单位成本、服务与产品的数目、公共政策执行的开支、政府部门的办公物品损耗费用等。\nD项错误，成本指标包括政府部门占用的人力、物力和财力，以及政府部门的支出。\n故正确答案为A。","no":60,"missingImage":false},{"qid":"2365946","cat":"人文常识","stem":"当前信息技术支持下，在一定规模组织中，管理层次与管理幅度的变化趋势是：","options":{"A":"管理层次增加，管理幅度变大","B":"管理层次减少，管理幅度变大","C":"管理层次减少，管理幅度变小","D":"管理层次增加，管理幅度变小"},"answer":"B","explanation":"本题考查管理学常识。\n在组织规模一定的条件下，管理层次与管理幅度成反比：管理层次越多，管理幅度就越小；管理层次越少，管理幅度就越大。每个主管能直接控制的下属人数越多，所需的管理层次就越少，而管理幅度越大，这是其变化趋势。\n故正确答案为B。","no":61,"missingImage":false},{"qid":"2365948","cat":"经济常识","stem":"2019年1月初，中国人民银行决定下调金融机构存款准备金率1个百分点，这可以：","options":{"A":"保持流动性合理充裕","B":"减轻通货膨胀压力","C":"提高直接融资比重","D":"提高货币购买能力"},"answer":"A","explanation":"本题考查经济常识。\nA项正确，中国人民银行下调存款准备金率表明其将继续实施稳健的货币政策，维持松紧适度，不搞大水漫灌，注重定向调控，保持流动性合理充裕，保持货币信贷和社会融资规模合理增长，稳定宏观杠杆率，兼顾内外平衡，为高质量发展和供给侧结构性改革营造适宜的货币金融环境。\nB项错误，下调存款准备金率会使中国人民银行的存钱变少，市场中的货币增多，不利于减轻通货膨胀压力。\nC项错误，提高直接融资比重是积极支持符合条件的企业通过资本市场进行股权融资，解决融资难融资贵的问题。直接融资比重和存款准备金率不存在必然联系。\nD项错误，货币的购买能力本质上讲是一定数量的货币能在市场上买多少东西或者支付劳务费用的能力，是由市场决定，取决于货币价值和商品价值。与题干不符。\n故正确答案为A。","no":62,"missingImage":false},{"qid":"2365949","cat":"经济常识","stem":"古人云：“必物与币两相当值，而无轻重悬绝之偏，然后可以久行而无弊。”这句话体现的是：","options":{"A":"等价交换","B":"供求关系","C":"社会分工","D":"货币职能"},"answer":"A","explanation":"本题考查经济常识。\n该句话出自丘浚《制国用\u003cimg data-k=\"d4f0d11b53cc\">铜楮之币上》，是指货币价值与商品价值均等，强调出入公平（买卖公平），即等价交换，这是价值规律的根本要求。也反映中国历来提倡公平交易。因此，B、C、D三项错误。\n故正确答案为A。","no":63,"missingImage":false},{"qid":"2365951","cat":"经济常识","stem":"国家统计局公布的2018年全国居民恩格尔系数为\u003cimg data-k=\"3fb317b2f5f7\">，比上年下降0.9个百分点。该数据表明：","options":{"A":"消费升级特征明显","B":"经济结构调整优化","C":"需求结构调整优化","D":"产业结构持续升级"},"answer":"A","explanation":"本题考查经济常识。\n恩格尔系数是食品支出总额占个人消费支出总额的比重，是衡量一个家庭或一个国家富裕程度的主要标准之一。全国居民恩格尔系数下降反映我国居民家庭食品消费支出占家庭消费总支出的比重降低。恩格尔系数低于\u003cimg data-k=\"c376182da64b\">，展现出消费升级的未来趋势，表明居民消费结构日益合理。因此，B、C、D三项错误。\n故正确答案为A。","no":64,"missingImage":false},{"qid":"2365957","cat":"科技常识","stem":"下列说法正确的是：","options":{"A":"卫星指宇宙中环绕恒星轨道运行的天体","B":"目前国际天文组织公认的星座有88个","C":"金星、天王星、海王星都属于远日行星","D":"太阳光包括可见光、不可见光和红外线"},"answer":"B","explanation":"本题考查地理国情常识。\nA项错误，卫星是指在围绕一颗行星轨道并按闭合轨道做周期性运行的天然天体，并非环绕恒星。\nB项正确，国际天文联盟把全天的星座定为88个。\nC项错误，金星属于类地行星，天王星、海王星属于远日行星。\nD项错误，太阳光是一种电磁波，分为可见光和不可见光。红外线属于不可见光。\n故正确答案为B。","no":65,"missingImage":false},{"qid":"2365958","cat":"人文常识","stem":"下列典故中，与古人勤学无关的是：","options":{"A":"韦编三绝","B":"凿壁偷光","C":"悬梁刺股","D":"寻章摘句"},"answer":"D","explanation":"本题考查人文常识。\nA项正确，“韦编三绝”是指孔子反复阅读《周易》而使编联简册的牛皮带子多次断开，用来比喻读书勤奋。\nB项正确，“凿壁偷光”是指西汉文学家匡衡幼时凿穿墙壁引邻舍之烛光读书，终成一代文学家，用来形容家贫而读书刻苦。\nC项正确，“悬梁”是指东汉时孙敬将绳子的一头绑在自己头发上，另一头绑在房梁上，打瞌睡时一低头绳子就会扯痛头皮，他就会因疼痛而清醒继续读书；“刺股”指战国时苏秦读书疲倦想要打盹时，就用锥子往大腿上刺一下，突然的疼痛使他猛然清醒继续读书。“悬梁刺股”用来形容刻苦学习。\nD项错误，“寻章摘句”是指写作时套用现成词句，缺乏创造性，而非用来形容勤学。\n本题为选非题，故正确答案为D。","no":66,"missingImage":false},{"qid":"2365960","cat":"地理国情","stem":"以下诗句与湖北有关的是：","options":{"A":"日暮乡关何处是？烟波江上使人愁","B":"旧时王谢堂前燕，飞入寻常百姓家","C":"沧海月明珠有泪，蓝田日暖玉生烟","D":"日出江花红胜火，春来江水绿如蓝"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，“日暮乡关何处是？烟波江上使人愁” 出自唐朝崔颢的《黄鹤楼》，意为天色将晚，暮色弥漫，我的家乡哪里呢？烟波浩渺的江上，一片迷漾，引起我无数的忧愁。黄鹤楼旧址位于今湖北省武汉市长江大桥武昌桥头，此诗句与湖北有关。\nB项错误，“旧时王谢堂前燕，飞入寻常百姓家”出自唐朝刘禹锡的《乌衣巷》，意为当年豪门檐下的燕子啊，如今已飞进寻常百姓家里 。这是一首怀古诗，用来凭吊东晋时南京秦淮河上朱雀桥和南岸的乌衣巷的繁华鼎盛，而今野草丛生，荒凉残照，此诗句与湖北无关。\nC项错误，“沧海月明珠有泪，蓝田日暖玉生烟”出自唐朝李商隐的《锦瑟》，意为大海里明月的影子像是眼泪化成的珍珠，只有在彼时彼地的蓝田才能生成犹如生烟似的良玉。“蓝田”，山名，在今陕西蓝田东南，是有名的产玉之地，此诗句与湖北无关。\nD项错误，“日出江花红胜火，春来江水绿如蓝”出自唐朝白居易的《忆江南》，意为春天的时候，太阳从江面升起，把江花照得比火还红，碧绿的江水绿得胜过蓝草。此诗句展现了鲜艳夺目的江南春景，与湖北无关。\n故正确答案为A。","no":67,"missingImage":false},{"qid":"2365963","cat":"科技常识","stem":"下列表述错误的是：","options":{"A":"世界四大通讯社之一的路透社创立于英国","B":"意大利和加拿大的国球分别为足球、冰球","C":"诺贝尔奖设有物理学奖、数学奖等奖项","D":"自由女神像是法国送给美国的国庆礼物"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，世界四大通讯社分别为美国的美联社和合众国际社、英国的路透社、法国的法新社。其中，路透社由保罗\u003cimg data-k=\"d4f0d11b53cc\">朱利斯\u003cimg data-k=\"d4f0d11b53cc\">路透于1851年在英国伦敦创社。\nB项正确，意大利的国球是足球，意大利队曾四次加冕世界杯冠军，意大利足球甲级联赛是世界上水平最高的职业足球联赛之一，被誉为“小世界杯”；加拿大的国球是冰球，冰球运动于1850-1860年起源于加拿大，冰球在加拿大迅速成为最流行的项目，从少儿到初中、高中每个年龄段都有完善的冰球进阶体制，同时1912年加拿大国家冰球协会首创的六人制打法被国际冰联沿用至今。\nC项错误，诺贝尔奖最初分设物理、化学、生理或医学、文学、和平五个奖项。1968年瑞典国家银行向诺贝尔基金捐赠大额资金，增设“瑞典国家银行纪念诺贝尔经济科学奖”，又被称为“诺贝尔经济学奖”。因此，诺贝尔奖没有设立数学奖。\nD项正确，1775年，北美13个殖民地的人民开始掀起推翻英国殖民统治的独立战争。1776年7月4日，殖民地代表在费城召开了第二次大陆会议，通过了《独立宣言》，正式宣布建立美利坚合众国，这一天被确定为美国的国庆“独立日”。自由女神像正是法国于1876年为纪念美国独立战争胜利一百周年而赠送给美国的礼物。 \n本题为选非题，故正确答案为C。","no":68,"missingImage":false},{"qid":"2365964","cat":"人文常识","stem":"下列说法错误的是：","options":{"A":"《知否？知否？应是绿肥红瘦》的电视剧名来源于李清照词","B":"莎士比亚的经典剧作《李尔王》又被称作“王子复仇记”","C":"纪晓岚著有《阅微草堂笔记》，“阅微草堂”是其书斋名","D":"鲁滨逊是英国作家丹尼尔·笛福塑造的小说人物形象"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，“知否？知否？应是绿肥红瘦”出自宋代词人李清照的《如梦令》 。该词全文为“昨夜雨疏风骤，浓睡不消残酒。试问卷帘人，却道海棠依旧。知否？知否？应是绿肥红瘦。”\nB项错误，莎士比亚四大悲剧是指《哈姆雷特》、《奥赛罗》、《李尔王》、《麦克白》，其中《哈姆雷特》又被称为《王子复仇记》。\nC项正确，《阅微草堂笔记》是清代纪晓岚于乾隆五十四年（1789年）至嘉庆三年（1798年）间以笔记形式所编写成的文言短篇志怪小说集，而“阅微草堂”则是纪晓岚为自己的书斋所题之名。 \nD项正确，《鲁滨逊漂流记》是英国作家丹尼尔\u003cimg data-k=\"d4f0d11b53cc\">笛福的一部长篇小说，该小说的主人公为鲁滨逊。\n本题为选非题，故正确答案为B。","no":69,"missingImage":false},{"qid":"2365965","cat":"科技常识","stem":"关于科技常识，下列表述错误的是：","options":{"A":"基因芯片目前主要是应用于基因检测","B":"风能的产生与太阳能有着密切的关系","C":"我国目前的磁悬浮属于超导电动式磁悬浮","D":"人工智能是工业机器人发展的关键技术之一"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，基因芯片（又称DNA芯片、生物芯片），该技术是指将大量探针分子固定于支持物上后与标记的样品分子进行杂交，通过检测每个探针分子的杂交信号强度进而获取样品分子的数量和序列信息。通俗地说，就是通过微加工技术将数以万计、乃至百万计的特定序列的DNA片段（基因探针）有规律地排列固定于玻片等支持物上，构成的一个二维DNA探针阵列，与计算机的电子芯片十分相似，所以被称为基因芯片，基因芯片主要用于基因检测工作。\nB项正确，风能是指地球表面大量空气流动所产生的动能。由于地面各处受太阳辐照后气温变化不同和空气中水蒸气的含量不同，因而引起各地气压的差异，在水平方向是高压空气向低压地区流动，即形成风，因此风能的产生与太阳能密切相关。\nC项错误，目前世界上有三种类型的磁悬浮，一是以德国为代表的常导电动式磁悬浮，二是以日本为代表的超导电动式磁悬浮，这两种磁悬浮都需要用电力来产生磁悬浮动力。而第三种，就是中国的永磁悬浮，它利用特殊的永磁材料，不需要任何其他动力支持。\nD项正确，人工智能是研究、开发用于模拟、延伸和拓展人的智能的理论、方法、技术及应用系统的一门新的技术科学。智能机器人应发展具有记忆能力、语言理解能力、图像识别能力等人工智能。因此，人工智能是工业机器人发展的关键技术之一。\n本题为选非题，故正确答案为C。","no":70,"missingImage":false}]}],"count":60,"answerable":60,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2365970","cat":"逻辑填空","stem":"近年来，信息技术的发展日新月异，数字化、网络化、智能化成为知识呈现新方式，面对信息技术带来的海量知识内容与多元知识类型，如何                ，撷取最有价值的知识内容与知识类型，成为个体知识学习面临的新挑战。\n填入画横线部分的词语，最恰当的一项是：","options":{"A":"兼收并蓄","B":"披沙拣金","C":"扬长避短","D":"薪火相传"},"answer":"B","explanation":"根据后文解释可知，需填入表示在海量内容中，挑选出最有价值的知识的词语。B项“披沙拣金”指从大量的东西中选取精华，符合文意，当选。\nA项“兼收并蓄”指把不同内容、不同性质的东西收下来，保存起来。即不挑选，将知识全部留下，不符合只留下最有价值知识的文意，排除；\nC项“扬长避短”指发扬长处，回避短处，文段未提到长处与短处，故不符合文意，排除；\nD项“薪火相传”指学问和技艺代代相传，文段仅说明要筛选并留下最有价值的知识，未说明要将这些知识代代相传，故不符合文意，排除。\n故正确答案为B。","no":71,"missingImage":false},{"type":"question","qid":"2365971","cat":"逻辑填空","stem":"随着改革开放的不断深入，老百姓的获得感、幸福感、安全感明显增强。几十年间，老百姓对“安全”的认知已经发生了深刻的        。如果说几十年前老百姓对“安全”的憧憬是鸡犬相闻、路不拾遗，那么近些年来，老百姓对“安全”的认知已经有了更进一步的        ，既包含良好的乡镇、社区治安环境，更意味着在更为宏观的风险社会背景下，让制度具有更好的        作用。\n填入画横线部分的词语，最恰当的一项是：","options":{"A":"变革  拓展  协调","B":"变化  扩大  推动","C":"转变  延伸  庇护","D":"转化  深入  支撑"},"answer":"C","explanation":"第一空，根据后文可知，老百姓之前对“安全”的憧憬比较简单，而现在老百姓对安全的认知有了提高，故需填入表示改变词意的词语。B项“变化”指发生改变，符合文意，保留；C项“转变”指从一种形式、状态或特点变为另一种形式、状态或特点，符合文意，保留；A项“变革”指改变事物的本质，多指社会制度而言，与“安全认知”搭配不当，排除；D项“转化”指将事物A通过某种方法或途径转变为事物B的一种解决问题的手段，文段未出现表明将安全认知变为其他事物的表述，故不符合文意，排除。\n第二空，搭配“认知”，B项“扩大”指使范围、规模等增大，通常搭配具体事物，与“认知”搭配不当，排除；C项“延伸”指在宽度、大小、范围上向外延长、伸展，这一变化既可用在客观事物上，也可以用于抽象的诸如话题上，符合文意，保留。\n第三空，代入验证，C项“庇护”指包庇、保护，与“风险的社会背景”对应合适，当选。\n故正确答案为C。","no":72,"missingImage":false},{"type":"question","qid":"2365972","cat":"逻辑填空","stem":"随着移动互联网时代的到来，各大APP已经逐渐占据了流量的主要入口，搜索引擎能吸引的流量越来越少；加之，基于用户兴趣的推荐引擎兴起，让传统搜索引擎几乎                。用户点开推荐引擎，目光就无法移开，        之高让老牌搜索引擎公司眼热，传统搜索引擎应对的招数就是复制这一模式，让自家搜索优先推荐自家内容。\n填入画横线部分的词语，最恰当的一组是：","options":{"A":"难以招架  黏性","B":"全盘崩溃  效率","C":"不名一钱  热度","D":"退无可退  效益"},"answer":"A","explanation":"第一空，根据“加之”可知，前后表意相近，故需填入表示传统搜索引擎情况不佳，不敌各大APP的词语。A项“难以招架”指招架不住，难以对付，D项“退无可退”指没有退路，均符合文意，保留；B项“全盘崩溃”指彻底破坏或垮台，语意程度过重，排除；C项“不名一钱”指非常贫穷，与文意无关，排除。\n第二空，形容用户点开推荐引擎后无法移开目光的情况，A项“黏性”用于此处指用户对互联网产品的参与程度大，符合文意，当选；D项“效益”指效果与利益，文段没有关于利益的表述，故不符合文意，排除。\n故正确答案为A。\n【文段出处】《百度一下，只有百家号知道？》","no":73,"missingImage":false},{"type":"question","qid":"2365973","cat":"逻辑填空","stem":"我国建国初期，美术作品中中国画逐渐占据重要地位，题材广泛多样，拓展了中国画的表现领域，出现了一批直接表现新时代现实生活和精神风貌的国画作品，一扫传统国画的荒寒落寞，表现出                的态势，为国画艺术最终摆脱传统        奠定了基础。\n填入画横线部分的词语，最恰当的一组是：","options":{"A":"扶摇直上  桎梏","B":"间不容息  颓势","C":"蒸蒸日上  窠臼","D":"瞬息万变  惯例"},"answer":"C","explanation":"第一空，搭配“态势”，根据前文可知，这种态势与“荒寒落寞”相对，是非常强劲、积极向上的。C项“蒸蒸日上”指一天天地向上发展，形容发展速度快，符合文意，保留；A项“扶摇直上”指地位、名声、价值等迅速往上升，比喻仕途得意，与文意无关，排除；B项“间不容息”指时机紧迫，不容延误，与文意无关，排除；D项“瞬息万变”指变化很快、很多，文段未体现变化非常多，排除。\n第二空，代入验证，C项“窠臼”指旧有的现成格式，与“传统”搭配恰当，当选。\n故正确答案为C。","no":74,"missingImage":false},{"type":"question","qid":"2365974","cat":"逻辑填空","stem":"为了让基层干部敢于担当作为，让他们感到有关心、有支持，上级领导要多一些俯下身子的耐心，少一些高高在上的盲目指挥；多一些换位思考的理解包容，少一些                的简单问责。在管理干部时，        必不可少，但要与厚爱有机结合，尤其应当注重厚爱。\n填入画横线部分的词语，最恰当的一组是：","options":{"A":"不分皂白  薄惩","B":"罔顾实际  严管","C":"咄咄逼人  问责","D":"草草了事  教育"},"answer":"B","explanation":"第一空，与“简单问责”搭配，B项“罔顾实际”指不顾及实际，搭配合适，保留；D项“草草了事”指草率地把事情结束了，符合文意，保留；A项“不分皂白”指不分是非曲直，根据前文换位思考的理解可知，基层干部确实出现了一些问题，故不符合文意，排除；C项“咄咄逼人”指气势汹汹，使人恐惧，与“简单问责”表意相反，排除。\n第二空，与“厚爱”对应，对比B、D两项，B项“严管”指严厉地管理，与“厚爱”表意相反，语意合适，当选；D项“教育”也可以是一种关爱，故无法与厚爱形成反义对应，排除。\n故正确答案为B。","no":75,"missingImage":false},{"type":"question","qid":"2365975","cat":"语句表达","stem":"科学管理是认识管理对象的动态过程。管理活动特别是现代管理活动，可以根据具体需要，已有知识的指导、前人的管理经验和科学的管理预判有序安排。然而，与按既定规程运作的物质生产过程不同，        ，因而难以完全按预定的目的和计划进行，有其不确定性和强烈的探索性。\n填入画横线部分最恰当的一句是：","options":{"A":"管理活动面对的经常是极为复杂的管理对象","B":"管理活动则是以精神生产为直接目的的活动","C":"管理活动的具体形式比预想的更加多种多样","D":"管理活动往往需要各级管理者不断推陈出新"},"answer":"A","explanation":"横线出现在文段中间，需要结合前后文内容进行分析。文段开篇指出科学管理是认识管理对象的动态过程，可以根据需要进行有序安排，接着又指出有序安排与按既定规程运作的物质生产过程存在不同，横线后“因而”引出结论，指出管理活动有不确定性和强烈的探索性，故横线处应该体现出科学管理对象的特点，且导致的结果是不确定性，对应A项。\nB项，“精神生产”在文段中并未提及，无中生有，排除；\nC项，“具体形式”在文段中并未提及，无中生有，排除；\nD项，“需要各级管理者不断推陈出新”与后文构不成因果关系，排除。\n故正确答案为A。","no":76,"missingImage":false},{"type":"question","qid":"2365976","cat":"片段阅读","stem":"当面临问题时，有些人在外界压力下试图追求极致的问题解决方法。而事实上，如果他们可以排除外界影响，避免追求那些极致的问题解决方法，转而在理性的基础上限定自己的探索，发现满意的问题解决方法即可，那么他们就能最大程度地提升效率。\n这段文字意在强调：","options":{"A":"面临问题时，不应该因外界压力追求极致的问题解决方法","B":"面临问题时，应排除外界影响，基于理性来限定自己的探索","C":"有时候，追求极致的解决问题的方法并不一定是最经济的","D":"有时候，不一定要在外界压力下找到极致的问题解决方法"},"answer":"B","explanation":"文段开篇引出以往通常情况的观点，接下来通过转折词“而事实上”指出，在面对压力时，如果排除外界影响，避免追求极致的问题解决方法，转而在理性的基础上限定自己的探索，可以在最大程度上提升效率，故文段旨在强调在面对外界压力时，应基于理性来限定自己的探索，对应B项。\nA项，文段中明确指出，在面对压力时应基于理性来限定自己的探索，选项表述不明确，排除；\nC项，选项对应转折之前的内容，非重点，且文段中明确指出，在面对压力时应基于理性来限定自己的探索，选项表述不明确，排除；\nD项，“不一定要在外界压力下找到极致的问题解决方法”表述不明确，文段中明确指出在面对压力时应基于理性来限定自己的探索，排除。\n故正确答案为B。","no":77,"missingImage":false},{"type":"question","qid":"2365977","cat":"片段阅读","stem":"近些年，网络小说读者越来越多。相关调查表明，网络小说读者之所以对网络小说产生浓厚的阅读兴趣，甚至成为“网络小说迷”，一是因为在商业化运营模式下，不少网络小说情节设置委婉曲折、引人入胜，类似于以前盛行一时的说评书，关键时刻总是“请听下回分解”，让网络小说读者欲罢不能；二是因为网络小说通常都非常通俗化，阅读网络小说不需要太多思考，对网络小说读者而言就是一种消遣、一种娱乐。\n这段文字意在强调：","options":{"A":"网络小说读者阅读网络小说成瘾的原因","B":"网络小说阅读成为新的娱乐方式的理由","C":"网络小说引发网络小说读者兴趣的原因","D":"网络小说吸引网络小说读者的具体途径"},"answer":"C","explanation":"文段开篇提出观点“近些年，网络小说读者越来越多”，接着分别从两个层面进行了解释，一是因为网络小说的情节设置委婉曲折、引人入胜，二是因为网络小说都非常通俗化，故文段主要阐述的是网络小说能够吸引网络小说读者的原因，对应C项。\nA项，“网络小说成瘾”程度过重，在文段中并未提及，文段只是说感兴趣，而非成瘾，排除；\nB项，“娱乐方式”对应文段中的第二个原因，表述片面，且本身非重点，排除；\nD项，“具体途径”文段中并未提及，文段主要阐述的是网络小说能够吸引网络小说读者的原因，排除。\n故正确答案为C。","no":78,"missingImage":false},{"type":"question","qid":"2365978","cat":"片段阅读","stem":"党和国家高度重视推进新型城镇化。在城市发展规划方面，一味追求成为特大城市，反而容易适得其反，给城市发展带来重重困境。国外的一些特大城市，比如墨西哥城、孟买、雅加达等，就是这方面的负面典型。相反，国外一些中小城市，比如温哥华、日内瓦、维也纳等，以其独特的历史文化风貌，深厚的人类文明精神积淀而世界知名，它们的文明程度、宜居程度、城市发展程度都非常高，是众所公认的精神家园和幸福乐园。\n这段文字意在说明：","options":{"A":"城市发展规划应摆脱一味追求特大城市的思路","B":"城市人口的增减不应成为城市发展规划的指标","C":"文明程度较高的城市就是发展规划成功的城市","D":"国外一些中小城市并不是靠城市人口规模知名"},"answer":"A","explanation":"文段开篇指出党和国家高度重视推进新型城镇化，接着提出观点，即城市发展规划不应一味追求特大城市，然后举正反两方面的例子进行了说明，故文段重在强调在城市发展规划过程中不应一味追求特大城市，对应A项。\nB项，“城市人口的增减不应成为城市发展规划的指标”在文段中并未提及，无中生有，排除；\nC项，“文明程度”对应文段尾句，为解释说明的内容，非重点，且表述片面，排除；\nD项，“国外一些中小城市”对应文段尾句，为解释说明的内容，非重点，排除。\n故正确答案为A。","no":79,"missingImage":false},{"type":"question","qid":"2365979","cat":"片段阅读","stem":"我们的工作、生活节奏不断加快；有些人做事往往追求立竿见影，生活不自觉地迈入加急时代。效率就是生命演变为众所公认的价值观。外出是飞机、高铁，上网要极速体验，吃饭需争分夺秒，就连咿呀学语的孩子，都不能输在起跑线上。这份急夹杂着对过程的忽视，衍生出对规则的漠视，同时催生出各种问题。\n这段文字的主旨是：","options":{"A":"节奏提速导致人们做事追求立竿见影","B":"效率就是生命成为众所公认的价值观","C":"人们必须争分夺秒以免输在起跑线上","D":"加急时代生活催生出各种各样的问题"},"answer":"D","explanation":"文段开篇指出我们的工作、生活节奏不断加快，催生了效率就是生命演变的价值观，接着进行了举例说明，尾句“这”指代前文的内容，引出文段的重点，即加速时代会导致人们对过程的忽视、对规则的漠视，同时也会引发各种问题，对应D项。\nA项，“节奏提速导致人们做事追求立竿见影”与文段逻辑相反，应该是人们追求立竿见影所以才加急，变成快节奏，排除；\nB项，“效率就是生命成为众所公认的价值观”对应结论之前的内容，非重点，排除；\nC项，“人们必须争分夺秒以免输在起跑线上”对应文段的例子，非重点，且对策无中生有，排除。\n故正确答案为D。","no":80,"missingImage":false},{"type":"question","qid":"2365980","cat":"片段阅读","stem":"冕洞是太阳磁场的开放区域，这里的磁力线向宇宙空间扩散，大量的等离子体顺着磁力线跑出去，形成高速运动的粒子流。粒子流在冕洞底部速度为每秒16km左右，当到达地球轨道附近时，速度可达每秒300至400km以上。这种高速运动的等离子体流就是太阳风，当它从冕洞喷发而出后，夹带着被裹挟在其中的太阳磁场向四周迅速吹散，至少可以吹遍整个太阳系。\n最适合做这段文字标题的是：","options":{"A":"冕洞的原理","B":"粒子流的形成","C":"太阳风的形成","D":"太阳磁场的形成"},"answer":"C","explanation":"文段开篇引出冕洞这一话题，指出冕洞这一太阳磁场开放区域能形成高速运动的粒子流，并指出粒子流运动速度快，文段尾句通过指代词“这”表示总结，强调上述高速运动的等离子体就是太阳风，后面补充介绍其喷发的威力很大。故文段就是在介绍太阳风的形成，对应C项。\nA项“冕洞”、B项“粒子流”、D项“太阳磁场”主题词错误，均排除。\n故正确答案为C。\n【文段出处】《太阳风》","no":81,"missingImage":false},{"type":"question","qid":"2365981","cat":"片段阅读","stem":"粉丝力量的崛起，是一个无论喜不喜欢都需要正视的现象。业内人士认为，粉丝的力量是双刃剑。近年来部分叫好又叫座的影视剧产生，粉丝力量起到很重要的作用。但粉丝改变了文化产业的生态，以往由文化产业精英人员决定文化产品，现在逐步转向自带粉丝流量的IP。这个趋势本身已泥沙俱下，危机频现。当下，如果我们希望今天的粉丝文化现象被历史看见，粉丝就应正视和善用自己的权力。\n接下来最可能讲的是：","options":{"A":"粉丝力量的作用","B":"粉丝力量的反思","C":"粉丝力量的重要性","D":"粉丝力量的危险性"},"answer":"B","explanation":"根据提问方式可知，本题为接语选择题，应在阅读全文基础上，重点关注文段最后谈论的核心话题。文段开篇引出粉丝力量这一话题，随后表述其有着双面性，存在着一些问题。尾句用“应”表示对策，指出粉丝要正视和善用自己的权力，根据话题一致性，后文应该具体指出粉丝如何正视、善用自己权力，即进行反思，对应B项。\nA项“粉丝力量的作用”、C项“重要性”、D项“危险性”均为前文论述的内容，并非文段最后讨论的核心话题，均排除。\n故正确答案为B。\n【文段出处】《粉丝权力崛起搅动娱乐圈 我们该反思什么？》","no":82,"missingImage":false},{"type":"question","qid":"2365982","cat":"语句表达","stem":"仪式感使得某一天与其他日子不同，使某一时刻与其他时刻不同。当下仪式感的缺失似乎成了传统春节年味儿变淡的根本原因，过年和平时相比不再特殊。但随着社会的发展变化，一些专家认为，        ，家族的小型化使得人们越来越注重个人权利和感受，这使仪式感越来越在小范围、乃至在个人生活中得以体现。相应的，过年的仪式感也渐渐从“四世同堂的大家宴”转向“三口之家的小团圆”。\n填入画横线部分最恰当的一项是：","options":{"A":"仪式感缺失逐渐转向仪式感变迁","B":"仪式感缺失成为突出的家庭问题","C":"仪式感使得年味重新变得浓郁","D":"仪式感使得家庭变得更加团结"},"answer":"A","explanation":"横线出现在文段中间，注意与上下文的联系。\n横线之前引出仪式感这一话题，并指出仪式感缺失成为年味变淡的根本原因，横线之后指出人们注重个人权利和感受，仪式感在个人生活中体现，过年的仪式转向“三口之家的小团圆”，故横线处表达仪式感发生了变化，对应A项“仪式感缺失逐渐转向仪式感变迁”，当选。\nB项“仪式感缺失”为转折之前的内容且“突出的家庭问题”无中生有，排除；\nC项“年味重新变得浓郁”无中生有，排除；\nD项“更加团结”无中生有，文段只是尾句提到从大家宴变为小团圆，排除。\n故正确答案为A。\n【文段出处】《年味儿变淡，仪式感缺失惹的祸？》","no":83,"missingImage":false},{"type":"question","qid":"2365983","cat":"片段阅读","stem":"甲市依河傍海，丰富的水系和分布广泛的湿地是城市的灵韵所在。近年来，该市以湿地修复和保护作为生态文明建设的重要抓手，持续闯关探路。甲市下辖秀丽区美景镇风光村曾是该市最偏远、经济较落后、生态破坏较严重的村，引入社会投资建设“湖塘绿园”环境综合治理项目后，已成为一个集湿地、生态农业、民俗文化等多元素融合发展的乡村生态旅游区，通过旅游服务、旅游区务工和土地租金分红等，风光村户均年增收2万元人民币，目前该村面貌焕然一新，生活水平显著提升，成为人们向往的旅游胜地。\n最适合做这段文字标题的是：","options":{"A":"“湿”意生活助增收","B":"“湿”地回归促发展","C":"乡村振兴，发展旅游","D":"保护湿地，经济腾飞"},"answer":"B","explanation":"文段开篇指出甲市具有丰富的水系和广泛的湿地，接着指出该市开展湿地修复和保护工作促进生态文明建设，后面用其下辖村为例，介绍了通过建设成湿地乡村生态旅游区使得该村较好发展，故文段旨在强调湿地修复促进了地区的发展，对应B项，当选。\nA项未体现湿地修复且“助增收”表述片面，排除；\nC项没有“湿地”这一主题词，排除；\nD项“经济腾飞”表述片面，排除。\n故正确答案为B。\n【文段出处】《“湿地海口”的生态文明建设实践》","no":84,"missingImage":false},{"type":"question","qid":"2365984","cat":"语句表达","stem":"①地外天体水一直是月球和深空探测的重要内容\n②无论在月球表面还是月球样品中都没有发现水存在的明显证据\n③水是生命活动赖以维持的基础，也是揭示太阳系天体形成演化过程的重要依据\n④但一些研究者的探测结果表明月球是一个极其干燥的天体\n⑤月球水的探测却经历了漫长曲折的过程\n⑥有人认为月球永久阴影极区的低温环境有助于保存水冰\n将上述文字重新排序，最为恰当的是：","options":{"A":"③①⑤⑥④②","B":"①③⑤④②⑥","C":"③①⑤④②⑥","D":"①⑤⑥③④②"},"answer":"A","explanation":"对比选项，判断首句，①句介绍了地外天体水，③句介绍了水的定义，按照逻辑顺序，应先给“水”下定义，再介绍“地外天体水”，故③在①前面，排除B、D项。\n观察发现，④句中出现转折关联词“但”，指出月球干燥，转折前后语意相反，⑥句指出月球永久阴影极区有助于保存水冰，转折关联词捆绑，故⑥④相连，排除C项，A项当选。\n故正确答案为A。\n【文段出处】《月表太阳风成因水的研究现状和意义》","no":85,"missingImage":false}],"count":15,"answerable":15,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2365985","cat":"数学运算","stem":"某商店以5元/斤的价格购入一批蔬菜，上午以8元/斤的价格卖出总进货量的\u003cimg data-k=\"1a67739c8245\">，中午以上午售出价的8折卖出总进货量的\u003cimg data-k=\"798f1f286d1f\">，下午以中午售出价的一半卖出剩余货量的一半，最后获利210元。则该商店一共购入多少斤蔬菜？","options":{"A":"140","B":"150","C":"160","D":"180"},"answer":"B","explanation":"设一共购入\u003cimg data-k=\"300c6413402b\">斤蔬菜，可将蔬菜出售情况列表如下：\n\u003cimg data-k=\"54f2066ee894\" style=\"max-width:700px\">\n根据\u003cimg data-k=\"f1940e0987dd\">\u003cimg data-k=\"710b0aa3c519\">，可列方程：\u003cimg data-k=\"c665c12681cd\">\u003cimg data-k=\"a28898076ebb\">\u003cimg data-k=\"5f504b07da59\">\u003cimg data-k=\"c788d577ee65\">，解得\u003cimg data-k=\"c35b89cf932c\">，\u003cimg data-k=\"ff024c44cdca\">，即一共购入150斤蔬菜。\n故正确答案为B。","no":86,"missingImage":false},{"type":"question","qid":"2365986","cat":"数学运算","stem":"甲乙两仓库分别有粮食45吨和122吨，现甲仓库第一天运入3吨，往后每天运入的吨数比前一天多2吨，乙仓库每天运出2吨，则至少多少天后甲仓库的粮食比乙仓库多？","options":{"A":"6","B":"7","C":"8","D":"9"},"answer":"C","explanation":"设\u003cimg data-k=\"489782a86fc8\">天后甲仓库的粮食比乙仓库多，根据等差数列求和公式\u003cimg data-k=\"cea94c146092\">\u003cimg data-k=\"211e3a300397\">\u003cimg data-k=\"86c
