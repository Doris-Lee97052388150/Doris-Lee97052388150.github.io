<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2021-上海-A类","title":"2021年上海市公务员录用考试《行测》题（A类）（网友回忆版）","year":"2021","group":"上海","modules":[{"label":"政治理论","items":[{"type":"material","material":"\u003cp>        30年前，上海浦东地区生产总值60亿元；2019年，这一数字已是1.27万亿元，增长了210倍。浦东，以占全国\u003cimg data-k=\"18489ac52375\">的土地，创造了全国\u003cimg data-k=\"da09dbf359f4\">的GDP、\u003cimg data-k=\"df0ea1c316f9\">的外贸进出口总额。\u003c/p>\u003cp>        30年前，陆家嘴是“烂泥渡”，张江是片农田，临港则是孤悬东海的芦苇荒滩······如今，而立之年的浦东早已“脱胎换骨”。从蛙声一片的浦东稻田，到高耸云天的“大厦森林”，再到特斯拉上海超级工厂跑出的“上海速度”，令人惊艳的巨变也正是中国改革开放的象征和上海现代化建设的缩影。\u003c/p>\u003cp>        2020年11月12日，浦东开发开放30周年庆祝大会在上海举行。中共中央总书记、国家主席、中央军委主席习近平在会上发表重要讲话。他强调，30年前，党中央全面研判国际国内大势，统筹把握改革发展大局，作出了开发开放上海浦东的重大决策，掀开了我国改革开放向纵深推进的崭新篇章。党中央对浦东开发开放高度重视、寄予厚望，强调以上海浦东开发开放为龙头，进一步开放长江沿岸城市，尽快把上海建成国际经济、金融、贸易中心之一，带动长江三角洲和整个长江流域地区经济的新飞跃，要求浦东在扩大开放、自主创新等方面走在前列。进入新时代，党中央继续对浦东开发开放提出明确要求，把一系列国家战略任务放在浦东，推动浦东开发开放不断展现新气象。\u003c/p>\u003cp>        习近平指出，30年来，浦东创造性贯彻落实党中央决策部署，取得了举世瞩目的成就，经济实现跨越式发展，改革开放走在全国前列，核心竞争力大幅度增强，人民生活水平整体性跃升。浦东开发开放30年取得的显著成就，为中国特色社会主义制度优势提供了最鲜活的现实明证，为改革开放和社会主义现代化建设提供了最生动的实践写照。实践充分证明，党的十一届三中全会以来形成的党的基本理论、基本路线、基本方略是完全正确的；改革开放是坚持和发展中国特色社会主义、实现中华民族伟大复兴的必由之路；改革发展必须坚持以人民为中心，把人民对美好生活的向往作为我们的奋斗目标，依靠人民创造历史伟业。\u003c/p>","questions":[{"qid":"2731500","cat":"新思想","stem":"浦东开发开放30年取得的显著成就，为中国特色社会主义制度优势提供了最鲜活的现实明证，为改革开放和社会主义现代化建设提供了最生动的实践写照。浦东要抓住机遇、乘势而上，努力成为                    ，更好向世界展示中国理念、中国精神、中国道路。","options":{"A":"更高水平改革开放的开路先锋","B":"国家建设生态文明示范区","C":"彰显“四个自信”的实践范例","D":"全面建设社会主义现代化国家的排头兵"},"answer":"ACD","explanation":"本题考查政治常识。\n2020年11月12日，浦东开发开放30周年庆祝大会在上海市举行。中共中央总书记、国家主席、中央军委主席习近平在会上发表重要讲话，讲话中指出：“浦东要抓住机遇、乘势而上，科学把握新发展阶段，坚决贯彻新发展理念，服务构建新发展格局，坚持稳中求进工作总基调，勇于挑最重的担子、啃最硬的骨头，努力成为更高水平改革开放的开路先锋、全面建设社会主义现代化国家的排头兵、彰显‘四个自信’的实践范例，更好向世界展示中国理念、中国精神、中国道路。”\n故正确答案为ACD。","no":1,"missingImage":false},{"qid":"2731507","cat":"新思想","stem":"改革不停顿，开放不止步。浦东开发开放30年的历程，走的是一条面向世界、扩大开放之路。习近平总书记在浦东开发开放30周年庆祝大会上指出，要深入推进高水平            ，增创国际合作和竞争新优势。","options":{"A":"政策型开放","B":"针对型开放","C":"制度型开放","D":"行业型开放"},"answer":"C","explanation":"本题考查政治常识。\n2020年11月12日，浦东开发开放30周年庆祝大会在上海市举行。中共中央总书记、国家主席、中央军委主席习近平在会上发表重要讲话，讲话中指出：“深入推进高水平制度型开放，增创国际合作和竞争新优势。”\n故正确答案为C。","no":2,"missingImage":false}]},{"type":"material","material":"\u003cp>        习近平2020年7月21日下午主持召开企业家座谈会并发表重要讲话。他强调，改革开放以来，我国逐步建立和不断完善社会主义市场经济体制，市场体系不断发展，各类市场主体蓬勃成长。新冠肺炎疫情对我国经济和世界经济产生巨大冲击，我国很多市场主体面临前所未有的压力。市场主体是经济的力量载体，保市场主体就是保社会生产力。要千方百计把市场主体保护好，激发市场主体活力，弘扬企业家精神，推动企业发挥更大作用实现更大发展，为经济发展积蓄基本力量。\u003c/p>\u003cp>        习近平强调，党中央明确提出要扎实做好“六稳”工作、落实“六保”任务，各地区各部门出台了一系列保护支持市场主体的政策措施，要加大政策支持力度，激发市场主体活力，使广大市场主体不仅能够正常生存，而且能够实现更大发展。\u003c/p>\u003cp>        习近平指出，改革开放以来，一大批有胆识、勇创新的企业家茁壮成长，形成了具有鲜明时代特征、民族特色、世界水准的中国企业家队伍。企业家要带领企业战胜当前的困难，走向更辉煌的未来，就要弘扬企业家精神，在爱国、创新、诚信、社会责任和国际视野等方面不断提升自己，努力成为新时代构建新发展格局、建设现代化经济体系、推动高质量发展的生力军。要增强爱国情怀，把企业发展同国家繁荣、民族兴盛、人民幸福紧密结合在一起，主动为国担当、为国分忧，带领企业奋力拼搏、力争一流，实现质量更好、效益更高、竞争力更强、影响力更大的发展。要勇于创新，做创新发展的探索者、组织者、引领者，勇于推动生产组织创新、技术创新、市场创新，重视技术研发和人力资本投入，有效调动员工创造力，努力把企业打造成为强大的创新主体。要做诚信守法的表率，带动全社会道德素质和文明程度提升。要承担社会责任，努力稳定就业岗位，关心员工健康，同员工携手渡过难关。要拓展国际视野，立足中国，放眼世界，提高把握国际市场动向和需求特点的能力，提高把握国际规则能力，提高国际市场开拓能力，提高防范国际市场风险能力，带动企业在更高水平的对外开放中实现更好发展。\u003c/p>\u003cp>        习近平强调，在当前保护主义上升、世界经济低迷、全球市场萎缩的外部环境下，我们必须集中力量办好自己的事，充分发挥国内超大规模市场优势，逐步形成以国内大循环为主体、国内国际双循环相互促进的新发展格局，提升产业链供应链现代化水平，大力推动科技创新，加快关键核心技术攻关，打造未来发展新优势。以国内大循环为主体，绝不是关起门来封闭运行，而是通过发挥内需潜力，使国内市场和国际市场更好联通，更好利用国际国内两个市场、两种资源，实现更加强劲可持续的发展。从长远看，经济全球化仍是历史潮流，各国分工合作、互利共赢是长期趋势。我们要站在历史正确的一边，坚持深化改革、扩大开放，加强科技领域开放合作，推动建设开放型世界经济，推动构建人类命运共同体。\u003c/p>","questions":[{"qid":"2731541","cat":"新思想","stem":"习近平指出，改革开放以来，一大批有胆识、勇创新的企业家茁壮成长，形成了具有鲜明时代特征、民族特色、世界水准的中国企业家队伍。我国的企业家是：","options":{"A":"人民民主专政的领导力量","B":"人民民主专政的阶级基础","C":"中国特色社会主义的劳动者","D":"中国特色社会主义的建设者"},"answer":"CD","explanation":"本题考查政治常识。\nA、B两项错误，根据《中华人民共和国宪法》第一条第一款规定：“中华人民共和国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家。”因此，工人阶级是人民民主专政的领导力量，工农联盟是人民民主专政的阶级基础。\nC项正确，《中华人民共和国宪法》序言指出：“在长期的革命、建设、改革过程中，已经结成由中国共产党领导的，有各民主党派和各人民团体参加的，包括全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者、拥护祖国统一和致力于中华民族伟大复兴的爱国者的广泛的爱国统一战线，这个统一战线将继续巩固和发展。”我国新时期爱国统一战线内部结构中以劳动人民作为一个范围的层次，它包括工人、农民、知识分子以及其他一切从事社会主义建设事业的自食其力的劳动者。\nD项正确，党的十六大报告指出：“在社会变革中出现的民营科技企业的创业人员和技术人员、受聘于外资企业的管理技术人员、个体户、私营企业主、中介组织的从业人员、自由职业人员等社会阶层，都是中国特色社会主义事业的建设者。”\n故正确答案为CD。","no":3,"missingImage":false}]},{"type":"material","material":"\u003cp>        民法典被誉为“社会生活百科全书”，与每个人的生活息息相关。新中国成立以来，党和国家曾先后四次启动民法制定工作，编纂一部彰显中华民族精气神的民法典是几代人的夙愿。编纂法典，是一个国家、一个民族走向繁荣强盛的象征和标志。“民法典理应成为治国理政的重要工具，成为中国国家治理模式稳定持续发展的重要保证。”全国人大代表、广东省律师协会会长说。\u003c/p>\u003cp>        结合当前疫情防控工作，民法典草案作出了一系列规定。全国人大代表表示：“民法典草案对与疫情相关的民事法律制度进行梳理研究，明确保护特殊情况下无人照顾的‘被监护人’，明确物业应急处置责任等，这都体现出了民法典应时而生、为民所需的特点。”\u003c/p>\u003cp>        全国政协常委、中国法学会副会长参与了民法典草案的编纂工作。她深有体会地说，民法典草案彰显“四个自信”，体现中国特色社会主义市场经济的基本要求，标志着中国特色社会主义法律制度的进一步成熟和稳定。\u003c/p>\u003cp>        2015年3月，全国人大常委会法制工作委员会启动民法典编纂工作。2017年3月，十二届全国人大五次会议审议通过民法总则。2019年12月，全国人大常委会审议了由民法总则与经过常委会审议和修改完善的民法典各分编草案合并形成的民法典草案，并决定将民法典草案提请十三届全国人大三次会议审议。2020年两会期间，代表委员们对民法典草案展开认真审议和热烈讨论。根据各方面意见，又作了100余处修改，其中实质性修改40余处。2020年5月28日，十三届全国人大三次会议表决通过了《中华人民共和国民法典》，宣告中国“民法典时代”正式到来。\u003c/p>\u003cp>        《中华人民共和国民法典》共7编、1260条，各编依次为总则、物权、合同、人格权、婚姻家庭、继承、侵权责任，以及附则。编纂民法典是党的十八届四中全会提出的重大立法任务，是以习近平同志为核心的党中央作出的重大法治建设部署。编纂民法典，是对我国现行的、制定于不同时期的民法通则、物权法、合同法、担保法、婚姻法、收养法、继承法、侵权责任法和人格权方面的民事法律规范进行全面系统的编订纂修，形成一部具有中国特色、体现时代特点、反映人民意愿的民法典。\u003c/p>","questions":[{"qid":"2731577","cat":"新思想","stem":"民法典在中国特色社会主义法律体系中具有重要地位，是一部固根本、稳预期、利长远的基础性法律，（    ），都具有重大意义。","options":{"A":"对推进全面依法治国、加快建设社会主义法治国家","B":"对发展社会主义市场经济、巩固社会主义基本经济制度","C":"对坚持以人民为中心的发展思想、依法维护人民权益、推动我国人权事业发展","D":"对推进国家治理体系和治理能力现代化"},"answer":"ABCD","explanation":"本题考查法律常识。\n中共中央政治局于2020年5月29日下午就“切实实施民法典”举行第二十次集体学习。中共中央总书记习近平在主持学习时强调，民法典在中国特色社会主义法律体系中具有重要地位，是一部固根本、稳预期、利长远的基础性法律，对推进全面依法治国、加快建设社会主义法治国家，对发展社会主义市场经济、巩固社会主义基本经济制度，对坚持以人民为中心的发展思想、依法维护人民权益、推动我国人权事业发展，对推进国家治理体系和治理能力现代化，都具有重大意义。全党要切实推动民法典实施，以更好推进全面依法治国、建设社会主义法治国家，更好保障人民权益。\n故正确答案为ABCD。","no":4,"missingImage":false},{"qid":"2731390","cat":"时事政治","stem":"2020年7月，中共中央印发了《中国共产党基层组织选举工作条例》。《条例》的制定和实施，对于发扬党内民主、尊重和保障党员民主权利、规范基层党组织选举，增强基层党组织政治功能和（    ），把基层党组织建设成为宣传党的主张、贯彻党的决定、领导基层治理、团结动员群众、推动改革发展的坚强战斗堡垒，巩固党长期执政的组织基础，具有重要意义。","options":{"A":"社会功能","B":"领导力","C":"经济功能","D":"组织力"},"answer":"D","explanation":"本题考查政治常识。\n2020年7月，中共中央印发了《中国共产党基层组织选举工作条例》并发出通知。通知强调，《条例》的制定和实施，对于发扬党内民主、尊重和保障党员民主权利、规范基层党组织选举，增强基层党组织政治功能和组织力，把基层党组织建设成为宣传党的主张、贯彻党的决定、领导基层治理、团结动员群众、推动改革发展的坚强战斗堡垒，巩固党长期执政的组织基础，具有重要意义。\n故正确答案为D。","no":5,"missingImage":false},{"qid":"2731393","cat":"毛中特","stem":"1935年遵义会议，确定了毛泽东同志为主要代表的马克思主义正确路线在中共中央的领导地位；1945年中共七大，确立毛泽东思想为党的指导思想；1978年十一届三中全会，把党的工作重点和全国人民的注意力转移到社会主义现代化建设上来。如果为“遵义会议、中共七大、十一届三中全会”确定一个研究主题，应是：","options":{"A":"革命道路的开拓","B":"政治体制的创建","C":"关键时刻的抉择","D":"建国纲领的制定"},"answer":"C","explanation":"本题考查政治常识。\n遵义会议是中国共产党历史上一个生死攸关的转折点，标志着党从幼年走向成熟、从挫折走向胜利。中共七大是中国共产党在抗战胜利前夕的历史转折关头召开的一次重要会议，也是中国共产党建党以来完全独立自主召开的一次代表大会。此次会议制定了正确的路线、纲领和策略，指明了中国人民争取光明前途的方法与途径。党的十一届三中全会是建国以来我党历史上具有深远意义的转折点，是一次对思想、政治、组织等领域的全面拨乱反正的会议，揭开了社会主义改革开放的序幕。三个会议都是我党历史上关键时刻的重要抉择。\n故正确答案为C。","no":6,"missingImage":false},{"qid":"2731394","cat":"新思想","stem":"面向未来，要战胜前进道路上的种种风险挑战，顺利实现中共十九大描绘的宏伟蓝图，必须紧紧依靠人民。正所谓“大鹏之动，非一羽之轻也；骐骥之速，非一足之力也”。中国要飞得高、跑得快，就得汇集和激发近14亿人民的磅礴力量。这是因为，人民群众是：","options":{"A":"第一生产力","B":"社会实践的主体","C":"社会存在和发展的基础","D":"事物发展的内在动力"},"answer":"B","explanation":"本题考查政治常识。\nA项错误，邓小平同志提出：“科学技术是第一生产力”。\nB项正确，“大鹏之动，非一羽之轻也；骐骥之速，非一足之力也”出自王符的《潜夫论·释难》，意思是大鹏翱翔，靠的不是一根羽毛的轻盈；骏马驰骋，靠的不是一只脚的力量。故我们要紧紧依靠人民，因为人民群众是社会实践的主体，是历史的创造者，是推动历史发展的决定力量。\nC项错误，马克思认为，物质资料的生产方式是人类社会存在和发展的基础。\nD项错误，矛盾是指事物之间或事物内部各要素之间的对立、统一的关系。事物发展的源泉和动力是事物的内部矛盾。\n故正确答案为B。","no":7,"missingImage":false},{"qid":"2731398","cat":"时事政治","stem":"2020年10月14日，深圳经济特区建立40周年庆祝大会在广东省深圳市隆重举行。习近平总书记在会上发表重要讲话指出，深圳要建设好（    ），创建社会主义现代化强国的城市范例，提高贯彻落实新发展理念能力和水平。","options":{"A":"社会主义市场经济改革试点区","B":"中国特色社会主义改革试点区","C":"社会主义市场经济先行示范区","D":"中国特色社会主义先行示范区"},"answer":"D","explanation":"本题考查政治常识。\n习近平总书记在深圳经济特区建立40周年庆祝大会指出：“当今世界正经历百年未有之大变局，我国正处于实现中华民族伟大复兴的关键时期，经济已由高速增长阶段转向高质量发展阶段。深圳要建设好中国特色社会主义先行示范区，创建社会主义现代化强国的城市范例，提高贯彻落实新发展理念能力和水平，形成全面深化改革、全面扩大开放新格局，推进粤港澳大湾区建设，丰富‘一国两制’事业发展新实践，率先实现社会主义现代化。”\n故正确答案为D。","no":8,"missingImage":false}]}],"count":8,"answerable":8,"pointsOf":10},{"label":"常识判断","items":[{"type":"material","material":"\u003cp>        30年前，上海浦东地区生产总值60亿元；2019年，这一数字已是1.27万亿元，增长了210倍。浦东，以占全国\u003cimg data-k=\"18489ac52375\">的土地，创造了全国\u003cimg data-k=\"da09dbf359f4\">的GDP、\u003cimg data-k=\"df0ea1c316f9\">的外贸进出口总额。\u003c/p>\u003cp>        30年前，陆家嘴是“烂泥渡”，张江是片农田，临港则是孤悬东海的芦苇荒滩······如今，而立之年的浦东早已“脱胎换骨”。从蛙声一片的浦东稻田，到高耸云天的“大厦森林”，再到特斯拉上海超级工厂跑出的“上海速度”，令人惊艳的巨变也正是中国改革开放的象征和上海现代化建设的缩影。\u003c/p>\u003cp>        2020年11月12日，浦东开发开放30周年庆祝大会在上海举行。中共中央总书记、国家主席、中央军委主席习近平在会上发表重要讲话。他强调，30年前，党中央全面研判国际国内大势，统筹把握改革发展大局，作出了开发开放上海浦东的重大决策，掀开了我国改革开放向纵深推进的崭新篇章。党中央对浦东开发开放高度重视、寄予厚望，强调以上海浦东开发开放为龙头，进一步开放长江沿岸城市，尽快把上海建成国际经济、金融、贸易中心之一，带动长江三角洲和整个长江流域地区经济的新飞跃，要求浦东在扩大开放、自主创新等方面走在前列。进入新时代，党中央继续对浦东开发开放提出明确要求，把一系列国家战略任务放在浦东，推动浦东开发开放不断展现新气象。\u003c/p>\u003cp>        习近平指出，30年来，浦东创造性贯彻落实党中央决策部署，取得了举世瞩目的成就，经济实现跨越式发展，改革开放走在全国前列，核心竞争力大幅度增强，人民生活水平整体性跃升。浦东开发开放30年取得的显著成就，为中国特色社会主义制度优势提供了最鲜活的现实明证，为改革开放和社会主义现代化建设提供了最生动的实践写照。实践充分证明，党的十一届三中全会以来形成的党的基本理论、基本路线、基本方略是完全正确的；改革开放是坚持和发展中国特色社会主义、实现中华民族伟大复兴的必由之路；改革发展必须坚持以人民为中心，把人民对美好生活的向往作为我们的奋斗目标，依靠人民创造历史伟业。\u003c/p>","questions":[{"qid":"2731488","cat":"经济常识","stem":"30年来，浦东创造性贯彻落实党中央决策部署，改革开放走在全国前列，诞生了（    ）等一系列“全国第一”。","options":{"A":"第一个金融贸易区","B":"第一个保税区","C":"第一个自由贸易试验区","D":"第一家外商独资贸易公司"},"answer":"ABCD","explanation":"本题考查政治常识。\nA项正确，1990年4月，全国唯一一个以“金融贸易”命名的国家级开发区——陆家嘴金融贸易区（陆家嘴金融城）成立。\nB项正确，1990年9月8日，国务院批准设立上海外高桥保税区，是中国大陆启动最早、规模最大、产业最全、辐射最广的保税区。\nC项正确，2013年9月，上海自贸区挂牌成立。中国（上海）自由贸易试验区是国内第一个自由贸易试验区，建设上海自贸区是党中央、国务院在新形势下全面深化改革和扩大开放的一项战略举措。\nD项正确，1992年7月26日，经原国家外经贸部批准，我国第一家外商独资贸易公司——上海伊藤忠商事有限公司在外高桥保税区注册成立。\n故正确答案为ABCD。","no":9,"missingImage":false}]},{"type":"material","material":"\u003cp>        习近平2020年7月21日下午主持召开企业家座谈会并发表重要讲话。他强调，改革开放以来，我国逐步建立和不断完善社会主义市场经济体制，市场体系不断发展，各类市场主体蓬勃成长。新冠肺炎疫情对我国经济和世界经济产生巨大冲击，我国很多市场主体面临前所未有的压力。市场主体是经济的力量载体，保市场主体就是保社会生产力。要千方百计把市场主体保护好，激发市场主体活力，弘扬企业家精神，推动企业发挥更大作用实现更大发展，为经济发展积蓄基本力量。\u003c/p>\u003cp>        习近平强调，党中央明确提出要扎实做好“六稳”工作、落实“六保”任务，各地区各部门出台了一系列保护支持市场主体的政策措施，要加大政策支持力度，激发市场主体活力，使广大市场主体不仅能够正常生存，而且能够实现更大发展。\u003c/p>\u003cp>        习近平指出，改革开放以来，一大批有胆识、勇创新的企业家茁壮成长，形成了具有鲜明时代特征、民族特色、世界水准的中国企业家队伍。企业家要带领企业战胜当前的困难，走向更辉煌的未来，就要弘扬企业家精神，在爱国、创新、诚信、社会责任和国际视野等方面不断提升自己，努力成为新时代构建新发展格局、建设现代化经济体系、推动高质量发展的生力军。要增强爱国情怀，把企业发展同国家繁荣、民族兴盛、人民幸福紧密结合在一起，主动为国担当、为国分忧，带领企业奋力拼搏、力争一流，实现质量更好、效益更高、竞争力更强、影响力更大的发展。要勇于创新，做创新发展的探索者、组织者、引领者，勇于推动生产组织创新、技术创新、市场创新，重视技术研发和人力资本投入，有效调动员工创造力，努力把企业打造成为强大的创新主体。要做诚信守法的表率，带动全社会道德素质和文明程度提升。要承担社会责任，努力稳定就业岗位，关心员工健康，同员工携手渡过难关。要拓展国际视野，立足中国，放眼世界，提高把握国际市场动向和需求特点的能力，提高把握国际规则能力，提高国际市场开拓能力，提高防范国际市场风险能力，带动企业在更高水平的对外开放中实现更好发展。\u003c/p>\u003cp>        习近平强调，在当前保护主义上升、世界经济低迷、全球市场萎缩的外部环境下，我们必须集中力量办好自己的事，充分发挥国内超大规模市场优势，逐步形成以国内大循环为主体、国内国际双循环相互促进的新发展格局，提升产业链供应链现代化水平，大力推动科技创新，加快关键核心技术攻关，打造未来发展新优势。以国内大循环为主体，绝不是关起门来封闭运行，而是通过发挥内需潜力，使国内市场和国际市场更好联通，更好利用国际国内两个市场、两种资源，实现更加强劲可持续的发展。从长远看，经济全球化仍是历史潮流，各国分工合作、互利共赢是长期趋势。我们要站在历史正确的一边，坚持深化改革、扩大开放，加强科技领域开放合作，推动建设开放型世界经济，推动构建人类命运共同体。\u003c/p>","questions":[{"qid":"2731517","cat":"经济常识","stem":"到2019年底，我国已有市场主体1.23亿户，其中企业3858万户，个体工商户8261万户。这些市场主体是（    ）。","options":{"A":"我国经济活动的主要参与者","B":"社会主义市场经济的重要组成部分","C":"就业机会的主要提供者","D":"技术进步的主要推动者"},"answer":"ACD","explanation":"本题考查政治常识。\n2020年7月21日，习近平总书记在企业家座谈会上的讲话中指出：“到2019年底，我国已有市场主体1.23亿户，其中企业3858万户，个体工商户8261万户。这些市场主体是我国经济活动的主要参与者、就业机会的主要提供者、技术进步的主要推动者，在国家发展中发挥着十分重要的作用。”\n故正确答案为ACD。","no":10,"missingImage":false},{"qid":"2731529","cat":"经济常识","stem":"为落实好纾困惠企政策，中央将实施更加积极有为的财政政策。下列与这一政策相符的是（    ）。","options":{"A":"继续减税降费","B":"优化营商环境","C":"强化金融支持","D":"放宽市场准入"},"answer":"A","explanation":"本题考查经济常识。\n财政政策是国家制定的指导财政分配活动和处理各种财政分配关系的基本准则。积极有为的财政政策即扩张性财政政策，是国家通过财政分配活动刺激和增加社会总需求的一种政策行为，主要是通过减税、增加支出进而扩大财政赤字，增加和刺激社会总需求的一种财政分配方式。\nA项正确，减税降费能够增加个人和企业的可支配收入，相应地减少国家财政收入。在财政支出规模不变的情况下，相应地扩大了社会总需求，属于积极有为的财政政策。\nB项错误，扩张性财政政策主要措施有增加国债、降低税率、增加政府购买和转移支付。优化营商环境并不属于财政政策范畴。\nC项错误，货币政策也就是金融政策，是指中央银行为实现其特定的经济目标而采用的各种控制和调节货币供应量和信用量的方针、政策和措施的总称。强化金融支持并不属于财政政策范畴，应属于金融政策。\nD项错误，扩张性财政政策主要措施有增加国债、降低税率、增加政府购买和转移支付。放宽市场准入并不属于财政政策范畴。\n故正确答案为A。","no":11,"missingImage":false},{"qid":"2731548","cat":"人文常识","stem":"下列选项中，体现了“两点论和重点论相统一”的论述是：","options":{"A":"更好利用国际国内两个市场、两种资源","B":"集中力量办好自己的事，充分发挥国内超大规模市场优势","C":"以国内大循环为主体、国内国际双循环相互促进","D":"推动建设开放型世界经济，推动构建人类命运共同体"},"answer":"AC","explanation":"本题考查政治常识。\n坚持两点论和重点论相统一，是指看问题、办事情，既要全面、统筹兼顾，又要善于抓住重点和主流。\nA项正确，联系材料可知，“更好利用国际国内两个市场、两种资源”的前提是发挥内需的作用，“发挥内需”强调重在国内，即在发展和建设的过程中抓好国内这个重点，体现了“重点论”的观点；“国际国内两个市场、两种资源”表明在发展和建设的过程中要全面、统筹利用两个市场、两种资源，体现了“两点论”的观点。\nB项错误，“集中力量”“国内”均表明在发展和建设的过程中要抓住重点和核心优势，体现了“重点论”的观点。\nC项正确，“以国内大循环为主体”表明在发展和建设的过程中要抓住事物的主要矛盾，体现了“重点论”的观点；“国内国际双循环相互促进”表明在发展和建设的过程中，要促进国内国际市场共同、全面发展，体现了“两点论”的观点。\nD项错误，“推动建设开放型世界经济，推动构建人类命运共同体”表明我们要全面地去看待世界，促进全世界共同发展，体现了“两点论”的观点。\n故正确答案为AC。","no":12,"missingImage":false}]},{"type":"material","material":"\u003cp>        民法典被誉为“社会生活百科全书”，与每个人的生活息息相关。新中国成立以来，党和国家曾先后四次启动民法制定工作，编纂一部彰显中华民族精气神的民法典是几代人的夙愿。编纂法典，是一个国家、一个民族走向繁荣强盛的象征和标志。“民法典理应成为治国理政的重要工具，成为中国国家治理模式稳定持续发展的重要保证。”全国人大代表、广东省律师协会会长说。\u003c/p>\u003cp>        结合当前疫情防控工作，民法典草案作出了一系列规定。全国人大代表表示：“民法典草案对与疫情相关的民事法律制度进行梳理研究，明确保护特殊情况下无人照顾的‘被监护人’，明确物业应急处置责任等，这都体现出了民法典应时而生、为民所需的特点。”\u003c/p>\u003cp>        全国政协常委、中国法学会副会长参与了民法典草案的编纂工作。她深有体会地说，民法典草案彰显“四个自信”，体现中国特色社会主义市场经济的基本要求，标志着中国特色社会主义法律制度的进一步成熟和稳定。\u003c/p>\u003cp>        2015年3月，全国人大常委会法制工作委员会启动民法典编纂工作。2017年3月，十二届全国人大五次会议审议通过民法总则。2019年12月，全国人大常委会审议了由民法总则与经过常委会审议和修改完善的民法典各分编草案合并形成的民法典草案，并决定将民法典草案提请十三届全国人大三次会议审议。2020年两会期间，代表委员们对民法典草案展开认真审议和热烈讨论。根据各方面意见，又作了100余处修改，其中实质性修改40余处。2020年5月28日，十三届全国人大三次会议表决通过了《中华人民共和国民法典》，宣告中国“民法典时代”正式到来。\u003c/p>\u003cp>        《中华人民共和国民法典》共7编、1260条，各编依次为总则、物权、合同、人格权、婚姻家庭、继承、侵权责任，以及附则。编纂民法典是党的十八届四中全会提出的重大立法任务，是以习近平同志为核心的党中央作出的重大法治建设部署。编纂民法典，是对我国现行的、制定于不同时期的民法通则、物权法、合同法、担保法、婚姻法、收养法、继承法、侵权责任法和人格权方面的民事法律规范进行全面系统的编订纂修，形成一部具有中国特色、体现时代特点、反映人民意愿的民法典。\u003c/p>","questions":[{"qid":"2731561","cat":"法律常识","stem":"民法典将自（    ）起实施，现行婚姻法、继承法、民法通则、收养法、担保法、合同法、物权法、侵权责任法、民法总则同时废止。","options":{"A":"通过之日","B":"2020年10月1日","C":"公布之日","D":"2021年1月1日"},"answer":"D","explanation":"本题考查法律常识。\n根据《民法典》第一千二百六十条规定：“本法自2021年1月1日起施行。《中华人民共和国婚姻法》、《中华人民共和国继承法》、《中华人民共和国民法通则》、《中华人民共和国收养法》、《中华人民共和国担保法》、《中华人民共和国合同法》、《中华人民共和国物权法》、《中华人民共和国侵权责任法》、《中华人民共和国民法总则》同时废止。”\n故正确答案为D。","no":13,"missingImage":false},{"qid":"2731570","cat":"法律常识","stem":"民法典“与每个人的生活息息相关”，是因为它是一部体现对（    ）、生活幸福、人格尊严等各方面权利平等保护的民法典。是一部具有鲜明中国特色、实践特色、时代特色的民法典。","options":{"A":"生命健康","B":"财产安全","C":"交易便利","D":"民主权利"},"answer":"ABC","explanation":"本题考查法律常识。\n《中华人民共和国民法典》经过2020年5月28日十三届全国人大三次会议表决通过，并于2021年1月1日起施行。该法典被称为“社会生活百科全书”，这是因为该法典是民事权利的宣言书和保障书。《民法典》是一部体现对生命健康、财产安全、交易便利、生活幸福、人格尊严等各方面权利平等保护的民法典，是一部具有鲜明中国特色、实践特色、时代特色的民法典。\n故正确答案为ABC。","no":14,"missingImage":false},{"qid":"2731572","cat":"法律常识","stem":"结合新冠肺炎控情防控工作，民法典明确保护特殊情况下无人照顾的“被监护人”，规定因发生突发事件等紧急情况，监护人暂时无法履行监护职责，被监护人的生活处于无人照料状态的，被监护人住所地的（    ）或者民政部门应当为被监护人安排必要的临时生活照料措施。","options":{"A":"公安部门","B":"居民委员会、村民委员会","C":"妇联组织","D":"慈善组织、社会福利机构"},"answer":"B","explanation":"本题考查法律常识。\n根据《民法典》第三十四条第四款规定：“因发生突发事件等紧急情况，监护人暂时无法履行监护职责，被监护人的生活处于无人照料状态的，被监护人住所地的居民委员会、村民委员会或者民政部门应当为被监护人安排必要的临时生活照料措施。”因此，被监护人的生活处于无人照料状态的，被监护人住所地的居民委员会、村民委员会或者民政部门应当为被监护人安排必要的临时生活照料措施。\n故正确答案为B。","no":15,"missingImage":false}]},{"type":"material","material":"\u003cp>        互助土族自治县位于六盘山集中连片特困地区。土族是全国28个人口较少的民族之一，自古崇尚彩虹，这里因此被称为“彩虹之乡”。由于地处青藏高原，发展条件受限，贫困就如大山一样横亘在眼前。直到2015年，班彦村的129户人家依然居住在被当地人称为“脑山”的山顶上，严重缺水、交通闭塞，是典型的“一方水土养活不了一方人”，正是脱贫攻坚，让这里发生了翻天覆地的变化。过去，村民们在山上住的是土坯房，风蚀雨侵、烟熏火燎，连墙面都成了炭黑色。如今，班彦新村紧邻省道，家家户户通自来水，步行10多分钟就可以到镇卫生院，小学就在旁边，幼儿园有校车接送小孩，镇中心学校也只有两三公里远······后顾之忧少了，村民外出务工的积极性高了。通过组织烹饪、电焊、开挖掘机等专项培训，2018年全村就有67人外出务工。\u003c/p>\u003cp>        山大沟深、土地瘠薄，对于祖祖辈辈困守在这里的班彦村民而言，有些人一辈子都盖不起新房。实施易地搬迁，一下子把他们挪穷窝和盖新房这两个“最大的包袱”给解决了。搬迁后，班彦新村实施了村道硬化、村庄亮化、文化广场、人畜饮水、环境综合整治等工程，补齐了基础设施和发展条件的短板，解开了脱贫的“死结”。2018年，青海省将班彦新村纳入《少数民族特色村镇传承保护规划》，投入专项资金扶持民族特色发展项目。“十年九旱，靠天吃饭”，这是过去班彦村的真实写照。搬下山后，在各级政府帮扶下，村集体经济“破零”，产业扶持资金到户到人，全村初步形成多元增收渠道。依托当地特有的八眉猪品牌，给每户在集中养殖区配套建设了36平方米的猪舍。全村八眉猪存栏最多时超过1200头，户均年可增收3000元，与相关企业合作建设分布式光伏项目，户均年收益2500元。\u003c/p>\u003cp>        土族盘绣2006年被确定为国家级非物质文化遗产，但是由于没有渠道与市场对接，一直养在深闺人未识，变不成收益。2018年班彦新村组建土族盘绣合作社，并与知名电商合作，使盘绣逐渐成为民族特色产业，带动了全村145名妇女就业，有的绣品还远销国外。由于长期受贫困困扰，过去村民们对奔好日子缺乏信心，驻村干部介绍，脱贫攻坚实施之初，“扶起来立不住，立住了走不动”的现象比较突出。驻村干部积极推进建章立制、移风易俗，以扶促教、以教助扶，引导村民实现从“要我发展”向“我要发展”的观念转变。搬迁前，村里娶媳妇的彩礼一般都在15万元以上，因婚致贫比较多，搬迁后，村里成立了红白理事会，通过村规民约加以引导，彩礼少了一大半，在2019年的“班彦感恩纪念日”上，村里还增设了“好婆婆”“好媳妇”评选、“脱贫光荣户”表彰等活动。\u003c/p>\u003cp>        在搬迁过程和产业发展中，村党支部委员会和村民委员会严格按照程序，始终公开、公正、公平地实施房屋分配、项目推进、资金收益分配等群众最为关心关注的重大事项。用真心真情换取信任。全村47名党员，都积极参与农民讲习所的宣讲和每月一次的“固定党日”活动。村干部普遍感到，只要增强组织凝聚力，发挥党员的带动作用，就能融洽干群关系，把村里的每项工作做好。\u003c/p>","questions":[{"qid":"2731589","cat":"人文常识","stem":"结合材料可知，班彦村脱贫的最关键的举措是                    。","options":{"A":"专项资金扶持","B":"非遗申请成功","C":"实施易地搬迁","D":"环境综合治理"},"answer":"C","explanation":"本题考查政治常识。\nA项错误，根据材料中“搬下山后，在各级政府帮扶下，村集体经济‘破零’，产业扶持资金到户到人，全村初步形成多元增收渠道”可知，专项资金扶持是在班彦村搬迁之后，促进班彦村民增收的举措，因此不是脱贫最关键的举措。\nB项错误，根据材料中“土族盘绣2006年被确定为国家级非物质文化资产”“直到2015年，班彦村的129户人家依然居住在被当地人称为‘脑山’的山顶上，严重缺水、交通闭塞”可知，2006年非遗已经申请成功，但直至2015年班彦村依旧处于贫困状态，说明其并非脱贫的关键举措。\nC项正确，根据材料中“实施易地搬迁，一下子把他们挪穷窝和盖新房这两个‘最大的包袱’给解决了”以及“搬迁后，班彦新村实施了村道硬化、村庄亮化、文化广场、人畜饮水、环境综合······等工程，补齐了基础设施和发展条件的短板，解开了脱贫的‘死结’”两处内容表明，班彦村脱贫的关键在于实施了异地搬迁，从而由严重缺水、交通闭塞的山顶村变成紧邻省道的班彦新村。\nD项错误，环境综合治理是在实施异地搬迁之后才采取的举措，不是脱贫最关键的举措。\n故正确答案为C。","no":16,"missingImage":false},{"qid":"2731593","cat":"人文常识","stem":"驻村干部介绍，脱贫攻坚实施之初，“扶起来立不住，立住了走不动”的现象比较突出。以下对这句话的理解正确的是                    。","options":{"A":"扶持资金投入不到位","B":"村民脱贫内生动力不足","C":"村民对异地搬迁存疑虑","D":"扶贫而不扶志效果不佳"},"answer":"BD","explanation":"本题考查政治常识。\nA项错误，根据材料中“2018年······将班彦新村纳入《少数民族特色村镇传承保护规划》，投入专项资金扶持民族特色项目”，而“扶起来立不住，立住了走不动”的现象出现在脱贫攻坚实施之初，从时间上来看，二者没有直接联系。\nB、D两项正确，根据材料中“驻村干部积极推进建章立制、移风易俗、以扶促教、以教助扶，引导村民实现从‘要我发展’向‘我要发展’的观念转变”可知，这些举措是为了激发群众脱贫致富的内生动力，提升扶贫又扶志的效果，说明“扶起来立不住，立住了走不动”指的正是脱贫内生动力不足，扶贫而不扶志，村民们存在“要我发展”的错误观念，导致扶贫效果不佳。\nC项错误，材料中并未体现出村民对于异地搬迁心存顾虑。\n故正确答案为BD。","no":17,"missingImage":false},{"qid":"2731596","cat":"人文常识","stem":"在2019年的“班彦感恩纪念日”上，村里还增设了“好婆婆”“好媳妇”评选、“脱贫光荣户”表彰等活动，这属于治理类型中的：","options":{"A":"自治","B":"人治","C":"法治","D":"德治"},"answer":"AD","explanation":"本题考查政治常识。\nA项正确，自治是基层社会治理的基本目标，致力于政府与人民对公共生活的协同治理，它有赖于城乡社区成员的自愿合作，有赖于社会治理机制中如何激发社区成员的内驱动力，这既保证了公共利益最大化，又确保了社区成员的个人权益、个人意愿的实现。村设置评选、表彰活动，是社会治理中激发了村民的内驱动力的表现。\nB项错误，人治，就是按照人的意志及其对利益的要求来行事的。题干并未体现人治。\nC项错误，法治通过制度安排和规则程序，凭借一套具有普遍性、可预见性等理性化标准的正式规则来规范人们的行为区间。题干并未体现法治。\nD项正确，德治重在依靠社会舆论、风俗习惯、内心信念等正面引导人们的价值取向和发展方向。增设了“好婆婆”“好媳妇”评选、“脱贫光荣户”表彰等活动就是通过社会舆论等正面引导人们的价值取向和发展方向。\n故正确答案为AD。","no":18,"missingImage":false},{"qid":"2731599","cat":"人文常识","stem":"依据材料所示，互助土族自治县脱贫成功的经验包括：","options":{"A":"挪穷窝，解开贫困症结","B":"谋产业，探索致富门路","C":"育新风，激活村民信心","D":"抓党建，发挥堡垒作用"},"answer":"ABCD","explanation":"本题考查政治常识。\nA项正确，材料中提到，实施易地搬迁，一下子把他们挪穷窝和盖新房这两个“最大的包袱”给解决了。可体现脱贫成功的经验有挪穷窝，解开贫困症结。\nB项正确，材料中提到，依托当地特有的八眉猪品牌······有的绣品还远销国外。可体现脱贫成功的经验有谋产业，探索致富门路。\nC项正确，材料中提到，驻村干部积极推进建章立制、移风易俗，以扶促教、以教助扶，引导村民实现从“要我发展”向“我要发展”的观念转变。可体现脱贫成功的经验有育新风，激活村民信心。\nD项正确，材料中提到，全村47名党员，都积极参与农民讲习所的宣讲和每月一次的“固定党日”活动。村干部普遍感到，只要增强组织凝聚力，发挥党员的带动作用，就能融洽干群关系，把村里的每项工作做好。可体现脱贫成功的经验有抓党建，发挥堡垒作用。\n故正确答案为ABCD。","no":19,"missingImage":false},{"qid":"2731387","cat":"人文常识","stem":"党的十九届五中全会于2020年10月26至29日在北京举行。全会提出，坚持把发展经济着力点放在（    ）上，坚定不移建设制造强国、质量强国、网络强国、数字中国，推进产业基础高级化、产业链现代化，提高经济质量效益和核心竞争力。","options":{"A":"知识经济","B":"数字经济","C":"产业经济","D":"实体经济"},"answer":"D","explanation":"本题考查政治常识。\n党的十九届五中全会提出：“坚持把发展经济着力点放在实体经济上，坚定不移建设制造强国、质量强国、网络强国、数字中国，推进产业基础高级化、产业链现代化，提高经济质量效益和核心竞争力。”\n故正确答案为D。","no":20,"missingImage":false},{"qid":"2731407","cat":"经济常识","stem":"线上线下融合举办的2020年中国国际服务贸易交易会惊艳亮相，电影院陆续恢复营业，夜幕下的大街小巷烟火气渐浓······在常态化疫情防控措施护航下，大到城镇、小到街市，均呈现出热闹的复苏景象。更为关键的是，越来越多带有指标意义的数据开始企稳上扬，释放经济回暖信号。下列政策组合有助于进一步扩大内循环的是：","options":{"A":"提高银行准备金率、扩大财政支出","B":"降低存贷款准备金率、提高税率","C":"发行数字货币、免征个人所得税","D":"降低存贷款利率、扩大财政支出"},"answer":"D","explanation":"本题考查经济常识。\n内循环，是指国内的供给和需求形成循环。从理念上讲，内循环是通过国产替代，完善技术和产业供应链，改变受制于人的局面；通过激发和做大内需，弥补外部需求的疲弱和不足，减轻外部需求波动对国内宏观经济的冲击，提升经济运行效率，解除居民消费后顾之忧，释放消费需求空间。\nA项错误，银行准备金率即存款准备金率，存款准备金是指金融机构为保证客户提取存款和资金清算需要而准备的，是缴存在中央银行的存款。中央银行要求的存款准备金占其存款总额的比例就是存款准备金率。提高银行准备金率会降低市场中流动的货币，是紧缩的货币政策，不利于扩大内循环。扩大财政支出，可以增加投资，属于积极的财政政策，有助于刺激需求，扩大内循环。\nB项错误，降低存贷款准备金率，意味着商业银行拥有更多的流动资金，属于积极的货币政策，有助于刺激需求，扩大内循环。但提高税率，公民和企业的纳税额会增加，市场上流通的货币会减少，属于紧缩的财政政策，不利于扩大内循环。\nC项错误，数字货币是电子货币形式的替代货币。发行数字货币只是货币形态的变化，发行纸币或者电子货币要根据市场实际需要的货币量，单纯的多发行不能扩大内循环。免征个人所得税可以增加居民个人收入，有助于刺激需求，扩大内循环。\nD项正确，存贷款利率是存款利率和贷款利率。中央银行降低存款利率可以降低存款带来的利息，降低存款的积极性；降低贷款利率可以降低从银行借钱的成本，提高向银行借款的积极性，是一种扩张性的货币政策，有助于刺激需求，扩大内循环。扩大财政支出会增加市场上流通的货币，属于积极的财政政策，有助于刺激需求，扩大内循环。\n故正确答案为D。","no":21,"missingImage":false},{"qid":"2731411","cat":"人文常识","stem":"在中央国家机关中，负责编制《中华人民共和国国民经济和社会发展第十四个五年规划纲要》的是：","options":{"A":"中共中央","B":"国务院","C":"全国人大","D":"全国人大常委会"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，中共中央，是中国共产党中央委员会的简称，是中国共产党全国代表大会产生的中国共产党核心权力机构，主要职能是召集党的全国代表大会、领导全党工作、人事任免等。\nB项正确，《宪法》第八十九条规定：“国务院行使下列职权：（一）根据宪法和法律，规定行政措施，制定行政法规，发布决定和命令；······（五）编制和执行国民经济和社会发展计划和国家预算；（六）领导和管理经济工作和城乡建设、生态文明建设；（七）领导和管理教育、科学、文化、卫生、体育和计划生育工作；······”《中华人民共和国国民经济和社会发展第十四个五年规划纲要》是关于国民经济和社会发展的计划，由国务院编制。\nC项错误，《宪法》第六十二条规定：“全国人民代表大会行使下列职权：（一）修改宪法；（二）监督宪法的实施；（三）制定和修改刑事、民事、国家机构的和其他的基本法律；（四）选举中华人民共和国主席、副主席；（五）根据中华人民共和国主席的提名，决定国务院总理的人选；根据国务院总理的提名，决定国务院副总理、国务委员、各部部长、各委员会主任、审计长、秘书长的人选；······”编制《中华人民共和国国民经济和社会发展第十四个五年规划纲要》不是全国人大的职权。\nD项错误，《宪法》第六十七条规定：“全国人民代表大会常务委员会行使下列职权：（一）解释宪法，监督宪法的实施；（二）制定和修改除应当由全国人民代表大会制定的法律以外的其他法律；（三）在全国人民代表大会闭会期间，对全国人民代表大会制定的法律进行部分补充和修改，但是不得同该法律的基本原则相抵触；（四）解释法律；（五）在全国人民代表大会闭会期间，审查和批准国民经济和社会发展计划、国家预算在执行过程中所必须作的部分调整方案；······”编制《中华人民共和国国民经济和社会发展第十四个五年规划纲要》不是全国人大常委会的职权。\n故正确答案为B。","no":22,"missingImage":false},{"qid":"2731413","cat":"法律常识","stem":"《社区矫正法》自2020年7月1日起施行，这是我国首次就社区矫正工作专门立法。该法明确了社区矫正的目标和工作原则，规定社区矫正是为了“促进社区矫正对象顺利融入社会，（    ）”。","options":{"A":"促进社会和谐","B":"营造邻里相助的氛围","C":"预防和减少犯罪","D":"深入开展法治宣传工作"},"answer":"C","explanation":"本题考查法律常识。\n《社区矫正法》第一条规定：“为了推进和规范社区矫正工作，保障刑事判决、刑事裁定和暂予监外执行决定的正确执行，提高教育矫正质量，促进社区矫正对象顺利融入社会，预防和减少犯罪，根据宪法，制定本法。”\n故正确答案为C。","no":23,"missingImage":false},{"qid":"2731415","cat":"人文常识","stem":"十三届全国人大常委会第二十次会议表决通过《中华人民共和国香港特别行政区维护国家安全法》。根据该法规定，香港特别行政区设立（    ），负责香港特别行政区维护国家安全事务，承担维护国家安全的主要责任，并接受中央人民政府的监督和问责。","options":{"A":"维护国家安全公署","B":"国家安全事务顾问","C":"维护国家安全委员会","D":"警务处维护国家安全部门"},"answer":"C","explanation":"本题考查法律常识。\n2020年6月30日，十三届全国人大常委会第二十次会议表决通过了《中华人民共和国香港特别行政区维护国家安全法》，该法第十二条规定：“香港特别行政区设立维护国家安全委员会，负责香港特别行政区维护国家安全事务，承担维护国家安全的主要责任，并接受中央人民政府的监督和问责。”\n故正确答案为C。","no":24,"missingImage":false},{"qid":"2731419","cat":"法律常识","stem":"下列行为中形成的关系不属于行政法律关系的是？","options":{"A":"某区市场监管局给予本单位执法人员叶某记过处分","B":"某区环保局对某化工厂处以罚款1万元","C":"某区税务局工作人员在街头设点宣传税法","D":"某区人民法院对某区公安局的强制措施进行合法性审查"},"answer":"C","explanation":"本题考查法律常识。\n行政法律关系是指受行政法律规范调控的因行政活动而形成或产生（引发）的各种权利义务关系。这种关系是一种行政法上的权利义务关系，既应包括在行政活动过程中所形成的行政主体与行政相对人之间的行政法上的权利义务关系，也应包括因行政活动产生或引发的救济或监督关系。\nA项正确，某区市场监管局作为国家行政机关，给予本单位执法人员记过处分，该行为是行政处分，是国家行政机关依照行政隶属关系给予有违法失职行为的国家机关公务人员的一种惩罚措施，属于内部的行政法律关系。\nB项正确，某区环保局作为国家行政机关，对某化工厂处以罚款1万元，该行为是行政处罚，化工厂是行政相对人，处罚行为对化工厂的权利义务产生了实质性影响，属于行政法律关系。\nC项错误，某区税务局工作人员在街头设点宣传税法，不产生行政法意义上的权利义务关系，是行政指导行为，不属于行政法律关系。\nD项正确，某区人民法院对某区公安局的强制措施进行合法性审查，是因行政活动产生的行政诉讼法律关系，属于行政法律关系。\n本题为选非题，故正确答案为C。","no":25,"missingImage":false},{"qid":"2731424","cat":"法律常识","stem":"某公司生产的婴幼儿奶粉蛋白质含量低于规定标准，市场监督管理部门认定该奶粉为不合格产品，并向社会公布。市场监督管理部门认定该奶粉为不合格的行为属于：","options":{"A":"行政处罚","B":"行政强制","C":"行政指导","D":"行政确认"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，《行政处罚法》第九条规定：“行政处罚的种类：（一）警告、通报批评；（二）罚款、没收违法所得、没收非法财物；（三）暂扣许可证件、降低资质等级、吊销许可证件；（四）限制开展生产经营活动、责令停产停业、责令关闭、限制从业；（五）行政拘留；（六）法律、行政法规规定的其他行政处罚。”\nB项错误，《行政强制法》第九条规定：“行政强制措施的种类：（一）限制公民人身自由；（二）查封场所、设施或者财物；（三）扣押财物；（四）冻结存款、汇款；（五）其他行政强制措施。”\nC项错误，行政指导是国家行政机关在职权范围内，为实现所期待的行政状态，以建议、劝告等非强制措施要求有关当事人作为或不作为的活动，行政指导没有法律强制拘束力。\nD项正确，行政确认是指行政机关和法定授权的组织依照法定权限和程序对有关法律事实进行甄别，通过确定、证明等方式决定管理相对人某种法律地位的行政行为。例如，道路交通事故责任认定，医疗事故责任认定，伤残等级的确定，产品质量的确认等。因此市场监督管理部门认定奶粉不合格的行为属于行政确认。\n故正确答案为D。","no":26,"missingImage":false},{"qid":"2731430","cat":"人文常识","stem":"职位分类和职级分类是国家公务员制度的基本内容之一。下列选项中，属于职级分类特征的是：","options":{"A":"以“事”为中心","B":"工资高低与工作难度、责任大小和资历深浅成正比","C":"职位变动，职级也就变动，职级随职位而定，不随人走","D":"以公务员的任职时限为基本资格条件"},"answer":"D","explanation":"本题考查法律常识。\n公务员的职级，是公务员的等级序列，是与领导职务并行的晋升通道，体现公务员政治素质、业务能力、资历贡献，是确定工资、住房、医疗等待遇的重要依据，不具有领导职责。\nA项错误，《公务员法》第十六条规定：“国家实行公务员职位分类制度。公务员职位类别按照公务员职位的性质、特点和管理需要，划分为综合管理类、专业技术类和行政执法类等类别。”职位的分类是以“事”为中心的分类，不是职级的分类。\nB项错误，《公务员法》第二十一条第四款规定：“公务员的领导职务、职级与级别是确定公务员工资以及其他待遇的依据。”工资高低由公务员的领导职务、职级与级别共同决定。\nC项错误，根据《公务员职务与职级并行规定》第二十五条规定：“公务员晋升职级，不改变工作职位和领导指挥关系，不享受相应职务层次的政治待遇、工作待遇。因不胜任、不适宜担任现职免去领导职务的，按照其职级确定有关待遇，原政治待遇、工作待遇不再保留。”因此，公务员职位变动，职级也可能不变。\nD项正确，根据《公务员职务与职级并行规定》第十七条规定，公务员晋升职级，应当在职级职数内逐级晋升，并且具备下列基本条件：（四）符合拟晋升职级所要求的任职年限和资历。因此，公务员晋升职级，应达到相应的任职年限和资历，再结合其他相关因素综合考虑，所以任职时限是基本的资格条件。\n故正确答案为D。","no":27,"missingImage":false},{"qid":"2731433","cat":"经济常识","stem":"上海静安区南京西路街道摩天高楼与石库门并存，有税收过亿的商务楼宇，也有百年老建筑和历史悠久的老小区。如何统筹好各方利益和诉求，寻找居民意愿的最大公约数并形成共识，是打通治理壁垒的关键所在。从行使民主权利的途径来看，南京西路街道社区开展基层自治过程中，体现了民主监督的是：","options":{"A":"社区委员会设评议专业委员会，完成社区代表会议闭会期间对前期工作的评议","B":"疫情防控期间，针对南京西路街道出入口关闭还是开放的问题，居民代表进行讨论","C":"户代表、楼组长、块长对出入人员进行体温监测，无门岗出入口进行健康登记","D":"根据《静安区社区代表会议实施办法》，成立社区代表会议落实基层民主"},"answer":"A","explanation":"本题考查政治常识。\n居民委员会是居民自我管理、自我教育、自我服务的基层群众性自治组织。社区民主监督就是社区居民及相关组织对社区管理和服务主体及其成员在开展社区管理和服务工作中的非权力性监督，通过建议、批评等形式提高社区管理和服务水平。主要形式包括：居务公开和民主评议等。\nA项正确，社区委员会设立的评议专业委员会由部分社区代表组成，针对社区代表会议闭会期间对前期工作进行评议，这是行使民主监督的形式之一，体现了居民的民主监督。\nB项错误，疫情防控期间居民代表针对南京西路街道出入口关闭还是开放的问题进行讨论，这是居委会进行自我管理的体现。\nC项错误，户代表、楼组长、块长对出入人员进行体温监测、健康登记，这是居委会对社区居民进行自我服务的体现。\nD项错误，南京西路街道社区根据《静安区社区代表会议实施办法》，成立社区代表会议，落实基层民主，这是民主管理的体现。\n故正确答案为A。","no":28,"missingImage":false},{"qid":"2741938","cat":"人文常识","stem":"政策议程即提上政府议事日程，纳入政府决策的过程，本质上是社会各阶层各利益团体和人民群众反映和表达自己的愿望和要求，促使政策制定者制定政策予以满足的过程，政策议程建立的关键在于","options":{"A":"政策方案选择","B":"将社会问题转化为政策问题","C":"政策执行","D":"政策制定"},"answer":"B","explanation":"本题考查管理常识。\nA项错误，政策选择亦称“政策优选”。对政策方案择优选择的过程。在政策分析者所提出的可供选择的政策方案的基础上，政策决定者根据自己的价值偏好、人生态度、谋略思想判断客观情势、权衡利弊、确定价值，择优选择决策方案，其不是政策议程建立的关键。\nB项正确，政策议程是将政策问题纳入政治或政策机构实施行动计划的过程。政策问题是已进入政策过程的公共问题和社会问题，是政策制定过程的开端。因此，政策议程建立的关键在于社会问题转化为政策问题。\nC项错误，政策执行是通过一定的方法，综合运用各种手段，为了实现政策目标而采取特定行为模式的过程。是将一种观念形态的政策方案付诸实施的一系列政策活动，其不是政策议程建立的关键。\nD项错误，政策制定是针对公共政策问题提出并选择解决方案的过程，其不是政策议程建立的关键。\n故正确答案为B。","no":29,"missingImage":false},{"qid":"2731437","cat":"人文常识","stem":"加强对行政管理过程的监督和控制，对保证行政管理的公正、稳定、高效具有重要意义。其中对（    ）的监督，成为行政监督最重要的内容。","options":{"A":"行政部门及其工作人员是否廉洁勤政、不滥用权力","B":"自由裁量权是否遭到违规滥用","C":"决策是否科学、合法","D":"行政管理行为是否合法、合理"},"answer":"C","explanation":"本题考查管理常识。\n行政监督是指各类监督主体依法对政府行政机关及其工作人员行使行政权力行为是否合法、合理所实施的监察和督导活动。行政监督全面覆盖行政机关及其公职人员，行政权力和一切行政管理活动受到有效监督，其内容主要有以下四方面：\n（1）监督决策是否科学、合法；（2）监督行政管理行为是否合法、合理；（3）监督公共部门及其工作人员是否廉洁勤政、不滥用权力；（4）监督自由裁量权是否被违规滥用。其中在行政管理活动中，决策居于最重要的地位，行政权力的运行总是从决策开始。因此，对决策的监督，便成为行政监督最重要的内容。\n故正确答案为C。","no":30,"missingImage":false},{"qid":"2731441","cat":"经济常识","stem":"我国的市场经济创造了新型的社会关系，传统的行政价值观正在遭遇现代行政价值观的冲击与渗透，公共行政的价值选择受到多种因素的影响。                    不属于影响公共行政价值选择的主要因素。","options":{"A":"经济发展水平影响","B":"政府社会关系影响","C":"生态地理环境影响","D":"领导者价值观影响"},"answer":"C","explanation":"本题考查管理常识。\nA项正确，经济发展水平是影响公共行政价值选择的主要因素。在社会总体生产力水平较低时，人们对发展经济、增加物质财富的需求会十分强烈。\nB项正确，政府社会关系是影响公共行政价值选择的主要因素。政府与社会不同位次变化将引起公共行政价值的变化。\nC项错误，生态地理环境不是影响公共行政价值选择的主要因素。\nD项正确，领导者价值观是影响公共行政价值选择的主要因素。当领导者的个人价值与公共行政价值相统一时，在行政领导中便会努力地促进公共行政价值的实现。\n本题为选非题，故正确答案为C。","no":31,"missingImage":false},{"qid":"2731445","cat":"法律常识","stem":"公共政策的功能是指执行公共政策对现实环境所产生的实际效果和影响，包括目标导向功能、法律规制功能、利益协调功能和政治象征功能等。下列行为中没有体现法律规制功能的是：","options":{"A":"国家对电力、煤炭、自来水等垄断企业的产品和服务的价格设定上限","B":"国家对小麦、大米、豆油等农产品实行进口关税配额管理","C":"国家通过社会保障、转移支付等手段将税收用于公共卫生事业","D":"国家严格管制枪支弹药以维护社会安全"},"answer":"C","explanation":"本题考查管理常识。\n公共政策目标导向功能：公共政策对社会生活和经济发展规定了特定的目标，并以此来引导社会经济向这一目标发展。法律规制功能：规制的含义就是政府利用法律工具对社会行为和经济行为进行规范和管制的政策行为。利益协调功能：公共政策的核心是解决社会利益的分配和协调问题，公共政策的利益协调功能来自客观现实中永远存在的利益分配不平衡。公共政策的利益协调功能就是对国家和地方范围内出现的利益矛盾、冲突加以缓解、调和、协调，使它不断趋于和谐。政治象征功能：有一些公共政策用宏观的规范性话语来规定社会发展的方向和社会秩序的标准与条件，以此来达到表达政府政治态度和决心、表明政府立场的作用。\nA项正确，国家对电力、煤炭、自来水等垄断企业的产品和服务的价格设定上限体现了法律规制功能。\nB项正确，农产品实行进口关税配额管理体现了法律规制功能。\nC项错误，通过社会保障、转移支付等手段将税收用于公共卫生事业体现的是公共政策利益协调功能。\nD项正确，国家管制枪支弹药体现了法律规制功能。\n本题为选非题，故正确答案为C。","no":32,"missingImage":false},{"qid":"2731448","cat":"科技常识","stem":"2020年7月23日，长征五号遥四运载火箭在中国文昌航天发射场点火升空，实施我国首次火星探测任务“天问一号”。相比探月任务，探测火星的难度更大。下列关于月球探测和火星探测的说法错误的是：","options":{"A":"最佳的火星探测器发射窗口少于最佳月球探测器发射窗口","B":"与月球不同，火星上存在大气层，因此火星探测器需要耐烧蚀性能和隔热性能更优异的防护材料结构","C":"着陆于月球正面的探测器与地球进行通信不受任何限制，无需中继通信支持","D":"火星上的昼夜温差比月球上大，因此火星巡视器在热控方面需要特别设计"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，由于地球和火星都在围绕太阳运转，两者的相对位置不断变化。当它们距离最近时，也被称为相冲，即太阳、地球和火星同处一条直线上，此时发射探测器明显更经济。出现相冲的时间间隔称为会合周期，通常我们认为会合周期就是发射窗口出现的周期（当然还有考虑其他因素）。地球与火星的会合周期是26个月，因此探测火星的发射窗口每隔26个月出现一次。月球探测器发射窗口一般每月都有一次。\nB项正确，月球没有空气，而火星上有空气，在火星上着陆时就需要对高速进入大气产生的摩擦热流进行防护。着陆器要装备类似于神舟飞船的热防护外壳。在速度降低到一定程度时，还需要抛掉防热大底，展开降落伞减速降落。\nC项正确，由于月球的自转周期和它的公转周期是完全一样的，所以地球上只能看见月球永远用同一面向着地球，此面即为月球正面。在月球正面的探测器与地球进行通信时，不会受到月球本身的阻挡，因此不需要中继通信。\nD项错误，月球白天和夜晚的温差高达310摄氏度。且月球的白天和夜晚各自长达13.5天。这就使得月球巡视器在热控方面需要特别的设计，尤其要考虑它如何度过漫长而寒冷的月夜。而火星上存在稀薄的大气，能起到保温隔热作用，所以昼夜温差小于月球。\n本题为选非题，故正确答案为D。","no":33,"missingImage":false},{"qid":"2731450","cat":"人文常识","stem":"降噪耳机是指利用某种方法达到降低噪音的一种耳机，通常采用的降噪方式分为主动降噪和被动降噪。现在流行的“有源消声”这一技术就是利用声波叠加的原理消除噪声的。下列说法正确的是：","options":{"A":"采用硅胶耳塞等隔音材料来阻拦外界噪声是一种主动降噪","B":"“有源消声”技术是一种被动降噪","C":"“有源消声”是通过降噪系统产生与外界噪音完全相同的声波，将噪音中和的","D":"“有源消声”是需要电子系统处理的"},"answer":"D","explanation":"本题考查科技常识。\n主动降噪的原理是通过发出与噪声相位相反，频率、振幅相同的声波与噪声干涉实现相位抵消。被动降噪是利用物理特性将耳朵与外部噪声进行隔离，通过隔声材料来实现，原理简单、降噪成本低，且被动降噪对高频率声音较有效，一般可使噪声降低大约15-20dB。声波叠加的定义是当两个或多个声频信号混合在一起时就会产生叠加，并且产生新的波形。\nA项错误，采用硅胶耳塞等隔音材料属于被动降噪。\nB项错误，“有源消声”利用声波叠加的原理消除噪声，属于主动降噪。\nC项错误，“有源消声”发出与噪声相位相反，频率、振幅相同的声波与噪声干涉实现相位抵消，并非与外界噪音完全相同的声波。\nD项正确，“有源消声”是需要电子系统处理的。\n故正确答案为D。","no":34,"missingImage":false},{"qid":"2731453","cat":"科技常识","stem":"黑土是地球上最珍贵的土壤资源。我国东北黑土区总面积约103万平方公里，其中典型黑土区面积约17万平方公里，是我国重要的商品粮基地。下列关于黑土地形成的原因中，正确的是                    。","options":{"A":"腐殖质演化","B":"有机质含量高","C":"空气氧化结果","D":"富含二氧化锰"},"answer":"A","explanation":"本题考查地理国情。\n东北地区纬度较高，气候较为寒冷。而黑土地是寒冷气候条件下，地表植被死亡后经过长时间腐蚀形成腐殖质后演化而成的，以其有机质含量高、土壤肥沃、土质疏松、最适耕作而闻名于世，素有“谷物仓库”之称。\nA项正确，黑土地是寒冷气候条件下，地表植被死亡后经过长时间腐蚀形成腐殖质后演化而成的。\nB项错误，有机质含量高是东北黑土地的特点。\nC项错误，空气氧化不是黑土地形成的原因。\nD项错误，富含二氧化锰不是黑土地形成的原因。\n故正确答案为A。","no":35,"missingImage":false},{"qid":"2731456","cat":"科技常识","stem":"植物生长素在细胞分裂和分化、果实发育、插条生根的形成和落叶过程中发挥比较重要的作用，这其中生长素的作用表现为两重性：既能促进生长，也能抑制生长。以下描述中，属于抑制生长的是：","options":{"A":"雌花形成","B":"叶片扩大","C":"伤口愈合","D":"果实脱落"},"answer":"D","explanation":"本题考查科技常识。\n植物生长素是由具分裂和增大活性的细胞区产生的调控植物生长方向的激素。植物生长素的主要作用是使植物细胞壁松弛，从而使细胞增长，在许多植物中还能增加RNA和蛋白质的合成，调节植物生长，尤其能刺激茎内细胞纵向生长并抑制根内细胞横向生长的一类激素。\nA项错误，雌花形成是细胞的生长过程，属于促进生长。\nB项错误，叶片扩大是细胞的生长过程，属于促进生长。\nC项错误，伤口愈合是细胞的生长过程，属于促进生长。\nD项正确，果实脱落是细胞的停止生长过程，属于抑制生长。\n故正确答案为D。","no":36,"missingImage":false},{"qid":"2731457","cat":"人文常识","stem":"下列古代建筑工程按照建造时间先后顺序排列正确的一项是：","options":{"A":"都江堰、秦始皇陵、未央宫、大明宫","B":"秦始皇陵、都江堰、大明宫、未央宫","C":"未央宫、秦始皇陵、都江堰、大明宫","D":"大明宫、都江堰、秦始皇陵、未央宫"},"answer":"A","explanation":"本题考查人文常识。\n都江堰位于四川省成都市都江堰市城西，坐落在成都平原西部的岷江上，始建于秦昭王末年（约公元前256～前251），是蜀郡太守李冰父子在前人鳖灵开凿的基础上组织修建的大型水利工程。\n秦始皇陵建于秦王政元年（公元前247年）至秦二世二年（公元前208年），历时39年，是中国历史上第一座规模庞大，设计完善的帝王陵寝。\n未央宫建于汉高祖七年（公元前200年），由刘邦重臣萧何监造，在秦章台的基础上修建而成，位于汉长安城地势最高的西南角龙首原上，是汉朝的政治中心和国家象征。\n大明宫始建于唐太宗贞观八年（634年），是唐朝的政治中心和国家象征，也是唐长安城三座主要宫殿“三大内”（大明宫、太极宫、兴庆宫）中规模最大的一座。\n因此，按时间先后顺序排序应为都江堰、秦始皇陵、未央宫、大明宫。\n故正确答案为A。","no":37,"missingImage":false},{"qid":"2731458","cat":"人文常识","stem":"黄浦江是上海的地标河流，流经上海市区，将上海分成浦西和浦东，“浦”是古吴语中河的意思，一般多指人工河。黄浦江曾被称为黄龙浦，明清时“黄浦秋涛”为一大景观，农历八月十八在陆家嘴可见“银涛壁立如山倒”之景。而黄浦江别名黄歇浦，则是因为上海成为战国时的四公子之一（    ）的封地。","options":{"A":"魏国信陵君","B":"赵国平原君","C":"齐国孟尝君","D":"楚国春申君"},"answer":"D","explanation":"本题考查人文常识。\n黄歇（前314年－前238年），楚国大臣，曾任楚相。楚考烈王元年（公元前262年），以黄歇为相，封为春申君。《上海地名志》等记载：上海简称“申”是源自受封于这里的春申君黄歇。黄歇未封吴地之时，黄浦江也不叫黄浦江，而且这条河由于泥沙淤积，河床过高，一到汛期常常洪水泛滥，老百姓苦不堪言。黄歇到后，就对这条河进行治理，疏通了河道，筑起了堤坝，使这条河不再泛滥，造福了当地的百姓。人们为了怀念他，将这条河改称为春申江或黄浦江，简称申江。后来，“申”字就成了上海的代称。\n故正确答案为D。","no":38,"missingImage":false},{"qid":"2731460","cat":"人文常识","stem":"古人常用“煎茶”的方法品茶，下列诗句中，和该风俗无关的是（    ）。","options":{"A":"雪乳已翻煎处脚，松风忽作泻时声","B":"汤添勺水煎鱼眼，末下刀圭搅麹尘","C":"西崦人家应最乐，煮芹烧笋饷春耕","D":"新芽连拳半未舒，自摘至煎俄顷馀"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“雪乳已翻煎处脚，松风忽作泻时声”出自北宋苏轼的《汲江煎茶》，这是一首关于茶道的七律，诗中描写了从取水、煎茶到饮茶的全过程。这句诗的意思是茶沫如雪白的乳花在煎处翻腾漂浮，沸声似松林间狂风在煮时震荡怒吼。\nB项正确，“汤添勺水煎鱼眼，末下刀圭搅麹尘”出自唐白居易的《谢李六郎中寄新蜀茶》，这首诗是诗人被贬谪江州司马后，收到忠州刺史李景俭（即李六郎中）从蜀地寄来新茶后所作的酬谢诗。诗中的“勺水”指少量的水，“鱼眼”指水烧开时冒出的状如鱼眼大小的气泡，意思是取来煮茶的工具，煎水煮茶，用器具将茶碾成颗粒状，用小汤匙搅动茶叶细末。\nC项错误，“西崦人家应最乐，煮芹烧笋饷春耕”出自北宋苏轼的《新城道中二首》，这首诗写作者出巡时途中所见的美丽景色，愉快地赞美了山村人家和平的劳动生活。这句诗的意思是西崦（西山）人家又是煮芹，又是烧笋，忙着春耕，其乐无穷，与“煎茶”习俗无关。\nD项正确，“新芽连拳半未舒，自摘至煎俄顷馀”出自唐刘禹锡的《西山兰若试茶歌》，这首诗歌详尽地描写了茶叶从采摘到炒成、烹煮的整个过程。这句诗的意思是新采摘的茶嫩芽还未舒展开，从摘下来到煎好很快就完成。\n本题为选非题，故正确答案为C。","no":39,"missingImage":false},{"qid":"2731464","cat":"人文常识","stem":"上海应急科技攻关项目“上海移动式核酸检测方舱实验室”正式交付使用。这是国内首个采用标准集装箱尺寸的P2\u003cimg data-k=\"3d6d1f96db11\">移动式核酸检测实验室。实验室配备的检测设备\u003cimg data-k=\"cd4db1324e77\">来自国内企业研发生产。这一实验室首先交付使用的场所是_____。","options":{"A":"北京首都国际机场","B":"北京大兴国际机场","C":"上海虹桥国际机场","D":"上海浦东国际机场"},"answer":"D","explanation":"本题考查政治常识。\n2020年8月7日，上海应急科技攻关项目“上海移动式核酸检测方舱实验室”在上海浦东国际机场正式交付。这是国内首个采用标准集装箱尺寸的p2\u003cimg data-k=\"3d6d1f96db11\">移动式核酸检测实验室。实验室外观为一个标准集装箱大小，可支持集卡、货轮、铁路等各种运输方式。内部空间分为试剂准备室、样本处理室和核酸检测室三个独立区间，符合加强型生物安全二级实验室的规范要求。实验室正式启用后，可支持在浦东机场开展随到随检，与原先送至市区实验室相比，可节约2小时的等待时间。\n故正确答案为D。","no":40,"missingImage":false}]}],"count":32,"answerable":32,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        上个世纪90年代，中国高性能计算机领域存在的没得用、不适用、用不起的严重问题制约着国家的可持续发展。总体来看，我国的计算机水平比国外落后十几年，高性能计算机用户群窄小，只应用在科学计算类的“象牙塔”中，对各行各业的迫切需求的适配性很差，更没法大面积推广，没法形成产业。\u003c/p>\u003cp>        为此，中国科学院计算技术研究所成立了智能中心，着力发展既要“顶天”更要“立地”的高性能计算机，即“曙光”高性能计算机。在统一认识的基础上，智能中心明确提出坚定不移地按照“863”计划“发展高技术、实现产业化”的宗旨来发展曙光机，其内涵是：系统地发展机群架构技术体系，使得曙光机的计算速度不断提高、适用的应用领域不断扩大、机器台数不断增多。这也是“曙光”之路的“三叉戟”——性能、应用和产业。\u003c/p>\u003cp>        \u003cu>这一时段\u003c/u>，在国外封锁的条件下，高性能计算机大多只为“两弹一星”等国家重大战略需求提供支撑。但因本身起步比国际上晚，加上西方国家的封锁和禁运，这些机器的研制大都耗费了较长的研制周期（如DJS系列、757机、“银河-Ι”），成果也不可能实现商品化、产业化，不过，对打破国外的封锁却具有里程碑式的意义。“曙光一号”诞生后仅3天，西方国家便宣布解除10亿次计算机对中国的禁运。\u003c/p>\u003cp>        21世纪初，随着国内各行各业对高性能计算的需求急剧增加并呈多样化，以及改革开放的浪潮，很多国外高性能计算机品牌（如IBM、HP等）涌入中国市场，在民用市场形成了垄断地位。当中国的高性能计算机技术和产业水平发展起来后，西方国家开始从产业链条与技术层面进行遏制。意识到严峻局势，智能中心决心走上引领创新之路。“曙光”“神威”“天河”都开始自主研制高性能处理器和加速器，用自己的核心部件构建世界上最快的计算机。2010年6月，“曙光6000”系统排名世界第二，从此拉开中国高性能计算机持续占据超算排名前三甲的序幕。“神威・太湖之光”系统更是排名世界第一。\u003c/p>\u003cp>        正是因为在技术和市场两方面都具备了能与国际巨头媲美的实力，对很多行业应用性能更高、价格更便宜、功耗更低，中科曙光成为国内第一家以高性能计算机为主业的上市公司。\u003cspan style=\"color:#rgb(89,89,89)\">曙光机群高性能计算机强力竞争，也彻底改变了由国际大厂商制定的游戏规则，迫使国外的一些大公司也不得不采取“跳楼价”销售。\u003c/span>目前，高性能计算在我国科研单位、大学基本实现了普及。但相比研制，更高性能计算机推广应用的历程却更加艰辛。\u003c/p>","questions":[{"qid":"2731024","cat":"片段阅读","stem":"“这一时段”指的是                    。","options":{"A":"上个世纪60年代","B":"上个世纪90年代","C":"21世纪初","D":"1910年以后"},"answer":"B","explanation":"“这一时段”出现在文章第三段，且由“这”可知，指代内容为上文。根据一、二段内容可知，前文主要介绍在上个世纪90年代，中国高性能计算机领域在困境中成立了智能中心，努力发展自有的高性能计算机。故“这一时段”是指上个世纪90年代，对应B项。\nA项“上个世纪60年代”、D项“1910年以后”文段均未提及，无中生有，排除；\nC项“21世纪初”为后文内容，并非是“这一时段”所指代的对象，表述错误，排除。\n故正确答案为B。\n【文段出处】《高性能计算机发展与政策》","no":41,"missingImage":false},{"qid":"2731025","cat":"片段阅读","stem":"就相关文段推断，第二自然段所说的“立地”是指                  。","options":{"A":"计算速度不断提高","B":"高性能的处理器和加速器","C":"价格更便宜、功耗更低","D":"应用推广与产业化"},"answer":"D","explanation":"定位原文第二段，“立地”出现在文段首句，其所在句子是结论词“为此”引导的对策，指出高性能计算机既要“顶天”更要“立地”，结合第一段内容进行理解，“立地”应是针对“对各行各业的迫切需求的适配性很差，更没法大面积推广，没法形成产业”这一问题提出的对策，故“立地”指代的内容对应D项“应用推广与产业化”。\nA项，“计算速度不断提高”对应第二段“使曙光机的计算速度不断提高，······”，是所述计划宗旨的内涵，并非“立地”指代的内容，排除；\nB项，“高性能的处理器和加速器”对应第四段“‘曙光’‘神威’‘天河’都开始自主研制高性能处理器和加速器”，并非“立地”指代的内容，排除；\nC项，“价格更便宜，功耗更低”对应第五段内容，并非“立地”指代的内容，排除。\n故正确答案为D。\n【文段出处】《高性能计算机发展与政策》","no":42,"missingImage":false},{"qid":"2731027","cat":"片段阅读","stem":"下列表述，与原文内容不吻合的一项是：","options":{"A":"我国的高性能计算机是从上个世纪90年代才开始高速发展的","B":"757机要比“曙光6000” 早约20年","C":"“神威・太湖之光”已经实现了产业化","D":"高性能计算在我国科研单位、大学基本实现普及是在2010年后"},"answer":"C","explanation":"A项，根据第一段“上个世纪90年代，······制约着国家的可持续发展”及第二段“为此，中国科学院······‘曙光’高性能计算机”可知，我国自从上世纪90年代后开始发展“曙光”高性能计算机，选项表述正确，排除；\nB项，根据第一段“上个世纪90年代，······制约着国家的可持续发展”及第三段“这一时段，······这些机器的研制大都耗费了较长的研制周期（如DJS系列、757机、‘银河-Ι’）”可知，757机诞生时间约为上世纪90年代；根据第四段“2010年6月，‘曙光6000’系统排名世界第二”可知，“曙光6000”诞生时间为2010年，二者相差约20年，选项表述正确，排除；\nC项，根据第五段“中科曙光成为国内第一家以高性能计算机为主业的上市公司”可知，实现了产业化的是“曙光”高性能计算机，而文段未提及“神威”高性能计算机是否形成产业化，无中生有，当选；\nD项，根据第四段“2010年6月，‘曙光6000’系统排名世界第二”及第五段“中科曙光成为国内第一家以高性能计算机为主业的上市公司······目前，高性能计算在我国科研单位、大学基本实现了普及”可知，2010年曙光机诞生后，高性能计算才在我国科研单位、大学基本实现了普及，选项表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《高性能计算机发展与政策》","no":43,"missingImage":false},{"qid":"2731028","cat":"片段阅读","stem":"这一文段的语意重心是                    。","options":{"A":"高性能计算机的推广应用","B":"智能中心如何研制高性能计算机","C":"高性能计算机的发展历程","D":"智能中心研制高性能计算机的历程"},"answer":"C","explanation":"第一段论述了我国在高性能计算机领域存在的问题，第二、三、四段论述了高性能计算机的研制过程，第五段论述了高性能计算机的普及。故整篇文章论述了高性能计算机从无到有，再到发展越来越好，再到普及的发展过程，对应C项。\nA项，“推广应用”无中生有，文段没有论述高性能计算机是如何推广应用的，排除；\nB项，“如何研制高性能计算机”无中生有，文段没有论述研制高性能计算机的具体对策，并且“研制”只能对应前四段，表述片面，排除；\nD项，“研制高性能计算机的历程”只能对应前四段，表述片面，排除。\n故正确答案为C。\n【文段出处】《高性能计算机发展与政策》","no":44,"missingImage":false}]},{"type":"material","material":"\u003cp align=\"center\">桐叶封弟辨\u003c/p>\u003cp align=\"center\">柳宗元\u003c/p>\u003cp>古之传者（1）有言：成王以桐叶与小弱弟（2）戏（3），曰：“以封汝。”周公入贺。王曰：“戏也。”周公曰：“天子不可戏。”乃封小弱弟于唐。\u003c/p>\u003cp>吾意不然。王之弟当封邪，周公宜以时言（4）于王，不待其戏而贺以成之也。不当封邪，周公乃成其不中之戏，以地以人与小弱者为之主，其得为圣乎？且周公以王之言不可苟（5）焉而已，必从而成之邪？设有不幸，王以桐叶戏妇寺（6），亦将举而从之乎？凡王者之德，在行之何若。设未得其当，虽十易之不为病；要于其当，不可使易也，而况以其戏乎！若戏而必行之，是周公教王遂（7）过也。\u003c/p>\u003cp>吾意周公辅成王，宜以道，从容优乐（8），要归之大中（9）而已，必不逢其失而为之辞。又不当束缚之，驰骤（10）之，使若牛马然，急则败矣。且家人父子尚不能以此自克，况号为君臣者邪！是直小丈夫缺缺（11）者之事，非周公所宜用，故不可信。\u003c/p>\u003cp>或曰：封唐叔，史佚（12）成之。\u003c/p>\u003cp>注释：\u003c/p>\u003cp>（1）传者：文字记载，著作。\u003c/p>\u003cp>（2）小弱弟：周成王之弟叔虞。\u003c/p>\u003cp>（3）戏：开玩笑。\u003c/p>\u003cp>（4）时言：及时进言。\u003c/p>\u003cp>（5）苟：不严肃，轻率。\u003c/p>\u003cp>（6）妇寺：宫中的妃嫔和太监。\u003c/p>\u003cp>（7）遂：铸成。\u003c/p>\u003cp>（8）优乐：嬉戏、娱乐。\u003c/p>\u003cp>（9）大中：指适当的道理和方法。\u003c/p>\u003cp>（10）驰骤：被迫奔跑。\u003c/p>\u003cp>（11）缺缺：耍小聪明的样子。\u003c/p>\u003cp>（12）史佚：周武王时的史官尹佚。\u003c/p>","questions":[{"qid":"2731030","cat":"片段阅读","stem":"关于周公和柳宗元对于成王以桐叶戏弟一事的看法，以下说法恰当的是                    。","options":{"A":"周公认为成王可以和弟弟开玩笑，但不应该给弟弟封地","B":"周公认为成王不应该和弟弟开玩笑，也不应该给弟弟封地","C":"柳宗元认为成王可以和弟弟开玩笑，也可以给弟弟封地","D":"柳宗元认为既然成王是开玩笑，就不应该把玩笑当真，真给弟弟封地"},"answer":"D","explanation":"由第一段“周公曰：‘天子不可戏。’乃封小弱弟于唐”，译为“周公说：‘天子不应该开玩笑。’于是成王把唐地封给了小弟弟”，可知，周公认为成王不可以和弟弟开玩笑，应该给弟弟封地，A、B两项表述错误，排除；\nC项，由第二段“若戏而必行之，是周公教王遂过也”，可译为“假若开玩笑的话也一定要照办，这就是周公在教成王铸成过错啊”，以及第三段“吾意周公辅成王，······必不逢其失而为之辞”，可译为“我认为周公辅佐成王，······必定不会去逢迎他的过失，为他巧言辩解”，可知，柳宗元认为，和弟弟开玩笑，把玩笑当真，给弟弟封地，是一种过失，不应该逢迎成王的过失，即不应该给弟弟封地，表述错误，排除；\nD项，由第二段“若戏而必行之，是周公教王遂过也”，可译为“假若开玩笑的话也一定要照办，这就是周公在教成王铸成过错啊”可知，柳宗元认为开玩笑的话不应该照办，即不应该把玩笑当真，真给弟弟封地，表述正确，当选。\n故正确答案为D。\n【文段出处】《桐叶封弟辨》","no":45,"missingImage":false},{"qid":"2731032","cat":"片段阅读","stem":"下列选项中，对句意理解有误的一项是                    。","options":{"A":"“吾意不然。”意思是我认为不是这样。","B":"“凡王者之德，在行之何若。”意思是大凡帝王的德行，在于他的行为怎么样。","C":"“若戏而必行之，是周公教王遂过也。”意思是假若开玩笑的话也一定要照办，周公就比成王做得更错。","D":"“且家人父子尚不能以此自克，况号为君臣者邪！”意思是况且，在家人、父子之间尚且不能这样去约束，更何况名义上是君臣呢！"},"answer":"C","explanation":"A项，“吾意不然。”意思是：我认为不是这样，表述正确，排除；\nB项，“凡王者之德，在行之何若。”意思是：大凡帝王的德行，在于他的行为怎么样，表述正确，排除；\nC项，“若戏而必行之，是周公教王遂过也。”意思是：假若开玩笑的话也一定要照办，这就是周公在教成王铸成过错啊，而非“周公就比成王做得更错”，表述错误，当选；\nD项，“且家人、父子尚不能以此自克，况号为君臣者邪！”意思是：况且，在家人父子之间尚且不能这样去约束，更何况名义上是君臣呢！表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《桐叶封弟辨》","no":46,"missingImage":false},{"qid":"2731034","cat":"片段阅读","stem":"以下选项中，对段落内容理解不准确的一项是                    。","options":{"A":"第一自然段以简括的语言概述关于桐叶封弟史实的记载","B":"第二自然段逐层加以辩驳，总共提出了三种假设，滴水不漏，在此基础上作者提出了自己的观点","C":"第三自然段作者从正面阐述自己的观点，由对周公做法的批判，上升到讨论臣子应当以什么样的态度来辅佐君王","D":"结尾是全文的高潮，作者抛出最重要的论据，证明桐叶封弟一事不是周公促成的，印证了自己对这件事记载失实的猜测"},"answer":"D","explanation":"A项，根据第一自然段“成王以桐叶与小弱弟······乃封小弱弟于唐”可知，该段简要概述了关于桐叶封弟的历史故事，故表述正确，排除。\nB项，根据第二自然段“王之弟当封邪······不待其戏而贺以成之也”“不当封邪······其得为圣乎？”“若戏而必行之，是周公教王遂过也”可知，该段一共提出了三种假设，并在此基础上提出自己的观点，故表述正确，排除。\nC项，根据第三自然段“且家人父子尚不能以此自克······故不可信”可知，该段提出了作者的观点，讨论臣子应当如何辅佐君王，故表述正确，排除。\nD项，根据最后一段内容可知，文段并未提及这些内容是证明桐叶封弟的“最重要的论据”，表述过于绝对；且“或曰”指的是有的史书上的记载、表明，而非表示有确凿证据证明自己的观点，只是有另外的史书记载，“印证了······猜测”与文意不符，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《桐叶封弟辨别》","no":47,"missingImage":false},{"qid":"2731036","cat":"片段阅读","stem":"本篇题为《桐叶封弟辨》，以下说法中，对此标题理解最为恰当的一项是                    。","options":{"A":"辨是辨伪的意思，作者写作本文的主要目的是考证史书上记载的桐叶封弟一事，证明其并非周公之所为","B":"辨是辨明是非曲直的意思，作者写作本文是为了借桐叶封弟一事阐述自己的政治观点","C":"辨有辩解之意，作者就桐叶封弟一事为成王辩解，认为戏言没有错，无须当真","D":"辨有辩论之意，作者与古人隔空辩论，而自己的观点也在双方的激烈交锋中展现得更为犀利"},"answer":"B","explanation":"文段开篇以“成王以桐叶与小弱弟”展开论述，围绕重臣应如何辅佐君主这一中心展开议论，批判臣子把玩笑话当作金科玉律，绝对地予以服从，进而尖锐地批评了这种荒唐现象，指出“凡王者之德，在行之何若”，对统治者的言行，要看它的客观效果如何，不能拘执盲从。故标题中的“辨”是辨明是非曲直的意思，作者借桐叶封弟一事阐述自己的政治观点，对应B项。\nA项，本文的重点不在于“辨伪”，而是围绕重臣应如何辅佐君主这一中心展开议论，表述错误，排除；\nC项，本文的“辨”并非“辩解”之意，且“认为戏言没有错，无须当真”偏离文段核心话题，排除；\nD项，文段并未体现出“作者与古人隔空辩论”“双方的激烈交锋”，无中生有，排除。\n故正确答案为B。\n【文段出处】《桐叶封弟辨别》","no":48,"missingImage":false},{"qid":"2731005","cat":"片段阅读","stem":"文明一般与野蛮        ，既是指人类所创造的物质财富和精神财富的总和，也是指一种社会进步状态。人类摆脱野蛮趋向文明的历史和人类如何处理与自然的关系紧密        。人与自然的关系是人类社会最基本的关系。人靠自然界生活，人类也总是在同自然的        中生产、生活、发展。中华文明强调要把天地人统一起来，按照大自然规律活动，取之有时，用之有度。","options":{"A":"对照，联系，斗争","B":"对应，相连，互动","C":"对立，相联，妥协","D":"矛盾，关联，了解"},"answer":"B","explanation":"第一空，横线处所填词语形容“文明”与“野蛮”的关系，B项“对应”、C项“对立”均可表示文明与野蛮属于不同的两个方面，符合文意，保留；A项“对照”指放在一起加以比照，文段并未体现出要将两者互相作对比之意，与文意不符，排除；D项“矛盾”泛指事物互相抵触或排斥，文段并未体现出两者互相抵触之意，排除。\n第二空，横线处搭配“紧密”，B项“相连”指互相连接、彼此关联，“紧密相连”为常见搭配，保留；C项“相联”为“相连”的错误用法，排除。\n第三空，代入验证，B项“互动”指彼此联系，相互作用，用于此处表示人类与自然的紧密关系，对应后文“中华文明强调要把天地人统一起来”，符合文意，当选。\n故正确答案为B。\n【文段出处】《自觉养成讲文明讲卫生讲科学的健康生活方式》","no":49,"missingImage":false},{"qid":"2731006","cat":"语句表达","stem":"依次填入下列各句横线上的成语，与句意最贴切的一组是：\n①起风了，黄山的云雾            ，让人目不暇接，真是美极了。\n②雪花飘飘荡荡，            ，宛如仙女下凡，个个披上了漂亮的婚纱。\n③有些石笋从地上冒出来，形状            ，让人忍不住赞叹大自然的鬼斧神工。","options":{"A":"千变万化，千姿百态，千奇百怪","B":"千姿百态，千奇百怪，千变万化","C":"千变万化，千奇百怪，千姿百态","D":"千姿百态，千变万化，千奇百怪"},"answer":"A","explanation":"本题可从第二空入手，第二空横线后“宛如仙女下凡，个个披上了漂亮的婚纱”为形象化表达，故横线处需对应“仙女”美好的特征，A项“千姿百态”形容姿态多种多样或种类十分丰富，可形容人的姿态优美，与“仙女”对应恰当，保留；B、C两项的“千奇百怪”形容各种各样奇怪的事物，文中并无“奇怪”之意，排除；D项“千变万化”形容变化非常多，无法对应“仙女”美好的特征，排除。\n第一空，根据横线前“起风了，黄山的云雾”可知，此处表示起风后云雾形态在不断变化，A项“千变万化”符合文意，保留。\n第三空，代入验证，A项“千奇百怪”形容事物奇异而多样，填入此处指石笋形状奇异多样，对应后文“大自然的鬼斧神工”，当选。\n故正确答案为A。","no":50,"missingImage":false},{"qid":"2731007","cat":"逻辑填空","stem":"多年以后，        我已身处另一座城市。        ，每当回忆起那个生活多年之地，        能想起萍水相逢之人带我见识瓷器之美的那个遥远的下午。","options":{"A":"尽管，甚至，总是","B":"哪怕，只要，就","C":"也许，可是，还是","D":"虽然，但是，仍然"},"answer":"C","explanation":"本题可从第二空入手，根据“我已身处另一座城市”和“那个生活多年之地”可知，横线处应填入表示转折的关联词，C项“可是”、D项“但是”均可表示转折，保留；A项“甚至”表示递进、B项“只要······就”表示充分条件关系，均不符合文意，排除。\n第一空，根据“多年以后······我已身处另一座城市”可知，此句为完整独立的复句，而D项“虽然······但是”一般只能连接分句，无法连接复句，排除。\n第三空，代入验证，C项“还是”表示回忆没有中断，符合语境，当选。\n故正确答案为C。\n【文段出处】中国青年报《2020：愿每一颗闯荡的心都能被温柔呵护》","no":51,"missingImage":false},{"qid":"2731008","cat":"逻辑填空","stem":"由中晚唐到北宋，中国文化并未产生特别深刻的变化，但如果说不免物换星移，        也因为社会组织结构中平民阶级的兴起、社会生活中经贸活动因素的增加，逐渐形成不同的文化圈。其中主要的有两个，一个是士大夫文化圈，一个是平民文化圈。前者趋“雅”，后者趋“俗”，似乎是双轨的，这种情况         于宋代以后。当然“阳春白雪”同“下里巴人”并非完全        ，有时，士大夫也受“俗”的影响，譬如理学家朱熹等人的文字加入了许多白话、俗语的成分；同时民间文化也受“雅”的影响，如工艺器物讲究精致和素雅的风格等。","options":{"A":"却，延续，隔离","B":"确，沿续，剥离","C":"确，延续，隔绝","D":"却，沿续，分隔"},"answer":"C","explanation":"第一空，根据文段信息“但如果说不免物换星移”“因为社会组织结构中平民阶级的兴起······形成不同的文化圈”可知，文段体现的是除了时间的变化，还有社会因素的影响，进而逐渐形成了不同的文化圈，横线处要体现的含义是肯定、的确之意，B、C项的“确”指确实、的确，与文段对应恰当，保留；A、D项的“却”表示转折，与文意不符，排除。\n第三空，根据后文“士大夫也受‘俗’的影响”“民间文化也受‘雅’的影响”可知，“阳春白雪”和“下里巴人”并不是隔离、隔断的，C项“隔绝”有隔断、不相往来的含义，符合文意，保留；B项“剥离”意为脱落、使两者分开，横线处形容的是“阳春白雪”和“下里巴人”的关系，且根据“似乎是双轨的”可知，两者并无在一起之意，排除。\n第二空，代入验证，C项“延续”指照原来的样子继续下去，延长下去，填入此处表示这种情况一直持续到宋代以后，符合文意，当选。\n故正确答案为C。\n【文段出处】《&lt;清平乐&gt;中的宋朝美学：“超然乎尘垢之外，一新天下耳目”》","no":52,"missingImage":false},{"qid":"2731009","cat":"逻辑填空","stem":"灭绝是一个        的词。没有人知道，地球上最后一尾长江白鲟怎样度过了        的一生。尽管希望        ，研究者仍然希望，在长江某些水域之下，在某些未曾探测到的暗礁背后，还有几尾残存的白鲟个体。","options":{"A":"凝重，孤独，渺茫","B":"沉重，孤独，渺茫","C":"沉重，孤苦，迷茫","D":"凝重，孤苦，迷茫"},"answer":"B","explanation":"第一空，修饰“词”，B、C两项的“沉重”指分量大、程度深、（心情）忧郁，“沉重的词”为常见搭配，用于此处可体现“灭绝”一词对于人民内心上的激烈冲击，保留；A、D两项的“凝重”指端庄、庄重、浑厚，多搭配“表情、神态、声音”等，与“词”搭配不当，排除。\n第二空，搭配“一生”，且对应前文“最后一尾”，B项“孤独”指孤单，独自一个，C项“孤苦”指孤单困苦，均搭配恰当，保留。\n第三空，搭配“希望”，B项“渺茫”指因没有把握而难以预期，“希望渺茫”为固定搭配，当选；C项“迷茫”指神情迷离恍惚，多搭配“神色、神情”等，与“希望”搭配不当，排除。\n故正确答案为B。\n【文段出处】《长江白鲟的挽歌》","no":53,"missingImage":false},{"qid":"2731010","cat":"语句表达","stem":"下面句子表达准确的是                    。","options":{"A":"目前世界上最快的磁悬浮列车最高时速可达600多公里/小时。","B":"目前世界上最快的磁悬浮列车最高速度为600多公里。","C":"目前世界上最快的磁悬浮列车最高时速为600公里。","D":"目前世界上最快的磁悬浮列车最高速度约为600公里。"},"answer":"C","explanation":"A项，“时速”与“/小时”语义重复，成分多余，排除；\nB项，“最高速度为600多公里”成分残缺，应为“最高速度为600多公里/小时”，排除；\nC项，“最高时速为600公里”表述正确，当选；\nD项，“最高速度约为600公里”成分残缺，应为“最高速度约为600公里/小时”，排除。\n故正确答案为C。\n【文段出处】新华网《有了高铁，为何还要研制时速600公里磁浮列车》","no":54,"missingImage":false},{"qid":"2731011","cat":"语句表达","stem":"以下句子正确的排序是_______。\n①外在世界中的规律，只要我们发挥主观能动性就能认识。\n②近代英国的哲学家贝克莱走得更远，他说：存在的都是被感知到的，唯一真实的只有我们的感觉。\n③唯物主义认为，外在世界是客观存在的，它就是我们看到的样子。\n④但是，这种浅薄的唯物主义马上就遭到了一些唯心主义哲学家的反驳。\n⑤他们有的说，外在世界是否存在，本身就是一个问题，更别说去认识了。","options":{"A":"③⑤④②①","B":"③①④⑤②","C":"①④⑤②③","D":"①③④②⑤"},"answer":"B","explanation":"对比选项，确定首句。③句提到唯物主义的观点，①句是对唯物主义观点的具体阐释，故③句更适合作为首句，排除C、D两项。观察A、B两项，③句后接的是⑤句和①句，⑤句开头出现指代词“他们”，由文意可知，“他们”指的是④句中的“唯心主义哲学家”，故⑤句应和④句捆绑，③⑤两句捆绑不当，排除A项。\n验证B项，③①两句阐述唯物主义的观点，④⑤②三句转折后阐述唯心主义的观点，逻辑合理，当选。\n故正确答案为B。\n【文段出处】《学哲学必须要想清楚的10个问题，一个都不能少！》","no":55,"missingImage":false},{"qid":"2731012","cat":"语句表达","stem":"以下选项中没有语病的一项是:","options":{"A":"悠悠数千载以来，乳香的香气浓烈的弥漫在阿曼这块美丽的土地上，渗透进阿曼人的日常生活乃至精神世界。","B":"时至今日，你若步入首都马斯喀特的马特拉传统阿拉伯市场，依然能看到大大小小的香料店前，一律古色古香地摆放着小香炉。","C":"店主为了吸引顾客，就将炉里的几块炭火点燃，炉子上撒落几粒乳白的颗粒，随着青烟升腾起来后，一股特殊的香味便扑鼻而来。","D":"这种乳白色的颗粒便是乳香，它由乳香树渗出的树胶和树脂凝固而成。虽然如今乳香已不再是贵族阶层的专宠，价格却依然不菲。"},"answer":"C","explanation":"A项，“悠悠数千载以来”语意重复，应改为“悠悠数千载”或“数千载以来”，此外“香气浓烈的弥漫”应改为“香气浓烈地弥漫”，故存在语病，排除；\nB项，“古色古香”形容书画、器物、陈设或建筑等具有古雅的风味，可以形容“小香炉”，但不能修饰“摆放”，故语序错误，应改为“一律摆放着古色古香的小香炉”，排除；\nC项，语句通顺，语义明确，没有语病，当选；\nD项，“虽然如今乳香已不再是······依然不菲”语序不当，此句主语为“乳香”，“如今”作为时间状语应放在句首，应改为“如今虽然乳香已不再是贵族阶层的专宠”，故存在语病，排除。\n故正确答案为C。","no":56,"missingImage":false},{"qid":"2731013","cat":"语句表达","stem":"下列选项中，引用诗文不恰当的一项是：","options":{"A":"跨入1997年以后，北京的互联网开始火起来，大街小巷开始遍布着网络公司，开枝散叶般，真是“忽如一夜春风来，千树万树梨花开”。","B":"从上海外滩眺望对岸浦东，可以清晰地看到东方明珠的11个大小不一、错落有致的球体从天空串到草地上，恰似“大珠小珠落玉盘”。","C":"幸福是很难得到的，容易实现的是某一时某一刻的快活，而幸福就是追求幸福的过程，因为永远有要超越和实现的，永远有擦身而过转瞬即逝的，“曾经沧海难为水，除却巫山不是云”，真到了那种境界也没什么意思。","D":"人有思想，有意识，有意志，有理智，有精神力量，在生命的河流中，可以劈波击浪，排除险阻；也可以激浊扬清，“出淤泥而不染”。问题的关键在于：在复杂多变的环境面前，能否时刻保持一副清醒的头脑。"},"answer":"C","explanation":"C项，“曾经沧海难为水，除却巫山不是云”意思是爱情之深广笃厚，强调专一，除了爱人就不会看别的人。而句子强调幸福不易得到，人到了每个阶段都有新的经历，幸福重在过程，意思不一致，引用不恰当，当选；\nA项，“忽如一夜春风来，千树万树梨花开”意思是就好像一夜吹风，千树万树、漫山遍野的梨花竞相开放，强调好事来的很突然，速度快，范围大，句子强调互联网发展迅速，符合句义，引用恰当，排除；\nB项，“大珠小珠落玉盘”意思是就像大珠小珠一串串掉落玉盘，有高低错落之意，符合句义，引用恰当，排除；\nD项，“出淤泥而不染”意思是生长在淤泥中，而不被污泥所污染，强调处于污浊环境保持纯洁品格，对应“在复杂多变······清醒的头脑”，符合句义，引用恰当，排除。\n本题为选非题，故正确答案为C。","no":57,"missingImage":false},{"qid":"2731015","cat":"语句表达","stem":"下列选项中，关联词语使用不恰当的一项是：","options":{"A":"医生说如果皮肤粗糙到摸起来像洗碗布那样有沙沙的感觉，就不止是心肺的问题而已，而是内分泌失调、五脏六腑气血循环不良等诸多因素的影响。","B":"你的作品与其说是批判社会，不如说是最直接地表达一种生存状态。说得书卷气一些，叫人生探索。","C":"一个理论家宁可要一个美的方程，也不要一个丑的但结果与实验数据更相近的方程。","D":"量子卫星之所以能保障通信安全可靠，是因为量子卫星让信息传递者和接收者交换令信息无法被破解的量子密钥，而这个密钥是利用量子的奇异特性实现的，它就是“量子纠缠”。"},"answer":"A","explanation":"A项，“不止······而是······”关联词使用不当，应该改为“不止······还有······”，当选；\nB项“与其说······不如说······”、C项“宁可······也不”“但······”、D项“之所以······是因为······”关联词均使用恰当，排除。\n本题为选非题，故正确答案为A。","no":58,"missingImage":false},{"qid":"2731017","cat":"片段阅读","stem":"淮河上游，在距今8000多年前的贾湖遗址的一些红烧土块内发现了保存很好的稻壳印痕，经过鉴定，这些水稻属于人工栽培而非野生；淮河中下游地区，距今8000余年前的顺山集遗址、距今7000多年前的双墩遗址、距今6000多年前的龙虬庄遗址和距今5000年前的尉迟寺遗址等，都出土了人工培育的水稻。\n这一语段说明了：","options":{"A":"淮河流域最晚在新石器中期便已开始种植人工培育的水稻","B":"考古发现淮河上游的历史早于淮河中下游","C":"淮河流域比长江流域更适合种植水稻","D":"考古证明，野生水稻并不存在"},"answer":"A","explanation":"文段首先介绍了淮河上游发现了距今8000多年前人工栽培的稻壳印痕，接着指出淮河中下游地区多个遗址也出土了人工培育的水稻，故文段为并列结构，均在介绍淮河流域历史上存在人工培育的水稻的事实，对应A项。\nB项，缺少主题词“人工培育的水稻”，排除；\nC项，文段未把“淮河流域”与“长江流域”进行对比，属于无关对比，排除；\nD项，文段主要论述的是“人工培育的水稻”，而非“野生水稻”，主题词错误，排除。\n故正确答案为A。\n【文段出处】《先秦淮河文明的历史地位》","no":59,"missingImage":false},{"qid":"2731018","cat":"片段阅读","stem":"地缘是从商业里发展出来的社会关系。血缘是身份社会的基础，而地缘却是契约社会的基础。契约是指陌生人中所作的约定。在订定契约时，各人有选择的自由，在契约进行中，一方面有信用，一方面有法律。法律需要一个同意的权力去支持。契约的完成是权利义务的清算，须要精密的计算、确当的单位、可靠的媒介。\n提取语段的关键词，以下选项最恰当的是：","options":{"A":"地缘 血缘","B":"地缘 契约","C":"契约 法律","D":"身份 契约"},"answer":"B","explanation":"文段开篇引出“地缘是从商业里发展出来的社会关系”，对比了“血缘是身份社会的基础”强调“地缘是契约社会的基础”。后围绕“契约”进行讨论，指出在契约进行中需要“信用”和“法律”两方面。因此本文强调的主题应是“地缘”和“契约”，对应B项。\nA项“血缘”、D项“身份”均对应“血缘是身份社会的基础”，非文段重点内容，排除。\nC项，“法律”与“信用”均是契约在进行中的两个方面，是并列关系，因此“法律”表述片面，排除。\n故正确答案为B。\n【文段出处】《乡土中国》","no":60,"missingImage":false},{"qid":"2731019","cat":"逻辑填空","stem":"我们的流行语正在变得越来越“一锤定音”：带节奏、打工人、工具人······每当有新的社会议题出现，我们不自觉地、急匆匆地用这些词语来表达立场，划分你我。原本极具复杂性的、值得细细探讨的问题，被简化成一两个词轻轻抛出，思辨不复存在。\n上句中的“一锤定音”，其感情色彩是            。","options":{"A":"褒词褒用","B":"褒词贬用","C":"贬词贬用","D":"贬词褒用"},"answer":"B","explanation":"横线处需判断“一锤定音”的感情色彩，“：”引导解释说明，根据后文“带节奏”“工具人”“急匆匆地”“划分你我”“原本极具复杂性的问题被简化”“思辨不复存在”可知，作者对于流行语的态度是消极的，即“一锤定音”在文段中应为贬义用法，对比选项可排除A、D两项。\n“一锤定音”指凭一句话作出最后决定，比喻做事干脆，说话算数，语义偏积极，故此处双引号起到形象化表达的作用，感情色彩发生转变，B项“褒词贬用”当选，而C项“贬词贬用”与此处双引号的作用相悖，排除。\n故正确答案为B。","no":61,"missingImage":false},{"qid":"2731020","cat":"语句表达","stem":"我们常说，群众的眼睛是雪亮的，其实包含两层意思：一层是，工作做得如何、问题改得如何，群众有切身体验，往往再清楚不过；另一层则是，问题的症结出现在哪里，有怎样的改进办法，群众也往往看得很清楚。从前者来看，在工作中引入群众监督，让群众来“鉴定”整改落实成效，能让工作更好对接群众需求；就后者而言，                    。\n填入横线处最恰当的一项是：","options":{"A":"群众监督应覆盖工作全过程，让结果更加服众","B":"群众监督的过程也是一个集思广益的过程，能推动问题更好地得到解决","C":"工作中多倾听群众意见、多了解群众期待、多汲取群众智慧，并将之体现到整改方案中","D":"群众的意见建议比领导的更有针对性和可操作性"},"answer":"B","explanation":"横线出现在文段结尾，根据前文可知，文段通过两个并列结构对“群众的眼睛是雪亮的”进行解释，包含两层意思，根据横线前“就后者而言”可知，横线处对应第二层意思，即“问题的症结出现在哪里，有怎样的改进办法，群众也往往看得很清楚”，强调群众可以帮助解决问题，B项“能推动问题更好地得到解决”能体现群众帮助解决问题，当选。\nA项，与群众帮忙解决问题无关，排除；\nC项，“工作中多倾听群众意见、多了解群众期待、多汲取群众智慧”即体现出要在工作中引入群众监督，对应前文的第一层意思，但横线处应对应第二层意思，排除；\nD项，文段并未对群众和领导的意见建议进行对比，故无中生有，排除。\n故正确答案为B。\n【文段出处】《以实际成效取信于民》","no":62,"missingImage":false},{"qid":"2731021","cat":"片段阅读","stem":"所有的谣言基本上都具有一个二元的信息结构和表达结构，即作为形式的表层信息和作为实质的深层信息。表层信息的特点是“来源神秘、内容夸张、高度模糊”，谣言的失实和荒谬基本都出现在这个部分。但这只是为了传播而采取的形式。谣言之所以能够广泛传播，不仅在于形式，更在于其传达的实质，即背后的深层次社会问题和所反映的社会焦虑。\n根据上面文字的意思，谣言“快餐店的鸡有四只翅膀”传递的深层信息是                    。","options":{"A":"大众的科学素养有待提高","B":"生物技术有所突破","C":"某种基因已产生变异","D":"食物安全可能存在问题"},"answer":"D","explanation":"文段开篇介绍谣言的特点，即具有表层信息和深层信息，紧接着指出谣言的失实和荒谬来源于表层信息，后文通过转折词“但”指出谣言广泛传播的真实原因，是背后的深层次的社会问题和所反映的社会焦虑，即谣言的背后确有深层次问题存在。故“快餐店的鸡有四只翅膀”传递的深层信息对应文段尾句，即快餐店存在食品问题，对应D项。\nA项，“快餐店的鸡有四只翅膀”属于有关食品方面的谣言，其传递的信息的实质应为食品本身，大众的科学素养非此谣言的实质，排除；\nB项“生物技术有所突破”、C项“某种基因已产生变异”均属于无中生有，排除。\n故正确答案为D。\n【文段出处】《穿云破雾，提高对信息认知能力》","no":63,"missingImage":false},{"qid":"2731022","cat":"逻辑填空","stem":"除印文“大刘记印”四字之外，该印的尺寸也值得关注。从尺寸上看，长、宽各1.7厘米，约合汉尺七分四。湖南长沙收缴品“长沙王印”与之最接近，长1.65厘米、宽1.6厘米，约合汉尺七分。陕西咸阳征集品“皇后之玺”长、宽各2.8厘米，约合汉尺一寸二分，即《续汉书志·祭祀志》所谓“方十二分”。诸侯王玺长、宽各2.3厘米，约合汉尺一寸，即《汉书·严助传》所说的“方寸之印”。“大刘记印”和“长沙王印”的尺寸接近，加之两印的主人都是上层贵族。可见，西汉私人用印应该是            见方的规制。\n填入横线处最恰当的一项是：","options":{"A":"七分","B":"八分","C":"一寸","D":"一寸二分"},"answer":"A","explanation":"横线位于文段结尾，且横线所在句由结论词“可见”引导，故文段尾句是对前文的总结。前文首先指出“大刘记印”的尺寸为汉尺七分四，而后论述与之最接近的“长沙王印”约为汉尺七分，之后引出尺寸为一寸二分的“皇后之玺”和尺寸为一寸的“诸侯王玺”与前文两种印进行对比，最后通过“可见”总结私人用印的规制，私人用印对应前文“大刘记印”和“长沙王印”，即“七分四”和“七分”，与A项“七分”最为接近，当选。B项“八分”、C项“一寸”、D项“一寸二分”均与文意不符，排除。\n故正确答案为A。","no":64,"missingImage":false},{"qid":"2731023","cat":"片段阅读","stem":"网络世界在这个不同寻常的春节假期变得异常活跃。一场突如其来的疫情，让不少人被迫待在家中，通过上网来打发时间。可是，虽然此前不少年轻人都将“宅”生活视为理想状态，但是当“微博刷到脑壳痛”“追剧追到无聊”之后，人们才发现：这样的“宅”生活并非那么充实和舒适。与此同时，关于空虚、无聊的感慨也不绝于耳。网络互动，能否真正缓解人们的孤独？通过网络，我们似乎是联系在一起的，但实际上又活在自己的“气泡”之中，陷入了一种全新的孤独状态：对人际关系的焦虑、线上线下身份转换的模糊、新的时空紧张感，等等。\n这一文段意在说明：","options":{"A":"网络世界在这个春节假期变得异常活跃","B":"网络“宅”生活并非那么充实和舒适","C":"网络互动不能真正缓解人们的孤独","D":"在网络中，我们陷入了一种全新的孤独状态"},"answer":"C","explanation":"文段开篇引出话题，即网络世界在春节期间异常活跃，接着指出疫情让大家被迫待在家里，保持“宅”的状态，再通过转折关联词“但”指出宅的生活状态不充实且空虚、无聊，最后进行发问，“网络互动，能否真正缓解人们的孤独？”尾句对这一问题进行回答，网络把我们联系在一起的同时，会让我们陷入一种全新的孤独状态，也就是说网络互动不能真正缓解人们的孤独，对应C项。此外，文段围绕“网络互动”这一话题进行发问和回答，从主题词角度看，也可对应到C项。\nA项，“网络世界在这个春节假期变得异常活跃”，对应文段开篇的背景，并非文段重点，排除；\nB项，“网络的宅生活并非那么充实和舒适”，对应发问之前，非重点，且表述片面，文段“与此同时”后还阐述了“空虚、无聊的感慨”，排除；\nD项，对应回答问题部分解释说明的内容，非重点，排除。\n故正确答案为C。\n【文段出处】《网络互动能否缓解人们的孤独》","no":65,"missingImage":false}]}],"count":25,"answerable":25,"pointsOf":24},{"label":"数量关系","items":[{"type":"material","material":"\u003cp>        上海市生活垃圾分类工作实施以来，在居民分类、垃圾分类处置、全过程分类体系、配套制度规范以及社会宣传等方面都取得了显著成效。下图为上海市垃圾分类年度日均完成量及2020年目标，下表为上海市垃圾分类回收处理量。\u003c/p>\u003cp>\u003cimg data-k=\"974097abba9a\" style=\"max-width:700px\">\u003c/p>\u003cp>\u003cimg data-k=\"df1ffe743160\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"2731481","cat":"数学运算","stem":"表中，在日均湿垃圾分出量最高的月份，日均可回收物回收量与日均干垃圾处理量的比值约为：","options":{"A":"0.26","B":"0.44","C":"0.41","D":"0.48"},"answer":"C","explanation":"根据题干“表中，······与······比值约为”，可判定本题为比值计算问题。定位表格第二列可知，日均湿垃圾分出量最高的月份是2020年5月，分出量为9796吨/日，定位表格第三、四列可知，2020年5月日均可回收物回收量和日均干垃圾处理量分别为6266吨/日和15351吨/日。可得2020年5月，日均可回收物回收量与日均干垃圾处理量的比值约为\u003cimg data-k=\"1020d2c461df\">，对应C项。\n故正确答案为C。","no":66,"missingImage":false},{"qid":"2731516","cat":"数学运算","stem":"2019年7—9月，日均湿垃圾分出量约为（    ）吨。","options":{"A":"8803","B":"8702","C":"9200","D":"8800"},"answer":"D","explanation":"根据题干“2019年7—9月，日均湿垃圾分出量约······”，结合材料已给出2019年7—9月数据，可判定本题为现期平均数问题。定位表格材料，2019年7—9月日均湿垃圾分出量分别为8200吨/日、9200吨/日、9008吨/日。根据公式，日均湿垃圾分出量\u003cimg data-k=\"09ecbd19013c\">，可得2019年7—9月，日均湿垃圾分出量\u003cimg data-k=\"842be7dfb73e\">\u003cimg data-k=\"96215262943a\
