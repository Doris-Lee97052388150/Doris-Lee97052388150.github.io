<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2023年河南省公务员录用考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2023-河南","title":"2023年河南省公务员录用考试《行测》题（网友回忆版）","year":"2023","group":"河南","modules":[{"label":"政治理论","items":[{"type":"question","qid":"5509464","cat":"时事政治","stem":"党的二十大报告指出，全面建设社会主义现代化国家，必须有一支政治过硬、适应新时代要求、具备领导现代化建设能力的干部队伍。下列与之相关的说法正确的有几项？\n①加强实践锻炼、专业训练，注重在重大斗争中磨砺干部，增强干部推动高质量发展本领、服务群众本领、防范化解风险本领\n②坚持党管干部原则，坚持德才兼备、以德为先、五湖四海、任人唯贤，把新时代好干部标准落到实处\n③树立选人用人正确导向，选拔忠诚干净担当的高素质专业化干部，选优配强各级领导班子\n④坚持把政治标准放在首位，做深做实干部政治素质考察，突出把好政治关、廉洁关","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"D","explanation":"本题考查政治常识。\n党的二十大报告中“十五、坚定不移全面从严治党，深入推进新时代党的建设新的伟大工程”部分的“（四）建设堪当民族复兴重任的高素质干部队伍”指出：“······坚持党管干部原则，坚持德才兼备、以德为先、五湖四海、任人唯贤，把新时代好干部标准落到实处。树立选人用人正确导向，选拔忠诚干净担当的高素质专业化干部，选优配强各级领导班子。坚持把政治标准放在首位，做深做实干部政治素质考察，突出把好政治关、廉洁关。加强实践锻炼、专业训练，注重在重大斗争中磨砺干部，增强干部推动高质量发展本领、服务群众本领、防范化解风险本领······”\n综上所述，与之相关的说法正确的有①②③④，共4项。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"5509848","cat":"新思想","stem":"下列习近平总书记讲话内容与所涉及的省区对应正确的有几项：\n①盐湖资源是全国的战略性资源——青海\n②让黄花成为乡亲们的“致富花”——山西\n③奋力谱写雪域高原长治久安和高质量发展新篇章——西藏\n④从黄浦江畔搬到渭水之滨，你们打起背包就出发，舍小家顾大家——陕西","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"D","explanation":"本题考查政治常识。\n①正确，2016年8月，习近平总书记在青海考察时指出：“盐湖资源是青海的第一大资源，也是全国的战略性资源，务必处理好资源开发利用和生态环境保护的关系。发展循环经济是提高资源利用效率的必由之路，要牢固树立绿色发展理念，积极推动区内相关产业流程、技术、工艺创新，努力做到低消耗、低排放、高效益，让盐湖这一宝贵资源永续造福人民。”\n②正确，2020年5月11日，习近平总书记视察山西省大同市云州区有机黄花标准化种植基地时，嘱托当地百姓：“希望把黄花产业保护好、发展好，做成大产业，做成全国知名品牌，让黄花成为乡亲们的‘致富花’。”\n③正确，2021年7月，西藏和平解放70周年之际，习近平总书记来到雪域高原。在西藏考察期间，习近平总书记强调，要全面贯彻新时代党的治藏方略，坚持稳中求进工作总基调，立足新发展阶段，完整、准确、全面贯彻新发展理念，服务和融入新发展格局，推动高质量发展，加强边境地区建设，抓好稳定、发展、生态、强边四件大事，在推动青藏高原生态保护和可持续发展上不断取得新成就，奋力谱写雪域高原长治久安和高质量发展新篇章。\n④正确，2020年4月22日，在陕西考察的习近平总书记走进交大西迁博物馆，亲切会见14位西迁老教授。习近平总书记谈起老教授们两年前给他写的一封来信，“看了你们的信我非常感动，产生了强烈共鸣”。习近平总书记说：“从黄浦江畔搬到渭水之滨，你们打起背包就出发，舍小家顾大家。交大西迁对整个国家和民族来讲、对西部发展战略布局来讲，意义都十分重大。”\n综上所述，对应正确的有①②③④，共4项。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"5509458","cat":"时事政治","stem":"党的二十大报告指出，全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。下列事例体现了全过程人民民主的有几项？\n①某地人代会开会前，群众代表通过初审政府预算草案，提出修改意见，监督管好政府“钱袋子”，使公共资金使用更好反映人民意愿\n②某地居委会和社区一同组织居民讨论社区公共服务资金的分配使用规划，居民通过各种创新的基层协商民主方式，让财政决策更接地气\n③某直播平台开展了“最美建筑摄影”网络投票活动，众多摄影爱好者纷纷拍摄并投稿，网友们通过公平公正公开的方式评选出“最高人气奖”\n④某政府网络平台开辟了“领导留言板”栏目，群众可直接给政府主要负责同志留言，提出意见和诉求","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","explanation":"本题考查政治常识。\n①正确，党的二十大报告指出：“协商民主是实践全过程人民民主的重要形式。完善协商民主体系，统筹推进政党协商、人大协商、政府协商、政协协商、人民团体协商、基层协商以及社会组织协商，健全各种制度化协商平台，推进协商民主广泛多层制度化发展。”群众代表通过初审政府预算草案是协商民主的一种，体现了全过程人民民主。\n②正确，党的二十大报告指出：“基层民主是全过程人民民主的重要体现。健全基层党组织领导的基层群众自治机制，加强基层组织建设，完善基层直接民主制度体系和工作体系，增强城乡社区群众自我管理、自我服务、自我教育、自我监督的实效。”某地居委会和社区一同组织居民讨论社区公共服务资金的分配使用规划，属于基层民主，体现了全过程人民民主。\n③错误，某直播平台开展的网络投票活动属于平台自行开展的民间活动，与全过程人民民主无关。\n④正确，党的二十大报告指出：“发展全过程人民民主，保障人民当家作主。我们要健全人民当家作主制度体系，扩大人民有序政治参与，保证人民依法实行民主选举、民主协商、民主决策、民主管理、民主监督，发挥人民群众积极性、主动性、创造性，巩固和发展生动活泼、安定团结的政治局面。”某政府网络平台开辟了“领导留言板”栏目，属于民主监督，体现了全过程人民民主。\n综上所述，体现了全过程人民民主的有①②④，共3项。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"5509775","cat":"时事政治","stem":"党的二十大报告指出，实现碳达峰碳中和是一场广泛而深刻的经济社会系统性变革，下列关于实现碳达峰碳中和的说法错误的是：","options":{"A":"完善碳排放统计核算制度，健全碳排放权市场交易制度","B":"立足我国能源资源禀赋，坚持先破后立，有计划分步骤实施碳达峰行动","C":"推动能源清洁低碳高效利用，推进工业、建筑、交通等领域清洁低碳转型","D":"完善能源消耗总量和强度调控，重点控制化石能源消费，逐步转向碳排放总量和强度“双控”制度"},"answer":"B","explanation":"本题考查政治常识。\nA、C、D三项正确，B项错误，二十大报告指出：“积极稳妥推进碳达峰碳中和。实现碳达峰碳中和是一场广泛而深刻的经济社会系统性变革。立足我国能源资源禀赋，坚持先立后破，有计划分步骤实施碳达峰行动。完善能源消耗总量和强度调控，重点控制化石能源消费，逐步转向碳排放总量和强度‘双控’制度。推动能源清洁低碳高效利用，推进工业、建筑、交通等领域清洁低碳转型。深入推进能源革命，加强煤炭清洁高效利用，加大油气资源勘探开发和增储上产力度，加快规划建设新型能源体系，统筹水电开发和生态保护，积极安全有序发展核电，加强能源产供储销体系建设，确保能源安全。完善碳排放统计核算制度，健全碳排放权市场交易制度。提升生态系统碳汇能力。积极参与应对气候变化全球治理。”\n本题为选非题，故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"5509469","cat":"新思想","stem":"党的十八大以来，以习近平同志为核心的党中央不断推进人民代表大会制度理论创新和实践创新，主要体现在“六个方面”。下列不属于这“六个方面”内容的是：","options":{"A":"必须坚持全面依法治国，必须坚持民主集中制","B":"必须坚持全面从严治党，必须坚持进一步推进政治体制改革","C":"必须坚持中国共产党领导，必须坚持用制度体系保障人民当家作主","D":"必须坚持中国特色社会主义政治发展道路，必须坚持推进国家治理体系和治理能力现代化"},"answer":"B","explanation":"本题考查政治常识。\nA、C、D三项正确，B项错误，2021年10月，中央人大工作会议在北京召开，习近平同志发表重要讲话时强调，党的十八大以来，党中央统筹中华民族伟大复兴战略全局和世界百年未有之大变局，从坚持和完善党的领导、巩固中国特色社会主义制度的战略全局出发，继续推进人民代表大会制度理论和实践创新，提出一系列新理念新思想新要求，强调必须坚持中国共产党领导，必须坚持用制度体系保障人民当家作主，必须坚持全面依法治国，必须坚持民主集中制，必须坚持中国特色社会主义政治发展道路，必须坚持推进国家治理体系和治理能力现代化。\n本题为选非题，故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"5509473","cat":"时事政治","stem":"为在新发展阶段持续深入推进依法行政，全面建设法治政府，中共中央、国务院印发了《法治政府建设实施纲要（2021—2025年）》。下列属于《法治政府建设实施纲要（2021—2025年）》内容的有几项？\n①深入学习贯彻习近平法治思想，努力实现法治政府建设全面突破\n②健全依法行政制度体系，加快推进政府治理规范化程序化法治化\n③健全社会矛盾纠纷行政预防调处化解体系，不断促进社会公平正义\n④推进公正司法，各级党政机关支持法院、检察院独立公正行使职权\n⑤将“实行依法治国，建设社会主义法治国家”写入宪法，法治建设揭开新篇章","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"B","explanation":"本题考查政治常识。\n2021年8月，中共中央、国务院印发了《法治政府建设实施纲要（2021—2025年）》（下文简称《纲要》），并发出通知，要求各地区各部门结合实际认真贯彻落实。\n①项正确，《纲要》指出：“一、深入学习贯彻习近平法治思想，努力实现法治政府建设全面突破。党的十八大以来，特别是《法治政府建设实施纲要（2015－2020年）》贯彻落实5年来，各地区各部门多措并举、改革创新，法治政府建设取得重大进展。”\n②项正确，《纲要》指出：“三、健全依法行政制度体系，加快推进政府治理规范化程序化法治化。坚持科学立法、民主立法、依法立法，着力实现政府立法质量和效率并重并进，增强针对性、及时性、系统性、可操作性，努力使政府治理各方面制度更加健全、更加完善。”\n③项正确，《纲要》指出：“七、健全社会矛盾纠纷行政预防调处化解体系，不断促进社会公平正义。坚持将矛盾纠纷化解在萌芽状态、化解在基层，着力实现人民群众权益受到公平对待、尊严获得应有尊重，推动完善信访、调解、仲裁、行政裁决、行政复议、诉讼等社会矛盾纠纷多元预防调处化解综合机制。”\n④项错误，《纲要》指出：“七、健全社会矛盾纠纷行政预防调处化解体系，不断促进社会公平正义······支持法院依法受理和审理行政案件，切实履行生效裁判。支持检察院开展行政诉讼监督工作和行政公益诉讼，积极主动履行职责或者纠正违法行为。”《纲要》原文中没有提及“推进公正司法，各级党政机关支持法院、检察院独立公正行使职权”。\n⑤项错误，1999年3月，九届全国人大二次会议将“依法治国，建设社会主义法治国家”载入宪法。这是社会主义民主政治发展的重要成果，标志着我国社会主义民主法制建设进入一个新阶段。《纲要》原文中没有提及。\n综上所述，属于《纲要》内容的有①②③，共3项。\n故正确答案为B。","no":6,"missingImage":false},{"type":"question","qid":"5509479","cat":"时事政治","stem":"下列属于我国2022年《政府工作报告》民生保障清单的有几项？\n①深化网络生态治理，促进基层文化设施布局优化和资源共享\n②坚持房子是用来住的、不是用来炒的定位，加快发展长租房市场\n③完善跨省异地就医直接结算办法，使群众就近得到更好医疗服务\n④将2岁以下婴幼儿照护费用纳入个人所得税专项附加扣除，减轻家庭养育负担","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","explanation":"本题考查政治常识。\n①正确，2022年政府工作报告中“三、2022年政府工作任务”中的“（九）切实保障和改善民生，加强和创新社会治理”部分指出：“丰富人民群众精神文化生活······加强和创新互联网内容建设，深化网络生态治理。推进公共文化数字化建设，促进基层文化设施布局优化和资源共享，扩大优质文化产品和服务供给，支持文化产业发展。”\n②正确，2022年政府工作报告中“三、2022年政府工作任务”中的“（九）切实保障和改善民生，加强和创新社会治理”部分指出：“继续保障好群众住房需求。坚持房子是用来住的、不是用来炒的定位，探索新的发展模式，坚持租购并举，加快发展长租房市场，推进保障性住房建设，支持商品房市场更好满足购房者的合理住房需求，稳地价、稳房价、稳预期，因城施策促进房地产业良性循环和健康发展。”\n③正确，2022年政府工作报告中“三、2022年政府工作任务”中的“（九）切实保障和改善民生，加强和创新社会治理”部分指出：“完善跨省异地就医直接结算办法，实现全国医保用药范围基本统一······持续推进分级诊疗和优化就医秩序，加快建设国家、省级区域医疗中心，推动优质医疗资源向市县延伸，提升基层防病治病能力，使群众就近得到更好医疗卫生服务。”\n④错误，2022年政府工作报告中“三、2022年政府工作任务”中的“（九）切实保障和改善民生，加强和创新社会治理”部分指出：“完善三孩生育政策配套措施，将3岁以下婴幼儿照护费用纳入个人所得税专项附加扣除，多渠道发展普惠托育服务，减轻家庭生育、养育、教育负担。”故纳入个人所得税专项附加扣除的是“3岁以下婴幼儿照护费用”。\n综上所述，属于我国2022年《政府工作报告》民生保障清单的有①②③，共3项。\n故正确答案为C。","no":7,"missingImage":false}],"count":7,"answerable":7,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"5509833","cat":"经济常识","stem":"2022年8月31日至9月5日，中国国际服务贸易交易会（简称“服贸会”）在国家会议中心和首钢园区举办。下列与服贸会相关的说法正确的有几项？\n①服贸会已成为我国对外开放三大展会平台之一\n②2022年服贸会的主题为“服务合作促发展，绿色创新迎未来”\n③服贸会是全球唯一一个国家级、国际性、综合型的服务贸易平台\n④2022年服贸会吉祥物“福燕”预示服务贸易发展造福世界，寓意邀请境内外客商共赴服务贸易盛宴","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"D","explanation":"本题考查政治常识。\n①正确，自成立以来，服贸会不断发展壮大，与广交会、进博会一起，构成我国对外开放的三大展会平台。在货物贸易领域，上海的进博会侧重于进口，广州的广交会侧重于出口，北京的服贸会则聚焦服务贸易，三者相辅相成，共同构成新时期“中国制造”和“中国服务”全面发展的展会促进平台，推动形成以“北、上、广”为龙头的全国会展新格局。\n②正确，2022年中国国际服务贸易交易会于8月31日至9月5日在北京举行，主题为“服务合作促发展，绿色创新迎未来”，由商务部和北京市人民政府共同主办。\n③正确，服贸会是全球唯一一个国家级、国际性、综合型的服务贸易平台。由商务部和北京市人民政府共同举办，世贸组织、联合国贸发会议、经合组织等国际组织共同支持，是全球唯一涵盖服务贸易12大领域的综合型服务贸易交易会。\n④正确，2022年服贸会吉祥物命名为“福燕（FuYan）”，预示服务贸易发展造福世界，体现“全球服务 互惠共享”，谐音“赴宴”“服宴”，寓意邀请境内外客商共赴服务贸易盛宴。\n综上，说法正确的有①②③④，共4项。\n故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"5509831","cat":"科技常识","stem":"北京2022年冬残奥会闭幕式融入了天干地支元素，下列关于天干地支的说法正确的是：","options":{"A":"天干和地支的数目相同","B":"生肖与地支可以一一对应","C":"黄道十二宫以天干命名","D":"干支纪年周期为12周年"},"answer":"B","explanation":"本题考查人文常识。\nA项错误，天干地支，简称为干支，源自中国远古时代对天象的观测，有十天干和十二地支。\nB项正确，十二生肖和十二地支能够一一对应，为子鼠、丑牛、寅虎、卯兔、辰龙、巳蛇、午马、未羊、申猴、酉鸡、戌狗、亥猪。\nC项错误，黄道十二宫的宫名是借用附近的星座名字，即白羊宫、金牛宫、双子宫、巨蟹宫、狮子宫、室女宫、天秤宫、天蝎宫、人马宫、摩羯宫、宝瓶宫和双鱼宫。\nD项错误，干支是天干和地支的总称，十天干和十二地支依次相配，组成六十个基本单位，干支纪年周期为60周年。\n故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"5509480","cat":"人文常识","stem":"下列关于革命遗址及革命纪念建筑物的说法错误的是：","options":{"A":"广州农民运动讲习所旧址——毛泽东曾在此担任农民运动讲习所所长","B":"秋收起义文家市会师旧址——红军在此确立了“十六字诀”游击战术","C":"北京大学红楼——李大钊曾在此传播马克思主义和民主科学进步思想","D":"八路军总司令部旧址——彭德怀等人在此直接布置和指挥了百团大战"},"answer":"B","explanation":"本题考查毛中特。\nA项正确，广州农民运动讲习所是第一次国共合作时期培养农民运动干部的学校，1924年7月至1926年9月举办过六届，培养了800多名学员，为中国革命输送了大批干部。第六届农民运动讲习所由毛泽东担任所长。\nB项错误，1929年4月5日，毛泽东在《红军第四军前委给中共中央的信》中，将红军游击战争的作战原则，正式概括为“敌进我退，敌驻我扰，敌疲我打，敌退我追”。而秋收起义是1927年9月9日，由毛泽东在湖南东部和江西西部领导的工农革命军（即红军）举行的一次武装起义。\nC项正确，1918年初，李大钊在北京大学红楼创建了马克思主义研究小组，蔡元培时任北京大学校长。\nD项正确，武乡八路军总司令部旧址，是抗日战争期间八路军总部所在地，位于山西省长治市武乡县，由武乡县王家峪旧址和砖壁旧址组成。1961年，国务院将王家峪八路军总部旧址和砖壁八路军总部旧址列为全国第一批重点文物保护单位。彭德怀等人在此直接布置和指挥了百团大战。\n本题为选非题，故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"5509767","cat":"人文常识","stem":"成语作为中国传统文化的一大特色，很多都来源于历史生活，下列成语、主要人物及时期对应正确的是：","options":{"A":"窃符救赵——魏无忌——春秋","B":"封狼居胥——卫青——汉朝","C":"东床坦腹——王羲之——东晋","D":"目不窥园——范仲淹——宋朝"},"answer":"C","explanation":"本题考查人文常识。\nA项错误，战国时期，秦国围困赵国都城邯郸，赵国求救于魏国，魏国惧怕秦国，不敢出兵救赵。情急之下，信陵君魏无忌听取侯赢之计，以国家利益为重，置生死度外，借魏王姬妾如姬之手窃得兵符，夺取了魏国兵权，不仅成功击败秦军、救援了赵国，也巩固了魏国在当时的地位。窃符救赵的主人公为战国时期的魏无忌，而非春秋时期。\nB项错误，封狼居胥，指西汉大将霍去病登狼居胥山筑坛祭天以告成功之事，出自于《汉书·霍去病传》，后来封狼居胥成为中华民族武将的最高荣誉之一。封狼居胥的主人公为霍去病，而非卫青。\nC项正确，东床坦腹，指东晋王羲之，面临高官选女婿时，在东边的床上露出肚皮看书，被高官看中，高官将女儿许配给了王羲之。\nD项错误，目不窥园，指西汉董仲舒读书非常刻苦认真，他的书房紧靠着姹紫嫣红的花园，他三年没有进过花园，无暇观赏花园中的景致。目不窥园的主人公为西汉董仲舒，而非宋朝范仲淹。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"5509470","cat":"经济常识","stem":"宋朝是我国历史上商品经济、文化教育、科学创新高度繁荣的时代。下列选项中描述的景象，可能出现在宋朝的有几项？\n①社会出现严重通货膨胀\n②百姓用煤炭作燃料取暖做饭\n③农民使用水力翻车进行田间灌溉\n④士兵用火药制成的“震天雷”击退敌人","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"D","explanation":"本题考查人文常识。\n①正确，在宋朝初期，是以铜钱作为流通货币，而作为金属货币的铜钱带来的最大问题就是货币数量不足。在宋朝官府设立官方纸币发行机构以及制定相应的货币政策之后，开始大肆发行纸币，使货币的数量超出了正常的市场需求量，纸币由此贬值，物价持续普遍上涨，就出现了通货膨胀。“社会出现严重通货膨胀”在宋朝有可能出现。\n②正确，早在距今3500年前后，中国人就发现了煤炭，并且已经开采和利用。煤炭被大量用于生产和生活的记载是在汉代。当时还不叫煤炭，而是称作湮石、石涅、黑丹等。汉书有记载，“豫章出石，可燃为薪”。除了炼铁、烧饭，南北朝时期，还有记载表明，当时的人用煤炭来取暖。“百姓用煤炭作燃料取暖做饭”在宋朝有可能出现。\n③正确，宋朝，人们对人力翻车加以改进，创造出畜力翻车和水转翻车。水转翻车与牛转翻车结构相似，只是在由牛来带动的卧齿轮轮轴的下端，安装一个水轮，置于水流湍急处，以水力转动翻车车水上岸。如果水势适当，则卧轮和水轮都可能省掉，把原来的立齿轮改制成可以受力的水轮，带动翻车轮轴转动提水。\n④正确，据史料记载，“震天雷”是出现在北宋末年的一种火药武器，在南宋和蒙元时期的战事中得到了广泛的应用。根据实际使用需要的不同，“震天雷”可以被制造成各种形状，也可以选择人力投掷，或者是用投石机来发射。“士兵用火药制成的‘震天雷’击退敌人”在宋朝有可能出现。\n综上所述，可能出现在宋朝的有①②③④，共4项。\n故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"5509483","cat":"人文常识","stem":"《论语》中提到，“行夏之时，乘殷之辂，服周之冕”。下列与之相关的说法错误的是：","options":{"A":"“夏之时”指的是著名历法《大衍历》","B":"“辂”指的是车子，“冕”指的是礼帽","C":"“乘殷之辂”与“殷鉴不远”涉及同一朝代","D":"《论语》是记录孔子及其弟子言行的语录文集"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，“夏之时”指夏朝的历法，即《夏小正》，是中国现存最早的一部记录农事的历书。该历书记载先秦中原农业发展水平，保存了古代中国的天文历法知识。《夏小正》撰者无考，一般认为成书时间为战国时期、两汉之间。而《大衍历》是唐开元十七年（公元729年）起施行二十九年的历法，是僧一行参考《九执历》而撰的。\nB项正确，“辂”是古代车辕上用来挽车的横木或古代的一种大车；“冕”是中国古代帝王及地位在大夫以上的官员们戴的礼帽。\nC项正确，“乘殷之辂”出自《论语·卫灵公篇》，翻译为乘坐殷商的车子，是指主张质朴，治国要重视民生、节俭；“殷鉴不远”出自于先秦《诗经·大雅·荡》，指殷人灭夏，殷的子孙应以夏的灭亡作为鉴戒，后泛指前人的教训就在眼前。两者都涉及到了商朝。\nD项正确，《论语》由孔子弟子及再传弟子编写而成，主要记录孔子及其弟子的言行，是儒家学派的经典著作之一。\n本题为选非题，故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"5509824","cat":"法律常识","stem":"2020年1月李某因意外事件下落不明，2022年3月李某的丈夫盛某向法院申请宣告李某死亡，法院于2022年4月10日作出判决。2022年8月，李某返回家中，发现盛某已与另一名女子杜某结婚，自己的女儿已被朋友艾某收养。下列与之相关的说法错误的是：","options":{"A":"艾某收养李某女儿的行为继续有效","B":"李某可以向法院申请撤销死亡宣告","C":"李某与盛某的婚姻关系不能自行恢复","D":"李某在2020年1月至2022年8月期间实施的民事法律行为无效"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国民法典》第五十二条规定：“被宣告死亡的人在被宣告死亡期间，其子女被他人依法收养的，在死亡宣告被撤销后，不得以未经本人同意为由主张收养行为无效。”\nB项正确，根据《中华人民共和国民法典》第五十条规定：“被宣告死亡的人重新出现，经本人或者利害关系人申请，人民法院应当撤销死亡宣告。”\nC项正确，根据《中华人民共和国民法典》第五十一条规定：“被宣告死亡的人的婚姻关系，自死亡宣告之日起消除。死亡宣告被撤销的，婚姻关系自撤销死亡宣告之日起自行恢复。但是，其配偶再婚或者向婚姻登记机关书面声明不愿意恢复的除外。”\nD项错误，根据《中华人民共和国民法典》第四十九条规定：“自然人被宣告死亡但是并未死亡的，不影响该自然人在被宣告死亡期间实施的民事法律行为的效力。”\n本题为选非题，故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"5509521","cat":"人文常识","stem":"在“工业的血液——石油文化展”上，最不可能出现的事物是：","options":{"A":"《梦溪笔谈》原文摘录","B":"“磕头机”的三维模型","C":"沥青的生产流程示意图","D":"湖南省油田增产的喜报"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，石油一词最早出现在北宋沈括的《梦溪笔谈》，书中记载“鄜延境内有石油，旧说‘高奴县出脂水’，即此也。”\nB项正确，“磕头机”专业名称叫抽油机，是开采石油的一种机器设备。目前油田中最常见的是游梁式抽油机，主要由驴头—游梁—连杆—曲柄机构、减速箱、动力设备和辅助装备四大部分组成。工作时，电动机的转动经变速箱、曲柄连杆机构变成驴头的上下运动，驴头经光杆、抽油杆带动井下抽油泵的柱塞作上下运动，从而不断地把井中的原油抽出井筒。这一过程好像在重复人类磕头的动作，因而俗称“磕头机”。\nC项正确，沥青主要可以分为天然沥青、焦油沥青和石油沥青三种。天然沥青是石油渗出地表经长期暴露和蒸发后的残留物；焦油沥青是煤、木材等有机物干馏加工所得的焦油经再加工后的产品；石油沥青是将精制加工石油所残余的渣油，经适当的工艺处理后得到的产品。\nD项错误，中国现在的油田主要分布在西北、甘肃、青海、陕西、新疆等地。湖南省到目前为止还没有发现可供大规模开采的油田。\n本题为选非题，故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"5509477","cat":"人文常识","stem":"下列中国历史上的“父子书法家”中生活年代最早的是：","options":{"A":"钟繇、钟会","B":"米芾、米友仁","C":"欧阳询、欧阳通","D":"王羲之、王献之"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，钟繇，汉末至三国曹魏时著名书法家、政治家，擅篆、隶、真、行、草多种书体，在书法方面颇有造诣，推动了楷书（小楷）的发展，被后世尊为“楷书鼻祖”。钟会，三国时期魏国军事家、书法家，太傅钟繇幼子、青州刺史钟毓之弟。\nB项错误，米芾，北宋书法家、画家、书画理论家，与蔡襄、苏轼、黄庭坚合称“宋四家”，他在书法上颇有造诣，擅篆、隶、楷、行、草等书体，长于临摹古人书法，达到乱真程度。米友仁，晚号懒拙老人，米芾长子，书法绘画皆承家学，故与父米芾并称“大小米”。\nC项错误，欧阳询，唐朝著名书法家，他的书法成就以楷书为最，笔力险峻，结构独异，后人称为“欧体”，与颜真卿、柳公权、赵孟頫合称为“楷书四大家”。欧阳通，唐代宰相、书法家，欧阳询之子，工于楷书，继承父法，笔锋险峻，父子合称“大小欧阳”。\nD项错误，王羲之，东晋书法家，有“书圣”之称，后官拜右军将军，人称“王右军”，代表作《兰亭序》被誉为“天下第一行书”。王献之，东晋书法家、诗人、画家，王羲之第七子，以行书及草书闻名，但是在楷书和隶书上亦有深厚功底，与其父王羲之并称为“二王”。\n故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"5509518","cat":"科技常识","stem":"关于生产生活中所蕴含的物理原理，下列说法正确的是：","options":{"A":"冬天使用空调取暖是利用了热辐射使室内空气变热","B":"汽车上坡时，往往会挂低速挡，目的是减小牵引力","C":"油罐车车尾挂的一根长铁链是为了避免因静电放电而引发爆炸","D":"自行车高速下坡时，紧急刹车会导致翻车，主要是因为刹车力太大"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，热对流又称对流传热，指流体中质点发生相对位移而引起的热量传递过程。空调的制热原理是通过热对流的方式，强制室内空气流动从而达到采暖的目的。热辐射是物体由于具有温度而辐射电磁波的现象。由于电磁波的传播无需任何媒质，所以热辐射是在真空中唯一的热传递方式。\nB项错误，汽车发动机功率是恒定的，根据公式：P（功率）=F（牵引力）×V（速度）可知，速度越低，牵引力越大。因此使用低速挡时汽车爬坡可以获得更大的牵引力，因此，汽车在爬山时必须使用低速档。\nC项正确，油罐在运输过程中，内部转载的油在长期的晃动之下，极易产生大量的静电电荷。当油罐中的静电电荷集聚形成的电场超过蒸气空间的极限场强，这时就会造成静电爆炸事故。铁链是为了防止静电而设置，它的学名叫静电导线或者避电杆。\nD项错误，自行车高速下坡时紧急刹车会导致翻车是因为前轮受到阻力而突然停止运动，但车上的人和后轮没有受到阻力，由于惯性，人和后轮要保持继续向前的运动状态，所以会发生翻车现象。\n故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"5509474","cat":"科技常识","stem":"关于微生物，下列说法错误的是：","options":{"A":"双歧杆菌是一种对人体有益的细菌","B":"感染幽门螺杆菌会导致急性肠胃炎","C":"食用未煮熟的鸡蛋可能感染沙门氏菌","D":"豆科植物根部的根瘤菌具有固氮作用"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，双歧杆菌是一种革兰氏阳性、不运动、细胞呈杆状、一端有时呈分叉状、严格厌氧的细菌属，是一种重要的肠道有益微生物。双歧杆菌作为一种生理性有益菌，对人体健康具有生物屏障、营养作用、抗肿瘤作用、免疫增强作用、改善胃肠道功能、抗衰老等多种重要的生理功能。\nB项错误，幽门螺杆菌是定植于胃内的一种细菌，幽门螺杆菌感染是慢性胃病的主要病因，与慢性胃炎、消化性溃疡、胃癌，以及胃黏膜相关组织淋巴瘤有着密切的关系。幽门螺杆菌喜欢胃内的酸性环境，不会定植于肠道。急性肠胃炎是指各种原因引起的胃肠黏膜的急性炎症，通常因进食不洁、生冷或刺激性食物而诱发，病因包括细菌、病毒、寄生虫感染等。\nC项正确，沙门氏菌是一种常见的食源性致病菌，在各种肉类、禽蛋、蔬菜、水果中都存在一定量的沙门氏菌；如果鸡蛋中携带沙门氏菌，未经加热而直接食用，或加热不完全，就有可能被沙门氏菌感染。\nD项正确，根瘤菌是能与豆科植物共生形成根瘤，并将空气中的氮还原成氨供植物营养的一类革兰氏阴性菌。在豆科植物的根瘤中，有能够固氮的根瘤菌与豆科植物共生，根瘤菌有固氮作用，能将空气中的氮转化为植物能吸收的含氮物质，而植物则为根瘤菌提供有机物。\n本题为选非题，故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"5509459","cat":"人文常识","stem":"某小区业主王某拟将其自住用房改为民宿用房，物业公司和业主委员会不同意，为此发生争执。下列与之相关的说法正确的是：","options":{"A":"小区业主未经国家有关机关审批，不得将自住用房改为民宿用房","B":"小区业主未经小区物业公司和业主委员会同意，不得将自住用房改为民宿用房","C":"小区业主未经有利害关系的其他业主一致同意，不得将自住用房改为民宿用房","D":"小区业主未经三分之二以上有利害关系的其他业主同意，不得将自住用房改为民宿用房"},"answer":"C","explanation":"本题考查法律常识。\nA、B、D三项错误，C项正确，根据《中华人民共和国民法典》 第二百七十九条规定：“业主不得违反法律、法规以及管理规约，将住宅改变为经营性用房。业主将住宅改变为经营性用房的，除遵守法律、法规以及管理规约外，应当经有利害关系的业主一致同意。”\n故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"5509524","cat":"人文常识","stem":"商品宣传时应科学准确，避免误导消费者。下列商品宣传较为科学的是：","options":{"A":"某品牌无糖月饼，没有甜味，属于无糖食品","B":"某品牌鱼肝油含有丰富的维生素D，有助于宝宝骨骼健康","C":"某品牌运动饮料含有多种无机盐，可以补充人体运动时所消耗的能量","D":"某品牌八宝粥由丰富的莲子、桂圆等制作而成，适合糖尿病患者食用"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，无糖食品国际通用的概念是，无糖食品不能加入蔗糖和来自淀粉水解物的糖，包括葡萄糖、麦芽糖、果糖、淀粉糖浆、葡萄糖浆、果葡糖浆等。但是，它必须含有相应于糖的替代物，一般采用糖醇或低聚糖等不升高血糖的能替代蔗糖的甜味剂品种。因此，无糖未必无甜味，无甜味也未必无糖。\nB项正确，鱼肝油含有丰富的维生素D，维生素D的主要功用是促进小肠粘膜细胞对钙和磷的吸收，进而促进宝宝钙盐的更新及新骨生成，此外维生素D还有促进皮肤细胞生长、分化及调节免疫功能作用。\nC项错误，无机盐俗称矿物质，可以维持身体内的电解质平衡、维持心脏的规律搏动等。但是无机盐无法补充人体运动时所消耗的能量，能补充人体消耗能量的三大营养物质是糖类、脂肪和蛋白质。\nD项错误，莲子含糖偏低，属于升糖指数偏低的食物，但是桂圆中含有葡萄糖、蔗糖等物质，不适合糖尿病人食用。此外，八宝粥中通常会加入较多糯米、粳米和红枣，也含有大量糖分，因此不适合糖尿病患者食用。\n故正确答案为B。","no":20,"missingImage":false}],"count":13,"answerable":13,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"5509437","cat":"逻辑填空","stem":"莽莽苍苍的大兴安岭过来了，巍峨的阴山也从遥远的草原腹地过来了。两座北方草原最著名的山脉，在这里            ，将大山的茂密与大山的险峻都给了克什克腾，给了这片茫茫的野草。\n填入画横线部分最恰当的一项是：","options":{"A":"不期而遇","B":"不约而同","C":"萍水相逢","D":"旧雨重逢"},"answer":"A","explanation":"根据文段“莽莽苍苍的大兴安岭过来了，巍峨的阴山也从遥远的草原腹地过来了”可知，横线处应体现两座山脉在这里“交会”之意，A项“不期而遇”指没有约定而遇见，符合文意，当选。\nB项“不约而同”指事先没有商量而彼此行动相同，侧重“意见一致”，与文意不符，且不能与“在这里”连用，排除；C项“萍水相逢”比喻素不相识之人偶然相遇，侧重“双方此前并无深交”，与文意不符，排除；D项“旧雨重逢”指老朋友又相遇了，文段并无“再次相遇”之意，排除。\n故正确答案为A。\n【文段出处】中国作家网《克什克腾，草原或天堂》","no":21,"missingImage":false},{"type":"question","qid":"5509435","cat":"逻辑填空","stem":"城市文化是一座城市的气质所在，也是城市发展的内在动力。近年来，一些城市的景观规划动辄“大开大合”，形成            的整体风格，或者移栽网红花木，打造网红街景，将城市文化灌入流量。这些功利的城市治理行为也许会带动一段时间的消费热涨，却让城市失去了原本的生活底色。\n填入画横线部分最恰当的一项是：","options":{"A":"照猫画虎","B":"老生常谈","C":"因循守旧","D":"千篇一律"},"answer":"D","explanation":"横线处所填成语搭配“整体风格”，且前文强调“一些城市的景观规划动辄‘大开大合’”，“大开大合”本意为文思跌荡，放得开，收得拢，双引号在文段中表达特殊语义，结合文段主题可知，横线处应体现城市景观规划动作很大，声势很大的意思。在这种情况下，结合尾句中这些做法导致“城市失去了原本的生活底色”可知，城市景观规划虽然看上去搞得很大，但是最终呈现出的风格却失去了城市的特色及其本来的样子。D项“千篇一律”指的是事物只有一种形式，没有变化，符合文意且与“整体风格”搭配恰当，当选。\nA项“照猫画虎”指的是只从形式上模仿，实际上并不理解，文段未体现出“模仿”之意，排除；\nB项“老生常谈”指的是人们听惯了的没有新意的话，常搭配观点、话题等，一般不与“整体风格”搭配，排除；\nC项“因循守旧”指的是守着老样子不改，不求革新，文段未体现出“守旧”之意，排除。\n故正确答案为D。\n【文段出处】社会科学报《城市改造背后撼不动的是文化认同》","no":22,"missingImage":false},{"type":"question","qid":"5509452","cat":"逻辑填空","stem":"平衡好情怀与创新改编之间的关系，能使经典乐曲焕发            的魅力；我们也希望记忆中的歌声除了那些            的经典，还有不断诞生的新曲目。\n依次填入画横线部分最恰当的一项是：","options":{"A":"经久不衰 百听不厌","B":"生生不息 脍炙人口","C":"历久弥新 耳熟能详","D":"耳目一新 喜闻乐见"},"answer":"C","explanation":"第一空，搭配“魅力”并且要体现“经典乐曲”的特点，A项“经久不衰”形容某事或某人经历很长时间仍旧保持较高的旺盛状态，B项“生生不息”指不断地生长、繁殖，C项“历久弥新”指经历长久的时间而更加鲜活，更加有活力，更显价值，均既能搭配“魅力”又能够体现经典乐曲焕发长久的魅力，保留。D项“耳目一新”意思是听到的、看到的跟以前完全不同，常见用法为“令人/让人耳目一新”，不能直接搭配“魅力”，排除。\n第二空，搭配“经典”， A项“百听不厌”、B项“脍炙人口”、C项“耳熟能详”均可搭配“经典”，又根据前文“记忆中的歌声”说明歌声存在记忆中，C项“耳熟能详”指听得多了，能够很清楚、很详细地复述出来，能够说明存在“记忆中”，符合文意，当选。A项“百听不厌”是形容乐曲或歌曲好听，使人听多少遍也不厌烦，B项“脍炙人口”比喻好的事物受到人们的称赞和传颂，均不能体现存在“记忆中”，排除。\n故正确答案为C。\n【文段出处】人民网《人民艺起评：老歌新唱，声生不息既要怀旧也要创新》","no":23,"missingImage":false},{"type":"question","qid":"5509451","cat":"逻辑填空","stem":"应急科普能够及时解疑释惑，提升公众认知力，还可以        伪科学和谣言，        社会和网络环境。建立健全国家应急科普协调联动机制，完善各级政府应急管理预案中的应急科普措施，极为必要，更是            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"批驳 净化 未雨绸缪","B":"抵制 维护 重中之重","C":"对抗 清理 居安思危","D":"拆穿 建设 防微杜渐"},"answer":"A","explanation":"本题可从第二空入手，搭配“社会和网络环境”，且根据文意可知，应急科普可以打击伪科学和谣言，营造良好的社会网络环境，A项“净化”指清除杂质使物体纯净，B项“维护”指维持保护使免于遭受破坏，两项均搭配得当且符合文意，保留。C项“清理”指彻底整理或处理，与“社会和网络环境”搭配不当，排除；D项“建设”指创立新事业、增加新设施，如果要使用D项，原文应表述为“建设良好的社会和网络环境”，直接搭配“社会和网络环境”与文意不符，排除。\n再看第三空，根据“建立健全国家应急科普协调联动机制，完善各级政府应急管理预案中的应急科普措施”可知，横线处应与“机制、应急管理预案”对应，体现对未来风险的防范，A项“未雨绸缪”比喻事先做好准备工作，符合文意，保留。B项“重中之重”指重点中的重点，强调非常重要的意思，与“应急预案”无关，且和前文“极为必要”语义、程度相近，与文意不符，排除。\n第一空，代入验证，搭配“伪科学和谣言”，A项“批驳”指对错误的言论或行为加以批判和驳斥，符合文意，当选。\n故正确答案为A。\n【文段出处】人民网《人民网评：厚植公民科普之种，培育自立自强根基》","no":24,"missingImage":false},{"type":"question","qid":"5509439","cat":"逻辑填空","stem":"电影音乐作为电影艺术的组成部分，早已和画面构图、色彩、语言一样，成了表达主题、塑造人物、        意境的一个重要手段。它在渲染气氛、揭示人物心灵、影响观众心理方面所能达到的神奇效果，是前人始料所不及的。一部精彩的电影如果缺少了            的音乐，就好比一道大餐少了盐。\n依次填入画横线部分最恰当的一项是：","options":{"A":"设立 相辅相成","B":"创造 相得益彰","C":"生成 引人入胜","D":"展现 此呼彼应"},"answer":"B","explanation":"本题可以从第二空入手，根据后文“就好比一道大餐少了盐”可知，此处进行了形象表达，将电影比作大餐，将音乐比作盐，故横线处应形容盐对大餐的作用，A项“相辅相成”指两个事物互相配合，互相辅助，缺一不可，B项“相得益彰”指两者互相配合，双方的能力和作用更能显示出来，均符合文意，保留。C项“引人入胜”指吸引人进入美妙的境地，形容优美的风景或文艺作品十分吸引人，D项“此呼彼应”指这里呼唤，那里响应，形容联系紧密，互相配合行动，均无法与文段形象表达形成对应，排除。\n第一空，搭配“意境”，B项“创造”指制造新的事物，与“意境”搭配恰当，当选。A项“设立”指开始创建，成立，常搭配“目标”“机构”等，与“意境”搭配不当，排除。\n故正确答案为B。\n【文段出处】北京日报《电影音乐的神奇功力》","no":25,"missingImage":false},{"type":"question","qid":"5509450","cat":"逻辑填空","stem":"青色文化            ，繁复至极，但沿着牛顿的光谱学说看过去，青光的波长在425至445纳米之间，仅仅20纳米而已，又显得            了。两相对比，有一种摄人心魄的震撼。想来，这就是科学与文化的魅力吧。\n依次填入画横线部分最恰当的一项是：","options":{"A":"浩若烟海 不值一提","B":"源远流长 无足轻重","C":"绚丽多彩 平淡无奇","D":"洋洋大观 微乎其微"},"answer":"D","explanation":"第一空，横线处所填成语搭配“青色文化”，且由后文的“繁复至极”可知，此处应体现“青色文化”多而复杂的特征。C项“绚丽多彩”指各种各样的色彩灿烂美丽，D项“洋洋大观”形容美好的事物繁多，丰富多彩，均符合文意，保留。A项“浩若烟海”指广大繁多如茫茫大海，多指书籍、文献等数量多，与“青色文化”搭配不当，排除；B项“源远流长”比喻历史悠久，根底深厚，并未体现多而复杂之意，排除。\n第二空，由“仅仅20纳米而已”可知，横线处所填成语应体现“小”的意思。D项“微乎其微”形容非常小或非常少，符合文意，当选。C项“平淡无奇”形容事物没有什么突出的、出色的地方，与文意不符，排除。\n故正确答案为D。\n【文段出处】北京晚报《&lt;青色极简史&gt;：青色里的传统文化》","no":26,"missingImage":false},{"type":"question","qid":"5509445","cat":"逻辑填空","stem":"追星            ，但频频越界的“饭圈”乱象，不仅有违社会公序良俗、触碰社会道德底线，有的还已触碰法律红线。        “饭圈”乱象，关涉青少年成长，关乎社会和谐稳定。\n依次填入画横线部分最恰当的一项是：","options":{"A":"无可厚非 整治","B":"无可非议 疏导","C":"天经地义 治理","D":"情有可原 梳理"},"answer":"A","explanation":"第一空，搭配“追星”，且根据后文“但频频越界的‘饭圈’乱象，不仅有违社会公序良俗、触碰社会道德底线，有的还已触碰法律红线”可知，横线处应体现追星本身并无太大过错，是可以理解的行为。A项“无可厚非”指不可过分指摘，表示虽有缺点，但是可以理解或者原谅，与文意相符，保留。B项“无可非议”指没有什么可以指摘的，表示做得妥当，强调事情做得妥当、正确，C项“天经地义”指非常正确、不容置疑的道理，由后文可知追星行为中存在一些乱象，并非完全的妥当和正确，均程度过重，排除；D项“情有可原”指按照情理，对出现的某种情况有可以原谅的地方，常搭配错误行为，而通过分析可知，追星行为本身是可以理解的，并非是错误行为，搭配不当，排除。\n第二空，代入验证。搭配“乱象”，A项“整治”指整顿治理，“整治乱象”为常见搭配，当选。\n故正确答案为A。\n【文段出处】光明网《从完善法律入手规制“饭圈”乱象》","no":27,"missingImage":false},{"type":"question","qid":"5509440","cat":"逻辑填空","stem":"我们常常讨论创造性的培养，好像创造性就一定意味着            ，一个问题有一百个解，不受约束。实际上，        地看待世界，明白局部与整体之间的联系和运作；做事情讲方法，有步骤，有恒心，能统合各方力量，这些才是创造性的基石。\n依次填入画横线部分最恰当的一项是：","options":{"A":"龙飞凤舞 壮观","B":"天马行空 宏观","C":"不拘一格 微观","D":"挥洒自如 乐观"},"answer":"B","explanation":"第一空，需要体现“创造性”的特点，根据横线后“一个问题有一百个解，不受约束”可知，横线处应表达创造不受约束、自由自在之意。B项“天马行空”比喻思想行为无拘无束，亦形容文笔超逸流畅，C项“不拘一格”指不局限于一种规格或一个格局，均符合文意，保留。A项“龙飞凤舞”原形容山势的蜿蜒雄壮，后也形容书法笔势有力，灵活舒展，多用来修饰书法笔势，D项“挥洒自如”形容画画、写字、作文，运笔能随心所欲，均无法用来形容创造性，排除。\n第二空，根据横线后“明白局部与整体之间的联系和运作”可知，横线处应体现能够看清局部和整体之意。B项“宏观”指大范围的或涉及整体的，可以体现能够看清局部和整体之意，当选。C项“微观”指小范围的或部分的，无法体现看清整体之意，排除。\n故正确答案为B。\n【文段出处】微信公众号《见识了德国小学生的“长期作业”，我觉得这些年学白上了》","no":28,"missingImage":false},{"type":"question","qid":"5509447","cat":"逻辑填空","stem":"在延安中央大礼堂外，伫立着两棵柳树和一排松树。当年，毛泽东曾作“松柳之喻”：共产党员要像柳树一样，插到哪里就在那里活起来。但是柳树也有弱点，就是随风倒，软得很，所以还要学松树，松树的劲大得很，到冬天也不落叶子。松树有原则性，柳树有灵活性。像柳树那样        ，人人喜欢；像松树那样        ，稳当可靠。\n依次填入画横线部分最恰当的一项是：","options":{"A":"可亲 坚定","B":"可爱 坚固","C":"可敬 坚挺","D":"可贵 坚持"},"answer":"A","explanation":"第一空，根据横线后“，”可知，横线处所填词语应与“人人喜欢”语义相近，A项“可亲”指使人愿意亲近，B项“可爱”指令人喜爱，均符合文意，保留。C项“可敬”指值得尊敬，D项“可贵”指值得珍视或重视，文段并未提及柳树是否值得人们尊敬或珍视，均与文意不符，排除。\n第二空，根据横线后“，”可知，横线处所填词语应与“稳当可靠”语义相近，又根据横线前“松树的劲大得很”“松树有原则性”可知，横线处所填词语应体现出共产党员要像松树一样可靠、不动摇之意，A项“坚定”形容稳定坚强，不动摇，符合文意，当选。B项“坚固”指牢固、结实，侧重物理结构，与文意不符，排除。\n故正确答案为A。\n【文段出处】《松柳之喻悟党性》","no":29,"missingImage":false},{"type":"question","qid":"5509443","cat":"逻辑填空","stem":"与人类繁衍发展的漫长历史相比，科学的历史并不        。但就在科学有了一席之地的有限历史维度中，人类社会从关系架构、行为方式到思维模式都被科学深刻影响甚至颠覆性        。科学已经成为现代社会不可        的重要部分，是延续和推动现代社会发展的核心力量。\n依次填入画横线部分最恰当的一项是：","options":{"A":"久远 重构 分割","B":"深远 解构 分离","C":"永久 重建 分隔","D":"长久 创新 分裂"},"answer":"A","explanation":"第一空，搭配“历史”，且根据“与人类繁衍发展的漫长历史相比”可知，横线处所填词语应体现漫长之意。A项“久远”指长久、长远，多搭配“年代”“历史”等，搭配得当且符合文意，保留。B项“深远”指深刻而长远，多搭配“影响”“意义”等，与“历史”搭配不当，排除；C项“永久”指永远、长久，多搭配“禁止”“损伤”等，与“历史”搭配不当，排除；D项“长久”指时间很长，长远，多搭配“打算”“规划”等，与“历史”搭配不当，排除。\n第二空，代入验证。根据“被科学深刻影响甚至颠覆性······”可知，横线处所填词语应体现巨大变化之意。A项“重构”指重新构建，可体现巨大变化之意，保留。\n第三空，代入验证。根据“不可······的重要部分”“是延续和推动现代社会发展的核心力量”可知，横线处所填词语应体现分开、分离之意。A项“分割”指把整体或有联系的东西分开，符合文意，当选。\n故正确答案为A。\n【文段出处】《让科学文化 成为社会文化的底色》科技日报2022年8月19日刊","no":30,"missingImage":false},{"type":"question","qid":"5509446","cat":"逻辑填空","stem":"读书可以提高我们的眼光、境界、格局、胸怀。读书的好处，是可以让我们跳出此时此地的        ，穿透一时一地的迷雾，从更大的格局和更长远的眼光来把握眼前的各种        ，从而把不解和不安化成豁然开朗和淡定从容，最后养成战略上的        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"奴役 骚乱 毅力","B":"束缚 骚动 耐力","C":"局限 扰乱 致力","D":"限制 扰动 定力"},"answer":"D","explanation":"第一空，根据后文“穿透一时一地的迷雾”可知，横线处应体现被此时此地所迷惑，B项“束缚”指拘束、限制，C项“局限”指限制在一定范围，D项“限制”指约束，均符合文意，保留。A项“奴役”指没有自由，由得别人使唤的人，程度过重，排除。\n第二空，对应后文“把不解和不安化成豁然开朗和淡定从容”，横线处应体现眼前的状态是“不解和不安”，D项“扰动”指困扰和骚动，符合文意，保留。B项“骚动”指秩序紊乱，动荡不安，仅能对应“不安”的状态，排除；C项“扰乱”使混乱、慌乱，并未体现“不解”的状态，排除。\n第三空，代入验证，对应前文“豁然开朗和淡定从容”，D项“定力”指处变和把握自己的意志力，符合文意，当选。\n故正确答案为D。\n【文段出处】《宫玉振：士兵爱打仗，领导好读书》","no":31,"missingImage":false},{"type":"question","qid":"5509448","cat":"逻辑填空","stem":"人类成就和文明进步的史诗，是通过历史上最有天赋和才能的个体对艺术、科学和所有其他领域所做的贡献        的。天资卓越、创造力出众的拔尖人才可以利用他们的天赋和才能来        人类社会的现状，也可以对其侵蚀破坏。而他们最终如何选择自己的道路，能否肩负起社会责任，创造更广泛的社会福祉，对于人类命运共同体的未来发展方向有            的影响。\n依次填入画横线部分最恰当的一项是：","options":{"A":"写就 改善 举足轻重","B":"造就 改变 举重若轻","C":"成就 提升 才轻任重","D":"铺就 提高 无关紧要"},"answer":"A","explanation":"第一空，搭配“人类成就和文明进步的史诗”，且根据文意可知，横线处应表达人类成就和文明进步是由历史上最有天赋和才能的个体创造实现的。A项“写就”中的“写”指“写作、描写”，“就”在用作动词的时候有“成功、完成”的意思，“写就”可以理解为描写成功、写成了，对应“史诗”符合形象表达的要求，B项“造就”指培养使有成就，均符合文意，保留。C项“成就”与前文“人类成就”语义重复，排除；D项“铺就”指铺好了、铺成了，与“史诗”搭配不当，排除。\n第二空，搭配“现状”，且根据“天资卓越、创造力出众的拔尖人才可以利用他们的天赋和才能······也可以对其侵蚀破坏”可知，横线处应表达拔尖人才对人类社会的积极作用。A项“改善”指使原来的状况变得好些，符合文意，保留。B项“改变”指事物发生显著的差别，为中性词，体现不出积极的感情色彩，排除。\n第三空，代入验证。A项“举足轻重”比喻所处地位重要，一举一动都会影响全局，置于此处可以表达天资卓越、创造力出众的拔尖人才对于人类命运共同体的未来发展方向有着至关重要的作用，符合文意，当选。\n故正确答案为A。\n【文段出处】光明网《社会责任感：拔尖人才的核心素养》","no":32,"missingImage":false},{"type":"question","qid":"5509453","cat":"逻辑填空","stem":"大脑对于外界单调、规律的声音会产生谐振，同时会掩盖住其余声音，起到一种掩蔽效应，因为没有任何变化从而并不引起生理上的        与注意，会不自觉地        噪声对自己的影响，更容易        于当下的活动。\n依次填入画横线部分最恰当的一项是：","options":{"A":"不适 忽略 习惯","B":"反感 抵消 专注","C":"体验 消解 聚焦","D":"认知 弱化 沉浸"},"answer":"D","explanation":"本题可从第二空入手，根据前文“会掩盖住其余声音，起到一种掩蔽效应”可知，横线处应体现对于噪声起到的也是一种“掩蔽”作用，A项“忽略”指不在意，没注意到，C项“消解”指消释、解除，D项“弱化”指使削弱，均可以起到掩蔽噪声的作用，符合文意，保留。B项“抵消”指因作用相反而互相消除，文段并没有其他事物与噪声相互消除，排除。\n再看第三空，根据文意可知，横线处应表达减少噪声后不被外界干扰，更有利于当下的活动之意，D项“沉浸”比喻处于某种境界或思想活动中，可以体现出在活动中不被外界干扰的状态，符合文意，保留。A项“习惯”指由熟悉而适应，不能体现不被外界干扰的状态，排除；C项“聚焦”比喻视线、注意力等集中于一点，文段并未体现都集中于一点，排除。\n第一空，代入验证，根据横线前内容可知，因为没有任何变化，所以也就没有引起生理上对事物的注意，D项“认知”指通过思维活动认识、了解，符合文意，当选。\n故正确答案为D。\n【文段出处】今日头条《“白噪音”助眠，是科学还是忽悠》","no":33,"missingImage":false},{"type":"question","qid":"5509454","cat":"逻辑填空","stem":"AI（人工智能）的技术内核虽然        ，但“模拟人类智慧”这一理念本身却并不        。因此，该理念就很容易被一些        的思想先驱者转化为一些艺术形象，由此形成对于技术形态本身的“抢跑”态势。\n依次填入画横线部分最恰当的一项是：","options":{"A":"深奥 超前 敏感","B":"先进 抽象 前卫","C":"艰深 晦涩 敏锐","D":"高端 艰涩 睿智"},"answer":"C","explanation":"第一空、第二空，根据转折词“但”可知，横线前后呈转折关系，语义相反，且由第二空前“不”可知，第一空和第二空所填词语语义相近，C项“艰深”指高深而难以理解，“晦涩”指文辞等隐晦，不流畅，不易懂，二者语义相近，符合文意，保留。A项“深奥”指不易理解，高深不通俗，“超前”指超越当前正常条件的，B项“先进”指超前的、高级的，“抽象”指不具体、笼统的，D项“高端”指的是等级、档次、价位等在同类中较高的，“艰涩”指隐晦难懂，三项若置于文段中，前后文均不能构成转折关系，排除。\n第三空，代入验证，搭配“思想先驱者”，C项“敏锐”指反应灵敏，头脑灵活，目光尖锐，与“思想先驱者”搭配恰当，当选。\n故正确答案为C。\n【文段出处】《长期以来，我们是否误解了真正的人工智能？——科幻影视对人工智能的误读》","no":34,"missingImage":false},{"type":"question","qid":"5509761","cat":"逻辑填空","stem":"年度热词        大事小情，不仅反映国家大事、        时代主旋律，还有对老百姓日常生活的深切        ，展现了过去一年的社会变迁和生活万象。而透过“内卷”“躺平”“鸡娃”“双减”“干饭人”等热词，我们还可        当下独特的社会景观。\n依次填入画横线部分最恰当的一项是：","options":{"A":"描绘 切合 感触 了解","B":"体现 把握 体验 感受","C":"勾勒 蕴含 体察 窥见","D":"叙写 贴近 关怀 透视"},"answer":"C","explanation":"本题可从第二空入手，横线处词语搭配“年度热词”“时代主旋律”，形容“年度热词”对“时代主旋律”的作用，且根据顿号可知，横线处词语与前文“反映”构成并列，语义相近，故横线处词语应表达“年度热词”体现了“时代主旋律”之意，A项“切合”指十分符合，C项“蕴含”指包含在内，D项“贴近”指靠拢、紧紧靠近，均与“时代主旋律”搭配恰当，保留。B项“把握”指掌握，理解，与文意不符，排除。\n第三空，形容“年度热词”对“百姓生活”的作用，根据后文“展现了过去一年的社会变迁和生活万象”可知，横线处词语应表达在年度热词中可以观察到、了解到百姓的生活，C项“体察”指体验观察，符合文意，保留。A项“感触”指接触外界事物而引起的思想情绪，文段并未体现引起思想情绪之意，与文意不符，排除；D项“关怀”指关心，含有帮助、爱护、照顾之意，与文意不符，排除。\n第四空，代入验证，搭配“社会景观”，C项“窥见”指暗中看出或觉察到，与“社会景观”搭配恰当，保留。\n第一空，代入验证，C项“勾勒”指用简练的文笔叙述大概情况，可以体现年度热词的作用，当选。\n故正确答案为C。\n【文段出处】《从年度流行语中感受时代与社会脉动》","no":35,"missingImage":false},{"type":"question","qid":"5509497","cat":"片段阅读","stem":"语文素养和语言能力的提高，不是靠学理论所能达到的，更没有什么捷径可走，唯一的办法就是要多读书、读好书、勤于写作，有的名篇名段需要适度背诵。这是古人留给我们培养孩子语文素养和能力的有益经验。阅读能让孩子不断提高语言能力、思维能力，获得心灵滋养，打开丰富多彩世界的大门。\n这段文字意在强调：","options":{"A":"学好语文是学好一切的根本","B":"语文素养的提高无捷径可走","C":"学好语文的关键在于写作和背诵","D":"阅读对于提升语言能力的重要性"},"answer":"D","explanation":"文段提出语文素养和语言能力的提高没有捷径可走，然后通过“唯一的办法”给出对策，强调要多读书、读好书、勤于写作，接着通过肯定其是有益经验和分析其重要作用，再次论述阅读的重要性，故文段重在强调阅读是提高语言素养和能力的唯一办法，对应D项。\nA、C两项，“学好语文”偏离文段中心，文段讨论的是提高语言素养和能力，而非“学好语文”，均排除；\nB项，“无捷径可走”表述不明确，排除。\n故正确答案为D。\n【文段出处】《“学好语文是学好一切的根本”》","no":36,"missingImage":false},{"type":"question","qid":"5509787","cat":"片段阅读","stem":"专家身份不仅意味着一个人具备专门的知识和技能，更意味着他人承认其可信性和权威性。专家若想具有说服力，必须善用自己掌握的知识和技能，“善用”即是指在正确的时间，以正确的方式，朝向正确的目标。只有审慎行动、保持善意，专家才能有效地应用技术性知识。\n这段文字意在强调：","options":{"A":"专家要有效地应用技术性知识","B":"对专家的不信任和质疑很常见","C":"专家的可信度来自知识与善意","D":"人们应以批判性思维对待专家"},"answer":"C","explanation":"文段首先引出专家身份的内涵，通过程度词“更”强调专家可信性和权威性的重要性。接着通过“必须”引出对策，即专家必须通过善用知识和技能来获取说服力，并对于“善用”进行了进一步解释说明。最后文段通过必要条件关系标志词“只有······才······”强调审慎行动、保持善意的必要性。故文段重点强调专家要想获得说服力需要善用知识并保持善意，对应C项。\nA项，“有效地应用技术性知识”是意义效果的表述，非文段重点，排除；\nB项“对专家的不信任和质疑”及D项“以批判性思维对待专家”，文段均未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】中国社会科学网-中国社会科学报《专家的可信度来自知识与善意》","no":37,"missingImage":false},{"type":"question","qid":"5509504","cat":"片段阅读","stem":"截至2021年，化石燃料的燃烧正式改变了北半球空气中碳同位素的组成，甚至足以抵消核武器试验发出的信号。而这可能会给有价值的碳年代测定技术带来问题。专家发现，从放射性碳年代测定法来看，现代物品看起来就像是20世纪早期的物品。专家表示，这种趋势“可能很快就会让人很难分辨一件东西是1000年前的还是现代的”。\n最适合做这段文字标题的是：","options":{"A":"化石燃料燃烧带来的影响","B":"放射性碳年代测定的原理","C":"如何分辨物品的年代属性","D":"碳年代测定技术可能不再准确"},"answer":"D","explanation":"文段开篇引出话题，即“化石燃料的燃烧”，接着通过指代词“这”，指出“化石燃料的燃烧”可能会给有价值的碳年代测定技术带来问题。后文通过“专家发现”“专家表示”进行具体解释说明，从专家的角度说明碳年代测定技术有可能出现不确定的结果，故文段重在强调碳年代测定技术可能出现的问题，对应D项。\nA项，“带来的影响”相较于D项表述不够明确，排除；\nB项“碳年代测定的原理”、C项“如何分辨物品的年代属性”文段均未论述，无中生有，排除。\n故正确答案为D。\n【文段出处】科学网《“碳定年”测不准了》","no":38,"missingImage":false},{"type":"question","qid":"5509499","cat":"语句表达","stem":"为什么                    ？一个重要原因是，在中国经济发展中，地方分权尤其是财政包干对地区经济发展产生了正向激励，由此也引发了一些地方的“一亩三分地”思维，政策取向更多考虑一地一域，而非站在全国角度通盘考虑。尤其是受唯GDP思维惯性影响，地方对能带动当地经济、增加财政收入的项目多有青睐，通过或明或暗的方式予以保护，造成了市场分割。\n填入画横线部分最恰当的一项是：","options":{"A":"地方保护主义难以根除","B":"国内大循环仍存在堵点","C":"有些地方产业的产能严重过剩","D":"地方保护范围主要在商品领域"},"answer":"A","explanation":"本题为语句填空题，横线出现在文段开头，需结合后文分析。横线后指出地方分权对地区经济发展有激励作用，并通过“由此”引导结论，即形成地方思维，并未考虑全国性。随后通过“尤其”强调，地方对能带动当地经济、增加财政收入的项目常采取保护措施，造成市场分割。故后文主要强调地方思维导致的政策取向仅限于保护地方的经济、财政项目，即“存在地方保护主义”，对应A项。\nB项，文段并未提及“国内大循环”，无中生有，排除；\nC项，文段并未提及“产能严重过剩”，无中生有，排除；\nD项，根据“地方对能带动当地经济、增加财政收入的项目多有青睐······予以保护”可知，“主要在商品领域”表述片面，无法概括后文内容，排除。\n故正确答案为A。\n【文段出处】经济日报《每到一地就要设分公司？经济日报：隐性地方保护主义必须打破！》","no":39,"missingImage":false},{"type":"question","qid":"5509779","cat":"语句表达","stem":"①这种观念意识即“中和”。所谓“致中和，天地位焉，万物育焉”，展开了中华民族一幅内含阔大想象的宇宙图景\n②“尽善尽美”，要求美的原则与善的原则相伴而行，美感经验与价值理念一体交融\n③就礼乐关系而言，礼强调道德仪式对日常行为的规范，然而这种规范如果不是仅流于形式，就必须从内心获得情感的力量，实现内化的完成\n④就中华美育传统而言，美与善的关联性要远远大于差异性\n⑤总之，中华美育精神，讲求审美与道德的统一，二者统一于人格教育之中\n⑥乐呈现为愉悦的感性经验品格，然而这种愉悦本身，却为一种观念意识的直观呈现\n将以上6个句子重新排列，语序正确的是：","options":{"A":"④②⑥③⑤①","B":"②④③⑥①⑤","C":"④③②⑥①⑤","D":"②①③⑥⑤④"},"answer":"B","explanation":"对比选项，确定首句。②句介绍“尽善尽美”的要求，④句指出美与善的关联性远大于差异性，不好判断首句。观察其它句子，①句出现指代词“这种观念意识”，观察选项，①句之前有②、⑤、⑥三句，⑥句指出愉悦是一种观念意识的直观呈现，对应“这种观念意识”，故⑥①两句捆绑，保留B、C两项。而②句介绍“尽善尽美”的要求，⑤句通过“总之”引出结论，强调审美与道德统一于人格教育之中，两者均与“这种观念意识”无关，排除A、D两项。\n对比B、C两项，判断②句、③句与⑥句的关系。②句介绍“尽善尽美”的要求，③句引出“礼”和“乐”，并围绕“礼”的角度展开具体论述，而⑥句是围绕“乐”的角度展开具体论述的，根据行文逻辑，③⑥两句衔接紧密，B项当选。而②句与⑥句连接不紧密，排除C项。\n故正确答案为B。\n【文段出处】中国社会科学报《立足中华文化传统 感悟中华美育精神》","no":40,"missingImage":false},{"type":"question","qid":"5509492","cat":"语句表达","stem":"①发表在《自然·通讯》的新研究显示，母亲卵子中的一种特定蛋白质的供应，可以影响驱动后代骨骼形态的基因\n②如果卵子中没有母体的SMCHD1，后代出生后的骨骼结构会发生改变\n③表观遗传信息的变化会受到环境变化的影响，但是这些变化不会改变DNA，通常不会从父母传给后代\n④在哺乳动物的胚胎发育过程中，Hox基因控制着每个椎体，而表观遗传调节器则防止这些基因过早被激活\n⑤在这项研究中，研究人员发现，母亲卵子中SMCHD1的数量会影响Hox基因的活性并影响胚胎的形态\n⑥该研究集中在一种称为SMCHD1的蛋白上，它是一种表观遗传调节器\n将以上6个句子重新排列，语序正确的是：","options":{"A":"①②④⑤⑥③","B":"②③④①⑥⑤","C":"③①⑥④⑤②","D":"④②①⑤③⑥"},"answer":"C","explanation":"对比选项，确定首句。①句介绍母亲卵子中一种特定蛋白质的供应可以影响驱动后代“骨骼形态”的基因，③句介绍表观遗传信息的变化通常不会遗传，④句指出哺乳动物胚胎发育过程中表观遗传调节器的作用，均可作为话题引入，适合作为首句，保留A、C、D三项。②句指出卵子缺失母体的SMCHD1对后代“骨骼结构”的影响，与①句话题相似，且对比可知，②句是对①句的具体解释，按照行文逻辑，应该先提出观点，再解释说明，故②句应排在①句之后，排除B、D两项。\n继续观察文段可知，⑤句介绍“SMCHD1蛋白”的相关影响，⑥句引出“SMCHD1蛋白”这一话题并进行简要介绍，按照行文逻辑，应该先引出话题，再详细介绍，故⑥句应排在⑤句之前，排除A项，C项当选。\n故正确答案为C。\n【文段出处】《母亲的这种表观遗传信息，将对后代产生终身影响》","no":41,"missingImage":false},{"type":"question","qid":"5509494","cat":"片段阅读","stem":"现代社会是陌生人社会，以市场经济为基础，更广范围更大规模的交易如跨国贸易，更长距离的往来如海运空运，甚至是跨期买卖如期货交易，不再是在几个熟人之间进行，而是大规模的陌生人社会交往，因此，迫切需要一套交易规则来保障交易的正常进行。这个时候，规则与法律的作用就远远超过熟人社会的习俗礼节与乡规民约。\n根据这段文字，下列说法正确的是：","options":{"A":"现代社会通常会依照差序格局决定办事的难易程度","B":"市场经济需要习俗礼节与乡规民约保障交易的进行","C":"熟人社会是以家族亲属关系为主轴的社会网络关系","D":"现代社会人际关系的维系更依赖规约和法律的作用"},"answer":"D","explanation":"文段首句提出背景“现代社会是陌生人社会”，并指出现代社会的交易是大规模的陌生人社会交往，随后通过“因此”总结，提出需要交易规则保障交易正常进行，尾句“这个时候”指代前文再次进行总结，强调规则与法律对现代社会的重要性，即现代社会的陌生人交往交易需要规则与法律保障，对应D项。\nA项，“差序格局”文段并未提及，无中生有，排除；\nB项，“市场经济”对应文段首句“以市场经济为基础”，“习俗礼节与乡规民约”对应文段尾句，文段并未提及两者的关系，概念混搭，排除；\nC项，“家族亲属关系”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】《观澜｜不找熟人也能办好事，陌生人社会的新型人际关系》","no":42,"missingImage":false},{"type":"question","qid":"5509756","cat":"片段阅读","stem":"老子论“道”，强调人性的本然状态；孔子论“仁”，强调社会的应然状态。在理论逻辑上，老子从道德人心的角度，企图救赎异化的人性；孔子从伦理教化的角度，企图重构崩溃的秩序。在价值取向上，老子之“道”以具体的社会之“德”为理论归趣，其抽象哲学观与社会价值观并无判然界限；孔子之“仁”以社会之“道”为理论指向，其社会价值观与抽象哲学观也无判然界限。\n根据这段文字，下列说法不符合作者观点的是：","options":{"A":"老子之“道”与孔子之“仁”构成理论上的互补关系","B":"老子之“道”与孔子之“仁”构成价值观的辩证关系","C":"老子之“道”与孔子之“仁”彰显的价值观相互对立","D":"老子之“道”与孔子之“仁”虽表面相反但深层相济"},"answer":"C","explanation":"A项，根据“在理论逻辑上，老子从道德人心的角度······孔子从伦理教化的角度······”可知，老子和孔子分别从道德和伦理角度来谈论，构成了理论上的互补关系，表述正确，排除；\nB项，根据“在价值取向上，老子之‘道’以具体的社会之‘德’为理论归趣······孔子之‘仁’以社会之‘道’为理论指向······”可知，老子之“道”与孔子之“仁”构成价值观的辩证关系，表述正确，排除；\nC项，根据“在价值取向上，老子之‘道’以具体的社会之‘德’为理论归趣······孔子之‘仁’以社会之‘道’为理论指向······”可知，老子之“道”与孔子之“仁”的社会价值观没有巨大差异，“价值观相互对立”表述错误，当选；\nD项，根据文意可知，老子之“道”与孔子之“仁”在理论逻辑上有不同的角度，但在价值取向上没有大的差异，“虽表面相反但深层相济”表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明日报《老子之“道”和孔子之“仁”》","no":43,"missingImage":false},{"type":"question","qid":"5509510","cat":"语句表达","stem":"传统村落传承着中华民族的历史记忆、生产生活智慧、文化艺术结晶和民族地域特色。传统村落的建筑设计工艺和技术值得现代建筑研究和挖掘，传统村落的空间格局、邻里关系、乡风民约等对于城市打造和谐的邻里关系，提高社区治理能力有很好的借鉴意义。对于长期生活在喧嚣城市中的居民来说，传统村落和乡村风貌有较强的吸引力。保护传统村落，发展乡村旅游，可为巩固拓展脱贫攻坚成果同乡村振兴有效衔接提供有力产业支撑。\n这段文字意在说明：","options":{"A":"传统村落和乡村风貌的价值是多元丰富的","B":"传统村落治理模式对城市建设有借鉴意义","C":"保护传统村落是推进乡村振兴的重要举措","D":"乡村振兴促进经济发展并承载传统的延续"},"answer":"A","explanation":"文段以“传统村落”为核心，从多个方面阐述了其重要价值，分别为传统村落对中华民族历史文化等多方面的传承作用；传统村落的建筑设计工艺和技术的研究价值；其空间格局、邻里关系、乡风民约等对城市社区治理的借鉴意义；其乡村风貌对城市居民的吸引力，以及基于此发展乡村旅游，可为巩固拓展脱贫攻坚成果同乡村振兴有效衔接提供有力产业支撑。因此，整个文段通篇均在论述传统村落和乡村风貌的多元价值，对应A项。\nB项，“传统村落治理模式”仅为多元价值中的一个方面，表述片面，排除；\nC项，“推进乡村振兴”仅对应尾句，未能对前文中传统村落的多元价值进行全面概括，排除；\nD项，未包含主题词“传统村落”，排除。\n故正确答案为A。\n【文段出处】经济日报《保护好传统村落和乡村风貌》","no":44,"missingImage":false},{"type":"question","qid":"5509511","cat":"语句表达","stem":"我们经常需要控制自己的欲望，晚一些再满足它，称之为“延迟满足”。与今晚享受大餐相比，推迟享受的大餐，其吸引力（价值）被打了折扣，心理学家称之为时间折扣。时间折扣越大，我们越无法接受延迟满足。但在面临诸多决策时，人们趋于采用单一策略：当现在和未来的时间距离不那么遥远，便直接“齐同”两者在时间维度的差别，不再给未来选择打一个时间折扣，让不同时间点之间的选择变得更加简单。\n下列与画横线部分意思相符的是：","options":{"A":"做决策时，不考虑时间因素","B":"不考虑延迟满足，选择享受当下","C":"做决策时，随机选择现在或者未来事项","D":"在不同的时间点上选一个平均“时间折扣”"},"answer":"A","explanation":"文段开篇引出“延迟满足”和“时间折扣”的概念，并说明二者之间的关系。接下来通过“但”进行转折，指出面临诸多决策的时候人们趋于采用单一策略，随即后文进行解释说明。画横线部分即为该策略的具体表现，且横线前后分句的内容即对横线处所在句子进行提示和解释。根据“当现在和未来的时间距离不那么遥远”“不再给未来选择打一个时间折扣”可知，“‘齐同’两者在时间维度的差别”强调的是在时间距离不是很遥远的前提下抹去时间的差别，将时间的维度保持“齐平”，即做决策的时候不考虑时间因素，对应A项。\nB项，文段只是强调不考虑时间因素，但没有指出一定是选择享受当下，排除；\nC项，“随机选择”表述错误，文段强调不考虑时间因素，从事项本身出发，并非随机做出决策，排除；\nD项，“平均‘时间折扣’”表述错误，文段强调的是在时间维度不打折扣，忽略时间因素，排除。\n故正确答案为A。\n【文段出处】科学辟谣《“选择困难症”又犯了？要不，这次就让音乐帮忙做决定》","no":45,"missingImage":false},{"type":"question","qid":"5509771","cat":"片段阅读","stem":"小镇是一种介于城乡之间的社会实体，在城市和农村之间，小镇扮演着一种沟通和过渡的角色。城市发展繁荣，人口密集，物质和精神消费品丰富，聚集了更多的资源和财富。而农村地区仍是以农业为主，教育、创新、产业发展处于落后水平。在城乡之间，喧嚣的小镇出现了，城乡居民在此处会集、落脚、定居，在乡愁和发展中找到欲望的栖息之地和财富生机。\n这段文字意在说明：","options":{"A":"消除城乡差距依靠小镇发展","B":"乡村与城市存在巨大的差距","C":"小镇使乡村获得了财富生机","D":"小镇于城市乡村之间的意义"},"answer":"D","explanation":"文段首先提出小镇在城市和农村之间扮演着一种沟通和过渡的角色，接下来介绍了城市和农村地区的巨大差距，同时指出小镇能使在此会集、落脚、定居的城乡居民在乡愁和发展中找到欲望的栖息之地和财富生机，具体解释说明了小镇在城乡之间的作用。故文段重点强调小镇在城市和农村之间所扮演的角色，即小镇于城市乡村之间的意义，对应D项。\nA项，文段强调的是小镇在城乡之间扮演“沟通和过渡”的角色，“消除城乡差距”表述过于绝对，且偏离文段重点，排除；\nB项，未包含文段主题词“小镇”，且“城乡差距”属于解释说明部分，非重点，排除；\nC项，文段强调的是小镇于城乡之间的意义，而非对乡村的意义，偷换概念，排除。\n故正确答案为D。\n【文段出处】新周刊《中国的故事，在小镇》","no":46,"missingImage":false},{"type":"question","qid":"5509498","cat":"语句表达","stem":"音乐绝不是仅仅用好听、悦耳、舒服等感官刺激所能概括得了的，简单地以好听与否作为音乐审美判断，                    ，难免有迎合大众，弱化、矮化音乐艺术价值和意义之嫌。\n填入画横线部分最恰当的一项是：","options":{"A":"一概拒绝理性的参与或诠释","B":"彻底否认情感的激荡与共鸣","C":"无视社会时代的影响及反映","D":"不去了解作曲者的心路历程"},"answer":"A","explanation":"横线在文段中间，应注意与前后文的衔接。横线前指出音乐不是仅仅用感官刺激所能概括的，用好听与否去判断音乐审美，横线后指出横线前论述的做法可能会弱化、矮化音乐艺术价值和意义，故横线处应体现不深入理解音乐、仅以好听与否判断音乐之意，对应A项。\nB项，横线处意在体现“不深入理解音乐”这一做法，而非“彻底否认情感的激荡与共鸣”，表述过于绝对，与前文衔接不当，排除；\nC、D两项，“社会时代的影响及反映”“作曲者的心路历程”文段均未提及，与前后文衔接不当，排除。\n故正确答案为A。\n【文段出处】《「经观讲堂第20期」周世斌：音乐需要懂，音乐可以懂，如何懂音乐》","no":47,"missingImage":false},{"type":"question","qid":"5509501","cat":"语句表达","stem":"近年来，以南海一号沉船博物馆、秦始皇帝陵博物院、安阳殷墟博物馆、海昏侯国遗址博物馆等为代表的考古遗址博物馆，在旅游网站推荐榜单中排名渐次上升。                    。人们已不再单纯满足于简单的、传统的博物馆参观，而是产生了深入历史场景、触及历史语境的体验需求。\n填入画横线部分最恰当的一项是：","options":{"A":"这些变化反映了文化产品的不断更新换代","B":"新技术带来了文化消费场景的转换与创新","C":"这一新动态折射了文化消费的深化与转型","D":"这意味着新型博物馆成为旅游打卡的网红地"},"answer":"C","explanation":"本题为语句填空题，横线在中间，故需结合前后文进行分析。横线前介绍了近年来考古遗址博物馆在旅游网站推荐榜单中排名上升。横线后介绍了人们的文化旅游消费需求由简单的、传统的参观转变为深入的体验。故横线处应揭示考古遗址博物馆榜单排名上升现象背后的本质，即人们的文化旅游消费需求发生转变，对应C项。\nA项，文段侧重强调“文化旅游消费需求发生转变”，“文化产品不断更新换代”表述错误，排除；\nB项，文段并未涉及“新技术”，无中生有，排除；\nD项，仅能承接上文，无法衔接后文“人们文化旅游消费需求的转变”，排除。\n故正确答案为C。\n【文段出处】光明网-文化评析-《珍视“博物馆热”背后的文化寻根需求》","no":48,"missingImage":false},{"type":"question","qid":"5509505","cat":"片段阅读","stem":"国家实施文化数字化战略，出发点和落脚点之一都是为了满足人民日益增长的精神文化需要，这也决定了，尽管文化数字资源可以在市场上“开展数据交易”，但也要依法依规向民众开放，公共文化资源数据开发后的交易也要把社会效益放在首位。文化是实现共同富裕的重要变量，数字化无疑为这个变量增加了权重，文化数字化战略秉持以人为本、全民共享，坚持以文化公平促共同富裕。\n这段文字意在强调：","options":{"A":"文化数字化是人们精神文化需求的结果","B":"文化资源数据的开发与交易要以人为本","C":"文化数字化所带来的利益应由民众共享","D":"数字化是促进民众共同富裕的新动力"},"answer":"C","explanation":"文段开篇引出文化数字化战略的话题，并阐明了满足人民精神文化需要对于国家实施文化数字化战略的重要性，接着通过转折关联词“但”强调了文化数字资源要向民众开放，重视社会效益，并秉持以人为本、全民共享的原则，同时要坚持以文化公平促共同富裕。故文段重点在转折之后，意在强调文化数字化应以人民为主体，并且文化数字化的成果应惠及全体人民，对应C项。\nA项，对应文段开头部分，为转折前内容，非重点，排除；\nB项，“开发与交易”仅对应转折之后的部分内容，表述片面，排除；\nD项，文段的核心话题是“文化数字化”而不是“数字化”，偷换概念，排除。\n故正确答案为C。\n【文段出处】新华网《数字科技赋能文化自信》","no":49,"missingImage":false},{"type":"question","qid":"5509509","cat":"片段阅读","stem":"现代人的祖先智人，曾在很长时间内与丹尼索瓦人、尼安德特人生活在同一片大陆上。只有智人进化成现在的人类。越来越多的证据表明，现代人的基因组中仍然留存着许多尼安德特人和丹尼索瓦人的基因。这一切都要归功于近年来考古学和现代分子生物学测序的发展。从基因组的比对信息中，我们可以看到已经灭绝的尼安德特人、丹尼索瓦人与现代人之间密切的联系。\n从这段文字可以推出：","options":{"A":"丹尼索瓦人和尼安德特人之间的基因关系更为密切","B":"丹尼索瓦人、尼安德特人与智人共同进化成现代人","C":"尼安德特人与丹尼索瓦人出现在人类祖先智人之前","D":"现代人身上有丹尼索瓦人、尼安德特人和智人的基因"},"answer":"D","explanation":"A项，“更为密切”，文段并没有比较基因关系，无中生有，排除；\nB项，根据“只有智人进化成现在的人类”可知，丹尼索瓦人和尼安德特人并未进化成现代人，表述错误，排除；\nC项，“出现在人类祖先智人之前”文段未提及，无中生有，排除；\nD项，根据“只有智人进化成现在的人类”以及“现代人的基因组中仍然留存着许多尼安德特人和丹尼索瓦人的基因”可知，表述正确，当选。\n故正确答案为D。\n【文段出处】科普中国《我们身上流淌着哪些远古人类的基因？》","no":50,"missingImage":false},{"type":"question","qid":"5509513","cat":"片段阅读","stem":"大量的人口流入给城市的发展带来了强大动力，也快速形成了超特大城市的发展红利。然而大城市社会福利分配的限制、发展带来的高生活成本以及区域间文化的巨大差异，让大量农村人口面临进得来、留不下的困境，而且远距离的流动也导致一系列社会问题。县域城镇化连接着农村人口生活的家乡以及工作的城市，具有距离、文化等优势，县域城镇化发展不仅能为农村人口提供更多发展机会，还能为农业转移人口提供城镇化水平的社会服务，让农村人口在参与城镇化建设过程中真正享受其成果。\n这段文字接下来最可能讲的是：","options":{"A":"人口的自由流动是城镇化的基础","B":"发展区域城市建设吸引人口回流","C":"城市的发展红利应为建设者们共享","D":"县域城镇化需要实事求是精准施策"},"answer":"D","explanation":"文段开篇介绍了人口流入能为城市的发展带来好处，接着通过转折词“然而”指出大城市社会福利分配限制、高生活成本、区域文化差异等让农村人出现留不下来的社会问题，然后提出解决问题的对策，即县域城镇化，并介绍了其所具备的优势，能让农村人口真正享受到参与城镇化建设过程中的成果。故文段最后围绕的核心话题为“县域城镇化”，接下来应继续围绕此话题展开论述，介绍如何实现县域城镇化，对应D项。\nA、B、C三项均与文段最后论述的“县域城镇化”话题无关，排除。\n故正确答案为D。\n【文段出处】《人民财评：发挥县域为载体的城镇化发展优势》","no":51,"missingImage":false},{"type":"question","qid":"5509763","cat":"片段阅读","stem":"黄色与红色一样，是中华民族偏爱的颜色。在与“五行说”相对应的“五色论”里，黄色代表土，居于四方的中央。东汉的儒家为了抬高君权，突出了“五行”和“五方”中“土居中央”的观点，把土说成是一切元素的根本，因此中央是至高无上的，这也极大地提高了黄色的地位。三国时期的魏文帝曹丕也接受了这一说法，把黄色定为正色之首，随后的隋、唐王朝都加以效仿。从唐代起，正黄色成为皇室的专用色，滥用即会获罪。时隔千年，虽然黄色早已进入寻常百姓家，但金黄色那高贵庄严的气质依然存在。\n对这段文字概括最恰当的一项是：","options":{"A":"分析中华民族偏爱黄色的原因","B":"追溯土居中央观念的形成历史","C":"探讨颜色与五行观念的内在渊源","D":"强调皇权观念对色彩文化的影响"},"answer":"A","explanation":"文段开篇指出黄色是中华民族偏爱的颜色，随后通过“东汉”“三国时期”“唐代”等多个时间维度展开论述，具体解释了中华民族历来偏爱黄色的原因，故文段首句为中心句，重点强调中华民族历来偏爱黄色的原因，对应A项。\nB项，“土居中央”对应文段“东汉”“三国”等时期，非重点，且表述片面，排除；\nC项“颜色”、D项“色彩”主题词范围扩大，文段重点论述“黄色”，均排除。\n故正确答案为A。\n【文段出处】《浅谈纺织品中的色彩》","no":52,"missingImage":false},{"type":"question","qid":"5509507","cat":"片段阅读","stem":"研究表明，许多动物能够探测到人类无法感知的最微小的振动、细微的大气变化甚至磁场电流。从这个意义上说，啮齿动物和狗可以听到比人类能听到的高得多的频率。大象能感知到的频率则比我们能感知的更低，而许多昆虫的腿部对振动非常敏感。许多动物通过不同的感知获得的这种特殊敏感性的集合，可能是对它们能预感灾难来临的合理解释。\n最适合做这段文字标题的是：","options":{"A":"许多昆虫对振动非常敏感","B":"为什么动物能够预知灾难","C":"许多动物拥有敏锐的感官","D":"动物感知的频率远超人类"},"answer":"B","explanation":"文段开篇指出许多动物的感知能力强于人类，随后列举了啮齿动物、狗、大象以及昆虫的例子进行论证，尾句指出通过不同的感知获得的特殊敏感性的集合可能使动物能预感灾难来临，故文段重点分析了动物能预知灾难的原因，对应B项。\nA项“许多昆虫对振动非常敏感”、C项“许多动物拥有敏锐的感官”、D项“动物感知的频率远超人类”均属于结论前的内容，非重点，且均未提及核心话题“灾难”，排除。\n故正确答案为B。\n【文段出处】《为什么动物能够预知灾难》","no":53,"missingImage":false},{"type":"question","qid":"5509795","cat":"片段阅读","stem":"莲子心发育过程中，多数叶绿素生物合成结构基因的表达是显著上调的，与叶绿素的积累模式一致。原叶绿素酸酯氧化还原酶参与催化的原叶绿素酸酯转化为叶绿素酸酯是一个关键步骤，生成的叶绿素酸酯进一步转化形成叶绿素。光依赖的原叶绿素酸酯氧化还原酶（LPOR）是被子植物中参与这一反应的关键酶，并且此过程是被子植物中叶绿素合成唯一需要光的反应。而一些裸子植物和微生物可以采用不依赖光的原叶绿素酸酯氧化还原酶（DPOR）完成这一反应；莲子心中并不存在DPOR编码基因，但鉴定到两个LPOR编码基因，且其表达模式与叶绿素的积累模式一致。\n这段文字意在说明：","options":{"A":"叶绿素的形成有两种不同的模式","B":"裸子植物依赖光反应形成叶绿素","C":"莲子心的叶绿素合成需要光参与","D":"莲子有裸子植物的两个编码基因"},"answer":"C","explanation":"文段开篇指出莲子心发育过程中多数叶绿素生物合成结构基因的表达与叶绿素的积累模式一致，接着具体分析叶绿素的形成过程，并指出被子植物中叶绿素合成过程中需要光，然后说明一些裸子植物和微生物可以不依赖光形成叶绿素，最后通过转折词“但”强调在莲子心中的LPOR编码基因的表达模式与叶绿素的积累模式一致，故整个文段讨论的核心话题是“莲子心”和“叶绿素”，重点强调莲子心的发育过程中叶绿素的形成需要光，对应C项。\nA、B两项，均未提及核心话题“莲子心”，排除；\nD项，未提及核心话题“叶绿素”，缺少文段主题词，排除。\n故正确答案为C。\n【文段出处】《你知道莲心是如何发育的吗？》","no":54,"missingImage":false},{"type":"question","qid":"5509514","cat":"片段阅读","stem":"汉代扬雄讲“言，心声也；书，心画也；声画形，君子小人见矣”，是将书法看作是人品与人格精神的象征，中国书法艺术美学中实际上蕴含着中华传统美学的道德精神，而作为“文房四宝”的笔墨纸砚，是中国书法与中国绘画艺术之间的直接纽带，中国书画艺术实现了两者之间的审美融通和形式共生，即所谓“书画同源”。中国书法和中国绘画艺术同属中华优秀文化典范，且共同植根中华美学思想、蕴含中华道德精神。\n根据这段文字，对“书画同源”的正确理解为：","options":{"A":"形成于同一时期的艺术样式","B":"相通的笔墨丹青与审美意境","C":"共同的精神内涵与艺术形式","D":"同属于中国的独特文化范式"},"answer":"C","explanation":"“书画同源”位于文段中间，需结合前后文内容分析。根据“书画同源”前“即所谓”可知，前句内容可以对其进行解释，中国书法、绘画艺术实现审美融通、形式共生，即二者具有共同的审美、形式，“书画同源”后介绍了中国书法、绘画艺术同属中华优秀文化典范，根植于共同的思想，蕴含相同的道德精神，故“书画同源”指的是中国书法、绘画艺术具有共同的精神内涵与艺术形式，对应C项。\nA项，“形成于同一时期”文段并未提及，无中生有，排除；\nB项，仅对应“审美融通和形式共生”，表述片面，文段还强调二者根植于共同的思想，蕴含相同的道德精神，排除；\nD项，仅对应“同属中华优秀文化典范”，表述片面，文段还强调二者具有共同的形式，排除。\n故正确答案为C。\n【文段出处】光明日报《【文化评析】荣宝斋350年：珍重传统，不忘创新》","no":55,"missingImage":false}],"count":35,"answerable":35,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"5509774","cat":"数学运算","stem":"在某应急救援作业中，假设每台机器工作效率相同，如果两台机器配合作业，效率分别提高25%，而三台机器同时合作，每台效率各自提高50%。甲、乙、丙三台机器依次投入救援，直到救援完成。已知甲救援时间为60分钟，乙救援时间为甲的\u003cimg data-k=\"54d707f15b45\">，而丙救援时间为乙的\u003cimg data-k=\"5ef3a129e326\">，问仅有一台机器完成该救援作业需要多少分钟？","options":{"A":"120","B":"125","C":"130","D":"150"},"answer":"B","explanation":"赋值甲、乙、丙三台机器单独作业时每分钟的工作效率均为4，则两台机器配合作业时每分钟的工作效率之和为\u003cimg data-k=\"bb8fcf4696ed\">，三台机器同时合作时每分钟的工作效率之和为\u003cimg data-k=\"fc14bc94a3c3\">。根据题意，甲救援时间为60分钟，乙救援时间为\u003cimg data-k=\"9be462c566bc\">分钟，丙救援时间为\u003cimg data-k=\"497135bc3ce3\">分钟，则甲单独作业的时间为60-30=30分钟，甲、乙两台机器配合作业的时间为30-10=20分钟，甲、乙、丙三台机器同时合作作业的时间为10分钟，则该救援作业的工作总量为4×30+10×20+18×10=500，故仅有一台机器完成该救援作业需要的时间为500÷4=125分钟。\n故正确答案为B。","no":56,"missingImage":false},{"type":"question","qid":"5509823","cat":"数学运算","stem":"10名志愿者准备将村民们刚采摘的一堆西瓜平均装上甲、乙两辆运输车，西瓜总数正巧满足每个村民采摘的西瓜个数都等于该村村民数。志愿者们先每人抱一个西瓜放到甲车上，然后每人抱一个西瓜放到乙车上，依次轮流进行，直到所剩西瓜少到容易清点时再平分。当最后1次把10个西瓜放到甲车后，发现所剩西瓜不足10个，于是，不得不从甲车抱出几个与所剩西瓜一起放到乙车上，此时刚好两车所装西瓜一样多。问最后从甲车拿出几个西瓜？","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"B","explanation":"根据题干信息：西瓜总数正巧满足每个村民采摘的西瓜个数都等于该村村民数，可知西瓜总数为平方数；根据题干信息：最后甲、乙两车所装西瓜一样多，可知西瓜总数为偶数；且由题意可知西瓜总数大于10。所以可从符合条件的数据由小到大依次代入：\n当西瓜总数为16时，最后甲、乙两车各装西瓜的数量\u003cimg data-k=\"5a4124d6774a\">个，则需从甲车拿出2个西瓜放到乙车。\n故正确答案为B。","no":57,"missingImage":false},{"type":"question","qid":"5509855","cat":"数学运算","stem":"某地突发森林火灾，现有甲、乙两支消防队离火灾发生地距离相同，但路况不同，假设两支队伍接到命令后同时出发，并且按照一定速度匀速赶往火灾现场参与救援。已知当甲消防队走了\u003cimg data-k=\"5ef3a129e326\">路程时，乙消防队走了9公里，当乙消防队走了\u003cimg data-k=\"5ef3a129e326\">路程时，甲消防队走了16公里，问甲消防队到达目的地时，乙消防队距离目的地还有多少公里？","options":{"A":"9","B":"12","C":"27","D":"36"},"answer":"A","explanation":"设甲、乙两队离火灾发生地的距离均为S公里，当时间一定时，路程和速度成正比，根据题意可得\u003cimg data-k=\"3faa849b61ed\">，解得S=36。根据“当甲消防队走了\u003cimg data-k=\"5ef3a129e326\">路程时，乙消防队走了9公里”可得，甲消防队到达目的地时，乙消防队走了3×9=27公里，距离目的地还有36-27=9公里。\n故正确答案为A。","no":58,"missingImage":false},{"type":"question","qid":"5509486","cat":"数学运算","stem":"某学院有新生两百多人，将学生从1开始依次编号，选取编号为3的倍数的学生，正好构成新生运动会开幕式方队，选取编号为m（3＜m＜10，且m为整数）的倍数的学生，恰好构成闭幕式方队，问该学院新生人数有多少人？","options":{"A":"242","B":"243","C":"245","D":"246"},"answer":"C","explanation":"根据题意，选取编号为3的倍数的新生正好构成开幕式方队，方队的人数应为平方数。代入选项，B、C两项除以3的商均为81，即编号为3的倍数的新生有81人，81是平方数，符合题意；A、D两项除以3的商分别为80、82，均不是平方数，排除。\n选取编号为m的倍数的新生，恰好构成闭幕式方队，即新生人数除以m的商仍为平方数。3&lt;m&lt;10，且m为整数，则当m=4时，代入B、C两项，除以4的商分别为60、61，均不为平方数，不符合题意；当m=5时，代入B、C两项，除以5的商分别是48、49，48不是平方数，49为平方数，故C项符合题意。\n故正确答案为C。","no":59,"missingImage":false},{"type":"question","qid":"5509500","cat":"数学运算","stem":"某高校学生会选拔乡村支教志愿者，初试合格者中，语文类5名，数学类6名，文体类4名，从中选取9名志愿者，但每类至少要选2名。问就9名志愿者的科目类别构成而言，共有几种选拔方式？","options":{"A":"6","B":"7","C":"8","D":"9"},"answer":"D","explanation":"根据题干“就9名志愿者的科目类别构成而言”，可知本题需按照科目选人，即只考虑每个科目的志愿者人数。结合条件“每类至少要选2名”，则每类先选2名志愿者，共6名；还需要再选3名志愿者，采用枚举法：\n\u003cimg data-k=\"10cd839ec534\" style=\"max-width:573px\">\n因此，共有9种选拔方式。\n方法二：将9名志愿者的构成情况分类讨论如下：\n①按照(2、2、5)的构成方式：从三类里随机选择一类，选5名志愿者, 另外两类各2名。由于文体类只有4名，故只能从语文类和数学类选择，则情况数有\u003cimg data-k=\"629f7f5df0db\">种；\n②按照(2、3、4)的构成方式：从三类里分别选2名、3名和4名志愿者，全排列即可，则情况数有\u003cimg data-k=\"3265e7550fa3\">种；\n③按照(3、3、3)的构成方式：每类均选3名，情况数只有1种。\n综上，符合题意的选拔方式共有2+6+1=9种。\n故正确答案为D。","no":60,"missingImage":false},{"type":"question","qid":"5509541","cat":"数学运算","stem":"一家三口年龄各不相同，今年爸爸与妈妈年龄之和是孩子年龄的8倍，而10年后，爸爸与妈妈年龄之和为孩子年龄的5倍。今年爸爸、妈妈的年龄在各种可能组合中乘积最大，问今年妈妈的年龄可能是多少岁？","options":{"A":"39","B":"40","C":"50","D":"51"},"answer":"A","explanation":"设今年爸爸与妈妈年龄之和为x岁，孩子年龄为y岁，则\u003cimg data-k=\"6afef29892bd\">，解得y=10，所以今年爸爸与妈妈年龄之和为80岁。\n方法一：根据结论“当两数和为定值时，两数越接近其乘积越大”，又已知“一家三口年龄各不相同”，故爸爸为41岁，妈妈为39岁时，其年龄在各种组合中乘积最大。\n方法二：今年爸爸与妈妈年龄之和为80岁。\n代入A项，妈妈今年39岁，爸爸今年41岁，其年龄乘积为1599；\n代入B项，妈妈今年40岁，爸爸今年也为40岁，与题干条件矛盾，排除；\n代入C项，妈妈今年50岁，爸爸今年30岁，其年龄乘积为1500＜1599，排除；\n代入D项，妈妈今年51岁，爸爸今年29岁，其年龄乘积为1479＜1599，排除。\n故正确答案为A。","no":61,"missingImage":false},{"type":"question","qid":"5509543","cat":"数学运算","stem":"一辆出租车的计价器出现故障，显示屏上保留了一个两位数，无法清除，但还能按行驶路程准确地将应付的车费累加上去。小王乘坐该车匀速行驶了2小时，当行驶1小时的时候，计价器上的两个数字刚好交换了位置，在2小时的时候，计价器上的两个数字又交换了位置，但他们中间多了一个0。如车费按里程计，问小王应付多少元车费？","options":{"A":"82","B":"86","C":"90","D":"95"},"answer":"C","explanation":"根据题意，设显示屏最开始保留的两位数为xy，其数值大小为10x+y；\n方法一：由于车辆匀速行驶，相同时间内行驶的路程一致且车费金额相等。那么1小时后计价器显示yx，其数值为10y+x；再过1小时后计价器显示x0y，其数值为100x+y。根据金额相等可得10y+x-（10x+y）=100x+y-（10y+x），解得y=6x，由于x、y取值为1~9，则x=1，y=6。所以车费金额为106-16=90元。\n方法二：由于最终显示器上显示的数值为100x+y，则需要支付的车费为100x+y-（10x+y）=90x，即车费金额为90的整数倍，只有C项符合。\n故正确答案为C。","no":62,"missingImage":false},{"type":"question","qid":"5509829","cat":"数学运算","stem":"某围棋队的两位选手小李与小张决定进行1次围棋比赛，两人轮流先手开局，第一局小李先手开局。甲、乙两人分别记录了全程比赛，均显示共比赛18局，结果为10∶8。甲的记录显示为：小李胜10局，小张胜8局，且先手者共胜8局，但乙的记录显示为：先手者共胜6局。问甲、乙两人的记录结果是：","options":{"A":"甲错乙对","B":"甲错乙错","C":"甲对乙错","D":"甲对乙对"},"answer":"B","explanation":"根据题意可知，小李与小张共比赛18局，两人均先手9局，且小张共胜8局。设小李先手时共胜x局，小张先手时共胜y局，则小李先手时小张共胜8-y局。根据题意可列方程：x+8-y=9，整理得：x-y=1。根据奇偶特性，x与y的差值为奇数，则x与y的和也为奇数，即先手者胜的比赛局数（x+y）为奇数，故甲、乙两人的记录结果均错误。\n故正确答案为B。\n注：本题并未明确指出10：8为小李比小张，但两人不论是谁获胜10局均不影响做题结果。","no":63,"missingImage":false},{"type":"question","qid":"5509836","cat":"数学运算","stem":"某地计划在连接甲镇和乙镇的长度为60公里的公路上安装限速标志和测速仪器。具体方案是：从距离甲镇3公里处开始安装限速标志，然后每隔4公里再设置一个限速标志；从8公里处开始安装测速仪器，然后每隔9公里再设置一个测速仪器。假设单独安装一个限速标志费用为500元，单独安装一个测速仪器费用为800元，如果限速标志和测速仪刚好在同一个地点安装，则可以节约安装费用，此时安装两种设备总共只需要1000元。问最终安装总费用是多少元？","options":{"A":"10600","B":"11200","C":"12000","D":"12300"},"answer":"C","explanation":"根据题意可知，第a个（\u003cimg data-k=\"801aacac743b\">）限速标志安装的位置可表示为距离甲镇3+4（a-1）=（4a-1）公里处，第b个（\u003cimg data-k=\"89c56403798b\">）测速仪器安装的位置可表示为距离甲镇8+9（b-1）=（9b-1）公里处。根据同余定理，第n个（\u003cimg data-k=\"4ee661eb8f98\">）同一地点安装限速标志和测速仪器的位置距离甲镇（36n-1）公里处（36为4、9的最小公倍数）。根据“连接甲镇和乙镇的长度为60公里的公路”，可列式\u003cimg data-k=\"72fb9755eeb0\">，解得\u003cimg data-k=\"cb24553105a7\">，则限速标志可安装15个；\u003cimg data-k=\"c23a6c8c8c4d\">，解得\u003cimg data-k=\"4f72a74bd8af\">，则测速仪器可安装6个；\u003cimg data-k=\"173f30b35aaf\">，解得\u003cimg data-k=\"29ff7dafbea6\">，则只有1个地点可同时安装限速标志和测速仪器（距离甲镇35公里处）。故最终安装总费用为（15-1）×500+（6-1）×800+1×1000=12000元。\n故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"5509542","cat":"数学运算","stem":"某商场一楼到二楼有一部自动扶梯匀速上行，甲、乙二人共同乘梯上楼。甲在乘扶梯同时匀速登梯，乙在恰好半程后，也开始匀速登梯，但登梯速度是甲的\u003cimg data-k=\"54d707f15b45\">。甲乙二人分别登了36级、12级到达二楼，问这部扶梯静止时一楼到二楼的级数是多少？","options":{"A":"48","B":"60","C":"66","D":"72"},"answer":"D","explanation":"根据题意，甲乙二人均是从一楼沿扶梯上二楼，故路程相等，即总级数相等，扶梯的总级数=人行走的级数+扶梯运行的级数。设甲的速度为2v，乙的速度为v，扶梯的速度为\u003cimg data-k=\"77a1ec12c661\">，即\u003cimg data-k=\"4770edbdf135\">，整理可得：\u003cimg data-k=\"47b998210d2d\">，解得\u003cimg data-k=\"a2fd9d82f106\">，故扶梯的总级数\u003cimg data-k=\"8be428276123\">。\n故正确答案为D。","no":65,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"5509938","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"46b38868550b\" style=\"max-width:550px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"题干图形无明显位置规律和属性规律，考虑数量规律。观察发现，题干图形均由灰色小方块和白色小方块构成，优先观察灰色小方块数量，数量依次为2、1、2、1、2，故？处图形应有1个灰色小方块，只有B项符合。\n故正确答案为B。","no":66,"missingImage":false},{"type":"question","qid":"5509937","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"21d3c1cfe30e\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，无明显属性规律，考虑数量规律。题干图形均为多面体，优先考虑数面数量，图1至图3的面数量分别为6、8、4，均为偶数，故？处图形面数量也应为偶数，A项面数量为5，B项面数量为9，C项面数量为5，D项面数量为6，只有D项满足。\n故正确答案为D。","no":67,"missingImage":false},{"type":"question","qid":"5509552","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"5c51fc2e09af\" style=\"max-width:500px\">","options":{"A":"①②③，④⑤⑥","B":"①②⑥，③④⑤","C":"①②④，③⑤⑥","D":"①④⑥，②③⑤"},"answer":"B","explanation":"本题为分组分类题目。元素组成不同，无明显属性规律，考虑数量规律。每个图形均由黑圆和白圆构成，且有部分黑圆和白圆被分隔开，因此考虑数部分数。发现图①②⑥白圆部分均为两部分，图③④⑤白圆部分均为三部分，故图①②⑥为一组，图③④⑤为一组。\n故正确答案为B。","no":68,"missingImage":false},{"type":"question","qid":"5509799","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"2d5da7649679\" style=\"max-width:550px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"解法一：元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，题干图形均由\u003cimg data-k=\"9ab89eaba432\" style=\"max-width:48px\">和\u003cimg data-k=\"4c9e05278415\" style=\"max-width:47px\">2种小元素构成，但整体小元素的种类和数量无规律，考虑元素换算。根据换算公式“图1+图3=2×图2”得出：1个\u003cimg data-k=\"4c9e05278415\" style=\"max-width:47px\">=2个\u003cimg data-k=\"9ab89eaba432\" style=\"max-width:48px\">，换算后题干图形\u003cimg data-k=\"9ab89eaba432\" style=\"max-width:48px\">的数量分别为1、2、3、4、5，故“？”处图形应有6个\u003cimg data-k=\"9ab89eaba432\" style=\"max-width:48px\">，换算后只有A项符合。\n解法二：元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，题干出现多个箭头，考虑箭头数量，题干图形箭头数量依次为2、3、4、5、6，故“？”处图形应有7个箭头，只有D项符合。\n注：解法一的元素换算针对的是图形整体，解法二的箭头数量针对的是部分图形，在图形规律中整体规律优于部分规律，且解法二的部分箭头可看作箭头重合，故粉笔更倾向于解法一。\n故正确答案为A。","no":69,"missingImage":false},{"type":"question","qid":"5509801","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"98f99c4f2308\" style=\"max-width:450px\">","options":{"A":"①②③，④⑤⑥","B":"①②⑤，③④⑥","C":"①②⑥，③④⑤","D":"①④⑥，②③⑤"},"answer":"D","explanation":"本题为分组分类题目。元素组成不同，无明显属性规律，考虑数量规律。观察发现，题干图①、图⑤存在端点，图③为“田”字变形图，图⑥为“日”字变形图，考虑笔画数，图①④⑥均为一笔画图形，图②③⑤均为两笔画图形。即图①④⑥为一组，图②③⑤为一组。\n故正确答案为D。","no":70,"missingImage":false},{"type":"question","qid":"5509593","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性：\n\u003cimg data-k=\"210ea46e4b4a\" style=\"max-width:508px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相同，优先考虑位置规律。观察上方第一组图形发现，图1以图2为轴经过左右翻转得到图3，图3再以图4为轴经过上下翻转得到图5。下方第二组图形应用此规律，图1以图2为轴经过上下翻转得到图3，图3再以图4为轴经过左右翻转得到？处图形。只有B项符合。\n故正确答案为B。","no":71,"missingImage":false},{"type":"question","qid":"5509554","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"bdf507785b2d\" style=\"max-width:653px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"观察发现，题干图形均存在灰色三角形，且灰色三角形数量依次递增，数量分别为1、2、3、4，故？处图形灰色三角形数量应为5，排除A项。继续观察发现，灰色三角形有明显的位置移动，故考虑灰色三角形的位置规律。题干图形灰色三角形每次顺时针移动2格且在最前面增加一个灰色三角形，只有D项符合。\n\u003cimg data-k=\"6baae606bfe0\" style=\"max-width:610px\">\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"5509940","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"20e7c4fa7cab\" style=\"max-width:671px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形线条交叉比较明显且每幅图形均有外框，优先考虑数图形内部交点，其数量依次为3、4、？、6、7，故？处图形内部交点数为5，排除C项。加之题干每幅图形均有外框，考虑外框边的数量，发现外框边的数量依次为3、4、？、6、7，即图形外框边的数量与图形内部交点的数量相同，只有B项符合。\n故正确答案为B。","no":73,"missingImage":false},{"type":"question","qid":"5509547","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"80fad57fd241\" style=\"max-width:509px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"思路一：图形组成不同，优先考虑数量规律。题干图形中第一、二幅图存在单一曲线，考虑曲线数。观察发现，题干每幅图形均只有1条曲线，故？处图形也应只有1条曲线，只有A项符合。\n思路二：图形组成不同，优先考虑数量规律。题干图形均由多个字母元素组成，考虑元素的种类或个数。观察发现，题干每幅图形均由4种元素组成，故？处图形也应由4种元素组成，只有A项符合。\n思路三：图形组成不同，优先考虑数量规律。题干图形均出现封闭面，考虑面数量。观察发现，题干每幅图中含有封闭面的字母数依次为0、1、2，故“？”处应选择含有封闭面的字母数为3的图形，只有B项符合。\n注：本题考点有争议，在思路三中，题干图2中含有封闭面的字母为全封闭图形，题干图3中含有封闭面的字母为半开半闭图形，图形规律并不严格统一。争议题主要学习解题思维即可，考场上根据图形特征优先想到哪个规律选哪个，无需纠结。\n故正确答案为A。","no":74,"missingImage":false},{"type":"question","qid":"5509800","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"d9452bde4cac\" style=\"max-width:550px\">","options":{"A":"254","B":"235","C":"432","D":"215"},"answer":"A","explanation":"题干图形分为上下两组，观察发现，第一组图形均为字母，且沿箭头方向前一个图形中最右边的字母都在相邻的后一个图形的最左边。第二组图形均为数字，且沿箭头方向前一个图形中最右边的数字都在相邻的后一个图形的最左边，依此规律，？处所填数字最左边应为2，最右边应为4，只有A项符合。\n故正确答案为A。","no":75,"missingImage":false},{"type":"question","qid":"5509936","cat":"定义判断","stem":"新市民主要是指因本人创业就业、子女上学、投靠子女等原因来到城镇常住，未获得当地户籍或获得当地户籍不满三年的各类群体，包括但不限于进城务工人员、新就业大中专毕业生等，目前约有三亿人。\n根据上述定义，下列画横线部分不属于新市民的是:","options":{"A":"\u003cu>小张\u003c/u>2017年从乡下来到省会城市做快递员，理想是在本市安家立业","B":"\u003cu>老李夫妇\u003c/u>在其女儿读书的大学附近租门面做生意，不打算回农村老家了","C":"\u003cu>小王\u003c/u>2015年到市里工作，户口随即解决，今年想把乡下父母接来同住","D":"\u003cu>黄婆婆\u003c/u>体弱多病，她女儿是大学副教授，把黄婆婆从农村接到自己家里治病养老"},"answer":"C","explanation":"第一步：找出定义关键词。\n“因本人创业就业、子女上学、投靠子女等原因来到城镇常住”、“未获得当地户籍或获得当地户籍不满三年”。\n第二步：逐一分析选项。\nA项：小张从乡下来到省会城市做快递员，说明是因本人就业来到城镇常住，符合“因本人创业就业、子女上学、投靠子女等原因来到城镇常住”，理想是在本市安家立业，说明目前未获得当地户籍，符合“未获得当地户籍或获得当地户籍不满三年”，符合定义，排除；\nB项：老李夫妇在女儿读书的大学附近做生意，不打算回农村老家，说明是因子女上学来到城镇常住，符合“因本人创业就业、子女上学、投靠子女等原因来到城镇常住”，符合定义，排除；\nC项：小王到市里工作，说明是因本人就业来到城镇常住，符合“因本人创业就业、子女上学、投靠子女等原因来到城镇常住”，但2015年工作后户口随即解决，说明获得当地户籍已满三年，不符合“未获得当地户籍或获得当地户籍不满三年”，不符合定义，当选；\nD项：黄婆婆从农村到女儿家里治病养老，说明是因投靠子女来到城镇常住，符合“因本人创业就业、子女上学、投靠子女等原因来到城镇常住”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":76,"missingImage":false},{"type":"question","qid":"5509588","cat":"定义判断","stem":"结构性进入壁垒是指企业自身无法支配的、外生的，由产品技术特点、资源供给条件、社会法律制度、政府行为以及消费者偏好等因素所形成的壁垒。策略性进入壁垒是指产业内的企业为保持在市场上的主导地位，获取垄断利润，利用自身的优势通过一系列的有意识的策略性行为构筑起的防止潜在进入者进入的壁垒。\n根据上述定义，下列属于策略性进入壁垒的是：","options":{"A":"我国拍摄一部动画片动辄需上百万、数千万人民币资金，且产业链尚未完善，使得规模较小的甲动画投资公司只能望而却步","B":"乙国汽车厂商在推出一款新车型之前，必须先由政府指定机构对车辆性能进行严格检验，未经检验或未通过检验的车型不得生产","C":"丙公司在疫情期间看到线上卖菜的商机，在某市设置了多个卖点。但因许多行业巨头已在该城市运营多年，导致丙公司迟迟打不开市场","D":"丁乳制品公司在某地方市场占有量极大，随着该地乳制品消费量增加，小公司纷纷试水。在此情况下，丁公司经常靠低价促销来巩固市场地位"},"answer":"D","explanation":"第一步：找出定义关键词。\n结构性进入壁垒：“企业自身无法支配的、外生的”、“由产品技术特点、资源供给条件、社会法律制度、政府行为以及消费者偏好等因素所形成的壁垒”；\n策略性进入壁垒：“产业内的企业为保持在市场上的主导地位，获取垄断利润”、“利用自身的优势”、“通过有意识的策略性行为”、“构筑防止潜在进入者进入的壁垒”。\n第二步：逐一分析选项。\nA项：动画片成本高、产业链尚未完善等问题是“产品技术特点、资源供给条件等形成的壁垒”，符合“结构性进入壁垒”定义，不符合“策略性进入壁垒”定义，排除；\nB项：推出新车型前需先由政府指定机构对车辆性能进行严格检验，属于由“政府行为形成的壁垒”，符合“结构性进入壁垒”定义，不符合“策略性进入壁垒”定义，排除；\nC项：丙公司难以打开市场是因为许多行业巨头已在该城市运营多年，这说明丙公司不是行业巨头，不具备在市场上的主导地位，不符合“产业内的企业为保持在市场上的主导地位，获取垄断利润”，不符合“策略性进入壁垒”定义，排除；\nD项：丁公司市场占有量极大，符合“产业内的企业为保持在市场上的主导地位，获取垄断利润”，经常靠低价促销来巩固市场地位，符合“利用自身的优势”、“通过有意识的策略性行为”、“构筑防止潜在进入者进入的壁垒”，符合“策略性进入壁垒”定义，当选。\n故正确答案为D。","no":77,"missingImage":false},{"type":"question","qid":"5509550","cat":"定义判断","stem":"档案管理是指档案馆（室）以维护档案的真实、完整、准确、安全，便于社会和其他各方面利用为原则，对档案进行收集、整理、保管、鉴定、统计并提供利用的各种业务工作。按管理门类分为文书档案管理和专业档案管理；按档案载体形式分为传统档案管理和电子档案管理。\n根据上述定义，下列属于档案管理的是：","options":{"A":"甲档案馆近期向社会开放经济、教育、科技、文化类档案查询","B":"乙知识网站从1999年开始向用户提供有偿资料查阅和下载服务","C":"丙资料库收录了从1995年至今的100多个社科专题全文复印资料","D":"丁单位的档案室决定建立档案工作责任制，依法健全档案管理制度"},"answer":"A","explanation":"第一步：找出定义关键词。\n“档案馆（室）”、“对档案进行收集、整理、保管、鉴定、统计并提供利用的各种业务工作”。\n第二步：逐一分析选项。\nA项：甲档案馆向社会开放各类档案查询，是对档案提供利用，符合“档案馆（室）”、“对档案进行收集、整理、保管、鉴定、统计并提供利用的各种业务工作”，符合定义，当选；\nB项：知识网站不是档案馆（室），不符合“档案馆（室）”，不符合定义，排除；\nC项：资料库不是档案馆（室），不符合“档案馆（室）”，不符合定义，排除；\nD项：建立档案工作责任制和依法健全档案管理制度，是对工作方法和制度的改进，不符合“对档案进行收集、整理、保管、鉴定、统计并提供利用的各种业务工作”，不符合定义，排除。\n故正确答案为A。","no":78,"missingImage":false},{"type":"question","qid":"5509661","cat":"定义判断","stem":"环境知觉是人们在环境外观感觉的基础上对地理环境的整体认识和综合解释的过程，是环境刺激与个体已有知识经验相互作用的结果。环境认知是人们对环境信息再现大脑后的认识，它是人们对地理环境识记再现的一种形态，当人们对以前识记的地理环境再度感知的时候，觉得熟悉，仍能认识，经过进一步分析思考后能够做出知觉判断。\n根据上述定义，下列涉及环境认知的是：","options":{"A":"老杨是生活在一座超大城市的老居民，经常在没有地图导航的情况下从城市北边开车到南边去爬山","B":"小周是建筑设计师，认为红砖建筑直接暴露建筑材料是“纯粹”的表现，但小李却认为建筑物不加装修，外观蹩脚","C":"小朱平时喜欢观看介绍风景名胜的纪录片，特别是关于九寨沟的反复看了好多遍。当她第一次去九寨沟看到那些美景时，一种强烈的熟悉感涌上心头","D":"小王是专业的地图测绘员，工作时开着装有摄像头和激光雷达的测绘车，对所到之处的街景进行测绘后获得测绘数据，最终形成一份高精度的数字化地图"},"answer":"A","explanation":"第一步：找出定义关键词。\n环境知觉：“在环境外观感觉的基础上”、“对地理环境的整体认识和综合解释”、“环境刺激与个体已有知识经验相互作用”；\n环境认知：“人们对环境信息再现大脑后的认识”、“对以前识记的地理环境再度感知”、“觉得熟悉，仍能认识，经过进一步分析思考后能够做出知觉判断”。\n第二步：逐一进行分析。\nA项：老杨是一座超大城市的老居民，经常在没有地图导航的情况下从北边开车到南边去爬山，符合“对以前识记的地理环境再度感知”、“觉得熟悉，仍能认识，经过进一步分析能做出知觉判断”，符合“环境认知”定义，当选；\nB项：小周是建筑设计师，认为红砖建筑应该暴露建筑材料，但小李却认为建筑物不加装修，外观蹩脚，小周和小李对于建筑物是否加装修都有自己的看法，符合“在环境外观感觉的基础上”、“对地理环境的整体认识和综合解释”、“环境刺激与个体已有知识经验相互作用”，符合“环境知觉”定义，不符合“环境认知”定义，排除；\nC项：小朱看了很多遍九寨沟的纪录片，当她第一次去九寨沟看到那些美景时，觉得很熟悉，只能说明因为之前总是看九寨沟的纪录片，这一次身临其境了觉得很熟悉，但并没有提到熟悉了之后进一步分析做出知觉判断，不符合“经过进一步分析能做出知觉判断”，不符合“环境认知”定义，排除；\nD项：小王对所到之处的街景进行测绘后获得测绘数据，最终形成数字化地图，不符合“人们对环境信息再现大脑后的认识”、“对以前识记的地理环境再度感知”、“觉得熟悉，仍能认识，经过进一步分析能做出知觉判断”，不符合“环境认知”定义，排除。\n故正确答案为A。","no":79,"missingImage":false},{"type":"question","qid":"5509551","cat":"定义判断","stem":"采集经济指人类以采摘自然界现存植物为生的经济。原始社会初期，人类生产能力低下，只能用双手和石块、树枝等简陋工具采集植物果实或根茎等作为食物。随着人类对植物效用和生长规律认识逐步提高和对生产工具的改进，出现了大规模人工或机器栽种采集的现代采集经济。\n根据上述定义，下列不属于采集经济的是：","options":{"A":"主干道两旁的树木被修剪整理维护一新，修剪垃圾由园林部门清理利用","B":"大棚种西瓜，每棚收入1.2万元左右，小李今年种了9棚能收入10万多元","C":"山林里生长着许多可食用菌，一些周边农户上山采摘供自身食用及售卖","D":"茶园的茶树已抽出鲜嫩的芽尖，采茶姑娘们穿梭其中，忙着采摘春茶"},"answer":"A","explanation":"第一步：找出定义关键词。\n“人类以采摘自然界现存植物为生的经济”。\n第二步：逐一分析选项。\nA项：园林部门修剪整理维护主干道两旁的树木，而非采摘，树木垃圾只是修剪的产物，不符合“人类以采摘自然界现存植物为生的经济”，不符合定义，当选；\nB项：小李采摘、销售西瓜来获利，符合“人类以采摘自然界现存植物为生的经济”，符合定义，排除；\nC项：农户采摘山林里的可食用菌来食用或销售获利，符合“人类以采摘自然界现存植物为生的经济”，符合定义，排除；\nD项：采茶姑娘们采摘茶园里的春茶来销售获利，符合“人类以采摘自然界现存植物为生的经济”，符合定义，排除。\n本题为选非题，故正确答案为A。\n注：本题C项中的可食用菌，严格来讲应该属于菌类，不是植物。但A项没有关键词符合定义，C项除了客体其他都符合，因此对比择优，选到A项。","no":80,"missingImage":false},{"type":"question","qid":"5509558","cat":"定义判断","stem":"无效运输指的是没有任何经济社会效益的运输，具体是指物资中所包含的无使用价值的那部分杂质的运输，这种运输不仅浪费交通运力，而且消费该物资的单位或企业也得不到保质保量的产品。\n根据上述定义，下列属于无效运输的是：","options":{"A":"某国矿产资源分布不均，由此形成北矿南运、西矿东调的长距离运输","B":"原油中掺杂有超量水分并投入使用时，会增加机器设备被磨损腐蚀风险","C":"运输的原煤中有25%是不能用于燃烧的矸石和灰分，造成铁路运力的耗费","D":"向海外运送瓷器时，选择了成本较高的航空运输，没有发挥出水路运输的优势"},"answer":"C","explanation":"第一步：找出定义关键词。\n“没有任何经济社会效益的运输”、“物资中所包含的无使用价值的那部分杂质”、“浪费交通运力”。\n第二步：逐一分析选项。\nA项：北矿南运、西矿东调的长距离运输，体现了矿产资源的空间调配，有利于社会经济发展，不符合“没有任何经济社会效益的运输”，不符合定义，排除；\nB项：原油中掺杂有超量水分会增加机器设备被磨损腐蚀风险，但没有体现对原油中掺杂的超量水分的运输，不符合“没有任何经济社会效益的运输”，不符合定义，排除；\nC项：运输的原煤中有25%是不能用于燃烧的矸石和灰分，符合“物资中所包含的无使用价值的那部分杂质”，造成铁路运力的耗费，符合“浪费交通运力”，也符合“没有任何经济社会效益的运输”，符合定义，当选；\nD项：向海外运送瓷器时，选择了成本较高的航空运输，没有发挥出水路运输的优势，但不管选择哪种运输方式，运送的瓷器会带来经济或社会效益，不符合“没有任何经济社会效益的运输”，不符合定义，排除。\n故正确答案为C。","no":81,"missingImage":false},{"type":"question","qid":"5509555","cat":"定义判断","stem":"数字产业化，就是通过现代信息技术的市场化应用，将数字化的知识和信息转化为生产要素，通过信息技术创新、管理创新和商业模式创新融合，不断催生新产业、新业态、新模式，最终形成数字产业链和产业集群。\n根据上述定义，下列属于数字产业化的是：","options":{"A":"当下各类打车软件的推出，极大方便了人们的出行","B":"人工智能在汽车生产线中得到广泛应用，极大提升了生产效率","C":"物流公司运用仓储机器人分拣包裹，既减少了人力成本又提升了效率","D":"故宫博物院推出的“数字故宫”，让世界各地观众身临其境体验到参观故宫的乐趣"},"answer":"A","explanation":"第一步：找出定义关键词。\n“现代信息技术的市场化应用”、“将数字化的知识和信息转化为生产要素”、“信息技术创新、管理创新和商业模式创新融合”、“形成数字产业链和产业集群”。\n第二步：逐一分析选项。\nA项：各类打车软件的推出方便人们出行，打车软件符合“现代信息技术的市场化应用”、“将数字化的知识和信息转化为生产要素”，符合定义，当选；\nB项：人工智能在汽车生产线中得到广泛使用，说明在现代产业中运用到了人工智能，并非是运用人工智能而创新产业链，不符合“将数字化的知识和信息转化为生产要素”、“形成数字产业链和产业集群”，不符合定义，排除；\nC项：物流公司运用仓储机器人分拣包裹，说明在物流产业中运用到了智能机器，并非是运用人工智能而创新产业链，不符合“将数字化的知识和信息转化为生产要素”、“形成数字产业链和产业集群”，不符合定义，排除；\nD项：故宫博物院推出“数字故宫”，“数字故宫”是传统旅游业融入信息技术而做的创新，是对传统行业的创新和升级，不符合“将数字化的知识和信息转化为生产要素”、“形成数字产业链和产业集群”，不符合定义，排除。\n故正确答案为A。\n\u003cimg data-k=\"c1e75c678f5d\" style=\"max-width:700px\">","no":82,"missingImage":false},{"type":"question","qid":"5509789","cat":"定义判断","stem":"草地土壤是草原、草甸和草坪等草地植被下发育成的土壤。林地土壤是天然林、次生林和人工林等林地植被下发育成的土壤。农田土壤是人类开垦利用，通过耕种、施肥、灌排等措施长期种植农作物的土壤。\n根据上述定义，下列属于农田土壤的是：","options":{"A":"牧民甲今年把自家承包草场的部分土地深翻了一遍以期牧草丰收","B":"农户乙在自家屋后的荒坡上挖土开凿了一个水池，用于积蓄雨水","C":"果农丙利用自家承包的苹果山林土地播种枸杞，产量较为可观","D":"牧民丁在其草场一处湖边垦荒近千亩土地，年年种植小麦和玉米"},"answer":"D","explanation":"第一步：找出定义关键词。\n草地土壤：“草原、草甸和草坪等”、“草地植被下发育成的土壤”；\n林地土壤：“天然林、次生林和人工林等”、“林地植被下发育成的土壤”；\n农田土壤：“人类开垦利用”、“通过耕种、施肥、灌排等措施”、“长期种植农作物的土壤”。\n第二步：逐一分析选项。\nA项：牧民将承包的草场深翻后以期牧草丰收，符合“草原、草甸和草坪等”、“草地植被下发育成的土壤”，符合“草地土壤”定义，不符合“农田土壤”定义，排除；\nB项：农户在自家屋后的荒坡挖水池用来蓄水，荒坡不符合“通过耕种、施肥、灌排等措施”、“长期种植农作物的土壤”，不符合“农田土壤”定义，排除；\nC项：果农利用自家承包的苹果山林土地播种枸杞，苹果山林土地符合“天然林、次生林和人工林等”、“林地植被下发育成的土壤”，符合“林地土壤”定义，不符合“农田土壤”定义，排除；\nD项：牧民在草场一处湖边垦荒土地，年年种植小麦和玉米，垦荒土地符合“人类开垦利用”，年年种植小麦和玉米符合“通过耕种、施肥、灌排等措施”、“长期种植农作物的土壤”，符合“农田土壤”定义，当选。\n故正确答案为D。","no":83,"missingImage":false},{"type":"question","qid":"5509592","cat":"定义判断","stem":"情绪智力是指个体察觉、处理自我及他人情绪，并利用情绪信息指导行动的能力。\n根据上述定义，下列属于情绪智力的是：","options":{"A":"考试时由于过度紧张，小张脑子一片空白，经过一番调整，终于可以平静地答题了","B":"小赵在路上遇到一条恶狗，吓得她浑身冒冷汗，还好她强装镇定，恶狗终于走开了","C":"小钱与室友发生了矛盾并心生不满，但当她了解到事情原委后，立即主动向室友诚恳道歉","D":"列车乘务员小李被旅客无端指责后，仍然克制地向旅客耐心解释，最终帮旅客解决了问题"},"answer":"D","explanation":"第一步：找出定义关键词。\n“个体察觉、处理自我及他人情绪”、“利用情绪信息指导行动”。\n第二步：逐一分析选项。\nA项：小张平复自己紧张的情绪后答题，只是小张对自己情绪的处理，没有体现如何处理他人的情绪，不符合“个体察觉、处理自我及他人情绪”，不符合定义，排除；\nB项：小赵遇到恶狗后强装镇定，只是小赵对自己情绪的处理，没有体现如何处理他人的情绪，不符合“个体察觉、处理自我及他人情绪”，不符合定义，排除；\nC项：小钱是在得知事情原委后，才向室友道歉，并没有体现出小钱如何处理自己和他人的情绪，不符合“个体察觉、处理自我及他人情绪”，不符合定义，排除；\nD项：小李被旅客无端指责后，仍能克制地向其耐心解释，“克制”是对自己情绪的处理，利用克制住的情绪耐心地向旅客解释，符合“利用情绪信息指导行动”，最终问题得以解决，是对旅客情绪的处理，符合“个体察觉、处理自我及他人情绪”，符合定义，当选。\n故正确答案为D。","no":84,"missingImage":false},{"type":"question","qid":"5509578","cat":"定义判断","stem":"生物多样性评估是指以生物多样性保护和可持续利用为目的而开展的基因、物种和生态系统多样性调查和评价活动。由于生物多样性评估依赖于数据的可获取性，许多情况下受直接测定的限制，人们不得不采取代理指标评估方法，即运用一类与生物多样性及其时空分布具有统计相关性的特殊生物类群或环境因子进行评估的方法。\n根据上述定义，下列体现了生物多样性代理指标评估方法的是：","options":{"A":"利用遥感数据绘制景观图像，评估某地区物种组成的丰富度","B":"采用野生鸟类（或蝴蝶）指数判断某区域生态系统的保护状态","C":"建立物种-面积关系模型，评估某栖息地丧失对特定生物种群的影响","D":"选择地理因子将某区域划分为5个生物大区、7个生物亚区和18个生物群区"},"answer":"B","explanation":"第一步：找出定义关键词。\n生物多样性评估：“以生物多样性保护和可持续利用为目的”、“基因、物种和生态系统多样性调查和评价活动”；\n代理指标评估方法：“与生物多样性及其时空分布具有统计相关性”、“特殊生物类群或环境因子”、“进行评估的方法”。\n第二步：逐一分析选项。\nA项：利用遥感数据绘制景观图，不符合“与生物多样性及其时空分布具有统计相关性”、“特殊生物类群或环境因子”，不符合“生物多样性代理指标评估方法”定义，排除；\nB项：采用野生鸟类（或蝴蝶）指数判断某区域生态系统的保护状态，符合“与生物多样性及其时空分布具有统计相关性”、“特殊生物类群或环境因子”，符合“生物多样性代理指标评估方法”定义，当选；\nC项：评估某栖息地丧失对特定生物种群的影响，不符合“与生物多样性及其时空分布具有统计相关性”、“特殊生物类群或环境因子”，不符合“生物多样性代理指标评估方法”定义，排除；\nD项：选择地理因子将某区域划分，不符合“与生物多样性及其时空分布具有统计相关性”、“特殊生物类群或环境因子”，不符合“生物多样性代理指标评估方法”定义，排除。\n故正确答案为B。","no":85,"missingImage":false},{"type":"question","qid":"5509557","cat":"类比推理","stem":"霜降：秋季","options":{"A":"雨水：春季","B":"大暑：夏季","C":"清明：雨季","D":"冬至：冬季"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n霜降是二十四节气中的秋季节气，且是秋季的最后一个节气，二者是对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：雨水是二十四节气中的春季节气，但春季的最后一个节气是谷雨，而雨水是春季的第二个节气，与题干逻辑关系不一致，排除；\nB项：大暑是二十四节气中的夏季节气，且大暑是夏季的最后一个节气，与题干逻辑关系一致，当选；\nC项：清明是二十四节气中的春季节气，与雨季无关，与题干逻辑关系不一致，排除；\nD项：冬至是二十四节气中的冬季节气，但冬季最后一个节气是大寒，而冬至是冬季的第四个节气，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":86,"missingImage":false},{"type":"question","qid":"5509553","cat":"类比推理","stem":"斤：两：钱","options":{"A":"眼：口：手","B":"年：月：日","C":"天：时：秒","D":"孟：仲：季"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n重量单位包括：斤、两、钱、分。斤、两、钱是重量单位中的三个，三者是并列关系，且三者在重量单位中排列紧密连续。\n第二步：判断选项词语间逻辑关系。\nA项：眼、口、手是身体中的一部分，三者是并列关系，但是三者不存在紧密连续的关系，与题干逻辑关系不一致，排除；\nB项：年、月、日是计时单位中的三个，三者是并列关系，且三者在计时单位中排列紧密连续，与题干逻辑关系一致，当选；\nC项：天、时、秒是计时单位中的三个，三者是并列关系，但是三者在计时单位中的排列并不是紧密连续的（一般连续的顺序是天、时、分、秒），与题干逻辑关系不一致，排除；\nD项：孟、仲、季为兄弟间的长幼排名顺序，三者是并列关系，但是三者在长幼排名顺序上并不是紧密连续的（一般连续的顺序是孟、仲、叔、季），与题干逻辑关系不一致，排除。\n故正确答案为B。","no":87,"missingImage":false},{"type":"question","qid":"5509546","cat":"类比推理","stem":"花匠：修剪：花草","options":{"A":"渔民：捕捞：渔船","B":"医生：住院：病人","C":"农民：播种：土地","D":"学生：阅读：课本"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n题干可以造句为：花匠修剪花草，三个词构成主谓宾结构。\n第二步：判断选项词语间逻辑关系。\nA项：渔民在渔船上捕捞，三个词不是主谓宾结构，与题干逻辑关系不一致，排除；\nB项：病人住院，后两个词构成主谓宾结构，医生治疗病人，第一个词和第三个词构成主宾结构，与题干逻辑关系不一致，排除；\nC项：农民在土地上播种，三个词不是主谓宾结构，与题干逻辑关系不一致，排除；\nD项：学生阅读课本，三个词构成主谓宾结构，与题干逻辑关系一致，当选。\n故正确答案为D。","no":88,"missingImage":false},{"type":"question","qid":"5509556","cat":"类比推理","stem":"奋斗：锤炼：本领","options":{"A":"磨砺：增长：才干","B":"实践：奉献：社会","C":"知识：获取：阅读","D":"思考：智慧：启迪"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n通过奋斗来锤炼本领，第一个词与后两个词构成方式目的的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：通过磨砺来增长才干，第一个词与后两个词构成方式目的的对应关系，与题干逻辑关系一致，保留；\nB项：通过实践来奉献社会，第一个词与后两个词构成方式目的的对应关系，与题干逻辑关系一致，保留；\nC项：通过阅读来获取知识，词语顺序与题干不同，与题干逻辑关系不一致，排除；\nD项：通过思考来启迪智慧，词语顺序与题干不同，与题干逻辑关系不一致，排除。\n对比A、B两项，题干的锤炼本领属于个人能力的提升，A项的增长才干也属于个人能力的提升，而B项的奉献社会不属于个人能力的提升，故A项与题干逻辑关系更一致，当选。\n故正确答案为A。","no":89,"missingImage":false},{"type":"question","qid":"5509621","cat":"类比推理","stem":"春兰：墨兰：兰花","options":{"A":"凤蝶：粉蝶：蝴蝶","B":"春茶：秋茶：茶馆","C":"蔬菜：水果：果蔬","D":"菊花：梅花：花卉"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n春兰和墨兰都是兰花的一种，二者为并列关系，与兰花均为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：凤蝶和粉蝶都是蝴蝶的一种，二者为并列关系，与蝴蝶均为种属关系，与题干逻辑关系一致，保留；\nB项：春茶一般指由越冬后茶树在春天里萌发的芽叶采制而成的茶叶，秋茶一般指由秋天采集的芽叶制成的茶叶，二者为并列关系，但二者与茶馆均不构成种属关系，与题干逻辑关系不一致，排除；\nC项：蔬菜和水果都是食物，二者为并列关系，果蔬包括水果和蔬菜，水果、蔬菜与果蔬均为组成关系，与题干逻辑关系不一致，排除；\nD项：菊花和梅花都是花卉，二者为并列关系，与花卉均为种属关系，与题干逻辑关系一致，保留。\n比较A、D两项，题干中春兰和墨兰均是兰花的细分，A项中凤蝶和粉蝶均是蝴
