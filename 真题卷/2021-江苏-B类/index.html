<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2021-江苏-B类","title":"2021年江苏省公务员录用考试《行测》题（B类）（网友回忆版）","year":"2021","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2741953","cat":"马克思主义","stem":"习近平总书记指出：“要把新时代坚持和发展中国特色社会主义这场伟大社会革命进行好，我们党必须勇于进行自我革命，把党建设得更加坚强有力。”该论断蕴含的哲理是：","options":{"A":"人们在改造客观世界的过程中改造主观世界，通过改造主观世界来改造客观世界","B":"人们在客观规律面前，并不是消极被动的，能够认识和利用规律来改造客观世界","C":"人的意识活动是一个能动的创造性过程，在认识和改造世界中，具有巨大的能动作用","D":"人们在实践中所获得的真理，既是相对的，也是绝对的，是相对性与绝对性统一"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，马克思在《关于费尔巴哈的提纲》中谈到了“环境的改变和人的活动或自我改变的一致”的问题，在人与世界的关系中，随着社会的发展，人自身的改造或人的自我改造就更加重要。不论是个人、团体还是政党，要自觉地实现自我改造，就需要以勇于自我革命的精神打造和锤炼自己，提高自我净化、自我完善、自我革新、自我提高的能力。自我革命是对主观世界的改造，通过改造主观世界，把党建设得更坚强有力，从而更好地改造客观世界，进行好新时代坚持和发展中国特色社会主义这场伟大社会革命。\nB项错误，人在客观规律面前并不是无能为力的，人可以发挥主观能动性，能够认识和利用规律来改造客观世界。但“客观规律”在题干中没有体现。\nC项错误，意识活动具有巨大的能动作用，具有创造性，但“意识活动的能动作用”在题干中没有体现。\nD项错误，真理是绝对性和相对性的统一，任何真理都有自己的适用条件和范围，如果超出了这个条件和范围，只要再多走一小步，真理就会变成谬误。但“人民在实践中所获得的真理”在题干中没有体现。\n故正确答案为A。","no":1,"missingImage":false},{"type":"question","qid":"2741948","cat":"新思想","stem":"习近平法治思想系统阐述了新时代全面依法治国的战略思想和工作部署，深刻回答了新时代为什么实行全面依法治国，怎样实行全面依法治国等一系列重大问题。下列表述属于习近平法治思想内容的是：\n①坚持党对全面依法治国的领导；\n②坚持统筹推进国内法治和涉外法治；\n③坚持建设中国特色社会主义法治体系；\n④坚持有法可依、有法必依、执法必严、违法必究。","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"A","explanation":"本题考查政治常识。\n2020年11月16日至17日中央全面依法治国工作会议在北京召开，中共中央总书记、国家主席、中央军委主席习近平出席会议并发表重要讲话。会议强调，习近平法治思想内涵丰富、论述深刻、逻辑严密、系统完备，从历史和现实相贯通、国际和国内相关联、理论和实际相结合上深刻回答了新时代为什么实行全面依法治国、怎样实行全面依法治国等一系列重大问题。\n①、②、③正确，习近平对当前和今后一个时期推进全面依法治国要重点抓好的工作提出了11个方面的要求，可精辟概括为“十一个坚持”：坚持党对全面依法治国的领导；坚持以人民为中心；坚持中国特色社会主义法治道路；坚持依宪治国、依宪执政；坚持在法治轨道上推进国家治理体系和治理能力现代化；坚持建设中国特色社会主义法治体系；坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设；坚持全面推进科学立法、严格执法、公正司法、全民守法；坚持统筹推进国内法治和涉外法治；坚持建设德才兼备的高素质法治工作队伍；坚持抓住领导干部这个“关键少数”。\n④错误，“有法可依、有法必依，执法必严，违法必究”是在党的十一届三中全会前召开的中央工作会议上提出的十六字方针。后为了适应全面推进依法治国的新战略，习近平总书记提出了法治建设统筹推进的新方针“科学立法，严格执法，公正司法，全民守法”。\n故正确答案为A。","no":2,"missingImage":false}],"count":2,"answerable":2,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2741944","cat":"人文常识","stem":"党的十九届五中全会审议通过了《中共中央关于制定国民经济和社会发展第十四个五年规划和2035年远景目标的建议》。根据该《建议》，下列表述正确的是：","options":{"A":"我国“十四五”期末要基本实现美丽中国建设目标","B":"我国“十四五”经济社会发展要以构建新发展格局为主题","C":"到2035年，我国要实现国民经济总量或人均收入再翻一番","D":"到2035年，全体人民共同富裕取得更为明显的实质性进展"},"answer":"D","explanation":"本题考查政治常识。\nA项错误，《建议》指出，“党的十九大对实现第二个百年奋斗目标作出分两个阶段推进的战略安排，即到二〇三五年基本实现社会主义现代化，到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。展望二〇三五年······广泛形成绿色生产生活方式，碳排放达峰后稳中有降，生态环境根本好转，美丽中国建设目标基本实现。”十四五指的是2021-2025年，故该项说法错误。\nB项错误，《建议》指出，“‘十四五’时期······以推动高质量发展为主题，以深化供给侧结构性改革为主线，以改革创新为根本动力，以满足人民日益增长的美好生活需要为根本目的，统筹发展和安全。”\nC项错误，《建议》指出，“展望二〇三五年，我国经济实力、科技实力、综合国力将大幅跃升，经济总量和城乡居民人均收入将再迈上新的大台阶”。\nD项正确，《建议》指出，“展望二〇三五年，人民生活更加美好，人的全面发展、全体人民共同富裕取得更为明显的实质性进展。”\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"2742086","cat":"人文常识","stem":"党的十九届五中全会擘画了我国到2035年的法治蓝图。下列属于蓝图内容的是：\n（1）基本建成法治国家、法治政府、法治社会\n（2）基本建成德才兼备、高素质法制工作队伍\n（3）基本实现国家治理体系和治理能力现代化\n（4）人民平等参与、平等发展权利得到充分保障","options":{"A":"（1）（2）（3）","B":"（1）（2）（4）","C":"（1）（3）（4）","D":"（2）（3）（4）"},"answer":"C","explanation":"本题考查政治常识。\n党的十九届五中全会中通过了《中共中央关于制定国民经济和社会发展第十四个五年规划和二〇三五年远景目标的建议》，而全会中提出了到2035年基本实现社会主义现代化远景目标，分别包括：我国经济实力、科技实力、综合国力将大幅跃升，经济总量和城乡居民人均收入将再迈上新的大台阶，关键核心技术实现重大突破，进入创新型国家前列；基本实现国家治理体系和治理能力现代化，人民平等参与、平等发展权利得到充分保障，基本建成法治国家、法治政府、法治社会；建成文化强国、教育强国、人才强国、体育强国、健康中国，国民素质和社会文明程度达到新高度，国家文化软实力显著增强。\n（2）在原文未提及。\n故正确答案为C。","no":4,"missingImage":false},{"type":"question","qid":"2741951","cat":"经济常识","stem":"2020年11月15日，第四次区域全面经济伙伴关系协定领导人会议正式签署了《区域全面经济伙伴关系协定》。关于该协定，下列说法正确的是：","options":{"A":"协定签署标志着全球参与人数最多、成员结构最多的东亚自贸区建成","B":"协定由东盟十国发起，并邀请中国、日本、韩国、澳大利亚、俄罗斯等参加谈判","C":"协定涵盖货物和服务贸易、争端解决、投资、知识产权、数字贸易、金融等议题","D":"协定规定的货物贸易，零关税产品数整体超过\u003cimg data-k=\"98d1a3adb731\">，与世贸组织的成员开放度持平"},"answer":"C","explanation":"本题考查政治常识。\n2020年11月15日，第四次区域全面经济伙伴关系协定（RCEP）领导人会议以视频方式举行，会后15个RCEP成员国正式签署了《区域全面经济伙伴关系协定》。\nA项错误，该协定的签署标志着世界上参与人口数量最多、成员结构最多元、发展潜力最大的东亚自贸区建设成功启动，而非建成。\nB项错误，RCEP是由东盟10国发起，邀请中国、日本、韩国、澳大利亚、新西兰、印度6个对话伙伴国参加，旨在通过削减关税及非关税壁垒，建立的一个16国统一市场的自由贸易协定。2020年11月15日，第四次区域全面经济伙伴关系协定（RCEP）领导人会议召开，东盟十国以及中国、韩国、日本、澳大利亚、新西兰等国家领导人与会，会议以视频形式举行。\nC项正确，《区域全面经济伙伴关系协定》是一个新型的自贸协定，拥有更大的包容性。该协定不仅涵盖货物贸易、争端解决、服务贸易、投资等议题，也涉及到知识产权、数字贸易、金融、电信等新议题。\nD项错误，在运行模式方面，协定中各国货物贸易的整体开放水平超过\u003cimg data-k=\"98d1a3adb731\">，远高于世贸组织各国的开放水平。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"2742087","cat":"人文常识","stem":"实施更大范围、更宽领域、更深层次对外开放，必须建设更高水平开放型经济新体制。下列措施不符合这一要求的是：","options":{"A":"稳慎推进人民币国际化","B":"尽快取消负面清单管理制度","C":"有序扩大服务业对外开放","D":"赋予自贸区更大改革自主权"},"answer":"B","explanation":"本题考查政治常识。\n2020年10月29日，中国共产党第十九届中央委员会第五次全体会议通过《中共中央关于制定国民经济和社会发展第十四个五年规划和二〇三五年远景目标的建议》（以下简称《建议》）。\nA项正确，《建议》第十一部分“实行高水平对外开放，开拓合作共赢新局面”中部分指出，“建设更高水平开放型经济新体制······稳慎推进人民币国际化，坚持市场驱动和企业自主选择，营造以人民币自由使用为基础的新型互利合作关系。发挥好中国国际进口博览会等重要展会平台作用。”\nB项错误，《建议》第十一部分“实行高水平对外开放，开拓合作共赢新局面”中部分指出，“建设更高水平开放型经济新体制······完善外商投资准入前国民待遇加负面清单管理制度。”尽快取消负面清单管理制度的说法错误。\nC项正确，《建议》第十一部分“实行高水平对外开放，开拓合作共赢新局面”中部分指出，“建设更高水平开放型经济新体制······有序扩大服务业对外开放，依法保护外资企业合法权益，健全促进和保障境外投资的法律、政策和服务体系，坚定维护中国企业海外合法权益，实现高质量引进来和高水平走出去。”\nD项正确，《建议》第十一部分“实行高水平对外开放，开拓合作共赢新局面”中部分指出，“建设更高水平开放型经济新体制······完善自由贸易试验区布局，赋予其更大改革自主权，稳步推进海南自由贸易港建设，建设对外开放新高地。”\n本题为选非题，故正确答案为B。","no":6,"missingImage":false},{"type":"question","qid":"2741950","cat":"人文常识","stem":"抗美援朝战争的胜利使得新中国真正站稳了脚跟，可谓“打得一拳开，免得百拳来”。对于这一论断，下列理解最准确的是：","options":{"A":"抗美援朝战争粉碎了侵略者陈兵国门，进而将新中国扼杀在摇篮之中的图谋","B":"抗美援朝战争深刻塑造了第二次世界大战结束以后亚洲乃至世界的格局","C":"抗美援朝战争奠定了新中国在国际事务中的重要地位，彰显新中国大国地位","D":"抗美援朝战争使人民军队取得了重要军事经验，极大促进了国防和军队现代化"},"answer":"A","explanation":"本题考查毛中特。\nA项正确，2020年10月23日，纪念中国人民志愿军抗美援朝出国作战70周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平在会上发表重要讲话强调：“经此一战，中国人民粉碎了侵略者陈兵国门、进而将新中国扼杀在摇篮之中的图谋，可谓‘打得一拳开，免得百拳来’，帝国主义再也不敢作出武力进犯新中国的尝试，新中国真正站稳了脚跟。这一战，拼来了山河无恙、家国安宁，充分展示了中国人民不畏强暴的钢铁意志！”\nB项错误，2020年10月23日，纪念中国人民志愿军抗美援朝出国作战70周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平在会上发表重要讲话强调：“经此一战，第二次世界大战结束后亚洲乃至世界的战略格局得到深刻塑造，全世界被压迫民族和人民争取民族独立和人民解放的正义事业受到极大鼓舞，有力推动了世界和平与人类进步事业。”而“打得一拳开，免得百拳来”的侧重点应该是“我们抗美援朝，就是保家卫国”，故该说法正确，但与题干无关，排除。\nC项错误，2020年10月23日，纪念中国人民志愿军抗美援朝出国作战70周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平在会上发表重要讲话强调：“经此一战，中国人民打败了侵略者，震动了全世界，奠定了新中国在亚洲和国际事务中的重要地位，彰显了新中国的大国地位。”该说法正确，但与题干无关，排除。\nD项错误，2020年10月23日，纪念中国人民志愿军抗美援朝出国作战70周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平在会上发表重要讲话强调：“经此一战，人民军队在战争中学习战争，愈战愈勇，越打越强，取得了重要军事经验，实现了由单一军种向诸军兵种合成军队转变，极大促进了国防和军队现代化。”该说法正确，但与题干无关，排除。\n故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"2741954","cat":"科技常识","stem":"芯片是现代信息社会的基石之一，是引领新一轮科技革命和产业变革的关键。下列关于芯片的说法不正确的是：","options":{"A":"芯片是内含众多电子元件及连线的半导体基片","B":"当今主流芯片的基层大都是用锗材料制造而成","C":"摩尔定律预测了芯片上集成的晶体管数量增长的速度","D":"芯片制造涉及学术界和产业界多学科领域的研究积累"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，芯片，又称微电路、微芯片、集成电路，是指内含集成电路的硅片，体积很小，常常是计算机或其他电子设备的一部分，是半导体元件产品的统称，是集成电路的载体，时常制造在半导体晶圆表面上。\nB项错误，当今芯片通常使用单晶硅晶圆作基层，然后使用光刻、掺杂、CMP等技术制成MOSFET或BJT等组件，再利用薄膜和CMP技术制成导线，从而完成制作。\n锗是一种主要的元素半导体材料，呈金刚石型结构。主要用于半导体器件和重要的红外光学元件，如透镜、窗口等。1952年蒂尔用切光拉斯基法拉出第一根锗单晶。在50～60年代由于锗晶体管的需求，锗生产技术发展迅速。但自70年代后锗器件逐步为硅器件取代。然而锗在红外光学上用量增加，补偿了在电子工业上用量的下降。\nC项正确，摩尔定律是英特尔创始人之一戈登·摩尔的经验之谈，其核心内容为：集成电路上可以容纳的晶体管数目在大约每经过24个月便会增加一倍。摩尔定律是内行人摩尔的经验之谈，但并非自然科学定律，它一定程度揭示了信息技术进步的速度。\nD项正确，芯片制造过程包括半导体工艺的每个阶段，从原材料制备到封装、测试以及传统和现代工艺，涉及学术界和产业界多学科领域的研究积累。\n本题为选非题，故正确答案为B。","no":8,"missingImage":false},{"type":"question","qid":"2742088","cat":"法律常识","stem":"2019年3月，甲与某村村委会签订土地承包合同，村委会将16亩土地发包给甲，承包期限10年。该村的S村民小组认为该地块为本组所有，于同年6月向县人民政府提出争议土地的确权申请。同年12月，县政府确认争议土地属于S村民小组所有，甲不服该确认，欲提起行政复议。关于本案，下列说法正确的是：","options":{"A":"县政府在确权过程中可以追加甲参与","B":"甲对争议土地的确认享有独立请求权","C":"县政府的确权决定侵犯甲的合法权益","D":"甲可对土地归属的确认提起行政复议"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，行政确认是指行政主体依法对行政相对人的法律地位、法律关系或有关法律事实进行甄别，给予确定、认定、证明（或证伪）并予以宣告的具体行政行为。县政府作出的土地确权决定是行政确认，是具体行政行为，县政府在确权过程中不应追加甲参与。\nB项错误，独立请求权是诉讼法中的概念，甲对县政府作出的行政确认行为，不享有独立请求权。\nC项错误，农村的土地属于集体所有并非甲所有，县政府作出的行政确认行为，并未侵犯甲的合法权益。\nD项正确，《行政复议法》第十一条第四项规定：“有下列情形之一的，公民、法人或者其他组织可以依照本法申请行政复议：（四）对行政机关作出的确认自然资源的所有权或者使用权的决定不服；”甲对县人民政府作出的行政确认行为不服的，其作为利害关系人，可以申请行政复议。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"2742089","cat":"人文常识","stem":"某小区业主郑某将一公共车位装上地锁，据为己有。业主黄某多次向物业公司反映此情况，但物业公司未作处理。某日，黄某5岁女儿在楼下玩耍时被该地锁绊倒受伤，花去5000余元医药费。关于本案的损失赔偿，下列说法正确的是：","options":{"A":"郑某私装地锁，应由其承担赔偿责任","B":"物业公司怠于管理，应由其承担赔偿责任","C":"郑某和物业公司应共同承担赔偿责任","D":"黄某未尽监护责任，应与郑某，物业公司共同承担赔偿责任"},"answer":"C","explanation":"本题考查法律常识。\n本案中，郑某在小区公共车位私装地锁，该小区的物业公司明知而未作处理，应当与郑某共同承担黄某女儿受伤的赔偿责任。即使黄某未尽监护责任，可以适当减轻郑某和物业公司的赔偿责任，但不应与郑某、物业公司共同承担赔偿责任。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"2741946","cat":"法律常识","stem":"为整治电动自行车交通违法行为，某市交管部门向市民公开征求意见。下列建议中，交管部门不应采纳的是：","options":{"A":"对电动自行车随机测速，超速严重的要依法处罚","B":"禁止电动自行车在机动车禁鸣区内长时间按喇叭","C":"有条件的路口，在人行横道线两侧划出电动自行车过街斑马线","D":"违反交规的电动自行车骑车人要现场学法，答题合格才能离开"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，《道路交通安全法》第五十八条规定：“······电动自行车在非机动车道内行驶时，最高时速不得超过十五公里。”该法第八十九条规定：“······非机动车驾驶人违反道路交通安全法律、法规关于道路通行规定的，处警告或者五元以上五十元以下罚款。”因此，超速严重的可依法予以处罚，可以采纳。\nB项正确，《道路交通安全法实施条例》第六十二条规定：“驾驶机动车不得有下列行为：······（八）在禁止鸣喇叭的区域或者路段鸣喇叭。”根据立法目的，禁止鸣喇叭区域不应仅限制机动车，因此，禁止电动自行车在机动车禁鸣区内长时间按喇叭，可以采纳。\nC项正确，在有条件的路口，在人行横道线两侧划出电动自行车过街斑马线，有利于电动自行车规范出行，不违反相关法律禁止性规定，可以采纳。\nD项错误，该项中“要现场学法，答题合格才能离开”超出交管部门职权范围，且涉嫌非法限制当事人自由，法无授权不可为，所以此做法不应采纳。\n本题为选非题，故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"2742090","cat":"法律常识","stem":"根据我国《行政许可法》《行政强制法》等相关法律法规，下列执法行为正确的是：","options":{"A":"周某向颁证机关反映领到的许可证存在严重错误，颁证机关为此撤销了该许可","B":"吴某拒不领回被依法扣押的涉案物品，相关执法机关将该物品作无主物处理","C":"郑某持C1驾照驾驶摩托车发生交通事故，执法交警以无证驾驶为由对其作出处罚","D":"王某运输未经检疫的生猪肉，检疫部门依法查扣后，对该批猪肉作无害化处理"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，《行政许可法》第六十九条第一、二款规定：“有下列情形之一的，作出行政许可决定的行政机关或者其上级行政机关，根据利害关系人的请求或者依据职权，可以撤销行政许可：（一）行政机关工作人员滥用职权、玩忽职守作出准予行政许可决定的；（二）超越法定职权作出准予行政许可决定的；（三）违反法定程序作出准予行政许可决定的；（四）对不具备申请资格或者不符合法定条件的申请人准予行政许可的；（五）依法可以撤销行政许可的其他情形。被许可人以欺骗、贿赂等不正当手段取得行政许可的，应当予以撤销。”因此，“许可证存在严重错误”并不属于撤销行政许可的法定情形。\nB项错误，对拒不领回被依法扣押的涉案物品的，办案人员可将其提存，而不宜将该物品作无主物处理。\nC项正确，《道路交通安全法》第十九条第四款规定：“驾驶人应当按照驾驶证载明的准驾车型驾驶机动车；驾驶机动车时，应当随身携带机动车驾驶证。”\nD项错误，未经检疫的生猪肉的不一定需要作无害化处理，而是经检疫不合格的猪肉，应作无害化处理。\n故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"2742091","cat":"法律常识","stem":"某市房地产主管部门以甲公司违法经营为由，吊销了该公司的房地产开发企业资质证书。甲公司不服，向法院提起行政诉讼。关于本案，下列说法不正确的是：","options":{"A":"市房地产主管部门吊销甲公司资质证书的行为属于行政处罚","B":"甲公司被吊销资质证书后，已不具有法人资格，应由股东向法院起诉","C":"在市房地产主管部门作出吊销资质证书决定前，甲公司有权要求听证","D":"市房地产主管部门适用法律错误，法院应判决撤销其吊销行为"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，《行政处罚法》第九条规定：“行政处罚的种类：（一）警告、通报批评；（二）罚款、没收违法所得、没收非法财物；（三）暂扣许可证件、降低资质等级、吊销许可证件；（四）限制开展生产经营活动、责令停产停业、责令关闭、限制从业；（五）行政拘留；（六）法律、行政法规规定的其他行政处罚。”市房地产主管部门吊销甲公司资质证书的行为属于行政处罚。\nB项错误，《公司法》第七条第一款规定：“依法设立的公司，由公司登记机关发给公司营业执照。公司营业执照签发日期为公司成立日期。”《民法典》第七十二条第三款规定：“清算结束并完成法人注销登记时，法人终止；依法不需要办理法人登记的，清算结束时，法人终止。”题中，甲公司仅是资质证书被吊销而非营业执照被吊销，仍具有法人资格，只是不能从事房地产开发经营工作。\nC项正确，《行政处罚法》第六十三条规定：“行政机关拟作出下列行政处罚决定，应当告知当事人有要求听证的权利，当事人要求听证的，行政机关应当组织听证：（一）较大数额罚款；（二）没收较大数额违法所得、没收较大价值非法财物；（三）降低资质等级、吊销许可证件；（四）责令停产停业、责令关闭、限制从业；（五）其他较重的行政处罚；（六）法律、法规、规章规定的其他情形。当事人不承担行政机关组织听证的费用。”\nD项正确，根据《房地产开发企业资质管理规定》第十六条规定：“企业未取得资质证书从事房地产开发经营的，由县级以上地方人民政府房地产开发主管部门责令限期改正，处5万元以上10万元以下的罚款；逾期不改正的，由房地产开发主管部门提请工商行政管理部门吊销营业执照。”第十七条规定：“企业超越资质等级从事房地产开发经营的，由县级以上地方人民政府房地产开发主管部门责令限期改正，处5万元以上10万元以下的罚款；逾期不改正的，”由原资质审批部门提请市场监督管理部门吊销营业执照，并依法注销资质证书。第十八条规定：“企业有下列行为之一的，由原资质审批部门按照《中华人民共和国行政许可法》等法律法规规定予以处理，并可处以1万元以上3万元以下的罚款：（一）隐瞒真实情况、弄虚作假骗取资质证书的；（二）涂改、出租、出借、转让、出卖资质证书的。”根据上述规定，违法经营不在吊销资质证书处罚的范围内，故市房地产主管部门处罚违法，法院应判决撤销其吊销行为。\n本题为选非题，故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"2742092","cat":"法律常识","stem":"为鼓励农民利用荒山荒坡进行规模化畜禽养殖，某县政府出台文件，取消了畜禽养殖的审批手续。张某响应政府号召，在承包林地的荒坡上建了养猪场，但未依法办理有关审批手续。县林业主管部门依据《森林法》《行政处罚法》等法律法规，对张某予以罚款并责令其恢复原状。张某不服，向法院提起行政诉讼，要求撤销县林业主管部门的处罚决定。关于本案，下列说法正确的是：","options":{"A":"张某的诉讼请求依法不能成立，法院应驳回其诉讼请求","B":"法院应将县政府列为共同被告，并判决撤销县政府的文件","C":"法院应判决撤销县林业主管部门的处罚决定，并向县政府提出司法建议","D":"张某应先向县政府申请复议，不服复议决定的，才能提起行政诉讼"},"answer":"C","explanation":"本题考查法律常识。\nA项错误、C项正确，根据《行政许可法》第十七条的规定：“除本法第十四条、第十五条规定的外，其他规范性文件一律不得设定行政许可。”县政府无权取消法律法规设定的行政许可事项，故该县政府的文件违法。本案中，县政府出台文件取消了畜禽养殖的审批手续，张某基于对行政机关的信任而开办养猪场，对于其信赖利益需要予以保护，但县林业部门依法对其进行处罚，违反了行政法的诚实守信原则，该处罚决定违法。因此，张某的诉讼请求能够成立，法院对于县林业部门的处罚应当予以撤销。《最高人民法院关于适用&lt;中华人民共和国行政诉讼法&gt;的解释》第一百四十九条第一、二款规定：“人民法院经审查认为行政行为所依据的规范性文件合法的，应当作为认定行政行为合法的依据；经审查认为规范性文件不合法的，不作为人民法院认定行政行为合法的依据，并在裁判理由中予以阐明。作出生效裁判的人民法院应当向规范性文件的制定机关提出处理建议，并可以抄送制定机关的同级人民政府、上一级行政机关、监察机关以及规范性文件的备案机关。规范性文件不合法的，人民法院可以在裁判生效之日起三个月内，向规范性文件制定机关提出修改或者废止该规范性文件的司法建议。”对于县政府这一不合法的规范性文件，法院有权提出司法建议。\nB项错误，《行政诉讼法》第二十六条第一款规定：“公民、法人或者其他组织直接向人民法院提起诉讼的，作出行政行为的行政机关是被告。”第四款规定：“两个以上行政机关作出同一行政行为的，共同作出行政行为的行政机关是共同被告。”在本案中，作出具体行政行为的行政机关是县林业主管部门，故本案的被告仅为县林业主管部门。\nD项错误，《行政诉讼法》第四十四条第一款规定：“对属于人民法院受案范围的行政案件，公民、法人或者其他组织可以先向行政机关申请复议，对复议决定不服的，再向人民法院提起诉讼；也可以直接向人民法院提起诉讼。”故张某无须先进行复议，也可以直接提起行政诉讼。\n故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"2742093","cat":"法律常识","stem":"某市农业农村局以甲公司经销的化肥抽检不合格为由，对该公司予以罚款并没收违法所得。甲公司在法定期限内既不申辩、提起行政复议和行政诉讼，又不缴纳罚款。在被法院强制执行后，甲公司向法院提起民事诉讼，要求化肥生产企业赔偿损失。一审、二审法院均认定该批次化肥为合格产品。甲公司败诉后，以民事判决书为证据，向该市农业农村局提起国家赔偿申请。关于本案，下列说法正确的是（    ）。","options":{"A":"甲公司在法定期限内放弃行政法律救济权利，应当自行承担损失","B":"实施强制执行的法院对处罚决定审查不严，应当赔偿甲公司的损失","C":"甲公司以民事判决确认的事实申请国家赔偿，缺乏事实根据","D":"市农业农村局应当返还罚款和没收的违法所得，其余损失由甲公司自行承担"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，根据《国家赔偿法》第四条第一项规定：“行政机关及其工作人员在行使行政职权时有下列侵犯财产权情形之一的，受害人有取得赔偿的权利：（一）违法实施罚款、吊销许可证和执照、责令停产停业、没收财物等行政处罚的；······”第三十九条规定：“赔偿请求人请求国家赔偿的时效为两年，自其知道或者应当知道国家机关及其工作人员行使职权时的行为侵犯其人身权、财产权之日起计算，但被羁押等限制人身自由期间不计算在内。”本案中，甲公司经销的化肥经法院审理认定为合格产品，“罚款并没收违法所得”的行政处罚侵犯其财产权，虽起诉化肥生产企业前，甲公司在法定期限内没有申辩、提起行政复议和行政诉讼，但自判决之日起其仍有请求取得国家行政赔偿的权利。\nB项正确，根据《最高人民法院关于适用&lt;中华人民共和国行政诉讼法&gt;的解释》第一百六十一条第二项规定：“被申请执行的行政行为有下列情形之一的，人民法院应当裁定不准予执行：（二）明显缺乏事实根据的；”第一百六十条规定：“人民法院受理行政机关申请执行其行政行为的案件后，应当在七日内由行政审判庭对行政行为的合法性进行审查，并作出是否准予执行的裁定。”本案中，法院没有对行政机关的强制执行申请进行合法性审查，本应裁定不准予执行而执行，造成执行错误。根据《国家赔偿法》第三十八条规定：“人民法院在民事诉讼、行政诉讼过程中，违法采取对妨害诉讼的强制措施、保全措施或者对判决、裁定及其他生效法律文书执行错误，造成损害的，赔偿请求人要求赔偿的程序，适用本法刑事赔偿程序的规定。”因此，强制执行的法院应当赔偿甲公司的损失。\n《国家赔偿法》第三十八条规定：“人民法院在民事诉讼、行政诉讼过程中，违法采取对妨害诉讼的强制措施、保全措施或者对判决、裁定及其他生效法律文书执行错误，造成损害的，赔偿请求人要求赔偿的程序，适用本法刑事赔偿程序的规定。”因此，强制执行的法院应当赔偿甲公司的损失。\nC项错误，一审、二审法院均认定该批次化肥为合格产品，以民事判决确认的事实申请国家赔偿，具备事实根据。\nD项错误，根据《国家赔偿法》第三十六条规定：“侵犯公民、法人和其他组织的财产权造成损害的，按照下列规定处理：（一）处罚款、罚金、追缴、没收财产或者违法征收、征用财产的，返还财产；······（八）对财产权造成其他损害的，按照直接损失给予赔偿。”\n故正确答案为B。","no":15,"missingImage":false}],"count":13,"answerable":13,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        索引以及一切检索工具，本质上都是揭示人类知识内在关联的认知方式，而且完全符合人类的认识习惯。我们通过研究索引的\u003cu>                    \u003c/u>，可以获得极大的启示。索引揭示的知识规则，是构建新媒体时代人类知识体系的基础，也是实现知识发现新方案的基础。索引具有三种功能：学术进阶的工具、知识发现的手段和学术评价的标准。传统的检索工具，其实是人类认知思维的外在表现。\u003c/p>\u003cp>        索引有两种形态，分别代表了人类的两种认知形式，即知识扩展和模式识别。知识扩展又分为两种形式，其一是单向度的知识扩展模型，就是在同一个文献内部提出某些关键词制成索引，当读者在一个段落中发现其中一个关键词，可以经由索引扩展到本书其他段落、篇章中的同一词，这是个闭合循环的知识扩展模型；其二是开放性的知识扩展，就是读者在书中发现一个关键词，通过综合索引跳转至多种文献中与之相关的关键词，从而不断向外扩展。在这个模型之上，如果把多个知识关联序列进行叠加，我们便掌握了一种新的认知形式，就是模式识别。不是说通过一个已知的关键词去找它在文献中出现的位置，而是根据某些边际条件探索某个关键词集，即获取位于一个相关知识序列中的知识集合。比如说，我们综合利用唐代的士族世系表、科举年表、职官年表，可以探索士族出身的文士通过科举途径入仕和此后的升迁途径中较之寒门子弟有何优势，甚至可以结合士族郡望表进一步细致分析不同地域士族的升降与科举之间的关系。模式识别是学术研究更高级的思维过程。\u003c/p>\u003cp>        知识扩展和模式识别都依赖于知识系统的有序性和关联性，由此形成的知识图谱，是有关联的、有序的知识集合。这个知识集合中，所有知识点都在一个相互关联的网络体系中，不是单个的珠子，而是固定在一串项链上，我们可以知道它的定位，知道它跟其他知识之间的关联。\u003c/p>\u003cp>        知识图谱正是用以实现模式识别思维功能的方案，它由多个知识本体库和多个知识模型组成，把这些知识模型进行叠加以实现模式识别功能。知识图谱的综合架构有点像生物分子模型，任何一个知识点都能够在它的分子链上找到，而每个分子链跟其他的分子链之间还有一种关联，那么我们可以通过它的颜色、大小、方向来定位它到底是哪个具体的知识。我们看单独的知识点，它是海量知识中一个不确定的点，但当我们把不同来源的知识进行拼合的时候，其实它就变成了一个某种七巧板拼成的固定形状，每一个单块都是不可移动的，是互相关联从而互相限定的。那么，以往所有的问题、错误，包括误解，其实都可以在这个体系中再认识。\u003c/p>\u003cp>        这种知识管理方案能够让我们把传统媒体中的经验、知识和智慧，平滑地移入新媒体中，实现基于规则的方案和基于统计的方案的结合，也就是基于计算机技术的和基于专业领域知识的知识管理方案的完美结合，进而辅助人类更广阔、深入地认识主观世界和客观世界。\u003c/p>","questions":[{"qid":"2742038","cat":"语句表达","stem":"填入文中画横线处最恰当的是：","options":{"A":"原理和特性","B":"产生与发展","C":"运用与前景","D":"方法和用途"},"answer":"A","explanation":"本题为语句填空题，横线出现在第一段中间，需结合上下文。文段开篇论述索引是揭示人类知识内在关联的认知方式，指出了索引是什么，即检索工具的原理，横线后论述了索引的三个功能，指出“传统的检索工具，其实是人类认知思维的外在表现”，即索引的功能特点，故横线处指的是索引所具有的原理和特征，对应A项。\nB项索引的“发展”、C项索引的“前景”、D项索引的“方法”本段均未提及，属于无中生有，排除。\n故正确答案为A。\n【文段出处】《史睿谈数字人文与现代文献学研究》","no":16,"missingImage":false},{"qid":"2742043","cat":"片段阅读","stem":"作者认为检索工具产生的根本原因在于：","options":{"A":"学者需要将其作为学术研究的工具","B":"学者需要将其作为学术评价的标准","C":"人们需要这样一种构建庞大知识体系的基本规则","D":"人们需要这样一种揭示知识内在关联的认知方式"},"answer":"D","explanation":"根据第一段“索引以及一切检索工具，本质上都是揭示人类知识内在关联的认知方式，而且完全符合人类的认识习惯”可知，检索工具产生的根本原因在于它是一种帮助人类揭示知识内在关联的认知方式，对应D项。\nA项，“学术研究的工具”可对应“学术进阶的工具”，属于索引的功能，而非产生原因，排除；\nB项，“学术评价的标准”为索引的功能，与其产生原因无关，排除；\nC项，“构建庞大知识体系的基本规则”可对应“构建新媒体时代人类知识体系的基础”，为索引揭示的知识规则，并非其产生的根本原因，排除。\n故正确答案为D。\n【文段出处】《史睿谈数字人文与现代文献学研究》","no":17,"missingImage":false},{"qid":"2742046","cat":"片段阅读","stem":"根据文意，索引的“知识扩展”有两种形式，其区别主要在于：","options":{"A":"关键词跳转方式是否可以循环","B":"是闭合式扩展还是开放式扩展","C":"涉及的文献是有限还是无限的","D":"知识扩展的模型是否受到限制"},"answer":"B","explanation":"“索引的‘知识扩展’有两种形式”出现在第二段，根据文意可知，索引有知识扩展和模式识别两种形态。知识扩展又分为两种形式，其一是在一个文献内部进行关键词的检索，是一种闭合循环的知识扩展模型；其二是检索关键词时，可以从一本书跳转至多种文献，是一种开放式的知识扩展模型，故两种形式的主要区别就在于一个是一本书内部的闭合式扩展，另一个是开放式的向外扩展，对应B项。\nA项，知识扩展的第二种形式仅指出其为开放性向外扩展的，未提及其能否进行“关键词跳转循环”，故无法判断其是否为两者的主要区别，排除；\nC项，文段并未提及涉及的文献的数量，属于无中生有，排除；\nD项，文段并未阐述知识模型是否受限制，属于无中生有，排除。\n故正确答案为B。\n【文段出处】《史睿谈数字人文与现代文献学研究》","no":18,"missingImage":false},{"qid":"2742049","cat":"片段阅读","stem":"下列关于“知识图谱”的描述不符合文意的是：","options":{"A":"其架构被称为生物分子模型","B":"是相关知识有序形成的体系","C":"就像是将知识点有序串联起来的项链","D":"可以帮助人类更好地认识主客观世界"},"answer":"A","explanation":"A项，根据第四段“知识图谱的综合架构有点像生物分子模型”可知，文中仅指出知识图谱的架构有点像生物分子模型，并非指出其被称为生物分子模型，故表述有误，当选。\nB、C两项，根据第三段“由此形成的知识图谱，是有关联的、有序的知识集合。这个知识集合中，所有知识点都在一个相互关联的网络体系中，不是单个的珠子，而是固定在一串项链上”可知，该两项均表述正确，排除；\nD项，根据第五段“这种知识管理方案······深入地认识主观世界和客观世界”可知，“这种知识管理方案”应当指代前文知识图谱管理方案，故知识图谱可以帮助人类更好地认识主客观世界，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《史睿谈数字人文与现代文献学研究》","no":19,"missingImage":false},{"qid":"2742053","cat":"片段阅读","stem":"下列最适合做文章标题的是：","options":{"A":"学术检索不可或缺的工具——索引","B":"索引——人类记忆能力的延续","C":"索引的作用与意义","D":"文献处理离不开索引"},"answer":"C","explanation":"文章开篇引出“索引”这一话题，第一段指出“索引”的本质及其存在的意义和功能。第二段，介绍“索引”的两种形态，并论述了其功能原理；第三段到第五段，指出“索引”的两种形态将形成“知识图谱”并指出其原理和作用。故本篇文章围绕“索引”，强调索引可以形成知识图谱发挥作用，对人类认识世界有积极影响，对应C项。\nA项强调索引在“学术检索”中的作用，D项强调索引在“文献处理”中的作用，根据“索引······本质上都是揭示人类知识内在关联的认知方式”“辅助人类更广阔、深入地认识主观世界和客观世界”可知，“索引”并非单纯使用于“学术”“文献”领域，故均表述片面，排除；\nB项，“人类记忆能力的延续”，文段并未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】《史睿谈数字人文与现代文献学研究》","no":20,"missingImage":false},{"qid":"2742082","cat":"片段阅读","stem":"严格规范公正文明执法，提高司法公信力，是维护民法典权威的有效手段。在贯彻落实民法典的过程中，政府部门尤其要注重把民法典作为行政决策、行政管理、行政监督的重要标尺，不得违背法律法规随意作出减损公民、法人和其他组织合法权益或增加其义务的决定。要规范行政许可、行政处罚、行政强制、行政征收、行政收费、行政检查、行政裁决等活动，提高依法行政能力和水平，依法严肃处理侵犯群众合法权益的行为和人员。\n这段文字着重强调：","options":{"A":"实施民法典能够切实保障广大群众的合法权益","B":"实施民法典可以规范执法行为提高司法公信力","C":"实施民法典将为政府部门各类执法行为制定实施细则","D":"实施民法典将为政府部门依法行政提供相关法律依据"},"answer":"D","explanation":"文段首句先介绍了维护民法典权威的有效手段，接着通过程度词“尤其”强调政府部门在贯彻落实民法典的过程中要将其作为重要标尺，依法行政，不得违背法律法规，紧接着具体论述政府部门应如何落实依法行政以提高依法行政能力和水平，故文段论述的重点是民法典为政府部门的依法行政提供了依据，文段论述的核心话题是“民法典”“政府部门”“依法行政”，对应D项。\nA项，“保障广大群众的合法权益”对应文段尾句的内容，非重点，且未提及“政府部门”“依法行政”这两个核心话题，排除；\nB项，文中强调“提高司法公信力”是维护民法典权威的有效手段，该项逻辑倒置，与文意不符，排除；\nC项，“各类执法行为”范围扩大，文段仅围绕“依法行政”展开论述，且“制定实施细则”无中生有，排除。\n故正确答案为D。\n【文段出处】《民法典依法行政的重要标尺》","no":21,"missingImage":false},{"qid":"2742036","cat":"片段阅读","stem":"人类社会不是单向度的线性发展，得失之间的利弊需要仔细衡量。在雕版印刷快速发展之际，苏东坡曾对青年学子处于日传万纸的环境中“束书不观，游谈无根”的状态浩叹不已，我们今天何尝不是如此？电子媒体确实带来了文献获取的便利和平权，但是陷入信息海洋中的人类是否比以往吸收并传承了更多的知识，且因此生发出更高的智慧呢？\n这段文字主要表达的观点是：","options":{"A":"信息技术发展带给人类的利弊需要仔细权衡","B":"人类陷入了信息海洋但并未汲取到更多知识","C":"文献获取的便利并未给所有人带来多少智慧","D":"尽管目前知识获取便利但其中也隐藏着弊端"},"answer":"C","explanation":"文段开篇提到人类社会的发展中得失的利弊需要仔细衡量，然后以雕版印刷发展为例进行补充说明，尾句通过转折词“但是”引出文段重点，虽然现在文献获取便利，但是人们并未吸收传承，通过“因此”引出最终的结果即没有生发出更高的智慧。故文段重点强调现在虽然文献获取便利却并未激发人们更高的智慧，对应C项。\nA项，对应文段首句，为转折之前的内容，偏离文段中心，排除；\nB项，“并未汲取到更多知识”为尾句“因此”之前的内容，并非最终的结论，非重点，排除；\nD项，“隐藏着弊端”表述不明确，未提及对“智慧”的影响，排除。\n故正确答案为C。\n【文段出处】《史睿谈数字人文与现代文献学研究》","no":22,"missingImage":false},{"qid":"2742168","cat":"片段阅读","stem":"为了消灭农田里的害虫，人类发明了三万种以上的农药，虽暂时控制了虫害，但同时消灭了昆虫的天敌，消灭了蜜蜂，导致一些蔬菜瓜果不能传粉，杂草会与庄稼争营养、水分和空间，于是有人发明了除草剂，除草剂虽然暂时控制了杂草，但也促进了杂草进化，使之变得更难对付，更糟糕的是，除草剂同时也消灭了土壤中的有益微生物，一些原本具有固氮能力的固氮菌，乃至将多余氮素还原为大气中氮气的反硝化细菌也遭到了伤害，没有杂草呵护，农田变成光板地，雨季非常容易造成水土流失。\n这段文字重在说明：","options":{"A":"农业的发展不能过度依赖现代科技","B":"研制精准杀灭虫害农药的紧迫性","C":"既有农业生态系统被扰乱后的危害","D":"现代农业技术有利有弊"},"answer":"C","explanation":"文段开篇论述人类发明农药来消灭农田里的害虫，接着通过转折标志词“但”强调这种做法同时消灭了蜜蜂，导致一些蔬菜瓜果不能传粉。随后又介绍了人类发明除草剂清除杂草，同样通过转折标志词“但”强调这种做法促进杂草进化，并且消灭了土壤中的有益微生物，最终农田变成光板地容易造成水土流失。文段通过人类发明农药和除草剂这两件事，重点强调人类破坏农业生态系统后带来的危害，对应C项。\nA项，“过度依赖现代科技”无中生有，排除；\nB项，“研制精准杀灭虫害农药”表述片面，排除；\nD项，“现代农业技术有利有弊”，“利”位于文段转折之前，并非文段论述的重点，排除。\n故正确答案为C。\n【文段出处】《人为造成农业生态系统失衡苦果知多少？》","no":23,"missingImage":false},{"qid":"2742170","cat":"片段阅读","stem":"在信息流动中，个体几乎居于风险的主要位置，即要承载由不确定风险所带来的所有后果。但是就信息获得、披露与结果承受等角度而言，个体基本上处于一种消极、被动的地位，而在很大程度上能够掌控相应风险或获得更为对称信息的，却是掌握个人信息的平台或企业一方。因此，往往是有风险者无法负担风险，而风险掌控者却可能在负担风险之时“缺席”。\n这段文字接下来最有可能讨论的是：","options":{"A":"如何规避个体在信息流动中产生的风险","B":"如何让信息的获益方承担风险责任","C":"信息流动中的风险究竟该如何掌控","D":"信息平台与个人之间究竟由谁承担风险"},"answer":"B","explanation":"文段开篇论述信息流动中个体居于风险的主要位置，接着通过转折标志词“但是”指出个体处于消极被动地位，能够掌控相应风险的是掌握个人信息的平台或企业。最后通过结论词“因此”说明了个体无法负担风险，而风险掌控者却可能在负担风险之时“缺席”。所以文段最后论述的核心话题为“风险掌控者”，且根据逻辑顺序，下文应该围绕如何解决“风险掌控者”负担风险时“缺席”进行论述，对应B项，“获益方”为“风险掌控者”的同义替换，当选。\nA、C、D三项：A项“个体”、C项“风险究竟该如何掌控”、D项“由谁承担风险”均与文段最后论述的核心话题不一致，均排除。\n故正确答案为B。\n【文段出处】《知情同意原则抑或信赖授权原则——兼论数字时代的信用重建》","no":24,"missingImage":false},{"qid":"2742174","cat":"片段阅读","stem":"纵观历史，我们会发现人们迫切地想知道未来会发生什么。从原始神话、宗教故事到民俗传说，都有许许多多关于“预测”的内容。这些预言有一个共同特点，就是“神秘”，知其然而不知其所以然。在自然发展历史上，科学家们也多次给出预测，其方法和神秘主义迥然不同。比如在古希腊文明早期，哲学家泰勒斯游历巴比伦，了解了日月食发生的周期性规律，成功地预测了一次日食。这个预测是基于巴比伦天文学家数百年的天文观测和规律总结，任何人只要努力学习研究，都可以做到。中国古代也有很多次这样成功的日月食预测。\n这段文字意在说明：","options":{"A":"历史上的很多预测其实就是猜测","B":"人类早期预测主要是日月食预测","C":"古代科学预测是基于对自然规律的认识","D":"古今中外科学预测都有大量的成功案例"},"answer":"C","explanation":"文段开篇指出历史上人们通过“预测”来满足自己对未来的好奇心，但这些预言并没有什么科学依据，紧接着通过“迥然不同”指出在自然发展历史上，科学家们给出的预测与前文所述的“神秘预测”并不相同，并通过列举古希腊、中国古代的例子论证这些预测是通过观测和规律总结出来的，故文段强调的是古代科学预测是基于对自然规律的总结，对应C项。\nA项，文段重点强调古代科学预测是基于对自然规律的总结，该项中“其实就是猜测”的表述与文段核心相悖，排除。\nB、D两项，“日月食预测”“大量的成功案例”均对应文段举例部分的内容，非重点，排除。\n故正确答案为C。\n【文段出处】《中医院士预测“冬至前后瘟疫发生”：科学还是巧合？》","no":25,"missingImage":false},{"qid":"2742199","cat":"片段阅读","stem":"新冠肺炎疫情防控期间，部分地区公安机关利用警用无人机在“非接触式”情境中执行空中巡检、防控、侦查、运输、消毒、测温等空域警务任务。在运用警用无人机开展疫情防控工作时，应对人才供需失衡和空中执法能力不足等突出问题的基本策略是加强警航队伍建设和完善警用无人机执法流程，从而实现队伍机制和空中执法程序机制的不断健全。警用无人机的发展要注重执法打击能力和防控服务能力之间的平衡，不断促进执法手段和无人机应用的多样性和灵活性，更好地为政府处置重大疫情工作服务。\n这段文字着重说明，警用无人机用于疫情防控：","options":{"A":"所承担的主要任务","B":"面对的挑战及应对","C":"执法流程需要完善","D":"需要灵活快速反应"},"answer":"B","explanation":"文段开篇指出在新冠疫情防控期间，公安机关利用警用无人机完成了很多“非接触式”的警务任务，紧接着指出运用警用无人机时存在“人才供需失衡和空中执法能力不足”等问题，随后通过“基本策略”“要注重”“不断促进”提出应对措施，故文段强调的是警用无人机用于疫情防控时面临的问题及应对措施，对应B项。\nA项，“主要任务”对应文段首句背景引入的内容，非重点，排除；\nC项，“执法流程”仅对应对策的一方面，表述片面，排除；\nD项，“灵活快速反应”仅对应对策当中的“灵活性”，表述片面，排除。\n故正确答案为B。\n【文段出处】《警用无人机在新冠肺炎疫情防控中的应用研究》","no":26,"missingImage":false},{"qid":"2742041","cat":"语句表达","stem":"①依据书法史界最新研究成果，有人提出应关注书写工具及其工艺特性、书写姿态、书写目的对于书法样式的决定性意义\n②只有从书写工具对于书法样式的决定性影响上加以研究，才能变观风望气式的书法断代为有理可据的科学书法断代\n③就书法样式的演变而言，古人很早就有所体察\n④他们将书法样式的变迁归纳为“晋人尚韵，唐人尚法，宋人尚意，元明尚态”\n⑤以此建立基于书体及风格、笔画、部件、字势分析的书法断代方法论\n⑥但是这种说法虚无缥缈，难以把握，更无法用作断代方法\n将以上六个句子重新排列，语序正确的是：","options":{"A":"②⑤⑥①③④","B":"②③⑤④⑥①","C":"③④⑥②①⑤","D":"③②④⑤①⑥"},"answer":"C","explanation":"观察选项，对比首句。②句论述了研究书写工具对书法样式决定性影响的重要性，③句论述了古人很早就开始觉察书法样式的演变。首句不好判断，寻找其他线索。④句中出现“他们”，可寻找指代词捆绑，说明④句之前应出现人。④句前分别为②③⑤三句，③句中提到“古人”，可与④句进行捆绑，②⑤两句中均未出现人，与④句无法构成捆绑，排除B、D两项。再根据⑥句中出现“但是”“这种说法”可知，⑥句之前应提及某种说法，并且要与⑥句内容构成转折关系。⑥句前分别为④⑤两句，⑤句中建立“断代方法论”的内容无法与⑥句构成转折，排除A项。对C项进行验证，逻辑通顺，当选。\n故正确答案为C。\n【文段出处】《史睿谈数字人文与现代文献学研究》","no":27,"missingImage":false},{"qid":"2742198","cat":"片段阅读","stem":"为政之要，惟在得人。基层一线处在服务群众的最前沿，群众对美好生活的追求和期望丰富而多元，需要数量充足、专业对口的人才队伍去推动高效能治理。当前，我国社区类型发生了很大变化，社区承载的功能越来越多，社区情况复杂多变。便民服务、拥军优属、养老助残、疫病防控、慈善救济等，都需要社区治理相关方如社区党组织、居委会、社区服务站、物业服务企业等具备专业应对能力。\n这段文字主要强调的是：","options":{"A":"需要切实提高基层社区工作治理水平","B":"社区功能已突破传统认知而充分拓展","C":"高效能社区治理需多方协同合作发力","D":"社区治理需加强专业化人才队伍建设"},"answer":"D","explanation":"文段开篇通过“为政之要，惟在得人”指出人才的重要性，然后论述了基层一线需要数量充足、专业对口的人才队伍去推动高效能治理，紧接着阐述了当前我国社区的现状，并通过对策引导词“需要”指出社区治理相关方需要具备专业应对能力，故文段论述的重点是社区治理需要注重专业人才队伍的建设，对应D项。\nA项，“提高基层社区工作治理水平”通过何种方式提升，表述不明确，文段重点强调的是专业人才队伍的建设，排除；\nB项，“社区功能”并非文段论述的重点，且“突破传统认知”文段并未提及，无中生有，排除；\nC项，“需多方协同合作发力”非重点，文段重点强调的是专业人才队伍的建设，排除。\n故正确答案为D。\n【文段出处】《倡导专业社工常态化参与，提升社区治理专业化水平》","no":28,"missingImage":false},{"qid":"2742080","cat":"片段阅读","stem":"中国目前并没有主流的廉租住宅供给渠道，低成本租赁住房的很多功能，是由非正规的“城中村”来承担的。近些年，南方和北方的城市发展差距越来越大，在对这一现象进行解释的研究中，城中村占整个城市建成区面积的比例，应该是一个很有解释能力的变量。南方很多城市“半违章”的城中村，使得低成本可租赁住房的可获得性远远高于北方城市。正是这些低成本的住宅，使得利润微薄的制造业得以在地价昂贵的大城市生存下来。\n这段文字重在说明：","options":{"A":"城市管理者不应对已有的城中村违章现象加以限制","B":"利润微薄的制造业很难在房价高昂的城市生存发展","C":"低成本可租赁住房的可获得性决定了制造业的发展","D":"制造业在南方城市的发展与廉租房的供给密切相关"},"answer":"C","explanation":"文段首先介绍了中国低成本租赁住房的很多功能由“城中村”承担的背景，随后以“城中村”占城市面积的比例，引出南北城市发展差距扩大的问题。接着论述了南方“半违章”的城中村，使得其比北方低成本可租赁住房的可获得性高很多。尾句通过程度词“正是”强调了制造业能够在大城市生存下来的原因就是这些低成本的住宅，对应C项。\nA项，“不应对已有的城中村违章现象加以限制”无法从文段中得出该项对策，且该表述有违常识，违章现象显然是应该加以限制的，排除；\nB项，“很难在房价高昂的城市生存发展”与文意相悖，文段尾句已经给出制造业在大城市生存的路径，排除；\nD项，“廉租房”偷换概念，文段论述的为低成本可租赁性住房，且“密切相关”表述不明确，文段尾句强调了低成本住宅是制造业能够在大城市发展的原因，排除。\n故正确答案为C。\n【文段出处】《不解决住房问题，就不会有成功的城市化》","no":29,"missingImage":false},{"qid":"2742078","cat":"片段阅读","stem":"知情同意原则普遍适用于医疗领域，通过对患者进行风险告知来加强患者的自决权。医疗作为一种高风险活动，其风险来源主要包括医疗的固有风险和医方的过失。固有风险通常受制于医疗技术的客观发展水平，医方的过失风险系指医方主观过错可能导致的风险。当然，此种风险也不排除可能会受制于相应医疗科学技术的实际发展情况。医方通过告知患者相应风险，从而一定程度保证医疗风险的透明性与客观性。究其实质，更是一种风险的承担。\n这段文字中，选取的关键词最恰当的是：","options":{"A":"知情同意  医疗领域  风险承担","B":"医疗领域  患者自决权  医疗风险","C":"医疗领域  风险告知  风险承担","D":"知情同意  患者自决权  医疗风险"},"answer":"A","explanation":"文段首句对“知情同意原则”进行解释，即适用于医疗领域，能够通过风险告知加强患者的自决权；接着论述医疗风险是什么，并通过“固有风险”和“医方的过失”进行具体地解释说明；最后通过“究其实质”强调知情同意原则的实质是“风险的承担”。文段先解释了“知情同意原则”的概念，再引出“风险”这一话题，并强调知情同意原则的“风险承担”实质，重点阐述知情同意、风险承担，锁定A项。\nB、C两项均未提及“知情同意”，偏离文段核心，排除；\nA项和D项比较，A项的“医疗领域”和D项的“患者自决权”均是首句中对“知情同意”的概念解释内容，没有明显的重点区分；再对比“风险承担”和“医疗风险”，前者与文中“究其实质”后所点明的本质契合度更高，后者表述则不够明确，排除D项。\n故正确答案为A。\n【文段出处】《知情同意原则抑或信赖授权原则——兼论数字时代的信用重建》","no":30,"missingImage":false},{"qid":"2742081","cat":"片段阅读","stem":"饮食行业的标准化是多年来的一个趋势，最大的好处是降低成本和保障安全，这种一致性带来的流水线产品，在中国人心中也会意味着多少缺少点儿灵魂。美食是需要惊喜和个性的，吃到不同才是美食要义，哪怕会冒险。日常生活中既要多用配方和量具获得便利，又要跳出来，根据不同食材、不同季节为不同舌尖找到味觉的最佳刻度，这是厨房的乐趣。\n下列说法不符合文意的是：","options":{"A":"为了行业标准而牺牲美食的趣味终究有缺憾","B":"配方和量具的普遍使用造成了饮食无差别化","C":"流水线的饮食制作可能无法带来味蕾的惊喜","D":"品尝因地制宜因季而为的美食是食客的乐趣"},"answer":"D","explanation":"A项，根据“饮食行业的标准化是多年来的一个趋势，······在中国人心中也会意味着多少缺少点儿灵魂”可知，饮食行业的标准化，一致性的流水线产品是有缺憾的，表述正确，排除；\nB项，根据“美食是需要惊喜和个性的，吃到不同才是美食要义，哪怕会冒险。日常生活中既要多用配方和量具获得便利，又要跳出来，······。”可知，配方和量具的使用让饮食无差别化，表述正确，排除；\nC项，根据“美食是需要惊喜和个性的，吃到不同才是美食要义，哪怕会冒险。日常生活中既要多用配方和量具······”可知，一致性带来的流水线产品可能无法带来味蕾的惊喜，表述正确，排除；\nD项，根据“根据不同食材、不同季节为不同舌尖找到味觉的最佳刻度，这是厨房的乐趣”可知，文中只介绍了厨房的乐趣，而未触及“食客的乐趣”这一层面，表述错误，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《什么都是“少许”“适量”，中餐相比西餐不讲究精确吗？当然不是》","no":31,"missingImage":false},{"qid":"2742196","cat":"片段阅读","stem":"当前，电子产品的使用成为一种大趋势，很多儿童青少年习惯于在网上学习和娱乐，近视防控难度加大，保护儿童青少年眼健康，应改变“重治轻防”观念，做到早发现早干预，要坚持医防协同的防治策略，开展覆盖生命全周期的视觉健康服务。儿童青少年近视是公共卫生问题，必须从健康教育入手，以公共卫生服务为抓手，培养儿童青少年和家长的自主健康行为，积极宣传推广预防儿童青少年近视的视力健康科普知识。\n下列关于保护儿童青少年眼健康的措施，文中未涉及的是：","options":{"A":"限制校园内学生的网上学习时间","B":"重防重治，做到早发现早干预","C":"长期坚持常态化的视觉健康服务","D":"大力宣传视力健康科普知识"},"answer":"A","explanation":"由提问方式可知，本题为细节判断题。\nA项，“限制校园内学生的网上学习时间”文段并未提及，文段仅表示很多儿童青少年习惯于在网上学习和娱乐，表述无中生有，当选；\nB项，根据“应改变‘重治轻防’观念，做到早发现早干预”可知，表述正确，排除；\nC项，根据“开展覆盖生命全周期的视觉健康服务”可知，“坚持常态化的视觉健康服务”表述正确，排除；\nD项，根据“积极宣传推广预防儿童青少年近视的视力健康科普知识”可知，“大力宣传视力健康科普知识”表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《青少年预防近视的最佳方案！》","no":32,"missingImage":false},{"qid":"2742167","cat":"片段阅读","stem":"截至2019年末，我国60岁及以上人口已超过2.5亿，占总人口的\u003cimg data-k=\"0a3296b14394\">，也就是说，差不多5个人中，就有一位老人。当前，即便是城镇地区，非网民占比也达到了\u003cimg data-k=\"ba3c5cd2c489\">。随着老年群体规模日益庞大，在公共服务的提供上，尽最大努力照顾老年人的诉求，已显得越来越必要，它已经不能用“照顾少数人需求”来形容了。在当前这样“快进”的互联网时代，不上网的老人远比我们想象中的多。他们的正常需求，不能因为不上网就被无视。\n这段文字着重强调的是：","options":{"A":"上亿不上网的老年人应该被互联网社会所接纳","B":"需为庞大的老年人群体提供更便利的公共服务","C":"帮助老年人跟上互联网时代应该提上议事日程","D":"“照顾少数人需求”应成为关爱老年人的行动"},"answer":"B","explanation":"文段开篇以我国60岁及以上人口现状和非网民占比情况引出话题，紧接着指出在提供公共服务方面照顾老年人需求的重要性，并分析其原因，即不上网的老年人数量庞大，最后尾句强调老年人在公共服务方面的正常需求应该被正视，对应B项。\nA项，“被互联网社会所接纳”表述不明确，且未提及“公共服务”，偏离文段核心话题，排除；\nC项，文段论述重点为应正视老年人在公共服务方面的需求，“跟上互联网”偏离文段核心话题，排除；\nD项，“照顾少数人需求”对应文段“它已经不能用‘照顾少数人需求’来形容了”，为文段解释说明部分，非重点，排除。\n故正确答案为B。\n【文段出处】澎湃《别忘了，我们都坐在同一辆公交车上》","no":33,"missingImage":false},{"qid":"2742072","cat":"片段阅读","stem":"国土空间的规划与开发对各个领域都会产生巨大影响，对环境治理和生态保护尤其如此，因此有必要将空间治理规则纳入现代环境治理体系。为此，需要系统梳理现行环境保护单行法，矫正单行法只规范单一环境要素的不足，为单行法创设内部协调机制，正在制定和修改的自然保护地法律法规，比如自然保护地法、国家公园法、自然保护区条例等，也需要在具体内容层面突出不同类型自然保护地中自然资源、生态系统的价值位序，及其特定的空间结构。\n这段文字意在强调：","options":{"A":"需要完善协调环境空间治理相关法律法规","B":"相关法律法规不能仅仅规范单一环境要素","C":"环境空间治理法治化具有极其重要的意义","D":"修订法律法规必须凸显环境空间治理要义"},"answer":"A","explanation":"文段首先指出要将空间治理规则纳入现代环境治理体系当中，紧接着通过指代词“为此”得出结论，首先通过“需要”强调“环境保护单行法”要规避单一要素，创设内部协调机制，随后通过“也”引导并列对策，强调正在制定和修改的自然保护地法律法规，要突出不同的价值位序和特定的空间结构。故文段重点强调需要完善环境空间治理的相关法律法规，对应A项。\nB项，“相关法律法规不能仅仅规范单一环境要素”表述片面，且表述不明确，排除；\nC项，文段重点强调要完善环境空间治理法律法规，而非其意义，非重点，排除；\nD项，“修订法律法规”范围扩大，文段论述的是环境空间治理的相关法律法规，排除。\n故正确答案为A。\n【文段出处】人民网《人民日报：完善环境空间治理规则》","no":34,"missingImage":false},{"qid":"2742077","cat":"语句表达","stem":"经济法法治理论的构建，需要关注法治理论的一般问题，包括法治理念、法治价值、法治目标、法治手段、法治运行、法治实效等，并应当探讨法的稳定性与变易性、确定性与模糊性等问题。在此基础上，应结合经济法的特殊性和经济法治的特殊问题，深化经济法的立法理论特别是法律优化理论的研究，以促进经济法从“法”到“良法”的发展，                    。\n填入画横线处最恰当的是：","options":{"A":"从而提升立法质量和法治水平","B":"提升经济法基本理论研究水平","C":"提高经济法的法治理论水平","D":"进而构建高水平经济法理论"},"answer":"A","explanation":"前文阐述经济法的法治理论的构建需要关注以及探讨的一些问题，后文“在此基础上······”阐述了如何深化经济法的立法理论，以促进其向“良法”发展，故横线处应阐述提升其立法质量和法治水平，A项“提升立法质量”对应“从‘法’到‘良法’的发展”，“法治水平”对应开篇“经济法法治理论的构建”，符合文意，当选。\nB、D两项均未提及“法治”，表述片面，排除；\nC项，只提及“法治”，前文“深化经济法的立法理论······”也阐述了立法相关的内容，表述片面，排除。\n故正确答案为A。\n【文段出处】《经济法的法治理论》","no":35,"missingImage":false},{"qid":"2742045","cat":"逻辑填空","stem":"依法行政是依法治国的重要环节，是指行政机关依照宪法法律规定取得并行使其行政权力，并对其行政行为的后果承担相应责任。依法治国和依法行政的        ，需要各级政府及其工作人员在法治        上行使权力、在宪法法律范围内活动。\n依次填入画横线处最恰当的一项是：","options":{"A":"实现 轨道","B":"实施 基础","C":"执行 框架","D":"履行 道路"},"answer":"A","explanation":"第一空，根据后文“需要各级政府······行使权力、在宪法法律范围内活动”可知，“需要”之后是具体的做法，横线处表示“依法治国和依法行政”是后文做法要达到的目标。A项“实现”意为使成为事实，符合文意，保留。B项“实施”、C项“执行”和D项“履行”均表示采取具体的行为，在文段中“依法治国和依法行政”是目标，均没有“实现”用在此处准确恰当，与文意不符，排除。\n第二空，代入验证，“法治轨道”为常用搭配，A项符合语境，当选。\n故正确答案为A。\n【文段出处】《冯果：坚持依法治国、依法执政、依法行政共同推进 不断深化对法治的规律性认识》","no":36,"missingImage":false},{"qid":"2742169","cat":"逻辑填空","stem":"数字经济其实早已不是什么新鲜事物，只是            的新冠肺炎疫情，让人们更        、更真切地领略到数字经济的“魔力”，也对我国创新能力、创新成果有了更具象、更深刻的认知。\n依次填入画横线处最恰当的一项是：","options":{"A":"猝不及防 具体","B":"突如其来 直观","C":"出乎意料 精准","D":"无孔不入 感性"},"answer":"B","explanation":"第一空，横线处所填成语搭配“新冠肺炎疫情”，A项“猝不及防”指事情突然发生，来不及防备；B项“突如其来”指出乎意料地突然发生；C项“出乎意料”指出于人们的意料，在人们的意料之外，三项均可搭配疫情，表示疫情的突然。D项“无孔不入”比喻利用一切机会四处钻营，与疫情搭配不当，排除。\n第二空，由“、”可知，横线处所填词语应与后文“真切”构成并列关系，且同时搭配“领略”。“真切”表示真实确切；清楚明白，A项“具体”表示不抽象，C项“精准”表示非常准确，均无法与“真切”构成并列，排除；B项“直观”指用感观直接接受的或直接观察的，与“真切”语义相近，当选。\n故正确答案为B。\n【文段出处】大河网《疫情之下，数字经济催生“三新”迸发》","no":37,"missingImage":false},{"qid":"2742171","cat":"逻辑填空","stem":"城市是人类进入文明时代的关键标志，是文明成果的        之地，城市不仅仅是非农人口与产业的空间集聚，也        了适应时代变化的经济社会文化生活，从古至今都是经济文化的“高地”。\n依次填入画横线处最恰当的一项是：","options":{"A":"汇聚 培育","B":"积淀 滋养","C":"荟萃 孕育","D":"展示 滋生"},"answer":"C","explanation":"第一空，根据“城市不仅仅是非农人口与产业的空间集聚”“适应时代变化的经济社会文化生活，从古至今都是经济文化的‘高地’”可知，文明成果可对应文段“非农人口与产业的空间集聚”“经济文化的‘高地’”，即体现文明成果的多且好，C项“荟萃”指英俊的人物或精美的东西汇集、聚集，符合文意，保留。A项“汇聚”指会在一处，没有分开，未能体现文明成果好之意，排除；B项“积淀”指长期积累沉淀（多指某种思想、文化、经验等），未能体现文明成果好之意，排除；D项“展示”指清楚地摆出来，明显地表现出来，未能体现文明成果多且好之意，排除。\n第二空，代入验证，C项“孕育”指怀胎生育，比喻既存的事物中酝酿着新事物，可体现出经济社会文化生活在城市中诞生之意，符合文意，当选。\n故正确答案为C。\n【文段出处】《城市历史不同于“城市史”》","no":38,"missingImage":false},{"qid":"2742023","cat":"逻辑填空","stem":"科学和艺术都追求普遍性和永恒性，追求“真”和“美”。关于普遍性和永恒性是            的，科学求“真”和艺术求“美”也无需赘言。科学追求的美主要是和谐之美和简洁之美。至于“艺术求真”，是艺术家通过自己的        把事物的本质揭示出来，这是“源于生活，高于生活”的艺术创作原则。\n依次填入画横线处最恰当的一项是：","options":{"A":"显而易见 体验","B":"不言自明 把握","C":"有目共睹 认知","D":"不言而喻 感悟"},"answer":"D","explanation":"第一空，根据并列标志词“也”引导的“无需赘言”可知，横线处应同样表达道理很直接明显、不需过多解释的意思。A项“显而易见”形容事情或道理很明显，极容易看清楚，B项“不言自明”指不用说话就能明白，D项“不言而喻”指道理或用意不用说出来，别人就知道，三者均符合文意，保留。C项“有目共睹”指人人都可以看到，极其明显，常形容人取得的成就，与文段语境不符，排除。\n第二空，根据“源于生活、高于生活”可知，“艺术求真”不仅仅是对生活的基本反映，还是艺术家在对生活感知、思考和理解的基础之上再来揭示事物的本质。D项“感悟”指有所感触而领悟，符合文意，当选。A项“体验”指亲身经历，仅靠“体验”是无法直接揭示事物的本质的，语境不符，排除；B项“把握”指抓住，其后多搭配“把握”的对象，如“把握时机”“把握方向”等，此处用法不当，排除。\n故正确答案为D。\n【文段出处】《严加安：科学与艺术》","no":39,"missingImage":false},{"qid":"2742181","cat":"逻辑填空","stem":"工业遗产是一道独特的风景。若能挖掘工厂、矿山的历史文化与科普价值，通过创造性规划和          开发，将它们改造成博物馆、文创园，既能让工业遗产重焕光彩，也让人们得以        历史、憧憬未来。\n依次填入画横线处最恰当的一项是：","options":{"A":"商业性 回馈","B":"抢救性 回溯","C":"保护性 回望","D":"艺术性 回归"},"answer":"C","explanation":"第一空，根据“挖掘工厂、矿山的历史文化与科普价值”“将它们改造成博物馆、文创园”可知，横线处要体现出让“工业遗产”发挥“博物馆、文创园”的作用，C项“保护性”、D项“艺术性”，均符合文意，保留。A项“商业性”强调商业价值，与文段无法对应，排除；B项“抢救性”指在紧急危险的情况下迅速救护，文段并未体现紧急危险的情况，与文意不符，排除。\n第二空，根据横线后“、”可知，横线处与“憧憬”构成对应，“憧憬”指对某种事物的期待与向往，故横线处表意为对历史的回顾，C项“回望”指回顾，回头看，与文意相符，当选。D项“回归”指回到，返回，体现不出回顾历史之意，与文意不符，排除。\n故正确答案为C。\n【文段出处】《旧址不旧 锈迹变“秀”》","no":40,"missingImage":false},{"qid":"2742187","cat":"逻辑填空","stem":"有学者认为，跨文化的叙述和理论能力，即将本土历史经验在        概括中理论化，使之能够触动和指导有着不同历史经验的人们的生活和        ，是近代以来中国先贤们始终追寻的目标，也是文化中国在更新自身的        中影响世界的具体方式。\n依次填入画横线处最恰当的一项是：","options":{"A":"提炼 思考 传统","B":"归纳 思想 特质","C":"总结 思索 特性","D":"凝练 思辨 传承"},"answer":"D","explanation":"本题可从第三空着手，由“触动和指导有着不同历史经验的人们的生活和······，是······，也是······”可知，横线所在句是对“触动和指导有着不同历史经验的人们”的解释说明，表达文化中国在历史进程中一直在发挥作用，不断影响后人，D项“传承”指传授和继承，符合文意，保留。B项“特质”指特有的性质，C项“特性”指特殊的品性，均不符合文意，排除；A项“传统”指世代相传的具有特点的风俗、道德、思想、作风、艺术、制度等社会因素，不符合文意，排除。\n第一空，代入验证，横线处搭配“概括”，D项“凝练”指（文字）紧凑简练，搭配恰当，保留。\n第二空，代入验证，由文段可知，横线处应表达拥有不同历史经验的人们对不同事物的思索辨识之意，D项“思辨”符合文意，当选。\n故正确答案为D。\n【文段出处】《颜海平：跨文化是近代以来中国和世界始终亟需的能力》","no":41,"missingImage":false},{"qid":"2742034","cat":"逻辑填空","stem":"提质升级的公共文化服务极大提升了群众的获得感和幸福感，成为小康生活            的一部分。通过公共文化服务，更多人享受到了中国文化繁荣发展的成果，更多的普通人能徜徉于书海，        于艺术，为中华文化的            而惊叹，成为民族自信心和自豪感的重要滋养。\n依次填入画横线处最恰当的一项是：","options":{"A":"不可分割 忘情 鬼斧神工","B":"互为表里 移情 独步天下","C":"相辅而行 钟情 出神入化","D":"不可或缺 纵情 博大精深"},"answer":"D","explanation":"第一空，由前文“······极大提升了群众的获得感和幸福感”可知，公共文化服务已成为小康生活重要组成部分。A项“不可分割”表示不容许割裂、拆开，D项“不可或缺”表示不可缺少。二者均可表示公共文化服务对于小康生活的重要性，保留。B项“互为表里”比喻互相依存，互相接受，C项“相辅而行”表示互相协助进行或互相配合使用，文段公共文化服务与小康生活之间并非相互依存，互相配合的关系，均与文意不符，排除。\n第二空，由“徜徉于书海······于艺术”可知，两句为并列关系，横线处与“徜徉”语义相近，表达沉醉于艺术之意。A项“忘情”表示不能控制自己的感情，D项“纵情”表示尽情，二者均符合文意，保留。\n第三空，搭配“中华文化”且由前文可知，横线处表示中华文化内容丰富之意。D项“博大精深”指思想、学说等广博高深，与“中华文化”搭配得当，且符合文意，当选。A项“鬼斧神工”形容建筑、雕塑等的技艺非常精细巧妙，好像不是人工所能制成，与“中华文化”搭配不当，排除。\n故正确答案为D。\n【文段出处】《人民日报人民时评：公共文化添彩小康生活》","no":42,"missingImage":false},{"qid":"2742192","cat":"逻辑填空","stem":"用大概率思维应对小概率事件，重在            、防患于未然。在思想深处绷紧防范        小概率事件风险这根弦，从考验中        经验，补足应急管理体系和能力的短板和漏洞，使之更加完善更具威力。\n依次填入画横线处最恰当的一项是：","options":{"A":"居安思危 消解 获得","B":"举一反三 消除 总结","C":"未雨绸缪 化解 汲取","D":"见微知著 规避 吸纳"},"answer":"C","explanation":"第一空，由顿号可知，横线处与“防患于未然”语义相近，“防患于未然”指在祸患发生之前就加以预防。A项“居安思危”指处在安定的环境里，也想着可能会出现的危险，C项“未雨绸缪”指趁着天还没有下雨，先修缮好门窗，比喻事先做好准备工作，均符合文意，保留。B项“举一反三”指从一件事情类推而知道其他许多事情，D项“见微知著”指看到微小的苗头，就知道可能会发生显著的变化，均无法体现“防范”的含义，与文意不符，排除。\n第二空，搭配“风险”，横线处应表达解除风险之意。A项“消解”指消释，与“风险”搭配不当，排除。C项“化解”指消除，且“化解风险”为常见搭配，保留。\n第三空，代入验证，C项“汲取”指吸收、吸取，与“经验”搭配恰当，当选。\n故正确答案为C。\n【文段出处】《人民日报思想纵横：用大概率思维应对小概率事件》","no":43,"missingImage":false},{"qid":"2742039","cat":"逻辑填空","stem":"农产品销路问题，事关国计民生、产业转型，影响着农村发展后劲。不过，打开销路，            还是要看农产品的品质。为此，在            的销售市场中，应当积极引导农户转变经营观念、革新种植技术，培育更多优质农产品，努力在扩大销路与提升品质之间形成            。\n依次填入画横线处最恰当的一项是：","options":{"A":"追根溯源 硝烟四起 互利共赢","B":"归根结底 优胜劣汰 良性循环","C":"说千道万 品质为王 动态平衡","D":"千头万绪 不进则退 联动机制"},"answer":"B","explanation":"第一空，横线处论述农产品的品质和打开销路的关系，表达农产品的品质对打开销路的重要性。A项“追根溯源”指追溯事物发生的根源，B项“归根结底”指归结到根本上，C项“说千道万”形容话说的很多，均符合文意，保留。D项“千头万绪”比喻事情的开端，头绪非常多，也形容事情复杂纷乱，与文意不符，排除。\n第二空，搭配“销售市场”，B项“优胜劣汰”指在生存竞争中适应力强的保存下来，适应力差的被淘汰，C项“品质为王”论述品质的重要性，均可与“销售市场”搭配，保留；A项“硝烟四起”指战火四起，战争爆发或者爆发之前的那种紧张气氛，常用来形容战争场面，与“销售市场”搭配不当，排除。\n第三空，横线处需体现“扩大销路与提升品质”之间的关系，B项“良性循环”指事物之间形成共同促进的因果关系，是有益模式，可体现出二者的相互促进关系，符合文意，当选，C项“动态平衡”指物质在不断运动和变化下的宏观平衡，允许在过程中出现不平衡，文段侧重销路与品质的良性促进关系，词语与文意不符，且该词常用于形容性质相同的两类事物，“销路与品质”并非性质相同的两类事物，排除。\n故正确答案为B。\n【文段出处】《人民网：把农产品销路“跑”出来》","no":44,"missingImage":false},{"qid":"2742029","cat":"逻辑填空","stem":"科研人员是科技创新的核心力量，也是科普创作和科学传播的重要生力军。然而，由某科普研究所开展的一项调查显示，相比之下，我国的科普人力资源严重失衡，尤其是作为科普源头的科普创作人力资源更是            。推动科研人员参与科普事业，成为            。国家也在倡导科研人员参与科普，从科研人员的角度来说，这也是            的事情。\n依次填入画横线处最恰当的一项是：","options":{"A":"难以为继 燃眉之急 义不容辞","B":"凤毛麟角 重中之重 理所当然","C":"后继无人 人心所向 舍我其谁","D":"捉襟见肘 当务之急 责无旁贷"},"answer":"D","explanation":"第一空，由横线前的“更”可知，横线处成语与前文“严重失衡”构成递进关系，表达含义程度更重，体现出科普创作人力资源极为紧张之意。B项“凤毛麟角”比喻珍贵而稀少的人或物，D项“捉襟见肘”比喻顾此失彼，穷于应付，两项均可体现出当前科普创作人力资源的紧张，符合文意，保留；A项“难以为继”指难于继续下去，常指事物的发展状况，比如“经济拮据导致治疗难以为继”，与“科普创作人力资源”搭配不当，排除；C项“后继无人”意思是没有后人来继承前人的事业，文段仅表示人力资源极为紧张，但不代表没有，程度过重，排除。\n第二空，根据文意可知，在当前科普人力资源严重失衡、不够用的情况下，推动科研人员参与科普事业是非常紧迫的事情。对比选项，D项“当务之急”意思是当前急切应办的要事，符合文意，保留；B项“重中之重”是指重要部分中的重要内容，文段仅表达“推动科研人员参与科普事业”的重要性，并无“重中”的表述，排除。\n第三空，代入验证，对于科研人员而言，参与科普应属于本职工作内且有能力做到的事情。D项“责无旁贷”意思是自己的责任不能推卸给别人，多用于指自己应当做的不可推卸的事，符合文意，当选。\n故正确答案为D。\n【文段出处】《科研人员参与科普：意识在提升，激励是关键》","no":45,"missingImage":false}]}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"27422
