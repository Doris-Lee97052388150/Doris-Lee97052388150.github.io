48\">\u003cimg data-k=\"2d5a0f5080d2\">\u003cimg data-k=\"fbad166f0f3a\">\u003cimg data-k=\"a7118f03557a\">；过火面积\u003cimg data-k=\"ae57bf694ed3\">，\u003cimg data-k=\"4bcb7297bf08\">\u003cimg data-k=\"a54972b4e793\">，圆形小岛面积\u003cimg data-k=\"2eeb340960c9\">。故过火面积所占比例为\u003cimg data-k=\"ab977771b30b\">\u003cimg data-k=\"2c7ba79dd13c\">\u003cimg data-k=\"2afab8b69da8\">。\n故正确答案为B。","no":69,"missingImage":false},{"type":"question","qid":"3522411","cat":"数学运算","stem":"我国一支工兵部队在某国执行维和任务，负责道路抢修工作。某天，该部队负责的道路被炮弹炸出一个球面形状的大坑。经测量，弹坑直径16m，深4m。现需用车辆运送混凝土填充弹坑，铺平道路，假设每车次可运输\u003cimg data-k=\"308191250dfa\">的混凝土，问抢修道路至少需要出动运输车多少车次？（球缺体积计算公式为\u003cimg data-k=\"c6ff46501913\">，其中\u003cimg data-k=\"572ab59e28b8\">为球半径，\u003cimg data-k=\"d34d99025175\">为球缺高，\u003cimg data-k=\"7ed4e15bb935\">为球缺体积）","options":{"A":"65","B":"66","C":"67","D":"68"},"answer":"C","explanation":"球缺是指球被平面截下的部分，题干中的大坑即为一个球缺。如图所示，球缺高即为BD线段长，\u003cimg data-k=\"bc51d734cc70\">m；在直角三角形OCD中，根据“弹坑直径16m”，可知截面半径CD\u003cimg data-k=\"1b27ee8d71a4\">m，OD\u003cimg data-k=\"5f28e7ef4d30\">m，OC\u003cimg data-k=\"9ccc14e62391\">m，依据勾股定理，\u003cimg data-k=\"10b2857bf711\">，解得\u003cimg data-k=\"6afdc3e672fb\">；将球的半径\u003cimg data-k=\"572ab59e28b8\">与球缺高\u003cimg data-k=\"d34d99025175\">代入球缺体积公式，可得球缺体积\u003cimg data-k=\"3d9f1c6a9185\">\u003cimg data-k=\"3290cfa6756b\">\u003cimg data-k=\"5d7852700581\">\u003cimg data-k=\"792f4fa22214\">，所需\u003cimg data-k=\"73434b007c43\">车次，即66车次不够，至少需要67车次。\n\u003cimg data-k=\"23f9c05446a7\" style=\"max-width:323px\">\n故正确答案为C。\n【备注】本题不严谨，题干所给公式中的\u003cimg data-k=\"572ab59e28b8\">，理论上应为球缺底面的半径，但在考场上，按照命题人所给的公式及字母含义解题即可。","no":70,"missingImage":false}],"count":15,"answerable":15,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"3522441","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"28a079d71dab\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成相同，优先考虑位置规律。观察发现，题干第一组图形中的两个白球在九宫格外圈整体顺时针平移2格，而两个“十字”在九宫格外圈整体顺/逆时针平移4格。第二组图形应遵循同样规律，只有D项满足。\n故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"3522437","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"0c14aaee82b7\" style=\"max-width:482px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相似，优先考虑样式规律，经过验证无规律。继续观察发现，图形均明显被分割，考虑数量规律中的面数量。第一行图形中面的数量满足：\u003cimg data-k=\"bbbecad22587\">，第二行图形中面的数量满足：\u003cimg data-k=\"511b97dce847\">，则第三行图形中面的数量应满足：\u003cimg data-k=\"7be0d359132b\">，A、C、D三项均不满足，B项当选。\n故正确答案为B。","no":72,"missingImage":false},{"type":"question","qid":"3523382","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"af0a32787871\" style=\"max-width:486px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"题干图形元素组成不同，且无明显属性规律，优先考虑数量规律。题干第二、四幅图及四个选项中的图形均为立体图形，虚线为所视角度下看不见的棱，题干图形的交点（顶点）数分别为：3、4、5、6，所以问号处图形的交点数应为7个，选项图形的交点数分别为7、5、8、6，只有A项符合规律。\n故正确答案为A。","no":73,"missingImage":false},{"type":"question","qid":"3523357","cat":"图形推理","stem":"把下面的图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"011207bc5cfc\" style=\"max-width:700px\">","options":{"A":"①④⑥，②③⑤","B":"①③⑤，②④⑥","C":"①②④，③⑤⑥","D":"①⑤⑥，②③④"},"answer":"A","explanation":"本题为分组分类题目。元素组成不同，无明显属性规律，考虑数量规律。观察发现，每幅图均有4个元素，且均存在两个相同元素，图①④⑥中相同元素都是相对的，图②③⑤中相同元素都是相邻的。即①④⑥为一组，②③⑤为一组。\n故正确答案为A。","no":74,"missingImage":false},{"type":"question","qid":"3523381","cat":"类比推理","stem":"从所给四个选项中，选出能与给定的①、②、③、④零件共同构成如下图所示的\u003cimg data-k=\"f15124717a01\">方块组合的一项：\n\u003cimg data-k=\"bd836b9ea4c6\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"注：本题不严谨，CD都能拼成，选哪个都算对，因粉笔题库系统只能设置一个正确答案，故暂定答案为C。\n解析一：优先考虑数数，但是选项都是4个方块，无法排除选项，因此考虑拼合。优先考虑把方块数量多的图进行拼合，可将图①贴边放，图②可以与图①拼在同一层，该层只差一个小方块，图④刚好竖着放，能填补空缺的小方块，那么底下一层拼满；再看上面一层，可以把图③贴边放，而且无论图③如何贴边放，都有一个单独的小方块空缺，刚好可以和图④的另一个小方块拼凑起来，观察发现，剩余空缺的部分刚好就是C项中的图形。\n\u003cimg data-k=\"d99dd72a386e\" style=\"max-width:700px\">\n故正确答案为C。\n解析二：如下图所示，将图③、图④拼在一起，那么这层还差1个方块和2个连在一起的方块可以填满，图①立起来刚好有1个方块可以填到该层空缺处，图②立起来刚好能填满另外2个方块空缺处，最底下一层可拼满；再看上面一层，刚好差4个方块的正方形，即D项中的图形可以填满上面一层。\n\u003cimg data-k=\"8d0b71fcddb7\" style=\"max-width:700px\">\n故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"3522430","cat":"定义判断","stem":"拟剧理论指人与人在社会生活中的相互行为在某种程度上是一种表演。每一个人就像演员一样，在某种特定的场景下，按照一定的角色要求在舞台上表演给观众看。在整个表演过程中，人总是尽量使自己的行为更为接近想要呈现给观众的那个角色，观众看到的是那个表现出来的角色而不是演员本身。当表演结束，演员回到后台以后，他的真实面目才展现出来，演员才又恢复其本来的自我。\n根据上述定义，下列选项不能印证拟剧理论的是：","options":{"A":"小丽来找小明探讨功课，小明没有立刻开门，而是先把臭袜子藏到床下","B":"在“国王的新装”故事里，新装展示游行时臣民交口称赞新装华贵美丽","C":"小魏生活拮据但工作努力，老板不动声色地开豪车替其去机场接其父母","D":"小菲通过盗图和拼接，天天在微信朋友圈发吃美食、健身、游玩的照片"},"answer":"C","explanation":"第一步：找出定义关键词。\n“人与人的相互行为某种程度上是种表演”、“使自己的行为接近想要呈现的角色”、“观众看到的是角色而不是演员本身”、“表演结束后，恢复本来的自我”。\n第二步：逐一分析选项。\nA项：小明没有立刻开门，而是先把臭袜子藏到床下，说明他不想被小丽看到自己邋遢的一面，符合“使自己的行为接近想要呈现的角色”、“观众看到的是角色而不是演员本身”，符合定义，排除；\nB项：在“国王的新装”故事里，国王实际没有穿衣服，但是臣民交口称赞新装华贵美丽，符合“人与人的相互行为某种程度上是种表演”，符合定义，排除；\nC项：小魏生活拮据工作努力，但是开豪车接父母的人是老板不是小魏，没有体现二者的行为是表演出来的，不符合“人与人的相互行为某种程度上是种表演”，不符合定义，当选；\nD项：小菲天天在微信朋友圈发照片是通过盗图和拼接，说明朋友圈呈现的并非她的真实生活，符合“使自己的行为接近想要呈现的角色”、“观众看到的是角色而不是演员本身”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":76,"missingImage":false},{"type":"question","qid":"3522406","cat":"定义判断","stem":"人合公司是指以股东的个人信用为公司信用基础的公司；资合公司是指由公司股东分别出资而形成的财产作为信用基础的公司；人资兼合公司则同时具备上述两种性质的信用基础。\n根据上述定义，下列哪个公司属于人合公司：","options":{"A":"某公司注册资本为全体股东缴纳股本的总和，股东的出资以现金及财产为限，根据出资对公司负责","B":"某公司的全部股份由公司独立创立者百分百持有，公司聘请多位经验丰富的职业经理人分管不同业务","C":"某公司由于经营不善导致资金链断裂，在申请破产时以全部注册资本作数，股东个人财产并不受影响","D":"某公司的资产以股东个人的所有财产为抵押，股东对公司经营负无限责任，并且不能任意地转让股份"},"answer":"D","explanation":"第一步：找出定义关键词。\n人合公司：“以股东的个人信用为公司信用基础”；\n资合公司：“由公司股东分别出资而形成的财产作为信用基础”；\n人资兼合公司：同时以“股东的个人信用”和“股东分别出资而形成的财产”作为信用基础。\n第二步：逐一分析选项。\nA项：某公司注册资本为全体股东缴纳股本的总和，符合“公司股东分别出资而形成的财产”，属于资合公司，不属于人合公司，排除；\nB项：某公司的全部股份由公司独立创立者百分百持有，但是公司聘请多位经验丰富的职业经理人分管不同业务，不符合“以股东的个人信用为公司信用基础”，不属于人合公司，排除；\nC项：股东个人财产并不受影响，说明不符合“以股东的个人信用为公司信用基础”，不属于人合公司，排除；\nD项：以股东个人的所有财产为抵押，股东对公司经营负无限责任，符合“以股东的个人信用为公司信用基础”，属于人合公司，当选。\n故正确答案为D。","no":77,"missingImage":false},{"type":"question","qid":"3522418","cat":"定义判断","stem":"文化挪用是指将本不属于本地的异域或其他民族的文化资源借用过来，从而对本地的文化形成影响，创造出新的文化产品的现象。\n根据上述定义，下列属于文化挪用的是：","options":{"A":"某苗族民间工艺组织设计制作的具有苗绣元素的彩绘玻璃、蜡染布等文创作品畅销全国","B":"某法国女生在毕业舞会上穿着优雅别致的印度传统服装纱丽翩翩起舞，让大家大饱眼福","C":"某荷兰社区大学为学生开设中华太极拳课程以增强他们的健身意识，受到学生普遍欢迎","D":"世界之窗展示了众多全球著名景观和建筑成为深圳打卡的地标，是当地热门的旅游景点"},"answer":"D","explanation":"第一步：找出定义关键词。\n“将本不属于本地的异域或其他民族的文化资源借用过来”、“对本地的文化形成影响”、“创造出新的文化产品”。\n第二步：逐一分析选项。\nA项：某苗族民间工艺组织设计制作的具有苗绣元素的文创作品，不符合“将本不属于本地的异域或其他民族的文化资源借用过来”，不符合定义，排除；\nB项：某法国女生穿着印度传统服装纱丽翩翩起舞，符合“将本不属于本地的异域或其他民族的文化资源借用过来”，但让大家大饱眼福，不符合“创造出新的文化产品”，不符合定义，排除；\nC项：某荷兰社区大学为学生开设中华太极拳课程，符合“将本不属于本地的异域或其他民族的文化资源借用过来”，但是并没有“对本地的文化形成影响”、“创造出新的文化产品”，不符合定义，排除；\nD项：世界之窗展示了众多全球著名景观和建筑，符合“将本不属于本地的异域或其他民族的文化资源借用过来”，成为当地热门的旅游景点，符合“对本地的文化形成影响”、“创造出新的文化产品”，符合定义，当选。\n故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"3523359","cat":"定义判断","stem":"分粥效应是哲学家罗尔斯在《正义论》中讨论社会财富时做的一个比喻，说明只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度。这种制度不但要科学，而且其制定一定要有所依据、简单明了，具有针对性、可操作性，便于执行。\n根据上述定义，假设“M”是某团队一项小福利，下列选项最能体现该定义的是：","options":{"A":"通过选举，由品德高尚的小李主持分“M”，基本公平公正","B":"拟定一人负责分“M”工作，并成立董事会，及时处理问题","C":"选举产生分“M”委员会和监督委员会，有效落实执行和监督","D":"参与者轮流值日分“M”，但主持分“M”者每次必须最后领取"},"answer":"D","explanation":"第一步：找出定义关键词。\n“只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度”、“这种制度不但要科学，而且其制定一定要有所依据、简单明了，具有针对性、可操作性，便于执行”。\n第二步：逐一分析选项。\nA项：由品德高尚的小李主持分“M”，说明小李有了特权，其他人信任小李，不符合“只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度”，小李凭借高尚品德在主持分配，时间长了也可能导致分配不均，说明这种制度不够科学，也不符合“这种制度不但要科学，而且其制定一定要有所依据、简单明了，具有针对性、可操作性，便于执行”，不符合定义，排除； \nB项：拟定一人负责分“M”工作，说明这个人拥有了分“M”的特权，其他人信任负责分配的人，不符合“只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度”，不符合定义，排除；\nC项：选举产生分“M”委员会和监督委员会，说明委员会和监督委员会有了分“M”的特权，其他人信任委员会和监督委员会，不符合“只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度”，不符合定义，排除；\nD项：参与者轮流值日分“M”，说明每个人都有机会主持分配“M”，这样就不存在特权，主持分“M”者每次必须最后领取，说明作为主持者能把自己利益放到最后，这样的分配才会更合理、更公平，符合“只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度”、“这种制度不但要科学，而且其制定一定要有所依据、简单明了，具有针对性、可操作性，便于执行”，符合定义，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"3522389","cat":"定义判断","stem":"虚假相关指的是两个没有因果关系的事件之间，基于一些其他未见的因素（潜在变量）而推断出因果关系，引致两个事件是“有所联系”的假象，但这种联系并不能通过客观的试验来证实。\n根据上述定义，下列选项不属于虚假相关的是:","options":{"A":"童鞋的大小与孩子的语言能力","B":"冷饮的销量与泳池溺水的人数","C":"惯性的大小与汽车的核载重量","D":"网民的数量与房屋的折旧程度"},"answer":"C","explanation":"第一步：找出定义关键词。\n“两个没有因果关系的事件”、“基于一些其他未见的因素（潜在变量）而推断出因果关系”、“引致两个事件是‘有所联系’的假象，但这种联系并不能通过客观的试验来证实”。\n第二步：逐一分析选项。\nA项：童鞋的大小与孩子的语言能力不存在直接联系，二者没有因果关系，符合关键词“两个没有因果关系的事件”，但二者可能都与“年龄”相关，年龄大可能导致童鞋大，同时导致语言能力较强，基于“年龄”这一潜在变量，二者之间“有所联系”，符合关键词“基于一些其他未见的因素（潜在变量）而推断出因果关系”、“引致两个事件是‘有所联系’的假象，但这种联系并不能通过客观的试验来证实”，符合定义，排除；\nB项：冷饮的销量与泳池溺水的人数不存在直接联系，二者没有因果关系，符合关键词“两个没有因果关系的事件”，但二者可能都是由于“天气炎热”引起的，基于“天气炎热”这一潜在变量，二者之间“有所联系”，符合关键词“基于一些其他未见的因素（潜在变量）而推断出因果关系”、“引致两个事件是‘有所联系’的假象，但这种联系并不能通过客观的试验来证实”，符合定义，排除；\nC项：惯性与物体的质量有关，物体的质量越大则惯性越大，而汽车核载重量与汽车质量成正比，所以惯性的大小与汽车的核载重量存在因果关系，不符合关键词“两个没有因果关系的事件”，且惯性和物体重量之间的关系可通过实验来证实，不符合关键词“引致两个事件是‘有所联系’的假象，但这种联系并不能通过客观的试验来证实”，不符合定义，当选；\nD项：网民的数量与房屋的折旧程度不存在直接联系，二者没有因果关系，符合关键词“两个没有因果关系的事件”，但二者可能都与“时间”相关，随着时间推移，网民数量逐渐增多，同时房屋折旧程度越高，基于“时间”这一潜在变量，二者之间“有所联系”，符合关键词“基于一些其他未见的因素（潜在变量）而推断出因果关系”、“引致两个事件是‘有所联系’的假象，但这种联系并不能通过客观的试验来证实”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":80,"missingImage":false},{"type":"question","qid":"3522394","cat":"定义判断","stem":"迎臂效应也被称为“请到我家后院来”。从表面意思来看，迎臂就是张开双臂欢迎的意思，是指某个地区的居民认为相关机构、设施、景观具有正的外部效应，能给本社区发展带来好处，因此，不排斥甚至欢迎这些项目在本社区落地。\n根据上述定义，下列选项属于迎臂效应的是：","options":{"A":"群众深度参与，点赞街道残障康复中心成立","B":"公司升级业态，积极在社区推广无人零售店","C":"新设备耗电低，企业要求园区加快引进速度","D":"加气站易漏气，附近居民担心火灾要求搬迁"},"answer":"A","explanation":"第一步：找出定义关键词。\n“某个地区的居民”、“认为相关机构、设施、景观具有正的外部效应，能给本社区发展带来好处”、“不排斥甚至欢迎这些项目在本社区落地”。\n第二步：逐一分析选项。\nA项：群众深度参与，符合“某个地区的居民”，点赞街道残障康复中心成立，说明群众认可、十分欢迎，符合“认为相关机构、设施、景观具有正的外部效应，能给本社区发展带来好处”，也符合“不排斥甚至欢迎这些项目在本社区落地”，符合定义，当选；\nB项：公司升级业态，积极在社区推广无人零售店，没有体现出被推广社区居民的态度，是否欢迎，不符合定义，排除；\nC项：新设备耗电低，企业要求园区加快引进速度，园区不是社区，企业也不是社区居民，不符合“某个地区的居民”，不符合定义，排除；\nD项：加气站易漏气，附近居民担心火灾要求搬迁，是居民害怕带来危险，不符合“认为相关机构、设施、景观具有正的外部效应，能给本社区发展带来好处”、“不排斥甚至欢迎这些项目在本社区落地”，不符合定义，排除。\n故正确答案为A。","no":81,"missingImage":false},{"type":"question","qid":"3522381","cat":"定义判断","stem":"单质是由同一种元素组成的纯净物。化合物是由两种或两种以上元素的原子（不同元素的原子）组成的纯净物。混合物是指由两种或两种以上不同的单质或化合物机械混合而成的物质，无固定化学式，混合物的各种成分之间没有发生化学反应，混合物可以用物理的方法将所含的物质分离。\n根据上述定义，下列选项同时具有以上三类物质的是：","options":{"A":"氮气、氧气、二氧化碳、空气","B":"食盐水、盐酸、氨水、蒸馏水","C":"氢气、氖气、水蒸气、汞蒸气","D":"二氧化碳、水蒸气、矿泉水、天然气"},"answer":"A","explanation":"第一步：找出定义关键词。\n单质：“由同一种元素组成的纯净物”；\n化合物：“由两种或两种以上元素的原子（不同元素的原子）组成的纯净物”；\n混合物：“由两种或两种以上不同的单质或化合物机械混合而成”、“无固定化学式”。\n第二步：逐一分析选项。\nA项：氮气是由氮元素组成的纯净物，氧气是由氧元素组成的纯净物，均符合“由同一种元素组成的纯净物”，符合单质的定义；二氧化碳是由碳元素和氧元素组成的纯净物，符合“由两种或两种以上元素的原子（不同元素的原子）组成的纯净物”，符合化合物的定义；空气由氮气、氧气、二氧化碳等物质组成，符合“由两种或两种以上不同的单质或化合物机械混合而成”、“无固定化学式”，符合混合物的定义。选项同时具有三类物质，符合题干要求，当选； \nB项：食盐水是由氯化钠和水等组成的溶液，盐酸是氯化氢和水组成的溶液，氨水是氨和水组成的溶液，均符合“由两种或两种以上不同的单质或化合物机械混合而成”、“无固定化学式”，符合混合物的定义；蒸馏水是由氢元素和氧元素组成的纯净物，符合“由两种或两种以上元素的原子（不同元素的原子）组成的纯净物”，符合化合物的定义。选项缺少单质，不符合题干要求，排除；\nC项：氢气是由氢元素组成的纯净物，氖气是由氖元素组成的纯净物，汞蒸气是汞蒸发而成的纯净物，均符合“由同一种元素组成的纯净物”，符合单质的定义；水蒸气是由氢元素和氧元素组成的纯净物，符合“由两种或两种以上元素的原子（不同元素的原子）组成的纯净物组成的纯净物”，符合化合物的定义。选项缺少混合物，不符合题干要求，排除；\nD项：二氧化碳是由碳元素和氧元素组成的纯净物，水蒸气是由氢元素和氧元素组成的纯净物，均符合“由两种或两种以上元素的原子（不同元素的原子）组成的纯净物”，符合化合物的定义；矿泉水由水、矿物盐、二氧化碳等物质组成，天然气由烃类和非烃类气体混合而成，均符合“由两种或两种以上不同的单质或化合物机械混合而成”、“无固定化学式”，符合混合物的定义。选项缺少单质，不符合题干要求，排除。\n故正确答案为A。","no":82,"missingImage":false},{"type":"question","qid":"3522428","cat":"定义判断","stem":"价值链的数字重生指价值链的某个必要环节以数字化方式呈现，以数据实时在线为基础推动价值链的实现。价值链的数字新生是以新定义的用户价值为中心、数据实时在线为基础，融合新价值链要素，创造全新价值链结构。\n根据上述定义，下列哪项属于价值链的数字重生？","options":{"A":"为给用户带来全新的旅行前、旅行中和旅行后的服务体验，立体化整合旅游目的地的资源要素","B":"依靠在线实时数据，使美食供应商更便利精准地了解用户的美食习惯，开拓新颖的服务渠道","C":"电商平台通过发布商品信息和销售实时动态，使消费者在选购时可以查询货物即时情况","D":"核电设备的数字三维模型可以为设计、制造、运行以及维护等多个环节带来价值增长点"},"answer":"C","explanation":"第一步：找出定义关键词。\n价值链的数字重生：“某个必要环节以数字化方式呈现”、“数据实时在线为基础”、“推动价值链的实现”；\n价值链的数字新生：“用户价值为中心”、“数据实时在线为基础”、“融合新价值链要素”、“创造全新价值链结构”。\n第二步：逐一分析选项。\nA项：整合资源给用户带来全新的旅行前、旅行中和旅行后的服务体验，不符合“某个必要环节以数字化方式呈现”，且没有提到“数据的实时在线”，不符合价值链的数字重生的定义，排除；\nB项：依靠在线实时数据，符合“数据实时在线为基础”，开拓新颖的服务渠道，是对价值链的创新，不符合“推动价值链的实现”，不符合价值链的数字重生的定义，排除；\nC项：电商平台发布商品信息和销售实时动态，符合“数据实时在线为基础”，消费者在选购时可以查询货物即时情况，符合“某个必要环节以数字化方式呈现”，符合价值链的数字重生的定义，当选；\nD项：核电设备的数字三维模型可以为多个环节带来价值增长点，不符合“数据实时在线为基础”，不符合价值链的数字重生的定义，排除。\n故正确答案为C。","no":83,"missingImage":false},{"type":"question","qid":"3522386","cat":"定义判断","stem":"先赋资本是指建立在血缘、遗传等先天条件下，不经过个人努力就可以拥有的资本。自致资本是指通过个人后天努力取得，为个人所支配的资本。\n根据上述定义，下列选项中的内容均属于自致资本的是：","options":{"A":"婚姻、职业、政治面貌","B":"家世、民族、文化程度","C":"国籍、收入、工作单位","D":"种族、户口、父辈职业"},"answer":"A","explanation":"第一步：找出定义关键词。\n先赋资本：“建立在血缘、遗传等先天条件下”、“不经过个人努力就可以拥有”；\n自致资本：“通过个人后天努力取得”、“为个人所支配”。\n第二步：逐一分析选项。\nA项：婚姻、职业、政治面貌都是通过后天努力取得的，均符合自致资本的定义，当选； \nB项：家世、民族是建立在遗传的先天条件下，不经过个人努力就可以拥有的，符合先赋资本的定义；文化程度是通过后天努力取得的，符合自致资本的定义，排除；\nC项：国籍是建立在遗传的先天条件下，不经过个人努力就可以拥有的，符合先赋资本的定义；收入和工作单位是通过后天努力取得的，均符合自致资本的定义，排除；\nD项：种族、户口和父辈职业都是建立在血缘、遗传等先天条件下，不经过个人努力就可以拥有的，均符合先赋资本的定义，排除。\n故正确答案为A。","no":84,"missingImage":false},{"type":"question","qid":"3522398","cat":"定义判断","stem":"音爆是飞行器在突破音障时，由于对空气的压缩无法迅速传播，会逐渐形成激波面，激波面上高度集中的声学能量引起巨大响声，让人耳感受到短暂而极其强烈的爆炸声。音爆只有在突破音速即超音速飞行时才会产生。音爆云则是以飞行器为中心轴、从机翼前段开始向四周均匀扩散的圆锥状云团。其产生主要是由于气流流速突破音速时比空气传导速度更快，无法有效向下拉气流，导致密度减小，气压降低，水气凝结成微小的水珠，肉眼看来就像是云雾般的状态。音爆云在跨音速飞行时常常出现，但不仅在跨音速飞行时才能出现。\n根据上述定义，下列说法正确的是：","options":{"A":"音爆产生时就会出现音爆云","B":"音爆云出现标志着音爆产生","C":"音爆云出现说明突破了音障","D":"音爆产生时是超音速飞行"},"answer":"D","explanation":"第一步：找出定义关键词。\n音爆：“飞行器在突破音障时”、“对空气的压缩无法迅速传播，会逐渐形成激波面”、“激波面上高度集中的声学能量引起巨大响声，让人耳感受到短暂而极其强烈的爆炸声”、“只有在突破音速即超音速飞行时才会产生”；\n音爆云：“以飞行器为中心轴、从机翼前段开始向四周均匀扩散的圆锥状云团”、“产生主要是由于气流流速突破音速时比空气传导速度更快，无法有效向下拉气流，导致密度减小，气压降低，水气凝结成微小的水珠，肉眼看来就像是云雾般的状态”、“在跨音速飞行时常常出现，但不仅在跨音速飞行时才能出现”。\n第二步：逐一分析选项。\nA项：音爆云在跨音速飞行时常常出现，说明在跨音速飞行时也可能不会产生音爆云，而音爆只有在突破音速即超音速飞行时才会产生，说明音爆产生时也有可能不会产生音爆云，因此“音爆产生时就会出现音爆云”的说法不正确，排除；\nB项：音爆云不仅在跨音速飞行时才能出现，意味着音爆云可能在非跨音速飞行时产生，而音爆只有在突破音速即超音速飞行时才会产生，因此可能出现有音爆云但没有音爆的情况，因此“音爆云出现标志着音爆产生”的说法不正确，排除；\nC项：说的是音爆云出现说明突破了音障，音爆是飞行器在突破音障时产生的，而音爆云的出现并不能说明突破了音障，因此“音爆云出现说明突破了音障”的说法不正确，排除；\nD项：说的是音爆产生时是超音速飞行，符合音爆“只有在突破音速即超音速飞行时才会产生”，符合定义，当选。\n故正确答案为D。","no":85,"missingImage":false},{"type":"question","qid":"3522388","cat":"类比推理","stem":"巴蜀：燕赵","options":{"A":"京津：淮海","B":"闽越：荆湘","C":"齐鲁：秦晋","D":"殷商：云贵"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“巴蜀”指的是巴国和蜀国，“燕赵”指的是燕国和赵国，四者都属于中国历史上存在的国家，为并列关系中的反对关系。\n第二步：判断选项词语间逻辑关系。\nA项：“京津”指的是北京和天津，“淮海”指的是以徐州为中心的淮河以北及海州（今连云港市西南）一带的地区，并不是国家，与题干逻辑关系不一致，排除；\nB项：“闽越”指的是闽越国，“荆湘”指的是长江中游地区的江汉—洞庭湖平原，并不全是国家，与题干逻辑关系不一致，排除；\nC项：“齐鲁”指的是齐国和鲁国，“秦晋”指的是秦国和晋国，四者都属于中国历史上存在的国家，为并列关系中的反对关系，与题干逻辑关系一致，当选；\nD项：“殷商”指的商朝，“云贵”指的是云南和贵州地区，并不是国家，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":86,"missingImage":false},{"type":"question","qid":"3522379","cat":"类比推理","stem":"优雅：天鹅","options":{"A":"风沙：塞外","B":"高洁：梅花","C":"友好：同窗","D":"幽默：笑话"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n天鹅象征着优雅，二者为比喻象征关系。\n第二步：判断选项词语间逻辑关系。\nA项：塞外有风沙，二者为地点对应关系，与题干逻辑关系不一致，排除；\nB项：梅花象征着高洁的品质，二者为比喻象征关系，与题干逻辑关系一致，当选；\nC项：同窗是指同在一个学校学习的人，同窗之间的关系可以是友好的，二者为对应关系，与题干逻辑关系不一致，排除；\nD项：“笑话”是“幽默”的一种表现形式，二者为属性对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":87,"missingImage":false},{"type":"question","qid":"3522390","cat":"类比推理","stem":"顿悟：醍醐灌顶","options":{"A":"渴望：望梅止渴","B":"移交：完璧归赵","C":"消费：坐吃山空","D":"孝顺：彩衣娱亲"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n醍醐灌顶意思是将牛奶中精炼出来的乳酪浇到头上，比喻灌输智慧，使人得到启发，彻底醒悟，与顿悟是近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：望梅止渴意思是梅子酸，人想吃梅子就会流涎，因而止渴，比喻愿望无法实现，用空想安慰自己。与渴望不是近义关系，与题干逻辑关系不一致，排除；\nB项：完璧归赵意思是蔺相如将完美无瑕的和氏璧，完好地从秦国带回赵国，后比喻把物品完好地归还给物品的主人。与移交不是近义关系，与题干逻辑关系不一致，排除；\nC项：坐吃山空意思是只坐着吃，山也要空，指光是消费而不从事生产，即使有堆积如山的财富，也要耗尽。与消费不是近义关系，与题干逻辑关系不一致，排除；\nD项：彩衣娱亲意思是传说春秋时有个老莱子，很孝顺，七十岁了还穿着彩色衣服扮成幼儿，引父母发笑，后作为孝顺父母的典故。与孝顺是近义关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":88,"missingImage":false},{"type":"question","qid":"3522378","cat":"类比推理","stem":"戊：己：庚","options":{"A":"钠：镁：铝","B":"寅：卯：巳","C":"牛：虎：龙","D":"秦：汉：隋"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n天干是中国古代的一种文字计序符号，其包括：甲、乙、丙、丁、戊、己、庚、辛、壬、癸，被称为“十天干”。戊、己、庚是“十天干”中的三个，三者是并列关系，且三者在天干中排列紧密连续。\n第二步：判断选项词语间逻辑关系。\nA项：钠、镁、铝是元素周期表中的三个元素，三者是并列关系，且三者在元素周期表中排列紧密连续，与题干逻辑关系一致，当选；\nB项：寅、卯、巳是古代十二地支中的三个地支，三者是并列关系，但三者在十二地支中的排列并不是紧密连续的，与题干逻辑关系不一致，排除；\nC项：牛、虎、龙是十二生肖中的三个生肖，三者是并列关系，但三者在十二生肖中的排列并不是紧密连续的，与题干逻辑关系不一致，排除；\nD项：秦、汉、隋是我国古代的三个朝代，三者是并列关系，但三者在古代朝代中的排列并不是紧密连续的，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":89,"missingImage":false},{"type":"question","qid":"3522387","cat":"类比推理","stem":"超声波：次声波：军事","options":{"A":"处女作：代表作：文学","B":"路由器：隔离卡：网络","C":"潜水艇：核潜艇：科技","D":"北极星：北斗星：星辰"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n超声波是指频率高于20000赫兹的声波，次声波是指频率小于20赫兹的声波，二者为并列关系；且超声波和次声波都可以运用在军事上，为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：有的处女作是代表作，有的处女作不是代表作，有的代表作是处女作，有的代表作不是处女作，二者为交叉关系，与题干逻辑关系不一致，排除；\nB项：路由器是连接两个或多个网络的硬件设备，在网络间起网关的作用；隔离卡是一种应用在计算机上的硬件，使得计算机在完全安全状态下联结内网和外网，二者均为电脑硬件设备，为并列关系。且路由器和隔离卡都可以运用在网络连接上，为对应关系，与题干逻辑关系一致，当选；\nC项：核潜艇是潜水艇的一种，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：北极星又称北辰、紫微星，指的是最靠近北天极的一颗恒星；北斗星又称北斗七星，是大熊座的组成部分，属于紫微垣的一个星官。二者不是并列关系，但二者都是星辰，前两词分别与第三词构成种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":90,"missingImage":false},{"type":"question","qid":"3523355","cat":"类比推理","stem":"防爆膜：防刮花：抗撞击","options":{"A":"驱蛇粉：驱动器：驱逐舰","B":"萤火虫：荧光棒：荧惑星","C":"防晒伞：超轻便：抗强风","D":"净水器：除杂质：去异味"},"answer":"D","explanation":"第一步，判断题干词语间逻辑关系。\n防爆膜的功能是防刮花和抗撞击，后两词分别与第一词构成功能的对应关系。\n第二步，判断选项词语间逻辑关系。\nA项：驱动器和驱逐舰均不是驱蛇粉的功能，三词间无明显的逻辑关系，与题干逻辑关系不一致，排除；\nB项：荧光棒和荧惑星均不是萤火虫的功能，荧惑星是指火星，与前两词无明显逻辑关系。与题干逻辑关系不一致，排除；\nC项：超轻便是防晒伞的属性，第一词与第二词为属性对应关系，与题干逻辑关系不一致，排除；\nD项：净水器的功能是除杂质和去异味，后两词分别与第一词构成功能的对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":91,"missingImage":false},{"type":"question","qid":"3522391","cat":"类比推理","stem":"握瑜：怀瑾：美玉","options":{"A":"南辕：北辙：马车","B":"金戈：铁马：战争","C":"敲金：击石：乐器","D":"锦衣：玉食：珍馐"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“瑜”和“瑾”指美玉，且握瑜和怀瑾都是动宾结构。\n第二步：判断选项词语间逻辑关系。\nA项：“辕”指车前驾牲畜的两根直木，“辙”指车轮压的痕迹，二者均不能用来指马车，且南辕和北辙都不是动宾结构，与题干逻辑关系不一致，排除；\nB项：“戈”指古代的一种兵器，“马”指马匹，二者均不能直接指战争，且金戈和铁马都不是动宾结构，与题干逻辑关系不一致，排除；\nC项：“金”和“石”指钟磬一类的乐器，且敲金和击石均为动宾结构，与题干逻辑关系一致，当选；\nD项：“衣”指衣服，“食”指食物，二者均不能用来指珍馐，且锦衣和玉食都不是动宾结构，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":92,"missingImage":false},{"type":"question","qid":"3522400","cat":"类比推理","stem":"高屋建瓴 对于 （    ） 相当于 （    ） 对于 技艺","options":{"A":"格局 左支右绌","B":"形势 目无全牛","C":"气势 天造地设","D":"地势 逆水行舟"},"answer":"B","explanation":"逐一代入选项。\nA项：高屋建瓴意思是把瓶子里的水从高层顶上倾倒，形容居高临下的形势，与格局无必然联系；左支右绌意思是力量不足，应付了这一方面，那一方面又有了问题，与技艺无必然联系，前后逻辑关系不一致，排除；\nB项：高屋建瓴意思是把瓶子里的水从高层顶上倾倒，形容居高临下的形势，高屋建瓴形容形势；目无全牛意思是眼中没有完整的牛，只有牛的筋骨结构，形容人的技艺高超，得心应手，已经到达非常纯熟的地步，目无全牛形容技艺，前后逻辑关系一致，当选；\nC项：高屋建瓴意思是把瓶子里的水从高层顶上倾倒，形容居高临下的形势，与气势无必然联系；天造地设意思是自然形成而合乎理想，不必再加工，与技艺无必然联系，前后逻辑关系不一致，排除；\nD项：高屋建瓴意思是把瓶子里的水从高层顶上倾倒，形容居高临下的形势，与地势无必然联系；逆水行舟意思是比喻学习或做事就好像逆水行船，不努力就要退步，与技艺无必然联系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":93,"missingImage":false},{"type":"question","qid":"3522395","cat":"类比推理","stem":"火箭筒 对于 （    ） 相当于 （    ） 对于 三节棍","options":{"A":"发射  狼牙棒","B":"手榴弹 方天戟","C":"爆炸  软器械","D":"热动力 锻造术"},"answer":"B","explanation":"逐一代入选项。\nA项：“火箭筒”具有“发射”火箭弹的功能，二者属于功能对应关系，狼牙棒和三节棍都是用于攻击的工具，二者为并列关系，前后逻辑关系不一致，排除；\nB项：火箭筒和手榴弹都是武器，二者为并列关系，方天戟和三节棍都是兵器，二者为并列关系，前后逻辑关系一致，当选；\nC项：火箭筒发射的火箭弹能够爆炸，二者为对应关系，三节棍是软器械的一种，二者为种属关系，前后逻辑关系不一致，排除；\nD项：火箭筒的工作原理是利用了热动力，二者为原理对应关系，三节棍经过锻造术锻造而成，二者为工艺对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":94,"missingImage":false},{"type":"question","qid":"3522404","cat":"类比推理","stem":"晕轮效应 对于 （    ） 相当于 （    ） 对于 变本加厉","options":{"A":"扬长避短 墨菲定理","B":"以偏概全 破窗效应","C":"欲扬先抑 增减效应","D":"举一反三 蝴蝶效应"},"answer":"B","explanation":"逐一代入选项。\nA项：“晕轮效应”是指在人际知觉中所形成的以点概面或以偏概全的主观印象，其本质是一种用片面的观点看待整体问题的认知偏误；“扬长避短”是指发扬优点、回避缺点，二者没有明显逻辑关系。“墨菲定理”的根本内容是：如果事情有变坏的可能，不管这种可能性有多小，它总会发生；“变本加厉”指情况变得比本来更加严重，二者没有明显逻辑关系。前后逻辑关系不一致，排除；\nB项：“以偏概全”是指片面地根据局部现象来推论整体，得出错误的结论，是“晕轮效应”的本质；“破窗效应”是指环境中的不良现象如果被放任存在，会诱使人们仿效，甚至变本加厉，“变本加厉”是其本质，前后逻辑关系一致，当选；\nC项：“欲扬先抑”是指要发扬、放开，就要先控制、压抑，与“晕轮效应”之间没有明显逻辑关系；“增减效应”是指人们最喜欢那些对自己的喜欢显得不断增加的人，最不喜欢那些对自己的喜欢显得不断减少的人，与“变本加厉”之间没有明显逻辑关系，前后逻辑关系不一致，排除；\nD项：“举一反三”是指从懂得的一点，类推而知道其他，与“晕轮效应”之间没有明显逻辑关系；“蝴蝶效应”是指初始条件下微小的变化能带动整个系统的长期的巨大的连锁反应，与“变本加厉”之间没有明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":95,"missingImage":false},{"type":"question","qid":"3522402","cat":"逻辑判断","stem":"最近有研究团队以问卷调查的方式，调查了519名从未吸过传统香烟，年龄在18岁至25岁间的年轻人，调查内容包括这些年轻人吸电子烟的情况和吸传统香烟的意向等，研究报告称，在从未吸过传统香烟的年轻人中，那些正在吸电子烟的人更可能尝试传统香烟，有关电子烟的监管政策要注意保护年轻人。\n以下各项如果为真，最能支持上述结论的是：","options":{"A":"受访者中有20%的人尝试过电子烟或未来很可能会尝试电子烟","B":"即使只尝了两三口电子烟，也有可能提高吸传统香烟的可能性","C":"受访者中正在吸电子烟的有60%表示未来一定会尝试传统香烟","D":"电子烟对健康的危害比传统香烟小，但仍然含有很多有害物质"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：在从未吸过传统香烟的年轻人中，那些正在吸电子烟的人更可能尝试传统香烟，有关电子烟的监管政策要注意保护年轻人。\n论据：无。\n本题只有论点，没有论据，优先考虑补充论据加强，即解释或举例证明“正在吸电子烟的年轻人更可能尝试传统香烟”。\n第二步：逐一分析选项。\nA项：论点说的是更可能尝试传统香烟，该项说的是有多少人尝试过电子烟，以及未来可能会尝试，话题不一致，无法加强，排除；\nB项：选项表明吸电子烟的人相比于不吸电子烟的人而言，更可能吸传统香烟，该项是针对论点的可能性加强，属于补充论据，保留；\nC项：该项表明受访者中正在吸电子烟的有60%表示未来一定会尝试传统香烟，该项比B项加强力度更大，原因有二：\n一是题干论点强调保护年轻人，而C项的受试者正是年轻人，表明的是吸电子烟的年轻人的意愿，B项没分，年纪大小都可以，那为什么不保护年纪大的，而要特别保护年轻人呢？\n二是如下图原文所示，C项把原文中的“可能或肯定”，改为“一定”，应该是为了区分B的可能，综上C项更有可能是出题人想设置的正确答案；\n\u003cimg data-k=\"03b2d40a5263\" style=\"max-width:700px\">\nD项：论点说的是正在吸电子烟的年轻人更可能尝试传统香烟，该项说的是电子烟的危害，话题不一致，无法加强，排除。\n故正确答案为C。","no":96,"missingImage":false},{"type":"question","qid":"3522385","cat":"逻辑判断","stem":"某科学家在一个宇宙科学网站上刊载了一项成果，该成果宣称找到了地球生命来自彗星的“证据”，引发了广泛关注。他声称在一块坠落到斯里兰卡的陨石里找到了微观硅藻化石，该石头有着疏松多孔的结构，密度比在地球上找到的所有东西都低。他推断这是一颗彗星的一部分，并指出样本中找到的微观硅藻化石与恐龙时代留存下来的化石中的微观有机体类似，从而为彗星胚种论提供了强有力的证据。\n以下哪项如果为真，最能反驳该科学家的观点？","options":{"A":"发表该成果的网站缺乏可信性，所载论文良莠不齐，有些曾沦为笑柄","B":"该科学家是彗星胚种论的狂热支持者，曾宣称SARS和流感来自彗星","C":"该成果配图中被标示成“丝状硅藻”的东西实际上只是硅藻细胞断片","D":"该成果根本无法证明该石头是碳质球粒陨石，甚至难以确定其是陨石"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：地球生命来自彗星。\n论据：一块坠落到斯里兰卡的陨石里找到了微观硅藻化石，该石头有着疏松多孔的结构，密度比在地球上找到的所有东西都低。他推断这是一颗彗星的一部分，并指出样本中找到的微观硅藻化石与恐龙时代留存下来的化石中的微观有机体类似，从而为彗星胚种论提供了强有力的证据。\n本题的论据说的是陨石找到的微观硅藻化石与恐龙时代留存下来的化石中的微观有机体类似，同时该研究还推断该陨石是一颗彗星的一部分，即说明该陨石（彗星的一部分）与生命有关系，而论点说的是地球生命来自彗星，所以，二者讨论话题一致，削弱可以考虑削弱论点，也可以考虑削弱论据。\n第二步：逐一分析选项。\nA项：该成果的网站缺乏可信性，所载论文良莠不齐，代表不了这次实验成果的可靠性，属于无关项，排除；\nB项：只是说该科学家是彗星胚种论的狂热支持者，支持者说的话无法辨别真假，同时即便SARS和流感来自彗星，也无法判断生命是否来源于彗星，不明确选项，排除；\nC项：选项是说配图中的东西本质是硅藻细胞断片，一定程度上质疑了题干研究成果的可信性，可能削弱论据，保留；\nD项：该成果根本无法证明该石头是陨石，直接质疑了论据的研究成果，直接削弱论据，保留。\n对比C、D两项：C项为可能削弱论据，D项为直接削弱论据，D项当选。\n故正确答案为D。","no":97,"missingImage":false},{"type":"question","qid":"3522380","cat":"逻辑判断","stem":"如果一片森林的树木物种多样性非常丰富，那么这时缺失一个物种对于整个森林的生产力来讲，影响还并不是太大；但在物种多样性越稀缺的时候，树的种类继续变少，对整个森林生产力产生的打击就会越来越大。\n由此可以推出：","options":{"A":"除非树木物种多样性锐减，整个森林的生产力不会受到影响","B":"只要森林的树木物种减少，整个森林的生产力就会受到影响","C":"如果森林的生产力下降，那么森林的树木物种多样性就已经受损","D":"要么森林的树木物种多样性非常丰富，要么森林的生产力非常可观"},"answer":"C","explanation":"第一步：翻译题干。\n①物种多样性丰富\u003cimg data-k=\"2dfb7d1f72f3\">对森林生产力影响不大\n注：题干第一句话可以理解为“如果一片森林的树木物种多样性非常丰富，（即使缺失一个物种），对于整个森林的生产力影响还并不是太大”\n如果A，即使B，那么C。此处的“即使B”不是充要条件，可以忽略，最后翻译为A\u003cimg data-k=\"a37757d411ef\">C即可。例.如果你不好好学习，即使你再聪明，也不能圆梦，翻译为\u003cimg data-k=\"0be436194951\">好好学习\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">圆梦。\n第二步：逐一分析选项。\n\nA项：翻译为森林生产力受影响\u003cimg data-k=\"2dfb7d1f72f3\">物种多样性锐减（即“\u003cimg data-k=\"e752a8ae1a16\">物种多样性丰富”），仅根据“森林生产力受影响”无法判断影响的大小，无法推出，排除；\nB项：翻译为树木物种减少\u003cimg data-k=\"2dfb7d1f72f3\">森林生产力受影响，仅根据“树木物种减少”无法判断是减少一种还是多种，是否影响树木物种丰富性，无法推出，排除；\nC项：翻译为森林的生产力下降（即“对森林生产力影响大”）\u003cimg data-k=\"2dfb7d1f72f3\">树木物种多样性受损（即“树木物种多样性不丰富”），是对题干①的否后推否前，可以推出，当选；\nD项：“要么···要么···”表示两者之间只能成立一个且必须成立一个，题干重点论述的是“树木物种多样性”对“森林的生产力”的影响，而不是二者只能有一种情况发生，无法推出，排除。\n故正确答案为C。","no":98,"missingImage":false},{"type":"question","qid":"3522405","cat":"逻辑判断","stem":"吴老师、张老师、孙老师、苏老师都是某校教师，分别教授语文、生物、物理、化学四门课程。\n已知：\n①如果吴老师教语文，那么张老师不教生物\n②或者孙老师教语文，或者吴老师教语文\n③如果张老师不教生物，那么苏老师不教物理\n④或者吴老师不教化学，或者苏老师教物理\n以下哪项如果为真，可以推出孙老师教语文：","options":{"A":"吴老师教语文","B":"张老师不教生物","C":"吴老师教化学","D":"苏老师不教物理"},"answer":"C","explanation":"第一步：翻译题干。\n①吴老师教语文\u003cimg data-k=\"1ea22d0695fd\">张老师教生物；\n②孙老师教语文或者吴老师教语文；\n③\u003cimg data-k=\"e752a8ae1a16\">张老师教生物\u003cimg data-k=\"1ea22d0695fd\">苏老师教物理；\n④\u003cimg data-k=\"e752a8ae1a16\">吴老师教化学或者苏老师教物理。\n第二步：逐一分析选项。\n提问为“推出孙老师教语文”，本题是给出了结论，需要从结论出发倒推条件。\n根据条件②可知：想要推出“孙老师教语文”，需要吴老师不教语文；\n根据条件①可知：想要得到“吴老师不教语文”，需要张老师教生物；\n根据条件③可知：想要得到“张老师教生物”，需要苏老师教物理；\n根据条件④可知：想要得到“苏老师教物理”，需要吴老师教化学。\n即：想要推出“孙老师教语文”，需要吴老师教化学。\n故正确答案为C。","no":99,"missingImage":false},{"type":"question","qid":"3523354","cat":"逻辑判断","stem":"不粘锅常见的不粘涂层为特氟龙涂层。全氟辛酸铵是特氟龙生产过程中使用的含量极微的一种加工助剂。数据表明，高剂量的全氟辛酸铵有可能导致胆固醇水平升高、甲状腺疾病及不育。特氟龙在常温及常态下具有非常稳定的理化性质，使用特氟龙不粘涂层的炊具在常温至\u003cimg data-k=\"1eab253ea834\">的温度范围内都不会发生任何变化，但是当温度超过\u003cimg data-k=\"1eab253ea834\">时，涂层逐渐向不稳定状态转变，当温度超过\u003cimg data-k=\"5b75dc9fdda1\">时会发生分解。正常烹调时，水的沸点是\u003cimg data-k=\"92a92f9896db\">，温度较高的爆炒通常也只是\u003cimg data-k=\"1392500f686a\">左右，即使采用油炸的方式，油温也不会超过\u003cimg data-k=\"ee811da577b4\">。然而，如果在炒菜时喜欢把锅烧干、烧红后再加油，锅内温度就容易超过\u003cimg data-k=\"1eab253ea834\">。\n由此无法推出的是：","options":{"A":"日常生活中，可以用不粘锅来烧开水和煮粥","B":"烹饪时不粘涂层分解会导致胆固醇水平升高","C":"炒菜时应避免把不粘锅烧干、烧红后再加油","D":"正常烹调通常无需担心不粘锅释放有害物质"},"answer":"B","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干“正常烹调时，水的沸点是\u003cimg data-k=\"92a92f9896db\">，温度较高的爆炒通常也只是\u003cimg data-k=\"1392500f686a\">左右，即使采用油炸的方式，油温也不会超过\u003cimg data-k=\"ee811da577b4\">”，可知烧水等正常烹调不会超过\u003cimg data-k=\"1eab253ea834\">，说明特氟龙不粘涂层不会发生分解，可以推出可以用不粘锅来烧开水和煮粥，排除；\nB项：题干中指出高剂量的全氟辛酸铵有可能导致胆固醇水平升高、甲状腺疾病及不育，但是题干中也指出“全氟辛酸铵是特氟龙生产过程中使用的含量极微的一种加工助剂”，因此涂层中的全氟辛酸铵剂量是否达到了能够导致胆固醇水平升高的剂量不明确，同时“高剂量的全氟辛酸铵有可能导致胆固醇水平升高”，也不是一定会导致胆固醇水平升高，无法推出，当选；\nC项：根据题干“如果在炒菜时喜欢把锅烧干、烧红后再加油，锅内温度就容易超过\u003cimg data-k=\"1eab253ea834\">”，可知炒菜时把不粘锅烧干、烧红后再加油会导致锅内温度超过\u003cimg data-k=\"1eab253ea834\">，此时特氟龙不粘涂层会向不稳定状态转变，因此应避免此做法，可以推出炒菜时应避免把不粘锅烧干、烧红后再加油，排除；\nD项：根据题干“正常烹调时，水的沸点是\u003cimg data-k=\"92a92f9896db\">，温度较高的爆炒通常也只是\u003cimg data-k=\"1392500f686a\">左右，即使采用油炸的方式，油温也不会超过\u003cimg data-k=\"ee811da577b4\">”，可知正常烹调不会超过\u003cimg data-k=\"1eab253ea834\">，说明特氟龙不粘涂层不会发生分解，可以推出正常烹调通常无需担心不粘锅释放有害物质，排除。\n本题为选非题，故正确答案为B。","no":100,"missingImage":false},{"type":"question","qid":"3522461","cat":"逻辑判断","stem":"近几年，一些大城市的社区银行频频出现关门潮。与此同时，无人银行、5G银行、智能银行等一系列新概念银行不断出现，银行网点正在告别冷冰冰的玻璃柜台和金属板凳，传统网点交易处理的功能变弱了，定制服务、产品体验、社交互动等功能越来越突出。因此，有专家预测：二十年内，传统银行网点会消失。\n以下各项如果为真，最能支持上述专家观点的是：","options":{"A":"客户需进门取号、等待叫号，办理一项简单的业务耗费较长时间","B":"人工智能等科技手段的引进，改变了人们对银行网点的固有印象","C":"复杂业务必须到银行网点面签办理，如开户、销户等需本人办理且务必人工审核","D":"网上银行、手机银行等接连涌现，银行网点作为服务主渠道的地位正在不断弱化"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：二十年内，传统银行网点会消失。\n论据：近几年，一些大城市的社区银行频频出现关门潮。与此同时，无人银行、5G银行、智能银行等一系列新概念银行不断出现，银行网点正在告别冷冰冰的玻璃柜台和金属板凳，传统网点交易处理的功能变弱了，定制服务、产品体验、社交互动等功能越来越突出。\n本题论点讨论的是传统银行网点会消失，论据陈述了传统银行的一些现状，论点和论据讨论的话题一致，加强可以考虑补充论据。\n第二步：逐一分析选项。\nA项：办理一项简单的业务耗费较长时间，讨论的是办理业务时间长短的问题，不能得出传统银行网点会消失的结论，无法加强，排除；\nB项：人工智能等科技手段改变了人们对银行网点的固有印象，和论点讨论的传统银行网点是否会消失无关，无法加强，排除；\nC项：复杂业务必须到银行网点面签办理，说明传统银行网点很重要，不会消失，削弱论点，无法加强，排除；\nD项：银行网点地位弱化，补充论据解释了传统银行网点会消失的原因，可以加强，当选。\n故正确答案为D。","no":101,"missingImage":false},{"type":"question","qid":"3522407","cat":"逻辑判断","stem":"慢性疲劳综合征危害极大，它使人在正常的工作后感到极度疲劳，怎么休息也无济于事。这种疾病过去不能通过验血或其他检查得出明确的生物指标，因此其病因历来被归为心理因素。最近，研究人员对诊断为慢性疲劳综合征的48名患者和39名健康志愿者的大便和血液样本进行研究后得出结论：肠道细菌和血液中的致炎因子可能与该疾病有关。\n以下哪项如果为真，最不能支持上述结论？","options":{"A":"该疾病患者的大便样本中肠道细菌的多样性较低且抗炎细菌较少","B":"该疾病患者的血液样本中被检测出致炎因子，而健康志愿者没有","C":"目前不确定肠道细菌是导致该疾病的原因还是该疾病导致的结果","D":"最新研究表明饮食治疗和益生菌等无助于为该疾病患者缓解疲劳"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：肠道细菌和血液中的致炎因子可能与慢性疲劳综合征有关。\n论据：无。\n首先注意本题问的是“······最不能支持上述结论？”，我们的做题思路是找出哪些是能支持的排除，如果不能支持的选项中出现无关选项，不明确选项和削弱选项，首选削弱项。\n第二步：逐一分析选项。\nA项：患者的肠道细菌多样性低且抗炎细菌较少，说明了肠道细菌可能与该疾病有关，为题干中论点补充了论据，属于加强选项。题干问的是最不能支持的，排除；\nB项：患者的血液样本中有致炎因子，而健康志愿者没有，说明了血液中的致炎因子可能与该疾病有关，补充论据，属于加强选项。题干问的是最不能支持的，排除；\nC项：不确定肠道细菌是病因还是该疾病导致的结果，但无论是原因还是结果，都能证明肠道细菌与该疾病确实有关，属于加强选项，题干问的是最不能支持的，排除；\nD项：饮食治疗和益生菌对缓解患者疲劳无用，与题干论点无关，不能加强，当选。 \n本题为选非题，故正确答案为D。","no":102,"missingImage":false},{"type":"question","qid":"3523364","cat":"逻辑判断","stem":"普通消费者囿于专业弱势群体的地位无从对错误或失真的负面信息进行有效甄别，即便企业努力澄清，但在当前“好事不出门，坏事传千里”的舆论传播环境下，强烈的记忆效应将使得追求风险规避的人们很难改变原有的错误认知，他们仍然会将之作为未来相当长一段时间内的消费决策指南，致使某些守法企业的“不白之冤”难以澄清，也给企业带来了严重损失。\n以下哪项如果为真，最能削弱上述观点？","options":{"A":"传媒利用其便利且易与大众认知结构相契合的特点向社会普及专业知识","B":"监管部门为企业建立信用档案，为消费者提供企业情况的动态信息全景","C":"那些有过“前科”但力图“改过自新”的企业很难回归正常的交易轨道","D":"不良声誉一旦成为社会的集体记忆，在公众的认知中就会有很强的粘性"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：某些守法企业的“不白之冤”难以澄清，给企业带来了严重损失。\n论据：普通消费者囿于专业弱势群体的地位无从对错误或失真的负面信息进行有效甄别······强烈的记忆效应将使得追求风险规避的人们很难改变原有的错误认知，他们仍然会将之作为未来相当长一段时间内的消费决策指南。\n本题论点论据话题一致，讨论的都是普通消费者无法对错误或失真的负面信息不能有效甄别，最终会导致企业的“不白之冤”难以澄清，给企业带来损失。削弱优先考虑削弱论点，即守法企业的“不白之冤”可以澄清，不会给企业带来严重损失。\n第二步：逐一分析选项。\nA项：指出传媒向社会普及专业知识，但无法判断专业知识的具体内容是什么，也无法判断专业知识是否可以改变原有的错误认知，属于不明确项，无法削弱，排除；\nB项：指出监管部门为企业建立信用档案和为消费者提供企业情况的动态信息全景，说明普通消费者可以通过该档案了解真实情况，企业的“不白之冤”可以澄清，削弱论点，当选；\nC项：题干论点讨论的是某些“守法企业”的不白之冤难以澄清，而C项的主体是有过“前科”的企业，讨论主体不一致，排除；\nD项：指出不良声誉一旦成为社会的集体记忆，在公众的认知中就会有很强的粘性，说明强烈的记忆效应将使得人们很难改变原有的错误认知，企业的“不白之冤”难以澄清，具有加强作用，无法削弱，排除。\n故正确答案为B。","no":103,"missingImage":false},{"type":"question","qid":"3522465","cat":"定义判断","stem":"气象研究团队开发出一种基于人工智能的计算模型，用以检测云的旋转运动。研究人员鉴定并标记了逗点状云系的形态和运动，并利用计算机视觉和机器学习技术，“教会”计算机自动识别和检测卫星图像中的逗点状云系，以帮助人们更高效地在海量天气数据中及时发现恶劣天气的“端倪”。该计算模型有助于更快、更准确地预测恶劣天气。\n以下各项如果为真，不属于上述结论必要前提的是：","options":{"A":"该计算模型能检测出逗点状云系，准确率达\u003cimg data-k=\"91300a009a9b\">，甚至在其完全形成前就能检测到","B":"从卫星图像中看，逗点状云系因其外形类似于逗号而得名，与气旋的形成密切相关","C":"该计算模型如与其他天气预报模型相结合，将能有效地预测出\u003cimg data-k=\"e53611d2e102\">的恶劣天气事件","D":"气象学认为气旋的形成可导致冰雹雷暴、大风和暴风雨等各种恶劣天气事件发生"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：基于人工智能的计算模型有助于更快、更准确地预测恶劣天气。\n论据：研究人员鉴定并标记了逗点状云系的形态和运动，并利用计算机视觉和机器学习技术，“教会”计算机自动识别和检测卫星图像中的逗点状云系，以帮助人们更高效地在海量天气数据中及时发现恶劣天气的“端倪”。\n本题论点和论据都在讨论该计算模型有助于发现、预测恶劣天气，二者话题一致，必要前提优先考虑必要条件。本题为选非题，找出结论成立的必要条件排除即可。\n第二步：逐一分析选项。\nA项：选项说明该计算模型准确率达\u003cimg data-k=\"91300a009a9b\">，甚至在其完全形成前就能检测到，若该计算模型准确率低或者不能检测出逗点状云系，则该计算模型就无法预测恶劣天气，是上述结论的必要前提，排除；\nB项：选项说明逗点状云系与气旋形成密切相关，若逗点状云系与气旋形成无关，则不能根据逗点状云系预测恶劣天气，是上述结论的必要前提，排除；\nC项：选项说明该计算模型如果与其他天气预报模型结合，能有效预测出\u003cimg data-k=\"e53611d2e102\">的恶劣天气事件，但是有效地预测情况是否为该计算模型的作用，不能确定，不是上述结论的必要前提，当选；\nD项：论点是通过检测气旋的形成来预测恶劣天气的，选项说气旋的形成可导致恶劣天气，是上述结论的必要前提，排除。\n本题为选非题，故正确答案为C。","no":104,"missingImage":false},{"type":"question","qid":"3522463","cat":"逻辑判断","stem":"长期生活不规律会导致免疫细胞和胆固醇积聚在血管壁上，变成粥样斑块。这些斑块破碎时会形成血栓，血栓有可能脱落，沿血管流动。由于牙周病菌是一种厌氧菌，而血管中有大量氧气，因此牙周病菌单独进入血管并不能存活。但是，因为免疫细胞能够有效隔绝血管中的氧气，所以人们认为牙周病菌能把免疫细胞当作交通工具，借此移动至身体各处。\n以下哪项如果为真，最能加强上述论证？","options":{"A":"生活不规律会使体内产生大量胆固醇和厌氧菌","B":"血栓脱落会导致血管不通顺阻碍牙周病菌移动","C":"免疫细胞的整体内环境不会造成牙周病菌失活","D":"牙周病菌对身体血管健康的影响是公认的"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：牙周病菌能把免疫细胞当作交通工具，借此移动至身体各处。\n论据：牙周病菌是一种厌氧菌，而血管中有大量氧气，免疫细胞能够有效隔绝血管中的氧气。\n本题论点讨论的是免疫细胞帮助牙周病菌移动至身体各处，论据讨论的是免疫细胞帮助牙周病菌隔绝血管中的氧气，都在讨论免疫细胞帮助牙周病菌移动，话题一致，且问法为“加强论证”，加强优先考虑必要条件。\n第二步：逐一分析选项。\nA项：论点说的是免疫细胞帮助牙周病菌移动至身体各处，该项说的是生活不规律的危害，话题不一致，无法加强，排除；\nB项：血栓脱落会导致血管不通顺阻碍牙周病菌移动，血栓阻碍了流通，那牙周病菌也无法移动，免疫细胞就无法帮助牙周病菌移动至身体各处，削弱项，无法加强，排除；\nC项：免疫细胞的整体内环境不会造成牙周病菌失活，如果免疫细胞的整体内环境会造成牙周病菌失活，那免疫细胞就无法帮助牙周病菌移动至身体各处，因此该项是题干结论能够成立的必要条件，可以加强，当选；\nD项：论点说的是免疫细胞帮助牙周病菌移动至身体各处，该项说的是牙周病菌对身体血管健康的影响，话题不一致，无法加强，排除。\n故正确答案为C。","no":105,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        截至2019年12月31日，中国共产党党员总数为9191.6万名，同比增长\u003cimg data-k=\"3f7a4de9e34c\">。在党员的性别、民族和学历上，女党员2559.9万名，少数民族党员680.3万名，大专及以上学历党员4661.5万名。在党员的入党时间上，新中国成立前入党的17.4万名，新中国成立后至党的十一届三中全会前入党的1550.9万名，党的十一届三中全会后至党的十八大前入党的6127.7万名，党的十八大以来入党的1495.6万名。在党员的职业上，工人（含工勤技能人员）644.5万名，农牧渔民2556.1万名，企事业单位、社会组织专业技术人员1440.3万名，企事业单位、社会组织管理人员1010.4万名，党政机关工作人员767.8万名，学生196.0万名，其他职业人员710.4万名，离退休人员1866.1万名。\u003c/p>\u003cp>        2019年共发展党员234.4万名，比上年增长\u003cimg data-k=\"3a49852e2145\">。其中，发展女党员99.4万名，占\u003cimg data-k=\"d0c4be775571\">；发展少数民族党员23.6万名，占\u003cimg data-k=\"336930eb1554\">；发展35岁及以下党员188.3万名，占\u003cimg data-k=\"034dca6d51e9\">；发展具有大专及以上学历的党员106.8万名，占\u003cimg data-k=\"d8ea721f57d1\">。发展党员的职业上，工人（含工勤技能人员）14.3万名，企事业单位、社会组织专业技术人员31.6万名，企事业单位、社会组织管理人员25.3万名，农牧渔民42.4万名，党政机关工作人员13.4万名，学生84.4万名，其他职业人员22.9万名。\u003c/p>\u003cp>\u003cimg data-k=\"cf9e72d4a15d\" style=\"max-width:565px\">\u003c/p>","questions":[{"qid":"3522352","cat":"比重","stem":"若阴影部分代表大专及以上学历党员人数，那么下列哪幅图最能反映截至2019年12月31日大专及以上学历党员占党员总数的比例？\n\u003cimg data-k=\"9635c12dcb81\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"根据题干“······2019年12月31日······占······的比例”，结合材料时间为2019年12月31日，可判定本题为现期比重问题。定位文字材料第一段可得“截至2019年12月31日，中国共产党党员总数为9191.6万名，······大专及以上学历党员4661.5万名。”故2019年12月31日大专及以上学历党员占党员总数的比例\u003cimg data-k=\"0ad135118bf9\">。结合饼状图，阴影部分代表大专及以上学历党员人数，所占比例约等于一半，C项满足。\n故正确答案为C。","no":106,"missingImage":false},{"qid":"3522360","cat":"比重","stem":"截至2019年12月31日，资料所列8种党员职业类型中，党员人数占比不低于\u003cimg data-k=\"0c486c1399ce\">的有：","options":{"A":"3类","B":"4类","C":"5类","D":"6类"},"answer":"A","explanation":"根据题干“2019年12月31日······占比不低于······”，结合材料时间为2019年12月31日，可判定本题为现期比重问题。定位文字材料第一段可得“中国共产党党员总数为9191.6万名，…在党员的职业上，工人（含工勤技能人员）644.5万名，农牧渔民2556.1万名，企事业单位、社会组织专业技术人员1440.3万名，企事业单位、社会组织管理人员1010.4万名，党政机关工作人员767.8万名，学生196.0万名，其他职业人员710.4万名，离退休人员1866.1万名。”则2019年12月31日中国共产党党员总数的\u003cimg data-k=\"0c486c1399ce\">\u003cimg data-k=\"e02734878cfd\">。故党员人数占比不低于\u003cimg data-k=\"0c486c1399ce\">的有农牧渔民2556.1万名，企事业单位、社会组织专业技术人员1440.3万名，离退休人员1866.1万名，共3类。\n故正确答案为A。","no":107,"missingImage":false},{"qid":"3522363","cat":"比重","stem":"2018年，发展党员数占同期党员总数的比例约为：","options":{"A":"\u003cimg data-k=\"9c81bc54ec4a\">","B":"\u003cimg data-k=\"afa486bb9087\">","C":"\u003cimg data-k=\"1285ca4a8b37\">","D":"\u003cimg data-k=\"b72b1049e47b\">"},"answer":"B","explanation":"根据题干“2018年······占······的比例约为”，结合材料时间为2019年，可判定本题为基期比重问题。定位文字材料第一段可得“截至2019年12月31日，中国共产党党员总数为9191.6万名（B），同比增长\u003cimg data-k=\"3f7a4de9e34c\">（b）”，定位文字材料第二段可得“2019年共发展党员234.4万名（A），比上年增长\u003cimg data-k=\"3a49852e2145\">（a）”。根据基期比重公式可得：\u003cimg data-k=\"346c419a114d\">\u003cimg data-k=\"7895f8d11d33\">。\n故正确答案为B。","no":108,"missingImage":false},{"qid":"3523368","cat":"综合","stem":"截至2019年12月31日，55岁以上党员人数比46岁以下党员人数：","options":{"A":"多\u003cimg data-k=\"bd2ae01a8afe\">","B":"少\u003cimg data-k=\"bd2ae01a8afe\">","C":"多\u003cimg data-k=\"d9a420b527b1\">","D":"少\u003cimg data-k=\"d9a420b527b1\">"},"answer":"B","explanation":"根据题干“······55岁以上党员人数比46岁以下党员人数”，结合选项，可判定本题为一般增长率计算问题。定位图形材料可得：截至2019年12月31日，55岁以上党员人数为56至60岁、61岁及以上两部分人数的加和，即\u003cimg data-k=\"dc2b9fb05eb6\">万名；46岁以下党员人数为41至45岁、36至40岁、31至35岁、30岁及以下四部分人数的加和，即\u003cimg data-k=\"4e5040925f46\">\u003cimg data-k=\"545af749503a\">万名。则55岁以上党员人数比46岁以下党员人数少\u003cimg data-k=\"c3ed6aee0489\">\u003cimg data-k=\"a561018cc552\">\u003cimg data-k=\"1138fb77c0dc\">，最接近B项。\n故正确答案为B。","no":109,"missingImage":false},{"qid":"3522369","cat":"综合","stem":"不能从上述资料中推出的是：","options":{"A":"2019年发展的党员人数中，学生党员占比超过\u003cimg data-k=\"abb2b6429bea\">","B":"截至2019年12月31日，55岁以下党员占党员总数的比不超过\u003cimg data-k=\"985db08b06d9\">","C":"截至2019年12月31日，61岁及以上的党员人数中，新中国成立前入党的不超过\u003cimg data-k=\"f46ff070d55a\">","D":"截至2019年12月31日，从事农牧渔民职业的党员人数与工人（含工勤技能人员）党员人数之比超过\u003cimg data-k=\"7feba51d9197\">"},"answer":"D","explanation":"A项：定位文字材料第二段：“2019年共发展党员234.4万名，……发展学生84.4万名”，则2019年发展的党员人数中，学生党员占比为\u003cimg data-k=\"06cc130cd649\">，说法正确，排除；\nB项：定位图1，截至2019年12月31日，55岁以上党员人数\u003cimg data-k=\"251c79d04947\">，则55岁及以下党员占党员总数的比\u003cimg data-k=\"e6c7a9c8511f\">\u003cimg data-k=\"754468906257\">55岁以上党员占党员总数的比\u003cimg data-k=\"d3f7de1c56c8\">\u003cimg data-k=\"7e50c1dc51c1\">，故55岁以下党员占党员总数的比不超过\u003cimg data-k=\"985db08b06d9\">，说法正确，排除；\nC项：定位文字材料第一段，新中国成立前入党的17.4万名；定位图1，截至2019年12月31日61岁以上党员人数为2657.7万名。而截至2019年12月31日，新中国成立前入党的人员都已满61岁。故61岁及以上的党员人数中，新中国成立前入党的人数占比为\u003cimg data-k=\"617bac07fc3f\">，说法正确，排除；\nD项：定位文字材料第一段：“在党员的职业上，工人（含工勤技能人员）644.5万名，农牧渔民2556.1万名”，则从事农牧渔民职业的党员人数与工人（含工勤技能人员）党员人数之比为\u003cimg data-k=\"e2fcb6a6ada5\">，说法错误，当选。\n本题为选非题，故正确答案为D。","no":110,"missingImage":false}]},{"type":"material","material":"\u003cp>\u003cimg data-k=\"cbaf0eb047d2\" style=\"max-width:608px\">\u003c/p>","questions":[{"qid":"3523365","cat":"综合","stem":"2019年6月下旬，价格按从高到低排列居于第六位的生产资料是：","options":{"A":"苯乙烯","B":"聚乙烯","C":"聚丙烯","D":"涤纶长丝"},"answer":"A","explanation":"根据题干“2019年6月下旬，价格按从高到低排列居于第六位······”，结合材料时间为2019年7月上旬，可判定本题为基期比较问题。根据公式，基期量\u003cimg data-k=\"12f359d55bc1\">，定位表格材料可得：第1名是电解铜，\u003cimg data-k=\"b0fa3acf6277\">元/吨；第2名是锌锭，\u003cimg data-k=\"d173c25d34e8\">元/吨；第3名是铅锭，\u003cimg data-k=\"12fa8c82c506\">元/吨；第4名是铝锭，\u003cimg data-k=\"ccf748791f7c\">元/吨；第5名是顺丁胶，\u003cimg data-k=\"07e6dbd72a1b\">元/吨；第6名是苯乙烯，\u003cimg data-k=\"e68d941d4eca\">元/吨。\n故正确答案为A。","no":111,"missingImage":false},{"qid":"3523366","cat":"综合","stem":"2019年7月上旬，价格环比涨幅超过\u003cimg data-k=\"1a4b9a27904c\">的生产资料有：","options":{"A":"6种","B":"7种","C":"8种","D":"9种"},"answer":"C","explanation":"根据题干“2019年7月上旬，价格环比涨幅超过\u003cimg data-k=\"1a4b9a27904c\">的生产资料有”，可判定本题为一般增长率计算问题。根据公式，增长率\u003cimg data-k=\"911977f3d6e6\">。定位表格数据，可知2019年7月上旬：螺纹钢价格环比\u003cimg data-k=\"db9a80ea288f\">；线材价格环比\u003cimg data-k=\"b5abe7c208ae\">；热轧普通薄板价格环比\u003cimg data-k=\"77e0762e7853\">；纯苯价格环比\u003cimg data-k=\"ef67ed98cd9e\">；苯乙烯价格环比\u003cimg data-k=\"1d950d272ff2\">；聚乙烯价格环比\u003cimg data-k=\"89b7151c242f\">；聚丙烯价格环比\u003cimg data-k=\"4e39d198194d\">；涤纶长丝价格环比\u003cimg data-k=\"8b28fba48432\">；共8个增
