、中、差四个等次。今年考核结果为优的人数是去年的1.2倍，今年考核结果为良及以下的人员占比比去年低15个百分点。问两年考核结果均为优的人数至少为多少人？","options":{"A":"55","B":"65","C":"75","D":"85"},"answer":"B","explanation":"设去年考核结果为优的有\u003cimg data-k=\"5320a525f2bc\">人，则今年考核结果为优的为\u003cimg data-k=\"395bd279571b\">人。根据题意，两年总人数均为100，则今年考核结果为良及以下的人员比去年少了\u003cimg data-k=\"ad6af0e3f9f7\">人，即\u003cimg data-k=\"5866c6a93132\">。解方程得\u003cimg data-k=\"ea2503184800\">，则今年获优的有\u003cimg data-k=\"4cc16cfdd4e6\">人。根据两集合容斥原理，\u003cimg data-k=\"1137cbaf8600\">\u003cimg data-k=\"1a204063b5af\">，要“两年都为优的人数”最少，则“两年都不是优的人数”取最小数0，此时两年考核结果均为优的人数\u003cimg data-k=\"df6954c1e535\">人。\n故正确答案为B。","no":61,"missingImage":false},{"type":"question","qid":"2264386","cat":"数学运算","stem":"从A市到B市的机票如果打6折，包含接送机出租车交通费90元、机票税费60元在内的总乘机成本是机票打4折时总乘机成本的1.4倍。问从A市到B市的全价机票价格（不含税费）为多少元？","options":{"A":"1200","B":"1250","C":"1500","D":"1600"},"answer":"C","explanation":"根据题意，乘机总成本包括机票价格（不含税费）、交通费和机票税费。设从A市到B市的全价机票价格（不含税费）为\u003cimg data-k=\"5320a525f2bc\">元。根据两次折扣的1.4倍关系可列式：\u003cimg data-k=\"23ce0d45fee2\">，解得\u003cimg data-k=\"6531f7e7a3e1\">元。\n故正确答案为C。","no":62,"missingImage":false},{"type":"question","qid":"2264398","cat":"数学运算","stem":"小张和小王在同一个学校读研究生，每天早上从宿舍到学校有6：40、7：00、7：20和7：40发车的4班校车。某星期周一到周三，小张和小王都坐班车去学校，且每个人在3天中乘坐的班车发车时间都不同。问这3天小张和小王每天都乘坐同一趟班车的概率在：","options":{"A":"\u003cimg data-k=\"815ec268d3d4\">以下","B":"\u003cimg data-k=\"3ba2795e628d\">之间","C":"\u003cimg data-k=\"2498dc65c6ee\">之间","D":"\u003cimg data-k=\"0ef566a32600\">以上"},"answer":"C","explanation":"3天中乘坐的班车发车时间都不同，每人需在四趟班车内依次选三趟乘坐，有\u003cimg data-k=\"cf446651f732\">种情况。两人在3天中乘坐的班车发车时间都不同的总情况数有\u003cimg data-k=\"cc49cfead290\">种，若要求两人每天都乘坐同一趟班车，则其中一人选定之后，另一人只能与他的选择方式相同，有\u003cimg data-k=\"2241abfb7cbd\">种情况。故这3天小张和小王每天都乘坐同一趟班车的概率\u003cimg data-k=\"8e6199080b44\">\u003cimg data-k=\"c96396273e28\">。\n故正确答案为C。","no":63,"missingImage":false},{"type":"question","qid":"2264405","cat":"数学运算","stem":"甲车上午8点从A地出发匀速开往B地，出发30分钟后乙车从A地出发以甲车2倍的速度前往B地，并在距离B地10千米时追上甲车。如乙车9点10分到达B地，问甲车的速度为多少千米/小时？","options":{"A":"30","B":"36","C":"45","D":"60"},"answer":"A","explanation":"设甲车的速度为\u003cimg data-k=\"ad2aadafabbe\">千米/小时，乙车的速度为甲车的2倍即\u003cimg data-k=\"1679ea968fd4\">千米/小时。甲车出发30分钟即\u003cimg data-k=\"3f05f5fdaaff\">小时后乙车开始追，则两车的路程差为\u003cimg data-k=\"73113aea0d9f\">千米，由追及公式“\u003cimg data-k=\"245e87bc0719\">”可得，\u003cimg data-k=\"0d79c4a2f49d\">小时。乙车在上午8点的30分钟后出发，9点10分到达B地，共用时\u003cimg data-k=\"af3d568fe16a\">。设乙在C点追上甲，则\u003cimg data-k=\"12ef2b99ad2d\">千米，乙车从C地到B地用时\u003cimg data-k=\"eb0d4e684dc9\">小时。则乙车的速度=\u003cimg data-k=\"65f65348c2b6\">，甲车的速度\u003cimg data-k=\"d38f8fac040c\">。\n故正确答案为A。","no":64,"missingImage":false},{"type":"question","qid":"2264406","cat":"数学运算","stem":"甲和乙进行5局3胜的乒乓球比赛，甲每局获胜的概率是乙每局获胜概率的1.5倍。问以下哪种情况发生的概率最大？","options":{"A":"比赛在3局内结束","B":"乙连胜3局获胜","C":"甲获胜且两人均无连胜","D":"乙用4局获胜"},"answer":"A","explanation":"根据“甲每局获胜的概率是乙每局获胜概率的1.5倍”，设乙的概率为\u003cimg data-k=\"5320a525f2bc\">，则甲的概率为\u003cimg data-k=\"f97579604387\">，由\u003cimg data-k=\"18123316f4f2\">，解得\u003cimg data-k=\"c5c5051bbc98\">，即甲获胜的概率为0.6，乙为0.4。\nA项：比赛在3局内结束，有两种情况：①甲连胜3局，概率\u003cimg data-k=\"85dd80c66595\">；②乙连胜3局，概率\u003cimg data-k=\"ed0f1814b15b\">。故A项总概率\u003cimg data-k=\"03af7896c6e4\">。\nB项：乙连胜3局获胜，有三种情况：①乙前3局连胜，概率\u003cimg data-k=\"ed0f1814b15b\">；②乙第2、3、4局连胜，概率\u003cimg data-k=\"e912c9a76385\">；③乙第3、4、5局连胜，概率\u003cimg data-k=\"31c72b743b81\">；故B项总概率\u003cimg data-k=\"3d43a083362a\">。\nC项：甲获胜且两人均无连胜，只有一种情况，即甲获胜三局且分别是第1、3、5局获胜，概率\u003cimg data-k=\"cb6ac3002894\">。\nD项：乙用4局获胜，则第四局必然是乙获胜，且前三局中乙有两局获胜，因此概率\u003cimg data-k=\"e6c7a9c8511f\">\u003cimg data-k=\"a14fbc3593b2\">。\n故正确答案为A。","no":65,"missingImage":false},{"type":"question","qid":"2264409","cat":"数学运算","stem":"有甲、乙、丙三个工作组，已知乙组2天的工作量与甲、丙共同工作1天的工作量相同。A工程如由甲、乙组共同工作3天，再由乙、丙组共同工作7天，正好完成。如果三组共同完成，需要整7天。B工程如丙组单独完成正好需要10天，问如由甲、乙组共同完成，需要多少天？","options":{"A":"不到6天","B":"6天多","C":"7天多","D":"超过8天"},"answer":"C","explanation":"根据题意，甲、乙、丙三者的效率满足以下关系：\n\u003cimg data-k=\"e94d6dec3999\">\n\u003cimg data-k=\"f8214fc05e56\">\n②式整理可得：\u003cimg data-k=\"13d221e1777a\">，即\u003cimg data-k=\"43f06fbf74d6\">。赋值\u003cimg data-k=\"a266d9c624b9\">，\u003cimg data-k=\"70ff06535892\">，代入①式可得：\u003cimg data-k=\"385526e30bac\">。则B工程的工作量为\u003cimg data-k=\"31c48b479430\">，如由甲、乙共同完成需要\u003cimg data-k=\"f37cce16c72f\">天，即7天多。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"2264411","cat":"数学运算","stem":"某单位有2个处室，甲处室有12人，乙处室有20人。现在将甲处室最年轻的4人调入乙处室，则乙处室的平均年龄增加了1岁，甲处室的平均年龄增加了3岁。问在调动之前，两个处室的平均年龄相差多少岁？","options":{"A":"8","B":"12","C":"14","D":"15"},"answer":"B","explanation":"设调动前甲处室的平均年龄为\u003cimg data-k=\"5320a525f2bc\">岁，乙处室的平均年龄为\u003cimg data-k=\"c1beececd683\">岁，则调动后甲处室的平均年龄为\u003cimg data-k=\"bbb871d26983\">岁，乙处室的平均年龄为\u003cimg data-k=\"5f70e3e703ae\">岁。根据调动前后甲、乙两处室的年龄之和不变，可列式：\u003cimg data-k=\"c6e2b45aab5c\">，解得\u003cimg data-k=\"20f363cb9a98\">，所以调动前两个处室的平均年龄差为12岁。\n故正确答案为B。","no":67,"missingImage":false},{"type":"question","qid":"2264416","cat":"数学运算","stem":"甲和乙两条自动化生产线同时生产相同的产品，甲生产线单位时间的产量是乙生产线的5倍，甲生产线每工作1小时就需要花3小时时间停机冷却而乙生产线可以不间断生产。问以下哪个坐标图能准确表示甲、乙生产线产量之差（纵轴L）与总生产时间（横轴T）之间的关系？","options":{"A":"\u003cimg data-k=\"49ee290cd454\" style=\"max-width:299px\">","B":"\u003cimg data-k=\"e9f8f0670d4d\" style=\"max-width:285px\">","C":"\u003cimg data-k=\"7050b126b313\" style=\"max-width:303px\">","D":"\u003cimg data-k=\"ac5a7e9b0880\" style=\"max-width:297px\">"},"answer":"A","explanation":"根据“甲生产线单位时间的产量是乙生产线的5倍”赋值甲的效率为5，乙的效率为1。根据题意，甲生产线工作1小时，休息3小时，而乙生产线持续工作，可得下表：\n\u003cimg data-k=\"04264fc14637\" style=\"max-width:478px\">\n观察表格可知，每4小时为一个变化周期。\n先看变化趋势：每个周期前1个小时产量之差不断增大，后3小时产量之差不断减小，排除C项；\n再看拐点对应时长（横轴T）：每个周期增加过程所对应时长与下降过程所对应时长之比为1：3，排除B项；\n最后看对应高度（纵轴L）：每个周期都是升4再降3，下降值大于上升值的一半，排除D项。\n故正确答案为A。","no":68,"missingImage":false},{"type":"question","qid":"2264418","cat":"数学运算","stem":"某单位要求职工参加20课时线上教育课程，其中政治理论10课时，专业技能10课时。可供选择的政治理论课共8门，每门2课时；可供选择的专业技能课共10门，其中2课时的有5门，1课时的有5门。问可选择的课程组合共有多少种？","options":{"A":"5656","B":"5600","C":"1848","D":"616"},"answer":"A","explanation":"根据题意，政治理论课在8门中选5门即可达到10课时，一共有：\u003cimg data-k=\"98c30edd4374\">种情况。专业技能课若要达到10课时，可分为以下3类：①2课时的课5门全选，情况数为1种；②2课时的课选4门，1课时的课选2门，情况数为\u003cimg data-k=\"6c8b6799432f\">种；③2课时的课选3门，1课时的课选4门，情况数为\u003cimg data-k=\"2decb1243294\">种，故选专业技能课的情况数为\u003cimg data-k=\"f0d702178104\">种。所以可选择的课程组合共有\u003cimg data-k=\"834a644b6165\">种。\n故正确答案为A。","no":69,"missingImage":false},{"type":"question","qid":"2264420","cat":"数学运算","stem":"花圃自动浇水装置的规则设置如下：\n①每次浇水在中午12:00~12:30之间进行；\n②在上次浇水结束后，如连续3日中午12:00气温超过30摄氏度，则在连续第3个气温超过30摄氏度的日子中午12:00开始浇水；\n③如在上次浇水开始120小时后仍不满足条件②，则立刻浇水。\n已知6月30日12:00~12:30该花圃第一次自动浇水，7月份该花圃共自动浇水8次，问7月至少有几天中午12:00的气温超过30摄氏度？","options":{"A":"18","B":"12","C":"20","D":"15"},"answer":"D","explanation":"根据题意，若要使7月份中午气温超过30摄氏度的天数尽可能少，则应同时满足两个条件：（1）超过30摄氏度的日子均以连续3天的方式出现；（2）未超过30摄氏度的日子均以连续\u003cimg data-k=\"f4e1557b7641\">天的方式出现。\n题干问“至少”，从最小的选项开始代入。\nC项：若超过30摄氏度的日子有12天，则未超过30摄氏度的日子有\u003cimg data-k=\"6d38c7f51da6\">天。根据规则②可知，12天中浇水\u003cimg data-k=\"1cb804f971d8\">次；根据规则③可知，\u003cimg data-k=\"6d588a1dc3cc\">，即19天中浇水3次。\u003cimg data-k=\"ac52b925924f\">次，与“浇水8次”矛盾，排除；\nD项：若超过30摄氏度的天数为15天，则未超过30摄氏度的天数为\u003cimg data-k=\"20cf1ef8ea64\">天。根据规则②可知，15天中浇水\u003cimg data-k=\"5aa1783337d8\">次；根据规则③可知，\u003cimg data-k=\"6ea37822d9a6\">，即16天中浇水3次，\u003cimg data-k=\"bd2716fe52a9\">次。满足题意，当选。\n故正确答案为D。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>某次历史、地理知识竞赛规定，每个参赛队必须由3名选手组成。参赛队每场回答7道题，其中3道地理题、4道历史题。同类题目均不连续出现，并依次编号。比赛时按顺序答题，每道题只能由一名选手当场作答。\u003cbr>\u003c/p>\u003cp>“镇美”队在某场比赛中派出了陈佳、赵义、王冰三名选手参赛。赛前约定：\u003c/p>\u003cp>（1）赵义只回答历史题；\u003c/p>\u003cp>（2）王冰只回答其中1题；\u003c/p>\u003cp>（3）赵义、陈佳答题总数均不少于2题；\u003c/p>\u003cp>（4）每个选手连续回答不能超过2题。\u003c/p>","questions":[{"qid":"2264342","cat":"类比推理","stem":"“镇美”队每个选手完成自己最少的答题任务之后，剩下的题目依次是：","options":{"A":"地理题、历史题","B":"历史题、地理题","C":"地理题、历史题、地理题","D":"历史题、地理题、历史题"},"answer":"A","explanation":"第一步：分析题干。\n（1）每场回答7道题目，3道地理题，4道历史题；\n（2）同类题目不连续出现；\n（3）比赛时按顺序答题，每道题只能由一名选手当场作答；\n（4）赵义只回答历史题；\n（5）王冰只回答其中1题；\n（6）赵义、陈佳答题数均大于等于2道题；\n（7）每个选手连续回答不能超过2道题。\n 第二步：根据题干条件分析选项。\n由条件（1）和（2）可知第1、3、5、7题题目类型相同，第2、4、6题题目类型相同，故答题顺序应为：历史、地理、历史、地理、历史、地理、历史。再根据条件（5）（6）可知王冰、赵义、陈佳三人最少的答题量为5道题，结合提问可知，每个选手完成自己最少的答题量之后，还剩下2道题，剩下的题目为地理、历史，对应A项。\n故正确答案为A。","no":71,"missingImage":false},{"qid":"2264344","cat":"类比推理","stem":"如果在该场比赛中，陈佳和赵义均答对了一半的题目，则该场比赛“镇美”队答对的总题数最少为：","options":{"A":"1题","B":"2题","C":"3题","D":"4题"},"answer":"C","explanation":"第一步：分析题干。\n（1）每场回答7道题目，3道地理题，4道历史题；\n（2）同类题目不连续出现；\n（3）比赛时按顺序答题，每道题只能由一名选手当场作答；\n（4）赵义只回答历史题；\n（5）王冰只回答其中1题；\n（6）赵义、陈佳答题数均大于等于2道题；\n（7）每个选手连续回答不能超过2道题；\n（8）陈佳和赵义均答对了一半的题目。\n第二步：根据题干条件分析选项。\n根据条件（5）王冰只回答其中1题，可知陈佳和赵义一共答了6题，结合条件（8）可知，陈佳和赵义均答对了一半的题目，所以陈佳和赵义最少答对的题目数量为3道题，结合提问可知，要求答对的总数最少，那么王冰回答错误即满足要求，所以答对的总题数最少为3道。\n故正确答案为C。","no":72,"missingImage":false},{"qid":"2264346","cat":"类比推理","stem":"如果有两名选手答题总数相同，则可以得出：","options":{"A":"赵义回答了所有历史题","B":"陈佳回答的都是地理题","C":"陈佳和王冰每人各答了一道历史题","D":"陈佳、王冰中的一人回答了一道历史题"},"answer":"D","explanation":"第一步：分析题干。\n（1）每场回答7道题目，3道地理题，4道历史题；\n（2）同类题目不连续出现；\n（3）比赛时按顺序答题，每道题只能由一名选手当场作答；\n（4）赵义只回答历史题；\n（5）王冰只回答其中1题；\n（6）赵义、陈佳答题数均大于等于2道题；\n（7）每个选手连续回答不能超过2道题；\n（8）两名选手答题总数相同。\n第二步：根据题干条件分析选项。\n根据条件（8）可知，有两名选手答题总数相同，结合条件（1）（5）（6）可知，一共7道题目，王冰只回答1道题，则赵义和陈佳的答题量总数为6道题，由于赵义和陈佳的答题数均大于等于2道题，故只能是陈佳、赵义答题数相同，且各回答3道题。根据条件（4）可知，赵义回答的3道题均为历史题，结合（1）知一共有4道历史题，所以还剩余1道历史题，则此题只能是陈佳、王冰中的一人回答。\n故正确答案为D。","no":73,"missingImage":false},{"qid":"2264349","cat":"逻辑判断","stem":"如果在该场比赛中，所有的历史题都答对了，而所有的地理题都答错了，假定每题1分，则以下哪项中选手的得分情况是不可能的？","options":{"A":"陈佳＝1；赵义＝2；王冰＝1","B":"陈佳＝2；赵义＝1；王冰＝1","C":"陈佳＝1；赵义＝3；王冰＝0","D":"陈佳＝2；赵义＝2；王冰＝0"},"answer":"B","explanation":"第一步：分析题干。\n（1）每场回答7道题目，3道地理题，4道历史题；\n（2）同类题目不连续出现；\n（3）比赛时按顺序答题，每道题只能由一名选手当场作答；\n（4）赵义只回答历史题；\n（5）王冰只回答其中1题；\n（6）赵义、陈佳答题数均大于等于2道题；\n（7）每个选手连续回答不能超过2道题。\n 第二步：根据题干条件分析选项。\n根据提问可知，所有的历史题都答对了，所以可以优先从历史题入手进行推理，根据（4）（6）可知，赵义回答的历史题大于等于2道，又因为所有历史题都答对了，所以赵义的得分一定大于等于2，不可能是1。\n本题为选非题，故正确答案为B。","no":74,"missingImage":false},{"qid":"2264353","cat":"逻辑判断","stem":"补充以下哪项，可以确定该场比赛中3名选手各自的答题编号？","options":{"A":"赵义回答的是第1、第7题","B":"陈佳答了4道题","C":"赵义回答的是第3、第5题","D":"陈佳回答的是第2、第4和第6题"},"answer":"A","explanation":"第一步：分析题干。\n（1）每场回答7道题目，3道地理题，4道历史题；\n（2）同类题目不连续出现；\n（3）比赛时按顺序答题，每道题只能由一名选手当场作答；\n（4）赵义只回答历史题；\n（5）王冰只回答其中1题；\n（6）赵义、陈佳答题数均大于等于2道题；\n（7）每个选手连续回答不能超过2道题。\n第二步：根据题干条件分析选项。\n结合提问可知，需补充一项后可确定3名选手各自的答题编号，因此考虑代入排除法。\n代入A项，赵义回答的是第1、第7题，则剩余的2、3、4、5、6只能是陈佳和王冰所答，结合条件（5）可知，王冰只回答一道题，剩下的4道题目是陈佳回答的，又因为条件（7）可知陈佳的4道题不可能出现连续超过2道的情况，因此陈佳回答的只能是2、3、5、6题，此时王冰只能回答第4题，其余题目均为陈佳所答。所以补充A项之后，就能够确定3名选手的回答编号，赵义回答编号为1、7，王冰回答的编号为4，陈佳的编号为2、3、5、6。\n故正确答案为A。","no":75,"missingImage":false},{"qid":"2264337","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"45ac179b7bc0\" style=\"max-width:554px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"\u003cimg data-k=\"ae084643f9ab\" style=\"max-width:357px\">\n元素组成基本相同，优先考虑位置规律。观察发现，三角形与正方形的公共边每次沿正方形的外框顺时针平移半条边，则？处图形中公共边应位于正方形上边框的右侧，排除C项和D项。继续观察发现，三角形在正方形内部的顶点也每次顺时针平移一个位置（如图），故？处应选择一个三角形顶点位于正方形内部左下角位置的图形，只有B项符合。\n故正确答案为B。","no":76,"missingImage":false},{"qid":"2264340","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"49b8bcf44195\" style=\"max-width:554px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"\u003cimg data-k=\"f7eace110c48\" style=\"max-width:554px\">\n元素组成不同，优先考虑属性规律。观察发现，题干图形均为轴对称图形，并且对称轴方向每次顺时针旋转\u003cimg data-k=\"f0149b2f4575\">，排除A项和C项。进一步观察发现，题干中图1、图3和图5的对称轴都与图形中的一条线重合，而图2和图4的对称轴没有与图形中的一条线重合，故“？”处应选择一个图形的对称轴不与图形中某一条线重合的，只有B项符合。\n故正确答案为B。","no":77,"missingImage":false},{"qid":"2264343","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"eafb327a8bfb\" style=\"max-width:485px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成相似，且相同线条重复出现，优先考虑样式规律中的加减同异。九宫格优先看横行，第一行中，图1和图2求异后再顺时针或者逆时针旋转\u003cimg data-k=\"c16e5a8b3239\">得到图3；经验证，第二行也满足此规律；第三行应用此规律，故“？”处应选择一个图1和图2先求异再顺时针或者逆时针旋转\u003cimg data-k=\"c16e5a8b3239\">得到的图形。观察选项发现，逆时针旋转\u003cimg data-k=\"c16e5a8b3239\">无答案，只有顺时针旋转\u003cimg data-k=\"c16e5a8b3239\">得到D选项。\n故正确答案为D。","no":78,"missingImage":false},{"qid":"2264347","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"6ff3e483ba9f\" style=\"max-width:513px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"\u003cimg data-k=\"f174a1d5a391\" style=\"max-width:435px\">\n元素组成相同，但无位置规律。继续观察发现，题干图形的黑圆有明显连在一起的，考虑数部分数。第一组图黑圆连起来看，部分数分别为1、2、3；第二组图应用此规律，黑圆连起来看部分数依次为1、2、？，故？处应该选择一个黑圆为3部分的图形。A、B、C、D的黑圆连起来的部分数分别为3、2、4、4，只有A选项符合。\n故正确答案为A。","no":79,"missingImage":false},{"qid":"2264351","cat":"图形推理","stem":"左边给定的是正方体的外表面展开图，下面哪一项能由它折叠而成？\n\u003cimg data-k=\"b8dba69e374a\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"将展开图的面均标上序号，如下图。\n\u003cimg data-k=\"3d542cbd6983\" style=\"max-width:600px\">\n逐一分析选项：\n A项：选项出现了面e、面g和面h，而题干中面e和面g为相对面，不能同时出现，选项与题干不一致，排除；\n B项：选项出现了面e、面h和面i，面e和面h的公共边挨着面e的黑色部分，而题干中这两个面的公共边（如图）没有挨着面e的黑色部分，选项与题干不一致，排除；\n C项：选项出现了面e、面f和面i，与题干一致，当选；\n D项：选项出现了面e、面g和面k，而题干中面e和面g为相对面，不能同时出现，选项与题干不一致，排除。\n 故正确答案为C。","no":80,"missingImage":false},{"qid":"2264356","cat":"图形推理","stem":"左图为6个相同小正方体组合成的多面体，将其从任一面剖开，以下哪一项\u003cb>不可能\u003c/b>是该多面体的截面？\n\u003cimg data-k=\"d0e1890635e2\" style=\"max-width:450px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查截面图，逐一分析选项。\n如下图所示，A、B、C项均可截出，该立体图形无法同时截出D项的菱形和三角形。\nA项：\u003cimg data-k=\"0955f93e5e48\" style=\"max-width:135px\">\nB项：\u003cimg data-k=\"f2b8a2c302d3\" style=\"max-width:132px\">\nC项：\u003cimg data-k=\"172a327bfe19\" style=\"max-width:167px\">\nD项：无法切出，当选。\n本题为选非题，故正确答案为D。","no":81,"missingImage":false},{"qid":"2264364","cat":"图形推理","stem":"下图为同样大小的正方体堆叠而成的多面体正视图和后视图。该多面体可拆分为①、②、③和④共4个多面体的组合，问下列哪一项能填入问号处？\n\u003cimg data-k=\"dd58a617f2c3\" style=\"max-width:554px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查立体拼合。由题干给出的多面体的正视图和后视图，可知，图形可分为前中后3排，最前面一排，根据正视图可知共有2个小立方体，中间一排，根据正视图和后视图可知共有8个小立方体，最后一排，根据后视图可知共有12个小立方体，故该多面体共有2+8+12=22个小立方体。观察题干图形发现，①有5个小立方体，②有6个小立方体，③有5个小立方体，所以若要将①、②、③、④组合在一起拼成题干多面体，则④应该有6个小立方体。\nA项有4个小立方体，B项有5个小立方体，C项有5个小立方体，D项有6个小立方体。\n\u003cimg data-k=\"669296fd11ce\" style=\"max-width:554px\">\n故正确答案为D。","no":82,"missingImage":false},{"qid":"2264369","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"624f5dc1a7f0\" style=\"max-width:554px\">","options":{"A":"①②③，④⑤⑥","B":"①②⑥，③④⑤","C":"①④⑥，②③⑤","D":"①③④，②⑤⑥"},"answer":"B","explanation":"解析一：本题为分组分类题目。每幅图中都由黑白两部分组成，观察发现图①②⑥中白色部分和黑色部分的面积都是相同的，而图③④⑤中白色部分的面积都大于黑色部分的面积，故图①②⑥为一组，图③④⑤为一组。\n故正确答案为B。\n解析二：本题为分组分类题目。每幅图中都由黑白两部分组成，观察发现图①②⑥中白色部分和黑色部分面的形状都是相同的，而图③④⑤中白色部分面的形状和黑色部分不相同，故图①②⑥为一组，图③④⑤为一组。\n故正确答案为B。","no":83,"missingImage":false},{"qid":"2264371","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"a8dfb7d525ea\" style=\"max-width:554px\">","options":{"A":"①④⑤，②③⑥","B":"①②⑤，③④⑥","C":"①④⑥，②③⑤","D":"①③④，②⑤⑥"},"answer":"A","explanation":"解析一：\n\u003cimg data-k=\"82f1cc46a711\" style=\"max-width:554px\">\n\n本题为分组分类题目。观察发现元素组成相同，优先考虑位置规律。观察小黑点和阴影三角形的位置关系，可从小黑点向三角形方向就近画时针，发现图①④⑤为顺时针，②③⑥为逆时针。即图①④⑤为同一个图形进行旋转得到，图②③⑥为同一个图形进行旋转得到。故①④⑤为一组，②③⑥为一组。\n故正确答案为A。\n解析二：\n\u003cimg data-k=\"1decccb5e30a\" style=\"max-width:554px\">\n本题为分组分类题目。观察发现题干每幅图形均有小黑点，考虑功能元素。观察小黑点和阴影三角形的位置关系，由于三角形具有指向性，可从阴影三角形的底边向中心画出一个箭头，以箭头指向的方向为上，观察发现图①④⑤小黑点都在阴影三角形的右侧，②③⑥小黑点都在阴影三角形的左侧。故①④⑤为一组，②③⑥为一组。\n故正确答案为A。","no":84,"missingImage":false},{"qid":"2264372","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"ecdddf971693\" style=\"max-width:554px\">","options":{"A":"①③④，②⑤⑥","B":"①②⑥，③④⑤","C":"①③⑤，②④⑥","D":"①④⑥，②③⑤"},"answer":"C","explanation":"本题为分组分类题目。观察图形发现，多边形内部被线条分割，优先考虑数面的数量，但题干图形的面数量都是5，无法分组。继续观察发现，图①③⑤中存在明显最小的面，且最小的面的形状均与图形外轮廓形状相同，图②④⑥中存在明显最大的面，且最大的面的形状均与图形外轮廓形状相同，故①③⑤一组，②④⑥一组。\n故正确答案为C。","no":85,"missingImage":false},{"qid":"2264339","cat":"定义判断","stem":"定律假说是对一类事物或现象的性质或发生原因作出推测性解释，得出一个可能具有普遍性意义的规律性命题，从而试图建立、发展或补充科学理论。\n根据上述定义，下列属于定律假说的是：","options":{"A":"老师向学生们解释潮汐现象产生的原因是海水在引力作用下出现的周期性运动","B":"某单位仓库被盗，由于未发现破坏性进入的痕迹，侦查人员认为内部人员作案的可能性极大","C":"牛顿根据苹果掉落现象发现了万有引力定律","D":"有研究人员指出，由基因导致的疾病可能都是由于基因突变引起的"},"answer":"C","explanation":"第一步：找出定义关键词。\n“对一类事物或现象的性质或发生原因做出推测性解释”、“得出一个可能具有普遍性意义的规律性命题”、“从而试图建立、发展或补充科学理论”。\n第二步：逐一分析选项。\nA项：老师向学生解释潮汐产生的原因，是对该现象产生原因的直接解释，而非推测性解释，不符合“对一类现象的发生原因作出推测性解释”，不符合定义，排除； \nB项：某仓库被盗，侦查人员认为是内部作案，某仓库的情况是个例，不符合“对一类事物或现象的发生原因作出推测性解释”，也没体现“得出一个可能具有普遍意义的规律性命题”，不符合定义，排除；\nC项：牛顿根据苹果掉落现象发现了万有引力定律，根据苹果掉落现象符合“对一类事物或现象的性质或发生原因做出推测性解释”，发现万有引力定律符合“得出一个可能具有普遍意义的规律性命题”、“从而试图建立、发展或补充科学理论”，符合定义，当选；\nD项：由基因导致的疾病“可能”都是由于基因突变引起的，是对此类疾病发生原因的推测性解释，但是没体现“得出一个可能具有普遍意义的规律性命题”、“从而试图建立、发展或补充科学理论”，不符合定义，排除。\n故正确答案为C。\n【备注】经粉笔教研，并通过查原文，C项牛顿依据苹果掉落现象提出引力假说属于理论假说，且在自然科学领域，理论假说都属于定律假说，故C项属于定律假说；而D项，研究基因导致的疾病的病因，其目的是为了帮助医生今后在治疗此类疾病时能对症下药，避免工作的盲目性，所以应属于作业假说，而非定律假说。\n\u003cimg data-k=\"9d518f540266\" style=\"max-width:689px\">\n\u003cimg data-k=\"2fdf6ab0c3ac\" style=\"max-width:654px\">\n原文链接： http://www.cssn.cn/zt/zt_zh/kuaxuekezhuanti/flljx/jsyzcjs/jsff/201609/t20160920_3207766_2.shtml","no":86,"missingImage":false},{"qid":"2264341","cat":"定义判断","stem":"严格指示词是指一个语言表达式所具有的如下性质：它所指示的对象不会随着该表达式被使用的具体情境而发生改变。这些情境通常包括表达式的使用主体、表达式被使用的时间、地点、世界状态等等。\n根据上述定义，下列属于严格指示词的是：","options":{"A":"现任联合国秘书长","B":"世界上身高最高的人","C":"最小的素数","D":"经常坐在教室第一排正中间的同学"},"answer":"C","explanation":"第一步：找出定义关键词。\n“它所指示的对象不会随着该表达式被使用的具体情境而发生改变”、“这些情境通常包括表达式的使用主体、表达式被使用的时间、地点、世界状态等等”\n第二步：逐一分析选项。\nA项：联合国秘书长的任期为5年，现任联合国秘书长所指示的对象会随着使用时间的改变而发生改变，不符合“所指示的对象不会随着该表达式被使用的具体情境而发生改变”，不符合定义，排除； \nB项：世界上身高最高的人，身高会随着时间的变化发生变化，世界上身高最高的人所指示的对象也会随着时间发生改变，不符合“所指示的对象不会随着表达式被使用的具体情境而发生改变”，不符合定义，排除；\nC项：素数是指大于1的自然数中，只能被1和它本身整除的数。最小的素数是2，是唯一确定的结论，不会随着具体情境的改变而发生变化，符合定义，当选；\nD项：经常坐在教室第一排正中间的同学，不同教室坐在第一排正中间的同学是不同的，它所指示的对象会随着地点的改变而改变，不符合“所指示的对象不会随着该表达式被使用的具体情境而发生改变”，不符合定义，排除。\n故正确答案为C。","no":87,"missingImage":false},{"qid":"2264345","cat":"定义判断","stem":"同病异治是指中医对相同疾病采取不同的治法，达到治病求本的治疗效果；异病同治是指不同的疾病在发展过程中出现性质相同的症状，因而可以采用同样的中医治疗方法。\n根据上述定义，下列属于异病同治的是：","options":{"A":"久痢脱肛和胃下垂，均为中气下陷之证，可用升提中气之法治疗","B":"外感风热，内有蕴热的表里俱实之证，宜解表和攻里之药同时并用","C":"麻疹初期疹未出透，治疗宜宣肺透疹；中期肺热明显，治疗宜清热解毒","D":"风热感冒宜用辛凉解表法治疗，风寒感冒宜用辛温解表法治疗"},"answer":"A","explanation":"第一步：找出定义关键词。\n同病异治：“中医对相同疾病采取不同的治法”、 “达到治病求本的治疗效果”。\n异病同治：“不同的疾病”、“出现性质相同的症状”、“采用相同的中医治疗方法”。\n第二步：逐一分析选项。\nA项：久痢脱肛和胃下垂，符合“不同的疾病”，均为中气下陷之证，符合“出现性质相同的症状”，可用升提中气之法治疗，符合“采用相同的中医治疗方法”，符合“异病同治”定义，当选； \nB项：外感风热，内有蕴热，是一种疾病的内部及外表的两方面表现，解表和攻里之药同时并用，是指治病时需内外兼治，是一种疾病采取一种治疗方法，不符合任何一个定义，排除；\nC项：麻疹初期和中期的治疗方法不同，符合“中医对相同疾病采取不同的治法”，符合“同病异治”定义，不符合“异病同治”定义，排除；\nD项：风热感冒宜用辛凉解表法治疗，风寒感冒宜用辛温解表法治疗，是不同的疾病采用不同的中医治疗方法，不符合任何一个定义，排除。\n故正确答案为A。","no":88,"missingImage":false},{"qid":"2264348","cat":"逻辑判断","stem":"物候现象是生物随着气候一年四季的周期性变化而发生的相应季节性变化的现象。影响物候现象的因素主要包括海拔的差异、经度的差异、纬度的差异和时间的差异。\n下列诗句反映的物候现象受到海拔差异影响的是：","options":{"A":"日出江花红胜火，春来江水绿如蓝","B":"竹外桃花三两枝，春江水暖鸭先知","C":"人间四月芳菲尽，山寺桃花始盛开","D":"羌笛何须怨杨柳，春风不度玉门关"},"answer":"C","explanation":"第一步：找出定义关键词。\n“生物随着气候一年四季的周期性变化而发生的相应季节性变化”、“海拔差异影响”。\n第二步：逐一分析选项。\nA项：“日出江花红胜火，春来江水绿如蓝”意思是清晨日出的时候，江边盛开的花朵，简直比火还要红艳；当春天来到时，江里的水，青绿得就像是蓝色的一样。不涉及“海拔差异对物候现象的影响”，不符合定义，排除； \nB项：“竹外桃花三两枝，春江水暖鸭先知”意思是竹林外两三枝桃花初放，鸭子在水中游戏，它们最先察觉了初春江水的回暖。不涉及“海拔差异对物候现象的影响”，不符合定义，排除；\nC项：“人间四月芳菲尽，山寺桃花始盛开”意思是在人间四月里百花凋零已尽，高山古寺中的桃花才刚刚盛开，是由于高山的海拔较高，温度较低才导致这一现象，符合“海拔差异对物候现象的影响”，符合定义，当选；\nD项：“羌笛何须怨杨柳，春风不度玉门关”意思是何必用羌笛吹起那哀怨的杨柳曲去埋怨春光迟迟不来呢，玉门关一带春风是吹不到的啊，玉门关位于甘肃省境内，这里属于非季风区，不受夏季季风的影响才导致这一现象，不符合“海拔差异对物候现象的影响”，不符合定义，排除。\n故正确答案为C。","no":89,"missingImage":false},{"qid":"2264352","cat":"定义判断","stem":"公平世界谬误是指人们倾向于认为我们生活的世界是公平的，一个人获得成就，是因为他肯定做对了什么，所以这份成就是他应得的；一个人遭遇不幸，他自己也有责任，甚至是咎由自取。\n根据上述定义，下列没有反映公平世界谬误的是：","options":{"A":"一分耕耘，一分收获","B":"谋事在人，成事在天","C":"可怜之人必有可恨之处","D":"天网恢恢，疏而不漏"},"answer":"B","explanation":"第一步：找出定义关键词。\n“一个人获得成就，是因为他肯定做对了什么，所以这份成就是他应得的”、“一个人遭遇不幸，他自己也有责任，甚至是咎由自取”。\n第二步：逐一分析选项。\nA项：“一分耕耘，一分收获”，意思是付出一份劳力就得一分收益。符合“一个人获得成就，是因为他肯定做对了什么，所以这份成就是他应得的”，符合定义，排除； \nB项：“谋事在人，成事在天”，意思是自己已经尽力而为，至于能否达到目的，那就要看时运如何了。能否达到目的看的是时运而不是自己，不符合“一个人获得成就，是因为他肯定做对了什么，所以这份成就是他应得的”，也不符合“一个人遭遇不幸，他自己也有责任，甚至是咎由自取”，不符合定义，当选；\nC项：“可怜之人必有可恨之处”，意思是一个貌似可怜之人现实的不如意，一定是由于之前的过错或咎由自取造成的。符合“一个人遭遇不幸，他自己也有责任，甚至是咎由自取”，符合定义，排除；\nD项：“天网恢恢，疏而不漏”，意思是天道公平，作恶就要受到惩罚，它看起来似乎很不周密，但最终不会放过一个坏人。符合“一个人遭遇不幸，他自己也有责任，甚至是咎由自取”， 符合定义，排除。\n本题为选非题，故正确答案为B。","no":90,"missingImage":false},{"qid":"2264355","cat":"定义判断","stem":"按照先后顺序排列的两个数字或者字母称为序对，如2a、e3、dm等等，序对中的第一个数字或者字母称为前项，第二个称为后项。函项指的是由若干序对构成的一个有限序列，其中每个序对的前项都是字母，后项都是数字，并且对于任一序对，如果前项相同，则后项必定相同。\n根据上述定义，下列哪项属于函项？","options":{"A":"p3、c4、d6、p6、m8","B":"b3、5a、8n、p1、66","C":"f4、h4、gm、y2、x2","D":"a3、b5、d6、p1、e3"},"answer":"D","explanation":"第一步：找出定义关键词。\n序对：“按照先后顺序排列的两个数字或者字母称为序对”、“序对中的第一个数字或者字母称为前项，第二个称为后项”。\n函项：“由若干序对构成的有限序列”、“每个序对的前项都是字母，后项都是数字” 、“对于任一序对，如果前项相同，则后项必定相同”。\n第二步：逐一分析选项。\nA项：p3和p6这两个序对，前项相同但是后项不同。不符合“对于任一序对，如果前项相同，则后项必定相同”，不符合定义，排除； \nB项：5a、8n和66这三个序对，前项是数字。不符合“每个序对的前项都是字母，后项都是数字”，不符合定义，排除；\nC项：gm这个序对，后项是字母。不符合“每个序对的前项都是字母，后项都是数字”，不符合定义，排除；\nD项：a3、b5、d6、p1、e3，每个序对都是前项是字母，后项是数字。符合“每个序对的前项都是字母，后项都是数字”，符合定义，当选。\n故正确答案为D。","no":91,"missingImage":false},{"qid":"2264358","cat":"定义判断","stem":"诉前财产保全是指利害关系人因情况紧急，若不立即申请财产保全将会使其合法权益受到难以弥补的损害，起诉前向人民法院申请，由人民法院采取的一种财产保全措施。\n根据上述定义，下列不属于诉前财产保全的是：","options":{"A":"工厂甲向信用社乙贷款500万元，甲无法按期归还。乙随即起诉，审理期间得知甲已将设备转卖，遂请求法院查封甲正在出售的大楼","B":"甲与乙签订购销合同，甲给乙200万元预付款后，发现乙有欺诈行为，无力履行合同，遂请求人民法院冻结200万元预付款","C":"银行甲与公司乙签订协议，甲向乙提供5000万元贷款，分3期还清，第一笔到期时乙无力归还，甲向法院申请查封乙的财产","D":"甲欠乙10万元，乙多次找甲还钱未果，得知甲有一辆轿车，乙向法院申请将甲的轿车予以查封，再将甲告上法庭"},"answer":"A","explanation":"第一步：找出定义关键词。\n“因情况紧急，若不立即申请财产保全将会使其合法权益受到难以弥补的损害”、“起诉前向人民法院申请，由人民法院采取的一种财产保全措施”。\n第二步：逐一分析选项。\nA项：乙是在起诉审理期间要求法院查封甲正在出售的大楼，不符合在“起诉前向人民法院申请，由人民法院采取的一种财产保全措施”，不符合定义，当选；\nB项：甲在给乙预付款之后，发现乙有欺诈行为，无力履行合同，此时甲如果不及时申请财产保全，有可能无法追回这一预付款，所以符合“因情况紧急，若不立即申请财产保全将会使其合法权益受到难以弥补的损害”，而后甲请求法院冻结这一预付款，符合“起诉前向人民法院申请，由人民法院采取的一种财产保全措施”，符合定义，排除；\nC项：甲与乙签订贷款协议，乙在第一笔到期时无力还款，此时甲如果不及时申请财产保全，有可能无法收回这笔贷款，所以符合“因情况紧急，若不立即申请财产保全将会使其合法权益受到难以弥补的损害”，甲请求法院查封乙的财产，符合“起诉前向人民法院申请，由人民法院采取的一种财产保全措施”，符合定义，排除；\nD项：乙多次找甲还钱未果，此时乙如果不及时申请财产保全，有可能无法追回这一欠款，所以符合“因情况紧急，若不立即申请财产保全将会使其合法权益受到难以弥补的损害”，乙向法院申请把甲的轿车予以查封，然后再把甲告上法庭，符合“起诉前向人民法院申请，由人民法院采取的一种财产保全措施”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":92,"missingImage":false},{"qid":"2264360","cat":"定义判断","stem":"员工帮助计划是由企业为员工设置的一套长期的、系统的福利项目，通过专业人员对员工及其直系亲属提供专业指导和咨询，旨在帮助解决员工及其家庭成员的各种心理和行为问题，提高员工在企业中的工作绩效。\n根据上述定义，下列属于员工帮助计划的是：","options":{"A":"项目经理小祁的父亲最近去世了，小祁很悲痛，工作效率受到很大影响，总经理特批了一笔慰问款","B":"司机小方驾车外出工作期间交通肇事致人死亡，公司聘请律师为小方做从轻处罚的辩护，最终小方获刑三年","C":"会计师老王的儿子没有考上大学，老王夫妇很烦恼，互相指责。在公司心理专员的指导下，老王改善了与妻子的沟通方式，情绪逐渐好转","D":"职员小欣情绪低落，有自杀的念头，经医院诊断为重度抑郁症，需住院治疗。公司启动援助机制，为小欣支付了住院费用"},"answer":"C","explanation":"第一步：找出定义关键词。\n“由企业为员工设置的一套长期的、系统的福利项目”、“通过专业人员对员工及其直系亲属提供专业指导和咨询”、“旨在帮助解决员工及其家庭成员的各种心理和行为问题，提高员工在企业中的工作绩效”。\n第二步：逐一分析选项。\nA项：总经理特批的慰问款是专门针对小祁父亲去世这件事所一次性发放的，不符合“由企业为员工设置的一套长期的、系统的福利项目”，而且总经理特批发钱这一慰问方式也不符合“通过专业人员对员工及其直系亲属提供专业指导和咨询”，不符合定义，排除；\nB项：公司聘请律师为小方做从轻处罚的辩护，不符合“旨在帮助解决员工及其家庭成员的各种心理和行为问题”，不符合定义，排除；\nC项：公司设有心理专员这一岗位，说明这是“由企业为员工设置的一套长期的、系统的福利项目”，公司心理专员给予老王夫妇以指导，符合“通过专业人员对员工及其直系亲属提供专业指导和咨询”，最终老王改善了与妻子的沟通方式，情绪逐渐好转，也符合“旨在帮助解决员工及其家庭成员的各种心理和行为问题，提高员工在企业中的工作绩效”，符合定义，当选；\nD项：公司启动援助机制，为患有重度抑郁症的职员小欣支付住院费用，只是在用钱来帮助小欣，并没有“通过专业人员对员工及其直系亲属提供专业指导和咨询”，不符合定义，排除。\n故正确答案为C。","no":93,"missingImage":false},{"qid":"2264363","cat":"定义判断","stem":"沟通网络是信息沟通的结构形式。常见的沟通网络有四种形式：在轮式网络中，一个下级同时与多个主管联系，但主管之间没有沟通的情形。在Y式网络中，第二级有两个上级与之联系，第三级与一个或更多下级发生联系。在环式网络中，每个成员仅与相邻者联系，而不能与更远的成员进行沟通。在全通道式网络中，所有成员间充分进行沟通，所有成员的地位是平等的，无核心人物。\n根据上述定义，下列图形反映了轮式网络特点的是：\n\u003cimg data-k=\"fbb636a4cfc4\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"第一步：找出定义关键词。\n轮式网络：“一个下级同时与多个主管联系”、“主管之间没有沟通的情形”；\nY式网络：“第二级有两个上级与之联系”、“第三级与一个或更多下级发生联系”；\n环式网络：“每个成员仅与相邻者联系”、“不能与更远的成员进行沟通”；\n全通道式网络：“所有成员间充分进行沟通”、“所有成员的地位是平等的，无核心人物”。\n第二步：逐一分析选项。\nA项：每个字符只与其相邻的两个字符间有联系，与其他不相邻的没有联系，符合“每个成员仅与相邻者联系”、“不能与更远的成员进行沟通”，符合“环式网络”定义，不符合“轮式网络”定义，排除；\nB项：每个字符与其他所有字符都有联系，而且无核心字符，符合“所有成员间充分进行沟通”、“所有成员的地位是平等的，无核心人物”，符合“全通道式网络”定义，不符合“轮式网络”定义，排除；\nC项：字符C分别与两个上级字符A、B以及一个下级字符D有联系，符合“第二级有两个上级与之联系”、“第三级与一个或更多下级发生联系”，符合“Y式网络”定义，不符合“轮式网络”定义，排除；\nD项：字符C作为下属时，分别与多个主管字符A、B、D、E有联系，但是主管字符A、B、D、E之间没有联系，符合“一个下级同时与多个主管联系”、“主管之间没有沟通的情形”，符合“轮式网络”定义，当选。\n故正确答案为D。","no":94,"missingImage":false},{"qid":"2264367","cat":"定义判断","stem":"变文和连文是古汉语中常用的修辞方法。变文是指为了避重而在相临近的句子中采用同义词来表达相同的意义。连文是指本来要表达甲，而连带说到乙，使两个相关联的词连在一起，但突出表达其中一个词的意义。\n根据上述定义，下列使用了连文这一修辞方法的是：","options":{"A":"《史记·淮阴侯列传》：“置之死地而后生，置之亡地而后存。”","B":"《易经·系辞上传》：“鼓之以雷霆，润之以风雨。”","C":"诸葛亮《出师表》：“受任于败军之际，奉命于危难之间。”","D":"贾谊《过秦论》：“南取汉中，西举巴蜀，东割膏腴之地，北收要害之郡。”"},"answer":"B","explanation":"第一步：找出定义关键词。\n变文：“为了避重而在相临近的句子中采用同义词来表达相同的意义”；\n连文：“本来要表达甲，而连带说到乙，使两个相关联的词连在一起”、“突出表达其中一个词的意义”。\n第二步：逐一分析选项。\nA项：“置之死地而后生，置之亡地而后存”意思是，军队士兵在可能战死的境地，会奋勇前进，杀敌取胜，在可能灭亡的境地，会战胜生存下来，不符合“本来要表达甲，而连带说到乙，使两个相关联的词连在一起”、“突出表达其中一个词的意义”，不符合“连文”定义，排除；\nB项：“鼓之以雷霆，润之以风雨”意思是，用雷霆来鼓荡它，用风雨来滋润它，其中润是用来描述雨的特点，但在表达雨的同时谈到了相关联的风，其中突出表达的是雨水的滋润，符合“本来要表达甲，而连带说到乙，使两个相关联的词连在一起”、“突出表达其中一个词的意义”，符合“连文”定义，当选；\nC项：“受任于败军之际，奉命于危难之间”意思是，在兵败的时候接受任务，在危机患难之间奉行使命，只表达了一个意思，没有侧重要突出的，不符合“本来要表达甲，而连带说到乙，使两个相关联的词连在一起”、“突出表达其中一个词的意义”，不符合“连文”定义，排除；\nD项：“南取汉中，西举巴蜀，东割膏腴之地，北收要害之郡”意思是，向南夺取汉中，向西攻取巴、蜀，向东割取肥沃的地区，向北占领非常重要的地区，指要攻占东南西北四方的领土，不符合“本来要表达甲，而连带说到乙，使两个相关联的词连在一起”、“突出表达其中一个词的意义”，不符合“连文”定义，排除。\n故正确答案为B。","no":95,"missingImage":false},{"qid":"2264335","cat":"类比推理","stem":"分母：除数","options":{"A":"内角：外角","B":"加减法：乘除法","C":"横坐标：纵坐标","D":"百分比：百分率"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n分母是分数式中写在横线下面的数、字母或代数式，除数是在除法算式中，除号后面的数。分母也叫除数，二者是全同关系。\n第二步：判断选项词语间逻辑关系。\nA项：内角指的是多边形相邻的两边组成的角，外角指的是多边形中一条边与另一条边的延长线组成的角，二者不是全同关系，与题干逻辑关系不一致，排除；\nB项：加减法和乘除法，分别是不同的运算法则，二者是并列关系，不是全同关系，与题干逻辑关系不一致，排除；\nC项：横坐标也叫X坐标，纵坐标也叫Y坐标，二者构成笛卡尔坐标系（直角坐标系）以表示函数的图像，二者不是全同关系，与题干逻辑关系不一致，排除；\nD项：百分数也叫做百分率或百分比，是一种表达比例、比率或分数数值的方法，二者是全同关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":96,"missingImage":false},{"qid":"2264350","cat":"类比推理","stem":"直线交叉：直线不平行","options":{"A":"\u003cimg data-k=\"3365e4cee3aa\">","B":"100\u003cimg data-k=\"a4f8cb3af98a\">：沸腾","C":"\u003cimg data-k=\"e3442cca8590\">：臭氧","D":"\u003cimg data-k=\"adad1f65c6e1\">：圆面积"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n两条直线只要交叉，则一定不平行，前者是后者的充分条件。\n注：直线间除了在同一平面内存在交叉和平行关系，还可以在不同平面内存在不交叉、不平行的关系，所以题干二者不是全同关系。\n第二步：判断选项词语间逻辑关系。\nA项： 只要x大于1，则x的平方一定大于1，前者是后者的充分条件，与题干逻辑关系一致，当选；\nB项：液体并非只要达到100\u003cimg data-k=\"a4f8cb3af98a\">，一定会沸腾，不同液体的沸点并不一定相同，前者不是后者的充分条件，与题干逻辑关系不一致，排除；\nC项：臭氧是地球大气中的一种微量气体，含有3个氧原子，\u003cimg data-k=\"e3442cca8590\">是臭氧的化学式表示，二者是全同关系，与题干逻辑关系不一致，排除；\nD项：圆面积公式等于半径平方与圆周率的乘积，用字母可以表示为：\u003cimg data-k=\"2b3ce65a7ebc\">，前者不是后者的充分条件，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":97,"missingImage":false},{"qid":"2264354","cat":"类比推理","stem":"刻舟：求剑","options":{"A":"里应：外合","B":"掩耳：盗铃","C":"打草：惊蛇","D":"指桑：骂槐"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n刻舟求剑是指办事刻板，没用发展的眼光看问题，其中刻舟是求剑的方式，求剑是刻舟的目的。\n第二步：判断选项词语间逻辑关系。\nA项：里应是指里面接应，外合是指外面攻打，里应和外合是并列关系，与题干逻辑关系不一致，排除；\nB项：掩耳盗铃是指把耳朵捂住偷铃铛，以为自己听不见别人也会听不见，比喻自欺欺人。其中掩耳是盗铃的方式，盗铃是掩耳的目的，与题干逻辑关系一致，保留；\nC项：打草惊蛇是指做事不周密，行动不谨慎，不慎惊动了对方，“打草”的本意不是“惊蛇”，与题干逻辑关系不一致，排除；（打草惊蛇还有一种解释为，打草是为了惊蛇，如果按这个意思理解可以做保留）\nD项：指桑骂槐是比喻表面上骂这个人，实际上是骂那个人，指桑是骂槐的方式，骂槐是目的，与题干逻辑关系一致，保留。\n比较B、C、D，题干刻舟求剑是说方法错误，达不到求剑的目的。而打草惊蛇与指桑骂槐都能达到目的，掩耳盗铃也是强调方法错误达不到目的，因此B选项与题干更一致。\n故正确答案为B。","no":98,"missingImage":false},{"qid":"2264357","cat":"类比推理","stem":"马蹄莲：蟹爪兰","options":{"A":"牵牛花：美人蕉","B":"卷心菜：夜来香","C":"灯笼椒：金针菇","D":"佛手柑：含羞草"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n马蹄莲的形状像马蹄，蟹爪兰的形状像蟹爪，二者是根据外形来命名的两种植物。\n第二步：判断选项词语间逻辑关系。\nA项：牵牛花因其形似喇叭，所以也叫喇叭花，所以喇叭花是以植物外形来命名的，而牵牛花是它的别称，并不是以植物外形来命名的；美人蕉因其花开的美艳而得名，并不是以植物外形来命名的，与题干逻辑关系不一致，排除；\nB项：卷心菜是以植物外形来命名的，但夜来香因夜晚有特殊的芳香而命名，不是以植物外形来命名的，与题干逻辑关系不一致，排除；\nC项：灯笼椒的形状像灯笼，金针菇的形状像针一样，二者是以外形来命名的两种蔬菜，与题干逻辑关系一致，当选；\nD项：佛手柑是以植物外形来命名的，但含羞草是因为它的叶子一经触碰就自动卷起来，像害羞一样，并不是以植物外形来命名的，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":99,"missingImage":false},{"qid":"2264359","cat":"类比推理","stem":"金库：现钞：保管","options":{"A":"网球场：球迷：观看","B":"电缆车：景区：观光","C":"录音棚：专辑：播放","D":"美术馆：字画：陈列"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n金库是用来保管现钞的地点，三者为对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：网球场是用来观看球赛的地点，不是观看球迷的地点，与题干逻辑关系不一致，排除；\nB项：电缆车是用来观光景区的交通工具，不是地点，与题干逻辑关系不一致，排除；\nC项：录音棚是用来录制专辑的地点，不是播放专辑的地点，与题干逻辑关系不一致，排除；\nD项：美术馆是用来陈列字画的地点，三者为对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":100,"missingImage":false},{"qid":"2264361","cat":"类比推理","stem":"山洪：村民：士兵","options":{"A":"狂风：雷电：灯塔","B":"事故：伤员：医生","C":"海啸：船舶：渔民","D":"婚礼：新人：主持"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n山洪是灾难事件，村民是山洪的受害者，士兵是村民的救助者，村民和士兵是被救助与救助的关系。\n第二步：判断选项词语间逻辑关系。\nA项：狂风和雷电是两种不同的天气现象，是并列关系，灯塔是用以指引船只方向的建筑物，与狂风和雷电无必然联系，与题干逻辑关系不一致，排除；\nB项：事故是灾难事件，伤员是事故的受害者，医生是伤员的救助者，伤员和医生是被救助与救助的关系，与题干逻辑关系一致，当选；\nC项：海啸是灾难事件，船舶是渔民的工具，二者不是被救助与救助的关系，与题干逻辑关系不一致，排除；\nD项：婚礼不是灾难事件，新人与主持不是被救助与救助的关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":101,"missingImage":false},{"qid":"2264362","cat":"类比推理","stem":"病毒：传染病：流行性","options":{"A":"毒驾：车祸：危害性","B":"市场：交易：自发性","C":"噪声：听力损伤：普遍性","D":"甜食：肥胖症：突发性"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n病毒可能会导致传染病，二者为因果的对应关系，且传染病一定具有流行性，二者为必然属性的对应关系。\n注：传染病一定是“可以流行”的，只不过“可以流行”并不意味着传染病一定会“流行开来”。因此，传染病一定具备“流行性”的属性，只是不一定会造成“流行开来”这样的结果而已，所以二者是必然属性对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：毒驾可能会导致车祸，二者为因果的对应关系，且车祸一定具有危害性，二者为必然属性的对应关系，与题干逻辑关系一致，当选；\nB项：市场不会导致交易，二者不是因果的对应关系，与题干逻辑关系不一致，排除；\nC项：噪声可能会导致听力损伤，二者为因果的对应关系，但普遍性不是听力损伤的必然属性，与题干逻辑关系不一致，排除；\nD项：甜食可能会导致肥胖症，二者为因果的对应关系，但突发性不是肥胖症的属性，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":102,"missingImage":false},{"qid":"2264365","cat":"类比推理","stem":"微量元素：稀有金属：铜","options":{"A":"木本植物：草本植物：松树","B":"海洋动物：哺乳动物：北极熊","C":"内陆湖：淡水湖：青海湖","D":"节肢动物：两栖动物：鳄鱼"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n微量元素是指人体中含量小于\u003cimg data-k=\"3f1d2985ebad\">的元素，稀有金属是指在自然界中含量较少或分布稀散的金属，故二者为交叉关系；铜是微量元素，二者为种属关系，且铜不是稀有金属。\n第二步：判断选项词语间逻辑关系。\nA项：木本植物和草本植物都是植物的一种，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：海洋动物和哺乳动物为交叉关系，但北极熊是哺乳动物，不是海洋动物，与题干逻辑关系不一致，排除；\nC项：内陆湖和淡水湖为交叉关系，青海湖是内陆湖，二者为种属关系，且青海湖不属于淡水湖，与题干逻辑关系一致，当选；\nD项：节肢动物属于无脊椎动物，两栖动物属于脊椎动物，二者不是交叉关系，且鳄鱼不属于节肢动物，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":103,"missingImage":false},{"qid":"2264366","cat":"类比推理","stem":"莲蓬 对于（  ）相当于（  ）对于 葛根","options":{"A":"荷叶；葛藤","B":"荷花；葛粉","C":"喜爱；纠缠","D":"荷塘；山岗"},"answer":"A","explanation":"逐一代入选项。\nA项：莲蓬与荷叶都是荷花的组成部分，葛藤与葛根都是野葛的组成部分，二者均为并列关系，前后逻辑关系一致，当选；\nB项：莲蓬是荷花的组成部分，二者为组成关系；葛根是葛粉的原材料，二者为原材料的对应关系，前后逻辑关系不一致，排除；\nC项：喜爱莲蓬，二者为动宾关系；纠缠和葛根不是动宾关系，且前后顺序相反，前后逻辑关系不一致，排除；\nD项：荷塘里有莲蓬，山岗里有葛根，二者均为地点的对应关系，但前后顺序相反，前后逻辑关系不一致，排除。\n故正确答案为A。","no":104,"missingImage":false},{"qid":"2264368","cat":"类比推理","stem":"立案 对于（  ）相当于（  ）对于 判决","options":{"A":"起诉；服刑","B":"审理；质证","C":"犯罪；调解","D":"罚款；执行"},"answer":"B","explanation":"A项：在刑事诉讼中可以先“立案”后“起诉”，在民事诉讼中可以先“起诉”后“立案”，二者没有必然的时间先后顺序，而服刑在判决之后，前后逻辑关系不一致，排除；\nB项：先立案后审理，先质证后判决，二者均为先后顺序的对应关系，前后逻辑关系一致，当选；\nC项：先犯罪后立案，二者为先后顺序的对应关系；调解和判决没有必然联系，前后逻辑关系不一致，排除；\nD项：立案与罚款没有必然联系；先判决后执行，二者为先后顺序的对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":105,"missingImage":false},{"qid":"2264332","cat":"逻辑判断","stem":"一般来说，塑料极难被分解，即使是较小的碎片也很难被生态系统降解，因此它造成的环境破坏十分严重。近期科学家发现，一种被称为蜡虫的昆虫能够降解聚乙烯，而且速度极快。如果使用生物技术复制蜡虫降解聚乙烯，将能够帮助我们有效清理垃圾填埋厂和海洋中累积的塑料垃圾。\n以下哪项如果为真，不能支持上述结论？","options":{"A":"世界各地的塑料垃圾的主要成分是聚乙烯","B":"蜡虫的确能够破坏聚乙烯塑料的高分子链","C":"聚乙烯被蜡虫降解后的物质对环境的影响尚不明确","D":"现有科技手段能够将蜡虫降解聚乙烯的酶纯化出来"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点： 如果使用生物技术复制蜡虫降解聚乙烯，将能够帮助我们有效清理垃圾填埋厂和海洋中累积的塑料垃圾。\n论据： 近期科学家发现，一种被称为蜡虫的昆虫能够降解聚乙烯，而且速度极快。\n第二步：逐一分析选项。\nA项：题干说蜡虫能够分解聚乙烯，这样就能解决世界上的塑料垃圾，该项说明世界各地的塑料垃圾的主要成分是聚乙烯，是论点成立的必要条件，可以加强，排除；\nB项：该项说明昆虫能够破坏聚乙烯的高分子链，说明昆虫确实能够破解聚乙烯，从而帮助我们清理塑料垃圾，属于补充论据，可以加强，排除；\nC项：该项说明聚乙烯被蜡虫分解后的物质对环境的影响尚不明确，即能不能解决塑料垃圾不清楚，属于不明确选项，无法加强，当选；\nD项： 现有科技手段能够将蜡虫降解聚乙烯的酶纯化出来，说明我们能够通过生物技术复制蜡虫降解聚乙烯，是论点成立的必要条件，可以加强，排除。\n本题为选非题，故正确答案为C。","no":106,"missingImage":false},{"qid":"2264333","cat":"逻辑判断","stem":"所有的幼儿园都面临同一个问题：就是对于那些在幼儿园放学之后不能及时来接孩子的家长，幼儿园老师除了等待别无他法，因此许多幼儿园都向晚接孩子的家长收取费用。然而，有调查显示，收取费用后晚接孩子的家长数量并未因此减少，反而增加了。\n以下哪项如果为真，最能解释上述调查结果？","options":{"A":"收费标准太低，对原本经常晚来接孩子的家长没有太大的约束力","B":"有个别家长对收费行为不满，有时会故意以晚接孩子的行为来抗议","C":"有些家长因工作忙碌，常常不能及时来接孩子","D":"收费后，更多的家长认为即使晚来接孩子也不必愧疚，只要付费即可"},"answer":"D","explanation":"第一步：找出题干矛盾。\n通过收取费用的方式让家长早接孩子，但是收费后晚接孩子的家长数量不减反增。\n第二步：逐一分析选项。\nA项：收费低对原本晚接孩子的家长无影响，可以解释为什么人数没有减少，但是无法解释为什么人数增加，不能解释题干矛盾，排除；\nB项：该项说的是个别家长抗议收费而晚来接孩子，但是无法解释清楚为什么晚接孩子的家长数增加了，不能解释题干矛盾，排除；\nC项：该项解释了家长晚来接孩子的原因，与题干幼儿园收费无关，不能解释题干矛盾，排除；\nD项：该项说明幼儿园对晚接孩子进行收费后，将这种行为合理化，更多的家长心安理得的晚来接孩子，可以解释为什么晚接孩子的人不减反增，当选。\n故正确答案为D。","no":107,"missingImage":false},{"qid":"2264334","cat":"逻辑判断","stem":"应激本身没有致痛能力，但是流行病学调查发现，长期应激与疼痛慢性化的发生正相关，即长期处于巨大压力下的人群，其疼痛症状更易迁延，进而发展为慢性疼痛。\n以下哪项如果为真，最能支持上述调查结果？","options":{"A":"具有焦虑倾向的人，其应激水平往往较高，疼痛慢性化的发生率也会更高","B":"长期应激可影响神经内分泌系统，使人的疼痛抑制系统的功能被削弱","C":"吸烟使人体神经内分泌系统发生紊乱，对疼痛感知的影响与应激相似","D":"如果能有效缓解应激，保持心态平和，疼痛慢性化的发生率将会降低\u003cimg data-k=\"e172e0ad0a10\">"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：长期处于巨大压力下的人群，其疼痛症状更易迁延，进而发展为慢性疼痛。\n论据：无。\n本题只有论点没有论据，加强优先考虑补充论据，即解释原因或举例加强。\n第二步：逐一分析选项。\nA项：该项指出，具有焦虑倾向的人，其应激水平高，疼痛慢性化发生率也会高，举例子补充论据，可以加强，保留；\nB项：长期应激会影响神经内分泌系统，进而削弱疼痛抑制系统，所以发展为慢性疼痛，解释原因补充论据，可以加强，保留；\nC项：该项说吸烟对疼痛感知的影响和应激相似，不能说明应激与疼痛慢性化的关系，无法加强，排除；\nD项：该项指出如果缓解应激后，疼痛慢性化的发生率会下降，举反面例子补充论据，可以加强，保留。\n对比A、B、D三项，B项解释原因力度大于A、D两项的举例子。\n故正确答案为B。","no":108,"missingImage":false},{"qid":"2264336","cat":"逻辑判断","stem":"自从前年甲航运公司实行了经理任期目标责任制之后，公司的经济效益也随之逐年上升。可见，只有实行经理任期目标责任制，才能使甲公司经济效益稳步增长。\n以下哪项如果为真，最能削弱上述论证？","options":{"A":"近两年国家经济发展速度较快，航运行业的整体形势大好","B":"没实行任期目标责任制的乙航运公司，近两年的经济效益也稳步增长","C":"前年甲公司开始实行职工薪酬管理制度改革，极大地调动了公司员工的积极性","D":"如果甲航运公司没有实行任期目标责任制，近两年的经济效益会增长得更快"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：只有实行经理任期目标责任制，才能使甲公司经济效益稳步增长。\n论据：甲航运公司实行了经理任期目标责任制之后，公司的经济效益也随之逐年上升。\n论点和论据均在讨论“实行经理任期目标责任制”和“经济效益增长”的关系，话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出可能是因为整个航运行业整体形势好，使得甲公司经济效益增长，是他因削弱，可以削弱，保留；\nB项：该项讨论的是“乙航运公司”，与题干讨论的甲航运公司无关，无关选项，无法削弱，排除；\nC项：该项指出前年甲公司也实行了职工薪酬管理制度改革，调动了公司员工积极性，可能是因为员工积极性高了，使得甲公司经济效益增长，是他因削弱，可以削弱，保留；\nD项：如果甲航运公司没有实行任期目标责任制，近两年的经济效益会增长得更快，说明实行经理任期目标责任制反而限制了甲公司经济效益稳步增长，直接削弱论点，保留。\n对比A、C、D三项，D项削弱论点力度最强，大于A、C两项的他因削弱。\n故正确答案为D。","no":109,"missingImage":false},{"qid":"2264338","cat":"逻辑判断","stem":"所有的地震都是以P波开始的，这些P波移动快速，使地面发生上下震动，造成的破坏较小。下一个是S波，它的移动很慢，使地面前后、左右晃动，破坏性极大。早期预警系统通过测量P波沿地面移动的情况，来预测S波所造成的影响，然后发出警报。然而，从事此类系统工作的科学家们发现，事实上人们并没有多少时间为大地震做好准备。\n要得到上述结论，需要补充的最重要前提是：","options":{"A":"地球上每年大约发生500多万次地震，绝大多数的地震人们根本感觉不到","B":"根据历年大地震的记载，强震大多在夜里瞬间发生，无法在短时间内组织有效的防御行动","C":"地震越大，P波与S波之间的间隔越短，留给人们预警的时间不多","D":"发生较大地震时，人们先感到上下颠簸，而后才有很强的水平晃动，这种晃动是由S波造成的"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：事实上人们并没有多少时间为大地震做好准备。\n论据：无。\n第二步：逐一分析选项。\nA项：论点说的是没有时间为大地震做好准备，该项说的是地震发生的次数和人们的感觉，话题不一致，无法加强，排除； \nB项：根据历年大地震的记载，强地震大多在夜里瞬间发生，无法在短时间内有效防御，这是在列举历年地震的情况，举例加强，但不是论点成立最重要的前提，排除； \nC项：地震越大，P波与S波之间的间隔越短，指出留给人们预警的时间就越短，说明人们并没 <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){
  var base=(window.__EXAM__&&window.__EXAM__.imgBase)||"";
  return base+((window.__IMGS__ && window.__IMGS__[k]) || "");
}
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
