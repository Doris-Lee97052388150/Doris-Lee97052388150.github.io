<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

<div class="topbar">

    <div class="spacer"></div>

</div>

<div class="mask" id="mask">

</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2019-新疆-兵团","title":"2019年新疆生产建设兵团面向社会招录公务员考试《行测》题（网友回忆版）","year":"2019","group":"新疆","modules":[{"label":"常识判断","items":[{"type":"question","qid":"2434210","cat":"人文常识","stem":"下列属于平安中国建设举措的是（    ）。","options":{"A":"中国海军在亚丁湾护航","B":"开展区域医疗中心建设试点","C":"推广依靠群众就地化解矛盾的“枫桥经验”","D":"划定并严守生态保护红线，维护国家生态安全"},"answer":"C","explanation":"本题考查政治，党的十九大报告指出：“建设平安中国，加强和创新社会治理，维护社会和谐稳定，确保国家长治久安，人民安居乐业。”因此加强平安中国建设属于社会治理的措施。\nA选项错误，中国海军在亚丁湾护航，是从2008年底开始的一项军事行动。\nB选项错误，开展区域医疗中心建设试点推动了优质医疗资源集团化发展，更好地满足了群众医疗服务需求，属于医疗建设。\nC选项正确，推广依靠群众就地化解矛盾的“枫桥经验”属于平安中国建设举措。\nD选项错误，划定并严守生态保护红线，维护国家生态安全，属于生态文明建设。\n故正确答案为C。","no":1,"missingImage":false},{"type":"question","qid":"2434221","cat":"人文常识","stem":"下列不属于党的十八大以来全面深化改革举措的是（    ）。","options":{"A":"《推进三网融合的总体方案》","B":"《中国足球改革发展总体方案》","C":"《国家科技伦理委员会组建方案》","D":"《长城、大运河、长征国家文化公园建设方案》"},"answer":"A","explanation":"本题考查政治，党的十八大于2012年11月在北京人民大会堂举行。\nA选项错误，2010年1月，国务院颁布《推进三网融合的总体方案》。\nB选项正确，2015年2月27日，在中央全面深化改革领导小组第十次会议上，审议通过了《中国足球改革发展总体方案》。\nC选项正确，2019年7月24日，中央全面深化改革委员会第九次会议审议通过了《国家科技伦理委员会组建方案》。\nD选项正确，2019年7月24日，中央全面深化改革委员会第九次会议审议通过了《长城、大运河、长征国家文化公园建设方案》。\n本题为选非题，故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"2434225","cat":"法律常识","stem":"下列属于法治社会建设内容的是（    ）。","options":{"A":"人民法院巡回法庭在农村事发地公开审理民事纠纷案件","B":"村民、社区居民依法选举村民委员会、社区居民委员会成员","C":"把公众参与、专家论证、风险评估等作为重大决策的必经程序","D":"凡是不涉及国家秘密、商业秘密和个人隐私的政府信息都要向社会公开"},"answer":"B","explanation":"本题考查法律。当前，法治建设在整体上取得了巨大进步。习近平总书记强调，全面推进依法治国，要坚持依法治国、依法执政、依法行政共同推进，坚持法治国家、法治政府、法治社会一体建设。这指明了法治社会建设在全面推进依法治国中的重要地位和作用，丰富和发展了马克思主义法学思想和中国特色社会主义法治理论。法治社会一般具有以下基本特征：全社会对法治普遍信仰；宪法和法律得到有效实施和普遍遵从；社会依法规范运行；公平正义得到切实维护和实现；权利救济及时充分。\nA项错误，利用人民法院巡回法庭在农村公开审理案件属于依法治国的内容。这能够使很多复杂案件在地方得到处理，让审判重心下移到基层，给法官更加充分的时间调查案件，有利于做出公正的判决。巡回法庭是对依法治国理念的践行之举。\nB项正确，保证基层依法选举，属于社区基层群众的民主自治，是法治社会建设的重要内容，依靠法律来规范社会行为，协调社会关系，努力将各项社会治理活动纳入法治轨道。\nC项错误，公众参与、专家论证、风险评估等作为重大决策的必经程序属于法治政府建设的内容。法治政府建设要全面推进依法行政，不断提高政府公信力和执行力，为保障经济又好又快发展和社会和谐稳定发挥更大的作用。\nD项错误，凡是不涉及国家秘密、商业秘密和个人隐私的政府信息都要向社会公开属于政府信息公开的内容，也是依法行政的重要组成部分，行政机关是实施法律法规的重要主体，要带头严格执法，维护公共利益、人民权益和社会秩序。\n故正确答案为B。","no":3,"missingImage":false},{"type":"question","qid":"2434231","cat":"法律常识","stem":"根据我国宪法，下列说法错误的是（    ）。","options":{"A":"中国特色社会主义最本质的特征是中国共产党的领导","B":"县级以上地方人民代表大会常务委员会的成员不能担任国家行政机关的职务","C":"监察委员会依照法律规定独立行使监察权，不受行政机关、个人的干涉","D":"县级以上地方各级人民政府可依法管理本行政区域内的监察工作"},"answer":"D","explanation":"本题考查法律。\nA项正确，根据《宪法》第一条第二款规定：“社会主义制度是中华人民共和国的根本制度。中国共产党领导是中国特色社会主义最本质的特征。禁止任何组织或者个人破坏社会主义制度。”\nB项正确，根据《宪法》第一百零三条第三款规定：“县级以上的地方各级人民代表大会常务委员会的组成人员不得担任国家行政机关、监察机关、审判机关和检察机关的职务。”\nC项正确，根据《宪法》第一百二十七条第一款规定：“监察委员会依照法律规定独立行使监察权，不受行政机关、社会团体和个人的干涉。”\nD 项错误，根据《宪法》第一百二十六条规定：“国家监察委员会对全国人民代表大会和全国人民代表大会常务委员会负责。地方各级监察委员会对产生它的国家权力机关和上一级监察委员会负责。”因此，监察委员会对产生它的国家权力机关和上一级监察委员会负责。\n本题为选非题，故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"2434235","cat":"法律常识","stem":"下列不属于我国《监察法》所列明的监察机关职责的是（    ）。","options":{"A":"调查犯罪","B":"追究刑责","C":"处置移送","D":"监督教育"},"answer":"B","explanation":"本题考查法律常识。《中华人民共和国监察法》第十一条规定，监察委员会依照本法和有关法律规定履行监督、调查、处置职责：（一）对公职人员开展廉政教育，对其依法履职、秉公用权、廉洁从政从业以及道德操守情况进行监督检查；（二）对涉嫌贪污贿赂、滥用职权、玩忽职守、权力寻租、利益输送、徇私舞弊以及浪费国家资财等职务违法和职务犯罪进行调查；（三）对违法的公职人员依法作出政务处分决定；对履行职责不力、失职失责的领导人员进行问责；对涉嫌职务犯罪的，将调查结果移送人民检察院依法审查、提起公诉；向监察对象所在单位提出监察建议。\nA项正确，调查犯罪属于监察机关的职责。\nB项错误，追究刑事责任，只能由国家专门机关依照刑事法律的规定，按法定程序来进行。监察机关不追究刑事责任。\nC项正确，处置移送属于监察机关的职责。\nD项正确，监督教育属于监察机关的职责。\n本题为选非题，故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"2434240","cat":"法律常识","stem":"下列做法符合我国《劳动法》规定的是（    ）。","options":{"A":"12岁的小博在电脑方面天赋异禀，被一家IT公司破格录用","B":"小丹和公司签订劳动合同，合同中约定试用期为一年","C":"由于订单量激增，公司要求员工近两个月每周只能休息一天","D":"小林不能胜任单位安排的工作，单位直接解除了与小林的劳动合同"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，《劳动法》第十五条规定，禁止用人单位招用未满十六周岁的未成年人。 文艺、体育和特种工艺单位招用未满十六周岁的未成年人，必须遵守国家有关规定，并保障其接受义务教育的权利。\nB项错误，《劳动法》第二十一条规定，劳动合同可以约定试用期。试用期最长不得超过六个月。\nC项正确，《劳动法》第三十八条规定，用人单位应当保证劳动者每周至少休息一日。\nD项错误，《劳动法》第二十六条规定，有下列情形之一的，用人单位可以解除劳动合同，但是应当提前三十日以书面形式通知劳动者本人：（二）劳动者不能胜任工作，经过培训或者调整工作岗位，仍不能胜任工作的。小林不能胜任单位安排的工作，单位应该培训或者调整小林工作岗位，而不能直接解除劳动合同。\n故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"2434242","cat":"法律常识","stem":"关于犯罪主体，下列说法正确的是（    ）。","options":{"A":"15岁的小李绑架了一个“富二代”，小李应对其绑架行为承担刑事责任","B":"17岁的小涛不务正业，从事黑社会活动，对其罪行，可从轻或减轻处罚","C":"14岁的小峰醉酒后开其父的车不小心撞死一路人，小峰无需承担刑事责任","D":"76岁的老罗因赌博缺钱，趁邻居家没人时，入户盗窃，对其罪行，应当从轻或者减轻处罚"},"answer":"C","explanation":"本题考查法律常识。\n《中华人民共和国刑法》第十七条第二款规定：“已满十四周岁不满十六周岁的人，犯故意杀人、故意伤害致人重伤或死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任。”\nA项错误，绑架罪不在限制刑事责任能力人应负刑事责任的八种行为之内，小李为限制刑事责任能力人，不需要承担刑事责任。\nB项错误，《中华人民共和国刑法》第十七条第四款规定：“对依照前三款规定追究刑事责任的不满十八周岁的人，应当从轻或者减轻处罚。”选项中可以从轻或者减轻的说法错误。\nC项正确，14周岁的人对交通肇事罪无需承担刑事责任。\nD项错误，《中华人民共和国刑法》第十七条第四款规定“已满七十五周岁的人故意犯罪的，可以从轻或者减轻处罚；过失犯罪的，应当从轻或者减轻处罚。”老罗已满七十五周岁，是故意犯罪，可以从轻或者减轻处罚，所以“应当从轻或者减轻处罚”表述错误。\n故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"2434247","cat":"法律常识","stem":"甲经朋友介绍，与乙开发商签订商品房认购书一份，认购乙开发商开发的某小区某栋某单元某室商品房一套，以该套房屋开盘价的\u003cimg data-k=\"cd4db1324e77\">结算。此时乙开发商在该小区开发的商品房尚未取得房屋预售许可证。开盘后，乙开发商将该套房屋售予他人。甲得知后将乙开发商告上法庭。\n关于本案，下列说法正确的是（    ）。","options":{"A":"商品房认购书不具有法律效力，法院应驳回甲的起诉","B":"乙开发商违反预约合同应承担赔偿责任，法庭应判决乙开发商赔偿甲的机会损失","C":"开发商在未取得房屋预售许可证前与购房人签订的房屋认购书无效，法院应判决甲败诉","D":"开发商在未取得房屋预售许可证前与购房人签订的房屋认购书有效，法院应判决甲取得认购商品房所有权"},"answer":"B","explanation":"本题考查法律常识。\nA、C两项错误，B项正确，《民法典》第四百九十五条规定：“当事人约定在将来一定期限内订立合同的认购书、订购书、预订书等，构成预约合同。当事人一方不履行预约合同约定的订立合同义务的，对方可以请求其承担预约合同的违约责任。”甲与乙签订的认购书是预约合同，该认购书有法律效力，乙违反该认购书的约定将房屋售与他人，应承担违约责任，赔偿甲的损失。\nD项错误，《民法典》第二百零九条规定：“不动产物权的设立、变更、转让和消灭，经依法登记，发生效力；未经登记，不发生效力，但是法律另有规定的除外。依法属于国家所有的自然资源，所有权可以不登记。”商品房属于不动产，但该商品房并未登记在甲名下，甲不会取得该商品房的所有权。\n故正确答案为B。","no":8,"missingImage":false},{"type":"question","qid":"2434251","cat":"科技常识","stem":"关于生活中的化学知识，下列说法错误的是（    ）。","options":{"A":"飓风能引起海水燃烧","B":"少量水浇到燃烧的煤上火会更旺","C":"二氧化碳可以作制冷剂","D":"凡士林可从石油中直接获取"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，水在通电条件下或者高温下才分解，一阵飓风过后，产生巨大的能量使水分解生成氢气和氧气，引起氢气燃烧。\nB项正确，水在高温条件下与碳发生化学反应产生氢气和一氧化碳，这两种气体可以燃烧，所以会更旺。\nC项正确，固态二氧化碳俗称干冰，升华时可吸收大量热，因而用作制冷剂，如人工降雨，也常在舞美中用于制造烟雾。\nD项错误，凡士林是一种烷系烃或饱和烃类半液态的混合物，也叫矿脂，由石油分馏后制得。其状态在常温时介于固体及液体之间，因不同用途而有棕、黄、白三种颜色。天然凡士林取自烷属烃重油等石油残油浓缩物；人造凡士林则取自用纯地蜡或石蜡、石蜡脂使矿物油稠化的混合物。因此，凡士林不能从石油中直接获取。\n本题为选非题，故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"2434255","cat":"地理国情","stem":"关于地理分界线，下列说法正确的是（    ）。","options":{"A":"季风区与非季风区界线穿过太行山","B":"四川盆地和汉水谷地界线穿过巫山","C":"400毫米等降水量线穿过祁连山","D":"湿润区与半湿润区界线穿过秦岭"},"answer":"D","explanation":"本题考查地理国情。\nA项错误，我国季风区与非季风区的分界线是大兴安岭—阴山—贺兰山—巴颜喀拉山—冈底斯山。\nB项错误，四川盆地和汉水谷地界线为大巴山脉。\nC项错误，400mm等降水线也是季风区与非季风区的分界线，不穿过祁连山。\nD项正确，秦岭—淮河是湿润区与半湿润区的分界线。\n故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"2434258","cat":"人文常识","stem":"下列关于十大名曲的说法，正确的是（    ）。","options":{"A":"《高山流水》是一首琵琶曲","B":"《夕阳箫鼓》相传为蔡文姬所做","C":"《春江花月夜》是根据同名唐诗改编而来的","D":"《十面埋伏》演绎了楚汉战争垓下决战的情景"},"answer":"D","explanation":"本题考查人文常识。\nA项错误，《高山流水》是中国古琴曲，属于中国十大古曲之一。传说先秦的琴师俞伯牙一次在荒山野地弹琴，樵夫钟子期竟能领会这是描绘“峨峨兮若泰山”和“洋洋兮若江河”。伯牙惊道：“善哉，子之心而与吾心同。”钟子期死后，伯牙痛失知音，摔琴绝弦，终生不弹，故有高山流水之曲。“高山流水”比喻知己或知音，也比喻乐曲高妙。\nB项错误，《夕阳箫鼓》是一首琵琶曲，作者佚名。这是一首抒情写意的文曲，旋律雅致优美，左手多用推、拉、揉、吟等演奏技法，描绘出一幅清丽的山水画卷。\nC项错误，《春江花月夜》改编自《夕阳箫鼓》，是一首著名的琵琶曲，写的是浔阳（今江西九江）江上月夜，歌颂祖国山河之壮美，表现人民热爱祖国之情，意境深远，乐音悠长。\nD项正确，《十面埋伏》是一首历史题材的大型琵琶曲，描写公元前202年楚汉战争垓下决战的情景。汉军用十面埋伏的阵法击败楚军，项羽自刎于乌江，刘邦取得胜利。\n故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"2434259","cat":"人文常识","stem":"下列体育领域与专业术语对应错误的是（  ）。","options":{"A":"足球——交叉进攻","B":"篮球——错位防守","C":"排球——短平快球","D":"乒乓球——左右半区"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，交叉进攻是排球运动战术之一，是快球掩护下运用的进攻战术。是指两名队员跑动时交叉跑动，起到互相掩护的作用，造成局部区域以多打少的局面。\nB项正确，错位防守是篮球战术之一，是指防守人站位在自己所防守的进攻人身侧，阻挠对方接球。\nC项正确，短平快是排球运动快球的一种。一般指二传手正面传出速度快、弧度平的球的同时，扣球手在距其2米左右处跳起，挥臂截击二传手平拉过来的球。\nD项正确，乒乓球双打时，球台中间有一条白线将球台划分为左右半区。\n本题为选非题，故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"2434261","cat":"人文常识","stem":"下列谚语及其解释对应正确的是（    ）。","options":{"A":"下雪不冷，化雪冷——凝华放热，液化吸热","B":"雷雨发庄稼——放电环境下会生成氮肥","C":"真金不怕火炼——金具有硬度大的性质","D":"酒香不怕巷子深——分子之间存在斥力"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，下雪是水蒸气的凝华过程，凝华放热，人感觉不冷；而化雪是熔化过程，熔化吸热，导致环境温度降低，人感觉冷。选项中“液化”表述有误。\nB项正确，放电环境下，空气中的氮气与氧气反应生成一氧化氮，一氧化氮又与氧气反应生成二氧化氮。二氧化氮易溶于水生成硝酸随雨水落到土壤中，同土壤中矿物相互作用，生成易被农作物吸收的硝酸盐。硝酸盐属于氮肥，因而有“雷雨发庄稼”的说法。\nC项错误，“真金不怕火炼”是指金的熔点高于一般炉火火焰的温度，与硬度无关。\nD项错误，“酒香不怕巷子深”是因为酒香味分子在不停地运动到空气中，所以很远的地方都能闻到酒香，体现了分子的无规则运动。\n故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"2434264","cat":"人文常识","stem":"下列关于我国古代天文学成就的说法错误的是（    ）。","options":{"A":"《太初历》精度与公历相当","B":"唐代僧一行制作了金属黄道游仪","C":"《天文》记录了上百颗恒星的赤道坐标位置","D":"《汉书·五行志》记录了太阳黑子活动"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，《太初历》是我国历史上第一部比较完整的历法。汉武帝太初元年(公元前104年)由落下闳、邓平等人根据天象实测和长期天文记录而编撰的新历法。由于太初历的回归年和朔望月的数值偏大，使用时间一长，积累误差就很大了。元朝郭守敬编订的《授时历》精度与现行公历相当。\nB项正确，黄道游仪是用来观测日月星辰的位置和运行变化的一种仪器。唐开元九年(721)，先由机械制造家梁令瓒用木料做成黄道游仪模型，后在僧一行主持下，于开元十一年铸成铜器。\nC项正确，《天文》作者是战国时期的天文学家石申。该书原书虽已失传，但在唐朝的天文学著作中对其内容有所保留，后人据此辑成《石氏星表》。《石氏星表》是世界上现存最古老的星表，保留了一百多颗恒星的赤道坐标数据。\nD项正确，太阳黑子是太阳光球层上出现的暗黑斑点，是太阳活动的基本标志。在《汉书·五行志》里记载有“汉成帝河平元年(公元前28年) 三月乙未，日出黄，有黑气，大如钱，居日中央”。不但说明黑子出现的日期，而且说明了黑子的形状、大小和位置。这是公元前28年5月10日的太阳黑子记录，是世界上公认最早的、正确的太阳黑子记录。\n本题为选非题，故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"2434266","cat":"科技常识","stem":"下列有关医学的说法错误的是（    ）。","options":{"A":"春天是急性心梗的高发期","B":"诺如病毒具有明显的季节性","C":"原发性高血压高于继发性高血压发病率","D":"血友病、哮喘和乙型肝炎均是遗传疾病"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，急性心肌梗死是冠状动脉急性、持续性缺血缺氧所引起的心肌坏死。常见的诱因有：过劳、激动、暴饮暴食、寒冷刺激、便秘、吸烟、大量饮酒等。突然的寒冷刺激也可能诱发急性心肌梗死，因此，冬春寒冷季节是急性心肌梗死发病较高的原因之一。\nB项正确，诺如病毒，又称诺瓦克病毒，是人类杯状病毒科中诺如病毒属的一种病毒。是一组形态相似、抗原性略有不同的病毒颗粒。诺如病毒具有明显的季节性，人们常把它称为“冬季呕吐病”。根据2013年发表的系统综述，全球约\u003cimg data-k=\"387ca852b719\">的病例和约\u003cimg data-k=\"e1a3e3ce6d74\">的发生在冬季（北半球是12月-次年2月，南半球是6-8月），约\u003cimg data-k=\"a871c45562f2\">的病例和约\u003cimg data-k=\"436f7ab7854d\">的出现在凉爽的季节（北半球是10月-次年3月，南半球是4-9月）。\nC项正确，基于目前的医学发展水平和检查手段，能够发现导致血压升高的确切病因，称之为继发性高血压；反之，不能发现导致血压升高的确切病因，则称为原发性高血压。高血压人群中多数为原发性高血压，但明确诊断原发性高血压，需首先除外继发性高血压。目前认为，继发性高血压占高血压人群的\u003cimg data-k=\"0ef566a32600\">-\u003cimg data-k=\"fc324c3b9ecb\">，但随着医学发展水平和检查手段的不断进展，继发性高血压的比例将不断增加，原发性高血压的比例会不断下降。\nD项错误，1.血友病为一组遗传性凝血功能障碍的出血性疾病，其共同的特征是活性凝血活酶生成障碍，凝血时间延长，终身具有轻微创伤后出血倾向，重症患者没有明显外伤也可发生“自发性”出血。2.哮喘是一种具有复杂性状的，具有多基因遗传倾向的疾病。其特征为：①外显不全，②遗传异质化，③多基因遗传，④协同作用。3.乙型病毒性肝炎是由乙型肝炎病毒引起的以肝脏病变为主的一种传染病。乙型肝炎病毒最主要通过血液传播，最重要的传播方式是母婴垂直传播和医源性感染，不具有遗传性。\n本题为选非题，故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"2434268","cat":"人文常识","stem":"下列关于古代生活场景的描述，符合历史发展的是（    ）。","options":{"A":"秦朝的王某一家以种植玉米为生","B":"元代的李某喜欢吃红薯和土豆","C":"汉代的张某使用曲辕犁进行春耕","D":"清朝的陈某喜欢用辣椒来做菜"},"answer":"D","explanation":"本题考查人文常识。\nA项错误，玉米在中国是从明朝开始种植的，大约到了16世纪中期，玉米传到了我国，开始在中国进行种植。最早记载见于明朝嘉靖三十四年成书的《巩县志》，称其为“玉麦”，其后嘉靖三十九年《平凉府志》称作“番麦”和“西天麦”。“玉米”之名最早见于徐光启的《农政全书》。故秦朝时还没有玉米，王某一家不能以种植玉米为生。\nB项错误，红薯最早传进中国约在明朝后期的万历年间。土豆原产于南美洲，于明代末期传入我国。故元代还没有红薯和土豆。\nC项错误，一种轻便的短曲辕犁，又称江东犁。它最早出现于唐代后期的江东地区，它的出现是古代中国耕作农具成熟的标志。故汉代时还没有出现曲辕犁，张某不能使用曲辕犁进行春耕。\nD项正确，公认的中国最早关于辣椒的记载是明代高濂撰《遵生八笺》（1591年），有：“番椒丛生，白花，果俨似秃笔头，味辣色红，甚可观”的描述。据此记载，通常认为辣椒是明朝末年传入中国。故清朝的陈某可以用辣椒来做菜。\n故正确答案为D。","no":16,"missingImage":false},{"type":"question","qid":"2434269","cat":"人文常识","stem":"下列哪种情形最可能发生在诗句“绿槐高柳咽新蝉”描写的季节？（    ）","options":{"A":"华北地区开始播种水稻","B":"黄河的刘家峡到包头段出现凌汛","C":"中山站上方出现极光现象","D":"陕西富平地区开始制作柿饼"},"answer":"C","explanation":"本题考查地理国情。“绿槐高柳咽新蝉”出自宋代苏轼的《阮郎归·初夏》，营造出一种清丽欢快的情调，描写的是初夏时节的闺阁生活。\nA项错误，华北地区种植的水稻是单季稻，一季水稻播种时间为清明前，四月底五月初移栽。不符合题干中描述的季节。\nB项错误，凌汛是黄河常见的一种自然现象。由于黄河所处纬度较高，下游河道冬季结冰封河，而春初解冻开河后冰水齐下，冰凌壅塞，水位上涨，形成凌汛洪水，此时期为黄河凌汛期。不符合题干中描述的季节。\nC项正确，极光是发生在地球高磁纬地区的一种大规模放电现象。由于中山站特殊的地理位置，一天穿越两次极光带，是世界上进行极光观测的最佳场所之一。一般来说，观测极光通常都是在每年夏至前后的夜晚。\nD项错误，富平柿饼，陕西省富平县特产，中国国家地理标志产品。富平柿饼以当地生产的传统名优柿子品种“富平尖柿”为原料，10月中下旬手工采摘后经过清洗削皮、日晒压捏、捏晒整形、定型捂霜等多道工序精细制作而成。\n故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"2434271","cat":"人文常识","stem":"下列关于桥梁的说法错误的是（    ）。","options":{"A":"港珠澳大桥是目前世界最长的跨海大桥","B":"拱桥的材料多以石料为主，孔数多为奇数","C":"钢架桥是一种适于修建特大跨度桥梁的桥型","D":"梁桥平直且易于建造，常应用于中、小跨度桥梁"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，港珠澳大桥是连接香港、珠海、澳门的超大型跨海通道，全长55公里，主体工程“海中桥隧”长35.578公里，2009年12月15日开工。2016年9月27日，港珠澳大桥主体桥梁正式贯通，是世界最长的跨海大桥。\nB项正确，拱桥指在竖直平面内以拱作为结构主要承重构件的桥梁。由于我国是一个多山的国家，石料资源丰富，因此拱桥以石料为主。孔数上有单孔与多孔，多孔以奇数为多，偶数较少。\nC项错误，钢架桥是梁和柱整体结合的桥梁结构。在竖向移动荷载作用下，梁部主要受弯，柱脚处有水平推力，受力状态介于梁式桥和拱桥之间，一般用于跨径不大的城市桥或公路高架桥和立交桥，同时在要跨越深水、深谷、大河急流的大跨桥梁中也会被应用。缆索承重桥适用于建造跨度非常大的桥梁，而非钢架桥。\nD项正确，梁桥是我国最普通、最常见的一种桥，古时叫作平桥，它的外形平直，比较容易建造，且价格低、修建容易，历史悠久，形式优美，常应用于中、小跨度桥梁。\n本题为选非题，故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"2434273","cat":"法律常识","stem":"甲将某小区房屋出租给乙，乙在阳台上放置盆栽植物若干。一日大风将阳台上花盆吹落，砸中楼下经过的丙。根据相关法律，该赔偿责任应由谁承担？（    ）","options":{"A":"甲","B":"乙","C":"甲和乙","D":"乙和小区物业"},"answer":"B","explanation":"本题考查法律常识。\n根据《中华人民共和国民法典》第一千二百五十三条规定，建筑物、构筑物或者其他设施及其搁置物、悬挂物发生脱落、坠落造成他人损害，所有人、管理人或者使用人不能证明自己没有过错的，应当承担侵权责任。所有人、管理人或者使用人赔偿后，有其他责任人的，有权向其他责任人追偿。本题中的使用人乙的搁置物（盆栽植物）坠落造成丙的损害，应当承担赔偿责任。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"2434276","cat":"人文常识","stem":"“白头翁坐常山独活千年，红娘子上重楼连翘百步”最可能是哪儿的对联？（    ）","options":{"A":"药店","B":"戏院","C":"饭店","D":"书店"},"answer":"A","explanation":"本题考查人文常识。\n本副对联是行业联中的药店联，利用中草药名做对联是一种很感兴趣的文学活动，它能体现出对联的巧妙性和趣味性，尤其是一些拟人化的药名（白头翁、红娘子）更富有想象力。本副对联上联包含三味中药：白头翁、常山、独活；下联包含三味中药：红娘子、重楼、连翘。\n故正确答案为A。","no":20,"missingImage":false}],"count":20,"answerable":20,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2434284","cat":"逻辑填空","stem":"习近平同志指出，让收藏在禁宫里的文物、陈列在广阔大地上的遗产、书写在古籍里的文字都活起来。        是让非物质文化遗产活起来的有效方式，能够让其价值和魅力深入人心，凝聚全社会保护传承非物质文化遗产的共识和力量。\n填入画横线部分最恰当的一项是（    ）。","options":{"A":"保护","B":"创新","C":"传播","D":"开发"},"answer":"C","explanation":"对应后文“让非物质文化遗产活起来”、“能够让其价值和魅力深入人心”，故空缺处应该体现宣传，让别人知道的含义，C项“传播”符合题意，当选。\nA项“保护”仅能起到维持现状的目的，不能让非物质文化遗产的价值深入人心，排除；B项“创新”指有一定革新，文段没有体现“新”的含义，排除；D项“开发”指通过研究或努力，开拓、发现、利用新的资源或新的领域，如开发油田等，文中非物质文化遗产不属于新东西，排除。\n故正确答案为C。\n【文段出处】《非遗传播要有温度有质感》","no":21,"missingImage":false},{"type":"question","qid":"2434286","cat":"逻辑填空","stem":"中国天文学传统极为深厚，成就极为可观，足以和希腊天文学相媲美，特别值得将二者进行比较。事实上，许多人正是通过强调我们有发达的天文学来强调中国古代也有科学，甚至            。\n填入画横线部分最恰当的一项是（    ）。","options":{"A":"独当一面","B":"遥遥领先","C":"自成一家","D":"登峰造极"},"answer":"B","explanation":"文中出现“甚至”，提示上下文是递进关系，空缺处词语较之前文程度更重，前文提及“中国古代也有科学”，那横线处应体现出不仅有科学，而且中国科学比其他国家更发达的含义，B项“遥遥领先”指绝对的领先优势，符合文意，当选。\nA项“独当一面”指单独承当一方面的工作或使命，多用于形容人，不能搭配科学，排除；C项“自成一家”指在某种学问或技术上有独到的见解或独特的做法，能自成体系，无法体现中国科学更发达，不能与前文形成递进关系，排除；D项“登峰造极”比喻学问、技能等达到最高的境界或成就，程度过重，排除。\n故正确答案为B。\n【文段出处】《吴国盛 | 科学与礼学：希腊与中国的天文学》","no":22,"missingImage":false},{"type":"question","qid":"2434288","cat":"逻辑填空","stem":"特殊的地域特色让新疆的生物区系既古老又独特，形成了世界上较为丰富的种质与基因资源。而地理与气候环境又让新疆的植物具备了多样性的        逆境的结构与机能，        了多样的功能性机能，如抗病虫、抗旱、抗寒、抗盐碱等。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"适应  携带","B":"克服  遗传","C":"扭转  保留","D":"突破  增加"},"answer":"A","explanation":"第一空，搭配“逆境”，并且根据“新疆的生物区系既古老又独特”、“较为丰富的种质与基因资源”以及“植物具备了多样性”可知，新疆的植物可以在逆境中生存，Ａ项“适应”体现出新疆植物在逆境中可以生存下去的意思，符合文意，当选；Ｂ项“克服”多搭配困难、缺点、毛病等，不搭配逆境，排除；C项“扭转”指掉转的意思，文段并未体现这个意思，并且扭转多搭配时局等，搭配不当，排除；D项，“突破”多搭配“防线”、“难关”等，搭配不当，排除。\n第二空代入验证，“携带”了多样的功能性机能，表达出新疆植物具有多样性的机能，填入文段合适。\n故正确答案为Ａ。","no":23,"missingImage":false},{"type":"question","qid":"2434219","cat":"逻辑填空","stem":"随着隐身、高超声速、无人等技术的发展及在空天领域的应用，空天兵器正在发生            的变化。当前和未来一段时期，构成空天威胁的兵器主要包括巡航导弹、空基打击平台、弹道导弹、天基攻击武器等。显然，空天领域已经成为战争制胜的新高地和大国战略博弈的新        。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"空前绝后  方向","B":"翻天覆地  焦点","C":"不可思议  趋势","D":"难能可贵  目标"},"answer":"B","explanation":"第一空，搭配“变化”，根据“隐身”、“高超声速”、“无人机”等技术的应用，以及“当前和未来一段时间，构成空天威胁的兵器主要包括”、“空天领域成为新的······”可知，文段强调空天兵器发生很大的变化，横线要填入一个表达变化大的词语。B项“翻天覆地”形容变化巨大而彻底，符合文意，保留。A项“空前绝后”指从前没有过，以后也不会有，文段没有体现以后不会有的意思，排除；C项“不可思议”形容对事物或言论很难想象，无法理解，文段并未表达无法想象的意思，排除；D项“难能可贵”指难以做到的事情居然做到了，值得珍视，文段没有体现出难的意思，排除。\n第二空代入验证，成为新的焦点，表达出空天领域大国新的争夺点，符合文意。\n故正确答案为B。\n【文段出处】《空天兵器：大国战略博弈的新焦点》","no":24,"missingImage":false},{"type":"question","qid":"2434226","cat":"逻辑填空","stem":"1964年，约翰·贝尔提出了一种可以区分量子力学与局域实在论孰对孰错的测试方法，即贝尔不等式。随后的几十年，大量的实验都证实了量子力学关于贝尔不等式的        ，但是这些实验或多或少地存在一些        ，导致人们依然无法对这一争论进行最终判定。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"预言  漏洞","B":"定论  瑕疵","C":"判断  偏颇","D":"假设  错误"},"answer":"A","explanation":"第一空，B项“定论”指确定的原则、论断。由后文“导致人们依然无法对这一争论进行最终判定”可知，贝尔不等式不是一种已经确定无误的“定论”，排除B项；A项“预言”、C项“判断”、D项“假设”均符合文意，保留。\n第二空，分析可知，所填词语搭配需“实验”。C项“偏颇” 指偏向某一方面，有失公允，一般搭配“人”，不能说“实验存在偏颇”，排除C项。由后文“导致人们依然无法对这一争论进行最终判定”可知，人们还不能对贝尔不等式进行最终判定，A项“漏洞”符合文意，当选；D项“错误”的程度较重排除。\n故正确答案为A。\n【文段出处】《我国科学家检验量子非定域性》","no":25,"missingImage":false},{"type":"question","qid":"2434233","cat":"逻辑填空","stem":"时下人民安居乐业，百姓在满足物质生活的同时，也更加追求精神上的享受。如何将中华优秀传统文化以            的方式推向大众，使人们能真正感受到中华上下五千年文化的厚重与美好，提升人们的文化认同与文化自信，成为当下            的课题。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"如沐春风  重中之重","B":"潜移默化  迫在眉睫","C":"雅俗共赏  众望所归","D":"喜闻乐见  势在必行"},"answer":"D","explanation":"本题可从第二空入手，所填词语用来修饰“将中华优秀传统文化推向大众”这一课题。D项“势在必行”指从事情发展的趋势看，必须采取行动。文段中“百姓······也更加追求精神上的享受”可以体现“将中华优秀传统文化推向大众”的必要性，“势在必行”符合语境，当选。\nA项“重中之重”强调的是重要部分的重要内容，通常表述为“······是重中之重”，与“课题”搭配不当，排除；B项“迫在眉睫”比喻事情十分紧急，已到眼前，文段只是说百姓更加追求精神上的享受，没有体现这一课题非常急迫、亟待解决，排除；C项“众望所归”形容某人威望很高，受到大家敬仰和信赖，一般用于形容“人”，不能用来形容“课题”，排除。\n验证第一空，D项“喜闻乐见”指喜欢听、乐意看，形容很受欢迎，符合文意，当选。\n故正确答案为D\n【文段出处】《博物馆文创“走红”靠的是“走心”》","no":26,"missingImage":false},{"type":"question","qid":"2434238","cat":"逻辑填空","stem":"世界上任何一种文化形态，都有其产生的特定时代和生态原因。在中国，传统艺术是传统文化家族中不可分割的组成，        着无与伦比的魅力。艺术与生产生活            ，透过这扇窗户，人们能够审视古代中国的历史进程、社会风貌、日常生活、审美心态和价值追求。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"彰显  休戚相关","B":"散发  环环相扣","C":"蕴含  水乳交融","D":"展露  浑然一体"},"answer":"A","explanation":"第一空，横线处所填词语搭配“魅力”，且由“无与伦比”可知，此处所填词语程度较重。C项“蕴含”意思是包含在内，侧重于“内涵”用在此处程度较轻，排除；D项“展露”，与“魅力”搭配不当，一般说“展现魅力”，排除；对比A、B两项，A项“彰显”指鲜明地显示，B项“散发”指分散发出、释放出某种东西，“彰显”程度更重，更能与“无与伦比”构成对应，A项当选。\n第二空，代入验证。根据后文“透过这扇窗户,人们能够审视······”可知，横线处所填成语应表达关系密切之意。A项“休戚相关”指彼此间祸福互相关联，符合文意，当选。\n故正确答案为A。\n【文段出处】《探究艺术的“根源之美”》","no":27,"missingImage":false},{"type":"question","qid":"2434241","cat":"逻辑填空","stem":"辞书的“互联网基因”，似乎是            的。对于网络阅读，人们常常有“碎片化”的忧虑，而辞书恰是由众多“碎片化”的条目组成的，并且也是供人们“碎片化”检索使用的。因为有了数字化和互联网，辞书检索变得空前        ：只要把那个字、那个词放入搜索框，轻点一下鼠标，古音、今音，古义、今义，例句乃至翻译，都可以同时呈现在眼前。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"得天独厚  高效","B":"与生俱来  简便","C":"有目共睹  直观","D":"不容置疑  流畅"},"answer":"B","explanation":"本题可从第二空入手，“：”后的文字是对横线处所填词语的解释说明，根据后文“只要把那个字、那个词放入搜索框，轻点一下鼠标，古音、今音，古义、今义，例句乃至翻译，都可以同时呈现在眼前”可知，横线处所填词语应表达很方便、效率很高之意。C项“直观”指用感观直接接受或直接观察、D项“流畅”指流利通畅，与文意不符，排除。A项“高效”、B项“简便”符合文意，保留。\n第一空，横线处所填成语搭配“基因”。A项“得天独厚”指独具特殊优越的条件，也指所处的环境特别好，一般搭配“条件”“环境”，与“基因”搭配不当，排除，B项“与生俱来”指从一生下来就有，与“基因”搭配恰当，当选。\n故正确答案为B。\n【文段出处】《激活辞书的“互联网基因”》","no":28,"missingImage":false},{"type":"question","qid":"2434249","cat":"逻辑填空","stem":"20世纪中国新史学的一个主流取向就是史料的扩充，虽然这也曾导致出现忽视常见史料的        ，但在注意纠偏的基础上，针对史学界读原始材料不够认真的风气，今日史料扩充仍值得进一步        。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"倾向  提倡","B":"误区  留心","C":"弊端  关注","D":"陋习  探索"},"answer":"A","explanation":"第一空，横线处所填词语搭配“导致”，对应前文“主流取向”，故横线处所填词语应表达方向之意。B项“误区”与“导致”搭配不当，一般说“存在误区”，排除。C项“弊端”与“导致”搭配不当，一般说“暴露弊端”“折射弊端”，排除。D项“陋习”指不好的习惯，用在此处语义过重，排除。A项“倾向”符合文意，当选。\n\n第二空，代入验证。根据前文可知，史学界读原始材料不认真，因此史料扩充这种做法仍需坚持和发扬。A项“提倡”符合文意。\n故正确答案为A。\n【文段出处】《见之于行事：中国近代史研究的可能走向——兼及史料、理论与表述》","no":29,"missingImage":false},{"type":"question","qid":"2434253","cat":"逻辑填空","stem":"太阳能是恒星的馈赠，所以多年来，科学家们一直在为最大限度提高太阳能电池的转换效率而            。现在，新技术让每个光子产生的电能都可被太阳能电池吸收，这不仅是为下一代太阳能设备积蓄了更多力量，其所蕴藏的商业价值，以及对缓解能源危机的意义更加重大，这一成果在未来太阳能电池领域将            。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"苦思冥想  蓄势待发","B":"孜孜不倦  后来居上","C":"殚精竭虑  大有作为","D":"乐此不疲  前途无量"},"answer":"C","explanation":"第一空，形容科学家们多年来研究提高太阳能电池转换率的问题，A项“苦思冥想”比喻绞尽脑汁、深沉地思索，B“孜孜不倦”指工作或学习勤奋不知疲倦，C项“殚精竭虑”形容用尽精力、费尽心思，三项均可形容长期的科研工作，语义合适。D项“乐此不疲”形容对某事特别爱好而沉浸其中，文段并无“爱好”之意，排除；\n第二空，根据前文“不仅是为下一代太阳能设备积蓄了更多力量，其所蕴藏的商业价值，以及对缓解能源危机的意义更加重大”，横线处体现新技术在太阳能领域作用大、发展前景好，C项“大有作为”能够充分发挥才能，做出很大成绩，语义合适。A项“蓄势待发”指随时准备进攻，与文意无关，排除；B项“后来居上”指后来的超过先前的，用以称赞后起之秀超过前辈，文段并无新旧技术的对比，排除。\n故正确答案为C。\n【文段出处】《新设计让太阳能电池更高效》","no":30,"missingImage":false},{"type":"question","qid":"2434257","cat":"逻辑填空","stem":"崔颢的《黄鹤楼》与李白的《登金陵凤凰台》两首诗谁高谁下，历代文人纷争不已，但见仁见智，也很难做出        的判决。李白之所以定要在这首诗上争个高下，也许是因为在他擅长的写作手法上崔颢竟然取得了杰出的成就，使他自己也            吧。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"绝对  耿耿于怀","B":"正确  望尘莫及","C":"科学  心有不甘","D":"专业  自惭形秽"},"answer":"A","explanation":"本题从第二空入手，根据前文“因为在他擅长的写作手法上崔颢竟然取得了杰出的成就”，需体现李白感到不愉快、不安心的心理状态，所以才定要争个高低。A项“耿耿于怀”形容令人牵挂或不愉快的事在心里难以排解，符合文意，当选。\nB项“望尘莫及”比喻远远落在后面，多用于表示对人钦佩，D项“自惭形秽”意思是因为自己不如别人而感到惭愧，根据文意李白并不认为自己比崔颢差，故与文意相悖，排除；C项“心有不甘”指内心深处不情愿落后于人，文段中“谁高谁下”尚无定论，李白并非“落后”于崔颢，故与文意不符，排除。\n第一空代入验证， “很难做出绝对的判决”符合文意，当选。\n故正确答案为A。","no":31,"missingImage":false},{"type":"question","qid":"2434263","cat":"逻辑填空","stem":"提到越剧，大多数人印象中都是莺莺燕燕、才子佳人，善于讲述缠绵悱恻的故事。越剧成熟期的“女子越剧”        了人们对其柔美的印象。越剧也逐渐成为中国300多个地方剧种中唯一一个声腔、表演完全女性化的剧种。据报载，新中国成立前沪上女班多达36个，而男班则几乎            。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"加剧  闻所未闻","B":"造就  销声匿迹","C":"深化  所剩无几","D":"重塑  不堪一击"},"answer":"B","explanation":"第一空，根据文意“女子越剧”使人们产生了对越剧柔美的印象。横线处表达产生之意，B项“造就”即培养使成就，符合文意。A项“加剧”加深严重程度，用于消极语境中，与文段积极色彩不符，排除；C项“深化”使向更深的阶段发展，文段并无加深之意，排除；D项“重塑”指重新塑造，“重新”之意文段无从对应，排除。\n代入验证第二空，根据前文“沪上女班多达36个，而男班则几乎······”可知,横线处表达数量少之意,B项“销声匿迹”指消失或隐藏起来不公开露面，符合文意，B项当选。\n故正确答案为B\n【文段出处】《男女合演60载，为越剧喝彩！》","no":32,"missingImage":false},{"type":"question","qid":"2434267","cat":"逻辑填空","stem":"综观20世纪西方绘画史，各种时髦的“主义”            ，而柯尔内留·巴巴作为一名传统油画艺术的捍卫者，却在西方画坛            。他的作品在写实的基础上注重概括和提炼，画面效果深重浑厚，            ，又不失深刻的象征寓意和文化旨归，给观者一种视觉的震撼和心灵的触动。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"层出不穷  独树一帜  大气磅礴","B":"大行其道  崭露头角  栩栩如生","C":"浮光掠影  独领风骚  精美绝伦","D":"铺天盖地  另辟蹊径  妙趣横生"},"answer":"A","explanation":"第一空，根据文段并结合选项可知，各种时髦的“主义”非常盛行，因此所填成语应该体现出非常盛行的含义。A项“层出不穷”指接连不断地出现，没有穷尽，B项“大行其道”指新潮事物流行成为一种风尚，D项“铺天盖地”形容来势很猛，声势大，到处都是，三者均能体现出非常盛行的含义，符合题意。C项“浮光掠影”比喻观察不细致或印象很不深刻，和文段意思不相符，排除。\n第二空，“而”表示转折，所填成语应该形容巴巴这位传统的画家在西方画坛上，没有随大流、赶时髦，而是有着自己的风格。A项“独树一帜”比喻独特新奇，自成一家，D项“另辟蹊径”指另外开辟一条路，比喻另创一种风格或方法，两者均符合题意。B项“崭露头角”指初显露优异的才能，不符合题意，排除。\n第三空，所填成语形容画面效果，逗号表示并列，因此所填成语意思和“深重浑厚”相近，A项“大气磅礴”形容气势浩大，符合题意，当选。D项“妙趣横生”指洋溢着美妙的意趣，侧重于有趣，不符合题意，排除。\n故正确答案为A。\n【文段出处】《看这位东欧艺术家的作品，感受中国油画发展历程》","no":33,"missingImage":false},{"type":"question","qid":"2434270","cat":"逻辑填空","stem":"当前，正值“互联网+”政务服务逐渐        之际，深化“放管服”改革不是多挂一条标语或横幅，而是要把“马上办”“网上办”“一次办”这些        群众期待的好措施认真办好、加快落实。因此，各地在        政务服务信息化建设的同时，应该下大力气提升工作人员的责任心与服务意识，把好事办好，把小事办牢。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"兴起  满足  监督","B":"升级  注重  聚焦","C":"推行  顺应  强化","D":"普及  迎合  保障"},"answer":"C","explanation":"本题从第二空入手，第二空，根据文段可知“马上办”“网上办”“一次办”这些好措施符合群众期待。A项“满足”指使满意，C项“顺应”指顺从、适应、不违，两者均符合题意。B项“注重”指重视，和文段意思不相符，排除。D项“迎合”指曲意逢迎，投其所好，带有贬义倾向，不符合题意，排除。\n第三空，搭配“政务服务信息化建设”，C项“强化”指增强某种状态、行为的过程，符合题意，当选。A项“监督”基本意思是对现场或某一特定环节﹑过程进行监视﹑督促和管理，使其结果能达到预定的目标，而根据文段可知，政务服务信息化建设已经完成，所以不需要监督，而需要强化，因此不符合题意，排除。\n故正确答案为C。\n【文段出处】《便民服务不能停留在纸上》","no":34,"missingImage":false},{"type":"question","qid":"2434272","cat":"逻辑填空","stem":"自然语言是我们表达思想的首要工具，也是科学知识        所必需的，因为自然语言是大众语言，是交流的工具。要让科学知识得到普及和理解，就必须将抽象的理论        化，让大众接受。\n依次填入画横线部分最恰当的一项是（    ）。","options":{"A":"创新  具体","B":"传播  通俗","C":"解释  简单","D":"发展  感性"},"answer":"B","explanation":"从第二空入手，根据文段“让大众接受”可知，应该让抽象的理论变的浅显易懂，B项“通俗”指浅显易懂，适合大众，C项“简单”指难度小，均符合题意。A项“具体”形容说得详细，但是不一定通俗易懂，D项“感性”是属于感觉、知觉等心理活动的，而这并不能让大众更容易接受，均不符合题意，排除。\n回到第一空，C项“解释”指分析阐明，“自然语言”不一定是科学知识解释所必须的，科学语言同样能够解释科学知识，而B项“传播”就不一样了，“传播”指的是散布开去，科学知识的传播必须借助“自然语言”，这样大众才能听得懂。\n故正确答案为B。\n【文段出处】《科学认知需要适应性表征》","no":35,"missingImage":false},{"type":"question","qid":"2434275","cat":"片段阅读","stem":"叙事，顾名思义，即叙述事情，以言语或者其他的媒介来再现时间和空间交织下变化的事件。叙事本身一直存在于人类漫长的生活之中，自结绳记事到文字记载，再到文学描绘、戏剧表现、电影演绎、电子媒介发展下的网络叙述等，人类以不同的方式叙述着历史和文化的演进。但叙事学中的“叙事”并不是简单地说了件事，这从叙事学家们对于叙事的定义中即可看出。到目前为止，叙事的定义也并没有被明确界定，不同的叙事学家们对此有不同的看法，主要是围绕叙事是否必须有因果关系的推导而进行论争。\n这段文字意在说明（    ）。","options":{"A":"叙事学中的“叙事”定义仍然莫衷一是","B":"不同行业对于“叙事”的认识区别很大","C":"叙事记录了人类漫长的生活历史","D":"因果关系推导是叙事学中的关键"},"answer":"A","explanation":"文段首句引出“叙事”的概念，接着介绍了在人类发展不同阶段中的叙事方式，然后通过转折词“但”将话题引到叙事学中的叙事定义上来，表示目前叙事学中叙事的定义并不明确，不同的叙事学家有不同的看法。文段转折之后是重点，对应A项，“莫衷一是”表示意见有分歧。\nB项“不同行业”文段未提及，转折之后强调的是叙事学中的叙事定义不明确，有分歧，排除；\nC项对应“叙事本身一直存在于······文化的演进”，为转折之前的非重点内容，排除；\nD项“叙事学中的关键”范围扩大，文段转折之后强调的是叙事学中的叙事定义问题，排除。\n故正确答案为A。\n【文段出处】《艺术跨界，让一切皆有可能》","no":36,"missingImage":false},{"type":"question","qid":"2434277","cat":"片段阅读","stem":"现代生物制造已经成为全球性的战略性新兴产业，在化工、材料、医药、食品、农业等诸多重大工业领域得到了广泛的应用。据经合组织预测，到2030年约有\u003cimg data-k=\"fa0de4871c60\">的化学品和其他工业产品来自生物制造。欧、美、日等主要发达国家都将绿色生物制造确立为战略发展重点，并分别制定了相应的国家规划。我国正处于建设创新型国家与加快生态文明体制改革的决定性阶段，紧随并引领世界科技前沿，发展新型绿色生物制造技术，支撑传统产业升级变革，关乎资源、环境、健康，符合国家重大战略需求。\n这段文字意在说明（    ）。","options":{"A":"现代生物制造的应用领域日益广泛","B":"发展现代绿色生物制造乃大势所趋","C":"发展现代生物制造符合我国重大战略需求","D":"我国正处于传统产业升级变革的关键时期"},"answer":"C","explanation":"文段开篇介绍了现代生物制造在众多领域得到广泛应用的背景，并引用经合组织的预测数据，印证了现代生物制造的广阔发展前景。接着论述了主要发达国家将绿色生物制造纳入国家重点发展规划的国际背景。然后将话题引到“我国”，通过总结前文，表示我国也要发展现代生物制造，这符合国家重大战略需求，对应C项。\nA项对应首句，B项“大势所趋”对应“据经合组织预测······相应的国家规划”，均为背景介绍部分，非重点，排除。\nD项偏离文段核心，未提及文段关键词“现代生物制造”，排除。\n故正确答案为C。\n【文段出处】《微生物+人工智能:开启新一代生物制造》","no":37,"missingImage":false},{"type":"question","qid":"2434279","cat":"片段阅读","stem":"欣赏中国画，其要在意象、在技法、在韵致、在境界，其法在观物、在游心、在体道、在畅神。须紧扣意象和技法这两大介质，从物我、情景、形神、体道等意象归纳和线条、形态、色彩、构图等技法剖析两途，层层倒逼，以迫近画作的风神和特质。透过画作的物化形态，体悟主导其意象创构和技法表现的思维方式和审美内核，即生命、节律、体势、气韵等主体价值，品味出画作的境界涵养之美。然而，就艺术而论，画作赏鉴或品评优劣，首在是否能令观者产生共鸣、打动其心，是否能使其从中捕捉并直通画家所欲传达的观念、思想、情绪，是否能令观者从中获得启迪与教益，而非“似”与“不似”。\n这段文字意在说明（    ）。","options":{"A":"意象和技法是欣赏中国画的必备素养","B":"品评中国画需要积累一定的审美心得","C":"欣赏中国画的关键在于能否打动人心","D":"画作的逼真与否不是赏鉴的根本标准"},"answer":"D","explanation":"文段开篇论述了欣赏中国画要紧扣意象和技法这两个介质，并详细论述了体悟意象和技法的方式。接着通过转词“然而”引出三个并列短句，强调了欣赏画作更重要的是令观者产生共鸣，捕捉画家传递的思想观念，观者从中获得启迪，而非画作是否逼真，对应D项。\nA项“意象和技法”对应转折之前的非重点内容，排除。\nB项“审美心得”无中生有，文段未提及，排除。\nC项“打动人心”对应“是否能······打动其心”，为转折后并列分句的一部分，表述不全面，排除。\n故正确答案为D。\n【文段出处】《赏画之法——其要在意象、在技法、在韵致、在境界》","no":38,"missingImage":false},{"type":"question","qid":"2434281","cat":"片段阅读","stem":"作为新一代信息技术与智能制造深度融合的产物，工业互联网的目的旨在结合软件和大数据分析，重构全球工业，将人、数据及机器各种元素互联起来，大规模提升工业制造的生产力。它通过系统构建网络、平台、安全三大功能体系，打造人、机、物全面互动的新型网络基础设施，形成了智能化发展的新兴业态和应用模式；通过工业数据的全面深度感知、实施传输交换、快速计算处理和高级建模分析，实现了智能控制、运营优化和生产组织方式的变革。\n最适合做这段文字标题的是（    ）。","options":{"A":"工业互联网应运而生","B":"工业互联网的升级换代","C":"工业互联网：技术与实践","D":"工业互联网将是下一个“风口”"},"answer":"D","explanation":"文段开篇论述工业互联网的目的，可大规模提升工业制造生产力，之后通过并列结构阐述工业互联网对新兴业态、智能控制和生产组织方式等方面的变革作用，故可知文段重点强调的是工业互联网将对社会各方面产生的深刻影响，对应D项，“风口”指充满竞争和机遇的意思，可体现工业互联网的作用。\nA项，文段并非仅仅介绍工业互联网的产生，还强调了其带来的各种效应，排除；\nB项，“升级换代”无中生有，排除；\nC项，文段并未具体阐述工业互联网的“技术与实践”，无中生有，排除。\n故正确答案为D。\n【文段出处】《工业互联网将是下一个“风口”》","no":39,"missingImage":false},{"type":"question","qid":"2434283","cat":"片段阅读","stem":"水凝胶是由聚合物链接成3D网络组成的生物材料。由于这种网络吸水能力强，而且与活性组织的结构相似，因此可用来将细胞输送到缺陷区域以再生缺损的组织。然而，水凝胶的小孔径限制了移植细胞的存活、扩张和新组织的形成，使其不太适合组织再生。如果将水凝胶插入黏土层，形成具有更多孔结构的黏土增强水凝胶，则可更好地促进组织再生。黏土是一种天然存在的矿物材料，已成为生物材料领域非常流行的医疗产品的理想添加剂。它具有分层结构，且表面带有负电荷，没有任何负面影响。\n根据这段文字，下列说法正确的是（    ）。","options":{"A":"输送移植细胞是水凝胶的重要功能之一","B":"黏土的插入可以扩大水凝胶的小孔直径","C":"再生组织对于移植细胞的活性要求非常高","D":"黏土增强水凝胶不会限制移植细胞的扩张"},"answer":"A","explanation":"A项，根据“水凝胶可用于将细胞输送到缺陷区域以再生缺损的组织”可知，该项表述正确；\nB项，根据“将水凝胶插入黏土层，形成的具有更多孔结构的黏土增强水凝胶”可知，插入黏土并非扩大了小孔直径，而是增加了孔结构，偷换概念，排除；\nC项，根据文段，组织再生与移植细胞的存活、扩张和新组织的形成都有关，且并未提及“再生组织对移植细胞活性要求非常高”，无中生有，排除；\nD项，文段仅表述“黏土增强水凝胶可更好地促进组织再生”，并未说明不会限制移植细胞的扩张，故无中生有，排除。\n故正确答案为A。\n【文段出处】《黏土增强水凝胶可更好促进骨愈合》","no":40,"missingImage":false},{"type":"question","qid":"2434285","cat":"片段阅读","stem":"庙会又称“庙市”或“节场”，一般在农历新年、元宵节、二月二龙抬头等节日举行，是国家级非物质文化遗产。庙会历史悠久，可追溯到古代祭祀活动。随着社会发展，庙会逐渐融入商业元素，成为民俗文化加集市贸易的民间娱乐活动。庙会文化的最大特点是大众化，雅俗共赏，既有高雅的艺术演出，又有喜闻乐见的街头技艺表演，内容丰富，参与性强，许多项目便于市民及游客直接参与互动，符合群众的兴趣与需求。庙会文化的另一个特点是吃喝玩乐购物一体化，市民可以在逛庙会中接受传统文化的熏陶与滋养。\n这段文字主要介绍了庙会文化的（    ）。","options":{"A":"悠久历史","B":"风俗特点","C":"发展传承","D":"时代内涵"},"answer":"B","explanation":"文段开篇通过介绍庙会的内涵，引出庙会这一话题，之后论述随着社会的发展，庙会成为一种民间娱乐活动，并通过两方面具体阐述其特点，故可知文段重点强调的是庙会文化作为一种民俗活动的特点，对应B项。\nA项，对应“庙会历史悠久，可追溯到古代祭祀活动”，非重点，排除；\nC项，文段强调庙会的特点，而非发展传承，排除；\nD项，文段并未阐述庙会在当下时代的内涵，故无中生有，排除。\n故正确答案为B。\n【文段出处】《庙会文化是点缀年味的“味精”》","no":41,"missingImage":false},{"type":"question","qid":"2434287","cat":"片段阅读","stem":"亚马孙雨林有着“地球之肺”的美称。科学家估算，其每年所吸收的二氧化碳量占人类燃烧化石燃料所释放的二氧化碳总量的四分之一，因而在众多的气候预测模型中，都将亚马孙雨林的碳汇作用视为重要的影响因素。而最新研究认为，这些模型基于亚马孙雨林土壤中存在足够的磷营养供应这一假设，与现实状况并不相符。研究人员指出，亚马孙雨林生态系统已有数百万年的历史，如今，在亚马孙流域，许多地方的磷已经枯竭，这对植物吸收二氧化碳的能力造成很大影响。而过去的气候预测模型研究没有充分考虑到磷贫乏问题，因而其对亚马孙雨林的碳汇作用评估并不准确。\n根据这段文字，下列说法正确的是（    ）。","options":{"A":"亚马孙雨林主要靠磷来吸收二氧化碳","B":"亚马孙雨林碳汇量并没有预期的那么高","C":"近年来亚马孙雨林的磷贫乏问题越来越严重","D":"现有气候预测模型大都高估了亚马孙雨林的影响力"},"answer":"B","explanation":"A项，根据“许多地方的磷已经枯竭，这对植物吸收二氧化碳的能力造成很大影响”可知，“磷”会影响植物吸收二氧化碳的能力，但并不意味着“主要靠磷来吸收二氧化碳”，排除；\nB项，根据“科学家估算，其每年所吸收的二氧化碳量占人类燃烧化石燃料所释放的二氧化碳总量的四分之一”可知，科学家估算亚马孙雨林的碳汇量很高，但根据最新研究发现“因而其对亚马孙雨林的碳汇作用评估并不准确”可知，亚马孙雨林的碳汇量预期过高，即碳汇量没有那么高，故表述正确，保留；\nC项，根据“如今，在亚马孙流域，许多地方的磷已经枯竭”可知，存在磷贫乏问题，但没有指出“越来越严重”，排除；\nD项，根据“在众多的气候预测模型中，都将亚马孙雨林的碳汇作用视为重要的影响因素”、“对亚马孙雨林的碳汇作用评估并不准确”可知，气候预测模型高估了“碳汇作用”，而非“亚马孙雨林的影响力”，排除。\n故正确答案为B。\n【文段出处】《亚马孙雨林碳汇量没有预期的高》","no":42,"missingImage":false},{"type":"question","qid":"2434293","cat":"语句表达","stem":"现代医学之父威廉·奥斯勒曾说过，现代医学实践的弊病是：历史洞察的贫乏、科学与人文的断裂以及技术进步与人道主义的疏离。做一名好医生，首先要有过硬的专业技能。但是，医术有时候只是“疗效”的必要条件而非充分条件。技术之外，医生常常要用温情去帮助病人。医学是一门消除人的不安和不适的学问。医学价值的实现，或说疗效的获得，除了医生的努力，还需要患者的配合，双方达成有效沟通。                    。\n填入文中画横线部分最恰当的一项是（    ）。","options":{"A":"这一切都有赖于人文精神在医学中的灌注和弘扬","B":"现代医学一味向技术发展会带来难以预料的后果","C":"医患关系的处理方法也是现代医学进步的重要方面","D":"医学人道主义必须将科学技术和人文思想融合起来"},"answer":"A","explanation":"横线出现在结尾，需要对前文内容进行概括总结。文段首先通过引用名言指出现代医学实践存在科学与“历史洞察”“人文”“人道主义”疏离的问题。随后指出医学需要专业技能，接着通过转折词“但”强调医生需要用“温情”去帮助病人。最后指出医学价值的实现，需要医生努力，也需要患者配合，需要双方的有效沟通。故前文重点强调的是人文精神在医学中的重要性，A项“这一切”对前文进行总结，且强调“人文精神”这一核心话题，当选。\nB项，“带来难以预料的后果”为问题的表述，文段强调的是对策，和前文衔接不当，排除；C项，“医患关系的处理方法”表述不明确，文段重要强调的是“人文精神”的重要性，排除；D项，文段通过转折重点强调人文精神的重要性，而非强调“科学技术和人文思想”的融合，排除。\n故正确答案为A 。\n【文段出处】《绘图说病：重建医患信任的有效努力》","no":43,"missingImage":false},{"type":"question","qid":"2434296","cat":"片段阅读","stem":"“共享经济”，也称为“分享经济”，本意是指“通过闲置资源的共享并将其与有短期使用需求的用户进行匹配，从而实现社会效益的最大化”，使用者可通过较低的价格享有服务，而资源占有者则可以通过提供闲置资源给他人“共享”而获得收益，是“双赢”格局。智能手机以及移动互联网的普及极大地促进了共享经济的发展，丰富和方便了人们的日常生活。而近年来，我国的共享经济在经营模式上已不限于依托“闲置资源”，而是通过集中采购或生产大量物品——出售其临时使用权——获得回报，主要特点就是“分时租赁”。\n对这段文字概括最恰当的一项是（    ）。","options":{"A":"我国共享经济在经营模式上有新发展","B":"实现“双赢”是共享经济的终极追求","C":"分时租赁是未来共享经济的主要模式","D":"共享经济本质是实现资源利用最大化"},"answer":"A","explanation":"文段先介绍了“共享经济”的本意和原本的经营模式，并指出其带来的良好社会价值。尾句通过“而近年来”介绍近期状况，指出共享经济的“经营模式”发生了变化，以“分时租赁”为主要特点。故文段通过时间的对比，重点强调我国共享经济在经营模式方面的变化，对应A项。\nB项，“实现‘双赢’”为尾句之前的内容，非重点，且“终极追求”无中生有，排除； C项，文段指出“分时租赁”是“近年来”的特点，而非“未来”的主要模式，偷换时态，排除；D项，对应首句话题引入的内容，非重点，排除。\n故正确答案为A 。\n【文段出处】《共享经济可持续发展离不开法律制度保障》","no":44,"missingImage":false},{"type":"question","qid":"2434298","cat":"片段阅读","stem":"黑洞是爱因斯坦广义相对论预言的一类独特的时空结构。目前已知的黑洞可以分为两大类：第一类质量在几倍到几十倍太阳质量之间，称作恒星级黑洞；另一类质量在几百万到几十亿太阳质量之间，称作超大质量黑洞，位于星系的中心。那么是否存在质量介于两类黑洞之间的中等质量黑洞，即质量位于几百到几十万倍太阳质量之间的黑洞呢？这类黑洞可能作为超大质量黑洞的种子，对于我们理解超大质量黑洞的形成与增长有非常重要的意义。然而，发现中等质量黑洞一直是一个难题，这是因为它们比恒星级黑洞距离我们更远，但质量又比超大质量黑洞小，因此其产生的观测效应非常弱。\n根据这段文字，下列说法正确的是（    ）。","options":{"A":"广义相对论中并未提及黑洞的相关信息","B":"恒星级黑洞和地球的距离较其他黑洞更远","C":"中等质量黑洞比其他黑洞更难被发现","D":"关于超大质量黑洞的形成过程尚有争议"},"answer":"C","explanation":"根据“然而，发现中等质量黑洞一直是一个难题，这是因为它们比恒星级黑洞距离我们更远，但质量又比超大质量黑洞小，因此其产生的观测效应非常弱”可知，C项表述正确，当选。\nA项，根据“黑洞是爱因斯坦广义相对论预言的一类独特的时空结构”可知，“并未提及”表述错误，排除。\nB项，根据“这是因为它们比恒星级黑洞距离我们更远”可知，中等质量黑洞距离我们比恒星级黑洞更远，选项表述错误，排除。\nD项，“超大质量黑洞的形成过程”文段未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】《近邻宇宙星系发现中等质量黑洞候选体》","no":45,"missingImage":false},{"type":"question","qid":"2434300","cat":"语句表达","stem":"①缺乏保护主体和保护动力是乡土文化地标面临消亡危机的重要原因\n②比如，在一些城中村改造中，没有对古建筑进行评估，也没有采取保护措施，致使一些优秀的古建筑被拆毁\n③除了被列为文物保护单位的文化地标能够得到相对有效的保护外，大多数位于农村的文化地标，都没有法律法规明确所有者应该承担保护的义务\n④还有些乡土文化地标，如宗祠，由于缺乏保护主体，也遭到了较大破坏\n⑤再加上基层财力有限，对很多文化地标的保护也就成为“非紧急的事项”\n⑥随着城市化进程的加快，承载着乡愁记忆的乡土文化地标，正面临着被损毁、破坏甚至消失的危机\n将以上6个句子重新排列，语序正确的一项是（    ）。","options":{"A":"⑥③④①⑤②","B":"①⑥⑤④③②","C":"⑥①③⑤②④","D":"①⑤②⑥③④"},"answer":"C","explanation":"首先对比选项，确定首句。对比①句与⑥句，①介绍乡土文化地标面临消亡危机的原因，⑥出现“随着”，引出“乡土文化地标”这一话题，为话题引入，⑥更适合做首句，排除B、D两项。\n对比A、C两项，确定⑥之后接①句还是③句，⑥指出乡土文化地标面临危机，①指出乡土文化地标面临危机的原因，③具体分析没有得到保护的原因，是对原因的详细解释说明，故③应该在①之后，⑥①相连，锁定C项。\n故正确答案为C。\n【文段出处】《在乡土文化中探寻乡村振兴的力量》","no":46,"missingImage":false},{"type":"question","qid":"2434205","cat":"语句表达","stem":"①此后，历代中央政权都行使着对新疆地区的管辖权\n②随着汉唐大一统格局的形成，新疆历史进入了统一多民族国家发展的辉煌时期，古丝绸之路也迎来盛世华章\n③唐朝先后设置安西大都护府和北庭大都护府，统辖天山南北\n④设官建制、屯垦戍边等政令的实施，促进了西域各地的稳定与发展，保障了丝绸之路的畅通，有力地推进了东西方文化交流的进程\n⑤从商贸活动到文化交流，带来了文化融合的多元格局，并汇集为开创新时代的动力，最终形成了以汉唐为核心向四周辐射的中华文化圈\n⑥张骞凿空西域，丝绸之路正式开通，而西域都护府的建立，则标志着新疆地区正式成为中国版图的一部分\n将以上6个句子重新排列，语序正确的一项是（    ）。","options":{"A":"⑥②③①⑤④","B":"⑥④②①③⑤","C":"②⑤③①⑥④","D":"②⑥①③④⑤"},"answer":"D","explanation":"本题为语句排序题，首先对比选项，确定首句。对比②与⑥，②出现“随着”，为背景介绍，引出“新疆”及“丝绸之路”的话题，⑥具体对“新疆”及“丝绸之路”进行阐述，故②句更适合做首句。排除A、B两项。\n对比C、D两项确定尾句，④句论述“政令实施”带来了经济发展并促进了文化交流，⑤句通过“从商贸活动到文化交流”对④句内容进行总结和概括，并通过“最终”引导结论，故⑤句更适合作尾句，排除C项。\n故正确答案为D。\n【文段出处】《万里同风 新疆文物 见证丝路辉煌》","no":47,"missingImage":false},{"type":"question","qid":"2434207","cat":"片段阅读","stem":"在市场经济下，明星书画走向市场是很自然的现象，出现“天价”也很正常，毕竟有需求就有市场。问题的关键是，抱什么样的心态去收藏它。如果想以此来收藏传家、保值增值，那这种投资的风险是显而易见的。毕竟这类书画收藏，虽有一定的社会价值，但原则上不宜久藏，也就难以长久流传。书画收藏是一门复杂的学问，不仅要考虑作者的名气，影响力、技法、意境、学术思想，还要考虑作品的题材、品相、尺幅、存世量等诸多因素，更与收藏者的财力、眼力、魄力息息相关。\n这段文字意在说明（    ）。","options":{"A":"明星书画不具有收藏价值","B":"书画收藏应综合考虑多种因素","C":"对于艺术品来说有需求就有市场","D":"“天价”明星书画的出现无可厚非"},"answer":"B","explanation":"文段首先指出明星书画出现“天价”属于正常现象，随后指出其中面临的风险与问题，且进行具体阐述，通过转折“但”明确提出原则上不宜久藏，难以长久流传。借助名人字画的收藏，引出下文重点，并且提出对策，书画的收藏需要考虑作者的名气、影响力、学术思想等，还要考虑作品的题材、品相等，更需要考虑收藏者的财力、魄力等。故文段重点在后文对策，强调书画收藏需要考虑多方因素，对应B项，当选。\nA项，“明星书画”属于文段的引入部分，非重点，且“不具有收藏价值”表述过于绝对，排除；\nC项，“艺术品”主题词错误，文段主题词为“书画收藏”，排除；\nD项，“明星书画”属于文段的引入部分，非重点，且“出现无可厚非”，对应文段首句，属于非重点内容，排除。\n故正确答案为B。\n【文段出处】《名人明星字画到底价值几何值不值得收藏》","no":48,"missingImage":false},{"type":"question","qid":"2434211","cat":"片段阅读","stem":"一般而言，美术馆运营主要是通过对艺术品载体的所有权主张法律权利，进而实现对馆藏品的利用。由于美术馆馆藏品的年代属性，也使得美术馆中的大量馆藏品是在《中华人民共和国著作权法》保护期内的作品。在运营实践中，不少美术馆重点关注了馆藏品物质载体所有权的归属，却忽视了在物质载体之上作为作品的艺术品权属问题。如此一来，有必要从美术馆基本工作环节的具体内容出发，细化各环节中的著作权保护问题，为美术馆全面提升知识产权综合保护能力进行法律依据上的梳理，以精准提升美术馆的公共文化服务质量，避免不必要的知识产权风险。\n这段文字意在说明（    ）。","options":{"A":"美术馆运营必须注重对著作权问题的研究","B":"须进一步细化美术馆运营工作的各项环节","C":"规避知识产权风险是美术馆运营中的重要内容","D":"美术馆运营普遍缺乏对艺术品权属问题的关注"},"answer":"A","explanation":"文段首先介绍了美术馆的运营特点，接着通过“由于”点明美术馆“忽视了作为作品的艺术品权属问题”的原因，最后，提出对策，即“有必要······细化各环节中的著作权保护问题”。故文段意在强调美术馆不应该“忽视艺术品权属问题”，要注重对著作权保护的研究，对应A项。\nB项，没有提及与“著作权”有关的内容，偏离文段重点，排除；\nC项，“规避知识产权风险”对应文段尾句中的“避免不必要的知识产权风险”，与“精准提升美术馆的公共文化服务质量”形成并列，均属对策意义效果的阐述，非文段重点且表述片面，故排除；\nD项，文段说明的是“不少美术馆”存在问题，选项“普遍缺乏”夸大了概念，且为问题表述，非文段重点，排除。\n故正确答案为A。\n【文段出处】《谈谈美术馆运营中的知识产权保护》","no":49,"missingImage":false},{"type":"question","qid":"2434216","cat":"片段阅读","stem":"太阳能道路是一种较有潜能的工程技术。作为“建筑”材料，太阳能电池板施工和安装更方便，同时具有发电功能。不过，使用太阳能电池的前提条件是日照充足，我国西部的青海、甘肃、西藏、新疆等地区阳光照射充足，加上道路占用率不高，适合建造太阳能电站。但我国山海关以东，东三省地区的冬季日照条件较弱，并不适合使用太阳能电池。太阳能电池达到阈值光强才能工作，低于阈值的结果不仅是转换效率降低，低照度条件下可能根本不会工作。\n这段文字主要介绍了太阳能道路的（    ）。","options":{"A":"建造条件","B":"技术优势","C":"强大功能","D":"分布区域"},"answer":"A","explanation":"文段首先提出“太阳能道路”这一概念，接着指出“太阳能电池板”的优势，然后通过“不过”转折，强调太阳能电池的“条件”。接着以“我国西部”和“山海关以东、东三省地区”为例，具体说明建造太阳能道路需要的条件，最后进一步补充说明如果达不到建造条件，太阳能电池无法工作。故文段重在强调太阳能道路的建造条件，对应A项。\nB、C两项，均为转折前的内容，非文段重点，排除；\nD项，文段中的“我国西部”和“山海关以东、东三省地区”是例证，目的在于证明太阳能道路的建造条件，并不是现实中已经建成的太阳能道路的分布情况，排除。\n故正确答案为A。\n【文段出处】《太阳能道路让电动汽车边跑边充电》","no":50,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2434228","cat":"数学运算","stem":"某专卖店耳机本季度进价比上季度低了\u003cimg data-k=\"b956f6c8ed4d\">，但店里仍按上季度售价销售，利润提高了\u003cimg data-k=\"fc324c3b9ecb\">。问该店上季度销售该耳机的利润率为多少？（    ）","options":{"A":"\u003cimg data-k=\"af5b93c81888\">","B":"\u003cimg data-k=\"12bb082e61d1\">","C":"\u003cimg data-k=\"74618a307709\">","D":"\u003cimg data-k=\"0c486c1399ce\">"},"answer":"D","explanation":"赋值上季度的进价为100，则本季度进价为\u003cimg data-k=\"3007cd2a6fcf\">。\n方法一：设上季度的利润率为\u003cimg data-k=\"f82036fad5c4\">，则本季度利润率为\u003cimg data-k=\"dd866dba11cb\">。根据\u003cimg data-k=\"aad31df8d4b1\">，且两个季度售价一样，则有\u003cimg data-k=\"431f09463365\">，解得\u003cimg data-k=\"d50c50cce59e\">。\n方法二：设上季度的利润为\u003cimg data-k=\"5320a525f2bc\">，则本季度的利润为\u003cimg data-k=\"c7412ad5cfe8\">。根据\u003cimg data-k=\"bbf3ea86dd07\">，且利润提高了\u003cimg data-k=\"fc324c3b9ecb\">，则有\u003cimg data-k=\"f8b1ff11f127\">，解得\u003cimg data-k=\"c35b89cf932c\">。则上季度利润率\u003cimg data-k=\"28f4b3e68679\">。\n故正确答案为D。\n注：本题中“利润提高\u003cimg data-k=\"fc324c3b9ecb\">”只能理解为利润率提高10个百分点，否则无答案。","no":51,"missingImage":false},{"type":"question","qid":"2434232","cat":"数学运算","stem":"某单位有两个对口扶贫地，每月需安排10人到两地参与扶贫工作，要求每个对口扶贫地区至少要有4人参与工作。问共有多少种不相同的分配方案？（    ）","options":{"A":"210","B":"252","C":"420","D":"672"},"answer":"D","explanation":"假设两个扶贫地为甲、乙，根据题意，该单位10人在两地的人数情况可分为3类：\n①甲地4人、乙地6人，共有\u003cimg data-k=\"9da9457ea1ef\">种分配方法； \n②甲地5人、乙地5人，共有\u003cimg data-k=\"b02702319cc7\">种分配方法；\n③甲地6人，乙地4人，共有\u003cimg data-k=\"b065ba207bfe\">种分配方法。\n则题干所求为\u003cimg data-k=\"10a50fb7b6c4\">。\n故正确答案为D。","no":52,"missingImage":false},{"type":"question","qid":"2434236","cat":"数学运算","stem":"甲、乙两车分别以30公里/小时和40公里/小时的速度同时匀速从A地开往B地，丙车以50公里/小时的速度匀速从B地开往A地。A、B两地距离120公里。问丙车遇到乙车后多久会遇到甲车？（    ）","options":{"A":"8分钟","B":"10分钟","C":"12分钟","D":"15分钟"},"answer":"B","explanation":"根据题意，本题有两个相遇过程，在每个过程中两车从两端同时出发再相遇，则两车所走路程和为A、B两地的距离。根据\u003cimg data-k=\"8d2f0dfd6fc0\">，可得：丙车和乙车的相遇时间\u003cimg data-k=\"3f31e216161e\">小时，丙车与甲车的相遇时间\u003cimg data-k=\"128219318eae\">小时。则题干所求为\u003cimg data-k=\"834949b1180b\">小时\u003cimg data-k=\"3b215c092c04\">分钟。\n故正确答案为B。","no":53,"missingImage":false},{"type":"question","qid":"2434243","cat":"数学运算","stem":"某单位有四个部门共173人，其中销售部比办公室多25人；客服部比销售部少9人；技术部的人数是客服部的两倍。问客服部有多少人？（    ）","options":{"A":"22","B":"36","C":"44","D":"51"},"answer":"B","explanation":"根据题意，设客服部的人数为\u003cimg data-k=\"5320a525f2bc\">，则技术部的人数为\u003cimg data-k=\"5b8c4ddfee22\">、销售部为\u003cimg data-k=\"99d528a99430\">、办公室为\u003cimg data-k=\"b3c6e78d40dc\">。由于四个部门共173人，则\u003cimg data-k=\"555c6461a23c\">，解得\u003cimg data-k=\"d028c5f6ef01\">，即客服部有36人。\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"2434246","cat":"数学运算","stem":"某健身馆准备将一块周长为100米的长方形区域划为瑜伽场地，将一块周长为160米的长方形区域划为游泳场馆。若瑜伽场地和游泳场馆均是满足周长条件下的最大面积。问两块场地面积之差为多少平方米？（    ）","options":{"A":"625","B":"845","C":"975","D":"1150"},"answer":"C","explanation":"设瑜伽场地的长为\u003cimg data-k=\"5320a525f2bc\">，则宽为\u003cimg data-k=\"fe2301dca078\">，面积为\u003cimg data-k=\"446056381539\">，当\u003cimg data-k=\"a8129ccdffd5\">时，面积最大，最大值为625平方米。同理，设游泳场馆的长为\u003cimg data-k=\"c1beececd683\">米,则宽为\u003cimg data-k=\"33f15d24eaf5\">，面积为\u003cimg data-k=\"90b1fcd48e55\">，当\u003cimg data-k=\"dc4575e07365\">时，面积最大，最大值为1600平方米。则题干所求为\u003cimg data-k=\"b5aa20a92322\">平方米。\n知识扩展：若长方形的周长一定，则当长和宽相等时，面积最大。\n故正确答案为C。","no":55,"missingImage":false},{"type":"question","qid":"2434250","cat":"数学运算","stem":"某超市购入800斤桃子，第一天售价为进价的1.8倍，销售额为1620元；第二天售价为进价的1.5倍，销售额为900元；第三天售价为进价的1.2倍，第四天以进价的八折销售，两天销售额均为360元；第四天营业结束后发现还剩50斤未卖出。问该超市购买桃子花了多少钱？（    ）","options":{"A":"2240元","B":"2400元","C":"2800元","D":"3040元"},"answer":"B","explanation":"根据题意，设超市购买桃子的单价为\u003cimg data-k=\"5320a525f2bc\">元/斤。则第一天售价为\u003cimg data-k=\"656dc6b4deb2\">元/斤；第二天为\u003cimg data-k=\"f97579604387\">元/斤；第三天为\u003cimg data-k=\"395bd279571b\">元/斤；第四天为\u003cimg data-k=\"10e2d500f7f5\">元/斤。根据桃子总质量为800斤，可列方程：\u003cimg data-k=\"6d4b0b0da27a\">\u003cimg data-k=\"7d3dfe76044a\">，化简
