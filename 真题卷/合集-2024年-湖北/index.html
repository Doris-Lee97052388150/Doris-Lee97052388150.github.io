"022bd960317a\" style=\"max-width:320px\">","options":{"A":"2","B":"3","C":"4","D":"6"},"answer":"B","explanation":"设小李骑行外圆（乐道）的半径为R、妈妈步行内圆（福道）的半径为r，如下图所示：\n\u003cimg data-k=\"24e0bf8553f5\" style=\"max-width:314px\">\n设小李骑行外圆一周的时间为t，则妈妈步行内圆一周的时间为4t。因两人的路程分别为内外两圆的周长，则可列式：\u003cimg data-k=\"09cceaf5750a\">······①，\u003cimg data-k=\"4de5763cf7a2\">······②，根据A、B两点间距离为50米，即R=r+50，联立①②式，解得r=100米，则湖面面积（图中内圆面积）\u003cimg data-k=\"923559c3dbca\">。\n故正确答案为B。","no":67,"missingImage":false},{"type":"question","qid":"16593223","cat":"数学运算","stem":"某单面圆形交通禁停标志牌如图所示，标志牌直径为60cm，牌中各处红色区域宽度均为5cm，某工厂承接30个该种标志牌的喷绘业务，已知每个标志牌的蓝色区域喷绘价格是112.5元，红蓝区域喷绘单价相同（价格仅按面积计算），那么30个标志牌喷绘共需：\n\u003cimg data-k=\"e4e270e40c31\" style=\"max-width:514px\">","options":{"A":"3375元","B":"6000元","C":"6750元","D":"8437.5元"},"answer":"C","explanation":"\u003cimg data-k=\"2ab6add37eac\" style=\"max-width:526px\">\n如图所示，连接四块蓝色扇形区域的顶点DCEF构成一个边长为5cm的正方形，对角线DE的长度为\u003cimg data-k=\"abce77864e84\">cm。蓝色区域可平移拼成一个完整的圆形，蓝色圆形的直径则=大圆直径AB-5cm-5cm-DE=60cm-5cm-5cm-7cm=43cm。\n方法一：蓝色圆形的面积为\u003cimg data-k=\"f41d9f68c87a\">，整个标志牌的面积为\u003cimg data-k=\"0fb2eb9a8289\">，因为红蓝区域喷绘单价相同，则整个标志牌的喷绘单价相同，整个标志牌的喷绘价格为\u003cimg data-k=\"beaf7038920c\">元，30个标志牌的喷绘总价为219×30=6570元，根据选项选择最为接近的，对应C项。\n方法二：根据面积比等于相似比的平方，蓝色圆形和标志牌的直径比为43：60，则面积比为\u003cimg data-k=\"22069122ce2b\">，蓝色面积的喷绘价格为112.5元，则整个标志牌的喷绘价格为112.5×2=225元，30个标志牌的总价为225×30=6750元，对应C项。\n故正确答案为C。\n备注：1.如下图所示，\u003cimg data-k=\"8e1c50faf2e4\">为大圆直径=60，\u003cimg data-k=\"2f2e9a2b3011\">。本题容易将\u003cimg data-k=\"ef4e3ff6550f\">误认为60，误将小圆直径理解为60-5-5-5=45cm，进而计算误选B项。\n\u003cimg data-k=\"df89a7d64361\" style=\"max-width:400px\">\n2.本题方法一是较为精准的计算，选项无直接答案，C项接近；方法二为估算，估算结果刚好是C项。可能本题考查的思维就是估算，也可能就是命题有误。","no":68,"missingImage":false},{"type":"question","qid":"16592954","cat":"数学运算","stem":"莱洛三角形是以等边三角形三个顶点为圆心，边长为半径，在顶点的对边画弧所得的封闭图形，这种形状的钻头可钻出四角为圆弧的正方形的孔洞（如左下图所示）。现将某莱洛三角形钻头所钻孔洞近似为正方形，测得该正方形孔洞截面积为\u003cimg data-k=\"bae58f66c636\">（如右下图所示），则该钻头的截面积为：\n\u003cimg data-k=\"06b851c08bb5\" style=\"max-width:533px\">","options":{"A":"\u003cimg data-k=\"16e92dbe89c6\">","B":"\u003cimg data-k=\"2bcf67cfddd7\">","C":"\u003cimg data-k=\"c6419186d2a5\">","D":"\u003cimg data-k=\"f2a7d5711535\">"},"answer":"D","explanation":"如下图所示，扇形GEF与AC相切于点H，连接GH，则\u003cimg data-k=\"94b12a2abc94\">，且三角形GEF为正三角形，则GE=GF=EF=GH=AB，即三角形GEF的边长与正方形ABDC的边长相等。已知\u003cimg data-k=\"a8cb3dd64ad7\">，则EF=AB=5cm，\u003cimg data-k=\"5074d2575fd8\">。由于正三角形内角为\u003cimg data-k=\"86c1f89cc9f5\">，\u003cimg data-k=\"6e9a29b49cb8\">，则所求钻头的截面积\u003cimg data-k=\"f8ef01e1d728\">\u003cimg data-k=\"9518bc932334\">\u003cimg data-k=\"f5d3e0fecbc0\">。\n\u003cimg data-k=\"9e075890ccf3\" style=\"max-width:241px\">\n故正确答案为D。","no":69,"missingImage":false},{"type":"question","qid":"16592942","cat":"数学运算","stem":"A、D两地设有通信基站（如下图所示），发射信号范围分别是以A、D为圆心，AE和DB为半径的圆形区域，小林从B地出发，沿与DB垂直的BA方向匀速行进，步行速度为4千米/小时，那么步行约多少分钟后小林的手机能够重新接收到信号？（\u003cimg data-k=\"db79566a27d9\">）\n\u003cimg data-k=\"c8fc448ab167\" style=\"max-width:481px\">","options":{"A":"8","B":"10","C":"12","D":"14"},"answer":"C","explanation":"根据题意可知，扇形AEC和扇形DEB分别被A、D两地的通信基站发射的信号所覆盖，故小林由B点出发后，手机就不能接收到信号，沿与DB垂直的BA方向匀速行进到C点后手机可以重新接收到信号。根据勾股定理可得\u003cimg data-k=\"33b99ec333fa\">km，又由DE=DB=1km，可得\u003cimg data-k=\"d367409c12ae\">\u003cimg data-k=\"a4ec5f9e6e95\">km，故\u003cimg data-k=\"88dba90c49a2\">\u003cimg data-k=\"14cd87e422ee\">km；根据题意，需要计算小林步行走BC的时间，步行速度为4km/小时，BC=0.77km，故所需时间为\u003cimg data-k=\"9a58dc1aa065\">分钟。\n故正确答案为C。","no":70,"missingImage":false}],"count":15,"answerable":15,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"16593204","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"192ac635ed44\" style=\"max-width:500px\">","options":{"A":"①④⑥，②③⑤","B":"①②③，④⑤⑥","C":"①⑤⑥，②③④","D":"①②⑥，③④⑤"},"answer":"D","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。题干出现“日”字和“田”字变形图、交圆切圆变形图，优先考虑笔画数。观察发现，图①②⑥的笔画数均为1，图③④⑤的笔画数均为2，即图①②⑥为一组，图③④⑤为一组。\n故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"16593026","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"2484be947de2\" style=\"max-width:500px\">","options":{"A":"①④⑥，②③⑤","B":"①②③，④⑤⑥","C":"①⑤⑥，②③④","D":"①③⑤，②④⑥"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，且题干出现很多等腰三角形，优先考虑对称性。观察发现，图②③④均是轴对称图形，图①⑤⑥均不是轴对称图形，即图①⑤⑥为一组，图②③④为一组。\n\u003cimg data-k=\"48e131fefe36\" style=\"max-width:500px\">\n故正确答案为C。\n注1：可能有部分同学根据对称轴数量是1还是3将题干分为①③⑤一组和②④⑥一组，然而本题图①、图⑥均存在由斜线构成的阴影，考虑到斜线也是图形的一部分，而斜线之间并不对称，因此认为图①和图⑥均不是轴对称图形。此外，若认为图⑤存在从右上到左下的对称轴，则画出该“对称轴”后，可以发现“对称轴”两侧的线条并不完全对应等长，图⑤也不是轴对称图形。\n注2：分组分类题目优先考虑两组图形分别具有各自的规律，无法分成具有各自规律的两组时，才考虑将图形分成一组具有该规律，一组不具有该规律。","no":72,"missingImage":false},{"type":"question","qid":"16593205","cat":"图形推理","stem":"左边为给定的立体图形，从任一角度观看，下面哪项不是该多面体的视图？\n\u003cimg data-k=\"3bcba9a6247d\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查三视图。如下图所示，A、B、D三项按图中箭头方向观察，均可看到，排除；\n\u003cimg data-k=\"c4ea5d833f38\" style=\"max-width:600px\">\nC项为从上往下观察该立体图形，看到的视图正中间应为一条长横线，如下图所示，该项视图错误，当选。\n\u003cimg data-k=\"9b1ed63f9fa3\" style=\"max-width:67px\">\n本题为选非题，故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"16593023","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"c098baeb4e76\" style=\"max-width:400px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"九宫格横行观察无规律，但竖着看发现，相同线条重复出现，优先考虑样式规律中的加减同异。第一列图1和图2求异得到图3；经验证，第二列满足此规律；第三列应用此规律，故“？”处应选择图1和图2求异得到的图形，只有D项符合。\n故正确答案为D。","no":74,"missingImage":false},{"type":"question","qid":"16593126","cat":"图形推理","stem":"下列两图分别是从正面和后面观察某个多面体所得的立体图形，下列哪项是其正确的外表面展开图？\n\u003cimg data-k=\"e1f8cfd61ca4\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题为空间重构题。\n由题干立体图形可知，存在3个灰色面，因此展开图中也应有3个灰色面，排除B项。\n继续观察发现，本题图形存在唯一且明显的大L型面（即底面），将其标记为面e。观察A、C、D三项，可以发现灰色面与面e的相邻关系不同，在立体图形中，从正面观察面e，面e最右侧的边（最凸出的顶端）与白色长方形面相邻，不与灰色面相邻，而C、D两项中面e最凸出的顶端均与灰色面相邻，因此排除C、D两项。\n\u003cimg data-k=\"1e51b02be913\" style=\"max-width:570px\">\n故正确答案为A。","no":75,"missingImage":false},{"type":"question","qid":"16592932","cat":"定义判断","stem":"蒸发冷却是一种通过水的蒸发来冷却空气的过程，即水会吸收空气的热量而蒸发从而冷却空气。空气越干燥，其容纳水分的能力越强，当用水喷淋空气时，则空气温度的降低幅度越大。如果采用温度更低的自来水或井水，其空气的降温效果更佳。\n根据上述定义，下列未体现蒸发冷却的是:","options":{"A":"用喷水壶装满冰凉刺骨的井水，然后喷淋房屋周边","B":"在逆风处设置风井，使空气沿风井流入楼内喷泉处","C":"沿海国家在风口建造风车，利用空气流动驱动扇叶","D":"将冷水输送到屋顶，冷水从房檐四周流下形成水帘"},"answer":"C","explanation":"第一步：找出定义关键词。\n“水会吸收空气的热量而蒸发从而冷却空气”。\n第二步：逐一分析选项。\nA项：用喷水壶装满冰凉刺骨的井水喷淋房屋周边时，水接触到空气会吸收空气中的热量而蒸发，从而冷却空气，符合“水会吸收空气的热量而蒸发从而冷却空气”，符合定义，排除；\nB项：在逆风处设置风井，使空气沿风井流入楼内喷泉处时，喷泉中的水接触到空气会吸收空气中的热量而蒸发，从而冷却空气，符合“水会吸收空气的热量而蒸发从而冷却空气”，符合定义，排除；\nC项：沿海国家在风口建造风车，利用空气流动驱动扇叶时，没有体现水会接触到空气而蒸发，不符合“水会吸收空气的热量而蒸发从而冷却空气”，不符合定义，当选；\nD项：将冷水输送到屋顶，冷水从房檐四周流下形成水帘时，水接触到空气会吸收空气中的热量而蒸发，从而冷却空气，符合“水会吸收空气的热量而蒸发从而冷却空气”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":76,"missingImage":false},{"type":"question","qid":"16593013","cat":"定义判断","stem":"在统计学中，生态谬误是指用一种高层次的分析单位做调查，却用另一种低层次的分析单位做结论，即运用数据时错误地将整组的汇总结果应用到组内的单位中。\n根据以上定义，下列属于生态谬误的是：","options":{"A":"一项调研发现甲地居民的收入普遍比乙地居民的收入更高，由此认为甲地教师的收入高于乙地教师的收入","B":"服务业占比大的区域比服务业占比小的区域更容易吸引高层次人才，由此认为服务业占比大的区域高层次人才更多","C":"某杂志开设了读者意见反馈邮箱，几天后收到28个不喜欢时装栏目的反馈邮件。某编辑认为有读者不喜欢，就一定有读者喜欢","D":"某公司规定，上一年工资数额在公司前6%的要降低工资，小王上一年的工资低于公司的平均水平，可以推出小王今年的工资可能降低"},"answer":"A","explanation":"第一步：找出定义关键词。\n“运用数据时错误地将整组的汇总结果应用到组内的单位中”。\n第二步：逐一分析选项。\nA项：根据“甲地居民普遍比乙地居民的收入高”，得到“甲地教师比乙地教师的收入高”，即将整组数据的结果用来得到部分个体的结论，符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，符合定义，当选；\nB项：根据“服务业占比大的区域更容易吸引高层次人才”，得到“服务业占比大的区域高层次人才更多”，前后均为服务业占比大的区域和服务业占比小的区域的对比，不符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，不符合定义，排除；\nC项：根据“有28个不喜欢时装栏目的反馈邮件”，得到“有读者不喜欢，就一定有读者喜欢”，不涉及数据间的错误运用，不符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，不符合定义，排除；\nD项：根据“小王上一年的工资低于公司的平均水平”，得到“小王今年的工资可能降低”，前后均为小王的工资，是根据过去的数据推导现在的情况，不符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，不符合定义，排除。\n故正确答案为A。","no":77,"missingImage":false},{"type":"question","qid":"16593022","cat":"定义判断","stem":"湖陆风是指湖陆之间相互转换的热力环流现象。入夜以后，陆地降温速度比湖水快，近地面空气变冷变重，而湖水降温慢，温度比陆地高，空气暖而轻，形成上升气流，陆上气流流向湖心形成陆风。太阳升起后，陆地吸热和升温速度比湖水快，直至陆上空气升温形成上升气流，湖面空气流向陆地形成湖风。\n根据上述定义，下列诗句最能体现湖陆风现象的是：","options":{"A":"轮台九月风夜吼，一川碎石大如斗，随风满地石乱走","B":"潮没具区薮，潦深云梦田。朝随北风去，暮逐南风旋","C":"鸱枭养子庭树上，曲墙空屋多旋风","D":"鹊飞山月曙，蝉噪野风秋"},"answer":"B","explanation":"第一步：找出定义关键词。\n“湖陆之间相互转换的热力环流现象”。\n第二步：逐一分析选项。\nA项：诗句的意思是轮台九月整夜里狂风怒号，到处的碎石块块大如斗，狂风吹得斗大乱石满地走。诗句只涉及陆地上的风，没有涉及湖水，不符合“湖陆之间相互转换的热力环流现象”，不符合定义，排除；\nB项：诗句的意思是潮水沉没于太湖，潮水沉没于云梦泽里的田地，早上顺着北风驾船进入湖中打鱼采菱，傍晚乘着南风，可以毫不费力地驾船回家。诗句描写了湖水和陆地之间风的形成情况，符合“湖陆之间相互转换的热力环流现象”，符合定义，当选；\nC项：诗句的意思是庭院里的树上，凶猛的猫头鹰都养出了小雏；曲折的院墙，空荡的房屋，多有旋风翻卷。诗句只涉及陆地上的风，没有涉及湖水，不符合“湖陆之间相互转换的热力环流现象”，不符合定义，排除；\nD项：诗句的意思是曙光微明，月挂西山，鹊鸟出林，寒蝉在初秋的野外晨风中嘶声噪鸣。诗句只涉及陆地上的风，没有涉及湖水，不符合“湖陆之间相互转换的热力环流现象”，不符合定义，排除。\n故正确答案为B。","no":78,"missingImage":false},{"type":"question","qid":"16593020","cat":"定义判断","stem":"磁滞现象指的是磁场把未带磁性的铁磁性物质（如铁、钴、镍及其合金等）磁化，使之带有磁性，但外加磁场去除后，铁磁性物质的磁性也不会马上消除，仍保有磁性的现象。\n根据上述定义，下列属于磁滞现象的是：","options":{"A":"当水中溶解了某些铁磁性物质，水在强磁场下流过时，周围金属物体中会产生磁感应现象，金属中有电流流过","B":"由导线将电池、小灯泡、电流表、开关连接成闭合电路，闭合开关时，灯泡亮暗、电流表指针的指向等都会有变化","C":"电饭锅中的温控元件都有设置好的温度值，电饭锅运行达到一定温度后，感温磁钢会消磁，依靠弹簧的反作用力断开电源","D":"把烧红的铁片放置在子午线的方向，使铁分子顺着地球磁场方向排列，达到磁化目的，之后挪动铁片，铁分子仍然按照磁场方向排列"},"answer":"D","explanation":"第一步：找出定义关键词。\n“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”、“外加磁场去除后，铁磁性物质的磁性也不会马上消除”。\n第二步：逐一分析选项。\nA项：带有铁磁性物质的水在强磁场下流过时，周围的金属物体会产生磁感应现象，但未提及磁场去除后，是否还会有磁感应现象，不符合“外加磁场去除后，铁磁性物质的磁性也不会马上消除”，不符合定义，排除；\nB项：由导线将电池、小灯泡、电流表、开关连接成闭合电路，闭合开关时，灯泡亮暗、电流表指针指向会有变化，没有涉及磁化，不符合“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”，不符合定义，排除；\nC项：电饭锅运行达到设定温度后，感温磁钢会消磁，说明感温磁钢本身具有磁性，不符合“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”，不符合定义，排除；\nD项：把烧红的铁片放置在子午线方向，铁分子顺着地球磁场方向排列，磁场使铁片磁化，符合“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”，挪动铁片后铁分子仍然按照磁场方向排列，说明铁片磁性没有马上消除，符合“外加磁场去除后，铁磁性物质的磁性也不会马上消除”，符合定义，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"16593209","cat":"定义判断","stem":"政策合成谬误，是指从各部门来看，每项政策都是对的，组合起来实施时却是错的。政策分解谬误，是指不该分解的系统性任务被分解了，有的分解到各部门、各地方，有的分解到各个时间段。\n根据上述定义，下列属于政策分解谬误的是：","options":{"A":"为了让居民买得起房，某省各部门实施了一系列举措调控房价，几年后该省的房地产商数量明显减少","B":"为了推动乡村振兴，某乡镇决定帮扶辖区内村民养殖黑山羊，一年后黑山羊数量剧增，导致附近山林遭到破坏","C":"为了加快新能源产业的发展，某省出台政策鼓励居民购买电动汽车，半年后发现，该省范围内充电桩数量严重不足","D":"某地政府欲出台一部环境卫生管理条例，其中各部分内容被分配到相关部门草拟，但最终统筹草案后发现各部分之间难以衔接"},"answer":"D","explanation":"第一步：找出定义关键词。\n政策合成谬误：“从各部门来看，每项政策都是对的”、“组合起来实施时却是错的”；\n政策分解谬误：“不该分解的系统性任务被分解了”、“有的分解到各部门、各地方，有的分解到各个时间段”。\n第二步：逐一分析选项。\nA项：为了让居民买得起房，某省各部门实施了一系列举措调控房价，符合“从各部门来看，每项政策都是对的”，但几年后该省的房地产商数量明显减少，说明最终的结果可能并不好，符合“组合起来实施时却是错的”，符合“政策合成谬误”定义，不符合“政策分解谬误”定义，排除；\nB项：某乡镇决定帮扶辖区内村民养殖黑山羊，没有体现出政策被分解，不符合“不该分解的系统性任务被分解了”，不符合“政策分解谬误”定义，排除；\nC项：某省出台政策鼓励居民购买电动汽车，没有体现出政策被分解，不符合“不该分解的系统性任务被分解了”，不符合“政策分解谬误”定义，排除；\nD项：某地政府欲出台一部环境卫生管理条例，是一个系统性的任务，其中各部分内容被分配到相关部门草拟，符合“有的分解到各部门、各地方，有的分解到各个时间段”，但最终统筹后发现各部分难以衔接，说明该任务不应该被分解，符合“不该分解的系统性任务被分解了”，符合“政策分解谬误”定义，当选。\n故正确答案为D。","no":80,"missingImage":false},{"type":"question","qid":"16592979","cat":"定义判断","stem":"相变指的是物质微观粒子在不同聚集状态间的转变。在等温等压条件下，从一相转变为另一相时吸收或放出的热量是相变潜热。第一类相变是指伴有相变潜热和体积突变的相变。第二类相变则不伴有相变潜热和体积突变，但有热容跃变。\n根据上述定义，下列属于第一类相变的是：","options":{"A":"热致变色印刷工艺采用遇热可产生色变的物质，如金属碘化物、络合物等，制成油墨在印品上形成色变层","B":"在1个大气压\u003cimg data-k=\"51748cf53c00\">的情况下，1公斤的冰转变成同温度的水，要吸收79.6千卡的热量，与此同时体积亦收缩","C":"含羞草叶茎部的叶褥含有很多水分，当叶片振动时，叶褥中的水分流向其它地方，叶片逐渐干瘪蜷缩到一起","D":"核磁共振成像是通过使人体本身的磁场和仪器自身的磁性物质相互作用形成检测显影，进而查看到病变的位置"},"answer":"B","explanation":"第一步：找出定义关键词。\n相变：“物质微观粒子在不同聚集状态间的转变”；\n相变潜热：“在等温等压条件下”、“从一相转变为另一相时”、“吸收或放出的热量”；\n第一类相变：“伴有相变潜热和体积突变的相变”；\n第二类相变：“不伴有相变潜热和体积突变，但有热容跃变”。\n第二步：逐一分析选项。\nA项：热致变色印刷工艺采用“遇热”可产生色变的物质，“遇热”表明温度发生了变化，不符合“在等温等压条件下”，不符合“相变潜热”定义，故也不符合“伴有相变潜热和体积突变的相变”，不符合“第一类相变”定义，排除；\nB项：在1个大气压\u003cimg data-k=\"51748cf53c00\">的情况下，符合“在等温等压条件下”，1公斤的冰转变成同温度的水，符合“从一相转变为另一相时”，要吸收79.6千卡的热量，符合“吸收或放出的热量”，符合“相变潜热”定义，与此同时体积亦收缩，符合“伴有相变潜热和体积突变的相变”，符合“第一类相变”定义，当选；\nC项：当含羞草的叶片振动时，叶褥中的水分流向其它地方，叶片逐渐干瘪蜷缩到一起，不符合“物质微观粒子在不同聚集状态间的转变”，不符合“相变”定义，故也不符合“第一类相变”定义，排除；\nD项：核磁共振成像是通过使人体本身的磁场和仪器自身的磁性物质相互作用形成检测显影，进而查看到病变的位置，不符合“物质微观粒子在不同聚集状态间的转变”，不符合“相变”定义，故也不符合“第一类相变”定义，排除。\n故正确答案为B。","no":81,"missingImage":false},{"type":"question","qid":"16593213","cat":"定义判断","stem":"“嗜睡”是一种睡眠失调现象，患者会持续感到极端疲倦，昏昏欲睡，往往会在毫无预警的情况下睡着，甚至是在活动中途突然入睡。“醉睡”则指酒醒后并没有完全清醒的状态，“醉睡”往往伴随混乱、迷惑、甚至暴力反应和失忆。\n根据上述定义，下列选项未体现“嗜睡”或“醉睡”的是：","options":{"A":"昨夜雨疏风骤，浓睡不消残酒","B":"终日昏昏醉梦间，忽闻春尽强登山","C":"老眠早觉常残夜，病力先衰不待年","D":"临川税驾忽数月，嗜睡爱闲常闭门"},"answer":"C","explanation":"第一步：找出定义关键词。\n嗜睡：“睡眠失调现象”、“持续感到极端疲倦，昏昏欲睡”、“在毫无预警的情况下睡着”；\n醉睡：“酒醒后并没有完全清醒的状态”、“伴随混乱、迷惑、甚至暴力反应和失忆”。\n第二步：逐一分析选项。\nA项：诗句意思是昨夜雨下得稀疏，风刮得很急，酣睡一夜，然而醒来之后依然觉得还有一点酒意没有消尽，符合“酒醒后并没有完全清醒的状态”，符合“醉睡”定义，排除；\nB项：诗句意思是整日昏昏沉沉恍若梦中，忽然发现春天即将过去便强打精神登山赏景，符合“睡眠失调现象”、“持续感到极端疲倦，昏昏欲睡”，符合“嗜睡”定义，排除；\nC项：诗句意思是人老了之后晚上睡眠很少，常常很早就醒来，坐送残夜，等待天晓，因为有病，身体早早地衰老，恐怕不到致仕之年，就要告老还乡了，说的是年老之后睡眠变少，不符合定义，当选；\nD项：诗句意思是在临川休息住宿一晃几个月过去了，喜欢睡觉热爱闲适不被打扰，所以经常闭门谢客，符合“持续感到极端疲倦，昏昏欲睡”，符合“嗜睡”定义，排除。\n本题为选非题，故正确答案为C。","no":82,"missingImage":false},{"type":"question","qid":"16593009","cat":"定义判断","stem":"肿瘤侵犯，指的是肿块发展后引起相邻部位的反应和变化。肿瘤浸润，是指肿瘤细胞发展扩大透过原发部位的浆膜层转移到相邻组织和器官。肿瘤转移，指肿瘤由原发器官通过血液、淋巴等方式到达另一个远处器官。\n根据上述定义，下列属于肿瘤侵犯的是：","options":{"A":"宋阿姨近期体检发现患有乳腺癌，医生告知癌细胞已到达胸壁组织","B":"经检查，老赵的肺部有五个毛玻璃结节，医生提醒他要定期复查","C":"老王的胰腺肿瘤经过三个月的无效治疗已经蔓延到肝脏","D":"老张肺部的肿块碰触心脏薄膜，引起心包积液"},"answer":"D","explanation":"第一步：找出定义关键词。\n肿瘤侵犯：“肿块发展后引起相邻部位的反应和变化”；\n肿瘤浸润：“肿瘤细胞发展扩大透过原发部位的浆膜层转移到相邻组织和器官”；\n肿瘤转移：“肿瘤由原发器官通过血液、淋巴等方式到达另一个远处器官”。\n第二步：逐一分析选项。\nA项：癌细胞到达了胸壁组织，但无法确定是否引起了胸壁组织的反应和变化，不符合“引起相邻部位的反应和变化”，不符合“肿瘤侵犯”定义，排除；\nB项：检查出老赵的肺部有结节，并未涉及其他部位，不符合“肿块发展后引起相邻部位的反应和变化”，不符合“肿瘤侵犯”定义，排除；\nC项：胰腺肿瘤蔓延到了肝脏，但无法确定是否引起了肝脏的反应和变化，不符合“引起相邻部位的反应和变化”，不符合“肿瘤侵犯”定义，排除；\nD项：肺部肿块碰触心脏薄膜，符合“肿块发展”，引起心包积液，符合“引起相邻部位的反应和变化”，符合“肿瘤侵犯”定义，当选。\n故正确答案为D。","no":83,"missingImage":false},{"type":"question","qid":"16592930","cat":"定义判断","stem":"生物学重复是指对不同生物个体或者不同生物群体的样品采用相同的处理方式进行实验。技术重复则是指对同一样品进行的多次相同实验。\n根据上述定义，下列属于生物学重复的是：","options":{"A":"采集小王的血样一次并采用三种不同方式分别进行一次检测","B":"采用三种不同方式对分三次采集的小王血样各进行一次检测","C":"采集小王、小李、小张三人的血样并用同样方式分别进行一次检测","D":"采集小王、小李、小张三人的血样混合后用三种方式进行三次检测"},"answer":"C","explanation":"第一步：找出定义关键词。\n生物学重复：“不同生物个体或者不同生物群体的样品”、“采用相同的处理方式”；\n技术重复：“同一样品”、“多次相同实验”。\n第二步：逐一分析选项。\nA项：仅采集小王的血样一次，不符合“不同生物个体或者不同生物群体的样品”，采用三种不同方式，不符合“采用相同的处理方式”，不符合“生物学重复”定义，排除；\nB项：采用三种不同方式，不符合“采用相同的处理方式”，分三次采集的都是小王血样，不符合“不同生物个体或者不同生物群体的样品”，不符合“生物学重复”定义，排除；\nC项：采集小王、小李、小张三人的血样，符合“不同生物个体或者不同生物群体的样品”，用同样方式分别进行一次检测，符合“采用相同的处理方式”，符合“生物学重复”定义，当选；\nD项：用三种方式进行三次检测，不符合“采用相同的处理方式”，不符合“生物学重复”定义，排除。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"16592935","cat":"定义判断","stem":"供应商绿色压力是指企业供应商的环保意识和环保行为对企业绿色创新的影响。它会促使企业显著改进产品生产流程，以减少对自然资源的使用，并在产品生命周期内减少有害物质的释放。研究表明，供应商的绿色环保意识越强，绿色环保行为越主动，就越有可能通过供应链来影响链上企业的绿色创新行为。\n根据上述定义，下列属于供应商绿色压力的是:","options":{"A":"随着绿色意识的增强，消费者更愿意选择资源节约和环境友好的产品","B":"随着国家生态建设的推进，企业会更加谨慎地选择自己的下游客户","C":"供应商可以为链上企业提供“绿色创新”方面的资源和知识","D":"供应商的绿色环保行为倒逼企业进行绿色创新行为"},"answer":"D","explanation":"第一步：找出定义关键词。\n“企业供应商的环保意识和环保行为”、“对企业绿色创新的影响”。\n第二步：逐一分析选项。\nA项：随着绿色意识的增强，消费者更愿意选择资源节约和环境友好的产品，未提及企业，不符合“企业供应商的环保意识和环保行为”、“对企业绿色创新的影响”，不符合定义，排除；\nB项：随着国家生态建设的推进，企业会更加谨慎地选择自己的下游客户，未提及企业的环保意识和绿色创新行为，不符合“企业供应商的环保意识和环保行为”、“对企业绿色创新的影响”，不符合定义，排除；\nC项：供应商为链上企业提供“绿色创新”方面的资源和知识，但不明确是否对这些企业产生了绿色创新的影响，不符合“对企业绿色创新的影响”，不符合定义，排除；\nD项：供应商的绿色环保行为，符合“企业供应商的环保意识和环保行为”，倒逼企业进行绿色创新行为，符合“对企业绿色创新的影响”，符合定义，当选。\n故正确答案为D。","no":85,"missingImage":false},{"type":"question","qid":"16593027","cat":"类比推理","stem":"兵符：信物","options":{"A":"七律：绝句","B":"汉字：偏旁","C":"干戈：战争","D":"寒露：节气"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n兵符是古代帝王授予兵权和调发军队的信物，兵符是一种信物，二者为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：七律是律诗的一种，绝句和律诗均是格律诗的一种，七律和绝句不是种属关系，与题干逻辑关系不一致，排除；\nB项：偏旁是组成汉字的一部分，二者为组成关系，与题干逻辑关系不一致，排除；\nC项：干为防具，戈为武器，二者均为古代兵器，因此后以“干戈”用作兵器的通称，后来引申为指战争，干戈和战争为比喻象征义，与题干逻辑关系不一致，排除；\nD项：寒露，是二十四节气之第十七个节气，秋季的第五个节气，寒露是一种节气，二者为种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"16593010","cat":"类比推理","stem":"伸延：延伸","options":{"A":"登攀：攀登","B":"喜欢：欢喜","C":"生产：产生","D":"等次：次等"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n伸延，指的是伸展、延伸；延伸，指的是延长伸展，二者为近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：登攀，指攀援登高，也指进取；攀登，指的是抓住东西向上爬，也比喻不畏艰险,积极进取，二者为近义关系，与题干逻辑关系一致，保留；\nB项：喜欢，指的是对人或事物有好感或感兴趣，也指愉快、高兴；欢喜，指快乐、高兴，也指喜欢、喜爱，二者是近义关系，与题干逻辑关系一致，保留；\nC项：生产，指的是人们通过工具来创造各种生活和生产资料；产生，指的是由已有的事物中派生出新的事物，二者不是近义关系，与题干逻辑关系不一致，排除；\nD项：等次，指的是等级高下次序；次等，指的是第二等的，低于或次于最好的，二者不是近义关系，与题干逻辑关系不一致，排除。\n比较A、B两项，题干和A选项的词汇都只是动词，而B选项的欢喜既可以做动词也可以做形容词，故A项与题干逻辑关系更一致。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"16593036","cat":"类比推理","stem":"牡丹花：牵牛花","options":{"A":"金枪鱼：八爪鱼","B":"东北菜：黄花菜","C":"布谷鸟：啄木鸟","D":"变色龙：霸王龙"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“牡丹花”和“牵牛花”是两种不同的花，二者为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：“金枪鱼”是鱼类，而“八爪鱼”是软体动物，二者不是并列关系，与题干逻辑关系不一致，排除；\nB项：“东北菜”是东北地区的本土菜系，“黄花菜”是一种可以食用的植物，二者不是并列关系，与题干逻辑关系不一致，排除；\nC项：“布谷鸟”和“啄木鸟”是两种不同的鸟，二者为并列关系，与题干逻辑关系一致，当选；\nD项：“变色龙”是一种爬行动物，“霸王龙”是一种恐龙，而变色龙不是恐龙，二者不是并列关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":88,"missingImage":false},{"type":"question","qid":"16593054","cat":"类比推理","stem":"虫害：植物受损","options":{"A":"雾霾：慢性肺炎","B":"除名：查无此人","C":"赤潮：海水污染","D":"失眠：辗转反侧"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n虫害导致植物受损，二者为因果关系。\n第二步：判断选项词语间逻辑关系。\nA项：雾霾导致慢性肺炎，二者为因果关系，与题干逻辑关系一致，保留；\nB项：除名是使退出集体，从名册中除掉姓名，除名导致查无此人，二者为因果关系，与题干逻辑关系一致，保留；\nC项：赤潮是由于海洋富营养化，使某些浮游生物暴发性繁殖和高度密集所引起的海水变红的现象，一般是海水先被污染，然后再引发赤潮，海水污染导致赤潮，二者为因果关系，但顺序与题干相反，与题干逻辑关系不一致，排除；\nD项：辗转反侧指躺在床上翻来覆去地不能入睡，失眠和辗转反侧不是因果关系，与题干逻辑关系不一致，排除。\n对比A、B项，题干中“虫害”是自然现象，A项中“雾霾”也是自然现象，B项中“除名”不是自然现象，故A项更为合适。\n故正确答案为A。","no":89,"missingImage":false},{"type":"question","qid":"16593210","cat":"类比推理","stem":"网箱养殖：深海养殖","options":{"A":"网络设备：无线网卡","B":"成人教育：职业教育","C":"载人飞船：返回舱","D":"娱乐项目：剧本杀"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n有的网箱养殖是深海养殖，有的网箱养殖不是深海养殖，有的深海养殖是网箱养殖，有的深海养殖不是网箱养殖，二者为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：无线网卡是一种网络设备，二者为种属关系，与题干逻辑关系不一致，排除；\nB项：有的成人教育是职业教育，有的成人教育不是职业教育，有的职业教育是成人教育，有的职业教育不是成人教育，二者为交叉关系，与题干逻辑关系一致，当选；\nC项：返回舱是载人飞船的一部分，二者为组成关系，与题干逻辑关系不一致，排除；\nD项：剧本杀是一种娱乐项目，二者为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":90,"missingImage":false},{"type":"question","qid":"16593007","cat":"类比推理","stem":"锁骨：肋骨：坐骨","options":{"A":"头脑：头皮：头发","B":"腹腔：口腔：鼻腔","C":"盲肠：大肠：直肠","D":"颈椎：胸椎：腰椎"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n锁骨、肋骨、坐骨是三种不同的人体骨骼，三者为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：头脑由头发、头皮、肌肉、骨骼和脑体组成，后两词均与第一词构成组成关系，与题干逻辑关系不一致，排除；\nB项：腹腔、口腔、鼻腔是三种不同的人体部位，三者为并列关系，与题干逻辑关系一致，保留；\nC项：大肠是消化管的下段，可分为盲肠、阑尾、结肠、直肠和肛管5部分，第一词与第三词为并列关系，且均与第二词构成组成关系，与题干逻辑关系不一致，排除；\nD项：颈椎、胸椎、腰椎是三种不同的椎骨，三者为并列关系，与题干逻辑关系一致，保留。\n对比B、D两项，题干中锁骨、肋骨、坐骨所在的位置依次为从上到下，B项中腹腔、口腔、鼻腔所在的位置依次为从下到上，而D项中颈椎、胸椎、腰椎所在的位置依次为从上到下，因此D项与题干逻辑关系更为一致，当选。\n故正确答案为D。","no":91,"missingImage":false},{"type":"question","qid":"16592936","cat":"类比推理","stem":"热传递：热传导：热辐射","options":{"A":"隔离：冷却：灭火","B":"混合物：化合物：纯净物","C":"播种：撒播：条播","D":"说明文：举例子：作比较"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n热传递是物理学上的一个物理现象，是指由于温度差引起的热能传递现象，热传递主要存在三种基本形式：热传导、热辐射和热对流。热传导和热辐射为并列关系，分别与热传递构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：隔离和冷却是两种不同的灭火方式，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：混合物是指由两种或两种以上的单质或化合物混合而成的物质，化合物是指由两种或两种以上不同元素组成的纯净物，纯净物是指由一种单质或一种化合物组成的聚合物。混合物与纯净物为并列关系，化合物与纯净物为种属关系，与题干逻辑关系不一致，排除；\nC项：撒播是指把作物的种子均匀地撒在地里，必要时进行覆土的播种方式，条播是指沿着一条浅犁沟撒布种子的播种方式。撒播和条播是两种不同的播种方式，二者为并列关系，分别与播种构成种属关系，与题干逻辑关系一致，当选；\nD项：举例子和作比较是写说明文采用的两种不同的写作手法，二者为并列关系，分别与说明文构成对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":92,"missingImage":false},{"type":"question","qid":"16593015","cat":"类比推理","stem":"服装：唐装：西装","options":{"A":"刷牙：牙刷：牙膏","B":"豪车：赛车：轿车","C":"旗帜：国旗：红旗","D":"武术：太极拳：咏春拳"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n唐装和西装是两种不同的服装，后两词为并列关系，且均与第一词构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：牙刷和牙膏是刷牙时配套使用的工具，后两词为配套使用关系，与题干逻辑关系不一致，排除；\nB项：豪车、赛车和轿车是从不同的划分角度命名的汽车，三者互为交叉关系，与题干逻辑关系不一致，排除；\nC项：有的国旗是红旗，有的国旗不是红旗，有的红旗是国旗，有的红旗不是国旗，后两词为交叉关系，与题干逻辑关系不一致，排除；\nD项：太极拳和咏春拳是两种不同的武术，后两词为并列关系，且均与第一词构成种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":93,"missingImage":false},{"type":"question","qid":"16593030","cat":"类比推理","stem":"数字经济 对于 （    ） 相当于 （    ） 对于 人工智能","options":{"A":"信息工具 家用电器","B":"信息技术 无人驾驶","C":"数字资源 现代农业","D":"数字货币 远程医疗"},"answer":"B","explanation":"逐一代入选项。\nA项：数字经济是以新一代信息技术为依托的一种新经济形态，数字经济一定需要利用信息工具，二者为必然利用的对应关系；家用电器可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除；\nB项：数字经济一定需要利用信息技术，二者为必然利用的对应关系；无人驾驶一定需要利用人工智能，二者为必然利用的对应关系，前后逻辑关系一致，当选；\nC项：数字经济一定需要利用数字资源，二者为必然利用的对应关系；现代农业可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除；\nD项：数字经济的发展导致了数字货币的产生，二者为产物的对应关系；远程医疗可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":94,"missingImage":false},{"type":"question","qid":"16593000","cat":"类比推理","stem":"缘木求鱼 对于 （    ） 相当于 （    ） 对于 抱薪救火","options":{"A":"事与愿违 抽薪止沸","B":"南辕北辙 通宵达旦","C":"刻舟求剑 纵风止燎","D":"扬汤止沸 凿壁偷光"},"answer":"C","explanation":"逐一代入选项。\nA项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“事与愿违”指事情的发展与主观愿望相反，二者无明显逻辑关系；“抽薪止沸”意思是抽掉锅底下的柴火，使锅里的水不再翻滚，比喻从根本上解决问题，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者是反义关系，前后逻辑关系不一致，排除；\nB项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“南辕北辙”指心里想往南去，却驾车往北走，比喻行动和目的相反，二者无明显逻辑关系；“通宵达旦”指的是从入夜直到天亮，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“刻舟求剑”比喻看问题做事情死板不灵活，不知情随势变，二者是近义关系；“纵风止燎”指的是用鼓风的方法灭火，比喻本欲消弭其事，却反而助长其声势，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者是近义关系，前后逻辑关系一致，当选；\nD项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“扬汤止沸”指把锅里烧的沸水舀起来再倒回去，想叫它不沸腾，比喻办法不对头，不能从根本上解决问题，二者是近义关系；“凿壁偷光”原指西汉匡衡凿穿墙壁引邻舍之烛光读书，后用来形容家贫而读书刻苦，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":95,"missingImage":false},{"type":"question","qid":"16593021","cat":"逻辑判断","stem":"对世界上最常见的火山类型而言，含水量较高的岩浆往往储存在地壳更深处。水在很大程度上引发并助长了火山爆发，岩浆的含水量越多，岩浆上升得越快，喷发就越猛烈。此时，岩浆的浮力不再是岩浆喷发的关键，岩浆中越多的水分含量才意味着越多的气泡和潜在更猛烈的喷发。\n以下哪项如果为真，最能加强上述研究发现？","options":{"A":"岩浆之所以能通过地壳裂缝上升，是因为岩浆比周围岩石的浮力更大","B":"若除水外还有额外的浮力，也会在火山被触发时将更多的岩浆带到地面","C":"水和岩浆的混合物在上升过程中有时会发生脱气现象，使混合物变得更加粘稠，导致上升缓慢甚至停滞","D":"水和岩浆的混合物储存在火山中，当岩浆上升到地表附近后，压力下降就会形成气泡，气泡迅速膨胀导致岩浆喷射而出"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：水在很大程度上引发并助长了火山爆发，岩浆的含水量越多，岩浆上升得越快，喷发就越猛烈。此时，岩浆的浮力不再是岩浆喷发的关键，岩浆中越多的水分含量才意味着越多的气泡和潜在更猛烈的喷发。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是因为岩浆浮力更大，所以岩浆能上升，强调了浮力对岩浆上升的重要性，而论点说的是岩浆的含水量越多则岩浆喷发得越猛烈，浮力并不是岩浆喷发的关键，削弱论点，无法加强，排除；\nB项：该项说的是除水之外的浮力对岩浆喷发的影响，而论点讨论的是岩浆的含水量对岩浆喷发的影响，为无关项，无法加强，排除；\nC项：该项说的是水和岩浆的混合物有时会导致岩浆上升缓慢，而论点说的是岩浆的含水量越多则岩浆喷发得越猛烈，削弱论点，无法加强，排除；\nD项：该项说的是水和岩浆的混合物在上升到地表附近后会因为压力下降形成气泡，气泡迅速膨胀导致岩浆喷射，解释了水越多就意味着气泡越多，进而会造成岩浆的猛烈喷发，补充论据，可以加强，当选。\n故正确答案为D。","no":96,"missingImage":false},{"type":"question","qid":"16592940","cat":"逻辑判断","stem":"某智库调查表明，某省2022年的长租房成交量呈不断上涨的趋势，排在全国前列，成交总量超过3000套，较去年增长超过40%，有效解决了新市民、青年人等群体的住房难题。因此有专家认为，加快发展长租房市场是我国解决住房难题的一剂良药。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"长租房市场发展时间短，目前缺乏有效监管","B":"2022年，我国的长租房市场规模已达1.73万亿元","C":"长租房无法享受与购房者同等的公共服务，在一二线城市难以推广","D":"有数据表明，我国租赁人口约有2.2亿，占流动人口总数的90%左右"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：加快发展长租房市场是我国解决住房难题的一剂良药。\n论据：某省2022年的长租房成交量呈不断上涨的趋势，排在全国前列，成交总量超过3000套，较去年增长超过40%，有效解决了新市民、青年人等群体的住房难题。\n本题的论点和论据均在讨论发展长租房能有效解决住房难题，二者话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项说的是长租房市场缺乏有效监管，论点说的是发展长租房能有效解决住房难题，话题不一致，无法削弱，排除；\nB项：该项说的是我国长租房市场的规模比较大，论点说的是发展长租房能有效解决住房难题，话题不一致，无法削弱，排除；\nC项：该项说的是长租房在一二线城市难以推广，说明发展长租房无法解决我国一二线城市的住房难题，削弱论点，可以削弱，当选；\nD项：该项说的是我国租赁人口多、占流动人口的比例大，说明我国租房需求大，需要发展租赁市场，补充论据，无法削弱，排除。\n故正确答案为C。","no":97,"missingImage":false},{"type":"question","qid":"16592994","cat":"逻辑判断","stem":"白居易在《荔枝图序》中言道：“若离本枝，一日而色变，二日而香变，三日而味变，四五日外，色香味尽去矣。”研究表明，荔枝难以保鲜是因为果实的呼吸强度很高，导致果实品质急剧下降。\n以下哪项如果为真，最能支持上述研究结论？","options":{"A":"荔枝的可食用部位不是像桃子那样的果皮，而是“假果皮”，它与外皮之间没有直接的维管束相连，外皮失水时不能直接从果肉处获得补充","B":"荔枝离枝后会继续分解糖分：氧气充足时，糖分会分解为二氧化碳；氧气不足时，糖分会转化为一些影响风味的醇、醛类物质","C":"荔枝自身会不断产生乙烯，加速果实成熟甚至腐烂，自然更容易变质","D":"荔枝花能产生花蜜，并且它们的蜜腺很发达，是很好的蜜源植物"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：荔枝难以保鲜是因为果实的呼吸强度很高，导致果实品质急剧下降。\n论据：无。\n本题只有论点没有论据，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：该项讨论的是荔枝的可食用部位是“假果皮”以及外皮失水时的情况，但外皮失水与论点中果实的呼吸强度无明确关联，话题不一致，无法加强，排除；\nB项：该项讨论的是荔枝离枝后会继续分解糖分，以及分别在氧气充足时和氧气不足时的糖分转化情况，说明荔枝的果实确实存在呼吸作用，补充论据，可以加强，当选；\nC项：该项讨论的是荔枝自身不断产生的乙烯会导致其变质，但乙烯的产生与论点中果实的呼吸强度无明确关联，话题不一致，无法加强，排除；\nD项：该项讨论的是荔枝花能产生花蜜，与论点中果实的呼吸强度完全无关，话题不一致，无法加强，排除。\n故正确答案为B。","no":98,"missingImage":false},{"type":"question","qid":"16593029","cat":"逻辑判断","stem":"河西走廊西部的荒原地处内陆，气候干燥，大部分地方都是戈壁沙漠，绿洲面积仅占总面积的很小一部分。千百年来，这里留下了一座又一座的古城址，它们有的彼此连缀，仿佛庞大的星座，有的则间断闪耀，形成多层结构。专家认为，水源变化是形成多个古城址的原因。\n以下哪项如果为真，最能支持上述专家的观点？","options":{"A":"河西走廊西部的部分地区素有“世界风库”之称，每年三分之一的时间刮着七级以上大风","B":"一旦水量减少，耕地很快会沙化，古城烟火无以为继，人们就会寻找新的绿洲再建一座城","C":"在1000多年的时间中，河西走廊骆驼城的地下水位下降了几十米","D":"在河西走廊，古城都是依水而建"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：水源变化是形成多个古城址的原因。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：该项讨论的是河西走廊部分地区每年的刮风情况，而论点讨论的是水源变化是否是形成多个古城址的原因，话题不一致，无法加强，排除；\nB项：该项讨论的是水量减少会引起耕地沙化，人们就会寻找新的绿洲再建一座城，所以一旦水源变化，那么就要换新城址，解释了为什么水源变化是形成多个古城址的原因，补充论据，可以加强，当选；\nC项：该项讨论的是在1000多年中，河西走廊骆驼城地下水位的变化，但是不明确其他城址的水源变化，无法判断水源变化是否是形成多个古城址的原因，为不明确项，无法加强，排除；\nD项：该项讨论的是在河西走廊，古城都是依水而建，说明河西走廊的古城都坐落在水源的附近，但是无法判断水源变化是否是形成多个古城址的原因，为不明确项，无法加强，排除。\n故正确答案为B。","no":99,"missingImage":false},{"type":"question","qid":"16593005","cat":"逻辑判断","stem":"长期只给中老年人提供一些对大脑神经系统有益的营养素，如DHA、抗氧化剂等，对预防脑力衰老似乎没有明显的效果，但改变整体的膳食模式则有利于延缓中老年人的认知退化。研究者发现地中海膳食和得舒膳食模式能保护老年人的认知能力。绿叶蔬菜、鱼类和全谷物是这两种膳食模式强调要充分摄入的三类核心食物。此外，还要严格限制油炸、高盐、甜食饮料等，因为它们不利于预防肥胖和三高，而这些则都是加剧认知退化的重要因素。\n以下哪项如果为真，最能支持上述研究发现？","options":{"A":"食用蔬果总量高的老年人认知能力保持得较好","B":"地中海膳食、得舒膳食等饮食模式有利于延缓认知退化","C":"预防脑力衰老仅靠摄入营养素或改变整体的膳食模式是不够的","D":"全谷物有利于控制血糖，绿叶蔬菜有利于改善血脂，鱼类所含的脂肪酸更易消化"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：地中海膳食和得舒膳食模式能保护老年人的认知能力。\n论据：绿叶蔬菜、鱼类和全谷物是这两种膳食模式强调要充分摄入的三类核心食物。此外，还要严格限制油炸、高盐、甜食饮料等，因为它们不利于预防肥胖和三高，而这些则都是加剧认知退化的重要因素。\n本题论点和论据都在说地中海膳食和得舒膳食模式与老年人认知之间的关系，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是蔬果总量高的老年人认知能力保持得较好，但论点中的地中海膳食和得舒膳食模式并没有强调摄入的蔬果总量要高，话题不一致，无法加强，排除；\nB项：该项说的是地中海膳食、得舒膳食等饮食模式有利于延缓认知退化，但没有详细展开说明这两种饮膳食模式如何延缓认知退化，只是简单对论点进行重复，可以加强，保留；\nC项：该项说的是预防脑力衰老不能仅靠摄入营养素或改变整体的膳食模式，而论点说的是地中海膳食和得舒膳食模式能否保护老年人的认知能力，话题不一致，无法加强，排除；\nD项：该项说的是全谷物、绿叶蔬菜、鱼类三种食物分别可以控制血糖、改善血脂、易被消化，说明按照论点中的两种膳食模式摄入的三类核心食物可以帮助控制三高（高血压、高血糖、高血脂），而论据中提到“三高是加剧认知退化的重要因素”，这表明地中海膳食和得舒膳食模式确实能延缓认知退化、保护老年人的认知能力，解释原因，可以加强，保留。\n对比B、D两项，B项只是重复论点，而D项解释说明了“膳食模式中的三类核心食物”与“三高”之间的关系，是对论证逻辑的补充，加强力度强于简单重复论点，故D项更为合适。\n故正确答案为D。","no":100,"missingImage":false},{"type":"question","qid":"16593208","cat":"逻辑判断","stem":"土楼是客家文化的象征，主要集中在福建。其实，在广东潮汕地区也存在大量土楼，仅潮州饶平县就有781座。潮汕的土楼始建于元代，盛于明清，迄今已有700余年的营造史。专家认为，土楼生于乱世，是应潮客先民们聚族而居，集体防卫的需要而产生的。\n要得到上述结论，需要补充的前提是：","options":{"A":"在古老的土楼守护下，家族得以躲过漫长岁月中的种种侵袭和战乱","B":"潮汕历史上有过漫长的山海动荡，从明至清屡遭山贼、海盗的侵扰","C":"千百年来，大量的客家人和闽南人从陆路和水路迁入潮汕，带去了土楼文化","D":"潮汕地区古有“无村不寨”的说法，曾有大量军事性、封闭型的围寨，类型多样"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：土楼生于乱世，是应潮客先民们聚族而居，集体防卫的需要而产生的。\n论据：无。\n本题只有论点没有论据，且提问方式为“前提”，加强优先考虑必要条件。\n第二步：逐一分析选项。\nA项：该项指出家族在土楼的守护下躲过侵袭和战乱，说明土楼有防卫的作用，补充论据，可以加强，保留；\nB项：该项指出潮汕从明至清屡遭侵扰，如果潮汕未在此时期内遭受侵扰，那么就无需建造土楼用于防卫，是论点成立的必要条件，可以加强，保留；\nC项：该项指出土楼文化是由客家人和闽南人带来的，并未说明土楼因何而生，无法加强，排除；\nD项：该项指出潮汕曾有类型多样的围寨，并未说明土楼是因何而生的，无法加强，排除。\n对比A、B两项，B项必要条件的加强力度大于A项的补充论据，B项当选。\n故正确答案为B。","no":101,"missingImage":false},{"type":"question","qid":"16593018","cat":"逻辑判断","stem":"心理学家曾做过一个实验，将被试者分为两组，给他们看同一张交通事故的照片，并询问有关车速的问题。对第一组问“你认为是以多快的速度相撞的”，而对第二组则问“你认为是以多快的速度猛烈撞击到一起的”。后者是让人想到撞击非常猛烈的表达方式。一周后，再询问被试者“汽车的挡风玻璃是否撞碎了”（实际上并没有撞碎）。结果显示，回答“是”的人，第二组的比例比第一组多两倍以上。心理学家由此得出结论：人类的记忆并不是固定的，而是根据之后获取的信息而变化。\n以下哪项如果为真，最能削弱心理学家的结论？","options":{"A":"第二组被试者的人数比第一组的多","B":"第二组被试者的记忆力本来就偏弱","C":"时隔一周再询问的合理性有待斟酌","D":"两组被试者在认知水平上没有差距"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：人类的记忆并不是固定的，而是根据之后获取的信息而变化。\n论据：让两组被试者看同一张交通事故的照片，并询问有关车速的问题。第二组的问题是让人想到撞击非常猛烈的表达方式。一周后，再询问被试者“汽车的挡风玻璃是否撞碎了”（实际上并没有撞碎）。结果显示，回答“是”的人，第二组的比例比第一组多两倍以上。\n本题论据是用实验表明回答不同的问题对人的记忆力存在影响，论点是基于此得出的结论，二者话题一致，削弱优先考虑削弱论点，且论据是对比实验，也可指出实验起点不一致或实验不可靠。\n第二步：逐一分析选项。\nA项：该项指出两组被试者的人数存在差异，但实验对比的是各组中回答“是”的比例，与各组被试者的人数无关，为无关项，无法削弱，排除；\nB项：该项指出第二组被试者的记忆力本来就“偏弱”，说明两组被试者的“记忆力”本身就存在差异，即实验起点不一致，可以削弱，当选；\nC项：该项指出时隔一周再询问的合理性“有待斟酌”，不明确时隔一周再询问对被试者的回答是否会产生影响，为不明确项，无法削弱，排除；\nD项：该项指出两组被试者在认知水平上没有差距，说明实验起点一致，为加强项，无法削弱，排除。\n故正确答案为B。","no":102,"missingImage":false},{"type":"question","qid":"16593064","cat":"逻辑判断","stem":"目前，研究人员已可以利用基因组编辑技术，破坏致病基因或插入外源基因，来预防或治疗疾病。艾滋病（AIDS）是具有免疫功能的淋巴细胞感染了艾滋病病毒（HIV）造成的，在感染淋巴细胞时，HIV通过识别淋巴细胞表面一种名为CCR5的蛋白质，以此为记号并进行侵入。研究人员可以从患者身上采集淋巴细胞，对其进行基因组编辑，再把编辑后的淋巴细胞送回患者体内，达到治疗效果。\n要得到上述结论，需要补充的前提是：","options":{"A":"CCR5基因是AIDS的相关基因","B":"患者的淋巴细胞可以由直系亲属的淋巴细胞代替","C":"HIV面对丧失功能的CCR5，会找到淋巴细胞上的另一种CXCR4细胞来侵入","D":"基因组编辑技术可以使CCR5基因丧失功能，这样HIV就无法感染淋巴细胞了"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：研究人员可以从患者身上采集淋巴细胞，对其进行基因组编辑，再把编辑后的淋巴细胞送回患者体内，达到治疗效果。\n论据：艾滋病(AIDS）是具有免疫功能的淋巴细胞感染了艾滋病病毒(HIV）造成的，在感染淋巴细胞时，HIV通过识别淋巴细胞表面一种名为CCR5的蛋白质，以此为记号并进行侵入。\n本题提问为“需要补充的前提”，优先考虑搭桥和必要条件。论据讨论的是“淋巴细胞表面的CCR5”，论点讨论的是“对淋巴细胞进行基因组编辑”，二者话题不一致，优先考虑搭桥，即建立“CCR5”和“基因组编辑”之间的关系。\n第二步：逐一分析选项。\nA项：CCR5基因是艾滋病相关的基因，也就说明论据中所提到的艾滋病病毒会通过识别CCR5来侵入是真的，补充论据，可以加强，保留；\nB项：患者的淋巴细胞可以由直系亲属的淋巴细胞代替，但是不知道对淋巴细胞进行编辑了之后，是否能够治疗艾滋病，话题不一致，无法加强，排除；\nC项：HIV面对丧失功能的CCR5，会找另一种细胞进行侵入，说的是HIV对人体的攻击，但是论点讨论的是通过基因组编辑是否可以治疗艾滋病，话题不一致，无法加强，排除；\nD项：基因组编辑技术可以使CCR5基因丧失功能，题干中提到HIV是通过识别CCR5来侵入，而现在基因组编辑技术可以使CCR5基因丧失功能，因此HIV无法感染淋巴细胞，达到治疗效果，为搭桥项，可以加强，保留。\n比较A、D两项，A项为补充论据，D项为搭桥，搭桥的力度大于补充论据，D项当选。\n故正确答案为D。","no":103,"missingImage":false},{"type":"question","qid":"16593211","cat":"类比推理","stem":"学校计划开展暑期夏令营活动，就陈老师和林老师是否担任夏令营带队老师，几个家长纷纷猜测：\n吴妈妈：如果陈老师没去带队，林老师肯定也没去；\n李妈妈：陈老师是这个夏令营活动的策划者，她一定会去带队；\n郑妈妈：你们等着看吧，陈老师和林老师至少有一个人会去；\n张妈妈：我认为林老师会去带队，陈老师要回家探亲不会去。\n结果发现其中两个妈妈猜对了，两个妈妈猜错了。请问猜对了的妈妈是：","options":{"A":"李妈妈和郑妈妈","B":"吴妈妈和张妈妈","C":"吴妈妈和李妈妈","D":"郑妈妈和张妈妈"},"answer":"D","explanation":"第一步：分析题干找关系。\n吴妈妈：\u003cimg data-k=\"0be436194951\">陈老师带队\u003cimg data-k=\"b3a86cb4840e\">林老师带队；\n李妈妈：陈老师带队；\n郑妈妈：陈老师带队 或 林老师带队；\n张妈妈：林老师带队 且 \u003cimg data-k=\"0be436194951\">陈老师带队。\n吴妈妈和张妈妈的猜测为矛盾关系，必有一真一假。\n第二步：看其余。\n根据题干可知，四人的猜测为两真两假，故李妈妈和郑妈妈也必有一真一假。若李妈妈的猜测为真，那么郑妈妈的猜测也为真，不符合一真一假，因此李妈妈的猜测为假，郑妈妈的猜测为真，即陈老师没带队，再结合“或关系否一推一”可知，林老师带队，进而可以得出张妈妈的猜测为真。\n故正确答案为D。","no":104,"missingImage":false},{"type":"question","qid":"16593011","cat":"类比推理","stem":"某单位由于工作需要，本周六必须安排赵、钱、孙、李、周、吴、郑7名工作人员值班，每个人都要值半天班，上午安排4人一起值班，下午安排3人一起值班。值班人员的分配满足下列条件：\n(1）赵和孙不在一起值班；\n(2）周和孙不在一起值班；\n(3）如果郑在下午值班，那么赵和李也在下午值班；\n(4）或者钱在上午值班，或者郑在下午值班。\n根据以上信息，必须在上午值班的工作人员是：","options":{"A":"钱和郑","B":"赵和郑","C":"赵和周","D":"吴和孙"},"answer":"A","explanation":"第一步：分析题干条件。\n(1）赵和孙不在一起值班；\n(2）周和孙不在一起值班；\n(3）郑下午值班\u003cimg data-k=\"a37757d411ef\">赵 且 李下午值班；\n(4）钱上午值班 或 郑下午值班；\n(5）上午4人值班，下午3人值班。\n第二步：根据题干条件进行推理。\n根据条件（1）（2）可知，赵和孙不在一起值班，周和孙也不在一起值班，那么赵和周在一起值班；结合条件（3），如果郑在下午值班，那么赵和李也在下午值班，此时周也应该在下午值班，下午值班的人数为4，与条件（5）矛盾，因此郑一定在上午值班；再结合条件（4），钱上午值班或郑下午值班，根据或关系“否一推一”可知，钱一定在上午值班，即钱和郑在上午值班。\n故正确答案为A。","no":105,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"572f6d88febc\" style=\"max-width:642px\">\u003c/p>\u003cp>\u003cimg data-k=\"fdb9b3b29f36\" style=\"max-width:642px\">\u003c/p>","questions":[{"qid":"10204589","cat":"增长","stem":"2019~2022年全国体育场地面积增长最快的年份是：","options":{"A":"2019年","B":"2020年","C":"2021年","D":"2022年"},"answer":"A","explanation":"根据题干“2019~2022年······增长最快的年份是”，可判定本题为一般增长率问题。定位统计图可知2018~2022年全国体育场地面积。根据公式：增长率\u003cimg data-k=\"7a919ee92a2e\">，则2019~2022年全国体育场地面积同比增长率分别为：\n2019年：\u003cimg data-k=\"2bc12fd3d63f\">；\n2020年：\u003cimg data-k=\"eac8be5e425e\">；\n2021年：\u003cimg data-k=\"ac1a05c1a757\">；\n2022年：\u003cimg data-k=\"f05162e8b871\">。\n比较发现，2019~2022年全国体育场地面积增长最快的年份是2019年。\n故正确答案为A。","no":106,"missingImage":false},{"qid":"16592939","cat":"综合","stem":"2022年全国每万人拥有的体育场地数量约为：","options":{"A":"26.2个","B":"29.9个","C":"34.7个","D":"39.4个"},"answer":"B","explanation":"根据题干“2022年全国每万人拥有的体育场地数量约为”，结合统计图给出2022年数据，可判定本题为现期平均数问题。定位统计图可知，2022年全国体育场地数量为422.68万个，全国体育场地面积为37.02亿平方米，人均体育场地面积为2.62平方米。因为人均体育场地面积\u003cimg data-k=\"c910f0dea355\">，所以2022年全国每万人拥有的体育场地数量\u003cimg data-k=\"2f034f5c5bbb\">\u003cimg data-k=\"6fe5134ae02f\">\u003cimg data-k=\"215c99b607a0\">\u003cimg data-k=\"6d06f9f92072\">个，与B项最接近。\n故正确答案为B。","no":107,"missingImage":false},{"qid":"16592944","cat":"综合","stem":"2022年，按体育场地类型的数量，从大到小排位第二的约占全国体育场地数量的：","options":{"A":"5.4%","B":"23.2%","C":"29.6%","D":"62.1%"},"answer":"C","explanation":"根据题干“2022年······约占······的”，结合材料时间为2022年，可判定本题为现期比重问题。定位统计图可得：2022年全国体育场地数量为422.68万个；定位表格可得2022年全国主要分项体育场地数量。则2022年各体育场地类型的数量分别为：\n基础大项场地，\u003cimg data-k=\"18d29a122a78\">万个；\n球类运动场地，\u003cimg data-k=\"a28cf14182c2\">\u003cimg data-k=\"520b22693043\">\u003cimg data-k=\"cdc9a46d71c7\">\u003cimg data-k=\"e09a82d9bab1\">万个；\n冰雪运动场地，1576+876=2452个；\n体育健身场地，\u003cimg data-k=\"fed57e81a0f1\">\u003cimg data-k=\"836588abbf0c\">万个。\n因此，按体育场地类型的数量从大到小排位第二的是体育健身场地。根据公式：比重\u003cimg data-k=\"155c064d29d7\">，则题干所求比重为\u003cimg data-k=\"7cbb84975cd0\">，与C项最接近。\n故正确答案为C。","no":108,"missingImage":false},{"qid":"16592945","cat":"综合","stem":"2022年，按运动项目划分场地数量之和最接近全国体育场地数量25%的是：","options":{"A":"游泳场地+全民健身路径","B":"健身步道+全民健身路径","C":"篮球场地+滑雪场地","D":"排球场地+乒乓球场地"},"answer":"D","explanation":"根据题干“2022年······之和最接近全国体育场地数量25%的是”，可判定本题为现期比重问题。定位统计图可知2022年全国体育场地数量为422.68万个；定位表格可知按运动项目划分场地数量。根据公式：部分=整体×比重，全国体育场地数量的25%为422.68×25%\u003cimg data-k=\"a0d475da1e05\">万个。各选项场地数量之和为：A项，3.60万个+98.02万个\u003cimg data-k=\"95e96bf4cc83\">万个；B项，12.78万个+98.02万个=110.8万个；C项，110.28万个+876个\u003cimg data-k=\"ac95daf9b2d8\">万个；D项，10.12万个+93.53万个\u003cimg data-k=\"7bb5bbebcfcb\">万个。分析可得，103.7万个与105.7万个差值最小，即排球场地与乒乓球场地数量之和最接近全国体育场地数量的25%。\n故正确答案为D。","no":109,"missingImage":false},{"qid":"16592947","cat":"综合","stem":"能够从上述资料推出的是：","options":{"A":"2022年全国每个体育场地平均面积大于900平方米","B":"2022年足球、篮球、排球场地数量之和少于体育健身场地数量","C":"2022年全国体育场地数量同比增速比2021年提高了2个百分点","D":"2022年全国主要分项体育场地数量占全国体育场地数量的95%以上"},"answer":"D","explanation":"A项：定位统计图可得，2022年全国体育场地数量为422.68万个，全国体育场地面积37.02亿平方米。则2022年全国每个体育场地平均面积\u003cimg data-k=\"d354cd59cc5e\">万平方米\u003cimg data-k=\"a8e6bd6cd233\">平方米＜900平方米，错误；\nB项：定位统计表可得，2022年全国足球场地13.59万个，篮球场地110.28万个，排球场地10.12万个；体育健身场地中，全民健身路径98.02万个，健身房14.29万个，健身步道12.78万个。则2022年足球、篮球、排球场地数量之和=13.59+110.28+10.12=133.99万个，体育健身场地数量=98.02+14.29+12.78=125.09万个，即足球、篮球、排球场地数量之和多于体育健身场地数量，错误；\nC项：定位统计图可得，2020-2022年全国体育场地数量分别为371.34万个、397.14万个、422.68万个。根据公式：增长率\u003cimg data-k=\"7a919ee92a2e\">，则2022年全国体育场地数量同比增速\u003cimg data-k=\"8f0cf7d32355\">，2021年全国体育场地数量同比增速\u003cimg data-k=\"b92ce960a888\">，后者分子大分母小，则2022年同比增速&lt;2021年同比增速，即2022年全国体育场地数量同比增速较2021年有所下降，错误；\nD项：定位统计图可得，2022年全国体育场地数量为422.68万个；定位统计表可得2022年全国主要分项体育场地数量。则2022年全国主要分项体育场地数量=19.74+3.60+13.59+110.28+10.12+93.53+24.61+10.53+0.1576+0.0876+98.02+14.29+12.78\u003cimg data-k=\"600da2a3d77d\">20+4+14+110+10+94+25+11+98+14+13=413万个。根据公式：比重\u003cimg data-k=\"155c064d29d7\">，可得2022年全国主要分项体育场地数量占全国体育场地数量的比重\u003cimg data-k=\"2d630e8c42ba\">，正确。\n故正确答案为D。","no":110,"missingImage":false}]},{"type":"material","material":"\u003cp>\u003cimg data-k=\"b302ee9e82c1\" style=\"max-width:626px\">\u003c/p>","questions":[{"qid":"16592975","cat":"增长","stem":"表格所列国家中，相较于2012年，2022年全球创新指数增长最快的国家是：","options":{"A":"美国","B":"中国","C":"英国","D":"印度"},"answer":"B","explanation":"根据题干“······相较于2012年，2022年······增长
