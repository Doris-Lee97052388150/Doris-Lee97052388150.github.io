<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2024-云南","title":"2024年云南公务员录用考试《行测》题（网友回忆版）","year":"2024","group":"云南","modules":[{"label":"政治理论","items":[{"type":"question","qid":"16593217","cat":"马克思主义","stem":"“周虽旧邦，其命维新”。习近平总书记指出，中国式现代化是中华民族的旧邦新命，必将推动中华文明重焕荣光。下列关于中国式现代化说法正确的有几项？\n①中国式现代化深深植根于中华优秀传统文化，体现科学社会主义的先进本质\n②中国式现代化借鉴吸收一切人类优秀文明成果，是一种全新的人类文明形态\n③中国式现代化是中国共产党领导的社会主义现代化，是文明更新的结果\n④中国式现代化蕴含的独特世界观、价值观、历史观、文明观、民主观、生态观等及其伟大实践，是对世界现代化理论和实践的重大创新\n⑤中华文明赋予中国式现代化以深厚底蕴，走中国式现代化道路，赋予中华文明以现代力量","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"D","explanation":"本题考查政治常识。\n①②正确，习近平总书记在学习贯彻党的二十大精神研讨班开班式上的重要讲话中指出：“中国式现代化，深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，展现了不同于西方现代化模式的新图景，是一种全新的人类文明形态。”\n③正确，党的二十大报告指出：“中国式现代化是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。”习近平总书记在文化传承发展座谈会的讲话中指出：“中国式现代化是赓续古老文明的现代化，而不是消灭古老文明的现代化；是从中华大地长出来的现代化，不是照搬照抄其他国家的现代化；是文明更新的结果，不是文明断裂的产物。”\n④正确，习近平总书记在学习贯彻党的二十大精神研讨班开班式上指出：“中国式现代化蕴含的独特世界观、价值观、历史观、文明观、民主观、生态观等及其伟大实践，是对世界现代化理论和实践的重大创新。”\n⑤正确，习近平总书记在文化传承发展座谈会的讲话中指出：“中国式现代化赋予中华文明以现代力量，中华文明赋予中国式现代化以深厚底蕴。中国式现代化是赓续古老文明的现代化，而不是消灭古老文明的现代化；是从中华大地长出来的现代化，不是照搬照抄其他国家的现代化；是文明更新的结果，不是文明断裂的产物。中国式现代化是中华民族的旧邦新命，必将推动中华文明重焕荣光。”\n故①②③④⑤正确，有5项。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"16593229","cat":"时事政治","stem":"党的二十大报告指出，我们要坚持以推动高质量发展为主题，把实施扩大内需战略同深化供给侧结构性改革有机结合起来，增强国内大循环内生动力和可靠性。下列关于扩大内需说法正确的有几项？\n①建立和完善扩大居民消费的长效机制，使居民有稳定收入能消费、没有后顾之忧敢消费、消费环境优获得感强愿消费\n②加快发展贸易新业态新模式，进一步发挥进出口对我国经济的支撑作用\n③深化供给侧结构性改革，形成供给牵引需求、需求创造供给的更高水平动态平衡\n④通过政府投资和政策激励有效带动全社会投资，形成有本金和债务约束的金融需求\n⑤鼓励和吸引更多民间资本参与国家重大工程和补短板项目建设，激发民间投资活力","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"B","explanation":"本题考查政治常识。\n①正确，习近平总书记在中共中央政治局就加快构建新发展格局进行第二次集体学习上强调，坚决贯彻落实扩大内需战略规划纲要，尽快形成完整内需体系，着力扩大有收入支撑的消费需求、有合理回报的投资需求、有本金和债务约束的金融需求。建立和完善扩大居民消费的长效机制，使居民有稳定收入能消费、没有后顾之忧敢消费、消费环境优获得感强愿消费。\n②错误，《国务院办公厅关于加快发展外贸新业态新模式的意见》中指出：“加快发展外贸新业态新模式，有利于推动贸易高质量发展。”可知，正确表述应是“外贸新业态新模式”，而非“贸易新业态新模式”。\n③错误，习近平总书记在中共中央政治局就加快构建新发展格局进行第二次集体学习上强调，要搞好统筹扩大内需和深化供给侧结构性改革，形成需求牵引供给、供给创造需求的更高水平动态平衡，实现国民经济良性循环。\n④正确，习近平总书记在《当前经济工作的几个重大问题》一文“（一）着力扩大国内需求”部分指出：“二是通过政府投资和政策激励有效带动全社会投资。当前，民间投资预期较弱，政府投资必须发挥好引导作用，这是应对经济周期性波动的有力工具······”在中共中央政治局就加快构建新发展格局进行第二次集体学习时又强调，坚决贯彻落实扩大内需战略规划纲要，尽快形成完整内需体系，着力扩大有收入支撑的消费需求、有合理回报的投资需求、有本金和债务约束的金融需求。\n⑤正确，2023年政府工作报告指出：“政府投资和政策激励要有效带动全社会投资，今年拟安排地方政府专项债券3.8万亿元，加快实施‘十四五’重大工程，实施城市更新行动，促进区域优势互补、各展其长，继续加大对受疫情冲击较严重地区经济社会发展的支持力度，鼓励和吸引更多民间资本参与国家重大工程和补短板项目建设，激发民间投资活力。”\n综上所述，①④⑤均说法正确，共3项。\n故正确答案为B。","no":2,"missingImage":false},{"type":"question","qid":"16593222","cat":"新思想","stem":"习近平法治思想是对中国共产党领导法治建设丰富实践和宝贵经验的科学总结，是一个内涵丰富、论述深刻、逻辑严密、系统完备的科学理论体系。下列关于习近平法治思想说法正确的有几项？\n①自由是秩序的目的，秩序是自由的保障\n②党的领导是社会主义法治之魂，是我国法治与西方资本主义国家法治最大的区别\n③发挥领导干部示范带头作用，努力使尊法学法守法用法在全社会蔚然成风\n④新闻媒体要加强对执法司法工作的监督，但对执法司法部门的正确行动，要予以支持，加强解疑释惑，进行理性引导\n⑤加强重点领域、新兴领域、涉外领域立法，统筹推进国内法治和涉外法治，以良法促进发展、保障善治","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"D","explanation":"本题考查政治常识。\n①正确，习近平总书记在第二届世界互联网大会开幕式上的讲话中指出：“推进全球互联网治理体系变革，应该坚持以下原则······构建良好秩序。网络空间同现实社会一样，既要提倡自由，也要保持秩序。自由是秩序的目的，秩序是自由的保障。我们既要尊重网民交流思想、表达意愿的权利，也要依法构建良好网络秩序，这有利于保障广大网民合法权益······”\n②正确，习近平总书记于2020年11月16日在中央全面依法治国工作会议上讲话的“第一，坚持党对全面依法治国的领导”中指出：“党的领导和依法治国不是对立的，而是统一的。我国法律充分体现了党和人民意志，我们党依法办事，这个关系是相互统一的关系。全党同志必须牢记，党的领导是我国社会主义法治之魂，是我国法治同西方资本主义国家法治最大的区别······”\n③正确，中共二十大报告在“七、坚持全面依法治国，推进法治中国建设”中指出：“（四）加快建设法治社会。法治社会是构筑法治国家的基础······推进多层次多领域依法治理，提升社会治理法治化水平。发挥领导干部示范带头作用，努力使尊法学法守法用法在全社会蔚然成风。”\n④正确，习近平总书记于2014年1月7日在中央政法工作会议上的讲话中强调：“政法机关要自觉接受媒体监督，以正确方式及时告知公众执法司法工作情况，有针对性地加强舆论引导。新闻媒体要加强对执法司法工作的监督，但对执法司法部门的正确行动，要予以支持，加强解疑释惑，进行理性引导，不要人云亦云，更不要在不明就里的情况下横挑鼻子竖挑眼······”\n⑤正确，中共二十大报告在“七、坚持全面依法治国，推进法治中国建设”中指出：“（一）完善以宪法为核心的中国特色社会主义法律体系······加强宪法实施和监督，健全保证宪法全面实施的制度体系，更好发挥宪法在治国理政中的重要作用，维护宪法权威。加强重点领域、新兴领域、涉外领域立法，统筹推进国内法治和涉外法治，以良法促进发展、保障善治······”\n故符合题意的是①②③④⑤，共5项。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"10204470","cat":"时事政治","stem":"党的二十大报告指出，优化民营企业发展环境，依法保护民营企业产权和企业家权益，促进民营经济发展壮大。下列关于促进民营经济发展措施与其发挥作用对应正确的是：\n①完善社会信用激励约束机制——发挥信用激励机制作用，提升信用良好企业获得感\n②完善融资支持政策制度——支持符合条件的民营企业上市融资，缓解民营企业资金问题\n③持续完善知识产权保护体系——严格落实侵权惩罚性赔偿，降低民营企业科技转化成本\n④健全民营经济人士思想政治建设机制——深入开展理想信念教育，确保构建亲近政商关系","options":{"A":"①②","B":"①③","C":"②④","D":"③④"},"answer":"A","explanation":"本题考查政治常识。\n2023年7月19日，《中共中央 国务院关于促进民营经济发展壮大的意见》发布。以下简称《意见》。\n①正确，《意见》在“二、持续优化民营经济发展环境”部分指出：“（三）完善社会信用激励约束机制。完善信用信息记录和共享体系，全面推广信用承诺制度，将承诺和履约信息纳入信用记录。发挥信用激励机制作用，提升信用良好企业获得感······”\n②正确，《意见》在“三、加大对民营经济政策支持力度”部分指出：“（五）完善融资支持政策制度。健全银行、保险、担保、券商等多方共同参与的融资风险市场化分担机制······推动民营企业债券融资专项支持计划扩大覆盖面、提升增信力度。支持符合条件的民营企业上市融资和再融资。”\n③错误，《意见》在“四、强化民营经济发展法治保障”部分指出：“（十二）持续完善知识产权保护体系。加大对民营中小微企业原始创新保护力度。严格落实知识产权侵权惩罚性赔偿、行为保全等制度。建立知识产权侵权和行政非诉执行快速处理机制，健全知识产权法院跨区域管辖制度。”而“降低民营企业科技转化成本”属于《意见》“五、着力推动民营经济实现高质量发展”部分中“（十六）支持提升科技创新能力”举措所对应的作用。\n④错误，《意见》在“六、促进民营经济人士健康成长”部分指出：“（二十一）健全民营经济人士思想政治建设机制。积极稳妥做好在民营经济代表人士先进分子中发展党员工作。深入开展理想信念教育和社会主义核心价值观教育。教育引导民营经济人士中的党员坚定理想信念，发挥先锋模范作用，坚决执行党的理论和路线方针政策。积极探索创新民营经济领域党建工作方式。”而关于“构建亲近政商关系”，《意见》中指出“（二十五）全面构建亲清政商关系。把构建亲清政商关系落到实处，党政干部和民营企业家要双向建立亲清统一的新型政商关系。”可知其与“健全民营经济人士思想政治建设机制”并无对应关系，且应该是构建“亲清政商关系”而不是“亲近政商关系”。\n故正确的是①②。\n故正确答案为A。","no":4,"missingImage":false},{"type":"question","qid":"16593149","cat":"新思想","stem":"无农不稳，无粮则乱。习近平总书记指出，农业强，首要是粮食和重要农产品供给保障能力必须强，下列举措属于提升粮食产能的有几项？\n①切实把种业振兴行动抓出成效，加快生物育种产业化步伐\n②完善农资保供稳价应对机制，稳定农民预期、降低生产风险\n③逐步把永久基本农田全部建成高标准农田，确保建一块成一块\n④制止“舌尖上的浪费”，深入开展“光盘行动”，提倡健康饮食\n⑤坚决守住18亿亩耕地红线，坚决遏制“非农化”，有效终止“非粮化”","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"C","explanation":"本题考查政治常识。\n2023年3月16日，第6期《求是》杂志发表习近平的重要文章《加快建设农业强国 推进农业农村现代化》。\n①③⑤正确，《加快建设农业强国 推进农业农村现代化》在“二、保障粮食和重要农产品稳定安全供给始终是建设农业强国的头等大事”部分指出：“提升粮食产能仍然是首要任务。我国粮食产量已经连续8年保持在1.3万亿斤高平台上，越往前走难度越大。要实施新一轮千亿斤粮食产能提升行动，抓紧制定实施方案，把任务落实下去。提产能关键还是抓耕地和种子两个要害。要坚决守住18亿亩耕地红线，坚决遏制‘非农化’、有效防止‘非粮化’。坚持良田粮用大原则，良田好土要优先保粮食，果树苗木尽量上山上坡，蔬菜园艺更多靠设施农业和工厂化种植。治理‘非粮化’政策性很强，要统筹考虑粮食生产和重要农产品保障、农民增收的关系，留出一定过渡期，加强政策引导。要逐步把永久基本农田全部建成高标准农田，尽快提出落实办法，该拿的钱要拿到位，建设质量和管护机制也要到位，确保建一块成一块。抓种子要选准突破口，持续发力、协同攻关，把种业振兴行动切实抓出成效，把当家品种牢牢攥在自己手里。生物育种是大方向，要加快产业化步伐。”\n②正确，《加快建设农业强国 推进农业农村现代化》在“二、保障粮食和重要农产品稳定安全供给始终是建设农业强国的头等大事”部分指出：“农民种粮能挣钱，粮食生产才有保障。要健全种粮农民收益保障机制，完善价格、补贴、保险‘三位一体’的政策体系，完善农资保供稳价应对机制，稳定农民预期、降低生产风险。”\n④错误，《加快建设农业强国 推进农业农村现代化》在“二、保障粮食和重要农产品稳定安全供给始终是建设农业强国的头等大事”部分指出：“保障粮食安全，要在增产和减损两端同时发力······消费环节大有文章可做，不仅要制止‘舌尖上的浪费’，深入开展‘光盘行动’，还要提倡健康饮食。”\n综上，①②③⑤四项属于提升粮食产能的措施。\n故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"10204477","cat":"时事政治","stem":"党的二十大报告指出，坚持按劳分配为主体、多种分配方式并存，构建初次分配、再分配、第三次分配协调配套的制度体系。关于完善收入分配格局，下列说法正确的是：\n①扩大中等收入群体比重，增加低收入群体收入，取缔过高收入，促进社会公平正义\n②构建知识、技术、数据等创新要素参与收益分配机制，优化初次分配格局\n③推动教育、养老、医疗、住房保障等基本公共服务均等化，逐步健全再分配机制\n④通过发展企业年金、职业年金等措施，发挥第三次分配重要作用","options":{"A":"①②","B":"①④","C":"②③","D":"③④"},"answer":"C","explanation":"本题考查政治常识。\n2022年12月，中共中央、国务院印发了《扩大内需战略规划纲要（2022-2035年）》（以下简称《纲要》）。\n①错误，《纲要》中“九、扎实推动共同富裕，厚植内需发展潜力”部分指出：“······坚持以人民为中心的发展思想，在高质量发展中促进共同富裕，正确处理效率和公平的关系，完善收入分配格局，构建初次分配、再分配、三次分配协调配套的基础性制度安排，加大税收、社保、转移支付等调节力度并提高精准性，扩大中等收入群体比重，增加低收入群体收入，合理调节高收入，取缔非法收入，促进社会公平正义，促进人的全面发展，增强内需发展后劲。”\n②正确，《纲要》中“九、扎实推动共同富裕，厚植内需发展潜力”部分的“（二十八）持续优化初次分配格局”中指出：“健全各类生产要素参与分配机制。构建知识、技术、数据等创新要素参与收益分配机制，强化以增加知识价值为导向的分配政策，发挥工资激励保障作用。”\n③正确，《纲要》中“九、扎实推动共同富裕，厚植内需发展潜力”部分的“（二十九）逐步健全再分配机制”中指出：“加大财税制度对收入分配的调节力度。健全直接税体系，完善综合与分类相结合的个人所得税制度，加强对高收入者的税收调节和监管。完善中央与地方财政事权和支出责任划分，推动教育、养老、医疗、住房保障等基本公共服务均等化。”\n④错误，《纲要》中“九、扎实推动共同富裕，厚植内需发展潜力”部分的“（二十九）逐步健全再分配机制”中指出：“健全社会保障制度。推进基本养老保险由制度全覆盖到法定人群全覆盖，完善灵活就业人员参加职工社会保险制度。发展企业年金、职业年金，规范发展第三支柱养老保险。”\n故②③表述正确。\n故正确答案为C。","no":6,"missingImage":false}],"count":6,"answerable":6,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"10204509","cat":"人文常识","stem":"中华文明源远流长，云娱乐中华民族的宝贵精神品格，*********，创造形成了引领中国社会发展进步的社会主义道德体系。下列古语符合社会主义道德体系建设要求的是：\n①见侮而不斗，辱也\n②百尺之室，以突隙之烟焚\n③躬自厚而薄责于人，则远怨矣\n④黑发不知勤学早，白首方悔读书迟","options":{"A":"①②","B":"①③","C":"②③","D":"③④"},"answer":"B","explanation":"略。","redacted":true,"no":7,"missingImage":false},{"type":"question","qid":"10204483","cat":"人文常识","stem":"下图是中国国家博物馆西大厅的巨型浮雕，与之相关说法错误的是：\n\u003cimg data-k=\"be8ddff46167\" style=\"max-width:600px\">","options":{"A":"“锲而不舍，金石可镂”是浮雕故事主人公的名言","B":"毛泽东在七大闭幕词中提到了浮雕中的故事","C":"浮雕是以徐悲鸿同名国画为原本创作而成的","D":"浮雕所展现的故事记载在《列子·汤问》中"},"answer":"A","explanation":"本题考查人文常识。\n图片为中国国家博物馆西大厅的巨型花岗岩浮雕“愚公移山”。\nA项错误，“锲而不舍，金石可镂”出自《荀子·劝学》，是儒家代表人物荀子的名言。意思是只要坚持不停地用刀刻，就算是金属玉石也可以雕出花饰。\nB项正确，1945年6月11日，在党的七大闭幕式上，毛泽东引用了愚公移山的故事：“现在也有两座压在中国人民头上的大山，一座叫做帝国主义，一座叫做封建主义。中国共产党早就下了决心，要挖掉这两座山。我们一定要坚持下去，一定要不断地工作，我们也会感动上帝的。这个上帝不是别人，就是全中国的人民大众。”\nC项正确，“愚公移山”浮雕以徐悲鸿客居印度时所作的国画《愚公移山》为原本，由雕塑家曾成钢主持创作，长36米，高12米，面积略大于一个标准的篮球场。\nD项正确，“愚公移山”是《列子·汤问》中一个神话传说：愚公因太行、王屋二山阻碍其出入，带领子孙想把山铲平。有人因此取笑他，他说：“虽我之死，有子存焉；子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？”他的言行感动了上天，两座山被搬走了。\n本题为选非题，故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"10204506","cat":"人文常识","stem":"2023年3月1日，兰某入职某公司，入职10天后兰某发现自己怀孕，于是经常迟到早退，有时还旷工，已经达到了员工手册规定的解聘条件。2023年5月30日公司宣布解聘兰某。对于公司的解聘行为，下列说法正确的是：","options":{"A":"公司有权解聘兰某，且无需支付经济补偿金","B":"公司有权解聘兰某，但必须支付经济补偿金","C":"兰某处于孕期，按照劳动法的规定，公司不得解聘","D":"公司违法解除与兰某的劳动关系，应当双倍支付经济补偿金"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，B、C、D三项错误，根据《中华人民共和国劳动合同法》第三十九条第二项规定：“劳动者有下列情形之一的，用人单位可以解除劳动合同：······（二）严重违反用人单位的规章制度的；······”第四十二条第四项规定：“劳动者有下列情形之一的，用人单位不得依照本法第四十条、第四十一条的规定解除劳动合同：······（四）女职工在孕期、产期、哺乳期的；······”第四十六条规定：“有下列情形之一的，用人单位应当向劳动者支付经济补偿：（一）劳动者依照本法第三十八条规定解除劳动合同的；（二）用人单位依照本法第三十六条规定向劳动者提出解除劳动合同并与劳动者协商一致解除劳动合同的；（三）用人单位依照本法第四十条规定解除劳动合同的；（四）用人单位依照本法第四十一条第一款规定解除劳动合同的；（五）除用人单位维持或者提高劳动合同约定条件续订劳动合同，劳动者不同意续订的情形外，依照本法第四十四条第一项规定终止固定期限劳动合同的；（六）依照本法第四十四条第四项、第五项规定终止劳动合同的；（七）法律、行政法规规定的其他情形。”\n题目中，兰某虽然怀孕，但违背了《中华人民共和国劳动合同法》第三十九条第二项的规定，用人单位可以解除劳动合同；同时《中华人民共和国劳动合同法》并未规定用人单位依照第三十九条的规定解除劳动合同的，需要支付经济补偿金。因此，兰某严重违反劳动纪律或者用人单位规章制度，公司有权解聘兰某，且无需支付经济补偿金。\n故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"10204495","cat":"人文常识","stem":"胡女士在甲公司APP上看到乙酒店某型客房贵宾优惠价为2889元后付款，次日却发现该房型当晚的实际挂牌价仅1377元。胡女士认为其作为贵宾客户却支付了高于实际价格的费用，遂将甲公司起诉至法院。关于此案，下列说法错误的是：","options":{"A":"甲公司存在价格欺诈行为，胡女士有权退一赔三","B":"甲公司向胡女士承诺贵宾优惠价，但未践行承诺，侵害了胡女士的公平交易权","C":"甲公司的行为导致胡女士遭受了不必要的经济损失，侵害了胡女士的财产安全权","D":"甲公司APP作为中介平台，其未如实标注该房型的真实价格，侵害了胡女士的知情权"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国消费者权益保护法》第五十五条第一款规定：“经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金额不足五百元的，为五百元。法律另有规定的，依照其规定。”《明码标价和禁止价格欺诈规定》第十九条第四项规定：“经营者不得实施下列价格欺诈行为：（四）销售商品或者提供服务时，使用欺骗性、误导性的语言、文字、数字、图片或者视频等标示价格以及其他价格信息；”因此，甲公司存在价格欺诈行为，胡女士有权退一赔三。\nB项正确，根据《中华人民共和国消费者权益保护法》第十条规定：“消费者享有公平交易的权利。消费者在购买商品或者接受服务时，有权获得质量保障、价格合理、计量正确等公平交易条件，有权拒绝经营者的强制交易行为。”甲公司该房型的价格并不合理，侵害了胡女士的公平交易权。\nC项错误，根据《中华人民共和国消费者权益保护法》第七条规定：“消费者在购买、使用商品和接受服务时享有人身、财产安全不受损害的权利。消费者有权要求经营者提供的商品和服务，符合保障人身、财产安全的要求。”甲公司的行为并未侵害胡女士的财产安全权。\nD项正确，根据《中华人民共和国消费者权益保护法》第八条规定：“消费者享有知悉其购买、使用的商品或者接受的服务的真实情况的权利。消费者有权根据商品或者服务的不同情况，要求经营者提供商品的价格、产地、生产者、用途、性能、规格、等级、主要成份、生产日期、有效期限、检验合格证明、使用方法说明书、售后服务，或者服务的内容、规格、费用等有关情况。”因此，甲公司APP作为中介平台，未如实标注该房型的真实价格，侵害了胡女士的知情权。\n本题为选非题，故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"16593165","cat":"法律常识","stem":"下列关于自首的判断说法正确的是：","options":{"A":"甲和乙共同实施盗窃犯罪，后甲因为内心害怕，主动到公安机关交代，并独自承担了全部罪行，甲构成自首","B":"甲和乙共同实施诈骗犯罪，后甲因酒驾被公安机关讯问时，主动交代乙曾经实施的故意杀人行为，甲构成自首","C":"王某交通肇事逃逸，其父知道后将其扭送至公安机关，王某主动交代了其肇事逃逸行为，王某构成自首","D":"甲公司非法集资且规模很大，该公司总经理李某因为害怕，瞒着其他高管偷偷到公安机关交代了相关情况，李某作为单位犯罪的直接责任人不能单独成立自首"},"answer":"C","explanation":"本题考查法律常识。\n根据《中华人民共和国刑法》第六十七条规定：“犯罪以后自动投案，如实供述自己的罪行的，是自首。对于自首的犯罪分子，可以从轻或者减轻处罚。其中，犯罪较轻的，可以免除处罚。被采取强制措施的犯罪嫌疑人、被告人和正在服刑的罪犯，如实供述司法机关还未掌握的本人其他罪行的，以自首论。犯罪嫌疑人虽不具有前两款规定的自首情节，但是如实供述自己罪行的，可以从轻处罚；因其如实供述自己罪行，避免特别严重后果发生的，可以减轻处罚。”\nA项错误，根据《最高人民法院关于处理自首和立功具体应用法律若干问题的解释》第一条规定：“······共同犯罪案件中的犯罪嫌疑人，除如实供述自己的罪行，还应当供述所知的同案犯，主犯则应当供述所知其他同案犯的共同犯罪事实，才能认定为自首······”题中，甲独自承担了全部罪行，并未如实供述同案犯，不构成自首。\nB项错误，根据《最高人民法院关于处理自首和立功具体应用法律若干问题的解释》第五条规定：“根据刑法第六十八条第一款的规定，犯罪分子到案后有检举、揭发他人犯罪行为，包括共同犯罪案件中的犯罪分子揭发同案犯共同犯罪以外的其他犯罪，经查证属实；提供侦破其他案件的重要线索，经查证属实；阻止他人犯罪活动；协助司法机关抓捕其他犯罪嫌疑人（包括同案犯）；具有其他有利于国家和社会的突出表现的，应当认定为有立功表现。”题中，甲主动交代乙的其他罪行，构成立功，不构成自首。\nC项正确，根据《最高人民法院关于处理自首和立功具体应用法律若干问题的解释》第一条规定：“······并非出于犯罪嫌疑人主动，而是经亲友规劝、陪同投案的；公安机关通知犯罪嫌疑人的亲友，或者亲友主动报案后，将犯罪嫌疑人送去投案的，也应当视为自动投案······”题中，王某虽被扭送至公安机关，但主动交代罪行，构成自首。\nD项错误，根据《中华人民共和国刑法》第三十一条规定：“单位犯罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员判处刑罚。本法分则和其他法律另有规定的，依照规定。”《办理走私刑事案件适用法律若干问题的意见》第二十一条规定：“关于单位走私犯罪案件自首的认定问题在办理单位走私犯罪案件中，对单位集体决定自首的，或者单位直接负责的主管人员自首的，应当认定单位自首。认定单位自首后，如实交代主要犯罪事实的单位负责的其他主管人员和其他直接责任人员，可视为自首，但对拒不交代主要犯罪事实或逃避法律追究的人员，不以自首论。”因此，司法实践中认可单位自首的情形。题中，李某作为单位直接负责人，虽然瞒着其他高管单独到公安机关交代相关情况，但仍构成单位自首。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"10204467","cat":"人文常识","stem":"唐太宗的《起居注》一直流传至今，以下情景不可能出现的是：","options":{"A":"与大臣一同品鉴李白的诗歌","B":"与房玄龄等大臣商议旱灾救助方案","C":"接见西域使者，被少数民族尊为“天可汗”","D":"宗庙祭祀，向其父唐高祖李渊上香祷告"},"answer":"A","explanation":"本题考查人文常识。\n起居注，是中国古代记录帝王的言行录，该史书体例由东汉明德皇后开创。唐太宗李世民（599年—649年）是唐朝的第二位皇帝，在位期间被称为“贞观之治”。\nA项错误，李白（701年—762年），盛唐时期著名诗人，字太白，号青莲居士，被誉为“诗仙”，代表作有《望庐山瀑布》《行路难》《蜀道难》等。故选项所述情景不可能出现。\nB项正确，房玄龄（579年—648年），名乔，字玄龄，凌烟阁二十四功臣之一，与杜如晦合称为“房谋杜断”。房玄龄是李世民得力的谋士之一，参与玄武门之变，与杜如晦等五人并功第一。李世民即位后，房玄龄为中书令，负责综理朝政长达二十年。故选项所述情景可能出现。\nC项正确，“天可汗”是唐代西北各族君长对唐太宗的尊称，也是表示对唐太宗的拥戴。“可汗”本是突厥、回纥、柔然等民族最高统治者的称号，“天可汗”就等于是给予各民族共同拥戴的最高统治者的尊称。贞观四年唐王朝击败东突厥以后，唐太宗接受诸蕃君长所奉“天可汗”称号。故选项所述情景可能出现。\nD项正确，李渊是唐朝的开国皇帝，是唐太宗李世民的父亲。贞观九年，李渊病逝，谥号太武皇帝，庙号高祖，葬于献陵。故选项所述情景可能出现。\n本题为选非题，故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"16593228","cat":"人文常识","stem":"关于我国历史上的科技著作，下列说法错误的是？","options":{"A":"《天工开物》——中国17世纪的工艺百科全书","B":"《坤舆万国全图》——中国最早的彩绘世界地图","C":"《水经注》——介绍了欧洲先进的水利技术和工具","D":"《徐霞客游记》——世界最早关于石灰岩地貌研究的文献"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，《天工开物》初刊于1637年（明崇祯十年），作者是明朝科学家宋应星。这是世界上第一部关于农业和手工业生产的综合性著作，外国学者称它为“中国17世纪的工艺百科全书”。\nB项正确，《坤舆万国全图》是明朝万历年间利玛窦和李之藻合作绘制的世界地图，是中国最早的彩绘世界地图，推动了中国地理学的发展和中西方文化交流，是中国乃至世界地图发展史上的珍品。\nC项错误，《水经注》是古代中国地理名著，作者是北魏晚期的郦道元。《水经注》以《水经》为纲，详细记载了中国一千多条大小河流及有关的历史遗迹、人物掌故、神话传说等，是中国古代最全面、最系统的综合性地理著作。不涉及欧洲先进的水利技术和工具。\nD项正确，《徐霞客游记》是明代地理学家徐霞客创作的一部散文游记，主要按日记述作者1613年至1639年间旅行观察所得，对地理、水文、地质、植物等现象，均做了详细记录。其书中对石灰溶蚀地貌的观察和记述，早于欧洲约两个世纪，是世界最早关于石灰岩地貌研究的文献。\n本题为选非题，故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"16593148","cat":"地理国情","stem":"下列关于我国科技成就说法正确的是：\n①“三峡氢舟1号”——助推我国首次在南海海域成功开采可燃冰\n②“可持续发展科学卫星1号”——专门服务联合国2030年可持续发展议程的科学卫星\n③“蓝鲸1号”——我国首艘氢燃料电池动力示范船\n④“耕海1号”——将渔业养殖、海上旅游、科技研发等功能相结合的海洋牧场综合体","options":{"A":"①③","B":"②③","C":"①④","D":"②④"},"answer":"D","explanation":"本题考查科技常识。\n①③错误，“三峡氢舟1”号由三峡集团长江电力等单位共同研发建造，是国内首艘入级中国船级社氢燃料电池动力船。我国首艘氢燃料电池动力示范船“三峡氢舟1”号于2023年10月11日在长江三峡起始点湖北宜昌首航。这标志着氢燃料电池技术在我国内河船舶应用实现零的突破。2017年5月18日，在距离祖国大陆300多公里的我国南海北部神狐海域“蓝鲸一号”海上钻井平台，国土资源部部长、党组书记、国家土地总督察姜大明宣布，我国进行的首次可燃冰（天然气水合物）试采实现连续稳定产气，取得天然气水合物试开采的历史性突破，首次可燃冰试采宣告成功。\n②正确，2021年11月5日，我国在太原卫星发射中心成功发射可持续发展科学卫星1号（SDGSAT-1）。SDGSAT-1是全球首颗专门服务联合国2030年可持续发展议程的科学卫星，也是中国科学院首颗地球科学卫星。\n④正确，“耕海1号”是由山东海洋集团投资建造的全国首座综合性、示范性、集成性的智能化大型现代生态海洋牧场综合体平台，犹如一朵海上花绽放在烟台美丽的“四十里湾”海域。项目采用一、三产业深度融合的运营模式，在国内首次将渔业养殖、智慧渔业、休闲渔业、科技研发、科普教育等功能集成在统一平台，是装备型省级海洋牧场示范项目，装备型海洋牧场建设“山东标准”的唯一试点项目。\n综上，②④正确。\n故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"10204501","cat":"人文常识","stem":"下列世界文化遗产及所在地对应错误的是：","options":{"A":"平遥古城——山西；鼓浪屿——福建","B":"龙门石窟——河南；云冈石窟——陕西","C":"布达拉宫——西藏；良渚古城遗址——浙江","D":"武当山古建筑群——湖北；西递村——安徽"},"answer":"B","explanation":"本题考查地理国情。\nA项正确，平遥古城位于山西省晋中市，始建于西周宣王时期（前827年—前782年），于明代洪武三年（1370年）重建、扩修城池，是现今中国境内保存最为完整的一座古代县城；1997年12月3日，平遥古城与周边的双林寺、镇国寺共同被联合国教科文组织确定为世界文化遗产，列入《世界遗产名录》。鼓浪屿位于福建省厦门市，岛西南有一海蚀岩洞受浪潮冲击，声如擂鼓，自明朝雅化为今名称“鼓浪屿”；2017年7月8日，“鼓浪屿：历史国际社区”被列入世界遗产名录。\nB项错误，龙门石窟位于河南省洛阳市，是世界上造像最多、规模最大的石刻艺术宝库，被联合国教科文组织评为“中国石刻艺术的最高峰”，中国著名石窟之一，现为世界文化遗产。云冈石窟位于山西省大同市，原名灵岩寺、石佛寺，是中国第一个皇家授权开凿的石窟；2001年，云冈石窟被联合国教科文组织列入世界文化遗产名录。\nC项正确，布达拉宫位于西藏自治区首府拉萨市，是一座宫堡式建筑群，主体建筑为白宫和红宫两部分；1994年，布达拉宫被列入世界遗产名录。良渚古城遗址位于浙江省杭州市余杭区，由良渚古城核心区、水利系统、祭坛墓地和外围郊区等部分组成；2019年7月6日，良渚古城遗址获准列入世界遗产名录。\nD项正确，武当山古建筑群位于湖北省丹江口市境内，敕建于唐贞观年间，明代达到鼎盛；1994年，武当山古建筑群被列入世界文化遗产名录。西递村位于安徽省黟县西递镇，地处黄山南麓、黟县盆地南侧，始建于北宋皇佑年间，发展于明朝景泰中叶，鼎盛于清代初期；2000年，以西递村为代表的皖南古村落被联合国教科文组织列入世界文化遗产名录。\n本题为选非题，故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"16593230","cat":"人文常识","stem":"下列文句与蕴含的哲理对应正确的是：","options":{"A":"竭泽而渔，岂不获得，而明年无鱼——事物是不断发展的","B":"井蛙不可以语于海，夏虫不可以语于冰——尊重客观规律","C":"吾生也有涯，而知也无涯。以有涯随无涯，殆已——勤学善记","D":"兵无常势，水无常形，能因敌变化而取胜者，谓之神——学会审时度势"},"answer":"D","explanation":"本题考查政治常识。\nA项错误，“竭泽而渔，岂不获得，而明年无鱼”出自《吕氏春秋·览·孝行览》，把池水抽干去捕鱼，哪能捉不到呢，只是第二年就没鱼了。比喻取之不留余地，只图眼前利益，不作长远打算。没有用发展的眼光看问题，而是用孤立、静止的思维思考问题，属于形而上学的观点。\nB项错误，“井蛙不可以语于海，夏虫不可以语于冰”出自《庄子·外篇·秋水》，意思是对井里的蛙不可与它谈论关于海的事情，对夏天生死的虫子不可与它谈论关于冰雪的事情。这是因为井蛙的眼界受空间限制，夏虫的眼界受到时令的制约，体现了认识来源于实践的哲学原理。\nC项错误，“吾生也有涯，而知也无涯。以有涯随无涯，殆已”出自《庄子·内篇·养生主》，意思是我的生命是有限的，而知识是无限的。用有限的生命去追求无限的知识，真是累人啊！体现了认识是在实践基础上不断向前发展的。人们在实践中追求和发展真理是一个永无止 境的过程。\nD项正确，“兵无常势，水无常形，能因敌变化而取胜者，谓之神”出自《孙子兵法·虚实篇》，意思是用兵作战没有固定不变的方法态势，如同水流没有固定的形状，能够依据敌情的变化而取胜，可称得上用兵如神了。体现了一切事物都是不断运动、变化、发展的，要用发展的眼光看问题，学会审时度势。\n故正确答案为D。\n注：本题存在瑕疵，D项不是哲理的表述，但前后所反映的哲理一致。","no":16,"missingImage":false},{"type":"question","qid":"16593150","cat":"人文常识","stem":"下列关于我国之“最”说法错误的是：","options":{"A":"东北平原是我国最大平原，北部为松嫩平原，南部为辽河平原","B":"三沙市成立于2012年，隶属海南省，是我国位置最南的地级市","C":"台湾岛位于东海南部，是我国第一大岛，有“东海瀛洲”之称","D":"新疆维吾尔自治区是我国陆地面积最大、交界邻国最多的省级行政区"},"answer":"C","explanation":"本题考查地理常识。\nA项正确，东北平原，是中国三大平原之一，也是中国最大的平原，位于中国东北部，由三江平原、松嫩平原、辽河平原组成，地跨黑龙江、吉林、辽宁和内蒙古四个省区。根据东北平原不同的区域特征，可分为三个亚区平原，即东北角的三江平原、北部的松嫩平原和南部的辽河平原。\nB项正确，三沙市于2012年7月24日正式揭牌成立，是中国位置最南、面积最大、陆地面积最小及人口最少的地级市。三沙市为海南省辖地级市，地处中国南海中南部，海南省南部，辖西沙群岛、中沙群岛、南沙群岛的岛礁及其海域，陆地面积20多平方千米，陆海面积约200万平方千米。\nC项错误，台湾岛是我国第一大岛，战略要地，位于东海南部，西依台湾海峡。面积约3.588万平方公里，占到整个台湾省面积的99%，南北跨度近400公里，东西跨度约145公里，有长达1150多公里的海岸线。崇明岛，是长江三角洲东端长江口处的冲积岛屿，也是中国第三大岛屿、中国最大的河口冲积岛、中国最大的沙岛，其成陆历史有1300多年，被誉为“长江门户、东海瀛洲”。\nD项正确，新疆维吾尔自治区位于中国西北地区，面积166.49万平方千米，是中国陆地面积最大的省级行政区，约占中国国土总面积的六分之一。新疆维吾尔自治区地处亚欧大陆腹地，陆地边境线5600多千米，周边与俄罗斯、哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦、巴基斯坦、蒙古、印度、阿富汗八国接壤，是我国国境线最长、交界邻国最多的省级行政区。\n本题为选非题，故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"16593154","cat":"科技常识","stem":"下列诗词中包含的生物学现象说法错误的是（    ）。","options":{"A":"野火烧不尽，春风吹又生——草原生态系统具有稳定性","B":"群雁辞归鹄南翔，念君客游思断肠——候鸟通过迁徙适应气候变化","C":"停车坐爱枫林晚，霜叶红于二月花——植物开花受温度和光照影响","D":"落红不是无情物，化作春泥更护花——微生物的分解作用及物质的循环"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，“野火烧不尽，春风吹又生”出自唐代诗人白居易的《赋得古原草送别》。诗句的意思是：野火不能烧尽野草，春天一到野草会长出来。生态系统稳定性即为生态系统所具有的保持或恢复自身结构和功能相对稳定的能力。这句诗通过描述野火燃烧和春风吹拂后植被再生的情景，体现了草原生态系统在面对破坏时的恢复和重生能力，展现了其具有一定的稳定性。\nB项正确，“群雁辞归鹄南翔，念君客游思断肠”出自魏晋时期诗人曹丕的《燕歌行二首·其一》。诗句的意思是：燕群辞归，天鹅南飞。思念出外远游的良人啊，我肝肠寸断。这句诗描写了候鸟离开北方迁徙到南方的场景。候鸟是指栖息地和繁殖地之间在不同季节之间往返的鸟类，它们通常会根据气候和资源的变化而进行周期性的迁徙，以适应气候变化，寻找适宜的生存条件。\nC项错误，“停车坐爱枫林晚，霜叶红于二月花”出自唐朝诗人杜牧的《山行》。诗句的意思是：停下车来，是因为喜爱这深秋的枫林晚景，那经霜的枫叶竟比二月的鲜花还要火红。夏天的枫叶是绿色的，这是因为枫叶中含有大量的叶绿素。叶绿素对绿光的吸收少、反射多导致叶片呈现绿色；当秋天到来天气温度变低，叶绿素被降解，叶片就会呈现出花青素的颜色。花青素又称红色素，位于叶片细胞的液泡内，使叶片呈现红色。所以该句诗主要体现了温度对色素的影响。\nD项正确，“落红不是无情物，化作春泥更护花”出自清代龚自珍的《己亥杂诗·其五》。诗句的意思是：从枝头上掉下来的落花不是无情之物，即使化作春泥，也甘愿化作养料，滋养美丽的花朵生长。这是由于在自然界中，土壤中的微生物可以分解落叶、枯枝、落花等有机物质，将这些有机物质转化为土壤中的无机盐等物质，使土壤更加肥沃，为植物提供养分。通过分解者的分解，这些有机物质回归到环境中并被再次利用，促进了自然界的物质循环。\n本题为选非题，故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"16593156","cat":"科技常识","stem":"下列古籍中描述的现象与所体现的物理原理对应正确的是（    ）。","options":{"A":"《论衡》中提到摩擦过的琥珀能吸引像草芥一样的轻小物体——分子引力","B":"《考工记》中提到马拉车时，虽然马不再施力了，车仍能向前移动一段距离——惯性","C":"《墨子》中提到天平一端加重物，另一端必得加重物，两者必须相等才能平衡——力的相互作用","D":"《异苑》中提到有户人家的铜盆经常发出声音，后来发现是与宫中撞钟相应，用锉刀锉了铜盆后，声音就消失了——多普勒效应"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，中国学者王充在《论衡》一书写下“顿牟掇芥”，意为摩擦过的琥珀能吸引轻小草芥。摩擦后的琥珀得到了带负电的电子，它能吸引轻小草芥说明带电体具有吸引轻小物体的性质，体现了摩擦起电效应，和分子引力无关。\nB项正确，《考工记》中记载“马力既竭，辀（指车轮）犹能一取焉”，意思是没有了马的拉力以后，马车车轮仍然能往前行驶一段距离。马车原来是前进的，当马的拉力消失后，因为马车具有惯性，仍然要保持原来的前进状态，因此马车还可以继续向前移动一段距离。\nC项错误，《墨经》中记载：“衡，加重于其一旁，必捶，权重相若也。”这句话的意思是：天平衡量的一臂加重物时，另一臂则要加砝码，且两者必须等重，天平才能平衡。这句话解释的是杠杆的原理，和力的相互作用无关。\nD项错误，《异苑》中记载一个人来向张华请教，说他家有一个洗澡用的大铜盆，每日早晚总会嗡嗡作响，就像有人在敲打一般。张华答：这只铜盆和洛阳宫中大钟的音调相谐，宫中每天早晚都要撞钟，所以使铜澡盆有声相应。张华还告诉他只要把铜盆锉掉一点，使其变轻，便不会再作响。这体现了共鸣原理，和多普勒效应无关。多普勒效应是由于波源与观测者相对运动而出现的观测者测得的波频率与波源频率不同的现象。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"10204482","cat":"科技常识","stem":"下列有关生活常识说法错误的是：","options":{"A":"白糖水分含量少、糖分高，不耐储存","B":"食醋的pH值比较低，可以抑制微生物的生长","C":"美白牙膏通常采用过氧化钙等过氧化物漂白牙齿","D":"削了皮的苹果变色是一种化学反应，会影响苹果的口感"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，白糖的化学性质稳定，水分少、糖分高，不利于微生物繁殖，很耐储存。\nB项正确，食醋的pH值比较低，可以明显抑制微生物生长，防止杂菌污染，能达到长期保存的效果。\nC项正确，美白牙膏通常采用过氧化钙等过氧化物漂白牙齿，过氧化钙遇水才能分解出能够最终发挥效用的过氧化氢。\nD项正确，削了皮的苹果发生酶促褐变反应后表面会变成褐色，影响苹果的外观和口感，表层的部分营养成分有所降低。酶促褐变反应是在有氧的条件下，酚酶催化酚类物质形成醌及其聚合物，该反应是化学反应。\n本题为选非题，故正确答案为A。","no":20,"missingImage":false}],"count":14,"answerable":14,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"16593164","cat":"逻辑填空","stem":"要解决一个大问题，往往要有好的工具。工具的发展是一个            的过程，新工具能够促进学问的继续发展，提升我们看待问题的深度，又反过来促进我们进一步发展工具。每一次工具的进步，都会带动有意义的、重要的、突破性的学问的发展。\n填入画横线部分最恰当的一项是：","options":{"A":"锦上添花","B":"精益求精","C":"千锤百炼","D":"精雕细琢"},"answer":"B","explanation":"根据“要解决一个大问题”“新工具能够促进学问的继续发展，提升我们看待问题的深度，又反过来促进我们进一步发展工具”可知，在解决一个大问题的过程中，工具在不断地发展进步，形成了正向循环，即工具的发展是越来越好的过程，B项“精益求精”意为好了还求更好，符合文意，当选。\nA项“锦上添花”比喻好上加好，美上添美，侧重在已有的事物上，再添加其他美好的事物，文段强调工具自身的进步发展，与文意不符，排除；\nC项“千锤百炼”比喻经历多次的艰苦斗争和考验，文段并未提及艰苦的斗争和考验，与文意不符，排除；\nD项“精雕细琢”指精心细致地雕刻，多形容做事认真细致，文段并未强调认真细致在工具进步中的重要作用，与文意不符，排除。\n故正确答案为B。\n【文段出处】《丘成桐：学“问”》","no":21,"missingImage":false},{"type":"question","qid":"10204502","cat":"逻辑填空","stem":"近年来，以云计算、大数据、人工智能等技术引领的新一代数字化浪潮            。数字化转型按下“加速键”，数字技术应用深度和广度不断拓展，新技术新业态新模式            ，数字经济日渐成为继农业经济、工业经济之后的新兴经济形态。\n依次填入画横线部分最恰当的一项是:","options":{"A":"汹涌澎湃 此起彼伏","B":"浩浩荡荡 层出不穷","C":"波澜壮阔 生生不息","D":"气壮山河 方兴未艾"},"answer":"B","explanation":"第一空，搭配“浪潮”，且将数字化比喻为“浪潮”，A项“汹涌澎湃”，B项“浩浩荡荡”，C项“波澜壮阔”均与“浪潮”搭配恰当，且符合形象表达，保留。D项“气壮山河” 形容气势如高山大河般雄壮豪迈，与“浪潮”搭配不当，排除。\n第二空，搭配“新技术新业态新模式”，且根据前文“数字化转型按下‘加速键’，数字技术应用深度和广度不断拓展”可知，横线处所填成语应体现在数字化转型的背景下，新技术新业态新模式“不断出现”之意，B项“层出不穷”指接连不断地出现，没有穷尽，符合文意，当选。A项“此起彼伏”指这里起来，那里下去，形容接连不断，侧重高潮迭起，从未止息，与文意不符，排除；C项“生生不息”指不断地生长、繁殖，与“新技术新业态新模式”搭配不当，排除。\n故正确答案为B。\n【文段出处】《发展数字经济重在“以数促实”》","no":22,"missingImage":false},{"type":"question","qid":"16593192","cat":"逻辑填空","stem":"文旅开发需注重对古镇自然环境的呵护，避免简单        其他文旅项目大广场、大草坪、大展馆等设计，应当留住古镇清幽、古朴的历史风貌，而大规模迁移原住居民、过度引入商业设施的开发模式，已经让众多注重旅游体验的游客“用脚投票”，尤当            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"移植 引以为戒","B":"复制 居安思危","C":"参考 防微杜渐","D":"借鉴 慎之又慎"},"answer":"A","explanation":"第一空，根据“应当留住古镇清幽、古朴的历史风貌”和“简单”提示可知，横线处应表达文旅开发不能简单、盲目、不经思考地照抄、挪用其他项目的设计之意，A项“移植”指把幼苗拔起种在田地里，可引申理解为直接挪用，B项“复制”指仿原样品制造，均符合文意，保留。C项“参考”指参证有关材料来帮助研究和了解，D项“借鉴”指把别的人或事当镜子，对照自己，以便吸取经验或教训，均侧重于学习经验、汲取别人的优点之意，并非直接照搬，与文意不符，排除。\n第二空，根据“大规模迁移原住居民、过度引入商业设施的开发模式，已经让众多注重旅游体验的游客‘用脚投票’”可知，这些开发模式无法吸引游客，带来了严重的后果，故横线处应表达应当避免类似的开发模式之意，A项“引以为戒”指把过去犯错误的教训拿来作为警戒，避免重犯，符合文意，当选。B项“居安思危”指随时有应付意外事件的思想准备，侧重在问题发生之前要有忧患意识，而文段该问题已经发生了，故与文意不符，排除。\n故正确答案为A。\n【文段出处】中国青年报《古镇旅游何时不再“抄作业”》","no":23,"missingImage":false},{"type":"question","qid":"16593224","cat":"逻辑填空","stem":"中国的岁时节日既情意盎然又韵味绵长，以其深厚的旨趣，令人            ，堪称中国人的精神原乡。作为人类非物质文化遗产，如今的中国岁时节日，早已把中国与世界紧密地联系到一起，世界各地都有中国的节庆文化，华夏民族的古老智慧，在            中滋润着这个世界。\n依次填入画横线部分最恰当的一项是：","options":{"A":"心向往之  春风化雨","B":"心旌摇荡  继往开来","C":"心驰神往  历久弥新","D":"心旷神怡  经久不衰"},"answer":"C","explanation":"第一空，搭配“中国的岁时节日”，且根据前文“中国的岁时节日既情意盎然又韵味绵长，以其深厚的旨趣”可知，横线处所填成语应体现人们被中国的岁时节日所吸引之意，A项“心向往之”意为对某个人或事物心里很向往，C项“心驰神往”形容思想集中在追求和向往的事情或地方上，一心向往，均符合文意，保留。B项“心旌摇荡”形容面对自己想要或想得到的东西拿不定主意，犹豫不决，文中并无犹豫不决之意，与文意不符，排除；D项“心旷神怡”意为心情愉快，精神舒畅，常与“景色”等搭配，与“中国的岁时节日”搭配不当，排除。\n第二空，搭配“华夏民族的古老智慧”，且根据前文“如今的中国岁时节日······世界各地都有中国的节庆文化”可知，横线处所填成语应表达古老的中国文化在与世界的交流中不断发展之意，C项“历久弥新”形容经过长久的时间，（事物）不但没有衰败、陈旧，反而更新、更好，且“久”对应“古老智慧”，“新”对应“如今的中国岁时节日”，符合文意，当选。A项“春风化雨”指适宜草木生长的风雨，多用在人或事，比喻良好的熏陶和教育，与文意无关，排除。\n故正确答案为C。\n【文段出处】重庆日报《节日文化也是一种精神原乡》","no":24,"missingImage":false},{"type":"question","qid":"16593183","cat":"逻辑填空","stem":"电影黄金档期票房以及年度总票房在整个经济总量中占比不高，但电影产业的经济影响            ，因为人们会通过这一数字，来        经济、社会的运转状况，尝试从中寻找规律、得到启发。\n依次填入画横线部分最恰当的一项是：","options":{"A":"毋庸置喙 分析","B":"不容小觑 管窥","C":"举足轻重 估量","D":"兹事体大 洞察"},"answer":"B","explanation":"第一空，形容“电影产业的经济影响”，根据横线前“但”表转折可知，应与前文“在整个经济总量中占比不高”意思相反，即表达“影响较大”之意。B项“不容小觑”指不能小看，不能轻视，C项“举足轻重”形容有实力，所处的地位很重要，一举一动都对全局有重大影响，均符合文意，保留。A项“毋庸置喙”指不用别人插嘴，不需要多话，与文意不符，排除；D项“兹事体大”指这件事的体制规模非常大，也指这件事关系重大，一般直接搭配某个事件本身，而非某事件产生的“影响”，排除。\n第二空，横线搭配“运转状况”，根据“通过这一数字······从中寻找规律、得到启发”可知，横线处需表示人们通过电影票房数字这一小部分可以知晓经济、社会运转这一整体情况之意。B项“管窥”指通过竹管子的孔看天，置于此处可表达从观察到的部分推测全貌之意，与文段中“这一数字”和“经济、社会的运转状况”部分和整体的关系对应准确，当选。C项“估量”指估计衡量，与“运转状况”搭配不当，且无法对应文中通过一小部分看出整体之意，与文意不符，排除。\n故正确答案为B。\n【文段出处】经济观察网《信心比“票房重回百亿”更重要》","no":25,"missingImage":false},{"type":"question","qid":"10204492","cat":"逻辑填空","stem":"中国地理位置相对独立，南有热带丛林，西南有世界屋脊喜马拉雅山和青藏高原， 西有昆仑山、天山、阿尔泰山等高山和中亚沙漠，北有蒙古高原和戈壁荒滩，东方则面海。它们虽不能构成人类迁徙的绝对        ，但会给大规模人群的流动带来挑战，尤其在环境恶化时更是如此。在这样相对封闭的生态环境中，于气候适宜期迁徙至此的早期直立人生存繁衍，            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"隔断 代代相传","B":"阻碍 绵绵不绝","C":"障碍 开花结果","D":"屏障 开枝散叶"},"answer":"D","explanation":"第一空，根据“会给大规模人群的流动带来挑战”可知，横线处所填词语应体现这些地理因素不能完全阻挡人类迁徙之意，B项“阻碍”指起阻碍作用的事物，C项“障碍”指阻碍物，D项“屏障”指遮蔽、阻挡之物，均可体现阻挡之意，保留。A项“隔断”指专门作为分隔室内空间的立面，常用于分隔房屋及室内空间，与文意不符，排除。\n第二空，搭配“早期直立人”，且通过逗号与前文构成并列关系，故横线处所填成语应与“生存繁衍”构成近义并列，体现人逐渐增多或增广之意，D项“开枝散叶”多用来比喻人的生殖繁衍，传递祖先血脉，与文意相符，当选。B项“绵绵不绝”形容连续不断，多用于搭配“景象”“文化”等，与“早期直立人”搭配不当，排除；C项“开花结果”比喻工作、学习等有进展，并取得了成果，侧重强调结果，无法体现不断增多或增广之意，排除。\n故正确答案为D。\n【文段出处】人民网《探寻旧石器时代的中华文明根脉》","no":26,"missingImage":false},{"type":"question","qid":"16593197","cat":"逻辑填空","stem":"对于热议的“网约车订单饱和”情况不能            ，部分城市部分时段或部分月份可能出现短暂性动态饱和，回归到市场供求来说，网约车平台的多少，尤其是网约车车辆的多少，最终还是取决于公众出行需求多寡。市场具有自主调节能力，相关部门适时        风险，对于动态调整市场供求关系也将发挥积极作用。\n依次填入画横线部分最恰当的一项是：","options":{"A":"简而言之 防范","B":"一概而论 预警","C":"予以臧否 调控","D":"妄下结论 评估"},"answer":"B","explanation":"第一空，根据后文“部分城市部分时段或部分月份可能出现短暂性动态饱和”可知“网约车订单饱和”这一结论不够准确，应该谨慎对待“网约车订单饱和”问题，并且具体情况具体分析。B项“一概而论”指处理事情或问题不分性质，不加区别，用同一标准来对待或处理，D项“妄下结论”指在没有掌握所有事实的情况下就判断或决定某事，从而得出毫无根据的结论，填入文段与“不能”连用均可体现出谨慎、具体情况具体分析的语义，保留。A项“简而言之”指简括地说，长话短说，一般不应用于否定句，排除；C项“予以臧否”指给予事物褒贬地评论，侧重评价人物好坏，文段并非强调好坏而是对这一结论仍存在质疑，与文意不符，排除。\n第二空，横线搭配“风险”，依据后文“对于动态调整市场供求关系也将发挥积极作用”可知，相关部门对于风险所采取的措施能够对于市场发展起到积极作用。B项“预警”指预先告警，相关部门对于风险提前发出警示信息可对市场发展提供帮助，当选。D项“评估”指评价和估量，不如B项“预警”所体现出的提前告知的作用更加积极，排除。\n故正确答案为B。\n【文段出处】长江日报《旱涝不均，网约车平台困局如何破？》","no":27,"missingImage":false},{"type":"question","qid":"10204485","cat":"逻辑填空","stem":"科学从来不会        自己洞察了宇宙所有的真相和奥秘，它从不否认自身的局限性：超出一定范围和条件之后，没有任何一种理论能够        和解释所有的现象，回答所有的问题。\n依次填入画横线部分最恰当的一项是：","options":{"A":"宣称 描述","B":"认定 把握","C":"预言 分析","D":"标榜 论证"},"answer":"A","explanation":"第一空，根据“它从不否认自身的局限性”可知，横线处所填词语意在表达科学不会表示自己洞察了宇宙所有的真相和奥秘。A项“宣称”指公开地用语言、文字表示，B项“认定”指确切地认为，D项“标榜”指提出某种好听的名义，加以宣扬，均符合文意，保留。C项“预言”指预先说出将来要发生的事情，文段并未提及对未来的预测，与文意不符，排除。\n第二空，搭配“理论”和“现象”，且根据“解释所有的现象，回答所有的问题”可知，横线处所填词语应表示“阐述清楚”之意。A项“描述”指描写叙述，符合文意且搭配恰当，当选。B项“把握”指抓住，主语通常为具有主观能动性的主体，与“理论”搭配不当，排除；D项“论证”指用论据证明论题的真实性，文段强调“阐述清楚”而非以论据来证明，与文意不符，且“现象”可作为证据以论证“理论”，而非“理论”论证“现象”，置于此处逻辑错误，排除。\n故正确答案为A。\n【文段出处】知社学术圈《如同把大象装进冰箱——颠覆主流科学理论的三步走》","no":28,"missingImage":false},{"type":"question","qid":"16593186","cat":"逻辑填空","stem":"一款零食以前能靠独特口味畅销十几年，这在今天几乎是天方夜谭。新爆款横空出世，模仿者很快            ，消费者的新鲜感被迅速透支。当朝生暮死成为网红食品的常态，相比于            的零食巨头，轻资产的中小品牌反而更容易在时代变幻莫测的风向中            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蜂拥而至 尾大不掉 闪转腾挪","B":"后来居上 作茧自缚 捷足先登","C":"青出于蓝 因循守旧 稳操胜券","D":"龙争虎斗 老气横秋 脱颖而出"},"answer":"A","explanation":"第一空，搭配主语“模仿者”，根据“新鲜感被迅速透支”可知，横线处意在指出模仿者很快进行模仿，出现很多相似的产品，A项“蜂拥而至”意思是像一窝蜂似地拥来，形容很多人乱哄哄地朝一个地方聚拢，符合文意，保留。B项“后来居上”比喻后来的人和事，进步很快，赶上或超过了先前的，文段没有指出模仿者“超越了”先前的，且如果是超越前人的积极语义，就不会有后文“新鲜感被迅速透支”的不良后果，排除；C项“青出于蓝”比喻学生超过老师或后人胜过前人，感情色彩不符，排除；D项“龙争虎斗”比喻大家都在争斗，场面激烈，侧重“争斗”，文段强调人们纷纷模仿，并未强调“争斗”，排除。\n第二空、第三空，代入验证，文段中“零食巨头”与“中小品牌”构成对比，A项“尾大不掉”比喻部下势力太大，不易指挥调度，突出零食巨头存在不易调度、不够灵活的问题；“闪转腾挪”指在困境中快速转移、灵活应对的能力，突出中小品牌轻资产的优势，均符合语境，当选。\n故正确答案为A。\n【文段出处】《90后的童年零食，没人愿意吃了》","no":29,"missingImage":false},{"type":"question","qid":"10204503","cat":"逻辑填空","stem":"20世纪80年代，伴随乡村民俗及观念的日益        ，写实风格绘画也在快速地构建新的民间审美意趣，反映社会生活、农村新貌的作品取代原来的民俗题材成为年画主体，年画艺术与“年”的关系            ，木版年画的雕版套印技术，以及由此形成的传统审美趣味至此走到了        的边缘。\n依次填入画横线部分最恰当的一项是：","options":{"A":"弱化 形同陌路 式微","B":"淡化 渐行渐远 没落","C":"淡出 今非昔比 衰亡","D":"遗失 每况愈下 消弭"},"answer":"B","explanation":"第一空，搭配“乡村民俗及观念”，且根据横线后“反映社会生活、农村新貌的作品取代原来的民俗题材成为年画主体”可知，横线处所填词语应体现出乡村民俗及观念逐渐被遗忘和被取代的过程，A项“弱化”指逐渐衰弱，B项“淡化”指使（问题、情感等）逐渐冷淡下来，变得不被重视或无关紧要，均符合文意，保留。C项“淡出”比喻逐渐退出，从某地方不声张、轻轻离去，D项“遗失”指丢失，丢弃，均与“乡村民俗及观念”搭配不当，排除。\n第二空，搭配“年画艺术与‘年’”，且由前文可知，年画艺术不再以与年相关的传统民俗题材作为主体，横线处所填成语要体现出两者逐渐疏离之意，B项“渐行渐远”指不断地行走，分离得越来越远，符合文意，保留。A项“形同陌路”指本来很熟悉的朋友或别的人，因为一些事情而不再联系或交往，与“年画艺术与‘年’”搭配不当，排除。\n第三空，代入验证。由前文可知，“雕版套印技术”以及“由此形成的传统审美趣味”的发展情况并不乐观，B项“没落”指衰败，趋向灭亡，符合文意，当选。\n故正确答案为B。\n【文段出处】中国文化报《木版年画的文化内涵与时代延展》","no":30,"missingImage":false},{"type":"question","qid":"16593189","cat":"逻辑填空","stem":"蜱虫具有恐怖的吸血能力，它会找到皮肤上隐蔽的角落            地吸血好几天，人却无法察觉。这是因为蜱虫的唾液就像鸡尾酒一样，由各种蛋白质“        ”而成，其中一些让人不痛不痒，一些让血液不会凝固，还有一些保证不会        人的免疫系统。多种病原体便会趁机入侵人体。\n依次填入画横线部分最恰当的一项是：","options":{"A":"不声不响 搅拌 启动","B":"堂而皇之 调配 惊扰","C":"明目张胆 凝结 触发","D":"有恃无恐 混合 唤醒"},"answer":"B","explanation":"第一空，横线处应体现蜱虫吸血时的特点，且根据“人却无法察觉”可知，横线处与后文构成转折，体现蜱虫吸血时或可能光明正大之意。B项“堂而皇之”指公开或不加掩饰，C项“明目张胆”指公开地、无所顾忌地做坏事，D项“有恃无恐”指因有所依仗而不害怕，填入文段均可体现出蜱虫吸血时光明正大之意，符合文意，保留。A项“不声不响”指不说话、不出声，与后文“无法察觉”无法构成转折，排除。\n第二空，根据“这是因为蜱虫的唾液就像鸡尾酒一样”可知，横线处形容鸡尾酒的特点，B项“调配”指调制配比，符合鸡尾酒的特点且生动形象，D项“混合”指各种物品掺杂在一起，均符合文意，保留。C项“凝结”指由气体变成液体或由液体变成固体，与“鸡尾酒”无法对应，排除。\n第三空，根据“多种病原体便会趁机入侵人体”可知，横线处体现蜱虫不会使免疫系统发生反应之意，B项“惊扰”指惊动扰乱，符合文意，当选。D项“唤醒”指从沉睡状态叫醒，文段并无人体免疫系统原本在沉睡之意，排除。\n故正确答案为B。\n【文段出处】环球科学《你可能已被这种昆虫吸血数天，感染了数种危险病原体，但毫无知觉》","no":31,"missingImage":false},{"type":"question","qid":"10204510","cat":"逻辑填空","stem":"当前，电信网络诈骗犯罪国际化        ，催生了网络赌博、偷渡、人口贩卖等一系列违法犯罪行为，严重影响了各国人民的人身财产安全，给各国社会稳定带来了        隐患。特别是在信息手段        下，流量爆棚的短视频平台容易沦为诈骗高发区，跨境电信诈骗犯罪呈现骗术隐蔽性强、链条化运作和涉案者年轻化等趋势，让案件侦破难度进一步提高。\n依次填入划横线处最恰当的一项是：","options":{"A":"漫延 危险 支持","B":"蔓延 严峻 加持","C":"延伸 严重 影响","D":"蔓引 重大 助力"},"answer":"B","explanation":"第一空，横线处所填词语搭配“电信网络诈骗犯罪国际化”，且根据后文“催生了网络赌博、偷渡、人口贩卖等一系列违法犯罪行为”可知，当前电信网络诈骗犯罪国际化的趋势在加剧，B项“蔓延”指如蔓草滋生，连绵不断，引申为延伸，扩展，符合文意，保留。A项“漫延”指向四周扩散，通常用于描述液体、气体等的扩散，文段侧重强调电信网络诈骗的国际化趋势，置于此处搭配不当，排除；C项“延伸”意思是延长，扩大宽度、大小、范围，正确用法应为“电信网络诈骗犯罪向国际化延伸”，用法不当，排除；D项“蔓引”意思是牵连，与电信网络诈骗的国际化趋势无关，排除。\n第二空，代入验证，B项“严峻”指严厉、严肃，表示情况、形势等相当严重，置于此处可体现出电信网络诈骗对社会稳定造成的重大威胁，符合文意，保留。\n第三空，代入验证，B项“加持”原指施加佛力于众生，以保护扶持，引申为给予帮助或力量，置于此处可体现出信息手段增强了短视频平台成为诈骗高发区的可能性，符合文意，当选。\n故正确答案为B。\n【文段出处】人民网《人民网评：全链条治理跨国电信诈骗》","no":32,"missingImage":false},{"type":"question","qid":"10204494","cat":"片段阅读","stem":"文言和白话是两个相互依存的概念，无文言，也就无所谓白话，但它们并不等同于书面语和口语。受限于语言保存技术，我们现在能感知的古代汉语都是书面上的，包括文言，也包括白话。文言是在先秦口语的基础上形成的古代汉语书面语。先秦两汉的典籍、六朝以后文人仿古写出的作品都属于文言文。 白话是汉魏六朝以后，随着语言发展变化而形成的较为接近口语的言语，偶尔也夹杂一些文言成分，较能反映语言的时代性和区域性特点。\n根据这段文字，下列说法正确的是：","options":{"A":"汉魏六朝以后的作品都属于白话文","B":"古代汉语实际上包含白话文的成分","C":"文言文更能反映语言的时代性特点","D":"文言与白话分别等同书面语与口语"},"answer":"B","explanation":"A项，根据“六朝以后文人仿古写出的作品都属于文言文”及“白话是汉魏六朝以后，随着语言发展变化而形成的较为接近口语的言语，偶尔也夹杂一些文言成分”可知，选项表述错误，排除；\nB项，根据“受限于语言保存技术，我们现在能感知的古代汉语都是书面上的，包括文言，也包括白话”可知，古代汉语确实包含白话文，选项表述正确，当选；\nC项，根据“白话是汉魏六朝以后······偶尔也夹杂一些文言成分，较能反映语言的时代性和区域性特点”可知，选项中“文言文更能反映······特点”属于无关对比，排除；\nD项，根据“文言和白话是两个相互依存的概念，无文言，也就无所谓白话，但它们并不等同于书面语和口语”可知，选项表述与文意相悖，排除。\n故正确答案为B。\n【文段出处】《书面语与口语的源与流——文与言判雅俗殊形》","no":33,"missingImage":false},{"type":"question","qid":"10204479","cat":"片段阅读","stem":"竹秆质地坚硬，其堪与木材媲美的木质特性，来自于初生结构中发达的机械组织和细胞壁木质化的基本组织；木材的木质特性，则来自于年轮式样分布的次生木质部。竹秆外形与其他禾本科草本植物的茎相似，具有明显的节和节间，节数和粗细在出笋时就已基本固定；节附近分布有居间分生组织，节间伸长时，各节分生组织同时活动，竹子迅速拔高；缺少形成层，不能长粗，只能保持“婴儿时期的身材”。竹壁分为竹青、竹肉、竹黄三个部分，竹青含叶绿素呈绿色，可以进行光合作用。\n根据这段文字，下列说法错误的是：","options":{"A":"竹秆只能长高不能长粗","B":"竹子能够进行光合作用","C":"竹秆的节数在出笋时就已基本固定","D":"竹子的木质特性来自于次生木质部"},"answer":"D","explanation":"A项，根据“节附近分布有居间分生组织，节间伸长时，各节分生组织同时活动，竹子迅速拔高；缺少形成层，不能长粗，只能保持‘婴儿时期的身材’ ”可知，竹秆只能长高不能长粗，表述正确，排除；\nB项，根据“竹壁分为竹青、竹肉、竹黄三个部分，竹青含叶绿素呈绿色，可以进行光合作用”可知，竹子可以通过竹青进行光合作用，表述正确，排除；\nC项，根据“竹秆外形与其他禾本科草本植物的茎相似，具有明显的节和节间，节数和粗细在出笋时就已基本固定”可知，表述正确，排除；\nD项，根据“竹秆质地坚硬，其堪与木材媲美的木质特性，来自于初生结构中发达的机械组织和细胞壁木质化的基本组织；木材的木质特性，则来自于年轮式样分布的次生木质部”可知，竹秆的木质特性来自于初生结构中发达的机械组织和细胞壁木质化的基本组织，木材的木质特性来自于次生木质部，并不是竹子，偷换概念，当选。\n本题为选非题，故正确答案为D。\n【文段出处】人民网《竹子是草还是树？（把自然讲给你听）》","no":34,"missingImage":false},{"type":"question","qid":"16593195","cat":"片段阅读","stem":"开发前沿技术应用场景的实践价值在于，通过将前沿技术落地转化为生产力。高技能人才的可贵之处不在于突破核心技术，而在于为产业痛点、难点问题找到核心技术的最佳实践运用场景。例如，将智能技术引入水、电、煤等公用事业领域，但不同行业在应用场景选择上存在差异，电力企业重点推进智能电网建设，燃气行业的建设重点是智能表具系统······这些前沿技术的应用场景不是原始创新，而是技术的跨界融合，需要一线技术人员基于行业特点寻找适合的前沿技术实现赋能和融合。\n最适合做这段文字标题的是：","options":{"A":"智能技术的开发与利用具有行业选择性","B":"技术落地的基础——突破创新，跨界融合","C":"找准问题——开发前沿技术应用场景的核心","D":"高技能人才——前沿技术应用落地的“嫁接者”"},"answer":"D","explanation":"文段开篇介绍了将前沿技术落地转化为生产力是开发前沿技术应用场景的实践价值，接着引出“高技能人才”这一话题，并提出观点，强调其重要作用在于能将核心技术应用于产业问题的解决，使这些核心技术得以转化为生产力。后文通过“例如”列举了智能技术在水、电、煤等公用事业领域应用的例子，表示其在不同行业的应用具有差异性，随后指出这些前沿技术的应用场景需要一线技术人员来实现赋能和融合，对前文观点进行论证。故文段重点论述高技能人才在前沿技术应用落地中的融合作用，对应D项，“高技能人才”为文段核心话题，“嫁接者”可体现将技术融合之意。\nA项，缺少文段主题词“高技能人才”，且“行业选择性”仅能对应举例说明的内容，非重点，排除；\nB项，缺少文段主题词“高技能人才”，且“技术落地的基础”文段并未提及，无中生有，排除；\nC项，缺少文段主题词“高技能人才”，且“开发前沿技术应用场景的核心”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】工人日报 《技术赋能、跨界融合：新时代大国工匠的技能新特质》","no":35,"missingImage":false},{"type":"question","qid":"10204508","cat":"语句表达","stem":"长期来看                     。美国“人类脑计划”研究发现，坚持运动可以明显增加神经细胞的数量，使大脑像肌肉一样越练越强大。该现象可能源于一种叫脑源性神经营养因子（BDNF）的物质，有维持现有神经细胞活力并促进新生神经细胞生长的功能。在大脑中，BDNF活跃在前额叶和海马体区域，前额叶掌控着决策、注意力以及人格；海马体具备形成及存储长时记忆的重要功能。\n填入画横线部分最恰当的一项是：","options":{"A":"运动能够增强人的记忆力","B":"运动让人更健康、有活力","C":"运动会增加大脑中某些营养因子","D":"运动能够改变大脑的结构和功能"},"answer":"D","explanation":"横线出现在文段开头，需结合后文内容进行分析。横线后先指出研究发现坚持运动可增加大脑神经细胞数量，使其变强大，随后指出脑源性神经营养因子（BDNF）或是带来这种变化的原因所在，尾句进一步说明了该因子在决策、注意力、人格和记忆方面所发挥的作用。故横线后主要论述了坚持运动会促进大脑神经细胞生长并起到多种作用，对应D项。\nA项，“增强人的记忆力”仅属于一方面的作用，表述片面，排除；\nB项，未提及文段核心话题“大脑”，排除；\nC项，“营养因子”非重点，文段论述的重点是促进大脑神经细胞的生长及其发挥的作用，排除。\n故正确答案为D。\n【文段出处】北京青年报《快来围观 运动是这样让娃变聪明的》","no":36,"missingImage":false},{"type":"question","qid":"10204505","cat":"片段阅读","stem":"我国平台经济具有较好的数据贯通能力和智能分析能力，能够更好地帮助实体经济升级营销模式，提升管理决策效率和营销系统化能力，还可以利用平台应用的能力，提升实体经济中的产业链协同协作效应。因此，政府应积极地引导、支持消费互联网平台转型发展，对平台企业在新技术、新业态等方面的探索和投资布局给予更大的包容与支持，发挥平台优势助力构建我国自主可控的产业生态，在上下游联动、数实融合中创新孵化。\n根据这段文字，我国平台经济需向哪个方向引导？","options":{"A":"提升管理能力","B":"助力产业协同","C":"赋能实体经济","D":"孵化创新产业"},"answer":"C","explanation":"文段开篇指出我国平台经济具有较好的数据贯通能力和智能分析能力，能够帮助实体经济升级营销模式，提升管理决策效率和营销系统化能力。随后通过“还”引导并列，指出平台经济还可利用其应用能力，提升实体经济中的产业链协同协作效应。最后通过“因此”进行总结，指出想要发挥平台经济的作用，政府应采取措施助力数实融合，即数字技术和实体经济深度融合。故文段为分总结构，重点论述平台经济对实体经济的作用，强调我国平台经济需向实体经济方向引导，对应C项。\nA项“提升管理能力”对应“提升管理决策效率”、B项“助力产业协同”对应“提升实体经济中的产业链协同协作效应”，均表述片面，且未提及文段主题词“实体经济”，排除；\nD项，“孵化创新产业”表述不明确，文段强调的是“在数实融合中创新孵化”，该项未提及“实体”，排除。 \n故正确答案为C。\n【文段出处】北京日报《引导平台经济健康持续发展》","no":37,"missingImage":false},{"type":"question","qid":"16593225","cat":"片段阅读","stem":"“中华”一词始于胡汉的区分，却终于胡汉的融合。所以产生这样的结果，根本原因在于“中华”一词并不是一个狭义的“汉人”概念，而是一个较宽泛的文化概念，既不对胡族设限，胡族对其也无明显的抵触与排斥。特别是“中华”之“华”所具有的以“衣冠礼乐”来喻指文化的象征意义，给“中华”这一概念带来了极大的包容度。入唐以后，“中华”一词作为唐朝别称与中国名号被广泛使用的事实，清楚地告诉我们，“中华”概念的实质是“华夷融合”。从很大意义上说，这正是后来历史发展中被“中华”所称谓的人们共同体得以不断扩大的原因。\n根据这段文字，“中华”一词的特点是：","options":{"A":"文化性","B":"历时性","C":"模糊性","D":"开放性"},"answer":"D","explanation":"文段围绕“中华”一词展开论述。首先通过转折指出“中华”一词终于胡汉的融合，紧接着分析其产生的原因，即“中华”一词本身就是一个较宽泛的文化概念，具有极大的包容度，随后又介绍入唐以后“中华”概念的实质是“华夷融合”。最后通过“从很大意义上说”再次强调“中华”的包容度和融合性使得被“中华”所称谓的人们共同体不断扩大。由此可知，文段强调“中华”一词的特点即是包容、融合，对应D项“开放性”。\nA项“文化性”、B项“历时性”、C项“模糊性”均与“包容、融合”的特点无关，排除。\n故正确答案为D。\n【文段出处】清华大学学报 2022年第4期 《东晋南北朝至隋唐胡汉融合与“中华”词义嬗变》","no":38,"missingImage":false},{"type":"question","qid":"16593194","cat":"片段阅读","stem":"天文学家用基尼系数来描述星系的面亮度分布不均（用星光替代社会学基尼系数定义中的人类财富）：基尼系数越大，意味着亮度越集中分布在少数区域，星系越倾向为椭圆（年老）星系。年轻和年老星系的分界线就在0.5-0.6左右，即如果一个星系的亮度分布不均匀程度超过0.5，则该星系很大概率近似椭圆星系，已失去了制造新恒星的能力了（变成年老星系）。基尼系数在区分不同类星系中的巨大成功使其成为研究星系及星系形态的一个重要参数。\n根据这段文字，基尼系数在区分不同类星系中的成功表现是：","options":{"A":"区别不同星系表面的明亮程度","B":"演示不同星系从年轻到年老的过程","C":"可以用来描述不同星系与恒星的形状","D":"判断不同星系是否失去制造新恒星的能力"},"answer":"D","explanation":"A项，根据“天文学家用基尼系数来描述星系的面亮度分布不均（用星光替代社会学基尼系数定义中的人类财富）”可知，基尼系数被用来描述“亮度分布”，“明亮程度”偷换概念，排除；\nB项，根据“年轻和年老星系的分界线就在0.5-0.6左右”可知，文段仅论述两者的分界线，而非“星系从年轻到年老的过程”，表述错误，排除；\nC项，根据“基尼系数越大，意味着亮度越集中分布在少数区城，星系越倾向为椭圆（年老）星系······则该星系很大概率近似椭圆星系”可知，“恒星的形状”无中生有，排除；\nD项，根据“如果一个星系的亮度分布不均匀程度超过0.5，则该星系很大概率近似椭圆星系，已失去了制造新恒星的能力了（变成年老星系）”可知，基尼系数在区分不同类星系中的成功表现即为“判断不同星系是否失去制造新恒星的能力”，表述正确，当选。\n故正确答案为D。\n【文段出处】中科院物理所《宇宙社会学：宇宙与人》","no":39,"missingImage":false},{"type":"question","qid":"16593190","cat":"片段阅读","stem":"近年来，为建设便民生活圈，北京、上海、杭州等多地兴办了不少社区食堂。除了老年人，一些年轻人、附近社区居民也逐渐成为忠实的消费者。数据显示，截至2022年底，上海市已累计建成社区（长者）食堂305家，老年助餐点1303家。不过，在一些社区食堂备受追捧的同时，也有部分食堂出现运营困难，客源单一、饭菜质量不高是其乏人问津的主要原因。社区食堂的经营需通过科学布局、集约建设和精细化运营实现，要避免脱离社区实际盲目配置食堂，浪费公共资金。经营者也须有市场化竞争意识，在长期运营上拿出“绣花功夫”。\n最适合做这段文字标题的是：","options":{"A":"社区食堂的“小餐桌”与“大民生”","B":"统筹社区食堂“公益”与“效益”","C":"激发活力，创新社区食堂运营新模式","D":"办好食堂，让社区居民共享幸福“食”光"},"answer":"B","explanation":"文段开篇指出多地兴办社区食堂的背景，并通过数据论证社区食堂数量众多，接着通过转折关联词“不过”指出部分食堂出现运营困难的问题，并分析了问题产生的原因，后文通过对策标志词“需”强调应根据社区实际配置食堂，避免浪费公共资金，最后通过“也”表达并列，指出经营者要有市场化竞争意识，故整个文段为背景铺垫+提出问题+解决问题的结构，重点强调经营社区食堂的并列两方面的对策，即社区食堂的经营既要避免浪费公共资金，对应B项中的“公益”，也要有市场化竞争意识，对应B项中的“效益”，二者统筹兼顾，对应B项。\nA项，仅强调社区食堂的重要性，并非围绕社区食堂的经营困难提出对策，偏离文段中心，排除；\nC项，“创新社区食堂运营新模式”表述过于宽泛，不及B项对应准确，且文段并非仅论述“运营”时应如何做，还强调了在运营之前需要做好前期的科学布局，排除；\nD项，“办好食堂”表述不明确，文段已经给出“既要避免浪费公共资金，也要有市场化竞争意识”的具体措施，排除。\n故正确答案为B。\n【文段出处】经济日报《统筹社区食堂“公益”与“效益”》","no":40,"missingImage":false},{"type":"question","qid":"16593214","cat":"片段阅读","stem":"在真空蒸发器内，卤水在外来蒸汽的作用下加热沸腾，水分的蒸发使卤水得到浓缩，卤水蒸发出的二次蒸汽温度低于外来输入蒸汽的温度，但仍然携带较多热量，二次蒸汽中的热量会被输入到下一级蒸发器中，二次蒸汽的温度相对较低，为了有效利用其中的热量，此时会降低蒸发器中的压力，水的沸点会随之降低，卤水会在更低的温度下沸腾，其产生的蒸汽又能够被用于气压更低的下一级蒸发器中。如此，通过多个蒸发器联用，不断回收蒸汽来进行加热，可以大大节省蒸汽的消耗量。\n根据这段文字，为了节省蒸汽消耗量需采取的措施是：","options":{"A":"降低卤水的浓度","B":"提高蒸汽的温度","C":"降低蒸发器中气压","D":"增加蒸发器的数量"},"answer":"C","explanation":"文段首先介绍了在真空蒸发器内，卤水在外来蒸汽的作用下加热沸腾，接着指出卤水蒸发出的二次蒸汽仍然携带较多热量，可通过降低蒸发器中的压力，让水的沸点随之降低，从而使得卤水在更低的温度下再次沸腾，进而达到节省蒸汽消耗量的目的，即外来蒸汽—卤水加热沸腾—二次蒸汽（卤水）—降低压力—水沸点降低—卤水再次沸腾，故节省蒸汽消耗量的举措为“降低蒸发器中的压力”，对应C项。\nA项，根据“在真空蒸发器内，卤水在外来蒸汽的作用下加热沸腾，水分的蒸发使卤水得到浓缩······”可知，降低卤水浓度的做法与节省蒸汽消耗量的举措无关，排除；\nB项，“提高蒸汽温度”的做法文段并未提及，无中生有，排除；\nD项，根据“如此，通过多个蒸发器联用，不断回收蒸汽来进行加热，可以大大节省蒸汽的消耗量”可知，为了节省蒸汽消耗量，主要是通过降低蒸发器当中的气压，再将多个蒸发器联用，使得蒸汽不断被回收，而非增加蒸发器的数量，排除。\n故正确答案为C。\n【文段出处】科技日报《陶瓷膜过滤、多效真空蒸发······小盐粒蕴含大科技》","no":41,"missingImage":false},{"type":"question","qid":"16593193","cat":"片段阅读","stem":"发展现代设施农业是转变农业发展方式的重要内容。相较于传统农业，现代设施农业把保护环境、低碳节能作为发展的前提条件，按照循环发展理念，通过运用人工智能技术、物联网技术等，不仅可以节约大量水资源、土地资源和人力资源，还能有效降低污染物的排放量，减少资源浪费和环境污染。此外，现代设施农业使用高科技技术和先进设备，通过农业生产标准化、精准化、智能化，让土地利用率、劳动产出率更高，资源能耗、生产成本更低，产品更有品质、生态更加安全，助力农业增效和农民增收。\n关于现代设施农业，这段文字未提及：","options":{"A":"推动传统农业向现代农业转型升级","B":"减少资源消耗将促进农民收入增长","C":"有效降低环境污染有利于保护环境","D":"运用人工智能实现农业无人化生产"},"answer":"D","explanation":"A项，根据“发展现代设施农业是转变农业发展方式的重要内容。相较于传统农业······”可知，发展现代设施农业可以推动农业由传统农业转变为现代农业，文段已提及，排除；\nB项，根据“此外，现代设施农业······资源能耗、生产成本更低，产品更有品质、生态更加安全，助力农业增效和农民增收”可知，文段已提及，排除；\nC项，根据“相较于传统农业，现代设施农业······不仅可以节约大量水资源、土地资源和人力资源，还能有效降低污染物的排放量，减少资源浪费和环境污染”可知，文段已提及，排除；\nD项，“实现农业无人化生产”文段并未提及，当选。\n本题为选非题，故正确答案为D。\n【文段出处】光明日报《用现代设施打造富农强农新引擎》","no":42,"missingImage":false},{"type":"question","qid":"16593185","cat":"片段阅读","stem":"语言规划学的研究告诉我们，什么样的语言生活，塑造什么样的语言样态，也就培育什么样的语言能力。古诗词和复杂灵动的修辞有其恒久的价值与魅力，但不要忘记，在唐诗宋词滥觞的岁月，它们也是因适应当时的文人语言生活才获得发展的。回到今天，不论线上线下，我们都很难要求话语里也三句一成语、五句一典故。恰恰相反，不同于直接生硬的引用，在这个网络时代，有恒久魅力的经典语言文化正在以新的方式焕发生机。如把古诗词咏唱出来，新造成语用四字格描述今人情绪······如此种种不胜枚举。\n这段文字意在说明：","options":{"A":"经典的文化元素在每个时代都会流行","B":"每个时代都有其独特的语言生活和样态","C":"语言文化必须适应语言生活才能获得发展","D":"经典文化元素在不同时代会有不同的表现形式"},"answer":"C","explanation":"文段开篇指出语言生活影响语言样态和语言能力，强调语言生活的重要性，后文首先通过转折指出古诗词和修辞是适应当时的语言生活才得以发展的，随后指出在今天的环境下，我们很难要求出口就是成语或典故，经典语言文化在网络时代正以新的方式焕发生机，即经典语言文化适应了现在的语言生活，有新的表现形式，随后进行举例论证。故文段重在强调语言文化需要语言生活，二者具有适配性，对应C项。\nA、D两项，均未提及文段主题词“语言文化”“语言生活”，偏离文段中心，排除；\nB项，未体现“语言文化”和“语言生活”的关系，且缺少“语言文化”这一核心话题，偏离文段中心，排除。\n故正确答案为C。\n【文段出处】《让网络激发语言热情》","no":43,"missingImage":false},{"type":"question","qid":"16593218","cat":"语句表达","stem":"①而一些飞鸟会凭借着敏锐的感知能力发现这一变化\n②为了逃生，这些动物就会表现出异常的举动\n③地震发生之前发出的次声波，能够被许多动物提前感知到\n④地震出现之前，地球的磁场也会发生变化\n⑤地震的出现，是板块随着时间的推移，进行不断的挤压和碰撞形成的自然现象\n⑥所以在地震来临之前，鸟类就会因为磁场的变化，而率先感知到了危险，并做出异于平常的行为\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"⑤③②④①⑥","B":"⑤④①⑥③②","C":"③②④①⑥⑤","D":"③⑤⑥①④②"},"answer":"A","explanation":"观察选项，对比首句。⑤句对地震下定义，引出地震的话题，③句论述许多动物能够感知地震发生前的次声波，⑤句更加适合作为首句，故排除C、D两项。\n继续观察选项，对比⑤句后接③句还是④句，③句论述许多动物能够感知地震发生前的次声波，可与⑤句衔接，对应A项。④句通过并列关联词“也”指出地震出现之前，磁场发生了变化，由此可知④句之前的句子应表明地震发生前的其他变化，而⑤句是对地震进行下定义，无法构成关联词捆绑，排除B项。\n验证A项，⑤句通过下定义引出“地震”的话题，③②指出许多动物能提前感知到地震之前发出的次声波，并表现出异常的举动，④①⑥通过“也”表并列，又指出一些鸟类通过地震之前磁场的变化感知到了危险，并做出异常举动。整个文段介绍了地震的定义引入话题之后，从两方面介绍动物对其的提前感知与异常行为，逻辑顺畅。\n故正确答案为A。\n【文段出处】《飞鸟聚集、撞树是地震前兆吗？》","no":44,"missingImage":false},{"type":"question","qid":"16593188","cat":"语句表达","stem":"①作为研究文化遗存的一门学科，考古学无法与人相割裂，在科研中，应力求“透物见人”，抓住人类历史进程的发展规律\n②公共考古学应积极搭建考古知识的传播与共享平台，加快考古学文化的普及化与大众化，促进考古学知识与民众的沟通交流\n③以公众为中心，进行考古和文化遗产的公共文化传播是考古工作者的社会责任\n④在这一过程中，考古工作者只是启蒙者，公众才是真正的践行者\n⑤坚持考古学的大众化，以公众为中心是应该坚持的原则之一\n⑥在共享中，更要以人为中心，以多方式、多角度、多层次对考古学知识进行阐释，提供更多的“文明的碎片”和观点，拉近公众与考古的距离，帮助公众完成自己的“文明拼图”\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"③②⑤①⑥④","B":"⑤④③②①⑥","C":"③⑤⑥②①④","D":"⑤②④③①⑥"},"answer":"A","explanation":"对比选项，确定首句。③句介绍“以公众为中心”是考古工作者的社会责任，⑤句指出“以公众为中心”是考古学的大众化的原则之一，二者均可作为首句，不易判断。\n继续寻找其他线索，④句出现指代词“这一过程中”，考虑捆绑解题。④句指出“考古工作者只是启蒙者，公众才是真正的践行者”，故前文应体现两者的具体做法。④句之前分别为①句、②句、⑤句及⑥句，⑥句中的“对考古学知识进行阐释”对应考古工作者，“公众完成自己的‘文明拼图’”对应公众，与④句衔接恰当，保留。\n①句论述“在科研中······抓住人类历史进程的发展规律”，②句论述“考古学应积极搭建······”，以及⑤句强调“以公众为中心”的原则，这三句均只对应“考古工作者”的做法，未提及“公众”的做法，与④句衔接不当，排除B、C、D三项。\n验证A选项的逻辑，③②⑤三句话均围绕考古工作以公众为中心，进行考古学文化的传播和普及展开。①⑥两句话分别从科研的角度和共享的角度详细论述了考古学要抓住人类历史进程的发展规律，以人为中心帮助公众完成自己的“文明拼图”。④句“在这一过程中”指代上文做出总结，得出结论：考古工作者只是启蒙者，公众才是真正的践行者。逻辑顺畅，当选。\n故正确答案为A。\n【文段出处】《文化自觉视域下的公共考古学》","no":45,"missingImage":false}],"count":25,"answerable":25,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"10204507","cat":"数学运算","stem":"甲和乙两个工厂共同承接 50 万个零件的生产任务，********个，之后乙也招聘新工人，\n将日产量提升 20%，问两个工厂还需要多少天才能完成全部生产任务（不足 1 天的部分算 1\n天）?","options":{"A":"12","B":"13","C":"14","D":"15"},"answer":"D","explanation":"略。","redacted":true,"no":46,"missingImage":false},{"type":"question","qid":"16593096","cat":"数学运算","stem":"运动会招募志愿者，第一次招募了不到100人，其中男女比例为11：7；补招若干女性志愿者后，男女比例变为4：3。问最多可能补招了多少名女性志愿者？","options":{"A":"3","B":"5","C":"6","D":"10"},"answer":"B","explanation":"根据“男女比例为11：7”“补招若干女性志愿者后，男女比例变为4：3”可知，男生人数既是11的倍数，又是4的倍数，男生人数为44n。结合“第一次招募了不到100人”可知，男生人数是44人，原来女生人数为44÷11×7=28人；补招后女生人数变为44÷4×3=33人。可知女生最多可能补招人数为33-28=5人。\n故正确答案为B。","no":47,"missingImage":false},{"type":"question","qid":"16593098","cat":"数学运算","stem":"c地为a、b两地直线道路上的一点，甲、乙两人9：00分别自a、b两地同时出发匀速相向而行，甲的速度是乙的1.5倍，甲9：40到达c地休息10分钟后继续向b地前进；乙全程不休息，在10：40到达c地，问甲、乙相遇的时间为：","options":{"A":"10：00","B":"10：10","C":"10：20","D":"10：30"},"answer":"B","explanation":"方法一：赋值甲每分钟的速度为3，乙每分钟的速度为2。根据甲9：40到达c地，则\u003cimg data-k=\"d07f8d7d4e66\">；乙全程不休息，在10：40到达c地，则\u003cimg data-k=\"f8263666b728\">，因此ab的路程\u003cimg data-k=\"1841ef7d43fe\">。设甲、乙两人从9：00开始出发t分钟后相遇，则\u003cimg data-k=\"751bfb701434\">\u003cimg data-k=\"449fd6964ae9\">，解得t=70，因此甲、乙相遇的时间为9：00+70分钟=10：10。\n方法二：赋值甲每分钟的速度为3，乙每分钟的速度为2。根据乙9：00出发，在10：40到达c地，可得乙从b地到c地的路程为2×100=200。当甲9：50离开c地继续向b地前进时，乙已走的路程为2×50=100，此时甲、乙继续相向而行所需的相遇时间\u003cimg data-k=\"f098b9f5158c\">\u003cimg data-k=\"57ee9778592b\">\u003cimg data-k=\"8b10d7592a42\">分钟，则甲、乙相遇时间为9：50+20分钟=10：10。\n故正确答案为B。","no":48,"missingImage":false},{"type":"question","qid":"16593107","cat":"数学运算","stem":"从甲地到乙地的全价机票为2000元，购买全价或折扣机票，每张都要支付120元税费，从甲地到乙地的高铁票价为680元，企业要安排20人当日从甲地前往乙地出差，单程总预算不超过2万元，已知当日高铁票、机票都充足，2折、3折和5折机票分别还剩余2张、3张和5张，其余为全价机票，问在预算范围内最多能安排多少人乘飞机前往乙地？","options":{"A":"11","B":"12","C":"13","D":"14"},"answer":"C","explanation":"题干要求预算范围内安排乘飞机前往乙地的人数最多，结合选项可知乘飞机的人数大于折扣机票的剩余张数2+3+5=10张，则题干中的折扣机票应全部购买，购买折扣机票的费用为2000×0.2×2+2000×0.3×3+2000×0.5×5+120×10=8800元；设购买全价机票的人数为n人，根据题意可列方程：\u003cimg data-k=\"4bbe3fbe5d4c\">，解得\u003cimg data-k=\"8fb5e7e5a86b\">，则n=3人。故在预算范围内最多能安排乘飞机前往乙地的人数为10+3=13人。\n故正确答案为C。","no":49,"missingImage":false},{"type":"question","qid":"10204498","cat":"数学运算","stem":"一块直角三角形绿地的三边均铺有长度为整数米的水管，其中一条直角边外的水管长7米。若在水管上随机任选1个点做标记，则该标记点在斜边上的概率在以下哪个范围内？（忽略水管直径）","options":{"A":"小于0.35","B":"在0.35~0.42之间","C":"在0.42~0.50之间","D":"大于0.50"},"answer":"C","explanation":"根据题意，若直角三角形一条直角边为a，a=7米，设另外一条直角边为b，斜边长为c，根据勾股定理可知\u003cimg data-k=\"8ca85ada2c4f\">，即（c+b）×（c-b）=49×1，可得：c+b=49······①，c-b=1······②，联立①②两式，解得：b=24米，c=25米。根据公式：概率\u003cimg data-k=\"9db2ad4de1b5\">，若在水管上随机任选1个点做标记，则该标记点在斜边上的概率为\u003cimg data-k=\"22f6053c16d2\">，在C项范围内。\n故正确答案为C。","no":50,"missingImage":false},{"type":"question","qid":"16593094","cat":"数学运算","stem":"高校管理学院某期培训班有不到100名学员参加，期中、期末两次考试平均分分别为68分和75分，期中考试不及格学员平均分为53分，及格学员平均分为74分；期末考试不及格学员平均分为47分、及格学员平均分为83分。问这期培训班有多少名学员参加？","options":{"A":"42","B":"54","C":"63","D":"77"},"answer":"C","explanation":"方法一：设该期培训班期中考试及格人数和不及格人数分别为x、y人，期末考试及格人数和不及格人数分别为a、b人，根据题意可知，期中考试总成绩为74x+53y=68（x+y），化简可得2x=5y，所以\u003cimg data-k=\"33912c9fa4a5\">，则总人数x+y为7的倍数；期末考试总成绩为83a+47b=75（a+b），化简可得2a=7b，所以\u003cimg data-k=\"e35d55eadfdd\">，则总人数a+b为9的倍数。综上，总人数为7和9的公倍数，即为63的倍数，结合总人数不到100人，则总人数为63人。\n故正确答案为C。\n方法二：由期中考试不及格学员平均分为53分，及格学员平均分为74分，期中考试平均分为68分，根据线段法口诀“距离与量成反比”可得，\u003cimg data-k=\"8faca91b5efa\">，解得\u003cimg data-k=\"abd2a85d2f7f\">，则总人数为7的倍数；由期末考试不及格学员平均分为47分、及格学员平均分为83分，期末考试平均分为75分，根据线段法口诀“距离与量成反比”可得，\u003cimg data-k=\"3c1c6cf3168b\">，解得\u003cimg data-k=\"1faacd4fbdbd\">，则总人数为9的倍数。综上，总人数为7和9的公倍数，即为63的倍数，结合总人数不到100人，则总人数为63人。\n\u003cimg data-k=\"edfb06f0206b\" style=\"max-width:615px\">\n故正确答案为C。","no":51,"missingImage":false},{"type":"question","qid":"16593104","cat":"数学运算","stem":"一个白色圆柱体零件的底面半径是高的1.5倍，现将其表面涂上黑漆之后，沿下图所示虚线方向切割为4个完全相同的部分。问单个部分的黑色面积是白色面积的多少倍？（\u003cimg data-k=\"5f6c6aa4a8d6\">）\n\u003cimg data-k=\"0e6c45b32057\" style=\"max-width:217px\">","options":{"A":"不到1.1倍","B":"1.1-1.2倍之间","C":"1.2-1.3倍之间","D":"1.3倍以上"},"answer":"B","explanation":"根据题意，赋值该圆柱零件高为2，则底面半径为3，\u003cimg data-k=\"9411fedb2b04\">\u003cimg data-k=\"7b725eec974f\">；切割后单个部分如图所示，其黑色面积\u003cimg data-k=\"78085fdd66c4\">\u003cimg data-k=\"1851598eaf34\">，其白色面积\u003cimg data-k=\"b4ffc2f7c4de\">\u003cimg data-k=\"8ff598d2cc08\">\u003cimg data-k=\"2f299d250e31\">，则所求倍数为\u003cimg data-k=\"28f9221f6379\">\u003cimg data-k=\"1d00dbf87423\">倍，在B项范围内。\n\u003cimg data-k=\"cb90237878f7\" style=\"max-width:343px\">\n故正确答案为B。","no":52,"missingImage":false},{"type":"question","qid":"16593097","cat":"数学运算","stem":"商店销售甲、乙、丙、丁四种商品，每件分别盈利15元、9元、4元和1元。某日销售这四种商品共40件，共盈利201元。四种商品每种至少销售1件，且甲、丁商品销量相同。问当天丙商品的销量为多少件？","options":{"A":"21","B":"27","C":"29","D":"31"},"answer":"D","explanation":"根据“甲、丁商品销量相同”，设甲、乙、丙、丁四种商品销量分别为x件、y件、z件、x件。根据“这四种商品共40件”可得，2x+y+z=40······①；根据“共盈利201元”可得，15x+9y+4z+x=201······②。令①×8-②可消去x，得4z-y=119。因为四种商品每种至少销售1件，可得4z＞119，即\u003cimg data-k=\"f06f1a77e51c\">，排除A、B、C三项。代入D项验证，若z=31，则y=4z-119=124-119=5，2x=40-31-5=4，x=2，符合题干所有条件。\n故正确答案为D。","no":53,"missingImage":false},{"type":"question","qid":"16593103","cat":"数学运算","stem":"安排A、B、C、D共4个研发团队参与甲、乙、丙3个课题的研究，要求每个课题至少有1个团队参与，每个团队必须且只能参与1个课题，如甲课题参与的团队数超过1个，则A、B都不参与甲课题，问共有多少种不同的安排方式？","options":{"A":"24","B":"26","C":"36","D":"42"},"answer":"B","explanation":"根据题意可知，甲课题参与的团队数可能为1个或2个，分情况讨论如下：\n（1）甲课题参与的团队数为1个，先从4个研发团队中任意选择1个有\u003cimg data-k=\"be99391be9cc\">种情况，再让剩下3个团队参与乙、丙2个课题有\u003cimg data-k=\"9ba99a92b39c\">种情况，分步用乘法，共有4×6=24种情况。\n（2）甲课题参与的团队数为2个，则只能C、D参与甲课题，剩下A、B2个团队参与乙、丙2个课题有\u003cimg data-k=\"54bf29117685\">种情况。\n分类用加法，则共有24+2=26种安排方式。\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"16593100","cat":"数学运算","stem":"部队射击比赛中，5名参赛的战士共击中了88次目标。已知任意2人击中的目标数量均互不相同，问射击成绩排前两名的战士至少击中了多少次目标？","options":{"A":"37","B":"39","C":"58","D":"82"},"answer":"B","explanation":"根据题意，要使排前两名的战士击中的次数尽可能少，则其他战士击中的次数要尽可能多。设第二名击中x次，又因任意2人击中的目标数量均互不相同，可得击中次数如下：\n\u003cimg data-k=\"8538f1ec8bdd\" style=\"max-width:561px\">\n根据“5名战士共击中了88次目标”，可列式：x+1+x+x-1+x-2+x-3=88，解得x=18.6，则第二名至少击中19次目标，第一名为x+1=20次，可得前两名至少击中了20+19=39次目标。\n故正确答案为B。","no":55,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"10204455","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性：\n\u003cimg data-k=\"9d2834f262c6\" style=\"max-width:606px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，题干图形封闭区域明显，考虑面数量，但题干与选项图形的面数量均为6，无法选出答案，考虑面的细化，再次观察发现，题干图形基本含有三角形面，考虑三角形面的数量，题干图形三角形面数量依次为0、1、2、3、4，所以“？”处图形的三角形面数量应为5，只有B项符合。\n故正确答案为B。","no":56,"missingImage":false},{"type":"question","qid":"16593170","cat":"图形推理","stem":"从所给的四个选项中，选择最适合的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"4dab87ffaeda\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"解析一：元素组成相同，优先考虑位置规律。观察发现，题干相邻两幅图形中，左侧三列元素整体向右平移1列，最右侧一列元素移动到最左侧后，又整体向下平移1行（如下图所示），只有A项符合规律。\n\u003cimg data-k=\"0e34d3adc90f\" style=\"max-width:600px\">\n解析二：元素组成相同，优先考虑位置规律。观察发现，题干所有图形均向右平移一格，走到头换到下一行，最后一行走完又走到第一行，所有图形首尾相连，循环往复，如图箭头所示。\n\u003cimg data-k=\"1f2714934c5f\" style=\"max-width:619px\">\n图中标记1的图形，问号处位置如图，排除C、D两项；\n\u003cimg data-k=\"cd4f55b68578\" style=\"max-width:612px\">\nA、B两项的区别在于标记1的图形前面的图形，如图画圈图形，观察发现，只有A符合。\n\u003cimg data-k=\"0f0a40e0faa8\" style=\"max-width:618px\">\n故正确答案为A。","no":57,"missingImage":false},{"type":"question","qid":"10204457","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"a1c1c7c8ad7f\" style=\"max-width:578px\">","options":{"A":"①③④，②⑤⑥","B":"①③⑤，②④⑥","C":"①⑤⑥，②③④","D":"①④⑥，②③⑤"},"answer":"C","explanation":"本题为分组分类题目。观察发现，题干图形内部被线条分割，优先考虑面数量，所有图形面数量均为5，且均明显存在最大面，最大面出现等腰元素，可优先考虑最大面的对称性，图①⑤⑥最大面均为中心对称图形，图②③④最大面均为轴对称图形，即图①⑤⑥一组，图②③④一组。\n故正确答案为C。","no":58,"missingImage":false},{"type":"question","qid":"10204454","cat":"图形推理","stem":"请从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"b4365015d3a1\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形均由黑球和白球构成，且黑白球分割明显，考虑部分数。题干图形中，黑球部分数依次为1、1、3、3、2，白球部分数依次为1、2、1、2、4，单独看无规律，考虑运算。黑球部分数+白球部分数依次为2、3、4、5、6，故问号处应选择一个黑球部分数+白球部分数为7的图形，只有C项符合。\n故正确答案为C。","no":59,"missingImage":false},{"type":"question","qid":"16593168","cat":"图形推理","stem":"下图为15个白色和5个灰色正方体组合而成的多面体，右边哪一个不可能是其某个角度的视图？\n\u003cimg data-k=\"9b11bc13d450\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查三视图，逐一分析选项。\nA项：题干立体图形从仰视（即从下往上）的视角可以看到下图的图形，再将视角顺时针或逆时针旋转\u003cimg data-k=\"dd44efe89e5a\">后，即为A项视图，排除；\n\u003cimg data-k=\"bf4aef24206c\" style=\"max-width:116px\">\nB项：该项不是题干立体图形的视图，当选；\nC项：题干立体图形从右视（即从右往左）的视角可以看到下图的图形，再将视角旋转\u003cimg data-k=\"65c9d9957ef9\">后，即为C项视图，排除；\n\u003cimg data-k=\"4ef3eb04a43b\" style=\"max-width:123px\">\nD项：题干立体图形从后视（即从后往前）的视角可以看到下图的图形，再将视角顺时针旋转\u003cimg data-k=\"dd44efe89e5a\">后，即为D项视图，排除。\n\u003cimg data-k=\"17b6577b75e8\" style=\"max-width:115px\">\n本题为选非题，故正确答案为B。","no":60,"missingImage":false},{"type":"question","qid":"16593139","cat":"定义判断","stem":"矛盾职业认同是指从业者对自身职业兼具认同和不认同，或认同职业某一方面而不认同其他方面，反映了个体对自身职业的复杂情感。\n根据上述定义，下列属于矛盾职业认同的是：","options":{"A":"小强对未来就业感到迷茫，一方面认为本专业相对好就业，另一方面觉得工作压力会很大","B":"虽然觉得社会上有很多人对网络主播并不认同，但小飞却决定将主播当作一生的事业来做","C":"小刚的父母希望他毕业后考公务员，但小刚自己却更喜欢做一名教师","D":"老汪觉得送快递很累，但工作时间相对自由，因此他还是决定干下去"},"answer":"D","explanation":"第一步：找出定义关键词。\n“从业者”、“对自身职业兼具认同和不认同”、“认同职业某一方面而不认同其他方面”。\n第二步：逐一分析选项。\nA项：小强还未就业，不符合“从业者”，不符合定义，排除；\nB项：社会上有很多人对网络主播并不认同，但小飞本人却对主播事业很坚定，仅体现出小飞对于主播事业的认同，不符合“对自身职业兼具认同和不认同”、“认同职业某一方面而不认同其他方面”，不符合定义，排除；\nC项：父母希望小刚考公务员，小刚自己却更喜欢做一名教师，不明确小刚是否为从业者，并且仅体现了父母和小刚关于小刚未来职业的想法不同，不符合“对自身职业兼具认同和不认同”、“认同职业某一方面而不认同其他方面”，不符合定义，排除；\nD项：老汪是快递员，符合“从业者”，他觉得送快递很累，但工作时间相对自由，符合“对自身职业兼具认同和不认同”、“认同职业某一方面而不认同其他方面”，符合定义，当选。\n故正确答案为D。","no":61,"missingImage":false},{"type":"question","qid":"10204473","cat":"定义判断","stem":"述情障碍是指个体情感功能相对受限，个体无法识别自己或他人的情感，在生活中常常表现为无法找到合适的言语来表达个人感情的一种人格特征。\n根据上述定义，下列涉及述情障碍的是：","options":{"A":"面对同事的误解和质疑，小刘依然没有半句解释，一如既往地选择了沉默","B":"在铁证如山的事实面前，一向能言善辩的嫌疑人犹如泄了气的皮球，一句话也说不出来","C":"小马理解不了人们为何总是在散发恶臭的垃圾面前常常皱眉，对社会丑恶现象也视而不见","D":"面对老师的批评，其他几位被批评的同学已经羞得无地自容，但小刚却还挤眉弄眼笑嘻嘻"},"answer":"D","explanation":"第一步：找出定义关键词。\n“个体无法识别自己或他人的情感”、“无法找到合适的言语来表达个人感情”。\n第二步：逐一分析选项。\nA项：小刘在面对同事的误解和质疑时选择沉默，没有体现小刘“无法识别自己或他人的情感”，而且沉默也不代表“无法找到合适的言语来表达个人感情”，不符合定义，排除；\nB项：嫌疑人无话可说是因为铁证如山，不符合“个体无法识别自己或他人的情感”、“无法找到合适的言语来表达个人感情”，不符合定义，排除；\nC项：小马只是无法理解他人在垃圾面前皱眉的行为，没有体现“个体无法识别自己的情感”，也不符合“无法找到合适的言语来表达个人感情”，不符合定义，排除；\nD项：面对老师批评时其他同学在羞愧，但小刚没有羞愧，说明小刚对自己或他人的情感识别上存在问题，符合“个体无法识别自己或他人的情感”，“挤眉弄眼笑嘻嘻”的行为体现了“无法找到合适的言语来表达个人感情”，符合定义，当选。\n故正确答案为D。","no":62,"missingImage":false},{"type":"question","qid":"16593142","cat":"定义判断","stem":"领导负面反馈是指领导对员工当前行为或绩效未达到目标或标准时所给予员工的指示、否定或批评，其目的是激励员工更加努力工作或改变行为方式以减小差距。\n根据上述定义，下列属于领导负面反馈的是：","options":{"A":"人力资源部王部长对总经理说，员工小李的工作能力实在太差，建议合同到期后不再续聘","B":"厨师小徐因为炒菜口味问题被顾客多次投诉，厨师长对他进行了严肃批评并帮他寻找原因","C":"在单位年终总结会上，小冯为激励自己进步，积极就自身工作不足向同事们征求批评意见","D":"办公室侯主任把年度考核不合格的员工名单递交给人事处，人事处向员工通报了处理结果"},"answer":"B","explanation":"第一步：找出定义关键词。\n“领导对员工当前行为或绩效未达到目标或标准时所给予员工的指示、否定或批评”、“激励员工更加努力工作或改变行为方式以减小差距”。\n第二步：逐一分析选项。\nA项：人力资源部长对总经理说员工小李的工作能力差，符合“领导对员工当前行为或绩效未达到目标或标准时所给予员工的指示、否定或批评”，但他建议合同到期后不续聘，不符合“激励员工更加努力工作或改变行为方式以减小差距”，不符合定义，排除；\nB项：小徐因为炒菜口味问题被顾客多次投诉，厨师长对小徐进行了严肃批评，符合“领导对员工当前行为或绩效未达到目标或标准时所给予员工的指示、否定或批评”，帮助他寻找被投诉的原因，符合“激励员工更加努力工作或改变行为方式以减小差距”，符合定义，当选；\nC项：小冯为激励自己进步，向同事们征求批评意见，不符合“领导对员工当前行为或绩效未达到目标或标准时所给予员工的指示、否定或批评”，不符合定义，排除；\nD项：办公室侯主任把年度考核不合格的员工名单递交给人事处，由人事处向员工通报处理结果，不符合“领导对员工当前行为或绩效未达到目标或标准时所给予员工的指示、否定或批评”，不符合定义，排除。\n故正确答案为B。","no":63,"missingImage":false},{"type":"question","qid":"16593136","cat":"定义判断","stem":"职场义警是指认为自己在没有正式授权的情况下，能够监控周围环境中是否存在违反公司规范的迹象，并在自认为适当或合理的时候对感知到的违规同事进行直接或间接处罚的人。\n根据上述定义，下列属于职场义警的是：","options":{"A":"小张认为公司强制加班的行为违反了劳动法，于是向公司主管部门进行实名举报","B":"戴红袖标的居委会王阿姨在斑马线义务执勤时，对乱闯红灯的行人进行口头批评","C":"有同事利用上班时间闲聊，老周看不过去，瞅准机会找到这位同事进行批评教育","D":"保卫科小刘专门就公司员工安全意识弱现象向领导进行汇报，建议领导通报批评"},"answer":"C","explanation":"第一步：找出定义关键词。\n“在没有正式授权的情况下”、“监控到违反公司规范的迹象”、“自认为适当或合理的时候对违规同事进行处罚”。\n第二步：逐一分析选项。\nA项：小张认为公司行为违反劳动法，于是向公司主管部门进行实名举报，其中举报行为并非惩罚行为，不符合“自认为适当或合理的时候对违规同事进行处罚”，不符合定义，排除；\nB项：居委会王阿姨对违反交通规则的行人进行批评是发生在其义务执勤期间，监督行人遵守交通规则是王阿姨的工作内容，不符合“在没有正式授权的情况下”，不符合定义，排除；\nC项：老周对上班闲聊的同事进行批评教育，但并未提及老周的身份是领导，所以他并没有权力批评教育该同事，符合“在没有正式授权的情况下”，老周瞅准机会直接批评上班闲聊的同事，符合“自认为适当或合理的时候对违规同事进行处罚”，符合定义，当选；\nD项：关注员工安全意识的问题在保卫科小刘的工作范围之内，不符合“在没有正式授权的情况下”，不符合定义，排除。\n故正确答案为C。","no":64,"missingImage":false},{"type":"question","qid":"16593131","cat":"定义判断","stem":"警觉性市场学习是指企业或组织为提高深度市场洞察而提前建立预警系统，并保持注意力集中以预测市场变化或感知客户需求微弱信号的学习行为。\n根据上述定义，下列属于警觉性市场学习的是：","options":{"A":"公司提醒小吴要想在职场中保持优势地位，避免被淘汰，就必须利用业余时间多学习","B":"阳阳上课时注意力不集中，为帮他养成良好学习习惯，家长聘请了心理专家进行干预","C":"某知名企业组建市场调研部，定期监测市场动向，积极培训员工，努力规避潜在风险","D":"某房地产开发商通过暂缓开发或拖延施工进度等方式，试图化解可能面临的发展危机"},"answer":"C","explanation":"第一步：找出定义关键词。\n“企业或组织”、“为提高深度市场洞察而提前建立预警系统”、“预测市场变化或感知客户需求”。\n第二步：逐一分析选项。\nA项：公司提醒小吴利用业余时间多学习避免被淘汰，是公司对员工的提醒，不属于对市场变化的预测和对客户需求的感知，不符合“预测市场变化或感知客户需求”，不符合定义，排除；\nB项：家长聘请心理专家帮助阳阳养成良好的学习习惯，其中阳阳的家长不属于企业或组织，不符合“企业或组织”，不符合定义，排除；\nC项：某知名企业组建市场调研部，定期监测市场动向，符合“企业或组织”、“为提高深度市场洞察而提前建立预警系统”、“预测市场变化或感知客户需求”，符合定义，当选；\nD项：某房地产开发商使用暂缓开发或拖延施工进度等方式，是为了化解可能面临的发展危机，而不是对市场变化的预测和对客户需求的感知，不符合“预测市场变化或感知客户需求”，不符合定义，排除。\n故正确答案为C。","no":65,"missingImage":false},{"type":"question","qid":"16593162","cat":"类比推理","stem":"前因后果：因果","options":{"A":"内忧外患：忧患","B":"南征北战：征战","C":"左顾右盼：顾盼","D":"有始无终：始终"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n前因后果指的是事物的因果报应，后泛指整个事件；因果指的是原因与结果的关系，二者没有语义关系，考虑拆分。“前”和“后”是反义关系，“因”和“果”组成第二个词，分别代表原因和结果两个不同的方面，且先“因”后“果”。\n第二步：判断选项词语间逻辑关系。\nA项：“内”和“外”是反义关系，但是“忧”和“患”指的都是忧虑的事情，二者为近义关系，与题干逻辑关系不一致，排除；\nB项：“南”和“北”是反义关系，但是“征”和“战”指的都是出发去作战，二者为近义关系，与题干逻辑关系不一致，排除；\nC项：“左”和“右”是反义关系，但是“顾”和“盼”指的都是看，二者为近义关系，与题干逻辑关系不一致，排除；\nD项：“有”和“无”是反义关系，“始”和“终”组成第二个词，分别代表开始和结束两个不同的方面，且先“始”后“终”，与题干逻辑关系一致，当选。\n故正确答案为D。","no":66,"missingImage":false},{"type":"question","qid":"16593151","cat":"类比推理","stem":"风吹：草低：见牛羊","options":{"A":"浪打：船摇：靠舵手","B":"光照：叶肥：促生长","C":"游人：如织：显道窄","D":"雨淋：花落：闻余香"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n风吹导致草低，草低导致见牛羊，第一词和第二词、第二词和第三词之间分别构成因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：浪打导致船摇，二者构成因果对应关系，但船摇需要靠舵手，二者不构成因果对应关系，与题干逻辑关系不一致，排除；\nB项：光照导致叶肥，叶肥是促生长的结果，与题干逻辑关系不一致，排除；\nC项：游人如织形容游人多得像织布的线一样，密密麻麻，如织是用来形容游人的，二者不构成因果对应关系，与题干逻辑关系不一致，排除；\nD项：雨淋导致花落，花落导致闻余香，第一词和第二词、第二词和第三词之间分别构成因果对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":67,"missingImage":false},{"type":"question","qid":"10204468","cat":"类比推理","stem":"（    ） 对于 主演 相当于 顾客 对于 （    ）","options":{"A":"配角；消费者","B":"主角；主顾","C":"男主角；客户","D":"导演；店主"},"answer":"B","explanation":"逐一代入选项。\nA项：配角指戏剧、影视等艺术表演中的次要角色或次要演员，主演指扮演戏剧或影视剧中主角的人，二者为并列关系；顾客与消费者为交叉关系，前后逻辑关系不一致，排除；\nB项：主角指戏剧、影视等艺术表演中的主要角色或主要演员，主演指扮演戏剧或影视剧中主角的人，二者为全同关系；主顾即顾客，二者为全同关系，前后逻辑关系一致，当选；\nC项：主演指扮演戏剧或影视剧中主角的人，男主角是主演，二者为种属关系；客户与顾客为全同关系，前后逻辑关系不一致，排除；\nD项：主演指扮演戏剧或影视剧中主角的人，导演是负责组织和指导演出工作的人，主演配合导演，二者为工作的对应关系；店主和顾客是买卖关系中的双方，二者为交易的对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":68,"missingImage":false},{"type":"question","qid":"16593176","cat":"类比推理","stem":"专业课 对于 （    ） 相当于 （    ） 对于 交响曲","options":{"A":"网络课：独奏曲","B":"公共课：进行曲","C":"考试课：古筝曲","D":"选修课：前奏曲"},"answer":"B","explanation":"逐一代入选项。\n\nA项：专业课指学校根据培养目标所开设的专业知识和专门技能的课程。专业课与网络课为交叉关系。西方乐曲可分为交响曲、独奏曲、进行曲、前奏曲等不同形式，独奏曲和交响曲为并列关系，前后逻辑关系不一致，排除；\nB项：公共课是指高等教育自学考试中任何专业或部分同类专业的考生都必须学习的课程，专业课与公共课为并列关系。进行曲和交响曲为并列关系，前后逻辑关系一致，当选；\nC项：专业课与考试课为交叉关系。古筝曲是中国古典乐曲，和交响曲是并列关系，前后逻辑关系不一致，排除；\nD项：专业课与选修课为交叉关系。前奏曲和交响曲为并列关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":69,"missingImage":false},{"type":"question","qid":"16593133","cat":"类比推理","stem":"文字：汉字","options":{"A":"判断：概念","B":"宇宙：恒星","C":"中国：北京","D":"工人：矿工"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n汉字是记录汉语的文字，二者是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：概念不是判断的一种，二者不是种属关系，与题干逻辑关系不一致，排除；\nB项：宇宙是包括一切天体的无限空间，恒星是本身能发出光和热的天体，恒星是宇宙的组成部分，二者是组成关系，与题干逻辑关系不一致，排除；\nC项：北京是中国的组成部分，二者是组成关系，与题干逻辑关系不一致，排除；\nD项：矿工是开采矿物的工人，二者是种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":70,"missingImage":false},{"type":"question","qid":"10204459","cat":"类比推理","stem":"山西：陈醋：粮食","options":{"A":"甘肃：秦艽：植物","B":"河南：汝瓷：瓷土","C":"四川：蜀绣：丝绸","D":"陕西：剪纸：纸张"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n陈醋是山西的特产，二者为特产和产地的对应关系，粮食是制作陈醋的原材料，二者为原材料的对应关系，且粮食经过发酵做成陈醋，发酵是化学变化。\n第二步：判断选项词语间逻辑关系。\nA项：秦艽是一种植物，也是中药，分布在蒙古，俄罗斯西伯利亚和远东地区，中国大陆的内蒙古、宁夏、河北、陕西、新疆、东北、山西等地，秦艽和甘肃不是特产和产地的对应关系，与题干逻辑关系不一致，排除；\nB项：汝瓷是河南特产，二者为特产和产地的对应关系，瓷土是汝瓷的原材料，且瓷土需经过塑形后烧制做成汝瓷，烧制是化学变化，与题干逻辑关系一致，当选；\nC项：蜀绣是巴蜀地区流行的一种民间工艺，对应的产地是四川，二者为特产和产地的对应关系，蜀绣的原材料是丝绸，但是在丝绸上用蚕丝线绣花纹做蜀绣的过程发生的是物理变化，与题干逻辑关系不一致，排除；\nD项：剪纸是一种用剪刀或刻刀在纸上剪刻花纹，用于装点生活或配合其他民俗活动的民间艺术，剪纸不是陕西特产，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":71,"missingImage":false},{"type":"question","qid":"16593145","cat":"类比推理","stem":"飞机：机库：机场","options":{"A":"课桌：桌椅：桌面","B":"药品：药盒：药箱","C":"乘客：客车：车站","D":"汽车：车轮：车轴"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n飞机停在机库里，二者是存放地点对应关系；飞机停在机场里，二者是存放地点对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：桌面是课桌的一部分，二者不是存放地点对应关系，与题干逻辑关系不一致，排除；\nB项：药品放在药盒里，二者是存放地点对应关系；药品放在药箱里，二者是存放地点对应关系，与题干逻辑关系一致，当选；\nC项：客车运输乘客，二者不是存放地点对应关系，与题干逻辑关系不一致，排除；\nD项：车轮是汽车的组成部分，二者不是存放地点对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":72,"missingImage":false},{"type":"question","qid":"16593147","cat":"类比推理","stem":"制造：中国制造：智能化中国制造","options":{"A":"小说：长篇小说：中长篇科幻小说","B":"批评：自我批评：剖析式自我批评","C":"学习：深度学习：机器人深度学习","D":"锻炼：体育锻炼：有意识体育锻炼"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n中国制造是制造的一种，前两词构成种属关系；智能化中国制造是中国制造的一种，后两词构成种属关系，且“智能化”是对中国制造具体属性的描述。\n第二步：判断选项词语间逻辑关系。\nA项：长篇小说是小说的一种，前两词构成种属关系；中长篇科幻小说是中长篇小说的一种，不是长篇小说，后两词不构成种属关系，与题干逻辑关系不一致，排除；\nB项：自我批评是批评的一种，前两词构成种属关系；剖析式自我批评是自我批评的一种，后两词构成种属关系，且“剖析式”是对自我批评具体属性的描述，与题干逻辑关系一致，保留；\nC项：深度学习是学习的一种，前两词构成种属关系；机器人深度学习是指机器人利用深度学习技术进行学习，与“深度学习”不构成种属关系，与题干逻辑关系不一致，排除；\nD项：体育锻炼是锻炼的一种，前两词构成种属关系；有意识体育锻炼是体育锻炼的一种，后两词构成种属关系，且“有意识”是对体育锻炼具体属性的描述，与题干逻辑关系一致，保留。\n对比B、D两项，题干中“中国制造”与B项中“自我批评”都是主谓结构，D项中“体育锻炼”不是主谓结构，且题干中“智能化”与B项中“剖析式”结构一致，而D项中“有意识”与题干结构不同，故B项与题干逻辑关系更为一致。\n故正确答案为B。","no":73,"missingImage":false},{"type":"question","qid":"16593169","cat":"类比推理","stem":"信息科技：生物科技：科技","options":{"A":"机械工业：智能工业：工业","B":"纺织产业：物流产业：产业","C":"公共交通：城市交通：交通","D":"商品住房：保障住房：住房"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n信息科技会利用生物科技，生物科技会利用信息科技，二者为相互利用、相互融合的关系，信息科技和生物科技都是科技的一种，前两词分别与第三词构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：机械工业会利用智能工业，智能工业会利用机械工业，二者为相互利用、相互融合的关系，机械工业和智能工业都是工业的一种，前两词分别与第三词构成种属关系，与题干逻辑关系一致，当选；\nB项：纺织产业会利用物流产业，但物流产业不会利用纺织产业，二者不是相互利用、相互融合的关系，与题干逻辑关系不一致，排除；\nC项：有的公共交通是城市交通，有的公共交通不是城市交通，有的城市交通是公共交通，有的城市交通不是公共交通，二者为交叉关系，不是相互利用、相互融合的关系，与题干逻辑关系不一致，排除；\nD项：商品住房和保障住房（保障性住房），二者不是相互利用、相互融合的关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":74,"missingImage":false},{"type":"question","qid":"10204461","cat":"类比推理","stem":"政治家：文学家：思想家","options":{"A":"污染物：氧化物：硫化物","B":"科幻片：纪录片：故事片","C":"马铃薯：西红柿：农作物","D":"运动员：跆拳道：大学生"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n政治家、文学家和思想家是人的三种不同身份，三者互为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：氧化物与硫化物为并列关系，二者分别与污染物构成交叉关系，与题干逻辑关系不一致，排除；\nB项：科幻片、纪录片和故事片是对影视作品从三个不同的角度划分的，三者互为交叉关系，与题干逻辑关系一致，当选；\nC项：马铃薯和西红柿是两种不同的农作物，前两词是并列关系，且分别与第三词构成种属关系，与题干逻辑关系不一致，排除；\nD项：有的大学生是运动员，有的大学生不是运动员，有的运动员是大学生，有的运动员不是大学生，二者构成交叉关系，但是跆拳道是一种运动，与其余两词不构成交叉关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":75,"missingImage":false},{"type":"question","qid":"16593175","cat":"逻辑判断","stem":"帕金森病作为一种严重的神经变性疾病，其背后发生的潜在原因尚不清楚，尽管遗传突变已经成为诱发帕金森病的一种已知原因，但90%的病例仍然是零星发生的，且没有明确的遗传起源，最新研究发现，环境因素如肠道微生物代谢产物会破坏人类产生多巴胺的神经元，导致类似帕金森病的症状出现，这一发现表明潜在的环境因素是帕金森病的诱因之一。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"人类微生物组可能影响神经退行性疾病","B":"帕金森病患者的肠道微生物组环境与健康人不同","C":"帕金森病诱因的发现为开发新型疗法提供了方向","D":"杀虫剂和工业化学物质等与机体神经退化之间存在明显关联"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：潜在的环境因素是帕金森病的诱因之一。\n论据：环境因素如肠道微生物代谢产物会破坏人类产生多巴胺的神经元，导致类似帕金森病的症状出现。\n本题论据在讨论环境因素中的肠道因素会导致类似帕金森病的症状出现，论点在讨论潜在的环境因素是帕金森病的诱因之一，论点论据均在讨论环境因素导致帕金森病，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的人类微生物组可能影响神经退行性疾病，帕金森病是最常见的神经退行性疾病之一，说明人类微生物组可能会对帕金森病有影响，具有可能的加强作用，保留；\nB项：该项说的是帕金森病患者的肠道微生物组环境与健康人不同，说明由于两类人的肠道微生物不同，所以有可能是肠道微生物引发的帕金森，有一定的加强力度，保留；\nC项：该项说的是帕金森病诱因发现的现实意义，与题干讨论的潜在的环境因素是否是帕金森病诱因的话题无关，为无关项，无法加强，排除；\nD项：该项说的是杀虫剂和工业化学物质等与机体神经退化之间存在明显关联，而杀虫剂和工业化学物质确实是生活环境中存在的，举例说明环境因素是帕金森病的诱因，补充论据，可以加强，保留。\n对比A、B、D三项，A项和B项均为可能性的加强，而D项是明确的举例加强，D项的加强力度大于A、B两项。\n故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"10204472","cat":"逻辑判断","stem":"科学家一直在对珠峰顶部积雪的厚度进行测量研究，过去由于没有探地雷达，测量研究结果具有不确定性，一般认为珠峰顶部积雪深度在0.92到3.5米之间。最近，中国研究人员在珠峰北坡，利用探地雷达沿着海拔7000米以上的山脊设置了26个测量点，通过采集大量数据得出结论，珠峰顶部积雪比以前认为的要深得多，平均达9.5米。\n以下哪项如果为真，最能支持上述结论?","options":{"A":"探地雷达的测量结果证明了珠峰山脊的地形相对平坦","B":"集中于珠峰山脊的26个测量点显示，各点积雪深度均为9.5米","C":"探地雷达对珠峰北坡海拔7000米以上山脊反复测量的结果可靠","D":"雪和岩石表面差异很大，探地雷达可准确确定这两种物质的边界"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：中国研究人员在珠峰北坡利用探地雷达沿着海拔7000米以上的山脊设置了26个测量点，通过采集大量数据得出结论，珠峰顶部积雪比以前认为的要深得多，平均达9.5米。\n论据：无。\n本题只有论点，没有论据，加强优先考虑必要条件或补充论据，即可利用探地雷达得出珠峰顶部积雪平均厚度，或补充能够证明论点成立的依据。\n第二步：逐一分析选项。\nA项：该项是说探地雷达的测量结果证明了珠峰山脊的地形相对平坦，但论点讨论的是利用探地雷达是否可以得出珠峰顶部积雪的平均厚度，话题不一致，无关选项，无法加强，排除；\nB项：该项是说珠峰山脊的26个测量点显示，各点积雪的深度均为9.5米，补充了实验数据，证明珠峰顶部积雪的平均深度可能达到9.5米，补充论据，可以加强，保留；\nC项：该项是说探地雷达对珠峰海拔7000米以上山脊反复测量的结果可靠，说明可以利用探地雷达测量积雪深度，补充论据，可以加强，保留；\nD项：该项是说雪和岩石表面差异很大，探地雷达可准确确定这两种物质的边界，如果探地雷达不能准确确定这两种物质的边界，那么利用探地雷达就无法准确测量积雪的深度，故该项是论点成立的必要条件，可以加强，保留；\n对比B、C、D三项，B项只是补充了测量点位的数据，且论点是说珠峰的顶部积雪深度平均达到9.5米，而题干中只是通过26个观测点得出的珠峰顶部积雪深度，是局部推出了整体，故26个观测点的积雪深度均为9.5米不是论点成立的必要条件，C项只是说明雷达测量的结果可靠，而D项具体说明了探地雷达确实可以测量积雪的原理，综上，必要条件大于补充论据，且D项比C项表述更明确，故D项力度更强。\n故正确答案为D。","no":77,"missingImage":false},{"type":"question","qid":"16593166","cat":"逻辑判断","stem":"世界上一些棉花种植区域的虫害导致全球棉花价格大幅上涨，相比之下，大豆的价格长期保持稳定，由于棉花成熟快，甲国许多大豆种植者计划停止大豆种植而改种棉花。所以，至少在未来几年内，棉花价格的高涨将大幅提高棉花种植者的收入。\n以下哪项如果为真，最能削弱上述论证？","options":{"A":"过去几年大豆种植成本显著增加，预计将继续攀升","B":"很少有消费者愿意为棉织品支付比现在更高的价格","C":"甲国新研发的杀虫剂价格低廉，还能有效杀死棉花害虫","D":"未来几年，甲国的棉花和棉花制品需求量不会急剧增加"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：至少在未来几年内，棉花价格的高涨将大幅提高棉花种植者的收入。\n论据：世界上一些棉花种植区域的虫害导致全球棉花价格大幅上涨，相比之下，大豆的价格长期保持稳定，由于棉花成熟快，甲国许多大豆种植者计划停止大豆种植而改种棉花。\n本题论点讨论的是棉花价格的高涨将大幅提高棉花种植者的收入，论据讨论的是因全球棉花价格大幅上涨及棉花成熟快，甲国许多大豆种植者认为种棉花的收入会更高，从而计划停止大豆种植而改种棉花，论点论据都在讨论种棉花会提高种植者的收入，二者话题一致，削弱可以考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出大豆种植成本预计将继续攀升，而论点讨论的是种棉花是否会提高种植者的收入，话题不一致，无法削弱，排除；\nB项：该项指出很少有消费者愿意为棉织品支付比现在更高的价格，说明消费者不愿意买单，所以种棉花挣不了钱，可以削弱，保留；\nC项：该项指出甲国新研发的杀虫剂价格低廉，还能有效杀死棉花害虫，结合题干开头提及的棉花因虫害而涨价，说明由于甲国有便宜杀虫剂，所以就没有虫害，产量也不会下降，棉花就不会涨价进而不会提高种植者收入，可以削弱，保留；\nD项：该项指出未来几年，甲国的棉花和棉花制品需求量不会急剧增加，而收入是由棉花价格和销量共同决定的，甲国消费者需求量不会急剧增加，故甲国棉花及棉花制品销量和价格可能不会有明显增加，从而将不会大幅提高棉花种植者的收入，削弱论点，可以削弱，保留。\n对比B、C、D三项，D项中通过“未来几年”、“需求量”与论点中的“未来几年”、“收入”相呼应，与题干关系更紧密，而B、C两项均未提及具体时间，反驳“收入增加”的内容不如D项更直接。\n本题的主要争议点在CD项：\n1.有同学质疑D项觉得虽然需求量不会急剧增加，但是“棉花价格会大幅上涨”，那就大幅提高棉花种植者的收入了呀。注意，在种棉花的人多了，需求不会急剧增加的情况下，棉花价格就不可能大幅上涨，所以“价格会大幅上涨”这个假设就不成立。\n已知种棉花的人多了，且“收入=价格*销量”，D项说“需求量不会急剧增加”，可以推出“棉花价格不会大幅上涨”且“销量不会急剧增加”，那么最终“种植者收入也就不会大幅提高”，D项可以削弱论点；\nC项因为有杀虫剂，所以棉花的价格不会大幅上涨，但是没有提到需求量，也就是没有考虑到“销量”问题，此处没有D项全面。\n2.题干认为棉花价格上涨是因为“虫害”，C项强调甲国新研发的杀虫剂价格低廉，能有效杀死棉花害虫，即可以解决虫害问题，题干的问题被解决了，那么棉花价格也就不会上涨，最终“种植者收入就不会大幅提高”，从与题干内容的相关性上，C项的“杀虫剂”更贴合论证内容，这点C项比D项好。\n综上，本题是争议题，CD项各有道理，在这道题中主要学习的思路有：\n一是“因为收入=价格*销量，所以讨论收入是否会提高时，价格和销量两方面都能考虑到的选项更优”；\n二是“哪个选项跟文段讨论的话题更相关更接近，哪个选项的力度更强”。\n一般这两种选项不会同时出现，因为这道题一起出现了，所以就有了争议，争议题不纠结，不作为备考重点，学习基本思路即可。\n故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"16593159","cat":"逻辑判断","stem":"有研究报告指出，当前地球上有近一半的开花植物受到灭绝的威胁，数量超过10万种。而鉴于90%的药物来自植物，因此人类可能会失去大多数药物来源。\n以下哪项如果为真最能质疑上述观点？","options":{"A":"动物以及真菌类也是重要的药物来源","B":"植物受威胁甚至濒临灭绝的情况明显超过动物","C":"地球上的植物大概有40万种，当前开发为药用植物的有1万多种","D":"植物的药用价值也正是其濒临灭绝的主要原因，亟需寻找可替代药物"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：人类可能会失去大多数药物来源。\n论据：人类90%的药物来自植物，而当前地球上有近一半的开花植物受到灭绝的威胁，数量超过10万种。\n本题论点讨论的是人类可能会失去大多数药物来源，论据讨论的是人类90%的药物来自植物，而近一半的开花植物受到灭绝的威胁，故论点论据话题不一致，削弱优先考虑拆桥，即在“近一半的开花植物灭绝”和“人类失去大多数药物来源”之间断开联系即可。\n第二步：逐一分析选项。\nA项：动物以及真菌类也是重要的药物来源，只是重要的药物来源，但不清楚动物以及真菌类在药物来源中的占比，无法削弱论点中的“大多数药物来源”，为不明确项，无法削弱，排除；\nB项：植物受威胁甚至濒临灭绝的情况明显超过动物，比较植物和动物濒临灭绝的情况，与论点人类可能会失去大多数药物来源无关，为无关项，无法削弱，排除；\nC项：地球上的植物大概有40万种，当前开发为药用植物的有1万多种，即地球上的植物足够多，尽管近一半的开花植物受到灭绝的威胁，人类只开发药用植物一万多种，还剩很多植物可以开发为药用植物，即在“近一半的开花植物灭绝”和“人类失去大多数药物来源”之间断开联系，为拆桥项，可以削弱，当选；\nD项：植物的药用价值也正是其濒临灭绝的主要原因，是在谈论植物濒临灭绝的原因，与论点人类可能会失去大多数药物来源无关，为无关项，无法削弱，排除。\n故正确答案为C。","no":79,"missingImage":false},{"type":"question","qid":"16593174","cat":"逻辑判断","stem":"视觉（光）是哺乳动物重要的感知，其促进幼年大脑发育的功能得到了广泛关注。在发育过程中视网膜自感光神经节细胞是最早具有感光功能的视网膜感光细胞，专家认为它可能是介导光促进幼年大脑发育最关键的感光细胞。\n以下哪项如果为真，最能支持专家的观点？","options":{"A":"蜻蜓拥有近乎三百六十度的视野，它们不用频繁地扭动头部，就可以发现目标猎物","B":"新生儿出生前视网膜已经发育，随着婴儿月龄增加，追物能力变强，视野扩大，多增加光环境可以促进新生儿大脑发育","C":"细胞光感受的缺失，会导致幼鼠在学习速度上的缺陷，但这种缺陷可以被幼年时人为激活该细胞或视上核的催产素神经元所弥补","D":"小蝙蝠的视杆细胞主要用于感受暗光，虽然它们具有视力，但回声定位能力却是其感知周围环境的主要手段，可以忽略视觉对它的重要性"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：它（视网膜自感光神经节细胞）可能是介导光促进幼年大脑发育最关键的感光细胞。\n论据：在发育过程中视网膜自感光神经节细胞是最早具有感光功能的视网膜感光细胞。\n本题论点和论据均在讨论视网膜自感光神经节细胞和感光的关系，论点论据话题一致，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：选项讨论的是蜻蜓可利用近三百六十度的视野来发现目标猎物，而论点讨论的是视网膜自感光神经节细胞对幼年大脑发育的影响，话题不一致，无法加强，排除；\nB项：选项讨论的是多增加光环境可以促进新生儿大脑发育，而论点讨论的是视网膜自感光神经节细胞对幼年大脑发育的影响，话题不一致，无法加强，排除；\nC项：选项指出幼鼠在学习速度上的缺陷可以被幼年时人为激活视网膜自感光神经节细胞所弥补，说明该细胞确实能介导光促进幼年大脑发育，补充论据，可以加强，当选；\nD项：该项指出小蝙蝠的视杆细胞主要用于感受暗光，而论点讨论的是视网膜自感光神经节细胞对幼年大脑发育的影响，话题不一致，无法加强，排除。\n故正确答案为C。","no":80,"missingImage":false},{"type":"question","qid":"16593138","cat":"逻辑判断","stem":"借助水文气象卫星20年采集的数据，科学家看到全球56%的海水变得越来越绿，这些海水都处在南纬40度和北纬40度之间的热带和亚热带水域，海水颜色由上层海水所含物质决定，深蓝色意味着海洋中没有太多生物，绿色则代表海里存在着以浮游植物为基础的生态系统，科学家据此认为，气候变暖让这片海域变得越来越绿。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"变绿海域都处在热带和亚热带，特别是赤道附近","B":"如果海洋持续变暖，海洋变绿现象会持续地加剧","C":"气候变暖会大大加速热带和亚热带海洋浮游植物生长","D":"模拟海洋生态系统证明气候变暖与海水变绿之间存在正相关关系"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：气候变暖让热带和亚热带海域变得越来越绿。\n论据：全球56%的海水变得越来越绿，这些海水都处在南纬40度和北纬40度之间的热带和亚热带水域，海水颜色由上层海水所含物质决定，深蓝色意味着海洋中没有太多生物，绿色则代表海里存在着以浮游植物为基础的生态系统。\n本题论点讨论的是气候变暖让热带和亚热带海域变得越来越绿，论据讨论的是绿色则代表海里存在着以浮游植物为基础的生态系统，论据和论点话题不一致，加强优先考虑搭桥，即在“浮游植物”和“气候变暖”之间建立联系。\n第二步：逐一分析选项。\nA项：该项说的是变绿海域处在何地，论点说的是海域变得越来越绿的原因，话题不一致，无法加强，排除；\nB项：该项说的是如果海洋持续变暖，海洋变绿现象会持续地加剧，说明气候变暖会导致海洋持续变暖，进而导致海洋变绿，补充论据，可以加强，保留；\nC项：该项说的是气候变暖会大大加速热带和亚热带海洋浮游植物生长，在“浮游植物”和“气候变暖”之间建立联系，为搭桥项，可以加强，保留；\nD项：该项说的是模拟海洋系统证明气候变暖与海洋变绿之间存在正相关关系，补充论据，可以加强，保留。\n对比B、C、D三项，C项为搭桥项，B项和D项均为补充论据，C项的加强力度大于B、D两项。\n故正确答案为C。","no":81,"missingImage":false},{"type":"question","qid":"10204511","cat":"逻辑判断","stem":"地球生命已历经五次由极端自然现象引起的生物多样性大规模灭绝事件。现今，许多专家警告说。xxx人类可以饲养一些动物xxx，但这些举措并不能针对所有物种，由此可见其无法扭转物种灭绝的总体趋势。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"植物灭绝速度远低于陆生动物，不会灭绝","B":"地球生物多样性的存在完全是为了人类利益需要","C":"人类可以饲养海量的各类动物，特别是哺乳动物","D":"人类需重点关注和保护最具生物多样性的热带雨林"},"answer":"C","explanation":"略。","redacted":true,"no":82,"missingImage":false},{"type":"question","qid":"16593157","cat":"逻辑判断","stem":"某高校针对去年起图书馆的图书借阅情况做了调查，数据显示，文学类书籍的借阅量大大超过了科技类书籍。因此，文学类书籍的受欢迎程度要高于科技类书籍。\n以下哪项如果为真，最能削弱上述论证？","options":{"A":"科技类书籍学习难度较大","B":"文学类书籍占该校图书馆馆藏一半以上","C":"该校就读文科专业的学生接近三分之二","D":"除了文学类书籍，法律、哲学类书籍也很受欢迎"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：文学类书籍的受欢迎程度要高于科技类书籍。\n论据：某高校针对去年起图书馆的图书借阅情况做了调查，数据显示，文学类书籍的借阅量大大超过了科技类书籍。\n本题论点探讨的是文学类书籍受欢迎程度更高，论据探讨的文学类书籍的借阅量更大，论点论据话题不一致，削弱优先考虑拆桥，即说明借阅量大不等于受欢迎程度高。\n第二步：逐一分析选项。\nA项：科技类书籍的学习难度较大会导致其受欢迎程度较低，解释了论点成立的原因，为加强项，无法削弱，排除；\nB项：文学类书籍占该校图书馆馆藏一半以上，即图书馆中文学类书籍的总量超过了科技类书籍，两类书籍的总量不一致，在两类书籍总量不一致的情况下，借阅量无法准确反映受欢迎程度，为拆桥项，可以削弱，当选；\nC项：该校有接近三分之二的学生就读“文科”专业（教学上哲学、历史、政治、法律等学科均属于“文科”专业），论点论据探讨的是“文学类”书籍，而非“文科”书籍，因此无法确定就读“文科”专业对借阅“文学类”书籍的影响，选项与题干话题不一致，无法削弱，排除；\nD项：指出该校法律、哲学类书籍的情况，与论点探讨的话题无关，为无关项，无法削弱，排除。\n故正确答案为B。","no":83,"missingImage":false},{"type":"question","qid":"16593134","cat":"类比推理","stem":"小赵、小李、小周、小孙、小钱五人一起参与“谁是卧底”的游戏。已知五人中有两人是卧底，且存在以下情况：\n①小赵、小李两人中至少有一人是卧底\n②如果小李是卧底，小周一定是卧底\n③只有在小孙是卧底时，小钱才是卧底\n④如果小钱不是卧底，那么小赵也不是卧底\n⑤小孙不是卧底\n则卧底是：","options":{"A":"小赵和小钱","B":"小钱和小李","C":"小李和小周","D":"小赵和小周"},"answer":"C","explanation":"第一步：分析题干条件。\n①小赵 或 小李是卧底；\n②小李是卧底\u003cimg data-k=\"a37757d411ef\">小周是卧底；\n③小钱是卧底\u003cimg data-k=\"a37757d411ef\">小孙是卧底；\n④小赵是卧底\u003cimg data-k=\"a37757d411ef\">小钱是卧底；\n⑤小孙不是卧底；\n⑥五人中有两人是卧底。\n第二步：根据题干条件进行推理。\n条件⑤为确定信息，从确定信息开始推理。结合条件③，根据“否后必否前”可以得出小钱不是卧底。结合条件④，根据“否后必否前”可知，小赵不是卧底。结合条件①，根据“或关系否一推一”可以得出小李是卧底，再结合条件②，根据“肯前必肯后”可以得出小周是卧底，对应C项。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"16593130","cat":"类比推理","stem":"某单位邀请7位评标专家甲、乙、丙、丁、戊、己、庚参加评标工作，7位评标专家随机被分成两组，其中第一组3人，第二组4人，但分组须符合以下要求：\n①甲和丙不能在同一个小组\n②如果乙在第一组，那么丁必须在第一组\n③如果戊在第一组，那么丙必须在第二组\n④己必须在第二组\n如果丙、戊在同一组，那么不可能在同一组的是：","options":{"A":"甲和乙","B":"甲和丁","C":"乙和庚","D":"丙和庚"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）甲和丙不能在同一个小组；\n（2）乙在第一组\u003cimg data-k=\"a37757d411ef\">丁在第一组；\n（3）戊在第一组\u003cimg data-k=\"a37757d411ef\">丙在第二组；\n（4）己在第二组；\n（5）丙、戊在同一组；\n（6）第一组3人，第二组4人。\n第二步：根据题干条件进行推理。\n根据条件（3），如果戊在第一组，那么丙应该在第二组，与条件（5）“丙、戊在同一组”矛盾，所以戊在第二组，则丙也在第二组。此时结合条件（1）可知，甲在第一组；结合条件（4）己在第二组和条件（6）可得表格如下。此时还余乙、丁、庚3人未分组。\n\u003cimg data-k=\"ef59dd3d0db5\" style=\"max-width:600px\">\n结合条件（2），假设乙在第一组，则丁也在第一组，此时甲、乙、丁在第一组，丙、戊、己、庚在第二组；假设乙在第二组，此时甲、丁、庚在第一组，乙、戊、丙、己在第二组。综上，乙和庚一定不可能在同一组。\n本题为选非题，故正确答案为C。","no":85,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2022年中国锂电池出货量658GWh，同比增长101.1%。2022年中国动力锂电池装车量达294.6GWh，同比增长90.7%，高于全球同比增速18.9个百分点，占全球动力锂电池装车量的56.9%。\u003c/p>\u003cp>\u003cimg data-k=\"d30944204815\" style=\"max-width:634px\">\u003c/p>\u003cp>\u003cimg data-k=\"4529a985cf8b\" style=\"max-width:634px\">\u003c/p>","questions":[{"qid":"10204493","cat":"增长","stem":"以下锂电池出货量指标中同比增速最快的是：","options":{"A":"2021年储能锂电池出货量","B":"2021年动力锂电池出货量","C":"2022年储能锂电池出货量","D":"2022年动力锂电池出货量"},"answer":"A","explanation":"根据题干“······同比增速最快的是”，可判定本题为一般增长率问题。定位图形材料可得，2020-2022年储能锂电池出货量分别为16.2GWh、47.7GWh、130GWh，2020-2022年动力锂电池出货量分别为80GWh、226GWh、480GWh。根据公式：增长率\u003cimg data-k=\"7a919ee92a2e\">，则各选项同比增长率分别为：\n2021年储能锂电池出货量：\u003cimg data-k=\"589aa8f6caaa\">；\n2021年动力锂电池出货量：\u003cimg data-k=\"dddb8f316ccc\">；\n2022年储能锂电池出货量：\u003cimg data-k=\"746857606de4\">；\n2022年动力锂电池出货量：\u003cimg data-k=\"528a81d9ac18\">；\n观察发现，2021年储能锂电池出货量同比增速最快。\n故正确答案为A。","no":86,"missingImage":false},{"qid":"16593073","cat":"综合","stem":"2021年，全球动力锂电池装车量约为多少GWh？","options":{"A":"271.5","B":"295.6","C":"301.4","D":"323.6"},"answer":"C","explanation":"根据题干“2021年······约为多少GWh”，结合材料时间为2022年，可判定本题为基期计算问题。定位文字材料可得：2022年中国动力锂电池装车量达294.6GWh，同比增长90.7%，高于全球同比增速18.9个百分点，占全球动力锂电池装车量的56.9%。根据公式：整体\u003cimg data-k=\"447680635370\">，则2022年全球动力锂电池装车量为\u003cimg data-k=\"7ca2f2e46193\">GWh。根据公式：基期量\u003cimg data-k=\"51e165712c75\">，结合2022年全球动力锂电池装车量同比增速为90.7%-18.9%=71.8%，则题干所求为\u003cimg data-k=\"2e55cbdc4cdb\">\u003cimg data-k=\"5ecdae7f4c2c\">GWh，与C项最接近。\n故正确答案为C。","no":87,"missingImage":false},{"qid":"16593071","cat":"综合","stem":"2019-2022年，中国锂电池年出货量超过全球锂电池年出货量一半的年份有几个？","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","explanation":"定位统计表和统计图可知：2019-2022年全球锂电池出货量和中国各类型锂电池出货量。故各年份中国锂电池出货量分别为：2019年，9.5+36.5+71.0=117.0GWh；2020年，16.2+46.2+80.0=142.4GWh；2021年47.7+53.5+226.0=327.2GWh。定位文字材料第一段可知：2022年中国锂电池出货量658GWh。若想找出中国锂电池年出货量\u003cimg data-k=\"b537b8b40b19\">的年份，则需找出中国锂电池年出货量×2&gt;全球锂电池年出货量的年份。比较可知：2019年，117.0×2=234GWh&gt;218GWh；2020年，142.4×2=284.8GWh&lt;294.5GWh；2021年，327.2×2=654.4GWh&gt;562.4GWh；2022年，658×2=1316GWh&gt;957.7GWh。满足题意的有：2019年、2021年、2022年，共3个年份。\n故正确答案为C。","no":88,"missingImage":false},{"qid":"16593070","cat":"综合","stem":"2019-2022年，中国数码锂电池年均出货量在以下哪个范围内？","options":{"A":"不到45GWh","B":"45-47GWh之间","C":"47-49GWh之间","D":"49GWh以上"},"answer":"B","explanation":"根据题干“2019-2022年······年均······在以下哪个范围内”，结合材料时间为2019-2022年，可判定本题为现期平均数问题。定位统计图可得：2019-2022年中国数码锂电池出货量分别为：36.5GWh、46.2GWh、53.5GWh、48.0GWh。则2019-2022年中国数码锂电池年均出货量为\u003cimg data-k=\"30f535d53b8c\">\u003cimg data-k=\"0216724b67cf\">GWh，在B项范围内。\n故正确答案为B。","no":89,"missingImage":false},{"qid":"16593077","cat":"增长","stem":"在以下信息中，能够从上述资料中推出的有几项？\n①2019-2022年，中国储能锂电池出货量年均增速为3类锂电池中最快\n②2019-2022年，中国锂电池出货量逐年增加\n③2019-2022年，中国数码锂电池年出货量同比增速逐年下降\n④2022年，中国新能源汽车产量同比增速慢于2021年水平","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","explanation":"①定位统计图可得，2019年中国储能锂电池、数码锂电池、动力锂电池出货量分别为9.5GWh、36.5GWh、71.0GWh；2022年三者出货量分别为130.0GWh、48.0GWh、480.0GWh。根据年均增长率公式：\u003cimg data-k=\"d4fcb72ca495\">，当年份差n相同时，直接比较\u003cimg data-k=\"dd60a582331d\">即可。储能锂电池：\u003cimg data-k=\"025e032670cb\">；数码锂电池：\u003cimg data-k=\"4f9b8cf4be49\">；动力锂电池：\u003cimg data-k=\"c03898169138\">，比较可得储能锂电池出货量年均增速最快，正确；\n②定位文字材料可得，2022年中国锂电池出货量658GWh；定位统计图可得2019-2021年中国锂电池出货量。2019-2022年中国锂电池出货量分别为：9.5+36.5+71.0=117GWh、16.2+46.2+80.0=142.4GWh、47.7+53.5+226.0=327.2GWh、658GWh。比较可得2019-2022年，中国锂电池出货量逐年增加，正确；\n③定位统计图可得2019-2022年中国数码锂电池年出货量，但材料未给出2018年相关数据，无法计算2019年同比增速，故无法判断2020年的增速是否较2019年下降，错误；\n④定位统计表可得，2020-2022年中国新能源汽车产量分别为146万辆、368万辆、722万辆。比较增速大小时，当\u003cimg data-k=\"a2ebfa7b6998\">，可直接比较\u003cimg data-k=\"dd60a582331d\">，则2021年：\u003cimg data-k=\"addfcb
