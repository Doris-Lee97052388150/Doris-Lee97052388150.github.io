cimg data-k=\"8ef3dde96c69\">\u003cimg data-k=\"4c32016d5c39\">平方米。该实验田玉米总产量为110+115+125+130=480千克，则该实验田玉米的平均产量为\u003cimg data-k=\"ed422452b17c\">千克/平方米。\n故正确答案为B。","no":67,"missingImage":false},{"type":"question","qid":"12881895","cat":"数学运算","stem":"某风景区内有5个收费景点，门票分别为10元、10元、20元、20元、20元。老李花了40元购买门票，依次游览了不同景点。那么可能的游览方式有多少种？","options":{"A":"6","B":"18","C":"24","D":"60"},"answer":"C","explanation":"老李花了40元购买门票，依次游览了不同景点，分情况讨论：\n分类一，游览2个门票为20元的景点：从3个门票为20元的景点中选出2个，考虑顺序，有\u003cimg data-k=\"9b63336cd81f\">种情况；\n分类二，游览2个门票为10元的景点和1个门票为20元的景点：先从3个门票为20元的景点中选择1个，有3种情况；再将2个10元门票的景点全部选出，有1种情况；最后将选出的3个景点进行排序，有\u003cimg data-k=\"3265e7550fa3\">种情况。分步用乘法，共有3×6=18种情况。\n分类用加法，所求总情况数=6+18=24种。\n故正确答案为C。","no":68,"missingImage":false}],"count":15,"answerable":15,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"13504460","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"a7a68dd93183\" style=\"max-width:500px\">","options":{"A":"①④⑤，②③⑥","B":"①②⑥，③④⑤","C":"①④⑥，②③⑤","D":"①②⑤，③④⑥"},"answer":"A","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。题干图形均由多个小元素组成，考虑元素的种类或个数。观察发现，图①④⑤中元素种类均为2，图②③⑥中元素种类均为1，即图①④⑤为一组，图②③⑥为一组。\n故正确答案为A。","no":69,"missingImage":false},{"type":"question","qid":"13504515","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"a31d60178814\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相同，考虑位置规律。观察第一组图形位置可知，从图一到图三，田字格中每一区域都是由前一幅图同位置顺时针旋转\u003cimg data-k=\"dd44efe89e5a\">得到，第二组应遵循相同的旋转规律，田字格中每一区域都是由前一幅图同位置顺时针旋转\u003cimg data-k=\"dd44efe89e5a\">得到，只有C项符合。\n故正确答案为C。","no":70,"missingImage":false},{"type":"question","qid":"12881897","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"d7c0906f5d9e\" style=\"max-width:500px\">","options":{"A":"①③④，②⑤⑥","B":"①②⑥，③④⑤","C":"①③⑤，②④⑥","D":"①④⑥，②③⑤"},"answer":"B","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。题干图形出现“日”字变形图及出头端点，优先考虑笔画数。观察发现，图①②⑥均为2笔画图形，图③④⑤均为3笔画图形。即图①②⑥为一组，图③④⑤为一组。\n故正确答案为B。","no":71,"missingImage":false},{"type":"question","qid":"12881896","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"d63467c92920\" style=\"max-width:400px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，优先考虑属性规律。观察发现，题干出现全直线、全曲线图形，考虑曲直性。九宫格优先看横行，第一行图形分别为全曲线图形、全直线图形、有曲有直图形；经验证，第二行符合此规律；第三行应用此规律，故“？”处图形应是有曲有直图形，只有D项符合。\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"13504506","cat":"图形推理","stem":"下图左侧给定的是3×3×3的正方体被分解后的多面体，切去的部分可以由给定的①、②和③三个多面体组合而成。以下哪项能填入问号处？\n\u003cimg data-k=\"7768193704e3\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查立体拼合。题干正方体中切去的部分可以由①、②以及B项三个多面体旋转后拼合而成，具体拼合过程如下图所示：\n\u003cimg data-k=\"cd896c96a437\" style=\"max-width:600px\">\n故正确答案为B。","no":73,"missingImage":false},{"type":"question","qid":"13504508","cat":"定义判断","stem":"近零碳建筑是指建筑物通过适应气候特征和场地条件，最大幅度地降低建筑对能源的需求，运行过程中全电化，不使用燃气，建筑排放的碳量处于较低水平。近零碳建筑不仅利用各种方法减少自身产生的碳排放，还收集并利用雨水、太阳能等可再生能源，最终达到零废水、零能耗、零废弃物的理想状态。\n下列做法不符合近零碳建筑理念的是：","options":{"A":"加大物联网、大数据、人工智能等技术在建筑上的应用","B":"淘汰预制模块化建筑技术，采用传热系数高的幕墙建材","C":"实现建筑内空调精细化运行，始终保持温湿度的独立控制","D":"利用集成地源热泵、空气源热泵、光伏发电等可再生能源"},"answer":"B","explanation":"第一步：找出定义关键词。\n“建筑物通过适应气候特征和场地条件”、“最大幅度地降低建筑对能源的需求”、“运行过程中全电化，不使用燃气”、“建筑排放的碳量处于较低水平”、“利用雨水、太阳能等可再生能源”、“零废水、零能耗、零废弃物”。\n第二步：逐一分析选项。\nA项：加大物联网、大数据和人工智能技术在建筑上的应用，各项技术能够实现智能化识别、定位、跟踪、监管等功能，有利于能源管理和优化，符合“建筑物通过适应气候特征和场地条件”、“最大幅度地降低建筑对能源的需求”，符合定义，排除；\nB项：建筑技术采用传热系数高的幕墙建材，会导致传热更快，保温隔热性能更差，反而增加建筑的能耗，不利于低碳，不符合“最大幅度地降低建筑对能源的需求”，不符合定义，当选；\nC项：实现建筑内空调精细化运行，可以减少能源的消耗，符合“最大幅度地降低建筑对能源的需求”、“建筑排放的碳量处于较低水平”，符合定义，排除；\nD项：利用集成地源热泵、空气源热泵、光伏发电等可再生能源，符合“建筑物通过适应气候特征和场地条件”、“利用雨水、太阳能等可再生能源”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":74,"missingImage":false},{"type":"question","qid":"13504507","cat":"定义判断","stem":"马氏体相变是一种晶体结构变化。由于外界物理作用，比如温度、外力或者磁场的变化，一些材料的晶体结构会失去稳定性，原子发生短距离的移动，导致结构畸变。这种非原子扩散型的结构变化被称为马氏体相变。马氏体相变的一个重要特性是形状记忆效应，即基于两种结构相互转变和变体滑移，材料外形发生明显变化并能恢复原态。\n根据上述定义，下列未体现马氏体相变的是：","options":{"A":"将形状扭曲的别针放到热水里，别针立刻就能恢复原状","B":"起扩张血管作用的心脏支架用在外周血管时，因为挤压而变形","C":"通过电流加热控制合金网状结构变化，制造了能模仿蠕虫前进的机器人","D":"采用镍钛弓丝的牙齿矫形器受口腔温度影响，可产生形状恢复力，为牙齿矫形提供所需的力量"},"answer":"B","explanation":"第一步：找出定义关键词。\n“由于外界物理作用，比如温度、外力或者磁场的变化”、“材料外形发生明显变化并能恢复原态”。\n第二步：逐一分析选项。\nA项：形状扭曲的别针放到热水里，立刻就能恢复原状，说明由于温度的作用，别针的外形发生变化并恢复原状，符合“由于外界物理作用，比如温度、外力或者磁场的变化”、“材料外形发生明显变化并能恢复原态”，符合定义，排除；\nB项：心脏支架因为挤压而变形，说明由于外力的作用，支架的外形发生变化，但未体现支架是否可以恢复原状，不符合“材料外形发生明显变化并能恢复原态”，不符合定义，当选；\nC项：通过加热控制合金网状结构变化，制造了能模仿蠕虫前进的机器人，蠕虫的前进需要重复进行肢体的伸缩，说明由于温度的作用，机器人的外形发生变化并恢复原状，符合“由于外界物理作用，比如温度、外力或者磁场的变化”、“材料外形发生明显变化并能恢复原态”，符合定义，排除；\nD项：镍钛弓丝的牙齿矫形器受口腔温度影响，可产生形状恢复力，说明由于温度的作用，牙齿矫形器的外形发生变化并恢复原状，符合“由于外界物理作用，比如温度、外力或者磁场的变化”、“材料外形发生明显变化并能恢复原态”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":75,"missingImage":false},{"type":"question","qid":"13504510","cat":"逻辑判断","stem":"假定有一个理想化的纯黑体，它能将所有吸收的能量以“光”的形式释放，则称之为绝对黑体，它从绝对零度（单位为“K”即开尔文，\u003cimg data-k=\"34bd75760464\">）开始被加热升温会由黑变为发红光、黄光、白光、蓝光。加热到N（K）时，绝对黑体发光所含的光谱成分就称N（K）色温；某发光物与N（K）温度下绝对黑体发光所含的光谱成分相同，就称其色温为N（K）。\n以下关于色温的叙述正确的是：","options":{"A":"把红、黄划分为暖色调，白、蓝划分为冷色调是由色温而来的","B":"一天内，肉眼看到的太阳颜色的变化是温差引起的色温变化导致的","C":"某发光体的光谱成分与绝对黑体在\u003cimg data-k=\"45fb306fb935\">时的相同，则它的色温是3000K","D":"某灯光的色温是1000K，则与之光谱成分相同的绝对黑体温度是\u003cimg data-k=\"cc7f0fe32a09\">"},"answer":"C","explanation":"第一步：找出定义关键词。\n绝对黑体：“能将所有吸收的能量以‘光’的形式释放”；\n色温：“从绝对零度（单位为‘K’即开尔文，\u003cimg data-k=\"34bd75760464\">）开始被加热升温会由黑变为发红光、黄光、白光、蓝光”、“加热到N（K）时，绝对黑体发光所含的光谱成分就称N（K）色温”、“发光物与N（K）温度下绝对黑体发光所含的光谱成分相同”。\n第二步：逐一分析选项。\nA项：根据“从绝对零度开始被加热升温会由黑变为发红光、黄光、白光、蓝光”可以推出光的颜色与温度有关，但是并不能由此推出色温是否是划分冷、暖色调的依据，说法错误，排除；\nB项：根据“从绝对零度开始被加热升温会由黑变为发红光、黄光、白光、蓝光”可知光的颜色与温度有关，但是选项并未提及一天内太阳具体的温差变化，实际上一天内太阳颜色的变化主要是由于大气散射引起的，并非色温变化导致，说法错误，排除；\nC项：根据“从绝对零度（单位为‘K’即开尔文，\u003cimg data-k=\"34bd75760464\">）开始被加热升温会由黑变为发红光、黄光、白光、蓝光”、“发光物与N（K）温度下绝对黑体发光所含的光谱成分相同”，因此可知N（K）就是绝对黑体从\u003cimg data-k=\"4be2e3585bfc\">加热到有光的色温，发光物和绝对黑体光谱相同时色温就是N（K），二者的换算关系为：\u003cimg data-k=\"0627e0b3d2bc\">，因此，某发光体相同的绝对温度在\u003cimg data-k=\"45fb306fb935\">时，对应的色温为\u003cimg data-k=\"ff552bd75590\">，说法正确，当选；\nD项：根据“从绝对零度（单位为‘K’即开尔文，\u003cimg data-k=\"34bd75760464\">）开始被加热升温会由黑变为发红光、黄光、白光、蓝光”、“发光物与N（K）温度下绝对黑体发光所含的光谱成分相同”，因此可知N（K）就是绝对黑体从\u003cimg data-k=\"4be2e3585bfc\">加热到有光的色温，发光物和绝对黑体光谱相同时色温就是N（K），二者的换算关系为：\u003cimg data-k=\"317f47cfa43d\">，某灯光的色温是1000K，则与之光谱成分相同的绝对黑体温度\u003cimg data-k=\"dedc6c1b235b\">，并非\u003cimg data-k=\"cc7f0fe32a09\">，说法错误，排除。\n故正确答案为C。","no":76,"missingImage":false},{"type":"question","qid":"13504484","cat":"逻辑判断","stem":"在某个定义域上有加减乘除等多种二元运算（用★代表其中一种），如果在定义域内存在一个数w，对于定义域范围内的每个数m（包括w），都有w★m=m，则称w为该种二元运算上的左幺元。\n以下关于左幺元的叙述正确的是：","options":{"A":"在整数范围内的乘法运算中，1是左幺元","B":"在整数范围内的加法运算中，1是左幺元","C":"在整数范围内的减法运算中，0是左幺元","D":"在整数范围内的除法运算中，0是左幺元"},"answer":"A","explanation":"第一步：找出定义关键词。\n“如果w，对于定义域范围内的每个数m（包括w），都有w★m=m”。\n第二步：逐一分析选项。\nA项：1乘以任何整数都等于原来的数，符合“如果w，对于定义域范围内的每个数m（包括w），都有w★m=m”，符合定义，当选；\nB项：1加任何整数都不等于原来的数，不符合“如果w，对于定义域范围内的每个数m（包括w），都有w★m=m”，不符合定义，排除；\nC项：0减去除0外的任何整数都不等于原来的数，不符合“如果w，对于定义域范围内的每个数m（包括w），都有w★m=m”，不符合定义，排除；\nD项：0除以除0外的任何整数都不等于原来的数，不符合“如果w，对于定义域范围内的每个数m（包括w），都有w★m=m”，不符合定义，排除。\n故正确答案为A。","no":77,"missingImage":false},{"type":"question","qid":"13504474","cat":"定义判断","stem":"物质循环是指在生态系统中，各种元素物质沿着特定途径从周围环境中被生物体吸收利用，再从生物体回到周围环境的循环变化过程，即各种元素物质在生物体和非生物环境之间的往复循环运转过程。\n下列诗句中所描写的内容最能体现物质循环的是：","options":{"A":"时有落花至，远随流水香","B":"莫作绕山云，循环无定期","C":"黄河之水天上来，奔流到海不复回","D":"落红不是无情物，化作春泥更护花"},"answer":"D","explanation":"第一步：找出定义关键词。\n“各种元素物质”、“在生物体和非生物环境之间”、“往复循环运转”。\n第二步：逐一分析选项。\nA项：选项意思是：不时有落花随溪水飘流而至，远远地就可闻到水中的芳香。表明落花及其香味在非生物环境中运转，但未提及生物体环境，不符合“在生物体和非生物环境之间”，不符合定义，排除；\nB项：选项意思是：不要像绕山云般循环往复，没有固定的周期。表明云在非生物环境中循环运转，但未提及生物体环境，不符合“在生物体和非生物环境之间”，不符合定义，排除；\nC项：选项意思是：那黄河之水犹如从天上倾泻而来，波涛翻滚直奔大海从来不会再往回流。表明黄河水在非生物环境中流动，但未提及生物体环境，且流动过程不是往复循环的，不符合“在生物体和非生物环境之间”、“往复循环运转”，不符合定义，排除；\nD项：选项意思是：从枝头上掉下来的落花不是无情之物，即使化作春泥，也甘愿化作养料，滋养美丽的春花成长。表明落花的元素物质在生物体和非生物环境之间运转，符合“各种元素物质”、“在生物体和非生物环境之间”、“往复循环运转”，符合定义，当选。\n故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"12881898","cat":"定义判断","stem":"印客也称in客，指的是把自己在网络平台上所写的、画的、摘录的任何文字和图片整理成册，自己制作或请人制作成具有保存价值并体现个性的印刷品的人。\n根据以上定义，下列属于印客的是：","options":{"A":"小楠是某大学的特聘教师，撰写不少高水平学术文章，去年她将这些文章分类整理成册，目前正与出版社商量印刷排版事宜","B":"小雪是某印刷服务社的美工，具备较高专业素养，业务内容是美化处理客户发来的图片和文字，成品在网络上得到海量好评","C":"小影是某网站的专栏作家，在网络上发表多篇高阅读量和点赞量的文章，不少读者将她的文章打印出来，作为范本交流学习","D":"小芳是某企业员工，经常在微博上用图片加文字的形式表达心灵感悟，她定期收集这些记录，请专业人士排版设计印刷成册"},"answer":"D","explanation":"第一步：找出定义关键词。\n“把自己在网络平台上所写的、画的、摘录的任何文字和图片整理成册”、“自己制作或请人制作成印刷品”。\n第二步：逐一分析选项。\nA项：大学教师小楠将撰写的学术文章整理成册并准备印刷，但没有体现这些学术文章是在网络平台上写的，不符合“把自己在网络平台上所写的、画的、摘录的任何文字和图片整理成册”，不符合定义，排除；\nB项：小雪是美化处理“客户”发来的图片和文字，并非是“自己”在网上写、画或摘录的文字和图片，不符合“把自己在网络平台上所写的、画的、摘录的任何文字和图片整理成册”，不符合定义，排除；\nC项：读者将小影在网络平台上写的文章打印出来，并非小影自己将这些文章打印出来，也未体现小影请读者打印，不符合“自己制作或请人制作成印刷品”，不符合定义，排除；\nD项：小芳定期收集自己在微博上用图片加文字所表达出来的内容，并请专业人士印刷成册，符合“把自己在网络平台上所写的、画的、摘录的任何文字和图片整理成册”、“自己制作或请人制作成印刷品”，符合定义，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"13504502","cat":"定义判断","stem":"拓扑绝缘体是一种内部绝缘、界面允许电荷移动的材料，在拓扑绝缘体的内部，电子能带结构和常规的绝缘体相似，但在其表面或边界上存在特殊的量子态，这些量子态位于块体能带结构的带隙之中，从而能够导电。\n根据上述定义，以下哪项是拓扑绝缘体?","options":{"A":"量子点接触是一种纳米尺度的电子器件，其整体的导电性质可以通过调整器件的尺寸和形状来调控","B":"氮化镓中由半导体异质结中的特殊电子结构形成的二维电子气，虽然其并不是一种材料，但在一定条件下能够导电","C":"纯石墨烯本身不导电，但是经过一些工艺加工后，会表现出在一定条件下可以允许表面电荷移动形成导电能力的一种量子效应","D":"镧钡铜氧体系的超导陶瓷，是一类在临界温度时电阻为零的陶瓷材料，它还表现出完全抗磁性的行为，在传输过程中几乎没有能量消耗"},"answer":"C","explanation":"第一步：找出定义关键词。\n“内部绝缘、界面允许电荷移动的材料”。\n第二步：逐一分析选项。\nA项：量子点接触可以通过调整器件的尺寸和形状来调控整体的导电性，未提及其内部和外部的导电情况，不符合“内部绝缘、界面允许电荷移动的材料”，不符合定义，排除；\nB项：氮化镓中的二维电子气在一定条件下能够导电，不符合“内部绝缘、界面允许电荷移动的材料”，不符合定义，排除；\nC项：纯石墨烯本身不导电，符合“内部绝缘”，经过一些工艺加工后可以允许表面电荷移动形成导电能力，符合“界面允许电荷移动”，符合定义，当选；\nD项：镧钡铜氧体系的超导陶瓷是一类在临界温度时电阻为零的陶瓷材料，没有提及其导电性，不符合“内部绝缘、界面允许电荷移动的材料”，不符合定义，排除。\n故正确答案为C。","no":80,"missingImage":false},{"type":"question","qid":"13504511","cat":"定义判断","stem":"计算亲属关系亲疏远近的单位是亲等，国际最为通用的是罗马法亲等计算法和寺院法亲等计算法，二者关于旁系血亲的计算法有所不同：罗马法亲等计算法是从己身往上数至双方共同的直系血亲即同源人，每经一代为一亲等，再往下数至要计算的人，也是每经一代为一亲等，所有数字相加就是双方之间的亲等数；寺院法亲等计算法是从己身和所要计算的人分别往上数至血缘同源人，两边的亲等数相等时，就采用一边的亲等数，如果亲等数不等，则采用多的一方的亲等数。\n根据上述定义，下列符合罗马法亲等计算法的是：","options":{"A":"自己与外甥的女儿之间的亲等是三亲等","B":"表妹与堂妹之间的亲等，都是四亲等","C":"姑侄之间的亲等是二亲等","D":"自己与伯父之间是三亲等"},"answer":"D","explanation":"第一步：找出定义关键词。\n罗马法亲等计算法：“从己身往上数至双方共同的直系血亲即同源人，每经一代为一亲等”、“再往下数至要计算的人，也是每经一代为一亲等”、“所有数字相加”；\n寺院法亲等计算法：“从己身和所要计算的人分别往上数至血缘同源人”、“两边的亲等数相等时，就采用一边的亲等数”、“亲等数不等，则采用多的一方的亲等数”。\n第二步：逐一分析选项。\nA项：自己与外甥的女儿的同源人是自己的父母，从自己到父母经过“自己\u003cimg data-k=\"a37757d411ef\">父母”，共1代，从父母到外甥的女儿经过“父母\u003cimg data-k=\"a37757d411ef\">姐姐/妹妹\u003cimg data-k=\"a37757d411ef\">外甥\u003cimg data-k=\"a37757d411ef\">外甥的女儿”，共3代，1+3=4，因此为四亲等，不符合定义，排除；\nB项：当表妹为妈妈的兄弟姐妹的女儿时，与堂妹（父亲的兄弟的女儿）没有共同的直系血亲，无血缘关系和亲等关系，不符合定义，排除；\nC项：姑姑和侄子的同源人是侄子的爷爷，从姑姑到侄子的爷爷经过“姑姑\u003cimg data-k=\"a37757d411ef\">爷爷”，共1代，从爷爷到侄子经过“爷爷\u003cimg data-k=\"a37757d411ef\">父亲\u003cimg data-k=\"a37757d411ef\">侄子”，共2代，1+2=3，因此为三亲等，不符合定义，排除；\nD项：自己与伯父的同源人是自己的爷爷，从自己到爷爷经过“自己\u003cimg data-k=\"a37757d411ef\">父亲\u003cimg data-k=\"a37757d411ef\">爷爷”，共2代，从爷爷到伯父经过“爷爷\u003cimg data-k=\"a37757d411ef\">伯父”，共1代，2+1=3，因此为三亲等，符合定义，当选。\n故正确答案为D。","no":81,"missingImage":false},{"type":"question","qid":"13504455","cat":"定义判断","stem":"免疫电镜技术是将抗原抗体反应的特异性和电子显微镜的高分辨率相结合，在亚细胞和超微结构水平上对抗原进行定位分析的一种高精确度的技术。\n根据上述定义，下列不属于免疫电镜技术的是：","options":{"A":"酶的催化作用对其底物的反应可形成不同的电子密度，运用电子显微镜来观察，可确定酶的存在，从而对抗原进行定位","B":"胶体金与铁蛋白一样具有高电子密度，将沙门氏菌的抗血清与胶体金颗粒结合，可以明确病原物抗原在电镜水平的定位","C":"铁蛋白通过交联剂与抗体等物质的共价结合，其分辨率高、散射能力强，借助电镜可以准确描述抗原抗体复合物的定位","D":"微流体检测芯片中的免疫电极体系有镀金基层、导电聚合物层和抗体层，三者自下而上依次贴合，提高检测定位的水平"},"answer":"D","explanation":"第一步：找出定义关键词。\n“将抗原抗体反应的特异性和电子显微镜的高分辨率相结合”、“在亚细胞和超微结构水平上对抗原进行定位分析”。\n第二步：逐一分析选项。\nA项：该项中运用电子显微镜观察酶的催化作用，符合“将抗原抗体反应的特异性和电子显微镜的高分辨率相结合”，通过确定酶的存在来对抗原进行定位，符合“在亚细胞和超微结构水平上对抗原进行定位分析”，符合定义，排除；\nB项：该项中将沙门氏菌的抗血清与胶体金颗粒结合，利用电子显微镜明确抗原定位，符合“将抗原抗体反应的特异性和电子显微镜的高分辨率相结合”、“在亚细胞和超微结构水平上对抗原进行定位分析”，符合定义，排除；\nC项：该项中铁蛋白通过交联剂与抗体等物质的共价结合，借助电镜准确描述抗原抗体复合物的定位，符合“将抗原抗体反应的特异性和电子显微镜的高分辨率相结合”、“在亚细胞和超微结构水平上对抗原进行定位分析”，符合定义，排除；\nD项：该项中只是提到微流体检测芯片中的免疫电极体系有不同的层结构来提高检测定位水平，但没有提及使用电子显微镜，不符合“将抗原抗体反应的特异性和电子显微镜的高分辨率相结合”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":82,"missingImage":false},{"type":"question","qid":"13504472","cat":"定义判断","stem":"意思主义和表示主义是解释确定语言含义的两种方法。当语言发生歧义时，意思主义认为应当按照言语者内心所欲表达的真实意思来确定语言含义，而无需在意别人如何理解；反之，表示主义主张语言一旦表达出来便与言语者没有关系了，应当按照社会公众的通常理解来确定语言的含义。\n根据上述定义，下列说法最能体现意思主义的是：","options":{"A":"误载不害真意","B":"人同此心，心同此理","C":"一千个读者有一千个哈姆雷特","D":"横看成岭侧成峰，远近高低各不同"},"answer":"A","explanation":"第一步：找出定义关键词。\n意思主义：“按照言语者内心所欲表达的真实意思来确定语言含义”；\n表示主义：“按照社会公众的通常理解来确定语言的含义”。\n第二步：逐一分析选项。\nA项：“误载不害真意”指表意人与相对人已达成意思表示一致，不因合同文本中出现的用词错误而影响双方已经达成的真实合意，强调要按照表意人（言语者）内心真实的意思来确定，符合“按照言语者内心所欲表达的真实意思来确定语言含义”，符合“意思主义”定义，当选；\nB项：“人同此心，心同此理”的意思是合情合理的事，大家想法都会相同，不符合“按照言语者内心所欲表达的真实意思来确定语言含义”，不符合“意思主义”定义，排除；\nC项：“一千个读者有一千个哈姆雷特”指人们对同一艺术作品的解读因个体差异而呈现多样性，不符合“按照言语者内心所欲表达的真实意思来确定语言含义”，不符合“意思主义”定义，排除；\nD项：“横看成岭侧成峰，远近高低各不同”的意思是从正面、侧面看庐山山岭连绵起伏、山峰耸立，从远处、近处、高处、低处看庐山，庐山呈现各种不同的样子，不符合“按照言语者内心所欲表达的真实意思来确定语言含义”，不符合“意思主义”定义，排除。\n故正确答案为A。","no":83,"missingImage":false},{"type":"question","qid":"13504453","cat":"类比推理","stem":"言之无文：行之不远","options":{"A":"一叶障目：不见泰山","B":"宁为玉碎：不为瓦全","C":"藏诸名山：传之其人","D":"取之不尽：用之不竭"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“言之无文，行之不远”的意思是说话没有文采，就传播不远，因为“言之无文”，所以“行之不远”，二者为因果关系。\n第二步：判断选项词语间逻辑关系。\nA项：“一叶障目，不见泰山”的意思是一片树叶挡住了眼睛，连面前高大的泰山都看不见，因为“一叶障目”，所以“不见泰山”，二者为因果关系，与题干逻辑关系一致，当选；\nB项：“宁为玉碎，不为瓦全”的意思是指宁愿做高贵的玉器而破碎，也不愿做低贱的瓦器得以保全，二者不是因果关系，与题干逻辑关系不一致，排除；\nC项：“藏诸名山，传之其人”的意思是指把著作藏在名山，传给后来志趣相投的人，二者不是因果关系，与题干逻辑关系不一致，排除；\nD项：“取之不尽，用之不竭”的意思是指拿不完用不尽，二者为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":84,"missingImage":false},{"type":"question","qid":"12882052","cat":"类比推理","stem":"柠檬水：酸梅汤","options":{"A":"橘子汁：香蕉水","B":"梅子酒：葡萄干","C":"苹果派：草莓挞","D":"西瓜霜：荔枝蜜"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“柠檬水”和“酸梅汤”是两种不同的饮品，二者为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：“橘子汁”是橘子压榨出的汁水，“香蕉水”是由多种有机溶剂混合而成的无色透明液体，因具香蕉气味而得名，二者不是并列关系，与题干逻辑关系不一致，排除；\nB项：“梅子酒”是将梅子放置于米类蒸馏酒里长时间浸泡入味的一种浸泡酒，“葡萄干”是借助于太阳热或人工加热使葡萄果实脱水形成的固态食品，二者不是并列关系，与题干逻辑关系不一致，排除；\nC项：“苹果派”是以苹果、面粉、黄油等为原材料加工而成的一种甜点，“草莓挞”是以草莓、面粉、黄油、糖、牛奶等为原材料制作的一种甜品，二者为并列关系，与题干逻辑关系一致，当选；\nD项：“西瓜霜”是西瓜的成熟果实与芒硝经加工而成的白色结晶粉末，也是一种中药，“荔枝蜜”是采用荔枝的花而酿制的蜂蜜，是南方地区生产的上等蜂蜜，带有清淡的荔枝花香味，二者不是并列关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":85,"missingImage":false},{"type":"question","qid":"13504429","cat":"类比推理","stem":"低碳排放：保护环境","options":{"A":"候鸟迁徙：气候变化","B":"昆虫叮咬：过敏反应","C":"收集数据：调查研究","D":"滴水成冰：热胀冷缩"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n低碳排放是为了保护环境，二者为方式目的的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：候鸟迁徙是因为气候变化，二者为因果的对应关系，与题干逻辑关系不一致，排除；\nB项：昆虫叮咬会导致过敏反应，二者为因果的对应关系，与题干逻辑关系不一致，排除；\nC项：收集数据是为了调查研究，二者为方式目的的对应关系，与题干逻辑关系一致，当选；\nD项：滴水成冰意思是水滴下去就结成冰，形容天气十分寒冷；热胀冷缩指物体受热时会膨胀，遇冷时会收缩的特性，二者不是方式目的的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":86,"missingImage":false},{"type":"question","qid":"12882053","cat":"类比推理","stem":"石料：木材：印章","options":{"A":"毛笔：墨水：书法","B":"湘绣：蜀绣：刺绣","C":"宣纸：年画：国画","D":"搪瓷：塑料：脸盆"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n石料和木材均可以用来制作印章，前两词为并列关系，分别与第三词构成原材料与成品的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：毛笔和墨水配套使用可以用来书写书法作品，前两词为配套使用的对应关系，第一词与第三词也不是原材料与成品的对应关系，与题干逻辑关系不一致，排除；\nB项：湘绣和蜀绣是中国刺绣中两个不同的门类，前两词为并列关系，分别与第三词构成种属关系，与题干逻辑关系不一致，排除；\nC项：绘制年画和国画会用到宣纸，前两词不是并列关系，第二词与第三词也不是原材料与成品的对应关系，与题干逻辑关系不一致，排除；\nD项：搪瓷和塑料均可以用来制作脸盆，前两词为并列关系，分别与第三词构成原材料与成品的对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":87,"missingImage":false},{"type":"question","qid":"12882054","cat":"类比推理","stem":"衰弱：噪声：听力","options":{"A":"锻炼：饮食：健康","B":"杠杆：重力：质量","C":"降低：摩擦：速度","D":"气候变暖：冰层融化：环境"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n噪声会导致听力衰弱，且噪声是原因，听力衰弱是结果，听力衰弱构成主谓结构。\n第二步：判断选项词语间逻辑关系。\nA项：饮食不会导致健康锻炼，且饮食不是原因，与题干逻辑关系不一致，排除；\nB项：重力是地球对物体的吸引力，物体的质量越大，重力越大，重力不是原因，与题干逻辑关系不一致，排除；\nC项：摩擦会导致速度降低，且摩擦是原因，速度降低是结果，速度降低构成主谓结构，与题干逻辑关系一致，当选；\nD项：气候变暖会导致冰层融化，进一步会影响环境，冰层融化是结果，而非原因，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":88,"missingImage":false},{"type":"question","qid":"13504485","cat":"类比推理","stem":"车辆：货车：运输","options":{"A":"温室气体：甲烷：二氧化碳","B":"未来产业：量子信息：研究监管","C":"自我意识：人格：心理调节","D":"绿色能源：太阳能：发电"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n货车是一种车辆，前两词为种属关系，货车可以用来运输，后两词为功能对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：甲烷和二氧化碳均是一种温室气体，第一词与后两词分别构成种属关系，且后两词为并列关系，与题干逻辑关系不一致，排除；\nB项：量子信息是一种未来产业，前两词为种属关系，研究监管不是量子信息的功能，后两词不是功能对应关系，与题干逻辑关系不一致，排除；\nC项：自我意识对人格的形成、发展有作用，前两词不是种属关系，心理调节不是人格的功能，后两词不是功能对应关系，与题干逻辑关系不一致，排除；\nD项：太阳能是一种绿色能源，前两词为种属关系，太阳能可以用来发电，后两词为功能对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":89,"missingImage":false},{"type":"question","qid":"12881899","cat":"类比推理","stem":"名垂青史：光耀千秋：光前裕后","options":{"A":"畏首畏尾：犹犹豫豫：瞻前顾后","B":"投鼠忌器：缩手缩脚：慎终追远","C":"光宗耀祖：光耀门楣：落叶归根","D":"空前绝后：开天辟地：继往开来"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“名垂青史”意思是好的名声和事迹载入史籍永远流传；“光耀千秋”意思是光辉照耀千年，形容功绩或荣耀长久流传，影响深远；“光前裕后”意思是给前人增光，为后代造福，多用来称颂他人功业隆盛。三者为近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“畏首畏尾”形容疑虑过多；“犹犹豫豫”形容拿不定主意；“瞻前顾后”意思是看看前面再看看后面，形容做事以前考虑周密谨慎，也指顾虑太多，犹豫不定。三者为近义关系，与题干逻辑关系一致，当选；\nB项：“投鼠忌器”意思是要打老鼠又怕打坏了旁边的器物，比喻想打击坏人而又有所顾忌；“缩手缩脚”意思是因寒冷而四肢不能舒展的样子，也形容做事胆小，顾虑多，不敢放手；“慎终追远”旧指慎重地办理父母丧事，虔诚地祭祀远代祖先，后也指谨慎从事，追念前贤。第三个词与前两个词不是近义关系，与题干逻辑关系不一致，排除；\nC项：“光宗耀祖”意思是为祖先、宗族增添光彩；“光耀门楣”意思是做出了让家门荣耀的事情；“落叶归根”比喻事物有一定的归宿，多指客居他乡的人终要回到本乡。第三个词与前两个词不是近义关系，与题干逻辑关系不一致，排除；\nD项：“空前绝后”意思是从前没有过，以后也不会有，多用来形容非凡的成就或盛况；“开天辟地”比喻空前的，自古以来没有过的；“继往开来”意思是继承前人的事业，并为将来开辟道路。三者不是近义关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":90,"missingImage":false},{"type":"question","qid":"12881900","cat":"类比推理","stem":"（    ） 对于 众志成城 相当于 拒谏饰非 对于 （    ）","options":{"A":"孤掌难鸣 广开言路","B":"寸积铢累 从谏如流","C":"众擎易举 集思广益","D":"独木难支 闭目塞听"},"answer":"A","explanation":"逐一代入选项。\nA项：孤掌难鸣指一个巴掌拍不响，比喻孤立无助，不能成事，众志成城指大家齐心协力，就像城墙一样地牢固，比喻众人团结一致，就能克服困难，二者为反义关系；拒谏饰非指拒绝规劝，掩饰错误或过失，广开言路指尽可能地让人们广泛发表意见，博采众议，二者为反义关系，前后逻辑关系一致，当选；\nB项：寸积铢累指由很小的数量一点一滴地慢慢积累起来，众志成城指大家齐心协力，就像城墙一样地牢固，比喻众人团结一致，就能克服困难，二者无明显逻辑关系；拒谏饰非指拒绝规劝，掩饰错误或过失，从谏如流指听从善意的规劝，就像水从高处流下一样顺畅，形容乐意接受别人意见，二者为反义关系，前后逻辑关系不一致，排除；\nC项：众擎易举指许多人一齐用力，容易把东西举起来，比喻大家同心协力就容易把事情办成，众志成城指大家齐心协力，就像城墙一样地牢固，比喻众人团结一致，就能克服困难，二者为近义关系；拒谏饰非指拒绝规劝，掩饰错误或过失，集思广益指集中群众的智慧，广泛吸收有益的意见，二者为反义关系，前后逻辑关系不一致，排除；\nD项：独木难支指一根木头支持不住高大的房子，比喻一个人的力量难以支撑全局，也比喻艰巨的任务不是一个人所能胜任的，众志成城指大家齐心协力，就像城墙一样地牢固，比喻众人团结一致，就能克服困难，二者为反义关系；拒谏饰非指拒绝规劝，掩饰错误或过失，闭目塞听指闭着眼睛，堵住耳朵，形容对外界事物不闻不问或不了解，二者为近义关系，前后逻辑关系不一致，排除。\n故正确答案为A。","no":91,"missingImage":false},{"type":"question","qid":"12882055","cat":"类比推理","stem":"（    ） 对于 松树 相当于 CPU 对于 （    ）","options":{"A":"松果  显卡","B":"植物  电器","C":"松子  电脑","D":"松茸  芯片"},"answer":"C","explanation":"逐一代入选项。\nA项：松果是松树的组成部分，二者为组成关系；CPU和显卡均为电脑的部件，二者为并列关系，前后逻辑关系不一致，排除；\nB项：松树是植物，二者为种属关系；CPU不是电器，二者不是种属关系，前后逻辑关系不一致，排除；\nC项：松子是松树的组成部分，二者为组成关系；CPU是电脑的组成部分，二者为组成关系，前后逻辑关系一致，当选；\nD项：松茸是一种真菌，通常生长在松树根部附近，二者为共生关系；CPU是一种芯片，二者为种属关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":92,"missingImage":false},{"type":"question","qid":"12882056","cat":"类比推理","stem":"（    ） 对于 运动器材 相当于 玫瑰 对于 （    ）","options":{"A":"单杠  爱情","B":"哑铃  花卉","C":"健身  精油","D":"铸铁  月季"},"answer":"B","explanation":"逐一代入选项。\nA项：单杠是一种运动器材，二者是种属关系；玫瑰可象征爱情，二者是比喻象征关系，前后逻辑关系不一致，排除；\nB项：哑铃是一种运动器材，二者是种属关系；玫瑰是一种花卉，二者也是种属关系，前后逻辑关系一致，当选；\nC项：运动器材有健身的作用，二者是功能的对应关系；玫瑰是制作精油的一种原材料，二者是原材料与成品的对应关系，前后逻辑关系不一致，排除；\nD项：‌铸铁是制作运动器材的一种原材料‌，二者是原材料与成品的对应关系；玫瑰和月季是同属蔷薇科的两种不同花卉，二者是反对关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":93,"missingImage":false},{"type":"question","qid":"13504487","cat":"逻辑判断","stem":"有研究人员针对素食对心血管疾病高危人群的影响进行数据分析发现，素食与低密度脂蛋白胆固醇、葡萄糖水平和体重的显著改善有关，因此，研究人员提出素食可有效降低胆固醇、血糖和体重。\n以下哪项如果为真，不能削弱上述结论：","options":{"A":"快餐店素食套餐含有精制碳水化合物、蔗糖、玉米糖浆等，热量更高","B":"部分素食含有大量反式脂肪酸，反式脂肪酸的摄入会引起胆固醇升高","C":"广义上的素食不仅包括蔬菜等纯素食，还包括鸡蛋、奶和乳制品","D":"素食中的蔬菜多是油炸的，这使素食者变胖的风险更大"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：素食可有效降低胆固醇、血糖和体重。\n论据：素食与低密度脂蛋白胆固醇、葡萄糖水平和体重的显著改善有关。\n本题论点和论据讨论的均是“素食”和“胆固醇、血糖和体重”的关系，二者话题一致，且本题为选非题，排除能够削弱的选项即可。\n第二步：逐一分析选项。\nA项：选项指出“快餐店素食套餐含有精制碳水化合物、蔗糖、玉米糖浆等，热量更高”，说明素食可能无法降低血糖和体重，削弱论点，可以削弱，排除；\nB项：选项指出“部分素食含有大量反式脂肪酸，反式脂肪酸的摄入会引起胆固醇升高”，说明素食无法降低胆固醇，削弱论点，可以削弱，排除；\nC项：选项指出“广义上的素食”包含哪些，但并未说明素食是否能够“有效降低胆固醇、血糖和体重”，话题不一致，为无关项，无法削弱，当选；\nD项：选项指出“素食中的蔬菜多是油炸的，这使素食者变胖的风险更大”，说明素食无法降低体重，削弱论点，可以削弱，排除。\n本题为选非题，故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"13504491","cat":"逻辑判断","stem":"某研究团队发布了一项关于睡眠习惯、时间与癌症风险的研究。研究分析了近1.5万人，发现睡眠时间短导致癌症风险升高，和睡眠时间为6-8小时的参与者相比，夜间睡眠时间少于6小时的人，患癌风险升高41%，和午睡时间多于60分钟的参与者相比，从不午睡的参与者患癌风险升高60%。\n以下哪项如果为真，最能加强上述观点：","options":{"A":"睡眠时间短会损害免疫功能、降低人体对肿瘤细胞的识别和消灭能力","B":"人类环境、卫生资源和睡眠习惯的变化，导致癌症发病原因发生了变化","C":"夜间睡眠时间短或不午睡的参与者，大多年龄较大且缺少锻炼，健康状况不佳","D":"和总睡眠时间为7-8小时的参与者相比，总睡眠时间少于7小时的男性，患癌风险升高69%"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：睡眠时间短导致癌症风险升高。\n论据：和睡眠时间为6-8小时的参与者相比，夜间睡眠时间少于6小时的人，患癌风险升高41%，和午睡时间多于60分钟的参与者相比，从不午睡的参与者患癌风险升高60%。\n论据在说夜间睡眠时间短和从不午睡的参与者患癌风险高，论点在说睡眠时间短导致癌症风险升高，二者话题一致，加强考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出“睡眠时间短会损害免疫功能、降低人体对肿瘤细胞的识别和消灭能力”，解释了睡眠时间短与患癌风险高之间的关系，补充论据，可以加强，保留；\nB项：该项指出人类环境、卫生资源和睡眠习惯的变化使得癌症发病原因发生了变化，并未说明睡眠时间短和癌症风险高有关系，无法加强，排除；\nC项：该项指出夜间睡眠时间短或不午睡的参与者，年龄较大且缺少锻炼，但并未说明年龄较大、缺少锻炼是否癌症风险就会高，为不明确项，无法加强，排除；\nD项：该项指出睡眠时间短于7小时的男性患癌风险升高了69%，举例说明睡眠时间短与患癌风险高之间存在关系，补充论据，可以加强，保留。\n比较A、D两项，A项是解释原因，D项举例，解释原因的加强力度大于举例，A项的加强力度更强。\n故正确答案为A。","no":95,"missingImage":false},{"type":"question","qid":"13504516","cat":"类比推理","stem":"有研究发现，儿童受试者考夫曼简明智力测验得分下降与其居住地点黑碳浓度的提高有关。此外，在老年男性群体中，黑碳浓度水平升高1倍，其简易智力状态检查量表（MMSE）得分小于25的OR值为1.3，相当于衰老1.9年。由此，专家认为，黑碳暴露会导致神经系统损伤。\n以下哪项如果为真，最能削弱上述论证：","options":{"A":"相关研究所关注的儿童和老人群体本身血脑屏障较脆弱，易受黑碳暴露影响","B":"颗粒物可以通过嗅球，沿嗅觉神经元传输到大脑，对神经系统产生不良影响","C":"最新研究表明，黑碳因其特有的物化属性可能具有比细颗粒物更大的健康影响","D":"黑碳暴露与男孩在考夫曼简明智力测验中的反应时间延长和错误率增加有关，而在女孩中未观察到显著相关性"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：黑碳暴露会导致神经系统损伤。\n论据：有研究发现，儿童受试者考夫曼简明智力测验得分下降与其居住地点黑碳浓度的提高有关。此外，在老年男性群体中，黑碳浓度水平升高1倍，其简易智力状态检查量表（MMSE）得分小于25的OR值为1.3，相当于衰老1.9年。\n论据说的是“黑碳暴露与智力下降有关”，进而得出论点“黑碳暴露会导致神经系统损伤”，话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出论据中的儿童和老人群体的血脑屏障较为脆弱，易受黑碳暴露影响，解释了为什么这些人容易受到黑碳暴露的影响，具有加强作用，无法削弱，排除；\nB项：指出颗粒物可以通过嗅球，沿嗅觉神经元传输到大脑，对神经系统产生不良影响，黑碳属于颗粒物，解释了黑碳暴露会导致神经系统损伤的原因，属于加强项，无法削弱，排除；\nC项：指出黑碳因其特有的物化属性可能具有比细颗粒物更大的健康影响，但不知道是什么样的影响，不明确是否会导致神经系统损伤，无法削弱，排除；\nD项：指出黑碳暴露与男孩在考夫曼简明智力测验中的反应时间延长和错误率增加有关，而在女孩中未观察到显著相关性，补充女孩的反例，说明该结论不具有普遍性，削弱论点，当选。\n故正确答案为D。\n备注：以下为已查询到的原文，D项在原文中明确作为例证出现，供大家参考。\n\u003cimg data-k=\"522eff07c486\" style=\"max-width:643px\">","no":96,"missingImage":false},{"type":"question","qid":"13504512","cat":"类比推理","stem":"某研究指出，阻力训练可以帮助预防或延缓阿尔茨海默病（AD）。研究者给小鼠的尾部绑上拉力带，将其放置在一个倾斜的木板上并训练向上爬，训练四周后，小鼠的血液样本分析表明，参与阻力训练小鼠的大脑中很少出现\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积，皮质酮（相当于人类分泌的皮质醇）也处于正常水平。除此之外，阻力训练增加了小鼠大脑中小胶质细胞的数量，这种细胞在AD早期对大脑有重要保护作用，比如清除\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白的多肽和细胞碎片，减轻大脑局部炎症。\n以上论述如果为真，必须基于的前提是：","options":{"A":"皮质醇水平在AD早期阶段会呈现升高的趋势","B":"大脑中累积的\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白是导致罹患AD的元凶","C":"阻力训练会使小胶质细胞从促炎状态转变成抗炎症状态","D":"皮质醇会在压力过大时生成并使得个体容易焦虑和躁动"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：阻力训练可以帮助预防或延缓阿尔茨海默病。\n论据：研究者给小鼠的尾部绑上拉力带，将其放置在一个倾斜的木板上并训练向上爬，训练四周后，小鼠的血液样本分析表明，参与阻力训练小鼠的大脑中很少出现\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积，皮质酮（相当于人类分泌的皮质醇）也处于正常水平。除此之外，阻力训练增加了小鼠大脑中小胶质细胞的数量，这种细胞在AD早期对大脑有重要保护作用。\n本题论点讨论的是阻力训练可以帮助预防或延缓阿尔茨海默病（AD），论据讨论的是阻力训练可以减少\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积、使皮质醇处于正常水平；同时阻力训练也可以增加小胶质细胞的数量，从而保护早期AD患者的大脑。其中，论据中的“减少\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积、使皮质醇处于正常水平”与论点中的“帮助预防或延缓阿尔茨海默病（AD）”话题不一致，且提问方式为“前提”，优先考虑搭桥，即建立“减少\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积、使皮质醇处于正常水平”与“帮助预防或延缓阿尔茨海默病（AD）”的联系。\n第二步：逐一分析选项。\nA项：指出皮质醇水平在AD早期阶段会呈现升高的趋势，但不明确使皮质醇处于正常水平是否有助于预防或延缓阿尔茨海默病，为不明确项，无法加强，排除；\nB项：指出\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白积累会导致罹患AD，说明\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白是AD的病因，即减少\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白有助于预防罹患AD，在“减少\u003cimg data-k=\"87dff3f6cc87\">-淀粉样蛋白累积”与“帮助预防或延缓阿尔茨海默病”之间建立联系，为搭桥项，是论述成立的前提，当选；\nC项：指出阻力训练会使小胶质细胞从促炎状态转变成抗炎症状态，而减少炎症在AD早期对大脑有保护作用，解释了阻力训练有可能帮助预防或延缓阿尔茨海默病，补充论据，但并非论述成立的前提，排除；\nD项：指出皮质醇会在压力过大时生成并使得个体容易“焦虑和躁动”，与论点讨论的“阿尔茨海默病”无关，为无关项，无法加强，排除。\n故正确答案为B。","no":97,"missingImage":false},{"type":"question","qid":"13504447","cat":"逻辑判断","stem":"与人类的眼球是一整个球形不同，鸟类眼球是由一大一小的两个半球构成，小的半球是角膜，大的半球是视网膜，在角膜周围有一圈小骨片形成的一个环状的支撑性的脊，这个骨片环即巩膜环，保护眼球的同时也限制了眼球的转动，人类在走路时，通过眼球的转动抵消走路时的振动来保持视觉的稳定，而鸟类无法大幅度地转动眼球。因此，很多鸟类走路时，让头部先移至前方保持稳定，身体再前进。保持不动的头部像是向后缩了一样，于是就成了脖子一伸一缩的样子。\n由此可以推出：","options":{"A":"鸟类的眼球构造有助于形成更锐利的远视力","B":"鸟类走路时脖子的伸缩有助于维持身体的平衡","C":"鸟类通过颈部运动让眼睛成像保持更持久的稳定","D":"鸟类通过运动头部来获得视差以增强空间的深度感知"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干中第一句介绍了鸟类的眼球构造，但没有提及此眼球构造有助于形成更锐利的远视力，无中生有，排除；\nB项：题干中指出鸟类走路时脖子的伸缩有助于保持视觉的稳定，但没有提及有助于维持身体的平衡，无中生有，排除；\nC项：题干中指出鸟类无法大幅度地转动眼球来保持视觉的稳定。因此，鸟类走路时，让头部先移至前方保持稳定，身体再前进，出现脖子一伸一缩的样子，可以推出鸟类是通过颈部运动让眼睛成像保持更持久的稳定，当选；\nD项：题干中指出鸟类通过运动头部来保持视觉的稳定，但没有提及通过运动头部来获得视差以增强空间的深度感知，无中生有，排除。\n故正确答案为C。","no":98,"missingImage":false},{"type":"question","qid":"12881901","cat":"逻辑判断","stem":"某地湖水水位的季节性变化显著，洪水期和枯水期的湖水面积和蓄水量相差悬殊，每到秋冬季节进入枯水期，湖水水位急剧下降，湖面沙洲裸露，仅剩几条蜿蜒的水道，对当地居民的生产生活造成不良影响。当地政府计划在湖泊口建设一道巨型水闸，可以在秋冬季节蓄住湖水，以满足灌溉、航运、生活等需求。生态专家认为，水闸不会对生态环境造成负面影响，甚至能够优化当地物种的生存环境。\n以下哪项如果为真，最能削弱上述论证：","options":{"A":"该湖泊是某些候鸟的栖息地，每年都会吸引它们来此越冬","B":"蓄水会导致湖泊的冬季水位上涨，某些种类的候鸟喜爱浮水游动","C":"水闸上会预留数个60米宽的洄游通道，供江豚等水生动物洄游觅食","D":"湖泊周围主要的鸟类种群以水生植物块茎和底栖生物为食，需要栖息在较浅的水陆交错环境"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：水闸不会对生态环境造成负面影响，甚至能够优化当地物种的生存环境。\n论据：无。\n本题只有论点，没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出该湖泊是某些候鸟的栖息地，每年都会吸引它们来此越冬，而论点讨论的是水闸对生态环境、当地物种的影响，话题不一致，无法削弱，排除；\nB项：该项指出蓄水会导致湖泊的冬季水位上涨，某些种类的候鸟喜爱浮水游动，说明水闸建设优化了候鸟的生存环境，为加强项，无法削弱，排除；\nC项：该项指出水闸上会预留数个60米宽的洄游通道，供江豚等水生动物洄游觅食，说明水闸建设不会影响江豚等水生动物的生存环境，不会对生态环境造成负面影响，为加强项，无法削弱，排除；\nD项：该项指出湖泊周围主要的鸟类种群需要栖息在较浅的水陆交错环境，说明水闸建设带来的高蓄水量不利于鸟类种群的栖息，削弱论点，可以削弱，当选。\n故正确答案为D。","no":99,"missingImage":false},{"type":"question","qid":"13504503","cat":"逻辑判断","stem":"大蚕蛾具有其他昆虫无法比拟的巨大翅膀，长度可达28cm，是自然界中最为绚丽灿烂的昆虫之一。在自然界中，为了吸引异性，许多动物都拥有鲜艳美丽的外形，因此，科学家认为，大蚕蛾的“锦衣华服”是用于吸引异性，从而增加交配繁殖的几率。\n以下哪项如果为真，最能削弱上述结论：","options":{"A":"绝大部分种类的大蚕蛾生存繁衍于群山密林之中，昼伏夜出，无法看清同类的翅膀","B":"大蚕蛾翅膀的绚丽来自于鳞片的密集排布，能折射和衍射光线，从而让天敌分心或疑惑","C":"大蚕蛾头顶的触角是重要的感觉器官，主要起到嗅觉和触觉作用，可以通过触角进行信息交流","D":"大蚕蛾雌雄两性的色泽不同，雄性大体呈橘黄色，翅膀以杏黄色为主，雌性为青白色，翅膀以淡绿色为主"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：大蚕蛾的“锦衣华服”是用于吸引异性，从而增加交配繁殖的几率。\n论据：在自然界中，为了吸引异性，许多动物都拥有鲜艳美丽的外形。\n本题论点和论据均在讨论“外形”和“吸引异性”的关系，二者话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出绝大部分种类的大蚕蛾生存繁衍于群山密林，无法看清同类的翅膀，说明大蚕蛾无法依靠外形吸引异性，增加交配繁殖的几率，削弱论点，可以削弱，当选；\nB项：该项指出大蚕蛾翅膀绚丽的原因，绚丽的翅膀能让天敌分心或疑惑，但并未提及绚丽翅膀能否吸引异性，增加交配繁殖的几率，话题不一致，无法削弱，排除；\nC项：该项指出大蚕蛾头顶的触角能起到哪些作用，而论点讨论的是大蚕蛾的绚丽翅膀能否吸引异性，增加交配繁殖的几率，话题不一致，无法削弱，排除；\nD项：该项指出大蚕蛾雌雄两性的色泽区别，而论点讨论的是大蚕蛾的绚丽翅膀能否吸引异性，增加交配繁殖的几率，话题不一致，无法削弱，排除。\n故正确答案为A。","no":100,"missingImage":false},{"type":"question","qid":"12881902","cat":"逻辑判断","stem":"人类的饮食需在更具营养的同时减少对气候的影响。因此，未来饮食策略应思考降低温室气体的排放，多考虑基于海产的“蓝色”饮食。海产品是良好的蛋白、脂肪酸、维生素和矿物质来源，其中有一半营养密度高于牛肉、猪肉和鸡肉。专家通过资料分析了全球野外捕捞和养殖的海产品营养密度及其对气候的影响发现，野外捕捞鲑鱼、鲱鱼及养殖贻贝、牡蛎等海产品温室气体排放量较低，对气候的影响也小。因此，可持续的海产品消费能够在为人类提供更多营养的同时减轻环境压力。\n由此可以推出：","options":{"A":"为进一步降低碳排放，渔业应采用节能高效的捕捞技术","B":"未来，人们在饮食策略中将大量采用海产品替代其他肉类","C":"每一物种的生产或捕获方法的差异，会给气候变化带来很大不同","D":"鼓励以海产的“蓝色”饮食替代其他动物蛋白，或可帮助应对气候变化"},"answer":"D","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干并未提及应采用哪种捕捞技术，无中生有，无法推出，排除；\nB项：题干仅指出未来应“多考虑”基于海产的“蓝色”饮食，但这不意味着人们在饮食策略中将“大量采用”海产品替代其他肉类，建议不代表一定会发生，且表述过于绝对，无法推出，排除；\nC项：题干仅针对野外捕捞鲑鱼、鲱鱼及养殖贻贝、牡蛎等部分海产品进行了温室气体排放量以及对气候影响的分析，并未提及“每一物种”的生产或捕获方法差异对气候变化有“很大不同”，范围扩大，且表述过于绝对，无法推出，排除；\nD项：题干第二句指出降低温室气体排放应多考虑基于海产的“蓝色”饮食，题干的第四句指出部分海产品温室气体排放量较低，最后一句指出可持续的海产品消费能够减轻环境压力，说明鼓励以基于海产的“蓝色”饮食代替其他动物蛋白，可能能够帮助应对气候变化，可以推出，当选。\n故正确答案为D。","no":101,"missingImage":false},{"type":"question","qid":"13504432","cat":"类比推理","stem":"某市举办智能数控技能大赛，小周、小吴、小郑、小王、小钱进入了决赛。比赛后，有记者询问他们的感受，他们回答如下：\n小周：小郑整场发挥得都很好，我觉得冠军非他莫属；\n小吴：我觉得冠军一定会在我、小周、小钱三人之中产生；\n小郑：我自我感觉不好，这次与冠军无缘了；\n小钱：我连季军都拿不到；\n小王：我不会是亚军。\n已知本次比赛产生了冠军、亚军、季军各一人，且在五人中只有一个人的回答与比赛结果相符。那么，获得亚军的是：","options":{"A":"小王","B":"小吴","C":"小郑","D":"小钱"},"answer":"A","explanation":"第一步：找出题干矛盾命题。\n小周：小郑冠军；\n小吴：小吴冠军 或 小周冠军 或 小钱冠军；\n小郑：\u003cimg data-k=\"0be436194951\">小郑冠军；\n小钱：\u003cimg data-k=\"0be436194951\">小钱前三；\n小王：\u003cimg data-k=\"0be436194951\">小王亚军。\n分析题干条件可知，小周和小郑说的话为矛盾关系，必有一真一假。\n第二步：根据题干条件推理。\n根据题干条件可知，只有一个人的回答为真，则回答为真的人一定在小周和小郑之间，小吴、小钱和小王的回答均为假。小王说自己不是亚军为假，则小王是亚军，对应A项。\n故正确答案为A。","no":102,"missingImage":false},{"type":"question","qid":"13504446","cat":"逻辑判断","stem":"某公园计划从桃树、李树、杨树、柳树、松树中选择几种树种植，树种的选择满足下列条件：\n（1）如果选桃树，那么不选松树； \n（2）要么选桃树，要么选李树；\n（3）至少选3种树种植；\n（4）桃树和杨树至多选1种；\n（5）李树和柳树至多选1种。\n由此可以推出：","options":{"A":"种李树和桃树，不种松树","B":"种桃树和柳树，不种杨树","C":"种李树和杨树，不种松树","D":"种杨树和松树，不种桃树"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）桃树\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">松树；\n（2）要么选桃树，要么选李树；\n（3）至少选3种树种植；\n（4）\u003cimg data-k=\"0be436194951\">桃树 或 \u003cimg data-k=\"0be436194951\">杨树；\n（5）\u003cimg data-k=\"0be436194951\">李树 或 \u003cimg data-k=\"0be436194951\">柳树。\n第二步：根据题干条件进行推理。\n题干条件中“桃树”提及次数最多，可优先从此处入手进行推理。\n若种桃树，结合条件（1）（2）（4）可得，不能种松树、李树和杨树，结合题干信息共有“桃树、李树、杨树、柳树、松树”这5种树，则此时只能种桃树和柳树这两种树，与条件（3）矛盾，故不能种桃树。\n不种桃树，结合条件（2）可得，要种植李树；结合条件（5）否一推一可得，不种柳树。结合题干信息共有“桃树、李树、杨树、柳树、松树”这5种树，根据上述结论“不种桃树”和“不种柳树”，结合条件（3）可得，种李树、杨树和松树，只有D项说法完全正确。\n故正确答案为D。","no":103,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2023年，我国数字经济规模持续扩大。数字经济核心产业增加值超过12万亿元，约占GDP的10%。电子信息制造业增加值同比增长3.4%；电信业务收入1.68万亿元；互联网业务收入1.75万亿元；软件业务收入12.33万亿元。以云计算、大数据、物联网等为代表的新兴业务中，云计算、大数据业务收入同比增长37.5%，物联网业务收入同比增长20.3%。高技术制造业、高技术服务业投资分别同比增长9.9%、11.4%。高技术制造业中，计算机、通信和其他电子设备制造业投资同比增长9.3%。\u003c/p>\u003cp>\u003cimg data-k=\"30b654c86674\" style=\"max-width:582px\">\u003c/p>\u003cp>\u003cimg data-k=\"bfd78551678d\" style=\"max-width:582px\">\u003c/p>","questions":[{"qid":"13504448","cat":"综合","stem":"2022年我国软件业务收入在以下哪个范围：","options":{"A":"10.7-10.9万亿元","B":"10.9-11.1万亿元","C":"11.1-11.3万亿元","D":"11.3-11.5万亿元"},"answer":"A","explanation":"根据题干“2022年······在以下哪个范围”，结合材料时间为2023年，可判定本题为基期计算问题。定位文字材料可得：2023年，我国软件业务收入12.33万亿元；定位统计表可得：2023年我国软件业务收入同比增速为13.40%。根据公式：基期量\u003cimg data-k=\"4ec2c10dc29a\">，则2022年我国软件业务收入\u003cimg data-k=\"a4265cb89d48\">万亿元，在A项范围内。\n故正确答案为A。","no":104,"missingImage":false},{"qid":"13504449","cat":"增长","stem":"2019-2023年，互联网业务收入同比增速高于电子信息制造业增加值同比增速的年份有：","options":{"A":"1个","B":"2个","C":"3个","D":"4个"},"answer":"D","explanation":"定位表格材料可得：2019-2023年，互联网业务收入同比增速分别为21.40%、12.50%、21.20%、-1.10%、6.80%；2019-2023年，电子信息制造业增加值同比增速分别为9.30%、7.70%、15.70%、7.60%、3.40%。则2019-2023年，互联网业务收入同比增速高于电子信息制造增加值同比增速的年份有2019年、2020年、2021年、2023年，共4个年份。\n故正确答案为D。","no":105,"missingImage":false},{"qid":"12881906","cat":"综合","stem":"2023年，新兴业务收入与电信业务收入的比值，较2019年上升了约：","options":{"A":"11个百分点","B":"10.7个百分点","C":"10.3个百分点","D":"9.8个百分点"},"answer":"B","explanation":"根据题干“2023年······与······的比值，较2019年上升了约”，可判定本题为比值计算问题。定位统计图可得：2019年，新兴业务收入、电信业务收入分别为0.1374万亿元、1.31万亿元；2023年分别为0.3564万亿元、1.68万亿元。可知2023年，新兴业务收入与电信业务收入的比值为\u003cimg data-k=\"13467b74ea0b\">，2019年，新兴业务收入与电信业务收入的比值为\u003cimg data-k=\"4fb3f97ec36c\">。则所求为21.2%-10.5%=10.7%，即上升了约10.7个百分点。\n故正确答案为B。","no":106,"missingImage":false},{"qid":"13504450","cat":"增长","stem":"按照2023年的同比增速，2025年互联网业务收入预计在以下哪个范围：","options":{"A":"1.6-1.8万亿元","B":"1.8-2.0万亿元","C":"2.0-2.2万亿元","D":"超过2.2万亿元"},"answer":"B","explanation":"根据题干“按照2023年的同比增速，2025年······在以下哪个范围”，可判定本题为现期计算问题。定位文字材料可得：2023年互联网业务收入1.75万亿元；定位表格材料可得：2023年我国互联网业务收入同比增速为6.80%。根据公式：现期量\u003cimg data-k=\"93a89bf94bde\">，可得2025年互联网业务收入\u003cimg data-k=\"8e0597770109\">\u003cimg data-k=\"e8d03a8d09e7\">\u003cimg data-k=\"16c2b0888d1b\">\u003cimg data-k=\"201062a0bfdc\">\u003cimg data-k=\"c86c9c6c6407\">，略小于1.9999，在B项范围内。\n故正确答案为B。","no":107,"missingImage":false},{"qid":"13504452","cat":"综合","stem":"能够从上述资料中推出的是：","options":{"A":"2023年，高技术制造业投资低于高技术服务业投资","B":"2021-2023年新兴业务收入与电信业务收入的比值逐年上升","C":"2023年，电信业务收入与互联网业务收入之和高于软件业务收入","D":"2023年计算机、通信和其他电子设备制造业投资较2020年翻了一番"},"answer":"B","explanation":"A项：定位文字材料可得：2023年，高技术制造业、高技术服务业投资分别同比增长9.9%、11.4%，但无投资额具体数值，无法推出，错误；\nB项：定位柱状图可得：2021-2023年新兴业务收入分别为0.2372万亿元、0.3060万亿元、0.3564万亿元；电信业务收入分别为1.47万亿元、1.58万亿元、1.68万亿元。则2021-2023年新兴业务收入与电信业务收入的比值分别为：2021年，\u003cimg data-k=\"e3a2845c4c69\">；2022年，\u003cimg data-k=\"cc3ec8e48eb4\">；2023年，\u003cimg data-k=\"fad83e939be6\">。故2021-2023年新兴业务收入与电信业务收入的比值逐年上升，正确；\nC项：定位文字材料可得：2023年，电信业务收入1.68万亿元；互联网业务收入1.75万亿元；软件业务收入12.33万亿元。电信业务收入与互联网业务收入之和（1.68+1.75=3.43万亿元）&lt;软件业务收入（12.33万亿元），并非高于，错误；\nD项：定位表格材料可得：2021-2023年计算机、通信和其他电子设备制造业投资同比增速分别为22.30%、18.80%、9.30%。根据公式：现期量=基期量×（1+增长率），有2023年投资额=2020年投资额×（1+22.30%）（1+18.80%）（1+9.30%），则\u003cimg data-k=\"29871d702c82\">\u003cimg data-k=\"063629cd9983\">\u003cimg data-k=\"53a2414f0206\">，即不到2倍，并非翻一番，错误。\n故正确答案为B。","no":108,"missingImage":false}]},{"type":"material","material":"\u003cp>\u003cimg data-k=\"7f1ccb0f84aa\" style=\"max-width:700px\">\u003c/p>\u003cp>\u003cimg data-k=\"5fdc6e62fb40\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"13504461","cat":"平均数","stem":"2015-2022年期间，我国A股市场新上市公司平均每家首次募资金额最大的年份是：","options":{"A":"2018年","B":"2019年","C":"2021年","D":"2022年"},"answer":"D","explanation":"根据题干“2015-2 根据两期平均数比较结论：当分子的增长率（a）&lt;分母的增长率（b）时，平均数下降。涉及主债务金额的同比增速（-55.13%）&lt;登记件数的同比增速（-26.47%），故2023年平均每件作品（除计算机软件之外）著作权质权登记涉及主债务金额同比下降，正确。\n本题为选非题，故正确答案为B。","no":123,"missingImage":false}]}],"count":20,"answerable":20,"pointsOf":16}],"total":123,"affected":[],"subtitle":"2025年 · 湖北 · 6/6 模块"},{"slug":"2025-湖北-选调生","title":"2025年湖北省选调生招录考试综合知识和行政职业能力测验试卷（网友回忆版）","year":"2025","group":"湖北","modules":[{"label":"政治理论","items":[{"type":"question","qid":"15418862","cat":"时事政治","stem":"2024年12月11日至12日，中央经济工作会议在北京举行。会议总结2024年经济工作，分析当前经济形势，部署2025年经济工作。会议将        列为2025年9项重点任务之首。","options":{"A":"大力提振消费、提高投资效益，全方位扩大国内需求","B":"以科技创新引领新质生产力发展，建设现代化产业体系","C":"发挥经济体制改革牵引作用，推动标志性改革举措落地见效","D":"协同推进降碳减污扩绿增长，加紧经济性社会发展全面绿色转型"},"answer":"A","explanation":"本题考查理论与政策。\nA项正确，B、C、D三项错误，2024年12月11日至12日，中央经济工作会议在北京举行。会议确定，明年要抓好以下重点任务：“一是大力提振消费、提高投资效益，全方位扩大国内需求。实施提振消费专项行动，推动中低收入群体增收减负，提升消费能力、意愿和层级。适当提高退休人员基本养老金，提高城乡居民基础养老金，提高城乡居民医保财政补助标准。······”\n故正确答案为A。","no":1,"missingImage":false},{"type":"question","qid":"15418872","cat":"新思想","stem":"习近平总书记在第二十届中央纪律检查委员会第四次全体会议上强调，腐败是我们党面临的最大威胁，反腐败是最彻底的自我革命。进入新时代，面对党内党风廉政建设和反腐败斗争的突出问题，我们坚持有腐必反、有贪必肃，不断纯洁干部队伍，维护了党的形象，巩固了红色江山，赢得了        。\n①确保党不变质、不变色、不变味的历史主动\n②坚持用改革精神和严的标准管党治党的历史主动\n③引导党员、干部把他律转化为自律，内化为日用而不觉的历史主动\n④党团结带领全体人民为强国建设、民族复兴伟业共同奋斗的历史主动","options":{"A":"①②","B":"①④","C":"②③","D":"③④"},"answer":"B","explanation":"本题考查理论与政策。\n①④正确，②③错误，2025年1月6日，中共中央总书记、国家主席、中央军委主席习近平在中国共产党第二十届中央纪律检查委员会第四次全体会议上发表重要讲话。习近平总书记在讲话中强调：“腐败是我们党面临的最大威胁，反腐败是最彻底的自我革命。进入新时代，面对党内党风廉政建设和反腐败斗争的突出问题，我们坚持有腐必反、有贪必肃，不断纯洁干部队伍，维护了党的形象，巩固了红色江山，赢得了确保党不变质、不变色、不变味的历史主动，赢得了党团结带领全体人民为强国建设、民族复兴伟业共同奋斗的历史主动。”\n故正确答案为B。","no":2,"missingImage":false},{"type":"question","qid":"15418870","cat":"新思想","stem":"习近平总书记指出，中国高度重视人工智能发展，积极推动互联网、大数据、人工智能和（    ）深度融合，培育壮大智能产业，加快发展新质生产力，为高质量发展提供新动能。","options":{"A":"网络经济","B":"民营经济","C":"实体经济","D":"数字经济"},"answer":"C","explanation":"本题考查理论与政策。\nC项正确，A、B、D三项错误，习近平总书记对发展人工智能高度关注，在题为：“‘人工智能+’，助力产业向新行——人工智能赋能高质量发展观察之一”的文章中指出：“中国高度重视人工智能发展，积极推动互联网、大数据、人工智能和实体经济深度融合，培育壮大智能产业，加快发展新质生产力，为高质量发展提供新动能。”\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"15418859","cat":"新思想","stem":"以习近平同志为核心的党中央始终把创新摆在国家发展全局的技心位置，对湖北科技创新寄予厚望，明确要求湖北要“打造具有全国影响力的科技创新新高地”，下列有关表述正确的有：\n①科技创新是湖北的最大优势、“金字招牌”\n②打造世界原始创新策源地、全国成果转化优选地、全国创新生态新高地\n③滚动实施“61020”全链条攻关，加快打造龙头引领、梯次发展的全域科技创新转化体系\n④以“71020”高校创新体系为牵引，加快攻克一批“卡脖子”关键核心技术","options":{"A":"①②","B":"①②③","C":"②③④","D":"①②③④"},"answer":"A","explanation":"本题考查时政热点。\n①正确，2025年1月6日，湖北省科技创新大会举行。省委书记王忠林出席会议并强调，科技创新是湖北的最大优势、“金字招牌”。\n②正确，③④错误，2025年2月，《划重点丨湖北“新春第一会”释放鲜明信号》在“三、怎样建支点 重点实施七大战略 整体提升七个能力”部分“（二）实施科创引领战略，整体提升支点的创新策源力”中指出：“打造世界原始创新策源地、全国成果转化优选地、全国创新生态新高地。做大做强科技力量矩阵，滚动实施‘61020’全链条攻关，加快攻克一批‘卡脖子’关键核心技术。以‘71020’高校创新体系为牵引，深化教育科技人才一体化改革，加快打造龙头引领、梯次发展的全域科技创新转化体系。”\n故①②表述正确。\n故正确答案为A。","no":4,"missingImage":false},{"type":"question","qid":"15418860","cat":"新思想","stem":"2025年，湖北省委对标习近平总书记把湖北省“加快建成中部地区崛起的重要战略支点”的要求，精要阐释了中部地区崛起的重要战略支点的内涵，指出湖北要建成支点，主攻方向是：","options":{"A":"整体提升发展能级、发展速度、发展质效和发展后劲","B":"打造长江经济带高质量发展的战略枢纽","C":"打造引领中部地区发展的重要动力源","D":"打造中国式现代化的区域样板"},"answer":"A","explanation":"本题考查时政热点。\nA项正确，B、C、D三项错误，2025年2月5日，湖北省加快建成中部地区崛起重要战略支点推进大会举行。省委书记王忠林指出，当前，湖北发展进入跨越赶超关键期、转型升级突破期、内生动力迸发期、枢纽地位重塑期、干事创业黄金期，整体提升支点建设的基础条件已经具备······支点建设，就是要以综合实力领先、科技创新先行、现代产业引领、枢纽地位凸显、改革开放示范、城乡区域协调、生态环境优渥、文化繁荣兴盛为显著特征，以整体提升发展能级、发展速度、发展质效、发展后劲为主攻方向，打造长江经济带高质量发展的战略枢纽、引领中部地区发展的重要动力源、中国式现代化的区域样板······\n故正确答案为A。","no":5,"missingImage":false},{"type":"question","qid":"15418874","cat":"时事政治","stem":"2025年湖北省政府工作报告在回顾2024年工作的基础上，提出今年经济社会发展的主要预期目标。下列关于2025年经济社会发展的主要预期目标，表述正确的有几项？\n①经济增长6%左右\n②城镇新增就业70万人以上\n③粮食产量继续保持500亿公斤以上\n④单位地区生产总值能耗完成“十四五”国家考核目标","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查时政热点。\n①②④正确，③错误，2025年湖北省政府工作报告在“二、2025年工作思路和重点任务”部分指出：“经济社会发展的主要预期目标是：经济增长6%左右；城镇调查失业率5.5%左右，城镇新增就业70万人以上；居民消费价格涨幅2%左右；居民收入增长与经济增长同步；粮食产量继续保持500亿斤以上；单位地区生产总值能耗完成‘十四五’国家考核目标。”\n故①②④表述正确，共3项。\n故正确答案为C。","no":6,"missingImage":false}],"count":6,"answerable":6,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"15418863","cat":"地理国情","stem":"《中共湖北省委关于深入贯彻党的二十届三中全会精神、以进一步全面深化改革推进中国式现代化湖北实践的决定》提出，必须牢牢把握高质量发展这个首要任务和共同富裕这个本质要求，正确处理            的关系，加快推动四化同步发展，补齐民生短板、抬高社会底板，缩小地区、城乡、收入差距，不断满足人民对美好生活的向往。\n①经济和社会\n②政府和市场\n③效率和公平\n④活力和秩序\n⑤发展和安全","options":{"A":"①②④⑤","B":"①③④⑤","C":"②③④⑤","D":"①②③④⑤"},"answer":"D","explanation":"本题考查时政热点。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议通过《中共中央关于进一步全面深化改革 推进中国式现代化的决定》（以下简称《决定》）。\n①②③④⑤正确，《决定》在“一、进一步全面深化改革、推进中国式现代化的重大意义和总体要求”部分指出：“（4）进一步全面深化改革的原则。总结和运用改革开放以来特别是新时代全面深化改革的宝贵经验，贯彻以下原则······坚持系统观念，处理好经济和社会、政府和市场、效率和公平、活力和秩序、发展和安全等重大关系，增强改革系统性、整体性、协同性。”\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"15418864","cat":"人文常识","stem":"科学家们正在研制一种无尘衣，这种衣服不但不会沾染灰尘，而且还有杀菌、防爆的性能。这是因为在某些工厂，工作人员的服装必须无尘、无菌、防爆。否则，产品质量就会下降，甚至还会因静电火花而发生爆炸。关于衣服沾上灰尘以及无尘处理技术，以下说法错误的是：","options":{"A":"空气中的灰尘是衣服脏污的主要来源之一","B":"合成纤维衣服受摩擦后易带电从而与空气灰尘相吸","C":"涂有镍、铜等金属薄膜的无尘服装产品重量不会增加","D":"不易带静电的棉、毛、粘胶等可以降低静电减少吸尘"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，空气中的灰尘确实是衣服脏污的主要来源之一。灰尘通过空气传播并附着在衣物表面，导致衣服变脏。\nB项正确，合成纤维衣服受摩擦后容易带静电，从而吸引空气中的灰尘颗粒。这是因为合成纤维具有较高的电阻率，摩擦时容易积累电荷。\nC项错误，涂有镍、铜等金属薄膜的无尘服装产品重量会有所增加。金属薄膜虽然薄，但其密度较大，因此会增加服装的整体重量。此外，金属涂层还可能影响服装的柔韧性和透气性。\nD项正确，不易带静电的天然纤维（如棉、毛、粘胶等）由于其较低的电阻率和较好的导电性，不容易积累静电，从而减少了静电吸附灰尘的可能性。天然纤维具有较好的导电性，能够有效释放静电，减少静电吸附灰尘的现象。\n本题为选非题，故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"15418869","cat":"科技常识","stem":"据报道，我国研制的氢氧旋转爆震火箭发动机，已完成了长时热试验，并取得了不错的成果，这次试验突破了氢氧旋转爆震燃烧室的热防护技术。关于氢氧旋转爆震火箭发动机，以下说法正确的是：","options":{"A":"这种发动机的结构更复杂，成本更高","B":"它的热效率略低于传统的火箭发动机","C":"它具有强大的推力但同时噪音比较高","D":"这是一种以液氢和液氧为燃料的发动机"},"answer":"D","explanation":"本题考查科技常识。\nA、B、C三项错误，D项正确，爆震燃烧是一种先进高效的燃烧方式，具有燃烧速率极快、自增压、熵增小、热循环效率高等特点。氢氧旋转爆震火箭发动机是一种以液氢和液氧为燃料的发动机，相较于传统火箭发动机，它具有结构更简单，成本更低，热效率更高，推力更大，噪音更低的特点。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"15418868","cat":"人文常识","stem":"下列关于我国东风-41洲际弹道导弹的说法错误的一项是：","options":{"A":"最大射程是1万公里","B":"采用的是钱学森弹道","C":"在飞行中途可自行二次点火","D":"在无固定发射架的情况下可以发射"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，D项正确，东风-41洲际战略核导弹是中国战略核力量的重要支撑。东风-41最大射程约14000公里，导弹长16.5米，重量超过60吨，可携带分导式核弹头，打击精度100米。除此之外，东风-41还有一个特点是灵活机动，在高速公路甚至篮球场上都可以进行发射。因此东风-41在无固定发射架的情况下也可以发射，摆脱了对固定发射架和预设阵地的依赖。\nB项正确，钱学森弹道，也称为助推-滑翔弹道，是一种结合了火箭助推和滑翔飞行的弹道模式，可以提高导弹的突防能力和射程。这种技术确实被应用于中国的某些导弹系统，如东风-17，也有报道介绍钱学森弹道应用于东风-41。\nC项正确，二次点火指的是导弹在飞行过程中重新启动发动机以调整轨道或增加射程，这对于多弹头分导和突防是有帮助的。东风-41在按照预定弹道飞行时，可以在飞行中途自行二次点火，令自身弹道产生不可预测的变动，这增加了敌方拦截的难度。\n本题为选非题，故正确答案为A。","no":10,"missingImage":false},{"type":"question","qid":"15418865","cat":"科技常识","stem":"对电器设备着火进行扑救，下列方法错误的是：","options":{"A":"对可能带电的发电机，使用干式灭火器","B":"电器设备上的绝缘油着火，使用干砂灭火","C":"对可能带电的电动机，使用二氧化碳灭火器","D":"对未隔断电源的变压器，使用高压水枪灭火"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，干式灭火器的灭火剂（如碳酸氢钠或磷酸铵盐干粉）不导电，能有效扑灭电气设备火灾，同时不会对设备造成太大损害，也能保障操作人员的安全。\nB项正确，绝缘油属于可燃液体，干砂可以覆盖在着火的绝缘油上，隔绝空气，从而达到灭火的目的，而且不会导电引发其他危险。\nC项正确，二氧化碳灭火器灭火时不会留下任何残留物质，不会对电动机等电气设备造成腐蚀或损坏，同时二氧化碳不导电，能在不切断电源的情况下安全灭火。\nD项错误，水是导电的，使用高压水枪对未隔断电源的变压器灭火，会导致电流通过水传导，可能造成人员触电伤亡，还会使变压器短路，甚至引发爆炸等更严重的事故。\n本题为选非题，故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"15418867","cat":"人文常识","stem":"下列诗句与其蕴含的科学原理，对应错误的一项是：","options":{"A":"“飞流直下三千尺，疑是银河落九天”——重力势能转化为动能","B":"“池水映明月，潭清疑水浅”——平面镜成像和光的直线传播","C":"“春江潮水连海平，海上明月共潮生”——天体引力对地球的影响","D":"“花气袭人知骤暖，鹊声穿树喜新晴”——温度升高时分子热运动加剧"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，水从高处流下，高度降低，重力势能减小，速度增大，动能增大，是重力势能转化为动能。\nB项错误，“池水映明月”是平面镜成像，原理是光的反射；“潭清疑水浅”是光的折射现象，而不是光的直线传播。光从水中斜射入空气中时，传播方向发生偏折，使得人眼看到的水底位置比实际位置浅。\nC项正确，‌潮汐现象‌是指地球上的海洋表面受到主要来自月球和太阳两种天体的引潮力作用而产生的周期性涨落现象。白天的海水涨落称为“潮”，晚上的涨落称为“汐”，合称为“潮汐”。‌\nD项正确，温度升高，花朵分泌的芳香油分子热运动加剧，扩散速度加快，所以能更快地闻到花香，体现了温度升高时分子热运动加剧。\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"15418882","cat":"地理国情","stem":"关于地理常识，下列表述正确的是：","options":{"A":"在东亚，夏季风从海洋吹向陆地，冬季风相反","B":"高原地区海拔较高，边缘陡峻，内部起伏较大","C":"温带海洋性气候的特点是四季分明，且雨量充沛","D":"世界人口主要集中在中高纬度的沿海和平原地区"},"answer":"A","explanation":"本题考查地理国情。\nA项正确，东亚季风是亚洲季风的重要组成部分，从成因上看是由海陆热力性质差异引起的。夏季陆地温度较高形成低压，故夏季风从副热带海洋吹向陆地（偏南风）；冬季陆地寒冷形成高压，故冬季风从高纬大陆吹向海洋（偏北风）。\nB项错误，高原通常是指海拔在500米以上，上方平坦开阔，周边以明显的陡坡为界，比较完整的大面积隆起区域。高原的特征是地面起伏小，海拔较高，边缘比较陡峭。\nC项错误，纬度\u003cimg data-k=\"13dfdc590b8b\">~\u003cimg data-k=\"86c1f89cc9f5\">之间的大陆西岸地区，全年盛行西风，受海洋暖湿气团的影响，年降水量一般在700~1010毫米之间，终年湿润，气温年变化较小，冬不冷夏不热，形成温带海洋性气候。欧洲大西洋沿岸、美洲太平洋沿岸等地区都属于这种气候。\nD项错误，世界绝大多数人口居住在中低纬度地区，其中气候温和、降水较多的平原和盆地，人口更为集中，特别是中低纬度的临海地带，如亚洲的东部和南部、欧洲的西部、北美洲和南美洲的东部，人口密度更高。\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"15418866","cat":"人文常识","stem":"关于人体系统和常见病对应错误的是：","options":{"A":"神经系统（大脑、脊髓等）——头痛、失眠","B":"呼吸系统（气管、支气管等）——感冒、肺炎","C":"循环系统（心脏、血管等）——高血压、冠心病","D":"内分泌系统（甲状腺、胰腺等）——糖尿病、过敏"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，神经系统是机体内对生理功能活动的调节起主导作用的系统，分为中枢神经系统和周围神经系统两大部分。其中中枢神经系统又包括脑和脊髓，周围神经系统包括脑神经和脊神经。神经系统疾病表现多样，其中常见症状包括头痛、失眠、晕厥、眩晕、共济失调和认知功能障碍等。\nB项正确，呼吸系统由呼吸道和肺组成，其中呼吸道包括鼻、咽、喉、气管和支气管等。感冒是一种常见的急性上呼吸道病毒性感染性疾病，多由病毒引起。肺炎是由细菌、病毒或其他微生物引起的肺部感染，这类感染主要侵犯肺泡，其中细菌性和病毒性肺炎最为常见。\nC项正确，循环系统是分布于全身各部的连续封闭管道系统，它包括心血管系统和淋巴系统。其中心血管系统由心脏、动脉、毛细血管和静脉等组成。高血压是血液在流动时对血管壁造成的压力值持续高于正常的现象。冠心病是由于冠状动脉粥样硬化使血管阻塞，从而导致心肌缺血缺氧而引起的心脏病。\nD项错误，内分泌系统是人体的重要机能调节系统，通常包括垂体、甲状腺、肾上腺、胰腺、性腺等器官。糖尿病是一种由胰岛素绝对或相对分泌不足以及利用障碍引发的，以高血糖为标志的慢性疾病。过敏是指当外来物质被识别为有害物质时，机体的免疫系统则立即做出反应，将其驱除或消灭。这是免疫应答发挥的保护作用，并不是内分泌系统的功能。\n本题为选非题，故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"15418876","cat":"人文常识","stem":"不属于我国国土空间“三条红线”的是：","options":{"A":"城镇开发边界","B":"建设用地红线","C":"永久基本农田","D":"生态保护红线"},"answer":"B","explanation":"本题考查理论与政策。\nA、C、D三项正确，B项错误，2019年11月1日，中共中央办公厅、国务院办公厅印发的《关于在国土空间规划中统筹划定落实三条控制线的指导意见》指出：“为统筹划定落实生态保护红线、永久基本农田、城镇开发边界三条控制线······”故“建设用地红线”不属于我国国土空间“三条红线”。\n本题为选非题，故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"15418877","cat":"人文常识","stem":"《中共中央 国务院关于促进民营经济发展壮大的意见》提出，民营经济是推进中国式现代化的生力军，各地区各部门要全面贯彻        的方针，引导民营经济人士弘扬企业家精神。","options":{"A":"服务、诚信、守法、担当、创新","B":"信任、团结、服务、引导、教育","C":"服务、引导、理解、宽容、帮助","D":"诚信、守法、宽容、教育、帮助"},"answer":"B","explanation":"本题考查理论与政策。\nB项正确，A、C、D三项错误，《中共中央 国务院关于促进民营经济发展壮大的意见》中“六、促进民营经济人士健康成长”部分指出：“全面贯彻信任、团结、服务、引导、教育的方针，用务实举措稳定人心、鼓舞人心、凝聚人心，引导民营经济人士弘扬企业家精神。”\n故正确答案为B。","no":16,"missingImage":false},{"type":"question","qid":"15418881","cat":"人文常识","stem":"下列不符合加快融入和主动服务全国统一大市场建设要求的做法是：\n①2024年“双11”起，某线上商城打破移动支付壁垒，允许用户选择跨平台支付方式\n②某省5个市要求农民工工资保证金经办机构，须在本地设立分支机构\n③某县要求所有经营主体必须在本地登记注册、经营，三年内不得迁出\n④某政府部门在招标采购中要求本地国有企业优先，外地企业不参与","options":{"A":"①②","B":"②③","C":"②③④","D":"①②③④"},"answer":"C","explanation":"本题考查理论与政策。\n2024年12月4日，国家发展改革委印发《全国统一大市场建设指引（试行）》，以下简称《指引》。\n①正确，互联网支付平台的互联互通，对推动全国统一大市场建设具有重要意义，通过整合不同平台的支付服务，进一步消除地域和平台限制，推动全国范围内资源的高效配置和流动，推动数字经济的繁荣发展，将有助于形成更加开放、公平竞争的市场环境，推动中国整体经济向高质量发展迈进。\n②③错误，《指引》在第七章“第一节 加力破除地方保护和市场分割”中指出：“第四十六条 各地区不得强制要求经营主体在本地登记注册、设立子公司、分公司、分支机构等，或者以在本地设立法人机构、进行产业配套、投资额纳入统计等作为申请相关扶持政策、开展相关业务、享受相关补贴的前提条件，不得在土地出让时违规设置竞买条件搞定向出让。”\n④错误，《指引》在第七章“第一节 加力破除地方保护和市场分割”中指出：“第四十七条 各地区、各部门不得在招标投标和政府采购中违法限定或者指定特定的专利、商标、品牌、零部件、原产地、供应商，违法设定与招标采购项目具体特点和实际需要不相匹配的资格、技术、商务条件，违法限定投标人所在地、组织形式、所有制形式，或者设定其他不合理的条件以排斥、限制经营者参与投标采购活动。”\n综上，②③④不符合要求。\n本题为选非题，故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"15418885","cat":"经济常识","stem":"关于经济常识，下列表述错误的是：","options":{"A":"短期国债、银行存款等货币型基金的风险低于混合型基金的风险","B":"银行针对不同信用等级的客户适用不同的贷款利率","C":"在国际经济贸易中，货物交易可适用银行保函","D":"在竞争市场，商品价格上涨，其销量一定下降"},"answer":"D","explanation":"本题考查经济常识。\nA项正确，投资于短期国债、银行存款等的货币型基金，安全性极高，又被称为“准储蓄产品”，基本没有风险。混合型基金是在投资组合中既有成长型股票、收益型股票，又有债券等固定收益投资的共同基金，其回报和风险要低于股票型基金，高于债券和货币型基金，是一种风险适中的理财产品。\nB项正确，银行针对不同信用等级的客户适用不同的贷款利率。信用好的客户通常可以获得较低的贷款利率，因为他们的违约风险较低。信用较差的客户需要支付更高的贷款利率，因为他们的违约风险较高，银行需要通过提高利率来补偿可能的风险损失。\nC项正确，银行保函又称“银行信用保证书”，银行作为保证人向受益人开立的保证文件。银行保证被保证人未向受益人尽到某项义务时，则由银行承担保函中所规定的付款责任。在国际贸易中，银行保函是一种常用的信用工具。它常被用于国际贸易的货款支付、履约担保等场景。\nD项错误，在竞争市场中，一般情况下商品价格上涨，其销量可能会下降，但这并不绝对。对于一些具有收藏价值、稀缺性或代表身份地位的商品，如限量版奢侈品、珍稀古玩等，即使价格上涨，由于其独特的属性，消费者对其需求可能依然旺盛，销量不一定下降。另外，在短期内如果消费者预期该商品价格还会继续大幅上涨，可能会出现抢购现象，导致价格上涨的同时销量也增加。\n本题为选非题，故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"15418899","cat":"法律常识","stem":"甲年满21周岁，刚从职业技术学院毕业，尚未就业。根据我国宪法和法律的规定，关于甲的权利义务，下列哪一选项是错误的？","options":{"A":"可以被征集服现役","B":"不需承担纳税义务","C":"有赡养扶助父母的义务","D":"不得被强制信仰宗教或者不信仰宗教"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国兵役法》第十五条第一款规定：“每年十二月三十一日以前年满十八周岁的男性公民，都应当按照兵役机关的安排在当年进行初次兵役登记。”因此，甲年满21周岁，可以被征集服现役。\nB项错误，根据《中华人民共和国宪法》第五十六条规定：“中华人民共和国公民有依照法律纳税的义务。”甲属于我国公民，因此，需承担纳税义务。\nC项正确，根据《中华人民共和国宪法》第四十九条第三款规定：“父母有抚养教育未成年子女的义务，成年子女有赡养扶助父母的义务。”甲年满21周岁，属于成年子女，因此，有赡养扶助父母的义务。\nD项正确，根据《中华人民共和国宪法》第三十六条第二款规定：“任何国家机关、社会团体和个人不得强制公民信仰宗教或者不信仰宗教，不得歧视信仰宗教的公民和不信仰宗教的公民。”因此，甲不得被强制信仰宗教或者不信仰宗教。\n本题为选非题，故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"15418898","cat":"地理国情","stem":"甲在云南旅游时，看到一个摊位售卖玉镯，觉得品质不错，准备购买。摊主报价10万元（实际进货价5万元，市场价格6万元），甲在试戴时不慎将玉镯摔断。关于甲的赔偿责任，下列说法正确的是：","options":{"A":"应赔偿摊主3万元","B":"应赔偿摊主5万元","C":"应赔偿摊主6万元","D":"应赔偿摊主10万元"},"answer":"C","explanation":"本题考查法律常识。\nA、B、D三项错误，C项正确，根据《中华人民共和国民法典》第一千一百八十四条规定：“侵害他人财产的，财产损失按照损失发生时的市场价格或者其他合理方式计算。”题中，甲不慎摔断玉镯的行为，构成侵权。侵害他人财产的，财产损失按照损失发生时的市场价格或者其他合理方式计算。因此，通常按照市场价格赔偿，应赔偿摊主6万元。\n故正确答案为C。","no":20,"missingImage":false},{"type":"question","qid":"15418890","cat":"法律常识","stem":"早年丧偶的老高，含辛茹苦养大儿子小高。根据我国相关法律的规定，小高如果实施了对老高不利的相关行为，则丧失继承权。以下会导致小高丧失继承权的情形是：","options":{"A":"小高曾经伪造遗嘱，但事后获得了老高的谅解","B":"小高曾经遗弃老高，但确有悔改表现获得原谅","C":"曾经被虐待的老高，仍在遗嘱中认可小高资格","D":"小高杀害老高未遂，但事后获得老高本人宽恕"},"answer":"D","explanation":"本题考查法律常识。\nA、B、C三项错误，D项正确，根据《中华人民共和国民法典》第一千一百二十五条第一、二款规定：“继承人有下列行为之一的，丧失继承权：（一）故意杀害被继承人；（二）为争夺遗产而杀害其他继承人；（三）遗弃被继承人，或者虐待被继承人情节严重；（四）伪造、篡改、隐匿或者销毁遗嘱，情节严重；（五）以欺诈、胁迫手段迫使或者妨碍被继承人设立、变更或者撤回遗嘱，情节严重。继承人有前款第三项至第五项行为，确有悔改表现，被继承人表示宽恕或者事后在遗嘱中将其列为继承人的，该继承人不丧失继承权。”A项中，小高曾经伪造遗嘱，但事后获得了老高的谅解，小高不丧失继承权。B项中，小高曾经遗弃老高，但确有悔改表现获得原谅，小高不丧失继承权。C项中，曾经被虐待的老高，仍在遗嘱中认可小高资格，小高不丧失继承权。D项中，小高杀害老高未遂，属于故意杀害被继承人的情形，即使事后获得老高本人宽恕，也应丧失继承权。\n故正确答案为D。","no":21,"missingImage":false},{"type":"question","qid":"15418902","cat":"人文常识","stem":"因需修建大型公共设施，某城中村地块被当地政府征地拆迁。村民甲为多获房产补偿款，送给负责核定面积的公职人员乙30万元，请其核定面积时多计面积，乙利用核定房产面积的职务便利帮助甲多登记面积200平方米，甲因此多获300万元的房产补偿款。下列说法错误的是：","options":{"A":"甲、乙二人构成共同贪污，贪污数额为300万元","B":"甲的贪污实际数额应认定为270万元","C":"甲不仅构成贪污罪，还构或行贿罪","D":"乙不仅构成贪污罪，还构成受贿罪"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，B项错误，根据《最高人民法院关于审理贪污、职务侵占案件如何认定共同犯罪几个问题的解释》第一条规定：“行为人与国家工作人员勾结，利用国家工作人员的职务便利，共同侵吞、窃取、骗取或者以其他手段非法占有公共财物的，以贪污罪共犯论处。”题中，甲与公职人员乙勾结，利用乙的职务便利骗取300万元的房产补偿款，二人构成贪污罪共犯，贪污数额为300万元。\nC项正确，根据《中华人民共和国刑法》第三百八十九条第一款规定：“为谋取不正当利益，给予国家工作人员以财物的，是行贿罪。”题中，甲为谋取不正当利益，给予国家工作人员乙以财物的，构成行贿罪。\nD项正确，根据《中华人民共和国刑法》第三百八十五条第一款规定：“国家工作人员利用职务上的便利，索取他人财物的，或者非法收受他人财物，为他人谋取利益的，是受贿罪。”题中，乙利用职务上的便利，非法收受甲的财物，为甲谋取利益的，构成受贿罪。\n本题为选非题，故正确答案为B。","no":22,"missingImage":false},{"type":"question","qid":"15418906","cat":"人文常识","stem":"与男友发生争执的醉酒女方某，将男友多件行李从十楼抛下。小区保安上门劝阻，被方某用棍子打成轻伤。民警欲将方某带离，方某又对民警撕咬、踢打，造成民警轻微伤。方某的行为触犯了哪些罪名？\n①寻衅滋事罪\n②故意毁坏财物罪\n③高空抛物罪\n④袭警罪\n⑤故意伤害罪\n⑥妨害公务罪","options":{"A":"①②⑥","B":"②③④","C":"③④⑤","D":"③④⑥"},"answer":"C","explanation":"本题考查法律常识。\n①错误，根据《中华人民共和国刑法》第二百九十三条规定：“有下列寻衅滋事行为之一，破坏社会秩序的，处五年以下有期徒刑、拘役或者管制：（一）随意殴打他人，情节恶劣的；（二）追逐、拦截、辱骂、恐吓他人，情节恶劣的；（三）强拿硬要或者任意损毁、占用公私财物，情节严重的；（四）在公共场所起哄闹事，造成公共场所秩序严重混乱的。纠集他人多次实施前款行为，严重破坏社会秩序的，处五年以上十年以下有期徒刑，可以并处罚金。”题中，方某行为不构成寻衅滋事罪。\n②错误，根据《中华人民共和国刑法》第二百七十五条规定：“故意毁坏公私财物，数额较大或者有其他严重情节的，处三年以下有期徒刑、拘役或者罚金；数额巨大或者有其他特别严重情节的，处三年以上七年以下有期徒刑。”题中，方某将男友多件行李从十楼抛下，属于实施故意毁坏财物的行为，但从题干中看不出数额较大或者有其他严重情节，因此不构成故意毁坏财物罪。\n③正确，根据《中华人民共和国刑法》第二百九十一条之二第一款规定：“从建筑物或者其他高空抛掷物品，情节严重的，处一年以下有期徒刑、拘役或者管制，并处或者单处罚金。”题中，方某将男友多件行李从十楼抛下的行为构成高空抛物罪。\n④正确，⑥错误，根据《中华人民共和国刑法》第二百七十七条第五款规定：“暴力袭击正在依法执行职务的人民警察的，处三年以下有期徒刑、拘役或者管制；使用枪支、管制刀具，或者以驾驶机动车撞击等手段，严重危及其人身安全的，处三年以上七年以下有期徒刑。”袭警罪是妨害公务罪中的特殊情形。题中，方某对正在依法执行职务的民警撕咬、踢打，构成袭警罪而非妨害公务罪。\n⑤正确，根据《中华人民共和国刑法》第二百三十四条第一款规定：“故意伤害他人身体的，处三年以下有期徒刑、拘役或者管制。”《最高人民法院 最高人民检察院关于常见犯罪的量刑指导意见（试行）》在“（七）故意伤害罪”规定：“1.构成故意伤害罪的，根据下列情形在相应的幅度内确定量刑起点：（1）故意伤害致一人轻伤的，在二年以下有期徒刑、拘役幅度内确定量刑起点。（2）故意伤害致一人重伤的，在三年至五年有期徒刑幅度内确定量刑起点。（3）以特别残忍手段故意伤害致一人重伤，造成六级严重残疾的，在十年至十三年有期徒刑幅度内确定量刑起点。依法应当判处无期徒刑以上刑罚的除外······”题中，方某用棍子将小区保安打成轻伤，构成故意伤害罪。\n故③④⑤正确。\n故正确答案为C。","no":23,"missingImage":false},{"type":"question","qid":"15418903","cat":"人文常识","stem":"程序正当原则要求行政机关实施具体行政行为时依照法定程序进行，不得违反回避、公开等规定，保证公民的合法权利不受公权力的侵害。下列违背这一原则的是：","options":{"A":"甲违反治安管理行为事实清楚，证据确凿，公安机关当场对其作出罚款200元的处罚决定","B":"公安机关对李某作出吊销许可证的治安管理处罚决定前，告知李某有权要求举行听证","C":"某市场监督管理局对当事人进行处罚听证，由非本案的调查人员担任听证主持人","D":"某区政府违法实施强制拆除行为造成居民损失，执行人员先行赔偿"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国行政处罚法》第五十一条规定：“违法事实确凿并有法定依据，对公民处以二百元以下、对法人或者其他组织处以三千元以下罚款或者警告的行政处罚的，可以当场作出行政处罚决定。法律另有规定的，从其规定。”选项中，甲的违法事实清楚证据确凿，公安机关可以当场作出处罚200元的决定。\nB项正确，根据《中华人民共和国治安管理处罚法》第九十八条规定：“公安机关作出吊销许可证以及处二千元以上罚款的治安管理处罚决定前，应当告知违反治安管理行为人有权要求举行听证；违反治安管理行为人要求听证的，公安机关应当及时依法举行听证。”选项中，公安机关对李某作出吊销许可证的治安管理处罚决定前，告知李某有权要求举行听证符合法定程序。\nC项正确，根据《中华人民共和国行政处罚法》第六十四条第四项规定：“听证应当依照以下程序组织：（四）听证由行政机关指定的非本案调查人员主持；当事人认为主持人与本案有直接利害关系的，有权申请回避；”选项中，某市场监督管理局由非本案的调查人员担任听证主持人符合听证程序。\nD项错误，根据《中华人民共和国国家赔偿法》第七条第一款规定：“行政机关及其工作人员行使行政职权侵犯公民、法人和其他组织的合法权益造成损害的，该行政机关为赔偿义务机关。”第二十三条第一款规定：“赔偿义务机关应当自收到申请之日起两个月内，作出是否赔偿的决定。赔偿义务机关作出赔偿决定，应当充分听取赔偿请求人的意见，并可以与赔偿请求人就赔偿方式、赔偿项目和赔偿数额依照本法第四章的规定进行协商。”选项中，某区政府违法实施强制拆除行为造成居民损失，区政府为赔偿义务机关且赔偿决定应由法定程序作出，不能由执行人员先行赔偿。\n本题为选非题，故正确答案为D。","no":24,"missingImage":false},{"type":"question","qid":"15418901","cat":"人文常识","stem":"下列属于具体行政行为的是：","options":{"A":"某市山洪灾害防御指挥部发布山洪灾害橙色预警","B":"某县发文要求坚决抵制各类低俗、恶俗婚闹行为","C":"某市烟草专卖局对一商店销售假烟行为进行罚款","D":"某省人民医院为本院新生儿开具《出生医学证明》"},"answer":"C","explanation":"本题考查法律常识。\n具体行政行为，是指行政主体依法就特定事项对特定的公民、法人和其他组织的权利义务作出的单方行政职权行为。\nA项错误，某市山洪灾害防御指挥部发布山洪灾害橙色预警的行为，并没有对特定主体的权利义务产生影响，不属于具体行政行为。\nB项错误，该县发文的行为，没有对特定主体的权利义务产生影响，只是一种呼吁、倡导，不属于具体行政行为。\nC项正确，某市烟草专卖局对一商店这一特定主体，作出要求其履行义务的行为，属于具体行政行为。\nD项错误，某省人民医院为本院新生儿开具《出生医学证明》属于一项制度规定，选项中并未明确说明是针对特定新生儿开具，不属于具体行政行为。\n故正确答案为C。","no":25,"missingImage":false}],"count":19,"answerable":19,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"13029536","cat":"逻辑填空","stem":"推动科技创新与产业创新深度融合，我们要促进专利从实验室到产业链的转化。专利找不到应用渠道，企业找不到合适成果，问题出在        上。专利法新设专利开放许可，专利人设置专利许可使用费，行政部门“广而告之”，有关单位付费即可获得实施许可。这一改革创新，降低了制度性交易成本，从“实验室”到“产业链”，成果转化            。\n依次填入画横线处的词语，最恰当的一项是：","options":{"A":"时效 任重道远","B":"对接 循序渐进","C":"审批 指日可待","D":"匹配 水到渠成"},"answer":"D","explanation":"第一空，根据“专利找不到应用渠道，企业找不到合适成果”可知，横线处应体现专利和应用渠道、企业和合适成果之间的对应出现问题。B项“对接”指互相接触、沟通，D项“匹配”指配合、搭配，均符合文意，保留。A项“时效”指在一定时间内能起的作用，C项“审批”指审查批准，均与文意不符，排除。\n第二空，根据“这一改革创新，降低了制度性交易成本”可知，横线处应体现改革创新后，成果转化进行得更为顺利之意。D项“水到渠成”比喻条件成熟，事情自然成功，符合文意，当选。B项“循序渐进”指按一定的顺序、步骤逐渐进步，与文意不符，排除。\n故正确答案为D。\n【文段出处】人民日报《知识产权“高分答卷”的启示》","no":26,"missingImage":false},{"type":"question","qid":"13029538","cat":"逻辑填空","stem":"月壤是月球的“外衣”。在严苛的环境下，月表（月球表面）的岩石发生机械破碎，同时        了太阳风、宇宙射线的注入，以及在陨石与微陨石的轰击、翻耕等作用下，形成了细如粉尘的一层月壤，其厚度可达数米至十几米。月壤的成因说明月壤是月球内外动力演化的“          ”，不仅记录了月球的形成和演化过程的线索，也富含地月系统撞击历史、空间环境、暴露历史等信息。\n依次填入画横线处的词语，最恰当的一项是：","options":{"A":"吸收 协奏曲","B":"阻断 传声筒","C":"叠加 留声机","D":"放大 试金石"},"answer":"C","explanation":"本题可从第二空入手。根据“不仅记录了月球的形成和演化过程的线索，也富含地月系统撞击历史、空间环境、暴露历史等信息”可知，月壤能够记录月球演化的信息，故横线处所填词语需体现记录的意思。C项“留声机”是一种能够记录和播放声音的设备，可引申为具有记录和保存信息的功能，符合文意，保留。A项“协奏曲”比喻多方协同合作，共同完成一项任务或达成一个目标，B项“传声筒”指那些照着别人的话说，自己毫无主见的人，D项“试金石”比喻精确可靠的检验方法，均与文意不符，排除。\n第一空，代入验证。根据“月表（月球表面）的岩石发生机械破碎，同时        了太阳风、宇宙射线的注入”可知，月表岩石发生机械破碎的同时又受到了太阳风、宇宙射线的影响。C项“叠加”指使一物与另一物占有相同位置并与之共存，符合文意，当选。\n故正确答案为C。\n【文段出处】“学习强国”学习平台 中国科学报社《科学家回信|胡森：探秘月球 开启深空探索新纪元》","no":27,"missingImage":false},{"type":"question","qid":"13029535","cat":"逻辑填空","stem":"推动以旧换新，消费者可以实现产品升级，家电等企业能扩大销量，回收端则能推动资源再生利用，无疑是            的举措。顺应消费新形势新趋势，以畅通循环为        ，逐步建立“去旧更容易、换新更愿意”的有效机制，以旧换新将惠及更多消费者，也将为经济发展注入更强动力。\n依次填入画横线处的词语，最恰当的一项是：","options":{"A":"皆大欢喜 契机","B":"一举多得 驱动","C":"变废为宝 引领","D":"各取所需 目标"},"answer":"B","explanation":"第一空，根据“无疑是”可知，前文是对横线处的解释说明，横线前指出以旧换新这一举措给“消费者”“企业”“回收端”均带来好处，故横线处应体现以旧换新给多方带来好处的意思。A项“皆大欢喜”指大家都很高兴，都很满意，B项“一举多得”指做一件事情而有多种收获，均可体现以旧换新给多方带来好处之意，保留；C项“变废为宝”指废物的再利用，把已经废弃的无用之物变为有用的好东西，强调对物品本身的转化利用，与文段语境不符，排除；D项“各取所需”指各自选取自己所需要的，而文段强调的是以旧换新这一举措给各方带来好处，与文意不符，排除。\n第二空，根据“逐步建立‘去旧更容易、换新更愿意’的有效机制”可知，横线处需体现通过畅通循环推动以旧换新有效机制的建立的意思。B项“驱动”指施加外力，使动起来，推动，符合文意，当选；A项“契机”指事物转化（多指向积极的方向）的关键，强调机会，而不是作为推动的力量，与文意不符，排除。\n故正确答案为B。\n【文段出处】人民网《更好畅通消费品以旧换新循环（人民时评）》","no":28,"missingImage":false},{"type":"question","qid":"13029539","cat":"逻辑填空","stem":"理论学习是个大课堂，基层实践也是个大课堂，党员、干部要用好这两个课堂，胸中纵有万卷，也要多到田间地头找灵感、察民情，切实解决学与做相脱节、知与行相脱离的问题。以烟火气        书卷气，有助于避免书生气、消除            的空洞感；以书卷气滋养烟火气，可以去除粗俗气，避免知识贫乏带来的无力感。\n依次填入画横线处的词语，最恰当的一项是：","options":{"A":"中和 言之无物","B":"反衬 高谈虚论","C":"托举 凌空蹈虚","D":"彰显 闭门造车"},"answer":"C","explanation":"第一空，根据“党员、干部要用好这两个课堂，胸中纵有万卷，也要多到田间地头找灵感、察民情，切实解决学与做相脱节、知与行相脱离的问题”可知，“烟火气”和“书卷气”之间需要达到平衡、互补的状态，故横线处词语应体现“烟火气”对“书卷气”的调节、支撑作用，A项“中和”指相对的事物互相抵消，失去各自的性质，C项“托举”指托起、举起，均符合文意，保留。B项“反衬”指从反面来衬托，“烟火气”“书卷气”并非正反两面，且两者并非衬托的关系，与文意不符，排除；D项“彰显”指鲜明地显示，与文意无关，排除。\n第二空，根据“多到田间地头找灵感、察民情”可知，横线处成语应体现消除因缺乏实践、脱离实际而产生的空洞感，C项“凌空蹈虚”形容不切合实际，极度危险，符合文意，当选。A项“言之无物”指文章或言论空空洞洞，没有实际内容，无法体现“缺乏实践”“脱离实际”，与文意不符，排除。\n故正确答案为C。\n【文段出处】人民日报《书卷气与烟火气（人民论坛）》","no":29,"missingImage":false},{"type":"question","qid":"13029542","cat":"逻辑填空","stem":"强强联合也好，            也罢，品牌联名归根结底是要互相“借光”，力图突破品牌原有的消费圈层，获得更广泛的关注，触达更多样的人群，展现更丰富的品牌特性，满足消费者        的需求，最终达到“1+1&gt;2”的效果。\n依次填入画横线处的词语，最恰当的一项是：","options":{"A":"抱团取暖 差异化","B":"同舟共济 大众化","C":"取长补短 现代化","D":"各取所需 理性化"},"answer":"A","explanation":"第一空，根据“强强联合也好······也罢，品牌联名归根结底是要互相‘借光’，力图突破品牌原有的消费圈层”可知，此处为相同句式引导的并列结构，故横线处所填成语应体现出品牌强强联合之外的另一种情况，A项“抱团取暖”比喻互助协作、积聚力量共度最困难的时期，B项“同舟共济”比喻团结互助，同心协力，战胜困难，均能体现出品牌通过合作实现互利共赢，符合文意，保留。C项“取长补短”意思是吸取别人的长处，来弥补自己的不足之处，文段重点并非强调品牌之间的长处和短处的互补，而是强调“互相‘借光’、突破圈层”，与文意不符，排除；D项“各取所需”意思是各自选取自己所需要的，仅体现利益交换，无法体现出互帮互助之意，与文意不符，排除。\n第二空，根据“突破品牌原有的消费圈层，获得更广泛的关注，触达更多样的人群，展现更丰富的品牌特性”可知，横线处所填词语应体现出品牌联名需满足消费者的个性化、多样化需求，A项“差异化”指在市场竞争中，企业通过提供与竞争对手不同的产品、服务或品牌形象，以吸引和满足特定消费者的需求，从而在市场中占据有利位置，可体现出品牌通过联名满足不同消费者对产品或服务的个性化需求，符合文意，当选。B项“大众化”指人群中普遍的现象或事物，品牌联名的目的是满足更多样化的需求，而非仅仅追求大众化，与文意相悖，排除。\n故正确答案为A。\n【文段出处】光明日报《IP联名并非万能钥匙》","no":30,"missingImage":false},{"type":"question","qid":"13029544","cat":"逻辑填空","stem":"AI技术不断进步，让科学家能借助一些模型来集思广益或编写代码。然而，这些模型仍然需要人工监督，或仅囿于执行特定任务。那么，能否利用基础模型将整个科研过程自动化呢？近日，研究人员创建了一种基于大语言模型的“AI科学家”：从阅读文献到提出新假设，再到尝试各种解决方案并撰写论文，“AI科学家”能            。\n填入画横线处的词语，最恰当的一项是：","options":{"A":"有条不紊","B":"驾轻就熟","C":"一气呵成","D":"一日千里"},"answer":"C","explanation":"根据前文提出的问题“能否利用基础模型将整个科研过程自动化呢”以及后文“研究人员创建了一种基于大语言模型的‘AI科学家’······撰写论文”可知，“AI科学家”是对前文关于科研过程能否实现自动化这一设问的具体举例论证，且由前文“从······到······再到······”的表述可知，横线处需体现“AI科学家”在完成整个科研过程时，无需外界干预，能够自动化、连贯且不间断地推进。C项“一气呵成”形容文章的气势首尾贯通，也形容完成整个工作的过程中不间断，不松懈，符合文意，当选。\nA项“有条不紊”形容做事、说话有条有理，丝毫不乱，侧重于做事有条理，未能体现“AI科学家”完成整个科研过程的连贯性，排除；\nB项“驾轻就熟”比喻对事情熟悉，办起来容易，与文意不符，排除；\nD项“一日千里”形容马跑得极快，也形容进步或发展迅速，侧重强调速度快，文段并未体现“AI科学家”完成整个科研过程的速度快，排除。\n故正确答案为C。\n【文段出处】科技日报《“AI科学家”登场 科研自动化时代来了？》","no":31,"missingImage":false},{"type":"question","qid":"13029545","cat":"逻辑填空","stem":"与传统建筑相比，绿色建筑显著减少了建造过程中的碳排放，还通过提高建筑质量、延长使用寿命，有效降低了        维护成本。绿色建筑的发展实践，不仅提升了居民的生活质量，也为城市的可持续发展作出了贡献，让绿色生活成为了            的现实。\n依次填入画横线处的词语，最恰当的一项是：","options":{"A":"定期 众望所归","B":"系统 司空见惯","C":"真实 来之不易","D":"长期 触手可及"},"answer":"D","explanation":"本题可从第二空入手，横线处与“现实”搭配，且根据“绿色建筑的发展实践，不仅提升了居民的生活质量”可知，横线处应体现绿色建筑提高了居民的生活质量，让绿色融入到了生活中之意，D项“触手可及”指近在手边，一伸手就可以接触到，形容距离极近，符合文意，且与“现实”搭配恰当，保留。A项“众望所归”指众人的信任、希望归向某人，或为众人所敬仰、期待，文段并未提及人们向往绿色生活，与文意不符，排除；B项“司空见惯”指某事常常见到，不足为奇，文段并未提及人们已经习惯绿色生活，与文意不符，且与“现实”搭配不当，排除；C项“来之不易”表示财物的取得或事物的成功是不容易的，文段并未提及绿色生活是否容易得到，与文意不符，排除。\n第一空，代入验证，横线处与“成本”搭配，且根据“绿色建筑显著减少了建造过程中的碳排放，还通过提高建筑质量、延长使用寿命”可知，横线处应体现出绿色建筑降低了维护方面的成本之意，D项“长期”指时间长的，期限长的，符合文意，且与“成本”搭配恰当，当选。\n故正确答案为D。\n【文段出处】光明日报《这些建筑会“呼吸”》","no":32,"missingImage":false},{"type":"question","qid":"13029537","cat":"逻辑填空","stem":"坚持从长远谋划当前，进行产业差异化布局，避免“一哄而上”，我们才能找准自身定位、发挥        优势。避免搞封闭小市场、自我小循环，依法查处不正当竞争行为，破除区域壁垒、打通循环堵点，充分发挥市场作用，才能在更大的经济循环中        发展空间。\n依次填入画横线处最恰当的一项是：","options":{"A":"技术\t赢得","B":"比较\t拓展","C":"区域\t争取","D":"核心\t打造"},"answer":"B","explanation":"第一空，搭配“优势”，根据“进行产业差异化布局，避免‘一哄而上’”“找准自身定位”可知，横线处所填词语应体现其优势是相对独特的，B项“比较”指对比几种同类事物的异同、高下，C项“区域”指土地的界划、地区区域自治，或国家管辖范围以外的海床和洋底及其底土，均可体现发挥独特优势之意，且“比较优势”和“区域优势”都是常见热词搭配，保留。A项“技术”指在劳动生产方面的经验、知识和技巧，也泛指其他操作方面的技巧，D项“核心”指中心、主要部分，均与文意不符，排除。\n第二空，搭配“发展空间”，根据“避免搞封闭小市场······充分发挥市场作用”“更大的经济循环”可知，横线处所填词语应体现扩大发展空间之意，B项“拓展”指开拓、扩展，可体现扩大发展空间之意，且与“发展空间”搭配恰当，当选。C项“争取”指力求获得或实现，侧重于努力获取，无法体现扩大发展空间之意，与文意不符，排除。\n故正确答案为B。\n【文段出处】人民日报《不搞“政策洼地”，精心打造“营商环境高地”》","no":33,"missingImage":false},{"type":"question","qid":"13029552","cat":"逻辑填空","stem":"从初稿成型“独上高楼，望尽天涯路”的志得意满，到解构后从头开始“为伊消得人憔悴”的            ，再到重新结构后“蓦然回首，那人却在灯火阑珊处”的浑然天成。从初稿到定稿，每一次都有一种“劫后余生”的庆幸，都有一种“            ”的欢欣。\n依次填入画横线处的词语，最恰当的一项是：","options":{"A":"寻寻觅觅 凤凰涅槃","B":"呕心沥血 旗开得胜","C":"困心衡虑 苦尽甘来","D":"匠心独运 云开见日"},"answer":"A","explanation":"第一空，根据横线前后三个阶段的描述可知，横线处所填成语应与“解构后从头开始‘为伊消得人憔悴’”语义对应，表达出创作过程中反复探寻、艰难思考的状态，A项“寻寻觅觅”指反复寻求探索，B项“呕心沥血”比喻费尽心血，多用来形容工作、事业、文艺创作等方面用心的艰苦，C项“困心衡虑”表示费尽心力，经过艰苦的思考，均符合文意，保留。D项“匠心独运”形容独特精巧的艺术构思，与文意不符，排除。\n第二空，根据“都有一种······都有一种······”可知，横线处所填成语应与“劫后余生”语义相近，“劫后余生”指经历灾难以后幸存下来的生命，故横线处应体现经历磨难后获得新生之意，A项“凤凰涅槃”指凤凰浴火燃烧，向死而生，在火中燃烧后重生重现并得到永生，符合文意，当选。B项“旗开得胜”比喻一举成功或事情一开始就取得成果，与文意不符，排除；C项“苦尽甘来”比喻艰苦的境况过去，美好的境况到来，置于此处程度过轻，且与“劫后余生”的对应不如“凤凰涅槃”更形象，排除。\n故正确答案为A。\n【文段出处】中国记协网《揭秘党报评论君“任仲平”》","no":34,"missingImage":false},{"type":"question","qid":"13029546","cat":"逻辑填空","stem":"办实事，不要        办“小事”，勿以善小而不为。一说办实事，有些干部就想着办大事，而不屑于办小事，其实许多看似            的小事，却与群众的工作、生活息息相关。\n依次填入画横线处最恰当的一项是：","options":{"A":"排斥 排难解纷","B":"轻忽 旁枝末节","C":"拒绝 一枝一叶","D":"低估 无关痛痒"},"answer":"B","explanation":"第一空，根据“勿以善小而不为”“不屑于办小事”可知，横线处所填词语应体现不重视、不认真对待“小事”之意，B项“轻忽”指不重视，不注意，轻率疏忽，符合文意，保留。A项“排斥”指使别的人或事物离开自己这方面，C项“拒绝”指不接受（请求、意见或赠礼等），此处强调的是不重视，而非完全排除在外、不接受，均程度过重，排除；D项“低估”指过低估计，若置于此处应直接表述为“低估小事”，与“办小事”搭配不当，且“低估”侧重于对事物的判断出现偏差，而文段重点在于态度上的不重视，与文意不符，排除。\n第二空，代入验证，搭配“小事”，B项“旁枝末节”比喻不重要的或次要的事情，与“小事”搭配恰当，当选。\n故正确答案为B。\n【文段出处】惠州纪检监察《年轻领导干部应加强党性的修养》","no":35,"missingImage":false},{"type":"question","qid":"13029554","cat":"语句表达","stem":"创新是艺术创作的灵魂。                    。微短剧完全可以避免陷入闪婚、逆袭、暴富等雷同剧情。以某情感剧为例，该剧立足于丰富的历史文化资源，以复刻桐叶扇和开展古城保护工作为背景展开故事线，打开了更大的叙事空间。善用现实主义的创作手法，充分利用文化资源、结合地域特色进行创作，微短剧的题材可以更丰富、故事可以更丰满。\n填入文段中画横线处最恰当的一项是：","options":{"A":"短小，并不意味着浅薄","B":"兼具活力和潜力，微短剧才有未来","C":"微短剧创作者，不能为了快速投放而粗制滥造","D":"文旅、AIGC、影视赛事等IP正成为微短剧的热门选题"},"answer":"A","explanation":"本题为语句填空题，横线位于文段中间，需结合前后文进行分析。横线前指出创新对艺术创作很重要，横线后表明微短剧可以避免陷入闪婚、逆袭、暴富等雷同剧情，之后以某情感剧为例进行论证，指出该剧打开了更大的叙事空间，尾句指出微短剧的题材可以更丰富、故事可以更丰满。结合前后文可知，横线处应体现微短剧在内容上不应都是闪婚、逆袭、暴富等雷同剧情，可以创作出更丰满的故事，A项，“短小”对应微短剧的特点，“并不意味着浅薄”对应“避免陷入闪婚、逆袭、暴富等雷同剧情”，当选。\nB项，“活力和潜力”表述不明确，文段重在强调避免陷入雷同的剧情，排除；\nC项“为了快速投放”、D项“文旅、AIGC、影视赛事”文段均未提及，无中生有，与后文衔接不当，排除。\n故正确答案为A。\n【文段出处】人民日报《推动微短剧朝精品化方向发展》","no":36,"missingImage":false},{"type":"question","qid":"13029555","cat":"片段阅读","stem":"人是科技创新最关键的因素。南仁东率团队建设“中国天眼”，坚持20余年、8000多个日夜，直到生命最后一刻，为工程按时保质建成作出卓越贡献。朱衍波带领团队钻研多年，成功研制出具有自主知识产权的空中飞行测试平台和机载导航接收机，又在各地辗转跋涉，完成北斗系统航空服务性能的空中飞行测试，助力北斗卫星导航系统登上国际民航舞台。大国重器凝聚着匠心巧思，也蕴含着感人至深的精神力量。正是因为广大一线科技工作者的前赴后继、接力攀登，才有大国重器的不断突破。\n以下哪句名言最能体现上述文字的主旨？","options":{"A":"君子抱仁义，不惧天地倾","B":"盖有非常之功，必待非常之人","C":"仁人之所以为事者，必兴天下之利","D":"天行健，君子以自强不息；地势坤，君子以厚德载物"},"answer":"B","explanation":"文段开篇提出“人是科技创新最关键的因素”这一观点，随后以南仁东率团队建设“中国天眼”、朱衍波带领团队助力北斗卫星导航系统登上国际民航舞台为例展开具体论述，最后再次强调，正是因为广大一线科技工作者的不懈努力，才有大国重器的不断突破。故文段重点强调“人”在科技创新中的核心作用，说明人才带来了大国重器的不断突破，B项“盖有非常之功，必待非常之人”意思是要建立不寻常的功业，必须依靠不寻常的人才，契合文段主旨，当选。\nA项，“君子抱仁义，不惧天地倾”指有德行的人仁德讲义气，不怕天翻地覆，侧重强调品行端正的人无所畏惧，与文段主旨不符，排除；\nC项，“仁人之所以为事者，必兴天下之利”意思是仁人处理事务的原则，一定是为天下兴利除害，侧重强调仁人在处理事务时遵循的原则，与文段主旨不符，排除；\nD项，“天行健，君子以自强不息；地势坤，君子以厚德载物”强调君子要力求进步、发奋图强、增厚美德、容载万物，与文段主旨不符，排除。\n故正确答案为B。\n【文段出处】人民日报《大国重器彰显大国底气（人民时评）》","no":37,"missingImage":false},{"type":"question","qid":"13029547","cat":"语句表达","stem":"，在年轻人的网络空间中，“共鸣”是一个关键词。此前，《我在故宫修文物》意外获得某网站网友集体致敬，在热闹的弹幕中，年轻人羡慕故宫里的日常、感叹文物人的专注、欣赏艺术品的精美······他们发现，传统与现代、“二次元”与“三次元”、手工时代与数字时代，竟也能穿越时空相遇，更何况那些“爱着你的爱”的同好者、“梦着你的梦”的同路人？专注与深入、探索与发现、执着与热爱，年轻人的网络世界，呈现出更为丰富的色彩。“共鸣”，带来分众化与圈层化，让网络的“长尾”覆盖更多维度。\n上述语段中，填入画横线处最恰当的一项是：","options":{"A":"网络新时代，新的关注、新的表达、新的状态不断涌现","B":"网络为年轻人开启了一扇窗，也开启了多元化的一道门","C":"技术让传播直观化的同时，也让传播去了中心化","D":"追求个性，也寻找共性；特立独行，也求其友声"},"answer":"D","explanation":"横线出现在文段开头，并且为首句中的分句，需结合首句及后文内容分析。文段开篇指出在年轻人的网络空间中 “共鸣” 是关键词之一，接着以《我在故宫修文物》在某网站受网友集体致敬为例，指出年轻人发现传统与现代等元素的融合，以及同好者、同路人的情感联系，随后又指出年轻人的网路世界是丰富多彩的，最后强调“共鸣” 带来分众化与圈层化，让网络覆盖更多维度。故文段主要强调年轻人在网络世界中既可以追求差异，也能够获得“共鸣”，横线处所填语句应是对后文的概括，对应D项。\nA项，“新的关注、新的表达、新的状态”只体现网络世界的新变化，衔接不当，排除；\nB项，“开启了多元化的一道门”只体现了“个性”，并未体现“共鸣”，衔接不当，排除；\nC项，“技术让传播直观化、去中心化”强调的是技术对传播的影响，与文段话题不一致，排除。\n故正确答案为D。\n【文段出处】《人民观点：怎样对话网络“新世代”——2016舆情观察与思考》","no":38,"missingImage":false},{"type":"question","qid":"13029543","cat":"语句表达","stem":"文学旨在通过文字构建丰富多彩的精神世界，影视则通过视听语言将抽象概念、感性思维变得可听与可感。                    ，我国拍摄于1958年的首部电视剧《一口菜饼子》就源自短篇小说。在媒介高度融合的今天，文学和影视艺术更是实现双向赋能的深度互动，读者、观众的双重身份得以自由切换，呈现迭代传播和多级扩散的图景。\n填入画横线部分最恰当的一项是：","options":{"A":"文学从不乏显丽的想象和传奇的故事","B":"文学经典经过影视改编可以再焕光彩","C":"文学与影视艺术具有天然的亲缘性","D":"每个时代都有专属的主流文学类型"},"answer":"C","explanation":"横线在文段中间，应联系上下文解题。文段首先指出文学通过文字构建精神世界，影视则通过视听语言将抽象概念和感性思维变得可听与可感，接着通过“我国首部电视剧《一口菜饼子》就源自短篇小说”这一例子，说明文学与影视之间的紧密联系。后文进一步指出，在媒介高度融合的今天，文学和影视艺术实现了双向赋能的深度互动，读者和观众的身份可以自由切换。故横线处应填入一个能够概括文学与影视艺术之间紧密关系的句子，C项“亲缘性”形象地表达出了两者的紧密关系，当选。\nA项，“文学从不乏显丽的想象和传奇的故事”未包含文段重点论述的话题“影视艺术”，无法与前后文构成衔接，排除；\nB项，“文学经典经过影视改编可以再焕光彩”虽然提到了文学与影视的关系，但仅侧重于影视改编对文学的单方面影响，表述片面，排除；\nD项，“每个时代都有专属的主流文学类型”与文段讨论的文学与影视的关系无关，排除。\n故正确答案为C。\n【文段出处】光明网《文学与影视双向赋能相融共生》","no":39,"missingImage":false},{"type":"question","qid":"13029540","cat":"片段阅读","stem":"皮肤是一种散射介质，像雾一样散射光线，因此是不透明的。散射会导致光在穿过身体组织时改变路径，而各组织的折射率存在差异。一些能吸收光线的染料可在广泛折射率范围内有效地引导光线均匀通过，从而使生物组织变得透明。当柠檬黄溶解在水中并被组织吸收时，其分子结构完美匹配折射率，可防止光线散射，进而实现透明效果。研究发现在活体小鼠头部和腹部皮肤上涂抹水与柠檬黄的混合液，能让这些区域变得透明。该过程在动物试验中可逆，有望用于确定损伤部位、监测消化系统疾病、识别癌症等，在广泛的医学诊断中发挥重要作用。\n根据这段文字，以下说法正确的是：","options":{"A":"研究发现柠檬黄是一种能够散射光线的物质","B":"一些吸光染料可防止光在皮肤组织中的散射","C":"人类皮肤涂上柠檬黄后就能够变成透明","D":"透明皮肤诊断技术已经广泛应用于动物状态试验"},"answer":"B","explanation":"A项，根据“皮肤是一种散射介质，像雾一样散射光线，因此是不透明的”可知，文段说的是皮肤可以散射光线，而非柠檬黄能够散射光线，偷换概念，排除；\nB项，根据“一些能吸收光线的染料可在广泛折射率范围内有效地引导光线均匀通过，从而使生物组织变得透明”可知，该项表述正确，当选；\nC项，根据“研究发现在活体小鼠头部和腹部皮肤上涂抹水与柠檬黄的混合液，能让这些区域变得透明”可知，文段说的是在活体小鼠身上进行的试验，并未提及人类皮肤涂上柠檬黄后就能变成透明，无中生有，排除；\nD项，根据“该过程在动物试验中可逆，有望用于······在广泛的医学诊断中发挥重要作用”可知，文中说的是“有望”用于广泛的医学诊断，而非“已经”广泛应用于动物状态试验，表述错误，排除。\n故正确答案为B。\n【文段出处】科技日报《吸光染料把动物皮肤变成“透明窗”》","no":40,"missingImage":false},{"type":"question","qid":"13029541","cat":"片段阅读","stem":"面对用地紧张、交通拥堵等“城市病”，地下空间在一定程度上打开了城市生长的新维度。同时，地下空间具有密闭性和环境稳定性，有利于构建综合性地上地下一体化防灾体系，通过合理开发和利用，成为构建韧性城市的关键。能够有效减轻“大城市病”的症状，促进资源的高效集约利用，打造环境友好型城市，推动城市向高质量发展迈进。\n以上文字旨在说明：","options":{"A":"怎样去提高城市治理的水平","B":"城市地下空间特点和作用","C":"发展城市地下空间的必要性","D":"地下城市生长的全新维度"},"answer":"C","explanation":"文段开篇介绍，在用地紧张、交通拥堵等“城市病”的背景下，开发城市地下空间成为开辟城市生长新维度的有效举措，随后通过并列关联词“同时”，指出地下空间具有密闭性、环境稳定性，合理开发和利用有利于构建韧性城市，尾句进一步阐述发展城市地下空间对城市发展所带来的诸多益处。故全文围绕主题词“城市地下空间”论述，意在通过论述“城市地下空间”在应对“城市病”方面所发挥的积极作用，强调发展城市地下空间的必要性，对应C项。\nA项“提高城市治理的水平”、D项“地下城市”，均偏离文段主题词“城市地下空间”，排除；\nB项，文段阐述城市地下空间的特点和作用，是为了强调发展城市地下空间对于城市发展的必要性和重要性，而非简单介绍，故该项偏离了文段的核心主旨，排除。\n故正确答案为C。\n【文段出处】光明日报《挖潜地下空间，城市“里子”更出彩》","no":41,"missingImage":false},{"type":"question","qid":"13029548","cat":"片段阅读","stem":"众所周知，地球两极覆盖着冰盖。在全球变暖背景下，北极冰盖和北极海冰加速消融，而南极冰冻圈消融幅度相对较小，仅在近年出现较大幅度消融。目前，南极冰盖体量是北极的10倍，如果南极冰盖融化速度和北极的不一样，它们形成的中间热力差就非常大，这种不对称的冰盖演化对包括全球温度和海平面变化在内的全球气候的影响被严重低估。\n最适合做这段文字标题的是：","options":{"A":"南北极与地球气候系统响应过程间的关系","B":"定量评估两半球冰盖不对称融化刻不容缓","C":"两极冰盖不对称演化对全球气候影响重大","D":"研究全球气候变暖背后深层原因的新视角"},"answer":"C","explanation":"文段开篇指出全球变暖背景下，北极冰盖和海冰加速消融，南极冰冻圈消融幅度相对较小，接着说明南极冰盖体量远大于北极，两者融化速度不同形成的热力差很大，最后强调这种不对称的冰盖演化对全球气候的影响被严重低估。文段重在强调两极冰盖不对称演化对全球气候产生的影响，C项符合文意，当选。\nA项，文段重在强调两极冰盖不对称演化对全球气候的影响，而非响应过程，与文意不符，排除；\nB项，文段重在强调这种不对称演化对全球气候的影响，而不是强调评估的紧迫性，是对文段的过度推断，排除；\nD项，“全球气候变暖背后深层原因的新视角”文段并未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】科技日报《两极冰盖不对称演化 对全球气候影响重大》","no":42,"missingImage":false},{"type":"question","qid":"13029556","cat":"片段阅读","stem":"没有全民科学素质普遍提高，就难以建立起高素质创新大军，难以实现科技成果快速转化。当前，新一轮科技革命和产业变革正在重构全球创新版图、重塑全球经济结构。无论是加速以人工智能、量子信息等为代表的新一代信息技术应用，为全球可持续发展注入动能，还是面对生命健康、气候变化、粮食安全等全球性挑战，科技创新扮演的角色越来越重要。厚植科学沃土，筑牢创新根基，加强科普工作，推动科学素质建设越发关键。\n这段文字意在强调：","options":{"A":"科学素质建设是实现创新发展的基础性工作","B":"科技成果转换需要营造全社会科技创新氛围","C":"应着力推动科学素质建设向深度和广度拓展","D":"创新成果共享为提升科学素质创造有利条件"},"answer":"A","explanation":"文段开篇指出全民科学素质提高对建立高素质创新大军、实现科技成果转化有重要作用，强调了科学素质对科技创新的重要性，接下来通过“当前”论述背景，指出新一轮科技革命和产业变革的现状，强调科技创新在当下越来越重要，尾句通过“关键”再次强调，“厚植科学沃土，筑牢创新根基”“科学素质建设”十分重要，故文段论述的核心话题为“科学素质建设”对“科技创新”的重要作用，对应A项。\nB项，“科技成果转换”仅对应文段首句中部分内容，表述片面，且缺乏文段核心话题“科学素质建设”，排除；\nC项，“推动科学素质建设向深度和广度拓展”文段并未提及，无中生有，且缺乏文段核心话题“科技创新”，排除；\nD项，文段主要论述“科学素质”对“创新”的作用，并未论述“创新成果共享”对“科学素质”的作用，逻辑错误，排除。\n故正确答案为A。\n【文段出处】人民日报《提升科学素质 赋能共同发展》","no":43,"missingImage":false},{"type":"question","qid":"13029549","cat":"语句表达","stem":"①汉字发展成二维方块式形态，适应了这种思维模式，也符合审美的需求\n②这些笔画在组合时遵循一定规律和比例，使每个汉字的内部空间都被充分利用\n③成熟汉字的方正特点主要体现在字形结构和布局上，由笔画和部件的调整配合来实现\n④笔画之间既不过于拥挤也不过于松散，看上去美观和谐，能达到最佳的视觉效果\n⑤在古人的意识中，天是圆的，地是方的，所以有“天圆地方”的说法，人为制造的空间也大多呈方形\n⑥汉字的基本笔画包括横、竖、撇、捺、点、提等\n将以上句子重新排序，语序最恰当的一项是：","options":{"A":"⑥④②⑤①③","B":"⑥③④⑤①②","C":"⑤④①③②⑥","D":"⑤①③⑥②④"},"answer":"D","explanation":"对比选项，确定首句。⑤句指出在古人的意识中有“天圆地方”的说法，人为制造的空间大多呈方形，⑥句指出汉字基本笔画的包括内容，均可作首句，保留。\n观察题干，①句中“汉字发展成二维方块式形态，适应了‘这种思维模式’”，出现指代词，①句前的话题需包含“思维模式”的相关话题。选项中①句前为④⑤两句，⑤句中“在古人的意识中”体现出的是古人的一种观念、意识，是一种思维模式，⑤①两句可捆绑，A、B、D三项保留。④句并无思维模式的相关话题，无法与①句构成指代关系，排除C项。\n继续观察题干。②句出现指代词“这些”，根据“笔画”可知，前文应对笔画的相关内容进行描述。观察选项，②句前为①④⑥三句，⑥句“汉字的基本笔画包括······等”为笔画种类的相关描述，可与②句捆绑，D项当选。①句未提到笔画的相关内容，与②句捆绑不合适，排除B项。④句强调笔画组合之后达到的视觉效果，而②句提到笔画在组合时遵循一定规律和比例，按照逻辑顺序，应先论述笔画的组合，再论述笔画组合后达到的视觉效果，故④句应在②句之后，排除A项。\n故正确答案为D。\n【文段出处】光明日报《稳定庄重的方块字——汉字形态蕴含的审美意识和精神品格》","no":44,"missingImage":false},{"type":"question","qid":"13029551","cat":"片段阅读","stem":"过去是资源、活动出海，如今是服务、标准出海，“慕课出海”正从“1.0”迈向“2.0”，完善与国外高校的课程共享、学分互认机制，探索微证书项目等更具吸引力的学习成果转化形式；牵头成立世界慕课与在线教育联盟，与全球多家知名高校和在线教育机构合作搭建课程引进与输出双向沟通渠道······中国慕课出海的过程，也是中国主动扩大教育开放、推动全球高等教育数字化发展的过程。对一个国家而言，教育是发展的基石。立己达人、携手同行现代化之路，是中国的追求。授人以鱼不如授人以渔。从“出海远航”的中国慕课，到独具特色的“鲁班工坊”，再到精准服务当地发展的“丝路学院”，中国带去的不仅有具体的项目，还有发展的后劲。“慕课出海”折射的，是独特的中国智慧。\n最适合作为上述文段标题的是：","options":{"A":"中国慕课出海更“出彩”","B":"推动知识传播“跨山越海”","C":"“慕课出海”折射中国智慧","D":"努力拓展国际教育合作版图"},"answer":"C","explanation":"文段开篇先介绍了“慕课出海”从“1.0”转变到“2.0”及具体表现，接着指出中国慕课出海的过程是中国主动扩大教育开放、推动全球高等教育数字化发展的过程，以及中国在教育方面追求立己达人、携手同行现代化之路，最后，文段通过“从······到······再到······”对前文进行总结，故文段重点强调“慕课出海”体现了中国智慧，对应C项。\nA项，“中国慕课出海更‘出彩’”虽然提到了“慕课出海”，但没有突出“中国智慧”这一核心话题，偏离文段核心，排除；\nB、D两项，均没有涉及“慕课出海”和“中国智慧”的核心话题，偏离文段核心，排除。\n故正确答案为C。\n【文段出处】人民日报《“鱼渔双授”的中国智慧》","no":45,"missingImage":false}],"count":20,"answerable":20,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"11542763","cat":"数学运算","stem":"一辆汽车从A地开往B地，匀速行驶60%的路程后开始匀加速，又用了1小时到达B地，且到达时的速度最快，是出发时的2倍。问全程用了多长时间？","options":{"A":"3小时","B":"3小时15分钟","C":"3小时25分钟","D":"3小时30分钟"},"answer":"B","explanation":"由题意可知，匀速行驶路程∶匀加速行驶路程=60%∶（1-60%）=3∶2，设匀速行驶路程为3S，则匀加速行驶路程为2S。设出发时速度为v，则到达时速度为2v，根据匀变速运动的平均速度\u003cimg data-k=\"8517dc54f21e\">，可得匀加速行驶的平均速度\u003cimg data-k=\"ba893588a521\">，根据路程=速度×时间，可列式：1.5v×1=2S，化简得：\u003cimg data-k=\"b6340fad7108\">。则匀速行驶路程所用时间\u003cimg data-k=\"dc7343a0dad6\">小时，全程用时为\u003cimg data-k=\"9f463ac550e9\">小时=3小时15分钟。\n故正确答案为B。","no":46,"missingImage":false},{"type":"question","qid":"11542773","cat":"数学运算","stem":"一种商品按标价打八折出售时，每件利润比打七折出售时高40%；比打六五折出售时高54元。问该商品标价每件多少元？","options":{"A":"340","B":"350","C":"360","D":"370"},"answer":"C","explanation":"设该商品每件进价为x元，标价为y元，根据题意可列式：（0.8y-x）-（0.65y-x）=54，化简可得：0.15y=54，解得：y=360，即该商品标价每件360元。\n故正确答案为C。","no":47,"missingImage":false},{"type":"question","qid":"11542769","cat":"数学运算","stem":"食品厂要加工一批原材料，可由人工手动或机器（每台机器需要1人操作）来完成。如果由25个人、5台机器合作，则7小时30分完成；如果新增3台机器，则6小时完成。问机器的效率是人工效率的多少倍？","options":{"A":"\u003cimg data-k=\"c9cfeea291da\">","B":"5","C":"\u003cimg data-k=\"282f18917151\">","D":"\u003cimg data-k=\"7b063c8fdc20\">"},"answer":"D","explanation":"方法一：赋值加工总量为7.5和6的公倍数45，设每个人的效率为a，每台机器的效率为b，根据题意可列式：\u003cimg data-k=\"669ace9e86e1\">\u003cimg data-k=\"f755c5813b3c\">······①，\u003cimg data-k=\"981c8b58f5d7\">\u003cimg data-k=\"4c16cab81ca9\">\u003cimg data-k=\"ec8122afb256\">······②，联立①②两式，解得：\u003cimg data-k=\"55147c0e77fa\">，\u003cimg data-k=\"a8d077cd864b\">，则题目所求\u003cimg data-k=\"f6b9c3a492db\">倍。\n方法二：赋值每个人的效率为1，每台机器的效率为x，根据总加工量不变可列式：\u003cimg data-k=\"6692ab04321d\">\u003cimg data-k=\"d62120f76f56\">，解得\u003cimg data-k=\"ef864d72c71b\">，则题目所求\u003cimg data-k=\"851a99e59a91\">倍。\n故正确答案为D。","no":48,"missingImage":false},{"type":"question","qid":"11542761","cat":"数学运算","stem":"甲、乙、丙三个单位共有100多名职工，甲单位职工比乙单位多14%；丙单位职工比甲单位少3人。问三个单位共有多少人？","options":{"A":"158","B":"159","C":"160","D":"161"},"answer":"D","explanation":"根据甲单位职工比乙单位多14%，可得\u003cimg data-k=\"41403a77a1c9\">\u003cimg data-k=\"b3fa9d8df3d7\">，因三个单位共有100多名职工，故乙单位职工数只能为50人，甲单位职工数为57人。丙单位职工比甲单位少3人，则丙单位职工数为57-3=54人，三个单位共有50+57+54=161人。\n故正确答案为D。","no":49,"missingImage":false},{"type":"question","qid":"11542758","cat":"数学运算","stem":"某村一场网络直播共销售352单，卖出762盒特色农产品。已知每单最多购买3盒，且购买3盒的订单正好比购买1盒的订单多50%。问购买了2盒产品的订单有多少笔？","options":{"A":"62","B":"72","C":"82","D":"92"},"answer":"A","explanation":"设购买1盒的订单有2x笔，购买2盒的订单有y笔，因购买3盒的订单正好比购买1盒的订单多50%，则购买3盒的订单为\u003cimg data-k=\"542eb4761529\">笔。已知该场直播共销售352单，卖出762盒特色农产品，可列方程组：2x+y+3x=5x+y=352······①，\u003cimg data-k=\"a2e72126543c\">\u003cimg data-k=\"4fe6a8cc85fc\">······②，②-2×①，解得x=58，再代入①式，解得y=62，即购买了2盒产品的订单有62笔。\n故正确答案为A。","no":50,"missingImage":false},{"type":"question","qid":"11542765","cat":"数学运算","stem":"某水果商根据草莓的品质，把草莓分装为精品、高质、普通三种包装，单价分别为45元/袋、30元/袋、20元/袋。某天上午，该水果商共售出15袋草莓（每种包装的草莓均有售出），销售额为400元，则售出的精品与普通包装的袋数之比是：","options":{"A":"1：3","B":"1：4","C":"2：3","D":"2：5"},"answer":"B","explanation":"设精品、高质、普通三种包装的草莓分别售出x袋、y袋、z袋。根据题意可列式：x+y+z=15······①，45x+30y+20z=400，即9x+6y+4z=80······②，①×6-②可得：2z-3x=10，根据奇偶特性，2z与10均为偶数，则3x必为偶数，即x为偶数。由于每种包装的草莓均有售出，即x&gt;0，当x=2时，解得z=8，此时y=5，满足题意；当x取其他值时，y均不符合题意。故售出精品包装2袋，普通包装8袋，售出的精品与普通包装的袋数之比为1：4。\n故正确答案为B。","no":51,"missingImage":false},{"type":"question","qid":"11542768","cat":"数学运算","stem":"已知有黑白棋子共30枚，从中随机选择3枚棋子，仅选出2枚黑棋子的概率是仅选出1枚黑棋子概率的3倍。问黑棋子比白棋子多多少枚？","options":{"A":"8","B":"10","C":"12","D":"14"},"answer":"D","explanation":"设黑棋子有n枚，则白棋子有（30-n）枚。根据题意可知，选出的3枚棋子中，“2黑1白”的概率是“1黑2白”概率的3倍，由此可列方程：\u003cimg data-k=\"bc3d7b197c56\">，整理后得\u003cimg data-k=\"9bafbbd1284d\">，解得n=22，即黑棋子有22枚，白棋子有30-22=8枚，故黑棋子比白棋子多22-8=14枚。\n故正确答案为D。","no":52,"missingImage":false},{"type":"question","qid":"11542782","cat":"数学运算","stem":"3家企业在校招活动中共收到476份简历。若向3家企业均投出简历的学生人数是仅向2家企业投出简历人数的1.5倍，且仅向1家企业投出简历的学生人数比简历总数的一半少9。问总共有多少名学生投出了简历？","options":{"A":"364","B":"347","C":"324","D":"247"},"answer":"C","explanation":"设仅向2家企业投出简历的学生人数为2x名，则向3家企业均投出简历的学生人数为\u003cimg data-k=\"55bb41785752\">名。根据题意可得，仅向1家企业投出简历的学生人数\u003cimg data-k=\"9697433838df\">名，则\u003cimg data-k=\"629f80c89561\">，解得x=19。根据三集合常识型公式：满足一项+满足两项+满足三项=总数-都不，可列式：229+2x+3x=总人数=324，则总共有324名学生投出了简历。\n故正确答案为C。","no":53,"missingImage":false},{"type":"question","qid":"11542793","cat":"数学运算","stem":"一瓶浓度为n%的酒精中加入1千克水，浓度变为0.6n%；又加入1.5千克浓度为50%的酒精后，浓度变为0.9n%。问n的值在以下哪个范围内？","options":{"A":"\u003cimg data-k=\"cf029bbd9285\">","B":"\u003cimg data-k=\"2b8b2f7f42e6\">","C":"\u003cimg data-k=\"cba8dc48eeda\">","D":"
