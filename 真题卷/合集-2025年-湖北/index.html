<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">行测真题模拟考场<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>
<div class="toast" id="toast"></div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",imgBase:"",papers:[{"slug":"2025-湖北","title":"2025年湖北省公务员录用考试《行测》题（网友回忆版）","year":"2025","group":"湖北","modules":[{"label":"政治理论","items":[{"type":"question","qid":"13504477","cat":"新思想","stem":"习近平总书记指出，现代化产业体系是现代化国家的物质技术基础，关于现代化产业体系建设，下列表述正确的有几项？\n①坚持把发展经济的着力点放在国有企业上\n②推动制造业高端化、智能化、绿色化发展\n③推动战略性新兴产业融合集群发展\n④推动现代服务业同先进制造业、现代农业深度融合\n⑤优化基础设施布局、结构、功能和系统集成，构建现代化基础设施体系","options":{"A":"5项","B":"4项","C":"3项","D":"2项"},"answer":"B","explanation":"本题考查理论与政策。\n②③④⑤正确，①错误，二十大报告在“四、加快构建新发展格局，着力推动高质量发展”中指出“（二）建设现代化产业体系。坚持把发展经济的着力点放在实体经济上，推进新型工业化，加快建设制造强国、质量强国、航天强国、交通强国、网络强国、数字中国。实施产业基础再造工程和重大技术装备攻关工程，支持专精特新企业发展，推动制造业高端化、智能化、绿色化发展······推动战略性新兴产业融合集群发展，构建新一代信息技术、人工智能、生物技术、新能源、新材料、高端装备、绿色环保等一批新的增长引擎。构建优质高效的服务业新体系，推动现代服务业同先进制造业、现代农业深度融合······优化基础设施布局、结构、功能和系统集成，构建现代化基础设施体系。”故“发展经济的着力点放在国有企业上”说法错误。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"13504664","cat":"新思想","stem":"习近平总书记指出，我们要坚定不移走中国特色社会主义政治发展道路，坚持和完善我国根本政治制度、基本政治制度、重要政治制度，不断健全人民当家作主制度体系。以下哪项是我国根本政治制度：","options":{"A":"党领导的多党合作和政治协商制度","B":"人民代表大会制度","C":"民族区域自治制度","D":"基层群众自治制度"},"answer":"B","explanation":"本题考查理论与政策。\nB项正确，A、C、D三项错误，坚持中国特色社会主义制度，就是要坚持把根本政治制度、基本政治制度、基本经济制度和其他各方面机制体制有机结合起来。我国的根本政治制度是人民代表大会制度；我国的基本政治制度是中国共产党领导的多党合作和政治协商制度、民族区域自治制度以及基层群众自治制度。\n故正确答案为B。","no":2,"missingImage":false},{"type":"question","qid":"13504475","cat":"新思想","stem":"习近平总书记强调，要坚持城乡融合发展，畅通城乡要素流动。关于城乡融合发展，下列说法正确的有几项？\n①城乡融合发展是中国式现代化的必然要求\n②推进以乡镇为重要载体的新型城镇化建设，发展各具特色的乡镇经济\n③发展新型农村集体经济，构建产权明晰、分配合理的运行机制\n④完善覆盖农村人口的常态化防止返贫致贫机制\n⑤允许农户合法拥有的住房通过出租、入股、合作等方式盘活利用","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议通过《中共中央关于进一步全面深化改革 推进中国式现代化的决定》（以下简称《决定》）。\n①正确，《决定》在“六、完善城乡融合发展体制机制”部分指出：“城乡融合发展是中国式现代化的必然要求。必须统筹新型工业化、新型城镇化和乡村全面振兴，全面提高城乡规划、建设、治理融合水平······”\n②错误，2024年11月4日至6日，习近平总书记在湖北考察时指出，推进以县城为重要载体的新型城镇化建设，发展各具特色的县域经济。故“乡镇经济”说法错误。\n③正确，《决定》在“六、完善城乡融合发展体制机制”部分指出：“（21）巩固和完善农村基本经营制度······发展新型农村集体经济，构建产权明晰、分配合理的运行机制，赋予农民更加充分的财产权益。”\n④正确，《决定》在“六、完善城乡融合发展体制机制”部分指出：“（22）完善强农惠农富农支持制度······完善覆盖农村人口的常态化防止返贫致贫机制，建立农村低收入人口和欠发达地区分层分类帮扶制度。”\n⑤正确，《决定》在“六、完善城乡融合发展体制机制”部分指出：“（23）深化土地制度改革······允许农户合法拥有的住房通过出租、入股、合作等方式盘活利用。”\n故正确的有①③④⑤，共4项。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"13504476","cat":"时事政治","stem":"习近平总书记指出，人心是最大的政治，统一战线是凝聚人心、汇聚力量的强大法宝，关于统一战线，下列表述正确的是：\n①统战工作的本质要求是大团结大联合，解决的就是人心和力量问题\n②统一战线是党领导的统一战线，其最鲜明的特征是坚持以人民为中心\n③发展壮大爱国爱港爱澳力量，增强港澳同胞的爱国精神，形成更广泛的国内外支持“一国两制”的统一战线\n④关键是要坚持求同存异，发扬“团结一批评一团结”的优良传统，在尊重多样性中寻求一致性","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"C","explanation":"本题考查理论与政策。\n①正确，在2022年7月29日至30日召开的中央统战工作会议上，习近平总书记指出，统一战线是党克敌制胜、执政兴国的重要法宝，是团结海内外全体中华儿女实现中华民族伟大复兴的重要法宝，必须长期坚持······统战工作的本质要求是大团结大联合，解决的就是人心和力量问题······\n②错误，在2022年7月29日至30日召开的中央统战工作会议上，习近平总书记指出，加强新时代统一战线工作，根本在于坚持党的领导。中国共产党领导是统一战线最鲜明的特征，坚持党的领导是统一战线最根本、最核心的问题。故“最鲜明的特征是坚持以人民为中心”说法错误。\n③正确，二十大报告在“十三、坚持和完善‘一国两制’，推进祖国统一”中指出：“‘一国两制’是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定的最佳制度安排，必须长期坚持······发展壮大爱国爱港爱澳力量，增强港澳同胞的爱国精神，形成更广泛的国内外支持‘一国两制’的统一战线······”\n④正确，《习近平总书记关于做好新时代党的统一战线工作的重要思想学习读本》中强调：“‘团结——批评——团结’是我们党处理党内矛盾和人民内部矛盾的基本原则和基本方式，也是党领导的统一战线的优良传统······习近平总书记指出：‘关键是要坚持求同存异，发扬‘团结——批评——团结’的优良传统，在尊重多样性中寻求一致性，找到最大公约数、画出最大同心圆。’”\n故正确的是①③④。\n故正确答案为C。","no":4,"missingImage":false},{"type":"question","qid":"13504496","cat":"新思想","stem":"习近平总书记指出，纵观人类历史，教育兴则国家兴，教育强则国家强，世界强国无一不是教育强国，教育始终是强国兴起的关键因素。关于建设教育强国，下列表述正确的有几项？\n①要坚持不懈用新时代中国特色社会主义思想铸魂育人，着力加强社会主义核心价值观教育\n②必须以坚持党对教育事业的全面领导为根本保证\n③坚持把高速高效发展作为各级各类教育的生命线\n④建设教育强国，龙头是义务教育","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"B","explanation":"本题考查理论与政策。\n2023年5月29日，中共中央政治局就建设教育强国进行第五次集体学习，中共中央总书记习近平主持学习会议并发表讲话。\n①正确，习近平总书记指出，要坚持不懈用新时代中国特色社会主义思想铸魂育人，着力加强社会主义核心价值观教育，引导学生树立坚定的理想信念，永远听党话、跟党走，矢志奉献国家和人民。\n②正确，习近平总书记强调，我们要建设的教育强国，是中国特色社会主义教育强国，必须以坚持党对教育事业的全面领导为根本保证······\n③错误，习近平总书记强调，要坚持把高质量发展作为各级各类教育的生命线，加快建设高质量教育体系。建设教育强国，基点在基础教育······故“高速高效发展”说法错误。\n④错误，习近平总书记强调，建设教育强国，龙头是高等教育。要把加快建设中国特色、世界一流的大学和优势学科作为重中之重，大力加强基础学科、新兴学科、交叉学科建设······故“龙头是义务教育”说法错误。\n故表述正确的是①②，共2项。\n故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"13504416","cat":"时事政治","stem":"党的二十届三中全会提出，高水平社会主义市场经济体制是中国式现代化的重要保障，关于构建高水平社会主义市场经济体制，下列举措不恰当的是：","options":{"A":"完善市场准入制度，优化新业态新领域市场准入环境","B":"推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通","C":"加强财政政策和货币政策协调配合，着力扩大内需，增强消费对优化供给结构的基础性作用","D":"建立国有企业履行战略使命评价制度，完善国有企业分类考核评价体系，开展国有经济增加值核算"},"answer":"C","explanation":"本题考查理论与政策。\nA项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“二、构建高水平社会主义市场经济体制”部分指出：“（7）完善市场经济基础制度······完善市场准入制度，优化新业态新领域市场准入环境······”\nB项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“二、构建高水平社会主义市场经济体制”部分指出：“（6）构建全国统一大市场。推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。加强公平竞争审查刚性约束，强化反垄断和反不正当竞争······”\nC项错误，二十大报告在“四、加快构建新发展格局，着力推动高质量发展”部分指出：“（一）构建高水平社会主义市场经济体制······健全宏观经济治理体系，发挥国家发展规划的战略导向作用，加强财政政策和货币政策协调配合，着力扩大内需，增强消费对经济发展的基础性作用和投资对优化供给结构的关键作用。”故“消费对优化供给结构的基础性作用”的表述错误。\nD项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“二、构建高水平社会主义市场经济体制”部分指出：“（5）坚持和落实‘两个毫不动摇’······建立国有企业履行战略使命评价制度，完善国有企业分类考核评价体系，开展国有经济增加值核算。推进能源、铁路、电信、水利、公用事业等行业自然垄断环节独立运营和竞争性环节市场化改革，健全监管体制机制。”\n本题为选非题，故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"13504665","cat":"新思想","stem":"坚定理想信念，坚守共产党人精神追求，始终是共产党人安身立命的根本。关于推动理想信念教育常态化制度化，下列表述不恰当的是：","options":{"A":"形成网上思想道德教育统一化、标准化实施机制","B":"建立健全道德领域突出问题协同治理机制，完善“扫黄打非”长效机制","C":"健全诚信建设长效机制，教育引导全社会自觉遵守法律，遵循公序良俗","D":"优化英模人物宣传学习机制，创新爱国主义教育和各类群众性主题活动组织机制"},"answer":"A","explanation":"本题考查理论与政策。\nA项错误，B、C、D三项正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》中“十、深化文化体制机制改革”部分的“（38）完善意识形态工作责任制”中指出：“推动理想信念教育常态化制度化。完善培育和践行社会主义核心价值观制度机制。改进创新文明培育、文明实践、文明创建工作机制。实施文明乡风建设工程。优化英模人物宣传学习机制，创新爱国主义教育和各类群众性主题活动组织机制，推动全社会崇尚英雄、缅怀先烈、争做先锋。构建中华传统美德传承体系，健全社会公德、职业道德、家庭美德、个人品德建设体制机制，健全诚信建设长效机制，教育引导全社会自觉遵守法律、遵循公序良俗，坚决反对拜金主义、享乐主义、极端个人主义和历史虚无主义。形成网上思想道德教育分众化、精准化实施机制。建立健全道德领域突出问题协同治理机制，完善‘扫黄打非’长效机制。”故“统一化、标准化实施机制”说法错误，应为“分众化、精准化实施机制”。\n本题为选非题，故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"13504418","cat":"新思想","stem":"统一开放的交通运输市场是有效衔接供需、促进国民经济循环畅通的重要基础，关于加快建设统一开放的交通运输市场，下列举措不恰当的是：","options":{"A":"建立交通运输装备能源清洁替代机制，保障规划实施全类运输工具应用新能源、清洁能源","B":"对交通运输领域招标投标、政府采购等相关规章制度按照有关规定进行公平竞争审查","C":"依托全国一体化大数据中心协同创新体系布局，构建综合交通大数据中心体系","D":"防止利用数据、算法、技术等手段排除限制竞争、侵害从业人员合法权益"},"answer":"A","explanation":"本题考查理论与政策。\n2024年12月12日，《中共中央办公厅 国务院办公厅关于加快建设统一开放的交通运输市场的意见》（以下简称《意见》）发布。\nA项错误，《意见》在“二、深化交通运输重点领域改革”部分指出：“（六）推动交通运输绿色智慧转型升级······完善交通运输装备能源清洁替代政策，推动中重型卡车、船舶等运输工具应用新能源、清洁能源······”故并非“全类运输工具应用新能源、清洁能源”。\nB项正确，《意见》在“三、完善交通运输市场制度”部分指出：“（十）完善交通领域价格机制······对交通运输领域招标投标、政府采购、经营行为规范、资质标准等相关规章制度按照有关规定进行公平竞争审查，维护公平竞争市场秩序。”\nC项正确，《意见》在“四、优化交通运输市场要素资源配置”部分指出：“（十六）推进数据和技术赋能交通运输发展。依托全国一体化大数据中心协同创新体系布局，构建综合交通大数据中心体系······”\nD项正确，《意见》在“五、完善交通运输市场监管机制”部分指出：“（十九）强化反垄断和反不正当竞争。加强交通运输领域市场竞争状况评估，依法查处垄断和不正当竞争行为，防止利用数据、算法、技术等手段排除限制竞争、侵害从业人员合法权益······”\n本题为选非题，故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"13504478","cat":"新思想","stem":"习近平总书记指出，如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队，是全面建设社会主义现代化国家的战略要求。关于实现建军一百年奋斗目标，下列举措恰当的是：\n①加强军史学习教育，繁荣发展强军文化，强化战斗精神培育\n②加强军人军属荣誉激励和权益保障，做好退役军人服务保障工作\n③积极开展军事斗争，塑造安全态势，遏控危机冲突，阻止局部战争\n④研究掌握信息化智能化战争特点规律，创新军事战略指导，发展人民战争战略战术","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查理论与政策。\n①正确，党的二十大报告在“十二、实现建军一百年奋斗目标，开创国防和军队现代化新局面”部分指出：“全面加强人民军队党的建设，确保枪杆子永远听党指挥······加强军史学习教育，繁荣发展强军文化，强化战斗精神培育。”\n②正确，党的二十大报告在“十二、实现建军一百年奋斗目标，开创国防和军队现代化新局面”部分指出：“加强军人军属荣誉激励和权益保障，做好退役军人服务保障工作。”\n③错误，党的二十大报告在“十二、实现建军一百年奋斗目标，开创国防和军队现代化新局面”部分指出：“加强军事力量常态化多样化运用，坚定灵活开展军事斗争，塑造安全态势，遏控危机冲突，打赢局部战争。”故\"积极开展军事斗争\"“阻止局部战争”表述错误，应为“灵活开展军事斗争”“打赢局部战争”。\n④正确，党的二十大报告在“十二、实现建军一百年奋斗目标，开创国防和军队现代化新局面”部分指出：“研究掌握信息化智能化战争特点规律，创新军事战略指导，发展人民战争战略战术。”\n故①②④表述正确。\n故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"13504370","cat":"新思想","stem":"习近平总书记强调，现代化产业体系是现代化国家的物质技术基础，必须把发展经济的着力点放在实体经济上，为实现第二个百年奋斗目标提供坚强物质支撑。下列与之相关说法正确的有几项？\n①推进实施绿色发展战略，充分发挥绿色化赋能实体经济发展效应\n②促进数字技术和实体经济深度融合，催生新产业新业态新模式替代传统产业\n③重视现代服务业的发展，推动现代服务业与先进制造业、现代农业深度融合\n④推动重点产业在国内外有序转移、促进国内外产业深度融合与实体经济发展相结合","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","explanation":"本题考查理论与政策。\n①正确，《新型工业化是发展新质生产力的主阵地》中指出，习近平总书记强调：“要充分认识形成绿色发展方式和生活方式的重要性、紧迫性、艰巨性。”······因此，要推动绿色发展与实体经济发展相融合，充分发挥绿色化赋能实体经济发展效应。\n②错误，《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》中指出，促进数字技术与实体经济深度融合，赋能传统产业转型升级，催生新产业新业态新模式，壮大经济发展新引擎。\n③正确，《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》中指出，重视现代服务业的发展，推动现代服务业与先进制造业、现代农业深度融合，深化业务关联、链条延伸、技术渗透，支持智能制造系统解决方案、流程再造等新型专业化服务机构发展。培育具有国际竞争力的服务企业。\n④正确，习近平总书记在二十届中央政治局第二次集体学习时强调，优化生产力布局，推动重点产业在国内外有序转移，支持企业深度参与全球产业分工和合作，促进内外产业深度融合，打造自主可控、安全可靠、竞争力强的现代化产业体系。这要求我们发挥好超大规模市场优势和超大纵深空间优势，加快建设以实体经济为支撑的现代化产业体系，引导产业合理有序梯度转移。\n故①③④表述正确，共3项。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"13504663","cat":"新思想","stem":"习近平总书记强调，要加强新时代廉洁文化建设，教育引导广大党员、干部增强不想腐的自觉，清清白白做人、干干净净做事。下列属于加强新时代廉洁文化建设的举措有几项？\n①开办红色廉洁文化专题展览，在红色教育中传承党的廉洁基因\n②对新入职党员、干部及时开展廉洁教育，扣好年轻干部廉洁从政第一粒扣子\n③注重从优秀传统家训家规中汲取营养，开展红色家风传承活动\n④挖掘历史文献、文化经典、文物古迹中的廉洁思想，整理古圣先贤、清官廉吏的嘉言懿行","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查理论与政策。\n①正确，《关于加强新时代廉洁文化建设的意见》指出：“注重发掘总结党反对腐败、建设廉洁政治的历史和经验，提炼革命文化蕴含的廉洁理念，运用好革命博物馆、纪念馆、党史馆等红色资源，开办红色廉洁文化专题展览，在红色教育中传承党的廉洁基因。”\n②正确，《关于加强新时代廉洁文化建设的意见》指出：“对新入职党员、干部及时开展廉洁教育，扣好年轻干部廉洁从政第一粒扣子。”\n③正确，《关于加强新时代廉洁文化建设的意见》指出：“注重从优秀传统家训家规中汲取营养，开展红色家风传承活动，把对党忠诚纳入家庭家教家风建设。”\n④正确，《关于加强新时代廉洁文化建设的意见》指出：“挖掘历史文献、文化经典、文物古迹中的廉洁思想，整理古圣先贤、清官廉吏的嘉言懿行，推动中华优秀传统文化创造性转化、创新性发展。”\n故①②③④表述正确，有4项。\n故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"13504480","cat":"新思想","stem":"党的二十大强调，国家安全是民族复兴的根基，社会稳定是国家强盛的前提，必须坚定不移贯彻总体国家安全观，把维护国家安全贯穿党和国家工作各方面全过程，确保国家安全和社会稳定。下列表述不正确的是：","options":{"A":"坚持党中央对国家安全工作的集中统一领导，完善高效权威的国家安全领导体制","B":"坚持安全第一、应急为主，建立大安全大应急框架，完善公共安全体系","C":"加强海外安全保障能力建设，维护我国公民、法人在海外合法权益","D":"强化食品药品安全监管，健全生物安全监管预警防控体系"},"answer":"B","explanation":"本题考查理论与政策。\nA项正确，党的二十大报告中“十一、推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定”部分指出：“（一）健全国家安全体系。坚持党中央对国家安全工作的集中统一领导，完善高效权威的国家安全领导体制。”\nB项错误，党的二十大报告中“十一、推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定”部分指出：“（三）提高公共安全治理水平。坚持安全第一、预防为主，建立大安全大应急框架，完善公共安全体系，推动公共安全治理模式向事前预防转型。”因此“应急为主”表述错误。\nC项正确，党的二十大报告“十一、推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定”部分指出：“（二）增强维护国家安全能力。坚定维护国家政权安全、制度安全、意识形态安全，加强重点领域安全能力建设，确保粮食、能源资源、重要产业链供应链安全，加强海外安全保障能力建设，维护我国公民、法人在海外合法权益，维护海洋权益，坚定捍卫国家主权、安全、发展利益。”\nD项正确，党的二十大报告“十一、推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定”部分指出：“（三）提高公共安全治理水平······提高防灾减灾救灾和重大突发公共事件处置保障能力，加强国家区域应急力量建设。强化食品药品安全监管，健全生物安全监管预警防控体系。加强个人信息保护。”\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"12881996","cat":"时事政治","stem":"党的二十届三中全会提出，要健全社会治理体系。关于健全社会治理体系，下列表述不准确的是：","options":{"A":"健全城乡社区治理体系，及时把矛盾纠纷化解在基层、化解在萌芽状态","B":"提高市域社会治理能力，强化市民热线等公共服务平台功能","C":"坚持和发展“枫桥经验”是健全社会治理体系的基础和前提","D":"健全发挥家庭家教家风建设在基层治理中作用的机制"},"answer":"C","explanation":"本题考查理论与政策。\nA项正确，党的二十大报告中“十一、推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定”部分的“（四）完善社会治理体系”指出：“······在社会基层坚持和发展新时代‘枫桥经验’，完善正确处理新形势下人民内部矛盾机制，加强和改进人民信访工作，畅通和规范群众诉求表达、利益协调、权益保障通道，完善网格化管理、精细化服务、信息化支撑的基层治理平台，健全城乡社区治理体系，及时把矛盾纠纷化解在基层、化解在萌芽状态。”\nB、D两项正确，《中共中央关于进一步全面深化改革、推进中国式现代化的决定》（以下简称《决定》）中“十三、推进国家安全体系和能力现代化”部分的“（52）健全社会治理体系”指出：“提高市域社会治理能力，强化市民热线等公共服务平台功能，健全‘高效办成一件事’重点事项清单管理机制和常态化推进机制。健全社会心理服务体系和危机干预机制。健全发挥家庭家教家风建设在基层治理中作用的机制。深化行业协会商会改革。健全社会组织管理制度。”\nC项错误，《决定》中“十三、推进国家安全体系和能力现代化”部分的“（52）健全社会治理体系”指出：“坚持和发展新时代‘枫桥经验’，健全党组织领导的自治、法治、德治相结合的城乡基层治理体系，完善共建共治共享的社会治理制度。”健全社会治理体系是一个复杂的系统工程，涉及到诸多方面的基础和前提条件。坚持和发展“枫桥经验”是健全社会治理体系的重要内容和有效途径，具有极其重要的作用。故“基础和前提”这种表述不准确。\n本题为选非题，故正确答案为C。","no":13,"missingImage":false}],"count":13,"answerable":13,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"13504425","cat":"法律常识","stem":"下列关于法规的表述正确的是：","options":{"A":"国家监察委员会根据宪法、法律和行政法规，制定监察法规","B":"《中华人民共和国军事设施保护法》和《国际军事合作工作条例》都属于军事法规","C":"地方性法规是指各地方政府按照宪法、法律、行政法规的规定制定的规范性法律文件","D":"党内法规是体现党的统一意志，规范党的领导和党的建设活动、依靠党的纪律保证实施的专门规章制度"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国立法法》第一百一十八条规定：“国家监察委员会根据宪法和法律、全国人民代表大会常务委员会的有关决定，制定监察法规，报全国人民代表大会常务委员会备案。”因此，国家监察委员会制定监察法规的根据包含宪法和法律、全国人民代表大会常务委员会的有关决定，并不包括行政法规。\nB项错误，根据《中华人民共和国立法法》第十条第三款规定：“全国人民代表大会常务委员会制定和修改除应当由全国人民代表大会制定的法律以外的其他法律；在全国人民代表大会闭会期间，对全国人民代表大会制定的法律进行部分补充和修改，但是不得同该法律的基本原则相抵触。”第一百一十七条规定：“中央军事委员会根据宪法和法律，制定军事法规。”由此说明，《中华人民共和国军事设施保护法》属于法律，由全国人民代表大会常务委员会制定。《国际军事合作工作条例》属于军事法规，由中央军委制定。\nC项错误，根据《中华人民共和国立法法》第八十条规定：“省、自治区、直辖市的人民代表大会及其常务委员会根据本行政区域的具体情况和实际需要，在不同宪法、法律、行政法规相抵触的前提下，可以制定地方性法规。”第八十一条第一款规定：“设区的市的人民代表大会及其常务委员会根据本市的具体情况和实际需要，在不同宪法、法律、行政法规和本省、自治区的地方性法规相抵触的前提下，可以对城乡建设与管理、生态文明建设、历史文化保护、基层治理等方面的事项制定地方性法规······”因此，地方性法规是由特定的地方人大及其常委会制定，并非地方政府制定。\nD项正确，根据《中国共产党党内法规制定条例》第三条第一款规定：“党内法规是党的中央组织，中央纪律检查委员会以及党中央工作机关和省、自治区、直辖市党委制定的体现党的统一意志、规范党的领导和党的建设活动、依靠党的纪律保证实施的专门规章制度。”\n故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"13504417","cat":"科技常识","stem":"藻蓝蛋白是一种可从螺旋藻中提取分离得到的色素蛋白，可制成营养保健品，以下关于藻蓝蛋白说法错误的是：","options":{"A":"藻蓝蛋白在强酸环境下不稳定","B":"藻蓝蛋白是一种可食用的天然色素","C":"藻蓝蛋白至少由C、H、O、N四种元素组成","D":"藻蓝蛋白呈现蓝色是由于其吸收了蓝光的缘故"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，藻蓝蛋白是蛋白质，强酸会破坏其空间结构（变性），故蛋白质在强酸环境下不稳定。\nB项正确，藻蓝蛋白是天然色素，且属于可食用的天然色素，现已广泛应用于食品（如冰淇淋、饮料）和保健品中。\nC项正确，氨基酸是蛋白质的基本组成单位，至少含C、H、O、N四种元素。藻蓝蛋白是蛋白质，故藻蓝蛋白至少由C、H、O、N四种元素组成。\nD项错误，物质颜色由其反射或透射的光决定。藻蓝蛋白主要吸收红光和橙黄光等，而对蓝光的吸收较少，故藻蓝蛋白因反射或透射蓝光而呈蓝色。\n本题为选非题，故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"13504399","cat":"科技常识","stem":"人们日常体检中的很多仪器，其原理都和射线有关，目前最常用的是伽马射线和伦琴射线，下列关于这两种射线的说法错误的是（    ）。","options":{"A":"这两种射线都属于电磁波","B":"伽马射线的辐射性较强，不能用于食品杀菌","C":"伦琴射线可用于CT（电子计算机断层扫描）检查中","D":"这两种射线的辐射伤害可以用不同厚度的铅板来阻挡"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，电磁波按照波长从长到短（频率从低到高）可分为无线电波、微波、红外线、可见光、紫外线、伦琴射线（X射线）、伽马射线等。\nB项错误，伽马射线是原子核受激发后产生的，波长极短，频率极高。利用伽马射线进行食品杀菌是一种常见的食品辐照保鲜技术。该技术利用放射性元素（如钴-60、铯-137）产生的伽马射线对食品进行照射，能够杀死食品中的细菌、霉菌、酵母菌等微生物，还可以抑制食品中害虫的生长和繁殖，从而达到延长食品保质期、防止食品腐败变质的目的。\nC项正确，伦琴射线是原子内层电子受激发后产生的，具有较高的频率和能量。CT检查主要是利用精确准直的X射线（即伦琴射线）束对人体进行断层扫描，X射线穿过人体时，由于人体不同组织对X射线的吸收和衰减程度不同，探测器会接收穿过人体后的X射线强度信息，这些信息被传输到计算机中，计算机利用专门的算法对数据进行处理和重建，从而生成人体被扫描部位的断层图像，医生可以根据这些图像来观察人体内部的结构和病变情况。\nD项正确，伽马射线和伦琴射线都具有较强的穿透能力，而铅板具有高密度、高原子序数的特点，能够有效地吸收和散射这些射线，从而起到防护作用。一般来说，射线能量越高，需要的铅板厚度就越大，以达到足够的防护效果，阻挡射线对人体或其他物体的伤害。所以，可以根据实际情况，使用不同厚度的铅板来阻挡伽马射线和伦琴射线的辐射伤害。\n本题为选非题，故正确答案为B。","no":16,"missingImage":false},{"type":"question","qid":"13504400","cat":"人文常识","stem":"以下关于我国航母的说法错误的是：","options":{"A":"目前我国列装的航母满载排水量均超过5万吨","B":"“福建舰”是我国自主建造的弹射型国产航母，采用平直通长飞行板","C":"我国首艘国产航母“辽宁舰”于2012年入列，目前已形成体系作战能力","D":"2019年12月，中国第二艘航母被正式命名为“山东舰”，其突破了船体结构，动力核心设备这两项重大技术瓶颈"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，目前我国列装的航母包括辽宁舰、山东舰和福建舰三艘。其中辽宁舰和山东舰属于6万吨级的中型航母，而福建舰是满载排水量8万余吨的大型航母，所以目前我国列装的航母满载排水量均超过5万吨。\nB项正确，“福建舰”是我国完全自主设计建造的首艘弹射型航空母舰，采用平直通长飞行甲板，配置电磁弹射和阻拦装置。\nC项错误，我国首艘国产航母是“山东舰”，2019年入列。“辽宁舰”2012年入列，前身是苏联海军的“瓦良格”号，并非我国首艘国产航母。\nD项正确，2019年12月17日，中国第二艘航母（第一艘国产航母）正式交付海军。山东舰入列仪式在海南三亚某军港举行，经中央军委批准，中国第一艘国产航母命名为“中国人民解放军海军山东舰”，舷号为“17”。山东舰突破了船体结构、动力核心设备这两项制约中国航母事业发展的重大技术瓶颈，以及发电机组、综合电力系统、节能减排装置等船舶动力产品设计建造关键技术。\n本题为选非题，故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"13504689","cat":"人文常识","stem":"下列案例中，当事人的主张能够获得法院支持的是：","options":{"A":"王某以妻子未经自己同意擅自流产为由，主张妻子侵犯自己的生育权，要求进行损害赔偿","B":"张某与妻子离婚时，以女方一天也没有回家住过为由，主张返还按照习俗给付的18万元彩礼","C":"李某认为自己在婚后通过转让发明专利获得的收入为个人财产，主张不能用于偿还夫妻共同债务","D":"某父母为已婚女儿出资购房，并约定房屋为女儿所有，其女婿孙某离婚时主张该房屋属于家庭共同财产"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，根据《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第二十三条规定：“夫以妻擅自中止妊娠侵犯其生育权为由请求损害赔偿的，人民法院不予支持；夫妻双方因是否生育发生纠纷，致使感情确已破裂，一方请求离婚的，人民法院经调解无效，应依照民法典第一千零七十九条第三款第五项的规定处理。”因此，王某以其妻子未经自己同意擅自流产为由，主张妻子侵犯自己的生育权，该主张无法获得法院支持。\nB项正确，根据《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第五条第一款规定：“当事人请求返还按照习俗给付的彩礼的，如果查明属于以下情形，人民法院应当予以支持：（一）双方未办理结婚登记手续；（二）双方办理结婚登记手续但确未共同生活；（三）婚前给付并导致给付人生活困难。”因此，张某的情况符合“未共同生活”的条件，法院可以支持其返还彩礼的请求。\nC项错误，根据《中华人民共和国民法典》第一千零六十二条第一款规定：“夫妻在婚姻关系存续期间所得的下列财产，为夫妻的共同财产，归夫妻共同所有：（一）工资、奖金、劳务报酬；（二）生产、经营、投资的收益；（三）知识产权的收益；（四）继承或者受赠的财产，但是本法第一千零六十三条第三项规定的除外；（五）其他应当归共同所有的财产。”因此，李某在婚后通过转让发明专利获得的收入为共同财产，其主张不能用于偿还夫妻共同债务，不能获得法院支持。\nD项错误，根据《中华人民共和国民法典》第一千零六十三条规定：“下列财产为夫妻一方的个人财产：（一）一方的婚前财产；（二）一方因受到人身损害获得的赔偿或者补偿；（三）遗嘱或者赠与合同中确定只归一方的财产；（四）一方专用的生活用品；（五）其他应当归一方的财产。”某父母为已婚女儿出资购房，并约定房屋为女儿所有，属于赠与合同中确定只归一方的财产，因此，该房屋属于其女儿的个人财产，其女婿孙某离婚时主张该房屋属于家庭共同财产，不能获得法院支持。\n故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"13504671","cat":"人文常识","stem":"下列选项与无线充电器主要工作原理相同的是：","options":{"A":"微波炉","B":"电磁炉","C":"电热毯","D":"电熨斗"},"answer":"B","explanation":"本题考查科技常识。\n无线充电器的主要工作原理是电磁感应，主要通过线圈间变化的磁场产生感应电流来实现能量传递。\nA项错误，微波炉是利用微波来加热食物，微波使食物中的水分子高频振动产生大量热能，从而加热食物，与电磁感应无关。\nB项正确，电磁炉利用线圈产生交变磁场，当导磁性锅具（如铁锅）置于磁场中时，锅底会因电磁感应产生涡流，涡流的焦耳热效应使锅具发热。其主要工作原理为电磁感应，与无线充电器主要工作原理相同。\nC项错误，电热毯内部有电阻丝，通过电阻丝产生焦耳热，属于电阻加热，即电能直接转化为热能，主要工作原理为电流的热效应，与电磁感应无关。\nD项错误，传统电熨斗通过电阻丝加热底板，蒸汽熨斗则通过电加热水产生蒸汽，核心为电阻加热或蒸汽加热，主要工作原理为电流的热效应，与电磁感应无关。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"13504669","cat":"人文常识","stem":"下列有关中国古代建筑的说法错误的是：","options":{"A":"楼是“重屋”，指的是两层及以上的建筑物","B":"阁是一种半开放的建筑，常建于水边供人们赏景","C":"舫是仿照船型而造的一种建筑，又被称为“不系舟”","D":"亭一般为开敞性结构，没有围墙，顶部可分为六角、八角等形状"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，《说文解字》释“楼”为“重屋”，即多层建筑，如黄鹤楼、岳阳楼均为典型楼阁式建筑。\nB项错误，阁以“高耸、封闭性”为主，结构上常有平座（悬挑平台），内部多层，用于藏书、供奉佛像等；阁通常四面开窗但墙体完整，与“亭”“榭”的开放性不同。临水建筑多为“榭”或“轩”，而阁多建于高地或庭院中。\nC项正确，舫是园林中仿船形的一种建筑，因其形似船而不能航行，又被称为“不系舟”，这一别称源自《庄子·列御寇》，比喻超脱自在，与舫的静态观赏功能契合。\nD项正确，亭的核心特征是“有顶无墙”，其顶部造型多样，涵盖圆形、扇形等，六角、八角为常见形制。\n本题为选非题，故正确答案为B。","no":20,"missingImage":false},{"type":"question","qid":"13504402","cat":"人文常识","stem":"下列诗文涉及的人物或事件对应的时期错误的是：","options":{"A":"合从离衡，佩印者六——战国","B":"饮马瀚海，封狼居胥——东汉","C":"被遇神宗，致位宰相——北宋","D":"血战歼倭，勋垂闽浙——明朝"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，“合从离衡，佩印者六”出自《史记·苏秦列传》，指的是苏秦游说六国合作抗秦，佩有六国相印。苏秦为战国时期人物。\nB项错误，“饮马瀚海，封狼居胥”出自《史记·卫将军骠骑列传》，指的是霍去病带领汉军深入漠北，大败匈奴，在狼居胥山举行祭天封礼，在瀚海让马饮水，彰显了汉朝军队的赫赫战功和强大军威。霍去病为西汉而非东汉时期人物。\nC项正确，“被遇神宗，致位宰相”出自《宋史·王安石传》，指的是王安石受到宋神宗的知遇之恩，得以官至宰相。王安石是北宋时期人物。\nD项正确，“血战歼倭，勋垂闽浙”出自《明神宗实录》，指的是戚继光等人经过残酷激烈的战斗，歼灭了倭寇，在福建和浙江地区立下了不朽的功勋。戚继光为明朝时期人物。\n本题为选非题，故正确答案为B。","no":21,"missingImage":false},{"type":"question","qid":"13504423","cat":"人文常识","stem":"“超级满月”是月球位于近地点时刚好出现满月，使月亮看起来又大又亮的现象。其发生需要满足的条件是：","options":{"A":"农历初一前后，地球运动到太阳与月球之间","B":"农历初一前后，月球运动到太阳与地球之间","C":"农历十五前后，地球运动到太阳与月球之间","D":"农历十五前后，月球运动到太阳与地球之间"},"answer":"C","explanation":"本题考查地理国情。\nC项正确，A、B、D三项错误，满月发生在农历十五前后，此时月球运行至地球背向太阳的一侧，即地球位于太阳和月球之间（三者近似直线），月球被太阳照亮的半球完全朝向地球，形成“满月”。若此时月球恰好位于近地点，则为“超级满月”。\n故正确答案为C。","no":22,"missingImage":false},{"type":"question","qid":"13504668","cat":"人文常识","stem":"下列关于我国重要历史文物的叙述错误的是：","options":{"A":"青铜器“利簋”又名“武王征商簋”，其铭文记载了武王伐纣这一历史事件","B":"三星堆遗址出土了青铜大立人像、青铜神树、金面罩等珍贵文物","C":"新疆出土的汉代织锦护臂，织有“五星出东方利中国”八字","D":"位于陕西西安的半坡遗址出土了嵌绿松石象牙杯"},"answer":"D","explanation":"本题考查人文常识。\nA项正确，利簋，又名“武王征商簋”、“周代天灭簋”、“檀公簋”，西周早期青铜器，1976年出土于陕西临潼县（今西安市临潼区）零口镇，现收藏于中国国家博物馆，是迄今能确知的最早的西周青铜器。利簋内壁铸有铭文。这些铭文详细记载了周武王征伐商纣王这一重大历史事件，明确记录了在甲子日清晨，武王对伐纣进行了占卜，得到吉兆后，便迅速出师，当天就一举打败了商军。\nB项正确，三星堆遗址位于四川省广汉市三星堆镇鸭子河南岸，是新石器时代至商周的蜀文化遗址。1929年，该遗址被村民燕道诚最早发现，是目前中国西南地区发现的分布范围最广、延续时间最长、文化内涵最丰富的古文化遗址。1986年，三星堆1号、2号“祭祀坑”，出土青铜大立人像、青铜神树、青铜面具、金面罩、金杖、象牙等上千件珍贵文物。\nC项正确，五星出东方利中国，为汉代织锦护臂，国家一级文物，中国首批禁止出国（境）展览文物。1995年10月，中日尼雅遗址学术考察队成员在新疆和田地区民丰县尼雅遗址一处古墓中发现该织锦，收藏于新疆维吾尔自治区博物馆。\nD项错误，嵌绿松石象牙杯为商晚期牙雕，1976年在河南省安阳市殷墟妇好墓出土，现收藏于中国社会科学院考古研究所。陕西西安的半坡遗址是新石器时代仰韶文化聚落遗址，主要出土了大量的彩陶、石器、骨器等文物。\n本题为选非题，故正确答案为D。","no":23,"missingImage":false}],"count":10,"answerable":10,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"13504421","cat":"逻辑填空","stem":"司马迁说：“余读孔氏书，想见其为人。适鲁，观仲尼庙堂······祗回留之，不能去。”“余读《离骚》······悲其志。适长沙，观屈原所自沉渊······想见其为人。”《史记》的“太史公曰”据信有120余篇，大多            ，彰显客观公正的史学观。唯有对孔子和屈原则是带着浓烈的个人情感，以基本相同的笔调，发出了触动人们心灵的赞叹。\n填入画横线部分最恰当的一项是：","options":{"A":"隐晦曲折","B":"直言不讳","C":"秉笔直评","D":"光明正大"},"answer":"C","explanation":"横线后“彰显客观公正的史学观”对横线处进行解释说明，且需要与后文“唯有对孔子和屈原则是带着浓烈的个人情感”形成语义相反，因此横线处应体现《史记》的“太史公曰”是秉持客观公正的态度、不带有过多个人情感来进行书写。C项“秉笔直评”指拿起笔不加隐讳地径直写出，置于文段可体现出《史记》的“太史公曰”不隐瞒、不夸大、真实地反映情况之意，符合文意，当选。A项“隐晦曲折”指写文章或说话时用隐隐约约、转弯抹角的方式来表达某种思想，无法体现出客观公正之意，与文意不符，排除；B项“直言不讳”指说话坦率，毫无顾忌，侧重表达方式的直白坦率，与文段强调《史记》“太史公曰”的内容客观公正无关，与文意不符，排除；D项“光明正大”形容襟怀坦白，行为正派，而横线处修饰《史记》“太史公曰”的写作内容，并非行为，搭配不当，排除。\n故正确答案为C。\n【文段出处】《屈原的文化高度：与日月同辉》","no":24,"missingImage":false},{"type":"question","qid":"13504674","cat":"逻辑填空","stem":"全球粒子物理研究主要强国纷纷提出了各自未来的“希格斯工厂”方案。最近几年，在一些国家和地区制定的粒子物理发展规划中，希格斯粒子的研究            地均居于核心地位。中国物理学会高能物理分会的决议中，也明确写明，我国提出的环形正负电子对撞机是我国未来高能加速器物理发展的首选项目。\n填入画横线部分最恰当的一项是：","options":{"A":"一成不变","B":"千篇一律","C":"出乎意料","D":"无一例外"},"answer":"D","explanation":"根据横线前“主要强国纷纷提出了各自未来的‘希格斯工厂’方案”以及横线之后的“中国物理学会高能物理分会的决议中，也明确写明”可知，文段意在说明包括中国在内的多个国家和地区都把希格斯粒子的研究提到了粒子物理发展规划的核心地位，D项“无一例外”指都是这样，没有其他特殊的，符合文意，当选。\nA项“一成不变”指一经形成，不再改变，亦泛指墨守成规，不知变通，与文意不相符，排除；\nB项“千篇一律”指事物只有一种形式，呆板无新意，文段并非强调一些国家和地区的研究没有新意、没有变化，而是强调大家均如此，与文意不相符，排除；\nC项“出乎意料”指事先对情况与结果的估计，超出人们的料想猜测，与文意相悖，排除。\n故正确答案为D。\n【文段出处】光明日报《对撞机，究竟是个什么机》","no":25,"missingImage":false},{"type":"question","qid":"13504672","cat":"逻辑填空","stem":"从航天任务连战连捷到重大航空工程深入推进，从空间科学探索到航天科技成果服务经济社会发展，十年来，一次次振奋人心的火箭腾飞，一项项令人惊叹的航空成就，        出航天人接续奋斗的轨迹。\n填入画横线部分最恰当的一项是：","options":{"A":"见证","B":"描摹","C":"创造","D":"勾勒"},"answer":"D","explanation":"搭配“轨迹”，且根据“一次次振奋人心的火箭腾飞，一项项令人惊叹的航空成就”可知，横线处应表达展现出了航天人接续奋斗的轨迹之意，D项“勾勒”指用线条描画出轮廓，与“轨迹”搭配恰当，且符合文意，当选。A项“见证”指当场目睹可以做证，与文意不符，且与“轨迹”搭配不当，排除；B项“描摹”指照原样描写或描画，文段并未体现照原样之意，与文意不符，排除；C项“创造”指想出新方法、建立新理论、做出新的成绩或东西，与“轨迹”搭配不当，排除。\n故正确答案为D。\n【文段出处】人民网《10年来航天任务连战连捷 重大工程深入推进》","no":26,"missingImage":false},{"type":"question","qid":"13504391","cat":"逻辑填空","stem":"说起中国的民居建筑，人们想到的多是南徽北晋，其实关中的建筑风格            ，中国最早的房屋建筑便出现在关中临潼姜寨仰韶文化村落遗址。从关中各地聚集而成的关中民俗博物院，将古时关中民宅的建筑风格        呈现，让我们在艺术的熏陶中感受到关中建筑的伟大。\n依次填入画横线部分最恰当的一项是：","options":{"A":"青出于蓝 透彻","B":"后来居上 畅快","C":"技高一筹 全面","D":"更胜一筹 淋漓"},"answer":"D","explanation":"第一空，搭配“建筑风格”，且根据文意可知，横线处所填成语应表达关中的建筑风格更好之意。D项“更胜一筹”指技艺或技能比较起来，比别人更好一些，符合文意，保留。A项“青出于蓝”比喻学生超过老师或后人胜过前人，B项“后来居上”指后来的超过先前的，二者均侧重后者超越前者，文段并未涉及后者与前者的比较，与文意不符，排除；C项“技高一筹”指技术高人一等，与“建筑风格”搭配不当，排除。\n第二空，代入验证。根据“让我们在艺术的熏陶中感受到关中建筑的伟大”可知，横线处应体现关中民俗博物馆将古时关中民宅的建筑风格充分呈现之意。D项“淋漓”形容文章或说话表达得非常充分、透彻；也可形容非常痛快，符合文意，当选。\n故正确答案为D。\n【文段出处】人民周刊《关中民居中的秦人风骨》","no":27,"missingImage":false},{"type":"question","qid":"13504676","cat":"逻辑填空","stem":"大数据、人工智能、虚拟现实等新兴技术不断改写信息传播        ，“融媒”“智媒”快速迭代升级。在万物皆媒、虚实同构的传播语境下，融会贯通不同传播主体、不同传播方式，实现资源跨国配置、价值跨界创造，尤其是要        各国青年群体的媒介使用习惯和内容选择偏好，研究他们在视听文本、审美旨趣方面的特点，才能有效地增强中华文明的国际影响力。\n依次填入画横线部分最恰当的一项是：","options":{"A":"模式 认清","B":"版图 熟悉","C":"格局 洞悉","D":"形式 明确"},"answer":"C","explanation":"第一空，根据“大数据、人工智能、虚拟现实等新兴技术不断改写信息传播”及“‘融媒’‘智媒’快速迭代升级”可知，横线处所填词语应体现新兴技术改变了信息传播的方式、状态。A项“模式”指某种事物的标准形式或使人可以照着做的标准样式，C项“格局”指结构和格式，D项“形式”指事物的形状、结构等，均符合文意，保留。B项“版图”原指户籍和地图，今借指国家的领土、疆域，与文意无关，且与“信息传播”搭配不当，排除。\n第二空，“尤其”表递进，且根据“有效地增强中华文明的国际影响力”可知，横线处所填词语程度较重，体现出要深入了解各国青年群体的媒介使用习惯和内容选择偏好，C项“洞悉”指很清楚地知道，强调深入、透彻地了解，程度轻重与文段相符，当选。A项“认清”指认识清楚，D项“明确”指清晰明白而确定不移，与“洞悉”相比，均程度较轻，排除。\n故正确答案为C。\n【文段出处】人民日报《提升中华文明的传播效能（新论）》","no":28,"missingImage":false},{"type":"question","qid":"13504469","cat":"逻辑填空","stem":"古人说寿县“恃水以为固”，            。五代十国时期，后周大军将寿县重重包围，守将刘仁瞻誓死守城。后遇大雨，淮河淝水暴涨后周兵营水深数尺，死伤严重，不战而退。春秋战国时，寿县是可与洛阳、邯郸、临淄        的重要都会。自晋到唐、宋，寿县也以繁华著称于世，舟楫如梭，商贾如云。\n依次填入画横线部分最恰当的一项是：","options":{"A":"所言不虚 比肩","B":"言之有理 媲美","C":"当之无愧 鼎峙","D":"名不虚传 扛鼎"},"answer":"A","explanation":"第一空，根据后文“五代十国时期······后周兵营水深数尺，死伤严重，不战而退”可知，横线处所填成语应体现“古人说寿县‘恃水以为固’”的说法是正确的，符合客观事实的，A项“所言不虚”指所说的话真实可靠，D项“名不虚传”指流传的名声和实际相符合，均符合文意，保留。B项“言之有理”指说的话有道理，侧重强调说话有道理，文段强调古人对寿县的点评是正确的，而非有道理，排除；C项“当之无愧”指担得起某种荣誉或某个职务，无须感到惭愧，文段并未涉及荣誉或职务，排除。\n第二空，根据“春秋战国时，寿县是······重要都会”以及“自晋到唐、宋，寿县也以繁华著称于世”可知，寿县在当时是非常重要的城市，与洛阳、邯郸、临淄的地位不相上下，A项“比肩”指并肩，也比喻地位相等，符合文意，当选。D项“扛鼎”指举鼎，常用来比喻有大才，能负重任，也比喻攘夺国家政权，其词义均与文意无关，排除。\n故正确答案为A。","no":29,"missingImage":false},{"type":"question","qid":"13504426","cat":"逻辑填空","stem":"江南文化的价值不仅局限于文化典籍和文物古迹之中，更        在人们的日常生活之中。具有几千年江河湖海水韵的江南文化，以其精神文明、文化特征和风俗习惯，        和影响着一代又一代民众创造有烟火气、有温度的诗性生活。\n依次填入画横线部分最恰当的一项是：","options":{"A":"包含 汇聚","B":"蕴含 融汇","C":"酝酿 叠合","D":"孕育 萦绕"},"answer":"B","explanation":"第一空，根据“江南文化的价值不仅局限于······中，更······”可知，横线处应表示江南文化的价值还存在于人们的日常生活中。B项“蕴含”指包含、内部含有，符合文意，保留。A项“包含”指某事物内部含有其他内容或成分，常用于描述具体事物的组成或归属，与“江南文化价值”无法搭配，排除；C项“酝酿”是造酒的发酵过程，比喻做准备工作，江南文化的价值已存在，并非事前准备，与文意不符，排除；D项“孕育”指怀胎生育，比喻既存的事物中酝酿着新事物，江南文化的价值已存在，并非新事物，与文意不符，排除。\n第二空，代入验证，B项“融汇”指汇聚融合，置于此处既体现江南文化对多元元素的整合，又与“影响”形成逻辑并列，凸显文化对民众生活的渗透与塑造，当选。\n故正确答案为B。\n【文段出处】旅游时报《曹伟明：文化江南——“上善若水”的智慧特质》","no":30,"missingImage":false},{"type":"question","qid":"13504684","cat":"逻辑填空","stem":"历史上的一切医学手段都包含着            的改善身体的愿望。鉴于生命科学对于人类生物学结构和功能的理解仍然非常        ，在脑科学领域尤其如此，故不能指望生物技术在短期内对人类本性做出实质性的改变，但“更好的人类”这个未来的发展趋势已经出现。\n依次填入画横线部分最恰当的一项是：","options":{"A":"显而易见  通俗","B":"尽善尽美  粗浅","C":"朴实无华  晦涩","D":"不言而喻  有限"},"answer":"D","explanation":"第一空，横线处修饰“改善身体的愿望”，医学手段必然是为了改善身体。A项“显而易见”意思是事情或道理很明显，极容易看清，D项“不言而喻”指不用说就可以明白，也形容道理很浅显，均符合文意，保留。B项“尽善尽美”指极其完善，极其美好，形容事物完美到没有一点缺点，C项“朴实无华”指质朴实在而不浮华，均与文意无关，排除。\n第二空，搭配“理解”，且根据“故不能指望生物技术在短期内对人类本性做出实质性的改变”可知，横线处应体现“生命科学对于人类生物学结构和功能的理解”还不够。D项“有限”指有一定的限制，符合文意，当选。A项“通俗”意思是浅显易懂且适合大众的水准，通常用来形容语言表达或内容，与“理解”搭配不当，排除。\n故正确答案为D。\n【文段出处】《演化视野下的人类史分期问题探讨》","no":31,"missingImage":false},{"type":"question","qid":"13504675","cat":"逻辑填空","stem":"综合，意味着包容和吸纳。武术、杂技、魔术等表演“绝活儿”，凡是有益于戏曲创作的，皆可为戏曲所用。当下流行的“跨界融合”，无论是戏曲汲取其他当代艺术元素的创新，还是戏曲给予其他艺术样式灵感与素材，实质上都与中国戏曲综合性艺术特征相        。综合意味着            ，而不是自设边界。\n依次填入画横线部分最恰当的一项是：","options":{"A":"契合 吐故纳新","B":"投合 兼收并蓄","C":"迎合 推陈出新","D":"符合 融会贯通"},"answer":"A","explanation":"第一空，搭配“艺术特征”，且根据前文“综合，意味着包容和吸纳”可知，文段强调“跨界融合”与中国戏曲综合性艺术特征在本质上是相同的，故横线处所填词语要体现出相同、相符之意。A项“契合”指符合，D项“符合”指相合，均符合文意，保留。B项“投合”指相合、合得来，多表述为意气投合、性情投合，与“艺术特征”搭配不当，排除；C项“迎合”指有意使自己的言行或举动适合别人心意，感情色彩偏消极，与文段感情色彩不符，排除。\n第二空，根据“无论是戏曲汲取其他当代艺术元素的创新”以及“意味着······而不是”可知，横线处所填成语与“自设边界”语义相反，强调戏曲应当对外开放，并汲取创新元素，A项“吐故纳新”比喻扬弃旧的，吸收新的，符合文意，当选。D项“融会贯通”指各方面的知识或道理融合贯穿起来，从而得到系统透彻的理解，未提及“汲取创新元素”之意，排除。\n故正确答案为A。\n【文段出处】光明网《戏曲创新 从源头活水到海纳百川》","no":32,"missingImage":false},{"type":"question","qid":"12881999","cat":"逻辑填空","stem":"新文化运动作为一场思想文化领域的革命，实际构建了        传统儒学意识形态的现代意识形态。新文化运动时期形成的社会观、伦理观、中西文化观对        中国现代的社会形态提供了观念性的基础。\n依次填入画横线部分最恰当的一项是：","options":{"A":"赓续 改进","B":"替代 形塑","C":"取用 重构","D":"转换 完善"},"answer":"B","explanation":"第一空，搭配“现代意识形态”，根据文意可知，横线处表达现代意识形态取代了传统儒学意识形态之意，B项“替代”指代替，符合文意，且与“现代意识形态”搭配恰当，保留。A项“赓续”指延续，C项“取用”指拿来使用，采用，均与文意不符，排除；D项“转换”指改变、改换，文段并非表达使传统儒学意识形态发生改变之意，而是强调现代意识形态取代了传统儒学意识形态，与文意不符，排除。\n第二空，代入验证。搭配“社会形态”，B项“形塑”指形成、塑造，与“社会形态”搭配恰当，当选。\n故正确答案为B。\n【文段出处】《欧阳哲生：新文化运动的文献整理与历史诠释——编辑&lt;复兴文库·新文化运动&gt;卷之旨趣》","no":33,"missingImage":false},{"type":"question","qid":"12881997","cat":"逻辑填空","stem":"福建屏南，群峰耸峙、雨量        ，孕育了茂密的竹海，也造就了屏南传统竹木弓箭制作技艺。一代代弓箭工匠，致力于        竹木弓箭制作工艺、        传统竹木射箭运动，让传统体育运动重新焕发光彩。\n依次填入画横线部分最恰当的一项是：","options":{"A":"充足 再现 恢复","B":"充沛 复原 复兴","C":"丰沛 修复 弘扬","D":"充实 还原 振兴"},"answer":"B","explanation":"第一空，横线处所填词语搭配“雨量”，且根据“孕育了茂密的竹海”可知，横线处所填词语需体现出雨量丰富，为屏南的自然环境提供了充足的水分，A项“充足”指足够、充分，B项“充沛”指充足、旺盛，常用于形容精力、感情或雨量，C项“丰沛”指丰富、充足，多用于形容雨水、物产，均符合文意，保留；D项“充实”指丰富、充足（多指内容或人员物力的配备），与“雨量”搭配不当，排除。\n第二空，搭配“制作工艺”，且根据“让传统体育运动重新焕发光彩”可知，横线处所填词语需体现出工匠们努力恢复或重现传统工艺之意，A项“再现”指再次出现，重现，B项“复原”指恢复原状，均符合文意，保留；C项“修复”指修理使恢复完整，多用于破损物品的修复，与“制作工艺”搭配不当，排除。\n第三空，根据“让传统体育运动重新焕发光彩”可知，横线处所填词语需体现出使传统竹木射箭运动重新兴盛之意，B项“复兴”指再次兴盛，符合文意，当选；A项“恢复”仅指回到原有状态，无法体现出“重新兴盛”之意，排除。\n故正确答案为B。\n【文段出处】人民日报《复原制作技艺，复兴传统射箭运动，福建屏南——一张竹木弓的铿锵回响（关注体育产业·工匠精神）》","no":34,"missingImage":false},{"type":"question","qid":"13504428","cat":"逻辑填空","stem":"网络直播本质而言是一种“眼球经济”，极具效仿意味和引导效应。如果本该弘扬正能量、        真善美的镜头，却频频出现打擦边球、违背社会公序良俗的行为，那么长此以往不仅会        直播行业的健康发展，也会        风清气正的环境。\n依次填入画横线部分最恰当的一项是：","options":{"A":"散布 妨碍 损害","B":"撒播 阻挠 腐化","C":"传递 干扰 摧毁","D":"传播 阻碍 侵蚀"},"answer":"D","explanation":"第一空，搭配“真善美”，C项“传递”指由一方交给另一方，D项“传播”指广泛散布、传递，均与“真善美”搭配恰当，保留。A项“散布”指分散到各处或广泛传播，多用于消极语境，如“散布谣言”等，与横线处的感情色彩不符，排除；B项“撒播”一般指把种子均匀地撒在田地里，常搭配具体对象，与“真善美”这一抽象概念搭配不当，排除。\n第二空，根据“却频频出现打擦边球、违背社会公序良俗的行为”可知，横线处应体现不良的网络直播行为对直播行业健康发展产生消极影响之意。C项“干扰”意思是打扰、妨碍，D项“阻碍”指使不能顺利通过或发展，均符合文意，保留。\n第三空，搭配“环境”，且根据前文可知，横线处应体现不良的网络直播行为对风清气正的环境产生不利影响之意。D项“侵蚀”指逐渐侵害使变坏，与“环境”搭配恰当，且符合文意，当选。C项“摧毁”指用强大的力量破坏，“摧毁风清气正的环境”程度过重，排除。\n故正确答案为D。\n【文段出处】人民网《人民艺起评：莫让低俗成为网络直播的标签》","no":35,"missingImage":false},{"type":"question","qid":"13504467","cat":"逻辑填空","stem":"在实现第二个百年奋斗目标的新征程上，我们既拥有了强大的思想伟力、显著的制度优势，积累了        的物质基础、建立了        的产业体系和超大规模的国内市场，又面临着诸多风险挑战，甚至可能遇到难以想象的惊涛骇浪般的        考验。\n依次填入画横线部分最恰当的一项是：","options":{"A":"雄厚 完备 严峻","B":"丰厚 完善 巨大","C":"厚实 完美 严酷","D":"浑厚 完整 重大"},"answer":"A","explanation":"第一空，搭配“物质基础”，且由后文的“超大规模的国内市场”，可知所填词语需体现物质基础很充足的意思，A项“雄厚”指（人力、物力等）充足，B项“丰厚”指丰富、多，C项“厚实”指深厚扎实，均符合文意，保留。D项“浑厚”指朴实厚重，也形容说话、唱歌、朗诵等声音低沉有力，常与“声音、气势、力量”等搭配，与“物质基础”搭配不当，排除。\n第二空，搭配“产业体系”，A项“完备”指应该具备的全部具备，B项“完善”指完备良好，均与“产业体系”搭配恰当，保留。C项“完美”指完备美好，没有缺陷，强调事物没有任何缺点，由后文“面临着诸多风险挑战，甚至可能遇到难以想象的惊涛骇浪般的······考验”可知，当前的产业体系并非完美无瑕，排除。\n第三空，搭配“考验”，且由前文提到\"面临着诸多风险挑战，甚至可能遇到难以想象的惊涛骇浪般的······考验\"可知，这些考验具有极高的难度和挑战性。A项“严峻” 意为严厉、严肃、严重，常与 “考验、挑战、形势” 等搭配，能够突出这些考验的艰难程度高、具有较强的紧迫性，与前文 “诸多风险挑战”“难以想象的惊涛骇浪般” 所营造的紧张、艰难的语境相契合，符合文意，当选。B项 “巨大” 主要侧重于形容规模、数量、程度等方面非常大，比如 “巨大的工程”“巨大的力量” 等，“巨大的考验” 更多强调的是考验在规模或程度上的庞大，无法准确体现出此处所面临考验的艰巨性，与文意不符，排除。\n故正确答案为A。\n【文段出处】《理解伟大建党精神的三个重要维度》","no":36,"missingImage":false},{"type":"question","qid":"13504436","cat":"逻辑填空","stem":"青春的样子，本就是有理想、敢担当、能        、肯奋斗的样子。树立积极的就业观念，到祖国和人民最需要的地方发挥光和热，在乡村振兴、卫国戍边等各领域各方面工作中争当排头兵和生力军，不仅能够留下无悔的青春记忆，而且将在基层        中获得受用终身的精神财富，为走好职业生涯提供            的滋养。\n依次填入画横线部分最恰当的一项是：","options":{"A":"作为 磨难 日久弥新","B":"刻苦 磨练 经久不衰","C":"吃苦 磨砺 源源不断","D":"奉献 磨炼 滔滔不竭"},"answer":"C","explanation":"第一空，搭配“能”，且体现青春的样子。C项“吃苦”指经受艰苦，D项“奉献”指付出，不求回报，均与“能”搭配恰当且符合文意，保留。A项“作为”指建树，成就，通常表述为“有作为”而非“能作为”，排除；B项“刻苦”指肯下苦功夫、能吃苦，为形容词，置于文段用法错误，排除。\n第二空，横线处所填词语体现在基层历练中获得精神财富。C项“磨砺”和D项“磨炼”均指在艰难困苦的环境中锻炼，符合文意，保留。\n第三空，搭配“滋养”，且根据“获得受用终身的精神财富”可知，精神财富可以滋养终身。C项“源源不断”形容接连不断，符合文意，当选。D项“滔滔不竭”意思是像流水一样连续不断，形容话多，与“滋养”搭配不当，排除。\n故正确答案为C。\n【文段出处】人民日报《人民时评：树立正确的就业观》","no":37,"missingImage":false},{"type":"question","qid":"12882002","cat":"逻辑填空","stem":"冠心病、心肌梗塞、脑梗塞、下肢坏死······糖尿病带来的并发症令人痛苦不堪，更麻烦的是，它还会        认知障碍，例如轻度认知损伤和阿尔茨海默病。有研究显示，近十几年来，在死亡的糖尿病患者中，患有认知障碍的        越来越大。因此，亟须找到引发糖尿病患者认知障碍的            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"激发 比值 元凶巨恶","B":"导致 比例 幕后黑手","C":"诱发 比重 罪魁祸首","D":"招致 比率 始作俑者"},"answer":"C","explanation":"第一空，搭配“认知障碍”，根据“糖尿病带来的并发症令人痛苦不堪，更麻烦的是”可知，横线处应体现糖尿病会引发认知障碍这类不好的结果之意，B项“导致”指造成，常用于不好的结果，C项“诱发”指导致发生（多指疾病），D项“招致”指引起（后果），三者均符合文意，保留。A项“激发”指刺激使奋发，常搭配“动能”“活力”等，与“认知障碍”搭配不当，排除。\n第二空，根据“在死亡的糖尿病患者中”可知，横线处应表示在这一范围内患有认知障碍的占比情况，B项“比例”指比重，C项“比重”指一种事物在整体中所占的分量，D项“比率”指比值，均能体现这种占比关系，保留。\n第三空，“因此”引导因果关系，根据“在死亡的糖尿病患者中，患有认知障碍的        越来越大”可知，横线处应体现亟须找到引发糖尿病患者认知障碍的原因，为其预防或治疗提供依据，C项“罪魁祸首”指作恶犯罪的头目，也指灾祸的主要原因，置于此处可以形象地表达出要找到导致认知障碍的主要原因，符合文意，当选。B项“幕后黑手”指在背后起到推动作用的人或力量，常带有较强人为故意、阴谋诡计的意味，D项“始作俑者”比喻第一个做某项坏事的人或恶劣风气的创始人，文段仅强调要找到糖尿病引发认知障碍的原因，而非查找暗中操作的人或者创始人是谁，均与文意不符，排除。\n故正确答案为C。\n【文段出处】科技日报《脂肪中小分子“作恶”，影响糖尿病患者认知》","no":38,"missingImage":false},{"type":"question","qid":"13504468","cat":"片段阅读","stem":"起伏越多越大的地形，越不利于上方气流的稳定，因此，在山地丘陵和城镇的上空，哪怕雷暴云产生了滚轴云，也很容易因地形的扰乱而被迅速破坏。而在广袤、平坦的海洋上空，滚轴云却可以经久不散。同样广袤的内蒙古大草原，看起来也理应利于滚轴云的频繁生成。但是，与大海低空湿润的空气相比，草原低空的空气未必湿润，而暖湿气流是雷暴云生长的基础。如果低空湿度不够，雷暴云即使形成，也难以在低空中形成大量的云体。\n这段文字主要介绍了：","options":{"A":"滚轴云是雷暴云生长的前提","B":"暖湿气流是滚轴云形成的基础","C":"地形和湿度是雷暴云形成的关键","D":"内陆中滚轴云比海洋更少的原因"},"answer":"D","explanation":"文段开篇指出起伏大的地形不利于滚轴云稳定，山地丘陵和城镇上空的滚轴云易被破坏，接着指出海洋上空地形平坦，滚轴云可经久不散。紧接着引出内蒙古大草原，指出草原理应利于滚轴云的频繁生成，随后通过“但是”反驳前文观点，指出草原低空空气湿度不够，难以在低空中形成大量的云体。故文段并列从山地丘陵和城镇地形角度和草原低空的空气湿度两个方面说明内陆比海洋滚轴云少的原因，对应D项。\nA项，文段强调雷暴云对滚轴云形成有影响，“滚轴云是雷暴云生长的前提”因果倒置，排除；\nB项，“暖湿气流”仅对应湿度一个方面，表述片面，排除；\nC项，文段中强调的是内陆与海洋滚轴云形成情况的对比，偏离重点，且文段重点强调“滚轴云”，“雷暴云”偷换概念，排除。\n故正确答案为D。\n【文段出处】中国国家地理《海岛 海上天象奇观的最佳观景台》","no":39,"missingImage":false},{"type":"question","qid":"13504392","cat":"片段阅读","stem":"与工业经济、数字经济相比，生物经济最大的特点是打破了数字经济“赢者通吃”的商业模式，具有资源依赖性强、技术多样性高、市场垄断程度低等特点，为生物资源丰富、生物技术相对落后的国家提供了一次难得的、可能实现跨越式发展的机遇。我国生物资源丰富、市场潜力大，生物技术已有良好基础，做强做大生物经济，不仅能有效缓解甚至最终解决粮食安全、能源安全、环境安全、生物安全等问题，而且能够大幅度提高人民健康水平，推进新一轮经济增长。\n这段文字旨在说明：","options":{"A":"我国生物经济的发展现状与前景研判","B":"全球生物经济演进的规律和发展布局","C":"中国面临生物经济的巨大机遇和挑战","D":"生物经济对构建新发展格局意义重大"},"answer":"A","explanation":"文段开篇引出“生物经济”的话题，详细介绍了生物经济的特点，并指出生物经济“为生物资源丰富、生物技术相对落后的国家提供了一次难得的、可能实现跨越式发展的机遇”。接着指出我国有良好的生物基础，并点明做大做强生物经济，不仅能有效缓解甚至最终解决粮食安全、能源安全、环境安全、生物安全等问题，而且能够大幅度提高人民健康水平，推进新一轮经济增长。故文段重在围绕“生物经济”及“我国”展开论述，强调我国发展生物经济有良好的基础，及做大做强生物经济的好处，对应A项。\nB项，缺少文段核心话题“我国”，且“全球生物经济演进的规律和发展布局”无中生有，排除；\nC项，“中国面临生物经济的挑战”无中生有，排除；\nD项，缺少文段核心话题“我国”，且“新发展格局”无中生有，排除。\n故正确答案为A。\n【文段出处】光明网《我国生物经济发展现状与前景研判》","no":40,"missingImage":false},{"type":"question","qid":"13504490","cat":"片段阅读","stem":"人工智能所带来的智能化和自动化社会发展趋势提升了社会生产效率，并对传统公共管理者的决策和服务角色带来挑战。人工智能作为新型的权利所有者逐渐代替传统公共管理者，作为基于计算逻辑、算法规则和数据的公共管理者参与到社会治理过程之中，从而使未来人工智能场景下的公共管理者角色由“事务性供给”转向“公共性维护”，这一趋势在将传统的公共管理者从社会事务管理中解放出来的同时，也淡化了传统公共管理者在社会中的管理者角色，使社会治理逐渐呈现由自由平等的生产者联合治理的特点。\n这段话所要表达的中心思想是：","options":{"A":"人工智能消除公共权利","B":"人工智能加速生产者联合","C":"人工智能提高技术治理能力","D":"人工智能推动社会自主管理的实现"},"answer":"D","explanation":"文段开篇指出人工智能提升了社会生产效率，同时也为传统公共管理带来了挑战，接着指出人工智能参与到社会治理过程之中，使传统公共管理者角色由“事务性供给”转向“公共性维护”，之后通过“这一趋势”总结前文，指出人工智能对传统公共管理者带来的影响，最后通过因果标志词“使”得出结论，强调人工智能使得社会治理呈现出新特点，即社会治理由自由生产者联合治理，对应D项。\nA项，“消除公共权利”文段并未提及，无中生有，且“消除”程度过重，文段仅为“淡化了传统公共管理者在社会中的管理者角色”，排除；\nB项，文段强调“社会治理”模式的转变，而不是单纯强调生产者联合这一现象本身，偏离文段核心话题，排除；\nC项，“技术治理能力”文段并未提及，无中生有，且文段核心话题为“社会治理”，“技术治理”概念偷换，排除。\n故正确答案为D。","no":41,"missingImage":false},{"type":"question","qid":"13504411","cat":"片段阅读","stem":"历史早期季节体系的发展演变与农事周期之间具有紧密联系。殷商及其以前的“二时”观念是围绕种植粟、黍等农作物的农事活动而产生的一种社会时间，殷商以来对冬小麦的推广种植并使其嵌入到固有的农业结构中，推动了先秦时期人们“四时”观念的萌生与演进。所以，“四时”观念的产生，是在对既有的“二时”观念进一步细化的基础上得以实现的，而冬小麦的推广种植及其在农业生产中重要地位的逐渐凸显，成为人们细化“二时”观念为“四时”观念的契机。\n这段文字主要讲述的是：","options":{"A":"社会时间超过自然时间之外而独立存在","B":"先秦“四时”观念与“二时”观念的联系","C":"冬小麦的推广种植在农业生产中的重要地位","D":"冬小麦的推广种植与先秦“四时”观念的产生"},"answer":"D","explanation":"文段开篇指出历史早期季节体系与农事周期联系紧密，接着说明殷商及其以前的“二时”观念与农事活动相关，随后指出殷商以来冬小麦的推广种植推动了先秦时期“四时”观念的萌生与演进，最后通过结论词“所以”强调冬小麦的推广种植是人们将“二时”观念细化为“四时”观念的契机。故文段主要论述冬小麦的推广种植促进先秦“四时”观念的产生，对应D项。\nA项，“社会时间”对应结论词前的内容“殷商······一种社会时间”，非重点，且“超过自然时间之外而独立存在”文段未提及，无中生有，排除；\nB项未提及文段主题词“冬小麦”，C项未提及文段主题词“四时”，均排除。\n故正确答案为D。\n【文段出处】《小麦的推广种植与先秦时期“四时”观念的强化》","no":42,"missingImage":false},{"type":"question","qid":"13504427","cat":"片段阅读","stem":"在中老年患者中，动脉硬化是个常见病。当血管出现硬化病变后，很多人认为只要将硬化的血管变“软”就可以改善病情。事实上，动脉硬化是以脂质代谢障碍为基础的一类病变，以胆固醇及低密度脂蛋白为主的脂质首先在血管内膜下沉积，然后逐渐在局部形成血栓，进一步通过纤维化及钙化形成动脉硬化斑块，最终导致动脉壁增厚变硬、血管腔狭窄。动脉硬化是一个不可逆的过程，出现硬化后的血管是无法恢复到正常状态的，因此动脉硬化的进程只能延缓，不能逆转。\n这段文字旨在说明：","options":{"A":"硬化的血管难再“软”","B":"老年人难逃动脉硬化","C":"动脉硬化是个常见病","D":"动脉硬化是基础病变"},"answer":"A","explanation":"文段开篇介绍动脉硬化在中老年患者这一群体中是常见病，引出动脉硬化这一话题，接着指出很多人认为将硬化的血管变“软”可以改善病情，随后通过转折词“事实上”介绍动脉硬化的具体形成过程，尾句强调硬化后的血管是无法恢复到正常状态的，最后通过“因此”对前文进行总结，表明动脉硬化的进程只能延缓，不能逆转，即动脉硬化后的血管是无法恢复到“软”状态的，故文段为分总结构，强调硬化后的血管是无法再变“软”的，对应A项。\nB项，“难逃动脉硬化”表述过于绝对，排除；\nC项、D项，分别对应前文“动脉硬化是个常见病”、“动脉硬化是以脂质代谢障碍为基础的一类病变”，为结论前的内容，非重点，均排除。\n故正确答案为A。\n【文段出处】北京青年报《洋葱沙拉、凉拌木耳、保健醋、深海鱼油······竟都是吃了个“寂寞”——原来血管是没办法被软化的》","no":43,"missingImage":false},{"type":"question","qid":"13504494","cat":"片段阅读","stem":"在距今约1.26亿年至7200万年之间，树脂产量和沉积量特别大，地层里的琥珀十分丰富，该时段称为白垩纪树脂时期，比白垩纪树脂时期更早期的琥珀非常稀少，且很少包含生物；白垩纪结束后琥珀数量明显下降，近乎消失，直到6100万年前新生代地层中才开始出现新的琥珀。白垩纪树脂时期全球气候温暖湿润，大气中二氧化碳和甲烷等温室气体含量较高，频繁的火山活动促进气候变暖、改变大气成分，有利于松柏类植物生长，生物活跃、病虫害增加使树木分泌更多树脂，野火频发，促进树脂产生与埋藏，海平面上升使许多内陆低地被淹没，土层中石化树脂被冲刷、搬运、沉积形成琥珀矿藏。\n这段文字主要介绍了白垩纪树脂时期琥珀化石的：","options":{"A":"形态特征","B":"科学价值","C":"形成原因","D":"类别划分"},"answer":"C","explanation":"文段开篇指出白垩纪树脂时期琥珀非常丰富，接着论述这一时期气候温暖湿润、温室气体含量较高，以及频繁的火山活动有利于植物生长，生物活跃、病虫害增加使得树木分泌更多树脂，接着进一步指出，野火频发促进了树脂的产生与埋藏，之后论述海平面的上升使得石化树脂沉积，从而最终形成了琥珀矿藏，故整个文段重点围绕白垩纪树脂时期琥珀化石形成的全过程，介绍了其具体原因，对应C项。\nA项“形态特征”、B项“科学价值”、D项“类别划分”文段均未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】新华网《新研究解析白垩纪琥珀化石丰富的原因》","no":44,"missingImage":false},{"type":"question","qid":"13504413","cat":"片段阅读","stem":"我们都知道很多植物的种子是靠动物来传播的，很多木本植物，喜欢利用鸟类来帮助它们传播种子。但对草本植物来说，有更适合它们的“工具人”——蚂蚁，而这些利用蚂蚁传播种子的植物有一个专有名词——蚁播植物。蚂蚁小，蚁播植物的种子也非常不起眼。原来，草本植物在种子上带了块营养丰富的“肉”，这个“肉”富含蚂蚁所需的油脂或者其他营养成分，而被叫做“油质体”。不管油质体种类是有多么丰富多彩，外形是有多么天差地别，但都逃不了两项原则：既要充当着诱惑蚂蚁的食物，还要作为蚂蚁叼着这些种子的抓手。\n接下来最有可能讲的是：","options":{"A":"蚂蚁如何处理蚁播植物","B":"“油质体”如何充当着诱惑蚂蚁的食物","C":"鸟类如何帮助木本植物传播它们的种子","D":"草本植物的“油质体”被其他植物“偷食”"},"answer":"B","explanation":"本题为接语选择题，应在通读全文的基础上，重点关注文段最后论述的核心话题。文段开篇指出很多植物的种子靠动物来传播，接着通过转折关联词“但”指出草本植物更适合靠蚂蚁传播种子，接着介绍草本植物种子上存在“油质体”，既要充当诱惑蚂蚁的食物，又要作为蚂蚁叼种子的抓手。故文段最后论述的核心话题为“油质体”和“蚂蚁”，且根据逻辑应先论述“油质体”如何作为食物诱惑蚂蚁，对应B项。\nA项“蚂蚁如何处理蚁播植物”、C项“鸟类如何帮助木本植物传播种子”均偏离文段最后论述的核心话题“油质体”，排除；\nD项“其他植物”偏离文段最后论述的核心话题“蚂蚁”，无法和尾句衔接，排除。\n故正确答案为B。\n【文段出处】《什么，蚂蚁竟然也能“种地”？！》","no":45,"missingImage":false},{"type":"question","qid":"13504396","cat":"片段阅读","stem":"从交通出行到餐饮消费，从垃圾分类到噪声治理，群众的日常生活与城市治理息息相关。提升城市治理精细化水平，也是适应城市发展新阶段、新要求，打造宜居、韧性、智慧城市的必然要求。过去5年，我国常住人口城镇化率稳步提升，由大规模增量建设转为存量提质改造和增量结构调整并重。在这样的大背景下，燃气管网、桥梁等如何实现实时监测，红绿灯如何配时，公园绿地如何布局等，都考验着城市治理精细化水平。\n这段文字接下来最可能介绍的是：","options":{"A":"城市治理智能化带来的新问题","B":"如何进行城市软硬件增量建设","C":"城市精细化治理与百姓的关联性","D":"如何提升城市治理的精细化水平"},"answer":"D","explanation":"本题为接语选择题，需通读全文，重点关注文段最后谈论的核心话题。文段开篇引出“城市治理”这一话题，指出群众的日常生活与城市治理息息相关，随后通过“必然要求”强调提升城市治理精细化水平的重要性，并简单介绍过去5年我国城镇化发展情况，尾句通过“在这样的大背景下”对前文总结，强调诸多民生事宜都考验着城市治理精细化水平。故文段最后讨论的核心话题为“城市治理精细化水平”，根据话题一致原则，后文应继续围绕这一话题展开，对应D项。\nA项“城市治理智能化”、B项“城市软硬件增量建设”文段均未提及，无中生有，且均未提及文段最后讨论的核心话题“城市治理精细化水平”，排除；\nC项，文段开头以及尾句已经论述过群众的日常生活与城市精细化治理息息相关，后文不会再继续论述，且未提及文段最后讨论的核心话题“城市治理精细化水平”，排除。\n故正确答案为D。\n【文段出处】人民日报《城市治理要下足绣花功夫（人民时评）》","no":46,"missingImage":false},{"type":"question","qid":"13504682","cat":"片段阅读","stem":"上门代厨、上门收纳整理、上门推拿、上门养老······近年来，各类上门服务新业态涌现，为市场经济输入新鲜血液。但“上门经济”并非只有红利没有烦恼。调查发现，目前“上门经济”面临监管存在盲区、消费者维权难、取证溯源难等问题，亟待加强规范引导。规范是保障行业健康有序发展、维护各方合法权益的基础。只有把规矩立起来，加强规范引导，才能促进“上门经济”良性发展。\n最适合做这段文字标题的是：","options":{"A":"“上门经济”规范有序方能行稳致远","B":"“上门经济”并非只有红利没有烦恼","C":"“上门经济”为市场经济输入新血液","D":"“上门经济”既要敞开门也要守好门"},"answer":"A","explanation":"文段开篇论述各类上门服务新业态涌现给市场经济带来活力，接着通过转折关联词“但”指出“上门经济”存在监管盲区、消费者维权难、取证溯源难等问题，并通过“亟待”提出对策，强调要对其加强规范引导，尾句通过“只有······才”再次强调，确立规矩，加强规范引导才能促进“上门经济”的良性发展。故文段为提出问题—解决问题的结构，重在提对策，强调“上门经济”的发展需加强规范引导，对应A项。\nB项，对应文段问题表述，非重点，排除；\nC项，对应文段开篇部分，为转折前内容，非重点，排除；\nD项，“要敞开门也要守好门”表述不明确，未体现对策“加强规范引导”，偏离文段中心，排除。\n故正确答案为A。\n【文段出处】安徽日报《“上门经济”立规才能长远》","no":47,"missingImage":false},{"type":"question","qid":"13504686","cat":"片段阅读","stem":"我国主要粮食品种供给充足，但在资源和环境双重约束下，构建多元食物供给体系还面临较大压力。现代设施农业包含设施种植、设施畜牧、设施渔业和工厂化育秧设施、粮食烘干设施、仓储冷链物流设施等公共服务设施，可以利用现代信息技术、生物技术、工程装备技术与现代经营管理方式，突破资源、环境和市场的限制，拓宽农业发展时空，缓解粮食生产面临的问题，尽可能规避市场风险。\n与这段文字意思相符的一项是：","options":{"A":"我国设施农业应用广泛，粮食品种供给充足","B":"现代经营管理方式构建了多元食物供给体系","C":"解决育秧难问题，须建设工厂化育秧设施","D":"现代设施农业可以突破资源、环境的制约"},"answer":"D","explanation":"A项，根据“我国主要粮食品种供给充足”可知，“粮食品种供给充足”范围扩大，与文意不符，排除；\nB项，根据“构建多元食物供给体系还面临较大压力”可知，“多元食物供给体系”还没有构建完毕，与文意不符，排除；\nC项，“育秧难问题”文段并未提及，无中生有，排除；\nD项，根据“现代设施农业包含设施种植······突破资源、环境和市场的限制”可知，表述正确，当选。\n故正确答案为D。\n【文段出处】人民日报《因地制宜发展现代设施农业（纵横）》","no":48,"missingImage":false},{"type":"question","qid":"13504488","cat":"语句表达","stem":"从事实际活动的现实的人，是马克思主义的出发点。实现人的自由全面发展是马克思主义的最高价值追求。要坚持以人民为中心，坚持人民主体地位，将人民作为改革与发展的实践主体和核心动力，将实现、维护和发展最广大人民根本利益、                     、促进人的自由全面发展作为改革与发展的根本目的和最高价值，激发人民的历史主动性和创造性，促进社会公正，增进民生福祉，不断实现人民对美好生活的向往，使人民群众有更多的获得感、幸福感、安全感。\n填入画横线部分最恰当的一项是：","options":{"A":"大力发展教育培训","B":"尊重人民各项权利","C":"完善各项法律法规","D":"推动人民参与治理"},"answer":"B","explanation":"本题为语句填空题，横线在文段中间，需联系上下文分析，且横线为所在句子的分句，重点把握句内的衔接。文段首先指出马克思主义这一话题，随后强调马克思主义的最高价值追求是人的自由全面发展，即保证人民的权益和主体性地位。横线前后通过并列形式分别强调“实现、维护和发展最广大人民根本利益”“促进人的自由全面发展”，这三者均是改革与发展的根本目的和最高价值，即“坚持以人民为中心，坚持人民主体地位”。故横线处也应体现重视“人民”的主体性地位。后文又提到“增进民生福祉，不断实现人民对美好生活的向往，使人民群众有更多的获得感、幸福感、安全感”，即要实现人的利益与权益，对应B项。\nA项“大力发展教育培训”，C项“完善各项法律法规”，均没有提及与人民相关的话题，排除；\nD项“推动人民参与治理”这一对策文段并未提及，且横线处应体现改革与发展的目的和价值，并非改革与发展的具体做法，表述错误，排除。 \n故正确答案为B。","no":49,"missingImage":false},{"type":"question","qid":"13504433","cat":"片段阅读","stem":"典籍版本资源有多种形式。除书籍外，印刷古籍的雕版，有文字记录的简帛、金石器物、石刻、碑刻、拓本、绘画、纸币、档案及近代以来各种类型的媒介等，均可纳入典籍版本资源的范畴。从广义上来说，凡是能够印证中华文明、以物证史、以物叙史、可以直观感受或触摸的实物，都可视为典籍版本资源。典籍版本资源是中华文明的“活化石”，是中国历史不绝如缕、一脉相承的“见证人”，也是中国文化影响世界的“实证者”。它为全面深入了解中华文明提供了一把钥匙，具有不可比拟的独特优势，在推动建设中华民族现代文明方面发挥着重要作用。\n这段文字重在讨论典籍版本：","options":{"A":"资源范畴与文化价值","B":"文献属性与社会作用","C":"形式类型与历史意蕴","D":"实物来源与优势地位"},"answer":"A","explanation":"文段开篇介绍典籍版本资源具有多种形式，包括书籍、雕版、简帛等，从广义上来说凡是能印证中华文明的实物都可视为典籍版本资源。此部分重点论述了典籍版本的资源范畴。随后介绍典籍版本资源是中华文明的“活化石”、是中国历史的“见证人”、是中国文化影响世界的“实证者”，为全面深入了解中华文明提供了钥匙，在推动建设中华民族现代文明方面发挥着重要作用。此部分重点强调典籍版本的文化价值。故文段为并列结构，分别论述了典籍版本的资源范畴及其文化价值，对应A项。\nB项，文段并未提及典籍版本的“文献属性”，无中生有，排除；\nC项，“历史意蕴”对应文段“是中国历史不绝如缕、一脉相承的‘见证人’”，仅为“文化价值”的一部分，表述片面，排除；\nD项，“实物来源”文段并未提及，且“优势地位”相比于“文化价值”表述不明确，排除。\n故正确答案为A。\n【文段出处】社科院专刊总第674期《发挥典籍版本资源作用推动建设中华民族现代文明》","no":50,"missingImage":false},{"type":"question","qid":"13504390","cat":"片段阅读","stem":"中国科学院大气物理研究所开发的起沙模型很好地模拟出了2001年至2017年东亚沙尘暴频次的年际变化和减弱趋势，模拟的起沙通量与观测的沙尘天数具有很好的相关关系，相关系数达0.75。从变化的原因来看，沙尘源区上地表风速减弱、植被覆盖增加、土壤变湿均起到了重要作用，贡献率分别为46%、30%、24%。可见，风速减弱起主导作用，而植被覆盖增加和土壤变湿也有关键作用。\n由此可以推知：","options":{"A":"沙尘暴的起因有三方面","B":"起沙模型还有提升空间","C":"风速减弱属于人为因素","D":"增加植被覆盖率能够减弱沙尘暴"},"answer":"D","explanation":"A项，文段并未介绍“沙尘暴的起因”，文段介绍的是2001-2017年沙尘暴频次的年际变化和减弱趋势的原因，无中生有，排除；\nB项，文段并未提及起沙模型是否还有提升空间，无中生有，排除；\nC项，文段并未提及风速减弱属于人为因素，无中生有，排除；\nD项，根据“中国科学院大气物理研究所开发的起沙模型很好地模拟出了2001年至2017年东亚沙尘暴频次的年际变化和减弱趋势，······从变化的原因来看，沙尘源区上地表风速减弱、植被覆盖增加、土壤变湿均起到了重要作用，贡献率分别为46%、30%、24%。可见风速减弱起主导作用，而植被覆盖增加和土壤变湿也有关键作用”可知，增加植被覆盖率能够减弱沙尘暴，当选。\n故正确答案为D。\n【文段出处】中国科学院《大气所等揭示近20年来东亚沙尘暴活动减弱的原因》","no":51,"missingImage":false},{"type":"question","qid":"13504492","cat":"片段阅读","stem":"隐私计算作为一项可以实现数据在流转过程中“可用不可见”的技术，其价值被快速发掘并放大，成为数据安全、数据保护市场的关注焦点。隐私计算为解决数据存证、数据流通安全及隐私保护等问题提供了基础支撑，为海量复杂数据要素的全面流通提供了坚实的技术保障。这使隐私计算等技术成为驱动金融科技纵深发展的重要引擎。然而，隐私计算也面临着算力挑战。未来应重点探索隐私计算安全、性能、效果的平衡与统一，构建高安全、高效率、高可能的数据流通生态，实现隐私计算扩大应用落地范围，更好地推动数字经济发展。\n这段文字未谈论隐私计算的：","options":{"A":"应用前景","B":"技术保障","C":"发展难题","D":"发展方向"},"answer":"B","explanation":"A项，根据“隐私计算为解决数据存证、数据流通安全及隐私保护等问题提供了基础支撑······这使隐私计算等技术成为驱动金融科技纵深发展的重要引擎”可知，“应用前景”文段已谈论，排除；\nB项，根据“隐私计算为解决数据存证、数据流通安全及隐私保护等问题提供了基础支撑，为海量复杂数据要素的全面流通提供了坚实的技术保障”可知，隐私计算是海量复杂数据要素全面流通的技术保障，但文段并未提及隐私计算的技术保障，无中生有，当选；\nC项，根据“然而，隐私计算也面临着算力挑战”可知，“发展难题”文段已谈论，排除；\nD项，根据“未来应重点探索隐私计算安全、性能、效果的平衡与统一······实现隐私计算扩大应用落地范围，更好地推动数字经济发展”可知，“发展方向”文段已谈论，排除。\n本题为选非题，故正确答案为B。","no":52,"missingImage":false},{"type":"question","qid":"13504495","cat":"语句表达","stem":"①这种电池可以被用于驱动各种低功率、一次性可丢弃的电子器件\n②加上一点水，纸带上的盐会溶解，释放出带电离子，这些离子在纸带上弥散激活电池组\n③纸张和锌的生物可降解性，使这种电池能够最大程度减少可丢弃、低功率电子器件带来的环境影响\n④纸带上分布着氯化钠，纸带较短端浸了蜡，含有石墨薄片的油墨印制在纸带一面，有锌粉的油墨印制在纸带的另一面\n⑤一种新电池，主要由一个1平方厘米的电池单元组成，还包含3种印在长方形纸带上的油墨\n⑥这种油墨将电池组正负极和两根电线连接起来，电线位于有蜡的那端\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑤①⑥④②③","B":"⑤③④⑥①②","C":"⑤④⑥②①③","D":"⑤⑥④③②①"},"answer":"C","explanation":"观察选项，首句均为⑤句，可通过对比⑤句之后的内容进行判断。⑤句引出“新电池”的话题，并介绍了其主要组成部分，包括1平方厘米的电池单元以及印在长方形纸带上的3种油墨，⑤句之后有①、③、④、⑥四个句子。①句介绍的是“这种电池”的功用范围，①句解题线索不明显；④句详细描述了纸带的物质分布情况，包括纸带较短端浸了蜡以及纸带两面分别印制有含石墨薄片和锌粉的油墨，而③句介绍了纸张和锌的生物可降解性对电池性能的影响，根据逻辑顺序，应先指出纸带上有“锌”再论述其具体作用，故④句在③句之前，排除B项；⑥句介绍的是油墨的功能及“电线位于有蜡的那端”，根据逻辑顺序，应先指出纸带上有油墨和蜡，之后再论述油墨的功能及与“蜡”相关内容，故④句在⑥句之前，排除A、D两项，锁定C项。\n验证C项，⑤句引出话题，介绍新电池的组成部分，④⑥②三句对新电池组成部分及如何激活电池组作了介绍，①③两句对新电池的优势作了阐述，逻辑恰当，当选。\n故正确答案为C。\n【文段出处】光明网《加点水，激活纸电池》","no":53,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"13504547","cat":"数学运算","stem":"某研究机构对不同蔬果的代谢质量进行评分，分数越高代表代谢质量越高。现有13种蔬果，其中2种蔬果为5分，4种蔬果为4分，3种蔬果为3分，4种蔬果为2分，那么从中选取3种蔬果得分总和不低于13分的组合共有多少种？","options":{"A":"21","B":"19","C":"16","D":"13"},"answer":"B","explanation":"选取3种蔬果得分总和不低于13分，则分数组合有（5、5、4）、（5、5、3）、（5、4、4）三类情况，分类讨论情况数：\n①选取两个5分、一个4分，有\u003cimg data-k=\"e79bff1207ee\">种情况；\n②选取两个5分、一个3分，有\u003cimg data-k=\"258f31bb4b55\">种情况；\n③选取一个5分、两个4分，有\u003cimg data-k=\"f680fdcc63ba\">种情况。\n则得分总和不低于13分的组合共有4+3+12=19种。\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"13504430","cat":"数学运算","stem":"小明在网络二手交易平台按照每张150元的价格转手了两张珍藏版CD，其中一张盈利25%，另一张亏损25%，则小明转手这两张CD总的盈亏情况是：","options":{"A":"不盈不亏","B":"盈利20元","C":"亏损20元","D":"亏损25元"},"answer":"C","explanation":"每张CD转手价格为150元，则盈利25%的CD原价为\u003cimg data-k=\"e4d0761d556d\">元；亏损25%的CD原价为\u003cimg data-k=\"5c63cf679783\">元。可得小明购买两张CD原价为120+200=320元，转手价格为150×2=300元，亏损了20元钱。\n故正确答案为C。","no":55,"missingImage":false},{"type":"question","qid":"13504438","cat":"数学运算","stem":"某企业到A大学招聘，小张、小李和小王3位毕业生前去应聘。若小张、小李2人中至少有1人签约的概率是\u003cimg data-k=\"170ce8fc8ae0\">，小王签约的概率是\u003cimg data-k=\"5ef3a129e326\">，那么3人中至少有1人签约该企业的概率是多少？","options":{"A":"\u003cimg data-k=\"62886ffdfcd1\">","B":"\u003cimg data-k=\"54d707f15b45\">","C":"\u003cimg data-k=\"ff1b1de9ab8e\">","D":"\u003cimg data-k=\"7dc7ea6810bf\">"},"answer":"D","explanation":"方法一：由题意分类讨论可得：\n\u003cimg data-k=\"0308bb5dc85a\" style=\"max-width:612px\">\n则3人中至少有1人签约该企业的概率为：\u003cimg data-k=\"2ab72b1acd22\">\u003cimg data-k=\"ae039230228c\">。\n方法二：本题也可反向思考，即计算3人均未签约的概率，均未签约的概率\u003cimg data-k=\"6aa087d63a97\">，则3人中至少有1人签约该企业的概率\u003cimg data-k=\"2326865a3969\">。\n故正确答案为D。","no":56,"missingImage":false},{"type":"question","qid":"13504481","cat":"数学运算","stem":"某地军工驿站就业直通车送6名工人到A、B、C三个开发区务工，实现从“家门”直达“厂门”就业。若A开发区至少需要2名工人，B、C开发区至少各安排1名工人，每名工人只能去其中的一个开发区，则共有多少种不同的安排方法？","options":{"A":"180","B":"320","C":"345","D":"360"},"answer":"D","explanation":"根据题目要求，分类讨论如下：\n（1）A区4人，则B区、C区各1人：有\u003cimg data-k=\"b1efdbae40c2\">种情况；\n（2）A区3人，则B区2人、C区1人或B区1人、C区2人：有\u003cimg data-k=\"f5f12a81bc74\">种情况；\n（3）A区2人，则：\n①B区3人、C区1人或B区1人、C区3人：有\u003cimg data-k=\"b9ea1646057a\">种情况；\n②B区、C区各2人：有\u003cimg data-k=\"4c13d4796e0b\">种情况。\n综上，共有30+120+120+90=360种不同的安排方法。\n故正确答案为D。","no":57,"missingImage":false},{"type":"question","qid":"13504431","cat":"数学运算","stem":"某小区组织“情满金秋”柑橘采摘活动，参加人员按年龄分成老、中、青三组，老年组、中年组的人数之比为5：2，中年组、青年组的人数之比为3：4。老年组、中年组、青年组平均每人采摘速度之比为1：2：3。已知青年组共采摘80斤柑橘，那么三组人员一共采摘柑橘：","options":{"A":"170斤","B":"212斤","C":"255斤","D":"298斤"},"answer":"A","explanation":"根据题干“老年组、中年组的人数之比为5：2，中年组、青年组的人数之比为3：4”，则老年组、中年组、青年组的人数之比为15：6：8，设老年组、中年组、青年组的人数分别为15a、6a、8a，根据题干“老年组、中年组、青年组平均每人采摘速度之比为1：2：3”，设老年组、中年组、青年组平均每人采摘速度分别为b、2b、3b，由题意得，青年组一共采摘8a×3b=80，解得\u003cimg data-k=\"a31f6740b2c9\">。老年组与中年组共采摘的柑橘重量为\u003cimg data-k=\"04ecf7995256\">\u003cimg data-k=\"fdaf08315e9d\">斤，故三组人员一共采摘的柑橘重量为90+80=170斤。\n故正确答案为A。","no":58,"missingImage":false},{"type":"question","qid":"13504498","cat":"数学运算","stem":"21分制的羽毛球比赛，每赢一球得1分，下一球由上一球得分方发球，20：20平局以后，先多得2分的一方获胜，若甲发球时甲得分的概率为0.6、乙发球时乙得分的概率为0.7，各球的结果相互独立，乙将比分追成20：20平后，甲最终以23：21的比分获胜的概率在以下哪个范围？","options":{"A":"0.05-0.1","B":"0.1-0.15","C":"0.15-0.2","D":"0.2-0.25"},"answer":"A","explanation":"根据题意可知，甲发球时甲得分的概率为0.6，则甲发球时乙得分的概率为1-0.6=0.4；乙发球时乙得分的概率为0.7，则乙发球时甲得分的概率为1-0.7=0.3。根据题意，乙将比分追成20：20平后，甲最终以23：21的比分获胜，则后续还要进行4次发球，乙将比分追平，第1次乙发球，乙仅有一次得分在第1次或第2次，甲第3次和第4次一定得分，分情况讨论如下：\n\u003cimg data-k=\"bf476e87be74\" style=\"max-width:646px\">\n则乙将比分追成20：20平后，甲最终以23：21的比分获胜的概率为0.0756+0.0216=0.0972，在A项0.05-0.1的范围内。\n故正确答案为A。","no":59,"missingImage":false},{"type":"question","qid":"12881893","cat":"数学运算","stem":"某展览馆最多可以容纳1040人。该展览馆有A、B、C三个逃生出口，其中A出口每分钟可以通过150人，B出口每分钟可以通过100人，C出口每分钟可以通过80人，从A、B、C出口到达安全疏散点分别还需要1分钟、3分钟、2分钟。那么展览馆在满员情况下，全部人员紧急疏散到安全疏散点至少需要多少分钟？","options":{"A":"7","B":"6","C":"5","D":"4"},"answer":"C","explanation":"根据题意可知，全部人员紧急疏散到安全疏散点的时间=人员通过出口逃生时间+从出口到达安全疏散点的时间，从A、B、C出口到达安全疏散点分别需要1分钟、3分钟、2分钟。设至少需要n分钟，才可将全部人员疏散，根据三个出口疏散人员数相加为总人数，可列式：150（n-1）+100（n-3）+80（n-2）=1040，解n=5，即全部人员紧急疏散到安全疏散点至少需要5分钟。\n故正确答案为C。","no":60,"missingImage":false},{"type":"question","qid":"13504523","cat":"数学运算","stem":"某三层高的露天平台每层可视作圆柱体（如下图所示）。已知每层高5米，下层直径100米，中层直径80米，上层直径68米，现要对平台的外表面进行清洁维护，共需要维护多少平方米？\n\u003cimg data-k=\"ee28f5c19327\" style=\"max-width:432px\">","options":{"A":"\u003cimg data-k=\"f2fa866028c7\">","B":"\u003cimg da
