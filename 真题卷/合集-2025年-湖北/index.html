-k=\"40804029ea6c\">。当y=14时，x=21，不满足\u003cimg data-k=\"750e8345b683\">，排除；当y=7时，x=11，满足条件，则甲单位男性职工数为11人，乙单位男性职工数为7人。现要从甲、乙单位选出3名男性参加某个会议，每个单位至少选1人。有以下两种情况：\n①甲单位选1名男性，乙单位选2名男性，有\u003cimg data-k=\"21888d4d5ac2\">种不同的选择方式；\n②甲单位选2名男性，乙单位选1名男性，有\u003cimg data-k=\"209944fd24e1\">种不同的选择方式。\n分类用加法，则共有231+385=616种不同的选择方式。\n故正确答案为B。","no":57,"missingImage":false},{"type":"question","qid":"11542806","cat":"数学运算","stem":"从A地前往B地的高速公路总长度为1000千米，途中每100千米设置一个充电站。甲驾驶满电的新能源汽车从A地前往B地，车辆在高速公路上的续航里程为350千米，如果甲希望以最少的充电次数到达B地，则他充电的位置选择有多少种不同的组合？","options":{"A":"6","B":"10","C":"16","D":"24"},"answer":"B","explanation":"根据“从A地前往B地的高速公路总长度为1000千米，途中每100千米设置一个充电站”，可知途中充电站的位置分别在100千米、200千米······900千米处，共9个充电站。由于车辆在高速公路上的续航里程为350千米，但充电站均设置在整百千米处，因此最多驾驶300千米便要充一次电，\u003cimg data-k=\"da4d093929a7\">次······100千米，即甲最少需要充电3次方可到达B地，3次充电的位置选择枚举如下：\n\u003cimg data-k=\"c6870323a68f\" style=\"max-width:384px\">\n综上可知，甲充电的位置选择有10种不同的组合。\n故正确答案为B。","no":58,"missingImage":false},{"type":"question","qid":"11542807","cat":"数学运算","stem":"某单位实行“前台受理、后台办理”经办模式。某天早上，甲、乙、丙三名后台经办人员的待办事项数量之比为1：2：3，当天不再新增待办事项。三人同时开工，经过2小时后，甲完成的事项数量是乙未完成的二分之一，乙完成的事项数量是丙未完成的三分之一，丙完成的事项数量等于甲未完成的。那么再经过多少分钟，甲可以完成自己的所有待办事项？","options":{"A":"60","B":"75","C":"90","D":"120"},"answer":"C","explanation":"设开工前甲、乙、丙三名后台经办人员的待办事项数量分别为x、2x、3x，三人同时开工2小时后，甲未完成的事项数量为a，则甲完成的事项数量为x-a，乙未完成的事项数量为2(x-a)，乙完成的事项数量为2x-2(x-a)=2a，丙完成的事项数量为a，丙未完成的事项数量为2a×3=6a，如下表所示：\n\u003cimg data-k=\"3903737b7c43\" style=\"max-width:506px\">\n则有a+6a=3x，整理可得\u003cimg data-k=\"92e2425b93e4\">，即开工2小时（120分钟）后，甲未完成的事项数量为\u003cimg data-k=\"ab2a188f9aa0\">，完成的事项数量为\u003cimg data-k=\"856a04a0be70\">。设再经过t分钟甲可以完成自己的所有待办事项，根据工作效率不变，工作总量和工作时间成正比，可得\u003cimg data-k=\"e27075de58e9\">，解得t=90。\n故正确答案为C。","no":59,"missingImage":false},{"type":"question","qid":"11542800","cat":"数学运算","stem":"大学生小陈和小刘同时做一套模拟题，小陈的正确率为75%，小刘只答错了5道，并且两人都答错的题数占总题数的六分之一，两人都答对的题超过一半。问小陈答对而小刘答错的题有多少道？","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"A","explanation":"根据“小陈的正确率为75%”，因\u003cimg data-k=\"1df90b0d06c0\">，可得总题数为4的倍数；根据“两人都答错的题数占总题数的六分之一”，可得总题数为6的倍数，故设总题数为12x道，则两人都答错\u003cimg data-k=\"8bfbd7df7c0b\">道，又因小刘只答错了5道，故\u003cimg data-k=\"4756def0b764\">，x可取值为1、2。\n若x=1，则总题数为12x=12道，两人都答错2x=2道，小刘答错5道，小陈答错12×（1-75%）=3道，根据两集合容斥原理公式：\u003cimg data-k=\"dea5bfadb80d\">，可得两人总共答错5+3-2=6道，则两人都答对的题数占总题数的\u003cimg data-k=\"7e9e5b58e031\">，并未超过总题数的一半，排除；\n若x=2，则总题数为12x=24道，两人都答错2x=4道，小刘答错5道，小陈答错24×（1-75%）=6道，则两人总共答错5+6-4=7道，两人都答对24-7=17道，占总题数的\u003cimg data-k=\"d0d0d9c1c210\">，超过总题数的一半；小陈答对的题数为24×75%=18道，则小陈答对而小刘答错的题有18-17=1道。\n故正确答案为A。","no":60,"missingImage":false},{"type":"question","qid":"11542813","cat":"数学运算","stem":"某工程可交给甲、乙两个工程队完成，两个工程队周一到周五工作，周六、日休息，甲队从11月4日（周一）开始工作，乙队从11月12日开始加入一起工作。截至11月13日下班，工程完成了25%；截至11月21日下班，工程完成了一半。问该工程将于哪天完成？","options":{"A":"12月12日","B":"12月11日","C":"12月10日","D":"12月9日"},"answer":"D","explanation":"根据题意，甲、乙两队工作和休息的情况如下表所示：（“×”表示休息）\n\u003cimg data-k=\"73238047f048\" style=\"max-width:628px\">\n方法一：结合表格可得，截至11月13日下班，甲队工作8天，乙队工作2天，工程完成了25%；截至11月21日下班，甲队工作14天，乙队工作8天，工程完成了一半，可知还剩一半工程，且甲、乙两队效率关系为：2×（8甲+2乙）=14甲+8乙，整理可得甲=2乙。赋值甲队效率为2，乙队效率为1，则剩余工程量为14×2+8×1=36，还需\u003cimg data-k=\"948fdf10314f\">个工作日完成。11月22日为周五，11月22日-30日共6个工作日，则再过12-6=6个工作日，即12月9日完成。\n方法二：根据截至11月13日下班，工程完成了25%；截至11月21日下班，工程完成了一半，可知还剩一半工程，结合表格可得，11月14日-21日，甲、乙两队合作6天完成了\u003cimg data-k=\"670a0106f7c1\">，则每天完成\u003cimg data-k=\"98d6178c950b\">，剩余工程还需\u003cimg data-k=\"d59248b1b361\">个工作日完成。11月22日为周五，11月22日-30日共6个工作日，则再过12-6=6个工作日，即12月9日完成。\n故正确答案为D。","no":61,"missingImage":false},{"type":"question","qid":"11542812","cat":"数学运算","stem":"小明老家有一块三角形空地，已知该三角形是直角三角形且斜边长为\u003cimg data-k=\"90bb6497cd08\">千米，其中一条直角边正好是另一条直角边的小数部分，问该空地的面积为多少平方千米？","options":{"A":"0.75","B":"1","C":"1.5","D":"2"},"answer":"A","explanation":"根据题意，设该三角形空地较长的直角边为（x+y）千米（x为正整数，0&lt;y&lt;1），较短的直角边为y千米，则该空地的面积\u003cimg data-k=\"525fa393005b\">\u003cimg data-k=\"aa003b4a4e17\">平方千米。根据直角三角形斜边长为\u003cimg data-k=\"90bb6497cd08\">千米，结合勾股定理可列式：\u003cimg data-k=\"f87754125569\">，整理可得\u003cimg data-k=\"79fb6dd0aa30\">，则\u003cimg data-k=\"bab0a52d726f\">，该空地的面积\u003cimg data-k=\"5f756d124a9b\">\u003cimg data-k=\"f54a0fb69a18\">平方千米。\n\n代入A项：若\u003cimg data-k=\"a19b67df36df\">，解得x=3，则面积\u003cimg data-k=\"30018f4df904\">，\u003cimg data-k=\"66d6507f12c3\">，可得y&lt;1，满足题干条件，当选；\n代入B项：若\u003cimg data-k=\"4d084b1d8ca9\">，解得\u003cimg data-k=\"366347515b00\">，x非整数，排除；\n代入C项：若\u003cimg data-k=\"7de995449220\">，解得\u003cimg data-k=\"8bffd25debbd\">，x非整数，排除；\n代入D项：若\u003cimg data-k=\"6071ade09e89\">，解得x=2，则面积\u003cimg data-k=\"306d05d04a3a\">，\u003cimg data-k=\"e37c629982c4\">，可得y&gt;1，不满足题干条件，排除。\n故正确答案为A。","no":62,"missingImage":false},{"type":"question","qid":"11542822","cat":"数学运算","stem":"小张、小王、小李是3名健身爱好者，按以下规律坚持健身：小张每健身2天休息1天；小王每健身3天休息2天；小李每健身5天休息3天。某年3月，小张、小王、小李分别从2日、3日、4日开始健身。问当年3月，三人均健身的日子有几天？","options":{"A":"7","B":"8","C":"9","D":"10"},"answer":"C","explanation":"根据题意，列表如下，其中“√”代表去健身，“×”代表休息。\n\u003cimg data-k=\"90c5b06d4b8f\" style=\"max-width:599px\">\n可知，当年3月，三人均健身的日子有5日、8日、14日、15日、20日、23日、24日、29日、30日，共9天。\n故正确答案为C。","no":63,"missingImage":false},{"type":"question","qid":"11542821","cat":"数学运算","stem":"从足够量的桃子、李子、橘子、柿子中选取2025个水果装成一车，要求选取的桃子的数量是5的倍数，李子数是7的倍数，橘子最多6个，柿子最多4个，桃子李子必须都有。问有多少种不同的装法？","options":{"A":"2013","B":"2014","C":"2015","D":"2016"},"answer":"B","explanation":"根据题干条件可知，桃子数量为5的倍数即\u003cimg data-k=\"e5ebad667b57\">个，柿子数量不超过4个即0~4个，设桃子与柿子总数为x；李子数量为7的倍数即\u003cimg data-k=\"1102ca022ea0\">个，橘子数量不超过6个即0~6个，设李子与橘子总数为y。则x+y=2025。分析x与y的取值：\n\u003cimg data-k=\"d2aaf7b41e1e\" style=\"max-width:570px\">\n故满足条件的装法共2024-4-6=2014种。\n故正确答案为B。","no":64,"missingImage":false}],"count":19,"answerable":19,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"15419028","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"a38b7ff17df1\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，优先考虑属性规律。观察发现，每幅图形内部均存在一个轴对称的面，且外框也均为轴对称图形，分别画出两者的对称轴，发现两条对称轴的关系为平行、垂直交替出现，则？处两条对称轴的关系应为垂直，只有D项符合。\n\u003cimg data-k=\"d3c4efb64345\" style=\"max-width:525px\">\n故正确答案为D。","no":65,"missingImage":false},{"type":"question","qid":"15419024","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"dddbf2157539\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成基本相同，但位置规律不明显，考虑相邻比较。观察发现，如下图所示，图1和图2有5个位置的黑三角形相同，图2和图3有5个位置的黑三角形相同，题干其他图形也均满足此规律，故？处图形应该和图5有5个位置的黑三角形相同（且题干所有图形左下角和右上角的黑三角形均相同），只有A项符合。\n\u003cimg data-k=\"ee361cf42d97\" style=\"max-width:600px\">\n故正确答案为A。","no":66,"missingImage":false},{"type":"question","qid":"15419020","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"c44f764448f7\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成相同，但无位置规律和属性规律，考虑数量规律。观察发现，题干图形中黑白球分堆明显，考虑部分数。第一组图中，白球的部分数均为2，每一部分的个数分别为（3、9），（4、8），（5、7）；第二组图中，前两幅图黑球的部分数均为2，每一部分的个数分别为（3、9），（4、8），故？处图形的黑球也应该为两个部分，且每一部分的个数分别为（5、7），只有D项符合。\n故正确答案为D。","no":67,"missingImage":false},{"type":"question","qid":"15419022","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"6df2a428f2d6\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"解析一：元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形分割明显，考虑面数量，但没规律；继续观察发现，题干图形均由多个面拼接而成，考虑图形间关系。第一组图中，面彼此挨在一起，第二组图形中，面①将其中1个面和另外3个面完全隔开，只有B项符合。\n\u003cimg data-k=\"51f1aac2ebe6\" style=\"max-width:600px\">\n解析二：元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形分割明显，考虑面数量，但没规律；继续观察发现，只考虑内部线条的情况下，第一组图的内部线条为一部分，第二组图的内部线条为两部分，且有一部分线条是一笔画，只有B项符合。\n故正确答案为B。","no":68,"missingImage":false},{"type":"question","qid":"15419026","cat":"图形推理","stem":"以下除哪一项外，均为同一正方体纸盒的外表面展开图？\n\u003cimg data-k=\"714c39fba8a8\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"各选项面都相同，如下图所示，在四个选项中，均以黑色方块的直角顶点为起始点，沿着黑色方块所在面顺时针画边，逐一进行分析。\n\u003cimg data-k=\"082ac3e20db3\" style=\"max-width:600px\">\nA项：边1挨着白色直角三角形；\nB项：边1挨着白色直角三角形；\nC项：边1挨着白色直角三角形；\nD项：边1没有挨着白色直角三角形。\n综上，只有D项与其他三项不同。\n本题为选非题，故正确答案为D。","no":69,"missingImage":false},{"type":"question","qid":"15419025","cat":"定义判断","stem":"有氧运动是人体以有氧代谢为主要供能方式，在较长时间里有节奏地锻炼躯干、四肢等部位大肌群的全身运动。\n根据上述定义，以下属于有氧运动的是：","options":{"A":"老王每周一、三、五慢跑40分钟，二、四、六游泳50分钟以上","B":"小王几乎每天都要拉十几下单杠，然后操起哑铃或杠铃进行力量训练","C":"小刘上大学以来坚持每天早上做20个俯卧撑，晚上做20次仰卧起坐","D":"老张坚持单脚站立、提踵踮脚尖等身体运动，每周3次，每次30分钟"},"answer":"A","explanation":"第一步：找出定义关键词。\n“以有氧代谢为主要供能方式”、“在较长时间里有节奏地锻炼躯干、四肢等部位大肌群的全身运动”。\n第二步：逐一分析选项。\nA项：慢跑和游泳是以有氧代谢为主的运动，符合“以有氧代谢为主要供能方式”，老王每次运动时间均超过40分钟，且慢跑和游泳属于全身运动，符合“在较长时间里有节奏地锻炼躯干、四肢等部位大肌群的全身运动”，符合定义，当选；\nB项：拉单杠、举哑铃和杠铃主要锻炼的是上肢力量，不符合“在较长时间里有节奏地锻炼躯干、四肢等部位大肌群的全身运动”，不符合定义，排除；\nC项：俯卧撑主要锻炼上肢力量，仰卧起坐主要锻炼腹部力量，不符合“在较长时间里有节奏地锻炼躯干、四肢等部位大肌群的全身运动”，不符合定义，排除；\nD项：单脚站立和提踵踮脚尖主要锻炼的是下肢力量，不符合“在较长时间里有节奏地锻炼躯干、四肢等部位大肌群的全身运动”，不符合定义，排除。\n故正确答案为A。","no":70,"missingImage":false},{"type":"question","qid":"15419032","cat":"定义判断","stem":"封山育林是利用森林自我更新能力，对林区实行划界封禁，在一定时间内禁止垦荒、放牧、采伐、砍柴等人为活动，以保证林木繁殖生长的育林方式，有三种封法，一是全封，即较长时间（5至10年）的全林区封育；二是半封，在林木主要生长季节封育；三是轮封，将整个林区划片分段，实行轮流封育。\n根据上述定义，以下为半封的是：","options":{"A":"Q省30个国有林场封山育林9千多万公顷，争取用5年建成现代林场","B":"S市长乐林区所辖西山林场正值封育时期，林区树木苍翠植被恢复良好","C":"H省大青山有10万亩原始次生林，每年10月至次年6月实行封山防火","D":"J市在郊区5座连绵起伏的山上，新造幼林并建立林长和护林员巡护制"},"answer":"C","explanation":"第一步：找出定义关键词。\n封山育林：“利用森林自我更新能力，对林区实行划界封禁”、“在一定时间内禁止垦荒、放牧、采伐、砍柴等人为活动”、“以保证林木繁殖生长的育林方式”；\n全封：“较长时间（5至10年）的全林区封育”；\n半封：“在林木主要生长季节封育”；\n轮封：“将整个林区划片分段，实行轮流封育”。\n第二步：逐一分析选项。\nA项：国有林场封山育林，争取用5年建成现代林场，符合“较长时间（5至10年）的全林区封育”，符合“全封”定义，不符合“半封”定义，排除；\nB项：西山林场封育时期林区树木苍翠植被恢复良好，没有明确说明封育时间，不符合“在林木主要生长季节封育”，不符合“半封”定义，排除；\nC项：大青山每年10月至次年6月实行封山防火，给出了封山的具体时间段，符合“在林木主要生长季节封育”，符合“半封”定义，当选；\nD项：新造幼林并建立林长和护林员巡护制，并未提及封育，不符合“在林木主要生长季节封育”，不符合“半封”定义，排除。\n故正确答案为C。","no":71,"missingImage":false},{"type":"question","qid":"15419036","cat":"定义判断","stem":"内容管理是指在信息时代，借助信息技术，对各种形式的内容进行创建、存储、分享、应用、检索，并在个人、企业、组织、业务、战略等方面产生价值的过程。内容管理涉及的内容可以是文本、图形图像、Web页面、业务文档、数据库表单、视频、声音等多种形式的数字信息。\n根据上述定义，下列不属于内容管理的是：","options":{"A":"企业官网发布产品介绍、新闻资讯、企业动态等，确保网站信息的时效性和准确性","B":"电子商务网站频繁更新商品信息、促销活动和用户评价等内容，以提升用户体验","C":"个人博客更新博客文章、评论互动和社交媒体分享等内容，提升博客的吸引力和互动性","D":"信息技术课上，学生对作业本上记录的PPT上的概念、公式、定理等内容进行归纳、分类"},"answer":"D","explanation":"第一步：找到定义关键词。\n“借助信息技术”、“对各种形式的内容进行创建、存储、分享、应用、检索”、“在个人、企业、组织、业务、战略等方面产生价值”。\n第二步：逐一分析选项。\nA项：企业官网发布产品介绍等内容，符合“借助信息技术”、“对各种形式的内容进行创建、存储、分享、应用、检索”，确保网站信息的时效性和准确性，符合“在个人、企业、组织、业务、战略等方面产生价值”，符合定义，排除；\nB项：电子商务网站更新商品信息等内容，符合“借助信息技术”、“对各种形式的内容进行创建、存储、分享、应用、检索”，提升用户体验，符合“在个人、企业、组织、业务、战略等方面产生价值”，符合定义，排除；\nC项：个人博客更新博客文章等内容，符合“借助信息技术”、“对各种形式的内容进行创建、存储、分享、应用、检索”，提升博客的吸引力和互动性，符合“在个人、企业、组织、业务、战略等方面产生价值”，符合定义，排除；\nD项：学生只是在课堂上对作业本上记录的PPT上的概念等内容进行归纳、分类，并未涉及信息技术，不符合“借助信息技术”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"15419030","cat":"定义判断","stem":"封闭疗法是将一定剂量、浓度的麻醉、消炎等特定药物注射到身体特定部位或病变组织周围，用来阻断神经传导并改善局部营养，发挥消炎止痛等作用的一种治疗方法。封闭疗法对全身各部位的肌肉、韧带、筋膜、腱鞘、滑膜的急慢性损伤或退行性病变、骨关节病都适用。\n根据上述定义，以下最可能为封闭疗法的是：","options":{"A":"麻醉师为小刘右脚拇指注射麻醉剂后，医生为其拇指做手术","B":"鱼刺卡在了小王喉咙处，医生取刺前，先给小王口腔喷麻药","C":"医生将特定药液注入痛点周围，以此治疗老李的肩周炎","D":"医生为缓解老赵术后疼痛，给他上止痛泵"},"answer":"C","explanation":"第一步：找出定义关键词。\n“将一定剂量、浓度的麻醉、消炎等特定药物注射到身体特定部位或病变组织周围”、“用来阻断神经传导并改善局部营养，发挥消炎止痛等作用”。\n第二步：逐一分析选项。\nA项：麻醉师是为了手术给小刘注射麻醉剂，不符合“用来阻断神经传导并改善局部营养，发挥消炎止痛等作用”，不符合定义，排除；\nB项：医生是为了取刺给小王口腔喷麻药，不是“注射”，不符合“将一定剂量、浓度的麻醉、消炎等特定药物注射到身体特定部位或病变组织周围”，不符合定义，排除；\nC项：医生是为了治疗老李的肩周炎，将特定的药液注射到痛点周围，符合“将一定剂量、浓度的麻醉、消炎等特定药物注射到身体特定部位或病变组织周围”、“用来阻断神经传导并改善局部营养，发挥消炎止痛等作用”，符合定义，当选；\nD项：医生为了缓解术后的疼痛给老赵上止痛泵，不符合“将一定剂量、浓度的麻醉、消炎等特定药物注射到身体特定部位或病变组织周围”，不符合定义，排除。\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"15419019","cat":"定义判断","stem":"非职务发明指企事业单位、社会团体、国家机关的工作人员没有利用本单位物质条件，在业余时间所完成的发明创造。\n根据上述定义，以下属于非职务发明的是：","options":{"A":"王医生旅游途中构思“多功能喉镜”后，用草图申请并获得发明专利","B":"陈工利用单位实验室设备研制“电缆穿管保护器”","C":"张教授团队研发的“大气多参数探测光量子激光雷达”获得发明金奖","D":"林场职工在单位制作的“果柄高效水果采摘器”获国家发明专利"},"answer":"A","explanation":"第一步：找出定义关键词。\n“没有利用本单位物质条件在业余时间所完成的发明创造”。\n第二步：逐一分析选项。\nA项：王医生“旅游途中”构思且用草图申请并获得发明专利，利用的是业余时间，且没有体现利用单位资源进行发明，符合“没有利用本单位物质条件在业余时间所完成的发明创造”，符合定义，当选；\nB项：陈工使用的实验室设备是本单位资源，不符合“没有利用本单位物质条件在业余时间所完成的发明创造”，不符合定义，排除；\nC项：张教授团队研发成果获得金奖，属于张教授团队的工作成果，不符合“没有利用本单位物质条件在业余时间所完成的发明创造”，不符合定义，排除；\nD项：林场职工是在单位进行的发明，不符合“没有利用本单位物质条件在业余时间所完成的发明创造”，不符合定义，排除。\n故正确答案为A。","no":74,"missingImage":false},{"type":"question","qid":"15419034","cat":"定义判断","stem":"两用物项是指既有民事用途，又有军事用途或者有助于提升军事潜力，特别是可以用于设计、开发、生产或者使用大规模杀伤性武器及其运载工具的货物、技术和服务，包括相关的技术资料等数据。\n根据上述定义，以下不涉及两用物项的是：","options":{"A":"我国涡轴发动机AES100，是为满足商用直升机动力需求研制的","B":"稀土有许多优良性能，能广泛运用于机械、电子、国防等领域","C":"到目前为止，北斗系统服务及相关产品已输出到130余个国家","D":"我国航发维修业能够为各种航空发动机提供高质量的维修服务"},"answer":"A","explanation":"第一步：找出定义关键词。\n“既有民事用途，又有军事用途或者有助于提升军事潜力”。\n第二步：逐一分析选项。\nA项：该项中发动机只是为了满足商用直升机动力需求而研制的，没有涉及军事用途，不符合“既有民事用途，又有军事用途或者有助于提升军事潜力”，不符合定义，当选；\nB项：该项中稀土广泛运用于机械、电子、国防等领域，这些领域既有民事用途，又有军事用途，符合“既有民事用途，又有军事用途或者有助于提升军事潜力”，符合定义，排除；\nC项：该项中北斗系统服务及相关产品输出到130余个国家，可能符合“既有民事用途，又有军事用途或者有助于提升军事潜力”，可能符合定义，排除；\nD项：该项中航发维修业能够为“各种”航空发动机提供高质量的维修服务，“各种”航空发动机既包括民用设备，又包括军用设备，符合“既有民事用途，又有军事用途或者有助于提升军事潜力”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":75,"missingImage":false},{"type":"question","qid":"15419045","cat":"定义判断","stem":"绝对年代和相对年代是古今历史的纪年法，是历史学与考古学测定和记载人文时序的基本标志。历史上可以确定的具体年代，称为绝对年代。不能确定具体年代而仅能比较或推定先后时序者，称为相对年代。\n根据上述定义，以下涉及相对年代的是：","options":{"A":"秦始皇（前259-前210年）于公元前221年统一中国","B":"孔子（前551-前479年）是中国古代伟大思想家和教育家","C":"旧石器时代于距今约300万年始，于距今10000年左右止","D":"特洛伊城陷落后约60年，彼阿提亚人定居于现在的彼阿提亚"},"answer":"D","explanation":"第一步：找出定义关键词。\n绝对年代：“历史上可以确定的具体年代”；\n相对年代：“不能确定具体年代而仅能比较或推定先后时序”。\n第二步：逐一分析选项。\nA项：秦始皇的生卒年份（前259-前210年）是一个具体的时间段，统一中国的时间（公元前221年）是一个具体的时间点，符合“历史上可以确定的具体年代”，符合“绝对年代”的定义，不符合“相对年代”的定义，排除；\nB项：孔子的生卒年份（前551-前479年）是一个具体的时间段，符合“历史上可以确定的具体年代”，符合“绝对年代”的定义，不符合“相对年代”的定义，排除；\nC项：旧石器时代的起（距今约300万年）止（距今10000年）时间是一个具体的时间段，符合“历史上可以确定的具体年代”，符合“绝对年代”的定义，不符合“相对年代”的定义，排除；\nD项：彼阿提亚人定居发生在特洛伊城陷落后的约60年，60年是一个相对时间，且特洛伊城陷落在前，彼阿提亚人定居在后，符合“不能确定具体年代而仅能比较或推定先后时序”，符合“相对年代”的定义，当选。\n故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"15419055","cat":"定义判断","stem":"跨流域调水是从一个流域往另一个流域调水，以解决缺水地区水资源需求的一项措施。由于天然降水分布不均，不同流域的水量盈缺差距大，缺水流域的经济社会发展和居民生活受到水资源制约。可从丰水流域调出部分水量以调节缺水流域的用水，促进该流域经济社会可持续发展。\n根据上述定义，以下不属于跨流域调水的是：","options":{"A":"将长江江水引入黄河、淮河和海河","B":"三峡水库在旱季向长江中下游输水","C":"让滦河河水穿越燕山山脉流入海河","D":"丹江口水库一直把汉江水输往北方"},"answer":"B","explanation":"第一步：找出定义关键词。\n“从一个流域往另一个流域调水”、“解决缺水地区水资源需求的一项措施”。\n第二步：逐一分析选项。\nA项：从“长江流域”向“黄河流域、淮河流域和海河流域”调水，符合“从一个流域往另一个流域调水”，符合定义，排除；\nB项：三峡水库处于长江上游，旱季向长江中下游输水，属于同一个流域，不符合“从一个流域往另一个流域调水”，不符合定义，当选；\nC项：从“滦河流域”向“海河流域”调水，符合“从一个流域往另一个流域调水”，符合定义，排除；\nD项：从“汉江流域”向“北方流域”调水，符合“从一个流域往另一个流域调水”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":77,"missingImage":false},{"type":"question","qid":"15419060","cat":"定义判断","stem":"碳足迹是用来衡量个体、组织或国家在一定时间内直接或间接导致的二氧化碳排放的指标。碳足迹的计算涵盖了产品或服务从生产、运输、最终使用到废弃处理的整个生命周期的排放。\n根据上述定义，下列行为不利于减少碳足迹的是：","options":{"A":"小陈放弃自己开车，选择公共交通出行","B":"小李开车上下班，为了避开堵车高峰，提前两小时出门","C":"小王在新家装修时选择密闭性良好的门窗，以减少家中气流和漏气情况","D":"​小张认为吃牛肉比较耐饿，减少蔬菜、水果食用量，增加餐食中的牛肉"},"answer":"D","explanation":"第一步：找出定义关键词。\n“衡量个体、组织或国家在一定时间内直接或间接导致的二氧化碳排放的指标”。\n第二步：逐一分析选项。\nA项：小陈放弃自己开车选择公共交通出行，可减少汽车尾气排放，减少了二氧化碳排放量，有利于减少碳足迹，排除；\nB项：小李提前两小时出门避开堵车高峰，缩短了开车的时间，减少了二氧化碳排放量，有利于减少碳足迹，排除；\nC项：密闭性良好的门窗可减少室内热量散失，降低取暖或制冷能源消耗，减少了二氧化碳排放量，有利于减少碳足迹，排除；\nD项：小张增加牛肉的食用量，减少蔬菜、水果的食用量，牛肉在养殖等环节上会比种植蔬菜、水果等产生更多的二氧化碳，即增加了二氧化碳排放量，不利于减少碳足迹，当选。\n故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"15419061","cat":"定义判断","stem":"“列车效应”是指有多个对流云团依次经过某地时其所产生的降水量累积起来，就会导致大暴雨甚至特大暴雨，就像人站在一节节经过的列车面前一般，接连不断地感受到一节节车厢经过时带来的巨大声音和冲力，影响效果不断叠加，导致灾害加剧。\n根据上述定义，以下属于列车效应的是：","options":{"A":"某地因地势低洼，排水不畅，遭遇暴雨时经常发生城市内涝灾害","B":"某地因强台风过境，短时产生大量降水，且降雨量明显高于往年同期水平","C":"某地遭遇罕见特大暴雨天气，暴雨导致的山体滑坡、泥石流等次生灾害造成部分人员伤亡","D":"某地进入梅雨季后天气阴晴不定，前一日艳阳高照，后又连续多日暴雨，拉响暴雨红色警报"},"answer":"D","explanation":"第一步：找出定义关键词。\n“多个对流云团依次经过某地时其所产生的降水量累积起来”、“影响效果不断叠加”、“导致灾害加剧”。\n第二步：逐一分析选项。\nA项：某地因地势低洼，排水不畅，遭遇暴雨时经常发生城市内涝灾害，但没有说连续多次暴雨，不符合“多个对流云团依次经过某地时其所产生的降水量累积起来”、“影响效果不断叠加”，不符合定义，排除；\nB项：某地因强台风过境，短时产生大量降水，强台风是一次影响，不符合“多个对流云团依次经过某地时其所产生的降水量累积起来”、“影响效果不断叠加”，不符合定义，排除；\nC项：某地遭遇特大暴雨导致多种灾害，特大暴雨是一次影响，不符合“多个对流云团依次经过某地时其所产生的降水量累积起来”、“影响效果不断叠加”，不符合定义，排除；\nD项：某地连续多日暴雨，符合“多个对流云团依次经过某地时其所产生的降水量累积起来”，拉响暴雨红色警报，符合“影响效果不断叠加”、“导致灾害加剧”，符合定义，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"15419102","cat":"类比推理","stem":"手机：扫码：支付","options":{"A":"按键：开机：通话","B":"煮饭：吃饭：洗碗","C":"茶杯：泡茶：喝茶","D":"学习：看书：写字"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n手机是用来扫码和支付的工具，第一词分别和后两词构成工具对应关系，且先扫码，再支付，后两词为时间先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：按键是通话工具的组成部分，不是开机和通话的工具，与题干逻辑关系不一致，排除；\nB项：先煮饭，再吃饭，最后洗碗，三者为时间先后顺序的对应关系，与题干逻辑关系不一致，排除；\nC项：茶杯是用来泡茶和喝茶的工具，第一词分别和后两词构成工具对应关系，且先泡茶，再喝茶，后两词为时间先后顺序的对应关系，与题干逻辑关系一致，当选；\nD项：看书和写字都是学习的方式，第一词分别和后两词构成方式目的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":80,"missingImage":false},{"type":"question","qid":"15419099","cat":"类比推理","stem":"导诊：挂号：治疗","options":{"A":"上班：打卡：同事","B":"恋爱：订亲：结婚","C":"旅游：购票：交通","D":"购房：交税：财产"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n先“导诊”，再“挂号”，最后“治疗”，三者为时间先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：打卡一般是在上班时进行的一个行为动作，同事是一起工作的人，三者没有明显的时间先后顺序，与题干逻辑关系不一致，排除；\nB项：先“恋爱”，再“订亲”，最后“结婚”，三者为时间先后顺序的对应关系，与题干逻辑关系一致，当选；\nC项：“交通”是旅游过程中涉及的一个方面，其与“购票”和“旅游”没有明确的时间先后顺序，与题干逻辑关系不一致，排除；\nD项：先“购房”，再“交税”，但前两词均与“财产”不存在明确的时间先后顺序，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":81,"missingImage":false},{"type":"question","qid":"15419101","cat":"类比推理","stem":"太阳能：路灯：风能","options":{"A":"燃气：热水器：电能","B":"自动：汽车：手动","C":"竹子：洞箫：木头","D":"机械：手表：发条"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n太阳能和风能是两种不同的能源，且二者均可以作为路灯的动力来源，第一词和第三词为并列关系，分别与第二词构成动力来源的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：燃气和电能是两种不同的能源，且二者均可以作为热水器的动力来源，第一词和第三词为并列关系，分别与第二词构成动力来源的对应关系，与题干逻辑关系一致，当选；\nB项：自动和手动是两种不同的汽车变速方式，第一词和第三词为并列关系，但与第二词不构成动力来源的对应关系，与题干逻辑关系不一致，排除；\nC项：竹子和木头是两种不同的制作洞箫的原材料，第一词和第三词为并列关系，分别与第二词构成原材料的对应关系，与题干逻辑关系不一致，排除；\nD项：发条是手表的组成部分，第三词与第二词为组成关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":82,"missingImage":false},{"type":"question","qid":"15419096","cat":"类比推理","stem":"水稻：小麦：玉米：粮食","options":{"A":"白菜：萝卜：青椒：蔬菜","B":"溪涧：池塘：沟渠：流水","C":"聊天：支付：定位：微信","D":"善良：宽厚：诚实：人性"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n水稻、小麦、玉米都是粮食，前三个词是并列关系，且均和第四个词构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：白菜、萝卜、青椒都是蔬菜，前三个词是并列关系，且均和第四个词构成种属关系，与题干逻辑关系一致，保留；\nB项：溪涧是指夹在两山中间的小河沟，溪涧、池塘、沟渠都是水域，都由流水组成，前三个词均和第四个词构成组成关系，与题干逻辑关系不一致，排除；\nC项：聊天、支付、定位都是微信具有的功能，前三个词是并列关系，且均和第四个词构成功能对应关系，与题干逻辑关系不一致，排除；\nD项：善良、宽厚、诚实都是人性，前三个词是并列关系，且均和第四个词构成种属关系，与题干逻辑关系一致，保留。\n比较A、D两项，题干和A项中的词语都是具体事物，且都是自然产物，而D项中的词语都是抽象事物，且不是自然产物，故A项与题干逻辑关系更为一致，当选。\n故正确答案为A。","no":83,"missingImage":false},{"type":"question","qid":"15419097","cat":"类比推理","stem":"筑堤：拦水：养鱼","options":{"A":"春播：夏种：秋收","B":"开荒：造田：种粮","C":"吐丝：结茧：丝绸","D":"研墨：铺纸：书法"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n筑堤是为了拦水，拦水是为了养鱼，分别构成方式目的的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：春播、夏种和秋收是农业生产中的不同阶段，三者为并列关系，且存在时间上的先后顺序，与题干逻辑关系不一致，排除；\nB项：开荒是为了造田，造田是为了种粮，三者为方式目的的对应关系，与题干逻辑关系一致，当选；\nC项：吐丝和结茧是蚕生长中的两个过程，二者为并列关系，且存在时间上的先后顺序，丝绸是由蚕吐出的丝加工而成的，与题干逻辑关系不一致，排除；\nD项：研墨和铺纸是书法创作中的准备工作，二者为并列关系，均与第三个词构成对应关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":84,"missingImage":false},{"type":"question","qid":"15419098","cat":"类比推理","stem":"桥墩：桥面：桥","options":{"A":"路标：路面：路","B":"车轮：车身：车","C":"门框：门锁：门","D":"房顶：房型：房"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n桥墩和桥面都是桥的组成部分，前两词和第三词分别构成组成关系。\n第二步：判断选项词语间逻辑关系。\nA项：路面是路的组成部分，路标是一种交通标志，路标设置在路上，二者为地点的对应关系，与题干逻辑关系不一致，排除；\nB项：车轮和车身都是车的组成部分，前两词和第三词分别构成组成关系，与题干逻辑关系一致，保留；\nC项：门框和门锁都是门的组成部分，前两词和第三词分别构成组成关系，与题干逻辑关系一致，保留；\nD项：房顶是房的组成部分，但房型一是指面积大小不等、基本平面功能分区各异的单元住宅系列；二是指在同一总面积水平下，每户使用面积内部的功能组合和面积安排以及各分区的朝向、通风、采光情况等，与房不构成组成关系，与题干逻辑关系不一致，排除。\n对比B、C两项，题干中桥墩是在桥面的下方，B项中车轮是在车身的下方，而C项中门框并不在门锁的下方，故B项与题干逻辑关系更为一致，当选。\n故正确答案为B。","no":85,"missingImage":false},{"type":"question","qid":"15419100","cat":"类比推理","stem":"汉剧：川剧：传统戏剧","options":{"A":"诗词：散文：古典文学","B":"山歌：民歌：经典情歌","C":"劲舞：街舞：广场舞蹈","D":"唢呐：二胡：民族乐器"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n汉剧和川剧是两种不同的传统戏剧，前两词为并列关系，且分别与第三词构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：诗词和散文是两种不同的文学体裁，前两词为并列关系，古典文学泛指各民族的古代文学作品，前两词分别与第三词构成交叉关系，与题干逻辑关系不一致，排除；\nB项：山歌是中国民歌的基本体裁之一，前两词为种属关系，与题干逻辑关系不一致，排除；\nC项：街舞是一种起源于美国街头的舞蹈，是一种体育与街头表演相结合的舞蹈。劲舞是指节奏强烈有力的现代舞蹈，街舞是劲舞，前两词为种属关系，与题干逻辑关系不一致，排除；\nD项：唢呐和二胡是两种不同的民族乐器，前两词为并列关系，且分别与第三词构成种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"15419103","cat":"类比推理","stem":"建筑：设计：施工","options":{"A":"项目：规划：实施","B":"文章：构思：写作","C":"药品：配方：成分","D":"实验：守则：报告"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n建筑应先设计，再施工，后两词与第一词分别构成对应关系，且后两词存在时间的先后顺序。\n第二步：判断选项词语间逻辑关系。\nA项：项目应先规划，再实施，后两词与第一词分别构成对应关系，且后两词存在时间的先后顺序，与题干逻辑关系一致，保留；\nB项：文章应先构思，再写作，后两词与第一词分别构成对应关系，且后两词存在时间的先后顺序，与题干逻辑关系一致，保留；\nC项：药品配方、药品成分，后两词与第一词分别构成偏正关系，且后两词不存在时间的先后顺序，与题干逻辑关系不一致，排除；\nD项：实验守则、实验报告，后两词与第一词分别构成偏正关系，且后两词不存在时间的先后顺序，与题干逻辑关系不一致，排除。\n对比A、B两项，题干中，设计方设计方案，施工方根据方案施工，两个行为的主体不一致；A项中，规划方规划方案，实施方根据方案实施，两个行为的主体不一致；而B项中，构思和写作的主体均是作者，两个行为的主体一致，因此A项与题干逻辑关系更为一致，当选。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"15419104","cat":"类比推理","stem":"（    ） 对于 遇事 相当于 朝气 对于 （    ）","options":{"A":"静气；干事","B":"沉着；人生","C":"担当；事业","D":"无惧；开拓"},"answer":"A","explanation":"逐一代入选项。\nA项：遇事要有静气，干事要有朝气，二者均为情境和心态的对应关系，前后逻辑关系一致，保留；\nB项：遇事需要沉着，前者为情境和心态的对应关系；朝气可用来形容人生状态，二者为描述对象和状态的对应关系，前后逻辑关系不一致，排除；\nC项：遇事要有担当，二者为情境和心态的对应关系；朝气可用来形容事业状态，二者为描述对象和状态的对应关系，前后逻辑关系不一致，排除；\nD项：遇事要无惧，开拓要有朝气，二者均为情境和心态的对应关系，前后逻辑关系一致，保留。\n对比A、D两项，A项中“遇事”和“干事”均为动宾结构，而D项中“开拓”是动词，故A项前后逻辑关系更为一致，当选。\n故正确答案为A。","no":88,"missingImage":false},{"type":"question","qid":"15419106","cat":"类比推理","stem":"铁三角 对于 （    ） 相当于 （    ） 对于 老谋深算","options":{"A":"患难之交；老黄牛","B":"金兰之交；和事佬","C":"泛泛之交；愣头青","D":"总角之交；老江湖"},"answer":"C","explanation":"逐一代入选项。\nA项：铁三角比喻牢固可靠的三方组合，患难之交指在一起经历过忧患和危难的朋友，二者是近义关系；老黄牛比喻老老实实、勤勤恳恳工作的人，老谋深算指周密的筹划、深远的打算，形容人办事精明老练，二者不是近义关系，前后逻辑关系不一致，排除；\nB项：铁三角比喻牢固可靠的三方组合，金兰之交指十分亲密的朋友或结拜兄弟，二者是近义关系；和事佬指调停争端的人，特指无原则地进行调节的人，老谋深算指周密的筹划、深远的打算，形容人办事精明老练，二者不是近义关系，前后逻辑关系不一致，排除；\nC项：铁三角比喻牢固可靠的三方组合，泛泛之交指普通朋友，二者是反义关系；愣头青指鲁莽的人，老谋深算指周密的筹划、深远的打算，形容人办事精明老练，二者是反义关系，前后逻辑关系一致，当选；\nD项：铁三角比喻牢固可靠的三方组合，总角之交指小时候很要好的朋友，即前者指“关系牢固”的朋友，后者指“小时候很要好”的朋友，二者无明显逻辑关系；老江湖指在外多年，很有阅历，处事圆滑的人，老谋深算指周密的筹划、深远的打算，形容人办事精明老练，二者是近义关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":89,"missingImage":false},{"type":"question","qid":"15419143","cat":"逻辑判断","stem":"在一项研究中，将睡眠不足定义为每晚睡眠时间少于7小时。研究者选择存在这种情况的受试者19816名，14年后随访，发现周末补偿性睡眠的受试者比没有补偿性睡眠的受试者患心血管疾病的可能性低19%，这一比率不存在男女差异。可见，充足的补偿性睡眠与罹患心血管疾病风险的降低有关。\n以下各项如果为真，最能支持上述结论的是：","options":{"A":"另一项有90903名受试者参与的研究也得出了相同的结论","B":"每天平均睡眠时间少于7小时，确实会增加患心血管疾病的风险","C":"充足的补偿性睡眠对心血管健康至关重要，也对整个机体健康至关重要","D":"每天平均睡眠时间7小时以上，能有效保护心脏生理机制的复杂平衡"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：充足的补偿性睡眠与罹患心血管疾病风险的降低有关。\n论据：研究者选择存在这种情况的受试者19816名，14年后随访，发现周末补偿性睡眠的受试者比没有补偿性睡眠的受试者患心血管疾病的可能性低19%，这一比率不存在男女差异。\n本题论点和论据讨论的都是“充足的补偿性睡眠”和“罹患心血管疾病风险”之间的关系，话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出另一项研究也得出了相同的结论，通过补充其他研究的结果来证明“充足的补偿性睡眠与罹患心血管疾病风险的降低有关”，补充论据，可以加强，保留；\nB项：该项指出每天平均睡眠时间少于7小时，确实会增加患心血管疾病的风险，但并没有提到是否有充足的补偿性睡眠，而论点讨论的是充足的补偿性睡眠是否与罹患心血管疾病风险的降低有关，话题不一致，不能加强，排除；\nC项：该项指出充足的补偿性睡眠对心血管健康至关重要，也对整个机体健康至关重要，与论点表述的意思一致，可以加强，保留；\nD项：该项指出“平均”每天睡眠时间7小时以上对心脏的好处，根据题干第一句可知“睡眠不足指每晚睡眠时间少于7小时”，那么“充足的”补偿性睡眠应当指“平均到”每晚睡眠时间不少于7小时， 而每天平均睡眠时间7小时以上是能有效保护心脏生理机制的，所以需要通过周末的补偿性睡眠，来使“平均睡眠”达到7小时以上，这就解释了为什么“充足的”补偿性睡眠可以降低罹患心血管疾病的风险，补充论据，可以加强，保留；\n对比A、C、D三项，A项通过补充另外一个例子来证明论点成立，C项只是在重复论点，D项设置的很巧妙， 解释了为什么睡得少时要补偿性睡眠，因为当补到每天“平均”睡眠时间达到7小时时，能降低患心血管疾病的风险，解释了论点成立的原因，对比之后，D项解释原因的力度&gt;A项举例子&gt;C项重复论点，因此，D项加强力度更大，当选。\n故正确答案为D。","no":90,"missingImage":false},{"type":"question","qid":"15419137","cat":"逻辑判断","stem":"数据显示，2024年1至7月，我国服务贸易进出口总额42301.8亿元，同比增长14.7%，其中出口17325亿元，增长12.4%，显著超过同期货物贸易出口增幅。服务贸易中的知识产权使用费、文化娱乐服务出口增长较快，增幅分别达到15.7%、16.3%。服务贸易数字化、科技化、便利化和高附加值化趋势明显。\n根据以上叙述，最能推出的结论是：","options":{"A":"中国服务贸易实现高水平对外开放","B":"中国服务贸易国际竞争力全面提升","C":"中国服务贸易呈量增质优发展态势","D":"中国服务贸易已在国际上崭露头角"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干内容不涉及“对外开放”，无中生有，无法推出，排除；\nB项：根据第二句话“服务贸易中的知识产权使用费、文化娱乐服务出口增长较快，增幅分别达到15.7%、16.3%”可知，讨论的是部分重点领域的服务贸易情况，不涉及“国际竞争力全面提升”，无中生有，无法推出，排除；\nC项：根据第一句话“我国服务贸易进出口总额42301.8亿元，同比增长14.7%，其中出口17325亿元，增长12.4%，显著超过同期货物贸易出口增幅”和最后一句话“服务贸易数字化、科技化、便利化和高附加值化趋势明显”可知，中国服务贸易呈量增质优发展态势，可以推出，当选；\nD项：题干讨论的是“我国服务贸易进出口数量和质量的提升”，但该项讨论的是“中国服务贸易已在国际上崭露头角”，无中生有，无法推出，排除。\n故正确答案为C。","no":91,"missingImage":false},{"type":"question","qid":"15419138","cat":"逻辑判断","stem":"科学界认为弗洛勒斯人是目前已知的体形最小人种，弗洛勒斯人的祖先是在约100万年前登上印尼弗洛勒斯岛的。研究人员最近在弗洛勒斯岛发现了一块70万年前的古弗洛勒斯成年人的肱骨化石，只有88毫米长。研究结论是，弗洛勒斯人的祖先在抵达弗洛勒斯岛后的30万年里进化得更矮小了。\n以下各项如果为真，最能支持上述结论的是：","options":{"A":"弗洛勒斯人的祖先应该是体形较大的古人类，或因风暴被冲上弗洛勒斯岛","B":"研究早就证明，动物被困在岛屿上都会进化出更小体形，这叫岛屿侏儒症","C":"因为岛屿上食物或被捕食威胁减少，人和动物的体形都会进化得更加矮小","D":"这根肱骨的大小是更早前弗洛勒斯成年人肱骨化石的9%至16%，且更细"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：弗洛勒斯人的祖先在抵达弗洛勒斯岛后的30万年里进化得更矮小了。\n论据：弗洛勒斯人的祖先是在约100万年前登上印尼弗洛勒斯岛的。研究人员最近在弗洛勒斯岛发现了一块70万年前的古弗洛勒斯成年人的肱骨化石，只有88毫米长。\n本题论点讨论的是“弗洛勒斯人抵达岛后的30万年里进化得更矮小了”，论据讨论的是“发现70万年前的古弗洛勒斯成年人的肱骨化石，长度只有88毫米”，二者话题不一致，加强优先考虑搭桥，即建立“70万年前的这块肱骨化石”与“抵达岛后变得更矮小”之间的联系。\n第二步：逐一分析选项。\nA项：该项指出弗洛勒斯人的祖先应该是体形较大的古人类，或因风暴被冲上弗洛勒斯岛，讨论的是“弗洛勒斯人的祖先如何登上弗洛勒斯岛”，与论点讨论的“弗洛勒斯人的祖先在抵达弗洛勒斯岛后的30万年里进化得更矮小了”话题不一致，不能加强，排除；\nB项：该项指出动物被困在岛屿上都会进化出更小体形，可以在一定程度上解释为什么“弗洛勒斯人的祖先在抵达弗洛勒斯岛后的30万年里进化得更矮小了”，可以加强，但没有建立“70万年前的这块肱骨化石”与“抵达岛后变得更矮小”之间的联系，不是搭桥项，排除；\nC项：该项指出因为岛屿上食物或被捕食威胁减少，人和动物的体形都会进化得更加矮小，可以解释为什么“弗洛勒斯人的祖先在抵达弗洛勒斯岛后的30万年里进化得更矮小了”，可以加强，但没有建立“70万年前的这块肱骨化石”与“抵达岛后变得更矮小”之间的联系，不是搭桥项，排除；\nD项：该项指出这根肱骨的大小是更早前弗洛勒斯成年人肱骨化石的9%至16%，且更细，说明发现的这根70万年前的肱骨比更早前的弗洛勒斯成年人肱骨化石要小得多，可以说明“弗洛勒斯人的祖先在抵达弗洛勒斯岛后的30万年里进化得更矮小了”，建立了“70万年前的这块肱骨化石”与“抵达岛后变得更矮小”之间的联系，搭桥项，可以加强，当选。\n故正确答案为D。","no":92,"missingImage":false},{"type":"question","qid":"15419148","cat":"逻辑判断","stem":"在研究石英与黄金形成的关系时，科研人员发现：石英是压电矿物，它在地震产生的应力作用下会产生电荷；热液流体将金原子从地壳深处带入石英脉（石英岩缝）中，使石英脉充满溶解金；石英产生的电荷，与溶解金发生反应，让金析出并凝固成金块。因此，研究人员断定：地震促使黄金在石英中形成。\n研究人员的观点若要更具说服力，最需补充的前提是：","options":{"A":"地震让石英产生电荷的同时造成石英岩断裂，让热液流体将金原子带入石英脉","B":"金原子充当一个电极，通过吸收石英产生的电荷在石英脉中展开反应凝固成团","C":"实验室模拟的地震波让石英产生足够大的电压，使金从溶液中析出凝固成金块","D":"科学家已能在实验室里模拟地震环境，利用石英和含金原子的液体制造大金块"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：地震促使黄金在石英中形成。\n论据：石英是压电矿物，它在地震产生的应力作用下会产生电荷；热液流体将金原子从地壳深处带入石英脉（石英岩缝）中，使石英脉充满溶解金；石英产生的电荷，与溶解金发生反应，让金析出并凝固成金块。\n本题论据讨论地震时石英产生电荷，与溶解金反应形成黄金，论点讨论地震促使黄金在石英中形成，话题一致，问法为“前提”，加强优先考虑必要条件。\n第二步：逐一分析选项。\nA项：指出地震使得热液流体将金原子带入石英脉，如果该项不成立，那么石英中就不存在金原子，地震时就无法与电荷发生反应、形成黄金，论点就无法成立，是论点成立的必要条件，当选；\nB项：指出金原子通过吸收石英产生的电荷在石英脉中展开反应凝固成团，解释了地震时石英中黄金是如何形成的，补充论据，可以加强，但不是论点成立的前提，排除；\nC项：指出实验室模拟的地震波让石英产生足够大的电压，使金从溶液中析出凝固成金块，说明地震确实可以促使黄金在石英中形成，补充论据，可以加强，但不是论点成立的前提，排除；\nD项：指出科学家已能在实验室里模拟地震环境，利用石英和含金原子的液体制造大金块，说明地震确实可以促使黄金在石英中形成，补充论据，可以加强，但不是论点成立的前提，排除。\n故正确答案为A。","no":93,"missingImage":false},{"type":"question","qid":"15419154","cat":"逻辑判断","stem":"寝室里住着甲、乙、丙、丁四位大学生。他们当中一人是班长，一人是院男篮队员，一人选修了逻辑学，一人刚参加完数学建模比赛，且四人均不兼项。其中，甲不是班长也没参加数学建模比赛，乙没选修逻辑学也不是班长，丁没有参加数学建模比赛也不是班长。另外还知道，如果甲没有选修逻辑学，那么丙也不是班长。\n根据以上叙述，可推出的结论是：","options":{"A":"甲是院男篮队员","B":"丁选修了逻辑学","C":"乙参加了数学建模比赛","D":"丙或乙选修了逻辑学"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）甲、乙、丙、丁中一人是班长，一人是院男篮队员，一人选修了逻辑学，一人刚参加完数学建模比赛，且四人均不兼项；\n（2）甲\u003cimg data-k=\"645831205161\">班长，甲\u003cimg data-k=\"645831205161\">数学建模比赛；\n（3）乙\u003cimg data-k=\"645831205161\">逻辑学，乙\u003cimg data-k=\"645831205161\">班长；\n（4）丁\u003cimg data-k=\"645831205161\">数学建模比赛，丁\u003cimg data-k=\"645831205161\">班长；\n（5）\u003cimg data-k=\"0be436194951\">甲选修逻辑学\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">丙是班长。\n第二步：根据题干条件进行推理。\n题干条件中“班长”提及次数最多，可优先从此处入手进行推理。\n根据条件（2）（3）（4）可知，甲、乙、丁都不是班长，结合条件（1）可知，丙是班长。这是对条件（5）的否后，否后必否前，可得甲选修逻辑学。根据（4）可知，丁没有参加数学建模比赛，那么丁是院男篮队员，乙参加了数学建模比赛，只有C项符合。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"15419144","cat":"逻辑判断","stem":"干眼症是一种常见病。研究人员选择了300名年龄在18至45岁之间的干眼症患者，在8周时间里，一半人每天接受4次、每次5分钟笑疗，另一半人每天接受滴眼液治疗，笑疗包括各种让人发笑的干预手段。结果发现，两种治疗方法对两组患者的干眼症都有疗效。研究结论是，滴眼液在改善干眼症症状方面不逊于笑疗。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"上述研究没揭示出“笑”治疗干眼症的生物学机制","B":"使用滴眼液实验组的患者，大多数都是乐观爱笑的","C":"笑疗仅是一种比较安全、环保且低成本的干预措施","D":"有些生性开朗活泼、笑容常挂脸上的人也患干眼症"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：滴眼液在改善干眼症症状方面不逊于笑疗。\n论据：研究人员选择了300名年龄在18至45岁之间的干眼症患者，在8周时间里，一半人每天接受4次、每次5分钟笑疗，另一半人每天接受滴眼液治疗，笑疗包括各种让人发笑的干预手段。结果发现，两种治疗方法对两组患者的干眼症都有疗效。\n本题论据讨论的是对300名干眼症患者的研究发现，滴眼液治疗和笑疗对干眼症都有疗效，论点讨论的是滴眼液在改善干眼症症状方面不逊于笑疗，二者话题一致，削弱优先考虑削弱论点，还可考虑削弱论据等。\n第二步：逐一分析选项。\nA项：该项说的是上述研究没揭示出“笑”治疗干眼症的生物学机制，而论点讨论的是滴眼液治疗和笑疗的效果，话题不一致，无法削弱，排除；\nB项：该项说的是使用滴眼液实验组的患者大多数乐观爱笑，说明该组患者的疗效不一定是因为滴眼液，还可能是因为患者乐观爱笑，即滴眼液在改善干眼症症状方面不一定优于笑疗，削弱论据，可以削弱，当选；\nC项：该项说的是笑疗仅是一种比较安全、环保且低成本的干预措施，不涉及笑疗的效果，而论点讨论的是滴眼液治疗和笑疗的效果，话题不一致，无法削弱，排除；\nD项：该项说的是有些生性开朗活泼、笑容常挂脸上的人也患干眼症，不涉及干眼症的治疗，而论点讨论的是滴眼液治疗和笑疗的效果，话题不一致，无法削弱，排除。\n故正确答案为B。","no":95,"missingImage":false},{"type":"question","qid":"15419142","cat":"逻辑判断","stem":"烹饪使人类祖先的大脑得以进化。研究人员在一个古老洞穴中发现了一座30万年前的炉灶，旁边是被屠宰动物的遗骸；在一处遗址中发现存在了78万年的石垒炉灶及被加热过的一些鱼骨；还有证据表明，早在160万年前，肯尼亚地区的早期人类就学会了使用火。研究结论是：烹饪至少发明于160万年前。\n以下各项如果为真，最能质疑上述结论的是：","options":{"A":"目前有关考古学和生物学的已有证据，不一定能确定人类何时开始烹饪","B":"生物学证据表明，人类约在200万年前就可能失去生食动物的生理特征","C":"人类学会使用火不一定学会烹饪，因为使用火可能只是取暖或制造工具","D":"人类祖先到底什么时候学会控制和使用火的，考古界对此还没有定论"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：烹饪至少发明于160万年前。\n论据：研究人员在一个古老洞穴中发现了一座30万年前的炉灶，旁边是被屠宰动物的遗骸；在一处遗址中发现存在了78万年的石垒炉灶及被加热过的一些鱼骨；还有证据表明，早在160万年前，肯尼亚地区的早期人类就学会了使用火。\n本题论点讨论的是烹饪是否发明于160万年前，论据讨论的是人类在160万年前就学会了使用火，二者话题不一致，削弱优先考虑拆桥，即拆断“会使用火”与“发明烹饪”之间的联系。\n第二步：逐一分析选项。\nA项：该项指出已有证据不一定能确定人类何时开始烹饪，即不明确人类是否在160万年前就发明了烹饪，为不明确项，无法削弱，排除；\nB项：该项指出有证据表明人类约在200万年前就可能失去生食动物的生理特征，但失去生食动物的特征不一定是由于人类学会了烹饪，与题干话题不一致，无法削弱，排除；\nC项：该项指出人类学会使用火不一定学会烹饪，拆断了“会使用火”与“发明烹饪”之间的联系，为拆桥项，可以削弱，当选；\nD项：该项指出考古界尚不清楚人类是什么时候学会控制和使用火的，为不明确项，无法削弱，排除。\n故正确答案为C。","no":96,"missingImage":false},{"type":"question","qid":"15419141","cat":"逻辑判断","stem":"生物工程师一直在努力运用微生物制造塑料，以取代造成全球塑料污染的石油基料。研究人员最近实现了一项技术突破，使细菌产生一种含有环状结构的N聚合物，用它制造的塑料更加坚硬和耐热。研究人员指出，利用N聚合物制造的塑料一旦大规模商业化运用，就能缓解全球性塑料污染危机。\n研究人员的观点若要增强说服力，最需要补充的前提是：","options":{"A":"实验证明，N聚合物能自行生物降解，不会形成污染","B":"研究和生产人员正努力提高N聚合物合成塑料的产量","C":"实验证明，N聚合物还特别适合药物在人体内的输送","D":"研究人员正努力提高N聚合物塑料回收率，缓解污染"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：利用N聚合物制造的塑料一旦大规模商业化运用，就能缓解全球性塑料污染危机。\n论据：研究人员最近实现了一项技术突破，使细菌产生一种含有环状结构的N聚合物，用它制造的塑料更加坚硬和耐热。\n本题论点和论据都在讨论用N聚合物制造的塑料的优点，话题一致，且提问方式为“前提”，加强优先考虑必要条件。\n第二步：逐一分析选项。\nA项：该项指出N聚合物不会形成污染，如果N聚合物会形成污染，那大规模使用了利用N聚合物制造的塑料就会产生更多的污染，就不能用它来缓解全球性塑料污染危机，即否定该项后论点不能成立，该项为论点成立的必要条件，可以加强，当选；\nB项：该项指出人们正努力提高N聚合物合成塑料的产量，而论点讨论的是大规模使用N聚合物制造的塑料，能否缓解全球性塑料污染危机，话题不一致，无法加强，排除；\nC项：该项指出N聚合物还特别适合药物在人体内的输送，而论点讨论的是大规模使用N聚合物制造的塑料，能否缓解全球性塑料污染危机，话题不一致，无法加强，排除；\nD项：该项指出研究人员正努力提高N聚合物塑料回收率，但不确定是否能提升N聚合物塑料回收率，也不确定大规模使用了利用N聚合物制造的塑料能否缓解全球性塑料污染，为不明确项，无法加强，排除。\n故正确答案为A。","no":97,"missingImage":false},{"type":"question","qid":"15419151","cat":"逻辑判断","stem":"一项研究分析了飞机产生的航迹云与全球变暖的关系。航迹云是由喷气发动机排放的烟尘凝结水蒸气形成的云，更持久的航迹云会造成更多的全球变暖。研究人员认为，飞机飞行高度越高，带来的气候变暖越严重。\n以下哪项如果为真，最能支持研究人员的观点?","options":{"A":"飞机飞行的高度越高，就会有越多的烟尘排放","B":"航空业多达一半的变暖效应是由航迹云引起的","C":"高空飞行的飞机对气候的非二氧化碳影响同样重大","D":"飞机飞行的高度越高，产生的航迹云持续时间越长"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：飞机飞行高度越高，带来的气候变暖越严重。\n论据：航迹云是由喷气发动机排放的烟尘凝结水蒸气形成的云，更持久的航迹云会造成更多的全球变暖。\n本题论点说的是“飞机飞行高度”和“气候变暖”之间的关系，论据说的是“航迹云持续时间”和“气候变暖”之间的关系，二者话题不一致，加强优先考虑搭桥，即建立“航迹云持续时间”与“飞机飞行高度”之间的联系。\n第二步：逐一分析选项。\nA项：该项指出飞机飞行的高度越高，就会有越多的烟尘排放，排放的烟尘不明确是否会形成航迹云，为不明确项，无法加强，排除；\nB项：该项指出航空业多达一半的变暖效应是由航迹云引起的，说的是“航迹云”与“变暖效应”之间的关系，而论点讨论的是“飞机飞行高度”与“气候变暖”之间的关系，话题不一致，无法加强，排除；\nC项：该项指出高空飞行的飞机对气候的非二氧化碳影响同样重大，讨论的是对“气候的非二氧化碳”的影响，而论点讨论的是对“气候变暖”的影响，话题不一致，无法加强，排除；\nD项：该项指出飞机飞行的高度越高，产生的航迹云持续时间越长，建立了“航迹云持续时间”与“飞机飞行高度”之间的联系，为搭桥项，可以加强，当选。\n故正确答案为D。","no":98,"missingImage":false},{"type":"question","qid":"15419146","cat":"逻辑判断","stem":"近代历史上火星至少发生过10次大规模撞击，大量物质在撞击过程中被高速抛向太空，其中一些可能会作为陨石落到地球上。最新研究揭示，地球上约有200颗陨石的来源，可追溯到火星上的塔尔西斯和埃律西昂这两个火山区的5个撞击坑。研究报告声称，地球上的部分陨石确实来自火星。\n以下各项如果为真，最能支持上述结论的是：","options":{"A":"科学家现在可根据上述200颗陨石曾在火星表面的位置对它们进行分组","B":"火星探测器探明，上述200颗陨石和两个火山区5个撞击坑物质成分相同","C":"火星探测器发现火星大气成分与上述200颗陨石中所包含气体成分相同","D":"科学家现在能模拟陨石与上述5个撞击坑的撞击以及特定陨石群的抛射过程"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：地球上的部分陨石确实来自火星。\n论据：地球上约有200颗陨石的来源，可追溯到火星上的塔尔西斯和埃律西昂这两个火山区的5个撞击坑。\n本题论点和论据都在讨论地球上部分陨石来自火星，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出可根据上述200颗陨石曾在火星表面的位置对它们进行分组，说明这些陨石曾在火星表面，提供了陨石来自火星的证据，补充论据，可以加强，保留；\nB项：该项指出上述200颗陨石和两个火山区5个撞击坑物质成分相同，说明这些陨石来自撞击坑，提供了陨石来自火星的证据，补充论据，可以加强，保留；\nC项：该项指出火星大气成分与上述200颗陨石中所包含气体成分相同，提供了陨石来自火星的证据，补充论据，可以加强，保留；\nD项：该项指出科学家能模拟陨石与上述5个撞击坑的撞击以及特定陨石群的抛射过程，与论点说的地球上的部分陨石来自火星无关，为无关项，无法加强，排除。\n对比A、B、C三项，A项说的是陨石与火星表面的关系，C项说的是陨石与火星大气的关系，只有B项明确提到陨石与火星撞击坑的关系，故B项与题干关键词更为一致，当选。\n故正确答案为B。","no":99,"missingImage":false},{"type":"question","qid":"15419140","cat":"逻辑判断","stem":"血糖生成指数（GI）较高的食物进入人体后对血糖的不良影响大，是糖尿病和肥胖症的主要诱因。高GI食物指高糖和高碳水、低蛋白和低纤维的食物。传统大米是一种高GI的食物。一个国际研究团队最近通过基因改造的方法，种植出一种大米，这种大米的GI低于45（\u003cimg data-k=\"746045833caa\">为低血糖生成指数），蛋白质含量接近16%，是传统大米的5倍多。\n根据以上叙述，最能推出的结论是：","options":{"A":"这种营养丰富的水稻新品种将为实现关键粮食和营养安全目标铺平道路","B":"全球约有5.37亿成年人罹患糖尿病，这与饮食有关，如吃高GI的大米","C":"上述研究结果凸显低GI和高蛋白大米的巨大潜力，定会很快推广上市","D":"研究成果有助于降低糖尿病发病率，并满足人们摄入充足蛋白质的需求"},"answer":"D","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干最后一句话中仅指出新大米的GI值和蛋白质含量，并未提及“关键粮食和营养安全目标”，无中生有，无法推出，排除；\nB项：题干中只提到高GI的食物是糖尿病和肥胖症的主要诱因，而大米是一种高GI的食物，但不明确全球成年人患糖尿病是否与饮食有关，无法推出，排除；\nC项：题干最后一句话中说明了新大米在GI值和蛋白质含量方面的优势，但不明确这种大米是否会很快被推广上市，无法推出，排除；\nD项：题干中指出“新大米的GI低于45”，属于低GI食物，而高GI食物是糖尿病的主要诱因，所以新大米有助于降低糖尿病发病率，且“新大米蛋白质含量接近16%，是传统大米的5倍多”，说明新大米能满足人们摄入充足蛋白质的需求，可以推出，当选。\n故正确答案为D。","no":100,"missingImage":false},{"type":"question","qid":"15419139","cat":"逻辑判断","stem":"珠穆朗玛峰为什么会成为世界最高峰呢？研究发现，大约89万年前，发源于喜马拉雅山脉的阿润河受大洪水作用，河流改道，由北向南在珠穆朗玛峰附近切割出一条峡谷，汇入巨大的科西河。这一过程侵蚀带走了大量岩石和土壤，研究人员认为，这是珠峰成为世界最高峰的一个原因。\n以下各项如果为真，最能支持研究人员观点的是：","options":{"A":"阿润河迅速侵蚀河道，带走大量沉积物，使地壳从中释放出来","B":"另一项研究指出，阿润河与科西河汇合过程，最终使珠峰隆升50米","C":"河流侵蚀对珠峰成为世界之巅有影响，并且对其他山峰的高度有影响","D":"大量岩石和土壤被侵蚀带走，珠峰因附近地球外壳质量少而缓慢上升"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：阿润河受大洪水作用改道汇入科西河，这一过程侵蚀带走大量岩石和土壤，是珠峰成为世界最高峰的一个原因。\n论据：无。\n本题只有论点没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：指出阿润河侵蚀河道带走沉积物使地壳释放，但不明确地壳释放与珠峰成为世界最高峰之间的关系，为不明确项，无法加强，排除；\nB项：指出阿润河与科西河汇合过程使珠峰隆升50米，说明阿润河与科西河的汇合过程增加了珠峰的高度，可能使得珠峰成为世界最高峰，补充论据，可以加强，保留；\nC项：指出河流侵蚀对珠峰成为世界之巅有影响，但未提及影响具体有哪些、影响有多大，为不明确项，无法加强，排除；\nD项：指出大量岩石和土壤被侵蚀带走，珠峰因附近地球外壳质量少而缓慢上升，说明河流侵蚀作用与珠峰高度上升之间的因果关系，解释了为什么河流改道侵蚀带走大量岩石和土壤是珠峰成为世界最高峰的一个原因，补充论据，可以加强，保留。\n对比B、D两项，B项只说明了阿润河与科西河汇合过程使珠峰隆升50米，这可能是珠峰成为世界最高峰的一个原因，而D项明确指出了河流侵蚀作用与珠峰高度上升之间的因果关系，因此D项加强的力度更大，当选。\n故正确答案为D。","no":101,"missingImage":false},{"type":"question","qid":"15419149","cat":"逻辑判断","stem":"巴黎协定时对全球升温的乐观限制是只能比工业化前气温升高\u003cimg data-k=\"96d5b06d76f8\">。最近有学者提出了气候过冲论，其认为，不必太固执于\u003cimg data-k=\"96d5b06d76f8\">的升温限制，可以暂时性超过这一目标，然后再通过减少二氧化碳排放让升温回到\u003cimg data-k=\"96d5b06d76f8\">以下。\n以下各项如果为真，最能质疑上述观点的是：","options":{"A":"升温\u003cimg data-k=\"96d5b06d76f8\">以上，地球系统会形成较强的变暖放大效应，会造成长期大幅升温","B":"过冲后，地球系统的物种丰度、碳储量和陆地生物多样性等回不到之前的水平","C":"现在切实降低全球气温比尝试过冲后让全球升温稳定下来更易避免气候风险","D":"不能对过冲后的可控性过度自信，快速减少排放才是限制气候变化的有效手段"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：不必太固执于\u003cimg data-k=\"96d5b06d76f8\">的升温限制，可以暂时性超过这一目标，然后再通过减少二氧化碳排放让升温回到\u003cimg data-k=\"96d5b06d76f8\">以下。\n论据：无。\n本题只有论点没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：指出升温\u003cimg data-k=\"96d5b06d76f8\">以上，地球系统会形成较强的变暖放大效应，会造成长期大幅升温，说明升温\u003cimg data-k=\"96d5b06d76f8\">以上不是暂时性的，很难再让升温回到\u003cimg data-k=\"96d5b06d76f8\">以下，削弱论点，可以削弱，当选；\nB项：指出过冲后，地球系统的物种丰度、碳储量和陆地生物多样性等回不到之前的水平，但论点讨论的是能否让升温回到\u003cimg data-k=\"96d5b06d76f8\">以下，话题不一致，无法削弱，排除；\nC项：指出现在切实降低全球气温比尝试过冲后让全球升温稳定下来更易避免气候风险，但论点讨论的是能否让升温回到\u003cimg data-k=\"96d5b06d76f8\">以下，话题不一致，无法削弱，排除；\nD项：指出不能对过冲后的可控性过度自信，快速减少排放才是限制气候变化的有效手段，但不明确过冲后能否让升温回到\u003cimg data-k=\"96d5b06d76f8\">以下，为不明确项，无法削弱，排除。\n故正确答案为A。","no":102,"missingImage":false},{"type":"question","qid":"15419150","cat":"逻辑判断","stem":"水果里的酸是有机酸，比如柠檬中含有的柠檬酸。有机酸还包括苹果酸、水杨酸等。水果中酸含量高出含糖量，吃起来酸味就比较浓，反之甜味则比较浓，水果中有机酸含量和维生素C含量之间并没有必然联系，比如很酸的柠檬，实际上维生素C含量并不高，而大枣、猕猴桃等维生素C含量则很高。\n以上叙述如果为真，最能质疑以下的哪一项？","options":{"A":"想补充维生素C可以多吃水果","B":"酸甜水果多含有大量维生素C","C":"水果的酸味由有机酸含量决定","D":"水果越酸，维生素C含量越高"},"answer":"D","explanation":"第一步：分析题干。\n问法为用题干叙述来削弱选项论点，所以题干叙述内容可视为论据。\n论据：水果里的酸是有机酸，水果中酸含量高出含糖量，吃起来酸味就比较浓，反之甜味则比较浓，水果中有机酸含量和维生素C含量之间并没有必然联系。\n第二步：逐一分析选项。\nA项：提出论点“想补充维生素C可以多吃水果”，题干论据只提到了大枣、猕猴桃的维生素C含量高，但不明确其他水果是否也可以用来补充维生素C，无法削弱选项论点，排除；\nB项：提出论点“酸甜水果多含有大量维生素C”，题干论据说“水果中有机酸含量和维生素C含量之间并没有必然联系”，因此不明确酸甜水果中是否多含有大量维生素C，无法削弱选项论点，排除；\nC项：提出论点“水果的酸味由有机酸含量决定”，题干论据说“水果里的酸是有机酸，水果中酸含量高出含糖量，吃起来酸味就比较浓，反之甜味则比较浓”，可以说明水果的酸味是由有机酸含量决定的，可以加强，无法削弱选项论点，排除；\nD项：提出论点“水果越酸，维生素C含量越高”，即论点认为“水果中有机酸含量越高，维生素C含量就越高，二者有联系”，而题干论据说“水果中有机酸含量和维生素C含量之间并没有必然联系”，可以削弱选项论点，当选。\n故正确答案为D。","no":103,"missingImage":false},{"type":"question","qid":"15419147","cat":"逻辑判断","stem":"多年来，站着工作一直备受推崇。专家们认为，久坐会损害员工健康，建议人们站着回复电子邮件、开会或处理文件······有些人甚至把办公桌换成了加高的。然而在研究分析了8万多名成年人的数据后发现，站立时间过长并不能弥补久坐不动的损害。研究结论为，长时间站立工作会加剧血液循环系统患静脉曲张或静脉炎等风险，损害身体健康。\n上述结论若要增强说服力，最需补充的前提是：","options":{"A":"久坐不动对大多数人来说会有风险，但比站着办公带来的风险可能要小得多","B":"站立时间超过两小时后，每增加半小时，患循环系统疾病的风险增加11%","C":"长时间站立工作的人，不进行适当运动锻炼都不会降低患心血管疾病的风险","D":"即使在一天中进行了运动锻炼，长期站立工作也存在患心血管疾病的风险"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：长时间站立工作会加剧血液循环系统患静脉曲张或静脉炎等风险，损害身体健康。\n论据：站立时间过长并不能弥补久坐不动的损害。\n本题论点和论据均重点讨论的是长时间站立对身体的损害，话题一致，加强可以考虑必要条件、补充论据。\n第二步：逐一分析选项。\nA项：指出站着办公的风险比久坐不动要大，但并未提及是否会“加剧血液循环系统患静脉曲张或静脉炎”的风险，为不明确项，无法加强，排除；\nB项：指出站立时间超过两小时后，每增加半小时，患循环系统疾病的风险增加11%，说明长时间站立工作会损害身体健康，补充论据，可以加强，当选；\nC项：指出长时间站立工作的人，不进行适当运动锻炼都不会降低患心血管疾病的风险，说明长时间站立工作中，适当运动锻炼和降低患心血管疾病的风险之间存在联系，但不明确长时间站立工作和患心血管疾病的风险之间的关系，为不明确项，无法加强，排除；\nD项：指出即使在一天中进行了运动锻炼，长期站立工作也存在患心血管疾病的风险，说明长时间站立工作中，运动锻炼并不会影响患心血管疾病的风险，但不明确长时间站立工作和患心血管疾病的风险之间的关系，为不明确项，无法加强，排除。\n故正确答案为B。","no":104,"missingImage":false}],"count":40,"answerable":40,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2024年11月证券期货经营机构共计销售产品928支。\u003c/p>\u003cp>\u003cimg data-k=\"7754fd51a90d\" style=\"max-width:600px\">\u003c/p>\u003cp>\u003cimg data-k=\"db16ca44cb93\" style=\"max-width:600px\">\u003c/p>","questions":[{"qid":"15419184","cat":"综合","stem":"以下柱状图反映了2024年哪一时间段内，证券期货经营机构各类私募资管产品哪一指标的环比增量变化趋势（横轴位置代表增量为0）？\n\u003cimg data-k=\"77d427065391\" style=\"max-width:300px\">","options":{"A":"2-5月产品数量","B":"3-6月设立规模","C":"6-9月产品数量","D":"7-10月设立规模"},"answer":"D","explanation":"根据题干“······环比增量变化趋势······”，可判定本题为增长量比较问题。定位统计图可得2024年1月-2024年10月证券期货经营机构私募资管产品数量和设立规模。根据公式：增长量=现期量-基期量，可得选项中各指标环比增长量如下：\nA项，2-5月产品数量：2月，497-809=-312支，环比增长量&lt;0，而柱状图（横轴位置代表增量为0）中2024年2月产品数量的环比增长量&gt;0，不符合柱状图变化趋势，排除；\nB项，3-6月设立规模：3月，534.25-234.82=299.43亿元；4月，518.72-534.25=-15.53亿元，环比增长量&lt;0，而柱状图（横轴位置代表增量为0）中2024年4月设立规模的环比增长量&gt;0，不符合柱状图变化趋势，排除；\nC项，6-9月产品数量：6月，861-666=195支；7月，878-861=17支。2024年6月产品数量的环比增长量&gt;2024年7月产品数量的环比增长量，不符合柱状图变化趋势，排除；\nD项，7-10月设立规模：7月，543.38-410.37=133.01亿元；8月，690.80-543.38=147.42亿元；9月，491.41-690.80=-199.39亿元；10月，324.49-491.41=-166.92亿元。符合柱状图变化趋势，当选。\n故正确答案为D。","no":105,"missingImage":false},{"qid":"15419185","cat":"综合","stem":"2024年上半年，证券期货经营机构共备案私募资管产品：","options":{"A":"不到4400支","B":"4400-4500支之间","C":"4500-4600支之间","D":"超过4600支"},"answer":"A","explanation":"定位统计图可得2024年1月-2024年6月，证券期货经营机构备案私募资管产品数量。则2024年上半年，证券期货经营机构共备案私募资管 <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){
  var base=(window.__EXAM__&&window.__EXAM__.imgBase)||"";
  return base+((window.__IMGS__ && window.__IMGS__[k]) || "");
}
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
