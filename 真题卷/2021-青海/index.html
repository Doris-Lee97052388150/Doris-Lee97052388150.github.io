<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2021年青海省公务员录用考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2021-青海","title":"2021年青海省公务员录用考试《行测》题（网友回忆版）","year":"2021","group":"青海","modules":[{"label":"政治理论","items":[{"type":"question","qid":"3522334","cat":"时事政治","stem":"在2020年12月召开的中央农村工作会议上，习近平总书记强调，在向第二个百年奋斗目标迈进的历史关口，巩固和拓展脱贫攻坚成果，全面推进乡村振兴，加快农业农村现代化，是需要全党高度重视的一个关系大局的重大问题。下列有关会议主要内容表述正确的是：","options":{"A":"脱贫攻坚目标完成后，对摆脱贫困的县，从脱贫之日起设立3年过渡期","B":"要健全防止返贫动态监测和帮扶机制，对易返贫致贫人口实施常态化监测","C":"构建新发展格局，把战略基点放在开源节流上，农村有巨大空间，可以大有作为","D":"要牢牢把住粮食生产主动权，严防死守13亿亩耕地红线，落实最严格的耕地保护制度"},"answer":"B","explanation":"本题考查政治常识。中央农村工作会议于2020年12月28日至29日在北京举行。习近平出席会议并发表重要讲话强调，在向第二个百年奋斗目标迈进的历史关口，巩固和拓展脱贫攻坚成果，全面推进乡村振兴，加快农业农村现代化，是需要全党高度重视的一个关系大局的重大问题。\nA项错误，习近平强调，党中央决定，脱贫攻坚目标任务完成后，对摆脱贫困的县，从脱贫之日起设立5年过渡期。过渡期内要保持主要帮扶政策总体稳定。\nB项正确，习近平指出，要健全防止返贫动态监测和帮扶机制，对易返贫致贫人口实施常态化监测，重点监测收入水平变化和“两不愁三保障”巩固情况，继续精准施策。\nC项错误，习近平强调，从中华民族伟大复兴战略全局看，民族要复兴，乡村必振兴。从世界百年未有之大变局看，稳住农业基本盘、守好“三农”基础是应变局、开新局的“压舱石”。构建新发展格局，把战略基点放在扩大内需上，农村有巨大空间，可以大有作为。\nD项错误，习近平指出，要牢牢把住粮食安全主动权，粮食生产年年要抓紧。要严防死守18亿亩耕地红线，采取长牙齿的硬措施，落实最严格的耕地保护制度。\n故正确答案为B。","no":1,"missingImage":false},{"type":"question","qid":"3523534","cat":"新思想","stem":"下列不属于中国共产党在延安时期制定的廉政制度的是：","options":{"A":"《陕甘宁边区政府惩治贪污暂行条例》","B":"《陕甘宁边区政务人员公约》","C":"《陕甘宁边区保障人权财权条例》","D":"《陕甘宁边区各级政府干部奖惩暂行条例草案》"},"answer":"C","explanation":"本题考查政治常识。\n延安时期指的是中共中央在陕北的13年，具体指从1935年10月19日中共中央率领中国工农红军陕甘宁支队达陕北吴起镇（今吴起县）算起，到1948年3月23日中共中央东渡黄河、离开陕北进入华北为止，大约13年的时间。延安时期始终对革命队伍里公职人员的贪污腐化行为保持高压态势，严惩不贷。\nA项正确，1938年8月15日，陕甘宁边区抗日民主政府为防止和惩治行政机关、武装部队和公营企业中的贪污现象，制定并颁布了《陕甘宁边区政府惩治贪污暂行条例》。\nB项正确，1943年5月8日，陕甘宁边区政府颁布《陕甘宁边区政务人员公约》。公约是经过边区政府委员会通过，以陕甘宁边区政府主席林伯渠、副主席李鼎铭命令形式颁布的。该公约中第五条规定：“公正廉洁，奉公守法。”，将其作为政府公务人员必须遵守的基本行为准则和道德品格。\nC项错误，1942年2月，陕甘宁边区政府颁布《陕甘宁边区保障人权财权条例》，共22条，主要规定：边区一切抗日人民，不分民族、阶级、党派、性别、职业与宗教，都有言论、出版、集会、结社、居住、迁徙及思想信仰之自由，并享有平等的民主权利。保障边区一切抗日人民的私有财产及依法使用自由权。在土地已经分配的区域，保证一切取得土地的农民之私有土地制，在土地未经分配的区域，保证地主的土地所有权及债主的债权。条例中未涉及廉政方面的内容。\nD项正确，1943年4月，为确保各级政府机关工作任务的完成，发扬干部的积极性与模范作用，鼓励进步反对落后，陕甘宁边区政府颁布了《陕甘宁边区各级政府干部奖惩暂行条例草案》。其中规定：“对贪赃枉法、腐化堕落、假公济私、包庇蒙蔽者，给以下列惩戒：撤职查办或向法院提起公诉；撤职；撤职留任；记过；警告或申诉。”\n本题为选非题，故正确答案为C。","no":2,"missingImage":false}],"count":2,"answerable":2,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"3522336","cat":"人文常识","stem":"“十四五”时期是我国全面建成小康社会、实现第一个百年奋斗目标之后，乘势而上开启全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军的第一个五年。下列有关说法正确的是：","options":{"A":"提出到本世纪中叶基本实现社会主义现代化远景目标，人均国内生产总值达到中等发达国家水平，中等收入群体显著扩大","B":"坚持把发展经济着力点放在实体经济上，坚定不移建设制造强国、质量强国、网络强国、数字中国","C":"坚持又快又好工作总基调，以推动高质量发展为主题，以深化供给侧结构性改革为主线","D":"“十四五”规划是在党的十九届四中全会上审议通过的，将于2021年开始实施"},"answer":"B","explanation":"本题考查政治常识。2020年10月29日，中国共产党第十九届中央委员会第五次全体会议通过了《中共中央关于制定国民经济和社会发展第十四个五年规划和二〇三五年远景目标的建议》（以下简称《建议》）。\nA项错误：《建议》指出：“到二〇三五年基本实现社会主义现代化远景目标。党的十九大对实现第二个百年奋斗目标作出分两个阶段推进的战略安排，即到二〇三五年基本实现社会主义现代化，到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。展望二〇三五年，······人均国内生产总值达到中等发达国家水平，中等收入群体显著扩大，基本公共服务实现均等化，城乡区域发展差距和居民生活水平差距显著缩小；平安中国建设达到更高水平，基本实现国防和军队现代化；人民生活更加美好，人的全面发展、全体人民共同富裕取得更为明显的实质性进展。”\nB项正确：《建议》指出：“坚持把发展经济着力点放在实体经济上，坚定不移建设制造强国、质量强国、网络强国、数字中国，推进产业基础高级化、产业链现代化，提高经济质量效益和核心竞争力。”\nC项错误：《建议》指出：“坚持稳中求进工作总基调，以推动高质量发展为主题，以深化供给侧结构性改革为主线，以改革创新为根本动力，以满足人民日益增长的美好生活需要为根本目的，统筹发展和安全，加快建设现代化经济体系，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推进国家治理体系和治理能力现代化，实现经济行稳致远、社会安定和谐，为全面建设社会主义现代化国家开好局、起好步。”\nD项错误，2021年3月11日，十三届全国人大四次会议表决通过了《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》（简称“十四五”规划）。“十四五”规划将于2021年开始实施。\n故正确答案为B。","no":3,"missingImage":false},{"type":"question","qid":"3523517","cat":"人文常识","stem":"党的十九届五中全会审议通过的《中共中央关于制定国民经济和社会发展第十四个五年规划和二〇三五年远景目标的建议》，明确提出到2035年建成社会主义文化强国的远景目标。关于社会主义文化强国建设目标任务，下列表述正确的有几项？\n①提高社会文明程度\n②提升公共文化服务水平\n③健全现代文化产业体系\n④加强对外文化交流和多层次文明对话","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查政治常识。\n党的十九届五中全会审议通过的《中共中央关于制定国民经济和社会发展第十四个五年规划和二〇三五年远景目标的建议》中在繁荣发展文化事业和文化产业，提高国家文化软实力方面部署了三个方面的重点任务：一是提高社会文明程度，二是提升公共文化服务水平，三是健全现代文化产业体系。以讲好中国故事为着力点，创新推进国际传播，加强对外文化交流和多层次文明对话。\n故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"3522745","cat":"人文常识","stem":"下列有关我国疫情防控的说法错误的是：","options":{"A":"被隔离的人员，有工作单位的，工作单位不得停止支付其隔离期间的工作报酬","B":"根据《传染病防治法》的规定，发现传染病病人时，应当及时向附近的公安机关报告","C":"全国抗击新冠肺炎疫情表彰大会于2020年9月在人民大会堂举行，习近平总书记在大会上发表重要讲话","D":"2020年6月发布的《抗击新冠肺炎疫情的中国行动》白皮书，是真实记录中国抗疫艰辛历程的重要文献"},"answer":"B","explanation":"本题考查政治常识。\nA项正确，根据《传染病防治法》第四十一条第二款规定：“在隔离期间，实施隔离措施的人民政府应当对被隔离人员提供生活保障；被隔离人员有工作单位的，所在单位不得停止支付其隔离期间的工作报酬。”\nB项错误，根据《传染病防治法》第三十一条规定：“任何单位和个人发现传染病病人或者疑似传染病病人时，应当及时向附近的疾病预防控制机构或者医疗机构报告。”\nC项正确，2020年9月8日，全国抗击新冠肺炎疫情表彰大会在北京人民大会堂隆重举行。习近平总书记向国家勋章和国家荣誉称号获得者颁授勋章奖章并发表重要讲话。\nD项正确，2020年6月发布的《抗击新冠肺炎疫情的中国行动》白皮书是真实记录中国抗疫艰辛历程的重要文献，约3.7万字，包括前言、正文和结束语。正文分为四个部分，分别是中国抗击疫情的艰辛历程、防控和救治两个战场协同作战、凝聚抗击疫情的强大力量、共同构建人类卫生健康共同体。\n本题为选非题，故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"3522345","cat":"科技常识","stem":"下列有关我国2020年科技成就的说法正确的是：","options":{"A":"2020年12月，嫦娥五号返回器成功着陆，这是我国首次完成月球采样返回任务","B":"我国研制的“奋斗者”号载人潜水器于2020年11月坐底菲律宾海沟，创造了我国载人深潜新纪录","C":"中国环流器二号M装置于2020年底建成并实现首次放电，为我国核裂变堆的设计建造打下了坚实基础","D":"2020年7月，北斗三号全球卫星导航系统全面建成并开通服务，我国成为第四个独立拥有全球卫星导航系统的国家"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，2020年12月17日，探月工程嫦娥五号返回器在内蒙古四子王旗预定区域成功着陆，标志着我国首次月球采样返回任务圆满完成。\nB项错误，2020年11月10日8时12分，中国“奋斗者”号载人潜水器在马里亚纳海沟成功坐底，坐底深度10909米，创造了中国载人深潜的新纪录。\nC项错误，2020年12月4日14时，新一代“人造太阳”装置——中国环流器二号M装置（HL-2M）在成都建成并实现首次放电，标志着中国自主掌握了大型先进托卡马克装置的设计、建造、运行技术，为我国核聚变堆的自主设计与建造打下坚实基础。\nD项错误，北斗系统是党中央决策实施的国家重大科技工程。工程自1994年启动，2000年完成北斗一号系统建设，2012年完成北斗二号系统建设。北斗三号全球卫星导航系统全面建成并开通服务，标志着工程“三步走”发展战略取得决战决胜，我国成为世界上第三个独立拥有全球卫星导航系统的国家。目前，全球已有120余个国家和地区使用北斗系统。\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"3522337","cat":"法律常识","stem":"下列关于我国生态环境保护方面的说法不准确的是：","options":{"A":"第二次全国污染源普查的结果显示，我国主要污染物排放量大幅下降","B":"我国生态环境保护三大保卫战指的是蓝天保卫战、碧水保卫战和净土保卫战","C":"“无废城市”是一种先进的城市管理理念，实现了固体废物的完全资源化利用","D":"新修订的《中华人民共和国森林法》自2020年7月1日起施行，此次修订将森林生态效益补偿写入了法律"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，2020年6月10日，国务院新闻办举行发布会，生态环境部、国家统计局、农业农村部共同发布《第二次全国污染源普查公报》。生态环境部副部长赵英民在国务院新闻办当天举行的新闻发布会上指出，污染源整体情况有三方面的变化：一是主要污染物排放量大幅下降。与第一次全国污染源普查数据同口径相比，2017年二氧化硫、化学需氧量、氮氧化物等污染物排放量比2007年分别下降了\u003cimg data-k=\"ab1d29cfd57c\">、\u003cimg data-k=\"042488f8a2ca\">和\u003cimg data-k=\"800a5fef8390\">。二是产业结构调整成效显著。三是污染治理能力明显提升。\nB项正确，2018年6月24日公布的《中共中央国务院关于全面加强生态环境保护坚决打好污染防治攻坚战的意见》提出，坚决打赢蓝天保卫战，着力打好碧水保卫战，扎实推进净土保卫战。\nC项错误，2019年1月21日，国务院办公厅发布了《“无废城市”建设试点工作方案》。指出，“无废城市”是以创新、协调、绿色、开放、共享的新发展理念为引领，通过推动形成绿色发展方式和生活方式，持续推进固体废物源头减量和资源化利用，最大限度减少填埋量，将固体废物环境影响降至最低的城市发展模式。“无废城市”并不是没有固体废物产生，也不意味着固体废物能完全资源化利用，而是一种先进的城市管理理念。\nD项正确，中华人民共和国第十三届全国人民代表大会常务委员会第十五次会议于2019年12月28日修订通过《中华人民共和国森林法》。新修订的《中华人民共和国森林法》自2020年7月1日起施行。新修订的《中华人民共和国森林法》第七条指出：“国家建立森林生态效益补偿制度，加大公益林保护支持力度，完善重点生态功能区转移支付政策，指导受益地区和森林生态保护地区人民政府通过协商等方式进行生态效益补偿。”\n本题为选非题，故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"3522701","cat":"人文常识","stem":"王某向李某借款1万元，李某当场向王某交付现金1万元，王某向李某出具借条一份，张某在该借条上签字，后王某没有按时还钱，李某将王某和张某同时起诉至法院，要求王某还钱，并要求张某承担连带责任。关于张某的责任，下列说法正确的是:","options":{"A":"张某只是作为见证人签字，无须承担任何责任","B":"张某在别人的借条上签字，应当推定为保证人，并承担保证责任","C":"张某在别人的借条上签字，视同共同借款人，应当承担共同还款责任","D":"只要借条上没有任何明确表述或其他事实表明张某愿意承担保证责任的，张某即无须承担任何责任"},"answer":"D","explanation":"本题考查法律常识。\n根据《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第二十条规定：“他人在借据、收据、欠条等债权凭证或者借款合同上签名或者盖章，但是未表明其保证人身份或者承担保证责任，或者通过其他事实不能推定其为保证人，出借人请求其承担保证责任的，人民法院不予支持。”故只要借条上没有任何明确表述或其他事实表明张某愿意承担保证责任的，张某即无须承担任何责任。\n故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"3522346","cat":"法律常识","stem":"下列有关《中华人民共和国民法典》的说法不正确的是：","options":{"A":"民法典将人格权独立成编，调整的是因人格权的享有和保护产生的民事关系","B":"八周岁以上的未成年人为限制民事行为能力人，不可独立实施纯获利益的民事法律行为","C":"民法典实施后，婚姻法、继承法、民法通则、收养法、担保法、合同法、物权法、侵权责任法、民法总则同时废止","D":"民法典规定，自然人享有隐私权，隐私是自然人的私人生活安宁和不愿为他人知晓的私密空间、私密活动、私密信息"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国民法典》第九百八十九条规定：“本编调整因人格权的享有和保护产生的民事关系。”民法典将人格权独立成编，调整的是因人格权的享有和保护产生的民事关系。\nB项错误，根据《中华人民共和国民法典》第十九条规定：“八周岁以上的未成年人为限制民事行为能力人，实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认；但是，可以独立实施纯获利益的民事法律行为或者与其年龄、智力相适应的民事法律行为。”因此，八周岁以上的未成年人可以独立实施纯获利益的民事法律行为或者与其年龄、智力相适应的民事法律行为。\nC项正确，根据《中华人民共和国民法典》第一千二百六十条规定：“本法自2021年1月1日起施行。《中华人民共和国婚姻法》、《中华人民共和国继承法》、《中华人民共和国民法通则》、《中华人民共和国收养法》、《中华人民共和国担保法》、《中华人民共和国合同法》、《中华人民共和国物权法》、《中华人民共和国侵权责任法》、《中华人民共和国民法总则》同时废止。”\nD项正确，根据《中华人民共和国民法典》第一千零三十二条规定：“自然人享有隐私权。任何组织或者个人不得以刺探、侵扰、泄露、公开等方式侵害他人的隐私权。隐私是自然人的私人生活安宁和不愿为他人知晓的私密空间、私密活动、私密信息。”\n本题为选非题，故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"3522340","cat":"人文常识","stem":"下列关于第七次全国人口普查工作的表述不正确的是：","options":{"A":"本次普查首次采集普查对象身份证号，以实现与公安、卫健等部门行政记录的比对核查","B":"本次普查采用全面调查的方法，以人为单位进行登记，普查对象可通过互联网自主填报","C":"普查短表包括反映人口基本状况的项目，由全部住户（不含港澳台居民和外籍人员）填报","D":"根据《全国人口普查条例》，人口普查工作每10年进行一次，尾数逢0的年份为普查年度"},"answer":"B","explanation":"本题考查政治常识。\nA项正确，第七次全国人口普查工作首次采集普查对象身份证号，这主要是出于数据比对的目的。所填数据将实现与公安、卫健等部门行政记录的比对核查，为的就是确保数据的真实性和准确性，并会对身份证号信息进行保密处理，普查全流程加强对公民个人信息的保护，严禁泄露公民个人信息。\nB项错误，根据《第七次全国人口普查方案》规定：普查采用全面调查的方法，以户为单位进行登记。普查数据采集原则上采用电子化的方式。采取普查员使用电子采集设备（PAD或智能手机）登记普查对象信息并联网实时上报，或由普查对象通过互联网自主填报等方式进行。\nC项正确，根据《第七次全国人口普查方案》规定：普查短表包括反映人口基本状况的项目，由全部住户（不包括港澳台居民和外籍人员）填报。\nD项正确，新中国成立以来，我国分别在1953年、1964年、1982年、1990年、2000年和2010年成功进行过六次全国人口普查。根据《全国人口普查条例》有关规定，人口普查工作每10年进行一次，尾数逢“0”的年份为普查年度。经国务院批准，2020年开展第七次全国人口普查。\n本题为选非题，故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"3522335","cat":"经济常识","stem":"下列关于风险管理的做法合适的是：","options":{"A":"某商业银行对不同信用等级的客户适用相同的贷款利率","B":"李某担心家中古董被盗造成损失，向保险公司购买财产保险","C":"考虑到大人和小孩风险承受力强弱不一，购买保险时小孩应优先于大人","D":"某外贸公司将要进口一批美国货物，为规避美元升值风险，向银行申请开立保函"},"answer":"B","explanation":"本题考查经济常识。风险管理流程主要包括风险识别、风险计量、风险监测和风险控制四个步骤，其中风险控制是对经过识别和计量的风险采取分散、对冲、转移、规避和补偿等措施，进行有效管理和控制的过程。\nA项错误，商业银行可以预先在金融资产定价中充分考虑到各种风险因素，通过价格调整来获得合理的风险回报，而对于那些无法通过风险分散、风险对冲、风险转移或风险规避进行有效管理的风险，商业银行可以采取在交易价格上附加更高的风险溢价，即通过提高风险回报的方式，获得承担风险的价格补偿。不同的信用的等级的客户有着不同程度的违约风险，应该适用不同的贷款利率，而不是相同的贷款利率，低信用等级的贷款利率由于信用风险更高，银行为了获得风险的价格补偿，应提供相对较高的贷款利率。\nB项正确，风险转移是指通过购买某种金融产品或采取其他合法的经济措施将风险转移给其他经济主体的一种策略性选择。风险转移可分为保险转移和非保险转移，其中保险转移是指通过买保险，以缴纳保险费为代价，将风险转移给承保人。李某担心家中古董被盗造成财产损失，可以通过向保险公司购买财产保险，将财产损失的风险转移给保险公司。\nC项错误，根据购买保险的原则，大人应该优先于小孩。如果优先给小孩配置保险，一旦大人生病或发生意外事故，则家庭将失去主要的经济来源，同时还要负担大笔的医疗费用支出，小孩的生活、教育开支将同样受到影响。因此，在购买保险时应该优先考虑大人，尤其是家中的经济支柱。\nD项错误，保函，又称保证书，是指银行、保险公司、担保公司或担保人应申请人的请求，向受益人开立的一种书面信用担保凭证。保证在申请人未能按双方协议履行其责任或义务时，由担保人代其履行一定金额、一定时限范围内的某种支付或经济赔偿责任。银行保函以银行为担保人转移违约风险，但并不能转移美元升值的外汇风险。进口商为了避免美元升值所带来的外汇风险，可以采取远期外汇交易的套期保值，买入远期美元，而不是找银行开立保函。\n故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"3522349","cat":"法律常识","stem":"根据我国法律规定，下列表述正确的是：","options":{"A":"甲应聘某基层人民法院陪审员，其就职时可以依照法律规定公开进行宪法宣誓","B":"乙是某大型超市收银员，利用工作便利私自窃取货款5万元，其行为构成贪污罪","C":"丙是某县负责抗洪指挥工作的领导，在救灾过程中带人打麻将，未及时检查造成垮堤，其行为构成玩忽职守罪","D":"丁是某市电视台总导演，利用职务便利收受他人财物数额巨大，但因其不属于国家工作人员，因此不构成贪污罪"},"answer":"C","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国人民陪审员法》第十二条规定：“人民陪审员经人民代表大会常务委员会任命后，应当公开进行就职宣誓。宣誓仪式由基层人民法院会同司法行政机关组织。”《全国人民代表大会常务委员会关于实行宪法宣誓制度的决定》指出：“一、各级人民代表大会及县级以上各级人民代表大会常务委员会选举或者决定任命的国家工作人员，以及各级人民政府、监察委员会、人民法院、人民检察院任命的国家工作人员，在就职时应当公开进行宪法宣誓。”本项中，甲就职时应当依照法律规定公开进行宪法宣誓，而非“可以”。\nB项错误，贪污罪，是指国家工作人员和受国家机关、国有公司、企业、事业单位、人民团体委托管理、经营国有财产的人员，利用职务上的便利，侵吞、窃取、骗取或者以其他手段非法占有公共财物的行为。职务侵占罪，指公司、企业或者其他单位的人员，利用职务上的便利，将本单位财物非法占为己有，数额较大的行为。乙是超市的收银员，并非国家工作人员，不构成贪污罪，构成职务侵占罪。\nC项正确，玩忽职守罪，是指国家机关工作人员严重不负责任，不履行或不正确地履行自己的工作职责，致使公共财产、国家和人民利益遭受重大损失的行为。因此，玩忽职守罪的主观方面是过失。丙作为某县负责抗洪指挥工作的领导，在救灾过程中带人打麻将，未及时检查造成垮堤就属于严重不负责任，构成玩忽职守罪。\nD项错误，贪污罪，是指国家工作人员和受国家机关、国有公司、企业、事业单位、人民团体委托管理、经营国有财产的人员，利用职务上的便利，侵吞、窃取、骗取或者以其他手段非法占有公共财物的行为。受贿罪，指国家工作人员利用职务上的便利，索取他人财物，或者非法收受他人财物，为他人谋取利益的行为。《刑法》第九十三条规定：“本法所称国家工作人员，是指国家机关中从事公务的人员。国有公司、企业、事业单位、人民团体中从事公务的人员和国家机关、国有公司、企业、事业单位委派到非国有公司、企业、事业单位、社会团体从事公务的人员，以及其他依照法律从事公务的人员，以国家工作人员论。”丁是事业单位电视台总导演，属于国家工作人员，利用职务便利收受他人财物，不构成贪污罪，应当构成受贿罪。\n故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"3522344","cat":"人文常识","stem":"下列谚语不涉及二十四节气的是：","options":{"A":"花木管时令，鸟鸣报农时","B":"白露身不露，寒露脚不露","C":"日晕三更雨，月晕午时风","D":"秋分早，霜降迟，寒露种麦正当时"},"answer":"C","explanation":"本题考查人文常识。\n二十四节气，是干支历中表示自然节律变化以及确立“十二月建”的特定节令。现行的“二十四节气”是依据太阳在回归黄道上的位置制定，即把太阳周年运动轨迹划分为24等份，每\u003cimg data-k=\"258a53625553\">为1等份，每1等份为一个节气，始于立春，终于大寒。“二十四节气”是中华民族悠久历史文化的重要组成部分。\nA项正确，“花木管时令，鸟鸣报农时”，意为不管是花草也好，鸟兽也罢，它们的活动大多呈现出季节性以及规律性，因此，被当作区分时令的重要参考。该谚语涉及二十四节气。\nB项正确，“白露身不露，寒露脚不露”，意为白露节气一过，穿衣服就不能再赤膊露体；寒露节气一过，应注重足部保暖。该谚语涉及二十四节气。\nC项错误，“日晕三更雨，月晕午时风”，意为若出现日晕的话，夜半三更将有雨，若出现月晕，则次日中午会刮风。该谚语不涉及二十四节气。\nD项正确，“秋分早，霜降迟，寒露种麦正当时”，意为把握种麦时间，秋分时种麦早了，霜降时种麦迟了，而寒露时种麦是最好的。该谚语涉及二十四节气。\n本题为选非题，故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"3522355","cat":"科技常识","stem":"下列变化过程包含化学反应的有：\n①鬼火\n②光合作用\n③水垢形成\n④高粱酿酒\n⑤舞台云雾的生成","options":{"A":"②③④⑤","B":"①②④⑤","C":"①③④⑤","D":"①②③④"},"answer":"D","explanation":"本题考查科技常识。\n①正确，“鬼火”也被称为“磷火”，是化学中的自燃现象，常发生在农村，一般出现在夏季的坟墓周围。发生“鬼火”的原因是人的骨头里含有磷元素，尸体腐烂后经过变化会生成磷化氢，磷化氢的燃点很低，可以自燃。\n②正确，光合作用是指含有叶绿素等光合色素的绿色植物和某些细菌，在可见光的照射下，经过光反应和碳反应，利用光合色素，将二氧化碳和水转化为有机物，并释放出氧气的生化过程。同时也有将光能转变为有机物中化学能的能量转化过程。\n③正确，含有钙、镁等盐类杂质的水进入水壶后，在烧水时吸收了许多热量，钙、镁盐类杂质便会发生化学反应，生成难以溶解的物质，最后析出，析出物随着沸水的不断蒸发而逐渐浓缩，当达到一定浓度时，就会成为固体，并沉淀附着在水壶内壁上，形成一层白色的“膜”。这就是我们所说的水垢，它的主要成分是碳酸钙、碳酸镁等。\n④正确，酿酒是利用微生物发酵生产含一定浓度酒精饮料的过程。高粱在微生物作用下，经过复杂的生物化学反应，产生乙醇和白酒中的香味物质。\n⑤错误，干冰是固态的二氧化碳，其升华时吸收大量的热，使其周围的温度迅速降低。处于低温区内的水蒸气就会液化成小水珠，许多细小的水珠聚在一起，在空中飘浮，就成为舞台上的云雾，属于物理变化。\n因此①②③④包含化学反应。\n故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"3522746","cat":"人文常识","stem":"下列情形不可能发生的是：","options":{"A":"唐代安史之乱导致北方农业受损，农民不得不以红薯为主食","B":"明末英国瓷器商人评论曾看过的《牡丹亭》《罗密欧与朱丽叶》","C":"明代随郑和访问斯里兰卡的水手，听说东晋法显曾在当地游学","D":"清代随隐元禅师到日本的僧人，到奈良唐招提寺瞻仰鉴真塑像"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，红薯原产于美洲，明万历年间从东南亚传入我国福建等地，清代乾隆嘉庆时期在北方广泛种植，成为全国主要杂粮作物中的一种。故唐代安史之乱时农民不可能吃得到红薯。\nB项正确，《牡丹亭》是明代戏曲家汤显祖（1550年—1616年）的代表作，《罗密欧与朱丽叶》是英国剧作家莎士比亚（1564年—1616年）创作的戏剧，明朝时间为1368年到1644年，故明末瓷器商人可能看过《牡丹亭》《罗密欧与朱丽叶》。\nC项正确，在《大唐西域记》中，明人的注中有这样的记载：“皇帝遣中使太监郑和，奉香花往诣彼国（指锡兰，今斯里兰卡）供养······当就礼，请佛牙。”公元409年(东晋义熙五年)，法显从恒河口的多摩梨帝登船，经14日抵楞伽岛，登岸即狮子国（斯里兰卡），故明代访问斯里兰卡的水手，可能听说东晋法显曾在这里游学。\nD项正确，隐元禅师为明末清初临济宗高僧，隐元晚年应日本长崎兴福寺之请赴日弘法。唐招提寺，日本佛教律宗建筑群。简称为招提寺。在日本奈良市西京五条。由中国唐朝鉴真主持，于公元759年开始建造，公元770年建成。鉴真生前，他的弟子们为他制了一尊坐像，供奉在寺中的开山堂，故清代到日本的僧人，可能到奈良唐招提寺瞻仰鉴真塑像。\n本题为选非题，故正确答案为A。","no":15,"missingImage":false},{"type":"question","qid":"3522436","cat":"人文常识","stem":"混凝土搅拌车从泵站运输到工地期间，其罐体必须时刻保持低速转动。下列关于这一操作目的的说法错误的是：","options":{"A":"加速混凝土凝结","B":"促进混凝土充分搅拌","C":"防止混凝土出现离析现象","D":"保证混凝土性能达到施工要求"},"answer":"A","explanation":"本题考查科技常识。\nA项错误、B项正确，混凝土搅拌车罐体时刻保持低速转动能够防止混凝土在运输过程中结块，让混凝土中的砂、石、水泥充分搅拌，混合更为均匀。\nC、D两项正确，混凝土的离析是指混凝土拌合物组成材料之间的粘聚力不足以抵抗粗集料下沉，混凝土拌合物成分相互分离，造成内部组成和结构不均匀的现象。运输中混凝土搅拌车罐体时刻保持低速转动，可以防止混凝土出现离析现象，保证混凝土性能达到施工要求。\n本题为选非题，故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"3522439","cat":"人文常识","stem":"牙膏的主要成分包括摩擦剂、胶黏剂、洁净剂、保湿剂、防腐剂、芳香剂和水等，生产厂家有时会在其中添加相应成分来实现其特殊功效。下列关于牙膏成分作用的说法正确的是：","options":{"A":"甘油在牙膏中起摩擦作用","B":"含氟牙膏对防止龋齿没有效果","C":"加入大量糖精可保持牙膏湿润","D":"加入叶绿素可防止牙龈出血和口臭"},"answer":"D","explanation":"本题考查科技常识。\nA项错误，牙膏中起摩擦作用的成分可以在刷牙时和牙刷一起通过摩擦清洁牙齿，但甘油有润滑作用，不能作摩擦剂。甘油是牙膏中常用的保湿剂，可防止牙膏在软管中固化变硬，并使膏体具有光泽等效能。用于牙膏中的保湿剂有甘油、丙二醇、山梨醇等多种。\nB项错误，龋齿是一种常见的牙釉质受到腐蚀，变软、变色，逐渐发展为牙体硬组织缺损，形成龋洞的疾病。氟是增进牙齿抗龋能力的微量元素，含氟牙膏中有一定含量的氟，有利于牙齿组织钙化和代谢，增强牙齿的抗酸性能和抗龋能力，可有效地防止龋病的发生或使龋病趋愈。\nC项错误，为改善牙膏的口感，牙膏中加了少量糖精。但由于用作保湿剂的甘油等也具有甜味，故糖精的配用量一般为\u003cimg data-k=\"3f1d2985ebad\">～\u003cimg data-k=\"c6f98ff2683d\">。\nD项正确，叶绿素能保持细胞和体内钙的浓度，有利于坚固牙齿，防止牙龈出血，修复牙龈组织；此外，叶绿素的另一重要作用是脱臭，原因在于它可以抑制代谢过程中产生的硫化物。因此牙膏加入叶绿素，对防止牙龈出血及口腔异味有一定功效。\n故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"3523426","cat":"人文常识","stem":"如下图所示，装有水的烧杯放在天平一端，另一端放置砝码使天平平衡，此时再放入一手指在水中，若手指完全静止在水中且没有触碰烧杯壁和烧杯底部，且水也没有溢出，那么这时天平的状态是：\n\u003cimg data-k=\"c106efb305b9\" style=\"max-width:700px\">","options":{"A":"继续保持平衡状态","B":"放置砝码的一端下沉了","C":"放置烧杯的一端下沉了","D":"无法判断"},"answer":"C","explanation":"本题考查科技常识。\n将一手指放在水中，手指没有触碰烧杯壁和烧杯底部，此时手受到水的浮力。因为力的作用是相互的，水会受到浮力的反作用力。力会传到天平上，放置烧杯的一端受到的压力增大，所以放置烧杯的一端会下沉。\n故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"3523372","cat":"科技常识","stem":"下列物理现象与地球自转无关的是：","options":{"A":"日月星辰四季方位的变化","B":"昼夜更替","C":"在北半球，物体从高空自由下落，存在落点偏东的现象","D":"在北半球，水自然形成的漩涡是逆时针方向的"},"answer":"A","explanation":"本题考查地理国情。\nA项错误，日月星辰泛指宇宙的天体，日月星辰四季方位的变化也就是地球绕着太阳公转，转一圈是四个季节，每个季节的位置不同。日月星辰四季方位是由于地球公转引起的。\nB项正确，由于地球是一个既不透明、也不发光的球体，所以在同一时间里，太阳只能照亮地球表面的一半。向着太阳的半球是白天，背着太阳的半球是黑夜。由于地球不停地自转，昼夜也就不断地更替。\nC项正确，落体偏东是由于地球自西向东的旋转引起的。由于随地球自转而具有的线速度，一定大于地面上物体的线速度。所以该物体下落时必然相对地面有一个偏东的速度，落点自然就会偏东。\nD项正确，在北半球，由于地球自转所形成的自转偏向力是向右的，因此水自然形成的漩涡是逆时针方向的。\n本题为选非题，故正确答案为A。","no":19,"missingImage":false},{"type":"question","qid":"3522443","cat":"科技常识","stem":"优秀的足球运动员会利用技巧使踢出的足球在空中旋转，旋转的足球在行进过程中会突然改变原来的运动方向并转弯，这被称为“香蕉球”。\n下列选项的物理原理与“香蕉球”原理不同的是：","options":{"A":"飞机机翼通常设计为上沿是弧形，下沿是平的","B":"用吸管喝袋装牛奶，喝完后用力吸一下，袋子瘪了","C":"火车站台设置黄色安全线以警示乘客与列车保持距离","D":"两张相距5厘米的A4纸垂直放置，往中间吹气，两张纸会互相吸引"},"answer":"B","explanation":"本题考查科技常识。“香蕉球”之所以可以沿弧线飞行，主要是由于伯努利原理（流速越快，压强越小）。运动员踢出的“香蕉球”后，球会边旋转边前进，导致在球周围形成与球旋转方向一致的环形气流，环形气流与足球前进方向一致的一侧，流速会变快，压强减小，环形气流与足球前进方向相反的一侧，流速会变慢，压强增大。由于此时两侧受到的空气压强不相等，在压强作用下，球向压强小的一侧拐弯。\nA项正确，根据伯努利原理，飞机飞行时，机翼将气流分为上下两个部分，上半部分走的路径为弧线，流速快，压强小，下半部分气流走直线，流速慢，压强大。正是由于机翼下侧压强大于机翼上侧，上下压强不相等，产生升力，使飞机能飞起来。\nB项错误，当用吸管吸走袋中空气后，袋中气压瞬间减小，此时外界大气压并未减小，在内外压强差的作用下，袋子被压瘪。该过程并未涉及伯努利原理。\nC项正确，根据伯努利原理，人若离列车太近时，列车高速行驶过程中，使人和列车之间的空气流动速度很快，压强很小，而人外侧的压强不变，人在内外压强差的作用下，被压向列车容易出现事故。因此火车站台设置黄色安全线以警示乘客与列车保持距离。\nD项正确，根据伯努利原理，向两张相距5厘米的A4纸中间吹气时，两张纸中间空气流速快，压强小，而外侧空气基本静止，压强较大，在压力差的作用下，两张纸向中间靠拢。\n本题为选非题，故正确答案为B。","no":20,"missingImage":false}],"count":18,"answerable":18,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"3523492","cat":"逻辑填空","stem":"早在商汤时代，浴盘上就镌刻有“苟日新，日日新，又日新”的铭词，旨在激励自己澡身而浴德，澡雪而精神，既要盥洗身体，更要涤荡心灵，保持向新求新的精神，产生            的进步。\n填入划横线部分最恰当的一项是：","options":{"A":"与日俱进","B":"日新月异","C":"竿头日上","D":"突飞猛进"},"answer":"B","explanation":"根据横线前“保持向新求新的精神”可知，横线处应体现“新”的意思，且与“进步”搭配。B项“日新月异”形容每天都在更新，每月都有变化，可体现出“新”的意思，且搭配恰当，符合文意，当选。\nA项“与日俱进”指随着时间一天天地进步，形容不断进步或提高。“与日俱进”侧重“提高进步”，且“与日俱进”与“进步”存在语义上的重复，搭配不当，排除；\nC项“竿头日上”比喻学业进步很快，体现不出“新”的意思，排除；\nD项“突飞猛进”形容进步和发展特别迅速，文段并未体现“进步和发展特别迅速”，且“突飞猛进”与“进步”重复，搭配不当，排除。\n故正确答案为B。\n【文段出处】《文明：文以化人 日新其德》","no":21,"missingImage":false},{"type":"question","qid":"3522899","cat":"逻辑填空","stem":"人体是一个庞大的共生体。人体皮肤表面、口腔、呼吸道、肠道        着大量微生物，它们的数量是人体本身细胞的数十倍，编码的基因是人体基因的100倍。每个人的身体里都会有微生物留存的痕迹，而人体的健康会与体内的菌群            。人们将特定环境中包括微生物在内的总DNA称为宏基因组。\n依次填入划横线部分最恰当的一项是：","options":{"A":"寄生 同气连枝","B":"依附 表里相依","C":"潜伏 如影随形","D":"生存 休戚与共"},"answer":"D","explanation":"本题从第二空入手，根据前文“人体是一个庞大的共生体”以及“每个人的身体里都会有微生物留存的痕迹”可知，横线处想要体现的是“人体的健康”和“体内的菌群”之间关系密切、共同生存的含义。A项“同气连枝”比喻同胞的兄弟姐妹，“人体的健康”和“体内的菌群”之间并无同胞的关系，排除。B项“表里相依”指关系密切，互相依存，C项“如影随形”比喻两个事物关系密切或两个人关系密切不能分离，D项“休戚与共”形容关系密切，利害相同，三个词语均有关系密切的含义，但是B项“表里相依”和C项“如影随形”两个词语侧重强调两者之间无法分离，相互依存的关系，D项“休戚与共”则更侧重两者关系紧密，利害相同。结合前文提到的“人体”和“菌群”之间是一种“共生”的关系，即两者生活在一个环境里边，健康和菌群之间相互影响，所以D项“休戚与共”更能体现两者之间利害相同，祸福相依这样一种关系，保留，排除B、C两项。\n第一空，代入验证，人体当中“生存”着大量微生物，符合文意，D项当选。\n故正确答案为D。\n【文段出处】《基因测序“黑科技” 给生命来个完整的“数字化解读”》","no":22,"missingImage":false},{"type":"question","qid":"3524807","cat":"逻辑填空","stem":"手工空心挂面以张家山的最出名，自从登上了央视、湖南卫视后，手工空心挂面更红了，张家山更红了，村里几乎家家户户都开始做挂面，男女老少齐动手，房前屋顶，            ，如烟似雾，一进村口，挂面的芬芳和着黄土的清香顿时让人            。\n依次填入划横线部分最恰当的一项是：","options":{"A":"白眉低垂 心旷神怡","B":"银丝摇曳 神清气爽","C":"细如丝织 气定神宁","D":"白丝如雪 沁人心脾"},"answer":"B","explanation":"第一空，根据横线前“家家户户都开始做挂面，男女老少齐动手”可知，横线处应与挂面有关，且横线后用逗号与“如烟似雾”连接表近义并列，故语义相近，横线处要体现房前屋顶挂面的状态，B项“银丝摇曳”、C项“细如丝织”、D项“白丝如雪”均符合文意，保留。A项“白眉低垂”，即老者眼眉低低的垂下，不能修饰“挂面”，搭配不当，排除。\n第二空，横线处搭配“挂面的芬芳”和“黄土的清香”，体现出香气对人的作用，B项“神清气爽”形容人神志清爽，心情舒畅，符合文意，当选。C项“气定神宁”形容一种悠然自在镇定的心境与状态，不属于挂面香气能带给人的作用，不符合文意，排除；D项“沁人心脾”指芳香凉爽的空气、饮料或花香使人感到舒适，与横线前“让人”搭配，语义重复，排除。\n故正确答案为B。\n【文段出处】《‘实心心’事业》","no":23,"missingImage":false},{"type":"question","qid":"3523497","cat":"逻辑填空","stem":"随着微信用户群体不断扩大，微信在流量获取、社群运营、用户规模与黏性方面的优势越发明显，越来越多的教育产品开始        微信生态探索新的服务模式，吸引用户进行            分享，以降低获得新用户的成本，提升用户黏性。\n依次填入划横线部分最恰当的一项是：","options":{"A":"借用 全方位","B":"借助 持续性","C":"依托 聚变式","D":"凭借 立体化"},"answer":"B","explanation":"本题可从第二空入手，横线处搭配“用户”，根据文段“随着微信用户群体不断扩大，微信在······的优势越发明显，越来越多的······”可知，文段论述的是微信用户不断扩大的过程。B项“持续性”能够体现微信用户不断扩大的延续过程，保留。A项“全方位”指所有的方面，C项“聚变式”指轻原子核聚合为重原子核并放出巨大能量的过程，D项“立体化”指包括各方面的，均与文意不符，排除。\n第一空，代入验证，横线处搭配“微信生态”，B项“借助”搭配得当，当选。\n故正确答案为B。\n【文段出处】《朋友圈“打卡”扰民 应该如何规范？》","no":24,"missingImage":false},{"type":"question","qid":"3522850","cat":"逻辑填空","stem":"人脸识别系统深度学习的数据越多，人脸识别的效果就会越精确。只要给予足够多的人脸攻击大数据样本，机器就能够自主地学习到伪造图像或合成视频中的        ，最终就能得到对于这些攻击的分辨能力。并且，随着学习数据的不断增多，深度学习系统也会一天比一天强大，让各种各样的“换脸”            。\n依次填入划横线部分最恰当的一项是：","options":{"A":"弊端 无计可施","B":"瑕疵 无所遁形","C":"错误 插翅难逃","D":"缺陷 束手无策"},"answer":"B","explanation":"第一空，根据“人脸识别系统深度学习的数据越多，人脸识别的效果就会越精确”以及“只要给予足够多的人脸攻击大数据样本”可知，在数据足够多的前提下，人脸识别系统是非常精确的，所以即便“伪造图像”“合成视频”中存在特别小的问题，也能被发现，故横线所填词语应表达微小问题之意。B项“瑕疵”指微小的缺点，符合文意，保留。A项“弊端”指由于工作上有漏洞而发生的损害公益的事情，C项“错误”指不正确的事物、行为，D项“缺陷”指欠缺或不够完备的地方，均程度过重，排除。\n第二空，代入验证，B项“无所遁形”指没有地方可以隐藏形迹、身影，赤裸裸地展现在人们面前，可以体现随着深度学习系统的强大，“伪造图像”“合成视频”等“换脸”行为会被人脸识别系统识别，暴露在人们的面前，符合文意，当选。\n故正确答案为B。","no":25,"missingImage":false},{"type":"question","qid":"3522941","cat":"逻辑填空","stem":"实体书店不仅是一种商业业态，也是一个文化标志，更是一座城市的文化招牌。实体书店要想在图书市场上赢得竞争，关键要找准定位，        自己的比较优势和市场价值，在服务上做得更加周到精准，才能让读者            ，让逛书店成为文化时尚，让更多人浸润在浓郁书香中。\n依次填入划横线部分最恰当的一项是:","options":{"A":"明晰 络绎不绝","B":"确定 源源不断","C":"明确 纷至沓来","D":"确立 客似云来"},"answer":"C","explanation":"第一空，搭配“比较优势和市场价值”，且由“关键要找准定位”可知，所填词语应体现出准确之意，A项“明晰”指清楚；不模糊，B项“确定”指明确而肯定，C项“明确”指使清晰明白而确定不移，均能体现出准确之意，符合文意，保留。D项“确立”指稳固地建立或树立，置于此处搭配不当，排除。\n第二空，搭配“读者”，且由文段可知所填词语应体现出“实体书店能够吸引更多读者来”的意思，C项“纷至沓来”指连续不间断地到来，符合文意，当选。A项“络绎不绝”形容行人车马来来往往，接连不断，常用来形容街道、码头等人来人往十分热闹的场景，文段并非强调“实体书店”让“读者”来来往往，置于此处与文意不符，排除。B项“源源不断”形容连续而不间断，多用于形容事物，而少用于形容人，置于此处搭配不当，排除。\n故正确答案为C。\n【文段出处】《实体书店回暖 浸润浓郁书香》","no":26,"missingImage":false},{"type":"question","qid":"3522458","cat":"逻辑填空","stem":"南音是中国现存最古老的乐种之一，以其大量的曲目、古老的乐器和自成体系的记谱方法，        着汉唐以来中国音乐的血脉。南音被誉为“中国音乐历史的活化石”，在中国音乐史中具有            的特殊地位，极具历史、文化、学术研究价值。\n依次填入划横线部分最恰当的一项是：","options":{"A":"贯通 独一无二","B":"承载 举足轻重","C":"延续 不可替代","D":"沿袭 出类拔萃"},"answer":"C","explanation":"本题可以从第二空入手，横线处搭配“南音”，根据“南音被誉为‘中国音乐历史的活化石’”“极具历史、文化、学术研究价值”可知，意在强调南音在中国音乐史中的重要地位。B项“举足轻重”比喻所处地位重要，一举一动对全局有重大影响、C项“不可替代”指不能被替换掉，很重要，均能体现出南音在中国音乐史的重要地位，符合文意，保留；A项“独一无二”形容唯一的，没有与之相同的或可以与之相比的，常用于对比的语境中，文段并未将南音与其他乐种相比，与文意不符，排除；D项“出类拔萃”指超出同类，多指人的品德才能，与“南音”搭配不当，排除。\n第一空，横线处所填词语搭配“血脉”，且根据前文“南音是中国现存最古老的乐种之一”可知，横线处应表达南音一直体现着汉唐以来中国音乐的特点之意，C项“延续”指照着原来的样子继续下去，与“血脉”搭配恰当，符合文意，当选；B项“承载”指承受负载，不能表达出南音一直体现着汉唐以来中国音乐特点的这一含义，与文意不符，排除。\n故正确答案为C。\n【文段出处】人民网《从传承到发展 泉州南音走向世界》","no":27,"missingImage":false},{"type":"question","qid":"3522447","cat":"逻辑填空","stem":"当前，构建中国特色文艺理论体系已渐成学界共识，但在推进建设的道路上，            易，具体而微难；空喊口号易，付诸实践难。中国特色文艺理论体系建设，除了宏观维度的考量，更需要大功细作，从概念、范畴、术语及具体议题设置等微观层面入手，            ，聚沙成塔，一砖一瓦搭建大厦。\n依次填入划横线部分最恰当的一项是：","options":{"A":"大而化之    条分缕析","B":"坐而论道    步步为营","C":"小题大做    集腋成裘","D":"通观大局    精雕细琢"},"answer":"A","explanation":"第一空，由分号后的句子“空喊口号易，付诸实践难”可知，横线处所填词语应与“具体而微”构成反义并列，表达不具体、不细致的含义。A项“大而化之”形容做事情不小心谨慎，粗枝大叶，符合文意，保留；B项“坐而论道”指坐着空谈大道理，强调口头说说，不见行动，与文段想要表达的是否具体细致无关，排除；C项“小题大做”指拿小题目作大文章，比喻不恰当地把小事当作大事来处理，有故意夸张的意思，也与文意想表达的不具体不细致无关，排除；D项“通观大局”指通盘筹划，综合看待问题，侧重的是看待事情全面，有统筹协调的意识，文意想表达的是不够具体不够细致，与文意不符，排除。\n第二空，代入验证，前文论述中国特色文艺理论体系建设需要大功细作，需要从微观层面入手，强调从细处入手，A项“条分缕析”指有条有理地细细分析，置于此处表达我们做事情需要有条有理地仔细地去分析梳理，符合文意，当选。\n故正确答案为A。\n【文段出处】《更好用中国文艺理论解读文艺实践》","no":28,"missingImage":false},{"type":"question","qid":"3523016","cat":"逻辑填空","stem":"国产电影之所以能够在票房上与席卷全球的好莱坞电影            ，很大程度上是因为国产电影这种互联网气质带来的亲切感、平民化，这是好莱坞电影难以比拟的        优势。\n依次填入划横线部分最恰当的一项是：","options":{"A":"平分秋色  突出","B":"分庭抗礼  本土","C":"不相上下  草根","D":"和衷共济  特别"},"answer":"B","explanation":"第一空，根据横线后文可知，国产电影有好莱坞电影所比不了的优势，因此横线处所填词语应表达国产电影与好莱坞电影在票房上可以抗衡之意，B项“分庭抗礼”指双方平起平坐，实力相当，可以抗衡，C项“不相上下”形容数量、程度差不多，均符合文意，保留。A项“平分秋色”比喻双方各得一半，而文段并未体现出二者各占一半之意，故与文意不符，排除；D项“和衷共济”比喻同心协力，克服困难，与文意无关，排除。\n第二空，根据横线前“亲切感”“平民化”可知，横线处所填词语应表达国产电影相较于好莱坞电影有优势，B项“本土”符合文意，当选。C项“草根”可以引申为平民百姓，普通群众，在此处与“优势”搭配不当，排除。\n故正确答案为B。\n【文段出处】《“互联网\u003cimg data-k=\"94275b9f0d54\">”背景下的文艺生态》","no":29,"missingImage":false},{"type":"question","qid":"3522879","cat":"逻辑填空","stem":"除了用于作战外，现代头盔经过改良已被广泛应用于民用领域。自行车场地比赛很早就有佩戴头盔的规定，一方面是因为比赛时            ，碰撞事故频发；另一方面是二十世纪八九十年代侧重空气动力学的场地赛车研发，将选手身体纳入到设计因素中，头盔也成为        阻力的重要配件之一。\n依次填入划横线部分最恰当的一项是：","options":{"A":"你追我赶 降低","B":"短兵相接 提高","C":"夹枪带棒 降低","D":"针锋相对 提高"},"answer":"A","explanation":"第一空，根据后文“碰撞事故频发”可知，横线处应体现自行车比赛十分激烈的含义。A项“你追我赶”形容竞赛激烈，大家都不甘落后，B项“短兵相接”比喻面对面的进行激烈斗争，均能体现出自行车比赛的激烈，符合文意，保留。C项“夹枪带棒”指言语中暗藏讽刺，D项“针锋相对”比喻双方在策略、论点方面尖锐对立，均体现不出自行车比赛激烈的特点，不符合文意，排除。\n第二空，由“侧重空气动力学的场地赛车研发”可知，“阻力”在自行车比赛中起到消极的作用，应尽量减小自行车比赛中的阻力。A项“降低”符合文意，当选。B项“提高”与文意相悖，排除。\n故正确答案为A。\n【文段出处】《头盔：古老护具的前世今生》","no":30,"missingImage":false},{"type":"question","qid":"3522459","cat":"逻辑填空","stem":"成年人总是认为孩子思维幼稚、理解力有限，这其实是一种        。得益于蓬勃发展的信息技术和日益便利的交通出行，如今的孩子比以往掌握更多知识，也更加渴望了解世界。阅读可以打开一扇扇门，让他们看见广阔的世界，了解活着的意义，也要面对死亡和失去。而友谊和爱，这些宝贵的品质犹如黑夜中的明灯，终将        他们面向世界，走向未来。\n依次填入划横线部分最恰当的一项是：","options":{"A":"成见 推动","B":"偏见 引领","C":"误读 促进","D":"误解 带动"},"answer":"B","explanation":"本题可从第二空入手，横线处所填词语搭配“黑夜中的明灯”和“他们”，且对应前文“宝贵的品质犹如黑夜中的明灯”，故横线处所填词语要体现品质如明灯一般，带领指引着孩子走向未来，B项“引领”指引导带领，且与“他们”搭配得当，保留；A项“推动”指使事物启动或前进，使工作展开，常搭配社会、经济等，如推动社会进步、推动经济发展等，一般不与人搭配，排除；C项“促进”指促使进步并推动发展，常见的搭配有促进生产等，且品质如明灯是没办法促进孩子面向世界的，排除；D项“带动”指引导着前进，常见的搭配有沿海带动内地、先进带动后进等，而品质如明灯是不能带头运动的，排除。\n验证第一空，根据指代词“这”对应前文成年人的观点，且根据后文“如今的孩子比以往掌握更多知识，也更加渴望了解世界”可知，成年人对孩子的认识是错误的、片面的。B项“偏见”指片面的见解、成见，符合文意，当选。\n故正确答案为B。\n【文段出处】《儿童文学创作的重要主题》","no":31,"missingImage":false},{"type":"question","qid":"3524806","cat":"逻辑填空","stem":"2021年是中国共产党建党100周年，地方各级党组织通过加强理论学习、组织专题宣讲、开展实践活动、召开专题组织生活会等方式，组织党员        党的光辉历程，缅怀党的            ，        党的红色印记，更加坚定初心、砥砺奋进。\n依次填入划横线部分最恰当的一项是：","options":{"A":"重温  丰功伟绩  感受","B":"回顾  历史功绩  重温","C":"回溯  惊天伟业  铭记","D":"瞻仰  宏图大业  体悟"},"answer":"A","explanation":"第一空，横线处搭配“历程”，且与后文“缅怀”构成并列关系，应体现出“遥念、追思”的含义，A项“重温”意为回想，B项“回顾”意为回想、回忆，C项“回溯”意为回顾、回忆，均有“遥念、追思”的含义，且均可搭配“历程”，符合文意，保留。D项“瞻仰”意为怀着崇高的敬意、严肃而恭敬地看着某人或某物，无法体现“遥念、追思”之意，且与“历程”搭配不当，排除。\n第二空，横线处搭配“缅怀”，且与前文“光辉历程”构成并列关系，体现出积极的感情色彩，A项“丰功伟绩”比喻伟大的功绩，C项“惊天伟业”指声势浩大的、卓著的功绩，均可与“缅怀”搭配，且能体现出积极的感情色彩，符合文意，保留。B项“历史功绩”指历史中所取得的功劳与业绩，而功劳与业绩有大有小，与“光辉历程”相比，程度太轻，排除。\n第三空，横线处搭配“红色印记”，且与“缅怀”构成并列关系，应体现出怀念之感，A项“感受”意为体会、感想，填入文段可以体现出对于红色印记的一种内在的情感，符合文意，当选。C项“铭记”意为牢牢地记住，侧重记住，文段并非强调记住红色印记，与文意不符，且与“红色印记”搭配不当，排除。\n故正确答案为A。\n【文段出处】《建党100周年发扬红色精神心得五篇——第五篇》","no":32,"missingImage":false},{"type":"question","qid":"3522429","cat":"逻辑填空","stem":"实际上普通话和方言不是同一层次上的交际工具，普通话是全民共同语，是官方语言，而方言是区域性的，是民间语言。通过明确        ，普通话和方言可以做到并行不悖，甚至            ，相得益彰。\n依次填入划横线部分最恰当的一项是：","options":{"A":"规定  齐头并进","B":"划分  互为表里","C":"区分  珠联璧合","D":"界定  相辅相成"},"answer":"D","explanation":"第一空，根据文意可知，普通话和方言通过明确划定各自的使用范围可以同时使用，并不冲突。A项“规定”意为对事物的数量、质量或方式、方法等做出具有约束力的决定，D项“界定”意为划定界限，确定所属范围，置于此处均符合文意，保留；B项“划分”指把整体分成若干部分，文段未体现普通话和方言存在整体和部分的关系，排除；C项“区分”指辨别，分辨，文段并非强调普通话和方言相似，不好分辨，与文意不符，排除。\n第二空，根据“甚至”可知，表达递进关系，横线处所填词语应比“并行不悖”程度更重。D项“相辅相成”意为两件事物相互补充，互相配合，缺一不可，可与“并行不悖”构成递进关系，符合文意，当选；A项“齐头并进”意为不分先后地一齐前进或同时进行，程度与“并行不悖”一致，无法构成递进关系，排除。\n故正确答案为D。\n【文段出处】《普通话与方言如何相得益彰》","no":33,"missingImage":false},{"type":"question","qid":"3522957","cat":"逻辑填空","stem":"解释国家兴衰是许多学科            的学术好奇心所在，经济学家更是            地发展出各种理论框架，期冀破解经济增长之谜。激励学者们把中国这个经历了由盛至衰的历史作为主要研究对象的，是以著名的中国科技史学家李约瑟命名的所谓“李约瑟之谜”。这个谜题尝试回答为什么在前现代社会，中国科技            于其他文明，而近现代中国不再具有这样的领先地位。\n依次填入划横线部分最恰当的一项是：","options":{"A":"绵延不绝 孜孜矻矻 迥然不同","B":"旷日持久 孜孜不倦 遥遥领先","C":"亘古不变 皓首穷经 名列前茅","D":"持之以恒 殚精竭虑 一枝独秀"},"answer":"B","explanation":"第一空，搭配“学术好奇心”，B项“旷日持久”指耗费时日，在文中可指学科的学术好奇心长时间存在，搭配恰当，符合文意，保留；D项“持之以恒”指长久地坚持下去，搭配恰当，保留。A项“绵延不绝”形容相同的自然景观一个接一个不间断地出现，与“学术好奇心”搭配不当，排除；C项“亘古不变”指从古到今没有变化，表达过于绝对，排除。\n第二空，根据“把中国这个经历了由盛至衰的历史作为主要研究对象”可知，文段意在表达经济学家进行了长时间研究。B项“孜孜不倦”指工作或学习勤奋不知疲倦，D项“殚精竭虑”形容用尽心思，均符合文意，保留。\n第三空，根据“而近现代中国不再具有这样的领先地位”可知，文段意在说明前现代社会中国科技领先于其他文明。B项“遥遥领先”指远远地走在最前面，可准确对应“领先”，符合文意，当选。D项“一枝独秀”形容在同类事物中最为突出，最为优秀，不如B项对应“领先地位”准确，且一般不与“于”搭配使用，排除。\n故正确答案为B。\n【文段出处】《改革开放是中国经济由衰至盛的转折点》","no":34,"missingImage":false},{"type":"question","qid":"3522972","cat":"逻辑填空","stem":"在高山相夹的谷底，有时能直观地看到地形对云的        ：气流翻山越岭被抬升形成波动气流，在气流的波峰与波谷之前，云也随之上下扭曲。在一些情况下，大气温度和高度成反比，处于波谷处的温度更高，达不到云        的温度，而波峰处的温度可以形成云，这样就形成了有云和无云条带反复交错的波状云天空。\n依次填入划横线部分最恰当的一项是：","options":{"A":"塑造 凝结","B":"制造 凝集","C":"打造 凝聚","D":"创造 凝固"},"answer":"A","explanation":"第一空，横线后出现冒号提示解释说明，根据“气流翻山越岭被抬升形成波动气流，在气流的波峰与波谷之前，云也随之上下扭曲”可知，文段意在说明地形对云的形状产生影响。A项“塑造”指通过培养、改造使人或事物达到某种预定的目标，可体现“影响”之意，保留。B项“制造”、C项“打造”、D项“创造”均强调从无到有的过程，而文段中云已然存在，强调的是地形对云的形状产生影响，与文意不符，排除。\n第二空，代入验证，A项“凝结”能体现水蒸气变成云的过程，搭配恰当，符合文意，当选。\n故正确答案为A。","no":35,"missingImage":false},{"type":"question","qid":"3524695","cat":"逻辑填空","stem":"万物并育而不相害，道并行而不相悖。随着世界          、经济          、社会          、文化          快速发展，世界不确定不稳定因素增加，和平赤字、发展赤字、信任赤字越来越大，世界正经历百年未有之大变局，面对发展困境、治理难题，全球迫切需要构建人类命运共同体，以便更好地认识世界、发展世界。\n依次填入划横线部分最恰当的一项是：","options":{"A":"多极化 全球化 信息化 多样化","B":"多样化 多样化 信息化 全球化","C":"全球化 多样化 信息化 多样化","D":"全球化 信息化 多样化 多样化"},"answer":"A","explanation":"第一空，根据前文“万物并育而不相害，道并行而不相悖”可知，横线处表意为世间万物万事皆可共存，所填词语需体现“多种多样”之意，A项“多极化”、B项“多样化”均可体现“多”，保留；C、D两项“全球化”侧重强调全球联系不断增强，而非“多种多样”，且横线处搭配“世界”，世界一般指的便是人类赖以生存的地球，直接搭配“全球化”会出现语义重复，常见搭配为“世界贸易全球化”“世界经济全球化”，排除。\n第二空，搭配“经济”，A项“全球化”、B项“多样化”均可，保留；\n第三空，选项均为“信息化”，无法排除，保留；\n第四空，搭配“文化”，A项“多样化”、B项“全球化”亦不好判别，暂且保留。\n对比A、B两项，发现选项的主要差异在于第二空与第四空，即判别“经济”“文化”与“全球化”“多样化”的最优搭配。“经济全球化”“文化多样化”为常见热词搭配，锁定A项。\n故正确答案为A。\n【文段出处】《在百年变局中推动世界和平发展》","no":36,"missingImage":false},{"type":"question","qid":"3522401","cat":"逻辑填空","stem":"个人信息保护立法的优劣，最重要的评价标准就是科学而且精准地        两大法律价值，一方面是保障个人信息权益，同时又不能过度影响个人信息的合理利用。相信随着各方积极参与讨论，            ，最终一定会制定出一部良善的个人信息保护法，实现二者的        。\n依次填入划横线部分最恰当的一项是：","options":{"A":"平衡 集思广益 兼顾","B":"权衡 齐心协力 融合","C":"衡量 博采众长 统一","D":"均衡 广开言路 两全"},"answer":"A","explanation":"本题从第三空入手，由文段可知，横线处所填词语应体现出“个人信息权益的保障”和“个人信息的合理利用”两者都应当照顾得到，不能偏废的意思，A项“兼顾”指同时照顾几个方面，符合文意，保留。B项“融合”指几种不同的事物合成一体，C项“统一”指使成一体，文段并未体现使两者融为一体的意思，均排除；D项“两全”指顾全两个方面，与前文“二者”语义重复，排除。\n第一空，代入验证。A项“平衡”指使平衡的意思，置于此处搭配恰当，且对应后文“一方面是保障个人信息权益，同时又不能过度影响个人信息的合理利用”，符合文意，保留。\n第二空，代入验证。A项“集思广益”指集中众人的智慧，广泛吸取有益的意见，能够体现出“各方积极参与讨论”的意思，符合文意，当选。\n故正确答案为A。\n【文段出处】《一部建构个人信息保护制度体系的专门立法》","no":37,"missingImage":false},{"type":"question","qid":"3522989","cat":"逻辑填空","stem":"机器智能，是指机器所具有的一种能力，它使机器能够        通常需要人类智能才能完成的任务。在过去的几年里，机器智能取得了极为快速的发展和举世瞩目的成绩，从“阿尔法狗”打败围棋世界冠军，到全自动无人驾驶汽车首次在公共道路上行驶，这一系列革命性的        让公众对机器智能的能力刮目相看。如今，机器智能系统已经        应用到商业、政府和个人生活的各方面，对原来的机器人产业进行了升级。\n依次填入划横线部分最恰当的一项是：","options":{"A":"完成 创造 普遍","B":"执行 创新 广泛","C":"承担 改革 普及","D":"贯彻 革新 宽泛"},"answer":"B","explanation":"第一空，横线处搭配“任务”，A项“完成”、B项“执行”、C项“承担”和“任务”均搭配恰当，保留；D项“贯彻”指彻底实现或体现，一般和政策、方针、精神等搭配，和“任务”搭配不当，排除。\n第二空，横线处由“一系列革命性的”来进行修饰，C项“改革”与“革命性的”语义重复，排除；A项“创造”、B项“创新”均可用“革命性的”进行形容，符合语境，保留。\n第三空，A项“普遍”、B项“广泛”和“应用”均搭配恰当，能体现应用范围较广之意，保留。可将第一空A、B两项进行对比。\n文段讨论的主题词为“机器智能”，机器更加侧重于执行某项指令，服从某项命令，一般不会主动去完成，且A项“完成”与后文“人类智能才能完成”用词重复，在考试中，一般较少考查文段中已有的词语，故对比择优，B项更合适，当选。\n故正确答案为B。\n【文段出处】《智能机器人离人还有多远》","no":38,"missingImage":false},{"type":"question","qid":"3522431","cat":"逻辑填空","stem":"野草属于乡间大地。在城市里被水泥丛林挤得难有            的野草，即便得到了点滴瘠薄的土地，也生长得            ，茎叶上积满了灰尘，一副失魂落魄的样子。那些生长在乡间大地上的野草，则        地在风中低语，在雨中吟唱。\n依次填入划横线部分最恰当的一项是：","options":{"A":"一席之地  没精打采  肆意","B":"弹丸之地  垂头丧气  适意","C":"一隅之地  奄奄一息  恣意","D":"栖身之地  萎靡不振  惬意"},"answer":"D","explanation":"本题可从第三空入手，由“野草属于乡间大地”“在城市里······那些生长在乡间大地上的野草”可知，“则”在此处表达转折关系，第三空所填词语应与前文的“失魂落魄”语义相反，体现出野草在乡间大地生长得比较舒适自在的含义。B项“适意”指自在合意，D项“惬意”形容心情感到愉快畅快，愉悦、舒畅或者是满意，均符合文意，保留；A项“肆意”指不顾一切由着自己的性子，C项“恣意”指放纵，不加限制，任意，均与后文的“低语”“吟唱”无法对应，程度过重，排除。\n第二空，搭配“生长”，且由“一副失魂落魄的样子”可知，野草在城市中生长得并不好，D项“萎靡不振”形容精神不振，意志消沉，符合文意，保留；B项“垂头丧气”形容因失败或不顺利而情绪低落的样子，多与情绪搭配，置于此处与“生长”搭配不当，排除。\n第一空，代入验证，根据“被水泥丛林挤得”可知，野草在城市中很难有生存之地，D项“栖身之地”指暂时居住的地方，符合文意，当选。\n故正确答案为D。\n【文段出处】《乡间野草》","no":39,"missingImage":false},{"type":"question","qid":"3522898","cat":"逻辑填空","stem":"大自然的            让囊谦县成为了神圣的万山之宗、圣洁的江河之源，扎曲、孜曲、巴曲、热曲、吉曲五条大河由西北平行向东南贯穿全境。有人戏说，在囊谦旅行，不需要准备矿泉水，随处可见清澈纯净的溪流，掬        清泉入口，甘甜爽口，            。\n依次填入划横线部分最恰当的一项是：","options":{"A":"鬼斧神工 一捧 沁人心脾","B":"天造地设 一把 心旷神怡","C":"巧夺天工 一掌 美轮美奂","D":"神来之笔 一洌 乐以忘忧"},"answer":"A","explanation":"第一空，横线处搭配“大自然”，A项“鬼斧神工”形容艺术技巧高超，不像是人力所能达到的，与大自然为固定搭配，符合文意，保留。B项“天造地设”指事物自然形成，合乎理想，不必再加工，虽可搭配大自然，但用法不当，应为“天造地设的囊谦县”，排除；C项“巧夺天工”形容技艺极其精巧，与大自然搭配不当，排除；D项“神来之笔”形容作品文句精彩、笔墨传神，与囊谦县搭配不当，排除。\n第二空，代入验证，掬“一捧”清泉入口搭配恰当，A项保留。\n第三空，代入验证，A项“沁人心脾”指芳香凉爽的空气、饮料或花香使人感到舒适，与“甘甜爽口”构成并列，符合文意，当选。\n故正确答案为A。","no":40,"missingImage":false},{"type":"question","qid":"3522900","cat":"片段阅读","stem":"传统的西方法律思想史研究存在“吃偏食”的现象，即研究的范围、题材的主次、对象的脉络等受制于英语学术谱系，这种单一的考察重心限制了研究者的视角。而实际上，在非英语学术谱系中存在大量有价值的材料。这要求研究者把目光投向先前不够重视的领域，比如“一带一路”建设参与国众多，对它们的法律思想史进行研究，可以发现新的史料，找到新的研究关注点。这就要求业内学者努力译介并尽快研究英语学术谱系外的相关权威学术资料，包括专题资料和通史资料，扩展我们对世界法治现代化进程的理解。\n这段文字旨在强调：","options":{"A":"法律思想史研究受制于英语学术谱系","B":"法律思想史研究须重视非英语学术谱系","C":"西方法律思想史研究存在“吃偏食”现象","D":"非英语学术谱系中存在大量有价值的材料"},"answer":"B","explanation":"文段开篇指出传统的西方法律思想史研究存在“吃偏食”的问题，接着通过转折词“实际上”指出非英语学术谱系中存在大量有价值的材料，后文通过“要求”提出对策，并通过“比如”进行举例论证，尾句通过指代词“这”总结前文，并通过“要求”提出对策，故文段为提出问题-解决问题的结构，重点为对策，即业内学者应该研究英语学术谱系外的内容，对应B项。\nA项“受制于”为问题表述，且为文段话题引入部分内容，非重点，排除；\nC项“西方法律思想史研究存在‘吃偏食’的现象”为文段话题引入部分内容，非重点，排除；\nD项，“非英语学术谱系中存在大量有价值的材料”为对策之前的表述，非重点，排除。\n故正确答案为B。\n【文段出处】人民网：《拓展西方法律思想史的研究视野》","no":41,"missingImage":false},{"type":"question","qid":"3522549","cat":"片段阅读","stem":"为了进一步探索乌龙茶香气的酶促形成，团队成员系统研究了乌龙茶香气的酶促形成与胁迫的关联性。通过筛选各类胁迫因子，发现在乌龙茶加工过程中，损伤和低温胁迫是诱导茶叶香气酶促形成的关键胁迫因子。乌龙茶加工过程中做青阶段的连续损伤可诱导来自不同生物合成路径的香气物质合成关键基因的表达水平升高，进而促使这些香气物质的蓄积。此外，低温和损伤双胁迫对这些香气物质的合成具有显著协同效应。\n这段文字意在说明：","options":{"A":"乌龙茶香气的酶促形成主要与胁迫相关","B":"做青阶段连续损伤可诱导香气物质的蓄积","C":"胁迫使香气物质合成关键基因表达水平升高","D":"损伤和低温是香气酶促形成的关键胁迫因子"},"answer":"A","explanation":"文段开头指出团队成员系统研究了乌龙茶香气的酶促形成与胁迫的关联性以探索乌龙茶香气的酶促形成，接着介绍了研究发现的内容，指出在“损伤和低温胁迫是诱导茶叶香气酶促形成的关键胁迫因子”，然后指出“连续损伤可促使香气物质的蓄积”以及“低温和损伤双胁迫对这些香气物质的合成具有显著协同效应”，都在说明胁迫因子中的“损伤和低温威胁”对乌龙茶的香气物质形成有一定的作用，故文段是通过后文的研究来说明乌龙茶香气的酶促形成与胁迫有关，对应A项。\nB、C、D三项均为后文解释部分的内容，未包含文段主题词“乌龙茶”，排除。\n故正确答案为A。\n【文段出处】《研究发现中国乌龙茶香气酶促形成机制》","no":42,"missingImage":false},{"type":"question","qid":"3522420","cat":"片段阅读","stem":"捆扎蔬菜的胶带实际上是涂过粘合剂的塑料膜。虽然胶带不是食品，但由于会和食品接触，也要遵守食品安全标准。不过，在塑料膜和粘合剂的生产过程中，由于聚合不完全或溶剂挥发不完全，确实可能有少量甲醛等小分子残留。但捆扎蔬菜用的胶带在自然放置状态下很稳定，降解释放大量甲醛的可能性极小。同时，市面上用来捆绑蔬菜的不只是普通胶带，有的是由动物胶和植物胶制成的胶带，自然也不会对人体造成危害。另外，体重为60公斤的成年人，只要他每日甲醛摄入量不超过12毫克，就不会对健康产生影响。\n根据这段文字，以下说法正确的是：","options":{"A":"食用了胶带捆扎的蔬菜影响健康的概率小","B":"捆扎蔬菜的胶带自然放置时并不产生甲醛","C":"植物胶制成的胶带才不会对人体造成危害","D":"60公斤成年人每天只应摄入12毫克甲醛"},"answer":"A","explanation":"根据提问方式可知，本题为细节判断题。\nA项，文段从自然放置状态下稳定、制作原料和摄入量三个角度论述了捆扎蔬菜的胶带的健康安全问题，即一般对人体健康不会产生影响，表述正确，当选；\nB项，根据“捆扎蔬菜用的胶带在自然放置状态下很稳定，降解释放大量甲醛的可能性极小”可知，在自然状态下胶带释放甲醛的可能性极小，但并非不产生，绝对表述，排除；\nC项，根据“有的是由动物胶和植物胶制成的胶带，自然也不会对人体造成危害”可知，由动物胶、植物胶制成的胶带都不会对人体造成危害，但该项表述为“只有植物胶制成的胶带才是安全的”，与原文不符，排除；\nD项，根据“另外，体重为60公斤的成年人，只要他每日甲醛摄入量不超过12毫克，就不会对健康产生影响”可知，不超过12毫克是每日甲醛摄入量的安全阈值，而非每日推荐摄入量，表述错误，排除。\n故正确答案为A。\n【文段出处】《长期食用胶带捆扎的蔬菜可能致癌？这个真没有》","no":43,"missingImage":false},{"type":"question","qid":"3522550","cat":"片段阅读","stem":"每一个民族的文化复兴，都是从总结自己的遗产开始的。在几千年历史长河中，我国各族人民创造了丰富的历史文化财富，留下了大量文物遗存。历史文物是传统文化的重要物质载体，记录着我们历史的光辉过去，延续着我们国家和民族的精神血脉，承载着我们民族的认同感和自豪感。保护历史文物和文化遗产，是传承中华优秀传统文化、坚定文化自信的必然要求。不断加大文物保护力度，让我们的城市建筑更好地体现地域特征、民族特色和时代风貌，有助于我们传承优秀传统文化，凝聚伟大民族精神，为实现民族复兴提供正确的精神指引和强大的精神动力。\n这段文字意在强调：","options":{"A":"民族文化复兴的途径","B":"传统文化的物质载体","C":"城市规划要富有特色","D":"文物保护的深远意义"},"answer":"D","explanation":"文段先介绍了民族复兴是从总结遗产开始，接着论述我国有大量的文物遗存，并强调“历史文物”对我国和民族的重要性。接着引出“保护文物”的话题，并通过“必然要求”强调保护文物和文化遗产的重要性。尾句进一步论证，论述了“加大文物保护力度”的好处，对应D项。\nA项，“民族文化复兴的途径”，对应文段首句，起到引出话题的作用，非重点，且缺少文段主题词“文物保护”，排除；\nB项，“传统文化的物质载体”对应文段中“历史文物是传统文化的重要物质载体”，非文段重点，且缺少文段主题词“文物保护”，排除；\nC项，“城市规划”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】人民网评：《&lt;《福州古厝》序&gt;回答了怎样的时代命题》","no":44,"missingImage":false},{"type":"question","qid":"3523500","cat":"片段阅读","stem":"西方经典说，文学是一朵金蔷薇，由无数的金子碎屑合成。《红楼梦》无疑是中国文学的“金蔷薇”，而细节正是形成金蔷薇的那些碎金屑。它庞大丰富的内容，都是通过细节来表达的。当一个人要告诉另一个人：《红楼梦》这书好在哪里，为什么会百读不厌，书里的人物如何使人感动，作者的意图怎样含蓄、巧妙地传达······就要带着那另一个人去领略细节，回味对话，感受心灵的悸动。就像一座大观园，须要开门后一处处走来，一亭一院进去，一草一木赏过，才能知道这园子如何精美，如何曲径通幽。\n最适合做这段文字标题的是：","options":{"A":"细节的芳香","B":"心灵的悸动","C":"金蔷薇的魅力","D":"品味《红楼梦》"},"answer":"A","explanation":"本题为标题填入题。文段开篇引出话题，以“金蔷薇”比喻红楼梦，以“碎金屑”比喻细节，强调红楼梦的成功之处在于其优质的细节。后文通过详细的论述进一步对红楼梦细节的优质进行解释说明。故文段重点强调细节是一部好作品的关键，主题词为“细节”。A项契合文段主题，当选。\nB、C、D三项均未涉及文段主题词“细节”，排除。\n故正确答案为A。\n【文段出处】《细节的芳香——品味&lt;红楼梦&gt;》","no":45,"missingImage":false},{"type":"question","qid":"3522424","cat":"片段阅读","stem":"公共健身器材主要由政府采购、体育部门赠予、开发商自行购置后投放。按规定，受赠单位负责管理和日常维护并承担经费；各单位自行购置的则由各单位负责管理、维修和承担费用。规定很明确，但执行中常常出现各种盲区。首先，受赠方往往无配套资金，需要维修时也一问三不知；其次，日常使用和维护往往需要出厂厂家，然而对厂家缺少专门监管，厂家常常敷衍售后服务；最后，公共健身器材超出使用期，未明确拆除更换的责任方。公共健身器材的设置本是便民利民的好事，但好的出发点也要有完善的配套制度。健身器材建设好了，服务和管理工作也应跟上。\n这段文字意在强调：","options":{"A":"受赠单位疏于管理公共健身器材","B":"公共健身器材不能“重建轻管”","C":"维护管理公共健身器材存在盲区","D":"公共健身器材能让百姓切实受益"},"answer":"B","explanation":"文段开篇引出公共健身器材这一话题，接着具体介绍不同情况下负责管理维护公共健身器材的责任主体。随后通过转折标志词“但”指出问题，即执行中出现盲区，并通过“首先”“其次”“最后”多角度分析问题。接着通过转折标志词“但”说明公共健身器材的设置缺少完善的配套制度。尾句则通过“应”提出对策，即要做好服务和管理工作，故文段意在强调对于公共健身器材要做好服务和管理工作，对应B项。\nA项，“受赠单位”对应文段“首先”之后的内容，为解释说明的部分，且“疏于管理”为问题表述，非重点，排除；\nC项，“存在盲区”为问题表述，非重点，排除；\nD项，“让百姓切实受益”对应文段“便民利民”，为转折前内容，非重点，排除。\n故正确答案为B。\n【文段出处】《公共健身器材不能重建轻管》","no":46,"missingImage":false},{"type":"question","qid":"3522403","cat":"片段阅读","stem":"高校设立家政本科专业受到舆论的质疑，因为在传统观念中，大学生是“天之骄子”，保姆似乎“低人一等”，二者难以画上等号。正是这样的错误观念，导致家政行业从业人员良莠不齐，整体素质不高。其实，家政行业是考验从业者综合素质的行业，高校设立家政专业，符合市场需求。当然，目前来看，家政专业培养出来的学生很少从事家政实务，不少都是从事家政企业管理和家政教育。要想真正吸引更多优秀人才进入家政行业，就要破除职业偏见，让家政服务从业人员能够获得应有的尊严，让他们的工作能够体现应有的劳动价值，让他们有良好的发展前景。\n从这段文字可以看出，作者认为家政行业吸引优秀人才的关键在于：","options":{"A":"增强家政专业“含金量”","B":"提高从业者的综合素质","C":"尊重从业人员劳动价值","D":"破除家政专业职业偏见"},"answer":"D","explanation":"文段开篇指出高校设立家政本科专业受到舆论的质疑，分析了其背后的错误观念，并指出家政行业从业人员整体素质不高这一问题，随后通过转折标志词“其实”说明高校设立家政专业，是符合市场需求的。接着再次说明目前家政实务方面缺少人才这一问题。文段结尾则通过对策标志词“要”提出对策，强调吸引优秀人才进入家政行业要破除职业偏见，并说明了对策带来的多重意义，故文段重在强调对策，即要破除家政专业职业偏见，对应D项。\nA项，增强“含金量”即指提升家政专业的价值，文段并未提及，无中生有，排除；\nB项，“从业者的综合素质”对应文段对策之前，为分析问题的部分，非重点，排除；\nC项，“尊重从业人员劳动价值”对应文段对策带来的意义部分，非重点，排除。\n故正确答案为D。\n【文段出处】《“大学设家政专业”需破除职业偏见》","no":47,"missingImage":false},{"type":"question","qid":"3522419","cat":"片段阅读","stem":"孔子以“有教无类”“因材施教”“教学相长”为方针，以培养“博学通才之士”为目标，对学生进行礼、乐、御、射、书、数“六艺”教育，其中，数即数学，乐和声学有关，御和力学有关，射和机械有关。《中庸》上说，“博学之，审问之，慎思之，明辨之，笃行之”，学、问、思、辨、行，完全符合认识过程和研究科学的方法，即获取信息、提出问题、思维推理、检验结果、躬身实践。在儒家崇尚务实和“经世致用”思想影响下，中国古代科技具有强烈的实用性，形成了以农、医、天、算四大学科和以“四大发明”为代表的技术发明创造。\n这段文字意在说明：","options":{"A":"中华古代文明具有文理交融的包容性","B":"古代科技是传统儒家思想的实现途径","C":"传统文化和古代科技存在必然的联系","D":"传统文化对古代科技发展有积极影响"},"answer":"D","explanation":"文段开篇指出孔子的教学方针和目标都具有一定的实用性，接着描述《中庸》中的思想也与实际实践中的认识过程和研究科学息息相关，最后“在······思想影响下”指代前文提到的思想，且引出结论，强调在传统文化的影响下中国古代科技形成“四大学科”和“四大发明”等技术的发明创造，故文段重点在尾句结论，强调传统文化对古代科技发展产生的积极影响，对应D项。\nA项，文段并未提及“文理交融”，属无中生有，排除；\nB项，文段强调的是在儒家思想影响下形成古代科技，而非儒家思想得以实现，排除；\nC项，“必然的联系”表述不明确，文段强调产生了积极影响，排除。\n故正确答案为D。\n【文段出处】《国学与科学》","no":48,"missingImage":false},{"type":"question","qid":"3522413","cat":"片段阅读","stem":"机器学习的主旨是让计算机去模拟或实现人类的学习行为，是人工智能的核心。机器学习虽然可以在大数据训练中学到正确的工作方法，但它也很容易受到恶意干扰。通常攻击者是通过输入恶意数据来“欺骗”机器学习模型，导致其出现严重故障。近日，“Data61”机器学习小组研发出了一种机器学习的新算法。这种新算法通过类似疫苗接种的思路，帮助机器学习“修炼”出抗干扰能力。这是针对机器学习模型打造的防干扰训练，譬如，在图片识别领域，该算法能够对图片集合进行微小的修改或使其失真，激发出机器学习模型的抗干扰能力，并形成相关的自我抗干扰训练模型。\n这段文字意在说明：","options":{"A":"干扰机器识别图像的新方法","B":"新算法助机器学习抵抗干扰","C":"机器学习是人工智能的核心","D":"机器学习大数据训练的方法"},"answer":"B","explanation":"文段开篇引出“机器学习”的话题，接着通过转折词“但”指出机器学习存在容易受到干扰的问题，随后通过学习小组的研究给出了对策，即“一种机器学习的新算法”，并对对策本身进行具体解释说明。故文段为提出问题\u003cimg data-k=\"3d6d1f96db11\">解决问题\u003cimg data-k=\"3d6d1f96db11\">解释说明的分总分文段，重点在于对策，即强调针对机器学习防干扰的新算法，对应B项。\nA项，文段的重点在于“防干扰”的做法，不是“干扰”的方法，排除；\nC项，“机器学习是人工智能的核心”对应文段开篇引出话题的部分，非重点，排除；\nD项，“大数据训练”对应转折之前的内容，非重点，排除。\n故正确答案为B。\n【文段出处】《全新算法助机器学习抵抗干扰》","no":49,"missingImage":false},{"type":"question","qid":"3522994","cat":"片段阅读","stem":"考古学家在阿拉伯半岛的阿尔马塔夫遗址中已清理出9000多件遗物，其中\u003cimg data-k=\"98d1a3adb731\">以上为当地的朱尔法陶，包括一件完整的朱尔法夹砂红陶罐；西亚釉陶仍为孔雀绿釉陶和熔块胎陶；中国产的瓷器有龙泉窑青瓷，景德镇窑青花瓷、白瓷、青白瓷及广东地区产酱釉粗瓷等；另有泰国产青瓷。中国产的瓷器年代以明中晚期至清代为主。此外，出土了较多的玻璃手镯，还出土了一件侈口、细颈、圆形扁腹玻璃瓶。参考中国瓷器的年份，该区至少存在一个16至17世纪葡萄牙占领时期的人类活动层。\n根据上述材料可以推出：","options":{"A":"阿尔马塔夫最具地方特色的陶器是朱尔法陶器","B":"明初中国已与阿尔马塔夫存在频繁的官方往来","C":"阿尔马塔夫是古代亚欧文化艺术交流的集散地","D":"葡萄牙殖民者占领时期的阿尔马塔夫繁荣发达"},"answer":"C","explanation":"文段首句引出阿尔马塔夫遗址出土当地文物，接着列举了出土的中国产瓷器、泰国产青瓷等，尾句提出存在葡萄牙占领时期的人类活动层，可知文段重在强调阿尔马塔夫是古代亚欧文化艺术交流的集散地，对应C项。\nA项，根据“阿拉伯半岛的阿尔马塔夫遗址中已清理出9000多件遗物，其中\u003cimg data-k=\"98d1a3adb731\">以上为当地的朱尔法陶”可知，出土最多的是当地的“朱尔法陶”，无法说明最具地方特色的陶器是朱尔法陶器，偷换概念，排除；\nB项，根据“中国产的瓷器年代以明中晚期至清代为主”可知，明中晚期中国与阿尔马塔夫才存在频繁的官方往来，“明初”错误，排除；\nD项，根据“该区至少存在一个16至17世纪葡萄牙占领时期的人类活动层”可知，文段只论述存在人类活动层，并未论述此时的阿尔马塔夫繁荣发达，属于无中生有，排除。\n故正确答案为C。\n【文段出处】《拉斯海马的陶瓷遗存与中国考古》","no":50,"missingImage":false},{"type":"question","qid":"3522425","cat":"片段阅读","stem":"与数字应用相伴而生的是“数字鸿沟”难题。老龄群体在适应数字时代上的吃力，一方面是使用技能缺乏、文化程度限制或设备不足，另一方面许多数字产品在设计中忽视了老年人需求。我们正在步入老龄化社会，在线上线下日趋融合的当下，从立法规划、政府决策到产业发展都应该着眼长远，充分保障老年人的社会需求、权利和尊严，而不能仅仅把目光停留在年轻人身上。这就需要在科技进步的同时，兼顾消除老龄群体参与社区、社会生活的种种障碍，为他们提供一个安全、便捷、多彩、温暖的社会环境。\n这段文字意在强调：","options":{"A":"数字化生活应该重视老龄群体的需要","B":"部分老龄群体适应数字时代存在困难","C":"代际间的“数字鸿沟”现象如何产生","D":"建设老年人友好型社会需要依靠数字技术"},"answer":"A","explanation":"文段开篇提出在数字应用的背景下存在“数字鸿沟”这一问题，紧接着通过“一方面······另一方面······”论述老龄群体存在这一问题的具体原因，而后提出在老龄化社会的背景下，应从多个角度保障老年人的社会需求、权力和尊严，尾句通过“这”总结上文提出具体对策，应在发展科技的同时兼顾消除老龄群体的障碍，为其提供良好的社会环境。故文段重点强调在数字化生活的当下，要着重关注老龄群体的需求，对应A项。\nB项，“存在困难”为问题表述，非文段重点，排除；\nC项，“数字鸿沟”产生的原因对应文段开篇，非文段重点，排除；\nD项，文段重在强调要关注老龄群体的需求，而非强调“数字技术\"的重要性，排除。\n故正确答案为A。\n【文段出处】《互联网时代，助力解决老龄群体面临“数字鸿沟”难题》","no":51,"missingImage":false},{"type":"question","qid":"3523015","cat":"片段阅读","stem":"观照历史上多次出现过的媒介融合的进程结果，媒介材料的变更，绝不等于思想生活变现，正如汉字生产的主线，也绝不会因为纸张代替了简牍而出现颠覆性变化一样。事实上，简牍的汉字同纸张的汉字，并无太大差别，顶多只是字体有些不同而已。不可否认媒介变化肯定会带来表达的不同，如新近出现的网言网语，肯定是互联网语境下的表达产物。但无论媒介技术怎样发展变化，任何文明主干、任何文化血脉，都是一以贯之的。\n这段文字意在强调：","options":{"A":"正确认识媒介革命的特殊性与普遍性，重视传统文化的传承","B":"媒介革命不仅涉及媒介技术，还关乎人们的思想观念等问题","C":"借鉴历史上简牍与纸张之媒介融合的经验，推动新媒介融合","D":"媒介革命必定改变人们观念，助力社会进步和提升文明层次"},"answer":"A","explanation":"文段首句指出媒介材料的变更不等于思想生活变现，通过“正如”以纸张代替简牍没有改变汉字生产的主线为例，论证了媒介材料变更不等于思想发生改变，接着通过“事实上”进一步说明了简牍和纸张没有太大差别。接下来论述媒介变化确实会带来表达的不同，最后通过转折词“但”强调无论媒介技术怎么变，都不会改变文明和文化，故文段重点在尾句，强调媒介革命会带来多种情况，不变的是文明和文化，A项是文段重点的同义替换，当选。\nB项，对应到文段开篇，非重点，排除；\nC项，缺乏主题词“媒介革命”，偏离文段核心话题，排除；\nD项，“必定改变”与文意相悖，“助力社会进步和提升文明层次”无中生有，排除。\n故正确答案为A。\n【文段出处】《媒介融合之历史观照》","no":52,"missingImage":false},{"type":"question","qid":"3522426","cat":"片段阅读","stem":"退行心理是一种心理防御机制，是指人们在遭受挫折、面临困难时，以比较幼稚的态度，选择早期生活阶段的某种行为方式来应对当前情况。对于二三十岁的成年人来说，经常要面临来自各个方面的多重压力，于是在比较自由的环境中，很多人都会通过退行心理来调节情绪、释放压力，自称宝宝便是一种具体表现。事实上只要无伤大雅，这种暂时性的退行心理不仅是正常的，而且在某些情况下是极其有必要的。但如果一个人在遇到困难时，总利用退行心理去逃避现实问题或博取别人的同情，就很有可能发展成为某种心理疾病。\n根据这段文字，下列说法正确的是：","options":{"A":"经常自称宝宝会发展为某种心理疾病","B":"时常回忆年幼时光是退行心理的表现","C":"人不应沉溺于用退行心理来逃避现实","D":"二三十岁的成年人自称宝宝极有必要"},"answer":"C","explanation":"A项，根据尾句“总利用退行心理去逃避现实问题或博取别人的同情，就很有可能发展成为某种心理疾病”可知，经常自称宝宝不一定会发展为某种心理疾病，表述过于绝对，排除；\nB项，根据首句退行心理的定义“人们在遭受挫折、面临困难时，以比较幼稚的态度，选择早期生活阶段的某种行为方式来应对当前情况”可知，“回忆年幼时光”不一定是在“遭受挫折、面临困难”时的选择，且“回忆年幼时光”也不属于“幼稚的态度”“早期生活阶段的某种行为方式”，表述错误，排除；\nC项，根据尾句“总利用退行心理去逃避现实问题或博取别人的同情，就很有可能发展成为某种心理疾病”可知，人不可过分沉溺于用退行心理逃避现实，表述正确，当选；\nD项，根据文段后文介绍的退行心理的利弊影响可知，过于依赖退行心理逃避现实可能引发某种心理疾病，故“极有必要”表述错误，排除。\n故正确答案为C。\n【文段出处】《成年人总自称宝宝竟是种病！》","no":53,"missingImage":false},{"type":"question","qid":"3522976","cat":"语句表达","stem":"近日，由中国、意大利、美国学者组成的研究团队，最新研发出一种三维石墨烯—碳纳米管复合网络支架。这种生物支架能很好地模拟大脑神经网络结构，未来，将可用于药物筛选或植入大脑帮助治疗脑部疾病，该碳神经支架由我国率先提出并完成材料制备。科学家                    。科研人员发现，相比在二维的培养皿中观察、培养神经细胞，三维支架更接近脑部实际环境。\n将下列四个句子重新排列，填入划横线处，语序正确的是：\n①把体内正常的神经干细胞移植到细小的碳纳米管中\n②用石墨烯模拟大脑内部四通八达的三维框架\n③从而构建出一个“互联互通”的人造神经网络\n④增殖和定向分化神经元细胞","options":{"A":"①②③④","B":"②④①③","C":"①③②④","D":"②①④③"},"answer":"D","explanation":"本题是语句排序题与语句填空题的复合题型，需将句子排列整齐后放于文段横线处，横线出现在文段中间，所以还需要注意与前后文的衔接。\n观察选项，判断首句。①句指出将正常的神经干细胞移植到碳纳米管中，②句论述用石墨烯模拟大脑的三维框架，根据前文可知，该框架就是指碳纳米管复合网络支架，按照逻辑顺序，应先有框架，再进行内容填充，先有了三维框架，才能将神经干细胞移植到其中，故②句应在①句前，排除A、C两项。\n对比B、D两项，尾句均为③句，区别在于①句和④句的先后顺序，①句讲神经干细胞的移植，④句讲神经元细胞，按照逻辑顺序，应该先有神经干细胞，再分化为神经元细胞，故①句应在④句前，排除B项，锁定D项。\n故正确答案为D。\n【文段出处】《石墨烯——碳纳米管复合支架可模拟脑神经网络》","no":54,"missingImage":false},{"type":"question","qid":"3524697","cat":"语句表达","stem":"①太阳又沉下西原的平顶了\n②石头撞击的唰啦唰啦的声音时断时续，缺乏热烈，有点单调\n③我看见对岸的沙滩上，支撑着一架罗网\n④河堤和石坝的丁字拐弯的水潭里，有三个半大小子在游泳嬉水\n⑤女人正挥动铁锨朝罗网上抛掷着沙石\n将以上五个句子重新排列，语序正确的是：","options":{"A":"③①④⑤②","B":"③④①⑤②","C":"①④⑤③②","D":"①④③⑤②"},"answer":"D","explanation":"对比选项，确定首句，③句指出“我”看见对岸沙滩的罗网，①句描写太阳落下的场景，均可作为首句。\n继续观察文段，寻找解题线索，③句提到看到“罗网”，⑤句指明女人正朝“罗网”抛掷沙石，②句继续说明抛掷沙石时沙石撞击产生的声音。③⑤②三句话题一致，且根据逻辑顺序，应先引出“罗网”，再介绍有人朝“罗网”抛掷沙石，继而产生石头撞击的声音，故三句话构成捆绑，且顺序为③⑤②，对应D项。\n故正确答案为D。\n【文段出处】《日子》","no":55,"missingImage":false},{"type":"question","qid":"3522414","cat":"语句表达","stem":"提到一座城市，人们往往会想到具有代表性的文化地标：600岁的紫禁城见证着北京城的过往，拓荒牛雕塑标记着深圳的开拓进取······城市文化地标                    ，成为一个城市的精神和文化象征，与人们产生紧密的情感连接、文化认同。文化地标是一个地方的文化名片，在传播城市形象方面有巨大的流量效应。近年来，文化旅游市场持续升温，各类文化地标成为热门参观地、网红打卡地。\n填入划横线部分最恰当的一句是：","options":{"A":"大都强调人文景观与自然环境和谐共生，以形神兼备的呈现方式","B":"或深植于历史文化，或投射着时代风貌，以鲜明独特的符号形象","C":"不是凭借炫目奇特的视觉效果，或各类时髦文化元素的简单堆砌","D":"承载着无法替代的人文价值，满足着公众的审美旨趣和美好期待"},"answer":"B","explanation":"横线出现在文段中间，需考虑与前后文的衔接。横线前文引出城市文化地标的话题，点出城市文化地标具有代表性，见证着一个地方的过去，标记着一个地方的风格，横线后指出城市文化地标是一个能让人们产生城市内情感连接、文化认同的精神、文化象征，是一个地方的名片，并举例说明当下很多城市文化地标成为名片的例子。因此横线处要承接前后文，表达城市文化地标代表了一个城市的过去及风格，且城市文化地标是一个具有城市地方特色的名片的语义，对应B项。\nA项，“自然环境”无中生有，排除；\nC项，“视觉效果”“各类时髦文化元素”无中生有，排除；\nD项，“满足着公众的审美旨趣和美好期待”无中生有，且没有指出城市文化地标“是一个地方的文化名片”的独特象征地位，无法和后文衔接，排除。\n故正确答案为B。\n【文段出处】《打造有生命力的文化地标》","no":56,"missingImage":false},{"type":"question","qid":"3523490","cat":"语句表达","stem":"虽然树种对水分的利用规律大同小异，但不同的森林类型涵养水源的作用大小不一。科学评估显示，长江上游天然林保护工程的实施为岷江上游的水生态安全做出了明显贡献，但大面积的人工植被覆盖可能加重区域生态用水，从而降低流域产水量，且大规模集中连片种植的人工纯林引发的外来物种入侵、病虫害、生态系统健康问题凸显。因此，应首先                    。\n填入划横线部分最恰当的一句是：","options":{"A":"保护现存的天然林植被","B":"发挥森林涵养水源功能","C":"保障水资源和生态安全","D":"加强人工造林植被建设"},"answer":"A","explanation":"横线出现在文段末尾，根据“因此”以及“应首先”可知，所填入句子为针对上文问题的解决对策。文段首先说明了不同森林类型涵养水源的作用大小不一，接下来指出长江上游天然林保护工程为岷江上游的水生态安全做出了贡献，随后通过转折词“但”强调大面积的人工植被覆盖会带来一些问题，影响生态系统健康。故横线处所填内容需解决“大面积的人工植被覆盖”的问题，即应首先保护现有的天然林，而非大面积栽种人工植被，对应A项。\nB项“发挥森林涵养水源功能”、D项“加强人工造林植被建设”均无法解决“大面积的人工植被覆盖”的问题，排除；\nC项，“保障水资源和生态安全”没有提及具体的保护对策，表述不明确，排除。\n故正确答案为A。\n【文段出处】《森林与水是什么关系？中国林科院首次深度“揭秘”》","no":57,"missingImage":false},{"type":"question","qid":"3522417","cat":"片段阅读","stem":"地球上的地震发生在由板块运动产生的断层上，火星没有板块构造，但它持续的冷却和收缩过程会产生压力，当这种压力积累到足够大，就会引发火星地震。探测到火星地震是科学研究工作的一个里程碑。研究人员说，安放在火星表面的“内部结构地震实验仪”就像“贴着耳朵放了一部电话”，可以“听”到来自火星内部的震波。通过监测这些震波，研究人员了解到火星内部地震活动的强度和频度，从而分析出火星内部不同层级的深度和构成。科研人员通过对火星地震的研究，可以分析火星形成的历史，以增加人类对地球、月亮等星球起源的了解。\n下列选项与这段文字意思相符的是：","options":{"A":"内部结构地震实验仪探测到火星地震","B":"火星地震研究是科学研究的全新领域","C":"人类的耳朵可以听到火星的真实地震","D":"通过研究火星地震才能了解月亮起源"},"answer":"A","explanation":"A项，根据“‘内部结构地震实验仪’就像‘贴着耳朵放了一部电话’，可以‘听’到来自火星内部的震波。通过监测这些震波，研究人员了解到火星内部地震活动的强度和频度”可知，说法正确，当选。\nB项，文段中未提到火星地震研究是科学研究的全新领域，无中生有，排除。\nC项，文段中只提到“内部结构地震实验仪”像“贴着耳朵放了一部电话”，未提到人类的耳朵可以听到火星的真实地震，无中生有，排除。\nD项，根据“科研人员通过对火星地震的研究，可以分析火星形成的历史，以增加人类对地球、月亮等星球起源的了解”可知研究火星地震并非是了解月亮起源的唯一途径，“通过······才能······”表述绝对，排除。\n故正确答案为A。\n【文段出处】新华社《科普：人类首次探测到“火星地震”意味着什么》","no":58,"missingImage":false},{"type":"question","qid":"3523017","cat":"片段阅读","stem":"制造业智能时代在创造出大量新的产品和服务的同时，也衍生出例如机器人操作和维护、工业数据工程师等全新的职业方向，就业形式上出现了更多自由职业者和兼职岗位，工作内容上也更加体现专业协作。制造业智能化产生的新兴岗位巨大供需差，要求职业院校准确把握专业方向，根据制造业产业链的变化对专业链进行及时调整和更新，以实现智能化产品在性能、质量和生产效率方面质的飞跃。\n上述文字意在强调的是：","options":{"A":"岗位快速更迭要求专业动态调整","B":"技术技能人才培养目标发生变革","C":"制造业智能化衍生出全新职业方向","D":"职业教育为制造业智能化升级助力"},"answer":"A","explanation":"文段围绕制造业智能时代的岗位更迭展开，首句介绍制造业智能时代衍生出许多全新职业，就业形式与内容也发生变化，接下来通过“要求”，就新兴岗位的巨大供需差提出应对措施，即职业院校需要对专业进行及时调整。文段重在尾句的对策，即面对岗位更迭变化，职业院校要对专业进行及时调整，对应A项。\nB项，“人才培养目标”在文段中并未提及，无中生有，排除；\nC项，“衍生出全新职业方向”为对策前的内容，非重点，排除；\nD项，“职业教育为制造业智能化升级助力”并非对策表述，与文段重点形式不符，且文段尾句已交代了具体助力的对策即调整专业，相比A项，表述不明确，排除。\n故正确答案为A。\n【文段出处】《面对制造业智能化的机遇和挑战 职业教育准备好了吗》","no":59,"missingImage":false},{"type":"question","qid":"3522955","cat":"片段阅读","stem":"常温常压下，天然气的气态轻烃有4种，甲烷\u003cimg data-k=\"b5727e7b68c3\">、乙烷\u003cimg data-k=\"46b6612cfd26\">、丙烷\u003cimg data-k=\"4f13d64e2bec\">和丁烷\u003cimg data-k=\"6424e4439eb9\">。轻烃的含碳数越高，每个分子里需要供给的氢的数量也越多。腐殖型有机质含氢的数量较少，无法为碳数较多的轻烃提供足够的氢。另外，随着碳数越多，轻烃的形成温度也依次升高。烃源岩在低温的时候（\u003cimg data-k=\"bf493734b072\">左右），就能够大量地生成甲烷。由于很多地方的地温达不到那么高，所以也无法形成高碳数的气态轻烃。\n上述文段意在说明：","options":{"A":"轻烃的含碳数越高，氢的数量也越多","B":"含碳数越多，轻烃所需的温度也越高","C":"在天然气中，甲烷是占比最多的成分","D":"在天然气中，丁烷是占比最多的成分"},"answer":"C","explanation":"文段首先引出了“天然气的气态轻烃”这个话题，接着指出由于客观条件，碳数较多的轻烃无法获得足够的氢，故天然气中以低碳数的气态轻烃即甲烷为主，后文通过“另外”表并列，阐述轻烃随着碳数增多，形成温度也会发生变化，而多地都达不到的温度让气态轻烃无法形成高碳数的气态轻烃，只能生成甲烷。故文段通过并列结构，全面论述甲烷是天然气中占比最多的成分，对应C项。\nA项“氢的数量”、B项“温度”分别对应并列的两个方面，表述片面，D项与文段表述完全相反。且A、B、D三项均未提到低碳数的气态轻烃即甲烷，主题词不符，排除。\n故正确答案为C。","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"3522354","cat":"数学运算","stem":"小明去某楼盘售楼部咨询售房情况。置业顾问告诉他，如果再卖出50套，则已卖出的数量与未卖出的数量相等；如果再卖出150套，则已卖出的数量比未卖出的数量多一半，问该楼盘目前还剩下多少套房子未卖出？","options":{"A":"350套","B":"450套","C":"550套","D":"650套"},"answer":"C","explanation":"设目前已卖、未卖分别为\u003cimg data-k=\"5320a525f2bc\">、\u003cimg data-k=\"c1beececd683\">套，根据题意列方程组：\n\u003cimg data-k=\"b9dbe49e7fc0\">······①\n\u003cimg data-k=\"9e041cefd319\">······②\n联立①②求解可得\u003cimg data-k=\"2419611d2531\">，\u003cimg data-k=\"c7a8f1ca9a92\">，即目前还剩下550套房子未卖出。\n故正确答案为C。","no":61,"missingImage":false},{"type":"question","qid":"3522399","cat":"数学运算","stem":"送奶工人给11楼住户送牛奶，由于小区停电导致电梯无法使用。如果他走楼梯从第1层到第2层需要5秒，以后每多走一层需多花2秒，其中走到5层以后每多走一层需多休息5秒，那么他走到11层需要多少秒？","options":{"A":"210","B":"215","C":"220","D":"235"},"answer":"B","explanation":"根据题意可知，走各层楼梯用时是公差为2的等差数列。从第1层走到第2层用时\u003cimg data-k=\"c7e1eb6c19a2\">秒，根据\u003cimg data-k=\"15ef864dd7bd\">，从第十层走到第十一层用时\u003cimg data-k=\"342f97b272b2\">\u003cimg data-k=\"279e7be196ca\">秒，再根据等差数列求和公式：\u003cimg data-k=\"c154227c7a61\">，可得走楼梯用时为\u003cimg data-k=\"0338256dc373\">\u003cimg data-k=\"30c875842b17\">秒；休息用时是公差为5的等差数列，\u003cimg data-k=\"c7e1eb6c19a2\">秒，到第十层休息用时\u003cimg data-k=\"becd94748f79\">\u003cimg data-k=\"0350a469cb10\">秒，中途休息总用时\u003cimg data-k=\"66e22b6a7f85\">\u003cimg data-k=\"3d7a35db9b10\">秒；总用时\u003cimg data-k=\"933ef47d6f13\">\u003cimg data-k=\"26245fc395e4\">\u003cimg data-k=\"2062a39b8eb1\">秒。\n故正确答案为B。","no":62,"missingImage":false},{"type":"question","qid":"3522770","cat":"数学运算","stem":"某公园鸟语林共饲养180只鸟类动物，为养护方便，园方将鸟语林分为A、B、C三个区。某日，A区的一部分鸟飞至B、C两区，清点时，B、C两区鸟的数量都增加一倍。次日，一些鸟又从B区飞至A、C两区，清点时，A、C两区鸟的数量也都增加一倍。第三日，一部分鸟又从C区飞至A、B两区，清点时，A、B两区鸟的数量同样增加一倍，而此时C区剩余鸟的数量恰好是A区的\u003cimg data-k=\"3ac9f3e09ec9\">，那么，最初A区有多少只鸟？","options":{"A":"103","B":"104","C":"105","D":"106"},"answer":"A","explanation":"将三次鸟的变化情况列表如下：\n\u003cimg data-k=\"03f171035956\" style=\"max-width:628px\">\n根据第三次后，C区剩余鸟的数量恰好是A区的\u003cimg data-k=\"3ac9f3e09ec9\">，说明A区现在鸟的数量必然为26的整数倍。代入A项：最初A区有103只，则\u003cimg data-k=\"a3a301643ae2\">\u003cimg data-k=\"8d939daa204d\">\u003cimg data-k=\"565c5311aebb\">只，第一次后\u003cimg data-k=\"a2ee25ce7be8\">\u003cimg data-k=\"d3e862f85d23\">\u003cimg data-k=\"2952ffff4d9f\">只，则A区剩余\u003cimg data-k=\"a121e6cef1e9\">只，第三次后\u003cimg data-k=\"6049711008bd\">也是26的倍数，符合题意，当选。其余选项均不满足。\n故正确答案为A。","no":63,"missingImage":false},{"type":"question","qid":"3523384","cat":"数学运算","stem":"两个大人带四个孩子去坐只有六个位置的圆型旋转木马，那么两个大人不相邻的概率为：","options":{"A":"\u003cimg data-k=\"90afe36efe91\">","B":"\u003cimg data-k=\"b11435d4d6bd\">","C":"\u003cimg data-k=\"bec3fe75cd62\">","D":"\u003cimg data-k=\"8c3342040bcf\">"},"answer":"B","explanation":"方法一：六个人坐在圆型旋转木马的情况总数为\u003cimg data-k=\"2592cfab3ec1\">。现先让四个孩子去坐，情况数为\u003cimg data-k=\"f360bbd4466a\">，四个孩子之间可形成4个空，再让两个大人各选一个空，情况数为\u003cimg data-k=\"4d7a1ba73279\">，故两个大人不相邻的情况数为\u003cimg data-k=\"8d5bbdd2b245\">，题目所求概率为\u003cimg data-k=\"bc4ddc6bee2c\">。\n方法二：六个人坐在圆型旋转木马的情况总数为\u003cimg data-k=\"2592cfab3ec1\">。考虑反面，两个大人相邻情况数为\u003cimg data-k=\"a5300a5eb33f\">\u003cimg data-k=\"304c325db8ab\">，题目所求概率为\u003cimg data-k=\"634711a39984\">。\n故正确答案为B。\n备注：n个人随机围绕圆桌就坐，情况数为\u003cimg data-k=\"3074b713b926\">。","no":64,"missingImage":false},{"type":"question","qid":"3522376","cat":"数学运算","stem":"某高校开设A类选修课四门，B类选修课三门。小刘从中共选取四门课程，若要求两类课程各至少选一门，则选法有：","options":{"A":"18种","B":"22种","C":"26种","D":"34种"},"answer":"D","explanation":"方法一：根据题意，两类课程各至少选一门，有三种情况：\n（1）A类选一门，B类选三门，有\u003cimg data-k=\"7c086c6d7749\">种；\n（2）A类选两门，B类选两门，有\u003cimg data-k=\"1bed2dec1056\">种；\n（3）A类选三门，B类选一门，有\u003cimg data-k=\"9fe608b1d848\">种；\n则选法共有\u003cimg data-k=\"e81b7b844298\">种。\n方法二：要求两类课程各至少选一门，正向情况数较多，从反面考虑。总情况为七门课程中选择四门，为\u003cimg data-k=\"3d3f6a494cf1\">种情况；不满足要求的情况为选择四门课程都为一类，只有A类四门都选、B类不选1种情况。满足情况数\u003cimg data-k=\"e6c7a9c8511f\">总情况数\u003cimg data-k=\"e752a8ae1a16\">不满足要求情况数\u003cimg data-k=\"83a881ebf13c\">种。\n故正确答案为D。","no":65,"missingImage":false},{"type":"question","qid":"3522375","cat":"数学运算","stem":"某装修公司订购了一条长为2.5m的长方体条形不锈钢管，要剪裁成60cm和43cm长的两种规格长度不锈钢管若干根，所裁钢管的横截面与原来一样，不考虑剪裁时材料的损耗，要使剩下的钢管尽量少，此时材料的利用率为：","options":{"A":"0.998","B":"0.996","C":"0.928","D":"0.824"},"answer":"B","explanation":"设剪裁成60cm的不锈钢管\u003cimg data-k=\"5320a525f2bc\">根，剪裁成43cm的不锈钢管\u003cimg data-k=\"c1beececd683\">根，根据题意，长方体条形不锈钢管长为2.5m，单位统一为250cm，即：\u003cimg data-k=\"252804fbccbe\">；\n当\u003cimg data-k=\"52ee8531d542\">时，解得\u003cimg data-k=\"bf462013780a\">，\u003cimg data-k=\"356b204b8c7b\">cm，剩\u003cimg data-k=\"28aff0e437c1\">cm；\n当\u003cimg data-k=\"86e5c9d9cea6\">时，解得\u003cimg data-k=\"2944df6a7a58\">，\u003cimg data-k=\"1191135074e8\">cm，剩\u003cimg data-k=\"76e44387369b\">cm；\n当\u003cimg data-k=\"8c2488b97a66\">时，解得\u003cimg data-k=\"956f6b74e42d\">，\u003cimg data-k=\"715cdaa74841\">cm，剩\u003cimg data-k=\"62d171658718\">cm。\n由此可知剩下的钢管最少为1cm，利用率\u003cimg data-k=\"69b3001e68a7\">\u003cimg data-k=\"78ef3e217c4b\">\u003cimg data-k=\"570746e9ed58\">\u003cimg data-k=\"3b7f913c9dbe\">。\n故正确答案为B。","no":66,"missingImage":false},{"type":"question","qid":"3522421","cat":"数学运算","stem":"一个不计厚度的圆柱型无盖透明塑料桶，桶高2.5分米，底面周长为24分米，AB为底面直径。在塑料桶内壁桶底的B处有一只蚊子，此时，一只壁虎正好在塑料桶外壁的A处，则壁虎从外壁A处爬到内壁B处吃到蚊子所爬过的最短路径长约为：\n\u003cimg data-k=\"5a30349141d2\" style=\"max-width:445px\">","options":{"A":"10分米","B":"12.25分米","C":"12.64分米","D":"13分米"},"answer":"C","explanation":"本题要求表面的最短路径，可考虑两种方式。第一种可在A点沿着外壁直上直下爬入桶内部，由于不考虑桶厚度，所以壁虎依然在A点位置，此时走了\u003cimg data-k=\"6bc84fc7f98b\">分米，接下来壁虎只需沿直径从A爬到B即可，即又走了\u003cimg data-k=\"1535c71fb611\">分米，此时从A到B共爬了\u003cimg data-k=\"28e6ed1d484e\">分米。\n第二种可将图形进行展开，如图所示。原图中AB为直径，则在展开图中AB的距离\u003cimg data-k=\"262ff09d174b\">底面周长\u003cimg data-k=\"f7f86b77b19c\">分米，\u003cimg data-k=\"9220459d5c0b\">分米。所求为\u003cimg data-k=\"3ee182b939db\">最小值，延长AD，使\u003cimg data-k=\"3d76e3e4b26f\">，则\u003cimg data-k=\"522d9a944b49\">\u003cimg data-k=\"2a20f2108296\">，在直角三角形A&#39;AB中，\u003cimg data-k=\"c700809ca8fc\">分米，\u003cimg data-k=\"ac4d7b1ca364\">\u003cimg data-k=\"00534fb1b2a2\">分米，根据勾股定理\u003cimg data-k=\"8124fb156fd1\">\u003cimg data-k=\"1dcd32f8da49\">分米。\n\u003cimg data-k=\"ace545af49a7\" style=\"max-width:496px\">\n综上，第一种的距离更短，为12.64分米。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"3522411","cat":"数学运算","stem":"我国一支工兵部队在某国执行维和任务，负责道路抢修工作。某天，该部队负责的道路被炮弹炸出一个球面形状的大坑。经测量，弹坑直径16m，深4m。现需用车辆运送混凝土填充弹坑，铺平道路，假设每车次可运输\u003cimg data-k=\"308191250dfa\">的混凝土，问抢修道路至少需要出动运输车多少车次？（球缺体积计算公式为\u003cimg data-k=\"c6ff46501913\">，其中\u003cimg data-k=\"572ab59e28b8\">为球半径，\u003cimg data-k=\"d34d99025175\">为球缺高，\u003cimg data-k=\"7ed4e15bb935\">为球缺体积）","options":{"A":"65","B":"66","C":"67","D":"68"},"answer":"C","explanation":"球缺是指球被平面截下的部分，题干中的大坑即为一个球缺。如图所示，球缺高即为BD线段长，\u003cimg data-k=\"bc51d734cc70\">m；在直角三角形OCD中，根据“弹坑直径16m”，可知截面半径CD\u003cimg data-k=\"1b27ee8d71a4\">m，OD\u003cimg data-k=\"5f28e7ef4d30\">m，OC\u003cimg data-k=\"9ccc14e62391\">m，依据勾股定理，\u003cimg data-k=\"10b2857bf711\">，解得\u003cimg data-k=\"6afdc3e672fb\">；将球的半径\u003cimg data-k=\"572ab59e28b8\">与球缺高\u003cimg data-k=\"d34d99025175\">代入球缺体积公式，可得球缺体积\u003cimg data-k=\"3d9f1c6a9185\">\u003cimg data-k=\"3290cfa6756b\">\u003cimg data-k=\"5d7852700581\">\u003cimg data-k=\"792f4fa22214\">，所需\u003cimg data-k=\"73434b007c43\">车次，即66车次不够，至少需要67车次。\n\u003cimg data-k=\"23f9c05446a7\" style=\"max-width:323px\">\n故正确答案为C。\n【备注】本题不严谨，题干所给公式中的\u003cimg data-k=\"572ab59e28b8\">，理论上应为球缺底面的半径，但在考场上，按照命题人所给的公式及字母含义解题即可。","no":68,"missingImage":false},{"type":"question","qid":"3522765","cat":"数学运算","stem":"某草莓经销商有201箱的草莓要分配给若干个水果店，要求无论选用怎样的分配方式，都要有水果店至少分到8箱，则水果店至多有：","options":{"A":"20个","B":"21个","C":"28个","D":"29个"},"answer":"C","explanation":"问至多有多少家，从最大的选项开始代入。分配方式为平均分配可以使水果店最多。\n代入D项，如果每家先分7箱，\u003cimg data-k=\"51b5bf6f8a39\">箱，则所有水果店分得水果都不超过8箱，排除；\n代入C项，如果每家先分7箱，\u003cimg data-k=\"283993cb6941\">箱，剩余\u003cimg data-k=\"69031bdde525\">箱，都会有一家至少分得8箱，当选。\n故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"3522427","cat":"数学运算","stem":"太平洋上有一个圆形的平坦小岛，岛上遍布森林，闪电击中处于小岛边缘的树木引发森林火灾（如下图所示）。假设火线是以圆弧状往小岛深处推进，问当大火烧到小岛中心位置时，过火面积占全岛面积的比例大约是多少？\n\u003cimg data-k=\"91a1c55d8a02\" style=\"max-width:483px\">","options":{"A":"\u003cimg data-k=\"9965522e093a\">","B":"\u003cimg data-k=\"2c6adc1698b0\">","C":"\u003cimg data-k=\"fa0de4871c60\">","D":"\u003cimg data-k=\"a1f51a060389\">"},"answer":"B","explanation":"由题图可知，大火烧到岛中心时，刚好圆弧状的火线最中间点在圆心位置。如图所示：\n\u003cimg data-k=\"b5441b3e50f8\" style=\"max-width:493px\">\n假设圆心为O点，起火点为A点，起火点到圆弧状火线与森林边缘的交点分别为B、C两点，连接OB和OC、AB和AC，OA、OB、OC恰好都为圆形小岛的半径，则\u003cimg data-k=\"6d59ab555f65\">。同时由题图可知\u003cimg data-k=\"79ca4c526436\">，则三角形BAO和三角形CAO均为等边三角形，即\u003cimg data-k=\"5284a79940dc\">，同时高均为\u003cimg data-k=\"87e28f689328\">。由扇形面积\u003cimg data-k=\"84b047f24633\">可知，\u003cimg data-k=\"c6a827638034\">\u003cimg data-k=\"6dfd511e5d48\">\u003cimg data-k=\"2d5a0f5080d2\">\u003cimg data-k=\"fbad166f0f3a\">\u003cimg data-k=\"a7118f03557a\">；过火面积\u003cimg data-k=\"ae57bf694ed3\">，\u003cimg data-k=\"4bcb7297bf08\">\u003cimg data-k=\"a54972b4e793\">，圆形小岛面积\u003cimg data-k=\"2eeb340960c9\">。故过火面积所占比例为\u003cimg data-k=\"ab977771b30b\">\u003cimg data-k=\"2c7ba79dd13c\">\u003cimg data-k=\"2afab8b69da8\">。\n故正确答案为B。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"3522462","cat":"逻辑判断","stem":"越来越多的人已经习惯于在“云端”漫步，享受快速发展带来的成果，却不见：德国正在推进“工业4.0”计划，美国正在呼唤“再工业化”；却不知：没有强大的生产制造能力、创新设计能力，国计民生就没有保障，国家实力就无从谈起，“互联网\u003cimg data-k=\"3d6d1f96db11\">”也就只能是空中楼阁；却不思：只醉心于虚拟经济是靠不住的。越是在宏观层面，越要充分认识到互联网的诸多局限性。\n如果以上为真，则以下哪项为真？","options":{"A":"“互联网\u003cimg data-k=\"3d6d1f96db11\">”使很多人沉迷于虚拟经济","B":"“互联网\u003cimg data-k=\"3d6d1f96db11\">”在微观层面的局限性更少","C":"只有国计民生得到保障，才能发展“互联网\u003cimg data-k=\"3d6d1f96db11\">”","D":"只有提高生产制造和创新设计能力，才能发展“互联网\u003cimg data-k=\"3d6d1f96db11\">”"},"answer":"D","explanation":"第一步：翻译题干。\n①\u003cimg data-k=\"e752a8ae1a16\">强大的生产制造能力、创新设计能力\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">国计民生有保障\n②\u003cimg data-k=\"e752a8ae1a16\">强大的生产制造能力、创新设计能力\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">国家实力\n③\u003cimg data-k=\"e752a8ae1a16\">强大的生产制造能力、创新设计能力\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">“互联网\u003cimg data-k=\"3d6d1f96db11\">”\n第二步：逐一分析选项。\nA项：题干只涉及醉心于虚拟经济靠不住，并不涉及“互联网\u003cimg data-k=\"3d6d1f96db11\">”和使很多人沉迷于虚拟经济的关系，无法推出，排除；\nB项：题干只涉及在宏观层面要充分认识到互联网的局限性，并不涉及“互联网\u003cimg data-k=\"3d6d1f96db11\">”在微观层面的局限性，无法推出，排除；\nC项：翻译为发展“互联网\u003cimg data-k=\"3d6d1f96db11\">”\u003cimg data-k=\"2dfb7d1f72f3\">国计民生有保障，两者不存在推出关系，排除；\nD项：翻译为发展“互联网\u003cimg data-k=\"3d6d1f96db11\">”\u003cimg data-k=\"2dfb7d1f72f3\">提高生产制造、创新设计能力，是对③的否后，否后必否前，可以推出，当选。\n故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"3522402","cat":"逻辑判断","stem":"最近有研究团队以问卷调查的方式，调查了519名从未吸过传统香烟，年龄在18岁至25岁间的年轻人，调查内容包括这些年轻人吸电子烟的情况和吸传统香烟的意向等，研究报告称，在从未吸过传统香烟的年轻人中，那些正在吸电子烟的人更可能尝试传统香烟，有关电子烟的监管政策要注意保护年轻人。\n以下各项如果为真，最能支持上述结论的是：","options":{"A":"受访者中有20%的人尝试过电子烟或未来很可能会尝试电子烟","B":"即使只尝了两三口电子烟，也有可能提高吸传统香烟的可能性","C":"受访者中正在吸电子烟的有60%表示未来一定会尝试传统香烟","D":"电子烟对健康的危害比传统香烟小，但仍然含有很多有害物质"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：在从未吸过传统香烟的年轻人中，那些正在吸电子烟的人更可能尝试传统香烟，有关电子烟的监管政策要注意保护年轻人。\n论据：无。\n本题只有论点，没有论据，优先考虑补充论据加强，即解释或举例证明“正在吸电子烟的年轻人更可能尝试传统香烟”。\n第二步：逐一分析选项。\nA项：论点说的是更可能尝试传统香烟，该项说的是有多少人尝试过电子烟，以及未来可能会尝试，话题不一致，无法加强，排除；\nB项：选项表明吸电子烟的人相比于不吸电子烟的人而言，更可能吸传统香烟，该项是针对论点的可能性加强，属于补充论据，保留；\nC项：该项表明受访者中正在吸电子烟的有60%表示未来一定会尝试传统香烟，该项比B项加强力度更大，原因有二：\n一是题干论点强调保护年轻人，而C项的受试者正是年轻人，表明的是吸电子烟的年轻人的意愿，B项没分，年纪大小都可以，那为什么不保护年纪大的，而要特别保护年轻人呢？\n二是如下图原文所示，C项把原文中的“可能或肯定”，改为“一定”，应该是为了区分B的可能，综上C项更有可能是出题人想设置的正确答案；\n\u003cimg data-k=\"03b2d40a5263\" style=\"max-width:700px\">\nD项：论点说的是正在吸电子烟的年轻人更可能尝试传统香烟，该项说的是电子烟的危害，话题不一致，无法加强，排除。\n故正确答案为C。","no":72,"missingImage":false},{"type":"question","qid":"3522405","cat":"逻辑判断","stem":"吴老师、张老师、孙老师、苏老师都是某校教师，分别教授语文、生物、物理、化学四门课程。\n已知：\n①如果吴老师教语文，那么张老师不教生物\n②或者孙老师教语文，或者吴老师教语文\n③如果张老师不教生物，那么苏老师不教物理\n④或者吴老师不教化学，或者苏老师教物理\n以下哪项如果为真，可以推出孙老师教语文：","options":{"A":"吴老师教语文","B":"张老师不教生物","C":"吴老师教化学","D":"苏老师不教物理"},"answer":"C","explanation":"第一步：翻译题干。\n①吴老师教语文\u003cimg data-k=\"1ea22d0695fd\">张老师教生物；\n②孙老师教语文或者吴老师教语文；\n③\u003cimg data-k=\"e752a8ae1a16\">张老师教生物\u003cimg data-k=\"1ea22d0695fd\">苏老师教物理；\n④\u003cimg data-k=\"e752a8ae1a16\">吴老师教化学或者苏老师教物理。\n第二步：逐一分析选项。\n提问为“推出孙老师教语文”，本题是给出了结论，需要从结论出发倒推条件。\n根据条件②可知：想要推出“孙老师教语文”，需要吴老师不教语文；\n根据条件①可知：想要得到“吴老师不教语文”，需要张老师教生物；\n根据条件③可知：想要得到“张老师教生物”，需要苏老师教物理；\n根据条件④可知：想要得到“苏老师教物理”，需要吴老师教化学。\n即：想要推出“孙老师教语文”，需要吴老师教化学。\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"3522415","cat":"逻辑判断","stem":"黑洞其实并不“黑”，它会以黑体热辐射的形式向外辐射能量，放出极其微弱的光（电磁波），这种光被称为“霍金辐射”。因为“霍金辐射”会释放出能量，所以黑洞会逐渐变小，直至最后消失（黑洞蒸发）。有科学家认为，“霍金辐射”中不含有信息，也就是说被黑洞吞噬的物体信息会消失。\n以下说法如果为真，最能支持上述科学家观点的是：","options":{"A":"黑洞的表面就像“全息图的底片”，保存着黑洞内部所含的一切信息","B":"根据量子物理学的信息守恒定律，信息在任何条件下都不会完全消失","C":"任何携带信息的物质被黑洞吞噬后，从黑洞释放出的热辐射不携带任何信息","D":"黑洞引力极强，任何物质被它吞噬都无法逃逸，连光也不能幸免，因此无法确认被吞噬的物体信息"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：“霍金辐射”中不含有信息，也就是说被黑洞吞噬的物体信息会消失。\n论据：无。\n本文只有论点，因此优先考虑补充论据的形式来加强，考虑原因解释或举例子。\n第二步：逐一分析选项。\nA项：黑洞表面保存着黑洞内部的所有信息，说明被黑洞吞噬的物体信息不会消失，为削弱项，无法加强，排除；\nB项：选项说信息不会完全消失，否定论点中的被黑洞吞噬的物体信息会消失，削弱项，无法加强，排除；\nC项：选项解释了被黑洞吞噬的物体信息会消失，补充论据进行加强，当选；\nD项：选项说明无法明确物体信息，属于不明确选项，无法加强，排除。\n故正确答案为C。","no":74,"missingImage":false},{"type":"question","qid":"3523354","cat":"逻辑判断","stem":"不粘锅常见的不粘涂层为特氟龙涂层。全氟辛酸铵是特氟龙生产过程中使用的含量极微的一种加工助剂。数据表明，高剂量的全氟辛酸铵有可能导致胆固醇水平升高、甲状腺疾病及不育。特氟龙在常温及常态下具有非常稳定的理化性质，使用特氟龙不粘涂层的炊具在常温至\u003cimg data-k=\"1eab253ea834\">的温度范围内都不会发生任何变化，但是当温度超过\u003cimg data-k=\"1eab253ea834\">时，涂层逐渐向不稳定状态转变，当温度超过\u003cimg data-k=\"5b75dc9fdda1\">时会发生分解。正常烹调时，水的沸点是\u003cimg data-k=\"92a92f9896db\">，温度较高的爆炒通常也只是\u003cimg data-k=\"1392500f686a\">左右，即使采用油炸的方式，油温也不会超过\u003cimg data-k=\"ee811da577b4\">。然而，如果在炒菜时喜欢把锅烧干、烧红后再加油，锅内温度就容易超过\u003cimg data-k=\"1eab253ea834\">。\n由此无法推出的是：","options":{"A":"日常生活中，可以用不粘锅来烧开水和煮粥","B":"烹饪时不粘涂层分解会导致胆固醇水平升高","C":"炒菜时应避免把不粘锅烧干、烧红后再加油","D":"正常烹调通常无需担心不粘锅释放有害物质"},"answer":"B","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干“正常烹调时，水的沸点是\u003cimg data-k=\"92a92f9896db\">，温度较高的爆炒通常也只是\u003cimg data-k=\"1392500f686a\">左右，即使采用油炸的方式，油温也不会超过\u003cimg data-k=\"ee811da577b4\">”，可知烧水等正常烹调不会超过\u003cimg data-k=\"1eab253ea834\">，说明特氟龙不粘涂层不会发生分解，可以推出可以用不粘锅来烧开水和煮粥，排除；\nB项：题干中指出高剂量的全氟辛酸铵有可能导致胆固醇水平升高、甲状腺疾病及不育，但是题干中也指出“全氟辛酸铵是特氟龙生产过程中使用的含量极微的一种加工助剂”，因此涂层中的全氟辛酸铵剂量是否达到了能够导致胆固醇水平升高的剂量不明确，同时“高剂量的全氟辛酸铵有可能导致胆固醇水平升高”，也不是一定会导致胆固醇水平升高，无法推出，当选；\nC项：根据题干“如果在炒菜时喜欢把锅烧干、烧红后再加油，锅内温度就容易超过\u003cimg data-k=\"1eab253ea834\">”，可知炒菜时把不粘锅烧干、烧红后再加油会导致锅内温度超过\u003cimg data-k=\"1eab253ea834\">，此时特氟龙不粘涂层会向不稳定状态转变，因此应避免此做法，可以推出炒菜时应避免把不粘锅烧干、烧红后再加油，排除；\nD项：根据题干“正常烹调时，水的沸点是\u003cimg data-k=\"92a92f9896db\">，温度较高的爆炒通常也只是\u003cimg data-k=\"1392500f686a\">左右，即使采用油炸的方式，油温也不会超过\u003cimg data-k=\"ee811da577b4\">”，可知正常烹调不会超过\u003cimg data-k=\"1eab253ea834\">，说明特氟龙不粘涂层不会发生分解，可以推出正常烹调通常无需担心不粘锅释放有害物质，排除。\n本题为选非题，故正确答案为B。","no":75,"missingImage":false},{"type":"question","qid":"3522385","cat":"逻辑判断","stem":"某科学家在一个宇宙科学网站上刊载了一项成果，该成果宣称找到了地球生命来自彗星的“证据”，引发了广泛关注。他声称在一块坠落到斯里兰卡的陨石里找到了微观硅藻化石，该石头有着疏松多孔的结构，密度比在地球上找到的所有东西都低。他推断这是一颗彗星的一部分，并指出样本中找到的微观硅藻化石与恐龙时代留存下来的化石中的微观有机体类似，从而为彗星胚种论提供了强有力的证据。\n以下哪项如果为真，最能反驳该科学家的观点？","options":{"A":"发表该成果的网站缺乏可信性，所载论文良莠不齐，有些曾沦为笑柄","B":"该科学家是彗星胚种论的狂热支持者，曾宣称SARS和流感来自彗星","C":"该成果配图中被标示成“丝状硅藻”的东西实际上只是硅藻细胞断片","D":"该成果根本无法证明该石头是碳质球粒陨石，甚至难以确定其是陨石"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：地球生命来自彗星。\n论据：一块坠落到斯里兰卡的陨石里找到了微观硅藻化石，该石头有着疏松多孔的结构，密度比在地球上找到的所有东西都低。他推断这是一颗彗星的一部分，并指出样本中找到的微观硅藻化石与恐龙时代留存下来的化石中的微观有机体类似，从而为彗星胚种论提供了强有力的证据。\n本题的论据说的是陨石找到的微观硅藻化石与恐龙时代留存下来的化石中的微观有机体类似，同时该研究还推断该陨石是一颗彗星的一部分，即说明该陨石（彗星的一部分）与生命有关系，而论点说的是地球生命来自彗星，所以，二者讨论话题一致，削弱可以考虑削弱论点，也可以考虑削弱论据。\n第二步：逐一分析选项。\nA项：该成果的网站缺乏可信性，所载论文良莠不齐，代表不了这次实验成果的可靠性，属于无关项，排除；\nB项：只是说该科学家是彗星胚种论的狂热支持者，支持者说的话无法辨别真假，同时即便SARS和流感来自彗星，也无法判断生命是否来源于彗星，不明确选项，排除；\nC项：选项是说配图中的东西本质是硅藻细胞断片，一定程度上质疑了题干研究成果的可信性，可能削弱论据，保留；\nD项：该成果根本无法证明该石头是陨石，直接质疑了论据的研究成果，直接削弱论据，保留。\n对比C、D两项：C项为可能削弱论据，D项为直接削弱论据，D项当选。\n故正确答案为D。","no":76,"missingImage":false},{"type":"question","qid":"3523362","cat":"逻辑判断","stem":"某大学研究人员首次用嗜黏蛋白阿克曼氏菌进行小规模人体试验。32名超重或肥胖的志愿者被分为3组，分别每天口服活的嗜黏蛋白阿克曼氏菌、经过巴氏消毒法灭活的这种细菌和安慰剂，同时不改变饮食和运动习惯。结果显示，3个月后服用灭活细菌的志愿者对胰岛素敏感性提高，血浆总胆固醇水平降低。服用安慰剂的志愿者体内上述指标继续恶化。\n由此可以推出：","options":{"A":"服用该灭活菌能改善人体的代谢状况","B":"该菌灭活后降低糖尿病的效果甚至好于活细菌","C":"服用该菌能够降低罹患心血管疾病和糖尿病的风险","D":"肥胖者可以将该灭活菌作为膳食补充剂达到减肥的目的"},"answer":"A","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据试验结果可知，服用该灭活细菌可以降低血浆总胆固醇水平，而服用安慰剂的一组这一指标持续恶化，说明服用该灭活细菌可以改善以上指标，由于血浆总胆固醇水平是人体的代谢指标之一，所以可以合理推出服用该灭活细菌能改善人体的代谢状况，当选；\nB项：在题干的试验结果中，没有对比服用灭活细菌和服用活细菌的试验结果，所以无法得出将这两组进行比较的相关结论，无中生有，排除；\nC项：在题干的试验结果中，只提及了服用灭活细菌和安慰剂之后的结果，并未提及服用“活细菌”之后的结果，所以无法得出服用“该菌（即活细菌）”能够降低罹患心血管疾病和糖尿病的风险，排除；\nD项：在题干的试验结果中，只说明了胰岛素敏感性和血浆总胆固醇水平的相关结果，这两者与“减肥”都没有必然关系，不能合理推出，排除。\n故正确答案为A。\n注：本题题干用“活细菌”、“灭活细菌”、“安慰剂”三者做试验，却只给出“灭活细菌”和“安慰剂”的结果，没有给出“活细菌”的结果，而C项直接说服用“该菌”的结果，属于无中生有，这是本题的坑点所在。\nA选项在相关原文中表述如下图1，通过原文不难发现，文段的主题词是“灭活菌”，而非“活细菌”；另外如下图2所示，选项的用词很讲究，如果想说灭活菌，就会直接表述成“该灭活菌”，而B、C两项的“该菌”，其实就是指“活细菌”，故小粉笔倾向把答案给到A项。\n\u003cimg data-k=\"0de4931ea858\" style=\"max-width:419px\">\u003cimg data-k=\"c63793e2f4b7\" style=\"max-width:442px\">","no":77,"missingImage":false},{"type":"question","qid":"3523364","cat":"逻辑判断","stem":"普通消费者囿于专业弱势群体的地位无从对错误或失真的负面信息进行有效甄别，即便企业努力澄清，但在当前“好事不出门，坏事传千里”的舆论传播环境下，强烈的记
