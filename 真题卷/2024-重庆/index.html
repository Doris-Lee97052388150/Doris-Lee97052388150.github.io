<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2024年重庆市公务员录用考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2024-重庆","title":"2024年重庆市公务员录用考试《行测》题（网友回忆版）","year":"2024","group":"重庆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"16593129","cat":"马克思主义","stem":"习近平新时代中国特色社会主义思想是当代中国马克思主义、21世纪马克思主义。下列对此理解正确的有几项：\n①党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并庄严地写入党章\n②习近平新时代中国特色社会主义思想是马克思主义中国化最新成果，是当今时代最现实、最鲜活的马克思主义\n③今天我们所处的时代同马克思所处的时代相比发生了巨大而深刻的变化，已经脱离了马克思主义所指明的历史时代\n④习近平新时代中国特色社会主义思想，始终把马克思主义作为中国共产党人的“真经”，始终坚持马克思主义基本原理","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查政治常识。\n①正确，中国共产党第十九次全国代表大会，把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并庄严地写入党章，实现了党的指导思想的与时俱进。这是一个历史性决策和历史性贡献，体现了党在政治上理论上的高度成熟、高度自信。\n②正确，习近平新时代中国特色社会主义思想是马克思主义中国化最新成果，是当代中国马克思主义、21世纪马克思主义，是新时代中国共产党的思想旗帜，是实现中华民族伟大复兴的行动指南。习近平马克思主义观是习近平新时代中国特色社会主义思想的理论精髓，是中国共产党马克思主义观演进与升华的最新成果。这一重大思想为发展马克思主义作出了具有鲜明中国风格、中国气派、时代特色、实践品格的原创性贡献，谱写了马克思主义的新篇章，是当今时代最现实、最鲜活的马克思主义。\n③错误，2017年9月29日，习近平总书记在十八届中央政治局第四十三次集体学习时发表重要讲话并明确指出：“尽管我们所处的时代同马克思所处的时代相比发生了巨大而深刻的变化，但从世界社会主义500年的大视野来看，我们依然处在马克思主义所指明的历史时代。” \n④正确，习近平新时代中国特色社会主义思想始终坚持马克思主义基本原理，既坚持把马克思主义作为中国共产党人的“真经”，又坚持把马克思主义基本原理同中国具体实际相结合，同中华优秀传统文化相结合，实现了马克思主义的创造性升华，是当代中国马克思主义。\n故①②④表述正确。\n故正确答案为C。","no":1,"missingImage":false},{"type":"question","qid":"16593128","cat":"新思想","stem":"2023年，《习近平著作选读》第一卷、第二卷出版发行，这是党和国家政治生活中的一件大事。下列著作内容和篇名对应正确的是：","options":{"A":"生态环境是关系党的使命宗旨的重大政治问题，也是关系民生的重大社会问题——《加强生态文明建设必须坚持的原则》","B":"做好新形势下宣传思想工作，必须自觉承担起举旗帜、聚民心、育新人、兴文化、展形象的使命任务——《开展党史学习教育要突出重点》","C":"我们说的共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义——《在全国脱贫攻坚总结表彰大会上的讲话》","D":"“两个维护”要体现在坚决贯彻党中央决策部署的行动上，体现在履职尽责、做好本职工作的实效上，体现在党员、干部的日常言行上——《不断提高政治判断力、政治领悟力、政治执行力》"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，《加强生态文明建设必须坚持的原则》指出，生态环境是关系党的使命宗旨的重大政治问题，也是关系民生的重大社会问题。广大人民群众热切期盼加快提高生态环境质量。我们要积极回应人民群众所想、所盼、所急，大力推进生态文明建设，提供更多优质生态产品，不断满足人民群众日益增长的优美生态环境需要。\nB项错误，《宣传思想工作的使命任务》指出，做好新形势下宣传思想工作，必须自觉承担起举旗帜、聚民心、育新人、兴文化、展形象的使命任务，促进全体人民在理想信念、价值理念、道德观念上紧紧团结在一起，为服务党和国家事业全局作出更大贡献。《开展党史学习教育要突出重点》是习近平同志2021年2月20日在党史学习教育动员大会上讲话的一部分。\nC项错误，《扎实推动共同富裕》指出，共同富裕是社会主义的本质要求，是中国式现代化的重要特征。我们说的共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义。《在全国脱贫攻坚总结表彰大会上的讲话》（2021年2月25日）中指出，我国脱贫攻坚战取得了全面胜利，区域性整体贫困得到解决，完成了消除绝对贫困的艰巨任务，创造了又一个彪炳史册的人间奇迹。\nD项错误，《带头做到“两个维护”，着力推进中央和国家机关党的政治建设》指出，“两个维护”要体现在坚决贯彻党中央决策部署的行动上，体现在履职尽责、做好本职工作的实效上，体现在党员、干部的日常言行上。带头做到“两个维护”，从根本上讲就是要做到对党忠诚，既要体现高度的理性认同、情感认同，又要有坚决的维护定力和能力。《不断提高政治判断力、政治领悟力、政治执行力》是习近平同志2020年12月24日、25日主持中共十九届中央政治局民主生活会时讲话的要点。\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"16593033","cat":"新思想","stem":"党的十八大以来，习近平总书记始终高度重视“三农”工作，把解决好“三农”问题作为全党工作的重中之重。下列关于《中共中央国务院关于做好2023年全面推进乡村振兴重点工作的意见》中的举措，表述正确的是：\n①把永久基本农田全部建成高标准农田\n②树立大食物观，加快构建多元化食物供给体系\n③发展现代设施农业，鼓励地方对设施农业建设给予信贷贴息\n④深化东西部劳务协作，实施防止返贫就业攻坚行动，确保脱贫劳动力就业规模稳定在3000万人以上\n⑤严格耕地占补平衡管理，实行部门联合开展补充耕地验收评定和“市县审核、省级复核、社会监督”机制","options":{"A":"①②③④⑤","B":"①②③④","C":"②③⑤","D":"②③④⑤"},"answer":"D","explanation":"本题考查政治常识。\n2023年2月13日，《中共中央国务院关于做好2023年全面推进乡村振兴重点工作的意见》发布。\n①错误，文件指出：“（七）加强高标准农田建设。完成高标准农田新建和改造提升年度任务，重点补上土壤改良、农田灌排设施等短板，统筹推进高效节水灌溉，健全长效管护机制。制定逐步把永久基本农田全部建成高标准农田的实施方案。”即逐步把永久基本农田全部建成高标准农田，而非2023年把永久基本农田全部建成高标准农田。\n②正确，文件指出：“（四）构建多元化食物供给体系。树立大食物观，加快构建粮经饲统筹、农林牧渔结合、植物动物微生物并举的多元化食物供给体系，分领域制定实施方案。”\n③正确，文件指出：“（三）发展现代设施农业。实施设施农业现代化提升行动。加快发展水稻集中育秧中心和蔬菜集约化育苗中心······鼓励地方对设施农业建设给予信贷贴息。”\n④正确，文件指出：“（十五）增强脱贫地区和脱贫群众内生发展动力······深化东西部劳务协作，实施防止返贫就业攻坚行动，确保脱贫劳动力就业规模稳定在3000万人以上。”\n⑤正确，文件指出：“（六）加强耕地保护和用途管控。严格耕地占补平衡管理，实行部门联合开展补充耕地验收评定和‘市县审核、省级复核、社会监督’机制，确保补充的耕地数量相等、质量相当、产能不降。”\n故②③④⑤表述正确。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"16593290","cat":"时事政治","stem":"2023年是习近平总书记提出共建“一带一路”倡议10周年。10年来，“一带一路””合作从“大写意”进入“工笔画”阶段，实现了从硬联通扩展到软联通的愿景。下列关于“一带一路”的表述正确的有：\n①截止2023年底，已有150多个国家、30多个国际组织签署共建“一带一路”合作文件\n②落地落实了“鲁班工坊”“丝路一家亲”等人文交流项目\n③建成了中老铁路、雅万高铁等一批标志性项目\n④“一带一路”合作从亚欧大陆延伸到非洲和拉美\n⑤现已举办5届“一带一路”国际合作高峰论坛","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"C","explanation":"本题考查政治常识。\n①④正确，⑤错误，习近平主席在第三届“一带一路”国际合作高峰论坛开幕式上的主旨演讲中指出：“‘一带一路’合作从亚欧大陆延伸到非洲和拉美，150多个国家、30多个国际组织签署共建‘一带一路’合作文件，举办3届‘一带一路’国际合作高峰论坛，成立了20多个专业领域多边合作平台。”\n②正确，习近平主席在第三届“一带一路”国际合作高峰论坛开幕式上的主旨演讲中总结10年来取得的丰硕成果时指出：“精彩纷呈的文化年、艺术节、博览会、展览会，独具特色的鲁班工坊、‘丝路一家亲’‘光明行’等人文交流项目，不断深化的民间组织、智库、媒体、青年交流，奏响新时代的丝路乐章。”\n③正确，2023年10月10日，国务院新闻办公室发布《共建“一带一路”：构建人类命运共同体的重大实践》白皮书。其中提到，在“硬联通”方面，中老铁路、雅万高铁、匈塞铁路、比雷埃夫斯港等一批标志性项目陆续建成并投运，中欧班列开辟了亚欧陆路运输新通道，“丝路海运”国际航线网络遍及全球，“六廊六路多国多港”的互联互通架构基本形成。\n故①②③④说法正确，共4项。\n故正确答案为C。","no":4,"missingImage":false},{"type":"question","qid":"16593044","cat":"时事政治","stem":"党的二十大报告提出，在社会基层坚持和发展新时代“枫桥经验”，完善正确处理新形势下人民内部矛盾机制，及时把矛盾纠纷化解在基层、化解在萌芽状态。下列关于新时代“枫桥经验”的表述不正确的是：","options":{"A":"党建引领是新时代“枫桥经验”的政治灵魂","B":"人民主体是新时代“枫桥经验”的核心价值","C":"新时代“枫桥经验”是以制度现代化为优先价值导向的基层治理现代化经验","D":"新时代“枫桥经验”主要内容是变群众上访为领导下访，深入基层，联系群众，真下真访民情，实心实意办事"},"answer":"D","explanation":"本题考查政治常识。\nA项正确，党建引领是新时代“枫桥经验”的政治灵魂，反映了新时代“枫桥经验”的本质特征。\nB项正确，人民主体是新时代“枫桥经验”的核心价值，实现人民的利益是新时代“枫桥经验”的价值导向。\nC项正确，新时代“枫桥经验”是以制度现代化为优先价值导向的基层治理现代化经验。习近平总书记指出，随着互联网特别是移动互联网发展，社会治理模式正在从单向管理转向双向互动，从线下转向线上线下融合，从单纯的政府监管向更加注重社会协同治理转变。中国特色社会主义进入新时代，“枫桥经验”也在信息化、智能化驱动下，在创新发展中插上科技翅膀，注入大数据动力，内涵不断丰富，重点不断调整，形成具有矛盾精准数据化、解决路径最短化、决策依据信息化、态势研判前置化等鲜明特点的新时代“枫桥经验”，但无论其形式如何变迁，“枫桥经验”的本质和内核始终不变。\nD项错误，“枫桥经验”是指上世纪60年代初，诸暨枫桥镇干部群众创造的“发动和依靠群众，坚持矛盾不上交，就地解决，实现捕人少，治安好”的基层社会治理经验。“变群众上访为领导下访，深入基层，联系群众，真下真访民情，实心实意办事”是“浦江经验”的主要内容。\n本题为选非题，故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"16593088","cat":"新思想","stem":"习近平总书记在深入推进长三角一体化发展座谈会上发表了重要讲话，对长三角一体化的下一步发展作出了重要指示。下列关于长三角一体化发展的理解正确的有：\n①长三角区域要加快完善一体化发展体制机制，加大制度和体制机制创新力度\n②长三角区域要积极推进高层次协同开放，推进以商品和要素流动型开放为重点的高水平对外开放\n③长三角区域要加强生态环境共保联治，建立跨区域排污权交易制度，积极稳妥推进碳达峰碳中和\n④长三角区域要着力提升安全发展能力，高度重视对外合作安全，引导产业链合理有序跨境布局\n⑤长三角区域要加强科技创新和产业创新跨区域协同，把电力装备、安全应急装备等战略性新兴产业发展作为重中之重，着力打造世界级先进制造业集群","options":{"A":"①②③","B":"①③④","C":"②③④","D":"①③④⑤"},"answer":"B","explanation":"本题考查政治常识。\n2023年11月30日，中共中央总书记、国家主席、中央军委主席习近平在上海主持召开深入推进长三角一体化发展座谈会并发表重要讲话。\n①正确，习近平指出，长三角区域要加快完善一体化发展体制机制。必须从体制机制上打破地区分割和行政壁垒，为一体化发展提供制度保障。要增强一体化意识，坚持一盘棋思想，加大制度和体制机制创新力度，在重点领域重点区域实现更大突破，加强各项改革举措的系统集成和协同配合，推动一体化向更深层次更宽领域拓展。\n②错误，习近平强调，长三角区域要积极推进高层次协同开放。推进以制度型开放为重点的高水平对外开放，加强改革经验互学互鉴和复制推广，努力成为畅通我国经济大循环的强大引擎和联通国内国际双循环的战略枢纽。\n③正确，习近平指出，长三角区域要加强生态环境共保联治······要建立跨区域排污权交易制度，积极稳妥推进碳达峰碳中和。要规划建设新型能源体系，协同推进省市间电力互济。要持续推进长江“十年禁渔”，加强联合执法。\n④正确，习近平强调，长三角区域要着力提升安全发展能力······要高度重视对外合作安全，引导产业链合理有序跨境布局。要坚持人民城市人民建，提升城市现代化治理水平，加快推进韧性城市建设，健全城市安全预防体系，强化城市基本运行保障体系，提高防灾减灾救灾能力。\n⑤错误，2023年5月，习近平总书记在河北考察并主持召开深入推进京津冀协同发展座谈会时指出，“要巩固壮大实体经济根基，把集成电路、网络安全、生物医药、电力装备、安全应急装备等战略性新兴产业发展作为重中之重，着力打造世界级先进制造业集群”。并非出自深入推进长三角一体化发展座谈会。\n故①③④表述正确。\n故正确答案为B。","no":6,"missingImage":false},{"type":"question","qid":"16592966","cat":"时事政治","stem":"党的十八大以来，以习近平同志为核心的党中央始终把未成年人工作摆在突出位置。2024年1月1日起施行的《未成年人网络保护条例》是我国第一部针对未成年人网络保护的专门性综合立法，是贯彻落实习近平法治思想的生动体现。下列关于该条例内容表述正确的有几项？\n①国家教育部门负责统筹协调未成年人网络保护工作\n②网络产品和服务提供者不得为未成年人提供游戏账号租售服务\n③网络产品和服务提供者不得通过自动化决策方式向未成年人进行商业营销\n④网络直播服务提供者应当建立网络直播发布者真实身份信息动态核验机制\n⑤网络服务提供者可根据实际引导未成年人参与应援集资、投票打榜、刷量控评等网络活动","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"B","explanation":"本题考查法律常识。\n①错误，根据《未成年人网络保护条例》第三条第一款规定：“国家网信部门负责统筹协调未成年人网络保护工作，并依据职责做好未成年人网络保护工作。”\n②正确，根据《未成年人网络保护条例》第四十六条第二款规定：“网络产品和服务提供者不得为未成年人提供游戏账号租售服务。”\n③正确，根据《未成年人网络保护条例》第二十四条第三款规定：“网络产品和服务提供者不得通过自动化决策方式向未成年人进行商业营销。”\n④正确，根据《未成年人网络保护条例》第三十一条第二款规定：“网络直播服务提供者应当建立网络直播发布者真实身份信息动态核验机制，不得向不符合法律规定情形的未成年人用户提供网络直播发布服务。”\n⑤错误，根据《未成年人网络保护条例》第四十五条规定：“网络游戏、网络直播、网络音视频、网络社交等网络服务提供者应当采取措施，防范和抵制流量至上等不良价值倾向，不得设置以应援集资、投票打榜、刷量控评等为主题的网络社区、群组、话题，不得诱导未成年人参与应援集资、投票打榜、刷量控评等网络活动，并预防和制止其用户诱导未成年人实施上述行为。”\n综上，②③④三项内容均表述正确。\n故正确答案为B。","no":7,"missingImage":false},{"type":"question","qid":"16592943","cat":"新思想","stem":"习近平总书记强调，要坚定维护宪法权威和尊严，推动宪法完善和发展，更好发挥宪法在治国理政中的重要作用。下列有关表述正确的有几项：\n①要加强宪法理论研究和宣传教育，坚持知识普及、理论阐释、观念引导全面发力\n②加快完善以宪法为核心的中国特色社会主义法律体系，不断提高宪法实施和监督水平\n③坚持宪法确定的中国共产党领导地位不动摇，坚持宪法确定的人民民主专政的国体和人民代表大会制度的政体不动摇\n④宪法是治国安邦的总章程，是我们党治国理政的根本法律依据，是国家政治和社会生活的最高法律规范","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查政治常识。\n①②③正确，中共中央总书记、国家主席、中央军委主席习近平在第十个国家宪法日到来之际作出重要指示，强调要坚定政治制度自信，坚持宪法确定的中国共产党领导地位不动摇，坚持宪法确定的人民民主专政的国体和人民代表大会制度的政体不动摇。要贯彻新时代中国特色社会主义法治思想，坚持宪法规定、宪法原则、宪法精神全面贯彻，坚持宪法实施、宪法解释、宪法监督系统推进，加快完善以宪法为核心的中国特色社会主义法律体系，不断提高宪法实施和监督水平。要加强宪法理论研究和宣传教育，坚持知识普及、理论阐释、观念引导全面发力，在全社会大力弘扬宪法精神、社会主义法治精神，推动宪法实施成为全体人民的自觉行动。\n④正确，中共中央总书记、国家主席、中央军委主席习近平在第十个国家宪法日到来之际作出重要指示指出，宪法是治国安邦的总章程，是我们党治国理政的根本法律依据，是国家政治和社会生活的最高法律规范。\n综上所述，①②③④均表述正确，共有4项。\n故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"16593085","cat":"时事政治","stem":"在2023年12月召开的中央经济工作会议上，习近平总书记全面总结2023年经济工作，深刻分析当前经济形势，系统部署2024年经济工作。下列关于做好2024年经济工作的要求，表述正确的有：\n①强化宏观政策逆周期和跨周期调节\n②坚持稳中求进、以进促稳、先立后破\n③积极的财政政策要适度加力、提质增效\n④稳健的货币政策要灵活适度、精准有效","options":{"A":"①②","B":"①②③","C":"②③④","D":"①②③④"},"answer":"D","explanation":"本题考查政治常识。\n2023年12月11日至12日，中央经济工作会议在北京举行。\n①②正确，会议要求，明年要坚持稳中求进、以进促稳、先立后破，多出有利于稳预期、稳增长、稳就业的政策，在转方式、调结构、提质量、增效益上积极进取，不断巩固稳中向好的基础。要强化宏观政策逆周期和跨周期调节，继续实施积极的财政政策和稳健的货币政策，加强政策工具创新和协调配合。\n③正确，会议要求，积极的财政政策要适度加力、提质增效。要用好财政政策空间，提高资金效益和政策效果。优化财政支出结构，强化国家重大战略任务财力保障。合理扩大地方政府专项债券用作资本金范围。落实好结构性减税降费政策，重点支持科技创新和制造业发展。严格转移支付资金监管，严肃财经纪律。增强财政可持续性，兜牢基层“三保”底线。严控一般性支出。党政机关要习惯过紧日子。\n④正确，会议要求，稳健的货币政策要灵活适度、精准有效。保持流动性合理充裕，社会融资规模、货币供应量同经济增长和价格水平预期目标相匹配。发挥好货币政策工具总量和结构双重功能，盘活存量、提升效能，引导金融机构加大对科技创新、绿色转型、普惠小微、数字经济等方面的支持力度。促进社会综合融资成本稳中有降。保持人民币汇率在合理均衡水平上的基本稳定。\n综上所述，①②③④均表述正确。\n故正确答案为D。","no":9,"missingImage":false}],"count":9,"answerable":9,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"16593034","cat":"经济常识","stem":"根据中共中央、国务院2023年3月印发的《党和国家机构改革方案》，下列关于本次改革方案的表述错误的是：","options":{"A":"证券业之外的金融业监管由国家金融监督管理总局统一负责","B":"统筹数字资源整合共享和开发利用，是国家数据局的职责之一","C":"在农业农村部加挂国家乡村振兴局牌子，不再保留单设的国家乡村振兴局","D":"将工业和信息化部的国家高新技术产业开发区等科技园区建设职责划入科学技术部"},"answer":"D","explanation":"本题考查政治常识。\nA项正确，《党和国家机构改革方案》指出：“（八）组建国家金融监督管理总局。统一负责除证券业之外的金融业监管，强化机构监管、行为监管、功能监管、穿透式监管、持续监管，统筹负责金融消费者权益保护，加强风险管理和防范处置，依法查处违法违规行为，作为国务院直属机构······”\nB项正确，《党和国家机构改革方案》指出：“（十四）组建国家数据局。负责协调推进数据基础制度建设，统筹数据资源整合共享和开发利用，统筹推进数字中国、数字经济、数字社会规划和建设等，由国家发展和改革委员会管理······”\nC项正确，《党和国家机构改革方案》指出：“（十五）优化农业农村部职责。为统筹抓好以乡村振兴为重心的‘三农’各项工作······推动农村社会事业和公共服务发展等职责划入农业农村部，在农业农村部加挂国家乡村振兴局牌子。全国脱贫攻坚目标任务完成后的过渡期内，有关帮扶政策、财政支持、项目安排保持总体稳定，资金项目相对独立运行管理。不再保留单设的国家乡村振兴局。”\nD项错误，《党和国家机构改革方案》指出“（七）重新组建科学技术部······将科学技术部的组织拟订高新技术发展及产业化规划和政策，指导国家自主创新示范区、国家高新技术产业开发区等科技园区建设，指导科技服务业、技术市场、科技中介组织发展等职责划入工业和信息化部······”\n本题为选非题，故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"16593076","cat":"人文常识","stem":"《礼记·曲礼》有言：“男子二十冠而字。”古人名与字的含义通常有一定关联，或相同相近，或相关相辅，或相反相成，下列历史人物名与字的对应关系与其他三项不同的是：","options":{"A":"曹丕，字子桓","B":"周瑜，字公瑾","C":"杜甫，字子美","D":"朱熹，字元晦"},"answer":"D","explanation":"本题考查人文常识。\n“古者，名以正体，字以表德。”古人不但有名，而且有字。《礼记·曲礼》上说：“男子二十冠而字”，意思是说男子到20岁行冠礼、取字。且古人取表字十分讲究，一般和自己的名字有关联，有这样几种取字方法：①表字和名意义相同，又叫“并列式”；②表字和名意思相近，但不完全相同，可以互为辅助，称作“辅助式”；③表字和名意思正相反，这种情况可称为“矛盾式”。\nA项正确，曹丕，字子桓。“丕”字在《说文解字》里意为“大”，“桓”的意思取大，与“丕”的意思一致。名和字意义相同。\nB项正确，周瑜，字公瑾。“瑜”和“瑾”均出自《楚辞·九章·怀沙》，原文为“怀瑾握瑜兮，穷不知所示。”故“瑜”和“瑾”均意指美玉。名和字意义相同。\nC项正确，杜甫，字子美。“甫”是古代美男子的称呼；“美”是男人长得好看的意思。名和字意义相同。\nD项错误，朱熹，字元晦。“熹”为明亮之意，而“晦”则是昏暗的意思。名与字意义相反，与其他三项不同。\n本题为选非题，故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"16593234","cat":"人文常识","stem":"下列诗句中涉及的典故人物与其时代对应说法不正确的一项是：","options":{"A":"林暗草惊风，将军夜引弓。平明寻白羽，没在石棱中——西汉","B":"闲来垂钓碧溪上，忽复乘舟梦日边——先秦","C":"怀旧空吟闻笛赋，到乡翻似烂柯人——东汉","D":"求田问舍，怕应羞见，刘郎才气——三国"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“林暗草惊风，将军夜引弓。平明寻白羽，没在石棱中。”出自唐代卢纶的《和张仆射塞下曲六首·其二》。意思是树林幽暗，突来的疾风使草木惊倒纷披，将军以为有虎，黑夜里拉弓射箭。天亮时去寻找那支白羽毛的箭，箭头已深埋在石头里。这里的将军指西汉飞将军李广猎虎的故事，取材于西汉史学家司马迁记载李广事迹的《李将军列传》。\nB项正确，“闲来垂钓碧溪上，忽复乘舟梦日边。”出自唐代李白的《行路难·其一》。意思是像姜太公吕尚垂钓溪，闲待东山再起；又像伊尹做梦，乘船经过日边。引用吕尚、伊尹的历史典故，时间对应先秦，即秦朝之前。\nC项错误，“怀旧空吟闻笛赋，到乡翻似烂柯人。”出自唐代刘禹锡的《酬乐天扬州初逢席上见赠》。意思是怀念故去旧友徒然吟诵闻笛小赋，久谪归来感到已非旧时光景。“闻笛赋”指西晋向秀的《思旧赋》，刘禹锡借用这个典故怀念已死去的王叔文、柳宗元等人。\nD项正确，“求田问舍，怕应羞见，刘郎才气。”出自宋代辛弃疾的《水龙吟·登建康赏心亭》。意思是像只为自己购置田地房产的许汜，应怕惭愧去见，才气双全的刘备。此句用许汜与陈登的典故，时间对应东汉末年至三国时期。\n本题为选非题，故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"16593017","cat":"人文常识","stem":"戏曲是中华优秀传统文化的重要组成部分，下列有关说法错误的是：","options":{"A":"京剧、豫剧、评剧、黄梅戏、越剧是中国戏剧五大剧种","B":"《群英会》是依据《水浒传》改编的传统京剧","C":"黄梅戏代表剧目中有《天仙配》和《女驸马》","D":"豫剧与梆子腔关系紧密"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，中国戏曲剧种种类繁多，其中“京剧、豫剧、评剧、黄梅戏、越剧”为五大戏曲剧种。京剧在清光绪年间形成于北京，现已成为中国影响最大、最具有代表性的一个剧种。豫剧也称河南梆子、河南高调，形成于清朝初年，至今已有300多年历史，是洛阳、河南的主要剧种，在国内外影响仅次于京剧。评剧是我国北方地区的一种地方戏，在华北、东北及其他一些地区流行很广，是广大人民所喜闻乐见的剧种之一。黄梅戏起源于湖北黄梅，是安徽省的主要地方戏曲剧种，是十八世纪后期在皖、鄂、赣三省毗邻地区形成的一种民间小戏。评剧原名“平腔梆子戏”，俗称“唐山落子”，“蹦蹦戏”。越剧，是以嵊县一带的民间说唱艺术“落地唱书”为基础，并在余姚鹦歌（秧歌）和湖州滩簧的影响下发展形成的。\nB项错误，京剧以历史故事为主要演出内容，传统剧目约有一千三百多个，常演的在三四百个以上，其中《群英会》等剧目家喻户晓，为广大观众所熟知。《群英会》是依据《三国演义》第45回改编的传统京剧，故事叙述：曹操谋士蒋干，与周瑜故交，请求过江劝降。周瑜将计就计，盛会隆重宴请诸将和挚友，号称“群英会”。\nC项正确，黄梅戏中有许多为人熟知的优秀剧目，代表剧目中有《天仙配》和《女驸马》。《天仙配》讲述了七仙女不顾天规，私自下凡与董永结为伉俪，憧憬美好生活，最终被玉帝生生拆散的爱情故事。《女驸马》讲述了民女冯素珍冒死救夫，经历了种种曲折，终于如愿以偿，成就了美满姻缘的故事。\nD项正确，豫剧因早期演员用本嗓演唱，起腔与收腔时用假声翻高尾音带“讴”，又叫“河南讴”。豫剧在声腔上属梆子腔系。豫剧划分主要有五大流派：以开封为中心的唱法称“祥符调”；以商丘为中心的唱法称“豫东调”，又称“东路调”；以洛阳为中心流传的唱法称为“豫西调”，又称“西府调”；流行于豫东南的称“沙河调”，又叫“本地梆”；建国后，在杨兰春等的领导下，对豫剧四大地域流派唱腔进行了综合吸收和大幅改革，运用科学的发音，融入了歌剧元素，形成了“现代流派”，又称“现代戏流派”。\n本题为选非题，故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"16593127","cat":"人文常识","stem":"下列选项描述的历史场景与时代不符的是：","options":{"A":"唐玄宗时期，百姓可以在祠堂祭拜祖先","B":"南宋时期，人们可以到商业街购买东西","C":"永乐年间，大部分州县由粮长负责征解税粮","D":"道光年间，福建、广东等地的百姓可以用银元完纳钱粮"},"answer":"A","explanation":"本题考查人文常识。\nA项错误，祠堂是供奉与祭祀祖先或先贤的场所。“祠堂”一名最早出现于汉代，从秦汉到北宋，有资格建祠堂的不是王公贵族，就是士大夫官员，民间不得立祠。南宋时，理学家朱熹著《家礼》立祠堂之制，创制祠堂以敬祖，民间祠堂已有所发展。故在唐玄宗时期，百姓不可以在祠堂祭拜祖先。\nB项正确，南宋时期，商品经济空前繁荣，越来越多的商人在街道两旁开设店铺，商品种类众多，因此带动了商业街的发展，其中最为著名的就是南宋御街。故在南宋时期，人们可以到商业街购买东西。\nC项正确，粮长制，始创于洪武四年，是中国明代在各州县设置的由粮长负责征解税粮的制度。粮长的主要任务是负责本区的田粮催征、经收、解运诸事宜，后来其职权范围也有所扩大，行使拟订田赋科则、编造鱼鳞图册、检举流人户等职责。嘉靖后，实行一条鞭法，裁粮归里，粮长的职责由里长担任。洪武为明朝开国国君朱元璋的年号，永乐是明朝第三个皇帝朱棣的年号。故永乐年间，大部分州县由粮长负责征解税粮。\nD项正确，银元大约在明万历年间流入中国；乾隆年间，清政府首次在西藏铸行“乾隆宝藏”银币；道光年间，台湾、福建、广东等地也曾仿制银元，称为银饼；光绪年间，清廷开始正式铸造银元“光绪元宝”（即龙洋），各省纷纷效仿铸造。故道光年间，福建、广东等地的百姓可以用银元完纳钱粮。\n本题为选非题，故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"16593019","cat":"经济常识","stem":"下列关于贷款市场报价利率（LPR）说法错误的是：","options":{"A":"目前LPR只有1年期和5年期以上两个期限品种","B":"当LPR下降后，商业性个人住房贷款的最新一期月供也会下降","C":"LPR是由中国人民银行授权全国银行间同业拆借中心计算并公布的基础性的贷款参考利率","D":"新发放的商业性个人住房贷款利率是以最近一个月相应期限的贷款市场报价利率为定价基准加点形成"},"answer":"B","explanation":"本题考查经济常识。\nA项正确，LPR即贷款市场报价利率，为银行贷款提供定价参考。目前，LPR包括1年期和5年期以上两个品种。中国人民银行授权全国银行间同业拆借中心公布，2024年2月20日贷款市场报价利率（LPR）为：1年期LPR为3.45%，5年期以上LPR为3.95%。以上LPR在下一次发布LPR之前有效。\nB项错误，LPR下降房贷月供不一定会下降。如果贷款人选择的是固定利率，房贷月供不受LPR调整的影响。如果贷款人选择的是浮动利率，当LPR下降，也不会马上对房贷月供产生影响，而是要等到下一个重定价日，再根据当时最近一个月的LPR进行重新定价。房贷利率重定价日一般是次年的1月1日。\nC项正确，贷款市场报价利率（LPR）是指由各报价行根据其对最优质客户执行的贷款利率，按照公开市场操作利率加点形成的方式报价，由中国人民银行授权全国银行间同业拆借中心计算并公布的基础性的贷款参考利率。各银行实际发放的贷款利率可根据借款人的信用情况，考虑抵押、期限、利率浮动方式和类型等要素，在贷款市场报价利率基础上加减点确定。\nD项正确，中国人民银行2019年8月25日发布公告称，自2019年10月8日起，新发放商业性个人住房贷款利率以最近一个月相应期限的贷款市场报价利率（LPR）为定价基准加点形成。定价基准转换后，全国范围内新发放首套个人住房贷款利率不得低于相应期限LPR（按2019年8月20日5年期以上LPR为4.85%）；二套个人住房贷款利率不得低于相应期限LPR加60个基点（按2019年8月20日5年期以上LPR计算为5.45%），与当前我国个人住房贷款实际最低利率水平基本相当。\n本题为选非题，故正确答案为B。","no":15,"missingImage":false},{"type":"question","qid":"16593122","cat":"经济常识","stem":"下列所描述现象与相关专业术语对应正确的是：","options":{"A":"某商品的价格越高，其需求量越大——价值悖论","B":"工资率随劳动供求的变动而及时迅速地变动——工资粘性","C":"人们倾向于将从小样本中得到的结论错误地移植到大样本中——小数定律","D":"在完全竞争的市场上，相同交易产品经过汇率调整后，在世界范围内其交易成本是相同的——一价定律"},"answer":"D","explanation":"本题考查经济常识。\nA项错误，价值悖论，也被称为钻石与水悖论，是亚当·斯密在《国富论》中提出的一个观点。这个观点指出了物品的使用价值与交换价值之间存在一个反差，即使用价值大的物品（如水）的交换价值却很小，而交换价值大的物品（如钻石）的使用价值却很小。凡勃伦效应是指消费者对一种商品需求的程度因其标价较高而不是较低而增加，如价格昂贵的手表、钢琴等，往往也能在市场上走俏。消费者购买这类商品不仅仅是为了获得直接的物质满足和享受，更大程度上是为了获得心理上的满足。\nB项错误，工资粘性或工资黏性指工资率不能随劳动供求的变动而及时迅速地变动。20世纪70年代后半期至80年代，早期的新凯恩斯主义者以长期劳动合同的形式引入了名义工资粘性。在发达的经济中，工资不是在即时交易中决定的，而是由劳资双方以明确（或隐含）的合同确定的。在合同期限内，劳动者必须按照根据他预期的价格水平而计算出来的工资提供劳动，即使在此期间实际的价格水平有所变动，劳资双方也必须遵守合同中规定的工资水平。\nC项错误，小数定律又称小数定理，是阿莫斯·特沃斯基和丹尼尔·卡纳曼在其研究中对“赌徒谬误”的总结。小数定律是指把从大样本中得到的结论错误地移植到小样本中的倾向。如“赌博者谬误”：许多人都经常预期一个随机赌局的第二轮会得到与第一轮相反的结果，如果一项投硬币游戏前若干轮出现太多的“头像”，那么许多参与者确信下一轮便应该是“文字”了，而实际上，每一轮在统计上都是独立的。\nD项正确，一价定律是绝对购买力平价理论的一种表现形式，它是由货币学派的代表人物弗里德曼提出的。一价定律可简单地表述为：当贸易开放且交易费用为零时，同样的货物无论在何地销售，用同一货币来表示的货物价格都相同。这揭示了国内商品价格和汇率之间的一个基本联系。在完全竞争的市场上，相同的交易产品或金融资产经过汇率调整后，在世界范围内其交易成本一定是相等的。\n故正确答案为D。","no":16,"missingImage":false},{"type":"question","qid":"16593047","cat":"人文常识","stem":"2022年7月，美国宇航局（NASA）公布韦伯太空望远镜（JWST）拍摄的遥远气态星云一颗新生恒星的照片，其边缘区域的下半部尘埃和上半部气体形成的明显分界线，被天文学家称为“宇宙悬崖”。那么下列哪项最可能是“宇宙悬崖”的形成原因？","options":{"A":"由天体内力作用，产生断层","B":"受重力作用，因滑坡或坍塌造成","C":"受流水及重力作用，沿断层节理面形成","D":"由新生恒星强烈的紫外线辐射侵蚀而成"},"answer":"D","explanation":"本题考查地理国情。\nA项错误，内力作用指由地球内部的能，主要是放射热能、重力能、地球旋转能、地球内的化学能等所引起的地质作用。断层是地壳受力发生断裂，沿断裂面两侧岩块发生的显著相对位移的构造。与题干无关。\nB项错误，重力地质作用又称“负荷地质作用”或“斜坡重力地质作用”，是指在重力作用下，地表物体具有向低处移动的能力。主要影响是发生滑坡、倒石堆、雪崩等。与题干无关。\nC项错误，海蚀崖是指其基岩海岸受海蚀及重力崩落作用，常沿断层节理或层理面形成的陡壁悬崖。与题干无关。\nD项正确，从公布照片上看，“宇宙悬崖”像一座映照在月光下崎岖的山脉，是位于船底座星云西北角的一个名为NGC 3324的年轻的恒星形成区的边缘，距离我们大约7600光年。所谓的山脉，有些高达7光年高，散布着在红外光下成像的闪闪发光的年轻恒星。强烈的紫外线辐射和来自位于该区域上方的极大质量、炽热的年轻恒星的恒星风从星云中雕刻出一个海绵状区域。来自这些恒星的炽热紫外线辐射正在通过缓慢侵蚀星云的壁来雕刻它。\n故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"16593016","cat":"地理国情","stem":"气候效应指因条件变化造成区域水分、热量等要素发生相应变化的现象，常用现象或效果命名，如热岛效应即一个地区的气温高于周围地区，如同低温的大海包围着高温的岛屿。梨果仙人掌，原产于中美洲墨西哥，适应空气干燥、水分蒸发强烈、土地干旱等热带性质的生长环境，却在我国亚热带横断山脉的干热河谷内大量野生繁衍，由此判断影响该河谷的气候效应是：","options":{"A":"狭管效应","B":"温室效应","C":"阳伞效应","D":"焚风效应"},"answer":"D","explanation":"本题考查地理国情。\nA项错误，“狭管作用”是指当气流由开阔地带流入地形构成的峡谷时，由于空气质量不能大量堆积，于是加速流过峡谷，风速增大。当流出峡谷时，空气流速又会减缓。这种地形峡谷对气流的影响称为“狭管效应”。由狭管效应而增大的风，称为峡谷风或穿堂风。\nB项错误，“温室效应”是指透射阳光的密闭空间由于与外界缺乏热交换而形成的保温效应。太阳短波辐射可以透过大气射入地面，而地面增暖后放出的长波辐射却被大气中的二氧化碳等物质所吸收，从而产生大气变暖的效应。\nC项错误，“阳伞效应”是指由大气污染物对太阳辐射的削弱作用而引起的地面冷却效应。大气中尘埃等物质大量增加，使大气中的气溶胶物质增多，大气的反射、散射和吸收作用加强，削弱了太阳辐射，从而使地球气温下降，就像是一把太阳伞一样遮挡住了太阳，影响了地面气温变化。\nD项正确，“焚风效应”是指在山地或峡谷等地形特殊的区域，由于地形造成的气流压缩和加热，导致该区域的气温升高、干燥以及风速增大的现象。焚风是由于空气作绝热下沉运动时，因温度升高湿度降低而形成的一种干热风。它是山区特有的天气现象。在我国亚热带横断山脉的干热河谷内，由于地形的特殊性，会形成一种焚风效应，导致气流在山后的温度比山前同高度上的温度高得多、湿度也显著减少，使得该河谷的气温较高、水分蒸发强烈、土地干旱，符合梨果仙人掌适应的热带性质生长环境。\n故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"16593079","cat":"科技常识","stem":"酶是具有高度特异性和高度催化效能的生物催化剂，在人类的生产生活中具有重要的应用。以下有关酶的添加应用对应错误的是（    ）。","options":{"A":"白酒——淀粉酶","B":"果汁——纤维素酶","C":"脱脂奶——乳糖酶","D":"加酶洗衣粉——蛋白酶"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，淀粉酶是水解淀粉和糖原的酶类总称，通常通过淀粉酶催化水解织物上的淀粉浆料。淀粉酶可以用作果汁加工中的淀粉分解和提高过滤速度以及蔬菜加工、糖浆制造、葡萄糖等加工制造。在白酒酿酒过程中，以淀粉为原料酿酒，需经过两个主要过程，一是淀粉糖化过程；二是酒精发酵过程。淀粉吸水膨胀，加热糊化，形成结构疏松的淀粉，在淀粉酶的作用下分解为低分子的单糖；单糖在脱羧酶、脱氢酶的催化下分解，逐渐分解形成二氧化碳和酒精。\nB项正确，纤维素酶是一类能够降解纤维素的酶，其主要作用是水解果汁中的纤维素成分，使其分解成可溶性物质。水果中含有纤维素、果胶等大分子物质，在榨汁时，这些物质会影响出汁率并使榨出的果汁浑浊，易出现沉淀。添加纤维素酶、果胶酶可以将果胶、纤维素分解成小分子的可溶性的物质，从而提高出汁率并使果汁饮料澄清。\nC项错误，乳糖酶是人体中的一种消化酶，是以母乳、奶粉为主要营养来源的婴幼儿体内最重要的消化酶，乳糖酶的主要功能是消化乳糖，将乳糖水解成能够被人体吸收的半乳糖和葡萄糖。乳糖酶主要用于乳品工业，可使低甜度和低溶解度的乳糖转变为较甜的、溶解度较大的单糖，还可使冰淇淋、浓缩乳、淡炼乳中乳糖结晶析出的可能性降低，同时增加甜度。脱脂奶主要通过离心分离将牛奶中的脂肪和非脂肪部分分离而获得。二者并无直接关联。\nD项正确，加酶洗衣粉中添加了多种酶制剂，如碱性蛋白酶制剂和碱性脂肪酶制剂等。这些酶制剂不仅可以有效地清除衣物上的污渍，而且对人体没有毒害作用，并且这些酶制剂及其分解产物能够被微生物分解，不会污染环境。\n本题为选非题，故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"16593236","cat":"科技常识","stem":"下列病毒与其主要感染的人体系统对应正确的是：","options":{"A":"狂犬病毒——免疫系统","B":"流感病毒——神经系统","C":"乙肝病毒——消化系统","D":"艾滋病毒——生殖系统"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，狂犬病毒主要感染神经系统。人类被携带狂犬病毒的动物咬伤后，狂犬病毒会从伤口处进入人体，但并不会马上侵染神经元，而是在肌肉内停留一段时间，这就是潜伏期。潜伏期之后，狂犬病毒会经过运动神经和骨骼肌之间的连接，进入神经系统，一旦狂犬病毒开始侵染神经系统，便会在神经元之间高速运输，神经系统会受到致命的破坏。狂犬病毒主要是通过动物咬抓伤传播。\nB项错误，流感病毒是一种影响上呼吸道和下呼吸道的传染性病毒性疾病，主要感染呼吸系统，通过空气飞沫传播。\nC项正确，乙肝病毒主要感染消化系统。乙肝病毒主要感染身体中的肝脏部位，可能会造成肝功能损伤，肝脏属于消化系统。乙肝的传播方式主要是血液传播、性传播和母婴传播。\nD项错误，艾滋病毒主要感染免疫系统。艾滋病毒会攻击并逐渐破坏人类的免疫系统，致使宿主在被感染时得不到保护。感染人类免疫缺陷病毒并且去世的人，往往死于继发感染或者癌症。艾滋病毒主要是血液传播、性传播和母婴传播。\n故正确答案为C。","no":20,"missingImage":false}],"count":11,"answerable":11,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"16593246","cat":"逻辑填空","stem":"数字社会中，用户已经离不开各种必须的应用软件，一些应用软件虽然是在用户知情的前提下收集用户个人信息，但很多时候用户都是被逼无奈地同意。比如，下载App后，要么同意其收集自己的个人信息，要么放弃注册使用。这种貌似        的“二选一”，实际上是通过霸王条款限制了用户的选择自由。\n填入划横线部分最恰当的一项是：","options":{"A":"均等","B":"自由","C":"恰当","D":"公平"},"answer":"B","explanation":"根据“貌似······实际上······”可知，转折前后语义相反，再根据转折后“通过霸王条款限制了用户的选择自由”可知，转折前应体现随意选择、自由选择之意。B项“自由”指由自己作主，不受限制和约束，符合文意，当选。\nA项“均等”指相等，C项“恰当”指合适，妥当，D项“公平”指公正，不偏不倚，均与文段语境不符，排除。\n故正确答案为B。\n【文段出处】光明日报《严打非法“采挖” 保护个人信息安全》","no":21,"missingImage":false},{"type":"question","qid":"16593293","cat":"逻辑填空","stem":"鸿雁南飞、菊花盛开之时，文人墨客秋思绵延，绘就一幅幅绚丽多姿的晚秋画卷。卢纶笔下的寒露是“数派清泉黄菊盛，一林寒露紫梨繁”，一派明艳繁茂；王安石眼中却是“空庭得秋长漫漫，寒露入暮愁衣单”，满眼的寂寥惆怅；元稹诗里描绘“寒露惊秋晚，朝看菊渐黄。千家风扫叶，万里雁随阳”，充盈着            。\n依次填入划横线部分最恰当的一项是：","options":{"A":"恬淡之意","B":"肃杀之气","C":"离愁之情","D":"清丽之美"},"answer":"B","explanation":"横线处所填词语对应元稹的诗句，诗中“寒露惊秋晚，朝看菊渐黄。千家风扫叶，万里雁随阳”所描绘的是“深秋寒露时节，菊花渐黄，秋风吹起，留下满地落叶，大雁随着太阳的方向南飞”的景象，故横线处所填词语应表达深秋时节，菊花渐黄，风吹落叶的萧瑟景象，B项“肃杀之气”形容秋冬天气寒冷，草木凋落，置于此处可体现秋风萧瑟、树叶凋零的秋日景色，符合文意，当选。\nA项“恬淡之意”指心境平静、淡泊名利，C项“离愁之情”指离别的愁苦、思念，D项“清丽之美”指清新明亮、优雅美丽，均无法对应元稹诗句中秋天的景色，不符合文意，排除。\n故正确答案为B。\n【文段出处】光明日报《寒露：秋寒渐起 秋粮入库》","no":22,"missingImage":false},{"type":"question","qid":"16593259","cat":"逻辑填空","stem":"镜像神经元是大脑中一种具有特别能力的神经元，它是人类“代入感”及“同理心”的生物基础。它就像一面镜子，让我们能反映和模仿他人行为，产生“感同身受”的体验。而天生发达的镜像神经元也是泪点低的原因之一。比如，看到别人吃东西，自己也会流口水；看见他人发怒，自己头皮也会发紧；别人情绪低落，自己内心也不好受······所以，一听到悲情故事就止不住落泪的人，不是太脆弱、        ，而可能是镜像神经元太发达。\n填入画横线部分最恰当的一项是：","options":{"A":"敏捷","B":"敏感","C":"灵敏","D":"敏锐"},"answer":"B","explanation":"横线处由顿号引导，与“脆弱”构成同义并列，且根据“天生发达的镜像神经元也是泪点低的原因之一······一听到悲情故事就止不住落泪的人”及“而可能是镜像神经元太发达”可知，横线处所填词语应体现对事物敏感、不坚强之意，B项“敏感”指生理上或心理上对外界事物反应很快，不坚强，符合文意，当选。\nA项“敏捷”指（动作、思路等）迅速而灵敏，与文意不符，排除；C项“灵敏”指对极其微弱的刺激能迅速地做出反应来，侧重反应快，D项“敏锐”指（感觉）灵敏或（眼光）尖锐，侧重反应快或头脑灵活，均与文意不符，排除。\n故正确答案为B。\n【文段出处】沈阳晚报《泪失禁体质可能是大脑太发达》","no":23,"missingImage":false},{"type":"question","qid":"16593125","cat":"逻辑填空","stem":"音乐诗画《听此青绿——乐咏千里江山》以十三幅        图景展现传世名画《千里江山图》中的景观和风情，借鉴《高山流水》《渔舟唱晚》《梅花三弄》等古曲的艺术表达，融合编钟、箜篌、筑等民族乐器和西洋铜管乐，加入绘画、书法、意境化舞蹈等表现方式，为千山万壑、江河交错的盛景注入        而深邃、浑厚而轻盈的悠远神韵。\n依次填入划横线部分最恰当的一项是：","options":{"A":"壮丽 磅礴","B":"华丽 壮阔","C":"宏伟 清雅","D":"绮丽 恢宏"},"answer":"A","explanation":"第一空，搭配“图景”，且根据“十三幅······图景”“传世名画《千里江山图》”可知，横线处所填词语需体现图景的恢宏壮阔。A项“壮丽”指宏伟瑰丽、雄壮美丽，C项“宏伟”指雄伟而宽大，均符合文意，保留。B项“华丽”指美丽而有光彩，常搭配衣着、语言，侧重于华美，与文意不符，排除；D项“绮丽”指鲜艳美丽，侧重于颜色鲜艳，但文段并非单指图画颜色鲜艳，与文意不符，排除。\n第二空，横线处所填词语对应“千山万壑、江河交错的盛景”，A项“磅礴”形容气势盛大，广大无边，可以用来形容前文描述的盛大的场面，符合文意，当选。C项“清雅”指清新秀雅，与文意不符，排除。\n另外，本题也可从整体语境入手，把握两空之间的关系。本题两空所填词语都是在修饰《千里江山图》所展示出的雄浑壮阔的图景，所以两空所填词语语义相近，A项“壮丽”和“磅礴”都有宏大壮阔的意思，近义关系最为明显，符合文意，当选。而其他三项所设的两个词语均不如A项对应明显，排除。\n故正确答案为A。\n【文段出处】中国新闻网《“听”千里江山，东西方乐器共同奏响音乐诗画&lt;听此青绿&gt;》","no":24,"missingImage":false},{"type":"question","qid":"16593231","cat":"逻辑填空","stem":"20世纪下半叶兴起的信息通信技术等高新科技，有两个明显特征：一是与每个人的日常生活            ，无人能须臾脱离高新科技的影响；二是高新科技发展速度        ，科技风险随之增加且难以预测。科技创新活动一旦脱靶，将造成不可逆的负面影响甚至巨大灾难。为此，需努力控制科技伦理问题的出现，避免被动治理局面。\n依次填入画横线部分最恰当的一项是：","options":{"A":"休戚与共 惊人","B":"如影随形 迅速","C":"息息相关 迅猛","D":"一脉相连 飞快"},"answer":"C","explanation":"第一空，根据后文“无人能须臾脱离高新科技的影响”可知，横线处所填内容需体现出科技与人们日常生活联系非常紧密的语义，B项“如影随形”形容关系密切不可分离，C项“息息相关”形容关系密切，均符合文意，保留。A项“休戚与共”指共同承受幸福与灾祸，文段未提及幸福与灾祸等利害关系，排除；D项“一脉相连”指从同一血统、派别世代相承流传下来，文段未提及“世代相承”，排除。\n第二空，横线处搭配“发展速度”，C项“迅猛”指迅速而猛烈，与“发展速度”搭配恰当，当选。B项“迅速”与“速度”搭配不当，排除。\n故正确答案为C。\n【文段出处】论述百练：科技伦理治理","no":25,"missingImage":false},{"type":"question","qid":"16593257","cat":"逻辑填空","stem":"从遏制“舌尖上的浪费”，到刹住“车轮上的腐败”，再到        “会所里的歪风”；从多措并举遏制“天价月饼”“天价烟酒”，到厉行节约、反对浪费成为社会新风尚，再到婚事新办、丧事简办被越来越多人接受······党风政风        社风民风，人民群众成了作风建设的参与者和受益者。\n依次填入画横线部分最恰当的一项是：","options":{"A":"取缔 指引","B":"遏止 引导","C":"整治 引领","D":"整顿 指点"},"answer":"C","explanation":"第一空，搭配“会所里的歪风”，根据“从遏制‘舌尖上的浪费’，到刹住‘车轮上的腐败’，再到······”可知，横线处所填词语应与“遏制”“刹住”语义相近，C项“整治”指整顿、治理，D项“整顿”指使紊乱的变为整齐，不健全的健全起来（多指纪律、作风等），均符合文意，保留。A项“取缔”指明令取消、关闭，禁止，多搭配“场所”“作坊”等，与“会所里的歪风”搭配不当，排除；B项“遏止”指阻止，多搭配“行为”“发展趋势”等，与“会所里的歪风”搭配不当，排除。\n第二空，结合文意可知，横线处应体现“党风政风”与“社风民风”之间的关系，C项“引领”指引导带领，填入文段可体现出“党风政风”对“社风民风”的带动之意，当选。D项“指点”意思是指示，点明，多搭配人，与前后文搭配不当，排除。\n故正确答案为C。\n【文段出处】云南网《党员干部要时刻整理“廉洁清单”》","no":26,"missingImage":false},{"type":"question","qid":"16593263","cat":"逻辑填空","stem":"腾冲地震台主要采取的是监测火山地震、地表变形、火山气体这三类手段。这也是世界范围内在火山监测中应用最多的传统“地基”监测手段。不过，如果仅依赖“地基”手段，由于监测点位        、范围小、成本高、效率低等问题，无法实现整个火山区的大范围场式监测，难以为火山活动        及危险性评估提供全面、准确的信息保障。\n依次填入画横线部分最恰当的一项是：","options":{"A":"稀少 形态","B":"稀疏 状态","C":"稀奇 状况","D":"稀零 形状"},"answer":"B","explanation":"第一空，搭配“监测点位”，且根据后文“无法实现整个火山区的大范围场式监测”可知，横线处所填词语需体现监测点位较少，不足以覆盖整个火山区之意，A项“稀少”指事物存在或出现得少、B项“稀疏”指间隔远，不稠密、D项“稀零”形容稀疏的样子，均符合文意，保留。C项“稀奇”意为稀少而奇特，文段并未体现监测点位的奇特，与文意不符，排除。\n第二空，搭配“火山活动”，由横线后内容“难以为火山活动······提供全面、准确的信息保障”可知，横线处需体现火山活动涉及方面较多，仅依赖三种“地基”手段无法全面掌握，B项“状态”指物质系统所处的状况，用于此处搭配火山活动，可体现整个火山活动的多种情况，符合文意，当选。A项“形态”指事物存在的样貌，或在一定条件下的表现形式，用在此处搭配火山活动，更多侧重的是火山活动的外在形式，与文意不符，排除；D项“形状”指物体通过面或线条组合而呈现的外表，与“火山活动”搭配不当，排除。\n故正确答案为B。\n【文段出处】中国国家地理《火山爆发 离我们有多远？》","no":27,"missingImage":false},{"type":"question","qid":"16593292","cat":"逻辑填空","stem":"金秋时节，五彩斑斓的丰收画卷在广袤大地徐徐展开。14亿人的饭碗，依赖有限耕地上的产出，良种的重要性不言而喻。“种地不选种，累死落个空”“好种多打粮”“千算万算，不如良种合算”······一句句        而直白的农谚，道出一粒小小的种子如何承载粮食安全这“国之大者”。当良种与土地相遇，丰收的希望便开始____。\n依次填入画横线部分最恰当的一项是：","options":{"A":"质朴 发酵","B":"朴实 滋生","C":"俭朴 点燃","D":"朴素 孕育"},"answer":"D","explanation":"第一空，横线处搭配“农谚”，且与“直白”对应，体现“简单”之意，A项“质朴”指朴素，B项“朴实”意为朴素，质朴诚实，D项“朴素”指质朴，无文饰，均可与“农谚”搭配，体现“简单”之意，保留。C项“俭朴”指生活俭省，有节制而不浪费，搭配主语为人，与“农谚”搭配不当，排除。\n第二空，搭配“希望”，根据文意可知横线所填词语需体现丰收的希望开始产生之意，D项“孕育”比喻既存的事物中酝酿着新事物，与“希望”搭配恰当，且符合文意，当选。A项“发酵”比喻事物受外力影响发生某种发展变化，与“希望”搭配不当，排除；B项“滋生”指引起、产生、繁殖，多搭配不好的对象，与文段感情色彩不符，排除。\n故正确答案为D。\n【文段出处】光明网《【领航中国】把种子牢牢攥在自己手里》","no":28,"missingImage":false},{"type":"question","qid":"16593056","cat":"逻辑填空","stem":"党的十八大以来，经过艰苦卓绝的努力，我们打赢了人类历史上最大规模脱贫攻坚战；经济总量从54万亿元提升到114万亿元，占世界经济的比重从11.3%提升到18.5%；港珠澳大桥通车        ，北斗卫星导航系统全面开通，第三艘航空母舰下水······一个个改天换地的创举，一件件惊天动地的大事，谱写了时代变迁的        乐章，拓展了历史前行的宽阔航道。\n依次填入划横线部分最恰当的一项是：","options":{"A":"运行 宽宏","B":"运营 恢宏","C":"运转 宏伟","D":"运载 宏大"},"answer":"B","explanation":"第一空，根据“北斗卫星导航系统全面开通，第三艘航空母舰下水”可知，横线处所填词语应体现港珠澳大桥成功开通，投入使用之意。A项“运行”指车船等开始运转，B项“运营”指运行营业，均符合文意，保留。C项“运转”侧重“转”，多指机器的转动，亦指机构、团体等的运转，与“港珠澳大桥”搭配不当，排除；D项“运载”指装载和运送，多搭配交通工具，比如运载火箭，火车的运载能力等，与“港珠澳大桥”搭配不当，排除。\n第二空，搭配“乐章”，根据前文“改天换地”、“惊天动地”可知，横线处词语应体现谱写了伟大的乐章。B项“恢宏”指宽阔广大，符合文意，当选。A项“宽宏”指度量大，与“乐章”搭配不当，排除。\n故正确答案为B。\n【文段出处】《任仲平：掌握历史主动 凝聚奋进伟力》","no":29,"missingImage":false},{"type":"question","qid":"10204422","cat":"逻辑填空","stem":"雷暴是夏季最常见的天气现象之一，在一般人眼中，雷暴意味着电闪雷鸣、暴雨倾盆，常常造成严重的            。但在热爱天象的摄影师眼中，雷暴是融“声、光、电”为一体的独特            。尤其是充满压迫感的雷暴云，云团犹如巨大的飞碟悬浮于天空，旋转凝聚的同时云中闪电不断、雷声滚滚，彰显着大自然的威力。\n依次填入画横线部分最恰当的一项是：","options":{"A":"自然灾害 自然景观","B":"自然灾荒 自然景况","C":"自然灾变 自然景象","D":"自然灾患 自然景物"},"answer":"A","explanation":"第一空，搭配“雷暴”，A项“自然灾害”指给人类生存带来危害或损害人类生活环境的自然现象，D项“自然灾患”指自然方面的灾害、灾难，均与“雷暴”搭配恰当，保留。B项“自然灾荒”指因灾害造成的粮食歉收、土地荒芜、物品严重缺乏等状况，侧重饥荒，不符合雷暴天气带来的结果，排除；C项“自然灾变”指因自然现象反常而引起的灾害，与文段“最常见”表述相悖，排除。\n第二空，搭配“雷暴”，A项“自然景观”是天然景观和人为景观的自然方面的总称，与“雷暴”搭配恰当，当选。D项“自然景物”中“景物”指可供观赏的景色和事物，与“雷暴”搭配不当，排除。\n故正确答案为A。\n【文段出处】《中国国家地理》2022年第08期","no":30,"missingImage":false},{"type":"question","qid":"16592996","cat":"逻辑填空","stem":"湿地被誉为“地球之肾”，和森林、海洋一起，构成了地球的三大生态系统，它在净化水质、        水源、调节气候、        生物多样性等方面，具有不可替代的生态价值。\n依次填入划横线部分最恰当的一项是:","options":{"A":"滋养 维持","B":"涵养 维护","C":"保护 衡量","D":"充沛 助力"},"answer":"B","explanation":"第一空，搭配“水源”，且根据文意可知，横线处词语形容湿地对水源的作用，B项“涵养”指蓄积并保持（水分等），C项“保护”指尽力照顾，使不受损害，均与“水源”搭配恰当且符合文意，保留。A项“滋养”指供给养分，与“水源”搭配不当，排除；D项“充沛”指充足而旺盛，为形容词，常用以形容精力、雨水等等，如精力充沛、雨水充沛，而横线处应填入动词，用法不当，排除。\n第二空，搭配“生物多样性”，且根据横线后“具有不可替代的生态价值”可知，横线处词语应体现湿地对于生物多样性的积极作用，B项“维护”指维持保护，使免于遭受破坏，与“生物多样性”搭配恰当且符合文意，当选。C项“衡量”指比较、评定，考虑、斟酌，无法体现湿地对生物多样性的积极作用，排除。\n故正确答案为B。\n【文段出处】红网-芙蓉国评论《守护“地球之肾”，描绘人类诗意栖居“工笔画”》","no":31,"missingImage":false},{"type":"question","qid":"16593296","cat":"逻辑填空","stem":"当下涌现的这一批新国风文艺作品既有美之内涵，亦有美之意蕴；既在内容创作层面上        了既有模式的窠臼，又用别具一格的创意        了文化传承的密码。\n依次填入画横线部分最恰当的一项是：","options":{"A":"突破 激活","B":"推动 打造","C":"超越 激发","D":"保持 打通"},"answer":"A","explanation":"第一空，搭配“窠臼”，根据文意可知，横线处表达新国风文艺作品没有落入俗套之意，A项“突破”指打破困难、限制等，与“窠臼”搭配恰当，且符合文意，保留。B项“推动”指使事物前进，C项“超越”指超过、越出，均与“窠臼”搭配不当，排除；D项“保持”指维持，与文意不符，排除。\n第二空，代入验证，搭配“密码”，A项“激活”指刺激某事物，使活跃起来，与“密码”搭配恰当，当选。\n故正确答案为A。\n【文段出处】光明网《从“汉服潮”到“诗词热” 新国风蔚然成风》","no":32,"missingImage":false},{"type":"question","qid":"16593028","cat":"逻辑填空","stem":"我国已经形成了相对完善的中药质量标准控制体系，        了中药材源头种植到终端产品流通的各个环节。医院积极利用现代制药新技术        了传统医院中药制剂的给药剂型和给药方法，走科学化的特色制剂发展方式，满足群众多元化用药需求。\n依次填入划横线部分最恰当的一项是:","options":{"A":"包揽 改革","B":"蕴涵 改换","C":"涵盖 改变","D":"囊括 改成"},"answer":"C","explanation":"第一空，搭配“各个环节”，根据“我国已经形成了相对完善的中药质量标准控制体系”可知，横线处应体现“包含”之意，C项“涵盖”指包括、覆盖，D项“囊括”指把全部包罗在内，均与“各个环节”搭配得当，符合文意，保留。A项“包揽”指兜揽过来，全部承担，常用以搭配任务等等，与文意不符，排除；B项“蕴涵”意思是包含在内，侧重于“内涵”，常搭配“思想”“哲理”等，与“各个环节”搭配不当，排除。\n第二空，搭配“新技术”，根据“走科学化的特色制剂发展方式，满足群众多元化用药需求”可知，文段意在说明新技术让传统方法有所变化，故横线处应体现“变化”之意，C项“改变”指的是事物变得和原来不一样，搭配得当，符合文意，当选。D项“改成”指将一种用途或目的改变为另一种，填入此处表达将新技术改成老技术之意，显然不符合常理，排除。\n故正确答案为C。\n【文段出处】光明网《何明丰：推动中医药现代化制剂中心建设，满足群众用药需求》","no":33,"missingImage":false},{"type":"question","qid":"16593282","cat":"逻辑填空","stem":"据介绍，光学产品的装配和调试，直接影响成像效果。高精密复杂光学系统对性能有严苛的要求，不仅要实现狭小空间内超精密光学镜片的精密装调，还需        光学系统的稳定性。高精密复杂光学系统的装配和调试，往往靠经验丰富的匠人        精密仪器完成，存在装调难度大、周期长、制造加工一致性差等问题。\n依次填入划横线部分最恰当的一项是：","options":{"A":"维持 制作","B":"确保 配合","C":"保持 组合","D":"确认 搭配"},"answer":"B","explanation":"第一空，根据前文“高精密复杂光学系统对性能有严苛的要求”可知，横线处应体现保证稳定性之意。A项“维持”指保持使继续存在，B项“确保”指确实地保持或保证，C项“保持”指维持下去，使不减弱或消失，均符合文意，保留。D项“确认”指明确承认，与文意不符，排除。\n第二空，形容 “匠人”和“仪器”二者的关系，且根据前文“高精密复杂光学系统的装配和调试，往往靠······”可知，横线处应该表达往往靠匠人和仪器共同协作完成之意，B项“配合”指各方面相互协作完成共同的任务，可以形容“匠人”和“仪器”二者的关系，且符合文意，当选。A项“制作”指的是用原材料做成各种不同的作品，与文意不符，排除；C项“组合”指组织成为整体，无法形容“匠人”和“仪器”二者的关系，排除。\n故正确答案为B。\n【文段出处】人民网《航天光学定心车床实现微米级自动调整》","no":34,"missingImage":false},{"type":"question","qid":"16593232","cat":"逻辑填空","stem":"数字治理借助于现代信息技术手段，实现了对政府组织的流程再造与体制机制重塑，提升了公共产品和服务需求匹配的精准度，        了社会公共资源配置，增强了政府与社会以及公众之间的协同与信任，        了数字时代的人文精神，本质上就是在更加高效地创造公共价值。\n依次填入划横线部分最恰当的一项是：","options":{"A":"优化 凝聚","B":"支配 拓展","C":"强化 塑造","D":"匹配 适应"},"answer":"A","explanation":"第一空，搭配“资源配置”，且根据“实现了”“提升了”“增强了”以及“更加高效地创造公共价值”可知，横线处所填词语感情色彩积极，体现让社会公共资源得到更好配置之意。A项“优化”指加以改变或选择使优良，C项“强化”指加强，使巩固，均符合文意，保留。B项“支配”指对人或事物起主导和控制作用，D项“匹配”指配合，均为中性表达，且与后文“资源配置”搭配不当，排除。\n第二空，搭配“人文精神”，A项“凝聚”指聚集，搭配得当，且与前文“增强了政府与社会以及公众之间的协同与信任”语义对应准确，当选。C项“塑造”指用语言文字等艺术手段描写人物形象，更多体现“从零到有”，而根据文段“提升了”、“增强了”可知，文段更侧重“从有到优”，排除。\n故正确答案为A。\n【文段出处】中国社会科学文摘《基于公共价值的城市数字治理》","no":35,"missingImage":false},{"type":"question","qid":"16593294","cat":"逻辑填空","stem":"历史上的关羽之所以经历由人到神的        跃升，从根本上讲，是因为他的道德品行和人格气质满足了不同时代价值信仰重构的精神需求，即在关公身上蕴含着中华优秀文化            的核心价值。那么这种核心价值是什么？主张刚、毅、直、俭者有之，认为孝、悌、忠、信者有之，可谓众说多歧，            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"提高  一脉相承  鞭辟入里","B":"擢拔  一以贯之  莫衷一是","C":"提携  一如既往  各执一词","D":"擢用  自始至终  众口难调"},"answer":"B","explanation":"本题可从第三空入手，根据“可谓”可知，横线处成语是对前句的解释说明，且与“众说多歧”构成近义并列，体现出“有不同看法”之意，B项“莫衷一是”形容意见分歧，没有一致的看法，符合文意，保留；C项“各执一词”意思是各人坚持各人的说法，形容意见不一致，符合文意，保留。A项“鞭辟入里”形容能透彻说明问题，切中要害，文段未提及切中要害，与文意无关，排除；D项“众口难调”比喻不容易使所有的人都满意，文段并未强调不容易，与文意无关，排除。\n再看第二空，搭配“核心价值”，B项“一以贯之”指用一种思想贯穿始终，体现“思想”的连续性，可与前文“不同时代”形成对应，保留。C项“一如既往”指完全和过去一样，与“核心价值”搭配不当，排除。\n第一空，代入验证，横线处与“跃升”搭配，B项“擢拔”指拔取、提拔，搭配得当，当选。\n故正确答案为B。\n【文段出处】光明日报《历史上的关公文化及其现代性转型-历史上关公文化的核心内涵》","no":36,"missingImage":false},{"type":"question","qid":"16593158","cat":"逻辑填空","stem":"“巴赫金对话”理论的概念经过西方社会学的发展，被        成一种克服现代性危机、重构认同与共同体的有效手段。具体到政治传播的        里，强调政府与公众的“垂直对话”，其本质是政府紧密围绕民生民意与社会需求，通过及时的信息公开        不确定性，弥合不同意见并最终确认共同价值的手段。\n依次填入划横线部分最恰当的一项是：","options":{"A":"推演 领域 消灭","B":"演绎 语境 消弭","C":"论证 情境 消损","D":"归纳 环境 消解"},"answer":"B","explanation":"第一空，根据横线前后语义可知，横线处需体现出将“巴赫金对话”这一理论发展成一种克服现代性危机、重构认同与共同体的有效手段，即将理论具体应用的过程，A项“推演”指把原理等加以说明并推广运用，B项“演绎”指铺陈、表现，均符合文意，保留。C项“论证”指论述并证明，与横线后“成”搭配不当，排除；D项“归纳”指由一系列具体的事实概括出一般的原理，与文意相反，排除。\n第二空，横线处搭配“政治传播”，且强调政府与公众的“垂直对话”，B项“语境”指使用语言的环境，与文段中的“对话”对应恰当，保留。A项“领域”指一种特定的范围或区域，语义尚可，但对比“语境”，不如“语境”与“对话”对应更为恰当，排除。\n第三空，代入验证，横线处搭配“不确定性”，根据后文“弥合不同意见”可知，此处需体现出使“不确定性”消失之意，B项“消弭”指清除、消除某些不好的事情，符合文意，当选。\n故正确答案为B。\n【文段出处】光明网《政府新闻发布可更精准》","no":37,"missingImage":false},{"type":"question","qid":"16593298","cat":"逻辑填空","stem":"短视频已成为互联网的底层应用。某研究报告显示，目前我国短视频用户有10.12亿，青年是绝对主力军。作为互联网原住民一代，青年会被短视频“集体        ”并不奇怪：“短”        了信息时代消费内容快餐化的需求，而“视觉化”带来的生动直观、即时满足等特点，        了对年青一代沉浸式体验的“注意力抓取”。\n依次填入画横线部分最恰当的一项是：","options":{"A":"攻陷 迎合 实现","B":"攻陷 满足 弥补","C":"沦陷 逢迎 达成","D":"沦陷 契合 兑现"},"answer":"A","explanation":"第一空，根据前文可知，横线处要体现短视频对青年的影响，且搭配“被”，A、B两项“攻陷”指在战争中某个地方被敌军占领，置于此处可体现大量青年受到短视频影响之意，且与“被”搭配得当，均保留。C、D两项“沦陷”意为领土为敌人占领，与“被”搭配不当，均排除。\n第二空，搭配“需求”，A项“迎合”指逢迎，猜测或揣度别人的心意以便顺从或投合，B项“满足”指使满意，达到一定要求，均与“需求”搭配得当，保留。\n第三空，搭配“注意力抓取”，A项“实现”指使成为现实，与“注意力抓取”搭配恰当，当选。B项“弥补”指填补，补偿，一般搭配“不足”“损失”等，与“注意力抓取”搭配不当，排除。\n故正确答案为A。\n【文段出处】光明网《青年人与短视频的关系未必是“沉迷”》","no":38,"missingImage":false},{"type":"question","qid":"16593286","cat":"逻辑填空","stem":"暗物质，一种在物质起源和宇宙        过程中具有重要地位的物质，约占整个宇宙物质质量的85%。但它看不见、摸不着，几乎不和任何物体发生作用。为了捕捉到这        又“腼腆”的暗物质，21世纪以来，国际上        开展了20多个探测实验。人们相信，谁先揭开它的面纱，谁就将促成人类对物质世界和宇宙认识的又一次重大飞跃。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蜕变  严肃  持续","B":"演化  神秘  相继","C":"运动  神奇  广泛","D":"膨胀  冷酷  及时"},"answer":"B","explanation":"第一空，所填词语修饰宇宙的某个过程。B项“演化”指生态的群落或自然群落的逐渐进化，C项“运动”指运行转动，D项“膨胀”指扩大、增长，均符合文意，保留。A项“蜕变”比喻形质的改变、转化，通常不与“宇宙”搭配使用，排除。\n第二空，根据文段可知，横线处应体现暗物质“看不见、摸不着”的性质。B项“神秘”指难以捉摸，置于文段能体现看不见、摸不着的特点，且与后文“揭开它的面纱”对应恰当，保留。C项“神奇”指非常奇妙，侧重奇特巧妙，与B项“神秘”对比，不如B项与前后文对应恰当，排除；D项“冷酷”指冷淡苛刻，与文意不符，排除。\n第三空，代入验证，根据文段“21世纪以来”“开展了20多个探测实验”可知，横线处应体现在不停探索暗物质之意，B项“相继”指连续不断，符合文意，当选。\n故正确答案为B。\n【文段出处】光明日报《中国锦屏地下实验室：捕捉最“弱”的光》","no":39,"missingImage":false},{"type":"question","qid":"16593233","cat":"逻辑填空","stem":"中国汉字经历岁月洗礼，            ，如今已发展出成熟而多样的字体系统。随着科学技术的        ，激光照排技术替代活字印刷，让汉字的传播方式发生了革命性变化，而数字媒体的        使汉字字体的设计迎来了质的飞跃。当我们以全新的视角重新审视汉字时，会发现其创新的设计方法如万花筒般千姿百态、绚丽多彩。\n依次填入划横线部分最恰当的一项是：","options":{"A":"久久为功  提升  创新","B":"历久弥新  增长  融合","C":"薪火相传  更迭  介入","D":"厚积薄发  普及  应用"},"answer":"C","explanation":"第一空，搭配“汉字”，且根据前后文“中国汉字经历岁月洗礼”以及“如今已发展出成熟而多样的字体系统”可知，横线处应体现中国汉字历经漫长的时间而发展出如今的成熟字体系统之意，B项“历久弥新”指经历长久的时间而更加鲜活，更加有活力，更显价值，C项“薪火相传”比喻学问和技艺一代代地继承下去，D项“厚积薄发”指经过长时间的积累和准备而获得大的成功，均符合文意，保留。A项“久久为功”意为要持之以恒，锲而不舍，与“汉字”搭配不当，且文段并未体现汉字需要坚持之意，与文意不符，排除。\n第二空，搭配“科学技术”，且根据“激光照排技术替代活字印刷”可知，横线处应体现科学技术取得进步之意，C项“更迭”指轮流更替，置于此处可体现新技术取代旧技术，符合文意，保留。B项“增长”指增加，提高，与“科学技术”搭配不当，排除；D项“普及”指普遍推广，与文意无关，排除。\n第三空，代入验证，C项“介入”指参与、干预，置于此处可体现汉字字体的设计在数字媒体的助力之下迎来新发展之意，符合文意，当选。\n故正确答案为C。\n【文段出处】光明日报《汉字设计，激发传统文化新活力》","no":40,"missingImage":false},{"type":"question","qid":"16593235","cat":"片段阅读","stem":"伴随着城市化快速发展的步伐，今天的少年儿童与乡土田园渐行渐远。如何开展既符合时代特色又“接地气”的耕读教育？这道“考题”，考验的是学校与教师勇于创新的意识、因地制宜的本领。很多学校意识到：“耕”离不开土地和自然，“读”重在学习广博有趣的各类知识、涵养自强不息的人格品德、树立报效国家的崇高志气。于是，越来越多的学生被老师们带到原野田间，越来越多的课堂开设在了大自然里。学生们饶有兴致地学习农耕知识、活泼健朗地舒展心胸情怀，耕读教育的真正意义由此得以实现。\n对这段文字概括最恰当的一项是：","options":{"A":"耕读为本，计之久远","B":"古为今用.耕读传家","C":"劳动教育能够激发内生动力","D":"在“土味”课堂实现耕读教育的价值"},"answer":"D","explanation":"文段开篇指出随着时代发展，少年儿童存在与乡土田园远离的问题，并提出疑问：如何开展好耕读教育，随后详细解释了“耕”与“读”，后文通过“于是”对前文进行总结并回答前文提出的问题，强调开展好耕读教育，需要亲近原野田间，回归大自然，这样学生能更好地学习和舒展心胸情怀，耕读教育的真正意义得以实现，对应D项。\nA项，“计之久远”意为要规划好以后要走的路，表述不明确，且缺乏文段核心话题“教育”，排除；\nB项，“古为今用”文段未提及，无中生有，排除；\nC项，“劳动教育”范围扩大，文段核心话题为“耕读教育”，偏离文段中心，排除。\n故正确答案为D。\n【文段出处】《“耕”以强体，“读”以润心》","no":41,"missingImage":false},{"type":"question","qid":"16593074","cat":"片段阅读","stem":"冰冻圈主要分布在地球两极和中低纬度的高山地区，在气候系统和气候变化中扮演着重要角色。极地温度对于全球的影响力也许比我们想象中要大得多。可以说，极地温度就像一个遥控器，控制着地球上其他地方的“恒定”温度。卫星数据显示，北极的浮冰正在加速消融、减少。冰越来越少，意味着地球能够反射到太空的阳光变少了，也意味着更多深海海水被暴露出来去吸收阳光而变暖，地球会变得更暖，冰会融化得更快，而且很难恢复，如此往复，会放大全球的温度变化情况。\n与这段文字的意思相符的一项是：","options":{"A":"极地和高山地区地表上存在多年冰体","B":"极地温度决定着地球上其他地方的温度","C":"北极冰冻圈的加速融化会导致全球变暖","D":"极地冰冻圈的融化速度慢于中低纬度高山冰冻圈"},"answer":"C","explanation":"A项，根据“冰冻圈主要分布在地球两极和中低纬度的高山地区”可知，“多年冰体”无中生有，排除；\nB项，根据“极地温度就像一个遥控器，控制着地球上其他地方的‘恒定’温度”可知，文段表达的意思是极地温度控制其他地方，使其有一个“恒定”温度，而非控制其他地方温度的高低，偷换概念，排除；\nC项，根据“卫星数据显示，北极的浮冰正在加速消融、减少”以及“冰越来越少，意味着······地球会变得更暖”可知，加速融化会导致全球变暖，表述正确，当选；\nD项，文段并未提及“中低纬度高山冰冻圈的融化速度”，无关对比，排除。\n故正确答案为C。\n【文段出处】学习强国《假如冰冻圈融化了会怎么样？》","no":42,"missingImage":false},{"type":"question","qid":"16593253","cat":"片段阅读","stem":"到2030年，我国数字人整体市场规模将达2700亿元。数字人应用的多元拓展，得益于我国数字技术的不断进步和产业布局的持续完善。我国数字人产业上下游均已具备一定规模的企业集群，有较深厚的技术积累。看上游，成像设备产品已发展成熟，智能传感器等关键技术正被集中攻坚；看下游，应用领域加速从文娱行业向制造业、现代服务业延伸。同时，数字人产品制作企业高速发展、相关服务平台正加快打造，数字人制作水平明显提升，数字人产业将加快走向成熟。\n对这段文字理解不正确的是：","options":{"A":"数字人应用场景将更为广泛","B":"目前数字人产业仍处在成长期","C":"我国数字人市场发展前景良好","D":"智能传感器等关键技术已有重大突破"},"answer":"D","explanation":"A项，根据“应用领域加速从文娱行业向制造业、现代服务业延伸”可知，表述正确，排除；\nB项，根据“智能传感器等关键技术正被集中攻坚”“相关服务平台正加快打造”“数字人产业将加快走向成熟”可知，表述正确，排除；\nC项，根据“到2030年，我国数字人整体市场规模将达2700亿元”“我国数字人产业上下游均已具备一定规模的企业集群······数字人产业将加快走向成熟”可知，表述正确，排除；\nD项，根据“智能传感器等关键技术正被集中攻坚”可知，“正”表示正在进行，而“已”属于完成时，偷换时态，当选。\n本题为选非题，故正确答案为D。\n【文段出处】人民日报《数字人产业加快走向成熟》","no":43,"missingImage":false},{"type":"question","qid":"16593035","cat":"片段阅读","stem":"如今无论什么季节，任何水果都能随时买回家尝鲜，很多人对此并不赞同，理由是反季水果的种植过程中总会有不利于健康的因素，因此他们在选购水果的时候，会侧重购买当季、当地产的水果。但是，果蔬中是否存在不利于健康的因素，与自然栽种还是大棚栽种没有必然联系。随着现代化农业技术的推广应用，大棚栽种水果技术越来越成熟，所有的保鲜剂、食品添加剂、植物生长调节剂，只要是国家相关标准允许使用的，且在规定的用量下，对人体健康是没有危害的。\n这段文字旨在说明：","options":{"A":"人们倾向于购买当季当地产的水果","B":"反季水果在种植过程中会产生不利于健康的因素","C":"水果是否存在不利于健康的因素与栽种方式的选择无关","D":"应加强现代农业技术的推广应用，减少添加剂对健康的危害"},"answer":"C","explanation":"文段开篇指出很多人不赞同随时购买任何水果的做法，之后阐述原因，接下来通过转折词“但是”强调果蔬中是否存在不利于健康的因素与栽种方法无关，之后具体介绍大棚栽种水果的情况，并指出只要添加剂是国家相关标准允许使用的且用量符合规定就不会危害人体健康。故文段重在强调反季水果并没有不健康，水果健康与否与栽种方法无关，对应C项。\nA项“购买当季当地产的水果”、B项“在种植过程中会产生不利于健康的因素”均对应转折之前的内容，非重点，排除；\nD项，未包含文段核心话题“水果”，且文段强调反季水果在满足各项标准规定条件的前提下对人体健康没有危害，而非选项中所表达的“减少添加剂对健康的危害”的对策，与文意不符，排除。\n故正确答案为C。\n【文段出处】澎湃新闻《【网络辟谣】反季水果不健康？应保持多样性！》","no":44,"missingImage":false},{"type":"question","qid":"16593266","cat":"片段阅读","stem":"2012年至2021年，国家知识产权局累计授权发明专利395.3万件，年均增长13.8%，累计注册商标3556.3万件，年均增长25.5%，累计评出中国专利金奖310项，获奖项目新增销售额超过2.5万亿元。我国知识产权使用费进出口总额累计2.19万亿元，年均增长13.7%，其中出口年均增长31.2%，超过进口增速近20个百分点。知识产权有力支撑了创新型经济、品牌经济、区域特色经济和开放型经济发展。\n这段文字旨在说明：","options":{"A":"知识产权运用的效益快速增长","B":"知识产权助力优化营商环境","C":"知识产权创新专利的数量上升","D":"知识产权国际合作持续深化"},"answer":"A","explanation":"文段开篇通过多个数据列举了国家知识产权局的发明专利、获奖项目、知识产权使用费等方面的增加，尾句得出结论，即知识产权有力支撑了多方面经济的发展，故文段强调知识产权带来了经济效益，对应A项。\nB项，“优化营商环境”文段并未提及，无中生有，排除；\nC项，“创新专利的数量上升”仅对应文段其中一部分数据内容，表述片面，且非重点，排除；\nD项，“国际合作持续深化”文段并未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】中国经济网《国家知识产权局:这十年进步巨大！累计授权发明专利395.3万件 年均增长13.8%》","no":45,"missingImage":false},{"type":"question","qid":"16593171","cat":"片段阅读","stem":"腹泻早期由于胃肠道急性充血、水肿、发炎和渗出，肠蠕动活跃且处于痉挛状态，其消化吸收功能比较弱，脂肪、蛋白质会出现吸收、代谢障碍，这时可以进食一些淀粉类食物，如大米粥、藕粉、面糊、细挂面、面片等，可避免呕吐，减少体液的流失，有利于止泻，还可以有效地养护肠道。如果腹泻严重或出汗较多，还应适当给患者多喝一些米汁，以补充体内水、电解质的不足。\n这段文字旨在说明：","options":{"A":"饮食调理是治疗腹泻的重要手段","B":"腹泻早期吃淀粉类食物有利止泻","C":"食用淀粉类食物可有效治疗腹泻","D":"吃含淀粉的流质食物可养护肠道"},"answer":"B","explanation":"文段开篇介绍了早期腹泻的特征是消化吸收功能比较弱，紧接着指出这时进食一些淀粉类食物有利于止泻和养护肠道，随后通过关联词“还”，介绍了腹泻严重的时候，喝一些米汁有利于补充相应物质，故文段为“还”所引导的并列结构，重点论述了腹泻早期可以通过摄入淀粉类食物缓解症状，对应B项。\nA项，偏离文段核心话题“淀粉类食物”，排除；\nC项，“有效治疗腹泻”无中生有，且未体现“腹泻早期”这一前提，排除；\nD项，“含淀粉的流质食物”主题词缩小，文段核心话题为“淀粉类食物”，且“养护肠道”偏离文段中心，排除。\n故正确答案为B。\n【文段出处】人民网《肠炎治疗过程中的饮食需求——食品》","no":46,"missingImage":false},{"type":"question","qid":"16593256","cat":"片段阅读","stem":"新农人，不同于传统农民，也异于新型职业农民，他们多是从城市回流农村的新群体。如果说过去大部分年轻人以跳出农门为奋斗目标之一的话，近年来，跳回农门正在成为新时尚。新农人带来了新技术、新商业模式和运营理念，创造了新的就业机会和空间，丰富并拓展了农村经济业态。但在现实中，新农人融入农村社会网络，激活产业网络并没有那么容易。不少人虽然在物理意义上返乡回乡了，但在社会关系上仍是“异乡人”。正如不少调研所显示的，新农人不了解农村，不知道如何与农民打交道，难以有效嵌入当地产业网络开展分工合作。\n这段文字主要说明了：","options":{"A":"新农人，回得去并不等于融得进","B":"新农人需补短板，否则创业难成","C":"新农人具备新理念，掌握新技术","D":"时代呼唤更多新农人回农村创业"},"answer":"A","explanation":"文段首句介绍了新农人的含义， 之后指出近年来年轻人跳回农门正在成为新时尚。接下来论述新农人带给农村的积极影响，然后通过转折关联词“但”引出重点，指出新农人融入农村社会网络，激活产业网络并不容易，不少人在社会关系上仍是“异乡人”，并没有真正融入农村。尾句通过调研情况对前文的问题进行进一步的解释说明。文段重在提出新农人返乡之后面临难以融入农村的问题，A项是对文段重点的概括，当选。\nB项，“需补短板”表述不明确，没有指出“融入难”这一关键问题，偏离文段重点，排除；\nC项，“具备新理念，掌握新技术”对应转折前的内容，非重点，排除；\nD项，“时代呼唤更多新农人回农村”无中生有，排除。\n故正确答案为A。\n【文段出处】《让村里来的新农人留得下闯得开》","no":47,"missingImage":false},{"type":"question","qid":"16593061","cat":"片段阅读","stem":"伴随着人类社会的发展进步，我们对时间精准度和稳定性的要求越来越高。目前氢钟的计时已经非常精准，但从长远来看，仍然存在着稳定性不够的问题。研究脉冲星的一个重要价值，就在于弥补这一问题。脉冲星具有稳定的旋转周期，每万亿年才会慢1秒，具有长期的稳定性。而且，脉冲星是永不“断电”的，不像氢钟这样的精密仪器需要精心的保护，脉冲星则没有这样的担忧，没有什么能够干扰到脉冲星，只要几架大型射电望远镜便可接收到它们的信号。\n这段文字主要说明了：","options":{"A":"脉冲星可以满足人类对时间精准度和稳定性的要求","B":"脉冲星有稳定旋转周期，能满足对时间稳定性的要求","C":"脉冲星具有极强精准性和稳定性，有很多潜在的应用","D":"将氢钟和脉冲星结合，可得到精准、稳定的时间系统"},"answer":"D","explanation":"文段开篇交代背景，指出当前人类对时间精准度和稳定性的要求越来越高，并利用氢钟进行精准计时，接着通过转折关联词“但”引出目前氢钟计时存在稳定性不够的问题，随后针对这一问题，提出对策，即“研究脉冲星”能弥补氢钟计时稳定性不够这一问题，后文从“脉冲星具有稳定的旋转周期”及“抗干扰能力强”两个方面对脉冲星的“稳定性”进行解释说明，支撑论证前文对策。故文段为分总分结构，重点强调脉冲星能弥补氢钟计时稳定性不够的问题，使计时系统能够满足人们对时间精准度和稳定性的双重需求，对应D项。\nA项，“脉冲星可以满足人类对时间精准度的要求”文段未提及，文中只是强调脉冲星具备稳定性这一特点，对其精准性的论述并未涉及，无中生有，排除；\nB项，“脉冲星有稳定旋转周期”为文段论述脉冲星具备稳定性的其中一个原因，表述片面，且为文段解释说明部分，属于分述句内容，非重点，排除；\nC项，“极强精准性”和“有很多潜在的应用”文段均未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】光明日报《“眨眼睛”的星星：探秘脉冲星》","no":48,"missingImage":false},{"type":"question","qid":"16593078","cat":"片段阅读","stem":"实践是人的思维方式得以形成的最切近的现实基础，人的思维方式是实践的要素、结构、过程、程序、规律的观念反映，是实践方式的内化与积淀。没有实践活动，也就没有思维方式或思维结构。而思维方式或思维结构一经形成，又成为人们进行认知活动、评价活动和实践活动的思维的框架、定势、模式、取向。实践方式作为由实践的各种要素、活动构成的实践逻辑，经过实践的无数次的重复，逐步扬弃了具体实践活动的个别性、特殊性与偶然性而具备了一般性、普遍性与必然性，人类实践也逐渐趋向稳定、成熟并形成了相对稳定的模式。\n与这段文字的意思相符的一项是：","options":{"A":"实践即是一种思维方式","B":"思维即是一种实践方式","C":"实践方式形成思维方式","D":"思维方式形成实践方式"},"answer":"C","explanation":"A、B两项，根据“实践是人的思维方式得以形成的最切近的现实基础，人的思维方式是实践的要素、结构、过程、程序、规律的观念反映，是实践方式的内化与积淀”可知，实践是思维方式形成的基础，两者概念并不等同，因此均表述错误，排除；\nC项，根据“人的思维方式是实践的要素、结构、过程、程序、规律的观念反映，是实践方式的内化与积淀。没有实践活动，也就没有思维方式或思维结构”可知，表述正确，当选；\nD项，根据“而思维方式或思维结构一经形成，又成为人们进行认知活动、评价活动和实践活动的思维的框架、定势、模式、取向”可知，思维方式形成后，会成为人们进行各种活动的思维的框架、定势、模式、取向，而非“形成实践方式”，表述错误，排除。\n故正确答案为C。\n【文段出处】《思维、思维方式与当代中国思维方式的建构（期刊&lt;马克思主义哲学&gt;2022年第5期）》","no":49,"missingImage":false},{"type":"question","qid":"16593014","cat":"片段阅读","stem":"目前，学术界对数字经济在促进乡村产业振兴中的实际作用方面已有一定研究，但对数字经济影响乡村产业振兴的内在机制等尚缺乏系统的理论阐释，由此可能夸大或弱化数字经济在乡村产业振兴中的作用，甚至有可能导致政策制定的偏差。因此，我们拟在厘清数字经济对乡村产业振兴的关键作用基础上，从效率提升、产业变革、结构优化三个角度剖析数字经济促进乡村产业振兴的内在机制，并立足现实提出相应的实现路径。\n这段文字接下来最可能介绍：","options":{"A":"数字经济促进乡村产业振兴的方法","B":"数字经济对乡村产业振兴的关键作用","C":"数字经济如何使乡村产业振兴的效率得以提升","D":"借助数字经济促进乡村产业振兴的过程中有哪些现实制约"},"answer":"B","explanation":"本题为接语选择题，需通读全文，重点把握文段最后论述的核心话题。文段开篇引出“数字经济”和“乡村产业振兴”的话题，接着通过转折词“但”提出问题，即目前对数字经济影响乡村产业振兴的内在机制等缺乏系统的理论阐释，然后分析了该问题带来的危害，即不利于正确认识数字经济在乡村产业振兴中的作用，甚至可能导致政策制定的偏差，随后通过“因此”总结上文，强调要先厘清数字经济对乡村产业振兴的关键作用，再从效率提升、产业变革、结构优化三个角度进行剖析，接着立足现实提出实现路径。故文段最后论述的核心话题为“数字经济”和“乡村产业振兴”，接下来应继续围绕这两个话题展开论述，且应先介绍数字经济对乡村产业振兴的关键作用，对应B项。\nA项，“方法”强调对策，按照正常的逻辑顺序，应先介绍数字经济对乡村产业振兴的作用，然后再提出对策，故A项应放在B项之后进行论述，排除；\nC项，是针对乡村产业振兴的效率提升提出对策，根据文段最后的结论句可知，应先介绍数字经济对乡村产业振兴的作用，然后再从效率提升角度进行剖析，故C项应放在B项之后进行论述，排除；\nD项，文段最后并未提及“制约”，无中生有，与前文衔接不当，排除。\n故正确答案为B。\n【文段出处】中州学刊《数字经济促进乡村产业振兴的机制与路径研究》","no":50,"missingImage":false},{"type":"question","qid":"16593057","cat":"片段阅读","stem":"神经科学领域已有研究揭示脑衰老的分子、细胞、器官、系统多层级多种生物学特征，它们相互依赖、彼此互为联系，共同构成脑衰老特征及其发生机制的复杂性。此外，该领域新技术和新方法的应用也使研究内容得到极大丰富与发展。在对抗衰老过程中维持脑健康及其功能，是一项挑战，运动可以通过改善脑衰老的生物学特征及生理功能，促进脑的可塑性。因此，临床实践中运动干预可作为补充策略，改善衰老人群及相关慢性疾病患者的脑健康。\n最适合做这段文字标题的是：","options":{"A":"运动促进脑生长：加强认知与记忆","B":"运动干预脑衰老：新进展与再认识","C":"运动改变脑结构：挑战性与安全性","D":"运动影响脑健康：运动疗法有前景"},"answer":"B","explanation":"文段开篇指出神经科学领域对于脑衰老特征及其发生机制已有研究，之后通过“此外”指出新技术和新方法的应用使其研究内容得到极大丰富与发展，随后提出运动可以改善脑衰老的生物学特征及生理功能，促进脑的可塑性。尾句通过“因此”总结前文，强调运动干预可以作为改善衰老人群及相关慢性疾病患者脑健康的补充策略。文段重在强调运动对于脑衰老的积极影响，对应B项。\nA项“运动促进脑生长”、C项“运动改变脑结构”、D项“运动影响脑健康”均未提及主题词“脑衰老”，偏离文段核心话题，排除。\n故正确答案为B。\n【文段出处】《运动干预脑衰老：新进展与再认识》","no":51,"missingImage":false},{"type":"question","qid":"16593072","cat":"片段阅读","stem":"目前我国氢能应用占比最大的领域是工业领域。氢能与建筑融合，是近年兴起的一种绿色建筑新理念。在电力领域，氢能可成为一种新型的储能形式。从清洁低碳角度看，氢能可以在钢铁、化工、公路运输、航运和航空等难以深度脱碳的行业领域发挥重要作用。从安全高效角度看，氢能可以促进更高份额的可再生能源发展。此外，氢能与电能作为能源枢纽，更容易耦合热能、冷能、燃料等多种能源，共同建立互联互通的现代能源网络，形成极具韧性的能源供应体系。\n这段文字意在说明：","options":{"A":"氢能产业发展有所突破","B":"氢能产业链涉及多种技术和行业领域","C":"氢能的应用正在引发深刻的能源变革","D":"氢能作为一种替代能源进入人们的视野"},"answer":"C","explanation":"文段首句介绍氢能在我国工业领域中的广泛应用和重要地位，然后指出氢能应用在绿色建筑方面的潜力，以及氢能在电力领域中可成为一种新型的储能形式，接着从清洁低碳角度论述氢能应用可推动诸多行业实现绿色转型，最后介绍氢能应用的安全高效性。故整个文段从不同的领域以及角度围绕氢能应用进行介绍，指出其在我国的重要性和广泛的应用，对应C项。\nA、B两项，“氢能产业发展”“氢能产业链”均偏离文段核心，文段重在强调“氢能的应用”，且“产业”无中生有，排除；\nD项，缺少核心话题“氢能的应用”，“进入人们的视野”属于刚刚被发现的阶段而文段已经进入应用相对成熟期了，语义不符，另外“作为一种替代能源”文段并未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】光明日报《氢能，现代能源体系新密码》","no":52,"missingImage":false},{"type":"question","qid":"16593053","cat":"片段阅读","stem":"碳纤维是由有机纤维经过一系列热处理转化而成，含碳量高于90%的无机高性能纤维，是一种力学性能优异的新材料，其比重不到钢的五分之一。碳纤维树脂复合材料抗拉强度是钢的7至9倍，还具有出色的耐热性、优秀的抗腐蚀性与抗辐射性。以碳为主要原料，以碳纤维复合材料、石墨烯等为核心的新一代复合材料是21世纪最具应用前景的新材料，可应用于飞机结构材料、人工韧带等身体代用材料以及火箭外壳、工业机器人等领域，但碳纤维复合材料发展也面临着高质量树脂基材缺乏等发展瓶颈问题。\n根据这段文字，下列说法正确的是：","options":{"A":"碳纤维是一种含碳量高的有机纤维","B":"碳正成为21世纪的主导型先进材料","C":"碳纤维树脂复合材料的抗拉强度优于钢","D":"碳纤维树脂复合材料是一种最耐热且最坚硬的材料"},"answer":"C","explanation":"A项，根据“碳纤维是由有机纤维经过一系列热处理转化而成，含碳量高于90%的无机高性能纤维”可知，碳纤维是一种“无机高性能纤维”，而非“有机纤维”，偷换概念，排除；\nB项，根据“以碳为主要原料，以碳纤维复合材料、石墨烯等为核心的新一代复合材料是21世纪最具应用前景的新材料”可知，21世纪最具应用前景的新材料是“新一代复合材料”而非“碳”本身，偷换概念，排除；\nC项，根据“碳纤维树脂复合材料抗拉强度是钢的7至9倍”可知，选项表述正确，当选；\nD项，根据“碳纤维树脂复合材料抗拉强度是钢的7至9倍，还具有出色的耐热性、优秀的抗腐蚀性与抗辐射性”可知，“最”表述绝对，且“最坚硬”无中生有，排除。\n故正确答案为C。","no":53,"missingImage":false},{"type":"question","qid":"16593277","cat":"片段阅读","stem":"各地景区大规模免门票提振旅游业，加快推进景区转型，景区出现了几个新变化：一是旅游门槛降低、吸引力竞争力提升；二是创新活力激发，探索摆脱门票经济，许多景区免门票后收入不降反升，通过发展二次消费增加综合收入；三是“景区+”和“+景区”趋势凸显，景区免门票与民宿、户外等新热点新业态加快融合，形成新的文旅消费空间和场景。各地政府和景区运营者逐渐认识到，要以创新理念推动景区发展，单纯依赖门票收入很难适应新形势下的市场竞争和大众旅游多元化消费需求，应更注重提升旅游综合消费、释放综合效益。\n这段文字意在说明：","options":{"A":"持续推进完善景区门票价格形成机制","B":"疫情冲击下旅游业发生了几个新变化","C":"要用旅游新理念推动景区新发展","D":"“景区+”和“+景区”趋势凸显"},"answer":"C","explanation":"文段开篇指出当下各地景区为了加快推进转型，出现了几个新变化，随后针对这些新变化从三个方面进行了具体阐述。文段尾句对前文进行总结并提出对策，即要以创新理念推动景区发展，比起单纯依赖门票收入应更注重提升旅游综合消费、释放综合效益。故文段意在强调当下的景区发展离不开创新理念的推动，对应C项。\nA项，“完善景区门票价格形成机制”文段并未提及，无中生有，排除；\nB项，“旅游业发生了几个新变化”对应文段开头，为对策前的表述，非重点，排除；\nD项，“‘景区+’和‘+景区’”仅对应景区门票新变化之一，表述片面，且为文段非重点内容，排除。\n故正确答案为C。\n【文段出处】光明网《以全域旅游理念推进景区创新发展》","no":54,"missingImage":false},{"type":"question","qid":"16593012","cat":"片段阅读","stem":"数字文化产业是数字技术与文化创意的融合创生。数字技术从根本上改变了文化生产的创意、生产、传播、流通和消费等价值链的生成机制与内生结构，提高了文化创意的产生速度，丰富了文化内容的创意数量，提高了文化传播和流通的精准度和互动性，拓展了文化消费的体验感和辐射面。文化产品在创意、生产、传播、流通与消费等环节中，运用各类数字技术，将文化符号、审美感知和价值观念等文化内容转化为具有可感知性、可复制性、可推广性的数字文化产品，提升了文化产业高感知、高技术和高品质的价值内涵。\n与这段文字的意思不相符的一项是:","options":{"A":"数字技术改变了文化产业的机制和形态","B":"文化创意是文化运用数字技术后的结果","C":"数字技术具有转化文化产品形象的功能","D":"数字技术渗透于文化产业的各个环节中"},"answer":"B","explanation":"A项，根据“数字技术从根本上改变了文化生产的创意、生产、传播、流通和消费等价值链的生成机制与内生结构······拓展了文化消费的体验感和辐射面”可知，表述正确，排除；\nB项，根据“数字文化产业是数字技术与文化创意的融合创生”可知，文化创意并不是文化运用数字技术后的结果，表述错误，当选；\nC项，根据“文化产品在创意、生产、传播、流通与消费等环节中，运用各类数字技术······转化为具有可感知性、可复制性、可推广性的数字文化产品”可知，表述正确，排除；\nD项，根据“数字技术从根本上改变了文化生产的创意、生产、传播、流通和消费等价值链的生成机制与内生结构”“文化产品在创意、生产、传播、流通与消费等环节中，运用各类数字技术”可知，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《人民论坛·学术前沿》2022年12月上 《数字文化产业高质量发展的融合机制：连接、赋能与共生》","no":55,"missingImage":false},{"type":"question","qid":"16593163","cat":"片段阅读","stem":"社会心理学先驱所罗门·阿希通过一系列著名的阿希从众实验证明，即使是判断“三段线段谁最长”这样的简单任务，人们的回答也会受到他人的强烈影响，进而在并无胁迫的情况下服从某种群体规范。人们为什么会服从规范？这可能源于群体中的个人害怕被其他成员视为“一匹离群之马（越轨者）”而遭到孤立。人的这种顺从行为在动物身上也有所体现。比较心理学家本内特·加利夫的研究发现，挪威大鼠会忽视自己的偏好转而选择同伴偏爱的食物味道，尽管有时这种味道并不怎么好。\n这段话所要表达的中心思想是：","options":{"A":"人的行为活动容易受到他人的影响","B":"离群之马都会遭到社会群体的孤立","C":"人们在无胁迫下往往会服从群体规范","D":"挪威大鼠会忽视自己偏好而选择顺从"},"answer":"C","explanation":"文段开篇引出阿希从众实验，说明即使是面对简单的任务，人们也会受到他人的影响，并通过递进关联词“进而”得出结论，即人们在并无胁迫的情况下会服从某种群体规范。随后对人们服从规范的原因进行解释，并通过“挪威大鼠”的例子进一步说明了这种顺从行为。故文段重在强调人们在并无胁迫的情况下会服从某种群体规范，对应C项。\nA项对应“进而”之前的内容，B项“离群之马”对应原因解释的内容，D项“挪威大鼠”对应尾句的例子，均为非重点内容，排除。\n故正确答案为C。","no":56,"missingImage":false},{"type":"question","qid":"16593032","cat":"片段阅读","stem":"文化遗产保护体系，是针对与保护对象有关的内部、外部考察范围，所确定的定性、定量、定形态的科学研究体系，也是一个发展着的动态体系。伴随着人类社会价值观念的演变，有关文化遗产资源的观念也不断发生变化，对文化多样性和生物多样性的尊重必然更加突出，文化遗产的外延种类和评价体系也必然不断丰富。\n接下来最有可能介绍：","options":{"A":"要重视文化遗产的保护方向","B":"要建立新的文化遗产资源观","C":"要将更多文化遗产资源纳入保护范畴","D":"在着力保护文化遗产物质载体的同时，还要重视发掘和保存非物质文化遗产"},"answer":"B","explanation":"本题为接语选择题，需通读全文，重点关注文段最后谈论的核心话题。文段首先围绕“文化遗产保护体系”的概念进行详细介绍，随后指出“文化遗产资源的观念”随着人类社会价值观念的演变也在不断发生变化，并从两方面进行具体论述。因此文段接下来应继续围绕“文化遗产资源的观念”的话题展开论述，对应B项。\nA项“文化遗产的保护方向”、D项“文化遗产物质载体”“非物质文化遗产”均与文段最后谈论的核心话题不一致，与前文衔接不当，排除；\nC项，“将更多文化遗产资源纳入保护范畴”仅能对应尾句“文化遗产的外延种类不断丰富”，表述片面，且“更多文化遗产资源纳入”这一举措的实施，应在树立正确的观念之后，即文化遗产的观念发生变化，建立全新的文化遗产资源观，故与前文衔接不够紧密，排除。\n故正确答案为B。\n【文段出处】知网《全球视野下中国文化遗产保护新发展》","no":57,"missingImage":false},{"type":"question","qid":"16593161","cat":"语句表达","stem":"经济活动的可持续性和相关金融资产的价值依赖于生物多样性和环境提供的生态系统服务。与气候变化类似，生物多样性丧失也是本世纪面临的最大危机之一。导致环境恶化和气候变化的罪魁祸首是大量不考虑环境影响、破坏生物多样性、只顾赚钱的投资活动。因此，                  。\n填入划横线部分最恰当的一句是：","options":{"A":"在保护生物多样性方面金融业有着不可推卸的责任","B":"人类将面临气候变化和生物多样性丧失的巨大危机","C":"应逐步建立对金融机构管理的监管框架和稳定机制","D":"导致环境恶化的根本原因是大量经济活动的可持续性"},"answer":"A","explanation":"横线在文段结尾，且由“因此”可知，横线处应总结前文内容。文段首句指出经济活动的可持续性和相关金融资产的价值依赖于生物多样性和环境提供的生态系统服务，接着指出与气候变化类似，生物多样性的丧失也是本世纪面临的危机，随后指出大量不顾后果的投资活动会导致环境恶化和气候变化，结合前一句可知，这类投资活动也会导致生物多样性的丧失。尾句应总结上文，指出金融活动和生物多样性之间的联系，对应A项。\n文段讨论的是经济、金融与生物多样性之间的联系，B项缺少“经济、金融”这一话题，C项缺少“生物多样性”这一话题，均不符合文意，排除；\nD项，“经济活动的可持续性”对应文段首句，并非环境和气候恶化的原因，偏离文段重点，排除。\n故正确答案为A。\n【文段出处】《专访马骏：生物多样性风险应被纳入金融监管框架》","no":58,"missingImage":false},{"type":"question","qid":"16593024","cat":"语句表达","stem":"元素周期表是化学科学的基石，在化学发展史上具有里程碑意义。作为元素周期表中的“住户”，元素的发现几乎与人类文明相伴。像铁、铜、金、银等容易以单质形态存在的元素发现得最早，之后从铁器时代到青铜时代，从炼金术到电解技术，从核辐射到核裂变，                    ，新“住户”不断占据各自的位置。直至今日，仍然有新的元素被发现（合成），而且关于元素在生命起源、物种进化中的作用以及元素如何精准调控材料性能及生命过程等仍然是科学家们非常关注的科学问题。\n填入划横线处最恰当的一句是:","options":{"A":"元素周期表逐步被填充并扩展","B":"元素周期表被有序地组织起来","C":"元素周期表得到较完美的呈现","D":"元素在周期表不同行列排列着"},"answer":"A","explanation":"横线位于文段中间，需联系前后文共同分析。文段开篇引出元素周期表这一话题，并且指出“元素的发现几乎与人类文明相伴”，即元素周期表里的元素随着文明的提高不断增加，随后通过“铁、铜、金、银”等进行举例说明。横线后依旧强调不断有新的元素被发现。故横线处应体现随着时间的发展不断有新的元素被发现，并被填入元素周期表中，对应A项。\nB项“有序地组织起来”、C项“较完美的呈现”、D项“不同行列排列着”文段均未提及，与前后文衔接不当，排除。\n故正确答案为A。\n【文段出处】中华读书报《更完美的元素周期表一定会出现》","no":59,"missingImage":false},{"type":"question","qid":"16593289","cat":"语句表达","stem":"①已经投入应用的主要是针对健康人群开发的、精准性稍差一些的非植入式设备\n②到目前为止，科学家们已经发明了多种获取脑电波的设备\n③近些年来，科学家们则在开发用于特殊病人的植入式设备上花费了大量精力\n④但基于安全性、伦理性等方面的考虑，一直没有在人类的临床上取得突破\n⑤这类设备被称为脑机芯片或干脆简称为脑机接口，它能获得更加精准的脑电信息，也能将外界电信号更加精准地输入大脑\n⑥然而随着人工智能相关技术和工程技术、材料技术的飞速发展，不少科学家又开始了这类尝试\n将以上6个句子重新排列，语序正确的是：","options":{"A":"③②①⑥⑤④","B":"③⑥④①②⑤","C":"②①③⑤④⑥","D":"②④①③⑤⑥"},"answer":"C","explanation":"对比选项，确定首句。②句引出脑电波设备的话题，可以作首句，保留C、D两项。③句出现“则”，为关联词后半部分，不适合作首句，排除A、B两项。\n继续分析所给语句，⑥句出现“然而”及“这类尝试”，既有转折关系又有指代词，据此可寻找捆绑内容，⑥句介绍技术的飞速发展，使得科学家又开始了原有的尝试，结合选项分析，⑥句前分别是④⑤两句，④句介绍因为安全性和伦理性等方面的考虑，在人类临床上未取得突破，可与⑥句捆绑构成转折关系，且“这类尝试”指代前文的“临床”，C项当选。⑤句介绍设备的名称及其工作原理，无法与⑥句捆绑构成转折关系，排除D项。\n故正确答案为C。\n【文段出处】光明日报《脑机接口：人工智能下一站？》","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"16592946","cat":"数学运算","stem":"大学生创业主要集中在高科技、智力服务、连锁加盟和自媒体运营四个领域。某学院今年选择创业的大学毕业生不到50人，其中选择智力服务领域、连锁加盟领域和自媒体运营领域的分别占\u003cimg data-k=\"311f5c2d861c\">，\u003cimg data-k=\"54d707f15b45\">和\u003cimg data-k=\"5ef3a129e326\">。那么该学院今年选择高科技领域创业的大学毕业生有多少人?","options":{"A":"1","B":"3","C":"5","D":"7"},"answer":"A","explanation":"根据“其中选择智力服务领域、连锁加盟领域和自媒体运营领域的分别占\u003cimg data-k=\"311f5c2d861c\">，\u003cimg data-k=\"54d707f15b45\">和\u003cimg data-k=\"5ef3a129e326\">”可知，总人数是7、2、3的倍数，又因7、2、3互质，所以总人数为7×2×3=42的倍数。由于选择创业的大学毕业生不到50人，则总人数为42人。因此选择智力服务领域、连锁加盟领域和自媒体运营领域的人数分别为：\u003cimg data-k=\"463e12aef186\">人、\u003cimg data-k=\"b61d69c5a02b\">人、\u003cimg data-k=\"ff93b4b6dce6\">人，则选择高科技领域创业的大学毕业生有42-6-21-14=1人。\n故正确答案为A。","no":61,"missingImage":false},{"type":"question","qid":"16593220","cat":"数学运算","stem":"某公园绿化管理部门采购了100片围栏，每片长1米且不可弯折。现拆分拟围成5块周长相等且互不相邻的矩形花卉区域。若不考虑拼接间隙，那么这5块区域的最大与最小面积最多可相差多少平方米？","options":{"A":"10","B":"12","C":"16","D":"25"},"answer":"C","explanation":"根据题意，这5块矩形花卉区域周长相等，则每块矩形的周长为\u003cimg data-k=\"977755dbabf3\">米。因为围栏不可弯折，则矩形的宽最小为1米，那么：\n当宽为1米时，长为\u003cimg data-k=\"1d21a1623c75\">米，面积为1×9=9平方米；\n当宽为2米时，长为\u003cimg data-k=\"93a74a737d13\">米，面积为2×8=16平方米；\n当宽为3米时，长为\u003cimg data-k=\"57b4a13e0cc8\">米，面积为3×7=21平方米；\n当宽为4米时，长为\u003cimg data-k=\"3e5f0af55f69\">米，面积为4×6=24平方米；\n当宽为5米时，长为\u003cimg data-k=\"3dc8c9608194\">米，面积为5×5=25平方米。\n综上可得，面积最大为25平方米，最小为9平方米，最多相差25-9=16平方米。\n故正确答案为C。","no":62,"missingImage":false},{"type":"question","qid":"16592948","cat":"数学运算","stem":"某单位为解决职工暑期“带娃难”的问题，开设了暑托班。开班时男孩与女孩的比例为3：4，后来有2个男孩、1个女孩退出暑托班，此时男孩与女孩的比例为2：3。那么开班时女孩有多少人?","options":{"A":"10","B":"12","C":"14","D":"16"},"answer":"D","explanation":"方法一：设开班时男孩有3x人，女孩有4x人，后来有2个男孩、1个女孩退出，可得\u003cimg data-k=\"631a34e7df30\">，解得x=4，则开班时女孩有16人。\n方法二：开班时男孩、女孩的比例为3：4，则开班时女孩为4的倍数，排除A、C两项；后来女孩退出1人后为3的倍数，将B项代入12-1=11，不满足3的倍数，排除；D项16-1=15，满足3的倍数，当选。\n故正确答案为D。","no":63,"missingImage":false},{"type":"question","qid":"16592953","cat":"数学运算","stem":"某旅游公司定制甲、乙两种纪念品，第一次共定制50个。试销后根据反馈，第二次定制两种纪念品共70个，其中乙纪念品个数是第一次的\u003cimg data-k=\"62886ffdfcd1\">。已知甲纪念品单价为15元，第一次定制花费1150元，那么第二次定制花费多少元?","options":{"A":"1150","B":"1725","C":"2300","D":"2875"},"answer":"A","explanation":"根据题意，第二次定制的乙变为第一次的\u003cimg data-k=\"62886ffdfcd1\">，假设第二次定制的甲也变为第一次的\u003cimg data-k=\"62886ffdfcd1\">，则第二次总定制数量为\u003cimg data-k=\"8e8b6629971c\">个，第二次总金额为\u003cimg data-k=\"e79ca2322e01\">元。此时比实际第二次定制少了70-12.5＝57.5个甲，总金额少了57.5×15＝862.5元，所以实际第二次定制花费287.5+862.5=1150元。\n故正确答案为A。","no":64,"missingImage":false},{"type":"question","qid":"16592955","cat":"数学运算","stem":"某农产品基地对外供应一批农副产品。假设这批农副产品每天都有定量的自然损耗，如果提货方每天运走1.5吨产品，则50天运完；如果提货方每天运走2吨产品，则40天运完。那么这批农副产品有多少吨?","options":{"A":"75","B":"80","C":"100","D":"110"},"answer":"C","explanation":"根据题意，设每天定量的自然损耗为x吨，根据农副产品总量不变可列式：1.5×50+50x=2×40+40x，解得x=0.5，即每天定量的自然损耗为0.5吨，故这批农副产品有1.5×50+0.5×50=100吨。\n故正确答案为C。","no":65,"missingImage":false},{"type":"question","qid":"16592970","cat":"数学运算","stem":"某社区服务中心拟引入优质资源为本社区45名老人提供居家养老服务。已知老人的年龄构成如下（设老人的年龄为x）：\u003cimg data-k=\"045b66aff965\">有17人，\u003cimg data-k=\"efafc9eee95a\">有12人，\u003cimg data-k=\"a2a212e1baa0\">有11人，90岁及以上有5人。现从该社区中随机抽取两名老人了解居家养老服务情况，那么这两名老人恰好都在80岁以上（含80岁）的概率是：","options":{"A":"\u003cimg data-k=\"f77e40baf950\">","B":"\u003cimg data-k=\"485a5ab82af9\">","C":"\u003cimg data-k=\"0d5c73539282\">","D":"\u003cimg data-k=\"5ef3a129e326\">"},"answer":"A","explanation":"根据概率问题公式，概率\u003cimg data-k=\"ac77862681f7\">。总情况数为45名老人随机选两人，共有\u003cimg data-k=\"5d15484ef0cf\">种情况。满足要求的情况数为在80岁以上（含80岁）的11+5=16人中随机选两人，共有\u003cimg data-k=\"d0a6bc5a03d2\">种情况。则所求概率\u003cimg data-k=\"68b55a2a4cb9\">。\n故正确答案为A。","no":66,"missingImage":false},{"type":"question","qid":"16592952","cat":"数学运算","stem":"中国空间站主体由天和核心舱、问天实验舱、梦天实验舱构成。某次实验需要5名宇航员同时在三个舱中开展，每个人只能去一个舱，每个舱至少安排1名宇航员，其中甲宇航员只能去问天实验舱和梦天实验舱中的一个，则不同的安排方法有多少种？","options":{"A":"72","B":"88","C":"100","D":"144"},"answer":"C","explanation":"根据题意，5名宇航员安排到三个舱，每个舱至少安排1名宇航员，那么三个舱中的人数有两种情况：\n①人数分别为1人、2人、2人。\n若甲在1人舱，甲有\u003cimg data-k=\"629f7f5df0db\">种情况，剩下4人平均安排到剩下2个舱有\u003cimg data-k=\"07681941c0f5\">种情况，则共有\u003cimg data-k=\"f680fdcc63ba\">种情况；\n若甲在2人舱，甲有\u003cimg data-k=\"629f7f5df0db\">种情况，剩余4人选1人和甲同一舱有\u003cimg data-k=\"be99391be9cc\">种情况，还剩下3人安排到剩下2个舱，其中一个1人，另一个2人，有\u003cimg data-k=\"0117a0be86ed\">种情况，则共有\u003cimg data-k=\"09759b598f11\">种情况；\n②人数分别为1人、1人、3人。\n若甲在1人舱，甲有\u003cimg data-k=\"629f7f5df0db\">种情况，剩下4人安排到剩下2个舱，其中一个1人，另一个3人，有\u003cimg data-k=\"4a56c27ae701\">种情况，则共有\u003cimg data-k=\"ae5c390265ec\">种情况；\n若甲在3人舱，甲有\u003cimg data-k=\"629f7f5df0db\">种情况，剩余4人选2人和甲同一舱有\u003cimg data-k=\"07681941c0f5\">种情况，还剩下2人平均安排到剩下2个舱有\u003cimg data-k=\"629f7f5df0db\">种情况，则共有\u003cimg data-k=\"6bdc4e6a029b\">种情况；\n综上共有12+48+16+24=100种情况。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"16593223","cat":"数学运算","stem":"某单面圆形交通禁停标志牌如图所示，标志牌直径为60cm，牌中各处红色区域宽度均为5cm，某工厂承接30个该种标志牌的喷绘业务，已知每个标志牌的蓝色区域喷绘价格是112.5元，红蓝区域喷绘单价相同（价格仅按面积计算），那么30个标志牌喷绘共需：\n\u003cimg data-k=\"e4e270e40c31\" style=\"max-width:514px\">","options":{"A":"3375元","B":"6000元","C":"6750元","D":"8437.5元"},"answer":"C","explanation":"\u003cimg data-k=\"2ab6add37eac\" style=\"max-width:526px\">\n如图所示，连接四块蓝色扇形区域的顶点DCEF构成一个边长为5cm的正方形，对角线DE的长度为\u003cimg data-k=\"abce77864e84\">cm。蓝色区域可平移拼成一个完整的圆形，蓝色圆形的直径则=大圆直径AB-5cm-5cm-DE=60cm-5cm-5cm-7cm=43cm。\n方法一：蓝色圆形的面积为\u003cimg data-k=\"f41d9f68c87a\">，整个标志牌的面积为\u003cimg data-k=\"0fb2eb9a8289\">，因为红蓝区域喷绘单价相同，则整个标志牌的喷绘单价相同，整个标志牌的喷绘价格为\u003cimg data-k=\"beaf7038920c\">元，30个标志牌的喷绘总价为219×30=6570元，根据选项选择最为接近的，对应C项。\n方法二：根据面积比等于相似比的平方，蓝色圆形和标志牌的直径比为43：60，则面积比为\u003cimg data-k=\"22069122ce2b\">，蓝色面积的喷绘价格为112.5元，则整个标志牌的喷绘价格为112.5×2=225元，30个标志牌的总价为225×30=6750元，对应C项。\n故正确答案为C。\n备注：1.如下图所示，\u003cimg data-k=\"8e1c50faf2e4\">为大圆直径=60，\u003cimg data-k=\"2f2e9a2b3011\">。本题容易将\u003cimg data-k=\"ef4e3ff6550f\">误认为60，误将小圆直径理解为60-5-5-5=45cm，进而计算误选B项。\n\u003cimg data-k=\"df89a7d64361\" style=\"max-width:400px\">\n2.本题方法一是较为精准的计算，选项无直接答案，C项接近；方法二为估算，估算结果刚好是C项。可能本题考查的思维就是估算，也可能就是命题有误。","no":68,"missingImage":false},{"type":"question","qid":"16592957","cat":"数学运算","stem":"气象学中，24小时内降落在某面积上的雨水深度叫做日降雨量（不考虑渗漏、蒸发、流失等损耗，单位：mm），将日降雨量记为w，其等级划分如下：小雨（\u003cimg data-k=\"ec92541be532\">），中雨（\u003cimg data-k=\"99394be8e75a\">），大雨（\u003cimg data-k=\"25f45f457d86\">），暴雨（\u003cimg data-k=\"55c6bc4f2669\">）。某地某日用一个圆锥形容器接了24小时的雨水（如下图所示），则该地日降雨量等级是：\n\u003cimg data-k=\"ab8df6924c17\" style=\"max-width:348px\">","options":{"A":"暴雨","B":"大雨","C":"中雨","D":"小雨"},"answer":"C","explanation":"\u003cimg data-k=\"99e25db1b0ee\" style=\"max-width:394px\">\n由题意可得，总降雨量为圆锥CDE的体积，本题所求日降雨量w是降落在直径为300mm面积上的水深。如图，\u003cimg data-k=\"d6e946cb5f98\">，所以\u003cimg data-k=\"17b3b79322aa\">\u003cimg data-k=\"8a0b21e52b3d\">，由此可得\u003cimg data-k=\"39606b2600a7\">mm，总降雨量\u003cimg data-k=\"6b3b1ce9f908\">。则所求日降雨量\u003cimg data-k=\"987b36fb4924\">\u003cimg data-k=\"e3c1688803c5\"> ，求得\u003cimg data-k=\"11628b2e9ec7\">mm，在中雨范围内。\n故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"16592942","cat":"数学运算","stem":"A、D两地设有通信基站（如下图所示），发射信号范围分别是以A、D为圆心，AE和DB为半径的圆形区域，小林从B地出发，沿与DB垂直的BA方向匀速行进，步行速度为4千米/小时，那么步行约多少分钟后小林的手机能够重新接收到信号？（\u003cimg data-k=\"db79566a27d9\">）\n\u003cimg data-k=\"c8fc448ab167\" style=\"max-width:481px\">","options":{"A":"8","B":"10","C":"12","D":"14"},"answer":"C","explanation":"根据题意可知，扇形AEC和扇形DEB分别被A、D两地的通信基站发射的信号所覆盖，故小林由B点出发后，手机就不能接收到信号，沿与DB垂直的BA方向匀速行进到C点后手机可以重新接收到信号。根据勾股定理可得\u003cimg data-k=\"33b99ec333fa\">km，又由DE=DB=1km，可得\u003cimg data-k=\"d367409c12ae\">\u003cimg data-k=\"a4ec5f9e6e95\">km，故\u003cimg data-k=\"88dba90c49a2\">\u003cimg data-k=\"14cd87e422ee\">km；根据题意，需要计算小林步行走BC的时间，步行速度为4km/小时，BC=0.77km，故所需时间为\u003cimg data-k=\"9a58dc1aa065\">分钟。\n故正确答案为C。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"16593204","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"192ac635ed44\" style=\"max-width:500px\">","options":{"A":"①④⑥，②③⑤","B":"①②③，④⑤⑥","C":"①⑤⑥，②③④","D":"①②⑥，③④⑤"},"answer":"D","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，考虑数量规律。题干出现“日”字和“田”字变形图、交圆切圆变形图，优先考虑笔画数。观察发现，图①②⑥的笔画数均为1，图③④⑤的笔画数均为2，即图①②⑥为一组，图③④⑤为一组。\n故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"16593051","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"4cfa4acbbf87\" style=\"max-width:500px\">","options":{"A":"①②③，④⑤⑥","B":"①②⑤，③④⑥","C":"①③⑥，②④⑤","D":"①④⑥，②③⑤"},"answer":"C","explanation":"解析一：\n元素组成不同，优先考虑属性规律。观察发现，题干图形有曲有直，可以考虑曲直性是否存在规律。图①③⑥中，图形的线条种类均为2（图形既有直线又有曲线）；图②④⑤中，图形的线条种类均为1（图形为纯曲线或纯直线），即图①③⑥为一组，图②④⑤为一组。\n故正确答案为C。\n解析二：\n元素组成不同，优先考虑属性规律。观察发现，图①②③⑥均为轴对称图形，图⑤为中心对称图形，图④不是对称图形，没有答案。继续观察发现，题干出现生活化图形且封闭区域明显，考虑数量规律中的面数量。题干图形的面数量依次为7、9、7、8、4、8，图①②③的面数量均为奇数，图④⑤⑥的面数量均为偶数，即图①②③为一组，图④⑤⑥为一组。\n故正确答案为A。\n注：本题两种规律均不是非常严谨，分组分类按曲直线条种类数和数量奇偶分组考查都较少，大家了解基本解题思路即可，无需作为备考重点。","no":72,"missingImage":false},{"type":"question","qid":"16593031","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"e91a8ba555a7\" style=\"max-width:602px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相同，优先考虑位置规律。观察发现，题干图形内圈和外圈的黑球数量均相同，优先内外分开看。如下图所示，标记为①的黑球在内圈每次逆时针移动一格，标记为②③的黑球在外圈每次顺时针移动三格，只有C项符合规律。\n\u003cimg data-k=\"fc97634bec3d\" style=\"max-width:630px\">\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"16593205","cat":"图形推理","stem":"左边为给定的立体图形，从任一角度观看，下面哪项不是该多面体的视图？\n\u003cimg data-k=\"3bcba9a6247d\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查三视图。如下图所示，A、B、D三项按图中箭头方向观察，均可看到，排除；\n\u003cimg data-k=\"c4ea5d833f38\" style=\"max-width:600px\">\nC项为从上往下观察该立体图形，看到的视图正中间应为一条长横线，如下图所示，该项视图错误，当选。\n\u003cimg data-k=\"9b1ed63f9fa3\" style=\"max-width:67px\">\n本题为选非题，故正确答案为C。","no":74,"missingImage":false},{"type":"question","qid":"16593023","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"c098baeb4e76\" style=\"max-width:400px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"九宫格横行观察无规律，但竖着看发现，相同线条重复出现，优先考虑样式规律中的加减同异。第一列图1和图2求异得到图3；经验证，第二列满足此规律；第三列应用此规律，故“？”处应选择图1和图2求异得到的图形，只有D项符合。\n故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"16592981","cat":"定义判断","stem":"合同法大多属于缺省规则，当事人可以就同一事项做出不同约定，只有在没有约定时，才把合同法规定填补到合同中。缺省规则包括两种类型：一种是符合当事人预期的正向缺省规则，当事人无需事无巨细地对合同进行约定，只要适用合同法规定就能实现合同目的，有利于节约订立合同的成本；另一种是与当事人预期相悖的反向缺省规则，适用该类缺省规则会产生与合同目的相反的结果，以督促当事人事先对相关事项做出约定。\n根据上述定义，下列属于反向缺省规则的是：","options":{"A":"标的数量没有约定的，视为合同没有成立","B":"质量要求没有约定的，按照强制性国家标准履行","C":"价款没有约定的，按照缔约时履行地的市场价格履行","D":"履行方式没有约定的，按照有利于实现合同目的的方式履行"},"answer":"A","explanation":"第一步：找出定义关键词。\n正向缺省规则：“当事人无需事无巨细地对合同进行约定”、“只要适用合同法规定就能实现合同目的”；\n反向缺省规则：“与当事人预期相悖”、“适用该类缺省规则会产生与合同目的相反的结果”。\n第二步：逐一分析选项。\nA项：标的数量没有约定的，视为合同没有成立，当事人签订合同，应是期望合同可以继续生效，符合“与当事人预期相悖”、“适用该类缺省规则会产生与合同目的相反的结果”，符合“反向缺省规则”定义，当选；\nB项：质量要求没有约定的，按照强制性国家标准履行，说明合同对这方面即便是没有做出约定，该情况下也可以使用合同法规定继续履行合同，符合“当事人无需事无巨细地对合同进行约定”、“只要适用合同法规定就能实现合同目的”，符合“正向缺省规则”定义，不符合“反向缺省规则”定义，排除；\nC项：价款没有约定的，按照缔约时履行地的市场价格履行，说明合同对这方面即便是没有做出约定，该情况下也可以使用合同法规定继续履行合同，符合“当事人无需事无巨细地对合同进行约定”、“只要适用合同法规定就能实现合同目的”，符合“正向缺省规则”定义，不符合“反向缺省规则”定义，排除；\nD项：履行方式没有约定的，按照有利于实现合同目的的方式履行，说明合同对这方面即便是没有做出约定，该情况下也可以使用合同法规定继续履行合同，符合“当事人无需事无巨细地对合同进行约定”、“只要适用合同法规定就能实现合同目的”，符合“正向缺省规则”定义，不符合“反向缺省规则”定义，排除。\n故正确答案为A。","no":76,"missingImage":false},{"type":"question","qid":"16592935","cat":"定义判断","stem":"供应商绿色压力是指企业供应商的环保意识和环保行为对企业绿色创新的影响。它会促使企业显著改进产品生产流程，以减少对自然资源的使用，并在产品生命周期内减少有害物质的释放。研究表明，供应商的绿色环保意识越强，绿色环保行为越主动，就越有可能通过供应链来影响链上企业的绿色创新行为。\n根据上述定义，下列属于供应商绿色压力的是:","options":{"A":"随着绿色意识的增强，消费者更愿意选择资源节约和环境友好的产品","B":"随着国家生态建设的推进，企业会更加谨慎地选择自己的下游客户","C":"供应商可以为链上企业提供“绿色创新”方面的资源和知识","D":"供应商的绿色环保行为倒逼企业进行绿色创新行为"},"answer":"D","explanation":"第一步：找出定义关键词。\n“企业供应商的环保意识和环保行为”、“对企业绿色创新的影响”。\n第二步：逐一分析选项。\nA项：随着绿色意识的增强，消费者更愿意选择资源节约和环境友好的产品，未提及企业，不符合“企业供应商的环保意识和环保行为”、“对企业绿色创新的影响”，不符合定义，排除；\nB项：随着国家生态建设的推进，企业会更加谨慎地选择自己的下游客户，未提及企业的环保意识和绿色创新行为，不符合“企业供应商的环保意识和环保行为”、“对企业绿色创新的影响”，不符合定义，排除；\nC项：供应商为链上企业提供“绿色创新”方面的资源和知识，但不明确是否对这些企业产生了绿色创新的影响，不符合“对企业绿色创新的影响”，不符合定义，排除；\nD项：供应商的绿色环保行为，符合“企业供应商的环保意识和环保行为”，倒逼企业进行绿色创新行为，符合“对企业绿色创新的影响”，符合定义，当选。\n故正确答案为D。","no":77,"missingImage":false},{"type":"question","qid":"16593022","cat":"定义判断","stem":"湖陆风是指湖陆之间相互转换的热力环流现象。入夜以后，陆地降温速度比湖水快，近地面空气变冷变重，而湖水降温慢，温度比陆地高，空气暖而轻，形成上升气流，陆上气流流向湖心形成陆风。太阳升起后，陆地吸热和升温速度比湖水快，直至陆上空气升温形成上升气流，湖面空气流向陆地形成湖风。\n根据上述定义，下列诗句最能体现湖陆风现象的是：","options":{"A":"轮台九月风夜吼，一川碎石大如斗，随风满地石乱走","B":"潮没具区薮，潦深云梦田。朝随北风去，暮逐南风旋","C":"鸱枭养子庭树上，曲墙空屋多旋风","D":"鹊飞山月曙，蝉噪野风秋"},"answer":"B","explanation":"第一步：找出定义关键词。\n“湖陆之间相互转换的热力环流现象”。\n第二步：逐一分析选项。\nA项：诗句的意思是轮台九月整夜里狂风怒号，到处的碎石块块大如斗，狂风吹得斗大乱石满地走。诗句只涉及陆地上的风，没有涉及湖水，不符合“湖陆之间相互转换的热力环流现象”，不符合定义，排除；\nB项：诗句的意思是潮水沉没于太湖，潮水沉没于云梦泽里的田地，早上顺着北风驾船进入湖中打鱼采菱，傍晚乘着南风，可以毫不费力地驾船回家。诗句描写了湖水和陆地之间风的形成情况，符合“湖陆之间相互转换的热力环流现象”，符合定义，当选；\nC项：诗句的意思是庭院里的树上，凶猛的猫头鹰都养出了小雏；曲折的院墙，空荡的房屋，多有旋风翻卷。诗句只涉及陆地上的风，没有涉及湖水，不符合“湖陆之间相互转换的热力环流现象”，不符合定义，排除；\nD项：诗句的意思是曙光微明，月挂西山，鹊鸟出林，寒蝉在初秋的野外晨风中嘶声噪鸣。诗句只涉及陆地上的风，没有涉及湖水，不符合“湖陆之间相互转换的热力环流现象”，不符合定义，排除。\n故正确答案为B。","no":78,"missingImage":false},{"type":"question","qid":"16593020","cat":"定义判断","stem":"磁滞现象指的是磁场把未带磁性的铁磁性物质（如铁、钴、镍及其合金等）磁化，使之带有磁性，但外加磁场去除后，铁磁性物质的磁性也不会马上消除，仍保有磁性的现象。\n根据上述定义，下列属于磁滞现象的是：","options":{"A":"当水中溶解了某些铁磁性物质，水在强磁场下流过时，周围金属物体中会产生磁感应现象，金属中有电流流过","B":"由导线将电池、小灯泡、电流表、开关连接成闭合电路，闭合开关时，灯泡亮暗、电流表指针的指向等都会有变化","C":"电饭锅中的温控元件都有设置好的温度值，电饭锅运行达到一定温度后，感温磁钢会消磁，依靠弹簧的反作用力断开电源","D":"把烧红的铁片放置在子午线的方向，使铁分子顺着地球磁场方向排列，达到磁化目的，之后挪动铁片，铁分子仍然按照磁场方向排列"},"answer":"D","explanation":"第一步：找出定义关键词。\n“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”、“外加磁场去除后，铁磁性物质的磁性也不会马上消除”。\n第二步：逐一分析选项。\nA项：带有铁磁性物质的水在强磁场下流过时，周围的金属物体会产生磁感应现象，但未提及磁场去除后，是否还会有磁感应现象，不符合“外加磁场去除后，铁磁性物质的磁性也不会马上消除”，不符合定义，排除；\nB项：由导线将电池、小灯泡、电流表、开关连接成闭合电路，闭合开关时，灯泡亮暗、电流表指针指向会有变化，没有涉及磁化，不符合“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”，不符合定义，排除；\nC项：电饭锅运行达到设定温度后，感温磁钢会消磁，说明感温磁钢本身具有磁性，不符合“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”，不符合定义，排除；\nD项：把烧红的铁片放置在子午线方向，铁分子顺着地球磁场方向排列，磁场使铁片磁化，符合“磁场把未带磁性的铁磁性物质(如铁、钴、镍及其合金等）磁化”，挪动铁片后铁分子仍然按照磁场方向排列，说明铁片磁性没有马上消除，符合“外加磁场去除后，铁磁性物质的磁性也不会马上消除”，符合定义，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"16593013","cat":"定义判断","stem":"在统计学中，生态谬误是指用一种高层次的分析单位做调查，却用另一种低层次的分析单位做结论，即运用数据时错误地将整组的汇总结果应用到组内的单位中。\n根据以上定义，下列属于生态谬误的是：","options":{"A":"一项调研发现甲地居民的收入普遍比乙地居民的收入更高，由此认为甲地教师的收入高于乙地教师的收入","B":"服务业占比大的区域比服务业占比小的区域更容易吸引高层次人才，由此认为服务业占比大的区域高层次人才更多","C":"某杂志开设了读者意见反馈邮箱，几天后收到28个不喜欢时装栏目的反馈邮件。某编辑认为有读者不喜欢，就一定有读者喜欢","D":"某公司规定，上一年工资数额在公司前6%的要降低工资，小王上一年的工资低于公司的平均水平，可以推出小王今年的工资可能降低"},"answer":"A","explanation":"第一步：找出定义关键词。\n“运用数据时错误地将整组的汇总结果应用到组内的单位中”。\n第二步：逐一分析选项。\nA项：根据“甲地居民普遍比乙地居民的收入高”，得到“甲地教师比乙地教师的收入高”，即将整组数据的结果用来得到部分个体的结论，符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，符合定义，当选；\nB项：根据“服务业占比大的区域更容易吸引高层次人才”，得到“服务业占比大的区域高层次人才更多”，前后均为服务业占比大的区域和服务业占比小的区域的对比，不符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，不符合定义，排除；\nC项：根据“有28个不喜欢时装栏目的反馈邮件”，得到“有读者不喜欢，就一定有读者喜欢”，不涉及数据间的错误运用，不符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，不符合定义，排除；\nD项：根据“小王上一年的工资低于公司的平均水平”，得到“小王今年的工资可能降低”，前后均为小王的工资，是根据过去的数据推导现在的情况，不符合“运用数据时错误地将整组的汇总结果应用到组内的单位中”，不符合定义，排除。\n故正确答案为A。","no":80,"missingImage":false},{"type":"question","qid":"16592932","cat":"定义判断","stem":"蒸发冷却是一种通过水的蒸发来冷却空气的过程，即水会吸收空气的热量而蒸发从而冷却空气。空气越干燥，其容纳水分的能力越强，当用水喷淋空气时，则空气温度的降低幅度越大。如果采用温度更低的自来水或井水，其空气的降温效果更佳。\n根据上述定义，下列未体现蒸发冷却的是:","options":{"A":"用喷水壶装满冰凉刺骨的井水，然后喷淋房屋周边","B":"在逆风处设置风井，使空气沿风井流入楼内喷泉处","C":"沿海国家在风口建造风车，利用空气流动驱动扇叶","D":"将冷水输送到屋顶，冷水从房檐四周流下形成水帘"},"answer":"C","explanation":"第一步：找出定义关键词。\n“水会吸收空气的热量而蒸发从而冷却空气”。\n第二步：逐一分析选项。\nA项：用喷水壶装满冰凉刺骨的井水喷淋房屋周边时，水接触到空气会吸收空气中的热量而蒸发，从而冷却空气，符合“水会吸收空气的热量而蒸发从而冷却空气”，符合定义，排除；\nB项：在逆风处设置风井，使空气沿风井流入楼内喷泉处时，喷泉中的水接触
