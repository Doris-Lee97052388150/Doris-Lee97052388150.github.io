6f\">，则\u003cimg data-k=\"522d9a944b49\">\u003cimg data-k=\"2a20f2108296\">，在直角三角形A&#39;AB中，\u003cimg data-k=\"c700809ca8fc\">分米，\u003cimg data-k=\"ac4d7b1ca364\">\u003cimg data-k=\"00534fb1b2a2\">分米，根据勾股定理\u003cimg data-k=\"8124fb156fd1\">\u003cimg data-k=\"1dcd32f8da49\">分米。\n\u003cimg data-k=\"ace545af49a7\" style=\"max-width:496px\">\n综上，第一种的距离更短，为12.64分米。\n故正确答案为C。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"3522437","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"0c14aaee82b7\" style=\"max-width:482px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相似，优先考虑样式规律，经过验证无规律。继续观察发现，图形均明显被分割，考虑数量规律中的面数量。第一行图形中面的数量满足：\u003cimg data-k=\"bbbecad22587\">，第二行图形中面的数量满足：\u003cimg data-k=\"511b97dce847\">，则第三行图形中面的数量应满足：\u003cimg data-k=\"7be0d359132b\">，A、C、D三项均不满足，B项当选。\n故正确答案为B。","no":71,"missingImage":false},{"type":"question","qid":"3523361","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"459d3b4fb2ff\" style=\"max-width:525px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"解法一：元素组成不同，优先考虑属性规律。九宫格图形优先看横行，第一行图1的第1个字母包含曲线，图2的第2个字母包含曲线，图3的第3个字母包含曲线；第二行验证满足此规律；第三行运用此规律，则？处图形的第3个字母应包含曲线，只有D项符合。\n故正确答案为D。\n解法二：元素组成不同，考虑数量规律。观察发现，题干都是字母，且出现S、C、U、O等全曲线图形，优先考虑数曲线。九宫格图形优先看横行，第一行图形的曲线数分别为1、1、1，其相加和为3；第二行图形的曲线数分别为1、1、1，其相加也为3；第三行应满足同样的规律，图1和图2的曲线数分别为1、2，故？处图形的曲线数应为0，只有C项符合。\n故正确答案为C。\n注：解法一涉及整体每一个图形和位置，解法二仅关注了曲线，解法一相对解法二是更为全面的规律，因此粉笔更倾向于选D。","no":72,"missingImage":false},{"type":"question","qid":"3522441","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"28a079d71dab\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成相同，优先考虑位置规律。观察发现，题干第一组图形中的两个白球在九宫格外圈整体顺时针平移2格，而两个“十字”在九宫格外圈整体顺/逆时针平移4格。第二组图形应遵循同样规律，只有D项满足。\n故正确答案为D。","no":73,"missingImage":false},{"type":"question","qid":"3523382","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"af0a32787871\" style=\"max-width:486px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"题干图形元素组成不同，且无明显属性规律，优先考虑数量规律。题干第二、四幅图及四个选项中的图形均为立体图形，虚线为所视角度下看不见的棱，题干图形的交点（顶点）数分别为：3、4、5、6，所以问号处图形的交点数应为7个，选项图形的交点数分别为7、5、8、6，只有A项符合规律。\n故正确答案为A。","no":74,"missingImage":false},{"type":"question","qid":"3523381","cat":"类比推理","stem":"从所给四个选项中，选出能与给定的①、②、③、④零件共同构成如下图所示的\u003cimg data-k=\"f15124717a01\">方块组合的一项：\n\u003cimg data-k=\"bd836b9ea4c6\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"注：本题不严谨，CD都能拼成，选哪个都算对，因粉笔题库系统只能设置一个正确答案，故暂定答案为C。\n解析一：优先考虑数数，但是选项都是4个方块，无法排除选项，因此考虑拼合。优先考虑把方块数量多的图进行拼合，可将图①贴边放，图②可以与图①拼在同一层，该层只差一个小方块，图④刚好竖着放，能填补空缺的小方块，那么底下一层拼满；再看上面一层，可以把图③贴边放，而且无论图③如何贴边放，都有一个单独的小方块空缺，刚好可以和图④的另一个小方块拼凑起来，观察发现，剩余空缺的部分刚好就是C项中的图形。\n\u003cimg data-k=\"d99dd72a386e\" style=\"max-width:700px\">\n故正确答案为C。\n解析二：如下图所示，将图③、图④拼在一起，那么这层还差1个方块和2个连在一起的方块可以填满，图①立起来刚好有1个方块可以填到该层空缺处，图②立起来刚好能填满另外2个方块空缺处，最底下一层可拼满；再看上面一层，刚好差4个方块的正方形，即D项中的图形可以填满上面一层。\n\u003cimg data-k=\"8d0b71fcddb7\" style=\"max-width:700px\">\n故正确答案为D。","no":75,"missingImage":false},{"type":"question","qid":"3522444","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使下列正方形图形呈现一定的规律性：\n\u003cimg data-k=\"f35ade5b9f65\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，且无明显属性规律，优先考虑数量规律。观察题干图形，发现图形分割明显，可考虑面数量，但面数量无规律。再次观察发现，分割后的图形三角形较多，且明显存在直角，可考虑单一直角数。题干图形的单一直角数分别为2、3、？、5、6，故？处图形的单一直角数应为4，只有B项符合。\n故正确答案为B。","no":76,"missingImage":false},{"type":"question","qid":"3522445","cat":"类比推理","stem":"下图右侧四个选项中，哪一个不是左侧零件的立面？\n\u003cimg data-k=\"79d9e7152bb8\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题考查三视图。如下图所示，B、C、D三项按图中箭头方向观察，均可看到，排除；A项最上面凹槽处缺少一根线，无法看到，当选。\n\u003cimg data-k=\"573bef853fb5\" style=\"max-width:700px\">\n本题为选非题，故正确答案为A。","no":77,"missingImage":false},{"type":"question","qid":"3523359","cat":"定义判断","stem":"分粥效应是哲学家罗尔斯在《正义论》中讨论社会财富时做的一个比喻，说明只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度。这种制度不但要科学，而且其制定一定要有所依据、简单明了，具有针对性、可操作性，便于执行。\n根据上述定义，假设“M”是某团队一项小福利，下列选项最能体现该定义的是：","options":{"A":"通过选举，由品德高尚的小李主持分“M”，基本公平公正","B":"拟定一人负责分“M”工作，并成立董事会，及时处理问题","C":"选举产生分“M”委员会和监督委员会，有效落实执行和监督","D":"参与者轮流值日分“M”，但主持分“M”者每次必须最后领取"},"answer":"D","explanation":"第一步：找出定义关键词。\n“只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度”、“这种制度不但要科学，而且其制定一定要有所依据、简单明了，具有针对性、可操作性，便于执行”。\n第二步：逐一分析选项。\nA项：由品德高尚的小李主持分“M”，说明小李有了特权，其他人信任小李，不符合“只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度”，小李凭借高尚品德在主持分配，时间长了也可能导致分配不均，说明这种制度不够科学，也不符合“这种制度不但要科学，而且其制定一定要有所依据、简单明了，具有针对性、可操作性，便于执行”，不符合定义，排除； \nB项：拟定一人负责分“M”工作，说明这个人拥有了分“M”的特权，其他人信任负责分配的人，不符合“只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度”，不符合定义，排除；\nC项：选举产生分“M”委员会和监督委员会，说明委员会和监督委员会有了分“M”的特权，其他人信任委员会和监督委员会，不符合“只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度”，不符合定义，排除；\nD项：参与者轮流值日分“M”，说明每个人都有机会主持分配“M”，这样就不存在特权，主持分“M”者每次必须最后领取，说明作为主持者能把自己利益放到最后，这样的分配才会更合理、更公平，符合“只要把制度建立在对每一个人都不信任的基础上，就可以导出合理、具有监管力度的制度”、“这种制度不但要科学，而且其制定一定要有所依据、简单明了，具有针对性、可操作性，便于执行”，符合定义，当选。\n故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"3522418","cat":"定义判断","stem":"文化挪用是指将本不属于本地的异域或其他民族的文化资源借用过来，从而对本地的文化形成影响，创造出新的文化产品的现象。\n根据上述定义，下列属于文化挪用的是：","options":{"A":"某苗族民间工艺组织设计制作的具有苗绣元素的彩绘玻璃、蜡染布等文创作品畅销全国","B":"某法国女生在毕业舞会上穿着优雅别致的印度传统服装纱丽翩翩起舞，让大家大饱眼福","C":"某荷兰社区大学为学生开设中华太极拳课程以增强他们的健身意识，受到学生普遍欢迎","D":"世界之窗展示了众多全球著名景观和建筑成为深圳打卡的地标，是当地热门的旅游景点"},"answer":"D","explanation":"第一步：找出定义关键词。\n“将本不属于本地的异域或其他民族的文化资源借用过来”、“对本地的文化形成影响”、“创造出新的文化产品”。\n第二步：逐一分析选项。\nA项：某苗族民间工艺组织设计制作的具有苗绣元素的文创作品，不符合“将本不属于本地的异域或其他民族的文化资源借用过来”，不符合定义，排除；\nB项：某法国女生穿着印度传统服装纱丽翩翩起舞，符合“将本不属于本地的异域或其他民族的文化资源借用过来”，但让大家大饱眼福，不符合“创造出新的文化产品”，不符合定义，排除；\nC项：某荷兰社区大学为学生开设中华太极拳课程，符合“将本不属于本地的异域或其他民族的文化资源借用过来”，但是并没有“对本地的文化形成影响”、“创造出新的文化产品”，不符合定义，排除；\nD项：世界之窗展示了众多全球著名景观和建筑，符合“将本不属于本地的异域或其他民族的文化资源借用过来”，成为当地热门的旅游景点，符合“对本地的文化形成影响”、“创造出新的文化产品”，符合定义，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"3522394","cat":"定义判断","stem":"迎臂效应也被称为“请到我家后院来”。从表面意思来看，迎臂就是张开双臂欢迎的意思，是指某个地区的居民认为相关机构、设施、景观具有正的外部效应，能给本社区发展带来好处，因此，不排斥甚至欢迎这些项目在本社区落地。\n根据上述定义，下列选项属于迎臂效应的是：","options":{"A":"群众深度参与，点赞街道残障康复中心成立","B":"公司升级业态，积极在社区推广无人零售店","C":"新设备耗电低，企业要求园区加快引进速度","D":"加气站易漏气，附近居民担心火灾要求搬迁"},"answer":"A","explanation":"第一步：找出定义关键词。\n“某个地区的居民”、“认为相关机构、设施、景观具有正的外部效应，能给本社区发展带来好处”、“不排斥甚至欢迎这些项目在本社区落地”。\n第二步：逐一分析选项。\nA项：群众深度参与，符合“某个地区的居民”，点赞街道残障康复中心成立，说明群众认可、十分欢迎，符合“认为相关机构、设施、景观具有正的外部效应，能给本社区发展带来好处”，也符合“不排斥甚至欢迎这些项目在本社区落地”，符合定义，当选；\nB项：公司升级业态，积极在社区推广无人零售店，没有体现出被推广社区居民的态度，是否欢迎，不符合定义，排除；\nC项：新设备耗电低，企业要求园区加快引进速度，园区不是社区，企业也不是社区居民，不符合“某个地区的居民”，不符合定义，排除；\nD项：加气站易漏气，附近居民担心火灾要求搬迁，是居民害怕带来危险，不符合“认为相关机构、设施、景观具有正的外部效应，能给本社区发展带来好处”、“不排斥甚至欢迎这些项目在本社区落地”，不符合定义，排除。\n故正确答案为A。","no":80,"missingImage":false},{"type":"question","qid":"3522430","cat":"定义判断","stem":"拟剧理论指人与人在社会生活中的相互行为在某种程度上是一种表演。每一个人就像演员一样，在某种特定的场景下，按照一定的角色要求在舞台上表演给观众看。在整个表演过程中，人总是尽量使自己的行为更为接近想要呈现给观众的那个角色，观众看到的是那个表现出来的角色而不是演员本身。当表演结束，演员回到后台以后，他的真实面目才展现出来，演员才又恢复其本来的自我。\n根据上述定义，下列选项不能印证拟剧理论的是：","options":{"A":"小丽来找小明探讨功课，小明没有立刻开门，而是先把臭袜子藏到床下","B":"在“国王的新装”故事里，新装展示游行时臣民交口称赞新装华贵美丽","C":"小魏生活拮据但工作努力，老板不动声色地开豪车替其去机场接其父母","D":"小菲通过盗图和拼接，天天在微信朋友圈发吃美食、健身、游玩的照片"},"answer":"C","explanation":"第一步：找出定义关键词。\n“人与人的相互行为某种程度上是种表演”、“使自己的行为接近想要呈现的角色”、“观众看到的是角色而不是演员本身”、“表演结束后，恢复本来的自我”。\n第二步：逐一分析选项。\nA项：小明没有立刻开门，而是先把臭袜子藏到床下，说明他不想被小丽看到自己邋遢的一面，符合“使自己的行为接近想要呈现的角色”、“观众看到的是角色而不是演员本身”，符合定义，排除；\nB项：在“国王的新装”故事里，国王实际没有穿衣服，但是臣民交口称赞新装华贵美丽，符合“人与人的相互行为某种程度上是种表演”，符合定义，排除；\nC项：小魏生活拮据工作努力，但是开豪车接父母的人是老板不是小魏，没有体现二者的行为是表演出来的，不符合“人与人的相互行为某种程度上是种表演”，不符合定义，当选；\nD项：小菲天天在微信朋友圈发照片是通过盗图和拼接，说明朋友圈呈现的并非她的真实生活，符合“使自己的行为接近想要呈现的角色”、“观众看到的是角色而不是演员本身”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":81,"missingImage":false},{"type":"question","qid":"3523358","cat":"定义判断","stem":"产城融合是指产业园区与城市融合发展，以城市为基础，承载产业空间和发展产业经济，以产业为保障，驱动城市更新和完善服务配套，进一步提升土地价值，以达到产业、城市、人之间有活力、持续向上发展的模式。它一般由四个阶段组成，从“生产聚集”到“产业主导”，再到“产业完善”，最后完成“产城融合”。其核心就是促进居住和就业的融合，即居住人群和就业人群结构的匹配。\n根据上述定义，下列选项属于产城融合的是：","options":{"A":"某市为避免污染影响居民生活，将药厂移至城郊新建的产业园","B":"某市出台相关政策吸引高校毕业生到新建的产业园创业、就业","C":"某市利用网络平台招商引资计划在郊区新建一个电子产业园区","D":"某市在成熟的产业园周边地区开发很多配套设施齐全的新楼盘"},"answer":"D","explanation":"第一步：找出定义关键词。\n“产业园区与城市融合发展，以城市为基础，以产业为保障”、“促进居住和就业的融合，即居住人群和就业人群结构的匹配”。\n第二步：逐一分析选项。\nA项：某市将药厂移至城郊新建的产业园，其目的是为了避免污染影响居民生活，不符合“促进居住和就业的融合，即居住人群和就业人群结构的匹配”，不符合定义，排除；\nB项：某市出台相关政策吸引毕业生到新建的产业园创业、就业，其目的是为了吸引毕业生在产业园创业、就业，没有提到居住人群，不符合“促进居住和就业的融合，即居住人群和就业人群结构的匹配”，不符合定义，排除；\nC项：某市利用网络平台招商引资计划新建电子产业园区，其目的是为了建立电子产业园，没有提到居住人群，不符合“促进居住和就业的融合，即居住人群和就业人群结构的匹配”，不符合定义，排除；\nD项：某市在成熟的产业园周边开发了配套设施齐全的新楼盘，体现了“产业园区与城市融合发展，以城市为基础，以产业为保障”，且在产业园区周边建立新楼盘，可以保障在产业园区就业、在新开发楼盘居住，符合“促进居住和就业的融合，即居住人群和就业人群结构的匹配”，符合定义，当选。\n故正确答案为D。","no":82,"missingImage":false},{"type":"question","qid":"3522393","cat":"定义判断","stem":"色素色是指有机色素通过选择性地吸收、反射和投射特定频率的光线后直观呈现出的颜色。结构色又称物理色，是指通过可见光与物质物理上的微观结构（如物体表面或表层的纹、刻点、沟缝或颗粒等）发生相互作用，这些大量的微观有序结构对不同波长的光散射、衍射或干涉后产生的各种颜色。\n根据上述定义，下列颜色属于色素色的是:","options":{"A":"用激光束刻录的光盘上的彩色花纹","B":"蝴蝶翅膀上的鳞片呈现出五颜六色","C":"阳光下肥皂泡泡呈现缤纷的虹彩色","D":"用乌饭树叶捣汁煮出的糯米饭呈现黑色"},"answer":"D","explanation":"第一步：找出定义关键词。\n色素色：“有机色素”、“通过选择性地吸收、反射和投射特定频率的光线后直观呈现出的颜色”；\n结构色：“通过可见光与物质物理上的微观结构（如物体表面或表层的纹、刻点、沟缝或颗粒等）发生相互作用”、“这些大量的微观有序结构对不同波长的光散射、衍射或干涉后产生的各种颜色”。\n第二步：逐一分析选项。\nA项：用激光束刻录的光盘上的彩色花纹，光盘本身的颜色是单一色，而光盘上的彩色花纹是由于光盘表面的特殊结构对光散射、衍射或干涉形成的，符合“通过可见光与物质物理上的微观结构（如物体表面或表层的纹、刻点、沟缝或颗粒等）发生相互作用”、“这些大量的微观有序结构对不同波长的光散射、衍射或干涉后产生的各种颜色”，符合结构色的定义，不符合色素色的定义，排除；\nB项：蝴蝶翅膀上的鳞片呈现出五颜六色，主要是由于鳞片表面凹凸不平的奇特构造，使光线发生反射、折射或干涉等光学作用而产生，符合“通过可见光与物质物理上的微观结构（如物体表面或表层的纹、刻点、沟缝或颗粒等）发生相互作用”、“这些大量的微观有序结构对不同波长的光散射、衍射或干涉后产生的各种颜色”，符合结构色的定义，不符合色素色的定义，排除；\nC项：阳光下肥皂泡泡呈现缤纷的虹彩色，肥皂泡本身是无色的，在阳光的照耀下呈现出虹彩色是由于肥皂泡表面的膜产生的，符合“通过可见光与物质物理上的微观结构（如物体表面或表层的纹、刻点、沟缝或颗粒等）发生相互作用”、“这些大量的微观有序结构对不同波长的光散射、衍射或干涉后产生的各种颜色”，符合结构色的定义，不符合色素色的定义，排除；\nD项：用乌饭树叶捣汁煮出的糯米饭呈现黑色，主要是因为乌饭树叶中的色素与糯米饭中的蛋白质发生了一系列复杂反应，生成物可以吸收绝大部分光，所以呈现出来是黑色的，符合“有机色素”、“通过选择性地吸收、反射和投射特定频率的光线后直观呈现出的颜色”，符合色素色的定义，当选。\n故正确答案为D。","no":83,"missingImage":false},{"type":"question","qid":"3522428","cat":"定义判断","stem":"价值链的数字重生指价值链的某个必要环节以数字化方式呈现，以数据实时在线为基础推动价值链的实现。价值链的数字新生是以新定义的用户价值为中心、数据实时在线为基础，融合新价值链要素，创造全新价值链结构。\n根据上述定义，下列哪项属于价值链的数字重生？","options":{"A":"为给用户带来全新的旅行前、旅行中和旅行后的服务体验，立体化整合旅游目的地的资源要素","B":"依靠在线实时数据，使美食供应商更便利精准地了解用户的美食习惯，开拓新颖的服务渠道","C":"电商平台通过发布商品信息和销售实时动态，使消费者在选购时可以查询货物即时情况","D":"核电设备的数字三维模型可以为设计、制造、运行以及维护等多个环节带来价值增长点"},"answer":"C","explanation":"第一步：找出定义关键词。\n价值链的数字重生：“某个必要环节以数字化方式呈现”、“数据实时在线为基础”、“推动价值链的实现”；\n价值链的数字新生：“用户价值为中心”、“数据实时在线为基础”、“融合新价值链要素”、“创造全新价值链结构”。\n第二步：逐一分析选项。\nA项：整合资源给用户带来全新的旅行前、旅行中和旅行后的服务体验，不符合“某个必要环节以数字化方式呈现”，且没有提到“数据的实时在线”，不符合价值链的数字重生的定义，排除；\nB项：依靠在线实时数据，符合“数据实时在线为基础”，开拓新颖的服务渠道，是对价值链的创新，不符合“推动价值链的实现”，不符合价值链的数字重生的定义，排除；\nC项：电商平台发布商品信息和销售实时动态，符合“数据实时在线为基础”，消费者在选购时可以查询货物即时情况，符合“某个必要环节以数字化方式呈现”，符合价值链的数字重生的定义，当选；\nD项：核电设备的数字三维模型可以为多个环节带来价值增长点，不符合“数据实时在线为基础”，不符合价值链的数字重生的定义，排除。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"3522406","cat":"定义判断","stem":"人合公司是指以股东的个人信用为公司信用基础的公司；资合公司是指由公司股东分别出资而形成的财产作为信用基础的公司；人资兼合公司则同时具备上述两种性质的信用基础。\n根据上述定义，下列哪个公司属于人合公司：","options":{"A":"某公司注册资本为全体股东缴纳股本的总和，股东的出资以现金及财产为限，根据出资对公司负责","B":"某公司的全部股份由公司独立创立者百分百持有，公司聘请多位经验丰富的职业经理人分管不同业务","C":"某公司由于经营不善导致资金链断裂，在申请破产时以全部注册资本作数，股东个人财产并不受影响","D":"某公司的资产以股东个人的所有财产为抵押，股东对公司经营负无限责任，并且不能任意地转让股份"},"answer":"D","explanation":"第一步：找出定义关键词。\n人合公司：“以股东的个人信用为公司信用基础”；\n资合公司：“由公司股东分别出资而形成的财产作为信用基础”；\n人资兼合公司：同时以“股东的个人信用”和“股东分别出资而形成的财产”作为信用基础。\n第二步：逐一分析选项。\nA项：某公司注册资本为全体股东缴纳股本的总和，符合“公司股东分别出资而形成的财产”，属于资合公司，不属于人合公司，排除；\nB项：某公司的全部股份由公司独立创立者百分百持有，但是公司聘请多位经验丰富的职业经理人分管不同业务，不符合“以股东的个人信用为公司信用基础”，不属于人合公司，排除；\nC项：股东个人财产并不受影响，说明不符合“以股东的个人信用为公司信用基础”，不属于人合公司，排除；\nD项：以股东个人的所有财产为抵押，股东对公司经营负无限责任，符合“以股东的个人信用为公司信用基础”，属于人合公司，当选。\n故正确答案为D。","no":85,"missingImage":false},{"type":"question","qid":"3522388","cat":"类比推理","stem":"巴蜀：燕赵","options":{"A":"京津：淮海","B":"闽越：荆湘","C":"齐鲁：秦晋","D":"殷商：云贵"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“巴蜀”指的是巴国和蜀国，“燕赵”指的是燕国和赵国，四者都属于中国历史上存在的国家，为并列关系中的反对关系。\n第二步：判断选项词语间逻辑关系。\nA项：“京津”指的是北京和天津，“淮海”指的是以徐州为中心的淮河以北及海州（今连云港市西南）一带的地区，并不是国家，与题干逻辑关系不一致，排除；\nB项：“闽越”指的是闽越国，“荆湘”指的是长江中游地区的江汉—洞庭湖平原，并不全是国家，与题干逻辑关系不一致，排除；\nC项：“齐鲁”指的是齐国和鲁国，“秦晋”指的是秦国和晋国，四者都属于中国历史上存在的国家，为并列关系中的反对关系，与题干逻辑关系一致，当选；\nD项：“殷商”指的商朝，“云贵”指的是云南和贵州地区，并不是国家，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":86,"missingImage":false},{"type":"question","qid":"3522378","cat":"类比推理","stem":"戊：己：庚","options":{"A":"钠：镁：铝","B":"寅：卯：巳","C":"牛：虎：龙","D":"秦：汉：隋"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n天干是中国古代的一种文字计序符号，其包括：甲、乙、丙、丁、戊、己、庚、辛、壬、癸，被称为“十天干”。戊、己、庚是“十天干”中的三个，三者是并列关系，且三者在天干中排列紧密连续。\n第二步：判断选项词语间逻辑关系。\nA项：钠、镁、铝是元素周期表中的三个元素，三者是并列关系，且三者在元素周期表中排列紧密连续，与题干逻辑关系一致，当选；\nB项：寅、卯、巳是古代十二地支中的三个地支，三者是并列关系，但三者在十二地支中的排列并不是紧密连续的，与题干逻辑关系不一致，排除；\nC项：牛、虎、龙是十二生肖中的三个生肖，三者是并列关系，但三者在十二生肖中的排列并不是紧密连续的，与题干逻辑关系不一致，排除；\nD项：秦、汉、隋是我国古代的三个朝代，三者是并列关系，但三者在古代朝代中的排列并不是紧密连续的，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"3522391","cat":"类比推理","stem":"握瑜：怀瑾：美玉","options":{"A":"南辕：北辙：马车","B":"金戈：铁马：战争","C":"敲金：击石：乐器","D":"锦衣：玉食：珍馐"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“瑜”和“瑾”指美玉，且握瑜和怀瑾都是动宾结构。\n第二步：判断选项词语间逻辑关系。\nA项：“辕”指车前驾牲畜的两根直木，“辙”指车轮压的痕迹，二者均不能用来指马车，且南辕和北辙都不是动宾结构，与题干逻辑关系不一致，排除；\nB项：“戈”指古代的一种兵器，“马”指马匹，二者均不能直接指战争，且金戈和铁马都不是动宾结构，与题干逻辑关系不一致，排除；\nC项：“金”和“石”指钟磬一类的乐器，且敲金和击石均为动宾结构，与题干逻辑关系一致，当选；\nD项：“衣”指衣服，“食”指食物，二者均不能用来指珍馐，且锦衣和玉食都不是动宾结构，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":88,"missingImage":false},{"type":"question","qid":"3523356","cat":"类比推理","stem":"区块链 对于 （    ） 相当于 （    ） 对于 核电站","options":{"A":"密码学；反应堆","B":"比特币；放射性","C":"云平台；常规岛","D":"物联网；原子能"},"answer":"D","explanation":"逐一代入选项。\nA项：区块链使用密码学技术，二者为应用与技术的对应关系，反应堆是核电站中的装置之一，二者为组成关系，前后逻辑关系不一致，排除；\nB项：比特币使用区块链技术，核电站使用的部分物质具有放射性，前后逻辑关系不一致，排除；\nC项：云平台使用区块链技术，二者为技术与应用的对应关系，常规岛是核电装置中汽轮发电机组及其配套设施和它们所在厂房的总称，属于核电站的一部分，二者为组成关系，前后逻辑关系不一致，排除；\nD项：物联网使用区块链技术，核电站使用原子能技术，均为技术与应用的对应关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":89,"missingImage":false},{"type":"question","qid":"3522404","cat":"类比推理","stem":"晕轮效应 对于 （    ） 相当于 （    ） 对于 变本加厉","options":{"A":"扬长避短 墨菲定理","B":"以偏概全 破窗效应","C":"欲扬先抑 增减效应","D":"举一反三 蝴蝶效应"},"answer":"B","explanation":"逐一代入选项。\nA项：“晕轮效应”是指在人际知觉中所形成的以点概面或以偏概全的主观印象，其本质是一种用片面的观点看待整体问题的认知偏误；“扬长避短”是指发扬优点、回避缺点，二者没有明显逻辑关系。“墨菲定理”的根本内容是：如果事情有变坏的可能，不管这种可能性有多小，它总会发生；“变本加厉”指情况变得比本来更加严重，二者没有明显逻辑关系。前后逻辑关系不一致，排除；\nB项：“以偏概全”是指片面地根据局部现象来推论整体，得出错误的结论，是“晕轮效应”的本质；“破窗效应”是指环境中的不良现象如果被放任存在，会诱使人们仿效，甚至变本加厉，“变本加厉”是其本质，前后逻辑关系一致，当选；\nC项：“欲扬先抑”是指要发扬、放开，就要先控制、压抑，与“晕轮效应”之间没有明显逻辑关系；“增减效应”是指人们最喜欢那些对自己的喜欢显得不断增加的人，最不喜欢那些对自己的喜欢显得不断减少的人，与“变本加厉”之间没有明显逻辑关系，前后逻辑关系不一致，排除；\nD项：“举一反三”是指从懂得的一点，类推而知道其他，与“晕轮效应”之间没有明显逻辑关系；“蝴蝶效应”是指初始条件下微小的变化能带动整个系统的长期的巨大的连锁反应，与“变本加厉”之间没有明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":90,"missingImage":false},{"type":"question","qid":"3522462","cat":"逻辑判断","stem":"越来越多的人已经习惯于在“云端”漫步，享受快速发展带来的成果，却不见：德国正在推进“工业4.0”计划，美国正在呼唤“再工业化”；却不知：没有强大的生产制造能力、创新设计能力，国计民生就没有保障，国家实力就无从谈起，“互联网\u003cimg data-k=\"3d6d1f96db11\">”也就只能是空中楼阁；却不思：只醉心于虚拟经济是靠不住的。越是在宏观层面，越要充分认识到互联网的诸多局限性。\n如果以上为真，则以下哪项为真？","options":{"A":"“互联网\u003cimg data-k=\"3d6d1f96db11\">”使很多人沉迷于虚拟经济","B":"“互联网\u003cimg data-k=\"3d6d1f96db11\">”在微观层面的局限性更少","C":"只有国计民生得到保障，才能发展“互联网\u003cimg data-k=\"3d6d1f96db11\">”","D":"只有提高生产制造和创新设计能力，才能发展“互联网\u003cimg data-k=\"3d6d1f96db11\">”"},"answer":"D","explanation":"第一步：翻译题干。\n①\u003cimg data-k=\"e752a8ae1a16\">强大的生产制造能力、创新设计能力\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">国计民生有保障\n②\u003cimg data-k=\"e752a8ae1a16\">强大的生产制造能力、创新设计能力\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">国家实力\n③\u003cimg data-k=\"e752a8ae1a16\">强大的生产制造能力、创新设计能力\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">“互联网\u003cimg data-k=\"3d6d1f96db11\">”\n第二步：逐一分析选项。\nA项：题干只涉及醉心于虚拟经济靠不住，并不涉及“互联网\u003cimg data-k=\"3d6d1f96db11\">”和使很多人沉迷于虚拟经济的关系，无法推出，排除；\nB项：题干只涉及在宏观层面要充分认识到互联网的局限性，并不涉及“互联网\u003cimg data-k=\"3d6d1f96db11\">”在微观层面的局限性，无法推出，排除；\nC项：翻译为发展“互联网\u003cimg data-k=\"3d6d1f96db11\">”\u003cimg data-k=\"2dfb7d1f72f3\">国计民生有保障，两者不存在推出关系，排除；\nD项：翻译为发展“互联网\u003cimg data-k=\"3d6d1f96db11\">”\u003cimg data-k=\"2dfb7d1f72f3\">提高生产制造、创新设计能力，是对③的否后，否后必否前，可以推出，当选。\n故正确答案为D。","no":91,"missingImage":false},{"type":"question","qid":"3522380","cat":"逻辑判断","stem":"如果一片森林的树木物种多样性非常丰富，那么这时缺失一个物种对于整个森林的生产力来讲，影响还并不是太大；但在物种多样性越稀缺的时候，树的种类继续变少，对整个森林生产力产生的打击就会越来越大。\n由此可以推出：","options":{"A":"除非树木物种多样性锐减，整个森林的生产力不会受到影响","B":"只要森林的树木物种减少，整个森林的生产力就会受到影响","C":"如果森林的生产力下降，那么森林的树木物种多样性就已经受损","D":"要么森林的树木物种多样性非常丰富，要么森林的生产力非常可观"},"answer":"C","explanation":"第一步：翻译题干。\n①物种多样性丰富\u003cimg data-k=\"2dfb7d1f72f3\">对森林生产力影响不大\n注：题干第一句话可以理解为“如果一片森林的树木物种多样性非常丰富，（即使缺失一个物种），对于整个森林的生产力影响还并不是太大”\n如果A，即使B，那么C。此处的“即使B”不是充要条件，可以忽略，最后翻译为A\u003cimg data-k=\"a37757d411ef\">C即可。例.如果你不好好学习，即使你再聪明，也不能圆梦，翻译为\u003cimg data-k=\"0be436194951\">好好学习\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">圆梦。\n第二步：逐一分析选项。\n\nA项：翻译为森林生产力受影响\u003cimg data-k=\"2dfb7d1f72f3\">物种多样性锐减（即“\u003cimg data-k=\"e752a8ae1a16\">物种多样性丰富”），仅根据“森林生产力受影响”无法判断影响的大小，无法推出，排除；\nB项：翻译为树木物种减少\u003cimg data-k=\"2dfb7d1f72f3\">森林生产力受影响，仅根据“树木物种减少”无法判断是减少一种还是多种，是否影响树木物种丰富性，无法推出，排除；\nC项：翻译为森林的生产力下降（即“对森林生产力影响大”）\u003cimg data-k=\"2dfb7d1f72f3\">树木物种多样性受损（即“树木物种多样性不丰富”），是对题干①的否后推否前，可以推出，当选；\nD项：“要么···要么···”表示两者之间只能成立一个且必须成立一个，题干重点论述的是“树木物种多样性”对“森林的生产力”的影响，而不是二者只能有一种情况发生，无法推出，排除。\n故正确答案为C。","no":92,"missingImage":false},{"type":"question","qid":"3522405","cat":"逻辑判断","stem":"吴老师、张老师、孙老师、苏老师都是某校教师，分别教授语文、生物、物理、化学四门课程。\n已知：\n①如果吴老师教语文，那么张老师不教生物\n②或者孙老师教语文，或者吴老师教语文\n③如果张老师不教生物，那么苏老师不教物理\n④或者吴老师不教化学，或者苏老师教物理\n以下哪项如果为真，可以推出孙老师教语文：","options":{"A":"吴老师教语文","B":"张老师不教生物","C":"吴老师教化学","D":"苏老师不教物理"},"answer":"C","explanation":"第一步：翻译题干。\n①吴老师教语文\u003cimg data-k=\"1ea22d0695fd\">张老师教生物；\n②孙老师教语文或者吴老师教语文；\n③\u003cimg data-k=\"e752a8ae1a16\">张老师教生物\u003cimg data-k=\"1ea22d0695fd\">苏老师教物理；\n④\u003cimg data-k=\"e752a8ae1a16\">吴老师教化学或者苏老师教物理。\n第二步：逐一分析选项。\n提问为“推出孙老师教语文”，本题是给出了结论，需要从结论出发倒推条件。\n根据条件②可知：想要推出“孙老师教语文”，需要吴老师不教语文；\n根据条件①可知：想要得到“吴老师不教语文”，需要张老师教生物；\n根据条件③可知：想要得到“张老师教生物”，需要苏老师教物理；\n根据条件④可知：想要得到“苏老师教物理”，需要吴老师教化学。\n即：想要推出“孙老师教语文”，需要吴老师教化学。\n故正确答案为C。","no":93,"missingImage":false},{"type":"question","qid":"3522402","cat":"逻辑判断","stem":"最近有研究团队以问卷调查的方式，调查了519名从未吸过传统香烟，年龄在18岁至25岁间的年轻人，调查内容包括这些年轻人吸电子烟的情况和吸传统香烟的意向等，研究报告称，在从未吸过传统香烟的年轻人中，那些正在吸电子烟的人更可能尝试传统香烟，有关电子烟的监管政策要注意保护年轻人。\n以下各项如果为真，最能支持上述结论的是：","options":{"A":"受访者中有20%的人尝试过电子烟或未来很可能会尝试电子烟","B":"即使只尝了两三口电子烟，也有可能提高吸传统香烟的可能性","C":"受访者中正在吸电子烟的有60%表示未来一定会尝试传统香烟","D":"电子烟对健康的危害比传统香烟小，但仍然含有很多有害物质"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：在从未吸过传统香烟的年轻人中，那些正在吸电子烟的人更可能尝试传统香烟，有关电子烟的监管政策要注意保护年轻人。\n论据：无。\n本题只有论点，没有论据，优先考虑补充论据加强，即解释或举例证明“正在吸电子烟的年轻人更可能尝试传统香烟”。\n第二步：逐一分析选项。\nA项：论点说的是更可能尝试传统香烟，该项说的是有多少人尝试过电子烟，以及未来可能会尝试，话题不一致，无法加强，排除；\nB项：选项表明吸电子烟的人相比于不吸电子烟的人而言，更可能吸传统香烟，该项是针对论点的可能性加强，属于补充论据，保留；\nC项：该项表明受访者中正在吸电子烟的有60%表示未来一定会尝试传统香烟，该项比B项加强力度更大，原因有二：\n一是题干论点强调保护年轻人，而C项的受试者正是年轻人，表明的是吸电子烟的年轻人的意愿，B项没分，年纪大小都可以，那为什么不保护年纪大的，而要特别保护年轻人呢？\n二是如下图原文所示，C项把原文中的“可能或肯定”，改为“一定”，应该是为了区分B的可能，综上C项更有可能是出题人想设置的正确答案；\n\u003cimg data-k=\"03b2d40a5263\" style=\"max-width:700px\">\nD项：论点说的是正在吸电子烟的年轻人更可能尝试传统香烟，该项说的是电子烟的危害，话题不一致，无法加强，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"3523354","cat":"逻辑判断","stem":"不粘锅常见的不粘涂层为特氟龙涂层。全氟辛酸铵是特氟龙生产过程中使用的含量极微的一种加工助剂。数据表明，高剂量的全氟辛酸铵有可能导致胆固醇水平升高、甲状腺疾病及不育。特氟龙在常温及常态下具有非常稳定的理化性质，使用特氟龙不粘涂层的炊具在常温至\u003cimg data-k=\"1eab253ea834\">的温度范围内都不会发生任何变化，但是当温度超过\u003cimg data-k=\"1eab253ea834\">时，涂层逐渐向不稳定状态转变，当温度超过\u003cimg data-k=\"5b75dc9fdda1\">时会发生分解。正常烹调时，水的沸点是\u003cimg data-k=\"92a92f9896db\">，温度较高的爆炒通常也只是\u003cimg data-k=\"1392500f686a\">左右，即使采用油炸的方式，油温也不会超过\u003cimg data-k=\"ee811da577b4\">。然而，如果在炒菜时喜欢把锅烧干、烧红后再加油，锅内温度就容易超过\u003cimg data-k=\"1eab253ea834\">。\n由此无法推出的是：","options":{"A":"日常生活中，可以用不粘锅来烧开水和煮粥","B":"烹饪时不粘涂层分解会导致胆固醇水平升高","C":"炒菜时应避免把不粘锅烧干、烧红后再加油","D":"正常烹调通常无需担心不粘锅释放有害物质"},"answer":"B","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干“正常烹调时，水的沸点是\u003cimg data-k=\"92a92f9896db\">，温度较高的爆炒通常也只是\u003cimg data-k=\"1392500f686a\">左右，即使采用油炸的方式，油温也不会超过\u003cimg data-k=\"ee811da577b4\">”，可知烧水等正常烹调不会超过\u003cimg data-k=\"1eab253ea834\">，说明特氟龙不粘涂层不会发生分解，可以推出可以用不粘锅来烧开水和煮粥，排除；\nB项：题干中指出高剂量的全氟辛酸铵有可能导致胆固醇水平升高、甲状腺疾病及不育，但是题干中也指出“全氟辛酸铵是特氟龙生产过程中使用的含量极微的一种加工助剂”，因此涂层中的全氟辛酸铵剂量是否达到了能够导致胆固醇水平升高的剂量不明确，同时“高剂量的全氟辛酸铵有可能导致胆固醇水平升高”，也不是一定会导致胆固醇水平升高，无法推出，当选；\nC项：根据题干“如果在炒菜时喜欢把锅烧干、烧红后再加油，锅内温度就容易超过\u003cimg data-k=\"1eab253ea834\">”，可知炒菜时把不粘锅烧干、烧红后再加油会导致锅内温度超过\u003cimg data-k=\"1eab253ea834\">，此时特氟龙不粘涂层会向不稳定状态转变，因此应避免此做法，可以推出炒菜时应避免把不粘锅烧干、烧红后再加油，排除；\nD项：根据题干“正常烹调时，水的沸点是\u003cimg data-k=\"92a92f9896db\">，温度较高的爆炒通常也只是\u003cimg data-k=\"1392500f686a\">左右，即使采用油炸的方式，油温也不会超过\u003cimg data-k=\"ee811da577b4\">”，可知正常烹调不会超过\u003cimg data-k=\"1eab253ea834\">，说明特氟龙不粘涂层不会发生分解，可以推出正常烹调通常无需担心不粘锅释放有害物质，排除。\n本题为选非题，故正确答案为B。","no":95,"missingImage":false},{"type":"question","qid":"3522461","cat":"逻辑判断","stem":"近几年，一些大城市的社区银行频频出现关门潮。与此同时，无人银行、5G银行、智能银行等一系列新概念银行不断出现，银行网点正在告别冷冰冰的玻璃柜台和金属板凳，传统网点交易处理的功能变弱了，定制服务、产品体验、社交互动等功能越来越突出。因此，有专家预测：二十年内，传统银行网点会消失。\n以下各项如果为真，最能支持上述专家观点的是：","options":{"A":"客户需进门取号、等待叫号，办理一项简单的业务耗费较长时间","B":"人工智能等科技手段的引进，改变了人们对银行网点的固有印象","C":"复杂业务必须到银行网点面签办理，如开户、销户等需本人办理且务必人工审核","D":"网上银行、手机银行等接连涌现，银行网点作为服务主渠道的地位正在不断弱化"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：二十年内，传统银行网点会消失。\n论据：近几年，一些大城市的社区银行频频出现关门潮。与此同时，无人银行、5G银行、智能银行等一系列新概念银行不断出现，银行网点正在告别冷冰冰的玻璃柜台和金属板凳，传统网点交易处理的功能变弱了，定制服务、产品体验、社交互动等功能越来越突出。\n本题论点讨论的是传统银行网点会消失，论据陈述了传统银行的一些现状，论点和论据讨论的话题一致，加强可以考虑补充论据。\n第二步：逐一分析选项。\nA项：办理一项简单的业务耗费较长时间，讨论的是办理业务时间长短的问题，不能得出传统银行网点会消失的结论，无法加强，排除；\nB项：人工智能等科技手段改变了人们对银行网点的固有印象，和论点讨论的传统银行网点是否会消失无关，无法加强，排除；\nC项：复杂业务必须到银行网点面签办理，说明传统银行网点很重要，不会消失，削弱论点，无法加强，排除；\nD项：银行网点地位弱化，补充论据解释了传统银行网点会消失的原因，可以加强，当选。\n故正确答案为D。","no":96,"missingImage":false},{"type":"question","qid":"3523362","cat":"逻辑判断","stem":"某大学研究人员首次用嗜黏蛋白阿克曼氏菌进行小规模人体试验。32名超重或肥胖的志愿者被分为3组，分别每天口服活的嗜黏蛋白阿克曼氏菌、经过巴氏消毒法灭活的这种细菌和安慰剂，同时不改变饮食和运动习惯。结果显示，3个月后服用灭活细菌的志愿者对胰岛素敏感性提高，血浆总胆固醇水平降低。服用安慰剂的志愿者体内上述指标继续恶化。\n由此可以推出：","options":{"A":"服用该灭活菌能改善人体的代谢状况","B":"该菌灭活后降低糖尿病的效果甚至好于活细菌","C":"服用该菌能够降低罹患心血管疾病和糖尿病的风险","D":"肥胖者可以将该灭活菌作为膳食补充剂达到减肥的目的"},"answer":"A","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据试验结果可知，服用该灭活细菌可以降低血浆总胆固醇水平，而服用安慰剂的一组这一指标持续恶化，说明服用该灭活细菌可以改善以上指标，由于血浆总胆固醇水平是人体的代谢指标之一，所以可以合理推出服用该灭活细菌能改善人体的代谢状况，当选；\nB项：在题干的试验结果中，没有对比服用灭活细菌和服用活细菌的试验结果，所以无法得出将这两组进行比较的相关结论，无中生有，排除；\nC项：在题干的试验结果中，只提及了服用灭活细菌和安慰剂之后的结果，并未提及服用“活细菌”之后的结果，所以无法得出服用“该菌（即活细菌）”能够降低罹患心血管疾病和糖尿病的风险，排除；\nD项：在题干的试验结果中，只说明了胰岛素敏感性和血浆总胆固醇水平的相关结果，这两者与“减肥”都没有必然关系，不能合理推出，排除。\n故正确答案为A。\n注：本题题干用“活细菌”、“灭活细菌”、“安慰剂”三者做试验，却只给出“灭活细菌”和“安慰剂”的结果，没有给出“活细菌”的结果，而C项直接说服用“该菌”的结果，属于无中生有，这是本题的坑点所在。\nA选项在相关原文中表述如下图1，通过原文不难发现，文段的主题词是“灭活菌”，而非“活细菌”；另外如下图2所示，选项的用词很讲究，如果想说灭活菌，就会直接表述成“该灭活菌”，而B、C两项的“该菌”，其实就是指“活细菌”，故小粉笔倾向把答案给到A项。\n\u003cimg data-k=\"0de4931ea858\" style=\"max-width:419px\">\u003cimg data-k=\"c63793e2f4b7\" style=\"max-width:442px\">","no":97,"missingImage":false},{"type":"question","qid":"3522385","cat":"逻辑判断","stem":"某科学家在一个宇宙科学网站上刊载了一项成果，该成果宣称找到了地球生命来自彗星的“证据”，引发了广泛关注。他声称在一块坠落到斯里兰卡的陨石里找到了微观硅藻化石，该石头有着疏松多孔的结构，密度比在地球上找到的所有东西都低。他推断这是一颗彗星的一部分，并指出样本中找到的微观硅藻化石与恐龙时代留存下来的化石中的微观有机体类似，从而为彗星胚种论提供了强有力的证据。\n以下哪项如果为真，最能反驳该科学家的观点？","options":{"A":"发表该成果的网站缺乏可信性，所载论文良莠不齐，有些曾沦为笑柄","B":"该科学家是彗星胚种论的狂热支持者，曾宣称SARS和流感来自彗星","C":"该成果配图中被标示成“丝状硅藻”的东西实际上只是硅藻细胞断片","D":"该成果根本无法证明该石头是碳质球粒陨石，甚至难以确定其是陨石"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：地球生命来自彗星。\n论据：一块坠落到斯里兰卡的陨石里找到了微观硅藻化石，该石头有着疏松多孔的结构，密度比在地球上找到的所有东西都低。他推断这是一颗彗星的一部分，并指出样本中找到的微观硅藻化石与恐龙时代留存下来的化石中的微观有机体类似，从而为彗星胚种论提供了强有力的证据。\n本题的论据说的是陨石找到的微观硅藻化石与恐龙时代留存下来的化石中的微观有机体类似，同时该研究还推断该陨石是一颗彗星的一部分，即说明该陨石（彗星的一部分）与生命有关系，而论点说的是地球生命来自彗星，所以，二者讨论话题一致，削弱可以考虑削弱论点，也可以考虑削弱论据。\n第二步：逐一分析选项。\nA项：该成果的网站缺乏可信性，所载论文良莠不齐，代表不了这次实验成果的可靠性，属于无关项，排除；\nB项：只是说该科学家是彗星胚种论的狂热支持者，支持者说的话无法辨别真假，同时即便SARS和流感来自彗星，也无法判断生命是否来源于彗星，不明确选项，排除；\nC项：选项是说配图中的东西本质是硅藻细胞断片，一定程度上质疑了题干研究成果的可信性，可能削弱论据，保留；\nD项：该成果根本无法证明该石头是陨石，直接质疑了论据的研究成果，直接削弱论据，保留。\n对比C、D两项：C项为可能削弱论据，D项为直接削弱论据，D项当选。\n故正确答案为D。","no":98,"missingImage":false},{"type":"question","qid":"3522407","cat":"逻辑判断","stem":"慢性疲劳综合征危害极大，它使人在正常的工作后感到极度疲劳，怎么休息也无济于事。这种疾病过去不能通过验血或其他检查得出明确的生物指标，因此其病因历来被归为心理因素。最近，研究人员对诊断为慢性疲劳综合征的48名患者和39名健康志愿者的大便和血液样本进行研究后得出结论：肠道细菌和血液中的致炎因子可能与该疾病有关。\n以下哪项如果为真，最不能支持上述结论？","options":{"A":"该疾病患者的大便样本中肠道细菌的多样性较低且抗炎细菌较少","B":"该疾病患者的血液样本中被检测出致炎因子，而健康志愿者没有","C":"目前不确定肠道细菌是导致该疾病的原因还是该疾病导致的结果","D":"最新研究表明饮食治疗和益生菌等无助于为该疾病患者缓解疲劳"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：肠道细菌和血液中的致炎因子可能与慢性疲劳综合征有关。\n论据：无。\n首先注意本题问的是“······最不能支持上述结论？”，我们的做题思路是找出哪些是能支持的排除，如果不能支持的选项中出现无关选项，不明确选项和削弱选项，首选削弱项。\n第二步：逐一分析选项。\nA项：患者的肠道细菌多样性低且抗炎细菌较少，说明了肠道细菌可能与该疾病有关，为题干中论点补充了论据，属于加强选项。题干问的是最不能支持的，排除；\nB项：患者的血液样本中有致炎因子，而健康志愿者没有，说明了血液中的致炎因子可能与该疾病有关，补充论据，属于加强选项。题干问的是最不能支持的，排除；\nC项：不确定肠道细菌是病因还是该疾病导致的结果，但无论是原因还是结果，都能证明肠道细菌与该疾病确实有关，属于加强选项，题干问的是最不能支持的，排除；\nD项：饮食治疗和益生菌对缓解患者疲劳无用，与题干论点无关，不能加强，当选。 \n本题为选非题，故正确答案为D。","no":99,"missingImage":false},{"type":"question","qid":"3522465","cat":"定义判断","stem":"气象研究团队开发出一种基于人工智能的计算模型，用以检测云的旋转运动。研究人员鉴定并标记了逗点状云系的形态和运动，并利用计算机视觉和机器学习技术，“教会”计算机自动识别和检测卫星图像中的逗点状云系，以帮助人们更高效地在海量天气数据中及时发现恶劣天气的“端倪”。该计算模型有助于更快、更准确地预测恶劣天气。\n以下各项如果为真，不属于上述结论必要前提的是：","options":{"A":"该计算模型能检测出逗点状云系，准确率达\u003cimg data-k=\"91300a009a9b\">，甚至在其完全形成前就能检测到","B":"从卫星图像中看，逗点状云系因其外形类似于逗号而得名，与气旋的形成密切相关","C":"该计算模型如与其他天气预报模型相结合，将能有效地预测出\u003cimg data-k=\"e53611d2e102\">的恶劣天气事件","D":"气象学认为气旋的形成可导致冰雹雷暴、大风和暴风雨等各种恶劣天气事件发生"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：基于人工智能的计算模型有助于更快、更准确地预测恶劣天气。\n论据：研究人员鉴定并标记了逗点状云系的形态和运动，并利用计算机视觉和机器学习技术，“教会”计算机自动识别和检测卫星图像中的逗点状云系，以帮助人们更高效地在海量天气数据中及时发现恶劣天气的“端倪”。\n本题论点和论据都在讨论该计算模型有助于发现、预测恶劣天气，二者话题一致，必要前提优先考虑必要条件。本题为选非题，找出结论成立的必要条件排除即可。\n第二步：逐一分析选项。\nA项：选项说明该计算模型准确率达\u003cimg data-k=\"91300a009a9b\">，甚至在其完全形成前就能检测到，若该计算模型准确率低或者不能检测出逗点状云系，则该计算模型就无法预测恶劣天气，是上述结论的必要前提，排除；\nB项：选项说明逗点状云系与气旋形成密切相关，若逗点状云系与气旋形成无关，则不能根据逗点状云系预测恶劣天气，是上述结论的必要前提，排除；\nC项：选项说明该计算模型如果与其他天气预报模型结合，能有效预测出\u003cimg data-k=\"e53611d2e102\">的恶劣天气事件，但是有效地预测情况是否为该计算模型的作用，不能确定，不是上述结论的必要前提，当选；\nD项：论点是通过检测气旋的形成来预测恶劣天气的，选项说气旋的形成可导致恶劣天气，是上述结论的必要前提，排除。\n本题为选非题，故正确答案为C。","no":100,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"cbaf0eb047d2\" style=\"max-width:608px\">\u003c/p>","questions":[{"qid":"3523365","cat":"综合","stem":"2019年6月下旬，价格按从高到低排列居于第六位的生产资料是：","options":{"A":"苯乙烯","B":"聚乙烯","C":"聚丙烯","D":"涤纶长丝"},"answer":"A","explanation":"根据题干“2019年6月下旬，价格按从高到低排列居于第六位······”，结合材料时间为2019年7月上旬，可判定本题为基期比较问题。根据公式，基期量\u003cimg data-k=\"12f359d55bc1\">，定位表格材料可得：第1名是电解铜，\u003cimg data-k=\" 字材料第一段，新中国成立前入党的17.4万名；定位图1，截至2019年12月31日61岁以上党员人数为2657.7万名。而截至2019年12月31日，新中国成立前入党的人员都已满61岁。故61岁及以上的党员人数中，新中国成立前入党的人数占比为\u003cimg data-k=\"617bac07fc3f\">，说法正确，排除；\nD项：定位文字材料第一段：“在党员的职业上，工人（含工勤技能人员）644.5万名，农牧渔民2556.1万名”，则从事农牧渔民职业的党员人数与工人（含工勤技能人员）党员人数之比为\u003cimg data-k=\"e2fcb6a6ada5\">，说法错误，当选。\n本题为选非题，故正确答案为D。","no":120,"missingImage":false}]}],"count":20,"answerable":20,"pointsOf":16}],"total":120,"affected":[],"subtitle":"2021年 · 重庆 · 6/6 模块"},{"slug":"2021-重庆-选调","title":"2021年重庆市选调优秀大学生到基层工作考试《行测》题","year":"2021","group":"重庆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"4674833","cat":"时事政治","stem":"关于今年重庆市“两会”上公布的重庆市人民政府工作报告内容，说法错误的是（    ）。","options":{"A":"“十三五”时期，最具里程碑意义的是，党中央作出推动成渝地区双城经济圈建设的重大决策部署，为重庆赋予了战略使命、带来了重大机遇","B":"“十三五”时期，最具根本性意义的是，我市经济由高速增长转向高质量发展","C":"刚刚过去的2020年，面对前所未有的挑战，我们全力以赴战疫情、战复工、战脱贫、战洪水","D":"展望2035年，我市经济总量和城乡居民收入将较“十三五”时期翻一番以上"},"answer":"D","explanation":"本题考查政治常识。\nA、B两项正确，2021年重庆市政府工作报告中的“一、‘十三五’时期和2020年工作回顾”部分指出：“‘十三五’时期是全面建成小康社会决胜阶段，是重庆发展进程中极不平凡的五年。最具战略指引意义的是，习近平总书记两次亲临重庆视察指导并对重庆提出系列重要指示要求，为我们指明了前进方向、注入了强大动力；最具里程碑意义的是，党中央作出推动成渝地区双城经济圈建设的重大决策部署，为重庆赋予了战略使命、带来了重大机遇；最具历史性意义的是，脱贫攻坚战取得重大胜利，重庆人民与全国人民一道，告别延续千年的绝对贫困；最具根本性意义的是，我市经济由高速增长转向高质量发展，发展质量效益不断提升；最具标志性意义的是，城乡面貌发生显著变化，人民生活水平大幅提高。”\nC项正确，2021年重庆市政府工作报告中的“一、‘十三五’时期和2020年工作回顾”部分指出：“刚刚过去的2020年，是‘十三五’规划收官之年。这一年，疫情突如其来，汛情历史罕见，世情错综复杂······面对前所未有的挑战，我们坚决贯彻落实党中央决策部署，全力以赴战疫情、战复工、战脱贫、战洪水，统筹推进疫情防控和经济社会发展，全市抗疫斗争取得重大战略成果，经济运行逐季恢复、稳定转好，全年地区生产总值增长3.9%，固定资产投资、社会消费品零售总额、进出口总值分别增长3.9%、1.3%、12.5%，规上工业增加值增长5.8%，规上工业企业利润达到1318.8亿元、增长17.3%，全体居民人均可支配收入达到30824元、增长6.6%。”\nD项错误，2021年重庆市政府工作报告中的“二、‘十四五’时期主要目标任务和二〇三五年远景目标”部分指出：“展望2035年，我市将与全国一道基本实现社会主义现代化，经济总量和城乡居民收入较2020年翻一番以上，重庆‘三个作用’发挥更加突出，进入现代化国际都市行列；成渝地区建成实力雄厚、特色鲜明的双城经济圈，成为具有国际影响力的活跃增长极和强劲动力源。”\n本题为选非题，故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"4674840","cat":"新思想","stem":"习近平总书记指出，现在，各种经济学理论五花八门，但我们政治经济学的根本只能是（    ）政治经济学，而不能是别的什么经济理论。","options":{"A":"马克思主义","B":"社会主义","C":"共产主义","D":"古典主义"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，B、C、D三项错误，2020年8月16日第16期《求是》杂志刊登了文章《不断开拓当代中国马克思主义政治经济学新境界》，这是习近平2015年11月23日主持十八届中央政治局就马克思主义政治经济学基本原理和方法论进行第二十八次集体学习时的讲话。文章指出：“马克思主义政治经济学是马克思主义的重要组成部分，也是我们坚持和发展马克思主义的必修课。马克思、恩格斯根据辩证唯物主义和历史唯物主义的世界观和方法论，批判继承历史上经济学特别是英国古典政治经济学的思想成果，通过对人类经济活动的深入研究，创立了马克思主义政治经济学，揭示了人类社会特别是资本主义社会经济运动规律。恩格斯说，无产阶级政党的‘全部理论来自对政治经济学的研究’。列宁把政治经济学视为马克思主义理论‘最深刻、最全面、最详尽的证明和运用’。现在，各种经济学理论五花八门，但我们政治经济学的根本只能是马克思主义政治经济学，而不能是别的什么经济理论。”\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"4674831","cat":"时事政治","stem":"中共中央印发的《法治中国建设规划（2020-2025年）》提出，到（    ），法治国家、法治政府、法治社会基本建成，中国特色社会主义法治体系基本形成，人民平等参与、平等发展权利得到充分保障，国家治理体系和治理能力现代化基本实现。","options":{"A":"2020年","B":"2025年","C":"2030年","D":"2035年"},"answer":"D","explanation":"本题考查政治常识。\nD项正确，A、B、C项错误，《法治中国建设规划（2020-2025年）》在“一、坚定不移走中国特色社会主义法治道路，奋力建设良法善治的法治中国”的“（三）总体目标”中指出：“到2035年，法治国家、法治政府、法治社会基本建成，中国特色社会主义法治体系基本形成，人民平等参与、平等发展权利得到充分保障，国家治理体系和治理能力现代化基本实现。”\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"4674839","cat":"时事政治","stem":"2020年年底召开的中央经济工作会议提出解决好种子和耕地问题。作为世界第二大种子大国，下列哪些种源是我国能够做到完全自给自足且有竞争力的？\n①水稻   ②小麦   ③玉米   ④大豆","options":{"A":"①","B":"①②","C":"①②③","D":"①②③④"},"answer":"B","explanation":"本题考查政治常识。\n①②正确，农业农村部披露的数据显示，近10年，我国已审定、登记农作物品种3.9万个，农作物良种覆盖率逾96%。尤其是水稻、小麦两大口粮作物品种实现完全自给，杂交水稻亩产潜力突破1000公斤并保持国际领先，有较强的竞争力。数据同时显示，玉米和大豆种子虽然基本自给，但受育种及栽培等因素影响，单产与世界先进水平还有差距；少数蔬菜品种还不能很好满足市场的多样化需求，尤其是一些适宜设施栽培、加工专用的蔬菜品种仍需要进口。\n故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"4674841","cat":"新思想","stem":"2020年4月，习近平总书记在陕西考察秦岭生态保护时强调，秦岭和合南北，泽被天下，是我国的中央水塔，是中华民族的祖脉和中华文化的重要象征。下列关于秦岭的描述，正确的一项是（    ）。","options":{"A":"秦岭—淮河作为中国南北分界线，汉中盆地在其北、四川盆地在其南","B":"长江的支流汉江、嘉陵江、渭河均发源于秦岭","C":"秦岭南北温度、气候、地形特点迥异，北面年降水量高于南面","D":"栖息在秦岭的野生动物包括朱鹦、大熊猫、金丝猴、羚牛等"},"answer":"D","explanation":"本题考查地理国情。\nA项错误，秦岭-淮河线是中国地理区分北方地区和南方地区的地理分界线。在此线的北面和南面，自然条件、地理风貌、农业生产或是人民生活习俗，均有明显不同。汉中盆地，位于陕西省西南部的汉中市，北依秦岭，在秦岭和大巴山之间，汉江上游。四川盆地位于中国西南部四川省境内，由青藏高原、大巴山、华蓥山、云贵高原环绕而成。汉中盆地和四川盆地均位于秦岭-淮河线以南。\nB项错误，秦岭，西起昆仑，中经陇南、陕南，东至鄂豫皖-大别山以及蚌埠附近的张八岭，是长江和黄河流域的分水岭。秦岭北坡是黄河一级支流渭河的主要水源地，南坡是长江一级支流嘉陵江和汉江的源头区，东段的崤山、熊耳山和伏牛山则是黄河一级支流伊洛河和淮河一级支流颍河的源头区。秦岭为我国黄河、长江、淮河三大流域提供了水源保障，是名副其实的中央水塔。\nC项错误，秦岭以南属亚热带气候，自然条件为南方型；秦岭以北属暖温带气候，自然条件为北方型。秦岭-淮河是800毫米年等降水量线的界限。秦岭-淮河以南降水量大于800毫米；秦岭-淮河以北降水量小于800毫米。因此，秦岭北面年降水量低于南面。\nD项正确，秦岭地区野生动物中有大熊猫、金丝猴、羚牛等珍贵品种，鸟类有国家一类保护对象朱鹮和黑鹳。还藏匿着鬣羚、斑羚、野猪、黑熊、林麝、小麂、刺猬、竹鼠、鼯鼠、松鼠等数不清的哺乳动物，以及堪称世上最为丰富的雉鸡类族群。其中，大熊猫、金丝猴、羚牛、朱鹮被并称为“秦岭四宝”。\n故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"4674842","cat":"新思想","stem":"习近平总书记在政治、经济、外交等诸多场合，常常将古人诗词信手拈来，或吟诵明理，或录写寄意，使得文章熠熠生辉，讲话平添精彩。下列总书记曾引用过的古典名句，出处有误的一项是：","options":{"A":"“苟利国家生死以，岂因祸福避趋之”出自清代林则徐《赴戍登程口占示家人》","B":"“先天下之忧而忧，后天下之乐而乐”出自宋代范仲淹《岳阳楼记》","C":"“富贵不能淫，贫贱不能移，威武不能屈”出自春秋时期孔子《论语·为政》","D":"“为政之要，莫先于用人”出自宋代司马光《资治通鉴·魏纪五》"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，“苟利国家生死以，岂因祸福避趋之”出自清代林则徐《赴戍登程口占示家人》，意思是如果对国家有利，我将不顾生死。难道能因为有祸就躲避、有福就上前迎受吗？1842年，林则徐被遣戍新疆伊犁，在西安与家人告别时，做了题为《赴戍登程口占示家人》七律二首。\nB项正确，“先天下之忧而忧，后天下之乐而乐”出自宋代范仲淹《岳阳楼记》，意思是先于天下人的忧去忧，晚于天下人的乐去乐。《岳阳楼记》是范仲淹应好友巴陵郡太守滕子京之请为重修岳阳楼而创作的一篇散文。\nC项错误，“富贵不能淫，贫贱不能移，威武不能屈”出自战国《孟子·滕文公下》，意思是在富贵时，能使自己节制而不挥霍；在贫贱时不要改变自己的意志；在强权下不能改变自己的态度，这样才是大丈夫。\nD项正确，“为政之要，莫先于用人”出自宋代司马光《资治通鉴·魏纪五》，意思是治理国家的关键，没有比用人更重要的了。\n本题为选非题，故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"4674846","cat":"新思想","stem":"今年2月，国家主席习近平通过视频方式主持中国-中东欧国家领导人峰会并发表主旨讲话。中国与中东欧17国领导人会晤机制，又称“17+1”合作，下列国家中，不是“17+1”合作成员国家的是（    ）。","options":{"A":"捷克","B":"俄罗斯","C":"波兰","D":"阿尔巴尼亚"},"answer":"B","explanation":"本题考查政治常识。\nB项错误，A、C、D三项正确，“17+1”合作是根据中国同中东欧国家的共同愿望打造的跨区域合作平台。2012年，随着首次中国-中东欧国家领导人会晤在波兰华沙举行，中国-中东欧国家合作正式启动。当时共有16个中东欧国家加入，也被称为“16+1”合作。随着2019年新成员希腊加入，“16+1”扩容为“17+1”。其成员国家是中国和中东欧17国，包括阿尔巴尼亚、波黑、保加利亚、克罗地亚、捷克、爱沙尼亚、希腊、匈牙利、拉脱维亚、立陶宛、黑山、北马其顿、波兰、罗马尼亚、塞尔维亚、斯洛伐克和斯洛文尼亚。\n本题为选非题，故正确答案为B。","no":7,"missingImage":false}],"count":7,"answerable":7,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"4674834","cat":"人文常识","stem":"今年2月，全国脱贫攻坚总结表彰大会在北京人民大会堂隆重举行。下列说法错误的是（    ）。","options":{"A":"脱贫攻坚伟大斗争，锻造形成了“上下同心、尽锐出战、精准务实、开拓创新、攻坚克难、不负人民”的脱贫攻坚精神","B":"党中央、国务院决定，授予毛相林等10名同志，河北省塞罕坝机械林场等10个集体“全国脱贫攻坚楷模”荣誉称号","C":"党的十九大以来，党中央把脱贫攻坚摆在治国理政的重要位置，把脱贫攻坚作为全面建成小康社会的决定性任务","D":"脱贫攻坚战的全面胜利，标志着我们党在团结带领人民创造美好生活、实现共同富裕的道路上迈出了坚实的一大步"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，习近平总书记在全国脱贫攻坚总结表彰大会上发表重要讲话并指出：“脱贫攻坚伟大斗争，锻造形成了‘上下同心、尽锐出战、精准务实、开拓创新、攻坚克难、不负人民’的脱贫攻坚精神。脱贫攻坚精神，是中国共产党性质宗旨、中国人民意志品质、中华民族精神的生动写照，是爱国主义、集体主义、社会主义思想的集中体现，是中国精神、中国价值、中国力量的充分彰显，赓续传承了伟大民族精神和时代精神。”\nB项正确，为隆重表彰激励先进，大力弘扬民族精神、时代精神和脱贫攻坚精神，充分激发全党全国各族人民干事创业的责任感、使命感、荣誉感，汇聚更强大的力量推进全面建设社会主义现代化国家，在全国脱贫攻坚总结表彰大会上，党中央、国务院决定，授予毛相林等10名同志，河北省塞罕坝机械林场等10个集体“全国脱贫攻坚楷模”荣誉称号。\nC项错误，党的十八大以来，党中央把脱贫攻坚摆在治国理政的突出位置，把脱贫攻坚作为全面建成小康社会的底线任务。\nD项正确，习近平总书记在全国脱贫攻坚总结表彰大会上发表重要讲话并指出：“脱贫攻坚战的全面胜利，标志着我们党在团结带领人民创造美好生活、实现共同富裕的道路上迈出了坚实的一大步。同时，脱贫摘帽不是终点，而是新生活、新奋斗的起点。”\n本题为选非题，故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"4674836","cat":"人文常识","stem":"今年中共中央、国务院印发的《关于全面推进乡村振兴加快农业农村现代化的意见》，指出（    ）。","options":{"A":"“十四五”时期，是乘势而上开启全面建设社会主义现代化国家新征程、向第一个百年奋斗目标进军的第一个五年","B":"到2025年，农业农村现代化取得重要进展，彻底实现农业基础设施现代化、农村生活设施便利化、城乡基本公共服务均等化","C":"脱贫攻坚目标任务完成后，对摆脱贫困的县，从脱贫之日起设立5年过渡期，做到扶上马送一程","D":"吸引城市各方面人才到农村创新创业，参与脱贫攻坚和现代农村建设"},"answer":"C","explanation":"本题考查政治常识。\nA项错误，《关于全面推进乡村振兴加快农业农村现代化的意见》在开头部分指出：“‘十四五’时期，是乘势而上开启全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军的第一个五年。”\nB项错误，《关于全面推进乡村振兴加快农业农村现代化的意见》在“一、总体要求”中的“（二）目标任务”部分指出：“到2025年，农业农村现代化取得重要进展，农业基础设施现代化迈上新台阶，农村生活设施便利化初步实现，城乡基本公共服务均等化水平明显提高。”\nC项正确，《关于全面推进乡村振兴加快农业农村现代化的意见》在“二、实现巩固拓展脱贫攻坚成果同乡村振兴有效衔接”中的“（三）设立衔接过渡期”部分指出：“脱贫攻坚目标任务完成后，对摆脱贫困的县，从脱贫之日起设立5年过渡期，做到扶上马送一程。过渡期内保持现有主要帮扶政策总体稳定，并逐项分类优化调整，合理把握节奏、力度和时限，逐步实现由集中资源支持脱贫攻坚向全面推进乡村振兴平稳过渡，推动‘三农’工作重心历史性转移。”\nD项错误，《关于全面推进乡村振兴加快农业农村现代化的意见》在“三、加快推进农业现代化”中的“（十三）推进现代农业经营体系建设”部分指出：“突出抓好家庭农场和农民合作社两类经营主体，鼓励发展多种形式适度规模经营。实施家庭农场培育计划，把农业规模经营户培育成有活力的家庭农场······吸引城市各方面人才到农村创业创新，参与乡村振兴和现代农业建设。”\n故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"4674835","cat":"人文常识","stem":"下列关于党史的描述，错误的是（    ）。","options":{"A":"1921年7月，中国共产党第一次全国代表大会在上海召开","B":"1927年8月，毛泽东在“八七会议”上提出“枪杆子里面出政权”的重要思想","C":"1944年9月，毛泽东在追悼白求恩的会上发表了《为人民服务》的讲话","D":"1923年6月，中国共产党在广州举行第三次全国代表大会，决定共产党员以个人身份加入国民党"},"answer":"C","explanation":"本题考查毛中特。 \nA项正确，1921年7月23日，中国共产党第一次全国代表大会在上海开幕，最后一天的会议转移到浙江嘉兴南湖举行。大会通过中国共产党的第一个纲领和决议，选举产生中央局，陈独秀为中央局书记。中共一大标志着中国共产党正式成立，从此中国出现了以马克思列宁主义为行动指南的统一的无产阶级政党。\nB项正确，1927年8月7日，在共产国际的帮助下，中共中央在湖北汉口召开紧急会议，即八七会议。毛泽东在会上第一次旗帜鲜明地提出了“枪杆子里面出政权”的著名论断。\nC项错误，1944年9月8日，毛泽东在中央警备团战士张思德的追悼会上发表了著名演讲《为人民服务》。他系统阐述了为人民服务思想：一是为人民服务要树立正确的生死观，二是为人民服务要正确对待批评，三是为人民服务要搞好团结。此后，毛泽东在不同场合多次题写“为人民服务”，不断展现其蕴含的精神力量。\nD项正确，1923年6月12日至20日，中国共产党第三次全国代表大会在广州召开，会议决定：共产党员以个人身份加入国民党；同时保持政治、思想、组织上的独立性。中共三大促进了国共第一次合作的实行。\n本题为选非题，故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"4674837","cat":"人文常识","stem":"2020年12月7日，国际奥委会执委会召开会议，同意2024年巴黎奥运会增设四个比赛项目，其中不包括（    ）。","options":{"A":"高尔夫","B":"霹雳舞","C":"攀岩","D":"滑板"},"answer":"A","explanation":"本题考查政治常识。\n2020年12月7日，国际奥委会执委会召开会议，同意2024年巴黎奥运会增设霹雳舞、滑板、攀岩、冲浪四个大项。四个项目中，滑板、攀岩、冲浪三项已经是东京奥运会正式比赛项目。霹雳舞则是首次进入奥运会。\n本题为选非题，故正确答案为A。","no":11,"missingImage":false},{"type":"question","qid":"4674838","cat":"科技常识","stem":"执行中国首次火星探测任务的“天问一号”探测器于2020年7月23日在文昌航天发射场发射升空，并于2021年2月24日成功实施第三次近火制动，进入火星停泊轨道。选择在去年7月发射，是因为此时（    ）。","options":{"A":"恰好是最佳窗口期","B":"发射探测器能最快飞抵火星","C":"发射场有最好的气象条件","D":"地球与火星的距离最近"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，B、C、D三项均错误，我们所处的地球与火星之间的距离并不是一成不变的，根据地火在太阳系的相对运动关系，约26个月出现一次从地球发射探测器到火星的机会，这就是所谓的“窗口期”，一旦错过就需要等待两年多。2020年7月是发射火星探测器的最佳窗口期，此时地球和火星之间的距离缩短，能大大降低燃料消耗和飞行成本，有效提高发射成功率。\n故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"4674844","cat":"人文常识","stem":"下列行为中，应以故意泄露国家秘密罪定罪处罚的是（    ）。","options":{"A":"张某为某国家部委办公室干部，通过微信将该部门尚未公布的涉密经济数据透露给某证券公司工作人员","B":"李某为科研院所工作人员，被境外情报机构收买，向其出售所掌握的大量绝密、机密级国家秘密","C":"A化工厂技术科科长王某，违反厂里保密规定，向B公司提供其掌握的技术资料并收取报酬","D":"陈某为某乡镇政府公务员，因多年来未曾提拔心有怨气，故编造抹黑党和政府的信息并向境外媒体散布"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，D项错误，根据《中华人民共和国刑法》第三百九十八条第一款规定：“国家机关工作人员违反保守国家秘密法的规定，故意或者过失泄露国家秘密，情节严重的，处三年以下有期徒刑或者拘役；情节特别严重的，处三年以上七年以下有期徒刑。”A项中，张某作为国家机关工作人员，故意将未公布的涉密经济数据透露给证券公司工作人员，构成故意泄露国家秘密罪。D项中，编造的抹黑党和政府的信息不属于国家秘密，陈某不构成故意泄露国家秘密罪。\nB项错误，根据《中华人民共和国刑法》第一百一十一条规定：“为境外的机构、组织、人员窃取、刺探、收买、非法提供国家秘密或者情报的，处五年以上十年以下有期徒刑；情节特别严重的，处十年以上有期徒刑或者无期徒刑；情节较轻的，处五年以下有期徒刑、拘役、管制或者剥夺政治权利。”题中，李某向境外非法出售国家绝密、机密级国家秘密，应以为境外非法提供国家秘密罪定罪处罚。\nC项错误，根据《中华人民共和国刑法》第二百一十九条第一、二款规定：“有下列侵犯商业秘密行为之一，情节严重的，处三年以下有期徒刑，并处或者单处罚金；情节特别严重的，处三年以上十年以下有期徒刑，并处罚金：（一）以盗窃、贿赂、欺诈、胁迫、电子侵入或者其他不正当手段获取权利人的商业秘密的；（二）披露、使用或者允许他人使用以前项手段获取的权利人的商业秘密的；（三）违反保密义务或者违反权利人有关保守商业秘密的要求，披露、使用或者允许他人使用其所掌握的商业秘密的。明知前款所列行为，获取、披露、使用或者允许他人使用该商业秘密的，以侵犯商业秘密论。”题中，王某作为化工厂工作人员，属于非国家机关工作人员，并且泄露的是商业秘密，而不是国家秘密，应以侵犯商业秘密罪定罪处罚。\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"4674845","cat":"科技常识","stem":"2021年2月，经国务院批准，调整后的《国家重点保护野生动物名录》正式发布。根据该名录，下列不属于国家一级保护野生动物的是（    ）。","options":{"A":"长江江豚","B":"黑叶猴","C":"豺","D":"小熊猫"},"answer":"D","explanation":"本题考查政治常识。\nA、B、C三项正确，D项错误，《国家重点保护野生动物名录》于2021年2月5日经国务院批准，自公布之日起施行。新国家重点保护野生动物名录正式公布，新增517种（类）野生动物，大斑灵猫、黑叶猴等43种列为国家一级保护野生动物，狼、小熊猫等474种（类）列为国家二级保护野生动物。豺、长江江豚等65种由国家二级保护野生动物升为国家一级。\n本题为选非题，故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"4674847","cat":"科技常识","stem":"下列概念正确的一项是（    ）。","options":{"A":"核酸检测是一种检查唾液、鼻腔和咽喉中是否存在病毒DNA的手段","B":"无症状感染者是指无临床症状，但病毒病原学检测呈阳性者","C":"气溶胶是指长时间停留在空气中、直径小于1微米的颗粒","D":"灭活病毒是指经医学处理后死亡的病毒"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，核酸检测是查找患者的呼吸道标本、血液或粪便中是否存在外来入侵的病毒的核酸，来确定是否被病毒感染。因此一旦检测为核酸“阳性”，即可证明患者体内有病毒存在。所有生物都含有核酸，核酸包括脱氧核糖核酸（DNA）和核糖核酸（RNA），因此，并不是所有核酸检测都是检测DNA。如新型冠状病毒是一种仅含有RNA的病毒，病毒中特异性RNA序列是区分该病毒与其它病原体的标志物。\nB项正确，无症状感染者是指无相关临床症状（如发热、咳嗽、咽痛等可自我感知或可临床识别的症状与体征），呼吸道等标本病毒病原学或血清特异性免疫球蛋白M（IgM）抗体检测阳性者。\nC项错误，气溶胶是指悬浮在气体介质中的固态或液态颗粒所组成的气态分散系统。这些固态或液态颗粒的密度与气体介质的密度可以相差微小，也可以悬殊很大。气溶胶颗粒大小通常在0.01-10微米之间。\nD项错误，灭活病毒是指病毒蛋白的高级结构受到破坏，蛋白不再有生理活性，所以失去感染、致病和繁殖能力，但仍有融合活性，因此不是死亡的病毒。\n故正确答案为B。","no":15,"missingImage":false}],"count":8,"answerable":8,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        “大量研究表明，睡眠及睡眠障碍与心脑血管疾病、糖尿病、呼吸疾病等多种慢性疾病密切相关。”中国医科大学航空总医院中医治未病科副主任张慧在接受科技日报记者采访时表示，睡眠不足轻者可影响人的注意力、判断力等，长期睡眠不足可增加罹患疾病的危险，如心脏病、高血压、抑郁症等，直接危害人体的健康，重者还会增加死亡的风险。\u003c/p>\u003cp>        “近年来，精神类疾病发病率持续增高，缺乏睡眠是‘帮凶’之一。”中国医科大学航空总医院心身医学科主任喻小念在接受科技日报记者采访时表示，长期睡眠不足可能与所有的精神疾病有关，有些情况下，二者甚至互为因果，即睡眠不足引发精神障碍，精神障碍又会让人睡不着、睡不好，从而形成恶性循环。长期睡眠不足，可能引起抑郁症、焦虑症等疾病，儿童阶段长期睡眠不足甚至可能诱发智力发育迟缓或情绪心理问题等。\u003c/p>\u003cp>        为什么睡眠不足会带来一系列隐患？“人的大脑需要一定的兴奋和抑制节律调节来保障其活动的正常运行，长期睡眠不足就是对这种节律的破坏，在本质上会引起大脑运作不畅，从而表现出整个人意识不清醒、思维迟缓并伴发情绪不良等外在行为，严重者甚至还会出现精神失常。”喻小念表示。有关研究发现，长期睡眠不足的人群在统计学层面上的抑郁症、焦虑症、自杀等风险是普通人群的1.4倍以上。\u003c/p>\u003cp>        “睡不足有隐患，睡得过多也不见得是好事，然而很多人还没有意识到这个问题。”喻小念指出，医学上有一种以睡眠过多为主要特征的病症，即嗜睡症。患者会不分场合地表现出经常困乏嗜睡，出现不同程度、不可抗拒的入睡，白天睡眠过多或睡眠后达到完全觉醒状态的过渡时间延长等。过多的睡眠不仅会降低工作、生活质量，也会有认知功能方面的退化，如近事记忆减退、思维能力下降、学习新事物能力下降，更可能是其他躯体疾病的表现。\u003c/p>","questions":[{"qid":"4674887","cat":"片段阅读","stem":"关于主题的概括以下最恰当的是：","options":{"A":"睡眠不足可增加罹患疾病的危险","B":"睡眠不足或睡得过多均有风险","C":"睡眠过多也是一种睡眠障碍","D":"睡眠障碍与精神疾病互为因果"},"answer":"B","explanation":"本题为中心理解题，通读全文，文章第一段交代睡眠及睡眠障碍与多种慢性疾病密切相关，并说明睡眠不足会影响注意力、判断力等，还会危害身体健康，甚至增加死亡风险；第二段进一步介绍睡眠不足与精神疾病之间互为因果的关系，长期睡眠不足会引起心理疾病；第三段具体解释了睡眠不足引发一系列隐患的原因；第四段介绍睡眠过多同样不是好事，并说明睡眠过多也是一种病，即嗜睡症，过多的睡眠也会带来一些隐患。故文段围绕睡眠这一话题，重点强调睡眠不足和睡得过多都会带来一系列隐患，对应B项。\nA项，“睡眠不足”仅为文段强调的一个方面，表述片面，排除；\nC项，“睡眠过多”仅为文段强调的一个方面，表述片面，排除；\nD项，文段强调的是“睡眠不足”与“精神疾病互为因果”，“睡眠障碍”范围扩大，且文段还介绍了睡眠障碍与慢性疾病密切相关，表述片面，排除。\n故正确答案为B。\n【文段出处】科普时报《睡眠不足或过多都不好》","no":16,"missingImage":false},{"qid":"4674888","cat":"片段阅读","stem":"根据文段内容，以下说法正确的是：","options":{"A":"睡眠过多比睡眠不足更有害身体健康","B":"抑郁症的发生可能与长期睡眠不足有关","C":"如果使人脑保持兴奋即使长期失眠也不会有太大影响","D":"儿童视力发育延缓往往是睡眠不足所导致"},"answer":"B","explanation":"A项，文中前三段介绍了睡眠不足的危害，最后一段介绍了睡眠过多的危害，但并未将二者进行比较，无关对比，排除；\nB项，根据第二段末尾“长期睡眠不足，可能引起抑郁症、焦虑症等疾病”与第三段末尾“有关研究发现，长期睡眠不足的人群在统计学层面上的抑郁症、焦虑症、自杀等风险是普通人群的1.4倍以上”可知，表述正确，当选；\nC项，根据第三段“人的大脑需要一定的兴奋和抑制节律调节来保障其活动的正常运行，长期睡眠不足就是对这种节律的破坏”可知，长期睡眠不足会破坏兴奋和抑制节律调节，不能保障大脑的正常运行，“不会有太大影响”表述错误，排除；\nD项，文段并未涉及“视力发育”的内容，无中生有，排除。\n故正确答案为B。\n【文段出处】科普时报《睡眠不足或过多都不好》","no":17,"missingImage":false}]},{"type":"material","material":"\u003cp>阅读以下材料，回答38-39题。\u003c/p>\u003cp>        近日，武汉市园林科学研究院和中科院武汉植物园携手研发出翻译荷花遗传密码的莲基因组数据库。日前，该数据库在国际知名学术期刊公布，供各国荷花研究人员免费共享。据介绍，水生植物莲是地球上最早出现的开花植物之一。研究发现，早在约1.4亿年前蕨类植物和恐龙称霸地球的时代，在北半球许多水域已有莲的分布。\u003c/p>\u003cp>        武汉市园林科学研究院具有悠久的荷花研究传统与历史，目前收集、栽培国内300多个荷花品种，2018年以来还引进栽培了美洲莲、澳洲莲，以及印度、泰国、越南等国的莲品种。中科院武汉植物园在莲属植物的研究上全国领先，2013年完成了中国古代莲的基因组测序和分析，绘制了基因组框架图谱。2019年12月，两家单位的学者联手打造的基因数据库问世。2020年9月该数据库取得国家版权局授予的计算机软件著作权。2021年1月，该数据库在国际知名学术期刊《Scientific Data》在线发表。中科院武汉植物园李会博士和武汉市园林科学研究院杨星宇博士为论文并列第一作者。目前，研究样本基因组相关数据已上传至全球通用的NCBI数据平台，对全球学术用途公开。\u003c/p>\u003cp>        杨星宇表示，该数据库有助于莲的群体遗传学和分子育种的相关研究，以及全面了解莲全基因组的遗传变异特征。通过数据追溯了解莲的栽培驯化历史，以便培育高产、优质的新品种，同时提高育种技术水平和速度。从这个意义上讲，\u003cu>                    \u003c/u>。\u003c/p>","questions":[{"qid":"4674890","cat":"片段阅读","stem":"填入划线部分最恰当的是：","options":{"A":"水生植物莲在莲的遗传学和育种研究方面意义重大","B":"基因组测序和分析是莲基因组数据库的最重要价值","C":"该莲基因组数据库引领了全球关于莲属植物的研究","D":"该数据库是一把破解荷花分子遗传密码的“金钥匙”"},"answer":"D","explanation":"本题为语句填空题，横线位于文段结尾，根据“从这个意义上讲”可知，横线处所填内容对前文进行总结概括。文章第三段开篇指出翻译荷花遗传密码的基因组数据库有助于研究和了解莲在遗传学诸多方面的内容。随后具体介绍该数据库通过数据对莲展开追溯并取得研究成果。故前文强调的是该数据库在研究荷花的遗传信息方面发挥的重要作用，对应D项。\nA项，文章第三段的核心话题是“该数据库”，与前文话题不一致，无法衔接，排除；\nB项，文章第三段未提及“基因组测序和分析”，无中生有，且“最重要”表述绝对，排除；\nC项，文章第三段未提及“引领全球”，无中生有，排除。\n故正确答案为D。\n【文段出处】《中国学者公布莲基因组数据库》","no":18,"missingImage":false},{"qid":"4674891","cat":"片段阅读","stem":"根据题干内容，以下说法正确的是：","options":{"A":"水生植物莲与蕨类植物同时代产生","B":"水生植物莲最早出现在北半球水域","C":"通过莲基因组数据能破解荷花遗传密码","D":"莲基因组数据库一经公布便可免费使用"},"answer":"C","explanation":"C项，根据第三段“该数据库有助于莲的群体遗传学和分子育种的相关研究，以及全面了解莲全基因组的遗传变异特征”可知，莲基因组数据可破解其相关遗传信息，荷花即莲的别称，故符合文意，当选；\nA项，根据第一段“早在约1.4亿年前蕨类植物和恐龙称霸地球的时代，在北半球许多水域已有莲的分布”可知，二者只是在同一时代出现过，是否为同时代产生，文段并未提及，无中生有，排除；\nB项，根据第一段“研究发现，早在约1.4亿年前蕨类植物和恐龙称霸地球的时代，在北半球许多水域已有莲的分布”可知，水生植物莲在北半球水域出现过，但是否为“最早”出现，文段并未提及，无中生有，排除；\nD项，根据第二段“目前，研究样本基因组相关数据已上传至全球通用的NCBI数据平台，对全球学术用途公开”可知，数据库只对学术用途公开，并非所有人均可免费使用，表述错误，排除。\n故正确答案为C。\n【文段出处】《中国学者公布莲基因组数据库》","no":19,"missingImage":false}]},{"type":"material","material":"\u003cp>阅读以下材料，回答40-42题。\u003c/p>\u003cp>        农业文化遗产是人与自然环境长期协同进化的结果，是农村生计、多样化粮食系统、农业生物多样性保护和可持续利用的来源。这些\u003cu>        \u003c/u>久远的生产与生活系统以及其中的本土知识和生态原则，经受住了千百年的考验，具有极高的适应性。\u003c/p>\u003cp>        我国的传统农业之所以能在生存资源极度短缺的自然条件下，滋养着中华民族繁衍生息，孕育了不曾间断的华夏文明，正是得益于\u003cu>        \u003c/u>了数千年的农耕智慧。就观念层面而言，“天人合一”的哲学思想、五行相生相克的辩证认识，深度影响了人们的生产与生活实践。从经验层面而论，不同季节作物种植的安排、有机肥料的使用方法、各种旱作技术、稻田生产技术、选种和积肥技术等，无不蕴含着丰富的科学道理。以物种多样性为例，稻田养鱼，鱼撞击稻禾，50%的稻飞虱掉下来被鱼吃掉，排泄物可以养地。鱼身上分泌的黏滑物质还可以控制水稻的纹枯病，这是利用物种之间的吃与被吃关系进行的食物链模式。北方棉田间作玉米，玉米可以吸引棉铃虫的天敌瓢虫、蜘蛛等，从而有效减少棉花遭受危害，这是利用生物之间的化学关系进行的相生相克的害虫防治模式。除了这些农耕技术的传统知识外，我国各民族的文化体系都蕴含着人与自然和谐共处的生态观。“有了森林才会有水，有了水才会有田地，有了田地才会有粮食，有了粮食才会有人的生命。”这样的生态观对于森林保护和农业的永续发展发挥了重要作用。而山林祭祀、农事庆典、农耕礼俗、乡规民约等，均体现着对大自然的呵护意识，成为维护生态平衡的重要资源。\u003c/p>\u003cp>        农业文化遗产保护不只是对传统的存留，还必须考虑到农业生态系统中农民生活水平的提高和生活质量的改善。因此，保护农业文化遗产是对农业特性、对乡村价值的再评估，是对人类未来生存和发展机会的战略性保护，其终极指向是现代化背景下的乡村建设。\u003c/p>","questions":[{"qid":"4674893","cat":"逻辑填空","stem":"依次填入划线部分最恰当的是：","options":{"A":"继承 汇聚","B":"承载 凝聚","C":"承接 集聚","D":"传承 积聚"},"answer":"D","explanation":"本题可从第二空入手，根据前文“孕育了不曾间断的华夏文明”及后文“数千年的农耕智慧”可知，华夏文明是农耕智慧累积数千年而形成的，故横线处所填词语需体现出通过时间来累积的含义，D项“积聚”指逐渐聚集，且“积”侧重通过时间来累积，符合文意，保留。A项“汇聚”指会在一处，没有分开的意思，侧重强调多方面的汇总，B项“凝聚”指凝结、集中，C项“集聚”指集合，聚集，三项均无法体现长时间累积的含义，与文意不符，排除。\n第一空，代入验证，D项“传承”指长期以来流传下来的，置于此处表达生产与生活系统及其中的本土知识和生态原则是长期流传下来的，符合文意，当选。\n故正确答案为D。\n【文段出处】《植根土地的文化追寻——农业文化遗产的永续价值与保护实践》","no":20,"missingImage":false},{"qid":"4674894","cat":"片段阅读","stem":"以下说法与原文不相符的是：","options":{"A":"“天人合一”的哲学思想是农耕智慧的重要体现","B":"稻田养鱼利用了物种之间吃与被吃的食物链关系","C":"棉田间种植玉米利用了生物间化学关系相生相克","D":"农耕传统知识蕴含着人与自然和谐共处的生态观"},"answer":"A","explanation":"A项，根据第二段“就观念层面而言，‘天人合一’的哲学思想、五行相生相克的辩证认识，深度影响了人们的生产与生活实践”可知，文段强调农耕智慧体现着“天人合一”的哲学思想，选项偷换逻辑，当选；\nB项，根据第二段“以物种多样性为例，稻田养鱼······这是利用物种之间的吃与被吃关系进行的食物链模式”可知，表述正确，排除；\nC项，根据第二段“北方棉田间作玉米······这是利用生物之间的化学关系进行的相生相克的害虫防治模式”可知，表述正确，排除；\nD项，根据第二段“除了这些农耕技术的传统知识外，我国各民族的文化体系都蕴含着人与自然和谐共处的生态观”可知，农耕传统知识和各民族的文化体系都蕴含着人与自然和谐共处的生态观，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《植根土地的文化追寻——农业文化遗产的永续价值与保护实践》","no":21,"missingImage":false},{"qid":"4674895","cat":"片段阅读","stem":"根据文段内容，接下来最有可能阐述的是：","options":{"A":"农业文化遗产种类的多样性","B":"农业文化遗产中的生态智慧","C":"农业文化遗产保护和利用的价值","D":"农业文化遗产保护的创造性转化"},"answer":"D","explanation":"根据提问方式可知，本题为接语选择题，重点关注文章最后论述的核心话题。文章第一段开篇引出农业文化遗产的话题，第二段介绍我国的传统农业能够滋养中华民族、孕育华夏文明得益于农耕智慧，最后一段指出农业文化遗产保护必须考虑到农业生态系统中农民生活水平的提高和生活质量的改善，并通过“因此”得出结论，强调农业文化遗产保护的终极目标是为了现代化背景下的乡村建设，故农业文化遗产保护不应只保护传统，还应结合时代背景为乡村建设提供助力。故下文应围绕农业文化遗产保护如何与时代背景相结合展开论述，对应D项。\nA项“农业文化遗产种类”、B项“农业文化遗产中的生态智慧”，均与文章结尾话题不一致，排除；\nC项“利用的价值”文章第二段已论述过，后文不会再论述，排除。\n故正确答案为D。\n【文段出处】《植根土地的文化追寻——农业文化遗产的永续价值与保护实践》","no":22,"missingImage":false}]},{"type":"material","material":"\u003cp>阅读以下材料，回答43-45题。\u003c/p>\u003cp>        大数据的产生，简化了人们对世界的认知。通过将人的行为转化成为无数个可以量化的数据节点，从而为人提供了一个“数据画像”。然而，目前的一些大数据应用还停留在标签化的层面，忽略了个体的差异，容易导致千人一面的结果。\u003c/p>\u003cp>        如果说大数据关注的是总体和大致规律，那么\u003cu>                    \u003c/u>。和大数据相比，小数据的价值在于它来源于各类社会行为的细节，更贴近人们的个体感受，对需求的呈现也更精准。比如，按照大数据画像，婴儿尿布可能会和奶粉、玩具等商品相关联，啤酒的消费者可能会同时选购花生米、薯片等零食。而国外一家零售商依据小数据的分析显示，男性顾客在购买婴儿尿片时，常会顺便搭配几瓶啤酒来犒劳自己，于是尝试推出了将啤酒和尿布摆在一起的促销手段，竟然取得了成功。\u003c/p>\u003cp>        不论是大数据还是小数据，最重要的是对数据的分析。举一个古代的例子，在马陵之战中，庞涓善于数据分析，而孙膑通过编造“使齐军入魏地为十万灶，明日为五万灶，又明日为三万灶”的数据，反其道而用之，对庞涓实施诱杀。这就是庞涓惯用“灶”的大数据，而忽视对脚印等小数据的分析而导致的。要达成对事物的更深入理解，就需要把大数据思维和小数据细节相结合。\u003c/p>\u003cp>        关于未来趋势，有专家预言，在不久的将来，大数据、小数据的界限或将被消除，取而代之的是“全数据”或全量数据，也就是所有数据。比如，未来在智能交通领域，将有可能用全量实时的数据，来感知城市每辆车所在的具体位置、每个红绿灯路口的车辆信息，并对这些情况进行全局调控，从而大幅提升城市交通运营效率。而实现这一目的，离不开对数据的挖掘和分析，以及人工智能的深度学习。\u003c/p>","questions":[{"qid":"4674900","cat":"片段阅读","stem":"填入划线部分最恰当的一项是：","options":{"A":"标签化和个体差异的消失则是其结果","B":"个体的差异和生活的细节则往往被忽略","C":"小数据关注的则是个体和细腻的事实","D":"小数据关注的则是细枝末节的琐碎事务"},"answer":"C","explanation":"定位原文，横线处于文段开头，且属于开头的分句，需对前后文的内容进行把握。根据“如果说大数据关注的是总体和大致规律”、“和大数据相比，小数据的价值在于······对需求的呈现也更精准”可知，横线处应该体现的是“小数据”的价值所在。C项与横线前后均可形成呼应，当选；\nA、B两项均未体现“小数据”，偏离主题，排除；\nD项，“关注的则是细枝末节的琐碎事务”感情色彩偏消极，横线处是想体现“小数据”的价值所在，感情色彩与文段不符，排除。\n故正确答案为C。\n【文段出处】《大数据、小数据与全数据》","no":23,"missingImage":false},{"qid":"4674902","cat":"片段阅读","stem":"根据文段内容，以下属于应用小数据原理的是：","options":{"A":"孕婴店同时售卖奶粉和童装","B":"超市将奶瓶与磨牙棒摆放在同一个货架上","C":"海底捞为消费者备用婴儿床","D":"手机浏览器常为用户推荐相似主题的新闻"},"answer":"C","explanation":"C项，依据第二段“如果说大数据关注的是总体和大致规律，那么······。和大数据相比，小数据的价值在于它来源于各类社会行为的细节，更贴近人们的个体感受，对需求的呈现也更精准”可知，“海底捞为消费者备用婴儿床”体现了海底捞在关注个体消费者饮食需求的同时也关注到了消费者细腻的需要照顾小孩的事实，精准地满足了消费者的需求，应用了小数据的原理，当选；\nA项，依据第二段“如果说大数据关注的是总体和大致规律”以及“按照大数据画像，婴儿尿布可能会和奶粉、玩具等商品相关联”可知，售卖奶粉和童装是孕婴店的大致规律，属于对大数据原理的应用，不符合小数据原理，排除；\nB项，依据第二段“如果说大数据关注的是总体和大致规律”以及“按照大数据画像，婴儿尿布可能会和奶粉、玩具等商品相关联”可知，“奶瓶与磨牙棒摆放在同一个货架上”是大多数超市的总体、大致的规律，属于对大数据原理的应用，不符合小数据原理，排除；\nD项，依据第二段“如果说大数据关注的是总体和大致规律”可知，“为用户推荐相似主题的新闻”是手机浏览器总体、大致的规律，属于对大数据原理的应用，不符合小数据原理，排除。\n故正确答案为C。\n【文段出处】人民日报《大数据、小数据与全数据》","no":24,"missingImage":false},{"qid":"4674904","cat":"片段阅读","stem":"根据文段内容，以下说法不正确的是：","options":{"A":"对数据的挖掘和分析是各类数据应用的共性要求","B":"大数据思维和小数据细节相结合能加深对事物的理解","C":"小数据能够更精准地呈现客户的差异化需求","D":"全数据时代人工智能将取代数据分析的重要性"},"answer":"D","explanation":"A项，根据第三段“不论是大数据还是小数据，最重要的是对数据的分析”可知，说法正确，排除；\nB项，根据第三段“要达成对事物的更深入理解，就需要把大数据思维和小数据细节相结合”可知，说法正确，排除；\nC项，根据第一段“目前的一些大数据应用还停留在标签化的层面，忽略了个体的差异”和第二段“和大数据相比，小数据的价值在于它来源于各类社会行为的细节，更贴近人们的个体感受，对需求的呈现也更精准”可知，说法正确，排除；\nD项，根据第四段“在不久的将来，大数据、小数据的界限或将被消除，取而代之的是‘全数据’或全量数据······而实现这一目的，离不开对数据的挖掘和分析，以及人工智能的深度学习”可知，全数据时代我们既需要分析数据，又需要人工智能，“人工智能将取代数据分析”表述不正确，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《大数据、小数据与全数据》","no":25,"missingImage":false},{"qid":"4674861","cat":"逻辑填空","stem":"深化职业院校、应用型高校教育教学改革，学校专业规划、教学设计、实习实训等人才培养环节的实施效果如何，取决于双师型教师的素质和水平。应贯彻落实《关于全面深化新时代教师队伍建设改革的意见》，        “分类施策”原则，建构一整套适应职业教育、高等教育应用型人才培养要求的双师型教师制度体系。\n填入划横线部分最恰当的是：","options":{"A":"秉承","B":"坚持","C":"坚守","D":"秉持"},"answer":"D","explanation":"横线处所填词语搭配“原则”且体现以“分类施策”为指导开展工作之意。D项“秉持”指掌握、执守、依照标准做事，符合文意，且“秉持原则”搭配得当，当选。B项“坚持”指坚决保持住或进行下去，从对比择优角度，不如“秉持”合适，排除；A项“秉承”指接受、承接，常见搭配为“秉承旨意”“秉承指示”，C项“坚守”指坚决守卫、坚定遵守，常见搭配为“坚守岗位”“坚守承诺”，均与“原则”搭配不当，排除。\n故正确答案为D。\n【文段出处】《双师型教师队伍建设须双管齐下》","no":26,"missingImage":false},{"qid":"4674863","cat":"逻辑填空","stem":"诚然，传统美术史写作确实存在这些问题，但它是孕育于中国文化脉息中的。如唐代张彦远的《历代名画记》，它与现代意义上的美术史著作相去甚远，是一部包蕴了画史、画家传记、作品著录、技法论、鉴藏论等多项内容的极为通融的画学文献。这种写作模式和潜在的价值系统被学界认为是中国传统美术史的“超稳定结构”，        了之后历代的画史修撰，对当前的美术史写作依然具有启发意义。\n填入划横线部分最恰当的是：","options":{"A":"泽溉","B":"影响","C":"桎梏","D":"引领"},"answer":"A","explanation":"由“对当前的美术史写作依然具有启发意义”可知，横线处所填词语应体现写作模式和价值系统对之后历代的画史修撰也起到积极作用，A项“泽溉”指恩泽灌溉，可体现写作模式和价值系统对画史修撰的积极作用，当选。B项“影响”指对他人或周围事物起作用，为中性词，无法体现促进作用，排除；C项“桎梏”指脚镣和手铐，比喻束缚人或事物的东西，为贬义词，与文段感情色彩不符，排除；D项“引领”指带动事物跟随他或他们向某一方向运动、发展，无法体现积极作用，排除。\n故正确答案为A。\n【文段出处】《美术史应彰显本土立场》","no":27,"missingImage":false},{"qid":"4674859","cat":"逻辑填空","stem":"互联网已经成为人们学习生活工作的重要平台，与此同时，网民\"首次触网年龄\"明显提前，青少年沉迷网瘾的现象            。在全国两会上，加强未成年人网络保护成为共识。代表委员纷纷建言，让青少年摆脱网瘾，健康上网。\n填入划横线部分最恰当的是：","options":{"A":"少见多怪","B":"习以为常","C":"屡见不鲜","D":"熟视无睹"},"answer":"C","explanation":"横线处搭配“现象”，且根据后文“加强未成年人网络保护成为共识”可知，横线处体现青少年沉迷网瘾的现象较为普遍之意。C项“屡见不鲜”指经常看见，并不新奇，置于此处可体现青少年沉迷网瘾的现象普遍，符合文意，当选。A项“少见多怪”意思是见闻少的人遇到不常见的事物就觉得奇怪，后常用来嘲笑见识浅陋的人，与文意无关，排除；B项“习以为常”指常做某种事情或常见某种现象，就觉得很平常了，常与“人”搭配，置于此处搭配不当，排除；D项“熟视无睹”指看惯了却像没看见一样，形容对事物漫不经心或不重视，文段并无对青少年沉迷网瘾现象不重视之意，与文意不符，排除。\n故正确答案为C。\n【文段出处】《让青少年健康上网重在社会共治》","no":28,"missingImage":false},{"qid":"4674865","cat":"逻辑填空","stem":"在世界新一轮科技革命和产业变革同我国转变发展方式的历史性交汇期，我们既面临着            的时代机遇，又面临着差距拉大的严峻挑战。此时，关键核心技术的攻关、突破与创新比以往任何时候都更为重要、更为迫切。\n填入划横线部分最恰当的是：","options":{"A":"屈指可数","B":"千载难逢","C":"凤毛麟角","D":"百里挑一"},"answer":"B","explanation":"横线处搭配“机遇”，根据“历史性交汇期”“更为重要、更为迫切”可知，文意强调此刻的机遇十分难得，程度较重，B项“千载难逢”形容机会极其难得、非常罕见，符合文意，且与“机遇”为常见搭配，当选。A项“屈指可数”形容数目很少，侧重强调少，无法体现出“难得”之意，且置于此处程度较轻，排除；C项“凤毛麟角”比喻稀少而可贵的人或事物，D项“百里挑一”形容出众不可多得，均与“机遇”搭配不当，排除。\n故正确答案为B。\n【文段出处】《高校应担起“卡脖子”技术攻关的时代重任》","no":29,"missingImage":false},{"qid":"4674864","cat":"逻辑填空","stem":"电影《流浪地球》票房突破46亿的消息，再次受到关注。这部国产科幻电影之所以受到欢迎，不仅因为它        了中国\"硬科幻\"电影类型的空白，更重要的是它        了中国传统价值和当代价值，体现着\"人类命运共同体\"理念。\n依次填入划横线部分最恰当的是：","options":{"A":"填充 开解","B":"弥补 解释","C":"添补 疏解","D":"填补 诠释"},"answer":"D","explanation":"第一空，搭配“空白”，A项“填充”指填补、补充，C项“添补”指增添补充，D项“填补”指补足空缺或缺欠，均与“空白”搭配恰当，保留。B项“弥补”指把不够的部分填足，通常搭配“缺陷”“损失”等，与“空白”搭配不当，排除。\n第二空，搭配“价值”，且根据横线后“体现着‘人类命运共同体’理念”可知，横线处应体现出《流浪地球》这部科幻电影可以表达价值，彰显“人类命运共同体”理念之意，D项“诠释”指说明、解释，符合文意，且搭配恰当，当选。A项“开解”指开导、劝解，通常搭配“人”，C项“疏解”指疏通、调解，通常搭配“客流”“误会”等，均与“价值”搭配不当，排除。\n故正确答案为D。\n【文段出处】《人民日报：彰显新时代文艺价值和光辉》","no":30,"missingImage":false},{"qid":"4674877","cat":"逻辑填空","stem":"“江海不择细流，故能就其深。”文明如水，就在于任何一种文明，都是以平等包容的精神进行交流互鉴，以            的态度成其博大精深。不同国家、民族的思想文化，只有多元多样之别，而无高低优劣之分。面对不同文明，我们需要如大海般宽广的胸怀。多样带来交流，交流孕育融合，融合产生进步，当不同的文明可以相互尊重、和谐共处，我们才能从多样的文明中寻求智慧、汲取营养，        更加灿烂的文明图谱。\n依次填入划横线部分最恰当的是：","options":{"A":"海纳百川 绘就","B":"博采众长 刻画","C":"集思广益 绘就","D":"兼收并蓄 刻画"},"answer":"A","explanation":"第一空，根据“江海不择细流，故能就其深”“以平等包容的精神进行交流互鉴”可知，横线处应体现对其他文明的接纳、包容之意。A项“海纳百川”形容胸怀宽广，能包容一切，B项“博采众长”意为广泛地采纳各家的长处，D项“兼收并蓄”意为把内容不同、性质相反的东西都吸收进来，均与文意相符，保留。C项“集思广益”意为集中众人的智慧，广泛吸收有益的意见，强调对别人意见的采纳，与文意不符，排除。\n第二空，搭配“图谱”，A项“绘就”意为描绘出来，与“图谱”搭配恰当，当选。B、D两项，“刻画”意为用文字描写或用其他艺术手段表现（人物的形象、性格），与“图谱”搭配不当，排除。\n故正确答案为A。\n【文段出处】《文明如水，润物无声》","no":31,"missingImage":false},{"qid":"4674870","cat":"逻辑填空","stem":"受多种因素影响，部分网贷机构出现风险。各省区市第一时间进行动员部署，多措并举，维护社会稳定和金融稳定，保护出借人合法权益。依法打击转移资金、跑路等恶性退出行为；        资金流向，        高管人员，        问题机构良性退出；依法缉捕外逃人员，全力做好追赃挽损；回应和解决群众合理诉求。\n依次填入划线部分最恰当的是：","options":{"A":"监管 掌控 引导","B":"掌控 监测 强迫","C":"引导 监测 监管","D":"监测 管控 引导"},"answer":"D","explanation":"第一空，搭配“资金流向”，根据“依法打击转移资金、跑路等恶性退出行为”可知，政府需要实时掌握资金的动向，A项“监管”指监督管理，D项“监测”指监视检测，二者侧重于对资金动向的了解，符合文意，保留。B项“掌控”指掌握控制，C项“引导”指带领，使跟随，二者侧重于对资金流向的指导和控制，文段并非让政府直接去干涉、控制资金的动向，排除。\n第二空，搭配“高管人员”，D项“管控”指管理控制，与“人员”搭配恰当，保留。A项“掌控”侧重于表达“掌握”之意，与“人员”搭配的完整形式多为“掌控人员信息”“掌控人员动向”等，鲜与“人员”直接搭配，排除。\n第三空，代入验证，D项“引导问题机构良性退出”体现政府面对网贷风险时积极、主动的作为，与“第一时间进行动员部署，多措并举”“打击······恶性退出行为”等内容相呼应，当选。\n故正确答案为D。\n【文段出处】《做好专项整治工作 十项举措应对网贷风险》","no":32,"missingImage":false},{"qid":"4674878","cat":"逻辑填空","stem":"从孔子庭训\"不学礼无以立\"，到诸葛亮诫子\"静以修身，俭以养德\"，从岳母刺字激励精忠报国，到朱子家训\"恒念物力维艰\"，一个个家训故事、一句句家风箴言，            着祖辈对后代的希望与嘱托，也蕴含着丰富的人生智慧与美德。中国人自古以来重视家风建设，注重在家庭的            、耳濡目染中塑造子女的人生观与敬畏心。虽然时代在不断变迁，但社会的道德要求与价值坚守未变，传统家庭美德不应成为            的冰冷道理，让其潜移默化更多心灵，全社会都会充盈风清气正、和谐美好的正能量。\n依次填入画横线部分最恰当的是：","options":{"A":"承载 言传身教 束之高阁","B":"承受 事必躬亲 置若罔闻","C":"承袭 现身说法 等闲视之","D":"承担 为人师表 无人问津"},"answer":"A","explanation":"第一空，横线处要体现“故事”“家风箴言”和“希望”“嘱托”的关系。A项“承载”指承受负载，与文意相符，保留。B项“承受”指支承或经受（重量或压力），与“希望和嘱托”搭配不当，排除；C项“承袭”指沿袭继承，一般搭配制度或基业，与“希望和嘱托”搭配不当，排除；D项“承担”指敢于担当的责任与义务，通常与人搭配，与“故事”“家风箴言”搭配不当，排除。\n第二空，代入验证，顿号表并列，A项“言传身教”指言语行为起模范作用，能够与“耳濡目染”构成并列，并能够体现“家庭”对“子女”的教育作用，符合文意，保留。\n第三空，代入验证，A项“束之高阁”指比喻放着不用，也比喻把某事或某种主张、意见、建议等搁置起来，不予理睬和办理，能够与“冰冷道理”搭配，符合文意，当选。\n故正确答案为A。\n【文段出处】《加强家庭家教家风建设》","no":33,"missingImage":false},{"qid":"4674866","cat":"语句表达","stem":"，我们党根基在人民、血脉在人民，必须把人民放在心中最高位置，始终以百姓心为心。共产党的干部要坚持当“老百姓的官”，把自己也当成老百姓，不要做官当老爷，在这一点上，年轻干部从一开始就要想清楚，而且要终身牢记。\n填入划横线部分最恰当的一句是：","options":{"A":"人民是我们党的力量源泉","B":"中国共产党的历史反复证明","C":"对党忠诚是共产党人首要的政治品质","D":"年轻干部要接过艰苦奋斗的接力棒"},"answer":"A","explanation":"横线出现在文段开头，需结合后文内容进行分析。横线后首先指出，党的根基、血脉都在人民，要把人民放在心中最高位置。接着论述了共产党的干部要把自己当成老百姓，当成人民。故文段重在强调，党与人民之间的关系。A项“人民是我们党的力量源泉”是对全文的概括，当选。\nB项“中国共产党的历史反复证明”，C项“对党忠诚是共产党人首要的政治品质”，D项“年轻干部要接过艰苦奋斗的接力棒”，均没有提及党与人民的关系，无法概括后文内容，排除。\n故正确答案为A。\n【文段出处】《习近平在中央党校（国家行政学院）中青年干部培训班开班式上发表重要讲话》","no":34,"missingImage":false},{"qid":"4674872","cat":"语句表达","stem":"下列各句中加下划线的成语，使用最正确的一项是：","options":{"A":"王英杰就读于美国一所著名大学，作为一名\u003cu>莘莘学子\u003c/u>，他心中一直有一个想法，那就是博士毕业后一定要回到祖国建设家园","B":"不可否认，娱乐明星确实为大众带来了欢乐，但近年来娱乐明星们的出场费动辄上千万的现象已\u003cu>蔚然成风\u003c/u>，造成了不良的影响","C":"刘大柱是一个瘦瘦高高的中年人，面颊黝黑，眼眉低垂，一见到陌生的外乡人就紧张，两腮通红，嘴里也\u003cu>期期艾艾\u003c/u>说不出话来","D":"他俩一个是体坛的巨星，一个是时尚界的宠儿，婚后家里家外的日子过得顺风顺水，夫妻俩\u003cu>相濡以沫\u003c/u>，生儿育女，成就一段佳话"},"answer":"C","explanation":"A项“莘莘学子”指众多的学生，前面不能用数量词“一名”修饰，用法不当，排除；\nB项“蔚然成风”形容一种事物逐渐发展、盛行，形成风气，多用于积极的语境中，而文段强调“造成了不良的影响”，感情色彩偏消极，与文段感情色彩不符，排除；\nC项“期期艾艾”形容人口吃，说话不流利，能体现“一见到陌生的外乡人就紧张，两腮通红”的状态，使用正确，当选；\nD项“相濡以沫”比喻在困难中以微小的力量互相帮助，而文段说的是“日子过得顺风顺水”，没有体现困难的处境，用法不当，排除。\n故正确答案为C。","no":35,"missingImage":false},{"qid":"4674871","cat":"片段阅读","stem":"将下列句子按语序先后排列最恰当的一项是：\n①以色列学者尤瓦尔·赫拉利将数据化未来世界的座右铭描述为，“如果你体验到了什么，就记录下来。如果你记录下了什么，就上传。如果你上传了什么，就分享”\n②因此，网络文艺时代，在记录、分享、上传的技术操作中，重新确认个人内心体验的价值和重要性，才不至于在数据系统中迷失人的主体价值\n③通过信息分享和数据交换作为价值判断的标准，是对人类主体性的放逐\n④在巨大的数据系统中，个人对艺术、世界、人类的感受和体验，将被放逐于数据系统\n⑤互联网时代，网络文艺作为文化艺术产品，已经成为用户自我表达和展示的重要出口，也是用户参与世界的重要方式\n⑥反观传统文艺阅读欣赏，关注读者内心的艺术体验，以此为基础思考人类，探索和理解世界","options":{"A":"⑤①④③⑥②","B":"①③④⑥⑤②","C":"④③⑤①②⑥","D":"③⑤④①⑥②"},"answer":"A","explanation":"对比选项，判断首句。①句介绍了以色列学者对数据化未来世界的描绘，③句论述了以信息分享和数据交换作为价值判断的标准是对人类主体性的放逐，④句介绍在数据系统中个人的感受和体验将被放逐于数据系统，⑤句论述互联网时代下网络文艺产品的重要性，首句不好直接判断，故不进行排除。但是通过观察可以发现③句和④句均提到了“放逐”这一概念，③④两句应紧紧相连，但无法确定顺序，排除D项。\n对比其余三项，②句由“因此”引出结论，并给出对策“重新确认个人内心体验的价值和重要性”，与⑥句介绍传统文艺阅读欣赏相比，②句更适合作尾句，排除C项。\n观察A、B两项，⑥句论述的话题是“反观传统文艺阅读欣赏”，说明⑥句之前均为现代文艺欣赏。而①③④⑤句论述的话题均为“网络时代的文艺欣赏与表达”，故①③④⑤句应在⑥句之前，锁定A项。\n故正确答案为A。\n【文段出处】《读者变为用户，别掉进算法的“陷阱”》","no":36,"missingImage":false},{"qid":"4674879","cat":"片段阅读","stem":"8月13日、14日，云南省通海县连续发生两次5.0级地震。记者从应急管理部获悉，14日晚，应急管理部从中央救灾物资昆明储备库，向云南省紧急调拨3000顶帐篷、1.2万张折叠床、1.2万床（件）衣被等中央救灾物资，用于支持通海地震灾区受灾群众紧急转移安置和过渡期生活救助等工作，确保受灾群众基本生活。此前，应急管理部已派出工作组紧急赶赴地震灾区现场，指导和协调地方做好抗震救灾各项工作。截至目前，地震已造成通海县等4县（区）7.6万人受灾，24人受伤，转移安置3.9万人，部分房屋受损，具体灾情仍在进一步统计核查中。\n最适合做这段文字标题的是：","options":{"A":"云南省通海县连续发生两次5.0级地震","B":"应急管理部工作组紧急赶赴地震灾区现场","C":"应急管理部调拨中央救灾物资","D":"应急管理部向云南通海调拨中央救灾物资"},"answer":"D","explanation":"文段开篇引出云南省通海县连续发生两次5.0级地震的话题，随后强调应急对策，即应急管理部从中央救灾物资昆明储备库调拨救灾物资，且进行具体解释说明。最后说明工作组赶赴地震灾区现场，以及灾情核查统计情况。故文段重在强调云南省通海县发生地震，应急管理部做出相应的救援工作，对应D项。\nA项，仅提及云南省发生地震，未提及应急管理部做出救援工作，排除；\nB、C两项，均仅提及应急管理部，未提及地震发生的地点云南省通海县，缺少主题词，排除。\n故正确答案为D。\n【文段出处】人民网《应急管理部向云南通海调拨中央救灾物资》","no":37,"missingImage":false},{"qid":"4674868","cat":"片段阅读","stem":"英国格拉斯哥大学发布的一项新研究说，40岁以下患2型糖尿病的人群，患心血管疾病或因此死亡的风险比其他同龄人更高。该校研究人员领衔的团队在美国《循环》期刊上报告说，他们利用瑞典一个糖尿病人群数据库进行了对比研究，其中涉及31.8万多名2型糖尿病患者和157万多名对照组人员，跟踪调查他们在1998年到2014年间罹患心血管疾病的情况。分析结果显示，在40岁之前被诊断患2型糖尿病的人，得中风、心肌梗死、心脏衰竭以及心房颤动的风险更高，且女性糖尿病患者与男性患者相比这一风险相对更高。报告主要作者格拉斯哥大学教授纳韦德·萨塔尔说，这一结果说明，在年龄不大的2型糖尿病人群中应更积极地去控制心血管疾病风险因素，并鼓励中年2型糖尿病高危人群改变生活方式，以尽可能推后患糖尿病的时间。\n根据上述文段，可以推知：","options":{"A":"女性比男性更容易患心血管疾病","B":"2型糖尿病与心血管疾病存在关联风险","C":"年轻人比年长者更容易患糖尿病","D":"糖尿病患者不可避免会引发心血管疾病"},"answer":"B","explanation":"A项，由“在40岁之前被诊断患2型糖尿病的人，得中风、心肌梗死、心脏衰竭以及心房颤动的风险更高，且女性糖尿病患者与男性患者相比这一风险相对更高”可知，患2型糖尿病的女性患心血管疾病的风险相对更高，“女性”范围扩大，排除；\nB项，由“40岁以下患2型糖尿病的人群，患心血管疾病或因此死亡的风险比其他同龄人更高”可知，2型糖尿病与心血管疾病之间确实存在关联风险，表述正确，当选；\nC项，文段并未涉及年轻人与年长者患糖尿病的比较，无关比较，排除；\nD项，由“40岁以下患2型糖尿病的人群，患心血管疾病或因此死亡的风险比其他同龄人更高”可知，患2型糖尿病的人群患心血管疾病的风险更高，“不可避免”表述过于绝对，排除。\n故正确答案为B。\n【文段出处】新华网《研究：40岁以下2型糖尿病患者应警惕心血管病风险》","no":38,"missingImage":false},{"qid":"4674874","cat":"语句表达","stem":"脱贫攻坚战的全面胜利，标志着我们党在团结带领人民创造美好生活、实现共同富裕的道路上迈出了坚实的一大步。同时，                    。解决发展不充分问题、缩小城乡区域发展差距、实现人的全面发展和全体人民共同富裕仍然任重道远。我们没有任何理由骄傲自满、松劲歇脚，必须乘势而上、再接再厉、接续奋斗。\n填入划横线部分最恰当的一句是：","options":{"A":"要切实做好巩固拓展脱贫攻坚成果同乡村振兴有效衔接各项工作","B":"全党全国全社会都要大力弘扬脱贫攻坚精神","C":"脱贫摘帽不是终点，而是新生活、新奋斗的起点","D":"这些重要经验和认识，是我国脱贫攻坚的理论结晶，必须长期坚持并不断发展"},"answer":"C","explanation":"横线位于文段中间，故横线处所填句子应起到承上启下的作用，需结合上下文进行分析。横线前指出脱贫攻坚的全面胜利标志着向创造美好生活、实现共同富裕迈出了一大步，横线后指出实现全面发展和全体人民共同富裕仍任重道远，我们不能松劲歇脚，需要接续奋斗。故横线处应体现出脱贫攻坚取得了一定的成绩，但是要实现共同富裕我们仍需继续奋斗，C项“脱贫摘帽不是终点，而是新生活、新奋斗的起点”既对应横线前脱贫攻坚取得的成绩，又对应横线后所强调的要继续奋斗，起到承上启下的作用，当选。\nA项，“脱贫攻坚成果”可对应横线前的内容，但“乡村振兴”与横线后话题不一致，衔接不当，排除；\nB项，“脱贫攻坚精神”仅对应横线前的内容，与横线后的“任重道远”“接续奋斗”无法衔接，排除；\nD项，“这些重要经验和认识”横线前并未提及经验和认识，无中生有，排除。\n故正确答案为C。\n【文段出处】《全国脱贫攻坚总结表彰大会在京隆重举行 习近平向全国脱贫攻坚楷模荣誉称号获得者等颁奖并发表重要讲话》","no":39,"missingImage":false},{"qid":"4674882","cat":"片段阅读","stem":"迄今为止，基因治疗已经不断尝试了近三十年。其方法是将人为改变基因的细胞或是正常的基因输入人体内，用以治疗疾病。虽然这种方法并不是直接治疗出现问题的基因，但也有报道称，通过“补充”正常的基因使病情得到了快速改善。将这种基因治疗的概念再次发展延伸后，就是被称作终极治疗的基因组编辑治疗。基因组编辑是能够精确改写或替换某个特定基因的技术，通过灵活运用这一技术，就能对导致疾病的基因本身改写或替换，也就是通常所说的修复基因。这种治疗的操作方法类似口服药物或注射药物，而其得到的治疗效果与手术效果相近。\n能够从上述文字推断出的是：","options":{"A":"基因组编辑治疗与药物治疗都能在细胞中发挥作用","B":"基因组编辑治疗与手术治疗可谓旗鼓相当","C":"基因组编辑治疗的主要受益者是无法通过药物或手术治疗的先天疾病患者","D":"被称作终极治疗，意味着患者只需一次基因组编辑治疗就能彻底根治"},"answer":"B","explanation":"A项，文段没有指出“药物治疗”能在细胞中发挥作用，无中生有，排除；\nB项，对应尾句“这种治疗······而其得到的治疗效果与手术效果相近”，表述正确，当选；\nC项，文段没有提到基因组编辑治疗的“主要受益者”，无中生有，排除；\nD项，“只需一次基因组编辑治疗就能彻底根治”文段并未提及，无中生有，排除。\n故正确答案为B。","no":40,"missingImage":false},{"qid":"4674876","cat":"片段阅读","stem":"中国人民大学教育学院教授程方平指出，相较于传统线下教育，在线教育在这方面的优势十分突出，它突破时间和空间的限制，满足了移动互联网时代用户学习时间碎片化的需求，提升了学习效率。在线教育还可以跨越因地域等方面造成的教育资源不平等分配问题，使教育资源共享化，降低了学习的门槛。\n根据这段文字可知，划线文句要表达的意思是：","options":{"A":"在线教育能够改变教育资源分配不平等状况","B":"在线教育满足了移动互联网时代用户学习时间碎片化的需求","C":"在线教育在一定程度上可以缓解由教育资源分配不平等带来的后果","D":"在线教育提升了学习效率"},"answer":"C","explanation":"根据“还”可知，划线句主要介绍在线教育的另一方面作用。由划线句中结论词“使”可知，该句重点在“使”引导的内容，强调在线教育“使教育资源共享化，降低了学习的门槛”，即缓解由教育资源分配不平等带来的后果，对应C项。\nA项，“能够改变”表述错误，文段只是说“可以跨越······教育资源不平等分配问题”，即教育资源不平等分配的问题仍然存在，在线教育并不能解决这一问题，排除；\nB、D两项，均对应划线前的内容，非划线文句要表达的意思，排除。\n故正确答案为C。\n【文段出处】《在线教育之乱，“愿打愿挨”不是理由》","no":41,"missingImage":false},{"qid":"4674880","cat":"片段阅读","stem":"马克思曾说∶“英国的入侵······摧毁了印度原有的经济基础，解构了那些半野蛮半原始的社会结构······虽然对此我们会心怀悲伤，但是我们一定不能忘记，正是这些看起来平和的田园牧歌式的乡村社会结构构成了东方专制主义最坚实的基础，它极大地禁锢了人们的思想。”\n对这段话理解最准确的是：","options":{"A":"文化交流和文化开放可能带来文化损失","B":"不是每一种文化的所有要素都值得保护","C":"一些传统文化因为文化传播被逐步淘汰","D":"文化的开放使得一些弱势文化趋于灭亡"},"answer":"B","explanation":"文段论述的是马克思的一句话，首先指出英国的入侵摧毁了印度原有的经济基础和社会结构，随后通过“但是”转折指出，印度原先的乡村社会结构禁锢了人们的思想，换句话说印度原有的那种禁锢人们思想的乡村文化是应该被摧毁的，不值得惋惜，由此可知文化中的一些落后要素是没必要保护的，对应B项。\nA项，“文化交流和文化开放”无中生有，且“文化损失”与文意相悖，排除；\nC项，“文化传播”无中生有，且“淘汰”感情倾向与文段不符，排除；\nD项，印度的传统文化并不意味着就是弱势文化，“弱势文化”无中生有，排除。\n故正确答案为B。\n【文段出处】高中历史","no":42,"missingImage":false},{"qid":"4674884","cat":"片段阅读","stem":"文明的水平不过反映了各文明的演进阶段。一个文明形成之初，其人民往往生气勃勃，充满活力，粗悍，具有流动性和扩张性，他们相对来说是不文明的。随着文明的演进，人们日益定居下来，并发展了使其变得更为文明的技术和工艺。随着其主要组成部分之间竞争的减少和普遍国家的出现，该文明便达到了文明的最高水平，即它的\"黄金时代\"，道德、艺术、文学、哲学、技术以及军事、经济和政治能力均达到鼎盛时期。当它作为一个文明开始衰落时，其文明的水平亦开始下降，直至它在另一个水平较低但蓬勃发展的文明的进攻下消失。\n对上述文意理解有误的一项是：","options":{"A":"作者认同文明是循环式的发展","B":"当一个文明开始衰落时，其道德、艺术、文学、哲学、技术以及军事、经济和政治能力就开始下降","C":"\"黄金时代\"的文明往往不具备扩张性","D":"人们定居下来，会更加有可能将文明演化为更高水平"},"answer":"C","explanation":"A项，根据“一个文明形成之初······相对来说是不文明的。随着文明的演进······该文明便达到了文明的最高水平······当它作为一个文明开始衰落时，其文明的水平亦开始下降，直至······消失”可知，文明的发展符合周而复始的变化规律，即循环式发展，符合文意，排除；\nB项，根据“该文明便达到了文明的最高水平······道德、艺术、文学、哲学、技术以及军事、经济和政治能力均达到鼎盛时期。当······文明开始衰落时，其文明的水平亦开始下降”可知，符合文意，排除；\nC项，文段并未提及“黄金时代”的文明是否具备扩张性，无中生有，当选；\nD项，根据“随着文明的演进，人们日益定居下来，并发展了使其变得更为文明的技术和工艺。随着其主要组成部分之间竞争的减少和普遍国家的出现，该文明便达到了文明的最高水平”可知，符合文意，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《&lt;文明的冲突与世界秩序的重建&gt;丨文明的共性》","no":43,"missingImage":false},{"qid":"4674885","cat":"片段阅读","stem":"中秋节是农历八月最重要的节日。作为民间大节，中秋节的民俗活动十分丰富，包括拜月、赏月等。圆月与人间的团圆、丰收联系了起来，赋予了节日美满、喜庆的气氛。俗话说，民以食为天，中秋节的食俗也是多种多样，各地的中秋美食令人无限神往。\n由此可推，作者接下来最可能重点写作的内容是：","options":{"A":"各地的中秋美食","B":"概括中秋节的民俗活动","C":"各地的中秋赏月活动","D":"各地中秋节的民俗活动"},"answer":"A","explanation":"本题为接语选择题。文段开篇点明中秋节的意义，随后列举中秋节的相关民俗活动，尾句强调中秋美食令人无限神往，故接下来应围绕“中秋美食”展开论述，对应A项。\nB项和D项的“民俗活动”、C项的“赏月活动”均与文段最后谈论的核心话题“中秋美食”不一致，排除。\n故正确答案为A。\n【文段出处】《舌尖上的中秋》","no":44,"missingImage":false},{"qid":"4674892","cat":"片段阅读","stem":"随着新冠肺炎肆虐全球，作为治疗新冠肺炎重症患者的终极手段，ECMO（体外膜肺氧合）得到了越来越多的关注。目前，ECMO已经在重症心肺功能衰竭的治疗中起到了关键的呼吸和循环支持作用。ECMO可分为静脉—静脉ECMO（VV ECMO）和静脉—动脉ECMO（VA ECMO）两种模式。呼吸衰竭是各种原因引起的肺功能严重障碍，不能进行有效的气体交换，导致缺氧以至不能满足机体代谢需要的综合征。仅有严重呼吸衰竭的患者可采用VV ECMO模式。此时ECMO就相当于一个“人工肺”，只有呼吸支持作用。可用于各种原因所致的急性呼吸衰竭，如新生儿胎粪吸入综合征、新生儿先天性膈疝、各种肺炎等。心力衰竭是各种原因引起的心脏泵血功能减弱，心输出量下降，以至不能满足机体代谢需要的综合征。患者有严重心力衰竭或心肺同时衰竭可采用VA ECMO，此时ECMO就相当于“人工心”加“人工肺”，同时具有呼吸和循环支持作用。可用于各种原因所致的急性心脏衰竭，如心源性休克，以及心脏或肺手术后、传统心肺复苏后严重心肺功能不全等。\n从上述文段可推出：","options":{"A":"VV ECMO模式无需自体心脏输送血液","B":"ECMO是一种人工体外心、肺支持系统","C":"治疗新冠肺炎主要采用VV ECMO模式","D":"ECMO还不能彻底替代人体自身的心肺"},"answer":"B","explanation":"A项，根据“仅有严重呼吸衰竭的患者可采用VV ECMO模式······只有呼吸支持作用”可知，“VV ECMO模式”只有呼吸支持作用，是需要自体心脏输送血液的，故“无需”表述错误，排除；\nB项，根据“目前，ECMO已经在重症心肺功能衰竭的治疗中起到了关键的呼吸和循环支持作用”“此时ECMO就相当于‘人工心’加‘人工肺’，同时具有呼吸和循环支持作用”可知，表述正确，当选；\nC项，根据“作为治疗新冠肺炎重症患者的终极手段······ECMO可分为······两种模式”可知，ECMO可分为两种模式，而文段并未提及“主要采用VV ECMO模式”，无中生有，排除；\nD项，根据“患者有严重心力衰竭或心肺同时衰竭可采用VA ECMO······同时具有呼吸和循环支持作用”可知，文段并未提及ECMO是否可以“彻底替代人体自身的心肺”，无中生有，排除。\n故正确答案为B。\n【文段出处】《ECMO：跨越生死的“桥梁”》","no":45,"missingImage":false}]}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"4674782","cat":"数学运算","stem":"-7，9，-5，13，3，（    ）","options":{"A":"29","B":"-29","C":"17","D":"-17"},"answer":"A","explanation":"观察数列，无明显特征，且作差无规律，考虑作和。相邻两项相加得到新数列：2，4，8，16，（    ），是公比为2的等比数列，新数列下一项为16×2=32。故原数列所求项=32-3=29。\n故正确答案为A。","no":46,"missingImage":false},{"type":"question","qid":"4674791","cat":"数学运算","stem":"－1，2，－8，48，－384，（    ），－46080","options":{"A":"-3072","B":"3072","C":"-3840","D":"3840"},"answer":"D","explanation":"观察数列，发现相邻项间有明显的倍数关系，考虑作商。后项÷前项可得新数列：-2，-4，-6，-8，（    ），（    ），是公差为-2的等差数列，则新数列接下来两项为-10和-12，则原数列所求项=-384×（-10）=3840。代入验证，-46080÷3840=-12，符合规律。\n故正确答案为D。","no":47,"missingImage":false},{"type":"question","qid":"4674794","cat":"数学运算","stem":"一个数列1，\u003cimg data-k=\"0f1fa1d0536c\">，1，\u003cimg data-k=\"0f1fa1d0536c\">，\u003cimg data-k=\"bec3fe75cd62\">，\u003cimg data-k=\"8c3342040bcf\">，1，\u003cimg data-k=\"8c3342040bcf\">，\u003cimg data-k=\"bec3fe75cd62\">，\u003cimg data-k=\"a8b04cd19bab\">，\u003cimg data-k=\"0f1fa1d0536c\">，\u003cimg data-k=\"97dceef419de\">，1，\u003cimg data-k=\"97dceef419de\">，\u003cimg data-k=\"0f1fa1d0536c\">，\u003cimg data-k=\"a8b04cd19bab\">，······，根据该数列的排列规律，请问\u003cimg data-k=\"4708371a12d0\">第二次出现是第（    ）个数。","options":{"A":"120","B":"126","C":"140","D":"146"},"answer":"C","explanation":"将原数列反约分，根据相同分母分组可表示为：\u003cimg data-k=\"b3b3ef97088c\">，\u003cimg data-k=\"5458e1d3b439\">\u003cimg data-k=\"3f05f5fdaaff\">，\u003cimg data-k=\"4045d1efa56b\">，\u003cimg data-k=\"3f05f5fdaaff\">，\u003cimg data-k=\"5458e1d3b439\">\u003cimg data-k=\"3a9dc4442269\">，\u003cimg data-k=\"6c3f660a5367\">，\u003cimg data-k=\"3833162b3738\">，\u003cimg data-k=\"6c3f660a5367\">，\u003cimg data-k=\"3a9dc4442269\">，\u003cimg data-k=\"5458e1d3b439\">\u003cimg data-k=\"524311ce6fd4\">，\u003cimg data-k=\"4637f137d57d\">，\u003cimg data-k=\"b11e6ad0961b\">，\u003cimg data-k=\"f60e853fa57f\">，\u003cimg data-k=\"b11e6ad0961b\">，\u003cimg data-k=\"4637f137d57d\">，\u003cimg data-k=\"524311ce6fd4\">，\u003cimg data-k=\"5458e1d3b439\">······。观察分母发现：分母为1、2、3、4的各组分数分别有1个、3个、5个、7个，即分母为n的分数有（2n-1）个，也就是分数个数是公差为2的等差数列；观察分子发现：各组的分子以1为公差，依次由1向n递增，再递减回1。\n综上规律可知：根据该数列的排列规律，以12为分母的分数有2×12-1=23个。根据等差数列公式：\u003cimg data-k=\"dcd27692c8ec\">，可得从1至12为分母的分数总个数为\u003cimg data-k=\"a58fcccda7e0\">个。以12为分母的分数分别为：\u003cimg data-k=\"98974d6b7e14\">，······，\u003cimg data-k=\"4708371a12d0\">，······，\u003cimg data-k=\"c8ece0af4aaf\">，······，\u003cimg data-k=\"4708371a12d0\">，\u003cimg data-k=\"32fe2de8aef9\">，\u003cimg data-k=\"8c32142a8f57\">，\u003cimg data-k=\"895347291cd3\">，\u003cimg data-k=\"98974d6b7e14\">。即\u003cimg data-k=\"4708371a12d0\">第二次出现后面还有4个分数，则\u003cimg data-k=\"4708371a12d0\">第二次出现是原数列中第144-4=140个数。\n故正确答案为C。","no":48,"missingImage":false},{"type":"question","qid":"4674828","cat":"数学运算","stem":"一个筐里装有2160个苹果，如果不是一次全部拿出，也不是一个一个地拿，要求每次拿的个数相同，拿到最后正好取完，那么共有（    ）种不同的拿法。","options":{"A":"30","B":"36","C":"38","D":"40"},"answer":"C","explanation":"根据题意：总数=每次拿的个数×次数，每次拿出的苹果个数为2160的因子，故不同的因子对应不同的拿法。因为\u003cimg data-k=\"a6b2983fec72\">，那么2160的因子，包含2的情况可以分为0个2，1个2，2个2，3个2，4个2，有5种；包含3的情况可以分为0个3，1个3，2个3，3个3，有4种；包含5的情况可以分为0个5，1个5，有2种。所以2160的因子个数为5×4×2=40个，其中包含1和2160这两个因子，根据题意，去掉1与2160这两个因子，符合题意的因子共有40-2=38个，即38种不同的拿法。\n故正确答案为C。","no":49,"missingImage":false},{"type":"question","qid":"4674830","cat":"数学运算","stem":"一名工人操作切割机可以一次性切割很多根钢管，并且无论一次切割多少根钢管，每次切割所需要的时间都一样。如果用最高效方式把一根很长的钢管切成16段要8分钟，那么用一次只切割一根钢管的方式把这根完整的钢管切成32段需要：","options":{"A":"10分钟","B":"16分钟","C":"1小时4分钟","D":"1小时2分钟"},"answer":"D","explanation":"根据题意，若用最高效方式，则钢管每次被切割，数量会变成原来的2倍，因为\u003cimg data-k=\"b76135da1898\">，所以切成16段需要4次，可得切割一次所需时间为8÷4=2分钟。若一次只切割一根钢管，则变成2段需要1次，再变成4段需要2次，再变成8段需要4次，再变成16段需要8次，再变成32段需要16次，故共计1+2+4+8+16=31次，所需时间为31×2=62分钟，即1小时2分钟。\n故正确答案为D。","no":50,"missingImage":false},{"type":"question","qid":"4674827","cat":"数学运算","stem":"为评选扶贫工作先进项目案例，某乡镇举行优秀扶贫项目案例评选活动，共邀请71名评委参加投票评选，从甲、乙、丙、丁、戊五个案例中评选“最佳案例”，最终甲得选票35张，乙得选票为第二名，丙、丁票数一样，戊得选票8张为最少，那么乙得选票（    ）张。","options":{"A":"8","B":"9","C":"10","D":"11"},"answer":"C","explanation":"设乙得票数为x张，丙和丁得票数均为y张，根据题意可列方程：35+x+2y+8=71，整理可得x+2y=28。2y与28均为偶数，则x必为偶数，排除B、D两项，且乙为第二名，得票数应高于戊，排除A项。代入C项验证，当乙得票10张时，y=（28-10）÷2=9张，符合题意。\n故正确答案为C。","no":51,"missingImage":false},{"type":"question","qid":"4674832","cat":"数学运算","stem":"在平面直角坐标系中，如果点P（4a-7，16-19a）在第三象限内，其横、纵坐标都是整数，则点P的坐标是：","options":{"A":"（-3，-1）","B":"（-3，-3）","C":"（-1，-3）","D":"（-7，-3）"},"answer":"B","explanation":"点P在直角坐标系第三象限内，即横、纵坐标均为负数，代入选项验证。\n当横坐标4a-7=-3时，解得a=1，代入纵坐标16-19a=-3，排除A项，B项当选。\n同理，当纵坐标16-19a=-3时，横坐标必为-3，排除C、D两项。\n故正确答案为B。","no":52,"missingImage":false},{"type":"question","qid":"4674829","cat":"数学运算","stem":"一项工程，甲单独完成需要15天，乙单独完成需要30天，丙单独完成需要60天，如果按照甲乙丙的顺序交替进行每人做一天，那么需要（    ）天能完成。","options":{"A":"25","B":"26","C":"27","D":"28"},"answer":"A","explanation":"赋值工程总量为60，则甲的效率为60÷15=4，乙的效率为60÷30=2，丙的效率为60÷60=1。若按照甲乙丙的顺序交替进行每人做一天，那么3天为一周期，一周期内完成工作量=4+2+1=7，因为\u003cimg data-k=\"d477dc08cac4\">个周期······4个工作量，余下的工作量正好由甲做一天即可完成，所以整个工作过程共需8×3+1=25天。\n故正确答案为A。","no":53,"missingImage":false},{"type":"question","qid":"4674799","cat":"数学运算","stem":"某机关下午2点整派车去党校接某教授作党史教育专题授课，往返需1小时，该教授在下午1点整就离开党校向该机关步行走来，途中遇到接他的车，便乘上车去该机关，于下午2点50分到达，不考虑上下车时间，汽车的速度是教授步行速度的（    ）。","options":{"A":"12倍","B":"13倍","C":"15倍","D":"17倍"},"answer":"D","explanation":"根据题意，某机关下午2点整派车去党校接教授，往返需1小时，可推出汽车到党校时间为下午2：30。但汽车2点从机关出发去接教授，2：50便已返回，则可推出汽车遇到教授时为2：25，少走了5分钟的路程。教授从1点出发，遇到汽车时已行走了2：25-1:00=85分钟的路程。汽车少走的路程即为教授步行的路程。当路程一定时，时间与速度成反比，\u003cimg data-k=\"a08304d0c2a1\">，则\u003cimg data-k=\"37672f3f0a81\">。因此汽车的速度是教授步行速度的17倍。\n故正确答案为D。","no":54,"missingImage":false},{"type":"question","qid":"4674801","cat":"数学运算","stem":"某单位在编一本年鉴，其页数需要用6893个数字，那么这本年鉴共有（    ）页。","options":{"A":"1999","B":"1994","C":"2000","D":"2004"},"answer":"C","explanation":"根据选项可确定该年鉴的页数在1000页以上，但不到10000页。根据页码所需数字个数分情况计算：\n①1-9页，共有9页，每页1个数字，共需9×1=9个数字；\n②10-99页，共有90页，每页2个数字，共需90×2=180个数字；\n③100-999页，共有900页，每页3个数字，共需900×3=2700个数字。\n此时还剩6893-9-180-2700=4004个数字，从1000页开始，每页4个数字，有\u003cimg data-k=\"9fd6647cf3b5\">页，999+1001=2000页，即这本年鉴共有2000页。\n故正确答案为C。","no":55,"missingImage":false},{"type":"question","qid":"4674802","cat":"数学运算","stem":"不到30岁的哥哥今年的年龄正好是弟弟年龄的5倍，若干年后哥哥的年龄就是弟弟的4倍，又过了若干年，哥哥的年龄将是弟弟的3倍，则今年两兄弟的年龄差是（    ）岁。","options":{"A":"12","B":"13","C":"14","D":"15"},"answer":"A","explanation":"方法一：根据题意，设今年弟弟的年龄为n，则哥哥的年龄为5n，那么两人的年龄差为4n，即为4的倍数，观察选项，只有A项符合。\n方法二：根据“不到30岁的哥哥今年的年龄正好是弟弟年龄的5倍”可知，今年哥哥与弟弟的年龄可能分别为5岁与1岁、10岁与2岁、15岁与3岁、20岁与4岁、25岁与5岁，则今年两兄弟的年龄差可能是4岁、8岁、12岁、16岁、20岁。只有A项符合。\n故正确答案为A。","no":56,"missingImage":false},{"type":"question","qid":"4674804","cat":"数学运算","stem":"如图，一块正方形的花园ABCD的面积是120平方米，为了种植不同种类的花将其划分成一些小区域，其中，E是AB的中点，F是BC的中点，则四边形区域BGHF的面积是（    ）平方米。\n\u003cimg data-k=\"32fb15018b9f\" style=\"max-width:276px\">","options":{"A":"14","B":"16","C":"18","D":"20"},"answer":"A","explanation":"因为E是AB的中点，所以\u003cimg data-k=\"df506dae6d6d\">为正方形ABCD面积的\u003cimg data-k=\"a8b04cd19bab\">，即\u003cimg data-k=\"a58eb7
