异，再逆时针旋转\u003cimg data-k=\"dd44efe89e5a\">，即可得到图3；经验证，第二行满足此规律；第三行应用此规律，只有C项符合。\n故正确答案为C。","no":84,"missingImage":false},{"qid":"19526397","cat":"图形推理","stem":"左边为由15个白色正方体和3个黑色正方体组合而成的多面体俯视图和左视图，其正视图可能是：\n\u003cimg data-k=\"54751fb49d42\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查三视图。题干中俯视图中间一列最下方为黑色正方形，左视图最右列只有最下方一个黑色正方形，则对应选项中正视图中间一列最下方为黑色正方形，排除C、D两项。\n俯视图、左视图结合选项主视图可以确定立体图形，逐一分析A、B选项。\nA项：结合题干两个视图和A项，可能的立体图形有以下5种情况（注意图④和图⑤两个箭头指向的正方体的下方为黑色正方体），如下图所示。此时在所有情况下，立体图形均只有12个白色正方体，而题干中所给为15个白色正方体，不符合题干要求，排除；\n\u003cimg data-k=\"c76896f4abff\" style=\"max-width:576px\">\nB项：结合题干两个视图和B项，可以确定立体图形（注意第二层左上角为黑色正方体），如下图所示。此时立体图形有15个白色正方体和3个黑色正方体，符合题干要求，当选。\n\u003cimg data-k=\"f7f7a525b659\" style=\"max-width:143px\">\n故正确答案为B。","no":85,"missingImage":false},{"qid":"19526393","cat":"图形推理","stem":"左边为给定的正方体纸盒的外表面展开图，由2个该正方体纸盒组合而成的长方体可能是：\n\u003cimg data-k=\"cd2334d237d9\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"将原展开图标上序号如下图，逐一进行分析。\n\u003cimg data-k=\"0d719339bb80\" style=\"max-width:600px\">\nA项：选项中左侧正方体纸盒由面f和面i构成，右侧正方体纸盒由面f、面g和面k构成，选项与题干展开图一致，当选；\nB项：选项中右侧正方体纸盒由面e、面h和面i构成，题干展开图中三个面的公共点与面i上黑块的顶点重合，而选项中三个面的公共点与面i上的黑块不相交，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"f7fe74f62a48\" style=\"max-width:600px\">\nC项：选项中左侧正方形纸盒由面f和面h构成，题干展开图中面f和面h为相对面，不能同时出现，选项与题干展开图不一致，排除；\nD项：选项中右侧正方形纸盒由面f、面h和面i构成，题干展开图中面f和面h为相对面，不能同时出现，选项与题干展开图不一致，排除。\n故正确答案为A。","no":86,"missingImage":false},{"qid":"19526323","cat":"图形推理","stem":"左边为由12个白色正方体和3个灰色正方体组合而成的多面体前后两面直观图，问其可以由除哪项外的三个多面体组合而成？\n\u003cimg data-k=\"ea813827a4d0\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查立体拼合。题干多面体可以由A、B、D三项中的立体图形拼合而成，具体拼合过程如下图所示：\n\u003cimg data-k=\"591b136d49cd\" style=\"max-width:600px\">\n本题为选非题，故正确答案为C。","no":87,"missingImage":false},{"qid":"19526391","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"b4200a9875d7\" style=\"max-width:500px\">","options":{"A":"①②③，④⑤⑥","B":"①③④，②⑤⑥","C":"①③⑥，②④⑤","D":"①⑤⑥，②③④"},"answer":"C","explanation":"本题为分组分类题目。元素组成相同，但无明显位置规律。观察发现，题干图形均出现两个黑块，在连接两个黑块的最短路径中，且图①③⑥中两个黑块均通过一条线连接，图②④⑤中两个黑块均通过一个面连接，即图①③⑥为一组，图②④⑤为一组。\n故正确答案为C。","no":88,"missingImage":false},{"qid":"19526253","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"e0ae613145b1\" style=\"max-width:500px\">","options":{"A":"①②⑥，③④⑤","B":"①②④，③⑤⑥","C":"①⑤⑥，②③④","D":"①④⑥，②③⑤"},"answer":"B","explanation":"元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，题干每幅图中均存在一个黑色面和四个白色面，但根据面的数量无法分组分类，故考虑面的细化。再次观察发现，每幅图中均有1-2个白色面形状与黑色面形状相同，故考虑相同形状的面，图①②④中黑色面的形状与2个白色面形状一致，图③⑤⑥中黑色面的形状与1个白色面形状一致，故图①②④为一组，图③⑤⑥为一组。\n故正确答案为B。","no":89,"missingImage":false},{"qid":"19526305","cat":"图形推理","stem":"把下面6个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"4774f750cd2c\" style=\"max-width:500px\">","options":{"A":"①④⑤，②③⑥","B":"①③⑥，②④⑤","C":"①②⑥，③④⑤","D":"①②④，③⑤⑥"},"answer":"A","explanation":"题干图形均由正六边形宫格及若干线条组成，且线条之间都存在一个十字交叉点，观察十字交叉点的位置，图①④⑤中十字交叉点位于白球外部，图②③⑥中十字交叉点位于白球内部，故图①④⑤为一组，图②③⑥为一组，只有A项符合。\n故正确答案为A。","no":90,"missingImage":false},{"qid":"19526356","cat":"定义判断","stem":"《中国共产党纪律处分条例》规定，主动交代本人应当受到党纪处分的问题，可以从轻或者减轻处分。这里所称的主动交代主要包括两种情况：一是涉嫌违纪的党员在组织谈话函询、初步核实前向有关组织交代自己的问题。二是在谈话函询、初步核实和立案审查期间交代组织未掌握的问题。\n假定下列人员均受该条例约束，根据上述定义，下列属于主动交代的是：","options":{"A":"甲在参加违纪违法典型案例警示教育大会后，主动找到单位领导反映同事的违纪问题","B":"乙在组织对其进行廉政谈话时，组织举证一项他才承认一项，对未涉及的情况闭口不谈","C":"丙在纪委对其个人财产有关事项进行函询时，将其利用职权为自己和他人谋利的情况如实交代","D":"丁在纪委对其立案审查期间，面对确凿的证据，交代了之前没有交代的收受大额礼金的问题"},"answer":"C","explanation":"第一步：找出定义关键词。\n“主动交代本人应当受到党纪处分的问题”、“涉嫌违纪的党员在组织谈话函询、初步核实前向有关组织交代自己的问题”、“在谈话函询、初步核实和立案审查期间交代组织未掌握的问题”。\n第二步：逐一分析选项。\nA项：甲主动找到单位领导反映同事的违纪问题，并非交代本人的违纪问题，不符合“主动交代本人应当受到党纪处分的问题”，不符合定义，排除；\nB项：乙在组织对其进行廉政谈话时，组织举证一项他才承认一项，不符合“主动交代本人应当受到党纪处分的问题”，不符合定义，排除；\nC项：丙在纪委对其个人财产有关事项进行函询时，如实交代了自己利用职权谋利的问题，符合“在谈话函询、初步核实和立案审查期间交代组织未掌握的问题”，符合定义，当选；\nD项：丁在纪委立案审查期间，面对确凿证据才交代了之前未交代的收受大额礼金的问题，不符合“主动交代本人应当受到党纪处分的问题”、“在谈话函询、初步核实和立案审查期间交代组织未掌握的问题”，不符合定义，排除。\n故正确答案为C。","no":91,"missingImage":false},{"qid":"19526274","cat":"定义判断","stem":"波特五力模型是一种竞争分析工具，用于评估一个行业的竞争力和吸引力。该模型通过对同行业竞争对手的威胁、潜在进入者的威胁、替代品的威胁、上游供应商的议价能力和下游购买者的议价能力这五个方面的分析，帮助企业了解其所处行业的竞争环境，以制定相应的竞争策略。\n根据上述定义，关于康复机器人行业，对下列问题的分析不能归入波特五力模型的是：","options":{"A":"康复机器人行业准入门槛高吗？需要强大的技术能力和创新能力吗？","B":"医院和康复中心患者规模如何？对于康复机器人的需求有多大？","C":"与传统物理治疗等康复治疗方法相比，康复机器人有竞争力吗？","D":"康复机器人企业内部各部门之间的协同合作程度高吗？"},"answer":"D","explanation":"第一步：找出定义关键词。\n“同行业竞争对手的威胁”、“潜在进入者的威胁”、“替代品的威胁”、“上游供应商的议价能力”、“下游购买者的议价能力”、“帮助企业了解其所处行业的竞争环境，以制定相应的竞争策略”。\n第二步：逐一分析选项。\nA项：康复机器人行业准入门槛高吗？需要强大的技术能力和创新能力吗？问题中的“准入门槛”、“技术能力和创新能力”直接关系到潜在企业能否进入康复机器人行业，符合波特五力模型中的“潜在进入者的威胁”，符合定义，排除；\nB项：医院和康复中心患者规模如何？对于康复机器人的需求有多大？问题中的“医院”和“康复中心”是康复机器人的“下游购买者”，“患者规模”与“需求程度”会直接影响购买者采购时的“议价能力”，符合波特五力模型中的“下游购买者的议价能力”，符合定义，排除；\nC项：与传统物理治疗等康复治疗方法相比，康复机器人有竞争力吗？问题中的“传统物理治疗”是康复机器人的“替代方案”，是在分析“替代品”的竞争力对行业的威胁，符合波特五力模型中的“替代品的威胁”，符合定义，排除；\nD项：康复机器人企业内部各部门之间的协同合作程度高吗？问题中的“企业内部各部门之间的协同合作程度”属于企业“内部管理”的范畴，不符合波特五力模型中的任何一个，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":92,"missingImage":false},{"qid":"19526398","cat":"定义判断","stem":"组织结构可以划分为以下几种类型：（1）直线型组织结构，即每一个部门只对其直接的下属部门下达工作指令，不能越级指挥，每一个部门也只有一个直接的上级部门；（2）职能型组织结构，即每一个部门都可对其下属部门下达工作指令，每一个下属部门可能得到不同上级部门下达的多个工作指令；（3）直线职能型组织结构，即在主管之下设置相应的职能部门，实行主管统一指挥与职能部门参谋指导相结合的管理方式，各部门既受上级的管理，又受同级职能管理部门的业务指导和监督；（4）事业部组织结构，即由相对独立的事业部组成的组织结构，通常按照地区或项目来划分事业部，每个事业部拥有较大的自主权。\n根据上述定义，下列组织结构图代表的组织结构类型属于：\n\u003cimg data-k=\"03327e934a1d\" style=\"max-width:441px\">","options":{"A":"直线型组织结构","B":"职能型组织结构","C":"直线职能型组织结构","D":"事业部组织结构"},"answer":"B","explanation":"第一步：找出定义关键词。\n直线型组织结构：“每一个部门只对其直接的下属部门下达工作指令”、“不能越级指挥”、“每一个部门也只有一个直接的上级部门”；\n职能型组织结构：“每一个部门都可对其下属部门下达工作指令”、“每一个下属部门可能得到不同上级部门下达的多个工作指令”；\n直线职能型组织结构：“在主管之下设置相应的职能部门，实行主管统一指挥与职能部门参谋指导相结合的管理方式”、“各部门既受上级的管理，又受同级职能管理部门的业务指导和监督”；\n事业部组织结构：“由相对独立的事业部组成的组织结构”、“通常按照地区或项目来划分事业部”、“每个事业部拥有较大的自主权”。\n第二步：逐一分析选项。\nA项：结构图中项目二组和项目三组等存在多个上级部门下达指令，不符合“每一个部门也只有一个直接的上级部门”，不符合“直线型组织结构”定义，排除；\nB项：结构图中的每一个部门都有上级部门，且项目二组和项目三组等存在多个上级部门下达工作指令，符合“每一个部门都可对其下属部门下达工作指令”、“每一个下属部门可能得到不同上级部门下达的多个工作指令”，符合“职能型组织结构”定义，当选；\nC项：结构图中的每个部门都不存在同级职能管理部门的业务指导和监督，不符合“各部门既受上级的管理，又受同级职能管理部门的业务指导和监督”，不符合“直线职能型组织结构”定义，排除；\nD项：结构图中工程技术部、财务管理部、合同管理部以及项目二组、项目三组等都需要按照上级下达的指令工作，不符合“每个事业部拥有较大的自主权”，不符合“事业部组织结构”定义，排除。\n故正确答案为B。","no":93,"missingImage":false},{"qid":"19526243","cat":"定义判断","stem":"均变论认为，支配各种地质过程的法则在地质历史上没有发生过变化，现在起作用的各种自然营力在漫长的地质过程中具有普遍的均一性，即地质演变是一个渐变的过程，具有相同方式和相同的强度；地球上生物的种与种之间有过渡关系，生物进化过程是极其漫长的。灾变论认为，在整个地质发展的过程中，地球经常发生各种突如其来的、短暂的全球性灾难性变化，这些变化强烈地改变了地球的面貌；地球上生物的变化是反复多次灾变的结果。\n根据上述定义，下列说法最能体现灾变论观点的是：","options":{"A":"“我们找不到开始的痕迹，也看不到结束的迹象”","B":"“地质记录是一部被鲜血和火焰写成的史诗”","C":"“现在是通往过去的一把钥匙”","D":"“自然界里没有飞跃”"},"answer":"B","explanation":"第一步：找出定义关键词。\n均变论：“支配各种地质过程的法则在地质历史上没有发生过变化”、“现在起作用的各种自然营力在漫长的地质过程中具有普遍的均一性”、“地球上生物的种与种之间有过渡关系，生物进化过程是极其漫长的”。\n灾变论：“地球经常发生各种突如其来的、短暂的全球性灾难性变化，这些变化强烈地改变了地球的面貌”、“地球上生物的变化是反复多次灾变的结果”。\n第二步：逐一分析选项。\nA项：“我们找不到开始的痕迹，也看不到结束的迹象”，体现了“支配各种地质过程的法则在地质历史上没有发生过变化”、“地球上生物的种与种之间有过渡关系，生物进化过程是极其漫长的”，符合“均变论”定义，不符合“灾变论”定义，排除；\nB项：“地质记录是一部被鲜血和火焰写成的史诗”，“鲜血和火焰”隐喻的是灾难，体现了“地球经常发生各种突如其来的、短暂的全球性灾难性变化，这些变化强烈地改变了地球的面貌”，符合“灾变论”定义，当选；\nC项：“现在是通往过去的一把钥匙”，体现了“支配各种地质过程的法则在地质历史上没有发生过变化”、“现在起作用的各种自然营力在漫长的地质过程中具有普遍的均一性”、“地球上生物的种与种之间有过渡关系，生物进化过程是极其漫长的”，符合“均变论”定义，不符合“灾变论”定义，排除；\nD项：“自然界里没有飞跃”，体现了“地球上生物的种与种之间有过渡关系，生物进化过程是极其漫长的”，符合“均变论”定义，不符合“灾变论”定义，排除。\n故正确答案为B。","no":94,"missingImage":false},{"qid":"19526275","cat":"定义判断","stem":"商品动销率是指在售的商品品种数与库存商品总品种数的比率。商品库销比是指商品库存量与销售额的比率。商品滞销率是指滞销的商品品种数占库存商品总品种数的比率。商品损耗率是指在一定的保管条件下，某商品在储存保管期间，其自然损耗量与商品在库总量的比例。\n根据上述定义，下列说法正确的是：","options":{"A":"若商品动销率超过100%，说明商品在售品种数高于库存商品总品种数","B":"商品损耗率高表明有库存积压风险，商品损耗率低表明销售态势良好","C":"库存商品数一定时，商品滞销率越高，说明滞销的商品越多","D":"当商品库存量越大，销售额越高时，商品库销比就会越大"},"answer":"A","explanation":"第一步：找出定义关键词。\n商品动销率：“在售的商品品种数与库存商品总品种数的比率”；\n商品库销比：“商品库存量与销售额的比率”；\n商品滞销率：“滞销的商品品种数占库存商品总品种数的比率”；\n商品损耗率：“一定的保管条件下，某商品在储存保管期间”、“自然损耗量与商品在库总量的比例”。\n第二步：逐一分析选项。\nA项：根据商品动销率\u003cimg data-k=\"c194e0fae849\">，若商品动销率超过100%，说明商品在售品种数高于库存商品总品种数，说法正确，当选；\nB项：根据商品损耗率\u003cimg data-k=\"84250b4ecd50\">，若商品损耗率高，表明商品自然损耗量相对升高或者商品在库总量相对降低，无法必然得到库存积压情况或销售态势情况，说法错误，排除；\nC项：根据商品滞销率\u003cimg data-k=\"b485201802ac\">，若库存商品数一定时，商品滞销率越高，说明滞销的“商品品种数”越多，而不是滞销的“商品”越多（可能仅指商品数量），说法错误，排除；\nD项：根据商品库销比\u003cimg data-k=\"4168ea985603\">，当商品库存量越大，销售额越高时，因无法确定比值的大小关系，所以无法得知商品库销比一定会越大，说法错误，排除。\n故正确答案为A。","no":95,"missingImage":false},{"qid":"19526392","cat":"定义判断","stem":"根据动词对其后所接的宾语小句（作宾语的句子）真值的不同预设能力可以把现代汉语中的相关动词分为叙实动词、非叙实动词和反叙实动词。叙实动词的肯定式和否定式都预设其宾语小句为真；非叙实动词的肯定式和否定式都不预设其宾语小句为真，也不预设其宾语小句为假；反叙实动词的肯定式和否定式都预设其宾语小句为假。\n根据上述定义，下列画线的动词属于非叙实动词的是：","options":{"A":"我\u003cu>听说\u003c/u>他来过这里","B":"我\u003cu>庆幸\u003c/u>听了你的建议","C":"我\u003cu>知道\u003c/u>你帮助过我","D":"我\u003cu>幻想\u003c/u>成为一只小鸟"},"answer":"A","explanation":"第一步：找出定义关键词。\n叙实动词：“肯定式和否定式都预设其宾语小句为真”；\n非叙实动词：“肯定式和否定式都不预设其宾语小句为真，也不预设其宾语小句为假”；\n反叙实动词：“肯定式和否定式都预设其宾语小句为假”。\n第二步：逐一分析选项。\nA项：“我听说他来过这里”中的“听说”只是陈述信息的来源，没有预设“来过这里”为真或为假，符合“肯定式和否定式都不预设其宾语小句为真，也不预设其宾语小句为假”，符合“非叙实动词”定义，当选；\nB项：“我庆幸听了你的建议”中的“庆幸”意味着听了建议是已经发生的事实，是预设其为真，符合“肯定式和否定式都预设其宾语小句为真”，符合“叙实动词”定义，不符合“非叙实动词”定义，排除；\nC项：“我知道你帮助过我”中的“知道”意味着帮助过我是真实存在的事实，是预设其为真，符合“肯定式和否定式都预设其宾语小句为真”，符合“叙实动词”定义，不符合“非叙实动词”定义，排除；\nD项：“我幻想成为一只小鸟”中的“幻想”是不可能发生的事，是预设其为假，符合“肯定式和否定式都预设其宾语小句为假”，符合“反叙实动词”定义，不符合“非叙实动词”定义，排除。\n故正确答案为A。","no":96,"missingImage":false},{"qid":"19526359","cat":"定义判断","stem":"自主动机是指人们出于兴趣或内在满足感而从事某种活动，外部动机是指人们为获得外部奖励或避免惩罚而从事某种活动，这些动机背后的心理需求又分为三种：（1）自主性需求，即人们希望自己能控制和选择自己的行为，而不是受到外部强制；（2）胜任性需求，即人们希望能在自己做的事上获得成就感和自我效能感；（3）归属感需求，即人们希望与他人建立有意义的联系，感受到归属和支持。\n根据上述定义，下列说法错误的是：","options":{"A":"小张参加了一项感兴趣的社交活动，他认为这能帮助自己结交新朋友。这体现了自主动机和归属感需求","B":"小李参加公司的培训课程，虽然对课程内容不感兴趣，但他担心如果不参加就会被扣绩效。这体现了外部动机和自主性需求","C":"小王每天晨跑，很享受锻炼带来的满足感，也坚信这是促进健康的必要努力。这体现了自主动机和胜任性需求","D":"小陈和队友为实现团体奖牌零的突破一直在努力，在艰苦的训练中与队友相互鼓励。这体现了胜任性需求和归属感需求"},"answer":"B","explanation":"第一步：找出定义关键词。\n自主动机：“出于兴趣或内在满足感”、“从事某种活动”；\n外部动机：“为获得外部奖励或避免惩罚”、“从事某种活动”；\n自主性需求：“希望自己能控制和选择自己的行为，而不是受到外部强制”；\n胜任性需求：“希望能在自己做的事上获得成就感和自我效能感”；\n归属感需求：“希望与他人建立有意义的联系，感受到归属和支持”。\n第二步：逐一分析选项。\nA项：小张参加了一项感兴趣的社交活动，符合“出于兴趣或内在满足感”、“从事某种活动”，体现了自主动机；他认为这能帮助自己结交新朋友，符合“希望与他人建立有意义的联系，感受到归属和支持”，体现了归属感需求，说法正确，排除；\nB项：小李担心不参加被扣绩效，符合“为获得外部奖励或避免惩罚”、“从事某种活动”，体现了外部动机；但小李担心如果不参加就会被扣绩效，说明其受到外部约束，不符合“希望自己能控制和选择自己的行为，而不是受到外部强制”，没有体现自主性需求，说法错误，当选；\nC项：小王每天晨跑，很享受锻炼带来的满足感，符合“出于兴趣或内在满足感”、“从事某种活动”，体现了自主动机；他坚信这是促进健康的必要努力，符合“希望能在自己做的事上获得成就感和自我效能感”，体现了胜任性需求，说法正确，排除；\nD项：小陈和队友为实现团体奖牌零的突破而努力，追求的是成就感，符合“希望能在自己做的事上获得成就感和自我效能感”，体现了胜任性需求；他与队友相互鼓励，符合“希望与他人建立有意义的联系，感受到归属和支持”，体现了归属感需求，说法正确，排除。\n本题为选非题，故正确答案为B。","no":97,"missingImage":false},{"qid":"19526298","cat":"定义判断","stem":"动作预期是指运动员在比赛过程中，根据已有信息，对即将发生的动作结果进行预测的过程。在这一过程中，运动员主要依赖两类信息：运动学信息和情境先验信息。运动学信息包括对手的动作、器材的运动轨迹或队员之间的相对位置，情境先验信息则涉及比赛情境中事件发生的概率。\n根据上述定义，下列不涉及上述任何一种信息的是：","options":{"A":"篮球队员甲在双方比分紧咬的情况下，基于对手今日比赛罚篮命中率不高，在对手投篮时选择直接犯规","B":"网球运动员乙知道对手在比赛前有一系列习惯性动作，包括整理球衣、球裤、头发等，暗自提醒自己不要被其干扰","C":"羽毛球双打运动员丙发现对方准备接发球的球员位置稍微靠前，可能来不及转身或后退接球，便发了个后场球","D":"乒乓球运动员丁发现对方发过来的球位置较低、速度较慢，极有可能擦网变线，便没有后退，向前伸拍做好接球准备"},"answer":"B","explanation":"第一步：找出定义关键词。\n动作预期：“运动员”、“在比赛过程中”、“根据已有信息，对即将发生的动作结果进行预测”；\n运动学信息：“对手的动作”、“器材的运动轨迹”、“队员之间的相对位置”；\n情境先验信息：“比赛情境中事件发生的概率”。\n第二步：逐一分析选项。\nA项：篮球队员甲，符合“运动员”，根据对手今日比赛罚篮命中率不高，在对手投篮时选择直接犯规，即预测犯规后对手会罚篮不中，符合“在比赛过程中”、“根据已有信息，对即将发生的动作结果进行预测”、“比赛情境中事件发生的概率”，符合“情境先验信息”定义，排除；\nB项：网球运动员乙知道对手在比赛前有一系列习惯性动作，不符合“在比赛过程中”，且乙是暗自提醒自己不要被干扰，未利用这些信息进行预测，不符合“对即将发生的动作结果进行预测”，不符合“动作预期”定义，进而也不符合“运动学信息”定义和“情境先验信息”定义，当选；\nC项：羽毛球双打运动员丙，符合“运动员”，根据对方准备接发球的球员位置稍微靠前，预测对方来不及转身或后退接球，符合“在比赛过程中”、“根据已有信息，对即将发生的动作结果进行预测”、“比赛情境中事件发生的概率”，符合“情境先验信息”定义，排除；\nD项：乒乓球运动员丁，符合“运动员”，根据对方发过来的球位置较低、速度较慢，预测球会擦网变线，符合“在比赛过程中”、“根据已有信息，对即将发生的动作结果进行预测”、“器材的运动轨迹”、“比赛情境中事件发生的概率”，符合“运动学信息”定义，也符合“情境先验信息”定义，排除。\n本题为选非题，故正确答案为B。","no":98,"missingImage":false},{"qid":"19526389","cat":"定义判断","stem":"在制品控制是企业生产控制的基础工作，是企业对生产运作过程中各工序原材料、半成品等按照位置、数量、质量及车间之间的物料转运等进行的控制。\n根据上述定义，下列没有直接体现在制品控制的是：","options":{"A":"服装厂梳理了运动裤制作流程并制定规范，确保衣料在不同流水线上流转有序","B":"食品厂设立质检员，定时对各个工序的食材抽样进行微生物检测，剔除不良品","C":"制药厂规定员工进入洁净区后，每两小时洗手一次，避免药品生产环境被污染","D":"家具厂对板材进行定期盘点，并合理摆放，确保板材库存合理且满足生产需要"},"answer":"C","explanation":"第一步：找出定义关键词。\n“企业对生产运作过程中各工序原材料、半成品”、“按照位置、数量、质量及车间之间的物料转运等进行的控制”。\n第二步：逐一分析选项。\nA项：服装厂确保衣料在不同流水线上流转有序，其中衣料属于生产运作过程中的原材料，符合“企业对生产运作过程中各工序原材料、半成品”，在流水线上流转属于在车间内的物料转运，符合“按照位置、数量、质量及车间之间的物料转运等进行的控制”，符合定义，排除；\nB项：食品厂设立质检员，定时对各个工序的食材抽样进行衍生物检测，剔除不良品，其中对各个工序的食材抽样属于在生产运作过程中的原材料、半成品，符合“企业对生产运作过程中各工序原材料、半成品”，质检员抽样检测是对产品质量的把控，符合“按照位置、数量、质量及车间之间的物料转运等进行的控制”，符合定义，排除；\nC项：制药厂规定员工进入洁净区后需每两小时洗手一次，这是对员工进行要求，并非对原材料、半成品进行把控，不符合“企业对生产运作过程中各工序原材料、半成品”进行控制，不符合定义，当选；\nD项：家具厂对板材进行定期盘点，并合理摆放，体现了企业对在生产过程中的板材进行数量把控，符合“企业对生产运作过程中各工序原材料、半成品”、“按照位置、数量、质量及车间之间的物料转运等进行的控制”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":99,"missingImage":false},{"qid":"19526362","cat":"定义判断","stem":"预防性维修是指在机械设备没有发生故障或尚未造成损坏的前提下，通过对产品的系统性检查、设备测试或更换以防止设备发生故障，使其保持在正常状态所进行的全部活动。\n根据上述定义，下列属于预防性维修的是：","options":{"A":"公路管理部门定期巡视道路两旁护栏并涂刷、除锈，发现护栏松动、断裂时进行修复","B":"某车间在正式制造某种设备前，测量将要安装在该设备中的关键零部件是否符合相应标准","C":"某数控车床突然发生摇动，无法切削物品，检查后发现电机出现故障，更换电机后车床可正常运行","D":"雨季来临前，供电公司对辖区内变压器、配电盘、电缆线路等电力设备设施隐患进行专项排查"},"answer":"D","explanation":"第一步：找出定义关键词。\n“机械设备没有发生故障或尚未造成损坏”、“对产品的系统性检查、设备测试或更换以防止设备发生故障”。\n第二步：逐一分析选项。\nA项：道路两旁护栏不是机械设备，且发现护栏松动、断裂时进行修复，是护栏出现问题之后的维修，不符合“机械设备没有发生故障或尚未造成损坏”，不符合定义，排除；\nB项：正式制造某种设备前的测量，是生产环节的质量检查，不是对已有设备的维护，不符合“机械设备没有发生故障或尚未造成损坏”、“对产品的系统性检查、设备测试或更换以防止设备发生故障”，不符合定义，排除；\nC项：某数控车床突然发生摇动，检查后发现电机出现故障，更换电机后车床可正常运行，说明是电机出现问题之后的维修，不符合“机械设备没有发生故障或尚未造成损坏”，不符合定义，排除；\nD项：对辖区内变压器、配电盘、电缆线路等电力设备设施隐患进行专项排查，符合“机械设备没有发生故障或尚未造成损坏”、“对产品的系统性检查、设备测试或更换以防止设备发生故障”，符合定义，当选。\n故正确答案为D。","no":100,"missingImage":false},{"qid":"19526246","cat":"类比推理","stem":"与“经年：积岁”在逻辑关系上最相近的是：","options":{"A":"善本：版本","B":"秘方：偏方","C":"仲夏：夏季","D":"黎民：百姓"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“经年”指经过一年或若干年，“积岁”指累积多年，二者均可指经过多年，为近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“善本”指古代书籍中文字讹误较少、学术或艺术价值上比一般本子优异的刻本或写本，“版本”指同一部书因编辑、传抄、刻版、排版或装订形式等的不同而产生的不同的本子，“善本”是“版本”的一种类型，二者不是近义关系，与题干逻辑关系不一致，排除；\nB项：“秘方”指不公开的有显著医疗效果的药方，“偏方”指民间流传不见于古典医学著作的中药方，前者从是否公开角度划分，后者从是否正规角度划分，二者为交叉关系，与题干逻辑关系不一致，排除；\nC项：“仲夏”指夏季的第二个月，是“夏季”的一部分，二者为组成关系，与题干逻辑关系不一致，排除；\nD项：“黎民”指平民、民众，“百姓”指军人和官员以外的人，二者均可指普通民众，为近义关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":101,"missingImage":false},{"qid":"19526395","cat":"类比推理","stem":"与“细胞凋亡：基因调控：细胞增殖”在逻辑关系上最相近的是：","options":{"A":"成本降低：税率调整：成本增加","B":"经济萧条：经济周期：经济复苏","C":"价格尺度：货币职能：流通手段","D":"人工智能：智能时代：具身智能"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n基因调控是控制细胞凋亡和细胞增殖的机制，细胞凋亡和细胞增殖是两种相反的细胞过程，第一个词和第三个词为并列关系，均与第二个词构成影响因素的对应。\n第二步：判断选项词语间逻辑关系。\nA项：税率调整是影响成本降低和成本增加的机制，成本降低和成本增加是两种相反的结果，第一个词和第三个词为并列关系，均与第二个词构成影响因素的对应，与题干逻辑关系一致，当选；\nB项：经济萧条和经济复苏是经济周期中的不同阶段，是经济周期的组成部分，第一个词和第三个词为并列关系，均与第二个词构成组成关系，与题干逻辑关系不一致，排除；\nC项：价格尺度和流通手段均属于货币职能，第一个词和第三个词为并列关系，均与第二个词构成种属关系，与题干逻辑关系不一致，排除；\nD项：具身智能就是具身化的人工智能，具身智能属于人工智能，智能时代是所处的背景，第一个词和第三个词为种属关系，均与第二个词构成所处背景的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":102,"missingImage":false},{"qid":"19526272","cat":"类比推理","stem":"与“护士人数：护患比：患者人数”在逻辑关系上最相近的是：","options":{"A":"理赔总额：平均理赔金额：理赔次数","B":"签收率：实际签收数量：应签收数量","C":"流动资产：流动负债：流动比率","D":"旅客数：入住率：客房数"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n护患比=护士人数/患者人数，三者满足公式关系。\n第二步：判断选项词语间逻辑关系。\nA项：平均理赔金额=理赔总额/理赔次数，与题干逻辑关系一致，当选；\nB项：签收率=实际签收数量/应签收数量，但词语顺序与题干不一致，排除；\nC项：流动比率=流动资产/流动负债，但词语顺序与题干不一致，排除；\nD项：入住率=入住客房数/客房数，而入住客房数\u003cimg data-k=\"645831205161\">旅客数，每间客房入住的旅客数可能不同，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":103,"missingImage":false},{"qid":"19526255","cat":"类比推理","stem":"颅内疾病 对于 （    ） 相当于 （    ） 对于 岩石断裂\n依次填入括号中最恰当的是：","options":{"A":"颅内感染；岩石熔融","B":"机体疾病；地壳应力","C":"核磁共振；地下采样","D":"视野缺失；冰川运动"},"answer":"D","explanation":"逐一代入选项。\nA项：颅内感染是颅内疾病的一种，二者为种属关系；岩石熔融和岩石断裂是两种不同的地质现象，二者为并列关系，前后逻辑关系不一致，排除；\nB项：颅内疾病是机体疾病的一种，二者为种属关系；地壳应力是导致岩石断裂的原因，二者为因果关系，前后逻辑关系不一致，排除；\nC项：核磁共振是用来诊断颅内疾病的方法，二者为诊断方法与疾病的对应关系；地下采样可以判断岩石是否有断裂，但顺序反了，前后逻辑关系不一致，排除；\nD项：颅内疾病会导致视野缺失，二者为因果对应关系；冰川运动会导致岩石断裂，二者为因果对应关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":104,"missingImage":false},{"qid":"19526268","cat":"逻辑判断","stem":"如果用一个圆来表示词语所指称的对象的集合，那么以下哪项中画横线词语之间的关系符合下图？\n\u003cimg data-k=\"8eadecc3b7bf\" style=\"max-width:274px\">","options":{"A":"船舶按用途分为\u003cu>军用船舶\u003c/u>（①）和民用船舶两大类，潜艇、\u003cu>航空母舰\u003c/u>（③）、驱逐舰等都属于军用船舶；按推进动力分为机动船和\u003cu>非机动船\u003c/u>（②）","B":"\u003cu>水杉\u003c/u>（③）是我国的特有树种，属于\u003cu>落叶树\u003c/u>（①），是一种高大的\u003cu>乔木\u003c/u>（②），是世界上珍稀的“活化石”植物","C":"图书按照读者群可分为\u003cu>少儿读物\u003c/u>（③）和成人读物等；按照载体可分为纸质书和\u003cu>电子书\u003c/u>（②）等；按照学科可分为历史书、文学书和\u003cu>哲学书\u003c/u>（①）等","D":"大熊猫属于\u003cu>哺乳动物\u003c/u>（①），是\u003cu>中国特有动物\u003c/u>（②），被列为\u003cu>中国国家一级保护野生动物\u003c/u>（③）"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n根据题干图形可知，①和②是交叉关系；③属于①，③和①是种属关系；③属于②，③和②是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：航空母舰（③）是指军队专用的机动船只，与非机动船（②）不是种属关系，与题干逻辑关系不一致，排除；\nB项：落叶树（①）和乔木（②）是交叉关系；水杉（③）属于落叶树（①），③和①是种属关系；水杉（③）属于乔木（②），③和②是种属关系，与题干逻辑关系一致，当选；\nC项：少儿读物（③）和电子书（②）是交叉关系，不是种属关系，与题干逻辑关系不一致，排除；\nD项：中国国家一级保护野生动物（③）和哺乳动物（①）是交叉关系，不是种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":105,"missingImage":false},{"qid":"19526386","cat":"逻辑判断","stem":"科技行业越来越多地使用合成数据来满足AI模型数据训练的需要。合成数据是通过算法和统计模型人为创建的数据，在理论上可以无限供应。但合成数据存在一个关键问题：当AI模型过于依赖合成数据时，它们会产生更多“幻觉”，编造看似合理可信但实际上并不存在的信息。可见，合成数据的使用会影响AI的准确性。\n以下哪项如果为真，最能支持上述结论？","options":{"A":"即使经过处理，合成数据仍然可能泄露敏感信息，从而引发隐私风险","B":"合成数据存在过于简单化的风险，无法完全模拟真实世界的复杂性","C":"合成数据会放大源数据本身的错误或偏差，导致“失之毫厘，差之千里”","D":"合成数据的多样性可能不如真实数据，限制了AI模型的泛化能力"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：合成数据的使用会影响AI的准确性。\n论据：当AI模型过于依赖合成数据时，它们会产生更多“幻觉”，编造看似合理可信但实际上并不存在的信息。\n本题论点和论据都在讨论“合成数据”与“AI准确性”之间的关系，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出合成数据可能泄露敏感信息，引发“隐私风险”，而论点讨论的是合成数据对“AI准确性”的影响，二者话题不一致，无法加强，排除；\nB项：该项指出合成数据存在过于简单化的风险，无法完全模拟真实世界的复杂性，并不明确“无法模拟复杂性”是否会影响“AI的准确性”，为不明确项，无法加强，排除；\nC项：该项指出合成数据会放大源数据的错误或偏差，导致“失之毫厘，差之千里”，说明合成数据会放大错误，最终导致AI输出不准确，解释了为何“合成数据”会影响“AI准确性”，补充论据，可以加强，当选；\nD项：该项指出合成数据“多样性不足，限制泛化能力”，并不明确“数据多样性不足”、“限制AI模型的泛化能力”是否会影响“AI的准确性”，为不明确项，无法加强，排除。\n故正确答案为C。","no":106,"missingImage":false},{"qid":"19526390","cat":"逻辑判断","stem":"部分研究认为，白垩纪陆地生态系统的变革是由植物、昆虫、脊椎动物与地质过程等多个要素相互作用推动的，形成了一个高度协同演化的系统结构。鉴于这一机制在当时造就了复杂而稳定的生态格局，有学者提出，现代陆地生态系统的高度复杂性，正是这种古老协同机制延续和演化的结果。\n以下哪项如果为真，最能削弱上述学者的观点？","options":{"A":"在地质记录中，白垩纪末期的生态危机主要影响海洋系统，而陆地系统显示出相对稳定的演替趋势","B":"对白垩纪地层的系统分析表明，植物、昆虫、脊椎动物与地质过程的演化几乎是在同一时期进行的","C":"现代陆地生态系统的复杂性主要受群落内部随机扰动、自组织演化和外源干扰的共同影响，与白垩纪显著不同","D":"被子植物的全球扩张早于部分动物类群多样化，其当时对生态结构的主导作用可能被高估"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：现代陆地生态系统的高度复杂性，正是这种古老协同机制延续和演化的结果。\n论据：白垩纪陆地生态系统的变革是由植物、昆虫、脊椎动物与地质过程等多个要素相互作用推动的，形成了一个高度协同演化的系统结构。鉴于这一机制在当时造就了复杂而稳定的生态格局。\n从论据“白垩纪”高度协同演化的系统结构造就了复杂而稳定的生态格局，推出“现代”也是同样的情况，在这种“时期不同”的文段结构下，可以考拆桥，即“白垩纪的情况\u003cimg data-k=\"645831205161\">现代”。\n第二步：逐一分析选项。\nA项：指出白垩纪末期的生态危机对海洋系统和陆地系统的不同影响，与论点讨论的“白垩纪时期陆地生态系统高度协同演化的机制影响了现代陆地生态系统”无关，无法削弱，排除；\nB项：指出白垩纪时期植物、昆虫、脊椎动物与地质过程的演化几乎是在同一时期进行的，说明白垩纪时期陆地生态系统高度协同演化，与论点讨论的“白垩纪时期陆地生态系统高度协同演化的机制影响了现代陆地生态系统”无关，无法削弱，排除；\nC项：指出现代陆地生态系统的复杂性与白垩纪显著不同，说明不能根据白垩纪的情况推出现代，拆桥项，可以削弱，当选；\nD项：指出被子植物的全球扩张对生态结构的主导作用可能被高估，与论点讨论的“白垩纪时期陆地生态系统高度协同演化的机制影响了现代陆地生态系统”无关，无法削弱，排除。\n故正确答案为C。","no":107,"missingImage":false},{"qid":"19526297","cat":"逻辑判断","stem":"完善城乡融合发展体制机制是破除我国城乡二元结构、拓展高质量发展空间的必要举措。只有完善农业农村优先发展的投入保障机制，并且优化城乡公共资源配置机制，才能完善城乡融合发展体制机制。只有加大中央预算内投资和地方政府专项债券支持力度，并且提高土地出让收入用于农业农村的比例，才能完善农业农村优先发展的投入保障机制。只有推进户籍制度改革，才能优化城乡公共资源配置机制。\n由此可以推出的是（    ）。","options":{"A":"如果推进户籍制度改革，就能优化城乡公共资源配置机制","B":"只要完善农业农村优先发展的投入保障机制，就能完善城乡融合发展体制机制","C":"除非完善农业农村优先发展的投入保障机制，否则不能提高土地出让收入用于农业农村的比例","D":"加大中央预算内投资和地方政府专项债券支持力度是破除我国城乡二元结构、拓展高质量发展空间的必要前提"},"answer":"D","explanation":"第一步：翻译题干。\n①破除我国城乡二元结构、拓展高质量发展空间\u003cimg data-k=\"a37757d411ef\">完善城乡融合发展体制机制；\n②完善城乡融合发展体制机制\u003cimg data-k=\"a37757d411ef\">完善农业农村优先发展的投入保障机制 且 优化城乡公共资源配置机制；\n③完善农业农村优先发展的投入保障机制\u003cimg data-k=\"a37757d411ef\">加大中央预算内投资和地方政府专项债券支持力度 且 提高土地出让收入用于农业农村的比例；\n④优化城乡公共资源配置机制\u003cimg data-k=\"a37757d411ef\">推进户籍制度改革。\n①②③可串联得到：⑤破除我国城乡二元结构、拓展高质量发展空间\u003cimg data-k=\"a37757d411ef\">完善城乡融合发展体制机制\u003cimg data-k=\"a37757d411ef\">完善农业农村优先发展的投入保障机制\u003cimg data-k=\"a37757d411ef\">加大中央预算内投资和地方政府专项债券支持力度 且 提高土地出让收入用于农业农村的比例；\n①②④可串联得到：⑥破除我国城乡二元结构、拓展高质量发展空间\u003cimg data-k=\"a37757d411ef\">完善城乡融合发展体制机制\u003cimg data-k=\"a37757d411ef\">优化城乡公共资源配置机制\u003cimg data-k=\"a37757d411ef\">推进户籍制度改革。\n第二步：逐一分析选项。\nA项：该项翻译为“推进户籍制度改革\u003cimg data-k=\"a37757d411ef\">优化城乡公共资源配置机制”，是对④的肯后，肯后得不到确定性的结论，无法推出，排除；\nB项：该项翻译为“完善农业农村优先发展的投入保障机制\u003cimg data-k=\"a37757d411ef\">完善城乡融合发展体制机制”，是肯定②箭头后“且关系”中的一部分，肯后得不到确定性的结论，不能推出，排除；\nC项：该项翻译为“提高土地出让收入用于农业农村的比例\u003cimg data-k=\"a37757d411ef\">完善农业农村优先发展的投入保障机制”，是肯定③箭头后“且关系”中的一部分，肯后得不到确定性的结论，不能推出，排除；\nD项：该项翻译为“破除我国城乡二元结构、拓展高质量发展空间\u003cimg data-k=\"a37757d411ef\">加大中央预算内投资和地方政府专项债券支持力度”，是对⑤的肯前，肯前必肯后，可以推出，当选。\n故正确答案为D。","no":108,"missingImage":false},{"qid":"19526265","cat":"逻辑判断","stem":"平台企业依赖金融资本投资，需要迎合金融市场的估值逻辑，通过轻资产运营、扩大市场规模和用户数据挖掘与开发等，来提升自身在金融市场上的估值。随着平台企业金融化程度的日益加深，平台劳动者的具体劳动和生产过程也在发生变化。研究者认为，平台企业金融化程度的加深使得平台劳动者的劳动权益保护问题日益突出。\n以下哪项如果为真，最能支持上述研究者的观点？","options":{"A":"为扩大市场规模、争夺消费者注意力，平台企业在资金投入和服务提升方面容易陷入无序竞争","B":"为塑造轻资产企业形象、摆脱劳动密集型标签，平台企业采用弹性用工制，增加劳动者就业不稳定性","C":"越来越多的平台企业日益注重用户数据挖掘，以增加企业竞争力，为此更加注重员工培训","D":"部分平台企业以缴纳保证金、押金或其他名义向劳动者收取财物，限制劳动者在多平台就业"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：平台企业金融化程度的加深使得平台劳动者的劳动权益保护问题日益突出。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：选项指出为扩大市场规模、争夺消费者注意力，平台企业容易陷入无序竞争，与论点讨论的平台企业金融化程度加深是否会导致平台劳动者的劳动权益保护问题日益突出无关，无关项，无法加强，排除；\nB项：选项指出为塑造轻资产企业形象、摆脱劳动密集型标签，说明平台企业金融化程度在加深，平台企业采用弹性用工制，增加劳动者就业不稳定性，说明平台劳动者的具体劳动和生产过程发生了变化，且增加了平台劳动者的劳动权益保护问题，补充论据，可以加强，当选；\nC项：选项指出平台企业越来越注重员工培训，与论点讨论的平台企业金融化程度加深是否会导致平台劳动者的劳动权益保护问题无关，无关项，无法加强，排除；\nD项：选项指出部分平台企业以缴纳保证金、押金或其他名义向劳动者收取财物，限制劳动者在多平台就业，但是不明确这些平台是否存在企业金融化程度的加深，不明确选项，无法加强，排除。\n故正确答案为B。","no":109,"missingImage":false},{"qid":"19526315","cat":"逻辑判断","stem":"考古人员在某地发掘出一些似鸟动物化石，同位素测年显示这些动物生存于中侏罗世晚期（距今1.72亿～1.64亿年）。经考古推算，这些似鸟动物体型与现代鸟类大致接近，尾巴很短，最重要的是它们都具有愈合的尾综骨。考古人员据此认为，这些动物一定属于鸟类。\n以下哪项最有可能是考古人员论证的前提？","options":{"A":"这些似鸟动物长有与现代鸟类相似的脚骨，可以在陆地上行走","B":"这些化石保存了诸如肩胛骨、乌喙骨、尾综骨等骨骼，形态清晰","C":"鸟类与爬行动物最显著的区别就是鸟类最后几枚尾椎愈合成为尾综骨","D":"尾综骨结构的出现对似鸟动物后肢和尾骨的独立运动及飞行能力的完善至关重要"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：这些动物一定属于鸟类。\n论据：这些似鸟动物体型与现代鸟类大致接近，尾巴很短，最重要的是它们都具有愈合的尾综骨。\n本题论点讨论的是这些似鸟动物属于鸟类，论据讨论的是这些似鸟动物有愈合的尾综骨，二者话题不一致，加强优先考虑搭桥，即在“鸟类”和“愈合的尾综骨”之间建立联系。\n第二步：逐一分析选项。\nA项：该项指出这些似鸟动物与现代鸟类具有相似的脚骨，但是不明确脚骨是否能够判断这些似鸟动物为鸟类，属于不明确选项，无法加强，排除；\nB项：该项强调这些化石保存的尾综骨等形态清晰，说明这些动物确实具有尾综骨，可以加强论据，但不是论证成立的前提，排除；\nC项：该项指出鸟类与爬行动物的显著区别是鸟类最后几枚尾椎愈合成为尾综骨，建立了“鸟类”和“愈合的尾综骨”之间的联系，为搭桥项，是论证成立的前提，当选； \nD项：该项强调尾综骨结构对似鸟动物独立运动以及飞行能力的重要性，但不能判断其是否属于鸟类，属于不明确选项，无法加强，排除。\n故正确答案为C。","no":110,"missingImage":false}]}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"85aa57f35864\" style=\"max-width:590px\">\u003c/p>","questions":[{"qid":"19526212","cat":"增长","stem":"2024年上半年，中国医药保健品进出口贸易顺差（出口额-进口额）比上年同期：","options":{"A":"下降了20%以上","B":"下降了不到20%","C":"上升了20%以上","D":"上升了不到20%"},"answer":"C","explanation":"根据题干“2024年上半年······顺差（出口额-进口额）比上年同期”，结合选项为百分数，且出口额=进口额+顺差，可判定本题为混合增长率问题。定位统计表可得：2024年上半年，中国医药保健品进、出口额分别为451.76亿美元、525.79亿美元，同比增长率分别为-5.76%、1.96%。根据混合增长率口诀“混合后居中但不正中”可得，进口额增长率（-5.76%）＜出口额增长率（1.96%）＜顺差增长率，排除A、B两项。\n2024年上半年中国医药保健品进出口贸易顺差\u003cimg data-k=\"0105edf1db5f\">亿美元，根据线段法：距离与量成反比（一般用现期量代替基期量计算），可得：\u003cimg data-k=\"044909da373e\">\u003cimg data-k=\"ad8e762f7c38\">，解得：\u003cimg data-k=\"4269c67c6041\">，在C项范围内。\n故正确答案为C。","no":111,"missingImage":false},{"qid":"19526213","cat":"比重","stem":"2024年上半年，中药提取物出口额占医药保健品出口总额的比重比上年同期：","options":{"A":"上升了3个百分点以上","B":"下降了3个百分点以上","C":"上升了不到3个百分点","D":"下降了不到3个百分点"},"answer":"D","explanation":"根据题干“2024年上半年······占······的比重比上年同期”，结合选项为上升了/下降了+百分点，可判定本题为两期比重问题。定位统计表可得：2024年上半年中国医药保健品出口总额为525.79亿美元（B），同比增长1.96%（b）；中药提取物出口额为14.92亿美元（A），同比增长-14.28%（a）。根据公式：两期比重差\u003cimg data-k=\"12ad841084d3\">，则题干所求为\u003cimg data-k=\"902c31733768\">\u003cimg data-k=\"4bad7599d42c\">\u003cimg data-k=\"f80d25f51cc5\">，即约下降了0.53个百分点。在D项范围内。\n故正确答案为D。","no":112,"missingImage":false},{"qid":"19526214","cat":"增长","stem":"表中所列医药保健品12个小类中，2024年上半年进出口总额同比上升的有几类？","options":{"A":"7","B":"6","C":"5","D":"4"},"answer":"A","explanation":"根据题干“······2024年上半年······同比上升的有几类”，结合材料给出2024年上半年各小类医药保健品进口额、出口额及分别的同比增速，可判定本题为混合增长率问题。定位统计表可得2024年上半年，医药保健品12个小类进口额、出口额及分别的同比增速。根据混合增长率口诀“混合居中不正中，偏向基期较大的（一般用现期代替）”，观察可知中成药、保健品、西药原料、生化药、保健康复用品、口腔设备与材料这6类的进、出口额同比增速均大于0，则进出口总额同比增速也大于0，则同比上升，均满足；中药材及饮片、医用敷料进、出口额同比增速均小于0，则进出口总额同比增速也小于0，则同比下降，均不满足；其余类别进、出口额同比增速一正一负，其中提取物：现期量出口额14.92亿美元&gt;进口额3.58亿美元，则\u003cimg data-k=\"29304d5dd2e2\">，即r&lt;0，则同比下降，不满足；西成药：现期量进口额110.28亿美元&gt;出口额35.24亿美元，则\u00 得：2024年，我国对最不发达国家进口5565.5亿元，增长12.8%；定位文字材料第四段可得：2024年12月，我国自最不发达国家进口512.7亿元，增长18.1%。根据公式：基期量\u003cimg data-k=\"51e165712c75\">，可得2023年1-11月我国对最不发达国家进口值为\u003cimg data-k=\"74b281c10913\">\u003cimg data-k=\"42a136f22455\">\u003cimg data-k=\"5fa762b4d0f7\">亿元，则2023年1~11月我国对最不发达国家月均进口值为\u003cimg data-k=\"e793f871acb3\">亿元，与B项最接近。\n故正确答案为B。","no":129,"missingImage":false},{"qid":"19526374","cat":"综合","stem":"关于2024年我国进出口情况，能根据上述资料推出的是：","options":{"A":"铜材进口总值不到3000亿元","B":"我国对最不发达国家火车出口值同比增量高于对其工程机械出口值同比增量","C":"劳动密集型产品出口值占我国最不发达国家出口总值的比重高于上年水平","D":"12月自刚果民主共和国、几内亚、老挝、赞比亚的进口总值超过当月我国自最不发达国家进口总值的一半"},"answer":"D","explanation":"A项：定位文字材料第三段可得：2024年，我国自最不发达国家进口铜材1469.6亿元。但材料未给出我国进口铜材的具体值，无法计算，错误；\nB项：定位文字材料第二段可得：2024年，我国对最不发达国家出口工程机械、火车分别为165.3亿元、91.6亿元，分别增长28.9%、39.5%。根据公式：增长量\u003cimg data-k=\"32c4dfbf6ea2\">，可得2024年我国对最不发达国家出口工程机械同比增量\u003cimg data-k=\"1178c93d69cc\">亿元，对最不发达国家出口火车同比增量\u003cimg data-k=\"55fcb2010c86\">亿元，则2024年我国对最不发达国家火车出口值同比增量（26亿元）低于对其工程机械出口值同比增量（37亿元），错误；\nC项：定位文字材料第一段可得：2024年，我国对最不发达国家出口总值为8664.6亿元，同比增长4.3%（b）；定位文字材料第二段可得：2024年，我国对最不发达国家出口劳动密集型产品2481亿元，增长3.7%（a）。根据两期比重结论：a&gt;b，比重上升。由于a（3.7%）&lt;b（4.3%），故比重低于上年水平，错误；\nD项：定位文字材料最后一段可得：2024年12月，我国自最不发达国家进口512.7亿元，其中自刚果民主共和国、几内亚、老挝、赞比亚分别进口156.3亿元，54.7亿元，35.6亿元，33.9亿元。根据公式：比重\u003cimg data-k=\"155c064d29d7\">，可得所求\u003cimg data-k=\"5c68e8e13a60\">，即占比超过一半，正确。\n故正确答案为D。","no":130,"missingImage":false}]}],"count":20,"answerable":20,"pointsOf":16}],"total":130,"affected":[],"subtitle":"2026年 · 国考 · 6/6 模块"},{"slug":"2026-国考-行政执法卷","title":"2026年国家公务员录用考试《行测》题（行政执法卷网友回忆版）","year":"2026","group":"国考","modules":[{"label":"政治理论","items":[{"type":"question","qid":"19526238","cat":"新思想","stem":"习近平总书记强调，必须坚持自信自立。中国人民和中华民族从近代以后的深重苦难走向伟大复兴的光明前景，从来就没有教科书，更没有现成答案。关于坚持自信自立，下列表述正确的有几项？\n①走自己的路，是党的全部理论和实践立足点，更是党百年奋斗得出的历史结论\n②推进中国式现代化，必须坚持把国家和民族发展放在自己力量的基点上\n③中国式现代化既要物质财富极大丰富，也要精神财富极大丰富、在思想文化上自信自强\n④独立自主是中华民族的优良传统，是中国共产党、中华人民共和国立党立国的重要原则","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查理论与政策。\n①正确，2021年7月1日，习近平总书记在庆祝中国共产党成立100周年大会上的重要讲话中指出：“以史为鉴、开创未来，必须坚持和发展中国特色社会主义。走自己的路，是党的全部理论和实践立足点，更是党百年奋斗得出的历史结论······”\n②正确，2023年2月7日，习近平总书记在新进中央委员会的委员、候补委员和省部级主要领导干部学习贯彻习近平新时代中国特色社会主义思想和党的二十大精神研讨班开班式上的讲话中指出：“推进中国式现代化，必须坚持独立自主、自立自强，坚持把国家和民族发展放在自己力量的基点上，坚持把我国发展进步的命运牢牢掌握在自己手中。”\n③正确，2023年2月7日，习近平总书记在新进中央委员会的委员、候补委员和省部级主要领导干部学习贯彻习近平新时代中国特色社会主义思想和党的二十大精神研讨班上的讲话中指出：“中国式现代化既要物质财富极大丰富，也要精神财富极大丰富、在思想文化上自信自强。”\n④正确，2013年12月26日，习近平总书记在纪念毛泽东同志诞辰120周年座谈会上的讲话中指出：“独立自主是中华民族的优良传统，是中国共产党、中华人民共和国立党立国的重要原则。在中国这样一个人口众多和经济文化落后的东方大国进行革命和建设的国情与使命，决定了我们只能走自己的路。”\n故正确的有①②③④，共4项。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"19526244","cat":"新思想","stem":"习近平总书记强调，科学制定和接续实施五年规划，是我们党治国理政一条重要经验，也是中国特色社会主义一个重要政治优势。关于五年规划编制工作，下列说法正确的是：","options":{"A":"我国五年规划（计划）编制工作起始于1949年，有力推动了经济社会发展、综合国力提升、人民生活改善","B":"中长期发展规划有助于充分发挥政府在资源配置中的决定性作用，彰显了政府对经济社会发展的宏观调控能力","C":"从第一个五年计划到当前的五年规划，一以贯之的主题是把我国建设成为社会主义现代化国家","D":"通过互联网就“十五五”规划编制向全社会征求意见和建议，在我国五年规划编制史上是第一次"},"answer":"C","explanation":"本题考查理论与政策。\n2025年6月16日出版的第12期《求是》杂志发表了习近平总书记的重要文章《用中长期规划指导经济社会发展是我们党治国理政的一种重要方式》。这是习近平总书记2015年10月至2025年4月期间有关重要论述的节录。\nA、B两项错误，2020年8月24日，习近平总书记在经济社会领域专家座谈会上的讲话中指出：“用中长期规划指导经济社会发展，是我们党治国理政的一种重要方式。从1953年开始，我国已经编制实施了13个五年规划（计划），其中改革开放以来编制实施8个，有力推动了经济社会发展、综合国力提升、人民生活改善，创造了世所罕见的经济快速发展奇迹和社会长期稳定奇迹。实践证明，中长期发展规划既能充分发挥市场在资源配置中的决定性作用，又能更好发挥政府作用。”故A项“五年规划（计划）编制工作起始于1949年”表述有误，应为“1953年”；B项“政府在资源配置中的决定性作用”表述有误，应为“市场在资源配置中的决定性作用”。\nC项正确，2020年10月29日，习近平总书记在党的十九届五中全会第二次全体会议上的讲话中指出：“从第一个五年计划到第十四个五年规划，一以贯之的主题是把我国建设成为社会主义现代化国家。”\nD项错误，2020年9月25日，习近平总书记在对“十四五”规划编制工作网上意见征求活动的指示中指出：“通过互联网就‘十四五’规划编制向全社会征求意见和建议，在我国五年规划编制史上是第一次。这次活动效果很好，社会参与度很高，提出了许多建设性的意见和建议。”故第一次通过互联网向全社会征求意见和建议的并非“十五五”规划编制，而是“十四五”规划。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"19526249","cat":"新思想","stem":"建设文化强国，事关中国式现代化建设全局，事关中华民族复兴大业，事关提升国际竞争力，锚定2035年建成社会主义文化强国的战略目标，必须始终坚持文化建设着眼于人、落脚于人。下列有关说法正确的是：\n①文化强国之“强”最终要体现在为人民提供文化服务和文化产品的能力上\n②坚持以人民为中心，着眼满足人民群众多样化、多层次、多方面的精神文化需求\n③文化创造核心在人，要建设一支规模宏大、结构合理、锐意创新的高水平文化人才队伍\n④尊重人才成长规律，完善符合文化领域特点的人才选拔、培养、使用、激励机制，营造识才、重才、爱才的良好政策环境","options":{"A":"①②③","B":"②③④","C":"①②④","D":"①③④"},"answer":"B","explanation":"本题考查理论与政策。\n2025年4月16日，《求是》杂志发表习近平总书记重要文章《加快建设文化强国》（以下简称“文章”）。\n①错误，②正确，文章指出：“第三，始终坚持文化建设着眼于人、落脚于人。文化强国之‘强’最终要体现在人民的思想境界、精神状态、文化修养上。要坚持以人民为中心，着眼满足人民群众多样化、多层次、多方面的精神文化需求，提升文化服务和文化产品供给能力，增强人民群众文化获得感、幸福感。要重视发挥文化养心志、育情操的作用，涵养全民族昂扬奋发的精神气质。”故①“为人民提供文化服务和文化产品的能力”表述错误，应为“人民的思想境界、精神状态、文化修养”。\n③④正确，文章指出：“文化创造核心在人。要把育人才、建队伍作为重要而紧迫的战略任务，统筹各类人才培养，建设一支规模宏大、结构合理、锐意创新的高水平文化人才队伍。要尊重人才成长规律，建立健全科学权威、公开透明的文艺和学术评价体系，完善符合文化领域特点的人才选拔、培养、使用、激励机制，营造识才、重才、爱才的良好政策环境。”\n故②③④正确。\n故正确答案为B。","no":3,"missingImage":false},{"type":"question","qid":"19526254","cat":"时事政治","stem":"中共中央、国务院印发《加快建设农业强国规划（2024-2035年）》，提出面对新形势新要求，必须把加快建设农业强国作为统领“三农”工作的战略总纲，摆上建设社会主义现代化强国的重要位置，下列与加快建设农业强国有关的说法正确的是：","options":{"A":"推进生态综合补偿，健全横向生态保护补偿机制，统筹推进生态环境损害赔偿","B":"建立健全长江流域信息共享系统，推进长江流域农业深度节水控水","C":"完善粮食产销奖补制度，中央预算内投资向粮食主销区倾斜","D":"推进农业科技推广体系，从经营性向公益性转变"},"answer":"A","explanation":"本题考查理论与政策。\n2025年4月，中共中央、国务院印发了《加快建设农业强国规划（2024－2035年）》（以下简称《规划》）。\nA项正确，B项错误，《规划》在“五、全链条推进农业产业体系升级，提升农业综合效益”中指出：“（十八）加快推进农业全面绿色转型······推进农业面源污染综合防治，发展生态循环农业。健全山水林田湖草沙一体化保护和系统治理机制。实施好长江十年禁渔和海洋伏季休渔，推进黄河流域农业深度节水控水。建立农业生态环境保护监测制度。推进生态综合补偿，健全横向生态保护补偿机制，统筹推进生态环境损害赔偿。”故B项“建立健全长江流域信息共享系统”无中生有，“长江流域”表述错误，应为“黄河流域”。\nC项错误，《规划》在“二、全方位夯实粮食安全根基，把中国人的饭碗端得更牢更稳”中指出：“（三）健全粮食生产扶持政策······健全粮食主产区利益补偿机制，完善产粮大县奖补制度，中央预算内投资向粮食主产区倾斜，省级统筹的土地出让收入可按规定用于粮食主产区的高标准农田建设、现代种业提升等，统筹建立粮食产销区省际横向利益补偿机制。”故“完善粮食产销奖补制度，中央预算内投资向粮食主销区倾斜”表述错误，应为“完善产粮大县奖补制度，中央预算内投资向粮食主产区倾斜”。\nD项错误，《规划》在“三、全领域推进农业科技装备创新，加快实现高水平农业科技自立自强”中指出：“（六）加快农业科技创新水平整体跃升······加强农业知识产权保护和侵权打击。健全公益性和经营性相结合的农业科技推广体系，加强基层农技推广队伍建设。”故“推进农业科技推广体系，从经营性向公益性转变”表述错误，应为“健全公益性和经营性相结合的农业科技推广体系”。\n故正确答案为A。","no":4,"missingImage":false},{"type":"question","qid":"19526306","cat":"新思想","stem":"全面推进依法治国是一个系统工程，必须坚持法治国家、法治政府、法治社会一体建设。下列相关表述不准确的是：","options":{"A":"法治社会是构筑法治国家、法治政府的基础","B":"建设法治政府对建设法治社会具有重要引领和带动作用","C":"法治政府、法治社会建设必须服从、服务于法治国家建设","D":"法治国家是依法治国的主体，是法治社会建设的先导和示范"},"answer":"D","explanation":"本题考查理论与政策。\n2020年4月21日，人民日报发表《坚持法治国家、法治政府、法治社会一体建设》（以下简称文章）。\nA项正确，2020年11月16日，习总书记在中央全面依法治国工作会议上讲话中指出：“法治国家、法治政府、法治社会相辅相成，法治国家是法治建设的目标，法治政府是建设法治国家的重点，法治社会是构筑法治国家的基础。”\nB项正确，文章指出，法治政府是法治国家建设的主体和重点，是法治社会建设的先导和示范······建设法治政府对建设法治社会具有重要引领和带动作用。故D项“法治国家是依法治国的主体”表述错误，应为“法治政府是法治国家建设的主体和重点”。\nC项正确，文章指出，法治国家是法治政府、法治社会建设的目标，法治政府、法治社会建设必须服从、服务于法治国家建设。\nD项错误，2020年11月16日，习总书记在中央全面依法治国工作会议上讲话中指出：“我多次强调，推进全面依法治国，法治政府建设是重点任务和主体工程，对法治国家、法治社会建设具有示范带动作用，要率先突破。”且文章中指出，法治政府是法治社会建设的先导和示范。故“法治国家”表述错误，应该为“法治政府”。\n本题为选非题，故正确答案为D。\n（备注：D选项：2014年10月通过的《中共中央关于全面推进依法治国若干重大问题的决定》中指出：“坚持人民主体地位。人民是依法治国的主体和力量源泉······”但题目主要是在考查法治政府、法治国家和法治社会的关系。）","no":5,"missingImage":false},{"type":"question","qid":"19526283","cat":"时事政治","stem":"2025年7月，习近平总书记在中央城市工作会议上发表重要讲话，明确做好城市工作的总体要求、重要原则、重点任务，为做好新时代新征程的城市工作提供了根本遵循。关于城市工作，下列说法正确的是：","options":{"A":"要把握“我国城镇化正从快速增长期转向稳定发展期”的历史方位","B":"城市工作重心应向更加注重建设投入转变","C":"着力通过外延扩张发展组团式的现代化城市群和都市圈","D":"城市政府应从城市事务管理的“掌舵人”转变为“划桨人”"},"answer":"A","explanation":"本题考查理论与政策。\nA项正确，B项错误，2025年7月14日至15日，中央城市工作会议在北京举行。会议指出，我国城镇化正从快速增长期转向稳定发展期，城市发展正从大规模增量扩张阶段转向存量提质增效为主的阶段。城市工作要深刻把握、主动适应形势变化······转变城市工作重心，更加注重治理投入；转变城市工作方法，更加注重统筹协调。故B项“城市工作重心应向更加注重建设投入转变”表述错误，应为“城市工作重心应向更加注重治理投入转变”。\nC项错误，2025年7月14日至15日，中央城市工作会议在北京举行。会议部署城市工作7个方面的重点任务。一是着力优化现代化城市体系。着眼于提高城市对人口和经济社会发展的综合承载能力，发展组团式、网络化的现代化城市群和都市圈，分类推进以县城为重要载体的城镇化建设，继续推进农业转移人口市民化，促进大中小城市和小城镇协调发展，促进城乡融合发展。其次，会议指出，要以坚持城市内涵式发展为主线。故选项“着力通过外延扩张发展组团式的现代化城市群和都市圈”表述错误，应为“着力通过内涵式发展组团式、网络化的现代化城市群和都市圈”。\nD项错误，2015年12月20日，习近平总书记在中央城市工作会议上指出：“要尊重市民对城市发展决策的知情权、参与权、监督权，鼓励企业和市民通过各种方式参与城市建设、管理。在共建共享过程中，城市政府应该从‘划桨人’转变为‘掌舵人’，同市场、企业、市民一起管理城市事务、承担社会责任。”\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"19526299","cat":"新思想","stem":"经济工作千头万绪，必须统筹好有效市场和有为政府的关系、总供给和总需求的关系、培育新动能和更新旧动能的关系、做优增量和盘活存量的关系、提升质量和做大总量的关系。下列相关说法不准确的是：","options":{"A":"要加快推动作为经济增长和就业收入基本依托的传统产业改造升级","B":"要加快补上内需特别是消费短板，使内需成为拉动经济增长的主动力和稳定锚","C":"要坚持以量取胜、充分发挥规模效应，用好超大规模市场优势和丰富应用场景","D":"要用好各类增量资源和存量资源，通过盘活存量来带动增量"},"answer":"C","explanation":"本题考查理论与政策。\n2025年2月28日，《求是》杂志发表习近平总书记重要文章《经济工作必须统筹好几对重要关系》。\nA项正确，文章指出：“三是必须统筹好培育新动能和更新旧动能的关系，因地制宜发展新质生产力。要以科技创新为引领，大力培育壮大新兴产业和未来产业，占据国际竞争制高点，塑造经济发展新动能、新优势。同时，加快推动作为经济增长和就业收入基本依托的传统产业改造升级，使之焕发新的生机活力，推动新旧发展动能平稳接续转换。”\nB项正确，文章指出：“二是必须统筹好总供给和总需求的关系，畅通国民经济循环。要坚持供需两侧协同发力、动态平衡，持续深化供给侧结构性改革，有进有退、有保有压，增强供给与需求的适配性、平衡性。扩大内需既关系经济稳定，也关系经济安全，不是权宜之计，而是战略之举。要加快补上内需特别是消费短板，使内需成为拉动经济增长的主动力和稳定锚。”\nC项错误，文章指出：“五是必须统筹好提升质量和做大总量的关系，夯实中国式现代化的物质基础。我国拥有巨大的经济体量、市场容量和产业配套能力，是提升质量、做优做强的有利条件。我国人均国民收入尚未达到世界平均水平，发展不平衡不充分问题仍然突出。要坚持以质取胜和发挥规模效应相统一，用好超大规模市场优势和丰富应用场景，培育更多世界一流企业和领先技术，把质的有效提升和量的合理增长统一于高质量发展的全过程。”故“要坚持以量取胜、充分发挥规模效应”表述有误，应为“要坚持以质取胜和发挥规模效应相统一”。\nD项正确，文章指出：“四是必须统筹好做优增量和盘活存量的关系，全面提高资源配置效率。经过长期发展，我国需要同时加强资产管理和负债管理，统筹用好各类增量资源和存量资源，善于通过盘活存量来带动增量。要持续推动产业园区‘腾笼换鸟’，用好置换存量隐性债务、盘活存量土地等政策，统筹做优增量和盘活存量、管好资产和调整负债，拓展新的发展空间。”\n本题为选非题，故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"19526284","cat":"时事政治","stem":"2025年7月30日，中共中央政治局召开会议，对扎实做好民生保障工作作了重要部署。下列相关表述不准确的是（    ）。","options":{"A":"巩固拓展脱贫攻坚成果，确保不发生规模性返贫致贫","B":"夯实“三农”基础，推动粮食和重要农产品价格保持在合理水平","C":"突出就业优先政策导向，促进高校毕业生、退役军人、农民工等重点群体就业","D":"始终把人民群众财产安全放在第一位，加强安全生产监管"},"answer":"D","explanation":"本题考查理论与政策。\n2025年7月30日，中共中央政治局召开会议，决定召开二十届四中全会，分析研究当前经济形势和经济工作，中共中央总书记习近平主持会议。\nA项正确，会议指出，要扎实推进乡村全面振兴，巩固拓展脱贫攻坚成果，确保农村人口不发生规模性返贫致贫。要加强耕地保护和质量提升，抓好农业生产，努力夺取全年粮食丰收。\nB、C两项正确，D项错误，会议强调，要扎实做好民生保障工作。突出就业优先政策导向，促进高校毕业生、退役军人、农民工等重点群体就业。落实好惠民政策，健全分层分类社会救助体系。夯实“三农”基础，推动粮食和重要农产品价格保持在合理水平。巩固拓展脱贫攻坚成果，确保不发生规模性返贫致贫。始终把人民群众生命安全放在第一位，加强安全生产和食品安全监管，全力做好防汛应急抢险救灾，保障迎峰度夏期间能源电力供应。做好“十五五”规划编制工作。故D项“人民群众财产安全”表述有误，应为“人民群众生命安全”。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"19526256","cat":"新思想","stem":"做好新时代人口工作，要完善新时代人口发展战略，认识、适应、引领人口发展新常态，以人口高质量发展支撑中国式现代化。关于做好新时代人口工作，下列说法正确的是：","options":{"A":"要树立“大人口观”，推动人口与财政、货币、就业、产业、投资、消费、生态、区域等政策形成系统集成效应","B":"必须推动人口工作由稳定总量、畅通流动向调节数量、优化结构转变","C":"要更加重视“引导”和“激励”的办法，由社会治理向政府治理转变","D":"坚持人民主体地位，把人口高速增长同人民高品质生活紧密结合起来"},"answer":"A","explanation":"本题考查理论与政策。\n2024年11月16日，《求是》杂志发表了习近平总书记题为《以人口高质量发展支撑中国式现代化》的重要文章，以下简称文章。\nA项正确，文章中“（二）做好新时代人口工作的基本思路和重大原则”部分指出：“二是坚持以系统观念统筹谋划人口问题。要树立‘大人口观’，从中国式现代化全局出发，深入研判人口变化对经济社会发展的复杂影响，在制定经济社会政策时充分考虑人口变化因素，推动人口与财政、货币、就业、产业、投资、消费、生态、区域等政策形成系统集成效应。”\nB项错误，文章中“（二）做好新时代人口工作的基本思路和重大原则”部分指出：“一是坚持以人口高质量发展促进经济社会高质量发展。我国已经进入推动高质量发展的关键时期，必须推动人口工作由调节数量为主向提升素质、稳定总量、优化结构、畅通流动转变，以人口高质量发展打造高素质人力资源，加快构建新发展格局，着力推动高质量发展。”故“推动人口工作由稳定总量、畅通流动向调节数量、优化结构转变”说法错误，应为“必须推动人口工作由调节数量为主向提升素质、稳定总量、优化结构、畅通流动转变”。\nC项错误，文章中“（二）做好新时代人口工作的基本思路和重大原则”部分指出：“三是坚持以改革创新推动人口高质量发展。过去人口工作以‘管’为主，今后工作覆盖面更广了、颗粒度更细了，要更加重视‘引导’和‘激励’的办法，由主要依靠政府力量向政府和社会协同治理转变。”故“由社会治理向政府治理转变”说法错误，应为“由主要依靠政府力量向政府和社会协同治理转变”。\nD项错误，文章中“（二）做好新时代人口工作的基本思路和重大原则”部分指出：“四是坚持促进人的全面发展和全体人民共同富裕。做好新时代人口工作，要顺应人民群众对美好生活的期待，坚持人民主体地位，把人口高质量发展同人民高品质生活紧密结合起来······”故“把人口高速增长同人民高品质生活紧密结合起来”说法错误，应为“把人口高质量发展同人民高品质生活紧密结合起来”。\n故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"19526288","cat":"新思想","stem":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》提出，推进国家安全体系和能力现代化，建设更高水平平安中国。下列有关说法正确的是（    ）。","options":{"A":"锻造实战实用的国家安全能力，把捍卫国土安全摆在首位","B":"统筹推进房地产、地方政府债务、中小金融机构等风险有序化解","C":"健全国家安全体系，坚持以风险防控为先导、法治保障为落脚点","D":"完善公共安全体系，推动公共安全治理模式由事后处理向事中控制转型"},"answer":"B","explanation":"本题考查理论与政策。\n2025年10月23日，中国共产党第二十届中央委员会第四次全体会议通过了《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》，以下简称《建议》。\nA项错误，《建议》中“十三、推进国家安全体系和能力现代化，建设更高水平平安中国”部分指出：“（50）加强重点领域国家安全能力建设。锻造实战实用的国家安全能力，突出保障事关国家长治久安、经济健康稳定、人民安居乐业的重大安全，把捍卫政治安全摆在首位。”故“把捍卫国土安全摆在首位”说法错误，应为“把捍卫政治安全摆在首位”。\nB项正确，《建议》中“十三、推进国家安全体系和能力现代化，建设更高水平平安中国”部分指出：“（50）加强重点领域国家安全能力建设······提高防范化解重点领域风险能力，统筹推进房地产、地方政府债务、中小金融机构等风险有序化解，严防系统性风险。”\nC项错误，《建议》中“十三、推进国家安全体系和能力现代化，建设更高水平平安中国”部分指出：“（49）健全国家安全体系······坚持以战略为先导、政策为抓手、法治为保障、风险防控为落脚点，完善国家安全法治体系、战略体系、政策体系、风险防控体系。”故“坚持以风险防控为先导、法治保障为落脚点”说法错误，应为“坚持以战略为先导、风险防控为落脚点”。\nD项错误，《建议》中“十三、推进国家安全体系和能力现代化，建设更高水平平安中国”部分指出：“（51）提高公共安全治理水平。完善公共安全体系，推动公共安全治理模式向事前预防转型。”故“推动公共安全治理模式由事后处理向事中控制转型”说法错误，应为“推动公共安全治理模式向事前预防转型”。\n故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"19526342","cat":"时事政治","stem":"习近平总书记高度重视战略思维，多次强调党员领导干部要加强战略思维，增强战略定力。下列体现战略思维的说法，正确的有几项？\n①粮食多一点少一点是战略问题，粮食安全是战术问题\n②统战工作的本质要求是大团结大联合，解决的是人心和力量问题\n③要心怀“国之大者”，站在全局和战略的高度想问题、办事情，一切工作都要以贯彻落实党中央决策部署为前提\n④自觉把党的对外工作放到党和国家工作大局中来认识，放到中国与世界关系的发展变化中来把握","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查理论与政策。\n①错误，《习近平谈治国理政》第四卷中的《牢牢把住粮食安全主动权》中指出：“‘五谷者，万民之命，国之重宝。’我反复强调，粮食多一点少一点是战术问题，粮食安全是战略问题。应对新冠肺炎疫情，粮食和重要农副产品供给充裕功不可没，充分印证了这一点。”故“粮食多一点少一点是战略问题，粮食安全是战术问题”表述错误，应为“粮食多一点少一点是战术问题，粮食安全是战略问题”。\n②正确，2024年1月15日，《求是》杂志发表的习近平总书记重要文章《完整、准确、全面贯彻落实关于做好新时代党的统一战线工作的重要思想》中指出：“第二，必须解决好人心和力量问题。人心向背、力量对比是决定党和人民事业成败的关键，是最大的政治。统战工作的本质要求是大团结大联合，解决的就是人心和力量问题。这是党治国理政必须下大气力解决好的重大问题。”\n③正确，2022年3月1日，习近平总书记在中央党校（国家行政学院）中青年干部培训班开班式上发表重要讲话强调：“要心怀‘国之大者’，站在全局和战略的高度想问题、办事情，一切工作都要以贯彻落实党中央决策部署为前提，不能为了局部利益损害全局利益、为了暂时利益损害根本利益和长远利益。”\n④正确，2023年7月3日，《学习时报》发表《习近平总书记论战略思维》中指出：“习近平总书记视野开阔、胸襟博大······谈到外交工作，他指出：‘自觉把党的对外工作放到党和国家工作大局中来认识，放到中国与世界关系的发展变化中来把握，放到国家总体外交的战略部署中来谋划。’”\n综上，②③④表述正确，共3项。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"19526346","cat":"新思想","stem":"习近平总书记指出，我们要建成的教育强国，是中国特色社会主义教育强国，应当具有强大的思政引领力、人才竞争力、科技支撑力、民生保障力、社会协同力、国际影响力，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力支撑。关于建设教育强国，下列说法正确的是：","options":{"A":"要坚持教育均等化原则，把教育公平作为国家基本教育政策","B":"要完善人才培养与经济社会发展需要适配机制，顺应时代发展要求，适度增加学科专业数量","C":"要把引进全球顶尖科学家摆到更加突出位置，着力培育拔尖创新人才，推动实现高水平科技自立自强","D":"从教育大国到教育强国是一个系统性跃升和质变，必须以改革创新为动力"},"answer":"D","explanation":"本题考查理论与政策。\nA项错误，2018年9月10日，习近平总书记在全国教育大会上的讲话中指出：“我们要坚持我国教育现代化的社会主义方向，坚持教育公益性原则，把教育公平作为国家基本教育政策，大力推进教育体制改革创新。”故“均等化”表述错误，应为“公益性”。\nB项错误，2025年6月1日，《求是》杂志发表的习近平总书记重要文章《加快建设教育强国》指出：“三是培养人才和满足社会需要的关系······要完善人才培养与经济社会发展需要适配机制，顺应时代发展要求，动态调整学科专业，优化办学资源配置，完善学生实习实践制度，努力让每一位人才都能人尽其才、才尽其用、各得其所。”故“适度增加学科专业数量”表述错误，应为“动态调整学科专业”。\nC项错误，2025年6月1日，《求是》杂志发表的习近平总书记重要文章《加快建设教育强国》指出：“一是支撑国家战略和满足民生需求的关系。要把培养国家重大战略急需人才摆到更加突出位置，着力造就拔尖创新人才，推动实现高水平科技自立自强。聚焦解决教育发展不平衡不充分问题，不断满足人民群众更高质量更加多样的教育需求。”故“要把引进全球顶尖科学家摆到更加突出位置”表述错误，应为“要把培养国家重大战略急需人才摆到更加突出位置”。\nD项正确，2023年5月29日，中共中央政治局就建设教育强国进行第五次集体学习。习近平总书记强调，从教育大国到教育强国是一个系统性跃升和质变，必须以改革创新为动力。要坚持系统观念，统筹推进育人方式、办学模式、管理体制、保障机制改革，坚决破除一切制约教育高质量发展的思想观念束缚和体制机制弊端，全面提高教育治理体系和治理能力现代化水平。\n故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"19526269","cat":"新思想","stem":"习近平主席在二十国集团领导人第十九次峰会上指出，要完善全球贸易治理，建设开放型世界经济。下列相关表述正确的是：","options":{"A":"要适应经济问题政治化的潮流，通过强化绿色低碳要求推行贸易保护政策","B":"要积极构建更具平等性、包容性和建设性的产业链供应链伙伴关系，呼吁各方加强合作","C":"要把安全置于国际经贸议程中心地位，持续推动贸易和投资自由化便利化","D":"要一以贯之保持世界贸易组织规则不变，提高多边贸易体制的权威性、有效性和相关性"},"answer":"B","explanation":"本题考查理论与政策。\n当地时间2024年11月18日，国家主席习近平在巴西里约热内卢出席二十国集团领导人第十九次峰会第二阶段会议并发表题为《携手构建公正合理的全球治理体系》的讲话，以下简称讲话。\nA项错误，习近平主席在讲话中指出：“第三，完善全球贸易治理，建设开放型世界经济······要避免经济问题政治化、人为割裂全球市场，避免以绿色低碳为名、行保护主义之实。”故“适应经济问题政治化的潮流”“推行贸易保护政策”表述错误。\nB项正确，习近平主席在讲话中指出：“第三，完善全球贸易治理，建设开放型世界经济······两年前，中国同印度尼西亚等国共同发起《产业链供应链韧性与稳定国际合作倡议》，呼吁构建更具平等性、包容性和建设性的产业链供应链伙伴关系，我们愿同各方就此加强合作。”\nC项错误，习近平主席在讲话中指出：“第三，完善全球贸易治理，建设开放型世界经济。要把发展置于国际经贸议程中心地位，持续推动贸易和投资自由化便利化，要继续推进世界贸易组织改革······”故“把安全置于国际经贸议程中心地位”表述错误，应为“把发展置于国际经贸议程中心地位”。\nD项错误，习近平主席在讲话中指出：“第三，完善全球贸易治理，建设开放型世界经济······要积极推进世界贸易组织规则与时俱进，既要解决长期未决议题，又要积极探索制定面向未来的新规则，提高多边贸易体制的权威性、有效性和相关性。”故“一以贯之保持世界贸易组织规则不变”表述错误，应为“积极推进世界贸易组织规则与时俱进”。\n故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"19526276","cat":"新思想","stem":"中国式现代化要靠科技现代化作支撑，实现高质量发展要靠科技创新培育新动能。关于建成科技强国的举措，下列说法正确的是：","options":{"A":"要坚持有所为有所不为，突出经济发展需求，在重要领域实施科技战略部署","B":"要充分发挥人才在科技资源配置中的决定性作用，调动产学研各环节的积极性","C":"要充分发挥科技领军企业龙头作用，鼓励中小企业和民营企业科技创新，支持企业牵头或参与国家重大科技项目","D":"要降低基础研究组织化程度，强化自由探索，鼓励面向重大科学问题的协同攻关"},"answer":"C","explanation":"本题考查理论与政策。\n2024年6月24日，习近平总书记在全国科技大会、国家科学技术奖励大会、两院院士大会上发表重要讲话（以下简称讲话）。\nA项错误，习总书记在讲话中指出：“要保持战略定力，坚持有所为有所不为，突出国家战略需求，在若干重要领域实施科技战略部署，凝练实施一批新的重大科技项目，形成竞争优势，赢得战略主动。”故“突出经济发展需求”表述错误，应为“突出国家战略需求”。\nB项错误，习总书记在讲话中指出：“要充分发挥市场在科技资源配置中的决定性作用，更好发挥政府各方面作用，调动产学研各环节的积极性，形成共促关键核心技术攻关的工作格局。”故“人才”表述错误，应为“市场”。\nC项正确，习总书记在讲话中指出：“融合的关键是强化企业科技创新主体地位。要充分发挥科技领军企业龙头作用，鼓励中小企业和民营企业科技创新，支持企业牵头或参与国家重大科技项目。”\nD项错误，习总书记在讲话中指出：“要提高基础研究组织化程度，完善竞争性支持和稳定支持相结合的投入机制，强化面向重大科学问题的协同攻关，同时鼓励自由探索，努力提出原创基础理论、掌握底层技术原理，筑牢科技创新根基和底座。”故“降低基础研究组织化程度”“强化自由探索”“鼓励面向重大科学问题的协同攻关”表述错误，应为“提高基础研究组织化程度”“鼓励自由探索”“强化面向重大科学问题的协同攻关”。\n故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"19526252","cat":"新思想","stem":"习近平总书记强调，选人用人要加强党性鉴别，注重考察干部的境界格局和忠诚度廉洁度。下列与党性相关的说法正确的是：","options":{"A":"树立和践行正确政绩观，起决定性作用的是党性","B":"强党性，就是要自觉用马克思主义思想改造客观世界","C":"党性、党风、党纪是有机整体，党性是根本，党风是保障，党纪是表现","D":"作风问题本质上是党性问题，要把作风建设摆在党性修养的首位"},"answer":"A","explanation":"本题考查理论与政策。\nA项正确，2022年3月1日，习近平总书记在春季学期中央党校（国家行政学院）中青年干部培训班开班式上指出：“树立和践行正确政绩观，起决定性作用的是党性。”\nB项错误，2023年4月3日，在学习贯彻习近平新时代中国特色社会主义思想主题教育工作会议上，习近平总书记对开展主题教育的总要求“学思想、强党性、重实践、建新功”作出深刻阐释，指出：“强党性，就是要自觉用新时代中国特色社会主义思想改造主观世界，深刻领会这一思想关于坚定理想信念、提升思想境界、加强党性锻炼等一系列要求，始终保持共产党人的政治本色。”因此“用马克思主义思想改造客观世界”表述错误，应为“用新时代中国特色社会主义思想改造主观世界”。\nC项错误，2024年12月，习近平总书记在纪念乔石同志诞辰100周年座谈会上的讲话中指出，党性、党风、党纪是有机整体，党性是根本，党风是表现，党纪是保障。我们要始终坚持党的全面领导和党中央集中统一领导，坚定不移全面从严治党，深入推进党风廉政建设和反腐败斗争······故“党风是保障，党纪是表现”表述错误，应为“党风是表现，党纪是保障”。\nD项错误，2018年1月5日，习近平总书记在新进中央委员会的委员、候补委员和省部级主要领导干部学习贯彻习近平新时代中国特色社会主义思想和党的十九大精神研讨班上的讲话指出：“作风问题本质上是党性问题。领导干部的作风直接关系党内风气和政治生态，关系民心向背，决定着党的群众基础。”2024年12月26日至27日，习近平总书记在主持召开中央政治局民主生活会时强调：“领导干部要把锤炼党性、提高思想觉悟作为终身课题，活到老、学到老、修养到老。要把政治修养摆在党性修养的首位，从党的创新理论中汲取党性滋养，把学习遵守贯彻党章党规党纪作为党性修养的重要内容。”因此“要把作风建设摆在党性修养的首位”表述错误，应为“要把政治修养摆在党性修养的首位”。\n故正确答案为A。","no":15,"missingImage":false},{"type":"question","qid":"19526257","cat":"新思想","stem":"坚持问题导向是习近平新时代中国特色社会主义思想的世界观和方法论的重要内容。关于坚持问题导向，下列说法不准确的是：","options":{"A":"坚持问题导向是马克思主义的鲜明特点","B":"坚持问题导向要抓住人民最关心最直接最现实的利益问题","C":"坚持问题导向体现了矛盾的普遍性和客观性","D":"坚持问题导向本质是变与不变、继承与发展的辩证统一"},"answer":"D","explanation":"本题考查马克思主义。\nA项正确，在习近平新时代中国特色社会主义思想中，必须坚持问题导向并非一般性的要求，而是上升到了世界观和方法论的高度，具有深刻的哲学内涵。必须坚持问题导向是马克思主义的鲜明特点，是党的十八大以来党治国理政的突出特点，是推进马克思主义中国化时代化的现实着眼点。\nB项正确，习近平总书记强调，要增强问题意识，聚焦人民群众急难愁盼问题等一系列重大问题。人民最关心最直接最现实的利益问题正是群众急难愁盼问题，坚持问题导向必然要求抓住这类问题，并以此为着力点制定政策、推进工作，切实解决群众诉求。\nC项正确，问题是事物矛盾的表现形式，矛盾无处不在、无时不有（普遍性），矛盾是客观存在的（客观性）。坚持问题导向，就是承认矛盾、分析矛盾、解决矛盾，这直接体现了矛盾的普遍性和客观性。 \nD项错误，体现变与不变、继承与发展辩证统一的是“坚持守正创新”，而非“坚持问题导向”。守正意味着坚守马克思主义基本原理、党的根本宗旨等不变的原则，创新则是结合时代发展推出新理念新思路新办法，二者的结合正是这种辩证统一的体现。而坚持问题导向的本质是实事求是、一切从实际出发，核心是不断认识矛盾、解决矛盾以推动事物发展。 \n本题为选非题，故正确答案为D。","no":16,"missingImage":false},{"type":"question","qid":"19526337","cat":"新思想","stem":"恩格斯深刻指出：“马克思的整个世界观不是教义，而是方法。它提供的不是现成的教条，而是进一步研究的出发点和供这种研究使用的方法。”下列有关马克思主义理论的说法不准确的是：","options":{"A":"马克思创立了辩证法，成为我们认识世界和改造世界的根本方法","B":"科学社会主义的原则不能丢，但科学社会主义也绝不是一成不变的教条","C":"当代中国的伟大社会变革不是简单套用马克思主义经典作家设想的模板","D":"《共产党宣言》发表至今，人类社会发生了翻天覆地的变化，但马克思主义所阐述的一般原理整个来说仍然是完全正确的"},"answer":"A","explanation":"本题考查马克思主义。\nA项错误，辩证法并非由马克思创立，而是历经多个时代、经多位哲学家逐步完善发展而来，是研究思维过程及矛盾运动的哲学方法。马克思和恩格斯的贡献在于批判继承了黑格尔辩证法的合理内核，摒弃其唯心主义外壳，结合唯物主义立场创立了唯物辩证法。唯物辩证法是我们认识世界和改造世界的根本方法。\nB、C两项正确，2018年5月4日，习总书记在纪念马克思诞辰200周年大会上的讲话中指出：“对待科学的理论必须有科学的态度······科学社会主义基本原则不能丢，丢了就不是社会主义。同时，科学社会主义也绝不是一成不变的教条。我说过，当代中国的伟大社会变革，不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版。”\nD项正确，2018年5月4日，习总书记在纪念马克思诞辰200周年大会上的讲话中指出：“从《共产党宣言》发表到今天，170年过去了，人类社会发生了翻天覆地的变化，但马克思主义所阐述的一般原理整个来说仍然是完全正确的。”\n本题为选非题，故正确答案为A。","no":17,"missingImage":false},{"type":"question","qid":"19526341","cat":"新思想","stem":"以实践为基础，从整体上把握人与世界的关系，是马克思主义世界观的重要内容。关于马克思主义实践观，下列说法正确的是：","options":{"A":"正确发挥主观能动性是实践的根本途径","B":"实践的过程就是对于结果的检验和评价","C":"实践是人类生存和发展最基本的活动","D":"实践是一种无目的的适应环境的本能活动"},"answer":"C","explanation":"本题考查马克思主义。\nA项错误，实践是正确发挥人的主观能动性的根本途径。正确的认识要变为现实的物质力量，只能通过物质的活动即实践才能达到。选项表述颠倒了“正确发挥主观能动性”和“实践”的地位。\nB项错误，实践是人类能动地改造世界的社会性的物质活动，实践的过程即“改造客观世界”，而对实践结果的检验和评价，本质上是实践作为真理检验标准的体现——即通过实践结果判断认识是否符合客观实际。实践的过程不仅仅是对于结果的检验和评价。\nC项正确，马克思主义认为，实践是人类能动地改造客观世界的物质活动，其中生产实践是人类生存和发展最基本的实践形式。人类通过生产实践获取物质生活资料，解决人与自然的矛盾，是其他一切社会活动的基础。没有生产实践提供的物质前提，人类的生存无从谈起，更无法开展其他高级社会活动，因此“实践是人类生存和发展最基本的活动”说法正确，符合马克思主义实践观的核心内涵。\nD项错误，实践的本质特征之一是自觉能动性，即人类的实践活动是有目的、有意识的能动活动，是在一定认识指导下主动改造世界的行为。而“无目的的适应环境的本能活动”是动物的生存行为，不具备人类实践的目的性和能动性。\n故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"19526282","cat":"新思想","stem":"习近平总书记在对各省区市进行深入考察调研的过程中，结合各地实际情况，对推进高质量发展作出一系列重要部署。下列对应关系正确的是：","options":{"A":"江苏——要建设国家资源型经济转型综合配套改革试验区，重点抓好能源转型、产业升级和适度多元发展","B":"山东——要发挥海洋资源丰富的得天独厚优势，经略海洋、向海图强，打造世界级海洋港口群，打造现代海洋经济发展高地","C":"云南——要把握好挑大梁的着力点，在推动科技创新和产业创新融合上打头阵","D":"贵州——聚焦实现贸易、投资、跨境资金流动、人员进出、运输来往自由便利和数据安全有序流动"},"answer":"B","explanation":"本题考查理论与政策。\nA项错误，2025年7月，习近平总书记在山西考察时指出，建设国家资源型经济转型综合配套改革试验区是党中央交给山西的一项战略任务，要进一步统一思想，保持定力，坚定有序推进转型发展。重点要抓好能源转型、产业升级和适度多元发展。故“江苏”错误，应为“山西”。\nB项正确，2024年5月，习近平总书记在山东考察时指出，要发挥海洋资源丰富的得天独厚优势，经略海洋、向海图强，打造世界级海洋港口群，打造现代海洋经济发展高地。\nC项错误，2025年3月5日，习近平总书记在参加十四届全国人大三次会议江苏代表团审议时发表的重要讲话中强调，江苏要把握好挑大梁的着力点，在推动科技创新和产业创新融合上打头阵，在推进深层次改革和高水平开放上勇争先，在落实国家重大发展战略上走在前，在促进全体人民共同富裕上作示范。故“云南”错误，应为“江苏”。\nD项错误，2024年12月17日，习近平总书记在海南三亚听取海南省委和省政府工作汇报时发表的重要讲话中强调，聚焦实现贸易、投资、跨境资金流动、人员进出、运输来往自由便利和数据安全有序流动，对标国际高水平经贸规则，大力推进制度型开放，营造市场化、法治化、国际化一流营商环境。故“贵州”错误，应为“海南”。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"19526232","cat":"新思想","stem":"2025年是中国人民抗日战争暨世界反法西斯战争胜利80周年。中国人民对战争带来的苦难有着刻骨铭心的记忆，对和平有着孜孜不倦的追求。关于中国人民抗日战争，下列表述不准确的是：","options":{"A":"中国人民抗日战争的伟大胜利，是以爱国主义为核心的民族精神的伟大胜利","B":"中国人民抗日战争的伟大胜利，第一次确立了中国在世界上的大国地位，使中国人民赢得了世界爱好和平人民的尊敬","C":"中国人民抗日战争的伟大胜利，是近代以来中国抗击外敌入侵的第一次完全胜利","D":"中国人民抗日战争的伟大胜利，为中华民族由近代以来陷入深重危机走向伟大复兴确立了历史转折点"},"answer":"B","explanation":"本题考查时政热点。\n2025年9月1日出版的第17期《求是》杂志发表习近平总书记的重要文章《弘扬伟大抗战精神，向着中华民族伟大复兴的光辉彼岸奋勇前进》。\nA项正确，文章指出，中国人民抗日战争胜利是以爱国主义为核心的民族精神的伟大胜利。爱国主义是我们民族精神的核心，是中国人民和中华民族同心同德、自强不息的精神纽带。\nB项错误，C项正确，文章指出，中国人民抗日战争胜利，是近代以来中国抗击外敌入侵的第一次完全胜利。这一伟大胜利，彻底粉碎了日本军国主义殖民奴役中国的图谋，洗刷了近代以来中国抗击外来侵略屡战屡败的民族耻辱。这一伟大胜利，重新确立了中国在世界上的大国地位，使中国人民赢得了世界爱好和平人民的尊敬。这一伟大胜利，开辟了中华民族伟大复兴的光明前景，开启了古老中国凤凰涅槃、浴火重生的新征程。因此B项“第一次确立了中国在世界上的大国地位”表述错误，应为“重新确立了中国在世界上的大国地位”。\nD项正确，文章指出，这（指中国人民抗日战争）是近代以来中国人民反抗外敌入侵持续时间最长、规模最大、牺牲最多的民族解放斗争，也是第一次取得完全胜利的民族解放斗争。这个伟大胜利，是中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点、也是世界反法西斯战争胜利的重要组成部分，是中国人民的胜利、也是世界人民的胜利。\n本题为选非题，故正确答案为B。","no":20,"missingImage":false}],"count":20,"answerable":20,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"19526260","cat":"法律常识","stem":"下列情形不符合《中华人民共和国监察法》及其实施条例规定的是：","options":{"A":"再派出的监察专员王某在开展监察工作过程中，受派出他的监察机构领导","B":"公务员张某在怀孕期间因涉嫌严重职务违法被监察机关调查，经监察机关依法审批，对其采取责令候查措施","C":"办理监察事项的监察人员黄某系监察对象刘某的丈夫，黄某应自行回避","D":"监察人员李某涉嫌职务犯罪，监察机关决定对其采取15日禁闭措施"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国监察法实施条例》第十四条第二款规定：“再派出监察机构、监察专员开展监察工作，受派出它的监察机构、监察专员领导。”因此，再派出的监察专员王某在开展监察工作过程中，受派出他的监察机构领导。\nB项正确，根据《中华人民共和国监察法》第二十三条第一款第二项规定：“被调查人涉嫌严重职务违法或者职务犯罪，并有下列情形之一的，经监察机关依法审批，可以对其采取责令候查措施：（二）符合留置条件，但患有严重疾病、生活不能自理的，系怀孕或者正在哺乳自己婴儿的妇女，或者生活不能自理的人的唯一扶养人。”因此，被调查人张某处于怀孕期间，符合采取责令候查措施的情形。\nC项正确，根据《中华人民共和国监察法》第六十七条第一项规定：“办理监察事项的监察人员有下列情形之一的，应当自行回避，监察对象、检举人及其他有关人员也有权要求其回避：（一）是监察对象或者检举人的近亲属的。”因此，监察人员黄某系监察对象刘某的丈夫，符合自行回避的情形。\nD项错误，根据《中华人民共和国监察法》第六十四条第一款规定：“监察人员涉嫌严重职务违法或者职务犯罪，为防止造成更为严重的后果或者恶劣影响，监察机关经依法审批，可以对其采取禁闭措施。禁闭的期限不得超过七日。”因此，监察人员李某被采取15日禁闭措施，不符合“禁闭的期限不得超过七日”的规定。\n本题为选非题，故正确答案为D。","no":21,"missingImage":false},{"type":"question","qid":"19526233","cat":"法律常识","stem":"关于《中华人民共和国民营经济促进法》，下列说法错误的是：","options":{"A":"是我国第一部专门关于民营经济发展的基础性法律","B":"规定司法行政部门建立涉企行政执法诉求沟通机制","C":"规定地方各级人民政府与民营经济组织订立的合同不得变更","D":"规定向民营经济组织开放国家重大科研基础设施"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，中华人民共和国司法部发布的《民营经济必将走向更加广阔的舞台——写在民营经济促进法施行之际》指出：“第一部专门关于民营经济发展的基础性法律；第一次将‘两个毫不动摇’写入法律；第一次明确民营经济的法律地位；第一次明确规定‘促进民营经济持续、健康、高质量发展，是国家长期坚持的重大方针政策’······民营经济促进法的制定和实施，在我国民营经济发展史上具有里程碑意义。”\nB项正确，根据《中华人民共和国民营经济促进法》第五十三条第二款规定：“司法行政部门建立涉企行政执法诉求沟通机制，组织开展行政执法检查，加强对行政执法活动的监督，及时纠正不当行政执法行为。”\nC项错误，根据《中华人民共和国民营经济促进法》第七十条规定：“地方各级人民政府及其有关部门应当履行依法向民营经济组织作出的政策承诺和与民营经济组织订立的合同，不得以行政区划调整、政府换届、机构或者职能调整以及相关人员更替等为由违约、毁约。因国家利益、社会公共利益需要改变政策承诺、合同约定的，应当依照法定权限和程序进行，并对民营经济组织因此受到的损失予以补偿。”因此，并非规定“合同不得变更”，而是强调政府不得随意违约毁约，同时明确了基于公共利益的合法变更情形及补偿。\nD项正确，根据《中华人民共和国民营经济促进法》第二十八条规定：“支持民营经济组织参与国家科技攻关项目，支持有能力的民营经济组织牵头承担国家重大技术攻关任务，向民营经济组织开放国家重大科研基础设施，支持公共研究开发平台、共性技术平台开放共享，为民营经济组织技术创新平等提供服务，鼓励各类企业和高等学校、科研院所、职业学校与民营经济组织创新合作机制，开展技术交流和成果转移转化，推动产学研深度融合。”\n本题为选非题，故正确答案为C。","no":22,"missingImage":false},{"type":"question","qid":"19526271","cat":"法律常识","stem":"根据《中华人民共和国反洗钱法》，下列说法错误的是：","options":{"A":"在我国境内设立的非银行支付机构应履行该法规定的金融机构反洗钱义务","B":"我国境内宝石现货交易应当及时向反洗钱监测分析机构报告","C":"在业务关系结束后，金融机构应将客户身份资料至少保存十年","D":"出入境人员携带的现金超过规定金额的，应当按照规定向海关申报"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国反洗钱法》第六十三条规定：“在境内设立的下列机构，履行本法规定的金融机构反洗钱义务：（一）银行业、证券基金期货业、保险业、信托业金融机构；（二）非银行支付机构；（三）国务院反洗钱行政主管部门确定并公布的其他从事金融业务的机构。”因此，在我国境内设立的非银行支付机构，确需履行该法规定的金融机构反洗钱义务。\nB项错误，根据《中华人民共和国反洗钱法》第三十五条第一款规定：“金融机构应当按照规定执行大额交易报告制度，客户单笔交易或者在一定期限内的累计交易超过规定金额的，应当及时向反洗钱监测分析机构报告。”第四十二条：“特定非金融机构在从事规定的特定业务时，参照本章关于金融机构履行反洗钱义务的相关规定，根据行业特点、经营规模、洗钱风险状况履行反洗钱义务。”第六十四条第三项规定：“在境内设立的下列机构，履行本法规定的特定非金融机构反洗钱义务：（三）从事规定金额以上贵金属、宝石现货交易的交易商；”我国境内宝石现货交易属于特定非金融机构从事的特定业务，其所从事的活动应参照金融机构履行反洗钱义务的相关规定。因此，境内宝石现货交易只有在执行大额交易时，才需要履行及时报告义务。\nC项正确，根据《中华人民共和国反洗钱法》第三十四条第三款规定：“客户身份资料在业务关系结束后、客户交易信息在交易结束后，应当至少保存十年。”因此，在业务关系结束后，金融机构应将客户身份资料至少保存十年。\nD项正确，根据《中华人民共和国反洗钱法》第十八条第一款规定：“出入境人员携带的现金、无记名支付凭证等超过规定金额的，应当按照规定向海关申报。海关发现个人出入境携带的现金、无记名支付凭证等超过规定金额的，应当及时向反洗钱行政主管部门通报。”因此，出入境人员携带的现金超过规定金额的，应当按照规定向海关申报。\n本题为选非题，故正确答案为B。","no":23,"missingImage":false},{"type":"question","qid":"19526263","cat":"法律常识","stem":"甲乙系夫妻关系。甲盗窃他人3万元人民币后回家告诉了乙，要其帮忙联系去外地朋友家“躲几天风头”。对此，下列说法正确的是：","options":{"A":"若乙为甲盗窃案的证人，在人民法院通知其出庭作证时可以拒绝","B":"由于甲乙为夫妻，即使乙帮助甲逃匿，其行为也不构成犯罪","C":"若甲逃匿后公安机关联系到乙，乙陪同甲至公安机关投案，甲不构成自首","D":"若甲最终被判处刑罚，乙可以不经过甲的同意直接提出上诉"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国刑事诉讼法》第六十二条第一款规定：“凡是知道案件情况的人，都有作证的义务。”第一百九十三条规定：“经人民法院通知，证人没有正当理由不出庭作证的，人民法院可以强制其到庭，但是被告人的配偶、父母、子女除外。证人没有正当理由拒绝出庭或者出庭后拒绝作证的，予以训诫，情节严重的，经院长批准，处以十日以下的拘留。被处罚人对拘留决定不服的，可以向上一级人民法院申请复议。复议期间不停止执行。”题中，若乙为甲盗窃案的证人，由于甲乙系夫妻关系，乙有权拒绝出庭作证。\nB项错误，根据《中华人民共和国刑法》第三百一十条第一款规定：“明知是犯罪的人而为其提供隐藏处所、财物，帮助其逃匿或者作假证明包庇的，处三年以下有期徒刑、拘役或者管制；情节严重的，处三年以上十年以下有期徒刑。”题中，乙帮助甲逃匿，构成窝藏、包庇罪。\nC项错误，根据《中华人民共和国刑法》第六十七条第一款规定：“犯罪以后自动投案，如实供述自己的罪行的，是自首。对于自首的犯罪分子，可以从轻或者减轻处罚。其中，犯罪较轻的，可以免除处罚。”《最高人民法院关于处理自首和立功具体应用法律若干问题的解释》第一条规定：“······并非出于犯罪嫌疑人主动，而是经亲友规劝、陪同投案的；公安机关通知犯罪嫌疑人的亲友，或者亲友主动报案后，将犯罪嫌疑人送去投案的，也应当视为自动投案······”题中，乙陪同甲至公安机关投案，甲构成自首。\nD项错误，根据《中华人民共和国刑事诉讼法》第二百二十七条第一款规定：“被告人、自诉人和他们的法定代理人，不服地方各级人民法院第一审的判决、裁定，有权用书状或者口头向上一级人民法院上诉。被告人的辩护人和近亲属，经被告人同意，可以提出上诉。”题中，乙作为甲的近亲属，经甲同意后才能提出上诉。\n故正确答案为A。","no":24,"missingImage":false},{"type":"question","qid":"19526348","cat":"经济常识","stem":"下列说法与我国税收制度不相符的是：","options":{"A":"对我国境内某全球知名半导体公司征收增值税","B":"对未做废弃物无害化处理的养殖场征收资源税","C":"对某进口高档化妆品公司征收消费税","D":"对在我国境内外资企业工作多年的外籍居民征收个人所得税"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国增值税法》第三条第一款规定：“在中华人民共和国境内（以下简称境内）销售货物、服务、无形资产、不动产（以下称应税交易），以及进口货物的单位和个人（包括个体工商户），为增值税的纳税人，应当依照本法规定缴纳增值税。”选项中，我国境内的半导体公司销售半导体产品，属于增值税征税范围，应征收增值税，因此，符合我国税收制度。\nB项错误，根据《中华人民共和国资源税法》第一条规定：“在中华人民共和国领域和中华人民共和国管辖的其他海域开发应税资源的单位和个人，为资源税的纳税人，应当依照本法规定缴纳资源税。应税资源的具体范围，由本法所附《资源税税目税率表》（以下称《税目税率表》）确定。”《资源税税目税率表》载明的应税资源的具体范围包括能源矿产、金属矿产、非金属矿产、水气矿产、盐。选项中，未做废弃物无害化处理的养殖场不属于开发应税资源的单位，不应对其征收资源税，因此，不符合我国税收制度。\nC项正确，根据《中华人民共和国消费税暂行条例》第一条规定：“在中华人民共和国境内生产、委托加工和进口本条例规定的消费品的单位和个人，以及国务院确定的销售本条例规定的消费品的其他单位和个人，为消费税的纳税人，应当依照本条例缴纳消费税。”第二条第一款规定：“消费税的税目、税率，依照本条例所附的《消费税税目税率表》执行。”《消费税税目税率表》载明税目“三、化妆品”的税率为“30%”。选项中，某进口高档化妆品公司进口本条例规定的消费品化妆品，属于消费税的纳税人，应对其征收消费税，因此，符合我国税收制度。\nD项正确，根据《中华人民共和国个人所得税法》第一条规定：“在中国境内有住所，或者无住所而一个纳税年度内在中国境内居住累计满一百八十三天的个人，为居民个人。居民个人从中国境内和境外取得的所得，依照本法规定缴纳个人所得税。在中国境内无住所又不居住，或者无住所而一个纳税年度内在中国境内居住累计不满一百八十三天的个人，为非居民个人。非居民个人从中国境内取得的所得，依照本法规定缴纳个人所得税。”选项中，该外籍居民在我国境内的外资企业工作多年，可认定其在中国境内居住累计满一百八十三天，符合“居民个人”的认定标准，应缴纳个人所得税，因此，符合我国税收制度。\n本题为选非题，故正确答案为B。","no":25,"missingImage":false},{"type":"question","qid":"19526339","cat":"人文常识","stem":"《贺新郎·读史》是毛泽东创作的咏史词，高度凝练了人类社会发展历程。下列相关说法不恰当的是：","options":{"A":"成汤创立商朝是“五帝三皇神圣事”之一","B":"在“只几个石头磨过”时人类学会了用火","C":"利簋是“铜铁炉中翻火焰”时代留下的器物","D":"“更陈王奋起挥黄钺”揭开了秦末农民起义的序幕"},"answer":"A","explanation":"本题考查人文常识。\n毛泽东的《贺新郎·读史》写于1964年春，是一首咏史体裁的词，全词通过宏观视角梳理人类历史进程，并明确提出了对历史问题精到的思索和理解，歌颂了历史的真正创造者——劳动人民，表达了作者对人民力量的崇敬与共情以及对社会发展规律的深刻洞察与革命情怀。\nA项错误，“五帝三皇神圣事”的意思是传说中国上古三皇五帝，都是最高尚最有才能的神圣人物。其中“五帝三皇”指的是中国远古传说时代夏朝建立之前的部落首领。成汤是商朝的建立者，大约公元前16世纪灭夏建商。因此，商朝的历史晚于“五帝三皇”时代，成汤创立商朝不属于“五帝三皇神圣事”。\nB项正确，“只几个石头磨过”的意思是人类进步到最早的石器时代，这是人类历史的“小儿时节”。考古研究表明，人类早在石器时代就已学会使用火，最早的人类用火证据可追溯至100万年前，中国境内的西侯度遗址（山西）被认为是“人类文明的第一把圣火”所在地，距今约180万年。故石器时代与人类掌握用火技术在时间上高度吻合。\nC项正确，“铜铁炉中翻火焰”的意思是在青铜器时代和铁器时代，青铜器和铁器都要用炉火来冶炼和翻铸。利簋是西周早期青铜器，1976年出土于陕西临潼，现藏于中国国家博物馆。故利簋作为西周时期的青铜器，正是“铜铁炉中翻火焰”时代的典型器物。\nD项正确，“更陈王奋起挥黄钺”中“陈王”指陈胜，是秦末农民起义领袖，曾自立为“张楚王”；“挥黄钺”指挥动饰以黄金的大斧。陈胜吴广起义又称“大泽乡起义”，是秦末农民战争的一部分，这次起义沉重打击了秦朝，揭开了秦末农民起义的序幕，是中国历史上第一次大规模的农民起义。\n本题为选非题，故正确答案为A。","no":26,"missingImage":false},{"type":"question","qid":"19526286","cat":"人文常识","stem":"2025年3月，中共中央办公厅、国务院办公厅印发《逐步把永久基本农田建成高标准农田实施方案》，下列有关说法正确的是：","options":{"A":"西北区要重点加强水平梯田改造建设","B":"25度以上坡耕地、沿海内陆滩涂是开展建设的重点区域","C":"高标准农田建设标准中的“两通”是指通水通路","D":"黄淮海区应该把改善田块细碎化问题作为一个工作重点"},"answer":"C","explanation":"本题考查地理国情。\n2025年3月，中共中央办公厅、国务院办公厅印发《逐步把永久基本农田建成高标准农田实施方案》（以下简称《方案》）。\nA、D两项错误，《方案》在“二、建设安排”部分指出：“（四）建设分区。依据区域资源禀赋、耕作制度和行政区划等，将全国高标准农田建设分为7个区域······黄淮海区包括北京、天津、河北、山东、河南5省（直辖市），重点着力提高灌溉保证率，完善现代化耕作条件······东南区包括浙江、福建、广东、海南4省，重点在尊重农民意愿前提下逐步改善田块细碎化问题，增强农田防御暴雨能力。西南区包括广西、重庆、四川、贵州、云南5省（自治区、直辖市），重点加强水平梯田改造建设，完善田间道路，补齐工程性缺水短板。西北区包括山西、陕西、甘肃、宁夏、新疆（含新疆生产建设兵团）5省（自治区），以及内蒙古中西部8盟（市），重点加强田块整治，提高农业用水效率，破解‘卡脖子’旱问题······”故A项“西北区”表述错误，应为“西南区”；D项“黄淮海区”表述错误，应为“东南区”。\nB项错误，《方案》在“二、建设安排”部分指出：“（三）建设布局。严格限制在生态脆弱区、沿海内陆滩涂等区域，禁止在25度以上坡耕地、严格管控类耕地、生态保护红线（红线内集中连片梯田或与保护对象共生的连片耕地除外）、退耕还林还草还湖还牧区域等开展高标准农田建设。”故25度以上坡耕地是禁止建设区域，沿海内陆滩涂是限制建设区域。\nC项正确，《方案》在“二、建设安排”部分指出：“（一）建设标准。以‘一平’（田块平整）、‘两通’（通水通路）、‘三提升’（提升地力、产量、效益）为基本标准，合理确定不同区域、不同类型高标准农田建设标准和投入标准。”\n故正确答案为C。","no":27,"missingImage":false},{"type":"question","qid":"19526347","cat":"人文常识","stem":"“体重管理年”三年行动旨在引导全社会养成重视体重、科学饮食与锻炼的习惯，科学减重，健康生活。关于肥胖对健康的影响，下列说法错误的是：","options":{"A":"肥胖容易引发胰岛素抵抗，增加患2型糖尿病风险","B":"内脏脂肪组织分泌的炎症因子与动脉粥样硬化发展相关","C":"肥胖者的排尿次数多，会导致血尿酸水平远低于正常人","D":"肥胖引起的气道狭窄可能诱发阻塞性睡眠呼吸暂停"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，肥胖是2型糖尿病的核心危险因素之一。当人体内脂肪（尤其是内脏脂肪）过量堆积时，会引发胰岛素抵抗——脂肪细胞会分泌多种物质干扰胰岛素的作用，导致人体需要分泌更多胰岛素才能控制血糖，长期超负荷会损伤胰岛\u003cimg data-k=\"87dff3f6cc87\">细胞功能，最终增加2型糖尿病的发病风险。\nB项正确，内脏脂肪并非单纯的“储能组织”，还具有内分泌功能。肥胖者内脏脂肪组织会大量分泌炎症因子（如\u003cimg data-k=\"2b495e9cbf2d\">、IL-6等），这些炎症因子会损伤血管内皮细胞，促进血小板聚集、脂质沉积和动脉粥样硬化斑块形成，进而增加冠心病、脑梗死等心血管疾病的发生风险。\nC项错误，肥胖者的血尿酸水平通常高于正常人，而非“远低于”。一方面，肥胖者胰岛素抵抗会影响肾脏对尿酸的排泄功能，导致尿酸在体内蓄积；另一方面，脂肪组织代谢过程中会产生更多嘌呤，嘌呤分解的终产物即为尿酸，双重作用下肥胖者高尿酸血症的发病率显著升高。此外，排尿次数多与血尿酸水平无直接关联（排尿次数可能受饮水、代谢率等影响）。\nD项正确，肥胖者颈部、胸部脂肪大量堆积时，会压迫气道，导致气道狭窄、通气阻力增加；同时，脂肪组织对呼吸肌的负担会降低呼吸调节功能，夜间睡眠时容易出现上气道塌陷，引发阻塞性睡眠呼吸暂停（表现为打鼾、呼吸暂停、白天嗜睡等）。\n本题为选非题，故正确答案为C。","no":28,"missingImage":false},{"type":"question","qid":"19526270","cat":"人文常识","stem":"下列与自然界中的颜色有关的说法错误的是：","options":{"A":"“橙色月亮”通常发生在大气层中水汽或颗粒物质较多时","B":"火烈鸟羽毛呈朱红色与摄入食物中的虾青素累积有关","C":"蓝闪蝶翅膀呈蓝色是由于其表面鳞片具有特殊的微结构","D":"蓝莓呈现靛蓝色是因为表面蜡质层中含高浓度花青素"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，“橙色月亮”的形成核心与大气层散射作用相关。当大气层中水汽、尘埃、颗粒物质等杂质较多时（如日出日落、雾霾天、火山喷发后），月光穿过大气层的路径变长，波长较短的蓝、紫光被大量散射，而波长较长的橙、红光穿透能力更强，最终到达人眼，使月亮呈现橙色。\nB项正确，火烈鸟的羽毛颜色并非天生固定，而是后天通过食物累积形成。其主要食物（如虾、蟹、藻类）中富含类胡萝卜素（核心为虾青素），这类物质无法被火烈鸟自身合成，需通过消化吸收后沉积在羽毛组织中，随着累积量增加，羽毛逐渐从白色变为鲜艳的朱红色。这一机制是生物学中“食物色素累积影响生物体色”的典型案例。\nC项正确，蓝闪蝶翅膀的蓝色源于“结构色”（物理色），系因其翅膀表面覆盖着微小的鳞片，这些鳞片具有特殊的纳米级微结构（如多层薄膜、光栅结构），能够通过反射、折射、干涉等物理作用，选择性地增强蓝光的反射的同时削弱其他色光的传播，最终呈现出明亮的蓝色。\nD项错误，蓝莓呈现靛蓝色并不是因为表面蜡质层中含有高浓度花青素。实际上，蓝莓的靛蓝色主要来源于表皮蜡质层的微型结构，这些结构通过散射光线产生结构色，而花青素主要存在于果肉或表皮细胞中，贡献的是紫色或红色色调，不会直接导致蓝莓呈现靛蓝色。\n本题为选非题，故正确答案为D。","no":29,"missingImage":false},{"type":"question","qid":"19526338","cat":"地理国情","stem":"为促进长江水生生物多样性和水域生态修复，我国实施长江十年禁渔，下列相关说法错误的是：","options":{"A":"长江流域“一江一口两湖七河”禁渔，“两湖”指鄱阳湖和太湖","B":"禁止在长江流域开放水域养殖外来物种或者其他非本地物种","C":"青、草、鲢、鳙四大家鱼会在长江和其附属湖泊之间洄游","D":"在禁渔期内使用炸鱼、电鱼等方式捕捞，涉嫌刑事犯罪"},"answer":"A","explanation":"本题考查地理国情。\nA项错误，长江流域“一江一口两湖七河”，即长江干流，长江口禁捕管理区，鄱阳湖、洞庭湖、大渡河、岷江、沱江、赤水河、嘉陵江、乌江、汉江等重要支流实行暂定为期10年的常年禁捕。其中“两湖”指鄱阳湖和洞庭湖，而非太湖。\nB项正确，根据《中华人民共和国长江保护法》第四十二条第三款规定：“禁止在长江流域开放水域养殖、投放外来物种或者其他非本地物种种质资源。”这一规定的核心目的是防范外来物种入侵，避免其与本地水生生物争夺资源、破坏食物链，进而保护长江水生生物多样性。\nC项正确，青、草、鲢、鳙四大家鱼具有典型的洄游习性，繁殖期需进入长江干流或大型支流的特定江段（水流湍急、水温适宜）产卵，受精卵随水流漂流发育，幼鱼再进入鄱阳湖、洞庭湖等附属湖泊觅食育肥，成熟后再返回长江干流繁殖。长江十年禁渔的核心目标之一，就是保护这一“江-湖洄游通道”的完整性，让鱼类完成自然繁殖周期。\nD项正确，根据《中华人民共和国刑法》第三百四十条规定：“违反保护水产资源法规，在禁渔区、禁渔期或者使用禁用的工具、方法捕捞水产品，情节严重的，处三年以下有期徒刑、拘役、管制或者罚金。”炸鱼、电鱼属于典型的“禁用捕捞方法”，不仅会直接杀伤鱼类（包括幼鱼、鱼卵），还会破坏水域生态环境（如电击导致水生植物死亡、水体缺氧），其社会危害性远超普通非法捕捞，达到“情节严重”标准即涉嫌刑事犯罪，表述符合法律规定与司法实践。\n本题为选非题，故正确答案为A。","no":30,"missingImage":false},{"type":"question","qid":"19526235","cat":"科技常识","stem":"关于汽车自动驾驶技术，下列说法错误的是：","options":{"A":"激光雷达通过发射激光束来探测目标的位置、速度","B":"相对于毫米波雷达，超声波雷达更适合远距离探测","C":"强化学习有助于实现车辆的自主学习和智能决策","D":"陀螺仪和加速度计可用来测算车辆的姿态和运动信息"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，激光雷达本质是发射激光束探测目标的雷达系统，其向目标发射激光束后，通过接收反射的回波信号与发射信号对比，能测算出目标的位置、速度、距离等多种参数，这也是其在自动驾驶中用于精准环境感知的核心原理。\nB项错误，毫米波雷达是工作在毫米波波段（波长为1～10mm）探测的雷达，通过分析反射回来的电磁波来探测物体的距离、速度和角度。电磁波在空气中衰减很慢，能够实现百米以上的有效探测。‌超声波雷达是一种利用超声波（频率高于20kHz的声波）进行探测的传感器，主要用于短距离环境感知‌，常见于汽车泊车辅助、工业检测等领域。\nC项正确，强化学习是一种机器学习方法，它允许智能体能够在与环境的交互中通过试错来学习最优策略。它能应用在自动驾驶的路径规划、紧急情况制动避让等决策环节，助力车辆实现自主学习和智能决策，提升应对复杂交通场景的能力。\nD项正确，陀螺仪可测量车辆的角速度，以此判断车辆转向角度、姿态变化等；加速度计能测量车辆三轴方向的加速度，可推算车速变化等运动信息。二者常整合为惯性测量单元，为自动驾驶的车道保持、自适应巡航等功能提供车辆姿态和运动信息支撑。\n本题为选非题，故正确答案为B。","no":31,"missingImage":false},{"type":"question","qid":"19526264","cat":"人文常识","stem":"关于中国古代建筑的构件，下列说法正确的是：","options":{"A":"飞檐在木构建筑中能有效减少梁柱交接处的剪力","B":"台基多使用石材，其主要目的是防火","C":"藻井可解决建筑室内通风和采光问题","D":"榫卯结构通过允许微小位移来提升整体抗震性能"},"answer":"D","explanation":"本题考查人文常识。\nA项错误，斗拱是中国传统木构建筑中特有的承重构件，能有效减少梁柱交接处的剪力。斗拱通过层层叠压的斗、拱、翘等部件，可以将梁架传递下来的竖向荷载分散。同时，斗拱的榫卯连接具有一定的弹性和转动空间，在荷载作用下可产生微小变形，吸收部分剪力能量，避免节点因剪力集中而开裂或损坏。飞檐是中国传统木构建筑中屋顶檐部向上翘起的特殊构造，主要具备排水、遮阳等功能。\nB项错误，台基是高出地面的建筑物底座，一大功能是防潮隔湿：高于室外地坪的基身，其主要部分是用多层夯土或夯土层与碎砖瓦石块层交互重叠、夯筑而成，这种做法可以有效地阻止地下水分的上升。防火功能主要通过其他建筑构件，如防火墙等实现。\nC项错误，藻井是天花向上凹进为穹窿状的部分，在历史演进中逐渐从实用性建筑构件转变为装饰性建筑构件，核心为装饰功能。且藻井的使用有着严格的等级规制，是传统礼制文化在建筑中的体现。窗户是建筑中最基本的通风和采光构件。\nD项正确，榫卯是在两个木构件上所采用的一种凹凸结合的连接方式。榫卯结构允许节点处的微小位移和变形，能有效耗散地震能量、缓冲地震冲击，从而大幅提升木构建筑的整体抗震性能。\n故正确答案为D。","no":32,"missingImage":false},{"type":"question","qid":"19526335","cat":"人文常识","stem":"某物流公司要优化长三角到乌鲁木齐的易腐货物运输路线，下列方案最可行的是：","options":{"A":"夏季采用陇海——兰新铁路运输利用沿线低温天气自然保鲜","B":"冬季选择长江——京杭大运河——黄河水运组合避开陆路交通拥堵","C":"春秋季采用铁路冷藏集装箱运输平衡运输成本与时效性","D":"全年优先使用连霍高速公路运输以追求最低的运输成本"},"answer":"C","explanation":"本题考查地理国情。\nA项错误，兰新铁路东起甘肃省兰州，跨红柳河进入新疆维吾尔自治区，在达坂城穿过天山至乌鲁木齐。兰新铁路东连陇海铁路，在兰州与包兰线交汇。陇海铁路是中国东西方向的主要铁路干线之一，起自江苏省北部的连云港，横贯江苏、安徽、河南、陕西、甘肃5省，至甘肃省省会兰州。此方案时间成本高，陇海线经过河南、陕西，兰新线穿越河西走廊、新疆戈壁，夏季高温，且长途运输车厢内极易积聚热量，不适合自然保鲜。故此方案不可行。\nB项错误，黄河干流冬季平均气温低于\u003cimg data-k=\"51748cf53c00\">，一般每年12月至次年3月为天然结冰期，船舶无法航行，且冬季黄河流域降水稀少、地表径流减少，进入枯水期后，下游河道水位显著下降，水位不足导致船舶搁浅风险极高。此方案耗时较长，且黄河水运无法直达乌鲁木齐，最终仍需衔接陆路，不能避开陆路交通拥堵。故此方案不可行。\nC项正确，冷藏集装箱是指一种有良好隔热，且能维持一定低温要求，适用于各类易腐食品的运送、贮存的特殊集装箱。故不管春秋季沿线温度变化，都能保持货物所需的低温环境，避免变质。此方案的时间成本小于水运、经济成本小于公路运输，且可以保证货物不变质。故此方案可行。\nD项错误，连云港—霍尔果斯高速公路，简称“连霍高速”，是中国境内连接江苏省连云港市和新疆维吾尔自治区伊犁哈萨克自治州的高速公路，全长4244公里，横贯我国中部。在长途、大批量货物运输中，公路运输的单位成本通常远高于铁路和水运。其次，公路运输受路况、天气影响大，时效不稳定，且货车冷藏需要持续供电，长途运输中若出现故障，货物容易变质，风险比铁路高。此方案的时间成本、经济成本都较高，且有货物腐坏变质等风险。故此方案不可行。\n故正确答案为C。","no":33,"missingImage":false},{"type":"question","qid":"19526345","cat":"人文常识","stem":"某款创意时钟要用不同的符号替代表盘上的数字，下列设计不合适的是：","options":{"A":"用45度角的正弦“\u003cimg data-k=\"975061ff9ac7\">”替代“1”","B":"用3的阶乘“\u003cimg data-k=\"13851955c324\">”替代“6”","C":"用重力加速度“g”替代“10”","D":"用二进制数“\u003cimg data-k=\"39e7778e43a4\">”替代“12”"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，\u003cimg data-k=\"e41e1c2dccab\">，与数字1的数值差异过大，不适合直接替代。若需用三角函数替代，可选择\u003cimg data-k=\"8fd80c994320\">（值为1）。‌\nB项正确，3的阶乘“\u003cimg data-k=\"13851955c324\">”等于3×2×1=6，与数字6完全匹配，可替代‌。\nC项正确，重力加速度\u003cimg data-k=\"3facf95db426\">，四舍五入后与10接近，可替代。\nD项正确，二进制数“\u003cimg data-k=\"39e7778e43a4\">”转换为十进制为1×8+1×4+0×2+0×1=12，数值对应准确，可替代。\n本题为选非题，故正确答案为A。","no":34,"missingImage":false},{"type":"question","qid":"19526242","cat":"人文常识","stem":"某学院要制作一款与爱因斯坦有关的纪念手提袋，下列哪项不适合用作印刷图案？","options":{"A":"F=ma","B":"光电效应","C":"\u003cimg data-k=\"0a9abde580cb\">","D":"引力是时空弯曲的效应"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，“F=ma”是牛顿第二定律，是牛顿经典力学的核心方程，描述“物体加速度与所受合外力成正比，与质量成反比”，由牛顿在《自然哲学的数学原理》中提出，并非爱因斯坦的科学贡献，不适合用作印刷图案。\nB项正确，“光电效应”是爱因斯坦的重要科研成果之一。1905年，爱因斯坦提出光量子假说，成功解释了光电效应现象，即光照射金属表面时会逸出电子，他也因此获得1921年诺贝尔物理学奖。该理论与爱因斯坦直接相关，适合作为纪念图案。\nC项正确，“\u003cimg data-k=\"0a9abde580cb\">”是质能方程，是爱因斯坦狭义相对论的核心推论，揭示了质量与能量的等价关系，是现代物理学的标志性公式，也是爱因斯坦最广为人知的科学贡献之一。该理论与爱因斯坦直接相关，适合作为纪念图案。\nD项正确，“引力是时空弯曲的效应”是爱因斯坦广义相对论的核心观点（1915年提出）。爱因斯坦颠覆了传统万有引力理论，提出引力的本质是质量或能量导致时空弯曲，物体沿弯曲时空的测地线运动。该理论与爱因斯坦直接相关，适合作为纪念图案。\n本题为选非题，故正确答案为A。","no":35,"missingImage":false}],"count":15,"answerable":15,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"19526291","cat":"逻辑填空","stem":"在技术的赋能下，检察机关在办理公益诉讼案件时如同拥有了顺风耳、千里眼，不仅能有效避免“            ”式的线索摸排，也能有力确保证据的客观性和准确性，办案将更加精准、规范、高效，国家利益和社会公共利益将得到更好守护，公平正义也将更加可感可触。\n填入画横线部分最恰当的一项是：","options":{"A":"刻舟求剑","B":"管中窥豹","C":"缘木求鱼","D":"大海捞针"},"answer":"D","explanation":"横线处搭配“线索摸排”且根据“在技术的赋能下，检察机关在办理公益诉讼案件时如同拥有了顺风耳、千里眼”以及横线前“能有效避免”可知，横线处与“顺风耳”“千里眼”所代表的高效、精准形成反义并列，应体现技术赋能前线索摸排的艰难和低效之意，D项“大海捞针”指在大海里捞一根针，比喻极难找到，符合文意，当选。\nA项“刻舟求剑”比喻办事刻板拘泥，不知根据实际情况处理问题，文段并非强调方法刻板，而是强调线索寻找过程的艰难，与文意不符，排除；B项“管中窥豹”指所见不全面，仅能体现线索摸排的不全面，不及D项还能体现出该项工作的困难，排除；C项“缘木求鱼”指爬到树上去找鱼，比喻方向或方法不对，不可能达到目的，与文意不符，排除。\n故正确答案为D。\n【文段出处】法治日报《技术赋能让公益诉讼提质增效》","no":36,"missingImage":false},{"type":"question","qid":"19526234","cat":"逻辑填空","stem":"在太空实验室开展的脑电测试实验中，航天员戴的“小红帽”叫作脑电帽，里面嵌入了众多微小的触头，它们像一群            的小侦探，精准捕捉大脑每一个微妙的波动。这顶帽子赋予航天员神奇的能力——无须言语，无须动作，仅仅通过思维就能给电脑下指令，操控各种设备。\n填入画横线部分最恰当的一项是：","options":{"A":"未卜先知","B":"明察秋毫","C":"洞若观火","D":"随机应变"},"answer":"B","explanation":"横线处形容“小侦探”，且根据后文“精准捕捉大脑每一个微妙的波动”可知，横线处应体现脑电帽中的微小触头能够精准捕捉大脑中的细微信号之意。B项“明察秋毫”形容人很精明，对很小的事情也能察看得清清楚楚，符合文意，当选。A项“未卜先知”指没有占卜便能事先知道，强调“预见性”；C项“洞若观火”指观察事物如同看火一样清楚，形容对事情的本质和发展趋势看得非常透彻明了，强调“看透本质”；D项“随机应变”指跟着情况的变化，掌握时机，灵活应付，强调“灵活性”，三者均无法体现“精准捕捉大脑中的细微信号”之意，排除。\n故正确答案为B。\n【文段出处】今日头条《绕地飞行的太空实验——探秘中国国家太空实验室》","no":37,"missingImage":false},{"type":"question","qid":"19526312","cat":"语句表达","stem":"2024年，我国脱贫县农民人均可支配收入增幅高于全国平均水平，脱贫人口务工就业规模保持稳中有增。2025年是巩固拓展脱贫攻坚成果同乡村振兴有效衔接5年过渡期的最后一年，越是这个时候，越要扛稳责任，            ，做好监测帮扶工作。\n填入画横线部分最恰当的一项是：","options":{"A":"步步为营","B":"行稳致远","C":"慎终如始","D":"绵绵用力"},"answer":"C","explanation":"根据横线前“2025年是巩固拓展脱贫攻坚成果同乡村振兴有效衔接5年过渡期的最后一年，越是这个时候，越要扛稳责任”及横线后“做好监测帮扶工作”可知，横线处所填词语意在表达在最后阶段要“扛稳”责任、“做好”工作，强调最后阶段应与初始阶段保持一致的工作态度。C项“慎终如始”指谨慎到最后，也像开始时一样，形容始终如一地谨慎从事，符合文意，当选。\nA项，“步步为营”指军队前进一步就设下一道营垒，形容行动谨慎，做事考虑周密，强调做事注重规划与落实，与文意不符，排除；\nB项，“行稳致远”指若想走得远，必须首先走得稳，强调兼顾当下的稳妥与长远的目标，而文段重在强调守住现有成果，并非强调长远发展，与文意不符，排除；\nD项，“绵绵用力”指连续不断地，长久坚持做某事，强调的是持续努力，与文意不符，排除。\n故正确答案为C。\n【文段出处】求是网《持续巩固拓展脱贫攻坚成果》","no":38,"missingImage":false},{"type":"question","qid":"19526292","cat":"逻辑填空","stem":"通用人工智能对重大情报的挖掘和精确预测，确实能够提高情报准确性，有利于减少误判；但有时也可能会使人类盲目自信，刺激其            。通用人工智能带来的进攻优势，导致最佳防御战略就是“            ”，这会打破进攻与防御的平衡，引发新型安全困境，反而增加了战争爆发的风险。\n依次填入画横线部分最恰当的一项是：","options":{"A":"孤注一掷 避实击虚","B":"轻举妄动 以攻为守","C":"刚愎自用 攻其不备","D":"铤而走险 先发制人"},"answer":"D","explanation":"第一空，根据“通用人工智能······可能会使人类盲目自信”可知，横线处所填成语应表达人类因盲目自信而导致的行为。A项“孤注一掷”比喻在危急时用尽所有力量作最后一次冒险，D项“铤而走险”指在无路可走的时候采取冒险行动，均符合文意，保留。B项“轻举妄动”指不经慎重考虑，轻率地采取行动，侧重草率行动，没有体现盲目自信，排除；C项“刚愎自用”指十分固执自信，不考虑别人的意见，侧重固执己见，多形容人的性格，无法与后文的“行为”构成对应，不符合文意，排除。\n第二空，根据“通用人工智能带来的进攻优势”以及“这会打破进攻与防御的平衡，引发新型安全困境，反而增加了战争爆发的风险”可知，横线处所填成语应体现采取“进攻”手段，可能挑起战争之意。D项“先发制人”指争取主动，先动手来制服对方，符合文意，当选。A项“避实击虚”指避开敌人的主力，找敌人的弱点进攻，侧重攻击对方弱点，未体现主动挑起战争之意，不符合文意，排除。\n故正确答案为D。\n【文段出处】解放军报《AGI带来的战争思考》","no":39,"missingImage":false},{"type":"question","qid":"19526314","cat":"逻辑填空","stem":"面对技术突破催生的新产品和新服务，市场响应往往具有          。在层出不穷的技术供给面前，市场选择是审慎、挑剔的，具有一定的随机性。对于一些技术虽然先进，但应用前景不明朗、难以迅速形成现金流的企业，市场通常会选择放弃。从这个角度看，瞪羚企业、独角兽企业都是经受住市场            的胜出者。\n依次填入画横线部分最恰当的一项是：","options":{"A":"滞后性 大浪淘沙","B":"差异性 精挑细选","C":"被动性 优胜劣汰","D":"模糊性 千锤百炼"},"answer":"A","explanation":"第一空，根据“在层出不穷的技术供给面前，市场选择是审慎、挑剔的”可知，横线处所填词语应体现市场对新产品和新服务的响应并不是快速的。A项“滞后性”指某个过程或现象发生后，才对之前的状况作出反应或调整，符合文意，保留。B项“差异性”指不同对象之间有差别，C项“被动性”指受外力推动才行动，D项“模糊性”指不清晰，文段强调市场对新产品和新服务并非立即跟随，均与文意不符，排除。\n第二空，代入验证，根据“应用前景不明朗、难以迅速形成现金流的企业，市场通常会选择放弃”可知，横线处成语应表达瞪羚企业、独角兽企业经受住了市场的考验和筛选，A项“大浪淘沙”比喻在激烈的斗争中经受考验、筛选，符合文意，当选。\n故正确答案为A。\n【文段出处】中国社会科学网《独角兽企业培育的三重逻辑》","no":40,"missingImage":false},{"type":"question","qid":"19526300","cat":"逻辑填空","stem":"把握好动静之度，是解决问题的关键。过度求静易陷入消极懈怠、            的泥潭。在面对新问题时，往往会因为害怕承担责任或者担心打破现有秩序，一味地观望等待，致使问题越积越多。相反，情况不明时过于求动会让很多事情变得杂乱无章，往往            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"安于现状  分身乏术","B":"固步自封   事与愿违","C":"裹足不前  措手不及","D":"自暴自弃  适得其反"},"answer":"B","explanation":"第一空，根据“、”可知，横线处和“消极懈怠”构成并列，且根据“往往会因为害怕承担责任或者担心打破现有秩序，一味地观望等待”可知，横线处应体现因过度求静而停滞不前之意，A项“安于现状”指对当前状况习惯而不愿改变，B项“固步自封”比喻守着老一套，不求进步，C项“裹足不前”比喻有所顾忌，不愿去做，均符合文意，保留。D项“自暴自弃”指自己瞧不起自己，甘于落后或堕落，侧重于自我放弃，与文意不符，排除。\n第二空，根据“情况不明时过于求动会让很多事情变得杂乱无章”可知，横线处应体现过于求动会带来不利结果，达不到预期之意，B项“事与愿违”指事情的发展跟主观愿望相反，符合文意，当选。A项“分身乏术”形容非常繁忙，无法兼顾他事，文段并非表达事务的繁忙，而是强调处理事情做法不当而带来的消极结果，与文意不符，排除；C项“措手不及”形容事出意外或太突然，来不及应付处理，文段并非表达事出突然，而是强调情况不明时过于求动会让事情变糟，与文意不符，排除。\n故正确答案为B。\n【文段出处】解放军报《把握好动静之度》","no":41,"missingImage":false},{"type":"question","qid":"19526240","cat":"逻辑填空","stem":"五彩滩是一处著名的雅丹地貌景观，位于新疆维吾尔自治区，中国唯一一条注入北冰洋的河流额尔齐斯河穿其而过。南岸有绿洲、沙漠，北岸则是            的泥岩、砂岩及砂砾组成的奇石怪岩，这两种            的地貌遥相辉映，“一河隔两岸，胜似两重天”。\n依次填入画横线部分最恰当的一项是：","options":{"A":"鳞次栉比  大相径庭","B":"千姿百态  别具一格","C":"色彩斑斓  截然不同","D":"绚丽多姿  各有千秋"},"answer":"C","explanation":"第一空，根据“五彩滩是一处著名的雅丹地貌景观”“北岸则是······泥岩、砂岩及砂砾组成的奇石怪岩”可知，横线处要体现出五彩滩的“多彩”特点，C项“色彩斑斓”指颜色绚丽多彩，D项“绚丽多姿”指色彩华丽灿烂、形态或风貌丰富多样，均符合文意，保留。A项“鳞次栉比”指像鱼鳞和梳子的齿一样，一个挨着一个地排列着，多形容房屋等密集，B项“千姿百态”形容姿态多种多样，各不相同，均与文意不符，排除。\n第二空，根据“南岸有绿洲、沙漠，北岸则是······的泥岩、砂岩及砂砾组成的奇石怪岩”“一河隔两岸，胜似两重天”可知，横线处要体现出南北两岸风貌差距极大，C项“截然不同”形容两种事物没有一点共同之处，符合文意，当选。D项“各有千秋”指各有各的存在价值，各有所长，各有优点，与文意不符，且用法错误，可以表达为“两种地貌各有千秋”，排除。\n故正确答案为C。\n【文段出处】中国国家地理《布尔津五彩滩——“一河隔两岸，胜似两重天”》","no":42,"missingImage":false},{"type":"question","qid":"19526241","cat":"逻辑填空","stem":"面对新的形势和要求，必须进一步全面深化改革，继续完善各方面制度机制，因而制度建设的任务更为繁重艰巨，加强顶层设计更为重要。如果不能全景式俯瞰和把握制度建设全局，采取总体构想和战略谋划，做到胸中有数，            地层层系统设计，难免顾此失彼、            ，无法取得制度建设的成效。\n依次填入画横线部分最恰当的一项是：","options":{"A":"抽丝剥茧 捉襟见肘","B":"循序渐进 进退维谷","C":"由表及里 得不偿失","D":"自上而下 左支右绌"},"answer":"D","explanation":"本题可从第二空入手，根据横线前“、”可知，横线处与“顾此失彼”构成近义并列，需体现应付不了之意，A项“捉襟见肘”比喻顾此失彼，应付不过来，D项“左支右绌”指力量不足，应付了这一方面，那一方面又有了问题，均与文意相符，保留。B项“进退维谷”形容处于进退两难的困境，C项“得不偿失”指得到的抵不上失去的，均与文意无关，排除。\n第一空，根据“加强顶层设计更为重要”“如果不能全景式俯瞰和把握制度建设全局，采取总体构想和战略谋划，做到胸中有数”“层层系统设计”可知，横线处需体现从全局逐步向下推进之意，D项“自上而下”意为从上到下，与文意相符，当选。A项“抽丝剥茧”形容对事物进行细致入微、层次分明的分析，强调由表及里逐步探究本质的思维方式，与文意无关，排除。\n故正确答案为D。\n【文段出处】中国社会科学报《制度建设：明晰思路、建构体系和优势转化》","no":43,"missingImage":false},{"type":"question","qid":"19526267","cat":"逻辑填空","stem":"未来特战力量可通过智能辅助，直接干扰或控制敌方指挥控制系统，造成敌方思想混乱、心理受挫甚至出现幻觉；或者通过伴随无人平台实施网络作战，篡改指控系统指令和数据实现“            ”，致使敌方指挥失灵、协同失效、人员失能，            地失去战斗力，从而实现“不战而屈人之兵”。\n依次填入画横线部分最恰当的一项是：","options":{"A":"移花接木 彻头彻尾","B":"釜底抽薪 无声无息","C":"暗度陈仓 潜移默化","D":"反客为主 浑然不觉"},"answer":"B","explanation":"第一空，根据“通过伴随无人平台实施网络作战，篡改指控系统指令和数据实现‘            ’”“致使敌方指挥失灵、协同失效、人员失能，            地失去战斗力，从而实现‘不战而屈人之兵’”可知，横线处应表达通过篡改指令和数据，彻底使敌方丧失战斗能力之意。B项“釜底抽薪”比喻从根本上解决问题，此处指从根本上使敌方指挥系统失效，符合文意，保留。A项“移花接木”比喻使用手段暗中更换，虽与“篡改”相关，但更侧重“替换”而非“根本性破坏”，与后文“致使敌方指挥失灵、协同失效、人员失能”这种彻底瓦解战斗力的语境相比，程度不足，排除；C项“暗度陈仓”强调用假象迷惑对方、暗中行动，文段未提及迷惑性假象，排除；D项“反客为主”指变被动为主动，与篡改指令的语义关联不强，排除。\n第二空，代入验证。B项“无声无息”比喻没什么动静，与“不战而屈人之兵”相呼应，体现让敌人在毫无察觉中丧失战斗力，符合智能作战和网络攻击的特点，当选。\n故正确答案为B。\n【文段出处】解放军报《试析未来特种作战行动样式》","no":44,"missingImage":false},{"type":"question","qid":"19526322","cat":"逻辑填空","stem":"对于不符合著作权法、专利法、商标法等专门法保护条件的创新成果，反不正当竞争法为其提供了        保护。面对数字时代            的新型不正当竞争行为，反不正当竞争法通过一般条款的灵活解释和适用，能够及时规制尚未被其他专门法        的知识产权侵权行为，防止创新成果被不正当使用。\n依次填入画横线部分最恰当的一项是：","options":{"A":"补充  层出不穷  覆盖","B":"特殊  屡见不鲜  界定","C":"升级  五花八门  收录","D":"额外  应运而生  明确"},"answer":"A","explanation":"第一空，根据“反不正当竞争法通过······能够及时规制尚未被其他专门法······的知识产权侵权行为，防止创新成果被不正当使用”可知，反不正当竞争法可以对专门法保护不到的创新成果进行保护，故横线处应体现出反不正当竞争法能弥补其他专门法的不足之意。A项“补充”指原来不足或有损失时，增加一部分，D项“额外”指超出规定数量或范围，强调规定份额之外的，均符合文意，保留。B项“特殊”指不同于同类的事物或不同的情况，强调特殊性，与文意不符，排除；C项“升级”指从较低的等级或班级升到较高的等级或班级，强调等级升高，与文意不符，排除。\n第二空，根据“面对数字时代······的新型不正当竞争行为”可知，横线处应体现数字时代不断出现各种不正当竞争行为之意。A项“层出不穷”指接连不断地出现，没有穷尽，符合文意，保留。D项“应运而生”指顺应某种时机、条件、需要等而产生，常用于积极语境中，与“不正当竞争行为”这一消极话题搭配不当，排除。\n第三空，代入验证，根据“反不正当竞争法通过一般条款的灵活解释和适用，能够及时规制尚未被其他专门法······的知识产权侵权行为”可知，这些行为是专门法没涵盖、未涉及到的。A项“覆盖”指遮盖，符合文意，当选。\n故正确答案为A。\n【文段出处】《加强知识产权保护 繁荣发展数字文化产业》","no":45,"missingImage":false},{"type":"question","qid":"19526307","cat":"逻辑填空","stem":"中生代寄生蠕虫的化石数量并不稀少，但由于其地质年代相较于寒武纪、奥陶纪等更年轻，常被认为难以        深层次的生物演化奥秘。其次，这些蠕虫往往体型微小，化石保存状况不佳。再者，它们形态单调、特征        ，使得分类鉴定难度极高。因此，中生代寄生蠕虫的相关研究仍然            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"阐释 相似 凤毛麟角","B":"蕴含 泛化 停滞不前","C":"探寻 统一 无从下手","D":"揭示 模糊 屈指可数"},"answer":"D","explanation":"第一空，根据横线前“由于其地质年代相较于寒武纪、奥陶纪等更年轻”可知，横线处所填词语应表达由于中生代寄生蠕虫的地质年代较年轻，难以通过其化石探明深层次的生物演化奥秘之意。A项“阐释”指通过说明、陈述对事物进行深入解释，C项“探寻”指探求，寻找，D项“揭示”指使人看见原来不容易看出的事物，均符合文意，保留。B项“蕴含”指包含，文段此处意在强调难以通过化石了解奥秘，而非化石本身难以“包含”奥秘，与文意不符，排除。\n第二空，根据横线后“使得分类鉴定难度极高”可知，横线处所填词语应表达特征不清晰之意。A项“相似”指相像，特征相像也可能导致鉴定难，C项“统一”指整体的，一致的，无差别的，D项“模糊”指不分明，不清楚，均符合文意，保留。\n第三空，根据前文“地质年代······更年轻”“化石保存状况不佳”“分类鉴定难”的多重原因可知，横线处所填成语应表达中生代寄生蠕虫的相关研究数量很少之意。D项“屈指可数”指数量少，符合文意，当选。A项“凤毛麟角”比喻珍贵稀有的人才或事物，文段并未体现研究很珍贵之意，且与“相关研究”搭配不当，排除；C项“无从下手”指事物头绪繁复导致无法找到处理途径，置于此处程度太重，排除。\n故正确答案为D。\n【文段出处】科学大院-《采到一块神秘的化石，7年后才知道是什么》","no":46,"missingImage":false},{"type":"question","qid":"19526287","cat":"逻辑填空","stem":"发展新质生产力不能简单理解为        传统产业，它与发展传统产业并不矛盾。一方面，传统产业平稳发展在稳就业、稳增长等方面具有不可替代的作用；另一方面，传统产业不仅对战略性新兴产业和未来产业发展有          的支撑作用，而且可以转化为新兴产业，通过科技赋能，成为新质生产力的重要        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"取代\t  持续性\t  依托","B":"摒弃\t  系统性\t  抓手","C":"淘汰\t  基础性\t  载体","D":"削弱\t  根本性\t  源头"},"answer":"C","explanation":"本题从第二空入手。根据横线后“支撑作用”和前文“发展新质生产力不能简单理解为          传统产业，它与发展传统产业并不矛盾”“具有不可替代的作用”可知，横线处应表示传统产业对新兴产业和未来产业发展起到支撑作用的核心属性。C项“基础性”强调支撑的根基地位，突出不可或缺的前提价值，D项“根本性”侧重体现支撑作用的重要性，二者均能精准契合“支撑”的核心内涵，均符合文意，保留。A项“持续性”强调时间上的连续不断，文中并未突出传统产业对新兴产业和未来产业的支撑作用在时间上的连续性，与文意不符，排除；B项“系统性”侧重整体联动、有组织的体系化特征，文段未提及传统产业的支撑是“整体联动、有组织”的，与文意不符，排除。\n第三空，根据“传统产业不仅对战略性新兴产业和未来产业发展有        支撑作用，而且可以转化为新兴产业，通过科技赋能，成为新质生产力的重要······”可知，横线处应表示传统产业通过科技赋能对新质生产力所发挥的作用。C项“载体”指能传递能量或运载其他物质的物体，置于此处可体现传统产业通过科技赋能成为新质生产力的重要载体，即传统产业作为一种承载新质生产力的形式，符合文意，保留。D项“源头”指事物的根源、起始点，文段强调传统产业通过科技赋能后参与新质生产力构建，而非作为新质生产力的起源，与文意不符，排除。\n第一空，代入验证。C项“淘汰”有使不适应发展的事物去除之意，填入横线处可表示不能片面地认为因为发展新质生产力就将传统产业去除，与后文“它与发展传统产业并不矛盾”相呼应，符合文意，当选。\n故正确答案为C。\n【文段出处】湖南日报《新质生产力怎么“上新”》","no":47,"missingImage":false},{"type":"question","qid":"19526293","cat":"逻辑填空","stem":"敢于正视问题的反面是回避矛盾、            ，个别表现在：发言提纲套用、借用、翻用，发言内容偏离主题、不及重点，            、似曾相识，剖析问题避重就轻、            ，相互批评官话、套话······凡此种种，致使民主生活会的批评和自我批评有形式而无实质内容和效果，必须防止和纠正。\n依次填入画横线部分最恰当的一项是：","options":{"A":"敷衍了事 老生常谈 隔靴搔痒","B":"虚与委蛇 长篇大论 大而化之","C":"畏首畏尾 陈词滥调 浮光掠影","D":"闪烁其词 不痛不痒 张冠李戴"},"answer":"A","explanation":"第一空，根据“、”以及“个别表现在：发言提纲套用、借用、翻用，发言内容偏离主题、不及重点······相互批评官话、套话”可知，横线处与“回避矛盾”形成并列关系，表达不负责、不直面问题之意。A项“敷衍了事”指办事马马虎虎，只求应付过去就算完事，D项“闪烁其词”指言语遮遮掩掩，吞吞吐吐，侧重于说话不明确，可体现回避矛盾不直说之意，均符合文意，保留。B项“虚与委蛇”指对人虚情假意，敷衍应酬，虽有敷衍之意，但侧重于对人的态度，而非做事的态度，与文意不符，排除；C项“畏首畏尾”形容胆子小，疑虑重重，侧重于胆小，与文意无关，排除。\n第二空，根据“、”可知，横线处与“似曾相识”形成并列关系，体现发言内容没有新意之意。A项“老生常谈”比喻人们听惯了的没有新鲜意思的话，符合文意，保留。D项“不痛不痒”比喻言行没有切中要害，不解决实际问题，与文意不符，排除。\n第三空，代入验证。根据“、”可知，横线处与“避重就轻”形成并列关系，体现剖析问题找不到关键之意。A项“隔靴搔痒”比喻说话、作文等不中肯，没有抓住问题的关键，符合文意，当选。\n故正确答案为A。\n【文段出处】中国纪检监察报《方圆谈｜“用好批评和自我批评的武器”⑤敢于正视 主动改正》","no":48,"missingImage":false},{"type":"question","qid":"19526330","cat":"逻辑填空","stem":"作风建设无小事，廉洁自律的考验往往藏在“生活圈”“社交圈”的细微处。年轻干部必须以“            ”的清醒系紧“风纪扣”，在公私界限上            ，在校准坐标中涵养浩然之气。一些年轻干部的案例警示我们，许多违纪违法行为的        ，正是对“微特权”“小官僚”习以为常的麻木。\n依次填入画横线部分最恰当的一项是：","options":{"A":"常备不懈 一丝不苟 征兆","B":"如履薄冰 寸步不让 起点","C":"严阵以待 锱铢必较 端倪","D":"谨小慎微 壁垒分明 倾向"},"answer":"B","explanation":"第一空，根据“作风建设无小事，廉洁自律的考验往往藏在‘生活圈’‘社交圈’的细微处”可知，横线处应体现年轻干部对待小事、细微之事时要保证时刻清醒之意，A项“常备不懈”指时刻准备且毫不松懈，B项“如履薄冰”指好像踩在薄冰上，形容谨慎戒惧，D项“谨小慎微”指对待细微的事情也采取谨慎小心的态度，均能体现出对待小事、细微之事时保持清醒之意，符合文意，保留。C项“严阵以待”指摆好严整的阵势，等待来犯的敌人，语气较重，多用于应对具体威胁，与作风建设长期警惕的语境不完全匹配，排除。\n第二空，搭配“公私界限”，且根据“······的清醒系紧‘风纪扣’”“在校准坐标中涵养浩然之气”可知，横线处应体现公事和私事的界限很分明之意，B项“寸步不让”指丝毫不肯让步或妥协，能够体现出将公事与私事区分开之意，表示严格划分、坚决守住，符合文意，保留。A项“一丝不苟”指连最细微的地方也不马虎，形容办事认真，与“界限”搭配不如“寸步不让”能够直接体现坚守，排除；D项“壁垒分明”指界限非常清楚，能够体现出公事与私事有界限之意，但多用于不同阵营或观点对立，与“公私界限”的坚守行动相比稍显静态，不如“寸步不让”主动，排除。\n第三空，代入验证，根据“一些年轻干部的案例警示我们”与“正是对‘微特权’‘小官僚’习以为常的麻木”可知，文段强调对“微特权”“小官僚”的习以为常，会使得违法乱纪行为出现，故横线处应体现出现之意，B项“起点”指开始的地方或时间，符合文意，当选。\n故正确答案为B。\n【文段出处】人民日报《拧紧作风“总开关” 锻造清廉“生力军”（思想纵横）》","no":49,"missingImage":false},{"type":"question","qid":"19526320","cat":"逻辑填空","stem":"进一步全面深化司法改革，必须聚焦改革的本质要求，严格依法依规推进改革，所有履职都要立足宪法法律赋权，        职能边界，不脱离法院职能，不超越法院职权，更不能            ，确保改革不偏离正确方向。积极发挥法治对改革的引导、推动、规范、        作用，确保重大改革依法有序、于法有据，增强改革的执行力、穿透力。\n依次填入画横线部分最恰当的一项是：","options":{"A":"遵循 各自为政 监督","B":"划定 为所欲为 震慑","C":"厘清 画地为牢 约束","D":"恪守 越俎代庖 保障"},"answer":"D","explanation":"第一空，搭配“边界”，B项“划定”指经划分后固定或确定界限的行为，C项“厘清”指梳理清楚，D项“恪守”指严格遵守，均与“边界”搭配恰当，保留。A项“遵循”指遵照，常搭配“方法”“规则”等，与“边界”搭配不当，排除。\n第二空，根据“更”可知，横线处与“超越法院职权”构成递进关系，应体现超越职权之意，且程度更重，D项“越俎代庖”比喻超出自己业务范围去处理别人所管的事，置于此处可体现越权并付诸行动之意，符合文意，保留。B项“为所欲为”指很随意地想干什么就干什么，C项“画地为牢”比喻只许在规定好的范围内活动，均不能与前文构成递进关系，排除。\n第三空，代入验证，D项“保障”指保护（权利、生命、财产等）使不受侵害，与“作用”搭配恰当，当选。\n故正确答案为D。\n【文段出处】法制日报《进一步全面深化司法改革 加快推进中国式法治现代化》","no":50,"missingImage":false},{"type":"question","qid":"19526302","cat":"语句表达","stem":"何为担当作为？从字面上看，担当作为就是承担起应尽的责任和义务，发挥出应有的能力和能量，创造出应然的成绩和实效；从辩证法看，担当是作为的前提和基础，作为是担当的体现和成效，二者相辅相成。习近平总书记强调：“                    。”事业发展不可能一帆风顺，做事总有风险，因此才需要担当。有时候越怕事越容易出事，越想绕道走矛盾就越堵着道。只有敢于担当，豁得出去、敢闯敢干，矛盾和困难才可能得到解决。\n填入画横线部分最恰当的一项是：","options":{"A":"担当作为就要真抓实干、埋头苦干，决不能坐而论道、光说不练","B":"党把干部放在各个岗位上是要大家担当干事，而不是做官享福","C":"担当和作为是一体的，不作为就是不担当，有作为就要有担当","D":"如果不担当、不作为，没有执行力、战斗力，那是要打败仗的"},"answer":"C","explanation":"横线出现在文段中间，需结合前后文进行分析。横线前引出“担当作为”的话题，从“字面”和“辩证法”两个角度论述“担当”与“作为”辩证统一的关系，横线后指出事业发展有风险需要担当，只有敢于担当才能解决矛盾。结合横线前后文内容可知，横线处既要承接前文“担当”与“作为”的辩证统一关系，又要能引出后文所论述的“需要担当”，C项“担当和作为是一体的，不作为就是不担当，有作为就要有担当”直接点明担当与作为的同一性，与前文“担当是作为的前提，作为是担当的体现”紧密呼应，且自然引出后文“才需要担当”的论述，衔接恰当，当选。\nA项，强调“真抓实干、埋头苦干”，与前后文“辩证关系”和“风险矛盾”话题衔接不紧密，排除；\nB项，强调干部要担当干事，未体现“作为”与“担当”的关系，无法承接前文，排除；\nD项，强调不担当、不作为的后果，未体现出二者之间的关系，且后文与“打败仗”无关，排除。\n故正确答案为C。\n【文段出处】人民日报《让担当作为蔚然成风（思想纵横）》","no":51,"missingImage":false},{"type":"question","qid":"19526317","cat":"片段阅读","stem":"生态保护修复工程的人工修复工程投资和建设周期一般为3到5年，而高寒地区生态群落完成自然演替往往需要几十年乃至更长的时间。以拉萨河流域山水林田湖草生态保护修复试点工程为例，在工程验收时植被覆盖度显著增加，但群落自然演替尚未完成，生态系统的稳定性仍然较低。由于现有生态修复工程的相关投资多用于工程实施周期内，工程周期结束后大多依靠高寒生态系统自然恢复，在管护力度不足的情况下，生态系统容易发生再次退化，威胁生态修复工程效益的长期可持续性。\n这段文字意在说明，高寒地区生态系统修复工程要：","options":{"A":"保障后期管护与可持续性","B":"充分发挥系统的内在恢复能力","C":"科学规划投资和建设周期","D":"强调验收流程的规范性与科学性"},"answer":"A","explanation":"文段开篇指出生态保护修复工程的人工修复周期较短，而高寒地区生态群落的自然演替需要几十年甚至更长时间，二者存在明显的时间差。接着以拉萨河流域生态保护修复试点工程为例，以工程验收时生态系统仍不稳定详细阐述首句体现的这种时间差。随后进一步指出，现有工程投资多用于施工期，后期若管护不足易导致退化，威胁长期效益。因此，文段通过层层铺垫，最终落脚于工程周期结束后因管护不足导致的退化风险，意在强调高寒地区生态修复工程必须重视后期管护，以保障长期可持续性，对应A项。\nB项，“充分发挥系统的内在恢复能力”与文意相悖，文段指出仅依靠生态系统自然恢复容易导致再次退化，因此需要加强人工管护，而非仅依赖系统内在恢复能力，排除；\nC项，“科学规划投资和建设周期”偏离文段重点，文段强调工程结束后的管护问题，而非前期规划，排除；\nD项，“强调验收流程的规范性与科学性”文段未提及，属于无中生有，排除。\n故正确答案为A。\n【文段出处】中国科学院院刊《基于自然的青藏高原一体化生态保护修复优化管理》","no":52,"missingImage":false},{"type":"question","qid":"19526310","cat":"片段阅读","stem":"条叶庭荠和四齿芥是沙漠中常见的两种短命植物，其新成熟种子具有生理休眠特性，传播后的种子能在夏季高温中通过后熟作用，进入非休眠状态，随后在秋季土壤湿度适宜时萌发。未能在秋季萌发的种子，则会在冬季重新休眠。在早春湿润的雪融期，部分种子通过低温层积作用再次结束休眠，在早春季节萌发。这种一年两次的休眠循环机制使其能在一年内形成两个不同的萌发幼苗群体。这种适应策略可能是植物长期适应荒漠降水和温度胁迫生境的一种“两头下注”策略，有助于它们在极端环境下的维持和繁衍。\n“‘两头下注’策略”指的是：","options":{"A":"一年中在不同季节发生两次休眠","B":"在休眠与非休眠状态间随机切换","C":"形成两个环境适应性不同的幼苗群体","D":"能同时应对降水和温度两种极端环境"},"answer":"C","explanation":"本题为词句理解题，“‘两头下注’策略”位于文段结尾，需结合前文内容进行理解。前文指出，条叶庭荠和四齿芥的种子在一年内通过秋季和早春两次萌发机会，形成两个不同的萌发幼苗群体，这种机制是植物长期适应荒漠环境的一种策略，有助于在极端环境下维持和繁衍。因此，“两头下注”策略指的是植物为应对环境不确定性，在不同季节安排萌发，从而形成两个幼苗群体以增加生存几率的适应方式，对应C项。\nA项，“两次休眠”偏离重点，文段强调的是萌发时机的分化，而非休眠次数，排除；\nB项，“随机切换”表述错误，休眠与萌发的转换是有条件的规律性过程，并非随机，排除；\nD项，“能同时应对降水和温度两种极端环境”更类似于这一策略所要达到的目的或效果，不是对“‘两头下注’策略”的直接解释，并且文段中“‘两头下注’策略”是针对不同季节的萌发机会分配，并非直接同时应对“降水”和“温度”两种环境，排除。\n故正确答案为C。\n【文段出处】中国科学院植物研究所植被与环境变化重点实验室网《植物所黄振英研究组在荒漠短命植物土壤种子休眠循环机制研究中取得新进展》","no":53,"missingImage":false},{"type":"question","qid":"19526301","cat":"片段阅读","stem":"随着人工智能时代的到来，“未来人”和“远方的陌生人”问题逐渐进入人类的伦理视界。传统伦理学是“近的伦理学”，强调人与人之间的直接交往，行为双方是熟悉的、共同在场的，道德时空是近距离的。科技深度介入使人类的道德空间和行为性质发生改变，一些新的对象（如人工智能）逐渐进入我们为之负责和道德关切的领域。人工智能作为新科技，给人类的伦理世界和道德空间带来了深刻变革，它以虚拟化和拟人化的方式与人类建立了新的交往关系，伦理关系从“人与人”“人与动物”“人与自然”扩展到“人与人工智能”。\n这段文字接下来最可能介绍：","options":{"A":"未来人工智能技术的发展趋势","B":"影响人类道德空间的技术因素","C":"人工智能时代人际交往模式的新变化","D":"人工智能带来的伦理挑战和道德困境"},"answer":"D","explanation":"文段开篇介绍在人工智能时代的大背景下，一些问题进入伦理视界，接着指出传统伦理学是近距离的、熟悉的直接交往，科技的深度介入使人工智能逐渐进入到我们为之负责和道德关切的领域。最后强调人工智能给人类的伦理世界和道德空间带来深刻变革，伦理关系从原来的“人与人”“人与动物”“人与自然”扩展到“人与人工智能”。故文段最后介绍的是人工智能给伦理世界和道德空间带来变革，接下来应继续围绕这一话题展开，对应D项。\nA、C两项，均仅提及“人工智能”，未提及“伦理和道德”，偏离文段最后谈论的核心话题，衔接不当，排除；\nB项，“技术因素”范围扩大，且未提及“伦理和道德”，偏离文段最后谈论的核心话题，衔接不当，排除。\n故正确答案为D。\n【文段出处】光明日报《构建负责任人工智能治理体系的伦理路》","no":54,"missingImage":false},{"type":"question","qid":"19526304","cat":"片段阅读","stem":"随着我国城镇化率逐步提高，城市已经成为人口集聚的主要空间。要实现智慧城市的发展目标，必须紧跟新一代数字技术发展趋势，找准数字技术融入市域社会治理的“小切口”，促进两者深度融合。可建设区、街、社（村）三层结构的数智化基层治理平台，覆盖社区治理全域组织工作场景，有效破解基层治理“小马拉大车”的突出问题。通过建设数智化基层治理平台，加快实现市域社会管理手段、管理模式、管理理念创新，推动城市治理和运行从数字化到智能化再到智慧化的转型升级。\n最适合做这段文字标题的是：","options":{"A":"变“治理”为“智理”，提升城市智治水平","B":"从“数字”到“数智”，打造基层治理平台","C":"数字技术：提升基层治理的新手段","D":"基层治理：从末梢发力向智慧升级"},"answer":"A","explanation":"文段开篇交代背景，即我国城镇化率提高，城市成为人口集聚的主要空间。随后指出要实现智慧城市发展目标，需紧跟新一代数字技术发展趋势，让数字技术与市域社会治理相融合。后文给出明确对策，即建设区、街、社（村）三层结构的数智化基层治理平台。尾句进一步强调，该平台可推动城市治理实现从数字化到智能化再到智慧化的转型升级。故文段重点在对策部分，强调通过建设数智化基层治理平台可以实现城市治理的智慧化转型升级，A项精准概括了文段从“治理手段创新”到“智慧化升级”的核心脉络，其中“智理”一词巧妙呼应“智慧治理”，形象贴切，契合主旨，当选。 \nB项，“打造基层治理平台”表述片面，文段的落脚点不仅仅是“打造平台”，而是通过这个平台实现城市治理的智慧化转型升级，排除；\nC项，“数字技术”表述不明确，未体现“数智化平台”与“城市治理智慧化”之间的关系，排除；\nD项，“基层治理”概念偷换，且未表明“数智化”，排除。\n故正确答案为A。\n【文段出处】光明日报《市域管理：变“治理”为“智理”》","no":55,"missingImage":false},{"type":"question","qid":"19526289","cat":"语句表达","stem":"①原子时能够满足对时间间隔均匀性的要求，但它的时刻却没有具体的物理含义\n②它是采用原子时的秒长，利用原子时的均匀性，通过闰秒，保证时刻与世界时在一定程度相符的时间尺度\n③世界时的时刻对应太阳在天空中的特定位置，反映地球在空间旋转时自转的角度和地轴方位\n④1972年，国际上规定“协调世界时”成为新的国际标准时间，并沿用至今\n⑤因此，为了兼顾人们对时刻和时间间隔的测量应用需要，定义了“协调世界时”\n⑥但是地球自转不均匀等特性，使得世界时的秒长大致呈逐年变长的趋势\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"④③①⑥②⑤","B":"④①⑤③②⑥","C":"③⑥①⑤②④","D":"③①②⑥⑤④"},"answer":"C","explanation":"对比选项，确定首句。③句介绍世界时的定义和特点，④句讲述1972年“协调世界时”成为国际标准时间，均可以作为首句，不好判断。\n继续寻找其他线索，发现⑤句出现结论词“因此”，并指出为了兼顾人们对时刻和时间间隔的需要，定义了“协调世界时”，故⑤句前应指出为何要定义协调世界时的相关内容，⑤句前有①句、②句、⑥句，①句介绍“原子时能够满足对时间间隔均匀性的要求，但它的时刻却没有具体的物理含义”的缺陷，可与⑤句构成因果关系，保留B、C两项。②句介绍了一种新的时间尺度，⑥句仅指出世界时的秒长大致呈逐年变长的趋势，均无法与⑤句构成因果关系，排除A、D两项。\n继续寻找其他线索，发现⑥句出现转折词“但是”，指出地球自转不均匀等特性使得世界时的秒长逐年变长，故可利用转折词捆绑解题，⑥句前有②句和③句，③句指出世界时反映地球在空间旋转时自转的角度和地轴方位，与⑥句话题一致，且符合转折关系，对应C项。②句介绍了协调世界时的原理，与⑥句内容无关，无法构成转折关系，排除B项。\n故正确答案为C。\n【文段出处】人民日报《准时，究竟以何为准（唠“科”）》","no":56,"missingImage":false},{"type":"question","qid":"19526273","cat":"语句表达","stem":"①它的形成过程与火星上的风力、风向等因素密切相关，是科学家研究火星气候特征的重要对象，可以帮助人们推测火星的古气候环境\n②火星上常年风沙肆虐，岩土遍布，形成了许多不同形态的风沙地貌\n③更有趣的是，火星上横向风成脊的两翼方向指向南方——只有在北风之下才能形成这样的形态\n④科学家通过计算祝融号着陆区横向风成脊的脊线、顺风剖面和风成床的形态特征，惊喜地发现，其与地球上存在的巨型沙波纹形态参数较为相似\n⑤综合祝融号测量到的火星风场信息，我们可以推断，火星上古时期也许时常刮起北风\n⑥在祝融号的着陆区中，有一种典型的风沙地貌——横向风成脊\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"⑥②①③④⑤","B":"⑥④③②⑤①","C":"②④⑤⑥③①","D":"②⑥①④③⑤"},"answer":"D","explanation":"对比选项，确定首句。②句介绍火星上有多种不同形态的风沙地貌，⑥句具体论述祝融号着陆区的一种典型的风沙地貌，按照逻辑顺序应先提出观点，再通过例子进行解释说明，故②句应在⑥句之前，②句更适合作为首句，排除A、B两项。\n对比C、D两项，②句后所接句子分别为④句和⑥句，⑥句引出横向风成脊的话题，④句介绍科学家计算横向风成脊的脊线、顺风剖面和风成床的形态特征，并有所发现，按照逻辑顺序，应先提出话题，再具体论述，故⑥句应在④句之前，排除C项，锁定D项。\n故正确答案为D。\n【文段出处】学习强国《每日科普|询天问火 火星回答了我们什么？》","no":57,"missingImage":false},{"type":"question","qid":"19526258","cat":"语句表达","stem":"液晶显示器是一种光偏振调制的显示器件。当白光光源射入显示器时，通过入射偏振片，自然光被转换为线偏振光。未施加外来电场时，入射偏振光会顺着液晶分子的排列旋转前进，在正常黑色操作模式下，偏振光被出射偏振片阻挡并吸收，显示器画面呈现暗态；当施加电压时，液晶分子倾向平行于施加电场的方向，线偏振光直接到达出射偏振片，由于入射偏振光的偏振状态不受此液晶分子的影响，并保持与出射偏振片穿透轴方向一致，故能通过出射偏振片形成亮态。所以                    。\n填入画横线部分最恰当的一项是：","options":{"A":"电场不够强时显示器呈半透明的中间灰度状态","B":"利用适当驱动电压即可得到明暗对比的显示效果","C":"液晶分子的旋转作用可以有效控制光线的穿透","D":"站在不同视角看显示屏时显示效果会有很大差异"},"answer":"B","explanation":"横线位于文段结尾，且横线前出现结论词“所以”，故需对前文内容进行总结。文段开篇介绍液晶显示器是光偏振调制显示器件，并指出自然光通过入射偏振片会变为线偏振光，后文通过分号引导的并列结构介绍施加或不施加电压可以控制液晶分子的倾向，从而影响线偏振光的通过与否，实现暗态和亮态的显示。故横线处应总结前文，强调利用适当的驱动电压可以控制光的通过情况，形成明暗对比的显示效果，对应B项。\nA项，“中间灰度状态”文段并未提及，文段仅提及“明暗两种状态”，无法衔接前文，排除；\nC项，“液晶分子的旋转作用”偏离前文重点，前文重点围绕电压与显示效果的关系展开论述，无法衔接前文，排除；\nD项，“站在不同视角看显示屏”文段并提及，无中生有，无法衔接前文，排除。\n故正确答案为B。\n【文段出处】OSA西光所分会《光的偏振》","no":58,"missingImage":false},{"type":"question","qid":"19526313","cat":"片段阅读","stem":"民主真正落地，需基于明确、可操作的行动指南，行动指南要依托科学规范的程序文本来呈现，在这个意义上，科学民主的程序文本是民主得以从理念转化为现实不可或缺的载体，也是维护民主之实的基本保证。一方面，可借鉴他山之石，一定程度地吸纳其他国家较为成熟的，基于民主、公正、法治原则所建立起的议事规则；另一方面，须扎根实际，不能将程序简单视为政治制度的“飞来峰”，照抄照搬或简而化之，需要注重历史和现实、理论和实践、形式和内容有机统一，找到正确的方式方法。此外，还应构建长效化的程序完善机制，不断夯实程序之基。\n最适合做这段文字标题的是：","options":{"A":"以程序保障之力强化实质民主之效","B":"以程序内容之基筑牢实质民主之实","C":"以程序运行之效提升实质民主之质","D":"以程序科学之道阐释实质民主之义"},"answer":"B","explanation":"文段开篇指出民主真正落地需要明确可操作的行动指南，而行动指南则需要依托科学规范的程序文本来呈现，引出“民主落地”和“程序文本”的话题，接着强调科学民主的程序文本对民主从理念转化为现实以及维护民主之实的重要作用。然后通过三方面进行具体的解释说明，一是借鉴他国成熟议事规则，二是扎根实际，注重历史与现实等有机统一找到正确方法，三是构建长效化程序完善机制。故文段重在强调要以科学规范的程序文本，即程序内容为基础来筑牢实质民主，对应B项。\nA项，文段强调以“程序文本”为基础，“以程序保障之力”表述不明确，排除；\nC项，文段重点围绕“程序文本”展开，未涉及“程序的运行”，无中生有，排除；\nD项，文段强调以“程序文本”为基础，“以程序科学之道”表述不明确，且“民主之义”偏离重点，文段侧重讨论民主如何落到实处，排除。\n故正确答案为B。\n【文段出处】学习时报《坚持以程序民主赋能实质民主》","no":59,"missingImage":false},{"type":"question","qid":"19526296","cat":"片段阅读","stem":"半规管原本是感知头部运动的器官，目前尚不清楚它是如何捕捉气压变化的。当半规管感知气压降低，会将信息传递给前庭神经，再传递给下丘脑。下丘脑负责调整自主神经。自主神经是维持体内状态不变、使身体适应外界变化的神经，分为交感神经和副交感神经，前者负责将身体切换到“战斗模式”，后者负责切换到“放松模式”。当下丘脑因气压变化受到刺激时，自主神经的功能就会紊乱，导致精神状态不佳。交感神经过度活跃时，身体会处于紧张状态，产生焦虑感；交感神经不能正常工作时
