，人就会无精打采。\n根据这段文字，下列说法正确的是：","options":{"A":"交感神经负责使人进入放松状态","B":"气压变化时人的前庭神经最先感知","C":"副交感神经过度活跃使人产生焦虑感","D":"气压变化通过下丘脑影响人的精神状态"},"answer":"D","explanation":"A项，根据文段“分为交感神经和副交感神经，前者负责将身体切换到‘战斗模式’，后者负责切换到‘放松模式’”可知，交感神经负责将身体切换到“战斗模式”而非放松状态，偷换概念，排除；\nB项，根据文段“半规管原本是感知头部运动的器官，目前尚不清楚它是如何捕捉气压变化的。当半规管感知气压降低，会将信息传递给前庭神经”可知，气压变化的信息是通过半规管传递给前庭神经的，故最先感知气压变化的并非前庭神经，表述错误，排除；\nC项，根据文段“交感神经过度活跃时，身体会处于紧张状态，产生焦虑感”可知，是“交感神经”过度活跃时，身体会产生焦虑感，而非“副交感神经”，偷换概念，排除；\nD项，根据文段“当下丘脑因气压变化受到刺激时，自主神经的功能就会紊乱，导致精神状态不佳”可知，气压变化通过影响下丘脑，进而影响人的精神状态，表述正确，当选。\n故正确答案为D。\n【文段出处】《科学世界》杂志《心情“郁郁”竟然跟天气有关？》","no":60,"missingImage":false},{"type":"question","qid":"19526343","cat":"片段阅读","stem":"对于县域而言，“错位”首先必须植根于自身“家底”。习近平总书记强调做好“土特产”文章，正是点明要善于发掘和利用这种基于本土禀赋的比较优势，形成“人无我有”的独特起点。同时，随着技术进步、市场变化，过去的优势可能减弱，新的机遇窗口不断开启。因此，“错位发展”更需秉持发展眼光和创新思维，不仅要立足当前“有什么”，更要前瞻性谋划“能发展什么”“应发展什么”，主动对接国家战略需求、区域发展格局、城市功能疏解、乡村全面振兴需要和市场前沿，将潜在优势有效转化为产业竞争力与市场效益。\n这段文字意在说明：","options":{"A":"以产业促发展方能激活乡村振兴新动能","B":"县域产业发展应主动聚焦国家战略需求","C":"县域经济如何科学把握“错位发展”","D":"前瞻性谋划为什么要先摸清“家底”"},"answer":"C","explanation":"文段首先指出县域“错位”须根植于自身“家底”，依托本土禀赋的比较优势形成独特起点，接着通过并列关联词“同时”指出过去的优势可能减弱，新的机遇窗口不断开启，并通过“因此”指出“错位发展”要秉持发展眼光和创新思维，主动对接多重需求，将潜在优势转化为产业竞争力与市场效益。故文段重点论述县域如何实现科学推进“错位发展”，对应C项。\nA项，“以产业促发展方能激活乡村振兴新动能”偏离文段核心话题，文段重点强调县域“错位发展”，排除；\nB项，“主动聚焦国家战略需求”是“错位发展”中主动对接的一个方面，表述片面，排除；\nD项，文段并未探讨“前瞻性谋划”与“摸清‘家底’”的因果关系，而是将“摸清‘家底’”作为“错位发展”的基础，“前瞻性谋划”作为“错位发展”的进阶要求，与文意不符，排除。\n故正确答案为C。\n【文段出处】人民日报《县域经济高质量发展的科学方法论 准确把握错位发展、串珠成链》","no":61,"missingImage":false},{"type":"question","qid":"19526327","cat":"片段阅读","stem":"中纬度地区高空的西风带，是在北极极涡外环绕全球一周的强大气流，由上升的赤道暖空气在向两极运动过程中受地球自转影响而偏转形成。西风带就像是地球大气环流中的一根“皮筋儿”，其松紧程度取决于赤道和极地之间的温度差。当温差较大时，西风带流动较强，冷空气被束缚在极地。而随着全球变暖，南北温差减小，西风带环流变弱，这根“皮筋儿”变松了。当极涡分裂南下时，冷暖空气的南北交汇现象会变得更加剧烈。西风带上大尺度波动的增强，会使中纬度地区的天气变得更加极端，急剧降温，并且持续时间更长。\n这段文字主要解释了：","options":{"A":"为何中纬度地区会有极端寒潮天气","B":"为何中纬度地区高空会形成西风带","C":"西风带的风力为何如此巨大而持久","D":"西风带的风力为何与南北温差有关"},"answer":"A","explanation":"文段开篇介绍了西风带的定义及其成因，接着指出西风带的活动强度取决于赤道与极地的温差，并对此进行了具体论述，随后指出全球变暖导致南北温差减小，西风带环流减弱，进而导致极涡分裂南下，冷暖空气交汇加剧，最终使得中纬度地区天气更极端，急剧降温且持续时间更长。即文段先引出话题西风带，随后说明全球变暖导致西风带环流变弱，最终导致中纬度地区急剧降温，故文段重点讨论的问题是中纬度地区为何急剧降温，对应A项。\nB项，“中纬度地区高空会形成西风带”对应文段首句，非重点，排除；\nC项，“风力巨大”对应“当温差较大时，西风带流动较强”，表述片面，且“风力持久”文段并未提及，无中生有，排除；\nD项，文段论述西风带风力与南北温差的关系是为了说明中纬度地区为何会有极端寒潮天气，该项属于文段的非重点内容，排除。\n故正确答案为A。\n【文段出处】微信公众号 科学大院《比北极点还冷的地方，在山西》","no":62,"missingImage":false},{"type":"question","qid":"19526308","cat":"语句表达","stem":"行政决策要遵循科学、民主和依法的原则，但                    。按照行政决策的性质及目标划分，行政决策可分为经营性决策和管理型决策。经营性决策是政府为履行发展职能，促进经济社会发展而实施的决策，如制定产业政策、作出招商引资决定等，涉及经济社会高质量发展，因而需要更多遵循经济规律，面向市场进行成本效益分析，量力而行。管理型决策则是直接涉及行政相对人的利益，如公共福利政策制定、生态环境保护措施等，需要更多的开放性和公众参与。凡是利益相关者，都应赋予其表达意见、参与决策的权利。\n填入画横线部分最恰当的一项是：","options":{"A":"要注意倾听各利益相关群体的不同声音","B":"应根据现实中的具体情况进行适当调整","C":"仍然需要完善相关制度以确保其规范运行","D":"具体要求则因行政决策性质的不同而有差异"},"answer":"D","explanation":"横线出现在文段开头，且为首句中的分句，需结合首句及后文内容分析。文段开篇指出行政决策要遵循的原则，横线后指出按照行政决策的性质及目标，将其分为经营性决策和管理型决策。后文针对经营性决策和管理型决策的区别详细介绍。故文段强调了行政决策需要根据性质及目标不同，采取不同的行政决策模式，对应D项。\nA项，仅对应后文“管理型决策”的相关内容，表述片面，排除；\nB项，“具体情况”表述笼统，且缺少核心话题“行政决策”，排除；\nC项，“完善相关制度以确保其规范运行”文段并未涉及相关内容，无法与后文衔接，排除。\n故正确答案为D。\n【文段出处】民主与法制网《完善行政决策制度体系 提升行政决策质量和效率》","no":63,"missingImage":false},{"type":"question","qid":"19526321","cat":"片段阅读","stem":"牵牛花色丰富，且一朵花一日之内的花色有诸多变化，清晨时的蓝紫色至午后会逐渐变作粉紫色，而这与花朵内的花青素以及当天的温度、日照等有关，天气晴好的日子，这种变色似乎更加明显。清人邹一桂擅画，所著《小山画谱》中曾说：“清晓开放，日高即殷，遇阴曀则花竟日。”牵牛清早盛开，经阳光曝晒则会变作红色，碰到阴天则会开放一整日。大自然的诸种变化都有科学解释，诗人却将理性的科学事实化作了感性的诗句——“晚卸蓝裳著茜衫”，数次咏过牵牛的宋代诗人杨万里，将花色变化比作女子更换衣衫，平添了几分细腻与温柔。\n作者引用古代诗文，是为了说明：","options":{"A":"牵牛的花期较为短暂","B":"牵牛具有变色的生物特性","C":"牵牛是古代诗画的常见题材","D":"牵牛被古人赋予了文化意蕴"},"answer":"B","explanation":"文段开篇指出牵牛花色丰富且一日内花色多变的特点，接着分别引用清人邹一桂的《小山画谱》中的描述及宋代诗人杨万里的诗句，进一步说明了其花色富于变化的特性。故作者引用古代诗文是为了说明牵牛具有变色的生物特性，对应B项。\nA项“花期较为短暂”、C项“古代诗画的常见题材”文段均未提及，无中生有，排除；\nD项，诗句是对牵牛变色特性的感性化描述，而非强调其“文化意蕴”，该项偏离文段重点，没有体现变色的特征，排除。\n故正确答案为B。\n【文段出处】光明日报《秋日草花》","no":64,"missingImage":false},{"type":"question","qid":"19526318","cat":"片段阅读","stem":"早期宇宙中，一个典型的星系会从周围的星系间介质中吸积气体，并将这些气体转化为恒星。这一过程会增加星系的质量，从而提高气体吸积的效率，加速恒星形成。然而，星系并不是无限增长的，天文学家将这一过程称为“熄灭”。在近域宇宙中，大约有一半被观测到的星系已经不再形成恒星，也就是成为了息产星系，它们不再包含年轻明亮的蓝色恒星，只剩下更老、更小的红色恒星，因此，它们的外观呈现红色。\n根据这段文字，下列说法正确的是：","options":{"A":"停止形成恒星的星系外观呈现红色","B":"近域宇宙中大多数星系是息产星系","C":"星系质量与恒星形成效率呈正相关","D":"息产星系中仍包含少量的蓝色恒星"},"answer":"A","explanation":"A项，根据“······星系已经不再形成恒星······因此，它们的外观呈现红色”可知，表述正确，当选；\nB项，根据“在近域宇宙中，大约有一半被观测到的星系已经不再形成恒星，也就是成为了息产星系”可知，文段论述的是“大约有一半”并非“大多数”，偷换概念，排除；\nC项，根据“然而，星系并不是无限增长的”以及“大约有一半被观测到的星系已经不再形成恒星”可知，恒星并非一直处于形成阶段，故“呈正相关”表述不严谨，排除；\nD项，根据“它们不再包含年轻明亮的蓝色恒星，只剩下更老、更小的红色恒星”可知，表述错误，排除。\n故正确答案为A。\n【文段出处】《星闻 | 火星首批“居民”会是它？》","no":65,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"19526236","cat":"数学运算","stem":"某种商品若按每件100元出售，每天售出m件；若降价10%，日销量将提高25%且单日利润与降价前相同。问该商品成本为多少元/件？","options":{"A":"50","B":"60","C":"70","D":"80"},"answer":"A","explanation":"方法一：设该商品成本为x元/件。根据题意，每件售价100元，每天可售出m件；若降价10%，日销量可提高25%，则降价后每件售价为100×（1-10%）=90元，日销量为（1+25%）m=1.25m件。根据单日利润与降价前相同，可列式：\u003cimg data-k=\"dbee31b20137\">，解得x=50，故该商品成本为50元/件。\n方法二：降价前每件售价100元，降价10%后每件售价减少100×10%=10元。根据公式：利润=售价-成本，成本不变，则售价减少10元即利润减少10元。根据题意可知，单日利润与降价前相同，根据公式：总利润=单个利润×数量，已知总利润一定，单个利润与数量成反比，该商品降价前、后日销量之比为1：（1+25%）=4：5，则降价前、后单个利润之比为5：4，相差1份即为利润减少的10元，则降价前单个利润为\u003cimg data-k=\"523f6f27145a\">元，故该商品成本为100-50=50元/件。\n故正确答案为A。","no":66,"missingImage":false},{"type":"question","qid":"19526237","cat":"数学运算","stem":"某部门7人分两组到甲、乙两市进行调研。已知到甲市人数超过一半，老张和小王均到乙市，问共有多少种不同的分组方式？","options":{"A":"10","B":"8","C":"6","D":"5"},"answer":"C","explanation":"根据题意可知，总人数为7人，老张和小王均到乙市，甲市人数超过一半且为整数，即甲市为4人或5人，分以下2种情况。\n①甲市4人，乙市3人：因老张和小王均到乙市，故只需在余下7-2=5人中选出1人分到乙市，其余4人去甲市即可，情况数为\u003cimg data-k=\"fa1655505430\">种。\n②甲市5人，乙市2人：老张、小王均到乙市，余下5人均到甲市，情况数为1种。\n则共有5+1=6种不同的分组方式。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"19526239","cat":"数学运算","stem":"小王从甲地匀速前往乙地，到达后立刻匀速返回。已知他去程的用时比返程多3小时，去程的速度是返程的40%，且往返的平均速度为40千米/小时，问甲、乙两地相距多少千米？","options":{"A":"70","B":"140","C":"210","D":"280"},"answer":"B","explanation":"由题意可知，\u003cimg data-k=\"8ed5f86bb0d0\">，根据“路程一定，速度与时间成反比”，则\u003cimg data-k=\"d86c6bddbf3c\">，设去程时间为5x小时，则返程时间为2x小时，根据“去程的用时比返程多3小时”，可列式：5x-2x=3，解得x=1，故\u003cimg data-k=\"9949392e1109\">小时，\u003cimg data-k=\"a0882ec97824\">小时，往返用时5+2=7小时，由“往返的平均速度为40千米/小时”，可得甲、乙两地往返距离2S=vt=40×7=280千米，则甲、乙两地距离S=280÷2=140千米。\n故正确答案为B。","no":68,"missingImage":false},{"type":"question","qid":"19526259","cat":"数学运算","stem":"2024年张和李年龄的平均值是刘的2倍；2028年张的年龄是李的1.5倍，比刘年龄的2倍大4岁。问张哪一年60岁？","options":{"A":"2036年","B":"2038年","C":"2040年","D":"2042年"},"answer":"C","explanation":"方法一：根据“2028年张的年龄是李的1.5倍”，可设2028年张、李、刘的年龄分别为3x、2x、y，因2028年张的年龄比刘年龄的2倍大4岁，可得：3x=2y+4······①；根据“2024年张和李年龄的平均值是刘的2倍”，可得：\u003cimg data-k=\"4b5269895279\">······②；联立①②式，解得x=16，y=22。即2028年张的年龄为3x=3×16=48岁，到60岁需要60-48=12年，则张在12+2028=2040年60岁。\n方法二：根据“2028年张的年龄是李的1.5倍”，可知\u003cimg data-k=\"4edae751c4d1\">，故2028年张的年龄是3的倍数；再过n年，张60岁时，年龄也是3的倍数，故n也为3的倍数，即所求年份-2028能被3整除。观察选项，只有C项满足。\n故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"19526285","cat":"数学运算","stem":"甲、乙和丙3个单位共有100多名职工，其中甲单位的职工人数占总数的24%，乙单位的职工比丙单位多50%。问丙单位的职工比甲单位多多少人？","options":{"A":"4","B":"8","C":"12","D":"16"},"answer":"B","explanation":"根据题意可得，\u003cimg data-k=\"69dd0c7cc871\">，则\u003cimg data-k=\"c4e87c25be97\">，又因为\u003cimg data-k=\"1128af5fed3c\">，因此（乙人数+丙人数）既满足19的倍数，又满足5的倍数，故应为19×5n=95n人。那么\u003cimg data-k=\"c1968ee352c9\">，结合题干条件“3个单位共有100多名职工”可知，总人数（125n）只能为125人，此时n=1。则甲单位的职工人数=125×24%=30人，丙单位的职工人数\u003cimg data-k=\"59cfd1e41169\">人，题干所求=38-30=8人。\n故正确答案为B。","no":70,"missingImage":false},{"type":"question","qid":"19526319","cat":"数学运算","stem":"某单位从所有职工中随机选3人参加某个会议，张立和李磊2人中只有1人被选中的概率是2人均被选中概率的30倍。问该单位有职工多少人？","options":{"A":"15","B":"17","C":"29","D":"33"},"answer":"D","explanation":"根据公式：概率\u003cimg data-k=\"8e34e7768e0e\">；根据题意可知：\u003cimg data-k=\"2d8dc06c9a30\">，即只有1人被选中的情况数=2人均被选中的情况数×30。\n方法一：\n设该单位有职工n人，根据题意可知：n＞3。张立和李磊中只有1人被选中，需先从2人中选择1人，再从剩余的职工中选择2人，满足条件的情况数为\u003cimg data-k=\"1d9f728d595f\">；张立和李磊2人均被选中，需要从剩余的职工中再选择1人，满足条件的情况数为\u003cimg data-k=\"14f1f814028b\">。可列式：（n−2）×（n−3）=（n−2）×30，解得n=33人。\n方法二：\n根据题干信息代入排除。\n代入A项：若该单位有职工15人，张立和李磊中只有1人被选中，满足条件的情况数为\u003cimg data-k=\"1128a4e99014\">\u003cimg data-k=\"619a12adbaa4\">；张立和李磊均被选中，满足条件的情况数为\u003cimg data-k=\"278cff534963\">。可验证：\u003cimg data-k=\"83684bf2a302\">，错误；\n代入B项：若该单位有职工17人，张立和李磊中只有1人被选中，满足条件的情况数为\u003cimg data-k=\"b549af85b51a\">；张立和李磊均被选中，满足条件的情况数为\u003cimg data-k=\"fd4c47c1bac4\">。可验证：\u003cimg data-k=\"35cc50ec0ee2\">，错误；\n代入C项：若该单位有职工29人，张立和李磊中只有1人被选中，满足条件的情况数为\u003cimg data-k=\"2fa5bb92cac3\">；张立和李磊均被选中，满足条件的情况数为\u003cimg data-k=\"9fb35e815eae\">。可验证：\u003cimg data-k=\"6554155ba199\">，错误；\n排除A、B、C三项，选择D项。\n验证D项：若该单位有职工33人，张立和李磊中只有1人被选中，满足条件的情况数为\u003cimg data-k=\"95acf9cc979c\">；张立和李磊均被选中，满足条件的情况数为\u003cimg data-k=\"37b0e742a870\">。可验证：\u003cimg data-k=\"4a5fa403c386\">，正确。\n故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"19526316","cat":"数学运算","stem":"甲、乙两个工程队单独完成A、B、C三个工程，所需时间如下：\n\u003cimg data-k=\"65520e14eb43\" style=\"max-width:489px\">\n问两队合作完成这3个工程至少需要多少天（不足1天算1天）？","options":{"A":"18","B":"17","C":"16","D":"15"},"answer":"D","explanation":"根据题意，赋值A工程的工程总量为60，B工程为45，C工程为90，则甲、乙两队完成A、B、C三个工程的工作效率如下：\n\u003cimg data-k=\"e2003c5f66b9\" style=\"max-width:339px\">\n要想完成这3个工程的时间尽量少，需要让甲、乙两队优先完成各自擅长的工程。对比发现，甲队更擅长C工程，乙队更擅长B工程。则甲队优先完成C工程所需时间为10天，同时乙队完成B工程需要9天，此时乙队可再独自做10-9=1天A工程。甲队完成C工程后，两队再共同完成A工程，还需\u003cimg data-k=\"1527ec13ad9f\">天，则两队合作完成这3个工程至少需要10+5=15天。\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"19526325","cat":"数学运算","stem":"某考试有30人参加，每人得分都是0~100之间的整数且互不相同。已知得分不低于90的人平均分为93.8分，小姜得了92分，问他的成绩排名最低可能是第几名？","options":{"A":"4","B":"5","C":"7","D":"8"},"answer":"A","explanation":"设得分不低于90的有n个人。根据题意“每人得分都是0~100之间的整数且互不相同”，则分数不低于90的人数最多为90~100分各1人，即\u003cimg data-k=\"16e5a4d97970\">；总分数为n个整数之和，即总分数＝93.8n为整数，则n只能为5或10。\n若n＝10，则前十名的总分数为93.8×10＝938分。因分数为互不相同的整数，则前十名总分最低为90+91+92+93+94+95+96+97+98+99＝945&gt;938，n＝10不成立，则n＝5，排除C、D两项。\nn＝5，则前五名总分数为93.8×5＝469分。问“排名最低可能是第几名”，代入B项，92分为第5名，则前五名总分数最低为92+93+94+95+96＝470&gt;469，不成立，排除。\n故正确答案为A。","no":73,"missingImage":false},{"type":"question","qid":"19526340","cat":"数学运算","stem":"一块梯形场地如下图所示，已知OA=0.6OD，现在需要将这块场地拓展为一块长方形场地，问扩展后场地面积比原来至少增加：\n\u003cimg data-k=\"33b5aea05f08\" style=\"max-width:300px\">","options":{"A":"20%","B":"25%","C":"40%","D":"50%"},"answer":"B","explanation":"场地要扩展成长方形且面积增加最少，需以梯形的最长底边为长方形的长，梯形的高为长方形的宽，扩展后的场地EFCD如下图所示。在梯形ABCD中，\u003cimg data-k=\"74cdd3429770\">，\u003cimg data-k=\"c78df947a505\">，赋值\u003cimg data-k=\"0f4f1d7e5df4\">，\u003cimg data-k=\"01413ff8ce04\">，设梯形的高为\u003cimg data-k=\"e9c409162404\">，则\u003cimg data-k=\"c8bec4b51023\">\u003cimg data-k=\"95dbd6c6deed\">。扩展后的长方形场地面积最小为\u003cimg data-k=\"cbfb95afd6b1\">，扩展后场地面积比原来至少增加\u003cimg data-k=\"aab17085522d\">。\n\u003cimg data-k=\"2cece0fd1fed\" style=\"max-width:254px\">\n故正确答案为B。","no":74,"missingImage":false},{"type":"question","qid":"19526328","cat":"数学运算","stem":"某社区干部每周一参加工作例会，每月10日、20日接访群众。已知8月与9月共有2次接访群众与工作例会在同一天，问当年9月1日是：","options":{"A":"周三","B":"周二","C":"周六","D":"周五"},"answer":"C","explanation":"根据题意可知，8月10日、20日，9月10日、20日，这4天中有2天既接访群众又参加工作例会，即这4天中仅有2天是周一。这4天中相邻2天间隔天数依次为10天、21天、10天，21天为7的倍数，则仅8月20日与9月10日的星期数相同，故8月20日与9月10日为周一，则9月3日为周一，9月1日为周六。\n故正确答案为C。","no":75,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>为倡导团结合作精神，某单位举办了若干项目的双打比赛。该单位后勤部由王、吴、韩和宋4人组成网球、乒乓球和羽毛球3支双打队伍参赛，每支队伍由其中2人组成，4人均至少参加了其中的一支队伍。已知：\u003c/p>\u003cp>（1）王和韩没有参加同一个项目；\u003c/p>\u003cp>（2）若韩参加羽毛球项目，则宋参加网球项目；\u003c/p>\u003cp>（3）若王参加乒乓球项目，则吴参加网球项目，若王不参加乒乓球项目，则吴也不参加网球项目。\u003c/p>","questions":[{"qid":"19526277","cat":"逻辑判断","stem":"对于3支双打队伍的组成情况，以下哪项是可能的？","options":{"A":"网球——王、宋；乒乓球——吴、宋；羽毛球——王、韩","B":"网球——吴、韩；乒乓球——吴、王；羽毛球——韩、宋","C":"网球——韩、宋；乒乓球——吴、王；羽毛球——王、宋","D":"网球——王、宋；乒乓球——吴、韩；羽毛球——王、吴"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）王、韩没有参加同一个项目；\n（2）韩羽毛球\u003cimg data-k=\"a37757d411ef\">宋网球；\n（3）王乒乓球\u003cimg data-k=\"a37757d411ef\">吴网球，\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">吴网球；\n（4）每支队伍由其中2人组成，4人均至少参加了其中的一支队伍。\n第二步：根据题干条件进行推理。\n本题题干信息确定，选项信息充分，优先考虑排除法。\n由条件（1）可知，王、韩没有参加同一个项目，排除A项；\n由条件（2）可知，韩参加羽毛球，则宋参加网球，排除B项；\n由条件（3）可知，王参加乒乓球，则吴参加网球，排除C项。\n经验证，D项满足题干所有条件，当选。\n故正确答案为D。","no":76,"missingImage":false},{"qid":"19526278","cat":"逻辑判断","stem":"若宋和韩组队网球双打，则以下哪项一定正确？","options":{"A":"吴参加乒乓球项目","B":"王参加羽毛球项目","C":"宋参加乒乓球项目","D":"吴参加羽毛球项目"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）王、韩没有参加同一个项目；\n（2）韩羽毛球\u003cimg data-k=\"a37757d411ef\">宋网球；\n（3）王乒乓球\u003cimg data-k=\"a37757d411ef\">吴网球，\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">吴网球；\n（4）每支队伍由其中2人组成，4人均至少参加了其中的一支队伍；\n（5）宋和韩组队网球。\n第二步：根据题干条件进行推理。\n根据条件（1）和（5）可知，王不参加网球；根据条件（4）和（5）可知，宋和韩组队网球，队伍已满2人，所以吴不参加网球，结合条件（3）可知，王不参加乒乓球；再结合条件（4）4人均至少参加了其中的一支队伍可知，王参加羽毛球。\n故正确答案为B。","no":77,"missingImage":false},{"qid":"19526279","cat":"逻辑判断","stem":"若吴参加3个项目，则以下哪项是可能的？","options":{"A":"宋参加网球项目","B":"王参加网球项目","C":"宋参加乒乓球项目","D":"王参加羽毛球项目"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）王、韩没有参加同一个项目；\n（2）韩羽毛球\u003cimg data-k=\"a37757d411ef\">宋网球；\n（3）王乒乓球\u003cimg data-k=\"a37757d411ef\">吴网球，\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">吴网球；\n（4）每支队伍由其中2人组成，4人均至少参加了其中的一支队伍；\n（5）吴参加了3个项目。\n第二步：根据题干条件进行推理。\n根据条件（4）和（5）可知，吴参加了网球、乒乓球和羽毛球3个项目，王、韩和宋每人均只参加1个项目，结合条件（3）“\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">吴网球”可知，王参加乒乓球项目，此时，韩和宋只需要分别参加羽毛球和网球中的1个项目即可。综上所述，选项中只有A项可能正确。\n故正确答案为A。","no":78,"missingImage":false},{"qid":"19526280","cat":"逻辑判断","stem":"以下哪项中的两人可能同时组队网球和羽毛球双打？","options":{"A":"王和吴","B":"王和宋","C":"吴和宋","D":"韩和宋"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）王、韩没有参加同一个项目；\n（2）韩羽毛球\u003cimg data-k=\"a37757d411ef\">宋网球；\n（3）王乒乓球\u003cimg data-k=\"a37757d411ef\">吴网球，\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">吴网球；\n（4）每支队伍由其中2人组成，4人均至少参加了其中的一支队伍。\n第二步：根据题干条件进行推理。\n题干问法为“可能”，优先使用代入法。\n代入A项：王和吴同时组队网球和羽毛球双打，根据条件（4）可知，韩和宋组队乒乓球双打，此时与条件（3）的后一个推出关系矛盾，不满足题干条件，不可能为真，排除；\n代入B项：王和宋同时组队网球和羽毛球双打，根据条件（4）可知，吴和韩组队乒乓球双打，此时满足题干所有条件，可能为真，当选；\n代入C项：吴和宋同时组队网球和羽毛球双打，根据条件（4）可知，王和韩组队乒乓球双打，此时与条件（1）矛盾，不满足题干条件，不可能为真，排除；\n代入D项：韩和宋同时组队网球和羽毛球双打，王和吴组队乒乓球双打，此时与条件（3）的前一个推出关系矛盾，不满足题干条件，不可能为真，排除；\n故正确答案为B。","no":79,"missingImage":false},{"qid":"19526281","cat":"逻辑判断","stem":"若宋和韩组队乒乓球双打，则以下哪项是可能的？","options":{"A":"吴和韩组队网球双打","B":"吴和宋组队网球双打","C":"宋和韩组队羽毛球双打","D":"吴和宋组队羽毛球双打"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）王、韩没有参加同一个项目；\n（2）韩羽毛球\u003cimg data-k=\"a37757d411ef\">宋网球；\n（3）王乒乓球\u003cimg data-k=\"a37757d411ef\">吴网球，\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"b3a86cb4840e\">吴网球；\n（4）每支队伍由其中2人组成，4人均至少参加了其中的一支队伍；\n（5）宋和韩组队乒乓球双打。\n第二步：根据题干条件进行推理。\n根据条件（4）与（5），可知乒乓球队人已满，则王与吴均不能参加乒乓球项目，结合条件（3），肯前必肯后，可得吴不参加网球项目，排除A、B两项；\n根据吴不参加乒乓球项目，也不参加网球项目，结合条件（4），4人均至少参加了其中的一支队伍，可得吴必须参加羽毛球项目，那么宋和韩不可能同时参加羽毛球项目，排除C项。\n故正确答案为D。","no":80,"missingImage":false},{"qid":"19526295","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"7c4cd998e2ca\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干每幅图形均分为2个部分，且其中一个部分有1个黑球，另一个部分有2个黑球，只有D项符合规律。\n故正确答案为D。","no":81,"missingImage":false},{"qid":"19526294","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"6ac972e1b260\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成基本相同，优先考虑位置规律。题干图形出现十六宫格，可以优先考虑内外分开看。观察发现，题干图形中黑色三角形均存在三个顶点，其中外圈的两个顶点在外圈依次逆时针平移一格，内圈的顶点在内圈依次逆时针平移一格，故？处图形也应符合此规律，只有A项符合。\n\u003cimg data-k=\"11f0bcccb61f\" style=\"max-width:600px\">\n故正确答案为A。","no":82,"missingImage":false},{"qid":"19526311","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"efc67148c999\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，优先考虑属性规律。观察发现，题干图形均由2个图形组成，且出现等腰元素，考虑对称性，题干均由1个中心对称图形和1个轴对称图形构成，排除D项；继续观察发现，题干图形出现明显的多端点图形，考虑笔画数，题干第一组图形笔画数均为3，其中轴对称图形为一笔画，中心对称图形为两笔画，第二组前两个图形笔画数均为3，其中中心对称图形为一笔画，轴对称图形为两笔画，故？处图形的笔画数应为3，且中心对称图形为一笔画，轴对称图形为两笔画，只有B项符合。\n故正确答案为B。","no":83,"missingImage":false},{"qid":"19526251","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"ddf33f4b909d\" style=\"max-width:400px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相似，优先考虑样式规律。观察发现，九宫格每行图形轮廓和分割区域相同，优先考虑黑白运算。第一行图形的运算规律为：白+黑=白，白+白=白，黑+白=白，黑+黑=黑；经验证，第二行图形符合此规律；第三行图形应用此规律，只有C项符合。\n故正确答案为C。","no":84,"missingImage":false},{"qid":"19526333","cat":"图形推理","stem":"左边为给定的多面体，现用经P、Q、R三点的平面对其进行切割，切面为：\n\u003cimg data-k=\"14021cac5de2\" style=\"max-width:700px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查截面图。根据平面公理“过不在一条直线上的三点，有且只有一个平面”可以得出，经过P、Q、R三点可以确定唯一的切面（即截面），即为B项，如下图所示：\n\u003cimg data-k=\"b0c5e3c29f8b\" style=\"max-width:258px\">\n故正确答案为B。","no":85,"missingImage":false},{"qid":"19526329","cat":"图形推理","stem":"下图为由2个正方体组合而成的长方体，问这2个正方体的外表面展开图可能分别是：\n\u003cimg data-k=\"e61c9b0abff6\" style=\"max-width:218px\">\n\u003cimg data-k=\"ce41cda16d8d\" style=\"max-width:600px\">","options":{"A":"②和④","B":"②和③","C":"①和④","D":"①和③"},"answer":"D","explanation":"将题干2个正方体的面标上字母序号，并在立体图形和外表面展开图的“T”字形面（面e和面g）中以“T”字形中线端点为起始点，顺时针描边标号，如下图所示。\n\u003cimg data-k=\"1ae0205e2ade\" style=\"max-width:259px\">\n\u003cimg data-k=\"2e11214ffca2\" style=\"max-width:600px\">\n图①中，标出“T字形”面中对应的边2和边3后发现，二者与题干右侧正方体中面g的边2和边3对应一致，故图①可能是题干右侧正方体的外表面展开图；\n图②中，标出“T字形”面中对应的边2和边3后发现，二者与题干右侧正方体中面g的边2和边3对应不一致，故图②不可能是题干右侧正方体的外表面展开图，标出“T字形”面中对应的边4后发现，与题干左侧正方体中面e的边4对应不一致，故图②不可能是题干左侧正方体的外表面展开图；\n图③中，标出“T字形”面中对应的边4后发现，该公共边与题干左侧正方体中面e的边4对应一致，故图③可能是题干左侧正方体的外表面展开图；\n图④中，标出“T字形”面中对应的边2和边3后发现，二者与题干右侧正方体中面g的边2和边3对应不一致，故图④不可能是题干右侧正方体的外表面展开图，标出“T字形”面中对应的边4后发现，与题干左侧正方体中面e的边4对应不一致，故图④不可能是题干左侧正方体的外表面展开图。\n综上，2个正方体的外表面展开图可能是①和③，对应D项。\n故正确答案为D。","no":86,"missingImage":false},{"qid":"19526323","cat":"图形推理","stem":"左边为由12个白色正方体和3个灰色正方体组合而成的多面体前后两面直观图，问其可以由除哪项外的三个多面体组合而成？\n\u003cimg data-k=\"ea813827a4d0\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查立体拼合。题干多面体可以由A、B、D三项中的立体图形拼合而成，具体拼合过程如下图所示：\n\u003cimg data-k=\"591b136d49cd\" style=\"max-width:600px\">\n本题为选非题，故正确答案为C。","no":87,"missingImage":false},{"qid":"19526250","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"712f2ffd7fc1\" style=\"max-width:548px\">","options":{"A":"①④⑤，②③⑥","B":"①③⑤，②④⑥","C":"①③④，②⑤⑥","D":"①②④，③⑤⑥"},"answer":"A","explanation":"本题为分组分类题目。元素组成相同，但整体看没有明显的位置规律。观察发现，题干每幅图中均有一个黑菱形和一个白菱形，且图①④⑤中的黑菱形和白菱形相交于线，图②③⑥中的黑菱形和白菱形不相交。故图①④⑤为一组，图②③⑥为一组。\n故正确答案为A。","no":88,"missingImage":false},{"qid":"19526253","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"e0ae613145b1\" style=\"max-width:500px\">","options":{"A":"①②⑥，③④⑤","B":"①②④，③⑤⑥","C":"①⑤⑥，②③④","D":"①④⑥，②③⑤"},"answer":"B","explanation":"元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，题干每幅图中均存在一个黑色面和四个白色面，但根据面的数量无法分组分类，故考虑面的细化。再次观察发现，每幅图中均有1-2个白色面形状与黑色面形状相同，故考虑相同形状的面，图①②④中黑色面的形状与2个白色面形状一致，图③⑤⑥中黑色面的形状与1个白色面形状一致，故图①②④为一组，图③⑤⑥为一组。\n故正确答案为B。","no":89,"missingImage":false},{"qid":"19526305","cat":"图形推理","stem":"把下面6个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"4774f750cd2c\" style=\"max-width:500px\">","options":{"A":"①④⑤，②③⑥","B":"①③⑥，②④⑤","C":"①②⑥，③④⑤","D":"①②④，③⑤⑥"},"answer":"A","explanation":"题干图形均由正六边形宫格及若干线条组成，且线条之间都存在一个十字交叉点，观察十字交叉点的位置，图①④⑤中十字交叉点位于白球外部，图②③⑥中十字交叉点位于白球内部，故图①④⑤为一组，图②③⑥为一组，只有A项符合。\n故正确答案为A。","no":90,"missingImage":false},{"qid":"19526261","cat":"定义判断","stem":"选矿是指用物理、化学或者物理与化学相结合的方法，将原矿中的有用矿物与伴生的无用固定物质（脉石）或有害矿物分开的过程。选矿可显著提高矿石的质量，减少运输费用，降低冶炼成本，进而实现综合利用。\n根据上述定义，下列没有体现选矿过程的是：","options":{"A":"利用矿物颗粒电性的差别，在高压电场中挑选出白钨矿、赤铁矿等，通过电机分离除尘","B":"利用水枪和洗矿槽等设备，将锡矿石中的泥土等杂质洗去，同时也可以将部分轻矿物冲走，实现锡石初步富集","C":"经验丰富的老师傅通过敲击、光照、观察皮壳等方法对开采的翡翠原石进行筛选，挑选优质原石","D":"将铜矿矿石破碎到一定的粒度后，混以少量的食盐和煤粉隔氧加热，矿石中的铜便以金属状态析出，由此获得铜精矿"},"answer":"C","explanation":"第一步：找出定义关键词。\n“用物理、化学或者物理与化学相结合的方法”、“将原矿中的有用矿物与伴生的无用固定物质（脉石）或有害矿物分开的过程”。\n第二步：逐一分析选项。\nA项：利用矿物颗粒电性的差别，属于物理方法，符合“用物理、化学或者物理与化学相结合的方法”，在高压电场中挑选出白钨矿、赤铁矿等（有用物质），通过电机分离除尘（伴生的无用固定物质），符合“将原矿中的有用矿物与伴生的无用固定物质（脉石）或有害矿物分开的过程”，符合定义，排除；\nB项：利用水枪和洗矿槽等设备清洗锡矿石，属于物理方法，符合“用物理、化学或者物理与化学相结合的方法”，将锡矿石中的泥土等杂质（伴生的无用固定物质）洗去，同时也可以将部分轻矿物冲走，实现锡石（有用矿物）初步富集，符合“将原矿中的有用矿物与伴生的无用固定物质（脉石）或有害矿物分开的过程”，符合定义，排除；\nC项：通过敲击、光照、观察皮壳等方法对开采的翡翠原石进行筛选，挑选优质原石，仅是对原石整体品质进行判断与挑选，不涉及对原石中的物质分开的过程，不符合“将原矿中的有用矿物与伴生的无用固定物质（脉石）或有害矿物分开的过程”，不符合定义，当选；\nD项：将铜矿矿石破碎到一定的粒度后，属于物理方法，混以少量的食盐和煤粉隔氧加热，属于化学方法，符合“用物理、化学或者物理与化学相结合的方法”，矿石中的铜（有用矿物）便以金属状态析出，由此获得铜精矿，符合“将原矿中的有用矿物与伴生的无用固定物质（脉石）或有害矿物分开的过程”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":91,"missingImage":false},{"qid":"19526274","cat":"定义判断","stem":"波特五力模型是一种竞争分析工具，用于评估一个行业的竞争力和吸引力。该模型通过对同行业竞争对手的威胁、潜在进入者的威胁、替代品的威胁、上游供应商的议价能力和下游购买者的议价能力这五个方面的分析，帮助企业了解其所处行业的竞争环境，以制定相应的竞争策略。\n根据上述定义，关于康复机器人行业，对下列问题的分析不能归入波特五力模型的是：","options":{"A":"康复机器人行业准入门槛高吗？需要强大的技术能力和创新能力吗？","B":"医院和康复中心患者规模如何？对于康复机器人的需求有多大？","C":"与传统物理治疗等康复治疗方法相比，康复机器人有竞争力吗？","D":"康复机器人企业内部各部门之间的协同合作程度高吗？"},"answer":"D","explanation":"第一步：找出定义关键词。\n“同行业竞争对手的威胁”、“潜在进入者的威胁”、“替代品的威胁”、“上游供应商的议价能力”、“下游购买者的议价能力”、“帮助企业了解其所处行业的竞争环境，以制定相应的竞争策略”。\n第二步：逐一分析选项。\nA项：康复机器人行业准入门槛高吗？需要强大的技术能力和创新能力吗？问题中的“准入门槛”、“技术能力和创新能力”直接关系到潜在企业能否进入康复机器人行业，符合波特五力模型中的“潜在进入者的威胁”，符合定义，排除；\nB项：医院和康复中心患者规模如何？对于康复机器人的需求有多大？问题中的“医院”和“康复中心”是康复机器人的“下游购买者”，“患者规模”与“需求程度”会直接影响购买者采购时的“议价能力”，符合波特五力模型中的“下游购买者的议价能力”，符合定义，排除；\nC项：与传统物理治疗等康复治疗方法相比，康复机器人有竞争力吗？问题中的“传统物理治疗”是康复机器人的“替代方案”，是在分析“替代品”的竞争力对行业的威胁，符合波特五力模型中的“替代品的威胁”，符合定义，排除；\nD项：康复机器人企业内部各部门之间的协同合作程度高吗？问题中的“企业内部各部门之间的协同合作程度”属于企业“内部管理”的范畴，不符合波特五力模型中的任何一个，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":92,"missingImage":false},{"qid":"19526245","cat":"定义判断","stem":"假对是指借用同音或多义的字或词作形（音）此义彼的表达，构成形式上相对的一种修辞方式。假对也是对偶的形式之一，多用于古汉语作品中。根据其构成方式，假对可以分为谐音假对和衍义假对两类：谐音假对是利用语音的相同或相近构成的假对，衍义假对是利用字或词的一形多义现象构成的假对。\n根据上述定义，下列对偶句中的一对画线字属于衍义假对的是：","options":{"A":"明月\u003cu>松\u003c/u>间照，清泉\u003cu>石\u003c/u>上流","B":"厨人具\u003cu>鸡\u003c/u>黍，稚子摘\u003cu>杨\u003c/u>梅","C":"本无\u003cu>丹\u003c/u>灶术，那免\u003cu>白\u003c/u>头翁","D":"\u003cu>枸\u003c/u>杞因吾有，\u003cu>鸡\u003c/u>栖奈汝何"},"answer":"C","explanation":"第一步：找出定义关键词。\n假对：“同音或多义的字或词作形（音）此义彼的表达”、“构成形式上相对”；\n谐音假对：“利用语音的相同或相近构成的假对”；\n衍义假对：“利用字或词的一形多义现象构成的假对”。\n第二步：逐一分析选项。\nA项：该句意思为，明月透过松林洒落斑驳的静影，清泉轻轻地在大石上叮咚流淌，“松”“石”二字均没有利用其一字多义的现象，不符合“利用字或词的一形多义现象构成的假对”，不符合定义，排除；\nB项：该句意思为，厨房里的仆人准备了鸡肉和黍米，年幼的孩子采摘了杨梅，“鸡”“杨”二字均没有利用其一字多义的现象，不符合“利用字或词的一形多义现象构成的假对”，不符合定义，排除；\nC项：该句意思为，我本来就没有炼丹求仙的方术，又怎能避免成为白头老翁呢？其中“丹”字在这句诗中意为“依成方制成的颗粒状或粉末状的中药”，同时取其另外的含义“红色”与“白”对应，符合“利用字或词的一形多义现象构成的假对”，符合定义，当选；\nD项：该句意思为，枸杞树因为我才得以留存下来，鸡栖木啊，又能把你怎么样呢？“枸”“鸡”二字均没有利用其一字多义的现象，不符合“利用字或词的一形多义现象构成的假对”，不符合定义，排除。\n故正确答案为C。","no":93,"missingImage":false},{"qid":"19526247","cat":"定义判断","stem":"药学服务是指药师应用药学专业知识向公众（包括医护人员、患者及家属）提供直接的、负责任的、与药物使用有关的服务，以提高药物治疗的安全性、有效性和经济性。\n根据上述定义，下列没有体现药学服务的是：","options":{"A":"药师与主治医生协商，调整了某患者的用药方案，并给予其相应的用药教育和指导","B":"药师在社区药房开展咨询活动，为长期服药的慢病患者提供个性化的健康用药建议","C":"药师给去药房拿药的患者一个条码，患者扫码后手机就会显示出药物的使用医嘱","D":"药师在调剂工作中审核某患者处方的合法性，评估病情与用药匹配度及疗程合理性"},"answer":"C","explanation":"第一步：找出定义关键词。\n“药师应用药学专业知识”、“向公众（包括医护人员、患者及家属）提供直接的、负责任的、与药物使用有关的服务”、“提高药物治疗的安全性、有效性和经济性”。\n第二步：逐一分析选项。\nA项：该项说的是药师与主治医生协商调整了患者的用药方案，并给予其相应的用药教育和指导，说明药师向患者直接提供了药物相关指导，符合“药师应用药学专业知识”、“向公众（包括医护人员、患者及家属）提供直接的、负责任的、与药物使用有关的服务”、“提高药物治疗的安全性、有效性和经济性”，符合定义，排除；\nB项：该项说的是药师在社区药房为长期服药的患者提供健康用药建议，说明药师用专业知识直接向患者提供健康用药建议，符合“药师应用药学专业知识”、“向公众（包括医护人员、患者及家属）提供直接的、负责任的、与药物使用有关的服务”、“提高药物治疗的安全性、有效性和经济性”，符合定义，排除；\nC项：该项说的是药师给患者条码，患者扫码后会显示药物的使用医嘱，首先药师提供给患者的是条码，而非直接提供药物相关服务，不符合“药师应用药学专业知识”、“向公众（包括医护人员、患者及家属）提供直接的、负责任的、与药物使用有关的服务”，不符合定义，当选；\nD项：该项说的是药师审核某患者处方的合法性，评估病情与用药匹配度及疗程合理性，说明药师用专业知识直接向患者提供了用药匹配度的建议，能够提升药物的安全性和有效性，符合“药师应用药学专业知识”、“向公众（包括医护人员、患者及家属）提供直接的、负责任的、与药物使用有关的服务”、“提高药物治疗的安全性、有效性和经济性”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":94,"missingImage":false},{"qid":"19526243","cat":"定义判断","stem":"均变论认为，支配各种地质过程的法则在地质历史上没有发生过变化，现在起作用的各种自然营力在漫长的地质过程中具有普遍的均一性，即地质演变是一个渐变的过程，具有相同方式和相同的强度；地球上生物的种与种之间有过渡关系，生物进化过程是极其漫长的。灾变论认为，在整个地质发展的过程中，地球经常发生各种突如其来的、短暂的全球性灾难性变化，这些变化强烈地改变了地球的面貌；地球上生物的变化是反复多次灾变的结果。\n根据上述定义，下列说法最能体现灾变论观点的是：","options":{"A":"“我们找不到开始的痕迹，也看不到结束的迹象”","B":"“地质记录是一部被鲜血和火焰写成的史诗”","C":"“现在是通往过去的一把钥匙”","D":"“自然界里没有飞跃”"},"answer":"B","explanation":"第一步：找出定义关键词。\n均变论：“支配各种地质过程的法则在地质历史上没有发生过变化”、“现在起作用的各种自然营力在漫长的地质过程中具有普遍的均一性”、“地球上生物的种与种之间有过渡关系，生物进化过程是极其漫长的”。\n灾变论：“地球经常发生各种突如其来的、短暂的全球性灾难性变化，这些变化强烈地改变了地球的面貌”、“地球上生物的变化是反复多次灾变的结果”。\n第二步：逐一分析选项。\nA项：“我们找不到开始的痕迹，也看不到结束的迹象”，体现了“支配各种地质过程的法则在地质历史上没有发生过变化”、“地球上生物的种与种之间有过渡关系，生物进化过程是极其漫长的”，符合“均变论”定义，不符合“灾变论”定义，排除；\nB项：“地质记录是一部被鲜血和火焰写成的史诗”，“鲜血和火焰”隐喻的是灾难，体现了“地球经常发生各种突如其来的、短暂的全球性灾难性变化，这些变化强烈地改变了地球的面貌”，符合“灾变论”定义，当选；\nC项：“现在是通往过去的一把钥匙”，体现了“支配各种地质过程的法则在地质历史上没有发生过变化”、“现在起作用的各种自然营力在漫长的地质过程中具有普遍的均一性”、“地球上生物的种与种之间有过渡关系，生物进化过程是极其漫长的”，符合“均变论”定义，不符合“灾变论”定义，排除；\nD项：“自然界里没有飞跃”，体现了“地球上生物的种与种之间有过渡关系，生物进化过程是极其漫长的”，符合“均变论”定义，不符合“灾变论”定义，排除。\n故正确答案为B。","no":95,"missingImage":false},{"qid":"19526248","cat":"定义判断","stem":"联想的相似律是指两种在性质、特征上相似的事物或属性可形成联想；对比律是指具有相反特点的事物或属性可形成联想；接近律是指在空间与时间上接近的事物或属性可形成联想。\n根据上述定义，下列说法正确的是：","options":{"A":"由树木想到森林、由蓝天想到飞机，都运用了对比律","B":"由狐狸想到狡猾、由电灯想到房间，都运用了相似律","C":"由钢铁想到坚强、由酷暑想到严寒，分别运用了接近律和对比律","D":"由黑暗想到光明、由花圃想到蝴蝶，分别运用了对比律和接近律"},"answer":"D","explanation":"第一步：找出定义关键词。\n相似律：“两种在性质、特征上相似的事物或属性可形成联想”；\n对比律：“具有相反特点的事物或属性可形成联想”；\n接近律：“在空间与时间上接近的事物或属性可形成联想”。\n第二步：逐一分析选项。\nA项：由树木想到森林，森林由树木组成，空间上接近，符合“在空间与时间上接近的事物或属性可形成联想”，符合“接近律”定义。由蓝天想到飞机，飞机在天空中飞，符合“在空间与时间上接近的事物或属性可形成联想”，符合“接近律”定义，二者均不符合“对比律”定义，说法错误，排除；\nB项：由狐狸想到狡猾，狐狸的特征是狡猾，符合“两种在性质、特征上相似的事物或属性可形成联想”，符合“相似律”定义。由电灯想到房间，电灯安装在房间里，空间接近，符合“在空间与时间上接近的事物或属性可形成联想”，符合“接近律”定义，不符合“相似律”定义，说法错误，排除；\nC项：由钢铁想到坚强，钢铁性质坚硬，用来比喻坚强，符合“两种在性质、特征上相似的事物或属性可形成联想”，符合“相似律”定义，不符合“接近律”定义。由酷暑想到严寒，酷暑和严寒在温度上相反，符合“具有相反特点的事物或属性可形成联想”，符合“对比律”定义，说法错误，排除；\nD项：由黑暗想到光明，黑暗与光明是相反概念，符合“具有相反特点的事物或属性可形成联想”，符合“对比律”定义。由花圃想到蝴蝶，花圃里有蝴蝶，空间接近，符合“在空间与时间上接近的事物或属性可形成联想”，符合“接近律”定义，说法正确，当选。\n故正确答案为D。","no":96,"missingImage":false},{"qid":"19526275","cat":"定义判断","stem":"商品动销率是指在售的商品品种数与库存商品总品种数的比率。商品库销比是指商品库存量与销售额的比率。商品滞销率是指滞销的商品品种数占库存商品总品种数的比率。商品损耗率是指在一定的保管条件下，某商品在储存保管期间，其自然损耗量与商品在库总量的比例。\n根据上述定义，下列说法正确的是：","options":{"A":"若商品动销率超过100%，说明商品在售品种数高于库存商品总品种数","B":"商品损耗率高表明有库存积压风险，商品损耗率低表明销售态势良好","C":"库存商品数一定时，商品滞销率越高，说明滞销的商品越多","D":"当商品库存量越大，销售额越高时，商品库销比就会越大"},"answer":"A","explanation":"第一步：找出定义关键词。\n商品动销率：“在售的商品品种数与库存商品总品种数的比率”；\n商品库销比：“商品库存量与销售额的比率”；\n商品滞销率：“滞销的商品品种数占库存商品总品种数的比率”；\n商品损耗率：“一定的保管条件下，某商品在储存保管期间”、“自然损耗量与商品在库总量的比例”。\n第二步：逐一分析选项。\nA项：根据商品动销率\u003cimg data-k=\"c194e0fae849\">，若商品动销率超过100%，说明商品在售品种数高于库存商品总品种数，说法正确，当选；\nB项：根据商品损耗率\u003cimg data-k=\"84250b4ecd50\">，若商品损耗率高，表明商品自然损耗量相对升高或者商品在库总量相对降低，无法必然得到库存积压情况或销售态势情况，说法错误，排除；\nC项：根据商品滞销率\u003cimg data-k=\"b485201802ac\">，若库存商品数一定时，商品滞销率越高，说明滞销的“商品品种数”越多，而不是滞销的“商品”越多（可能仅指商品数量），说法错误，排除；\nD项：根据商品库销比\u003cimg data-k=\"4168ea985603\">，当商品库存量越大，销售额越高时，因无法确定比值的大小关系，所以无法得知商品库销比一定会越大，说法错误，排除。\n故正确答案为A。","no":97,"missingImage":false},{"qid":"19526298","cat":"定义判断","stem":"动作预期是指运动员在比赛过程中，根据已有信息，对即将发生的动作结果进行预测的过程。在这一过程中，运动员主要依赖两类信息：运动学信息和情境先验信息。运动学信息包括对手的动作、器材的运动轨迹或队员之间的相对位置，情境先验信息则涉及比赛情境中事件发生的概率。\n根据上述定义，下列不涉及上述任何一种信息的是：","options":{"A":"篮球队员甲在双方比分紧咬的情况下，基于对手今日比赛罚篮命中率不高，在对手投篮时选择直接犯规","B":"网球运动员乙知道对手在比赛前有一系列习惯性动作，包括整理球衣、球裤、头发等，暗自提醒自己不要被其干扰","C":"羽毛球双打运动员丙发现对方准备接发球的球员位置稍微靠前，可能来不及转身或后退接球，便发了个后场球","D":"乒乓球运动员丁发现对方发过来的球位置较低、速度较慢，极有可能擦网变线，便没有后退，向前伸拍做好接球准备"},"answer":"B","explanation":"第一步：找出定义关键词。\n动作预期：“运动员”、“在比赛过程中”、“根据已有信息，对即将发生的动作结果进行预测”；\n运动学信息：“对手的动作”、“器材的运动轨迹”、“队员之间的相对位置”；\n情境先验信息：“比赛情境中事件发生的概率”。\n第二步：逐一分析选项。\nA项：篮球队员甲，符合“运动员”，根据对手今日比赛罚篮命中率不高，在对手投篮时选择直接犯规，即预测犯规后对手会罚篮不中，符合“在比赛过程中”、“根据已有信息，对即将发生的动作结果进行预测”、“比赛情境中事件发生的概率”，符合“情境先验信息”定义，排除；\nB项：网球运动员乙知道对手在比赛前有一系列习惯性动作，不符合“在比赛过程中”，且乙是暗自提醒自己不要被干扰，未利用这些信息进行预测，不符合“对即将发生的动作结果进行预测”，不符合“动作预期”定义，进而也不符合“运动学信息”定义和“情境先验信息”定义，当选；\nC项：羽毛球双打运动员丙，符合“运动员”，根据对方准备接发球的球员位置稍微靠前，预测对方来不及转身或后退接球，符合“在比赛过程中”、“根据已有信息，对即将发生的动作结果进行预测”、“比赛情境中事件发生的概率”，符合“情境先验信息”定义，排除；\nD项：乒乓球运动员丁，符合“运动员”，根据对方发过来的球位置较低、速度较慢，预测球会擦网变线，符合“在比赛过程中”、“根据已有信息，对即将发生的动作结果进行预测”、“器材的运动轨迹”、“比赛情境中事件发生的概率”，符合“运动学信息”定义，也符合“情境先验信息”定义，排除。\n本题为选非题，故正确答案为B。","no":98,"missingImage":false},{"qid":"19526303","cat":"定义判断","stem":"在民法理论上，可以将条件划分为随意条件、混合条件与偶成条件。随意条件又分为纯粹随意条件和非纯粹随意条件。纯粹随意条件的成就与否完全由一方当事人的意思决定；非纯粹随意条件的成就与否除一方当事人的意思外，尚须另一方当事人发生某种事件；混合条件的成就与否取决于一方当事人与第三人的意思；偶成条件的成就与否无关当事人的意思，但可能受制于第三人的意思。\n根据上述定义，下列属于混合条件的是：","options":{"A":"小王与爸爸约定，如果小王考上的研究生院校让爸爸满意，爸爸就资助其旅游经费","B":"某店铺与供应商约定，如果三伏的第一天下雨，则今年的雨伞就多进货30%","C":"甲厂与乙厂约定，如果甲厂能与丙公司签订承揽合同，甲厂就在乙厂购置原料板材","D":"小李与哥哥约定，如果小李能在开学前考取驾照，哥哥就把现在开的这台车赠送给小李"},"answer":"C","explanation":"第一步：找出定义关键词。\n纯粹随意条件：“成就与否完全由一方当事人的意思决定”；\n非纯粹随意条件：“成就与否除一方当事人的意思外，尚须另一方当事人发生某种事件”；\n混合条件：“成就与否取决于一方当事人与第三人的意思”；\n偶成条件：“成就与否无关当事人的意思，但可能受制于第三人的意思”。\n第二步：逐一分析选项。\nA项：小王与爸爸约定，如果小王考上的研究生院校让爸爸满意，爸爸就资助其旅游经费，双方约定的达成完全取决于爸爸是否满意，符合“成就与否完全由一方当事人的意思决定”，符合“纯粹随意条件”定义，不符合“混合条件”定义，排除；\nB项：某店铺与供应商约定，如果三伏的第一天下雨，则今年的雨伞就多进货30%，是否多进货30%取决于天气，与双方当事人无关，符合“成就与否无关当事人的意思，但可能受制于第三人的意思”，符合“偶成条件”定义，不符合“混合条件”定义，排除；\nC项：甲厂与乙厂约定，如果甲厂能与丙公司签订承揽合同，甲厂就在乙厂购置原料板材，甲厂与乙厂达成合作，需要甲厂（一方当事人）有签订意愿，丙公司（第三人）同意签订，符合“成就与否取决于一方当事人与第三人的意思”，符合“混合条件”定义，当选；\nD项：小李与哥哥约定，如果小李能在开学前考取驾照，哥哥就把现在开的这台车赠送给小李，哥哥有赠送车给小李的意愿，且需要小李在开学前考取驾照，符合“成就与否除一方当事人的意思外，尚须另一方当事人发生某种事件”，符合“非纯粹随意条件”定义，不符合“混合条件”定义，排除。\n故正确答案为C。","no":99,"missingImage":false},{"qid":"19526309","cat":"定义判断","stem":"分项累进淘汰法是指在对植株进行选种时，根据性状的相对重要性顺序排列，先按第一重要性状进行选择，然后在入选株内按第二重要性状进行选择，依此顺次累进的一种选种方法。\n根据上述定义，下列对南瓜的选种方法属于分项累进淘汰法的是：","options":{"A":"按株选目标性状出现的先后顺序，先淘汰蔓生植株，然后淘汰第一雌花节位高的植株，再淘汰单瓜重量低的植株","B":"首先在群体内选择无病植株，再在这些无病植株内选择丰产性好的植株，再根据产量性状顺次进行选择","C":"在收获时按照果实的大小、果型等性状初选，在初选瓜内再按照综合性状入选标准进行复选","D":"将需要鉴定的性状，如蔓长、单瓜重、果实籽粒数、籽粒长等，分别规定一个最低的入选标准，将低于入选标准的淘汰"},"answer":"B","explanation":"第一步：找出定义关键词。\n“根据性状的相对重要性顺序排列进行选择”、“先按第一重要性状进行选择，然后在入选株内按第二重要性状进行选择”、“顺次累进”。\n第二步：逐一分析选项。\nA项：按株选目标性状出现的先后顺序进行淘汰，并非根据性状的相对重要性顺序排列进行选择，不符合“根据性状的相对重要性顺序排列进行选择”，不符合定义，排除；\nB项：群体内的植株中无病是存活的基础，是第一重要性状，丰产性好体现经济价值，是第二重要性状，再根据产量性状顺次进行选择，在群体内先选择无病植株，再在这些无病植株内选择丰产性好的植株，最后根据产量性状顺次进行选择，是根据性状的相对重要性顺序排列进行选择，符合“根据性状的相对重要性顺序排列进行选择”、“先按第一重要性状进行选择，然后在入选株内按第二重要性状进行选择”、“顺次累进”，符合定义，当选；\nC项：按照果实的大小、果型等性状初选，没有明确体现第一重要性状，且再按照综合性状入选标准进行复选，并非按照性状的相对重要性顺序排列进行选择，不符合“根据性状的相对重要性顺序排列进行选择”、“先按第一重要性状进行选择，然后在入选株内按第二重要性状进行选择”，不符合定义，排除；\nD项：将需要鉴定的多个性状分别规定最低的入选标准，将低于入选标准的淘汰，没有明确体现性状的重要性顺序，并非按照性状的相对重要性顺序排列进行选择，不符合“根据性状的相对重要性顺序排列进行选择”、“先按第一重要性状进行选择，然后在入选株内按第二重要性状进行选择”，不符合定义，排除。\n故正确答案为B。","no":100,"missingImage":false},{"qid":"19526246","cat":"类比推理","stem":"与“经年：积岁”在逻辑关系上最相近的是：","options":{"A":"善本：版本","B":"秘方：偏方","C":"仲夏：夏季","D":"黎民：百姓"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“经年”指经过一年或若干年，“积岁”指累积多年，二者均可指经过多年，为近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：“善本”指古代书籍中文字讹误较少、学术或艺术价值上比一般本子优异的刻本或写本，“版本”指同一部书因编辑、传抄、刻版、排版或装订形式等的不同而产生的不同的本子，“善本”是“版本”的一种类型，二者不是近义关系，与题干逻辑关系不一致，排除；\nB项：“秘方”指不公开的有显著医疗效果的药方，“偏方”指民间流传不见于古典医学著作的中药方，前者从是否公开角度划分，后者从是否正规角度划分，二者为交叉关系，与题干逻辑关系不一致，排除；\nC项：“仲夏”指夏季的第二个月，是“夏季”的一部分，二者为组成关系，与题干逻辑关系不一致，排除；\nD项：“黎民”指平民、民众，“百姓”指军人和官员以外的人，二者均可指普通民众，为近义关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":101,"missingImage":false},{"qid":"19526290","cat":"类比推理","stem":"与“口腔：唾液：淀粉酶”在逻辑关系上最相近的是：","options":{"A":"种子：孜然：调味品","B":"叶片：叶肉：叶绿体","C":"松树：松脂：树脂醇","D":"试剂：试纸：pH试纸"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n唾液是口腔的分泌物，前两词是对应关系，淀粉酶是唾液的组成成分，后两词是组成关系。\n第二步：判断选项词语间逻辑关系。\nA项：孜然是一种常用的中草药，其种子可以制作为调味品，与题干逻辑关系不一致，排除；\nB项：叶肉是叶片的组成部分，前两词是组成关系，与题干逻辑关系不一致，排除；\nC项：松脂是松树的分泌物，前两词是对应关系，树脂醇是松脂的组成成分，后两词是组成关系，与题干逻辑关系一致，当选；\nD项：试纸是一种浸渍化学试剂的纸质检测工具，试剂和试纸是配套使用的对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":102,"missingImage":false},{"qid":"19526272","cat":"类比推理","stem":"与“护士人数：护患比：患者人数”在逻辑关系上最相近的是：","options":{"A":"理赔总额：平均理赔金额：理赔次数","B":"签收率：实际签收数量：应签收数量","C":"流动资产：流动负债：流动比率","D":"旅客数：入住率：客房数"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n护患比=护士人数/患者人数，三者满足公式关系。\n第二步：判断选项词语间逻辑关系。\nA项：平均理赔金额=理赔总额/理赔次数，与题干逻辑关系一致，当选；\nB项：签收率=实际签收数量/应签收数量，但词语顺序与题干不一致，排除；\nC项：流动比率=流动资产/流动负债，但词语顺序与题干不一致，排除；\nD项：入住率=入住客房数/客房数，而入住客房数\u003cimg data-k=\"645831205161\">旅客数，每间客房入住的旅客数可能不同，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":103,"missingImage":false},{"qid":"19526255","cat":"类比推理","stem":"颅内疾病 对于 （    ） 相当于 （    ） 对于 岩石断裂\n依次填入括号中最恰当的是：","options":{"A":"颅内感染；岩石熔融","B":"机体疾病；地壳应力","C":"核磁共振；地下采样","D":"视野缺失；冰川运动"},"answer":"D","explanation":"逐一代入选项。\nA项：颅内感染是颅内疾病的一种，二者为种属关系；岩石熔融和岩石断裂是两种不同的地质现象，二者为并列关系，前后逻辑关系不一致，排除；\nB项：颅内疾病是机体疾病的一种，二者为种属关系；地壳应力是导致岩石断裂的原因，二者为因果关系，前后逻辑关系不一致，排除；\nC项：核磁共振是用来诊断颅内疾病的方法，二者为诊断方法与疾病的对应关系；地下采样可以判断岩石是否有断裂，但顺序反了，前后逻辑关系不一致，排除；\nD项：颅内疾病会导致视野缺失，二者为因果对应关系；冰川运动会导致岩石断裂，二者为因果对应关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":104,"missingImage":false},{"qid":"19526268","cat":"逻辑判断","stem":"如果用一个圆来表示词语所指称的对象的集合，那么以下哪项中画横线词语之间的关系符合下图？\n\u003cimg data-k=\"8eadecc3b7bf\" style=\"max-width:274px\">","options":{"A":"船舶按用途分为\u003cu>军用船舶\u003c/u>（①）和民用船舶两大类，潜艇、\u003cu>航空母舰\u003c/u>（③）、驱逐舰等都属于军用船舶；按推进动力分为机动船和\u003cu>非机动船\u003c/u>（②）","B":"\u003cu>水杉\u003c/u>（③）是我国的特有树种，属于\u003cu>落叶树\u003c/u>（①），是一种高大的\u003cu>乔木\u003c/u>（②），是世界上珍稀的“活化石”植物","C":"图书按照读者群可分为\u003cu>少儿读物\u003c/u>（③）和成人读物等；按照载体可分为纸质书和\u003cu>电子书\u003c/u>（②）等；按照学科可分为历史书、文学书和\u003cu>哲学书\u003c/u>（①）等","D":"大熊猫属于\u003cu>哺乳动物\u003c/u>（①），是\u003cu>中国特有动物\u003c/u>（②），被列为\u003cu>中国国家一级保护野生动物\u003c/u>（③）"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n根据题干图形可知，①和②是交叉关系；③属于①，③和①是种属关系；③属于②，③和②是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：航空母舰（③）是指军队专用的机动船只，与非机动船（②）不是种属关系，与题干逻辑关系不一致，排除；\nB项：落叶树（①）和乔木（②）是交叉关系；水杉（③）属于落叶树（①），③和①是种属关系；水杉（③）属于乔木（②），③和②是种属关系，与题干逻辑关系一致，当选；\nC项：少儿读物（③）和电子书（②）是交叉关系，不是种属关系，与题干逻辑关系不一致，排除；\nD项：中国国家一级保护野生动物（③）和哺乳动物（①）是交叉关系，不是种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":105,"missingImage":false},{"qid":"19526315","cat":"逻辑判断","stem":"考古人员在某地发掘出一些似鸟动物化石，同位素测年显示这些动物生存于中侏罗世晚期（距今1.72亿～1.64亿年）。经考古推算，这些似鸟动物体型与现代鸟类大致接近，尾巴很短，最重要的是它们都具有愈合的尾综骨。考古人员据此认为，这些动物一定属于鸟类。\n以下哪项最有可能是考古人员论证的前提？","options":{"A":"这些似鸟动物长有与现代鸟类相似的脚骨，可以在陆地上行走","B":"这些化石保存了诸如肩胛骨、乌喙骨、尾综骨等骨骼，形态清晰","C":"鸟类与爬行动物最显著的区别就是鸟类最后几枚尾椎愈合成为尾综骨","D":"尾综骨结构的出现对似鸟动物后肢和尾骨的独立运动及飞行能力的完善至关重要"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：这些动物一定属于鸟类。\n论据：这些似鸟动物体型与现代鸟类大致接近，尾巴很短，最重要的是它们都具有愈合的尾综骨。\n本题论点讨论的是这些似鸟动物属于鸟类，论据讨论的是这些似鸟动物有愈合的尾综骨，二者话题不一致，加强优先考虑搭桥，即在“鸟类”和“愈合的尾综骨”之间建立联系。\n第二步：逐一分析选项。\nA项：该项指出这些似鸟动物与现代鸟类具有相似的脚骨，但是不明确脚骨是否能够判断这些似鸟动物为鸟类，属于不明确选项，无法加强，排除；\nB项：该项强调这些化石保存的尾综骨等形态清晰，说明这些动物确实具有尾综骨，可以加强论据，但不是论证成立的前提，排除；\nC项：该项指出鸟类与爬行动物的显著区别是鸟类最后几枚尾椎愈合成为尾综骨，建立了“鸟类”和“愈合的尾综骨”之间的联系，为搭桥项，是论证成立的前提，当选； \nD项：该项强调尾综骨结构对似鸟动物独立运动以及飞行能力的重要性，但不能判断其是否属于鸟类，属于不明确选项，无法加强，排除。\n故正确答案为C。","no":106,"missingImage":false},{"qid":"19526262","cat":"逻辑判断","stem":"S遗址近年来出土了大量与众不同的奇特文物，不少人认定S遗址展现了一个特色鲜明且区域封闭的南部地方文化。然而最新研究发现，在距离S遗址较远的北部Y遗址，出土的青铜器曾大量使用了来自S遗址附近矿床的铅铜矿料，在S遗址文化消亡后，Y遗址出土的青铜器基本不再含有这种矿料。这说明S遗址不是封闭区域，其所在的古国曾与Y遗址的古国或其他区域存在着交流互动。\n以下哪项如果为真，没有支持上述结论？","options":{"A":"S遗址的青铜器制造业在当时非常发达，出土的青铜器含有多种不同的铅铜矿料","B":"随着考古发掘的深入，S遗址出土了越来越多带有明显Y遗址文化元素的青铜器","C":"在铸造工艺上，S遗址出土的部分文物采用了Y遗址多见的“泥模块铸法”","D":"原本流行于东部地区的牙璋、铜牌饰、陶盉等也在位于南部的S遗址中大量出现"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：S遗址不是封闭区域，其所在的古国曾与Y遗址的古国或其他区域存在着交流互动。\n论据：在距离S遗址较远的北部Y遗址，出土的青铜器曾大量使用了来自S遗址附近矿床的铅铜矿料，在S遗址文化消亡后，Y遗址出土的青铜器基本不再含有这种矿料。\n本题为选非题，将可以加强的选项排除即可。\n第二步：逐一分析选项。\nA项：该项说的是S遗址的青铜器制造业在当时非常发达，但没有说明S遗址是否和其他区域存在交流互动，无法加强，当选；\nB项：该项说的是S遗址出土了很多带有明显Y遗址文化元素的青铜器，说明S遗址所在的古国与Y遗址的古国存在着交流互动，补充论据，可以加强，排除；\nC项：该项说的是S遗址出土的部分文物采用了Y遗址多见的“泥模块铸法”，说明S遗址所在的古国与Y遗址的古国存在着交流互动，补充论据，可以加强，排除；\nD项：该项说的是原本流行于东部地区的牙璋、铜牌饰、陶盉等也在位于南部的S遗址中大量出现，说明S遗址所在的古国与其他区域存在着交流互动，补充论据，可以加强，排除。\n本题为选非题，故正确答案为A。","no":107,"missingImage":false},{"qid":"19526297","cat":"逻辑判断","stem":"完善城乡融合发展体制机制是破除我国城乡二元结构、拓展高质量发展空间的必要举措。只有完善农业农村优先发展的投入保障机制，并且优化城乡公共资源配置机制，才能完善城乡融合发展体制机制。只有加大中央预算内投资和地方政府专项债券支持力度，并且提高土地出让收入用于农业农村的比例，才能完善农业农村优先发展的投入保障机制。只有推进户籍制度改革，才能优化城乡公共资源配置机制。\n由此可以推出的是（    ）。","options":{"A":"如果推进户籍制度改革，就能优化城乡公共资源配置机制","B":"只要完善农业农村优先发展的投入保障机制，就能完善城乡融合发展体制机制","C":"除非完善农业农村优先发展的投入保障机制，否则不能提高土地出让收入用于农业农村的比例","D":"加大中央预算内投资和地方政府专项债券支持力度是破除我国城乡二元结构、拓展高质量发展空间的必要前提"},"answer":"D","explanation":"第一步：翻译题干。\n①破除我国城乡二元结构、拓展高质量发展空间\u003cimg data-k=\"a37757d411ef\">完善城乡融合发展体制机制；\n②完善城乡融合发展体制机制\u003cimg data-k=\"a37757d411ef\">完善农业农村优先发展的投入保障机制 且 优化城乡公共资源配置机制；\n③完善农业农村优先发展的投入保障机制\u003cimg data-k=\"a37757d411ef\">加大中央预算内投资和地方政府专项债券支持力度 且 提高土地出让收入用于农业农村的比例；\n④优化城乡公共资源配置机制\u003cimg data-k=\"a37757d411ef\">推进户籍制度改革。\n①②③可串联得到：⑤破除我国城乡二元结构、拓展高质量发展空间\u003cimg data-k=\"a37757d411ef\">完善城乡融合发展体制机制\u003cimg data-k=\"a37757d411ef\">完善农业农村优先发展的投入保障机制\u003cimg data-k=\"a37757d411ef\">加大中央预算内投资和地方政府专项债券支持力度 且 提高土地出让收入用于农业农村的比例；\n①②④可串联得到：⑥破除我国城乡二元结构、拓展高质量发展空间\u003cimg data-k=\"a37757d411ef\">完善城乡融合发展体制机制\u003cimg data-k=\"a37757d411ef\">优化城乡公共资源配置机制\u003cimg data-k=\"a37757d411ef\">推进户籍制度改革。\n第二步：逐一分析选项。\nA项：该项翻译为“推进户籍制度改革\u003cimg data-k=\"a37757d411ef\">优化城乡公共资源配置机制”，是对④的肯后，肯后得不到确定性的结论，无法推出，排除；\nB项：该项翻译为“完善农业农村优先发展的投入保障机制\u003cimg data-k=\"a37757d411ef\">完善城乡融合发展体制机制”，是肯定②箭头后“且关系”中的一部分，肯后得不到确定性的结论，不能推出，排除；\nC项：该项翻译为“提高土地出让收入用于农业农村的比例\u003cimg data-k=\"a37757d411ef\">完善农业农村优先发展的投入保障机制”，是肯定③箭头后“且关系”中的一部分，肯后得不到确定性的结论，不能推出，排除；\nD项：该项翻译为“破除我国城乡二元结构、拓展高质量发展空间\u003cimg data-k=\"a37757d411ef\">加大中央预算内投资和地方政府专项债券支持力度”，是对⑤的肯前，肯前必肯后，可以推出，当选。\n故正确答案为D。","no":108,"missingImage":false},{"qid":"19526265","cat":"逻辑判断","stem":"平台企业依赖金融资本投资，需要迎合金融市场的估值逻辑，通过轻资产运营、扩大市场规模和用户数据挖掘与开发等，来提升自身在金融市场上的估值。随着平台企业金融化程度的日益加深，平台劳动者的具体劳动和生产过程也在发生变化。研究者认为，平台企业金融化程度的加深使得平台劳动者的劳动权益保护问题日益突出。\n以下哪项如果为真，最能支持上述研究者的观点？","options":{"A":"为扩大市场规模、争夺消费者注意力，平台企业在资金投入和服务提升方面容易陷入无序竞争","B":"为塑造轻资产企业形象、摆脱劳动密集型标签，平台企业采用弹性用工制，增加劳动者就业不稳定性","C":"越来越多的平台企业日益注重用户数据挖掘，以增加企业竞争力，为此更加注重员工培训","D":"部分平台企业以缴纳保证金、押金或其他名义向劳动者收取财物，限制劳动者在多平台就业"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：平台企业金融化程度的加深使得平台劳动者的劳动权益保护问题日益突出。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：选项指出为扩大市场规模、争夺消费者注意力，平台企业容易陷入无序竞争，与论点讨论的平台企业金融化程度加深是否会导致平台劳动者的劳动权益保护问题日益突出无关，无关项，无法加强，排除；\nB项：选项指出为塑造轻资产企业形象、摆脱劳动密集型标签，说明平台企业金融化程度在加深，平台企业采用弹性用工制，增加劳动者就业不稳定性，说明平台劳动者的具体劳动和生产过程发生了变化，且增加了平台劳动者的劳动权益保护问题，补充论据，可以加强，当选；\nC项：选项指出平台企业越来越注重员工培训，与论点讨论的平台企业金融化程度加深是否会导致平台劳动者的劳动权益保护问题无关，无关项，无法加强，排除；\nD项：选项指出部分平台企业以缴纳保证金、押金或其他名义向劳动者收取财物，限制劳动者在多平台就业，但是不明确这些平台是否存在企业金融化程度的加深，不明确选项，无法加强，排除。\n故正确答案为B。","no":109,"missingImage":false},{"qid":"19526266","cat":"逻辑判断","stem":"一项针对中学生的研究发现：直接使用通用AI工具可短暂提高学生数学测试成绩，但最终削弱了学生的数学学习能力。研究持续一学期，学生被分为三组，分别在课堂练习阶段使用不同工具：①组使用标准课本和笔记；②组使用通用AI工具，可以直接查询答案；③组使用特别设计的AI工具，指导而不直接给出答案。随堂考核发现，②组和③组学生比①组学生的成绩高出48％和127％。但期末考试时，②组比①组成绩低了17%；而③组和①组无明显差异。\n以下除哪项外，均能削弱上述结论？","options":{"A":"研究中未对学生做AI工具使用培训，研究结果不能说明正确使用AI工具的效果","B":"学生的数学基础水平、学习动机、课后自主练习等变量都会影响考试成绩","C":"研究仅针对数学学科，不能说明AI工具辅助教学对其他学科的影响","D":"研究持续时间不够，不足以说明长期使用AI工具可能带来的效果"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：直接使用通用AI工具可短暂提高学生数学测试成绩，但最终削弱了学生的数学学习能力。\n论据：研究持续一学期，学生被分为三组，分别在课堂练习阶段使用不同工具：①组使用标准课本和笔记；②组使用通用AI工具，可以直接查询答案；③组使用特别设计的AI工具，指导而不直接给出答案。随堂考核发现，②组和③组学生比①组学生的成绩高出48％和127％。但期末考试时，②组比①组成绩低了17%；而③组和①组无明显差异。\n本题论点和论据都在讨论使用AI工具对数学学习能力的影响，二者话题一致，且本题为削弱选非题，排除能削弱的选项即可。\n第二步：逐一分析选项。\nA项：该项指出研究结果不能说明正确使用AI工具的效果，说明实验过程存在漏洞，质疑了实验结果，削弱论据，可以削弱，排除；\nB项：该项指出学生的数学基础水平、学习动机、课后自主练习等变量都会影响考试成绩，说明存在其他会影响学生成绩的因素，他因削弱，可以削弱，排除；\nC项：该项指出本研究无法说明AI工具辅助教学对其他学科的影响，即使用AI工具对学生学习能力的影响范围有限，但不清楚使用AI工具是否会削弱学生的数学学习能力，无法削弱，当选；\nD项：该项指出研究持续时间不够，不足以说明长期使用AI工具可能带来的效果，说明实验过程存在漏洞，质疑了实验结果，削弱论据，可以削弱，排除。\n本题为选非题，故正确答案为C。","no":110,"missingImage":false}]}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"85aa57f35864\" style=\"max-width:590px\">\u003c/p>","questions":[{"qid":"19526212","cat":"增长","stem":"2024年上半年，中国医药保健品进出口贸易顺差（出口额-进口额）比上年同期：","options":{"A":"下降了20%以上","B":"下降了不到20%","C":"上升了20%以上","D":"上升了不到20%"},"answer":"C","explanation":"根据题干“2024年上半年······顺差（出口额-进口额）比上年同期”，结合选项为百分数，且出口额=进口额+顺差，可判定本题为混合增长率问题。定位统计表可得：2024年上半年，中国医药保健品进、出口额分别为451.76亿美元、525.79亿美元，同比增长率分别为-5.76%、1.96%。根据混合增长率口诀“混合后居中但不正中”可得，进口额增长率（-5.76%）＜出口额增长率（1.96%）＜顺差增长率，排除A、B两项。\n2024年上半年中国医药保健品进出口贸易顺差\u003cimg data-k=\"0105edf1db5f\">亿美元，根据线段法：距离与量成反比（一般用现期量代替基期量计算），可得：\u003cimg data-k=\"044909da373e\">\u003cimg data-k=\"ad8e762f7c38\">，解得：\u003cimg data-k=\"4269c67c6041\">，在C项范围内。\n故正确答案为C。","no":111,"missingImage":false},{"qid":"19526213","cat":"比重","stem":"2024年上半年，中药提取物出口额占医药保健品出口总额的比重比上年同期：","options":{"A":"上升了3个百分点以上","B":"下降了3个百分点以上","C":"上升了不到3个百分点","D":"下降了不到3个百分点"},"answer":"D","explanation":"根据题干“2024年上半年······占······的比重比上年同期”，结合选项为上升了/下降了+百分点，可判定本题为两期比重问题。定位统计表可得：2024年上半年中国医药保健品出口总额为525.79亿美元（B），同比增长1.96%（b）；中药提取物出口额为14.92亿美元（A），同比增长-14.28%（a）。根据公式：两期比重差\u003cimg data-k=\"12ad841084d3\">，则题干所求为\u003cimg data-k=\"902c31733768\">\u003cimg data-k=\"4bad7599d42c\">\u003cimg data-k=\"f80d25f51cc5\">，即约下降了0.53个百分点。在D项范围内。\n故正确 <script>
(function(){
"use strict";
var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){
  var base=(window.__EXAM__&&window.__EXAM__.imgBase)||"";
  return base+((window.__IMGS__ && window.__IMGS__[k]) || "");
}
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
