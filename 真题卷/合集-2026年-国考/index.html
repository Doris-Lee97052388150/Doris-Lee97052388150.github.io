1221亿元。观察发现，铜材进口值&gt;原油进口值，排除A、C项。根据公式：比重\u003cimg data-k=\"155c064d29d7\">，则2024年铜材进口值占进口值的比重\u003cimg data-k=\"89eba1ce675a\">，排除D项。 \n故正确答案为B。","no":133,"missingImage":false},{"qid":"19526370","cat":"综合","stem":"2023年1~11月，我国对最不发达国家月均进口值约为多少亿元？","options":{"A":"395","B":"409","C":"468","D":"502"},"answer":"B","explanation":"根据题干“2023年1~11月······月均进口值约为多少亿元”，结合材料时间为2024年，可判定本题为基期平均数问题。定位文字材料第一段可得：2024年，我国对最不发达国家进口5565.5亿元，增长12.8%；定位文字材料第四段可得：2024年12月，我国自最不发达国家进口512.7亿元，增长18.1%。根据公式：基期量\u003cimg data-k=\"51e165712c75\">，可得2023年1-11月我国对最不发达国家进口值为\u003cimg data-k=\"74b281c10913\">\u003cimg data-k=\"42a136f22455\">\u003cimg data-k=\"5fa762b4d0f7\">亿元，则2023年1~11月我国对最不发达国家月均进口值为\u003cimg data-k=\"e793f871acb3\">亿元，与B项最接近。\n故正确答案为B。","no":134,"missingImage":false},{"qid":"19526374","cat":"综合","stem":"关于2024年我国进出口情况，能根据上述资料推出的是：","options":{"A":"铜材进口总值不到3000亿元","B":"我国对最不发达国家火车出口值同比增量高于对其工程机械出口值同比增量","C":"劳动密集型产品出口值占我国最不发达国家出口总值的比重高于上年水平","D":"12月自刚果民主共和国、几内亚、老挝、赞比亚的进口总值超过当月我国自最不发达国家进口总值的一半"},"answer":"D","explanation":"A项：定位文字材料第三段可得：2024年，我国自最不发达国家进口铜材1469.6亿元。但材料未给出我国进口铜材的具体值，无法计算，错误；\nB项：定位文字材料第二段可得：2024年，我国对最不发达国家出口工程机械、火车分别为165.3亿元、91.6亿元，分别增长28.9%、39.5%。根据公式：增长量\u003cimg data-k=\"32c4dfbf6ea2\">，可得2024年我国对最不发达国家出口工程机械同比增量\u003cimg data-k=\"1178c93d69cc\">亿元，对最不发达国家出口火车同比增量\u003cimg data-k=\"55fcb2010c86\">亿元，则2024年我国对最不发达国家火车出口值同比增量（26亿元）低于对其工程机械出口值同比增量（37亿元），错误；\nC项：定位文字材料第一段可得：2024年，我国对最不发达国家出口总值为8664.6亿元，同比增长4.3%（b）；定位文字材料第二段可得：2024年，我国对最不发达国家出口劳动密集型产品2481亿元，增长3.7%（a）。根据两期比重结论：a&gt;b，比重上升。由于a（3.7%）&lt;b（4.3%），故比重低于上年水平，错误；\nD项：定位文字材料最后一段可得：2024年12月，我国自最不发达国家进口512.7亿元，其中自刚果民主共和国、几内亚、老挝、赞比亚分别进口156.3亿元，54.7亿元，35.6亿元，33.9亿元。根据公式：比重\u003cimg data-k=\"155c064d29d7\">，可得所求\u003cimg data-k=\"5c68e8e13a60\">，即占比超过一半，正确。\n故正确答案为D。","no":135,"missingImage":false}]}],"count":20,"answerable":20,"pointsOf":16}],"total":135,"affected":[],"subtitle":"2026年 · 国考 · 6/6 模块"},{"slug":"2026-国考-地市级","title":"2026年国家公务员录用考试《行测》题（地市级网友回忆版）","year":"2026","group":"国考","modules":[{"label":"政治理论","items":[{"type":"question","qid":"19526238","cat":"新思想","stem":"习近平总书记强调，必须坚持自信自立。中国人民和中华民族从近代以后的深重苦难走向伟大复兴的光明前景，从来就没有教科书，更没有现成答案。关于坚持自信自立，下列表述正确的有几项？\n①走自己的路，是党的全部理论和实践立足点，更是党百年奋斗得出的历史结论\n②推进中国式现代化，必须坚持把国家和民族发展放在自己力量的基点上\n③中国式现代化既要物质财富极大丰富，也要精神财富极大丰富、在思想文化上自信自强\n④独立自主是中华民族的优良传统，是中国共产党、中华人民共和国立党立国的重要原则","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查理论与政策。\n①正确，2021年7月1日，习近平总书记在庆祝中国共产党成立100周年大会上的重要讲话中指出：“以史为鉴、开创未来，必须坚持和发展中国特色社会主义。走自己的路，是党的全部理论和实践立足点，更是党百年奋斗得出的历史结论······”\n②正确，2023年2月7日，习近平总书记在新进中央委员会的委员、候补委员和省部级主要领导干部学习贯彻习近平新时代中国特色社会主义思想和党的二十大精神研讨班开班式上的讲话中指出：“推进中国式现代化，必须坚持独立自主、自立自强，坚持把国家和民族发展放在自己力量的基点上，坚持把我国发展进步的命运牢牢掌握在自己手中。”\n③正确，2023年2月7日，习近平总书记在新进中央委员会的委员、候补委员和省部级主要领导干部学习贯彻习近平新时代中国特色社会主义思想和党的二十大精神研讨班上的讲话中指出：“中国式现代化既要物质财富极大丰富，也要精神财富极大丰富、在思想文化上自信自强。”\n④正确，2013年12月26日，习近平总书记在纪念毛泽东同志诞辰120周年座谈会上的讲话中指出：“独立自主是中华民族的优良传统，是中国共产党、中华人民共和国立党立国的重要原则。在中国这样一个人口众多和经济文化落后的东方大国进行革命和建设的国情与使命，决定了我们只能走自己的路。”\n故正确的有①②③④，共4项。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"19526244","cat":"新思想","stem":"习近平总书记强调，科学制定和接续实施五年规划，是我们党治国理政一条重要经验，也是中国特色社会主义一个重要政治优势。关于五年规划编制工作，下列说法正确的是：","options":{"A":"我国五年规划（计划）编制工作起始于1949年，有力推动了经济社会发展、综合国力提升、人民生活改善","B":"中长期发展规划有助于充分发挥政府在资源配置中的决定性作用，彰显了政府对经济社会发展的宏观调控能力","C":"从第一个五年计划到当前的五年规划，一以贯之的主题是把我国建设成为社会主义现代化国家","D":"通过互联网就“十五五”规划编制向全社会征求意见和建议，在我国五年规划编制史上是第一次"},"answer":"C","explanation":"本题考查理论与政策。\n2025年6月16日出版的第12期《求是》杂志发表了习近平总书记的重要文章《用中长期规划指导经济社会发展是我们党治国理政的一种重要方式》。这是习近平总书记2015年10月至2025年4月期间有关重要论述的节录。\nA、B两项错误，2020年8月24日，习近平总书记在经济社会领域专家座谈会上的讲话中指出：“用中长期规划指导经济社会发展，是我们党治国理政的一种重要方式。从1953年开始，我国已经编制实施了13个五年规划（计划），其中改革开放以来编制实施8个，有力推动了经济社会发展、综合国力提升、人民生活改善，创造了世所罕见的经济快速发展奇迹和社会长期稳定奇迹。实践证明，中长期发展规划既能充分发挥市场在资源配置中的决定性作用，又能更好发挥政府作用。”故A项“五年规划（计划）编制工作起始于1949年”表述有误，应为“1953年”；B项“政府在资源配置中的决定性作用”表述有误，应为“市场在资源配置中的决定性作用”。\nC项正确，2020年10月29日，习近平总书记在党的十九届五中全会第二次全体会议上的讲话中指出：“从第一个五年计划到第十四个五年规划，一以贯之的主题是把我国建设成为社会主义现代化国家。”\nD项错误，2020年9月25日，习近平总书记在对“十四五”规划编制工作网上意见征求活动的指示中指出：“通过互联网就‘十四五’规划编制向全社会征求意见和建议，在我国五年规划编制史上是第一次。这次活动效果很好，社会参与度很高，提出了许多建设性的意见和建议。”故第一次通过互联网向全社会征求意见和建议的并非“十五五”规划编制，而是“十四五”规划。\n故正确答案为C。","no":2,"missingImage":false},{"type":"question","qid":"19526249","cat":"新思想","stem":"建设文化强国，事关中国式现代化建设全局，事关中华民族复兴大业，事关提升国际竞争力，锚定2035年建成社会主义文化强国的战略目标，必须始终坚持文化建设着眼于人、落脚于人。下列有关说法正确的是：\n①文化强国之“强”最终要体现在为人民提供文化服务和文化产品的能力上\n②坚持以人民为中心，着眼满足人民群众多样化、多层次、多方面的精神文化需求\n③文化创造核心在人，要建设一支规模宏大、结构合理、锐意创新的高水平文化人才队伍\n④尊重人才成长规律，完善符合文化领域特点的人才选拔、培养、使用、激励机制，营造识才、重才、爱才的良好政策环境","options":{"A":"①②③","B":"②③④","C":"①②④","D":"①③④"},"answer":"B","explanation":"本题考查理论与政策。\n2025年4月16日，《求是》杂志发表习近平总书记重要文章《加快建设文化强国》（以下简称“文章”）。\n①错误，②正确，文章指出：“第三，始终坚持文化建设着眼于人、落脚于人。文化强国之‘强’最终要体现在人民的思想境界、精神状态、文化修养上。要坚持以人民为中心，着眼满足人民群众多样化、多层次、多方面的精神文化需求，提升文化服务和文化产品供给能力，增强人民群众文化获得感、幸福感。要重视发挥文化养心志、育情操的作用，涵养全民族昂扬奋发的精神气质。”故①“为人民提供文化服务和文化产品的能力”表述错误，应为“人民的思想境界、精神状态、文化修养”。\n③④正确，文章指出：“文化创造核心在人。要把育人才、建队伍作为重要而紧迫的战略任务，统筹各类人才培养，建设一支规模宏大、结构合理、锐意创新的高水平文化人才队伍。要尊重人才成长规律，建立健全科学权威、公开透明的文艺和学术评价体系，完善符合文化领域特点的人才选拔、培养、使用、激励机制，营造识才、重才、爱才的良好政策环境。”\n故②③④正确。\n故正确答案为B。","no":3,"missingImage":false},{"type":"question","qid":"19526254","cat":"时事政治","stem":"中共中央、国务院印发《加快建设农业强国规划（2024-2035年）》，提出面对新形势新要求，必须把加快建设农业强国作为统领“三农”工作的战略总纲，摆上建设社会主义现代化强国的重要位置，下列与加快建设农业强国有关的说法正确的是：","options":{"A":"推进生态综合补偿，健全横向生态保护补偿机制，统筹推进生态环境损害赔偿","B":"建立健全长江流域信息共享系统，推进长江流域农业深度节水控水","C":"完善粮食产销奖补制度，中央预算内投资向粮食主销区倾斜","D":"推进农业科技推广体系，从经营性向公益性转变"},"answer":"A","explanation":"本题考查理论与政策。\n2025年4月，中共中央、国务院印发了《加快建设农业强国规划（2024－2035年）》（以下简称《规划》）。\nA项正确，B项错误，《规划》在“五、全链条推进农业产业体系升级，提升农业综合效益”中指出：“（十八）加快推进农业全面绿色转型······推进农业面源污染综合防治，发展生态循环农业。健全山水林田湖草沙一体化保护和系统治理机制。实施好长江十年禁渔和海洋伏季休渔，推进黄河流域农业深度节水控水。建立农业生态环境保护监测制度。推进生态综合补偿，健全横向生态保护补偿机制，统筹推进生态环境损害赔偿。”故B项“建立健全长江流域信息共享系统”无中生有，“长江流域”表述错误，应为“黄河流域”。\nC项错误，《规划》在“二、全方位夯实粮食安全根基，把中国人的饭碗端得更牢更稳”中指出：“（三）健全粮食生产扶持政策······健全粮食主产区利益补偿机制，完善产粮大县奖补制度，中央预算内投资向粮食主产区倾斜，省级统筹的土地出让收入可按规定用于粮食主产区的高标准农田建设、现代种业提升等，统筹建立粮食产销区省际横向利益补偿机制。”故“完善粮食产销奖补制度，中央预算内投资向粮食主销区倾斜”表述错误，应为“完善产粮大县奖补制度，中央预算内投资向粮食主产区倾斜”。\nD项错误，《规划》在“三、全领域推进农业科技装备创新，加快实现高水平农业科技自立自强”中指出：“（六）加快农业科技创新水平整体跃升······加强农业知识产权保护和侵权打击。健全公益性和经营性相结合的农业科技推广体系，加强基层农技推广队伍建设。”故“推进农业科技推广体系，从经营性向公益性转变”表述错误，应为“健全公益性和经营性相结合的农业科技推广体系”。\n故正确答案为A。","no":4,"missingImage":false},{"type":"question","qid":"19526306","cat":"新思想","stem":"全面推进依法治国是一个系统工程，必须坚持法治国家、法治政府、法治社会一体建设。下列相关表述不准确的是：","options":{"A":"法治社会是构筑法治国家、法治政府的基础","B":"建设法治政府对建设法治社会具有重要引领和带动作用","C":"法治政府、法治社会建设必须服从、服务于法治国家建设","D":"法治国家是依法治国的主体，是法治社会建设的先导和示范"},"answer":"D","explanation":"本题考查理论与政策。\n2020年4月21日，人民日报发表《坚持法治国家、法治政府、法治社会一体建设》（以下简称文章）。\nA项正确，2020年11月16日，习总书记在中央全面依法治国工作会议上讲话中指出：“法治国家、法治政府、法治社会相辅相成，法治国家是法治建设的目标，法治政府是建设法治国家的重点，法治社会是构筑法治国家的基础。”\nB项正确，文章指出，法治政府是法治国家建设的主体和重点，是法治社会建设的先导和示范······建设法治政府对建设法治社会具有重要引领和带动作用。故D项“法治国家是依法治国的主体”表述错误，应为“法治政府是法治国家建设的主体和重点”。\nC项正确，文章指出，法治国家是法治政府、法治社会建设的目标，法治政府、法治社会建设必须服从、服务于法治国家建设。\nD项错误，2020年11月16日，习总书记在中央全面依法治国工作会议上讲话中指出：“我多次强调，推进全面依法治国，法治政府建设是重点任务和主体工程，对法治国家、法治社会建设具有示范带动作用，要率先突破。”且文章中指出，法治政府是法治社会建设的先导和示范。故“法治国家”表述错误，应该为“法治政府”。\n本题为选非题，故正确答案为D。\n（备注：D选项：2014年10月通过的《中共中央关于全面推进依法治国若干重大问题的决定》中指出：“坚持人民主体地位。人民是依法治国的主体和力量源泉······”但题目主要是在考查法治政府、法治国家和法治社会的关系。）","no":5,"missingImage":false},{"type":"question","qid":"19526283","cat":"时事政治","stem":"2025年7月，习近平总书记在中央城市工作会议上发表重要讲话，明确做好城市工作的总体要求、重要原则、重点任务，为做好新时代新征程的城市工作提供了根本遵循。关于城市工作，下列说法正确的是：","options":{"A":"要把握“我国城镇化正从快速增长期转向稳定发展期”的历史方位","B":"城市工作重心应向更加注重建设投入转变","C":"着力通过外延扩张发展组团式的现代化城市群和都市圈","D":"城市政府应从城市事务管理的“掌舵人”转变为“划桨人”"},"answer":"A","explanation":"本题考查理论与政策。\nA项正确，B项错误，2025年7月14日至15日，中央城市工作会议在北京举行。会议指出，我国城镇化正从快速增长期转向稳定发展期，城市发展正从大规模增量扩张阶段转向存量提质增效为主的阶段。城市工作要深刻把握、主动适应形势变化······转变城市工作重心，更加注重治理投入；转变城市工作方法，更加注重统筹协调。故B项“城市工作重心应向更加注重建设投入转变”表述错误，应为“城市工作重心应向更加注重治理投入转变”。\nC项错误，2025年7月14日至15日，中央城市工作会议在北京举行。会议部署城市工作7个方面的重点任务。一是着力优化现代化城市体系。着眼于提高城市对人口和经济社会发展的综合承载能力，发展组团式、网络化的现代化城市群和都市圈，分类推进以县城为重要载体的城镇化建设，继续推进农业转移人口市民化，促进大中小城市和小城镇协调发展，促进城乡融合发展。其次，会议指出，要以坚持城市内涵式发展为主线。故选项“着力通过外延扩张发展组团式的现代化城市群和都市圈”表述错误，应为“着力通过内涵式发展组团式、网络化的现代化城市群和都市圈”。\nD项错误，2015年12月20日，习近平总书记在中央城市工作会议上指出：“要尊重市民对城市发展决策的知情权、参与权、监督权，鼓励企业和市民通过各种方式参与城市建设、管理。在共建共享过程中，城市政府应该从‘划桨人’转变为‘掌舵人’，同市场、企业、市民一起管理城市事务、承担社会责任。”\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"19526299","cat":"新思想","stem":"经济工作千头万绪，必须统筹好有效市场和有为政府的关系、总供给和总需求的关系、培育新动能和更新旧动能的关系、做优增量和盘活存量的关系、提升质量和做大总量的关系。下列相关说法不准确的是：","options":{"A":"要加快推动作为经济增长和就业收入基本依托的传统产业改造升级","B":"要加快补上内需特别是消费短板，使内需成为拉动经济增长的主动力和稳定锚","C":"要坚持以量取胜、充分发挥规模效应，用好超大规模市场优势和丰富应用场景","D":"要用好各类增量资源和存量资源，通过盘活存量来带动增量"},"answer":"C","explanation":"本题考查理论与政策。\n2025年2月28日，《求是》杂志发表习近平总书记重要文章《经济工作必须统筹好几对重要关系》。\nA项正确，文章指出：“三是必须统筹好培育新动能和更新旧动能的关系，因地制宜发展新质生产力。要以科技创新为引领，大力培育壮大新兴产业和未来产业，占据国际竞争制高点，塑造经济发展新动能、新优势。同时，加快推动作为经济增长和就业收入基本依托的传统产业改造升级，使之焕发新的生机活力，推动新旧发展动能平稳接续转换。”\nB项正确，文章指出：“二是必须统筹好总供给和总需求的关系，畅通国民经济循环。要坚持供需两侧协同发力、动态平衡，持续深化供给侧结构性改革，有进有退、有保有压，增强供给与需求的适配性、平衡性。扩大内需既关系经济稳定，也关系经济安全，不是权宜之计，而是战略之举。要加快补上内需特别是消费短板，使内需成为拉动经济增长的主动力和稳定锚。”\nC项错误，文章指出：“五是必须统筹好提升质量和做大总量的关系，夯实中国式现代化的物质基础。我国拥有巨大的经济体量、市场容量和产业配套能力，是提升质量、做优做强的有利条件。我国人均国民收入尚未达到世界平均水平，发展不平衡不充分问题仍然突出。要坚持以质取胜和发挥规模效应相统一，用好超大规模市场优势和丰富应用场景，培育更多世界一流企业和领先技术，把质的有效提升和量的合理增长统一于高质量发展的全过程。”故“要坚持以量取胜、充分发挥规模效应”表述有误，应为“要坚持以质取胜和发挥规模效应相统一”。\nD项正确，文章指出：“四是必须统筹好做优增量和盘活存量的关系，全面提高资源配置效率。经过长期发展，我国需要同时加强资产管理和负债管理，统筹用好各类增量资源和存量资源，善于通过盘活存量来带动增量。要持续推动产业园区‘腾笼换鸟’，用好置换存量隐性债务、盘活存量土地等政策，统筹做优增量和盘活存量、管好资产和调整负债，拓展新的发展空间。”\n本题为选非题，故正确答案为C。","no":7,"missingImage":false},{"type":"question","qid":"19526284","cat":"时事政治","stem":"2025年7月30日，中共中央政治局召开会议，对扎实做好民生保障工作作了重要部署。下列相关表述不准确的是（    ）。","options":{"A":"巩固拓展脱贫攻坚成果，确保不发生规模性返贫致贫","B":"夯实“三农”基础，推动粮食和重要农产品价格保持在合理水平","C":"突出就业优先政策导向，促进高校毕业生、退役军人、农民工等重点群体就业","D":"始终把人民群众财产安全放在第一位，加强安全生产监管"},"answer":"D","explanation":"本题考查理论与政策。\n2025年7月30日，中共中央政治局召开会议，决定召开二十届四中全会，分析研究当前经济形势和经济工作，中共中央总书记习近平主持会议。\nA项正确，会议指出，要扎实推进乡村全面振兴，巩固拓展脱贫攻坚成果，确保农村人口不发生规模性返贫致贫。要加强耕地保护和质量提升，抓好农业生产，努力夺取全年粮食丰收。\nB、C两项正确，D项错误，会议强调，要扎实做好民生保障工作。突出就业优先政策导向，促进高校毕业生、退役军人、农民工等重点群体就业。落实好惠民政策，健全分层分类社会救助体系。夯实“三农”基础，推动粮食和重要农产品价格保持在合理水平。巩固拓展脱贫攻坚成果，确保不发生规模性返贫致贫。始终把人民群众生命安全放在第一位，加强安全生产和食品安全监管，全力做好防汛应急抢险救灾，保障迎峰度夏期间能源电力供应。做好“十五五”规划编制工作。故D项“人民群众财产安全”表述有误，应为“人民群众生命安全”。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"19526256","cat":"新思想","stem":"做好新时代人口工作，要完善新时代人口发展战略，认识、适应、引领人口发展新常态，以人口高质量发展支撑中国式现代化。关于做好新时代人口工作，下列说法正确的是：","options":{"A":"要树立“大人口观”，推动人口与财政、货币、就业、产业、投资、消费、生态、区域等政策形成系统集成效应","B":"必须推动人口工作由稳定总量、畅通流动向调节数量、优化结构转变","C":"要更加重视“引导”和“激励”的办法，由社会治理向政府治理转变","D":"坚持人民主体地位，把人口高速增长同人民高品质生活紧密结合起来"},"answer":"A","explanation":"本题考查理论与政策。\n2024年11月16日，《求是》杂志发表了习近平总书记题为《以人口高质量发展支撑中国式现代化》的重要文章，以下简称文章。\nA项正确，文章中“（二）做好新时代人口工作的基本思路和重大原则”部分指出：“二是坚持以系统观念统筹谋划人口问题。要树立‘大人口观’，从中国式现代化全局出发，深入研判人口变化对经济社会发展的复杂影响，在制定经济社会政策时充分考虑人口变化因素，推动人口与财政、货币、就业、产业、投资、消费、生态、区域等政策形成系统集成效应。”\nB项错误，文章中“（二）做好新时代人口工作的基本思路和重大原则”部分指出：“一是坚持以人口高质量发展促进经济社会高质量发展。我国已经进入推动高质量发展的关键时期，必须推动人口工作由调节数量为主向提升素质、稳定总量、优化结构、畅通流动转变，以人口高质量发展打造高素质人力资源，加快构建新发展格局，着力推动高质量发展。”故“推动人口工作由稳定总量、畅通流动向调节数量、优化结构转变”说法错误，应为“必须推动人口工作由调节数量为主向提升素质、稳定总量、优化结构、畅通流动转变”。\nC项错误，文章中“（二）做好新时代人口工作的基本思路和重大原则”部分指出：“三是坚持以改革创新推动人口高质量发展。过去人口工作以‘管’为主，今后工作覆盖面更广了、颗粒度更细了，要更加重视‘引导’和‘激励’的办法，由主要依靠政府力量向政府和社会协同治理转变。”故“由社会治理向政府治理转变”说法错误，应为“由主要依靠政府力量向政府和社会协同治理转变”。\nD项错误，文章中“（二）做好新时代人口工作的基本思路和重大原则”部分指出：“四是坚持促进人的全面发展和全体人民共同富裕。做好新时代人口工作，要顺应人民群众对美好生活的期待，坚持人民主体地位，把人口高质量发展同人民高品质生活紧密结合起来······”故“把人口高速增长同人民高品质生活紧密结合起来”说法错误，应为“把人口高质量发展同人民高品质生活紧密结合起来”。\n故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"19526288","cat":"新思想","stem":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》提出，推进国家安全体系和能力现代化，建设更高水平平安中国。下列有关说法正确的是（    ）。","options":{"A":"锻造实战实用的国家安全能力，把捍卫国土安全摆在首位","B":"统筹推进房地产、地方政府债务、中小金融机构等风险有序化解","C":"健全国家安全体系，坚持以风险防控为先导、法治保障为落脚点","D":"完善公共安全体系，推动公共安全治理模式由事后处理向事中控制转型"},"answer":"B","explanation":"本题考查理论与政策。\n2025年10月23日，中国共产党第二十届中央委员会第四次全体会议通过了《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》，以下简称《建议》。\nA项错误，《建议》中“十三、推进国家安全体系和能力现代化，建设更高水平平安中国”部分指出：“（50）加强重点领域国家安全能力建设。锻造实战实用的国家安全能力，突出保障事关国家长治久安、经济健康稳定、人民安居乐业的重大安全，把捍卫政治安全摆在首位。”故“把捍卫国土安全摆在首位”说法错误，应为“把捍卫政治安全摆在首位”。\nB项正确，《建议》中“十三、推进国家安全体系和能力现代化，建设更高水平平安中国”部分指出：“（50）加强重点领域国家安全能力建设······提高防范化解重点领域风险能力，统筹推进房地产、地方政府债务、中小金融机构等风险有序化解，严防系统性风险。”\nC项错误，《建议》中“十三、推进国家安全体系和能力现代化，建设更高水平平安中国”部分指出：“（49）健全国家安全体系······坚持以战略为先导、政策为抓手、法治为保障、风险防控为落脚点，完善国家安全法治体系、战略体系、政策体系、风险防控体系。”故“坚持以风险防控为先导、法治保障为落脚点”说法错误，应为“坚持以战略为先导、风险防控为落脚点”。\nD项错误，《建议》中“十三、推进国家安全体系和能力现代化，建设更高水平平安中国”部分指出：“（51）提高公共安全治理水平。完善公共安全体系，推动公共安全治理模式向事前预防转型。”故“推动公共安全治理模式由事后处理向事中控制转型”说法错误，应为“推动公共安全治理模式向事前预防转型”。\n故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"19526342","cat":"时事政治","stem":"习近平总书记高度重视战略思维，多次强调党员领导干部要加强战略思维，增强战略定力。下列体现战略思维的说法，正确的有几项？\n①粮食多一点少一点是战略问题，粮食安全是战术问题\n②统战工作的本质要求是大团结大联合，解决的是人心和力量问题\n③要心怀“国之大者”，站在全局和战略的高度想问题、办事情，一切工作都要以贯彻落实党中央决策部署为前提\n④自觉把党的对外工作放到党和国家工作大局中来认识，放到中国与世界关系的发展变化中来把握","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查理论与政策。\n①错误，《习近平谈治国理政》第四卷中的《牢牢把住粮食安全主动权》中指出：“‘五谷者，万民之命，国之重宝。’我反复强调，粮食多一点少一点是战术问题，粮食安全是战略问题。应对新冠肺炎疫情，粮食和重要农副产品供给充裕功不可没，充分印证了这一点。”故“粮食多一点少一点是战略问题，粮食安全是战术问题”表述错误，应为“粮食多一点少一点是战术问题，粮食安全是战略问题”。\n②正确，2024年1月15日，《求是》杂志发表的习近平总书记重要文章《完整、准确、全面贯彻落实关于做好新时代党的统一战线工作的重要思想》中指出：“第二，必须解决好人心和力量问题。人心向背、力量对比是决定党和人民事业成败的关键，是最大的政治。统战工作的本质要求是大团结大联合，解决的就是人心和力量问题。这是党治国理政必须下大气力解决好的重大问题。”\n③正确，2022年3月1日，习近平总书记在中央党校（国家行政学院）中青年干部培训班开班式上发表重要讲话强调：“要心怀‘国之大者’，站在全局和战略的高度想问题、办事情，一切工作都要以贯彻落实党中央决策部署为前提，不能为了局部利益损害全局利益、为了暂时利益损害根本利益和长远利益。”\n④正确，2023年7月3日，《学习时报》发表《习近平总书记论战略思维》中指出：“习近平总书记视野开阔、胸襟博大······谈到外交工作，他指出：‘自觉把党的对外工作放到党和国家工作大局中来认识，放到中国与世界关系的发展变化中来把握，放到国家总体外交的战略部署中来谋划。’”\n综上，②③④表述正确，共3项。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"19526346","cat":"新思想","stem":"习近平总书记指出，我们要建成的教育强国，是中国特色社会主义教育强国，应当具有强大的思政引领力、人才竞争力、科技支撑力、民生保障力、社会协同力、国际影响力，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力支撑。关于建设教育强国，下列说法正确的是：","options":{"A":"要坚持教育均等化原则，把教育公平作为国家基本教育政策","B":"要完善人才培养与经济社会发展需要适配机制，顺应时代发展要求，适度增加学科专业数量","C":"要把引进全球顶尖科学家摆到更加突出位置，着力培育拔尖创新人才，推动实现高水平科技自立自强","D":"从教育大国到教育强国是一个系统性跃升和质变，必须以改革创新为动力"},"answer":"D","explanation":"本题考查理论与政策。\nA项错误，2018年9月10日，习近平总书记在全国教育大会上的讲话中指出：“我们要坚持我国教育现代化的社会主义方向，坚持教育公益性原则，把教育公平作为国家基本教育政策，大力推进教育体制改革创新。”故“均等化”表述错误，应为“公益性”。\nB项错误，2025年6月1日，《求是》杂志发表的习近平总书记重要文章《加快建设教育强国》指出：“三是培养人才和满足社会需要的关系······要完善人才培养与经济社会发展需要适配机制，顺应时代发展要求，动态调整学科专业，优化办学资源配置，完善学生实习实践制度，努力让每一位人才都能人尽其才、才尽其用、各得其所。”故“适度增加学科专业数量”表述错误，应为“动态调整学科专业”。\nC项错误，2025年6月1日，《求是》杂志发表的习近平总书记重要文章《加快建设教育强国》指出：“一是支撑国家战略和满足民生需求的关系。要把培养国家重大战略急需人才摆到更加突出位置，着力造就拔尖创新人才，推动实现高水平科技自立自强。聚焦解决教育发展不平衡不充分问题，不断满足人民群众更高质量更加多样的教育需求。”故“要把引进全球顶尖科学家摆到更加突出位置”表述错误，应为“要把培养国家重大战略急需人才摆到更加突出位置”。\nD项正确，2023年5月29日，中共中央政治局就建设教育强国进行第五次集体学习。习近平总书记强调，从教育大国到教育强国是一个系统性跃升和质变，必须以改革创新为动力。要坚持系统观念，统筹推进育人方式、办学模式、管理体制、保障机制改革，坚决破除一切制约教育高质量发展的思想观念束缚和体制机制弊端，全面提高教育治理体系和治理能力现代化水平。\n故正确答案为D。","no":12,"missingImage":false},{"type":"question","qid":"19526269","cat":"新思想","stem":"习近平主席在二十国集团领导人第十九次峰会上指出，要完善全球贸易治理，建设开放型世界经济。下列相关表述正确的是：","options":{"A":"要适应经济问题政治化的潮流，通过强化绿色低碳要求推行贸易保护政策","B":"要积极构建更具平等性、包容性和建设性的产业链供应链伙伴关系，呼吁各方加强合作","C":"要把安全置于国际经贸议程中心地位，持续推动贸易和投资自由化便利化","D":"要一以贯之保持世界贸易组织规则不变，提高多边贸易体制的权威性、有效性和相关性"},"answer":"B","explanation":"本题考查理论与政策。\n当地时间2024年11月18日，国家主席习近平在巴西里约热内卢出席二十国集团领导人第十九次峰会第二阶段会议并发表题为《携手构建公正合理的全球治理体系》的讲话，以下简称讲话。\nA项错误，习近平主席在讲话中指出：“第三，完善全球贸易治理，建设开放型世界经济······要避免经济问题政治化、人为割裂全球市场，避免以绿色低碳为名、行保护主义之实。”故“适应经济问题政治化的潮流”“推行贸易保护政策”表述错误。\nB项正确，习近平主席在讲话中指出：“第三，完善全球贸易治理，建设开放型世界经济······两年前，中国同印度尼西亚等国共同发起《产业链供应链韧性与稳定国际合作倡议》，呼吁构建更具平等性、包容性和建设性的产业链供应链伙伴关系，我们愿同各方就此加强合作。”\nC项错误，习近平主席在讲话中指出：“第三，完善全球贸易治理，建设开放型世界经济。要把发展置于国际经贸议程中心地位，持续推动贸易和投资自由化便利化，要继续推进世界贸易组织改革······”故“把安全置于国际经贸议程中心地位”表述错误，应为“把发展置于国际经贸议程中心地位”。\nD项错误，习近平主席在讲话中指出：“第三，完善全球贸易治理，建设开放型世界经济······要积极推进世界贸易组织规则与时俱进，既要解决长期未决议题，又要积极探索制定面向未来的新规则，提高多边贸易体制的权威性、有效性和相关性。”故“一以贯之保持世界贸易组织规则不变”表述错误，应为“积极推进世界贸易组织规则与时俱进”。\n故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"19526276","cat":"新思想","stem":"中国式现代化要靠科技现代化作支撑，实现高质量发展要靠科技创新培育新动能。关于建成科技强国的举措，下列说法正确的是：","options":{"A":"要坚持有所为有所不为，突出经济发展需求，在重要领域实施科技战略部署","B":"要充分发挥人才在科技资源配置中的决定性作用，调动产学研各环节的积极性","C":"要充分发挥科技领军企业龙头作用，鼓励中小企业和民营企业科技创新，支持企业牵头或参与国家重大科技项目","D":"要降低基础研究组织化程度，强化自由探索，鼓励面向重大科学问题的协同攻关"},"answer":"C","explanation":"本题考查理论与政策。\n2024年6月24日，习近平总书记在全国科技大会、国家科学技术奖励大会、两院院士大会上发表重要讲话（以下简称讲话）。\nA项错误，习总书记在讲话中指出：“要保持战略定力，坚持有所为有所不为，突出国家战略需求，在若干重要领域实施科技战略部署，凝练实施一批新的重大科技项目，形成竞争优势，赢得战略主动。”故“突出经济发展需求”表述错误，应为“突出国家战略需求”。\nB项错误，习总书记在讲话中指出：“要充分发挥市场在科技资源配置中的决定性作用，更好发挥政府各方面作用，调动产学研各环节的积极性，形成共促关键核心技术攻关的工作格局。”故“人才”表述错误，应为“市场”。\nC项正确，习总书记在讲话中指出：“融合的关键是强化企业科技创新主体地位。要充分发挥科技领军企业龙头作用，鼓励中小企业和民营企业科技创新，支持企业牵头或参与国家重大科技项目。”\nD项错误，习总书记在讲话中指出：“要提高基础研究组织化程度，完善竞争性支持和稳定支持相结合的投入机制，强化面向重大科学问题的协同攻关，同时鼓励自由探索，努力提出原创基础理论、掌握底层技术原理，筑牢科技创新根基和底座。”故“降低基础研究组织化程度”“强化自由探索”“鼓励面向重大科学问题的协同攻关”表述错误，应为“提高基础研究组织化程度”“鼓励自由探索”“强化面向重大科学问题的协同攻关”。\n故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"19526252","cat":"新思想","stem":"习近平总书记强调，选人用人要加强党性鉴别，注重考察干部的境界格局和忠诚度廉洁度。下列与党性相关的说法正确的是：","options":{"A":"树立和践行正确政绩观，起决定性作用的是党性","B":"强党性，就是要自觉用马克思主义思想改造客观世界","C":"党性、党风、党纪是有机整体，党性是根本，党风是保障，党纪是表现","D":"作风问题本质上是党性问题，要把作风建设摆在党性修养的首位"},"answer":"A","explanation":"本题考查理论与政策。\nA项正确，2022年3月1日，习近平总书记在春季学期中央党校（国家行政学院）中青年干部培训班开班式上指出：“树立和践行正确政绩观，起决定性作用的是党性。”\nB项错误，2023年4月3日，在学习贯彻习近平新时代中国特色社会主义思想主题教育工作会议上，习近平总书记对开展主题教育的总要求“学思想、强党性、重实践、建新功”作出深刻阐释，指出：“强党性，就是要自觉用新时代中国特色社会主义思想改造主观世界，深刻领会这一思想关于坚定理想信念、提升思想境界、加强党性锻炼等一系列要求，始终保持共产党人的政治本色。”因此“用马克思主义思想改造客观世界”表述错误，应为“用新时代中国特色社会主义思想改造主观世界”。\nC项错误，2024年12月，习近平总书记在纪念乔石同志诞辰100周年座谈会上的讲话中指出，党性、党风、党纪是有机整体，党性是根本，党风是表现，党纪是保障。我们要始终坚持党的全面领导和党中央集中统一领导，坚定不移全面从严治党，深入推进党风廉政建设和反腐败斗争······故“党风是保障，党纪是表现”表述错误，应为“党风是表现，党纪是保障”。\nD项错误，2018年1月5日，习近平总书记在新进中央委员会的委员、候补委员和省部级主要领导干部学习贯彻习近平新时代中国特色社会主义思想和党的十九大精神研讨班上的讲话指出：“作风问题本质上是党性问题。领导干部的作风直接关系党内风气和政治生态，关系民心向背，决定着党的群众基础。”2024年12月26日至27日，习近平总书记在主持召开中央政治局民主生活会时强调：“领导干部要把锤炼党性、提高思想觉悟作为终身课题，活到老、学到老、修养到老。要把政治修养摆在党性修养的首位，从党的创新理论中汲取党性滋养，把学习遵守贯彻党章党规党纪作为党性修养的重要内容。”因此“要把作风建设摆在党性修养的首位”表述错误，应为“要把政治修养摆在党性修养的首位”。\n故正确答案为A。","no":15,"missingImage":false},{"type":"question","qid":"19526257","cat":"新思想","stem":"坚持问题导向是习近平新时代中国特色社会主义思想的世界观和方法论的重要内容。关于坚持问题导向，下列说法不准确的是：","options":{"A":"坚持问题导向是马克思主义的鲜明特点","B":"坚持问题导向要抓住人民最关心最直接最现实的利益问题","C":"坚持问题导向体现了矛盾的普遍性和客观性","D":"坚持问题导向本质是变与不变、继承与发展的辩证统一"},"answer":"D","explanation":"本题考查马克思主义。\nA项正确，在习近平新时代中国特色社会主义思想中，必须坚持问题导向并非一般性的要求，而是上升到了世界观和方法论的高度，具有深刻的哲学内涵。必须坚持问题导向是马克思主义的鲜明特点，是党的十八大以来党治国理政的突出特点，是推进马克思主义中国化时代化的现实着眼点。\nB项正确，习近平总书记强调，要增强问题意识，聚焦人民群众急难愁盼问题等一系列重大问题。人民最关心最直接最现实的利益问题正是群众急难愁盼问题，坚持问题导向必然要求抓住这类问题，并以此为着力点制定政策、推进工作，切实解决群众诉求。\nC项正确，问题是事物矛盾的表现形式，矛盾无处不在、无时不有（普遍性），矛盾是客观存在的（客观性）。坚持问题导向，就是承认矛盾、分析矛盾、解决矛盾，这直接体现了矛盾的普遍性和客观性。 \nD项错误，体现变与不变、继承与发展辩证统一的是“坚持守正创新”，而非“坚持问题导向”。守正意味着坚守马克思主义基本原理、党的根本宗旨等不变的原则，创新则是结合时代发展推出新理念新思路新办法，二者的结合正是这种辩证统一的体现。而坚持问题导向的本质是实事求是、一切从实际出发，核心是不断认识矛盾、解决矛盾以推动事物发展。 \n本题为选非题，故正确答案为D。","no":16,"missingImage":false},{"type":"question","qid":"19526337","cat":"新思想","stem":"恩格斯深刻指出：“马克思的整个世界观不是教义，而是方法。它提供的不是现成的教条，而是进一步研究的出发点和供这种研究使用的方法。”下列有关马克思主义理论的说法不准确的是：","options":{"A":"马克思创立了辩证法，成为我们认识世界和改造世界的根本方法","B":"科学社会主义的原则不能丢，但科学社会主义也绝不是一成不变的教条","C":"当代中国的伟大社会变革不是简单套用马克思主义经典作家设想的模板","D":"《共产党宣言》发表至今，人类社会发生了翻天覆地的变化，但马克思主义所阐述的一般原理整个来说仍然是完全正确的"},"answer":"A","explanation":"本题考查马克思主义。\nA项错误，辩证法并非由马克思创立，而是历经多个时代、经多位哲学家逐步完善发展而来，是研究思维过程及矛盾运动的哲学方法。马克思和恩格斯的贡献在于批判继承了黑格尔辩证法的合理内核，摒弃其唯心主义外壳，结合唯物主义立场创立了唯物辩证法。唯物辩证法是我们认识世界和改造世界的根本方法。\nB、C两项正确，2018年5月4日，习总书记在纪念马克思诞辰200周年大会上的讲话中指出：“对待科学的理论必须有科学的态度······科学社会主义基本原则不能丢，丢了就不是社会主义。同时，科学社会主义也绝不是一成不变的教条。我说过，当代中国的伟大社会变革，不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版。”\nD项正确，2018年5月4日，习总书记在纪念马克思诞辰200周年大会上的讲话中指出：“从《共产党宣言》发表到今天，170年过去了，人类社会发生了翻天覆地的变化，但马克思主义所阐述的一般原理整个来说仍然是完全正确的。”\n本题为选非题，故正确答案为A。","no":17,"missingImage":false},{"type":"question","qid":"19526341","cat":"新思想","stem":"以实践为基础，从整体上把握人与世界的关系，是马克思主义世界观的重要内容。关于马克思主义实践观，下列说法正确的是：","options":{"A":"正确发挥主观能动性是实践的根本途径","B":"实践的过程就是对于结果的检验和评价","C":"实践是人类生存和发展最基本的活动","D":"实践是一种无目的的适应环境的本能活动"},"answer":"C","explanation":"本题考查马克思主义。\nA项错误，实践是正确发挥人的主观能动性的根本途径。正确的认识要变为现实的物质力量，只能通过物质的活动即实践才能达到。选项表述颠倒了“正确发挥主观能动性”和“实践”的地位。\nB项错误，实践是人类能动地改造世界的社会性的物质活动，实践的过程即“改造客观世界”，而对实践结果的检验和评价，本质上是实践作为真理检验标准的体现——即通过实践结果判断认识是否符合客观实际。实践的过程不仅仅是对于结果的检验和评价。\nC项正确，马克思主义认为，实践是人类能动地改造客观世界的物质活动，其中生产实践是人类生存和发展最基本的实践形式。人类通过生产实践获取物质生活资料，解决人与自然的矛盾，是其他一切社会活动的基础。没有生产实践提供的物质前提，人类的生存无从谈起，更无法开展其他高级社会活动，因此“实践是人类生存和发展最基本的活动”说法正确，符合马克思主义实践观的核心内涵。\nD项错误，实践的本质特征之一是自觉能动性，即人类的实践活动是有目的、有意识的能动活动，是在一定认识指导下主动改造世界的行为。而“无目的的适应环境的本能活动”是动物的生存行为，不具备人类实践的目的性和能动性。\n故正确答案为C。","no":18,"missingImage":false},{"type":"question","qid":"19526282","cat":"新思想","stem":"习近平总书记在对各省区市进行深入考察调研的过程中，结合各地实际情况，对推进高质量发展作出一系列重要部署。下列对应关系正确的是：","options":{"A":"江苏——要建设国家资源型经济转型综合配套改革试验区，重点抓好能源转型、产业升级和适度多元发展","B":"山东——要发挥海洋资源丰富的得天独厚优势，经略海洋、向海图强，打造世界级海洋港口群，打造现代海洋经济发展高地","C":"云南——要把握好挑大梁的着力点，在推动科技创新和产业创新融合上打头阵","D":"贵州——聚焦实现贸易、投资、跨境资金流动、人员进出、运输来往自由便利和数据安全有序流动"},"answer":"B","explanation":"本题考查理论与政策。\nA项错误，2025年7月，习近平总书记在山西考察时指出，建设国家资源型经济转型综合配套改革试验区是党中央交给山西的一项战略任务，要进一步统一思想，保持定力，坚定有序推进转型发展。重点要抓好能源转型、产业升级和适度多元发展。故“江苏”错误，应为“山西”。\nB项正确，2024年5月，习近平总书记在山东考察时指出，要发挥海洋资源丰富的得天独厚优势，经略海洋、向海图强，打造世界级海洋港口群，打造现代海洋经济发展高地。\nC项错误，2025年3月5日，习近平总书记在参加十四届全国人大三次会议江苏代表团审议时发表的重要讲话中强调，江苏要把握好挑大梁的着力点，在推动科技创新和产业创新融合上打头阵，在推进深层次改革和高水平开放上勇争先，在落实国家重大发展战略上走在前，在促进全体人民共同富裕上作示范。故“云南”错误，应为“江苏”。\nD项错误，2024年12月17日，习近平总书记在海南三亚听取海南省委和省政府工作汇报时发表的重要讲话中强调，聚焦实现贸易、投资、跨境资金流动、人员进出、运输来往自由便利和数据安全有序流动，对标国际高水平经贸规则，大力推进制度型开放，营造市场化、法治化、国际化一流营商环境。故“贵州”错误，应为“海南”。\n故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"19526232","cat":"新思想","stem":"2025年是中国人民抗日战争暨世界反法西斯战争胜利80周年。中国人民对战争带来的苦难有着刻骨铭心的记忆，对和平有着孜孜不倦的追求。关于中国人民抗日战争，下列表述不准确的是：","options":{"A":"中国人民抗日战争的伟大胜利，是以爱国主义为核心的民族精神的伟大胜利","B":"中国人民抗日战争的伟大胜利，第一次确立了中国在世界上的大国地位，使中国人民赢得了世界爱好和平人民的尊敬","C":"中国人民抗日战争的伟大胜利，是近代以来中国抗击外敌入侵的第一次完全胜利","D":"中国人民抗日战争的伟大胜利，为中华民族由近代以来陷入深重危机走向伟大复兴确立了历史转折点"},"answer":"B","explanation":"本题考查时政热点。\n2025年9月1日出版的第17期《求是》杂志发表习近平总书记的重要文章《弘扬伟大抗战精神，向着中华民族伟大复兴的光辉彼岸奋勇前进》。\nA项正确，文章指出，中国人民抗日战争胜利是以爱国主义为核心的民族精神的伟大胜利。爱国主义是我们民族精神的核心，是中国人民和中华民族同心同德、自强不息的精神纽带。\nB项错误，C项正确，文章指出，中国人民抗日战争胜利，是近代以来中国抗击外敌入侵的第一次完全胜利。这一伟大胜利，彻底粉碎了日本军国主义殖民奴役中国的图谋，洗刷了近代以来中国抗击外来侵略屡战屡败的民族耻辱。这一伟大胜利，重新确立了中国在世界上的大国地位，使中国人民赢得了世界爱好和平人民的尊敬。这一伟大胜利，开辟了中华民族伟大复兴的光明前景，开启了古老中国凤凰涅槃、浴火重生的新征程。因此B项“第一次确立了中国在世界上的大国地位”表述错误，应为“重新确立了中国在世界上的大国地位”。\nD项正确，文章指出，这（指中国人民抗日战争）是近代以来中国人民反抗外敌入侵持续时间最长、规模最大、牺牲最多的民族解放斗争，也是第一次取得完全胜利的民族解放斗争。这个伟大胜利，是中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点、也是世界反法西斯战争胜利的重要组成部分，是中国人民的胜利、也是世界人民的胜利。\n本题为选非题，故正确答案为B。","no":20,"missingImage":false}],"count":20,"answerable":20,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"19526260","cat":"法律常识","stem":"下列情形不符合《中华人民共和国监察法》及其实施条例规定的是：","options":{"A":"再派出的监察专员王某在开展监察工作过程中，受派出他的监察机构领导","B":"公务员张某在怀孕期间因涉嫌严重职务违法被监察机关调查，经监察机关依法审批，对其采取责令候查措施","C":"办理监察事项的监察人员黄某系监察对象刘某的丈夫，黄某应自行回避","D":"监察人员李某涉嫌职务犯罪，监察机关决定对其采取15日禁闭措施"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国监察法实施条例》第十四条第二款规定：“再派出监察机构、监察专员开展监察工作，受派出它的监察机构、监察专员领导。”因此，再派出的监察专员王某在开展监察工作过程中，受派出他的监察机构领导。\nB项正确，根据《中华人民共和国监察法》第二十三条第一款第二项规定：“被调查人涉嫌严重职务违法或者职务犯罪，并有下列情形之一的，经监察机关依法审批，可以对其采取责令候查措施：（二）符合留置条件，但患有严重疾病、生活不能自理的，系怀孕或者正在哺乳自己婴儿的妇女，或者生活不能自理的人的唯一扶养人。”因此，被调查人张某处于怀孕期间，符合采取责令候查措施的情形。\nC项正确，根据《中华人民共和国监察法》第六十七条第一项规定：“办理监察事项的监察人员有下列情形之一的，应当自行回避，监察对象、检举人及其他有关人员也有权要求其回避：（一）是监察对象或者检举人的近亲属的。”因此，监察人员黄某系监察对象刘某的丈夫，符合自行回避的情形。\nD项错误，根据《中华人民共和国监察法》第六十四条第一款规定：“监察人员涉嫌严重职务违法或者职务犯罪，为防止造成更为严重的后果或者恶劣影响，监察机关经依法审批，可以对其采取禁闭措施。禁闭的期限不得超过七日。”因此，监察人员李某被采取15日禁闭措施，不符合“禁闭的期限不得超过七日”的规定。\n本题为选非题，故正确答案为D。","no":21,"missingImage":false},{"type":"question","qid":"19526233","cat":"法律常识","stem":"关于《中华人民共和国民营经济促进法》，下列说法错误的是：","options":{"A":"是我国第一部专门关于民营经济发展的基础性法律","B":"规定司法行政部门建立涉企行政执法诉求沟通机制","C":"规定地方各级人民政府与民营经济组织订立的合同不得变更","D":"规定向民营经济组织开放国家重大科研基础设施"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，中华人民共和国司法部发布的《民营经济必将走向更加广阔的舞台——写在民营经济促进法施行之际》指出：“第一部专门关于民营经济发展的基础性法律；第一次将‘两个毫不动摇’写入法律；第一次明确民营经济的法律地位；第一次明确规定‘促进民营经济持续、健康、高质量发展，是国家长期坚持的重大方针政策’······民营经济促进法的制定和实施，在我国民营经济发展史上具有里程碑意义。”\nB项正确，根据《中华人民共和国民营经济促进法》第五十三条第二款规定：“司法行政部门建立涉企行政执法诉求沟通机制，组织开展行政执法检查，加强对行政执法活动的监督，及时纠正不当行政执法行为。”\nC项错误，根据《中华人民共和国民营经济促进法》第七十条规定：“地方各级人民政府及其有关部门应当履行依法向民营经济组织作出的政策承诺和与民营经济组织订立的合同，不得以行政区划调整、政府换届、机构或者职能调整以及相关人员更替等为由违约、毁约。因国家利益、社会公共利益需要改变政策承诺、合同约定的，应当依照法定权限和程序进行，并对民营经济组织因此受到的损失予以补偿。”因此，并非规定“合同不得变更”，而是强调政府不得随意违约毁约，同时明确了基于公共利益的合法变更情形及补偿。\nD项正确，根据《中华人民共和国民营经济促进法》第二十八条规定：“支持民营经济组织参与国家科技攻关项目，支持有能力的民营经济组织牵头承担国家重大技术攻关任务，向民营经济组织开放国家重大科研基础设施，支持公共研究开发平台、共性技术平台开放共享，为民营经济组织技术创新平等提供服务，鼓励各类企业和高等学校、科研院所、职业学校与民营经济组织创新合作机制，开展技术交流和成果转移转化，推动产学研深度融合。”\n本题为选非题，故正确答案为C。","no":22,"missingImage":false},{"type":"question","qid":"19526353","cat":"法律常识","stem":"根据《政务数据共享条例》，下列说法错误的是：","options":{"A":"政务数据需求部门提交的申请材料不全的，政务数据提供部门不得直接予以拒绝","B":"政府部门通过共享获得政务数据后不得擅自将获得的政务数据提供给第三方","C":"可以提供给所有政府部门共享使用的政务数据属于无条件共享类政务数据","D":"政府部门应当新建政务数据共享交换系统开展跨层级政务数据共享相关工作"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，根据《政务数据共享条例》第二十一条第二款规定：“政务数据需求部门提交的申请材料不全的，政务数据提供部门应当一次性告知其需要补充的材料，不得直接予以拒绝。政务数据提供部门不同意共享的，应当说明理由。”\nB项正确，根据《政务数据共享条例》第二十五条第一款规定：“政府部门通过共享获得政务数据的，不得擅自扩大使用范围以及用于或者变相用于其他目的，不得擅自将获得的政务数据提供给第三方。确需扩大使用范围、用于其他目的或者提供给第三方的，应当经政务数据提供部门同意。”\nC项正确，根据《政务数据共享条例》第十四条第一项规定：“政务数据按照共享属性分为无条件共享、有条件共享和不予共享三类：（一）可以提供给所有政府部门共享使用的政务数据属于无条件共享类；”\nD项错误，根据《政务数据共享条例》第三十一条规定：“政府部门已建设的政务数据平台应当纳入全国一体化政务大数据体系。除法律、行政法规另有规定外，原则上不得通过新建政务数据共享交换系统开展跨层级、跨地域、跨系统、跨部门、跨业务的政务数据共享工作。”故“应当”说法错误，应为“原则上不得通过”。\n本题为选非题，故正确答案为D。","no":23,"missingImage":false},{"type":"question","qid":"19526378","cat":"人文常识","stem":"下列经济目标与政策工具匹配错误的是：","options":{"A":"扩大基础设施投资规模——提高专项债发行额度","B":"降低市场主体经营成本——延续小微企业增值税减免","C":"拓宽房企的融资渠道——增加保障性住房再贷款额度","D":"缓解基层“三保”支出压力——加大中央对地方转移支付"},"answer":"C","explanation":"本题考查经济常识。\nA项正确，专项债券是落实积极财政政策的重要抓手，能直接有效拉动投资。基础设施建设是专项债资金的主要投向领域，提高专项债发行额度有利于扩大基础设施投资规模，发挥强基础、补短板、惠民生、扩投资等积极作用。\nB项正确，延续小微企业增值税减免能够显著减轻小微企业税收负担，从而减轻小微企业的经营压力，有利于稳定其经营状况。该政策直接降低小微企业税负，增强其经营信心，符合“降低市场主体经营成本”的经济目标。\nC项错误，保障性住房再贷款是央行向商业银行发放的结构性货币政策工具。在化解保交楼风险过程中，由地方政府选定的市场化运营国有企业（非政府融资平台）作为收购主体，商业银行向其发放并购贷款用于收购已建成未售的存量商品房，商业银行再凭该笔合格贷款向央行申请保障性住房再贷款资金支持。该政策核心目的是通过市场化方式化解楼盘烂尾风险、保障购房人合法权益，资金不直接流向房地产开发企业，因此不能直接拓宽房企的融资渠道。\nD项正确，为支持基层财政平稳运行，加强基层“三保”（保基本民生、保工资、保运转）保障，中央财政不断推动财力下沉。加大中央对地方转移支付，有利于增强地方财力并确保基层“三保”的稳固，以强化地方财力的支撑，助力地方更好地履行“三保”职责。\n本题为选非题，故正确答案为C。","no":24,"missingImage":false},{"type":"question","qid":"19526286","cat":"人文常识","stem":"2025年3月，中共中央办公厅、国务院办公厅印发《逐步把永久基本农田建成高标准农田实施方案》，下列有关说法正确的是：","options":{"A":"西北区要重点加强水平梯田改造建设","B":"25度以上坡耕地、沿海内陆滩涂是开展建设的重点区域","C":"高标准农田建设标准中的“两通”是指通水通路","D":"黄淮海区应该把改善田块细碎化问题作为一个工作重点"},"answer":"C","explanation":"本题考查地理国情。\n2025年3月，中共中央办公厅、国务院办公厅印发《逐步把永久基本农田建成高标准农田实施方案》（以下简称《方案》）。\nA、D两项错误，《方案》在“二、建设安排”部分指出：“（四）建设分区。依据区域资源禀赋、耕作制度和行政区划等，将全国高标准农田建设分为7个区域······黄淮海区包括北京、天津、河北、山东、河南5省（直辖市），重点着力提高灌溉保证率，完善现代化耕作条件······东南区包括浙江、福建、广东、海南4省，重点在尊重农民意愿前提下逐步改善田块细碎化问题，增强农田防御暴雨能力。西南区包括广西、重庆、四川、贵州、云南5省（自治区、直辖市），重点加强水平梯田改造建设，完善田间道路，补齐工程性缺水短板。西北区包括山西、陕西、甘肃、宁夏、新疆（含新疆生产建设兵团）5省（自治区），以及内蒙古中西部8盟（市），重点加强田块整治，提高农业用水效率，破解‘卡脖子’旱问题······”故A项“西北区”表述错误，应为“西南区”；D项“黄淮海区”表述错误，应为“东南区”。\nB项错误，《方案》在“二、建设安排”部分指出：“（三）建设布局。严格限制在生态脆弱区、沿海内陆滩涂等区域，禁止在25度以上坡耕地、严格管控类耕地、生态保护红线（红线内集中连片梯田或与保护对象共生的连片耕地除外）、退耕还林还草还湖还牧区域等开展高标准农田建设。”故25度以上坡耕地是禁止建设区域，沿海内陆滩涂是限制建设区域。\nC项正确，《方案》在“二、建设安排”部分指出：“（一）建设标准。以‘一平’（田块平整）、‘两通’（通水通路）、‘三提升’（提升地力、产量、效益）为基本标准，合理确定不同区域、不同类型高标准农田建设标准和投入标准。”\n故正确答案为C。","no":25,"missingImage":false},{"type":"question","qid":"19526364","cat":"科技常识","stem":"2025年自然资源部发布《新发现矿种公告》，高纯石英矿正式成为我国第174号矿种。下列与之相关的说法错误的是：","options":{"A":"高纯石英矿在分类上属于金属矿","B":"天然水晶是石英的结晶体","C":"高纯石英可用于芯片制造中的光刻环节","D":"石英砂具有耐高温的特性"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，我国矿产资源分为四大类：能源矿产、金属矿产、非金属矿产和水气矿产。高纯石英矿的主要成分是二氧化硅（\u003cimg data-k=\"2d0f2f9df437\">），因其化学成分和物理特性，属于非金属矿物资源，其纯度需达到99.995%以上，用于半导体、光伏等高技术领域。\nB项正确，天然水晶的化学成分是二氧化硅（\u003cimg data-k=\"2d0f2f9df437\">），是一种无色透明的石英结晶体矿物。天然水晶多是在地底下、岩洞中，需要有丰富的地下水来源，地下水又多含有饱和的二氧化硅，同时此中的压力需在大气压力下的二倍至三倍左右，温度则需在\u003cimg data-k=\"c92ba7446423\">间，再给予适当时间，水晶就会依着“六方晶系”的自然法则，而结晶成六方柱状的水晶。\nC项正确，高纯石英是制造光刻机光学系统核心部件（如透镜、光掩模基板）的关键材料。这些部件需要极高的纯度、紫外透过率和热稳定性，以确保光刻的精度。因此，高纯石英在芯片光刻环节中不可或缺。\nD项正确，石英砂及其制品（如高纯石英砂和熔融石英制品）具有耐高温的特性，熔点可达\u003cimg data-k=\"2dce2c4acbcf\">，远高于一般金属和材料。这一优良的热学性能是其能够广泛应用于半导体、光伏、光学及高温工业领域的重要原因。\n本题为选非题，故正确答案为A。","no":26,"missingImage":false},{"type":"question","qid":"19526354","cat":"人文常识","stem":"下列与海洋经济有关的说法错误的是：","options":{"A":"海水中氢离子和氢氧根离子浓度高，利用海水制氢效率高","B":"现代深远海养殖平台一般设置在有较大浪流的开放性水域","C":"潮汐发电的水轮机结构要适应海水落差小、流量大的特点","D":"液化天然气运输船的液舱通常采用超低温环境储存天然气"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，常温下纯水中氢离子和氢氧根离子浓度为\u003cimg data-k=\"3f18d6a9ce82\">mol/L，海水中的氢离子和氢氧根离子浓度实际并不高（\u003cimg data-k=\"c90f774c263d\">时，\u003cimg data-k=\"a184a87899fb\">浓度约为\u003cimg data-k=\"9c198e0b38e2\">mol/L，\u003cimg data-k=\"88ee45ad84f0\">浓度约为\u003cimg data-k=\"1d3595605922\"> mol/L），直接电解海水制氢效率并不高，且存在腐蚀、析氯等问题，通常需要淡化或特殊电解技术。\nB项正确，深远海养殖是一项综合性系统工程，现代深远海养殖平台一般都是设置在水深超过15m且有较大浪流的开放性水域，在离岸较远（3海里外）的岛礁水域或养殖水体超过1万\u003cimg data-k=\"f8fcee739a9e\">的海水养殖网箱平台。\nC项正确，潮汐发电是一种利用海水周期性涨落能量进行水力发电的技术，通过在海湾或感潮河口筑坝形成水库，利用潮位差驱动水轮机发电。其原理与常规水电类似，但需适应低水头（落差小）、大流量的海水特性，具有清洁可再生、发电稳定等特点，可结合围垦、养殖等综合利用。\nD项正确，液化天然气运输船（LNG船）是专用于海上天然气运输的船型。运输天然气对船的要求非常苛刻，不仅要做到极高标准的密封性，保存天然气的液货舱还要能承受液化天然气零下163摄氏度的低温考验。液货舱最核心的就是一种叫殷瓦钢的材料，它在零下163摄氏度天然气变成液态的时候，能保质保量地将其储存起来。\n本题为选非题，故正确答案为A。","no":27,"missingImage":false},{"type":"question","qid":"19526361","cat":"人文常识","stem":"关于诗句中涉及的气象现象，下列说法错误的是：","options":{"A":"“白雪却嫌春色晚，故穿庭树作飞花”与春季较强冷空气活动有关","B":"“雷车动地电火明，急雨遂作盆盎倾”多与积雨云中的电位差有关","C":"“檐花穿雾凇，窗纸战风棱”的景观形成过程中包含凝华现象","D":"“鸡声茅店月，人迹板桥霜”的“霜”包含在降水统计范围内"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，“白雪却嫌春色晚，故穿庭树作飞花”出自唐代韩愈的《春雪》，意思是白雪也嫌春色来得太晚了，所以有意化作花儿在庭院树间穿飞。春季冷暖空气活动频繁，当较强冷空气南下与暖湿气流相遇，使气温降至\u003cimg data-k=\"51748cf53c00\">以下时，会引发冻雨或降雪等天气现象。\nB项正确，“雷车动地电火明，急雨遂作盆盎倾”出自南宋陆游的《七月十九日大风雨雷电》，意思是雷声打下来惊天动地电火闪烁，急雨就像有人在空中用盆和盎向下倾倒。雷电一般产生于对流发展旺盛的积雨云中。总体而言，积雨云的上部以正电荷为主，下部以负电荷为主，云的上、下部之间形成一个电位差。当电位差达到一定程度后，就会产生放电，即闪电现象。放电过程中，闪电通道内的电弧高温，可使周围空气极速膨胀，热消失后又冷却，使空气极速收缩，引起剧烈的有声振动，即雷声。\nC项正确，“檐花穿雾凇，窗纸战风棱”出自明代杨慎的《寒夕》，大意是屋檐下结着雾凇，窗户纸在风中颤动。雾凇，俗称树挂，是指过冷却雾滴直接冻结在物体迎风面上，或空气中的饱和水汽直接凝华而形成的乳白色不透明的冰晶物。\nD项错误，“鸡声茅店月，人迹板桥霜”出自唐代温庭筠的《商山早行》，意思是鸡声嘹亮，茅草店沐浴着晓月的余辉，足迹依稀，木板桥覆盖着早春的寒霜。霜指气温降至\u003cimg data-k=\"51748cf53c00\">以下时地表水汽凝结形成的白色晶体。国家气象局地面观测规范明确规定，降水量仅指垂直降水（如雨、雪、冰雹），水平降水（如雾、霜、露）不计入降水量。\n本题为选非题，故正确答案为D。","no":28,"missingImage":false},{"type":"question","qid":"19526394","cat":"人文常识","stem":"下列关于河流入海口的描述与河流对应错误的是：","options":{"A":"浑浊的河水奔流而至，汇入清澈的渤海，形成一条清晰的分界线——黄河","B":"“三龙吐珠，八门入海”，生动地描绘出了它的奇特形态——淮河","C":"在入海口的潮间带上，会看到一片耀眼的红色，又被称为“红海滩”——辽河","D":"在其与东海海潮的相互激荡下，造就了我国第三大岛崇明岛——长江"},"answer":"B","explanation":"本题考查地理国情。\nA项正确，黄河以含沙量大而闻名，黄河的河水呈黄色，比较浑浊，当其汇入相对清澈的渤海时，由于河水与海水的密度、盐度不同，会在一段时间内相互浸润而不混合，从而形成一条非常清晰黄蓝相间的分界线，这是黄河入海口的典型景观。\nB项错误，“三龙吐珠，八门入海”描绘的是珠江入海口的形态，而非淮河。珠江下游水系发达，入海口区域水网密布，主要经由虎门、蕉门、洪奇门、横门、磨刀门、鸡啼门、虎跳门和崖门八个口门流入南海，形成了“八门入海”的奇特格局；“三龙”指珠江的西江、东江、北江三大干流。而淮河历史上因黄河夺淮入海，天然入海河道被淤塞，现主要通过淮河入海水道、苏北灌溉总渠、废黄河等多条人工及半天然河道入海，并无“八门入海”的特征。\nC项正确，辽河入海口的潮间带上覆盖着大面积的碱蓬草，碱蓬草每年四月长出地面，在夏季为绿色，到了秋季则变为鲜艳的赤红色，从而形成了一望无际的“红海滩”。“红海滩”是辽宁盘锦地区的著名自然景观。\nD项正确，长江水量巨大，携带着大量的泥沙在其入海口处沉积，同时，东海的海潮又对这些泥沙起到顶托和冲刷作用，在河流与海洋动力的长期相互作用下，泥沙不断淤积，最终形成了中国最大的冲积岛——崇明岛。\n本题为选非题，故正确答案为B。","no":29,"missingImage":false},{"type":"question","qid":"19526270","cat":"人文常识","stem":"下列与自然界中的颜色有关的说法错误的是：","options":{"A":"“橙色月亮”通常发生在大气层中水汽或颗粒物质较多时","B":"火烈鸟羽毛呈朱红色与摄入食物中的虾青素累积有关","C":"蓝闪蝶翅膀呈蓝色是由于其表面鳞片具有特殊的微结构","D":"蓝莓呈现靛蓝色是因为表面蜡质层中含高浓度花青素"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，“橙色月亮”的形成核心与大气层散射作用相关。当大气层中水汽、尘埃、颗粒物质等杂质较多时（如日出日落、雾霾天、火山喷发后），月光穿过大气层的路径变长，波长较短的蓝、紫光被大量散射，而波长较长的橙、红光穿透能力更强，最终到达人眼，使月亮呈现橙色。\nB项正确，火烈鸟的羽毛颜色并非天生固定，而是后天通过食物累积形成。其主要食物（如虾、蟹、藻类）中富含类胡萝卜素（核心为虾青素），这类物质无法被火烈鸟自身合成，需通过消化吸收后沉积在羽毛组织中，随着累积量增加，羽毛逐渐从白色变为鲜艳的朱红色。这一机制是生物学中“食物色素累积影响生物体色”的典型案例。\nC项正确，蓝闪蝶翅膀的蓝色源于“结构色”（物理色），系因其翅膀表面覆盖着微小的鳞片，这些鳞片具有特殊的纳米级微结构（如多层薄膜、光栅结构），能够通过反射、折射、干涉等物理作用，选择性地增强蓝光的反射的同时削弱其他色光的传播，最终呈现出明亮的蓝色。\nD项错误，蓝莓呈现靛蓝色并不是因为表面蜡质层中含有高浓度花青素。实际上，蓝莓的靛蓝色主要来源于表皮蜡质层的微型结构，这些结构通过散射光线产生结构色，而花青素主要存在于果肉或表皮细胞中，贡献的是紫色或红色色调，不会直接导致蓝莓呈现靛蓝色。\n本题为选非题，故正确答案为D。","no":30,"missingImage":false},{"type":"question","qid":"19526335","cat":"人文常识","stem":"某物流公司要优化长三角到乌鲁木齐的易腐货物运输路线，下列方案最可行的是：","options":{"A":"夏季采用陇海——兰新铁路运输利用沿线低温天气自然保鲜","B":"冬季选择长江——京杭大运河——黄河水运组合避开陆路交通拥堵","C":"春秋季采用铁路冷藏集装箱运输平衡运输成本与时效性","D":"全年优先使用连霍高速公路运输以追求最低的运输成本"},"answer":"C","explanation":"本题考查地理国情。\nA项错误，兰新铁路东起甘肃省兰州，跨红柳河进入新疆维吾尔自治区，在达坂城穿过天山至乌鲁木齐。兰新铁路东连陇海铁路，在兰州与包兰线交汇。陇海铁路是中国东西方向的主要铁路干线之一，起自江苏省北部的连云港，横贯江苏、安徽、河南、陕西、甘肃5省，至甘肃省省会兰州。此方案时间成本高，陇海线经过河南、陕西，兰新线穿越河西走廊、新疆戈壁，夏季高温，且长途运输车厢内极易积聚热量，不适合自然保鲜。故此方案不可行。\nB项错误，黄河干流冬季平均气温低于\u003cimg data-k=\"51748cf53c00\">，一般每年12月至次年3月为天然结冰期，船舶无法航行，且冬季黄河流域降水稀少、地表径流减少，进入枯水期后，下游河道水位显著下降，水位不足导致船舶搁浅风险极高。此方案耗时较长，且黄河水运无法直达乌鲁木齐，最终仍需衔接陆路，不能避开陆路交通拥堵。故此方案不可行。\nC项正确，冷藏集装箱是指一种有良好隔热，且能维持一定低温要求，适用于各类易腐食品的运送、贮存的特殊集装箱。故不管春秋季沿线温度变化，都能保持货物所需的低温环境，避免变质。此方案的时间成本小于水运、经济成本小于公路运输，且可以保证货物不变质。故此方案可行。\nD项错误，连云港—霍尔果斯高速公路，简称“连霍高速”，是中国境内连接江苏省连云港市和新疆维吾尔自治区伊犁哈萨克自治州的高速公路，全长4244公里，横贯我国中部。在长途、大批量货物运输中，公路运输的单位成本通常远高于铁路和水运。其次，公路运输受路况、天气影响大，时效不稳定，且货车冷藏需要持续供电，长途运输中若出现故障，货物容易变质，风险比铁路高。此方案的时间成本、经济成本都较高，且有货物腐坏变质等风险。故此方案不可行。\n故正确答案为C。","no":31,"missingImage":false},{"type":"question","qid":"19526345","cat":"人文常识","stem":"某款创意时钟要用不同的符号替代表盘上的数字，下列设计不合适的是：","options":{"A":"用45度角的正弦“\u003cimg data-k=\"975061ff9ac7\">”替代“1”","B":"用3的阶乘“\u003cimg data-k=\"13851955c324\">”替代“6”","C":"用重力加速度“g”替代“10”","D":"用二进制数“\u003cimg data-k=\"39e7778e43a4\">”替代“12”"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，\u003cimg data-k=\"e41e1c2dccab\">，与数字1的数值差异过大，不适合直接替代。若需用三角函数替代，可选择\u003cimg data-k=\"8fd80c994320\">（值为1）。‌\nB项正确，3的阶乘“\u003cimg data-k=\"13851955c324\">”等于3×2×1=6，与数字6完全匹配，可替代‌。\nC项正确，重力加速度\u003cimg data-k=\"3facf95db426\">，四舍五入后与10接近，可替代。\nD项正确，二进制数“\u003cimg data-k=\"39e7778e43a4\">”转换为十进制为1×8+1×4+0×2+0×1=12，数值对应准确，可替代。\n本题为选非题，故正确答案为A。","no":32,"missingImage":false},{"type":"question","qid":"19526377","cat":"科技常识","stem":"关于化学平衡在人类活动中的应用，下列说法错误的是：","options":{"A":"处理硬水时，可通过加入适量石灰乳作为软化剂调节水的硬度","B":"血液中\u003cimg data-k=\"1d06524d994e\">浓度增加时，血液中水电离出的氢氧根离子会增多","C":"适当降低水温增大\u003cimg data-k=\"1d06524d994e\">的溶解度可维持冷却水管道中的盐类平衡","D":"向含有铜离子的废水中加入适量的碱可达到净化水质的环保目的"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，硬水是指含有较多可溶性钙、镁化合物的水。石灰乳（主要成分为\u003cimg data-k=\"96a2bf2a2cf3\">）可与水中的碳酸氢钙、碳酸氢镁反应生成碳酸钙、氢氧化镁沉淀，从而降低可溶性钙、镁离子浓度，达到降低水硬度的目的，是常用的硬水软化方法之一。\nB项错误，血液中\u003cimg data-k=\"1d06524d994e\">与水反应生成碳酸（\u003cimg data-k=\"cbc107b873af\">），碳酸电离出\u003cimg data-k=\"a184a87899fb\">，使血液中\u003cimg data-k=\"a184a87899fb\">浓度升高。根据水的电离平衡（\u003cimg data-k=\"0e3ee63221e6\">），\u003cimg data-k=\"a184a87899fb\">浓度增大会抑制水的电离，导致水电离出的\u003cimg data-k=\"88ee45ad84f0\">减少，而非增多。\nC项正确，\u003cimg data-k=\"1d06524d994e\">在水中的溶解度随温度降低而增大，适当降低水温可增加\u003cimg data-k=\"1d06524d994e\">溶解量，抑制冷却水管道中碳酸钙等盐类的析出（避免结垢），从而维持盐类平衡，保护管道。\nD项正确，向含铜离子（\u003cimg data-k=\"3055d5f0cb35\">）的废水中加碱（如NaOH），可使\u003cimg data-k=\"3055d5f0cb35\">与\u003cimg data-k=\"88ee45ad84f0\">反应生成氢氧化铜（\u003cimg data-k=\"c263448a0d4b\">）沉淀，通过过滤等方式去除铜离子，达到净化水质、减少重金属污染的环保目的。\n本题为选非题，故正确答案为B。","no":33,"missingImage":false},{"type":"question","qid":"19526372","cat":"科技常识","stem":"关于医学治疗手段及其原理，下列说法正确的是：","options":{"A":"体外冲击波碎石术利用次声波可以将肾结石击碎成小块，使其随尿液排出体外","B":"免疫疗法治疗癌症，能够通过激活自身免疫系统，利用T细胞直接吞噬癌细胞","C":"血液透析依据半透膜原理，将血液中的有害物质以及多余的水分清除出体外","D":"激光治疗近视，利用激光对视网膜进行切割，改变视网膜的曲率，从而矫正视力"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，体外冲击波碎石术利用的是超声波（频率高于20kHz）而非次声波。超声波频率高、波长短，在传播过程中具有方向性好、能量大、穿透能力强等特性，超声波通过高频机械振动产生的空化效应和机械应力击碎结石。次声波因频率低（&lt;20Hz）、能量分散，无法精准聚焦于结石部位，临床上无法用于击碎结石。\nB项错误，免疫疗法（如PD-1/PD-L1抑制剂）通过解除肿瘤微环境对T细胞的抑制，增强其识别和杀伤癌细胞的能力，但T细胞主要通过释放穿孔素、颗粒酶等直接杀死癌细胞，而非“吞噬”（吞噬是巨噬细胞的功能）。\nC项正确，血液透析利用半透膜的选择透过性，使血液中的小分子代谢废物（如尿素、肌酐）和多余水分通过膜孔进入透析液，从而被清除出体外。而血细胞、蛋白质等大分子被保留。\nD项错误，激光近视手术是通过切削角膜基质层改变角膜曲率从而矫正视力，而非视网膜。视网膜位于眼球后部，激光无法直接作用。\n故正确答案为C。","no":34,"missingImage":false},{"type":"question","qid":"19526355","cat":"科技常识","stem":"下列技术与其在考古领域的应用，对应错误的是：","options":{"A":"光谱分析——揭示青铜器金属元素的含量和组成","B":"中子成像技术——推断殷商青铜器铸造工艺","C":"碳14测年技术——精确判定青铜器的铸造年代","D":"3D数字建模结合X射线断层扫描——分析青铜器内部结构"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，光谱分析是指根据物质的光谱来鉴别物质及确定它的化学组成和相对含量。光谱分析的核心在于不同元素的原子在激发后会发射或吸收特定波长的光谱，通过检测光谱的波长和强度，可精准识别物质中的元素种类及含量占比。在考古领域，青铜器的性能与其铜、锡、铅的合金比例直接相关，通过光谱分析，无需破坏文物即可快速测定其元素的含量和组成，还原古代冶金技术水平。\nB项正确，中子成像技术是一种利用中子束穿透物体进行三维成像的技术，具有无损检测和穿透重金属等材料的独特优势。殷商青铜器多采用“范铸法”铸造，其内部往往残留范缝、浇道、芯撑等铸造痕迹，或存在芯土残留、铸造缺陷。中子成像技术能无创还原这些内部细节，帮助考古学家反向推导模具设计、浇铸流程等工艺特征。\nC项错误，碳14测年技术即通过测定样品中碳14同位素的衰变量计算有机物的死亡年代。该方法基于碳14在大气中生成后参与碳循环的原理，生物体死亡后碳14含量按半衰期5730年递减，被广泛应用于木炭、骨骼、贝壳及古生物化石等含碳物质的年代测定。该技术的适用前提是检测对象必须为有机物，而青铜器是金属合金，本身不含碳14，无法直接通过该技术测年。\nD项正确，X射线断层扫描（CT扫描）是一种成像技术，通过多角度发射X射线，可无创穿透青铜器，清晰呈现内部的破损、裂隙、隐藏铭文或残留芯土等结构；3D数字建模则能将CT扫描数据转化为直观的三维模型，方便考古学家进行多角度观察、测量和模拟复原。\n本题为选非题，故正确答案为C。","no":35,"missingImage":false}],"count":15,"answerable":15,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"19526312","cat":"语句表达","stem":"2024年，我国脱贫县农民人均可支配收入增幅高于全国平均水平，脱贫人口务工就业规模保持稳中有增。2025年是巩固拓展脱贫攻坚成果同乡村振兴有效衔接5年过渡期的最后一年，越是这个时候，越要扛稳责任，            ，做好监测帮扶工作。\n填入画横线部分最恰当的一项是：","options":{"A":"步步为营","B":"行稳致远","C":"慎终如始","D":"绵绵用力"},"answer":"C","explanation":"根据横线前“2025年是巩固拓展脱贫攻坚成果同乡村振兴有效衔接5年过渡期的最后一年，越是这个时候，越要扛稳责任”及横线后“做好监测帮扶工作”可知，横线处所填词语意在表达在最后阶段要“扛稳”责任、“做好”工作，强调最后阶段应与初始阶段保持一致的工作态度。C项“慎终如始”指谨慎到最后，也像开始时一样，形容始终如一地谨慎从事，符合文意，当选。\nA项，“步步为营”指军队前进一步就设下一道营垒，形容行动谨慎，做事考虑周密，强调做事注重规划与落实，与文意不符，排除；\nB项，“行稳致远”指若想走得远，必须首先走得稳，强调兼顾当下的稳妥与长远的目标，而文段重在强调守住现有成果，并非强调长远发展，与文意不符，排除；\nD项，“绵绵用力”指连续不断地，长久坚持做某事，强调的是持续努力，与文意不符，排除。\n故正确答案为C。\n【文段出处】求是网《持续巩固拓展脱贫攻坚成果》","no":36,"missingImage":false},{"type":"question","qid":"19526234","cat":"逻辑填空","stem":"在太空实验室开展的脑电测试实验中，航天员戴的“小红帽”叫作脑电帽，里面嵌入了众多微小的触头，它们像一群            的小侦探，精准捕捉大脑每一个微妙的波动。这顶帽子赋予航天员神奇的能力——无须言语，无须动作，仅仅通过思维就能给电脑下指令，操控各种设备。\n填入画横线部分最恰当的一项是：","options":{"A":"未卜先知","B":"明察秋毫","C":"洞若观火","D":"随机应变"},"answer":"B","explanation":"横线处形容“小侦探”，且根据后文“精准捕捉大脑每一个微妙的波动”可知，横线处应体现脑电帽中的微小触头能够精准捕捉大脑中的细微信号之意。B项“明察秋毫”形容人很精明，对很小的事情也能察看得清清楚楚，符合文意，当选。A项“未卜先知”指没有占卜便能事先知道，强调“预见性”；C项“洞若观火”指观察事物如同看火一样清楚，形容对事情的本质和发展趋势看得非常透彻明了，强调“看透本质”；D项“随机应变”指跟着情况的变化，掌握时机，灵活应付，强调“灵活性”，三者均无法体现“精准捕捉大脑中的细微信号”之意，排除。\n故正确答案为B。\n【文段出处】今日头条《绕地飞行的太空实验——探秘中国国家太空实验室》","no":37,"missingImage":false},{"type":"question","qid":"19526373","cat":"逻辑填空","stem":"党员干部生活作风的蜕变，往往是从吃喝等看似小事的地方开始的。“堤溃蚁孔，气泄针芒”，这句古训就是强调            的重要性。习近平同志曾在《之江新语》中写道：“小事小节是一面镜子，能够反映人品，反映作风。”党员干部要严格对照中央八项规定精神，深刻认识小与大的辩证关系，主动“照镜子”自查。\n填入画横线部分最恰当的一项是：","options":{"A":"防微杜渐","B":"积微成著","C":"慎小谨微","D":"曲突徙薪"},"answer":"A","explanation":"根据“党员干部生活作风的蜕变，往往是从吃喝等看似小事的地方开始的”及“堤溃蚁孔，气泄针芒”可知，横线处所填成语应体现要警惕小事酿成大祸之意。A项“防微杜渐”指在错误或坏事刚露出苗头时就加以制止，防止其发展扩大，符合文意，当选。\nB项“积微成著”指微小的事物不断积累就会变得显著，侧重微小积累带来积极的显著效果，而文段强调的是防范小问题负面影响的扩大，与文意不符，排除；\nC项“慎小谨微”指对琐碎的事情过分小心谨慎，以致流于畏缩，多含有贬义，而文段强调的是党员干部要警惕小事酿成大祸的正面要求，与文段感情色彩不符，排除；\nD项“曲突徙薪”比喻事先采取措施，防止危险发生，侧重提前做准备规避隐患，但文段重点是警惕已经出现的苗头性问题，时态错误，排除。\n故正确答案为A。\n【文段出处】人民日报《持之以恒加固中央八项规定堤坝（思想纵横）》","no":38,"missingImage":false},{"type":"question","qid":"19526292","cat":"逻辑填空","stem":"通用人工智能对重大情报的挖掘和精确预测，确实能够提高情报准确性，有利于减少误判；但有时也可能会使人类盲目自信，刺激其            。通用人工智能带来的进攻优势，导致最佳防御战略就是“            ”，这会打破进攻与防御的平衡，引发新型安全困境，反而增加了战争爆发的风险。\n依次填入画横线部分最恰当的一项是：","options":{"A":"孤注一掷 避实击虚","B":"轻举妄动 以攻为守","C":"刚愎自用 攻其不备","D":"铤而走险 先发制人"},"answer":"D","explanation":"第一空，根据“通用人工智能······可能会使人类盲目自信”可知，横线处所填成语应表达人类因盲目自信而导致的行为。A项“孤注一掷”比喻在危急时用尽所有力量作最后一次冒险，D项“铤而走险”指在无路可走的时候采取冒险行动，均符合文意，保留。B项“轻举妄动”指不经慎重考虑，轻率地采取行动，侧重草率行动，没有体现盲目自信，排除；C项“刚愎自用”指十分固执自信，不考虑别人的意见，侧重固执己见，多形容人的性格，无法与后文的“行为”构成对应，不符合文意，排除。\n第二空，根据“通用人工智能带来的进攻优势”以及“这会打破进攻与防御的平衡，引发新型安全困境，反而增加了战争爆发的风险”可知，横线处所填成语应体现采取“进攻”手段，可能挑起战争之意。D项“先发制人”指争取主动，先动手来制服对方，符合文意，当选。A项“避实击虚”指避开敌人的主力，找敌人的弱点进攻，侧重攻击对方弱点，未体现主动挑起战争之意，不符合文意，排除。\n故正确答案为D。\n【文段出处】解放军报《AGI带来的战争思考》","no":39,"missingImage":false},{"type":"question","qid":"19526382","cat":"逻辑填空","stem":"新史料被发掘，有赖于史家具有证据意识。若是史家不认为某个史料可以作为证据，该史料可能会被            。比如甲骨文，起初甲骨被当作龙骨入药，不被史家关注。但晚清学者王懿荣意识到龙骨非同寻常，后经考证确认甲骨文是商代文字，之后史家以此为证据重构殷商历史，为中华文明起源这一重大问题提供了        支点。\n依次填入画横线部分最恰当的一项是：","options":{"A":"视而不见  稳固","B":"弃如敝屣  崭新","C":"断章取义  可靠","D":"束之高阁  坚实"},"answer":"D","explanation":"第一空，根据“史家不认为某个史料可以作为证据”“比如甲骨文，起初甲骨被当作龙骨入药，不被史家关注”可知，横线处需体现史料因没有受到认可而不被当成证据来使用。D项“束之高阁”指扔在一边，不去用它或管它，符合文意，保留。A项“视而不见”指不理睬，看见了当作没看见，形容对眼前事物不重视、不关心，常表示主观上故意忽略眼前事物，但文段中的史料在未被发掘或认可前，可能根本不在史家的视野范围内，并非“看见却忽略”，因此与语境不符，排除；B项“弃如敝屣”比喻对自认为无价值的事物毫不惋惜地抛弃，置于此处程度过重，文段只是暂时不被用作证据，未必彻底抛弃，排除；C项“断章取义”指不管全篇文章或谈话的内容，而只根据自己的需要孤立地取其中一段或一句的意思，与文意无关，排除。\n第二空，代入验证。搭配“支点”，且根据“后经考证确认甲骨文是商代文字，之后史家以此为证据重构殷商历史”可知，横线处需体现支点牢固可靠的特点。D项“坚实”指坚固结实，符合文意且与“支点”搭配恰当，当选。\n故正确答案为D。\n【文段出处】光明日报《证据意识与新史料的发掘》","no":40,"missingImage":false},{"type":"question","qid":"19526384","cat":"逻辑填空","stem":"利用网络存在的安全漏洞入网窃取数据信息，这种方式相当隐蔽，往往会使数据的安全响应            ；而且网络中流转数据的规模十分巨大，来源异常复杂，攻击者一旦掌握网络漏洞，入侵网络后就可以在网上“            ”，窃取数据。因此，必须严密防范数据在共享过程中可能遭受的各种攻击和泄露。\n依次填入画横线部分最恰当的一项是：","options":{"A":"防不胜防 按图索骥","B":"形同虚设 守株待兔","C":"名存实亡 偷天换日","D":"鞭长莫及 瓮中捉鳖"},"answer":"B","explanation":"第一空，搭配“安全响应”，根据“利用网络存在的安全漏洞入网窃取数据信息，这种方式相当隐蔽”可知，横线处应体现安全响应机制难以发挥作用之意。B项“形同虚设”形容事物空有形式而无实际效用，符合文意且与“安全响应”搭配恰当，保留。A项“防不胜防”指要防备的太多，防备不过来，“安全响应”是在安全事件发生后的反应，无法发出“防备”的动作，与“安全响应”搭配不当，排除；C项“名存实亡”指名义上还有，实际上已经不存在，文段并非表达安全响应实际上已经不存在之意，程度过重，排除；D项“鞭长莫及”比喻距离太远而无能为力，文段并未体现距离过远，与文意不符，排除。\n第二步，代入验证。根据“攻击者一旦掌握网络漏洞，入侵网络后就可以在网上······窃取数据”可知，横线处应体现攻击者入侵后可轻松获取数据之意，且根据双引号可知，此处为形象表达。B项“守株待兔”比喻不主动努力，而存万一的侥幸心理，希望得到意外的收获，可以体现网络攻击者入侵后就如同等待猎物一样可轻松窃取数据，符合文意，且能够与文段内容构成形象表达，当选。\n故正确答案为B。\n【文段出处】中国军网《数据泛在共享面临挑战》","no":41,"missingImage":false},{"type":"question","qid":"19526240","cat":"逻辑填空","stem":"五彩滩是一处著名的雅丹地貌景观，位于新疆维吾尔自治区，中国唯一一条注入北冰洋的河流额尔齐斯河穿其而过。南岸有绿洲、沙漠，北岸则是            的泥岩、砂岩及砂砾组成的奇石怪岩，这两种            的地貌遥相辉映，“一河隔两岸，胜似两重天”。\n依次填入画横线部分最恰当的一项是：","options":{"A":"鳞次栉比  大相径庭","B":"千姿百态  别具一格","C":"色彩斑斓  截然不同","D":"绚丽多姿  各有千秋"},"answer":"C","explanation":"第一空，根据“五彩滩是一处著名的雅丹地貌景观”“北岸则是······泥岩、砂岩及砂砾组成的奇石怪岩”可知，横线处要体现出五彩滩的“多彩”特点，C项“色彩斑斓”指颜色绚丽多彩，D项“绚丽多姿”指色彩华丽灿烂、形态或风貌丰富多样，均符合文意，保留。A项“鳞次栉比”指像鱼鳞和梳子的齿一样，一个挨着一个地排列着，多形容房屋等密集，B项“千姿百态”形容姿态多种多样，各不相同，均与文意不符，排除。\n第二空，根据“南岸有绿洲、沙漠，北岸则是······的泥岩、砂岩及砂砾组成的奇石怪岩”“一河隔两岸，胜似两重天”可知，横线处要体现出南北两岸风貌差距极大，C项“截然不同”形容两种事物没有一点共同之处，符合文意，当选。D项“各有千秋”指各有各的存在价值，各有所长，各有优点，与文意不符，且用法错误，可以表达为“两种地貌各有千秋”，排除。\n故正确答案为C。\n【文段出处】中国国家地理《布尔津五彩滩——“一河隔两岸，胜似两重天”》","no":42,"missingImage":false},{"type":"question","qid":"19526241","cat":"逻辑填空","stem":"面对新的形势和要求，必须进一步全面深化改革，继续完善各方面制度机制，因而制度建设的任务更为繁重艰巨，加强顶层设计更为重要。如果不能全景式俯瞰和把握制度建设全局，采取总体构想和战略谋划，做到胸中有数，            地层层系统设计，难免顾此失彼、            ，无法取得制度建设的成效。\n依次填入画横线部分最恰当的一项是：","options":{"A":"抽丝剥茧 捉襟见肘","B":"循序渐进 进退维谷","C":"由表及里 得不偿失","D":"自上而下 左支右绌"},"answer":"D","explanation":"本题可从第二空入手，根据横线前“、”可知，横线处与“顾此失彼”构成近义并列，需体现应付不了之意，A项“捉襟见肘”比喻顾此失彼，应付不过来，D项“左支右绌”指力量不足，应付了这一方面，那一方面又有了问题，均与文意相符，保留。B项“进退维谷”形容处于进退两难的困境，C项“得不偿失”指得到的抵不上失去的，均与文意无关，排除。\n第一空，根据“加强顶层设计更为重要”“如果不能全景式俯瞰和把握制度建设全局，采取总体构想和战略谋划，做到胸中有数”“层层系统设计”可知，横线处需体现从全局逐步向下推进之意，D项“自上而下”意为从上到下，与文意相符，当选。A项“抽丝剥茧”形容对事物进行细致入微、层次分明的分析，强调由表及里逐步探究本质的思维方式，与文意无关，排除。\n故正确答案为D。\n【文段出处】中国社会科学报《制度建设：明晰思路、建构体系和优势转化》","no":43,"missingImage":false},{"type":"question","qid":"19526267","cat":"逻辑填空","stem":"未来特战力量可通过智能辅助，直接干扰或控制敌方指挥控制系统，造成敌方思想混乱、心理受挫甚至出现幻觉；或者通过伴随无人平台实施网络作战，篡改指控系统指令和数据实现“            ”，致使敌方指挥失灵、协同失效、人员失能，            地失去战斗力，从而实现“不战而屈人之兵”。\n依次填入画横线部分最恰当的一项是：","options":{"A":"移花接木 彻头彻尾","B":"釜底抽薪 无声无息","C":"暗度陈仓 潜移默化","D":"反客为主 浑然不觉"},"answer":"B","explanation":"第一空，根据“通过伴随无人平台实施网络作战，篡改指控系统指令和数据实现‘            ’”“致使敌方指挥失灵、协同失效、人员失能，            地失去战斗力，从而实现‘不战而屈人之兵’”可知，横线处应表达通过篡改指令和数据，彻底使敌方丧失战斗能力之意。B项“釜底抽薪”比喻从根本上解决问题，此处指从根本上使敌方指挥系统失效，符合文意，保留。A项“移花接木”比喻使用手段暗中更换，虽与“篡改”相关，但更侧重“替换”而非“根本性破坏”，与后文“致使敌方指挥失灵、协同失效、人员失能”这种彻底瓦解战斗力的语境相比，程度不足，排除；C项“暗度陈仓”强调用假象迷惑对方、暗中行动，文段未提及迷惑性假象，排除；D项“反客为主”指变被动为主动，与篡改指令的语义关联不强，排除。\n第二空，代入验证。B项“无声无息”比喻没什么动静，与“不战而屈人之兵”相呼应，体现让敌人在毫无察觉中丧失战斗力，符合智能作战和网络攻击的特点，当选。\n故正确答案为B。\n【文段出处】解放军报《试析未来特种作战行动样式》","no":44,"missingImage":false},{"type":"question","qid":"19526322","cat":"逻辑填空","stem":"对于不符合著作权法、专利法、商标法等专门法保护条件的创新成果，反不正当竞争法为其提供了        保护。面对数字时代            的新型不正当竞争行为，反不正当竞争法通过一般条款的灵活解释和适用，能够及时规制尚未被其他专门法        的知识产权侵权行为，防止创新成果被不正当使用。\n依次填入画横线部分最恰当的一项是：","options":{"A":"补充  层出不穷  覆盖","B":"特殊  屡见不鲜  界定","C":"升级  五花八门  收录","D":"额外  应运而生  明确"},"answer":"A","explanation":"第一空，根据“反不正当竞争法通过······能够及时规制尚未被其他专门法······的知识产权侵权行为，防止创新成果被不正当使用”可知，反不正当竞争法可以对专门法保护不到的创新成果进行保护，故横线处应体现出反不正当竞争法能弥补其他专门法的不足之意。A项“补充”指原来不足或有损失时，增加一部分，D项“额外”指超出规定数量或范围，强调规定份额之外的，均符合文意，保留。B项“特殊”指不同于同类的事物或不同的情况，强调特殊性，与文意不符，排除；C项“升级”指从较低的等级或班级升到较高的等级或班级，强调等级升高，与文意不符，排除。\n第二空，根据“面对数字时代······的新型不正当竞争行为”可知，横线处应体现数字时代不断出现各种不正当竞争行为之意。A项“层出不穷”指接连不断地出现，没有穷尽，符合文意，保留。D项“应运而生”指顺应某种时机、条件、需要等而产生，常用于积极语境中，与“不正当竞争行为”这一消极话题搭配不当，排除。\n第三空，代入验证，根据“反不正当竞争法通过一般条款的灵活解释和适用，能够及时规制尚未被其他专门法······的知识产权侵权行为”可知，这些行为是专门法没涵盖、未涉及到的。A项“覆盖”指遮盖，符合文意，当选。\n故正确答案为A。\n【文段出处】《加强知识产权保护 繁荣发展数字文化产业》","no":45,"missingImage":false},{"type":"question","qid":"19526307","cat":"逻辑填空","stem":"中生代寄生蠕虫的化石数量并不稀少，但由于其地质年代相较于寒武纪、奥陶纪等更年轻，常被认为难以        深层次的生物演化奥秘。其次，这些蠕虫往往体型微小，化石保存状况不佳。再者，它们形态单调、特征        ，使得分类鉴定难度极高。因此，中生代寄生蠕虫的相关研究仍然            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"阐释 相似 凤毛麟角","B":"蕴含 泛化 停滞不前","C":"探寻 统一 无从下手","D":"揭示 模糊 屈指可数"},"answer":"D","explanation":"第一空，根据横线前“由于其地质年代相较于寒武纪、奥陶纪等更年轻”可知，横线处所填词语应表达由于中生代寄生蠕虫的地质年代较年轻，难以通过其化石探明深层次的生物演化奥秘之意。A项“阐释”指通过说明、陈述对事物进行深入解释，C项“探寻”指探求，寻找，D项“揭示”指使人看见原来不容易看出的事物，均符合文意，保留。B项“蕴含”指包含，文段此处意在强调难以通过化石了解奥秘，而非化石本身难以“包含”奥秘，与文意不符，排除。\n第二空，根据横线后“使得分类鉴定难度极高”可知，横线处所填词语应表达特征不清晰之意。A项“相似”指相像，特征相像也可能导致鉴定难，C项“统一”指整体的，一致的，无差别的，D项“模糊”指不分明，不清楚，均符合文意，保留。\n第三空，根据前文“地质年代······更年轻”“化石保存状况不佳”“分类鉴定难”的多重原因可知，横线处所填成语应表达中生代寄生蠕虫的相关研究数量很少之意。D项“屈指可数”指数量少，符合文意，当选。A项“凤毛麟角”比喻珍贵稀有的人才或事物，文段并未体现研究很珍贵之意，且与“相关研究”搭配不当，排除；C项“无从下手”指事物头绪繁复导致无法找到处理途径，置于此处程度太重，排除。\n故正确答案为D。\n【文段出处】科学大院-《采到一块神秘的化石，7年后才知道是什么》","no":46,"missingImage":false},{"type":"question","qid":"19526293","cat":"逻辑填空","stem":"敢于正视问题的反面是回避矛盾、            ，个别表现在：发言提纲套用、借用、翻用，发言内容偏离主题、不及重点，            、似曾相识，剖析问题避重就轻、            ，相互批评官话、套话······凡此种种，致使民主生活会的批评和自我批评有形式而无实质内容和效果，必须防止和纠正。\n依次填入画横线部分最恰当的一项是：","options":{"A":"敷衍了事 老生常谈 隔靴搔痒","B":"虚与委蛇 长篇大论 大而化之","C":"畏首畏尾 陈词滥调 浮光掠影","D":"闪烁其词 不痛不痒 张冠李戴"},"answer":"A","explanation":"第一空，根据“、”以及“个别表现在：发言提纲套用、借用、翻用，发言内容偏离主题、不及重点······相互批评官话、套话”可知，横线处与“回避矛盾”形成并列关系，表达不负责、不直面问题之意。A项“敷衍了事”指办事马马虎虎，只求应付过去就算完事，D项“闪烁其词”指言语遮遮掩掩，吞吞吐吐，侧重于说话不明确，可体现回避矛盾不直说之意，均符合文意，保留。B项“虚与委蛇”指对人虚情假意，敷衍应酬，虽有敷衍之意，但侧重于对人的态度，而非做事的态度，与文意不符，排除；C项“畏首畏尾”形容胆子小，疑虑重重，侧重于胆小，与文意无关，排除。\n第二空，根据“、”可知，横线处与“似曾相识”形成并列关系，体现发言内容没有新意之意。A项“老生常谈”比喻人们听惯了的没有新鲜意思的话，符合文意，保留。D项“不痛不痒”比喻言行没有切中要害，不解决实际问题，与文意不符，排除。\n第三空，代入验证。根据“、”可知，横线处与“避重就轻”形成并列关系，体现剖析问题找不到关键之意。A项“隔靴搔痒”比喻说话、作文等不中肯，没有抓住问题的关键，符合文意，当选。\n故正确答案为A。\n【文段出处】中国纪检监察报《方圆谈｜“用好批评和自我批评的武器”⑤敢于正视 主动改正》","no":47,"missingImage":false},{"type":"question","qid":"19526381","cat":"逻辑填空","stem":"城镇化发展不宜            。城镇化率低且人口规模大的地区，应着重提升水平、挖掘潜力；城镇化率较高且人口持续集聚的地区，不妨促进大中小城市和小城镇        发展。在此过程中，要坚持系统观念，统筹城乡、双向发力。如此，才能在城乡一体、良性互动中，让城镇化成为一个顺势而为、            的发展过程。\n依次填入画横线部分最恰当的一项是：","options":{"A":"一步到位 共同 自然而然","B":"一哄而上 均衡 顺理成章","C":"千篇一律 融合 大势所趋","D":"整齐划一 协调 水到渠成"},"answer":"D","explanation":"第一空，根据“城镇化率低且人口规模大的地区，应着重提升水平、挖掘潜力；城镇化率较高且人口持续集聚的地区······发展”可知，文段强调针对不同地区应采取不同的城镇化发展策略，故城镇化发展不宜相同，横线处所填成语需体现相同之意。C项“千篇一律”指事物只有一种形式，毫无变化，也比喻按一种格式机械地办事，D项“整齐划一”强调规格一致、步调统一，均符合文意，保留。A项“一步到位”指一次就达到预定的目标，与文意不符，排除；B项“一哄而上”形容盲目跟风行动，多用于新生事物、稀缺事物的语境，而城镇化并非新生或稀缺事物，排除。\n第二空，根据“统筹城乡、双向发力”可知，大中小城市和小城镇应当互相配合，协同发展。D项“协调”指和谐一致，配合得当，与文意相符，且“协调发展”搭配恰当，为政府公文常用表述，保留。C项“融合”指几种不同的事物合成一体，文段并未提及大中小城市和小城镇要交融到一起，排除。\n第三空，代入验证，根据“坚持系统观念，统筹城乡、双向发力”以及“城乡一体、良性互动”可知，城镇化这一目标在正确观念的指引下、正确做法的推进下将会实现，D项“水到渠成”比喻条件成熟则事情自然成功，符合文意，且与“顺势而为”形成逻辑衔接，当选。\n故正确答案为D。\n【文段出处】人民日报《新型城镇化 因“人”更精彩》","no":48,"missingImage":false},{"type":"question","qid":"19526402","cat":"逻辑填空","stem":"领导干部领导水平的高低，很重要的一点就在于能否预见在先、            ，如果没有“草摇叶响知鹿过”的        、“窥一斑而知全豹”的预判，见事迟、反应慢，倾向性问题就可能不断叠加、        、升级，造成无法挽回的损失。因此，领导干部要做到早预警、早干预，避危于无形、止损于未发。\n依次填入画横线部分最恰当的一项是：","options":{"A":"独具慧眼  警惕  延伸","B":"见微知著  谨慎  激化","C":"胸有成竹  细致  辐射","D":"未雨绸缪  敏锐  演变"},"answer":"D","explanation":"第一空，根据“、”可知，横线处与“预见在先”构成并列，语义相近，应体现提前预判、提前察觉之意。B项“见微知著”指见到事情的苗头，就能知道它的实质和发展趋势，D项“未雨绸缪”比喻事先做好准备工作，防范意外发生，均符合文意，保留。A项“独具慧眼”形容眼光敏锐，见解高超，与文意不符，排除；C项“胸有成竹”比喻做事之前已经有通盘的考虑，侧重强调有把握，与文意不符，排除。\n第二空，根据“草摇叶响知鹿过”“窥一斑而知全豹”可知，横线处应体现对细微信号的敏感捕捉与精准洞察能力。D项“敏锐”指（感觉）灵敏，（眼光）尖锐，符合文意，保留。B项“谨慎”指对外界事物或自己的言行密切注意，以免发生不利或不幸的事情，与文意无关，排除。\n第三空，代入验证，根据“、”以及“叠加”“升级”可知，横线处应体现倾向性问题严重程度逐步加深的递进关系。D项“演变”指发展变化，可与“叠加”“升级”构成递进关系，符合文意，当选。\n故正确答案为D。\n【文段出处】中国军网-解放军报《增强见事于细、见事于早的洞察力》","no":49,"missingImage":false},{"type":"question","qid":"19526320","cat":"逻辑填空","stem":"进一步全面深化司法改革，必须聚焦改革的本质要求，严格依法依规推进改革，所有履职都要立足宪法法律赋权，        职能边界，不脱离法院职能，不超越法院职权，更不能            ，确保改革不偏离正确方向。积极发挥法治对改革的引导、推动、规范、        作用，确保重大改革依法有序、于法有据，增强改革的执行力、穿透力。\n依次填入画横线部分最恰当的一项是：","options":{"A":"遵循 各自为政 监督","B":"划定 为所欲为 震慑","C":"厘清 画地为牢 约束","D":"恪守 越俎代庖 保障"},"answer":"D","explanation":"第一空，搭配“边界”，B项“划定”指经划分后固定或确定界限的行为，C项“厘清”指梳理清楚，D项“恪守”指严格遵守，均与“边界”搭配恰当，保留。A项“遵循”指遵照，常搭配“方法”“规则”等，与“边界”搭配不当，排除。\n第二空，根据“更”可知，横线处与“超越法院职权”构成递进关系，应体现超越职权之意，且程度更重，D项“越俎代庖”比喻超出自己业务范围去处理别人所管的事，置于此处可体现越权并付诸行动之意，符合文意，保留。B项“为所欲为”指很随意地想干什么就干什么，C项“画地为牢”比喻只许在规定好的范围内活动，均不能与前文构成递进关系，排除。\n第三空，代入验证，D项“保障”指保护（权利、生命、财产等）使不受侵害，与“作用”搭配恰当，当选。\n故正确答案为D。\n【文段出处】法制日报《进一步全面深化司法改革 加快推进中国式法治现代化》","no":50,"missingImage":false},{"type":"question","qid":"19526302","cat":"语句表达","stem":"何为担当作为？从字面上看，担当作为就是承担起应尽的责任和义务，发挥出应有的能力和能量，创造出应然的成绩和实效；从辩证法看，担当是作为的前提和基础，作为是担当的体现和成效，二者相辅相成。习近平总书记强调：“                    。”事业发展不可能一帆风顺，做事总有风险，因此才需要担当。有时候越怕事越容易出事，越想绕道走矛盾就越堵着道。只有敢于担当，豁得出去、敢闯敢干，矛盾和困难才可能得到解决。\n填入画横线部分最恰当的一项是：","options":{"A":"担当作为就要真抓实干、埋头苦干，决不能坐而论道、光说不练","B":"党把干部放在各个岗位上是要大家担当干事，而不是做官享福","C":"担当和作为是一体的，不作为就是不担当，有作为就要有担当","D":"如果不担当、不作为，没有执行力、战斗力，那是要打败仗的"},"answer":"C","explanation":"横线出现在文段中间，需结合前后文进行分析。横线前引出“担当作为”的话题，从“字面”和“辩证法”两个角度论述“担当”与“作为”辩证统一的关系，横线后指出事业发展有风险需要担当，只有敢于担当才能解决矛盾。结合横线前后文内容可知，横线处既要承接前文“担当”与“作为”的辩证统一关系，又要能引出后文所论述的“需要担当”，C项“担当和作为是一体的，不作为就是不担当，有作为就要有担当”直接点明担当与作为的同一性，与前文“担当是作为的前提，作为是担当的体现”紧密呼应，且自然引出后文“才需要担当”的论述，衔接恰当，当选。\nA项，强调“真抓实干、埋头苦干”，与前后文“辩证关系”和“风险矛盾”话题衔接不紧密，排除；\nB项，强调干部要担当干事，未体现“作为”与“担当”的关系，无法承接前文，排除；\nD项，强调不担当、不作为的后果，未体现出二者之间的关系，且后文与“打败仗”无关，排除。\n故正确答案为C。\n【文段出处】人民日报《让担当作为蔚然成风（思想纵横）》","no":51,"missingImage":false},{"type":"question","qid":"19526388","cat":"片段阅读","stem":"埋藏较浅的饱水松散砂土遭受地震等强烈振动时，颗粒间的位置迅速调整，相互间失去接触压力和摩擦力，有被振密的趋势。由于孔隙水压力急剧升高，颗粒快速聚集、挤出，随着水流不断翻滚，由固态砂土变成液态混合物，这个过程叫作“液化”。液态混合物会向压力低的方向运动，若地下有合适的通道或洞穴，则会涌向这些地方。当它们涌出地表，呈现喷砂冒水状态时，就被称为“砂涌”。它们在流动过程中会破坏沿途的地貌景观和建筑，严重时还会造成人畜伤亡。\n这段文字所描述的自然现象可以概括为：","options":{"A":"潜藏在地下的“暗河”","B":"被摇成“液体”的砂土","C":"沙漠中的“隐形”杀手","D":"大地的“多米诺骨牌”效应"},"answer":"B","explanation":"文段开篇介绍埋藏较浅的饱水松散砂土在遭受地震等强烈振动时，颗粒间位置调整，由于孔隙水压力升高，固态砂土会变成液态混合物，即“液化”，接着说明液态混合物会向压力低的方向运动，涌出地表形成“砂涌”，最后阐述其在流动过程中的危害。故文段围绕的核心话题为“砂土”，重点介绍了砂土在特定条件下变成液态混合物及形成砂涌的现象，对应B项。\nA项，“暗河”表述不明确，未提及文段主题词“砂土”，排除；\nC项，“沙漠”无中生有，且未提及文段主题词“砂土”，排除；\nD项，“多米诺骨牌”效应指系统中微小初始能量引发系列连锁变化，无中生有，且未提及文段主题词“砂土”，排除。\n故正确答案为B。\n【文段出处】知识就是力量2024年05期《砂土液化》","no":52,"missingImage":false},{"type":"question","qid":"19526380","cat":"片段阅读","stem":"当前国际局势急剧变化，确保战略物资供应的安全与稳定已成为捍卫国家核心利益的战略制高点，世界多个国家立足战略物资供应链安全保障，已多轮更新《关键矿产清单》，展现了高度的敏锐性与响应速度。我国自《全国矿产资源规划（2016-2020年）》明确将稀土、晶质石墨等24种矿产纳入战略性矿产范畴以来，虽已奠定坚实基础，但在面对新兴战略物资尤其是对战略性新兴产业构成关键制约的矿物时，清单的更新步伐尚显滞后。以氢能电池产业为例，其核心材料如铂族金属等在全球战略价值日益凸显，却在我国当前的储备规划中未能获得应有的重视与优先地位。\n这段文字意在说明：","options":{"A":"战略储备规划要与新能源发展需求相匹配","B":"铂族金属应纳入国家战略性矿产资源目录","C":"我国战略物资清单的更新力度亟待加强","D":"新形势对我国物资储备体系提出新要求"},"answer":"C","explanation":"文段开篇指出确保战略物资供应安全与稳定的重要性，并通过多个国家的行动，说明更新《关键矿产清单》的价值。随后通过“但”构成转折，强调我国战略物资清单更新步伐滞后，并以氢能电池产业核心材料铂族金属为例证明。故文段重点强调我国战略物资清单的更新速度跟不上新兴战略物资的发展需求，应提高其更新速度，对应C项。\nA项，文段重点强调的是我国战略物资清单更新滞后的问题，而非“战略储备规划与新能源发展需求”两者之间的关系，主题词错误，排除；\nB项，“铂族金属”为举例论证中的内容，非重点，排除；\nD项，“新形势对我国物资储备体系提出新要求”表述不明确，文段强调的是我国战略物资清单更新步伐滞后这一核心问题，排除。\n故正确答案为C。\n【文段出处】人民论坛网·国家治理网《建设富有韧性的国家战略物资储备体系》","no":53,"missingImage":false},{"type":"question","qid":"19526301","cat":"片段阅读","stem":"随着人工智能时代的到来，“未来人”和“远方的陌生人”问题逐渐进入人类的伦理视界。传统伦理学是“近的伦理学”，强调人与人之间的直接交往，行为双方是熟悉的、共同在场的，道德时空是近距离的。科技深度介入使人类的道德空间和行为性质发生改变，一些新的对象（如人工智能）逐渐进入我们为之负责和道德关切的领域。人工智能作为新科技，给人类的伦理世界和道德空间带来了深刻变革，它以虚拟化和拟人化的方式与人类建立了新的交往关系，伦理关系从“人与人”“人与动物”“人与自然”扩展到“人与人工智能”。\n这段文字接下来最可能介绍：","options":{"A":"未来人工智能技术的发展趋势","B":"影响人类道德空间的技术因素","C":"人工智能时代人际交往模式的新变化","D":"人工智能带来的伦理挑战和道德困境"},"answer":"D","explanation":"文段开篇介绍在人工智能时代的大背景下，一些问题进入伦理视界，接着指出传统伦理学是近距离的、熟悉的直接交往，科技的深度介入使人工智能逐渐进入到我们为之负责和道德关切的领域。最后强调人工智能给人类的伦理世界和道德空间带来深刻变革，伦理关系从原来的“人与人”“人与动物”“人与自然”扩展到“人与人工智能”。故文段最后介绍的是人工智能给伦理世界和道德空间带来变革，接下来应继续围绕这一话题展开，对应D项。\nA、C两项，均仅提及“人工智能”，未提及“伦理和道德”，偏离文段最后谈论的核心话题，衔接不当，排除；\nB项，“技术因素”范围扩大，且未提及“伦理和道德”，偏离文段最后谈论的核心话题，衔接不当，排除。\n故正确答案为D。\n【文段出处】光明日报《构建负责任人工智能治理体系的伦理路》","no":54,"missingImage":false},{"type":"question","qid":"19526304","cat":"片段阅读","stem":"随着我国城镇化率逐步提高，城市已经成为人口集聚的主要空间。要实现智慧城市的发展目标，必须紧跟新一代数字技术发展趋势，找准数字技术融入市域社会治理的“小切口”，促进两者深度融合。可建设区、街、社（村）三层结构的数智化基层治理平台，覆盖社区治理全域组织工作场景，有效破解基层治理“小马拉大车”的突出问题。通过建设数智化基层治理平台，加快实现市域社会管理手段、管理模式、管理理念创新，推动城市治理和运行从数字化到智能化再到智慧化的转型升级。\n最适合做这段文字标题的是：","options":{"A":"变“治理”为“智理”，提升城市智治水平","B":"从“数字”到“数智”，打造基层治理平台","C":"数字技术：提升基层治理的新手段","D":"基层治理：从末梢发力向智慧升级"},"answer":"A","explanation":"文段开篇交代背景，即我国城镇化率提高，城市成为人口集聚的主要空间。随后指出要实现智慧城市发展目标，需紧跟新一代数字技术发展趋势，让数字技术与市域社会治理相融合。后文给出明确对策，即建设区、街、社（村）三层结构的数智化基层治理平台。尾句进一步强调，该平台可推动城市治理实现从数字化到智能化再到智慧化的转型升级。故文段重点在对策部分，强调通过建设数智化基层治理平台可以实现城市治理的智慧化转型升级，A项精准概括了文段从“治理手段创新”到“智慧化升级”的核心脉络，其中“智理”一词巧妙呼应“智慧治理”，形象贴切，契合主旨，当选。 \nB项，“打造基层治理平台”表述片面，文段的落脚点不仅仅是“打造平台”，而是通过这个平台实现城市治理的智慧化转型升级，排除；\nC项，“数字技术”表述不明确，未体现“数智化平台”与“城市治理智慧化”之间的关系，排除；\nD项，“基层治理”概念偷换，且未表明“数智化”，排除。\n故正确答案为A。\n【文段出处】光明日报《市域管理：变“治理”为“智理”》","no":55,"missingImage":false},{"type":"question","qid":"19526399","cat":"片段阅读","stem":"在信息技术领域，晶体管和激光器是两大核心元件。晶体管的微型化推动电子芯片飞速发展，催生摩尔定律，即每隔约18个月，集成电路上可容纳的晶体管数量将翻一番，这一趋势推动最先进的晶体管尺寸达到纳米级别。相比晶体管，缩小激光器的难度要大得多，因为两者所依赖的微观粒子截然不同，前者依赖电子，后者依赖光子。在可见光和近红外波段，光子波长比晶体管中的电子波长高出3个数量级。受衍射极限制约，这些光子能被压缩到的最小模式体积比晶体管中的电子要大10亿倍。因此，构建纳米尺度激光器的核心挑战在于如何突破衍射极限，将光子的体积“压缩”到最小。\n这段文字主要介绍：","options":{"A":"构建纳米尺度激光器的难点","B":"信息技术领域面临的核心挑战","C":"摩尔定律对于突破衍射极限的制约","D":"晶体管微型化对电子芯片发展的意义"},"answer":"A","explanation":"文段开篇介绍信息技术领域的两大核心元件，即晶体管和激光器。随后说明晶体管的微型化推动最先进的晶体管尺寸达到纳米级别，接着通过对比指出，激光器缩小难度比晶体管更大，并分析其物理原因——光子波长数量级较高，受衍射极限限制，最小模式体积远大于电子，最后通过“因此”总结，强调构建纳米尺度激光器的核心挑战在于突破衍射极限、压缩光子体积。故文段重点在于分析构建纳米尺度激光器的难点，对应A项。\nB项，“信息技术领域”范围过大，文段聚焦构建纳米尺度激光器问题，排除；\nC项，“摩尔定律对于突破衍射极限的制约”文段并未提及，无中生有，排除；\nD项，“晶体管微型化对电子芯片发展的意义”仅对应文段的引入铺垫部分，非重点，排除。\n故正确答案为A。\n【文段出处】光明日报《纳米激光器：“小”到极致的光》","no":56,"missingImage":false},{"type":"question","qid":"19526379","cat":"语句表达","stem":"如何培育好独角兽企业，是一个大课题。不同类型的独角兽企业，需求完全不同。比如，有的企业需要大量计算资源的支持，有的企业需要与高校相关科研力量加速对接，有的企业则需要共性技术平台支持。显然，粗放式的政策供给难以满足不同类型独角兽企业的复杂需求，                    ，助力企业加速成长。未来，随着机制的不断创新和完善，将能培育出更多优质的独角兽企业，为经济的高质量发展注入强劲动力。\n填入画横线部分最恰当的一项是：","options":{"A":"有关部门应倾听独角兽企业的“声音”","B":"唯有精准施策方可解决不同的“烦恼”","C":"面向独角兽企业的“管家”应运而生","D":"机制创新无疑是解决问题的“又一村”"},"answer":"B","explanation":"本题为语句填空题，横线位于文段中间，需结合上下文内容进行分析。文段开头引出培育独角兽企业的话题，并说明不同类型企业需求不同的现状，接着通过举例进行具体说明，随后通过“显然”引出粗放式的政策供给难以满足不同类型独角兽企业的复杂需求这一问题，横线后阐述机制创新完善的积极意义，即改变粗放式政策，采用新对策后带来的积极影响。故横线处填入对策，应体现改变粗放式政策，针对不同类型独角兽企业的需求的具体做法，即面对不同企业需求精准施策，对应B项。\nA项，“倾听‘声音’”表述不明确，文段重在强调做法的针对性，满足不同类型企业的需求，选项无法衔接前后文内容，排除；\nC项，“管家”与前文话题衔接不当，排除；\nD项，“机制创新”较为宏观，无法针对性解决粗放式政策带来的问题，横线处需体现解决问题的具体对策，相比于B项，表述不明确，排除。\n故正确答案为B。\n【文段出处】人民日报《精准施策助力成长（快评）》","no":57,"missingImage":false},{"type":"question","qid":"19526385","cat":"语句表达","stem":"①在这种条件下点火并稳定燃烧，好比在12级狂风中点燃一根火柴\n②在高超声速飞行器穿越云霄的征途中，动力推进技术就是打开高速大门的金钥匙\n③当燃烧室内气流流速超过声速时，会形成复杂的激波系，激波前后气流状态会产生突变\n④目前，超燃冲压发动机是这一领域的明星，它可以在大气中有效获取氧气，并且在高超声速条件下稳定燃烧\n⑤想象一下，让一个重达数吨的飞行器在空气稀薄的高空中以数倍声速疾驰，需要多么强大的发动机提供足够的推力\n⑥此时，常规的发动机技术完全不能适用，只有超燃冲压发动机才能在极短时间内将大量燃料转化为推力，并让飞行器加速稳定在高超声速\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"②⑥③①④⑤","B":"②⑤④③①⑥","C":"⑤④①⑥③②","D":"⑤③②④⑥①"},"answer":"B","explanation":"观察选项，对比首句。②句引入“高超声速飞行器”这一话题并指出动力推进技术是高超声速飞行器的关键，⑤句指出飞行器在高空中高速疾驰的过程中，对发动机推力的严苛要求，根据行文逻辑，应先引出高超声速飞行器这一话题，强调动力推进技术的重要性之后，再以“想象一下”引导一个具体的场景对②句中的观点进行论证，故②句应在⑤句之前，排除C、D两项。\n分析A、B两项，对比尾句。⑤句指出飞行器在高空中高速疾驰的过程中，对发动机推力的严苛要求，⑥句通过对比常规发动机与超燃冲压发动机，指出超燃冲压发动机在高超声速条件下的不可替代性，根据行文逻辑，应先提出对发动机推力的严苛要求，再总结超燃冲压发动机在高超声速条件下的不可替代性，故⑤句应在⑥句之前，排除A项。\n故正确答案为B。\n【文段出处】中国军网-解放军报《高超声速飞行器：穿越云霄的“极速传奇”》","no":58,"missingImage":false},{"type":"question","qid":"19526401","cat":"语句表达","stem":"①非周期性意味着，由这种形状构成的整体图案，不能通过平移或旋转来恢复相同的图案\n②在后续的研究中，数学家们逐渐缩小这一数字，直到20世纪70年代，罗杰·彭罗斯仅使用两种不同的菱形，就完成了非周期性铺砌\n③“爱因斯坦”来源于德语，意思是“一块石头”，指的是单铺砌块\n④在数学的铺砌领域，寻找“爱因斯坦”是许多数学家追求了半个多世纪的“圣杯”\n⑤单铺砌块指的是一个可以填满无限平面，且不会自我重复的非周期性铺砌块\n⑥早期的数学家需要多种形状来组成非周期铺砌块，比如首个可以覆盖无限平面的非周期铺砌是由2万多种形状组成的\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"③⑤①④⑥②","B":"④③⑤⑥②①","C":"⑤④③②①⑥","D":"⑥①②⑤③④"},"answer":"A","explanation":"对比选项，确定首句。③句引出“爱因斯坦”这一概念并解释其含义，④句指出寻找“爱因斯坦”是数学家的长期目标，⑤句对“单铺砌块”进行定义，⑥句讲述早期数学家的研究概况，均可作为首句，无法判断。\n继续观察选项，对比尾句。①句解释“非周期性”的具体特征属于概念阐述，②句描述“在后续的研究中”对于非周期性铺砌问题的突破，④句论述寻找“爱因斯坦”是许多数学家追求的“圣杯”，⑥句论述“早期的数学家”在非周期铺砌块中需要很多形状，④句及⑥句均为早期研究阶段，从时间脉络与行文逻辑看，应先解释含义或提出早期的问题与困境，再阐述后续进展与成果，因此②句更适合作尾句，排除B、C、D三项。\n故正确答案为A。\n【文段出处】搜狐网《一个数学突破，进入了物理学领域》","no":59,"missingImage":false},{"type":"question","qid":"19526318","cat":"片段阅读","stem":"早期宇宙中，一个典型的星系会从周围的星系间介质中吸积气体，并将这些气体转化为恒星。这一过程会增加星系的质量，从而提高气体吸积的效率，加速恒星形成。然而，星系并不是无限增长的，天文学家将这一过程称为“熄灭”。在近域宇宙中，大约有一半被观测到的星系已经不再形成恒星，也就是成为了息产星系，它们不再包含年轻明亮的蓝色恒星，只剩下更老、更小的红色恒星，因此，它们的外观呈现红色。\n根据这段文字，下列说法正确的是：","options":{"A":"停止形成恒星的星系外观呈现红色","B":"近域宇宙中大多数星系是息产星系","C":"星系质量与恒星形成效率呈正相关","D":"息产星系中仍包含少量的蓝色恒星"},"answer":"A","explanation":"A项，根据“······星系已经不再形成恒星······因此，它们的外观呈现红色”可知，表述正确，当选；\nB项，根据“在近域宇宙中，大约有一半被观测到的星系已经不再形成恒星，也就是成为了息产星系”可知，文段论述的是“大约有一半”并非“大多数”，偷换概念，排除；\nC项，根据“然而，星系并不是无限增长的”以及“大约有一半被观测到的星系已经不再形成恒星”可知，恒星并非一直处于形成阶段，故“呈正相关”表述不严谨，排除；\nD项，根据“它们不再包含年轻明亮的蓝色恒星，只剩下更老、更小的红色恒星”可知，表述错误，排除。\n故正确答案为A。\n【文段出处】《星闻 | 火星首批“居民”会是它？》","no":60,"missingImage":false},{"type":"question","qid":"19526313","cat":"片段阅读","stem":"民主真正落地，需基于明确、可操作的行动指南，行动指南要依托科学规范的程序文本来呈现，在这个意义上，科学民主的程序文本是民主得以从理念转化为现实不可或缺的载体，也是维护民主之实的基本保证。一方面，可借鉴他山之石，一定程度地吸纳其他国家较为成熟的，基于民主、公正、法治原则所建立起的议事规则；另一方面，须扎根实际，不能将程序简单视为政治制度的“飞来峰”，照抄照搬或简而化之，需要注重历史和现实、理论和实践、形式和内容有机统一，找到正确的方式方法。此外，还应构建长效化的程序完善机制，不断夯实程序之基。\n最适合做这段文字标题的是：","options":{"A":"以程序保障之力强化实质民主之效","B":"以程序内容之基筑牢实质民主之实","C":"以程序运行之效提升实质民主之质","D":"以程序科学之道阐释实质民主之义"},"answer":"B","explanation":"文段开篇指出民主真正落地需要明确可操作的行动指南，而行动指南则需要依托科学规范的程序文本来呈现，引出“民主落地”和“程序文本”的话题，接着强调科学民主的程序文本对民主从理念转化为现实以及维护民主之实的重要作用。然后通过三方面进行具体的解释说明，一是借鉴他国成熟议事规则，二是扎根实际，注重历史与现实等有机统一找到正确方法，三是构建长效化程序完善机制。故文段重在强调要以科学规范的程序文本，即程序内容为基础来筑牢实质民主，对应B项。\nA项，文段强调以“程序文本”为基础，“以程序保障之力”表述不明确，排除；\nC项，文段重点围绕“程序文本”展开，未涉及“程序的运行”，无中生有，排除；\nD项，文段强调以“程序文本”为基础，“以程序科学之道”表述不明确，且“民主之义”偏离重点，文段侧重讨论民主如何落到实处，排除。\n故正确答案为B。\n【文段出处】学习时报《坚持以程序民主赋能实质民主》","no":61,"missingImage":false},{"type":"question","qid":"19526376","cat":"语句表达","stem":"自然界的微生物虽然能分解高盐废水中的部分污染物，但它们就像“偏科生”，每个菌种通常只擅长处理一两种特定污染物。当面对高盐废水中油污、重金属、放射性物质等组成的“混合垃圾”时，这些天然微生物就显得“力不从心”。此外，因微生物降解所涉及的基因种类和数目较多，常规基因工程技术对菌株设计和改造的速度和深度非常有限。近年来，合成生物学技术飞速发展为降解菌株的构建提供了可能。科学家们能够通过合成生物技术给微生物设计“智能工具箱”，不仅                    ，还能让这些功能像积木一样精准搭配。\n填入画横线部分最恰当的一项是：","options":{"A":"能通过调控基因构建新菌株","B":"能使微生物快速识别可分解污染物","C":"能给细菌安装多种污染物分解能力","D":"能克服传统菌株“遇盐失活”的瓶颈"},"answer":"C","explanation":"横线部分作为尾句中的一个分句，需注意和前后分句的衔接。横线前提到合成生物学技术为微生物设计“智能工具箱”，横线后指出“还能让这些功能像积木一样精准搭配”，说明横线处应体现“智能工具箱”可以赋予微生物多种功能，并且这些功能可以模块化组合。C项“给细菌安装多种污染物分解能力”直接对应“智能工具箱”的功能赋予，且“多种能力”与后文“让这些功能像积木一样精准搭配”衔接恰当，当选。\nA项，仅强调“构建新菌株”，未体现多种能力，与后文“这些功能”衔接不当，排除；\nB项，前文未提及天然微生物“识别污染物”的问题，文段强调的是处理能力不足而非识别效率低，与前文无法衔接，排除；\nD项，文段的核心问题不是“遇盐失活”，且与后文“这些功能”衔接不当，排除。\n故正确答案为C。\n【文段出处】中国科技网《新型工程菌株，让工业污水处理有了新方法》","no":62,"missingImage":false},{"type":"question","qid":"19526343","cat":"片段阅读","stem":"对于县域而言，“错位”首先必须植根于自身“家底”。习近平总书记强调做好“土特产”文章，正是点明要善于发掘和利用这种基于本土禀赋的比较优势，形成“人无我有”的独特起点。同时，随着技术进步、市场变化，过去的优势可能减弱，新的机遇窗口不断开启。因此，“错位发展”更需秉持发展眼光和创新思维，不仅要立足当前“有什么”，更要前瞻性谋划“能发展什么”“应发展什么”，主动对接国家战略需求、区域发展格局、城市功能疏解、乡村全面振兴需要和市场前沿，将潜在优势有效转化为产业竞争力与市场效益。\n这段文字意在说明：","options":{"A":"以产业促发展方能激活乡村振兴新动能","B":"县域产业发展应主动聚焦国家战略需求","C":"县域经济如何科学把握“错位发展”","D":"前瞻性谋划为什么要先摸清“家底”"},"answer":"C","explanation":"文段首先指出县域“错位”须根植于自身“家底”，依托本土禀赋的比较优势形成独特起点，接着通过并列关联词“同时”指出过去的优势可能减弱，新的机遇窗口不断开启，并通过“因此”指出“错位发展”要秉持发展眼光和创新思维，主动对接多重需求，将潜在优势转化为产业竞争力与市场效益。故文段重点论述县域如何实现科学推进“错位发展”，对应C项。\nA项，“以产业促发展方能激活乡村振兴新动能”偏离文段核心话题，文段重点强调县域“错位发展”，排除；\nB项，“主动聚焦国家战略需求”是“错位发展”中主动对接的一个方面，表述片面，排除；\nD项，文段并未探讨“前瞻性谋划”与“摸清‘家底’”的因果关系，而是将“摸清‘家底’”作为“错位发展”的基础，“前瞻性谋划”作为“错位发展”的进阶要求，与文意不符，排除。\n故正确答案为C。\n【文段出处】人民日报《县域经济高质量发展的科学方法论 准确把握错位发展、串珠成链》","no":63,"missingImage":false},{"type":"question","qid":"19526296","cat":"片段阅读","stem":"半规管原本是感知头部运动的器官，目前尚不清楚它是如何捕捉气压变化的。当半规管感知气压降低，会将信息传递给前庭神经，再传递给下丘脑。下丘脑负责调整自主神经。自主神经是维持体内状态不变、使身体适应外界变化的神经，分为交感神经和副交感神经，前者负责将身体切换到“战斗模式”，后者负责切换到“放松模式”。当下丘脑因气压变化受到刺激时，自主神经的功能就会紊乱，导致精神状态不佳。交感神经过度活跃时，身体会处于紧张状态，产生焦虑感；交感神经不能正常工作时，人就会无精打采。\n根据这段文字，下列说法正确的是：","options":{"A":"交感神经负责使人进入放松状态","B":"气压变化时人的前庭神经最先感知","C":"副交感神经过度活跃使人产生焦虑感","D":"气压变化通过下丘脑影响人的精神状态"},"answer":"D","explanation":"A项，根据文段“分为交感神经和副交感神经，前者负责将身体切换到‘战斗模式’，后者负责切换到‘放松模式’”可知，交感神经负责将身体切换到“战斗模式”而非放松状态，偷换概念，排除；\nB项，根据文段“半规管原本是感知头部运动的器官，目前尚不清楚它是如何捕捉气压变化的。当半规管感知气压降低，会将信息传递给前庭神经”可知，气压变化的信息是通过半规管传递给前庭神经的，故最先感知气压变化的并非前庭神经，表述错误，排除；\nC项，根据文段“交感神经过度活跃时，身体会处于紧张状态，产生焦虑感”可知，是“交感神经”过度活跃时，身体会产生焦虑感，而非“副交感神经”，偷换概念，排除；\nD项，根据文段“当下丘脑因气压变化受到刺激时，自主神经的功能就会紊乱，导致精神状态不佳”可知，气压变化通过影响下丘脑，进而影响人的精神状态，表述正确，当选。\n故正确答案为D。\n【文段出处】《科学世界》杂志《心情“郁郁”竟然跟天气有关？》","no":64,"missingImage":false},{"type":"question","qid":"19526383","cat":"语句表达","stem":"。太阳系中的小行星数不胜数，它们是太阳系形成后遗留的残余碎片，仅在地球轨道周围就运行着数以千万计的小行星，它们与地球一样环绕太阳运行。当这些小行星与地球轨道发生交会时，如果其轨道能量与地球相近，它们就可能被地球引力捕获，成为地球的“迷你月亮”。根据科学家推断，地球周围随时都可能有“迷你月亮”在运行，只是目前人类观测能力有限，无法定位其具体位置。\n填入画横线部分最恰当的一项是：","options":{"A":"小行星的轨道受多种因素扰动","B":"地球的天然卫星并非只有一个","C":"小行星被地球引力捕获并不罕见","D":"小行星撞击地球的概率无法确知"},"answer":"C","explanation":"横线出现在文段开头，需结合后文内容进行分析。横线后先指出太阳系中小行星数量众多，与地球一样环绕太阳运行，随后通过指代词“这些”总结前文，强调小行星与地球轨道交会时，可能被地球引力捕获，成为地球的“迷你月亮”。尾句围绕该结论进行补充说明，故文段围绕地球与小行星的话题展开，重点强调小行星可能被地球引力捕获，成为地球的“迷你月亮”，对应C项。\nA项，“多种因素”文段并未提及，且缺少文段核心话题“地球”，排除；\nB项，文段围绕地球与小行星的话题展开，“天然卫星”偏离文段核心话题，且根据常识可知，天然卫星指环绕一颗行星按闭合轨道周期性运行的天然天体，地球的“天然卫星”只有月球，选项表述错误，排除；\nD项，“小行星撞击地球”文段并未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】人民日报《“迷你月亮”来地球“串个门”（科技大观）》","no":65,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"19526357","cat":"数学运算","stem":"某企业采购了A、B、C三个品牌的电脑共54台，其中采购A品牌电脑的台数比B品牌电脑少35%。问采购的C品牌电脑比B品牌电脑：","options":{"A":"少1台","B":"少2台","C":"多1台","D":"多2台"},"answer":"C","explanation":"根据题意可得，该企业采购A品牌电脑数量=采购B品牌电脑数量×（1-35%），化简可得\u003cimg data-k=\"f3ead7497d16\">，设该企业采购A品牌电脑13x台，采购B品牌电脑20x台，由于电脑数量必为正整数，且采购A、B品牌电脑数量之和13x+20x=33x&lt;54台，取x=1，则该企业采购A品牌电脑13×1=13台，采购B品牌电脑20×1=20台，采购C品牌电脑54-13-20=21台，故采购的C品牌电脑比B品牌电脑多21-20=1台。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"19526237","cat":"数学运算","stem":"某部门7人分两组到甲、乙两市进行调研。已知到甲市人数超过一半，老张和小王均到乙市，问共有多少种不同的分组方式？","options":{"A":"10","B":"8","C":"6","D":"5"},"answer":"C","explanation":"根据题意可知，总人数为7人，老张和小王均到乙市，甲市人数超过一半且为整数，即甲市为4人或5人，分以下2种情况。\n①甲市4人，乙市3人：因老张和小王均到乙市，故只需在余下7-2=5人中选出1人分到乙市，其余4人去甲市即可，情况数为\u003cimg data-k=\"fa1655505430\">种。\n②甲市5人，乙市2人：老张、小王均到乙市，余下5人均到甲市，情况数为1种。\n则共有5+1=6种不同的分组方式。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"19526239","cat":"数学运算","stem":"小王从甲地匀速前往乙地，到达后立刻匀速返回。已知他去程的用时比返程多3小时，去程的速度是返程的40%，且往返的平均速度为40千米/小时，问甲、乙两地相距多少千米？","options":{"A":"70","B":"140","C":"210","D":"280"},"answer":"B","explanation":"由题意可知，\u003cimg data-k=\"8ed5f86bb0d0\">，根据“路程一定，速度与时间成反比”，则\u003cimg data-k=\"d86c6bddbf3c\">，设去程时间为5x小时，则返程时间为2x小时，根据“去程的用时比返程多3小时”，可列式：5x-2x=3，解得x=1，故\u003cimg data-k=\"9949392e1109\">小时，\u003cimg data-k=\"a0882ec97824\">小时，往返用时5+2=7小时，由“往返的平均速度为40千米/小时”，可得甲、乙两地往返距离2S=vt=40×7=280千米，则甲、乙两地距离S=280÷2=140千米。\n故正确答案为B。","no":68,"missingImage":false},{"type":"question","qid":"19526236","cat":"数学运算","stem":"某种商品若按每件100元出售，每天售出m件；若降价10%，日销量将提高25%且单日利润与降价前相同。问该商品成本为多少元/件？","options":{"A":"50","B":"60","C":"70","D":"80"},"answer":"A","explanation":"方法一：设该商品成本为x元/件。根据题意，每件售价100元，每天可售出m件；若降价10%，日销量可提高25%，则降价后每件售价为100×（1-10%）=90元，日销量为（1+25%）m=1.25m件。根据单日利润与降价前相同，可列式：\u003cimg data-k=\"dbee31b20137\">，解得x=50，故该商品成本为50元/件。\n方法二：降价前每件售价100元，降价10%后每件售价减少100×10%=10元。根据公式：利润=售价-成本，成本不变，则售价减少10元即利润减少10元。根据题意可知，单日利润与降价前相同，根据公式：总利润=单个利润×数量，已知总利润一定，单个利润与数量成反比，该商品降价前、后日销量之比为1：（1+25%）=4：5，则降价前、后单个利润之比为5：4，相差1份即为利润减少的10元，则降价前单个利润为\u003cimg data-k=\"523f6f27145a\">元，故该商品成本为100-50=50元/件。\n故正确答案为A。","no":69,"missingImage":false},{"type":"question","qid":"19526358","cat":"数学运算","stem":"甲、乙两车间每天可加工2000个零件。若甲、乙车间效率分别提升10%和20%，则两车间每天可加工2260个零件。问效率提升前甲车间每天可加工多少个零件？","options":{"A":"1100","B":"1200","C":"1300","D":"1400"},"answer":"D","explanation":"方法一：设效率提升前甲车间每天可加工x个零件，则乙车间每天可加工（2000-x）个零件。根据题意，可列式：\u003cimg data-k=\"7654b0601527\">，解得x=1400。因此，效率提升前甲车间每天可加工1400个零件。\n方法二：根据题意可知，甲、乙车间效率分别提升10%和20%，则两车间每天加工的零件数提升了\u003cimg data-k=\"6e30550eede0\">。设效率提升前甲车间每天可加工x个零件，乙车间每天可加工y个零件。根据线段法：距离与量成反比，可列式：\u003cimg data-k=\"2bb6191480cf\">，则\u003cimg data-k=\"cb99c7478804\">。因此，效率提升前甲车间每天可加工1400个零件。\n\u003cimg data-k=\"b8e7f191ce13\" style=\"max-width:468px\">\n故正确答案为D。","no":70,"missingImage":false},{"type":"question","qid":"19526319","cat":"数学运算","stem":"某单位从所有职工中随机选3人参加某个会议，张立和李磊2人中只有1人被选中的概率是2人均被选中概率的30倍。问该单位有职工多少人？","options":{"A":"15","B":"17","C":"29","D":"33"},"answer":"D","explanation":"根据公式：概率\u003cimg data-k=\"8e34e7768e0e\">；根据题意可知：\u003cimg data-k=\"2d8dc06c9a30\">，即只有1人被选中的情况数=2人均被选中的情况数×30。\n方法一：\n设该单位有职工n人，根据题意可知：n＞3。张立和李磊中只有1人被选中，需先从2人中选择1人，再从剩余的职工中选择2人，满足条件的情况数为\u003cimg data-k=\"1d9f728d595f\">；张立和李磊2人均被选中，需要从剩余的职工中再选择1人，满足条件的情况数为\u003cimg data-k=\"14f1f814028b\">。可列式：（n−2）×（n−3）=（n−2）×30，解得n=33人。\n方法二：\n根据题干信息代入排除。\n代入A项：若该单位有职工15人，张立和李磊中只有1人被选中，满足条件的情况数为\u003cimg data-k=\"1128a4e99014\">\u003cimg data-k=\"619a12adbaa4\">；张立和李磊均被选中，满足条件的情况数为\u003cimg data-k=\"278cff534963\">。可验证：\u003cimg data-k=\"83684bf2a302\">，错误；\n代入B 、20日，这4天中有2天既接访群众又参加工作例会，即这4天中仅有2天是周一。这4天中相邻2天间隔天数依次为10天、21天、10天，21天为7的倍数，则仅8月20日与9月10日的星期数相同，故8月20日与9月10日为周一，则9月3日为周一，9月1日为周六。\n故正确答案为C。","no":74,"missingImage":false},{"type":"question","qid":"19526403","cat":"数学运算","stem":"某新技术论坛在3个分会场安排4个领域的12场报告，安排如下表。小华希望在同一天听4个领域的报告各1场，问他有多少种不同的选择方式？\n\u003cimg data-k=\"87f128b467cf\" style=\"max-width:600px\">","options":{"A":"6","B":"8","C":"10","D":"12"},"answer":"D","explanation":"首先，芯片制造仅在 10:30-12:00时间段有，分会场二、三选择一场，选择方式有\u003cimg data-k=\"196bda157d26\">种；其次，6G通信仅在14:30-16:00、16:30-18:00时间段有，选择方式有\u003cimg data-k=\"196bda157d26\">种。若6G通信选定在下午其中一个时间段，则下午另外一个时间段只能从人工智能和网络安全选择1种。分类讨论如下：\n①若选择人工智能，则8:30-10:00时间段只能选择网络安全1种；\n②若选择网络安全，则8:30-10:00时间段可在分会场一、分会场三中选择一场人工智能，选择方式有2种。\n综上，选择方式有\u003cimg data-k=\"953197742f68\">种。\n故正确答案为D。","no":75,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"material","material":"\u003cp>为倡导团结合作精神，某单位举办了若干项目的双打比赛。该单位后勤部由王、吴、韩和宋4人组成网球、乒乓球和羽毛球3支双打队伍参赛，每支队伍由其中2人组成，4人均至少参加了其中的一支队伍。已知：\u003c/p>\u003cp>（1）王和韩没有参加同一个项目；\u003c/p>\u003cp>（2）若韩参加羽毛球项目，则宋参加网球项目；\u003c/p>\u003cp>（3）若王参加乒乓球项目，则吴参加网球项目，若王不参加乒乓球项目，则吴也不参加网球项目。\u003c/p>","questions":[{"qid":"19526277","cat":"逻辑判断","stem":"对于3支双打队伍的组成情况，以下哪项是可能的？","options":{"A":"网球——王、宋；乒乓球——吴、宋；羽毛球——王、韩","B":"网球——吴、韩；乒乓球——吴、王；羽毛球——韩、宋","C":"网球——韩、宋；乒乓球——吴、王；羽毛球——王、宋","D":"网球——王、宋；乒乓球——吴、韩；羽毛球——王、吴"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）王、韩没有参加同一个项目；\n（2）韩羽毛球\u003cimg data-k=\"a37757d411ef\">宋网球；\n（3）王乒乓球\u003cimg data-k=\"a37757d411ef\">吴网球，\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">吴网球；\n（4）每支队伍由其中2人组成，4人均至少参加了其中的一支队伍。\n第二步：根据题干条件进行推理。\n本题题干信息确定，选项信息充分，优先考虑排除法。\n由条件（1）可知，王、韩没有参加同一个项目，排除A项；\n由条件（2）可知，韩参加羽毛球，则宋参加网球，排除B项；\n由条件（3）可知，王参加乒乓球，则吴参加网球，排除C项。\n经验证，D项满足题干所有条件，当选。\n故正确答案为D。","no":76,"missingImage":false},{"qid":"19526278","cat":"逻辑判断","stem":"若宋和韩组队网球双打，则以下哪项一定正确？","options":{"A":"吴参加乒乓球项目","B":"王参加羽毛球项目","C":"宋参加乒乓球项目","D":"吴参加羽毛球项目"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）王、韩没有参加同一个项目；\n（2）韩羽毛球\u003cimg data-k=\"a37757d411ef\">宋网球；\n（3）王乒乓球\u003cimg data-k=\"a37757d411ef\">吴网球，\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">吴网球；\n（4）每支队伍由其中2人组成，4人均至少参加了其中的一支队伍；\n（5）宋和韩组队网球。\n第二步：根据题干条件进行推理。\n根据条件（1）和（5）可知，王不参加网球；根据条件（4）和（5）可知，宋和韩组队网球，队伍已满2人，所以吴不参加网球，结合条件（3）可知，王不参加乒乓球；再结合条件（4）4人均至少参加了其中的一支队伍可知，王参加羽毛球。\n故正确答案为B。","no":77,"missingImage":false},{"qid":"19526279","cat":"逻辑判断","stem":"若吴参加3个项目，则以下哪项是可能的？","options":{"A":"宋参加网球项目","B":"王参加网球项目","C":"宋参加乒乓球项目","D":"王参加羽毛球项目"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）王、韩没有参加同一个项目；\n（2）韩羽毛球\u003cimg data-k=\"a37757d411ef\">宋网球；\n（3）王乒乓球\u003cimg data-k=\"a37757d411ef\">吴网球，\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">吴网球；\n（4）每支队伍由其中2人组成，4人均至少参加了其中的一支队伍；\n（5）吴参加了3个项目。\n第二步：根据题干条件进行推理。\n根据条件（4）和（5）可知，吴参加了网球、乒乓球和羽毛球3个项目，王、韩和宋每人均只参加1个项目，结合条件（3）“\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">吴网球”可知，王参加乒乓球项目，此时，韩和宋只需要分别参加羽毛球和网球中的1个项目即可。综上所述，选项中只有A项可能正确。\n故正确答案为A。","no":78,"missingImage":false},{"qid":"19526280","cat":"逻辑判断","stem":"以下哪项中的两人可能同时组队网球和羽毛球双打？","options":{"A":"王和吴","B":"王和宋","C":"吴和宋","D":"韩和宋"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）王、韩没有参加同一个项目；\n（2）韩羽毛球\u003cimg data-k=\"a37757d411ef\">宋网球；\n（3）王乒乓球\u003cimg data-k=\"a37757d411ef\">吴网球，\u003cimg data-k=\"0be436194951\">王乒乓球\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">吴网球；\n（4）每支队伍由其中2人组成，4人均至少参加了其中的一支队伍。\n第二步：根据题干条件进行推理。\n题干问法为“可能”，优先使用代入法。\n代入A项：王和吴同时组队网球和羽毛球双打，根据条件（4）可知，韩和宋组队乒乓球双打，此时与条件（3）的后一个推出关系矛盾，不满足题干条件，不可能为真，排除；\n代入B项：王和宋同时组队网球和羽毛球双打，根据条件（4）可知，吴和韩组队乒乓球双打，此时满足题干所有条件，可能为真，当选；\n代入C项：吴和宋同时组队网球和羽毛球双打，根据条件（4）可知，王和韩组队乒乓球双打，此时与条件（1）矛盾，不满足题干条件，不可能为真，排除；\n代入D项：韩和宋同时组队网球和羽毛球双打，王和吴组队乒乓球双打，此时与条件（3）的前一个推出关系矛盾，不满足题干条件，不可能为真，排除；\n故正确答案为B。","no":79,"missingImage":false},{"qid":"19526281","cat":"逻
