现独一无二的界面体验。网络上这种针对个人化搜索而提供筛选后结果的推荐算法，被称为过滤气泡。\n根据上述定义，下列不属于过滤气泡的是：","options":{"A":"赵先生准备买车，上网看了很多汽车测评类的文章，买完车之后，浏览器上的内容几乎全是汽车类的资讯","B":"李先生经常网购图书，平台特意为他推送购书清单，打造个性化书店，让他在第一时间能得到新书的信息","C":"刘先生经常去某网络贴吧发帖，得到了很多人的关注，一些与他有相同爱好的人还建立了一个微信群进行交流","D":"王先生和张先生分别在各自手机上搜索某公司，王先生的搜索结果多为该公司的招聘信息，张先生的却多为该公司的投资信息"},"answer":"C","explanation":"第一步：找出定义关键词。\n“针对个人化搜索，提供筛选后结果”。\n第二步：逐一分析选项。\nA项：赵先生上网看测评类的文章后，浏览器为其推送相关内容，符合“针对个人化搜索，提供筛选后结果”，符合定义，排除；\nB项：李先生经常网购图书，平台针对性推送购书清单，符合“针对个人化搜索，提供筛选后结果”，符合定义，排除；\nC项：刘先生经常去某网络贴吧发帖，建立微信群的过程，没有体现出“针对个人化搜索，提供筛选后结果”，不符合定义，当选；\nD项：两位先生分别在各自手机上搜索某公司后，搜索结果的不同，符合“针对个人化搜索，提供筛选后结果”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"5102197","cat":"定义判断","stem":"衰老通常分为生理性衰老和病理性衰老。生理性衰老是指随着年龄增长出现的衰老，也就是自然老化。病理性衰老是指衰老速度由于负面情绪、物理创伤、营养匮乏、身体疾病等各种因素的作用而加快。\n根据上述定义，下列诗词所描述的现象最符合病理性衰老的是：","options":{"A":"白头搔更短，浑欲不胜簪","B":"寒暑迭变，不觉渐成衰老","C":"惟草木之零落兮，恐美人之迟暮","D":"人生不得长欢乐，年少须臾老到来"},"answer":"A","explanation":"第一步：找出定义关键词。\n病理性衰老：“由于负面情绪、物理创伤、营养匮乏、身体疾病”、“衰老速度加快”；\n生理性衰老：“随着年龄增长出现的衰老”、“自然老化”。\n第二步：逐一分析选项。\nA项：“白头搔更短，浑欲不胜簪”意思为“愁闷心烦只有搔首而已，致使白发疏稀插不上簪”，愁闷心烦符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，白发稀疏是衰老的明显特征之一，而更稀疏符合“衰老速度加快”，符合“病理性衰老”定义，当选；\nB项：“寒暑迭变，不觉渐成衰老”意思为“冬天和夏天交替变化，没有感觉就已渐渐衰老”，时间的变化导致的衰老，不符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，也未体现“衰老速度加快”，不符合“病理性衰老”定义，排除；\nC项：“惟草木之零落兮，恐美人之迟暮”意思为“想到树上黄叶纷纷飘零，而害怕美人头上也添上丝丝霜鬓”，诗人只是表达了害怕美人衰老，而不是描写美人已经衰老，又为何衰老，不符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，也未体现“衰老速度加快”，不符合“病理性衰老”定义，排除；\nD项：“人生不得长欢乐，年少须臾老到来”意思为“人的一生得不到长久的欢乐，青春年少的时光总是过的很快，老年很快就来了”，诗人感叹的是时光飞逝，是由于时间的原因导致衰老，不符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，也未体现“衰老速度加快”，不符合“病理性衰老”定义，排除。\n故正确答案为A。\n注——本题出处如下：\nhttps://baike.baidu.com/item/%E8%A1%B0%E8%80%81/1169838?fr=aladdin","no":85,"missingImage":false},{"type":"question","qid":"5102358","cat":"类比推理","stem":"帛书：简牍","options":{"A":"日晷：秒表","B":"熊猫：银杏","C":"青铜：礼器","D":"牛车：轿子"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n帛书是指中国古代写在绢帛上的文书；简牍是指中国古代书写在竹简或木片上的文书，二者是两种不同的书，为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：日晷和秒表是两种不同的计时器，二者为并列关系，与题干逻辑关系一致，保留；\nB项：熊猫是动物，银杏是植物，二者不是并列关系，与题干逻辑关系不一致，排除；\nC项：青铜是制作礼器的原材料之一，二者为原材料与成品的对应关系，与题干逻辑关系不一致，排除；\nD项：牛车和轿子是两种不同的交通工具，二者为并列关系，与题干逻辑关系一致，保留。\n对比A、D两项，题干中的帛书和简牍都是古代出现的事物，A项中的日晷是古代出现的事物，但秒表是现代出现的事物，D项中的牛车起源于商代，牛车和轿子都是古代出现的事物，故D项与题干的关系更近。\n故正确答案为D。","no":86,"missingImage":false},{"type":"question","qid":"5102353","cat":"类比推理","stem":"考拉：树袋熊","options":{"A":"墨鱼：乌贼","B":"蜜蜂：黄蜂","C":"蚱蜢：蝗虫","D":"金龟子：天牛"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n考拉和树袋熊是同一种动物，二者为全同关系。\n第二步：判断选项词语间逻辑关系。\nA项：墨鱼和乌贼是同一种动物，二者为全同关系，与题干逻辑关系一致，保留；\nB项：黄蜂属于胡蜂科，蜜蜂属于蜜蜂科，二者为并列关系，与题干逻辑关系不一致，排除；\nC项：蚱蜢和蝗虫的关系较有争议，部分资料显示二者为全同关系，与题干逻辑关系一致，保留；\nD项：金龟子是鞘翅目金龟总科的通称，天牛是多食亚目天牛科昆虫的总称，二者为并列关系，与题干逻辑关系不一致，排除。\n对比A、C两项，C项中蚱蜢和蝗虫的关系较有争议，如下图所示，维基百科和百度百科都表明二者是全同关系，但现代汉语词典表明二者并不是同一种动物，目前无法确定出题人对二者的关系是如何判定的，相对来说，A项中的墨鱼和乌贼是没有争议的全同关系，因此，小粉笔更倾向于将正确答案给到A项。\n\u003cimg data-k=\"8d599fe3a1e5\" style=\"max-width:374px\">\n\u003cimg data-k=\"6f042a1ed3cc\" style=\"max-width:416px\">\n\u003cimg data-k=\"3d589a64792c\" style=\"max-width:324px\">\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"5102169","cat":"类比推理","stem":"电脑：设备","options":{"A":"广播：传媒","B":"颜料：绘画","C":"文言：白话","D":"能源：煤炭"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n电脑是一种设备，二者是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：传媒指传播媒介，特指报纸、广播、电视、网络等各种新闻工具，广播是一种传媒，二者是种属关系，与题干逻辑关系一致，当选；\nB项：颜料是绘画所用的材料，二者不是种属关系，与题干逻辑关系不一致，排除；\nC项：文言和白话为汉语书面语的两种形式，二者是并列关系而非种属关系，与题干逻辑关系不一致，排除；\nD项：煤炭是一种能源，二者是种属关系，但两词顺序与题干相反，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":88,"missingImage":false},{"type":"question","qid":"5102228","cat":"类比推理","stem":"姹紫：嫣红","options":{"A":"嘉言：懿行","B":"风刀：霜剑","C":"小家：碧玉","D":"疾首：蹙额"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n姹紫嫣红形容各种颜色的花卉艳丽、好看，“姹紫”指美丽的紫色，“嫣红”指鲜艳的红色，二者为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：嘉言懿行指有教育意义的好言语和好行为，“嘉言”指有益的言论，“懿行”指高尚的行为，二者为并列关系，与题干逻辑关系一致，保留；\nB项：风刀霜剑指寒风像刀子，严霜像剑一样刺人的肌肤，形容气候寒冷，也比喻世态险恶，“风刀”指风如刀，“霜剑”指霜似剑，二者为并列关系，与题干逻辑关系一致，保留；\nC项：小家碧玉指小户人家的年轻美貌的女子，“小家”指小户人家，“碧玉”指年轻美貌的女子，二者不是并列关系，与题干逻辑关系不一致，排除；\nD项：疾首蹙额形容厌恶、痛恨的样子，“疾首”指头痛，“蹙额”指皱眉，二者为并列关系，与题干逻辑关系一致，保留。\n对比A、B、D三项，题干中，“姹”修饰“紫”，“嫣”修饰 “红”，“姹紫”和“嫣红”均为偏正结构；A项的“嘉言”和“懿行”均为偏正结构，B项的“风刀”和“霜剑”不是偏正结构，D项的“蹙额”是动宾结构，所以A项与题干的逻辑关系更加一致。\n\n故正确答案为A。","no":89,"missingImage":false},{"type":"question","qid":"5102209","cat":"类比推理","stem":"马匹：船只：车辆","options":{"A":"银两：金钱：银币","B":"纸张：试卷：画册","C":"水杯：油瓶：饭碗","D":"官员：武将：首领"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n马匹、船只和车辆都有运输的功能，三者在功能上是并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：银两是以银锭为主要形式的一种秤量货币单位，金钱多指用金属铸成的钱，后泛指货币财富，银两是金钱，二者是种属关系，与题干逻辑关系不一致，排除；\nB项：纸张是制作试卷的原材料，二者是原材料与成品的对应关系，与题干逻辑关系不一致，排除；\nC项：水杯、油瓶和饭碗都有盛装物品的功能，三者在功能上是并列关系，与题干逻辑关系一致，当选；\nD项：武将是古代的军事将领或部队军官，武将是官员，二者是种属关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":90,"missingImage":false},{"type":"question","qid":"5102174","cat":"类比推理","stem":"电影院：影片：放映","options":{"A":"图书馆：资料：查阅","B":"下水道：地漏：排水","C":"传染病：疫苗：防疫","D":"朋友圈：微信：聊天"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n在电影院放映影片，放映影片是动宾关系，电影院是放映影片的地点。\n第二步：判断选项词语间逻辑关系。\nA项：在图书馆查阅资料，查阅资料是动宾关系，图书馆是查阅资料的地点，与题干逻辑关系一致，当选；\nB项：地漏具有排水的功能，二者是功能对应关系，与题干逻辑关系不一致，排除；\nC项：不能说在传染病防疫疫苗，且传染病不是一个地点，与题干逻辑关系不一致，排除；\nD项：不能说在朋友圈聊天微信，且朋友圈不是一个地点，微信具有聊天的功能，二者是功能对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":91,"missingImage":false},{"type":"question","qid":"5102233","cat":"类比推理","stem":"针线：布料：服饰","options":{"A":"剪刀：彩纸：窗花","B":"刻刀：玺印：玉石","C":"玻璃：窗户：窗框","D":"鸡精：乌鸡：鸡汤"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n针线是制作服饰的工具，布料是制作服饰的原材料，三者为工具、原材料、成品的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：剪刀是制作窗花的工具，彩纸是制作窗花的原材料，三者为工具、原材料、成品的对应关系，与题干逻辑关系一致，当选；\nB项：刻刀是制作玺印的工具，玉石是制作玺印的原材料，三者为工具、成品、原材料的对应关系，但三词顺序与题干不同，与题干逻辑关系不一致，排除；\nC项：玻璃和窗框是窗户的组成部分，与题干逻辑关系不一致，排除； \nD项：鸡精是一种调味品，不是制作鸡汤的工具，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":92,"missingImage":false},{"type":"question","qid":"5102171","cat":"类比推理","stem":"征稿：评选：颁奖","options":{"A":"运动：热身：放松","B":"节能：减排：环保","C":"设计：施工：监理","D":"麻醉：切开：缝合"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n先征稿，再评选，最后颁奖，三者为动作上的先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：先热身，再运动，两词顺序与题干相反，与题干逻辑关系不一致，排除；\nB项：节能和减排是并列关系，不分先后，且节能和减排都属于环保措施，与题干逻辑关系不一致，排除；\nC项：先设计，再施工，监理是指对工程项目等进行监督管理，监理的主要内容是熟悉所监理项目的合同条款、规范、设计图纸，有效开展现场监理工作，及时报告施工过程中出现的问题等，所以施工和监理可以同时发生，没有一定的先后顺序，与题干逻辑关系不一致，排除；\nD项：先麻醉，再切开，最后缝合，三者为动作上的先后顺序的对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":93,"missingImage":false},{"type":"question","qid":"5102173","cat":"类比推理","stem":"晴空万里 对于 （    ） 相当于 （    ） 对于 识文断字","options":{"A":"天干物燥；才高八斗","B":"雨后春笋；妙笔生花","C":"阴云密布；胸无点墨","D":"倾盆大雨；味同嚼蜡"},"answer":"C","explanation":"逐一代入选项。\nA项：“晴空万里”形容天空晴朗，没有一点云彩，“天干物燥”意思是天气太干，物品也干燥，极易起火，二者无明显逻辑关系；“才高八斗”比喻才学极高，“识文断字”意思是能识字读书，指有一点文化知识，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nB项：“晴空万里”形容天空晴朗，没有一点云彩，“雨后春笋”指春天下大雨后，发出来的竹笋一下子就长出来很多，比喻新生事物迅速大量地涌现出来，二者无明显逻辑关系；“妙笔生花”比喻写作能力大有进步，或形容文章写得很出色，“识文断字”意思是能识字读书，指有一点文化知识，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：“晴空万里”形容天空晴朗，没有一点云彩，“阴云密布”形容浓厚的云层或空气中的大量的烟尘遮蔽天日，二者为反义关系；“胸无点墨”意思是肚子里没有一点墨水，指没有文化，“识文断字”意思是能识字读书，指有一点文化知识，二者为反义关系，前后逻辑关系一致，当选；\nD项：“晴空万里”形容天空晴朗，没有一点云彩，“倾盆大雨”形容雨大势急，二者为反义关系；“味同嚼蜡”意思是像吃蜡一样，没有一点儿味，形容语言或文章枯燥无味，“识文断字”意思是能识字读书，指有一点文化知识，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"5102192","cat":"类比推理","stem":"入木三分 对于 （    ） 相当于 （    ） 对于 音乐","options":{"A":"绘画；珠圆玉润","B":"雕刻；黄钟大吕","C":"建筑；高山流水","D":"书法；余音绕梁"},"answer":"D","explanation":"逐一代入选项。\nA项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，与绘画无明显逻辑关系；珠圆玉润形容歌声婉转优美或文字流畅明快，用来形容音乐，二者为对应关系。前后逻辑关系不一致，排除；\nB项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，与雕刻无明显逻辑关系；黄钟大吕形容正大、庄严、高妙的音乐或文辞，用来形容音乐，二者为对应关系。前后逻辑关系不一致，排除；\nC项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，与建筑无明显逻辑关系；高山流水指知音难觅或乐曲高妙，用来形容音乐，二者为对应关系。前后逻辑关系不一致，排除；\nD项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，用来形容书法，二者构成对应关系；余音绕梁形容歌声或音乐优美，耐人回味，用来形容音乐，二者构成对应关系。前后逻辑关系一致，当选。\n故正确答案为D。","no":95,"missingImage":false},{"type":"question","qid":"5102232","cat":"逻辑判断","stem":"研究人员对人的“头骨突起”进行了一项研究。在这项研究中，调查对象包括1200名年龄在18岁至86岁的普通人群，研究发现，颅骨底部出现骨质突起的情况在年轻人中比在老年人中更为普遍，尤其是在18岁至30岁年龄组的男性当中，研究者认为，一些人颅骨底部出现的奇怪的“头骨突起”与他们长时间弯下脖子看智能手机时的奇怪角度有关。\n以下各项如果为真，最能质疑上述结论的是：","options":{"A":"网上销售的塑形枕头深受“头骨突起”的年轻消费者欢迎","B":"该研究样本人群是随机抽取，它的结论适用于普通人群","C":"研究人员对年轻人更容易出现头骨突起的分析过程存在瑕疵","D":"研究者并未对调查对象每日弯下脖子看智能手机的时间进行记录"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：一些人颅骨底部出现的奇怪的“头骨突起”与他们长时间弯下脖子看智能手机时的奇怪角度有关。\n论据：研究发现颅骨底部出现骨质突起的情况在年轻人中比在老年人中更为普遍，尤其是在18岁至30岁年龄组的男性当中。\n本题论据在分析“年龄”与“头骨突起”的关系，论点在分析“长时间弯下脖子看智能手机时的奇怪角度”和“头骨突起”的关系，论据和论点话题不一致，优先考虑拆桥，即不能通过“年龄”推出“不良姿势看手机的时长”。\n第二步：逐一分析选项。\nA项：指出塑形枕头受到“头骨突起”的年轻消费者欢迎，是在强调部分头骨突起人群的购物偏好，但论点是在分析“头骨突起”产生的具体原因，话题不一致，无法削弱，排除；\nB项：指出研究样本选取很科学，结论具有普适性，进一步说明了结论成立的科学性，为加强项，无法削弱，排除；\nC项：指出研究中对年轻人更容易出现头骨突起的分析过程存在瑕疵，即论据中的研究过程是存在瑕疵的，可以削弱，保留；\nD项：指出该研究未统计过不同年龄段的受访者用不良姿势看智能手机的时长，那就不能通过“年龄”推出“不良姿势看手机的时长”，可以削弱，保留；\n比较C、D两项，C项只说分析过程存在瑕疵，但具体是什么瑕疵，是否会影响实验结论，表述并不明确，故D项更为明确。\n故正确答案为D。","no":96,"missingImage":false},{"type":"question","qid":"5102359","cat":"逻辑判断","stem":"有些人的心情比较容易受到外界影响，比如飞行员担心遇到雷暴，虽然没有什么奇招，但有些食物的确能让大脑更好地运作，可可就是其中之一。这是因为可可含有大量的茶碱和咖啡因，它们可以有效的减轻压力和缓解疼痛。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"虽然可可富含咖啡因，但咖啡因只有在特定条件下才能发挥其减压作用","B":"据研究显示，可可中含有的茶碱和咖啡因可以刺激大脑分泌内啡肽，而内啡肽对减轻压力和缓解疼痛非常有效","C":"每天摄入主要原料为可可的黑巧克力对情绪会有一定影响","D":"每天至少30分钟的运动，有助于大脑产生缓解压力和焦虑所需的激素"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：有些食物的确能让大脑更好地运作，可可就是其中之一。\n论据：可可含有大量的茶碱和咖啡因，它们可以有效的减轻压力和缓解疼痛。\n本题论点说的是“可可”让“大脑更好地运作”，论据说的是“可可”中的“茶碱和咖啡因”可以“减轻压力和缓解疼痛”，“减轻压力和缓解疼痛”有助于“大脑更好地运作”，二者关系紧密，可以认为话题一致，加强可以考虑补充论据，即解释原因或举例。\n第二步：逐一分析选项。\nA项：指出可可中的咖啡因需要在“特定条件”下才能发挥减压作用，但无法确定食用可可时是否满足特定条件，也就无法判断减压作用是否能实现，属于不明确项，无法加强，排除；\nB项：指出可可中含有的茶碱和咖啡因是通过刺激大脑分泌内啡肽来起到减轻压力和缓解疼痛作用的，进而能让大脑更好地运作，解释原因，补充论据，当选；\nC项：指出用可可制作的黑巧克力对情绪有影响，但无法判断是好影响还是坏影响，能否让大脑更好的运作，属于不明确项，无法加强，排除；\nD项：指出“运动”对于大脑的作用，而论点说的是“可可”对于大脑的作用，话题不一致，属于无关项，无法加强，排除。\n故正确答案为B。","no":97,"missingImage":false},{"type":"question","qid":"5102226","cat":"逻辑判断","stem":"有观点认为，体质的酸化是百病之源。无论是癌症，还是常见的高血压、糖尿病、痛风等，都是由于“酸性食物”吃多了导致体质酸化引起的。而鱼、肉、米饭、酒等人类的主副食品都是酸性的，尤其是我们的主食米饭，更被渲染成“酸性食物”的典型代表。\n以下各项如果为真，最能反驳上述观点的是：","options":{"A":"人体的皮肤处于弱酸性状态时，比较不容易滋生细菌","B":"人体的酸碱度以7.4为佳，即身体偏碱性就是健康的","C":"人体有三个调节系统平衡酸碱，人的体质不会是酸性","D":"健康人的尿液是呈酸性的，人体本身就存在酸性物质"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：体质的酸化是百病之源。\n论据：无论是癌症，还是常见的高血压、糖尿病、痛风等，都是由于“酸性食物”吃多了导致体质酸化引起的。\n本题的论点和论据均在讨论“体质酸化”与“疾病”之间的关系，话题一致，削弱优先考虑削弱论点，即体质的酸化不是百病之源。\n第二步：逐一分析选项。\nA项：该项讨论的是“人体皮肤处于弱酸性状态”与“不容易滋生细菌”的关系，“人体皮肤处于弱酸性状态”不能代表论点中“体质的酸化”，且“不容易滋生细菌”不代表不容易生病，话题不一致，无法削弱，排除；\nB项：该项指出身体偏碱性就是健康的，未明确说明酸性体质是否健康，不明确项，排除；\nC项：该项指出人的体质不会是酸性的，说明酸性体质不存在，则酸性体质也不可能是百病之源，削弱论点，当选；\nD项：该项指出健康人体存在酸性物质，但是存在酸性物质不代表健康人是“酸性体质”，话题不一致，无法削弱，排除。\n故正确答案为C。","no":98,"missingImage":false},{"type":"question","qid":"5102231","cat":"逻辑判断","stem":"DNA甲基化严密控制着基因的表达，在肿瘤发生发展过程中发挥着重要作用。DNA出错且甲基化缺失是导致癌症的一个重要成因。几乎所有的人类肿瘤中都存在肿瘤相关基因的异常甲基化。因此，DNA甲基化异常是癌症发生的一种警示性标志。研究者据此认为，可以使用DNA甲基化作为一种全新的癌症检测筛查标志物，来有效识别结直肠癌、肺癌、乳腺癌和肝癌等肿瘤。\n以下各项如果为真，最能支持上述研究者观点的是：","options":{"A":"肿瘤抑制基因启动子区往往发生DNA高甲基化，而癌基因启动子区则呈现出低甲基化","B":"DNA甲基化检测方法不断涌现，既说明该研究难度大，也说明这些方法都有其局限性","C":"DNA甲基化检测方法具有生物学的稳定性，且样本需求量少，检查过程更加简单快捷","D":"基因启动子区异常甲基化在多种人类疾病发生发展机制的研究中受到越来越多的重视"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：可以使用DNA甲基化作为一种全新的癌症检测筛查标志物，来有效识别结直肠癌、肺癌、乳腺癌和肝癌等肿瘤。\n论据：DNA甲基化异常是癌症发生的一种警示性标志。\n本题论点探讨“DNA甲基化”和“筛查癌症的标志”之间的关系，论据说的是“DNA甲基化”和“癌症警示性标志”之间的关系，二者话题一致，优先考虑补充论据加强，可以举例子，也可以解释原因。\n第二步：逐一分析选项。\nA项：该项指出肿瘤抑制基因启动子区呈现DNA高甲基化，而癌基因启动子区呈现DNA低甲基化，解释了为什么DNA甲基化可以作为癌症检测筛查的标志物，解释原因，可以加强，当选；\nB项：该项讨论DNA甲基化检测方法的研究难度以及局限性，但并未提及DNA甲基化是否可以作为癌症检测筛查的标志物，与论点讨论的话题不一致，无法加强，排除；\nC项：该项讨论DNA甲基化检测方法有稳定性高、简单快捷等优势，但并未提及DNA甲基化是否可以作为癌症检测筛查的标志物，与论点讨论的话题不一致，无法加强，排除；\nD项：该项讨论基因启动子区异常甲基化在研究中受到越来越多的重视，但并未提及DNA甲基化是否可以作为癌症检测筛查的标志物，与论点讨论的话题不一致，无法加强，排除。\n故正确答案为A。","no":99,"missingImage":false},{"type":"question","qid":"5102362","cat":"逻辑判断","stem":"传统理论认为恐龙的灭绝是小行星撞击地球导致的，科学家表示，恐龙的多样性是从7600万年前开始下降。研究人员研究了六大恐龙群体的进化趋势，发现在6600万年白垩纪末期物种大灭绝之前的大约1000万年里，食草恐龙和食肉恐龙都在衰落。\n由此可以推出：","options":{"A":"在小行星撞击地球并最终使恐龙灭绝之前恐龙就已经处境不佳","B":"在恐龙时代的最后1000万年里，六大恐龙的新物种形成速度下降，灭绝速度急剧上升","C":"在恐龙时代最后4000万年中的不同时期，六大恐龙的多样性都出现了下降，尽管降幅不一","D":"恐龙在小行星撞地球之前就面临危机，由于它们的灭绝速度超过新物种的速度，因此“尤其容易灭绝”"},"answer":"A","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干可知，恐龙的多样性从7600万年前就开始下降，食草恐龙和食肉恐龙都在衰落，这些发生在6600万年白垩纪末期物种大灭绝（小行星撞击地球的时间）之前的大约1000万年里，可以推出在小行星撞击地球并最终使恐龙灭绝之前恐龙就已经处境不佳，当选；\nB项：题干只是指出在恐龙时代的最后1000万年里，食草恐龙和食肉恐龙都在衰落，并没有提及新物种形成速度和灭绝速度的情况，无中生有，无法推出，排除；\nC项：题干中没有提及在恐龙时代“最后4000万年中的不同时期”，六大恐龙多样性的降幅问题，无中生有，无法推出，排除；\nD项：题干中没有提及恐龙和新物种灭绝速度的比较，无中生有，无法推出，排除。\n故正确答案为A。","no":100,"missingImage":false},{"type":"question","qid":"5102186","cat":"逻辑判断","stem":"研究发现，对居住地附近有至少30%的土地是公园和绿地的成年人而言，他们感到孤独的几率比居住地附近绿地面积不足10%的成年人要低26%。对于独居者而言，关联性甚至更大——在绿地面积达到或超过30%的地区，他们感到孤独的可能性降低了一半。\n以下哪项如果为真，最能支持上述观点?","options":{"A":"越来越多的证据表明，孤独感与罹患抑郁症的风险增加有关","B":"城市重新造林可能有助于降低主观记忆减退甚至患阿尔茨海默症的风险","C":"以前没有定期接触自然的人以安全、积极和可持续的方式定期与自然接触，就有希望缓解孤独感","D":"绿地面积大小与社交互动频率正相关，经常与他人在绿地环境中交流有助于改善情绪和消除孤独感"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：对于独居者而言，关联性甚至更大——在绿地面积达到或超过30%的地区，他们感到孤独的可能性降低了一半。\n论据：对居住地附近有至少30%的土地是公园和绿地的成年人而言，他们感到孤独的几率比居住地附近绿地面积不足10%的成年人要低26%。\n论据给出一组“居住地附近绿地面积”与“孤独感”关系的数据，论点说的是“居住地附近绿地面积”与“独居者孤独感”的关系，论据和论点的话题一致，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：该项说的是孤独感与罹患抑郁症风险的关系，而论点说的是居住地附近绿地面积与孤独感的关系，话题不一致，无法加强，排除；\nB项：该项说的是城市造林对主观记忆减退及患阿尔茨海默症风险的影响，而论点说的是居住地附近绿地面积与孤独感的关系，话题不一致，无法加强，排除；\nC项：该项说的是定期接触自然有望缓解孤独感，但并不明确“接触自然”与“居住地附近绿地面积”的关系，为不明确项，无法加强，排除；\nD项：该项说的是绿地面积大小影响社交互动频率，且经常与他人在绿地环境中交流有助于改善情绪和消除孤独感，解释了为什么在绿地面积达到或超过30%的地区，独居者感到孤独的可能性会降低，补充论据，可以加强，当选。\n故正确答案为D。","no":101,"missingImage":false},{"type":"question","qid":"5102179","cat":"逻辑判断","stem":"科学家在金星大气层中探测到了磷化氢的踪迹，浓度极高，是地球大气层中磷化氢浓度的1000倍至100万倍。在地球上，磷化氢仅见于工业生产领域或由厌氧微生物所产生。对于金星上磷化氢的来源，研究团队进行了大量分析，推断是否来自光照、闪电、火山或者从金星表面向上吹至大气层中的矿物质等，但根据已有知识的计算结果均不支持这些来源。研究人员因此表示有磷化氢意味着没有充足的氧气存在，但有可能证明是存在厌氧生物的，故而金星大气层中的磷化氢有可能是某种生物留下的印记。\n以下哪项如果为真，最能削弱上述研究人员的观点？","options":{"A":"金星大气中含有大量二氧化碳以及浓硫酸云层，温室效应非常严重","B":"科学家们发现了“不需要呼吸”的动物，比较符合金星的大气条件","C":"金星上存在某些未知的光化学过程，这些光化学过程能够释放大量的磷化氢","D":"磷化氢需要很多能量来制作，且任何行星上都不太可能存在太多磷，因此一颗行星产生大量磷化氢的可能性很低"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：金星大气层中的磷化氢有可能是某种生物留下的印记。\n论据：有磷化氢意味着没有充足的氧气存在，但有可能证明是存在厌氧生物的。\n本题论点说的是“金星大气层中的磷化氢”与“某种生物”之间的关系，论据说的是“磷化氢”与可能存在“厌氧生物”之间的关系，论点论据话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项说金星大气中含有大量二氧化碳以及浓硫酸云层，温室效应非常严重，而论点讨论的是金星大气层中的磷化氢是否来自于某种生物，话题不一致，无法削弱，排除；\nB项：该项说的是存在比较符合金星上大气条件的“不需要呼吸”的动物，说明在金星上可能在没有充足氧气的情况下存在生物，即厌氧生物，补充论据说明这些生物可能是磷化氢的来源，为加强项，无法削弱，排除；\nC项：该项说的是金星上存在某些未知的光化学过程，这些光化学过程能够释放大量的磷化氢，说明金星大气层中的磷化氢是来自于光化学过程，而不是来自于厌氧生物，削弱论点，可以削弱，当选；\nD项：该项说的是任何行星上都不太可能存在太多磷，因此一颗行星产生大量磷化氢的可能性很低，而题干论点讨论的是金星大气层中的磷化氢的来源问题，话题不一致，无法削弱，排除。\n故正确答案为C。","no":102,"missingImage":false},{"type":"question","qid":"5102200","cat":"逻辑判断","stem":"伤害感受神经能够对造血干细胞动员进行调控，增强造血干细胞的黏附或迁移，降钙素基因相关肽（CGRP）是伤害感受神经元主要分泌的神经递质分子。研究者发现，给予CGRP可以显著增强造血干细胞动员。CGRP可以直接影响造血干细胞，诱导细胞表面形成CALCRL和RAMP1蛋白形成的二聚体受体，并促进造血干细胞进入血管。研究专家认为，吃辣可以促进造血干细胞动员。\n如果上述结论为真，需要补充的前提是：","options":{"A":"骨髓神经纤维中高达77%都是伤害感受神经元","B":"辛辣食物导致的“辣味”是一种痛觉，会激活伤害感受神经","C":"辣的食物能够促进消化液的分泌，增加消化酶的活性，加速胃肠道蠕动","D":"造血干细胞会在神经的调控之下，从骨髓释放进入循环，对损失的血细胞进行补充"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：吃辣可以促进造血干细胞动员。\n论据：伤害感受神经能够对造血干细胞动员进行调控，增强造血干细胞的黏附或迁移，降钙素基因相关肽（CGRP）是伤害感受神经元主要分泌的神经递质分子。研究者发现，给予CGRP可以显著增强造血干细胞动员。CGRP可以直接影响造血干细胞，诱导细胞表面形成CALCRL和RAMP1蛋白形成的二聚体受体，并促进造血干细胞进入血管。\n本题论点说的是“吃辣”与“造血干细胞动员”之间的关系，论据说的是“伤害感受神经”与“造血干细胞动员”之间的关系，话题不一致，且提问方式为“前提”，加强优先考虑搭桥，即建立“吃辣”与“伤害感受神经”之间的联系。\n第二步：逐一分析选项。\nA项：指出骨髓神经纤维中的伤害感受神经元占比高，不能说明“吃辣”与“造血干细胞动员”之间的关系，话题不一致，无法加强，排除；\nB项：指出“辣味”会激活神经纤维中的伤害感受神经，这说明吃辣可以影响伤害感受神经，进而影响造血干细胞动员，在“吃辣”与“伤害感受神经”之间建立了联系，搭桥项，可以加强，当选；\nC项：指出辣的食物能够促进消化液的分泌、加速胃肠道蠕动，与造血干细胞无关，属于无关项，无法加强，排除；\nD项：指出造血干细胞能够对损失的血细胞进行补充，未提及吃辣对其的影响，属于无关项，无法加强，排除。\n故正确答案为B。","no":103,"missingImage":false},{"type":"question","qid":"5102164","cat":"逻辑判断","stem":"研究者发现，蚕挑选桑叶要经过类似于计算机安全系统的验证。蚕口器下方的下颚须在触碰叶片时会先轻轻咬一口，下颚须中的味觉神经能以极高的灵敏度识别叶片表面的\u003cimg data-k=\"af343db3844d\">-谷甾醇、绿原酸、异槲皮苷这三种物质；接着，它会用口器上的须形外颚叶来尝一下叶片叶汁中的糖分，须形外颚叶上的味觉神经比较迟钝，只有高浓度的糖才能激活；在确认是桑叶后它才开始大肆咀嚼。\n由此可以推出：","options":{"A":"桑叶会分泌适合蚕生长的糖分和物质，故而它几乎只吃桑叶","B":"通过不同的器官感受不同的味道，这就是蚕判断桑叶的秘诀","C":"蚕在演化过程中，它的口器具备了通过触碰感知桑叶的能力","D":"这项研究有助于改进蚕的人工饲料，可在没有桑树的环境下养蚕"},"answer":"B","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干指出蚕是通过高浓度糖分激活须形外颚叶上的味觉神经来确认桑叶，没有提及蚕只吃桑叶的原因，无中生有，无法推出，排除；\nB项：题干指出蚕口器下方的下颚须中的味觉神经能识别\u003cimg data-k=\"af343db3844d\">-谷甾醇、绿原酸、异槲皮苷，接着，蚕会用口器上的须形外颚叶来尝一下叶片叶汁中的糖分，可以推出蚕通过不同的器官感受不同的味道来判断是否是桑叶，可以推出，当选；\nC项：题干指出蚕依靠下颚须中的“味觉神经”识别叶片表面的一些物质，用口器上的须形外颚叶来“尝”糖分，因此蚕是依靠“味觉”来感知桑叶，而非依靠“碰触”，无法推出，排除；\nD项：题干中没有提及蚕的饲养，也没有提及改进蚕的人工饲料，无中生有，无法推出，排除。\n故正确答案为B。","no":104,"missingImage":false},{"type":"question","qid":"5102163","cat":"逻辑判断","stem":"欧洲杯比赛期间，小赵、小钱、小孙、小李预测甲、乙两支队伍能否进入决赛。他们的对话如下：\n小赵：如果甲进入决赛，则乙也能进入决赛。\n小钱：我看甲进入决赛没有问题。\n小孙：在我看来，甲能够进入决赛，但乙进不了。\n小李：我的看法是，如果甲不能进入决赛，则乙进决赛。\n结果出来后，他们四人的预测有两个真、两个假，关于甲和乙是否进入决赛，以下推论正确的是：","options":{"A":"甲和乙都进入决赛","B":"甲和乙都没有进入决赛","C":"甲进入决赛，乙没有进入决赛","D":"甲没有进入决赛，乙进入决赛"},"answer":"D","explanation":"第一步：分析题干找关系。\n①小赵：甲\u003cimg data-k=\"508f0e7dbbe5\">乙；\n②小钱：甲；\n③小孙：甲 且 \u003cimg data-k=\"e752a8ae1a16\">乙；\n④小李：\u003cimg data-k=\"e752a8ae1a16\">甲\u003cimg data-k=\"508f0e7dbbe5\">乙。\n分析题干条件，①、③为矛盾关系，必有一真一假。\n第二步：看其余。\n根据题干推理可知，四人预测为两真两假，故②、④也必有一真一假。由“A\u003cimg data-k=\"508f0e7dbbe5\">B”=“\u003cimg data-k=\"e752a8ae1a16\">A 或 B”可知，④“\u003cimg data-k=\"e752a8ae1a16\">甲\u003cimg data-k=\"508f0e7dbbe5\">乙”=“甲 或 乙”，此时，若②“甲”为真，则④“甲 或 乙”为真，与②、④必有一真一假矛盾，故②“甲”为假，即甲没有进入决赛，此时④“甲 或 乙”为真，根据或关系的否一推一，可知乙进入决赛。\n故正确答案为D。","no":105,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2020年，由软件产品、信息技术服务、信息安全产品和服务、嵌入式系统软件四大业务形态构成的我国软件和信息技术服务业持续恢复，收入保持较快增长，信息技术服务加快云化发展，软件应用服务化、平台化趋势明显。\u003c/p>\u003cp>        2020年，软件产品实现收入22758亿元，同比增长10.1%，占全行业比重为27.9%。其中，工业软件产品实现收入1974亿元，增长11.2%，为支撑工业领域的自主可控发展发挥重要作用。\u003c/p>\u003cp>        2020年，信息技术服务实现收入49868亿元，同比增长15.2%，增速高出全行业平均水平1.9个百分点，占全行业收入比重为61.1%。其中，电子商务平台技术服务收入9095亿元，同比增长10.5%；云服务、大数据服务共实现收入4116亿元，同比增长11.1%。\u003c/p>\u003cp>        2020年，信息安全产品和服务实现收入1498亿元，同比增长10.0%，增速较上年回落2.4个百分点。\u003c/p>\u003cp>        2020年嵌入式系统软件实现收入7492亿元，同比增长12.0%，增速较上年提高4.2个百分点，占全行业收入比重为9.2%。嵌入式系统软件已成为产品和装备数字化改造、各领域智能化增值的关键性带动技术。\u003c/p>","questions":[{"qid":"5102378","cat":"比重","stem":"2020年电子商务平台技术服务收入占全行业收入的比重约为：","options":{"A":"7.6%","B":"11.1%","C":"15.3%","D":"18.2%"},"answer":"B","explanation":"根据题干“2020年······占······的比重约为”，结合材料时间是2020年，可判定本题为现期比重问题。定位文字材料第二段、第三段可知：2020年，软件产品实现收入22758亿元，同比增长10.1%，占全行业比重为27.9%；电子商务平台技术服务收入9095亿元。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，则2020年全行业收入\u003cimg data-k=\"ef934d1e7338\">\u003cimg data-k=\"57053c5ac877\">\u003cimg data-k=\"acfe88a7f292\">亿元，故题干所求\u003cimg data-k=\"1a3a83423fbe\">\u003cimg data-k=\"20f0875f5239\">，与B项最接近。\n故正确答案为B。","no":106,"missingImage":false},{"qid":"5102379","cat":"增长","stem":"2020年四大业务形态收入同比增速高于全行业平均水平的有：","options":{"A":"1个","B":"2个","C":"3个","D":"4个"},"answer":"A","explanation":"定位文字材料第二段可知：2020年软件产品收入同比增长10.1%；定位文字材料第三段可知：2020年信息技术服务收入同比增长15.2%，增速高出全行业平均水平1.9个百分点，可得2020年全行业平均水平同比增速为15.2%-1.9%=13.3%；定位文字材料第四段可知：2020年信息安全产品和服务收入同比增长10.0%；定位文字材料第五段可知：2020年嵌入式系统软件收入7492亿元，同比增长12.0%。四大业务形态收入同比增速高于全行业平均水平的为信息技术服务(15.2%)，有1个。\n故正确答案为A。","no":107,"missingImage":false},{"qid":"5102380","cat":"综合","stem":"2019年全行业实现收入约为：","options":{"A":"7.2万亿元","B":"7.4万亿元","C":"8.2万亿元","D":"8.4万亿元"},"answer":"A","explanation":"根据题干“2019年······约为”，结合材料时间为2020年，可判定本题为基期计算问题。定位文字材料第三段可得：2020年，信息技术服务实现收入49868亿元，同比增长15.2%，增速高出全行业平均水平1.9个百分点，占全行业收入比重为61.1%。根据公式：整体量\u003cimg data-k=\"95f7e3ba5183\">，则2020年全行业实现收入\u003cimg data-k=\"a5fb40ad0a8f\">亿元，同比增速=15.2%-1.9%=13.3%。根据公式：基期量\u003cimg data-k=\"eb4ccfb62ef4\">，则2019年全行业实现收入\u003cimg data-k=\"5563f76bad6d\">\u003cimg data-k=\"05cc2ea19609\">\u003cimg data-k=\"8daca9f6dc37\">亿元\u003cimg data-k=\"1d57a23533fe\">万亿元。\n故正确答案为A。","no":108,"missingImage":false},{"qid":"5102381","cat":"增长","stem":"2019年嵌入式系统软件同比增速相较于信息安全产品和服务同比增速：","options":{"A":"快2.0%","B":"快8.6%","C":"慢4.6%","D":"慢7.5%"},"answer":"C","explanation":"根据题干“2019年······同比增速相较于······同比增速”，可判定本题为一般增长率问题。定位材料第五段，2020年嵌入式系统软件实现收入7492亿元，同比增长12.0%，增速较上年提高4.2个百分点，则2019年嵌入式系统软件同比增速为12.0%-4.2%=7.8%；定位材料第四段，2020年信息安全产品和服务实现收入1498亿元，同比增长10.0%，增速较上年回落2.4个百分点，则2019年信息安全产品和服务同比增速为10.0%+2.4%=12.4%，二者相差：7.8%-12.4%=-4.6%，即慢4.6%。\n故正确答案为C。","no":109,"missingImage":false},{"qid":"5102383","cat":"综合","stem":"下列选项不能从上述资料推出的是：","options":{"A":"2019年信息安全产品和服务实现收入约为1361.8亿元","B":"2019年信息安全产品和服务占全行业收入比重最低","C":"2020年信息安全产品和服务占全行业收入比重为2.8%","D":"2019年信息技术服务收入占全行业收入比重低于61.1%"},"answer":"C","explanation":"A项：定位文字材料第四段可得：2020年，信息安全产品和服务实现收入1498亿元，同比增长10.0%。根据公式：基期量\u003cimg data-k=\"eb4ccfb62ef4\">，则2019年信息安全产品和服务实现收入为\u003cimg data-k=\"787ef0e9ac73\">亿元，正确；\nB项：定位文字材料可知2020年软件产品、信息技术服务、信息安全产品和服务、嵌入式系统软件的实现收入及同比增长率。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，整体量一致，比较比重的大小，只需比较部分量的大小即可。根据公式：基期量\u003cimg data-k=\"eb4ccfb62ef4\">，则2019年软件产品、信息技术服务、信息安全产品和服务、嵌入式系统软件的实现收入分别为\u003cimg data-k=\"458389eec1e0\">亿元、\u003cimg data-k=\"fc20770e06a5\">亿元、\u003cimg data-k=\"ee6b6a4a42e4\">亿元、\u003cimg data-k=\"ea5a10fe1b78\">亿元。分母（1+增长率）相差不大，现期量最小的是信息安全产品和服务，则其基期量最小，占全行业收入比重最低，正确；\nC项：定位文字材料第一段可知：软件产品、信息技术服务、信息安全产品和服务、嵌入式系统软件四大业务形态构成我国软件和信息技术服务业。定位文字材料第二、三、五段可知2020年软件产品、信息技术服务、嵌入式系统软件实现收入占全行业收入的比重分别是27.9%、61.1%、9.2%。因此，2020年信息安全产品和服务占全行业收入比重为1-27.9%-61.1%-9.2%=1.8%，错误；\nD项：定位文字材料第三段可得：2020年，信息技术服务实现收入同比增长15.2%，增速高出全行业平均水平1.9个百分点，占全行业收入比重为61.1%。根据两期比重比较口诀“部分增长率大于整体增长率，则比重上升”。部分增长率（15.2%）大于整体增长率（15.2%-1.9%），比重上升，即2019年信息技术服务收入占全行业收入比重低于61.1%，正确。\n本题为选非题，故正确答案为C。","no":110,"missingImage":false}]},{"type":"material","material":"\u003cp>        近年来，我国新能源汽车销量及保有量快速提升，充电基础设施布局也日渐完善。2021年新能源汽车销量达352.1万辆，同比增长157.51%；截至2021年，我国新能源汽车保有量达784万辆，同比增长59.25%。\u003c/p>\u003cp>\u003cimg data-k=\"12de19839250\" style=\"max-width:700px\">\u003c/p>\u003cp>\u003cimg data-k=\"e36189b5a361\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"5102153","cat":"增长","stem":"2016—2021年我国公共充电桩数量同比增速最大的年份是：","options":{"A":"2016年","B":"2019年","C":"2020年","D":"2021年"},"answer":"A","explanation":"根据题干“2016-2021年······同比增速最大的年份是”，可判定本题为一般增长率比较问题。定位统计图1可知2015—2021年我国公共充电桩数量。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，可得我国公共充电桩数量同比增速分别为：\n2016年，\u003cimg data-k=\"88457afa480b\">；\n2019年，\u003cimg data-k=\"948029216e60\">；\n2020年，\u003cimg data-k=\"f5df0fb7c94d\">；\n2021年，\u003cimg data-k=\"8d776129aaf6\">。\n则2016—2021年我国公共充电桩数量同比增速最大的年份是2016年。\n故正确答案为A。","no":111,"missingImage":false},{"qid":"5102150","cat":"比重","stem":"2021年北京市、上海市、广东省公共充电桩数量之和占全国公共充电桩总数的比重约为：","options":{"A":"28.7%","B":"33.3%","C":"39.8%","D":"46.7%"},"answer":"B","explanation":"根据题干“2021年······占······的比重约为”，可判定本题为现期比重问题。定位图1可得：2021年我国公共充电桩数量为114.7万台；定位图2可得：2021年广东省、上海市、北京市公共充电桩
