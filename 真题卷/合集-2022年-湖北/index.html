<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">行测真题模拟考场<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>
<div class="toast" id="toast"></div>

window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",imgBase:"",papers:[{"slug":"2022-湖北","title":"2022年湖北省公务员录用考试《行测》题（网友回忆版）","year":"2022","group":"湖北","modules":[{"label":"政治理论","items":[{"type":"question","qid":"5102128","cat":"时事政治","stem":"中国共产党十九届六中全会决定，党的二十大将于2022年下半年在北京召开。下列有关党的二十大的说法正确的有几项：\n①党的二十大，是我们党进入全面建设社会主义现代化国家、向第二个百年奋斗目标进军新征程的重要时刻召开的一次十分重要的代表大会\n②代表产生程序的5个主要环节是：推荐提名、组织考察、确定代表候选人初步人选、确定代表候选人预备人选、会议选举\n③党的二十大代表的选举要严格资格条件，坚持把政治标准放在首位\n④党的二十大代表名额共2300名，与十九大时相同","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查政治常识。\n①正确，中国共产党第十九届中央委员会第六次全体会议公报指出：“全会决定，中国共产党第二十次全国代表大会于2022年下半年在北京召开。全会认为，党的二十大是我们党进入全面建设社会主义现代化国家、向第二个百年奋斗目标进军新征程的重要时刻召开的一次十分重要的代表大会，是党和国家政治生活中的一件大事。”\n②正确，二十大代表的产生，要坚持和加强党的全面领导，充分发扬党内民主，采取自下而上、上下结合、反复酝酿、逐级遴选的办法进行。代表产生程序有5个主要环节，即推荐提名、组织考察、确定代表候选人初步人选、确定代表候选人预备人选、会议选举。\n③正确，党中央提出，二十大代表应是共产党员中的优秀分子。要严把人选政治关，坚持把政治标准放在首位，突出考察人选的理想信念、政治品格和道德修养，着重了解人选政治判断力、政治领悟力、政治执行力，增强“四个意识”、坚定“四个自信”、做到“两个维护”等方面的表现情况，对政治上不合格的一票否决。\n④正确，中央组织部负责人就做好二十大代表选举工作接受采访时表示，党中央明确，二十大代表名额共2300名，与十九大时相同。二十大代表名额的分配，主要根据党组织数量和党员人数确定，同时考虑前几次党的全国代表大会代表名额等因素。按照这一分配办法，各选举单位的代表名额，与十九大时基本相同。\n故①②③④说法正确。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"5102123","cat":"新思想","stem":"2022年3月，习近平总书记在看望参加政协会议的社会福利和社会保障界委员时强调，要在推动社会保障事业高质量发展上持续用力，织密社会保障安全网，为人民生活安康托底。下列做法有助于推动社会保障事业高质量发展的有几项：\n①加大对因疫因灾遇困群众的临时救助力度\n②保障流浪乞讨人员人身安全和基本生活，关心关爱精神障碍人员\n③健全灵活就业人员社保制度，扩大失业、工伤、生育保险的覆盖面\n④健全社会保障基金监管体系，严厉打击欺诈骗保、套保和挪用贪占各类社会保障资金的违法行为","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查政治常识。\n①②正确，习近平总书记强调：“要加大对因疫因灾遇困群众的临时救助力度，做好残疾人康复、教育、就业等工作，保障流浪乞讨人员人身安全和基本生活，关心关爱精神障碍人员，坚决杜绝欺凌虐待妇女儿童、老年人、残疾人等违法行为。”\n③④正确，习近平总书记强调：“我国已建成世界上规模最大的社会保障体系。要健全灵活就业人员社保制度，扩大失业、工伤、生育保险的覆盖面，实现制度安排更加公平，覆盖范围更加广泛，为人民生活安康托底。要健全社会保障基金监管体系，严厉打击欺诈骗保、套保和挪用贪占各类社会保障资金的违法行为，守护好人民群众的每一分‘养老钱’、‘保命钱’。”\n综上所述，有助于推动社会保障事业高质量发展的有①②③④，有4项。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"5102125","cat":"时事政治","stem":"2022年，按照以习近平同志为核心的党中央的部署要求，为稳定宏观经济大盘，稳定上亿市场主体，各部门多措并举优化和落实助企纾困政策，为经济平稳运行提供有力支撑。下列属于“稳主体”对策的是：\n①实施大规模留抵退税政策\n②对特困行业实行阶段性缓缴养老保险费\n③中国人民银行宣布下调金融机构存款准备金率\n④设立3岁以下婴幼儿照护个人所得税专项附加扣除\n⑤央行、银保监会发布个人首套房商贷利率下限调整","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"C","explanation":"本题考查经济常识。\n市场主体是经济的力量载体，保市场主体就是保社会生产力。\n①正确，2022年3月21日，国务院总理李克强主持召开国务院常务会议，确定实施大规模增值税留抵退税的政策安排，为稳定宏观经济大盘提供强力支撑。\n②正确，2022年4月6日，国务院总理李克强主持召开国务院常务会议，决定对特困行业实行阶段性缓缴养老保险费政策，加大失业保险支持稳岗和培训力度；部署适时运用货币政策工具，更加有效支持实体经济发展。\n③正确，为支持实体经济发展，促进综合融资成本稳中有降，中国人民银行决定于2022年4月25日下调金融机构存款准备金率0.25个百分点（不含已执行5%存款准备金率的金融机构），为加大对小微企业和“三农”的支持力度，对没有跨省经营的城商行和存款准备金率高于5%的农商行，在下调存款准备金率0.25个百分点的基础上，再额外多降0.25个百分点。\n④错误，为贯彻落实《中共中央 国务院关于优化生育政策促进人口长期均衡发展的决定》，依据《中华人民共和国个人所得税法》有关规定，国务院决定，设立3岁以下婴幼儿照护个人所得税专项附加扣除。自2022年1月1日起，纳税人照护3岁以下婴幼儿子女的相关支出，在计算缴纳个人所得税前，按照每个婴幼儿每月1000元的标准定额扣除。该项扣除政策有利于减轻人民群众抚养子女负担，体现了国家对人民群众生育养育的鼓励和照顾。属于“保民生”的措施。\n⑤正确，2022年5月15日，央行、银保监会联合发布《关于调整差别化住房信贷政策有关问题的通知》，对于贷款购买普通自住房的居民家庭，首套住房商业性个人住房贷款利率下限调整为不低于相应期限贷款市场报价利率（LPR）减20个基点，二套住房商业性个人住房贷款利率政策下限按现行规定执行。此举对稳定市场预期将起到积极作用，有利于进一步满足刚性和改善性住房需求，促进房地产市场平稳健康发展。\n综上所述，属于“稳主体”对策的是①②③⑤，共4项。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"5102126","cat":"新思想","stem":"习近平总书记强调，必须深化对新的时代条件下我国各类资本及其作用的认识，规范和引导资本健康发展，发挥其作为重要生产要素的积极作用。下列对资本的认识不准确的是（    ）。","options":{"A":"在社会主义市场经济体制下，资本是带动各类生产要素集聚配置的重要纽带","B":"资本具有逐利本性，如不加以规范和约束，就会给经济社会发展带来不可估量的危害","C":"要加强资本领域反腐败，保持反腐败高压态势，坚决打击以权力为依托的资本逐利行为","D":"要正确处理资本和利益分配问题，既注重维护按劳分配的主体地位，更注重保障资本参与社会分配获得增殖和发展"},"answer":"D","explanation":"本题考查政治常识。\n2022年4月29日，中共中央总书记习近平就依法规范和引导我国资本健康发展进行第三十八次集体学习时发表重要讲话。\nA、B两项正确，习近平总书记在讲话中指出：“要历史地、发展地、辩证地认识和把握我国社会存在的各类资本及其作用。在社会主义市场经济体制下，资本是带动各类生产要素集聚配置的重要纽带，是促进社会生产力发展的重要力量，要发挥资本促进社会生产力发展的积极作用。同时，必须认识到，资本具有逐利本性，如不加以规范和约束，就会给经济社会发展带来不可估量的危害。”\nC项正确，习近平总书记在讲话中指出：“要加强资本领域反腐败，保持反腐败高压态势，坚决打击以权力为依托的资本逐利行为，着力查处资本无序扩张、平台垄断等背后的腐败行为。”\nD项错误，习近平总书记在讲话中指出：“要正确处理资本和利益分配问题。我国社会主义的国家性质决定了我们必须坚持按劳分配为主体、多种分配方式并存，在社会分配中体现人民至上。要注重经济发展的普惠性和初次分配的公平性，既注重保障资本参与社会分配获得增殖和发展，更注重维护按劳分配的主体地位，坚持发展为了人民、发展依靠人民、发展成果由人民共享，坚定不移走全体人民共同富裕的道路。”\n本题为选非题，故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"5102121","cat":"新思想","stem":"2022年5月10日，习近平总书记在庆祝中国共产主义青年团成立100周年大会上发表重要讲话，激励广大青年团员在实现中华民族伟大复兴中国梦的新征程上奋勇前进。下列有关中国共产主义青年团表述不正确的是：","options":{"A":"团的地方组织和基层组织同时受同级党委和团的上级组织领导","B":"中国共产主义青年团受中国共产党的委托领导中国少年先锋队的工作","C":"团旗上环绕黄色五角星周围的黄色圆圈，象征中国青年一代紧密团结在中国共产党周围","D":"团员在加入共产党后或年满二十八周岁、没有在团内担任职务的情况下，不再保留团籍"},"answer":"D","explanation":"本题考查政治常识。\nA项正确，《中国共产主义青年团章程》总则规定：“中国共产主义青年团中央委员会受中国共产党中央委员会领导，团的地方组织和基层组织受同级党的委员会领导，同时受团的上级组织领导。”\nB项正确，《中国共产主义青年团章程》总则规定：“中国共产主义青年团受中国共产党的委托领导中国少年先锋队的工作。中国共产主义青年团是中华全国青年联合会的核心团体会员，发挥主导作用。中国共产主义青年团在中国共产党的领导下，指导中华全国学生联合会开展工作。”\nC项正确，《中国共产主义青年团章程》第八章“团旗、团徽、团歌”中的第三十七条规定：“中国共产主义青年团团旗旗面为红色，象征革命胜利；左上角缀黄色五角星，周围环绕黄色圆圈，象征中国青年一代紧密团结在中国共产党周围。”\nD项错误，《中国共产主义青年团章程》第一章“团员”中的第一条第三款规定：“团员加入共产党以后仍保留团籍，年满二十八周岁，没有在团内担任职务，不再保留团籍。”\n本题为选非题，故正确答案为D。","no":5,"missingImage":false}],"count":5,"answerable":5,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"5102122","cat":"人文常识","stem":"《中共中央 国务院关于加快建设全国统一大市场的意见》于2022年4月发布，提出从全局和战略高度加快建设全国统一大市场。下列做法符合建设全国统一大市场要求的是：","options":{"A":"统一产权交易信息发布机制，实现全国产权交易市场联通","B":"以集中管理代替市场机制，统一市场价格、商品供给和配给渠道","C":"严格落实“负面清单准入”管理模式，要求各地主管部门根据实际情况及时发布具有市场准入性质的负面清单","D":"指导各地区综合比较优势、资源环境承载能力、产业基础、防灾避险能力等因素，搞好“小而全”的自我小循环"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，《中共中央 国务院关于加快建设全国统一大市场的意见》在“（九）完善市场信息交互渠道”部分指出：“统一产权交易信息发布机制，实现全国产权交易市场联通。优化行业公告公示等重要信息发布渠道，推动各领域市场公共信息互通共享。优化市场主体信息公示，便利市场主体信息互联互通。推进同类型及同目的信息认证平台统一接口建设，完善接口标准，促进市场信息流动和高效使用。依法公开市场主体、投资项目、产量、产能等信息，引导供需动态平衡。”\nB项错误，《中共中央 国务院关于加快建设全国统一大市场的意见》在“（二）工作原则”部分指出：“有效市场，有为政府。坚持市场化、法治化原则，充分发挥市场在资源配置中的决定性作用，更好发挥政府作用，强化竞争政策基础地位，加快转变政府职能，用足用好超大规模市场优势，让需求更好地引领优化供给，让供给更好地服务扩大需求，以统一大市场集聚资源、推动增长、激励创新、优化分工、促进竞争。”故不能用集中管理代替市场机制。\nC项错误，《中共中央 国务院关于加快建设全国统一大市场的意见》在“（五）实行统一的市场准入制度”部分指出：“严格落实‘全国一张清单’管理模式，严禁各地区各部门自行发布具有市场准入性质的负面清单，维护市场准入负面清单制度的统一性、严肃性、权威性。”\nD项错误，《中共中央 国务院关于加快建设全国统一大市场的意见》在“（二十四）破除地方保护和区域壁垒”部分指出：“指导各地区综合比较优势、资源环境承载能力、产业基础、防灾避险能力等因素，找准自身功能定位，力戒贪大求洋、低层次重复建设和过度同质竞争，不搞‘小而全’的自我小循环，更不能以‘内循环’的名义搞地区封锁。”\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"5102118","cat":"人文常识","stem":"2022年，中央一号文件《中共中央 国务院关于做好2022年全面推进乡村振兴重点工作的意见》明确提出“三农”工作的首要任务是“全力抓好粮食生产和重要农产品供给”。下列选项错误的是：","options":{"A":"大力推进北方设施蔬菜、北菜南运基地建设，提高蔬菜应急保供能力","B":"坚持中国人的饭碗任何时候都要牢牢端在自己手中，饭碗主要装中国粮","C":"全面落实粮食安全党政同责，严格粮食安全责任制考核，确保粮食播种面积稳定","D":"坚持和加强党对“三农”工作的全面领导，牢牢守住保障国家粮食安全和不发生规模性返贫两条底线"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，《中共中央 国务院关于做好2022年全面推进乡村振兴重点工作的意见》在“一、全力抓好粮食生产和重要农产品供给”部分指出：“（三）保障‘菜篮子’产品供给。加大力度落实‘菜篮子’市长负责制。稳定生猪生产长效性支持政策，稳定基础产能，防止生产大起大落。加快扩大牛羊肉和奶业生产，推进草原畜牧业转型升级试点示范。稳定水产养殖面积，提升渔业发展质量。稳定大中城市常年菜地保有量，大力推进北方设施蔬菜、南菜北运基地建设，提高蔬菜应急保供能力。”由此可知，应是“南菜北运基地建设”，而非“北菜南运基地建设”。\nB、C两项正确，《中共中央 国务院关于做好2022年全面推进乡村振兴重点工作的意见》在”一、全力抓好粮食生产和重要农产品供给”部分指出：“（一）稳定全年粮食播种面积和产量。坚持中国人的饭碗任何时候都要牢牢端在自己手中，饭碗主要装中国粮，全面落实粮食安全党政同责，严格粮食安全责任制考核，确保粮食播种面积稳定、产量保持在1.3万亿斤以上。”\nD项正确，《中共中央 国务院关于做好2022年全面推进乡村振兴重点工作的意见》在开头第二段指出：“做好2022年‘三农’工作，要以习近平新时代中国特色社会主义思想为指导，全面贯彻党的十九大和十九届历次全会精神······坚持和加强党对‘三农’工作的全面领导，牢牢守住保障国家粮食安全和不发生规模性返贫两条底线，突出年度性任务、针对性举措、实效性导向，充分发挥农村基层党组织领导作用，扎实有序做好乡村发展、乡村建设、乡村治理重点工作，推动乡村振兴取得新进展、农业农村现代化迈出新步伐。”\n本题为选非题，故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"5102119","cat":"科技常识","stem":"新时代需要继承发扬以国家民族命运为己任的爱国主义精神，更需要继承发扬以爱国主义为底色的科学家精神。在中华民族伟大复兴的征程上，一代又一代的科学家不畏艰难，勇攀高峰，无私奉献，为国家和人民做出了彪炳史册的重大贡献。下列科学家与其成就对应关系正确的是：\n①“两弹一星”元勋——于敏\n②北斗三号卫星首席总设计师——谢军\n③中国核潜艇第一任总设计师——赵忠尧\n④新中国飞机空气动力设计奠基人——顾诵芬\n⑤中国脊髓灰质炎疫苗研发生产拓荒者——汤飞凡","options":{"A":"①③④","B":"②③⑤","C":"①②④","D":"②④⑤"},"answer":"C","explanation":"本题考查政治常识。\n①项正确，于敏，核物理学家，中国“氢弹之父”，生于河北省宁河县（今天津市宁河区）。他在我国氢弹原理突破中解决了一系列基础问题，提出了从原理到构形基本完整的设想，起了关键作用。此后长期领导核武器理论研究、设计，解决了大量理论问题。对我国核武器进一步发展到国际先进水平做出了重要贡献。1982年于敏获国家自然科学奖一等奖。1985年、1987年和1989年三次获国家科技进步奖特等奖。1994年获求是基金杰出科学家奖。1999年被国家授予“两弹一星”功勋奖章。2019年9月17日，国家主席习近平签署主席令，授予于敏“共和国勋章”。\n②项正确，谢军，山西临汾人，中共党员，研究员，历任航天科技集团五院504所副所长、所长，北斗二号导航卫星总设计师。现任北斗三号工程副总设计师、北斗三号导航卫星首席总设计师，北斗卫星导航系统工程副总设计师。2020年12月，被国资委党委授予第五届“央企楷模”称号。2021年2月17日，谢军被评为“感动中国2020年度人物”。\n③项错误，彭士禄是中国核潜艇第一任总设计师，中国工程院首批及资深院士，被誉为“中国核潜艇之父”。赵忠尧，主要从事核物理研究，特别是硬g射线与物质相互作用等方面的研究，主持建成中国第一、二台质子静电加速器，为在国内建立核物理实验基地做出了重要贡献。\n④项正确，顾诵芬，江苏苏州人，飞机设计专家，中国自行设计、制造的高空高速歼击机的主要技术负责人之一，是新中国飞机空气动力设计奠基人。2021年11月3日上午，2020年度国家科学技术奖励大会在北京人民大会堂隆重召开。中国航空工业集团有限公司顾诵芬院士获国家最高科学技术奖。\n⑤项错误，顾方舟，我国著名病毒学家、脊髓灰质炎疫苗研发生产拓荒者，被称为“中国脊髓灰质炎疫苗之父”。汤飞凡，著名微生物学家、病毒学家，沙眼衣原体的发现人之一，长期从事微生物学、病毒学和免疫学的研究。\n综上所述，科学家与其成就对应关系正确的是①②④。\n故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"5102137","cat":"法律常识","stem":"某市为保护当地的湿地自然景观，制定颁布了《X市湿地保护办法》，禁止私自采掘、捕捞、打猎等行为。张某闲来无事，前往湿地景区游玩，看到两只受伤野鸭便顺手捡起，准备带回家去。在回家路上，张某携带的野鸭被正在巡逻的警察发现，警察依据《X市湿地保护办法》对其处以1000元罚款。张某不服，欲提起行政诉讼，下列说法错误的是：","options":{"A":"张某可以就罚款决定提起诉讼","B":"张某认为《X市湿地保护办法》违背上位法规定，可以只就其合法性提起诉讼","C":"张某可以提供行政行为违法的证据，提供的证据不成立的，不免除公安机关的举证责任","D":"公安机关对作出的行政行为负有举证责任，应当提供作出该行政行为的证据和所依据的规范性文件"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国行政诉讼法》第十二条第一款第一项规定：“人民法院受理公民、法人或者其他组织提起的下列诉讼：（一）对行政拘留、暂扣或者吊销许可证和执照、责令停产停业、没收违法所得、没收非法财物、罚款、警告等行政处罚不服的；”\nB项错误，根据《中华人民共和国行政诉讼法》第十三条第二项规定：“人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：（二）行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令；”题中，《X市湿地保护办法》属于规章或行政机关制定、发布的具有普遍约束力的决定、命令，不得对其提起行政诉讼。\nC项正确，根据《中华人民共和国行政诉讼法》第三十七条规定：“原告可以提供证明行政行为违法的证据。原告提供的证据不成立的，不免除被告的举证责任。”\nD项正确，根据《中华人民共和国行政诉讼法》第三十四条第一款规定：“被告对作出的行政行为负有举证责任，应当提供作出该行政行为的证据和所依据的规范性文件。”\n本题为选非题，故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"5102139","cat":"科技常识","stem":"关于下列诗句均描述了一种生物学现象，对其解释错误的是：","options":{"A":"“儿童急走追黄蝶，飞入菜花无处寻”体现动物的拟态","B":"“春色满园关不住，一枝红杏出墙来”体现植物的向光性","C":"“落红不是无情物，化作春泥更护花”体现微生物的分解作用","D":"“人间四月芳菲尽，山寺桃花始盛开”体现植物开花受温度影响"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，“儿童急走追黄蝶，飞入菜花无处寻”意为小孩子奔跑着追赶黄蝴蝶，可是蝴蝶飞入菜花丛中就再也找不到了。动物的保护色是指动物把体表的颜色改变为与周围环境相似，这种颜色叫保护色。黄蝶飞入菜花丛中就再也找不到了体现的是动物的保护色。拟态是一种生物模拟另一种生物或模拟环境中的其他物体从而获得好处的现象，一般拟态是属于静止的，而保护色与运动状态无关。\nB项正确，“春色满园关不住，一枝红杏出墙来”意为满园子的春色是关不住的，开得正旺的红杏有一枝枝条伸到墙外来了。植物的向光性是指植物生长器官受单方向光照射而引起生长弯曲的现象，对高等植物而言，向光性主要指植物地上部分茎叶的正向光性。正向光性运动与生长素分布有关，光线能使生长素在背光一侧比向光一侧分布多，因此，背光侧比向光侧生长得快，使植物的茎显示出向光性。“红杏出墙”是因为红杏树枝条的向光性生长发生弯曲。\nC项正确，“落红不是无情物，化作春泥更护花”意为从枝头上掉下来的落花不是无情之物，会化作春天的泥土，培育春天的花朵生长。落花之所以会转化为春泥是微生物的分解作用，泥土中的微生物通过分解作用可以将落花中的有机物分解为简单的无机物，为土地提供养分，使自然界的物质得到循环利用。\nD项正确，“人间四月芳菲尽，山寺桃花始盛开”意为人间四月里百花凋零已尽，可是山寺之中，桃花却刚刚盛开。说明海拔高度升高温度下降，温度会影响植物的生长发育进程。\n本题为选非题，故正确答案为A。","no":10,"missingImage":false},{"type":"question","qid":"5102145","cat":"科技常识","stem":"关于安全生产管理工作，下列说法正确的是：","options":{"A":"机关、团体、企业、事业等单位应当对建筑消防设施每季度至少进行一次全面检测","B":"未造成人员伤亡的一般事故，县级人民政府可以委托事故发生单位组织事故调查组进行调查","C":"交通运输主管部门负责危险化学品的公共安全管理，核发剧毒化学品购买许可证、剧毒化学品道路运输通行证","D":"安全生产监督管理部门和负有安全生产监督管理职责的有关部门逐级上报事故情况，每级上报的时间不得超过1小时"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国消防法》第十六条第一款第三项规定：“机关、团体、企业、事业等单位应当履行下列消防安全职责：（三）对建筑消防设施每年至少进行一次全面检测，确保完好有效，检测记录应当完整准确，存档备查。”题中，每季度至少进行一次全面检测说法错误。\nB项正确，根据《生产安全事故报告和调查处理条例》第十九条规定：“特别重大事故由国务院或者国务院授权有关部门组织事故调查组进行调查。重大事故、较大事故、一般事故分别由事故发生地省级人民政府、设区的市级人民政府、县级人民政府负责调查。省级人民政府、设区的市级人民政府、县级人民政府可以直接组织事故调查组进行调查，也可以授权或者委托有关部门组织事故调查组进行调查。未造成人员伤亡的一般事故，县级人民政府也可以委托事故发生单位组织事故调查组进行调查。”\nC项错误，根据《危险化学品安全管理条例》第六条第二项规定：“对危险化学品的生产、储存、使用、经营、运输实施安全监督管理的有关部门（以下统称负有危险化学品安全监督管理职责的部门），依照下列规定履行职责：（二）公安机关负责危险化学品的公共安全管理，核发剧毒化学品购买许可证、剧毒化学品道路运输通行证，并负责危险化学品运输车辆的道路交通安全管理。”\nD项错误，根据《生产安全事故报告和调查处理条例》第十一条规定：“安全生产监督管理部门和负有安全生产监督管理职责的有关部门逐级上报事故情况，每级上报的时间不得超过2小时。”\n故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"5102403","cat":"人文常识","stem":"在日常生活中，长期来看下列杯子的使用方法对人体最没有危害的是：","options":{"A":"用玻璃杯喝冰橙汁","B":"用不锈钢杯喝碳酸饮料","C":"用塑料杯盛放刚烧开的水","D":"用内壁涂有彩釉的陶瓷杯喝热姜汁"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，玻璃杯是指玻璃制成的杯子，通常由原材料高硼硅玻璃，经过600多度的高温烧制而成，其物理强度高，与普遍玻璃相比，无毒副作用，其机械性能，热稳定性能，抗水、抗碱、抗酸等性能大大提高。用玻璃杯喝冰橙汁对身体基本不会产生危害。\nB项错误，不锈钢材质对于酸性饮料不具有防腐蚀特性，碳酸饮料属于酸性物质，长时间使用不锈钢杯装碳酸饮料不仅会破坏腐蚀水杯内壁，更会对人体造成伤害，因此不宜用不锈钢杯喝碳酸饮料。\nC项错误，塑料杯通常由聚苯乙烯（PS）制作而成，用其装酸（如柳橙汁）、碱性物质后，会分解出致癌物质，不耐高温；其温度达到六十几度的时候会变形，产生对人体有害的物质，因此不宜能用塑料杯盛放刚烧开的水。\nD项错误，彩釉陶瓷杯上的图案是用颜料涂画而来，内壁涂有彩釉，当装入开水、酸性、碱性饮料时，铅等有害重金属元素会溶解在饮料中，对健康不利。因此不宜用内壁涂有彩釉的陶瓷杯喝热姜汁。\n故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"5102133","cat":"人文常识","stem":"传统的光刻技术中，镜头与光刻胶之间的介质是空气，而浸入式技术是将空气介质换成液体，得到合适波长的光，以提高成像分辨率，以下说法错误的是：","options":{"A":"液体局部温度起伏会引起成像质量恶化","B":"为了减少液体对光线的吸收，液层厚度不能太大","C":"以纯水为介质时，可以选取任意波长紫外光为光源","D":"可以注入高折射率的液体以得到更高频率的光，提高成像分辨率"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，液体温度的变化将引起折射率的改变。如果液体温度变化不均匀，会导致像面聚焦偏移和球差的改变。在曝光系统中，焦面的偏移可由调焦调平系统校正，然而局部的温度起伏将引起局部的成像质量恶化。\nB项正确，光刻机的生产率与照明光的透射率成正比，因此为了减小液体对光线的吸收，液体层的厚度不能太大。\nC项错误，在光的大多数波段水的折射率为1.33左右，而在193nm附近，水的折射率高达1.437，因此为满足高折射率和高透射系数的要求，应使用水作为193nm附近光刻的浸没液体，不能任意选择波长。\nD项正确，浸入式技术利用光通过液体介质后光源波长缩短来提高分辨率，其缩短的倍率即为液体介质的折射率。因此，折射率越高的液体就可以得到波长更短的光，提高成像分辨率。【备注：本题D项说法不严谨，注入高折射率的液体改变的应是光的波长，而非频率。】\n本题为选非题，故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"5102375","cat":"人文常识","stem":"“揭榜挂帅”是通过高额悬赏征集科技创新成果，把需要攻关的科研项目张榜，谁有本事谁就揭榜。这充分体现了国家对改革科研项目管理模式、提高科技创新支撑能力的高度重视。下列说法不准确的是：","options":{"A":"采取“一对一”的揭榜方式","B":"支持企业牵头组建的创新联合体“揭榜攻关”","C":"是一种以科研成果来兑现的科研经费投入体制","D":"“政府搭台、创新唱戏”将各自的资源优势有力整合到一起"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，从揭榜方式来看，当前多数省份默认采取“一对一”的揭榜方式，同时鼓励揭榜单位组建创新联合体共同攻关，而针对需求方无法确定唯一合作对象的情况，部分地区注明揭榜方可为2-3家，实行“赛马”制。\nB项正确，在中国科学院第二十次院士大会、中国工程院第十五次院士大会、中国科协第十次全国代表大会上，习近平总书记强调，“要发挥企业出题者作用，推进重点项目协同和研发活动一体化，加快构建龙头企业牵头、高校院所支撑、各创新主体相互协同的创新联合体。”企业天然具有技术创新的诉求和属性，领军企业能够把握关键核心技术的前沿导向，并具有较强的研发领导能力与抗风险能力，由他们牵头组建创新联合体，有助于带动整个创新链上下游企业的技术水平，实现关键核心技术的突破。因此要支持企业牵头组建的创新联合体“揭榜攻关”。\nC项正确，“揭榜挂帅”也被称为科技悬赏制，是一种以科研成果来兑现的科研经费投入体制，由政府组织面向全社会开放征集科技创新成果的一种非周期性科研资助安排。\nD项正确，“政府搭台”是指发挥好政府在科研管理方面的组织优势，提供政策保障，“创新唱戏”是要激发高校、企业等创新主体的创新活力，整合各种创新资源，提升国家整体创新能力。实行“揭榜挂帅”的最终目的，就是要通过深化科技体制改革把巨大创新潜能有效释放出来，持续提升科技自主创新能力，整合企业、科学界等的力量与资源集中攻破难关。\n本题为选非题，故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"5102374","cat":"人文常识","stem":"下列典故，表达的文化内涵相同的一项是：","options":{"A":"陆绩怀橘、六子尽赤","B":"结草衔环、曾子烹彘","C":"黄粱美梦、梦笔生花","D":"程门立雪、子贡结庐"},"answer":"D","explanation":"本题考查人文常识。\nA项错误，“陆绩怀橘”主要讲述的是陆绩六岁就知道把橘子让给母亲品尝的故事，体现出孝顺父母的美好品德。“六子尽赤”主要讲述的是刘信为表明自己并无背叛义祖之心，觉得用言语表白无济于事，便借掷骰博戏之机，以掷骰于盆，六子皆为红色，证明自己赤心不二。体现出忠义的美好品德。\nB项错误，“结草衔环”是来源于古代报恩神话故事的成语，比喻受人恩惠，定当厚报，生死不渝。“曾子烹彘”也就是曾子杀猪的故事，主要强调的是家长要与孩子诚实相待，要信守诺言。说明了要有诚实守信的人生态度。\nC项错误，“黄粱美梦”用于比喻不切实际、不能实现的如意打算。“梦笔生花”是指梦到笔头生了花，比喻才情横溢，文思敏捷。\nD项正确，“程门立雪”这则成语意指学生恭敬求教，比喻尊师重教，虔诚求学。“子贡结庐”是指子贡在他的老师孔子的墓前建造房屋，为恩师守墓六年。体现出尊师重教的美好品德。\n故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"5102310","cat":"人文常识","stem":"古代绘画艺术是中华文明的重要组成部分，下列有关说法正确的是：","options":{"A":"元代和明代画家常绘的《雪夜访戴图》取材于《幽明录》的记载","B":"本生故事画是敦煌壁画中的流行题材","C":"东晋著名画家顾恺之被誉为画圣","D":"《潇湘竹石图》是苏辙的名画"},"answer":"B","explanation":"本题考查人文常识。\nA项错误，中国传统绘画中，有许多描写传说故事的题材。比如历代画家都有不少《雪夜访戴图》，如元代张渥、明代周文靖等。这些画作是以东晋王徽之雪夜乘舟访问朋友戴逵的故事为创作背景。《雪夜访戴》出自《世说新语·任诞》，讲述王徽之雪夜访戴安道，未至而返，显示了他作为名士的潇洒自适。\nB项正确，本生故事画描绘释迦牟尼生前的各种善行，宣传“因果报应”“苦修行善”的生动故事。也是敦煌早期壁画中广泛流行的题材，如“萨捶那舍身饲虎”“尸毗王割肉救鸽”“九色鹿舍己救人”等。\nC项错误，吴道子（约680年—759年），又名道玄，唐代著名画家，后世尊称其为画圣。擅佛道、神鬼、人物、山水、鸟兽、草木、楼阁等，尤精于佛道、人物，长于壁画创作。顾恺之，东晋杰出画家、绘画理论家，精于人像、佛像、禽兽、山水等，世人称之为三绝：画绝、文绝和痴绝。\nD项错误，《潇湘竹石图》为北宋苏轼创作的绢本水墨画。采用长卷式构图，展现湖南省零陵县西潇、湘二水合流处，遥接洞庭巨浸的苍茫景色。整幅画作以潇湘二水的交汇点为中心，远山烟水，风雨瘦竹，近水与云水、蹲石与远山、筱竹与烟树产生强烈对比，让人在窄窄画幅内如阅千里江山。\n故正确答案为B。","no":16,"missingImage":false},{"type":"question","qid":"5102132","cat":"经济常识","stem":"下列关于金融产品的说法正确的是：","options":{"A":"金融产品价格波动属于信用风险","B":"在开放基金中风险最低的是混合型基金","C":"存款保险制度的保障范围不包括银行自营的理财产品","D":"金融产品的风险由大到小排序：金融债券＞股票＞储蓄产品"},"answer":"C","explanation":"本题考查经济常识。\nA项错误，信用风险又称违约风险，是指借款人、证券发行人或交易对方因种种原因，不愿或无力履行合同条件而构成违约，致使银行、投资者或交易对方遭受损失的可能性。因此，金融产品价格波动不属于信用风险。\nB项错误，人们将开放式基金分为四种基本类型：股票型基金、混合型基金、债券型基金、货币型基金。混合型基金指同时投资于股票、债券和货币市场等工具，没有明确投资方向的基金。而货币型基金主要投资于货币市场的基金，相对来说，它的风险是最低的。\nC项正确，存款保险主要保障的是储蓄存款，如果存款保险成员机构发生经营危机，或者面临破产倒闭，那么存款保险就可以为该成员机构提供财务方面的救助，或者直接向存款人支付部分或全部的存款，从而保障存款人的相关权益。但是银行自营的理财产品并不属于储蓄存款，因此是不属于存款保险制度的保障范围之内的。\nD项错误，金融债券是由银行和非银行金融机构发行的债券。从收益方面看，债券在购买之前，利率已定，到期就可以获得固定利息，而不用管发行债券的公司经营获利与否；股票一般在购买之前不定股息率，股息收入随股份公司的盈利情况变动而变动，盈利多就多得，盈利少就少得，无盈利不得。从本金方面看，债券到期可回收本金，也就是说连本带利都能得到，如同放债一样；股票则无到期之说。股票本金一旦交给公司，就不能再收回，只要公司存在，就永远归公司支配。公司一旦破产，还要看公司剩余资产清盘状况，那时甚至连本金都会蚀尽，所以债券的风险性小于股票。储蓄产品是指银行推出的存钱产品，风险是最低的。因此，风险由大到小排序：股票＞金融债券＞储蓄产品。\n故正确答案为C。","no":17,"missingImage":false},{"type":"question","qid":"5102143","cat":"科技常识","stem":"下列关于伟大科学工程的说法，正确的是：","options":{"A":"阿波罗计划：1961年在美国启动，尤里·加加林乘坐阿波罗1号宇宙飞船第一个登上月球表面","B":"中国863计划：1986年在中国启动，深海载人潜水器被列为该计划的研究专项之一","C":"人类基因组计划：1990年在法国启动，聚焦测定人染色体DNA序列，以破译遗传信息为目的","D":"人类脑计划：1997年在英国启动，以心理科学和信息科学研究为核心"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，阿波罗计划为20世纪60-70年代美国实施的载人登月工程，“阿波罗”登月飞行从1961年启动。1969年7月16-24日，阿姆斯特朗作为“阿波罗”11号飞船指令长，完成人类首次登月飞行。\nB项正确，中国863计划是中国发展高技术及其产业的计划，全称国家高技术研究发展计划。因1986年3月王大珩、王淦昌、杨嘉墀、陈芳允四位科学家提出这个建议而得名，于1986年启动实施。2002年中国科技部将深海载人潜水器研制列为国家高技术研究发展计划（863计划）重大专项，启动“蛟龙号”载人深潜器的自行设计、自主集成研制工作。\nC项错误，人类基因组计划由美国科学家于1985年率先提出，1990年正式启动，于2000年完成了人类基因组“工作框架图”。其核心任务是要绘制出人类基因组的遗传图谱、物理图谱、转录图谱和序列图谱，最终测定出人类基因组DNA的全部核苷酸序列。\nD项错误，人类脑计划包括神经科学和信息科学这当今自然科学两大热点的相互结合研究，其核心内容是神经信息学。1997年人类脑计划在美国正式启动，美国20多家著名的大学和研究所参加了这个研究计划。\n故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"5102377","cat":"科技常识","stem":"高脂血症的临床表现主要是脂质在皮肤内沉积引起的黄色瘤和脂质在血管内皮沉积所引起的动脉粥样硬化，然而，多数患者并无明显症状和异常体征。下列关于这种疾病的说法正确的是：","options":{"A":"患者日常饮食中的油脂摄入应当以动物油为主","B":"只有肥胖者才会得高脂血症","C":"血液中的部分脂质过高","D":"容易引起白血病"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，高脂血症的患者日常饮食中的油脂摄入应当以植物油为主，并且每人每日的用量以25-30g为宜。因为动物性脂肪，或者是肉类、蛋类、乳制品等食物中的饱和脂肪酸和胆固醇的含量比较丰富，摄入过多，容易使胆固醇超标，出现高胆固醇血症，会加重病情。\nB项错误，肥胖的人的血脂代谢异常的可能性大，出现高脂血症的几率大，但是并不是只有肥胖的人才会得高脂血症，就算是体型消瘦的人也会得高脂血症。高脂血症是一种脂质代谢紊乱引起的疾病，高脂血症也是引起动脉硬化、血管内粥样斑块形成的最主要的原因。\nC项正确，高脂血症是由各种原因导致的血浆中的胆固醇、甘油三酯以及低密度脂蛋白水平升高和高密度脂蛋白过低的一种的全身质代谢异常的一种病。\nD项错误，白血病与高脂血症一般没有关系，属于两种不同的疾病。高脂血症是指血脂水平过高。白血病是血液当中出现不正常的白细胞大量增生的情况。\n故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"5102319","cat":"人文常识","stem":"丙烯酰胺被世界卫生组织列为2A级致癌物，即可疑致癌物。食品中的丙烯酰胺并不是人为添加到食物中，而是在烘焙或烹饪过程中产生的，下列烹饪手法中生成丙烯酰胺最少的是：","options":{"A":"干煸四季豆","B":"炸油条","C":"白灼虾","D":"炝炒白菜"},"answer":"C","explanation":"本题考查科技常识。\n丙烯酰胺的形成与食物加工烹调方式、温度、时间、水分等有关。丙烯酰胺主要在高碳水化合物、低蛋白质的植物性食物烹调过程中被加热到120\u003cimg data-k=\"b658c865c7d8\">\u003cimg data-k=\"a2ed70c2e19b\">以上时生成，140-180\u003cimg data-k=\"8afadf6ce3b2\">为生成的最佳温度；在加工温度较低，如用水煮时，丙烯酰胺的形成水平相当低。食物的水含量也是影响丙烯酰胺形成的重要因素，特别是烘烤、油炸食品最后阶段水分减少、表面温度升高后，其丙烯酰胺形成量更高。白灼虾是用水煮的方式烹调，与干煸四季豆、炸油条、炝炒白菜相比，丙烯酰胺的生成量最少。\n故正确答案为C。","no":20,"missingImage":false}],"count":15,"answerable":15,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"5102382","cat":"逻辑填空","stem":"中华传统节日的文化内涵蕴藏在人与自然、人与他人、人与自身的相处之道中，体现了中华民族的核心价值观念，而        其中的则是对“和”的追求。\n填入划横线部分最恰当的一项是：","options":{"A":"分列","B":"统贯","C":"包含","D":"纵横"},"answer":"B","explanation":"根据“中华传统节日的文化内涵蕴藏在人与自然、人与他人、人与自身的相处之道中”可知，横线处应体现出对“和”的追求贯穿始终之意，B项“统贯”指系统、条贯，可以体现“贯穿始终”之意，当选。\nA项“分列”指按照一项准则分级或分类，与文意无关，排除；\nC项“包含”指里边含有，无法体现“贯穿始终”之意，排除；\nD项“纵横”指竖横交错或奔驰无阻，文段未体现“交错”之意，排除。\n故正确答案为B。\n【文段出处】书籍《中国文艺评论》2021年第5期——《中华传统节日的文化内涵：基于人与自然、他者和自身关系视角的考察》","no":21,"missingImage":false},{"type":"question","qid":"5102187","cat":"逻辑填空","stem":"修炼挨批评这项基本功，要有虚心接受的气度。接受批评，就要拿出虚心以待、胸怀若谷的姿态，砥砺            、从善如流的自觉。\n填入划横线部分最恰当的一项是：","options":{"A":"见贤思齐","B":"洗心革面","C":"兼听则明","D":"闻过则喜"},"answer":"D","explanation":"根据顿号可知，横线处所填成语与“从善如流”构成并列关系，表示听取正确的意见、接受善意的规劝之意，D项“闻过则喜”意为听到批评意见就喜悦，比喻乐于接受他人规劝，符合文意，当选。\nA项“见贤思齐”意思是见到德才兼备的人就要向他（她）看齐，文段没有体现出要向德才兼备的人看齐之意，排除；B项“洗心革面”意为除去邪思杂念，改变旧日面目，比喻彻底悔悟，改过自新，文段并无改过自新之意，排除；C项“兼听则明”指多方听取意见才能辨明是非得失，侧重意见，文段强调批评，与文意不符，排除。\n故正确答案为D。\n【文段出处】人民日报《人民日报:每一位同志都要修炼好挨批评的基本功》","no":22,"missingImage":false},{"type":"question","qid":"5102183","cat":"逻辑填空","stem":"改革和法治如鸟之两翼、车之两轮。党的十八大以来，全面深化改革的一个鲜明特点，就是把法治贯穿于改革全过程，在法治下推进改革、在改革中完善法治，保证改革和法治相互促进、            。\n填入划横线部分最恰当的一项是：","options":{"A":"交相辉映","B":"相映成趣","C":"相得益彰","D":"相为表里"},"answer":"C","explanation":"横线处所填成语搭配“改革和法治”，根据横线前顿号可知，横线处所填成语与“相互促进”构成近义并列，表意相近。C项“相得益彰”指两个人或两件事物互相配合，双方的能力和作用更能显示出来，可以体现相互促进之意，当选。A项“交相辉映”指各种光亮、色彩等互相映照，多用于形容美好的景象，与“改革和法治”搭配不当，排除；B项“相映成趣”指相互衬托着，显得很有趣味，很有意思，D项“相为表里”即互为表象及内里，内外互相配合，共为一体，均无法体现促进之意，排除。\n故正确答案为C。\n【文段出处】人民日报《人民时评：让法治与改革相得益彰》","no":23,"missingImage":false},{"type":"question","qid":"5102212","cat":"逻辑填空","stem":"文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。人类社会与文明的每一次        ，无不伴随着文化的历史性进步。纵览历史长河，无论是传统还是现代社会治理结构和治理体系中，文化发展无不         、推动着社会的发展和完善。\n依次填入划横线部分最恰当的一项是：","options":{"A":"跨越 滋补","B":"跃进 滋养","C":"变迁 滋润","D":"突破 滋生"},"answer":"B","explanation":"第一空，横线处搭配“人类社会与文明”，根据“无不伴随着文化的历史性进步”可知，横线处要体现人类社会与文明的进步之意。A项“跨越”指超过时期或地区之间的界限，B项“跃进”指跳着向前进，比喻极快地前进，D项“突破”指冲破或超过某个界限，均可体现出进步之意，符合文意，保留。C项“变迁”指事物缓慢逐渐变化转移，侧重强调变化而并不一定就是进步，与文意不符，排除。\n第二空，根据横线后顿号可知，横线处与“推动”构成近义并列，共同体现出“文化发展”对“社会的发展和完善”发挥的积极作用。B项“滋养”指供给养分，置于此处表示文化为社会的发展和完善提供养分，符合文意，当选。A项“滋补”指供给身体需要的养分，补养，常与“身体”搭配，与后文“社会的发展和完善”搭配不当，排除；D项“滋生”指繁殖，引起，产生，多用于消极语境，如滋生细菌、滋生腐败等，文段并非消极语境，排除。\n故正确答案为B。\n【文段出处】中国教育报《涵育向上而行的文化》","no":24,"missingImage":false},{"type":"question","qid":"5102389","cat":"逻辑填空","stem":"这款奥运比赛服，将国旗色与故宫传统色相结合，在色彩的渐变中，“飞龙”腾空而起，        在祥云瑞气之中，        吉祥如意的祝福与祈愿。\n依次填入划横线部分最恰当的一项是：","options":{"A":"掩护 包涵","B":"掩映 饱含","C":"掩藏 包容","D":"掩盖 包含"},"answer":"B","explanation":"第一空，横线处所填词语用以形容“飞龙”腾空而起，穿行于祥云瑞气之中的场景，B项“掩映”指彼此遮掩而互相衬托，时隐时现，符合文意，保留；A项“掩护”指用人体或其他掩护体挡住，C项“掩藏”指隐藏、藏匿，D项“掩盖”指隐藏，隐瞒，均与文意无关，排除。\n第二空，代入验证，横线处词语与“祝福与祈愿”搭配，B项“饱含”指满含，充满，置于此处搭配得当，符合文意，当选。\n故正确答案为B。\n【文段出处】人民资讯《比音勒芬携五星战袍Ⅱ 助力奥运健将在国际舞台上展现中国自信！》","no":25,"missingImage":false},{"type":"question","qid":"5102213","cat":"逻辑填空","stem":"由我国自营勘探开发的首个1500米超深水大气田“深海一号”在海南岛东南陵水海域正式投产，标志着中国海洋石油勘探开发能力全面进入“超深水时代”，对保障国家能源安全、        能源结构转型升级和提升我国深海资源开发能力具有重要意义，建设海洋强国迈出了        的一步。\n依次填入划横线部分最恰当的一项是：","options":{"A":"促使 坚决","B":"推动 坚实","C":"鼓动 坚定","D":"提高 坚韧"},"answer":"B","explanation":"第一空，搭配“能源结构转型升级”，A项“促使”指推动某物或某事使达到一定目的，B项“推动”指使事物前进或发展，均与“能源结构转型升级”搭配恰当，保留。C项“鼓动”指以言语或行为使他人有所行动，多用于贬义语境，与文段感情色彩不符，排除；D项“提高”指使位置、程度、水平等方面比原来高，与“能源结构转型升级”搭配不当，排除。\n第二空，搭配“一步”，B项“坚实”指牢固结实，符合文意，且与“一步”搭配恰当，当选。A项“坚决”指意志坚定，毫不犹豫，多形容态度、主张等，与“一步”搭配不当，排除。\n故正确答案为B。\n【文段出处】光明网《“深海一号”，探寻超深海能源宝藏》","no":26,"missingImage":false},{"type":"question","qid":"5102211","cat":"逻辑填空","stem":"中国的全面小康，犹如一幅前后相续的长卷，有            的创业征程，有气壮山河的建设浪潮，有波澜壮阔的改革探索，也有拥抱世界的        襟怀。在这条路上，我们用几十年时间，走完了发达国家几百年走过的发展历程；我们用一百年的奋斗，实现了中华民族伟大复兴中国梦的关键一步。\n依次填入划横线部分最恰当的一项是：","options":{"A":"餐风宿露 开明","B":"筚路蓝缕 开放","C":"栉风沐雨 开朗","D":"艰苦卓绝 开拓"},"answer":"B","explanation":"第一空，搭配“创业征程”，且根据文意可知，横线处形容创业的艰难。B项“筚路蓝缕”形容创业的艰辛，C项“栉风沐雨”形容不避风雨，奔波劳碌，D项“艰苦卓绝”形容十分艰苦，极不平凡，均与“创业征程”搭配恰当，且均可体现创业的艰难，符合文意，保留。A项“餐风宿露”形容旅途劳累或野外生活艰苦，与“创业征程”搭配不当，排除。\n第二空，搭配“襟怀”，且根据“拥抱世界”可知，横线处应体现“对外发展”之意。B项“开放”指解除封锁、禁令、限制等，允许进入或利用，与“襟怀”搭配恰当，且符合文意，当选。C项“开朗”指开阔明朗或人性格豁达，乐观，D项“开拓”指开发、拓展，均与“襟怀”搭配不当，排除。\n故正确答案为B。\n【文段出处】人民日报《继往开来的世纪伟业——写在全面建成小康社会的历史时刻》","no":27,"missingImage":false},{"type":"question","qid":"5102210","cat":"逻辑填空","stem":"脱贫攻坚精神是不断创造伟大奇迹的有力武器。贫穷是人类文明社会的顽疾，但贫穷不是不可改变的        ；贫穷不是社会主义，社会主义必须努力摆脱贫穷。脱贫攻坚伟大胜利成果来之不易，在脱贫攻坚这场与贫穷作斗争的硬仗中，党带领广大人民群众逢山开路、遇水搭桥、开拓创新，使贫困群众的生活状况、精神风貌发生了历史性变化，这场规模浩大的伟大斗争实现了            、载入史册的胜利。\n依次填入划横线部分最恰当的一项是：","options":{"A":"命运 叹为观止","B":"归宿 登峰造极","C":"使命 绝无仅有","D":"宿命 史无前例"},"answer":"D","explanation":"第一空，搭配“不可改变”，且形容“贫穷”，根据“贫穷是人类文明社会的顽疾”“贫穷不是社会主义，社会主义必须努力摆脱贫穷”可知，横线处要表达出贫穷是可以摆脱的事情，A项“命运”比喻事物发展变化的趋向及结局，D项“宿命”指生来注定的命运，均与“不可改变”搭配恰当，且符合文意，保留。B项“归宿”指人或事物最终的着落，文段中的贫穷属于目前存在的事情，与文意不符，排除；C项“使命”指派人办事的命令，多比喻重大的责任，贫穷并非是命令或责任，与文意不符，且“使命”多用于偏积极的语境，而“贫穷”偏消极，排除。\n第二空，根据“使贫困群众的生活状况、精神风貌发生了历史性变化”“载入史册的胜利”可知，横线处要体现出这场斗争的宏大和前所未有，D项“史无前例”指历史上从来没有过的事例，符合文意，当选。A项“叹为观止”指赞美所见的事情好到了极点，常见用法为“令人叹为观止”“让人叹为观止”，置于此处用法错误，排除。\n故正确答案为D。\n【文段出处】光明日报《赓续伟大的脱贫攻坚精神》","no":28,"missingImage":false},{"type":"question","qid":"5102215","cat":"逻辑填空","stem":"低碳转型是牵涉供应端和消费端全链条的        工程，不仅需要各行各业攻坚克难的决心，也需要我们每个人            的行动。夏天把空调温度调高一些，尽量购买节能型用品，积极参与义务植树活动，每个人都为地球的“凉热”出一份力。只有让低碳成为新风尚、新潮流，才能与技术革新形成合力。\n依次填入划横线部分最恰当的一项是：","options":{"A":"核心 事必躬亲","B":"系统 脚踏实地","C":"特殊 持之以恒","D":"浩大 厚积薄发"},"answer":"B","explanation":"第一空，根据“牵涉供应端和消费端全链条”以及“不仅需要······也需要······”可知，低碳转型是一个涉及方方面面的工程，故横线处应体现涉及范围广的含义，B项“系统”指有条理的、成体系的，D项“浩大”指规模巨大，均符合文意，保留。A项“核心”指中心，主要部分，C项“特殊”指与别的事物不同，文段强调的是涉及范围广，均与文意不符，排除。\n第二空，根据“夏天把空调温度调高一些，尽量购买节能型用品，积极参与义务植树活动，每个人都为地球的‘凉热’出一份力”可知，低碳行动需要我们每个人都付出切实的行动，B项“脚踏实地”比喻做事踏实认真，符合文意，当选。D项“厚积薄发”形容只有准备充分才能办好事情，文段强调每个人切实去做而非事先准备，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《科技创新助力碳中和》","no":29,"missingImage":false},{"type":"question","qid":"5102253","cat":"逻辑填空","stem":"在斗争中诞生、在斗争中发展、在斗争中壮大，一百年来，不怕牺牲、英勇斗争的伟大精神贯穿于革命、建设、改革各个时期，        成我们党历经百年风雨而风华正茂、饱经磨难而            的精神基因。\n依次填入划横线部分最恰当的一项是：","options":{"A":"锤炼 永不言败","B":"锻造 百折不挠","C":"磨炼 九死不悔","D":"熔铸 生生不息"},"answer":"D","explanation":"第一空，搭配“精神基因”，且根据文意可知，横线处表达伟大精神要转变成内在的精神基因之意，B项“锻造”指一种金属加工方法，含有打造之意，D项“熔铸”指熔化并铸造，均符合文意，且与“精神基因”搭配恰当，保留。A项“锤炼”指锻炼，磨炼，常搭配“意志”“语言”等，C项“磨炼”指在艰难困苦的环境中锻炼，常搭配“本领”“才干”等，均与“精神基因”搭配不当，排除。\n第二空，搭配“精神基因”，根据文意可知，横线处表达历经磨难而精神基因一直存在之意，D项“生生不息”指事物不断地产生、发展，符合文意，当选。B项“百折不挠”指无论受多少挫折都不退缩，形容意志坚强，与文意无关，排除。\n故正确答案为D。\n【文段出处】南方日报《不怕牺牲 英勇斗争——三论伟大建党精神》","no":30,"missingImage":false},{"type":"question","qid":"5102182","cat":"逻辑填空","stem":"奋斗者永远是年轻的。青春与否，无关乎年龄，而在于心境。用奋斗        时代，用拼搏定义未来，这不仅是年轻人该有的追求，更是每个与时代同行者应有的姿态。奋斗不息，青春不朽。让我们以梦为马，不负韶华，在奋勇搏击中放飞青春梦想，在            中激扬青春力量。\n依次填入划横线部分最恰当的一项是：","options":{"A":"礼赞 砥砺前行","B":"拥抱 继往开来","C":"顺应 一往无前","D":"讴歌 风雨兼程"},"answer":"A","explanation":"第一空，搭配“奋斗”“时代”，且文段感情色彩偏积极。A项“礼赞”指怀着敬意地赞扬，B项“拥抱”指为表示亲近和爱意而互相搂抱，均搭配恰当且符合文段感情色彩，保留。C项“顺应”指顺从，适应，为中性词，与文段感情色彩不符，排除；D项“讴歌”指用歌唱、言辞等赞美，与“奋斗”搭配不当，排除。\n第二空，横线处成语与“奋勇搏击”构成并列，强调面对困难努力拼搏，勇敢向前。A项“砥砺前行”指经历磨炼，克服困难，往前进步，符合文意，当选。B项“继往开来”指继承前人的事业，开辟未来的道路，文段并未提及继承前人的事业，与文意不符，排除。\n故正确答案为A。\n【文段出处】人民网《在奋勇搏击中放飞青春梦想》","no":31,"missingImage":false},{"type":"question","qid":"5102185","cat":"逻辑填空","stem":"党的十八大以来，习近平总书记始终            、以上率下，带头严格执行中央八项规定，以行动作无声的号令、以身教作执行的榜样，为全党改进作风提供了强大动力。从八项规定到八项规定实施细则，研究同样的内容并进一步深化细化，释放出            将作风建设进行到底的鲜明信号。\n依次填入划横线部分最恰当的一项是：","options":{"A":"高瞻远瞩 一如既往","B":"以身作则 一以贯之","C":"克己奉公 久久为功","D":"身先士卒 驰而不息"},"answer":"B","explanation":"第一空，根据顿号可知，横线处与“以上率下”构成同义并列，语义相近，“以上率下”意为以自己为表率，作榜样给下属看。B项“以身作则”意为用自己的行动做出榜样，D项“身先士卒”指领导带头，走在群众前面，置于此处均可体现以自己为表率之意，保留。A项“高瞻远瞩”比喻目光远大，C项“克己奉公”意为克制自己的私心，一心为公，均与文意不符，排除。\n第二空，根据横线前“从八项规定到八项规定实施细则，研究同样的内容······”可知，横线处应体现出以同样的事物贯穿始终之意，B项“一以贯之”意为用一种思想或理论贯穿于各类事物之中，置于此处可体现出将作风建设贯穿始终之意，符合文意，当选。D项“驰而不息”意为奔驰向前不停息，与文意不符，排除。\n故正确答案为B。\n【文段出处】《为了海晏河清、朗朗乾坤》","no":32,"missingImage":false},{"type":"question","qid":"5102360","cat":"逻辑填空","stem":"衡量民众对美好生活需要的满足状况，获得感无疑是一个重要的社会心态        。而获得感的        ，需要个体的持续努力，也需要政府和社会的赋能。共同富裕、教育减负、生育友好等国家战略和政策，都是有效的赋能方式，既可以直接        社会成员的负担，也有助于培养更加朝气蓬勃的社会生态，进而从体制机制上保障获得感的可持续性。\n依次填入划横线部分最恰当的一项是：","options":{"A":"标志 获取 减少","B":"标准 增强 释放","C":"指标 提升 减轻","D":"准绳 巩固 降低"},"answer":"C","explanation":"第一空，根据文意可知，横线处所填词语可以起到“衡量民众对美好生活需要的满足状况”的作用，B项“标准”指衡量事物的准则，C项“指标”指衡量目标的参数或预期中打算达到的指数、规格、标准，D项“准绳”比喻言论、行动等依据的原则和标准，三者均符合文意，保留。A项“标志”指表明特征的记号或事物，无法起到衡量的作用，排除。\n第二空，搭配“获得感”，根据“个体的持续努力”“保障获得感的可持续性”可知，横线处所填词语应体现获得感越来越多之意。B项“增强”指在原有的基础上更进一步，C项“提升”指提高，二者均符合文意且搭配恰当，保留。D项“巩固”指使牢固，强调原有基础的保持，不能体现变多之意，排除。\n第三空，搭配“负担”，C项“减轻”指减少重量或程度，与“负担”搭配恰当，当选。B项“释放”指把所含的能量或物质放出来，常搭配“能量”“压力”“潜能”等，与“负担”搭配不当，排除。\n故正确答案为C。\n【文段出处】光明网《以青春之奋斗创造青年之获得》","no":33,"missingImage":false},{"type":"question","qid":"5102181","cat":"逻辑填空","stem":"中国空间站名为“天宫”，是一个长期在近地轨道运行的空间实验室。这个极具中国        的名字，不仅蕴含了希望航天员在太空工作生活得更为        的愿望，更        着中国人遨游太空的浪漫情怀和不懈探索的精神。\n依次填入划横线部分最恰当的一项是：","options":{"A":"韵味 舒适 寄寓","B":"意蕴 舒服 涵盖","C":"特色 惬意 象征","D":"智慧 适意 承载"},"answer":"A","explanation":"第一空，根据文意可知，横线处所填词语意在表达“天宫”这一名字极具中国传统文化特点。A项“韵味”指情趣、趣味，B项“意蕴”指内在的意义、含义，C项“特色”指事物所表现的独特的色彩、风格，均符合文意，保留。D项“智慧”指聪明才智，文中并非表达这个命名体现了聪明才智，与文意不符，排除。\n第二空，根据“蕴含了希望航天员在太空工作生活得更为······的愿望”可知，横线处所填词语意在表达希望航天员生活得较为满意。A项“舒适”指舒服安适，B项“舒服”指身心感到轻松愉快，C项“惬意”形容心情感到愉快畅快，愉悦、舒畅，均符合文意，保留。\n第三空，搭配“情怀”和“精神”，且由文意可知，“天宫”这一名字体现着“浪漫情怀和不懈探索的精神”。A项“寄寓”指寄托，即把理想、希望、感情放在（某人身上或某种事物上），符合文意，当选。B项“涵盖”指包容，覆盖，无法准确表达出“天宫”这一名字与“情怀”“精神”之间的关系，与文意不符，排除；C项“象征”指用具体事物表现某些抽象意义，如“玫瑰花象征着爱情”，不能将“名字”这一抽象概念作为主语进行搭配，排除。\n故正确答案为A。\n【文段出处】安化县人民政府网《天宫空间站——太空闪耀中国智慧》","no":34,"missingImage":false},{"type":"question","qid":"5102184","cat":"逻辑填空","stem":"有统计表明，由听力障碍者组成的家庭中，约90%育有听力正常子女。他们因出生于听障家庭，常常处在听障、健听两个世界的边缘地带。他们可能既无法真正        听障者世界，也不被听人世界完全        。他们面临普通人无法想象的挫折和压力，比如语言        迟缓、人际沟通障碍等，社会应给予他们更多的关注。\n依次填入划横线部分最恰当的一项是：","options":{"A":"融入 接纳 习得","B":"汇入 接受 发展","C":"进入 纳入 获取","D":"深入 接收 运用"},"answer":"A","explanation":"第一空，搭配“听障者世界”，横线前“他们”指代听力障碍者家庭中的听力正常子女，根据前文“常常处在听障、健听两个世界的边缘地带”可知，他们对于这两个世界都无法融合进来，A项“融入”、C项“进入”、D项“深入”均搭配恰当且符合文意，保留。B项“汇入”侧重空间上的汇合进入，与“听障者世界”搭配不当，排除。\n第二空，搭配“听人世界”，且根据前后的并列关系可知，此处表示不被听人世界所接受，A项“接纳”、C项“纳入”均搭配恰当且符合文意，保留。D项“接收”指收受，文段强调的是接受的态度而非接收的具体行为，与文意不符，排除。\n第三空，搭配“语言”，A项“习得”指学习得到，置于此处搭配恰当且符合文意，当选。C项“获取”表示获得、取得，一般不与“语言”搭配，排除。\n故正确答案为A。\n【文段出处】光明日报《倪兰：听障家庭中的健听子女》","no":35,"missingImage":false},{"type":"question","qid":"5102218","cat":"片段阅读","stem":"叙事医学是一种具有叙事能力的医学实践，而叙事能力是指能够吸收、解释并被疾病的故事所感动的能力。这种能力有助于临床医生在医疗活动中提升对患者的共情能力、职业精神、亲和力和自我行为的反思。叙事医学要求医生在临床决策过程中倾听病人的叙事，关注家属等社会关系人的叙事。这样，医生才可以获取更多有助于临床决策的信息，才能作出正确的疾病诊断，提出最适合病人的决策建议，最后和患方共同作出首先保障病人利益，又能平衡各方权益的诊疗选择。\n这段文字意在说明：","options":{"A":"叙事医学有助于医患共同决策","B":"叙事医学可化解当下医疗分歧","C":"叙事医学可避免技术至上误区","D":"叙事医学有利于当前医学实践"},"answer":"A","explanation":"文段开篇阐释“叙事医学”的定义，紧接着说明其对于临床医生在医疗活动中有诸多提升，接下来介绍“叙事医学”对医生在临床决策过程中的相关要求，最后通过“这样”总结前文，进一步指出“叙事医学”在诊疗过程中的积极意义。文段尾句点明主旨，强调“叙事医学”有助于医生和患方共同作出诊疗选择，对应A项。\nB项“医疗分歧”、C项“技术至上”文段并未提及，无中生有，均排除；\nD项，“医学实践”对应首句话题引入部分，非重点，且“有利于当前医学实践”表述不明确，排除。\n故正确答案为A。\n【文段出处】期刊《叙事医学助力医患共同决策》","no":36,"missingImage":false},{"type":"question","qid":"5102363","cat":"片段阅读","stem":"铝是一种很容易发生化学反应的物质，即使只放置在空气中，也会与氧发生反应，在表面形成氧化铝层。这种与氧发生反应、被其他物质夺走电子的化学反应称为“氧化”；与此相反，从其他物质夺取电子的化学反应则称为“还原”。普通金属与氧发生反应后会生锈（氧化物等的化合物）而被腐蚀，但是，如果像铝那样整个表面很快就覆盖上一层膜的话，膜下面的铝就不能再与氧发生反应。也就是说，多亏了铝具有容易发生化学反应（易氧化）这一性质，所以才能防止下层的铝继续氧化（生锈）。\n从这段文字可以推出：","options":{"A":"铝容易氧化，但膜不容易生锈","B":"铝虽容易氧化，但也容易还原","C":"铝既容易生锈，也不容易生锈","D":"铝不仅容易氧化，还容易生锈"},"answer":"C","explanation":"A项，根据“如果像铝那样整个表面很快就覆盖上一层膜的话，膜下面的铝就不能再与氧发生反应”可知，是“膜下面的铝”不容易生锈，而不是“膜”不容易生锈，偷换概念，排除；\nB项，根据“从其他物质夺取电子的化学反应则称为‘还原’”可知，文段仅提及还原反应，但是并未提及铝的还原，无中生有，排除；\nC项，根据“铝是一种很容易发生化学反应的物质······”“如果像铝那样整个表面很快就覆盖上一层膜的话，膜下面的铝就不能再与氧发生反应”以及文意可知，铝容易发生氧化反应，即“生锈”，但又因为铝氧化后表面覆盖一层膜，使得膜下的铝不容易生锈，因此“铝既容易生锈，也不容易生锈”，表述正确，当选；\nD项，根据“如果像铝那样整个表面很快就覆盖上一层膜的话，膜下面的铝就不能再与氧发生反应······所以才能防止下层的铝继续氧化（生锈）”可知，膜下面的铝具有不易生锈的特点，表述错误，排除。\n故正确答案为C。","no":37,"missingImage":false},{"type":"question","qid":"5102263","cat":"片段阅读","stem":"制造与服务融合是智能制造的重要内容之一，服务要素渗透到制造各个环节中形成了生产性服务与制造服务化。本文从工业互联网的商业视角、使用视角、功能视角、实现视角建立了制造与服务融合中虚拟逻辑与实体活动交互的技术体系，有针对性地提出了生态位驱动、供应链驱动、大数据驱动、物联网驱动的制造与服务融合方法。本文构建的制造与服务融合技术体系，深化了工业互联网在制造业与服务业中的应用，为数字经济中制造服务产业的技术创新奠定了基础。\n如果这是一篇论文的摘要，那么这篇论文的标题最有可能是：","options":{"A":"数字经济中制造与服务融合的协同机制","B":"四轮驱动下的制造与服务融合技术体系","C":"工业互联网在智能制造中的体系化应用","D":"基于工业互联网的制造与服务融合技术"},"answer":"D","explanation":"文段开篇指出制造与服务融合是智能制造的重要内容之一，并由此形成了生产性服务与制造服务化。随后指出本文从工业互联网的多重视角，建立了制造与服务融合中虚拟逻辑与实体活动交互的技术体系，提出了多要素驱动的制造与服务融合方法，尾句作进一步阐释，指出基于工业互联网的制造与服务融合技术体系带来了诸多利好。故文段主要讨论的话题为“工业互联网”与“制造与服务融合技术”，对应D项。\nA、B两项，均缺少文段核心话题“工业互联网”，排除；\nC项，强调“工业互联网”在智能制造中的应用，缺少文段另一核心话题“制造与服务融合技术”，排除。\n故正确答案为D。\n【文段出处】万方智搜《基于工业互联网的制造与服务融合技术》","no":38,"missingImage":false},{"type":"question","qid":"5102385","cat":"片段阅读","stem":"进入数字经济时代，数据成为一种重要生产要素，是国家核心战略资源和社会重要财富。2021年世界互联网大会乌镇峰会发布的《中国互联网发展报告2021》显示，2020年中国数字经济规模达到39.2万亿元，占GDP比重达38.6%，保持9.7%的高位增长速度，成为稳定经济增长的关键动力。在数字经济时代，安全是前提，更是基座。确保数据安全成为进一步激发数字经济活力、保障数字经济健康发展的基础手段。\n接下来最不可能讲的是：","options":{"A":"保障数据安全的重要性","B":"多措并举保障数据安全","C":"通过立法保障数据安全","D":"全链条、全生命周期、全场景保护数据安全"},"answer":"A","explanation":"文段开篇指出在数字经济时代数据的重要性，接下来列举相关数据加以论证，紧接着指出在数字经济时代安全很重要，最后尾句强调确保数据安全的重要性，故接下来应该围绕文段最后论述的核心话题“确保数据安全”展开论述，即具体如何确保数据安全。A项“重要性”在文段尾句已经提到，接下来不会重复讲述，当选。\nB项“多措并举”、C项“立法”、D项“全链条、全生命周期、全场景保护”均是对策表述，接下来有可能讲述，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《数据安全怎么保障》","no":39,"missingImage":false},{"type":"question","qid":"5102219","cat":"片段阅读","stem":"人脸识别的相关应用需要公民肖像做支撑，因此，肖像权是人脸识别过程中最有可能受到侵害的权利。在人们看来，人脸识别当然是识别人脸。但实际上，人脸识别图像上显示的是人脸，不过后台能够看见的画面已不局限在人脸范围，这样的人脸识别采集图像，的确有“说话不算数”之嫌。进一步说来，如此人脸识别的App在法律上也涉嫌越权或者侵权。人脸识别只能采集公民主动提供人脸的图像信息，一旦采集范围扩大，将人脸周围的图像、公民所处的环境、正在从事的行为等信息进行采集，将侵犯公民不愿暴露的隐私。\n下列选项与文段意思不符的是：","options":{"A":"扩大人脸识别采集范围有可能侵害公民隐私权","B":"摄像头采集人脸周围的图像扩大了采集的范围","C":"公民应主动提供人脸的图像信息并享有知情权","D":"公民肖像权在人脸识别过程中最有可能受侵害"},"answer":"C","explanation":"A项，根据文段“一旦采集范围扩大，将人脸周围的图像、公民所处的环境、正在从事的行为等信息进行采集，将侵犯公民不愿暴露的隐私”可知，说法正确，排除；\nB项，根据文段“不过后台能够看见的画面已不局限在人脸范围”“一旦采集范围扩大，将人脸周围的图像······将侵犯公民不愿暴露的隐私”可知，采集人脸周围的图像属于扩大采集范围，说法正确，排除；\nC项，根据文段“人脸识别只能采集公民主动提供人脸的图像信息”可知，人脸识别的信息获取来源由公民主动提供，文段并未要求公民主动提供，偷换概念，当选；\nD项，根据文段“因此，肖像权是人脸识别过程中最有可能受到侵害的权利”可知，说法正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明网《人脸识别只能识别人脸》","no":40,"missingImage":false},{"type":"question","qid":"5102260","cat":"片段阅读","stem":"目前，牙科医生治疗受损牙齿使用的修复物由人造材料制成，而固定修复物所用的商业用胶，在性能和化学组成方面与天然牙组织——牙质有很大不同。因此，修复物与真牙结合得不太好，有时甚至会脱落。天然羟基磷灰石存在于牙齿、蛋壳等组织中，在其基础上制作的新黏合剂可模拟牙质的特性和结构。为检验新黏合剂的效果，科研人员将修复物放在真牙上，部分修复物用新黏合剂固定，另一部分以商业牙科用胶固定。结果显示，新型黏合剂由于与天然牙组织高度相似，可以更牢固地黏合人造修复材料。\n下列说法与上述语段意思不符的是：","options":{"A":"类似牙齿的天然材料可治疗牙齿受损部分","B":"蛋壳中提取的羟基磷灰石可制成牙科黏合剂","C":"新型黏合剂与天然牙组织的特性和结构相似","D":"商业牙科用胶在固定牙科修复物时的黏性比不上新型黏合剂"},"answer":"A","explanation":"A项，根据文段首句“牙科医生治疗受损牙齿使用的修复物由人造材料制成，而固定修复物所用的商业用胶······”以及“天然羟基磷灰石存在于牙齿、蛋壳等组织中，在其基础上制作的新黏合剂可模拟牙质的特性和结构”可知，用来治疗牙齿受损的是修复物，为人造材料制成，只有固定修复物的胶可以是天然物质合成，因此“类似牙齿的天然材料”应指的是起到黏合、固定作用的新黏合剂，并不能起到“治疗”作用，偷换概念，当选；\nB项，根据文段中“天然羟基磷灰石存在于牙齿、蛋壳等组织······模拟牙质的特性和结构”可知，表述正确，排除；\nC项，根据文段中“天然羟基磷灰石······制作的新黏合剂可模拟牙质的特性和结构”可知，新型黏合剂与天然牙组织有类似的特性和结构，表述正确，排除；\nD项，根据文段中“为检验新黏合剂的效果······结果显示，新型黏合剂由于与天然牙组织高度相似，可以更牢固地黏合人造修复材料”可知，新型黏合剂的黏合效果更好，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】光明网《蛋壳提取物 可制备牙科黏合剂》","no":41,"missingImage":false},{"type":"question","qid":"5102256","cat":"片段阅读","stem":"在人口老龄化趋势加快和经济社会快速转型的背景下，社会适老化改造已经到了刻不容缓的地步。根据第七次全国人口普查数据，我国60岁及以上老年人口达2.6亿，占全国总人口的18.7%，且老年人口规模还在持续快速增长。但我国城乡住宅普遍存在“不适老”的问题，大部分老旧小区未安装电梯和设置无障碍坡道。此外，大多数老年人因为不会使用智能手机，在出行、就医、消费等方面遭遇了许多不便。老年人口的基本生活需要与社会“不适老”之间的矛盾已经十分突出。\n在此段之前最可能讲的是：","options":{"A":"推进社会适老化改造是解决老年人生活不便的当务之急，也是社会文明进步的重要标志","B":"养老问题已成为社会关注的焦点，适老化成为当下的社会热词","C":"要转变认知观念，提升全社会的适老化意识","D":"全社会应共同努力，加大适老化改造的力度"},"answer":"B","explanation":"本题为接语选择题的变形，此段之前论述的内容应与文段话题一致，逻辑衔接恰当。文段开篇指出在当前的背景下，社会适老化改造刻不容缓，接着通过具体数据指出我国老年人口数量多、占比大且持续快速增长，后文在转折后通过“此外”引导的并列结构，从“住宅”和“智能手机”两个方面阐述了我国社会“不适老”的表现，指出老年人口的基本生活需要与社会“不适老”之间的矛盾已经十分突出。整个文段先强调“社会适老化改造”已刻不容缓，后分析“社会适老化改造”的原因，即当前社会存在“不适老”的情况，故前文应提出“社会适老化”的话题，对应B项。\nA项，提到推进社会适老化改造可以解决老年人生活不便的问题，文段在最后提及老年人生活不便的情况，故A项与文段末尾话题的衔接更恰当，更适合放在文段之后论述，排除；\nC、D两项，均为“社会适老化改造”的具体对策，应放在文段之后论述，排除。\n故正确答案为B。\n【文段出处】光明日报《构建老年友好型社会须推进适老化改造》","no":42,"missingImage":false},{"type":"question","qid":"5102254","cat":"片段阅读","stem":"实现技术要素高效配置是高标准市场体系建设的战略使命。技术要素市场化改革为建设高标准市场体系带来内生动力。发展完善技术要素市场，对现有市场体系提出了更高要求，例如需要更加健全的产权保护制度，更加公平的市场竞争环境，更为成熟的劳动力、资本要素市场以及更加包容的市场监管。此外，由于市场管理与创新管理的部门分割，技术要素市场化改革必然要求高标准市场体系建设要着力解决深层次的体制机制障碍、更加有效地统筹市场体系与创新体系的关系、协调科技与经济社会发展的关系。\n这段文字的中心观点在于说明：","options":{"A":"科技与经济社会发展的关系","B":"技术要素与高标准市场体系的关系","C":"高标准市场体系与创新体系的关系","D":"技术要素对市场体系提出了更高要求"},"answer":"B","explanation":"文段首先指出实现技术要素是高标准市场体系建设的战略使命，接着介绍技术要素市场化对高标准市场体系的作用及要求，并举例说明，然后通过“此外”引导并列，指出技术要素市场化改革对高标准市场体系的要求，故文段的主题词是“技术要素”与“高标准市场体系”，强调的重点是技术要素与高标准市场体系的关系，对应B项。\nA项，“科技与经济社会发展的关系”对应尾句的一部分，表述片面，且无主题词“技术要素”与“高标准市场体系”，排除；\nC项，文段并未提及“高标准市场体系与创新体系的关系”，无中生有，且无主题词“技术要素”，排除；\nD项，对应“此外”前的内容，表述片面，且文段主题词是“高标准市场体系”而非“市场体系”，主题词范围扩大，排除。\n故正确答案为B。\n【文段出处】《技术要素市场如何培育》","no":43,"missingImage":false},{"type":"question","qid":"5102364","cat":"语句表达","stem":"热水和冷水混在一起会变成温水。但是，温水不会自发分成热水和冷水。热量只能从热的物体向冷的物体单向传递，这一原理称为“热力学第二定律”。如果用分子这一微观视角看这一定律，物质的温度取决于其中沿着随机方向运动的分子的速度。分子运动速度快就会变热，速度慢就会变冷。但是数量庞大的分子运动时，各个分子的运动速度不是固定的。说到底，温度只不过是以不同速度运动的分子的平均速度罢了。因此，如果能够从以各种速度运动的分子中，只筛选出运动速度快的分子，从理论上说，就应该能                    。\n填入划横线处最恰当的句子是：","options":{"A":"从温水中单独提取出热水","B":"从温水中自发分出冷热水","C":"不使用能量就把冷水烧开","D":"不通过传递就把热水变温"},"answer":"A","explanation":"横线出现在结尾，且为尾句的分句，故需依据横线前内容以及横线所在尾句内容进行分析。文段开篇指出，温水不会自发分成热水和冷水，并解释原因。随后指出物质的温度取决于分子的速度，分子速度快就会变热，速度慢就会变冷，并以“说到底”进行总结，指出温度是分子的平均速度。“因此”基于前文得出结论，指出若能筛选出运动速度快的分子，就可以达到某种目的。结合前文可知，运动速度快意味着温度高，“筛选出运动速度快的分子”意味着提取出了温度高的部分，A项“提取出热水”符合文意，且呼应首句提出的问题，当选。\nB项，“筛选出运动速度快的分子”意味着提取出温度高的部分，而非“分出冷热水”，排除；\nC项，文段没有体现出“不使用能量”，排除；\nD项，“筛选出运动速度快的分子”意味着提取出温度高的部分，而非将热水变温，排除。\n故正确答案为A。","no":44,"missingImage":false},{"type":"question","qid":"5102220","cat":"片段阅读","stem":"南极动物的食物链极有特色，有人这样形容：在南极生活的动物从食物链上划分只有三个可能：它是磷虾，它吃磷虾或它捕食吃磷虾的动物。这个说法简单清晰地揭示了南极磷虾在南极生物圈承担的关键角色——这里几乎所有的动物都直接或间接地依赖磷虾生存。有些动物的食谱只有磷虾，没有其他替代品，而且它们生长繁殖、捕猎与迁移的时间和地点均与磷虾的生长状态相耦合。\n由上述材料无法推出：","options":{"A":"南极磷虾是南极生物链中至关重要的一个环节","B":"大多南极动物进化出以磷虾为中心的生存方式","C":"部分南极动物的繁殖期与磷虾的丰产期相一致","D":"企鹅数量的下降主要由于磷虾数量的减少所致"},"answer":"D","explanation":"A项，根据“这个说法简单清晰地揭示了南极磷虾在南极生物圈承担的关键角色——这里几乎所有的动物都直接或间接地依赖磷虾生存”可以推出，南极磷虾在南极生物圈发挥关键作用，表述正确，排除；\nB项，根据“在南极生活的动物从食物链上划分只有三个可能：它是磷虾，它吃磷虾或它捕食吃磷虾的动物”“这里几乎所有的动物都直接或间接地依赖磷虾生存”可以推出，大多南极动物进化出以磷虾为中心的生存方式，表述正确，排除；\nC项，根据“而且它们生长繁殖、捕猎与迁移的时间和地点均与磷虾的生长状态相耦合”可以推出，部分南极动物的繁殖期与磷虾的丰产期相一致，表述正确，排除；\nD项，文段未提及“企鹅数量下降”的原因，也未涉及“磷虾数量的减少”，故属于无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《从南极磷虾看生命的意义》","no":45,"missingImage":false},{"type":"question","qid":"5102257","cat":"片段阅读","stem":"在高空气球技术取得进展的同时，航空和航天技术也迎来了飞速发展时期。在大气层内，飞机是更便捷的飞行工具，而对于那些需要在大气层之上进行的科学研究，卫星提供了更加理想的环境。然而，高空气球这种历久弥新的工具却没有走出人们的视野，目前仍然是重要的科学研究工具。\n这段文字的核心观点是：","options":{"A":"高空气球在科学研究中有独特优势","B":"高空气球比飞机和卫星更重要","C":"古老的高空气球仍在不断发展","D":"高空气球可用作科学观测平台"},"answer":"A","explanation":"文段开篇指出在高空气球技术发展的同时，航空和航天技术也在发展，随后通过“飞机”和“卫星”具体介绍了航空航天技术的发展应用，尾句“然而”引导转折，强调高空气球依然是重要的科学研究工具，对应A项。\nB项，“比飞机和卫星更重要”文段并未提及，无关对比，排除；\nC项，“高空气球仍在不断发展”对应文段首句，为话题引入部分的内容，非重点，排除；\nD项，“科学观测平台”文段并未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】北晚在线《高空气球打造新型天文望远镜，只花千分之一的钱，做和哈勃望远镜同样的事》","no":46,"missingImage":false},{"type":"question","qid":"5102221","cat":"片段阅读","stem":"我国全年降水量、河川径流量60％～80％集中在汛期；同时，降水和径流的年际变化显著，最大和最小年降水量南方地区相差2～4倍，北方地区相差3～6倍，径流量最大和最小年份相差10～15倍。天然来水过程与需水过程不匹配，很多地区出现旱涝急转，水资源开发利用难度加大。随着城镇化水平不断提升，人口和经济要素进一步向城市集聚。20世纪80年代初，全国人口城镇化率仅30%，2020年已达63.8%。城市群尤其中心城市水资源保障问题将日益突出。\n这段文字意在说明：","options":{"A":"我国降水和河川径流年际变化较大","B":"我国大部分地区水资源年内分配不均","C":"我国北方地区水资源衰减态势可能会进一步持续","D":"我国水资源分布失衡、供需矛盾突出，与自然和人为因素有关"},"answer":"D","explanation":"文段开篇指出我国全年降水量和河川径流量大部分集中在汛期，且不同年份的变化显著，天然来水过程与需水过程不匹配，接着又指出，随着城镇化水平不断提升，人口和经济要素向城市集聚，这种人为的因素也导致了水资源保障问题日益突出。因此，文段为没有标志的并列结构，前半部分指出水资源供需矛盾的自然因素，后半部分指出人为因素，对应D项。\nA、B两项，均对应文段关于“水资源供需矛盾的自然因素”，表述片面，排除；\nC项，“北方地区水资源衰减态势”文段未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】光明日报《院士专家把脉我国水资源“家底”——水，如何平衡发展之重》","no":47,"missingImage":false},{"type":"question","qid":"5102204","cat":"片段阅读","stem":"目前，水和肥料都没有在农业中得到最佳使用，传统的植物栽培方法，使大部分水和化学物质，穿过土壤“溜过”根部，与地下水混合。为此，全球农业科技工作者都在寻找可以解决问题的新材料。某大学科研人员开发出一种聚合物水凝胶，该凝胶可作为土壤的“智能”添加剂，有助于避免土壤污染，显著减少用水量并改善植物对肥料的吸收。该研究员说，新研发的水凝胶能够在下雨或灌溉时储存大量水分，然后随着土壤变干缓慢释放。同时，这种水凝胶完全可以生物降解，也就是说，经过一段时间后，它们会“溶解”在土壤中，毫无踪迹。\n这段文字意在说明：","options":{"A":"根部肥料往往远离根部未发挥其肥料作用","B":"聚合物水凝胶可减少土地用水并避免污染","C":"大量使用化学肥料使土壤状况被破坏","D":"新研发的水凝胶在土壤中可完全降解"},"answer":"B","explanation":"文段开篇介绍传统的植物栽培方法存在不足，水和肥料都没有得到最佳使用，接着通过“为此”指代前文进行总结，指出某大学科研人员开发出一种聚合物水凝胶，并指出该凝胶既有助于避免土壤污染，又能减少用水量及改善植物对肥料的吸收。后文围绕聚合物水凝胶的作用进行具体解释说明。故文段重在强调聚合物水凝胶具有避免土壤污染和减少用水量的作用，对应B项。\nA项，“根部肥料往往远离根部”对应前文传统的栽培方法的部分内容，文段重点强调新材料聚合物水凝胶，排除；\nC项，文段并未论述“大量使用化学肥料”对于“土壤状况”的危害，无中生有，排除；\nD项，“土壤中可完全降解”对应“同时”之后解释说明的内容，非重点且表述片面，排除。\n故正确答案为B。\n【文段出处】《新凝胶可减少土地用水并避免污染》","no":48,"missingImage":false},{"type":"question","qid":"5102208","cat":"语句表达","stem":"一国文明通常要通过典籍、实物和活态三条渠道完成传承。在传统社会中学者关注最多的是前二者，而很少会注意到活态传承。事实上，当一个国家最重要的文明——非物质文化遗产，因其内容、形式、工艺过于复杂，                    。传承人也凭借着他们的“活态传承”，为中华文明的延续作出了属于自己的贡献。\n填入划横线部分最恰当的句子是：","options":{"A":"要想通过典籍将非物质文化遗产代代传承，几乎是不可能的","B":"通过古人的器物、遗址，同样能认识祖先创造的辉煌的人类文明","C":"用典籍与实物无法传承时，民间常用口耳相传等方式进行“活态传承”","D":"典籍传承有明显短板，中国典籍大多记载官方历史或文人创作，民间文化鲜有提及"},"answer":"C","explanation":"横线在文段中间，需考虑与前后文的衔接。横线前介绍国家文明的传承需要通过典籍、实物和活态三条渠道，而活态传承相较前两种更缺少学者关注，接着通过转折词“事实上”指出非物质文化遗产的内容、形式、工艺很复杂。横线后通过“也”指出传承人通过“活态传承”为中华文明的延续作出贡献。横线前后均围绕“活态传承”展开论述，因此横线处应体现“活态传承”这一核心话题，对应C项。\nA、B、D三项均偏离文段核心话题“活态传承”，排除。\n故正确答案为C。\n【文段出处】《非遗传承人：中华文明的另类传承者》","no":49,"missingImage":false},{"type":"question","qid":"5102176","cat":"片段阅读","stem":"人们一般都喜欢追逐日出或日落景观，但绝大部分人可能没意识到，其实在与太阳相反一侧的天空，也隐藏着鲜为人知的景观，比如说人们能看到的两种大尺度影子景观——“山影”和“地影”。日出或日落前后，在太阳照射下，高大山峰投射出巨大阴影。此时站在该山峰的观测者观察这个阴影，阴影看起来像金字塔，这就是山影。除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏。\n对这段文字理解正确的是：","options":{"A":"大多数人不喜欢欣赏“山影”“地影”景观","B":"人们不把“山影”“地影”作为景观来欣赏","C":"“山影”和“地影”是鲜为人知的山上景观","D":"只有极少数人能发现和欣赏“山影”和“地影”"},"answer":"D","explanation":"A项，根据“除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏”可知，大部分人只是没有注意到“山影”“地影”，故“大多数人不喜欢”无中生有，排除；\nB项，根据“除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏”可知，登山家和摄影师还是会欣赏“山影”和“地影”的，表述过于绝对，排除；\nC项，根据“在与太阳相反一侧的天空，也隐藏着鲜为人知的景观······‘山影’和‘地影’”可知，“山影”和“地影”是天空中的景观，故“山上景观”表述错误，排除；\nD项，根据“除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏”可知，表述正确，当选。\n故正确答案为D。\n【文段出处】中国地理网《山影地影 只有极少数人在欣赏它们》","no":50,"missingImage":false},{"type":"question","qid":"5102258","cat":"片段阅读","stem":"长棘海星，这种像仙人球一般长满尖刺的生物，是珊瑚礁生态系统的主要捕食者。成年长棘海星的身体直径可以达到35厘米，有记录的最大个体甚至能超过75厘米。长棘海星以各类珊瑚，尤其是造礁珊瑚为食，被啃食的珊瑚只会留下白森森的外骨骼。如同肆虐于草原和农田的蝗灾一样，在全球范围内长棘海星会出现不规律的种群暴发，对珊瑚礁生态系统造成严重影响。\n这段文字没有提及长棘海星的：","options":{"A":"外形特征","B":"捕食对象","C":"种群密度","D":"破坏作用"},"answer":"C","explanation":"A项，根据“长棘海星，这种像仙人球一般长满尖刺的生物”“成年长棘海星的身体直径可以达到35厘米，有记录的最大个体甚至能超过75厘米”可知，“外形特征”文段有提及，排除；\nB项，根据“长棘海星以各类珊瑚，尤其是造礁珊瑚为食”可知，其“捕食对象”即为珊瑚，文段有提及，排除；\nC项，“种群密度”文段并未提及，无中生有，当选；\nD项，根据“如同肆虐于草原和农田的蝗灾一样，在全球范围内长棘海星会出现不规律的种群暴发，对珊瑚礁生态系统造成严重影响”可知，文段有提及“破坏作用”，排除。\n本题为选非题，故正确答案为C。\n【文段出处】中国国家地理杂志《长棘海星暴发 充满谜团的自然现象》","no":51,"missingImage":false},{"type":"question","qid":"5102207","cat":"语句表达","stem":"所有生物都拥有共同的祖先，后来经过漫长的岁月才进化成了各种各样的生物，这是进化论告诉我们的答案。过去，科学家根据生物的外表和骨骼等来推测各种生物的进化历程。但是，近年来随着DNA分析等技术的进步，发现了一些颠覆以往观点、拥有意外亲缘关系的例子。生物世界里存在许多                    。海豚、海豹和海牛虽然具有非常相似的特征，比如它们都主要生活在水里，体型为流线型等，但实际上这3种动物彼此都不是近亲。海豚和长颈鹿是近亲，而海牛和大象是近亲。\n填入划横线处最恰当的句子是：","options":{"A":"“容貌相似的亲戚”和“毫无相似之处的外人”","B":"“容貌相似的外人”和“不无相似之处的亲戚”","C":"“外表相似的外人”和“毫无相似之处的亲戚”","D":"“外表相似的亲戚”和“不无相似之处的外人”"},"answer":"C","explanation":"横线在文段中间，需考虑与前后文的衔接。横线前介绍科学家之前根据生物的外表等来推测进化历程，之后通过转折词“但是”强调发现了一些颠覆以往观点的例子。横线后指出海豚、海豹和海牛外在特征相似却不是近亲，并介绍“海豚和长颈鹿是近亲，而海牛和大象是近亲”，即强调外在特征不同却是近亲。故横线处应体现有些动物“外在特征相似却不是近亲”和“外在特征不同却是近亲”，对应C项。\nA项“‘容貌相似的亲戚’”、D项“‘外表相似的亲戚’”，均与文意相悖，排除；\nB项，“不无相似”强调的是相似，与文意相悖，且“容貌相似”表述片面，“外表和骨骼”“生活在水里，体型为流线型”不仅仅指“容貌”，排除。\n故正确答案为C。\n【文段出处】新浪《生物间意想不到的亲缘关系》","no":52,"missingImage":false},{"type":"question","qid":"5102216","cat":"片段阅读","stem":"我国宏观调控体系伴随社会主义市场经济体制改革的全面深化不断创新、完善。随着大数据、云计算、人工智能、区块链等加速创新，数字技术日益融入经济社会发展各领域全过程。数字技术不仅是数字经济发展的支撑，而且是辅助经济治理的基础。宏观经济是一个不可中断的连续进程，作为关键生产要素的数据也是动态的、系统化的，以不间断的“流”的形式存在。发挥数字技术在宏观经济治理中的作用，是创新和完善调控的重要任务，是提高调控前瞻性、针对性、有效性的重要条件。\n这段文字是一篇文章的引言，接下去作者最可能讲述的是：","options":{"A":"如何运用数字技术创新完善宏观调控","B":"如何完善宏观经济治理推动社会发展","C":"如何深度挖掘宏观经济数据资源","D":"如何让数字文明助力新发展格局"},"answer":"A","explanation":"本题为接语选择题，需通读全文，重点关注文段最后讨论的核心话题。文段开篇引出话题，即宏观调控体系在不断创新、完善。随后提出数字技术对于经济治理的重要作用，并提出宏观经济与数据均是动态的形式存在。尾句提出数字技术对于宏观调控的重要作用。根据话题一致原则，文段接下来最可能围绕“数字技术”和“宏观调控”展开论述，介绍如何通过数字技术创新和完善宏观调控，对应A项。\nB、C、D三项，均未提及文段核心话题“数字技术”，与前文无法衔接，排除。\n故正确答案为A。\n【文段出处】《善用数字技术创新宏观调控》","no":53,"missingImage":false},{"type":"question","qid":"5102206","cat":"语句表达","stem":"①因火焰的热量而变成气体\n②因此，烛芯就显得尤为重要\n③变成气体的蜡则可以在火焰中燃烧\n④液体的蜡会堆积在里面，并在烛芯中向上移动\n⑤点燃烛芯后，蜡烛的上部会因受热而熔化成碗状\n⑥蜡烛一般是由石蜡制成，但直接用火很难点燃固体蜡\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑥⑤②④①③","B":"⑥⑤④①③②","C":"⑥②⑤④①③","D":"⑥②⑤①③④"},"answer":"C","explanation":"对比选项，首句均为⑥句。\n进一步观察选项发现，应对比⑥句后面接②句还是⑤句，⑥句指出直接用火很难点燃固体蜡，②句通过“因此”得出结论，介绍烛芯的重要性，故⑥②两句可形成因果关系，构成捆绑，保留C、D两项。⑤句介绍点燃烛芯后蜡烛的变化，根据逻辑顺序，应先引入“烛芯”这一话题，再具体解释“点燃烛芯后的蜡烛变化”，故②句应在⑤句之前，排除A、B两项。\n对比C、D两项，开头均为⑥②⑤三句，区别在于④句和①③两句的先后顺序，①句指出因火焰的热量而变成气体，③句指出变成气体的蜡可以燃烧，④句介绍液体蜡的情况，根据蜡烛燃烧时“固体-液体-气体”的变化规律可知，④句应在①③两句之前，排除D项，对应C项。\n故正确答案为C。","no":54,"missingImage":false},{"type":"question","qid":"5102372","cat":"语句表达","stem":"①我国现存辽塔约有90座，其中辽宁省内就有约40座\n②辽宁辽塔的“辽”字，既有空间上的地理分布，又有时间上的历史积淀\n③辽代古塔简称辽塔，其以独特的风格造型和精美的建造艺术在中华古塔中独树一帜\n④一座座矗立在辽宁省内的辽塔，历经千年，记录着佛教在东北地区的传播流变，也成为我们窥探大辽王朝兴衰的一扇窗\n⑤契丹民族兴起于辽河河畔，辽宁省名源于辽河\n将以上5个句子重新排列，语序正确的是：","options":{"A":"③①⑤②④","B":"③⑤①②④","C":"②③①④⑤","D":"①③②⑤④"},"answer":"A","explanation":"对比选项，判断首句，①句指出我国现存辽塔的数量，②句指出辽塔中“辽”的内涵，③句引出辽塔这一话题。应先引出话题，再围绕其展开论述。故③句更适合作为首句，排除C、D两项。\n继续对比选项，寻找线索。A、B两项的区别在于③句之后接①句还是⑤句，①句围绕辽塔话题，指出现存数量，与③句话题一致，而⑤句强调辽宁省的名字来源，与③句话题不一致，故确定③①两句捆绑，锁定A项。\n故正确答案为A。\n【文段出处】《辽宁辽塔 占据全国辽塔半壁江山的古塔群》","no":55,"missingImage":false}],"count":35,"answerable":35,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"5102131","cat":"数学运算","stem":"某单位四个党史宣讲小组各有若干组员，现增加2人并重新分配，使得四个小组人数相等。此时与原先相比，第一小组人数增加10人，第二小组人数减少1人，第三小组人数增加一倍，第四小组人数减半。则原先人数最多的小组与人数最少的小组之间相差：","options":{"A":"15人","B":"21人","C":"24人","D":"32人"},"answer":"C","explanation":"设重新分配后平均每组x人，则根据题意可知：\n\u003cimg data-k=\"b1c4013d45f3\" style=\"max-width:600px\">\n由上表可得，原先四个小组总人数\u003cimg data-k=\"0834715a4b93\"> ，解得x=14。可得原先四个小组人数分别为：第一小组=x-10=4人，第二小组=x+1=15人，第三小组\u003cimg data-k=\"29a2a988c816\">人，第四小组=2x=28人。则原先人数最多的小组与人数最少的小组之间相差28-4=24人。\n故正确答案为C。","no":56,"missingImage":false},{"type":"question","qid":"5102124","cat":"数学运算","stem":"为了支持乡村教育，某市派出6名优秀教师前往该市农村的三所学校支教，一所1名，一所2名，一所3名，不同的选派方法共有：","options":{"A":"60种","B":"120种","C":"360种","D":"720种"},"answer":"A","explanation":"第一所学校需1名教师，选择情况数为\u003cimg data-k=\"5b91c783c91a\">种；第二所学校需2名教师，选择情况数为\u003cimg data-k=\"9146b0b043bc\">种，此时剩余三名教师自动去往第三所学校，故总情况数为\u003cimg data-k=\"7c769237c61f\">种。\n故正确答案为A。\n备注：本题存在歧义，题干未明确指出三所学校所需教师名额是否固定。若名额不固定，另一种解法为：先选出一所学校，派出1名教师，情况数为\u003cimg data-k=\"ff2478744ec5\">种；再选出一所学校，派出2名教师，情况数为\u003cimg data-k=\"2f7903445812\">种，此时剩余三名教师自动去往最后一所学校，故总情况数为\u003cimg data-k=\"8e543300493f\">\u003cimg data-k=\"ee8a684dac57\">种，对应C项。但现实生活中，支教名额应该是根据学校需求定好的，所以粉笔更倾向A项为正确答案。","no":57,"missingImage":false},{"type":"question","qid":"5102130","cat":"数学运算","stem":"清朝乾隆皇帝曾出上联“客上天然居，居然天上客”，纪昀以“人过大佛寺，寺佛大过人”对出下联，这副对联既可以顺读也可以逆读，被称作回文联。数学中也有类似回文数，如212、37473等，则三位数中回文数是奇数的概率为：","options":{"A":"\u003cimg data-k=\"f84d6f4c7b3d\">","B":"\u003cimg data-k=\"bec3fe75cd62\">","C":"\u003cimg data-k=\"b45d097a5b88\">","D":"\u003cimg data-k=\"ebead00e4ded\">"},"answer":"D","explanation":"根据题意三位数是回文数的情况，即百位数字和个位数字相同，且由于三位数百位数字不能为0，只能是1-9中的任意一个，十位数字可以是0-9中的任意一个，故总情况数有9×10=90种。回文数是奇数的情况，即个位数字可以是1、3、5、7、9中的一个，百位数字和个位数字相同，十位数字可以是0-9中的任意一个，故满足条件的情况有5×10=50种。则三位数中回文数是奇数的概率为\u003cimg data-k=\"46d8f83bc6eb\">。\n故正确答案为D。","no":58,"missingImage":false},{"type":"question","qid":"5102142","cat":"数学运算","stem":"某地采用传统销售模式，销售一批鸡蛋需要20天，销售一批桃子需要25天。为推动销售，当地开启县领导直播带货模式，直播带货期间，鸡蛋的销售效率提高为原来的2倍，桃子销售效率为原来的3倍；其余销售时间依然按照传统模式进行，结果两种产品同时销售完成。那么销售期间直播带货的天数为：","options":{"A":"3","B":"5","C":"8","D":"10"},"answer":"B","explanation":"除了销售时间相同，销售鸡蛋和销售桃子没有其它关系，所以二者是相互独立的，因此可赋值传统销售模式下的鸡蛋和桃子的销售效率均为1，则直播带货期间，鸡蛋销售效率为2，桃子销售效率为3。根据题意可得，该批鸡蛋总量为20×1=20，该批桃子总量为25×1=25。设销售期间直播带货的天数为x，则非直播带货的鸡蛋销售时间为\u003cimg data-k=\"dea08e5a5d68\">，非直播带货的桃子销售时间为\u003cimg data-k=\"00616aee543a\">。因为两种产品同时销售完成，其中的直播带货时间相同，那么非直播带货的时间也相同，即20-2x=25-3x，解得x=5，因此销售期间直播带货的天数为5。\n故正确答案为B。","no":59,"missingImage":false},{"type":"question","qid":"5102134","cat":"数学运算","stem":"某智能停车场泊车的泊车位置由电脑随机派位生成。现有两排车位，每排4个，有4辆不同的车需要泊车。泊车要求至少有一车与其它车不同排，且甲乙两车在同一排。则电脑可生成几种派位方式？","options":{"A":"672","B":"480","C":"384","D":"288"},"answer":"A","explanation":"根据题干“至少有一车与其它车不同排”，可分为以下两种情况：\n①其中一排停3辆车，另一排停1辆车。\n首先，从两排中选一排停放甲乙，有\u003cimg data-k=\"1f1c113b3f0c\">种情况；然后，从剩余2辆车中选1辆车与甲乙同排，有\u003cimg data-k=\"1f1c113b3f0c\">种情况；再把这3辆车停进这排的4个车位里，有\u003cimg data-k=\"cf446651f732\">种情况；最后，余下1辆车从另一排4个车位中选1个车位停放，有\u003cimg data-k=\"43cdc1150d8b\">种情况；分步用乘法，共有\u003cimg data-k=\"6b2d3ba31df4\">\u003cimg data-k=\"155e1134bba7\">种情况。\n②两排均停2辆车。\n首先，从两排中选一排停放甲乙，有\u003cimg data-k=\"1f1c113b3f0c\">种情况；然后，把甲乙停进这排的4个车位里，有\u003cimg data-k=\"f1d0cf7ddd86\">种情况；最后，把剩余的两辆车停进另一排的4个车位里，有\u003cimg data-k=\"f1d0cf7ddd86\">种情况；分步用乘法，共有\u003cimg data-k=\"9a19a2d64ef0\">\u003cimg data-k=\"154228c88795\">种情况。\n因此，电脑可生成的派位方式共有384+288=672种情况。\n方法二：本题也可以考虑逆向思维求解。总情况为甲、乙在任意一排中的2个车位泊车，其余2辆车在剩余的6个车位中随机泊车，有\u003cimg data-k=\"cede45636631\">种情况。反面情况为4辆车都在同一排泊车，有\u003cimg data-k=\"07259e6b558f\">种情况。则题干所求=总情况数-反面情况数=720-48=672种，即电脑可生成672种派位方式。\n故正确答案为A。","no":60,"missingImage":false},{"type":"question","qid":"5102155","cat":"数学运算","stem":"滑雪和滑冰是冬奥会的两大项赛事，其中高山滑雪、自由式滑雪、单板滑雪、跳台滑雪、越野滑雪和北欧两项是滑雪大项中的6个分项，短道速滑、速度滑冰和花样滑冰是滑冰大项中的3个分项。小林打算去现场观看比赛，共选择6个项目，并且每个大项不少于1个，若所有项目比赛时间均不交叉，则不同的观赛方式有：","options":{"A":"83种","B":"84种","C":"92种","D":"102种"},"answer":"A","explanation":"方法一：根据题意，要求每个大项不少于1个，即分为三类情况讨论如下：\n第一类：滑冰大项中选择1个分项，滑雪大项中选择5个分项，情况数为\u003cimg data-k=\"4df5e912ff2d\">\u003cimg data-k=\"52659307e641\">种情况；\n第二类：滑冰大项中选择2个分项，滑雪大项中选择4个分项，情况数为\u003cimg data-k=\"74d7c0a6f706\">\u003cimg data-k=\"1b43afd2b3bd\">种情况；\n第三类：滑冰大项中选择3个分项，滑雪大项中选择3个分项，情况数为\u003cimg data-k=\"08c4e57b15da\">\u003cimg data-k=\"a7e96beb39f4\">种情况；\n分类相加，即符合条件的总情况数为18+45+20=83种。\n方法二：根据题意，要求每个大项不少于1个，正面情况数较多，故从反面考虑。反面为选择的6个项目均为滑雪分项（滑冰分项仅有3个，故不可能全为滑冰项目），则反面情况为从6个滑雪分项中选择6个项目，有\u003cimg data-k=\"191427b0146b\">种情况。总的情况数为从9个分项中选择6个项目，有\u003cimg data-k=\"ca1279dc79e7\">\u003cimg data-k=\"a5d4c83f7fac\">\u003cimg data-k=\"cda5569a03c1\">种情况，故所求情况数=总情况数-反面情况数=84-1=83种。\n故正确答案为A。","no":61,"missingImage":false},{"type":"question","qid":"5102161","cat":"数学运算","stem":"为了加强环境治理和生态修复，某市派出4位专家（甲、乙、丙、丁）前往某山区3个勘探点进行环境检测，要求每个勘探点至少安排一名专家。那么甲、乙两名专家去了不同勘探点的概率是：","options":{"A":"\u003cimg data-k=\"97dceef419de\">","B":"\u003cimg data-k=\"6f9d0abe3e0f\">","C":"\u003cimg data-k=\"3ca0481893af\">","D":"\u003cimg data-k=\"a8b04cd19bab\">"},"answer":"C","explanation":"4位专家分配到3个勘探点，要求每个勘探点至少安排一名专家，则有一个勘探点需要分配2位专家。从4位专家中选择两位，有\u003cimg data-k=\"56f10476feff\">种情况，将选择的两位专家当作一个整体，与另外两位专家分别分配到3个勘探点，共有\u003cimg data-k=\"a6bfbd5c06d2\">种情况，则总情况数有6×6=36种。\n甲、乙两名专家去了不同勘探点，从正向分析情况数较多，考虑反向计算，即甲、乙两名专家去了同一勘探点。将甲、乙两名专家当作一个整体，与另外两位专家分别分配到3个勘探点，共有\u003cimg data-k=\"a6bfbd5c06d2\">种情况。即甲、乙两名专家去了同一勘探点共有6种情况。\n则所求概率\u003cimg data-k=\"4aa9059e6b84\">\u003cimg data-k=\"796f497a05fe\">\u003cimg data-k=\"a781c3abaf40\">。\n故正确答案为C。","no":62,"missingImage":false},{"type":"question","qid":"5102309","cat":"数学运算","stem":"某镇卫生院50多名医生被平均分配到13个基层诊所参与工作，其中男医生比女医生多4人。工作结束后，25％的男医生和一部分女医生继续到邻镇4个医疗点支援工作，这批人员中任意6人必有男医生，且保证必有一个医疗点的女医生多于1人。那么该卫生院到邻镇支援工作的医生共有：","options":{"A":"12人","B":"14人","C":"16人","D":"18人"},"answer":"A","explanation":"根据题意，某镇卫生院50多名医生被平均分配到13个基层诊所参与工作，医生总数为13的倍数，则医生总数只能为52人。由于男医生比女医生多4人，则男医生有\u003cimg data-k=\"d8b47d91d80b\">人，女医生有\u003cimg data-k=\"8189b4e95986\">人，分配到邻镇的男医生有28×25%=7人。要使这批人员中任意6人必有男医生，则女医生的人数应小于6人；又因有4个医疗点，且要保证必有一个医疗点的女医生多于1人，则女医生的人数应大于4人，故女医生的人数为5人。则该卫生院到邻镇支援工作的医生有7+5=12人。\n故正确答案为A。\n注：男医生人数为7人，女医生人数少于6人，则医生总人数少于13人，只有A项满足。","no":63,"missingImage":false},{"type":"question","qid":"5102162","cat":"数学运算","stem":"某方舱医院配有1000张床位，现已接收新冠确诊患者200名，并按床护比（护士数与床位数的比值）0.6：1配齐了护士人员。因疫情发展迅速，该医院又收治了700名患者，此时床护比下调为0.2：1，那么还需增加护士：","options":{"A":"80名","B":"60名","C":"40名","D":"20名"},"answer":"B","explanation":"根据最初床护比为0.6：1，可求出最初200名患者配备的护士人数为200×0.6=120名；又收治700名患者后，患者总数变为200+700=900名，按照下调后床护比为0.2：1计算，共需护士900×0.2=180名，所以需增加护士人数=180-120=60名。\n故正确答案为B。","no":64,"missingImage":false},{"type":"question","qid":"5102127","cat":"数学运算","stem":"某市举行庆典活动，将依次升空105架无人机，升空方式如下：每架无人机间距均相等，第一次升空n架，第二次升空n-1架，以此类推，最终在夜空中组成一个近似等边三角形背景的灯光秀，那么第10次升空的无人机数量是：","options":{"A":"3架","B":"5架","C":"8架","D":"10架"},"answer":"B","explanation":"根据题意可知，每次升空的无人机数量组成等差数列。又因为“组成一个近似等边三角形”，则第一次升空n架（\u003cimg data-k=\"55e3564ec1a3\">）为底边，最后一次升空的无人机在三角形的顶点上，数量为1架（\u003cimg data-k=\"488e4f8cdea0\">），且公差d＝-1。根据等差数列求和公式：\u003cimg data-k=\"fcb7d670761f\">，可得\u003cimg data-k=\"f960e1048e8f\">，解得n＝14。再根据等差数列通项公式：\u003cimg data-k=\"bd9a568a4619\">，则\u003cimg data-k=\"e1264c95e33e\">，故第10次升空的无人机数量是5架。\n故正确答案为B。","no":65,"missingImage":false},{"type":"question","qid":"5102138","cat":"数学运算","stem":"用一个长为20厘米、宽为2厘米、高为1.5厘米的长方体木料，制作一串半径最大的木珠子，不考虑制作过程中的损耗，则这串珠子的数量最多为：","options":{"A":"10个","B":"13个","C":"14个","D":"20个"},"answer":"C","explanation":"木珠子是球形的，需要从长方体木料的内部进行切割，由于长方体的高为1.5厘米，则木珠子的最大直径为长方体的高1.5厘米，即半径最大。长方体的宽为2厘米，木珠子的直径为1.5厘米，制作过程中，要令数量最多，木珠子错落摆放即满足要求。摆放过程注意不要超出长方体木料的长度，用前两个珠子的摆放作为演示：\n\u003cimg data-k=\"ae7131a34bbf\" style=\"max-width:291px\">\nAC是两个木珠子球心的连线，长度即为木珠子的直径1.5厘米，AC为斜边做直角三角形ABC，AC即两个球心间的最短距离。BC的长度为长方体的宽-木珠子的半径-B点距长方体左边的边长，且AB垂直BC，可得出B点距长方体左边的边长即A点距长方体边长的距离0.75厘米，可求BC长=2-0.75-0.75=0.5厘米，在直角三角形ABC中，利用勾股定理可以求出AB长为\u003cimg data-k=\"00851e5575b3\">厘米，即在AB所在直线上，相邻两个珠子间距（把珠子看成点）为\u003cimg data-k=\"6f3f1e3b3561\">厘米，且第一个和最后一个珠子的球心距长方体木料两端至少为0.75厘米。则制作的珠子数量=段数+1，段数\u003cimg data-k=\"e6c7a9c8511f\">\u003cimg data-k=\"3db10e46aef0\">，即分为13段，那么珠子数量最多=13+1=14个。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"5102140","cat":"数学运算","stem":"北京冬奥会期间，冬奥会吉祥物“冰墩墩”纪念品十分畅销。销售期间某商家发现，进价为每个40元的“冰墩墩”，当售价定为44元时，每天可售出300个，售价每上涨1元，每天销量减少10个。现商家决定提价销售，若要使销售利润达到最大，则售价应为：","options":{"A":"51元","B":"52元","C":"54元","D":"57元"},"answer":"D","explanation":"设“冰墩墩”纪念品售价共上涨x元，销售利润为y元。根据题意，可列方程：\u003cimg data-k=\"b6b77010028a\">，即\u003cimg data-k=\"de1f2daeae5b\">，令y=0，解得\u003cimg data-k=\"45a0f105bb26\">，\u003cimg data-k=\"c9ac4187942a\">，当\u003cimg data-k=\"0d2a839367ab\">时，总利润最大，此时售价为44+13=57元。\n故正确答案为D。","no":67,"missingImage":false},{"type":"question","qid":"5102311","cat":"数学运算","stem":"某商场为庆祝开业三周年，制作了一个长方形大蛋糕，并切成四块，如图所示。假设这个蛋糕可供350人享用，左下角那块蛋糕平均可供50人享用，右上角那块蛋糕平均可供70人，则中间最大块蛋糕平均可供多少人享用？\n\u003cimg data-k=\"665d8962f6fb\" style=\"max-width:412px\">","options":{"A":"150","B":"155","C":"175","D":"180"},"answer":"B","explanation":"假设平均每人享用蛋糕\u003cimg data-k=\"6c90394679b6\">，则蛋糕面积为\u003cimg data-k=\"68b41ba7f4ab\">，赋值蛋糕的长为35cm，宽为10cm。如下图所示：\n\u003cimg data-k=\"339b94dca085\" style=\"max-width:398px\">\n根据“左下角那块蛋糕平均可供50人享用，右上角那块蛋糕平均可供70人”可知\u003cimg data-k=\"7ac0d225fd46\">，\u003cimg data-k=\"cd51b395c516\">，根据三角形面积公式：\u003cimg data-k=\"b11a4eeb4386\">，可得：CE\u003cimg data-k=\"94811de5e6d7\">cm，BF\u003cimg data-k=\"119a449c0b20\">cm，则ED=35-10=25cm，DF=10-4=6cm，则\u003cimg data-k=\"dbd4dab2ee59\">，故\u003cimg data-k=\"ced5e0cf4afd\">，平均可供155人享用，即中间最大块蛋糕平均可供155人享用。\n故正确答案为B。","no":68,"missingImage":false},{"type":"question","qid":"5102160","cat":"数学运算","stem":"A、B两个乡镇分布于山谷两侧，山谷间有一条宽为2km的河道（如下图所示）。当地政府决定在两个乡镇间修建一条跨河公路促进旅游发展。由于架桥费用高昂，所以要求跨河公路中的桥梁路段长度最短。那么根据图中数据，从A镇前往B镇的最短距离为：\n\u003cimg data-k=\"fbdae63556cd\" style=\"max-width:600px\">","options":{"A":"17km","B":"15km","C":"19km","D":"20km"},"answer":"B","explanation":"根据题目要求桥长2km，最短距离=AB最短距离+桥长，如下图所示，将河流看成一条直线，两点之间线段最短，连接AB构成直角三角形ABC，\u003cimg data-k=\"e13154a5d51d\">km。\n\u003cimg data-k=\"ec77f8b4bd13\" style=\"max-width:600px\">\n从A镇前往B镇的最短距离=13+2=15km。\n故正确答案为B。","no":69,"missingImage":false},{"type":"question","qid":"5102158","cat":"数学运算","stem":"商家门口摆放了一把正四棱锥形（底面为正方形，侧面为四个全等的等腰三角形）的遮阳伞，第一次伞撑开到图1所示的位置，伞柄与伞骨成角\u003cimg data-k=\"480293f12b83\">为\u003cimg data-k=\"5608ab142532\">，继续撑开到如图2所示的位置，伞柄与伞骨成角\u003cimg data-k=\"da3733cc4faf\">变为\u003cimg data-k=\"c1ec48dc2933\">，那么第二次伞撑开后形成的正方形\u003cimg data-k=\"ec9e715d2932\">是第一次撑开后正方形ABCD面积的：\n\u003cimg data-k=\"bbacf5d2101a\" style=\"max-width:600px\">","options":{"A":"\u003cimg data-k=\"44cab75270c7\">倍","B":"\u003cimg data-k=\"8569e91685c6\">倍","C":"2倍","D":"3倍"},"answer":"D","explanation":"连接CQ，如图1所示，因PQ与正四棱锥的底面垂直，故三角形CPQ为直角三角形，在直角三角形CPQ中，\u003cimg data-k=\"922938a41bcb\">，故\u003cimg data-k=\"0e67ad6c2e7d\">。同理，连接\u003cimg data-k=\"8c05438d968d\">，如图2，在直角三角形\u003cimg data-k=\"2cfb12c72edb\">中，\u003cimg data-k=\"fea1eff68395\">，故\u003cimg data-k=\"62105f7e5441\">，根据\u003cimg data-k=\"80e1103df02b\"> ，\u003cimg data-k=\"b60623fa9bd7\">，且\u003cimg data-k=\"db5f1899f678\">，可得 \u003cimg data-k=\"875048db7663\">\u003cimg data-k=\"c1c5e8e84fd1\">\u003cimg data-k=\"4eb1582bfb3b\">，故第二次伞撑开后形成的正方形\u003cimg data-k=\"ec9e715d2932\">是第一次撑开后正方形ABCD面积的3倍。\n\u003cimg data-k=\"344f59bf5851\" style=\"max-width:600px\">\n故正确答案为D。","no":70,"missingImage":false}],"count":15,"answerable":15,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"5102356","cat":"图形推理","stem":"所给的四个选项中，哪一项填入问号处，不能使之呈现一定的规律性：\n\u003cimg data-k=\"d9b45c73b11a\" style=\"max-width:620px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图一、图三和图四均为多端点图形，图二为多圆相交图形，可以考虑笔画数。题干图形均为一笔画，而本题为选非题，故？处应选择不是一笔画的图形。A、B、C三项均为一笔画图形，D项为两笔画图形。只有D项不符合规律。\n本题为选非题，故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"5102250","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"ebf7a21ac326\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相同，优先考虑位置规律。观察发现，第一组图形中，第一个图形上下翻转并保留原图形后得到第二个图形，第一个图形保持不变放置在下方，然后对第一个图形分别进行上下翻转后放置在上方、顺时针旋转\u003cimg data-k=\"c16e5a8b3239\">后放置在左侧、逆时针旋转\u003cimg data-k=\"c16e5a8b3239\">后放置在右侧得到第三个图形。第二组图形应用此规律，对应B项。\n故正确答案为B。","no":72,"missingImage":false},{"type":"question","qid":"5102354","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"874a79a91648\" style=\"max-width:558px\">","options":{"A":"①②③，④⑤⑥","B":"①③⑤，②④⑥","C":"①④⑤，②③⑥","D":"①⑤⑥，②③④"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形分割明显，考虑面数量。图①⑤⑥均有6个面，图②③④均有9个面，即图①⑤⑥一组，图②③④一组。\n故正确答案为D。","no":73,"missingImage":false},{"type":"question","qid":"5102227","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"69758870f88a\" style=\"max-width:560px\">","options":{"A":"①②③，④⑤⑥","B":"①③⑤，②④⑥","C":"①④⑤，②③⑥","D":"①⑤⑥，②③④"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，且属性规律无法分为两组，考虑数量规律。题干每幅图形均为25宫格内出现的一个由黑粗线条构成的多边形封闭区域。观察发现，图①④⑤中多边形的面积相同，均占7.5个格子，图②③⑥中多边形的面积相同，均占10.5个格子。即图①④⑤为一组，图②③⑥为一组。\n故正确答案为C。","no":74,"missingImage":false},{"type":"question","qid":"5102238","cat":"图形推理","stem":"下图右框内纸盒的外表面中，不能折叠成左框内所示的纸盒的是：\n\u003cimg data-k=\"6292220c23c8\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查六面体的空间重构。将题干立体图中的面依次标注为面a、面b、面c，如下图所示。\n\u003cimg data-k=\"d7257783153e\" style=\"max-width:500px\">\nA项：选项与题干立体图一致，排除；\nB项：题干立体图中面a与面b的公共边靠近面a中云朵的底部，而选项中面a与面b的公共边靠近面a中云朵的顶部，选项与题干立体图不一致，当选；\n\u003cimg data-k=\"049365b7296c\" style=\"max-width:350px\">\nC项：选项与题干立体图一致，排除；\nD项：选项与题干立体图一致，排除。\n本题为选非题，故正确答案为B。\n备注：本题作图不严谨，C项中面b与面a的公共边所对应的图形与题干立体图有差别，云朵的细节与立体图形不同，但对比B、C两项，B项错误更加明显，因此小粉笔建议选择B项。","no":75,"missingImage":false},{"type":"question","qid":"5102202","cat":"定义判断","stem":"马兰戈尼效应，指的是表面张力不同的两种液体存在表面张力梯度，表面张力大的对其周围表面张力小的液体的拉力强，使液体从表面张力小的一边向张力大的方向流动渗透。\n根据上述定义，下列属于马兰戈尼效应的是：","options":{"A":"若干种不同的酒按密度大小依次缓慢倒进杯子，会形成分层，通过加冰块，可以加大或减小密度，分层更明显","B":"涂料配色过程中，涂料和干燥后的涂膜颜色存在细微差异，在湿膜时颜色一般比较浅，在干燥后，颜色会加深","C":"牛奶中加入几滴流体色素，没有搅拌的情况下色素相对集中，取少量洗洁精滴在色素所在位置，色素迅速往牛奶边缘扩散","D":"奶茶就是牛奶和茶叶水的充分混合，不同的奶粉和不同茶叶水搭配，产生不同风味的奶茶，而且奶粉和茶水的配比也影响奶茶口感"},"answer":"C","explanation":"第一步：找出定义关键词。\n“表面张力不同的两种液体”、“液体从表面张力小的一边向张力大的方向流动渗透”。\n第二步：逐一分析选项。\nA项：若干种不同的酒按密度大小依次缓慢倒进杯子形成分层，并没有出现流动渗透，不符合“液体从表面张力小的一边向张力大的方向流动渗透”，不符合定义，排除；\nB项：涂料和干燥后的涂膜颜色存在细微差异，在湿膜时颜色一般比较浅，在干燥后，颜色会加深，说的是涂料干燥前和干燥后的颜色差异，只出现一种液体涂料，不符合“表面张力不同的两种液体”，并且也体现不出液体之间的流动渗透，不符合“液体从表面张力小的一边向张力大的方向流动渗透”，不符合定义，排除；\nC项：牛奶中加入几滴流体色素，没有搅拌的情况下色素相对集中，取少量洗洁精滴在色素所在位置，色素迅速往牛奶边缘扩散，这是因为牛奶密度略高于色素，在牛奶中加入色素后，色素可以短暂漂浮在牛奶表面，洗洁精是一种表面活性剂，加入洗洁精后，色素表面的张力迅速下降，从而小于牛奶张力，便形成扩散效果，加入洗洁精后的牛奶与色素符合“表面张力不同的两种液体”，色素在洗洁精的作用下改变张力，从而向牛奶边缘扩散，符合“液体从表面张力小的一边向张力大的方向流动渗透”，符合定义，当选；\nD项：奶茶是牛奶和茶叶水的混合物，在介绍奶茶的制作原材料，没有体现两种液体互相流动渗透，不符合“液体从表面张力小的一边向张力大的方向流动渗透”，不符合定义，排除。\n故正确答案为C。","no":76,"missingImage":false},{"type":"question","qid":"5102199","cat":"定义判断","stem":"最小干预原则是指在保证文物安全的基本前提下，通过最小程度的介入来最大限度地维系文物的原本面貌，保留文物的历史、文化价值，以实现延续现状、降低保护性破坏的目标。\n根据上述定义，下列选项不属于最小干预原则的是：","options":{"A":"某博物馆在修复古籍时不拆开原线绳，只修补蛀洞严重的书页，而不修补强度未受蛀洞影响的书页","B":"某博物馆的一幅雕塑作品中的人物手臂缺失，专家们查阅了原始资料，根据资料将其复原如初","C":"某古城墙修缮时，保留其残损的现状，在靠近边墙的一侧恢复了很窄的台阶供游人安全通过","D":"某古塔倾斜，专家们在研究后最终决定只纠偏一度，它看上去依旧是倾斜的状态"},"answer":"B","explanation":"第一步：找出定义关键词。\n“保证文物安全”、“最小程度的介入”、“最大限度地维系文物的原本面貌”、“延续现状、降低保护性破坏”。\n第二步：逐一分析选项。\nA项：某博物馆在修复古籍时不拆开原线绳，只修补蛀洞严重的书页，符合“最小程度的介入”，不修补强度未受蛀洞影响的书页，符合“最大限度地维系文物的原本面貌”，符合定义，排除；\nB项：雕塑作品中的人物手臂缺失，根据资料将其复原如初，并没有保留现状，也没有体现是不是最小程度的改变，不符合“最小程度的介入”、“最大限度地维系文物的原本面貌”，不符合定义，当选；\nC项：某古城墙修缮时，保留其残损的现状，符合“最大限度地维系文物的原本面貌”，在靠近边墙的一侧恢复了很窄的台阶，说明修复的地方很少，符合“最小程度的介入”，符合定义，排除；\nD项：某古塔倾斜，专家们只纠偏一度，说明修复的很少，符合“最小程度的介入”，依旧保留倾斜的状态，符合“最大限度地维系文物的原本面貌”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":77,"missingImage":false},{"type":"question","qid":"5102235","cat":"定义判断","stem":"薄膜干涉，指的是不同颜色的光波有不同的波长，当一束光波照射于薄膜，由于折射率不同，光波会被薄膜的上界面与下界面分别反射后再相遇，发生相互干涉而形成新的光波。对这一现象的研究可以用于计算薄膜的厚度、折射率等。\n根据上述定义，下列不属于薄膜干涉的是：","options":{"A":"一片普通薄玻璃镶嵌在窗框里，屋外灿烂的阳光穿透玻璃，照在屋内镜子上也能产生强烈反光","B":"汽车玻璃上的贴膜会改变折射光线和反射光线的能量分配比例，增加对某一光波的反射光强度","C":"汽车在有积水的柏油路上驶过时，积水面会形成一层油膜，这层油膜在阳光下呈现出美丽的色彩","D":"自然环境中，两块干净平整的玻璃片紧紧压叠形成极薄空间，出现一些平行条纹，手指用力压紧玻璃时，条纹随之发生改变"},"answer":"A","explanation":"第一步：找出定义关键词。\n“一束光波照射于薄膜”、“薄膜使其形成新的光波”。\n第二步：逐一分析选项。\nA项：阳光穿透玻璃，照在屋内镜子上产生强烈反光，说明镜子对光进行了反射，但镜子上是否有薄膜并不清楚，不符合“一束光波照射于薄膜”，不符合定义，当选；\nB项：光线照射在汽车玻璃上的贴膜上，符合“一束光波照射于薄膜”，改变折射光线和反射光线的能量分配比例，增加对某一光波的反射光强度，说明光波经过贴膜后形成了新的光波，符合“薄膜使其形成新的光波”，符合定义，排除；\nC项：积水面形成的油膜在阳光下呈现出美丽的色彩，符合“一束光波照射于薄膜”，“美丽的色彩”说明肉眼看不到颜色的阳光经过油膜后形成了新的光波，符合“薄膜使其形成新的光波”，符合定义，排除；\nD项：两块干净平整的玻璃片紧紧压叠形成极薄空间时，出现平行条纹，说明周围环境有光，符合“一束光波照射于薄膜”，手指用力压紧玻璃时，条纹随之发生改变，说明出现了新的光波，符合“薄膜使其形成新的光波”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":78,"missingImage":false},{"type":"question","qid":"5102223","cat":"定义判断","stem":"深度学习是指在模仿人脑机制的神经网络中，对人工神经元的层进行了“多层处理”。深度学习不仅可以让AI（人工智能）读取大量图片，还可以让AI自主提取图片特征。得益于深度学习技术的面世，只要有大量数据，AI就能以极高的准确率进行学习，从而大幅度拓展了AI的应用范围。\n根据上述定义，下列属于深度学习的是：","options":{"A":"人工智能图片教学走进课堂让学生体验深度学习","B":"问诊机器人可以迅速获取病患B超报告的风险信息","C":"某设区市在数字峰会期间提供无人驾驶汽车试乘服务","D":"安防巡检机器人通过图像识别技术判定工人是否佩戴安全帽"},"answer":"D","explanation":"第一步：找出定义关键词。\n“AI（人工智能）读取大量图片”、“自主提取图片特征”。\n第二步：逐一分析选项。\nA项：让学生观看人工智能的图片来体验深度学习，是让学生观看图片，不是让AI读取图片，不符合“AI（人工智能）读取大量图片”，不符合定义，排除；\nB项：问诊机器人可以识别B超报告，但报告中不只含有图片，还含有文字性诊断结果可以直接告知病患风险信息，而不需要AI提取，不符合“AI（人工智能）读取大量图片”、“自主提取图片特征”，不符合定义，排除；\nC项：提供无人驾驶汽车试乘服务，不是让AI读取图片，不符合“AI（人工智能）读取大量图片”、“自主提取图片特征”，不符合定义，排除；\nD项：安防巡检机器人通过识别工人的图像来判定工人是否佩戴安全帽，符合“AI（人工智能）读取大量图片”、“自主提取图片特征”，符合定义，当选。\n故正确答案为D。","no":79,"missingImage":false},{"type":"question","qid":"5102222","cat":"定义判断","stem":"回应性监管是指政府通过制度设计，采用多样化的监管手段和策略对市场主体和社会组织进行动态化、智能化、差别化的监管。回应性监管强调监管主体的多元化，除政府以外，企业、社会组织，乃至被监管对象都是监管主体；在监管策略上，采取差异化、阶梯化的监管方式，即政府首先鼓励自我监管，难以奏效时才采取更为严厉的强化型自我监管直至命令控制型监管。\n根据上述定义，下列选项没有体现回应性监管的是：","options":{"A":"某地主管部门因食品安全问题突击整顿涉事企业","B":"瑞典立法要求工作场所必须建立安全环保的内控体系","C":"英国成立企业、工会代表组成的大健康监管委员会","D":"聘请专业的第三方机构对企业安全生产状况进行评估"},"answer":"A","explanation":"第一步：找出定义关键词。\n“采用多样化的监管手段和策略”、“监管主体的多元化”。\n第二步：逐一分析选项。\nA项：某地主管部门直接对涉事企业进行了整顿，监管只有某地主管部门一个，没有体现出监管手段的多样化，不符合“采用多样化的监管手段和策略”，不符合定义，当选；\nB项：瑞典立法要求建立内控体系，说明除政府外还有其他监管手段和策略，内控体系也体现了“差别化的监管”，符合“采用多样化的监管手段和策略”，符合定义，排除；\nC项：英国成立企业、工会代表组成的大健康监管委员会，说明监管由不同主体共同完成，体现了多样化的监管手段和策略，符合“采用多样化的监管手段和策略”，符合定义，排除；\nD项：聘请专业的第三方机构，说明除第三方机构外可能还有其他的监管主体，可能符合 “监管主体的多元化”，比A更好，符合定义，排除。\n本题为选非题，故正确答案为A。","no":80,"missingImage":false},{"type":"question","qid":"5102355","cat":"定义判断","stem":"参照群体理论是关于人的社会心理态度和行为怎样受其从属的或追求的群体参照力所影响的社会心理学理论。参照群体是指个体从心理上把自己列入、与之对照，并在评价、态度、行为上和在规范与价值观形成上接受其影响的群体。\n根据上述定义，下列选项不能用参照群体理论解释的是：","options":{"A":"小王平时喜欢便装，但是参加面试时他决定穿着西装","B":"夏秋之际，妈妈怕孩子受凉，很注意给孩子增减衣物","C":"小刘看其他影迷都购买了偶像同款商品，自己也去买","D":"小张父母都是医生，她比常人更在意身边的卫生状况"},"answer":"B","explanation":"第一步：找出定义关键词。\n“受其从属的或追求的群体参照力所影响”。\n第二步：逐一分析选项。\nA项：小王平时喜欢便装，但参加面试时穿了西装，是因为面试时大多数人都选择正式的西装，小王也受其影响，因而在面试时做出同样的选择，符合“受其从属的或追求的群体参照力所影响”，符合定义，排除； \nB项：妈妈给孩子增减衣物是因为天气转凉，妈妈行为的变化是受天气变化的影响而不是群体的影响，不符合“受其从属的或追求的群体参照力所影响”，不符合定义，当选；\nC项：小刘购买偶像同款商品是因为其他影迷都购买了，小刘的行为受影迷群体的影响，符合“受其从属的或追求的群体参照力所影响”，符合定义，排除；\nD项：小张在意卫生状况是因为小张的父母都是医生，小张的行为受其父母的影响，符合“受其从属的或追求的群体参照力所影响”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":81,"missingImage":false},{"type":"question","qid":"5102247","cat":"定义判断","stem":"乡情治理是指乡情作用于基层社会治理主体和治理体系，在基层社会的意见整合、利益协调、矛盾化解、服务供给等治理过程中发挥重要作用的一种治理形态。“乡情”是一种基于地域以及附着在经济、社会、文化纽带上的特殊情感，体现为认同感、归属感、荣誉感及在此基础上的回馈意愿和公共精神。乡情治理的核心是存在一个由情感和认同构筑的场域，这个场域通过一些微观机制影响个体动机和群体行为，从而影响社会治理体系和过程。\n根据上述定义，下列属于乡情治理的是：","options":{"A":"顺德人都以顺德是“世界美食之都”而自豪","B":"敢拼会赢的精神一直激励着闽南人勇闯南洋","C":"海外华侨华人一直有着爱国爱乡的光荣传统","D":"北岸乡贤成立妈祖慈善基金会服务当地桑梓"},"answer":"D","explanation":"第一步：找出定义关键词。\n“乡情作用于基层社会治理主体和治理体系”、“在基层社会的治理过程中发挥重要作用”、“由情感和认同构筑的场域”、“影响社会治理体系和过程”。\n第二步：逐一分析选项。\nA项：“以顺德是‘世界美食之都’而自豪”只表明顺德人对当地的情感和认同，但是没有体现出对基层社会的治理，不符合“乡情作用于基层社会治理主体和治理体系”、“在基层社会的治理过程中发挥作用”，不符合定义，排除；\nB项：“敢拼会赢的精神”只表明这是闽南人的一种精神，并不是对于某地域的乡情，所以不存在由情感和认同构筑的场域，不符合“由情感和认同构筑的场域”，同时并没有体现出治理，不符合“乡情作用于基层社会治理主体和治理体系”，不符合定义，排除；\nC项：“爱国爱乡的光荣传统”只是海外华侨华人的品格，并不是对于某地域的乡情，所以不存在由情感和认同构筑的场域，不符合“由情感和认同构筑的场域”，同时并没有体现出治理，不符合“乡情作用于基层社会治理主体和治理体系”，不符合定义，排除；\nD项：“乡贤成立妈祖慈善基金会”说明当地人认同本地区的文化，存在由情感和认同构筑的场域，符合“由情感和认同构筑的场域”，而且“服务当地桑梓”是一种基层社会治理，符合“乡情作用于基层社会治理主体和治理体系”、“影响社会治理体系和过程”，符合定义，当选。\n故正确答案为D。","no":82,"missingImage":false},{"type":"question","qid":"5102236","cat":"定义判断","stem":"生殖隔离可以区分为合子前隔离和合子后隔离。合子前隔离是指由于活动区域、生活习性、体态差异等各种因素导致无法进行基因交流，从而产生生殖隔离。相比来说，合子后隔离则是因为遗传信息的不匹配，即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍。\n根据上述定义，下列现象体现合子后隔离的是：","options":{"A":"甲种兰花通过a昆虫授粉，乙种兰花通过b昆虫授粉，二者只能通过人工授粉进行繁殖","B":"三倍体西瓜开花后，用二倍体西瓜的花朵进行授粉，培育无籽西瓜","C":"富尔顿蟋蟀和宾州蟋蟀的鸣声不同，无法相互吸引，不会进行交配","D":"13年蝉和17年蝉的发情期不同，没有交配机会"},"answer":"B","explanation":"第一步：找出定义关键词。\n合子前隔离：“由于活动区域、生活习性、体态差异等各种因素”、“导致无法进行基因交流”；\n合子后隔离：“因为遗传信息的不匹配”、“即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍”。\n第二步：逐一分析选项。\nA项：两种兰花因“授粉昆虫不同”无法自然进行基因交流，但可以通过人工授粉进行繁殖，不符合“即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍”，不符合“合子后隔离”的定义，排除；\nB项：三倍体西瓜用二倍体西瓜授粉后，培育出了“无籽”西瓜，说明双方生殖细胞结合后不能完成正常的繁衍，符合“因为遗传信息的不匹配”、“即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍”，符合“合子后隔离”的定义，当选；\nC项：富尔顿蟋蟀和宾州蟋蟀因“鸣声不同”，不会进行交配，符合“由于活动区域、生活习性、体态差异等各种因素”、“导致无法进行基因交流”，符合“合子前隔离”的定义，不符合“合子后隔离”的定义，排除；\nD项：两种蝉因“发情期不同”，没有交配机会，符合“由于活动区域、生活习性、体态差异等各种因素”、“导致无法进行基因交流”，符合“合子前隔离”的定义，不符合“合子后隔离”的定义，排除。\n故正确答案为B。","no":83,"missingImage":false},{"type":"question","qid":"5102230","cat":"定义判断","stem":"过滤气泡是指以大数据与算法推荐为底层架构，根据用户的使用时间、地区以及浏览习惯生成用户画像，并通过算法技术为其呈
