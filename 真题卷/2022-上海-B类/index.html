<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2022-上海-B类","title":"2022年上海市公务员录用考试《行测》题（B类）（网友回忆版）","year":"2022","group":"上海","modules":[{"label":"政治理论","items":[{"type":"material","material":"\u003cp>        习近平总书记在庆祝中国共产党成立100周年大会上的重要讲话中指出：“中国共产党为什么能，中国特色社会主义为什么好，归根到底是因为马克思主义行！”100年来，闪耀着真理光芒、彰显着真理力量的马克思主义指引我们走好了过往的奋斗路，也必将继续指引我们走好前方的奋进路。马克思主义是我们认识世界、把握规律、追求真理、改造世界的强大思想武器，是党和国家必须始终遵循的指导思想。习近平总书记指出：“马克思主义基本原理是普遍真理，具有永恒的思想价值，但马克思主义经典作家并没有穷尽真理，而是不断为寻求真理和发展真理开辟道路。”100年来，我们党坚定不移坚持以马克思主义为指导，同时创造性地把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，以实事求是的态度发展马克思主义，不断推进马克思主义中国化，不断开辟马克思主义新境界，创立了毛泽东思想、邓小平理论，形成了“三个代表”重要思想、科学发展观，创立了习近平新时代中国特色社会主义思想，为党和人民事业发展提供了科学理论指导。马克思主义在中国大地、在人民群众心中落地生根，充分表明了马克思主义行；马克思主义不断解答中国发展提出的新课题、回应人类社会面临的新挑战，有力证明了马克思主义行。\u003c/p>","questions":[{"qid":"4652006","cat":"新思想","stem":"习近平总书记指出：马克思主义博大精深，归根到底就是一句话，                    。","options":{"A":"为人类求解放","B":"实现共产主义","C":"无产阶级专政","D":"全心全意为人民服务"},"answer":"A","explanation":"本题考查政治常识。\n习近平总书记在纪念马克思诞辰200周年大会上的讲话中提到，马克思主义是人民的理论，第一次创立了人民实现自身解放的思想体系。马克思主义博大精深，归根到底就是一句话，为人类求解放。\n故正确答案为A。","no":1,"missingImage":false},{"qid":"4651951","cat":"新思想","stem":"2021年8月30日，中央全面深化改革委员会第二十一次会议指出，“十四五”时期，我国生态文明建设进入以（    ）为重点战略方向，促进经济社会发展全面绿色转型、实现生态环境质量改善由量变到质变的关键时期。","options":{"A":"节能","B":"减排","C":"降碳","D":"增效"},"answer":"C","explanation":"本题考查政治常识。\n2021年8月30日，中央全面深化改革委员会第二十一次会议指出：“近年来，我们推动污染防治的措施之实、力度之大、成效之显著前所未有。‘十四五’时期，我国生态文明建设进入以降碳为重点战略方向、推动减污降碳协同增效、促进经济社会发展全面绿色转型、实现生态环境质量改善由量变到质变的关键时期，污染防治触及的矛盾问题层次更深、领域更广，要求也更高。”\n故正确答案为C。","no":2,"missingImage":false},{"qid":"4651966","cat":"新思想","stem":"2021年9月21日，国家主席习近平出席第七十六届联合国大会一般性辩论并发表重要讲话。他指出，要把疫苗作为全球公共产品，确保发展中国家的可及性和可负担性，当务之急是要：","options":{"A":"支持和参与全球科学溯源","B":"向发展中国家无偿捐赠疫苗","C":"统筹疫情防控和经济社会发展","D":"在全球范围内公平合理分配疫苗"},"answer":"D","explanation":"本题考查政治常识。\nD项正确，A、B、C三项错误，国家主席习近平9月21日在北京以视频方式出席第七十六届联合国大会一般性辩论并发表题为《坚定信心 共克时艰 共建更加美好的世界》的重要讲话。讲话指出，要把疫苗作为全球公共产品，确保发展中国家的可及性和可负担性，当务之急是要在全球范围内公平合理分配疫苗。中国将努力全年对外提供20亿剂疫苗，在向“新冠疫苗实施计划”捐赠1亿美元基础上，年内再向发展中国家无偿捐赠1亿剂疫苗。中国将继续支持和参与全球科学溯源，坚决反对任何形式的政治操弄。\n故正确答案为D。","no":3,"missingImage":false},{"qid":"4651965","cat":"新思想","stem":"1940年3月6日，中共中央首次提出了“三三制”原则，规定在根据地政权人员配备上，共产党员、党外进步人士和（    ）各占三分之一，推动了根据地的民主运动和政权建设。","options":{"A":"中间派","B":"开明地主","C":"进步官僚","D":"先进工人"},"answer":"A","explanation":"本题考查毛中特。\nA项正确，B、C、D三项错误，1940年3月6日，中共中央发出毛泽东同志起草的关于《抗日根据地的政权问题》的党内指示：在政权工作人员中，共产党员、非党的左派进步分子和中间派应各占三分之一，实行“三三制”。\n故正确答案为A。","no":4,"missingImage":false},{"qid":"4651946","cat":"新思想","stem":"1949年，中国共产党在带领中国人民历经28年浴血奋战之后取得了新民主主义革命的胜利，建立了新中国。新民主主义革命的胜利为实现中华民族伟大复兴创造了根本社会条件。这具体体现在，新民主主义革命：\n①确立了社会主义基本制度\n②结束了旧中国一盘散沙的局面\n③结束了旧中国半殖民地半封建社会的历史\n④废除了列强强加给中国的不平等条约和帝国主义在中国的一切特权","options":{"A":"①②③","B":"①②④","C":"②③④","D":"①③④"},"answer":"C","explanation":"本题考查毛中特。\n①错误，从1953年起，在过渡时期总路线的指引下，中国开始对农业、手工业和资本主义工商业进行社会主义改造，并于1956年基本完成改造任务，初步建立起了社会主义的基本制度。社会主义基本制度的建立，奠定了新中国以后一切进步和发展的制度基础。\n②③④正确，十九届六中全会通过的《中共中央关于党的百年奋斗重大成就和历史经验的决议》中指出：“经过二十八年浴血奋斗，党领导人民，在各民主党派和无党派民主人士积极合作下，于一九四九年十月一日宣告成立中华人民共和国，实现民族独立、人民解放，彻底结束了旧中国半殖民地半封建社会的历史，彻底结束了极少数剥削者统治广大劳动人民的历史，彻底结束了旧中国一盘散沙的局面，彻底废除了列强强加给中国的不平等条约和帝国主义在中国的一切特权，实现了中国从几千年封建专制政治向人民民主的伟大飞跃，也极大改变了世界政治格局，鼓舞了全世界被压迫民族和被压迫人民争取解放的斗争。”\n故正确答案为C。","no":5,"missingImage":false}]}],"count":5,"answerable":5,"pointsOf":10},{"label":"常识判断","items":[{"type":"material","material":"\u003cp>        习近平总书记在庆祝中国共产党成立100周年大会上的重要讲话中指出：“中国共产党为什么能，中国特色社会主义为什么好，归根到底是因为马克思主义行！”100年来，闪耀着真理光芒、彰显着真理力量的马克思主义指引我们走好了过往的奋斗路，也必将继续指引我们走好前方的奋进路。马克思主义是我们认识世界、把握规律、追求真理、改造世界的强大思想武器，是党和国家必须始终遵循的指导思想。习近平总书记指出：“马克思主义基本原理是普遍真理，具有永恒的思想价值，但马克思主义经典作家并没有穷尽真理，而是不断为寻求真理和发展真理开辟道路。”100年来，我们党坚定不移坚持以马克思主义为指导，同时创造性地把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，以实事求是的态度发展马克思主义，不断推进马克思主义中国化，不断开辟马克思主义新境界，创立了毛泽东思想、邓小平理论，形成了“三个代表”重要思想、科学发展观，创立了习近平新时代中国特色社会主义思想，为党和人民事业发展提供了科学理论指导。马克思主义在中国大地、在人民群众心中落地生根，充分表明了马克思主义行；马克思主义不断解答中国发展提出的新课题、回应人类社会面临的新挑战，有力证明了马克思主义行。\u003c/p>","questions":[{"qid":"4652003","cat":"人文常识","stem":"，是马克思主义活的灵魂，是我们适应新形势、认识新事物、完成新任务的根本思想武器。","options":{"A":"解放思想","B":"实事求是","C":"开拓创新","D":"与时俱进"},"answer":"ABD","explanation":"本题考查政治常识。\n习近平总书记指出，“解放思想、实事求是、与时俱进，是马克思主义活的灵魂”。这一重要论断深刻总结了中国特色社会主义的历史成就与宝贵经验，包含了彻底的辩证唯物主义和历史唯物主义，展现了当代中国马克思主义和21世纪马克思主义发展的新高度。新时代坚持马克思主义、坚持社会主义，必须始终坚持解放思想、实事求是、与时俱进，奋力开拓中国特色社会主义新境界。\n故正确答案为ABD。","no":6,"missingImage":false},{"qid":"4652008","cat":"人文常识","stem":"100年来，在推进马克思主义中国化的进程中，我们党始终坚持并不断发展马克思主义人民观，明确回答                    的重大命题，坚持发展为了人民、发展依靠人民、发展成果由人民共享。","options":{"A":"“为了谁、依靠谁、领导谁”","B":"“为了谁、依靠谁、我是谁”","C":"“为了谁、针对谁、我是谁”","D":"“我是谁、从哪里来、到哪里去”"},"answer":"B","explanation":"本题考查政治常识。\n历史和实践证明，一百年来，我们党正是毫不动摇地坚持并不断发展马克思主义人民观，明确回答“为了谁、依靠谁、我是谁”的重大命题，坚持发展为了人民、发展依靠人民、发展成果由人民共享，始终牢记“江山就是人民、人民就是江山，打江山、守江山，守的是人民的心”，才凝聚起众志成城的磅礴力量，团结带领人民共创历史伟业。\n故正确答案为B。","no":7,"missingImage":false},{"qid":"4652013","cat":"人文常识","stem":"马克思主义为什么行，既是一个基本的理论问题，又是一个重要的实践问题。下列能够回答这个问题的是：","options":{"A":"马克思主义占据真理制高点，科学回答“历史之问”","B":"马克思主义占据道义制高点，科学回答“人民之问”","C":"马克思主义占据实践制高点，科学回答“实践之问”","D":"马克思主义占据时代制高点，科学回答“时代之问”"},"answer":"ABCD","explanation":"本题考查政治常识。\nA项正确，马克思主义是无产阶级的科学世界观和方法论，是关于自然、社会和思维发展的一般规律的学说，是关于社会主义必然代替资本主义、最终实现共产主义的学说。它对人类的最大贡献就是“两大发现”：揭示历史之谜的唯物史观和揭示资本主义之谜的剩余价值学说。这两大发现创造性地揭示了人类社会发展的一般规律和资本主义发展的特殊规律，为人民指明了实现自由和解放的道路。\nB项正确，人民性是马克思主义的鲜明品格。人民至上是马克思主义的政治立场，马克思主义政党把人民放在心中最高位置，一切奋斗都致力于实现最广大人民的根本利益，这是马克思主义最鲜明的政治立场。坚持人的自由全面发展的观点，一切从群众中来、到群众中去的观点等，都是马克思主义人民性的具体内容。\nC项正确，实践的观点是马克思主义首要的、基本的观点。马克思认为，理论的真理性和现实性只能在实践中得到检验和实现。马克思主义的实践性，集中体现为中国共产党人的思想路线，即一切从实际出发，理论联系实际，实事求是，在实践中检验真理和发展真理。\nD项正确，时代性是马克思主义的鲜明特征，与时俱进是马克思主义的理论品质，是其能够永葆蓬勃生命力的根本途径。一部马克思主义发展史，就是马克思主义创始人及后继者根据时代和实践的发展而不断创新发展马克思主义的历史。\n故正确答案为ABCD。","no":8,"missingImage":false},{"qid":"4652015","cat":"人文常识","stem":"是马克思主义之所以成为科学的两大理论基石。正是在此基础之上，马克思建立了马克思主义政治经济学、科学社会主义理论，形成了关于自然、社会和人类思维规律的一系列原理、观点和结论，创立了为无产阶级和全人类实现解放的最科学、最彻底的理论体系。","options":{"A":"唯物史观和剩余价值理论","B":"唯物史观和劳动价值论","C":"劳动价值论和剩余价值理论","D":"唯物史观和辩证法思想"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，B、C、D三项错误，唯物史观和剩余价值理论是马克思主义之所以成为科学的两大理论基石。正是在唯物史观和剩余价值理论的坚实基础之上，马克思建立了马克思主义政治经济学、科学社会主义理论，形成了关于自然、社会和人类思维规律的一系列原理、观点和结论，创立了为无产阶级和全人类实现解放的最科学、最彻底的理论体系。\n故正确答案为A。","no":9,"missingImage":false}]},{"type":"material","material":"\u003cp>        行政处罚是行政机关有效实施行政管理，保障法律法规贯彻施行的重要手段。《行政处罚法》的修订工作深入贯彻习近平新时代中国特色社会主义思想特别是习近平法治思想，是贯彻落实党中央关于全面依法治国重大决策部署的体现，亦是巩固行政执法领域重大改革成果的体现。《行政处罚法》于2019年10月形成修订草案征求意见稿，多次征求国务院部门、各省市人大常委会法制工作机构，以及基层立法联系点、部分高等院校、科研单位的意见。2020年6月委员长会议将《行政处罚法（修订草案）》提请十三届全国人大常委会一审，2020年10月再次审议，2021年1月22日三审通过。新修订的《行政处罚法》于2021年7月15日起施行。\u003c/p>\u003cp>        此次修改的主要内容有：第一，全面落实行政执法体制改革要求。增加综合行政执法制度，推动解决多头执法、重复执法和执法力量分散问题，规定国家在特定领域推行建立综合行政执法制度，相对集中行政处罚权。第二，严格规范公正文明执法要求。一是丰富行政处罚种类、完善没收违法所得制度、延长追责期限。二是完善执法程序，将行政执法公示、执法全过程记录、重大执法决定法制审核“三项制度”明确纳入《行政处罚法》。三是明确行政处罚裁量权基准制度，规范行使行政处罚自由裁量权。规范非现场执法和行政处罚信息化，提高行政效率的同时体现便民原则，强化当事人的陈述、归辩等权利保护等等。\u003c/p>","questions":[{"qid":"4651981","cat":"法律常识","stem":"《行政处罚法》的修订是对社会主义法治理念            内容的反映。","options":{"A":"依法治国","B":"执法为民","C":"公平正义","D":"服务大局"},"answer":"ABCD","explanation":"本题考查法律常识。\nA项正确，依法治国是社会主义法治的核心内容，包括“科学立法、严格执法、公正司法、全民守法”的“十六字方针”。《行政处罚法》的修订反映了严格执法的方针，也反映了依法治国的理念。\nB项正确，执法为民是社会主义法治的本质要求，内涵是：以人为本；保障人权；文明执法。《行政处罚法》修改的内容中，强化当事人的陈述、申辩等权利保护等内容反映了执法为民的理念。\nC项正确，公平正义是社会主义法治的价值追求，其内涵包括：法律面前人人平等；合法合理；程序正当；及时高效。《行政处罚法》修改的内容中，明确行政处罚裁量权基准制度，规范行使行政处罚自由裁量权等反映了公平正义的理念。\nD项正确，服务大局是社会主义法治的重要使命。材料中“《行政处罚法》的修订是贯彻落实党中央关于全面依法治国重大决策部署的体现”反映了服务大局。\n故正确答案为ABCD。","no":10,"missingImage":false},{"qid":"4651986","cat":"法律常识","stem":"《行政处罚法》的修订过程体现了                    的立法原则。","options":{"A":"依照法定的程序和权限","B":"发扬社会主义民主","C":"高效便民","D":"以经济建设为中心"},"answer":"AB","explanation":"本题考查法律常识。\nA项正确，《立法法》第二十六条第一款规定：“委员长会议可以向常务委员会提出法律案，由常务委员会会议审议。”《立法法》第二十九条第一款规定：“列入常务委员会会议议程的法律案，一般应当经三次常务委员会会议审议后再交付表决。”《行政处罚法》的修订过程“2020年6月委员长会议将《行政处罚法（修订草案）》提请十三届全国人大常委会一审，2020年10月再次审议，2021年1月22日三审通过。新修订的《行政处罚法》于2021年7月15日起施行。”符合《立法法》的规定，体现了依照法定的程序和权限的立法原则。\nB项正确，《行政处罚法》于2019年10月形成修订草案征求意见稿，并且根据各方面意见，对征求意见稿进一步修改完善，形成了《行政处罚法（修订草案）》。这体现了发扬社会主义民主的立法原则。\nC项错误，高效便民，是指行政机关应依法高效率、高效益地行使职权，最大程度地方便人民群众，从而更好地服务于人民和实现行政管理的目标。主要体现在行政执法过程中，“修订过程”是立法程序，二者并无太大关系。\nD项错误，以经济建设为中心是指中国共产党在社会主义初级阶段基本路线的中心，是兴国之要，是党和国家兴旺发达和长治久安的根本要求。根据《行政处罚法》第一条规定：“为了规范行政处罚的设定和实施，保障和监督行政机关有效实施行政管理，维护公共利益和社会秩序，保护公民、法人或者其他组织的合法权益，根据宪法，制定本法。”行政处罚法的修订并非体现以经济建设为中心的立法原则。\n故正确答案为AB。","no":11,"missingImage":false},{"qid":"4652001","cat":"法律常识","stem":"根据新修订的《行政处罚法》，在            领域可建立综合行政执法制度。","options":{"A":"市场监管","B":"生态环境","C":"文化市场","D":"交通运输"},"answer":"ABCD","explanation":"本题考查法律常识。\n根据《行政处罚法》第十八条第一款规定：“国家在城市管理、市场监管、生态环境、文化市场、交通运输、应急管理、农业等领域推行建立综合行政执法制度，相对集中行政处罚权。”\n故正确答案为ABCD。","no":12,"missingImage":false},{"qid":"4652002","cat":"法律常识","stem":"新修订的《行政处罚法》中增加的行政处罚种类有：","options":{"A":"通报批评","B":"责令改正","C":"降低资质等级","D":"责令关闭"},"answer":"ACD","explanation":"本题考查法律常识。\n修订前的《行政处罚法》第八条规定：“行政处罚的种类：（一）警告；（二）罚款；（三）没收违法所得、没收非法财物；（四）责令停产停业；（五）暂扣或者吊销许可证、暂扣或者吊销执照；（六）行政拘留；（七）法律、行政法规规定的其他行政处罚。”修订后的《行政处罚法》第九条规定：“行政处罚的种类：（一）警告、通报批评；（二）罚款、没收违法所得、没收非法财物；（三）暂扣许可证件、降低资质等级、吊销许可证件；（四）限制开展生产经营活动、责令停产停业、责令关闭、限制从业；（五）行政拘留；（六）法律、行政法规规定的其他行政处罚。”通报批评、降低资质等级、责令关闭属于新增加的行政处罚种类，责令改正不属于行政处罚。\n故正确答案为ACD。","no":13,"missingImage":false},{"qid":"4652005","cat":"法律常识","stem":"新修订的《行政处罚法》将行政执法公示、执法全过程记录等制度明确纳入，体现了行政法基本原则中的：","options":{"A":"行政公开原则","B":"程序正当原则","C":"信赖保护原则","D":"合法行政原则"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，B项正确，程序正当原则包括行政公开原则、公众参与原则和回避原则，行政公开原则是程序正当原则的内容之一，指的是除涉及国家秘密和依法受到保护的商业秘密、个人隐私外，行政机关实施行政管理应当做到信息公开。《行政处罚法》规定行政执法公示、执法全过程记录等制度，将行政处罚中的相关信息进行公开，体现了程序正当原则。\nC项错误，信赖保护原则指非因法定事由并经法定程序，行政机关不得撤销、变更已经生效的行政决定；因国家利益、公共利益或者其他法定事由需要撤回或者变更行政决定的，应当按照法定权限和程序进行，并对行政管理相对人因此而受到的财产损失依法予以补偿。题中并未体现信赖保护原则。\nD项错误，合法行政原则指行政机关必须遵守和执行法律，一切行政活动都要以法律为依据，严格遵守法律的有关规定，不得享有法外的特权，超越其权限的行为无效，违反法律导致相应的后果，一切行政违法行为都必须承担相应的法律责任。题中并未体现信赖保护原则。\n故正确答案为B。","no":14,"missingImage":false}]},{"type":"material","material":"\u003cp>        2021年4月8日，上海浦东新区上线了升级版的城市大脑，该版本将此前涉及经济治理104个场景、城市治理50个场景和社会治理11个场景进行了整合集成，形成了10类57个整合场景。在物业管理场景中，升级后的城市大脑可以通过视频捕获智能识别楼道充电、飞线充电行为，发现后即通过平台推送物业公司进行劝阻，如劝阻无效，即通过区城运中心指挥平台推送城管、公安、消防等部门进行执法处置。\u003c/p>\u003cp>        同时，城市大脑还会推送居委会、业委会，通过召开“三会”等方式，商议建设集中充电设施来缓解充电矛盾，实现治理全流程无缝衔接；推动各方业务流程精准衔接，建立高效联动响应机制，通过村居“微闭环”、街镇（片区）“小闭环”、部门“中闭环”、政府市场社会“大闭环”，实现智能发现、自动派单、管理闭环、高效处置。\u003c/p>\u003cp>        2020年12月，浦东城市大脑升级版启动上线试运行，7个全面融合经济、社会、城市治理要素的智能化场景深化整合后投入实战运行。近年来，浦东围绕重大风险防范和治理体系治理能力现代化持续创新探索，从以“城市大脑”为基础的城市治理创新到以“家门口”服务体系为基础的社会治理创新，超大城市治理的制度体系日趋完整。\u003c/p>\u003cp>        场景建设从无到有、从少到多、从多到精的过程背后，是浦东打破部门之间、条线之间、层级之间职责壁垒。其中，垃圾分类应用场景就是一个典型。上海实施垃圾分类以来，浦东作为特大型区，面临产生点位多、收运覆盖面广、全程分类体系监管难度大等特点。城市大脑通过物联感知设备、大数据分析和智能监测，从源头收集到中转运输和末端处置全过程智能发现小包垃圾、跑冒滴漏等管理顽疾，整合集成包括政府管理部门、物业公司和收运企业等市场主体，居委会和志愿者等自治共治组织在内的各方力量，实现治理需求和资源、制度供给高效衔接。如今垃圾分类场景已经将浦东新区全区2662个住宅小区、337个行政村、2441个垃圾产生单位、43627个沿街商铺、91个小压站、12个中转站、4个处置场全部落图管理。\u003c/p>\u003cp>        在养老服务场景中，浦东新区共有120多家养老机构，2万6千多个养老床位，传统管理按照部门“单打独斗”和人工管理模式，监管难度很大。此次城市大脑通过深化整合，针对养老机构共制定出38个治理要素，其中城市治理分成场所、设备两大类7个要素，经济治理要素分成人员、资金、制度、证照、经营五大类20个要素，社会治理分成信访舆情、紧急救助、防疫管理等三类5个要素。这明确了行业监管范围和职责边界，推动各方治理职责全覆盖衔接，缺位的完善补位，交叉的优化协同，在党建引领下，实现政府、市场、社会同向发力。\u003c/p>","questions":[{"qid":"4652022","cat":"人文常识","stem":"阅读资料可知，以下有关城市大脑的描述正确的是：","options":{"A":"浦东新区于2021年正式启动城市大脑项目","B":"城市大脑是电力时代技术进步的重要产物","C":"城市大脑兼容互联网架构与智慧城市建设","D":"城市大脑推动城市治理并彻底解决城市病"},"answer":"C","explanation":"本题考查政治常识。\nA项错误，浦东“城市大脑”于2020年7月正式上线，并非于2021年正式启动。\nB项错误，19世纪60年代后期，各种新技术、新发明层出不穷，并被应用于各种工业生产领域，促进经济的进一步发展，第二次工业革命蓬勃兴起，人类进入了“电气时代”。城市大脑以互联网为依托，是信息时代技术进步的产物。\nC项正确，城市大脑依托于互联网，一般都会定位自身是“基于云计算、大数据、物联网、人工智能等新一代信息技术”所构建的系统与应用，其是智慧城市的一个有机组成部分，更多地属于智慧城市中的管理与决策系统，强调的数据资源依然来自构建智慧城市的物联网等信息技术基础设施。故“城市大脑兼容互联网架构与智慧城市建设”的说法正确。\nD项错误，城市大脑连接散落在城市各个单元的数据资源，打通城市神经网络，让数据帮助城市来做思考、决策和运营，形成城市基础运行能力、城市实时“健康”状态的大视图，形成“全时段、全区域、自动化、多途径”的事件预警网络和协同治理体系，为城市综合治理提供决策依据，让城市管理工作更加有效。但“城市大脑推动城市治理并彻底解决城市病”的表述过于绝对。\n故正确答案为C。","no":15,"missingImage":false},{"qid":"4652023","cat":"人文常识","stem":"城市大脑最为关键的功能体现在：","options":{"A":"预判问题","B":"转移问题","C":"处置问题","D":"终结问题"},"answer":"C","explanation":"本题考查管理常识。\nC项正确，A、B、D三项错误，城市大脑是支撑未来城市可持续发展的全新基础设施，其核心是利用实时全量的城市数据资源全局优化城市公共资源，将散布在城市各个角落的数据连接起来，通过对大量数据的分析和整合，对城市进行全域的即时分析、指挥、调动、管理，从而实现对城市的精准分析、整体研判、协同指挥。材料描述的几类主要场景中，可以看出城市大脑最终还是为了缓解社会治理中的矛盾和问题，所以其最为关键的功能体现在处置问题上。\n故正确答案为C。","no":16,"missingImage":false},{"qid":"4652024","cat":"人文常识","stem":"城市大脑运行依托的主体包括：","options":{"A":"政府部门","B":"互联网企业","C":"社会组织","D":"自治组织"},"answer":"ACD","explanation":"本题考查管理常识。\nA、C、D三项正确，B项错误，根据第四段“上海实施垃圾分类以来，浦东作为特大型区，面临产生点位多、收运覆盖面广、全程分类体系监管难度大等特点。城市大脑通过物联感知设备、大数据分析和智能监测，从源头收集到中转运输和末端处置全过程智能发现小包垃圾、跑冒滴漏等管理顽疾，整合集成包括政府管理部门、物业公司和收运企业等市场主体，居委会和志愿者等自治共治组织在内的各方力量，实现治理需求和资源、制度供给高效衔接”，可知，城市大脑的运行依托的主体包括：政府管理部门、居委会（自治组织）和志愿者（社会力量）等自治共治组织在内的各方力量和物联感知设备，未涉及到互联网企业。\n故正确答案为ACD。","no":17,"missingImage":false},{"qid":"4652025","cat":"人文常识","stem":"分析材料可知，城市大脑具有：","options":{"A":"感知现实场景的能力","B":"数据采集、分析、应用能力","C":"大数据计算能力","D":"精细化管理能力"},"answer":"ABCD","explanation":"本题考查管理常识。\nA项正确，材料所述：“在物业管理场景中，升级后的城市大脑可以通过视频捕获智能识别楼道充电、飞线充电行为，发现后即通过平台推送物业公司进行劝阻。”说明城市大脑具有感知现实场景的能力。\nB项正确，材料所述：“城市大脑通过物联感知设备、大数据分析和智能监测，从源头收集到中转运输和末端处置全过程智能发现小包垃圾、跑冒滴漏等管理顽疾，整合集成包括政府管理部门、物业公司和收运企业等市场主体，居委会和志愿者等自治共治组织在内的各方力量，实现治理需求和资源、制度供给高效衔接。”说明城市大脑具有数据采集、分析、应用能力。\nC项正确，材料所述“升级后的城市大脑可以通过视频捕获智能识别楼道充电、飞线充电行为，发现后即通过平台推送物业公司进行劝阻，如劝阻无效，即通过区城运中心指挥平台推送城管、公安、消防等部门进行执法处置。”“城市大脑通过物联感知设备、大数据分析和智能监测，从源头收集到中转运输和末端处置全过程智能发现小包垃圾”说明城市大脑具有大数据计算能力，通过大数据计算发现问题，进行推送处理。\nD项正确，材料所述：“如今垃圾分类场景已经将浦东新区全区2662个住宅小区、337个行政村、2441个垃圾产生单位、43627个沿街商铺、91个小压站、12个中转站、4个处置场全部落图管理。”说明城市大脑具有精细化管理能力。\n故正确答案为ABCD。","no":18,"missingImage":false},{"qid":"4652041","cat":"人文常识","stem":"根据材料可推断，在养老服务场景中，城市大脑通过深化整合实现了：","options":{"A":"从以服务对象为中心向以部门合作为中心转变","B":"从传统治理方式向数字化治理方式的转变","C":"从碎片化治理目标向整体性治理目标的转变","D":"从单一部门应对问题向多部门协同联动的转变"},"answer":"BCD","explanation":"本题考查管理常识。\nA项错误，B、D两项正确，城市大脑场景建设从无到有、从少到多、从多到精的过程背后，是浦东打破部门之间、条线之间、层级之间职责壁垒，坚持以群众和市场主体需求为中心推动治理流程再造的自我革命。整合后的场景充分体现了从以部门为中心向以服务对象为中心的转变，从各部门依据职责各司其职向围绕服务对象需求主动跨前、协同联动、集成服务的转变，从传统治理方式向数字化转型引领数字治理转变。\nC项正确，此次城市大脑通过深化整合，针对养老机构共制定出38个治理要素，这明确了行业监管范围和职责边界，推动各方治理职责全覆盖衔接，缺位的完善补位，交叉的优化协同，在党建引领下，实现政府、市场、社会同向发力。体现了从碎片化治理目标向整体性治理目标的转变。\n故正确答案为BCD。","no":19,"missingImage":false},{"qid":"4651958","cat":"人文常识","stem":"历史充分证明，江山就是人民，人民就是江山，人心向背关系党的生死存亡。赢得人民信任，得到人民支持，党能够克服任何困难，就能够无往而不胜。从哲学的角度来看，人民与江山的关系体现了：","options":{"A":"唯物主义认识论：实践是认识发展的动力","B":"唯物辩证法：整体由部分组成、部分服从于整体","C":"唯物史观：人民群众是历史的创造者","D":"辩证唯物论：矛盾的主次方面在一定条件下相互转化"},"answer":"C","explanation":"本题考查政治常识。\nA项错误，实践是认识发展的动力强调实践中产生的新问题需要新的认识去解决，从而推动认识的发展。与题干无关。\nB项错误，整体与部分的辩证关系表现在二者是不可分割的，整体由部分组成，整体只有对于组成它的部分而言，才是一个确定的整体，没有部分就无所谓整体；部分是整体中的部分，只有相对于它所构成的整体而言，才是一个确定的部分，没有整体也无所谓部分，任何部分离开了整体，它就失去了原来的意义。与题干无关。\nC项正确，人民群众是历史的主体和历史的创造者，主要体现在：人民群众是社会物质财富的创造者，人民群众是社会精神财富的创造者，人民群众是实现社会变革的决定力量。题干指出“人心向背关系党的生死存亡”强调了人民群众的重要性，体现了该哲理。\nD项错误，一个矛盾中两个方面的地位和作用不平衡，其中居于支配地位，对事物的发展起主导作用的矛盾方面叫做矛盾的主要方面，对事物的发展不起主导作用的叫做矛盾的次要方面。事物的性质主要是由矛盾的主要方面决定，次要方面对事物的性质也有一定的影响，一定条件下二者可以相互转化。与题干无关。\n故正确答案为C。","no":20,"missingImage":false},{"qid":"4651959","cat":"人文常识","stem":"2021年5月，上海市推出首本《劳动教育特色课程范例》，劳动教育进课堂有了具体的教学内容和教学要求。从历史唯物主义的视角来看，加强劳动教育的哲学依据是：","options":{"A":"人生的真正价值就在于自我价值的实现","B":"劳动和奉献是实现人生价值的根本途径","C":"奋斗才能让理想摆脱条件制约变为现实","D":"劳动是推动和引领社会发展的第一动力"},"answer":"B","explanation":"本题考查政治常识。\nA项错误，人生价值包括个人对社会的责任和贡献（社会价值）、社会对个人的承认与满足（自我价值）两个方面，人生的真正价值在于社会价值与个人价值的统一。\nB项正确，实现人生价值的根本途径是投身于人民群众的社会实践，进行积极的创造性的实践活动，而劳动在本质上就是人的创造性实践活动，人只有在劳动中才能进行创造性活动。题干中提到加强劳动教育，意在强调劳动的重要性。\nC项错误，客观规律作为限制条件，始终制约着主观能动性的发挥，必须在尊重客观规律的基础之上发挥主观能动性，因此即便奋斗也无法摆脱条件制约。\nD项错误，创新是引领发展的第一动力，而不是劳动。\n故正确答案为B。","no":21,"missingImage":false},{"qid":"4651962","cat":"人文常识","stem":"某市政协扎实推进“请你来协商”平台建设，开展“请你来协商”重点活动，通过面对面协商、点对点交流，不少意见建议得到采纳并转化为工作举措。从实质民主角度看，“请你来协商”平台：","options":{"A":"丰富了公众通过政协行使民主权利的形式","B":"是拓宽公民行使知情权、监督权的渠道","C":"是实现人民当家作主的有益探索","D":"进一步完善了政治协商制度"},"answer":"C","explanation":"本题考查政治常识。\nA项错误，C项正确，社会主义协商民主的最终目的就是要让人民更好的当家作主，让人民群众更加直接、便捷地参与到公共生活中来，让人民群众更多的能在涉及自身利益的事务中发出声音，让人民群众真正参与到中华民族伟大复兴的生动实践中来。“请你来协商”平台丰富了公众行使民主权利的形式，但并未通过政协这一组织。通过“请你来协商”这个平台，人民群众更多的能在涉及自身利益的事务中发出声音、表达意见，是实现人民当家作主的有益探索。\nB项错误，知情权指知悉、获取官方信息的自由与权利，是公民作为民事主体所必须享有的人格权的一部分；监督权，是指公民有监督一切行使公共权力人员的权利。“请你来协商”平台是人民群众参与管理的方式，并未体现知情权和监督权。\nD项错误，政治协商制度是指在中国共产党领导下，各政党、各人民团体、各少数民族和社会各界的代表，以中国人民政治协商会议为组织形式，经常就国家的大政方针进行民主协商的一种制度。“请你来协商”只是群众提意见的平台，与政治协商制度无关。\n故正确答案为C。","no":22,"missingImage":false},{"qid":"4651968","cat":"人文常识","stem":"社区是城市基层治理的“最后一公里”。特别是城市化进入当前阶段，社区成为承载群众对美好生活的需求和日常矛盾最集中的单元。加上社区工作人员往往缺口较大，所辖人群基数又大，容易出现“小马拉大车”的情况。破解基层治理难题应该主要依靠：","options":{"A":"人大代表，针对具体的问题向人大提出意见和建议","B":"社区工作者，提高业务水平，增强独立决策的能力","C":"科技，提高基层治理社会化、智能化及专业化水平","D":"群众，做实参与机制，推动社区治理的“多元共治”"},"answer":"D","explanation":"本题考查管理常识。\nD项正确，A、B、C三项错误，社区是城市基层治理的“最后一公里”。特别是城市化进入当前阶段，社区成为承载群众对美好生活的需求和日常矛盾最集中的单元。加上社区工作人员往往缺口较大，所辖人群基数又大，容易出现“小马拉大车”的情况。突出依靠群众，做实参与机制，推动社区治理“多元共治”成为破解基层治理难题的重要手段。要坚持依靠居民、依法有序组织居民群众参与社区治理，实现人人参与、人人尽力、人人共享。\n故正确答案为D。","no":23,"missingImage":false},{"qid":"4651970","cat":"人文常识","stem":"“幽灵，一个共产主义的幽灵，在欧洲游荡。为了对这个幽灵进行神圣的围剿，旧欧洲的一切势力，教皇和沙皇、梅特涅和基佐、法国的激进派和德国的警察，都联合起来了。”旧势力围剿“幽灵”的原因是：","options":{"A":"它宣告资产阶级的灭亡是不可避免的","B":"它否定了资本主义社会存在的合理性","C":"它实现了团结全体社会劳动者的壮举","D":"它引发了资产阶级和无产阶级的矛盾"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，B、C、D三项错误，题干文段出自《共产党宣言》，“幽灵”是旧欧洲反动势力对共产主义的污蔑和攻击。共产主义一出场，就公开宣布用暴力摧毁资产阶级的统治，资产阶级自然就把共产主义当作洪水猛兽看待，指责它是“鬼怪”“怪物”“幽灵”。由于共产党人坚信，共产主义要“使整个社会永远摆脱剥削、压迫和阶级斗争”，这必然会引起反动力量的恐惧和仇视。所以，包括资产阶级在内的“旧欧洲的一切势力”都攻击共产主义。而“幽灵”的降临就是要宣告：“资产阶级的灭亡和无产阶级的胜利是同样不可避免的。”共产党人的目的“只有用暴力推翻全部现存的社会制度才能达到······无产者在这个革命中失去的只是锁链。他们获得的将是整个世界”。故旧势力围剿“幽灵”的原因是其宣告了资产阶级的灭亡是不可避免的。\n故正确答案为A。","no":24,"missingImage":false},{"qid":"4651984","cat":"人文常识","stem":"1953年9月25日，《人民日报》正式公布了由毛泽东提出的过渡时期的总路线，总路线内容是：要在一个相当长的历史时期内，                    。","options":{"A":"大力发展重工业，努力提高农业生产","B":"解放生产力、发展生产力，尽快进入社会主义","C":"将落后的农业国变成先进的工业国、最终全面实现现代化","D":"基本上实现国家工业化和对农业、手工业、资本主义工商业的社会主义改造"},"answer":"D","explanation":"本题考查毛中特。\nD项正确，A、B、C项错误，1953年9月25日，《人民日报》正式公布了由毛泽东提出的过渡时期的总路线。总路线内容是：要在一个相当长的历史时期内，基本上实现国家工业化和对农业、手工业、资本主义工商业的社会主义改造。这是国民经济发展的基本要求，又是实现三大改造的物质基础；而实现对农业、手工业和资本主义工商业社会主义改造又是实现国家工业化的必要条件。两者互相依赖、相辅相成。\n故正确答案为D。","no":25,"missingImage":false},{"qid":"4651992","cat":"人文常识","stem":"“每一场革命都有它自身的传奇。毛泽东率领数万名工农红军所完成的战略转移，就是中国革命史上的伟大传奇。”下列选项中，（    ）是描述这一“伟大传奇”的诗词。","options":{"A":"天连五岭银锄落，地动三河铁臂摇。借问瘟君欲何往，纸船明烛照天烧。","B":"钟山风雨起苍黄，百万雄师过大江。虎踞龙盘今胜昔，天翻地覆慨而慷。","C":"一山飞峙大江边，跃上葱茏四百旋。冷眼向洋看世界，热风吹雨洒江天。","D":"金沙水拍云崖暖，大渡桥横铁索寒。更喜岷山千里雪，三军过后尽开颜。"},"answer":"D","explanation":"本题考查毛中特。\n由“毛泽东率领数万名工农红军所完成的战略转移”，可知题干中的“伟大传奇”是指长征。\nA项错误，“天连五岭银锄落，地动三河铁臂摇。借问瘟君欲何往，纸船明烛照天烧”出自毛泽东的《七律二首·送瘟神·其二》，是毛泽东在1958年6月30日《人民日报》上读到余江县消灭了血吸虫的消息后写下的组诗作品。该诗写新时代新社会人民当家作主、改天换地的壮举和人民幸福安康、瘟神被逐的情景，浓情歌颂了伟大的时代和英雄的人民。与长征无关。\nB项错误，“钟山风雨起苍黄，百万雄师过大江。虎踞龙盘今胜昔，天翻地覆慨而慷”出自毛泽东的《七律·人民解放军占领南京》，该诗描绘了1949年解放军渡江解放南京的雄伟场面，赞颂了南京解放所取得的历史性胜利，抒发了欢庆南京解放的革命豪情。与长征无关。\nC项错误，“一山飞峙大江边，跃上葱茏四百旋。冷眼向洋看世界，热风吹雨洒江天”出自毛泽东的《七律·登庐山》，全诗紧扣诗题“登庐山”来写，概写登山过程和抒写登山后的所见所思所感，歌颂了新中国的新社会现实，并对反华势力表示极大的蔑视，表达了自己高度乐观的形势观。与长征无关。\nD项正确，“金沙水拍云崖暖，大渡桥横铁索寒。更喜岷山千里雪，三军过后尽开颜”出自毛泽东的《七律·长征》，意思是不惧急流巧渡金沙江，不畏严寒飞夺泸定桥；翻过白雪皑皑的千里岷山，红军战士个个喜笑颜开。《七律·长征》高度概括了红军长征的战斗历程，描绘了红军的英雄形象，充满了革命英雄主义和乐观主义精神，也展现了作者对革命胜利的坚定信念。\n故正确答案为D。","no":26,"missingImage":false},{"qid":"4651950","cat":"法律常识","stem":"社会保险通过政府、单位、个人三方共同筹集资金，保障公民在年老、疾病、工伤、失业、生育等情况下依法从国家和社会获得物质帮助。以下选项属于社会保险的是：","options":{"A":"社区居民在医院接种新冠疫苗","B":"利用医保账户购买“沪惠保”","C":"通过“水滴筹”为患者捐款治病","D":"生病时使用医保卡进行住院报销"},"answer":"D","explanation":"本题考查经济常识。\nA项错误，我国新冠疫苗属于公共物品，在医院免费接种新冠疫苗属于社会福利，不属于社会保险。\nB项错误，“沪惠保”是针对上海市基本医保参保人定制推出的上海城市定制型商业补充医疗保险，因此属于普惠性商业保险，不属于社会保险。\nC项错误，水滴筹属于互助计划平台，通过“水滴筹”为患者捐款治病指的是部分家庭或者个人对其他人的帮助行为，因此属于社会互助，不属于社会保险。\nD项正确，生病时使用医保卡进行住院报销属于医疗报销，是我国社会保障制度中的医疗保险，因此属于社会保险。\n故正确答案为D。","no":27,"missingImage":false},{"qid":"4651964","cat":"人文常识","stem":"为了助力体育企业纾困发展，激发体育消费市场活力，近期，全国多地陆续推出体育消费券，发放形式及体量也在不断升级。上海推出“消费券”配送升级版，五一小长假期间，上海体育消费券累积领券42542张，产生订单7916笔，拉动定点场馆直接消费70多万元。“消费券”助推经济发展，其传导路径应该是：","options":{"A":"发放体育消费券\u003cimg data-k=\"2dfb7d1f72f3\">提高居民消费意愿\u003cimg data-k=\"2dfb7d1f72f3\">带动体育消费上升\u003cimg data-k=\"2dfb7d1f72f3\">促进体育经济发展","B":"发放消费券\u003cimg data-k=\"2dfb7d1f72f3\">扩大居民劳动性收入\u003cimg data-k=\"2dfb7d1f72f3\">增强居民实际购买力\u003cimg data-k=\"2dfb7d1f72f3\">推动体育事业发展","C":"发放消费券\u003cimg data-k=\"2dfb7d1f72f3\">降低商品消费价格\u003cimg data-k=\"2dfb7d1f72f3\">刺激居民的消费欲望\u003cimg data-k=\"2dfb7d1f72f3\">增加新的消费对象","D":"增加居民实际收入\u003cimg data-k=\"2dfb7d1f72f3\">提振居民消费信心\u003cimg data-k=\"2dfb7d1f72f3\">扩大线上消费比例\u003cimg data-k=\"2dfb7d1f72f3\">带动体育经济的发展"},"answer":"A","explanation":"本题考查经济常识。\n消费券是专用券的一种，为实现经济政策的工具之一。消费券的功能与现金一样，但只能用来买商品，不能兑换成现金。消费券一般都会指定购物地点，在指定的商场才可以购买商品，而且要一次性消费完毕，不设找零。\nA项正确，政府发放体育类消费券，能够使居民购买体育类产品时有巨大优惠，从而提高其消费意愿，进而带动体育类产品消费提高，使体育产业的供给增加，最终促进体育产业的蓬勃发展。\nB项错误，消费券的发放是政府的无偿性福利支出，并没有扩大居民的劳动性收入。\nC项错误，发放消费券指的是居民购买产品时可以使用消费券进行消费，居民实际支付中有巨大优惠，并不会降低商品的消费价格。\nD项错误，发放政府消费券不可以兑换成现金，因此并没有增加居民的实际收入。\n故正确答案为A。","no":28,"missingImage":false},{"qid":"4651967","cat":"法律常识","stem":"如果将“公共政策”定义为执政党或者国家机关为解决某一公共问题而制定和实施的具有权威性的行为规范、行动准则和活动策略，那么基于此定义，（    ）不属于公共政策。","options":{"A":"中华人民共和国最高人民法院民事判决书","B":"“一带一路”国家战略","C":"《中华人民共和国环境保护法》","D":"2021年中央一号文件"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，中华人民共和国最高人民法院民事判决书是人民法院代表国家行使审判权，对受理的民事案件和经济纠纷案件按照民事诉讼法规定的第一审普通程序或简易程序审理终结后，依照国家的民事法律、法规或经济法律、法规，就解决案件的实体问题作出的具有法律效力的书面文书处理决定。而公共政策是为了解决公共问题，二者并不一致。\nB项正确，“一带一路”战略体现了国内公共政策与国家对外政策的紧密结合，是以调整社会公共利益为目标的国家外交战略，将有助于形成切实有效的、可持续发展的外交政策。属于公共政策。\nC项正确，《中华人民共和国环境保护法》是为保护和改善环境，防治污染和其他公害，保障公众健康，推进生态文明建设，促进经济社会可持续发展，制定的法律。属于公共政策。\nD项正确，2021年2月21日，《中共中央 国务院关于全面推进乡村振兴加快农业农村现代化的意见》，即2021年中央一号文件发布。2021年中央一号文件针对全面推进乡村振兴，加快农业农村现代化，提出了相关举措。属于公共政策。\n本题为选非题，故正确答案为A。","no":29,"missingImage":false},{"qid":"4651971","cat":"科技常识","stem":"目前，上海市加快推进“一网通办”“一网通管”平台建设，通过大数据、云计算、人工智能等技术，让城市变得更智慧，让城市管理“更艺术”，这体现了行政技术有助于：","options":{"A":"行政资源的扩大","B":"行政层级的增加","C":"行政幅度的拓展","D":"行政管理的精细化"},"answer":"D","explanation":"本题考查管理常识。\nA项错误，行政资源是行政组织所拥有的实现组织目标的人力、物力、财力、权力、信息等一切要素的总称。通过大数据、云计算、人工智能等技术，让城市变得更智慧并不会扩大行政资源。\nB项错误，行政层级指的是行政组织中的层次数目。按层级组建的行政组织，被划分为若干层次，形成一个等级分明的金字塔结构，处在塔尖的行政高层通过一个等级垂直链控制着整个行政体系。通过大数据、云计算、人工智能等技术，让城市变得更智慧并不会增加行政层级。\nC项错误，行政幅度又称行政控制幅度，指的是一个层次的行政机构或一位行政领导所能直接、有效控制的下级机构或人员的数目。通过大数据、云计算、人工智能等技术，让城市变得更智慧并不会拓展行政幅度。\nD项正确，行政技术指行政方法当中运用自然科学与工程科学方面的技术；行政管理的精细化就是落实管理责任，将管理责任具体化、明确化，以最大限度地减少管理所占用的资源和降低管理成本为主要目标的管理方式。题中，通过大数据、云计算、人工智能等技术，让城市变得更智慧，让城市管理“更艺术”，体现了行政技术有助于行政管理的精细化。\n故正确答案为D。","no":30,"missingImage":false},{"qid":"4651975","cat":"法律常识","stem":"按照我国《公务员法》对考录制度的规定，国家公务员实行公开考试、竞争择优的进入体制。随着人事制度改革的深化，普通公民经过法定程序进入政府机关将成为经常的、普遍的政治现象。这体现了人事行政具有（    ）的功能与作用。","options":{"A":"巩固国家政权、保持政治稳定","B":"提高行政管理质量和效率","C":"推进政治民主化进程","D":"促进人才国际竞争"},"answer":"C","explanation":"本题考查管理常识。\nA项错误，人事行政作为国家政治制度的重要方面，对整个国家的政治发展和政权建设起着十分重要的作用。科学的人事行政制度能保证政府工作的连续性和正常化，不因领导人的更替或突发事件的发生而影响“行政机器”的运转。这既是政治稳定的一个重要标志，也是影响政治稳定的一个重要因素。该功能与题干表述无关。\nB项错误，所有的行政管理活动以及行政管理过程的各个环节都要通过人去组织进行。公务员的素质与行为对政府管理的质量与效率具有关键作用，甚至决定着政府管理的成败。科学的人事行政管理能造就一支高素质的国家公务员队伍，并能充分调动和发挥他们的积极性、主动性与创造性，从而能最有效地提高行政效率，实现政府的管理目标。该功能与题干表述无关。\nC项正确，按照《公务员法》对考录制度的规定，国家公务员实行公开考试、竞争择优的进入机制，每个公民都有权利报考公务员，经过公开、平等、竞争、择优的录用考试，一部分优秀人才进入公务员队伍，直接参与政府管理工作。普通公民经过法定程序进入政府机关成为经常的、普遍的政治现象，这是政治民主化的重要体现，也是社会主义民主政治的必然要求。\nD项错误，当今世界各国之间的竞争是综合国力的竞争，其实质是科学技术、管理与人力资源的竞争。哪个国家高度重视人才资源的开发和利用，哪个国家就会在国际竞争中处于领先地位。因此，充分开发利用一切人才资源就成为我国在国际竞争中立于不败之地的根本保证。此功能与题干表述无关。\n故正确答案为C。","no":31,"missingImage":false},{"qid":"4651979","cat":"法律常识","stem":"根据我国《立法法》的规定，行政法规公布的形式为：","options":{"A":"由总理签署国务院令公布","B":"由主席签署主席令公布","C":"由国务院法制机构公布","D":"由国务院办公厅公布"},"answer":"A","explanation":"本题考查法律常识。\n根据《立法法》第七十条第一款规定：“行政法规由总理签署国务院令公布。”\n故正确答案为A。","no":32,"missingImage":false},{"qid":"4651983","cat":"人文常识","stem":"我国是人民民主专政的社会主义国家，民主的主体具有广泛性，爱国统一战线就是这种广泛民主性的突出表现。爱国统一战线通过（    ）这一组织形式行使参政议政等民主权利。","options":{"A":"各级人民代表大会","B":"中共中央统一战线工作部","C":"国家统一战线工作委员会","D":"中国人民政治协商会议"},"answer":"D","explanation":"本题考查法律常识。\nD项正确，A、B、C三项错误，中国人民政治协商会议是中国人民爱国统一战线的组织，是中国共产党领导的多党合作和政治协商的重要机构，是我国政治生活中发扬社会主义民主的重要形式，是社会主义协商民主的重要渠道和专门协商机构，是国家治理体系的重要组成部分，是具有中国特色的制度安排。爱国统一战线包括全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者、拥护祖国统一和致力于中华民族伟大复兴的爱国者，其通过中国人民政治协商会议行使参政议政等民主权利。\n故正确答案为D。","no":33,"missingImage":false},{"qid":"4651990","cat":"法律常识","stem":"中国银行保险监督管理委员会是国务院直属事业单位，其主要职责是依照法律法规统一监督管理银行业和保险业，其在行使银行业、保险业监督管理职责时，属于：","options":{"A":"行政机关","B":"受委托组织","C":"被授权组织","D":"行业协会组织"},"answer":"C","explanation":"本题考查法律常识。\nC项正确，A、B、D三项错误，根据《保险法》第一百三十三条规定：“保险监督管理机构依照本法和国务院规定的职责，遵循依法、公开、公正的原则，对保险业实施监督管理，维护保险市场秩序，保护投保人、被保险人和受益人的合法权益。”《商业银行法》第十条规定：“商业银行依法接受国务院银行业监督管理机构的监督管理，但法律规定其有关业务接受其他监督管理部门或者机构监督管理的，依照其规定。”中国银行保险监督管理委员会作为银行业和保险业的监督管理机构，其根据《保险法》和《商业银行法》的授权行使银行业、保险业监督管理职责，属于被授权组织。\n故正确答案为C。","no":34,"missingImage":false},{"qid":"4651998","cat":"科技常识","stem":"电子在原子核外很小的空间内作高速运动，其运动规律跟一般物体不同，没有明确的轨道。因此，人们常用一种能够表示电子在一定时间内在核外空间各处出现机会的模型来描述电子运动,并称之为“电子云”。如图是氢原子的电子云，图中的点表示的含义是：\n\u003cimg data-k=\"95a0c41a2aff\" style=\"max-width:233px\">","options":{"A":"一个电子","B":"电子个数","C":"电子运动的轨迹","D":"电子在核外空间出现的几率"},"answer":"D","explanation":"本题考查科技常识。\nA项错误，电子是一种带有负电的亚原子粒子，通常标记为\u003cimg data-k=\"d5271780e775\">。\nB项错误，电子个数即电子数，代表电子的数量。电子数一般是指原子或离子的核外电子的数目。\nC项错误，D项正确，电子云就是用小黑点疏密来表示空间各电子出现概率大小的一种图形。电子在原子核外很小的空间内作高速运动，其运动规律跟一般物体不同，它没有明确的轨道。根据量子力学中的测不准原理，我们不可能同时准确地测定出电子在某一时刻所处的位置和运动速度，也不能描画出它的运动轨迹。因此，人们常用一种能够表示电子在一定时间内在核外空间各处出现机会的模型来描述电子在核外的运动。在这个模型里，某个点附近的密度表示电子在该处出现的机会的大小。密度大的地方，表明电子在核外空间单位体积内出现的机会多；反之，则表明电子出现的机会少。由于这个模型很像在原子核外有一层疏密不等的“云”，所以，人们形象地称之为“电子云”。\n故正确答案为D。","no":35,"missingImage":false},{"qid":"4651974","cat":"人文常识","stem":"中国的瓷器驰名世界，传统陶瓷是以黏土等天然硅酸盐为主要原料烧成的制品，黏土的主要成分为\u003cimg data-k=\"0573d790a621\">，而广泛用于航空的压电陶瓷材料是锆钛酸铅。下列有关说法错误的是：","options":{"A":"黏土的主要成分也可以表示为\u003cimg data-k=\"d2fc872c1d38\">","B":"陶瓷材料是人类应用最早的硅酸盐材料","C":"唐三彩、秦兵马俑制品属于陶瓷制品","D":"传统陶瓷材料的成分与压电陶瓷材料的成分相同"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，黏土的主要成分为\u003cimg data-k=\"0573d790a621\">，该化学式可以分开写，也可以表示为\u003cimg data-k=\"d2fc872c1d38\">，即黏土主要成分高岭石的化学式。\nB项正确，陶瓷材料是指用天然或合成化合物经过成形和高温烧结制成的一类无机非金属材料，它具有高熔点、高硬度、高耐磨性、耐氧化等优点。陶瓷是人类利用物质特有的属性首先试制成功为自身生活服务的最早的硅酸盐材料，据考古学家发现，远在距今六七千年以前，我国就已经有了陶器。\nC项正确，唐三彩是中国古代陶瓷烧制工艺的珍品，全名唐代三彩釉陶器，是盛行于唐代的一种低温釉陶器，釉彩有黄、绿、白、褐、蓝、黑等色彩，而以黄、绿、白三色为主，所以人们习惯称之为“唐三彩”。秦始皇陵兵马俑大部分是采用陶冶烧制的方法制成，1974年3月，兵马俑被发现。1987年，秦始皇陵及兵马俑坑被联合国教科文组织批准列入《世界遗产名录》，并被誉为“世界第八大奇迹”。\nD项错误，陶瓷材料分为普通陶瓷（传统陶瓷）材料和特种陶瓷（现代陶瓷）材料两大类。传统陶瓷材料采用天然原料如长石、粘土和石英等烧结而成，是典型的硅酸盐材料，主要组成元素是硅、铝、氧，这三种元素占地壳元素总量的90%。压电陶瓷材料属于现代陶瓷材料，常用的压电陶瓷有钛酸钡系、锆钛酸铅二元系及在二元系中添加第三种ABO3(A表示二价金属离子，B表示四价金属离子或几种离子总和为正四价）型化合物。\n本题为选非题，故正确答案为D。","no":36,"missingImage":false},{"qid":"4651978","cat":"科技常识","stem":"生物群落是指在一定时间内一定空间上分布的各物种的种群集合，包括动物、植物、微生物等各物种的种群，共同组成生态系统中有生命的部分。下列不能构成生物群落的是：","options":{"A":"西双版纳热带雨林中的生物","B":"无菌培养基被污染后长出的共生菌落","C":"无菌培养基上接种后长出的大肠杆菌菌落","D":"内蒙古大草原上的生物"},"answer":"C","explanation":"本题考查科技常识。\n一般组成群落的各种生物种群不是任意地拼凑在一起的，而是有规律地组合在一起才能形成一个稳定的群落。群落可理解为居住在一个地区的一切生物所组成的共同体，它们彼此通过各种途径相互作用和相互影响，是不同种群之间通过种间关系（互利共生、竞争、寄生、捕食等）形成的有机整体。\nA项正确，“西双版纳热带雨林中的生物”指的是热带雨林生态系统中各种物种种群的集合，属于群落。\nB项正确，“无菌培养基被污染后长出的共生菌落”是指培养基被污染后自然长出的各种菌类种群的集合，属于群落。\nC项错误，“无菌培养基上接种后长出的大肠杆菌菌落”是在人类干预下产生的大肠杆菌种群，是一个种群，不属于群落。\nD项正确，“内蒙古大草原上的生物”指的是草原生态系统中所有生物种群的集合，属于群落。\n本题为选非题，故正确答案为C。","no":37,"missingImage":false},{"qid":"4651980","cat":"人文常识","stem":"田山歌，作为吴歌形式的一个组成部分，是以稻作文化为基础的一种歌曲形式。稻作文化是人们在农事劳作中产生的一种文化。细数田山歌产生的历史，就能够感受到浓厚的稻作文化。田山歌的原始形态产生于：","options":{"A":"新石器时代的太湖流域","B":"南北朝时期长江下游的江南一带","C":"春秋时期的江浙一带","D":"青铜时代的长江流域"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，B、C、D三项错误。青浦田山歌是上海市青浦区的传统民歌，当地劳动人民在耘稻、耥稻时，由一人领唱，众人轮流接唱的田山歌，又称吆卖山歌、落秧歌、大头山歌。主要流传于青浦区的赵巷、练塘等地区。\n田山歌的历史源头，一直可以追溯到新石器时代。早在七、八千年前，当太湖流域开始有了原始的栽培水稻农业时，包括上海在内的整个吴越水网地区就已经产生了田山歌的原始形态。\n故正确答案为A。","no":38,"missingImage":false},{"qid":"4651989","cat":"人文常识","stem":"我们每个人都有自己的姓氏。在上古三代，姓和氏不同，氏是从姓派生出来的，从汉代开始，姓氏合二为一，考其来历，有多种类别。下列对姓氏来源分类错误的一项是：","options":{"A":"以所封诸侯国为姓氏，如齐、鲁、郑、吴、秦、楚、韩、魏等","B":"以居住地为姓氏，这类姓氏中，复姓较多，如闾丘、西门、东郭等","C":"以技艺为姓氏，如巫、卜、陶、屠等","D":"以社会阶层为姓氏，如司徒、司马、司空、司寇等"},"answer":"D","explanation":"本题考查人文常识。\nA项正确，以所封诸侯国为姓氏，如春秋战国时期的诸侯国，齐、鲁、郑、吴、秦、楚、韩、魏等。\nB项正确，以居住地为姓氏，这类姓氏中，复姓较多，一般都带邱、门、乡、闾、里、郭等字，表示不同环境的居住地点，如闾丘、西门、东郭等。\nC项正确，以技艺为姓氏，古代有一些职业，技术性很强，以技艺传家，用技艺名称命名姓氏，如巫、卜、陶、屠等。\nD项错误，“司徒、司马、司空、司寇”是以官职为姓氏，古代有五官，即司徒、司马、司空、司士、司寇，他们的后代都以这些官职为姓氏。\n本题为选非题，故正确答案为D。","no":39,"missingImage":false},{"qid":"4651994","cat":"人文常识","stem":"下列诗歌各表现了一个传统节日，按节日的先后，排序正确的是：\n①未得渡清浅，相对遥相望\n②昨日登高罢，今朝更举觞\n③海上生明月，天涯共此时\n④日暮汉宫传蜡烛，轻烟散入五侯家","options":{"A":"④①③②","B":"④①②③","C":"①④③②","D":"①④②③"},"answer":"A","explanation":"本题考查人文常识。\n①句出自唐代孟郊的《古意》，意为（牛郎和织女）不能渡过银河（相会），只能遥遥地隔岸相望。表现的节日是农历7月7日七夕节。\n②句出自唐代李白的《九月十日即事》，意为昨天刚登完龙山，今天是小重阳，又要举杯宴饮。表现的节日是农历9月9日重阳节。\n③句出自出自唐代张九龄的《望月怀远》，意为茫茫的海上升起一轮明月，此时你我都在天涯共相望。这首诗是望月怀思的名篇，表现的节日是农历8月15日中秋节。\n④句出自出自唐代韩翃的《寒食》，意为寒食节这天家家都不能生火点灯，但皇宫却例外，天还没黑，宫里就忙着分送蜡烛，除了皇宫，贵近宠臣也可得到这份恩典。表现的节日是寒食节，在清明节前一二日。\n按照节日先后的排序为④①③②。\n故正确答案为A。","no":40,"missingImage":false}]}],"count":35,"answerable":35,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        技术塑造全新的理论范式。大数据技术给公共管理带来了一场新的范式革命，这场范式革命表现在：第一，方法论范式的转型。大数据借助于云平台而具有数据搜集、分析、管理、挖掘和重组的功能，以及基于多类型数据和海量数据的预测功能，从而形成一整套基于大数据技术的方法。此类方法在大数据技术诞生前是完全没有的。其数据能实时更新，且接近于全数据，因此被广泛运用于恐怖主义研究、移民研究、战争与冲突研究、国际反腐败研究等社会科学的各个领域。面对这样一个时代和技术，传统的管理方法如定性和定量研究、比较分析、案例分析等基于“小数据”的研究方法，将更多地为数据挖掘、全数据分析等全新的研究方法所代替。简言之，“大数据+”开创了社会科学研究的新技术和新方法。第二，研究思维范式的转型。过去的案例研究、样本研究体现的是数据“精确性”思维、因果关系思维和定性思维，而借助于大数据技术，现已转向“量化”思维，即以全数据为目标的思维，以“混杂性”思维为形式，以量化数据值之间的“相关关系”为核心内容。单纯的“计算社会科学”也并不完全反映“量化”思维。第三，研究对象的转变。大数据技术诞生前，公共管理的对象是人及其相互关系。人既成为管理对象，也成为管理的工具，结果是人成为管理者的“被管理者”。大数据的公共管理对象是人所有活动所产生的数据，目的是用数据及其产生的价值来为人服务，体现了人本主义管理思想。第四，绩效检验方式的转变。此前，绩效检验的目的是以政策的落实和政策对人发挥规制作用来衡量，但政策是否科学则容易被忽视，而且，往往采取刚性强制手段。就是说政策确实发挥了作用，但人也可能因强制而对政策产生抱怨，甚至有些情况下有些人成为反政策的一员。大数据条件下的绩效检验则强调技术对人的所有社会活动产生的数据进行收集、整理、分析，最终使数据通过服务于人来体现其价值，使人在享受价值服务的过程中自觉维护良好的秩序。\u003c/p>\u003cp>        从具体的实践层面看，也有了变化。第一，大数据技术使公共管理的实践内容从流量管理向数据管理转化。传统的公共管理尤其强调流程的重要性，这主要是基于行政的科层体制。但在实践中，这会慢慢演变成流程的刻板化，效率日趋下降，甚至影响流程的合法性。而大数据技术则专注于对管理对象的数据收集、分析，它管理的对象是数据，核心是对数据进行处理。第二，大数据使公共管理的实践从事后机械应对转向智能化预先治理。传统的方式，无论是管理还是治理，都是出现了问题才采取措施。即便有所谓的预防性治理或预防性管理，也常常非常盲目，甚至可能没有任何针对性。因此，其典型特征就是事后的机械性。大数据条件下则截然不同，其核心就是预测。它通常被视为人工智能的一部分，是把数学算法运用到海量的数据上来预测事情发生的可能性。之所以能够成功，关键在于它是建立在海量数据的基础之上的，而不是基于某个人的主观判断。\u003c/p>","questions":[{"qid":"4651924","cat":"片段阅读","stem":"依据文段，下列判断不正确的一项是：","options":{"A":"大数据极大地改变了我们的研究思维","B":"传统的公共管理方法如定性和定量研究的数据不能实时更新","C":"虽然有大量计算的存在，但大数据不等同于“计算社会科学”","D":"传统的公共管理是“量化”思维"},"answer":"D","explanation":"A项，根据第一段“大数据技术给公共管理带来了一场新的范式革命，这场范式革命表现在······第二，研究中的思维范式转型”可知，大数据改变了我们的研究思维，表述正确，排除；\nB项，根据第一段“大数据借助于云平台······从而形成一整套基于大数据技术的方法。此类方法在大数据技术诞生前是完全没有的。由于其数据能实时更新”可知，数据实时更新属于大数据诞生后的新方法，传统的数据不能实时更新，表述正确，排除；\nC项，根据第一段“而借助于大数据技术，已转向‘量化’思维······单纯的‘计算社会科学’也并不完全反映‘量化’思维”可知，大数据与“计算社会科学”存在差别，表述正确，排除；\nD项，根据第一段“过去的案例研究、样本研究体现的是数据‘精确性’思维、因果关系思维和定性思维，而借助于大数据技术，已转向‘量化’思维”可知，传统的公共管理是“精确性”思维、因果关系思维和定性思维，表述错误，当选。\n本题为选非题，故正确答案为D。\n【文段出处】中国社科网《胡键：大数据技术与公共管理范式的转型》","no":41,"missingImage":false},{"qid":"4651927","cat":"片段阅读","stem":"依据文段，下列陈述不正确的一项是：","options":{"A":"大数据下的公共管理体现了人本思想","B":"传统的公共管理往往有一种强制性","C":"传统的公共管理有预测性","D":"基于大数据的管理是客观的"},"answer":"C","explanation":"A项，根据文章第一段“大数据的公共管理对象是人所有活动所产生的数据，目的是用数据及其产生的价值来为人服务，体现了人本主义管理思想”可知，表述正确，排除；\nB项，根据文章第一段“此前，绩效检验的目的是以政策的落实和政策对人发挥规制作用来衡量，但政策是否科学则容易被忽视，而且，往往采取刚性强制手段”可知，表述正确，排除；\nC项，根据文章第二段“传统的方式，无论是管理还是治理，都是出现了问题才采取措施······其典型特征就是事后的机械性。大数据条件下则截然不同，其核心就是预测”可知，具有预测性的是大数据而非传统方式，偷换概念，当选；\nD项，根据文章第二段“大数据条件下则截然不同······之所以能够成功，关键在于它们是建立在海量数据的基础之上的，而不是某个人的主观判断”可知，表述正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】中国社科网《胡键：大数据技术与公共管理范式的转型》","no":42,"missingImage":false},{"qid":"4651929","cat":"片段阅读","stem":"第一段论述的结构属于：","options":{"A":"递进关系","B":"总分关系","C":"并列关系","D":"条件关系"},"answer":"B","explanation":"文段开篇指出大数据技术给公共管理带来了新的范式革命，接下来通过第一“方法论范式的转型”、第二“研究中的思维范式转型”、第三“研究对象的转变”、第四“绩效检验方式的转变”进行具体论述，故文段属于观点＋解释说明的总分结构，对应B项。\nA项、C项、D项均不属于总分关系，排除。\n故正确答案为B。\n【文段出处】中国社科网《胡键：大数据技术与公共管理范式的转型》","no":43,"missingImage":false},{"qid":"4651932","cat":"片段阅读","stem":"上述文段的核心思想是论：","options":{"A":"大数据技术下公共管理范式的转型","B":"传统公共管理与大数据下公共管理的区别","C":"大数据技术赋予公共管理的特色","D":"传统公共管理向大数据技术管理转变的必要性"},"answer":"A","explanation":"本文围绕“大数据技术”“公共管理”展开，第一自然段从“理论范式”层面介绍了“大数据技术”给“公共管理”带来的四个变化，第二自然段从“实践”层面介绍“大数据技术”给“公共管理”带来的两个变化，故本文从理论、实践两个层面介绍了“大数据技术”给“公共管理”带来的变化，对应A项。\nB项，本文重点强调“大数据技术”给“公共管理”带来的变化，而非两种公共管理的区别，排除；\nC项，“特色”强调独特性、与众不同，而本文强调“大数据技术”给“公共管理”带来的变化，排除；\nD项，“必要性”指传统公共管理必须向大数据技术管理转变，而本文是对“大数据技术”已经给“公共管理”带来变化的客观陈述，偏离重点，排除。\n故正确答案为A。\n【文段出处】中国社科网《胡键：大数据技术与公共管理范式的转型》","no":44,"missingImage":false}]},{"type":"material","material":"\u003cp>        孙坚字文台，吴郡富春人，盖孙武之后也。\u003c/p>\u003cp>        少为县吏。年十七，与父共载船至钱唐，会海贼胡玉等从匏里上掠取贾人财物，方於岸上分之，行旅皆住，船不敢进。坚谓父曰：“此贼可击，请讨之。”父曰：“非尔所图也。”坚行操刀上岸，以手东西指麾，若分部人兵以罗遮贼状。贼望见，以为官兵捕之，即委财物散走。坚追，斩得一级以还。父大惊。由是显闻，府召署假尉。\u003c/p>\u003cp>        会稽妖贼许昌起於句章，自称阳明皇帝，与其子韶扇动诸县，众以万数。坚以郡司马募召精勇，得千馀人，与州郡合讨破之。是岁，熹平元年也。刺史臧旻列上功状，诏书除坚盐渎丞，数岁徙盱眙丞，又徙下邳丞。\u003c/p>","questions":[{"qid":"4651940","cat":"逻辑填空","stem":"孙坚驱散海贼所采用的策略是            。","options":{"A":"虚张声势","B":"分进合击","C":"请君入瓮","D":"擒贼擒王"},"answer":"A","explanation":"第二段“坚行操刀上岸，以手东西指麾，若分部人兵以罗遮贼状。贼望见，以为官兵捕之，即委财物散走”，译为“孙坚就要持刀上岸，用手向东西指挥，好似分派部署人马包抄海盗的样子。盗贼们远远看见，以为官兵来捕捉他们，当即扔下财物四散而逃”，可知孙坚的策略是假造官府的声势，吓唬海贼，对应A项“虚张声势”。\nB项“分进合击”即几股兵力从几条路线攻击一个目标，合作完成围歼任务，C项“请君入瓮”比喻以其人之道还治其人之身，D项“擒贼擒王”即捉贼先捉贼的头领，均与孙坚的策略不符，排除。\n故正确答案为A。\n【文段出处】《三国志卷四十六•吴书一》","no":45,"missingImage":false},{"qid":"4651943","cat":"片段阅读","stem":"本文说明孙坚            。","options":{"A":"足智多谋","B":"智勇双全","C":"勇猛过人","D":"身先士卒"},"answer":"B","explanation":"由第二段“坚行操刀上岸，以手东西指麾，若分部人兵以罗遮贼状”，译为“孙坚就要持刀上岸，用手向东西指挥，好似分派部署人马包抄海盗的样子”，可知孙坚富有智慧。由第二段“坚追，斩得一级以还”，译为“孙坚追去，砍下一个盗贼的首级回来”，第三段“会稽妖贼许昌起于句章，自称阳明皇帝，与其子韶扇动诸县，众以万数。坚以郡司马募召精勇，得千余人，与州郡合讨破之”，译为“熹平元年会稽郡贼人许昌在句章县谋反，自称为阳明皇帝，与他的儿子许韶煽动周围各县，共召集几万人。孙坚以郡司马的身份召兵，共得千余人。与州郡共同合作讨伐并消灭了许昌”，可知孙坚不仅勇追海贼，取得贼人首级，还召兵仅千余人，便与州郡合作消灭几万敌人，均可证明他处事勇敢。故孙坚既有智慧，又很勇敢，对应B项“智勇双全”。\nA项，“足智多谋”即富有智慧，善于谋划，不能体现孙坚处事勇敢，表述片面，排除；\nC项，“勇猛过人”即比别人勇敢，不能体现孙坚的智慧，表述片面，排除；\nD项，“身先士卒”即作战时，将帅亲自上阵，冲在士兵前面，并非文段强调的重点，排除。\n故正确答案为B。\n【文段出处】《三国志卷四十六•吴书一》","no":46,"missingImage":false},{"qid":"4651947","cat":"片段阅读","stem":"“与其子韶扇动诸县”的意思是：","options":{"A":"与他的儿子（许）韶一起煽动各县","B":"参与他的儿子（许）韶煽动各县的阴谋","C":"和他的一个儿子韶扇走动（于）各县","D":"给他一个叫子韶的人去煽动各县（参与起义）"},"answer":"A","explanation":"“与”意思是和，“其”在文中代指许昌，“韶”是许昌儿子的名字，“扇动”同煽动，故全句意思是和他（许昌）的儿子韶一起煽动各县（参与起义），对应A项。\nB项，“与”并非参与之意，排除；\nC项，“韶”为许昌儿子的名字，而非“韶扇”，排除；\nD项，句中“与”并非给的意思，且“韶”为名字，而非“子韶”，排除。\n故正确答案为A。\n【文段出处】《三国志卷四十六•吴书一》","no":47,"missingImage":false},{"qid":"4651949","cat":"片段阅读","stem":"本文的主要内容是：","options":{"A":"说明孙坚的性格特征","B":"讲述孙坚擒拿海贼的故事","C":"描述孙坚投笔从戎的过程","D":"记述孙坚早年的事迹"},"answer":"D","explanation":"第一段介绍孙坚的姓名来历，第二段讲述了孙坚十七岁时平定海贼的事迹，第三段讲述孙坚讨伐并歼灭许昌的事迹，随后得到了皇帝的任命。故本文主要介绍了孙坚年轻时候平定叛乱的事迹，对应D项。\nA项，“性格特征”非重点，排除；\nB项，只对应文中第二段，表述片面，排除；\nC项，文中没有提到“投笔从戎”，排除。\n故正确答案为D。\n【文段出处】《三国志卷四十六•吴书一》","no":48,"missingImage":false},{"qid":"4651917","cat":"逻辑填空","stem":"科技一直在改变社会：通讯技术        了时空的距离，互联网等新科技        了学习知识的成本，人工智能        了越来越多的工作岗位，基因技术        了人类的价值观······这些改变有的已经发生，有的愈演愈烈。\n填入画横线处的词语最恰当的一项是：","options":{"A":"缩短 改变 取代 减少","B":"缩短 减少 取代 改变","C":"减少 取代 缩短 改变","D":"减少 缩短 改变 取代"},"answer":"B","explanation":"第一空，横线处所填词语搭配“时空的距离”，A、B两项“缩短”指使原有长度、距离、时间变短，搭配得当，保留；C、D两项“减少”指减去一部分，与“时空的距离”搭配不当，排除。\n第二空，横线处所填词语搭配“学习知识的成本”，B项“减少”搭配得当，保留；A项“改变”指事物发生显著的差别，置于此处搭配不当，排除。\n第三空，代入验证，B项“人工智能取代工作岗位”搭配得当，保留。\n第四空，代入验证，B项“改变人类的价值观”，搭配得当，当选。\n故正确答案为B。\n【文段出处】《韩少功：文理互盲，还是文理互补》","no":49,"missingImage":false},{"qid":"4651920","cat":"逻辑填空","stem":"真正的精英，有一种夯实金字塔基础的抱负，有一种纠正时代错误的使命感。他们离成功的标尺越远，就越能心无旁骛地实现宏图大志。        ，        精英与世俗意义上的成功无缘，        成功实在        精英坚守自身信念的副产品而已。\n填入画横线处的词语最恰当的一项是：","options":{"A":"当然 不是 就是 只是","B":"当然 不是 而是 不过是","C":"因此 虽然 但是 不过是","D":"因此 虽然 而是 只是"},"answer":"B","explanation":"本题可从第二、三空入手，根据“······精英与世俗意义上的成功无缘”和“成功实在······精英坚守自身信念的副产品而已”可知，前后语义相反，横线处应填入能体现相反关系的关联词，B项“不是······而是······”能体现相反关系，保留。A项“不是······就是······”表示选择关系，排除；C项“虽然······但是······”表示转折关系，填入文段，前后语义相矛盾，排除；D项“虽然······而是······”关联词搭配不当，且填入文段，前后逻辑不符，排除。\n第一空，代入验证，B项“当然”表示合乎情理，没有疑问之意，符合语境，保留。\n第四空，代入验证，“不过是精英坚守自身信念的副产品而已”，符合语境，B项当选。\n故正确答案为B。\n【文段出处】《〈无问西东〉问精英》","no":50,"missingImage":false},{"qid":"4651925","cat":"逻辑填空","stem":"在5000多年文明发展中        的中华优秀传统文化，        着中华民族最深层的精神追求，代表着中华民族        的精神标识。\n填入画横线处的词语最恰当的一项是：","options":{"A":"形成 反映 自主","B":"创造 顺应 崇高","C":"传承 擘画 展示","D":"孕育 积淀 独特"},"answer":"D","explanation":"第一空，搭配“中华优秀传统文化”，且要表达出“文明发展”促使“文化”产生之意。A项“形成”指通过发展变化而成为某种事物或出现或发生某种情况，B项“创造”是指首先想出或做出前所未有的事物，D项“孕育”指怀胎而生育，或指一样事物衍生及帮助了另一样事物的发展生长，均可体现出文化产生之意，保留。C项“传承”指传授、继承，文明发展和文化之间不存在传授和继承的关系，排除。\n第二空，搭配“精神追求”，且要表达出文化带来了中华民族的精神追求之意。D项“积淀”指在长期积累中形成（多用于抽象事物），符合文意，保留。A项“反映”比喻把客观事物的实质表现出来，与文意不符，排除；B项“顺应”指顺着某种趋势去适应，文段未提及文化适应精神追求，且与“精神追求”搭配不当，排除。\n第三空，代入验证，“独特的精神标识”搭配恰当，D项当选。\n故正确答案为D。\n【文段出处】《【每日一习话】文化自信是更基础、更广泛、更深厚的自信》","no":51,"missingImage":false},{"qid":"4651930","cat":"逻辑填空","stem":"一部真正意义上的通史，决非只是对史事的            ，而是要努力探求历史变迁的内在联系。所以通史不仅指史事在时序上的先后承继、转合        ，而且还包括历史文化中各重要问题的        与变迁的            ，即所谓“通古今之变，成一家之言”。\n填入画横线处的词语最恰当的一项是：","options":{"A":"客观描述 变幻 沿革 理性诠释","B":"客观演绎 变幻 延革 感性抒发","C":"主观判断 变换 延革 理性描述","D":"主观诠释 变换 沿革 客观评价"},"answer":"A","explanation":"第一空，根据“决非只是······而是”可知，横线处与后文“探求历史变迁的内在联系”应构成反义关系，即横线处要体现出没有人为干预的意思，A项“客观描述”、B项“客观演绎”均符合文意，保留。C项“主观判断”、D项“主观诠释”均侧重强调人为干预，与文意相悖，排除。\n第二空，A、B两项均为“变幻”，保留。\n第三空，根据“先后承继”“变迁”等可知，横线处要体现出问题的延续，A项“沿革”指事物发展、变化的历程，保留。B项“延革”为词语的误用，实际词典中不存在这一词语，误用后与“沿革”含义一致，保留。\n第四空，依据文段主题词“通史”可知，“通史”的特点应该是客观严谨，A项“理性诠释”能体现出“通史”客观性这一特点，当选。B项“感性抒发”与通史客观的特性不符，排除。\n故正确答案为A。\n【文段出处】蒋廷黻-《中国近代史》","no":52,"missingImage":false},{"qid":"4651938","cat":"逻辑填空","stem":"“两弹一星”功勋奖章获得者于敏院士回忆起研发的往事时说：“一个人的名字，早晚是要没有的，能把        的力量融进祖国的强盛之中，便足以自慰了。”这样的            至今仍            。\n依次填入画横线处的词语最恰当的一项是：","options":{"A":"单薄 金玉良言 振聋发聩","B":"微薄 金玉良言 掷地有声","C":"微薄 肺腑之言 掷地有声","D":"单薄 肺腑之言 振聋发聩"},"answer":"C","explanation":"第一空，根据于敏院士的话和横线后“融进祖国的强盛之中”可知，于敏院士认为个人荣誉不重要，应以国家为重，故横线处要体现祖国强盛之中的一股小小力量，A、D两项“单薄”多形容穿衣少或身体瘦弱，B、C两项“微薄”指微小单薄，“微薄”更贴合文意且“微薄的力量”属于常见搭配，保留B、C两项，排除A、D两项。\n第二空，横线处指代前文于敏院士的话，B项“金玉良言”指像黄金和美玉一样宝贵的忠告或教诲，C项“肺腑之言”指发自内心的真诚的话，根据文意，这句话是于敏院士对研发“两弹一星”时的感慨，并非对他人的忠告和教诲，两项对比，“肺腑之言”更贴合文意，保留C项，排除B项。\n第三空，代入验证，C项“掷地有声”形容话语铿锵有力，符合文意，当选。\n故正确答案为C。\n【文段出处】《他从不以“中国氢弹之父”自居》","no":53,"missingImage":false},{"qid":"4651944","cat":"语句表达","stem":"下列句子中，语序最恰当的是：","options":{"A":"参加集体婚礼的新人们今天早上都在滨江大道上在摄像机镜头前向大家笑容甜蜜地挥手致意。","B":"今天早上都在滨江大道上参加集体婚礼的新人们在摄像机镜头前笑容甜蜜地向大家挥手致意。","C":"在滨江大道上参加集体婚礼的新人们今天早上都在摄像机镜头前笑容甜蜜地向大家挥手致意。","D":"今天早上在滨江大道上参加集体婚礼的新人们都在摄像机镜头前笑容甜蜜地向大家挥手致意。"},"answer":"D","explanation":"根据选项内容可知，均为记叙的内容，依据记叙文六要素，应按照“时间、地点、人物、事情的起因、经过、结果”的顺序。“今天早上”为时间，“在滨江大道上”为地点，“参加集体婚礼的新人们”为人物，“在摄像机镜头前笑容甜蜜地向大家挥手致意”为事件，对应D项。\nA项，“参加集体婚礼的新人们今天早上都在滨江大道上在摄像机镜头前”语序错误，时间、地点应该放到人物之前，排除；\nB项，“今天早上都在滨江大道上参加集体婚礼的新人们”语序错误，“都”应该放在主语“新人们”之后，排除；\nC项，“在滨江大道上参加集体婚礼的新人们今天早上都在摄像机镜头前”语序错误，时间应该放到地点之前，排除。\n故正确答案为D。","no":54,"missingImage":false},{"qid":"4651913","cat":"语句表达","stem":"下列句子中，有语病的是：","options":{"A":"有人戏言，人生最大的修行就是饥来餐饭倦来眠。作者在这本书中介绍了九十四道地方美食、九十四段独属于他的乡愁和对过往的回忆。","B":"随着海平面的上升，旅游胜地马尔代夫正面临灭顶的威胁。近年来，他们的旅游营销口号是：“趁我们还在这里，快来看看吧。”","C":"欧阳修的文学成就，在我国文学史上享有很高的地位，称他为北宋诗文革新运动的领袖和文坛盟主是实至名归的。","D":"“厦庇五洲客，门纳万顷涛。”九月的厦门，草木葱茏，生气勃勃。"},"answer":"C","explanation":"C项，“文学成就”与“地位”搭配不当，应改为“欧阳修在我国文学史上享有很高的地位······”，存在语病，当选。\nA、B、D三项均表意明确，没有语病，排除。\n故正确答案为C。","no":55,"missingImage":false},{"qid":"4651928","cat":"片段阅读","stem":"下列选项中，两句话表达的意思不一致的是：","options":{"A":"（1）敢于这样做的人，难道不是一个英雄吗？（2）敢于这样做的人，肯定就是一个英雄。","B":"（1）看到这一幕，有谁会感到滑稽可笑呢？（2）看到这一幕，没有谁不感到滑稽可笑的。","C":"（1）谁说癌症是不可治愈的绝症？（2）癌症并非是不可治愈的绝症。","D":"（1）只要天不塌下来，他就会来。（2）除非天塌下来，他才会不来。"},"answer":"B","explanation":"A项，两句话意思均为“敢于这样做的人是英雄”，意思一致，排除；\nB项，（1）句为反问句，意思为“看到这一幕，没有人会感到滑稽可笑”，（2）句意思为“看到这一幕谁都会感到滑稽可笑”，意思不一致，当选；\nC项，两句话意思均为“癌症是可以治愈的”，意思一致，排除；\nD项，两句话意思均为“他会来”，意思一致，排除。\n本题为选非题，故正确答案为B。","no":56,"missingImage":false},{"qid":"4651935","cat":"片段阅读","stem":"下列几个句子按顺序排列，语意最连贯的是：\n①也就是通过人格的自我完善来达到永恒的生命境界\n②这种感觉所带来的，决不仅仅是无可奈何的缕缕忧伤\n③而更多地浸透着珍惜时光、热爱生命的积极进取精神\n④正如诗中所写：“老冉冉其将至兮，恐修名之不立。”\n⑤以及由此而产生的时不我待、分秒必争的急切心情","options":{"A":"④①②③⑤","B":"④⑤②③①","C":"②④③①⑤","D":"②③①⑤④"},"answer":"D","explanation":"对比选项，确定首句。②句提到“这种感觉”，④句提到“正如诗中所写”，两句均有不适合作首句的特征，但从选项设置来看首句必须为二者之一，此时可观察②④两句前的指代或论证内容在所给的语句中是否出现，若有其指代或论证内容，则不合适作首句。对比可知，④句“老冉冉其将至兮，恐修名之不立”意思是我觉得老境将要渐渐到来，只担心美好的名声来不及树立，强调要有一种紧迫感、用好每一分每一秒，为⑤句的举例论证，因此④句不适合作首句；②句前应提及“某种感觉”，在已给语句中并无关于此话题的论述，故对比之下②句可作为首句，排除A、B两项。\n根据⑤④两句构成捆绑，锁定D项。\n故正确答案为D。\n【文段出处】《中国古典诗歌中“生命意识”的内涵与泛化》","no":57,"missingImage":false},{"qid":"4651942","cat":"语句表达","stem":"下列语句中理解上会产生歧义的是：","options":{"A":"我国的火箭目前只有一个名称，统一叫“长征”，如长征一号、长征二号、长征三号等，每个型号还根据发射的不同产品及轨道辅以ABCDE等系列。","B":"清代李渔在美食鲜蔬中很是推崇蕈，他认为“食此物者，犹吸山川草木之气，未有无益于人者也”。","C":"党的十九大闭幕不久，部分省市人大代表、政协委员就认真学习、座谈，畅谈自己的体会。","D":"被雨水洗刷过的天空分外澄净，被雨水冲洗过的树木更显青翠。"},"answer":"C","explanation":"C项，“部分”的修饰内容会产生歧义，可能是部分省市，也可能是省市的部分人大代表和政协委员，存在歧义，当选。\nA、B、D三项均无歧义，表述正确，排除。\n故正确答案为C。","no":58,"missingImage":false},{"qid":"4651960","cat":"片段阅读","stem":"抚今追昔，历史的车轮总会在字里行间留下深浅不一的痕迹，文字的变迁也在响应一个时代的风起云涌，并与之同频共振。殷商的甲骨文，证实了一个王朝的存在，并烙刻下诸多与国运生死攸关的大事；秦朝的小篆，见证了一统江山的恢宏，并因为“书同文”的国策实现了从多元向一元的转变；五四时期的白话文，记录了救亡图存的革命者为探寻出路而前赴后继、上下求索的历史，并在新文化运动的号召下焕然一新，顺应时代大势所趋。\n对上文意思概括最为准确的是：","options":{"A":"语言文字折射并记录时代，同时也为时代所重塑和改变","B":"语言文字是时代最为活跃的要素，促进了时代的发展","C":"时代的发展和社会的进步使语言文字更加丰富","D":"任何时代都会有鲜明的政治、经济、文化特色，语言文字也不例外"},"answer":"A","explanation":"文段开篇提出观点，“历史的车轮总会在字里行间留下深浅不一的痕迹”，即历史会影响文字；另外，“文字的变迁也在响应一个时代的风起云涌，并与之同频共振”，即文字的变迁也能反映时代的特征。接着通过殷商的甲骨文、秦朝的小篆、五四时期的白话文这三个例子论证了前文观点。故文段重点在文段开篇观点句，即文字和时代的相互影响，对应A项。\nB项，“语言文字是时代最为活跃的要素”文段未提及，无中生有，且未体现文字也会随时代而变迁之意，表述片面，排除；\nC项，未体现文字会见证并记录时代之意，表述片面，排除；\nD项，“任何时代都会有鲜明的政治、经济、文化特色”文段未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】《尊重语言，就是尊重我们自己》","no":59,"missingImage":false},{"qid":"4651952","cat":"语句表达","stem":"放眼知识原野，遍布鲜花秀草，亦多毒木荆棘。鱼龙混杂，良莠并存。古人说：“                    。”只有不唯书、戒盲从、善思考、勤探究，才能了解真相、认识规律、掌握真理。此乃读书之大道、治学之根本。\n在横线中应填入的最恰当的一项是：","options":{"A":"人皆知以食愈饥，莫知以学愈愚","B":"尽信书，则不如无书","C":"六经三史，诸子百家，非无可观，皆足为治","D":"读书之法无他，惟是笃志虚心，反复详玩，为有功耳"},"answer":"B","explanation":"横线出现在文段中间，需要结合前后文内容进行分析。前文指出知识有好也有坏，后文指出不能一味相信书本，要善于思考，故横线处表达书的内容有好有坏，不能一味相信书本，B项“尽信书，则不如无书”意思是读书不要拘泥于书上或迷信书本，与前后文衔接恰当，当选。\nA项，“人皆知以食愈饥，莫知以学愈愚”意思是人们都知道用食物去解决饥饿，却不知道用学习来驱除愚昧，文段并未体现用学习来驱除愚昧，与前后文衔接不当，排除；\nC项，“六经三史，诸子百家，非无可观，皆足为治”意思是六经三史以及诸子百家的著作，并不是没有可以效法的，而且依照这些史籍所阐述的道理都足以治理好国家，侧重借助书籍可以治理国家，与前后文衔接不当，排除；\nD项，“读书之法无他，惟是笃志虚心，反复详玩，为有功耳”意思是读书的方法没有别的，只有专心致志，虚心探索，深刻领会，才能收到成效，侧重读书要专心，与前后文衔接不当，排除。\n故正确答案为B。\n【文段出处】新华网《励学赋》","no":60,"missingImage":false},{"qid":"4651915","cat":"片段阅读","stem":"运气学说，是探讨自然变化的周期性规律及其对人体健康和疾病影响的一门学问。这里讲的周期性规律，是基于自然界六气六律和五气更立的六、五节律，即五运六气节律。运气学说认为，天人合一是天人间动态节律的同步和谐，这是人体健康的基础，而天人合一的失调是一切疾病产生的根本原因。《黄帝内经》中的五运六气学说，传承发挥了中华文明的五六之律，凝聚了黄帝时代的文化精粹，是黄帝文化的活化石，故能成为打开中华文明宝库的钥匙。\n上面文字说明的重点是：","options":{"A":"运气学的丰富内涵","B":"研究运气学的意义","C":"“五运六气”在中华传统文化中的地位","D":"运气学探讨的“五运六气”的出处"},"answer":"C","explanation":"文段开篇引出“运气学说”这一概念，并指出“运气学说”中的“周期性规律”是基于“五运六气节律”而建立，进而引出“五运六气节律”这一话题。紧接着从运气学说中“天人合一”的和谐以及失调正反两个方面指出“节律”的重要性。尾句从《黄帝内经》来阐述“五运六气”传承中华文明的五六之律，凝聚黄帝时代的文化精粹，并通过“故”对前文进行总结，强调“五运六气”是打开中华文明宝库的钥匙，对应C项。\nA项，“运气学的丰富内涵”对应首句引出话题部分，非重点，排除；\nB项，“研究运气学的意义”文段未提及，无中生有，排除；\nD项，“‘五运六气’的出处”文段未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】光明日报《为什么说中医药学是打开中华文明宝库的钥匙》","no":61,"missingImage":false},{"qid":"4651922","cat":"片段阅读","stem":"一部人类文明史，就是国与国之间不断对外开放的历史。无数事实已经昭示，唯有对外开放，才能顺应和平、发展、合作、共赢的时代潮流，才能契合各国追求发展的共同愿望。然而，各个国家的发展终究不是在同一起跑线上，有些国家已经步入发达国家行列，总担心别人“分肥”自己的发展红利，于是贸易壁垒搭起、单边主义盛行。把门关起来的逆向操作，只会拉开距离、产生摩擦。所以，要“坚持‘拉手’而不是‘松手’，坚持‘拆墙’而不是‘筑墙’”。\n关于上文所运用的写作手法，下列分析不正确的一项是：","options":{"A":"文段起笔运用概述历史的方式，阐明了开放才是国家文明的表现","B":"“把门关起来的逆向操作，只会拉开距离、产生摩擦”形象分析了建壁垒逆潮流而动的后果","C":"“坚持‘拆墙’而不是‘筑墙’”，既有引用，又有比喻和对比","D":"文段中的“拆墙”喻指有些国家实行的单边主义政策的自私本质"},"answer":"D","explanation":"A项，根据首句“一部人类文明史，就是国与国之间不断对外开放的历史”可知，“文章起笔运用概述历史的方式”表述正确，排除；\nB项，“把门关起来的逆向操作，只会拉开距离、产生摩擦”中“把门关起来的逆向操作”对应“建壁垒逆潮流而动”，“只会拉开距离、产生摩擦”对应“后果”，表述正确，排除；\nC项，“坚持‘拉手’而不是‘松手’，坚持‘拆墙’而不是‘筑墙’”引用自习近平主席在主旨演讲中所用的佳喻，并且“拆墙”和“筑墙”之间形成一组对比，故“既有引用，又用了比喻和对比”，表述正确，排除；\nD项，根据“坚持‘拆墙’而不是‘筑墙’”可知，“拆墙”是一种积极的措施，强调要打破贸易壁垒，故与文意相悖，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《【光明网评】对外开放，始终是中国发展的关键词》","no":62,"missingImage":false},{"qid":"4651933","cat":"片段阅读","stem":"生活的起起落落，其实和四时变换是一样的道理，生活总会有高潮和低谷，但即便在低谷之中，我们也不必感到悲伤，在对未来的期待中，我们永远拥有不灭的希望。与此同时，我们也能用行动为自己赋予渡过难关的力量。\n上述内容用一句诗来表达，最恰当的是：","options":{"A":"三十功名尘与土，八千里路云和月","B":"仰天大笑出门去，我辈岂是蓬蒿人","C":"人有悲欢离合，月有阴晴圆缺","D":"长风破浪会有时，直挂云帆济沧海"},"answer":"D","explanation":"文段开篇说明生活有高潮和低谷，接着通过转折标志词“但”强调在低谷时，我们要充满希望，并通过实际行动渡过难关。故文段重在强调希望与行动。D项“长风破浪会有时，直挂云帆济沧海”意为相信总有一天，我们能乘长风破万里浪，高高挂起云帆，在沧海中勇往直前，体现了面对困难时不绝希望，勇于拼搏，与文段重点相符，当选。\nA项，“三十功名尘与土，八千里路云和月”意为多年功名犹如尘土微不足道，还需披星戴月付出更大的努力，强调要建功立业，精忠报国，偏离文段中心，排除；\nB项，“仰天大笑出门去，我辈岂是蓬蒿人”意为仰面朝天纵声大笑着走出门去，我怎么会是长期身处草野之人，表现出狂傲自负与踌躇满志的人物形象，偏离文段中心，排除；\nC项，“人有悲欢离合，月有阴晴圆缺”意为人们有离别的痛苦、团聚的欢欣，月亮也会有阴伏晴出、团圆亏损，强调人事总处在变化之中，有好的时候也有不好的时候，对应“四时变换”，为转折之前的内容，非重点，排除。\n故正确答案为D。\n【文段出处】《阴霾终究会被阳光驱散 困难终究会被努力打败》","no":63,"missingImage":false},{"qid":"4651948","cat":"片段阅读","stem":"单层石墨烯的透光率高达97.7%，肉眼看过去几乎是完全透明的。它有着绝佳的导热性，热传导能力是金刚石的两倍以上。石墨烯的机械强度极大，比钢铁还要强200倍，如果把1平方米的单层石墨烯做成一张吊床，区区0.34纳米的厚度便可以稳稳地承载一只猫。石墨烯的导电性比银和铜还强，载流子迁移率比碳纳米管和硅还高。\n上面文字表明：","options":{"A":"石墨烯的用途非常广泛","B":"石墨烯有许多普通材料不具备的优异性质","C":"人们对石墨烯的应用寄予厚望","D":"人们对石墨烯的研究已取得重大突破"},"answer":"B","explanation":"文段开篇指出石墨烯的透光率非常高，接着说明其热传导能力强于金刚石，并指出其机械强度高于钢铁、导电性优于银和铜、载流子迁移率比碳纳米管和硅还高，故文段为并列结构，强调石墨烯的各种性质优于其他材料，对应B项。\nA项，“用途”仅对应“把1平方米的单层石墨烯做成一张吊床”，无法概括全文，表述片面，排除；\nC项“人们对石墨烯的应用寄予厚望”、D项“取得重大突破”文段均未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《石墨烯，潜在应用令人惊喜》","no":64,"missingImage":false},{"qid":"4651955","cat":"片段阅读","stem":"社会变迁常是发生在旧有社会结构不能应付新环境的时候。新的环境发生了，人们最初遭遇到的是旧方法不能获得有效的结果，生活上发生了困难。人们不会在没有发觉旧方法不适用之前就把它放弃的。旧的生活方法有习惯的惰性。但是如果它已不能答复人们的需要，它终必会失去人们对它的信仰，守住一个没有效力的工具是没有意义的，会引起生活上的不便，甚至蒙受损失。另一方面，新的方法却又不是现存的，必须有人发明，或是有人向别种文化去学习、输入。此外，还得经过实验，才能被人接受，完成社会变迁的过程。\n概括文段的主要内容，以下选项恰当的是：","options":{"A":"社会变迁是如何发生的","B":"新旧社会结构的交替","C":"社会环境如何适应时代发展","D":"社会生活习惯的改变与文化输入"},"answer":"A","explanation":"文段开篇指出社会变迁发生在旧有社会结构不能应付新环境的时候，接着进行详细的解释，即旧方法不能获得有效的结果就会失去人们对它的信仰，后文通过并列关联词“另一方面”指出有人发明新方法并经过试验后，才会完成社会变迁。文段意在强调发生社会变迁的过程，对应A项。\nB项“新旧社会结构”、C项“社会环境”、D项“社会生活习惯”均缺少主题词“社会变迁”，排除。\n故正确答案为A。\n【文段出处】《乡土中国》名实的分离","no":65,"missingImage":false}]}],"count":25,"answerable":25,"pointsOf":24},{"label":"数量关系","items":[{"type":"material","material":"\u003cp>        上海市以“双千兆宽带城市”建设为基础，打造“一网通办”“一网统管”现代化城市治理体系。目前固定宽带光纤实现全市99%家庭覆盖，平均下载速率和千兆用户渗透率均排名全国第一，5G基站总量同样位列全国第一。5G基站建设过程中，至2020年8月底，上海市P区共布设5G室外基站7246个，较同年3月增长75.24%。\u003c/p>\u003cp>\u003cimg data-k=\"459426c1c4e1\" style=\"max-width:611px\">\u003c/p>\u003cp>        Mbps是Megabits per second的缩写，MB/s是MegaByte per second的缩写，都是传输速率单位，指每秒传输的位（比特）数量。换算关系为1Mbps=0.125MB/s。\u003c/p>\u003cp>\u003cimg data-k=\"6e8be410ae4a\" style=\"max-width:682px\">\u003c/p>","questions":[{"qid":"4651977","cat":"数学运算","stem":"2016年，上海固定宽带可用下载速率约为（    ）MB/s。","options":{"A":"1.41","B":"1.75","C":"2.57","D":"1.62"},"answer":"B","explanation":"定位表格材料可得：2016年，上海固定宽带可用下载速率为14.03Mbps。定位文字材料可得：1Mbps=0.125MB/s。故2016年，上海固定宽带可用下载速率为\u003cimg data-k=\"d178f890871d\">MB/s。\n故正确答案为B。","no":66,"missingImage":false},{"qid":"4651985","cat":"数学运算","stem":"2020年8月底，P区5G室外基站布设总量在全市5G室外基站布设总量的占比位于（    ）区间内。","options":{"A":"[0，20%]","B":"(20%，40%]","C":"(40%，60%]","D":"(60%，100%]"},"answer":"B","explanation":"根据题干“2020年8月底······占比位于······区间内”，可判定本题为现期比重问题。定位文字材料可得：至2020年8月底，上海市P区共布设5G室外基站7246个。定位图形材料可得：2020年8月，上海电信、上海移动、上海联通分别布设5G室外基站8114个、10024个、8523个。故2020年8月底，P区5G室外基站布设总量在全市5G室外基站布设总量的占比\u003cimg data-k=\"4595d8037c71\">\u003cimg data-k=\"217edcf01054\">，位于(20%,40%]的区间内。\n故正确答案为B。","no":67,"missingImage":false},{"qid":"4651993","cat":"数学运算","stem":"2020年3—7月，上海移动5G室外基站的月平均增长量约为（    ）个。","options":{"A":"699","B":"1609","C":"2212","D":"2795"},"answer":"A","explanation":"根据题干“······的月平均增长量”，可判定本题为年均增长量计算问题。定位图形材料可得：2020年3月上海移动5G室外基站为6436个，2020年7月上海移动5G室外基站为9231个。故2020年3—7月，上海移动5G室外基站的月平均增长量\u003cimg data-k=\"ff31d88cbe11\">\u003cimg data-k=\"fd23abfb9e49\">\u003cimg data-k=\"b6631ad148fe\">个，最接近A项。\n故正确答案为A。","no":68,"missingImage":false},{"qid":"4651996","cat":"数学运算","stem":"2016—2019年，上海固定宽带可用下载速率的年增长率变化情况是：","options":{"A":"先上升后下降","B":"先下降后上升","C":"一直上升","D":"一直下降"},"answer":"A","explanation":"根据题干“2016—2019年······的年增长率变化情况”，可判定本题为一般增长率比较问题。定位表格材料，根据公式：增长率\u003cimg data-k=\"149f10477bbc\">，2016年增长率\u003cimg data-k=\"0a9f8674a6dc\">\u003cimg data-k=\"8a782807590d\">；2017年增长率\u003cimg data-k=\"42f9fce03b9f\">\u003cimg data-k=\"390108932daf\">；2018年增长率\u003cimg data-k=\"6dcd17fcfa4a\">\u003cimg data-k=\"760a7559a438\">；2019年增长率\u003cimg data-k=\"9f3c60fdce91\">\u003cimg data-k=\"79b03a63eaf6\">。可知增长率在2016—2018年上升，2018—2019年下降，即先上升后下降。\n故正确答案为A。","no":69,"missingImage":false},{"qid":"4651999","cat":"数学运算","stem":"结合材料所给数据，下列选项正确的是：","options":{"A":"2020年3月，三大运营商在上海5G室外基站总量超过20000个","B":"2020年3月，P区共布设5G室外基站超过4000个","C":"2020年8月，上海移动的5G室外基站总量占三大运营商上海室外总基站比重低于30%","D":"2015—2019年，北京固定宽带可用下载速率逐年提升，且提升量逐年下降"},"answer":"B","explanation":"A项：定位图形材料可得：2020年3月三大运营商在上海5G室外基站总量为6517+6436+5457=18410个，小于20000个，错误；\nB项：定位文字材料可得：至2020年8月底，上海市P区共布设5G室外基站7246个，较同年3月增长75.24%，则2020年3月，P区共布设5G室外基站数为：\u003cimg data-k=\"00e80c83c769\">个，超过4000个，正确；\nC项：定位图形材料可得：2020年8月，上海移动的5G室外基站总量为10024个，三大运营商上海室外总基站总量为：8114+10024+8523=26661个，所占比重为：\u003cimg data-k=\"82b5a3f6ab6c\">，高于30%，错误；\nD项：定位表格材料，直接查找数据，2015—2019年北京固定宽带可用下载速率逐年提升，每年提升量为：2016年，12.93-10.6=2.33；2017年，20.04-12.93=7.11；2018年，31.3-20.04=11.26；2019年，43.3-31.3=12。提升量逐年上升，并非逐年下降，错误。\n故正确答案为B。","no":70,"missingImage":false
