ion":"第一步：找出论点和论据。\n论点：中老年人适当增加睡眠时长，可以预防失智的发生。\n论据：从中年至老年（50岁至70岁间）一直处于较短睡眠模式（即每晚睡眠时长少于6小时）的人，失智风险会增加30%。\n本题论点和论据都在讨论睡眠时长与失智的关系，话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项指出睡眠时间过长的不良表现，与论点讨论的适当增加睡眠时长可以预防失智无关，为无关项，无法削弱，排除；\nB项：该项指出睡眠时间变短的原因，与论点讨论的适当增加睡眠时长可以预防失智无关，为无关项，无法削弱，排除；\nC项：该项指出心血管代谢问题和精神疾患等都会引起失智，与论点讨论的适当增加睡眠时长可以预防失智无关，为无关项，无法削弱，排除；\nD项：该项指出失智和睡眠时长无关，那么中老年人适当增加睡眠无法预防失智，削弱论点，当选。\n故正确答案为D。","no":94,"missingImage":false},{"type":"question","qid":"4652264","cat":"逻辑判断","stem":"研究人员以某大型科技公司办公区为观察对象，探索工作场所各方面因素对员工工作效率的影响。研究者发现，与坐在墙旁的人相比，位置靠窗的员工工作效率更高，精力更集中，座位面对整个房间，且视线范围内的办公桌相对较少的员工更加专注和高效。研究人员认为，办公室布局会影响员工的工作专注力和工作效率。\n以下各项如果为真，哪项不能支持研究者的结论？","options":{"A":"自然光可调节人的生物节律，位置靠窗的员工更多接受自然光照射，上班时精力更加充沛","B":"优秀的员工对于工位有更多的选择权，而新入职的员工往往被安排在靠墙或门口位置","C":"如果员工视线范围内可以看到很多同事，会很容易分心，而且容易被别的同事之间的沟通所打扰","D":"办公室空气污染比户外严重，远离窗户的员工更容易因空气污染而头疼疲倦，影响办公效率"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：办公室布局会影响员工的工作专注力和工作效率。\n论据：与坐在墙旁的人相比，位置靠窗的员工工作效率更高，精力更集中，座位面对整个房间，且视线范围内的办公桌相对较少的员工更加专注和高效。\n本题论点论据讨论的均是办公室布局与员工的工作专注力和工作效率之间的关系，二者话题一致，加强优先考虑补充论据，且本题为选非题，排除三个能够加强的选项即可。\n第二步：逐一分析选项。\nA项：该项说明自然光照射可以让位置靠窗的员工精力更加充沛，证明办公室布局确实会影响员工的工作效率，补充论据，可以加强，排除；\nB项：该项说明不是办公室布局影响了员工的工作效率，而是工作能力强的员工拥有更多的工位选择权，将论点的原因和结果相颠倒，属于因果倒置，可以削弱，当选；\nC项：该项说明如果员工视线范围内有较多同事，容易被打扰，证明办公室布局确实会影响员工的工作专注力，补充论据，可以加强，排除；\nD项：该项说明空气质量不好会影响工作效率，证明办公室布局确实会影响员工的工作效率，补充论据，可以加强，排除。\n本题为选非题，故正确答案为B。","no":95,"missingImage":false},{"type":"question","qid":"4652218","cat":"逻辑判断","stem":"咖啡因是一种中枢神经系统兴奋剂，通过与腺苷受体竞争性结合等机制，刺激神经元活性，间接影响多巴胺等的释放，从而增强注意力和认知控制，有助于我们完成常规的没有挑战性的任务。不过在需要创造性地解决问题时，增强的认知控制和自发想法缺一不可，而后者有时是可遇不可求的。\n根据上述材料，以下推论正确的是：","options":{"A":"发明家的脑子里经常自发冒出很多新奇的点子","B":"咖啡因直接作用于大脑，能提神醒脑促进记忆","C":"面对枯燥无趣的常规工作时，咖啡或许能提高效率","D":"作为神经系统兴奋剂的咖啡，也会导致失眠和心跳过速"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干中并未涉及发明家是否有新奇点子的表述，无中生有，排除；\nB项：根据题干第一句可知，咖啡因直接与腺苷受体竞争性结合，增强了注意力和认知控制，但并未提及记忆，无中生有，排除；\nC项：题干第一句指出咖啡因可以增强注意力和认知控制，有助于完成常规的没有挑战性的任务，可以推出咖啡因有助于完成枯燥无趣的常规工作，即咖啡或许能提高枯燥无趣工作的效率，当选；\nD项：题干中并未涉及咖啡是否会导致失眠和心跳过速的表述，无中生有，排除。\n故正确答案为C。","no":96,"missingImage":false},{"type":"question","qid":"4652295","cat":"类比推理","stem":"中华世纪坛举办“岁月夏宫展”期间，某志愿服务分队有15名队员担任讲解员。关于这15名讲解员是否去过俄罗斯夏宫，有如下断定：\n（1）所有队员都去过俄罗斯夏宫；\n（2）队员清仪去过俄罗斯夏宫；\n（3）有的队员去过俄罗斯夏宫；\n（4）有的队员没去过俄罗斯夏宫。\n后来，经详细核查，得知上述断定中只有两个为真。据此，可必然推出：","options":{"A":"队员清仪去过俄罗斯夏宫","B":"有队员没去过俄罗斯夏宫","C":"队员们都去过俄罗斯夏宫","D":"队员们都没去过俄罗斯夏宫"},"answer":"B","explanation":"本题属于真假推理题。\n第一步：找出题干矛盾关系。\n题干条件（1）中“所有队员都去过俄罗斯夏宫”和条件（4）“有的队员没去过俄罗斯夏宫”是一组矛盾关系，必有一真必有一假。\n第二步：看其余。\n已知条件中两句真话、两句假话，除去条件（1）、（4）这一组矛盾关系中的一真一假，题干条件中（2）“队员清仪去过俄罗斯夏宫”和条件（3）“有的队员去过俄罗斯夏宫”中也应该必有一真必有一假。\n可以通过假设法来确定：如果假设条件（2）“队员清仪去过俄罗斯夏宫”为真，则可以推出有队员去过俄罗斯夏宫，此时条件（3）“有的队员去过俄罗斯夏宫”也是真的，与上文推理的条件（2）和条件（3）中一真一假不符。因此，题干条件（2）“队员清仪去过俄罗斯夏宫”为假，即队员清仪没去过俄罗斯夏宫，排除A项；也可以推出有的队员没去过俄罗斯夏宫，B项为真，当选；根据条件（2）为假，可得条件（3）为真，即“有的队员去过俄罗斯夏宫”，排除D项；另外根据条件（2）为假，可得条件（1）“所有队员都去过俄罗斯夏宫”就是假话，排除C项。\n故正确答案为B。","no":97,"missingImage":false},{"type":"question","qid":"4652293","cat":"逻辑判断","stem":"要稳定地提高在逻辑考试上的成绩，关键是要在基本概念上有真正的理解，如果没有真正的理解，即使投入再多的精力，做再多的练习，也不可能取得真正稳定的好成绩。\n以下各选项中，除了哪项外，都表达了与上述言论相同的意思？","options":{"A":"只有在基本概念上有真正的理解，才能取得真正稳定的好成绩","B":"除非在基本概念上有真正的理解，否则不能取得真正稳定的好成绩","C":"只要在基本概念上有真正的理解，即使没有花很多精力，也能取得真正稳定的好成绩","D":"如果取得了真正稳定的好成绩，说明一定在基本概念上有了真正的理解"},"answer":"C","explanation":"第一步：翻译题干。\n①稳定提高成绩\u003cimg data-k=\"2dfb7d1f72f3\">基本概念有真正理解；\n②\u003cimg data-k=\"e752a8ae1a16\">基本概念有真正理解\u003cimg data-k=\"a3a13b026980\">取得真正稳定的好成绩。\n第二步：逐一分析选项。\nA项：翻译为取得真正稳定的好成绩\u003cimg data-k=\"2dfb7d1f72f3\">基本概念有真正理解，是对②的否后，否后推否前，是逆否命题，排除；\nB项：翻译为取得真正稳定的好成绩\u003cimg data-k=\"2dfb7d1f72f3\">基本概念有真正理解，是对②的否后，否后推否前，是逆否命题，排除；\nC项：翻译为基本概念有真正理解\u003cimg data-k=\"2dfb7d1f72f3\">取得真正稳定的好成绩，是对②的否前，否前无法得出确定结论，当选；\nD项：翻译为取得真正稳定的好成绩\u003cimg data-k=\"2dfb7d1f72f3\">基本概念有真正理解，是对②的否后，否后推否前，是逆否命题，排除。\n本题为选非题，故正确答案为C。","no":98,"missingImage":false},{"type":"question","qid":"4652229","cat":"逻辑判断","stem":"某研究将行走模式分为两类：一类是零星地短时间行走，另一类是不间断地行走10分钟以上。该研究追踪了某国16732名66岁至78岁女性，4年随访期间有804名女性去世。结果发现，不管是零星散步还是较长时间的不间断行走，步数更多的人寿命更长；在约4500步之后，这种效应趋于稳定。研究者提出，只要开始走路，就能降低老年女性死亡风险。\n以下各项如果为真，哪项不能质疑研究者的结论？","options":{"A":"中青年女性的生活方式和老年女性有很大不同，每天行走步数与死亡率没有显著关联","B":"正确的走路方式，才能使身体变得健壮，不当的走路方式和姿势，会危害身体健康","C":"在这个年龄段，每天能够自主行走达到一定步数，通常意味着有更好的整体健康状况","D":"能够坚持走路的人，或者有更多的生活内容，或者有更好的健康意识，这两者均有益健康"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：只要开始走路，就能降低老年女性死亡风险。\n论据：该研究追踪了某国16732名66岁至78岁女性，4年随访期间有804名女性去世。结果发现，不管是零星散步还是较长时间的不间断行走，步数更多的人寿命更长；在约4500步之后，这种效应趋于稳定。\n本题为选非题，找出三个削弱项排除，剩下的选项即为正确答案。\n第二步：逐一分析选项。\nA项：指出中青年女性和老年女性相比，每天行走步数和死亡率无显著关联，该项讨论的是中青年女性，而论点讨论的是老年女性，主体不一致，无法削弱，当选；\nB项：指出不当的走路方式反而会危害健康，说明并不是只要开始走路就会降低死亡风险，否定论点，可以削弱，排除；\nC项：指出老年女性是因为本来身体就健康才能够走路达到一定步数，而不是因为走路达到一定步数才身体健康，因果倒置，可以削弱，排除；\nD项：指出能坚持走路的人，同时有更多的生活内容或更好的健康意识，这对健康有益，说明这些死亡风险低的女性除了走路之外，还有其他因素也对他们的健康有益，他因削弱，可以削弱，排除。\n本题为选非题，故正确答案为A。","no":99,"missingImage":false},{"type":"question","qid":"4652289","cat":"逻辑判断","stem":"某校辩论队的小赵、小钱、小孙和小李分别是哲学、中文、历史和英语专业的，他们也都爱好下围棋。还知道如下情况：\n（1）小孙和历史专业的下过围棋，并且各有输赢；\n（2）哲学专业的只和中文专业的下过围棋，而且从没赢过；\n（3）小钱和小孙二人曾和哲学专业的同学一起爬过山；\n（4）某日小李、小赵下围棋，且小赵取胜。\n据此，可以推出：","options":{"A":"小赵是学英语的，小钱是学历史的","B":"小钱是学历史的，小孙是学中文的","C":"小赵是学历史的，小孙是学英语的","D":"小李是学哲学的，小钱是学历史的"},"answer":"D","explanation":"第一步，分析题干条件。\n（1）小孙和历史专业的下过围棋，并且各有输赢；\n（2）哲学专业的只和中文专业的下过围棋，而且从没赢过；\n（3）小钱和小孙二人曾和哲学专业的同学一起爬过山；\n（4）某日小李、小赵下围棋，且小赵取胜。\n第二步，根据题干条件进行推理，题干无确定信息，可以考虑最大信息法。由于对象和信息较多，为了使推理更加清晰，可以借助列表推理：\n题干条件中小孙提到两次，根据条件（1）可知小孙不是历史专业，根据条件（3）可知小孙不是哲学专业；\n题干条件中哲学提到两次，根据条件（3）可知小钱不是哲学专业，根据条件（2）和条件（4）可知小赵取胜，但哲学专业从没赢过，因此小赵不是哲学专业。\n根据以上信息可知，小李为哲学专业，得到表格如下：\n\u003cimg data-k=\"fd46c6ec205a\" style=\"max-width:510px\">\n根据条件，已知小李为哲学专业，结合条件（2）和条件（4）可知，哲学专业的只和中文专业的下过围棋，而小李和小赵下过围棋，因此小赵是中文专业，进一步可知小孙是英语专业，最后推出小钱是历史专业，得到表格如下：\n\u003cimg data-k=\"b1ae66f04c72\" style=\"max-width:507px\">\n故正确答案为D。","no":100,"missingImage":false},{"type":"question","qid":"4652227","cat":"逻辑判断","stem":"人的平均智商每十年有一定幅度增长，这个现象被称为弗林效应，它可能是儿童时期营养、医疗和教育品质不断提升的结果。而且数据显示，平均智商最大幅的增长发生在发展中国家和地区。在这些地方，儿童时期营养、标准化教育和医疗条件的提升是影响智商的最重要因素。\n由此可以推出：","options":{"A":"人的平均智商并非一成不变，而是会受到社会发展变化的影响","B":"人的平均智商水平反映了该国家和地区的经济发展水平","C":"发展中国家人的平均智商要远低于发达国家人的平均智商","D":"发达国家人的平均智商增幅缓慢是因为在营养、医疗和教育方面已无太多提升空间"},"answer":"A","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干第一句话“人的平均智商每十年有一定幅度增长”可知，人的平均智商不是一成不变，根据题干最后一句话“在这些地方，儿童时期营养、标准化教育和医疗条件的提升是影响智商的最重要因素”可知，儿童时期营养、标准化教育和医疗条件的提升属于社会发展变化，因此可以推出人的平均智商是变化的且受到社会发展变化的影响，当选；\nB项：题干中仅提及“发展中国家和地区”平均智商增幅最大，未提及平均智商是否会反映经济发展水平，无法推出，排除；\nC项：题干中没有提及发展中国家和发达国家人的平均智商的比较，无中生有，无法推出，排除；\nD项：题干中没有提及发达国家人的平均智商增幅缓慢的原因，无中生有，无法推出，排除。\n故正确答案为A。","no":101,"missingImage":false},{"type":"question","qid":"4652261","cat":"逻辑判断","stem":"科学家们在给老鼠准备的“饮料”里分别加入了糖或甜味剂——安赛蜜。起初，小鼠们两种饮料都喝。可到了第二天，它们就几乎完全放弃了甜味剂，只爱喝真正的糖饮料。更“夸张”的是，被去除了味蕾上的甜味受体的小鼠，舌头尝不出任何甜味，也会偏爱选择真正的糖。后来科学家发现，小鼠和人的脑中都有一个区域只对葡萄糖而不是甜味剂有反应。这个区域在孤束核尾部（简称cNST），隐藏于大脑最原始的区域——脑干，并不在小鼠处理味觉的脑区。\n根据上述材料，以下判断正确的是：","options":{"A":"甜味剂的“甜”和糖的“甜”，作用在味蕾不同的受体上","B":"无糖可乐受人欢迎，并不是因为它更好喝，而是因为它更健康","C":"小鼠能区别出甜味剂和糖的不同是因为大脑的处理区域存在差异","D":"小鼠大脑处理味觉的区域仅对安赛蜜敏感，而cNST则对葡萄糖敏感"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干最后两句可知，甜味剂的“甜”和糖的“甜”作用在不同的大脑区域，但无法推出是否作用在味蕾不同的受体上，无法推出，排除；\nB项：题干没有涉及无糖可乐受人欢迎的原因，无中生有，排除；\nC项：根据题干最后两句可知，大脑中对于葡萄糖有反应的区域隐藏在脑干，不在处理味觉的脑区，而且该区域对于甜味剂无反应，说明小鼠能区别出甜味剂和糖是因为大脑处理区域存在差异，可以推出，当选；\nD项：根据题干最后一句可知，cNST对葡萄糖敏感，且处理味觉的脑区对安赛蜜敏感，但是无法推出处理味觉的脑区是否只对安赛蜜敏感，过于绝对，无法推出，排除。\n故正确答案为C。","no":102,"missingImage":false},{"type":"question","qid":"4652299","cat":"逻辑判断","stem":"人类的视觉功能包括察觉物体存在、分辨物体细节、觉察物体色彩、从视觉背景中分辨视觉对象的能力等。一项研究测查了133名年龄25-45岁的志愿者，其中63人每天吸烟超过20支，另外70人是非吸烟者。研究者测试了志愿者辨别对比度（阴影的细微差别）和颜色的能力，发现与非吸烟者相比，过量吸烟者辨别对比度和颜色的能力明显降低，或多或少有色盲或色弱的表现，红绿色和蓝黄色视觉存在缺陷。研究者提出，吸烟会损害视觉功能。\n以下各项如果为真，哪一项最能支持研究者的观点？","options":{"A":"调取的体检资料显示，这些志愿者小学毕业时视力指标均正常","B":"测量显示，所有志愿者的视力或矫正视力，即人眼辨认细节的能力正常","C":"调查发现，长期吸烟会导致与年龄相关的视网膜黄斑变性的风险成倍增加","D":"该研究被试志愿者中，长期吸烟的群体的年龄明显大于不吸烟的群体"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：吸烟会损害视觉功能。\n论据：一项研究测查了133名年龄25-45岁的志愿者，其中63人每天吸烟超过20支，另外70人是非吸烟者。研究者测试了志愿者辨别对比度（阴影的细微差别）和颜色的能力，发现与非吸烟者相比，过量吸烟者辨别对比度和颜色的能力明显降低，或多或少有盲或色弱的表现，红绿色和蓝黄色视觉存在缺陷。\n论点说的是吸烟会损害视觉功能，论据说的是过量吸烟者辨别对比度和颜色的能力明显降低，二者均讨论的是吸烟会损害视觉功能，论点和论据话题一致，加强考虑必要条件、补充论据等。\n第二步：逐一分析选项。\nA项：说的是志愿者小学毕业时视力指标均正常，但他们参加研究时年龄处于25-45岁，小学毕业时的视力情况与实验中志愿者视力情况无关，无法加强，排除；\nB项：说的是志愿者的视力或矫正视力正常，即所有志愿者的视力基础是一致的，这是实验结论成立的必要条件。如果该条件不成立，那么辨别对比度和颜色的能力降低可能是因为视力不正常而非吸烟，该项保证了实验前提一致，是论点成立的必要条件，可以加强，保留；\nC项：说的是长期吸烟会导致与年龄相关的视网膜黄斑变性的风险成倍增加，解释了为什么吸烟会损害视觉功能，补充论据，可以加强，保留；\nD项：说的是长期吸烟的群体的年龄明显大于不吸烟的群体，那么辨别对比度和颜色的能力降低的原因也可能是年龄，他因削弱，排除。\n对比B、C两项，B项必要条件的加强力度大于C项的补充论据，B项当选。\n故正确答案为B。","no":103,"missingImage":false},{"type":"question","qid":"4652298","cat":"逻辑判断","stem":"研究人员对1971年到2008年间的36400名某国公民的膳食数据和1984年到2006年间的该国14419人的运动数据进行分析和整合。他们发现，生活在2000年代和1980年代的同龄人，摄入同样的热量、同样质量的蛋白和脂肪，做同样多的运动，2000年代的人还是会比1980年代的人在体重指数上高2.3%。换句话说，即使我们遵循同样的饮食和锻炼计划，今天的人也要比上世纪80年代的人重10%。研究者认为，这种情况可能和科技的发展有关。\n以下哪项如果为真，不能支持以上观点？","options":{"A":"近年来，越来越多的新型化工产品应用于日常生活，这些物质可能改变人体的荷尔蒙进程，让人体调整和维持体重的机制发生变化","B":"90年代后，新型的抗抑郁药被研发出来，成为了很多国家最常用的处方药之一，而这些药物都有让人变得虚胖的副作用","C":"近年来，科技发展使得人类的工作和生活方式发生了很大转变，体力劳动的比例显著下降，即使维持日常运动，总的体能支出也明显降低","D":"现代人吃的肉比几十年前的人多得多，需要新的肠道菌群来消化，肠道菌群的变化可能让人的食欲大增从而体重增长"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：同样的饮食和锻炼条件下，如今的人比上世纪80年代的人体重更重的情况可能和科技的发展有关。\n论据：无。\n本题只有论点，没有论据，可以考虑补充论据来加强，解释或者举例说明为什么如今的人们体重更重和科技发展有关，选非题排除加强项即可。\n第二步：逐一分析选项。\nA项：近年来，新型化工产品的应用会让人体调整和维持体重的机制发生变化，新型化工产品越来越多证明了科技的发展，科技产品影响人们的体重调节机制，解释了为什么如今的人们体重更重与科技发展有关，补充论据，可以加强，排除；\nB项：90年代后，最常用的抗抑郁药被研发出来，而这些药会让人变得虚胖，新型药品的研发证明了科技的发展，药物让人变得虚胖解释了为什么如今的人们体重更重与科技发展有关，补充论据，可以加强，排除；\nC项：近年来，科技发展让人们总的体能支出明显降低，而总的体能支出降低意味着人体能量消耗变少，会导致如今的人们体重更重，解释了为什么如今的人们体重更重与科技发展有关，补充论据，可以加强，排除；\nD项：现代人吃的肉更多，造成肠道菌群的变化，进而体重增长，这在说明如今的人们体重更重与肠道菌群有关，与论点讨论的科技发展无关，无法加强，当选。\n本题为选非题，故正确答案为D。","no":104,"missingImage":false},{"type":"question","qid":"4652303","cat":"类比推理","stem":"三位小学老师虞老师、高老师和冯老师，他们每人分别担任音乐、科学、英语、体育、思想品德和数学6科中两门课的教学。已知：\n（1）科学老师和体育老师住在同一幢公寓楼；\n（2）虞老师在三人中年龄最小；\n（3）冯老师、音乐老师和体育老师三个人经常一起去打球；\n（4）音乐老师比数学老师年龄要大些；\n（5）假日里，英语老师、数学老师和虞老师喜欢结伴去旅行。\n根据以上条件，可知，冯老师教：","options":{"A":"音乐","B":"思想品德","C":"英语","D":"科学"},"answer":"D","explanation":"第一步：分析题干条件。\n（1）科学老师和体育老师不是同一人；\n（2）虞老师年龄最小；\n（3）冯老师不教音乐和体育，且音乐老师和体育老师不是同一人；\n（4）音乐老师年龄大于数学老师，且音乐老师和数学老师不是同一人；\n（5）虞老师不教英语和数学，且英语老师和数学老师不是同一人；\n（6）每位老师担任6科中两门课的教学。\n第二步：根据题干条件进行推理。\n本题最大信息为虞老师，从虞老师入手解题。\n由条件（2）（4）（5）可知，虞老师不教音乐、英语、数学，再根据条件（6）可以推出虞老师教科学、体育、思想品德中的两门；由条件（1）可知科学老师和体育老师不能是同一人，所以虞老师一定教思想品德，冯老师不教思想品德。\n由条件（3）可知，冯老师不教音乐和体育，再根据条件（6）可以推出冯老师教数学、英语、科学中的两门；由条件（5）可知英语老师和数学老师不能是同一人，所以冯老师一定教科学。\n故正确答案为D。","no":105,"missingImage":false},{"type":"question","qid":"4652271","cat":"定义判断","stem":"消费决策是指人们根据自己的消费需要，在一定的收入和其他消费环境的约束下，为了实现一定的消费目标而作出关于消费层次、消费方式、消费途径、消费范围等方面的决定或方案。\n根据上述定义，以下哪种行为不属于消费决策？","options":{"A":"大学生小李没有时间逛街，因此喜欢在网上买东西","B":"某公司采购员计划与供应商签订乙烯采购合同","C":"在朋友的推荐下，小王选择购买某款高性价比的入门级单反相机","D":"某老师决定在学生毕业前自费为他们每人买一本书"},"answer":"B","explanation":"第一步：找出定义关键词。\n“根据自己的消费需要”、“在一定的收入和其他消费环境的约束下”、“为了实现一定的消费目标而作出关于消费层次、消费方式、消费途径、消费范围等方面的决定或方案”。\n第二步：逐一分析选项。\nA项：大学生小李没有时间逛街，因此喜欢在网上买东西，没有时间逛街说明他被消费环境所约束，符合“在一定的收入和其他消费环境的约束下”，在网上买东西是他为了实现消费目标作出的关于消费途径的决定，符合“根据自己的消费需要”、“为了实现一定的消费目标而作出关于消费层次、消费方式、消费途径、消费范围等方面的决定或方案”，符合定义，排除；\nB项：某公司采购员计划与供应商签订乙烯采购合同，不符合“根据自己的消费需要”，不符合定义，当选；\nC项：在朋友的推荐下，小王选择购买某款高性价比的入门级单反相机，考虑性价比高的产品说明他受到价格的约束，符合 “在一定的收入和其他消费环境的约束下”，选择某款高性价比的入门级单反相机是他作出的关于消费层次的决定，符合“根据自己的消费需要”、“为了实现一定的消费目标而作出关于消费层次、消费方式、消费途径、消费范围等方面的决定或方案”，符合定义，排除；\nD项：某老师决定在学生毕业前自费为他们每人买一本书，在学生毕业前是消费环境，符合“在一定的收入和其他消费环境的约束下”，决定自费为他们买书是老师作出的关于消费方式的决定，符合“根据自己的消费需要”、“为了实现一定的消费目标而作出关于消费层次、消费方式、消费途径、消费范围等方面的决定或方案”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":106,"missingImage":false},{"type":"question","qid":"4652270","cat":"定义判断","stem":"劳动者的受教育水平、工作经验或知识、技能、能力高于岗位需求的现象被称为资质过剩。客观资质过剩指劳动者实际拥有的任职资格超出岗位平均需求的情况，主观资质过剩指劳动者对这种情况的主观评估或感受，也被称为资质过剩感。\n根据上述定义，以下符合资质过剩感的是：","options":{"A":"小张想要离职，他觉得自己的技能和目前岗位不够匹配，一些工作技能用不上","B":"小梁去公司应聘，招聘者认为小梁的条件已超出该岗位要求，小梁顺利入职","C":"小方未能升职为市场总监，很不高兴，她觉得以自己的能力早就该升职了","D":"小江一直做公司会计，他的朋友都觉得，以小江的资质一直做普通会计太屈才了"},"answer":"C","explanation":"第一步：找出定义关键词。\n资质过剩：“劳动者的受教育水平、工作经验或知识、技能、能力高于岗位需求”；\n客观资质过剩：“劳动者实际拥有的任职资格超出岗位平均需求的情况”；\n主观资质过剩（资质过剩感）：“劳动者对这种情况（指资质过剩）的主观评估或感受”。\n第二步：逐一分析选项。\nA项：小张认为自己的技能和岗位不够匹配，一些工作技能用不上，但是技能和岗位不够匹配并不代表小张的技能高于岗位需求，不符合“劳动者的受教育水平、工作经验或知识、技能、能力高于岗位需求”，不符合资质过剩感，排除；\nB项：招聘者认为小梁的条件超出岗位要求，并不是劳动者小梁的主观感受，不符合“劳动者对这种情况（指资质过剩）的主观评估或感受”，不符合资质过剩感，排除；\nC项：小方认为按照自己的能力早就该升职，说明小方认为自己的能力超过目前其所在的岗位需求，符合“劳动者的受教育水平、工作经验或知识、技能、能力高于岗位需求”，也符合“劳动者对这种情况（指资质过剩）的主观评估或感受”，符合资质过剩感，当选；\nD项：小江的朋友认为小江的资质一直做普通会计屈才，并不是劳动者小江的主观感受，不符合“劳动者对这种情况（指资质过剩）的主观评估或感受”，不符合资质过剩感，排除。\n故正确答案为C。","no":107,"missingImage":false},{"type":"question","qid":"4652247","cat":"定义判断","stem":"连环马策略是指在谈判中坚持你要我让一步，我也要你让一步，确保条件互换的做法。\n根据上述定义，以下属于连环马策略的是：","options":{"A":"甲厂家答应购买乙公司的精密设备，乙公司需要同意免去设备使用培训费","B":"果农与经销商谈判，希望将三千斤芒果全部收购，部分次果也一并收购","C":"吴某去买车，发现经销商没有现车还需要加价排队买，吴某要求正价买现车","D":"食客对菜品不满意，不打算付钱，餐馆经理过来理论，食客只能照价结账"},"answer":"A","explanation":"第一步：找出定义关键词。\n“在谈判中”、“你要我让一步，我也要你让一步”、“确保条件互换”。\n第二步：逐一分析选项。\nA项：甲厂家答应购买设备的条件是乙公司免去培训费，符合“在谈判中”、“你要我让一步，我也要你让一步”、“确保条件互换”，符合定义，当选；\nB项：果农希望经销商将芒果全部收购，部分次果也一并收购，果农提出了需经销商让步的条件，而经销商没有提出需果农让步的条件，不符合“你要我让一步，我也要你让一步”、“确保条件互换”，不符合定义，排除；\nC项：吴某发现经销商不仅没有现车，还需要加价排队买，要求正价买现车，吴某提出了需经销商让步的条件，而经销商没有提出需吴某让步的条件，不符合“你要我让一步，我也要你让一步”、“确保条件互换”，不符合定义，排除；\nD项：餐馆经理与食客理论，食客对菜品不满意，却只能照价结账，体现了食客的让步，但没有体现餐馆经理的让步，不符合“你要我让一步，我也要你让一步”、“确保条件互换”，不符合定义，排除。\n故正确答案为A。","no":108,"missingImage":false},{"type":"question","qid":"4652214","cat":"定义判断","stem":"“自然后果”是一种常被运用于育儿的概念，意指行为本身会导致一个自然的后果，此结果是孩子事先未知的，但孩子可以从此自然后果的经验中，学会预期结果，控制他们之后的行为。譬如小朋友玩火烫到了之后就不会乱玩火。\n根据上述定义，以下不属于自然后果的是：","options":{"A":"孩子吃饭时告诉他如果不好好吃饭就会饿肚子，结果孩子担心挨饿便吃完了饭","B":"孩子因迟到被批评后，每晚都整理好第二天要用的物品以免临时寻找耽误时间","C":"孩子因为跑太快而摔倒，家长没有马上去扶，孩子自己爬起来后不再快跑","D":"孩子饭后不爱刷牙，结果有了龋齿，看完医生后坚持每天好好刷牙"},"answer":"A","explanation":"第一步：找出定义关键词。\n“行为本身会导致一个孩子事先未知的自然的后果”、“孩子可以从此自然后果的经验中学会预期结果，控制之后的行为”。\n第二步：逐一分析选项。\nA项：家长告诉孩子不吃饭就会饿肚子，是家长事先告知的，孩子事先就知道该行为发生的后果，不符合“行为本身会导致一个孩子事先未知的自然的后果”，不符合定义，当选；\nB项：孩子迟到之后被批评，之后每晚都整理好第二天要用的物品避免迟到，迟到导致被批评是孩子事先不知道的，从中孩子学到了经验，并且去控制自己的行为，符合“行为本身会导致一个孩子事先未知的自然的后果”、“孩子可以从此自然后果的经验中学会预期结果，控制之后的行为”，符合定义，排除；\nC项：孩子跑太快摔倒，自己爬起来之后不再快跑，跑太快导致摔倒是孩子事先不知道的，他从中学习经验不再快跑，符合“行为本身会导致一个孩子事先未知的自然的后果”、“孩子可以从此自然后果的经验中学会预期结果，控制之后的行为”，符合定义，排除；\nD项：孩子不爱饭后刷牙引发了龋齿，之后坚持每天好好刷牙，不饭后刷牙带来龋齿这个后果是孩子事先不知道的，他从中学到了经验，每天好好刷牙控制自己的行为，符合“行为本身会导致一个孩子事先未知的自然的后果”、“孩子可以从此自然后果的经验中学会预期结果，控制之后的行为”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":109,"missingImage":false},{"type":"question","qid":"4652211","cat":"定义判断","stem":"虚拟货币是指没有实际形态的货币，一般是指网络运营商发行的一种类法币，只能在网络空间使用。其作用主要是企业为了在特定的范围内进行流通，吸引更多的用户参与进来。它也是一种营销手段，其本质上也是一种商品。虚拟货币只能进行单向的流通，不能作为现实世界的现金使用。\n根据上述定义，以下不属于虚拟货币的是：","options":{"A":"网络游戏充值后用于购买战斗装备的游戏币","B":"在某电商平台购物后被赠送的可用来在该平台购物的购物豆","C":"在某网络店家充值500元后得到的只能在该店家用的550元购物金","D":"游戏厅里面塞进并启动夹娃娃机的游戏币"},"answer":"D","explanation":"第一步：找出定义关键词。\n“网络运营商发行的一种类法币”、“只能在网络空间使用”。\n第二步：逐一分析选项。\nA项：网络游戏充值后获得的游戏币，是专门在网络游戏里使用的，符合“网络运营商发行的一种类法币”、“只能在网络空间使用”，符合定义，排除；\nB项：某电商平台购物后赠送的购物豆，且该购物豆是在该平台购物使用的，符合“网络运营商发行的一种类法币”、“只能在网络空间使用”，符合定义，排除；\nC项：在某网络店家充值500元后得到的550元购物金，且该购物金是只能在该店家使用的，符合“网络运营商发行的一种类法币”、“只能在网络空间使用”，符合定义，排除；\nD项：游戏厅里面使用在夹娃娃机上的游戏币，是具体的实物游戏币，而不是在网络空间中使用的，不符合 “只能在网络空间使用”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":110,"missingImage":false},{"type":"question","qid":"4652237","cat":"定义判断","stem":"负需求是指部分或大部分潜在购买者对某种产品或劳务不但没有需求，可能还有厌恶情绪。因此，营销管理的任务是分析人们为什么不喜欢这些产品，并针对目标顾客的需求调整定价，做更积极的促销，或改变顾客对某些产品或服务的信念，把负需求变为正需求。\n根据上述定义，以下不属于针对负需求进行的营销管理的是：","options":{"A":"某地人不爱吃动物内脏，商场播放视频介绍动物内脏富含哪些矿物质，对人体有哪些好处，并赠送了相应的菜谱，显著提升了销量","B":"A国民众不喜欢酱油，B国一家酱油企业通过在A国开办铁板烧餐厅，让该国民众了解“什么是酱油及其烹饪方法”，从而打开了A国市场","C":"很多男性不喜欢皮肤护理美容保养服务，某美容院改造一块区域出租给理发师，上门的男顾客日渐增多","D":"大部分小朋友都害怕看牙医，对牙医诊所很抗拒，诊所将诊室打造成动漫风格，在等待区放满毛绒玩具，受到小朋友的欢迎"},"answer":"C","explanation":"第一步：找出定义关键词。\n“部分或大部分潜在购买者对某种产品或劳务不但没有需求，可能还有厌恶情绪”、“营销管理的任务是分析人们为什么不喜欢这些产品”、“针对目标顾客的需求调整定价，做更积极的促销”、“改变顾客对某些产品或服务的信念”、“把负需求变为正需求”。\n第二步：逐一分析选项。\nA项：某地人不爱吃动物内脏，符合“部分或大部分潜在购买者对某种产品或劳务不但没有需求，可能还有厌恶情绪”，商场通过介绍动物内脏的益处和赠送菜谱等措施提升了销量，符合“改变顾客对某些产品或服务的信念”、“把负需求变为正需求”，符合定义，排除；\nB项：A国民众不喜欢酱油，符合“部分或大部分潜在购买者对某种产品或劳务不但没有需求，可能还有厌恶情绪”，B国的酱油企业通过开办餐厅让A国民众了解酱油及其烹饪方法，打开了市场，符合“改变顾客对某些产品或服务的信念”、“把负需求变为正需求”，符合定义，排除；\nC项：很多男性不喜欢皮肤护理美容保养服务，符合“部分或大部分潜在购买者对某种产品或劳务不但没有需求，可能还有厌恶情绪”，但美容院通过改造一块区域出租给理发师来增加男顾客，并没有改变男性顾客对皮肤护理美容保养服务的认知，不符合“营销管理的任务是分析人们为什么不喜欢这些产品”、“针对目标顾客的需求调整定价，做更积极的促销”、“改变顾客对某些产品或服务的信念”、“把负需求变为正需求”，不符合定义，当选；\nD项：大部分小朋友都害怕看牙医，符合“部分或大部分潜在购买者对某种产品或劳务不但没有需求，可能还有厌恶情绪”，诊所通过转变诊室的风格受到小朋友的欢迎，符合“改变顾客对某些产品或服务的信念”、“把负需求变为正需求”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":111,"missingImage":false},{"type":"question","qid":"4652300","cat":"定义判断","stem":"麦格克效应是一种认知现象，表现为语音感知过程中听觉和视觉之间的相互作用。人类的听觉有时会过多地受到视觉的影响，产生误听的现象；当视觉看到的一种“声音”与耳朵听到的另一种声音不匹配时，会让人们察觉到第三种声音。\n根据上述定义，以下符合麦格克效应的是：","options":{"A":"小梅看美剧时，总是选择有中文字幕的原音版本。妈妈说：“不是有中文配音的吗？”小梅说：“中文配音的，口型对不上，看着别扭。”","B":"流感爆发时期，小王说：“最近跟大家沟通好像有些困难，现在大家都戴着口罩，看不见嘴，我更听不清别人说话了。”","C":"研究者给成年志愿者观看一段视频，视频中人的嘴唇发出“ga”的音，但放出的配音却是“ba”，结果98%的志愿者表示他们听到的是“da”音","D":"表演者用腹语为手中的木偶配音，坐在他面前的观众会明知不可能，还是感到声音是从木偶口中发出的"},"answer":"C","explanation":"第一步：找出定义关键词。\n“语音感知过程中听觉和视觉之间的相互作用”、“人类的听觉有时会过多地受到视觉的影响，产生误听的现象”、“当视觉看到的一种‘声音’与耳朵听到的另一种声音不匹配时，会让人们察觉到第三种声音”。\n第二步：逐一分析选项。\nA项：中文配音与口型对不上，只是看着别扭，但并没有察觉到第三种声音，不符合“当视觉看到的一种‘声音’与耳朵听到的另一种声音不匹配时，会让人们察觉到第三种声音”，不符合定义，排除；\nB项：因为戴口罩看不见嘴，导致更听不清人说话，只是听不清，并不是因为受到视觉的影响而产生误听，不符合“人类的听觉有时会过多地受到视觉的影响，产生误听的现象”，不符合定义，排除；\nC项：看到嘴唇发出“ga”的音，但听到的配音是“ba”，符合“视觉看到的一种‘声音’与耳朵听到的另一种声音不匹配”，98%的志愿者表示他们听到的是“da”音，说明察觉到第三种声音，符合“语音感知过程中听觉和视觉之间的相互作用”、“会让人们察觉到第三种声音”，符合定义，当选；\nD项：观众将表演者用腹语为木偶的配音当成是木偶自己的发音，是对声音发出的位置出现错误认知，但并不会察觉到第三种声音，不符合“当视觉看到的一种‘声音’与耳朵听到的另一种声音不匹配时，会让人们察觉到第三种声音”，不符合定义，排除。 \n故正确答案为C。","no":112,"missingImage":false},{"type":"question","qid":"4652260","cat":"定义判断","stem":"隐形冠军企业是指那些不为公众所熟知，却在某个细分行业或市场占据领先地位，拥有核心竞争力和明确战略，其产品、服务难以被超越和模仿的中小型企业。\n根据上述定义，以下属于隐形冠军企业的是：","options":{"A":"某食品公司的主要产品是陈醋。该公司的陈醋味道醇厚，深受老百姓的欢迎，占据了全国陈醋市场份额的70%以上，其他品牌的陈醋始终无法超越","B":"某公司只有80余名员工，给自己的定位是“给餐厅和宾馆做最好的洗洁精”，使用这种洗洁精洗出来的餐具格外晶莹闪亮，虽然大众很少听说过这家企业，它却是国内餐饮企业购买洗洁精时的不二选择","C":"呼吸道传染病全球爆发时，口罩最核心的材料——熔喷布的全球需求井喷。某熔喷布生产厂商提出“做全球最大的熔喷布生产商”，积极扩大生产规模，很快将自己的产品卖到了全世界","D":"某公司有多个子公司，分布在不同领域，每个子公司都有各自的知名品牌，并在所属领域内拥有强大的竞争力。但这些品牌表面上并没有什么联系，这家总公司实力雄厚，公众却很少听说过这家企业"},"answer":"B","explanation":"第一步：找出定义关键词。\n“不为公众所熟知”、“在某个细分行业或市场占据领先地位，拥有核心竞争力和明确战略”、“其产品、服务难以被超越和模仿的中小型企业”。 \n第二步：逐一分析选项。\nA项：该品牌的陈醋占据了全国70%以上的市场份额，深受老百姓喜欢，说明该品牌在公众中已经颇有知名度，不符合“不为公众所熟知”，不符合定义，排除； \nB项：该公司仅有80余名员工，符合“中小型企业”，大众很少听说过这家企业，符合“不为公众所熟知”，同时该公司有自己的明确定位，且其产品是国内餐饮企业的不二选择，说明其有实力，也占据了市场的领先位置，符合“在某个细分行业或市场占据领先地位，拥有核心竞争力和明确战略”，符合定义，当选；\nC项：该熔喷布生产厂商扩大了生产规模并将产品卖往全世界，但扩大生产规模后，其具体规模并不明确，不符合“中小型企业”，同时该厂产品虽然卖往了全世界，但其是否占据市场领先地位不明确，不符合“在某个细分行业或市场占据领先地位，拥有核心竞争力和明确战略”，不符合定义，排除；\nD项：虽然总公司知名度不高，但该总公司拥有多个子公司，且这家总公司实力雄厚，因此该总公司不是中小型企业，不符合“中小型企业”，不符合定义，排除。\n故正确答案为B。","no":113,"missingImage":false},{"type":"question","qid":"4652213","cat":"定义判断","stem":"城市景观分为活动景观和实质景观两个方面，活动景观主要包含的是市民的日常生活、公共活动、节日集会等反映地方民族特色、文化艺术传统、风俗习惯等浓厚生活气氛的内容，它表现为动态的“物”；实质景观指的是社区和自然环境、文化古迹、建筑群以及道路等社区各项功能设施的总体，它表现为静态的“物”。\n根据上述定义，以下活动属于活动景观的是：","options":{"A":"某村被确定为历史文化古村后，村民全部迁出，村里打造了一条售卖各地特产的商业街","B":"某镇每年元宵节办社火，精心打扮的孩子被大人用特定方式扛在肩上表演“背棍”","C":"曲阜孔庙是祭祀中国古代著名思想家和教育家孔子的祠庙，每天都游人如织","D":"今年清明节，某校组织学生到新落成的烈士公墓进行公祭，缅怀先烈"},"answer":"B","explanation":"第一步：找出定义关键词。\n活动景观：“市民的日常生活、公共活动、节日集会等反映地方民族特色、文化艺术传统、风俗习惯等浓厚生活气氛的内容”、“动态的‘物’”；\n实质景观：“社区和自然环境、文化古迹、建筑群以及道路等社区各项功能设施的总体”、“静态的‘物’”。\n第二步：逐一分析选项。\nA项：该村成为历史文化古村后打造出的商业街属于道路，是静态的，符合“社区和自然环境、文化古迹、建筑群以及道路等社区各项功能设施的总体”、“静态的‘物’”，符合“实质景观”定义，不符合“活动景观”定义，排除；\nB项：元宵节办社火是一种节日集会，精心打扮的孩子被大人用特定方式扛在肩上表演“背棍”体现了地方民族特色，符合“市民的日常生活、公共活动、节日集会等反映地方民族特色、文化艺术传统、风俗习惯等浓厚生活气氛的内容”、“动态的‘物’”，符合“活动景观”定义，当选；\nC项：曲阜孔庙是世界文化遗产，是静态的建筑群，符合“社区和自然环境、文化古迹、建筑群以及道路等社区各项功能设施的总体”、“静态的‘物’”，符合“实质景观”定义，不符合“活动景观”定义，排除；\nD项：在清明节组织学生进行公祭的活动，不是市民的日常生活，也不具有浓厚的生活气氛，不符合“市民的日常生活、公共活动、节日集会等反映地方民族特色、文化艺术传统、风俗习惯等浓厚生活气氛的内容”，不符合“活动景观”定义，排除。\n故正确答案为B。","no":114,"missingImage":false},{"type":"question","qid":"4652272","cat":"定义判断","stem":"政府购买服务是指通过发挥市场机制作用，把政府直接向社会公众提供的一部分公共服务事项，按照一定的方式和程序，交由具备条件的社会力量承担，并由政府根据服务数量和质量向其支付费用。\n根据上述定义，下列属于政府购买服务的是：","options":{"A":"某地为了应对幼儿园数量不足的困境，鼓励民办幼儿园发展。申请人需提交申请，满足当地政府要求的资质条件。获得办园许可后，政府根据规模给予补助","B":"某区为了提高本区居民的生活便利程度，由政府出资，在各个居民小区建设“便民菜站”，并通过招标投标流程，确定数家农副产品企业入驻经营","C":"随着城市发展，某地政府需要建设新的供热厂，经过招标投标流程，甲公司中标，负责建设，市政府按期支付工程款","D":"某市推行“免费孕前优生健康检查项目”，根据项目要求和各家医疗机构提交的申报材料等信息，选定16家民营医疗机构，并按照年终工作量支付费用"},"answer":"D","explanation":"第一步：找出定义关键词。\n“把政府直接向社会公众提供的一部分公共服务事项”、“交由具备条件的社会力量承担”、“由政府根据服务数量和质量向其支付费用”。\n第二步：逐一分析选项。\nA项：民办幼儿园满足条件获得的是政府补助，并不是政府直接支付的费用，不符合“由政府根据服务数量和质量向其支付费用”，不符合定义，排除；\nB项：“便民菜站”是政府出资建设的，不符合“交由具备条件的社会力量承担”，政府也没有给农副产品企业支付费用，不符合“由政府根据服务数量和质量向其支付费用”，不符合定义，排除；\nC项：甲公司负责的是建设供热厂，供热是公共服务，但“建设供热厂”并不是公共服务，不符合“政府直接向社会公众提供的一部分公共服务事项”，不符合定义，排除；\nD项：免费孕前优生健康检查是“政府直接向社会公众提供的一部分公共服务事项”，16家民营医疗机构是“具备条件的社会力量”，该市按照年终工作量支付费用，符合“由政府根据服务数量和质量向其支付费用”，符合定义，当选。\n故正确答案为D。","no":115,"missingImage":false}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"37be411064e8\" style=\"max-width:527px\">\u003c/p>","questions":[{"qid":"4652159","cat":"综合","stem":"2020年该行业销售费用约是管理、财务费用之和的多少倍？","options":{"A":"2.5","B":"2.9","C":"3.4","D":"4.0"},"answer":"A","explanation":"根据题干“2020年······约是······的多少倍”，结合材料时间为2020年，可判定本题为现期倍数问题。定位表格材料可得：2020年1-12月该行业销售费用为4635.6亿元，管理费用为1575.1亿元，财务费用为250.2亿元。则所求倍数\u003cimg data-k=\"95e9d2b47968\">\u003cimg data-k=\"08ea79786a86\">\u003cimg data-k=\"d9377ac6ec5c\">\u003cimg data-k=\"0e681869f32f\">倍，最接近A项。\n故正确答案为A。","no":116,"missingImage":false},{"qid":"4652166","cat":"比重","stem":"以下饼图中，最能准确反映2020年7月该行业销售（用白色表示）、管理（用灰色表示）和财务（用黑色表示）费用占比关系的是：","options":{"A":"\u003cimg data-k=\"7593489285d7\" style=\"max-width:212px\">","B":"\u003cimg data-k=\"f51c95aec5c3\" style=\"max-width:212px\">","C":"\u003cimg data-k=\"a061478153e7\" style=\"max-width:212px\">","D":"\u003cimg data-k=\"5256e7b35f30\" style=\"max-width:212px\">"},"answer":"A","explanation":"根据题干“······2020年7月······占比关系······”，结合材料时间为2020年，可判定本题为现期比重问题。定位表格材料可知，2020年1-6月与1-7月销售、管理和财务费用累计值。2020年7月值＝2020年1-7月累计值\u003cimg data-k=\"e752a8ae1a16\">2020年1-6月累计值，则2020年7月销售费用为2429.5-2064.5=365亿元，管理费用为809.3-687.6=121.7亿元，财务费用为123.7-102.0=21.7亿元。管理费用远大于财务费用，排除C、D两项；销售费用占比\u003cimg data-k=\"c0363ba3a6a0\">\u003cimg data-k=\"91f295a0b943\">\u003cimg data-k=\"18a81e6dd868\">，排除B项。\n故正确答案为A。","no":117,"missingImage":false},{"qid":"4652169","cat":"综合","stem":"在该行业销售费用、管理费用和财务费用三项费用中，2020年前7个月费用额不到全年总额一半的有几项？","options":{"A":"0","B":"1","C":"2","D":"3"},"answer":"B","explanation":"根据题干“······2020年前7个月······不到全年总额一半的有几项”，结合材料时间为2020年，可判定本题为现期比重问题。根据公式：比重\u003cimg data-k=\"d96f2813fb7d\">，定位表格材料可得，2020年前7个月该行业销售费用、管理费用和财务费用占全年总额的比重分别为：\u003cimg data-k=\"b1d442d82562\">、\u003cimg data-k=\"faf46122e785\">、\u003cimg data-k=\"99e0861703fc\">，符合题意的共有1项。\n故正确答案为B。","no":118,"missingImage":false},{"qid":"4652171","cat":"综合","stem":"2020年下半年该行业财务费用最高的月份是：","options":{"A":"9月","B":"10月","C":"11月","D":"12月"},"answer":"C","explanation":"定位表格材料可得：2020年1-8月、1-9月、1-10月、1-11月、1-12月该行业财务费用分别为148.5亿元、174.5亿元、198.2亿元、225.3亿元、250.2亿元。则9月、10月、11月、12月该行业财务费用分别如下：\n9月财务费用=1-9月财务费用\u003cimg data-k=\"e752a8ae1a16\">1-8月财务费用=174.5-148.5=26.0亿元；\n10月财务费用=1-10月财务费用\u003cimg data-k=\"e752a8ae1a16\">1-9月财务费用=198.2-174.5=23.7亿元；\n11月财务费用=1-11月财务费用\u003cimg data-k=\"e752a8ae1a16\">1-10月财务费用=225.3-198.2=27.1亿元；\n12月财务费用=1-12月财务费用\u003cimg data-k=\"e752a8ae1a16\">1-11月财务费用=250.2-225.3=24.9亿元。\n则2020年下半年该行业财务费用最高的月份是11月。\n故正确答案为C。","no":119,"missingImage":false},{"qid":"4652176","cat":"综合","stem":"关于2020年该行业销售、管理和财务费用，能够用上述资料中推出的是：","options":{"A":"二季度销售费用低于一季度水平","B":"四季度每个月的销售费用都超过400亿元","C":"管理费用累计超过1000亿元是在第四季度","D":"二季度各月，财务费用逐月递减"},"answer":"D","explanation":"A项：定位表格材料可得，1-3月累计销售费用为973.2亿元；1-6月累计销售费用为2064.5亿元。则二季度销售费用=1-6月累计销售费用\u003cimg data-k=\"e752a8ae1a16\">1-3月累计销售费用=2064.5-973.2=1091.3亿元＞973.2亿元，故二季度销售费用高于一季度水平，错误；\nB项：定位表格材料可得，1-9月累计至1-12月累计销售费用分别为：3297.9亿元、3674.3亿元、4107.1亿元、4635.6亿元。则10月销售费用=1-10月累计销售费用\u003cimg data-k=\"e752a8ae1a16\">1-9月累计销售费用=3674.3-3297.9=376.4亿元＜400亿元，四季度每个月的销售费用并非都超过400亿元，错误；\nC项：定位表格材料可得，1-9月累计管理费用为1070.9亿元＞1000亿元，故管理费用累计超过1000亿元在第三季度，并非第四季度，错误；\nD项：定位表格材料可得，1-3月累计至1-6月累计财务费用分别为：49.6亿元、70.6亿元、88.2亿元、102.0亿元，故4月财务费用=1-4月累计财务费用\u003cimg data-k=\"e752a8ae1a16\">1-3月累计财务费用=70.6-49.6=21亿元，同理，5月财务费用=88.2-70.6=17.6亿元，6月财务费用=102.0-88.2=13.8亿元。观察发现：二季度各月财务费用逐月递减，正确。\n故正确答案为D。","no":120,"missingImage":false}]},{"type":"material","material":"\u003cp>        2020年末S省就业人口4750.9万人，占常住人口总数的59.01%，与2019年末相比，就业人口占常住人口总数的比重下降0.24个百分点。\u003c/p>\u003cp>        2020年末S省第一产业、第二产业和第三产业的就业人口数量分别为764.89万人、2033.39万人、1952.62万人，与2019年末相比，第一、第二产业就业人口比重分别下降0.7个、0.1个百分点，第三产业就业人口比重上升0.8个百分点。\u003c/p>\u003cp>\u003cimg data-k=\"f58a1ac2d306\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"4652179","cat":"综合","stem":"2019年末S省常住人口总数约为多少万人？","options":{"A":"7910","B":"8030","C":"8096","D":"8199"},"answer":"B","explanation":"根据题干“2019年末······约为多少万人”，结合材料给出2019年末S省就业人口与比重的相关数据，可判定本题为现期比重问题。定位文字材料第一段可知：2020年末S省就业人口占常住人口总数的59.01%，与2019年末相比，就业人口占常住人口总数的比重下降0.24个百分点；定位图形材料可知：2019年末S省就业人口数量为4757.8万人。根据公式：整体\u003cimg data-k=\"e05c344f9d44\">，可得2019年末S省常住人口总数为\u003cimg data-k=\"f61b6a1aabfa\">\u003cimg data-k=\"9b765069089a\">万人，与B项最接近。\n故正确答案为B。","no":121,"missingImage":false},{"qid":"4652182","cat":"比重","stem":"2020年末S省第二产业就业人口在就业人口中的占比比第三产业约高：","options":{"A":"0.5个百分点","B":"1.7个百分点","C":"3.5个百分点","D":"5.1个百分点"},"answer":"B","explanation":"根据题干“2020年末······占比······”，结合材料时间为2020年末，可判定本题为现期比重问题。定位文字材料第一段可知：2020年末S省就业人口4750.9万人；定位文字材料第二段可知：2020年末S省第二产业和第三产业的就业人口数量分别为2033.39万人和1952.62万人。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，可得2020年末S省第二产业就业人口在就业人口中的占比与第三产业占比的差值为\u003cimg data-k=\"cca5ead7795e\">\u003cimg data-k=\"fa9ae147cb20\">，即高1.7个百分点。\n故正确答案为B。","no":122,"missingImage":false},{"qid":"4652186","cat":"增长","stem":"2020年末S省第一产业就业人口同比：","options":{"A":"减少了不到50万人","B":"减少了50万人以上","C":"增加了不到50万人","D":"增加了50万人以上"},"answer":"A","explanation":"根据题干“2020年末······同比”，结合选项为增加/减少+单位，可判定本题为增长量计算问题。定位文字材料第二段可知：2020年末S省第一产业的就业人口数量为764.89万人，与2019年末相比，就业人口比重下降0.7个百分点；定位图形材料可知：2019年末、2020年末S省就业人口数量分别为4757.8万人、4750.9万人。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，可得2020年末S省第一产业的就业人口数量占就业人口的比重\u003cimg data-k=\"08e4d83627d2\">，则2019年末S省第一产业的就业人口数量占就业人口的比重＝16.1%+0.7%=16.8%。根据公式：部分＝整体×比重，可得2019年末S省第一产业的就业人口数量为\u003cimg data-k=\"8c4ffc8c328f\">\u003cimg data-k=\"ce008e07389d\">万人。则2020年末S省第一产业就业人口同比减少\u003cimg data-k=\"3a19d6ac1abb\">万人，即减少了不到50万人。\n故正确答案为A。","no":123,"missingImage":false},{"qid":"4652190","cat":"综合","stem":"2020年末S省未就业常住人口数量约为第三产业就业人口的多少倍？","options":{"A":"1.4","B":"1.5","C":"1.7","D":"1.9"},"answer":"C","explanation":"根据题干“2020年末S省······为······的多少倍”，可判定本题为现期倍数问题。定位文字材料第一段可知：2020年末S省就业人口4750.9万人，占常住人口总数的59.01%；定位文字材料第二段可知：2020年末S省第三产业的就业人口数量为1952.62万人。根据：整体\u003cimg data-k=\"e05c344f9d44\">，可得2020年末S省常住人口总数\u003cimg data-k=\"59a6d47b3956\">\u003cimg data-k=\"d17f86ed454b\">万人，则2020年末S省未就业常住人口数量=常住人口总数-就业人口数\u003cimg data-k=\"bca24c1a999f\">万人。因此所求倍数\u003cimg data-k=\"3e218e4a3d39\">\u003cimg data-k=\"087765bf852a\">，与C项最接近。\n故正确答案为C。","no":124,"missingImage":false},{"qid":"4652192","cat":"综合","stem":"能够从上述资料中推出的是：","options":{"A":"2020年末S省第一产业就业人口占就业人口的15%以下","B":"2018年末S省就业人口同比增量低于上年同期数值","C":"2019年末S省就业人口数量较上年增长0.1%以上","D":"2020年末S省第二产业就业人口比上年减少0.1%以上"},"answer":"D","explanation":"A项：定位文字材料可知：2020年末S省就业人口4750.9万人，第一产业的就业人口数量为764.89万人。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，可得2020年末S省第一产业就业人口占就业人口的比重为\u003cimg data-k=\"113dd1fa92f5\">\u003cimg data-k=\"1835992f3745\">\u003cimg data-k=\"54ed2b172e56\">，错误；\nB项：定位图形材料可知：2016—2018年末S省就业人口数量分别为4760.83万人、4758.5万人、4756.22万人。根据公式：增长量=现期量-基期量，可得2018年末S省就业人口同比增量=4756.22-4758.5=-2.28万人，2017年末S省就业人口同比增量=4758.5-4760.83=-2.33万人。-2.28&gt;-2.33，即2018年末S省就业人口同比增量高于上年同期数值，错误；\nC项：定位图形材料可知：2018、2019年末S省就业人口数量分别为4756.22万人、4757.8万人，则所求增长率\u003cimg data-k=\"2623f0dd96bb\">\u003cimg data-k=\"79658b620f0d\">\u003cimg data-k=\"4b0e34929449\">，错误；\nD项：定位图形材料可知：2019、2020年末S省就业人口数量分别为4757.8万人、4750.9万人，则2020年末S省就业人口同比增长率为\u003cimg data-k=\"c303b4450c9b\">\u003cimg data-k=\"3ed225582d3f\">\u003cimg data-k=\"c360bea38dd4\">。定位文字材料可知：第二产业就业人口所占比重下降，根据两期比重比较结论“当部分增长率＜整体增长率时，比重下降”，则2020年末S省第二产业就业人口同比增长率＜S省就业人口同比增长率（-0.14%），即2020年末S省第二产业就业人口比上年减少0.1%以上，正确。\n故正确答案为D。","no":125,"missingImage":false}]},{"type":"material","material":"\u003cp>        2019年A市专利密集型产业实现增加值6918.8亿元，比上年增长9.6%，分别高于战略性新兴产业、高技术产业增加值增速2.3个和1.7个百分点；专利密集型产业增加值占GDP的比重为19.5%，比上年提高0.4个百分点。\u003c/p>\u003cp>        2019年专利密集型产业发明专利申请量占专利申请总量的比重为66%，比规模以上重点企业高5.1个百分点。专利密集型产业每亿元R&amp;D经费产生的发明专利申请量为73.1件，比规模以上重点企业高3.6件；企业户均拥有有效发明专利15.6件，是规模以上重点企业的2.2倍。从成果转化看，已被成功实施的发明专利数为5.2万件，占有效发明专利数的58.4%。\u003c/p>\u003cp>        在专利密集型产业中，2019年信 var BUNDLE = window.__EXAM__;

/* ---------------- helpers ---------------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s)}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1800);
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h+":"+p(m)+":"+p(s);
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.round(sec/60);
  return m>=60? (Math.floor(m/60)+" 小时 "+(m%60)+" 分") : (m+" 分钟");
}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）
function imgUri(k){ return (window.__IMGS__ && window.__IMGS__[k]) || ""; }
function resolveImgs(root){
  var list=$$("img[data-k]",root||document);
  for(var i=0;i<list.length;i++){
    var k=list[i].getAttribute("data-k");
    var u=imgUri(k);
    if(u) list[i].src=u; else list[i].replaceWith(document.createTextNode("［图片缺失］"));
  }
}

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

/* ---------------- state ---------------- */
var state={
  pi:0, duration:120*60, remain:120*60, paused:false,
  answers:{}, submitted:false, used:0, lastTick:Date.now(), lastActive:Date.now(), started:false
};
var tickTimer=null;

function paper(){return BUNDLE.papers[state.pi]}
function skey(){return "xingce/"+(BUNDLE.papers[0].key||"paper")+"/"+state.pi}

function save(){
  store(skey(),{
    answers:state.answers, submitted:state.submitted, used:state.used,
    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });
}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");
  c.textContent=fmtClock(state.remain);
  box.classList.remove("warn","half");
  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

/* ---------------- render ---------------- */
function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();
  var h=[];
  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'
    +'</div><div class="tips">说明：本卷题目与解析来自公开行测真题题库整理，用于离线自测。'
    +'答案、解析在交卷后统一显示；可随时暂停或提前交卷。分值按国考行测常规模块分值（政治理论 10、常识判断 10、言语理解 24、数量关系 12、判断推理 28、资料分析 16）'
    +'在有效题目上等比例折算，满分 100 分。</div></div>');

  p.modules.forEach(function(m){
    h.push('<div class="section-head"><h2>'+esc(m.label)+'</h2><span class="n">'+m.count+' 题 · 共 '+m.pointsOf+' 分'
      +(m.count!==m.answerable?' （'+m.answerable+' 题计分）':'')+'</span></div>');
    m.items.forEach(function(it){
      if(it.type==="material"){
        h.push('<div class="material"><div class="mtitle">材料</div>'+esc(it.material)+'</div>');
        it.questions.forEach(function(q){h.push(questionHtml(q))});
      } else h.push(questionHtml(it));
    });
  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
