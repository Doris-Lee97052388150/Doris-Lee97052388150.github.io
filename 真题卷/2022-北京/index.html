<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2022年北京市公务员录用考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2022-北京","title":"2022年北京市公务员录用考试《行测》题（网友回忆版）","year":"2022","group":"北京","modules":[{"label":"政治理论","items":[{"type":"question","qid":"4652154","cat":"时事政治","stem":"党的十九届六中全会是在中国共产党百年华诞的重要时刻，在“两个一百年”奋斗目标历史交汇关键节点上召开的一次重要会议。关于本次全会审议通过的《中共中央关于党的百年奋斗重大成就和历史经验的决议》，下列表述中正确的有：\n①是党在历史上形成的第三个历史决议\n②指出了中国共产党百年奋斗的历史意义\n③深刻揭示了“过去我们为什么能够成功、未来我们怎样才能继续成功”\n④从13个方面分领域总结了党和国家在各个时期取得的历史性成就、发生的历史性变革","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"A","explanation":"本题考查政治常识。\n2021年11月，党中央在北京召开了党的十九届六中全会，全面总结党的百年奋斗重大成就和历史经验。全会审议通过了《中共中央关于党的百年奋斗重大成就和历史经验的决议》（以下简称《决议》）。\n①正确，《决议》是中国共产党历史上的第三个历史决议，是21世纪的马克思主义纲领性文件，是第一个百年征程的里程碑、第二个百年征程的宣言书。\n②正确，《决议》从人民、道路、主义、世界、政党五个方面概括了中国共产党百年奋斗的历史意义，全面、深刻、系统地阐述了中国共产党对中国人民、对中华民族、对马克思主义、对人类进步事业、对马克思主义政党建设所作的历史性贡献。\n③正确，《决议》融汇了百年来中国共产党践行为中国人民谋幸福、为中华民族谋复兴的初心使命所进行的奋斗、牺牲和创造，深刻揭示了“过去我们为什么能够成功、未来我们怎样才能继续成功”。\n④错误，《决议》从13个方面分领域总结了新时代党和国家事业取得的历史性成就、发生的历史性变革。应该是“新时代”的成就与变革，而非“各个时期”。\n综上所述，①②③表述正确。\n故正确答案为A。","no":1,"missingImage":false},{"type":"question","qid":"4652188","cat":"毛中特","stem":"习近平总书记《在党史学习教育动员大会上的讲话》指出，我们党历来重视党史学习教育，注重用党的奋斗历程和伟大成就鼓舞斗志、明确方向，用党的光荣传统和优良作风坚定信念、凝聚力量，用党的实践创造和历史经验启迪智慧、砥砺品格。这体现的哲学原理有：\n①社会存在决定社会意识\n②实践到认识到再实践再认识，是一个循环往复的辩证发展过程\n③实践是检验真理的唯一标准\n④先进的社会意识对社会发展起推动作用","options":{"A":"①④","B":"②③","C":"①③","D":"②④"},"answer":"D","explanation":"本题考查政治常识。\n①错误，④正确，社会存在是指构成社会的一切存在，包括个体、社会组织、社会活动、各种财产等。社会意识是指大群体特有的人类对世界和自身的态度和信念的总和。包括哲学、政治、经济、法律、宗教、道德、艺术、科学、生态、宇航及日常生活等观点。社会存在决定社会意识，社会意识对社会存在具有反作用，先进的社会意识对社会发展起推动作用。党的奋斗历程、实践经验都属于社会存在；传统、斗志、信念、智慧都属于社会意识。“用党的光荣传统和优良作风坚定信念、凝聚力量”体现了先进的社会意识对社会发展起推动作用。但并未体现社会存在对社会意识的决定作用。\n②正确，实践与认识的辩证运动，是一个由实践到认识、再实践、再认识，循环往复以至无穷的辩证发展过程。题干“我们党历来重视党史学习教育，注重用党的奋斗历程和伟大成就鼓舞斗志、明确方向，用党的光荣传统和优良作风坚定信念、凝聚力量”体现了这一哲理。\n③错误，实践决定认识，实践是检验真理的唯一标准。表述正确但与本题无关。\n故②④说法正确，①③说法错误。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"4652183","cat":"时事政治","stem":"因为不会使用智能手机，许多老年人遭遇了就医难、购票难、购物难等问题。2021年3月第十三届全国人民代表大会第四次会议在北京举行，会议通过的《政府工作报告》指出，推进智能化服务要适应老年人需求，并做到不让智能工具给他们日常生活造成障碍。为此，必须：","options":{"A":"强化政府信息公开，打造阳光政府","B":"坚持传统服务与智能创新相结合，实施惠民政策","C":"优化政府公共服务职能，保障社会公平正义","D":"坚持依法行政，改善营商环境"},"answer":"BC","explanation":"本题考查政治常识。\nA项错误，政府信息公开有助于克服在行政管理过程中的暗箱操作、权力失衡、决策失误等问题，进而有助于防止行政腐败，与题干中“智能化服务要适应老年人需求”无关。\nB项正确，坚持传统服务与智能创新相结合，推进线上线下深度融合，增强全国一体化政务服务平台服务能力，优化整合提升各级政务大厅“一站式”功能，全面实现政务服务事项全城通办、就近能办、异地可办，充分保障老年人基本服务需要。\nC项正确，优化政府公共服务职能，推行公共服务便捷化，为老年人提供优质高效便捷的公共服务，进一步提高公共服务质量和效率，保障社会公平正义。\nD项错误，坚持依法行政，改善营商环境，可以提高企业运行效率，提升国际竞争力，但与题干中“智能化服务要适应老年人需求”无关。\n故正确答案为BC。","no":3,"missingImage":false}],"count":3,"answerable":3,"pointsOf":10},{"label":"常识判断","items":[{"type":"material","material":"\u003cp>阅读以下材料，完成18—21题\u003c/p>\u003cp>        2014年党中央站在国家发展全局的高度，作出了实施京津冀协同发展战略这一重大决策。七年来，三省市和有关部门狠抓落实，《京津冀协同发展规划纲要》确定的到2020年的目标任务已全面顺利完成。有序推进北京非首都功能疏解，空间布局和经济结构得到优化提升；高标准高质量推进雄安新区建设，新区呈现塔吊林立、热火朝天的新面貌；加快推进重点地区发展，引领带动周边地区协同发展；大力推进重点领域协同发展，交通、生态、产业等不断取得新突破；谋划推进一批重大改革创新举措落地，协同发展体制机制日趋完善；积极推进民生领域补短板强弱项，基本公共服务均等化水平持续提高。\u003c/p>\u003cp>        “京津冀如同一朵花上的花瓣，瓣瓣不同，却瓣瓣同心”。七年来的实践充分证明：实现京津冀协同发展，是面向未来打造新的首都经济圈、推进区域发展体制机制创新的需要，是探索完善城市群布局和形态、为优化开发区域发展提供示范和样板的需要，是探索生态文明建设有效路径、促进人口经济资源环境相协调的需要，是实现京津冀优势互补、促进环渤海经济区发展、带动北方腹地发展的需要。京津冀协同发展重大战略给京畿大地带来广阔的发展前景。\u003c/p>","questions":[{"qid":"4652193","cat":"人文常识","stem":"根据《中共中央 国务院关于对&lt;北京城市副中心控制性详细规划（街区层面）（2016年-2035年）&gt;的批复》，下列地区与北京市通州区统一规划、统一政策、统一标准、统一管控的有：\n①三河  ②宝坻  ③香河  ④固安  ⑤大厂  ⑥武清","options":{"A":"①④⑤","B":"②④⑥","C":"①③⑤","D":"②③⑥"},"answer":"C","explanation":"本题考查政治常识。\n①③⑤正确，②④错误，《中共中央 国务院关于对&lt;北京城市副中心控制性详细规划（街区层面）（2016年-2035年）&gt;的批复》在“九、推动城市副中心与河北省廊坊北三县地区协同发展”部分指出：“发挥城市副中心对周边的辐射带动作用，实现通州区与河北省廊坊北三县地区统一规划、统一政策、统一标准、统一管控，促进协同发展。”其中，廊坊北三县指廊坊市的三河县、大厂回族自治县以及香河县。\n故正确答案为C。","no":4,"missingImage":false},{"qid":"4652194","cat":"人文常识","stem":"北京2022年冬奥会是我国重要历史节点的重大标志性活动，京津冀三地在公共安全、公共卫生、道路交通等方面出台临时性行政措施，共同保障冬奥会筹办工作。下列冬奥会比赛场馆与所承接比赛项目对应正确的是：","options":{"A":"首都体育馆——花样滑冰","B":"国家高山滑雪中心——钢架雪车","C":"五棵松体育中心——速度滑冰","D":"云顶滑雪公园——冬季两项"},"answer":"A","explanation":"本题考查政治常识。\n北京冬奥会是第24届冬奥会，将于2022年2月4日至20日举行，共设7个大项、15个分项、109个小项。2022冬奥会和冬残奥会竞赛场馆及项目分布如下图所示。\n\u003cimg data-k=\"ca0139266920\" style=\"max-width:651px\">\nA项正确，首都体育馆将举办的项目是短道速滑与花样滑冰。\nB项错误，国家高山滑雪中心将举办项目的是高山滑雪；钢架雪车项目将在国家雪车雪橇中心举办。\nC项错误，五棵松体育中心将举办的项目是女子冰球。速度滑冰项目将在国家速滑馆举办。\nD项错误，云顶滑雪公园将举办的是单板滑雪、自由式滑雪等项目。冬季两项将在古杨树场馆群的国家冬季两项中心举办。\n故正确答案为A。","no":5,"missingImage":false},{"qid":"4652195","cat":"人文常识","stem":"为充分整合京津冀三地文化和旅游等资源，有关部门发行了“京津冀旅游一卡通”。下列不可能列入其中的旅游景点是:","options":{"A":"盘山风景名胜区","B":"赵州桥展览馆","C":"古北口古镇","D":"沙家浜旅游区"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，盘山位于天津市蓟州区西北，为国家5A级景区。该景区始记于汉，兴于唐，极盛于清，是自然山水与名胜古迹并著，佛家文化与皇家文化共融的旅游休闲胜地。\nB项正确，赵州桥，是一座位于河北省石家庄市赵县城南洨河之上的石拱桥，因赵县古称赵州而得名。赵州桥始建于隋代，由匠师李春设计建造。赵州桥展览馆位于河北省石家庄市赵县赵州镇赵州桥景区。\nC项正确，古北口镇，隶属于北京市密云区。主要景点有司马台长城、古北口瓮城、杨令公庙等。\nD项错误，沙家浜旅游区一般指沙家浜芦苇荡风景区。沙家浜芦苇荡风景区位于江苏省常熟市阳澄湖畔，不属于京津冀三地的范围。\n本题为选非题，故正确答案为D。","no":6,"missingImage":false},{"qid":"4652196","cat":"人文常识","stem":"2021年8月北京市政府印发的《北京市“十四五”时期高精尖产业发展规划》指出，2035年京津冀产业协同发展新格局将全面形成。下列哪项不可能是该文件提出的相关措施？","options":{"A":"完善以智能网联汽车为核心的京津冀汽车产业生态圈，加快有条件自动驾驶的智能网联汽车研发生产和示范应用","B":"支持北京工业互联网和智能制造头部企业对接津冀生产制造资源，加速赋能津冀传统产业","C":"抓紧抓好协同发展重点任务落实，促进养老、教育、医疗等公共服务的跨区域协同","D":"推动京津冀规模化、协同化布局氢能产业，重点布局制备、运输、存储、加注和氢燃料电池产业链环节"},"answer":"C","explanation":"本题考查政治常识。\nA、B、D三项正确，《北京市“十四五”时期高精尖产业发展规划》在“四、优化区域协同发展新格局”中的“（四）构建京津冀产业协同发展新格局”部分第1点指出：“（1）氢能产业协同发展示范。推动京津冀规模化、协同化布局氢能产业，重点布局制备、运输、存储、加注和氢燃料电池产业链环节······（2）智能网联汽车产业协同发展示范。完善以智能网联汽车为核心的京津冀汽车产业生态圈，加快有条件自动驾驶的智能网联汽车研发生产和示范应用，提高自动驾驶功能装备率······（3）工业互联网产业协同发展示范。加快推进京津冀联网协同智造，支持北京工业互联网和智能制造头部企业对接津冀生产制造资源，加速赋能津冀传统产业。”\nC项错误，“抓紧抓好协同发展重点任务落实，促进养老、教育、医疗等公共服务的跨区域协同”不是该文件提出的相关措施。\n本题为选非题，故正确答案为C。","no":7,"missingImage":false}]},{"type":"material","material":"\u003cp>阅读以下材料，完成22—25题\u003c/p>\u003cp>        北京朝阳原国营798厂等电子工业的老厂区所在地，已华丽转身，成为赫赫有名的北京798艺术区，即北京的文化新地标。数以百计的设计、文化艺术机构云集此地，形成了别具一格的“SOHO式艺术聚落”和“LOFT生活方式”。798艺术区的形成，主要基于对原有空间和建筑的开发、改造和利用，这是北京市开展城市更新行动的方式之一。\u003c/p>\u003cp>        城市更新主要是指对城市空间形态和城市功能的持续完善和优化调整，是小规模、渐进式、可持续的更新。2021年，北京市相继发布了《北京市人民政府关于实施城市更新行动的指导意见》和《北京市城市更新行动计划（2021-2025年）》。北京市人大常委会还启动了《北京市城市更新条例》立项论证工作。\u003c/p>\u003cp>        近年来，北京市提出了减量发展，要从集聚资源求增长转向疏解功能谋发展。北京实施的城市更新行动，不是点状或线状式的更新，而是创新性地以街区为单元，加强统筹片区单元更新与分项更新，统筹城市更新与疏解整治促提升，统筹地上和地下更新，统筹重大项目建设与周边地区更新，统筹政府支持与社会资本参与，推进城市更新行动高效有序开展。\u003c/p>","questions":[{"qid":"4652168","cat":"人文常识","stem":"北京市的城市更新行动主要在（    ）开展。","options":{"A":"城市建成区","B":"城市核心区","C":"城市规划区","D":"城乡结合部"},"answer":"A","explanation":"本题考查政治常识。\n2021年6月10日，北京市人民政府发布了《北京市人民政府关于实施城市更新行动的指导意见》，文件在“一、总体要求“中的“（二）基本原则”部分指出：“城市更新主要是指对城市建成区（规划基本实现地区）城市空间形态和城市功能的持续完善和优化调整，是小规模、渐进式、可持续的更新。”\n故正确答案为A。","no":8,"missingImage":false},{"qid":"4652170","cat":"人文常识","stem":"按照北京市的政策，下述选项中，不符合城市更新行动精神的是：","options":{"A":"规划引领，试点推行","B":"大拆大建，更新城市面貌","C":"提质增效，盘活存量空间资源","D":"政府引导，多种方式吸引社会资本参与"},"answer":"B","explanation":"本题考查政治常识。\n2021年08月31日，北京市人民政府办公厅发布了《北京市城市更新行动计划（2021-2025年）》。\nA项正确，《北京市城市更新行动计划（2021-2025年）》在“一、总体要求”中的“（三）基本原则”部分指出：“1.规划引领，试点先行。贯彻落实北京城市总体规划、控制性详细规划和分区规划，做到严控总量、分区统筹、增减平衡。按照城市空间布局和不同圈层功能定位、资源禀赋，注重分区引导、分类制定政策。坚持自下而上的更新需求与自上而下的规划引导要求相结合，加大政策机制改革力度，试点先行、以点带面、项目化推进，探索城市更新的新模式、新路径、新机制，有序开展城市更新行动。”\nB项错误，《北京市城市更新行动计划（2021-2025年）》在“二、项目类型”部分指出：“实施城市更新行动，聚焦城市建成区存量空间资源提质增效，不搞大拆大建，除城镇棚户区改造外，原则上不包括房屋征收、土地征收、土地储备、房地产一级开发等项目。城市更新行动与疏解整治促提升专项行动进行有效衔接，规划利用好疏解腾退的空间资源。”\nC项正确，《北京市城市更新行动计划（2021-2025年）》在“一、总体要求”中的“（二）总体目标”部分指出：“通过实施城市更新行动，进一步完善城市空间结构和功能布局，促进产业转型升级，建设国际科技创新中心；建立良性的城市自我更新机制，实现存量空间资源提质增效，为‘两区’建设提供更加有效的空间载体；大力发展数字经济，以盘活存量空间资源支持建设全球数字经济标杆城市······”\nD项正确，《北京市城市更新行动计划（2021-2025年）》在“一、总体要求”中的“（三）基本原则”部分指出：“3.政府引导，市场运作。充分发挥政府统筹引导作用，建立以区为主、市区联动的城市更新行动工作机制，研究制定支持政策，强化统筹推进力度。充分激发市场活力，调动不动产产权人、市场主体和社会力量等各方积极性，多种方式引入社会资本。更新改造空间以持有经营为主，探索形成多渠道投资模式。”\n本题为选非题，故正确答案为B。","no":9,"missingImage":false},{"qid":"4652173","cat":"人文常识","stem":"城市更新行动中，应当注重加强“微空间”更新改造。下列措施中，最能体现这一点的是：","options":{"A":"将798老厂区改为798艺术区","B":"将老旧小区楼房外立面涂新","C":"将批发市场拆迁后改为城市送风通道","D":"将街道“边角地”改为口袋公园"},"answer":"D","explanation":"本题考查政治常识。\nD项正确，A、B、C三项错误，在我国快速城市化发展背景下，城市空间格局发生巨大变化，伴随人口数量的急剧增长，城市用地日趋紧张。尤其在城市旧城区，公共开放空间不足、环境品质不佳等“城市病”问题日益显现。相对于城市街道空间、广场空间等城市主体空间，微空间往往规模较小，依附于城市主体空间存在。四个选项中，街道“边角地”更符合“微空间”的定义。\n故正确答案为D。","no":10,"missingImage":false},{"qid":"4652177","cat":"法律常识","stem":"北京市推进城市更新立法工作的意义在于：\n①为城市更新工作提供制度保障\n②进一步明确有关部门各自职责范围，协同开展相关工作\n③依法保障公众在城市更新行动中的知情权、参与权、表达权和监督权\n④为国家出台法律规范全国的城市更新工作起到示范作用","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","explanation":"本题考查管理常识。\n①正确，2021年8月19日上午，北京市人大常委会城建环保办公室组织召开《北京市城市更新条例》立项论证工作启动会。会上郝志兰主任表示，城市更新工作十分重要，有利于进一步完善城市功能、改善人居环境、激发城市活力，通过立法为城市更新工作提供制度保障非常必要。\n②正确，北京市推进城市更新立法，如《北京市城市更新条例》讨论涉及城市更新范围、责任主体、政策保障、审批流程优化、社会资本与公众参与机制等重点问题。将通过法律明确有关部门在城市更新工作中的职责范围，有利于各部门依照程序协同开展相关工作。\n③错误，北京市政府、人大常委会通过发布文件、启动立项论证工作推进城市更新立法，无法体现公众的参与权、表达权和监督权。\n④正确，早在党的十九届五中全会、中央城市工作会议等就已经提出全国城市更新工作的相关要求，北京推进城市更新立法是对这些会议精神的贯彻，为国家出台法律规范全国的城市更新工作起到了示范作用。\n综上①②④说法正确。\n故正确答案为B。","no":11,"missingImage":false},{"qid":"4652158","cat":"法律常识","stem":"北京市S区本着“小事不出社区，大事不出街道”的原则，推出线上矛盾纠纷多元化解平台，通过大数据等技术汇聚多方调节力量，让百姓遇到纠纷可在线答疑，足不出户调解纠纷，降低矛盾化解成本，为百姓维权提供新途径。这有利于：\n①为矛盾纠纷化解提供跨时空、跨地域的一站式解决方案\n②形成“社会调节替代法律诉讼”的新型调解纠纷模式\n③提升诉讼服务水平，从根本上消除社区居民矛盾\n④形成基层社会治理新格局，打造城市版的“枫桥经验”","options":{"A":"①②","B":"①③","C":"①④","D":"②④"},"answer":"C","explanation":"本题考查管理常识。\n①正确，题干提到“北京市S区本着‘小事不出社区，大事不出街道’的原则，推出线上矛盾纠纷多元化解平台”，矛盾化解平台是一个集咨询、评估、调解、诉讼于一体的“社会化解纷服务共享平台”，通过大数据、云计算、人工智能技术汇聚多方调解力量，连接多元解纷资源，合理配置共享，为矛盾纠纷化解提供跨时空、跨地域的一站式解决方案。\n②错误，法律诉讼和社会调节之间的关系是相互作用相互补充的，二者都是调节老百姓之间矛盾的方式。社会调节如果不能解决问题，最终还是要用法律调节解决。故社会调节不可以代替法律调节。\n③错误，题干中“从根本上消除社区居民矛盾”的说法错误，违背了马克思主义哲学中对立统一规律强调的矛盾的普遍性，即矛盾存在于一切事物中，存在于一切事物发展过程的始终，旧的矛盾解决了，新的矛盾又产生，事物始终在矛盾中运动。人不能从根本上消除矛盾。\n④正确，“枫桥经验”是20世纪60年代初，在浙江省绍兴市诸暨县枫桥镇干部群众创造的“发动和依靠群众，坚持矛盾不上交，就地解决，实现捕人少，治安好”的基层管理方式。题干中“小事不出社区，大事不出街道”的原则可称之为城市版的“枫桥经验”。\n故①④说法正确。\n故正确答案为C。","no":12,"missingImage":false},{"qid":"4652163","cat":"人文常识","stem":"《中共中央 国务院关于深入打好污染防治攻坚战的意见》中提出，“十四五”时期，推进100个左右地级及以上城市开展“无废城市”建设，鼓励有条件的省份全域推进“无废城市”建设。下列关于“无废城市”的理解正确的是：","options":{"A":"“无废城市”意味着城市没有固体废物产生","B":"“无废城市”旨在将固体废物环境影响降至最低","C":"“无废城市”将不再采用填埋的方式进行固体废物处理","D":"“无废城市”意味着固体废物能完全资源化利用"},"answer":"B","explanation":"本题考查政治常识。\nB项正确，A、C、D三项错误，《国务院办公厅关于印发“无废城市”建设试点工作方案的通知》在首段指出：“‘无废城市’是以创新、协调、绿色、开放、共享的新发展理念为引领，通过推动形成绿色发展方式和生活方式，持续推进固体废物源头减量和资源化利用，最大限度减少填埋量，将固体废物环境影响降至最低的城市发展模式。‘无废城市’并不是没有固体废物产生，也不意味着固体废物能完全资源化利用，而是一种先进的城市管理理念，旨在最终实现整个城市固体废物产生量最小、资源化利用充分、处置安全的目标，需要长期探索与实践。”\n故正确答案为B。","no":13,"missingImage":false},{"qid":"4652164","cat":"法律常识","stem":"近年来，各地开始全面推行证明事项和涉企经营许可事项告知承诺制。下列说法中，正确的是：","options":{"A":"直接涉及国家安全、国家秘密和公共安全等事项的证明，首先适用告知承诺制","B":"实行告知承诺制后，所有申请人不再提交证明，只提交承诺","C":"告知承诺中的“承诺”，指的是申请人以口头形式承诺已经符合告知的相关要求，并愿意承担不实承诺的法律责任","D":"告知承诺中的“告知”指的是审批部门以书面形式将证明义务、证明内容以及不实承诺的法律责任一次性告知申请人"},"answer":"D","explanation":"本题考查政治常识。\nA项错误，2020年11月9日，国务院办公厅印发《关于全面推行证明事项和涉企经营许可事项告知承诺制的指导意见》(以下简称《意见》)。《意见》在“二、主要任务”中的“（四）明确实行告知承诺制的证明事项”部分指出：“直接涉及国家安全、国家秘密、公共安全、金融业审慎监管、生态环境保护，直接关系人身健康、生命财产安全，以及重要涉外等风险较大、纠错成本较高、损害难以挽回的证明事项不适用告知承诺制。”\nB项错误，实行告知承诺制后，申请人可自主选择采用告知承诺制方式办理或提交法定证明，申请人有较严重的不良信用记录或者存在曾作出虚假承诺等情形的，在信用修复前不适用告知承诺制。\nC项错误，告知承诺中的“承诺”，指的是申请人以书面形式承诺已经符合告知的相关要求，并愿意承担不实承诺的法律责任。\nD项正确，告知承诺中的“告知”指的是审批部门以书面形式（含电子文本）将证明义务、证明内容以及不实承诺的法律责任一次性告知申请人。\n故正确答案为D。","no":14,"missingImage":false},{"qid":"4652172","cat":"科技常识","stem":"碳中和的实现离不开我们在生活中时刻践行“低碳生活”。以下哪项不属于日常生活中倡导的低碳生活方式?","options":{"A":"选择使用电动牙刷","B":"节能灯代替普通灯泡","C":"晾晒衣服代替干衣机","D":"外出自备购物布袋"},"answer":"A","explanation":"本题考查科技常识。\n低碳生活就是指减少二氧化碳的排放，低能量、低消耗、低开支的生活方式。主要是从节电、节气和回收三个环节来改变生活细节。\nA项错误，选择使用电动牙刷，相比于普通牙刷，更加费电，因此不符合低碳的生活方式。 \nB项正确，节能灯代替普通灯泡，可以更加节约电能，因此符合低碳的生活方式。 \nC项正确，晾晒衣服代替干衣机，可以节约干衣机在使用过程中消耗的电能，因此符合低碳的生活方式。\nD项正确，外出自备购物布袋，可以使购物布袋循环使用，因此符合低碳的生活方式。\n本题为选非题，故正确答案为A。","no":15,"missingImage":false},{"qid":"4652215","cat":"法律常识","stem":"下列说法中，不符合《中华人民共和国宪法》规定的是：","options":{"A":"中华人民共和国国务院实行领导集体负责制","B":"中华人民共和国国务院是最高国家权力机关的执行机关","C":"中华人民共和国国务院是最高国家行政机关","D":"中华人民共和国国务院即中央人民政府"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国宪法》第八十六条规定：“······国务院实行总理负责制。各部、各委员会实行部长、主任负责制。国务院的组织由法律规定。”\nB、C、D项正确，根据《中华人民共和国宪法》第八十五条规定：“中华人民共和国国务院，即中央人民政府，是最高国家权力机关的执行机关，是最高国家行政机关。”\n本题为选非题，故正确答案为A。","no":16,"missingImage":false},{"qid":"4652216","cat":"法律常识","stem":"李某因盗窃罪被判处有期徒刑2年，缓刑3年。缓刑期间李某再次盗窃邻居财产，数额巨大，对李某应当：","options":{"A":"维持缓刑，从重对新罪处罚","B":"维持缓刑，对原罪和新罪合并处罚","C":"撤销缓刑，从重对新罪处罚","D":"撤销缓刑，对原罪和新罪合并处罚"},"answer":"D","explanation":"本题考查法律常识。\nD项正确，A项、B项、C项错误，根据《中华人民共和国刑法》第七十七条第一款规定：“被宣告缓刑的犯罪分子，在缓刑考验期限内犯新罪或者发现判决宣告以前还有其他罪没有判决的，应当撤销缓刑，对新犯的罪或者新发现的罪作出判决，把前罪和后罪所判处的刑罚，依照本法第六十九条的规定，决定执行的刑罚。”第二百六十四条规定：“盗窃公私财物，数额较大的，或者多次盗窃、入户盗窃、携带凶器盗窃、扒窃的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；数额巨大或者有其他严重情节的，处三年以上十年以下有期徒刑，并处罚金；数额特别巨大或者有其他特别严重情节的，处十年以上有期徒刑或者无期徒刑，并处罚金或者没收财产。”《刑法》第六十九条是关于数罪并罚的规定。缓刑期间李某再次盗窃邻居财产，数额巨大，构成盗窃罪，应当撤销缓刑，将李某的原罪和新罪数罪并罚。\n故正确答案为D。","no":17,"missingImage":false},{"qid":"4652217","cat":"法律常识","stem":"王某带3岁的小孙子到某餐厅用餐时，小孙子将一餐盘打碎，结账时餐厅拿出损失赔偿单，要求按上面规定的价格赔偿500元。事实上，此餐盘的市场价格为50元左右，王某和餐厅发生争执。下列说法正确的是：","options":{"A":"由于餐厅赔偿单价格明显高于市场价格，故王某应以市场价格予以赔偿","B":"王某的小孙子为无行为能力人，打碎餐盘不需要承担赔偿责任，王某也不需要承担赔偿责任","C":"由于餐厅赔偿单价格明显高于市场价格，餐厅涉嫌欺诈犯罪，故王某不应予以赔偿","D":"餐厅制定的赔偿单具有法律效力，王某到餐厅就餐说明对赔偿的认可，应当按赔偿单规定的价格赔偿"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，B、D两项错误，根据《中华人民共和国民法典》第一千一百八十四条规定：“侵害他人财产的，财产损失按照损失发生时的市场价格或者其他合理方式计算。”第一千一百八十八条规定：“无民事行为能力人、限制民事行为能力人造成他人损害的，由监护人承担侵权责任。监护人尽到监护职责的，可以减轻其侵权责任。”小孙子是无民事行为能力人，造成的损害应由王某承担侵权责任，赔偿的数额应以市场价格为准。\nC项错误，诈骗罪是指以非法占有为目的，使用欺骗方法，骗取数额较大的公私财物的行为。餐厅并没有虚构事实或隐瞒真相的欺诈行为，不构成犯罪。\n故正确答案为A。","no":18,"missingImage":false},{"qid":"4652219","cat":"人文常识","stem":"小李为某行政机关正式工作人员，因工作失误受到行政处分。小李不可能受到的行政处分是：","options":{"A":"警告","B":"记过","C":"诫勉","D":"撤职"},"answer":"C","explanation":"本题考查法律常识。\nA、B、D三项正确，C项错误，根据《公务员法》第六十二条规定：“处分分为：警告、记过、记大过、降级、撤职、开除。”因此，小李不可能受到的行政处分是“诫勉”。\n本题为选非题，故正确答案为C。","no":19,"missingImage":false},{"qid":"4652220","cat":"科技常识","stem":"下列哪种仪器，不以图中所示原理为基础：\n\u003cimg data-k=\"2cc414854a31\" style=\"max-width:297px\">","options":{"A":"电子导盲仪","B":"甲醛检测仪","C":"海底地貌探测仪","D":"B型超声诊断仪"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，电子导盲器定向发射某种形式的能量波并以接收障碍物反射回波的方式来定位，与雷达控测飞机，声呐探测潜艇的原理相同，电子导盲器最终将环境障碍信息以某种视觉方式提供给盲人，常用的能量波有超声、激光、红外和微波，目前比较成熟的导盲器采用超声或激光原理。\nB项错误，电子式甲醛检测仪的检测方法通常分为光电光度法和半导体式检测法。光电光度法利用甲醛跟浸有显色剂的试纸反应产生变色，变色程度不同导致反射光强度不一，把光强度转变为电信号即可提示甲醛浓度。半导体式检测法是利用半导体材料在一定温度下，电导率随着环境中气体成份的变化而变化的原理。\nC项正确，海底地貌探测仪又称侧扫声纳，可以获得海底地貌声纳图像。侧扫声纳发射的脉冲回波，按返回时间的先后顺序记录，再经过成像处理便可得到图像。通过对声纳图像的判读和量测可以确定海底目标的概略位置和高度。\nD项正确，B型超声诊断仪是根据脉冲回声原理制成的，由于动物机体的肌肉、脂肪、骨骼等不同组织间声阻值具有较大差异，当脉冲超声进入动物机体时，在体内遇到组织界面产生反射脉冲回声电信号，回声信号强，光点就亮，回声信号弱，光点就暗，从而形成灰度不同的生物体结构图像。\n本题为选非题，故正确答案为B。","no":20,"missingImage":false},{"qid":"4652221","cat":"科技常识","stem":"下列物质中，最不可能用于防疫消毒的是：","options":{"A":"过氧化氢","B":"二氧化氯","C":"高锰酸钾","D":"丙烯酰胺"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，过氧化氢，化学式为\u003cimg data-k=\"734f90d791a4\">，是一种无机化合物。纯过氧化氢是淡蓝色的黏稠液体，可任意比例与水混溶，是一种强氧化剂。其水溶液俗称双氧水，为无色透明液体，适用于医用伤口消毒、环境消毒和食品消毒。医疗上常用3％的双氧水进行伤口或中耳炎消毒。\nB项正确，二氧化氯，化学式为\u003cimg data-k=\"77380049b2bb\">，是一种无机化合物，常温常压下是一种黄绿色到橙黄色气体，具有杀菌、漂白、除臭、消毒、保鲜的功能，是一种广谱、高效的灭菌剂。常用于饮用水的消毒杀菌处理、对环境进行消毒（可以杀灭环境中的病原微生物等）、厨房用具和食品机械设备的消毒，在医疗领域二氧化氯可用于口腔含漱以控制牙龈炎、牙斑菌和口臭，对防治红眼病、皮肤病及除臭有良好效果。二氧化氯还可用于水产养殖领域，治疗鱼、虾、蟹、甲鱼、蛙类等细菌性、病毒性疾病。\nC项正确，高锰酸钾（别称PP粉），化学式为\u003cimg data-k=\"800da81056f0\">，为黑紫色结晶，带蓝色的金属光泽，无臭。高锰酸钾是一种强氧化剂，杀菌力极强，其水溶液常用于物体表面、织物、水果等的消毒，医疗上常用0.1%溶液清洗溃疡及脓肿。\nD项错误，丙烯酰胺，化学式为\u003cimg data-k=\"84170134d0ca\">，为无色透明片状晶体，无臭，有毒。溶于水、乙醇，微溶于苯、甲苯。其聚合物或共聚物用作化学灌浆物料；在印刷工业上制光敏树脂板；石油工业可用作增粘剂；玻璃纤维工业上可用作浸润剂；另外还用作土壤改良剂、絮凝剂、纤维改性剂和涂料等。不能用作消毒剂。\n本题为选非题，故正确答案为D。","no":21,"missingImage":false},{"qid":"4652222","cat":"人文常识","stem":"孙某生活在明朝中叶，在他的一生中，最有可能发生的事情是：","options":{"A":"追随郑成功收复台湾","B":"与戚继光抵抗倭寇的侵掠骚扰","C":"欣赏孔尚任的新戏《桃花扇》","D":"与关汉卿讨论《西厢记》的创作"},"answer":"B","explanation":"本题考查人文常识。\n明朝（1368年―1644年）是中国历史上最后一个由汉族建立的大一统中原王朝。明朝中叶是从正统元年（1436）到嘉靖四十五年（1566）。\nA项错误，1624年，荷兰殖民者侵占台湾。1661年（清朝顺治十八年，南明永历十五年），郑成功率领2.5万名将士，乘着数百艘战舰，进军台湾；1662年2月，经过8个月的围攻，郑成功发动总攻，荷兰殖民长官被迫投降。至此，被荷兰侵略者占据了38年的台湾，重新回到祖国的怀抱。故此事件不可能发生在孙某的一生中。\nB项正确，戚继光抗倭发生在明嘉靖年间，约在1555年－1561年，故此事件可能发生在孙某的一生中。\nC项错误，《桃花扇》的作者是清代剧作家孔尚任，于1699年左右写成的。《桃花扇》讲述了明末清初长江以南，南明小朝廷官员侯方域和秦淮名妓李香君的爱情故事。故此事件不可能发生在孙某的一生中。\nD项错误，《西厢记》是元代王实甫创作的杂剧，主要描写了张君瑞与崔莺莺在丫鬟红娘相助下，冲破重重障碍，历尽悲欢离合，最终结为夫妻的故事。《西厢记》作者并非是关汉卿，且关汉卿同为元代的戏曲作家，故此事件不可能发生在孙某的一生中。\n故正确答案为B。","no":22,"missingImage":false},{"qid":"4652223","cat":"人文常识","stem":"下列节气与物候对应错误的是：","options":{"A":"立春——东风解冻","B":"大暑——大雨时行","C":"处暑——腐草为萤","D":"寒露——菊有黄华"},"answer":"C","explanation":"本题考查人文常识。\nA项正确，立春，二十四节气之首，意味着春夏秋冬新的一个轮回正式开始。立春节气分为三候：一候东风解冻；二候蛰虫始振；三候鱼陟负冰。\nB项正确，大暑，二十四节气中第十二个节气，夏季的最后一个节气，大暑节气处于三伏天中的中伏阶段，是一年之中日照最多、气温最高的时期。大暑有“三候”：一候腐草为萤；二候土润溽暑；三候大雨时行，大暑时常有大的雷雨出现，大雨使得暑热减弱，天气开始向立秋过渡。\nC项错误，处暑，二十四节气中第十四个节气，秋季的第二个节气。处暑，标志着炎热天气到了尾声，暑气渐渐消退，天气由炎热向凉爽过渡。古人将处暑节气分为三候：一候鹰乃祭鸟；二候天地始肃；三候禾乃登。\nD项正确，寒露，二十四节气中第十七个节气，秋季的第五个节气，出现在每年的10月8日或9日。寒露分为三候：一候鸿雁来宾；二候雀入大水为蛤；三候菊有黄华。黄华，即黄花，指此时菊花已普遍开放。\n本题为选非题，故正确答案为C。","no":23,"missingImage":false},{"qid":"4652167","cat":"科技常识","stem":"在超市中广泛使用的消费明细单是由下列哪种打印技术实现的？","options":{"A":"3D打印","B":"喷墨打印","C":"热敏打印","D":"激光打印"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，3D打印是采用材料逐渐累加堆积的方法制造实体零件的技术。不同于传统的“材料去除-切削加工”技术，3D打印是一种“自下而上”的制造方法，既适用于金属材料，也适用于非金属材料。\nB项错误，喷墨打印是根据计算机输出的信息，在纸等介质上喷墨形成图文的印刷技术。无须印版，由一个喷嘴喷墨，也可由多个喷嘴排列成行同时喷墨。广泛用于办公室文件印刷、美术设计和广告喷绘。\nC项正确，热敏打印技术的原理是当传真机接受输入信号后，与热敏纸纸面接触的“热头”升温，使热敏变色层中无色染料的分子结构发生变化，显现发色基团，从而显示相应的文字和图像。热敏打印主要用于传真机，医疗、计测系统（如心电图机、热工仪表），计算机联网终端打印，小票打印，签码（POS）等。超市中使用的消费明细单通常利用热敏打印技术生成。\nD项错误，激光打印是利用电子照相技术和激光技术，根据要打印的字符、图形，控制激光打印机内激光束的通、断，使感光鼓表面氧化锌薄膜上的电荷极性发生改变，未受激光束照射的区域能吸附碳粉或其他色粉，再将图案转移到纸上。具有分辨率高、打印速度快与色彩丰富等特点。\n故正确答案为C。","no":24,"missingImage":false},{"qid":"4652184","cat":"人文常识","stem":"血压是重要的生命体征，在测量中我们获得高压、低压两个数值，并以此评估血压水平。下列与血压有关的说法错误的是：","options":{"A":"高血压是指高压和低压同时高于正常值的现象","B":"测量得到的低压是指心室舒张时产生的压力","C":"高钠低钾膳食是我国人群重要的高血压发病危险因素","D":"高血压患者在血压过高时常常伴随头晕等症状"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，在未使用抗高血压药物且安静休息坐位的情况下，非同日三次测量，收缩压均\u003cimg data-k=\"7c37d13de5da\">140mmHg和（或）舒张压均\u003cimg data-k=\"7c37d13de5da\">90mmHg可诊断为高血压；既往有高血压史，现使用\u003cspan style=\"color:#rgb(89,89,89)\">抗高血压药物，虽现血压未达到上述水平，亦应诊断为高血压。\u003c/span>所以一项指标高于正常值即可诊断为高血压。\nB项正确，当心室收缩时，主动脉压快速升高，在收缩期中期达到了最大值，此时动脉血压被称作“高压”，也被称作收缩压，其正常值在90-140mmHg之间；当心室舒张时，主动脉压下降，在心舒末期动脉血压的最低值称为“低压”，也被称作舒张压，其正常值在60-90mmHg之间。\nC项正确，我国人群高血压发病重要危险因素包括遗传因素、年龄以及多种不良生活方式等多方面。《中国高血压防治指南》指出，高钠、低钾膳食是我国人群重要的高血压发病危险因素。\nD项正确，高血压是现在的一种常见疾病，它可以分为原发性高血压和继发性高血压，它的特点是全身性与发病慢。高血压患者常常伴随着头痛、头晕、乏力等一系列症状。\n本题为选非题，故正确答案为A。","no":25,"missingImage":false},{"qid":"4652189","cat":"人文常识","stem":"某小学生给北京市行政区划图上色。按照老师要求，将全区或该区部分区域属于生态涵养区的行政区涂为绿色，其他区涂为黄色。下列行政区中，与其相邻的区被涂为绿色最多的是:","options":{"A":"密云区","B":"顺义区","C":"石景山区","D":"海淀区"},"answer":"B","explanation":"本题考查政治常识。\n\u003cimg data-k=\"86fe60212551\" style=\"max-width:387px\">\n生态涵养发展区是首都生态屏障和重要资源保证地，是构建全市城乡一体化发展的重点地区，也是产业结构优化调整的重要区域。北京市生态涵养发展区包括门头沟、平谷、怀柔、密云、延庆五个区，是北京的生态屏障和水源保护地，是环境友好型产业基地，是保证北京可持续发展的支撑区域，也是北京市民休闲游憩的理想空间。根据图片，顺义区相邻了3个生态涵养区，数量最多。\n故正确答案为B。","no":26,"missingImage":false},{"qid":"4652185","cat":"人文常识","stem":"下列各项体现出矛盾双方相互依存或相互转化的辩证思想的有：","options":{"A":"有无相生，难易相成，长短相形","B":"祸兮福所倚，福兮祸所伏","C":"物必先腐，而后虫生","D":"贵上极则反贱，贱下极则反贵"},"answer":"ABD","explanation":"本题考查政治常识。\nA项正确，“有无相生，难易相成，长短相形”的意思是有和无因相互对立而存在，难和易因相互对立而形成，长和短因相互对立而出现。这句话体现了矛盾双方相互依存，互为存在的前提。\nB项正确，“祸兮福所倚，福兮祸所伏”的意思是福与祸相互依存、互相转化，比喻坏事可以引发出好结果，好事也可以引发出坏结果。这句话句体现了矛盾双方的相互贯通，在一定条件下可以相互转化。\nC项错误，“物必先腐，而后虫生”的意思是东西总是自身先腐烂，然后虫子才可以寄生，比喻自己先有弱点而后为外物所侵害。这句话体现了内因是事物发展的根据。\nD项正确，“贵上极则反贱，贱下极则反贵”的意思是物价贵到极点，就一定会下跌；物价贱到极点，就一定会上涨。这句话句体现了矛盾双方的相互贯通，在一定条件下可以相互转化。\n故正确答案为ABD。","no":27,"missingImage":false},{"qid":"4652187","cat":"人文常识","stem":"“十四五规划”提出要“坚持系统观念”，加强前瞻性思考、全局性谋划、战略性布局、整体性推进，实现发展质量、结构、规模、速度、效益、安全相统一。“系统观念”所蕴含的哲学原理有：","options":{"A":"世界是一个普遍联系的有机整体","B":"掌握系统优化的方法，要着眼于事物的整体性","C":"部分的功能及其变化决定整体的功能及其变化","D":"事物内部不同部分之间和不同事物之间存在着固有的联系"},"answer":"ABD","explanation":"本题考查政治常识。\nA、D两项正确，唯物辩证法认为事物是普遍联系的，世界上没有孤立存在的事物，每一种事物都是在与其他事物的联系之中存在的。任何事物内部的不同部分和要素之间都是相互联系的，任何事物都具有内在的结构性；任何事物都不能孤立存在，都同其他事物处于一定的联系之中；整个世界是相互联系的统一整体。题中“坚持系统观念”强调了要加强全局性谋划、战略性布局、整体性推进，体现了世界是一个普遍联系的有机整体和事物内部不同部分之间和不同事物之间存在着固有的联系。\nB项正确，掌握系统优化的方法，要着眼于事物的整体性，要注意遵循系统内部结构的有序性，要注意系统内部结构的优化趋向。“坚持系统观念”，加强前瞻性思考、全局性谋划、战略性布局、整体性推进体现了这一哲学原理。\nC项错误，整体是由部分构成的，部分的功能及其变化会影响整体的功能，关键部分的功能及其变化甚至对整体的功能起决定作用。选项本身表述有误。\n故正确答案为ABD。","no":28,"missingImage":false},{"qid":"4652191","cat":"人文常识","stem":"甲、乙、丙和丁四人计划合作出资成立一股份公司，注册时可以被认可的出资形式有：","options":{"A":"甲以现金出资","B":"乙以自己的发明出资","C":"丙以自己的产权房出资","D":"丁以自己的机械设备出资"},"answer":"ABCD","explanation":"本题考查法律常识。\n根据《公司法》第八十二条的规定，股份公司发起人的出资方式，适用该法第二十七条的规定。第二十七条第一款规定：“股东可以用货币出资，也可以用实物、知识产权、土地使用权等可以用货币估价并可以依法转让的非货币财产作价出资；但是，法律、行政法规规定不得作为出资的财产除外。”\nA项正确，甲以现金出资属于用货币出资的形式。\nB项正确，乙以自己的发明出资属于用知识产权出资的形式。\nC、D两项正确，丙以自己的产权房出资，丁以自己的机械设备出资均属于用实物出资的形式。\n故正确答案为ABCD。","no":29,"missingImage":false},{"qid":"4652265","cat":"人文常识","stem":"党的七大把党在长期奋斗中形成的优良作风概括为三大作风，即：","options":{"A":"理论和实践相结合的作风","B":"和人民群众紧密联系在一起的作风","C":"艰苦奋斗的作风","D":"自我批评的作风"},"answer":"ABD","explanation":"本题考查毛中特。\n三大优良作风是指理论联系实际、密切联系群众以及批评与自我批评的作风。它是毛泽东在中共七大上作的《论联合政府》的政治报告中总结概括出来的，是中国共产党在长期的革命斗争中形成的全党统一的优良作风，是我们党同其他政党相区别的显著标志。\nA项，理论和实践相结合的作风，就是把马克思列宁主义的基本原理同中国革命的具体实践相结合，从实际出发，实事求是的作风，符合题意。\nB项，密切联系群众的作风，是指党的各级组织和党员干部要和党内外的群众结合在一起，密切党和人民群众的关系，一切为了群众，一刻也不脱离群众，符合题意。\nC项，“两个务必”即“务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风”，是毛泽东同志在党的七届二中全会上提出的，不符合题意。\nD项，批评与自我批评是正确处理和有效地解决党内矛盾，克服缺点，纠正错误的科学方法，符合题意。\n故正确答案为ABD。","no":30,"missingImage":false},{"qid":"4652141","cat":"经济常识","stem":"货币的职能包括：","options":{"A":"价值尺度","B":"流通手段","C":"贮藏手段","D":"支付手段"},"answer":"ABCD","explanation":"本题考查经济常识。\n货币是固定充当一般等价物的特殊商品，是商品交换和价值形态发展的必然产物。\n货币的职能包括：①价值尺度，货币以自身价值作为尺度来衡量其他一切商品的价值；②流通手段，货币充当商品交换的媒介；③支付手段，在发生赊购赊销的情况下，货币用于清偿债务所执行的职能；④贮藏手段，货币退出流通领域，被人们当作社会财富的一般代表加以贮藏；⑤世界货币，货币在世界市场上作为一种购买手段、支付手段和社会财富的代表所发挥的作用。其中，价值尺度和流通手段是货币的两个最基本职能，其他三种职能是在这两种基本职能的基础上派生和发展出来的。\n故正确答案为ABCD。","no":31,"missingImage":false},{"qid":"4652144","cat":"人文常识","stem":"下列选项中，前后表述内涵对应一致的有：","options":{"A":"政之所兴，在顺民心。政之所废，在逆民心——江山就是人民，人民就是江山","B":"当官避事平生耻，视死如归社稷心——科学决策，精准施策","C":"廉者，民之表也；贪者，民之贼也——清正廉洁，严格自律","D":"成功不必在我，而功力必不唐捐——依法行政，处事公正"},"answer":"AC","explanation":"本题考查人文常识。\nA项正确，“政之所兴，在顺民心。政之所废，在逆民心”出自《管子·牧民》，意思是政权之所以能兴盛，在于顺应民心；政权之所以废弛，则因为违逆民心。“江山就是人民，人民就是江山”出自习近平2021年2月20日在党史学习教育动员大会上的讲话。前后两句都表明了人民对于国家政权的重要性，要顺应民心，为民服务。\nB项错误，“当官避事平生耻，视死如归社稷心”出自元好问的《四哀诗·李钦叔》，意思是做官避事是平生最大的耻辱，为了国家民族牺牲生命也在所不惜。“科学决策，精准施策”是疫情当前，形势严峻，各地各部门越应当因时因地制宜把各项工作抓实、抓细、抓落地，避免形式主义，打赢疫情防控的准则。前后两句表述内涵不一致。\nC项正确，“廉者，民之表也；贪者，民之贼也”出自包拯《孝肃奏议集·乞不用赃吏》，意思是廉洁的官吏是民众的表率，贪官是侵害民众的盗贼，强调为官者要清廉为民。“清正廉洁，严格自律”是党员和国家干部必备的政治品德，是保持共产党员先进性和纯洁性的基本要求，强调清廉为民。前后两句表述内涵一致。\nD项错误，“成功不必在我，而功力必不唐捐”出自胡适的《致毕业生》，意思是成功不一定非要看自己，社会的进步也是成功。你做出的所有努力都不会白费，至少会得到经验教训。“依法行政，处事公正”是我国政府工作的基本原则，是政府公信力的来源和树立的方法。前后两句表述内涵不一致。\n故正确答案为AC。","no":32,"missingImage":false},{"qid":"4652146","cat":"人文常识","stem":"中国古代许多诗人喜欢写“山”，以下诗句与作者对应正确的有：","options":{"A":"不识庐山真面目，只缘身在此山中——苏轼","B":"五岳寻仙不辞远，一生好入名山游——谢灵运","C":"会当凌绝顶，一览众山小——杜甫","D":"采菊东篱下，悠然见南山——陶渊明"},"answer":"ACD","explanation":"本题考查人文常识。\nA项正确，“不识庐山真面目，只缘身在此山中”出自北宋诗人苏轼的《题西林壁》，意思是之所以认不清庐山真正的面目，是因为人身处在庐山之中。\nB项错误，“五岳寻仙不辞远，一生好入名山游”出自唐代李白的《庐山谣寄卢侍御虚舟》，意思是攀登五岳寻仙道不畏路远，这一生就喜欢踏上名山游。\nC项正确，“会当凌绝顶，一览众山小”出自唐代杜甫的《望岳》，意思是一定要登上那最高峰，俯瞰在泰山面前显得渺小的群山。\nD项正确，“采菊东篱下，悠然见南山”出自魏晋陶渊明的《饮酒·其五》，意思是在东篱之下采摘菊花，悠然间，那远处的南山映入眼帘。\n故正确答案为ACD。","no":33,"missingImage":false},{"qid":"4652148","cat":"地理国情","stem":"根据板块学说，喜马拉雅山脉是由下列哪些板块碰撞造成的？","options":{"A":"欧亚板块","B":"非洲板块","C":"太平洋板块","D":"印度洋板块"},"answer":"AD","explanation":"本题考查地理国情。\n喜马拉雅山脉是由印度洋板块和欧亚板块的挤压碰撞而形成的，位于青藏高原南巅边缘，是世界海拔最高的山脉，主峰是世界最高峰珠穆朗玛峰。喜马拉雅山脉是东亚大陆与南亚次大陆的天然界山，也是中国与印度、尼泊尔、不丹、巴基斯坦等国的天然国界，西起克什米尔的南迦-帕尔巴特峰，东至雅鲁藏布江大拐弯处的南迦巴瓦峰。\n故正确答案为AD。","no":34,"missingImage":false},{"qid":"4652152","cat":"人文常识","stem":"在以下绘画技法中，属于中国画的技法有：","options":{"A":"白描","B":"素描","C":"写意","D":"水墨"},"answer":"AC","explanation":"本题考查人文常识。\nA项正确，白描，中国画技法名。指用墨线勾勒描摹物象的轮廓，不设颜色。白描多用于画人物、花卉，着墨不多，气韵生动。白描源于古代的“白画”。一般运用同一墨色，通过线条的长短、粗细、轻重、转折等表现物象的质感和动势。\nB项错误，素描，是一种用单色或少量色彩绘画材料描绘生活所见真实事物或所感的绘画形式，习惯上素描是以单色画为主，但在美术辞典中，水彩画也属于素描；素描的起源，普遍都是以文艺复兴开始，希腊的瓶绘、雕塑都有良好的素描基础。初期的素描是视为绘画的底稿。\nC项正确，写意，中国画技法名。指以简练恣纵的笔墨勾勒描绘物象的意态神韵，重在抒发创作主体的意兴情趣。用笔灵活，不拘工细，不求形似（与“工笔”相对）。写意有小写意、大写意之分，后者多采用泼墨技法。\nD项错误，水墨，即“水墨画”，指中国画中纯用水墨、不用色彩的一种绘画形式，也称国画、中国画。以水、墨、毛笔和宣纸作为主要材料，通过调配清水的多少，引为浓墨、淡墨、干墨、湿墨、焦墨等，画出浓淡层次不同的作品。水墨是中国画的表现形式而非中国画技法。\n故正确答案为AC。","no":35,"missingImage":false}]}],"count":32,"answerable":32,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>以下是略有删节的公文部分内容，阅读之后回答下列问题。\u003c/p>\u003cp>（六）整体布局、协同联动，强化领域应用\u003c/p>\u003cp>①深化体系交通领域整合。推动智能信号灯“绿波调节”，推广公交信号优先系统，开展试点区域内执行任务救护车、消防车等特种车辆的“一键护航”。\u003cu>        \u003c/u>出行体验，探索公共交通“一码通乘”，推动定制公交、预约出行、共享单车、汽车分时租赁、停车位错时共享等多样化交通出行服务模式。持续提升全市交通综合治理水平，推动重点站区“一屏统管”，保障冬奥交通管理指挥调度。\u003cu>        \u003c/u>车联网先导区建设范围与规模，探索重点区域“全息路网”，开展创新应用，促进创新发展。\u003c/p>\u003cp>②推动生态环保领域协同。加强感知统筹，建立生态环保“测管治”一体化协同体系，提升生态环保综合执法效率。提高重污染天气、地质灾害、地震灾害、森林火灾等场景一体化应急管理服务能力，加强水环境管理、水旱灾防御、农业农村管理、公园管理等智慧化应用。鼓励社会企业创新生态环保应用，激活企业绿色技术创新动能。\u003c/p>\u003cp>③加强规划管理应急联动。摸清城市运行、安全生产、自然灾害等监测基础设施家底，强化城市风险管理，加强应急状态下一体化指挥调度与应急救援处置的能力。推广具有“一杆多用”功能的城市智慧灯杆。基于“时空一张图”推进“多规合一”。探索试点区域基于城市信息模型（CIM）实现规建管运一体联动。构建安居北京住房保障民生服务平台，提升建筑工程监管服务水平，深化住建行业信用体系建设。健全公众参与社会监督机制，利用随手拍、政务维基、社区曝光台等方式快速发现城市管理问题。\u003c/p>\u003cp>④丰富人文环境智慧应用。推动数字图书馆、数字文化馆、数字博物馆建设，延伸公共文化服务能力进基层，推进公共文化设施运营管理平台建设，推进文化惠民。基于特殊人员画像开展社会帮扶救助，打造温暖宜居社区环境。通过“北京通”等政务移动端实现失业保险申领、住房公积金提取、职业资格认定等事项线上线下一体化办理。拓展扶农助农手段，利用电商平台促进农产品直播带货、直销社区。\u003c/p>","questions":[{"qid":"4652254","cat":"片段阅读","stem":"选文最可能出自下列哪篇公文？","options":{"A":"《北京市关于“十四五”时期深化推进“疏解整治促提升”专项行动的实施意见》","B":"《北京市关于“十四五”时期构建现代环境治理体系的实施方案》","C":"《北京市“十四五”时期智慧城市发展行动纲要》","D":"《北京市“十四五”时期交通综合治理行动计划》"},"answer":"C","explanation":"本文为删减版公文，由小标题“整体布局、协同联动，强化领域应用”可知本文与城市整体协同规划相关，四个自然段分别从交通领域、生态环保、应急联动、人文环境等角度具体展开论述，且均涉及城市的智能化治理。故本文从多方面介绍推动城市治理智能化的举措，对应C项。\nA项，“‘疏解整治促提升’专项行动”，偏离本文核心话题，排除；\nB、D两项，“环境治理”和“交通综合治理”分别对应本文第②段和第①段，均表述片面，排除。\n故正确答案为C。\n【文段出处】《北京市“十四五”时期智慧城市发展行动纲要》","no":36,"missingImage":false},{"qid":"4652275","cat":"逻辑填空","stem":"依次填入文中画横线处最恰当的是：","options":{"A":"强化 探索","B":"优化 扩大","C":"更新 拓展","D":"创新 深化"},"answer":"B","explanation":"本题可从第二空入手，搭配“范围与规模”，B项“扩大”、C项“拓展”均搭配恰当，保留。A项“探索”指多方寻求答案，解决疑问，多搭配“奥秘”“模式”等，D项“深化”强调使向更深的阶段发展，常搭配“改革”等，均与“范围与规模”搭配不当，排除。\n第一空，搭配“出行体验”，且由前后文可知，“深化体系交通领域整合”的种种举措可以提升人们的出行体验，即让人们拥有更好的出行体验。B项“优化”指采取一定措施使变得优秀，符合文意，当选。C项“更新”强调除去旧的，换成新的，与“更好”的文意不符，排除。\n故正确答案为B。\n【文段出处】《北京市“十四五”时期智慧城市发展行动纲要》","no":37,"missingImage":false},{"qid":"4652276","cat":"片段阅读","stem":"“推动开展线上文旅展出、线上体育健康活动和线上演出活动，加强云转播、沉浸式观赛、多场景一脸通行等智能技术应用体验”这一措施最可能出自文中的哪一段？","options":{"A":"①","B":"②","C":"③","D":"④"},"answer":"D","explanation":"题干中“推动开展线上文旅展出、线上体育健康活动和线上演出活动”均属于人文类的智慧应用，“云转播、沉浸式观赛、多场景一脸通行”也是为了优化人文环境，故该措施主要是针对人文环境提出，文章只有第④段涉及丰富人文环境智慧应用，故这一措施最可能出自第④段，对应D项。\nA、B、C三项分别涉及交通领域、生态环保领域及应急联动领域，均未提及人文环境，与题干话题不一致，排除。\n故正确答案为D。\n【文段出处】《北京市“十四五”时期智慧城市发展行动纲要》","no":38,"missingImage":false},{"qid":"4652277","cat":"片段阅读","stem":"下列哪一情景不涉及选文部署的工作事项？","options":{"A":"在景区网站上预约门票后进行参观","B":"利用“北京通”政务移动端提取住房公积金","C":"使用一个乘车码乘坐公交、地铁等","D":"通过“随手拍”方式举报城市管理中的问题"},"answer":"A","explanation":"A项，“在景区网站上预约门票后进行参观”无中生有，文章并未提及，故不属于选文部署的工作事项，当选；\nB项，根据第④段“通过‘北京通’等政务移动端实现失业保险申领、住房公积金提取、职业资格认定等事项线上线下一体化办理”可知，“利用‘北京通’政务移动端提取住房公积金”属于选文部署的工作事项，排除；\nC项，根据第①段“探索公共交通‘一码通乘’，推动定制公交、预约出行、共享单车、汽车分时租赁、停车位错时共享等多样化交通出行服务模式”可知，“使用一个乘车码乘坐公交、地铁等”属于选文部署的工作事项，排除；\nD项，根据第③段“健全公众参与社会监督机制，利用随手拍、政务维基、社区曝光台等方式快速发现城市管理问题”可知，“通过‘随手拍’方式举报城市管理中的问题”属于选文部署的工作事项，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《北京市“十四五”时期智慧城市发展行动纲要》","no":39,"missingImage":false},{"qid":"4652278","cat":"片段阅读","stem":"落实选文中提及的各项措施，有助于政府部门实现下列哪些目标？\n①提升政务管理效能\n②惠民服务便捷高效\n③增强政民互动效能\n④精准分析海量数据","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"A","explanation":"根据第②段“建立生态环保‘测管治’一体化协同体系，提升生态环保综合执法效率”可知，推动生态环保领域协同能够提升政务管理效率，且根据第③段“加强规划管理应急联动”“加强应急状态下一体化指挥调度与应急救援处置的能力”可知，该措施可提升政务管理效能，故有助于实现目标①；\n根据第④段“推进公共文化设施运营管理平台建设，推进文化惠民”可知，丰富人文环境智慧应用，可使惠民服务便捷高效，故有助于实现目标②；\n根据第③段“健全公众参与社会监督机制，利用随手拍、政务维基、社区曝光台等方式快速发现城市管理问题”可知，该措施可增强政民互动，故有助于实现目标③。\n目标④中“精准分析海量数据”无中生有，选文中未涉及“数据”话题，故不能实现该目标。\n综上所述，①②③正确，对应A项。\n故正确答案为A。\n【文段出处】《北京市“十四五”时期智慧城市发展行动纲要》","no":40,"missingImage":false}]},{"type":"material","material":"\u003cp>材料一：\u003c/p>\u003cp>        终于，在离“家”17个月后，云南北移亚洲象群的14只大象跨越元江，平安回归栖息地。这段时间，“断鼻家族”一路向北，吸引了全世界的目光。我们为象群集体倒地睡觉的照片而惊叹，也为竭力保证象群一路生活所需默默努力的人们而感动。象群为何不再害怕人类？从受采访者的话语中，我们能窥见端倪。“大象也饿了，它也不是故意的。”“没吃多少玉米，这些玉米都无所谓。”“可能它走掉，我还会关切，还会想它。”\u003cu>                    \u003c/u>。人们自觉承担起保护亚洲象的责任，让涓涓细流汇聚出了磅礴的力量，为亚洲象一路北上提供了重要保障。\u003c/p>\u003cp>        青山绿水之间，亚洲象一路“逛吃”，人类紧随其后实时保护，人与自然和谐共存的画面，展现出我们从工业文明向生态文明的转变。高质量的发展，绝不以损害大自然为前提。人生于天地之中，应当善待草木山川、珍惜鸟兽虫鱼，因为人不可能脱离自然而独立存在。此次，大象成功归家，让世界看到了中国对待野生动物的态度，也传递出了“保护自然环境，中国始终在路上”的决心。\u003c/p>\u003cp>材料二：\u003c/p>\u003cp>        生产力是文明的基础和动力。人类文明新形态是建立在先进生产力基础上的文明。但是，没有自然界提供的劳动要素，生产力便会成为“无米之炊”。劳动和自然界的馈赠是一切财富的基础和来源。先进生产力不仅是在持续的自然生产力基础上实现经济生产力永续发展的生产力，而且是按照人与自然和谐共生原则和方向发展的生产力。只有以此为经济基础，才能保证人类文明新形态的永续性。\u003c/p>\u003cp>        现代化代表着当下的先进生产力。按照资本逻辑推进现代化，西方现代化走过了一条先污染后治理的道路。以此为鉴，在坚持社会主义现代化道路的基础上，我们的现代化必须是人与自然和谐共生的现代化。实现人与自然和谐共生的现代化，就要将生态化作为现代化的前提、内容、方向。\u003c/p>\u003cp>        现代化是一个生生不息的过程。西方现代化经历了工业化、城市化、农业产业化、信息化的发展顺序，并将生态化纳入到了现代化当中，形成了生态现代化范式。现在，我国农业产业化的任务尚未完全完成，工业化进入到了中后期发展阶段，信息化已有所发展。相比之下，只有坚持“绿水青山就是金山银山”的理念，协调推进工业化、城镇化、农业现代化、信息化和绿色化，才能赶超西方现代化。协调推进工业化、城镇化、农业现代化、信息化和绿色化，就是要系统集成农业文明、工业文明、智能文明和生态文明的先进成果，推动人类文明不断升级换代。这样就开辟出了人类文明新形态的发展方向。\u003c/p>\u003cp>材料三：\u003c/p>\u003cp>        生态环境保护和经济发展是辩证统一、相辅相成的，建设生态文明、推动绿色低碳循环发展，不仅可以满足人民日益增长的优美生态环境需要，而且可以推动实现更高质量、更有效率、更加公平、更可持续、更为安全的发展，走出一条生产发展、生活富裕、生态良好的文明发展道路。“十四五”时期，我国生态文明建设进入了以降碳为重点战略方向、推动减污降碳协同增效、促进经济社会发展全面绿色转型、实现生态环境质量改善由量变到质变的关键时期。要完整、准确、全面贯彻新发展理念，保持战略定力，站在人与自然和谐共生的高度来谋划经济社会发展，坚持节约资源和保护环境的基本国策，坚持节约优先、保护优先、自然恢复为主的方针，形成节约资源和保护环境的空间格局、产业结构、生产方式、生活方式，统筹污染治理、生态保护、应对气候变化，促进生态环境持续改善，努力建设人与自然和谐共生的现代化。\u003c/p>","questions":[{"qid":"4652239","cat":"语句表达","stem":"填入材料一画横线处最恰当的是：","options":{"A":"大象归家，生态保护还需一以贯之","B":"我们有理由相信，经济发展与环境保护并不矛盾，人与自然可以和谐共生","C":"保护野生动物，不再只是国家层面的政策措施，更得到每一个人发自内心的认可","D":"当全世界都在围观中国大象的时候，不妨以此为契机，让世界看到我们在生态文明建设上取得的成就"},"answer":"C","explanation":"本题为语句填空题，横线出现在文段中间，需注意与前后文的衔接，横线前分析象群为何不再害怕人类，并指出从受访者的话语中可以找到原因，而受访者的话语中透露着人们对大象的关心。横线后指出人们自觉主动地承担起了保护亚洲象的责任。故横线前后都在阐述普通群众对大象的关心与保护是发自内心的，对应C项。\nA项，横线前后均未提及“生态保护”，且“需一以贯之”无法对应后文内容，与前后文衔接不当，排除；\nB项，横线前后均未提及“经济发展”，与前后文衔接不当，排除；\nD项，横线前后均强调普通人对大象的保护意识有所提升，“我们在生态文明建设上取得的成就”范围过大，排除。\n故正确答案为C。\n【文段出处】《东湖评论：大象归家，生态保护还需一以贯之》《夯实人类文明新形态的生态基石》《习近平在中共中央政治局第二十九次集体学习时强调 保持生态文明建设战略定力 努力建设人与自然和谐共生的现代化》","no":41,"missingImage":false},{"qid":"4652241","cat":"片段阅读","stem":"材料一反映出了我国生态文明建设在哪方面取得的成就？","options":{"A":"绿色低碳循环发展","B":"生物多样性保护","C":"建立保护环境的生产方式","D":"应对外来物种入侵"},"answer":"B","explanation":"材料一第一段通过介绍亚洲象群迁徙事件，表达了群众已经具有生物保护的意识，第二段围绕该事件展开论述，指出人类紧随其后的实时保护，展现出了“我们从工业文明向生态文明的转变”，随后进一步论述，强调人类应当善待生态环境，尾句通过“此次”进行总结，重点强调该事件反映出我国对待野生动物的态度和保护生态环境的决心。故材料一反映出了人们对野生动物及生态环境的保护，是“生物多样性保护”方面的成就，对应B项。\nA项，“绿色低碳循环发展”无中生有，排除；\nC项，文段没有涉及关于“生产方式”的论述，无中生有，排除；\nD项，“外来物种入侵”无中生有，排除。\n故正确答案为B。\n【文段出处】《东湖评论：大象归家，生态保护还需一以贯之》《夯实人类文明新形态的生态基石》《习近平在中共中央政治局第二十九次集体学习时强调 保持生态文明建设战略定力 努力建设人与自然和谐共生的现代化》","no":42,"missingImage":false},{"qid":"4652245","cat":"片段阅读","stem":"以下与材料二对应现代化的理解分析不一致的一项是：","options":{"A":"我国的现代化将按照工业化、城市化、农业产业化、信息化的顺序发展","B":"将绿色化与工业化、农业现代化、信息化等相结合发展才是社会主义的现代化道路","C":"西方的现代化经历了先污染后治理的道路，是不符合当下先进生产力的发展方向的","D":"我们不能走西方国家的现代化道路，应开辟代表人类文明新形态的发展方向"},"answer":"A","explanation":"A项，根据第三段“西方现代化经历了工业化、城市化、农业产业化、信息化的发展顺序”“只有坚持‘绿水青山就是金山银山’的理念，协调推进工业化、城镇化、农业现代化、信息化和绿色化，才能赶超西方现代化”可知，我国现代化各阶段是协同发展的，不是按照西方现代化的顺序发展，偷换概念，当选；\nB项，根据第三段“只有坚持‘绿水青山就是金山银山’的理念，协调推进工业化、城镇化、农业现代化、信息化和绿色化，才能赶超西方现代化”可知，表述正确，排除；\nC项，根据第二段“按照资本逻辑推进现代化，西方现代化走过了一条先污染后治理的道路。以此为鉴，在坚持社会主义现代化道路的基础上，我们的现代化必须是人与自然和谐共生的现代化”可知，先污染后治理不符合当下的发展方向，表述正确，排除；\nD项，根据第二段“西方现代化走过了一条先污染后治理的道路”，我们要“以此为鉴”，可知“我们不能走西方国家的现代化道路”表述正确，“应开辟代表人类文明新形态的发展方向”对应第三段尾句“这样就开辟出了人类文明新形态的发展方向”，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《东湖评论：大象归家，生态保护还需一以贯之》《夯实人类文明新形态的生态基石》《习近平在中共中央政治局第二十九次集体学习时强调 保持生态文明建设战略定力 努力建设人与自然和谐共生的现代化》","no":43,"missingImage":false},{"qid":"4652246","cat":"片段阅读","stem":"2021年6月5日世界环境日主题是“人与自然和谐共生”，下列哪项最能体现该主题：","options":{"A":"取之有度，用之有节","B":"子钓而不纲，弋不射宿","C":"天行健，君子以自强不息","D":"天地与我并生，而万物与我为一"},"answer":"D","explanation":"A项，“取之有度，用之有节”意思是取用资源等要有限度，使用它们要有节制，并未体现出“人与自然和谐共生”的主题，排除；\nB项，“子钓而不纲，弋不射宿”意思是孔子只用鱼竿钓鱼，而不用大网来捕鱼；用带的箭射鸟，但不射归巢栖息的鸟，也就是不可滥捕滥杀，影响到鱼类、鸟类的正常繁衍，重点强调的是要对自然资源取用有限度，有节制，进而体现出孔子的仁爱之心，并未体现出“人与自然和谐共生”的主题，排除；\nC项，“天行健，君子以自强不息”意思是宇宙不停运转，人应效法天地，永远不断地前进，强调人应自强，并未体现出“人与自然和谐共生”的主题，排除；\nD项，“天地与我并生，而万物与我为一”意思是天地与我同生，万物与我是一体的，强调的是要顺应自然，人与自然是生命共同体，人与自然是平等的关系，应和谐相处，与文意相符，当选。\n故正确答案为D。\n【文段出处】《东湖评论：大象归家，生态保护还需一以贯之》《夯实人类文明新形态的生态基石》《习近平在中共中央政治局第二十九次集体学习时强调 保持生态文明建设战略定力 努力建设人与自然和谐共生的现代化》","no":44,"missingImage":false},{"qid":"4652251","cat":"片段阅读","stem":"根据材料三，下列选项中不属于为了节约资源和保护环境所采取的措施的是：","options":{"A":"2020年北京市共完成148条道路、382公里自行车道整治任务，核心区主干路自行车道整治实现全覆盖，王府井、CBD等一批慢行示范区建成，市民“伴着街景骑回家”的美好愿景成为现实","B":"“十三五”时期，北京市累计疏解退出一般制造业企业2154家，退出企业主要集中在建材、机械制造与加工、家具和木制品加工等行业","C":"城市副中心因地制宜，用背街小巷周边腾出的可利用空间，在居民停车需求强烈的街区开辟了便民停车场；在“溜娃”需求强烈的街区增设滑梯等儿童游乐设施；在养老需求强烈的街区建起了养老驿站","D":"北京市等级旅游景区针对不同重点突出区域，采取不同的生活垃圾分类精细化落实方案。如餐饮区设置“可回收物、厨余垃圾、其他垃圾”桶；办公区张贴（展示）生活垃圾分类投放指引宣传画等"},"answer":"C","explanation":"根据材料三中节约资源和保护环境的措施可知：\nA项，“自行车道整治”既能满足市民“伴着街景骑回家”的美好愿景，又能绿色出行，降碳减排，属于节约资源的措施，排除；\nB项，建材、机械制造与加工等行业在生产过程中会对环境产生很大的危害，同时家具、木制品加工等行业破坏自然资源，疏解退出这些行业有利于节约资源，保护环境，属于节约资源和保护环境的措施，排除；\nC项，“便民停车场”“儿童游乐设施”“养老驿站”均为城市基础设施建设，是为了提升人们的生活质量，满足人们的精神需求，与节约资源和保护环境无关，当选；\nD项，“生活垃圾分类”属于保护环境的措施，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《东湖评论：大象归家，生态保护还需一以贯之》《夯实人类文明新形态的生态基石》《习近平在中共中央政治局第二十九次集体学习时强调 保持生态文明建设战略定力 努力建设人与自然和谐共生的现代化》","no":45,"missingImage":false}]},{"type":"material","material":"\u003cp>阅读以下文字，回答下列问题。\u003c/p>\u003cp>        2021年，在北京市不断创新探索并取得积极成效基础上，我国服务业扩大开放综合试点再度扩容。天津、上海、海南、重庆4省市近日成为新晋试点地区。4省市合计明确203项试点任务，与北京市形成“1+N”的试点格局。\u003c/p>\u003cp>        试点扩容对于建设更高水平开放型经济新体制，对于构建新发展格局具有重要意义。可以预计，此举必将带动更多国际先进服务业进入中国市场，产生鲇鱼效应，为推动我国实施更大范围、更宽领域、更深层次对外开放带来更多利好。\u003c/p>\u003cp>        首先，这有利于我国进一步塑造国际竞争和合作新优势。当前，我国的服务业开放既面临重要的机遇，也存在现实的差距。一方面，我国人均GDP突破1万美元大关，消费形态正在由以实物消费为主加快向以服务消费为主转变，服务业吸收外资已占吸收外资总量的70%以上。另一方面，目前我国服务业增加值约占GDP的55%，比发达国家低20个百分点左右，存在与制造业融合发展不够、现代服务业发展不足等问题。为此，需要进一步扩大服务业开放，持续培育新的发展动能，塑造国际竞争和合作新优势。\u003c/p>\u003cp>        其次，这有利于更好发挥地方首创精神。服务业开放点多面广、门类众多，既涉及生产性服务业、生活性服务业的统筹，又涉及各类新模式新业态的发展，需要多维度开展创新探索。比如，天津将试点工作放在京津冀协同发展国家战略大局中加以谋划考虑；\u003cu>        \u003c/u>将强化国家战略承载区域的示范效应；\u003cu>        \u003c/u>统筹先进制造业和现代服务业融合发展；\u003cu>        \u003c/u>推动制度集成创新，着力建设成为国内国际双循环的重要交汇点。\u003c/p>\u003cp>        总的来看，这次开展试点的4省市服务业发展基础较好，区域和产业代表性较强。因此，通过改革创新，发挥地方首创精神，能够在工作中积累更多可复制可推广经验，对全国服务业开放发挥示范带动作用。\u003c/p>\u003cp>        最后，这还有利于加强协同开放。新增4个试点省市，有助于与北京的示范区建设形成梯次安排与协调配合，更加有序安排试点政策实施和经验复制推广工作，多点开展试验论证，形成综合效应。可在统筹好共性领域开放探索的前提下，充分体现地区特色、特点，鼓励差异化探索。将北京市24项创新性较强的试点任务纳入4省市方案，接近52项共性试点任务的半数，共同开展开放探索；明确有各地特色的措施151项，约占总体203项试点任务的四分之三。\u003c/p>","questions":[{"qid":"4652244","cat":"片段阅读","stem":"根据文中第2段，为了产生“鲇鱼效应”应该：","options":{"A":"建设更高水平开放型经济新体制","B":"构建全新的国际服务业发展格局","C":"吸引国际先进服务业进入中国市场","D":"推动我国实施全面高水平对外开放"},"answer":"C","explanation":"A、B两项，对应第2段“试点扩容对于建设更高水平开放型经济新体制，对于构建新发展格局具有重要意义”，均属于试点扩容的重要意义，并非产生“鲇鱼效应”的原因，排除；\nC项，对应第2段“此举必将带动更多国际先进服务业进入中国市场，产生鲇鱼效应”，属于产生“鲇鱼效应”的原因，当选；\nD项，对应第2段“为推动我国实施更大范围、更宽领域、更深层次对外开放带来更多利好”，属于产生“鲇鱼效应”后带来的积极意义，并非产生“鲇鱼效应”的原因，排除。\n故正确答案为C。\n【文段出处】《以扩大开放培育服务业增长动能》","no":46,"missingImage":false},{"qid":"4652249","cat":"片段阅读","stem":"关于我国目前的服务业，下列说法正确的是：","options":{"A":"服务业已成为吸收外资的主力","B":"服务消费成为消费形态的主要形式","C":"服务业与制造业融合发展日臻完善","D":"服务业增加值占GDP的比值与发达国家持平"},"answer":"A","explanation":"A项，根据第3段“服务业吸收外资已占吸收外资总量的70%以上”可知，表述正确，当选；\nB项，根据第3段“消费形态正在由以实物消费为主加快向以服务消费为主转变”可知，消费形态只是正在向服务消费转变，“成为消费形态的主要形式”时态错误，排除；\nC项，根据第3段“目前我国服务业增加值约占GDP的55%，比发达国家低20个百分点左右，存在与制造业融合发展不够、现代服务业发展不足等问题”可知，“融合发展日臻完善”与文意相悖，排除；\nD项，根据第3段“目前我国服务业增加值约占GDP的55%，比发达国家低20个百分点左右”可知，“与发达国家持平”表述错误，排除。\n故正确答案为A。\n【文段出处】《以扩大开放培育服务业增长动能》","no":47,"missingImage":false},{"qid":"4652252","cat":"片段阅读","stem":"根据本文，下列说法中错误的是：","options":{"A":"我国服务业已形成强大的国际市场，在国际竞争中占有领先地位","B":"发挥地方首创精神有利于对全国服务业开放发挥示范带动作用","C":"北京市24项创新性较强的试点任务约占总体试点任务的一成多","D":"4省市开展好共性领域开放探索的同时，还可进行差异化探索"},"answer":"A","explanation":"A项，根据第3段“首先，这有利于我国进一步塑造国际竞争和合作新优势。当前，我国的服务业开放既面临重要的机遇，也存在现实的差距”“另一方面，目前我国服务业增加值约占GDP的55%，比发达国家低20个百分点左右”可知，目前我国服务业在国际竞争中并非处于“领先地位”，表述错误，当选；\nB项，根据第5段“因此，通过改革创新，发挥地方首创精神，能够在工作中积累更多可复制可推广经验，对全国服务业开放发挥示范带动作用”可知，表述正确，排除；\nC项，根据第1段“4省市合计明确203项试点任务”可知，总体试点任务为203项，“一成”即为十分之一，“北京市24项创新性较强的试点任务”所占比例为“一成多”，表述正确，排除；\nD项，根据第6段“可在统筹好共性领域开放探索的前提下，充分体现地区特色、特点，鼓励差异化探索”可知，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《以扩大开放培育服务业增长动能》","no":48,"missingImage":false},{"qid":"4652253","cat":"逻辑填空","stem":"填入横线处的词语最恰当的一项是：","options":{"A":"重庆 上海 海南","B":"上海 重庆 海南","C":"海南 重庆 上海","D":"重庆 海南 上海"},"answer":"B","explanation":"横线出现在第4段，本题是对于常识的考查。\n根据2021年4月23日商务部召开新增服务业扩大开放综合试点专题发布会上公布的关于天津、上海、海南、重庆4省市的试点方案可知，“上海”将强化国家战略承载区域的示范效应，“重庆”统筹先进制造业和现代服务业融合发展，“海南”推动制度集成创新，把海南建设成为国内国际双循环的重要交汇点，对应B项。\n故正确答案为B。\n【文段出处】《以扩大开放培育服务业增长动能》","no":49,"missingImage":false},{"qid":"4652255","cat":"片段阅读","stem":"最适合做本文标题的是：","options":{"A":"服务业支撑经济发展再破新纪录","B":"现代服务业推动经济高质量发展","C":"服务业创新塑造城市竞争新优势","D":"以扩大开放培育服务业发展动能"},"answer":"D","explanation":"通读全文可知，文章第1段首先提出我国服务业扩大开放综合试点再度扩容这一话题，第2段具体分析了试点扩容的意义，第3-6段通过“首先······其次······最后”详细说明服务业“扩大开放综合试点”对于带动服务业增长的积极作用。故整篇文章围绕服务业“扩大开放综合试点”这一核心话题展开论述，详细论述了其对于服务业发展的积极作用，对应D项。\nA项，文章并未提及“再破新纪录”，无中生有，排除；\nB、C两项，均缺少本文的核心话题“扩大开放综合试点”，偏离文章中心，排除。\n故正确答案为D。\n【文段出处】《以扩大开放培育服务业增长动能》","no":50,"missingImage":false}]},{"type":"material","material":"\u003cp>        据美国鱼类和野生生物管理局估计，玻璃建筑每年“杀死”超过3.6亿只鸟。英国鸟类学信托基金会估计，英国每年发生的鸟类撞击玻璃幕墙事件数量高达1亿起，其中三分之一死亡。我国目前尚没有相关统计数据，但关于鸟类撞击玻璃幕墙伤亡的新闻报道的确不少。北京猛禽救助中心近几年收治的猛禽当中，明确因撞击玻璃幕墙等建筑受伤的多达50只，均为国家一级、二级重点保护野生动物。\u003c/p>\u003cp>        城市建设中采用玻璃幕墙之风是如何兴起的？其实，玻璃幕墙发明和使用的历史已走过半个多世纪。钢骨架和玻璃的组合给人以简约明快的感觉，加之玻璃比天然石材便宜、轻盈且透光性好，\u003cu>其\u003c/u>一经采用便大受欢迎。但人们很快发现，高层幕墙在热胀冷缩作用下易发生高空爆裂事故。20世纪70年代全球能源危机后，人们对于节能建筑的呼声高涨。受此驱动，玻璃幕墙材料技术不断改进，安全性和保温性能得到提升。尽管材料成本水涨船高，但城市高层建筑具有地标意义，能够为投资者带来广告效应，对个人而言，自建房安玻璃幕墙能够满足某种炫耀心理，因此玻璃幕墙再次受到追捧。\u003c/p>\u003cp>        美观前卫的人类建筑缘何成为“鸟类杀手”？①鸟类有自己强大的“定位导航系统”，不同鸟类在飞行中判断方位的机理也不尽相同。有的鸟会凭借地磁场、偏振光判断方向，有的鸟在夜晚会以星辰作为“导航卫星”，还有的鸟凭借强大的记忆往返万里而不迷航。②但是，再强大的定位系统也会有“信号盲区”。③玻璃幕墙倒映天空和附近树林的影像，会使鸟类产生错觉；玻璃反射阳光会暂时造成鸟儿视觉障碍，来不及躲避；透明玻璃还会使飞鸟误以为没有障碍，义无反顾地冲向玻璃；夜晚城市中的灯光霓虹，也会对鸟儿造成误导。④鸟儿一旦产生错觉，朝玻璃幕墙飞去，结果很可能是非死即伤。\u003c/p>\u003cp>        有网友要求在城市建设中禁用玻璃幕墙。对此，有专家坦言，从世界范围来看，还没有哪个国家明令禁止使用玻璃幕墙；从建筑创作和市场发展来看，一时也很难做出根本性改变。目前的共识是，有关各方都要积极应对因使用玻璃幕墙而产生的生态问题和其他环境问题。也有专家认为，可尝试对玻璃幕墙做出一些调整，尽可能地对鸟类起到提示或警示作用。比如，选择有醒目花纹的玻璃，或在玻璃上粘贴一些猛禽图案贴纸，都可以起到减少鸟类撞击玻璃幕墙的作用。许多鸟类具备一定的紫外线视觉功能，楼宇建造者可采用添加紫外线反射材质的新型玻璃，以使幕墙在鸟类眼中不再透明，而在人类眼中仍是一片通透。还有法律顾问谈到，环境公益诉讼是社会组织参与生态保护和社会治理的法律途径，但仍面临诉讼成本高、举证难等挑战。\u003c/p>","questions":[{"qid":"4652232","cat":"片段阅读","stem":"文中第1段意在：","options":{"A":"强调应完善鸟类撞击玻璃幕墙致死的统计数据","B":"凸显野生动物中鸟类的生态环境非常恶劣","C":"揭示鸟类撞击玻璃幕墙致死的主要原因","D":"说明鸟类撞击玻璃幕墙致死已成为普遍现象"},"answer":"D","explanation":"第1段为并列结构，分别列举了美国、英国、我国每年鸟类因撞击玻璃幕墙致死的庞大数量，重在强调鸟类因撞击玻璃幕墙致死的现象非常普遍，对应D项。\nA项，文段列举鸟类撞击玻璃幕墙致死的数据是为了说明这一现象十分普遍，“完善统计数据”偏离文段重点，排除；\nB项，未涉及文段主题词“玻璃幕墙”，排除；\nC项，文段并未涉及“主要原因”，无中生有，排除。\n故正确答案为D。\n【文段出处】《玻璃幕墙为何成“鸟类杀手”？》","no":51,"missingImage":false},{"qid":"4652256","cat":"逻辑填空","stem":"文中第2段中画横线的“其”字是指：","options":{"A":"钢骨架","B":"玻璃幕墙","C":"天然石材","D":"节能材料"},"answer":"B","explanation":"首先定位“其”的位置，结合前文“城市建设中采用玻璃幕墙之风是如何兴起的······钢骨架和玻璃的组合给人以简约明快的感觉，加之玻璃比天然石材便宜、轻盈且透光性好”可知，大受欢迎的是用钢骨架和玻璃组合而成的玻璃幕墙，即“其”所指代的内容，对应B项。\nA项，“钢骨架”仅是玻璃幕墙的组成部分，并非“其”指代的内容，排除；\nC项，根据“加之玻璃比天然石材便宜、轻盈且透光性好”可知，“天然石材”不如玻璃，并非“其”指代的内容，排除；\nD项，“节能材料”文段并未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《玻璃幕墙为何成“鸟类杀手”？》","no":52,"missingImage":false},{"qid":"4652257","cat":"片段阅读","stem":"“玻璃幕墙给飞鸟造成了不小的困扰。”一句最适合填入文中第3段哪处？","options":{"A":"①","B":"②","C":"③","D":"④"},"answer":"C","explanation":"根据题干“玻璃幕墙给飞鸟造成了不小的困扰”可知，后文应继续围绕玻璃幕墙给飞鸟带来的困扰展开论述，第3段中，位置③后论述玻璃幕墙会使鸟类产生错觉等，属于对题干的详细说明，故题干句子放在位置③处与后文衔接恰当，对应C项。\n位置①后论述鸟类的定位系统，位置②后论述鸟类的定位系统存在“信号盲区”，位置④后论述鸟儿产生错觉的严重后果，均未体现玻璃幕墙给飞鸟带来的困扰，故排除A、B、D三项。\n故正确答案为C。\n【文段出处】《玻璃幕墙为何成“鸟类杀手”？》","no":53,"missingImage":false},{"qid":"4652258","cat":"片段阅读","stem":"文中提到的解决鸟类撞击玻璃幕墙现象的有关建议包括：\n①改变玻璃安装的角度\n②在玻璃上粘贴猛禽图案贴纸\n③使用有醒目花纹的玻璃\n④利用环境公益诉讼手段\n⑤组建鸟类保护志愿者组织","options":{"A":"①②③","B":"②③④","C":"①④⑤","D":"②④⑤"},"answer":"B","explanation":"根据题干“建议”定位文章第4段，由“也有专家认为，可尝试对玻璃幕墙做出一些调整，尽可能地对鸟类起到提示或警示作用。比如，选择有醒目花纹的玻璃，或在玻璃上粘贴一些猛禽图案贴纸，都可以起到减少鸟类撞击玻璃幕墙的作用······还有法律顾问谈到，环境公益诉讼是社会组织参与生态保护和社会治理的法律途径”可知，②③④均有提及，对应B项。\n①改变玻璃安装的角度、⑤组建鸟类保护志愿者组织，文章均未提及，无中生有，排除A、C、D三项。\n故正确答案为B。\n【文段出处】《玻璃幕墙为何成“鸟类杀手”？》","no":54,"missingImage":false},{"qid":"4652259","cat":"片段阅读","stem":"最适合做本文标题的是：","options":{"A":"城市中炫目的玻璃幕墙","B":"鸟儿为什么会迷路","C":"鸟撞玻璃幕墙难题如何破解","D":"由鸟类死亡谈生态环境建设"},"answer":"C","explanation":"文章第1段，通过一系列数据引出鸟类撞击玻璃幕墙伤亡的话题，表明其严重性，第2段论述城市建设中玻璃幕墙受到追捧的原因，第3段说明玻璃幕墙如何造成鸟类伤亡，第4段从网友、专家及法律顾问三个不同的角度，提出解决鸟类撞击玻璃幕墙现象的有关建议，故文章为分总结构，即“引出话题—指出问题—分析原因—提出对策”，重点强调如何解决鸟类撞击玻璃幕墙的问题，对应C项。\nA项，“炫目的玻璃幕墙”对应文章第2段，偏离文章重点，排除；\nB项，“鸟儿为什么会迷路”对应文章第3段，偏离文章重点，且无主题词“玻璃幕墙”，排除；\nD项，“生态环境建设”文章未提及，无中生有，且无主题词“玻璃幕墙”，排除。\n故正确答案为C。\n【文段出处】《玻璃幕墙为何成“鸟类杀手”？》","no":55,"missingImage":false}]},{"type":"material","material":"\u003cp>        在人们的印象中，科学向来都是和正确画等号的，科学家的结论向来都是可信度极高的。但其实，作为科技“无人区”的拓荒者，面对茫茫的未知世界和各种高度复杂的软硬件工具，\u003cu>                    \u003c/u>。\u003c/p>\u003cp>        关于“祝融星”的风波是近代天文学历史上最为知名的事件之一。1859年，当时的法国巴黎天文台台长勒维耶，试图解决一个大难题——水星轨道的近日点进动问题。当时的人们发现，在考虑了金星、地球等其他行星的引力摄动后，水星的近日点进动仍然和天体力学的计算结果有所偏差。勒维耶经过大量计算，提出了新行星假设。他认为在水星轨道之内还存在一颗未知行星或一群小行星，扰动了水星的轨道，造成了偏差。很快就有一名天文爱好者来信说，自己在几个月前曾发现一个黑点从日面穿过，很可能就是这颗行星的凌日现象。勒维耶在查阅了他的设备和笔记后，于1860年宣布了这一发现，并将这颗“行星”命名为“祝融星”。\u003c/p>\u003cp>        随后，尽管有不少天文爱好者宣称自己观测到了“祝融星”，但专业天文学家却总是一无所获。虽然从理论上说，一颗如此靠近太阳的行星几乎总是淹没在阳光之中，难以看到也在情理之中。但还是有人开始怀疑这颗行星是否真的存在。\u003c/p>\u003cp>        到了19世纪70年代，天文爱好者发现“祝融星”的报告不断涌现，也曾有专业天文学家称在中国的一处基地看到了它的凌日现象。甚至在1878年，两位颇有名望的天文学家分别宣告发现了“祝融星”，这在当时引起了很大的轰动，争议之声随之逐渐转弱。\u003c/p>\u003cp>        但事与愿违，随后的研究证实，1878年看到的“祝融星”其实都是亮恒星，并非新行星。1915年，爱因斯坦发表广义相对论，对水星近日点进动给出了完全符合观测的解释，水星轨道的偏离其实只是因为太阳巨大的质量使时空产生了凹陷，作为太阳系内离太阳最近的行星，水星深埋于太阳的引力凹坑中，所以其轨道自然也就背离了牛顿的理论。这颗并不存在的“祝融星”彻底成为了历史。\u003c/p>\u003cp>        无质疑，不科学，可证伪性正是科学最鲜明的特征。经受住了质疑的科学知识，无疑更加接近于真理。而那些被证伪了的理论和发现，就像绿叶一样，化作了春泥养护着科学之花，并帮助人类在探索之路上走得更加坚实。\u003c/p>","questions":[{"qid":"4652242","cat":"语句表达","stem":"填入文中画横线部分最恰当的一项是：","options":{"A":"科学家反而是一群特别容易“犯错”的人","B":"有无数科学家脚踏实地勇攀科学的“高峰”","C":"推测尽管看似科学，却往往会颠覆我们的认知","D":"在这些领域的科学突破，才能给人类带来希望"},"answer":"A","explanation":"横线位于第一段末尾，是对前文内容的总结。文段先介绍科学家结论的正确性，随后通过转折关联词“但”进行转折，强调科学家在面对未知世界和高度复杂的软硬件工具时也会出现失误，故横线处意在表达科学家们也会出现错误，对应A项。\nB项，“勇攀科学的‘高峰’”无法与前文构成转折关系，排除；\nC项，文段意在强调科学家也会犯错，“颠覆我们的认知”表述不明确，排除；\nD项，“给人类带来希望”强调科学家结论的正确性，与文意相悖，排除。\n故正确答案为A。\n【文段出处】《金星生命“时有时无”？质疑让科学更接近真理》","no":56,"missingImage":false},{"qid":"4652248","cat":"片段阅读","stem":"勒维耶之所以提出了新行星假设，是因为：","options":{"A":"有位天文爱好者观测到与之相关的行星凌日现象","B":"当时天体力学的计算均未考虑其他行星的引力摄动","C":"水星的近日点进动与天体力学的计算结果存在偏差","D":"他运用当时最先进的设备积累了多年的观测数据"},"answer":"C","explanation":"定位第二段，根据“当时的人们发现，在考虑了金星、地球等其他行星的引力摄动后，水星的近日点进动仍然和天体力学的计算结果有所偏差。勒维耶经过大量计算，提出了新行星假设”可知，“水星的近日点进动与天体力学的计算结果存在偏差”是勒维耶提出新行星假设的原因，对应C项。\nA项，“有位天文爱好者观测到与之相关的行星凌日现象”仅起到验证假设的作用，并非勒维耶提出新行星假设的原因，排除；\nB项，根据“在考虑了金星、地球等其他行星的引力摄动后”可知，与文意相悖，排除；\nD项，“运用当时最先进的设备积累了多年的观测数据”文段未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】《金星生命“时有时无”？质疑让科学更接近真理》","no":57,"missingImage":false},{"qid":"4652250","cat":"片段阅读","stem":"人们一开始质疑“祝融星”的存在，是因为它：","options":{"A":"被太阳的光芒遮挡","B":"不符合经典力学理论","C":"亮度不够而难以被观测到","D":"未被专业天文学家观测到"},"answer":"D","explanation":"定位第三段，根据“尽管有不少天文爱好者宣称自己观测到了‘祝融星’，但专业天文学家却总是一无所获······但还是有人开始怀疑这颗行星是否真的存在”可知，没有专业的天文学家观测到“祝融星”的存在是人们一开始提出质疑的原因，对应D项。\nA、C两项，根据第三段“一颗如此靠近太阳的行星几乎总是淹没在阳光之中，难以看到也在情理之中”可知，“被太阳的光芒遮挡”“亮度不够”均属于解释无法看到“祝融星”的原因，与质疑其存在的原因无关，排除；\nB项，根据第五段“水星轨道的偏离其实只是因为太阳巨大的质量使时空产生了凹陷，作为太阳系内离太阳最近的行星，水星深埋于太阳的引力凹坑中，所以其轨道自然也就背离了牛顿的理论”可知，与经典力学理论不符是科学家后期证实“祝融星”并不存在的原因，并非一开始人们产生质疑的原因，排除。\n故正确答案为D。\n【文段出处】《金星生命“时有时无”？质疑让科学更接近真理》","no":58,"missingImage":false},{"qid":"4652262","cat":"片段阅读","stem":"本文意在说明：","options":{"A":"科学观察的重要性","B":"科学的可证伪性","C":"科学发展的复杂性","D":"科学与科技的差异性"},"answer":"B","explanation":"文章开篇引出话题，说明科学家在研究过程中会出错，随后举出“祝融星”的例子，描述了“祝融星”由被提出到被质疑，最终被推翻的过程，尾段则通过程度词“正是”“最”提出观点，即可证伪性正是科学最鲜明的特征。故文章重在强调科学的可证伪性，对应B项。\nA项“重要性”、C项“复杂性”、D项“差异性”，均非本文重点，排除。\n故正确答案为B。\n【文段出处】《金星生命“时有时无”？质疑让科学更接近真理》","no":59,"missingImage":false},{"qid":"4652263","cat":"片段阅读","stem":"“祝融星”的例子最适合作为下列哪项科学家精神的例证？","options":{"A":"追求真理、严谨治学的求实精神","B":"淡泊名利、潜心研究的奉献精神","C":"集智攻关、团结协作的协同精神","D":"不断尝试、敢为人先的创新精神"},"answer":"A","explanation":"本文通过“祝融星”的例子论证文章观点，对应尾段“无质疑，不科学，可证伪性正是科学最鲜明的特征”，根据主题词“可证伪性”“科学”，并结合尾段“经受住了质疑的科学知识，无疑更加接近真理”可知，“祝融星”的例子意在论证科学需要追求真理、严谨治学的求实精神，对应A项。\nB项“奉献精神”、C项“协同精神”、D项“创新精神”，均与文章强调的科学家的求实精神无关，排除。\n故正确答案为A。\n【文段出处】《金星生命“时有时无”？质疑让科学更接近真理》","no":60,"missingImage":false}]},{"type":"material","material":"\u003cp>阅读以下文字，完成66—70题。\u003c/p>\u003cp>        20世纪80年代，加拿大研究人员曾经做过一个很有趣的试验：他们建立了一个工厂，试着用污泥来生产燃料。他们先是通过机械方法去除污泥里的大部分水分和泥沙，然后将干污泥放进高温蒸馏器中，结果发现：蒸馏之后得到的气态组分转化成了燃油，而固态组分转化成了炭。于是，这家工厂开始利用这种方法生产燃料，每吨污泥可以生产2桶燃油和0.5吨烧结炭。从那以后，随着对城市污泥组成的进一步了解，人们渐渐意识到，污泥中富含碳、氮、磷等资源性物质，这些物质让污泥拥有了变废为宝的可能性。如今，世界多国的科学家都在城市污泥的资源化利用方面做出了大量研究成果，开发了许多城市污泥的利用途径。\u003c/p>\u003cp>        虽然污泥具有很高的利用价值，但是要想把污泥变成资源，可不是一件容易的事情。污泥的处理处置要一步步来：首先要经过减量化和稳定化处理，也就是减少污泥的质量和体积，并且降解污泥中的易腐有机物质；然后进行无害化处理，使其不会对环境造成二次污染，不会危害人体健康；最后才是资源化处理，也就是回收具有使用价值的物质和资源。每一个过程都有与之相适应的污泥处理处置技术。例如：浓缩、脱水适用于减量化处理，厌氧消化、好氧堆肥、焚烧适用于稳定化处理，厌氧沼气回收、焚烧热能回收、土地有机质利用、建材无机质利用等技术可用于资源化处理，等等。当然，其中有一些技术可以同时满足多个处理目标。\u003c/p>\u003cp>        乍一看，污泥的处理处置有这么多技术路线，似乎“条条大路通罗马”，但是综合考虑技术的成熟程度、经济成本、可持续发展的可行性等因素，厌氧消化技术仍然是最值得关注的技术之一。这种技术利用厌氧微生物，将污泥中的大分子有机物分解为甲烷、二氧化碳、水等简单化合物，产生的沼气可以用作绿色燃料。厌氧消化技术在解决了污泥污染问题的同时，还顺便实现了生物质能的回收，可谓一举两得。但是很可惜，这种技术在我国的应用和运行遇到了很多困难，国外厌氧消化技术装备在我国的运行稳定性很低，效率也不尽如人意。\u003c/p>\u003cp>        造成这一局面的主要原因是我国污泥泥质特点与国外存在巨大差异。我国污水厂污泥普遍存在微细砂含量高、有机质含量低的特点，而且污泥组成非常复杂，既含有碳、氮、磷等资源性物质，也含有重金属、难降解有机物、微塑料等污染性物质。另外，我国人口密度高，城市污泥的处理量很大。因此，开发适合我国污泥泥质特点的高级厌氧消化技术迫在眉睫。\u003c/p>","questions":[{"qid":"4652231","cat":"片段阅读","stem":"加拿大研究人员的试验说明：","options":{"A":"利用污泥生产燃料可以实现机械化操作","B":"高温蒸馏法是污泥资源化处置的最佳手段","C":"加拿大是最早实现城市污泥资源化的国家","D":"污泥中含有可以进行资源化利用的成分"},"answer":"D","explanation":"“加拿大研究人员的试验”出现在文章第一段，根据“他们建立了一个工厂，试着用污泥来生产燃料”“蒸馏之后得到的气态组分转化成了燃油，而固态组分转化成了炭”可知，研究人员把污泥进行了处理，并提取出了一些资源性物质，对应D项。\nA项，文段论述的是用机械方法可以去除污泥中的水分和泥沙，“机械化操作”属于试验过程中的一部分，非重点，排除；\nB项“最佳手段”、C项“最早实现”文段均未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】《既要治水，也要治泥》","no":61,"missingImage":false},{"qid":"4652235","cat":"片段阅读","stem":"根据本文，污泥处置顺序最可能是：","options":{"A":"减量化 稳定化 无害化 资源化","B":"无害化 稳定化 减量化 资源化","C":"资源化 无害化 减量化 稳定化","D":"稳定化 减量化 资源化 无害化"},"answer":"A","explanation":"“污泥处置顺序”出现在文章第二段，根据“首先要经过减量化和稳定化处理······然后进行无害化处理······最后才是资源化处理”可知，污泥处置要经过减量化、稳定化、无害化、资源化处理。A项符合文段论述的污泥处置顺序，当选。\nB、C、D三项均不符合文段论述的污泥处置顺序，排除。\n故正确答案为A。\n【文段出处】《既要治水，也要治泥》","no":62,"missingImage":false},{"qid":"4652236","cat":"片段阅读","stem":"关于厌氧消化技术，以下说法与本文不相符的是：","options":{"A":"可同时实现稳定化和资源化的目标","B":"是国际上成熟的污泥处理处置技术","C":"目前在我国面临着水土不服的问题","D":"利用微生物把有机物氧化成无机物"},"answer":"D","explanation":"A项，根据第三段“厌氧消化技术在解决了污泥污染问题的同时，还顺便实现了生物质能的回收，可谓一举两得”可知，表述正确，排除；\nB项，根据第三段“但是综合考虑技术的成熟程度······厌氧消化技术仍然是最值得关注的技术之一”可知，厌氧消化技术在国际上较为成熟，表述正确，排除；\nC项，根据第三段“这种技术在我国的应用和运行遇到了很多困难······”以及第四段“造成这一局面的主要原因是我国污泥泥质特点与国外存在巨大差异”可知，表述正确，排除；\nD项，根据第三段“这种技术利用厌氧微生物，将污泥中的大分子有机物分解为甲烷、二氧化碳、水等简单化合物”可知，厌氧消化技术的作用是“分解”而不是“氧化”，偷换概念，且甲烷是有机物，表述错误，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《既要治水，也要治泥》","no":63,"missingImage":false},{"qid":"4652238","cat":"片段阅读","stem":"根据本文，可以推断出哪项结论？","options":{"A":"焚烧是污泥减量化处置的主要手段","B":"金属含量对污泥厌氧消化性能造成影响","C":"超低有机质污泥可适用厌氧消化技术","D":"浓缩是指降低污泥中有害物质的含量"},"answer":"B","explanation":"A项，根据第二段“例如：浓缩、脱水适用于减量化处理······焚烧适用于稳定化处理······”可知，“焚烧”偷换概念，排除；\nB项，根据第三段“但是很可惜，这种技术在我国的应用和运行遇到了很多困难，国外厌氧消化技术装备在我国的运行稳定性很低，效率也不尽如人意”以及第四段“造成这一局面的主要原因是······也含有重金属、难降解有机物、微塑料等污染性物质”可知，表述正确，当选；\nC项，根据第三段“但是很可惜，这种技术在我国的应用和运行遇到了很多困难，国外厌氧消化技术装备在我国的运行稳定性很低，效率也不尽如人意”以及第四段“造成这一局面的主要原因是我国污泥泥质特点与国外存在巨大差异······有机质含量低的特点”可知，超低有机质污泥并不适用厌氧消化技术，表述错误，排除；\nD项，根据第二段“首先要经过减量化和稳定化处理，也就是减少污泥的质量和体积，并且降解污泥中的易腐有机物质”“例如：浓缩、脱水适用于减量化处理······”可知，文段并未提及浓缩可以降低污泥中有害物质的含量，表述错误，排除。\n故正确答案为B。\n【文段出处】《既要治水，也要治泥》","no":64,"missingImage":false},{"qid":"4652243","cat":"片段阅读","stem":"本文是某篇文章的节选，该文接下来最可能写的是：","options":{"A":"微细砂导致厌氧消化技术效率低的发生机制","B":"我国当前污泥处理处置市场发育缓慢的原因","C":"污泥厌氧消化技术“中国方案”的研究成果","D":"借鉴国外经验推动厌氧消化技术应用的案例"},"answer":"C","explanation":"根据提问方式可知，本题为接语选择题，可重点关注文章最后一段，文章结尾通过结论词“因此”得出结论“开发适合我国污泥泥质特点的高级厌氧消化技术迫在眉睫”，故文章接下来应该围绕我国在厌氧消化技术方面的方案展开论述，对应C项。\nA项，“微细砂”与文章结尾话题不一致，排除；\nB项，“市场发育缓慢的原因”与文章结尾话题不一致，排除；\nD项，文章第三段结尾已经强调“国外厌氧消化技术装备在我国的运行稳定性很低”，故“借鉴国外经验”的描述与文章不符，且与文章结尾话题不一致，排除。\n故正确答案为C。\n【文段出处】《既要治水，也要治泥》","no":65,"missingImage":false},{"qid":"4652286","cat":"片段阅读","stem":"在现代信息社会，信息以海量的形式存在，而且十分复杂，瞬息万变，这不但使信息收集和处理的难度加大，而且使信息对决策来说变得更加重要。在决策过程中，如果信息一旦失真，或以片面的甚至过时的信息作为决策的依据，就必然会导致决策失误。而现代信息技术的创新和发展为科学收集和处理信息提供了有力支撑，从而为科学决策提供了技术保障。\n这段文字意在说明：","options":{"A":"全面、真实和及时的信息，是科学决策的重要保证","B":"现代信息技术能够帮助提高决策的准确性和科学性","C":"信息的复杂性、海量性和多变性使决策时难度增加","D":"信息在国家治理能力现代化中的重要作用与日俱增"},"answer":"B","explanation":"文段首先介绍背景，阐述现代社会的信息海量且复杂多变，使信息收集和处理难度加大，也使信息对决策来说变得更重要。接着通过假设引出可能出现的问题，即如果信息失真、片面甚至过时会导致决策失误。尾句通过“提供了有力支撑、提供了技术保障”引出对策，强调“现代信息技术的创新和发展”有助于科学收集和处理信息，从而保障决策的科学性。故文段重在强调“现代信息技术的创新和发展”对科学决策的重要作用，对应B项。\nA项，对应问题部分的内容，为对策前的内容，非重点，排除；\nC项，对应首句背景引入的内容，非重点，排除；\nD项，强调的是信息的重要作用，非重点，且“国家治理能力现代化”文段并未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】《以信息化建设助推国家治理现代化》","no":66,"missingImage":false},{"qid":"4652287","cat":"片段阅读","stem":"除了捕食者的捕杀之外，巨鸟们的身体状况也是其灭绝的原因之一。巨鸟身材高大，体重也惊人，无法再在天空翱翔，久而久之，翅膀退化，它们只能在地上行走。当捕食者的威胁并不严峻时，巨鸟不需要快速奔跑以躲避追捕，因此它们的活动能力也随着身体日渐庞大而衰退。当捕食者突然出现时，它们跑也跑不快，体型太大想躲没地方可躲，因此只能被吃掉。\n最适合做这段文字标题的是：","options":{"A":"巨鸟的末路","B":"鸟的天敌","C":"盘点史前致命捕食者","D":"从飞翔到行走"},"answer":"A","explanation":"文段开篇引出“巨鸟”的话题，并指出巨鸟灭绝的原因之一是其身体状况。随后进行具体的解释说明，即巨鸟的身材、体重原因使其只能在地上行走，由于不受捕食威胁时，其活动能力衰退，当捕食者突然出现时，巨鸟只能被吃掉。故文段为总分结构，重点强调巨鸟灭绝的原因，结合文段主题词“巨鸟”，对应A项。\nB、C、D三项，均未提及文段核心话题“巨鸟”，且非文段讨论重点，排除。\n故正确答案为A。\n【文段出处】《为什么小小的新西兰会有如此多的巨鸟呢？》","no":67,"missingImage":false},{"qid":"4652291","cat":"片段阅读","stem":"痛风是由单钠尿酸盐结晶沉积引起的开始于滑膜的剧烈炎症反应，发作时，局部关节可红、肿、热、痛，这就是炎症最典型的表现。炎症持续时间越长，痛风反复发作次数越多，越容易出现局部关节的破坏，导致慢性痛风性关节炎。因此，在急性期足量、足疗程地应用抗炎药物如糖皮质激素等，是非常必要的，可以止痛。等关节不疼不肿了，开始降尿酸治疗，才是杜绝痛风复发的最根本做法。\n关于痛风，这段文字没有提及：","options":{"A":"发病原因","B":"急性期的典型症状","C":"治疗方法和步骤","D":"患者日常生活管理"},"answer":"D","explanation":"A项，根据“痛风是由单钠尿酸盐结晶沉积引起的开始于滑膜的剧烈炎症反应”可知，“发病原因”文段有所提及，排除；\nB项，根据“发作时，局部关节可红、肿、热、痛，这就是炎症最典型的表现”可知，“急性期的典型症状”文段有所提及，排除；\nC项，根据“在急性期足量、足疗程地应用抗炎药物如糖皮质激素等，是非常必要的，可以止痛。等关节不疼不肿了，开始降尿酸治疗”可知，“治疗方法和步骤”文段有所提及，排除；\nD项，文段并未提及“患者日常生活管理”，无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《说说痛风》","no":68,"missingImage":false},{"qid":"4652292","cat":"片段阅读","stem":"相较于《汉魏六朝碑刻数据库》《唐代墓志铭数据库》等聚焦于断代，《三晋石刻大全数据库》集中于一隅，《历代石刻拓片汇编》具有较强的通代性，并且不设地域范围限制，同时在尽量避免收录与上述数据库重复篇目的前提下，利用已经搜集的石刻拓片、传世古籍以及出版整理的古籍等，全面收录、整合了各种刻有文字内容的石刻资源。\n这段文字意在强调：","options":{"A":"已有石刻数据库内容丰富","B":"我国古籍数据库分类齐全","C":"《历代石刻拓片汇编》独具特色","D":"几种重要石刻资源存在巨大差异"},"answer":"C","explanation":"文段开篇通过“相较于”进行对比，强调了《历代石刻拓片汇编》不同于《汉魏六朝碑刻数据库》《唐代墓志铭数据库》以及《三晋石刻大全数据库》，具有通代性，不设地域范围限制，同时全面收录、整合了各种有文字内容的石刻资源。故文段通过对比，强调了《历代石刻拓片汇编》不同于其他石刻数据库的特点，结合文段主题词《历代石刻拓片汇编》，对应C项。\nA项，“石刻数据库”范围扩大，文段强调的是《历代石刻拓片汇编》，排除；\nB项，未提及文段核心话题“石刻”，排除；\nD项，文段论述的是与石刻相关的数据库，并非石刻资源，排除。\n故正确答案为C。\n【文段出处】《中华石刻数据库上新 · &lt;历代石刻拓片汇编&gt;正式发布》","no":69,"missingImage":false},{"qid":"4652234","cat":"片段阅读","stem":"下面6个句子的最佳顺序是：\n①一方面，消费者可能不再只是消费食物本身，而是理念上的消费；另一方面，消费者可能持低价、重量不重质的消费观念\n②在这个过程中，消费者对食物的控制权、认知权会很少，这是现在一些大公司希望推动的食品体系\n③由于我国农耕方式的多样性，部分人会回归这种传统农业种植方式，或者寻求新型健康的有机农业发展方向\n④未来，我们将面临两种食物生产方式。一种朝向更工业化的生态体系，从生产加工到食品供应这一系列过程都由大公司操控\n⑤与此同时，消费者在食物上的消费水平以及消费理念也会出现两极分化现象\n⑥另一种是采用小规模、精致化的耕作方式","options":{"A":"④②⑥③⑤①","B":"③②⑤①④⑥","C":"④⑥⑤①③②","D":"③⑤④⑥②①"},"answer":"A","explanation":"对比选项，确定首句。首句分别为③④两句，③句中出现指代词“这种传统农业种植方式”，指代不明确，不适合作为首句，排除B、D两项；④句中指出未来我们将面临两种食物生产方式，并对其中一种进行了介绍，可以作为首句，保留A、C两项。\n继续观察，寻找解题线索。③句中出现了指代词“这种传统农业种植方式”，说明前文应提及“传统农业种植方式”，观察A、C两项，③句前分别为①⑥两句，①句从两方面论述了消费者的“消费观念”，与“传统的农业种植方式”无关，不能与③句构成捆绑，排除C项；⑥句中论述了“采用小规模、精致化的耕作方式”，即“传统的农业种植方式”，可以与③句构成指代词捆绑，A项当选。\n故正确答案为A。","no":70,"missingImage":false}]}],"count":35,"answerable":35,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"4652155","cat":"数学运算","stem":"一辆车每天都比前一天多开15千米，第三天开的距离正好是第一天的2倍。则前三天一共开了多少千米？","options":{"A":"225","B":"190","C":"135","D":"130"},"answer":"C","explanation":"设第一天开x千米，则第二天开x+15千米，第三天开x+30千米，根据题干“第三天开的距离正好是第一天的2倍”可列方程\u003cimg data-k=\"37388a257270\">，解得x=30，则三天共开3x+45=3×30+45=135千米。\n故正确答案为C。","no":71,"missingImage":false},{"type":"question","qid":"4652157","cat":"数学运算","stem":"某种商品如果每件降价30元，单价比打八折销售时贵10元，则这种商品的定价是多少元/件？","options":{"A":"200","B":"250","C":"300","D":"350"},"answer":"A","explanation":"设商品定价为x，根据题意，在定价x基础上降价30元为x-30，比打八折售价为0.8x时贵10元，可列式：x-30-0.8x=10，解得x=200。\n故正确答案为A。","no":72,"missingImage":false},{"type":"question","qid":"4652161","cat":"数学运算","stem":"某测试共有100道题，答对一道题得3分，不答或答错一道题扣2分，小张测试成绩为285分，则他一共答对了多少道题？","options":{"A":"85","B":"90","C":"95","D":"97"},"answer":"D","explanation":"设答对题目x道，则不答或答错题目（100-x）道，根据题意得：3x-2（100-x）=285，解得x=97。\n故正确答案为D。","no":73,"missingImage":false},{"type":"question","qid":"4652140","cat":"数学运算","stem":"农户张某今年年初将一块长方形农田扩建为正方形农田，使得正方形边长与长方形的长相同，今年的农作物产量是去年的1.5倍。已知今年农作物亩产量比去年高20%，则原来长方形农田的长是宽的多少倍？","options":{"A":"1.2","B":"1.25","C":"1.5","D":"1.6"},"answer":"B","explanation":"设长方形农田的长为a，宽为b，正方形边长为a，去年农作物亩产量为n，今年农作物亩产量为1.2n。根据总产量=亩产量×面积，结合题意可列方程：\u003cimg data-k=\"4c245b73a2a0\">，化简得：\u003cimg data-k=\"cf830272e3d8\">。\n故正确答案为B。","no":74,"missingImage":false},{"type":"question","qid":"4652142","cat":"数学运算","stem":"商店销售某种商品，先按定价卖了300件，打七五折卖了200件，后在此基础上再打八折卖完了剩下的100件，总利润为总成本的\u003cimg data-k=\"8c3342040bcf\">。单件成本相当于单件定价的：","options":{"A":"57%","B":"54%","C":"51%","D":"48%"},"answer":"C","explanation":"经济利润问题，求比例关系用赋值法。赋值单件定价为100，则打七五折单件售价为0.75×100=75元，则在打七五折的基础上再打八折单件售价为0.75×100×80%=60元，设单件成本为x元。根据题意，\u003cimg data-k=\"073ec7914b65\">\u003cimg data-k=\"cf0cba18b047\">，解得x=51。则\u003cimg data-k=\"0af9f2f77515\">\u003cimg data-k=\"6cac547f5c6c\">，故单件成本相当于单件定价的51%。\n故正确答案为C。","no":75,"missingImage":false},{"type":"question","qid":"4652147","cat":"数学运算","stem":"甲和乙同时出发，在长360米的环形道路上沿同一方向各自匀速散步。甲出发2圈后第一次追上乙，又走了4圈半第二次追上乙。则甲出发后走了多少米第一次到达乙的出发点？","options":{"A":"160","B":"200","C":"240","D":"280"},"answer":"A","explanation":"结合题干条件，只给出了距离，未给出速度和时间的具体值，考虑赋值。由第一次追上到第二次追上这个过程，是同点同时出发的环形追及问题，\u003cimg data-k=\"1446ab987c67\">米，结合题干条件“甲出发2圈后第一次追上乙，又走了4圈半第二次追上乙”，所以乙的路程为360×4.5-360=360×3.5米，又因时间相同，可得速度之比=路程之比，即\u003cimg data-k=\"66717cc1d98c\">\u003cimg data-k=\"7c516acd99ed\">，赋值甲的速度为9米/分钟，乙的速度为7米/分钟，再分析出发到第一次追上过程，追及时间为：\u003cimg data-k=\"9d5829227630\">分钟，甲比乙多走的距离即为甲出发点到乙出发点的距离：\u003cimg data-k=\"2a2c5b3e0d8d\">\u003cimg data-k=\"1f6ffd448b2d\">\u003cimg data-k=\"386860b90292\">米。\n故正确答案为A。","no":76,"missingImage":false},{"type":"question","qid":"4652143","cat":"数学运算","stem":"商店做促销活动，购买店内商品第一件原价，第二件（价格不高于第一件）4折，第三件（价格不高于第二件）1折。小刘买了1件A和2件B商品，优惠后的总价格相当于定价的56.25%。已知A商品比B商品贵，则按原价买10件A商品的钱最多可以按原价买多少件B商品？","options":{"A":"20","B":"16","C":"14","D":"12"},"answer":"C","explanation":"根据题意，第二件商品价格不高于第一件，第三件商品价格不高于第二件，可判断小刘购买的第一件商品是A，第二件和第三件商品是B。设A和B商品原价分别为x元/件和y元/件，可列方程：x+40%y+10%y=56.25%（x+2y），解得x：y=10：7。赋值x=10，y=7，则按原价买10件A商品的钱=10×10=100元，可购买B\u003cimg data-k=\"0a114e7984d9\">件······2，故最多可以按原价买B商品14件。\n故正确答案为C。","no":77,"missingImage":false},{"type":"question","qid":"4652151","cat":"数学运算","stem":"一个圆形水库的半径为1千米。一艘船从水库边的A点出发，直线行驶1千米后到达水库边的B点，又从B点出发直线行驶2千米后到达水库边的C点。则C点与A点的直线距离最短可能为多少千米？","options":{"A":"不到1千米","B":"1—1.3千米之间","C":"1.3—1.6千米之间","D":"超过1.6千米"},"answer":"D","explanation":"\u003cimg data-k=\"02cda0819c85\" style=\"max-width:260px\">\n根据题意可知，A、B、C三个点都位于圆上。因为两点之间线段最短，所以C点与A点的距离最短为线段AC。如图所示，两两连接A、B、C构成三角形，BC=2km，圆形水库的半径为1km，即直径为2km，则BC为圆形水库的直径，根据几何结论：由圆上一点和圆的直径连接所构成的三角形一定是直角三角形，可知\u003cimg data-k=\"890e95eb5569\">为直角三角形。根据勾股定理，直角边AC的长度\u003cimg data-k=\"5b95770401ad\">\u003cimg data-k=\"ad0dbc493d86\">\u003cimg data-k=\"edbb52d7699e\">km＞1.6km，在D项范围内。\n故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"4652162","cat":"数学运算","stem":"某单位组织文艺表演需要统一购买15套服装，下表为甲、乙、丙和丁四个网店同款上衣和裤子的价格，上衣和裤子可以分开购买，每个网店发货均收取40元快递费，则本次购买服装的最低成本为：\n\u003cimg data-k=\"124b99b46a81\" style=\"max-width:700px\">","options":{"A":"2125元","B":"2155元","C":"2165元","D":"2185元"},"answer":"B","explanation":"想要让最终购买的总成本最低，可以分两种情况考虑：\n情况一：在一家店同时买上衣和裤子，只需要40元快递费。根据表格可计算，甲、乙、丙、丁四家店买一套上衣裤子的价格分别为：77+65=142、79+64=143、78+63=141、80+62=142。故在丙店购买最便宜，总成本=141×15+40=2155元；\n情况二：分别在两家店买最便宜的上衣和最便宜的裤子，需要两家各40元快递费。根据表格可知，甲店上衣最便宜，丁店裤子最便宜。故在甲店购买上衣，在丁店购买裤子，总成本=（77×15+40）+（62×15+40）=2165元。\n比较情况一和情况二，最低成本为情况一。\n故正确答案为B。","no":79,"missingImage":false},{"type":"question","qid":"4652149","cat":"数学运算","stem":"甲、乙两条生产线每小时分别可以生产15000件和9000件某种零件，产品合格率分别为99%和99.8%。现接到36万件这种零件的生产任务，要求合格率不得低于99.5%，则两条生产线合作，至少需要多少小时完成?","options":{"A":"15","B":"18","C":"24","D":"25"},"answer":"D","explanation":"方法一：由题干可知，需要生产的合格产品至少为36万×99.5%=35.82万件。设甲、乙工作量分别为x万件、（36-x）万件，则有\u003cimg data-k=\"93c86c460b23\">\u003cimg data-k=\"e5c93f44f3e9\">，解得x=13.5，36-x=22.5。甲完成任务时间\u003cimg data-k=\"ee6f5c64ad42\">小时，乙完成任务时间\u003cimg data-k=\"ec080404dee4\">小时，综上所述，至少需要25小时完成。\n方法二：设要满足题目要求的合格率，甲、乙工作量分别为x万件、（36-x）万件。如下图所示，根据线段法原理：距离和量成反比，可得（99.5%-99%）：（99.8%-99.5%）=5：3=（36-x）：x，解得x=13.5，36-x=22.5。甲完成任务时间\u003cimg data-k=\"ee6f5c64ad42\">小时，乙完成任务时间\u003cimg data-k=\"ec080404dee4\">小时，综上所述，至少需要25小时完成。\n\u003cimg data-k=\"4a2ef1cf1a22\" style=\"max-width:363px\">\n故正确答案为D。\n注：由于甲、乙生产零件合格率分别为99%、99.8%，本题整体合格率限制\u003cimg data-k=\"7c37d13de5da\">99.5%，且甲合格率较低，故甲完成后，不能继续帮助乙工作。","no":80,"missingImage":false},{"type":"question","qid":"4652156","cat":"数学运算","stem":"下方九宫格中为从1到9不重复的9个整数，虚线上角的数字为虚线所经过区域的数字之和，则灰色格子中的数字最大可能是：\n\u003cimg data-k=\"db1ffb34c40d\" style=\"max-width:372px\">","options":{"A":"7","B":"6","C":"5","D":"4"},"answer":"D","explanation":"由题意可知，九宫格数字总和=1+2+3+···+9=45，则虚线区域以外3个格子中的数字和为45-11-27=7。因3个数字为1-9中的3个不同数字，故只有一种情况：1+2+4=7。因此灰色格子中的数字最大为4。\n故正确答案为D。","no":81,"missingImage":false},{"type":"question","qid":"4652160","cat":"数学运算","stem":"A、B两个运动队分别有x人和y人，两队所有人员刚好组成一个不到100人的正方形实心方队。在为两个运动队分配运动服时，错给A队分了y套，给B队分了x套。发现后A队将领到的运动服拿出20%给B队，B队又拿出1套给A队，此时两队的队员刚好一人分到一套运动服。则x的值为：","options":{"A":"17","B":"25","C":"29","D":"35"},"answer":"C","explanation":"根据“两队所有人员刚好组成一个不到100人的正方形实心方队”可知，（x+y）为小于100的平方数。由题意可知，x=（1-20%）y+1，即x=0.8y+1，把选项数据代入验证：\nA项，若x=17，y=20，17+20=37人，不满足两队人员组成正方形实心方队，排除；\nB项，若x=25，y=30，25+30=55人，不满足两队人员组成正方形实心方队，排除；\nC项，若x=29，y=35，29+35=64人，满足题目所有条件，当选；\nD项，若x=35，y=42.5，不满足人数必须为正整数，排除。\n故正确答案为C。","no":82,"missingImage":false},{"type":"question","qid":"4652145","cat":"数学运算","stem":"将张、王、李、陈、赵五名应届毕业生分配到甲、乙、丙3个不同的科室，要求每个科室至少分配1人，甲科室分配的人数多于乙科室，且张和王不能去丙科室。则有多少种不同的分法？","options":{"A":"12","B":"21","C":"35","D":"72"},"answer":"B","explanation":"由题意，甲科室分配的人数多于乙科室，可分为：\n①甲3人、乙1人、丙1人，因张和王不能去丙科室，从李、陈、赵3人中选1人去丙科室，即有3种情况；剩下4人中选3人去甲科室，即有\u003cimg data-k=\"fd33e27505fa\">种情况；最后1人去乙科室。情况数为3×4×1=12种；\n②甲2人、乙1人、丙2人，因张和王不能去丙科室，从李、陈、赵3人中选2人去丙科室，即有\u003cimg data-k=\"20b23fd6eb04\">种情况；剩下3人中选2人去甲科室，即有\u003cimg data-k=\"20b23fd6eb04\">种情况；最后1人去乙科室。情况数为3×3×1=9种。\n满足题意总情况数=12+9=21种。\n故正确答案为B。","no":83,"missingImage":false},{"type":"question","qid":"4652150","cat":"数学运算","stem":"早上8：00，甲、乙两车开始在A、B两地之间往返运货，两车先在A地装货后驶往B地卸货，然后返回A地再装货，如是重复。13：35甲完成了第四次卸货，又过了2小时5分，乙完成了第五次装货。已知两车均匀速行驶，每次装货或卸货需要20分钟，则甲的行驶速度是乙的多少倍？","options":{"A":"1.25","B":"1.4","C":"1.5","D":"1.6"},"answer":"B","explanation":"设AB之间路程为S，当甲完成第四次卸货时，所走路程为7S，装、卸货共计8次，总用时为13：35-8：00=5小时35分钟=335分钟，装货与卸货用时为20×8=160分钟，路上行驶用时为335-160=175分钟，可知甲走S用时为\u003cimg data-k=\"fd5f1724d3b9\">分钟。\n乙完成第五次装货时，所走路程为8S，装、卸货共计9次，总用时为335+125=460分钟，装货与卸货用时为20×9=180分钟，路上行驶用时为460-180=280分钟，可知乙走S用时为\u003cimg data-k=\"27811d03b156\">分钟。\n路程相同时，速度与时间成反比，则甲乙速度之比为35：25=7：5，即甲的行驶速度是乙的\u003cimg data-k=\"546851d331f3\">倍。\n故正确答案为B。","no":84,"missingImage":false},{"type":"question","qid":"4652153","cat":"数学运算","stem":"单位组织职工前往甲、乙、丙三个爱国主义教育基地学习，要求每名职工至少去1个基地。已知有48人去了甲基地，有42人未去乙基地，去丙基地的人中，去1个、2个、3个基地的人数比为3：2：1。如仅去2个基地和去3个基地的职工分别有x人和y人，则x和y的关系为：","options":{"A":"x=4y+6","B":"x=4y-6","C":"x=3y+6","D":"x=3y-6"},"answer":"A","explanation":"设总人数为a。由“有42人未去乙基地”，可得去了乙基地的人数=a-42，由“去丙基地的人中，去1个、2个、3个基地的人数比为3∶2∶1”，且去了3个基地的人数为y，可知去丙基地的人数=3y+2y+y=6y。根据三集合容斥原理非标准型公式：总数-都不=A+B+C-只满足两项-2×满足三项，可得a-0=48+（a-42）+6y-x-2y，化简得x=4y+6。\n故正确答案为A。","no":85,"missingImage":false}],"count":15,"answerable":15,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"4652224","cat":"图形推理","stem":"每道题包含两套图形和可供选择的4个图形。这两套图形具有某种相似性，也存在某种差异。要求你从四个选项中选择最适合取代问号的一个。正确的答案应不仅使两套图形表现出最大的相似性，而且使第二套图形也表现出自己的特征。\n\u003cimg data-k=\"f4d0832d43ee\" style=\"max-width:606px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，优先考虑属性规律。观察发现，第一套三个图形分别是中心对称图形、轴对称图形、轴对称+中心对称图形。第二套图形应遵循此规律，分别是中心对称图形、轴对称图形，故？处应选择轴对称+中心对称图形，只有A项符合。\n故正确答案为A。","no":86,"missingImage":false},{"type":"question","qid":"4652226","cat":"图形推理","stem":"每道题包含两套图形和可供选择的4个图形。这两套图形具有某种相似性，也存在某种差异。要求你从四个选项中选择最适合取代问号的一个。正确的答案应不仅使两套图形表现出最大的相似性，而且使第二套图形也表现出自己的特征。\n\u003cimg data-k=\"8217a752fffc\" style=\"max-width:455px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"第一组图形两两相邻比较可以发现，第一幅图中每一行黑球整体往下平移一行得到第二幅图（循环走），第二幅图中每一行黑球整体往下平移一行得到第三幅图（循环走）。第二组图形运用此规律，只有A项符合。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"4652301","cat":"图形推理","stem":"每道题包含两套图形和可供选择的4个图形。这两套图形具有某种相似性，也存在某种差异。要求你从四个选项中选择最适合取代问号的一个。正确的答案应不仅使两套图形表现出最大的相似性，而且使第二套图形也表现出自己的特征。\n\u003cimg data-k=\"b44cdcae37f7\" style=\"max-width:642px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相似，且相同线条重复出现，优先考虑样式规律中的加减同异。问号在第二组图中间，则优先考虑图1和图3得到第二幅图的规律。观察发现，第一组图中，图1和图3求异得到图2。第二组图遵循同样的规律，图1和图3求异得到？处图形，只有B项符合。\n故正确答案为B。","no":88,"missingImage":false},{"type":"question","qid":"4652267","cat":"图形推理","stem":"请从四个选项中选出最恰当的一项填在问号处，使图形呈现一定的规律性。\n\u003cimg data-k=\"3f16c4accb5c\" style=\"max-width:554px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，题干图形明显被分割，优先考虑面数量。整体数面发现，题干和选项都为4个面，继续考虑面的细化，发现题干每幅图都包含两个相同面，观察选项，只有B项符合。\n故正确答案为B。","no":89,"missingImage":false},{"type":"question","qid":"4652269","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"e32fe051f95c\" style=\"max-width:609px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"图形元素组成不同，且无属性规律，优先考虑数量规律。观察发现，题干图形均由黑球和白球构成，其中黑球的数量分别是8、9、10、11、12，故？处图形应有13个黑球，只有A项符合。\n故正确答案为A。","no":90,"missingImage":false},{"type":"question","qid":"4652212","cat":"类比推理","stem":"小明说：“只有高级工程师才能成为公司新组建的技术专家组成员。”小红说：“不对呀，老黄是高级工程师，但是他没有被任命为技术专家组成员。”\n小红的回答说明她把小明的话理解为了：","options":{"A":"有的高级工程师是技术专家组成员","B":"有的高级工程师不是技术专家组成员","C":"所有的技术专家组成员都应该是高级工程师","D":"所有的高级工程师都应该是技术专家组成员"},"answer":"D","explanation":"第一步：翻译题干。\n①小明：技术专家组成员\u003cimg data-k=\"2dfb7d1f72f3\">高级工程师；\n②小红：老黄是高级工程师 且 \u003cimg data-k=\"e752a8ae1a16\">技术专家组成员。\n第二步：逐一分析选项。\n由题干可知，小红认为小明说的不对，并进行了反驳，因此她对小明的理解就是“老黄是高级工程师 且 \u003cimg data-k=\"e752a8ae1a16\">技术专家组成员”的矛盾命题，即“高级工程师\u003cimg data-k=\"2dfb7d1f72f3\">技术专家组成员”。\nA项：翻译为有的高级工程师\u003cimg data-k=\"2dfb7d1f72f3\">技术专家组成员，与小红的理解不符，排除；\n\nB项：翻译为有的高级工程师\u003cimg data-k=\"a3a13b026980\">技术专家组成员，与小红的理解不符，排除；\nC项：翻译为技术专家组成员\u003cimg data-k=\"2dfb7d1f72f3\">高级工程师，与小红的理解不符，排除；\nD项：翻译为高级工程师\u003cimg data-k=\"2dfb7d1f72f3\">技术专家组成员，与小红的理解相符，当选。\n故正确答案为D。","no":91,"missingImage":false},{"type":"question","qid":"4652225","cat":"逻辑判断","stem":"某研究团队用没有生命的细菌纤维素（由细菌制造并排泄出的有机化合物，拥有许多独特的力学性能，比如柔韧性、强度和保持形状的能力）充当打印纸，用活微藻充当“墨水”，通过3D打印将活微藻沉积在细菌纤维素上，进而可以产生一种独特材料。研究人员称该项技术有望广泛应用于医疗和轻工业领域。\n以下陈述如果为真，哪项无法支持上述结论？","options":{"A":"该材料可以制造用于皮肤移植的光合皮肤，产生的氧气将有助于伤口修复","B":"该材料能利用阳光将水和二氧化碳转化为氧气和能量，可以制造可持续能源","C":"该材料制成的服装不需要像传统服装那样经常清洗，能大大减少水的使用","D":"该材料是可完全生物降解的高质量织物，将解决纺织业目前面临的环保问题"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：该项技术有望广泛应用于医疗和轻工业领域。\n论据：某研究团队用没有生命的细菌纤维素（由细菌制造并排泄出的有机化合物，拥有许多独特的力学性能，比如柔韧性、强度和保持形状的能力）充当打印纸，用活微藻充当“墨水”，通过3D打印将活微藻沉积在细菌纤维素上，进而可以产生一种独特材料。\n本题提问方式为“哪项无法支持上述结论”，故排除可以加强的选项，选择不能加强的选项即可。\n第二步：逐一分析选项。\nA项：指出该材料可以用于皮肤移植，有助于伤口恢复，举例说明这种材料可以用于医疗领域，可以加强，排除；\nB项：指出该材料可以制造可持续能源，无法确定是否能应用于医疗和轻工业领域，无法加强，当选；\nC项：指出该材料制成的服装能减少水的使用，说明这种材料可以用于服装制造业，服装制造业属于轻工业，可以加强，排除； \nD项：指出该材料将解决纺织业目前面临的环保问题，纺织业属于轻工业，可以加强，排除。\n本题为选非题，故正确答案为B。","no":92,"missingImage":false},{"type":"question","qid":"4652281","cat":"逻辑判断","stem":"今年的一次大学生招聘会上，某宿舍所有6名同学均向甲公司和乙公司投递了简历。甲、乙两公司通知了他们各自所收上百份简历中一半的人员参加面试。因此，这6名同学每人获得了来自甲公司或乙公司的仅一次面试机会。\n要使上述论证成立，以下哪项假设是必须的？","options":{"A":"除向甲、乙公司投递简历外，该宿舍同学未向其他单位投递简历","B":"该宿舍所有同学既符合甲公司的招聘条件，也符合乙公司的招聘条件","C":"甲、乙两公司没有同时通知该宿舍的同一个人去参加他们的面试","D":"该宿舍的这6名同学都愿意参加甲公司或乙公司所通知的面试"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：这6名同学每人获得了来自甲公司或乙公司的仅一次面试机会。\n论据：某宿舍所有6名同学均向甲公司和乙公司投递了简历。甲、乙两公司通知了他们各自所收上百份简历中一半的人员参加面试。\n本题论点和论据均在讨论这6名同学去甲公司或乙公司面试，论点论据话题一致，且问法为“以下哪项假设是必须的”，加强优先考虑必要条件。\n第二步：逐一分析选项。\nA项：该项讨论的是该宿舍6名同学是否还向其他单位投递简历的情况，与论点讨论的这6名同学获得甲公司或乙公司的仅一次面试机会无关，不是论证成立的假设，排除；\nB项：该项讨论的是该宿舍6名同学均符合甲公司和乙公司的招聘条件，论点讨论的是甲公司或乙公司的仅一次面试机会，符合两个公司招聘条件不能说明为什么只有一次面试机会，不是论证成立的假设，排除；\nC项：该项指出甲、乙两公司没有同时通知同一个人去参加面试，所以这6名同学收到的关于甲、乙公司的面试机会只能来自于其中一家，该项是论点成立的必要条件，是论证成立的假设，当选；\nD项：该项讨论的是这6位同学参加面试的意愿，与论点讨论的这6名同学获得甲公司或乙公司的仅一次面试机会无关，不是论证成立的假设，排除。\n故正确答案为C。","no":93,"missingImage":false},{"type":"question","qid":"4652285","cat":"逻辑判断","stem":"某研究调查了数千名被试者的睡眠情况与健康状况，结果发现，从中年至老年（50岁至70岁间）一直处于较短睡眠模式（即每晚睡眠时长少于6小时）的人，失智风险会增加30%。研究者呼吁，中老年人适当增加睡眠时长，可以预防失智的发生。\n以下陈述如果为真，哪项最能质疑研究者的观点？","options":{"A":"老年人每日睡眠时间过长不仅会有疲劳感，还会记忆力降低，精力不集中","B":"随着年龄的增加，身体的细胞也慢慢衰老，这就导致睡眠时间开始变短","C":"心血管代谢问题和精神疾患等都是失智的重要风险因素","D":"失智是一种因脑部疾病所导致的渐进性认知功能退化，跟睡眠时长无关"},"answer":"D","explanat
