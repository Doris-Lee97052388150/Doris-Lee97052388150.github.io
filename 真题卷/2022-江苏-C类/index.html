<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2022年江苏省公务员录用考试《行测》题（C类）（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2022-江苏-C类","title":"2022年江苏省公务员录用考试《行测》题（C类）（网友回忆版）","year":"2022","group":"江苏","modules":[{"label":"政治理论","items":[{"type":"question","qid":"4651524","cat":"时事政治","stem":"党的十九届六中全会通过的《中共中央关于党的百年奋斗重大成就和历史经验的决议》。在十九大报告“八个明确”的基础上，用“十个明确”对习近平新时代中国特色社会主义思想的核心内容作了进一步概括，增加的两个“明确”的主要内容是（    ）。\n①必须坚持和完善社会主义基本经济制度\n②坚持和发展中国特色社会主义的总任务\n③中国特色大国外交要推动构建人类命运共同体\n④全面从严治党的战略方针和新时代党的建设总要求","options":{"A":"①②","B":"②③","C":"①④","D":"③④"},"answer":"C","explanation":"本题考查政治常识。\n①④正确，②③错误，《中共中央关于党的百年奋斗重大成就和历史经验的决议》在党的十九大报告“八个明确”的基础上，增加的两个“明确”，主要内容是：明确必须坚持和完善社会主义基本经济制度，使市场在资源配置中起决定性作用，更好发挥政府作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，统筹发展和安全；明确全面从严治党的战略方针，提出新时代党的建设总要求，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，落实管党治党政治责任，以伟大自我革命引领伟大社会革命。\n故正确答案为C。","no":1,"missingImage":false},{"type":"question","qid":"4651756","cat":"新思想","stem":"2021年9月，习近平总书记在中央政治局第三十三次集体学习时强调，我国要加强国家生物安全风险防控和治理体系建设，提高国家生物安全治理能力。下列不属于我国生物安全风险防控和治理主要内容的是（    ）。","options":{"A":"严密防控外来物种入侵","B":"完善转基因生物安全管理","C":"强化生物遗传资源监管","D":"划定并严守生态保护红线"},"answer":"D","explanation":"本题考查政治常识。\n2021年10月，国务院新闻办公室发表了《中国的生物多样性保护》白皮书。\nA项正确，白皮书在“二、提高生物多样性保护成效”中的“（三）加强生物安全管理”部分指出：“严密防控外来物种入侵。持续加强对外来物种入侵的防范和应对，完善外来入侵物种防控制度，建立外来入侵物种防控部际协调机制，推动联防联控。陆续发布4批《中国自然生态系统外来入侵物种名单》，制定《国家重点管理外来入侵物种名录》，共计公布83种外来入侵物种。”\nB项正确，白皮书在“二、提高生物多样性保护成效”中的“（三）加强生物安全管理”部分指出：“完善转基因生物安全管理。严格规范生物技术及其产品的安全管理，积极推动生物技术有序健康发展。先后颁布实施《农业转基因生物安全管理条例》《农业转基因生物安全评价管理办法》《生物技术研究开发安全管理办法》《进出境转基因产品检验检疫管理办法》等法律法规。”\nC项正确，白皮书在“二、提高生物多样性保护成效”中的“（三）加强生物安全管理”部分指出：“强化生物遗传资源监管。加强对生物遗传资源保护、获取、利用和惠益分享的管理和监督，保障生物遗传资源安全。开展重要生物遗传资源调查和保护成效评估，查明生物遗传资源本底，查清重要生物遗传资源分布、保护及利用现状。组织开展第四次全国中药资源普查，获得1.3万多种中药资源的种类和分布等信息，其中3150种为中国特有种。”\nD项错误，白皮书在“二、提高生物多样性保护成效”中的“（一）优化就地保护体系”部分指出：“划定并严守生态保护红线。生态保护红线是中国国土空间规划和生态环境体制机制改革的重要制度创新。中国创新生态空间保护模式，将具有生物多样性维护等生态功能极重要区域和生态极脆弱区域划入生态保护红线，进行严格保护。初步划定的生态保护红线，集中分布于青藏高原、天山山脉、内蒙古高原、大小兴安岭、秦岭、南岭，以及黄河流域、长江流域、海岸带等重要生态安全屏障和区域。”选项表述正确，但不属于我国生物安全风险防控和治理的主要内容。\n本题为选非题，故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"4651568","cat":"马克思主义","stem":"习近平总书记在全国脱贫攻坚总结表彰大会上指出：“伟大事业孕育伟大精神，伟大精神引领伟大事业。”上述重要论断蕴含的哲理是（    ）。","options":{"A":"本质是现象的根据，现象从特定方面表现事物的本质","B":"质变是量变的必然结果，质变体现和巩固量变的成果","C":"内容是事物存在的基础，形式对事物的内容具有反作用","D":"实践是认识发生和发展的基础，认识对实践有指导作用"},"answer":"D","explanation":"本题考查政治常识。\n习近平总书记在全国脱贫攻坚总结表彰大会上指出：“伟大事业孕育伟大精神，伟大精神引领伟大事业。脱贫攻坚伟大斗争，锻造形成了‘上下同心、尽锐出战、精准务实、开拓创新、攻坚克难、不负人民’的脱贫攻坚精神。”其中“伟大事业”指的是推进中国特色社会主义伟大事业，属于实践层面的内容，“伟大精神”指的是脱贫攻坚精神，属于认识层面的内容。\nA项错误，本质是事物的根本性质，是构成事物的诸要素之间的内在联系；现象是事物的外部联系和表面特征，是事物本质的外在表现。本质决定现象，本质总是通过一定的现象表现自己的存在；现象表现本质，现象的存在和变化归根到底依赖于本质。选项表述正确，但与题干无关。\nB项错误，量变是事物数量的增减和组成要素排列次序的变动，是保持事物的质的相对稳定性的不显著变化，体现了事物发展渐进过程的连续性；质变是事物性质的根本变化，是事物由一种质态向另一种质态的飞跃。量变是质变的必要准备；质变是量变的必然结果；量变和质变相互渗透、相互依存、相互贯通。选项表述正确，但与题干无关。\nC项错误，内容指构成事物的一切要素的总和；形式指把事物的内容诸要素统一起来的结构或外部表现方式。任何事物都是内容与形式的统一。内容是事物存在的基础，对形式具有决定作用；形式对内容具有反作用。适合内容的形式，对内容的发展起积极的推动作用；不适合内容的形式，对内容的发展起消极的阻碍作用。选项表述正确，但与题干无关。\nD项正确，实践在认识活动中起着决定作用：实践是认识的来源，认识的内容是在实践活动的基础上产生和发展的；实践是认识发展的动力，实践的需要推动认识的产生和发展，推动人类的科学发现和技术发明，推动人类的思想进步和理论创新。实践是认识的目的，人们通过实践获得认识，其最终目的是为实践服务，指导实践，以满足人们生活和生产的需要。实践是检验认识真理性的唯一标准，认识是否具有真理性只有在实践中才能得到验证。“伟大事业”即实践，“伟大精神”即认识，“伟大事业孕育伟大精神”体现了实践是认识发生和发展的基础，“伟大精神引领伟大事业”体现了认识对实践具有指导作用。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"4651804","cat":"新思想","stem":"建设中国特色社会主义法治体系，要求坚持依法治国和以德治国相结合，实现法治和德治相辅相成、相得益彰。关于德治和法治的关系，下列理解正确的是：","options":{"A":"法律的实施要体现道德诉求，法律的强制功能确保道德底线","B":"德治弘扬的是礼让精神，应尽量采用道德手段解决法律纷争","C":"将道德义务上升为法律义务，才能切实提升社会的道德素质","D":"道德是内心的法律，法律的有效实施总是依赖于道德的约束"},"answer":"A","explanation":"本题考查法律常识。\nA项正确，法律和道德在社会治理中是密不可分的，社会主义法追求良法之治，法律中已包含了道德的标准，它对社会主义道德具有积极的促进和保障作用，所以法律的实施要体现道德诉求。道德的调整范围比法律广，法律是最低限度的道德，法律的强制功能确保道德底线。\nB项错误，法与道德在功能上相辅相成，共同调整社会关系。法律调整与道德调整各具优势，且形成互补。所以，解决纷争既要使用法律手段，又要使用道德手段，因为法律与道德有其相应的适用范围，并非要尽量采用某一种手段解决纷争。\nC项错误，法律是最低限度的道德，法律的调整范围相比较道德而言小。提升社会的道德素质可以靠教育、靠道德宣传等手段，并非通过将道德义务上升为法律义务，才能切实提升社会的道德素质。\nD项错误，法律是靠国家强制力保证实施的，道德是靠舆论和自觉保障的。所以，法律的实施并非总是依赖于道德的约束。\n故正确答案为A。","no":4,"missingImage":false}],"count":4,"answerable":4,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"4651754","cat":"人文常识","stem":"中共中央、国务院《关于全面推进乡村振兴加快农业农村现代化的意见》明确提出，对摆脱贫困的县从脱贫之日起设立一定的过渡期，以确保巩固拓展脱贫攻坚成果同乡村振兴的有效衔接。下列属于过渡期的具体政策措施的是（    ）。","options":{"A":"“三农”工作的重心在过渡期内保持不变","B":"现有主要帮扶政策在过渡期内保持总体稳定","C":"在过渡期内国家为每个脱贫县建设一项重大基础工程","D":"实施“一对多，多对一”的东西部协作帮扶办法"},"answer":"B","explanation":"本题考查政治常识。\nB项正确，A、C、D三项错误，《关于全面推进乡村振兴加快农业农村现代化的意见》指出：“设立衔接过渡期。脱贫攻坚目标任务完成后，对摆脱贫困的县，从脱贫之日起设立5年过渡期，做到扶上马送一程。过渡期内保持现有主要帮扶政策总体稳定，并逐项分类优化调整，合理把握节奏、力度和时限，逐步实现由集中资源支持脱贫攻坚向全面推进乡村振兴平稳过渡，推动‘三农’工作重心历史性转移。抓紧出台各项政策完善优化的具体实施办法，确保工作不留空档、政策不留空白。”\n故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"4651641","cat":"人文常识","stem":"我国要坚持以人民为中心的发展思想，在高质量发展中促进共同富裕。下列对我国共同富裕的理解正确的是（    ）。","options":{"A":"全体人民共同富裕是一个总体概念","B":"共同富裕是人民群众的物质生活富裕","C":"共同富裕主要通过第三次分配来实现","D":"共同富裕的目标将在2035年基本实现"},"answer":"A","explanation":"本题考查政治常识。\n2021年10月16日出版的第20期《求是》杂志发表了习近平总书记的重要文章《扎实推动共同富裕》（以下简称文章）。\nA项正确，文章指出：“我总的认为，像全面建成小康社会一样，全体人民共同富裕是一个总体概念，是对全社会而言的，不要分成城市一块、农村一块，或者东部、中部、西部地区各一块，各提各的指标，要从全局上来看。”\nB项错误，文章指出：“共同富裕是社会主义的本质要求，是中国式现代化的重要特征。我们说的共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义。”\nC项错误，文章指出：“促进共同富裕总的思路是，坚持以人民为中心的发展思想，在高质量发展中促进共同富裕，正确处理效率和公平的关系，构建初次分配、再分配、三次分配协调配套的基础性制度安排，加大税收、社保、转移支付等调节力度并提高精准性，扩大中等收入群体比重，增加低收入群体收入，合理调节高收入，取缔非法收入，形成中间大、两头小的橄榄型分配结构，促进社会公平正义，促进人的全面发展，使全体人民朝着共同富裕目标扎实迈进。”\nD项错误，文章指出：“到2035年，全体人民共同富裕取得更为明显的实质性进展，基本公共服务实现均等化。到本世纪中叶，全体人民共同富裕基本实现，居民收入和实际消费水平差距缩小到合理区间。”\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"4651450","cat":"科技常识","stem":"近年来我国基础研究和原始创新取得重要进展，战略高技术领域实现新跨越。下列属于实现了战略高技术新跨越的成就是：","options":{"A":"“嫦娥五号”月球探测器实现地外天体采样返回","B":"76个光子的量子计算原型机“九章”成功问世","C":"“慧眼号”硬X射线调制望远镜直接测量到迄今宇宙最强磁场","D":"“墨子号”量子科学实验卫星实现无中继千公里级量子密钥分发"},"answer":"D","explanation":"本题考查政治常识。\n2021年5月28日，习近平总书记在北京出席中国科学院第二十次院士大会、中国工程院第十五次院士大会、中国科协第十次全国代表大会并发表讲话。\nA、B、C三项错误，习近平总书记在讲话中指出：“基础研究和原始创新取得重要进展。基础研究整体实力显著加强，化学、材料、物理、工程等学科整体水平明显提升。在量子信息、干细胞、脑科学等前沿方向上取得一批重大原创成果。成功组织了一批重大基础研究任务，‘嫦娥五号’实现地外天体采样返回，‘天问一号’开启火星探测，‘怀柔一号’引力波暴高能电磁对应体全天监测器卫星成功发射，‘慧眼号’直接测量到迄今宇宙最强磁场，500米口径球面射电望远镜首次发现毫秒脉冲星，新一代‘人造太阳’首次放电，‘雪龙2’号首航南极，76个光子的量子计算原型机‘九章’、62比特可编程超导量子计算原型机‘祖冲之号’成功问世。散裂中子源等一批具有国际一流水平的重大科技基础设施通过验收。”\nD项正确，习近平总书记在讲话中指出：“几年来，在党中央坚强领导下，在全国科技界和社会各界共同努力下，我国科技实力正在从量的积累迈向质的飞跃、从点的突破迈向系统能力提升，科技创新取得新的历史性成就······战略高技术领域取得新跨越。在深海、深空、深地、深蓝等领域积极抢占科技制高点。‘海斗一号’完成万米海试，‘奋斗者’号成功坐底，北斗卫星导航系统全面开通，中国空间站天和核心舱成功发射，‘长征五号’遥三运载火箭成功发射，世界最强流深地核天体物理加速器成功出束，‘神威·太湖之光’超级计算机首次实现千万核心并行第一性原理计算模拟，‘墨子号’实现无中继千公里级量子密钥分发。‘天鲲号’首次试航成功。‘国和一号’和‘华龙一号’三代核电技术取得新突破。”\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"4651468","cat":"科技常识","stem":"2021年10月16日，我国神舟十三号载人航天飞船发射成功，翟志刚、王亚平、叶光富三名航天员执行此次飞行任务，按照计划他们将在天和核心舱驻留半年，按照计划，他们回到地面后即将迎来的首个节气是：","options":{"A":"雨水","B":"惊蛰","C":"谷雨","D":"小满"},"answer":"C","explanation":"本题考查地理国情。\n2021年10月16日，神舟十三号载人航天飞船发射成功，计划半年回到地面，故回到地面的时间大致是2022年4月16日。\nA项错误，雨水是二十四节气中的第二个节气，通常在每年公历的2月18日-20日，表示天渐回暖，雨量增多。\nB项错误，惊蛰是二十四节气中的第三个节气，通常在每年公历的3月5日或6日，表示冬眠动物开始苏醒。\nC项正确，谷雨是二十四节气中的第六个节气，通常在每年公历的4月19日-21日，表示降水明显增多，有利于谷物生长。故按照计划，他们回到地面后即将迎来的首个节气是谷雨。\nD项错误，小满是二十四节气中的第八个节气，通常在每年公历的5月20日-22日，表示麦类作物籽粒开始饱满。\n故正确答案为C。","no":8,"missingImage":false},{"type":"question","qid":"4651462","cat":"人文常识","stem":"很多成语是历史的缩影，浓缩了历史的精华片段。下列成语与所涉历史人物对应关系不正确的是：","options":{"A":"因势利导——孙膑","B":"擘肌分理——管仲","C":"约法三章——刘邦","D":"潜精研思——班固"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，“因势利导”出自于西汉·司马迁的《史记·孙子吴起列传》，原文为“善战者，因其势而利导之”，指顺着事情发展的趋势向有利的方向引导。马陵之战中，善于用兵的孙膑猜透庞涓轻敌的心理，因势利导，减灶诱敌，营造出齐军士兵胆小逃跑的假象；与此同时，他暗中埋伏弓箭手，等待敌人上当；轻敌的庞涓果然进入圈套，被迫自杀。故所涉历史人物为孙膑。\nB项错误，“擘肌分理”出自汉代张衡的《西京赋》，原文为“若其五县游丽辩论之士，街谈巷议，弹射臧否，剖析毫厘，擘肌分理，所好生毛羽，所恶成疮痏”，比喻分析事理十分细致。故所涉历史人物为张衡，而不是管仲。\nC项正确，“约法三章”出自汉代司马迁的《史记·高祖本纪》，原文为“与父老约，法三章耳：杀人者死，伤人及盗抵罪”，原指刘邦进入咸阳，废除秦法之后制定出三条简单法令；后泛指约好或提出几条规定，大家共同遵守。故所涉历史人物为刘邦。\nD项正确，“潜精研思”出自南朝宋范晔的《后汉书·班固传》，原文为“固以彪所续前史未详，乃潜精研思，欲就其业”，指专心钻研。故所涉历史人物为班固。\n本题为选非题，故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"4651746","cat":"人文常识","stem":"王某在赶集回家路上遇到骑摩托车的李某，于是搭乘便车回村。途中，李某接听电话致摩托车失控侧翻，王某受伤。关于王某的损害赔偿，下列说法正确的是：","options":{"A":"王某自行承担损害后果","B":"李某承担适当的赔偿责任","C":"王某和李某均等分担损失","D":"李某须承担全部赔偿责任"},"answer":"D","explanation":"本题考查法律常识。\nA、B、C三项错误，D项正确，《民法典》第一千一百六十五条第一款规定：“行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任。”第一千二百一十七条规定：“非营运机动车发生交通事故造成无偿搭乘人损害，属于该机动车一方责任的，应当减轻其赔偿责任，但是机动车使用人有故意或者重大过失的除外。”《道路交通安全法实施条例》第六十二条第三项规定：“驾驶机动车不得有下列行为：（三）拨打接听手持电话、观看电视等妨碍安全驾驶的行为。”题中，王某属于无偿搭乘人，李某驾驶机动车接听电话是明显违反《道路交通安全法实施条例》的违规行为，构成重大过失，应承担全部赔偿责任。\n故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"4651749","cat":"人文常识","stem":"赵某私自在村集体所有的山上栽种草莓。草莓成熟后，赵某采摘售卖。关于赵某栽种草莓收益的归属，下列说法正确的是：","options":{"A":"归赵某所有","B":"归村集体所有","C":"归赵某和村集体所有","D":"归赵某、全体村民和村集体所有"},"answer":"B","explanation":"本题考查法律常识。\nA、C、D三项错误，B项正确，根据《民法典》第二百四十条规定：“所有权人对自己的不动产或者动产，依法享有占有、使用、收益和处分的权利。”第九百八十五条规定：“得利人没有法律根据取得不当利益的，受损失的人可以请求得利人返还取得的利益，但是有下列情形之一的除外：（一）为履行道德义务进行的给付；（二）债务到期之前的清偿；（三）明知无给付义务而进行的债务清偿。”题中，山上栽种草莓的收益应当归其所有权人即村集体所有，赵某私自在村集体所有的山上栽种草莓并获取的收益没有法律依据，属于不当得利，该收益归村集体所有。\n故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"4651750","cat":"科技常识","stem":"根据《数字农业农村发展规划（2019-2025年）》，我国要瞄准农业农村现代化的重大需求，加强关键共性技术攻关，强化战略性前沿性技术超前布局。下列属于我国农业需要重点攻关的关键共性技术的是（    ）。","options":{"A":"动植物生长信息获取及生产调控机理模型构建","B":"农业区块链大规模组网、链上链下数据协同技术","C":"高品质、高精度、高可靠、低功耗农业专用传感器","D":"适应性强、性价比高、智能决策的新一代农业机器人"},"answer":"C","explanation":"本题考查政治常识。\nA、B、D三项错误，C项正确，《数字农业农村发展规划（2019-2025年）》在“六、强化关键技术装备创新”中的“（一）加强关键共性技术攻关”部分指出：“瞄准农业农村现代化与乡村振兴战略的重大需求，重点攻克高品质、高精度、高可靠、低功耗农业生产环境和动植物生理体征专用传感器，从根本上解决数字农业高通量信息获取难题。”\n故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"4651774","cat":"人文常识","stem":"我国高度重视粮食生产，明确提出在“十四五”开局之年，粮食产量要保持在1.3万亿斤。下列措施对于确保完成全年粮食生产目标任务具有重要作用的是：\n①稳定并适当扩大粮食作物的种植面积\n②防灾治虫减轻气象灾害和病虫害损失\n③筹集资金提高稻谷小麦的最低收购价\n④采用新型技术进行粮食转化的深加工","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"A","explanation":"本题考查政治常识。\n①②③正确，要实现今年粮食生产的目标任务，主要抓三个方面：一是义利同抓稳面积；另一个是强化科技提单产；还有一个是防灾治虫减损失，切实减轻气象灾害和病虫害的损失，确保实现抗灾夺丰收。同时，中央进一步加大支持力度，稻谷小麦最低收购价都比去年提高了1分钱。在稳定的基础上扩大粮食作物的种植面积，有利于提高粮食产量；提高稻谷小麦的最低收购价，有利于提高农民种植粮食积极性，有利于提高粮食产量。\n④错误，粮食转化是指以粮食为原料，所产的产品不再属于粮食范畴的生产行为。它特指粮食的深加工或精细加工，如利用玉米生产淀粉、酒精、葡萄糖等。粮食转化的深加工和提高粮食产量没有必然联系。\n综上所述，①②③对于确保完成全年粮食生产目标任务具有重要作用。\n故正确答案为A。","no":13,"missingImage":false},{"type":"question","qid":"4651775","cat":"人文常识","stem":"在我国传统农业向现代农业的转型升级过程中，以绿色、有机农产品为载体，用会员制拓展用户的“定制农业”发展十分迅速。下列不符合“定制农业”的做法是（    ）。","options":{"A":"消费者缴纳会费后成为农产品销售企业的会员","B":"基层领导利用知名电商平台进行现场直播带货","C":"城市居民在郊区农场认种地块并体验农耕生活","D":"农产品生产企业按约向城市超市配送农副产品"},"answer":"B","explanation":"本题考查政治常识。\nA、C、D三项正确，B项错误，定制农业就是按照消费者的要求和标准进行农产品生产、农业服务全程个性化定制的经营模式，核心点包含3个：城市消费者缴纳会费成为中小农业企业或组织的会员；中小农业企业或组织按照约定生产并按时配送农副产品；农旅结合，会员可以定期来到农场体验农耕生活。直播带货不属于“定制农业”范畴。\n本题为选非题，故正确答案为B。","no":14,"missingImage":false},{"type":"question","qid":"4651748","cat":"经济常识","stem":"农村生态文明建设涉及的范围广泛，需要因势利导综合施策。下列举措不利于农村生态文明建设的是：","options":{"A":"各级政府财政部门设立农村环境整治专项资金","B":"金融系统对绿色循环农业的项目提供无息贷款","C":"大力推广河流湖库和近岸海域的投饵网箱养殖","D":"建立多主体参与的农村水系共建共管共享机制"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，为规范农村环境整治资金管理，提高资金使用效益，2021年7月6日，财政部印发《农村环境整治资金管理办法》。《办法》所称农村环境整治资金是指由中央一般公共预算安排，用于支持地方开展农村生态环境保护工作，促进农村生态环境质量改善的专项转移支付资金，支持方向包括农村黑臭水体治理和其他重点农村环境整治工作。故各级政府财政部门设立农村环境整治专项资金有利于农村生态文明建设。\nB项正确，利用生态循环理论的成果，对于当地的农业以金融支持，提供低息甚至无息贷款，有利于农村生态文明建设。\nC项错误，《中华人民共和国乡村振兴促进法》第四十条第三款指出：“地方各级人民政府及其有关部门应当采取措施，推进废旧农膜和农药等农业投入品包装废弃物回收处理，推进农作物秸秆、畜禽粪污的资源化利用，严格控制河流湖库、近岸海域投饵网箱养殖。”故大力推广河流湖库和近岸海域的投饵网箱养殖不利于农村生态文明建设。\nD项正确，《中华人民共和国乡村振兴促进法》第三十七条指出：“各级人民政府应当建立政府、村级组织、企业、农民等各方面参与的共建共管共享机制，综合整治农村水系，因地制宜推广卫生厕所和简便易行的垃圾分类，治理农村垃圾和污水，加强乡村无障碍设施建设，鼓励和支持使用清洁能源、可再生能源，持续改善农村人居环境。”故建立多主体参与的农村水系共建共管共享机制有利于农村生态文明建设。\n本题为选非题，故正确答案为C。","no":15,"missingImage":false}],"count":11,"answerable":11,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"material","material":"\u003cp>        大多疫苗是注入肌肉组织的，这种给药方式被称为肌内注射；一些疫苗则是口服的，比如轮状病毒疫苗；还有一种给药方式是将药液注射入皮下组织，比如麻疹、流行性腮腺炎和风疹疫苗，均为这种皮下注射方式。不过，大部分疫苗还是以肌内注射为主。\u003c/p>\u003cp>        但是，选择是否在肌肉处注射真的那么重要吗？注射位置在这里又起到了什么作用？另外，为什么要选择肩峰处那块被称为三角肌的手臂肌肉呢？\u003c/p>\u003cp>        肌肉之所以被认为是一处绝佳的疫苗注射部位，是因为在肌肉组织中含有对人体而言十分重要的免疫细胞。这些免疫细胞能够识别抗原，例如由疫苗所引入的少量病毒或细菌，刺激免疫系统产生免疫应答。就新冠疫苗而言，它的\u003cu>            \u003c/u>并非将病毒引入体内，而是为机体提供产生抗原的“蓝图”。当肌肉组织中的免疫细胞捕获到这些抗原后，会将其呈递给淋巴结。而将疫苗注射到肌肉组织，可以保持疫苗在机体内的局部性，使该处的免疫细胞能够向其他免疫细胞发出警报，并尽快投入“工作”。\u003c/p>\u003cp>        一旦疫苗被肌肉中的免疫细胞成功识别，这些免疫细胞就会把抗原“押送”到淋巴管，然后淋巴管会将携带有抗原的免疫细胞运送到淋巴结。淋巴结是我们免疫系统的关键组成部分，它里面存在着大量免疫细胞，可以识别疫苗中的抗原，并启动产生抗体这一免疫过程。因此，选择疫苗接种部位的时候，需要考虑是否临近淋巴结簇。例如，许多疫苗注射部位都会选在三角肌位置，因为它靠近腋下的淋巴结；而当选择在大腿处注射疫苗时，那条从淋巴管通往腹股沟淋巴结簇的道路其实也并不太远。\u003c/p>\u003cp>        肌肉组织还能将疫苗反应限制在局部。举例来说，将疫苗注射入三角肌中可能会导致注射部位出现局部炎症或酸痛；而如果将某些疫苗注入到脂肪组织中，由于脂肪组织供血不足，会导致疫苗中某些成分吸收效果不佳，因而增加刺激和炎症反应出现的可能性。因此，如果疫苗中含有佐剂或者其他能够增强机体抗原的免疫应答成分，就必须在肌肉中注射，以免产生广泛的刺激和炎症。其中，作为一类非特异性免疫增强剂，佐剂会以多种方式刺激机体，产生更强的免疫反应出现的可能性。\u003c/p>\u003cp>        此外，疫苗接种位置的另一个决定性因素是肌肉的大小。对于成人和三岁以上的孩童，医护人员倾向于在上臂的三角肌部位接种疫苗；对于更小的孩子，则会选择在大腿中部接种，因为他们的手臂肌肉较小，且欠发达。在接种疫苗期间，另一个需要考虑的因素则是接种时的便利性和患者的可接受度。很显然，卷起袖子更便捷，也更容易被大众接受。\u003c/p>\u003cp>        在流感季节或者新冠疫情这样的流行病暴发时期，公共卫生系统需要在短时间内为尽可能多的人接种疫苗。鉴于这些原因，在胳膊上扎针必然是首选，因为可行性明显更大。\u003c/p>","questions":[{"qid":"4651769","cat":"片段阅读","stem":"文中提及的疫苗注射的人体部位不包括：","options":{"A":"上臂三角肌","B":"淋巴组织","C":"大腿中部肌肉","D":"皮下组织"},"answer":"B","explanation":"A项，根据第六段“对于成人和三岁以上的孩童，医护人员倾向于在上臂的三角肌部位接种疫苗”可知，疫苗注射的人体部位包括“上臂三角肌”，排除；\nB项，根据第四段“选择疫苗接种部位的时候，需要考虑是否临近淋巴结簇”可知，疫苗接种部位需要考虑是否临近淋巴结簇，并未提及“淋巴组织”是疫苗注射的人体部位，表述错误，当选；\nC项，根据第六段“对于更小的孩子，则会选择在大腿中部接种”可知，疫苗注射的人体部位包括“大腿中部肌肉”，排除；\nD项，根据第一段“一些疫苗则是口服的······还有一种给药方式是将药液注射入皮下组织”可知，疫苗注射的人体部位包括“皮下组织”，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《为什么接种疫苗时总是选择上臂，而不是其他部位？》","no":16,"missingImage":false},{"qid":"4651779","cat":"片段阅读","stem":"下列说法与文意相符的是：","options":{"A":"淋巴结中存在着大量的免疫细胞","B":"淋巴结负责输送携带有抗原的免疫细胞","C":"淋巴结在免疫过程中起辅助作用","D":"淋巴管能识别并捕获肌肉组织内的抗原"},"answer":"A","explanation":"A项，根据第四段“淋巴结是我们免疫系统的关键组成部分，它里面存在着大量免疫细胞”可知，表述正确，当选；\nB项，根据第四段“然后淋巴管会将携带有抗原的免疫细胞运送到淋巴结”可知，负责输送的是淋巴管，而非淋巴结，表述错误，排除；\nC项，根据第四段“淋巴结是我们免疫系统的关键组成部分”可知，淋巴结在免疫过程中起关键作用，而非辅助作用，表述错误，排除；\nD项，根据第四段“一旦疫苗被肌肉中的免疫细胞成功识别，这些免疫细胞就会把抗原‘押送’到淋巴管”可知，识别并捕获抗原的是免疫细胞，而非淋巴管，表述错误，排除。\n故正确答案为A。\n【文段出处】《为什么接种疫苗时总是选择上臂，而不是其他部位？》","no":17,"missingImage":false},{"qid":"4651780","cat":"逻辑填空","stem":"填入文中画横线处最恰当的是：","options":{"A":"运行轨迹","B":"治疗机制","C":"工作原理","D":"传输方式"},"answer":"C","explanation":"分析文意可知，后文是对横线处所填内容的解释说明，论述新冠疫苗并没有将病毒引入体内，而是为机体提供产生抗原的“蓝图”。随后详细解释这一过程，指出免疫细胞捕获抗原后，呈递给淋巴结，而疫苗的作用是使肌肉组织的免疫细胞向其他免疫细胞发出警报，并尽快投入“工作”，是疫苗发挥作用的过程，即疫苗的“工作原理”，对应C项。\nA项，后文并没有介绍疫苗是按照什么样的轨迹运行的，故“运行轨迹”与文意不符，排除；\nB项，疫苗并无“治疗”作用，故“治疗机制”与文意不符，排除；\nD项，后文并没有介绍疫苗的“传输”，故“传输方式”与文意不符，排除。\n故正确答案为C。\n【文段出处】《为什么接种疫苗时总是选择上臂，而不是其他部位？》","no":18,"missingImage":false},{"qid":"4651781","cat":"片段阅读","stem":"根据文意，接种疫苗选择上臂的原因不包括：","options":{"A":"袒露臂部比其他部位更容易接受","B":"方便携带抗原的免疫细胞就近输送","C":"在肌肉组织内启动免疫机制较为可控","D":"肌肉注射引起的疼痛感更为轻微"},"answer":"D","explanation":"A项，根据第六段“另一个需要考虑的因素则是接种时的便利性和患者的可接受度。很显然，卷起袖子更便捷，也更容易被大众接受”可知，表述正确，排除；\nB项，根据第四段“一旦疫苗被肌肉中的免疫细胞成功识别，这些免疫细胞就会把抗原‘押送’到淋巴管”“因此，选择疫苗接种部位的时候，需要考虑是否临近淋巴结簇”“许多疫苗注射部位都会选在三角肌位置，因为它靠近腋下的淋巴结”可知，上臂靠近腋下淋巴结，方便携带抗原的免疫细胞就近输送，表述正确，排除；\nC项，根据第五段“肌肉组织还能将疫苗反应限制在局部”可知，在肌肉中注射可以避免“产生广泛的刺激和炎症”，表述正确，排除；\nD项，文段没有提到“肌肉注射引起的疼痛感更为轻微”，无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《为什么接种疫苗时总是选择上臂，而不是其他部位？》","no":19,"missingImage":false},{"qid":"4651782","cat":"片段阅读","stem":"最适合做这篇文章标题的是：","options":{"A":"疫苗接种早知道","B":"接种疫苗为什么要选择上臂","C":"是什么决定了疫苗的给药方式","D":"疫苗注射，不止是医学问题"},"answer":"B","explanation":"通读文章可知，文章第一、二段首先提出问题——疫苗为什么要以肌肉注射为主，且为什么要注射在三角肌处。随后第三段论述肌肉组织有重要的免疫细胞，第四段指出“选择疫苗接种部位要考虑是否临近淋巴结簇”，第五段论述“肌肉组织还能将疫苗反应限制在局部”，第六段指出“疫苗接种位置的另一个决定性因素是肌肉的大小”，第七段指出“需要在短时间内为尽可能多的人接种疫苗”，并进行总结，强调“在胳膊上扎针必然是首选”。故文章前两段提出问题，即疫苗为什么以肌肉注射为主，后五段是对问题的解释说明，B项是对文章核心话题的概括，当选。\nA项，文章主要围绕疫苗接种部位的问题进行阐述，“疫苗接种”范围扩大，排除；\nC项，文章论述的核心话题为疫苗接种部位，而非“给药方式”，与文意不符，排除；\nD项，“疫苗注射”范围扩大，文章主要讨论的是疫苗接种部位的问题，排除。\n故正确答案为B。\n【文段出处】《为什么接种疫苗时总是选择上臂，而不是其他部位？》","no":20,"missingImage":false},{"qid":"4651508","cat":"片段阅读","stem":"我国《民法典》系统整合了新中国70多年来长期实践形成的民事法律规范，汲取了中华民族5000多年优秀法律文化，借鉴了人类法治文明建设有益成果，是一部体现我国社会主义性质、符合人民利益和愿望、顺应时代发展要求的民法典。\n这段文字重在说明：","options":{"A":"我国《民法典》切合司法实践诉求","B":"我国《民法典》具有鲜明的中国特色","C":"我国《民法典》体现新中国的法治化进程","D":"我国《民法典》符合时代法治建设发展要求"},"answer":"D","explanation":"文段首先通过“整合了······，汲取了······，借鉴了······”说明我国《民法典》的形成过程，最后通过“是一部······的民法典”指出《民法典》形成后的价值、意义，文段重在强调《民法典》能体现我国社会主义性质、符合人民利益和愿望、顺应时代发展要求，此三点均为现阶段法治建设的发展要求，对应D项。\nA项，“切合司法实践诉求”对应“整合了······”为引出《民法典》价值、意义前的铺垫，非重点，且内容片面，排除；\nB项，“鲜明的中国特色”对应“体现我国社会主义性质”，表述片面，排除；\nC项，“体现新中国的法治化进程”强调《民法典》与法治化进程之间的关系，并非文段重点，排除。\n故正确答案为D。\n【文段出处】《民法典：新时代我国社会主义法治建设的重大成果》","no":21,"missingImage":false},{"qid":"4651766","cat":"片段阅读","stem":"我国是农业大国，传统农耕文化延续至今已有几千年的历史。垂直农业作为新兴概念，可能一时难以被大众接受。因此，政府应普及与垂直农业有关的知识，让人们真正了解其所生产的绿色健康食品。可以先推出一些小型简易垂直农场，增加人们的认知度，获得社会认同。这类农场既可以作为实验基地，收集动植物的生长数据，培养一些新型作物；也可以作为科研平台，研发相关技术，培养综合技术人才。\n这段文字主要讨论：","options":{"A":"发展垂直农业的重要性和紧迫性","B":"现阶段推行垂直农业面临的问题","C":"发展农业的策略和前景","D":"垂直农业在我国的发展趋势"},"answer":"D","explanation":"文段开篇介绍我国农耕文化历史悠久的背景，而后指出因垂直农业为新兴概念，一时难以被大众接受，所以政府应普及与垂直农业相关的知识，让人们了解并接受。之后进一步指出可以先从推出小型简易垂直农场开始做起，并论述这类垂直农场的作用，由此说明通过这类垂直农场的发展确实可以在普及垂直农业中发挥作用，最终让大众接受垂直农业。故文段重在说明垂直农业通过一些措施后最终可以被大众接受，强调垂直农业在我国未来可被大众接受这一趋势，对应D项。\nA项，“紧迫性”无中生有，文段并未提及；\nB项，“面临的问题”为前文的问题表述，非重点，排除；\nC项，文段核心话题为“垂直农业”，“农业”范围扩大，排除。\n故正确答案为D。","no":22,"missingImage":false},{"qid":"4651496","cat":"片段阅读","stem":"截至2020年底，全球氢燃料电池汽车保有量较上一年度增长38%。氢能的大规模应用正从汽车领域逐步拓展至其他交通、建筑和工业等领域。应用在轨道交通和船舶上，氢能可降低长距离、高负荷交通运输对传统油气燃料的依赖。应用于分布式发电，氢能可为家庭住宅、商业建筑供电供暖。氢能还可直接为石化、钢铁、冶金等行业提供高效原料、还原剂和高品质热源，有效减少碳排放。\n这段文字着重介绍的是：","options":{"A":"氢能热效率高于传统能源","B":"氢能利用将取代传统的工业原料","C":"氢能有着多元的应用场景","D":"氢能利用将成为节能减排新举措"},"answer":"C","explanation":"文段开篇介绍氢燃料电池汽车保有量增长，随后提出观点，氢能应用从汽车领域正拓展至其他各领域。随后进行具体的解释说明，指出氢能应用到轨道交通和船舶、应用于分布式发电、作为高效原料等带来的诸多好处，论证氢能应用范围的广泛。故文段为分总分结构，重在论述氢能的应用范围非常广泛，对应C项。\nA项，文段核心话题为“氢能”，“氢能热效率”偏离核心话题，排除；\nB项，“取代传统的工业原料”无中生有，排除；\nD项，“节能减排”对应文段尾句解释说明的内容，非重点且无法全面概括，排除。\n故正确答案为C。\n【文段出处】《氢能缘何受瞩目》","no":23,"missingImage":false},{"qid":"4651768","cat":"片段阅读","stem":"为了向公众传播科学，科学媒体将艰深晦涩的科学理论与科学项目转化为通俗易懂的文化产品，公众透过科学媒体了解科学的发展动态。然而，某些媒体创作的科学故事并未真实反映科学的本来面目，为使科学故事引人入胜，对科学研究进行了筛选、改造，忽略了科学研究的不确定性与风险性，同时又放大了科学研究的局部片段。随着数字媒体时代的到来，碎片化阅读行为使公众更加无法对科学有全面真实的了解。\n这段文字重在说明：","options":{"A":"科学故事应还原科学的本来面目","B":"科学本身并不具备引人入胜的故事性","C":"媒体可能误导公众对科学的认知","D":"媒体的科学传播应更注重严谨和真实"},"answer":"D","explanation":"文段开篇指出科学媒体会对科学内容进行通俗易懂的改造，使公众了解科学动态，即科学媒体的作用，接着通过转折词“然而”指出某些媒体的科学故事没有反映科学的本来面目，即提出问题，随后具体阐述其表现及危害，即分析问题，故文段是提出问题+分析问题的脉络，指出科学媒体在传播时存在问题，故应优选解决问题的对策，对应D项。\nA项和B项均没有提到“媒体”，偏离文段核心，排除。\nC项属于问题表述，与针对性的对策相比，对策更加重要，排除。\n故正确答案为D。\n【文段出处】《史斌｜科学浪潮下的浅滩与暗流》","no":24,"missingImage":false},{"qid":"4651527","cat":"片段阅读","stem":"农村金融需求是否满足，对农村发展的进程有极大影响。全面疏解农村地区信贷供给，是我国推进农业农村优先发展的重要一环。要不断完善金融支农的激励约束机制，加快农村金融回归“三农”本源的进程，促进金融资源向农业农村流动，以打通农村金融供需“梗阻”。持续推进农村金融供给侧结构性改革，增强农村金融服务农村实体经济的能力。同时，大力发展农村普惠金融，鼓励各金融机构为农业农村优先发展提供多层次、广覆盖、低成本、可持续的金融服务。\n这段文字中提取的关键词最恰当的是：","options":{"A":"农村金融 农村发展 金融支农","B":"农村金融 金融机构 金融服务","C":"农村金融 金融资源 农业农村","D":"农村金融 普惠金融 服务农村"},"answer":"A","explanation":"文章开篇指出农村金融需求的满足对农村发展的重要性，并指出其积极意义。后文围绕如何满足农村金融需求促进农村发展的措施展开，一方面要完善激励约束机制，加快农村金融回归“三农”本源的进程，持续推进农村金融供给侧结构性改革；另一方面要大力发展农村普惠金融，两方面措施均属于农村金融促进农村发展的方式，即利用金融支农的方式。故文段重在说明要通过一系列金融支农的方式让农村金融促进农村发展，围绕的核心话题为农村金融、农村发展、金融支农，对应A项。\nB项，“金融机构”与“金融服务”对应“同时”之后的内容，表述片面，排除；\nC项，“金融资源”对应“同时”之前的内容，表述片面，排除；\nD项，“普惠金融”对应“同时”之后的内容，表述片面，排除。\n故正确答案为A。\n【文段出处】《稳步实现农业农村高质量发展》","no":25,"missingImage":false},{"qid":"4651771","cat":"语句表达","stem":"①以“太阳-神鸟-神人-神树”为核心的崇拜，以玉琮、玉牙璋、玉戈、玉璧为核心的玉礼器组合，以及以青铜尊、青铜罍为核心的青铜礼器组合，构成了三星堆文化先民精神信仰的基本内核\n②三星堆祭祀坑中具有神秘色彩的青铜面具，主要是对神人形象的表现\n③这些文化要素，在长江流域和黄河流域都有深厚的根基，它们无论在数量还是在重要性上都更能反映三星堆文化的性质\n④有人根据青铜面具的形象来判断三星堆先民是外星人或欧罗巴人种，则模糊了神话和现实之间的界限\n⑤三星堆的主人不是什么天外来客，也并非西亚的移民\n⑥三星堆的青铜面具与同时期盘龙城遗址、新干大洋洲遗址发现的青铜面具一样，都是极夸张且富于地方特色的神人形象，并且可以在长江中下游的新石器时代文化中找到更早的渊源\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"④⑥②①③⑤","B":"⑥②④①③⑤","C":"⑤①③②④⑥","D":"④②⑥①③⑤"},"answer":"C","explanation":"对比选项，判断首句，④句强调有人根据青铜面具判断三星堆先民的人种，⑤句强调三星堆的主人是何人种，⑥句具体介绍三星堆的青铜面具，均可作为首句，无法排除。\n继续观察，发现②④⑥三句均围绕“青铜面具”的话题展开论述，且②句指出青铜面具是对神人形象的表现，④⑥两句是对神人形象的进一步阐述，故②④⑥三句捆绑且②句在④⑥两句之前，排除A、B、D三项，C项当选。\n故正确答案为C。\n【文段出处】《三星堆青铜面具表现的是外星人么？》","no":26,"missingImage":false},{"qid":"4651504","cat":"语句表达","stem":"互联网新闻业颠覆了新闻媒介和职业记者是公众与消息来源和信息准确可靠性之间权威通道的传统理念。以往优秀的职业记者和强大公信力的媒介机构在获取消息来源、验证信息准确度方面具有得天独厚的资源和优势，这也是职业与非职业新闻业之间的分野所在。然而今天，除了各类消息来源都可以直接面对公众之外，遍布全球、专业高效的互联网用户，也使得信息的交叉验证变得比以往更为便捷。简而言之，媒介机构不再是新闻事件的权威阐释主体，新闻报道的价值和意义                    。\n填入画横线处最恰当的是：","options":{"A":"已然掌握在互联网各类新媒体手中","B":"不再由传统的权威新闻媒体所定义","C":"由互联网用户的广泛参与而消解","D":"经由公众的集体参与而被重塑"},"answer":"D","explanation":"横线出现在文段结尾，且由“简而言之”引导，可知是对前文的总结。文段开篇引出“互联网新闻业”这一话题，接着介绍了以往职业记者和媒介机构是获取消息来源、验证信息准确性的权威通道，随后通过转折词“然而”强调在今天公众可以直接获取各类消息来源，并通过互联网快速验证信息，尾句对前文进行总结，即媒介机构不再是新闻事件的权威阐释主体，公众的参与让新闻报道的价值和意义和以往大不相同，对应D项。\nA项，“互联网各类新媒体”文段并未提及，无中生有，排除；\nB项，未提及前文核心话题“公众”，且填入横线后不如D项表述更加明确，排除；\nC项，“互联网用户”表述片面，且“消解”程度过重，排除。\n故正确答案为D。\n【文段出处】《读&lt;“液态”的新闻业：新传播形态与新闻专业主义再思考&gt;有感》","no":27,"missingImage":false},{"qid":"4651539","cat":"片段阅读","stem":"白噪声是指功率谱密度在整个频率频域内均匀分布的，所有频率具有相同能量密度的噪声。大自然中海浪拍打岩石的声音，风吹过树叶的声音，枝头鸟儿轻轻吟唱的声音以及雨滴落在屋檐上的声音，都是类似于白噪声的声音，现实生活中的噪声嘈杂刺耳，令人厌烦，会影响人们的工作、学习和休息。而白噪声，由于其均匀分布，比较“悦耳”，在白噪声环境中，人们往往能放松心情。\n下列诗句与上文中论及的白噪声带来的心理感受，最接近的是：","options":{"A":"蝉噪林逾静，鸟鸣山更幽","B":"百里雷声震，鸣弦暂辍弹","C":"夜阑卧听风吹雨，铁马冰河入梦来","D":"今夜闻君琵琶语，如听仙乐耳暂明"},"answer":"A","explanation":"文段首先通过下定义的形式引出白噪声，并列举了大自然中类似于白噪声的声音，例如海浪拍打岩石、风吹树叶、鸟儿吟唱等。接着说明现实生活中的噪声会让人烦躁，而白噪声是悦耳的，能让人放松心情，故白噪声给人带来的心理感受是比较放松。A项，“蝉噪林逾静，鸟鸣山更幽”意思是蝉声高唱，树林却显得格外宁静，鸟鸣声声，深山里倒比往常更清幽，可以体现树林的幽静，能让人心情放松，符合文意，当选。\nB项，“百里雷声震，鸣弦暂辍弹”意思是江潮如雷，声震百里，隆隆滚过，暂且停止了弹拨手中的琴，强调江潮如雷声一样响亮，注意力被吸引了，并非是心情上的放松，不符合文意，排除；\nC项，“夜阑卧听风吹雨，铁马冰河入梦来”意思是夜将尽了，我躺在床上听到那风雨的声音，迷迷糊糊地梦见，自己骑着披着铁甲的战马跨过冰封的河流，出征北方疆场，并非是心情上的放松，不符合文意，排除；\nD项，“今夜闻君琵琶语，如听仙乐耳暂明”意思是今晚听到她的琵琶声，好像听到了仙乐，耳朵里只有这个声音，别的都听不到，强调的是注意力被琴声吸引，很专注，并非是心情上的放松，且“琵琶声”也未必是频率能量密度相同的声音，不符合文意，排除。\n故正确答案为A。\n【文段出处】《白噪音，让你睡得更好一点的枕边噪音》","no":28,"missingImage":false},{"qid":"4651735","cat":"片段阅读","stem":"教育与产业毕竟有不同的利益诉求，双方是否能够采取产教融合的共同行动？有学者认为，德国的传统中小企业中存在大量的非研发创新或低技术创新的需求，正是这类创新，而不是大企业的技术研发，确保了德国制造业的长盛不衰。中国的中小企业数量远远多于德国，其技术能力远远落后于大企业，有大量的非研发创新或低技术创新的需求。这正是职业教育可以发挥作用的空间。\n这段文字意在强调：","options":{"A":"职业教育实施产教融合是可能与可行的","B":"中小企业要注重学习德国既有的成功经验","C":"职业教育需要强化服务中小企业的意识","D":"中小企业要关注非研发创新与低技术创新"},"answer":"A","explanation":"文段开篇提出问题，即教育与产业能否采取产教融合的共同行动，并以后文内容进行了回答。先以德国为例，说明德国传统中小企业中的非研发创新或低技术创新的需求保证了制造业的活力，接着对比指出中国中小企业也有大量的非研发创新或低技术创新的需求，尾句通过指代词“这”指代前文，强调职业教育大有可为。故尾句是对首句问题的回答，即职业教育可以采取产教融合的共同行动，对应A项。\nB项，缺少主题词“职业教育”，且“学习德国既有的成功经验”文段未提及，无中生有，排除；\nC项，“强化服务中小企业的意识”文段未提及，无中生有，排除。\nD项，缺少主题词“职业教育”，且“要关注非研发创新与低技术创新”的对策无中生有，排除。\n故正确答案为A。","no":29,"missingImage":false},{"qid":"4651776","cat":"片段阅读","stem":"数字孪生是指物理空间中的对象在虚拟空间中的数字模型，该模型通过传感器随时获取真实物体的数据，并随之一起演变、成熟甚至衰老。利用该模型，人们可以对物理对象进行分析、预测、诊断或者训练，从而优化和决策。这个数字模型就像是真实物体的孪生兄弟，因而得名。小到一颗螺丝钉，大到一座城市，物理世界中的各种事物均可拥有数字孪生模型。数字孪生并不是全新技术，而是建模仿真技术在制造领域的新发展之一。\n下列关于数字孪生的说法与文意不符的是：","options":{"A":"本质是真实物体的数字化模型","B":"是制造领域研发出的最新技术","C":"与物理对象间保持动态的关联","D":"因模型与真实物体的关系得名"},"answer":"B","explanation":"A项，根据“数字孪生是指物理空间中的对象在虚拟空间中的数字模型”可知，表述正确，排除；\nB项，根据“数字孪生并不是全新技术，而是建模仿真技术在制造领域的新发展之一”可知，数字孪生技术并非是最新技术，与文意相悖，且表述绝对，当选；\nC项，根据“该模型通过传感器随时获取真实物体的数据，并随之一起演变、成熟甚至衰老”可知，表述正确，排除；\nD项，根据“这个数字模型就像是真实物体的孪生兄弟，因而得名”可知，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《数字孪生，数字化转型重要内容》","no":30,"missingImage":false},{"qid":"4651521","cat":"片段阅读","stem":"随着学科的不断延伸、细分、侧生和增多，现在全新的独立学科创生越来越少，以至于更多的新学科是由多个已有学科交融孕育而成的。这些新学科被称为交叉学科。研究学科学的人，为了表征新学科的创生规律，就归纳出一些交叉学科的创生模式，并经常用简单直观的集合或几何图交叉加以示意表达。这类表达方式被外行人或寻求简单化的管理者误解和误用，让很多人认为交叉学科就是现有多学科的几何交集，学科交叉的形式是有限的，是可以图示化的，等等。\n下列说法与文意不符的是：","options":{"A":"交叉学科的创生模式并非简单的多学科交集","B":"用几何图交叉表达交叉学科的模式是错误的","C":"交叉学科的形式实际上具有非常多的可能性","D":"当下产生全新的独立学科的可能性越来越小"},"answer":"B","explanation":"A项，根据“归纳出一些交叉学科的创生模式，并经常用简单直观的集合或几何图交叉加以示意表达。这类表达方式被外行人或寻求简单化的管理者误解和误用，让很多人认为交叉学科就是现有多学科的几何交集”可知，交叉学科的创生模式并非简单的多学科交集，符合文意，排除；\nB项，根据“经常用简单直观的集合或几何图交叉加以示意表达。这类表达方式被外行人或寻求简单化的管理者误解和误用”可知，有问题的是“外行人或寻求简单化的管理者误解和误用”，而非几何图交叉表达方式本身，不符合文意，当选；\nC项，根据“这类表达方式被外行人或寻求简单化的管理者误解和误用，让很多人认为交叉学科就是现有多学科的几何交集，学科交叉的形式是有限的，是可以图示化的，等等”可知，学科交叉的形式有限是人们的误解，所以交叉学科的形式具有非常多的可能性，符合文意，排除；\nD项，根据“随着学科的不断延伸、细分、侧生和增多，现在全新的独立学科创生越来越少，以至于更多的新学科是由多个已有学科交融孕育而成的”可知，产生全新的独立学科的可能性越来越小，符合文意，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《从“学科”到“学块”，让学科交叉成真！》","no":31,"missingImage":false},{"qid":"4651764","cat":"片段阅读","stem":"人们对隐私泄露的担忧正在发生变化。相对于前网络时代人们担心自己的私事被不正当披露，现在的担忧更多来自网络用户数据大规模泄露或过度收集事件、大数据交易、地图应用软件对个人位置的精准定位。一方面个人对于某信息的掌控能力不断弱化，由此引发了对于隐私乃至个人自由的担忧；另一方面很难证明某些干预或处理个人信息的行为确实对个人造成了实质性损害，以至于很少有人在浏览网页时会注意服务商的隐私条款。\n这段文字接下来最可能讨论的是：","options":{"A":"网络时代隐私泄露风险增加的原因","B":"个人信息泄露的管理责任与技术漏洞","C":"隐私权保护在网络时代需应对的问题","D":"提升个人信息掌控能力的基本路径"},"answer":"C","explanation":"文段开篇指出人们对隐私泄露的担忧正在发生变化，进而指出现在网络时代的担忧来自于数据大规模泄露或过度收集等，然后通过两方面解释原因，一是个人对某类信息的掌控能力正在减弱，二是侵害个人隐私的行为很难定性。因此，文段接下来应围绕网络时代如何避免个人隐私受到侵害进行论述，对应C项。\nA项，“风险增加的原因”文段已论述过，后文不会再论述，排除；\nB项，“管理责任与技术漏洞”无中生有，无法和文段内容衔接，排除；\nD项，“提升个人信息掌控能力”仅对应原因解释的一方面内容，表述片面，排除。\n故正确答案为C。\n【文段出处】北大法律评论《个人信息权的建构和立体式法律保障——由隐私权保护的范式困境展开》","no":32,"missingImage":false},{"qid":"4651506","cat":"片段阅读","stem":"中国瓷器大规模外销始于唐、五代时期。宋元时期，北方的磁州窑、定窑、耀州窑，南方的越窑、龙泉窑、景德镇窑等名窑产品都有外销。但多数窑口距离海港路途遥远，运输成本以及损耗率居高不下，难成规模。而泉州所管辖的德化、晋江、南安等地区，多山脉丘陵，林木茂密，溪流纵横，瓷土资源丰富，水陆交通畅达，具备制瓷手工业发展的所有必要条件。为满足海外市场对名窑瓷器的巨大需求，宋元时期泉州所辖管的地方开始设窑大量仿烧越窑、龙泉窑的青瓷、景德镇窑的青白瓷，专供外销。\n以下概括文中未涉及的是：","options":{"A":"泉州地区拥有优越的瓷器生产条件","B":"海上运输是宋元瓷器外销的重要通道","C":"泉州地区外销瓷器工艺水平后来居上","D":"南北方生产的瓷器中均有名品外销"},"answer":"C","explanation":"A项，根据“泉州所管辖的德化、晋江、南安等地区······具备制瓷手工业发展的所有必要条件”可知，泉州瓷土资源丰富，具备瓷器生产优势，符合文意，排除；\nB项，根据“多数窑口距离海港路途遥远······难成规模”“而泉州······水陆交通畅达，具备制瓷手工业发展的所有必要条件”可知，海上运输是宋元瓷器外销的重要方式，符合文意，排除；\nC项，文段并未提及泉州地区外销瓷器工艺水平超越其它地区之意，“后来居上”无中生有，当选；\nD项，根据“宋元时期，北方的磁州窑、定窑、耀州窑，南方的越窑、龙泉窑、景德镇窑等名窑产品都有外销”可知，符合文意，排除。\n本题为选非题，故正确答案为C。\n【文段出处】《德化瓷器行销天下》","no":33,"missingImage":false},{"qid":"4651767","cat":"片段阅读","stem":"乡村文化复兴的关键在于外生变量，城市居民是重要的外生变量，满足和激发其对乡村文化的需求至关重要。凸显原生态的乡村自然环境和原生态的乡村人文环境，不仅可以满足城市居民的体验需要以及对乡村的浪漫想象，也有助于乡土文化的传承和保护。在乡村旅游规划中，应尽量减少人工雕琢的痕迹和外来文化的移植，通过营造和保持乡村自然环境、作物植被、聚落形态、乡村建筑、生产方式、风俗习惯，再现乡村优美的田园风光，浓郁的乡土文化，使乡村更像乡村。\n这段文字重在说明：","options":{"A":"乡村旅游体验的真实性需求","B":"城市居民旅游的沉浸式需求","C":"乡村经济发展中应凸显人文性","D":"乡村旅游规划中应重视独特性"},"answer":"A","explanation":"文段首句提出城市居民是乡村文化复兴的关键，满足和激发城市居民对乡村文化的需求至关重要，接着指出原生态的乡村自然环境和人文环境是满足城市居民需求的关键，最后指出在乡村旅游规划中，应减少人工雕琢的痕迹和外来文化的移植，即要保持乡村自然环境和人文环境的原生态，故文段强调乡村原生态对于乡村旅游的重要性，对应A项。\nB项，“沉浸式需求”无中生有，且未提及主题词“乡村旅游”，排除；\nC项，“人文性”表述片面，且未提及主题词“乡村旅游”，排除；\nD项，“独特性”无中生有，文段重在强调乡村旅游的“原生态”，排除。\n故正确答案为A。","no":34,"missingImage":false},{"qid":"4651770","cat":"片段阅读","stem":"村居法律顾问作为农村和城市社区基层法律服务市场的服务主体，过去主要由基层法律工作者担任。基层法律工作者扎根基层服务基层，在基层法律服务领域作出巨大贡献。但随着现代基层社会治理法治化的快速发展和法律服务需求的不断增长变化，基层人民群众对法律服务产品和质量提出了更高的需求，传统的基层法律工作者职业队伍和服务模式都显现出一定的不适应和供给不足，亟待从根本上回应和回归法律服务市场的特殊规律，引入律师和律师团队是一种必然趋势。\n这段文字意在强调：","options":{"A":"应重视基层法律工作者队伍的建设","B":"实现基层治理法治化需要律师参与","C":"村居法律顾问工作必须要与时俱进","D":"基层法律工作者需要提升服务能力"},"answer":"B","explanation":"文段开篇介绍村居法律顾问过去主要由基层法律工作者担任，他们在基层法律服务领域作出了巨大贡献。接着通过转折词“但”提出问题，即随着现代基层社会治理法治化的发展和法律服务需求的变化，传统基层法律工作者职业队伍和服务模式都显现出一定的不适应和供给不足。最后通过“必然趋势”提出对策，即要引入律师和律师团队，对策即为文段重点，对应B项。\nA、D两项，均没有提到“律师”这一核心话题，排除；\nC项，“与时俱进”表述不明确，文段强调的是要引入律师和律师团队，排除。\n故正确答案为B。\n【文段出处】《基层治理法治化需要更多优秀律师参与》","no":35,"missingImage":false},{"qid":"4651772","cat":"逻辑填空","stem":"《共产党宣言》不仅具有巨大的政治和历史价值，这篇光辉之作的“激扬文字”也是无与伦比的。“一个幽灵，共产主义的幽灵，在欧洲大陆徘徊。”哪个政治文件有这样        的开篇？“让统治阶级在共产主义革命面前发抖吧，无产者在这个革命中失去的只是锁链，他们获得的将是整个世界。”如此            的豪言，谁能不为之热血沸腾。\n依次填入画横线处最恰当的一项是：","options":{"A":"深邃 舍我其谁","B":"厚重 气壮山河","C":"抒情 壮怀激烈","D":"诗意 掷地有声"},"answer":"D","explanation":"第一空，横线前“这样”指代前文“一个幽灵，共产主义的幽灵，在欧洲大陆徘徊”，由“幽灵”“徘徊”可知，这个政治文件开篇的用词较有意境，B项“厚重”指又厚又重，丰富而贵重，D项“诗意”指像诗里表达得那样给人以美感的意境，均可体现该政治文件开篇的特点，保留。A项“深邃”指精深远大，这句开篇并未体现出道理的深刻，排除；C项“抒情”指表达情思，抒发情感，这句开篇仅表达共产主义若有似无的出现在欧洲大陆，并未表达出浓烈的情感，排除。\n第二空，搭配“豪言”，且根据后文可知，横线处应表达发言激情有力的意思，B项“气壮山河”形容气势如高山大河般雄壮豪迈，侧重有气势，D项“掷地有声”形容文辞巧妙华美、音韵铿锵有致，现也形容落实力度大，对比来看，D项更能体现落实豪言的坚定，符合文意，当选。\n故正确答案为D。\n【文段出处】《&lt;共产党宣言&gt;的诞生地》","no":36,"missingImage":false},{"qid":"4651736","cat":"逻辑填空","stem":"关于江南的意象，古代诗词中            。这些意象的产生，半是源于江南人对故乡的回望，半是来自异乡人的反观。在这中间，运河作为出入江南的重要通道，成了古典诗词的审美对象，因而有着“唐诗之河”“宋词之河”等        。\n依次填入画横线处最恰当的一项是：","options":{"A":"不计其数 代称","B":"车载斗量 雅号","C":"琳琅满目 别称","D":"俯拾皆是 美誉"},"answer":"D","explanation":"第一空，搭配“意象”，A项“不计其数”指没法计算数目，形容极多，B项“车载斗量”指用车来装，用斗来量，形容数量极多，D项“俯拾皆是”形容数量非常多，极容易得到，均可以体现出诗词中关于江南的意象很多，搭配得当，符合文意，保留。C项“琳琅满目”比喻充满了美好珍贵的事物，常用来形容商品、工艺品，与“意象”搭配不当，排除。\n第二空，搭配“运河”，且根据横线前的“因而”可知，横线处词语与“运河作为出入江南的重要通道，成了古典诗词的审美对象”构成因果关系，应体现运河的重要与美好，表达积极的感情色彩，D项“美誉”指美好的名誉，符合文意，当选。A项“代称”指代替正式名称的另一名称，为中性词，与文段感情色彩不一致，排除；B项“雅号”指高雅的名号，多用于尊称他人的名字，与“运河”搭配不当，排除。\n故正确答案为D。\n【文段出处】《古典诗词中的“下江南”意象》","no":37,"missingImage":false},{"qid":"4651517","cat":"逻辑填空","stem":"广大进城务工人员常常在医疗、社保、子女入学等涉及公共服务均等化的民生保障问题上面临        ，这些都是摆在我们面前的现实问题。城镇化是一个渐进过程，很多问题的解决无法            ，但至少应该在发展的过程中，努力体现解决问题的诚意。\n依次填入画横线处最恰当的一项是：","options":{"A":"挫折 迎刃而解","B":"窘境 一蹴而就","C":"劣势 急功近利","D":"困难 立竿见影"},"answer":"B","explanation":"第一空，搭配“面临”，A项“挫折”、B项“窘境”、D项“困难”均搭配恰当，保留。C项“劣势”一般搭配“处于”“处在”等，与“面临”搭配不当，排除。\n第二空，由“城镇化是一个渐进过程”可知，城镇化是一个长期过程，横线处应体现问题无法短期、快速解决之意。B项“一蹴而就”形容做事轻而易举，一下子就能成功，与文意相符，且该词多用于否定句，当选。A项“迎刃而解”比喻处理事情、解决问题很顺利，体现不出“时间短”的含义，排除；D项“立竿见影”指收效非常迅速，常见搭配如“政策立竿见影”“效果立竿见影”等，强调的是效果好，与文段解决问题的语境不符，且与“问题的解决”搭配不当，排除。\n故正确答案为B。\n【文段出处】《称“农民工”为“建设者”是好开端》（光明网）","no":38,"missingImage":false},{"qid":"4651765","cat":"逻辑填空","stem":"虽然空间站运行在低地球轨道上，与地面的距离不过几百公里，相比于月球、火星等天体与地球的距离，显得“            ”。但是这里已经进入了太空，可以获得微重力环境，也就是我们俗称的“失重”环境。这种在地面上难以长时间获得的特别环境，让空间站成为        的科学实验平台。\n依次填入画横线处最恰当的一项是：","options":{"A":"近在咫尺 理想","B":"唾手可得 稀缺","C":"微不足道 完美","D":"不足挂齿 高端"},"answer":"A","explanation":"第一空，横线处修饰空间站与地面的距离，根据“不过几百公里”可知，应体现距离很近，且根据双引号可知，此处考查形象表达，A项“近在咫尺”形容距离很近，符合文意，且对应“距离”，符合形象表达，保留。B项“唾手可得”形容非常容易得到，C项“微不足道”指非常渺小，不值得一提，D项“不足挂齿”指不值得一提，均与文意不符，排除。\n第二空，代入验证，根据文意可知，横线处应体现太空的环境让空间站适合成为科学实验平台，能够满足失重环境，A项“理想”指符合希望的，使人满意的，符合文意，当选。\n故正确答案为A。\n【文段出处】《中国为什么要建设自己的空间站？因为用处太大了》","no":39,"missingImage":false},{"qid":"4651725","cat":"逻辑填空","stem":"根据相关规定，当事人之间        串通，企图通过诉讼、调解等方式        他人合法权益的，人民法院应当驳回其请求，并根据情节轻重予以罚款、拘留；构成犯罪的，依法追究刑事责任。\n依次填入画横线处最恰当的一项是：","options":{"A":"故意 侵犯","B":"恶意 侵害","C":"有意 侵占","D":"蓄意 侵吞"},"answer":"B","explanation":"本题可从第二空入手，搭配“合法权益”，A项“侵犯”指非法干涉别人，损害其权益，B项“侵害”指用暴力或非法手段损害，均与“合法权益”搭配得当，保留。C项“侵占”指非法占有财产或用武力侵略、占有别国的领土等，D项“侵吞”指用武力吞并或占有别国的领土，或暗中非法占有别人的东西或公共的财物、土地等，均与“合法权益”搭配不当，排除。\n第一空，搭配“串通”，且根据后文可知，此处应体现消极的感情色彩，B项“恶意”指不良的居心或坏的用意，搭配得当且符合文意，当选。A项“故意”指存心或有意识地，为中性词，与文段感情色彩不符，排除。\n故正确答案为B。\n【文段出处】《中华人民共和国民事诉讼法》","no":40,"missingImage":false},{"qid":"4651557","cat":"逻辑填空","stem":"与地震、爆炸不同，任何一场森林大火，最初都是比较        的，速度只有百米或几百米每小时，一旦发展成大火，速度会增加几十倍甚至上百倍，森林大火或特大火灾，依靠人力是很难扑灭的，它的热辐射能力非常强，防火隔离带对它            。当火线强度超过1700千瓦/米时，就超出了人类目前的灭火技术水平，只能依靠降雨、可燃物燃尽、燃至湖海等方式熄灭。因此，对于森林大火而言，            是最有效的办法。\n依次填入画横线处最恰当的一项是：","options":{"A":"微弱 形同虚设 未雨绸缪","B":"缓慢 望洋兴叹 防患未然","C":"可控 鞭长莫及 斩草除根","D":"温和 无能为力 防微杜渐"},"answer":"D","explanation":"第一空，横线处词语表示森林火灾最初的特点，根据后文“速度只有百米或几百米每小时”可知，森林火灾最初发展较慢，A项“微弱”、B项“缓慢”和D项“温和”均符合语境，保留。C项“可控”指事件的发展在我们能够预期和把握的范围内，符合森林火灾初期的特点，保留。\n第二空，由“依靠人力是难扑灭的，它的热辐射能力非常强”可知，横线处成语强调防火隔离带对森林大火或特大火灾不起作用，B项“望洋兴叹”比喻做事力量不够或条件缺乏而感到无可奈何，D项“无能为力”指用不上力量或者力量薄弱，均符合语境，保留。A项“形同虚设”指形式上虽设有，但却起不了作用，如同没有一样，置于此处应表述为“防火隔离带形同虚设”，不能表述为“对······形同虚设”，用法不当，排除；C项“鞭长莫及”比喻相隔太远，力量达不到，文段没有提及空间距离上的远近，排除。\n第三空，“因此”引导因果关系，前文强调森林火灾一旦从小火发展为森林大火或特大火灾，就很难熄灭，所以横线处成语强调在火灾初期就采取措施，D项“防微杜渐”指在不良的事物刚刚露出苗头时，就加以制止和杜绝，不让它发展下去，符合语境，当选。B项“防患未然”指在事故、灾害发生之前做好防范准备，不符合防止森林火灾从小火变为大火或特大火灾的时态，排除。\n故正确答案为D。\n【文段出处】《加强预警 把火苗扑灭在摇篮里》","no":41,"missingImage":false},{"qid":"4651773","cat":"逻辑填空","stem":"现如今，各行各业因品牌效应而带来持续的经济收益十分可观，然而农村电商在建立农业品牌的道路上可谓            。由于受到长久以来分散生产经营的影响，农村电商未能切实体会到农产品品牌效应所能带来的巨大收益，以至于对建立品牌的        不足，缺乏动力。所以，        农村电商主体强化品牌意识至关重要。\n依次填入画横线处最恰当的一项是：","options":{"A":"举步维艰 兴趣 引导","B":"孤军奋战 认识 扶持","C":"一筹莫展 经验 协助","D":"凤毛麟角 信心 敦促"},"answer":"A","explanation":"第一空，“然而”表示转折关系，根据前文“各行各业因品牌效应而带来持续的经济收益十分可观”可知，农村电商在建立农业品牌方面的情况应与之相反，处境艰难。A项“举步维艰”比喻办事情每向前进行一步都十分不容易，C项“一筹莫展”意为一点办法也没有，均符合文意，保留。B项“孤军奋战”比喻单独承担任务或工作，根据文意可知，文段并未强调农村电商缺乏支持，与文意不符，排除；D项“凤毛麟角”比喻难得而宝贵的人或事物，与文意不符，排除。\n第二空，根据前文“农村电商未能切实体会到······收益”和后文“缺乏动力”可知，横线处要体现农村电商对建立品牌的意愿并不强烈。A项“兴趣”意为对事物感觉喜好或关切的情绪，符合文意，保留。C项“经验”意为通过实践得来的知识或技能，强调已有的实践，而非意愿，排除。\n第三空，代入验证，A项“引导”农村电商主体强化品牌意识，搭配恰当且与文意相符，当选。\n故正确答案为A。","no":42,"missingImage":false},{"qid":"4651503","cat":"逻辑填空","stem":"访古是十分感人的经历，尤其是当我们踏上古代文献中            的地点时。亲手触摸庄重威严的利簋，秀丽铭文好像把我们拉回到三千年前牧野之战的场景，             中描绘的古代社会面貌在脑海中清晰了起来，我们感受到了历史迎面扑来的强烈震颤。这种感觉，对于考古学家来说可谓一种致命的“诱惑”。然而，身为一名严谨科学的从业者，必须对这种诱惑保持足够的警惕，维护考古记录的          ，这是一名考古学者的自警，也是整个考古学学科的自尊。\n依次填入画横线处最恰当的一项是：","options":{"A":"如雷贯耳 刀光剑影 客观性","B":"如数家珍 白纸黑字 严肃性","C":"司空见惯 鼓角齐鸣 主体性","D":"耳熟能详 只言片语 独立性"},"answer":"D","explanation":"本题可从第二空入手，根据“古代文献”“秀丽铭文”“描绘”可知，横线处词语应体现出文献文字的特征。D项“只言片语”意为个别的词句，片段的话语，符合文献记录的特征，与文意相符，保留。A项“刀光剑影”形容激烈的厮杀、搏斗或杀气腾腾的气势，C项“鼓角齐鸣”形容军队出击时的雄壮阵势，均属于战斗场景，而非文字文献，排除；B项“白纸黑字”意为白纸上写的黑字，常用以比喻证据确凿，不容怀疑，与文段语境不符，排除。\n第一空，代入验证。D项“耳熟能详”意为听的次数多，熟悉得能详尽地说出来，符合古代文献中经常出现的地名的特点，与文意相符，保留。\n第三空，代入验证。根据“身为一名严谨科学的从业者，必须对这种诱惑保持足够的警惕”可知，考古工作者要尽量避免自己的主观情感影响到客观的考古记录。D项“独立性”指不易受他人的影响，不依附、不隶属，能体现维护考古记录不受主观情感影响之意，当选。\n故正确答案为D。\n【文段出处】《发现与推理：如何做好一个“考古侦探”？》","no":43,"missingImage":false},{"qid":"4651544","cat":"逻辑填空","stem":"以都市圈视角来看，超大城市的城区和郊区应该互相        、互相补充并            ：城区是超大集聚，郊区则应该是中型或小型集聚；城区是尽显        的超级都市，郊区则是各有特色的市镇体系和生态田园；城区是高容积率和高密度的，郊区则是相对低容积率和低密度的。\n依次填入画横线处最恰当的一项是：","options":{"A":"提携 美美与共 气势","B":"呼应 融为一体 实力","C":"错位 相得益彰 魅力","D":"借鉴 珠联璧合 优势"},"answer":"C","explanation":"第一空，横线处形容“城区和郊区”之间的关系，根据横线所在句子后的“：”可知，后文是对横线处的解释说明，根据后文可知，文段表达城区和郊区应采用两种不同的思路发展，C项“错位”指离开原来的或应有的位置，置于此处表达两者错开，位置不同，可体现走不同路线，不同思路之意，与文意相符，保留。A项“提携”比喻在事业上扶植后辈或携手合作，与“城区和郊区”搭配不当，排除；B项“呼应”指彼此关联、照应，D项“借鉴”指把别的人或事当镜子，对照自己，以便吸取经验或教训，均无法体现出“城区和郊区”之间互不相同的关系，与文意不符，排除。\n第二空，代入验证，C项“相得益彰”指相互帮助、互相补充，更能显出好处，置于此处表达城区和郊区两者相互配合，相互补充，更好发展，与文意相符，保留。\n第三空，代入验证，搭配“尽显”，尽显“魅力”指魅力全部显露，搭配恰当且符合文意，C项当选。\n故正确答案为C。\n【文段出处】《谋划“十四五”⑧求解超大城市土地发展难题》","no":44,"missingImage":false},{"qid":"4651777","cat":"逻辑填空","stem":"中亚探险史，罗布泊是一个            的话题。我们所面对的“丝绸之路热”，是对罗布泊探险的接续。在一百多年的时间长河里，她绚丽的颜色一直没有褪去。当人们读到这本书的最后一页时，会为罗布荒原的大地早就面目全非而            ，也会为作家从容穿越于时间壁垒间的气魄            。\n依次填入画横线处最恰当的一项是：","options":{"A":"历久弥新 痛心疾首 自愧弗如","B":"经久不衰 怅然若失 拍案叫绝","C":"讳莫如深 喟然长叹 击节赞叹","D":"众说纷纭 抱恨终天 赞不绝口"},"answer":"B","explanation":"第一空，根据后文“在一百多年的时间长河里，她绚丽的颜色一直没有褪去”可知，横线处体现出罗布泊是一个延续时间很长的话题，A项“历久弥新”指事物经历长久的时间反而更加鲜活，比新的还要好，B项“经久不衰”形容某事或某人经历很长时间仍旧保持旺盛状态，均符合文意，保留。C项“讳莫如深”形容隐瞒得很深，惟恐别人知道，D项“众说纷纭”指各式各样的说法纷乱不一致，均不能体现时间长，与文意不符，排除。\n第二空，横线处表达人们看到罗布荒原的大地“面目全非”时的感受，B项“怅然若失”形容心情沮丧，像丢了什么东西，表达人们心里失落难过，符合文意，保留。A项“痛心疾首”指痛恨、怨恨到极点，程度过重，排除。\n第三空，代入验证，B项“拍案叫绝”形容非常赞赏，表达人们欣赏作家的从容与气魄，符合文意，当选。\n故正确答案为B。\n【文段出处】《两个人的罗布泊》","no":45,"missingImage":false}]}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"4651478","cat":"数学运算","stem":"2.5，2.4，8.9，56.13，560.22，（    ）","options":{"A":"5600.36","B":"6140.35","C":"6720.36","D":"7280.35"},"answer":"D","explanation":"数列各项均为小数，优先考虑机械划分。将原数列整数部分与小数部分分别找规律。整数部分组成的新数列为：2，2，8，56，560，（    ），观察该数列存在明显倍数关系，后一项\u003cimg data-k=\"bbebf78c6993\">前一项后得到：1，4，7，10，（    ），是公差为3的等差数列，则等差数列的下一项为10+3=13，故所求项的整数部分为560×13=7280；小数部分组成的新数列为：5，4，9，13，22，（    ），观察可知：5+4=9，4+9=13，9+13=22，即第一项+第二项=第三项，故所求项的小数部分为13+22=35。综上，原数列所求项为7280.35。\n故正确答案为D。","no":46,"missingImage":false},{"type":"question","qid":"4651476","cat":"数学运算","stem":"7，23，-1，35，-19，（    ）","options":{"A":"62","B":"67","C":"72","D":"77"},"answer":"A","explanation":"数列无明显特征，优先考虑多级数列。后一项-前一项得到新数列：16，-24，36，-54，（    ），观察发现新数列正、负交替，且相邻两项存在明显的倍数关系，新数列后一项\u003cimg data-k=\"bbebf78c6993\">前一项均为-1.5，则新数列下一项为（-54）×（-1.5）=81。故所求项=（-19）+81=62。\n故正确答案为A。","no":47,"missingImage":false},{"type":"question","qid":"4651763","cat":"数学运算","stem":"1，\u003cimg data-k=\"00851e5575b3\">，\u003cimg data-k=\"44eab6845552\">，\u003cimg data-k=\"e9dd34232616\">，\u003cimg data-k=\"6a521bb4e598\">，（    ）","options":{"A":"\u003cimg data-k=\"6891cecb474d\">","B":"\u003cimg data-k=\"edaa3b316d09\">","C":"\u003cimg data-k=\"42ec34100aac\">","D":"\u003cimg data-k=\"a9dbba88f3b7\">"},"answer":"D","explanation":"数列及选项出现多个带根号的数字，转化为根号内找规律。\u003cimg data-k=\"8b79e967ae35\">，\u003cimg data-k=\"00851e5575b3\">，\u003cimg data-k=\"44eab6845552\">，\u003cimg data-k=\"1ba26ebe4a53\">，\u003cimg data-k=\"10bb51ff0a1d\">，根号内形成数列：1，2，6，24，120，有明显的倍数关系，后项除前项可得新数列：2，3，4，5，是公差为1的等差数列，新数列下一项为6，则所求项为\u003cimg data-k=\"30b44208b64d\">。\n故正确答案为D。","no":48,"missingImage":false},{"type":"question","qid":"4651663","cat":"数学运算","stem":"\u003cimg data-k=\"3ca0481893af\">，\u003cimg data-k=\"98974d6b7e14\">，\u003cimg data-k=\"68577046b5ba\">，\u003cimg data-k=\"00d50b9710cc\">，\u003cimg data-k=\"0f1fa1d0536c\">，（    ）","options":{"A":"\u003cimg data-k=\"ec554dc83dee\">","B":"\u003cimg data-k=\"732258bb32ee\">","C":"\u003cimg data-k=\"c268eae6f8ed\">","D":"\u003cimg data-k=\"df8fcfd2ef61\">"},"answer":"B","explanation":"观察数列特征，均为分数，考虑分数数列。观察分子、分母无明显规律，考虑反约分，原数列可转化为：\u003cimg data-k=\"3ca0481893af\">，\u003cimg data-k=\"98974d6b7e14\">，\u003cimg data-k=\"68577046b5ba\">，\u003cimg data-k=\"0b4d7491f2e3\">，\u003cimg data-k=\"8a0498321e9d\">。观察发现，分母：6，12，20，30，42，\u003cspan style=\"color:#rgb(89,89,89)\">作\u003c/span>差后得：6，8，10，12，是公差为2的等差数列，则下一项是14，即所求项的分母为：42+14=56；分子：5，1，11，9，21，无明显规律，考虑分子分母结合看，观察发现，6-5=1，12-1=11，20-11=9，30-9=21，即后一项分子=前一项分母-前一项分子，则所求项的分子为：42-21=21，则所求项应为\u003cimg data-k=\"ba50eeaeacf1\">，对应B项。\n故正确答案为B。","no":49,"missingImage":false},{"type":"question","qid":"4651751","cat":"数学运算","stem":"“双减”政策实施后，某小学下午5：30放学，小李5：00下班去接孩子回家，当不堵车时，5：30之前到校；当堵车时，5：30之前到校的概率为0.6。若5：00—5：30堵车的概率为0.3，则小李5：30之前到校的概率是：","options":{"A":"0.78","B":"0.80","C":"0.88","D":"0.91"},"answer":"C","explanation":"方法一：正面考虑。小李出发后可能有两种情况：堵车或不堵车，已知堵车的概率为0.3，则不堵车的概率为1-0.3=0.7。分情况讨论如下：\n情况一：若出发后堵车，则能在5：30之前到校概率为：0.3×0.6=0.18；\n情况二：若出发后不堵车，则能在5：30之前到校概率为：0.7×1=0.7。\n分类用加法，则小李5：30之前到校概率为0.18+0.7=0.88。\n方法二：反面考虑。小李没能在5：30之前到校的情况只有一种可能，就是出发后堵车。根据题意，此时没在5：30之前到校概率为：0.3×（1-0.6）=0.12；故小李5：30之前到校概率为1-0.12=0.88。\n故正确答案为C。","no":50,"missingImage":false},{"type":"question","qid":"4651689","cat":"数学运算","stem":"如图所示，考古队在B和C两处发现重要遗址，根据对周边环境考察，确定以A和D为顶点划出一个正方形挖掘区域。已知AB、CD都与BC垂直，AB=7米，BC=7米，CD=42米，则这个正方形挖掘区域的边长为：\n\u003cimg data-k=\"4733d0b66441\" style=\"max-width:288px\">","options":{"A":"49米","B":"45米","C":"40米","D":"35米"},"answer":"D","explanation":"B、C两处为重要遗址，因此以A和D为顶点划出的正方形挖掘区域，需要包含B、C两点，才能对遗址进行挖掘。同时由题意可知，AD的长度大于42+7=49米，若AD为正方形的一条边，则所给选项均不满足，故AD只能为正方形的对角线。如下图所示，设正方形挖掘区域的边长AE和DE为x米，过点A作DC的垂线，与DC的延长线相交于点F，则DF=FC+CD=AB+CD=7+42=49米，AF=BC=7米。根据勾股定理，在三角形ADF和三角形ADE中，\u003cimg data-k=\"2bca60a59e5d\">\u003cimg data-k=\"f8ed3a0d5840\">，即\u003cimg data-k=\"33599ec87c0a\">，解得x=35，即这个正方形挖掘区域的边长为35米。\n\u003cimg data-k=\"3bfa71b69c5c\" style=\"max-width:285px\">\n故正确答案为D。","no":51,"missingImage":false},{"type":"question","qid":"4651752","cat":"数学运算","stem":"如图所示，某主题公园将一块正方形的地面按七巧板图案设计，其中平行四边形1个、正方形1个、等腰直角三角形5个，并用油漆将七块区域刷成不同的颜色。若每种颜色的油漆单价相同，平行四边形区域的油漆费用为200元，则整块地面的油漆费用为：\n\u003cimg data-k=\"8e949a3ec75e\" style=\"max-width:332px\">","options":{"A":"1200元","B":"1600元","C":"2000元","D":"2400元"},"answer":"B","explanation":"如下图，根据题意，\u003cimg data-k=\"1b61710a912c\">且为等腰直角三角形，则CO为\u003cimg data-k=\"df31b6b7d11c\">的平分线，即正方形对角线。延长CO至点A，易得\u003cimg data-k=\"10344d4d2c2e\">且为等腰直角三角形，则EG∥BD。由于EFOH为正方形，则EF=OF=AF，可得F点为AO中点，即EG为\u003cimg data-k=\"0083a351bd6e\">中位线。根据三角形中位线结论，OB=2×FG，则OJ=BJ。连接GJ易得\u003cimg data-k=\"7cd18e33ccbd\">。则\u003cimg data-k=\"f640369aeb89\">\u003cimg data-k=\"fad4b410acc4\">。由于油漆费用=油漆单价×刷漆面积，且每种颜色的油漆单价相同，则所求费用=8×200=1600元。\n\u003cimg data-k=\"586bc2263f0e\" style=\"max-width:376px\">\n\n故正确答案为B。","no":52,"missingImage":false},{"type":"question","qid":"4651758","cat":"数学运算","stem":"出版社安排甲、乙、丙三人校对一本书，甲完成总任务的\u003cimg data-k=\"72020bbb1525\">后，剩下的分配给乙和丙。若乙的工作效率是丙的\u003cimg data-k=\"97dceef419de\">，且两人完成工作所用时间相同，则乙的工作量是总任务的：","options":{"A":"\u003cimg data-k=\"732258bb32ee\">","B":"\u003cimg data-k=\"a1236eee7110\">","C":"\u003cimg data-k=\"b28026563097\">","D":"\u003cimg data-k=\"0f1fa1d0536c\">"},"answer":"A","explanation":"方法一：根据“乙的工作效率是丙的\u003cimg data-k=\"97dceef419de\">”，赋值乙的效率为3，丙的效率为4，设两人完成工作所用时间均为t，由“甲完成总任务的\u003cimg data-k=\"72020bbb1525\">后，剩下的分配给乙和丙”，则乙、丙两人一共完成的工作量为：\u003cimg data-k=\"ab7c61b02a97\">，即总任务量=8t，则乙的工作量是总任务量的 \u003cimg data-k=\"77a307654a50\">。\n方法二：根据“乙的工作效率是丙的\u003cimg data-k=\"97dceef419de\">，且两人完成工作所用时间相同”，可知乙、丙两人工作效率比为3：4，工作时间相同，则工作效率与工作量成正比，即乙、丙两人工作量之比为3：4，假设总任务量为8份，甲做\u003cimg data-k=\"72020bbb1525\">，即1份，乙、丙两人共做7份，乙的工作量为\u003cimg data-k=\"33b7d2a436e4\">，所以乙的工作量是总任务的\u003cimg data-k=\"732258bb32ee\">。\n故正确答案为A。","no":53,"missingImage":false},{"type":"question","qid":"4651677","cat":"数学运算","stem":"正方体\u003cimg data-k=\"770c8489243c\">中，E、F分别为棱\u003cimg data-k=\"2f9face6f4fa\">和\u003cimg data-k=\"f0778af906c8\">的中点，则平面\u003cimg data-k=\"42e8e0c45916\">截该正方体所得截面的形状是：","options":{"A":"三角形","B":"四边形","C":"五边形","D":"六边形"},"answer":"B","explanation":"如图所示，设正方体的中心点为O，E、F分别分别为\u003cimg data-k=\"e2b220efe3e0\">、\u003cimg data-k=\"330a1a91e3d3\">的中点，\u003cimg data-k=\"16210dfd629d\">为正方体的体对角线，连接\u003cimg data-k=\"cee809ab9500\">、EB、BF、\u003cimg data-k=\"8b51cca10548\">、\u003cimg data-k=\"16210dfd629d\">、EF，易得此六条线段在同一平面上，则故平面\u003cimg data-k=\"1c5472324a6d\">截该正方体所得截面即为四边形\u003cimg data-k=\"8db0824f8e86\">。\n\u003cimg data-k=\"10d669e70403\" style=\"max-width:367px\">\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"4651762","cat":"数学运算","stem":"某种杀虫剂每桶5公斤，浓度为40%，使用时需将浓度稀释到5%，每亩地喷洒60公斤。若某农户家中有4亩地，则至少需要该杀虫剂：","options":{"A":"3桶","B":"4桶","C":"5桶","D":"6桶"},"answer":"D","explanation":"设需要n桶杀虫剂，根据稀释前后溶质质量相等，可得5n×40%=60×4×5%，解得n=6。\n故正确答案为D。","no":55,"missingImage":false},{"type":"question","qid":"4651469","cat":"数学运算","stem":"某政府机关将甲、乙两个部门合并。合并前，甲、乙两部门的男女人数之比分别为4：1和3：2，男女党员人数之比分别为9：2和9：4，乙部门女党员人数占本部门人数的比重是甲部门的两倍。合并后，若男女人数之比为7：3，则男女党员人数之比为：","options":{"A":"18：5","B":"27：8","C":"3：1","D":"27：10"},"answer":"C","explanation":"根据题意，设甲部门的男女人数分别为4x、x，乙部门的男女人数分别为3y、2y。因合并后，男女人数之比为7：3，可列等式：\u003cimg data-k=\"66224a071561\">，解得：x=y，说明合并前，甲部门总人数为4x+x=5x，乙部门总人数为3y+2y=5y，即甲、乙两部门总人数相等。\n因“乙部门女党员人数占本部门人数的比重是甲部门的两倍”，且甲、乙两部门总人数又相等，可知乙部门女党员人数是甲部门女党员人数的两倍。根据“甲、乙两部门的男女党员人数之比分别为9：2和9：4”，设甲部门女党员人数为2a，则乙部门女党员人数为4a，甲部门男党员人数为9a，乙部门男党员人数为9a，故所求男女党员人数之比为（9a+9a）：（2a+4a）=18a：6a=3：1。\n故正确答案为C。","no":56,"missingImage":false},{"type":"question","qid":"4651473","cat":"数学运算","stem":"已知A、B两地相距9公里，甲、乙两人匀速从A地前往B地。甲每小时走6公里，每走半小时休息15分钟；乙比甲早15分钟出发，中间不休息。若他们在途中（不含起点和终点）相遇了2次，则乙从A地到B地所用的时间至少为：","options":{"A":"75分钟","B":"120分钟","C":"135分钟","D":"150分钟"},"answer":"C","explanation":"根据题意，因为乙比甲先出发15分钟，所以第一次相遇是甲追上乙。要使得乙从A地到B地所用的时间尽可能少，则乙的速度应尽可能大，即甲第一次追上乙花费的时间应尽可能多。因此当甲行驶30分钟后才追上乙时，乙的速度最大，此时甲、乙路程相等。可得方程：\u003cimg data-k=\"d9fca24b8a1b\">，解得\u003cimg data-k=\"cd76f2d4f709\">公里/小时，则乙从A地到B地所用的时间至少为\u003cimg data-k=\"79e81005aec0\">小时=135分钟。\n备注：下图为甲、乙两人全程的路程与时间的函数图像，第一次相遇在45分钟，此时甲追上乙，然后甲休息，乙继续走。第二次相遇在90分钟，此时甲第二次追上乙，然后甲休息，乙继续走。第三次相遇在135分钟，此时两人同时到达B点，满足题干所说途中（不含起点和终点）相遇了2次。\n\u003cimg data-k=\"d96e3a9457fb\" style=\"max-width:483px\">\n故正确答案为C。","no":57,"missingImage":false},{"type":"question","qid":"4651461","cat":"数学运算","stem":"某学者认为，人类的体力、情绪、智力自出生日起分别以22天、28天、33天为周期开始往复循环变化，前半个周期是“高潮期”，后半个周期是“低潮期”。根据该学者的观点，我们过公历生日时，体力、情绪和智力同时处于“高潮期”的最小年龄是：","options":{"A":"4周岁","B":"3周岁","C":"2周岁","D":"1周岁"},"answer":"C","explanation":"根据题意利用代入排除法，问最小年龄，从小到大进行代入。代入D项若最小年龄为1周岁，即365天，体力处于\u003cimg data-k=\"e845fcf56723\">个周期⋯⋯13天，22天前半个周期11天是“高潮期”，13天不满足题意，排除D项；代入C项若最小年龄为2周岁，即365×2=730天，体力处于\u003cimg data-k=\"b7177be2717a\">个周期⋯⋯4天，情绪处于\u003cimg data-k=\"17ec6d334878\">个周期······2天，智力处于\u003cimg data-k=\"9dfa7213784c\">个周期······4天，均处于以22天、28天、33天为周期的前半个周期“高潮期”，满足题意。\n备注：即使在2周岁时经历了闰年366天，所有余数均加一，仍然均处于前半个周期“高潮期”。\n故正确答案为C。","no":58,"missingImage":false},{"type":"question","qid":"4651668","cat":"数学运算","stem":"某疫苗接种点市民正在有序排队等候接种。假设之后每小时新增前来接种疫苗的市民人数相同，且每个接种台的效率相同，经测算：若开8个接种台，6小时后不再有人排队；若开12个接种台，3小时后不再有人排队。如果每小时新增的市民人数比假设的多25%，那么为保证2小时后不再有人排队，需开接种台的数量至少为：","options":{"A":"14个","B":"15个","C":"16个","D":"17个"},"answer":"D","explanation":"设原来排队市民总数为Y人，假设每小时新增的市民人数为X人，接种台数量为N个，由牛吃草公式Y=（N-X）×T有：Y=（8-X）×6=（12-X）×3，解得：X=4，Y=24；根据“每小时新增的市民人数比假设的多25%”可得，现在每小时新增的市民人数为：4×（1+25%）=5。同样代入牛吃草公式有：24=（N-5）×2，解得：N=17。\n故正确答案为D。","no":59,"missingImage":false},{"type":"question","qid":"4651454","cat":"数学运算","stem":"某市民中心广场钟楼上东、西、南、北四面各有一个挂钟，则每日早8点至晚8点，任意相邻两个钟的时针互相垂直的次数是：","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"A","explanation":"如下图，设相邻两个挂钟所在平面为A、B，则A、B两个平面相互垂直。根据几何结论：若一条线段与一个平面垂直，则该线段垂直于平面上所有线段。因此需要平面B内挂钟的时针在水平方向，此时与相邻的平面A垂直即与平面A内挂钟的时针垂直。如下图所示：只有在早上9点（实线所示）、下午3点（虚线所示）这两次，平面B内挂钟的时针与平面A垂直，即A、B两个面上挂钟时针相互垂直。\n\u003cimg data-k=\"a3432aa3d3ed\" style=\"max-width:217px\">\n故正确答案为A。","no":60,"missingImage":false},{"type":"question","qid":"4651460","cat":"数学运算","stem":"某企业举行职业技能大赛，3个下属分公司均选2名员工参赛。若同一分公司的员工比赛时出场顺序不能相邻，则参赛的6名员工不同的出场顺序共有：","options":{"A":"80种","B":"120种","C":"160种","D":"240种"},"answer":"D","explanation":"位置1，从6名员工中选1名员工，有\u003cimg data-k=\"9fddcbc1010b\">种排法；\n\n位置2，从另外两个公司的4名员工中选1名员工，有\u003cimg data-k=\"cca5db73b54a\">种排法；\n后续情况较复杂，考虑枚举法，设三个公司分别为A、B、C，6名员工分别为\u003cimg data-k=\"55e3564ec1a3\">，\u003cimg data-k=\"a4a51164f42d\">，\u003cimg data-k=\"c882627b1e41\">，\u003cimg data-k=\"e43fb6b52c3f\">，\u003cimg data-k=\"049451f60094\">，\u003cimg data-k=\"438cfd65ab46\">，假设位置1安排\u003cimg data-k=\"55e3564ec1a3\">出场，位置2安排\u003cimg data-k=\"c882627b1e41\">出场，将出场顺序情况梳理如下：\n\u003cimg data-k=\"22258999befd\" style=\"max-width:525px\">\n此时后续符合条件的情况有10种，因此总情况为6×4×10=240种不同的出场顺序。\n故正确答案为D。","no":61,"missingImage":false},{"type":"question","qid":"4651667","cat":"数学运算","stem":"甲、乙两人对100个家庭进行电话调查。若甲、乙完成对1个家庭的调查需要的时间分别是12分钟和20分钟，则他们完成这次电话调查需要的时间至少是：","options":{"A":"12小时28分钟","B":"12小时32分钟","C":"12小时36分钟","D":"12小时40分钟"},"answer":"C","explanation":"方法一：甲、乙完成对1个家庭的调查需要的时间分别是12分钟和20分钟，因此每小时（60分钟）甲调查5个家庭，乙调查3个家庭，合计调查5+3=8个家庭。\u003cimg data-k=\"b5a2aed14eae\">小时······4个家庭，剩余4个家庭由甲调查3个，乙调查1个，用时是最少的，需要36分钟。因此两人合计用时最少为12小时36分钟，对应C项。\n方法二：由于选项都是12小时多，且问“至少”，故可利用代入排除法。12小时调查数量为：甲\u003cimg data-k=\"1f468e513393\">个家庭，乙\u003cimg data-k=\"3e461dd5b7ac\">个家庭，合计60+36=96个家庭，还剩4个家庭未调查。问题问“至少”，从最小的开始代入。\nA项：28分钟，甲可调查2个家庭，乙可调查1个家庭，合计2+1=3个，不足4个，排除；\nB项：32分钟，甲可调查2个家庭，乙可调查1个家庭，合计2+1=3个，不足4个，排除；\nC项：36分钟，甲可调查3个家庭，乙可调查1个家庭，合计3+1=4个，当选。\n故正确答案为C。","no":62,"missingImage":false},{"type":"question","qid":"4651682","cat":"数学运算","stem":"某金融机构向9家“专精特新”企业共发放了4500万元贷款，若这9家企业获得的贷款额从少到多排列，恰好为一个等差数列，且排第3的企业获得420万元贷款，排第8的企业获得的贷款额为：","options":{"A":"620万元","B":"660万元","C":"720万元","D":"760万元"},"answer":"A","explanation":"由题干可知：9家企业共发放4500万元且贷款额从少到多排列，恰好为一个等差数列。根据等差数列求和公式：\u003cimg data-k=\"bf0656016282\">，可知排名第5的企业（中位数）获得=4500÷9=500万元。又已知排名第3的企业获得420万元，则根据等差数列的通项公式：\u003cimg data-k=\"3fa01e6c705b\">\u003cimg data-k=\"1e2694dbe37c\">可知，等差数列的公差为：\u003cimg data-k=\"95a600fd92d1\">万元，排名第8的企业获得\u003cimg data-k=\"d94c1e73cf49\">\u003cimg data-k=\"f344ea25d7ef\">万元。\n故正确答案为A。","no":63,"missingImage":false},{"type":"question","qid":"4651459","cat":"数学运算","stem":"如图所示，小王买了一块直三棱柱形状 \">庚；\n（4）戊\u003cimg data-k=\"2dfb7d1f72f3\">丁；\n（5）己/庚。\n第二步：逐一验证选项。\n提问方式问可能，优先考虑代入法。\n代入A项，不满足条件（5）己和庚有且只有一个入选，不符合题干条件，排除；\n代入B项，符合题干条件，当选；\n代入C项，结合条件（2）可知，丙入选了，则乙不能入选，又结合条件（1）可知，甲一定入选，与选项矛盾，排除；\n代入D项，结合条件（2）可知，乙入选了，则丙不能入选，与选项矛盾，排除。\n故正确答案为B。","no":65,"missingImage":false},{"qid":"4651759","cat":"类比推理","stem":"如果张研究员选择了乙，再得知以下哪个村入选就可以确定4个要调研的村？","options":{"A":"甲","B":"丁","C":"己","D":"庚"},"answer":"A","explanation":"第一步：分析题干条件。\n（1）\u003cimg data-k=\"e752a8ae1a16\">甲\u003cimg data-k=\"2dfb7d1f72f3\">乙；\n（2）丙\u003cimg data-k=\"a3a13b026980\">乙；\n（3）丁\u003cimg data-k=\"a3a13b026980\">庚；\n（4）戊\u003cimg data-k=\"2dfb7d1f72f3\">丁；\n（5）己/庚。\n第二步：根据题干条件分析选项。\n张研究员选择了乙，根据条件（2）可知，丙不入选。题干所给条件较多，问法为“再得知以下哪个村入选就可以确定4个要调研的村”，可以采用代入法。\n代入A项：如果甲入选，此时能够确定的是甲和乙入选，丙不入选。一共有4个村子入选，此时需要在丁、戊、己、庚中选两个。根据条件（5）可知己、庚中只能选一个，那么丁和戊中也只能选一个。如果选戊，根据条件（4）可知一定要选丁，与丁、戊只能选一个矛盾，所以选丁不选戊；根据条件（3）可知若选庚，那么就不能选丁，与之前的结论矛盾，因此只能选己。那么能够确定被选的4个村子分别是甲、乙、丁、己，当选；\n代入B项：丁入选，根据条件（3）可知庚不入选，根据条件（5）可知己入选，但是甲、戊之中选哪个村子并不能确定，排除；\n代入C项：己入选，根据条件（5）可知庚不入选，但是甲、丁、戊之中选哪两个村子并不能确定，排除；\n代入D项：庚入选，根据条件（3）可知丁不入选，根据条件（4）得出戊不入选，同时根据条件（5）可知己不入选。最终不入选的有4个村子，分别是丙、丁、戊、己，只能有3个村子入选，与题干要求不符，排除。\n故正确答案为A。","no":66,"missingImage":false},{"qid":"4651786","cat":"类比推理","stem":"义务教育：基础教育","options":{"A":"农业技术：灌溉技术","B":"机械故障：突发故障","C":"债券市场：金融市场","D":"防空演习：军事演习"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n义务教育是一种基础教育，二者为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：灌溉技术是一种农业技术，二者为种属关系，但词语的顺序与题干相反，与题干逻辑关系不一致，排除；\nB项：有的机械故障是突发故障，有的机械故障不是突发故障，有的突发故障是机械故障，有的突发故障不是机械故障，二者为交叉关系，与题干逻辑关系不一致，排除；\nC项：债券市场是一种金融市场，二者为种属关系，与题干逻辑关系一致，当选；\nD项：防空演习是为增强人民群众的防空袭意识和自救互救能力，提高城市人民防空袭的整体防护能力而进行的一种防空袭训练活动，军事演习是部队在完成理论学习和基础训练之后实施的近似实战的综合性训练，二者不是种属关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":67,"missingImage":false},{"qid":"4651868","cat":"类比推理","stem":"汛情：防汛","options":{"A":"疫情：免疫","B":"案情：破案","C":"恋情：失恋","D":"亲情：相亲"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n汛情指汛期水位涨落的情况，防汛指在江河涨水的时期采取措施，防止泛滥成灾，依据汛情防汛，二者是依据对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：疫情指疫病的发生和发展情况，免疫指由于具有抵抗力而不患某种传染病，二者不是依据对应关系，与题干逻辑关系不一致，排除；\n\nB项：案情指案件的情节，依据案情破案，二者是依据对应关系，与题干逻辑关系一致，当选；\n\nC项：先有恋情后失恋，二者不是依据对应关系，与题干逻辑关系不一致，排除；\n\nD项：亲情指亲人的情义，不是依据亲情相亲，二者不是依据对应关系，与题干逻辑关系不一致，排除。\n\n故正确答案为B。","no":68,"missingImage":false},{"qid":"4651548","cat":"类比推理","stem":"神奇：鬼斧神工","options":{"A":"善良：大慈大悲","B":"强大：不可一世","C":"寒冷：冰天雪地","D":"混乱：乱七八糟"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n鬼斧神工原意是像鬼神制作出来的，形容艺术技巧高超，不像是人力所能达到的，与神奇构成近义关系。鬼斧神工用夸张的修辞来表示非常神奇，程度加深。\n第二步：判断选项词语间逻辑关系。\nA项：大慈大悲形容人心肠慈悲，乐善好施，与善良构成近义关系。但大慈大悲没有用夸张的修辞手法，与题干逻辑关系不一致，排除；\nB项：不可一世形容人自命不凡，狂妄自大到了极点。与强大没有关系，与题干逻辑关系不一致，排除；\nC项：冰天雪地指寒冷的地方，也形容天气非常寒冷，与寒冷构成近义关系。冰天雪地用夸张的修辞来表示非常寒冷，程度加深，与题干逻辑关系一致，当选；\nD项：乱七八糟形容毫无条理和秩序，乱的不成样子，与混乱构成近义关系。但乱七八糟没有用夸张的修辞手法，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":69,"missingImage":false},{"qid":"4651699","cat":"类比推理","stem":"新教师：老教师","options":{"A":"计划：总结","B":"序言：结尾","C":"草稿：定稿","D":"初赛：决赛"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n新教师是教师，老教师是教师，二者为并列关系，且由新教师变成老教师，存在内在的转变。\n第二步：判断选项词语间逻辑关系。\nA项：计划是工作前的提纲，总结是工作后的评价，故二者不是并列关系，与题干逻辑关系不一致，排除；\nB项：书籍或文章的开头叫“序言”，与结尾不构成并列关系，与题干逻辑关系不一致，排除；\nC项：草稿指在进行文学创作前提前整理的文本内容，定稿指创作内容全部确定的最后完成稿，二者为并列关系，且由草稿变成定稿，存在内在的转变，与题干逻辑关系一致，当选；\nD项：初赛和决赛为并列关系，但不是由初赛变为决赛，二者不存在内在的转变，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":70,"missingImage":false},{"qid":"4651800","cat":"类比推理","stem":"专项训练：短期训练：综合训练","options":{"A":"生产实践：社会实践：科学实践","B":"五年规划：中期规划：长期规划","C":"抵押贷款：低息贷款：信用贷款","D":"体能测试：视力测试：心理测试"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“专项训练”指针对某一个项目的训练，“短期训练”指持续时间较短的训练，“综合训练”指将两种或两种以上的项目结合起来进行的训练。故“专项训练”与“综合训练”为并列关系，同时二者均与“短期训练”为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：实践包括三个方面的基本内容：“生产实践”、“社会实践”与“科学实践”，故三者为并列关系，与题干逻辑关系不一致，排除；\nB项：“中期规划”与“长期规划”为并列关系，与题干逻辑关系不一致，排除；\nC项：“抵押贷款”指要求借款方提供一定抵押品为担保的贷款，“低息贷款”指低于一般银行贷款利率的贷款，“信用贷款”指以借款人的信誉发放的贷款，借款人不需要提供担保。故“抵押贷款”与“信用贷款”为并列关系，同时二者均与“低息贷款”为交叉关系，与题干逻辑关系一致，当选；\nD项：“体能测试”、“视力测试”与“心理测试”是针对人类三个不同的方面进行的测试，故三者为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":71,"missingImage":false},{"qid":"4651538","cat":"类比推理","stem":"论辩：辩护：共识","options":{"A":"贸易：签约：利益","B":"就读：休学：考试","C":"调研：座谈：问卷","D":"看病：诊脉：理疗"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n“论辩”和“辩护”的目的都是为了达成“共识”，二者为目的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：“贸易”和“签约”的目的都是为了获得“利益”，二者为目的对应关系，与题干逻辑关系一致，当选；\nB项：“休学”的目的不是为了“考试”，与题干逻辑关系不一致，排除；\nC项：“调研”和“座谈”的目的不是为了“问卷”，与题干逻辑关系不一致，排除；\nD项：“理疗”的意思是用物理疗法治疗，“看病”的目的是为了康复，并不是为了“理疗”，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":72,"missingImage":false},{"qid":"4651700","cat":"类比推理","stem":"地砖：方砖：长条砖","options":{"A":"菜肴：荤菜：白菜","B":"零食：素食：热食","C":"青茄：紫茄：番茄","D":"木船：客船：货船"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“方砖”和“长条砖”是两种不同形状的砖，二者为并列关系，同时均与“地砖”为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：荤菜指的是所有含有动物性成分的菜，荤菜是菜肴的一种，二者是种属关系，与题干逻辑关系不一致，排除；\nB项：零食、素食、热食两两之间是交叉关系，与题干逻辑关系不一致，排除；\nC项：青茄、紫茄、番茄为三种蔬菜，三者为并列关系，与题干逻辑关系不一致，排除；\nD项：“客船”和“货船”是两种不同功能的船，二者为并列关系，同时均与“木船”为交叉关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":73,"missingImage":false},{"qid":"4651550","cat":"类比推理","stem":"东北亚 之于 （    ） 相当于 （    ） 之于 树冠","options":{"A":"韩国；树墩","B":"南亚；树根","C":"东半球；树洞","D":"日本海；树荫"},"answer":"B","explanation":"逐一代入选项。\nA项：韩国是东北亚的一部分，二者是组成关系，树墩与树冠都是树木的组成部分，二者为并列关系，前后逻辑关系不一致，排除；\nB项：东北亚和南亚是不同的地理区域，二者是并列关系，树根和树冠都是树木的组成部分，二者为并列关系，前后逻辑关系一致，当选；\nC项：东北亚是东半球的一部分，二者是组成关系，树洞和树冠都是树木的组成部分，二者为并列关系，前后逻辑关系不一致，排除；\nD项：日本海是东北亚的一部分，二者为组成关系，树荫是指树下日光照不到的地方，树冠经阳光照射后能形成树荫，二者为对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":74,"missingImage":false},{"qid":"4651784","cat":"类比推理","stem":"直升机 之于 蜻蜓 相当于 （     ） 之于 （     ）","options":{"A":"雷达；蝙蝠","B":"月亮；萤火虫","C":"狮子；家猫","D":"列车；蜈蚣"},"answer":"A","explanation":"逐一代入选项。\nA项：“直升机”是模仿“蜻蜓”的尾部在飞行中能够保持平衡的原理发明的，二者是仿生学的对应关系；“雷达”是模仿“蝙蝠”在夜间安全飞行的原理发明的，二者是仿生学的对应关系，前后逻辑关系一致，当选；\nB项：“直升机”是模仿“蜻蜓”的尾部在飞行中能够保持平衡的原理发明的，二者是仿生学的对应关系；“月亮”与“萤火虫”无明显的逻辑关系，前后逻辑关系不一致，排除；\nC项：“直升机”是模仿“蜻蜓”的尾部在飞行中能够保持平衡的原理发明的，二者是仿生学的对应关系；“狮子”和“家猫”是两种不同的动物，二者是并列关系，前后逻辑关系不一致，排除；\nD项：“直升机”是模仿“蜻蜓”的尾部在飞行中能够保持平衡的原理发明的，二者是仿生学的对应关系；“列车”与“蜈蚣”无明显的逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为A。","no":75,"missingImage":false},{"qid":"4651535","cat":"类比推理","stem":"良禽择木而栖 之于 贤臣择主而事 相当于 （    ） 之于 （    ）","options":{"A":"关关雎鸠在河之洲；窈窕淑女君子好逑","B":"树欲静而风不止；子欲养而亲不待","C":"天有不测风云；人有旦夕祸福","D":"士为知己者死；女为悦己者容"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“良禽择木而栖”指的是好的鸟要选择树木栖息；“贤臣择主而事”指的是贤明的臣子要选择君主侍奉，第一句话用自然界的现象引出第二句话中的道理，二者为引申义对应。\n第二步：判断选项词语间逻辑关系。\nA项：“关关雎鸠在河之洲”指的是关关和鸣的雎鸠，相伴在河中的小洲；“窈窕淑女君子好逑”指的是美丽贤淑的女子，是君子的好配偶，二者不是引申义对应，与题干逻辑关系不一致，排除；\nB项：“树欲静而风不止”指的是树希望静止不摆，风却不停息；“子欲养而亲不待”指的是子女想赡养父母，父母却已离去了，二者是两件不相关的事，与题干逻辑关系不一致，排除；\nC项：“天有不测风云”指的是自然界的变化难以预测；“人有旦夕祸福”指的是人一生的问题难以预测，均比喻有些灾祸的发生，事先是无法预料的，第一句话用自然界的现象引出了第二句中的人的旦夕祸福，二者为引申义对应，与题干逻辑关系一致，当选；\n\nD项：“士为知己者死”指的是志士愿意为赏识自己、了解自己的人献身；“女为悦己者容”指的是女人愿意为欣赏自己、喜欢自己的人而打扮，两句话均描述的是人，不是引申义对应，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":76,"missingImage":false},{"qid":"4651811","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"d8afa3f59cac\" style=\"max-width:582px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"题干每幅图形均由一个正方形和内部线条组成，元素组成相同，优先考虑位置规律。观察发现，三角形的位置依次上下移动，故？处应选择一个三角形位置在上方的图形，排除B项；题干图形内部线数量均为9，排除C项；继续观察发现，题干图形内部线条在正方形四条边上均出现，而D项内部线条只在正方形三条边上出现，排除D项。\n故正确答案为A。","no":77,"missingImage":false},{"qid":"4651788","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"dc806aaf075c\" style=\"max-width:589px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成相同，优先考虑位置规律。观察发现，题干图形中的两个黑球每次分别顺时针移动3格，如下图所示：\n\u003cimg data-k=\"ebccc14e84b4\" style=\"max-width:585px\">\n故正确答案为A。","no":78,"missingImage":false},{"qid":"4651586","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"c28adf3af169\" style=\"max-width:520px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，优先考虑属性规律。观察发现，题干图形出现箭头、等腰元素图形，考虑对称性。题干每幅图都由两个单对称轴图形组成，因此分别画出每个图形的对称轴，发现每幅图的两条对称轴之间都是垂直关系，只有A项符合。\n\u003cimg data-k=\"b191be9b052d\" style=\"max-width:552px\">\n故正确答案为A。","no":79,"missingImage":false},{"qid":"4651817","cat":"图形推理","stem":"请从所给的四个选项中，选出最恰当的一项填入问号处，使之呈现一定的规律性。\n\u003cimg data-k=\"2a7b9ab79c82\" style=\"max-width:595px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"图形元素组成不同，优先考虑属性规律。观察发现，题干图形都是由曲线和直线共同构成，排除A、B两项；继续观察发现，题干图形封闭面明显，考虑数面。题干图形面数量都为4
