nation":"本题考查平面拼合。消去凹凸匹配的线条后进行组合可得到轮廓图，即为C项。具体拼合方式如下图所示：\n\u003cimg data-k=\"a88e6d2a1f99\" style=\"max-width:605px\">\n故正确答案为C。","no":85,"missingImage":false},{"qid":"4651797","cat":"类比推理","stem":"上边四张纸片，每张纸片一面是黑色，另一面是白色，下边仅有一项能由其拼合（可以平移、旋转、翻转）而成，请把它找出来。\n\u003cimg data-k=\"2b5067a8ac79\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"本题考查平面拼合，可采用平行且等长相消的方式解题。将图①和图④翻转后，消去平行且等长的线段后进行组合可得到轮廓图，即为D项。平行且等长相消的方式如下图所示：\n\u003cimg data-k=\"7835381b743c\" style=\"max-width:163px\">\n故正确答案为D。","no":86,"missingImage":false},{"qid":"4651714","cat":"类比推理","stem":"上边四张纸片，每张纸片一面是黑色，另一面是白色，下边仅有一项能由其拼合（可以平移、旋转、翻转）而成，请把它找出来。\n\u003cimg data-k=\"4719ed595421\" style=\"max-width:619px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"本题考查平面拼合，题干已知每张纸片一面是黑色，另一面是白色，且可以涉及转动，故可知，平移和旋转时纸片颜色不会改变，翻转时颜色会发生改变。经过拼合后只能得到C项。如下图所示：\n\u003cimg data-k=\"27dd273ffc99\" style=\"max-width:138px\">\n故正确答案为C。","no":87,"missingImage":false},{"qid":"4651717","cat":"图形推理","stem":"左边给定的是多面体的外表面，右边哪一项能由它折叠而成？\n\u003cimg data-k=\"d290c5a08f51\" style=\"max-width:639px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"将题干展开图标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"4f5413a5c065\" style=\"max-width:663px\">\nA项：选项由面b和面c构成，选项与题干展开图一致，当选；\nB项：选项由面b和面c构成，以面c中空白顶点为起点进行画边（如上图蓝线所示），展开图中边1对应面b，选项中边3对应面b，选项与题干展开图不一致，排除；\nC项：选项由面a和面c构成，展开图中，二者的公共边与面a内部阴影小三角形的顶点重合，选项中不重合（如下图绿线所示），选项与题干展开图不一致，排除；\n\u003cimg data-k=\"e6254860028d\" style=\"max-width:657px\">\nD项：选项由面b和面d构成，展开图中，二者的公共边与面d内部三角形的边重合，选项中不重合（如下图红线所示），选项与题干展开图不一致，排除。\n\u003cimg data-k=\"edfb6c68d7ff\" style=\"max-width:652px\">\n故正确答案为A。","no":88,"missingImage":false},{"qid":"4651742","cat":"图形推理","stem":"左边给定的是纸盒外表面的展开图，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"a0d3b17a9d46\" style=\"max-width:609px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"将原展开图标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"468e1d031e34\" style=\"max-width:605px\">\nA项：选项由面e和面g构成，展开图中面e与面g的公共边挨着面g的空白面，而选项中面e与面g的公共边半边挨着面g的灰色面，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"772882924d3a\" style=\"max-width:604px\">\nB项：选项由面g和面h构成，展开图中面g和面h的公共边挨着面g的灰色面，而选项中面g和面h的公共边挨着面g的空白面，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"1bdc2e012b22\" style=\"max-width:601px\">\nC项：选项由面e和面h构成，选项与题干展开图一致，当选；\n\u003cimg data-k=\"dbe546a1760c\" style=\"max-width:607px\">\nD项：选项由面e和面f构成，以面e的灰色顶点（蓝点）为起点顺时针画边，展开图中边2与面f中的长线相交于点1（边2与边3的交点），而选项中边2与面f中的长线不相交于点1（边2与边3的交点），选项与题干展开图不一致，排除。\n\u003cimg data-k=\"943c3147c810\" style=\"max-width:605px\">\n故正确答案为C。","no":89,"missingImage":false},{"qid":"4651722","cat":"图形推理","stem":"左边给定的是多面体的外表面，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"b1e6c7f6c3c5\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"将原展开图标上序号，如下图所示，逐一进行分析。\n\u003cimg data-k=\"046f52469af5\" style=\"max-width:600px\">\nA项：选项中出现了面a和面e，面a中黑点所在矩形的长边（如下图线1所示）与面e相邻，而展开图中该矩形的长边与面b相邻，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"89a9e15275a7\" style=\"max-width:600px\">\nB项：选项中出现了面c、面f，面f中白圆所在矩形的长边（如下图线2所示）与面c相邻，而展开图中该矩形的长边与面e相邻，选项与题干展开图不一致，排除；\n\u003cimg data-k=\"d94923cb4fff\" style=\"max-width:600px\">\nC项：选项中出现了面c、面d和面f，选项与题干展开图一致，当选；\nD项：选项中出现了面a、面e，顶面为面b或面d，面e挨着顶面的空白三角形（如下图线3所示），但展开图中面e挨着面b或面d内的阴影三角形，选项与题干展开图不一致，排除。\n\u003cimg data-k=\"062a0612906a\" style=\"max-width:600px\">\n故正确答案为C。","no":90,"missingImage":false},{"qid":"4651814","cat":"图形推理","stem":"左边给定的是多面体的外表面，右边哪一项能由它折叠而成？请把它找出来。\n\u003cimg data-k=\"1a7aae390bcc\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"将原展开图标上序号如下图，逐一进行分析。\n\u003cimg data-k=\"341d2d18120f\" style=\"max-width:600px\">\nA项：选项中出现了面f、面a和面e，选项与题干展开图一致，当选；\nB项：选项中包括面d、面c和面f，选项中面d与面f有公共边边1且面f内部的两条直线挨着面d内部的空白矩形，而展开图中f内部的两条直线挨着面d内部的小三角形，选项与题干不一致，排除；\nC项：选项中包括面e、面a和面b，选项中面e内部的直角梯形短直角边挨着面a，而展开图中面e内部的直角梯形短直角边挨着面f，选项与题干不一致，排除；\nD项：选项中包括面c、面f和面b，选项中面c内部的三角形底边挨着面f，而展开图中面c内部的三角形底边挨着面b，选项与题干不一致，排除。\n故正确答案为A。","no":91,"missingImage":false},{"qid":"4651543","cat":"逻辑判断","stem":"在广袤的中华大地上，最近几十年已经新植了数以十亿计的树木，绿色植被的增长有目共睹，沙漠化和水土流失情况得到了极大缓解。据此，有专家指出，中国已经是全球变绿的最重要的力量之一。\n以下哪项如果为真，最能支持上述专家的观点？","options":{"A":"中国西南地区和东北地区的快速造林大大减少了我国对进口木材的依赖","B":"卫星数据对比显示，中国大量过去荒漠化的地方现在已经被绿色植被所覆盖","C":"中国的植被面积仅占全球的6.6%，但全球植被面积净增长的25%来自中国","D":"在有些国家和地区，毁林开荒正在导致具有全球气候调节功能的雨林面积大大减少"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：中国已经是全球变绿的最重要的力量之一。\n论据：在广袤的中华大地上，最近几十年已经新植了数以十亿计的树木，绿色植被的增长有目共睹，沙漠化和水土流失情况得到了极大缓解。\n本题论点和论据都在讨论的是中国绿化的情况，话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说中国快速造林减少了对进口木材的依赖，而论点讨论的是中国是全球变绿的重要力量，话题不一致，无法加强，排除；\nB项：该项说中国过去荒漠化的地方已经被绿色植被所覆盖，对比的是中国的过去情况和现在情况，而论点讨论的是中国是全球变绿的重要力量之一，话题不一致，无法加强，排除；\nC项：该项说全球植被面积净增长的25%来自中国，补充论据说明中国是全球变绿的重要力量之一，可以加强，当选；\nD项：该项说有些国家和地区的雨林面积大大减少，而论点讨论的是中国是全球变绿的重要力量之一，话题不一致，无法加强，排除。\n故正确答案为C。","no":92,"missingImage":false},{"qid":"4651553","cat":"逻辑判断","stem":"麦子大约在五千年前由西亚传入中国，但由麦子做成的面食直到唐宋时期才成为北方人的主食。在此之前，北方的主粮是粟，也就是小米。秦汉时期的老百姓很不愿意种麦子，汉朝曾为增加粮食产量两次大力推广种麦子，但老百姓并没有积极响应。\n以下哪项如果为真，最能解释上述历史现象？","options":{"A":"外来作物很多，除了麦子，还有番薯、胡麻等，不是每种作物一传入就被接受","B":"磨粉技术传播较晚，东汉时只有官宦人家才拥有上下两扇带有磨齿的磨盘","C":"麦粒直接煮成的“麦饭”生硬难咽、口感很差，秦汉时期的绝大多数人都不爱吃","D":"东汉以后磨盘磨粉和“热汤饼”等面食技术逐渐推广开来，麦子才变得“好吃”了"},"answer":"C","explanation":"第一步：找出题干矛盾。\n秦汉时期的老百姓很不愿意种麦子，汉朝曾两次大力推广种麦子，但老百姓并没有积极响应。\n第二步：逐一分析选项。\nA项：该项说的是有些外来作物并不能马上被接受，但是汉朝已经两次大力推广了，为什么还是不能被接受，不能解释题干矛盾，排除；\nB项：该项说的是东汉时期只有官宦人家才能将麦子磨粉，那在麦子不能被磨粉时，为什么老百姓不愿意种植，选项并没有明确说明，不能解释题干矛盾，排除；\nC项：该项说的是由麦粒直接煮成的“麦饭”口感很差，秦汉时期的绝大多数人都不爱吃，因为麦粒不好吃所以不种麦子，可以解释即使国家大力推广，老百姓也不积极响应的原因，可以解释题干矛盾，当选；\nD项：该项说的是麦子从东汉以后因为磨盘磨粉和面食技术才变得好吃，题干要解释的矛盾点是为什么国家推广也不种，C项很直接地说明因为不好吃，所以不种；D项在解释怎么才变得“好吃”，没有C项直接，排除。\n故正确答案为C。","no":93,"missingImage":false},{"qid":"4651745","cat":"逻辑判断","stem":"某游戏公司规定，登录游戏必须实名验证，未成年人每天最多只能在线100分钟，晚上8点至次日上午6点不能使用。然而，后台的账户登录数据显示，规定实施后，未成年人账户登录游戏的平均时长与之前相比增加了15％。\n以下哪项如果为真，最能解释上述现象？","options":{"A":"规定实施后，许多家长通过为孩子注册未成年人账户来限制其长时间玩游戏","B":"许多未成年人通过购买成年人账号或者使用其父母账号登录游戏","C":"未成年人有逆反心理，新规定反而刺激了他们在节假日过度玩游戏","D":"规定实施后，公司推出在线满90分钟送装备活动，吸引了许多购买力不强的玩家"},"answer":"C","explanation":"第一步：找出题干矛盾。\n登录游戏必须实名验证，未成年人每天最多只能在线100分钟，但后台的账户登录数据显示，规定实施后，未成年人账户登录游戏的平均时长与之前相比增加了15％。\n第二步：逐一分析选项。\nA项：许多家长为孩子注册未成年人账户限制其游戏时长，说明家长在限制孩子游戏的时间，无法解释为何实名验证后未成年人账户登录时长增加，不能解释题干矛盾，排除；\nB项：许多未成年人购买成年人账号或使用父母账号登录游戏，说明他们登录游戏的账户是成年人账户，但是题干说的是未成年人账户的使用情况，不能解释题干矛盾，排除；\nC项：在新规之后，未成年人在节假日会过度游戏，即在节假日未成年人账户登录时长增加，可以导致未成年人账户登录游戏的平均时长比之前增加，可以解释题干矛盾，当选；\nD项：规定实施后，新活动吸引许多购买力不强的玩家，但购买力不强的玩家不明确是否一定是未成年人，也可能是很多不喜欢在游戏中充值的成年人，不能解释题干矛盾，排除。\n故正确答案为C。","no":94,"missingImage":false},{"qid":"4651825","cat":"逻辑判断","stem":"上级检查组在某周的周一至周五检查了甲、乙、丙、丁、戊5个单位。已知：\n（1）戊是第3个被检查单位；\n（2）第4个被检查单位得到的既有批评也有表扬；\n（3）乙和丁两个单位得到的只有批评；\n（4）检查甲单位是在检查丁单位之后。\n根据上述信息，可以推出以下哪项？","options":{"A":"检查乙单位是在检查丙单位之前","B":"检查甲单位是在检查戊单位之后","C":"检查丙单位是在检查丁单位之前","D":"检查戊单位是在检查丁单位之后"},"answer":"D","explanation":"本题为组合排列题。题干涉及排序，可优先考虑列表。\n根据条件（1）可知：\n\u003cimg data-k=\"ccf7f02a9e24\" style=\"max-width:343px\">\n根据条件（2）（3）可知：\n4不是乙、丁，故4只能是甲、丙，即如下两种假设：\n假设一：\n\u003cimg data-k=\"fddf3528b017\" style=\"max-width:349px\">\n根据条件（4）检查甲单位是在检查丁单位之后，可知：丁在1或2，此时戊在丁之后；\n假设二：\n\u003cimg data-k=\"c696673e001c\" style=\"max-width:359px\">\n根据条件（4）检查甲单位是在检查丁单位之后，可知：若满足甲在丁之后，则丁不在5，丁只能在1或2，此时戊在丁之后。\n故正确答案为D。","no":95,"missingImage":false},{"qid":"4651555","cat":"逻辑判断","stem":"“同情用药”指的是某些重症患者可以在不参加临床试验的情况下，使用尚未获批上市的在研药物。在新冠肺炎疫情初期，提前使用抗疫药物的同情用药案例数有所增加，效果良好。但是，同情用药的实施条件十分严格，大部分患者不具备用药资格。对此，有专家建议，应该放宽同情用药的使用条件。\n以下哪项如果为真，最能质疑上述专家建议的合理性?","options":{"A":"同情用药会破坏新药审批的程序和权威，这对患者和社会都有不可预料的后果","B":"即便“无药可救”的患者愿意使用未获批的在研药物，也不一定能够成功延长生命","C":"为了保护患者用药安全，大部分国家目前严禁未经过临床试验的药品上市","D":"目前，大部分常见疾病都已经有一些适用药物，这些疾病并不需要同情用药"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：应该放宽同情用药的使用条件。\n论据：在新冠肺炎疫情初期，提前使用抗疫药物的同情用药案例数有所增加，效果良好。但是，同情用药的实施条件十分严格，大部分患者不具备用药资格。\n本题的论点和论据讨论的都是同情用药的使用条件问题，二者话题一致，优先考虑削弱论点，即表明不应放宽同情用药的使用条件。\n第二步：逐一分析选项。\nA项：该项说的是同情用药会破坏新药审批的程序和权威，对患者和社会都有不可预料的后果，表明放宽同情用药的使用条件会产生不利影响，因此同情用药的使用条件应该严格，可以削弱，当选；\nB项：该项说的是患者愿意使用未获批的在研药物后不一定能延长生命，但是论点讨论的是同情药物的使用条件是否应当放宽，讨论内容为什么样的病人应该使用该药物，而不是使用药物后可能的效果，无法削弱，排除；\nC项：该项说的是未经过临床试验的药品能否上市的问题，论点讨论的是同情用药使用的限制条件，二者话题不一致，无法削弱，排除；\nD项：该项说的是大部分常见疾病是否需要同情用药，而题干讨论的同情用药指的是重症患者的特殊情况，二者话题不一致，无法削弱，排除。\n故正确答案为A。","no":96,"missingImage":false},{"qid":"4651733","cat":"逻辑判断","stem":"近年来，某小区流浪猫泛滥成灾。去年年初该小区的物业对流浪猫进行了绝育处理。然而在今年年初，业主们发现该小区流浪猫的数量至少有去年年初的1.5倍之多。\n以下哪项如果为真，最能解释上述现象？","options":{"A":"该小区多年来环境保护良好，有许多鸟类在此栖息，流浪猫极易获得食物","B":"该小区少数业主去年成立了爱猫小组，定期在该小区投放食物喂养流浪猫","C":"该小区有一些养宠物猫的租户今年退租后，将宠物猫遗弃在小区内","D":"该小区紧邻其他大型小区，流浪猫可以在这些小区间自由流动"},"answer":"D","explanation":"第一步：找出题干矛盾。\n去年年初该小区的物业对流浪猫进行了绝育处理，但今年年初该小区流浪猫的数量至少有去年年初的1.5倍之多。\n第二步：逐一分析选项。\nA项：该小区多年来环境保护良好，流浪猫极易获得食物，可以解释为什么多年来该小区有流浪猫，但是无法解释为什么去年年初对流浪猫进行绝育处理后，今年年初流浪猫的数量至少有去年年初的1.5倍之多，不能解释题干矛盾，排除；\nB项：业主成立爱猫小组，投放食物，可以解释为什么该小区有流浪猫，但是无法解释为什么去年年初对流浪猫进行绝育处理后，今年年初流浪猫的数量至少有去年年初的1.5倍之多，不能解释题干矛盾，排除；\nC项：一些租户将宠物猫遗弃在该小区，可以解释为什么流浪猫的数量增加了，但“一些”仅是少数，无法解释为什么今年年初流浪猫的数量至少有去年年初的1.5倍之多，不能解释题干矛盾，排除；\nD项：该小区紧邻其他大型小区，流浪猫可以在小区间进行流动，说明一方面别的小区的流浪猫能流动到本小区，另一方面它们仍可以繁衍新的小猫。且“其他大型小区”体现出很有可能紧邻小区的非绝育猫咪数量不少，解释了为什么去年对本小区的流浪猫绝育，但今年年初流浪猫的数量至少有去年年初的1.5倍之多，可以解释题干矛盾，当选。\n故正确答案为D。","no":97,"missingImage":false},{"qid":"4651712","cat":"逻辑判断","stem":"青山村山清水秀，环境优美，村民们在村委会带领下规划自己的美好未来。他们计划：\n（1）如果兴建葡萄庄园或修建民宿，就要开发乡村旅游；\n（2）如果发展水产养殖或开发乡村旅游，则要修建民宿；\n（3）如果不兴建葡萄庄园，就发展水产养殖；\n（4）如果开发乡村旅游，则要改造村容村貌。\n如果上述计划得以实施，可以得出以下哪项？","options":{"A":"青山村会兴建葡萄庄园","B":"青山村会改造村容村貌","C":"青山村不会修建民宿","D":"青山村不会发展水产养殖"},"answer":"B","explanation":"第一步：分析题干条件。\n（1）兴建葡萄庄园 或 修建民宿\u003cimg data-k=\"508f0e7dbbe5\">开发乡村旅游；\n（2）发展水产养殖 或 开发乡村旅游\u003cimg data-k=\"508f0e7dbbe5\">修建民宿；\n（3）\u003cimg data-k=\"e752a8ae1a16\">兴建葡萄庄园\u003cimg data-k=\"508f0e7dbbe5\">发展水产养殖；\n（4）开发乡村旅游\u003cimg data-k=\"508f0e7dbbe5\">改造村容村貌。\n第二步：根据题干条件进行推理。\n解题思路一：\n题干信息较多没有明显推理起点，可从最大信息入手，条件（1）、（2）、（4）均提到了开发乡村旅游，故从开发乡村旅游这个最大信息开始假设。\n假设开发乡村旅游，依据条件（2），或关系一真即真，可得：修建民宿。再依据条件（1），或关系一真即真，可得：开发乡村旅游。开发乡村旅游是对条件（4）的肯前，可得：改造村容村貌。此种假设（开发乡村旅游）与题干信息均无矛盾。\n假设不开发乡村旅游，这是对条件（1）的否后，可得：\u003cimg data-k=\"e752a8ae1a16\">兴建葡萄庄园 且 \u003cimg data-k=\"e752a8ae1a16\">修建民宿。\u003cimg data-k=\"e752a8ae1a16\">兴建葡萄庄园是对条件（3）的肯前，可得：发展水产养殖。再依据条件（2），或关系一真即真，可得：修建民宿，此时与已推出的不修建民宿的信息矛盾，所以第二种假设（不开发乡村旅游）不成立。\n综上所述，开发乡村旅游一定成立，开发乡村旅游是对条件（4）的肯前，可得：改造村容村貌，因此，B项可以推出。\n解题思路二：\n条件（1）、（3）均提到“兴建葡萄庄园”，且一个是肯定一个是否定，可优先从是否兴建葡萄庄园进行假设。\n假设“兴建葡萄庄园”，依据条件（1）可知，“开发乡村旅游”成立，结合条件（2）、（4）可知，“修建民宿”和“改造村容村貌”也成立；\n假设“不兴建葡萄庄园”，依据条件（3）可知，“发展水产养殖”成立，结合条件（2）可知，“修建民宿”成立，根据条件（1）、（4）可知，“开发乡村旅游”、“改造村容村貌”也成立；\n综上所述，无论是否兴建葡萄庄园，“开发乡村旅游”“修建民宿”“改造村容村貌”一定成立，因此，B项可以推出。\n故正确答案为B。","no":98,"missingImage":false},{"qid":"4651711","cat":"逻辑判断","stem":"张先生的孩子简直就是一个“麻烦制造者”，在学校上课经常与身旁同学交头接耳，不时还与老师唱反调；在家里边写作业边听音乐，不到10分钟就又开始上蹿下跳；批评两句他根本不放在心上，反而嘻皮笑脸对你做个鬼脸。张先生觉得自家的孩子浑身上下到处是缺点，对他的未来充满了焦虑。\n以下哪项如果为真，最有助于缓解张先生目前的焦虑？","options":{"A":"每个孩子都有自己的行为和性格特点，这些特点可能与其父母或他人不尽相同，但不一定是真正的缺点","B":"孩子思维活跃、行动自在，敢于打破常规、表达自我，恰恰是其充满活力、有创新潜能的表现","C":"孩子不把家长批评放在心上，是因为在他们看来，家长的批评实际上是关心爱护自己的表现","D":"如果孩子过于安静，不喜欢结交同学，对家长的批评总保持沉默，家长也会感到焦虑"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：张先生觉得自家的孩子浑身上下到处是缺点，对他的未来充满了焦虑。\n论据：张先生的孩子简直就是一个“麻烦制造者”，在学校上课经常与身旁同学交头接耳，不时还与老师唱反调；在家里边写作业边听音乐，不到10分钟就又开始上蹿下跳；批评两句他根本不放在心上，反而嘻皮笑脸对你做个鬼脸。\n论点说的是张先生因觉得孩子充满缺点而对其未来充满焦虑，论据说的是孩子的一些表现，二者均讨论孩子充满缺点，话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：说的是孩子与他人不同的特点不一定是真正的缺点，但孩子与他人不同的特点是否会影响孩子未来的发展并不清楚，不明确选项，无法削弱，排除；\nB项：说的是孩子的表现从另一个角度看恰恰是优点，说明孩子并非充满缺点，进而也无须对其未来充满焦虑，直接削弱论点，可以削弱，当选；\nC项：说的是孩子为什么不把家长批评放在心上，只解释了孩子其中一个缺点的形成原因，与张先生对孩子未来充满焦虑无关，无法削弱，排除；\nD项：说的是即使孩子的表现与现在完全相反，张先生也会焦虑，但不能明确说明目前孩子的表现张先生是否会对其未来充满焦虑，二者话题不一致，无关项，无法削弱，排除。\n故正确答案为B。","no":99,"missingImage":false},{"qid":"4651556","cat":"定义判断","stem":"微躺青年：指面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状，而在专注于本职工作的同时，合理调整工作方向，追求自我价值实现的年轻人。\n下列属于微躺青年的是：","options":{"A":"设计师小谭研究生毕业后，因与投资人理念不合，离开了加盟三年的设计公司到外地改做陶瓷设计。最艰难的时候，天天工作到深夜，终于设计出大受市场欢迎的产品，实现了大学以来的梦想","B":"随着新冠肺炎疫情防控形势好转，各地游客都明显增多，商家纷纷推出低价游，抢占旅游市场。小李把自己的旅行社转让出去后，开始在网络上进行家乡景点直播，很快就成为直播达人，带动了家乡旅游产业的发展","C":"今年大学毕业的小柳投递了许多份求职信，但都石沉大海。索性在网上当起了自律监督师，每天要定十几个闹钟，最多同时监督20多个人。刚开始觉得工作枯燥乏味，但现在已经收到了数百条好评，让他很有成就感","D":"小何毕业后一直在互联网公司工作，公司内部竞争压力很大，常常加班到深夜。虽然收入十分可观，但他觉得高强度工作损害了身心健康，决定每年给自己放个小长假"},"answer":"A","explanation":"第一步：找出定义关键词。\n“面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状”、“专注于本职工作的同时，合理调整工作方向”、“追求自我价值实现”。\n第二步：逐一分析选项。\nA项：设计师小谭离开原来的设计公司后并没有消极接受现状，而是调整了工作方向，改做陶瓷设计，符合“面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状”、“专注于本职工作的同时，合理调整工作方向”，经过不懈努力，设计的产品获得市场欢迎，最终实现了自身的梦想，符合“追求自我价值实现”，符合定义，当选；\nB项：商家纷纷推出低价游，抢占旅游市场，小李把自己的旅行社转让出去后，在网络上进行家乡景点直播，符合“面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状”，但小李是迫于市场的压力转出了旅行社，改做网络直播，不符合“追求自我价值实现”，不符合定义，排除；\nC项：大学刚毕业的小柳投递的许多份求职信石沉大海，于是在网上当起了自律监督师，符合“面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状”，但没有体现专注本职工作及工作方向上的调整，不符合“专注于本职工作的同时，合理调整工作方向”，不符合定义，排除；\nD项：在互联网公司工作的小何由于工作强度高，决定每年给自己放个小长假，符合“面对现实中的竞争压力，既不参与过度竞争，也不消极接受现状”，但放小长假不属于工作方向上的调整，不符合“专注于本职工作的同时，合理调整工作方向”，不符合定义，排除。\n注：本题正确率很低，粉笔通过多次教研并查询原文，如下图所示：\n1.A项是微躺青年的典型案例，而且A项在原文的基础上最后加了“实现大学以来的梦想”，更符合定义关键词“自我价值实现”；\n2.有同学质疑A项“天天工作到深夜”根本不微躺，但是注意A项说“最艰难的时候”，并不是每天都卷；\n3.ACD这三个选项都是“大学毕业/研究生毕业”，都能够体现出“青年、年轻人”，而B项只是说“小李”，身份不明确，这个点也不如A项。\n\u003cimg data-k=\"4b15bb0cc14f\" style=\"max-width:700px\">\n故正确答案为A。","no":100,"missingImage":false},{"qid":"4651577","cat":"定义判断","stem":"信用联动奖惩：指有关部门或组织在法定范围内根据企业、个人信用记录，采取部门联动、社会协同等方式，对其依法联合实施奖励或惩戒的行为。\n下列属于信用联动奖惩的是：","options":{"A":"某市设立了无偿献血“五星级志愿者”、志愿服务终身荣誉奖，获奖市民可以免除市管公园门票，免费乘坐市内公交车，享受市属公立医院诊察费半价优惠","B":"餐馆老板李先生在当地政务服务网提交了经营性临时占道申请，由于其信用等级为A级，可以享受审批绿色通道，第二天就收到了城管和其他相关部门的许可短信","C":"阮先生在承租的公租房里开设棋牌室，违背了申请公租房时的诚信承诺，被住房保障部门扣罚了住房保证金，并纳入五年内不得申请公租房的名单。阮先生对自己的失信行为深感后悔，保证以后一定做一个诚信公民","D":"某区政府接到媒体举报，辖区内一超市以次充好，将普通猪肉当黑猪肉售卖，区政府立即召集市场监管、税务等职能部门赶到超市，现场联合办公，对相关责任人进行查处"},"answer":"B","explanation":"第一步：找出定义关键词。\n“根据企业、个人信用记录”、“部门联动、社会协同”、“依法联合实施奖励或惩戒”。\n第二步：逐一分析选项。\nA项：根据无偿献血的志愿行为来实施奖励，不符合“根据企业、个人信用记录”，不符合定义，排除； \nB项：由于李先生的信用等级为A级，符合“根据企业、个人信用记录”，可以享受审批绿色通道，且收到城管和其他相关部门的许可短信，符合“部门联动、社会协同”，也符合“依法联合实施奖励或惩戒”，符合定义，当选；\nC项：阮先生在公租房开设棋牌室是违背了诚信承诺，符合“根据企业、个人信用记录”，扣罚住房保证金、纳入五年内不得申请公租房的名单均为惩戒手段，符合“依法联合实施奖励或惩戒”，但该行为均由住房保障部门实施，未提及其他有关部门，不符合“部门联动、社会协同”，不符合定义，排除；\nD项：市场监管、税务等职能部门联合办公，符合“部门联动、社会协同”，但以次充好，将普通猪肉当黑猪肉售卖，属于不诚信经营的行为，并未提及商家的信用记录，不符合“根据企业、个人信用记录”，不符合定义，排除。\n故正确答案为B。","no":101,"missingImage":false},{"qid":"4651583","cat":"定义判断","stem":"去雇主化职业：指作为独立个体不受雇于任何雇主，依托网络平台提供商品或服务并获得相应报酬的就业形式。\n下列属于去雇主化职业的是：","options":{"A":"林先生辞职后来到南方注册了一家绿植盆景网店，在一个多月的时间里，租赁场地，筹措资金，完善平台，忙得不亦乐乎","B":"专业买手陈女士每月穿梭在世界各地，寻找带有当季流行元素或者可能在国内热卖的款式和品牌服装，并将其带回国内","C":"小李加入了一个微信群，里面提供了许多可兼职工作的岗位，经过一番挑选，他选择了一份帮忙代取快递的兼职，用赚来的钱贴补每月生活费","D":"喜欢写作的大二学生小孟在某平台网文写手的影响下，也开始在这家平台上更新写的小说，得到了许多粉丝的打赏，他很有成就感"},"answer":"D","explanation":"第一步：找出定义关键词。\n“作为独立个体不受雇于任何雇主”、“依托网络平台提供商品或服务”、“获得相应报酬”。\n第二步：逐一分析选项。\nA项：林先生辞职后注册网店提供绿植盆景，符合“作为独立个体不受雇于任何雇主”、“依托网络平台提供商品或服务”，但未体现出获得报酬，不符合“获得相应报酬”，不符合定义，排除；\nB项：陈女士把服装从世界各地带回国内，但未体现出是否依托网络平台售卖，是否获得报酬，不符合“依托网络平台提供商品或服务”、“获得相应报酬”，不符合定义，排除；\nC项：小李通过微信群找到代取快递的兼职，不符合“作为独立个体不受雇于任何雇主”，不符合定义，排除；\nD项：小孟依托网络平台更新写的小说，符合“作为独立个体不受雇于任何雇主”、“依托网络平台提供商品或服务”，且得到了许多粉丝的打赏，符合“获得相应报酬”，符合定义，当选。\n故正确答案为D。","no":102,"missingImage":false},{"qid":"4651755","cat":"定义判断","stem":"网络考古：指针对多年前网络上发布的各种文字、图片、影像等资料，重新查看或考证，从中发现有价值的信息。\n下列属于网络考古的是：","options":{"A":"为了写一篇回忆大学生活的散文，王先生把十多年前在社交软件上的好友、大学图书馆的借书记录、当年在各种网站的帖文都翻了出来","B":"小吴夫妇很细心，从孩子出生前的每次产前检查，到出生时测量的数据建档、医学证明，再到数码相机里面每次留下的成长照片，都储存在了网络云相册里","C":"程序员小陆从公司报废的硬盘中恢复出了公司内部的宣传资料、业务调整、人员变更等文档，交给了公司有关部门","D":"多年前，网络上进行了一场“三星堆起源”的大辩论，吸引了几十万人围观留言。辩论的参与者老张回想起当年的唇枪舌剑，感慨万千"},"answer":"A","explanation":"第一步：找出定义关键词。\n“针对多年前网络上发布的各种文字、图片、影像等资料”、“重新查看或考证”、“从中发现有价值的信息”。\n第二步：逐一分析选项。\nA项：该项说的是王先生为了写一篇回忆大学生活的散文，把当年在各种网站的帖文都翻了出来，说明王先生重新查看了这些帖文，符合关键词“针对多年前网络上发布的各种文字、图片、影像等资料”、“重新查看或考证”，符合定义，当选；\nB项：该项说的是小吴夫妇将孩子的产前检查、数据建档、医学证明、成长照片等资料储存在网络云相册里，并没有体现重新查看或考证这些资料，不符合关键词“重新查看或考证”，不符合定义，排除；\nC项：该项说的是程序员小陆从公司报废的硬盘中恢复出了公司内部的资料，从硬盘中恢复的公司内部资料不属于网络上的资料，不符合关键词“针对多年前网络上发布的各种文字、图片、影像等资料”，不符合定义，排除；\nD项：该项说的是老张回想起多年前的“三星堆起源”大辩论，并没有体现老张重新查看或考证有关该辩论的资料，不符合关键词“重新查看或考证”，不符合定义，排除。\n故正确答案为A。","no":103,"missingImage":false},{"qid":"4651787","cat":"定义判断","stem":"盲盒营销：指商家为提高复购率，将不同款式的商品或赠品放进包装盒，其中可能包含着消费者最喜欢的物品，但只有在购买并开盒后才能得知其真实情况。\n下列不属于盲盒营销的是：","options":{"A":"为了迎接冬奥会，某运动品牌推出了新的促销活动，将冬奥款的运动鞋与旗下普通款以随机派发的形式混合销售，爱好收藏的消费者为获得冬奥款的鞋子往往一次购买许多双","B":"某干脆面厂家采用过一种销售方法，将印有水浒108将的精美卡片随机放入干脆面的包装袋里，不少小学生为了集齐全部卡片，几乎花光了零用钱，这种场景已经成了90后的童年记忆","C":"某女士最近迷上了买花，因为社区团购群推出了新玩法，网上订花后，商家总是在包装盒里放一个小鸡、小鸭之类的毛绒玩具，次次出乎她的意料，让她爱不释手","D":"某商家为吸引用户下载并使用其APP，每年春节举办集福卡活动，用户参与抽奖活动，随机获得各种各样的“福”字卡，集齐全套就有资格参与抽奖活动"},"answer":"D","explanation":"第一步：找出定义关键词。\n“商家为提高复购率”、“将不同款式的商品或赠品放进包装盒”、“在购买并开盒后才能得知其真实情况”。\n第二步：逐一分析选项。\nA项：“某运动品牌推出了新的促销活动”符合“商家为提高复购率”，“将冬奥款的运动鞋与旗下普通款以随机派发的形式混合销售”符合“将不同款式的商品或赠品放进包装盒”，“爱好收藏的消费者为获得冬奥款的鞋子往往一次购买许多双”符合“在购买并开盒后才能得知其真实情况”，符合定义，排除； \nB项：“某干脆面厂家采用过一种销售方法”符合“商家为提高复购率”，“将印有水浒108将的精美卡片随机放入干脆面的包装袋里”符合“将不同款式的商品或赠品放进包装盒”，“不少小学生为了集齐全部卡片，几乎花光了零用钱”符合“在购买并开盒后才能得知其真实情况”，符合定义，排除；\nC项：“社区团购群推出了新玩法”符合“商家为提高复购率”，“商家总是在包装盒里放一个小鸡、小鸭之类的毛绒玩具”符合“将不同款式的商品或赠品放进包装盒”，“次次出乎她的意料”符合“在购买并开盒后才能得知其真实情况”，符合定义，排除；\nD项：某商家举办的“集福卡活动”既不是不同款式的商品也不是赠品，不符合“将不同款式的商品或赠品放进包装盒”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":104,"missingImage":false},{"qid":"4651559","cat":"定义判断","stem":"田保姆：指在不改变土地承包关系的前提下，农户将耕、种、管、收等部分或全部作业环节委托给社会化组织完成，成为规模经营的参与者和受益者的新型农业经营方式。\n下列不属于田保姆的是：","options":{"A":"晚稻收割接近尾声，泥瓦匠老李仍然不慌不忙，在周边市区接了好几单活，他家的10亩稻田三年前已经以每年5000元的价格租给了在家务农的邻居，连收带运，啥都不用他操心","B":"老刘夫妇近年来一直跟着亲戚在外地打工，每到收割季节都得回家忙乎一阵子。去年，村里的几个年轻人合伙买了大型收割机，成立了生产合作社，老刘全家商量后，就把田里的农活全部包给了他们","C":"每年收获季，处置成堆的秸秆都让种植户非常头疼，为了解决这个问题，大王庄村委会先后购置了10套秸秆打捆、粉碎机械，及时推出了秸秆回收加工服务项目，周围村子的农民再也不为这个事情发愁了","D":"某农业科技服务公司在各个村镇建立了所管地块的示范田，定期召开现场会，展示播种方式、田间管理等，当地不少农民变成了“甩手掌柜”，随时可以通过扫描公司的二维码了解托管服务的进程"},"answer":"A","explanation":"第一步：找出定义关键词。\n“在不改变土地承包关系的前提下”、“农户将耕、种、管、收等部分或全部作业环节委托给社会化组织”、“成为规模经营的参与者和受益者”。\n第二步：逐一分析选项。\nA项：该项中泥瓦匠老李只是出租了家中的10亩稻田，符合“在不改变土地承包关系的前提下”，但承租对象是在家务农的邻居，并非社会化组织，不符合“农户将耕、种、管、收等部分或全部作业环节委托给社会化组织”，不符合定义，当选；\nB项：该项中老刘全家只是把田里的农活包给村里年轻人成立的生产合作社，符合“在不改变土地承包关系的前提下”，生产合作社属于社会化组织，且老刘全家都是规模经营的参与者和受益者，符合“农户将耕、种、管、收等部分或全部作业环节委托给社会化组织”、“成为规模经营的参与者和受益者”，符合定义，排除；\nC项：该项中大王庄村委会推出的秸秆回收加工服务项目给种植户带来了便利，但没有改变土地承包关系，符合“在不改变土地承包关系的前提下”，大王庄村委会属于社会化组织，参与秸秆回收加工服务项目的农民都是规模经营的参与者和受益者，符合“农户将耕、种、管、收等部分或全部作业环节委托给社会化组织”、“成为规模经营的参与者和受益者”，符合定义，排除；\nD项：该项中某农业科技服务公司对于农民的土地来说只是起到了管理的作用，符合“在不改变土地承包关系的前提下”，农业科技服务公司属于社会化组织，当地参与托管服务的农民都是规模经营的参与者和受益者，符合“农户将耕、种、管、收等部分或全部作业环节委托给社会化组织”、“成为规模经营的参与者和受益者”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":105,"missingImage":false},{"qid":"4651545","cat":"定义判断","stem":"胶带纸思维：指使用各种表面上看似比较简单、笨拙的临时性手段，有效解决实际问题的方式。\n下列不属于胶带纸思维的是：","options":{"A":"临近下班的时候突然下了大雨，穿了新鞋子的小丽不想把鞋子弄脏，于是从办公室抽屉里拿了两个塑料袋套在脚上，一直走到地铁站鞋子都没湿","B":"马先生家下水道堵了好几天，偶然在短视频中看到了一个用白醋兑苏打水通下水道的方法，在家试验多次都没有成功，最后还得请专业人员上门疏通","C":"某社区举办的花街夜市突然停电，周围一片黑暗，社工小叶立刻去商店买来了一些蜡烛，点点烛光不仅照亮花街，还吸引了更多的游客","D":"小雯的房间突然掉了一块墙皮，但第二天有几个朋友要来访，她急中生智找出与朋友们的合影遮住了脱落墙皮的地方，美观又温馨"},"answer":"B","explanation":"第一步：找出定义关键词。\n“表面上看似比较简单、笨拙的临时性手段”、“有效解决实际问题”。\n第二步：逐一分析选项。\nA项：从办公室抽屉里拿了两个塑料袋套在鞋子上，符合“表面上看似比较简单、笨拙的临时性手段”，一直走到地铁站鞋子都没湿，符合“有效解决实际问题”，符合定义，排除；\nB项：用白醋兑苏打水通下水道的方法，符合“表面上看似比较简单、笨拙的临时性手段”，但试验多次都没有成功，不符合“有效解决实际问题”，不符合定义，当选；\nC项：去商店买来了一些蜡烛用来照明，符合“表面上看似比较简单、笨拙的临时性手段”，点点烛光不仅照亮花街，还吸引了更多的游客，符合“有效解决实际问题”，符合定义，排除；\nD项：找出与朋友们的合影来掩盖脱落墙皮的地方，符合“表面上看似比较简单、笨拙的临时性手段”，遮住了脱落墙皮的地方，美观又温馨，符合“有效解决实际问题”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":106,"missingImage":false},{"qid":"4651792","cat":"定义判断","stem":"舛互：指对陈述对象既全部否定又部分肯定，或既全部肯定又部分否定的表达技巧。\n下列属于舛互的是：","options":{"A":"除了下雨天，她几乎每天晚上都去父母家看看","B":"这件工艺品由纯手工打造而成，连打磨的时候也没有使用机械力","C":"全村人当时谁也不敢冒这个险，只有他背着一身债承包了这片荒山","D":"虽然他的说法听起来不可思议，但也不是一点道理都没有"},"answer":"C","explanation":"第一步：找出定义关键词。\n“既全部否定又部分肯定”、“既全部肯定又部分否定”。\n第二步：逐一分析选项。\nA项：几乎每天晚上都去，“几乎”说明有不去的时候，不符合“全部肯定”，也不符合“全部否定”，不符合定义，排除；\nB项：纯手工打造，没有使用机械力，都是对于这件工艺品的全部肯定，不符合“既全部肯定又部分否定”，不符合定义，排除；\nC项：全村人谁也不敢冒这个险，符合“全部否定”，只有他承包了荒山，符合“又部分肯定”，符合定义，当选；\nD项：说法听起来不可思议，但又有道理。不符合“既全部否定又部分肯定”，也不符合“既全部肯定又部分否定”，不符合定义，排除。\n故正确答案为C。","no":107,"missingImage":false},{"qid":"4651554","cat":"定义判断","stem":"陌生人社交困境：指在与陌生人交往过程中，由于误解他人行为动机或意图而造成不良后果的现象。\n下列不属于陌生人社交困境的是：","options":{"A":"早高峰时段、骑电瓶车忘戴头盔的小吴被文明交通志愿者拦下来批评教育，担心上班迟到的小吴觉得志愿者是故意针对他，当场情绪失控。路口因此造成了二十分钟的拥堵","B":"赵女士在田边拍照，看到远处有村民向她挥手大喊，以为村民担心她会踩坏庄稼，就挥了挥手，继续拍照。不一会儿，她被旁边树上飞出的马蜂蛰了，又疼又肿","C":"农村随迁儿童转学到城市学校后，不少孩子最初都会担心受到歧视而不愿与大家交往，抵触班级的集体活动，学习成绩也有所下滑，性格也变得更加敏感脆弱，情况严重者甚至需要半年时间，自卑心理才会逐渐消失","D":"杨女士经常叮嘱三岁的女儿小青不要和陌生人说话、不要随便跟陌生人走、不要吃陌生人的东西、不要给陌生人开门。结果，小青进幼儿园以后的几个月里，非常胆小，动不动就哭，平时连老师问话都不回答"},"answer":"C","explanation":"第一步：找出定义关键词。\n“在与陌生人交往过程中”、“由于误解他人行为动机或意图而造成不良后果的现象”。\n第二步：逐一分析选项。\nA项：小吴被志愿者拦下来，符合“在与陌生人交往过程中”，志愿者因小吴忘戴头盔对其进行批评教育是正常工作，小吴觉得志愿者是故意针对他，当场情绪失控，路口因此造成了二十分钟的拥堵，符合“由于误解他人行为动机或意图而造成不良后果的现象”，符合定义，排除；\nB项：赵女士与村民的交流，符合“在与陌生人交往过程中”，她以为村民挥手大喊是担心她会踩坏庄稼，而实际上村民是在对她进行提醒，最后没有重视提醒的田女士被马峰蛰了，符合“由于误解他人行为动机或意图而造成不良后果的现象”，符合定义，排除；\nC项：农村随迁儿童担心受到歧视而不愿与大家交往，并未体现出同学是否做出了某种行为使得随迁儿童产生误解，不符合“由于误解他人行为动机或意图而造成不良后果的现象”，不符合定义，当选；\nD项：小青进入幼儿园后，与同学和老师都不认识，符合“在与陌生人交往过程中”，老师问话都不答说明是受到了母亲的影响而误解了老师的行为，符合“由于误解他人行为动机或意图而造成不良后果的现象”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":108,"missingImage":false},{"qid":"4651715","cat":"定义判断","stem":"骑楼：指底层沿街面后退且留出公共人行空间的建筑物。\n下列建筑物不属于骑楼的是：","options":{"A":"\u003cimg data-k=\"b369b377caa3\" style=\"max-width:449px\">","B":"\u003cimg data-k=\"b2700b5f6447\" style=\"max-width:700px\">","C":"\u003cimg data-k=\"61e903035d5f\" style=\"max-width:492px\">","D":"\u003cimg data-k=\"cab1e578f04a\" style=\"max-width:700px\">"},"answer":"C","explanation":"第一步：找出定义关键词。\n“底层沿街面后退”、“留出公共人行空间”。\n第二步：逐一分析选项。\nA项：该项图片显示为“海口骑楼老街”，图中的沿街建筑，上面是楼房，下面是沿街廊道，该廊道既是居室(或店面)的外廊，又是室内室外的过渡空间，符合“底层沿街面后退”，同时该沿街廊道可供行人通过，符合“留出公共人行空间”，符合定义，排除；\nB项：该项图片显示为“文昌铺前老街”，图中的沿街建筑，上面是楼房，下面是沿街廊道，该廊道既是居室(或店面)的外廊，又是室内室外的过渡空间，符合“底层沿街面后退”，同时该沿街廊道可供行人通过，符合“留出公共人行空间”，符合定义，排除；\nC项：该项图片显示为“凤凰古城”，图中的街道两旁是建筑物的外墙，并未出现街面后退的情况也无法供行人通过，不符合“底层沿街面后退”和“留出公共人行空间”，不符合定义，当选；\nD项：该项图片显示为“海口骑楼老街”，图中的沿街建筑，上面是楼房，下面是沿街廊道，该廊道既是居室(或店面)的外廊，又是室内室外的过渡空间，符合“底层沿街面后退”，同时该沿街廊道可供行人通过，符合“留出公共人行空间”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":109,"missingImage":false}]}],"count":45,"answerable":45,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"3d3fdc5ac525\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"4651485","cat":"比重","stem":"“十三五”时期，我国航天发射次数占全球的比重为：","options":{"A":"15%","B":"20%","C":"25%","D":"30%"},"answer":"D","explanation":"根据题干“‘十三五’时期······比重为”，结合材料时间为2016—2020年，可判定本题为现期比重问题。定位表格材料，可知“十三五”时期我国及全球的航天发射次数。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，可得“十三五”时期，我国航天发射次数占全球的比重\u003cimg data-k=\"5ef3caa1a864\">\u003cimg data-k=\"e136091345cc\">\u003cimg data-k=\"1335dd4c4396\">。\n故正确答案为D。","no":110,"missingImage":false},{"qid":"4651487","cat":"增长","stem":"下列国家或地区中，2017—2020年发射数量年均增速为负的是：","options":{"A":"中国","B":"美国","C" /* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){

  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);

  });
}

    remain:state.remain, duration:state.duration, paused:state.paused, pi:state.pi
  });

function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){
  var c=$("#clock"), box=$("#timerBox");

  if(state.remain<=300) box.classList.add("warn");
  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){
  var p=paper();

  h.push('<div class="paper-head"><h1>'+esc(p.title)+'</h1><div class="meta">'
    +'<span>共 '+p.total+' 题</span><span>满分 100 分</span>'
    +(p.affected&&p.affected.length?'<span style="color:#8a6414">其中 '+p.affected.length+' 题缺图不计分</span>':'')
    +'<span>题量分布：'+p.modules.map(function(m){return m.label+" "+m.count+" 题"}).join(" · ")+'</span>'

  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
