"D","explanation":"观察发现，题干图形均由花朵、叶子和黑色方块组成，A、B、C三项图形中的叶子中线均与黑色方块的边重合，而D项图形中的叶子中线与黑色方块的边不重合，即D项与其他3个图形规律不同。\n故正确答案为D。","no":64,"missingImage":false},{"qid":"11454021","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性（    ）。\n\u003cimg data-k=\"ffb50dc8a4b0\" style=\"max-width:497px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，每幅图形中均由一种黑色小元素组成，且黑色小元素的个数=黑色小元素的边数，排除A项；继续观察发现，题干图形都存在一个与黑色小元素相同的白色区域，排除B、D两项，只有C项符合。\n故正确答案为C。","no":65,"missingImage":false},{"qid":"14993416","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性（    ）。\n\u003cimg data-k=\"a98808072107\" style=\"max-width:400px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。九宫格优先横向看，观察发现，第一行图形的黑点数依次为7、6、2，黑点数之和为15；第三行图形的黑点数依次为8、3、4，黑点数之和也为15，符合此规律；第二行应用此规律，“？”处图形的黑点数应为15-1-9=5，只有A项符合。\n故正确答案为A。","no":66,"missingImage":false},{"qid":"14993420","cat":"图形推理","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性（    ）。\n\u003cimg data-k=\"22b4cc0820b5\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，优先考虑样式规律。观察发现，题干图形的主体部分为“圆环”和“矩形”交替出现，故“？”处图形的主体部分应为“矩形”，排除B、D两项；继续观察发现，题干图形主体部分伸出的“线条+小黑球”数量依次为3、4、5、2、1，数量呈现奇、偶交替出现的规律，故“？”处图形主体部分伸出的“线条+小黑球”数量应为偶数，只有C项符合。\n故正确答案为C。","no":67,"missingImage":false},{"qid":"14993422","cat":"定义判断","stem":"食品安全亦称食品卫生，是指使食品符合一定的卫生学标准，及不随摄食而给人体健康带来危害的措施。关注食品是否受到生物性、化学性或放射性物质等有害物的污染，以致给消费者带来潜在或现实的健康风险。\n根据上述定义，下列符合食品安全的是（    ）。","options":{"A":"L面包店每天都有打折销售的临期面包，而且离保质期越近价格越便宜","B":"M餐厅规定进入凉菜间的食材必须是符合国家卫生标准的“净菜”","C":"N餐馆的员工擦拭油污后，简单冲洗便直接用手抓面条加工凉面","D":"小李买回T厂生产的袋装饺子，煮熟食用后，肚子疼痛难忍"},"answer":"B","explanation":"第一步：找出定义关键词。\n“食品符合一定的卫生学标准”、“不随摄食而给人体健康带来危害”、“关注食品是否受生物性、化学性或放射性物质等有害物的污染”、“无潜在或现实健康风险”。\n第二步：逐一分析选项。\nA项：L面包店销售临期面包，“临期”代表食品接近保质期截止时间，无法直接等同于“符合卫生学标准”，无法确保“不随摄食而给人体健康带来危害”，不符合定义，排除；\nB项：M餐厅规定进入凉菜间的食材必须是符合国家卫生标准的“净菜”，符合“食品符合一定卫生学标准”，符合定义，当选；\nC项：N餐馆员工擦拭油污后简单冲洗就用手抓面条，手部残留的油污属于化学性污染物，简单冲洗无法清除，污染物会转移至面条，导致食品污染，不符合“关注食品是否受生物性、化学性或放射性物质等有害物的污染”、“无潜在或现实健康风险”，不符合定义，排除；\nD项：小李食用T厂生产的袋装饺子后肚子疼痛，“腹痛”表明饺子存在卫生隐患，已造成现实健康危害，不符合“不随摄食而给人体健康带来危害”，不符合定义，排除。\n故正确答案为B。","no":68,"missingImage":false},{"qid":"14993402","cat":"定义判断","stem":"拜神教是以非物体的神灵为崇拜对象的宗教，人们从物体或身躯中分离出某种“主宰一切”的精神力量，予以顶礼膜拜。拜物教是指把某些特定物体想象为可支配人们命运的神而加以崇拜的宗教。某些人认为，这样的特定物体有灵性，对它祈祷、礼拜或祭献，即可获得好运与保护。\n根据上述定义，下列属于拜物教的是（    ）。","options":{"A":"道教信奉的尊神为：玉清元始天尊、上清灵宝天尊和太清道德天尊","B":"印度教三大神为：创世之神梵天、守护之神毗湿奴和毁灭之神湿婆","C":"在某处人类早期祭祀遗址中，发现了祭拜仙神的祭品遗物","D":"某原始部落把雕刻的玉猪作为自己的保护神予以祭拜"},"answer":"D","explanation":"第一步：找出定义关键词。\n拜神教：“以非物体的神灵为崇拜对象的宗教”、“人们从物体或身躯中分离出某种‘主宰一切’的精神力量，予以顶礼膜拜”；\n拜物教：“把某些特定物体想象为可支配人们命运的神而加以崇拜的宗教”。\n第二步：逐一分析选项。\nA项：道教信奉的玉清元始天尊、上清灵宝天尊、太清道德天尊均属于“非物体的神灵”，崇拜的是精神力量而非具体物体，不符合“把某些特定物体想象为可支配人们命运的神而加以崇拜的宗教”，不符合拜物教定义，排除；\nB项：印度教的创世之神梵天、守护之神毗湿奴、毁灭之神湿婆是象征宇宙创世、守护、毁灭职能的“非物体神灵”，崇拜的是精神力量而非具体物体，不符合“把某些特定物体想象为可支配人们命运的神而加以崇拜的宗教”，不符合拜物教定义，排除；\nC项：人类早期祭祀遗址中发现的“祭拜仙神的祭品遗物”，核心崇拜对象是“仙神”，“祭品”仅为祭拜时的辅助工具，并非崇拜对象本身，不符合“把某些特定物体想象为可支配人们命运的神而加以崇拜的宗教”，不符合拜物教定义，排除；\nD项：原始部落把“雕刻的玉猪”作为“保护神”祭拜，“玉猪”是具体的物体，把它作为保护神予以祭拜，符合“把某些特定物体想象为可支配人们命运的神而加以崇拜的宗教”，符合拜物教定义，当选。\n故正确答案为D。","no":69,"missingImage":false},{"qid":"14993419","cat":"定义判断","stem":"地球表面的水热条件等环境要素，沿纬度或经度方向发生递变，从而引起植被沿纬度或经度方向呈水平更替，这种现象被称为植被分布的水平地带性，植被分布的水平地带性是地球表面植被分布的基本规律之一。\n根据上述定义，下列体现了植被分布的水平地带性的是（    ）。","options":{"A":"根据水域环境条件的不同，水域动物可分为淡水动物群落和海洋动物群落","B":"受太阳辐射影响，地球北半球从南到北形成热带、亚热带、温带、寒带等不同的气候带","C":"香山的小溪中有绿藻，溪边有苔藓，岸上有草、蕨类，山坡上有桃树，山顶有松树","D":"我国温带沿海地区降水量大，分布着夏绿阔叶林，离海较远地区降水减少，分布着草原植被"},"answer":"D","explanation":"第一步：找出定义关键词。\n“地球表面的水热条件等环境要素”、“沿纬度或经度方向发生递变”、“从而引起植被沿纬度或经度方向呈水平更替”。\n第二步：逐一分析选项。\nA项：根据水域环境条件的不同，水域动物可分为淡水动物群落和海洋动物群落，其中“水域动物”不是“植被”，不符合“从而引起植被沿纬度或经度方向呈水平更替”，不符合定义，排除；\nB项：地球北半球从南到北形成热带、亚热带、温带、寒带等不同的气候带，描述的是“气候带”的划分，未涉及“植被”的分布，不符合“从而引起植被沿纬度或经度方向呈水平更替”，不符合定义，排除；\nC项：香山的小溪中有绿藻，溪边有苔藓，岸上有草、蕨类，山坡上有桃树，山顶有松树，描述的是从溪边到山顶的植被变化，是沿垂直高度的更替，不符合“从而引起植被沿纬度或经度方向呈水平更替”，不符合定义，排除；\nD项：我国温带从沿海到内陆（沿经度方向），因降水量递变，植被从夏绿阔叶林更替为草原，符合“地球表面的水热条件等环境要素”、“沿纬度或经度方向发生递变”、“从而引起植被沿纬度或经度方向呈水平更替”，符合定义，当选。\n故正确答案为D。","no":70,"missingImage":false},{"qid":"14993417","cat":"定义判断","stem":"文化扩散分为接触扩散、等级扩散、刺激扩散。接触扩散是指某种文化现象易于为接触者所接受，几乎接触该文化现象的人，如同接触到易于传染的病菌一样，就自然地接受了这种文化现象，从而实现了其扩散；等级扩散是指该文化现象的传播，或接受该文化现象的人，在空间或人群等方面，存在等级现象；刺激扩散是指某种文化现象，受某种原因而无法在另一地存在，不得不将原文化现象做某种程度改变，使其得以在当地存在，得到传播。\n根据上述定义，下列不属于文化扩散的是（    ）。","options":{"A":"唐人街作为中华文化在国外的展示处，每到春节时都热闹喧腾，吸引了许多当地人前来游玩参观","B":"高平镇是远近闻名的提琴技艺之乡，许多学艺者从高平镇学会了制琴技艺，到高新区附近建立了自己的提琴工厂","C":"蒙古族的祖先走出额尔古纳河两岸山林地带向蒙古高原迁徙，因自然环境制约，生产方式也随之从狩猎业转变为畜牧业","D":"沈阳故宫始建时保留了很多满文化的特色，清入关后北京故宫以汉文化为主基调成为官式建筑的典范。沈阳故宫改建时制度化的官式做法被应用其中"},"answer":"C","explanation":"第一步：找出定义关键词。\n接触扩散：“某种文化现象易于为接触者所接受”、“几乎接触该文化现象的人，如同接触到易于传染的病菌一样，就自然地接受了这种文化现象”、“从而实现了其扩散”；\n等级扩散：“该文化现象的传播，或接受该文化现象的人”、“在空间或人群等方面，存在等级现象”；\n刺激扩散：“某种文化现象”、“受某种原因而无法在另一地存在，不得不将原文化现象做某种程度改变”、“使其得以在当地存在，得到传播”。\n第二步：逐一分析选项。\nA项：该项指出唐人街的中华文化吸引当地人参观，当地人通过接触感知中华文化，符合“某种文化现象易于为接触者所接受”、“几乎接触该文化现象的人，如同接触到易于传染的病菌一样，就自然地接受了这种文化现象”、“从而实现了其扩散”，符合“接触扩散”定义，属于文化扩散，排除；\nB项：该项指出高平镇的制琴技艺被学艺者接受，符合“该文化现象的传播，或接受该文化现象的人”，从高平镇到高新区建立工厂，符合“在空间方面，存在等级现象”，符合“等级扩散”定义，属于文化扩散，排除；\nC项：该项指出蒙古族祖先因自然环境制约，生产方式从狩猎业转变为畜牧业，这是一种文化适应或内部演变过程，并未涉及文化的传播，不属于文化扩散，当选；\nD项：该项指出北京故宫的“制度化官式做法”传播到沈阳故宫，被沈阳故宫改建时采用，其中官式做法是制度化的，即沈阳故宫改建时不得不将原文化现象做某种程度改变，使其得以在当地存在，符合“受某种原因而无法在另一地存在，不得不将原文化现象做某种程度改变”、“使其得以在当地存在，得到传播”，符合“刺激扩散”定义，属于文化扩散，排除。\n本题为选非题，故正确答案为C。","no":71,"missingImage":false},{"qid":"14993406","cat":"定义判断","stem":"道路养护是对原有技术标准过低的路线和构筑物及沿线设施进行分期改善和添建，逐步提高道路的使用性能和服务水平，不断满足全社会对道路的要求。\n根据上述定义，下列不属于道路养护的是（    ）。","options":{"A":"针对急弯陡坡地段，在遇到降雪天气时，用清洁的粒砂、石屑或煤渣等物铺洒防滑","B":"用水泥混凝土铺补道路两边的岩石松动处，同时设立金属网以防坠落到路面上","C":"对过高并妨碍路面排水的土质路肩铲削整平，对低洼的路肩所存留的水可以及时排除","D":"收集城市道路相关数据（如道路平整度、结构承载力等），建设城市道路信息管理系统"},"answer":"D","explanation":"第一步：找出定义关键词。\n“对原有技术标准过低的路线和构筑物及沿线设施进行分期改善和添建”、“逐步提高道路的使用性能和服务水平”。\n第二步：逐一分析选项。\nA项：针对急弯陡坡地段在遇到降雪天气时用清洁的粒砂、石屑或煤渣等物铺洒防滑，符合“对原有技术标准过低的路线进行改善和添建”，符合定义，排除；\nB项：用水泥混凝土铺补道路两边的岩石松动处，同时设立金属网以防坠落到路面上，符合“对原有技术标准过低的沿线设施进行改善和添建”，符合定义，排除；\nC项：对过高并妨碍路面排水的土质路肩铲削整平，对低洼的路肩所存留的水可以及时排除，符合“对原有技术标准过低的沿线设施进行改善和添建”，符合定义，排除；\nD项：收集数据建设城市道路信息管理系统，没有对实际的道路进行操作，不符合“对原有技术标准过低的路线和构筑物及沿线设施进行分期改善和添建”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":72,"missingImage":false},{"qid":"14993423","cat":"类比推理","stem":"智能：添：动力","options":{"A":"绿色：宜：环保","B":"生产：更：清洁","C":"节约：促：发展","D":"减排：利：节能"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n智能指智能化技术或智慧手段，智能可以增添动力，智能有添动力的功能，第一个词与后两个词构成功能对应关系。 \n第二步：判断选项词语间逻辑关系。\nA项：绿色象征着环保，二者为对应关系，与题干逻辑关系不一致，排除；\nB项：生产需要更清洁的环境，第一个词与后两个词不构成功能对应关系，与题干逻辑关系不一致，排除；\nC项：节约指节省、俭约的生活方式，节约可以促进发展，节约有促发展的功能，第一个词与后两个词构成功能对应关系，与题干逻辑关系一致，当选；\nD项：减排和节能是两种不同的环保措施，二者为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":73,"missingImage":false},{"qid":"14993418","cat":"类比推理","stem":"耕海牧渔：海洋经济","options":{"A":"大棚蔬菜：设施农业","B":"植树防风：林业经济","C":"通信网络：信息产业","D":"治沙种粮：沙漠农业"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n耕海牧渔指通过人工增殖放流等方式，结合生物工程技术和现代装备，建立可持续海洋渔业资源的开发模式。海洋经济包括为开发海洋资源和依赖海洋空间而进行的生产活动，以及直接或间接开发海洋资源及空间的相关产业活动。耕海牧渔是一种海洋经济，二者为种属关系，且耕海和牧渔均为动宾结构。\n第二步：判断选项词语间逻辑关系。\nA项：大棚蔬菜是设施农业的产物，二者为对应关系，与题干逻辑关系不一致，排除；\nB项：植树防风是一种生态建设活动，不属于林业经济，与题干逻辑关系不一致，排除；\nC项：通信网络是一种信息产业，二者为种属关系，但通信和网络均不是动宾结构，与题干逻辑关系不一致，排除；\nD项：治沙种粮是一种沙漠农业，二者为种属关系，且治沙和种粮均为动宾结构，与题干逻辑关系一致，当选。\n故正确答案为D。","no":74,"missingImage":false},{"qid":"14993415","cat":"类比推理","stem":"食肉动物：水生动物","options":{"A":"挥拍运动：团体运动","B":"体育彩票：足球彩票","C":"铁碳合金：铁铝合金","D":"土壤监测：水质监测"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n食肉动物和水生动物分别是从食物来源和生存环境的角度命名的，二者为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：挥拍运动和团体运动分别是从击球动作和参与人数多少的角度命名的，二者为交叉关系，与题干逻辑关系一致，当选；\nB项：足球彩票是一种体育彩票，二者为种属关系，与题干逻辑关系不一致，排除；\nC项：铁碳合金和铁铝合金是两种不同的合金，二者为并列关系，与题干逻辑关系不一致，排除；\nD项：土壤监测和水质监测是两种不同的环境监测类型，二者为并列关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":75,"missingImage":false},{"qid":"14993421","cat":"类比推理","stem":"豌豆：豆菽：谷物","options":{"A":"恒星：行星：卫星","B":"冰雹：降水：气象","C":"节气：大暑：小暑","D":"文化：宗教：风俗"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n菽为豆类的总称，豆菽类作物包括大豆、蚕豆、豌豆、绿豆、红小豆、芸豆等，豌豆是一种豆菽，二者是种属关系。谷物包括禾谷类、豆菽类和薯类等，豆菽是一种谷物，二者是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：恒星、行星和卫星是宇宙中的三种不同类型的天体，三者为并列关系，与题干逻辑关系不一致，排除；\nB项：冰雹是降水的一种形式，二者是种属关系；降水是一种气象现象，二者是种属关系，与题干逻辑关系一致，当选；\nC项：大暑和小暑是不同的节气，二者为并列关系，分别和节气构成种属关系，与题干逻辑关系不一致，排除；\nD项：宗教和风俗都属于文化的范畴，分别和文化构成种属关系，但与题干词语顺序相反，且宗教和风俗不构成种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":76,"missingImage":false},{"qid":"14993425","cat":"类比推理","stem":"传统武术 对于 （    ） 相当于 （    ） 对于 天体","options":{"A":"民间文学；系外行星","B":"太极拳；太阳系","C":"体育项目；黑洞","D":"竞技；宇宙"},"answer":"C","explanation":"逐一代入选项。\nA项：传统武术和民间文学没有明显逻辑关系；系外行星是一种天体，二者是种属关系，前后逻辑关系不一致，排除；\nB项：太极拳是一种传统武术，二者是种属关系；天体是太阳系的组成部分，二者是组成关系，前后逻辑关系不一致，排除；\nC项：传统武术是一种体育项目，二者是种属关系；黑洞是由广义相对论所预言的，存在于宇宙空间中的一种致密天体，是时空曲率大到光都无法逃脱的天体，黑洞是一种天体，二者是种属关系，前后逻辑关系一致，当选；\nD项：有的传统武术可以用于竞技（例如比武），二者是对应关系；天体是宇宙的组成部分，二者是组成关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":77,"missingImage":false},{"qid":"14993428","cat":"逻辑判断","stem":"某演讲比赛最终确定了三名进入决赛的候选人，分别是楚某、沙某、秦某，对于他们中谁能够进入决赛，三位评委分别发表了各自的意见：\n评委甲：秦某、沙某中只能进一个\n评委乙：如果秦某不进，楚某就不进\n评委丙：只有秦某或沙某不进，楚某才进\n以下方案能同时满足三个评委意见的是（    ）。","options":{"A":"秦某、沙某、楚某都进","B":"楚某进，秦某、沙某不进","C":"秦某进，沙某、楚某不进","D":"沙某、楚某进，秦某不进"},"answer":"C","explanation":"第一步：分析题干条件。\n（1）秦某、沙某只能进一个；\n（2）\u003cimg data-k=\"0be436194951\">秦某\u003cimg data-k=\"b3a86cb4840e\">楚某；\n（3）楚某\u003cimg data-k=\"b3a86cb4840e\">秦某 或 \u003cimg data-k=\"0be436194951\">沙某。\n第二步：根据题干条件进行推理。\n题干信息确定，选项信息充分，优先考虑排除法。\n根据条件（1）可知，秦某、沙某不能同时进，排除A项；\n根据条件（2）可知，当秦某不进时，楚某也不能进，排除B、D两项。\n经验证，C项能同时满足三个评委的意见。\n故正确答案为C。","no":78,"missingImage":false},{"qid":"14993437","cat":"逻辑判断","stem":"某单位调查员工的特长时发现，擅长踢足球的员工，在读大学本科期间一定参加过体育类的社团。甲、乙、丙、丁均为该单位员工。\n根据上述条件，下列情况一定为真的是（    ）。","options":{"A":"甲大学本科毕业，且参加过体育类的社团，则甲擅长踢足球","B":"乙擅长踢足球并且参加过体育类的社团，则乙一定读过大学本科","C":"丙擅长踢足球，没有参加过体育类的社团，则丙没有读过大学本科","D":"丁不擅长踢足球，也没有参加过体育类的社团，则丁没有读过大学本科"},"answer":"C","explanation":"第一步：翻译题干。\n擅长踢足球 且 读过大学本科\u003cimg data-k=\"a37757d411ef\">参加过体育类的社团；\n甲、乙、丙、丁均为该单位员工。\n第二步：逐一分析选项。\nA项：翻译为：甲读过大学本科 且 参加过体育类的社团\u003cimg data-k=\"a37757d411ef\">甲擅长踢足球，其中“参加过体育类的社团”是对题干的肯后，肯后无必然结论，无法推出，排除；\nB项：翻译为：乙擅长踢足球 且 参加过体育类的社团\u003cimg data-k=\"a37757d411ef\">乙读过大学本科，其中“参加过体育类的社团”是对题干的肯后，肯后无必然结论，无法推出，排除；\nC项：翻译为：丙擅长踢足球 且 \u003cimg data-k=\"0be436194951\">参加过体育类的社团\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">丙读过大学本科，其中“\u003cimg data-k=\"0be436194951\">参加过体育类的社团”是对题干的否后，否后必否前，可以推出：\u003cimg data-k=\"0be436194951\">丙擅长踢足球 或 \u003cimg data-k=\"0be436194951\">丙读过大学本科，已知“丙擅长踢足球”，根据或关系否一推一，可以推出：\u003cimg data-k=\"0be436194951\">丙读过大学本科，可以推出，当选；\nD项：翻译为：\u003cimg data-k=\"0be436194951\">丁擅长踢足球 且 \u003cimg data-k=\"0be436194951\">参加过体育类的社团\u003cimg data-k=\"a37757d411ef\">\u003cimg data-k=\"0be436194951\">丁读过大学本科，其中“\u003cimg data-k=\"0be436194951\">擅长踢足球”是对题干的否前，否前无必然结论，无法推出，排除。\n故正确答案为C。","no":79,"missingImage":false},{"qid":"14993435","cat":"逻辑判断","stem":"2022年10月，某支股票的市场价格大幅度下跌。在下跌的几周内，股票的交易量也急速下跌，大大低于去年的周平均量。然而，该支股票整年的交易量与去年相比并没有明显下降。\n如果下列说法正确，则能够解释上述说法中矛盾的是（    ）。","options":{"A":"股票投资者往往喜欢在低价的时候购入股票","B":"在2022年整年该支股票购买者的数量与去年相同","C":"某年内股票交易量越大，那一年股票市场的平均价格就越低","D":"在2022年的某个时期，该支股票的交易量高于该年的平均值"},"answer":"D","explanation":"第一步：找出题干矛盾。\n2022年10月，某支股票在几周内的交易量大大低于去年的周平均量。然而，该支股票整年的交易量与去年相比并没有明显下降。\n第二步：逐一分析选项。\nA项：选项指出股票投资者往往喜欢在低价的时候购入股票，但题干已经指出该支股票的市场价格下跌时，股票的交易量也急速下跌，与题干描述违背，无法解释题干矛盾，排除；\nB项：选项指出在2022年整年该支股票购买者的数量与去年相同，但股票购买者数量相同不代表股票交易量相同，交易量还与每人购买股数相关，无法解释题干矛盾，排除；\nC项：选项指出某年内股票交易量越大，那一年股票市场的平均价格就越低，表明股票交易量和平均价格相关，但并未指出2022年该支股票的平均价格，无法解释题干矛盾，排除；\nD项：选项指出在2022年的某个时期，该支股票的交易量高于该年的平均值，可以解释为什么2022年10月该支股票在几周内的交易量很低，但整年交易量和去年相比却没有明显下降，可以解释题干矛盾，当选。\n故正确答案为D。","no":80,"missingImage":false},{"qid":"14993441","cat":"逻辑判断","stem":"目前的中学生普遍缺乏自然科学知识的学习和积累。最近一项调查显示，中学生中喜欢和比较喜欢人工智能科技的只占到被调查人数的19%。\n以下哪项如果为真，最能质疑上述观点？（    ）","options":{"A":"中学生缺少对自然科学方面的指导，不懂得怎样去学习和积累","B":"中学生喜欢人工智能科技与学习积累自然科学知识不能混为一谈","C":"一些中学生既喜欢人工智能科技，又对其他自然科学知识有兴趣","D":"调查比例太小，不能反映中学生学习积累自然科学知识的真实情况"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：目前的中学生普遍缺乏自然科学知识的学习和积累。\n论据：中学生中喜欢和比较喜欢人工智能科技的只占到被调查人数的19%。\n本题论点讨论的是中学生缺乏“自然科学知识的学习和积累”，论据讨论的是中学生“喜欢人工智能科技”的比例，二者话题不一致，削弱优先考虑拆桥，即断开“喜欢人工智能科技”和“自然科学知识的学习和积累”之间的联系。\n第二步：逐一分析选项。\nA项：选项指出中学生缺少对自然科学方面的指导，不懂得怎样去学习和积累，解释了中学生普遍缺乏自然科学知识的学习和积累的原因，可以加强，无法削弱，排除；\nB项：选项指出中学生喜欢人工智能科技与学习积累自然科学知识不能混为一谈，切断了“喜欢人工智能科技”和“自然科学知识的学习和积累”之间的联系，为拆桥项，可以削弱，保留；\nC项：选项指出“一些”中学生既喜欢人工智能科技，又对其他自然科学知识有兴趣，但不明确中学生是否普遍缺乏自然科学知识的学习和积累，为不明确项，无法削弱，排除；\nD项：选项指出调查比例太小，不能反映中学生学习积累自然科学知识的真实情况，削弱论据，可以削弱，保留。\n对比B、D两项，B项为拆桥项，针对论据和论点之间的关系进行削弱，而D项仅针对论据中的调查方式进行削弱，故B项削弱力度更强，当选。\n故正确答案为B。","no":81,"missingImage":false},{"qid":"14993434","cat":"逻辑判断","stem":"有专家指出，纯净水在过滤掉有害物质的过程中，也一并将钾、镁、钙、铁等人体必需的矿物质元素给去掉了，常喝会导致缺钙。\n以下哪项如果为真，最能质疑上述观点？（    ）","options":{"A":"我们摄入饮用水主要是为了补充水分，而不是补钙，目前也没有研究表明喝纯净水与缺钙之间存在着必然联系","B":"饮用水虽然对钙元素等矿物质的摄入能起到一定贡献，但贡献程度依据水质硬度的不同，存在较大差异","C":"按照每人每天饮用约1.2L水的平均水平来计算，正常情况下从饮用水中摄取的钙最多100毫克","D":"很多人更喜欢喝白开水而非纯净水，认为白开水中含有人体必需的矿物质元素"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：纯净水在过滤掉有害物质的过程中，也一并将钾、镁、钙、铁等人体必需的矿物质元素给去掉了，常喝会导致缺钙。\n论据：无。\n本题论点讨论的是常喝纯净水会导致缺钙，只有论点，没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：选项指出摄入饮用水主要是为了补充水分，而不是补钙，目前也没有研究表明喝纯净水与缺钙之间存在着必然联系，质疑了论点中“常喝纯净水”和“缺钙”的因果关系，削弱论点，可以削弱，当选；\nB项：选项指出不同硬度的饮用水对钙元素等矿物质摄入的贡献程度有差异，但不明确纯净水减少的钙摄入量与缺钙的关系，因此不明确“常喝纯净水”是否就会导致“缺钙”，无法削弱，排除；\nC项：选项指出正常情况下从饮用水中摄取的钙最多100毫克，但不明确100毫克钙与缺钙的关系，因此不明确“常喝纯净水”是否就会导致“缺钙”，无法削弱，排除；\nD项：选项指出很多人更喜欢喝白开水而非纯净水，认为白开水中含有人体必需的矿物质元素，而论点讨论的是常喝纯净水是否会导致缺钙，话题不一致，无法削弱，排除。\n故正确答案为A。","no":82,"missingImage":false},{"qid":"14993440","cat":"逻辑判断","stem":"一项研究结果指出：多吃蔬菜水果的人与少吃的人相比，20年之内的死亡风险降低了7%-8%。此次大规模调查证实了富含维生素和膳食纤维的蔬菜和水果对健康非常重要。研究人员根据受访者每天的果蔬摄取量，将他们由多至少分为五组进行死亡风险的分析。结果显示，在死亡风险方面，水果摄取量最多的组比摄取量最少的组低8%。同样的，蔬菜摄取量最多的组比摄取量最少的组低7%。\n以下哪项如果为真，最能质疑上述研究结果？（    ）","options":{"A":"此次调查以11个地区的9.5万名40-69岁男女为对象，对他们的健康进行跟踪了解","B":"研究人员根据问卷结果推算受访者的果蔬摄取量，并将其分为五组进行死亡风险分析","C":"受访者在接受问卷调查过程中对实际情况有所隐瞒，果蔬摄入量与实际情况偏差较大","D":"除了果蔬摄入量的差别以外，受访人群的运动量、作息时间等生活习惯也有些许不同"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：富含维生素和膳食纤维的蔬菜和水果对健康非常重要。\n论据：在死亡风险方面，水果摄取量最多的组比摄取量最少的组低8%。同样的，蔬菜摄取量最多的组比摄取量最少的组低7%。\n本题论点在讨论蔬菜和水果对健康非常重要，论据在讨论吃蔬菜水果能够降低死亡风险，论据可以合理得到论点，因此论点和论据话题一致，削弱可以考虑削弱论点，也可以考虑削弱论据。\n第二步：逐一分析选项。\nA项：选项指出此次调查以11个地区的9.5万名40-69岁男女为对象，对他们的健康进行跟踪了解，仅描述调查选取的对象是怎样的，但无法对论点进行质疑，无法削弱，排除；\nB项：选项指出研究人员根据问卷结果推算受访者的果蔬摄取量，并将其分为五组进行死亡风险分析，仅描述该研究方法是什么，但无法对调查本身进行质疑，也无法对论点进行质疑，无法削弱，排除；\nC项：选项指出受访者在接受问卷调查过程中对实际情况有所隐瞒，果蔬摄入量与实际情况偏差较大，即指出调查所使用的指标不准确，可信度不高，质疑了调查的科学性，可以削弱，保留；\nD项：选项指出除了果蔬摄入量的差别以外，受访人群的运动量、作息时间等生活习惯也有些许不同，即说明还存在其他的变量“可能”导致研究结果不准确，可以削弱，保留。\n对比C、D两项，C项对调查数据的真实性进行质疑，直接削弱研究成果成立的前提；而D项并未指出“些许生活习惯的不同”与“死亡风险”的关系，即不明确存在的这些变量是否会直接影响到研究成果的成立，质疑力度较弱，故C项当选。\n故正确答案为C。","no":83,"missingImage":false},{"qid":"14993447","cat":"逻辑判断","stem":"近日有报道称，由于全球变暖导致海水升温，某国海军多艘舰艇发动机出现故障。专家认为，过于温暖的海水不仅无法起到冷却作用，反而有可能导致船舶发动机故障频发。\n以下哪项如果为真，最能支持上述观点？（    ）","options":{"A":"海水温度上升，船舶主机冷却系统的工作效率会降低，影响动力系统散热，船舶的维护成本会随之增加","B":"海平面持续上升、极端天气频发等问题带来的一系列连锁反应，让该国港口面临被淹没的风险","C":"船舶主机冷却系统的任务是确保船舶动力系统正常工作，海水冷却是冷却系统中的重要一环","D":"由于气候变化导致各种自然灾害频发，国际社会需加强沟通协商，合力应对气候变化挑战"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：过于温暖的海水不仅无法起到冷却作用，反而有可能导致船舶发动机故障频发。\n论据：由于全球变暖导致海水升温，某国海军多艘舰艇发动机出现故障。\n论点和论据均讨论“海水升温”与“船舶发动机故障”的关系，话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出海水温度上升会降低船舶主机冷却系统的工作效率，影响动力系统散热，但降低冷却系统的工作效率、影响散热并不代表会导致舰艇发动机发生故障，为不明确项，无法加强，排除；\nB项：该项讨论海平面上升、极端天气使港口面临淹没风险，与论点“过于温暖的海水是否会导致船舶发动机故障频发”无关，话题不一致，无法加强，排除；\nC项：该项指出船舶主机冷却系统的任务是确保船舶动力系统正常工作，海水冷却是冷却系统中的重要一环，说明过于温暖的海水无法起到冷却作用，从而使船舶动力系统不能正常工作，因此故障频发，解释了为什么过于温暖的海水会导致船舶发动机故障频发，补充论据，可以加强，当选；\nD项：该项指出国际社会需合力应对气候变化挑战，与论点“过于温暖的海水是否会导致船舶发动机故障频发”无关，话题不一致，无法加强，排除。\n故正确答案为C。","no":84,"missingImage":false},{"qid":"14993444","cat":"逻辑判断","stem":"最新研究发现，通过对脊髓的特定刺激脉冲恢复大脑和手臂之间的连接，能在一定程度上使瘫痪患者执行日常生活任务。为了测试这项技术，研究员训练部分手臂瘫痪的猕猴去伸手、抓住和拉动杠杆，以得到它们最喜欢的食物。实验显示，有些猴子原本无法拿到食物，但当刺激器刺激它的脊髓时，它可以实现抓住食物。因此研究人员表示此技术未来能帮助数百万患者恢复活动能力。\n以下哪项如果为真，最能质疑上述观点?（    ）","options":{"A":"人类的手臂神经无论是在复杂性还是灵敏度上都要强于猴子","B":"目前这种通过刺激脊髓来恢复手臂行动功能的技术还无法恢复写作或弹钢琴等精细活动能力","C":"实验一周后部分猴子可以抓住或拉动物体，但实验六周后，没有一只猴子能够控制自己的手指","D":"即使最简单的手臂动作，人类神经系统也须协调数百块肌肉，在实验室外，用直接电刺激脊髓来取代这种复杂神经控制并非易事"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：通过刺激脊髓来恢复手臂行动功能的技术，未来能帮助数百万瘫痪患者恢复活动能力。\n论据：刺激手臂瘫痪的猕猴脊髓后，原本无法拿到食物的猕猴能实现抓握食物的动作。\n论点讨论的是“该技术能帮助人类瘫痪患者恢复活动能力”，论据讨论的是“该技术能使原本无法拿到食物的猕猴实现抓握食物的动作”，论点侧重“使瘫痪患者执行日常生活任务”，论据基于“猕猴实验”，二者话题不一致，削弱可考虑拆桥，切断主体间的联系、切断实验与现实应用间的联系。\n第二步：逐一分析选项。\nA项：该项指出人类的手臂神经在复杂性和灵敏度上都要强于猴子，说明人类和猴子之间存在明显差异性，那么猴子的实验结果不一定适用于人类，即断开了“猕猴”与“人类”间的联系，为拆桥项，可以削弱，保留；\nB项：该项指出技术暂时无法恢复写作、弹钢琴等“精细活动”，但论点仅提及恢复日常活动能力，精细活动不属于必要范畴，且 “目前做不到” 不代表未来无法实现，无法削弱，排除；\nC项：该项指出实验一周后部分猴子可以抓住或拉动物体，实验六周后没有一只猴子能够控制自己的手指，即实验时长设置太短存在局限性，削弱论据，可以削弱，保留；\nD项：该项一方面从生理层面说明人类手臂神经调控机制的复杂性，体现“猕猴”与“人类”的差异；另一方面从应用层面指出实验室的结论与现实应用之间的差异，为拆桥项，可以削弱，保留。\n对比A、C、D三项，C项仅质疑猕猴实验的局限性，未涉及人类应用场景，属于削弱论据，力度最弱；A项仅体现人猴的生理差异，而D项从人猴的生理差异、实验室与现实场景的差异两个方面进行削弱，更为全面，力度最强。\n故正确答案为D。","no":85,"missingImage":false}]}],"count":30,"answerable":30,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2021年，全国共投入研究与试验发展（R&amp;D）经费27956.3亿元，同比增长14.6%，增速比上年加快4.4个百分点；研究与试验发展（R&amp;D）经费投入强度（与GDP之比）为2.44%，比上年提高0.03个百分点。\u003c/p>\u003cp>        分活动类型看，基础研究经费所占比重为6.50%，比上年提升0.49个百分点；应用研究和试验发展经费所占比重分别为11.3%和82.2%；应用研究经费同比增长14.1%；试验发展经费同比增长14.0%。\u003c/p>\u003cp>\u003cimg data-k=\"02027898932a\" style=\"max-width:585px\">\u003c/p>","questions":[{"qid":"14993564","cat":"增长","stem":"2021年，全国研究与试验发展（R&D）经费约比2019年增长了（    ）。","options":{"A":"22.1%","B":"24.8%","C":"26.3%","D":"31.3%"},"answer":"C","explanation":"根据题干“2021年······约比2019年增长了”，结合选项为百分数，可判定本题为间隔增长率问题。定位文字材料第一段可得：2021年，全国投入研究与试验发展（R&amp;D）经费同比增长14.6%（\u003cimg data-k=\"fa1503d6e290\">），增速比上年加快4.4个百分点。则2020年，全国投入研究与试验发展（R&amp;D）经费同比增长14.6%-4.4%=10.2%（\u003cimg data-k=\"c5c9cf3b0b11\">）。根据公式：\u003cimg data-k=\"d0430f3090d8\">，可得所求\u003cimg data-k=\"64cf3b20c7bb\">\u003cimg data-k=\"c6fa75ba4262\">。\n故正确答案为C。","no":86,"missingImage":false},{"qid":"14993567","cat":"比重","stem":"关于2021年全国①基础研究经费和②试验发展经费占研究与试验发展（R&D）经费的比重与上年相比的情况，以下描述正确的是（    ）。","options":{"A":"仅①高于上年水平","B":"仅②高于上年水平","C":"①和②均高于上年水平","D":"①和②均低于上年水平"},"answer":"A","explanation":"根据题干“关于2021年······占······比重与上年相比······”，可判定本题为两期比重问题。定位文字材料第一段可得：2021年，全国共投入研究与试验发展（R&D）经费同比增长14.6%；定位文字材料第二段可得：（2021年）基础研究经费所占比重为6.50%，比上年提升0.49个百分点；试验发展经费同比增长14.0%。则2021年全国基础研究经费占研究与试验发展（R&D）经费的比重与上年相比上升。根据两期比重比较结论：部分增长率&lt;总体增长率，则比重下降，14.0%&lt;14.6%，即2021年全国试验发展经费占研究与试验发展（R&D）经费的比重与上年相比下降。综上可知，2021年仅①基础研究经费的占比高于上年。\n故正确答案为A。","no":87,"missingImage":false},{"qid":"14993571","cat":"综合","stem":"2021年，研究与试验发展（R&D）经费投入强度高于全国总体水平的省级行政区有几个?","options":{"A":"3","B":"4","C":"5","D":"6"},"answer":"D","explanation":"定位文字材料第一段可得：2021年，全国研究与试验发展（R&D）经费投入强度（与GDP之比）为2.44%；定位统计表可得：2021年，研究与试验发展（R&D）经费投入强度高于全国总体水平（2.44%）的省级行政区有北京（6.53%）、天津（3.66%）、上海（4.21%）、江苏（2.95%）、浙江（2.94%）、广东（3.22%），共6个。\n故正确答案为D。","no":88,"missingImage":false},{"qid":"14993575","cat":"综合","stem":"2021年，安徽GDP约是宁夏的多少倍？","options":{"A":"10","B":"15","C":"21","D":"26"},"answer":"A","explanation":"根据题干“2021年······是······多少倍”，结合材料时间为2021年，可判定本题为现期倍数问题。定位统计表可得：（2021年）安徽共投入研究与试验发展（R&amp;D）经费1006.1亿元，投入强度（与GDP之比）为2.34%；宁夏共投入研究与试验发展（R&amp;D）经费70.4亿元，投入强度（与GDP之比）为1.56%。根据公式：整体\u003cimg data-k=\"447680635370\">，可得所求倍数\u003cimg data-k=\"cc742118add5\">\u003cimg data-k=\"b501489cec37\">\u003cimg data-k=\"cf47cdb330e1\">倍。\n故正确答案为A。","no":89,"missingImage":false},{"qid":"14993577","cat":"比重","stem":"下列饼图反映了哪三个同一区域内的省级行政区2021年研究与试验发展（R&amp;D）经费的占比关系？\n\u003cimg data-k=\"941f0b973e52\" style=\"max-width:228px\">","options":{"A":"北京、天津、河北","B":"陕西、甘肃、宁夏","C":"黑龙江、吉林、辽宁","D":"江苏、浙江、上海"},"answer":"D","explanation":"根据题干“······2021年······占比关系”，结合材料时间为2021年，可判定本题为现期比重问题。定位统计表可得2021年全国各省级行政区研究与试验发展（R&D）经费投入金额。结合饼图可知，三个省级行政区中，投入最高地区的经费金额小于其他两个区域之和，则各选项中大小关系分别为：\nA项，北京的经费投入金额为2629.3亿元、天津的经费投入金额为574.3亿元、河北的经费投入金额为745.5亿元，2629.3&gt;574.3+745.5，不满足题意，排除；\nB项，陕西的经费投入金额为700.6亿元、甘肃的经费投入金额为129.5亿元、宁夏的经费投入金额为70.4亿元，700.6&gt;129.5+70.4，不满足题意，排除；\nC项，黑龙江的经费投入金额为194.6亿元、吉林的经费投入金额为183.7亿元、辽宁的经费投入金额为600.4亿元，600.4&gt;194.6+183.7，不满足题意，排除；\nD项，江苏的经费投入金额为3438.6亿元、浙江的经费投入金额为2157.7亿元、上海的经费投入金额为1819.8亿元，3438.6&lt;2157.7+1819.8，满足题意，当选。\n故正确答案为D。","no":90,"missingImage":false}]},{"type":"material","material":"\u003cp>        2022年，全国居民人均可支配收入36883元，同比增长5.0%。分城乡看，城镇居民人均可支配收入49283元，同比增长3.9%；农村居民人均可支配收入20133元，同比增长6.3%。\u003c/p>\u003cp>        按收入来源分，2022年，全国居民人均工资性收入同比增长4.9%，占可支配收入的比重为55.8%；人均经营净收入同比增长4.8%，占可支配收入的比重为16.7%；人均财产净收入同比增长4.9%，占可支配收入的比重为8.8%；人均转移净收人同比增长5.5%，占可支配收入的比重为18.7%。\u003c/p>\u003cp>\u003cimg data-k=\"126ac494004d\" style=\"max-width:590px\">\u003c/p>","questions":[{"qid":"14993578","cat":"增长","stem":"2022年，全国居民人均工资性收入同比增加了（    ）。","options":{"A":"不到800元","B":"800~1200元之间","C":"1200~1600元之间","D":"1600元以上"},"answer":"B","explanation":"根据题干“2022年······同比增加了”，结合选项为具体单位，可判定本题为增长量计算问题。定位文字材料第一段可得：2022年，全国居民人均可支配收入36883元；定位文字材料第二段可得：2022年，全国居民人均工资性收入同比增长4.9%，占可支配收入的比重为55.8%。根据公式：部分=整体×比重，增长量\u003cimg data-k=\"32c4dfbf6ea2\">，则题干所求为\u003cimg data-k=\"6f138704621e\">\u003cimg data-k=\"a87d6ca8d76a\">\u003cimg data-k=\"309743d2522a\">元，在B项范围内。\n故正确答案为B。","no":91,"missingImage":false},{"qid":"14993579","cat":"综合","stem":"2022年在全国①城镇居民收支差（收入-支出）和②农村居民收支差中，高于2021年水平的有哪些项？（    ）","options":{"A":"仅①高于2021年水平","B":"仅②高于2021年水平","C":"①和②均高于2021年水平","D":"①和②均不高于2021年水平"},"answer":"C","explanation":"根据题干“2022年······收支差（收入-支出）······高于2021年水平······”，即需要2022年收支差&gt;2021年收支差，可转化为2022年收支差同比增长率&gt;0。因收支差=收入-支出，则收入=支出+收支差。结合材料给出收入与支出的同比增速，可判定本题为混合增长率问题。\n定位文字材料第一段可得：2022年，全国城镇居民人均可支配收入同比增长3.9%；农村居民人均可支配收入同比增长6.3%。定位统计表可得：2022年，全国城镇居民人均消费支出同比增长0.3%；农村居民人均消费支出同比增长4.5%。根据混合增长率口诀“混合后居中”可知，\u003cimg data-k=\"158340166cf1\">；\u003cimg data-k=\"2488165af499\">。\n则2022年在全国①城镇居民收支差（收入-支出）和②农村居民收支差中，高于2021年水平的有①和②。\n故正确答案为C。","no":92,"missingImage":false},{"qid":"14993581","cat":"平均数","stem":"2022年全国居民8类人均消费支出中，人均支出额超过人均总支出额10%的有几类？（    ）","options":{"A":"2","B":"3","C":"4","D":"5"},"answer":"C","explanation":"根据题干“2022年······人均支出额超过人均总支出额10%······”，结合材料时间为2022年，可判定本题为现期比重问题。定位统计表可得：2022年，全国居民人均消费支出24539元。根据公式：部分=整体×比重，则2022年全国居民人均消费总支出的10%=24539×10%=2453.9元。故2022年全国居民8类人均消费支出中，人均支出额超过人均总支出额10%的有：食品烟酒（7481元），居住（5882元），交通通信（3195元），教育文化娱乐（2469元），共4类。\n故正确答案为C。","no":93,"missingImage":false},{"qid":"14993582","cat":"平均数","stem":"假设城镇居民和农村居民各类人均消费支出占其总体人均消费支出的比重是相同的，则2022年全国农村居民人均衣着、食品烟酒和居住类支出之和约为多少万元?（    ）","options":{"A":"0.6","B":"0.8","C":"1.0","D":"1.3"},"answer":"C","explanation":"根据题干“······占······比重······则2022年······支出之和约为多少万元，结合材料时间为2022年，可判定本题为现期比重问题。定位统计表可得：2022年，全国居民人均消费支出24539元，农村居民16632元，食品烟酒7481元，衣着1365元，居住5882元。\n根据题干“城镇居民和农村居民各类人均消费支出占其总体人均消费支出的比重是相同的”与混合比重思维可知，\u003ci function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;

}

}
function store(key,val){
  try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null");
       localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; }
}
function drop(key){ try{localStorage.removeItem(key)}catch(e){} }

// 图片按 data-k 键在客户端解析（大幅压缩文件体积）

function resolveImgs(root){
  var list=$$("img[data-k]",root||document);

/* ---------------- scoring ---------------- */
// 单选：全对得分。多选/不定项：与答案完全一致得分；若所选全为正确项但漏选，按选中比例给部分分（自测辅助）。
function questionScore(q, a, perQ){
  if(!a) return {score:0, kind:"blank"};
  if(a===q.answer) return {score:perQ, kind:"right"};
  var ans=q.answer.split(""), sel=a.split("");
  if(ans.length>1 && sel.length>0 && sel.every(function(k){return ans.indexOf(k)>=0})){
    return {score:perQ*(sel.length/ans.length), kind:"partial"};
  }
  return {score:0, kind:"wrong"};
}

function grade(paper, answers){
  var mods=[], totalPts=0, gotPts=0, right=0, done=0, all=0;
  paper.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ = cnt ? m.pointsOf / cnt : 0;
    var st={label:m.label,count:m.count,answerable:cnt,points:m.pointsOf,perQ:perQ,right:0,wrong:0,blank:0,partial:0,got:0};
    eachQuestion(m,function(q){
      if(q.missingImage) return;
      all++;
      var a=answers[q.no]||"";
      if(a) done++;
      var r=questionScore(q,a,perQ);
      st.got+=r.score;
      if(r.kind==="right"){st.right++;right++;}
      else if(r.kind==="blank"){st.blank++;}
      else if(r.kind==="partial"){st.partial++;}
      else {st.wrong++;}
    });
    st.got=Math.round(st.got*10)/10;
    totalPts+=m.pointsOf; gotPts+=st.got;
    mods.push(st);
  });
  return {mods:mods,total:Math.round(totalPts*10)/10,got:Math.round(gotPts*10)/10,right:right,done:done,all:all};
}
function eachQuestion(m,fn){
  if(!m || !m.items) return;
  m.items.forEach(function(it){
    if(it.type==="material") it.questions.forEach(fn);
    else fn(it);
  });
}

}
function load(){
  var s=store(skey());
  if(!s) return false;
  state.answers=s.answers||{};
  state.submitted=!!s.submitted;
  state.used=s.used||0;
  state.remain=typeof s.remain==="number"?s.remain:state.duration;
  state.duration=s.duration||state.duration;
  state.paused=false;
  return true;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer();
  state.lastActive=Date.now();
  tickTimer=setInterval(function(){
    var now=Date.now();
    if(state.submitted||state.paused){state.lastActive=now;state.lastTick=now;return}
    var d=(now-state.lastTick)/1000;
    state.lastTick=now; state.lastActive=now;
    state.remain-=d; state.used+=d;
    if(state.remain<=0){state.remain=0;renderClock();doSubmit(true);return}
    renderClock();
  },250);
}
function stopTimer(){ if(tickTimer){clearInterval(tickTimer);tickTimer=null} }
function renderClock(){

  else if(state.remain<=state.duration*0.25) box.classList.add("half");
  $("#pauseBtn").textContent=state.paused?"继续":"暂停";
}

function optionKeys(q){return Object.keys(q.options).filter(function(k){return q.options[k]!==""}).sort()}

function renderPaper(){

  });
  $("#main").innerHTML=h.join("");
  resolveImgs($("#main"));
}

function questionHtml(q){
  var p=paper();
  var sel=state.answers[q.no]||"";
  var multi=q.answer.length>1;
  var selArr=sel.split("");
  var o=['<div class="q'+(multi?' isMulti':'')+'" id="q'+q.no+'" data-no="'+q.no+'">'];
  o.push('<div class="qhead"><span class="num">'+q.no+'</span>'
    +(q.cat?'<span class="tag">'+esc(q.cat)+'</span>':'')
    +(multi?'<span class="tag multi">多选 · '+q.answer.length+' 项</span>':'')
    +(q.missingImage?'<span class="tag warn">缺图·不计分</span>':'')
    +'<span class="flag" id="flag'+q.no+'"></span></div>');
  o.push('<div class="stem">'+esc(q.stem)+'</div>');
  if(q.missingImage) o.push('<div class="note">本题原卷含图片（图形/材料图），公开题库中该图片缺失，无法作答，本题不计入总分。</div>');
  if(q.sourceNote) o.push('<div class="note src">'+esc(q.sourceNote)+'</div>');
  if(q.redacted) o.push('<div class="note src">本题题干在公开题库中被特殊符号遮挡（如 ******），可能与原卷有出入，仅作参考。</div>');
  o.push('<div class="opts" id="opts'+q.no+'">');
  optionKeys(q).forEach(function(k){
    var on=selArr.indexOf(k)>=0;
    o.push('<label class="opt'+(on?' on':'')+'" data-k="'+k+'">'
      +'<input type="'+(multi?'checkbox':'radio')+'" name="q'+q.no+'" value="'+k+'"'+(on?' checked':'')+'>'
      +'<span class="k">'+k+'</span><span class="v">'+esc(q.options[k])+'</span>'
      +'<span class="mk" id="mk'+q.no+k+'"></span></label>');
  });
  o.push('</div>');
  o.push('<div class="expl hidden" id="ex'+q.no+'"></div>');
  o.push('</div>');
  return o.join("");
}

function renderCard(){
  var p=paper(), c=$("#card"), out=[];
  p.modules.forEach(function(m){
    eachQuestion(m,function(q){
      var cls="";
      var a=state.answers[q.no]||"";
      if(state.submitted){
        if(a){
          if(a===q.answer) cls="ok";
          else cls=(q.answer.length>1 && a.split("").every(function(k){return q.answer.indexOf(k)>=0}))?"multi":"no";
        }
      } else if(a) cls="done";
      out.push('<button class="cell '+cls+'" data-jump="'+q.no+'" title="第 '+q.no+' 题">'+q.no+'</button>');
    });
  });
  c.innerHTML=out.join("");
}

function renderProgress(){
  var p=paper(), done=0, all=0, per={};
  p.modules.forEach(function(m){
    var d=0;
    eachQuestion(m,function(q){
      if(q.missingImage)return;
      all++; if(state.answers[q.no]){done++;d++}
    });
    per[m.label]=d+"/"+m.answerable;
  });
  $("#doneN").textContent=done;
  $("#allN").textContent=all;
  $("#barFill").style.width=(all?done/all*100:0)+"%";
  $("#modProgress").innerHTML=p.modules.map(function(m){
    return '<div>'+esc(m.label)+'：<b>'+per[m.label]+'</b></div>';
  }).join("");
  if(state.submitted){
    var g=grade(p,state.answers);
    $("#scoreLive").innerHTML='得分 <b>'+g.got+'</b> / 100（正确 '+g.right+' 题）';
  } else {
    $("#scoreLive").textContent="";
  }
}

/* ---------------- interaction ---------------- */
function bindMain(){
  $("#main").addEventListener("change",function(e){
    var input=e.target;
    if(input.type!=="radio"&&input.type!=="checkbox")return;
    if(state.submitted){input.checked=!input.checked;toast("已交卷，如需修改请点“重做本卷”");return}
    var no=Number(input.name.slice(1));
    var box=$("#opts"+no);
    if(!box) return;
    var pq=BUNDLE.papers[state.pi];
    var q=null;
    if(pq && pq.modules) pq.modules.forEach(function(mm){eachQuestion(mm,function(qq){if(qq.no===no)q=qq})});
    var arr=[]; for(var i=0;i<box.querySelectorAll("input:checked").length;i++){arr.push(box.querySelectorAll("input:checked")[i].value)}
    var sel=arr.sort().join("");
    if(q && q.answer.length>1 && input.type==="checkbox" && sel.length>q.answer.length){
      input.checked=false;
      toast("本题为多选，最多选 "+q.answer.length+" 项（须与答案项数一致）");
      return;
    }
    if(sel) state.answers[no]=sel; else delete state.answers[no];
    var labels=box.querySelectorAll(".opt");
    for(var j=0;j<labels.length;j++) labels[j].classList.toggle("on",sel.indexOf(labels[j].dataset.k)>=0);
    renderCard();renderProgress();save();
  });
  $("#card").addEventListener("click",function(e){
    var b=e.target.closest("[data-jump]"); if(!b)return;
    var el=$("#q"+b.dataset.jump);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-92,behavior:"smooth"});
  });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="number")return;
    if(/^[a-dA-D]$/.test(e.key)){
      var cur=null;
      $$(".q").forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight*0.5 && r.bottom>80) cur=el;
      });
      if(!cur)return;
      var no=cur.dataset.no;
      var lab=$('.opt[data-k="'+e.key.toUpperCase()+'"]',$("#opts"+no));
      if(lab){e.preventDefault();lab.querySelector("input").click();}
    }
  });
}

/* ---------------- grading / result ---------------- */
function doSubmit(auto, silent){
  var already=state.submitted;
  stopTimer();
  state.paused=false;
  if(!already){ state.submitted=true; save(); }
  var p=paper(), g=grade(p,state.answers);

  // paint each question
  p.modules.forEach(function(m){
    var cnt=0;
    eachQuestion(m,function(q){ if(!q.missingImage) cnt++; });
    var perQ=cnt ? m.pointsOf/cnt : 0;
    eachQuestion(m,function(q){
      var el=$("#q"+q.no); if(!el)return;
      var a=state.answers[q.no]||"";
      var res=questionScore(q,a,perQ);
      el.classList.add("locked");
      if(res.kind==="right"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="✓ 正确 +"+perQ.toFixed(1)+"分";}
      else if(res.kind==="blank"){el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent=q.missingImage?"— 缺图不计分":"— 未作答";}
      else if(res.kind==="partial"){el.classList.add("correct"); $("#flag"+q.no).className="flag ok"; $("#flag"+q.no).textContent="△ 漏选 +"+res.score.toFixed(1)+"分";}
      else {el.classList.add("wrong"); $("#flag"+q.no).className="flag no"; $("#flag"+q.no).textContent="✗ 错误";}
      $$(".opt",$("#opts"+q.no)).forEach(function(l){
        var k=l.dataset.k;
        var inAns=q.answer.indexOf(k)>=0, inSel=a.indexOf(k)>=0;
        l.classList.remove("on");
        if(inAns){l.classList.add("ans-ok"); $("#mk"+q.no+k).className="mk ok"; $("#mk"+q.no+k).textContent="正确答案";}
        else if(inSel){l.classList.add("ans-bad"); $("#mk"+q.no+k).className="mk no"; $("#mk"+q.no+k).textContent="你的选择";}
      });
      var ex=$("#ex"+q.no);
      ex.classList.remove("hidden");
      ex.innerHTML='<div class="ansline">正确答案：'+q.answer+(a?'　你的答案：'+a:'　你的答案：未作答')
        +(res.kind==="partial"?'　<span style="color:#b45309">漏选（按选中比例得 '+res.score.toFixed(1)+' 分）</span>':'')+'</div>'
        +(q.missingImage?'<div class="missnote">本题原卷含图形/图片，公开题库中该图片缺失，因此本题不计入总分，仅供参看解析。</div>':'')
        +(q.sourceNote?'<div class="missnote" style="background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d">'+esc(q.sourceNote)+'</div>':'')
        +(q.redacted?'<div class="missnote">本题题干在公开题库中被特殊符号遮挡，可能与原卷有出入，仅作参考。</div>':'')
        +'<div class="eh">解析</div>'+(q.explanation&&q.explanation.length>3?q.explanation:'<p>（本题在公开题库中暂无有效解析）</p>');
    });
  });

  // result panel
  var acc=g.all?(g.right/g.all*100).toFixed(1):"0.0";
  var level, lvcls;
  if(g.got>=80){level="优秀：已达到国考行测进面常见水平，保持手感即可";lvcls="ok"}
  else if(g.got>=70){level="良好：基础扎实，重点补短板模块可再提 5~10 分";lvcls="ok"}
  else if(g.got>=60){level="及格线附近：需要专攻正确率最低的模块";lvcls="mid"}
  else {level="待提升：建议先分模块限时刷题，再回头做整套";lvcls="no"}

  var rows=g.mods.map(function(s){
    var rate=s.count-s.blank? (s.right/(s.count-s.blank)*100):0;
    var cls=rate>=75?"ok":rate>=60?"mid":"no";
    var att=s.answerable-s.blank? (s.right/(s.answerable-s.blank)*100):0;
    return '<tr><td>'+esc(s.label)+'</td><td>'+s.count+(s.answerable!==s.count?'<span style="color:#8a6414">（'+s.answerable+'）</span>':'')+'</td><td>'+s.points+'</td>'
      +'<td>'+s.right+'</td><td>'+s.partial+'</td><td>'+s.wrong+'</td><td>'+s.blank+'</td>'
      +'<td>'+s.got.toFixed(1)+'</td><td><span class="pill '+cls+'">'+att.toFixed(0)+'%</span></td></tr>';  }).join("");

  var bars=g.mods.map(function(s){
    var pct=s.points? Math.min(100,s.got/s.points*100):0;
    return '<div class="mrow"><span class="mlab">'+esc(s.label)+'</span>'
      +'<span class="mtrack"><i class="mfill" style="width:'+pct.toFixed(1)+'%"></i></span>'
      +'<span class="mval">'+s.got.toFixed(1)+' / '+s.points+'</span></div>';
  }).join("");

  var html='<div class="result" id="resultTop">'
    +'<div class="score-row">'
    +'<div class="dial" style="--p:'+g.got.toFixed(1)+'"><div class="v"><b>'+g.got.toFixed(1)+'</b><span>总分 / 100</span></div></div>'
    +'<div class="score-facts">'
    +'<div class="fact"><span>正确题数</span><b>'+g.right+' / '+g.all+'</b></div>'
    +'<div class="fact"><span>正确率</span><b>'+acc+'%</b></div>'
    +'<div class="fact"><span>用时</span><b>'+fmtDur(state.used)+'</b></div>'
    +'<div class="fact"><span>交卷方式</span><b>'+(auto?"时间到自动交卷":"主动交卷")+'</b></div>'
    +'</div></div>'
    +'<div class="verdict"><b>评级：</b>'+level+'</div>'
    +'<table class="mods"><thead><tr><th>模块</th><th>题量（计分）</th><th>满分</th><th>对</th><th>漏选</th><th>错</th><th>未答</th><th>得分</th><th>答对率</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:13.5px;color:#667085;margin:18px 0 8px">模块得分率</h3><div class="modchart">'+bars+'</div>'
    +'<div class="tips" style="margin-top:14px">下方每道题已标出<b>正确答案、你的选择与官方解析</b>；答题卡中<span style="color:#12925a;font-weight:700">绿色为答对</span>、<span style="color:#d2372e;font-weight:700">红色为答错</span>。答对率 = 答对题数 ÷ 已作答题数（不含未作答）。</div>'
    +'</div>';

  $("#main").insertAdjacentHTML("afterbegin",html);
  renderCard();renderProgress();renderClock();
  $("#submitBtn").disabled=true;
  window.scrollTo({top:0,behavior:already?"auto":"smooth"});
  if(!silent) toast(auto?"时间到，已自动交卷评分":"已交卷评分");
}

/* ---------------- dialogs ---------------- */
function openDialog(html){$("#dialog").innerHTML=html;$("#mask").classList.add("on")}
function closeDialog(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",function(e){if(e.target===$("#mask"))closeDialog()});

function askSubmit(){
  if(state.submitted){toast("本卷已交卷");return}
  var p=paper(), all=0, done=0;
  p.modules.forEach(function(m){eachQuestion(m,function(q){all++;if(state.answers[q.no])done++})});
  openDialog('<h3>确认交卷？</h3><p>共 '+all+' 题，已作答 <b>'+done+'</b> 题，未作答 <b>'+(all-done)+'</b> 题。交卷后将立即显示答案与解析，并自动评分。</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">继续答题</button><button class="btn primary" data-x="ok">确认交卷</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();doSubmit(false)}else closeDialog();
  };
}

function askRetry(){
  openDialog('<h3>重做本卷</h3><p>清空本卷所有作答记录并重新计时，答案与解析会重新隐藏。确定吗？</p>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">清空重做</button></div>');
  $("#dialog").onclick=function(e){
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){closeDialog();resetPaper(true)}else closeDialog();
  };
}

function openSettings(){
  openDialog('<h3>考试设置</h3>'
    +'<div class="rows">'
    +'<div class="row"><label>考试时长</label><input type="number" id="durMin" min="5" max="300" value="'+Math.round(state.duration/60)+'" style="width:90px"> 分钟'
    +'<span style="color:#667085;font-size:12.5px">（国考行测通常 120 分钟）</span></div>'
    +'<div class="row"><label>快捷选择</label>'
    +'<button class="btn" data-d="90">90 分钟</button><button class="btn" data-d="120">120 分钟</button><button class="btn" data-d="150">150 分钟</button></div>'
    +'<p>提示：设置仅对本次未交卷状态生效；倒计时结束会自动交卷评分。作答进度自动保存在本机浏览器中，关闭页面后再次打开可继续。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存并重新计时</button></div>');
  $("#dialog").onclick=function(e){
    var d=e.target.closest("[data-d]");
    if(d){$("#durMin").value=d.dataset.d;return}
    var b=e.target.closest("[data-x]"); if(!b)return;
    if(b.dataset.x==="ok"){
      var v=Number($("#durMin").value);
      if(!v||v<5||v>300){toast("请输入 5~300 之间的分钟数");return}
      state.duration=v*60; state.remain=v*60; state.used=0; state.paused=false;
      save();closeDialog();renderClock();startTimer();toast("已按 "+v+" 分钟重新计时");
    } else closeDialog();
  };
}

function resetPaper(restart){
  drop(skey());
  state.answers={}; state.submitted=false; state.used=0; state.remain=state.duration; state.paused=false;
  renderAll(); save();
  if(restart){startTimer();toast("已重置本卷，重新计时")}
}

/* ---------------- paper switching ---------------- */
function renderPicker(){
  var box=$("#paperPick");
  if(BUNDLE.papers.length<2){box.innerHTML="";return}
  box.innerHTML='<span>切换试卷</span><select id="paperSel">'
    +BUNDLE.papers.map(function(p,i){return '<option value="'+i+'"'+(i===state.pi?" selected":"")+'>'+esc(p.title)+'</option>'}).join("")
    +'</select>';
  box.querySelector("select").addEventListener("change",function(e){
    stopTimer();
    state.pi=Number(e.target.value);
    state.answers={};state.submitted=false;state.used=0;state.remain=state.duration;state.paused=false;
    state.started=false;
    load();
    renderAll();
    $("#submitBtn").disabled=state.submitted;
    startTimer();
    window.scrollTo({top:0});
    toast("已切换到 "+paper().title);
  });
}

function renderAll(){
  renderPaper(); renderCard(); renderProgress(); renderClock();
  $("#submitBtn").disabled=state.submitted;
  $("#pauseBtn").disabled=state.submitted;
}

/* ---------------- boot ---------------- */
function boot(){
  if(!BUNDLE||!BUNDLE.papers||!BUNDLE.papers.length){
    $("#main").innerHTML='<div class="result">题库数据缺失。</div>';return;
  }
  renderPicker();
  var had=load();
  renderAll();
  bindMain();
  $("#submitBtn").addEventListener("click",askSubmit);
  $("#retryBtn").addEventListener("click",askRetry);
  $("#cardBtn").addEventListener("click",function(){
    var s=$("#side");
    window.scrollTo({top:s.getBoundingClientRect().top+window.pageYOffset-96,behavior:"smooth"});
  });
  $("#settingsBtn").addEventListener("click",openSettings);
  $("#pauseBtn").addEventListener("click",function(){
    if(state.submitted)return;
    state.paused=!state.paused;
    state.lastTick=Date.now();
    renderClock(); save();
    toast(state.paused?"已暂停计时":"继续计时");
  });
  if(state.submitted){
    doSubmit(true, true);   // re-paint graded view without re-saving or toasting
  } else {
    state.lastTick=Date.now();
    startTimer();
  }
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){state.lastTick=Date.now();save()}
    else if(!state.submitted&&!state.paused){state.lastTick=Date.now()}
  });
  if(!had) save();
}
boot();
})();
</script>
</body>
</html>
