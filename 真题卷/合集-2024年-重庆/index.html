泉处时，喷泉中的水接触到空气会吸收空气中的热量而蒸发，从而冷却空气，符合“水会吸收空气的热量而蒸发从而冷却空气”，符合定义，排除；\nC项：沿海国家在风口建造风车，利用空气流动驱动扇叶时，没有体现水会接触到空气而蒸发，不符合“水会吸收空气的热量而蒸发从而冷却空气”，不符合定义，当选；\nD项：将冷水输送到屋顶，冷水从房檐四周流下形成水帘时，水接触到空气会吸收空气中的热量而蒸发，从而冷却空气，符合“水会吸收空气的热量而蒸发从而冷却空气”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":81,"missingImage":false},{"type":"question","qid":"16593209","cat":"定义判断","stem":"政策合成谬误，是指从各部门来看，每项政策都是对的，组合起来实施时却是错的。政策分解谬误，是指不该分解的系统性任务被分解了，有的分解到各部门、各地方，有的分解到各个时间段。\n根据上述定义，下列属于政策分解谬误的是：","options":{"A":"为了让居民买得起房，某省各部门实施了一系列举措调控房价，几年后该省的房地产商数量明显减少","B":"为了推动乡村振兴，某乡镇决定帮扶辖区内村民养殖黑山羊，一年后黑山羊数量剧增，导致附近山林遭到破坏","C":"为了加快新能源产业的发展，某省出台政策鼓励居民购买电动汽车，半年后发现，该省范围内充电桩数量严重不足","D":"某地政府欲出台一部环境卫生管理条例，其中各部分内容被分配到相关部门草拟，但最终统筹草案后发现各部分之间难以衔接"},"answer":"D","explanation":"第一步：找出定义关键词。\n政策合成谬误：“从各部门来看，每项政策都是对的”、“组合起来实施时却是错的”；\n政策分解谬误：“不该分解的系统性任务被分解了”、“有的分解到各部门、各地方，有的分解到各个时间段”。\n第二步：逐一分析选项。\nA项：为了让居民买得起房，某省各部门实施了一系列举措调控房价，符合“从各部门来看，每项政策都是对的”，但几年后该省的房地产商数量明显减少，说明最终的结果可能并不好，符合“组合起来实施时却是错的”，符合“政策合成谬误”定义，不符合“政策分解谬误”定义，排除；\nB项：某乡镇决定帮扶辖区内村民养殖黑山羊，没有体现出政策被分解，不符合“不该分解的系统性任务被分解了”，不符合“政策分解谬误”定义，排除；\nC项：某省出台政策鼓励居民购买电动汽车，没有体现出政策被分解，不符合“不该分解的系统性任务被分解了”，不符合“政策分解谬误”定义，排除；\nD项：某地政府欲出台一部环境卫生管理条例，是一个系统性的任务，其中各部分内容被分配到相关部门草拟，符合“有的分解到各部门、各地方，有的分解到各个时间段”，但最终统筹后发现各部分难以衔接，说明该任务不应该被分解，符合“不该分解的系统性任务被分解了”，符合“政策分解谬误”定义，当选。\n故正确答案为D。","no":82,"missingImage":false},{"type":"question","qid":"16593009","cat":"定义判断","stem":"肿瘤侵犯，指的是肿块发展后引起相邻部位的反应和变化。肿瘤浸润，是指肿瘤细胞发展扩大透过原发部位的浆膜层转移到相邻组织和器官。肿瘤转移，指肿瘤由原发器官通过血液、淋巴等方式到达另一个远处器官。\n根据上述定义，下列属于肿瘤侵犯的是：","options":{"A":"宋阿姨近期体检发现患有乳腺癌，医生告知癌细胞已到达胸壁组织","B":"经检查，老赵的肺部有五个毛玻璃结节，医生提醒他要定期复查","C":"老王的胰腺肿瘤经过三个月的无效治疗已经蔓延到肝脏","D":"老张肺部的肿块碰触心脏薄膜，引起心包积液"},"answer":"D","explanation":"第一步：找出定义关键词。\n肿瘤侵犯：“肿块发展后引起相邻部位的反应和变化”；\n肿瘤浸润：“肿瘤细胞发展扩大透过原发部位的浆膜层转移到相邻组织和器官”；\n肿瘤转移：“肿瘤由原发器官通过血液、淋巴等方式到达另一个远处器官”。\n第二步：逐一分析选项。\nA项：癌细胞到达了胸壁组织，但无法确定是否引起了胸壁组织的反应和变化，不符合“引起相邻部位的反应和变化”，不符合“肿瘤侵犯”定义，排除；\nB项：检查出老赵的肺部有结节，并未涉及其他部位，不符合“肿块发展后引起相邻部位的反应和变化”，不符合“肿瘤侵犯”定义，排除；\nC项：胰腺肿瘤蔓延到了肝脏，但无法确定是否引起了肝脏的反应和变化，不符合“引起相邻部位的反应和变化”，不符合“肿瘤侵犯”定义，排除；\nD项：肺部肿块碰触心脏薄膜，符合“肿块发展”，引起心包积液，符合“引起相邻部位的反应和变化”，符合“肿瘤侵犯”定义，当选。\n故正确答案为D。","no":83,"missingImage":false},{"type":"question","qid":"16592930","cat":"定义判断","stem":"生物学重复是指对不同生物个体或者不同生物群体的样品采用相同的处理方式进行实验。技术重复则是指对同一样品进行的多次相同实验。\n根据上述定义，下列属于生物学重复的是：","options":{"A":"采集小王的血样一次并采用三种不同方式分别进行一次检测","B":"采用三种不同方式对分三次采集的小王血样各进行一次检测","C":"采集小王、小李、小张三人的血样并用同样方式分别进行一次检测","D":"采集小王、小李、小张三人的血样混合后用三种方式进行三次检测"},"answer":"C","explanation":"第一步：找出定义关键词。\n生物学重复：“不同生物个体或者不同生物群体的样品”、“采用相同的处理方式”；\n技术重复：“同一样品”、“多次相同实验”。\n第二步：逐一分析选项。\nA项：仅采集小王的血样一次，不符合“不同生物个体或者不同生物群体的样品”，采用三种不同方式，不符合“采用相同的处理方式”，不符合“生物学重复”定义，排除；\nB项：采用三种不同方式，不符合“采用相同的处理方式”，分三次采集的都是小王血样，不符合“不同生物个体或者不同生物群体的样品”，不符合“生物学重复”定义，排除；\nC项：采集小王、小李、小张三人的血样，符合“不同生物个体或者不同生物群体的样品”，用同样方式分别进行一次检测，符合“采用相同的处理方式”，符合“生物学重复”定义，当选；\nD项：用三种方式进行三次检测，不符合“采用相同的处理方式”，不符合“生物学重复”定义，排除。\n故正确答案为C。","no":84,"missingImage":false},{"type":"question","qid":"16593213","cat":"定义判断","stem":"“嗜睡”是一种睡眠失调现象，患者会持续感到极端疲倦，昏昏欲睡，往往会在毫无预警的情况下睡着，甚至是在活动中途突然入睡。“醉睡”则指酒醒后并没有完全清醒的状态，“醉睡”往往伴随混乱、迷惑、甚至暴力反应和失忆。\n根据上述定义，下列选项未体现“嗜睡”或“醉睡”的是：","options":{"A":"昨夜雨疏风骤，浓睡不消残酒","B":"终日昏昏醉梦间，忽闻春尽强登山","C":"老眠早觉常残夜，病力先衰不待年","D":"临川税驾忽数月，嗜睡爱闲常闭门"},"answer":"C","explanation":"第一步：找出定义关键词。\n嗜睡：“睡眠失调现象”、“持续感到极端疲倦，昏昏欲睡”、“在毫无预警的情况下睡着”；\n醉睡：“酒醒后并没有完全清醒的状态”、“伴随混乱、迷惑、甚至暴力反应和失忆”。\n第二步：逐一分析选项。\nA项：诗句意思是昨夜雨下得稀疏，风刮得很急，酣睡一夜，然而醒来之后依然觉得还有一点酒意没有消尽，符合“酒醒后并没有完全清醒的状态”，符合“醉睡”定义，排除；\nB项：诗句意思是整日昏昏沉沉恍若梦中，忽然发现春天即将过去便强打精神登山赏景，符合“睡眠失调现象”、“持续感到极端疲倦，昏昏欲睡”，符合“嗜睡”定义，排除；\nC项：诗句意思是人老了之后晚上睡眠很少，常常很早就醒来，坐送残夜，等待天晓，因为有病，身体早早地衰老，恐怕不到致仕之年，就要告老还乡了，说的是年老之后睡眠变少，不符合定义，当选；\nD项：诗句意思是在临川休息住宿一晃几个月过去了，喜欢睡觉热爱闲适不被打扰，所以经常闭门谢客，符合“持续感到极端疲倦，昏昏欲睡”，符合“嗜睡”定义，排除。\n本题为选非题，故正确答案为C。","no":85,"missingImage":false},{"type":"question","qid":"16593036","cat":"类比推理","stem":"牡丹花：牵牛花","options":{"A":"金枪鱼：八爪鱼","B":"东北菜：黄花菜","C":"布谷鸟：啄木鸟","D":"变色龙：霸王龙"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“牡丹花”和“牵牛花”是两种不同的花，二者为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：“金枪鱼”是鱼类，而“八爪鱼”是软体动物，二者不是并列关系，与题干逻辑关系不一致，排除；\nB项：“东北菜”是东北地区的本土菜系，“黄花菜”是一种可以食用的植物，二者不是并列关系，与题干逻辑关系不一致，排除；\nC项：“布谷鸟”和“啄木鸟”是两种不同的鸟，二者为并列关系，与题干逻辑关系一致，当选；\nD项：“变色龙”是一种爬行动物，“霸王龙”是一种恐龙，而变色龙不是恐龙，二者不是并列关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":86,"missingImage":false},{"type":"question","qid":"16593010","cat":"类比推理","stem":"伸延：延伸","options":{"A":"登攀：攀登","B":"喜欢：欢喜","C":"生产：产生","D":"等次：次等"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n伸延，指的是伸展、延伸；延伸，指的是延长伸展，二者为近义关系。\n第二步：判断选项词语间逻辑关系。\nA项：登攀，指攀援登高，也指进取；攀登，指的是抓住东西向上爬，也比喻不畏艰险,积极进取，二者为近义关系，与题干逻辑关系一致，保留；\nB项：喜欢，指的是对人或事物有好感或感兴趣，也指愉快、高兴；欢喜，指快乐、高兴，也指喜欢、喜爱，二者是近义关系，与题干逻辑关系一致，保留；\nC项：生产，指的是人们通过工具来创造各种生活和生产资料；产生，指的是由已有的事物中派生出新的事物，二者不是近义关系，与题干逻辑关系不一致，排除；\nD项：等次，指的是等级高下次序；次等，指的是第二等的，低于或次于最好的，二者不是近义关系，与题干逻辑关系不一致，排除。\n比较A、B两项，题干和A选项的词汇都只是动词，而B选项的欢喜既可以做动词也可以做形容词，故A项与题干逻辑关系更一致。\n故正确答案为A。","no":87,"missingImage":false},{"type":"question","qid":"16593210","cat":"类比推理","stem":"网箱养殖：深海养殖","options":{"A":"网络设备：无线网卡","B":"成人教育：职业教育","C":"载人飞船：返回舱","D":"娱乐项目：剧本杀"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n有的网箱养殖是深海养殖，有的网箱养殖不是深海养殖，有的深海养殖是网箱养殖，有的深海养殖不是网箱养殖，二者为交叉关系。\n第二步：判断选项词语间逻辑关系。\nA项：无线网卡是一种网络设备，二者为种属关系，与题干逻辑关系不一致，排除；\nB项：有的成人教育是职业教育，有的成人教育不是职业教育，有的职业教育是成人教育，有的职业教育不是成人教育，二者为交叉关系，与题干逻辑关系一致，当选；\nC项：返回舱是载人飞船的一部分，二者为组成关系，与题干逻辑关系不一致，排除；\nD项：剧本杀是一种娱乐项目，二者为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":88,"missingImage":false},{"type":"question","qid":"16593027","cat":"类比推理","stem":"兵符：信物","options":{"A":"七律：绝句","B":"汉字：偏旁","C":"干戈：战争","D":"寒露：节气"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n兵符是古代帝王授予兵权和调发军队的信物，兵符是一种信物，二者为种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：七律是律诗的一种，绝句和律诗均是格律诗的一种，七律和绝句不是种属关系，与题干逻辑关系不一致，排除；\nB项：偏旁是组成汉字的一部分，二者为组成关系，与题干逻辑关系不一致，排除；\nC项：干为防具，戈为武器，二者均为古代兵器，因此后以“干戈”用作兵器的通称，后来引申为指战争，干戈和战争为比喻象征义，与题干逻辑关系不一致，排除；\nD项：寒露，是二十四节气之第十七个节气，秋季的第五个节气，寒露是一种节气，二者为种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":89,"missingImage":false},{"type":"question","qid":"16593206","cat":"类比推理","stem":"泡沫经济：实体经济：通货膨胀","options":{"A":"生态农业：传统农业：稻田养鱼","B":"清洁能源：传统能源：污染减少","C":"生理反应：心理反应：望梅止渴","D":"自然现象：社会现象：火山爆发"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n泡沫经济指因投机交易极度活跃，金融证券、房地产等的市场价格脱离实际价值大幅上涨，造成表面繁荣的经济现象；实体经济指一个国家生产的商品价值总量，是人们通过思想、使用工具在地球上创造的经济；当泡沫经济越多而实体经济越少时，就会产生通货膨胀的现象，三者为因果对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：生态农业是指按照生态学原理，应用现代科学技术进行集约经营管理的综合农业生产体系，传统农业是指采用传统手工劳动方式和生产技术的农业，二者为并列关系，稻田养鱼是一种生态农业，二者为种属关系，与题干逻辑关系不一致，排除；\nB项：清洁能源是指开发利用过程中不产生或很少产生污染物的能源，如风能、水能、太阳能、地热能等，传统能源是指已经大规模生产和广泛利用的能源，当使用的清洁能源越多而传统能源越少时，能让污染减少，三者为因果对应关系，与题干逻辑关系一致，当选；\nC项：生理反应是个体受到外界刺激而使机体有所反应的一种紧张状态，心理反应是指人们在面对客观事物时产生的主观体验，包括情感、思维和行为等方面的变化，二者为并列关系，望梅止渴是一种生理反应，二者为种属关系，与题干逻辑关系不一致，排除；\nD项：自然现象是指自然界中由于大自然的运作规律自发形成的某种状况，社会现象是指所有与同物种共同体有关的活动产生、存在和发展密切联系的现象，二者为并列关系，火山爆发是一种自然现象，二者为种属关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":90,"missingImage":false},{"type":"question","qid":"16592936","cat":"类比推理","stem":"热传递：热传导：热辐射","options":{"A":"隔离：冷却：灭火","B":"混合物：化合物：纯净物","C":"播种：撒播：条播","D":"说明文：举例子：作比较"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n热传递是物理学上的一个物理现象，是指由于温度差引起的热能传递现象，热传递主要存在三种基本形式：热传导、热辐射和热对流。热传导和热辐射为并列关系，分别与热传递构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：隔离和冷却是两种不同的灭火方式，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：混合物是指由两种或两种以上的单质或化合物混合而成的物质，化合物是指由两种或两种以上不同元素组成的纯净物，纯净物是指由一种单质或一种化合物组成的聚合物。混合物与纯净物为并列关系，化合物与纯净物为种属关系，与题干逻辑关系不一致，排除；\nC项：撒播是指把作物的种子均匀地撒在地里，必要时进行覆土的播种方式，条播是指沿着一条浅犁沟撒布种子的播种方式。撒播和条播是两种不同的播种方式，二者为并列关系，分别与播种构成种属关系，与题干逻辑关系一致，当选；\nD项：举例子和作比较是写说明文采用的两种不同的写作手法，二者为并列关系，分别与说明文构成对应关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":91,"missingImage":false},{"type":"question","qid":"16593007","cat":"类比推理","stem":"锁骨：肋骨：坐骨","options":{"A":"头脑：头皮：头发","B":"腹腔：口腔：鼻腔","C":"盲肠：大肠：直肠","D":"颈椎：胸椎：腰椎"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n锁骨、肋骨、坐骨是三种不同的人体骨骼，三者为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：头脑由头发、头皮、肌肉、骨骼和脑体组成，后两词均与第一词构成组成关系，与题干逻辑关系不一致，排除；\nB项：腹腔、口腔、鼻腔是三种不同的人体部位，三者为并列关系，与题干逻辑关系一致，保留；\nC项：大肠是消化管的下段，可分为盲肠、阑尾、结肠、直肠和肛管5部分，第一词与第三词为并列关系，且均与第二词构成组成关系，与题干逻辑关系不一致，排除；\nD项：颈椎、胸椎、腰椎是三种不同的椎骨，三者为并列关系，与题干逻辑关系一致，保留。\n对比B、D两项，题干中锁骨、肋骨、坐骨所在的位置依次为从上到下，B项中腹腔、口腔、鼻腔所在的位置依次为从下到上，而D项中颈椎、胸椎、腰椎所在的位置依次为从上到下，因此D项与题干逻辑关系更为一致，当选。\n故正确答案为D。","no":92,"missingImage":false},{"type":"question","qid":"16593015","cat":"类比推理","stem":"服装：唐装：西装","options":{"A":"刷牙：牙刷：牙膏","B":"豪车：赛车：轿车","C":"旗帜：国旗：红旗","D":"武术：太极拳：咏春拳"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n唐装和西装是两种不同的服装，后两词为并列关系，且均与第一词构成种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：牙刷和牙膏是刷牙时配套使用的工具，后两词为配套使用关系，与题干逻辑关系不一致，排除；\nB项：豪车、赛车和轿车是从不同的划分角度命名的汽车，三者互为交叉关系，与题干逻辑关系不一致，排除；\nC项：有的国旗是红旗，有的国旗不是红旗，有的红旗是国旗，有的红旗不是国旗，后两词为交叉关系，与题干逻辑关系不一致，排除；\nD项：太极拳和咏春拳是两种不同的武术，后两词为并列关系，且均与第一词构成种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":93,"missingImage":false},{"type":"question","qid":"16593000","cat":"类比推理","stem":"缘木求鱼 对于 （    ） 相当于 （    ） 对于 抱薪救火","options":{"A":"事与愿违 抽薪止沸","B":"南辕北辙 通宵达旦","C":"刻舟求剑 纵风止燎","D":"扬汤止沸 凿壁偷光"},"answer":"C","explanation":"逐一代入选项。\nA项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“事与愿违”指事情的发展与主观愿望相反，二者无明显逻辑关系；“抽薪止沸”意思是抽掉锅底下的柴火，使锅里的水不再翻滚，比喻从根本上解决问题，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者是反义关系，前后逻辑关系不一致，排除；\nB项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“南辕北辙”指心里想往南去，却驾车往北走，比喻行动和目的相反，二者无明显逻辑关系；“通宵达旦”指的是从入夜直到天亮，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“刻舟求剑”比喻看问题做事情死板不灵活，不知情随势变，二者是近义关系；“纵风止燎”指的是用鼓风的方法灭火，比喻本欲消弭其事，却反而助长其声势，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者是近义关系，前后逻辑关系一致，当选；\nD项：“缘木求鱼”指爬上树去找鱼，比喻行事的方向、方法不对，一定达不到目的，“扬汤止沸”指把锅里烧的沸水舀起来再倒回去，想叫它不沸腾，比喻办法不对头，不能从根本上解决问题，二者是近义关系；“凿壁偷光”原指西汉匡衡凿穿墙壁引邻舍之烛光读书，后用来形容家贫而读书刻苦，“抱薪救火”比喻因为方法不对，虽然有心消灭祸患，结果反而使祸患扩大，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"16593030","cat":"类比推理","stem":"数字经济 对于 （    ） 相当于 （    ） 对于 人工智能","options":{"A":"信息工具 家用电器","B":"信息技术 无人驾驶","C":"数字资源 现代农业","D":"数字货币 远程医疗"},"answer":"B","explanation":"逐一代入选项。\nA项：数字经济是以新一代信息技术为依托的一种新经济形态，数字经济一定需要利用信息工具，二者为必然利用的对应关系；家用电器可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除；\nB项：数字经济一定需要利用信息技术，二者为必然利用的对应关系；无人驾驶一定需要利用人工智能，二者为必然利用的对应关系，前后逻辑关系一致，当选；\nC项：数字经济一定需要利用数字资源，二者为必然利用的对应关系；现代农业可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除；\nD项：数字经济的发展导致了数字货币的产生，二者为产物的对应关系；远程医疗可能需要利用人工智能，二者为或然利用的对应关系，前后逻辑关系不一致，排除。\n故正确答案为B。","no":95,"missingImage":false},{"type":"question","qid":"16592994","cat":"逻辑判断","stem":"白居易在《荔枝图序》中言道：“若离本枝，一日而色变，二日而香变，三日而味变，四五日外，色香味尽去矣。”研究表明，荔枝难以保鲜是因为果实的呼吸强度很高，导致果实品质急剧下降。\n以下哪项如果为真，最能支持上述研究结论？","options":{"A":"荔枝的可食用部位不是像桃子那样的果皮，而是“假果皮”，它与外皮之间没有直接的维管束相连，外皮失水时不能直接从果肉处获得补充","B":"荔枝离枝后会继续分解糖分：氧气充足时，糖分会分解为二氧化碳；氧气不足时，糖分会转化为一些影响风味的醇、醛类物质","C":"荔枝自身会不断产生乙烯，加速果实成熟甚至腐烂，自然更容易变质","D":"荔枝花能产生花蜜，并且它们的蜜腺很发达，是很好的蜜源植物"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：荔枝难以保鲜是因为果实的呼吸强度很高，导致果实品质急剧下降。\n论据：无。\n本题只有论点没有论据，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：该项讨论的是荔枝的可食用部位是“假果皮”以及外皮失水时的情况，但外皮失水与论点中果实的呼吸强度无明确关联，话题不一致，无法加强，排除；\nB项：该项讨论的是荔枝离枝后会继续分解糖分，以及分别在氧气充足时和氧气不足时的糖分转化情况，说明荔枝的果实确实存在呼吸作用，补充论据，可以加强，当选；\nC项：该项讨论的是荔枝自身不断产生的乙烯会导致其变质，但乙烯的产生与论点中果实的呼吸强度无明确关联，话题不一致，无法加强，排除；\nD项：该项讨论的是荔枝花能产生花蜜，与论点中果实的呼吸强度完全无关，话题不一致，无法加强，排除。\n故正确答案为B。","no":96,"missingImage":false},{"type":"question","qid":"16593005","cat":"逻辑判断","stem":"长期只给中老年人提供一些对大脑神经系统有益的营养素，如DHA、抗氧化剂等，对预防脑力衰老似乎没有明显的效果，但改变整体的膳食模式则有利于延缓中老年人的认知退化。研究者发现地中海膳食和得舒膳食模式能保护老年人的认知能力。绿叶蔬菜、鱼类和全谷物是这两种膳食模式强调要充分摄入的三类核心食物。此外，还要严格限制油炸、高盐、甜食饮料等，因为它们不利于预防肥胖和三高，而这些则都是加剧认知退化的重要因素。\n以下哪项如果为真，最能支持上述研究发现？","options":{"A":"食用蔬果总量高的老年人认知能力保持得较好","B":"地中海膳食、得舒膳食等饮食模式有利于延缓认知退化","C":"预防脑力衰老仅靠摄入营养素或改变整体的膳食模式是不够的","D":"全谷物有利于控制血糖，绿叶蔬菜有利于改善血脂，鱼类所含的脂肪酸更易消化"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：地中海膳食和得舒膳食模式能保护老年人的认知能力。\n论据：绿叶蔬菜、鱼类和全谷物是这两种膳食模式强调要充分摄入的三类核心食物。此外，还要严格限制油炸、高盐、甜食饮料等，因为它们不利于预防肥胖和三高，而这些则都是加剧认知退化的重要因素。\n本题论点和论据都在说地中海膳食和得舒膳食模式与老年人认知之间的关系，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是蔬果总量高的老年人认知能力保持得较好，但论点中的地中海膳食和得舒膳食模式并没有强调摄入的蔬果总量要高，话题不一致，无法加强，排除；\nB项：该项说的是地中海膳食、得舒膳食等饮食模式有利于延缓认知退化，但没有详细展开说明这两种饮膳食模式如何延缓认知退化，只是简单对论点进行重复，可以加强，保留；\nC项：该项说的是预防脑力衰老不能仅靠摄入营养素或改变整体的膳食模式，而论点说的是地中海膳食和得舒膳食模式能否保护老年人的认知能力，话题不一致，无法加强，排除；\nD项：该项说的是全谷物、绿叶蔬菜、鱼类三种食物分别可以控制血糖、改善血脂、易被消化，说明按照论点中的两种膳食模式摄入的三类核心食物可以帮助控制三高（高血压、高血糖、高血脂），而论据中提到“三高是加剧认知退化的重要因素”，这表明地中海膳食和得舒膳食模式确实能延缓认知退化、保护老年人的认知能力，解释原因，可以加强，保留。\n对比B、D两项，B项只是重复论点，而D项解释说明了“膳食模式中的三类核心食物”与“三高”之间的关系，是对论证逻辑的补充，加强力度强于简单重复论点，故D项更为合适。\n故正确答案为D。","no":97,"missingImage":false},{"type":"question","qid":"16593021","cat":"逻辑判断","stem":"对世界上最常见的火山类型而言，含水量较高的岩浆往往储存在地壳更深处。水在很大程度上引发并助长了火山爆发，岩浆的含水量越多，岩浆上升得越快，喷发就越猛烈。此时，岩浆的浮力不再是岩浆喷发的关键，岩浆中越多的水分含量才意味着越多的气泡和潜在更猛烈的喷发。\n以下哪项如果为真，最能加强上述研究发现？","options":{"A":"岩浆之所以能通过地壳裂缝上升，是因为岩浆比周围岩石的浮力更大","B":"若除水外还有额外的浮力，也会在火山被触发时将更多的岩浆带到地面","C":"水和岩浆的混合物在上升过程中有时会发生脱气现象，使混合物变得更加粘稠，导致上升缓慢甚至停滞","D":"水和岩浆的混合物储存在火山中，当岩浆上升到地表附近后，压力下降就会形成气泡，气泡迅速膨胀导致岩浆喷射而出"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：水在很大程度上引发并助长了火山爆发，岩浆的含水量越多，岩浆上升得越快，喷发就越猛烈。此时，岩浆的浮力不再是岩浆喷发的关键，岩浆中越多的水分含量才意味着越多的气泡和潜在更猛烈的喷发。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项说的是因为岩浆浮力更大，所以岩浆能上升，强调了浮力对岩浆上升的重要性，而论点说的是岩浆的含水量越多则岩浆喷发得越猛烈，浮力并不是岩浆喷发的关键，削弱论点，无法加强，排除；\nB项：该项说的是除水之外的浮力对岩浆喷发的影响，而论点讨论的是岩浆的含水量对岩浆喷发的影响，为无关项，无法加强，排除；\nC项：该项说的是水和岩浆的混合物有时会导致岩浆上升缓慢，而论点说的是岩浆的含水量越多则岩浆喷发得越猛烈，削弱论点，无法加强，排除；\nD项：该项说的是水和岩浆的混合物在上升到地表附近后会因为压力下降形成气泡，气泡迅速膨胀导致岩浆喷射，解释了水越多就意味着气泡越多，进而会造成岩浆的猛烈喷发，补充论据，可以加强，当选。\n故正确答案为D。","no":98,"missingImage":false},{"type":"question","qid":"16592940","cat":"逻辑判断","stem":"某智库调查表明，某省2022年的长租房成交量呈不断上涨的趋势，排在全国前列，成交总量超过3000套，较去年增长超过40%，有效解决了新市民、青年人等群体的住房难题。因此有专家认为，加快发展长租房市场是我国解决住房难题的一剂良药。\n以下哪项如果为真，最能削弱上述结论？","options":{"A":"长租房市场发展时间短，目前缺乏有效监管","B":"2022年，我国的长租房市场规模已达1.73万亿元","C":"长租房无法享受与购房者同等的公共服务，在一二线城市难以推广","D":"有数据表明，我国租赁人口约有2.2亿，占流动人口总数的90%左右"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：加快发展长租房市场是我国解决住房难题的一剂良药。\n论据：某省2022年的长租房成交量呈不断上涨的趋势，排在全国前列，成交总量超过3000套，较去年增长超过40%，有效解决了新市民、青年人等群体的住房难题。\n本题的论点和论据均在讨论发展长租房能有效解决住房难题，二者话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项说的是长租房市场缺乏有效监管，论点说的是发展长租房能有效解决住房难题，话题不一致，无法削弱，排除；\nB项：该项说的是我国长租房市场的规模比较大，论点说的是发展长租房能有效解决住房难题，话题不一致，无法削弱，排除；\nC项：该项说的是长租房在一二线城市难以推广，说明发展长租房无法解决我国一二线城市的住房难题，削弱论点，可以削弱，当选；\nD项：该项说的是我国租赁人口多、占流动人口的比例大，说明我国租房需求大，需要发展租赁市场，补充论据，无法削弱，排除。\n故正确答案为C。","no":99,"missingImage":false},{"type":"question","qid":"16593018","cat":"逻辑判断","stem":"心理学家曾做过一个实验，将被试者分为两组，给他们看同一张交通事故的照片，并询问有关车速的问题。对第一组问“你认为是以多快的速度相撞的”，而对第二组则问“你认为是以多快的速度猛烈撞击到一起的”。后者是让人想到撞击非常猛烈的表达方式。一周后，再询问被试者“汽车的挡风玻璃是否撞碎了”（实际上并没有撞碎）。结果显示，回答“是”的人，第二组的比例比第一组多两倍以上。心理学家由此得出结论：人类的记忆并不是固定的，而是根据之后获取的信息而变化。\n以下哪项如果为真，最能削弱心理学家的结论？","options":{"A":"第二组被试者的人数比第一组的多","B":"第二组被试者的记忆力本来就偏弱","C":"时隔一周再询问的合理性有待斟酌","D":"两组被试者在认知水平上没有差距"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：人类的记忆并不是固定的，而是根据之后获取的信息而变化。\n论据：让两组被试者看同一张交通事故的照片，并询问有关车速的问题。第二组的问题是让人想到撞击非常猛烈的表达方式。一周后，再询问被试者“汽车的挡风玻璃是否撞碎了”（实际上并没有撞碎）。结果显示，回答“是”的人，第二组的比例比第一组多两倍以上。\n本题论据是用实验表明回答不同的问题对人的记忆力存在影响，论点是基于此得出的结论，二者话题一致，削弱优先考虑削弱论点，且论据是对比实验，也可指出实验起点不一致或实验不可靠。\n第二步：逐一分析选项。\nA项：该项指出两组被试者的人数存在差异，但实验对比的是各组中回答“是”的比例，与各组被试者的人数无关，为无关项，无法削弱，排除；\nB项：该项指出第二组被试者的记忆力本来就“偏弱”，说明两组被试者的“记忆力”本身就存在差异，即实验起点不一致，可以削弱，当选；\nC项：该项指出时隔一周再询问的合理性“有待斟酌”，不明确时隔一周再询问对被试者的回答是否会产生影响，为不明确项，无法削弱，排除；\nD项：该项指出两组被试者在认知水平上没有差距，说明实验起点一致，为加强项，无法削弱，排除。\n故正确答案为B。","no":100,"missingImage":false},{"type":"question","qid":"16592978","cat":"逻辑判断","stem":"与储存能量的白色脂肪细胞不同，棕色脂肪细胞会将能量以热的形式消耗掉。实验发现，正在死亡的棕色脂肪细胞会分泌出大量肌苷。接收到肌苷分子信号后，不仅周围的棕色细胞被激活，就连周围的白色脂肪细胞也被转化成棕色脂肪细胞。但是肌苷转运蛋白能将肌苷转至细胞内降低了细胞外的肌苷浓度，致使肌苷的“促燃”作用大打折扣。对照实验证实，喂食高能量饮食并同时使用肌苷转运蛋白抑制剂的小鼠仍然较瘦，且免受糖尿病的困扰。\n由此可以推出：","options":{"A":"肌苷能调节棕色脂肪细胞在生物体中的产热过程","B":"棕色脂肪细胞有助于身体维持体温，抵御寒冬","C":"刺激棕色脂肪细胞，能够增加身体能量燃烧","D":"干扰转运蛋白活性的物质可用于肥胖症治疗"},"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据第四句话“肌苷转运蛋白能将肌苷转至细胞内降低了细胞外的肌苷浓度，致使肌苷的‘促燃’作用大打折扣”可知，是“肌苷转运蛋白”可以调节产热过程，而不是“肌苷”，偷换概念，无法推出，排除；\nB项：根据第一句话“棕色脂肪细胞会将能量以热的形式消耗掉”可知，没有提及是否能维持体温，无中生有，无法推出，排除；\nC项：根据第一句话“棕色脂肪细胞会将能量以热的形式消耗掉”和第三句话“接收到肌苷分子信号后，不仅周围的棕色细胞被激活”可知，刺激棕色细胞后，棕色细胞会将能量燃烧，可以推出，当选；\nD项：题干讨论的是“肌苷转运蛋白”，但该项讨论的是“转运蛋白”，因此无法推出，排除。\n故正确答案为C。","no":101,"missingImage":false},{"type":"question","qid":"16593064","cat":"逻辑判断","stem":"目前，研究人员已可以利用基因组编辑技术，破坏致病基因或插入外源基因，来预防或治疗疾病。艾滋病（AIDS）是具有免疫功能的淋巴细胞感染了艾滋病病毒（HIV）造成的，在感染淋巴细胞时，HIV通过识别淋巴细胞表面一种名为CCR5的蛋白质，以此为记号并进行侵入。研究人员可以从患者身上采集淋巴细胞，对其进行基因组编辑，再把编辑后的淋巴细胞送回患者体内，达到治疗效果。\n要得到上述结论，需要补充的前提是：","options":{"A":"CCR5基因是AIDS的相关基因","B":"患者的淋巴细胞可以由直系亲属的淋巴细胞代替","C":"HIV面对丧失功能的CCR5，会找到淋巴细胞上的另一种CXCR4细胞来侵入","D":"基因组编辑技术可以使CCR5基因丧失功能，这样HIV就无法感染淋巴细胞了"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：研究人员可以从患者身上采集淋巴细胞，对其进行基因组编辑，再把编辑后的淋巴细胞送回患者体内，达到治疗效果。\n论据：艾滋病(AIDS）是具有免疫功能的淋巴细胞感染了艾滋病病毒(HIV）造成的，在感染淋巴细胞时，HIV通过识别淋巴细胞表面一种名为CCR5的蛋白质，以此为记号并进行侵入。\n本题提问为“需要补充的前提”，优先考虑搭桥和必要条件。论据讨论的是“淋巴细胞表面的CCR5”，论点讨论的是“对淋巴细胞进行基因组编辑”，二者话题不一致，优先考虑搭桥，即建立“CCR5”和“基因组编辑”之间的关系。\n第二步：逐一分析选项。\nA项：CCR5基因是艾滋病相关的基因，也就说明论据中所提到的艾滋病病毒会通过识别CCR5来侵入是真的，补充论据，可以加强，保留；\nB项：患者的淋巴细胞可以由直系亲属的淋巴细胞代替，但是不知道对淋巴细胞进行编辑了之后，是否能够治疗艾滋病，话题不一致，无法加强，排除；\nC项：HIV面对丧失功能的CCR5，会找另一种细胞进行侵入，说的是HIV对人体的攻击，但是论点讨论的是通过基因组编辑是否可以治疗艾滋病，话题不一致，无法加强，排除；\nD项：基因组编辑技术可以使CCR5基因丧失功能，题干中提到HIV是通过识别CCR5来侵入，而现在基因组编辑技术可以使CCR5基因丧失功能，因此HIV无法感染淋巴细胞，达到治疗效果，为搭桥项，可以加强，保留。\n比较A、D两项，A项为补充论据，D项为搭桥，搭桥的力度大于补充论据，D项当选。\n故正确答案为D。","no":102,"missingImage":false},{"type":"question","qid":"16593208","cat":"逻辑判断","stem":"土楼是客家文化的象征，主要集中在福建。其实，在广东潮汕地区也存在大量土楼，仅潮州饶平县就有781座。潮汕的土楼始建于元代，盛于明清，迄今已有700余年的营造史。专家认为，土楼生于乱世，是应潮客先民们聚族而居，集体防卫的需要而产生的。\n要得到上述结论，需要补充的前提是：","options":{"A":"在古老的土楼守护下，家族得以躲过漫长岁月中的种种侵袭和战乱","B":"潮汕历史上有过漫长的山海动荡，从明至清屡遭山贼、海盗的侵扰","C":"千百年来，大量的客家人和闽南人从陆路和水路迁入潮汕，带去了土楼文化","D":"潮汕地区古有“无村不寨”的说法，曾有大量军事性、封闭型的围寨，类型多样"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：土楼生于乱世，是应潮客先民们聚族而居，集体防卫的需要而产生的。\n论据：无。\n本题只有论点没有论据，且提问方式为“前提”，加强优先考虑必要条件。\n第二步：逐一分析选项。\nA项：该项指出家族在土楼的守护下躲过侵袭和战乱，说明土楼有防卫的作用，补充论据，可以加强，保留；\nB项：该项指出潮汕从明至清屡遭侵扰，如果潮汕未在此时期内遭受侵扰，那么就无需建造土楼用于防卫，是论点成立的必要条件，可以加强，保留；\nC项：该项指出土楼文化是由客家人和闽南人带来的，并未说明土楼因何而生，无法加强，排除；\nD项：该项指出潮汕曾有类型多样的围寨，并未说明土楼是因何而生的，无法加强，排除。\n对比A、B两项，B项必要条件的加强力度大于A项的补充论据，B项当选。\n故正确答案为B。","no":103,"missingImage":false},{"type":"question","qid":"16593011","cat":"类比推理","stem":"某单位由于工作需要，本周六必须安排赵、钱、孙、李、周、吴、郑7名工作人员值班，每个人都要值半天班，上午安排4人一起值班，下午安排3人一起值班。值班人员的分配满足下列条件：\n(1）赵和孙不在一起值班；\n(2）周和孙不在一起值班；\n(3）如果郑在下午值班，那么赵和李也在下午值班；\n(4）或者钱在上午值班，或者郑在下午值班。\n根据以上信息，必须在上午值班的工作人员是：","options":{"A":"钱和郑","B":"赵和郑","C":"赵和周","D":"吴和孙"},"answer":"A","explanation":"第一步：分析题干条件。\n(1）赵和孙不在一起值班；\n(2）周和孙不在一起值班；\n(3）郑下午值班\u003cimg data-k=\"a37757d411ef\">赵 且 李下午值班；\n(4）钱上午值班 或 郑下午值班；\n(5）上午4人值班，下午3人值班。\n第二步：根据题干条件进行推理。\n根据条件（1）（2）可知，赵和孙不在一起值班，周和孙也不在一起值班，那么赵和周在一起值班；结合条件（3），如果郑在下午值班，那么赵和李也在下午值班，此时周也应该在下午值班，下午值班的人数为4，与条件（5）矛盾，因此郑一定在上午值班；再结合条件（4），钱上午值班或郑下午值班，根据或关系“否一推一”可知，钱一定在上午值班，即钱和郑在上午值班。\n故正确答案为A。","no":104,"missingImage":false},{"type":"question","qid":"16593211","cat":"类比推理","stem":"学校计划开展暑期夏令营活动，就陈老师和林老师是否担任夏令营带队老师，几个家长纷纷猜测：\n吴妈妈：如果陈老师没去带队，林老师肯定也没去；\n李妈妈：陈老师是这个夏令营活动的策划者，她一定会去带队；\n郑妈妈：你们等着看吧，陈老师和林老师至少有一个人会去；\n张妈妈：我认为林老师会去带队，陈老师要回家探亲不会去。\n结果发现其中两个妈妈猜对了，两个妈妈猜错了。请问猜对了的妈妈是：","options":{"A":"李妈妈和郑妈妈","B":"吴妈妈和张妈妈","C":"吴妈妈和李妈妈","D":"郑妈妈和张妈妈"},"answer":"D","explanation":"第一步：分析题干找关系。\n吴妈妈：\u003cimg data-k=\"0be436194951\">陈老师带队\u003cimg data-k=\"b3a86cb4840e\">林老师带队；\n李妈妈：陈老师带队；\n郑妈妈：陈老师带队 或 林老师带队；\n张妈妈：林老师带队 且 \u003cimg data-k=\"0be436194951\">陈老师带队。\n吴妈妈和张妈妈的猜测为矛盾关系，必有一真一假。\n第二步：看其余。\n根据题干可知，四人的猜测为两真两假，故李妈妈和郑妈妈也必有一真一假。若李妈妈的猜测为真，那么郑妈妈的猜测也为真，不符合一真一假，因此李妈妈的猜测为假，郑妈妈的猜测为真，即陈老师没带队，再结合“或关系否一推一”可知，林老师带队，进而可以得出张妈妈的猜测为真。\n故正确答案为D。","no":105,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>\u003cimg data-k=\"b302ee9e82c1\" style=\"max-width:626px\">\u003c/p>","questions":[{"qid":"16592975","cat":"增长","stem":"表格所列国家中，相较于2012年，2022年全球创新指数增长最快的国家是：","options":{"A":"美国","B":"中国","C":"英国","D":"印度"},"answer":"B","explanation":"根据题干“······相较于2012年，2022年······增长最快的国家是”，可判定本题为一般增长率比较问题。定位统计表可得：2012年美国全球创新指数为57.7，2022年为61.8；2012年中国全球创新指数为45.4，2022年为55.3；2012年英国全球创新指数为61.2，2022年为59.7；2012年印度全球创新指数为35.7，2022年为36.6。根据公式：增长率\u003cimg data-k=\"7a919ee92a2e\">，则相较于2012年，2022年选项中国家全球创新指数同比增速分别为：\n美国：\u003cimg data-k=\"9db085ce17bb\">；\n中国：\u003cimg data-k=\"5112348f6a05\">；\n英国：\u003cimg data-k=\"a72ce82ec5a5\">；\n印度：\u003cimg data-k=\"5a24cfb262a0\">。\n综上，表格所列国家中，相较于2012年，2022年全球创新指数增长最快的国家是中国。\n故正确答案为B。","no":106,"missingImage":false},{"qid":"16592980","cat":"平均数","stem":"表格所列国家中，2022年全球创新指数排名前五位国家的平均创新指数是：","options":{"A":"58.54","B":"59.74","C":"60.84","D":"61.14"},"answer":"D","explanation":"根据题干“······2022年······平均创新指数是”，可判定本题为现期平均数问题。定位统计表可得：2022年全球创新指数排名前五位的国家分别是瑞士（64.6）、美国（61.8）、瑞典（61.6）、英国（59.7）、荷兰（58.0）。利用“削峰填谷”，以60为基准，分别作差得：4.6、1.8、1.6、-0.3、-2，\u003cimg data-k=\"595351133c0f\">，则排名前五位国家的平均创新指数=60+1.14=61.14。\n故正确答案为D。","no":107,"missingImage":false},{"qid":"16592984","cat":"综合","stem":"关于2021年，下列国家全球创新指数大小比较，错误的是：","options":{"A":"瑞士>瑞典>美国","B":"英国>韩国>荷兰","C":"芬兰>新加坡>丹麦","D":"俄罗斯>巴西>印度"},"answer":"D","explanation":"定位统计表可知2021年部分国家全球创新指数。代入选项验证：\nA项：瑞士（65.5）&gt;瑞典（63.1）&gt;美国（61.3），正确；\nB项：英国（59.8）&gt;韩国（59.3）&gt;荷兰（58.6），正确；\nC项：芬兰（58.4）&gt;新加坡（57.8）&gt;丹麦（57.3），正确；\nD项：俄罗斯（36.6）&gt;巴西（34.2）&lt;印度（36.4），错误。\n本题为选非题，故正确答案为D。","no":108,"missingImage":false},{"qid":"16592986","cat":"增长","stem":"2022年，中国、巴西、俄罗斯、印度、南非五国创新指数之和同比：","options":{"A":"增长约3.2%","B":"增长约4.8%","C":"下降约3.2%","D":"下降约4.8%"},"answer":"C","explanation":"根据题干“2022年······创新指数之和同比”，结合选项为“增长/下降+百分数”，可判定本题为一般增长率问题。定位统计表可知2021年及2022年中国、巴西、俄罗斯、印度、南非五国创新指数。则2021年中国、巴西、俄罗斯、印度、南非五国创新指数之和为\u003cimg data-k=\"8394a6d9a19b\">\u003cimg data-k=\"d18a441c4973\">，2022年五国创新指数之和为\u003cimg data-k=\"87a7f34cdf97\">\u003cimg data-k=\"8e9f06dbf322\">。根据公式：增长率\u003cimg data-k=\"7a919ee92a2e\">，则题干所求为\u003cimg data-k=\"63ff9135cd70\">，与C项最接近。\n故正确答案为C。","no":109,"missingImage":false},{"qid":"16592988","cat":"综合","stem":"能够从上述资料推出的是：","options":{"A":"2022年，韩国创新指数同比下降幅度超过丹麦","B":"2022年，中国创新指数在全球的排名比2012年上升20位","C":"表格所列年份中，全球创新指数均在58及以上的国家有5个","D":"2022年，表格所列全球创新指数同比增长的国家中，其创新指数同比增量均不少于0.5"},"answer":"A","explanation":"A项：定位统计表可得，2021年、2022年韩国创新指数分别为59.3、57.8，丹麦分别为57.3、55.9。根据公式：增长率\u003cimg data-k=\"7a919ee92a2e\">，可得2022年韩国创新指数同比增速\u003cimg data-k=\"86d653a95f0c\">\u003cimg data-k=\"7c5e4e0b131a\">，即降幅为2.5%；丹麦创新指数同比增速\u003cimg data-k=\"ccd397025f37\">\u003cimg data-k=\"4599a979d4c2\">，即降幅为2.4%。则2022年韩国创新指数同比下降幅度超过丹麦，正确；\nB项：材料只给出部分国家创新指数的数据，无法得出2012年、2022年中国在全球的排名，错误；\nC项：定位统计表可得，2012年、2021年、2022年全球创新指数均在58及以上的国家分别为瑞士（68.2、65.5、64.6）、瑞典（64.8、63.1、61.6）、英国（61.2、59.8、59.7）、荷兰（60.5、58.6、58.0），共4个国家，并非5个国家，错误；\nD项：定位统计表可得，2021年、2022年印度创新指数分别为36.4、36.6。2022年印度创新指数同比增量=现期量-基期量=36.6-36.4=0.2&lt;0.5，并非均不少于0.5，错误。\n故正确答案为A。","no":110,"missingImage":false}]},{"type":"material","material":"\u003cp>        2022年，我国废钢铁、废有色金属等十个品种（详见表格）再生资源回收总重量约为37067.7万吨，同比下降2.62%，回收总金额约为13140.6亿元，同比下降4.05%。2022年废有色金属中废铅回收重量同比增长5.56%。2022年我国报废机动车回收数量399.1万辆，同比增长32.9%，回收数量占我国机动车保有量的\u003cimg data-k=
