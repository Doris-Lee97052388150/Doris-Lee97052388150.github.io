<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2025-山东","title":"2025年山东省公务员录用考试《行测》试题（网友回忆版）","year":"2025","group":"山东","modules":[{"label":"政治理论","items":[{"type":"question","qid":"10297227","cat":"新思想","stem":"习近平总书记围绕全面深化改革开放做了一系列重要论述，正确的有几项？\n①改革开放必须勇于解放思想，但解放思想是有方向、有立场、有原则的，因而改革开放也是有方向、有立场、有原则的\n②改革开放是当代中国大踏步赶上时代的重要法宝，是决定中国式现代化成败的关键一招\n③我们提出进行全面深化改革，就是要适应我国社会基本矛盾运动的变化来推进社会发展\n④全面深化改革开放，要围绕构建高水平社会主义市场经济体制，深化要素市场化改革，建设高标准市场体系\n⑤全党必须自觉把改革摆在更加突出位置，紧紧围绕推进中国式现代化进一步全面深化改革","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"D","explanation":"本题考查理论与政策。\n①正确，2012年12月31日，习近平总书记在十八届中央政治局第二次集体学习时的讲话中指出：“改革开放必须勇于解放思想，但解放思想是有方向、有立场、有原则的，因而改革开放也是有方向、有立场、有原则的。有的人把改革开放定义为往西方‘普世价值’、西方政治制度的方向改，否则就是不改革开放。这是曲解我们的改革开放。”\n②正确，2023年12月26日，习近平总书记在纪念毛泽东同志诞辰130周年座谈会上的重要讲话中指出：“改革开放是当代中国大踏步赶上时代的重要法宝，是决定中国式现代化成败的关键一招。”\n③正确，2013年12月3日，习近平总书记在十八届中央政治局第十一次集体学习时的讲话中指出：“我们提出进行全面深化改革，就是要适应我国社会基本矛盾运动的变化来推进社会发展。社会基本矛盾总是不断发展的，所以调整生产关系、完善上层建筑需要相应地不断进行下去。”\n④正确，2024年3月5日，习近平总书记在参加十四届全国人大二次会议江苏代表团审议时的讲话中指出： “全面深化改革开放，持续增强发展的内生动力和活力。要谋划进一步全面深化改革重大举措，为推动高质量发展、推进中国式现代化持续注入强劲动力。要围绕构建高水平社会主义市场经济体制，深化要素市场化改革，建设高标准市场体系，加快完善产权保护、市场准入、公平竞争、社会信用等市场经济基础制度。”\n⑤正确，2024年7月18日中国共产党第二十届中央委员会第三次全体会议通过的《中共中央关于进一步全面深化改革、推进中国式现代化的决定》指出，改革开放只有进行时，没有完成时。全党必须自觉把改革摆在更加突出位置，紧紧围绕推进中国式现代化进一步全面深化改革。\n故①②③④⑤表述正确，共5项。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"15707403","cat":"新思想","stem":"习近平总书记强调，要在新时代新征程坚持好、完善好、运行好人民代表大会制度，努力开创中国式现代化建设新局面。关于人民代表大会制度，下列表述正确的是：\n①中国人民政治协商会议第一届全体会议通过具有临时宪法地位的《中国人民政治协商会议共同纲领》，庄严宣告新中国实行人民代表大会制度\n②第一届全国人民代表大会第一次会议通过《中华人民共和国宪法》，标志着人民代表大会制度这一国家根本政治制度正式建立\n③人民代表大会制度具有促进全国各族人民大团结，实现求同存异、聚同化异的显著优势\n④要用好宪法赋予人大的监督权，实行正确监督、有效监督、依法监督","options":{"A":"①②④","B":"②③④","C":"①③④","D":"①②③"},"answer":"A","explanation":"本题考查理论与政策。\n①正确，2024年9月14日，习总书记在庆祝全国人民代表大会成立70周年大会上的讲话中指出：“75年前，中国人民政治协商会议第一届全体会议通过具有临时宪法地位的《中国人民政治协商会议共同纲领》，庄严宣告新中国实行人民代表大会制度。”\n②正确，2024年9月14日，习总书记在庆祝全国人民代表大会成立70周年大会上的讲话中指出：“70年前，第一届全国人民代表大会第一次会议通过《中华人民共和国宪法》，标志着人民代表大会制度这一国家根本政治制度正式建立。人民代表大会制度的建立，意味着中国政治从根本上实现了由少数人掌握政权、绝大多数人受压迫被剥削到中国共产党领导、人民当家作主的伟大跨越，这在几千年历史上是从未有过的，实现了中国政治制度的伟大变革。”\n③错误，2024年9月14日，习总书记在庆祝全国人民代表大会成立70周年大会上的讲话中指出：“人民代表大会制度具有维护国家统一、保障国家长治久安的显著优势。我国是统一的多民族国家，也是单一制国家，人民代表大会制度是维护国家统一、民族团结、社会稳定的制度保证。”选项中“求同存异、聚同化异”主要形容的是政协制度而非人大制度。\n④正确，在2021年10月召开的中央人大工作会议上，习近平总书记强调，各级人大及其常委会要用好宪法赋予人大的监督权，实行正确监督、有效监督、依法监督。\n综上所述，①②④表述正确。\n故正确答案为A。","no":2,"missingImage":false},{"type":"question","qid":"10297228","cat":"时事政治","stem":"党的二十届三中全会通过的中共中央关于进一步全面深化改革推进中国式现代化的决定中提到，完善中国特色社会主义法治体系。下列属于完善中国特色社会主义法治体系的有几项？\n①深化立法领域改革\n②深入推进依法行政\n③健全公正执法司法体制机制\n④完善推进法治社会建设机制\n⑤完善国家安全法治体系","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"C","explanation":"本题考查理论与政策。\n2024年7月18日，中国共产党第二十届中央委员会第三次全体会议通过《中共中央关于进一步全面深化改革 推进中国式现代化的决定》（以下简称《决定》）。\n①②③④正确，《决定》第九部分“完善中国特色社会主义法治体系”指出：深化立法领域改革。深入推进依法行政。健全公正执法司法体制机制。完善推进法治社会建设机制。加强涉外法治建设。\n⑤错误，《决定》第十三部分“推进国家安全体系和能力现代化”指出：健全国家安全体系。强化国家安全工作协调机制，完善国家安全法治体系、战略体系、政策体系、风险监测预警体系，完善重点领域安全保障体系和重要专项协调指挥体系。\n综上，①②③④说法正确，共4项。\n故正确答案为C。","no":3,"missingImage":false},{"type":"question","qid":"10297230","cat":"新思想","stem":"习近平总书记多次强调提高黄河流域的生态保护和高质量水平发展，实施最严格的水资源保护制度，提高节约集约利用水平，下列表述正确的是：\n①河套地区条件得天独厚，大力发展高效农业和节水产业，不能搞大水漫灌\n②山东为黄河水资源调度，装上智慧大脑，有4处引黄灌溉区入选全国数字孪生灌区试点，数量居全国第一\n③宁夏实施“一泓清水入黄河”工程，和黄河干流流经县生态环境综合治理工程，推进黄河流域系统治理\n④山西分3年从四川购入1500万立方米黄河用水权，这是全国首例跨省区水权交易案例","options":{"A":"①②","B":"③④","C":"①③","D":"②④"},"answer":"A","explanation":"本题考查理论与政策。\n①正确，2023年6月，习近平总书记在内蒙古自治区巴彦淖尔市考察时强调：“河套地区条件得天独厚，虽然不缺水，但也要节约水资源，大力发展现代高效农业和节水产业，不能搞大水漫灌。”\n②正确，2022年12月，水利部正式启动数字孪生灌区先行先试建设，全国49处大中型灌区纳入试点。在山东，聊城位山灌区、滨州市属灌区、德州豆腐窝灌区和东营路庄灌区共4处引黄灌溉区入选全国试点，数量居全国第一。\n③错误，党的十八大以来，山西深入学习贯彻习近平生态文明思想和习近平总书记对山西工作的重要讲话重要指示精神，坚持把保护黄河流域生态作为谋划发展、推动高质量发展的基准线，突出抓好“一泓清水入黄河”生态保护工程实施、黄河干流流经县生态环境综合治理等重点工作，为全省推动高质量发展、深化全方位转型提供坚实生态环境支撑。\n④错误，2023年11月23日，四川省阿坝州水务局与宁夏回族自治区宁东能源化工基地管理委员会在成都签订《四川宁夏黄河流域区域水权跨省交易协议》。根据协议，阿坝州在2024—2026年将向宁东基地出让1500万立方米的黄河用水权，这成为我国首单跨省区域水权交易。\n故①②表述正确。\n故正确答案为A。","no":4,"missingImage":false},{"type":"question","qid":"18508626","cat":"新思想","stem":"习近平总书记强调，我们要只争朝夕，埋头苦干。一步一个脚印的把建成科技强国的战略目标变为现实，关于建成科技强国的举措，下列说法正确的有几项？\n①充分发挥新型举国体制优势，加快推进高水平科技自立自强\n②一体推进教育科技人才事业发展，构筑人才竞争优势\n③全面深化科技体制机制改革，充分激发创新创造活力\n④贯彻新发展理念，构建新发展格局，抢占科技未来发展制高点","options":{"A":"4项","B":"3项","C":"2项","D":"1项"},"answer":"B","explanation":"本题考查理论与政策。\n①正确，2024年6月24日，习近平总书记在全国科技大会、国家科学技术奖励大会、两院院士大会上的讲话中指出：“第一，充分发挥新型举国体制优势，加快推进高水平科技自立自强。要完善党中央对科技工作集中统一领导的体制，加强战略规划、政策措施、重大任务、科研力量、资源平台、区域创新等方面的统筹，构建协同高效的决策指挥体系和组织实施体系，凝聚推动科技创新的强大合力。”\n②正确，2024年6月24日，习近平总书记在全国科技大会、国家科学技术奖励大会、两院院士大会上的讲话中指出：“第四，一体推进教育科技人才事业发展，构筑人才竞争优势。科技创新靠人才，人才培养靠教育，教育、科技、人才内在一致、相互支撑。”\n③正确，2024年6月24日，习近平总书记在全国科技大会、国家科学技术奖励大会、两院院士大会上的讲话中指出：“第三，全面深化科技体制机制改革，充分激发创新创造活力。要坚持目标导向和问题导向相结合，针对我国科技创新组织化协同化程度不高，科技资源分散、重复等问题，深化科技管理体制改革，统筹各类创新平台建设，加强创新资源统筹和力量组织。”\n④错误，习近平总书记于2015年10月在党的十八届五中全会上提出创新、协调、绿色、开放、共享的发展理念。贯彻新发展理念不属于建成科技强国的举措。\n故①②③说法正确，共3项。\n故正确答案为B。","no":5,"missingImage":false},{"type":"question","qid":"10297235","cat":"新思想","stem":"习近平总书记强调，公共安全连着千家万户，事关人民群众生命财产安全，事关改革发展稳定大局。关于公共安全治理，下列说法正确的有几项？\n①应急救援是完善公共安全治理体制的首要环节，要把损失减少到最小\n②坚持安全第一、救援为主，不断完善公共安全治理机制，提高公共安全治理水平\n③健全重大突发公共事件处置保障体系，完善大安全大应急框架下应急指挥机制\n④完善安全生产风险排查整治和责任倒查机制，加强制度化常态化安全监管\n⑤加强网络安全体制建设，完善网络空间治理法律法规，筑牢网络安全“防火墙”","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"B","explanation":"本题考查理论与政策。\n①错误，事前预防是完善公共安全治理体制的首要环节，预防的目的就是把灾害事故风险降到最低程度，力争做到尽量不出事。\n③正确，《中共中央关于进一步全面深化改革 推进中国式现代化的决定》在“十三、推进国家安全体系和能力现代化”部分指出：“（51）完善公共安全治理机制。健全重大突发公共事件处置保障体系，完善大安全大应急框架下应急指挥机制，强化基层应急基础和力量，提高防灾减灾救灾能力······”\n④⑤正确，②错误，光明日报文章《建设更高水平平安中国》在“3.推进国家安全体系和能力现代化”部分指出：“完善公共安全治理机制。坚持安全第一、预防为主，建立大安全大应急框架，完善公共安全体系，推动公共安全治理模式向事前预防转型······推进安全生产风险专项整治，完善风险排查整治和责任倒查机制，加强制度化常态化安全监管，严格落实安全生产责任制，从源头上防范化解重大安全风险······加强网络安全体制建设，完善网络空间治理法律法规，健全网络安全等级保护、关键信息基础设施安全保护、数据安全保护等制度，筑牢网络安全‘防火墙’。”\n故正确的有③④⑤，共3项。\n故正确答案为B。","no":6,"missingImage":false},{"type":"question","qid":"10297229","cat":"时事政治","stem":"2024年7月，中共中央、国务院印发的《关于加快经济社会发展全面绿色转型的意见》提出，要坚持全面转型、协同转型、创新转型和安全转型的工作原则。这是国家层面首次对全面绿色转型进行系统部署。下列能够体现“协同转型”原则的是（    ）。","options":{"A":"某电气公司技术团队如期研发出完全自主知识产权的装备，确保我国首个碳中和超级电弧炉炼钢工程项目顺利完成","B":"中国风电、光伏产品出口到全球200多个国家和地区，帮助广大发展中国家获得清洁、可靠、用得起的能源","C":"加快研制新能源汽车、光伏、锂电池等“新三样”产品碳足迹国家标准，增强应对国际贸易碳壁垒的能力","D":"开展多层次试点，统筹推进工业、能源、交通运输、城乡建设、农业等重点领域减污降碳"},"answer":"D","explanation":"本题考查理论与政策。\n2024年7月31日，中共中央、国务院印发《关于加快经济社会发展全面绿色转型的意见》（以下简称《意见》），《意见》指出，要坚持全面转型、协同转型、创新转型和安全转型的工作原则。\nA项错误，《意见》指出，坚持创新转型。强化支撑绿色转型的科技创新、政策制度创新、商业模式创新，推进绿色低碳科技革命，因地制宜发展新质生产力，完善生态文明制度体系，为绿色转型提供更强创新动能和制度保障。选项中“研发完全自主知识产权的装备”是在进行支撑绿色转型的科技创新，体现的是“创新转型”原则，而非“协同转型”。\nB项错误，该《意见》旨在解决我国资源环境生态问题，与“广大发展中国家”关系不大，且选项只提到了帮助这些国家，并未体现与其开展协同合作，故未体现“协同转型”原则。\nC项错误，《意见》指出，坚持安全转型。统筹处理好发展和减排、整体和局部、当前和长远、政府和市场的关系，妥善防范化解绿色转型面临的内外部风险挑战，切实保障粮食能源安全、产业链供应链安全，更好保障人民群众生产生活。选项中“增强应对国际贸易碳壁垒的能力”是在应对外部风险挑战，体现了“安全转型”原则，而非“协同转型”。\nD项正确，《意见》指出，坚持协同转型。充分考虑不同地区、不同行业的发展实际，坚持统筹推进与重点突破相结合，科学设定绿色转型的时间表、路线图、施工图，鼓励有条件的地区和行业先行探索。该项中“开展多层次试点”对应了“鼓励有条件的地区和行业先行探索”，“统筹推进工业、能源、交通运输、城乡建设、农业等重点领域减污降碳”符合协同转型原则的“统筹推进与重点突破相结合”要求。\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"10297234","cat":"新思想","stem":"中国履行大国责任，推动构建人类命运共同体，积极参与全球治理体系改革和建设，主导或参与创建了多个国际组织和联盟。对此，下列说法错误的是：","options":{"A":"上海合作组织旨在推动成员国之间的安全、经贸、能源等领域合作","B":"金砖国家新开发银行旨在推动亚洲地区的基础设施建设和互联互通","C":"博鳌亚洲论坛旨在促进亚洲经济一体化，为亚洲和世界发展凝聚正能量","D":"“全球南方”智库合作联盟旨在促进各国人文交流和治国理政互学互鉴"},"answer":"B","explanation":"本题考查理论与政策。\nA项正确，2024年7月，《上海合作组织成员国元首理事会关于睦邻互信和伙伴关系原则的声明》指出，成员国发展长期睦邻友好合作关系，在安全、经贸、能源、交通、科技、信息、环保、人文等所有共同感兴趣的领域开展合作。\nB项错误，2024年10月23日，金砖国家领导人第十六次会晤在喀山会展中心举行，习近平主席强调，我们要建设“公正金砖”，做全球治理体系改革的引领者······促进金融基础设施互联互通，维护高水平金融安全，做大做强新开发银行，推动国际金融体系更好反映世界经济格局变化。亚洲基础设施投资银行简称亚投行，是首个推动亚洲地区的基础设施建设和互联互通的多边金融机构。\nC项正确，博鳌亚洲论坛成立于2001年2月，由29个亚太国家共同发起，是一个凝聚全球共识、促进共同发展的国际高端对话平台。论坛成立的初衷是促进亚洲经济一体化，论坛当今的使命是为亚洲和世界发展凝聚正能量。\nD项正确，2024年10月24日，国家主席习近平在喀山会展中心出席“金砖+”领导人对话会并发表题为《汇聚“全球南方”磅礴力量 共同推动构建人类命运共同体》的重要讲话。习近平主席在讲话中提出，中方将牵头成立“全球南方”智库合作联盟，促进各国人文交流和治国理政互学互鉴。\n本题为选非题，故正确答案为B。","no":8,"missingImage":false},{"type":"question","qid":"10297231","cat":"新思想","stem":"2024年5月，习近平总书记在山东视察时，对山东工作进一步明确总定位、新要求，赋予山东“走在前、挑大梁”的重大使命。对此，下列表述正确的有几项？\n①山东要在进一步全面深化改革、推进高水平对外开放上勇争先\n②山东是农业大省、粮食大省，在保障国家粮食安全方面责任重大\n③山东在推进科技创新与产业创新深度融合、发展新质生产力、完善现代化产业体系上大有可为\n④山东要担负起新时代的文化使命，在推动文化繁荣、建设文化强国、建设中华民族现代文明上积极作为","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查理论与政策。\n2024年5月22日至24日，中共中央总书记、国家主席、中央军委主席习近平前往山东考察并发表重要讲话。\n①正确，习近平总书记强调，山东要在进一步全面深化改革、推进高水平对外开放上勇争先。要聚焦推进中国式现代化，在解决制约高质量发展的突出矛盾上下功夫，在完善制度、健全机制、激发活力、增添动力上用实劲······\n②正确，习近平总书记指出，山东是农业大省、粮食大省，在保障国家粮食安全方面责任重大。要深化城乡融合发展，全面推进乡村振兴，提高村庄规划编制质量和实效，大力发展现代农业，积极发展乡村特色产业和农产品加工业······\n③正确，习近平总书记指出，山东在推进科技创新与产业创新深度融合、发展新质生产力、完善现代化产业体系上大有可为。要着眼国家战略需求，统筹推进传统产业改造提升、新兴产业培育壮大、未来产业超前布局······\n④正确，习近平总书记强调，山东要担负起新时代的文化使命，在推动文化繁荣、建设文化强国、建设中华民族现代文明上积极作为。要坚定文化自信，深入挖掘中华优秀传统文化精华，坚持创造性转化、创新性发展······\n故①②③④表述均正确，共4项。\n故正确答案为D。","no":9,"missingImage":false},{"type":"question","qid":"10297232","cat":"时事政治","stem":"山东省把学习贯彻党的二十届三中全会精神和习近平总书记视察山东重要讲话精神作为重大政治任务，提出了进一步全面深化改革的目标。下列表述正确的是：\n①到二〇二九年，在重要领域和关键环节改革上取得决定性成果，推动山东改革走在全国前列\n②到二〇三五年，新时代社会主义现代化强省各方面制度更加完善，基本实现治理体系和治理能力现代化\n③到建党一百二十周年，全面实现山东经济社会高质量发展\n④到本世纪中叶，全面建成新时代社会主义现代化强省","options":{"A":"①②③","B":"②③④","C":"①②④","D":"①③④"},"answer":"C","explanation":"本题考查理论与政策。\n2024年8月24日，中国共产党山东省第十二届委员会第七次全体会议审议通过了《中共山东省委关于深入贯彻落实党的二十届三中全会精神在进一步全面深化改革上当好排头兵的意见》（以下简称《意见》）。\n①正确，《意见》指出，到二〇二九年，完成本意见提出的改革任务，在重要领域和关键环节改革上取得决定性成果，推动山东改革走在全国前列。\n②④正确，《意见》指出，到二〇三五年，新时代社会主义现代化强省各方面制度更加完善，基本实现治理体系和治理能力现代化，为到本世纪中叶全面建成新时代社会主义现代化强省奠定坚实基础。\n③错误，《意见》未涉及建党一百二十周年的发展目标。\n综上，①②④表述正确。\n故正确答案为C。","no":10,"missingImage":false}],"count":10,"answerable":10,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"18508632","cat":"人文常识","stem":"守正创新深刻揭示了变与不变，继承与发展的辩证统一，下列与守正创新蕴含哲理相同的是：","options":{"A":"旋岚偃岳而常静，江河竞注而不流","B":"试玉要烧三日满，辨材须待七年期","C":"却是平流无石处，时时闻说有沉沦","D":"新竹高于旧竹枝，全凭老干为扶持"},"answer":"D","explanation":"本题考查马克思主义。\n“守正”就是按照事物发展的客观规律来认识和改造世界；“创新”即人们充分发挥主观能动性，结合实际情况，有意识有目的地深化对客观世界的认识，积极主动地进行创造性活动。守正与创新是辩证统一的关系，体现了发展的观点。\nA项错误，“旋岚偃岳而常静，江河竞注而不流”出自宋代释宗演的《颂古二十四首其一》，意思是可以吹倒山岳的暴风是静止的，江流河水滔滔不绝同时却是停滞不动的。这是用静止的观点看待事物，否认了绝对运动，属于形而上学的观点。\nB项错误，“试玉要烧三日满，辨材须待七年期”出自唐代白居易的《放言五首·其三》，意思是检验玉真假还需要烧满三天，辨别木材还要等七年以后。这表明对人和事要得到全面的认识，都要经过时间的考验。体现的哲理是对复杂事物的认识要经历一个过程。\nC项错误，“却是平流无石处，时时闻说有沉沦”出自唐代杜荀鹤的《泾溪》。意思是恰恰是在水流缓慢没有礁石的地方，却常常听到有人被淹死的消息。体现的哲理是矛盾双方在一定条件下可以相互转化。\nD项正确，“新竹高于旧竹枝，全凭老干为扶持”出自清代郑板桥的《新竹》，意思是新长的竹子要比旧竹子高，它们的生长全凭老的枝干扶持。寓意着新事物具有强大的生命力，体现了发展的观点。唯物辩证法的发展观告诉我们要坚持与时俱进，培养创新精神，促进新事物的成长，使自己的思想符合变化了的客观实际。\n故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"10886437","cat":"人文常识","stem":"打开窗户就有无人机把快递包裹送到家，上下班可以直接用手机打个“飞的”出门，每逢佳节可以预约定制个人专属的炫酷无人机灯光秀······千米以下的低空空域未来将充满无限可能。这表明：","options":{"A":"科学技术是推动社会文明进步的重要力量","B":"科学技术是推动社会历史发展的根本动力","C":"科学技术是推动社会生存和发展的永恒条件","D":"科学技术应用于生产过程的周期正日趋缩短"},"answer":"A","explanation":"本题考查马克思主义。\nA项正确，科学技术是生产力的重要组成部分，属于智能性要素，科学技术应用于生产过程，与生产力中的劳动资料、劳动对象和劳动者等因素相结合而转化为实际的生产能力。科技进步通过推动生产力发展，进而推动生产关系变革，最终推动社会发展。题干通过“无人机送快递”“打‘飞的’”“定制灯光秀”等场景，展现了低空空域的科技应用对社会生活的影响，体现了科技作为生产力的关键要素，推动生产力发展，进而推动社会文明进步。\nB项错误，马克思主义认为，社会历史发展的根本动力是社会基本矛盾，即“生产力与生产关系的矛盾、经济基础与上层建筑的矛盾”。而科学技术是社会发展的重要动力。每一次科学技术革命都会不同程度地引起生产方式、生活方式和思维方式的深刻变化和社会的巨大进步。\nC项错误，马克思主义认为，自然地理环境是人类社会生存和发展永恒的、必要的条件，是人们生活和生产的自然基础。而科学技术是“历史范畴”，是人类社会发展到一定阶段的产物。没有科技，人类可通过简单生产方式生存；但没有物质生产，人类社会立即消亡。\nD项错误，“科技应用周期缩短”指科技从研发成功到转化为现实生产力的时间越来越短，这一表述正确，但题干中只提到了“无人机技术已应用于生活场景”，没有涉及“无人机技术从研发到应用的周期”，与题干无关。\n故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"18508651","cat":"人文常识","stem":"关于首发经济，下列说法错误的是：","options":{"A":"是一个地区商业活力、消费实力、创新能力、国际竞争力、品牌形象和开放度的重要体现","B":"具有时尚、品质、新潮等特征，是需求侧积极适应当前多元化、个性化、品质化消费趋势的产物","C":"是企业发布新产品，推出新业态、新模式、新服务，新技术，开设首店等经济活动的总称","D":"涵盖了企业从产品或服务的首次发布，首次展出到首次落地开设门店，首次设立研发中心，再到设立企业总部的链式发展全过程"},"answer":"B","explanation":"本题考查经济常识。\nA项正确，首发经济的发展依赖于一个地区的商业集聚能力（吸引首店/首展）、消费支付实力（承接新潮消费）、创新孵化水平（支撑新品研发）、国际开放度（引入国际品牌首发），其规模与质量直接反映该地区的综合竞争力和品牌形象。例如上海、北京的首发经济活跃度，正是其城市综合实力的重要体现。\nB项错误，首发经济的“时尚、品质、新潮”特征，根源是供给侧（企业、品牌）主动进行产品创新、模式突破、服务升级（如品牌全球首发新品、推出沉浸式消费新业态），从而引领甚至创造新的消费需求；并非需求侧（消费者）积极适应消费趋势所催生的产物。首发经济的核心动力来自供给端创新，而非来源于消费者对已有消费趋势的适应。\nC、D两项正确，首发经济是指企业发布新产品，推出新业态、新模式、新服务、新技术，开设首店等经济活动的总称，涵盖了企业从产品或服务的首次发布、首次展出到首次落地开设门店、首次设立研发中心，再到设立企业总部的链式发展全过程。\n本题为选非题，故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"18508648","cat":"人文常识","stem":"制度性交易成本是指因政府的各种制度工具所带来的成本，降低制度性交易成本是政府优化营商环境的重要一环。下列措施不能降低制度性交易成本的是：","options":{"A":"下调高速公路收费标准","B":"深化“高效办成一件事”改革","C":"推行企业营业执照“二码合一”改革","D":"推进公共资源交易领域数字化转型升级"},"answer":"A","explanation":"本题考查经济常识。\n制度性交易成本也叫体制性成本，是企业在运转过程中因遵循政府制定的各种制度、规章、政策而需要付出的成本，是由于体制机制问题而造成的经济、时间和机会等各种成本。\nA项错误，下调高速公路收费标准有利于降低物流成本，加强不同地区间的互动和交流。但不属于体制机制问题。\nB项正确，“高效办成一件事”是从企业和群众视角出发，将多个关联性强、办理量大、办理时间相对集中的事项整合成为企业群众眼中的“一件事”，实现“一次申请、一套材料、一次办理”，解决办事流程繁琐、多次跑路的问题，大大减少办事环节、申请材料、办理时间和跑动次数。深化“高效办成一件事”改革有利于降低制度性交易成本。\nC项正确，“二码合一”是将纸质营业执照“二维码”与电子营业执照小程序中市场主体身份码整合为一个“企业码”。“企业码”按照“一企一码”原则，汇聚企业的营业执照、许可证等信息，具有权威、统一、易用、安全等特点，一次生成，终身有效。同时，依托大数据信息共享技术，打造“企业画像”，让企业形象更加立体，可印于个人名片、宣传材料和产品包装上，向经营者、合作者和社会各界提供企业信息，增进合作。企业营业执照“二码合一”改革有利于降低制度性交易成本。\nD项正确，公共资源交易领域数字化转型升级即利用数字化手段推动公共资源交易领域转型升级。数字交易是指通过数字化技术集成公共资源交易全过程、全参与方、全要素，建立数字化、在线化、智能化的开放型交易平台生态体系，围绕数字交易大脑，最终实现智能交易、精准服务和阳光监管的新交易场景。深入推进公共资源交易领域数字化转型升级，有利于加快提升全流程全链条服务水平，持续降低制度性交易成本、增强要素保障能力，推动公共资源交易规范健康发展，打造一流营商环境。\n本题为选非题，故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"18508654","cat":"法律常识","stem":"根据《中华人民共和国保守国家秘密法》，下列说法错误的是：","options":{"A":"机关单位应当实行保密工作责任制，依法设置保密工作机构或者指定专人负责保密工作","B":"国家采取多种形式加强保密宣传教育，将保密教育纳入国民教育体系和公务员教育培训体系","C":"省级机关、市级机关及其授权的机关、单位可以确定绝密级、机密级和秘密级国家机密","D":"县级以上人民政府应当将保密工作纳入本级国民经济列入本级财政预算"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国保守国家秘密法》第八条规定：“机关、单位应当实行保密工作责任制，依法设置保密工作机构或者指定专人负责保密工作，健全保密管理制度，完善保密防护措施，开展保密宣传教育，加强保密监督检查。”\nB项正确，根据《中华人民共和国保守国家秘密法》第九条规定：“国家采取多种形式加强保密宣传教育，将保密教育纳入国民教育体系和公务员教育培训体系，鼓励大众传播媒介面向社会进行保密宣传教育，普及保密知识，宣传保密法治，增强全社会的保密意识。”\nC项错误，根据《中华人民共和国保守国家秘密法》第十七条第二款规定：“中央国家机关、省级机关及其授权的机关、单位可以确定绝密级、机密级和秘密级国家秘密；设区的市级机关及其授权的机关、单位可以确定机密级和秘密级国家秘密；特殊情况下无法按照上述规定授权定密的，国家保密行政管理部门或者省、自治区、直辖市保密行政管理部门可以授予机关、单位定密权限。具体的定密权限、授权范围由国家保密行政管理部门规定。”因此，只有中央国家机关、省级机关及其授权的机关、单位可以确定绝密级、机密级和秘密级国家秘密。\nD项正确，根据《中华人民共和国保守国家秘密法》第十一条规定：“县级以上人民政府应当将保密工作纳入本级国民经济和社会发展规划，所需经费列入本级预算。机关、单位开展保密工作所需经费应当列入本机关、本单位年度预算或者年度收支计划。”\n本题为选非题，故正确答案为C。","no":15,"missingImage":false},{"type":"question","qid":"10886438","cat":"法律常识","stem":"根据《突发事件应对法》相关规定，以下哪项是错误的？","options":{"A":"甲县某地遭强龙卷风突袭后，当地政府应立即启动应急预案，组织救援并上报上级政府","B":"乙市A县与丙市B县交界处突发严重洪涝灾害，若影响范围跨省或超出省级处置能力，需国务院统一领导应对","C":"丁县发生严重的山体滑坡事故，需要进行网络实时直播","D":"戊市政府发布的突发事件应对措施，如限制交通、征用物资等，应符合比例原则，并依法保障公民合法权益"},"answer":"C","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国突发事件应对法》第七十二条第一款规定：“突发事件发生后，履行统一领导职责或者组织处置突发事件的人民政府应当针对其性质、特点、危害程度和影响范围等，立即启动应急响应，组织有关部门，调动应急救援队伍和社会力量，依照法律、法规、规章和应急预案的规定，采取应急处置措施，并向上级人民政府报告；必要时，可以设立现场指挥部，负责现场应急处置与救援，统一指挥进入突发事件现场的单位和个人。”\nB项正确，根据《中华人民共和国突发事件应对法》第十八条规定：“突发事件涉及两个以上行政区域的，其应对管理工作由有关行政区域共同的上一级人民政府负责，或者由各有关行政区域的上一级人民政府共同负责。共同负责的人民政府应当按照国家有关规定，建立信息共享和协调配合机制。根据共同应对突发事件的需要，地方人民政府之间可以建立协同应对机制。”本项中，突发事件涉及乙市A县与丙市B县，但影响范围跨省或超出省级处置能力，因此，应由省级政府的上一级人民政府国务院统一领导。\nC项错误，根据《中华人民共和国突发事件应对法》第七条第一款规定：“国家建立健全突发事件信息发布制度。有关人民政府和部门应当及时向社会公布突发事件相关信息和有关突发事件应对的决定、命令、措施等信息。”本项中，丁县发生严重的山体滑坡事故，丁县人民政府和部门应当及时向社会发布相关信息，但并不等于要网络实时直播。\nD项正确，根据《中华人民共和国突发事件应对法》第十条规定：“突发事件应对措施应当与突发事件可能造成的社会危害的性质、程度和范围相适应；有多种措施可供选择的，应当选择有利于最大程度地保护公民、法人和其他组织权益，且对他人权益损害和生态环境影响较小的措施，并根据情况变化及时调整，做到科学、精准、有效。”比例原则是国家公权力的行使必须兼顾目标的实现与公民权利的保护，要求约束公权力滥用、保障公民基本权利。本项中，戊市政府发布的突发事件应对措施，应符合比例原则。\n本题为选非题，故正确答案为C。","no":16,"missingImage":false},{"type":"question","qid":"15707409","cat":"科技常识","stem":"下列科技成就按时间先后排序正确的是：\n①首次实现二氧化碳到淀粉分子的从头合成\n②“神舟十号”实现载人天地往返运输系统的进一步完善和优化\n③“墨子号”量子科学实验卫星发射升空\n④“梦想号”大洋钻探船正式入列","options":{"A":"①②③④","B":"②③①④","C":"③②①④","D":"④③①②"},"answer":"B","explanation":"本题考查科技常识。\n①项，2021年9月，中科院天津工业生物技术研究所在淀粉人工合成方面取得重大突破，国际上首次在实验室实现了二氧化碳到淀粉的从头合成。这一成果不依赖植物光合作用，为人工合成淀粉开辟了新途径，对未来的粮食生产和生物制造具有重要意义。\n②项，“神舟十号”飞船于2013年6月11日发射升空。它搭载了聂海胜、张晓光、王亚平3名航天员，实现了载人天地往返运输系统的进一步完善和优化，开展了一系列空间科学实验和技术试验，为后续空间站建设积累了经验。\n③项，“墨子号”量子科学实验卫星于2016年8月16日发射升空。它是由我国自主研制的世界上首颗空间量子科学实验卫星，实现了卫星和地面之间的量子密钥分发、量子纠缠分发和量子隐形传态等量子通信实验，为构建全球化量子通信网络奠定了基础。\n④项，“梦想号”大洋钻探船于2024年11月正式入列。它是我国自主设计建造的首艘超深水大洋科考钻探船，具备先进的钻探设备和科学探测系统，在深海地质、地球科学等领域发挥重要作用，提升了我国在海洋科学研究方面的国际竞争力。\n上述科技成就按时间先后排序为②③①④。\n故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"15707404","cat":"人文常识","stem":"下列关于四大名著对应错误的是：","options":{"A":"山高自有客行路，水深自有渡船人——《西游记》","B":"江东弟子今犹在，肯与君王卷土来——《三国演义》","C":"世事洞明皆学问，人情练达即文章——《红楼梦》","D":"手提三尺龙泉剑，不斩奸邪誓不休——《水浒传》"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，“山高自有客行路，水深自有渡船人”出自《西游记》第七十四回“长庚传报魔头狠 行者施为变化能”。意思是山再高也有行人走过的路，水再深也有渡船载人过河，比喻只要有决心和毅力，就没有克服不了的困难。\nB项错误，“江东弟子今犹在，肯与君王卷土来”出自宋代王安石的《叠题乌江亭》，意思是虽然江东子弟现在仍在，但他们是否还愿意跟楚霸王卷土重来呢？这与《史记》中记载的项羽事迹相关，并非出自《三国演义》。\nC项正确，“世事洞明皆学问，人情练达即文章”是《红楼梦》中宁国府上房内的一副对联，意思是把世间的事弄懂了处处都有学问，把人情世故摸透了处处都是文章。\nD项正确，“手提三尺龙泉剑，不斩奸邪誓不休”虽不是直接出自《水浒传》的某一具体回目，但它以凝练的语言，精准捕捉了《水浒传》“除奸惩恶、侠义反抗” 的核心精神，诗句中的 “剑” 对应梁山好汉的反抗工具，“斩奸邪” 对应他们的核心行动，“誓不休” 对应他们的坚定信念。因此，将其出处归为《水浒传》，是基于 “精神内核与主题高度契合” 的正确对应。\n本题为选非题，故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"15707411","cat":"科技常识","stem":"下列与人工智能有关的说法正确的是：\n①2024年3月，联合国大会通过了首个关于人工智能的全球决议案——《抓住安全、可靠和值得信赖的人工智能系统带来的机遇，促进可持续发展》\n②党的二十届三中全会提出，要完善生成式人工智能发展和管理机制，建立人工智能安全监管制度\n③过去十年来，中国生成式人工智能专利申请量居世界第一，是第二名美国的6倍\n④智能制造系统运维员是人力资源和社会保障部最新发布的19个新职业之一\n⑤数智技术是在数字化基础上融合应用机器学习、人工智能等智能技术的过程，是中国式现代化的鲜明特征","options":{"A":"①②③④","B":"①②④⑤","C":"②③④⑤","D":"①③④⑤"},"answer":"A","explanation":"本题考查科技常识。\n①正确，2024年3月21日，联合国大会一致通过了由美国牵头提出的决议案《抓住安全、可靠和值得信赖的人工智能系统带来的机遇，促进可持续发展》。这是联合国大会历史上首次为针对人工智能治理问题确立全球统一规范所通过的专项决议。\n②正确，党的二十届三中全会审议通过的《中共中央关于进一步全面深化改革、推进中国式现代化的决定》在“十、深化文化体制机制改革”部分指出：“（40）健全网络综合治理体系······完善生成式人工智能发展和管理机制。”在“十三、推进国家安全体系和能力现代化”部分指出：“（51）完善公共安全治理机制······加强网络安全体制建设，建立人工智能安全监管制度。”\n③正确，当地时间2024年7月3日，世界知识产权组织发布《生成式人工智能专利态势报告》。报告显示，2014年至2023年，中国发明人申请的生成式人工智能专利数量最多，中国的生成式人工智能专利申请量超过3.8万件，是排名第二的美国的6倍。\n④正确，据新华社消息，人力资源和社会保障部2024年5月24日发布公示，拟增加网络主播、生成式人工智能系统应用员、用户增长运营师、智能网联汽车测试员、云网智能运维员、文创产品策划运营师、智能制造系统运维员、工业互联网运维员、生物工程技术人员等19个新职业，同时增加移动操作系统应用设计员等29个新工种。\n⑤错误，数智技术是数字化和智能化的有机融合，可以理解为“数字化+智能化”，是在数字化基础上融合应用机器学习、人工智能等智能技术的过程。数智化是新型工业化的鲜明特征，是形成新质生产力的重要途径。2023年2月7日，习近平总书记在学习贯彻党的二十大精神研讨班开班式上指出，党的领导直接关系中国式现代化的根本方向、前途命运、最终成败。这一论断深刻揭示了党的领导与中国式现代化的内在关系，即坚持中国共产党的领导是中国式现代化的最鲜明特征和最突出优势。\n综上，①②③④正确。\n故正确答案为A。","no":19,"missingImage":false},{"type":"question","qid":"15707408","cat":"科技常识","stem":"关于医学诊断设备，下列相关说法错误的是（    ）。","options":{"A":"ECMO（人工膜肺）可对重症心肺功能衰竭患者提供长时间心肺支持","B":"GK（伽马刀）可分为头部伽玛刀和体部伽玛刀","C":"MRI（磁共振成像）对中枢神经系统疾病的诊断具有较高的敏感性","D":"CT（计算机断层扫描）利用超声波穿透人体产生的反射波计算成像进行检查"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，ECMO（人工膜肺，即体外膜肺氧合）是通过体外循环技术对重症心肺功能衰竭患者提供长时间心肺支持的设备，可暂时替代心肺功能，为治疗争取时间。\nB项正确，GK（伽马刀）是一种融精确立体定向技术和聚焦放射治疗技术于一体的立体定向放射外科治疗系统，由瑞典神经外科医生拉尔斯·莱克塞尔发明。根据治疗部位的不同，伽玛刀可分为头部伽玛刀和体部伽玛刀。\nC项正确，MRI（磁共振成像）通过磁场和射频脉冲成像，对中枢神经系统（如脑、脊髓）的软组织分辨率极高，对脑部肿瘤、血管病变等诊断敏感性较高。\nD项错误，CT（计算机断层扫描）利用X射线对人体进行断层扫描，通过探测器接收X射线衰减信号并计算成像，而非超声波。超声波成像属于超声检查（如B超）的技术原理，两者原理不同。\n本题为选非题，故正确答案为D。","no":20,"missingImage":false}],"count":10,"answerable":10,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"17014829","cat":"逻辑填空","stem":"当前，AI已经日益深入人们生活。“AI角色”不仅可以成为个人助理、教师助教，还能参与部分医疗患者的康复咨询。对于生活中感到孤独或存在社交障碍的人群来说，AI陪伴可以提供及时的情感        和心理安慰，帮助用户舒缓压力、排解孤独。但与此同时，AI技术应用发展的底线和边界不能        。\n依次填入画横部分最贴切的一项是：","options":{"A":"诉求 逾越","B":"反馈 模糊","C":"治疗 降低","D":"互动 延伸"},"answer":"B","explanation":"第一空，根据“和”可知，横线处所填词语应与“安慰”构成并列关系，共同体现AI陪伴对于生活中感到孤独或存在社交障碍的人群所发挥的作用，B项“反馈”表示信息传递、返回，D项“互动”指彼此联系，相互影响的过程，均符合文意，保留；C项“治疗”指用药物、手术等手段消除疾病，与前文“参与部分医疗患者的康复咨询”对应，保留。A项“诉求”指诉说理由并提出请求，不符合文意，排除。\n第二空，搭配“底线和边界”，B项“模糊”指不分明、不清楚，搭配恰当，且能够和前文构成转折关系，符合文意，当选。C项“降低”指下降、减少，一般搭配“数量、水平、成本”等，与“边界”搭配不当，排除；D项“延伸”指延长、伸展，与“底线”搭配不当，排除。\n故正确答案为B。\n【文段出处】新华每日电讯《防止“AI伴侣”脱离法律和伦理的轨道》","no":21,"missingImage":false},{"type":"question","qid":"17014832","cat":"逻辑填空","stem":"耐心资本作为金融领域的新概念，主要指以长期投资为主，坚持价值投资、责任投资，而不以短期投机交易为目的的资本，具有与实体经济高度融合的真实性、指向明确与价值明确的确定性、低流动的          和低风险性等特征。壮大耐心资本是        未来产业的必要手段，是具有中国特色的金融治理方式的具体展现，开拓了中国特色金融发展之路。壮大耐心资本，是推进社会主义资本市场高质量发展的必然要求，也是实现科技创新和产业升级，支持战略科技产业布局的重要着力点。\n依次填入画横部分最贴切的一项是：","options":{"A":"指向性 引领","B":"盈利性 支撑","C":"稳定性 托举","D":"牢固性 保障"},"answer":"C","explanation":"第一空，形容“耐心资本”的特征，根据“低流动”“以长期投资为主”“不以短期投机交易为目的”可知，横线处表达耐心资本不会在短期内快速发生转换之意，C项“稳定性”指保持稳定不变的特点，与文意相符，且能够用来形容“耐心资本”的特征，保留。A项“指向性”形容有指定的方向和目标，与文意不符，且根据“具有与实体经济高度融合的真实性、指向明确与价值明确的确定性、低流动的······和低风险性等特征”可知，文段分别从几个不同的角度形容耐心资本的特点，前文已提及“指向明确”，横线处不会再表达此意，排除；B项“盈利性”指企业、个人或组织通过经营活动获取利润的能力，与文意不符，排除；D项“牢固性”指坚固、结实的特性，无法形容“耐心资本”的特点，排除。\n第二空，代入验证。搭配“未来产业”，形容壮大耐心资本对于未来产业的作用，C项“托举”原意指向上举起重物，现在表示助力、帮助实现之意，可以形容壮大耐心资本对于未来产业的作用，当选。\n故正确答案为C。\n【文段出处】光明日报《壮大耐心资本，托举未来产业》","no":22,"missingImage":false},{"type":"question","qid":"17014834","cat":"逻辑填空","stem":"伴随着新质生产力概念的提出，一个在文化领域的具体质态——文化新质生产力            。文化新质生产力将成为新时代建设中华民族现代文明的新        。进一步解放和发展文化新质生产力，需要激活文化在社会发展中的作用，形成推动中华民族现代文明建设的强大动力。\n依次填入画横部分最贴切的一项是：","options":{"A":"呼之欲出 引擎","B":"异军突起 动能","C":"横空出世 趋势","D":"应运而生 业态"},"answer":"A","explanation":"本题可从第二空入手，根据后文“进一步解放和发展文化新质生产力······，形成推动中华民族现代文明建设的强大动力”可知，横线处应体现文化新质生产力将成为建设中华民族现代文明的动力。A项“引擎”指发动机，比喻推动工作、事业等前进和发展的力量，B项“动能”指物体由于机械运动而具有的能，均符合文意，保留。C项“趋势”指事物发展的动向，强调发展的方向，D项“业态”指业务经营的形式、状态，均与文意无关，排除。\n第一空，根据“伴随着新质生产力概念的提出，一个在文化领域的具体质态······”及“文化新质生产力将成为······”可知，横线处应体现文化新质生产力也将会随着新质生产力概念的提出而产生之意。A项“呼之欲出”形容画像十分逼真，也指某事即将揭晓或出现，符合文意，当选。B项“异军突起”比喻另一支新的力量突然出现，与“文化新质生产力”产生的语境不符，排除。\n故正确答案为A。\n【文段出处】中国社会科学网《提升中华民族现代文明影响力》","no":23,"missingImage":false},{"type":"question","qid":"17014842","cat":"逻辑填空","stem":"中医药学作为中华民族原创的医学科学，是一门关于生命智慧和生命艺术的学问，被古人称为“生生之学”。中医药文化博大精深，蕴含着            的“整体观”、养生防病的“未病观”。它        于中华民族优秀传统文化，体现了和而不同、仁者爱人、以人为本等中华文化精髓。\n依次填入画横部分最贴切的一项是：","options":{"A":"高屋建瓴 发轫","B":"天人合一 植根","C":"允执厥中 萌生","D":"相生相克 浸润"},"answer":"B","explanation":"第一空，形容“整体观”，该观念强调将多个事物结合到一起进行分析，B项“天人合一”是中国古代哲学中关于自然和人之间关系的一种观点，强调自然和人的结合，可与“整体观”对应，保留。A项“高屋建瓴”形容居高临下的形势，现指对事物把握全面，了解透彻，C项“允执厥中”形容言谈举止能真诚地保持在不偏不倚的中正之道，D项“相生相克”指古代关于水、火、木、金、土五种物质间相互促进、相互排斥的观点，均无法与“整体观”对应，排除。\n第二空，代入验证。B项“植根”指扎根，置于此处可体现中医药学源于中华民族优秀传统文化，符合文意，当选。\n故正确答案为B。\n【文段出处】央视网《中医国粹 根深叶茂》","no":24,"missingImage":false},{"type":"question","qid":"17014845","cat":"逻辑填空","stem":"减重不是秤上的数字游戏，而是一种            的健康生活方式。均衡饮食，尽可能摄入多样化食物，限制高糖、高盐、高脂和加工食物的摄入，同时选择自己感兴趣且适合自己的体育运动，增强肌肉和骨骼的力量，不仅能更好地控制体重，也能让精神面貌            。\n依次填入画横部分最贴切的一项是：","options":{"A":"行之有效 光彩夺目","B":"立竿见影 与众不同","C":"细水长流 焕然一新","D":"循序渐进 改头换面"},"answer":"C","explanation":"本题可从第二空入手，横线处搭配“精神面貌”，应体现减重能让自己的精神面貌变得更好之意，C项“焕然一新”指改变陈旧的面貌，呈现出崭新的样子，符合文意，保留。A项“光彩夺目”指光彩鲜明耀眼，通常用来形容物体的外观、具体的场景或某些艺术作品和艺术形象的极高成就，与“精神面貌”搭配不当，排除；B项“与众不同”表示与其他人不一样，文段强调减重使精神面貌变得更好，而非强调不同，与文意不符，排除；D项“改头换面”比喻只改变外表和形式，内容实质不变，感情色彩偏消极，与文段感情色彩不符，且与“面貌”语义重复，排除。\n第一空，代入验证，C项“细水长流”比喻一点一滴不间断地做某件事，精细安排，长远打算，置于此处能体现出减重这种健康生活方式是需要长期坚持的，符合文意，当选。\n故正确答案为C。\n【文段出处】光明日报《体重管理是健康大事 更是一项系统工程》","no":25,"missingImage":false},{"type":"question","qid":"17014857","cat":"逻辑填空","stem":"“广大党员、干部特别是高级干部要学好用好《共产党宣言》等马克思主义经典著作，坚持学以致用、用以促学，原原本本学，熟读精思、学深悟透，熟练掌握马克思主义立场、观点、方法，不断提高马克思主义理论素养。”            马克思主义经典著作中的名言警句，        运用马克思主义基本原理解决当代中国实际问题，把马克思主义基本原理同中国具体实际、同中华优秀传统文化相结合······习近平总书记扎实深厚的马克思主义理论功底，源于他多年孜孜不倦的阅读。\n依次填入画横部分最贴切的一项是：","options":{"A":"旁征博引 巧妙","B":"应口成诵 科学","C":"熟稔于心 灵活","D":"信手拈来 娴熟"},"answer":"D","explanation":"第一空，搭配“名言警句”，且根据“熟读精思、学深悟透，熟练掌握马克思主义立场、观点、方法，不断提高马克思主义理论素养”可知，横线处所填成语应体现对马克思主义经典著作中的名言警句十分熟悉之意，D项“信手拈来”指随手拿来，多形容写文章时词汇或材料丰富，不费思索，就能写出来，能体现十分熟悉之意，符合文意，保留。A项“旁征博引”指为了表示论证充足而广泛地引用材料，侧重引用的材料数量多、范围广，与“马克思主义经典著作”搭配不当，排除；B项“应口成诵”指随口背诵，形容记忆力和反应速度非常快，“背诵”仅体现机械记忆，与文段熟练掌握，深入理解语境不符，排除；C项“熟稔于心”指非常熟悉，多用来表示对一件事物或一种题目比较熟悉，常用句式为“对······熟捻于心”，置于此处用法不当，排除。\n第二空，代入验证。搭配“运用”，D项“娴熟”指熟练，与“运用”搭配恰当，且能与第一空形成呼应，当选。\n故正确答案为D。\n【文段出处】求是网《习近平@领导干部：要读好三类书》","no":26,"missingImage":false},{"type":"question","qid":"17014858","cat":"逻辑填空","stem":"在科技前沿创新中，传感器是“          ”。纵观科技发展史，历次世界科学中心的形成都          核心传感器技术突破以及以此为基础的重要科学仪器的诞生。有统计表明，在诺贝尔奖的获奖名单中，72%的物理学奖、81%的化学奖、95%的生理学或医学奖都是借助于尖端传感器与仪器完成的，且已有38项、60余人次由于发明了新原理的科学仪器而直接获奖。而科学仪器对事物进行检测表征，获得科学数据的关键就是高端传感器：比如X射线衍射仪、X射线断层扫描仪、超分辨率荧光显微镜、电子显微镜等仪器中的光电探测器，电子探测器、温度传感器，质谱仪、扫描隧道显微镜中的位移传感器等。而现代科学仪器中，高端传感器是          的，直接代表了分析、检测和表征的水平。\n依次填入画横部分最贴切的一项是：","options":{"A":"领航员 起源于 基础性","B":"先行官 得益于 决定性","C":"排头兵 依赖于 核心性","D":"联络员 依赖于 典型性"},"answer":"B","explanation":"第一空，搭配“传感器”，用以表达“传感器在科技前沿创新中的作用”，结合后文“纵观科技发展史，历次世界科学中心的形成都······核心传感器技术突破以及以此为基础的重要科学仪器的诞生”以及具体的例子可知，横线处所填词语应体现传感器在科技前沿创新中起到领头先行的作用，B项“先行官”指领头的将领，比喻最先行动的人或事，C项“排头兵”指在队伍或组织中处于最前面，起到带头作用的人或群体，均符合文意，保留。A项“领航员”指引导船舶、飞机或飞艇按预定航线航行的人员，侧重强调对方向的指引，而传感器并非起到引领整个科技创新方向的作用，与文意不符，排除；D项“联络员”指建立并保持相互了解的相互联系的人员，侧重联络作用，与文意无关，排除。\n第二空，根据“有统计表明，在诺贝尔奖的获奖名单中······发明了新原理的科学仪器而直接获奖”可知，横线处所填词语应体现核心传感器技术突破以及以此为基础的重要科学仪器的诞生有助于科学中心的形成，B项“得益于”指因为某个因素或条件而获得了某种利益或优势，符合文意，保留。C项“依赖于”指各个事物或现象互为条件而不可分离，强调“必需性”，与文段强调的“有助于”不符，排除。\n第三空，代入验证。B项“决定性”指对产生某种结果起决定作用的性质，置于横线处用以形容“高端传感器”在“现代科学仪器”中的地位和作用，与后文的“直接代表了分析、检测和表征的水平”对应恰当，符合文意，当选。\n故正确答案为B。\n【文段出处】《尤政院士：为什么高端传感器是一项至关重要的“卡脖子”技术？》","no":27,"missingImage":false},{"type":"question","qid":"17014835","cat":"逻辑填空","stem":"近期        的国家公园主题纪录片，不仅擅长借助航拍或远景镜头呈现动物与自然环境怡然相依的和谐关系，反映自然界的神秘、宏伟，还        微距摄影、红外摄影等新型摄影技术，以微观视角切入，呈现物种、环境之间相互依存的生命支持系统，揭示国家公园            的生命奇观和令人震撼的自然之美。\n依次填入画横线部分最贴切的一项是：","options":{"A":"发布 植入 变幻莫测","B":"供应 嵌入 绚丽多彩","C":"展演 引入 叹为观止","D":"涌现 融入 鲜为人知"},"answer":"D","explanation":"本题可从第二空入手，搭配“新型摄影技术”，且根据文意可知，是将原有技术与新型摄影技术结合起来共同展示自然界情况，C项“引入”指引进以前没有或不存在的东西，D项“融入”指融合、混入、混合，均与“新型摄影技术”搭配恰当，且符合文意，保留。A项“植入”指加入、插入，通常搭配“广告”“芯片”等，与“新型摄影技术”搭配不当，排除；B项“嵌入”指牢固地、深深地固定或树立，与“新型摄影技术”搭配不当，且文段并未体现“牢固、固定”之意，排除。\n再看第三空，搭配“生命奇观”，D项“鲜为人知”指很少有人知道，与“生命奇观”搭配恰当，保留。C项“叹为观止”形容所见到的事物好到了极点，通常用法为“令人叹为观止”“让人叹为观止”，置于此处用法错误，排除。\n第一空，代入验证。搭配“纪录片”，D项“涌现”意思是在同一时期大量出现，与“纪录片”搭配恰当，当选。\n故正确答案为D。\n【文段出处】光明日报《国家公园主题纪录片：展山河之美、生态之美》","no":28,"missingImage":false},{"type":"question","qid":"17014846","cat":"逻辑填空","stem":"这些大国工程，建设速度之快、数量之巨、体量之大、形式之新，            ，折射出工程美学与各类学科的巧妙碰撞。更绿色、更科技、更智慧的工程奇迹，如同        在中华大地上的奇葩，熠熠闪光，深刻反映出工程设计与建造领域的环保监测、美学革新、品质跃升、智慧升级的有机融合，与背后的工程技术创新支撑            ，夯实了美丽中国建设的根基，成就大国风范的“颜值担当”。\n依次填入画横线部分最贴切的一项是：","options":{"A":"世所罕见 绽放 相辅相成","B":"百年不遇 闪耀 不可分割","C":"千载难逢 盛开 珠联璧合","D":"旷古未有 镶嵌 息息相关"},"answer":"A","explanation":"第一空，根据“建设速度之快、数量之巨、体量之大、形式之新”以及后文“折射出工程美学与各类学科的巧妙碰撞”“工程奇迹”可知，横线处强调大国工程在建设速度、数量、体量、形式等方面是非同寻常的。A项“世所罕见”指事物难得见到，少见到，D项“旷古未有”指极为罕见，均可以体现大国工程在上述方面取得的成绩是独特和罕见的，符合文意，保留。B项“百年不遇”意思为一百年也碰不到，形容很少见到或很少出现，强调发生的概率极低，且往往是偶然、意外的情况，横线处并非强调大国工程在上述方面的成绩是偶然发生的，与文意不符，排除；C项“千载难逢”指一千年里也难得遇到，形容机会极其难得和宝贵，与文段强调的大国工程内容无关，排除。\n第二空，根据“如同······的奇葩”可知，横线处将这些“工程奇迹”形象的比作“奇葩”，故横线处搭配“奇葩”并构成生动形象的对应。“奇葩”指奇特而美丽的花朵，A项“绽放”指花朵开放，填入横线处生动形象地体现出这些工程奇迹如同花朵盛开般展现光彩的状态，搭配恰当，保留。D项“镶嵌”指把一物体嵌入另一物体内，与“奇葩”搭配不当，排除。\n第三空，代入验证。A项“相辅相成”指两件事物互相配合，互相辅助，缺一不可，可以体现出工程设计与建造领域的各个方面有机融合与背后的工程技术创新支撑相互配合的紧密关系，符合文意，当选。\n故正确答案为A。\n【文段出处】国家人文历史《方江山｜以高水平工程美学助力全面推进美丽中国建设》","no":29,"missingImage":false},{"type":"question","qid":"17014851","cat":"逻辑填空","stem":"火山与热浪，高山与田园，古镇与村寨，形成腾冲        的独特景观，自然与人文两种景观在腾冲这里            ，顾盼生姿，共同汇聚成了胡焕庸线西南段的华彩。和顺古镇是屯田戍边的明军遗作，当地边缘建起南明王朝，滇西抗战与胡焕庸线便是腾冲            地靠近中国历史与地理的必然。\n依次填入画横部分最贴切的一项是：","options":{"A":"奇幻 周而复始 义无反顾","B":"秀美 纵横交错 理所当然","C":"多重 循环往复 史无前例","D":"壮丽 相得益彰 前所未有"},"answer":"D","explanation":"第一空，根据前文“火山与热浪，高山与田园，古镇与村寨”可知，横线处词语应体现腾冲的景观丰富多样，壮观美丽，C项“多重”指多种多样，可以体现腾冲景观的多层次，D项“壮丽”多指山川、建筑、图景、场面等，宏伟瑰丽，能够体现多种景观相互映衬的宏大场面，均符合文意，保留。A项“奇幻”意思是奇异而虚幻，不真实，文中并未体现奇异虚幻的特点，与文意不符，排除；B项“秀美”指秀丽美好，无法体现多种景观交织的壮观场面，与文意不符，排除。\n第二空，根据后文“顾盼生姿，共同汇聚成了胡焕庸线西南段的华彩”可知，横线处成语应体现自然与人文两种景观在腾冲相互配合，展现出美丽的姿态，D项“相得益彰”指两个人或两件事物互相配合，双方的能力和作用更能显示出来，符合文意，保留。C项“循环往复”形容反复不断，侧重于循环，与文意不符，排除。\n第三空，代入验证，D项“前所未有”意思是从来没有过，置于此处可以体现腾冲这种自然、人文与历史地理结合的独特性和新奇性，与文意相符，当选。\n故正确答案为D。","no":30,"missingImage":false},{"type":"question","qid":"14403667","cat":"语句表达","stem":"治国之要，首在用人。党的十八大以来，以习近平同志为核心的党中央明确信念坚定、为民服务、勤政务实、敢于担当、清正廉洁的新时代好干部标准，着力建设忠诚干净担当的高素质干部队伍。                    ，注重在基层一线和困难艰苦环境中培养锻炼干部、在重大任务和重大斗争一线发现使用干部，放眼各条战线、各个领域、各个行业选拔优秀干部。同时，建立管思想、管工作、管作风、管纪律的从严管理体系，建立崇尚实干、带动担当、加油鼓劲的正向激励体系，不断增强组织工作、队伍建设的整体效能。\n填入画横线部分最恰当的一项是：","options":{"A":"完善干部培养选拔机制","B":"建立干部从严管理体系","C":"健全干部考核评价体系","D":"坚持正确选人用人导向"},"answer":"A","explanation":"横线出现在文段中间，需要结合上下文内容综合分析。文段开篇通过“首”强调人的重要性，接下来指出要建设忠诚干净担当的高素质干部队伍，横线后进一步指出要培养锻炼、发现和选拔优秀干部，故横线处应体现出要培养锻炼选拔干部之意，对应A项。\nB项“从严管理体系”对应“同时”之后的内容，与横线后内容衔接不当，排除；\nC项“考核评价体系”文段并未提及，无中生有，排除；\nD项，没有提及文段核心话题“干部”，排除。\n故正确答案为A。\n【文段出处】人民日报《以锻造坚强组织、建设过硬队伍为重要着力点（思想纵横）——准确把握推进自我革命“九个以”的实践要求⑦》","no":31,"missingImage":false},{"type":"question","qid":"14403666","cat":"片段阅读","stem":"自古以来，中华文明在继承创新中不断发展，积淀着中华民族最深沉的精神追求。回望历史长河，在先秦子学、两汉经学、魏晋玄学等演变历程中，中国哲学论域不断拓宽、创见持续迸发；耒耜、石犁、青铜犁、曲辕犁的耕具更替，见证着农业技术的进步与生产力的提高；军功制、察举制、科举制等人才选拔制度之变，让更多有才之士脱颖而出······透过历史的长镜头，可以看到，中华文明在思想、技术、制度等各方面不断推陈出新。以数千年大历史观之，变革和开放总体上是中国的历史常态。\n这段文字意在说明：","options":{"A":"中华文明沉淀着我们民族的精神追求","B":"中华文化在各领域持续焕发生机活力","C":"变革和开放总体上是中国的历史常态","D":"一部中华文明发展史就是一部创新史"},"answer":"D","explanation":"文段开篇指出中华文明一直在继承创新中不断发展，接着通过列举思想创新、农业技术迭代创新、人才选拔制度革新等具体案例进一步论证了创新贯穿于中华文明的全过程，尾句再次强调变革和开放在中国数千年历史中始终存在。故文段重在强调中国文明发展历史中始终贯穿着“创新”这一主题，对应D项。\nA项，缺少文段核心话题“创新”，偏离文段中心，排除；\nB项，“各领域”对应文段中举例部分的内容，非重点，且缺少文段核心话题“创新”，偏离文段中心，排除；\nC项，虽然尾句提及“变革和开放总体上是中国的历史常态”，但文段主要围绕“创新”展开论述，“变革”置于此处为创新的外在表现，“开放”指吸纳创新的态度，并非强调“变革和开放”，偏离文段核心话题“创新”，排除。\n故正确答案为D。\n【文段出处】人民日报《激扬“创新性”，书写中华文明新的辉煌篇章（人民观点）——深刻把握中华文明的突出特性③》","no":32,"missingImage":false},{"type":"question","qid":"14403665","cat":"片段阅读","stem":"在健康监测领域，柔软弹性电极可集成到智能手环、智能贴片和智能衣物中，实时监测心率、血压等生理参数。这些电极能紧密贴合皮肤，准确采集生物信号，为医疗诊断和健康管理提供可靠的数据支持。在运动追踪方面，可穿戴设备中的柔软弹性电极，可以监测运动员的动作、姿势和肌肉活动，帮助他们优化训练方案，降低受伤的风险。在人机交互领域，柔软弹性电极材料可应用于智能手套、智能表带等设备，实现更加自然和直观的操作方式。此外，它们还可用于能量收集和存储设备，为可穿戴设备提供持续的能源供应。\n这段文字主要介绍柔软弹性电极材料：","options":{"A":"实现了更为真实的人机交互体验","B":"突破了传统电极材料的应用局限","C":"为人们运动健康提供了前所未有的便利","D":"为可穿戴电子设备带来广泛的应用前景"},"answer":"D","explanation":"文段首先指出在健康监测领域，柔软弹性电极应用到智能手环可以准确采集生物信号，接下来介绍在运动追踪方面，柔软弹性电极应用到可穿戴设备中，可以帮助运动员降低受伤的风险，然后介绍在人机交互领域，柔软弹性电极材料可应用于智能手套、智能表带等设备，优化操作方式，最后介绍了柔软弹性电极材料为可穿戴设备提供持续的能源供应。故文段为并列结构，重点强调柔软弹性电极材料用于可穿戴设备后在不同领域都有广阔的应用前景，对应D项。\nA、C两项，仅对应文段的部分内容，表述片面，排除；\nB项，“传统电极材料”文段并未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】《柔软电极材料，让可穿戴电子设备不再僵硬》","no":33,"missingImage":false},{"type":"question","qid":"14403664","cat":"语句表达","stem":"鼓励用户购买绿证，推动绿电消费，是国际通行做法。在推动全球气候治理的当下，绿色发展已成为全球共识。在国际市场上，一些跨国企业已承诺100%使用绿电，并对供应商提出相应要求，随着资源环境约束趋紧，大批国内企业也在积极使用绿电，主动加快绿色转型，吸引重视绿色低碳要素的投资者、消费者。在某些地区，外向型企业获得绿色电力消费认证的需求持续增加。                    。以市场化方式，引导愿意承担更多社会责任的用户扩大绿电消费，有助于推动可再生能源开发利用形成良性循环，为经济社会发展注入更强劲的绿色动力。\n填入画横线部分最恰当的一项是：","options":{"A":"购买绿证，是获得这类认证更便捷的方式","B":"国内企业在绿电消费方面的需求尚未凸显","C":"与直接购买绿电相比，绿证交易更为灵活","D":"对绿电消费，是实现绿色转型最直接的体现"},"answer":"A","explanation":"横线出现在文段中间，需结合前后文进行分析。文段开篇指出鼓励购买绿证，推动绿电消费，是国际通行做法，接着介绍绿色发展成为全球共识，国内外企业积极使用绿电的现状。随后指出外向型企业获得绿色电力消费认证的需求持续增加，横线之后指出用市场化方式引导愿意承担更多社会责任的用户扩大绿电消费。结合横线前后文内容可知，横线处既要承接前文提到的“企业认证需求增加”，又要与后文“市场化方式”对应，A项“购买绿证”即可满足前文提到的企业绿电消费认证需求增加这一情况，又能与后文“市场化方式”对应，当选。\nB项，“国内企业在绿电消费方面的需求尚未凸显”与前文“需求持续增加”矛盾，无法衔接，排除；\nC项，强调的是“绿证交易”的灵活性，但无法衔接前文的“需求增加”，排除；\nD项，“实现绿色转型最直接的体现”与前文的“认证”及后文“市场化方式”均无法衔接，排除。\n故正确答案为A。\n【文段出处】中工网《以市场化方式凸显绿电环境价值》","no":34,"missingImage":false},{"type":"question","qid":"14403669","cat":"片段阅读","stem":"自《丝路花雨》创造性产出“敦煌舞”以来，艺术家们持续以当代艺术审美探索敦煌乐舞与时代接轨的切口，追求其艺术价值与现实价值的结合，不断给观众带来更加丰富的审美体验。作为敦煌舞的开山之作，《丝路花雨》所体现的审美取向，深刻影响了后来很多敦煌舞的创作，如《大梦敦煌》《千手观音》《飞天》等，这些作品继续以当代视角深挖敦煌文化，更为凸显了敦煌文化“互鉴共融”的核心特质：在舞蹈方面，大胆将古典舞与现代舞，民族舞与芭蕾舞等多种舞蹈形式交织融合；音乐领域也同样展现出多元化的特点，传统与现代、民族与世界、电子与交响等不同风格的音乐在这里相互借鉴、融合共生。\n这段文字意在强调艺术家们：","options":{"A":"化敦煌石窟壁画为曼妙舞姿","B":"赋予敦煌舞以当代艺术审美","C":"推动敦煌舞艺术创造性转化","D":"深度挖掘敦煌舞的文化特质"},"answer":"B","explanation":"文段开篇指出自《丝路花雨》产出“敦煌舞”后，艺术家们持续以当代艺术审美探索敦煌乐舞与时代接轨的切口，追求艺术价值与现实价值的结合。接着进一步论述《丝路花雨》体现的审美取向，影响了诸多敦煌舞创作，后文通过举例指出，这些作品正是在当代艺术审美的影响之下，无论是在舞蹈还是音乐领域都凸显了敦煌文化“互鉴共融”特质，故文段重在强调艺术家们赋予了敦煌舞当代艺术审美，对应B项。\nA项，“化敦煌石窟壁画为曼妙舞姿”仅对应后文多角度论述部分内容，非重点且表述片面，排除；\nC项“创造性转化”、D项“深度挖掘敦煌舞的文化特质”均偏离文段核心话题“当代”，排除。\n故正确答案为B。\n【文段出处】光明日报《民族舞剧&lt;丝路花雨&gt;：赋敦煌乐舞以当代生命》","no":35,"missingImage":false},{"type":"question","qid":"10886440","cat":"片段阅读","stem":"许多飞机的机头或机翼上，都有一根长长的“尖刺”。其实，它的真实身份，是飞机上一个重要测速装置——空速管。空速管由两个嵌套在一起的中空细管组成，其中一个连通外界，用来获取当前环境气压；另一个正面迎风，用来获取气流产生的总压。两根细管之间形成的压力差，会引起膜盒形变或液柱高差，经过相应计算，就可以得到当前空速，并显示在飞机的仪表盘上。空速管的“存在感”极强，“出镜率”很高，几乎每架飞机必备。作为一种机械装置，它比电子测速设备更加简便可靠、物美价廉。但随着现代航空技术的发展，它开始变得“碍事”起来。\n这段文字没有提及空速管的：","options":{"A":"工作原理","B":"外观特征","C":"技术优势","D":"使用现状"},"answer":"D","explanation":"A项，根据“空速管由两个嵌套在一起的中空细管组成，其中一个连通外界······另一个正面迎风······经过相应计算，就可以得到当前空速，并显示在飞机的仪表盘上”可知，文段详细介绍了空速管的工作原理，排除；\nB项，根据“许多飞机的机头或机翼上，都有一根长长的‘尖刺’。其实，它的真实身份，是飞机上一个重要测速装置——空速管”可知，空速管的外观是“尖刺”状，文段介绍了空速管的外观特征，排除；\nC项，根据“作为一种机械装置，它比电子测速设备更加简便可靠、物美价廉”可知，文段介绍了空速管相比其它电子测速设备的技术优势，排除；\nD项，文段中没有提及空速管的具体使用现状，无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】中国军网《说说飞机前端的“尖刺”》","no":36,"missingImage":false},{"type":"question","qid":"17014850","cat":"片段阅读","stem":"深入海底的探险之旅，不仅对理解地球深处如何孕育顽强的生命至关重要，还为我们揭开全球碳循环的秘密，甚至为保护珍贵的生态多样性提供了钥匙。然而，深海的未知与极端环境对科学家来说一直是一大挑战，那些错综复杂的生物化学反应更是让人困惑不解的谜团。在解开深海之谜的旅程中，科研团队已经取得了突破性进展——成功研制出一种先进的深海原位实验室。这一创新成果是通过突破一系列关键技术实现的，同时还探索了新型的水下设备布放及回收模式。\n这段文字接下来最有可能讲述的是：","options":{"A":"深海原位实验室的装备和功能","B":"深海原位实验室的创建与突破","C":"深海碳循环和生态研究的进展","D":"深海生物化学反应的过程揭秘"},"answer":"A","explanation":"根据提问方式可知，本题为接语选择题，应在通读全文的基础上，重点关注文段最后论述的核心话题。文段先是阐述了深入海底的探险之旅的重要意义以及面临的挑战，接着提到科研团队取得了突破性进展，即成功研制出一种先进的深海原位实验室，并且说明了这一创新成果是通过突破一系列关键技术实现的，以及探索出新型设备布放和回收模式。接下来最有可能围绕文段最后谈论的核心话题“深海原位实验室”展开进一步的介绍，对应A项。\nB项，“深海原位实验室的创建与突破”前文已经论述，后文不会再论述，排除；\nC项“深海碳循环和生态研究的进展”、D项“深海生物化学反应的过程揭秘”均与文段最后论述的核心话题“深海原位实验室”不一致，排除。\n故正确答案为A。\n【文段出处】光明网《深海冷泉区 海底深处的生命舞台》","no":37,"missingImage":false},{"type":"question","qid":"17014840","cat":"片段阅读","stem":"当前，金融有效支持全生命周期科技创新仍存在一些短板，科技创新的资金需求与传统金融供给方式存在一定程度的不匹配，必须加快完善金融支持政策体系和配套机制，丰富金融支持工具，全面提升金融机构和金融市场服务科技创新能力，加快建成与高水平科技自立自强目标高度适配的金融服务体系。一方面，要充分发挥银行业金融机构作用，引导银行根据不同发展阶段科技型企业的需求，针对性提供覆盖企业全生命周期的多元化金融服务，另一方面，要更好发挥资本市场作用，资本市场具有风险共担、利益共享机制，能够有效促进创新资本形成，赋能科技成果转化。\n这段文字主要介绍了：","options":{"A":"金融市场的短板与提升空间","B":"金融支持科技创新大有可为","C":"提升金融体系服务科技创新能力至关重要","D":"金融服务科技创新的不足与具体应对措施"},"answer":"D","explanation":"文段开篇指出金融有效支持全生命周期科技创新存在短板，接下来提出多个对策：必须加快完善相关体系和机制，提升金融机构和金融市场服务科技创新能力，建成与高水平科技自立自强目标适配的金融服务体系。后文通过“一方面······另一方面······”具体介绍了如何提升金融服务科技创新的能力。综上所述，文段指出了金融服务在支持科技创新方面存在的不足，并且给出了具体的解决方式，对应D项。\nA项，缺少文段核心话题“科技创新”，排除；\nB项，“大有可为”表述不明确，没有概括到文段提出的具体措施，排除；\nC项，“提升金融体系服务科技创新能力”仅对应前文提到的措施之一，表述片面，排除。\n故正确答案为D。\n【文段出处】人民日报《为科技创新注入更强金融动力》","no":38,"missingImage":false},{"type":"question","qid":"17014841","cat":"片段阅读","stem":"应急机器人是在安全生产和防灾减灾救灾过程中，执行监测预警、搜索救援和生产作业等任务，能够实现半自主或全自主控制，部分替代或完全替代人类工作的智能机器系统的总称。在安全生产应急救援领域推广使用应急机器人，能够确保一线救援人员科学救援、高效救援、安全救援，可以有效提升整个行业装备专业化、精细化、科技化、智能化水平。目前我国应急机器人处于快速启动和发展阶段，急需着力推动以应急机器人为代表的先进技术创新和成果转化，突破共性关键技术，增强产品供给，加快推广应用，打造应急机器人体系。\n根据这段文字，无法推出：","options":{"A":"应急机器人代表了应急装备现代化趋势","B":"应急机器人已广泛应用于应急救援领域","C":"加快推进应急机器人关键技术攻关十分必要","D":"应急机器人在某些领域能完全替代人类工作"},"answer":"B","explanation":"A项，根据“应急机器人是······部分替代或完全替代人类工作的智能机器系统的总称”“在安全生产应急救援领域······可以有效提升整个行业装备专业化、精细化、科技化、智能化水平”可知，应急机器人可以帮助救援人员参与救援，且提升了应急装备专业化、精细化、科技化、智能化水平，故可以推出应急机器人代表了应急装备现代化趋势，排除；\nB项，根据“目前我国应急机器人处于快速启动和发展阶段······加快推广应用，打造应急机器人体系”可知，应急机器人还处于启动和发展阶段，需要加快推广应用，故“已广泛应用”表述错误，当选；\nC项，根据“目前我国应急机器人处于快速启动和发展阶段，急需着力推动以应急机器人为代表的先进技术创新和成果转化，突破共性关键技术，增强产品供给，加快推广应用，打造应急机器人体系”可以推出加快推进应急机器人关键技术攻关十分必要，排除；\nD项，根据“应急机器人是在安全生产和防灾减灾救灾过程中，执行监测预警、搜索救援和生产作业等任务，能够实现半自主或全自主控制，部分替代或完全替代人类工作的智能机器系统的总称”可以推出应急机器人在某些领域可以完全替代人类工作，排除。\n本题为选非题，故正确答案为B。\n【文段出处】《应急管理部 工业和信息化部关于加快应急机器人发展的指导意见》","no":39,"missingImage":false},{"type":"question","qid":"17014849","cat":"片段阅读","stem":"研究发现，野生非洲象和人类一样会用类似“名字”的叫声来“称呼”对方。研究人员使用机器学习模型确认，大象叫声中包含了一个类似名字的成分。当研究人员回放录制的大象叫声时，目标大象会作出积极回应或者走向播放录制叫声的音箱，而呼唤其他大象的叫声则很少引起目标大象的反应。研究还发现，大象和人类一样，并不总是用名字称呼对方，而是在远距离沟通或成年象与幼象之间，用名字称呼对方更为常见。学习发出新声音的能力在动物中并不常见，但却是通过名字识别个体的必要条件。这类通过任意一种而非模仿的特定声音来表达一种想法的能力，被认为是一种更高层次的认知技能，是对交流能力的极大扩展。\n这段文字接下来最有可能讲述的是：","options":{"A":"大象能用抽象声音命名其他个体能力的动因","B":"大象和人类在命名称呼方面进化的历史轨迹","C":"大象之间相互用“名字”称呼的人类学意义","D":"人类如何用大象的叫声来引导野生象群迁徙"},"answer":"A","explanation":"文段开篇指出野生非洲象会用类似“名字”的叫声来“称呼”对方，接着通过研究人员的实验进行解释说明，随后指出另一个研究发现，即在远距离沟通或成年象与幼象之间，用名字称呼对方更为常见，最后指出学习发出新声音是通过名字识别个体的必要条件，接着通过指代词“这类”总结强调大象通过特定声音表达想法的能力是更高层次的认知技能，是对交流能力的扩展。故接下来应继续围绕大象用特定声音命名这种能力展开论述，对应A项。\nB项，“大象和人类在命名称呼方面进化的历史轨迹”偏离文段最后谈论的核心话题，文段最后重点在论述大象，衔接不当，排除；\nC项，“人类学意义”文与文段最后谈论的核心话题不一致，衔接不当，排除；\nD项，“引导野生象群迁徙”与文段最后谈论的核心话题不一致，衔接不当，排除。\n故正确答案为A。\n【文段出处】新华网《研究发现大象会相互用“名字”称呼》","no":40,"missingImage":false},{"type":"question","qid":"17014861","cat":"片段阅读","stem":"维持适宜的温度范围对于保障电池性能和延长寿命至关重要。借助无线充电技术的应用，电池包的智能温控系统能够更精确地监控和调节电池温度，从而提升整个系统的效能和安全性。智能温控系统通过无线传感器网络实现，该网络包含多个温度传感器，分布在电池包的各个关键部位。这些传感器能够实时收集温度数据，并通过无线方式传输至中央处理单元。中央处理单元分析这些数据，基于预设的最优温度算法调整冷却系统的运行。通过这种智能温控系统，确保电池包可以在任何外部条件和充电状态下维持最佳温度，从而提高电池效率和延长使用寿命。\n这段文字意在强调：","options":{"A":"维持适宜的温度范围对于保障电池性能和延长寿命的重要意义","B":"无线充电技术的应用提升了电池智能温控系统的效能和安全性","C":"电池包的智能温控系统如何实现更精确地监控和调节电池温度","D":"智能温控系统可使电池包在任何外部条件下都能维持最佳温度"},"answer":"C","explanation":"文段开篇指出维持适宜的温度范围对保障电池性能和延长寿命的重要性，接着论述电池包的智能温控系统能够更精确地监控和调节电池温度，从而提升整个系统的效能和安全性，随后详细阐述智能温控系统实现精确监控和调节温度的具体方式，尾句通过指代词“这种”再次强调智能温控系统的运行能够提高电池效率和延长使用寿命。故整个文段为“总-分-总”结构，重点强调电池包的智能温控系统实现更精确地监控和调节电池温度的方式，对应C项。\nA项，“维持适宜温度范围的重要意义”对应文段开篇引出话题部分的内容，非重点，排除；\nB项，“无线充电技术的应用”对应文段解释说明部分的内容，非重点，且文段重在强调提升了“电池”的效能和安全性，而非“智能温控系统”，偷换概念，排除；\nD项，“任何外部条件下都能维持最佳温度”是智能温控系统运行后达成的效果，文段重在强调智能温控系统是如何实现对温度的精确监控与调节的，非重点，排除。\n故正确答案为C。","no":41,"missingImage":false},{"type":"question","qid":"17014860","cat":"片段阅读","stem":"“东夷”一词目前最早见于晚商的武丁时期，与之相对应，中原商王朝此时应该自称为中土或中国。当然，这里发现的“东夷”未必是最早的东夷，联系到考古发现的实际情况，即二里冈上层文化时期商王朝的对外强势扩张，领土四至远远超出了此前的二里冈下层和二里头文化时期。所以，到二里冈上层文化时期，可以明确地认为中原作为中华全域的中心已经形成。这一阶段很可能已经出现了“中国”的称谓。再往前，即二里冈上层之前的二里冈下层和二里头文化时期，则属于“夷夏东西”的二元格局阶段，中原中心的趋势虽然开始显现，但作为中华全域的中心地位尚未形成。\n下列哪一说法无法从原文中得到支持?","options":{"A":"在武丁时期，位于中原的商王朝有可能会自称为“中国”","B":"在二里冈上层文化时期，商王朝疆域领土面积最为辽阔","C":"中原作为中华全域的中心，形成于二里冈上层文化时期","D":"“夷夏东西”二元格局阶段，一直持续到二里头文化时期"},"answer":"B","explanation":"A项，根据“‘东夷’一词目前最早见于晚商的武丁时期，与之相对应，中原商王朝此时应该自称为中土或中国”可知，在武丁时期，位于中原的商王朝可能会自称为“中国”，表述正确，排除；\nB项，根据“即二里冈上层文化时期商王朝的对外强势扩张，领土四至远远超出了此前的二里冈下层和二里头文化时期”可知，文段仅提及商王朝疆域领土面积在二里冈上层文化时期比二里冈下层和二里头文化时期要大，但无法得知是最大的，“最为辽阔”表述绝对，且根据常识可知，商王朝疆域领土面积最辽阔的时期是武丁时期，当选；\nC项，根据“所以，到二里冈上层文化时期，可以明确地认为中原作为中华全域的中心已经形成”可知，中原作为中华全域的中心，形成于二里冈上层文化时期，表述正确，排除；\nD项，根据“再往前，即二里冈上层之前的二里冈下层和二里头文化时期，则属于‘夷夏东西’的二元格局阶段”可知，“夷夏东西”二元格局阶段，一直持续到二里头文化时期，表述正确，排除。\n本题为选非题，故正确答案为B。\n【文段出处】文史哲杂志《夷夏东西：从多元到一统的重要过渡阶段》","no":42,"missingImage":false},{"type":"question","qid":"17014852","cat":"片段阅读","stem":"“玻璃凝胶”这种材料像玻璃一样硬，但在施加足够的力时，可以被拉伸到原来长度的五倍而不断裂。这种材料在拉伸后，还能通过加热恢复到原始形状。玻璃凝胶结合了玻璃和凝胶两种材料的特性。为了制造这种材料，研究人员从玻璃聚合物的液体前体开始，将其与离子液体混合；然后将混合液倒入模具中，暴露在紫外线下使材料“固化”；最后，研究人员移除模具，留下玻璃状的凝胶。离子液体像水一样是一种溶剂，但它完全由离子组成。通常情况下，当向聚合物中添加溶剂时，溶剂会推动聚合物链分离，使聚合物变得柔软且可拉伸。这就是为什么湿式隐形眼镜是柔韧的，而干式隐形眼镜则不是。\n这段文字意在说明：","options":{"A":"新材料“玻璃凝胶”既坚硬又可拉伸如何实现","B":"研究人员制作“玻璃凝胶”材料具体工作流程","C":"湿式和干式隐形眼镜之所以不同的材料学原理","D":"离子液溶剂能够使玻璃聚合物柔软且可以拉伸"},"answer":"A","explanation":"文段开篇引出“玻璃凝胶”这一话题，并具体描述其特征，即既坚硬又可拉伸。接着重点描述了制造“玻璃凝胶”的具体流程，从玻璃聚合物的液体前体开始，与离子液体混合，随后经历“固化”阶段，最终留下玻璃状的凝胶。下文针对制作中添加的“离子液体”进行具体解释，且通过“湿式隐形眼镜”和“干式隐形眼镜”的例子进行再次论证。故文段主题词为“玻璃凝胶”，重点论述这种材料既坚硬又可拉伸的特性是如何实现的，对应A项。\nB项，未体现玻璃凝胶的特征，相比于A项，该选项表述不全面，排除；\nC项，“湿式和干式隐形眼镜之所以不同的材料学原理”只是解释相关原理的部分内容，非重点，且未提及文段主题词“玻璃凝胶”，排除；\nD项，“离子液溶剂能够使玻璃聚合物柔软且可以拉伸”只是文段中的一部分内容，非重点，且未提及文段主题词“玻璃凝胶”，排除。\n故正确答案为A。\n【文段出处】科技日报《新材料“玻璃凝胶”既坚硬又可拉伸》","no":43,"missingImage":false},{"type":"question","qid":"17014865","cat":"片段阅读","stem":"中国印章形制之所以长时间以方形为主，与其所表现的主体——汉字有着密切的关系。因为汉字是方块字，小篆、隶书或楷书，无论何种字体入印，汉字整体形状都是方块状，方形印面匹配方形的汉字，自右向左直读，这种构图也是中国传统美学的体现，既体现汉字的对称之美，又彰显印章的庄重大气。此外，为官一任，受命一方，对应传统文化中的天圆地方，这也是历代官印取方形的原因所在。\n本段旨在说明：","options":{"A":"中西印章形制不同的原因","B":"中西印章形制的主要区别","C":"中国印章以方形为主的原因","D":"中国历代官印取方形的原因"},"answer":"C","explanation":"文段开篇指出中国印章形制以方形为主与汉字密切相关，接着进行具体解释，随后通过“此外”引导并列，又指出传统文化中的天圆地方也是历代官印取方形的原因。故文段为并列结构，从汉字形状和传统文化天圆地方两个角度来讨论中国印章以方形为主的原因，对应C项。\nA项“中西印章形制不同”、B项“中西印章形制的主要区别”文段均未提及，无中生有，排除；\nD项，“中国历代官印”对应“此外”之后的内容，表述片面，排除。\n故正确答案为C。\n【文段出处】光明日报《中国印章三千年的三次演变》","no":44,"missingImage":false},{"type":"question","qid":"17014866","cat":"片段阅读","stem":"在公园、树林里散步时，你有没有注意过，一些高大乔木的茂密树冠并不相互接触，而是存在一些缝隙？为何会出现这种现象？难道是树与树之间也有“边界感”吗？据专家介绍，这种现象被称为“树冠羞避”，往往只发生在一些特定树种之中，并且大多是在同一树种之间。这可能是因为同种植物往往树冠高度差不多，在风的吹动下，树冠之间更容易产生碰撞摩擦，导致碰撞处树叶和枝条脱落，从而形成树冠间的缝隙。另外，植物可以通过光感受器来判断其他植物是否与自己有亲缘关系，并对“亲戚”植物表现出“羞避”，以减少竞争造成的损害，提高光合作用效率。\n最适合做这段文字标题的是：","options":{"A":"“树冠羞避”的启示","B":"“近亲相惜”的树冠","C":"树冠也有“边界感”","D":"树冠的“社交恐惧”"},"answer":"C","explanation":"文段开篇引出高大乔木树冠存在缝隙的现象，接着提出问题，即树与树之间也有“边界感”吗？随后指出这一现象被称为“树冠羞避”，并通过并列标志词“另外”分析了出现“树冠羞避”的两方面原因，可能是风导致碰撞处枝叶脱落，也可能是植物通过光感受器对“亲戚”植物表现出“羞避”以减少竞争。故文段重点围绕“树与树之间也有‘边界感’”这一问题展开讨论，对应C项。\nA项，“‘树冠羞避’的启示”文段并未提及，无中生有，排除；\nB项，“近亲相惜”仅对应文段“另外”之后的内容，表述片面，并且属于原因解释的内容，非重点，排除；\nD项，“社交恐惧”文段并未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】科普时报《树冠也有“边界感”》","no":45,"missingImage":false},{"type":"question","qid":"17014874","cat":"语句表达","stem":"对于视听作品而言，我们常常将关注的焦点放在故事、角色、视效等方面而忽视了其背后的技术支撑。事实上，科技是视听作品不可或缺的有机成分，而非锦上添花的“佐料”或“装饰”。甚至可以说，______________。自卢米埃尔兄弟发明电影摄影机开始，科技与内容便紧密相连，共同塑造着电影这一艺术形式。当时，通过摄影技术实现的艺术效果震惊了世界。对比彼时与今日的视听创作，本质上并无二致。虽然当下的表现手段有了翻天覆地的变化，但摄影技术记录与表达这一内核从未改变。\n填入画横线部分最恰当的一项是：","options":{"A":"科技是视听作品创作的核心和灵魂","B":"科技必然引发视听创作模式的转变","C":"视听创作者一直在突破个人技术极限","D":"没有科技就没有视听作品的诞生发展"},"answer":"D","explanation":"横线出现在文段中间，需结合前后文进行分析。文段开篇先引出“视听作品”的话题，随后介绍科技并非仅仅是附加的或次要的元素，而是视听作品构成中不可或缺的部分，横线后通过列举卢米埃尔兄弟的例子来说明科技塑造了电影这种艺术形式，以及摄影技术从古至今在视听作品中的重要作用。因横线前出现了“甚至可以说”，故横线处所填内容要与前文构成递进关系，结合前后文，横线处应体现出科技并非是视听作品的附加元素，其对视听作品有着更重要的作用，对应D项。\nA项，“核心和灵魂”与前文“科技是视听作品不可或缺的有机成分”语义相近，无法与前文构成递进关系，排除；\nB项，“视听创作模式的转变”与后文内容衔接不当，排除；\nC项，“视听创作者”文段未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】光明网《科技引领视听创作深刻变革》","no":46,"missingImage":false},{"type":"question","qid":"17014872","cat":"语句表达","stem":"①我们讲论中国历史上的历代制度，正该重视中国历史之特殊性\n②推广而言，我们该重视其国别性\n③正因制度是一种随时地而适应的，不能推之四海而皆准，正如其不能行之百世而无弊\n④在这一国家，这一地区，该项制度获得成立而推行有利，但在另一国家与另一地区，则未必尽然\n⑤我们讨论一项制度，固然应该重视其时代性，同时又该重视其地域性\n⑥若我们忽视了这一点，认为外国的一切都是好，中国的一切都要不得，又哪能真切认识到自己以往历代制度之真实意义与真实效果呢\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"①⑤②③④⑥","B":"⑤②④③①⑥","C":"①⑥⑤④②③","D":"⑤③①⑥②④"},"answer":"B","explanation":"观察选项，对比首句。①句介绍讲论中国历史上的历代制度应该重视什么，⑤句指出当我们讨论一项制度时，既要重视其时代性，也要重视其地域性，按照逻辑顺序，应先提出观点，再围绕其举例进行解释说明，故⑤句应在①句之前，⑤句更适合作为首句，排除A、C两项。\n继续观察B、D两项，可对比②④与③①⑥两部分的先后顺序，②句指出推广一项制度时，应重视其国别性，④句介绍一项制度在一个国家或地区成立，但在其他国家或地区未必可行，②④两句均是围绕制度的特点展开论述，③句“正因制度是一种随时地而适应的，不能推之四海而皆准”介绍正是因为制度本身具有的特点，所以一项制度不能在各地都适用，承接②④两句并强调做法，故按照逻辑顺序，②④两句应在③句之前，排除D项，B项当选。\n故正确答案为B。\n【文段出处】个人图书馆网《钱穆先生：汉家自有制度——不要轻视自己的政治传统》","no":47,"missingImage":false},{"type":"question","qid":"17014870","cat":"语句表达","stem":"①既然科学上存在着不确定性，那我们又该如何应对呢\n②并且具有一定的科学精神，进而接受科学的不确定性以及生活上的很多不确定性\n③即不能单纯地掌握科学知识，更要“传递科学的思想观念和行为方式”\n④其实这也是我们一直在倡导和主张科普要从“知识补课”转向“价值引领”的另一个重要意义所在\n⑤通过科普可以让公众更多地了解科学，了解科学的本质，养成必要的科学方法和科学理性\n⑥这其实又涉及到科普这项工作的重要意义和价值了\n将以上6个句子重新排列，语序正确的一项是：","options":{"A":"⑤③①⑥②④","B":"⑤④⑥③①②","C":"①⑥⑤②④③","D":"①②④③⑥⑤"},"answer":"C","explanation":"对比选项，确定首句。①句提出我们该如何应对科学上存在着不确定性的问题，⑤句提出措施，指出通过科普可以让公众了解科学本质，养成科学方法和科学理性。根据“提问+回答”的逻辑顺序，应先提出问题，再对其进行具体回答，故⑤句应在①句之后，排除A、B两项。\n对比C、D两项，①句后分别衔接⑥句与②句。①句提出我们该如何应对科学上存在着不确定性的问题，⑥句指出科普工作具有重要意义和价值，且⑥句中的指代词“这”可指代前文的问题，引出科普工作这一应对措施，①⑥两句衔接得当，C项当选。②句出现关联词“并且”，指出具有一定的科学精神进而接受科学和生活上的不确定性，则前文应同样提及相关措施，与①句衔接不当，排除D项。\n故正确答案为C。\n【文段出处】光明网《“算命网红”何以笼络人心？》","no":48,"missingImage":false},{"type":"question","qid":"17014881","cat":"片段阅读","stem":"自然条件下，小麦条锈菌能够侵染小檗完成有性生殖循环，表明有存活的冬孢子来源。然而小麦收获后，要经历炎热的夏天、多雨的秋天、寒冷的冬天，至翌年春天，具有活力的冬孢子源仍然传播到小檗上，产生担孢子侵染小檗。那么冬孢子是在哪里存活的呢？研究发现冬孢子有三个来源：其一是田间小麦只要受小麦条锈菌侵染，便可产生冬孢子；其二是堆积的麦垛内小麦病残体上的冬孢子；其三是禾本科杂草寄主秋天产生并越冬存活的冬孢子。这一发现填补了我国小麦条锈病病害循环研究的空白，改写了原有教科书的内容，对制定新策略防控小麦条锈病具有非常重要的指导意义。\n这段文字主要介绍了：","options":{"A":"有性生殖是导致小麦条锈菌变异、产生新小种的主要途径","B":"野生感病小檗受侵染生成病原菌孢子，可以传播侵染小麦","C":"从源头减少小麦条锈菌新小种产生，实现可持续绿色防控","D":"研究新发现帮助厘清病害循环，为病害防治提供科学支持"},"answer":"C","explanation":"文段首先通过自然条件下小麦条锈菌能侵染小檗完成有性生殖循环，引出有存活冬孢子来源的话题，之后指出即便经过小麦收获后不同季节的变化，到翌年春天有活力的冬孢子源依然能传播去侵染小檗，由此引出冬孢子在哪里存活的疑问，随后介绍了研究发现的冬孢子的三个来源，最后指出明确小麦条锈菌来源的这一发现填补了相关研究空白，对防控小麦条锈病有重要指导意义。故文段始终围绕“小麦条锈菌来源”的话题展开论述，强调明确来源对防控小麦条锈病的重要性，对应C项。\nA项，“小麦条锈菌变异、产生新小种”文段未提及，无中生有，且“有性生殖”为文段话题引入部分的内容，非文段重点，排除；\nB项，未提及主题词“小麦条锈菌”，偏离文段核心话题，排除；\nD项，“新发现”表述过于笼统，未提及主题词“小麦条锈菌”，且文段围绕小麦条锈菌“来源”的话题展开论述，该项并未提及“来源”，偏离文段核心话题，排除。\n故正确答案为C。\n【文段出处】人民网《防控条锈病 守得麦满仓》","no":49,"missingImage":false}],"count":29,"answerable":29,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"16157430","cat":"数学运算","stem":"为应对浒苔绿潮灾害，某市对海上浒苔进行打捞。初始打捞区域面积为150平方公里，第一天清理掉了20%，当晚由于浒苔漂移，致使原剩余打捞区域面积增加了15%。第二天清理掉了剩余面积的25%。问第二天清理完，剩余打捞区域面积约为多少平方公里?","options":{"A":"114","B":"104","C":"128","D":"138"},"answer":"B","explanation":"根据题意，第一天清理后浒苔剩余打捞区域面积=150×（1-20%）=120平方公里，当晚由于浒苔漂移， 剩余打捞区域面积增加至120×（1+15%）=138平方公里，第二天清理完，剩余打捞区域面积\u003cimg data-k=\"20795031efb9\">平方公里。\n故正确答案为B。","no":50,"missingImage":false},{"type":"question","qid":"16157437","cat":"数学运算","stem":"某徒步爱好者以平均每小时6千米的速度爬山，爬到路程一半时停下来休息了15分钟，之后速度降为原来的二分之一，全程共用2.5小时。问该徒步爱好者爬山全程是多少千米？","options":{"A":"9","B":"10","C":"12","D":"13.5"},"answer":"A","explanation":"根据题意可知，前一半路程的速度\u003cimg data-k=\"fd48a2d3e03f\">千米/小时，后一半路程的速度\u003cimg data-k=\"cf918f9676ec\">千米/小时。根据等距离平均速度公式：\u003cimg data-k=\"d9b603446fac\">，可得该徒步爱好者爬山的平均速度\u003cimg data-k=\"484dc53d18b6\">千米/小时，全程爬山的用时为\u003cimg data-k=\"8b60f726f757\">\u003cimg data-k=\"dfcc40817e85\">小时。根据行程公式：s=vt，则该徒步爱好者爬山全程是4×2.25=9千米。\n故正确答案为A。","no":51,"missingImage":false},{"type":"question","qid":"16157469","cat":"数学运算","stem":"某小区要安装若干电动车公共充电桩。由张师傅先施工5天，李师傅再施工9天就能全部完工。如果张师傅先施工7天，李师傅再施工6天，也能全部完工。现由张师傅和李师傅一起施工3天后，张师傅有新任务离开，剩余工作由李师傅单独完成。问李师傅还需几天能完工?","options":{"A":"10","B":"8","C":"7","D":"9"},"answer":"D","explanation":"根据题意可列式：5×张+9×李=7×张+6×李，化简可得：\u003cimg data-k=\"ea3533c1a8ad\">。赋值张师傅每天工作效率为3，李师傅每天工作效率为2，则总工程量=5×3+9×2=33。张师傅和李师傅一起施工3天一共做了（3+2）×3=15，则剩余工作还需时间\u003cimg data-k=\"2d7ec0eac62c\">天。\n故正确答案为D。","no":52,"missingImage":false},{"type":"question","qid":"16157424","cat":"数学运算","stem":"某单位举办田径比赛，100米决赛将按半决赛成绩安排道次：前四名运动员，抽签排在3、4、5、6道；第五、第六名运动员，抽签排在7、8道；后两名运动员，抽签排在1、2道。问共有多少种安排方式？","options":{"A":"48","B":"72","C":"96","D":"120"},"answer":"C","explanation":"根据“前四名运动员，抽签排在3、4、5、6道”，可知前四名运动员的安排方式有\u003cimg data-k=\"6a9912f7ceb8\">种；根据“第五、第六名运动员，抽签排在7、8道”，可知第五、第六名运动员的安排方式有\u003cimg data-k=\"eeae3111c8ee\">种；根据“后两名运动员，抽签排在1、2道”，可知后两名运动员的安排方式有\u003cimg data-k=\"eeae3111c8ee\">种。分步用乘法，则一共有\u003cimg data-k=\"2232a2c4a8dc\">\u003cimg data-k=\"81690ed1f3c2\">种安排方式。\n故正确答案为C。","no":53,"missingImage":false},{"type":"question","qid":"14403678","cat":"数学运算","stem":"某社区小王、小刘参加宣传活动，已知小王隔9天参加一次，小刘只有在周末（星期六或者星期日）参加一次。某个星期日两人共同参加了宣传活动，在没有统一安排的前提下，问下一次最少再隔多少天两人共同参加宣传活动？","options":{"A":"19","B":"20","C":"21","D":"22"},"answer":"A","explanation":"方法一：根据题意，小王某个星期日参加活动后的情况列表如下，其中“√”代表去参加宣传活动，“×”代表不去参加宣传活动。\n\u003cimg data-k=\"168c00081512\" style=\"max-width:591px\">\n观察发现，小王下一次在周末参加宣传活动的时间是第四周的星期六，此时小刘也可以参加宣传活动，则从第一周的星期日到第四周的星期六，最少间隔7+7+5=19天。\n方法二：根据“小王隔9天参加一次”可知，小王每10天参加一次宣传活动，则下一次两人共同参加宣传活动的时间为10n天后（n为正整数），间隔（10n-1）天，结合选项，只有A项符合。\n故正确答案为A。","no":54,"missingImage":false},{"type":"question","qid":"16157426","cat":"数学运算","stem":"某商店在母亲节前夕花费288元购进了120支康乃馨。初期按获得50%的期望利润定价出售，当售出75%之后，剩余的康乃馨按定价打折促销。已知最终获得的总利润是初期期望获得总利润的85%，问康乃馨促销时打了几折?","options":{"A":"7","B":"7.5","C":"8","D":"8.5"},"answer":"C","explanation":"根据题意可知：每支康乃馨的进价\u003cimg data-k=\"3c979f550f9e\">元，康乃馨的定价=2.4×（1+50%）=3.6元。设打折促销的康乃馨为x元，根据“最终获得的总利润是初期期望获得总利润的85%”，可列方程：\u003cimg data-k=\"f42b1ef04c5f\">\u003cimg data-k=\"2899b5e1f47e\">，解得x=2.88，则所求折扣\u003cimg data-k=\"3bb579ddf181\">，即打了8折。\n故正确答案为C。","no":55,"missingImage":false},{"type":"question","qid":"16157485","cat":"数学运算","stem":"某社团组织40余名志愿者前往A地参与科普活动。若平均分为4组，则至少需要招募1名志愿者；若平均分为5组，则至少需要招募2名。若分为3组，要求每组有10余人且人数各不相同，问该分法中人数最多的与人数最少的组至少相差几人？","options":{"A":"3","B":"2","C":"4","D":"5"},"answer":"A","explanation":"根据题意 “平均分为4组至少需要招募1人、平均分为5组至少需要招募2人”，可得总人数+1是4的倍数、总人数+2是5的倍数，又因总人数为“40余名”，故总人数为43人。当分为3组时，若想使人数最多与最少的两组相差最小，则应使人数最多的组取最小值、人数最少的组取最大值。设人数最多的组至少有x人，则另外两组的人数分别为x-1、x-2，列方程得：x+(x-1)+(x-2)=43，解得：\u003cimg data-k=\"5b9f08a9643c\">人，则人数最多的组至少为16人，剩余43-16=27人，当剩余两组人数为14、13时，即可符合题目要求，此时人数最多的与人数最少的组相差16-13=3人。\n故正确答案为A。","no":56,"missingImage":false},{"type":"question","qid":"16157421","cat":"数学运算","stem":"某品牌有甲、乙两种商品在A、B两个跨境电商平台销售。甲商品和乙商品的成本分别为50元/件和70元/件，在A平台两种商品的售价均在成本基础上加价60%，在B平台的售价均在成本基础上加价80%。上个月A、B两个平台的利润均为123600元。已知乙商品在A平台上售出800件，所得利润是在B平台上的2倍。问甲、乙两种商品售出数量之比在下列哪个范围内？","options":{"A":"低于3","B":"3~4之间","C":"4~5之间","D":"高于5"},"answer":"D","explanation":"根据公式：利润=成本×利润率，可得甲、乙两种商品在A、B两个跨境电商平台销售的单件利润如下表：\n\u003cimg data-k=\"1d795042a163\" style=\"max-width:600px\">\n根据乙商品在A平台上售出800件，可得乙商品在A平台上总利润为800×42=33600元，在B平台上总利润为33600÷2=16800元，乙商品在A、B两个平台共售出\u003cimg data-k=\"c7858c110caf\">件。则甲商品在A平台上总利润为123600−33600=90000元，在B平台上总利润为123600−16800=106800元，甲商品在A、B两个平台共售出\u003cimg data-k=\"2803aef62a84\">件。故甲、乙两种商品售出数量之比为\u003cimg data-k=\"e1e0a8121834\">，在D项范围内。\n故正确答案为D。","no":57,"missingImage":false},{"type":"question","qid":"16157434","cat":"数学运算","stem":"山东某图书馆开展古籍数字化转化实验，每册转化成功率为90%。假设每册古籍数字化转化成功与否互不影响，现选择4册古籍进行数字化转化，问至少有3册转化成功的概率是多少？","options":{"A":"65.97%","B":"70.74%","C":"94.77%","D":"99.63%"},"answer":"C","explanation":"根据题意，至少有3册转化成功的情况可分类讨论如下： \n①有3册转化成功：概率\u003cimg data-k=\"b91949d37702\">；\n②4册均转化成功：概率\u003cimg data-k=\"8bff4c0da9e5\">；\n分类用加法，则所求的概率\u003cimg data-k=\"ceeece5d56ba\">。\n故正确答案为C。\n备注：本题计算量较大，可结合选项，观察尾数和范围快速确定答案。","no":58,"missingImage":false},{"type":"question","qid":"16157428","cat":"数学运算","stem":"要建一个正方形农田，边长为36米，在其中一边的\u003cimg data-k=\"62886ffdfcd1\">处安装一个喷灌装置，该装置的灌溉半径为18米，问该农田被灌溉的面积是多少？","options":{"A":"不到380平方米","B":"380~420平方米之间","C":"420~450平方米之间","D":"450平方米以上"},"answer":"B","explanation":"该农田被灌溉的面积如下图所示，即三角形OAF和扇形OEF的面积之和。根据题意可知，\u003cimg data-k=\"cc8fb27eac4d\">米，OF=18米，根据特殊三角形结论可知，\u003cimg data-k=\"590caf7a652f\">，则\u003cimg data-k=\"286c75751cf2\">米，\u003cimg data-k=\"8f8399b936b1\">\u003cimg data-k=\"46f3288d8c7d\">平方米。由于\u003cimg data-k=\"590caf7a652f\">，则\u003cimg data-k=\"8005ae6f602e\">，则\u003cimg data-k=\"8bba4f50395b\">平方米。则该农田被灌溉的面积\u003cimg data-k=\"ca8361a3f732\">\u003cimg data-k=\"f0a65334797f\">平方米，在B项范围内。\n\u003cimg data-k=\"b49831477848\" style=\"max-width:400px\">\n故正确答案为B。","no":59,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"14403693","cat":"图形推理","stem":"下列选项最符合所给图形规律的是：\n\u003cimg data-k=\"0b3bbc8c6d72\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成不同，优先考虑属性规律。观察发现，题干图形出现多个等腰元素，考虑对称性，题干图形均为只有一条对称轴的轴对称图形，故？处应用此规律，只有B项符合。\n故正确答案为B。","no":60,"missingImage":false},{"type":"question","qid":"14403690","cat":"图形推理","stem":"下列选项最符合所给图形规律的是：\n\u003cimg data-k=\"695c9f25b323\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成相同，优先考虑位置规律。如下图所示，标1的两个黑球沿外圈每次逆时针平移1格，标2的黑球沿外圈依次逆时针平移1、2、3、4格，故图5中标1的两个黑球沿外圈逆时针平移1格，标2的黑球沿外圈逆时针平移5格得到？处图形，只有C项符合。\n\u003cimg data-k=\"98ff32557ba3\" style=\"max-width:600px\">\n故正确答案为C。","no":61,"missingImage":false},{"type":"question","qid":"14403696","cat":"图形推理","stem":"下列选项最符合所给图形规律的是：\n\u003cimg data-k=\"d48cfae1cbc0\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"元素组成不同，优先考虑属性规律。题干图形较规整，且出现等腰元素，考虑对称性。观察发现，第一组图形均为既轴对称又中心对称图形，第二组图形中的前两幅图形均为仅轴对称图形，故？处应为仅轴对称图形，只有C项符合。\n故正确答案为C。","no":62,"missingImage":false},{"type":"question","qid":"14403686","cat":"图形推理","stem":"下列选项最符合所给图形规律的是：\n\u003cimg data-k=\"e602e6ff4f15\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成相似，且相同线条重复出现，优先考虑样式规律中的加减同异。观察第一组图形发现，图1与图2叠加后，重叠的部分为白色，不重叠的部分变为黑色，从而得到图3；第二组图形应用此规律，只有D项符合。\n故正确答案为D。","no":63,"missingImage":false},{"type":"question","qid":"10886447","cat":"图形推理","stem":"下图为给定的多面体的外表面展开图，四个选项中哪一个可以由展开图折叠而成？\n\u003cimg data-k=\"53da66a4d306\" style=\"max-width:600px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"A","explanation":"本题为空间重构题。将题干展开图和选项中的面标上序号，如下图所示：\n\u003cimg data-k=\"cc31b3856702\" style=\"max-width:600px\">\n题干展开图中，面h和面i存在公共边，但在B、C、D三项中，面h和面i均以点相接，并不存在公共边，与题干展开图不一致，只有A项符合。\n故正确答案为A。","no":64,"missingImage":false},{"type":"question","qid":"14403688","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"3bc886e63db5\" style=\"max-width:500px\">","options":{"A":"①⑤⑥，②③④","B":"①②③，④⑤⑥","C":"①③④，②⑤⑥","D":"①②⑤，③④⑥"},"answer":"B","explanation":"本题为分组分类题目。元素组成相同，优先考虑位置规律。观察发现，图①②③形状均相同，可以通过相互旋转得到，图④⑤⑥形状均相同，可以通过相互旋转得到，故图①②③为一组，图④⑤⑥为一组。\n故正确答案为B。","no":65,"missingImage":false},{"type":"question","qid":"14403692","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"d8357f9943fa\" style=\"max-width:500px\">","options":{"A":"①④⑥，②③⑤","B":"①③⑤，②④⑥","C":"①②⑤，③④⑥","D":"①②⑥，③④⑤"},"answer":"C","explanation":"本题为分组分类题目。观察发现，题干图形均出现连在一起的两个面，考虑图形间关系。图①②⑤中两个面相交于最短边，图③④⑥中两个面相交于最长边。即图①②⑤为一组，图③④⑥为一组。\n故正确答案为C。","no":66,"missingImage":false},{"type":"question","qid":"14403697","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"7bd787497782\" style=\"max-width:500px\">","options":{"A":"①⑤⑥，②③④","B":"①②⑥，③④⑤","C":"①③⑥，②④⑤","D":"①③④，②⑤⑥"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，题干图形外框均为多边形，考虑数线，外框边数分别为4、6、4、4、5、4；继续观察发现，题干图形框内均由小元素组成，考虑数素，内部元素数量分别为2、3、2、1、2、2；单看均无规律，考虑运算发现，图①③⑥中，外框边数-内部元素数=2，图②④⑤中，外框边数-内部元素数=3，即图①③⑥为一组，图②④⑤为一组。\n故正确答案为C。","no":67,"missingImage":false},{"type":"question","qid":"16157487","cat":"定义判断","stem":"绿色计算是一种对环境可支撑的计算方式。它所使用的计算部件、通信网络和机房设施等均能高效运行而对环境产生较小或不产生有害影响。\n根据上述定义，下列属于绿色计算的是：","options":{"A":"某高校实行校区网络全覆盖，全体师生在校园内都可以实现无线上网","B":"某校大数据中心将办公楼建在校区以减少外部环境对中心运行的影响","C":"某市才算中心全部用笔记本电脑取代台式电脑","D":"某研究院运算中心计算设备全部用太阳能发电取代传统电能驱动，降低能耗"},"answer":"D","explanation":"第一步：找出定义关键词。\n“所使用的计算部件、通信网络和机房设施等均能高效运行”、“对环境产生较小或不产生有害影响”。\n第二步：逐一分析选项。\nA项：该高校实行校区网络全覆盖，未涉及对环境的影响，不符合“对环境产生较小或不产生有害影响”，不符合定义，排除；\nB项：大数据中心办公楼建在校区，只涉及办公楼地点，未体现“所使用的计算部件、通信网络和机房设施等均能高效运行”，减少的是“外部环境对中心运行的影响”，未涉及“对环境产生较小或不产生有害影响”，不符合定义，排除；\nC项：全部用笔记本电脑取代台式电脑，未涉及对环境的影响，不符合“对环境产生较小或不产生有害影响”，不符合定义，排除；\nD项：计算设备全部用太阳能发电取代传统电能驱动，降低能耗，符合“所使用的计算部件、通信网络和机房设施等均能高效运行”、“对环境产生较小或不产生有害影响”，符合定义，当选。\n故正确答案为D。","no":68,"missingImage":false},{"type":"question","qid":"16157432","cat":"定义判断","stem":"新型数字劳动是数字用户消耗在数字平台上的一种创造性劳动。其特点为用户的在线时间成为潜在的劳动时间，劳动过程不具有雇佣关系。涵盖人们日常的休闲、娱乐、劳动过程，不受时空限制，并表现为一种轻松愉悦的劳动形式。\n根据上述定义，下列属于新型数字劳动的是：","options":{"A":"某小区居民用手机在数字设备上观看视频和购物","B":"某广告公司设计师用电脑给客户做预算和设计广告牌","C":"某互联网企业程序员用电脑完成程序","D":"某平台网约车司机根据客户不同需求安排路线"},"answer":"A","explanation":"第一步：找出定义关键词。\n“用户消耗在数字平台上的创造性劳动”、“用户的在线时间成为潜在的劳动时间”、“劳动过程不具有雇佣关系”、“轻松愉悦的劳动形式”。\n第二步：逐一分析选项。\nA项：居民在数字设备上观看视频和购物，其中观看视频和购物分别会产生流量数据和消费数据，符合“用户消耗在数字平台上的创造性劳动”、“用户的在线时间成为潜在的劳动时间”，居民和数字平台之间不存在雇佣关系，符合“劳动过程不具有雇佣关系”，且观看视频和购物也是常见的放松方式，符合“轻松愉悦的劳动形式”，符合定义，当选；\nB项：设计师用电脑工作，不明确是否涉及“数字平台”，且设计师与广告公司之间存在明确的雇佣关系，不符合“劳动过程不具有雇佣关系”，不符合定义，排除；\nC项：程序员用电脑完成程序，不明确是否涉及“数字平台”，且程序员与互联网企业之间存在明确的雇佣关系，不符合“劳动过程不具有雇佣关系”，不符合定义，排除；\nD项：网约车司机的工作内容是搭载客户到目的地，即在线下为客户提供运输服务，不符合“用户消耗在数字平台上的创造性劳动”，且网约车工作会出现收入结构复杂、工作强度高、职业压力显著等情况，不符合“轻松愉悦的劳动形式”，不符合定义，排除。\n故正确答案为A。","no":69,"missingImage":false},{"type":"question","qid":"16157427","cat":"定义判断","stem":"家庭体育是一人或几人在家庭生活中安排的或自愿以家庭名义参与的，以身体练习为基本手段，以获得运动知识技能、满足兴趣爱好、丰富家庭生活、实现强身健体和促进家庭稳定等为主要目的的教育过程和文化活动。\n根据上述定义，下列属于家庭体育的是：","options":{"A":"小梅在家帮助父亲，锻炼他受伤的腿部伸展运动","B":"王经理下班后，经常和儿子一起在校园里打篮球","C":"父母为使小李在比赛中获胜，监督他每天运动","D":"小明经常参加他同学父母组织的乒乓球比赛"},"answer":"B","explanation":"第一步：找出定义关键词。\n“在家庭生活中安排的或自愿以家庭名义参与的”、“以身体练习为基本手段”、“以获得运动知识技能、满足兴趣爱好、丰富家庭生活、实现强身健体和促进家庭稳定等为主要目的”、“教育过程和文化活动”。\n第二步：逐一分析选项。\nA项：选项指出小梅在家帮助父亲锻炼他受伤的腿，锻炼的目的是为了康复，且该活动与教育或文化无关，不符合“以获得运动知识技能、满足兴趣爱好、丰富家庭生活、实现强身健体和促进家庭稳定等为主要目的”、“教育过程和文化活动”，不符合定义，排除；\nB项：选项指出王经理经常和儿子一起打篮球，符合“在家庭生活中安排的或自愿以家庭名义参与的”、“以身体练习为基本手段”、“以获得运动知识技能、满足兴趣爱好、丰富家庭生活、实现强身健体和促进家庭稳定等为主要目的”、“教育过程和文化活动”，符合定义，当选；\nC项：选项指出父母为使小李在比赛中获胜，监督他每天运动，小李的运动不是以家庭名义参与的，且运动的目的是为了赢得比赛，不符合“在家庭生活中安排的或自愿以家庭名义参与的”、“以获得运动知识技能、满足兴趣爱好、丰富家庭生活、实现强身健体和促进家庭稳定等为主要目的”，不符合定义，排除；\nD项：选项指出小明经常参加他同学父母组织的乒乓球比赛，该比赛不是在家庭生活中开展的，不符合“在家庭生活中安排的或自愿以家庭名义参与的”，不符合定义，排除。\n故正确答案为B。","no":70,"missingImage":false},{"type":"question","qid":"16157446","cat":"定义判断","stem":"目标中心战是指通过对目标节点的打击，削弱敌目标体系聚合力，达到快速瘫痪或瓦解对手作战体系的目的，或通过对关键目标施压，削弱对方抵抗意志，达到“小战”或“局战”而屈人之兵战略战役目的的一种战术。\n根据上述定义，下列军事演习中没有运用目标中心战战术的是：","options":{"A":"红方通过远程导弹攻击蓝方辎重运输车队","B":"红方通过高科技干扰蓝方指挥通讯","C":"蓝方侦察分队向红方的腹地进行重点的目标侦察","D":"蓝方通过无人机3分钟捣毁红方指挥部"},"answer":"C","explanation":"第一步：找出定义关键词。\n“通过对目标节点的打击”、“快速瘫痪或瓦解对手作战体系”、“通过对关键目标施压”、“达到‘小战’或‘局战’而屈人之兵”。\n第二步：逐一分析选项。\nA项：辎重运输车队是指军队后勤运送物资的车队，红方通过远程导弹攻击蓝方辎重运输车队，符合“通过对关键目标施压”、“达到‘小战’或‘局战’而屈人之兵”，符合定义，排除；\nB项：指挥通讯是作战时的关键步骤和重要节点，红方通过高科技干扰蓝方指挥通讯，会让敌方军队丧失一定战斗能力，符合“通过对目标节点的打击”、“快速瘫痪或瓦解对手作战体系”，符合定义，排除；\nC项：蓝方侦察分队向红方的腹地进行重点的目标侦察，只是进行侦察，没有进行打击或干扰，不符合“通过对目标节点的打击”、“快速瘫痪或瓦解对手作战体系”、“通过对关键目标施压”、“达到‘小战’或‘局战’而屈人之兵”，不符合定义，当选；\nD项：指挥部在作战中起着至关重要的作用，蓝方通过无人机3分钟捣毁红方指挥部，符合“通过对目标节点的打击”、“快速瘫痪或瓦解对手作战体系”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":71,"missingImage":false},{"type":"question","qid":"16157448","cat":"定义判断","stem":"公共责任是指国家公共管理部门的行政人员，在工作中必须对国家权力主体负责，必须提高自身职责的履行，来为国民谋利益。\n根据上述定义，下列属于履行公共责任的是：","options":{"A":"某市交通局小王遇到一个老人突发心脏病，协助路面的车辆将老人送到医院","B":"某市税务局小张审核纳税记录时，发现一个企业漏报了税项，随即要求企业进行补缴","C":"某市民政局小石上班途中，发现一个儿童溺水，立刻跳到水中进行营救","D":"某市检察院小李和老同学吃饭聊天，发现其受贿，劝其立刻向组织交代"},"answer":"B","explanation":"第一步：找出定义关键词。\n“国家公共管理部门的行政人员”、“在工作中”、“对国家权力主体负责，提高自身职责的履行”。\n第二步：逐一分析选项。\nA项：交通局小王协助路面的车辆将突发心脏病的老人送到医院，其中“协助将老人送去医院”不属于自身的职责，不符合“对国家权力主体负责，提高自身职责的履行”，不符合定义，排除；\nB项：税务局小张，符合“国家公共管理部门的行政人员”，审核纳税记录时，符合“在工作中”，要求漏报税项的企业进行补缴，符合“对国家权力主体负责，提高自身职责的履行”，符合定义，当选；\nC项：民政局上班的小石营救溺水儿童，其中“营救溺水儿童”不属于民政局职工自身的职责，不符合“对国家权力主体负责，提高自身职责的履行”，不符合定义，排除；\nD项：检察院的小李在吃饭聊天时，劝说受贿的老同学向组织交代，“吃饭聊天”说明小李不是在工作中，不符合“在工作中”，不符合定义，排除。\n故正确答案为B。","no":72,"missingImage":false},{"type":"question","qid":"18507957","cat":"定义判断","stem":"祖先崇拜是广泛存在于人类社会中的一种文化现象。它具有以下特点：一是将本族的祖先神化并对之祭拜，具有本族认同性和异族排斥性；二是相信其祖先神灵具有神奇超凡的威力，会庇佑后代族人并与之沟通互感；三是不再用动植物等图腾象征或生殖象征来作为其氏族部落的标志，而代之以其氏族祖先的名字。\n根据上述定义，下列属于祖先崇拜的是：","options":{"A":"古人视龙为吉祥，将自己定义为龙的传人求庇佑","B":"古人认为，黄帝带领他们进入文明时代，将自己定义为炎黄子孙，并且为其立庙祭祀","C":"简狄吞下玄鸟蛋后生下阏伯","D":"古人定义雷公电母，希望他们保佑风调雨顺"},"answer":"B","explanation":"第一步：找出定义关键词。\n“将本族的祖先神化并对之祭拜，具有本族认同性和异族排斥性”、“相信其祖先神灵具有神奇超凡的威力，会庇佑后代族人并与之沟通互感”、“不再用动植物等图腾象征或生殖象征来作为其氏族部落的标志，而代之以其氏族祖先的名字”。\n第二步：逐一分析选项。\nA项：古人视龙为吉祥，将自己定义为龙的传人求庇佑，说明是将龙作为其氏族部落的标志，并寻求龙的庇护，龙是动物，不符合“不再用动植物等图腾象征或生殖象征来作为其氏族部落的标志，而代之以其氏族祖先的名字”，不符合定义，排除；\nB项：古人认为黄帝带领他们进入文明时代，将自己定义为炎黄子孙，说明是将本族祖先“黄帝”的名字作为氏族部落的标志，符合“不再用动植物等图腾象征或生殖象征来作为其氏族部落的标志，而代之以其氏族祖先的名字”，为黄帝立庙祭祀，说明是在祭拜本族祖先“黄帝”，符合“将本族的祖先神化并对之祭拜，具有本族认同性和异族排斥性”、“相信其祖先神灵具有神奇超凡的威力，会庇佑后代族人并与之沟通互感”，符合定义，当选；\nC项：简狄吞下玄鸟蛋后生下阏伯，说的是玄鸟生商的故事，是指一个叫简狄的女人，吞服“玄鸟”下的蛋后，怀孕生下一个儿子叫契，即传说中的商之始祖“阏伯”，这体现了他们对玄鸟的崇拜，认为部落的繁衍与玄鸟相关，其中“玄鸟”是动物，不符合“不再用动植物等图腾象征或生殖象征来作为其氏族部落的标志，而代之以其氏族祖先的名字”，不符合定义，排除；\nD项：古人定义雷公电母，希望他们保佑风调雨顺，其中雷公电母不是他们的祖先，不符合“将本族的祖先神化并对之祭拜，具有本族认同性和异族排斥性”，不符合定义，排除。\n故正确答案为B。","no":73,"missingImage":false},{"type":"question","qid":"10886442","cat":"定义判断","stem":"多模态是指利用两种或两种以上感官同时进行信息交互的方式。在人工智能领域，多模态技术通过融合来自不同感官的数据和信息，提升人工智能系统对复杂信息的理解和处理能力，从而提高性能和扩大应用范围。\n根据上述定义，下列不属于多模态应用的是：","options":{"A":"语音助手同时接收语音指令和图像输入来回答问题","B":"自动驾驶系统结合摄像头、雷达和激光雷达数据感知环境","C":"智能家居系统通过语音控制灯光并分析用户表情调节氛围","D":"自然语言文本的多种方面，智能处理文本数据并且生成文本回复"},"answer":"D","explanation":"第一步：找出定义关键词。\n“利用两种或两种以上感官同时进行信息交互”。\n第二步：逐一分析选项。\nA项：语音助手同时接收语音指令（听觉感官）和图像输入（视觉感官）来回答问题，涉及两种不同感官的信息交互，符合“利用两种或两种以上感官同时进行信息交互”，符合定义，排除；\nB项：自动驾驶系统结合摄像头（视觉感官）、雷达（距离/速度感知维度）和激光雷达（三维空间感知维度）的数据感知环境，涉及不同的感知维度，符合“利用两种或两种以上感官同时进行信息交互”，符合定义，排除；\nC项：智能家居系统通过语音控制（听觉感官）和分析用户表情（视觉感官）实现功能，涉及两种不同感官的信息交互，符合“利用两种或两种以上感官同时进行信息交互”，符合定义，排除；\nD项：自然语言文本的多种方面，智能处理文本数据并且生成文本回复，只涉及文本一种信息形式，不符合“利用两种或两种以上感官同时进行信息交互”，不符合定义，当选。\n本题为选非题，故正确答案为D。","no":74,"missingImage":false},{"type":"question","qid":"10886454","cat":"定义判断","stem":"运动视差是指视觉系统与某空间点产生相对位移时，该点在视觉系统所成画面中的坐标与原坐标产生的偏移。在做相对位移的时候，视线看到不同距离的物体效果是不同的，近的物体看起来运动得快，远的物体看起来运动得慢。\n根据上述定义，下列没有体现运动视差的是：","options":{"A":"坐在行驶的火车上，看到近处的树木快速后退，而远处的山移动缓慢","B":"驾驶汽车时，路边的电线杆飞速掠过，而远处的建筑缓慢后退","C":"同向行驶的两辆汽车，当两者保持速度一致时，从一辆车上观察另一辆车，后者似乎是静止不动的","D":"站在地面上观察天上的云彩，发现云朵移动的速度比飞机慢很多"},"answer":"C","explanation":"第一步：找出定义关键词。\n“视觉系统与某空间点产生相对位移时”、“该点在视觉系统所成画面中的坐标与原坐标产生的偏移”、“视线看到不同距离的物体效果是不同的，近的物体看起来运动得快，远的物体看起来运动得慢”。\n第二步：逐一分析选项。\nA项：坐在行驶的火车上，看到近处的树木快速后退，而远处的山移动缓慢，符合“视觉系统与某空间点产生相对位移时”、“该点在视觉系统所成画面中的坐标与原坐标产生的偏移”、“视线看到不同距离的物体效果是不同的，近的物体看起来运动得快，远的物体看起来运动得慢”，符合定义，排除； \nB项：驾驶汽车时，路边的电线杆飞速掠过，而远处的建筑缓慢后退，符合“视觉系统与某空间点产生相对位移时”、“该点在视觉系统所成画面中的坐标与原坐标产生的偏移”、“视线看到不同距离的物体效果是不同的，近的物体看起来运动得快，远的物体看起来运动得慢”，符合定义，排除；\nC项：同向行驶的两辆汽车，当两者保持速度一致时，从一辆车上观察另一辆车，不符合“视觉系统与某空间点产生相对位移时”，后者似乎是静止不动的，不符合“视线看到不同距离的物体效果是不同的，近的物体看起来运动得快，远的物体看起来运动得慢”，不符合定义，当选；\nD项：站在地面上观察天上的云彩，符合“视觉系统与某空间点产生相对位移时”，发现云朵移动的速度比飞机慢很多，符合“该点在视觉系统所成画面中的坐标与原坐标产生的偏移”、“视线看到不同距离的物体效果是不同的，近的物体看起来运动得快，远的物体看起来运动得慢”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":75,"missingImage":false},{"type":"question","qid":"16157451","cat":"定义判断","stem":"概念赘余是指在句中使用了在内涵或外延上发生重复或多余的概念。概念混淆是把两个含义相近或读音相同的词所表达的不同概念，在内涵和外延上没有严格区别而造成的逻辑错误。\n根据上述定义，下列属于概念赘余的是：","options":{"A":"故宫、颐和园和南京长江大桥，都是中外游客向往的名胜古迹","B":"自从退休之后，他每月15日都会持卡到银行取退休金工资","C":"他出生在印尼，如今是法国籍······出生在国外的华侨如此热爱自己的祖国","D":"山东的景区是一天看不完的，趵突泉是山东的景区，所以趵突泉是一天看不完的"},"answer":"B","explanation":"第一步：找出定义关键词。\n概念赘余：“在句中使用了在内涵或外延上发生重复或多余的概念”；\n概念混淆：“把两个含义相近或读音相同的词所表达的不同概念，在内涵和外延上没有严格区别而造成的逻辑错误”。\n第二步：逐一分析选项。\nA项：“名胜古迹”指风景优美和有古代遗迹的著名地方，南京长江大桥是现代产物，不属于“名胜古迹”，错在不清楚“名胜古迹”的具体意思，不符合“在句中使用了在内涵或外延上发生重复或多余的概念”，不符合定义，排除；\nB项：“退休金”指在劳动者年老或丧失劳动能力后，根据他们对社会所作的贡献和所具备的享受养老保险资格或退休条件，由基本养老保险基金以货币形式支付的养老保险待遇，“工资”指作为劳动报酬按期付给劳动者的货币或实物，二者均含有给付货币的意思，符合“在句中使用了在内涵或外延上发生重复或多余的概念”，符合定义，当选；\nC项：“华侨”指旅居国外的中国人，仍为中国国籍，该项中的“他”是法国国籍，因此“他”不属于“华侨”，而属于“华人”或“华裔”，错在分不清意思相近的词语，符合“把两个含义相近或读音相同的词所表达的不同概念，在内涵和外延上没有严格区别而造成的逻辑错误”，符合“概念混淆”的定义，不符合“概念赘余”的定义，排除；\nD项：“山东的景区”“趵突泉”的概念都始终如一，不存在重复、多余，不符合“在句中使用了在内涵或外延上发生重复或多余的概念”，不符合定义，排除。\n故正确答案为B。","no":76,"missingImage":false},{"type":"question","qid":"16157449","cat":"定义判断","stem":"乏氧性缺氧是指因肺泡氧分压降低或静脉血分流入动脉，血液从肺摄取的氧减少，以致血氧分压降低；血液性缺氧是指因红细胞数量和血红蛋白含量减少或血红蛋白性质改变，使血液携氧能力降低，导致组织缺氧；循环性缺氧是指因血液流速减慢，单位时间内供给组织的氧量减少而引起的缺氧；组织性缺氧是指因组织细胞利用氧的能力减弱而引起的缺氧。\n根据上述定义，下列说法正确的是：","options":{"A":"小王在青藏高原徒步时出现高原反应，属于血液性缺氧","B":"小刘长期大量食用腌菜出现呼吸不畅，属于组织性缺氧","C":"小吴因心动过缓而常常感到呼吸困难，属于循环性缺氧","D":"小李因呼吸酶合成减少导致呼吸困难，属于乏氧性缺氧"},"answer":"C","explanation":"第一步：找出定义关键词。\n乏氧性缺氧：“肺泡氧分压降低或静脉血分流入动脉，血液从肺摄取的氧减少，以致血氧分压降低”；\n血液性缺氧：“红细胞数量和血红蛋白含量减少或血红蛋白性质改变，使血液携氧能力降低，导致组织缺氧”；\n循环性缺氧：“血液流速减慢，单位时间内供给组织的氧量减少而引起的缺氧”；\n组织性缺氧：“组织细胞利用氧的能力减弱而引起的缺氧”。\n第二步：逐一分析选项。\nA项：小王在青藏高原徒步时出现高原反应，是由于在高原环境，大气中氧分压减少，造成人体供氧不足，符合“肺泡氧分压降低或静脉血分流入动脉，血液从肺摄取的氧减少，以致血氧分压降低”，符合‌“乏氧性缺氧”定义，不符合“血液性缺氧”定义，说法错误，排除；\nB项：小刘长期大量食用腌菜出现呼吸不畅，是由于腌菜中含有大量的亚硝酸盐，而亚硝酸盐进入到血液之后会使人体具有运输氧气功能的低铁血红蛋白氧化成高铁血红蛋白，从而降低血液的输氧能力，符合“红细胞数量和血红蛋白含量减少或血红蛋白性质改变，使血液携氧能力降低，导致组织缺氧”，符合‌“血液性缺氧”定义，不符合“组织性缺氧”定义，说法错误，排除；\nC项：小吴因心动过缓而常常感到呼吸困难，而心动过缓会导致体内血液流速变慢，符合“血液流速减慢，单位时间内供给组织的氧量减少而引起的缺氧”，符合“循环性缺氧”定义，说法正确，当选；\nD项：小李因呼吸酶合成减少导致呼吸困难，其中呼吸酶是指与细胞呼吸相关的酶，合成减少说明组织细胞的呼吸作用减弱，人体利用氧气的能力因此减弱，符合“组织细胞利用氧的能力减弱而引起的缺氧”，符合‌“组织性缺氧”定义，不符合“乏氧性缺氧”定义，说法错误，排除。\n故正确答案为C。","no":77,"missingImage":false},{"type":"question","qid":"16157486","cat":"类比推理","stem":"明眸：善睐","options":{"A":"扬汤：止沸","B":"础润：知雨","C":"十拿：九稳","D":"老马：识途"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n“明眸善睐”是指明亮的眼睛善于顾盼传情，即“善睐”是“明眸”的一个特点，二者是对应关系，且“明眸”是偏正结构。\n第二步：判断选项词语间逻辑关系。\nA项：“扬汤止沸”是指把锅里开着的水舀起来再倒回去，使它凉下来不沸腾，“扬汤”是为了“止沸”，二者是方式目的的对应关系，与题干逻辑关系不一致，排除；\nB项：“础润知雨”是指看到柱子的基石润湿了，就是要下雨的征兆，因为“础润”，所以“知雨”，二者是因果关系，与题干逻辑关系不一致，排除；\nC项：“十拿九稳”是指动手拿十次，有九次稳当得手，用来比喻很有把握，二者不是特点的对应关系，且“十拿”也不是偏正结构，与题干逻辑关系不一致，排除；\nD项：“老马识途”是指老马认识走过的道路，比喻有经验的人对事情比较熟悉，“识途”是“老马”的一个特点，二者为对应关系，且“老马”是老的马，为偏正结构，与题干逻辑关系一致，当选。\n故正确答案为D。","no":78,"missingImage":false},{"type":"question","qid":"16157474","cat":"类比推理","stem":"理性投资：稳健收益","options":{"A":"绿色经济：低碳环保","B":"自然选择：物种进化","C":"基因剪辑：生物工程","D":"智能汽车：自动驾驶"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n理性投资是为了稳健收益，二者是方式目的的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：绿色经济是为了低碳环保，二者是方式目的的对应关系，与题干逻辑关系一致，当选；\nB项：自然选择是生物进化的一种机制，它决定了物种进化的方向和速度，二者是条件对应关系，与题干逻辑关系不一致，排除；\nC项：基因剪辑是生物工程领域中一项关键技术，二者是技术与应用领域的对应关系，与题干逻辑关系不一致，排除；\nD项：自动驾驶是智能汽车的一个重要特点，二者是属性对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":79,"missingImage":false},{"type":"question","qid":"18507967","cat":"类比推理","stem":"睡眠不足：血压升高","options":{"A":"工匠精神：精益求精","B":"车辆增加：交通拥堵","C":"太阳照射：地表升温","D":"经济发展：基建提速"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n“睡眠不足”会导致“血压升高”，二者为因果对应关系，且“睡眠不足”是人为原因。\n第二步：判断选项词语间逻辑关系。\nA项：“工匠精神”就是追求卓越的创造精神、精益求精的品质精神、用户至上的服务精神，“精益求精”是“工匠精神”的内涵之一，二者不是因果对应关系，与题干逻辑关系不一致，排除；\nB项：“车辆增加”会导致“交通拥堵”，二者为因果对应关系，且“车辆增加”是人为原因，与题干逻辑关系一致，当选；\nC项：“太阳照射”会导致“地表升温”，二者为因果对应关系，但“太阳照射”是自然原因，与题干逻辑关系不一致，排除；\nD项：“基建提速”有助于促进“经济发展”，二者为因果对应关系，但词语顺序与题干相反，排除。\n故正确答案为B。","no":80,"missingImage":false},{"type":"question","qid":"18507959","cat":"类比推理","stem":"芝兰之室：鲍鱼之肆","options":{"A":"惊弓之鸟：漏网之鱼","B":"再造之恩：犬马之劳","C":"莫逆之交：乌合之众","D":"诛心之论：绕梁之音"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n芝兰之室指美好的环境；鲍鱼之肆比喻不良的、恶劣的环境，二者为反义关系。\n第二步：判断选项词语间逻辑关系。\nA项：惊弓之鸟指被弓箭吓怕了的鸟，比喻受过惊吓后遇到一点动静就十分害怕的人；漏网之鱼指逃脱鱼网的鱼，比喻侥幸逃脱的罪犯或敌人，二者无明显语义关系，与题干逻辑关系不一致，排除；\nB项：再造之恩指像使自己再生一样的恩情，形容恩情极大；犬马之劳指像犬马那样所做的操劳，表示心甘情愿受人驱使，为人效劳，二者无明显语义关系，与题干逻辑关系不一致，排除；\nC项：莫逆之交指志同道合或情投意合的交谊，也指有这样交谊的朋友；乌合之众指临时杂凑、毫无组织纪律的一群人，二者为反义关系，与题干逻辑关系一致，当选；\nD项：诛心之论意思是不问罪行，只根据其用心以认定罪状，也指揭穿动机的评论；绕梁之音指美妙动听的音乐，二者无明显语义关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":81,"missingImage":false},{"type":"question","qid":"18507981","cat":"类比推理","stem":"银：铝：氧","options":{"A":"速降：攀岩：跑酷","B":"中山装：马面裙：燕尾服","C":"油菜：菠菜：青菜","D":"花猫：黑猫：波斯猫"},"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。\n从金属角度来看，银和铝均为金属元素，二者为并列关系，氧不是金属元素，第三词与前两词不是并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：速降、攀岩和跑酷为三种不同的运动形式，三者为并列关系，与题干逻辑关系不一致，排除；\nB项：从所属文化体系来看，中山装与马面裙均为中式服装，二者为并列关系，燕尾服是西式服装，第三词与前两词不是并列关系，与题干逻辑关系一致，当选；\nC项：青菜别名小白菜，油菜、菠菜和青菜均为蔬菜，三者为并列关系，与题干逻辑关系不一致（注：当青菜理解成绿色菜的统称时，前两词与第三词为包容关系，此时也与题干逻辑关系不一致），排除；\nD项：花猫和黑猫是以猫的颜色划分的，二者为并列关系，波斯猫是以猫的品种划分的，第三词与前两词为交叉关系，与题干逻辑关系不一致，排除。\n故正确答案为B。","no":82,"missingImage":false},{"type":"question","qid":"18507995","cat":"类比推理","stem":"火：烧烤：烘焙","options":{"A":"水：瓢泼：嘀嗒","B":"木：梁柱：床柜","C":"金：铜钱：银针","D":"土：坡地：坷垃"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n烧烤和烘焙是两种不同的烹饪方式，二者是并列关系；制作烧烤和烘焙的过程中都会用到“火”，其中烧、烤、烘、焙这四个字的偏旁均为“火”。\n第二步：判断选项词语间逻辑关系。\nA项：瓢泼形容雨下得非常大，嘀嗒形容水滴落下或钟表摆动的声音，二者都可以用来形容雨水的下落状态，二者是并列关系，但瓢、嘀、嗒的偏旁均不为“水”，与题干逻辑关系不一致，排除；\nB项：梁柱和床柜是两种不同的房屋部件，二者是并列关系；制作梁柱和床柜的过程中都会用到“木”，但床的偏旁为“广”，与题干逻辑关系不一致，排除；\nC项：铜钱和银针是两种不同的金属制品，二者是并列关系；金可指金属，通常指金、银、铜、铁、锡等，制作铜钱和银针的过程中都会用到“金”，其中铜、钱、银、针这四个字的偏旁均为“钅（即金）”，与题干逻辑关系一致，当选；\nD项：坡地指山坡上倾斜的田地，坷垃指土块，坷垃是坡地的组成部分，二者是组成关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":83,"missingImage":false},{"type":"question","qid":"18507996","cat":"类比推理","stem":"拜师：学艺：出师","options":{"A":"规划：实施：总结","B":"破晓：日暮：日中","C":"奠基：建造：开发","D":"剪刻：构图：装裱"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n先拜师，然后学艺，最后出师，三者为时间先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：先规划，然后实施，最后总结，三者为时间先后顺序的对应关系，与题干逻辑关系一致，当选；\nB项：先破晓（即黎明时分)，然后日中（即中午），最后日暮（即太阳落山时分），三者为时间先后顺序的对应关系，但词语顺序与题干不一致，与题干逻辑关系不一致，排除；\nC项：开发指以荒地、矿山、森林、水力等自然资源为对象进行劳动，以达到利用的目的。先奠基，然后建造，二者都是开发的具体环节，前两词与第三词不是时间先后顺序的对应关系，与题干逻辑关系不一致，排除；\nD项：先构图，然后剪刻，最后装裱，三者为时间先后顺序的对应关系，但词语顺序与题干不一致，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":84,"missingImage":false},{"type":"question","qid":"18508000","cat":"类比推理","stem":"公共汽车：汽车：交通工具","options":{"A":"年工资：月工资：工资","B":"实词：名词：专有名词","C":"济南市：山东省：中国","D":"单独概念：概念：思维形式"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n公共汽车是汽车的一种，汽车是交通工具的一种，三者为层层种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：年工资与月工资都属于不同时间段工资总额的描述，二者为并列关系，与题干逻辑关系不一致，排除；\nB项：专有名词是名词的一种，名词是实词的一种，三者为层层种属关系，但词语顺序与题干不一致，排除；\nC项：济南市是山东省的一部分，山东省是中国的一部分，三者为层层组成关系，与题干逻辑关系不一致，排除；\nD项：单独概念是概念的一种，概念是思维形式的一种，三者为层层种属关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":85,"missingImage":false},{"type":"question","qid":"18508006","cat":"类比推理","stem":"文字 对于 （    ） 相当于 说话 对于 （    ）","options":{"A":"珠圆玉润；绘声绘色","B":"气势磅礴；窃窃私语","C":"奇文共赏；指手画脚","D":"舞文弄墨；口若悬河"},"answer":"A","explanation":"逐一代入选项。\nA项：“珠圆玉润”形容歌声婉转优美或文字流畅明快，珠圆玉润的文字，二者为偏正关系；“绘声绘色”形容叙述或描写生动逼真，绘声绘色地说话，二者为偏正关系，前后逻辑关系一致，当选；\nB项：“气势磅礴”形容气势雄伟壮大，也可以指文字或文学作品展现出雄浑气魄，气势磅礴的文字，二者为偏正关系；“窃窃私语”指私下里小声交谈，窃窃私语是一种说话的形式，二者为种属关系，前后逻辑关系不一致，排除；\nC项：“奇文共赏”指少见的好文章大家一道欣赏，与文字没有明显的逻辑关系；“指手画脚”形容说话时兼用手势示意，指手画脚地说话，二者为偏正关系，前后逻辑关系不一致，排除；\nD项：“舞文弄墨”指玩弄文字技巧，二者是对应关系；“口若悬河”指说话像瀑布流泻一样滔滔不绝，形容能言善辩，口若悬河地说话，二者为偏正关系，前后逻辑关系不一致，排除。\n故正确答案为A。","no":86,"missingImage":false},{"type":"question","qid":"18508013","cat":"类比推理","stem":"教务主任 对于 （    ） 相当于 （    ） 对于 育种技术","options":{"A":"校规校纪；农机技术","B":"教师任免；科技人才","C":"在校学生；土壤条件","D":"学籍管理；农业专家"},"answer":"D","explanation":"逐一代入选项。\nA项：教务主任是校长领导下的学校教学的具体组织者和管理者，可以参与制定校规校纪，二者为职业与工作内容的对应关系；农机技术是指在种植业和畜牧业生产过程中使用各种机械的相关技术，育种技术是培育优良动植物新品种的技术，二者为并列关系，前后逻辑关系不一致，排除；\nB项：教务主任是校长领导下的学校教学的具体组织者和管理者，教师任免不是教务主任的工作职责，二者无明显逻辑关系；科技人才是掌握知识或生产工艺技能并有较大社会贡献的人，育种技术是培育优良动植物新品种的技术，科技人才可以研发育种技术，二者为主体与工作成果的对应关系，前后逻辑关系不一致，排除；\nC项：教务主任是校长领导下的学校教学的具体组织者和管理者，在校学生是教务主任的管理对象，二者为职业与对象的对应关系；育种技术是培育优良动植物新品种的技术，育种技术会受到土壤条件的影响，二者为条件对应关系，前后逻辑关系不一致，排除；\nD项：教务主任是校长领导下的学校教学的具体组织者和管理者，学籍管理是教务主任的工作内容之一，二者为职业与工作内容的对应关系；育种技术是培育优良动植物新品种的技术，是农业专家的工作内容之一，二者为职业与工作内容的对应关系，前后逻辑关系一致，当选。\n故正确答案为D。","no":87,"missingImage":false},{"type":"question","qid":"10886459","cat":"类比推理","stem":"学校筹集到一笔资金用于对场地进行重新建设，对于资金的分配，有老师有以下观点：\n甲：或者建设体育场，或者建设实验楼；\n乙：不是建设体育场，也不是建设实验楼；\n丙：或者建设实验楼，或者不建设教学楼。\n最后只有一位老师的说法正确，请问这笔资金用于建设什么场地？","options":{"A":"体育场","B":"实验楼","C":"教学楼","D":"体育场和教学楼"},"answer":"C","explanation":"第一步：找出题干矛盾命题。\n甲：体育场 或 实验楼；\n乙：\u003cimg data-k=\"0be436194951\">体育场 且 \u003cimg data-k=\"0be436194951\">实验楼；\n丙：实验楼 或 \u003cimg data-k=\"0be436194951\">教学楼。\n分析题干条件可知，甲和乙的说法为矛盾关系，必有一真一假。\n第二步：根据题干条件推理。\n根据题干条件可知，只有一位老师的说法正确，则说法为真的人一定在甲和乙之间，可知丙的说法为假，说明丙的矛盾为真，即“\u003cimg data-k=\"0be436194951\">实验楼 且 教学楼”为真，此时无法确定甲和乙的说法谁真谁假，即无法推出这笔资金是否用于建设体育场，故仅可推出这笔资金用于建设教学楼。\n故正确答案为C。","no":88,"missingImage":false},{"type":"question","qid":"10886462","cat":"逻辑判断","stem":"物业为了防止小区电动车上楼进户进而引起火灾，所以安装了“阻拒”系统，该系统发现一旦小区电梯中进入电动车，就会自动报警，小区物业认为该系统能够有效防止电动车上楼。反对者认为，该措施不一定能够有效。\n以下哪项不能支持反对者的观点？","options":{"A":"部分住户可能会故意遮挡电动车，使其不被系统识别","B":"该小区的电动车棚的面积和充电桩的数量都不能满足用户需要","C":"系统存在误报情况，可能引发住户不满","D":"系统仅能报警，无法强制阻止电动车上楼"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：安装了“阻拒”系统不一定能有效防止电动车上楼。\n论据：无。\n本题只有论点，没有论据，加强优先考虑补充论据，且本题为选非题，找出可以加强的选项排除即可。\n第二步：逐一分析选项。\nA项：该项指出系统无法识别被用户故意遮挡的电动车，说明安装了“阻拒”系统也不一定能有效防止电动车上楼，补充论据，可以加强，排除；\nB项：该项指出该小区电动车棚的面积和充电桩的数量都不能满足用户需要，说明部分用户可能会将电动车在楼上停放或充电，因此即使系统报警，这些用户仍可能因无视或躲避报警而让电动车上楼，即安装了“阻拒”系统也不一定能有效防止电动车上楼，补充论据，可以加强，排除；\nC项：该项指出系统存在误报情况，可能会引发住户不满，说明当该系统将其它物品错误识别为电动车时，会给住户造成困扰，但这样的误报本身并不影响该系统识别真实的电动车并阻止其上楼，因此安装了“阻拒”系统可以有效防止电动车上楼，无法加强，当选；\nD项：该项指出系统仅能报警，无法强制阻止电动车上楼，说明住户若无视警报，电动车仍然可以上楼进户，即安装了“阻拒”系统也不一定能有效防止电动车上楼，补充论据，可以加强，排除。\n本题为选非题，故正确答案为C。","no":89,"missingImage":false},{"type":"question","qid":"10886461","cat":"逻辑判断","stem":"人体中需要维持血糖适度平衡。糖尿病患者血糖升高后，胰腺中有\u003cimg data-k=\"87dff3f6cc87\">细胞分泌胰岛素，以控制血液中血糖维持在平衡范围内。有研究人员发现，有一部分细胞能够先比其他细胞更加敏锐地对血糖的升高做出反应，他们称该种类型的细胞为第一细胞。他们认为，第一细胞发生血糖反应之后，其他跟随细胞才会紧接着分泌胰岛素，对血糖进行调节。\n以下哪项能够支持研究人员的观点？","options":{"A":"第一细胞开始反应之后，其他跟随细胞滞后发生释放胰岛素反应","B":"当血糖水平升高时，抑制第一细胞的活性会导致其他跟随细胞无法及时分泌胰岛素","C":"即使第一细胞被移除，其他跟随细胞对血糖的反应不变","D":"第一细胞的数量远少于其他跟随细胞，但对血糖变化的敏感度显著更高"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：第一细胞发生血糖反应之后，其他跟随细胞才会紧接着分泌胰岛素，对血糖进行调节。\n论据：有一部分细胞能够先比其他细胞更加敏锐地对血糖的升高做出反应，他们称该种类型的细胞为第一细胞。\n本题论点和论据均在讨论第一细胞先于其他跟随细胞对血糖进行调节，二者话题一致，加强优先考虑补充论据。\n第二步：逐一分析选项。\nA项：该项指出第一细胞先于其他跟随细胞发生反应，是对论点的重复，可以加强，保留；\nB项：该项指出抑制第一细胞的活性，其他跟随细胞会无法及时分泌胰岛素，说明只有第一细胞发生反应后，其他跟随细胞才会分泌胰岛素，第一细胞先于其他跟随细胞发生反应，补充论据，可以加强，保留；\nC项：该项指出移除第一细胞后其他跟随细胞反应不变，直接否定了第一细胞的作用，说明第一细胞发生反应并非其他跟随细胞发生反应的前提，可以削弱，无法加强，排除；\nD项：该项指出第一细胞具有敏感度高的特性，即第一细胞对血糖变化的反应更灵敏，但与论点讨论的第一细胞是否先于其他跟随细胞对血糖进行调节的话题无关，为无关项，无法加强，排除。\n对比A、B两项，A项是对论点的简单重复，B项是补充论据，B项的加强力度更强，当选。\n故正确答案为B。","no":90,"missingImage":false},{"type":"question","qid":"14403695","cat":"逻辑判断","stem":"当下人们普遍认为饮水是保持身体健康的重要方式。然而一些研究表明，过量饮水可能导致低钠血症。低钠血症是指血液中的钠离子含量过低，可能引发头痛，呕吐抽搐，甚至昏迷等症状。\n以下哪项如果为真，最能支持题干观点？","options":{"A":"坚持锻炼有助于增强体质和免疫力，与饮水量无直接关系","B":"过量饮水会增加肾脏负担，导致排尿能力下降，从而引发水中毒","C":"低钠血症的发生率较低，是因为大多数人不会一次性摄入大量水分","D":"急性肾功能衰竭不是低钠血症的直接表现症状之一"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：过量饮水可能导致低钠血症。\n论据：无。\n本题论点指出过量饮水可能导致低钠血症，只有论点，没有论据，加强考虑补充论据。\n第二步：逐一分析选项。\nA项：选项指出坚持锻炼与饮水量无直接关系，讨论的是“锻炼、饮水量”与“体质”之间的关系，而论点讨论的是“过量饮水”是否会引起“低钠血症”，话题不一致，无法加强，排除；\nB项：选项指出大量饮水会增加肾脏负担，引发水中毒，解释了“过量饮水”是如何导致“水中毒”的（这里有个小常识，水中毒又称稀释性低钠血症），解释原因，可以加强，保留；\nC项：选项指出低钠血症发生率较低，是因为人们不会一次性摄入大量水分，即从反面说明了大量饮水容易引起低钠血症，补充论据，可以加强，保留；\nD项：选项指出急性肾功能衰竭不是低钠血症的直接表现症状之一，讨论的是“急性肾功能衰竭”和“低钠血症”的关系，而论点讨论的是“过量饮水”和“低钠血症”的关系，话题不一致，无法加强，排除。\n对比B、C两项，B项直接正面解释了“大量饮水”造成“低钠血症”的原因，而C项是通过补充反面论据说明“低钠血症发生率低”和“大量饮水人少”有联系，不如B项正面直接，根据力度比较原则，直接＞间接，B项力度更强。\n注：有的同学可能觉得B项的水中毒与论点中的低钠血症话题不一致，是因为本题涉及到了常识性问题，水中毒又称稀释性低钠血症。选项是将论点中的词语进行了同义替换，与论点讨论的话题是一致的。就像如果论点讨论的是母亲，而选项讨论的是妈妈，两词是同义替换，故二者讨论话题是一致的。\n故正确答案为B。","no":91,"missingImage":false},{"type":"question","qid":"10886464","cat":"逻辑判断","stem":"根据心理学家研究，人们在面对挑战时，往往会出现不同的心理应对机制。研究表明，在面对笔试或面试等压力挑战下，人们往往会采用“回避”或“躲避”的应对策略，而在面对相对简单的任务时，往往采用积极应对和主动解决的策略。\n由此可以推出：","options":{"A":"心理应对策略的选择与任务的难易程度无关","B":"在面对压力挑战时，人们会更倾向于选择消极的心理应对方式","C":"所有人在面对压力时都会本能地采取回避策略","D":"简单任务能完全消除人们的消极应对倾向"},"answer":"B","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干中“在面对笔试或面试等压力挑战下，人们往往会采用‘回避’或‘躲避’的应对策略，而在面对相对简单的任务时，往往采用积极应对和主动解决的策略”可知，心理应对策略的选择与任务的难易程度有关，无法推出，排除；\nB项：“面对压力时会选择消极的心理应对方式”是对题干中“在面对笔试或面试等压力挑战下，人们往往会采用‘回避’或‘躲避’的应对策略”的同义替换，可以推出，当选；\nC项：题干说的是“在面对笔试或面试等压力挑战下，人们往往会采用‘回避’或‘躲避’的应对策略”，但“往往”只是一个倾向性的描述，不代表所有人都会采取回避策略，说法过于绝对，无法推出，排除；\nD项：题干说的是“在面对相对简单的任务时，往往采用积极应对和主动解决的策略”，即往往能消除消极应对倾向，但“往往”只是一个倾向性的描述，不代表完全消除了消极应对倾向，说法过于绝对，无法推出，排除。\n故正确答案为B。","no":92,"missingImage":false}],"count":33,"answerable":33,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        2023年，邮政行业寄递业务量累计完成1624.8亿件，同比增长16.8%。其中，快递业务量（不包含邮政集团包裹业务）累计完成1320.7亿件，同比增长19.4%。\u003c/p>\u003cp>        从收入来看，2023年，邮政行业业务收入（不包括邮政储蓄银行直接营业收入）累计完成15293.0亿元，同比增长13.2%。其中，快递业务收入累计完成12074.0亿元，同比增长14.3%。\u003c/p>\u003cp>\u003cimg data-k=\"7fdbe37b3e89\" style=\"max-width:570px\">\u003c/p>","questions":[{"qid":
