<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2021年新疆生产建设兵团面向社会招录公务员考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>

      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>

</div>

<div class="wrap">

</div>

<div class="mask" id="mask">

</div>
<div class="toast" id="toast"></div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2021-新疆-兵团-2","title":"2021年新疆生产建设兵团面向社会招录公务员考试《行测》题（网友回忆版）","year":"2021","group":"新疆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"3522653","cat":"新思想","stem":"2020年10月14日，习近平总书记在深圳经济特区建立40周年庆祝大会上发表讲话，对经济特区建设给予了充分肯定。下列关于经济特区建设的表述不准确的是：","options":{"A":"1978年12月，党的十一届三中全会作出把党和国家工作重心转移到经济建设上来、实行改革开放的历史性决策","B":"1979年7月，党中央、国务院批准广东、福建两省实行“特殊政策、灵活措施、先行一步”，并试办出口特区","C":"1980年8月，党和国家批准在深圳、珠海、上海、厦门设置经济特区","D":"1988年4月，党和国家批准建立海南经济特区"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，1978年12月，党的十一届三中全会作出把党和国家工作重心转移到经济建设上来、实行改革开放的历史性决策，实现了新中国成立以来党的历史的伟大转折。\nB项正确，1979年7月，党中央、国务院批准广东、福建两省实行“特殊政策、灵活措施、先行一步”，并试办出口特区。\nC项错误，1980年8月，党和国家批准在深圳、珠海、汕头、厦门设置经济特区。\nD项正确，1988年4月，党和国家批准建立海南经济特区，明确要求发挥经济特区对全国改革开放和社会主义现代化建设的重要窗口和示范带动作用。\n本题为选非题，故正确答案为C。","no":1,"missingImage":false}],"count":1,"answerable":1,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"3522652","cat":"人文常识","stem":"下列对我国“十四五”时期经济社会发展主要目标表述错误的是：","options":{"A":"经济发展取得新成效和改革开放迈出新步伐","B":"创新驱动取得新优势和国内市场形成发展新格局","C":"民生福祉达到新水平和国家治理效能得到新提升","D":"社会文明程度得到新提高和生态文明建设实现新进步"},"answer":"B","explanation":"本题考查政治常识。\n2020年10月29日，中国共产党第十九届中央委员会第五次全体会议通过的《国民经济和社会发展第十四个五年规划和2035年远景目标纲要》中指出：“‘十四五’时期经济社会发展主要目标。锚定二〇三五年远景目标，综合考虑国内外发展趋势和我国发展条件，坚持目标导向和问题导向相结合，坚持守正和创新相统一，今后五年经济社会发展要努力实现以下主要目标：经济发展取得新成效；改革开放迈出新步伐；社会文明程度得到新提高；生态文明建设实现新进步；民生福祉达到新水平；国家治理效能得到新提升。”\n本题为选非题，故正确答案为B。","no":2,"missingImage":false},{"type":"question","qid":"3522663","cat":"人文常识","stem":"2020年12月17日凌晨1时59分，嫦娥五号返回器携带月球样品成功着陆，这标志着我国的探月工程—“嫦娥工程\"取得阶段性成功。下列关于我国探月工程的表述错误的是：","options":{"A":"2020年嫦娥五号成功采集月壤标志着中国探月工程“绕、落、采”三步走战略圆满收官","B":"“嫦娥工程”分为“无人月球探测”、“载人登月”和“建立月球基地”三个阶段","C":"2011年我国的嫦娥二号实现了环绕月球的目标","D":"2019年我国的嫦娥四号完成了首次月背登陆"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，嫦娥五号任务最重要的目标就是“采样返回”，这也是中国“探月工程”规划的“绕、落、回”中的第三步。2020年12月17日嫦娥五号返回器在内蒙古四子王旗预定区域成功着陆，标志着中国首次月球采样返回任务圆满完成。嫦娥五号任务的成功标志着我国探月工程“绕、落、回”三步走规划如期完成。该项“采”表述错误，应为“回”。\nB项正确，2004年，中国正式开展月球探测工程，并命名为“嫦娥工程”。嫦娥工程分为“无人月球探测”“载人登月”和“建立月球基地”三个阶段。\nC项正确，嫦娥二号，是中国探月计划中的第二颗绕月人造卫星。2010年10月1日，中国第二颗绕月探测卫星“嫦娥二号”在西昌卫星发射中心发射升空；2010年10月6日，嫦娥二号被月球捕获，进入环月轨道；2011年8月25日，嫦娥二号进入拉格朗日L2点环绕轨道；我国的嫦娥二号再次实现了环绕月球的目标。2012年12月15日，嫦娥二号工程宣布收官。嫦娥二号任务的圆满成功，标志着中国在深空探测领域突破并掌握了一大批新的具有自主知识产权的核心技术和关键技术，为后续实施探月二期工程的“落”和“回”以及下一步开展火星等深空探测奠定了坚实技术基础，中国从航天大国迈向航天强国的进程又跨出了重要的一步。\nD项正确，2019年1月3日，嫦娥四号探测器成功自主着陆在月球背面南极—艾特肯盆地内的冯·卡门撞击坑内，实现人类探测器首次在月球背面软着陆。\n本题为选非题，故正确答案为A。","no":3,"missingImage":false},{"type":"question","qid":"3523518","cat":"人文常识","stem":"下列关于讲政治的表述不准确的是：","options":{"A":"不忘初心，牢记使命是讲政治最本质的要求","B":"必须提高政治识别力、政治领悟力、政治执行力","C":"讲政治，概括起来说就是从政治上观察和处理问题","D":"党领导人民治国理政，最重要的就是坚持正确政治方向，始终保持我们党的政治本色，始终沿着中国特色社会主义道路前进"},"answer":"B","explanation":"本题考查政治常识。\nA项正确，不忘初心，牢记使命是讲政治最本质的要求。职位越高越要忠于人民，全心全意为人民服务。只有敬畏法律、敬畏纪律，自觉管住自己，在廉洁自律上作出表率，才能担起肩上的重任。而最与初心和使命相背离的就是种种腐化堕落、特权思想。\nB项错误，中共中央政治局于2020年12月24日至25日召开的民主生活会中，习近平指出，必须增强政治意识，善于从政治上看问题，善于把握政治大局，不断提高政治判断力、政治领悟力、政治执行力。\nC项正确，讲政治，概括起来说就是从政治上观察和处理问题。中共中央政治局于2020年12月24日至25日召开的民主生活会中，习近平指出，旗帜鲜明讲政治，既是马克思主义政党的鲜明特征，也是我们党一以贯之的政治优势。\nD项正确，中共中央政治局于2020年12月24日至25日召开的民主生活会中，习近平指出，党领导人民治国理政，最重要的就是坚持正确政治方向，始终保持我们党的政治本色，始终沿着中国特色社会主义道路前进。这就是讲政治背后的大逻辑。\n本题为选非题，故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"3523538","cat":"法律常识","stem":"下列关于2021年3月1日起施行的《中华人民共和国长江保护法》的亮点描述准确的是：\n①做好了统筹协调、系统保护的顶层设计\n②坚持把保护和修复长江流域生态环境放在压倒性位置\n③突出共抓大保护、不搞新开发\n④坚持责任导向，加大处罚力度\n⑤切实增强了长江保护和发展的系统性、整体性、协同性","options":{"A":"①③④","B":"②④⑤","C":"①②③④","D":"①②④⑤"},"answer":"D","explanation":"本题考查法律常识。\n①正确，该法中规定国家建立长江流域协调机制，统一指导、统筹协调、整体推进长江保护工作；按照中央统筹、省负总责、市县抓落实的要求，建立长江保护工作机制，明确各级政府及其有关部门、各级河湖长的职责分工；建立区域协调协作机制，明确长江流域相关地方根据需要在地方性法规和政府规章制定、规划编制、监督执法等方面开展协调与协作，切实增强长江保护和发展的系统性、整体性、协同性。故该法做好了统筹协调、系统保护的顶层设计。\n②正确，该法通过规定更高的保护标准、更严格的保护措施，加强山水林田湖草整体保护、系统修复。如强化水资源保护，加强饮用水水源保护和防洪减灾体系建设，完善水量分配和用水调度制度，保证河湖生态用水需求；落实党中央关于长江禁渔的决策部署，加强禁捕管理和执法工作等。故该法体现了把保护和修复长江流域生态环境放在压倒性位置。\n③错误，根据《中华人民共和国长江保护法》第三条规定：“长江流域经济社会发展，应当坚持生态优先、绿色发展，共抓大保护、不搞大开发。”“不搞新开发”表述错误。\n④正确，该法强化考核评价与监督，实行长江流域生态环境保护责任制和考核评价制度，建立长江保护约谈制度，规定国务院定期向全国人大常委会报告长江保护工作；坚持问题导向，针对长江禁渔、岸线保护、非法采砂等重点问题，在现有相关法律的基础上补充和细化有关规定，并大幅提高罚款额度，增加处罚方式，补齐现有法律的短板和不足，切实增强法律制度的权威性和可执行性。故该法体现了坚持责任导向，加大处罚力度。\n⑤正确，该法做好了统筹协调、系统保护的顶层设计，明确了各方职责分工，切实增强长江保护和发展的系统性、整体性、协同性。\n故①②④⑤正确。\n故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"3522668","cat":"法律常识","stem":"关于《中华人民共和国民法典》，下列说法错误的是：","options":{"A":"允许抵押耕地使用权","B":"将绿色原则作为民法的基本原则","C":"明确了生态环境损害的修复和赔偿规则","D":"将无民事行为能力人最高年龄标准调整为10周岁"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国民法典》第三百九十九条第二项规定：“下列财产不得抵押：······（二）宅基地、自留地、自留山等集体所有土地的使用权，但是法律规定可以抵押的除外；······”民法典删除了“耕地”不得抵押的情形，故允许抵押耕地使用权。\nB项正确，根据《中华人民共和国民法典》第九条规定：“民事主体从事民事活动，应当有利于节约资源、保护生态环境。”绿色原则是民法的基本原则之一。\nC项正确，根据《中华人民共和国民法典》第一千二百三十二条规定：“侵权人违反法律规定故意污染环境、破坏生态造成严重后果的，被侵权人有权请求相应的惩罚性赔偿。”第一千二百三十四条规定：“违反国家规定造成生态环境损害，生态环境能够修复的，国家规定的机关或者法律规定的组织有权请求侵权人在合理期限内承担修复责任。侵权人在期限内未修复的，国家规定的机关或者法律规定的组织可以自行或者委托他人进行修复，所需费用由侵权人负担。”故《民法典》明确了生态环境损害的修复和赔偿规则。\nD项错误，根据《中华人民共和国民法典》第二十条规定：“不满八周岁的未成年人为无民事行为能力人，由其法定代理人代理实施民事法律行为。”故无民事行为能力人最高年龄标准并没有调整为十周岁，而是八周岁。\n本题为选非题，故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"3522694","cat":"人文常识","stem":"下列历史名人按生活年代先后排序正确的是：","options":{"A":"周文王—管仲—孔子","B":"周公旦—李斯—楚庄王","C":"孙膑—诸葛亮—蒙恬","D":"屈原—勾践—伍子胥"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，周文王姬昌（前1152年―前1056年），周朝奠基者，其在位期间勤于政事，重视发展农业生产，礼贤下士，广罗人才。管仲（约公元前723年—公元前645年），春秋前期齐国著名的政治家、思想家，被齐桓公任命为相，在齐国进行了政治、经济等方面的一系列改革。孔子（公元前551年—公元前479年），春秋时期思想家、教育家，儒家学派的创始人。选项排序无误。\nB项错误，周公旦，西周初期杰出的政治家、军事家、思想家、教育家，曾两次辅佐周武王东伐纣王，并制作礼乐。李斯，战国末期楚国人，秦代著名的政治家、文学家和书法家，法家代表人物之一。楚庄王熊旅，春秋时期楚国国君，楚庄王元年（前613年）至楚庄王二十三年（前591年）在位，春秋五霸之一。选项排序有误，楚庄王生活的年代在李斯之前。\nC项错误，孙膑是战国时期齐国军事家，春秋战国时期诸子百家之一的兵家代表人物，其军事思想主要集中于《孙膑兵法》。诸葛亮是三国时期蜀汉丞相，先后辅佐刘备、刘禅两朝。蒙恬，秦朝时期名将，秦统一六国后，蒙恬三十万大军北击匈奴，收复河南之地，威震匈奴，被誉为“中华第一勇士”。选项排序有误，蒙恬生活的年代在诸葛亮之前。\nD项错误，屈原（约公元前340年—公元前278年），战国时期楚国诗人、政治家，被誉为“楚辞之祖”。越王勾践（约公元前520年-公元前464年），夏禹后裔，越王允常之子，春秋末年越国国君。伍子胥（约公元前559年-公元前484年），春秋末期吴国大夫、军事家。选项排序有误，屈原生活的年代在伍子胥、勾践之后。\n故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"3522662","cat":"人文常识","stem":"某小区业主拟将其住宅改变为经营性民宿，下列选项中不属于其应当具备的前提条件是：","options":{"A":"应当遵守国家有关公共防疫的规定","B":"应当遵守由业主共同制定的管理规约","C":"应当获得该业主所在楼栋的其他全体业主同意","D":"应当获得小区全体业主三分之二以上多数同意"},"answer":"D","explanation":"本题考查法律常识。\nA、B、C三项正确，D项错误。根据《民法典》第二百七十九条规定：“业主不得违反法律、法规以及管理规约，将住宅改变为经营性用房。业主将住宅改变为经营性用房的，除遵守法律、法规以及管理规约外，应当经有利害关系的业主一致同意。”故业主将住宅改变为经营性用房民宿，应当遵守法律、法规（国家有关公共防疫的规定等）及小区业主共同制定的管理规约，应当经有利害关系的业主（业主所在楼栋的其他全体业主）一致同意。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"3522675","cat":"人文常识","stem":"关于农谚“小雪雪满天，来岁必丰年”所涉及的原理，下列说法错误的是：","options":{"A":"新雪孔隙度高、空气多，对土壤有防冻保湿作用","B":"雪融化时吸收土壤内部热量，越冬虫卵不易存活","C":"雪中含有大量磷化物，融化后可为土壤提供肥料","D":"雪融化时入土壤，提高土壤含水量，缓解春旱"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，新雪的密度低、孔隙度高，贮藏在新雪中的空气多，而空气是热的不良导体，因此土壤中热量的散失较少，可以起到防冻保湿的作用。\nB项正确，雪融化时从土壤中吸收许多热量，这时土壤会突然变得非常寒冷，温度降低许多，越冬虫卵不易存活。\nC项错误，雪是大量白色不透明冰晶和其聚合物组成的降水，由大气中的水蒸气直接凝华而成。根据测定，雪水中含有一定量的氮化物。雪水渗入土壤，就等于施了一次氮肥。用雪水喂养家畜家禽、灌溉庄稼都可收到明显的效益。\nD项正确，寒潮以后，天气渐渐回暖，雪慢慢融化，雪融下去的水可以提高土壤含水量，给庄稼积蓄很多水，对春耕播种以及庄稼的生长发育都很有利。\n本题为选非题，故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"3522659","cat":"人文常识","stem":"新文化运动是一场思想文化革新、文学革命运动。下列新文化运动代表人物与其作品对应错误的是∶","options":{"A":"蔡元培—《中国伦理学史》","B":"陈独秀—《文学改良刍议》","C":"胡适—《中国哲学史大纲》","D":"李大钊—《布尔什维主义的胜利》"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，《中国伦理学史》是由蔡元培所作的第一部系统整理和研究中国古代伦理思想发生、发展及其变迁的学术著作，全书分绪论、先秦创史时代、汉唐继承时代、宋明理学时代四大部分32章，系统地介绍了中国古代伦理学界重要的流派及主要代表人物，并阐述了各家学说的要点、源流及发展。\nB项错误，《文学改良刍议》是由胡适所作，并于1917年1月发表。《文学改良刍议》是倡导文学革命的第一篇文章。\nC项正确，《中国哲学史大纲》是胡适写定于1918年9月的书，此书一出版即因其方法和见解的创新而极受注意，3年时间再版了7次。此书被誉为：用现代学术方法系统研究中国古代哲学史的第一部著作，它的出版被视为中国哲学史学科成立的标志。\nD项正确，《布尔什维主义的胜利》是由李大钊所作，于1918年11月载于《新青年》。文章热烈欢呼十月革命的胜利，认为这是民主主义的胜利，是布尔什维的胜利，是世界劳工阶级的胜利。\n本题为选非题，故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"3523535","cat":"人文常识","stem":"中华传统美德是中华文化精髓，蕴含着丰富的思想道德资源，凝聚着数千年来中华民族关于个人品德修养和行为规范的思考和表达。下列关于中华传统美德的表述正确的有几项？\n①天行健，君子以自强不息\n②天下兴亡，匹夫有责\n③美德即知识\n④仁者爱人","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查人文常识。\n①正确，“天行健，君子以自强不息”出自《易传》中的《象传》，意为宇宙不停运转，人应效法天地，永远不断地前进。体现了传统美德中的励志自强、崇尚精神境界。\n②正确，“天下兴亡，匹夫有责”是清朝初年著名儒者顾炎武的社会主张，意为国家的兴盛或衰亡，每个普通人都有一份责任。体现了传统美德中爱国奉献、以天下为己任的社会责任感。\n③错误，“美德即知识”是古希腊哲学家苏格拉底的道德伦理命题，出自公元前420年柏拉图的著作《美诺篇》。“美德”指人的所有优秀品质，“知识”指整个世界的理念知识和善的知识。苏格拉底认为，道德即知识，道德与知识是同一的，美德并非天生，而是得自于教育。其不属于中华传统美德的表述。\n④正确，“仁者爱人”出自《孟子·离娄章句下》，意为仁者是充满慈爱之心，满怀爱意的人；仁者是具有大智慧、人格魅力的人。体现了传统美德中乐群贵和，强调人际和谐的精神。\n综上所述，表述正确的有①②④三项。\n故正确答案为C。","no":11,"missingImage":false},{"type":"question","qid":"3522664","cat":"科技常识","stem":"关于诗词中反映的生物知识，下列说法错误的是：","options":{"A":"“有意栽花花不发，无心插柳柳成荫”描述的是柳树进行无性繁殖","B":"“银烛秋光冷画屏，轻罗小扇扑流萤”中的萤火虫发光是一种物理变化","C":"“野蚕作茧人不取，叶间扑扑秋蛾生”中的野蚕发育过程属于完全变态","D":"“等闲识得东风面，万紫千红总是春”中花色在红紫间变化是由于花青素"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，“有意栽花花不发，无心插柳柳成荫”指的是柳树用的扦插的方式进行繁殖的，扦插是常见的营养繁殖的方法，没有经过两性生殖细胞的结合过程，所以是无性生殖。\nB项错误，“银烛秋光冷画屏，轻罗小扇扑流萤”中的萤火虫发光，是因为萤火虫身体末端下方有发光器，体内的荧光素和荧光素酶反应后生成的黄绿色荧光，是一种化学变化。\nC项正确，完全变态是昆虫在个体发育中，经过卵、幼虫、蛹和成虫4个时期。“野蚕作茧人不取，叶间扑扑秋蛾生”中的野蚕发育过程是由卵到幼虫，再到蛹，最后成虫，是一个完全变态发育的过程。\nD项正确，花青素又称花色素，是自然界一类广泛存在于植物中的水溶性天然色素，这类色素的颜色，随细胞液的酸碱度变化而变化。花青素在碱性溶液中呈蓝色，在酸性溶液中呈红色，而在中性溶液中则呈紫色。因此凡是含有大量花青素的花瓣其颜色都在红、蓝、紫三色之间变化着。因此，“等闲识得东风面，万紫千红总是春”中花色在红紫间变化是由于花青素。\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"3522665","cat":"科技常识","stem":"下列说法符合医学常识的是：","options":{"A":"酒精浓度越高消毒效果越好","B":"使用含氯的牙膏有利于防龋齿","C":"缺碘可能会造成甲状腺素缺乏","D":"可作为麻醉剂的乙醚无色无味"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，酒精浓度越高，使蛋白质凝固的作用越强。当高浓度的酒精与细菌接触时，就能使菌体表面迅速凝固，形成一层包膜，阻止了酒精继续向菌体内部渗透，细菌内部的细胞没能彻底杀死，待到适当时机，包膜内的细胞可能将包膜冲破重新复活，则达不到消毒的效果。所以，选择浓度为\u003cimg data-k=\"6f4ae0e851d1\">的医用酒精最为适宜。\nB项错误，龋病是牙体硬组织脱矿与再矿化动态平衡被打破的结果。脱矿，就是牙齿中的矿物质溶解、流失；而再矿化，就是溶解的矿物盐重新在牙齿上沉积。氟化物可使再矿化作用大于脱矿作用，阻止龋病的发展。\nC项正确，碘是合成甲状腺激素的重要原料，如果缺碘就会导致甲状腺激素合成障碍，引起的代偿性的甲状腺肿。\nD项错误，可作为麻醉剂的乙醚，是一种带有刺激性气味、无色、易燃、极易挥发的液体。\n故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"3522670","cat":"人文常识","stem":"坐在火车里透过车窗观察远处的景物，下列说法正确的是：\n①远处景物朝火车前进的方向旋转\n②远处景物朝背离火车前进的方向旋转\n③远处景物相对观察者移动快\n④远处景物相对观察者移动慢","options":{"A":"①④","B":"①③","C":"②③","D":"②④"},"answer":"A","explanation":"本题考查科技常识。\n乘客坐在火车里，以火车为参照系，无论是近处还是远处的景物，看起来都是朝火车前进的相反方向运动，且运动速度相同。近处和远处的景物移动相同距离时，由于近处的景物对人的眼睛造成的视角更大，所以看起来移动的距离更大。因此，在火车上的人看来，近处的景物向后运动得快，而远处的景物向后运动得慢。故④表述正确。\n人在火车上同时看近处和远处的景物时，会不自觉地以近处的景物为参照物，这样远处的景物看起来就像在朝火车前进的方向旋转。故①表述正确。\n故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"3522696","cat":"人文常识","stem":"下列与地震有关的说法错误的是：","options":{"A":"冲击地震震源浅，影响范围小","B":"水库蓄水、地下抽水可诱发地震","C":"火山地震与构造地震常有密切关系","D":"我国的强震绝大部分是深源构造地震"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，冲击地震因山崩、滑坡等原因引起，或因碳酸盐岩地区岩层受地下水长期溶蚀形成许多地下溶洞，洞顶塌落引起，约占地震总数的\u003cimg data-k=\"815ec268d3d4\">，震源很浅，影响范围小，震级也不大。\nB项正确，在一定条件下，人类的工程活动可以诱发地震，诸如水库蓄水、城市或油田的抽水或注水、矿山坑道的崩塌、以及人工爆破或地下核爆炸等都能引起当地出现异常的地震活动，这类地震活动统称为诱发地震。\nC项正确，火山地震可以是直接由火山爆发引起，也可能是因火山活动引起构造变动，或是因构造变动引起火山喷发，从而导致地震。构造地震是由构造变动特别是断裂活动所产生的地震。因此，火山地震与构造地震常有密切关系。\nD项错误，全球绝大多数地震是构造地震，约占地震总数的\u003cimg data-k=\"98d1a3adb731\">。其中大多数又属于浅源地震，影响范围小，对地面及建筑物的破坏非常强烈，常引起生命财产的重大损失。我国的强震绝大部分是浅源构造地震，其中\u003cimg data-k=\"cd4db1324e77\">以上均与断裂活动有关。\n本题为选非题，故正确答案为D。","no":15,"missingImage":false},{"type":"question","qid":"4703270","cat":"科技常识","stem":"中国向世界宣布，被誉为“中国天眼”的500米口径球面射电望远镜（FAST）2021年4月1日起将正式对全球科学界开放。下列有关“中国天眼”的说法中正确的是：","options":{"A":"“中国天眼”并非世界最大的球面射电望远镜","B":"“中国天眼”之父是姜鹏","C":"“中国天眼”可用来发现脉冲星","D":"“中国天眼”所在地区属于丹霞地貌"},"answer":"C","explanation":"本题考查科技常识。\nA项错误，500米口径球面射电望远镜（FAST），是中国“十一五”重大科技基础设施建设项目，2020年1月11日通过国家验收工作。目前，“中国天眼”是世界上最大的也是最灵敏的球面射电望远镜。\nB项错误，南仁东曾任FAST工程首席科学家兼总工程师，负责500米口径球面射电望远镜（FAST）的科学技术工作，被誉为“中国天眼”之父。\nC项正确，FAST作为一个多学科基础研究平台，能够巡视宇宙中的中性氢，研究宇宙大尺度物理学，以探索宇宙起源和演化；观测脉冲星，研究极端状态下的物质结构与物理规律；搜索可能的星际通讯信号，搜寻外星文明等。\nD项错误，“中国天眼”位于贵州省黔南布依族苗族自治州平塘县大窝凼的喀斯特洼坑中，属于喀斯特地貌。\n故正确答案为C。","no":16,"missingImage":false},{"type":"question","qid":"3522702","cat":"地理国情","stem":"下列关于黄河流域的说法错误的是:","options":{"A":"陕西境内秦岭以北的河流皆属该流域","B":"以“水少沙多、水沙异源”为突出特点","C":"该流域下游常因泥沙堆积形成“地上河”","D":"“泾渭分明”的现象发生在该流域的上游"},"answer":"D","explanation":"本题考查地理国情。\n黄河发源于青海省中部，巴颜喀拉山北麓，流经青海、四川、甘肃、宁夏、内蒙古、陕西、山西、河南、山东9个省、自治区，注入渤海，全长5464千米，是中国第二大河。\nA项正确，陕西境内绝大部分为外流河，分属黄河、长江两大水系。从地域分布上看，秦岭以南的长江水系，流域面积占全省的\u003cimg data-k=\"25cf5647428a\">，水资源量占到全省总量的\u003cimg data-k=\"436f7ab7854d\">，而秦岭以北的黄河水系，流域面积占全省的\u003cimg data-k=\"6e5bbaa4a13d\">，水资源量仅占\u003cimg data-k=\"c78f19de7451\">。\nB项正确，黄河主要流经干旱、半干旱和半湿润区，降水量较少，蒸发量大，所以水量小，中游流经黄土高原地区，水土流失严重，含沙量大。黄河的水量主要来自兰州以上的上游河段，而泥沙主要来自中游的黄土高原，具有“水沙异源”的突出特点。\nC项正确，黄河流域西界巴颜喀拉山，北抵阴山，南至秦岭，东注渤海。流域内地势西高东低，高差悬殊，形成自西而东、由高及低三级阶梯。第三级阶梯地势低平，绝大部分为海拔低于100米的华北大平原，包括下游冲积平原、鲁中丘陵和河口三角洲。黄河流入冲积平原后，河道宽阔平坦，泥沙沿途沉降淤积，河床高出两岸地面3-5米，甚至10米，形成“地上河”。\nD项错误，黄河上游流经青海、四川、甘肃、宁夏、内蒙古五省区的19个市州。而“泾渭分明”是指黄河的支流“泾河”和“渭河”，两河位于黄河流域的中游。渭河位于黄河腹地大“几”字形基底部位，是黄河最大支流，同时也是向黄河输送水、沙最多的支流；泾河，发源于宁夏泾源县六盘山东麓，于陕西高陵县注入渭河，是渭河的主要来沙区。两条河流的清与浊常随着季节发生交替变化，夏季丰水期两条河流含沙量都很高，界限不清晰。到了冬季枯水期，泾河的含沙量会下降，这时候就会呈现出“泾渭分明”的标志性现象。\n本题为选非题，故正确答案为D。","no":17,"missingImage":false},{"type":"question","qid":"3522701","cat":"人文常识","stem":"王某向李某借款1万元，李某当场向王某交付现金1万元，王某向李某出具借条一份，张某在该借条上签字，后王某没有按时还钱，李某将王某和张某同时起诉至法院，要求王某还钱，并要求张某承担连带责任。关于张某的责任，下列说法正确的是:","options":{"A":"张某只是作为见证人签字，无须承担任何责任","B":"张某在别人的借条上签字，应当推定为保证人，并承担保证责任","C":"张某在别人的借条上签字，视同共同借款人，应当承担共同还款责任","D":"只要借条上没有任何明确表述或其他事实表明张某愿意承担保证责任的，张某即无须承担任何责任"},"answer":"D","explanation":"本题考查法律常识。\n根据《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第二十条规定：“他人在借据、收据、欠条等债权凭证或者借款合同上签名或者盖章，但是未表明其保证人身份或者承担保证责任，或者通过其他事实不能推定其为保证人，出借人请求其承担保证责任的，人民法院不予支持。”故只要借条上没有任何明确表述或其他事实表明张某愿意承担保证责任的，张某即无须承担任何责任。\n故正确答案为D。","no":18,"missingImage":false},{"type":"question","qid":"3522699","cat":"经济常识","stem":"下列关于数字货币和数字人民币的表述不准确的是:","options":{"A":"从2020年下半年开始，数字人民币已在深圳、苏州等地展开大规模试点测试","B":"数字人民币是由中国人民银行发行的具有国家信用背书的法定货币，是数字形式的人民币","C":"没有银行账户，同样可以享受支付等金融服务，但持有的数字人民币在数字钱包里不计付利息","D":"数字人民币装在无形的数字钱包里，可用于线下和线上交易，但没有网络就不可付款，即不能“离线”支付"},"answer":"D","explanation":"本题考查经济常识。\nA项正确，2020年下半年以来，数字人民币在深圳、苏州等地面向不定向公众展开大规模试点测试。\nB项正确，数字人民币是由中国人民银行发行的具有国家信用背书的法定货币，是数字形式的人民币。数字人民币的定位是替代一部分现金。\nC项正确，数字人民币以广义账户体系为基础、支持银行账户松耦合，即意味着用户如果没有银行账户，同样可以利用手机号等唯一身份标识开通数字钱包，使用数字人民币进行支付，但持有的数字人民币在数字钱包里不计付利息。\nD项错误，目前，现金主要以纸币和硬币等实物形态存在，而数字人民币可以理解为数字形态的现金。纸币、硬币装在有形的钱包里，携带较为不便，多用于线下交易；数字人民币装在无形的数字钱包里，可用于线下和线上交易，且数字人民币具有“离线”支付功能。所谓“离线”支付，是指在无网或弱网条件下，用户进行交易或转款时不连接后台系统，而是在数字钱包中验证用户身份、确认交易信息并进行支付的方式，即没有网络也能付款。\n本题为选非题，故正确答案为D。","no":19,"missingImage":false},{"type":"question","qid":"3523519","cat":"科技常识","stem":"下列根据特性规律组合而成的对应关系，错误的是：","options":{"A":"蜘蛛——昆虫——节肢动物","B":"花生——双子叶植物——被子植物","C":"乳腺——鸭嘴兽——哺乳动物","D":"种子——松树——裸子植物"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，蜘蛛不是昆虫，昆虫的基本特征是体躯分为头部、胸部、腹部三段，一对触角，一般有两对翅，三对足。昆虫属于节肢动物门昆虫纲，蜘蛛是节肢动物门、蛛形纲、蜘蛛目所有种的通称。\nB项正确，花生又名落花生、双子叶植物，叶脉为网状脉，种子有花生果皮包被。花生是被子植物，被子植物的主要特点是种子外有果皮包被。花生有根、茎、叶、花、果实和种子六大器官，种子外有果皮包被着。\nC项正确，鸭嘴兽是最原始的哺乳动物之一，它是未完全进化的哺乳动物，种类极少，同属之中只有鸭嘴兽一种动物，也是最低等的哺乳动物之一。鸭嘴兽的雌兽体内有乳腺，能分泌乳汁哺育幼兽。\nD项正确，松树是裸子植物。裸子植物的种子是暴露在空气中的。\n本题为选非题，故正确答案为A。","no":20,"missingImage":false}],"count":19,"answerable":19,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"3522654","cat":"逻辑填空","stem":"区块链的诸多特征使其成为一项备受期待的革命性技术，而目前这一技术的应用潜能还远未被完全开发。今天我们看到的区块链技术在金融、物流、医疗、保险等领域的应用，仅是             般的一瞥所见，尚有许多应用正在被尝试、推广。\n填入画横线部分最恰当的一项是：","options":{"A":"浮光掠影","B":"走马观花","C":"蜻蜓点水","D":"浅尝辄止"},"answer":"A","explanation":"根据“仅是······般的一瞥所见，尚有许多应用正在被尝试、推广”可知，文段要体现的是区块链现在所涉及的应用领域仅是我们观察到的一部分，还有正在发掘的领域，且横线要与“一瞥所见”构成对应，体现出我们一眼看到这些领域后得到的印象。A项“浮光掠影”比喻观察不细致，得到的只是事物的一些表面现象，侧重观察的结果是印象不深刻，符合文意，当选。\nB项“走马观花”比喻匆忙地不深入细致地观察事物，侧重于观察的过程很粗略，横线处对应看到的结果，而非看这些领域的过程，与文意不符，排除。C项“蜻蜓点水”比喻浮浅地接触，浮皮潦草，很不深入地做事，侧重做事情不深入，D项“浅尝辄止”比喻不往深处研究，不深入钻研，侧重于做事情不深入钻研，文段体现的是我们今天看到的区块链，强调的是“看”的结果，并非强调“做事”，均与文意不符，排除。\n故正确答案为A。\n【文段出处】《挖掘区块链商机 美国在行动》","no":21,"missingImage":false},{"type":"question","qid":"3522656","cat":"逻辑填空","stem":"教育，最终都是为了促进人的全面发展，帮助下一代提高生存能力。批评惩戒和赏识鼓励是            的两种方式，有些时候，“当头棒喝”甚至比温言软语更有效果。\n填入画横线部分最恰当的一项是：","options":{"A":"如影随形","B":"并行不悖","C":"各有所长","D":"不可或缺"},"answer":"B","explanation":"根据后文“有些时候，‘当头棒喝’甚至比温言软语更有效果”可知，横线处应表示，两种方式都有效果，并不存在“当头棒喝”就效果不好之意。B项“并行不悖”指同时进行，互相不违背，可体现出两种方式虽看似完全相反，但都可以起到教育作用之意，符合文意，当选。\nA项“如影随形”指好像影子总是跟着身体一样。比喻两个事物关系密切或两个人关系密切不能分离。“批评惩戒”与“赏识鼓励”并非如影随形，往往是单一出现，排除；\nC项“各有所长”指各有各的长处、优点，一般多指人才而言，且该词一般用于表示大家都有自己的优势，不相上下，与后文文意不符，排除；\nD项“不可或缺”表示非常重要，不能有一点缺失，文段并未体现出两种方式都不能少之意，与前后文语境不符，排除。\n故正确答案为B。\n【文段出处】《缺乏“棒喝”的教育有缺陷》","no":22,"missingImage":false},{"type":"question","qid":"3522671","cat":"逻辑填空","stem":"几乎所有成年人都只能使用左脑处理语句。但对儿童而言，任何一个大脑半球的损伤都不太可能影响语言学习，这说明在早期阶段人脑的两个半球都具有这种能力。美国乔治敦大学神经学家指出，这为神经损伤提供了一种        机制。例如，如果左半球受到围产期中风的        ，新生儿将使用右半球学习语言。\n依次填入画横线部分最恰当的一项是：","options":{"A":"赔偿 祸害","B":"补偿 损害","C":"补充 损失","D":"填充 毁坏"},"answer":"B","explanation":"第一空，搭配“机制”，体现早期阶段人脑的两个半球对于“神经损伤”的功用，结合横线后的例子可知，当新生儿大脑左半球遭受中风时，右半球可以有效补位，以减少对语言学习的影响。B项“补偿”指补足，用以抵消损失、消耗等，C项“补充”指原来不足或有损失时，增加一部分，二者均符合语境，保留。A项“赔偿”指由于自己的行动而使他人蒙受损失从而给予补偿，新生儿的这一机制是对自身神经损伤的补偿，而非他人，不符合文意，排除；D项“填充”多指对某个空间的填补，与文段语境不符，排除。\n第二空，搭配“中风”，体现中风对大脑左半球的伤害。B项“损害”指使事业、利益、健康、名誉等蒙受损失，与“中风”搭配得当，当选。C项“损失”指没有代价地消耗或失去，多与“金钱”“产品”等具象化事物搭配，与“中风”搭配不当，排除。\n故正确答案为B。\n【文段出处】《研究显示：儿童同时使用左右半脑进行语言学习》","no":23,"missingImage":false},{"type":"question","qid":"3523507","cat":"逻辑填空","stem":"我国有很庞大的老年群体，但他们却因为科技的发展，在生活中有很多地方            。不是他们            ，不想接触新事物，而是一辈子的习惯，不是说改就能改的。\n依次填入画横线部分最恰当的一项是：","options":{"A":"寸步难行 墨守成规","B":"步履艰难 画地为牢","C":"艰难跋涉 抱残守缺","D":"举步维艰 固步自封"},"answer":"D","explanation":"第一空，根据文意可知，老年人在科技发展的背景下，生活中会面临很多不便，因此横线处应表示老年人在很多地方不是很方便。B项“步履艰难”指行走困难、行动不方便，D项“举步维艰”指迈步艰难，比喻办事情每向前进行一步都十分不容易，均符合文意，保留。A项“寸步难行”指连一步都难以进行，形容走路、行动困难，比喻开展某项工作困难重重，用于此处程度过重，排除；C项“艰难跋涉”强调路程很艰苦，或者事业方面很艰辛，体现不出老年群体的不方便，排除。 \n第二空，根据后文“不想接触新事物”可知，横线处应体现古板、不肯接受新鲜事物之意。D项“固步自封”形容保守，安于现状，不求改进，符合文意，当选。B项“画地为牢”比喻只许在指定的范围内活动，表意与是否保守、不接受新事物无关，排除。\n故正确答案为D。\n【文段出处】《边亚峰：交医保拒收人民币是一种违法犯罪》","no":24,"missingImage":false},{"type":"question","qid":"3523498","cat":"逻辑填空","stem":"从长远看，电影产业的发展必然要拥抱网络平台，但是院线依然具有            的优势，观影社交仪式感、巨幕、3D沉浸式体验以及高度还原的环绕立体声，这些都是网上观影所不具备的，影院和互联网带来的始终是两种            的观影体验。\n依次填入画横线部分最恰当的一项是：","options":{"A":"遥遥领先 大相径庭","B":"独一无二 背道而驰","C":"不可替代 截然不同","D":"无与伦比 各有所长"},"answer":"C","explanation":"第一空，根据后文“观影社交仪式感······这些都是网上观影所不具备的”可知，横线处应体现院线的这些特点是网上观影所没有的，B项“独一无二”形容唯一的，没有与之相同的，C项“不可替代”指某人或某物是不能够用他人或他物来进行代替的，均符合文意，保留。A项“遥遥领先”指远远地走在最前面，强调比别人快，与文意不符，排除；D项“无与伦比”指事物非常完美，没有能跟他相比的，文段并未说明院线的这些特征是最好的，语义程度过重，排除。\n第二空，形容影院和互联网所带来的观影体验，根据前文可知，影院和互联网所带来的观影体验应该是不同的，C项“截然不同”形容两种事物没有一点共同之处，符合文意，当选。B项“背道而驰”指背离正确的目标，朝相反的方向走，文段并未强调偏离正道，与文意不符，排除。\n故正确答案为C。\n【文段出处】《&lt;囧妈&gt;等新片临时变阵 院线电影有了发行新模式》","no":25,"missingImage":false},{"type":"question","qid":"3522591","cat":"逻辑填空","stem":"国无德不兴，人无德不立。如果一个民族、一个国家没有共同的核心价值观，            ，行无依归，那这个民族、这个国家就无法前进。这样的情形，在我国历史上，在当今世界上，都            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"莫衷一是  屡见不鲜","B":"自以为是  数不胜数","C":"各行其是  不一而足","D":"积非成是  层出不穷"},"answer":"A","explanation":"第一空，根据横线前“没有共同的核心价值观”和后文“行无依归”可知，填入横线处的成语强调没有统一的思想作支撑。A项“莫衷一是”指各有各的意见，不能得出一致的结论，置于此处能够体现出思想不统一，符合文意，保留。B项“自以为是”形容认为自己的看法和做法都正确，不接受别人的意见，侧重强调认为自己是正确的，与文意无关，排除；C项“各行其是”形容按照各自认为对的去做，比喻各搞一套，侧重强调做法，与文意无关，排除；D项“积非成是”指长期所形成的错误，往往被当作正确的，与文意无关，排除。\n第二空，代入验证，根据前文“这样的情形，在我国历史上，在当今世界上”可知，填入横线处的成语表达这样的情形很常见。A项“屡见不鲜”意思是常常见到，并不新奇，符合文意，当选。\n故正确答案为A。\n【文段出处】《习近平：青年要自觉践行社会主义核心价值观——在北京大学师生座谈会上的讲话》","no":26,"missingImage":false},{"type":"question","qid":"3522596","cat":"逻辑填空","stem":"学术研究是一项严谨缜密的科学工作，            是其研究的前提基础。学术不求真便会没有标准，当真正的学术研究被        、舆论炒作成为风气之时，便意味着学术低谷的到来。\n依次填入画横线部分最恰当的一项是：","options":{"A":"实事求是 放弃","B":"有的放矢 遗忘","C":"去伪存真 冷落","D":"推陈出新 忽视"},"answer":"C","explanation":"第一空，根据文段“学术研究是一项严谨缜密的科学工作”“学术不求真便会没有标准”可知，横线处体现的是学术研究要严谨缜密、要求真，A项“实事求是”指从实际情况出发，C项“去伪存真”意思是除掉虚假的，留下真实的，均符合文意，保留。B项“有的放矢”比喻说话做事有针对性，文段未体现针对性，排除；D项“推陈出新”指去掉旧事物的糟粕，取其精华，并使它向新的方向发展，与文意不符，排除。\n第二空，根据后文“便意味着学术低谷的到来”可知，横线处词语程度较轻，C项“冷落”形容受到冷淡的待遇，置于此处程度较轻，符合文意，当选。A项“放弃”搭配“学术研究”，程度过重，排除。\n故正确答案为C。\n【文段出处】《造假与炒作的背后》","no":27,"missingImage":false},{"type":"question","qid":"3522599","cat":"逻辑填空","stem":"电视在家庭中基本可以保证固定的开机时长，这就给电视广告提供了足够大的“曝光”空间，不仅可以提高受众的          ，同时更容易在家庭成员之间产生共鸣，无形之中增强广告的        效果。\n依次填入画横线部分最恰当的一项是：","options":{"A":"积极性 营销","B":"多样化 吸引","C":"保有量 交互","D":"覆盖量 传播"},"answer":"D","explanation":"第一空，根据横线前“给电视广告提供了足够大的‘曝光’空间”以及“提高”可知，横线处应体现受众的数量有所提高之意。C项“保有量”指拥有的数量，D项“覆盖量”指在一定程度之内的数量，均符合文意，保留；A项“积极性”指进取向上的思想和表现，多搭配工作，文段未体现思想及表现，排除；B项“多样化”指种类多种多样，文段未提及种类，排除。\n第二空，搭配“广告”，根据“在家庭成员之间产生共鸣”可知，广告起到了传递信息的宣传作用，横线处应体现广告的宣传作用被增强之意。D项“传播”指广泛散布、信息传递，符合文意，当选；C项“交互”指相互联系交流，多用于人机交互，与广告搭配不当，排除。\n故正确答案为D。\n【文段出处】《互联网的下半场，电视产业的风口在哪里》","no":28,"missingImage":false},{"type":"question","qid":"3522604","cat":"逻辑填空","stem":"节约资源、减少垃圾生产成为某种意义上的公共事务，很容易遭遇“搭便车困境”——人人都想            ，最终会导致公共事务乏人问津。节约资源的功效并没有那么            ，需要人们久久为功；付出没有得到及时、有效的反馈与回报，难免会影响公众参与。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蜂拥而上 妙手回春","B":"鸠占鹊巢 神通广大","C":"据为己有 一劳永逸","D":"坐享其成 立竿见影"},"answer":"D","explanation":"第一空，由破折号可知，所填词语是对“搭便车困境”的解释说明。“搭便车”本义为自己不想开车，所以乘坐他人的便车；引申义为，自己不想付出努力而去享受他人带来的便利。D项“坐享其成”指的是自己不出力，而享受别人取得的成果，符合文意，保留。A项“蜂拥而上”指的是许多人一起涌上来，未体现出自己不出力，享受他人成果之意，不符合文意，排除；B项“鸠占鹊巢”指的是强占别人的房屋、土地、产业等，C项“据为己有”指的是占据为自己所拥有，“搭便车”并非强调占据别人的东西归自己所有，均与文意不符，排除。\n第二空，代入验证，根据“并没有······需要······”可知，横线处与后文“久久为功”语义相反，体现“时间短”之意。D项“立竿见影”指见效快，符合文意，当选。\n故正确答案为D。\n【文段出处】《“零浪费”用更深刻的环保观念拥抱美好生活》","no":29,"missingImage":false},{"type":"question","qid":"3522605","cat":"逻辑填空","stem":"世界上的一万多种鸟，其实各有各的美丽，从各种华丽的羽毛，到鸟喙的形状，到鸣唱的声音，不能不让我们        生物多样性的神奇。进化论之父达尔文在加拉帕戈斯群岛上通过观察当地鸟类发现，虽然这些鸟类很明显长得很相似，有着共同的祖先，但是它们的鸟喙形状却            。\n依次填入画横线部分最恰当的一项是:","options":{"A":"惊叹 大相径庭","B":"惊奇 毫无二致","C":"探索 云泥之别","D":"追寻 异曲同工"},"answer":"A","explanation":"本题可从第二空入手，横线前出现转折关联词“却”可知前后语义相反，横线前“鸟类很明显长得很相似，有着共同的祖先”体现“相似、一样”的含义，因此横线处应体现“不一样、不同”之意。A项“大相径庭”比喻相差很远，大不相同，符合文意，保留。B项“毫无二致”形容完全一样，D项“异曲同工”比喻一件事情的做法不同而都巧妙地达到目的，均与文意相悖，排除；C项“云泥之别”比喻地位的高下相差极大，文段并非论述地位的高下，仅在论述形状的不同，与文意不符，排除。\n第一空，代入验证，A项“惊叹”指惊奇赞叹，表达对生物多样性的赞美，感情色彩积极，符合文段语境，当选。\n故正确答案为A。\n【文段出处】《热带雨林中的鸟类和深海中的蠕虫，我们该保护哪个？》","no":30,"missingImage":false},{"type":"question","qid":"3522570","cat":"逻辑填空","stem":"量子计算将极大促进当前人工智能及其应用的发展，深刻地        包括基础教育在内的众多领域。特别是，借助于量子计算技术，人类对于微观世界的认识以及宏观世界的探索将得到极大扩展，从而引发人类思维能力的          提升。\n依次填入画横线部分最恰当的一项是：","options":{"A":"融合 战略性","B":"改变 根本性","C":"解决 突破性","D":"支持 阶段性"},"answer":"B","explanation":"第一空，搭配“领域”，“领域”指特定的范围或区域，B项“改变”指事物变得和原来不一样，与“领域”搭配恰当，保留。A项“融合”指融为一体，文中并无众多领域融为整体之意，不符合文意，排除；C项“解决”指处理使有结果，D项“支持”指支撑、赞同或鼓励，均与“领域”搭配不当，排除。\n第二空，代入验证。搭配“提升”，B项“根本性”意在强调基础或本质，根据文意可知，人类对世界的认识发生了本质上的改变，搭配恰当，符合文意，当选。\n故正确答案为B。\n【文段出处】《量子科技为何成为多国战略布局的重点领域》","no":31,"missingImage":false},{"type":"question","qid":"3522577","cat":"逻辑填空","stem":"原创是作品的生命力之源，抄袭无异于            。影视行业想要成为常青树，优质的原创作品是根基。如果任由抄袭之风盛行，        抄袭作者活跃在屏幕上，将        从业者的生存环境，消耗整个行业的未来前景。\n依次填入画横线部分最恰当的一项是：","options":{"A":"自相残杀 放纵 剥蚀","B":"自掘坟墓 纵容 腐蚀","C":"自投罗网 放任 消蚀","D":"自欺欺人 容许 磨蚀"},"answer":"B","explanation":"第一空，根据横线前的“无异于”可知，横线处所填词语是对前文的解释说明。由“原创是作品的生命力之源”可知，抄袭则会让作品失去生命。B项“自掘坟墓”是指自己的所作所为就像在替自己挖掘坟墓一样，比喻自寻死路，符合文意，保留。C项“自投罗网”指自己投到罗网里去，比喻自己送死，也可以体现让作品失去生命，保留。A项“自相残杀”指自己人互相杀害，文段未提及互相杀害，排除。D项“自欺欺人”指欺骗自己，也欺骗别人，文段未提及欺骗自己和欺骗别人，与文意无关，排除。\n第二空，根据横线前的“任由抄袭之风盛行”可知，横线处表示对抄袭作者不加约束，任由其发展，B项“纵容”指对错误行为不加制止、任其发展，C项“放任”指听其自然，不加约束或干涉，两项均符合文意，保留。\n第三空，搭配“生存环境”，根据横线后的“消耗整个行业的未来前景”可知，对抄袭不加约束会产生不好的结果，从业者的生存环境会遭到破坏，B项“腐蚀”比喻坏的思想或环境，使人逐渐变质堕落，与“生存环境”搭配恰当且符合文意，当选。C项“消蚀”意为消耗、消损，多指由于风或者其他气候因素所致的侵蚀而使地面降低，和题干中的“生存环境”搭配不当，排除。\n故正确答案为B。\n【文段出处】人民资讯《影视圈的抄袭之风，怎么破？》","no":32,"missingImage":false},{"type":"question","qid":"3522582","cat":"逻辑填空","stem":"2020年是紫禁城建成600年，也是故宫博物院成立95周年。紫禁城作为明清两代皇宫，它是中华民族宝贵的传统文化        ，也是著名的世界文化遗产。它不仅拥有中国古代最        的宫殿建筑群，还拥有一百八十余万件珍贵文物和大量的文献档案，承载着丰富的历史信息和文化印记，是中华民族记忆传统、        文脉、增强文化自信的重要资源。\n依次填入画横线部分最恰当的一项是：","options":{"A":"财产 巨大 继承","B":"产业 庞大 延续","C":"遗产 宏伟 传承","D":"象征 丰富 接续"},"answer":"C","explanation":"第一空，横线处所填词语要形容“紫禁城”，且需要搭配“传统文化”，C项“遗产”泛指历史上遗留下来的精神财富或物质财富，由“紫禁城建成600年”可知，它是历史遗留的宝贵财富，符合文意，且“遗产”与“传统文化”搭配得当，保留。A项“财产”指拥有的金钱、物资、房屋、土地等物质财富，与“传统文化”搭配不当，排除；B项“产业”可以指私有财产，如土地、房屋、工厂等，也可以指现代工业生产行业，“紫禁城”并非私有财产，也不是具体生产行业，排除；D项“象征”指能用来暗示特定的人、物或事理的具体的东西，如“白色是纯洁的象征”，而文段不存在这种暗示关系，排除。\n第二空，代入验证，横线处所填词语搭配“宫殿建筑群”，C项“宏伟”表示宏大雄伟，多与“建筑”类搭配，用于此处搭配得当，保留。\n第三空，代入验证，横线处所填词语搭配“文脉”，C项“传承”表示传授和继承，搭配得当，符合文意，当选。\n故正确答案为C。\n【文段出处】《600年的记忆：紫禁城历史上的几个关键词》","no":33,"missingImage":false},{"type":"question","qid":"3522589","cat":"逻辑填空","stem":"大多数群居的哺乳动物，雌性个体怀孕生育后，随着后代迅速        ，它们也会很快        原有的社会地位。然而在人类的大部分历史中，生育和照顾幼儿几乎是女性壮年时期的全职工作。有研究认为，人类婴儿的          ，让人类与母亲的关系与一般的动物相比更加紧密。\n依次填入画横线部分最恰当的一项是：","options":{"A":"成熟 改变 重要性","B":"分离 恢复 可塑性","C":"长大 获得 依附性","D":"独立 回归 脆弱性"},"answer":"D","explanation":"第一空，根据前后文可知，横线处应体现后代迅速成长之意，A项“成熟”、C项“长大”、D项“独立”均符合文意，保留。B项“分离”与“群居”矛盾，排除。\n第二空，通过转折词“然而”指出人类照顾幼儿是全职工作，可知“雌性哺乳动物”不是“全职”，“会很快回到‘原有的社会地位’”，D项“回归”符合文意，保留。A项“改变”、C项“获得”均未体现“会很快回到‘原有的社会地位’”之意，排除。\n第三空，代入验证，文段将动物的幼崽和人类的婴儿进行对比，其结果体现了人类婴儿的“脆弱性”，符合文意，D项当选。\n故正确答案为D。\n【文段出处】知识分子《站起来，双足走 | 36个月》","no":34,"missingImage":false},{"type":"question","qid":"3522595","cat":"逻辑填空","stem":"糖对健康有危害已经            ，大家也能很好地理解和接受“少糖”这一健康饮食的基本原则。但是人类对甜味的喜好是            的，“健康少糖”和“享受甜味”对于很多人来说是很        的选择。甜味剂的出现，为人们提供了二者兼得的可行选择。\n依次填入画横线部分最恰当的一项是：","options":{"A":"毋庸置疑 刻骨铭心 无奈","B":"深入人心 与生俱来 艰难","C":"显而易见 积重难返 被动","D":"妇孺皆知 根深蒂固 痛苦"},"answer":"B","explanation":"本题从第二空入手。横线处搭配“喜好”，且根据文意可知，横线处表达人类对甜味的喜好一直都有且很深刻。B项“与生俱来”指一出生就拥有的特性或行为，置于此处搭配恰当且符合文意，保留。A项“刻骨铭心”形容留下的印象极其深刻，永远忘不了，侧重将某物或某事“牢记于心”，与“喜好”搭配不当，排除；C项“积重难返”指积习深重，不易改变，常搭配“恶习”“弊端”，D项“根深蒂固”比喻基础稳固，不容易动摇，常搭配“思想”“观念”“主义”，均与“喜好”搭配不当，排除。\n第一空，代入验证，B项“深入人心”指理论、学说、政策等为人们深切了解和信服，填入横线处能体现出大家已理解和接受糖对健康的危害，符合文意，保留。\n第三空，代入验证，根据文意可知，很多人面对“健康少糖”和“享受甜味”时难以选择，B项“艰难”置于此处能体现出人们纠结、难以抉择的心理，符合文意，当选。\n故正确答案为B。\n【文段出处】《一种食品为什么要多种甜味剂？你最常听到的猜测都是错的》","no":35,"missingImage":false},{"type":"question","qid":"3523505","cat":"片段阅读","stem":"酸奶是以牛乳为原料，经灭菌、冷却、接种和发酵而制成，除保留了鲜牛奶的全部营养成分外，在发酵过程中还可产生人体所必需的多种维生素，同时钙含量比较高，且易被人体吸收；酸奶经发酵会产生酸性物质，可以促进肠胃蠕动，调节肠道微生态，进而促进消化和吸收，提高食欲，缓解便秘，促进排便，提高免疫力。\n这段文字没有谈到的是：","options":{"A":"酸奶的起源","B":"酸奶的成分","C":"酸奶的益处","D":"酸奶的制作"},"answer":"A","explanation":"A项，文段没有涉及酸奶的起源，表述错误，当选；\nB项，根据“除保留了鲜牛奶的全部营养成分外，在发酵过程中还可产生人体所必需的多种维生素，同时钙含量比较高”可知，文段介绍了酸奶的成分，表述正确，排除；\nC项，根据“易被人体吸收”“酸奶经发酵会产生酸性物质，可以促进肠胃蠕动，调节肠道微生态，进而促进消化和吸收，提高食欲，缓解便秘，促进排便，提高免疫力”可知，文段介绍了酸奶的益处，表述正确，排除；\nD项，根据“酸奶是以牛乳为原料，经灭菌、冷却、接种和发酵而制成”可知，文段介绍了酸奶的制作，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】《老人喝酸奶好还是牛奶好？》","no":36,"missingImage":false},{"type":"question","qid":"3522580","cat":"片段阅读","stem":"资本天然是逐利的，本身并没有好坏之分。有序、合规的资本扩张，对于促进中国经济高质量发展具有重要意义，也是政策面所持续支持推动的。资本扩张有利于串联起产业链上下游企业，然而也带来了严峻的垄断问题。实际上，在这些行业融合、产业链整合的背后，是数字要素与传统生产要素的结合，根本上的要素垄断规律并没有改变，占据要素优势的企业仍然会获得垄断地位。而垄断将严重影响市场经济的竞争机制，降低市场效率，侵犯消费者权益，同时还会阻碍行业整体的创新进步，挫伤其他小微企业的积极性。\n接下来作者最有可能讲的是：","options":{"A":"需要遏制资本的进一步扩张","B":"加强对数字经济的立法管理","C":"对数字经济中的资本扩张的监管","D":"反垄断监管对保障经济发展的重要性"},"answer":"C","explanation":"文段首先引出“资本扩张”的话题并指出其作用，随后通过转折指出其会带来垄断的问题。接下来阐述数字要素与传统生产要素的结合，占据要素优势的企业会获得垄断地位，尾句进一步论述资本扩张导致的垄断所带来的问题与危害。所以接下来应该根据文段的问题提出对策，即应对资本扩张进行监管，防止资本扩张导致的垄断问题，对应C项。\nA项，“遏制资本的进一步扩张”表述不明确，排除；\nB项，未提及“资本扩张”这一话题，且文段并没有提到“立法”，排除；\nD项，强调的是反垄断监管的作用，但文段中强调的是资本扩张带来的垄断问题，且该项未提及“资本扩张”这一核心话题，排除。\n故正确答案为C。\n【文段出处】《数字经济时代的反垄断，重点在于对资本扩张的监管》","no":37,"missingImage":false},{"type":"question","qid":"3522584","cat":"片段阅读","stem":"2020年12月，德尔黑和三位同事在《当代生物学》上发表了文章，他们认为葛洛格将温度和湿度混为一谈了。潮湿的环境使植物生长茂盛，这为动物躲避捕食者提供了荫蔽。因此，动物在潮湿的地方往往颜色更深，以伪装自己。德尔黑说，许多温暖的地方是潮湿的，但潮湿又凉爽的森林也是有的，比如塔斯马尼亚的森林，那里也有最黑的鸟类。\n从这段文字可推断出：","options":{"A":"德尔黑的观点，动物的颜色在温度低的地方会是浅色的","B":"葛洛格的观点，温暖而潮湿的地区，鸟的羽毛颜色会是深色的","C":"葛洛格的观点，阳光充足的赤道地区，鸟的羽毛颜色会是深色的","D":"德尔黑的观点，阳光充足的赤道地区，鸟的羽毛颜色会是浅色的"},"answer":"C","explanation":"根据文段“2020年12月，德尔黑和三位同事在······以伪装自己”可知，德尔黑认为动物颜色深和湿度有关，德尔黑认为葛洛格将温度和湿度混为一谈，因此葛洛格认为动物颜色深和温度有关。由“德尔黑说，许多温暖的地方是潮湿的，但潮湿又凉爽的森林也是有的······最黑的鸟类”进一步确定，德尔黑认为动物颜色深和温度无关，与湿度相关。\nA项，与文段最后一句话德尔黑的观点相悖，排除；\nB项，文段中提到葛洛格将温度与湿度混为一谈，选项提到”温暖而潮湿“体现二者有区别，不符合葛洛格的观点，排除；\nC项，“阳光充足的赤道地区”代表温度高，符合葛洛格的观点，当选；\nD项，“阳光充足的赤道地区”没有提到湿度，和德尔黑的观点无关，排除。\n故正确答案为C。\n【文段出处】《&lt;科学&gt;：全球气候变暖会让动物颜色变深还是变浅？》","no":38,"missingImage":false},{"type":"question","qid":"3523491","cat":"片段阅读","stem":"传承弘扬传统民间艺术的深刻精神内涵，民间艺术能否带来经济效益也成为了至关重要的考量因素。越来越多的年轻人选择放弃手工技艺，离开村庄谋生。对于大多数普通艺人，传承和保护民间文化只是一个概念，维持基本生活需求和追求家庭收入最大化仍然是最先考虑的因素。传承文化和提高收入的矛盾始终贯穿于民间艺人的文化自觉过程之中。对于民间艺人，作为“理性人”去追求收入最大化无可厚非，而作为民间文艺工作者，我们需要思考的是如何在保证民间艺人基本生活和物质需要的基础上，提升民间艺人的文化自觉意识，真正让民间艺人扎得住根、沉得下心。\n这段文字意在强调：","options":{"A":"激发民间艺人的文化自觉意识","B":"经济效益影响民间艺术的传承","C":"提高民间艺人的经济收入","D":"民间艺术传承的断代危机"},"answer":"A","explanation":"文段开篇论述经济效益对于传承弘扬传统民间艺术很重要，接着通过很多年轻人放弃手工技艺，外出谋生的情况说明在民间艺人的文化自觉过程中始终存在着传承文化和提高收入的矛盾。后文通过“需要”针对上述矛盾提出对策，论述民间文艺工作者要在保证民间艺人物质生活的基础上提升民间艺人的文化自觉意识，故文段重点强调提升民间艺人的文化自觉意识，对应A项。\nB、C两项，分别强调“经济效益”和“经济收入”，均未提及文段主题词“文化自觉”，排除；\nD项，“断代危机”文段未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】《以人民为中心繁荣发展社会主义民间文艺》","no":39,"missingImage":false},{"type":"question","qid":"3522594","cat":"片段阅读","stem":"人体严密的免疫防御系统，会在细菌入侵时引起炎症反应，白细胞和大量“防御斗士”对病原体展开攻击。防御的一方通常会胜利，理论上讲，“刺激”消除后，炎症反应会逐渐消失，组织回到正常状态。但在某些特定情况下，炎症依然会持续，这种低度炎症不像通常的炎症那样可以明显感觉到它的存在，其更像人体内未被完全熄灭的“火苗”。机体通过炎症反应抵抗病原体的过程，保障了人类的生存，但是科学家发现，这种低度炎症会缩短生命，促进许多年龄相关性症状，如认知衰退、神经变性、动脉粥样硬化等。不过，引起和维持这些变化的机制，目前尚不能明确。\n这段文字主要介绍：","options":{"A":"人体免疫系统的防御机制","B":"低度炎症的发生机制与影响","C":"细菌对人类生存的影响","D":"年龄相关性症状的研究现状"},"answer":"B","explanation":"文段开篇介绍人体的免疫系统会在细菌入侵时引起炎症反应，理论上讲，“刺激”消除后，炎症反应会逐渐消失，组织回到正常状态，接着通过转折词“但”引出特定情况下这种低度炎症会持续存在。随后解释了低度炎症的产生原理以及其好、坏两方面影响。故文段主要围绕“低度炎症”展开，从低度炎症的产生原理和对人类的影响两个方面进行阐述，对应B项。\nA项，文段主要论述的核心话题为“低度炎症”，“人体免疫系统”范围扩大，排除；\nC项，仅对应文段首句内容，非重点，排除；\nD项，论述的是“年龄相关性症状的研究现状”，但文段论述的核心话题是“低度炎症”，排除。\n故正确答案为B。\n【文段出处】《增强巨噬细胞代谢能缓解认知衰退》","no":40,"missingImage":false},{"type":"question","qid":"3522576","cat":"片段阅读","stem":"从绘画类别上看，人物画发展最早，涵盖内容也最为广阔。从人物画的演进层次来看，先是由鬼神而至人间，其目的在于“用”；然后由丹青而趋水墨，其演变则在于“艺”。汉代人物画都与灵魂鬼神有关，宗教意识浓厚，艺术追求的意义不太明显，都应归于“用”之范畴；东晋顾恺之等人的绘画开始脱离“用”的范畴，转而追求艺术的本旨。唐代张彦远在《历代名画记》中说“夫画者，成教化，助人伦，穷神变，测幽微，与六籍同功”，说的正是前一半；“近于艺”的后半段，实际是从唐宋时期才开始的。\n下列说法与原文相符的是：","options":{"A":"汉代人物画基本以实用为目的","B":"张彦远对东晋人物画评价不高","C":"顾恺之带来了绘画工具的革新","D":"唐代人物画比汉代更具写实性"},"answer":"A","explanation":"A项，根据“汉代人物画都与灵魂鬼神有关······都应归于‘用’之范畴”可知，汉代人物画以实用为目的，表述正确，当选；\nB项，根据“唐代张彦远在《历代名画记》中说······说的正是前一半”可知，张彦远论述的是画的作用，而非对人物画水平高低的评价，无中生有，排除；\nC项，根据“东晋顾恺之等人的绘画开始脱离‘用’的范畴，转而追求艺术的本旨”可知，带来的不是“绘画工具”的革新，偷换概念，排除；\nD项，文段并没有涉及到唐代人物画与汉代人物画的比较，无关比较，排除。\n故正确答案为A。","no":41,"missingImage":false},{"type":"question","qid":"3522590","cat":"片段阅读","stem":"当前，“云观展”成为一种热潮。虽然线上展览已普遍拥有极度高清的分辨率，但仍有不少观众希望欣赏实物。这不仅是为了欣赏展品的结构和色彩，更是为了感受每个纹路中所体现的技法与质感，而这些仅仅通过图像是很难传递给观众的。除展品本身外，展览中的墙壁、地毯的质地、颜色，展厅中的光线甚至气味，展品之间实际的大小与尺寸比例，都是构建观众对展览认知的重要框架，是线上彼此割裂的单幅展品或虚拟观展体验所无法实现的。\n这段文字意在说明：","options":{"A":"线下展览仍具有难以替代的优势","B":"观众对观展体验的要求越来越高","C":"“云观展”与线下观展的比较分析","D":"构建观众对展览的认知框架很重要"},"answer":"A","explanation":"文段开篇引出背景，即“云观展”成为一种热潮，紧接着通过转折关联词“但”指出，仍有不少观众希望欣赏实物，接着从展品本身以及展览环境两个方面具体阐述了线上展览无法替代线下展览的原因，故文段强调的重点为线上展览仍无法替代线下展览，对应A项。\nB项，“要求越来越高”文段并未提及，无中生有，排除；\nC项，“比较分析”对应后文解释说明部分的内容，非重点，排除；\nD项，“构建观众对展览的认知框架”对应文段尾句，为解释说明的内容，非重点，排除。\n故正确答案为A。\n【文段出处】《疫情结束后，“云观展”能否取代线下展览？》","no":42,"missingImage":false},{"type":"question","qid":"3522579","cat":"片段阅读","stem":"田山歌，是以表现稻作生产和水乡生活风情为内容的山歌形式，曾广泛流传于长江三角洲部分水稻耕作地区。田山歌与其说是歌，不如说是一种文化现象，它记录了历史文化、婚姻爱情、民情风俗，反映人文语言心理、宗教等大量内容，有着江南稻作文化区域民歌中独特的艺术价值和欣赏价值。田山歌的历史源头，一直可以追溯到新石器时代，当太湖流域开始有原始的栽培水稻农业时，整个江南就已经产生田山歌的原始形态。作为我国典型的稻作农业区，太湖流域的自然条件十分有利。因此，这种悠久的稻作文化传统，为当地人们创作、传承田山歌奠定了重要的基础。\n这段文字主要介绍的是：","options":{"A":"田山歌特有的艺术价值","B":"田山歌特殊的环境条件","C":"田山歌独特的创作手法","D":"田山歌深厚的文化底蕴"},"answer":"D","explanation":"文段开篇下定义，引出“田山歌”这一话题，接着指出田山歌是一种文化现象，有着江南稻作文化独特的艺术价值和欣赏价值，又介绍了田山歌的历史源头，太湖流域的自然条件有利于栽培水稻。最后，通过结论词“因此”对前文进行总结，论述了这种悠久的稻作文化传统为田山歌的创作和传承奠定了基础，强调了稻作文化传统对于田山歌的重要作用，对应D项。\nA项“艺术价值”，B项“环境条件”，C项“创作手法”均对应尾句之前分述部分的内容，非文段重点，排除。\n故正确答案为D。\n【文段出处】《从松江“田山歌” 看如何保留传统音乐的生存土壤》","no":43,"missingImage":false},{"type":"question","qid":"3522583","cat":"片段阅读","stem":"做好群众工作，加强和创新社会治理，既要用好“老办法”，也要掌握“新办法”，走好网上群众路线。群众需求什么、期待什么，社会治理就应该重点关注什么。要了解群众的需求和期待，最基本的方法就是调查研究。调查研究是我们党一贯坚持的优良传统和群众工作的经验总结。用好这个“老办法”，当牢记基层是最好的课堂，群众是最好的老师。随着越来越多的群众通过互联网平台获取信息、表达诉求、提出建议、参与政治生活和社会治理，各级党政机关和领导干部也要掌握运用互联网，学会收集网络社情民意，了解网民所思所愿，积极回应网民的关切。\n根据这段文字，以下不属于“新办法”的是：","options":{"A":"把握网络舆情动向","B":"深入实地走访考察","C":"积极开展网络问政","D":"关注网民需求期待"},"answer":"B","explanation":"根据“也要掌握‘新办法’，走好网上群众路线”可知，“新办法”指“网上群众路线”。B项“深入实地走访考察”与“网上”无关，当选。\nA、C、D三项均与“网上群众路线”契合，且可与文段尾句“各级党政机关和领导干部也要掌握运用互联网，学会收集网络社情民意，了解网民所思所愿，积极回应网民的关切” 对应，故三项均为“新办法”，排除。\n本题为选非题，故正确答案为B。\n【文段出处】人民网《新论：创新方法推进基层社会治理》","no":44,"missingImage":false},{"type":"question","qid":"3523515","cat":"片段阅读","stem":"过去几十年我们主要依靠引进外国技术实现发展，短期看这不失为加快经济发展的捷径，从长期看只靠引进是不行的，它会使我们与国外的技术差距越拉越大，将我们长期锁定在产业分工格局的低端。关键核心技术是要不来、买不来、讨不来的。为此，要加快推进国家重大科技专项，深入推进知识创新和技术创新，增强原始创新、集成创新和引进消化吸收再创新能力。\n这段文字意在说明：","options":{"A":"我国要不断提高自主创新能力","B":"我国要逐步掌握关键核心技术","C":"我国要依靠技术推动经济发展","D":"我国要减少对国外技术的依赖"},"answer":"A","explanation":"文段开篇提出我国与国外的技术之间差距变大的问题，随后介绍“关键核心技术”靠引进是不行的，最后通过“为此”指代前文进行总结，并通过对策引导词“要”提出对策，即我国要深入推进创新，增强创新能力。故文段是分总结构，尾句为文段重点，核心话题为“创新”，对应A项。\nB项，缺乏主题词“创新”，且“核心技术”处在对策之前，非重点，排除。\nC项，缺乏主题词“创新”，且“依靠技术”对应文段开篇，非重点，排除。\nD项，缺乏主题词“创新”，如何“减少对国外技术的依赖”表述不明确，文段已表明要靠创新实现发展，排除。\n故正确答案为A。\n【文段出处】《产业链供应链自主可控 中国经济方能“气血充盈”》","no":45,"missingImage":false},{"type":"question","qid":"3522587","cat":"片段阅读","stem":"今年的寒冬，其实恰恰部分源于全球变暖，这种反常的现象，和一种极地涡旋的气候现象有关。极地涡旋是一种发生于极地、介于对流层和平流层的中上部、持续性长且规模大的气旋。最早记载极地涡旋现象的文献出现于1853年。在北半球的冬季，这种现象会导致突然性平流层暖化。1952年，无线电探空仪在海拔高度超过20公里的观测中发现了这种现象导致的平流层暖化。在2013年后的北美冬季，媒体报道中经常提到这种现象，使得该术语推广成为对极低温寒潮的解释。\n下列关于极地涡旋的表述正确的是：","options":{"A":"极地涡旋是全球气候变暖的“元凶”","B":"极地涡旋现象最早出现于1853年","C":"极地涡旋说明了极低温寒潮现象","D":"极地涡旋是一种反常的气候现象"},"answer":"C","explanation":"A项，根据“今年的寒冬，其实恰恰部分源于全球变暖，这种反常的现象，和一种极地涡旋的气候现象有关”可知，文段描述仅是有关，并未提及“元凶”，无中生有，排除；\nB项，根据“最早记载极地涡旋现象的文献出现于1853年”可知，文段介绍的是记载极地涡旋现象的文献最早出现的时间，并非“极地涡旋现象”最早出现的时间，偷换概念，排除；\nC项，根据 “媒体报道中经常提到这种现象，使得该术语推广成为对极低温寒潮的解释”可知，极地涡旋是对极低温寒潮现象的解释，表述正确，当选；\nD项，根据“今年的寒冬，其实恰恰部分源于全球变暖，这种反常的现象，和一种极地涡旋的气候现象有关”可知，反常的现象指的是寒冬，并非极地涡旋现象，偷换概念，排除。\n故正确答案为C。\n【文段出处】《这个冬天为什么这么冷》","no":46,"missingImage":false},{"type":"question","qid":"3522593","cat":"语句表达","stem":"①人们听音时，首先是要用耳朵去听而不是用仪器去测量，如何判断，依靠的就是人们的“音准感”\n②这种音准有着精确的物理意义，音是由物体的震动产生的，每个乐音震动的频率就是它的物理属性\n③另一种音准指的是人们对于音高的一种听力反应，严格来讲应该叫做“音准感”\n④而在音乐中使用的音并不是随意产生的，是人们在长期实践过程中挑选出来的\n⑤我们通常所说的音准，一般有两种含义\n⑥一种是音乐中的音高要遵循一定的规律，那就是音高的准确性，即音准\n请将上述语句重新排列，语序正确的是：","options":{"A":"⑤⑥④①③②","B":"①③②⑤⑥④","C":"①⑤⑥③②④","D":"⑤⑥②④③①"},"answer":"D","explanation":"根据选项判断首句，①句介绍人们听音时依靠的就是人们的“音准感”，⑤句最先引出“音准”，强调它有两种含义。对比之下⑤句更适合作首句，排除B、C两项。\n观察发现，②句出现指代词“这种”，指代对象为音准，且论述这种音准有着精确的物理意义，观察选项发现，②句之前分别为③句和⑥句，⑥句论述音准，介绍音高的准确性，⑥句和②句衔接很恰当，可以构成指代词捆绑，D项当选。③句论述音准感，介绍是人们对于音高的一种听力反应，与②中对“音准”精确性论述的话题无关，无法构成指代词捆绑，排除 A 项。\n故正确答案为D。\n【文段出处】《音乐有这些“神力”，你知道吗？》","no":47,"missingImage":false},{"type":"question","qid":"3522600","cat":"片段阅读","stem":"在半个世纪前撞上地球的巨大陨石内，科学家们发现了距今70亿年的星尘。这是地球上已知存在的最古老物质。这种古老的尘埃由比我们的太阳更古老的颗粒组成，通过垂死的恒星进入宇宙。这种尘埃最终借着1969年坠落于澳大利亚的默奇森陨石来到地球。这也是研究人员第一次在地球上的岩石中发现太阳前颗粒。在这项新的研究中，研究人员分析了来自默奇森陨石的颗粒。他们把颗粒碾碎后加入酸性物质，以溶解矿物和硅酸盐，从而仅留下太阳前颗粒。\n最适合做这段文字标题的是：","options":{"A":"太阳前颗粒的价值","B":"默奇森陨石的由来","C":"地球上最古老的物质","D":"陨石的科学研究价值"},"answer":"C","explanation":"文段首先指出在巨大陨石内发现了地球上已知存在的最古老物质，即星尘，接着通过指代词“这种尘埃”指代地球上已知存在的最古老物质星尘，指出其借助陨石来到地球，这也是研究人员第一次在地球上的岩石中发现太阳前颗粒，后文对这一研究进行详细论述，故文段重点围绕地球上最古老的物质来论述，对应C项。\nA项“价值”、D项“科学研究价值”文段均未论述，无中生有，排除；\nB项，“默奇森陨石”非重点，文段重在强调借助默奇森陨石来到地球的最古老物质，排除。\n故正确答案为C。\n【文段出处】《2020年十大科学新纪录》","no":48,"missingImage":false},{"type":"question","qid":"3523499","cat":"语句表达","stem":"2020年夏天无糖饮料火了，贴着无糖、低糖标签的饮料已经开始向饮料界传统“大咖”——可乐、酸梅汤、冰红茶等发起了挑战。据24小时连锁便利店便利蜂统计数据，7月饮料销售上涨\u003cimg data-k=\"2faa80ec365c\">，其中代糖水饮、高纯度果汁和中高端牛奶增速明显，毕竟在炎炎夏季，这些无糖、低糖饮料能让众多管不住嘴又怕发胖的人，在享受喝冰镇甜饮料过足嘴瘾的同时，心里又少了很多“罪恶感”，因此，\u003cu>                    \u003c/u>。\n填入画横线部分最恰当的一项是：","options":{"A":"无糖饮料并不如人们心目中所想的那么完美","B":"喝无糖饮料是不会对人体带来任何副作用的","C":"喝无糖饮料引起人体代谢的变化不是特别大","D":"在追求健康体型的人群中无糖饮料备受推崇"},"answer":"D","explanation":"横线在文段结尾，根据“因此“可知，是对前文内容进行概括总结。文段开头指出“无糖饮料火了”，即无糖饮料受到消费者的欢迎。然后通过连锁便利店便利蜂统计数据说明无糖、低糖饮料销售增加，接着通过“同时”引导的并列指出无糖、低糖饮料的两方面好处。D项“备受推崇”体现出无糖饮料因其优点受欢迎，与前文衔接恰当，当选。\nA项，“并不如人们心目中所想的那么完美”，文段没有说无糖饮料的不好，感情色彩与前文不符，排除；\nB项，“副作用”，前文未提及，且“任何”表述过于绝对，排除；\nC项，“人体代谢”前文未提及，与文段衔接不当，排除。\n故正确答案为D。\n【文段出处】《无糖饮料只是“看上去很美”》","no":49,"missingImage":false},{"type":"question","qid":"3522607","cat":"语句表达","stem":"农民卖粮舒心，源于市场之“手”用得好。2020年的夏粮生产，不仅数量增加，质量也在提升。一个重要指标就是专用麦比例高，全国优质强筋弱筋小麦面积占比\u003cimg data-k=\"6f4939f1fb4a\">，比上年提高2.8个百分点。从目前收购市场情况看，每斤优质小麦要比普通品种高出0.1元左右。这背后，\u003cu>                    \u003c/u>。如今，多元化市场主体入市收购，既让丰收粮有了更加多样化的销售渠道，也让优质粮食品种销路更好、价格更高，优粮优价成为种粮农民增收的“金钥匙”。\n填入画横线部分最恰当的一项是：","options":{"A":"说到底就是稳住这些农民的种粮收益，保护农民的种粮积极性","B":"正是粮食收储制度改革持续推进，市场机制作用得到更好发挥","C":"全国农户构成了粮食安全的坚强基石，稳住粮食生产的好形势","D":"通过优化供给体系，拓展粮食产加销增值空间，分享增值收益"},"answer":"B","explanation":"本题为语句填空题，横线在文段中间，需联系前后文把握话题的一致性。横线前首先指出农民粮食卖的好得益于市场，紧接着指出全国优质强筋弱筋小麦面积占比不断提高且价格也高于普通品种，横线后论述“多元化市场主体入市收购”使得优质粮食品种销路好、价格高，故横线处所填句子应体现优质粮食销路好、价格高的原因在于“市场”发挥作用，对应B项。\nA项，“稳住这些农民的种粮收益，保护农民的种粮积极性”，无法与后文“市场”衔接，排除；\nC项：“全国农户构成了粮食安全的坚强基石”强调农户的重要性，而文段重点围绕“市场”展开，并未提及农户的重要性，该项与前后文衔接不当，排除。\nD项：“通过优化供给体系”强调“供给”，而文段重点围绕“市场”展开，并未提及“供给”，该项与前后文衔接不当，排除。\n故正确答案为B。\n【文段出处】潇湘晨报《千方百计保护农民的种粮积极性（话说新农村）》","no":50,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"3523439","cat":"数学运算","stem":"一次2小时的在线会议，会议结束前半小时才有人开始退出且每分钟退出会议人数满足\u003cimg data-k=\"2f6ab4709122\">，（\u003cimg data-k=\"da47261cd4a4\">）。若会议开始后加入会议人数是退出人数的1.5倍，且会议结束时还有100人在线，问会议开始时可能有多少人在线？","options":{"A":"40","B":"50","C":"60","D":"70"},"answer":"A","explanation":"设会议开始时可能有\u003cimg data-k=\"5320a525f2bc\">人在线。由题意可知，会议结束前半小时每分钟退出会议人数分别为\u003cimg data-k=\"47ea5ec41ded\">人、\u003cimg data-k=\"61c610909647\">人、\u003cimg data-k=\"89f97857b02b\">人、\u003cimg data-k=\"6c9dbef57698\">人······，则会议结束前的半小时共退出\u003cimg data-k=\"f86805f955fa\">人，故会议开始后加入会议人数\u003cimg data-k=\"3473c9e88fd9\">人。会议结束时还有100人在线，则\u003cimg data-k=\"3ed3db508ca7\">，解得\u003cimg data-k=\"ff21c3e483e0\">，即会议开始时可能有40人在线。\n故正确答案为A。","no":51,"missingImage":false},{"type":"question","qid":"3523440","cat":"数学运算","stem":"张三与李四骑马观光，从东方村开始，途经幸福村到胜利村。从东方村骑行1小时后，张三：“已经走了多远？”李四：“刚好是到幸福村的一半。”两人又骑行20公里后，张三：“到胜利村还有多远？”李四：“刚巧是离幸福村的一半那样远。”则东方村到胜利村的距离是多少公里？","options":{"A":"30","B":"35","C":"40","D":"45"},"answer":"B","explanation":"此题对第二个过程的理解不同，会出现不同的答案。\n【解析一】将东方村、幸福村、胜利村分别看成A、B、C三地，全程分为两个过程，第一个过程：先行驶AB（东方村到幸福村）的一半，用时1小时；第二个过程：又行驶20公里后，所处位置距胜利村（C）的距离刚好是到幸福村（B）的一半，即再行驶AB的\u003cimg data-k=\"0f1fa1d0536c\">加上BC的\u003cimg data-k=\"8c3342040bcf\">共20公里。根据条件可得\u003cimg data-k=\"6ec291b9515d\">，则全长\u003cimg data-k=\"5b3b5dcd56e1\">\u003cimg data-k=\"02deebfd67c3\">\u003cimg data-k=\"4f24981af68d\">，排除C、D两项。代入A项，若全长为30公里，则可得\u003cimg data-k=\"f2bfe0a607be\">，\u003cimg data-k=\"f124c0c6e928\">，与全长为30公里矛盾。\n故正确答案为B。\n【解析二】将东方村、幸福村、胜利村分别看成A、B、C三地，全程分为两个过程，第一个过程：先行驶AB的一半，用时1小时；第二个过程：如果理解成到胜利村（C）的距离刚好是胜利村（C）离幸福村（B）的一半那么远，即再行驶AB的\u003cimg data-k=\"0f1fa1d0536c\">加上BC的\u003cimg data-k=\"0f1fa1d0536c\">共20公里，那么全长\u003cimg data-k=\"5b3b5dcd56e1\">\u003cimg data-k=\"b1f80f209a34\">公里。\n故正确答案为C。\n本题表述有争议，粉笔给出两种解题思路，但更倾向于选B。","no":52,"missingImage":false},{"type":"question","qid":"3523442","cat":"数学运算","stem":"某直播平台为3种特色农产品直播带货3小时，第1小时B产品销售额比A产品多50万元，C产品只有B产品的\u003cimg data-k=\"1a67739c8245\">；第2小时与第1小时相比：A翻倍，B增加幅度比A少\u003cimg data-k=\"798f1f286d1f\">，而C增加两倍；最后1小时共带货3090万元，且A产品带货额比第1小时大幅增加\u003cimg data-k=\"65570c2650eb\">，B、C均比第2小时增加\u003cimg data-k=\"e172e0ad0a10\">，问第2小时直播带货额是多少万元？","options":{"A":"1580","B":"1600","C":"1860","D":"2000"},"answer":"C","explanation":"题干给出A、B、C3种农产品在带货第1、2、3小时内销售额的关系，可设第1小时B产品销售额为\u003cimg data-k=\"5320a525f2bc\">万元，可得三类产品3小时内得销售额如下：\n\u003cimg data-k=\"8006a5da41b8\" style=\"max-width:700px\">\n根据最后1小时共带货3090万元可得：\u003cimg data-k=\"cb97164db506\">\u003cimg data-k=\"4ce91af122cf\">；化简得\u003cimg data-k=\"19bdfb6389f4\">，解得\u003cimg data-k=\"d6a4b7dafceb\">。\n代入\u003cimg data-k=\"d6a4b7dafceb\">，第2小时带货额为\u003cimg data-k=\"792acd1d0852\">万元。\n故正确答案为C。","no":53,"missingImage":false},{"type":"question","qid":"3522679","cat":"数学运算","stem":"某省在新冠疫情期间派出包括传染科医生、重症科医生和护士在内的三批援鄂医疗队。三批医疗队中三者人数之比分别为4：2：4、5：2：3和4：3：3。已知第二批医疗队中医生比护士多40人，且传染科医生数逐批增加并成等差数列，三批共派出护士113人，则三批医疗队共有多少人？","options":{"A":"339","B":"350","C":"360","D":"390"},"answer":"B","explanation":"根据第二批医疗队中三者人数之比为5：2：3且医生比护士多40人，可得第二批医疗队传染科医生、重症科医生和护士人数分别为\u003cimg data-k=\"3728f4272384\">人、\u003cimg data-k=\"c4d3854ee57a\">人、\u003cimg data-k=\"ed30d97dd702\">人。根据“传染科医生数逐批增加并成等差数列”，设第一批传染科医生比第二批少\u003cimg data-k=\"5320a525f2bc\">人，则第一批和第三批传染科医生分别为（\u003cimg data-k=\"1563ab90d684\">）人、（\u003cimg data-k=\"ea19ab42fcf5\">）人，传染科医生共有\u003cimg data-k=\"cd7ce383ac73\">人。则根据三批次人数的比例关系可得： \n\u003cimg data-k=\"e7358ae0908e\" style=\"max-width:700px\">\n根据“三批共派出护士113人”列方程：\u003cimg data-k=\"f1e64d0504da\">，解得：\u003cimg data-k=\"577bc36ef4b6\">。则重症科医生共有\u003cimg data-k=\"937f86f6c0ba\">\u003cimg data-k=\"58629e47f9b8\">人。故三批医疗队共有\u003cimg data-k=\"8cd9972ea676\">人。\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"3522681","cat":"数学运算","stem":"一车救灾物资从早上8点起开始运往1900公里外的某地，白天平均车速80公里/小时，夜间60
