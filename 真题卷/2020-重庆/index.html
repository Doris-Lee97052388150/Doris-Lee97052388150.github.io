<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>

</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2020-重庆","title":"2020年重庆市公务员录用考试《行测》试题（网友回忆版）","year":"2020","group":"重庆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"2616012","cat":"新思想","stem":"2020年1月8日，习近平总书记在“不忘初心、牢记使命”主题教育总结大会上的讲话中引用了一句古语：“君子之过也，如日月之食焉：过也，人皆见之；更也，人皆仰之。”下列选项最能体现这一古语精髓的是：","options":{"A":"敢于自我革命，勇于开拓创新","B":"敢于坚持真理，勇于担当作为","C":"敢于直面问题，勇于修正错误","D":"敢于坚持原则，勇于承担责任"},"answer":"C","explanation":"本题考查政治常识。\n2020年1月8日，在“不忘初心、牢记使命”主题教育总结大会上，在说到必须以正视问题的勇气和刀刃向内的自觉不断推进党的自我革命时，习近平总书记使用了古语“君子之过也，如日月之食焉：过也，人皆见之；更也，人皆仰之”。该古语出自《论语》，意思是君子的过错，如同日食月食：他犯了错误，人们都看得见；他改正了错误，人们都仰望他。\n故正确答案为C。","no":1,"missingImage":false},{"type":"question","qid":"2616114","cat":"新思想","stem":"习近平总书记2020年3月6日在决战决胜脱贫攻坚座谈会上强调，这次会议的主要任务是，分析当前形势，克服新冠肺炎疫情影响，凝心聚力打赢脱贫攻坚战，做到“两个确保”。下列属于“两个确保”内容的是：\n①如期完成脱贫攻坚目标任务 ②实现经济社会高质量发展\n③打赢疫情防控阻击战 ④全面建成小康社会","options":{"A":"①②","B":"①③","C":"②④","D":"①④"},"answer":"D","explanation":"本题考查政治常识。  \n习近平总书记2020年3月6日在决战决胜脱贫攻坚座谈会上强调，这次会议的主要任务是，分析当前形势，克服新冠肺炎疫情影响，凝心聚力打赢脱贫攻坚战，确保如期完成脱贫攻坚目标任务，确保全面建成小康社会。\n故正确答案为D。","no":2,"missingImage":false}],"count":2,"answerable":2,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"2616113","cat":"人文常识","stem":"为应对新冠肺炎疫情，我国出台了一系列政策举措，帮助企业和个体工商户减负纾困，促进复工复产。下列哪一选项不属于我国在支持复工复产方面的优惠政策：","options":{"A":"阶段性减免增值税小规模纳税人增值税","B":"阶段性减免企业和个体工商户物业租金","C":"阶段性减征职工基本医疗保险单位缴费","D":"阶段性减免企业养老、失业、工伤保险单位缴费"},"answer":"B","explanation":"本题考查政治常识。\n2020年3月，国家税务总局发布新版《支持疫情防控和经济社会发展税费优惠政策指引》，在支持复工复产方面，对受疫情影响较大的困难行业企业2020年度发生的亏损最长结转年限延长至8年；阶段性减免增值税小规模纳税人增值税；阶段性减免企业养老、失业、工伤保险单位缴费；阶段性减免以单位方式参保的个体工商户职工养老、失业、工伤保险；阶段性减征职工基本医疗保险单位缴费；鼓励各地通过减免城镇土地使用税等方式支持出租方为个体工商户减免物业租金。\n本题为选非题，故正确答案为B。","no":3,"missingImage":false},{"type":"question","qid":"2616112","cat":"人文常识","stem":"“一带一路”倡议自提出以来，已逐步成为当今世界广泛参与的重要国际合作平台。下列有关2019年“一带一路”发展成果的说法正确的是：","options":{"A":"中欧班列全年开列8200多列，“一带一路”在欧洲稳步前行","B":"2019年4月，第二届“一带一路”国际合作高峰论坛在杭州举行","C":"中国人民银行和联合国开发计划署共同撰写研究报告，提出了“一带一路”投融资规划框架","D":"第六届丝绸之路国际电影节于2019年10月在泉州举办，推动“一带一路”国家间的文化交流"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，2019年，中欧班列开行8225列，同比增长\u003cimg data-k=\"c78f19de7451\">，“一带一路”在欧洲稳步前行。\nB项错误，第二届“一带一路”国际合作高峰论坛于2019年4月25日至27日在北京举行。\nC项错误，2019年11月，《融合投融资规则 促进“一带一路”可持续发展——“一带一路”经济发展报告（2019）》正式对外发布。该报告由中国国家开发银行和联合国开发计划署共同撰写，报告重点研究了“一带一路”投融资规则、促进包容性发展、助力可持续发展等问题。\nD项错误，第六届丝绸之路国际电影节于2019年10月15至20日在福建省福州市举办。\n故正确答案为A。","no":4,"missingImage":false},{"type":"question","qid":"2616014","cat":"地理国情","stem":"为提升生态文明、建设美丽中国，党和政府做了一系列重要工作。下列有关生态文明建设的说法不正确的是：","options":{"A":"自2020年1月起，黄河流域的自然保护区将全面禁止生产性捕捞","B":"2019年8月，第一届国家公园论坛在青海省举行，与会代表形成了8条“西宁共识”","C":"2019年，第二轮中央生态环保督察启动，拟用三年时间完成例行督察，再用一年时间开展“回头看”","D":"2019年11月，住建部发布了新修订的《生活垃圾分类标志》标准，将生活垃圾类别调整为可回收物、有害垃圾、厨余垃圾和其他垃圾4个大类"},"answer":"A","explanation":"本题考查政治常识。\nA项错误，根据《农业农村部关于长江流域重点水域禁捕范围和时间的通告》，长江上游珍稀特有鱼类国家级自然保护区等332个自然保护区和水产种质资源保护区，自2020年1月1日0时起，全面禁止生产性捕捞。\nB项正确，2019年8月19日至20日，由国家林业和草原局、青海省人民政府共同举办的第一届国家公园论坛在青海省西宁市成功举行。与会代表通过交流、讨论，形成8条“西宁共识”。\nC项正确，2019年3月，生态环境部部长李干杰在生态环境保护督察专题培训班中指出，将全面启动第二轮例行督察。从2019年起，用三年左右时间完成第二轮中央生态环境保护例行督察，再用一年时间开展“回头看”。\nD项正确，2019年11月15日，住建部发布了新修订的《生活垃圾分类标志》标准，将生活垃圾类别调整为可回收物、有害垃圾、厨余垃圾和其他垃圾4个大类、11个小类。\n本题为选非题，故正确答案为A。","no":5,"missingImage":false},{"type":"question","qid":"2616013","cat":"人文常识","stem":"下列有关公共卫生的说法正确的是：","options":{"A":"突发公共卫生事件应急响应分为Ⅰ级、Ⅱ级、Ⅲ级三个等级","B":"按照我国现行标准，甲类传染病有鼠疫、霍乱、传染性非典型肺炎三种","C":"省、自治区、直辖市人民政府卫生行政主管部门有权向社会发布本行政区域内突发事件的消息","D":"医疗卫生机构发现可能发生传染病暴发、流行的，应当在2小时内向所在地县级人民政府卫生行政主管部门报告"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，《国家突发公共卫生事件应急预案》总则第三条规定：“根据突发公共卫生事件性质、危害程度、涉及范围，突发公共卫生事件可分为特别重大（Ⅰ级）、重大（Ⅱ级）、较大（Ⅲ级）和一般（Ⅳ级）四级。”“突发公共卫生事件的应急反应和终止”部分第一条规定：“发生突发公共卫生事件时，事发地的县级、市（地）级、省级人民政府及其有关部门按照分级响应的原则，作出相应级别应急反应······”因此，应急响应为四个等级。\nB项错误，根据《中华人民共和国传染病防治法》第三条第二款规定：“甲类传染病是指：鼠疫、霍乱。”\nC项错误：《突发公共卫生事件应急条例》第二十五条规定：“国家建立突发事件的信息发布制度。国务院卫生行政主管部门负责向社会发布突发事件的信息。必要时，可以授权省、自治区、直辖市人民政府卫生行政主管部门向社会发布本行政区域内突发事件的信息。信息发布应当及时、准确、全面。”\nD项正确，根据《突发公共卫生事件应急条例》第十九条第三款规定：“有下列情形之一的，省、自治区、直辖市人民政府应当在接到报告1小时内，向国务院卫生行政主管部门报告：（一）发生或者可能发生传染病暴发、流行的；（二）发生或者发现不明原因的群体性疾病的；（三）发生传染病菌种、毒种丢失的；（四）发生或者可能发生重大食物和职业中毒事件的。······”第二十条第一款规定：“突发事件监测机构、医疗卫生机构和有关单位发现有本条例第十九条规定情形之一的，应当在2小时内向所在地县级人民政府卫生行政主管部门报告；接到报告的卫生行政主管部门应当在2小时内向本级人民政府报告，并同时向上级人民政府卫生行政主管部门和国务院卫生行政主管部门报告。”\n故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"2616027","cat":"人文常识","stem":"下列关于我国科技自主可控的说法错误的是：","options":{"A":"基础性技术创新关乎科技自主可控的根本","B":"国产替代是我国近期和未来科技进步和工业发展的主要途径","C":"当前我国科技发展的主要问题表现为“缺芯少魂”“缺芯少屏”","D":"实现科技自主可控，要着力引进技术，引领关键核心领域科技崛起"},"answer":"D","explanation":"本题考查科技常识。\nA项正确，基础性技术创新关乎科技自主可控的根本。只有从源头开始的基础性技术创新才可能真正做到自主可控，并充分享有国际分工与合作的好处。\n\nB项正确，国产替代将是中国近期和未来科技进步与工业发展的主要途径。任何国家层面上的工业发展、科技进步可以通过以下三种途径完成：引进技术、国产替代和自主创新。\n\nC项正确，“缺芯”指的是“缺少国产的芯片”，“少屏”指的是“缺少国产的屏幕”，“少魂”则是指缺少国产的操作系统，常用来形容我国科技发展的现状。虽然目前“少屏”已大为改善，但“缺芯少魂”的问题一直存在。\n\nD项错误，随着我国经济由高速增长阶段转向高质量发展阶段，关键核心技术受制于人已成为制约经济高质量发展的瓶颈。习近平总书记强调：“关键核心技术是要不来、买不来、讨不来的。只有把关键核心技术掌握在自己手中，才能从根本上保障国家经济安全、国防安全和其他安全。”所以实现科技自主可控，关键是在于提高自主创新能力，而非着力引进技术，让引进的技术去引领关键核心技术领域的科技崛起更是违背了自主可控的原则。\n本题为选非题，故正确答案为D。\n备注：本题C项亦存在问题，2020年，中国新型显示产业直接营收达到4460亿元，全球占比高达40.3%，产业规模位居全球第一。尤其是LCD屏幕领域，目前我国已经成为全球最大的LCD屏幕生产国、出口国，占全球50%以上的市场份额。“少屏”已经不再是我国科技发展的主要问题。","no":7,"missingImage":false},{"type":"question","qid":"2616017","cat":"人文常识","stem":"囚徒困境是博弈论的非零和博弈的经典例子，表明个人的最佳选择并非团体的最佳选择。下列选项中不属于囚徒困境的是：","options":{"A":"广告战","B":"关税战","C":"军备竞赛","D":"股市中的散户跟庄"},"answer":"D","explanation":"本题考查经济常识。\n囚徒困境是指两个被捕的囚徒之间的一种特殊博弈，说明为什么在合作对双方都有利时，保持合作也是困难的。囚徒困境的主旨为：虽然囚徒们彼此合作，坚不吐实，可为全体带来最佳利益。但在资讯不明的情况下，因为出卖同伙可为自己带来利益，也因为同伙把自己招出来可为他带来利益，因此彼此出卖虽违反最佳共同利益，反而是自己最大利益所在。在这种情况下，双方都不能得到最好的结果。\nA、B项正确，广告战、关税战均体现了由于对对方不信任，往往采取不合作方式，打“价格战”，结果两败俱伤，陷入囚徒困境之中。\nC项正确，军备竞赛是指各国往往都是倾向于扩大自己的军备，而不是采取合作的方式削减军备。这种不合作行为长期来看也会危害自己。\nD项错误，在股市中，跟庄是指跟随大资金做同方向的操作。散户与庄家相比，没有雄厚的资金和到位的技术分析力，需要具有超常的耐心，跟踪庄家的行动。散户的跟庄行为是为在高位卖出股票获利，并不涉及囚徒困境。\n本题为选非题，故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"2616018","cat":"人文常识","stem":"下列诗词所反映的历史时期按时间先后顺序排列正确的是：\n①风云突变，军阀重开战。洒向人间都是怨，一枕黄粱再现\n②外侮需人御，将军赋采薇。师称机械化，勇夺虎罴威\n③宜将剩勇追穷寇，不可沽名学霸王。天若有情天亦老，人间正道是沧桑\n④山高路远坑深，大军纵横驰奔。谁敢横刀立马？唯我彭大将军","options":{"A":"①②③④","B":"①②④③","C":"①④②③","D":"②③①④"},"answer":"C","explanation":"本题考查毛中特。\n①“风云突变，军阀重开战。洒向人间都是怨，一枕黄粱再现”出自毛泽东的《清平乐·蒋桂战争》。该词反映的是一九二九年春发生于国民党南京军阀蒋介石和广西（简称“桂”）军阀李宗仁、白崇禧之间的战争，即蒋桂战争。\n②“外侮需人御，将军赋采薇。师称机械化，勇夺虎罴威”出自毛泽东的《五律·挽戴安澜将军》。1942年，中国远征军第5军200师师长戴安澜率部赴缅甸援英抗日，历经血战，不幸殉国，年仅38岁。此诗为毛泽东主席为戴安澜将军写的挽诗。\n③“宜将剩勇追穷寇，不可沽名学霸王。天若有情天亦老，人间正道是沧桑”出自毛泽东的《七律·人民解放军占领南京》。该诗写于1949年，诗人热情歌颂了人民解放军飞渡长江天堑，解放南京，改造黑暗旧社会的光辉史实，并以富有哲理意味的诗句，阐发了“追穷寇”的深刻军事哲理。\n④“山高路远坑深，大军纵横驰奔。谁敢横刀立马？唯我彭大将军”出自毛泽东的《六言诗·给彭德怀同志》。1935年10月，彭德怀在吴起镇战斗中歼敌一个团，击溃三个团，毛主席立即挥毫赋诗一首，赞扬彭德怀杰出的军事指挥才能。\n因此，按照时间先后顺序排列应为①④②③。\n故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"2616115","cat":"人文常识","stem":"下列关于人体单纯性肥胖的说法错误的是：","options":{"A":"进食过多的糖类食物，会导致肥胖","B":"肥胖者会因动脉粥样硬化而产生心血管疾病","C":"不吃肥肉少放油，提倡低脂膳食就能避免肥胖","D":"脂肪虽供给人体能量，但摄入过多会沉积皮下引起肥胖"},"answer":"C","explanation":"本题考查科技常识。  \nA项正确，当人摄入过量的糖分时，多余的糖分就会转化为肝肌糖元。如果还有剩余，就会大量转化成脂肪，使人长胖。 \nB项正确，身体太肥胖的话会改变血流动力，左心室异常肥大，使得心律失常，提高血栓生成风险，从而加快动脉粥样硬化生成。\nC项错误，肥胖的成因是多方面的，有遗传、饮食、运动、年龄等因素，所以只是不吃肥肉少放油，提倡低脂膳食并不一定能够避免肥胖。\nD项正确，人体能量摄入超过能量消耗，多余的能量就会转变成脂肪囤积在人体内，从而导致肥胖。\n本题为选非题，故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"2616016","cat":"法律常识","stem":"下列关于法律基础知识的表述正确的是：","options":{"A":"司法机关在适用法律审理案件时，优先适用法律原则，再适用法律规则","B":"法的渊源通常指法的形式意义上的渊源，即法律规范的创制方式和外部表现形式","C":"法的公布与法的实施是两个不同的概念，但实践中法的公布日期即法的实施日期","D":"当同一机关制定的法律出现效力冲突时，一般解决原则是新法优于旧法，一般法优于特别法"},"answer":"B","explanation":"本题考查法律常识。\nA项错误，法律原则是指在一定法律体系中作为法律规则的指导思想、基础或本原的、综合的、稳定的原理和准则。法律规则是采取一定的结构形式具体规定人们的法律权利、法律义务以及相应的法律后果的行为规范。法律规则是法律要素里最主要的构成，也是具体案件适用的首选，在穷尽了规则后，法律规定也可以在具体案件中适用法律原则。\nB项正确，法的渊源简称“法源”。通常指法的创立方式及表现为何种法律文件形式。分为直接渊源和间接渊源两种。前者为成文法，后者可以是判例、惯例甚至法理。\nC项错误，法的实施日期也即法的生效日期，法律的生效时间主要有三种：1.自法律公布之日起生效；2.由该法律规定具体生效时间；3.规定法律公布后符合一定条件时生效。因此，法的公布日期和法的实施日期并非同一概念。\nD项错误，当同一机关制定的法律出现效力冲突时，一般适用如下原则：根本法优于普通法、上位法优于下位法、新法优于旧法、特别法优于一般法等。\n故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"2616111","cat":"人文常识","stem":"下列政府举措中，不能够直接促进城镇居民人均可支配收入增长的是：","options":{"A":"减税","B":"发行政府债券","C":"将学前教育纳入义务教育","D":"提高退休职工养老金发放标准"},"answer":"B","explanation":"本题考查经济常识。\n城镇居民人均可支配收入是指将家庭总收入扣除交纳的个人所得税和个人交纳的各项社会保障支出之后，按照居民家庭人口平均的收入水平。其中，家庭总收入是指该家庭中生活在一起的所有家庭人员从各种渠道得到的所有收入之和。城镇居民人均可支配收入标志着居民的购买力，是衡量城镇居民收入水平和生活水平的最重要和最常用的统计指标。\nA项正确，减税可以降低居民所交纳的个人所得税等税费，少交的税费可以用于其他家庭支出，从而直接提高居民可支配收入。\nB项错误，发行政府债券是国家对经济进行宏观调控的工具，可以通过国家对经济的宏观调控来间接影响个人收入。\nC项正确，学前教育纳入义务教育后将不再交纳学费，省下的学费可用于其他家庭支出，故可以直接提高居民可支配收入。\nD项正确，提高退休职工养老金发放标准可以直接增加居民的工资收入，从而直接提高了居民可支配收入。\n本题为选非题，故正确答案为B。","no":12,"missingImage":false},{"type":"question","qid":"2616029","cat":"人文常识","stem":"下列哪一选项是蚊子用于获取“猎物”信息的主要器官？","options":{"A":"复眼","B":"蚊翅","C":"蚊足","D":"触角"},"answer":"D","explanation":"本题考查科技常识。\nA项错误，蚊子复眼由多数小眼组成，作用是同时得到多角度视觉信息并快速作出反应，是其主要视觉器官，不是其获取“猎物”信息的主要器官。\nB项错误，蚊翅长在蚊子中胸上，共1对，是其飞行的主要器官。\nC项错误，蚊足细长，自前而后分别称前足、中足和后足，是其行走或着陆物体的主要器官。\nD项正确，蚊子触角上有众多短毛，短毛上有众多感官器官，对空气中化学物质的变化有反应，对二氧化碳和湿度尤其敏感。当人呼出二氧化碳和散发出汗液等气味时，这些气味会在空气中扩散，而蚊子触角上的感觉器可以敏感地感受到这些气味，在雌蚊寻觅吸血对象时起重要作用，因此它是蚊子用于获取“猎物”信息的主要器官。\n故正确答案为D。","no":13,"missingImage":false},{"type":"question","qid":"2616026","cat":"人文常识","stem":"下列关于我国城市的表述错误的是：","options":{"A":"北京市、上海市、天津市和重庆市是直辖市","B":"昆山市、义乌市、江阴市、温岭市是县级市","C":"东莞市、三沙市、中山市和嘉峪关市是地级市","D":"成都市、西安市、杭州市和长沙市是副省级市"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，直辖市的行政地位与省、自治区、特别行政区相同，是中华人民共和国省级行政区，是直接由中央人民政府所管辖的建制市。我国现有北京市、天津市、上海市、重庆市4个直辖市。\nB项正确，昆山市是江苏省辖县级市，由苏州市代管；义乌市是浙江省金华市所辖县级市；江阴市是江苏省无锡市所辖县级市；温岭市是浙江省台州市所辖县级市。\nC项正确，东莞市是广东省地级市；三沙市是海南省地级市；中山市是广东省地级市；嘉峪关市是甘肃省地级市。\nD项错误，副省级市是中国行政架构为副省级建制的地级市，其行政级别正式施行于1994年2月25日，前身为计划单列市。最初共有16个副省级市，后来由于重庆市直辖，副省级市变为目前的15个，分别是：广州、武汉、哈尔滨、沈阳、成都、南京、西安、长春、济南、杭州、大连、青岛、深圳、厦门、宁波。长沙市不属于副省级市。\n本题为选非题，故正确答案为D。","no":14,"missingImage":false},{"type":"question","qid":"2616024","cat":"科技常识","stem":"下列诗词没有描述生物应激性反应的是：","options":{"A":"明月别枝惊鹊，清风半夜鸣蝉","B":"我有迷魂招不得，一唱雄鸡天下白","C":"人间四月芳菲尽，山寺桃花始盛开","D":"飞蛾性趋炎，见火不见我。愤然自投掷"},"answer":"C","explanation":"本题考查科技常识。\n应激性是指一切生物对外界各种刺激（如光、温度、声音、食物、化学物质、机械运动、地心引力等）所发生的反应。应激性是一种动态反应，是细胞对刺激发生反应的特性。\nA项正确，“明月别枝惊鹊，清风半夜鸣蝉”出自辛弃疾的《西江月·夜行黄沙道中》，意为天边的明月升上了树梢，惊飞了栖息在枝头的喜鹊，清凉的晚风仿佛传来了远处的蝉叫声。喜鹊被惊飞，体现了生物应激性反应。\nB项正确，“我有迷魂招不得，一唱雄鸡天下白”出自李贺的《致酒行》，意为我的魂魄好像迷失在外，招不回来；当长夜过去，雄鸡高唱，天下大白的时候，才会有我的出路。公鸡对光线特别敏感，当天刚刚发亮时，就能感受到光而报晓，体现了生物应激性反应。\nC项错误，“人间四月芳菲尽，山寺桃花始盛开”出自白居易的《大林寺桃花》，意为人间四月里百花凋零已尽，可是山寺之中，桃花却刚刚盛开。由于地势高的原因，山中的温度一般比平原的温度要低，所以山中的植物达到有效积温所需时间就长，发育就慢。其没有描述生物应激性反应。\nD项正确，“飞蛾性趋炎，见火不见我。愤然自投掷”出自秦应阳的《飞蛾》，意为飞蛾的本性惯于趋向炎热，只见到火而见不到自己。像愤然投掷一样。飞蛾夜间活动，具有趋光性，属于生物应激性反应。\n本题为选非题，故正确答案为C。","no":15,"missingImage":false},{"type":"question","qid":"2616109","cat":"人文常识","stem":"香蕉水作为油性涂料、油漆等建筑材料的溶剂和稀释剂，常用于家庭和办公室装修。下列关于香蕉水的说法正确的是：","options":{"A":"香蕉水是无色透明易挥发的有机液体","B":"香蕉水的主要成分是乙醇，易燃无毒","C":"香蕉水是一种特殊水溶液，不易燃烧","D":"香蕉水是提取于香蕉的天然无毒液体"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，香蕉水是由多种有机溶剂配制而成的无色透明易挥发的液体。\nB项错误，香蕉水的主要成分是甲苯、醋酸丁酯、环己酮、醋酸异戊酯、乙二醇乙醚醋酸酯等，易燃有毒。\nC项错误，香蕉水易燃烧，其蒸气与空气可形成爆炸性混合物，遇明火、高热能引起燃烧爆炸。\nD项错误，香蕉水的得名是因为有乙酸戊酯或乙酸异戊酯的香蕉味，其对人体有一定的毒性。\n故正确答案为A。","no":16,"missingImage":false},{"type":"question","qid":"2616025","cat":"科技常识","stem":"生活中，俗称“暖宝宝”的一次性取暖片主要由铁粉、活性炭、蛭石、水、盐等材料构成。下列关于其发热原理的说法正确的是：","options":{"A":"活性炭的作用是减少铁粉和空气的接触面积","B":"盐和水的作用是加快铁粉氧化","C":"发热原理是铁的氧化吸热过程","D":"蛭石的作用是散热"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，平常的活性炭可以用来吸附杂质，暖宝宝里的活性炭是用来吸收发热过程中产生的水分的，起到分散铁粉、透气、防结块，从而能够达到均衡发热的作用。\nB项正确，食盐和水能帮助铁粉形成微电池，起到加速铁粉氧化腐蚀的作用。\nC项错误，“暖宝宝”是利用铁的氧化反应放热来发热，而不是吸热。\nD项错误，蛭石的作用是使温度能够持续更长，即其起到的作用是保温，而不是散热。\n故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"2616028","cat":"人文常识","stem":"手机电池的发展经历了镍镉电池、镍氢电池和锂离子电池3个阶段。锂离子电池相对于其他两种电池的优势在于：\n①重量轻\n②安全性高\n③绿色环保\n④高低温适应性强","options":{"A":"①②③","B":"①③④","C":"①②④","D":"②③④"},"answer":"B","explanation":"本题考查科技常识。\n锂系电池分为锂电池和锂离子电池。锂离子电池是一种二次电池（充电电池），它主要依靠锂离子在正极和负极之间移动来工作。锂离子电池重量轻，相同体积下重量约为铅酸产品的\u003cimg data-k=\"6f9d0abe3e0f\">-\u003cimg data-k=\"5e907678c197\">，故①正确；锂离子电池绿色环保，不论生产、使用和报废，都不含有、也不产生任何铅、汞、镉等有毒有害重金属元素和物质，故③正确；锂离子电池高低温适应性强，可以在\u003cimg data-k=\"e605adf9cd5d\">至\u003cimg data-k=\"b924ff824e7b\">的环境下使用，经过工艺上的处理，可以在\u003cimg data-k=\"60c9db95764c\">环境下使用，故④正确；由于锂离子电池组成物质非常活跃，若使用错误将会出现电解液分解、燃烧甚至爆炸的重大事故，错误使用存在安全隐患，故②错误。\n故正确答案为B。","no":18,"missingImage":false},{"type":"question","qid":"2616163","cat":"科技常识","stem":"近年来，我国面临的农业安全复杂性不断增加。下列关于农业安全的说法不正确的是：","options":{"A":"为确保我国粮食安全，多部门制定了《沙漠蝗及国内蝗虫监测防控预案》，要求各地严防境外沙漠蝗入侵危害，继续做好国内蝗虫防治工作","B":"生物安全三级实验室需要从事某种高致病性动物病原微生物实验活动的，需要报省级以上畜牧兽医主管部门批准","C":"根据现行规定，举报为防控非洲猪瘟作出特别重大贡献的，可一次性给予举报人10万元奖励","D":"2020年是我国第三次全国农作物种质资源普查与收集行动的收官之年"},"answer":"C","explanation":"本题考查政治常识。\nA项正确，2020年3月6日，农业农村部、海关总署、国家林草局印发了《沙漠蝗及国内蝗虫监测防控预案》的通知：总体目标是“两个努力确保”，努力确保境外沙漠蝗不迁入造成危害，努力确保国内蝗虫不暴发成灾，全力夺取小康之年粮食丰收，有效保障生态安全。\nB项正确，2020年2月28日，农业农村部、教育部等七部门联合发布《关于加强动物病原微生物实验室生物安全管理工作的通知》，通知要求，加强动物病原微生物实验活动监管，生物安全三级、四级实验室需要从事某种高致病性动物病原微生物或者疑似高致病性动物病原微生物实验活动的，应报省级以上畜牧兽医主管部门批准。\nC项错误，2019年11月22日，农业农村部近日印发的《非洲猪瘟疫情有奖举报暂行办法》中提出，“奖励标准。由农业农村部受理经查证属实并符合奖励原则的举报，农业农村部给予举报人每次3000—10000元（税前）不等的奖励。具体的奖励标准另行规定。举报为防控非洲猪瘟作出特别重大贡献的，可一次性给予举报人高于前款规定标准并不超过30000元（税前）的奖励。”\nD项正确，2015年7月9日，《农业部办公厅关于印发&lt;第三次全国农作物种质资源普查与收集行动实施方案&gt;的通知》指出，第三次全国农作物种质资源普查与收集的实施期限为2015年1月1日至2020年12月31日，所以2020年就是收官之年。\n本题为选非题，故正确答案为C。","no":19,"missingImage":false},{"type":"question","qid":"2616023","cat":"人文常识","stem":"下列食物经过人体口腔能够初步消化的是：","options":{"A":"牛肉和鱼","B":"鸡蛋和牛奶","C":"青菜和螃蟹","D":"米饭和馒头"},"answer":"D","explanation":"本题考查科技常识。\nA项错误，牛肉和鱼肉中含有大量蛋白质和少量脂肪，口腔中不含蛋白酶和脂肪酶，不能完成牛肉和鱼的初步消化。蛋白质的消化开始于胃，蛋白质进入胃以后，在胃液中胃蛋白酶的作用下进行初步消化后进入小肠，小肠里的胰液和肠液含有消化蛋白质的酶，在这些酶的作用下，蛋白质被彻底消化为氨基酸而被人体吸收利用；而脂肪的消化主要在小肠进行，先是胆汁（不包含任何消化酶）将脂肪颗粒乳化为脂肪微粒，再在肠液和胰液中脂肪酶的作用下，被彻底分解为甘油和脂肪酸。\nB项错误，鸡蛋和牛奶的主要成分是蛋白质，在胃中完成初步消化。\nC项错误，青菜中含有大量纤维素，但由于人体缺乏分解纤维素的酶，因此青菜的主要成分在人体不能被消化吸收；螃蟹肉主要成分是蛋白质和脂肪，蛋白质在胃中完成初步消化，脂肪在小肠中完成初步消化。\nD项正确，米饭和馒头的主要成分是淀粉，口腔中含有唾液淀粉酶，能将淀粉初步分解为麦芽糖，因此米饭和馒头可以在口腔内初步消化。\n故正确答案为D。","no":20,"missingImage":false}],"count":18,"answerable":18,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"2616063","cat":"逻辑填空","stem":"苏区是一个坚实的实践样本，蕴含着整个中国近代历史的主题、主线，预示着中华民族的前途。苏区研究既属于历史主干研究，也属于历史支系研究。经过多年积累，目前的苏区研究，其广泛、细致的程度前所未有，堪称血肉丰满、            、支系发达。\n填入划横线部分最恰当的一项是：","options":{"A":"枝繁叶茂","B":"繁花似锦","C":"春色满园","D":"生机盎然"},"answer":"A","explanation":"单空成语题。横线所填成语搭配“苏区研究”，根据前文“苏区研究既属于历史主干研究，也属于历史支系研究”可知，文段将苏区研究比作有主干和支系的大树，再由后文“广泛、细致的程度前所未有”“血肉丰满”“支系发达”可知，苏区研究十分兴盛，故横线处应体现出苏区研究这棵“大树”发展很好之意。A项“枝繁叶茂”指树木的枝叶繁密茂盛，符合文意，当选。\nB项“繁花似锦”指无数盛开的花朵像美丽多彩的锦缎，C项“春色满园”指欣欣向荣的景象，D项“生机盎然”比喻生命力旺盛的样子，虽然均能体现兴盛之意，但均无法体现主干、支系的关系，排除。\n故正确答案为A。\n【文段出处】《李红岩：从改革开放40年来历史学的整体发展看苏区研究的前景》","no":21,"missingImage":false},{"type":"question","qid":"2616062","cat":"逻辑填空","stem":"业内专家建议建立国家营养日或营养周，开展“食育进农村”等活动，加大公益广告投入，发布适宜不同人群的膳食指南。针对农村留守儿童多的现状，在家庭监管        的情况下，政府可通过购买服务，让相关社会组织走进农村，帮助农村孩子健康成长。\n填入划横线部分最恰当的一项是：","options":{"A":"缺失","B":"薄弱","C":"不力","D":"缺乏"},"answer":"A","explanation":"横线处所填词语修饰农村留守儿童“家庭监管”的情况，由文段可知，所填词语应体现“留守儿童”缺少家庭监管的意思。A项“缺失”可做名词或动词，指缺少，失去的意思，“家庭监管缺失”搭配恰当，符合文意，当选；B项“薄弱”为形容词，指容易破坏或动摇、不雄厚、不坚强，一般搭配“兵力”“意志”“基础”等，与“家庭监管”搭配不当，排除；C项“不力”为形容词，指不尽力、不得力的意思，文段并非表达留守儿童在家庭监管方面不得力的意思，不符合文意，排除；D项“缺乏”为动词，指（所需要的、想要的或一般应有的事物）没有或不够，应放在宾语“家庭监管”之前，一般表述为“缺乏家庭监管”，置于此处用法错误，排除。\n故正确答案为A。\n【文段出处】《营养“缺乏”与“过剩”困扰青少年健康》","no":22,"missingImage":false},{"type":"question","qid":"2616139","cat":"逻辑填空","stem":"作为一种现象，城市垃圾问题早已凸显，异地倾倒、            ，不过是垃圾困境的一种不当突围方式而已。治理垃圾异地倾倒问题，必须依靠严厉执法和监督举报，但最终还是要回到城市垃圾处理上来。\n填入划横线部分最恰当的一项是：","options":{"A":"投机取巧","B":"以邻为壑","C":"落井下石","D":"寡廉鲜耻"},"answer":"B","explanation":"横线处用“、”和“异地倾倒”构成近义并列，所填成语应体现把自己城市的垃圾倾倒在别的城市的意思。B项“以邻为壑”指把本国的洪水排泄到邻国，比喻只图自己一方的利益，而把困难或灾祸转嫁给别人，与“异地倾倒”语义相近可以构成近义并列，当选。\nA项“投机取巧”是指用不正当的手段谋取私利，C项“落井下石”比喻趁人危难时加以陷害，D项“寡廉鲜耻”指不廉洁，不知羞耻。A、C、D三项均未能体现把对自己有害的转嫁到别人的身上，不能与“异地倾倒”构成近义并列，均排除。\n故正确答案为B。\n【文段出处】《异地偷倒垃圾为何还在疯狂上演》","no":23,"missingImage":false},{"type":"question","qid":"2616127","cat":"逻辑填空","stem":"研究结果显示，只要手机在视线范围或            的范围之内，就会导致人们的注意力下降。这并不是手机的推送或通知分散了人的注意力，而是人们下意识地不去“        ”手机，但发布这个指令的过程本身就会耗费有限的认知资源，造成脑力流失。\n依次填入划横线部分最恰当的一项是：","options":{"A":"近在咫尺  牵挂","B":"唾手可得  惦念","C":"触手可及  惦记","D":"一步之遥  想念"},"answer":"C","explanation":"第一空，根据横线前“手机在视线范围”可知，所填词语表达距离手机很近之意。A项“近在咫尺”形容离得特别近，C项“触手可及”指近在手边，一伸手就可以接触到，形容距离极近，D项“一步之遥”指一步的距离，比喻距离很近，三项均符合文意，保留。B项“唾手可得”形容非常容易得到，与文意不符，排除。\n第二空，根据文意可知，下意识地不去“想”手机的过程本身就会耗费有限的认知资源，故所填词语应体现“总想着、记着”之意。C项“惦记”指对人或事物心里老想着，放不下，置于此处形容人心里一直想着手机，符合文意，当选。A项“牵挂”指挂念，因放心不下而想念，D项“想念”指对离别的人或环境不能忘怀，希望见到，两者均有主观上关心之意，形容“手机”不恰当，排除。\n故正确答案为C。\n【文段出处】《科普：手机在身边会影响大脑认知功能》","no":24,"missingImage":false},{"type":"question","qid":"2616145","cat":"逻辑填空","stem":"国学如果停留在浅层次的形式复古，无异于             ，甚至会把国学弄成与现代文明相对抗的姿态，凡事不问好坏对错，一切以东西古今划界。凡是古人的都是好的，哪怕骑驴；凡是现代的都是“非我族类”，都该保持距离。如此下去，国学非但不会被这些人发扬光大，相反可能会走入狭隘化、极端化、边缘化的境地，钻进狭小天地里            ，与文明发展割断脉络，把自己变成了一块“化石”。\n依次填入划横线部分最恰当的一项是：","options":{"A":"缘木求鱼  蓬荜生辉","B":"掩耳盗铃  纤尘不染","C":"刻舟求剑  皮里阳秋","D":"买椟还珠  孤芳自赏"},"answer":"D","explanation":"此题第一空不易判断，可先从第二空入手，由文段“凡是古人的都是好的······凡是现代的都是‘非我族类’”、“钻进狭小天地里”可知，所填词语应体现出贬义色彩，表达国学比较“自负”的意思。D项“孤芳自赏”指自命清高，自我欣赏，符合文意，保留。A项“蓬荜生辉”指有客来临或别人的恩德使居所等增添光辉，B项“纤尘不染”指一点灰尘也没有，形容非常的干净，这两项均不符合文意，且与文段感情不符，排除。C项“皮里阳秋”指表面上不作评论但内心有所褒贬，不符合文意，排除。\n第一空，代入验证。由文段可知，国学停留在“浅层次”的形式复古、“凡事不问好坏对错，一切以东西古今划界”的做法是没有眼光，不恰当的。D项“买椟还珠”比喻没有眼光，取舍不当，符合文意，当选。\n故正确答案为D。\n【文段出处】《弘扬国学要对接现代文明》","no":25,"missingImage":false},{"type":"question","qid":"2616125","cat":"逻辑填空","stem":"文化是“人化”，同时又要“化人”。城市中的人一方面是文化形象的        和代言人，人们的精神面貌、道德修养、行为举止诸方面都反映出城市的文化形象；另一方面其行为方式又受到城市文化形象的影响，良好的文化形象会对人产生引导、规范和        作用。\n依次填入划横线部分最恰当的一项是：","options":{"A":"载体  激励","B":"体现  训诫","C":"内涵  塑造","D":"象征  制约"},"answer":"A","explanation":"第一空，所填词语和“代言人”构成近义并列，且能对应后文“人们的精神面貌、道德修养、行为举止诸方面都反映出城市的文化形象”，A项“载体”指能够承载其他事物的事物；B项“体现”指某种性质或现象在某一事物上具体表现出来；D项“象征”指用来象征某种特别意义的具体事物，均符合文意，保留。C项“内涵”指一个概念所反映的事物的本质属性的总和，也就是概念的内容，文段并未体现此意，排除。\n第二空，所填词语和“引导”“规范”构成近义并列，由前文“良好的文化形象”可知，所填词语应该是褒义词。A项“激励”指激发鼓励，为褒义词，符合文意，当选。B项“训诫”指教导和告诫，与文段“良好的文化形象”对应不当，排除；D项“制约”指限制约束，感情色彩中性，且常用于消极语境，与文段感情色彩不符，排除。\n故正确答案为A。\n【文段出处】《以城市文化形象助力城市发展》","no":26,"missingImage":false},{"type":"question","qid":"2616066","cat":"逻辑填空","stem":"中华文化绵延5000年，有其独特的价值体系，已成为中华民族的基因。中华优秀传统文化是中华民族的突出优势，        着中华民族最深沉的精神追求，为中华民族生生不息、发展壮大提供了丰厚        ，潜移默化地影响着中国人的思想方式和行为方式，至今仍然具有鲜活的时代价值。\n依次填入划横线部分最恰当的一项是：","options":{"A":"沉淀  润泽","B":"积淀  滋养","C":"积聚  滋润","D":"积蓄  滋补"},"answer":"B","explanation":"第一空，所填词语搭配“精神追求”，根据前文“中华文化绵延5000年”、“中华优秀传统文化是中华民族的突出优势”可知，此处表达中华优秀传统文化中积累包含最深沉的精神追求的意思，A项“沉淀”表示凝聚积累、 B项“积淀”指积累沉淀，两项均可体现积累的意思，保留。C项“积聚”指逐渐聚集，常搭配物资、钱财，D项“积蓄”指积攒聚存，常搭配力量、钱财，均与“精神追求”搭配不当，排除。\n第二空，所填词语搭配“提供”，需要填一个名词，B项“滋养”可做名词，表示养分、养料的意思，与“提供”搭配恰当，当选。A项“润泽”指的是滋润、使滋润的意思，一般不做名词使用，与“提供”“丰厚”均搭配不当，排除。\n故正确答案为B。\n【文段出处】《以高度的文化自信推动中华文化繁荣发展》","no":27,"missingImage":false},{"type":"question","qid":"2616132","cat":"逻辑填空","stem":"中国的格律诗，总体上在唐代            ，达到无法超越的地步。宋诗其实是唐诗的延续，宋代有一些优秀的诗人，他们的创作可与唐人媲美，譬如苏东坡、王安石、陆游等。宋诗中，写得情景交融、意境优美的作品，可以说             。\n依次填入划横线部分最恰当的一项是：","options":{"A":"叹为观止  触目皆是","B":"登峰造极  俯拾皆是","C":"无出其右  汗牛充栋","D":"无与伦比  斗量车载"},"answer":"B","explanation":"第一空，搭配“格律诗”，根据后文“达到无法超越的地步”可知，唐代的格律诗水平极高。B项“登峰造极”比喻学问、技能等达到最高的境界或成就，C项“无出其右”表示没有能超过它的，两项均符合文意，保留。A项“叹为观止”形容所见到的事物好到了极点，常用搭配为“令人叹为观止”“让人叹为观止”，排除；D项“无与伦比”指事物非常完美，没有能够与它相比的同类的东西，根据“宋代有一些优秀的诗人，他们的创作可与唐人媲美”可知，程度过重，排除。\n第二空，搭配“作品”，B项“俯拾皆是”形容多而易得，填入横线处表达宋诗中“写得情景交融、意境优美的作品很多”，符合文意，当选。C项“汗牛充栋”多用于形容“藏书”较多，而文段说的是“诗歌作品”，排除。\n故正确答案为B。 \n【文段出处】《莫说宋诗味如蜡》","no":28,"missingImage":false},{"type":"question","qid":"2616009","cat":"逻辑填空","stem":"壁虎吸附墙壁是靠它们脚上细微毛发与墙壁        的分子间吸附力，仿壁虎材料运用了相同原理，核心在于有方向的吸附力，也就是说这种材料在平时不粘，而当有        的时候就会牢牢吸住物体表面，整个过程几乎不需要进行按压。\n依次填入划横线部分最恰当的一项是：","options":{"A":"粘连  向心力","B":"附着  零重力","C":"贴合  离心力","D":"接触  切向力"},"answer":"D","explanation":"第一空，由“仿壁虎材料运用了相同原理”可知，壁虎吸附墙壁的原理与后文阐述的仿壁虎材料的原理是一致的。根据后文“这种材料在平时不粘”可知，壁虎脚上的细微毛发与墙壁之间也是不粘的，A项“粘连”与文意相悖，排除；B项“附着”指较小的物体黏着在较大的物体上，壁虎脚上细微毛发并非脱离壁虎本体而黏着在墙壁上面，不符合语境，排除；C项“贴合”指贴切吻合，表示两事物大小、形状等完全吻合，壁虎脚上的细微毛发与墙壁并非完全吻合，排除；D项“接触”指挨上、碰着，可以用于表示壁虎脚上的细微毛发与墙壁的位置关系，保留。\n第二空，代入验证，D项“切向力”是物体作曲线运动时，在其轨道切线方向上所受到的力，与前文“有方向的吸附力”构成对应，符合文意，当选。\n故正确答案为D。\n【文段出处】《科学家研制仿壁虎抓手，你知道用来干嘛吗？》","no":29,"missingImage":false},{"type":"question","qid":"2616131","cat":"语句表达","stem":"长期以来，人们对于“阳春白雪”的传统文化，都是一种仰望的姿态，认为            ，于是常常过而不入。从这个意义上说，搞好文创，需要首先激发起人们对文化的浓厚兴趣，然后同样重要的，是想方设法保留住它。如此，人们才会在文化探索的旅程中              ，走得更深、更远。\n依次填入划横线部分最恰当的一项是：","options":{"A":"海水不可斗量  登堂入室","B":"百思不得其解  斗折蛇行","C":"夏虫不可语冰  登高履危","D":"可望而不可即  拾级而上"},"answer":"D","explanation":"第一空，根据文意可知，人们对于传统文化是仰望的姿态，故横线处应与此意相近，D项“可望而不可即”指可以望到但无法接近，与文段对应恰当，保留；A项“海水不可斗量”比喻不可根据某人的现状就低估他的未来，文段未谈论人的现状与未来，与文段语义无关，排除；B项“百思不得其解”的意思是对事情百般思索都不明白，文段谈论的是人们对传统文化的看法而非是否明白，与文段语义无关，排除；C项“夏虫不可语冰”比喻时间局限人的见识，也比喻人的见识短浅，不懂大道理，文段并未提及见识是否短浅，与文段语义无关，排除。\n第二空，代入验证，D项“拾级而上”的意思是顺着阶梯一步一步地往上走，与后文“走得更深、更远”对应恰当，符合语境，当选。\n故正确答案为D。\n【文段出处】《文创产业功夫在诗外》","no":30,"missingImage":false},{"type":"question","qid":"2616133","cat":"逻辑填空","stem":"饮食在中国文化传承中是较稳定的领域，国有盛衰，代有兴亡，用筷子吃饭数千年不变，与宴饮相关的某些礼仪程式也很少变化，盛行在西周的乡饮酒礼，上可溯至三代遗风，下传至清道光年间，其敬老、尊长、议政的古风            ，连酒会程序——谋宾、迎宾、旅酬和送宾等礼仪也            。\n依次填入划横线部分最恰当的一项是：","options":{"A":"如出一辙  毫无二致","B":"一脉相承  大同小异","C":"一脉相通  相差无几","D":"衣钵相传  半斤八两"},"answer":"B","explanation":"第一空，文段指出我国饮食在传统文化中比较稳定，相关的吃饭习俗数千年不变，且横线前提到“上可溯至三代遗风，下传至清道光年间”，故横线处表示敬老、尊长、议政的古风是一直传承、延续的。A项“如出一辙”表示好像从一道车辙上走过来，形容两种言论或行动一模一样，与文中表示古风一直延续、传承的语义不符，排除；B项“一脉相承”表示从同一血统、派别世代相承流传下来，可体现出敬老、尊长、议政的古风一直传承、延续之意，保留。C项“一脉相通”指事物之间相互关联，可以互通，侧重强调关联性强，文段表示传承之意，而非事物之间的关联性，排除；D项“衣钵相传”比喻技术、学术的师徒相传，不符合语境，排除。\n第二空，代入验证，横线处前“也”字表明与上文内容形成近义并列，应表达这些礼仪也大致相同之意。B项“大同小异”表示大部分相同，只有小部分不同，与文意相符，当选。\n故正确答案为B。\n【文段出处】《150年前，西餐进入中国，吃个饭竟然促进了男女平等》","no":31,"missingImage":false},{"type":"question","qid":"2616124","cat":"逻辑填空","stem":"艺术桥是巴黎的一个标志，不仅        了塞纳河畔的风景，更记载了艺术文化的传承和人类文明的繁荣。热爱美景、艺术和生活的人都会乐见艺术桥能够长久地        ，发挥其应有的便民功能以及作为文物景观的历史价值和艺术作品的美学价值。\n依次填入划横线部分最恰当的一项是：","options":{"A":"衬托  连续","B":"渲染  继续","C":"装饰  持续","D":"点缀  存续"},"answer":"D","explanation":"第一空，所填词语修饰“艺术桥”与“塞纳河畔的风景”的关系， C项“装饰”指在身体或物体的表面加些附属的东西，使美观；D项“点缀”指加以衬托或装饰，使原有事物更加美好，均符合文章要求，搭配得当，均保留。A项“衬托”指为了使事物的特色突出，把另一些事物放在一起来陪衬或对照，侧重于两个事物之间的对比、对照，让某物更突出，但文中没有通过对比让某物更突出的意思，排除；B项“渲染”指国画的一种画法，用水墨或淡的色彩涂抹画面，以加强艺术效果；也可用来比喻夸大地形容，搭配“艺术桥”不妥，排除。\n第二空，所填词语亦要搭配“艺术桥”，D项“存续”指存在并延续，搭配合适，并能与文中“长久地”形成对应，当选。C项“持续”指延续不断，多为某种行为、状态继续下去，搭配“艺术桥”不当，排除C项。\n故正确答案为D。\n【文段出处】《人民日报环球走笔：真爱不必上锁》","no":32,"missingImage":false},{"type":"question","qid":"2616008","cat":"逻辑填空","stem":"在西汉时期，一种青铜染炉非常流行，以至于在许多地方都有出土。这种染炉分为三个构造：主体为炭炉，下部是        炭灰的盘体，上面放置一具活动的杯。它曾让几代学者对它的用途             ，直到今天，考古界才确定它就是一种类似现代意义上的“小火锅”。\n依次填入划横线部分最恰当的一项是：","options":{"A":"接收  孜孜以求","B":"承接  迷惑不解","C":"收纳  朝思暮想","D":"盛放  潜精研思"},"answer":"B","explanation":"第一空，根据文段信息“主体为炭炉，下部是······炭灰的盘体”可知，染炉下部是用来接上面掉下来的炭灰的。B项“承接”意思是承前接后，体现出接住上面掉下的东西，与文段对应恰当，保留。A项“接收”指收取、收受，一般搭配“礼物、遗产、工程”等，与炭灰搭配不当，排除；C项“收纳”指收留容纳，D项“盛放”指安放，均体现要把东西收好、保存，炭灰是燃烧后的废物不需要完好保存，与文意不符，排除。\n第二空，代入验证，根据后文“直到今天，考古界才确定它就是······”可知，以前几代学者并不知道染炉的用途。B项“迷惑不解”指对某事非常疑惑，很不理解，与文段对应恰当，当选。\n故正确答案为B。\n【文段出处】《考古证实：汉代吃火锅撸串儿喝酒很流行 》","no":33,"missingImage":false},{"type":"question","qid":"2616129","cat":"逻辑填空","stem":"两相比较，白话文在通俗易懂的同时，往往在韵律上缺少节奏感，篇幅冗长，而文言文能用            传达出深层或多层意思，其凝练之美、韵律之美和意境之美是白话文            的。\n依次填入划横线部分最恰当的一项是：","options":{"A":"一语双关  略逊一筹","B":"只言片语  无与伦比","C":"三言两语  相形见绌","D":"寥寥数语  无可比拟"},"answer":"D","explanation":"第一空，根据“两相比较”可知，文段把白话文与文言文作对比，所填成语与“篇幅冗长”构成反义对应，表示文章字数少的意思。B项“只言片语”指个别词句或片断的话，C项“三言两语”形容话很少，D项“寥寥数语”指非常简括地说，均能体现出文言文篇幅不冗长的含义，保留。A项“一语双关”指一句话包含两个意思，不强调文章的字数少，无法与“篇幅冗长”对应，排除。\n第二空，根据文段“其凝练之美、韵律之美和意境之美”可知，白话文不具备以上特点，所填成语表示文言文的三种美是白话文无法相比的。D项“无可比拟”指没有可以相比的，符合语境，当选。B项“无与伦比”指事物非常完美，没有能够与它相比的同类的东西，用在此处程度过重，排除；C项“相形见绌”指和同类的事物相比较显出不足，文段强调的是文言文的三种美是白话文无法与之相比，并非强调白话文自身的缺陷和不足，排除。 \n故正确答案为D。 \n【文段出处】《冉启斌：文言文在意境、形式、音韵等方面有特殊美感》","no":34,"missingImage":false},{"type":"question","qid":"2616141","cat":"逻辑填空","stem":"研究人员分别给成年小鼠和老年小鼠喂食膳食纤维含量不同的两种食物，持续4周，然后对小鼠血液中短链脂肪酸水平、肠道炎症状况等进行检测，结果表明，多补充膳食纤维，不仅可以提高老年小鼠血液中短链脂肪酸水平，而且会显著        小鼠肠道炎症，增强细胞抗炎能力，进而抑制有害化学物质的产生，延缓大脑功能        进程。\n依次填入划横线部分最恰当的一项是：","options":{"A":"减弱  衰萎","B":"减缓  衰弱","C":"减轻  衰退","D":"减少  衰变"},"answer":"C","explanation":"第一空，搭配“炎症”，A项“减弱”，C项“减轻”，D项“减少”均可与之搭配，保留。B项“减缓”指速度变慢，不能直接搭配“炎症”，排除。\n第二空，横线前搭配“大脑功能”，C项“衰退”指衰弱减退，可与“大脑功能”搭配，当选。A项“衰萎”指衰败萎缩，可以搭配“大脑”，但不能搭配“功能”，排除。D项“衰变”指放射性元素放射出粒子后变成另一种元素的现象，与本题语境无关，排除。\n故正确答案为C。\n【文段出处】《补充膳食纤维有助于延缓大脑衰退》","no":35,"missingImage":false},{"type":"question","qid":"2616161","cat":"逻辑填空","stem":"不少街坊所熟知的“冬病夏治”，就是根据祖国医学“春夏养阳，秋冬养阴”的理论，        四时特性的养生疗法。“冬病”指某些好发于冬季，或在冬季加重的病变，如支气管炎、慢性阻塞性肺疾病、过敏性鼻炎、失眠、骨关节痛、体质虚寒症等疾病。“夏治”指夏季这些病情有所缓解，趁其发作缓解季节，补气扶阳、辨证施治，以        冬季旧病复发，或减轻其症状。\n依次填入划横线部分最恰当的一项是：","options":{"A":"服从  防止","B":"适应  免予","C":"顺应  预防","D":"符合  避免"},"answer":"C","explanation":"第一空，搭配“四时特性”，且由前一分句的“根据”可知，横线处表示“冬病夏治”受到了“四时特性”的引导与影响。A项“服从”指遵照、听从，一般搭配命令、管理等，与“四时特性”搭配不当，排除；D项“符合”指数量、形状、情节等相合，虽然可与“四时特性”搭配，但体现不出受到了其影响之意，排除；B项“适应”指适合，C项“顺应”指顺从、适应，均可与“四时特性”搭配，且能体现出受到了其影响之意，保留。\n第二空，根据文意，“夏治”的目的即提前做准备，防止冬季旧病复发，故横线处应体现时间角度的提前，做防备之意。C项“预防”指事先防备，符合文意，当选。B项“免予”指不给予或不施行，与文意不符，排除。\n故正确答案为C。\n【文段出处】《夏天晒太阳防病有讲究》","no":36,"missingImage":false},{"type":"question","qid":"2616126","cat":"逻辑填空","stem":"随着学校消失，村庄的文化高地不在，村庄文化脉络的            受到了影响；青少年长期“不在场”，对村庄的            感逐渐增强。特别是在以传统农业文明为指征的村庄文化正在大面积            ，农村文化呈现虚化、空洞化，无疑更进一步加剧了村庄文化的衰亡，对村庄的可持续发展造成不利的影响。\n依次填入下划线部分最恰当的一项是：","options":{"A":"纲维  疏远  消失","B":"维系  疏离  式微","C":"轴心  隔阂  衰亡","D":"衔接  陌生  凋零"},"answer":"B","explanation":"第一空，横线处所填词语搭配“文化脉络”，分析文意可知，重在强调由于学校消失，村庄文化的进一步发展受到了影响。A项“纲维”意为维系、护持，与B项“维系”均可以与“文化脉络”搭配，保留。C项“轴心”意为中心、关键，与“文化脉络”搭配不当，可以表述为“文化的轴心”，且文段并未体现“关键”之意，与文意不符，排除；D项“衔接”指事物首尾连接，置于此处与“文化脉络”搭配不当，排除。\n第二空，横线处所填词语用以形容青少年与村庄之间的关系。A项“疏远”指关系、感情不亲近、冷淡，多用来形容人与人之间的关系，置于此处搭配不当，排除；B项“疏离”指一种很陌生、冷漠、和人很疏远的感觉，可以用来形容“村庄”与“人”之间的关系，锁定B项。\n第三空，代入验证，横线处所填词语用以搭配“村庄文化”，B项“式微”表示衰落，且“文化的式微”为常见搭配，符合文意，当选。\n故正确答案为B。\n【文段出处】《学校消失给村庄带来的变化》","no":37,"missingImage":false},{"type":"question","qid":"2616147","cat":"逻辑填空","stem":"上海合作组织成立十多年来，创造性提出并始终        “上海精神”，主张互信、互利、平等、协商、尊重多样文明、谋求共同发展，为世界各国共同繁荣、区域合作发展壮大提供了有益        ，为推动各国        建设人类命运共同体作出了重大贡献。\n依次填入划横线部分最恰当的一项是：","options":{"A":"实践  启发  并肩","B":"推行  借镜  昂首","C":"践行  借鉴  携手","D":"履行  启示  挽手"},"answer":"C","explanation":"第一空，所填词语搭配“上海精神”。B项“推行”和C项“践行”搭配“上海精神”均恰当，保留。A项“实践”作谓语时，其后一般不接宾语，即其后不能搭配“上海精神”，排除；D项“履行”一般搭配职责、义务等，不能搭配“上海精神”，排除。\n第二空，文段说的是上海合作组织的经验可以让世界各国学习、效仿。B项“借镜”取自成语“借镜观形”，“借镜观形”比喻参考和吸取别人的经验教训。B项“借镜”与C项“借鉴”意思相同，填入横线处均符合语境，保留。\n第三空，B项“昂首”指仰着头，C项“携手”指手拉着手，表示共同做某事。由“各国”“人类命运共同体”可知，此处强调各国齐心协力共谋发展，所以C项“携手”更符合语境，当选。\n故正确答案为C。\n【文段出处】《为携手建设人类命运共同体作出更大贡献》","no":38,"missingImage":false},{"type":"question","qid":"2616011","cat":"逻辑填空","stem":"近年来，人们的生活条件越来越好，对旅游        的要求也越来越高，从前到此一游、            的旅游方式已逐渐被深度体验、注重文化与互动的旅游方式所替代。正是在这种背景下，文化与旅游融合的发展方式            ，并成为热点。\n依次填入划横线部分最恰当的一项是：","options":{"A":"质量  浮光掠影  脱颖而出","B":"环境  浅尝辄止  蔚然成风","C":"品质  走马观花  应运而生","D":"生态  蜻蜓点水  蔚为大观"},"answer":"C","explanation":"本题可从第三空入手，根据“这种背景下”指代前文，前文指出近年来人们的旅游方式“已逐渐被深度体验、注重文化与互动的旅游方式所替代”，故横线处应体现在这样的背景下，“文化与旅游融合的发展方式”随着人们的需要开始兴起。C项“应运而生”指随着某种形势而产生，符合文意，保留。\nA项“脱颖而出”本意指锥尖透过布袋显露出来，也指人的本领全部显露出来，体现不出“开始兴起”的含义，与文意不符，排除；\nB项“蔚然成风”指事物盛极一时，成为风气，体现不出“开始兴起”的含义，与文意不符，排除；\nD项“蔚为大观”指事物美好而繁多，多指文物、盛大的景象等，与“发展方式”搭配不当，排除。\n第一空，代入验证，“旅游品质的要求”搭配恰当，保留。\n第二空，代入验证，横线处与“到此一游”构成并列，“走马观花”指粗略地观察一下，与“到此一游”语义相近，当选。\n故正确答案为C。\n【文段出处】《在文旅融合中讲好民俗故事》","no":39,"missingImage":false},{"type":"question","qid":"2616187","cat":"逻辑填空","stem":"随着智能科技和产业的发展，数据和计算正在成为            经济增长和发展的关键            。作为第四次工业革命的引擎，智能科技和经济在中国的发展            于经济转型升级中所创造的智能化需求。\n依次填入划横线部分最恰当的一项是：","options":{"A":"推动  因素  产生","B":"驱使  要点  内化","C":"触动  质素  生长","D":"驱动  要素  内生"},"answer":"D","explanation":"第一空，此处需分别搭配“经济增长”和“发展”，A项“推动”指的是使事物推进，D项“驱动”指的是使动起来，均可与“经济增长”、“发展”构成搭配，保留A、D两项；B项“驱使”指的是强迫人按照自己的意志行动，一般搭配为“在……驱使下”“利益驱使”等，与“经济增长”、“发展”搭配不当，排除；C项“触动”指的是碰、撞，因某种刺激而引起（感情变化、回忆等），与“增长”、“发展”搭配不当，排除；\n第二空，搭配“关键”，A项“因素”、D项“要素”均可构成搭配，保留；\n第三空， 结合文段，此处需表达智能科技和经济能够在中国得以发展是由于有经济转型升级中所创造的智能化需求，即横线要表达智能科技和经济的发展与智能化需求之间存在因果关系。D项，“内生”指的是靠自身发展，智能这一领域的科技和经济之所以发展靠的是自身领域的需求——智能化的需求，在此能够体现同一领域的两者之间的因果关系，保留；A项“产生”指的是由已有的事物中生出新的事物，更多形容两个不同领域之间的因果关系，与文意不符，排除。\n故正确答案为D。\n【文段出处】《中国人工智能如何更好发展》","no":40,"missingImage":false},{"type":"question","qid":"2616005","cat":"逻辑填空","stem":"曹雪芹通过贾府的衣食住行把            人家的富贵之相刻画得淋漓尽致。一屋一室，或雕梁画栋，或            ，或金碧辉煌，或简约古朴，相映成辉，相映成画；一餐一饮精烹细作，食不厌精；            ，雀衣彩绣，美轮美奂。但仍然没有宴席上的浅斟深酌更能体现出贾府“鲜花着锦、烈火烹油”之盛；没有比推杯换盏之时的琴歌酒赋更能体现出翰墨书香之族的风流雅致。\n依次填入划横线部分最恰当的一项是：","options":{"A":"筚门圭窦  岸芷汀兰  一裙一裳","B":"兰艾同焚  粉墙黛瓦  一丝一缕","C":"钟鸣鼎食  曲径通幽  一衣一带","D":"桑枢瓮牖  小桥流水  一鞋一袜"},"answer":"C","explanation":"第一空，搭配“人家”，根据文段信息“富贵之相”以及后文一系列具体描述可知，此处应体现贵族人家非常富有之意。C项“钟鸣鼎食”指古代富贵人家击钟奏乐，列鼎而食。形容生活奢侈豪华，符合文意，保留。A项“筚门圭窦”形容住室极其简陋，旧指穷人住处，B项“兰艾同焚”指兰花跟艾草一起烧掉，比喻不分好坏，一同消灭，D项“桑枢瓮牖”指用桑树做门轴，用瓦罐做窗户，比喻贫苦之家，均与文意无关，排除。\n第二空，代入验证，C项“曲径通幽”是指弯曲的小路通到风景美丽的地方。形容景色雅致迷人，放在此处形容贾府的风景美丽，符合语境，保留。\n第三空，代入验证，C项“一衣一带”即“每条衣带”，对应“雀衣彩绣”，符合语境，当选。\n故正确答案为C。\n【文段出处】《红楼女性聚饮时的琴歌酒赋》","no":41,"missingImage":false},{"type":"question","qid":"2616245","cat":"片段阅读","stem":"生长在非洲大草原上的灰犀牛，身躯庞大，给人一种行动迟缓、安全无害的错觉，从而时常忽略了危险的存在——当灰犀牛被触怒发起攻击时，却会体现出惊人的爆发力，阻止它的概率接近于零，最终引发破坏性极强的灾难。概率大、破坏力强是“灰犀牛”事件最重要的特征。很多危机事件，与其说是“黑天鹅”，不如说更像是“灰犀牛”。它们并非发端于不可预测的小概率事件（“黑天鹅”），而是大概率、高风险事件（“灰犀牛”）不断演化的结果，这些风险的存在早就广为人知，却由于体制或认识的局限，没有得到积极防范和应对，最终升级为全面的系统性危机。\n根据上述文字，下列说法正确的是：","options":{"A":"“黑天鹅”和“灰犀牛”事件都是严重的无法防范的危机事件","B":"与“灰犀牛”相对，“黑天鹅”是指破坏性不强的小概率事件","C":"许多“黑天鹅”事件背后都隐藏着“灰犀牛”危机","D":"“灰犀牛”和“黑天鹅”事件没有明显区别，一定条件下可以互相转化"},"answer":"C","explanation":"A、B两项存在共性错误，文中只强调“灰犀牛”事件“概率大、破坏力强”，但是对“黑天鹅”事件只定性为“不可预测的小概率事件”，但其破坏性是否严重文段未提及，A项将“黑天鹅”事件定性为严重的无法防范的事件、B项将其定性为破坏性不强的事件，均为无中生有，排除；\nC项，根据“很多危机事件，与其说是‘黑天鹅’，不如说更像是‘灰犀牛’”可知，表面看似是“黑天鹅”事件，其实可能是“灰犀牛”，即“黑天鹅”背后隐藏着“灰犀牛”，表述正确，符合文意，当选；\nD项，根据文段可知“黑天鹅”是小概率事件，“灰犀牛”是大概率、高风险事件，两者不同，“没有明显区别”表述错误，且“互相转化”文段未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】《“灰犀牛”，究竟什么来头？》","no":42,"missingImage":false},{"type":"question","qid":"2615973","cat":"片段阅读","stem":"正因为中国法律史学除了单纯的理论研究，还要探究解决当代中国的法律问题，所以有必要坚持独立的中国立场。不论是单纯的理论研究，还是切近实际的应用研究，都需坚持独立思想立场，才能做出有价值的研究成果。这里的独立立场，其实就是中国自身的立场，而不是站在别国的立场之上。近代以来，西方国家一些学者对于中国法律不客观的负面评价，曾经影响到中国学者对待本国法律历史的态度。直到今天，这种影响仍没有完全消除，需要加以矫正。\n这段文字旨在强调：","options":{"A":"中国法律史学研究需探究解决当代中国的法律问题","B":"中国法律史学研究受到西方学者不客观的负面评价","C":"中国法律史学研究必须坚持中国自身独立的立场","D":"中国法律史学研究曾受西方学者影响至今未消除"},"answer":"C","explanation":"文段开篇通过结论词“所以”提出观点，强调中国法律史学研究需坚持独立的中国立场，后文分别从正反两个方面来论证前文观点，一方面“坚持独立思想立场才能做出有价值的研究成果”，即需要坚持中国立场，另一方面“西方国家一些学者对于中国法律不客观的负面评价······这种影响仍没有完全消除，需要加以矫正”，即通过反面的角度来强调需要坚持中国立场。故文段为总分结构，旨在强调中国法律史学研究必须坚持中国自身独立的立场，对应C项。\nA项“当代中国的法律问题”对应开篇话题引入部分，结论之前的内容非重点，排除。\nB项“西方学者不客观的负面评价”，D项“影响至今未消除”均对应解释说明部分的内容，非重点，排除。\n故正确答案为C。\n【文段出处】《构建具有中国风格的法律史学》","no":43,"missingImage":false},{"type":"question","qid":"2615974","cat":"片段阅读","stem":"研究人员发现在大脑中存在着不同种类和巨大数量的高维几何结构，由紧密连接的神经元团块和它们之间的空白区域（空洞）组成。这些团块或空洞似乎对大脑功能至关重要，当研究人员给虚拟大脑组织施加刺激时，他们发现神经元以一种高度有组织性的方式对刺激做出了反应。这意味着我们思考问题的时候，神经元的团块会逐渐组合成更高维的结构，形成高维的孔隙或空洞，团块中的神经元越多，空洞的维度就越高，最高的时候可以达到11个维度。\n根据上述文字，下列说法正确的是：","options":{"A":"团块中的神经元越多，空洞的维度就越高，意识越复杂","B":"神经元团块或空洞互相联系，以施压方式促进人的思考","C":"神经元能以高度有组织性的方式反应，取决于大脑功能","D":"人脑充满多维几何结构，最高时可在11个维度上运行"},"answer":"D","explanation":"A项，根据“我们思考问题的时候，神经元的团块会逐渐组合成更高维的结构，形成高维的孔隙或空洞，团块中的神经元越多，空洞的维度就越高”可知，人类思考问题时即意识复杂时，神经元形成的团块越多、空洞的维度就越高，A选项因果倒置，排除；\nB项，“以施压方式促进人的思考”无中生有，文段并未介绍施压可以促进思考，排除；\nC项，根据“当研究人员给虚拟大脑组织施加刺激时，他们发现神经元以一种高度有组织性的方式对刺激做出了反应”可知，当大脑受到刺激时，神经元能以高度有组织性的方式做出反应，“受到刺激”是神经元产生反应的前提，故“取决于大脑功能”无中生有，排除；\nD项，根据“研究人员发现在大脑中存在着不同种类和巨大数量的高维几何结构”“最高的时候可以达到11个维度”可知，表述正确，当选。\n故正确答案为D。\n【文段出处】《不是三维？科学家发现人的大脑里可能有11个维度！》","no":44,"missingImage":false},{"type":"question","qid":"2616007","cat":"片段阅读","stem":"最新研究表明，火星表面可能包含着一种叫做高氯酸镁的有毒化合物，它在紫外线下能摧毁细菌。研究者将枯草杆菌放置在短波紫外线辐射下，其状况类似于火星表面，发现高氯酸镁具有强杀菌性。只要存在高氯酸镁，枯草杆菌几分钟内就失去生存能力。同时，研究人员发现火星表面其他两种物质——氧化铁和过氧化氢，与高氯酸镁结合后杀菌性能增强10倍。这项发现表明，火星表面对细胞非常危险。长远来看，可能对后续的火星探索产生影响，尤其是可能大大增加了人类开发火星的成本。\n这段文字意在强调：","options":{"A":"高氯酸镁杀枯草杆菌有奇效","B":"已找到为火星表面消毒的方法","C":"火星自身具有杀菌自净的能力","D":"火星比预想更不适宜生命存活"},"answer":"D","explanation":"文段开篇指出研究表明，火星表面有一种叫高氯酸镁的有毒化合物可以消灭细菌，紧接着用“同时”表并列指出，火星还存在氧化铁和过氧化氢，也存在杀菌的作用。随后，文段通过“这项发现表明”指代前文得出结论：火星表面对细胞非常危险，这大大增加了人类开发火星的成本。故文段重在强调火星表面不适宜细胞生存，对应D项。\nA项“高氯酸镁”属于结论前的内容，非重点，且属于“同时”前的内容，表述片面，排除；\nB项“已找到为火星表面消毒的方法”文段并未提及，属于无中生有，排除；\nC项“火星自身具有杀菌自净的能力”属于结论前的内容，非重点，排除。\n故正确答案为D。\n【文段出处】《火星比预想更不适宜生命存活：有毒化学物质摧毁细菌》","no":45,"missingImage":false},{"type":"question","qid":"2615975","cat":"片段阅读","stem":"在移动阅读时代，自媒体的影响力不可小觑。由于拥有更广阔的传播途径和分发渠道，受公众关注度高，自媒体人掌握了一定话语权。有些自媒体人与传统媒体机构相比，确实不落下风，公信力给他们带来了收益。然而，公信力是把双刃剑，自媒体人既要看到流量背后的利益，也要认识到滥用自己的公信力会引发哪些负面效果。若以为可以仰仗传播力而“任性”，则实实在在打错了算盘。滥用话语权的后果，将直接影响自己辛苦树立起来的公信力，失去公众的支持与关注。\n这段文字意在强调：","options":{"A":"自媒体具有强大的影响力","B":"自媒体人不应只关注收益","C":"自媒体人应争取公众支持","D":"自媒体的话语权不可滥用"},"answer":"D","explanation":"文段开篇介绍自媒体影响力不可小觑的背景，并指出由于自媒体人掌握了一定话语权，可凭借公信力获得收益。之后通过“然而”转折引出重点，指出滥用公信力会引发负面效果的问题，尾句从反面提出对策。故文段强调自媒体不能仰仗传播力而“任性”，不能滥用话语权，对应D项。\nA项，“影响力”对应文段转折前内容，非重点，排除；\nB项，“不应只关注收益”对应尾句之前内容，非重点，排除；\nC项，“争取公众支持”对应文段尾句滥用话语权的后果，非重点且表述片面，排除。\n故正确答案为D。\n【文段出处】《自媒体公信力不可滥用》","no":46,"missingImage":false},{"type":"question","qid":"2615976","cat":"片段阅读","stem":"我国研究机构日前宣布，世界上第一个全超导托卡马克“东方超环”（EAST）实现了稳定的101.2秒稳态长脉冲高约束等离子体运行，创造了新的世界纪录。这标志着EAST成为世界上第一个实现稳态高约束模式运行持续时间达到百秒量级的托卡马克核聚变实验装置。EAST高11米、直径8米、重达400吨，是我国第四代核聚变实验装置，其科学目标是让海水中大量存在的氘和氚在高温条件下，像太阳一样发生核聚变，为人类提供源源不断的清洁能源，所以也被称为“人造太阳”。\n这段文字主要说明了：","options":{"A":"大力发展清洁能源势在必行","B":"核聚变技术可创造清洁能源","C":"短期内难建成真正的“人造太阳”","D":"“人造太阳”装置取得革命性突破"},"answer":"D","explanation":"文段首先介绍世界上第一个全超导托卡马克EAST创造了新的世界纪录，新突破使EAST成为世界上第一个持续时间达到百秒量级的托卡马克核聚变实验装置，接着通过介绍EAST的特点、科学目标等来介绍其被称为“人造太阳”的原因，故文段重点介绍“人造太阳”即EAST取得的重大突破，对应D项。\nA、B两项均围绕“清洁能源”展开，但文段主题词为EAST装置，即“人造太阳”，主题词偷换，排除；\nC项，“短期内难建成”无中生有，排除。\n故正确答案为D。\n【文段出处】《“人造太阳”新突破，奠定核聚变基础 》","no":47,"missingImage":false},{"type":"question","qid":"2616119","cat":"片段阅读","stem":"有研究团队让22名17岁至42岁的志愿者在两周内每晚照常使用电子设备，但在睡前佩戴三小时防蓝光眼镜，发现其晚间褪黑激素水平整体上升了大约\u003cimg data-k=\"bc7fa04b7ea4\">，上升幅度甚至超过服用褪黑激素补充剂带来的变化。志愿者感觉睡眠质量改善，入睡更快，整体睡眠时间延长。研究者说，最大的蓝光光源是日光，但大部分基于LED灯的设备也会发出蓝光，“人造蓝光”会激活对褪黑激素有抑制作用的内在光敏视网膜神经节细胞，从而干扰睡眠。该研究者建议睡前少用电子设备，或佩戴防蓝光眼镜。\n从这段文字可以推出：","options":{"A":"电子设备的蓝光会减少褪黑激素的分泌而促进睡眠","B":"天然的日光并不会激活内在光敏视网膜神经节细胞","C":"睡前不佩戴防蓝光眼镜会使褪黑激素水平整体上升","D":"提升褪黑激素水平有助于入睡更快和睡眠质量改善"},"answer":"D","explanation":"A项，根据“大部分基于LED灯的设备也会发出蓝光，‘人造蓝光’会激活对褪黑激素有抑制作用的内在光敏视网膜神经节细胞，从而干扰睡眠”可知，蓝光会减少褪黑激素的分泌，干扰睡眠，而非促进睡眠，与文意相悖，排除；\nB项，文段只说“人造蓝光”会激活神经节细胞，对于天然日光并未提到，无中生有，排除；\nC项，根据“在睡前佩戴三小时防蓝光眼镜，发现其晚间褪黑激素水平整体上升了大约\u003cimg data-k=\"bc7fa04b7ea4\">”可知，佩戴防蓝光眼镜可以使褪黑激素水平整体上升，选项表述错误，排除；\nD项，根据“在睡前佩戴三小时防蓝光眼镜，发现其晚间褪黑激素水平整体上升了大约\u003cimg data-k=\"bc7fa04b7ea4\">”和“志愿者感觉睡眠质量改善，入睡更快，整体睡眠时间延长”可知，选项表述正确，当选。\n故正确答案为D。\n【文段出处】中国青年网《晚上用电子设备易失眠》","no":48,"missingImage":false},{"type":"question","qid":"2615979","cat":"片段阅读","stem":"生命存在的首要条件是液态水，一颗行星是否宜居取决于表面温度能否维持液态水的存在。冰行星或冰卫星地表原本被冰雪覆盖，此前研究认为，随着恒星辐射增强，其地表冰雪最终会融化形成液态水，从而适宜生命生存。不过，最新研究证明，随着恒星辐射增强，冰行星或冰卫星将直接进入极端炎热的温室逃逸状态，表面温度将升至100摄氏度以上，液态水无法存在。一旦冰雪融化，行星地表反射能力的突然降低使其吸收恒星辐射的能力大大增强。此外，冰雪融化后，大量水汽进入大气，强温室效应也使地表温度进一步升高。\n下列说法与原文相符的是：","options":{"A":"宜居行星在事实上并不存在","B":"冰行星或冰卫星其实不宜居","C":"冰行星或冰卫星其实没有冰","D":"温室逃逸状态阻止了冰融化"},"answer":"B","explanation":"A项，根据“冰行星或冰卫星地表原本被冰雪覆盖……不过，最新研究证明……液态水无法存在”可知，冰行星或者冰卫星不宜居，而非所有行星均不宜居，故话题范围扩大，排除；\nB项，根据“冰行星或冰卫星地表原本被冰雪覆盖……不过，最新研究证明……液态水无法存在”可知，选项表述正确，当选；\nC项，根据“冰行星或冰卫星地表原本被冰雪覆盖”可知，冰行星或冰卫星是有冰的，故选项表述与文意相悖，排除；\nD项，根据“冰行星或冰卫星将直接进入极端炎热的温室逃逸状态，表面温度将升至100摄氏度以上，液态水无法存在”可知，温室逃逸状态使液态水无法存在，而非是阻止了冰融化，排除。\n故正确答案为B。\n【文段出处】《新研究显示宜居行星可能少于此前估计》","no":49,"missingImage":false},{"type":"question","qid":"2616122","cat":"片段阅读","stem":"当传统媒体还在琢磨受众喜欢什么内容的时候，算法推荐已迅速赢得了大量用户，媒体技术的变革，重塑了新闻产品的生产与分发，也重构了新媒体的内容生态。面对全媒体时代，我们需要用主流价值纾解“算法焦虑”、用社会责任规范“内容生产”、用优质平台凝聚“众人之智”，以更多更好的正能量、主旋律内容供给，让舆论天空更清朗、舆论生态更健康。\n最适合做这段文字标题的是：","options":{"A":"给以主流价值为底色的传统媒体内容产品插上算法分发的翅膀","B":"增强主流价值供给，纾解新媒体内容生产和传播中的技术问题","C":"面对算法焦虑和流量焦虑，主流媒体要保持主流价值内容定力","D":"用主流价值纾解“算法焦虑”：构建健康活跃的新媒体内容生态"},"answer":"D","explanation":"文段开篇引出背景，与传统媒体不同，算法推荐赢得了大量用户，重构了新媒体的内容生态。而后通过对策词“需要”引出新媒体内容生态下的应有之策：用主流价值纾解“算法焦虑”、用社会责任规范“内容生产”、用优质平台凝聚“众人之智”。全文行文结构为“引出背景-提出对策”，对策为重点，即构建新媒体的内容生态的应有之策，对应D项，且D项中双引号的使用，也使得表述比较符合标题特点——吸引眼球。\nA项，强调通过算法提高“传统媒体”的内容质量，而文段的对策是针对“新媒体”，故该项阐述为非重点，排除；\nB项，文段中并没有提到新媒体存在技术问题，属于无中生有，排除；\nC项，“主流媒体”表述错误，文段并未将媒体做主次之分，且文段重点讲的是“新媒体”，排除。\n故正确答案为D。 \n【文段出处】《用主流价值纾解“算法焦虑”（人民观点）——构建健康活跃的新媒体内容生态》","no":50,"missingImage":false},{"type":"question","qid":"2615981","cat":"片段阅读","stem":"世界卫生组织的调查指出，嗜糖之害，甚于吸烟，长期食用含糖量高的食物会使人的寿命明显缩短。近年来，中国人对糖的消耗量居高不下，特别是儿童。调查数据显示，10年前我国儿童人均每天喝饮料715毫升，10年后的今天翻了一番。目前市售的多数饮料含糖量为\u003cimg data-k=\"b956f6c8ed4d\">至\u003cimg data-k=\"5bd4251e5ae1\">，一瓶容量为500毫升的饮料，含糖量就在40克至55克之间。医学专家建议成人每天摄入的添加糖不宜超过50克，最好控制在25克以下。儿童每天摄入的添加糖不可以超过25克。然而，仅1瓶饮料中的添加糖含量就已经超过推荐值底线。殊不知，就在我们大快朵颐、痛快吃糖的同时，糖也在悄无声息地“吃掉”我们的健康。\n最适合做这段文字标题的是：","options":{"A":"甜蜜诱惑，难以抗拒","B":"减糖行动，刻不容缓","C":"嗜糖之害，甚于吸烟","D":"低糖饮食，有益健康"},"answer":"B","explanation":"文段首先引出糖摄入量过多会给人们的健康带来危害这一问题，然后后文通过“调查数据显示”列举我国儿童对糖的消耗量在不断增加的数值，对于前面的问题进行分析，并且通过“殊不知”依然强调糖摄入量过多的同时会损害健康，因此文段为提出问题分析问题的行文脉络，重点要去提出解决问题的对策，即不要过多摄入糖份，要注意减糖，对应B项。\nA项，“难以抗拒”为问题表述，文段侧重于强调解决问题，而非问题本身，排除；\nC项，“嗜糖之害”依然是强调问题本身，文段重点强调的是解决问题的对策，且本文段并非重点强调“嗜糖”与“吸烟”的对比，而是通过比较引出嗜糖的危害，文段更想表达的是如何解决糖摄入量过多这一问题，排除；\nD项，“有益健康”是意义表述，而非对策，对策与意义相比较，优先选择对策本身，排除。\n故正确答案为B。\n【文段出处】《“甜蜜诱惑”侵蚀孩子健康 儿童“减糖”“戒糖”刻不容缓》","no":51,"missingImage":false},{"type":"question","qid":"2615996","cat":"片段阅读","stem":"蟑螂的生殖分为有性生殖和孤雌生殖两种方式。蟑螂雌性个体生活在完全由雌性组成的群体中时，会进行孤雌生殖，产卵的时间也会提前。研究者通过实验分别验证蟑螂性别和雌性激素对孤雌生殖的影响。首先，将一只雌性蟑螂和被阉割的雄性蟑螂放在一起饲养，发现这只雌性蟑螂产卵的时间没有发生变化；接着，又为雌性个体定期提供雌性激素，造成它们生活在雌性群体中的假象，但它们的产卵时间也没有提前。据此，研究者推测蟑螂需要雌性散发特有的化学信号才能完成孤雌生殖，并非因为性激素或者其他化学信号的参与。\n根据上述文字，下列说法正确的是：","options":{"A":"雄性的出现影响了蟑螂的产卵时间","B":"纯雌性群体生活加快蟑螂繁殖速度","C":"定期提供雌性激素对蟑螂毫无作用","D":"孤雌生殖或依赖雌性特有化学信号"},"answer":"D","explanation":"A项，根据“研究者通过实验分别验证蟑螂性别和雌性激素对孤雌生殖的影响。首先，将一只雌性蟑螂和被阉割的雄性蟑螂放在一起饲养，发现这只雌性蟑螂产卵的时间没有发生变化”可知，雄性的出现并不会影响蟑螂的产卵时间，表述不正确，排除；\nB项，根据“蟑螂雌性个体生活在完全由雌性组成的群体中时，会进行孤雌生殖，产卵的时间也会提前”可知，纯雌性群体生活会使得蟑螂产卵的时间提前，文段中只提到“时间”，没有提到“繁殖速度”，无中生有，排除；\nC项，根据“又为雌性个体定期提供雌性激素，造成它们生活在雌性群体中的假象，但它们的产卵时间也没有提前”可知，定期为蟑螂提供雌性激素对蟑螂产卵时间提前并无作用，故选项话题偷换，且表述过于绝对，排除；\nD项，根据尾句“研究者推测蟑螂需要雌性散发特有的化学信号才能完成孤雌生殖，并非因为性激素或者其他化学信号的参与”可知，孤雌生殖或许需要依赖雌性散发的特有的化学信号，表述正确，当选。\n故正确答案为D。\n【文段出处】《除不尽的蟑螂：没有“男人”也能生生生》","no":52,"missingImage":false},{"type":"question","qid":"2616162","cat":"语句表达","stem":"①用小小的木制手织机，固定在房角一柱上，一面伸出憔悴的手来\n②做母亲的全按照一个地方的风气，当街坐下，织男子们束腰用的板带过日子\n③当白日照到这长街时，这一条街静静的像在午睡\n④敏捷地把手中犬骨线板压着手织机的一端，退着粗粗的棉线，一面用一个棕叶刷子为孩子们拂着蚊蚋\n⑤许多小小的屋里，湿而发霉的土地上，头发干枯脸儿瘦弱的孩子们，皆蹲在土地上或伏在母亲身边睡着了\n⑥什么地方柳树桐树上有新蝉单纯而又倦人的声音\n将以上6个句子重新排列，语序正确的是：","options":{"A":"③⑥⑤②①④","B":"⑤①②④③⑥","C":"⑥⑤①②④③","D":"⑤①⑥②④③"},"answer":"A","explanation":"观察选项，③、⑤和⑥充当首句，③“这长街”“这一条街”出现指代词，但是结合文段以及选项可知，文段中没有出现“这一条街”的指代对象，故③不能直接通过首句排除。⑤和⑥具体介绍长街上的屋子、人和声音，故首句不好判断。\n观察文段，①、④两句中有共同话题“手织机”，并且①句中出现“一面伸出憔悴的手来”，④中出现“一面用一个棕叶刷子为孩子们拂着蚊蚋”，共同信息以及成对出现关联词捆绑，故锁定A项。\n验证A项，③引出长街这一话题，⑥介绍长街树上有倦人的蝉声，⑤承接⑥中“倦人”，说孩子睡在母亲身边，②继续围绕母亲展开，说明母亲在街上织腰带，①、④两句进一步展开母亲的动作，并围绕手织机这一共同话题。逻辑通顺，话题衔接紧密，当选。\n故正确答案为A。\n【出处】沈从文《街》","no":53,"missingImage":false},{"type":"question","qid":"2615977","cat":"语句表达","stem":"①语言是符号体系，而每一种语言的符号体系都带着文化的烙印，都是这种语言的共同体集体认知的结果，都是文化的载体，这是语言的“体”\n②语言和文化是一体两面的，没有谁能够把语言和文化彻底分开，这是由语言的属性决定的\n③所以汉语国际教育不必把“文化传播”特意突出出来，因为学习一种语言不可能不涉及这种语言所负载的文化内容，这是不言而喻的\n④语言中隐含着使用这种语言的人和社会群体的价值观念，而这种价值观念往往是习焉不察的\n⑤语言也是思维工具和交际工具，我们在使用一种语言思维和交际的时候不可能不受这种语言的影响，这好似语言的“用”\n将以上5个句子重新排列，语序正确的是：","options":{"A":"②①⑤④③","B":"④①⑤②③","C":"②⑤①③④","D":"④②①⑤③"},"answer":"A","explanation":"从选项入手，判断首句，②的话题是“语言和文化”，④的话题是“语言和价值观念”，两句话没有明显的首句和非首句特征，不好判断，找其他线索。⑤出现关联词“也”，和前面一句话是并列关系。观察选项发现⑤前面有①和②，①提到“语言是符号体系”，和⑤构成并列，关联关系完整，排除C项。\n观察剩下句子发现，③出现结论标志词“所以”，符合尾句特征，但剩余选项都是③充当尾句，因此找③的捆绑集团，对比选项发现③前面有②④⑤三句话， ④提到“这种价值观念往往是习焉不察的”，可以和③的“不必特意突出”构成因果关系，并且④和⑤都在论述语言的使用，话题一致，可捆绑。基本锁定A项。\n继续验证可以发现，①⑤两句是对②句中语言的属性进行详细论述。\n故正确答案为A。","no":54,"missingImage":false},{"type":"question","qid":"2616116","cat":"片段阅读","stem":"全球数以百计的医疗机构声称可用干细胞疗法修复多发性硬化症患者受损的组织细胞。专家指出，这些机构直接向患者打广告称可治愈疾病，而实际上没有任何证据表明它们有效或不会造成伤害。在这种情况下，处理相关广告十分必要，某些类型的干细胞移植，例如使用血液或皮肤干细胞，经全面临床试验证实能治疗特定种类的癌症以及让烧伤病人完成植皮手术，因而得到监管机构批准。专家称，虽然干细胞疗法前景广阔，但许多潜在的干细胞疗法仍处于研发的最初阶段，尚未得到监管机构的批准，还需要通过严格的临床试验和监管手续来确定其是否安全有效。\n这段文字意在说明:","options":{"A":"血液和皮肤干细胞已广泛用于治疗","B":"干细胞疗法目前仍然存在一定风险","C":"监管组织应引入有效广告管理措施","D":"研发细胞和组织疗法仍是巨大挑战"},"answer":"B","explanation":"文段首先引出“干细胞疗法”这一话题，接着通过专家的观点，指出某些机构打广告称干细胞疗法可治愈疾病是没有证据的，进而说明，处理相关的广告十分必要，随后通过举例说明，有些干细胞移植是经过临床试验证实，因而得到监管机构批准的，由此可知，并非所有的干细胞疗法都是可行的。尾句依然通过专家的观点指出许多潜在的干细胞疗法还需要经过严格的临床试验确定是否安全有效。因此文段重在说明干细胞疗法依然有些问题存在，对应B项。\nA项，“血液和皮肤干细胞”属于例子内容，非重点，排除；\nC项，“监管组织应引入有效广告管理措施”，虽是对策表述，但偏离文段核心话题“干细胞疗法”，且文中处理相关广告只是为了说明有些干细胞疗法存在问题，非重点，排除；\nD项，“研发细胞和组织疗法”主题词范围扩大，文段具体围绕“干细胞疗法”展开，排除。\n故正确答案为B。\n【文段出处】《干细胞疗法有风险 专家呼吁严管“干细胞医疗旅游”》","no":55,"missingImage":false},{"type":"question","qid":"2615994","cat":"片段阅读","stem":"技术是一把“双刃剑”，应用得当可以造福社会、造福人民，应用不当会危害社会、危害人民。当前，从整个世界范围来看，网络安全威胁不断增加，信息安全问题日益突出。没有网络安全就没有国家安全，没有信息安全就谈不上让信息化更好造福人民。信息时代，人们享受着数字化生活带来的诸多便利，但网络黑客、互联网诈骗、侵犯个人隐私等又让很多人“中招”。可见，信息化应用越深入，就越要重视信息安全问题。\n这段文字意在强调：","options":{"A":"必须完善法律法规，为数字化生活提供法治保障","B":"解决信息安全问题，提高数字化生活的安全系数","C":"降低信息化应用成本，增进人民福祉、造福社会","D":"提高数字化生活质量，就必须加强信息技术手段"},"answer":"B","explanation":"文段先指出“技术是一把‘双刃剑’”，交代了当前的背景。随后重点描述目前网络信息安全问题十分突出，关乎国家和人民的切身利益。接下来通过正反论证分析问题，指出信息时代人们享受着数字化生活的便利，但又面临网络安全的威胁。最后，由结论词“可见”总结前文，并提出对策“要重视信息安全问题”。故文段为分总结构，意在指出当下需要重视信息安全问题，对应B项。\nA项，“完善法律法规”无中生有，排除；\nC项，“降低信息化应用成本”无中生有，排除；\nD项，文段讨论的核心并非是提高数字化生活质量的问题，而是信息安全问题，且提出的对策是“重视信息安全”，而非“加强信息技术手段”，排除。\n故正确答案为B。\n【文段出处】《创造更好的数字化生活》","no":56,"missingImage":false},{"type":"question","qid":"2615993","cat":"片段阅读","stem":"近来，多家情商教育机构针对不同年龄段推出相应套餐，“情商班”火爆家长圈。情商是控制和驾驭情绪的能力，对人的生活和工作有重要的作用。可是，在很多人的心里，情商的内涵已经被异化，最早的情商概念和如今流行的情商观念大相径庭。许多人对情商的理解，是圆滑世故、阿谀奉承的另一种说法。实际上，情商的核心既是对自身情绪的认识和控制能力，也包括与人交往、融入集体的能力。这两种能力的培养，需要在日常生活中实践。孩子能否培养出良好的情绪控制能力和社交能力，很大程度上取决于家长，任何情商培训都无法取代日常生活中的情商培养。\n接下来最可能讲述的是：","options":{"A":"情商补习应当引起家长高度关注","B":"家长在家庭教育中的身体力行","C":"家长要理性地看待情商培训班","D":"需要培养和提高家长的情商"},"answer":"C","explanation":"根据提问方式可知，本题为接语选择题，应重点关注文段最后讨论的核心话题。文段开篇引出“情商教育”的话题并介绍情商的作用，而后通过转折词“可是”强调很多人对情商的认知存在偏差并进行具体说明，接着通过“实际上”论述了情商的核心，通过“需要”提出对策，指出情商应在日常生活中实践得到，尾句进一步论述，日常的情商培养中家长应起到重要作用，而不能过分依赖培训班。故接下来最有可能详细介绍家长面对情商培训班的态度，对应C项。\nA项，与文意相悖，文段之前提到自身情绪的认识和控制能力需要在日常生活中实践，并非是靠补习，排除；\nB项，“家庭教育”范围扩大，文中强调的是情商的培养，排除；\nD项，“培养和提高家长的情商”与文段话题衔接不当，排除。\n故正确答案为C。\n【文段出处】《“情商班”火爆家长圈 不如家长先负起责任》","no":57,"missingImage":false},{"type":"question","qid":"2615982","cat":"语句表达","stem":"非遗曲艺周、非遗公开课、非遗影像展等3700多项活动在全国同步展开，400多项体验传承活动在20多个省区市推出······刚刚过去的“文化和自然遗产日”，一系列精彩的活动让人们走进“养在深闺人未识”的文化遗产，感知岁月积淀的文化魅力，也让人们意识到，                    。 \n填入划横线部分最恰当的一项是：","options":{"A":"文化遗产保护为先，还需要社会公众的高度参与","B":"文化遗产可以摆脱高冷的标签，飞入寻常百姓家","C":"如何让文化遗产“活”起来也是值得思考的话题","D":"我国能有如此丰富的文化遗产，得益于保护管理"},"answer":"B","explanation":"横线出现在文段结尾，起到总结前文的作用。文段开篇以非遗的各种活动为例引出话题，随后通过介绍“文化和自然遗产日”的精彩活动，指出这一系列活动让人们走进文化遗产，感受文化魅力。横线前通过“也”表并列，故所填句子也应表达各种非遗的活动让平时“养在深闺”的文化遗产能与普通百姓接触的意思，对应B项。\nA、D两项：文段未提及对文化遗产的“保护”，属无中生有，排除。\nC项：选项中“让文化遗产‘活’起来”的表述不明确，文段强调的是让平时不常见的文化遗产走近普通百姓，排除。\n故正确答案为B。\n【文段出处】《让文化遗产“活”在寻常百姓家》","no":58,"missingImage":false},{"type":"question","qid":"2616144","cat":"语句表达","stem":"压缩空气储能属于一种物理方式的储能，即空气在整个过程中只存在温度、压强等状态的变化，而不会发生化学方面的变化。储存了众多电力的压缩空气需要放在一间封闭性极好的“屋子”里，而这间“屋子”的“主人”就是盐。食盐开采后会自然留下一个场所，学名叫做“盐穴”。“盐穴”是一种极其宝贵的不可再生资源，并且密封性能良好。然而，长期以来这种资源的利用系数很低。由于盐岩具有良好的蠕变特性、自愈合特性，渗透率极低，并且不会与空气中的氧气发生反应。因此，                    。\n填入划横线部分最恰当的一项是：","options":{"A":"要依托盐穴资源的优势发展储能产业","B":"“盐穴”是储存高压空气的理想场所","C":"应当利用盐穴储能改善发电与用电","D":"要大力开发盐岩提高能源利用效率"},"answer":"B","explanation":"横线出现在文段结尾，且横线前出现“因此”，故需要结合前文内容进行分析。前文说压缩空气储能属于一种物理方式的储能，它需要放在一间封闭性极好的“屋子”里，即“盐穴”。后文接着分析“盐穴”密封性能良好、有良好蠕变特性、自愈合特性，渗透率极低，不会与空气中的氧气发生反应等优点。“因此”应该承接前文进行总结，所以横线上的内容应该围绕“盐穴”封闭性好，可以被用来存储高压空气展开，对应B项。\nA项，“发展储能产业”在文段没有体现，无中生有，排除；\nC项，“利用盐穴储能改善发电与用电”在文段没有体现，无中生有，排除；\nD项，“大力开发盐岩”在文段没有体现，无中生有，排除。\n故正确答案为B。\n【文段出处】《平时储能用时取出 盐穴竟然是能量银行？》","no":59,"missingImage":false},{"type":"question","qid":"2616118","cat":"语句表达","stem":"网络书店的页面为了适应人眼的视野范围，又窄又长，容易让人疲倦，而且图书多按销量或排行榜来呈现。随着人工智能的发展，现在还可以利用大数据算法，根据读者浏览和购买历史来确定其读书品味，推荐的书目符合读者口味，这就不可避免地形成“蚕茧效应”，读者只能看到喜欢看的，长此以往，                    ，这样的不足正好可以通过实体书店来弥补。现在不少大型书店的在售图书多到十万种以上，一入书城，如进书海，给读者带来的体验是网络书店无法比拟的。此时，书店如果能从众多图书中挑选高品质图书，用品质赢得读者，就可以在和网店的竞争中凸显竞争力。\n填入划横线部分最恰当的一项是：","options":{"A":"读者在网络书店的收获越来越小","B":"逛实体书店才可能带来意外惊喜","C":"读者阅读视野不知不觉日益狭窄","D":"网络书店无法满足读者阅读需求"},"answer":"C","explanation":"横线出现在文段中间，需要结合前后文内容进行分析。前文论述网络书店的不足之处，读者只能看到喜欢看的，即能看到的书会变少；横线后指出这个不足可以靠实体书店来弥补，因为“一入书城，如进书海”，也就是图书种类多，可从众多图书中挑选。故横线处所填内容应表达出因读者只能看到喜欢看的，时间长了其阅读的视野也就越来越窄，对应C项。\nA项，文段围绕的核心话题是读者所看到的图书多与少，而非“收获”，排除；\nB项，“意外惊喜”在文段中并未提及，前后衔接不当，排除；\nD项，“无法满足”表述过于绝对，网络书店可以更精准地满足读者阅读需求，但会使读者的阅读视野越来越窄，并非无法满足读者的阅读需求，排除。\n故正确答案为C。\n【文段出处】《书店，不能止步于外表美》","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"2616087","cat":"数学运算","stem":"某企业员工组织周末自驾游。集合后发现，如果每辆小车坐5人，则空出4个座位；如果每辆小车少坐1人，则有8人没坐上车。那么，参加自驾游的小车有：","options":{"A":"9辆","B":"10辆","C":"11辆","D":"12辆"},"answer":"D","explanation":"设一共有\u003cimg data-k=\"5320a525f2bc\">辆车，根据总人数一定，列方程得：\u003cimg data-k=\"774d89323477\">。解得\u003cimg data-k=\"024b50f75181\">，故参加自驾游的小车有12辆。\n故正确答案为D。","no":61,"missingImage":false},{"type":"question","qid":"2616070","cat":"数学运算","stem":"小明每天从家中出发骑自行车经过一段平路，再经过一道斜坡后到达学校上课。某天早上，小明从家中骑车出发，一到校门口就发现忘带课本，马上返回，从离家到赶回家中共用了1个小时，假设小明当天平路骑行速度为9千米/小时，上坡速度为6千米/小时，下坡速度为18千米/小时，那么小明的家距离学校多远？","options":{"A":"3.5千米","B":"4.5千米","C":"5.5千米","D":"6.5千米"},"answer":"B","explanation":"设小明家到学校的距离为\u003cimg data-k=\"648049a6eba4\">，在往返的过程中，上坡和下坡的路程均为斜坡的长度即距离相等，根据等距离平均速度公式，上下坡的平均速度\u003cimg data-k=\"6dd416864ef5\">千米/小时，与平路速度相等，故往返全程的平均速度均为9千米/小时，往返一次走了两个全程，\u003cimg data-k=\"7ebab4dc6bbc\">千米/小时\u003cimg data-k=\"3d8a1882c3c9\">小时，得\u003cimg data-k=\"d7c3c802be29\">千米。\n故正确答案为B。","no":62,"missingImage":false},{"type":"question","qid":"2616086","cat":"数学运算","stem":"甲、乙、丙三人去超市买了100元的商品，如果甲付钱，那么甲剩下的钱是乙、丙两人钱数之和的\u003cimg data-k=\"7423995ce21e\">；如果乙付钱，则乙剩下的钱是甲、丙两人钱数之和的\u003cimg data-k=\"6f237a77bd4d\">；如果丙付钱，丙用他的会员卡可享受9折优惠，结果丙剩下的钱是甲、乙两人钱数之和的\u003cimg data-k=\"bec3fe75cd62\">；那么，甲、乙、丙三人开始时一共带了多少钱？","options":{"A":"850元","B":"900元","C":"950元","D":"1000元"},"answer":"A","explanation":"方法一：设开始时甲带了\u003cimg data-k=\"5320a525f2bc\">元，乙带了\u003cimg data-k=\"c1beececd683\">元，丙带了\u003cimg data-k=\"08caa03ce8e3\">元，则由题意可得：\u003cimg data-k=\"6e804edb85b3\">······①，\u003cimg data-k=\"9797bf9e3fac\">······②，\u003cimg data-k=\"ac90106b811c\">······③，联立方程组，解得\u003cimg data-k=\"1749419cc7b5\">，\u003cimg data-k=\"02de4f240c2c\">，\u003cimg data-k=\"42b0646ee82e\">。故甲、乙、丙三人开始时一共带了\u003cimg data-k=\"f3d116c2f8fa\">元。\n方法二：题干出现比例，虽然钱数不一定是整数，但选项均为整数，说明总钱数一定为整数，故优先考虑利用倍数特性解题。由题意可知，\u003cimg data-k=\"6b21145b2c7a\">，即\u003cimg data-k=\"2cb59d865eba\">为2份，\u003cimg data-k=\"2e6d7ddba7ca\">为13份，则\u003cimg data-k=\"ac2e670b2aa2\">为15份，即三人总钱数减去100是15的倍数，观察选项，排除B、C两项；丙用会员卡需支付\u003cimg data-k=\"6f47e66ab914\">元，则\u003cimg data-k=\"8964aebebe0e\">，即\u003cimg data-k=\"636974a11025\">为1份，\u003cimg data-k=\"e4d651fd2513\">为3份，则\u003cimg data-k=\"aca942110e7c\">为4份，即\u003cimg data-k=\"0fa0b6bc631c\">是4的倍数，排除D项，只有A项符合。\n故正确答案为A。\n备注：本题考场上应该选择倍数特性法，如果用方程法则太浪费时间。","no":63,"missingImage":false},{"type":
