<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">

<div class="mask" id="mask">

</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2021-湖南","title":"2021年湖南省公务员录用考试《行测》题（网友回忆版）","year":"2021","group":"湖南","modules":[{"label":"常识判断","items":[{"type":"question","qid":"3523517","cat":"人文常识","stem":"党的十九届五中全会审议通过的《中共中央关于制定国民经济和社会发展第十四个五年规划和二〇三五年远景目标的建议》，明确提出到2035年建成社会主义文化强国的远景目标。关于社会主义文化强国建设目标任务，下列表述正确的有几项？\n①提高社会文明程度\n②提升公共文化服务水平\n③健全现代文化产业体系\n④加强对外文化交流和多层次文明对话","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查政治常识。\n党的十九届五中全会审议通过的《中共中央关于制定国民经济和社会发展第十四个五年规划和二〇三五年远景目标的建议》中在繁荣发展文化事业和文化产业，提高国家文化软实力方面部署了三个方面的重点任务：一是提高社会文明程度，二是提升公共文化服务水平，三是健全现代文化产业体系。以讲好中国故事为着力点，创新推进国际传播，加强对外文化交流和多层次文明对话。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"3522699","cat":"经济常识","stem":"下列关于数字货币和数字人民币的表述不准确的是:","options":{"A":"从2020年下半年开始，数字人民币已在深圳、苏州等地展开大规模试点测试","B":"数字人民币是由中国人民银行发行的具有国家信用背书的法定货币，是数字形式的人民币","C":"没有银行账户，同样可以享受支付等金融服务，但持有的数字人民币在数字钱包里不计付利息","D":"数字人民币装在无形的数字钱包里，可用于线下和线上交易，但没有网络就不可付款，即不能“离线”支付"},"answer":"D","explanation":"本题考查经济常识。\nA项正确，2020年下半年以来，数字人民币在深圳、苏州等地面向不定向公众展开大规模试点测试。\nB项正确，数字人民币是由中国人民银行发行的具有国家信用背书的法定货币，是数字形式的人民币。数字人民币的定位是替代一部分现金。\nC项正确，数字人民币以广义账户体系为基础、支持银行账户松耦合，即意味着用户如果没有银行账户，同样可以利用手机号等唯一身份标识开通数字钱包，使用数字人民币进行支付，但持有的数字人民币在数字钱包里不计付利息。\nD项错误，目前，现金主要以纸币和硬币等实物形态存在，而数字人民币可以理解为数字形态的现金。纸币、硬币装在有形的钱包里，携带较为不便，多用于线下交易；数字人民币装在无形的数字钱包里，可用于线下和线上交易，且数字人民币具有“离线”支付功能。所谓“离线”支付，是指在无网或弱网条件下，用户进行交易或转款时不连接后台系统，而是在数字钱包中验证用户身份、确认交易信息并进行支付的方式，即没有网络也能付款。\n本题为选非题，故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"3522701","cat":"人文常识","stem":"王某向李某借款1万元，李某当场向王某交付现金1万元，王某向李某出具借条一份，张某在该借条上签字，后王某没有按时还钱，李某将王某和张某同时起诉至法院，要求王某还钱，并要求张某承担连带责任。关于张某的责任，下列说法正确的是:","options":{"A":"张某只是作为见证人签字，无须承担任何责任","B":"张某在别人的借条上签字，应当推定为保证人，并承担保证责任","C":"张某在别人的借条上签字，视同共同借款人，应当承担共同还款责任","D":"只要借条上没有任何明确表述或其他事实表明张某愿意承担保证责任的，张某即无须承担任何责任"},"answer":"D","explanation":"本题考查法律常识。\n根据《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第二十条规定：“他人在借据、收据、欠条等债权凭证或者借款合同上签名或者盖章，但是未表明其保证人身份或者承担保证责任，或者通过其他事实不能推定其为保证人，出借人请求其承担保证责任的，人民法院不予支持。”故只要借条上没有任何明确表述或其他事实表明张某愿意承担保证责任的，张某即无须承担任何责任。\n故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"3522662","cat":"人文常识","stem":"某小区业主拟将其住宅改变为经营性民宿，下列选项中不属于其应当具备的前提条件是：","options":{"A":"应当遵守国家有关公共防疫的规定","B":"应当遵守由业主共同制定的管理规约","C":"应当获得该业主所在楼栋的其他全体业主同意","D":"应当获得小区全体业主三分之二以上多数同意"},"answer":"D","explanation":"本题考查法律常识。\nA、B、C三项正确，D项错误。根据《民法典》第二百七十九条规定：“业主不得违反法律、法规以及管理规约，将住宅改变为经营性用房。业主将住宅改变为经营性用房的，除遵守法律、法规以及管理规约外，应当经有利害关系的业主一致同意。”故业主将住宅改变为经营性用房民宿，应当遵守法律、法规（国家有关公共防疫的规定等）及小区业主共同制定的管理规约，应当经有利害关系的业主（业主所在楼栋的其他全体业主）一致同意。\n本题为选非题，故正确答案为D。","no":4,"missingImage":false},{"type":"question","qid":"3523538","cat":"法律常识","stem":"下列关于2021年3月1日起施行的《中华人民共和国长江保护法》的亮点描述准确的是：\n①做好了统筹协调、系统保护的顶层设计\n②坚持把保护和修复长江流域生态环境放在压倒性位置\n③突出共抓大保护、不搞新开发\n④坚持责任导向，加大处罚力度\n⑤切实增强了长江保护和发展的系统性、整体性、协同性","options":{"A":"①③④","B":"②④⑤","C":"①②③④","D":"①②④⑤"},"answer":"D","explanation":"本题考查法律常识。\n①正确，该法中规定国家建立长江流域协调机制，统一指导、统筹协调、整体推进长江保护工作；按照中央统筹、省负总责、市县抓落实的要求，建立长江保护工作机制，明确各级政府及其有关部门、各级河湖长的职责分工；建立区域协调协作机制，明确长江流域相关地方根据需要在地方性法规和政府规章制定、规划编制、监督执法等方面开展协调与协作，切实增强长江保护和发展的系统性、整体性、协同性。故该法做好了统筹协调、系统保护的顶层设计。\n②正确，该法通过规定更高的保护标准、更严格的保护措施，加强山水林田湖草整体保护、系统修复。如强化水资源保护，加强饮用水水源保护和防洪减灾体系建设，完善水量分配和用水调度制度，保证河湖生态用水需求；落实党中央关于长江禁渔的决策部署，加强禁捕管理和执法工作等。故该法体现了把保护和修复长江流域生态环境放在压倒性位置。\n③错误，根据《中华人民共和国长江保护法》第三条规定：“长江流域经济社会发展，应当坚持生态优先、绿色发展，共抓大保护、不搞大开发。”“不搞新开发”表述错误。\n④正确，该法强化考核评价与监督，实行长江流域生态环境保护责任制和考核评价制度，建立长江保护约谈制度，规定国务院定期向全国人大常委会报告长江保护工作；坚持问题导向，针对长江禁渔、岸线保护、非法采砂等重点问题，在现有相关法律的基础上补充和细化有关规定，并大幅提高罚款额度，增加处罚方式，补齐现有法律的短板和不足，切实增强法律制度的权威性和可执行性。故该法体现了坚持责任导向，加大处罚力度。\n⑤正确，该法做好了统筹协调、系统保护的顶层设计，明确了各方职责分工，切实增强长江保护和发展的系统性、整体性、协同性。\n故①②④⑤正确。\n故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"3522668","cat":"法律常识","stem":"关于《中华人民共和国民法典》，下列说法错误的是：","options":{"A":"允许抵押耕地使用权","B":"将绿色原则作为民法的基本原则","C":"明确了生态环境损害的修复和赔偿规则","D":"将无民事行为能力人最高年龄标准调整为10周岁"},"answer":"D","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国民法典》第三百九十九条第二项规定：“下列财产不得抵押：······（二）宅基地、自留地、自留山等集体所有土地的使用权，但是法律规定可以抵押的除外；······”民法典删除了“耕地”不得抵押的情形，故允许抵押耕地使用权。\nB项正确，根据《中华人民共和国民法典》第九条规定：“民事主体从事民事活动，应当有利于节约资源、保护生态环境。”绿色原则是民法的基本原则之一。\nC项正确，根据《中华人民共和国民法典》第一千二百三十二条规定：“侵权人违反法律规定故意污染环境、破坏生态造成严重后果的，被侵权人有权请求相应的惩罚性赔偿。”第一千二百三十四条规定：“违反国家规定造成生态环境损害，生态环境能够修复的，国家规定的机关或者法律规定的组织有权请求侵权人在合理期限内承担修复责任。侵权人在期限内未修复的，国家规定的机关或者法律规定的组织可以自行或者委托他人进行修复，所需费用由侵权人负担。”故《民法典》明确了生态环境损害的修复和赔偿规则。\nD项错误，根据《中华人民共和国民法典》第二十条规定：“不满八周岁的未成年人为无民事行为能力人，由其法定代理人代理实施民事法律行为。”故无民事行为能力人最高年龄标准并没有调整为十周岁，而是八周岁。\n本题为选非题，故正确答案为D。","no":6,"missingImage":false},{"type":"question","qid":"3522655","cat":"人文常识","stem":"“秦王扫六合，虎视何雄哉！挥剑决浮云，诸侯尽西来。”下列历史事件不是发生在此诗所咏“秦王”在位期间的是：","options":{"A":"蔺相如完璧归赵","B":"唐雎不辱使命","C":"荆轲刺秦王","D":"郑国疲秦"},"answer":"A","explanation":"本题考查人文常识。\n“秦王扫六合，虎视何雄哉！挥剑决浮云，诸侯尽西来。”出自唐代李白的《古风·秦王扫六合》，意为秦始皇嬴政以虎视龙卷之威势，扫荡、统一了战乱的中原六国。天子之剑一挥舞，漫天浮云消逝，各国的富贵诸侯尽数迁徙到咸阳。\nA项错误，蔺相如完璧归赵发生于战国时期，讲述的是秦昭王许诺赵王以十五座城换取和氏璧，但当使臣蔺相如献璧之后，秦昭王却不提换城之事，蔺相如施巧计使和氏璧重归赵国。蔺相如完璧归赵并非发生在秦始皇嬴政在位期间。\nB项正确，唐雎不辱使命讲述的是唐雎奉安陵君之命出使秦国，与秦王展开面对面的激烈斗争，终于折服秦王，保存国家，完成使命的经过，歌颂了唐雎不畏强暴、敢于斗争的爱国精神。其中的秦王即秦始皇嬴政，当时其还未称皇帝。\nC项正确，荆轲刺秦王讲述了战国时期荆轲刺杀秦王嬴政这一悲壮的历史故事，反映了当时的社会政治情况，表现了荆轲重义轻生、为燕国勇于牺牲的精神。\nD项正确，郑国疲秦中的郑国是韩国派往秦国的一个间谍，韩桓王试图通过他游说秦王嬴政修筑一条连接泾水和洛水的运河，达疲秦之效，以阻止秦国进攻韩国的步伐。岂知事与愿违，“疲秦之计”倒成了“强国之策”，运河的修筑成功，使得一向落后的关中农业迅速发展起来。\n本题为选非题，故正确答案为A。","no":7,"missingImage":false},{"type":"question","qid":"3522660","cat":"人文常识","stem":"下列诗句对应的节气中，我国大部分地区一天中白昼短于黑夜的是：","options":{"A":"谷雨春光晓，山川黛色青","B":"露从今夜白，月是故乡明","C":"清明时节雨纷纷，路上行人欲断魂","D":"辛苦孤花破小寒，花心应似客心酸"},"answer":"D","explanation":"本题考查地理国情。\n每年秋分过后，太阳直射点开始由赤道进入南半球，北半球开始昼短夜长，一天中白昼短于黑夜，直至次年春分，太阳直射点由赤道进入北半球，北半球才开始昼长夜短。所以，我国大部分地区白昼短于黑夜的时间段是秋分至次年的春分。而秋分是二十四节气中的第16 个节气，于每年的公历9月22-24日交节；春分是二十四节气中的第4个节气，于每年的公历3月20日-21日交节。\nA项错误，“谷雨春光晓，山川黛色青”出自唐代元稹的《咏廿四气诗·谷雨三月中》，描写了春天的最后一个节气谷雨这天的天光风物，生意葱茏。谷雨是二十四节气之第六个节气，于每年公历4月19日-21日交节，在秋分之前，不符合题意。\nB项错误，“露从今夜白，月是故乡明”出自唐代杜甫的《月夜忆舍弟》，意为从今夜就进入了白露节气，月亮还是故乡的最明亮。白露是二十四节气中的第十五个节气，时间点在公历每年9月7日到9日，在秋分之前，不符合题意。\nC项错误，“清明时节雨纷纷，路上行人欲断魂”出自唐代杜牧的《清明》，描写清明春雨中所见，色彩清淡。清明交节时间在公历4月5日前后，在秋分之前，不符合题意。\nD项正确，“辛苦孤花破小寒，花心应似客心酸”出自南宋范成大的《窗前木芙蓉》，意为孤独凄清的木芙蓉，冒着初秋寒意而开，花的心就像作者自己的心一样，凄楚不已。小寒是二十四节气中的第二十三个节气，于每年公历1月5-7日交节。在秋分之后，此时我国大部分地区一天中白昼短于黑夜，符合题意。\n故正确答案为D。","no":8,"missingImage":false},{"type":"question","qid":"3522694","cat":"人文常识","stem":"下列历史名人按生活年代先后排序正确的是：","options":{"A":"周文王—管仲—孔子","B":"周公旦—李斯—楚庄王","C":"孙膑—诸葛亮—蒙恬","D":"屈原—勾践—伍子胥"},"answer":"A","explanation":"本题考查人文常识。\nA项正确，周文王姬昌（前1152年―前1056年），周朝奠基者，其在位期间勤于政事，重视发展农业生产，礼贤下士，广罗人才。管仲（约公元前723年—公元前645年），春秋前期齐国著名的政治家、思想家，被齐桓公任命为相，在齐国进行了政治、经济等方面的一系列改革。孔子（公元前551年—公元前479年），春秋时期思想家、教育家，儒家学派的创始人。选项排序无误。\nB项错误，周公旦，西周初期杰出的政治家、军事家、思想家、教育家，曾两次辅佐周武王东伐纣王，并制作礼乐。李斯，战国末期楚国人，秦代著名的政治家、文学家和书法家，法家代表人物之一。楚庄王熊旅，春秋时期楚国国君，楚庄王元年（前613年）至楚庄王二十三年（前591年）在位，春秋五霸之一。选项排序有误，楚庄王生活的年代在李斯之前。\nC项错误，孙膑是战国时期齐国军事家，春秋战国时期诸子百家之一的兵家代表人物，其军事思想主要集中于《孙膑兵法》。诸葛亮是三国时期蜀汉丞相，先后辅佐刘备、刘禅两朝。蒙恬，秦朝时期名将，秦统一六国后，蒙恬三十万大军北击匈奴，收复河南之地，威震匈奴，被誉为“中华第一勇士”。选项排序有误，蒙恬生活的年代在诸葛亮之前。\nD项错误，屈原（约公元前340年—公元前278年），战国时期楚国诗人、政治家，被誉为“楚辞之祖”。越王勾践（约公元前520年-公元前464年），夏禹后裔，越王允常之子，春秋末年越国国君。伍子胥（约公元前559年-公元前484年），春秋末期吴国大夫、军事家。选项排序有误，屈原生活的年代在伍子胥、勾践之后。\n故正确答案为A。","no":9,"missingImage":false},{"type":"question","qid":"3522659","cat":"人文常识","stem":"新文化运动是一场思想文化革新、文学革命运动。下列新文化运动代表人物与其作品对应错误的是∶","options":{"A":"蔡元培—《中国伦理学史》","B":"陈独秀—《文学改良刍议》","C":"胡适—《中国哲学史大纲》","D":"李大钊—《布尔什维主义的胜利》"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，《中国伦理学史》是由蔡元培所作的第一部系统整理和研究中国古代伦理思想发生、发展及其变迁的学术著作，全书分绪论、先秦创史时代、汉唐继承时代、宋明理学时代四大部分32章，系统地介绍了中国古代伦理学界重要的流派及主要代表人物，并阐述了各家学说的要点、源流及发展。\nB项错误，《文学改良刍议》是由胡适所作，并于1917年1月发表。《文学改良刍议》是倡导文学革命的第一篇文章。\nC项正确，《中国哲学史大纲》是胡适写定于1918年9月的书，此书一出版即因其方法和见解的创新而极受注意，3年时间再版了7次。此书被誉为：用现代学术方法系统研究中国古代哲学史的第一部著作，它的出版被视为中国哲学史学科成立的标志。\nD项正确，《布尔什维主义的胜利》是由李大钊所作，于1918年11月载于《新青年》。文章热烈欢呼十月革命的胜利，认为这是民主主义的胜利，是布尔什维的胜利，是世界劳工阶级的胜利。\n本题为选非题，故正确答案为B。","no":10,"missingImage":false},{"type":"question","qid":"3522696","cat":"人文常识","stem":"下列与地震有关的说法错误的是：","options":{"A":"冲击地震震源浅，影响范围小","B":"水库蓄水、地下抽水可诱发地震","C":"火山地震与构造地震常有密切关系","D":"我国的强震绝大部分是深源构造地震"},"answer":"D","explanation":"本题考查地理国情。\nA项正确，冲击地震因山崩、滑坡等原因引起，或因碳酸盐岩地区岩层受地下水长期溶蚀形成许多地下溶洞，洞顶塌落引起，约占地震总数的\u003cimg data-k=\"815ec268d3d4\">，震源很浅，影响范围小，震级也不大。\nB项正确，在一定条件下，人类的工程活动可以诱发地震，诸如水库蓄水、城市或油田的抽水或注水、矿山坑道的崩塌、以及人工爆破或地下核爆炸等都能引起当地出现异常的地震活动，这类地震活动统称为诱发地震。\nC项正确，火山地震可以是直接由火山爆发引起，也可能是因火山活动引起构造变动，或是因构造变动引起火山喷发，从而导致地震。构造地震是由构造变动特别是断裂活动所产生的地震。因此，火山地震与构造地震常有密切关系。\nD项错误，全球绝大多数地震是构造地震，约占地震总数的\u003cimg data-k=\"98d1a3adb731\">。其中大多数又属于浅源地震，影响范围小，对地面及建筑物的破坏非常强烈，常引起生命财产的重大损失。我国的强震绝大部分是浅源构造地震，其中\u003cimg data-k=\"cd4db1324e77\">以上均与断裂活动有关。\n本题为选非题，故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"3523562","cat":"人文常识","stem":"被誉为“史家之绝唱，无韵之离骚”的史学巨著《史记》以本纪、世家、列传来记载历代王朝与人物，对秦末农民起义领袖陈胜，《史记》作者给予了高度评价，其传记被列入:","options":{"A":"本纪","B":"百官公卿表","C":"世家","D":"列传"},"answer":"C","explanation":"本题考查人文常识。\n《史记》全书包括十二本纪（记历代帝王言行政绩）、三十世家（记诸侯国和汉代诸侯、勋贵兴亡）、七十列传（记重要人物的言行事迹，主要叙人臣，其中最后一篇为自序）、十表（大事年表）、八书（记各种典章制度记礼、乐、音律、历法、天文、封禅、水利、财用）。\n《陈涉世家》是汉代史学家、文学家司马迁创作的一篇文章，列于《史记》第四十八篇，是秦末农民起义领袖陈胜、吴广的传记。此文以陈胜、吴广的活动为线索，详细地记述了陈胜起义的全过程，以及相继而起的各路起义军的胜败兴替，描述了起义军的浩大声势，肯定了陈胜在反抗秦王朝统治斗争中的功绩。同时，文章也论述了陈胜起义最终失败的原因：起义领袖缺乏指挥全局的能力、自身蜕化、用人不当，导致起义军内部离心离德。全文运用语言、动作、神态描写等多种技巧来塑造人物形象，生动真实地再现了这一场斗争的历史图景。\n故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"3522675","cat":"人文常识","stem":"关于农谚“小雪雪满天，来岁必丰年”所涉及的原理，下列说法错误的是：","options":{"A":"新雪孔隙度高、空气多，对土壤有防冻保湿作用","B":"雪融化时吸收土壤内部热量，越冬虫卵不易存活","C":"雪中含有大量磷化物，融化后可为土壤提供肥料","D":"雪融化时入土壤，提高土壤含水量，缓解春旱"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，新雪的密度低、孔隙度高，贮藏在新雪中的空气多，而空气是热的不良导体，因此土壤中热量的散失较少，可以起到防冻保湿的作用。\nB项正确，雪融化时从土壤中吸收许多热量，这时土壤会突然变得非常寒冷，温度降低许多，越冬虫卵不易存活。\nC项错误，雪是大量白色不透明冰晶和其聚合物组成的降水，由大气中的水蒸气直接凝华而成。根据测定，雪水中含有一定量的氮化物。雪水渗入土壤，就等于施了一次氮肥。用雪水喂养家畜家禽、灌溉庄稼都可收到明显的效益。\nD项正确，寒潮以后，天气渐渐回暖，雪慢慢融化，雪融下去的水可以提高土壤含水量，给庄稼积蓄很多水，对春耕播种以及庄稼的生长发育都很有利。\n本题为选非题，故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"3522672","cat":"人文常识","stem":"下列关于吊扇悬挂点的拉力描述正确的有：\n①吊扇不转动时，悬挂点的拉力等于重力\n②吊扇转动时，悬挂点的拉力小于重力\n③吊扇转速越大，悬挂点的拉力越小\n④吊扇转速越小，悬挂点的拉力越小","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查科技常识。\n①、②正确，吊扇不转动时，悬挂点对吊扇的拉力等于吊扇的重力，吊扇旋转时要向下扇风，即对空气有向下的压力，根据牛顿第三定律，空气也对吊扇有一个向上的反作用力，使得悬挂点对吊扇的拉力变小。\n③正确、④错误，吊扇转动时空气对吊扇叶片有向上的反作用力，转速越大，此反作用力越大，悬挂点的拉力越小。\n因此①②③正确。\n故正确答案为C。","no":14,"missingImage":false}],"count":14,"answerable":14,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"3522656","cat":"逻辑填空","stem":"教育，最终都是为了促进人的全面发展，帮助下一代提高生存能力。批评惩戒和赏识鼓励是            的两种方式，有些时候，“当头棒喝”甚至比温言软语更有效果。\n填入画横线部分最恰当的一项是：","options":{"A":"如影随形","B":"并行不悖","C":"各有所长","D":"不可或缺"},"answer":"B","explanation":"根据后文“有些时候，‘当头棒喝’甚至比温言软语更有效果”可知，横线处应表示，两种方式都有效果，并不存在“当头棒喝”就效果不好之意。B项“并行不悖”指同时进行，互相不违背，可体现出两种方式虽看似完全相反，但都可以起到教育作用之意，符合文意，当选。\nA项“如影随形”指好像影子总是跟着身体一样。比喻两个事物关系密切或两个人关系密切不能分离。“批评惩戒”与“赏识鼓励”并非如影随形，往往是单一出现，排除；\nC项“各有所长”指各有各的长处、优点，一般多指人才而言，且该词一般用于表示大家都有自己的优势，不相上下，与后文文意不符，排除；\nD项“不可或缺”表示非常重要，不能有一点缺失，文段并未体现出两种方式都不能少之意，与前后文语境不符，排除。\n故正确答案为B。\n【文段出处】《缺乏“棒喝”的教育有缺陷》","no":15,"missingImage":false},{"type":"question","qid":"3522661","cat":"逻辑填空","stem":"大学里有一些“冷门”专业，比如古生物专业、梵语专业等。有人可能质疑这样的专业有些“浪费”教育资源，因为它们很难与产业结合转化成生产力，培养出来的学生也很难在就业市场上            。但或许这样专业的存在，本来就不能简单地用世俗的眼光来打量。\n填入画横线部分最恰当的一项是：","options":{"A":"如鱼得水","B":"炙手可热","C":"学以致用","D":"鹤立鸡群"},"answer":"B","explanation":"根据前文“它们很难与产业结合转化成生产力”可知，相关专业的学生在就业市场中对口的工作较少，在就业市场中难以受欢迎，B项“炙手可热”意思是手一靠近就感觉很烫，比喻气焰盛、权势大，使人不敢靠近，现在也多用于比较火热，填入文中可以体现出学生在就业市场中“受欢迎”之意，且能够对应前文“冷门”，当选。\nA项“如鱼得水”比喻得到跟自己十分投合的人或对自己很合适的环境，无法对应前文“冷门”，排除；\nC项“学以致用”指为了实际应用而学习，文段指出冷门专业难以与产业结合，并未指出冷门专业的学生难以应用，排除；\nD项“鹤立鸡群”比喻一个人的仪表或才能在周围一群人里显得很突出，文段并没有“突出”之意，排除。\n故正确答案为B。\n【文段出处】《这个专业，全校就她一个》","no":16,"missingImage":false},{"type":"question","qid":"3523507","cat":"逻辑填空","stem":"我国有很庞大的老年群体，但他们却因为科技的发展，在生活中有很多地方            。不是他们            ，不想接触新事物，而是一辈子的习惯，不是说改就能改的。\n依次填入画横线部分最恰当的一项是：","options":{"A":"寸步难行 墨守成规","B":"步履艰难 画地为牢","C":"艰难跋涉 抱残守缺","D":"举步维艰 固步自封"},"answer":"D","explanation":"第一空，根据文意可知，老年人在科技发展的背景下，生活中会面临很多不便，因此横线处应表示老年人在很多地方不是很方便。B项“步履艰难”指行走困难、行动不方便，D项“举步维艰”指迈步艰难，比喻办事情每向前进行一步都十分不容易，均符合文意，保留。A项“寸步难行”指连一步都难以进行，形容走路、行动困难，比喻开展某项工作困难重重，用于此处程度过重，排除；C项“艰难跋涉”强调路程很艰苦，或者事业方面很艰辛，体现不出老年群体的不方便，排除。 \n第二空，根据后文“不想接触新事物”可知，横线处应体现古板、不肯接受新鲜事物之意。D项“固步自封”形容保守，安于现状，不求改进，符合文意，当选。B项“画地为牢”比喻只许在指定的范围内活动，表意与是否保守、不接受新事物无关，排除。\n故正确答案为D。\n【文段出处】《边亚峰：交医保拒收人民币是一种违法犯罪》","no":17,"missingImage":false},{"type":"question","qid":"3522674","cat":"逻辑填空","stem":"灵感，一个很美的词汇，天生带有古灵精怪的流动感。它如同一尾滑溜溜的金鱼，极难抓，但真的抓住时，它又在手心扭动，让人            ，一不小心又让它溜走了。灵感是如此琢磨不透又难以控制。那到底如何才能在        灵感的游戏中享受到最大的快乐呢?\n依次填入画横线部分最恰当的一项是：","options":{"A":"一筹莫展 追寻","B":"望洋兴叹 激发","C":"不知所措 捕捉","D":"爱莫能助 点燃"},"answer":"C","explanation":"第一空，由前文“它又在手心扭动”以及后文“灵感是如此琢磨不透又难以控制”可知，横线处形容“灵感”难以把握，人们对其无法控制。A项“一筹莫展”形容遇事拿不出一点办法，没有任何进展，C项“不知所措 ”形容不知道怎么办才好，均可表达人无法控制住“灵感”的意思，保留。B项“望洋兴叹”原指在伟大事物面前感叹自己的渺小，也比喻做事时因力不胜任或没有条件而感到无可奈何，通常形容较为宏观，复杂的事物，与“在手心扭动”对应不当，排除；D项“爱莫能助”指虽然心中关切同情，却没有力量帮助，文段并没有体现“帮助”之意，排除。\n第二空，横线处搭配“灵感”，且由前文“灵感是如此琢磨不透又难以控制”可知，横线处表达“控制”住灵感之意。C项“捕捉”意为捉住某人或动物使其落入自己手中，符合文意，且“捕捉灵感”搭配得当，当选。A项“追寻”指追随，无法体现出“控制”之意，不符合文意，排除。\n故正确答案为C。\n【文段出处】《如何捕捉生活中的灵感》","no":18,"missingImage":false},{"type":"question","qid":"3522591","cat":"逻辑填空","stem":"国无德不兴，人无德不立。如果一个民族、一个国家没有共同的核心价值观，            ，行无依归，那这个民族、这个国家就无法前进。这样的情形，在我国历史上，在当今世界上，都            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"莫衷一是  屡见不鲜","B":"自以为是  数不胜数","C":"各行其是  不一而足","D":"积非成是  层出不穷"},"answer":"A","explanation":"第一空，根据横线前“没有共同的核心价值观”和后文“行无依归”可知，填入横线处的成语强调没有统一的思想作支撑。A项“莫衷一是”指各有各的意见，不能得出一致的结论，置于此处能够体现出思想不统一，符合文意，保留。B项“自以为是”形容认为自己的看法和做法都正确，不接受别人的意见，侧重强调认为自己是正确的，与文意无关，排除；C项“各行其是”形容按照各自认为对的去做，比喻各搞一套，侧重强调做法，与文意无关，排除；D项“积非成是”指长期所形成的错误，往往被当作正确的，与文意无关，排除。\n第二空，代入验证，根据前文“这样的情形，在我国历史上，在当今世界上”可知，填入横线处的成语表达这样的情形很常见。A项“屡见不鲜”意思是常常见到，并不新奇，符合文意，当选。\n故正确答案为A。\n【文段出处】《习近平：青年要自觉践行社会主义核心价值观——在北京大学师生座谈会上的讲话》","no":19,"missingImage":false},{"type":"question","qid":"3522599","cat":"逻辑填空","stem":"电视在家庭中基本可以保证固定的开机时长，这就给电视广告提供了足够大的“曝光”空间，不仅可以提高受众的          ，同时更容易在家庭成员之间产生共鸣，无形之中增强广告的        效果。\n依次填入画横线部分最恰当的一项是：","options":{"A":"积极性 营销","B":"多样化 吸引","C":"保有量 交互","D":"覆盖量 传播"},"answer":"D","explanation":"第一空，根据横线前“给电视广告提供了足够大的‘曝光’空间”以及“提高”可知，横线处应体现受众的数量有所提高之意。C项“保有量”指拥有的数量，D项“覆盖量”指在一定程度之内的数量，均符合文意，保留；A项“积极性”指进取向上的思想和表现，多搭配工作，文段未体现思想及表现，排除；B项“多样化”指种类多种多样，文段未提及种类，排除。\n第二空，搭配“广告”，根据“在家庭成员之间产生共鸣”可知，广告起到了传递信息的宣传作用，横线处应体现广告的宣传作用被增强之意。D项“传播”指广泛散布、信息传递，符合文意，当选；C项“交互”指相互联系交流，多用于人机交互，与广告搭配不当，排除。\n故正确答案为D。\n【文段出处】《互联网的下半场，电视产业的风口在哪里》","no":20,"missingImage":false},{"type":"question","qid":"3522570","cat":"逻辑填空","stem":"量子计算将极大促进当前人工智能及其应用的发展，深刻地        包括基础教育在内的众多领域。特别是，借助于量子计算技术，人类对于微观世界的认识以及宏观世界的探索将得到极大扩展，从而引发人类思维能力的          提升。\n依次填入画横线部分最恰当的一项是：","options":{"A":"融合 战略性","B":"改变 根本性","C":"解决 突破性","D":"支持 阶段性"},"answer":"B","explanation":"第一空，搭配“领域”，“领域”指特定的范围或区域，B项“改变”指事物变得和原来不一样，与“领域”搭配恰当，保留。A项“融合”指融为一体，文中并无众多领域融为整体之意，不符合文意，排除；C项“解决”指处理使有结果，D项“支持”指支撑、赞同或鼓励，均与“领域”搭配不当，排除。\n第二空，代入验证。搭配“提升”，B项“根本性”意在强调基础或本质，根据文意可知，人类对世界的认识发生了本质上的改变，搭配恰当，符合文意，当选。\n故正确答案为B。\n【文段出处】《量子科技为何成为多国战略布局的重点领域》","no":21,"missingImage":false},{"type":"question","qid":"3522671","cat":"逻辑填空","stem":"几乎所有成年人都只能使用左脑处理语句。但对儿童而言，任何一个大脑半球的损伤都不太可能影响语言学习，这说明在早期阶段人脑的两个半球都具有这种能力。美国乔治敦大学神经学家指出，这为神经损伤提供了一种        机制。例如，如果左半球受到围产期中风的        ，新生儿将使用右半球学习语言。\n依次填入画横线部分最恰当的一项是：","options":{"A":"赔偿 祸害","B":"补偿 损害","C":"补充 损失","D":"填充 毁坏"},"answer":"B","explanation":"第一空，搭配“机制”，体现早期阶段人脑的两个半球对于“神经损伤”的功用，结合横线后的例子可知，当新生儿大脑左半球遭受中风时，右半球可以有效补位，以减少对语言学习的影响。B项“补偿”指补足，用以抵消损失、消耗等，C项“补充”指原来不足或有损失时，增加一部分，二者均符合语境，保留。A项“赔偿”指由于自己的行动而使他人蒙受损失从而给予补偿，新生儿的这一机制是对自身神经损伤的补偿，而非他人，不符合文意，排除；D项“填充”多指对某个空间的填补，与文段语境不符，排除。\n第二空，搭配“中风”，体现中风对大脑左半球的伤害。B项“损害”指使事业、利益、健康、名誉等蒙受损失，与“中风”搭配得当，当选。C项“损失”指没有代价地消耗或失去，多与“金钱”“产品”等具象化事物搭配，与“中风”搭配不当，排除。\n故正确答案为B。\n【文段出处】《研究显示：儿童同时使用左右半脑进行语言学习》","no":22,"missingImage":false},{"type":"question","qid":"3523514","cat":"逻辑填空","stem":"家人是用来爱的，而不是用来伤害的。谁的爱与付出都不是            的，安抚好自己的情绪，体谅彼此，多一点有效沟通，整个家庭才能和和睦睦。\n填入画横线部分最恰当的一项是：","options":{"A":"无缘无故","B":"责无旁贷","C":"轻而易举","D":"理所当然"},"answer":"D","explanation":"根据横线前“家人是用来爱的，而不是用来伤害的”与横线后“安抚好自己的情绪，体谅彼此，多一点有效沟通”可知，横线处应体现家人之间的爱与付出是需要彼此共同努力的，并非单方面必须或理应要做的，D项“理所当然”指从道理上说应当这样，符合文意，且与前后文呼应，当选。\nA项“无缘无故”指没有一点原因，文段并未体现家人之间的爱与付出和彼此之间的体谅、有效沟通之间存在因果关系，排除；\nB项“责无旁贷”指自己应尽的责任，不能推卸给旁人，若置于此处，结合否定词“都不是”，体现“爱与付出”可推卸给旁人，文段无此含义，排除；\nC项“轻而易举”形容事情容易做，不费力气，文段并未体现爱与付出是否容易去做，排除。\n故正确答案为D。\n【文段出处】《有正能量的家庭，才能培养出内心强大的孩子！》","no":23,"missingImage":false},{"type":"question","qid":"3524807","cat":"逻辑填空","stem":"手工空心挂面以张家山的最出名，自从登上了央视、湖南卫视后，手工空心挂面更红了，张家山更红了，村里几乎家家户户都开始做挂面，男女老少齐动手，房前屋顶，            ，如烟似雾，一进村口，挂面的芬芳和着黄土的清香顿时让人            。\n依次填入划横线部分最恰当的一项是：","options":{"A":"白眉低垂 心旷神怡","B":"银丝摇曳 神清气爽","C":"细如丝织 气定神宁","D":"白丝如雪 沁人心脾"},"answer":"B","explanation":"第一空，根据横线前“家家户户都开始做挂面，男女老少齐动手”可知，横线处应与挂面有关，且横线后用逗号与“如烟似雾”连接表近义并列，故语义相近，横线处要体现房前屋顶挂面的状态，B项“银丝摇曳”、C项“细如丝织”、D项“白丝如雪”均符合文意，保留。A项“白眉低垂”，即老者眼眉低低的垂下，不能修饰“挂面”，搭配不当，排除。\n第二空，横线处搭配“挂面的芬芳”和“黄土的清香”，体现出香气对人的作用，B项“神清气爽”形容人神志清爽，心情舒畅，符合文意，当选。C项“气定神宁”形容一种悠然自在镇定的心境与状态，不属于挂面香气能带给人的作用，不符合文意，排除；D项“沁人心脾”指芳香凉爽的空气、饮料或花香使人感到舒适，与横线前“让人”搭配，语义重复，排除。\n故正确答案为B。\n【文段出处】《‘实心心’事业》","no":24,"missingImage":false},{"type":"question","qid":"3522596","cat":"逻辑填空","stem":"学术研究是一项严谨缜密的科学工作，            是其研究的前提基础。学术不求真便会没有标准，当真正的学术研究被        、舆论炒作成为风气之时，便意味着学术低谷的到来。\n依次填入画横线部分最恰当的一项是：","options":{"A":"实事求是 放弃","B":"有的放矢 遗忘","C":"去伪存真 冷落","D":"推陈出新 忽视"},"answer":"C","explanation":"第一空，根据文段“学术研究是一项严谨缜密的科学工作”“学术不求真便会没有标准”可知，横线处体现的是学术研究要严谨缜密、要求真，A项“实事求是”指从实际情况出发，C项“去伪存真”意思是除掉虚假的，留下真实的，均符合文意，保留。B项“有的放矢”比喻说话做事有针对性，文段未体现针对性，排除；D项“推陈出新”指去掉旧事物的糟粕，取其精华，并使它向新的方向发展，与文意不符，排除。\n第二空，根据后文“便意味着学术低谷的到来”可知，横线处词语程度较轻，C项“冷落”形容受到冷淡的待遇，置于此处程度较轻，符合文意，当选。A项“放弃”搭配“学术研究”，程度过重，排除。\n故正确答案为C。\n【文段出处】《造假与炒作的背后》","no":25,"missingImage":false},{"type":"question","qid":"3522582","cat":"逻辑填空","stem":"2020年是紫禁城建成600年，也是故宫博物院成立95周年。紫禁城作为明清两代皇宫，它是中华民族宝贵的传统文化        ，也是著名的世界文化遗产。它不仅拥有中国古代最        的宫殿建筑群，还拥有一百八十余万件珍贵文物和大量的文献档案，承载着丰富的历史信息和文化印记，是中华民族记忆传统、        文脉、增强文化自信的重要资源。\n依次填入画横线部分最恰当的一项是：","options":{"A":"财产 巨大 继承","B":"产业 庞大 延续","C":"遗产 宏伟 传承","D":"象征 丰富 接续"},"answer":"C","explanation":"第一空，横线处所填词语要形容“紫禁城”，且需要搭配“传统文化”，C项“遗产”泛指历史上遗留下来的精神财富或物质财富，由“紫禁城建成600年”可知，它是历史遗留的宝贵财富，符合文意，且“遗产”与“传统文化”搭配得当，保留。A项“财产”指拥有的金钱、物资、房屋、土地等物质财富，与“传统文化”搭配不当，排除；B项“产业”可以指私有财产，如土地、房屋、工厂等，也可以指现代工业生产行业，“紫禁城”并非私有财产，也不是具体生产行业，排除；D项“象征”指能用来暗示特定的人、物或事理的具体的东西，如“白色是纯洁的象征”，而文段不存在这种暗示关系，排除。\n第二空，代入验证，横线处所填词语搭配“宫殿建筑群”，C项“宏伟”表示宏大雄伟，多与“建筑”类搭配，用于此处搭配得当，保留。\n第三空，代入验证，横线处所填词语搭配“文脉”，C项“传承”表示传授和继承，搭配得当，符合文意，当选。\n故正确答案为C。\n【文段出处】《600年的记忆：紫禁城历史上的几个关键词》","no":26,"missingImage":false},{"type":"question","qid":"3522601","cat":"逻辑填空","stem":"随着医疗设备技术的发展，医疗市场也对非侵入式检测设备提出了更高的        ——准确、及时且按需实现患者监测。因此，如果一项技术能够以非侵入的方式反复测量个体的健康状态，且成本不高，那么它将有助于预防和预测疾病，提高诊疗决策的            。\n依次填入画横线部分最恰当的一项是：","options":{"A":"要求 精准性","B":"门槛 前瞻性","C":"期望 创新性","D":"标准 主动性"},"answer":"A","explanation":"第一空，横线处搭配“提出”，A、C、D三项均搭配恰当，保留。B项“门槛”搭配不当，排除。\n第二空，根据前文“准确、及时且按需”可知，文段强调随着医疗设备技术的进步，对待疾病的处理也将更加科学迅速、精确高效。A项“精准性”符合文意，当选。C项“创新性”侧重打破常规，提出不一样的想法或措施，文段并非强调诊疗决策的“特别”，而是要通过技术进步来让决策更加科学化、精准化，不符合文意，排除；D项“主动性”强调按照自己的意志行动，文段并没有体现决策是主动或被动做出，与文意无关，排除。\n故正确答案为A。\n【文段出处】新华网《“智能马桶”可监测用户健康》","no":27,"missingImage":false},{"type":"question","qid":"3522604","cat":"逻辑填空","stem":"节约资源、减少垃圾生产成为某种意义上的公共事务，很容易遭遇“搭便车困境”——人人都想            ，最终会导致公共事务乏人问津。节约资源的功效并没有那么            ，需要人们久久为功；付出没有得到及时、有效的反馈与回报，难免会影响公众参与。\n依次填入画横线部分最恰当的一项是：","options":{"A":"蜂拥而上 妙手回春","B":"鸠占鹊巢 神通广大","C":"据为己有 一劳永逸","D":"坐享其成 立竿见影"},"answer":"D","explanation":"第一空，由破折号可知，所填词语是对“搭便车困境”的解释说明。“搭便车”本义为自己不想开车，所以乘坐他人的便车；引申义为，自己不想付出努力而去享受他人带来的便利。D项“坐享其成”指的是自己不出力，而享受别人取得的成果，符合文意，保留。A项“蜂拥而上”指的是许多人一起涌上来，未体现出自己不出力，享受他人成果之意，不符合文意，排除；B项“鸠占鹊巢”指的是强占别人的房屋、土地、产业等，C项“据为己有”指的是占据为自己所拥有，“搭便车”并非强调占据别人的东西归自己所有，均与文意不符，排除。\n第二空，代入验证，根据“并没有······需要······”可知，横线处与后文“久久为功”语义相反，体现“时间短”之意。D项“立竿见影”指见效快，符合文意，当选。\n故正确答案为D。\n【文段出处】《“零浪费”用更深刻的环保观念拥抱美好生活》","no":28,"missingImage":false},{"type":"question","qid":"3522605","cat":"逻辑填空","stem":"世界上的一万多种鸟，其实各有各的美丽，从各种华丽的羽毛，到鸟喙的形状，到鸣唱的声音，不能不让我们        生物多样性的神奇。进化论之父达尔文在加拉帕戈斯群岛上通过观察当地鸟类发现，虽然这些鸟类很明显长得很相似，有着共同的祖先，但是它们的鸟喙形状却            。\n依次填入画横线部分最恰当的一项是:","options":{"A":"惊叹 大相径庭","B":"惊奇 毫无二致","C":"探索 云泥之别","D":"追寻 异曲同工"},"answer":"A","explanation":"本题可从第二空入手，横线前出现转折关联词“却”可知前后语义相反，横线前“鸟类很明显长得很相似，有着共同的祖先”体现“相似、一样”的含义，因此横线处应体现“不一样、不同”之意。A项“大相径庭”比喻相差很远，大不相同，符合文意，保留。B项“毫无二致”形容完全一样，D项“异曲同工”比喻一件事情的做法不同而都巧妙地达到目的，均与文意相悖，排除；C项“云泥之别”比喻地位的高下相差极大，文段并非论述地位的高下，仅在论述形状的不同，与文意不符，排除。\n第一空，代入验证，A项“惊叹”指惊奇赞叹，表达对生物多样性的赞美，感情色彩积极，符合文段语境，当选。\n故正确答案为A。\n【文段出处】《热带雨林中的鸟类和深海中的蠕虫，我们该保护哪个？》","no":29,"missingImage":false},{"type":"question","qid":"3522577","cat":"逻辑填空","stem":"原创是作品的生命力之源，抄袭无异于            。影视行业想要成为常青树，优质的原创作品是根基。如果任由抄袭之风盛行，        抄袭作者活跃在屏幕上，将        从业者的生存环境，消耗整个行业的未来前景。\n依次填入画横线部分最恰当的一项是：","options":{"A":"自相残杀 放纵 剥蚀","B":"自掘坟墓 纵容 腐蚀","C":"自投罗网 放任 消蚀","D":"自欺欺人 容许 磨蚀"},"answer":"B","explanation":"第一空，根据横线前的“无异于”可知，横线处所填词语是对前文的解释说明。由“原创是作品的生命力之源”可知，抄袭则会让作品失去生命。B项“自掘坟墓”是指自己的所作所为就像在替自己挖掘坟墓一样，比喻自寻死路，符合文意，保留。C项“自投罗网”指自己投到罗网里去，比喻自己送死，也可以体现让作品失去生命，保留。A项“自相残杀”指自己人互相杀害，文段未提及互相杀害，排除。D项“自欺欺人”指欺骗自己，也欺骗别人，文段未提及欺骗自己和欺骗别人，与文意无关，排除。\n第二空，根据横线前的“任由抄袭之风盛行”可知，横线处表示对抄袭作者不加约束，任由其发展，B项“纵容”指对错误行为不加制止、任其发展，C项“放任”指听其自然，不加约束或干涉，两项均符合文意，保留。\n第三空，搭配“生存环境”，根据横线后的“消耗整个行业的未来前景”可知，对抄袭不加约束会产生不好的结果，从业者的生存环境会遭到破坏，B项“腐蚀”比喻坏的思想或环境，使人逐渐变质堕落，与“生存环境”搭配恰当且符合文意，当选。C项“消蚀”意为消耗、消损，多指由于风或者其他气候因素所致的侵蚀而使地面降低，和题干中的“生存环境”搭配不当，排除。\n故正确答案为B。\n【文段出处】人民资讯《影视圈的抄袭之风，怎么破？》","no":30,"missingImage":false},{"type":"question","qid":"3522589","cat":"逻辑填空","stem":"大多数群居的哺乳动物，雌性个体怀孕生育后，随着后代迅速        ，它们也会很快        原有的社会地位。然而在人类的大部分历史中，生育和照顾幼儿几乎是女性壮年时期的全职工作。有研究认为，人类婴儿的          ，让人类与母亲的关系与一般的动物相比更加紧密。\n依次填入画横线部分最恰当的一项是：","options":{"A":"成熟 改变 重要性","B":"分离 恢复 可塑性","C":"长大 获得 依附性","D":"独立 回归 脆弱性"},"answer":"D","explanation":"第一空，根据前后文可知，横线处应体现后代迅速成长之意，A项“成熟”、C项“长大”、D项“独立”均符合文意，保留。B项“分离”与“群居”矛盾，排除。\n第二空，通过转折词“然而”指出人类照顾幼儿是全职工作，可知“雌性哺乳动物”不是“全职”，“会很快回到‘原有的社会地位’”，D项“回归”符合文意，保留。A项“改变”、C项“获得”均未体现“会很快回到‘原有的社会地位’”之意，排除。\n第三空，代入验证，文段将动物的幼崽和人类的婴儿进行对比，其结果体现了人类婴儿的“脆弱性”，符合文意，D项当选。\n故正确答案为D。\n【文段出处】知识分子《站起来，双足走 | 36个月》","no":31,"missingImage":false},{"type":"question","qid":"3522595","cat":"逻辑填空","stem":"糖对健康有危害已经            ，大家也能很好地理解和接受“少糖”这一健康饮食的基本原则。但是人类对甜味的喜好是            的，“健康少糖”和“享受甜味”对于很多人来说是很        的选择。甜味剂的出现，为人们提供了二者兼得的可行选择。\n依次填入画横线部分最恰当的一项是：","options":{"A":"毋庸置疑 刻骨铭心 无奈","B":"深入人心 与生俱来 艰难","C":"显而易见 积重难返 被动","D":"妇孺皆知 根深蒂固 痛苦"},"answer":"B","explanation":"本题从第二空入手。横线处搭配“喜好”，且根据文意可知，横线处表达人类对甜味的喜好一直都有且很深刻。B项“与生俱来”指一出生就拥有的特性或行为，置于此处搭配恰当且符合文意，保留。A项“刻骨铭心”形容留下的印象极其深刻，永远忘不了，侧重将某物或某事“牢记于心”，与“喜好”搭配不当，排除；C项“积重难返”指积习深重，不易改变，常搭配“恶习”“弊端”，D项“根深蒂固”比喻基础稳固，不容易动摇，常搭配“思想”“观念”“主义”，均与“喜好”搭配不当，排除。\n第一空，代入验证，B项“深入人心”指理论、学说、政策等为人们深切了解和信服，填入横线处能体现出大家已理解和接受糖对健康的危害，符合文意，保留。\n第三空，代入验证，根据文意可知，很多人面对“健康少糖”和“享受甜味”时难以选择，B项“艰难”置于此处能体现出人们纠结、难以抉择的心理，符合文意，当选。\n故正确答案为B。\n【文段出处】《一种食品为什么要多种甜味剂？你最常听到的猜测都是错的》","no":32,"missingImage":false},{"type":"question","qid":"3522569","cat":"逻辑填空","stem":"口供是案件中的主要证据、直接证据，对案件的证明往往具有不可替代的作用，特别是在贿赂犯罪、毒品犯罪等          强、客观证据相对较少的案件中，口供对认定案件十分        。对口供的审查应当        ，要进行合法性审查、客观性审查、系统性审查和补强印证审查等。\n依次填入画横线部分最恰当的一项是：","options":{"A":"破坏性 重要 严格","B":"复杂性 珍贵 深入","C":"隐蔽性 关键 全面","D":"关联性 有用 认真"},"answer":"C","explanation":"第一空，根据后文“客观证据相对较少”可知，横线处要体现“贿赂犯罪、毒品犯罪”的特点，“贿赂”即用财物买通别人，其与“毒品犯罪”多为私下进行的行为。C项“隐蔽性”指遮掩、隐藏，不易被发现的特性，符合文意，保留。A项“破坏性”指使事物受到损害的特性，B项“复杂性”指事物的种类或头绪多而杂，D项“关联性”指事物之间有牵连，有联系，三项均无法对应“贿赂犯罪、毒品犯罪”的特点，排除。\n第二空，代入验证，C项“关键”可体现出“口供对认定案件”的重要性，符合文意，保留。\n第三空，代入验证，C项“全面”可对应后文“合法性审查、客观性审查、系统性审查和补强印证审查等”，体现出口供审查应顾及所有方面，符合文意，当选。\n故正确答案为C。\n【文段出处】《新时代“全能”刑事检察官六大“超”能力》","no":33,"missingImage":false},{"type":"question","qid":"3522575","cat":"逻辑填空","stem":"面对民族存亡的空前危机，中国人民的爱国热情像火山一样迸发出来，全体中华儿女            、共御外侮，为民族而战，为祖国而战，为尊严而战，汇聚起气势磅礴的力量。在这一壮阔进程中，中国人民向世界展示了天下兴亡、匹夫有责的爱国情怀，视死如归、            的民族气节，不畏强暴、血战到底的英雄气概，百折不挠、            的必胜信念，铸就了伟大的抗战精神。\n依次填入划横线部分最恰当的一项是：","options":{"A":"团结一心 见义勇为 勇往直前","B":"众志成城 宁死不屈 坚忍不拔","C":"风雨同舟 英勇无畏 能屈能伸","D":"同舟共济 宁折不弯 意志坚定"},"answer":"B","explanation":"第一空，横线处与“共御外侮”构成近义并列，要体现团结一心，共同抵御外敌之意。A项“团结一心”指为了达成共同的目标而紧密地团结在一起，B项“众志成城”指万众一心，像坚固的城堡一样不可摧毁。比喻大家团结一致就能克服困难，C项“风雨同舟”比喻在艰难困苦的条件下互相帮助，齐心协力战胜困难，D项“同舟共济”指大家坐一条船过河。比喻在艰险的处境中团结互助，共同战胜困难，均符合文意，保留。\n第二空，横线处与“视死如归”构成近义并列，要体现不怕牺牲之意，B项“宁死不屈”指宁愿死也不屈服，C项“英勇无畏”指十分勇敢、无所畏惧，D项“宁折不弯”指宁可死也绝不屈服妥协，均能体现不怕牺牲，保留。A项“见义勇为”指看到合乎正义的事就勇敢地去做，不能体现不怕牺牲之意，排除。\n第三空，横线处与“百折不挠”构成近义并列，要体现无论受到多少挫折都不退缩、意志坚强之意，B项“坚忍不拔”指在艰苦的环境中坚定不移，不可动摇，当选。C项“能屈能伸”指人能适应各种境遇，在失意时能忍耐，在得志时能施展抱负，语意不符，排除；D项“意志坚定”本意就已经包含信念坚定之意，不能再用来形容信念，语意重复，排除。\n故正确答案为B。\n【文段出处】《深刻把握抗战精神的丰富内涵》","no":34,"missingImage":false},{"type":"question","qid":"3522588","cat":"片段阅读","stem":"中国艺术中的色彩大致可分为三个子系统：官方系统，侧重于观念与象征性；民间系统，侧重于装饰与审美；文人士大夫系统，有意弱化色彩的视觉冲击力，偏向黑白素雅。南宋诗人陈与义写水墨梅花的名句“意足不求颜色似”，成为许多文人重水墨、轻彩色的理论表述，文人话语也似乎逐渐成为中国艺术史的主旋律。不过，这其实只是部分人的审美倾向造成的史实遮蔽。在中国人生活的各个方面，在中国艺术更广大的领域，包括建筑装饰、宫廷艺术、服饰、陶瓷等，色彩的探索和应用从未停止，只是缺乏相应的理论探讨而已。\n这段文字意在强调：","options":{"A":"中国艺术中的色彩子系统","B":"中国艺术中色彩丰富的事实","C":"中国艺术理论富有诗意的特点","D":"文人审美倾向对中国艺术的影响"},"answer":"B","explanation":"文段开篇指出中国艺术中的色彩分为官方、民间、文人士大夫三个子系统，并论述许多文人重水墨、轻彩色，且文人话语似乎成为中国艺术史的主旋律。接着通过转折对前文进行否认，指出这一理论表述是史实遮蔽。最后通过尾句强调中国艺术的色彩探索和应用从未停止，只是理论探讨相对不足。故文段重点强调中国艺术的色彩还是很丰富的，对应B项。\nA项，对应文段首句引入话题部分，非重点，排除；\nC、D两项，文段讨论的核心话题为“中国艺术中的色彩”，C项的“中国艺术理论”、D项“中国艺术”，均偏离文段的核心话题，排除。\n故正确答案为B。\n【文段出处】《“国色”是什么颜色？》","no":35,"missingImage":false},{"type":"question","qid":"3522580","cat":"片段阅读","stem":"资本天然是逐利的，本身并没有好坏之分。有序、合规的资本扩张，对于促进中国经济高质量发展具有重要意义，也是政策面所持续支持推动的。资本扩张有利于串联起产业链上下游企业，然而也带来了严峻的垄断问题。实际上，在这些行业融合、产业链整合的背后，是数字要素与传统生产要素的结合，根本上的要素垄断规律并没有改变，占据要素优势的企业仍然会获得垄断地位。而垄断将严重影响市场经济的竞争机制，降低市场效率，侵犯消费者权益，同时还会阻碍行业整体的创新进步，挫伤其他小微企业的积极性。\n接下来作者最有可能讲的是：","options":{"A":"需要遏制资本的进一步扩张","B":"加强对数字经济的立法管理","C":"对数字经济中的资本扩张的监管","D":"反垄断监管对保障经济发展的重要性"},"answer":"C","explanation":"文段首先引出“资本扩张”的话题并指出其作用，随后通过转折指出其会带来垄断的问题。接下来阐述数字要素与传统生产要素的结合，占据要素优势的企业会获得垄断地位，尾句进一步论述资本扩张导致的垄断所带来的问题与危害。所以接下来应该根据文段的问题提出对策，即应对资本扩张进行监管，防止资本扩张导致的垄断问题，对应C项。\nA项，“遏制资本的进一步扩张”表述不明确，排除；\nB项，未提及“资本扩张”这一话题，且文段并没有提到“立法”，排除；\nD项，强调的是反垄断监管的作用，但文段中强调的是资本扩张带来的垄断问题，且该项未提及“资本扩张”这一核心话题，排除。\n故正确答案为C。\n【文段出处】《数字经济时代的反垄断，重点在于对资本扩张的监管》","no":36,"missingImage":false},{"type":"question","qid":"3523491","cat":"片段阅读","stem":"传承弘扬传统民间艺术的深刻精神内涵，民间艺术能否带来经济效益也成为了至关重要的考量因素。越来越多的年轻人选择放弃手工技艺，离开村庄谋生。对于大多数普通艺人，传承和保护民间文化只是一个概念，维持基本生活需求和追求家庭收入最大化仍然是最先考虑的因素。传承文化和提高收入的矛盾始终贯穿于民间艺人的文化自觉过程之中。对于民间艺人，作为“理性人”去追求收入最大化无可厚非，而作为民间文艺工作者，我们需要思考的是如何在保证民间艺人基本生活和物质需要的基础上，提升民间艺人的文化自觉意识，真正让民间艺人扎得住根、沉得下心。\n这段文字意在强调：","options":{"A":"激发民间艺人的文化自觉意识","B":"经济效益影响民间艺术的传承","C":"提高民间艺人的经济收入","D":"民间艺术传承的断代危机"},"answer":"A","explanation":"文段开篇论述经济效益对于传承弘扬传统民间艺术很重要，接着通过很多年轻人放弃手工技艺，外出谋生的情况说明在民间艺人的文化自觉过程中始终存在着传承文化和提高收入的矛盾。后文通过“需要”针对上述矛盾提出对策，论述民间文艺工作者要在保证民间艺人物质生活的基础上提升民间艺人的文化自觉意识，故文段重点强调提升民间艺人的文化自觉意识，对应A项。\nB、C两项，分别强调“经济效益”和“经济收入”，均未提及文段主题词“文化自觉”，排除；\nD项，“断代危机”文段未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】《以人民为中心繁荣发展社会主义民间文艺》","no":37,"missingImage":false},{"type":"question","qid":"3522594","cat":"片段阅读","stem":"人体严密的免疫防御系统，会在细菌入侵时引起炎症反应，白细胞和大量“防御斗士”对病原体展开攻击。防御的一方通常会胜利，理论上讲，“刺激”消除后，炎症反应会逐渐消失，组织回到正常状态。但在某些特定情况下，炎症依然会持续，这种低度炎症不像通常的炎症那样可以明显感觉到它的存在，其更像人体内未被完全熄灭的“火苗”。机体通过炎症反应抵抗病原体的过程，保障了人类的生存，但是科学家发现，这种低度炎症会缩短生命，促进许多年龄相关性症状，如认知衰退、神经变性、动脉粥样硬化等。不过，引起和维持这些变化的机制，目前尚不能明确。\n这段文字主要介绍：","options":{"A":"人体免疫系统的防御机制","B":"低度炎症的发生机制与影响","C":"细菌对人类生存的影响","D":"年龄相关性症状的研究现状"},"answer":"B","explanation":"文段开篇介绍人体的免疫系统会在细菌入侵时引起炎症反应，理论上讲，“刺激”消除后，炎症反应会逐渐消失，组织回到正常状态，接着通过转折词“但”引出特定情况下这种低度炎症会持续存在。随后解释了低度炎症的产生原理以及其好、坏两方面影响。故文段主要围绕“低度炎症”展开，从低度炎症的产生原理和对人类的影响两个方面进行阐述，对应B项。\nA项，文段主要论述的核心话题为“低度炎症”，“人体免疫系统”范围扩大，排除；\nC项，仅对应文段首句内容，非重点，排除；\nD项，论述的是“年龄相关性症状的研究现状”，但文段论述的核心话题是“低度炎症”，排除。\n故正确答案为B。\n【文段出处】《增强巨噬细胞代谢能缓解认知衰退》","no":38,"missingImage":false},{"type":"question","qid":"3523493","cat":"片段阅读","stem":"很多人认为，艺术创作是对自然或社会的观察与模仿，但在某些艺术史家看来，艺术家的创作其实是对传统与风格的修改和调整，是不断制作与匹配“图式”的过程。无论是意大利文艺复兴对古希腊罗马精神的再现，还是中国宋元文人画对老庄哲学的追随，都是如此。艺术家在准备好想要处理的题材之前，脑海里必然存在某些已知的图式，这些图式是过去艺术家们的成果；艺术家在画布或画纸上开始描绘时，就像置身在一个“镜子厅”或“回音廊”，旧的图式被不断唤起，题材的意义在特定的视觉秩序中，以新的图式再次展现。\n这段文字意在强调：","options":{"A":"艺术创新是无中生有的过程","B":"艺术作品间的相似缘于模仿借鉴","C":"艺术创作离不开已有的传统","D":"古典艺术作品是艺术创作的源泉"},"answer":"C","explanation":"文段开篇通过“很多人认为”引出他人的观点，认为艺术创作是观察和模仿，紧接着通过转折关联词“但”强调“艺术家的创作其实是对传统与风格的修改和调整”。后文通过“意大利文艺复兴和中国宋元文人画”进行举例论证，同时又从艺术家从准备到开始作画的整个过程来论证文段的观点。故文段重点强调艺术家的创作是对传统与风格的修改和调整，即“离不开已有的传统”，对应C项。\nA项，文段强调的是“艺术家的创作其实是对传统与风格的修改和调整，是不断制作与匹配‘图式’的过程”，并非是无中生有的过程，与文意相悖，排除；\nB项，文段重点论述的是“艺术创作”，而非“艺术作品”，主题词错误，且文段并未分析艺术作品相似的原因，排除；\nD项，“古典艺术作品”仅是“已有的传统”当中的一个方面，且“艺术创作的源泉”文段未提及，无中生有，排除。\n故正确答案为C。\n【文段出处】《艺术青年致敬前人的三种方式：唤起、社交与实验》","no":39,"missingImage":false},{"type":"question","qid":"3522572","cat":"片段阅读","stem":"临床医学教授格林斯潘认为，儿童的自我意识发展完全取决于父母与孩子的同理心关系，只有当父母能够持续、连贯、准确地读懂幼儿的情绪状态并做出有效回应时，孩子才能学会以同样的方式去回应。这种同理心的联系，拓展了孩子的心智，帮助他走进身边的情感与社交世界，给予他温暖和喜悦，而这正是培养信任所需要的。这种联系也带给孩子以自信，相信自己可以对他人产生影响，相信自己的意向也可以通过互动的方式，得到他人的积极回应。\n这段文字意在强调：","options":{"A":"父母的情绪回应对孩子自我意识发展至关重要","B":"同理心是儿童获得智力与情感发展的坚实基础","C":"儿童的自我意识发展离不开与父母的积极互动","D":"准确地识别儿童的情绪状态是父母的核心任务"},"answer":"C","explanation":"文段开篇点出格林斯潘的观点，强调“父母与孩子的同理心关系”对“儿童的自我意识发展”非常重要。接着对这种“同理心关系”进行具体说明，即“父母能够持续、连贯、准确地读懂幼儿的情绪状态并做出有效回应”。然后，用两个指代词“这种同理心的联系”及“这种联系”均指代前文的“父母与孩子的同理心关系”，论述其对儿童自我意识发展的重要意义。故文段为总分结构，强调“父母与孩子的同理心关系”或“父母能够持续、连贯、准确地读懂幼儿的情绪状态并做出有效回应”对“儿童的自我意识发展”非常重要，对应C项。\nA项，强调“父母的情绪回应”的重要性，但是文段强调的是“父母能够持续、连贯、准确地读懂幼儿的情绪状态并做出有效回应”，即父母对孩子的回应得是有效的回应，故不如C项“与父母的积极互动”表述明确，排除；\nB项，文段强调的是“父母与孩子的同理心关系”，而非“同理心”，且“智力与情感”对应“拓展了孩子的心智，帮助他走进身边的情感与社交世界，给予他温暖和喜悦”，表述片面，排除；\nD项，文段并没有论述“父母的核心任务”，无中生有，且根据“父母能够持续、连贯、准确地读懂幼儿的情绪状态并做出有效回应”可知，“准确地识别儿童的情绪状态”表述片面，排除。\n故正确答案为C。","no":40,"missingImage":false},{"type":"question","qid":"3522576","cat":"片段阅读","stem":"从绘画类别上看，人物画发展最早，涵盖内容也最为广阔。从人物画的演进层次来看，先是由鬼神而至人间，其目的在于“用”；然后由丹青而趋水墨，其演变则在于“艺”。汉代人物画都与灵魂鬼神有关，宗教意识浓厚，艺术追求的意义不太明显，都应归于“用”之范畴；东晋顾恺之等人的绘画开始脱离“用”的范畴，转而追求艺术的本旨。唐代张彦远在《历代名画记》中说“夫画者，成教化，助人伦，穷神变，测幽微，与六籍同功”，说的正是前一半；“近于艺”的后半段，实际是从唐宋时期才开始的。\n下列说法与原文相符的是：","options":{"A":"汉代人物画基本以实用为目的","B":"张彦远对东晋人物画评价不高","C":"顾恺之带来了绘画工具的革新","D":"唐代人物画比汉代更具写实性"},"answer":"A","explanation":"A项，根据“汉代人物画都与灵魂鬼神有关······都应归于‘用’之范畴”可知，汉代人物画以实用为目的，表述正确，当选；\nB项，根据“唐代张彦远在《历代名画记》中说······说的正是前一半”可知，张彦远论述的是画的作用，而非对人物画水平高低的评价，无中生有，排除；\nC项，根据“东晋顾恺之等人的绘画开始脱离‘用’的范畴，转而追求艺术的本旨”可知，带来的不是“绘画工具”的革新，偷换概念，排除；\nD项，文段并没有涉及到唐代人物画与汉代人物画的比较，无关比较，排除。\n故正确答案为A。","no":41,"missingImage":false},{"type":"question","qid":"3522581","cat":"片段阅读","stem":"荷兰研究人员意外地在人体中发现了一个新器官——一组位于鼻子后面、喉咙上部深处的唾液腺。这组平均长度大约4厘米的唾液腺位于一块被称为咽鼓管隆凸的软骨之上，研究人员将其称为“咽鼓管唾液腺”，它们很可能是人体用来湿润上咽喉部的。此前已知人体中有三大唾液腺，即腮腺、颌下腺和舌下腺，而这个不起眼的咽鼓管唾液腺，可能会影响癌症治疗。在头颈部位使用放射性疗法治疗癌症时，医生应该设法避免照射这一唾液腺，因为破坏这些腺体，可能会影响患者的进食、吞咽甚至说话功能。\n最适合做这段文字标题的是：","options":{"A":"人体唾液腺知多少","B":"治疗癌症的新方法","C":"人体隐秘器官新发现","D":"放射性治疗中的禁区"},"answer":"C","explanation":"文段首先指出荷兰研究人员发现了新器官——“咽鼓管唾液腺”，接着分别介绍了它的长度、位置、作用，以及注意事项——医生在进行放射性疗法治疗癌症时应避免照射咽鼓管唾液腺，并进行原因分析。由此可知，文段主要围绕研究人员新发现的器官——咽鼓管唾液腺在进行论述，对应C项。\nA项，“人体唾液腺”范围扩大，排除；\nB项，文段只是说在放射性疗法治疗癌症时医生应避免照射咽鼓管唾液腺，即治疗癌症的禁忌事项，这并非是“治疗癌症的新方法”，排除；\nD项，仅对应尾句放射性治疗的内容，表述片面，排除。\n故正确答案为C。\n【文段出处】《科学家发现人体新器官咽鼓管唾液腺》","no":42,"missingImage":false},{"type":"question","qid":"3522900","cat":"片段阅读","stem":"传统的西方法律思想史研究存在“吃偏食”的现象，即研究的范围、题材的主次、对象的脉络等受制于英语学术谱系，这种单一的考察重心限制了研究者的视角。而实际上，在非英语学术谱系中存在大量有价值的材料。这要求研究者把目光投向先前不够重视的领域，比如“一带一路”建设参与国众多，对它们的法律思想史进行研究，可以发现新的史料，找到新的研究关注点。这就要求业内学者努力译介并尽快研究英语学术谱系外的相关权威学术资料，包括专题资料和通史资料，扩展我们对世界法治现代化进程的理解。\n这段文字旨在强调：","options":{"A":"法律思想史研究受制于英语学术谱系","B":"法律思想史研究须重视非英语学术谱系","C":"西方法律思想史研究存在“吃偏食”现象","D":"非英语学术谱系中存在大量有价值的材料"},"answer":"B","explanation":"文段开篇指出传统的西方法律思想史研究存在“吃偏食”的问题，接着通过转折词“实际上”指出非英语学术谱系中存在大量有价值的材料，后文通过“要求”提出对策，并通过“比如”进行举例论证，尾句通过指代词“这”总结前文，并通过“要求”提出对策，故文段为提出问题-解决问题的结构，重点为对策，即业内学者应该研究英语学术谱系外的内容，对应B项。\nA项“受制于”为问题表述，且为文段话题引入部分内容，非重点，排除；\nC项“西方法律思想史研究存在‘吃偏食’的现象”为文段话题引入部分内容，非重点，排除；\nD项，“非英语学术谱系中存在大量有价值的材料”为对策之前的表述，非重点，排除。\n故正确答案为B。\n【文段出处】人民网：《拓展西方法律思想史的研究视野》","no":43,"missingImage":false},{"type":"question","qid":"3522409","cat":"片段阅读","stem":"有人是“早起鸟”，有人是“夜猫子”，每个人都有自己一套独特的生物钟。生物钟是体内控制日常生物节律的系统，帮助调整人体\u003cimg data-k=\"2c6adc1698b0\">左右的基因活动，睡眠、进食、体温、血压等的“节奏编排”均与之相关。测量人体生物钟的常用方法是监测人体内褪黑素浓度的变化，不过此法要求研究对象长时间坐在暗室，每隔大约一小时采集一次血液或唾液的样本。目前，多国科研人员正尝试开发快速检测人体生物钟的新法，以期更好地了解人体，保障健康。研究人员表示，生物钟紊乱与糖尿病、心脏病、抑郁症等多种疾病相关，如能找到检测人体生物钟的简便方法，将有助于人们更好地了解并治疗这些疾病。\n上述文字重在强调：","options":{"A":"每个人都有一套属于自己的生物钟","B":"研究生物钟可助于人们更好了解疾病","C":"科研人员正探索人体生物钟检测新法","D":"生物钟系统有助于调整人体基因活动"},"answer":"C","explanation":"文段开篇引出生物钟的话题，具体介绍生物钟以及生物钟的功能，指出生物钟很重要。接着通过转折词“不过”引出问题，即常用于测量生物钟的方法比较复杂不够便利，随后给出解决的对策“多国科研人员正尝试开发快速检测人体生物钟的新法”并阐述其意义。最后引用研究人员的话通过正面论证强调前文“开发快速检测人体生物钟的新法”的必要性。故文段重点在对策，即强调要找到检测人体生物钟的新法，对应C项。\nA项，对应文段引出话题部分，非文段重点，排除；\nB项，对应尾句解释说明部分，且为意义表述，非文段重点；同时文段尾句为“检测人体生物钟的简便方法······”选项表述为“研究生物钟”，偏离文段核心，排除；\nD项，“调整人体基因活动”对应生物钟的功能，话题引入，非文段重点，排除。\n故正确答案为C。\n【文段出处】《科研人员探索人体生物钟检测新法》","no":44,"missingImage":false},{"type":"question","qid":"3522574","cat":"片段阅读","stem":"原子钟在日常生活和科学研究中非常重要。它以原子内部的电子在两个能级间跳跃时辐射出来的电磁波为标准，去控制校准电子振荡器，实现精准的时间测量。与原子相比，高电荷离子的外层电子与原子核的结合更强，对外部场的波动更不敏感，狭义相对论和量子电动力学的效应也更显著。因此，高电荷离子是未来研发更精准原子钟的理想选择之一。然而，由于内部结构复杂，要在高电荷离子中识别适合于原子钟的电子跃迁非常困难，常用的光谱法测量这种跃迁也不够精准。\n根据这段文字，接下来最可能讲的是：","options":{"A":"高电荷离子的物理构造","B":"测量电子跃迁的最新技术","C":"高精度原子钟的意义和价值","D":"光谱法在原子钟研发中的作用"},"answer":"B","explanation":"文段首先引出了“原子钟”的话题，并介绍了其工作原理，随后通过结论词“因此”总结前文，指出高电荷离子是未来研发更精准原子钟的理想选择之一。接着尾句通过转折词“然而”引出问题，指出在高电荷离子中识别适合原子钟的电子跃迁很困难，常用方法也不精准。结合全文及尾句内容，下文应该围绕解决“电子跃迁”这一问题提出对策，对应B项。\nA项，与文段最后论述的核心话题不一致，尾句着重论述的是“电子跃迁”，排除；\nC项，“高精度原子钟”与文段最后论述的核心话题不一致，排除；\nD项，文段尾句已经提及“常用的光谱法测量这种跃迁也不够精准”，故文段接下来不会围绕光谱法的作用进行展开，排除。\n故正确答案为B。\n【文段出处】《为“大象身上的蚂蚁”称重，追求更高精度原子钟》","no":45,"missingImage":false},{"type":"question","qid":"3522579","cat":"片段阅读","stem":"田山歌，是以表现稻作生产和水乡生活风情为内容的山歌形式，曾广泛流传于长江三角洲部分水稻耕作地区。田山歌与其说是歌，不如说是一种文化现象，它记录了历史文化、婚姻爱情、民情风俗，反映人文语言心理、宗教等大量内容，有着江南稻作文化区域民歌中独特的艺术价值和欣赏价值。田山歌的历史源头，一直可以追溯到新石器时代，当太湖流域开始有原始的栽培水稻农业时，整个江南就已经产生田山歌的原始形态。作为我国典型的稻作农业区，太湖流域的自然条件十分有利。因此，这种悠久的稻作文化传统，为当地人们创作、传承田山歌奠定了重要的基础。\n这段文字主要介绍的是：","options":{"A":"田山歌特有的艺术价值","B":"田山歌特殊的环境条件","C":"田山歌独特的创作手法","D":"田山歌深厚的文化底蕴"},"answer":"D","explanation":"文段开篇下定义，引出“田山歌”这一话题，接着指出田山歌是一种文化现象，有着江南稻作文化独特的艺术价值和欣赏价值，又介绍了田山歌的历史源头，太湖流域的自然条件有利于栽培水稻。最后，通过结论词“因此”对前文进行总结，论述了这种悠久的稻作文化传统为田山歌的创作和传承奠定了基础，强调了稻作文化传统对于田山歌的重要作用，对应D项。\nA项“艺术价值”，B项“环境条件”，C项“创作手法”均对应尾句之前分述部分的内容，非文段重点，排除。\n故正确答案为D。\n【文段出处】《从松江“田山歌” 看如何保留传统音乐的生存土壤》","no":46,"missingImage":false},{"type":"question","qid":"3522600","cat":"片段阅读","stem":"在半个世纪前撞上地球的巨大陨石内，科学家们发现了距今70亿年的星尘。这是地球上已知存在的最古老物质。这种古老的尘埃由比我们的太阳更古老的颗粒组成，通过垂死的恒星进入宇宙。这种尘埃最终借着1969年坠落于澳大利亚的默奇森陨石来到地球。这也是研究人员第一次在地球上的岩石中发现太阳前颗粒。在这项新的研究中，研究人员分析了来自默奇森陨石的颗粒。他们把颗粒碾碎后加入酸性物质，以溶解矿物和硅酸盐，从而仅留下太阳前颗粒。\n最适合做这段文字标题的是：","options":{"A":"太阳前颗粒的价值","B":"默奇森陨石的由来","C":"地球上最古老的物质","D":"陨石的科学研究价值"},"answer":"C","explanation":"文段首先指出在巨大陨石内发现了地球上已知存在的最古老物质，即星尘，接着通过指代词“这种尘埃”指代地球上已知存在的最古老物质星尘，指出其借助陨石来到地球，这也是研究人员第一次在地球上的岩石中发现太阳前颗粒，后文对这一研究进行详细论述，故文段重点围绕地球上最古老的物质来论述，对应C项。\nA项“价值”、D项“科学研究价值”文段均未论述，无中生有，排除；\nB项，“默奇森陨石”非重点，文段重在强调借助默奇森陨石来到地球的最古老物质，排除。\n故正确答案为C。\n【文段出处】《2020年十大科学新纪录》","no":47,"missingImage":false},{"type":"question","qid":"3522598","cat":"语句表达","stem":"当前，我国对互联网平台经济创新秉持“包容审慎”的监管原则，然而这并不意味着监管部门可以放任不管。“包容”意在鼓励创新，为各类企业特别是初创型中小企业在发展早期提供更加宽容的营商环境和法治环境，是尊重市场新业态发展规律的体现；“审慎”则是在法治框架和法治原则下开展监管，在触及法治底线和监管红线的问题上必须严格依法监管。因此，                    ，应合理界定有效创新与有为监管的边界，在鼓励创新与防范风险之间寻求法治框架下的动态平衡。\n填入画横线部分最恰当的一项是：","options":{"A":"保障平台经济在创新发展与监管内运行","B":"面对平台经济创新发展中的风险和挑战","C":"平台风险控制和危机管理容易陷入困境","D":"正确甄别平台的经济创新和发展的能力"},"answer":"B","explanation":"横线在文段尾句，且为尾句的分句，需考虑与前后文的衔接。横线前首先引出互联网平台经济创新这一话题，阐明我国面对这一现象所秉持的原则，即“包容审慎”，接着通过“然而”进行转折，表述对“包容审慎”定义的解释。横线后通过“应”提出对策强调要在鼓励创新与防范风险之间达到平衡，横线处应既承接前文的话题，又能引出后文“寻求动态平衡”的对策。B项，既包含核心话题“互联网平台经济创新”，同时“风险和挑战”匹配对策“鼓励创新与防范风险”，当选。\nA项，对应后文“界定有效创新与有为监管的边界”，但界定边界是寻求动态平衡的方法，不是对策所要体现的重点，横线后对策意在表达如何应对创新与风险之间的关系，与后文不匹配，排除；\nC项，文段主题词为“平台经济创新”，选项表述为“平台”，偷换概念，且“危机管理”无中生有，排除；\nD项，“正确甄别”在文段中并没有体现，无中生有，排除。\n故正确答案为B。\n【文段出处】《理清创新与监管边界 积极应对长租公寓平台风险挑战》","no":48,"missingImage":false},{"type":"question","qid":"3522593","cat":"语句表达","stem":"①人们听音时，首先是要用耳朵去听而不是用仪器去测量，如何判断，依靠的就是人们的“音准感”\n②这种音准有着精确的物理意义，音是由物体的震动产生的，每个乐音震动的频率就是它的物理属性\n③另一种音准指的是人们对于音高的一种听力反应，严格来讲应该叫做“音准感”\n④而在音乐中使用的音并不是随意产生的，是人们在长期实践过程中挑选出来的\n⑤我们通常所说的音准，一般有两种含义\n⑥一种是音乐中的音高要遵循一定的规律，那就是音高的准确性，即音准\n请将上述语句重新排列，语序正确的是：","options":{"A":"⑤⑥④①③②","B":"①③②⑤⑥④","C":"①⑤⑥③②④","D":"⑤⑥②④③①"},"answer":"D","explanation":"根据选项判断首句，①句介绍人们听音时依靠的就是人们的“音准感”，⑤句最先引出“音准”，强调它有两种含义。对比之下⑤句更适合作首句，排除B、C两项。\n观察发现，②句出现指代词“这种”，指代对象为音准，且论述这种音准有着精确的物理意义，观察选项发现，②句之前分别为③句和⑥句，⑥句论述音准，介绍音高的准确性，⑥句和②句衔接很恰当，可以构成指代词捆绑，D项当选。③句论述音准感，介绍是人们对于音高的一种听力反应，与②中对“音准”精确性论述的话题无关，无法构成指代词捆绑，排除 A 项。\n故正确答案为D。\n【文段出处】《音乐有这些“神力”，你知道吗？》","no":49,"missingImage":false},{"type":"question","qid":"3522587","cat":"片段阅读","stem":"今年的寒冬，其实恰恰部分源于全球变暖，这种反常的现象，和一种极地涡旋的气候现象有关。极地涡旋是一种发生于极地、介于对流层和平流层的中上部、持续性长且规模大的气旋。最早记载极地涡旋现象的文献出现于1853年。在北半球的冬季，这种现象会导致突然性平流层暖化。1952年，无线电探空仪在海拔高度超过20公里的观测中发现了这种现象导致的平流层暖化。在2013年后的北美冬季，媒体报道中经常提到这种现象，使得该术语推广成为对极低温寒潮的解释。\n下列关于极地涡旋的表述正确的是：","options":{"A":"极地涡旋是全球气候变暖的“元凶”","B":"极地涡旋现象最早出现于1853年","C":"极地涡旋说明了极低温寒潮现象","D":"极地涡旋是一种反常的气候现象"},"answer":"C","explanation":"A项，根据“今年的寒冬，其实恰恰部分源于全球变暖，这种反常的现象，和一种极地涡旋的气候现象有关”可知，文段描述仅是有关，并未提及“元凶”，无中生有，排除；\nB项，根据“最早记载极地涡旋现象的文献出现于1853年”可知，文段介绍的是记载极地涡旋现象的文献最早出现的时间，并非“极地涡旋现象”最早出现的时间，偷换概念，排除；\nC项，根据 “媒体报道中经常提到这种现象，使得该术语推广成为对极低温寒潮的解释”可知，极地涡旋是对极低温寒潮现象的解释，表述正确，当选；\nD项，根据“今年的寒冬，其实恰恰部分源于全球变暖，这种反常的现象，和一种极地涡旋的气候现象有关”可知，反常的现象指的是寒冬，并非极地涡旋现象，偷换概念，排除。\n故正确答案为C。\n【文段出处】《这个冬天为什么这么冷》","no":50,"missingImage":false},{"type":"question","qid":"3522603","cat":"片段阅读","stem":"随着互联网的普及，会有越来越多的老年人掌握互联网技术，能够熟练使用智能手机。但要知道，技术的发展是在不断演进的，一个社会总会不断出现新的“落伍者”，即便是今天在数字化社会中成长起来的年轻人，未来也可能沦为“落伍者”，面临今天部分老人所面临的困境。因此，抛开技术不谈，我们的公共服务，首先还是应在理念上有更多的包容、普惠底色，真正依据不同群体的需求去设定公共服务提供方式，而不是一味追求技术上的“现代化”。\n这段文字意在强调：","options":{"A":"从资源和技术上能有效解决老年人面临的根本性难题","B":"老年人在网络时代遭遇数字鸿沟的现象变得更加突出","C":"在相关领域针对老年人等群体提供更为人性化的服务","D":"数字化带来便利的同时也给部分老年人群体带来不便"},"answer":"C","explanation":"文段开篇介绍随着互联网的普及，越来越多的老年人会慢慢地熟练使用智能手机。接着通过“但”进行转折，指出技术的发展是不断演进的，社会总会不断出现“落伍者”，今天的年轻人未来也可能沦为“落伍者”。尾句通过“因此”总结前文，提出我们应该从理念层面体现包容性，依据不同群体的需求提供公共服务。文段重在强调用包容的理念依据不同群体需求提供公共服务，对应C项。\nA项，“从资源上解决老年人难题”文段并未提及，无中生有，排除。\n\nB项，“老年人在网络时代遭遇数字鸿沟的现象”文中并未提及，属于无中生有，排除。\nD项，“给部分老年人群体带来不便”为问题表述，文段重点在提出对策，问题表述非重点，排除。\n故正确答案为C。\n【文段出处】《让老人在数字化时代少碰壁，别再把他们视为“少数群体”》","no":51,"missingImage":false},{"type":"question","qid":"3522607","cat":"语句表达","stem":"农民卖粮舒心，源于市场之“手”用得好。2020年的夏粮生产，不仅数量增加，质量也在提升。一个重要指标就是专用麦比例高，全国优质强筋弱筋小麦面积占比\u003cimg data-k=\"6f4939f1fb4a\">，比上年提高2.8个百分点。从目前收购市场情况看，每斤优质小麦要比普通品种高出0.1元左右。这背后，\u003cu>                    \u003c/u>。如今，多元化市场主体入市收购，既让丰收粮有了更加多样化的销售渠道，也让优质粮食品种销路更好、价格更高，优粮优价成为种粮农民增收的“金钥匙”。\n填入画横线部分最恰当的一项是：","options":{"A":"说到底就是稳住这些农民的种粮收益，保护农民的种粮积极性","B":"正是粮食收储制度改革持续推进，市场机制作用得到更好发挥","C":"全国农户构成了粮食安全的坚强基石，稳住粮食生产的好形势","D":"通过优化供给体系，拓展粮食产加销增值空间，分享增值收益"},"answer":"B","explanation":"本题为语句填空题，横线在文段中间，需联系前后文把握话题的一致性。横线前首先指出农民粮食卖的好得益于市场，紧接着指出全国优质强筋弱筋小麦面积占比不断提高且价格也高于普通品种，横线后论述“多元化市场主体入市收购”使得优质粮食品种销路好、价格高，故横线处所填句子应体现优质粮食销路好、价格高的原因在于“市场”发挥作用，对应B项。\nA项，“稳住这些农民的种粮收益，保护农民的种粮积极性”，无法与后文“市场”衔接，排除；\nC项：“全国农户构成了粮食安全的坚强基石”强调农户的重要性，而文段重点围绕“市场”展开，并未提及农户的重要性，该项与前后文衔接不当，排除。\nD项：“通过优化供给体系”强调“供给”，而文段重点围绕“市场”展开，并未提及“供给”，该项与前后文衔接不当，排除。\n故正确答案为B。\n【文段出处】潇湘晨报《千方百计保护农民的种粮积极性（话说新农村）》","no":52,"missingImage":false},{"type":"question","qid":"3522578","cat":"片段阅读","stem":"历史上的大国争霸曾经历严重冲突，有的演变为战争。但与几十年或一二百年前相比，当今世界结构已经发生了很大变化。一方面，全球化的大幅推进已经使包括大国在内的国家间利益连接空前密切，脱钩往往是损人又害己，相互均无好处；另一方面，核武器使大国间的正面冲突不可能有赢家，实际上这也划出了大国冲突的底线。传统和非传统全球性问题清单不断加长，一个超级大国已经无力主宰或主导全球事务，更不可能公正有效地提供全球公共产品。\n这段文字接下来最可能讲的是：","options":{"A":"全球公共产品及其供应现状","B":"历史上大国争霸的严重后果","C":"当前大国冲突最理想的出路","D":"全球化时代国际关系的特点"},"answer":"C","explanation":"根据提问方式可知，本题为接语选择题。文段开篇引出大国冲突的话题，紧接着从两个方面展开论述世界结构的具体变化，并通过“脱钩往往是损人又害己”“正面冲突不可能有赢家”说明如今大国冲突的复杂性，最后通过讲述超级大国存在的问题，进一步强调目前大国冲突的复杂性，整篇文段为提出问题\u003cimg data-k=\"3d6d1f96db11\">分析问题的行文脉络，故文段接下来应继续围绕在当今世界结构下，如何解决大国冲突来展开讨论，对应C项。\nA、D两项，均未提及文段讨论的核心话题“大国冲突”，故衔接不当，排除。\nB项，对应文段开头已论述过的内容，故接下来不太可能再次论述，排除。\n故正确答案为C。\n【文段出处】《刘世锦：“十四五”时期的改革就是在压力下突围》","no":53,"missingImage":false},{"type":"question","qid":"3522590","cat":"片段阅读","stem":"当前，“云观展”成为一种热潮。虽然线上展览已普遍拥有极度高清的分辨率，但仍有不少观众希望欣赏实物。这不仅是为了欣赏展品的结构和色彩，更是为了感受每个纹路中所体现的技法与质感，而这些仅仅通过图像是很难传递给观众的。除展品本身外，展览中的墙壁、地毯的质地、颜色，展厅中的光线甚至气味，展品之间实际的大小与尺寸比例，都是构建观众对展览认知的重要框架，是线上彼此割裂的单幅展品或虚拟观展体验所无法实现的。\n这段文字意在说明：","options":{"A":"线下展览仍具有难以替代的优势","B":"观众对观展体验的要求越来越高","C":"“云观展”与线下观展的比较分析","D":"构建观众对展览的认知框架很重要"},"answer":"A","explanation":"文段开篇引出背景，即“云观展”成为一种热潮，紧接着通过转折关联词“但”指出，仍有不少观众希望欣赏实物，接着从展品本身以及展览环境两个方面具体阐述了线上展览无法替代线下展览的原因，故文段强调的重点为线上展览仍无法替代线下展览，对应A项。\nB项，“要求越来越高”文段并未提及，无中生有，排除；\nC项，“比较分析”对应后文解释说明部分的内容，非重点，排除；\nD项，“构建观众对展览的认知框架”对应文段尾句，为解释说明的内容，非重点，排除。\n故正确答案为A。\n【文段出处】《疫情结束后，“云观展”能否取代线下展览？》","no":54,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"3523439","cat":"数学运算","stem":"一次2小时的在线会议，会议结束前半小时才有人开始退出且每分钟退出会议人数满足\u003cimg data-k=\"2f6ab4709122\">，（\u003cimg data-k=\"da47261cd4a4\">）。若会议开始后加入会议人数是退出人数的1.5倍，且会议结束时还有100人在线，问会议开始时可能有多少人在线？","options":{"A":"40","B":"50","C":"60","D":"70"},"answer":"A","explanation":"设会议开始时可能有\u003cimg data-k=\"5320a525f2bc\">人在线。由题意可知，会议结束前半小时每分钟退出会议人数分别为\u003cimg data-k=\"47ea5ec41ded\">人、\u003cimg data-k=\"61c610909647\">人、\u003cimg data-k=\"89f97857b02b\">人、\u003cimg data-k=\"6c9dbef57698\">人······，则会议结束前的半小时共退出\u003cimg data-k=\"f86805f955fa\">人，故会议开始后加入会议人数\u003cimg data-k=\"3473c9e88fd9\">人。会议结束时还有100人在线，则\u003cimg data-k=\"3ed3db508ca7\">，解得\u003cimg data-k=\"ff21c3e483e0\">，即会议开始时可能有40人在线。\n故正确答案为A。","no":55,"missingImage":false},{"type":"question","qid":"3523440","cat":"数学运算","stem":"张三与李四骑马观光，从东方村开始，途经幸福村到胜利村。从东方村骑行1小时后，张三：“已经走了多远？”李四：“刚好是到幸福村的一半。”两人又骑行20公里后，张三：“到胜利村还有多远？”李四：“刚巧是离幸福村的一半那样远。”则东方村到胜利村的距离是多少公里？","options":{"A":"30","B":"35","C":"40","D":"45"},"answer":"B","explanation":"此题对第二个过程的理解不同，会出现不同的答案。\n【解析一】将东方村、幸福村、胜利村分别看成A、B、C三地，全程分为两个过程，第一个过程：先行驶AB（东方村到幸福村）的一半，用时1小时；第二个过程：又行驶20公里后，所处位置距胜利村（C）的距离刚好是到幸福村（B）的一半，即再行驶AB的\u003cimg data-k=\"0f1fa1d0536c\">加上BC的\u003cimg data-k=\"8c3342040bcf\">共20公里。根据条件可得\u003cimg data-k=\"6ec291b9515d\">，则全长\u003cimg data-k=\"5b3b5dcd56e1\">\u003cimg data-k=\"02deebfd67c3\">\u003cimg data-k=\"4f24981af68d\">，排除C、D两项。代入A项，若全长为30公里，则可得\u003cimg data-k=\"f2bfe0a607be\">，\u003cimg data-k=\"f124c0c6e928\">，与全长为30公里矛盾。\n故正确答案为B。\n【解析二】将东方村、幸福村、胜利村分别看成A、B、C三地，全程分为两个过程，第一个过程：先行驶AB的一半，用时1小时；第二个过程：如果理解成到胜利村（C）的距离刚好是胜利村（C）离幸福村（B）的一半那么远，即再行驶AB的\u003cimg data-k=\"0f1fa1d0536c\">加上BC的\u003cimg data-k=\"0f1fa1d0536c\">共20公里，那么全长\u003cimg data-k=\"5b3b5dcd56e1\">\u003cimg data-k=\"b1f80f209a34\">公里。\n故正确答案为C。\n本题表述有争议，粉笔给出两种解题思路，但更倾向于选B。","no":56,"missingImage":false},{"type":"question","qid":"3523442","cat":"数学运算","stem":"某直播平台为3种特色农产品直播带货3小时，第1小时B产品销售额比A产品多50万元，C产品只有B产品的\u003cimg data-k=\"1a67739c8245\">；第2小时与第1小时相比：A翻倍，B增加幅度比A少\u003cimg data-k=\"798f1f286d1f\">，而C增加两倍；最后1小时共带货3090万元，且A产品带货额比第1小时大幅增加\u003cimg data-k=\"65570c2650eb\">，B、C均比第2小时增加\u003cimg data-k=\"e172e0ad0a10\">，问第2小时直播带货额是多少万元？","options":{"A":"1580","B":"1600","C":"1860","D":"2000"},"answer":"C","explanation":"题干给出A、B、C3种农产品在带货第1、2、3小时内销售额的关系，可设第1小时B产品销售额为\u003cimg data-k=\"5320a525f2bc\">万元，可得三类产品3小时内得销售额如下：\n\u003cimg data-k=\"8006a5da41b8\" style=\"max-width:700px\">\n根据最后1小时共带货3090万元可得：\u003cimg data-k=\"cb97164db506\">\u003cimg data-k=\"4ce91af122cf\">；化简得\u003cimg data-k=\"19bdfb6389f4\">，解得\u003cimg data-k=\"d6a4b7dafceb\">。\n代入\u003cimg data-k=\"d6a4b7dafceb\">，第2小时带货额为\u003cimg data-k=\"792acd1d0852\">万元。\n故正确答案为C。","no":57,"missingImage":false},{"type":"question","qid":"3523436","cat":"数学运算","stem":"边长为整数且成等差数列的三个正方形，面积之和不大于5000，其中有两个正方形的面积之和等于第3个正方形的面积，这样的正方形存在多少组？","options":{"A":"6","B":"7","C":"9","D":"10"},"answer":"D","explanation":"方法一：设三个正方形的边长分别为\u003cimg data-k=\"7ae5a56532ab\">、\u003cimg data-k=\"5320a525f2bc\">、\u003cimg data-k=\"8d268ca6d29b\">，则面积分别为\u003cimg data-k=\"ac25bd7a4fe8\">、\u003cimg data-k=\"498ec32b8bad\">、\u003cimg data-k=\"44e421fc49b3\">；根据题干条件，\u003cimg data-k=\"2daab4f5ca68\">，\u003cimg data-k=\"ba6dc6c55dd4\">\u003cimg data-k=\"1ee3dbde1365\">，联立方程组可得\u003cimg data-k=\"f1162a45b178\">，即\u003cimg data-k=\"ec81f949d9f1\">，\u003cimg data-k=\"d80078d4c0dc\">；根据\u003cimg data-k=\"2daab4f5ca68\">，可得\u003cimg data-k=\"c08ad8bcf74c\">；代入\u003cimg data-k=\"d80078d4c0dc\">，可得\u003cimg data-k=\"d26809135bf5\">，\u003cimg data-k=\"3e2cf2ff01d0\">，由于为整数且不为0，故共有10组。\n方法二：根据平方和等于最大数的平方，联想到满足勾股定理的整数组，勾股数。常见的勾股数只有（3，4，5）及其倍数是满足等差关系的，即\u003cimg data-k=\"3630ad07c60a\">，\u003cimg data-k=\"5d3a63765477\">，\u003cimg data-k=\"23cbdaf37502\">，\u003cimg data-k=\"11cafca943d2\">\u003cimg data-k=\"eb747d9a39e5\">，解得\u003cimg data-k=\"a74c56f79ef3\">，故共有10组。\n故正确答案为D。","no":58,"missingImage":false},{"type":"question","qid":"3522713","cat":"数学运算","stem":"小张和小李负责生产1200个零件，小张每天均生产20个。小李第一天生产10个，往后除最后一天外，每一天的产量都比前一天多1个。问整个任务中小张生产的个数比小李：","options":{"A":"多40个","B":"多80个","C":"少40个","D":"少80个"},"answer":"D","explanation":"设完成整个任务共耗时\u003cimg data-k=\"19d45fdac879\">天，则小张完成的工作总量为\u003cimg data-k=\"c75c4d77e416\">个，假定小李最后一天也比前一天多1个，则小李每天完成的工作量构成了一个首项为10，公差为1，项数为\u003cimg data-k=\"19d45fdac879\">的等差数列，根据等差数列通项公式\u003ci
