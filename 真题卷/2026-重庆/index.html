<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">2026年重庆市公务员录用考试《行测》题（网友回忆版）<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",papers:[{"slug":"2026-重庆","title":"2026年重庆市公务员录用考试《行测》题（网友回忆版）","year":"2026","group":"重庆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"16070174","cat":"新思想","stem":"推进中国式现代化是一个系统工程，需要统筹兼顾、系统谋划、整体推进，正确处理好一系列重大关系。下列与之相关的表述正确的有（    ）。\n①活力与秩序：中国式现代化应当而且能够实现活而不乱、活跃有序的动态平衡\n②守正与创新：守正才能不迷失方向、不犯颠覆性错误，创新才能把握时代、引领时代\n③战略与策略：要增强策略的前瞻性，准确把握事物发展的必然趋势，以科学的战略预见未来、引领未来\n④效率与公平：中国式现代化既要创造比资本主义更高的效率，又要更有效地维护社会公平，更好实现效率与公平相兼顾、相促进、相统一","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查新思想。\n2023年10月1日，《求是》杂志发表习近平总书记重要文章《推进中国式现代化需要处理好若干重大关系》，以下简称文章。\n①正确，文章指出：“五是活力与秩序的关系。在现代化的历史进程中，处理好这对关系是一道世界性难题。中国式现代化应当而且能够实现活而不乱、活跃有序的动态平衡。”\n②正确，文章指出：“三是守正与创新的关系。守正创新是我们党在新时代治国理政的重要思想方法。守正才能不迷失方向、不犯颠覆性错误，创新才能把握时代、引领时代。”\n③错误，文章指出：“二是战略与策略的关系。战略与策略是我们党领导人民改造世界、变革实践、推动历史发展的有力武器······要增强战略的前瞻性，准确把握事物发展的必然趋势，敏锐洞悉前进道路上可能出现的机遇和挑战，以科学的战略预见未来、引领未来。”故“策略的前瞻性”表述有误，应为“战略的前瞻性”。\n④正确，文章指出：“四是效率与公平的关系。中国式现代化既要创造比资本主义更高的效率，又要更有效地维护社会公平，更好实现效率与公平相兼顾、相促进、相统一。”\n故①②④表述正确，共3项。\n故正确答案为C。","no":1,"missingImage":false},{"type":"question","qid":"16070156","cat":"时事政治","stem":"制定“十五五”规划建议，系统谋划“十五五”时期经济社会发展，是实现党的二十大描绘的宏伟蓝图、分阶段有步骤推进中国式现代化的需要，意义重大。关于“十五五”规划建议，下列表述正确的有几项？\n①适度超前建设新型基础设施，推进信息通信网络、全国一体化算力网、重大科技基础设施等建设和集约高效利用\n②推动量子科技、生物制造、第六代移动通信等成为新的经济增长点\n③建设法治经济、信用经济，打造市场化法治化国际化一流营商环境\n④健全与常住人口相匹配的公共资源配置机制，加强县域基本公共服务供给统筹","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n2025年10月23日，中国共产党第二十届中央委员会第四次全体会议通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》（以下简称《建议》）。\n①正确，《建议》在“三、建设现代化产业体系，巩固壮大实体经济根基”部分指出：“（10）构建现代化基础设施体系。加强基础设施统筹规划，优化布局结构，促进集成融合，提升安全韧性和运营可持续性。适度超前建设新型基础设施，推进信息通信网络、全国一体化算力网、重大科技基础设施等建设和集约高效利用，推进传统基础设施更新和数智化改造。”\n②正确，《建议》在“三、建设现代化产业体系，巩固壮大实体经济根基”部分指出：“前瞻布局未来产业，探索多元技术路线、典型应用场景、可行商业模式、市场监管规则，推动量子科技、生物制造、氢能和核聚变能、脑机接口、具身智能、第六代移动通信等成为新的经济增长点。”\n③正确，《建议》在“二、‘十五五’时期经济社会发展的指导方针和主要目标”部分指出：“坚持有效市场和有为政府相结合。充分发挥市场在资源配置中的决定性作用，更好发挥政府作用，构建统一、开放、竞争、有序的市场体系，建设法治经济、信用经济，打造市场化法治化国际化一流营商环境，形成既‘放得活’又‘管得好’的经济秩序。”\n④正确，《建议》在“十一、加大保障和改善民生力度，扎实推进全体人民共同富裕”部分指出：“（44）稳步推进基本公共服务均等化。建立基本公共服务均等化评价标准，完善基本公共服务范围和内容，制定实现基本公共服务均等化的目标、路径、措施，推动更多公共服务向基层下沉、向农村覆盖、向边远地区和生活困难群众倾斜，健全与常住人口相匹配的公共资源配置机制。加强县域基本公共服务供给统筹，完善投入保障长效机制。全面深化事业单位改革。”\n综上，①②③④表述正确，共4项。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"16069904","cat":"时事政治","stem":"党的二十届四中全会指出，“十五五”时期是基本实现社会主义现代化夯实基础、全面发力的关键时期，在基本实现社会主义现代化进程中具有承前启后的重要地位。关于“十五五”规划，下列说法正确的是：","options":{"A":"加强原始创新和关键核心技术攻关，推动科技创新和产业创新深度融合","B":"把发展经济的着力点向传统实体产业转移，巩固壮大传统实体产业根基","C":"积极稳妥推进和实现碳达峰，发展集中式能源，逐步缩减全国碳排放权交易市场","D":"发挥积极财政政策作用，适当加强地方事权、提高地方财政支出比重，增加地方自主财力"},"answer":"A","explanation":"本题考查新思想。\n2025年10月23日，中国共产党第二十届中央委员会第四次全体会议通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》（以下简称《建议》）。\nA项正确，《建议》在“四、加快高水平科技自立自强，引领发展新质生产力”部分指出：“（11）加强原始创新和关键核心技术攻关。完善新型举国体制，采取超常规措施，全链条推动集成电路、工业母机、高端仪器、基础软件、先进材料、生物制造等重点领域关键核心技术攻关取得决定性突破······（12）推动科技创新和产业创新深度融合。统筹国家战略科技力量建设，增强体系化攻关能力。强化科技基础条件自主保障，统筹科技创新平台基地建设。完善区域创新体系，布局建设区域科技创新中心和产业科技创新高地，强化国际科技创新中心策源功能······”\nB项错误，《建议》在“三、建设现代化产业体系，巩固壮大实体经济根基”部分指出：“现代化产业体系是中国式现代化的物质技术基础。坚持把发展经济的着力点放在实体经济上，坚持智能化、绿色化、融合化方向，加快建设制造强国、质量强国、航天强国、交通强国、网络强国，保持制造业合理比重，构建以先进制造业为骨干的现代化产业体系。”故“把发展经济的着力点向传统实体产业转移，巩固壮大传统实体产业根基”表述错误，应为“坚持把发展经济的着力点放在实体经济上，巩固壮大实体经济根基”。\nC项错误，《建议》在“十二、加快经济社会发展全面绿色转型，建设美丽中国”部分指出：“（47）积极稳妥推进和实现碳达峰。实施碳排放总量和强度双控制度。深入实施节能降碳改造。推动煤炭和石油消费达峰。完善碳排放统计核算体系，稳步实施地方碳考核、行业碳管控、企业碳管理、项目碳评价、产品碳足迹等政策制度。发展分布式能源，建设零碳工厂和园区。扩大全国碳排放权交易市场覆盖范围，加快温室气体自愿减排交易市场建设······”故“发展集中式能源，逐步缩减全国碳排放权交易市场”表述错误，应为“发展分布式能源，扩大全国碳排放权交易市场覆盖范围”。\nD项错误，《建议》在“六、加快构建高水平社会主义市场经济体制，增强高质量发展动力”部分指出：“（20）提升宏观经济治理效能。发挥积极财政政策作用，增强财政可持续性······适当加强中央事权、提高中央财政支出比重。增加地方自主财力。加强财会监督。加快构建同高质量发展相适应的政府债务管理长效机制。”故“适当加强地方事权、提高地方财政支出比重”表述错误，应为“适当加强中央事权、提高中央财政支出比重”。\n故正确答案为A。","no":3,"missingImage":false},{"type":"question","qid":"16070305","cat":"新思想","stem":"习近平总书记强调，要推动森林“水库、钱库、粮库、碳库”更好联动，实现生态效益、经济效益、社会效益相统一。下列表述与这一要求相契合的有几项？\n①手中有粮，心中不慌\n②绿水青山就是金山银山\n③增绿就是增优势，护林就是护财富\n④环境就是民生，青山就是美丽，蓝天也是幸福","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查新思想。\n①错误，2020年5月23日，习近平总书记在看望参加全国政协十三届三次会议的经济界委员并参加联组会时强调：“对我们这样一个有着14亿人口的大国来说，农业基础地位任何时候都不能忽视和削弱，手中有粮、心中不慌在任何时候都是真理。”故“手中有粮，心中不慌”强调农业对我国的重要性，但并未体现生态效益、经济效益、社会效益相统一。\n②正确，2005年8月15日，时任浙江省委书记的习近平同志，在湖州市安吉县余村考察时，首次提出“绿水青山就是金山银山”的科学论断。2018年5月18日，习近平总书记在全国生态环境保护大会上发表重要讲话指出：“绿水青山既是自然财富、生态财富，又是社会财富、经济财富。保护生态环境就是保护自然价值和增值自然资本，就是保护经济社会发展潜力和后劲，使绿水青山持续发挥生态效益和经济社会效益。”故“绿水青山就是金山银山”体现了生态效益、经济效益、社会效益相统一。\n③正确，2023年9月6日，习近平总书记在黑龙江漠河考察时指出：“要坚持造林与护林并重；要树立增绿就是增优势、护林就是护财富的理念，在保护的前提下让老百姓通过发展林下经济增加收入。”“增绿”“护林”体现了生态效益，“增优势”体现了社会效益，“护财富”体现了经济效益，故“增绿就是增优势，护林就是护财富”体现了生态效益、经济效益、社会效益相统一。\n④正确，2016年1月18日，习近平总书记在省部级主要领导干部学习贯彻党的十八届五中全会精神专题研讨班上发表重要讲话指出：“我讲过，环境就是民生，青山就是美丽，蓝天也是幸福，绿水青山就是金山银山；保护环境就是保护生产力，改善环境就是发展生产力。”“环境”“青山”“蓝天”体现了生态效益，“民生”“美丽”“幸福”体现了社会效益和经济效益，故“环境就是民生，青山就是美丽，蓝天也是幸福”体现了生态效益、经济效益、社会效益相统一。\n故相契合的有②③④，共3项。\n故正确答案为C。","no":4,"missingImage":false},{"type":"question","qid":"16069957","cat":"新思想","stem":"党的十八大以来，以习近平同志为核心的党中央坚定不移推进全面从严治党，取得一系列理论创新、实践创新、制度创新成果，构建起全面从严治党体系，开辟了百年大党自我革命新境界。下列关于全面从严治党的表述不准确的是（    ）。","options":{"A":"制度建设要与管党治党需要相适应、与党的各项建设相配套，全方位织密制度的笼子","B":"严密党的组织体系，关键是坚持党中央权威和集中统一领导，根本在做到“两个维护”","C":"新时代党的建设是以党的组织建设为统领、党的各项建设同向发力综合发力的系统工程","D":"着力抓好政治监督、领导班子特别是“一把手”监督、“三重一大”事项监督以及权力集中、资金密集、资源富集等重点领域的监督"},"answer":"C","explanation":"本题考查新思想。\n2025年2月16日，《求是》杂志发表习近平总书记重要文章《健全全面从严治党体系》，以下简称文章。\nA项正确，文章指出：“第四，健全科学完备、有效管用的制度体系。全面从严治党政治性、原则性强，必须有一套科学完备的制度来规范。制度建设要与管党治党需要相适应、与党的各项建设相配套，全方位织密制度的笼子。”\nB项正确，文章指出：“第一，健全上下贯通、执行有力的组织体系······只有党的组织体系严密起来，党的各级组织政治功能和组织功能充分发挥出来，全面从严治党才能持续向纵深推进。严密党的组织体系，关键是坚持党中央权威和集中统一领导，根本在做到‘两个维护’。”\nC项错误，文章指出：“······新时代党的建设是以党的政治建设为统领、党的各项建设同向发力综合发力的系统工程，必须以党中央关于党的建设的重要思想、关于党的自我革命的重要思想为根本遵循，坚持和加强党的全面领导和党中央集中统一领导······”故“以党的组织建设为统领”表述有误，应为“以党的政治建设为统领”。\nD项正确，文章指出：“第三，健全精准发力、标本兼治的监管体系······要突出监督重点，着力抓好政治监督、领导班子特别是‘一把手’监督、‘三重一大’事项监督以及权力集中、资金密集、资源富集等重点领域的监督，切实让特权现象和腐败问题无所遁形。”\n本题为选非题，故正确答案为C。","no":5,"missingImage":false},{"type":"question","qid":"16069974","cat":"新思想","stem":"习近平总书记指出，中国愿同世界各国一道，把握信息革命发展的历史主动，携手构建网络空间命运共同体，让互联网更好造福人民、造福世界。关于构建网络空间命运共同体，下列表述正确的是：\n①尊重网络主权，维护网络安全，共同构建和平、安全、开放、合作的网络空间\n②全球网络主要由跨国公司提供，网络空间未来应由跨国公司携手经营\n③倡导发展优先，构建更加普惠繁荣的网络空间\n④保障数据安全，建立单边、保密的国际互联网治理体系\n⑤深化网络安全务实合作，有力打击网络违法犯罪行为","options":{"A":"①③⑤","B":"①④⑤","C":"①②③⑤","D":"①②③④⑤"},"answer":"A","explanation":"本题考查新思想。\n①正确，2014年11月19日，习近平总书记在向首届世界互联网大会致贺词中强调：“中国正在积极推进网络建设，让互联网发展成果惠及13亿中国人民。中国愿意同世界各国携手努力，本着相互尊重、相互信任的原则，深化国际合作，尊重网络主权，维护网络安全，共同构建和平、安全、开放、合作的网络空间，建立多边、民主、透明的国际互联网治理体系。”\n②错误，2022年11月7日，国务院新闻办公室发布的《携手构建网络空间命运共同体》白皮书在“三、构建网络空间命运共同体的中国贡献”部分“（三）积极参与网络空间治理”中指出：“中国始终认为，国家不分大小、强弱、贫富，都是平等成员，都有权平等参与国际规则与秩序建构，确保网络空间未来发展由各国人民共同掌握。”同时，全球网络基础设施与治理体系以主权国家为核心主体，跨国公司仅为重要的商业服务提供者，而非“主要提供者”。故“网络空间未来应由跨国公司携手经营”表述错误，应为“确保网络空间未来发展由各国人民共同掌握”。\n③正确，2023年11月8日，习近平总书记向2023年世界互联网大会乌镇峰会开幕式发表的视频致辞指出：“我们倡导发展优先，构建更加普惠繁荣的网络空间。深化数字领域国际交流合作，加速科技成果转化。加快信息化服务普及，缩小数字鸿沟，在互联网发展中保障和改善民生，让更多国家和人民共享互联网发展成果。”\n④错误，2015年12月16日，习近平总书记在第二届世界互联网大会开幕式上的讲话中指出：“第五，构建互联网治理体系，促进公平正义。国际网络空间治理，应该坚持多边参与、多方参与，由大家商量着办，发挥政府、国际组织、互联网企业、技术社群、民间机构、公民个人等各个主体作用，不搞单边主义，不搞一方主导或由几方凑在一起说了算······”故“建立单边、保密的国际互联网治理体系”表述错误，应为“国际网络空间治理，应该坚持多边参与、多方参与，由大家商量着办”。\n⑤正确，2023年11月9日，人民日报发表的文章《共同推动构建网络空间命运共同体迈向新阶段》指出：“‘我们倡导安危与共，构建更加和平安全的网络空间。’只有尊重网络主权，遵守网络空间国际规则，深化网络安全务实合作，有力打击网络违法犯罪行为，加强数据安全和个人信息保护，才能妥善应对科技发展带来的规则冲突、社会风险、伦理挑战，更好维护网络空间安全。”\n故①③⑤表述正确。\n故正确答案为A。","no":6,"missingImage":false},{"type":"question","qid":"16069954","cat":"新思想","stem":"习近平总书记强调，要坚持以铸牢中华民族共同体意识为主线，不断推进民族团结进步事业，推动党的民族工作高质量发展。关于铸牢中华民族共同体意识，下列说法正确的有几项?\n①广泛交往交流交融是推进中华民族共同体建设的重要途径\n②加强对青少年的历史文化教育，全面推广普及国家通用语言文字，全面推行使用国家统编教材\n③要坚持和完善民族区域自治制度，逐步完善相关法律法规和差别化区域支持政策，依法保障各族群众合法权益\n④要引导各族群众不断增强对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n2024年9月27日，全国民族团结进步表彰大会在北京举行。习近平总书记出席大会并发表重要讲话。\n①正确，习近平总书记在讲话中指出：“第四，推动各民族全方位嵌入，积极促进各民族交往交流交融。广泛交往交流交融是推进中华民族共同体建设的重要途径。”\n②正确，习近平总书记在讲话中指出：“第二，着力构筑中华民族共有精神家园······加强对青少年的历史文化教育，全面推广普及国家通用语言文字，全面推行使用国家统编教材，把中华民族共同体意识从小就植入孩子们的心灵。”\n③正确，习近平总书记在讲话中指出：“第五，依法治理民族事务，不断提高民族事务治理能力和水平。要坚持和完善民族区域自治制度，逐步完善相关法律法规和差别化区域支持政策，依法保障各族群众合法权益。加强法治宣传教育，引导各族群众增强国家意识、公民意识、法治意识。”\n④正确，习近平总书记在讲话中指出：“第一，始终坚持党的领导，不断巩固各民族团结奋斗的共同思想政治基础······要引导各族群众不断增强对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同，牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念。”\n故①②③④表述正确，共4项。\n故正确答案为D。","no":7,"missingImage":false},{"type":"question","qid":"16070227","cat":"新思想","stem":"习近平总书记指出，讲好中国故事，传播好中国声音，展示真实、立体、全面的中国，是加强我国国际传播能力建设的重要任务。关于加强我国国际传播能力建设，下列表述正确的是：\n①要提升国际传播体系稳定性，防范国际传播格局重构\n②要全面提升国际传播效能，建强适应新时代国际传播需要的专门人才队伍\n③要倡导和平的国际舆论环境，不参与国际舆论斗争，塑造谦逊谦和的大国形象\n④推动走出去、请进来管理便利化，扩大国际人文交流合作","options":{"A":"①②","B":"②④","C":"①③","D":"③④"},"answer":"B","explanation":"本题考查新思想。\n①错误，④正确，《中共中央关于进一步全面深化改革、推进中国式现代化的决定》在“十、深化文化体制机制改革”部分中指出：“（41）构建更有效力的国际传播体系。推进国际传播格局重构，深化主流媒体国际传播机制改革创新，加快构建多渠道、立体式对外传播格局。加快构建中国话语和中国叙事体系，全面提升国际传播效能。建设全球文明倡议践行机制。推动走出去、请进来管理便利化，扩大国际人文交流合作。”故“防范国际传播格局重构”表述错误，应为“推进国际传播格局重构”。\n②正确，③错误，2021年5月31日，习近平总书记在中共中央政治局第三十次集体学习时指出：“我们党历来高度重视对外传播工作……积极推动中华文化走出去，有效开展国际舆论引导和舆论斗争，初步构建起多主体、立体式的大外宣格局······要全面提升国际传播效能，建强适应新时代国际传播需要的专门人才队伍······”故“不参与国际舆论斗争”表述错误，应为“有效开展国际舆论引导和舆论斗争”。\n综上，②④表述正确。\n故正确答案为B。","no":8,"missingImage":false},{"type":"question","qid":"16070303","cat":"新思想","stem":"习近平总书记指出，要推动公共文化服务标准化、均等化，坚持政府主导、社会参与、重心下移、共建共享，完善公共文化服务体系，提高基本公共文化服务的覆盖面和适用性。关于完善公共文化服务体系，下列举措正确的有几项？\n①做好文化馆、乡镇（街道）综合文化站、村（社区）综合性文化服务中心等的规划建设\n②推动优质文化资源向沿海发达地区集中，促进公共文化服务差异化发展\n③实施全国智慧图书馆体系建设、公共文化云建设等项目\n④实施广播电视惠民工程，完善农村文化基础设施网络\n⑤推动各民族文化的传承保护和创新交融，提升民族地区公共文化服务水平","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"C","explanation":"本题考查新思想。\n2021年9月9日，国务院新闻办公室发布《国家人权行动计划（2021—2025年）》（以下简称《行动计划》）。\n①正确，《行动计划》在“一、经济、社会和文化权利”部分“（七）文化权利”中指出：“完善公共文化服务基础设施。做好公共图书馆、文化馆、博物馆、美术馆、乡镇（街道）综合文化站、村（社区）综合性文化服务中心等的规划建设。健全各级各类公共文化服务基础设施。”\n②错误、④正确，《行动计划》在“一、经济、社会和文化权利”部分“（七）文化权利”中指出：“补齐公共文化服务短板。落实国家基本公共服务标准要求，加强基层文化建设，增加供给总量，优化供给结构，推动优质文化资源向农村地区、革命老区、民族地区、边疆地区倾斜，缩小城乡和地区之间公共文化服务差距。实施广播电视惠民工程，完善农村文化基础设施网络。”故“推动优质文化资源向沿海发达地区集中，促进公共文化服务差异化发展”说法有误，应为“推动优质文化资源向农村地区、革命老区、民族地区、边疆地区倾斜，缩小城乡和地区之间公共文化服务差距”。\n③正确，《行动计划》在“一、经济、社会和文化权利”部分“（七）文化权利”中指出：“推动公共数字文化建设。统筹推进公共文化数字化重点工程建设。实施全国智慧图书馆体系建设、公共文化云建设等项目。”\n⑤正确，《行动计划》在“四、特定群体权益保障”部分“（一）少数民族权益”中指出：“保障少数民族文化权利。推动各民族文化的传承保护和创新交融，提升民族地区公共文化服务水平。保护和传承少数民族传统文化。做好少数民族古籍保护、抢救、整理、出版和研究工作。开展少数民族古籍数字化建设。办好第六届全国少数民族文艺会演。开展好少数民族语电视剧译制片源捐赠工作。”\n综上，①③④⑤表述正确，共4项。\n故正确答案为C。","no":9,"missingImage":false},{"type":"question","qid":"16069951","cat":"马克思主义","stem":"习近平总书记曾说：“我们要有钉钉子的精神，钉钉子往往不是一锤子就能钉好的，而是要一锤一锤接着敲，直到把钉子钉实钉牢，钉牢一颗再钉下一颗，不断钉下去，必然大有成效。如果东一榔头西一棒子，结果很可能是一颗钉子都钉不上、钉不牢。”这句话最能体现的哲学原理是：\n①量变与质变辩证统一\n②肯定与否定辩证统一\n③主要矛盾与次要矛盾辩证统一\n④尊重客观规律与发挥主观能动性辩证统一","options":{"A":"①②","B":"②③","C":"③④","D":"①④"},"answer":"D","explanation":"本题考查马克思主义。\n①正确，钉钉子要一锤一锤接着敲，直到钉实钉牢，体现了量的积累（每一锤）达到一定程度必然引起质的飞跃（钉牢一颗钉子）；不断钉下去，必然大有成效，体现了量变与质变的辩证统一关系。\n②错误，“肯定与否定辩证统一”指事物内部包含肯定和否定的因素，要通过辩证否定实现发展。题干强调的是持续用力、循序渐进，并未涉及对事物自身的肯定与否定。\n③错误，“主要矛盾与次要矛盾辩证统一”指在复杂事物发展过程中要抓关键、抓重点，统筹兼顾。题干强调的是工作方法上的持续性和连贯性，批评“东一榔头西一棒子”，重在防止分散用力，而非区分主次矛盾。\n④正确，钉钉子要尊重“一锤子钉不好”的客观规律，必须一锤一锤钉，又要发挥主观能动性，一锤一锤接着敲，不断钉下去，只有把二者结合起来，才能取得实效，体现了尊重客观规律与发挥主观能动性的辩证统一关系。\n故①④表述正确。\n故正确答案为D。","no":10,"missingImage":false},{"type":"question","qid":"16069901","cat":"新思想","stem":"城乡融合发展是中国式现代化的必然要求。关于城乡融合发展，下列说法正确的有几项？\n①要把乡村振兴战略这篇大文章做好，必须走城乡融合发展之路\n②在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败\n③要顺应城乡融合发展大趋势，破除妨碍城乡要素平等交换、双向流动的制度壁垒\n④振兴乡村，不能就乡村论乡村，还是要强化以工补农、以城带乡，加快形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查新思想。\n①正确，2018年9月21日，习近平总书记在十九届中央政治局第八次集体学习时讲话指出：“要把乡村振兴战略这篇大文章做好，必须走城乡融合发展之路。我们一开始就没有提城市化，而是提城镇化，目的就是促进城乡融合。要向改革要动力，加快建立健全城乡融合发展体制机制和政策体系。”\n②正确，2018年9月21日，习近平总书记在十九届中央政治局第八次集体学习时讲话指出：“我一直强调，没有农业农村现代化，就没有整个国家现代化。在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败。”\n③正确，2022年12月23日，习近平总书记在中央农村工作会议上讲话指出：“要顺应城乡融合发展大趋势，破除妨碍城乡要素平等交换、双向流动的制度壁垒，促进发展要素、各类服务更多下乡，率先在县域内破除城乡二元结构。”\n④正确，2020年12月28日，习近平总书记在中央农村工作会议上讲话指出：“第六，推动城乡融合发展见实效。振兴乡村，不能就乡村论乡村，还是要强化以工补农、以城带乡，加快形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系。”\n综上，①②③④说法正确，共4项。\n故正确答案为D。","no":11,"missingImage":false},{"type":"question","qid":"16070175","cat":"新思想","stem":"建设质量强国是推动高质量发展，促进我国经济由大向强转变的重要举措，是满足人民美好生活需要的重要途径。关于建设质量强国，下列表述正确的有（    ）。\n①建立健全强制性与自愿性相结合的质量披露制度\n②支持开展质量公益诉讼和集体诉讼，有效执行商品质量惩罚性赔偿制度\n③深化检验检测认证机构资质审批制度改革，全面实施告知承诺和优化审批服务\n④加强工程质量监督队伍建设，全面推行政府购买服务方式委托社会力量辅助工程质量监督检查\n⑤鼓励支持中小微企业实施技术改造、质量改进、品牌建设，提升中小微企业质量技术创新能力","options":{"A":"4项","B":"3项","C":"2项","D":"1项"},"answer":"A","explanation":"本题考查新思想。\n2023年2月，中共中央、国务院印发《质量强国建设纲要》（以下简称《纲要》）。\n①正确，《纲要》在“十、推进质量治理现代化”部分指出：“（二十六）健全质量政策制度······建立质量分级标准规则，实施产品和服务质量分级，引导优质优价，促进精准监管。建立健全强制性与自愿性相结合的质量披露制度，鼓励企业实施质量承诺和标准自我声明公开。”\n②正确，《纲要》在“十、推进质量治理现代化”部分指出：“（二十五）加强质量法治建设······支持开展质量公益诉讼和集体诉讼，有效执行商品质量惩罚性赔偿制度。健全产品和服务质量担保与争议处理机制，推行第三方质量争议仲裁。加强质量法治宣传教育，普及质量法律知识。”\n③正确，《纲要》在“九、构建高水平质量基础设施”部分指出：“（二十二）优化质量基础设施管理······深化检验检测机构市场化改革，加强公益性机构功能性定位、专业化建设，推进经营性机构集约化运营、产业化发展。深化检验检测认证机构资质审批制度改革，全面实施告知承诺和优化审批服务，优化规范检验检测机构资质认定程序。”\n④错误，《纲要》在“六、提升建设工程品质”部分指出：“（十三）强化工程质量保障······强化工程建设全链条质量监管，完善日常检查和抽查抽测相结合的质量监督检查制度，加强工程质量监督队伍建设，探索推行政府购买服务方式委托社会力量辅助工程质量监督检查。”故“全面推行”表述有误，应为“探索推行”。\n⑤正确，《纲要》在“八、增强企业质量和品牌发展能力”部分指出：“（十九）加快质量技术创新应用······支持企业牵头组建质量技术创新联合体，实施重大质量改进项目，协同开展产业链供应链质量共性技术攻关。鼓励支持中小微企业实施技术改造、质量改进、品牌建设，提升中小微企业质量技术创新能力。”\n故①②③⑤表述正确，共4项。\n故正确答案为A。","no":12,"missingImage":false},{"type":"question","qid":"16069955","cat":"新思想","stem":"加强数字政府建设是创新政府治理理念和方式、形成数字治理新格局、推进国家治理体系和治理能力现代化的重要举措。下列关于数字政府建设的基本原则，表述正确的有几项?\n①坚持党的全面领导，充分发挥党总揽全局、协调各方的领导核心作用\n②坚持以市场为中心，始终把满足人民群众物质生活的迫切需求作为目标\n③坚持整体协同，强化系统观念，加强系统集成，全面提升数字政府集约化建设水平\n④坚持数据赋能，建立健全数据治理制度和标准体系，加强数据汇聚融合、共享开放和开发利用","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"C","explanation":"本题考查新思想。\n2022年6月23日，国务院发布了《关于加强数字政府建设的指导意见》，以下简称《意见》。\n①正确，《意见》“一、发展现状和总体要求”中“2.基本原则”部分指出：“坚持党的全面领导。充分发挥党总揽全局、协调各方的领导核心作用，全面贯彻党中央、国务院重大决策部署，将坚持和加强党的全面领导贯穿数字政府建设各领域各环节，贯穿政府数字化改革和制度创新全过程，确保数字政府建设正确方向。”\n②错误，《意见》“一、发展现状和总体要求”中“2.基本原则”部分指出：“坚持以人民为中心。始终把满足人民对美好生活的向往作为数字政府建设的出发点和落脚点······”故“以市场为中心，始终把满足人民群众物质生活的迫切需求作为目标”说法错误，应为“以人民为中心，始终把满足人民对美好生活的向往作为数字政府建设的出发点和落脚点”\n③正确，《意见》“一、发展现状和总体要求”中“2.基本原则”部分指出：“坚持整体协同。强化系统观念，加强系统集成，全面提升数字政府集约化建设水平，统筹推进技术融合、业务融合、数据融合，提升跨层级、跨地域、跨系统、跨部门、跨业务的协同管理和服务水平······”\n④正确，《意见》“一、发展现状和总体要求”中“2.基本原则”部分指出：“坚持数据赋能。建立健全数据治理制度和标准体系，加强数据汇聚融合、共享开放和开发利用，促进数据依法有序流动，充分发挥数据的基础资源作用和创新引擎作用，提高政府决策科学化水平和管理服务效率，催生经济社会发展新动能。”\n故①③④正确，共3项。\n故正确答案为C。","no":13,"missingImage":false},{"type":"question","qid":"16070302","cat":"新思想","stem":"建设教育强国，基点在基础教育。基础教育搞得越扎实，教育强国步伐就越稳、后劲就越足。关于加强基础教育，下列举措正确的有几项？\n①提升寄宿制学校办学条件和管理水平，办好必要的乡村小规模学校\n②统筹推进市域内高中阶段学校多样化发展，加快扩大普通高中教育资源供给\n③强化家庭教育主阵地作用，健全学校家庭社会协同育人机制\n④建立基础教育各学段学龄人口变化监测预警制度，优化中小学和幼儿园布局\n⑤深入开展县域义务教育优质均衡督导评估，有序推进市域义务教育优质均衡发展","options":{"A":"4项","B":"3项","C":"2项","D":"1项"},"answer":"A","explanation":"本题考查新思想。\n2025年1月，中共中央 国务院印发《教育强国建设规划纲要（2024—2035年）》（以下简称《纲要》）。\n①⑤正确，《纲要》在“三、办强办优基础教育，夯实全面提升国民素质战略基点”部分指出：“（八）推动义务教育优质均衡发展和城乡一体化······提升寄宿制学校办学条件和管理水平，办好必要的乡村小规模学校······深入开展县域义务教育优质均衡督导评估，有序推进市域义务教育优质均衡发展。”\n②正确，《纲要》在“三、办强办优基础教育，夯实全面提升国民素质战略基点”部分指出：“（九）促进学前教育普及普惠和高中阶段学校多样化发展······统筹推进市域内高中阶段学校多样化发展，加快扩大普通高中教育资源供给。”\n③错误，《纲要》在“三、办强办优基础教育，夯实全面提升国民素质战略基点”部分指出：“（十）统筹推进‘双减’和教育教学质量提升······强化学校教育主阵地作用，全面提升课堂教学水平，加强对学习困难学生的辅导······”故“强化家庭教育主阵地作用”说法错误，应为“强化学校教育主阵地作用”。\n④正确，《纲要》在“三、办强办优基础教育，夯实全面提升国民素质战略基点”部分指出：“（七）健全与人口变化相适应的基础教育资源统筹调配机制······建立基础教育各学段学龄人口变化监测预警制度，优化中小学和幼儿园布局。”\n故①②④⑤说法正确，共4项。\n故正确答案为A。","no":14,"missingImage":false},{"type":"question","qid":"16070164","cat":"马克思主义","stem":"唯物辩证法认为，事物是普遍联系的，事物及事物各要素相互影响、相互制约，整个世界是相互联系的整体，也是相互作用的系统。下列有关说法正确的是：\n①系统的功能等于各个部分功能的简单相加\n②系统思维就是在确认事物普遍联系的基础上，具体揭示对象的系统存在、系统关系及其规律的观点和方法\n③系统是一个静态和复杂的整体，由不同要素无序构成\n④对于外来作用，系统能作为一个统一体作出反应，而不管这种外来作用直接作用于系统的哪一个部分\n⑤系统的相关性特征集中体现为事物之间、事物内部诸要素之间的相互作用","options":{"A":"①②③④⑤","B":"①②③⑤","C":"②③④⑤","D":"②④⑤"},"answer":"D","explanation":"本题考查马克思主义。\n①错误，唯物辩证法认为，系统具有整体性特征，整体功能不是部分功能的机械相加。当部分以合理、有序、优化的结构形成整体时，整体功能大于部分功能之和；若结构不合理，则整体功能小于部分功能之和。因此，系统功能并非各个部分功能的简单相加。\n②正确，唯物辩证法认为，世界是普遍联系的，任何事物都处在相互影响、相互制约、相互作用的关系之中。系统思维就是在确认事物普遍联系的基础上，把认识对象当作一个相互联系、相互作用的有机系统，进而具体揭示其系统存在、系统结构、系统关系及其运动发展规律的观点和方法。\n③错误，系统是一个动态的、有序的整体，而非静态无序的构成。系统的本质特征是动态性与有序性：系统始终处于运动、变化、发展之中，并非静态；系统内部各要素按照一定的秩序、结构、层次有机组合，而非无序堆砌。\n④正确，对于外来作用，系统能作为一个统一体作出反应，这体现了系统的整体性特征。由于系统内部各要素相互关联、相互制约，当外部作用直接作用于系统的某一局部时，这种影响会通过内在的联系传导至整个系统，从而使系统能够作为一个有机整体对外部刺激做出统一反应。\n⑤正确，系统的相关性特征集中体现为事物之间、事物内部诸要素之间的相互作用。相关性是系统存在的基础，它强调世界上的万事万物都不是孤立存在的，而是通过相互影响、相互制约、相互促进的相互作用联系在一起，这种相互作用构成了系统运动和发展的根本原因。\n综上，②④⑤表述正确。\n故正确答案为D。","no":15,"missingImage":false}],"count":15,"answerable":15,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"16069975","cat":"法律常识","stem":"《民营经济促进法》规定平等对待民营经济组织，保障公平竞争。下列做法符合该规定的是：","options":{"A":"某市规范性文件规定，限制信用等级B级以下的民营企业参加政府采购交易活动","B":"某市严格把控数据安全，限缩民营企业使用公共交通数据的授权范围","C":"某银行风控规范要求，民营企业信贷审批需要公司法人提供连带保证","D":"某银行合理设置小型民营企业不良贷款容忍度、健全尽职免责机制"},"answer":"D","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国民营经济促进法》第十四条第一款规定：“公共资源交易活动应当公开透明、公平公正，依法平等对待包括民营经济组织在内的各类经济组织。”本项中，以信用等级为由限制民营企业参与政府采购，属于排斥民营经济组织参与公共资源交易，违反平等对待、公平竞争原则，因此，某市限制信用等级B级以下的民营企业参加政府采购交易活动，不符合《中华人民共和国民营经济促进法》规定。\nB项错误，根据《中华人民共和国民营经济促进法》第十二条规定：“国家保障民营经济组织依法平等使用资金、技术、人力资源、数据、土地及其他自然资源等各类生产要素和公共服务资源，依法平等适用国家支持发展的政策。”第十三条规定：“各级人民政府及其有关部门依照法定权限，在制定、实施政府资金安排、土地供应、排污指标、公共数据开放、资质许可、标准制定、项目申报、职称评定、评优评先、人力资源等方面的政策措施时，平等对待民营经济组织。”因此，限缩民营企业使用公共数据的授权范围，剥夺其平等使用数据要素的权利，不符合《中华人民共和国民营经济促进法》规定。\nC项错误，根据《中华人民共和国民营经济促进法》第二十四条规定：“金融机构在授信、信贷管理、风控管理、服务收费等方面应当平等对待民营经济组织。金融机构违反与民营经济组织借款人的约定，单方面增加发放贷款条件、中止发放贷款或者提前收回贷款的，依法承担违约责任。”因此，对民营企业单独设置“法人连带保证”的额外担保要求，违反金融机构平等对待民营经济组织的原则，不符合《中华人民共和国民营经济促进法》规定。\nD项正确，根据《中华人民共和国民营经济促进法》第二十条规定：“国务院有关部门依据职责发挥货币政策工具和宏观信贷政策的激励约束作用，按照市场化、法治化原则，对金融机构向小型微型民营经济组织提供金融服务实施差异化政策，督促引导金融机构合理设置不良贷款容忍度、建立健全尽职免责机制、提升专业服务能力，提高为民营经济组织提供金融服务的水平。”因此，某银行合理设置小型民营企业不良贷款容忍度、健全尽职免责机制，符合《中华人民共和国民营经济促进法》规定。\n故正确答案为D。","no":16,"missingImage":false},{"type":"question","qid":"16069939","cat":"人文常识","stem":"关于我国考古发现，下列说法错误的是:","options":{"A":"良渚文化主要分布于太湖地区，其文化遗址最大特色是所出土的玉器","B":"仰韶文化主要分布在黄河支流汇集的中原地区，其中较著名的是元谋人遗址","C":"大汶口文化主要分布在泰山周围地区，氏族墓地中晚期出现了男女合葬现象","D":"龙山文化是新石器时代晚期的文化，其陶器已开始使用轮制技术，器型规整"},"answer":"B","explanation":"A项正确，良渚文化是我国长江下游太湖流域新石器时代晚期的重要文化，距今约5300—4300年。该文化以大型古城址、祭坛、水利系统和大量制作精美的玉琮、玉璧、玉钺等礼器为突出特征，玉器工艺发达，象征着较高的社会等级与早期国家形态。\nB项错误，仰韶文化是黄河中游地区新石器时代的代表性文化，以彩陶为典型标志，著名遗址有陕西西安半坡遗址、河南陕县庙底沟遗址等。元谋人遗址位于云南元谋县，属于旧石器时代早期古人类遗址，与仰韶文化在时代、地域、文化属性上均不相符。\nC项正确，大汶口文化主要分布在以泰山为中心的黄河下游地区，距今约6500—4500 年。其墓葬材料丰富，早期以单人葬为主，中晚期出现男女合葬、夫妻合葬，同时墓葬规模与随葬品差异明显，反映出私有制出现、贫富分化与社会阶层逐步形成。\nD项正确，龙山文化是新石器时代晚期文化，主要分布于黄河中下游地区，距今约4500—4000 年。该文化普遍掌握快轮制陶技术，陶器以黑陶为代表，胎质细腻、器壁轻薄、造型规整，标志着我国史前制陶工艺达到较高水平。\n本题为选非题，故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"16070158","cat":"人文常识","stem":"关于社会保险，下列说法正确的是：","options":{"A":"灵活就业人员可以参加职工基本医疗保险","B":"失业者领取失业保险金的期限与累计缴费年限无关","C":"同一统筹地区内用人单位工伤保险执行统一缴费费率","D":"生育保险待遇中的生育津贴按职工本人上年度的月平均工资计发"},"answer":"A","explanation":"本题考查经济常识。\nA项正确，根据《中华人民共和国社会保险法》第二十三条第二款规定：“无雇工的个体工商户、未在用人单位参加职工基本医疗保险的非全日制从业人员以及其他灵活就业人员可以参加职工基本医疗保险，由个人按照国家规定缴纳基本医疗保险费。”\nB项错误，根据《中华人民共和国社会保险法》第四十六条规定：“失业人员失业前用人单位和本人累计缴费满一年不足五年的，领取失业保险金的期限最长为十二个月；累计缴费满五年不足十年的，领取失业保险金的期限最长为十八个月；累计缴费十年以上的，领取失业保险金的期限最长为二十四个月。重新就业后，再次失业的，缴费时间重新计算，领取失业保险金的期限与前次失业应当领取而尚未领取的失业保险金的期限合并计算，最长不超过二十四个月。”因此，失业者领取失业保险金的期限与累计缴费年限有关。\nC项错误，根据《工伤保险条例》第八条规定：“工伤保险费根据以支定收、收支平衡的原则，确定费率。国家根据不同行业的工伤风险程度确定行业的差别费率，并根据工伤保险费使用、工伤发生率等情况在每个行业内确定若干费率档次。行业差别费率及行业内费率档次由国务院社会保险行政部门制定，报国务院批准后公布施行。统筹地区经办机构根据用人单位工伤保险费使用、工伤发生率等情况，适用所属行业内相应的费率档次确定单位缴费费率。”因此，同一统筹地区内的工伤保险会根据不同行业确定差别费率，而不是执行统一缴费费率。\nD项错误，根据《中华人民共和国社会保险法》第五十六条规定：“职工有下列情形之一的，可以按照国家规定享受生育津贴：（一）女职工生育享受产假；（二）享受计划生育手术休假；（三）法律、法规规定的其他情形。生育津贴按照职工所在用人单位上年度职工月平均工资计发。”因此，生育津贴按照职工所在用人单位上年度职工月平均工资计发，而不是‌按职工本人月均工资计发。\n故正确答案为A。","no":18,"missingImage":false},{"type":"question","qid":"16070161","cat":"经济常识","stem":"关于金融知识，下列说法错误的是：","options":{"A":"外汇结构性理财产品可以挂钩大宗商品、对冲基金、黄金石油等标的","B":"股票净值，又称股票的票面价值，是指每股股票所包含的实际资产的价值","C":"开放式基金是指基金份额总额不固定，基金份额可以在基金合同约定的时间和场所申购或赎回的基金","D":"债券的票面利率取决于债券发行时的市场利率、债券期限、发行者信用水平、债券的流动性水平等因素"},"answer":"B","explanation":"本题考查经济常识。\nA项正确，外汇结构性理财产品是一种将固定收益类资产与金融衍生品结合的理财产品。它们通常会设定一个最低保本额，保本额上的浮动收益取决于产品挂钩标的的表现。这些挂钩标的可以非常广泛，包括大宗商品、境外上市的股票价格或指数、对冲基金和黄金石油等。\nB项错误，股票净值亦称“股票的账面价值”，指每个普通股能够分配到的公司会计账面上的净价值，是股票所含实际资产的价值。它等于公司净值减去流通在外的公司优先股总面额后的余额再除以流通在外的普通股数。“股票的票面价值”是一个固定的数值，主要用于表明股票所代表的资本数额和在公司总股本中的比例，但它并不直接反映股票的实际资产的价值。\nC项正确，按基金运作方式不同，基金可分为封闭式基金和开放式基金。其中开放式基金是指基金份额总额不固定，基金份额可以在基金合同约定的时间和场所申购或者赎回的基金。\nD项正确，债券的票面利率取决于债券发行时的市场利率、债券期限、发行者信用水平、债券的流动性水平等因素。发行时市场利率越高，票面利率就越高；债券期限越长，票面利率就越高；发行者信用水平越高，票面利率就越低；债券的流动性越高，票面利率就越低。\n本题为选非题，故正确答案为B。","no":19,"missingImage":false},{"type":"question","qid":"16070153","cat":"地理国情","stem":"我国幅员辽阔，各地风土人情迥异，天南地北皆有壮美景色。下列有关说法错误的是（    ）。","options":{"A":"新疆天山天池和长白山天池同属火山湖","B":"海南是个多民族聚居的省份，其少数民族中黎族人口最多","C":"福建武夷山、四川青城山、江西龙虎山都属于典型的丹霞地貌","D":"山东泰山地形高峻，河流短小流急，多瀑布，形成潭瀑交替的景观"},"answer":"A","explanation":"本题考查地理国情。\nA项错误，长白山天池是火山多次喷发后，火山口塌陷积水形成的典型火山口湖，属于火山湖的范畴；而新疆天山天池是冰川刨蚀、冰碛物堵塞形成的冰碛堰塞湖，不属于火山湖的范畴。\nB项正确，海南省是我国多民族聚居的热带岛屿省份，有30余个民族成分，世居民族包含黎族、苗族、回族等。根据第七次全国人口普查数据，其中黎族人口超149万，占全省少数民族总人口84%以上，是海南人口最多的少数民族，也是海南独有的世居少数民族。\nC项正确，丹霞地貌以陆相红色砂砾岩为成景基底，经流水侵蚀、风化剥落等作用形成赤壁丹崖的核心景观。福建武夷山、江西龙虎山、四川青城山均为我国丹霞地貌典型代表；其中武夷山是世界文化与自然双重遗产，江西龙虎山是“中国丹霞”世界自然遗产的核心组成部分。\nD项正确，泰山为断块隆升山地，主峰玉皇顶与周边平原相对高差超1300米，整体地形高峻、地势起伏剧烈。受地形限制，区域内河流短小流急，流水侵蚀作用形成大量瀑布与冲蚀深潭，最终造就了潭瀑交替的特色水文景观。\n本题为选非题，故正确答案为A。","no":20,"missingImage":false},{"type":"question","qid":"16070172","cat":"人文常识","stem":"《黄帝内经》中“是故圣人不治已病治未病”的思想是中医养生的重要理念，倡导通过饮食、运动、情志调节等方式增强体质，未病先防。下列古诗词中描述的行为不符合“治未病”理念的是（    ）。","options":{"A":"天寒常早睡，不待日光敛","B":"修性以保神，安心以全身","C":"抽刀断水水更流，举杯消愁愁更愁","D":"食惟半饱无兼味，酒至三分莫过频"},"answer":"C","explanation":"本题考查文化常识。\n“治未病”意为未病先防、养生、顺自然。\nA项正确，诗句出自宋代释文珦的五言古诗《早睡》。意思为天气冷了就早早睡觉，不等太阳完全落山就休息。选项内容顺应天时、规律作息，符合“治未病”的养生理念。\nB项正确，诗句出自三国魏嵇康的经典养生名篇《养生论》。意思为修养性情、调摄心性，以此保养精神、守护心神；安定内心、平和情志，以此保全身体、养护生命。选项内容符合“治未病”的养生理念。\nC项错误，诗句出自唐代李白的《宣州谢朓楼饯别校书叔云》。意思为拔刀断水水却更加汹涌奔流，举杯消愁愁情上却更加浓烈。过量饮酒伤神伤身，不符合“治未病”理念。\nD项正确，诗句出自明代龚廷贤的养生名篇《摄养诗》。意思为吃饭只吃半饱（七八分饱），不追求多种油腻、浓烈的味道，饮食清淡简单。喝酒只喝到三分微醺即可，不要频繁饮酒。饮食有节、不过量饮酒，符合“治未病”的养生理念。\n本题为选非题，故正确答案为C。","no":21,"missingImage":false},{"type":"question","qid":"16069915","cat":"科技常识","stem":"下列异常的体检指标，与其关联的疾病最不可能对应的是（    ）。","options":{"A":"白细胞数量高于参考范围的上限——阑尾炎","B":"谷丙转氨酶高于参考范围的上限——冠心病","C":"红细胞数量低于参考范围的下限——贫血症","D":"甲胎蛋白浓度高于参考范围的上限——肝癌"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，白细胞是人体免疫系统的核心功能细胞，外周血白细胞总数升高，是急性细菌性感染、化脓性炎症反应的标志性指标。阑尾炎的核心发病机制是阑尾管腔堵塞后继发肠道细菌感染，引发的急性化脓性炎症，属于典型的腹腔细菌感染性疾病。急性阑尾炎发作时，机体免疫系统快速激活，大量白细胞增殖并趋化至炎症病灶，直接导致外周血白细胞总数显著高于参考上限。\nB项错误，谷丙转氨酶90%以上储存于人体肝细胞的胞质中，心肌、骨骼肌等其他组织中含量极低。只有当肝细胞受损、细胞膜完整性被破坏时，大量谷丙转氨酶才会释放进入血液，导致外周血检测值显著升高。故谷丙转氨酶是临床诊断肝细胞损伤、肝脏疾病的特异性、敏感性核心指标，冠心病本身不会导致谷丙转氨酶升高。冠心病全称冠状动脉粥样硬化性心脏病，是冠状动脉粥样硬化导致血管狭窄、心肌缺血缺氧引发的心脏疾病，其特异性生物标志物是肌钙蛋白等。\nC项正确，贫血症指外周血中单位容积内的红细胞计数、血红蛋白浓度、红细胞比容低于同年龄、同性别、同地区健康人群的参考范围下限的一种病理状态。其中，红细胞数量减少是贫血最核心的病理表现之一。\nD项正确，甲胎蛋白是原发性肝细胞癌的特异性肿瘤标志物。生理状态下，甲胎蛋白主要由胎儿肝细胞合成，出生后合成能力迅速下降，健康成人外周血中甲胎蛋白浓度极低。当肝细胞发生癌变时，癌变的肝细胞可能重新获得合成甲胎蛋白的能力，导致外周血甲胎蛋白浓度显著升高。\n本题为选非题，故正确答案为B。","no":22,"missingImage":false},{"type":"question","qid":"16069971","cat":"人文常识","stem":"咖啡因是一种中枢神经兴奋剂，能够暂时驱走睡意并恢复精力，咖啡、茶和能量饮料中都含有咖啡因成分。下列有关说法正确的是（    ）。","options":{"A":"过量饮用能量饮料可能引发心脏不适","B":"茶叶颜色的深浅能反映咖啡因的含量多少","C":"未经发酵的绿茶，咖啡因含量比完全发酵的红茶高","D":"相比常压下煮出的咖啡，蒸汽加压煮的咖啡所含咖啡因含量更低"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，能量饮料通常含有高浓度咖啡因及其他兴奋成分（如牛磺酸、瓜拉纳等），过量摄入咖啡因会导致中枢神经与心血管系统兴奋，可能引发心脏不适，导致心率加快、血压升高、心悸、心律异常等。\nB项错误，茶叶颜色的深浅与咖啡因含量无直接关联。茶叶颜色由发酵程度和氧化程度决定（如绿茶未发酵，颜色浅；红茶全发酵，颜色深），而咖啡因含量主要取决于茶树品种、采摘部位、冲泡方式等。\n‌C项错误，未经发酵的绿茶与完全发酵的红茶之间的咖啡因含量高低无固定规律，同原料前提下，绿茶与红茶咖啡因总量相近。因为咖啡因实际含量更多取决于茶树品种、嫩度、冲泡条件，与是否发酵无必然高低关系。\nD项错误，咖啡因溶出率与压力、温度、时间呈正相关，相比常压下煮出的咖啡，蒸汽加压（如意式浓缩咖啡的制作方法）属于高温高压短时间萃取，单位体积咖啡液中所含咖啡因含量更高，而非“更低”。\n故正确答案为A。","no":23,"missingImage":false},{"type":"question","qid":"16070166","cat":"人文常识","stem":"若将一个弹簧拉力器的一端固定在天花板上，握住另一端用力缓慢竖直下拉，假设弹簧具有一定的质量且均匀分布，则弹簧拉力器最可能断裂的位置是（    ）。","options":{"A":"弹簧拉力器的上部","B":"弹簧拉力器的中部","C":"弹簧拉力器的下部","D":"上、下部同时断裂"},"answer":"A","explanation":"本题考查科技常识。\nA项正确，弹簧自身有均匀分布的质量，缓慢下拉过程中，弹簧上部不仅要承受人手施加的拉力，还要承担下方整段弹簧的全部重力，越靠近上端，弹簧所承受的总张力越大，应力也最大，因此最容易在此处发生断裂。\nB项错误，中部弹簧仅需承受人手拉力与下方一半弹簧的重力，所受张力明显小于上端，应力水平不足以使其先于上部断裂。\nC现错误，下部弹簧只需要承受人手施加的拉力，无需承担额外的弹簧自重，所受张力最小，是整根弹簧中应力最低的位置，几乎不会最先断裂。\nD项错误，由于弹簧上下位置的受力存在显著差异，上部受力远大于下部，应力分布极不均匀，不可能出现上下同时达到断裂极限的情况。\n故正确答案为A。","no":24,"missingImage":false},{"type":"question","qid":"16069917","cat":"科技常识","stem":"下列选项体现的物理原理与其他选项不同的是（    ）。","options":{"A":"三角形的泡泡棒吹出的泡泡总是趋于球状","B":"植物根部的毛细管从土壤中吸收水分","C":"眼镜镜片的表面镀膜可以防蓝光","D":"雨后荷叶上的水珠呈球形"},"answer":"C","explanation":"本题考查科技常识。\nA、D两项正确，三角形的泡泡棒吹出的泡泡最终呈球形，雨后荷叶上的水珠呈球形，都是因为液体表面张力的作用，表面张力会使液体表面尽可能收缩到最小表面积（相同体积下球形表面积最小），因此体现的是表面张力原理。\nB项正确，毛细作用是液体表面对固体表面的吸引力。当毛细管插入浸润液体中，管内液面上升，高于管外液面；毛细管插入不浸润液体中，管内液体下降，低于管外液面。植物根部毛细管从土壤中吸水，利用的是毛细现象，而毛细现象本质上是液体表面张力与附着层分子相互作用力共同作用的结果，核心原理是表面张力。\nC项错误，眼镜镜片的表面镀膜防蓝光，利用的是光的干涉原理。镜片表面镀多层纳米级光学薄膜，蓝光入射时，在膜层上表面与下表面分别反射，两束反射光相位相反、发生相消干涉，大幅降低蓝光透过率。与表面张力无关。\n本题为选非题，故正确答案为C。","no":25,"missingImage":false}],"count":10,"answerable":10,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"16070155","cat":"逻辑填空","stem":"当前人类已全面进入知识经济时代，高质量发展越来越依靠知识和创新。教育强国、科技强国、人才强国具有共生性，            。科技强国要求高科技自立自强，成为世界主要科学中心；人才强国要求提高自主培养质量，成为世界重要人才中心。科技和人才离不开高质量教育体系，因此“三大强国”的统筹部署有利于支撑“两个中心”建设。\n填入画横线部分最恰当的一项是：","options":{"A":"异曲同工","B":"同气连枝","C":"同日而语","D":"同声相应"},"answer":"B","explanation":"根据“教育强国、科技强国、人才强国具有共生性”“科技强国要求高科技自立自强，成为世界主要科学中心；人才强国要求提高自主培养质量，成为世界重要人才中心。科技和人才离不开高质量教育体系”可知，横线处应体现三者互相离不开、联系紧密之意。B项“同气连枝” 比喻同胞的兄弟姐妹，现引申为彼此的关系很密切，互相依存，符合文意，当选。A项“异曲同工”指不同的做法收到同样效果，并未体现三者关系紧密之意，排除；C项“同日而语”指放在同一时间谈论，多用于否定句式，文段并未讨论时间关系，排除；D项“同声相应”指志趣、意见相同的人互相响应，自然地结合在一起，与文意不符，排除。\n故正确答案为B。\n【文段出处】华中师范大学国家教育治理研究院《教育科技人才三位一体 共同支撑高质量发展》","no":26,"missingImage":false},{"type":"question","qid":"16069880","cat":"逻辑填空","stem":"《永乐大典》成书于明永乐六年，是中国古代最大的类书，《不列颠百科全书》称其为“世界有史以来最大的百科全书”，共计22937卷，11095册，约3.7亿字，收先秦至明初的各类典籍七八千种，被称为典籍        、佚书宝库。","options":{"A":"本源","B":"渊薮","C":"桂冠","D":"文荟"},"answer":"B","explanation":"顿号提示横线处与“佚书宝库”构成并列，且根据“世界有史以来最大的百科全书”“收先秦至明初的各类典籍七八千种”可知，横线处应体现《永乐大典》汇聚了各类典籍之意，B项“渊薮”指人或事物聚集的地方，置于此处表达典籍汇集之意，为常见表达，符合文意，当选。\nA项“本源”指事物产生的根源，横线处强调的是典籍的汇聚，而非根源，排除；\nC项“桂冠”指竞赛中的冠军，与文意无关，排除；\nD项“文荟”指文化、文艺精华汇聚之所或文化荟萃的状态‌，常被用作机构、场所或活动的名称，“文”与“典籍”重复，排除。\n故正确答案为B。\n【文段出处】长江日报《&lt;永乐大典&gt;是怎样上“热搜”的》","no":27,"missingImage":false},{"type":"question","qid":"16069895","cat":"逻辑填空","stem":"未来，数字科技将会持续深度赋能文化产业，数字文化产业新模式、新业态更加丰富，文化产业的产业链、生态链、价值链更为        。我们应着重培养市场主体，探索建构文化全产业链，        文化供给与文化需求的错位，引导文化企业坚持社会效益与经济效益的高度统一，不断提升文化产品和服务的供给质量。\n依次填入画横线部分最恰当的一项是：","options":{"A":"完备 消解","B":"完善 拉开","C":"完好 弥补","D":"完美 避开"},"answer":"A","explanation":"本题可从第二空入手，横线处词语搭配“错位”，根据 “应着重培养市场主体，探索建构文化全产业链”“引导文化企业坚持社会效益与经济效益的高度统一”可知，横线处应表达要解决、消除文化供给与需求不匹配、不协调的问题。A项“消解”意为消释、消除，与“错位”搭配恰当，符合文意，保留。B项“拉开”指摆开，放开，增加差距，置于此处表达让错位变得更大，与文意相悖，排除；C项“弥补”指补偿、填补，常搭配“短板”“不足”等，与“错位”搭配不当，排除；D项“避开”指躲开、回避，侧重主动绕开问题，不主动解决，文段强调要主动消除错位，与“错位”搭配不当且与文意不符，排除。\n第一空，代入验证。搭配“产业链、生态链、价值链”，且根据“数字科技将会持续深度赋能文化产业，数字文化产业新模式、新业态更加丰富”可知，横线处应表达相关产业链条变得齐全，完整，A项“完备”指应该有的全都有了，符合文意，当选。\n故正确答案为A。\n【文段出处】云南师范大学学报（哲学社会科学版）《“十四五”我国文化产业高质量发展的战略定位与路径选择》","no":28,"missingImage":false},{"type":"question","qid":"16069950","cat":"逻辑填空","stem":"马的移动能力强且速度快，有了马的        ，人类的畜牧规模必然会有所        ，聚落的大小、位置以及聚落之间的距离也会随之出现一定程度的变化。\n依次填入画横线部分最恰当的一项是：","options":{"A":"参与 改变","B":"帮助 精简","C":"协助 扩大","D":"介入 增加"},"answer":"C","explanation":"第一空，根据“有了马的······人类的畜牧规模”可知，横线处应体现马在人类畜牧活动中所起到的作用。A项“参与”指参加，B项“帮助”指替人出力、出主意或给予物质上、精神上的支援，C项“协助”指从旁提供帮助或辅助，均与文意相符，保留。D项“介入”指插入其中进行干预，强调主动干预，与文中“马”这一主体特性不符，排除。\n第二空，搭配“规模”，且根据“马的移动能力强且速度快”可知，横线处应体现马对人类畜牧规模变化起到积极作用。C项“扩大”指使（范围、规模等）比原来大，与“规模”搭配恰当，且与文意相符，当选。A项“改变”指事物发生显著的差别，置于横线处仅能体现规模发生变化，无法体现是积极的变化还是消极的变化，与C项相较，“扩大”更契合文意，排除；B项“精简”指去掉不必要的，留下必要的，与文意相悖，排除。\n故正确答案为C。\n【文段出处】中国社会科学网《骑马术在欧亚草原的流行与在中国的兴起》","no":29,"missingImage":false},{"type":"question","qid":"16069929","cat":"逻辑填空","stem":"高山草甸四周海拔较高的陡峭山地往往是不同生态系统的交界处，生存环境和食物资源更为多样，这使得赤狐可以大展拳脚，        在不同景观的边缘，将捕食效率最大化，同时也将风险降至最低，可谓            。即使在内蒙古达赉湖、宁夏贺兰山等地，赤狐的洞穴也经常出现。\n依次填入画横线部分最恰当的一项是：","options":{"A":"逡巡 从容不迫","B":"盘桓 张弛有度","C":"游走 进退自如","D":"驻留 攻守兼备"},"answer":"C","explanation":"第一空，根据“······在不同景观的边缘，将捕食效率最大化，同时也将风险降至最低”可知，横线处所填词语需体现赤狐能够主动、灵活地穿梭在不同景观边缘的意思，C项“游走”指四处走动、来回移动，置于此处能够体现赤狐的动态性和灵活性，符合文意，保留。A项“逡巡”指有所顾虑而徘徊不前，文段并未体现赤狐有所顾虑，排除；B项“盘桓”指逗留、徘徊，D项“驻留”指在某处暂时停留，两项均强调“停留不走”的状态，与文意不符，排除。\n第二空，代入验证。C项“进退自如”指无论是前进还是后退都能得心应手，可对应前文“捕食效率最大化”（进）和“风险降至最低”（退），与文意相符，当选。\n故正确答案为C。","no":30,"missingImage":false},{"type":"question","qid":"16069936","cat":"逻辑填空","stem":"约有20%的人出生时至少携带一个名为APOE4的基因变异拷贝。该变异使人年老时更易患心脏病，但这种变异却没有被淘汰。研究发现，APOE4基因可能具有抵消其他负面影响的        好处，如携带APOE4的儿童可以更好地清除肠道寄生虫，而携带这种基因的女性会生育更多的孩子。这种生育优势可能使该致病基因在人类进化过程中得以        。\n依次填入画横线部分最恰当的一项是：","options":{"A":"潜在 延续","B":"特殊 发展","C":"显性 保存","D":"隐性 入选"},"answer":"A","explanation":"第一空，根据“携带APOE4的儿童可以更好地清除肠道寄生虫”可知，横线处应体现APOE4基因有一些不为人知的好处，这些好处不是马上就能显现出来之意。A项“潜在”指存在于事物内部尚未显露出来的，D项“隐性”指性质或性状不表现在外的，均符合文意，保留。B项“特殊”强调特别、与众不同，与文意不符，排除；C项“显性”指明显表现出来，与文意相悖，排除。\n第二空，根据“携带这种基因的女性会生育更多的孩子。这种生育优势可能使该致病基因在人类进化过程中”可知，横线处应体现因为这种生育优势，致病基因得以留存下来之意。A项“延续”指照原来样子继续下去，符合文意，当选。D项“入选”指中选、当选，与文意不符，排除。\n故正确答案为A。\n【文段出处】《常见阿尔茨海默病基因可能让人类祖先有更多孩子》","no":31,"missingImage":false},{"type":"question","qid":"16069937","cat":"逻辑填空","stem":"一种能监测心脏术后并发症的新设备可以完成比传统的起搏器更复杂的监测。起搏器只能提供心脏的整体图像，但新设备可以提供更        的图像，具体显示出心脏哪些区域功能不正常。其上分布的微电极阵列可从心房的多个位置绘制电信号活动，并按需传递电刺激，以便在        的时候解除房颤，恢复正常心律。\n依次填入画横线部分最恰当的一项是：","options":{"A":"清晰 需要","B":"细致 关键","C":"直观 适当","D":"完整 凶险"},"answer":"B","explanation":"第一空，根据横线前转折词“但”及后文“具体显示出心脏哪些区域功能不正常”可知，横线处所填词语应与“整体”构成转折关系，表达新设备提供的图像更具体、更精细之意。B项“细致”指精细周密，符合文意，保留。A项“清晰”指清楚，而文段并未对比图像的清晰度，且其反义词应为“模糊”，无法与“整体”构成转折，排除；C项“直观”指直接观察的，与具体、精细无关，排除；D项“完整”指没有损坏或残缺，与“整体”语义相近，无法构成转折关系，排除。\n第二空，代入验证。B项“关键”比喻事物最紧要的部分，对事情起决定作用的因素，置于此处能表达在重要、紧急时刻解除房颤之意，逻辑合理，当选。\n故正确答案为B。\n【文段出处】《可溶解的心脏监测设备》","no":32,"missingImage":false},{"type":"question","qid":"16069881","cat":"逻辑填空","stem":"近年来，随着“中华文明探源研究”“考古中国”等重大项目的深入实施，中国考古学界积极推动多学科交叉融合，不断利用新手段、新工具提升田野考古发掘水平与研究阐释能力，        了历史轴线，        了历史信度，丰富了历史内涵，        了历史场景。\n依次填入画横线部分最恰当的一项是：","options":{"A":"廓张 平添 加强","B":"延伸 增强 活化","C":"接续 提高 恢复","D":"拓长 充实 还原"},"answer":"B","explanation":"第一空，搭配“历史轴线”，且根据“不断利用新手段、新工具提升田野考古发掘水平与研究阐释能力”以及“丰富了历史内涵”可知，横线处所填词语应体现新手段、新工具的使用使历史轴线延长之意。B项“延伸”指延长、伸展，D项“拓长”指扩展并延长，均与“历史轴线”搭配恰当，保留。A项“廓张”指扩散、扩大，与“历史轴线”搭配不当，排除；C项“接续”指接着前面的，继续，文段未体现历史轴线曾处于中断状态之意，与文意不符，排除。\n第二空，搭配“历史信度”，B项“增强”指增进、加强，与“历史信度”搭配恰当，保留。D项“充实”指丰富、充足，常搭配“细节”“内容”“队伍”等，与“历史信度”搭配不当，排除。\n第三空，代入验证，B项“活化”指使物质、细胞、机体恢复或增强活力，与“历史场景”搭配恰当，当选。\n故正确答案为B。\n【文段出处】社科院专刊《深化文化遗产研究阐释工作》","no":33,"missingImage":false},{"type":"question","qid":"17467564","cat":"逻辑填空","stem":"近年来，人们通过电场对磁矩实现精准或概率性质的        ，实现了对人脑中突触或神经元功能的模拟，并初步构建了基于自旋的物理神经网络。这一前沿探索不仅挑战了传统计算与信息处理模式的        ，还        智能科技领域的一场深刻变革。\n依次填入画横线部分最恰当的一项是：","options":{"A":"测定 范式 彰显出","B":"校核 疆域 引发了","C":"调控 边界 预示着","D":"适配 法则 意味着"},"answer":"C","explanation":"第一空，根据“通过电场对磁矩实现精准或概率性质的······”可知，横线处需体现“电场对磁矩”的作用，且根据后文“实现了对人脑中突触或神经元功能的模拟，并初步构建了基于自旋的物理神经网络”可知，横线处应体现通过电场来控制磁矩，从而构建物理神经网络之意。C项“调控”指调节控制，在物理学中，“电场调控磁矩”是专业术语，符合文意，保留。A项“测定”指测量确定，侧重于获取数据，而文中强调的是通过操作来实现功能模拟，与文意不符，排除；B项“校核”指校对、核查，通常用于数据或事实的确认，与文意不符，排除；D项“适配”指通过技术手段实现硬件设计思想向可编程逻辑器件的映射过程，通常指两个事物之间的匹配，与文意不符，排除。\n第二空，代入验证。根据“不仅挑战了传统计算与信息处理模式”“······智能科技领域的一场深刻变革”可知，横线处体现这一前沿探索颠覆了传统的处理模式，C项“边界”指国家之间或地区之间的界线，填入横线体现前沿探索突破了传统模式的应用局限，符合文意，保留。\n第三空，代入验证。根据“还······智能科技领域的一场深刻变革”可知，横线处所填词语应体现这种探索引发或预示深刻变革。“‘预示着’变革”意为根据现状推断未来将有变革，能够体现前沿探索的前瞻性特点，符合文意，C项当选。\n故正确答案为C。\n【文段出处】科学通报《基于自旋的智能器件与物理神经网络进展》","no":34,"missingImage":false},{"type":"question","qid":"16069949","cat":"逻辑填空","stem":"托育服务是由3岁以下婴幼儿的法定监护人之外的人或机构，在特定时间内进行的一种组织化、系统化的照顾服务活动。在现代社会中，妇女外出就业造成的亲职抚育困境愈发        。家庭结构的小型化也造成婴幼儿照顾的代际支持        ，加之年轻父母对婴幼儿照护要求的精细化，托育服务作为一种          儿童福利，越来越成为城市工薪家庭的重要选择。\n依次填入画横线部分最恰当的一项是：","options":{"A":"突出 薄弱 辅助性","B":"明显 短缺 基础性","C":"普遍 不足 补充性","D":"典型 欠缺 支持性"},"answer":"C","explanation":"第一空，搭配“亲职抚育困境”“愈发”，A项“突出”指超过一般地显露出来，B项“明显”指清楚地显露出来，容易让人看出或感觉到，C项“普遍”指广泛而有共同性，均与“亲职抚育困境”“愈发”搭配恰当，保留。D项“典型”指具有代表性的人或事物，与“愈发”搭配不当，且文段未提及该困境代表了什么样的人或事物，排除。\n第二空，搭配“代际支持”，根据“托育服务作为一种······儿童福利，越来越成为城市工薪家庭的重要选择”可知，横线处所填词语应体现代际支持不够之意，B项“短缺”指缺乏，不足，C项“不足”表示数量或程度上的不充分，无法满足需求，均符合文意且搭配恰当，保留。A项“薄弱”指容易破坏或动摇，不雄厚，不坚强，一般搭配“兵力”“基础”“意志”，与“代际支持”搭配不当，排除。\n第三空，根据“托育服务是由3岁以下婴幼儿的法定监护人之外······系统化的照顾服务活动”可知，横线处所填词语应体现托育是额外的支持之意，C项“补充性”指因不足或损失而加以添补的，符合文意，当选。B项“基础性”指基本的，与文意不符，排除。\n故正确答案为C。\n【文段出处】学术论坛期刊《我国托育服务的社区化转向：逻辑与路径》","no":35,"missingImage":false},{"type":"question","qid":"16069878","cat":"片段阅读","stem":"智能社会的演进模糊了社会心态与社会行为的边界，呈现出线上线下虚实共生、心态风险与行动风险交织缠绕的特征，这对社会心态的治理策略与治理工具提出了新的挑战。社交软件的分享机制与算法推荐规律，都以对人类心理特征的精准利用为前提。此类技术往往把复杂的人类互动过程简化为点赞、转发等二元化的态度立场或简单行为，虽然便利了个体表达观点，却可能导致网络行为高度两极化，让许多事实错误但情绪饱满的虚假信息快速传播，成为网络空间治理的一大顽疾。\n这段文字意在强调：","options":{"A":"智能社会对社会心态治理提出了新的挑战","B":"智能化加速了从社会心态到社会行为的转化","C":"社交软件的算法可能导致网络行为高度两极化","D":"智能社会当务之急是要加强网络空间治理"},"answer":"A","explanation":"文段开篇介绍了智能社会演进所呈现的特征，并指出这对社会心态的治理提出了新挑战。随后指出社交软件的分享机制与算法推荐规律会简化人类的互动行为，导致网络行为高度两极化，让虚假信息传播，成为网络空间治理的一大顽疾，即对前文进行了解释说明。故文段重点在首句，强调智能社会的演进对社会心态治理提出了新挑战，对应A项。\nB项，“加速了从社会心态到社会行为的转化”无中生有，文段未提及，排除；\nC项，“可能导致网络行为高度两极化”对应分述句部分，非重点，且缺少文段主题词“智能社会”，排除；\nD项，文段的问题是“智能社会对社会心态的治理提出新挑战”，若想提对策，也应该是针对“社会心态”，“要加强网络空间治理”偏离文段核心，对策不具备针对性，排除。\n故正确答案为A。\n【文段出处】光明日报《以“智”臻“善”：社会心态治理的发展趋势》","no":36,"missingImage":false},{"type":"question","qid":"16069968","cat":"片段阅读","stem":"普惠金融体系面临的重要挑战之一是服务对象存在标准化数据少、个体风险高、抵押品少、个性化需求多等特征，因此发展普惠金融需要不同类型的金融机构和企业共同分担风险和损失，比如融资担保等风险共担机制即为解决上述问题的一种手段，不过费用设计、合作模式等都有待于进一步创新。\n这段文字意在说明：","options":{"A":"普惠金融体系费用设计和合作模式亟待创新","B":"普惠金融体系建设要逐步拓宽金融服务领域","C":"普惠金融体系建设有必要完善风险共担机制","D":"普惠金融体系面临来自服务对象的多重挑战"},"answer":"C","explanation":"文段首先介绍了普惠金融体系面临的一大重要挑战，为问题引入。随后以“因此”+“需要”引导对策“发展普惠金融需要不同类型的金融机构和企业共同分担风险和损失”，并以“比如”引导举例论证，结尾处虽出现转折词“不过”，但其引导的“费用设计、合作模式等都有待于进一步创新”实为对风险共担机制的具体完善。所以中心句仍为“因此”引导的对策句，对应C项。\nA项，对应文段尾句对“风险共担机制”补充说明的内容，非文段重点，且C项既包含文段的核心对策“风险共担机制”，又通过“有必要完善”概括了“费用设计、合作模式等都有待于进一步创新”，更为全面完整，故排除A项；\nB项，“逐步拓宽金融服务领域”文段未提及，无中生有，排除；\nD项，“面临来自服务对象的多重挑战”为问题表述，非重点，排除。\n故正确答案为C。\n【文段出处】《建设高质量普惠金融体系：目标任务、发展实践和挑战应对》","no":37,"missingImage":false},{"type":"question","qid":"16069960","cat":"语句表达","stem":"家电是中国居民能耗的主要来源。空调、冰箱等制冷家电普及率高、使用时间长，是推动节能减排的关键点。近年来，线上渠道快速发展，电商在开拓节能产品市场、推动消费结构绿色化方面的作用不容小觑。例如，电商可以通过突出信息展示、提升列表排序、开展价格促销等做法来提升特定产品的销量。\n这段文字意在强调：","options":{"A":"电商可以通过调控产品价格改变销量结构","B":"电商可以通过引导绿色消费推动节能减排","C":"电商可以通过提升列表排序争取市场份额","D":"电商可以通过宣传节能减排提高复购概率"},"answer":"B","explanation":"文段开篇指出家电是居民能耗的主要来源，而制冷家电是推动节能减排的关键点，接着论述电商开拓节能产品市场、推动消费结构绿色化方面发挥着重要作用，并具体举例论证。故文段重在强调电商可通过引导绿色消费，发挥在推动节能减排方面的作用，对应B项。\nA项“调控产品价格”、C项“提升列表排序”，均对应文段中例子的部分，非重点且表述片面，排除；\nD项，“提高复购概率”文段并未提及，无中生有，排除。\n故正确答案为B。\n【文段出处】管理世界杂志《如何推动绿色消费升级？——电商策略性调价行为与节能产品需求特征》","no":38,"missingImage":false},{"type":"question","qid":"16069964","cat":"片段阅读","stem":"斑翅果蝇的雌虫会在多种软皮水果中产卵，其幼虫在果实内取食，导致水果腐烂。近日，科研人员利用“基因剪刀”技术将影响斑翅果蝇性别发育的基因修改成让雌虫无法正常产卵但对雄虫无影响的版本后，斑翅果蝇的绝大多数后代都会继承这个基因变化，实现基因驱动。科学家认为，人为实现基因驱动，让特定基因在生物群体中传播开来，可以控制有害生物的数量或增强濒危物种的抗病能力。此前已有研究团队用相关方法消灭传播疟疾的蚊子，此次用于斑翅果蝇这种农业害虫尚属首次。\n这段文字主要介绍了：","options":{"A":"“基因剪刀”技术是一项高效的抗虫害技术","B":"“基因剪刀”技术增强了濒危物种的抗病能力","C":"通过基因驱动可以控制有害生物的数量","D":"研究人员用“基因剪刀”技术对抗斑翅果蝇"},"answer":"D","explanation":"文段首先指出斑翅果蝇雌虫产卵会危害软皮水果，接着说明科研人员用“基因剪刀”技术修改其性别发育基因，实现基因驱动，随后介绍基因驱动具有控制有害生物数量或增强濒危物种抗病能力的作用，尾句进一步强调，此次将该技术用于斑翅果蝇这种农业害虫是首次尝试。故文段围绕“基因剪刀”技术与“斑翅果蝇”展开，重点强调研究人员运用“基因剪刀”技术对抗斑翅果蝇这一具体研究，对应D项。\nA项，“高效的抗虫害技术”侧重对技术本身的属性评价，但文段并未提及该技术是否“高效”，且文段核心是介绍该技术针对斑翅果蝇的具体应用实践，选项缺少文段主题词“斑翅果蝇”，偏离文段重点，排除；\nB项，“增强了濒危物种的抗病能力”仅为“基因剪刀”技术实现基因驱动后可能带来的效果之一，并非文段所阐述的核心内容，表述片面且非重点，且缺少文段主题词“斑翅果蝇”，排除；\nC项，“控制有害生物的数量”仅为基因驱动可能带来的效果之一，并非文段所阐述的核心内容，表述片面且非重点，且缺少文段主题词“基因剪刀”技术与“斑翅果蝇”，排除。\n故正确答案为D。\n【文段出处】新华网《美国研究用“基因剪刀”对抗农业害虫斑翅果蝇》","no":39,"missingImage":false},{"type":"question","qid":"16069930","cat":"片段阅读","stem":"在我国，对农业生产造成重大危害的多数昆虫都具有迁飞性。草地贪夜蛾、黏虫等具有“春夏北迁，秋冬南迁”的习性。由于昆虫个体小、重量轻，飞行能力有限，远距离迁飞主要借助气流运载。季风、台风、西太平洋副热带高压的位置与强度变化等因素都会对害虫的迁飞扩散产生重要影响。每年春夏，害虫大军从中南半岛等地随西南季风迁飞入我国，之后又随西南季风或东南季风暖湿气流继续北上。到了秋冬，草地贪夜蛾、黏虫等为逃避低温环境，只好迁回温暖的南方。这是昆虫逃避不良环境条件的一种生存对策。\n这段文字重在说明害虫大军迁飞的：","options":{"A":"地域密码","B":"季节规律","C":"环境影响","D":"生存策略"},"answer":"B","explanation":"文段开篇引出话题“多数昆虫都具有迁飞性”，随后提出观点，草地贪夜蛾、黏虫等具有“春夏北迁，秋冬南迁”的习性，即害虫大军迁飞的季节规律。后文对其进行原因解释，从季风、台风、西太平洋副热带高压的位置与强度变化等因素具体论述如何影响其迁飞的季节规律，文段最后一句通过“这”对前文“逃避低温环境”进行补充说明。故文段重在说明害虫大军迁飞的季节规律，对应B项。\nA项“地域密码”文段并非重点描述，虽然提及南北方，但“春夏北迁，秋冬南迁”重点是强调季节的规律，排除；\nC项“环境影响”对应“季风、台风、西太平洋副热带高压的位置与强度变化等因素”，为原因解释部分内容，非重点，排除；\nD项“生存策略”出现在尾句，是对“逃避低温环境”进行的补充说明，并非全文重点，排除。\n故正确答案为B。\n【文段出处】中国农业科学院植物保护研究所《一探究竟 “虫军”迁飞的气象“密码”》","no":40,"missingImage":false},{"type":"question","qid":"16069894","cat":"片段阅读","stem":"在深度学习的过程中，实际确定误差并非易事。为解决这一问题，当前深度学习领域应用“损失函数”实现误差最小化，即在人工智能的学习过程中，找到能够最小化损失函数值的参数。但损失函数的形式会随具体情况而有所不同，难以全面掌握其特性，因此需要引入微分。微分主要用于分析某个变量的变化如何影响函数的值。通过对损失函数进行微分，可以明了参数变化时损失函数值的变化，进而调整参数值，让损失函数的值尽可能小。在针对性地进行编程后，人工智能能够自动完成上述任务。\n对这段文字概括最恰当的是：","options":{"A":"通过对损失函数进行微分，深度学习能实现误差最小化","B":"引入微分后，损失函数能帮助人工智能实现自主深度学习","C":"损失函数在深度学习中主要用于确定误差","D":"损失函数对深度学习的参数优化具有重要意义"},"answer":"A","explanation":"文段开篇介绍在深度学习过程中确定实际误差并非易事，接下来指出用“损失函数”实现误差最小化，随后“但”转折引出损失函数形式会随具体情况而有所不同，难以全面掌握其特性，紧接着通过“因此”强调需要引入微分，后文继续说明对损失函数微分能明确参数变化对损失值的影响，进而调整参数值让损失函数的值尽可能小，且进行针对性编程后人工智能就可自动完成任务。故文段核心在于对损失函数进行微分能帮助深度学习实现误差最小化，对应A项。\nB项，文段重点是“误差最小化”，并非“实现自主深度学习”，偏离文段中心，排除；\nC、D两项，均缺少“微分”这一主题词，偏离文段中心，排除。\n故正确答案为A。","no":41,"missingImage":false},{"type":"question","qid":"16069933","cat":"语句表达","stem":"通过将城市物联网系统与互联网系统进行充分融合，借助大数据、云计算等数字信息处理技术，管理者可以将城市运行过程中所产生的海量数据资源进行充分整合，在提取有效信息后进行优化决策，形成科学可行的城市治理方案。利用物联网技术改造城市传统基础设施，将其接入城市物联网系统并使其智能化，由此可以增进城市各子系统同使用者、管理者之间的高效协作关系，                    。\n填入画横线处最恰当的是：","options":{"A":"进而提高城市系统的整体运行效率","B":"从而更好发挥物联网的价值创造功能","C":"有效提升互联网和物联网的可靠性和安全性","D":"从多个维度改善城市环境和人们的生活质量"},"answer":"A","explanation":"横线出现在文段结尾，且为尾句的分句，故需结合横线前内容以及横线所在尾句内容进行分析。文段开篇提出城市物联网与互联网融合能形成科学可行的城市治理方案，紧接着论述通过物联网技术改造传统基础设施能增进城市各子系统同使用者、管理者之间的高效协作关系，故横线处应承接前文“高效协作”，体现其对城市系统的直接影响，即提升城市系统整体运行效率，对应A项。\nB项，“发挥价值创造功能”偏离文段核心话题“城市治理”，表述片面，排除；\nC项，“可靠性和安全性”文段中未提及，无中生有，排除；\nD项，“城市环境和人们的生活质量”文段中未提及，无中生有，且与前文“高效协作”衔接不当，排除。\n故正确答案为A。\n【文段出处】经济与管理评论编辑部《新发展阶段物联网赋能经济高质量发展的路径与支持体系研究 》","no":42,"missingImage":false},{"type":"question","qid":"16069948","cat":"语句表达","stem":"如今，网络和数字媒介已成为未成年人生活的基本环境。短视频以沉浸式体验让他们轻松获得各种热点、热梗和表情包，“老铁”“666”等迅速进入他们的话语体系，甚至成为特定圈层的身份标识。在各大社交媒体上，家长们担心“孩子不好好说话”，老师们交流“如何引导学生正确用语”。诙谐幽默的网络语言在丰富人类表达的同时，                    。在“人机共生”时代，如何培育未成年人的语言文化素养值得重视。\n填入画横线处最恰当的是：","options":{"A":"也成为人们理解文化和世界的重要方式","B":"也对原有规范的语言文化体系造成冲击","C":"更需要思考机器智能环境下的文化素养提升问题","D":"越来越多的人感受到“文字失语”的困扰"},"answer":"B","explanation":"本题为语句填空题，横线在文段中间，需结合前后文进行分析。文段开篇指出各种网络语言进入了未成年人的话语体系，但与此同时，家长与老师对此种现象表示了担心并给予正确引导。可知，网络语言虽丰富了人类的表达，但仍有负面影响。B项中“对原有规范的语言文化体系造成冲击”准确对应概括了前文中“不好好说话”“引导学生正确用语”等问题，并且与后文“重视如何培育未成年人语言文化素养”这一对策高度契合，当选。\nA项，“理解文化和世界”文段并未提及，无中生有，排除；\nC项，缺少文段核心话题“语言”，且“机器智能”文段并未提及，无中生有，排除；\nD项，“文字失语”指因网络文化和流行语的影响，导致语言表达能力下降的现象，但横线之前强调“丰富人类表达”，与前文语义矛盾，无法衔接，排除。\n故正确答案为B。\n【文段出处】《“人机共生”时代更须注重语言规范》","no":43,"missingImage":false},{"type":"question","qid":"16069924","cat":"片段阅读","stem":"美，向来不是强造出来的，落在城市绿化上更是如此。一座美丽城市的内核，在于人们对大自然的珍爱与敬畏、人与自然的和谐共生。近年来，我国的城市绿化得到快速发展，遍布公园广场的观赏草坪、街道两旁齐整的行道树、绿草如茵的足球场都为园林城市建设增色不少，极大地提升了观赏性与舒适度。但一些城市绿化中也出现了相互跟风、贪美求贵、追求“四季有花”等现象，不仅成为城市建设的不能承受之重，也与生态文明建设的初衷背道而驰。\n接下来作者最有可能讲述的是：","options":{"A":"如何实事求是地进行城市绿化","B":"城市绿化要综合考虑多种可能","C":"城市绿化绝不能贪美求贵","D":"让城市绿化更好地造福人民"},"answer":"A","explanation":"文段以城市绿化之美不能强造开篇，进而论述美丽城市的内核是人与自然和谐共生，随后阐述我国城市绿化快速发展带来的成效。接着通过转折词“但”引出当前城市绿化存在的问题，并强调其负面影响。按照行文逻辑，接下来最可能围绕“如何纠正这些问题、正确开展绿化”展开论述。文段的问题核心是“跟风、贪美求贵、追求‘四季有花’等”，本质是“不实事求是”，因此接下来最可能讲“如何实事求是地开展绿化”，对应A项。\nB项，“综合考虑多种可能”表述不明确，未明确指向文段中“跟风、贪美求贵、追求‘四季有花’”的具体问题，针对性不强，排除；\nC项，仅针对文段中“贪美求贵”这一个现象，表述片面，排除；\nD项，强调意义效果，未针对尾句问题提出解决对策，逻辑不连贯，排除。\n故正确答案为A。\n【文段出处】新华时评《城市绿化不能贪美求贵》","no":44,"missingImage":false},{"type":"question","qid":"16069873","cat":"片段阅读","stem":"“低空风怪”也叫下击暴流，是一股从雷暴云中快速下沉的强烈气流。如同瀑布一泻千里直击山石，“风怪”在触及地面后向四周爆发出强大的冲击力。当“风怪”呼啸而下时，速度最高可达每秒100米，比高铁还快。不仅如此，它还会在低空形成猛然四散的强风，击中地面时爆发出的水平风力最大可达17级，足以掀翻火车、轮船。“风怪”造成的大风会在几百米内风向突变，对飞机起降危害很大。\n接下来作者最有可能讲述的是：","options":{"A":"“低空风怪”的定义及其特征","B":"“低空风怪”威力强、危害大","C":"能否对“低空风怪”作出预警","D":"“低空风怪”与龙卷风的差异"},"answer":"C","explanation":"本题为接语选择题，需要在通读全文的基础上，重点关注文段最后讨论的核心话题。文段开篇引出“低空风怪”这一话题，随后分别论述了其冲击力强、风速快、风力大的特点，尾句强调“低空风怪”的危害，即对飞机起降危害性很大。故下文应该继续围绕“低空风怪”的危害性进一步延伸，最有可能探讨预警“低空风怪”的相关话题，C项当选。\nA项“‘低空风怪’的定义及其特征”与B项“‘低空风怪’威力强、危害大”均为前文已论述过的内容，后文不会再次论述，排除；\nD项，“龙卷风”文段并未提及，与前文衔接不当，排除。\n故正确答案为C。\n【文段出处】光明网·文摘报《降服“低空风怪”》","no":45,"missingImage":false},{"type":"question","qid":"16069966","cat":"片段阅读","stem":"市场是实现资源优化配置的有效手段，建设全国统一大市场是构建新发展格局的基础支撑。只有加快建设全国统一大市场，彻底破除地方保护和市场分割等造成的经济大循环中的堵点、卡点、断点，促进商品要素资源在更大范围畅通流动和高效配置，才能充分发挥我国超大规模市场优势，推动我国市场由大到强，进一步促进科技创新和产业升级，增强产业链供应链韧性，推动经济高质量发展。\n这段文字意在说明：","options":{"A":"应尽快实现资源的优化配置","B":"要加快建设全国统一大市场","C":"要充分发挥我国的市场优势","D":"必须彻底破除地方保护主义"},"answer":"B","explanation":"文段开篇通过“基础支撑”指出建设全国统一大市场对构建新发展格局的重要性，接着通过“只有······才······”强调要加快建设全国统一大市场，指出其对于发挥我国市场优势、推动经济高质量发展等方面的重要作用。故文段重在强调要加快建设全国统一大市场，主题词为“全国统一大市场”，对应B项。\nA项，“实现资源优化配置”对应文段首句，为引入话题的部分，非重点，且偏离文段核心话题“全国统一大市场”，排除；\nC项，“发挥我国市场优势”对应“才”之后的内容，是建设全国统一大市场带来的意义，非重点，排除；\nD项，偏离文段核心话题“全国统一大市场”，且“破除地方保护主义”属于具体举措之一，非重点且表述片面，排除。\n故正确答案为B。\n【文段出处】经济日报《建设统一大市场需坚持问题导向》","no":46,"missingImage":false},{"type":"question","qid":"16070287","cat":"片段阅读","stem":"20世纪中叶，分子生物学诞生，开启了在分子水平上研究生命及其活动的现代生命科学时代。这个时期的研究者采用“碎片化”的模式来研究生命及其生理或病理活动。但是，研究者逐渐认识到，生命活动并非是由一个个基因或蛋白质“零件”独立完成的，而是建立在生命体内众多基因、蛋白质和其他化学小分子形成的复杂相互作用之上；对于高等生物而言，除了分子层面复杂的相互作用网络外，还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用。\n根据这段文字，可以推出：","options":{"A":"生命活动是一种复杂系统的整体行为","B":"低等生物的生命活动由基因独立完成","C":"分子层面的研究是理解高等生物的关键","D":"现代科学主要采用“碎片化”模式研究生命活动"},"answer":"A","explanation":"A项，根据“生命活动并非是由一个个基因或蛋白质‘零件’独立完成的，而是建立在生命体内众多基因、蛋白质和其他化学小分子形成的复杂相互作用之上······还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用”可知，表述正确，当选；\nB项，根据“生命活动并非是由一个个基因或蛋白质‘零件’独立完成的”可知，文段是一个普遍性的陈述，并未区分低等生物和高等生物，尽管后文提及高等生物有额外的介观层面相互作用，但并不意味着低等生物的生命活动可以由基因独立完成，无中生有，排除；\nC项，根据“除了分子层面复杂的相互作用网络外，还有着细胞、组织和器官等不同介观层面各种组分之间的相互作用”可知，除了“分子层面的研究”，还存在“细胞、组织和器官等不同介观层面”，未提及分子层面的研究是理解高等生物的“关键”，偷换逻辑，排除；\nD项，根据“20世纪中叶，分子生物学诞生······这个时期的研究者采用‘碎片化’的模式来研究生命及其生理或病理活动”和“但是，研究者逐渐认识到，生命活动并非是······”可知，20 世纪中叶使用了“碎片化”的模式，后来研究者逐渐认识到该模式的弊端，故无法得出现代科学“主要采用”“碎片化”模式研究生命活动，排除。\n故正确答案为A。\n【文段出处】中国网《生命大科学：从微观到介观的组学研究》","no":47,"missingImage":false},{"type":"question","qid":"16069890","cat":"片段阅读","stem":"有人认为海山是孤立的水下岛屿。事实真是这样吗？因为海洋的分割，岛屿上确实会形成相对孤立的岛屿生物群，生物群落比较独特，特有种比例高，但总体多样性低。在海山上，除鱼虾等游泳动物外，大型生物主要是一些固着生活或移动能力差的动物，它们主要通过海流转移和扩散幼体。海山是否“孤立”，取决于栖息其上的生物幼体扩散是否受到限制。地形和海流的相互作用可在海山顶部形成封闭环流，从而留住幼虫。但这些现象出现的频率很低，即便出现也不持久，因此难以将海山长期隔离成水下孤岛。\n最适合做这段文字标题的是：","options":{"A":"人类最不了解的生物栖息地","B":"海山：特有种的乐园","C":"海山是孤立的水下岛屿吗？","D":"海山：深海中的生命孤岛"},"answer":"C","explanation":"文段开篇引出“海山是否是孤立的水下岛屿”的话题，然后进行分析，先是介绍了岛屿的生物群落总体多样性较低，接着又阐述了在海山上大型生物基本都是靠海流转移和扩散幼体，然后指出海山是否“孤立”与生物幼体扩散是否受到限制有关，又分析封闭环流虽然能够留住幼虫，但这些现象出现的频率很低，最后通过“因此”引出观点，说明海山并非是水下孤岛。故文段整体围绕海山是否是孤立的水下岛屿这一话题展开，对应C项。\nA项，缺少文段主题词“海山”，排除；\nB项，“特有种”属于结论词“因此”之前的内容，非重点，排除；\nD项，与文意相悖，文段强调海山难以被隔离成水下孤岛，排除。\n故正确答案为C。\n【文段出处】《这类深海秘境人类只探索过其中1%，那里是生命“孤岛”还是“绿洲”？》","no":48,"missingImage":false},{"type":"question","qid":"16070239","cat":"片段阅读","stem":"当人们将光照程度作为城市发达程度的衡量标准时，大都市的星光也正在“黯淡消失”。曾几何时，夜晚璀璨的星空带给人无限的遐思，但是随着城市化进程的加快，越来越多生活在城市里的人发现，星星似乎“消失不见”了。天文学家表示，近年来光污染状况迅速恶化，超过三分之一的人类看不到夜空中明亮的银河。发光二极管和其他形式的照明正以惊人的速度照亮夜空。由于光污染的加剧，20年后人类可能无法看到夜晚的星空。\n最适合做这段文字标题的是：","options":{"A":"星光黯淡：寻找消失的星星","B":"光污染：亮了城市，暗了星空","C":"星星点灯：照不亮城市的夜空","D":"光污染：让星星们“无处可藏”"},"answer":"B","explanation":"文段开篇介绍人们将光照程度作为衡量城市发达程度的标准，同时大都市的星光在“黯淡消失”，接着指出随着城市化进程加快，城市的星星似乎“消失不见”了。后文通过天文学家的观点，强调城市光污染状况迅速恶化，部分人类已经看不到夜空中明亮的银河，最后指出未来人类可能看不见夜晚的星空，故文段整体围绕“光污染”展开，介绍其照亮城市的同时也“暗淡”了星空，对应B项。\nA项，未提及核心话题“光污染”，且“寻找消失的星星”文段并未提及，无中生有，排除；\nC项，未提及核心话题“光污染”，且“星星点灯”文段并未提及，无中生有，排除；\nD项，“无处可藏”与文意相悖，且缺少对城市的影响，表述片面，排除。\n故正确答案为B。\n【文段出处】中国科学报《光污染：亮了城市，暗了星空》科技日报《光污染或致20年后难见星空》","no":49,"missingImage":false},{"type":"question","qid":"16069897","cat":"片段阅读","stem":"绿色供应链是一种在整个供应链中综合考虑环境影响和资源效率的现代管理模式。它以绿色制造理论和供应链管理技术为基础，涉及供应商、生产商、销售商、消费者和回收商，目的是使产品从物料获取、加工、包装、仓储、运输、使用到报废处理的整个过程，对环境影响最小，资源利用率最高。资源材料是绿色供应链的基础，其可持续性供给是实现绿色供应链的根本条件。\n根据这段文字，可以推出的是：","options":{"A":"传统供应链对环境影响的关注度较低","B":"应用绿色供应链，生产商和供应商最为关键","C":"绿色供应链的核心目标是增强可持续发展","D":"若资源材料供给不可持续，绿色供应链则难以实现"},"answer":"D","explanation":"A项，文段仅介绍了绿色供应链“综合考虑环境影响”，未提及传统供应链对环境影响的关注度，无中生有，排除；\nB项，根据“它以绿色制造理论和供应链管理技术为基础，涉及供应商、生产商、销售商、消费者和回收商”可知，“生产商和供应商最为关键”表述过于绝对，排除；\nC项，根据“目的是使产品从物料获取、加工、包装、仓储、运输、使用到报废处理的整个过程，对环境影响最小，资源利用率最高”可知，“核心目标是增强可持续发展”表述错误，排除；\nD项，根据“资源材料是绿色供应链的基础，其可持续性供给是实现绿色供应链的根本条件”可知，若资源材料供给不可持续，作为根本条件缺失，绿色供应链则难以实现，表述正确，当选。\n故正确答案为D。\n【文段出处】中国知网《打造绿色供应链 如何让电机“转”得更省》","no":50,"missingImage":false},{"type":"question","qid":"16069967","cat":"片段阅读","stem":"近日，一种名叫“RoboCap”的机器人胶囊问世，体积相当于维生素大小，一端在容器中装载有效药物，表面涂有明胶，可调节其在特定pH下溶解。当涂层溶解时，pH的变化会触发“RoboCap”胶囊内部的一个微型马达旋转，有助于胶囊进入粘液并移位。胶囊上覆盖着小螺柱，可以像牙刷一样刷掉粘液。旋转运动还可帮助侵蚀携带药物的隔室，将药物释放到消化道。也就是说，该胶囊的“机器人帽”到达小肠时，会旋转并穿过粘液屏障，使胶囊携带的药物进入肠道内的细胞。研究人员表示，机器人胶囊有朝一日或能取代注射给药的方式。\n这段文字未涉及机器人胶囊的：","options":{"A":"应用前景","B":"适用对象","C":"工作原理","D":"内部结构"},"answer":"B","explanation":"A项，根据“研究人员表示，机器人胶囊有朝一日或能取代注射给药的方式”可知，“应用前景”文段有所提及，排除；\nB项，“适用对象”在文段中并未提及，无中生有，当选；\nC项，根据“当涂层溶解时，pH的变化会触发‘RoboCap’胶囊内部的一个微型马达旋转，有助于胶囊进入粘液并移位。胶囊上覆盖着小螺柱，可以像牙刷一样刷掉粘液。旋转运动还可帮助侵蚀携带药物的隔室，将药物释放到消化道”可知，“工作原理”文段有所提及，排除；\nD项，根据“一端在容器中装载有效药物，表面涂有明胶”“胶囊内部的一个微型马达”“携带药物的隔室”可知，“内部结构”文段有所提及，排除。\n本题为选非题，故正确答案为B。\n【文段出处】科技日报《机器人胶囊可将药物送入消化道》","no":51,"missingImage":false},{"type":"question","qid":"16070179","cat":"片段阅读","stem":"一年中的大部分时间，成年棕熊都是离群索居的动物。但当大量鲑鱼洄游到湖中繁殖时，常常会有几十头棕熊同时聚集在湖边。过高的种群密度和相对有限的理想捕鱼位置，决定了它们必须竞争进食序列。在这个巨大的“餐桌”周围，进食的座次是由实力来决定的，成年公熊之间常常为了争夺捕鱼位置在湖畔发生激烈打斗，胜者赢得一切。在这个时期，湖畔通常是被雄性棕熊所占据的，当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们，幼熊易遭到撕咬而死亡。\n由这段文字无法推出：","options":{"A":"成年棕熊在争夺食物时竞争非常激烈","B":"成年棕熊的进食序列主要由实力决定","C":"鲑鱼繁殖期的湖畔对幼熊会更加危险","D":"雌熊带幼熊靠近湖畔是为了捕食鲑鱼"},"answer":"D","explanation":"A项：根据“成年公熊之间常常为了争夺捕鱼位置在湖畔发生激烈打斗”可知，符合文意，排除；\nB项：根据“在这个巨大的‘餐桌’周围，进食的座次是由实力来决定的”可知，符合文意，排除；\nC项：根据“当大量鲑鱼洄游到湖中繁殖时，······在这个时期······当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们，幼熊易遭到撕咬而死亡”可知，符合文意，排除；\nD项：文段仅指出“当雌性带着幼年棕熊靠近时，狂暴的公熊会驱赶它们”，但并未提及它们靠近的目的是捕食鲑鱼，无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】中国国家地理网《堪察加棕熊 为森林“运氮”的鲑鱼猎手》","no":52,"missingImage":false},{"type":"question","qid":"16069944","cat":"片段阅读","stem":"近年来，一系列具有人文情怀的文化综艺类节目集体走红。在融媒体时代，文化综艺类节目如何创新成了摆在创作者面前的一道难题。创新要找到令年轻人感兴趣的点进行嫁接，但又不能丢掉主流媒体的审美、价值观和社会责任。文化综艺的创新，应该走文化传统和现代时尚相结合之路，不能脱离对传统经典文化的传承凭空打造所谓现代时尚，而是要把传统与时代精神相结合，走进人民群众最接地气的生活，在寓教于乐中让人受到启迪。\n下列选项与这段文字意思不符的是：","options":{"A":"文化综艺类节目的创新要扎根人民、扎根生活","B":"文化综艺类节目要以传承传统文化为首要目的","C":"文化综艺类节目不能流于说教而忽视其娱乐性","D":"文化综艺类节目创新要关注年轻人的精神需求"},"answer":"B","explanation":"A项，根据“走进人民群众最接地气的生活”可知，“扎根人民、扎根生活”与文意相符，排除；\nB项，根据“应该走文化传统和现代时尚相结合之路······要把传统与时代精神相结合”可知，“以传承传统文化为首要目的”文段并未提及，无中生有，当选；\nC项，根据“在寓教于乐中让人受到启迪”可知，“不能流于说教而忽视其娱乐性”与文意相符，排除；\nD项，根据“创新要找到令年轻人感兴趣的点进行嫁接”可知，“创新要关注年轻人的精神需求”与文意相符，排除。\n本题为选非题，故正确答案为B。\n【文段出处】中国文化报《文化综艺如何“玩转”传统文化？》","no":53,"missingImage":false},{"type":"question","qid":"16069928","cat":"语句表达","stem":"①一段时间里，长视频葆有一种艺术优越感，认为台网联动就是把影视作品切成片段挪到网上\n②这种长短阵营划分实际上是专业作品和民间段子的区分\n③但在当今短视频崛起的网络视频生态中，长视频不可再孤芳自赏，而应打开视野，与更多短视频及受众进行联结交流\n④剧场化不是让长视频成为网络视听阵营的“孤勇者”，而是在精品化战略基础上思考如何利用短视频为作品铺垫引流\n⑤的确，长视频是一种综合艺术，包含文学、戏剧、音乐、歌舞等多种艺术元素\n⑥网络视频原无长短之分，只因短视频的崛起，专业生产的影视作品才以长视频的概念区别于用户生产模式的短视频\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑥④①②③⑤","B":"④⑥②①⑤③","C":"⑤①②③⑥④","D":"①⑤③②④⑥"},"answer":"B","explanation":"观察选项，确定首句。①句指出长视频葆有艺术优越感及对台网联动的认识，④句对“剧场化”下定义，指出剧场化是在精品化战略基础上思考如何利用短视频为长视频作品铺垫引流，⑥句说明长短视频划分的由来，三句均可作首句，故保留A、B、D三项。⑤句以“的确”开头，“的确”指完全确实，多用于佐证前文观点，故不适合直接作首句，排除C项。\n继续观察发现，②句出现指代词“这”，可考虑指代词捆绑解题。②句核心围绕“长短视频的阵营划分”展开，前文需围绕此话题论述。观察A、B、D三项可知，②句前分别为①、③、⑥句。⑥句介绍因短视频的崛起才有了长短视频之分，与②句话题一致，可构成指代词捆绑，B项当选。①句介绍长视频葆有艺术优越感，③句介绍当下长视频的发展方向，二者均无法与②句构成指代词捆绑，排除A、D两项。\n故正确答案为B。\n【文段出处】光明日报《影视节目创作传播：长短视频互利共生》","no":54,"missingImage":false},{"type":"question","qid":"16069932","cat":"语句表达","stem":"①如今，有些文字砖在未被发现前就已经消匿了，尽量多地发现并解读文字砖，成为了钩沉历史的重要途径\n②我国古代的很多国家工程都实行“物勒工名”制\n③砖上的文字记录了长城修建者的信息，甚至还有远隔百里千里之外的地名\n④在今天河北、北京、山西等地的明长城上有一些带有文字的砖，它们被称为长城文字砖\n⑤长城文字砖上的每个文字都是史书之外的鲜活符号，为我们解锁那段历史提供了秘钥\n⑥透过文字砖，我们可以辨识出某段长城是由谁修造的，还可通过上面的地名探察明朝国防的客兵制度\n将以上6个句子重新排列，语序正确的是：","options":{"A":"②③④⑥⑤①","B":"④⑤②⑥③①","C":"②④⑥⑤③①","D":"④③②⑥⑤①"},"answer":"D","explanation":"对比选项，确定首句。②句介绍中国古代很多国家都实行“物勒工名”这一制度，介绍“物勒工名”的背景，④句通过下定义，引出“长城文字砖”这一话题，二者均适合作为首句，无法排除选项。\n观察题干，可以发现①句、⑤句、⑥句都介绍了“长城文字砖”对解答历史的重要意义，③句介绍了长城文字砖上的文字信息。故根据行文逻辑可以判断，文段应先介绍文字砖上的信息内容，再介绍基于其具备的重要历史价值。因此③句应在①句、⑤句、⑥句之前，排除B、C两项，保留A、D两项。\n对比A、D两项发现，可通过确定③句和④句的顺序确定答案。③句介绍长城文字砖上记录的具体信息，④句通过下定义的方式引出长城文字砖的话题，应先引出文字砖的话题，再具体介绍砖上的信息内容，故④句应在③句之前，排除A项，D项当选。\n故正确答案为D。\n【文段出处】中国国家地理《透过文字砖 看明长城隐藏的历史信息》","no":55,"missingImage":false}],"count":30,"answerable":30,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"16070159","cat":"数学运算","stem":"运动心率即人体在运动时保持的心率状态，保持最佳的运动心率对于运动安全及运动效果来说都十分重要。一般来说，正常人最佳运动心率的范围是：最大运动心率=（220-年龄）×0.8次/分；最小运动心率=（220-年龄）×0.6次/分。那么正常人40岁时，最佳运动心率的范围为：","options":{"A":"108~132次/分","B":"132~144次/分","C":"108~144次/分","D":"144~176次/分"},"answer":"C","explanation":"根据题干给出的公式，当正常人40岁时，最大运动心率=（220-40）×0.8=144次/分；最小运动心率=（220-40）×0.6=108次/分。故正常人40岁时，最佳运动心率的范围为：108~144次/分。\n故正确答案为C。","no":56,"missingImage":false},{"type":"question","qid":"16070268","cat":"数学运算","stem":"一家三口去旅游，拍摄单人照、合照一共68张。合照的数量比单人照的两倍少一张；合照中，全家福占了三分之二，且孩子出现的次数为爸爸妈妈出现次数之和的一半；孩子的单人照比爸爸、妈妈单人照数量之和多1张。那么孩子出现的照片一共有：","options":{"A":"52张","B":"48张","C":"45张","D":"37张"},"answer":"A","explanation":"根据“单人照、合照一共68张。合照的数量比单人照的两倍少一张”，可得单人照为\u003cimg data-k=\"cc0fdea91ae0\">张，合照为68−23=45张。因为“孩子的单人照比爸爸、妈妈单人照数量之和多1张”，则孩子单人照为\u003cimg data-k=\"ea4c9de35ad5\">张，爸爸、妈妈单人照为23−12=11张。由于“合照中，全家福占了三分之二”，则全家福数量为\u003cimg data-k=\"25e5c7eeca78\">张，两人合照数量为45−30=15张。\n设有孩子的两人合照为x张，则没有孩子的两人合照为(15−x)张。根据 “合照中孩子出现的次数为爸爸妈妈出现次数之和的一半”，可得方程\u003cimg data-k=\"c57dd4abd35a\">，解得x=10。所以孩子出现的照片一共有12+30+10=52张。\n故正确答案为A。","no":57,"missingImage":false},{"type":"question","qid":"16070160","cat":"数学运算","stem":"木星冲日，即木星、地球和太阳三者处于一条直线上，且地球位于太阳和木星之间。已知2024年12月8日发生了木星冲日，若木星绕太阳公转的周期约为12个地球年，则下一次木星冲日发生于下列哪个时间段？","options":{"A":"2025年7月~9月","B":"2026年1月~3月","C":"2026年4月~6月","D":"2026年7月~9月"},"answer":"B","explanation":"已知地球绕太阳公转的周期为1个地球年，相当于钟表的分针（短且快）；木星绕太阳公转的周期约为12个地球年，相当于钟表的时针（长且慢）。“木星冲日，即木星、地球和太阳三者处于一条直线上，且地球位于太阳和木星之间”，相当于分针和时针重合。两针角速度差为\u003cimg data-k=\"a6de9a3e197b\">圈/年，则重合周期为\u003cimg data-k=\"01cb92d0abf5\">年\u003cimg data-k=\"600da2a3d77d\">1年零33天。已知2024年12月8日发生了木星冲日，则下一次约为2026年1月10日，在B项范围内。\n故正确答案为B。","no":58,"missingImage":false},{"type":"question","qid":"16070169","cat":"数学运算","stem":"为了节约资源，保护环境，某企业需要购买A、B两种型号的污水处理设备共8台。A型设备月污水处理能力为240吨，价格为每台12万元，B型设备月污水处理能力为160吨，价格为每台10万元，企业最多支出90万元购买设备，且要求月污水处理能力不低于1600吨。那么A型污水处理设备最多可购买：","options":{"A":"3台","B":"4台","C":"5台","D":"6台"},"answer":"C","explanation":"方法一：根据题意可得A、B两种型号的设备每万元月污水处理能力分别为\u003cimg data-k=\"ce694a08cda9\">吨、\u003cimg data-k=\"8ba04ab82e89\">吨，相同支出情况下A型设备污水处理能力更强，但A型设备价格较高，结合题目问A型污水处理设备最多可购买多少，可从最大选项开始代入验证：\n代入D项，A型设备6台，则B型设备8-6=2台，总费用=6×12+2×10=72+20=92万元，超过90万预算，排除；\n代入C项，A型设备5台，则B型设备8-5=3台，总费用=5×12+3×10=60+30=90万元，刚好符合预算，总处理能力\u003cimg data-k=\"ec6c0c8d9dfa\">，符合能力要求。\n故正确答案为C。\n方法二：设购买A型设备x台，则B型设备(8-x)台。根据企业最多支出90万元可得\u003cimg data-k=\"b48c8a5160fd\">，根据要求月污水处理能力不低于1600吨可得\u003cimg data-k=\"33ed400db5cc\">，解得\u003cimg data-k=\"3627f68fe40e\">，因此A型设备最多可购买5台。\n故正确答案为C。","no":59,"missingImage":false},{"type":"question","qid":"16070163","cat":"数学运算","stem":"随着新型清洁能源、现代生态农牧的发展，昔日戈壁荒滩不仅成为光伏“蓝海”，还变成了养殖数万只“光伏羊”的繁茂草原。牧民甲、乙家中都有若干只“光伏羊”，乙若给甲20只羊，甲的羊数将是乙的K倍；甲若给乙K只羊，乙的羊数将是甲的一半；若K为正整数，那么K的值可能有多少个？","options":{"A":"5","B":"6","C":"7","D":"8"},"answer":"D","explanation":"设牧民甲、乙家中的光伏羊分别有x只、y只。根据题意可列方程组：\u003cimg data-k=\"03caf59a898c\">，将①式x=k（y-20）-20代入②式可得：k（y-20）-20-k=2（y+k），整理可得\u003cimg data-k=\"309e2b3d132f\">，变形后可得\u003cimg data-k=\"93683c165367\">，根据题意y为正整数，且k为正整数，则k-2为66的约数。对66进行因式分解：66=1×66=2×33=3×22=6×11，因此66的约数共8个，k-2共8种情况：\n当k-2=1时，k=3，y=89只，x=187只；\n当k-2=2时，k=4，y=56只，x=124只；\n当k-2=3时，k=5，y=45只，x=105只；\n当k-2=6时，k=8，y=34只，x=92只；\n当k-2=11时，k=13，y=29只，x=97只；\n当k-2=22时，k=24，y=26只，x=124只；\n当k-2=33时，k=35，y=25只，x=155只；\n当k-2=66时，k=68，y=24只，x=252只。\n则k值共有8种可能。\n故正确答案为D。","no":60,"missingImage":false},{"type":"question","qid":"16070165","cat":"数学运算","stem":"城区某中学安排2位数学老师、4位英语老师到A、B两所乡村中学任教，要求两所乡村中学各安排3位老师，其中A中学至少需要安排1位数学老师。那么有多少种不同的安排方式？","options":{"A":"9","B":"12","C":"16","D":"20"},"answer":"C","explanation":"方法一：根据题意，A中学可以安排1位数学老师或2位数学老师，分类讨论如下：\n（1）A中学安排1位数学老师、2位英语老师，其余老师安排给B中学，有\u003cimg data-k=\"f680fdcc63ba\">种安排方式；\n（2）A中学安排2位数学老师、1位英语老师，其余老师安排给B中学，有\u003cimg data-k=\"e79bff1207ee\">种安排方式。\n分类用加法，则A中学至少需要安排1位数学老师的方式有12+4=16种。\n方法二：可考虑逆向思维。总情况为从6位老师中选3位去A中学，有\u003cimg data-k=\"e4071fc1b226\">种安排方式。要求A中学至少需要安排1位数学老师，反面为安排到A中学的3位老师全是英语老师，有\u003cimg data-k=\"e0f0f119e7e1\">种安排方式。因此，共有20-4=16种安排方式。\n故正确答案为C。","no":61,"missingImage":false},{"type":"question","qid":"16070162","cat":"数学运算","stem":"某数字展馆沿入口两侧各设有3个展位。现需安排数字产品展位和人工智能展位各3个，且数字产品展位不能都安排在同一侧，那么共有多少种安排方式？","options":{"A":"244","B":"648","C":"684","D":"720"},"answer":"B","explanation":"方法一：根据题意，要求数字产品的3个展位不能都安排在同一侧，分类讨论如下：\n（1）左侧有1个数字产品展位和2个人工智能展位，其余展位在右侧，有\u003cimg data-k=\"4e407b9232a6\">\u003cimg data-k=\"971d23bf919e\">种安排方式；\n（2）左侧有2个数字产品展位和1个人工智能展位，其余展位在右侧，有\u003cimg data-k=\"33fcb76ad08f\">\u003cimg data-k=\"971d23bf919e\">种安排方式。\n综上，共有324+324=648种安排方式。\n方法二：可考虑逆向思维。总情况为将6个展位任意放置在左右两侧的6个位置，有\u003cimg data-k=\"b5af088a30fe\">种安排方式。要求数字产品的3个展位不能都安排在同一侧，反面为数字产品的3个展位均放在同一侧。从左、右两侧选择其中一侧，放入数字产品的3个展位，另一侧放入人工智能的3个展位，有\u003cimg data-k=\"b3430f62aacd\">种安排方式。因此，共有720-72=648种安排方式。\n故正确答案为B。","no":62,"missingImage":false},{"type":"question","qid":"16070168","cat":"数学运算","stem":"体操世锦赛男团预赛一共有单杠、双杠、自由体操、鞍马、吊环、跳马六个项目，每个国家的比赛项目顺序由抽签决定。那么某个国家第一个比赛项目不是单杠，且自由体操不在双杠之后的概率是多少?","options":{"A":"\u003cimg data-k=\"264d1a7b506a\">","B":"\u003cimg data-k=\"54d707f15b45\">","C":"\u003cimg data-k=\"a6f7e1889399\">","D":"\u003cimg data-k=\"ff1b1de9ab8e\">"},"answer":"A","explanation":"根据题意，第一个比赛项目是六个项目中的任意一项的概率均为\u003cimg data-k=\"c7ce0624c5b3\">，则第一个比赛项目不是单杠的概率为\u003cimg data-k=\"365691502844\">；自由体操要么在双杠之前，要么在双杠之后，要求自由体操不在双杠之后，则自由体操在双杠之前，概率为\u003cimg data-k=\"54d707f15b45\">。分步用乘法，则所求概率\u003cimg data-k=\"152423188d63\">。\n故正确答案为A。","no":63,"missingImage":false},{"type":"question","qid":"16070171","cat":"数学运算","stem":"小刚新做了一个鞋柜，鞋柜的纵截面如左下图所示。鞋柜水平深度28.8厘米，隔板与水平面夹角为\u003cimg data-k=\"15c59351d2c7\">，这个格子刚好放得下一个15厘米高的鞋盒，则这双鞋的鞋码最大是：（参考数据：\u003cimg data-k=\"96ed1c846677\">，\u003cimg data-k=\"d77c4d148336\">，\u003cimg data-k=\"63534149caef\">）\n\u003cimg data-k=\"373c81314b0b\" style=\"max-width:515px\">","options":{"A":"40","B":"41","C":"42","D":"43"},"answer":"B","explanation":"如下图所示，已知\u003cimg data-k=\"3ae8c0a1518d\">，\u003cimg data-k=\"a63352d698ec\">，\u003cimg data-k=\"e25c664a6d72\">，所以，\u003cimg data-k=\"ddda59e3433e\">。\n在直角\u003cimg data-k=\"9619ed85ae95\">中，\u003cimg data-k=\"51cc025255fd\">，所以\u003cimg data-k=\"0b982de8ae0b\">；\n在直角\u003cimg data-k=\"ff256f1de2a4\">中，\u003cimg data-k=\"1c75f9565dff\">，所以\u003cimg data-k=\"f8428ba7e4a3\">；\n所以，BC=CE-BE=30-4.35=25.65cm=256.5mm，对应题中表格可知，最大可放41码的鞋。\n\u003cimg data-k=\"b93a7b5256de\" style=\"max-width:290px\">\n故正确答案为B。","no":64,"missingImage":false},{"type":"question","qid":"16070290","cat":"数学运算","stem":"某林场计划扩大荒原造林面积。下图中\u003cimg data-k=\"b4c82261e0aa\">区域的荒原造林工作已由两人花费一天的时间完成。若
