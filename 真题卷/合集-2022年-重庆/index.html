<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测真题模拟考场（离线版）</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --ink:#1b2431; --sub:#667085; --line:#e2e6ef;
  --brand:#1f6feb; --brand-soft:#e8f0fe; --ok:#12925a; --ok-soft:#e6f6ee;
  --bad:#d2372e; --bad-soft:#fdecea; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); padding-bottom:80px;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;height:auto;vertical-align:middle}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05)}
.topbar .inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.selbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{width:74px}

.timer{display:flex;align-items:center;gap:9px;padding:6px 14px;border-radius:12px;background:#101828;color:#fff;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer .clock{font-size:24px;font-weight:800;letter-spacing:1px;line-height:1}
.timer .lab{font-size:10px;opacity:.7;letter-spacing:.5px}
.timer.warn{background:#b42318;animation:pulse 1.4s infinite}
.timer.half{background:#b45309}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.btn:hover{border-color:#c7cedb;background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a5ed6}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 244px;gap:18px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

.paper-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.paper-head h1{font-size:19px}
.paper-head .meta{margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.tips{margin-top:10px;font-size:12.5px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;line-height:1.65}

/* ---------- question cards ---------- */
.section-head{margin:26px 0 12px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#1f2937,#334155);color:#fff;display:flex;align-items:center;gap:12px}
.section-head h2{font-size:15.5px}
.section-head .n{font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}

.material{background:#fffbeb;border:1px solid #f4e2b8;border-radius:12px;padding:14px 18px;margin:0 0 12px;font-size:14.5px;line-height:1.85}
.material .mtitle{font-weight:700;font-size:12.5px;color:#9a6b00;letter-spacing:.5px;margin-bottom:6px}
.material p{margin:.5em 0}
.material img{display:block;margin:10px auto;border-radius:6px}

.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:96px}
.q.correct{border-color:#a7e0c4;background:linear-gradient(0deg,#f6fdfa,#fff)}
.q.wrong{border-color:#f0b4ae;background:linear-gradient(0deg,#fff8f7,#fff)}
.q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.q .num{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand);border-radius:7px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .tag{font-size:11.5px;color:var(--sub);background:#f2f4f8;border-radius:20px;padding:1px 9px}
.q .flag{margin-left:auto;font-size:12px;font-weight:700}
.q .flag.ok{color:var(--ok)}
.q .flag.no{color:var(--bad)}
.stem{font-size:15px;line-height:1.95;margin:2px 0 12px;word-break:break-word}
.stem p{margin:.45em 0}
.stem img{display:block;margin:10px auto;border-radius:6px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fcfdff;cursor:pointer;transition:.13s;line-height:1.7}
.opt:hover{border-color:#b9c6dd;background:#f6f9ff}
.opt input{margin:6px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.opt .k{font-weight:700;min-width:16px}
.opt .v{flex:1;word-break:break-word}
.opt .v img{max-height:150px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ans-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ans-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line);background:#fcfdff}
.locked .opt.on:hover{border-color:var(--brand);background:var(--brand-soft)}
.locked .opt.ans-ok:hover{border-color:var(--ok);background:var(--ok-soft)}
.locked .opt.ans-bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.expl{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;font-size:13.8px;line-height:1.85;color:#334155}
.expl .eh{font-weight:700;font-size:12.5px;color:var(--brand);margin-bottom:5px;letter-spacing:.4px}
.expl p{margin:.4em 0}
.expl img{display:inline-block;height:1.35em;margin:0 2px;vertical-align:-.25em}
.expl img[src^="data:image/png"]{height:auto;max-height:260px;display:block;margin:8px auto}
.ansline{font-weight:700;color:var(--ok);margin-bottom:6px}

/* ---------- side nav ---------- */
.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side h3{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.cell{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#475467;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:#dbe7fb;border-color:#b9cdf1;color:#1a4fa0}
.cell.ok{background:var(--ok-soft);border-color:#7fcfa8;color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:#eda9a3;color:var(--bad)}
.cell.mid{background:#fee2e2;border-color:#f3b0aa;color:#b42318}
.legend{margin-top:11px;font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.bottombar .inner{max-width:1240px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bottombar .stat{font-size:13px;color:var(--sub)}
.bottombar .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#e6eaf2;flex:1;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4f9bff);width:0;transition:width .2s}

/* ---------- result ---------- */
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.score-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dial{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#e8ecf4 0);position:relative}
.dial::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.dial .v{position:relative;text-align:center;line-height:1.15}
.dial .v b{font-size:36px;font-variant-numeric:tabular-nums}
.dial .v span{display:block;font-size:12px;color:var(--sub)}
.score-facts{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.fact span{font-size:11.5px;color:var(--sub);display:block}
.fact b{font-size:19px;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--brand-soft);border:1px solid #c9dcfb;font-size:14px;line-height:1.75}
table.mods{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
table.mods th,table.mods td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right}
table.mods th:first-child,table.mods td:first-child{text-align:left}
table.mods thead th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:700}
table.mods tbody tr:hover{background:#fafbfe}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.modchart{margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.mlab{width:104px;flex:none;color:#344054;text-align:right}
.mtrack{flex:1;height:12px;border-radius:99px;background:#eef1f6;overflow:hidden}
.mfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12925a,#3fbf85)}
.mval{width:86px;flex:none;color:#667085;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mlab{width:74px;font-size:12px}.mval{width:70px;font-size:12px}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:99;padding:20px}
.mask.on{display:grid}
.dialog{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:.5em 0}
.dialog .rows{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:flex;align-items:center;gap:10px;font-size:14px}
.dialog .row label{color:var(--sub);min-width:78px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#101828;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;bottom:36px}
.hidden{display:none!important}
.imgmiss{display:inline-block;padding:2px 9px;border:1px dashed #d0a24a;background:#fdf6e3;border-radius:6px;font-size:12px;color:#8a6414}
.cell.multi{background:#f3ecff;border-color:#c9b6f0;color:#6b3fd4}
.tag.warn{background:#fdf1d6;color:#8a6414}
.note{margin:10px 0 12px;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
.note.src{background:#eef4ff;border-color:#c3d5f5;color:#2b4a7d}
.missnote{margin:6px 0;padding:8px 12px;border-radius:9px;background:#fdf6e3;border:1px dashed #e5c67f;font-size:12.5px;color:#7a5a10}
@media print{.topbar,.side,.bottombar,.mask{display:none!important}.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">行测真题模拟考场<small>离线版 · 真题来源于公开题库整理</small></div>
    <div class="spacer"></div>
    <div class="selbox" id="paperPick"></div>
    <div class="timer" id="timerBox">
      <div>
        <div class="lab">剩余时间</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <button class="btn" id="pauseBtn" style="background:#2a3444;border-color:#3b4759;color:#fff;padding:5px 10px">暂停</button>
    </div>
    <button class="btn primary" id="submitBtn">交卷并评分</button>
    <button class="btn" id="settingsBtn">设置</button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side">
    <h3>答题卡</h3>
    <div class="grid" id="card"></div>
    <div class="legend">
      <span><i style="background:#fff"></i>未答</span>
      <span><i style="background:#dbe7fb"></i>已答</span>
      <span><i style="background:#e6f6ee;border-color:#7fcfa8"></i>正确</span>
      <span><i style="background:#f3ecff;border-color:#c9b6f0"></i>漏选</span>
      <span><i style="background:#fdecea;border-color:#eda9a3"></i>错误</span>
    </div>
    <h3 style="margin-top:16px">作答进度</h3>
    <div id="modProgress" style="font-size:12.5px;color:#475467;line-height:1.9"></div>
  </aside>
</div>

<div class="bottombar">
  <div class="inner">
    <div class="stat">已答 <b id="doneN">0</b> / <b id="allN">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stat" id="scoreLive"></div>
    <button class="btn" id="cardBtn">答题卡</button>
    <button class="btn" id="retryBtn">重做本卷</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>
<div class="toast" id="toast"></div>

<script>
window.__EXAM__={imgBase:"../../img/"};window.__EXAM__={generated:"",imgBase:"",papers:[{"slug":"2022-重庆","title":"2022年重庆市公务员录用考试《行测》题（网友回忆版）","year":"2022","group":"重庆","modules":[{"label":"政治理论","items":[{"type":"question","qid":"5102128","cat":"时事政治","stem":"中国共产党十九届六中全会决定，党的二十大将于2022年下半年在北京召开。下列有关党的二十大的说法正确的有几项：\n①党的二十大，是我们党进入全面建设社会主义现代化国家、向第二个百年奋斗目标进军新征程的重要时刻召开的一次十分重要的代表大会\n②代表产生程序的5个主要环节是：推荐提名、组织考察、确定代表候选人初步人选、确定代表候选人预备人选、会议选举\n③党的二十大代表的选举要严格资格条件，坚持把政治标准放在首位\n④党的二十大代表名额共2300名，与十九大时相同","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查政治常识。\n①正确，中国共产党第十九届中央委员会第六次全体会议公报指出：“全会决定，中国共产党第二十次全国代表大会于2022年下半年在北京召开。全会认为，党的二十大是我们党进入全面建设社会主义现代化国家、向第二个百年奋斗目标进军新征程的重要时刻召开的一次十分重要的代表大会，是党和国家政治生活中的一件大事。”\n②正确，二十大代表的产生，要坚持和加强党的全面领导，充分发扬党内民主，采取自下而上、上下结合、反复酝酿、逐级遴选的办法进行。代表产生程序有5个主要环节，即推荐提名、组织考察、确定代表候选人初步人选、确定代表候选人预备人选、会议选举。\n③正确，党中央提出，二十大代表应是共产党员中的优秀分子。要严把人选政治关，坚持把政治标准放在首位，突出考察人选的理想信念、政治品格和道德修养，着重了解人选政治判断力、政治领悟力、政治执行力，增强“四个意识”、坚定“四个自信”、做到“两个维护”等方面的表现情况，对政治上不合格的一票否决。\n④正确，中央组织部负责人就做好二十大代表选举工作接受采访时表示，党中央明确，二十大代表名额共2300名，与十九大时相同。二十大代表名额的分配，主要根据党组织数量和党员人数确定，同时考虑前几次党的全国代表大会代表名额等因素。按照这一分配办法，各选举单位的代表名额，与十九大时基本相同。\n故①②③④说法正确。\n故正确答案为D。","no":1,"missingImage":false},{"type":"question","qid":"5102123","cat":"新思想","stem":"2022年3月，习近平总书记在看望参加政协会议的社会福利和社会保障界委员时强调，要在推动社会保障事业高质量发展上持续用力，织密社会保障安全网，为人民生活安康托底。下列做法有助于推动社会保障事业高质量发展的有几项：\n①加大对因疫因灾遇困群众的临时救助力度\n②保障流浪乞讨人员人身安全和基本生活，关心关爱精神障碍人员\n③健全灵活就业人员社保制度，扩大失业、工伤、生育保险的覆盖面\n④健全社会保障基金监管体系，严厉打击欺诈骗保、套保和挪用贪占各类社会保障资金的违法行为","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"D","explanation":"本题考查政治常识。\n①②正确，习近平总书记强调：“要加大对因疫因灾遇困群众的临时救助力度，做好残疾人康复、教育、就业等工作，保障流浪乞讨人员人身安全和基本生活，关心关爱精神障碍人员，坚决杜绝欺凌虐待妇女儿童、老年人、残疾人等违法行为。”\n③④正确，习近平总书记强调：“我国已建成世界上规模最大的社会保障体系。要健全灵活就业人员社保制度，扩大失业、工伤、生育保险的覆盖面，实现制度安排更加公平，覆盖范围更加广泛，为人民生活安康托底。要健全社会保障基金监管体系，严厉打击欺诈骗保、套保和挪用贪占各类社会保障资金的违法行为，守护好人民群众的每一分‘养老钱’、‘保命钱’。”\n综上所述，有助于推动社会保障事业高质量发展的有①②③④，有4项。\n故正确答案为D。","no":2,"missingImage":false},{"type":"question","qid":"5102121","cat":"新思想","stem":"2022年5月10日，习近平总书记在庆祝中国共产主义青年团成立100周年大会上发表重要讲话，激励广大青年团员在实现中华民族伟大复兴中国梦的新征程上奋勇前进。下列有关中国共产主义青年团表述不正确的是：","options":{"A":"团的地方组织和基层组织同时受同级党委和团的上级组织领导","B":"中国共产主义青年团受中国共产党的委托领导中国少年先锋队的工作","C":"团旗上环绕黄色五角星周围的黄色圆圈，象征中国青年一代紧密团结在中国共产党周围","D":"团员在加入共产党后或年满二十八周岁、没有在团内担任职务的情况下，不再保留团籍"},"answer":"D","explanation":"本题考查政治常识。\nA项正确，《中国共产主义青年团章程》总则规定：“中国共产主义青年团中央委员会受中国共产党中央委员会领导，团的地方组织和基层组织受同级党的委员会领导，同时受团的上级组织领导。”\nB项正确，《中国共产主义青年团章程》总则规定：“中国共产主义青年团受中国共产党的委托领导中国少年先锋队的工作。中国共产主义青年团是中华全国青年联合会的核心团体会员，发挥主导作用。中国共产主义青年团在中国共产党的领导下，指导中华全国学生联合会开展工作。”\nC项正确，《中国共产主义青年团章程》第八章“团旗、团徽、团歌”中的第三十七条规定：“中国共产主义青年团团旗旗面为红色，象征革命胜利；左上角缀黄色五角星，周围环绕黄色圆圈，象征中国青年一代紧密团结在中国共产党周围。”\nD项错误，《中国共产主义青年团章程》第一章“团员”中的第一条第三款规定：“团员加入共产党以后仍保留团籍，年满二十八周岁，没有在团内担任职务，不再保留团籍。”\n本题为选非题，故正确答案为D。","no":3,"missingImage":false},{"type":"question","qid":"5102129","cat":"新思想","stem":"习近平总书记以统揽全局的战略思维和宽广的世界眼光深刻把握国家安全问题，提出了总体国家安全观。下列相关表述正确的有几项：\n①总体国家安全观是我党历史上第一个被确立为国家安全工作指导思想的重大战略思想\n②《中华人民共和国国家安全法》规定，每年5月15日为全民国家安全教育日\n③总体国家安全观主要聚焦于如何解决好大国发展进程中面临的共性安全问题\n④国家安全机关举报受理电话为12339","options":{"A":"1项","B":"2项","C":"3项","D":"4项"},"answer":"B","explanation":"本题考查政治常识。\n①正确，《总体国家安全观学习纲要》中明确提出：“总体国家安全观是我们党历史上第一个被确立为国家安全工作指导思想的重大战略思想，是中国共产党和中国人民捍卫国家主权、安全、发展利益百年奋斗实践经验和集体智慧的结晶，是马克思主义国家安全理论中国化的最新成果，是习近平新时代中国特色社会主义思想的重要组成部分，是新时代国家安全工作的根本遵循和行动指南。”\n②错误，《中华人民共和国国家安全法》第一章“总则”第十四条规定：“每年4月15日为全民国家安全教育日。”\n③错误，总体国家安全观从坚持和发展中国特色社会主义的战略高度，系统回答了中国特色社会主义进入新时代，如何既解决好大国发展进程中面临的共性安全问题，同时又处理好中华民族伟大复兴关键阶段面临的特殊安全问题这个重大时代课题，是一个系统完整的科学理论体系，内涵丰富、博大精深，涉及治党治国治军等各个方面，标志着我们党对国家安全基本规律的认识达到了新高度。故不仅是关注“大国发展进程中面临的共性安全问题”，同时也要关注“中华民族伟大复兴关键阶段面临的特殊安全问题”。\n④正确，12339是国家安全机关受理公民和组织举报电话，这条热线是由国家安全部设立的，为了方便公民和组织向国家安全机关举报间谍行为或线索。\n综上，①④正确，②③错误。\n故正确答案为B。","no":4,"missingImage":false},{"type":"question","qid":"5102126","cat":"新思想","stem":"习近平总书记强调，必须深化对新的时代条件下我国各类资本及其作用的认识，规范和引导资本健康发展，发挥其作为重要生产要素的积极作用。下列对资本的认识不准确的是（    ）。","options":{"A":"在社会主义市场经济体制下，资本是带动各类生产要素集聚配置的重要纽带","B":"资本具有逐利本性，如不加以规范和约束，就会给经济社会发展带来不可估量的危害","C":"要加强资本领域反腐败，保持反腐败高压态势，坚决打击以权力为依托的资本逐利行为","D":"要正确处理资本和利益分配问题，既注重维护按劳分配的主体地位，更注重保障资本参与社会分配获得增殖和发展"},"answer":"D","explanation":"本题考查政治常识。\n2022年4月29日，中共中央总书记习近平就依法规范和引导我国资本健康发展进行第三十八次集体学习时发表重要讲话。\nA、B两项正确，习近平总书记在讲话中指出：“要历史地、发展地、辩证地认识和把握我国社会存在的各类资本及其作用。在社会主义市场经济体制下，资本是带动各类生产要素集聚配置的重要纽带，是促进社会生产力发展的重要力量，要发挥资本促进社会生产力发展的积极作用。同时，必须认识到，资本具有逐利本性，如不加以规范和约束，就会给经济社会发展带来不可估量的危害。”\nC项正确，习近平总书记在讲话中指出：“要加强资本领域反腐败，保持反腐败高压态势，坚决打击以权力为依托的资本逐利行为，着力查处资本无序扩张、平台垄断等背后的腐败行为。”\nD项错误，习近平总书记在讲话中指出：“要正确处理资本和利益分配问题。我国社会主义的国家性质决定了我们必须坚持按劳分配为主体、多种分配方式并存，在社会分配中体现人民至上。要注重经济发展的普惠性和初次分配的公平性，既注重保障资本参与社会分配获得增殖和发展，更注重维护按劳分配的主体地位，坚持发展为了人民、发展依靠人民、发展成果由人民共享，坚定不移走全体人民共同富裕的道路。”\n本题为选非题，故正确答案为D。","no":5,"missingImage":false},{"type":"question","qid":"5102125","cat":"时事政治","stem":"2022年，按照以习近平同志为核心的党中央的部署要求，为稳定宏观经济大盘，稳定上亿市场主体，各部门多措并举优化和落实助企纾困政策，为经济平稳运行提供有力支撑。下列属于“稳主体”对策的是：\n①实施大规模留抵退税政策\n②对特困行业实行阶段性缓缴养老保险费\n③中国人民银行宣布下调金融机构存款准备金率\n④设立3岁以下婴幼儿照护个人所得税专项附加扣除\n⑤央行、银保监会发布个人首套房商贷利率下限调整","options":{"A":"2项","B":"3项","C":"4项","D":"5项"},"answer":"C","explanation":"本题考查经济常识。\n市场主体是经济的力量载体，保市场主体就是保社会生产力。\n①正确，2022年3月21日，国务院总理李克强主持召开国务院常务会议，确定实施大规模增值税留抵退税的政策安排，为稳定宏观经济大盘提供强力支撑。\n②正确，2022年4月6日，国务院总理李克强主持召开国务院常务会议，决定对特困行业实行阶段性缓缴养老保险费政策，加大失业保险支持稳岗和培训力度；部署适时运用货币政策工具，更加有效支持实体经济发展。\n③正确，为支持实体经济发展，促进综合融资成本稳中有降，中国人民银行决定于2022年4月25日下调金融机构存款准备金率0.25个百分点（不含已执行5%存款准备金率的金融机构），为加大对小微企业和“三农”的支持力度，对没有跨省经营的城商行和存款准备金率高于5%的农商行，在下调存款准备金率0.25个百分点的基础上，再额外多降0.25个百分点。\n④错误，为贯彻落实《中共中央 国务院关于优化生育政策促进人口长期均衡发展的决定》，依据《中华人民共和国个人所得税法》有关规定，国务院决定，设立3岁以下婴幼儿照护个人所得税专项附加扣除。自2022年1月1日起，纳税人照护3岁以下婴幼儿子女的相关支出，在计算缴纳个人所得税前，按照每个婴幼儿每月1000元的标准定额扣除。该项扣除政策有利于减轻人民群众抚养子女负担，体现了国家对人民群众生育养育的鼓励和照顾。属于“保民生”的措施。\n⑤正确，2022年5月15日，央行、银保监会联合发布《关于调整差别化住房信贷政策有关问题的通知》，对于贷款购买普通自住房的居民家庭，首套住房商业性个人住房贷款利率下限调整为不低于相应期限贷款市场报价利率（LPR）减20个基点，二套住房商业性个人住房贷款利率政策下限按现行规定执行。此举对稳定市场预期将起到积极作用，有利于进一步满足刚性和改善性住房需求，促进房地产市场平稳健康发展。\n综上所述，属于“稳主体”对策的是①②③⑤，共4项。\n故正确答案为C。","no":6,"missingImage":false},{"type":"question","qid":"5102120","cat":"时事政治","stem":"根据十三届全国人大五次会议审议通过的《政府工作报告》，下列属于2022年我国经济发展主要预期目标的是：\n①居民消费价格涨幅3%左右\n②实现高水平科技自立自强\n③国内生产总值增长6.5%左右\n④粮食产量保持在1.3万亿斤以上\n⑤坚持政府过紧日子，更好节用裕民\n⑥居民收入增长与经济增长基本同步","options":{"A":"①③④","B":"①④⑥","C":"②③④","D":"②⑤⑥"},"answer":"B","explanation":"本题考查政治常识。\n①④⑥正确，③错误，2022年《政府工作报告》中“二、2022年经济社会发展总体要求和政策取向”指出：“今年发展主要预期目标是：国内生产总值增长5.5%左右；城镇新增就业1100万人以上，城镇调查失业率全年控制在5.5%以内；居民消费价格涨幅3%左右；居民收入增长与经济增长基本同步；进出口保稳提质，国际收支基本平衡；粮食产量保持在1.3万亿斤以上；生态环境质量持续改善，主要污染物排放量继续下降；能耗强度目标在‘十四五’规划期内统筹考核，并留有适当弹性，新增可再生能源和原料用能不纳入能源消费总量控制。”\n②错误，2021年习近平在中国科学院第二十次院士大会、中国工程院第十五次院士大会和中国科学技术协会第十次全国代表大会上指出：“实践证明，我国自主创新事业是大有可为的！我国广大科技工作者是大有作为的！我国广大科技工作者要以与时俱进的精神、革故鼎新的勇气、坚忍不拔的定力，面向世界科技前沿、面向经济主战场、面向国家重大需求、面向人民生命健康，把握大势、抢占先机，直面问题、迎难而上，肩负起时代赋予的重任，努力实现高水平科技自立自强！”\n⑤错误，2022年《政府工作报告》中“三、2022年政府工作任务”部分的“（一）着力稳定宏观经济大盘，保持经济运行在合理区间”指出：“要坚持政府过紧日子，更好节用裕民。大力优化支出结构，保障重点支出，严控一般性支出。盘活财政存量资金和闲置资产。”\n综上所述，属于2022年我国经济发展主要预期目标的是①④⑥。\n故正确答案为B。","no":7,"missingImage":false}],"count":7,"answerable":7,"pointsOf":10},{"label":"常识判断","items":[{"type":"question","qid":"5102122","cat":"人文常识","stem":"《中共中央 国务院关于加快建设全国统一大市场的意见》于2022年4月发布，提出从全局和战略高度加快建设全国统一大市场。下列做法符合建设全国统一大市场要求的是：","options":{"A":"统一产权交易信息发布机制，实现全国产权交易市场联通","B":"以集中管理代替市场机制，统一市场价格、商品供给和配给渠道","C":"严格落实“负面清单准入”管理模式，要求各地主管部门根据实际情况及时发布具有市场准入性质的负面清单","D":"指导各地区综合比较优势、资源环境承载能力、产业基础、防灾避险能力等因素，搞好“小而全”的自我小循环"},"answer":"A","explanation":"本题考查政治常识。\nA项正确，《中共中央 国务院关于加快建设全国统一大市场的意见》在“（九）完善市场信息交互渠道”部分指出：“统一产权交易信息发布机制，实现全国产权交易市场联通。优化行业公告公示等重要信息发布渠道，推动各领域市场公共信息互通共享。优化市场主体信息公示，便利市场主体信息互联互通。推进同类型及同目的信息认证平台统一接口建设，完善接口标准，促进市场信息流动和高效使用。依法公开市场主体、投资项目、产量、产能等信息，引导供需动态平衡。”\nB项错误，《中共中央 国务院关于加快建设全国统一大市场的意见》在“（二）工作原则”部分指出：“有效市场，有为政府。坚持市场化、法治化原则，充分发挥市场在资源配置中的决定性作用，更好发挥政府作用，强化竞争政策基础地位，加快转变政府职能，用足用好超大规模市场优势，让需求更好地引领优化供给，让供给更好地服务扩大需求，以统一大市场集聚资源、推动增长、激励创新、优化分工、促进竞争。”故不能用集中管理代替市场机制。\nC项错误，《中共中央 国务院关于加快建设全国统一大市场的意见》在“（五）实行统一的市场准入制度”部分指出：“严格落实‘全国一张清单’管理模式，严禁各地区各部门自行发布具有市场准入性质的负面清单，维护市场准入负面清单制度的统一性、严肃性、权威性。”\nD项错误，《中共中央 国务院关于加快建设全国统一大市场的意见》在“（二十四）破除地方保护和区域壁垒”部分指出：“指导各地区综合比较优势、资源环境承载能力、产业基础、防灾避险能力等因素，找准自身功能定位，力戒贪大求洋、低层次重复建设和过度同质竞争，不搞‘小而全’的自我小循环，更不能以‘内循环’的名义搞地区封锁。”\n故正确答案为A。","no":8,"missingImage":false},{"type":"question","qid":"5102143","cat":"科技常识","stem":"下列关于伟大科学工程的说法，正确的是：","options":{"A":"阿波罗计划：1961年在美国启动，尤里·加加林乘坐阿波罗1号宇宙飞船第一个登上月球表面","B":"中国863计划：1986年在中国启动，深海载人潜水器被列为该计划的研究专项之一","C":"人类基因组计划：1990年在法国启动，聚焦测定人染色体DNA序列，以破译遗传信息为目的","D":"人类脑计划：1997年在英国启动，以心理科学和信息科学研究为核心"},"answer":"B","explanation":"本题考查科技常识。\nA项错误，阿波罗计划为20世纪60-70年代美国实施的载人登月工程，“阿波罗”登月飞行从1961年启动。1969年7月16-24日，阿姆斯特朗作为“阿波罗”11号飞船指令长，完成人类首次登月飞行。\nB项正确，中国863计划是中国发展高技术及其产业的计划，全称国家高技术研究发展计划。因1986年3月王大珩、王淦昌、杨嘉墀、陈芳允四位科学家提出这个建议而得名，于1986年启动实施。2002年中国科技部将深海载人潜水器研制列为国家高技术研究发展计划（863计划）重大专项，启动“蛟龙号”载人深潜器的自行设计、自主集成研制工作。\nC项错误，人类基因组计划由美国科学家于1985年率先提出，1990年正式启动，于2000年完成了人类基因组“工作框架图”。其核心任务是要绘制出人类基因组的遗传图谱、物理图谱、转录图谱和序列图谱，最终测定出人类基因组DNA的全部核苷酸序列。\nD项错误，人类脑计划包括神经科学和信息科学这当今自然科学两大热点的相互结合研究，其核心内容是神经信息学。1997年人类脑计划在美国正式启动，美国20多家著名的大学和研究所参加了这个研究计划。\n故正确答案为B。","no":9,"missingImage":false},{"type":"question","qid":"5102119","cat":"科技常识","stem":"新时代需要继承发扬以国家民族命运为己任的爱国主义精神，更需要继承发扬以爱国主义为底色的科学家精神。在中华民族伟大复兴的征程上，一代又一代的科学家不畏艰难，勇攀高峰，无私奉献，为国家和人民做出了彪炳史册的重大贡献。下列科学家与其成就对应关系正确的是：\n①“两弹一星”元勋——于敏\n②北斗三号卫星首席总设计师——谢军\n③中国核潜艇第一任总设计师——赵忠尧\n④新中国飞机空气动力设计奠基人——顾诵芬\n⑤中国脊髓灰质炎疫苗研发生产拓荒者——汤飞凡","options":{"A":"①③④","B":"②③⑤","C":"①②④","D":"②④⑤"},"answer":"C","explanation":"本题考查政治常识。\n①项正确，于敏，核物理学家，中国“氢弹之父”，生于河北省宁河县（今天津市宁河区）。他在我国氢弹原理突破中解决了一系列基础问题，提出了从原理到构形基本完整的设想，起了关键作用。此后长期领导核武器理论研究、设计，解决了大量理论问题。对我国核武器进一步发展到国际先进水平做出了重要贡献。1982年于敏获国家自然科学奖一等奖。1985年、1987年和1989年三次获国家科技进步奖特等奖。1994年获求是基金杰出科学家奖。1999年被国家授予“两弹一星”功勋奖章。2019年9月17日，国家主席习近平签署主席令，授予于敏“共和国勋章”。\n②项正确，谢军，山西临汾人，中共党员，研究员，历任航天科技集团五院504所副所长、所长，北斗二号导航卫星总设计师。现任北斗三号工程副总设计师、北斗三号导航卫星首席总设计师，北斗卫星导航系统工程副总设计师。2020年12月，被国资委党委授予第五届“央企楷模”称号。2021年2月17日，谢军被评为“感动中国2020年度人物”。\n③项错误，彭士禄是中国核潜艇第一任总设计师，中国工程院首批及资深院士，被誉为“中国核潜艇之父”。赵忠尧，主要从事核物理研究，特别是硬g射线与物质相互作用等方面的研究，主持建成中国第一、二台质子静电加速器，为在国内建立核物理实验基地做出了重要贡献。\n④项正确，顾诵芬，江苏苏州人，飞机设计专家，中国自行设计、制造的高空高速歼击机的主要技术负责人之一，是新中国飞机空气动力设计奠基人。2021年11月3日上午，2020年度国家科学技术奖励大会在北京人民大会堂隆重召开。中国航空工业集团有限公司顾诵芬院士获国家最高科学技术奖。\n⑤项错误，顾方舟，我国著名病毒学家、脊髓灰质炎疫苗研发生产拓荒者，被称为“中国脊髓灰质炎疫苗之父”。汤飞凡，著名微生物学家、病毒学家，沙眼衣原体的发现人之一，长期从事微生物学、病毒学和免疫学的研究。\n综上所述，科学家与其成就对应关系正确的是①②④。\n故正确答案为C。","no":10,"missingImage":false},{"type":"question","qid":"5102310","cat":"人文常识","stem":"古代绘画艺术是中华文明的重要组成部分，下列有关说法正确的是：","options":{"A":"元代和明代画家常绘的《雪夜访戴图》取材于《幽明录》的记载","B":"本生故事画是敦煌壁画中的流行题材","C":"东晋著名画家顾恺之被誉为画圣","D":"《潇湘竹石图》是苏辙的名画"},"answer":"B","explanation":"本题考查人文常识。\nA项错误，中国传统绘画中，有许多描写传说故事的题材。比如历代画家都有不少《雪夜访戴图》，如元代张渥、明代周文靖等。这些画作是以东晋王徽之雪夜乘舟访问朋友戴逵的故事为创作背景。《雪夜访戴》出自《世说新语·任诞》，讲述王徽之雪夜访戴安道，未至而返，显示了他作为名士的潇洒自适。\nB项正确，本生故事画描绘释迦牟尼生前的各种善行，宣传“因果报应”“苦修行善”的生动故事。也是敦煌早期壁画中广泛流行的题材，如“萨捶那舍身饲虎”“尸毗王割肉救鸽”“九色鹿舍己救人”等。\nC项错误，吴道子（约680年—759年），又名道玄，唐代著名画家，后世尊称其为画圣。擅佛道、神鬼、人物、山水、鸟兽、草木、楼阁等，尤精于佛道、人物，长于壁画创作。顾恺之，东晋杰出画家、绘画理论家，精于人像、佛像、禽兽、山水等，世人称之为三绝：画绝、文绝和痴绝。\nD项错误，《潇湘竹石图》为北宋苏轼创作的绢本水墨画。采用长卷式构图，展现湖南省零陵县西潇、湘二水合流处，遥接洞庭巨浸的苍茫景色。整幅画作以潇湘二水的交汇点为中心，远山烟水，风雨瘦竹，近水与云水、蹲石与远山、筱竹与烟树产生强烈对比，让人在窄窄画幅内如阅千里江山。\n故正确答案为B。","no":11,"missingImage":false},{"type":"question","qid":"5102132","cat":"经济常识","stem":"下列关于金融产品的说法正确的是：","options":{"A":"金融产品价格波动属于信用风险","B":"在开放基金中风险最低的是混合型基金","C":"存款保险制度的保障范围不包括银行自营的理财产品","D":"金融产品的风险由大到小排序：金融债券＞股票＞储蓄产品"},"answer":"C","explanation":"本题考查经济常识。\nA项错误，信用风险又称违约风险，是指借款人、证券发行人或交易对方因种种原因，不愿或无力履行合同条件而构成违约，致使银行、投资者或交易对方遭受损失的可能性。因此，金融产品价格波动不属于信用风险。\nB项错误，人们将开放式基金分为四种基本类型：股票型基金、混合型基金、债券型基金、货币型基金。混合型基金指同时投资于股票、债券和货币市场等工具，没有明确投资方向的基金。而货币型基金主要投资于货币市场的基金，相对来说，它的风险是最低的。\nC项正确，存款保险主要保障的是储蓄存款，如果存款保险成员机构发生经营危机，或者面临破产倒闭，那么存款保险就可以为该成员机构提供财务方面的救助，或者直接向存款人支付部分或全部的存款，从而保障存款人的相关权益。但是银行自营的理财产品并不属于储蓄存款，因此是不属于存款保险制度的保障范围之内的。\nD项错误，金融债券是由银行和非银行金融机构发行的债券。从收益方面看，债券在购买之前，利率已定，到期就可以获得固定利息，而不用管发行债券的公司经营获利与否；股票一般在购买之前不定股息率，股息收入随股份公司的盈利情况变动而变动，盈利多就多得，盈利少就少得，无盈利不得。从本金方面看，债券到期可回收本金，也就是说连本带利都能得到，如同放债一样；股票则无到期之说。股票本金一旦交给公司，就不能再收回，只要公司存在，就永远归公司支配。公司一旦破产，还要看公司剩余资产清盘状况，那时甚至连本金都会蚀尽，所以债券的风险性小于股票。储蓄产品是指银行推出的存钱产品，风险是最低的。因此，风险由大到小排序：股票＞金融债券＞储蓄产品。\n故正确答案为C。","no":12,"missingImage":false},{"type":"question","qid":"5102141","cat":"科技常识","stem":"某品牌果汁饮料的配料表为：水、橙浓缩汁、木糖醇、山梨酸、维生素C、羧甲基纤维素钠、黄原胶、姜黄、食用香精。下列关于该饮料中配料所对应的作用类型错误的是：","options":{"A":"姜黄——色素","B":"山梨酸——酸度调节剂","C":"维生素C——抗氧化剂","D":"木糖醇——甜味剂"},"answer":"B","explanation":"本题考查科技常识。\nA项正确，姜黄素是一种天然化合物，具有良好的抗炎和抗癌特性。姜黄素是从姜科、天南星科中的一些植物的根茎中提取的一种二酮类化合物，其中，姜黄中约含姜黄素3%～6%，是植物界很稀少的具有二酮结构的色素。\nB项错误，山梨酸，又称为清凉茶酸、2,4-己二烯酸、2-丙烯基丙烯酸，是一种食品添加剂。山梨酸和山梨酸钾是国际上应用最广的防腐剂，具有较高的抗菌性能，抑制霉菌的生长繁殖，通过抑制微生物体内的脱氢酶系统，达到抑制微生物的生长和起防腐作用。酸度调节剂亦称pH调节剂，是用以维持或改变食品酸碱度的物质。规定允许使用的酸度调节剂有柠檬酸、柠檬酸钾、乳酸、酒石酸等。\nC项正确，抗氧化剂是指能防止或延缓食品氧化，提高食品的稳定性和延长贮存期的食品添加剂。维生素C具有很强的还原性，是高效抗氧化剂。\nD项正确，甜味剂是指能赋予软饮料甜味的食品添加剂。木糖醇是一种有机化合物，是从白桦树、橡树、玉米芯、甘蔗渣等植物原料中提取出来的一种天然甜味剂。\n本题为选非题，故正确答案为B。","no":13,"missingImage":false},{"type":"question","qid":"5102133","cat":"人文常识","stem":"传统的光刻技术中，镜头与光刻胶之间的介质是空气，而浸入式技术是将空气介质换成液体，得到合适波长的光，以提高成像分辨率，以下说法错误的是：","options":{"A":"液体局部温度起伏会引起成像质量恶化","B":"为了减少液体对光线的吸收，液层厚度不能太大","C":"以纯水为介质时，可以选取任意波长紫外光为光源","D":"可以注入高折射率的液体以得到更高频率的光，提高成像分辨率"},"answer":"C","explanation":"本题考查科技常识。\nA项正确，液体温度的变化将引起折射率的改变。如果液体温度变化不均匀，会导致像面聚焦偏移和球差的改变。在曝光系统中，焦面的偏移可由调焦调平系统校正，然而局部的温度起伏将引起局部的成像质量恶化。\nB项正确，光刻机的生产率与照明光的透射率成正比，因此为了减小液体对光线的吸收，液体层的厚度不能太大。\nC项错误，在光的大多数波段水的折射率为1.33左右，而在193nm附近，水的折射率高达1.437，因此为满足高折射率和高透射系数的要求，应使用水作为193nm附近光刻的浸没液体，不能任意选择波长。\nD项正确，浸入式技术利用光通过液体介质后光源波长缩短来提高分辨率，其缩短的倍率即为液体介质的折射率。因此，折射率越高的液体就可以得到波长更短的光，提高成像分辨率。【备注：本题D项说法不严谨，注入高折射率的液体改变的应是光的波长，而非频率。】\n本题为选非题，故正确答案为C。","no":14,"missingImage":false},{"type":"question","qid":"5102325","cat":"法律常识","stem":"根据《中华人民共和国监察官法》，下列关于监察官回避制度的说法错误的是：","options":{"A":"张某担任某设区的市监察委员会副主任，应当实行地域回避","B":"王某和李某都是监察官，二人系夫妻关系，不能被派驻到同一高校","C":"赵某一和赵某二系亲兄弟，可以同时担任某县监察委员会不同部门的监察官","D":"黄某担任某设区的市监察委员会副主任，其子不得担任该市下辖的县监察委员会委员"},"answer":"A","explanation":"本题考查法律常识。\nA项错误，根据《中华人民共和国监察官法》第二十三条规定：“监察官担任县级、设区的市级监察委员会主任的，应当按照有关规定实行地域回避。”故副主任无需实行地域回避。\nB、C、D三项正确，根据《中华人民共和国监察官法》第二十四条规定：“监察官之间有夫妻关系、直系血亲关系、三代以内旁系血亲以及近姻亲关系的，不得同时担任下列职务：（一）同一监察委员会的主任、副主任、委员，上述人员和其他监察官；（二）监察委员会机关同一部门的监察官；（三）同一派驻机构、派出机构或者其他监察机构的监察官；（四）上下相邻两级监察委员会的主任、副主任、委员。”B项中，王某和李某系夫妻关系，根据上述第（三）项规定不得派驻到同一高校，说法正确。C项中，赵某一和赵某二系亲兄弟，根据上述第（二）项规定，不得担任同一部门的监察官，但可以担任不同部门的监察官，说法正确。D项中，根据上述第（四）项规定，黄某之子不得担任其任职的监察委员会的下一级监察委员会的委员，说法正确。\n本题为选非题，故正确答案为A。","no":15,"missingImage":false},{"type":"question","qid":"5102137","cat":"法律常识","stem":"某市为保护当地的湿地自然景观，制定颁布了《X市湿地保护办法》，禁止私自采掘、捕捞、打猎等行为。张某闲来无事，前往湿地景区游玩，看到两只受伤野鸭便顺手捡起，准备带回家去。在回家路上，张某携带的野鸭被正在巡逻的警察发现，警察依据《X市湿地保护办法》对其处以1000元罚款。张某不服，欲提起行政诉讼，下列说法错误的是：","options":{"A":"张某可以就罚款决定提起诉讼","B":"张某认为《X市湿地保护办法》违背上位法规定，可以只就其合法性提起诉讼","C":"张某可以提供行政行为违法的证据，提供的证据不成立的，不免除公安机关的举证责任","D":"公安机关对作出的行政行为负有举证责任，应当提供作出该行政行为的证据和所依据的规范性文件"},"answer":"B","explanation":"本题考查法律常识。\nA项正确，根据《中华人民共和国行政诉讼法》第十二条第一款第一项规定：“人民法院受理公民、法人或者其他组织提起的下列诉讼：（一）对行政拘留、暂扣或者吊销许可证和执照、责令停产停业、没收违法所得、没收非法财物、罚款、警告等行政处罚不服的；”\nB项错误，根据《中华人民共和国行政诉讼法》第十三条第二项规定：“人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：（二）行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令；”题中，《X市湿地保护办法》属于规章或行政机关制定、发布的具有普遍约束力的决定、命令，不得对其提起行政诉讼。\nC项正确，根据《中华人民共和国行政诉讼法》第三十七条规定：“原告可以提供证明行政行为违法的证据。原告提供的证据不成立的，不免除被告的举证责任。”\nD项正确，根据《中华人民共和国行政诉讼法》第三十四条第一款规定：“被告对作出的行政行为负有举证责任，应当提供作出该行政行为的证据和所依据的规范性文件。”\n本题为选非题，故正确答案为B。","no":16,"missingImage":false},{"type":"question","qid":"5102144","cat":"人文常识","stem":"下列诗句与其描述的乐器对应错误的一项是：","options":{"A":"昆山玉碎凤凰叫，芙蓉泣露香兰笑——箜篌","B":"幽音变调忽飘洒，长风吹林雨堕瓦——笛子","C":"弦凝指咽声停处，别有深情一万重——古筝","D":"间关莺语花底滑，幽咽泉流冰下难——琵琶"},"answer":"B","explanation":"本题考查人文常识。\nA项正确，诗句出自唐代李贺的《李凭箜篌引》，意思是乐声清脆动听得就像昆仑山美玉击碎，凤凰鸣叫；时而使芙蓉在露水中饮泣，时而使香兰开怀欢笑。描写的乐器是箜篌。\nB项错误，诗句出自唐代李颀的《听董大弹胡笳声兼寄语弄房给事》，意思是幽咽琴声忽转轻松潇洒，像大风吹林如大雨落瓦。“胡笳声”，也就是《胡笳弄》，是按胡笳声调翻为琴曲。描写的乐器为古琴。\nC项正确，诗句出自唐代白居易的《夜筝》，意思是忽然，弦声凝绝、柔指轻顿，那片刻的宁静又诉说出千万重的深情。描写的乐器是古筝。\nD项正确，诗句出自唐代白居易的《琵琶行》，意思是一会儿像黄鹂在花下啼鸣婉转流利，一会儿又像泉水在冰下流动滞涩不畅。好像冰泉冷涩琵琶声开始凝结，凝结而不通畅声音渐渐地中断。描写的乐器是琵琶。\n本题为选非题，故正确答案为B。","no":17,"missingImage":false},{"type":"question","qid":"5102136","cat":"人文常识","stem":"乒乓球运动员在比赛中运用上旋打法进攻，在击球的过程中通过带有向上提拉的动作，打出上旋球，下列关于上旋球说法错误的是：","options":{"A":"球体上表面相对空气的旋转速度大，下表面相对空气的旋转速度小","B":"球体上方气体压强比球体下方大，上旋球下坠速度比正常快","C":"乒乓球转速越大，上下表面压强差就越大，下坠得就越快","D":"球体旋转向前飞行，上表面向前转动，下表面向后转动"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，上旋球的运动方向和自转方向一样，球向前运动，由于空气具有一定的粘滞性，当乒乓球向前转动时，空气就与球的上表面产生摩擦，就会导致球体上表面相对空气的旋转速度小，下表面相对空气的旋转速度大。\nB项正确，由于球体的上表面相对空气的旋转速度小，下表面相对空气的旋转速度大，根据伯努利原理，流速大的地方压强小，所以下表面受的气体压强小，故上旋球下坠速度比正常快。\nC项正确，当乒乓球转速越大，上表面的空气流动速度和下表面的空气流动速度差就越大，上下表面压强差就越大，所以下坠得就越快。\nD项正确，上旋球的运动方向和自转方向一样，球向前运动，上表面是向前转动，下表面是向后转动。\n本题为选非题，故正确答案为A。","no":18,"missingImage":false},{"type":"question","qid":"5102139","cat":"科技常识","stem":"关于下列诗句均描述了一种生物学现象，对其解释错误的是：","options":{"A":"“儿童急走追黄蝶，飞入菜花无处寻”体现动物的拟态","B":"“春色满园关不住，一枝红杏出墙来”体现植物的向光性","C":"“落红不是无情物，化作春泥更护花”体现微生物的分解作用","D":"“人间四月芳菲尽，山寺桃花始盛开”体现植物开花受温度影响"},"answer":"A","explanation":"本题考查科技常识。\nA项错误，“儿童急走追黄蝶，飞入菜花无处寻”意为小孩子奔跑着追赶黄蝴蝶，可是蝴蝶飞入菜花丛中就再也找不到了。动物的保护色是指动物把体表的颜色改变为与周围环境相似，这种颜色叫保护色。黄蝶飞入菜花丛中就再也找不到了体现的是动物的保护色。拟态是一种生物模拟另一种生物或模拟环境中的其他物体从而获得好处的现象，一般拟态是属于静止的，而保护色与运动状态无关。\nB项正确，“春色满园关不住，一枝红杏出墙来”意为满园子的春色是关不住的，开得正旺的红杏有一枝枝条伸到墙外来了。植物的向光性是指植物生长器官受单方向光照射而引起生长弯曲的现象，对高等植物而言，向光性主要指植物地上部分茎叶的正向光性。正向光性运动与生长素分布有关，光线能使生长素在背光一侧比向光一侧分布多，因此，背光侧比向光侧生长得快，使植物的茎显示出向光性。“红杏出墙”是因为红杏树枝条的向光性生长发生弯曲。\nC项正确，“落红不是无情物，化作春泥更护花”意为从枝头上掉下来的落花不是无情之物，会化作春天的泥土，培育春天的花朵生长。落花之所以会转化为春泥是微生物的分解作用，泥土中的微生物通过分解作用可以将落花中的有机物分解为简单的无机物，为土地提供养分，使自然界的物质得到循环利用。\nD项正确，“人间四月芳菲尽，山寺桃花始盛开”意为人间四月里百花凋零已尽，可是山寺之中，桃花却刚刚盛开。说明海拔高度升高温度下降，温度会影响植物的生长发育进程。\n本题为选非题，故正确答案为A。","no":19,"missingImage":false},{"type":"question","qid":"5102319","cat":"人文常识","stem":"丙烯酰胺被世界卫生组织列为2A级致癌物，即可疑致癌物。食品中的丙烯酰胺并不是人为添加到食物中，而是在烘焙或烹饪过程中产生的，下列烹饪手法中生成丙烯酰胺最少的是：","options":{"A":"干煸四季豆","B":"炸油条","C":"白灼虾","D":"炝炒白菜"},"answer":"C","explanation":"本题考查科技常识。\n丙烯酰胺的形成与食物加工烹调方式、温度、时间、水分等有关。丙烯酰胺主要在高碳水化合物、低蛋白质的植物性食物烹调过程中被加热到120\u003cimg data-k=\"b658c865c7d8\">\u003cimg data-k=\"a2ed70c2e19b\">以上时生成，140-180\u003cimg data-k=\"8afadf6ce3b2\">为生成的最佳温度；在加工温度较低，如用水煮时，丙烯酰胺的形成水平相当低。食物的水含量也是影响丙烯酰胺形成的重要因素，特别是烘烤、油炸食品最后阶段水分减少、表面温度升高后，其丙烯酰胺形成量更高。白灼虾是用水煮的方式烹调，与干煸四季豆、炸油条、炝炒白菜相比，丙烯酰胺的生成量最少。\n故正确答案为C。","no":20,"missingImage":false}],"count":13,"answerable":13,"pointsOf":10},{"label":"言语理解与表达","items":[{"type":"question","qid":"5102382","cat":"逻辑填空","stem":"中华传统节日的文化内涵蕴藏在人与自然、人与他人、人与自身的相处之道中，体现了中华民族的核心价值观念，而        其中的则是对“和”的追求。\n填入划横线部分最恰当的一项是：","options":{"A":"分列","B":"统贯","C":"包含","D":"纵横"},"answer":"B","explanation":"根据“中华传统节日的文化内涵蕴藏在人与自然、人与他人、人与自身的相处之道中”可知，横线处应体现出对“和”的追求贯穿始终之意，B项“统贯”指系统、条贯，可以体现“贯穿始终”之意，当选。\nA项“分列”指按照一项准则分级或分类，与文意无关，排除；\nC项“包含”指里边含有，无法体现“贯穿始终”之意，排除；\nD项“纵横”指竖横交错或奔驰无阻，文段未体现“交错”之意，排除。\n故正确答案为B。\n【文段出处】书籍《中国文艺评论》2021年第5期——《中华传统节日的文化内涵：基于人与自然、他者和自身关系视角的考察》","no":21,"missingImage":false},{"type":"question","qid":"5102183","cat":"逻辑填空","stem":"改革和法治如鸟之两翼、车之两轮。党的十八大以来，全面深化改革的一个鲜明特点，就是把法治贯穿于改革全过程，在法治下推进改革、在改革中完善法治，保证改革和法治相互促进、            。\n填入划横线部分最恰当的一项是：","options":{"A":"交相辉映","B":"相映成趣","C":"相得益彰","D":"相为表里"},"answer":"C","explanation":"横线处所填成语搭配“改革和法治”，根据横线前顿号可知，横线处所填成语与“相互促进”构成近义并列，表意相近。C项“相得益彰”指两个人或两件事物互相配合，双方的能力和作用更能显示出来，可以体现相互促进之意，当选。A项“交相辉映”指各种光亮、色彩等互相映照，多用于形容美好的景象，与“改革和法治”搭配不当，排除；B项“相映成趣”指相互衬托着，显得很有趣味，很有意思，D项“相为表里”即互为表象及内里，内外互相配合，共为一体，均无法体现促进之意，排除。\n故正确答案为C。\n【文段出处】人民日报《人民时评：让法治与改革相得益彰》","no":22,"missingImage":false},{"type":"question","qid":"5102384","cat":"逻辑填空","stem":"越来越多的美食纪录片或是以昂贵的摄影设备、高水准的镜头语言造就美食奇观，或是用            的体量形式、草根气息的真实味道成为下饭陪伴，又或以富含哲理的文案、食物背后的故事触发观众共情。\n填入划横线部分最恰当的一项是：","options":{"A":"长篇大论","B":"长篇累牍","C":"片言只语","D":"短小精悍"},"answer":"D","explanation":"搭配“体量形式”，且根据“成为下饭陪伴”可知，横线处应体现出美食纪录片的体量较小，形式较简单，能够陪伴一顿饭的时间就好。D项“短小精悍”形容人身躯短小，精明强悍，也形容文章或发言简短而有力，符合文意，当选。\nA项“长篇大论”指滔滔不绝的发言或篇幅冗长的文章，B项“长篇累牍”指篇幅很长，内容很多，均与文意相悖，排除；C项“片言只语”指零零碎碎的话语，侧重强调语言文字少，无法与“体量形式”搭配，且与“纪录片”对应不当，排除。\n故正确答案为D。\n【文段出处】北京青年报《&lt;亚洲食谈&gt;：八个国家的“饮食男女”》","no":23,"missingImage":false},{"type":"question","qid":"5102388","cat":"逻辑填空","stem":"无畏艰险、迎难而上，百折不挠、坚持到底，是中华民族生生不息、发展        的基因密码。陆军部队高度重视战斗精神        ，通过大项任务磨砺、军事斗争淬炼、日常作风培塑，锤炼“一不怕苦、二不怕死”的血性胆气，激励引导官兵敢于克服任何困难，勇于战胜一切敌人。\n依次填入划横线部分最恰当的一项是：","options":{"A":"强大 教育","B":"宏大 教导","C":"伟大 培育","D":"壮大 培育"},"answer":"D","explanation":"第一空，搭配“发展”，D项“壮大”指的是变得更加强大，“发展壮大”为惯用搭配，保留。A项“强大”指的是力量雄厚，常见搭配为“强大力量、强大动力”等，B项“宏大”指的是气势宏伟、巨大，常见搭配为“宏大场面、宏大目标”等，C项“伟大”指的是十分崇高卓越，常见搭配为“伟大精神、伟大梦想”等，均与“发展”搭配不当，排除。\n第二空，代入验证，根据后文“通过大项任务磨砺、军事斗争淬炼、日常作风培塑······”可知，陆军部队正是通过这一系列举措在培养部队的战斗精神，D项“培育”指的是培养使其发育成长，符合文意，当选。\n故正确答案为D。\n【文段出处】求是网《【求是之声】传承发扬“硬骨头精神”的英雄连队》","no":24,"missingImage":false},{"type":"question","qid":"5102213","cat":"逻辑填空","stem":"由我国自营勘探开发的首个1500米超深水大气田“深海一号”在海南岛东南陵水海域正式投产，标志着中国海洋石油勘探开发能力全面进入“超深水时代”，对保障国家能源安全、        能源结构转型升级和提升我国深海资源开发能力具有重要意义，建设海洋强国迈出了        的一步。\n依次填入划横线部分最恰当的一项是：","options":{"A":"促使 坚决","B":"推动 坚实","C":"鼓动 坚定","D":"提高 坚韧"},"answer":"B","explanation":"第一空，搭配“能源结构转型升级”，A项“促使”指推动某物或某事使达到一定目的，B项“推动”指使事物前进或发展，均与“能源结构转型升级”搭配恰当，保留。C项“鼓动”指以言语或行为使他人有所行动，多用于贬义语境，与文段感情色彩不符，排除；D项“提高”指使位置、程度、水平等方面比原来高，与“能源结构转型升级”搭配不当，排除。\n第二空，搭配“一步”，B项“坚实”指牢固结实，符合文意，且与“一步”搭配恰当，当选。A项“坚决”指意志坚定，毫不犹豫，多形容态度、主张等，与“一步”搭配不当，排除。\n故正确答案为B。\n【文段出处】光明网《“深海一号”，探寻超深海能源宝藏》","no":25,"missingImage":false},{"type":"question","qid":"5102211","cat":"逻辑填空","stem":"中国的全面小康，犹如一幅前后相续的长卷，有            的创业征程，有气壮山河的建设浪潮，有波澜壮阔的改革探索，也有拥抱世界的        襟怀。在这条路上，我们用几十年时间，走完了发达国家几百年走过的发展历程；我们用一百年的奋斗，实现了中华民族伟大复兴中国梦的关键一步。\n依次填入划横线部分最恰当的一项是：","options":{"A":"餐风宿露 开明","B":"筚路蓝缕 开放","C":"栉风沐雨 开朗","D":"艰苦卓绝 开拓"},"answer":"B","explanation":"第一空，搭配“创业征程”，且根据文意可知，横线处形容创业的艰难。B项“筚路蓝缕”形容创业的艰辛，C项“栉风沐雨”形容不避风雨，奔波劳碌，D项“艰苦卓绝”形容十分艰苦，极不平凡，均与“创业征程”搭配恰当，且均可体现创业的艰难，符合文意，保留。A项“餐风宿露”形容旅途劳累或野外生活艰苦，与“创业征程”搭配不当，排除。\n第二空，搭配“襟怀”，且根据“拥抱世界”可知，横线处应体现“对外发展”之意。B项“开放”指解除封锁、禁令、限制等，允许进入或利用，与“襟怀”搭配恰当，且符合文意，当选。C项“开朗”指开阔明朗或人性格豁达，乐观，D项“开拓”指开发、拓展，均与“襟怀”搭配不当，排除。\n故正确答案为B。\n【文段出处】人民日报《继往开来的世纪伟业——写在全面建成小康社会的历史时刻》","no":26,"missingImage":false},{"type":"question","qid":"5102259","cat":"逻辑填空","stem":"水流与冰川的        ，会碰撞出一个神奇的景观——冰川洞穴。冰岛的冰川洞穴更是一个独特存在，与世界其他地方的冰川洞穴相比，它们晶莹透明，极尽美妙。然而，在冰岛温和的海洋性气候和独特的地热环境下，它们几乎随时        ，这使每个镜头都成为唯一的瞬间。\n依次填入划横线部分最恰当的一项是：","options":{"A":"接触 消失","B":"会合 止息","C":"聚积 融化","D":"相遇 消融"},"answer":"D","explanation":"本题可从第二空入手，横线前“它们”指代前文冰岛的冰川洞穴，且由后文“这使每个镜头都成为唯一的瞬间”可知，冰川洞穴不会长久存在，C项“融化”指（冰、雪等）变成水，D项“消融”指（冰、雪）融化，均符合文意，保留。A项“消失”指（人或事物）逐渐减少以至没有，不复存在，B项“止息”指停止，均不能精准地对应“冰川洞穴”的特点，排除。\n第一空，根据“会碰撞出一个神奇的景观”可知，横线处所填词语要与“碰撞”相呼应，强调水流冰川相碰撞，D项“相遇”指遇见，碰到，符合文意，当选。C项“聚积”强调累积，经年累月，一点一滴地累积，而非二者相碰撞，不符合文意，排除。\n故正确答案为D。\n【文段出处】中国国家地理《冰岛冰洞 冰与水之歌》","no":27,"missingImage":false},{"type":"question","qid":"5102195","cat":"逻辑填空","stem":"升腾的火箭，        的是一个民族的飞天梦想，镌刻的是一个国家的前行脚步。从“嫦娥奔月”到“祝融驭火”，从“天和筑穹”到“墨子传信”，从“北斗联网”到“天舟穿梭”······中国航天向浩瀚宇宙的每一次进发，振奋的是越来越昂扬的精神和气概，        的是越来越厚重的自信和底气。\n依次填入划横线部分最恰当的一项是：","options":{"A":"承载 夯实","B":"记载 树立","C":"负载 牢固","D":"担负 增强"},"answer":"A","explanation":"第一空，横线前的对应主体为“火箭”，横线后需与“梦想”构成搭配。A项“承载”指承受、负载，与“梦想”搭配恰当，保留。B项“记载”指把事情写下来，与“火箭”搭配不当，排除；C项“负载”指机械设备以及生理组织等在单位时间内所担负的工作量，也指机件及建筑构件承受的重量，是名词，而横线处需填入动词与“梦想”搭配，故搭配不当，排除；D项“担负”指承当起责任、工作、费用等，与“梦想”搭配不当，排除。\n第二空，代入验证，搭配“自信”和“底气”，A项“夯实”指加固，填入文段表示中国航天给予我们充足的自信和底气，搭配得当，且符合文意，当选。\n故正确答案为A。\n【文段出处】人民网《为浩瀚太空留下更多中国身影》","no":28,"missingImage":false},{"type":"question","qid":"5102210","cat":"逻辑填空","stem":"脱贫攻坚精神是不断创造伟大奇迹的有力武器。贫穷是人类文明社会的顽疾，但贫穷不是不可改变的        ；贫穷不是社会主义，社会主义必须努力摆脱贫穷。脱贫攻坚伟大胜利成果来之不易，在脱贫攻坚这场与贫穷作斗争的硬仗中，党带领广大人民群众逢山开路、遇水搭桥、开拓创新，使贫困群众的生活状况、精神风貌发生了历史性变化，这场规模浩大的伟大斗争实现了            、载入史册的胜利。\n依次填入划横线部分最恰当的一项是：","options":{"A":"命运 叹为观止","B":"归宿 登峰造极","C":"使命 绝无仅有","D":"宿命 史无前例"},"answer":"D","explanation":"第一空，搭配“不可改变”，且形容“贫穷”，根据“贫穷是人类文明社会的顽疾”“贫穷不是社会主义，社会主义必须努力摆脱贫穷”可知，横线处要表达出贫穷是可以摆脱的事情，A项“命运”比喻事物发展变化的趋向及结局，D项“宿命”指生来注定的命运，均与“不可改变”搭配恰当，且符合文意，保留。B项“归宿”指人或事物最终的着落，文段中的贫穷属于目前存在的事情，与文意不符，排除；C项“使命”指派人办事的命令，多比喻重大的责任，贫穷并非是命令或责任，与文意不符，且“使命”多用于偏积极的语境，而“贫穷”偏消极，排除。\n第二空，根据“使贫困群众的生活状况、精神风貌发生了历史性变化”“载入史册的胜利”可知，横线处要体现出这场斗争的宏大和前所未有，D项“史无前例”指历史上从来没有过的事例，符合文意，当选。A项“叹为观止”指赞美所见的事情好到了极点，常见用法为“令人叹为观止”“让人叹为观止”，置于此处用法错误，排除。\n故正确答案为D。\n【文段出处】光明日报《赓续伟大的脱贫攻坚精神》","no":29,"missingImage":false},{"type":"question","qid":"5102389","cat":"逻辑填空","stem":"这款奥运比赛服，将国旗色与故宫传统色相结合，在色彩的渐变中，“飞龙”腾空而起，        在祥云瑞气之中，        吉祥如意的祝福与祈愿。\n依次填入划横线部分最恰当的一项是：","options":{"A":"掩护 包涵","B":"掩映 饱含","C":"掩藏 包容","D":"掩盖 包含"},"answer":"B","explanation":"第一空，横线处所填词语用以形容“飞龙”腾空而起，穿行于祥云瑞气之中的场景，B项“掩映”指彼此遮掩而互相衬托，时隐时现，符合文意，保留；A项“掩护”指用人体或其他掩护体挡住，C项“掩藏”指隐藏、藏匿，D项“掩盖”指隐藏，隐瞒，均与文意无关，排除。\n第二空，代入验证，横线处词语与“祝福与祈愿”搭配，B项“饱含”指满含，充满，置于此处搭配得当，符合文意，当选。\n故正确答案为B。\n【文段出处】人民资讯《比音勒芬携五星战袍Ⅱ 助力奥运健将在国际舞台上展现中国自信！》","no":30,"missingImage":false},{"type":"question","qid":"5102212","cat":"逻辑填空","stem":"文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。人类社会与文明的每一次        ，无不伴随着文化的历史性进步。纵览历史长河，无论是传统还是现代社会治理结构和治理体系中，文化发展无不         、推动着社会的发展和完善。\n依次填入划横线部分最恰当的一项是：","options":{"A":"跨越 滋补","B":"跃进 滋养","C":"变迁 滋润","D":"突破 滋生"},"answer":"B","explanation":"第一空，横线处搭配“人类社会与文明”，根据“无不伴随着文化的历史性进步”可知，横线处要体现人类社会与文明的进步之意。A项“跨越”指超过时期或地区之间的界限，B项“跃进”指跳着向前进，比喻极快地前进，D项“突破”指冲破或超过某个界限，均可体现出进步之意，符合文意，保留。C项“变迁”指事物缓慢逐渐变化转移，侧重强调变化而并不一定就是进步，与文意不符，排除。\n第二空，根据横线后顿号可知，横线处与“推动”构成近义并列，共同体现出“文化发展”对“社会的发展和完善”发挥的积极作用。B项“滋养”指供给养分，置于此处表示文化为社会的发展和完善提供养分，符合文意，当选。A项“滋补”指供给身体需要的养分，补养，常与“身体”搭配，与后文“社会的发展和完善”搭配不当，排除；D项“滋生”指繁殖，引起，产生，多用于消极语境，如滋生细菌、滋生腐败等，文段并非消极语境，排除。\n故正确答案为B。\n【文段出处】中国教育报《涵育向上而行的文化》","no":31,"missingImage":false},{"type":"question","qid":"5102253","cat":"逻辑填空","stem":"在斗争中诞生、在斗争中发展、在斗争中壮大，一百年来，不怕牺牲、英勇斗争的伟大精神贯穿于革命、建设、改革各个时期，        成我们党历经百年风雨而风华正茂、饱经磨难而            的精神基因。\n依次填入划横线部分最恰当的一项是：","options":{"A":"锤炼 永不言败","B":"锻造 百折不挠","C":"磨炼 九死不悔","D":"熔铸 生生不息"},"answer":"D","explanation":"第一空，搭配“精神基因”，且根据文意可知，横线处表达伟大精神要转变成内在的精神基因之意，B项“锻造”指一种金属加工方法，含有打造之意，D项“熔铸”指熔化并铸造，均符合文意，且与“精神基因”搭配恰当，保留。A项“锤炼”指锻炼，磨炼，常搭配“意志”“语言”等，C项“磨炼”指在艰难困苦的环境中锻炼，常搭配“本领”“才干”等，均与“精神基因”搭配不当，排除。\n第二空，搭配“精神基因”，根据文意可知，横线处表达历经磨难而精神基因一直存在之意，D项“生生不息”指事物不断地产生、发展，符合文意，当选。B项“百折不挠”指无论受多少挫折都不退缩，形容意志坚强，与文意无关，排除。\n故正确答案为D。\n【文段出处】南方日报《不怕牺牲 英勇斗争——三论伟大建党精神》","no":32,"missingImage":false},{"type":"question","qid":"5102215","cat":"逻辑填空","stem":"低碳转型是牵涉供应端和消费端全链条的        工程，不仅需要各行各业攻坚克难的决心，也需要我们每个人            的行动。夏天把空调温度调高一些，尽量购买节能型用品，积极参与义务植树活动，每个人都为地球的“凉热”出一份力。只有让低碳成为新风尚、新潮流，才能与技术革新形成合力。\n依次填入划横线部分最恰当的一项是：","options":{"A":"核心 事必躬亲","B":"系统 脚踏实地","C":"特殊 持之以恒","D":"浩大 厚积薄发"},"answer":"B","explanation":"第一空，根据“牵涉供应端和消费端全链条”以及“不仅需要······也需要······”可知，低碳转型是一个涉及方方面面的工程，故横线处应体现涉及范围广的含义，B项“系统”指有条理的、成体系的，D项“浩大”指规模巨大，均符合文意，保留。A项“核心”指中心，主要部分，C项“特殊”指与别的事物不同，文段强调的是涉及范围广，均与文意不符，排除。\n第二空，根据“夏天把空调温度调高一些，尽量购买节能型用品，积极参与义务植树活动，每个人都为地球的‘凉热’出一份力”可知，低碳行动需要我们每个人都付出切实的行动，B项“脚踏实地”比喻做事踏实认真，符合文意，当选。D项“厚积薄发”形容只有准备充分才能办好事情，文段强调每个人切实去做而非事先准备，与文意不符，排除。\n故正确答案为B。\n【文段出处】光明网《科技创新助力碳中和》","no":33,"missingImage":false},{"type":"question","qid":"5102191","cat":"逻辑填空","stem":"老字号，既是一种特色商贸品牌，也是民族传统文化的瑰宝。近年来，许多老字号通过        创新，积极扩大品牌影响力，不少“网红”老字号还“翻红”海外市场，收获了一批“海粉”。但老字号产品拓展海外市场之路并非            ，针对企业遇到的市场问题，政府部门应积极为企业纾困解难，助力老字号走出国门。\n依次填入划横线部分最恰当的一项是：","options":{"A":"持续 一帆风顺","B":"巧妙 无往不利","C":"推进 天从人愿","D":"全力 左右逢源"},"answer":"A","explanation":"本题可从第二空入手。“但”表转折，根据“积极扩大品牌影响力，不少‘网红’老字号还‘翻红’海外市场，收获了一批‘海粉’”和“针对企业遇到的市场问题，政府部门应积极为企业纾困解难，助力老字号走出国门”可知，横线所在句子表达老字号产品拓展海外市场之路遇到困难、发展不顺利的含义。A项“一帆风顺”比喻非常顺利，没有任何阻碍，B项“无往不利”指所到之处，没有不顺利的，与“并非”连用，均符合文意，保留。C项“天从人愿”指上天顺从人的意愿，事物的发展正合自己的心愿，文段重点强调老字号产品拓展海外市场的过程并不顺利，而非是否顺从个人的意愿，与文意不符，排除；D项“左右逢源”指做事得心应手，怎样进行都很顺利，也形容办事圆滑，置于此处与“老字号产品”搭配不当，排除。\n第一空，根据“积极扩大品牌影响力，不少‘网红’老字号还‘翻红’海外市场，收获了一批‘海粉’”可知，老字号通过不断创新的方式扩大影响力，开拓海外市场。A项“持续”指延续、继续、连续不断，符合文意，当选。B项“巧妙”指灵巧高明，超出一般（多指方法或技术），文段重点强调老字号不断创新，并未体现出老字号在创新过程中运用了灵巧高明的方法，与文意不符，排除。\n故正确答案为A。\n【文段出处】经济日报《让更多“老字号”驻足海外市场》","no":34,"missingImage":false},{"type":"question","qid":"5102190","cat":"逻辑填空","stem":"站在新的历史起点上，展望建设现代化国际瓷都的未来，拥有2000年冶陶史、1000年官窑史、600年御窑史及新中国成立以来70年陶瓷生产史的景德镇，必将继续传承陶瓷文化，深度挖掘千年瓷都人文        ，创新陶瓷产业，构建新时代陶瓷产品和话语体系，扩大陶瓷贸易和文化交流，更好满足世界对中国陶瓷的新需要和对中华人文理想的新期待，进一步展示中华古老陶瓷文化魅力，        当代中国人文城市的创新发展。\n依次填入划横线部分最恰当的一项是：","options":{"A":"潜力 促进","B":"底蕴 阐释","C":"资源 刺激","D":"涵养 解读"},"answer":"B","explanation":"第一空，搭配“深度挖掘”，且根据“拥有2000年冶陶史、1000年官窑史、600年御窑史及新中国成立以来70年陶瓷生产史的景德镇”可知，景德镇拥有悠久的历史，丰厚的人文资源，A项“潜力”指潜在的尚未发挥出来的力量，B项“底蕴”指内涵，内在的储备，C项“资源”指物质资料等的来源，均符合文意，保留。D项“涵养”意为修养，通常表达为“具有······涵养”等，与“深度挖掘”搭配不当，排除。\n第二空，根据“站在新的历史起点上，展望建设现代化国际瓷都的未来”以及“扩大陶瓷贸易和文化交流，更好满足世界对中国陶瓷的新需要和对中华人文理想的新期待，进一步展示中华古老陶瓷文化魅力”可知，整个文段重在论述，景德镇作为千年瓷都，在新的历史阶段，应更多向国际社会展示陶瓷文化的魅力，横线处所填词语与前文的“展示”构成对应，表达景德镇通过创新陶瓷产业，向世界展示中国人文城市的创新发展之意，B项“阐释”意为阐述并解释，符合文意，当选。A项“促进”指推动发展和进步，C项“刺激”指作用于事物使之产生反应，均与文意不符，排除。\n故正确答案为B。\n【文段出处】《千年瓷话：景德镇的历史变迁》","no":35,"missingImage":false},{"type":"question","qid":"5102188","cat":"逻辑填空","stem":"宋代的“琼林宴”，是专为新科进士们举办的宴会，它从唐代“闻喜宴”        而来。与“闻喜宴”不同的是，“琼林宴”的        更高，是皇帝亲自参与的“国宴”，因赐宴在著名的“琼林苑”而得名。明清时期，多将“琼林宴”称为“恩荣宴”，其仪式内容基本不变，“琼林宴”的形式得以        下来。\n依次填入划横线部分最恰当的一项是：","options":{"A":"转变 标准 流行","B":"发展 格局 延续","C":"演变 规格 传承","D":"演化 条件 稳定"},"answer":"C","explanation":"第一空，根据前文可知，横线处应体现宋代的“琼林宴”是从唐代“闻喜宴”的基础上发展变化而来，B项“发展”指事物从小到大、从简单到复杂、从低级到高级的变化，C项“演变”指逐渐地发展变化，均符合文意，保留。A项“转变”指由一种情况变成另一种情况，侧重“与之前形成强烈反差”，与文意不符，排除；D项“演化”指演变（多用于自然界的变化），如“生物演化”，与文段语境不符，排除。\n第二空，根据后文可知，“琼林宴”是皇帝亲自参与的“国宴”，故横线处需体现出级别更高，C项“规格”泛指规定的要求或条件，符合文意，保留。B项“格局”指结构、格式和规模，与文意不符，排除。\n第三空，代入验证。横线处意在表达明清时期将宋代“琼林宴”的形式继承下来，C项“传承”指传递和继承，符合文意，当选。\n故正确答案为C。\n【文段出处】《古代学子们如何庆祝自己的毕业季？》","no":36,"missingImage":false},{"type":"question","qid":"5102184","cat":"逻辑填空","stem":"有统计表明，由听力障碍者组成的家庭中，约90%育有听力正常子女。他们因出生于听障家庭，常常处在听障、健听两个世界的边缘地带。他们可能既无法真正        听障者世界，也不被听人世界完全        。他们面临普通人无法想象的挫折和压力，比如语言        迟缓、人际沟通障碍等，社会应给予他们更多的关注。\n依次填入划横线部分最恰当的一项是：","options":{"A":"融入 接纳 习得","B":"汇入 接受 发展","C":"进入 纳入 获取","D":"深入 接收 运用"},"answer":"A","explanation":"第一空，搭配“听障者世界”，横线前“他们”指代听力障碍者家庭中的听力正常子女，根据前文“常常处在听障、健听两个世界的边缘地带”可知，他们对于这两个世界都无法融合进来，A项“融入”、C项“进入”、D项“深入”均搭配恰当且符合文意，保留。B项“汇入”侧重空间上的汇合进入，与“听障者世界”搭配不当，排除。\n第二空，搭配“听人世界”，且根据前后的并列关系可知，此处表示不被听人世界所接受，A项“接纳”、C项“纳入”均搭配恰当且符合文意，保留。D项“接收”指收受，文段强调的是接受的态度而非接收的具体行为，与文意不符，排除。\n第三空，搭配“语言”，A项“习得”指学习得到，置于此处搭配恰当且符合文意，当选。C项“获取”表示获得、取得，一般不与“语言”搭配，排除。\n故正确答案为A。\n【文段出处】光明日报《倪兰：听障家庭中的健听子女》","no":37,"missingImage":false},{"type":"question","qid":"5102360","cat":"逻辑填空","stem":"衡量民众对美好生活需要的满足状况，获得感无疑是一个重要的社会心态        。而获得感的        ，需要个体的持续努力，也需要政府和社会的赋能。共同富裕、教育减负、生育友好等国家战略和政策，都是有效的赋能方式，既可以直接        社会成员的负担，也有助于培养更加朝气蓬勃的社会生态，进而从体制机制上保障获得感的可持续性。\n依次填入划横线部分最恰当的一项是：","options":{"A":"标志 获取 减少","B":"标准 增强 释放","C":"指标 提升 减轻","D":"准绳 巩固 降低"},"answer":"C","explanation":"第一空，根据文意可知，横线处所填词语可以起到“衡量民众对美好生活需要的满足状况”的作用，B项“标准”指衡量事物的准则，C项“指标”指衡量目标的参数或预期中打算达到的指数、规格、标准，D项“准绳”比喻言论、行动等依据的原则和标准，三者均符合文意，保留。A项“标志”指表明特征的记号或事物，无法起到衡量的作用，排除。\n第二空，搭配“获得感”，根据“个体的持续努力”“保障获得感的可持续性”可知，横线处所填词语应体现获得感越来越多之意。B项“增强”指在原有的基础上更进一步，C项“提升”指提高，二者均符合文意且搭配恰当，保留。D项“巩固”指使牢固，强调原有基础的保持，不能体现变多之意，排除。\n第三空，搭配“负担”，C项“减轻”指减少重量或程度，与“负担”搭配恰当，当选。B项“释放”指把所含的能量或物质放出来，常搭配“能量”“压力”“潜能”等，与“负担”搭配不当，排除。\n故正确答案为C。\n【文段出处】光明网《以青春之奋斗创造青年之获得》","no":38,"missingImage":false},{"type":"question","qid":"5102180","cat":"逻辑填空","stem":"在这片土地上，红色文化        而博大，除了红色史迹，这里还诞生了许多红色文化名人，陈独秀、陈延年、陈乔年父子，“两弹元勋”邓稼先等，他们的革命、奋斗、拼搏精神不仅推动着时代        ，也深深地影响着这片土地上的人们。也正因此，这片土地上才会产出敢于“大包干”的小岗村人、孕育出“舍小家、为大家”的王家坝精神。这些共同        成红色文化的精髓，成为不断奋进的精神动力。\n依次填入划横线部分最恰当的一项是：","options":{"A":"沉重 行程 凝集","B":"厚重 进程 凝结","C":"稳重 过程 凝聚","D":"庄重 历程 凝固"},"answer":"B","explanation":"第一空，搭配“红色文化”，且根据“除了红色史迹，这里还诞生了许多红色文化名人”可知，这片土地上的红色文化资源是十分丰富的，横线处所填词语应体现丰富之意。B项“厚重”指丰富，有分量，搭配得当，且符合文意，保留。A项“沉重”指沉静庄重或心思重重的，心情极度忧虑、不安或责任大，多搭配“心思、责任、性情”等，与“红色文化”搭配不当，且感情色彩偏消极，与文段感情色彩不一致，排除；C项“稳重”指安稳沉着，多用以形容人的性格、行事风格等，与“红色文化”搭配不当，排除；D项“庄重”指风度、仪表、举止或谈吐不随便，沉着稳重，未能体现丰富之意，且与“红色文化”搭配不当，排除。\n第二空，代入验证，B项“进程”指事物发展变化或进行的过程，能体现革命、奋斗、拼搏精神推动时代前进之意，且与“推动”“时代”均搭配恰当，保留。\n第三空，代入验证，B项“凝结”指凝聚、集结，与“精髓”搭配恰当，当选。\n故正确答案为B。\n【文段出处】人民网《安徽：奋进在红色热土上（红色地标巡礼·安徽篇）》","no":39,"missingImage":false},{"type":"question","qid":"5102181","cat":"逻辑填空","stem":"中国空间站名为“天宫”，是一个长期在近地轨道运行的空间实验室。这个极具中国        的名字，不仅蕴含了希望航天员在太空工作生活得更为        的愿望，更        着中国人遨游太空的浪漫情怀和不懈探索的精神。\n依次填入划横线部分最恰当的一项是：","options":{"A":"韵味 舒适 寄寓","B":"意蕴 舒服 涵盖","C":"特色 惬意 象征","D":"智慧 适意 承载"},"answer":"A","explanation":"第一空，根据文意可知，横线处所填词语意在表达“天宫”这一名字极具中国传统文化特点。A项“韵味”指情趣、趣味，B项“意蕴”指内在的意义、含义，C项“特色”指事物所表现的独特的色彩、风格，均符合文意，保留。D项“智慧”指聪明才智，文中并非表达这个命名体现了聪明才智，与文意不符，排除。\n第二空，根据“蕴含了希望航天员在太空工作生活得更为······的愿望”可知，横线处所填词语意在表达希望航天员生活得较为满意。A项“舒适”指舒服安适，B项“舒服”指身心感到轻松愉快，C项“惬意”形容心情感到愉快畅快，愉悦、舒畅，均符合文意，保留。\n第三空，搭配“情怀”和“精神”，且由文意可知，“天宫”这一名字体现着“浪漫情怀和不懈探索的精神”。A项“寄寓”指寄托，即把理想、希望、感情放在（某人身上或某种事物上），符合文意，当选。B项“涵盖”指包容，覆盖，无法准确表达出“天宫”这一名字与“情怀”“精神”之间的关系，与文意不符，排除；C项“象征”指用具体事物表现某些抽象意义，如“玫瑰花象征着爱情”，不能将“名字”这一抽象概念作为主语进行搭配，排除。\n故正确答案为A。\n【文段出处】安化县人民政府网《天宫空间站——太空闪耀中国智慧》","no":40,"missingImage":false},{"type":"question","qid":"5102176","cat":"片段阅读","stem":"人们一般都喜欢追逐日出或日落景观，但绝大部分人可能没意识到，其实在与太阳相反一侧的天空，也隐藏着鲜为人知的景观，比如说人们能看到的两种大尺度影子景观——“山影”和“地影”。日出或日落前后，在太阳照射下，高大山峰投射出巨大阴影。此时站在该山峰的观测者观察这个阴影，阴影看起来像金字塔，这就是山影。除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏。\n对这段文字理解正确的是：","options":{"A":"大多数人不喜欢欣赏“山影”“地影”景观","B":"人们不把“山影”“地影”作为景观来欣赏","C":"“山影”和“地影”是鲜为人知的山上景观","D":"只有极少数人能发现和欣赏“山影”和“地影”"},"answer":"D","explanation":"A项，根据“除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏”可知，大部分人只是没有注意到“山影”“地影”，故“大多数人不喜欢”无中生有，排除；\nB项，根据“除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏”可知，登山家和摄影师还是会欣赏“山影”和“地影”的，表述过于绝对，排除；\nC项，根据“在与太阳相反一侧的天空，也隐藏着鲜为人知的景观······‘山影’和‘地影’”可知，“山影”和“地影”是天空中的景观，故“山上景观”表述错误，排除；\nD项，根据“除了登山家或摄影师，几乎很少有人注意到山影和地影，并将它们作为一种景观来欣赏”可知，表述正确，当选。\n故正确答案为D。\n【文段出处】中国地理网《山影地影 只有极少数人在欣赏它们》","no":41,"missingImage":false},{"type":"question","qid":"5102203","cat":"片段阅读","stem":"乾隆款绛州澄泥砚的设计非常单一，没有任何一方向新式的琢砚风格靠拢，其仿造的主要是文化昌隆的汉、唐、宋泥质砚的标准款式。而同期乾隆朝内务府制造的大量松花砚则几乎抛弃了这种仿古砚式，极尽所能地去追求甚至创造潮流——高浮雕与浅浮雕配合营造表面，器座堆叠，砚盒设计精巧。如果说，乾隆朝宫作松花砚体现的是清宫在艺术审美领域的无往不胜，那么仿古绛州澄泥砚则意在强调它在技术领域的无所不能。\n下列说法正确的是：","options":{"A":"乾隆朝制造仿古砚的成就远远超出实用和观赏的目的","B":"松花砚代表的新式琢砚风格是乾隆朝造砚的主要潮流","C":"乾隆朝的澄泥砚旨在展示当时还原古砚制作的高超技艺","D":"乾隆朝宫作砚以追求艺术创造的美感或技术极致而著称"},"answer":"C","explanation":"A项，“成就远远超出实用和观赏的目的”文段未提及，无中生有，排除；\nB项，文段指出“同期乾隆朝内务府制造的大量松花砚则几乎抛弃了这种仿古砚式，极尽所能地去追求甚至创造潮流”，但并未体现出松花砚成为“主要潮流”，无中生有，排除；\nC项，根据“其仿造的主要是文化昌隆的汉、唐、宋泥质砚的标准款式”和“仿古绛州澄泥砚则意在强调它在技术领域的无所不能”可知，表述正确，当选；\nD项，根据“乾隆朝宫作松花砚体现的是清宫在艺术审美领域的无往不胜，那么仿古绛州澄泥砚则意在强调它在技术领域的无所不能”可知，“艺术创造的美感或技术”对应“宫作松花砚”、“仿古绛州澄泥砚”，“乾隆朝宫作砚”范围扩大，排除。\n故正确答案为C。\n【文段出处】《清代古砚鉴藏与仿古砚成造——以乾隆款仿古绛州澄泥砚为中心》","no":42,"missingImage":false},{"type":"question","qid":"5102263","cat":"片段阅读","stem":"制造与服务融合是智能制造的重要内容之一，服务要素渗透到制造各个环节中形成了生产性服务与制造服务化。本文从工业互联网的商业视角、使用视角、功能视角、实现视角建立了制造与服务融合中虚拟逻辑与实体活动交互的技术体系，有针对性地提出了生态位驱动、供应链驱动、大数据驱动、物联网驱动的制造与服务融合方法。本文构建的制造与服务融合技术体系，深化了工业互联网在制造业与服务业中的应用，为数字经济中制造服务产业的技术创新奠定了基础。\n如果这是一篇论文的摘要，那么这篇论文的标题最有可能是：","options":{"A":"数字经济中制造与服务融合的协同机制","B":"四轮驱动下的制造与服务融合技术体系","C":"工业互联网在智能制造中的体系化应用","D":"基于工业互联网的制造与服务融合技术"},"answer":"D","explanation":"文段开篇指出制造与服务融合是智能制造的重要内容之一，并由此形成了生产性服务与制造服务化。随后指出本文从工业互联网的多重视角，建立了制造与服务融合中虚拟逻辑与实体活动交互的技术体系，提出了多要素驱动的制造与服务融合方法，尾句作进一步阐释，指出基于工业互联网的制造与服务融合技术体系带来了诸多利好。故文段主要讨论的话题为“工业互联网”与“制造与服务融合技术”，对应D项。\nA、B两项，均缺少文段核心话题“工业互联网”，排除；\nC项，强调“工业互联网”在智能制造中的应用，缺少文段另一核心话题“制造与服务融合技术”，排除。\n故正确答案为D。\n【文段出处】万方智搜《基于工业互联网的制造与服务融合技术》","no":43,"missingImage":false},{"type":"question","qid":"5102361","cat":"片段阅读","stem":"作为深受各年龄层喜爱的一种智力游戏，数独在全世界范围内拥有众多爱好者。它根据规则在空格里填满数字，一般不需要太多的数学知识，只需要在9×9的81个格子中，每个格子里填入1～9数字中的一个即可。此时，必须使得每一个横行、纵列以及被区分好的3×3大小的“宫”里，都完整包含有1～9这9个数字，且每个数字仅能出现一次。在81个格子里，会预先填上大约20～30个数字（初始数字），以这些数字为线索，遵循上面的规则，用数字把空格全部填满即可。数独问题有且仅有一种答案。\n这段文字主要介绍的是：","options":{"A":"数独的填数乐趣","B":"数独的九宫方阵","C":"数独的基本规则","D":"数独的解题思路"},"answer":"C","explanation":"文段开篇引出数独的话题，强调其比较受欢迎，后文通过介绍格子数量和横行纵列填法，对于数独的填写方法和规则做出具体说明，尾句通过“仅有一种答案”，再次强调了数独的规则特点，故文段整体都在围绕数独填写的基本方法和要求展开说明，对应C项。\nA项，“填数乐趣”文段中并未提及，无中生有，排除；\nB项，“九宫方阵”仅对应文段“此时”之后的内容，表述片面，排除；\nD项，“解题思路”即为解开数独的方法，文段并没有提到解开数独的具体方法步骤，无中生有，排除。\n故正确答案为C。\n【文段出处】科学世界《数独背后的数学魅力》","no":44,"missingImage":false},{"type":"question","qid":"5102220","cat":"片段阅读","stem":"南极动物的食物链极有特色，有人这样形容：在南极生活的动物从食物链上划分只有三个可能：它是磷虾，它吃磷虾或它捕食吃磷虾的动物。这个说法简单清晰地揭示了南极磷虾在南极生物圈承担的关键角色——这里几乎所有的动物都直接或间接地依赖磷虾生存。有些动物的食谱只有磷虾，没有其他替代品，而且它们生长繁殖、捕猎与迁移的时间和地点均与磷虾的生长状态相耦合。\n由上述材料无法推出：","options":{"A":"南极磷虾是南极生物链中至关重要的一个环节","B":"大多南极动物进化出以磷虾为中心的生存方式","C":"部分南极动物的繁殖期与磷虾的丰产期相一致","D":"企鹅数量的下降主要由于磷虾数量的减少所致"},"answer":"D","explanation":"A项，根据“这个说法简单清晰地揭示了南极磷虾在南极生物圈承担的关键角色——这里几乎所有的动物都直接或间接地依赖磷虾生存”可以推出，南极磷虾在南极生物圈发挥关键作用，表述正确，排除；\nB项，根据“在南极生活的动物从食物链上划分只有三个可能：它是磷虾，它吃磷虾或它捕食吃磷虾的动物”“这里几乎所有的动物都直接或间接地依赖磷虾生存”可以推出，大多南极动物进化出以磷虾为中心的生存方式，表述正确，排除；\nC项，根据“而且它们生长繁殖、捕猎与迁移的时间和地点均与磷虾的生长状态相耦合”可以推出，部分南极动物的繁殖期与磷虾的丰产期相一致，表述正确，排除；\nD项，文段未提及“企鹅数量下降”的原因，也未涉及“磷虾数量的减少”，故属于无中生有，当选。\n本题为选非题，故正确答案为D。\n【文段出处】《从南极磷虾看生命的意义》","no":45,"missingImage":false},{"type":"question","qid":"5102221","cat":"片段阅读","stem":"我国全年降水量、河川径流量60％～80％集中在汛期；同时，降水和径流的年际变化显著，最大和最小年降水量南方地区相差2～4倍，北方地区相差3～6倍，径流量最大和最小年份相差10～15倍。天然来水过程与需水过程不匹配，很多地区出现旱涝急转，水资源开发利用难度加大。随着城镇化水平不断提升，人口和经济要素进一步向城市集聚。20世纪80年代初，全国人口城镇化率仅30%，2020年已达63.8%。城市群尤其中心城市水资源保障问题将日益突出。\n这段文字意在说明：","options":{"A":"我国降水和河川径流年际变化较大","B":"我国大部分地区水资源年内分配不均","C":"我国北方地区水资源衰减态势可能会进一步持续","D":"我国水资源分布失衡、供需矛盾突出，与自然和人为因素有关"},"answer":"D","explanation":"文段开篇指出我国全年降水量和河川径流量大部分集中在汛期，且不同年份的变化显著，天然来水过程与需水过程不匹配，接着又指出，随着城镇化水平不断提升，人口和经济要素向城市集聚，这种人为的因素也导致了水资源保障问题日益突出。因此，文段为没有标志的并列结构，前半部分指出水资源供需矛盾的自然因素，后半部分指出人为因素，对应D项。\nA、B两项，均对应文段关于“水资源供需矛盾的自然因素”，表述片面，排除；\nC项，“北方地区水资源衰减态势”文段未提及，无中生有，排除。\n故正确答案为D。\n【文段出处】光明日报《院士专家把脉我国水资源“家底”——水，如何平衡发展之重》","no":46,"missingImage":false},{"type":"question","qid":"5102219","cat":"片段阅读","stem":"人脸识别的相关应用需要公民肖像做支撑，因此，肖像权是人脸识别过程中最有可能受到侵害的权利。在人们看来，人脸识别当然是识别人脸。但实际上，人脸识别图像上显示的是人脸，不过后台能够看见的画面已不局限在人脸范围，这样的人脸识别采集图像，的确有“说话不算数”之嫌。进一步说来，如此人脸识别的App在法律上也涉嫌越权或者侵权。人脸识别只能采集公民主动提供人脸的图像信息，一旦采集范围扩大，将人脸周围的图像、公民所处的环境、正在从事的行为等信息进行采集，将侵犯公民不愿暴露的隐私。\n下列选项与文段意思不符的是：","options":{"A":"扩大人脸识别采集范围有可能侵害公民隐私权","B":"摄像头采集人脸周围的图像扩大了采集的范围","C":"公民应主动提供人脸的图像信息并享有知情权","D":"公民肖像权在人脸识别过程中最有可能受侵害"},"answer":"C","explanation":"A项，根据文段“一旦采集范围扩大，将人脸周围的图像、公民所处的环境、正在从事的行为等信息进行采集，将侵犯公民不愿暴露的隐私”可知，说法正确，排除；\nB项，根据文段“不过后台能够看见的画面已不局限在人脸范围”“一旦采集范围扩大，将人脸周围的图像······将侵犯公民不愿暴露的隐私”可知，采集人脸周围的图像属于扩大采集范围，说法正确，排除；\nC项，根据文段“人脸识别只能采集公民主动提供人脸的图像信息”可知，人脸识别的信息获取来源由公民主动提供，文段并未要求公民主动提供，偷换概念，当选；\nD项，根据文段“因此，肖像权是人脸识别过程中最有可能受到侵害的权利”可知，说法正确，排除。\n本题为选非题，故正确答案为C。\n【文段出处】光明网《人脸识别只能识别人脸》","no":47,"missingImage":false},{"type":"question","qid":"5102258","cat":"片段阅读","stem":"长棘海星，这种像仙人球一般长满尖刺的生物，是珊瑚礁生态系统的主要捕食者。成年长棘海星的身体直径可以达到35厘米，有记录的最大个体甚至能超过75厘米。长棘海星以各类珊瑚，尤其是造礁珊瑚为食，被啃食的珊瑚只会留下白森森的外骨骼。如同肆虐于草原和农田的蝗灾一样，在全球范围内长棘海星会出现不规律的种群暴发，对珊瑚礁生态系统造成严重影响。\n这段文字没有提及长棘海星的：","options":{"A":"外形特征","B":"捕食对象","C":"种群密度","D":"破坏作用"},"answer":"C","explanation":"A项，根据“长棘海星，这种像仙人球一般长满尖刺的生物”“成年长棘海星的身体直径可以达到35厘米，有记录的最大个体甚至能超过75厘米”可知，“外形特征”文段有提及，排除；\nB项，根据“长棘海星以各类珊瑚，尤其是造礁珊瑚为食”可知，其“捕食对象”即为珊瑚，文段有提及，排除；\nC项，“种群密度”文段并未提及，无中生有，当选；\nD项，根据“如同肆虐于草原和农田的蝗灾一样，在全球范围内长棘海星会出现不规律的种群暴发，对珊瑚礁生态系统造成严重影响”可知，文段有提及“破坏作用”，排除。\n本题为选非题，故正确答案为C。\n【文段出处】中国国家地理杂志《长棘海星暴发 充满谜团的自然现象》","no":48,"missingImage":false},{"type":"question","qid":"5102254","cat":"片段阅读","stem":"实现技术要素高效配置是高标准市场体系建设的战略使命。技术要素市场化改革为建设高标准市场体系带来内生动力。发展完善技术要素市场，对现有市场体系提出了更高要求，例如需要更加健全的产权保护制度，更加公平的市场竞争环境，更为成熟的劳动力、资本要素市场以及更加包容的市场监管。此外，由于市场管理与创新管理的部门分割，技术要素市场化改革必然要求高标准市场体系建设要着力解决深层次的体制机制障碍、更加有效地统筹市场体系与创新体系的关系、协调科技与经济社会发展的关系。\n这段文字的中心观点在于说明：","options":{"A":"科技与经济社会发展的关系","B":"技术要素与高标准市场体系的关系","C":"高标准市场体系与创新体系的关系","D":"技术要素对市场体系提出了更高要求"},"answer":"B","explanation":"文段首先指出实现技术要素是高标准市场体系建设的战略使命，接着介绍技术要素市场化对高标准市场体系的作用及要求，并举例说明，然后通过“此外”引导并列，指出技术要素市场化改革对高标准市场体系的要求，故文段的主题词是“技术要素”与“高标准市场体系”，强调的重点是技术要素与高标准市场体系的关系，对应B项。\nA项，“科技与经济社会发展的关系”对应尾句的一部分，表述片面，且无主题词“技术要素”与“高标准市场体系”，排除；\nC项，文段并未提及“高标准市场体系与创新体系的关系”，无中生有，且无主题词“技术要素”，排除；\nD项，对应“此外”前的内容，表述片面，且文段主题词是“高标准市场体系”而非“市场体系”，主题词范围扩大，排除。\n故正确答案为B。\n【文段出处】《技术要素市场如何培育》","no":49,"missingImage":false},{"type":"question","qid":"5102257","cat":"片段阅读","stem":"在高空气球技术取得进展的同时，航空和航天技术也迎来了飞速发展时期。在大气层内，飞机是更便捷的飞行工具，而对于那些需要在大气层之上进行的科学研究，卫星提供了更加理想的环境。然而，高空气球这种历久弥新的工具却没有走出人们的视野，目前仍然是重要的科学研究工具。\n这段文字的核心观点是：","options":{"A":"高空气球在科学研究中有独特优势","B":"高空气球比飞机和卫星更重要","C":"古老的高空气球仍在不断发展","D":"高空气球可用作科学观测平台"},"answer":"A","explanation":"文段开篇指出在高空气球技术发展的同时，航空和航天技术也在发展，随后通过“飞机”和“卫星”具体介绍了航空航天技术的发展应用，尾句“然而”引导转折，强调高空气球依然是重要的科学研究工具，对应A项。\nB项，“比飞机和卫星更重要”文段并未提及，无关对比，排除；\nC项，“高空气球仍在不断发展”对应文段首句，为话题引入部分的内容，非重点，排除；\nD项，“科学观测平台”文段并未提及，无中生有，排除。\n故正确答案为A。\n【文段出处】北晚在线《高空气球打造新型天文望远镜，只花千分之一的钱，做和哈勃望远镜同样的事》","no":50,"missingImage":false},{"type":"question","qid":"5102363","cat":"片段阅读","stem":"铝是一种很容易发生化学反应的物质，即使只放置在空气中，也会与氧发生反应，在表面形成氧化铝层。这种与氧发生反应、被其他物质夺走电子的化学反应称为“氧化”；与此相反，从其他物质夺取电子的化学反应则称为“还原”。普通金属与氧发生反应后会生锈（氧化物等的化合物）而被腐蚀，但是，如果像铝那样整个表面很快就覆盖上一层膜的话，膜下面的铝就不能再与氧发生反应。也就是说，多亏了铝具有容易发生化学反应（易氧化）这一性质，所以才能防止下层的铝继续氧化（生锈）。\n从这段文字可以推出：","options":{"A":"铝容易氧化，但膜不容易生锈","B":"铝虽容易氧化，但也容易还原","C":"铝既容易生锈，也不容易生锈","D":"铝不仅容易氧化，还容易生锈"},"answer":"C","explanation":"A项，根据“如果像铝那样整个表面很快就覆盖上一层膜的话，膜下面的铝就不能再与氧发生反应”可知，是“膜下面的铝”不容易生锈，而不是“膜”不容易生锈，偷换概念，排除；\nB项，根据“从其他物质夺取电子的化学反应则称为‘还原’”可知，文段仅提及还原反应，但是并未提及铝的还原，无中生有，排除；\nC项，根据“铝是一种很容易发生化学反应的物质······”“如果像铝那样整个表面很快就覆盖上一层膜的话，膜下面的铝就不能再与氧发生反应”以及文意可知，铝容易发生氧化反应，即“生锈”，但又因为铝氧化后表面覆盖一层膜，使得膜下的铝不容易生锈，因此“铝既容易生锈，也不容易生锈”，表述正确，当选；\nD项，根据“如果像铝那样整个表面很快就覆盖上一层膜的话，膜下面的铝就不能再与氧发生反应······所以才能防止下层的铝继续氧化（生锈）”可知，膜下面的铝具有不易生锈的特点，表述错误，排除。\n故正确答案为C。","no":51,"missingImage":false},{"type":"question","qid":"5102218","cat":"片段阅读","stem":"叙事医学是一种具有叙事能力的医学实践，而叙事能力是指能够吸收、解释并被疾病的故事所感动的能力。这种能力有助于临床医生在医疗活动中提升对患者的共情能力、职业精神、亲和力和自我行为的反思。叙事医学要求医生在临床决策过程中倾听病人的叙事，关注家属等社会关系人的叙事。这样，医生才可以获取更多有助于临床决策的信息，才能作出正确的疾病诊断，提出最适合病人的决策建议，最后和患方共同作出首先保障病人利益，又能平衡各方权益的诊疗选择。\n这段文字意在说明：","options":{"A":"叙事医学有助于医患共同决策","B":"叙事医学可化解当下医疗分歧","C":"叙事医学可避免技术至上误区","D":"叙事医学有利于当前医学实践"},"answer":"A","explanation":"文段开篇阐释“叙事医学”的定义，紧接着说明其对于临床医生在医疗活动中有诸多提升，接下来介绍“叙事医学”对医生在临床决策过程中的相关要求，最后通过“这样”总结前文，进一步指出“叙事医学”在诊疗过程中的积极意义。文段尾句点明主旨，强调“叙事医学”有助于医生和患方共同作出诊疗选择，对应A项。\nB项“医疗分歧”、C项“技术至上”文段并未提及，无中生有，均排除；\nD项，“医学实践”对应首句话题引入部分，非重点，且“有利于当前医学实践”表述不明确，排除。\n故正确答案为A。\n【文段出处】期刊《叙事医学助力医患共同决策》","no":52,"missingImage":false},{"type":"question","qid":"5102260","cat":"片段阅读","stem":"目前，牙科医生治疗受损牙齿使用的修复物由人造材料制成，而固定修复物所用的商业用胶，在性能和化学组成方面与天然牙组织——牙质有很大不同。因此，修复物与真牙结合得不太好，有时甚至会脱落。天然羟基磷灰石存在于牙齿、蛋壳等组织中，在其基础上制作的新黏合剂可模拟牙质的特性和结构。为检验新黏合剂的效果，科研人员将修复物放在真牙上，部分修复物用新黏合剂固定，另一部分以商业牙科用胶固定。结果显示，新型黏合剂由于与天然牙组织高度相似，可以更牢固地黏合人造修复材料。\n下列说法与上述语段意思不符的是：","options":{"A":"类似牙齿的天然材料可治疗牙齿受损部分","B":"蛋壳中提取的羟基磷灰石可制成牙科黏合剂","C":"新型黏合剂与天然牙组织的特性和结构相似","D":"商业牙科用胶在固定牙科修复物时的黏性比不上新型黏合剂"},"answer":"A","explanation":"A项，根据文段首句“牙科医生治疗受损牙齿使用的修复物由人造材料制成，而固定修复物所用的商业用胶······”以及“天然羟基磷灰石存在于牙齿、蛋壳等组织中，在其基础上制作的新黏合剂可模拟牙质的特性和结构”可知，用来治疗牙齿受损的是修复物，为人造材料制成，只有固定修复物的胶可以是天然物质合成，因此“类似牙齿的天然材料”应指的是起到黏合、固定作用的新黏合剂，并不能起到“治疗”作用，偷换概念，当选；\nB项，根据文段中“天然羟基磷灰石存在于牙齿、蛋壳等组织······模拟牙质的特性和结构”可知，表述正确，排除；\nC项，根据文段中“天然羟基磷灰石······制作的新黏合剂可模拟牙质的特性和结构”可知，新型黏合剂与天然牙组织有类似的特性和结构，表述正确，排除；\nD项，根据文段中“为检验新黏合剂的效果······结果显示，新型黏合剂由于与天然牙组织高度相似，可以更牢固地黏合人造修复材料”可知，新型黏合剂的黏合效果更好，表述正确，排除。\n本题为选非题，故正确答案为A。\n【文段出处】光明网《蛋壳提取物 可制备牙科黏合剂》","no":53,"missingImage":false},{"type":"question","qid":"5102217","cat":"片段阅读","stem":"关于“天鹅都是白色的”这一假说，通常我们应该一只一只地调查天鹅的颜色。这种通过积累个别观察来验证假说或推导出定律的方法称为“归纳法”。但基于归纳法的推论不能带来可靠的正确性，哲学家波普提出了不依赖于归纳法的科学方法。他认为，试图证明假说是错误的才是科学的研究。例如，即使只找到了一只黑天鹅，也能证明“天鹅都是白色的”这一假说是错误的。虽然基于归纳法的验证通常是不可靠的，但如果证伪的话，则是可靠的。通过反复“设定一个用来解决问题的假说，寻找其反例来证伪假说，再设立新的假说······”，就可以进行科学的研究。\n哲学家波普认为：","options":{"A":"科学的方法应是“可归纳”","B":"科学的方法应是“可证伪”","C":"科学的方法应是“不可证伪”","D":"科学的方法应是“不可归纳”"},"answer":"B","explanation":"文段开篇以“天鹅都是白色的”这一假说引入 “归纳法”的定义。随后，借助转折关联词 “但”，强调归纳法存在局限。紧接着，指出哲学家波普提出了另一种科学方法，即“试图证明假说是错误的”。后文通过“例如”，对波普的这一观点展开具体的举例论证。之后，文段再次运用转折词“但”提出“可证伪” 的方法具有科学可靠性这一观点，并在尾句对该观点加以补充说明。故文段重点在于论证“可证伪”的科学性，对应B项。\nA、D两项，均围绕“归纳法”展开，偏离文段重点，排除；\nC项，表述与哲学家波普的观点相悖，排除。\n故正确答案为B。","no":54,"missingImage":false},{"type":"question","qid":"5102216","cat":"片段阅读","stem":"我国宏观调控体系伴随社会主义市场经济体制改革的全面深化不断创新、完善。随着大数据、云计算、人工智能、区块链等加速创新，数字技术日益融入经济社会发展各领域全过程。数字技术不仅是数字经济发展的支撑，而且是辅助经济治理的基础。宏观经济是一个不可中断的连续进程，作为关键生产要素的数据也是动态的、系统化的，以不间断的“流”的形式存在。发挥数字技术在宏观经济治理中的作用，是创新和完善调控的重要任务，是提高调控前瞻性、针对性、有效性的重要条件。\n这段文字是一篇文章的引言，接下去作者最可能讲述的是：","options":{"A":"如何运用数字技术创新完善宏观调控","B":"如何完善宏观经济治理推动社会发展","C":"如何深度挖掘宏观经济数据资源","D":"如何让数字文明助力新发展格局"},"answer":"A","explanation":"本题为接语选择题，需通读全文，重点关注文段最后讨论的核心话题。文段开篇引出话题，即宏观调控体系在不断创新、完善。随后提出数字技术对于经济治理的重要作用，并提出宏观经济与数据均是动态的形式存在。尾句提出数字技术对于宏观调控的重要作用。根据话题一致原则，文段接下来最可能围绕“数字技术”和“宏观调控”展开论述，介绍如何通过数字技术创新和完善宏观调控，对应A项。\nB、C、D三项，均未提及文段核心话题“数字技术”，与前文无法衔接，排除。\n故正确答案为A。\n【文段出处】《善用数字技术创新宏观调控》","no":55,"missingImage":false},{"type":"question","qid":"5102204","cat":"片段阅读","stem":"目前，水和肥料都没有在农业中得到最佳使用，传统的植物栽培方法，使大部分水和化学物质，穿过土壤“溜过”根部，与地下水混合。为此，全球农业科技工作者都在寻找可以解决问题的新材料。某大学科研人员开发出一种聚合物水凝胶，该凝胶可作为土壤的“智能”添加剂，有助于避免土壤污染，显著减少用水量并改善植物对肥料的吸收。该研究员说，新研发的水凝胶能够在下雨或灌溉时储存大量水分，然后随着土壤变干缓慢释放。同时，这种水凝胶完全可以生物降解，也就是说，经过一段时间后，它们会“溶解”在土壤中，毫无踪迹。\n这段文字意在说明：","options":{"A":"根部肥料往往远离根部未发挥其肥料作用","B":"聚合物水凝胶可减少土地用水并避免污染","C":"大量使用化学肥料使土壤状况被破坏","D":"新研发的水凝胶在土壤中可完全降解"},"answer":"B","explanation":"文段开篇介绍传统的植物栽培方法存在不足，水和肥料都没有得到最佳使用，接着通过“为此”指代前文进行总结，指出某大学科研人员开发出一种聚合物水凝胶，并指出该凝胶既有助于避免土壤污染，又能减少用水量及改善植物对肥料的吸收。后文围绕聚合物水凝胶的作用进行具体解释说明。故文段重在强调聚合物水凝胶具有避免土壤污染和减少用水量的作用，对应B项。\nA项，“根部肥料往往远离根部”对应前文传统的栽培方法的部分内容，文段重点强调新材料聚合物水凝胶，排除；\nC项，文段并未论述“大量使用化学肥料”对于“土壤状况”的危害，无中生有，排除；\nD项，“土壤中可完全降解”对应“同时”之后解释说明的内容，非重点且表述片面，排除。\n故正确答案为B。\n【文段出处】《新凝胶可减少土地用水并避免污染》","no":56,"missingImage":false},{"type":"question","qid":"5102208","cat":"语句表达","stem":"一国文明通常要通过典籍、实物和活态三条渠道完成传承。在传统社会中学者关注最多的是前二者，而很少会注意到活态传承。事实上，当一个国家最重要的文明——非物质文化遗产，因其内容、形式、工艺过于复杂，                    。传承人也凭借着他们的“活态传承”，为中华文明的延续作出了属于自己的贡献。\n填入划横线部分最恰当的句子是：","options":{"A":"要想通过典籍将非物质文化遗产代代传承，几乎是不可能的","B":"通过古人的器物、遗址，同样能认识祖先创造的辉煌的人类文明","C":"用典籍与实物无法传承时，民间常用口耳相传等方式进行“活态传承”","D":"典籍传承有明显短板，中国典籍大多记载官方历史或文人创作，民间文化鲜有提及"},"answer":"C","explanation":"横线在文段中间，需考虑与前后文的衔接。横线前介绍国家文明的传承需要通过典籍、实物和活态三条渠道，而活态传承相较前两种更缺少学者关注，接着通过转折词“事实上”指出非物质文化遗产的内容、形式、工艺很复杂。横线后通过“也”指出传承人通过“活态传承”为中华文明的延续作出贡献。横线前后均围绕“活态传承”展开论述，因此横线处应体现“活态传承”这一核心话题，对应C项。\nA、B、D三项均偏离文段核心话题“活态传承”，排除。\n故正确答案为C。\n【文段出处】《非遗传承人：中华文明的另类传承者》","no":57,"missingImage":false},{"type":"question","qid":"5102364","cat":"语句表达","stem":"热水和冷水混在一起会变成温水。但是，温水不会自发分成热水和冷水。热量只能从热的物体向冷的物体单向传递，这一原理称为“热力学第二定律”。如果用分子这一微观视角看这一定律，物质的温度取决于其中沿着随机方向运动的分子的速度。分子运动速度快就会变热，速度慢就会变冷。但是数量庞大的分子运动时，各个分子的运动速度不是固定的。说到底，温度只不过是以不同速度运动的分子的平均速度罢了。因此，如果能够从以各种速度运动的分子中，只筛选出运动速度快的分子，从理论上说，就应该能                    。\n填入划横线处最恰当的句子是：","options":{"A":"从温水中单独提取出热水","B":"从温水中自发分出冷热水","C":"不使用能量就把冷水烧开","D":"不通过传递就把热水变温"},"answer":"A","explanation":"横线出现在结尾，且为尾句的分句，故需依据横线前内容以及横线所在尾句内容进行分析。文段开篇指出，温水不会自发分成热水和冷水，并解释原因。随后指出物质的温度取决于分子的速度，分子速度快就会变热，速度慢就会变冷，并以“说到底”进行总结，指出温度是分子的平均速度。“因此”基于前文得出结论，指出若能筛选出运动速度快的分子，就可以达到某种目的。结合前文可知，运动速度快意味着温度高，“筛选出运动速度快的分子”意味着提取出了温度高的部分，A项“提取出热水”符合文意，且呼应首句提出的问题，当选。\nB项，“筛选出运动速度快的分子”意味着提取出温度高的部分，而非“分出冷热水”，排除；\nC项，文段没有体现出“不使用能量”，排除；\nD项，“筛选出运动速度快的分子”意味着提取出温度高的部分，而非将热水变温，排除。\n故正确答案为A。","no":58,"missingImage":false},{"type":"question","qid":"5102205","cat":"语句表达","stem":"①现在，“元宇宙”将不再是一种想象，人们正在利用增强现实（AR）、虚拟现实（VR）和互联网（Internet）的技术手段，使现实中的人类在数字化技术的加持下进入元宇宙，凭借网络重新定义自己，体验一种全新的生活\n②对多数人来说，何谓元宇宙，这是必须首先弄清楚的问题\n③Metaverse（元宇宙）即是Meta（超越）+Verse（宇宙），指超越现实的虚拟世界\n④这个世界能够通过高度真实感的还原技术，为用户带来沉浸式的体验\n⑤人们在这个虚拟世界中会有一个全新的身份，能够构建新的社交体系，能够按照这个身份不间断地“生活下去”\n⑥电影《头号玩家》里的“绿洲”、动漫《刀剑神域》中的沉浸虚拟世界，就是想象中的元宇宙\n将以上6个句子重新排列，语序正确的是：","options":{"A":"①②③④⑤⑥","B":"③⑤⑥②①④","C":"②③⑤④⑥①","D":"①⑤②⑥③④"},"answer":"C","explanation":"对比选项，确定首句。①句介绍目前人类可以利用一些技术手段进入元宇宙，凭借网络重新定义自己，体验一种全新的生活，②句介绍对于多数人来说，首先要弄清楚什么是元宇宙，③句介绍元宇宙是指超越现实的虚拟世界，三句话均围绕“元宇宙”进行论述，按照先后逻辑顺序，应先提出问题，即何谓“元宇宙”；再具体回答什么是“元宇宙”以及如何进入元宇宙，故②句应该在①句和③句的前面，对应C项。\n验证C项，②句引出何谓“元宇宙”这一话题，③句介绍“元宇宙”的具体定义，⑤④两句指出元宇宙给人们带来的体验，⑥句通过电影及动漫来说明想象中的元宇宙，①句介绍通过技术手段人们可以实现进入元宇宙的梦想，逻辑通顺。\n故正确答案为C。\n【文段出处】中国社会科学报《元宇宙：游戏与人性自由前所未有之契合》","no":59,"missingImage":false},{"type":"question","qid":"5102206","cat":"语句表达","stem":"①因火焰的热量而变成气体\n②因此，烛芯就显得尤为重要\n③变成气体的蜡则可以在火焰中燃烧\n④液体的蜡会堆积在里面，并在烛芯中向上移动\n⑤点燃烛芯后，蜡烛的上部会因受热而熔化成碗状\n⑥蜡烛一般是由石蜡制成，但直接用火很难点燃固体蜡\n将以上6个句子重新排列，语序正确的是：","options":{"A":"⑥⑤②④①③","B":"⑥⑤④①③②","C":"⑥②⑤④①③","D":"⑥②⑤①③④"},"answer":"C","explanation":"对比选项，首句均为⑥句。\n进一步观察选项发现，应对比⑥句后面接②句还是⑤句，⑥句指出直接用火很难点燃固体蜡，②句通过“因此”得出结论，介绍烛芯的重要性，故⑥②两句可形成因果关系，构成捆绑，保留C、D两项。⑤句介绍点燃烛芯后蜡烛的变化，根据逻辑顺序，应先引入“烛芯”这一话题，再具体解释“点燃烛芯后的蜡烛变化”，故②句应在⑤句之前，排除A、B两项。\n对比C、D两项，开头均为⑥②⑤三句，区别在于④句和①③两句的先后顺序，①句指出因火焰的热量而变成气体，③句指出变成气体的蜡可以燃烧，④句介绍液体蜡的情况，根据蜡烛燃烧时“固体-液体-气体”的变化规律可知，④句应在①③两句之前，排除D项，对应C项。\n故正确答案为C。","no":60,"missingImage":false}],"count":40,"answerable":40,"pointsOf":24},{"label":"数量关系","items":[{"type":"question","qid":"5102142","cat":"数学运算","stem":"某地采用传统销售模式，销售一批鸡蛋需要20天，销售一批桃子需要25天。为推动销售，当地开启县领导直播带货模式，直播带货期间，鸡蛋的销售效率提高为原来的2倍，桃子销售效率为原来的3倍；其余销售时间依然按照传统模式进行，结果两种产品同时销售完成。那么销售期间直播带货的天数为：","options":{"A":"3","B":"5","C":"8","D":"10"},"answer":"B","explanation":"除了销售时间相同，销售鸡蛋和销售桃子没有其它关系，所以二者是相互独立的，因此可赋值传统销售模式下的鸡蛋和桃子的销售效率均为1，则直播带货期间，鸡蛋销售效率为2，桃子销售效率为3。根据题意可得，该批鸡蛋总量为20×1=20，该批桃子总量为25×1=25。设销售期间直播带货的天数为x，则非直播带货的鸡蛋销售时间为\u003cimg data-k=\"dea08e5a5d68\">，非直播带货的桃子销售时间为\u003cimg data-k=\"00616aee543a\">。因为两种产品同时销售完成，其中的直播带货时间相同，那么非直播带货的时间也相同，即20-2x=25-3x，解得x=5，因此销售期间直播带货的天数为5。\n故正确答案为B。","no":61,"missingImage":false},{"type":"question","qid":"5102321","cat":"数学运算","stem":"某助农志愿小分队采摘到甲、乙、丙三筐枸杞共144斤。第一次从甲筐中取出与乙筐一样重的枸杞放入乙筐，第二次再从现有乙筐中取出与丙筐一样重的枸杞放入丙筐，第三次从现有丙筐中取出与现有甲筐一样重的枸杞放入甲筐，此时三筐枸杞一样重。那么原来甲筐中有枸杞：","options":{"A":"36斤","B":"48斤","C":"56斤","D":"66斤"},"answer":"D","explanation":"方法一：甲、乙、丙三筐共144斤，最终三筐枸杞一样重，每筐144÷3=48斤，根据题意反推如下表：\n\u003cimg data-k=\"ef1849cf9209\" style=\"max-width:376px\">\n方法二：设最初甲、乙、丙分别有x斤、y斤、z斤枸杞，变化如下表：\n\u003cimg data-k=\"8d251008d196\" style=\"max-width:351px\">\n可列方程组：\u003cimg data-k=\"62e63abaea0c\">，解得\u003cimg data-k=\"927340a9c0ef\">。\n故正确答案为D。","no":62,"missingImage":false},{"type":"question","qid":"5102140","cat":"数学运算","stem":"北京冬奥会期间，冬奥会吉祥物“冰墩墩”纪念品十分畅销。销售期间某商家发现，进价为每个40元的“冰墩墩”，当售价定为44元时，每天可售出300个，售价每上涨1元，每天销量减少10个。现商家决定提价销售，若要使销售利润达到最大，则售价应为：","options":{"A":"51元","B":"52元","C":"54元","D":"57元"},"answer":"D","explanation":"设“冰墩墩”纪念品售价共上涨x元，销售利润为y元。根据题意，可列方程：\u003cimg data-k=\"b6b77010028a\">，即\u003cimg data-k=\"de1f2daeae5b\">，令y=0，解得\u003cimg data-k=\"45a0f105bb26\">，\u003cimg data-k=\"c9ac4187942a\">，当\u003cimg data-k=\"0d2a839367ab\">时，总利润最大，此时售价为44+13=57元。\n故正确答案为D。","no":63,"missingImage":false},{"type":"question","qid":"5102309","cat":"数学运算","stem":"某镇卫生院50多名医生被平均分配到13个基层诊所参与工作，其中男医生比女医生多4人。工作结束后，25％的男医生和一部分女医生继续到邻镇4个医疗点支援工作，这批人员中任意6人必有男医生，且保证必有一个医疗点的女医生多于1人。那么该卫生院到邻镇支援工作的医生共有：","options":{"A":"12人","B":"14人","C":"16人","D":"18人"},"answer":"A","explanation":"根据题意，某镇卫生院50多名医生被平均分配到13个基层诊所参与工作，医生总数为13的倍数，则医生总数只能为52人。由于男医生比女医生多4人，则男医生有\u003cimg data-k=\"d8b47d91d80b\">人，女医生有\u003cimg data-k=\"8189b4e95986\">人，分配到邻镇的男医生有28×25%=7人。要使这批人员中任意6人必有男医生，则女医生的人数应小于6人；又因有4个医疗点，且要保证必有一个医疗点的女医生多于1人，则女医生的人数应大于4人，故女医生的人数为5人。则该卫生院到邻镇支援工作的医生有7+5=12人。\n故正确答案为A。\n注：男医生人数为7人，女医生人数少于6人，则医生总人数少于13人，只有A项满足。","no":64,"missingImage":false},{"type":"question","qid":"5102311","cat":"数学运算","stem":"某商场为庆祝开业三周年，制作了一个长方形大蛋糕，并切成四块，如图所示。假设这个蛋糕可供350人享用，左下角那块蛋糕平均可供50人享用，右上角那块蛋糕平均可供70人，则中间最大块蛋糕平均可供多少人享用？\n\u003cimg data-k=\"665d8962f6fb\" style=\"max-width:412px\">","options":{"A":"150","B":"155","C":"175","D":"180"},"answer":"B","explanation":"假设平均每人享用蛋糕\u003cimg data-k=\"6c90394679b6\">，则蛋糕面积为\u003cimg data-k=\"68b41ba7f4ab\">，赋值蛋糕的长为35cm，宽为10cm。如下图所示：\n\u003cimg data-k=\"339b94dca085\" style=\"max-width:398px\">\n根据“左下角那块蛋糕平均可供50人享用，右上角那块蛋糕平均可供70人”可知\u003cimg data-k=\"7ac0d225fd46\">，\u003cimg data-k=\"cd51b395c516\">，根据三角形面积公式：\u003cimg data-k=\"b11a4eeb4386\">，可得：CE\u003cimg data-k=\"94811de5e6d7\">cm，BF\u003cimg data-k=\"119a449c0b20\">cm，则ED=35-10=25cm，DF=10-4=6cm，则\u003cimg data-k=\"dbd4dab2ee59\">，故\u003cimg data-k=\"ced5e0cf4afd\">，平均可供155人享用，即中间最大块蛋糕平均可供155人享用。\n故正确答案为B。","no":65,"missingImage":false},{"type":"question","qid":"5102134","cat":"数学运算","stem":"某智能停车场泊车的泊车位置由电脑随机派位生成。现有两排车位，每排4个，有4辆不同的车需要泊车。泊车要求至少有一车与其它车不同排，且甲乙两车在同一排。则电脑可生成几种派位方式？","options":{"A":"672","B":"480","C":"384","D":"288"},"answer":"A","explanation":"根据题干“至少有一车与其它车不同排”，可分为以下两种情况：\n①其中一排停3辆车，另一排停1辆车。\n首先，从两排中选一排停放甲乙，有\u003cimg data-k=\"1f1c113b3f0c\">种情况；然后，从剩余2辆车中选1辆车与甲乙同排，有\u003cimg data-k=\"1f1c113b3f0c\">种情况；再把这3辆车停进这排的4个车位里，有\u003cimg data-k=\"cf446651f732\">种情况；最后，余下1辆车从另一排4个车位中选1个车位停放，有\u003cimg data-k=\"43cdc1150d8b\">种情况；分步用乘法，共有\u003cimg data-k=\"6b2d3ba31df4\">\u003cimg data-k=\"155e1134bba7\">种情况。\n②两排均停2辆车。\n首先，从两排中选一排停放甲乙，有\u003cimg data-k=\"1f1c113b3f0c\">种情况；然后，把甲乙停进这排的4个车位里，有\u003cimg data-k=\"f1d0cf7ddd86\">种情况；最后，把剩余的两辆车停进另一排的4个车位里，有\u003cimg data-k=\"f1d0cf7ddd86\">种情况；分步用乘法，共有\u003cimg data-k=\"9a19a2d64ef0\">\u003cimg data-k=\"154228c88795\">种情况。\n因此，电脑可生成的派位方式共有384+288=672种情况。\n方法二：本题也可以考虑逆向思维求解。总情况为甲、乙在任意一排中的2个车位泊车，其余2辆车在剩余的6个车位中随机泊车，有\u003cimg data-k=\"cede45636631\">种情况。反面情况为4辆车都在同一排泊车，有\u003cimg data-k=\"07259e6b558f\">种情况。则题干所求=总情况数-反面情况数=720-48=672种，即电脑可生成672种派位方式。\n故正确答案为A。","no":66,"missingImage":false},{"type":"question","qid":"5102160","cat":"数学运算","stem":"A、B两个乡镇分布于山谷两侧，山谷间有一条宽为2km的河道（如下图所示）。当地政府决定在两个乡镇间修建一条跨河公路促进旅游发展。由于架桥费用高昂，所以要求跨河公路中的桥梁路段长度最短。那么根据图中数据，从A镇前往B镇的最短距离为：\n\u003cimg data-k=\"fbdae63556cd\" style=\"max-width:600px\">","options":{"A":"17km","B":"15km","C":"19km","D":"20km"},"answer":"B","explanation":"根据题目要求桥长2km，最短距离=AB最短距离+桥长，如下图所示，将河流看成一条直线，两点之间线段最短，连接AB构成直角三角形ABC，\u003cimg data-k=\"e13154a5d51d\">km。\n\u003cimg data-k=\"ec77f8b4bd13\" style=\"max-width:600px\">\n从A镇前往B镇的最短距离=13+2=15km。\n故正确答案为B。","no":67,"missingImage":false},{"type":"question","qid":"5102131","cat":"数学运算","stem":"某单位四个党史宣讲小组各有若干组员，现增加2人并重新分配，使得四个小组人数相等。此时与原先相比，第一小组人数增加10人，第二小组人数减少1人，第三小组人数增加一倍，第四小组人数减半。则原先人数最多的小组与人数最少的小组之间相差：","options":{"A":"15人","B":"21人","C":"24人","D":"32人"},"answer":"C","explanation":"设重新分配后平均每组x人，则根据题意可知：\n\u003cimg data-k=\"b1c4013d45f3\" style=\"max-width:600px\">\n由上表可得，原先四个小组总人数\u003cimg data-k=\"0834715a4b93\"> ，解得x=14。可得原先四个小组人数分别为：第一小组=x-10=4人，第二小组=x+1=15人，第三小组\u003cimg data-k=\"29a2a988c816\">人，第四小组=2x=28人。则原先人数最多的小组与人数最少的小组之间相差28-4=24人。\n故正确答案为C。","no":68,"missingImage":false},{"type":"question","qid":"5102161","cat":"数学运算","stem":"为了加强环境治理和生态修复，某市派出4位专家（甲、乙、丙、丁）前往某山区3个勘探点进行环境检测，要求每个勘探点至少安排一名专家。那么甲、乙两名专家去了不同勘探点的概率是：","options":{"A":"\u003cimg data-k=\"97dceef419de\">","B":"\u003cimg data-k=\"6f9d0abe3e0f\">","C":"\u003cimg data-k=\"3ca0481893af\">","D":"\u003cimg data-k=\"a8b04cd19bab\">"},"answer":"C","explanation":"4位专家分配到3个勘探点，要求每个勘探点至少安排一名专家，则有一个勘探点需要分配2位专家。从4位专家中选择两位，有\u003cimg data-k=\"56f10476feff\">种情况，将选择的两位专家当作一个整体，与另外两位专家分别分配到3个勘探点，共有\u003cimg data-k=\"a6bfbd5c06d2\">种情况，则总情况数有6×6=36种。\n甲、乙两名专家去了不同勘探点，从正向分析情况数较多，考虑反向计算，即甲、乙两名专家去了同一勘探点。将甲、乙两名专家当作一个整体，与另外两位专家分别分配到3个勘探点，共有\u003cimg data-k=\"a6bfbd5c06d2\">种情况。即甲、乙两名专家去了同一勘探点共有6种情况。\n则所求概率\u003cimg data-k=\"4aa9059e6b84\">\u003cimg data-k=\"796f497a05fe\">\u003cimg data-k=\"a781c3abaf40\">。\n故正确答案为C。","no":69,"missingImage":false},{"type":"question","qid":"5102138","cat":"数学运算","stem":"用一个长为20厘米、宽为2厘米、高为1.5厘米的长方体木料，制作一串半径最大的木珠子，不考虑制作过程中的损耗，则这串珠子的数量最多为：","options":{"A":"10个","B":"13个","C":"14个","D":"20个"},"answer":"C","explanation":"木珠子是球形的，需要从长方体木料的内部进行切割，由于长方体的高为1.5厘米，则木珠子的最大直径为长方体的高1.5厘米，即半径最大。长方体的宽为2厘米，木珠子的直径为1.5厘米，制作过程中，要令数量最多，木珠子错落摆放即满足要求。摆放过程注意不要超出长方体木料的长度，用前两个珠子的摆放作为演示：\n\u003cimg data-k=\"ae7131a34bbf\" style=\"max-width:291px\">\nAC是两个木珠子球心的连线，长度即为木珠子的直径1.5厘米，AC为斜边做直角三角形ABC，AC即两个球心间的最短距离。BC的长度为长方体的宽-木珠子的半径-B点距长方体左边的边长，且AB垂直BC，可得出B点距长方体左边的边长即A点距长方体边长的距离0.75厘米，可求BC长=2-0.75-0.75=0.5厘米，在直角三角形ABC中，利用勾股定理可以求出AB长为\u003cimg data-k=\"00851e5575b3\">厘米，即在AB所在直线上，相邻两个珠子间距（把珠子看成点）为\u003cimg data-k=\"6f3f1e3b3561\">厘米，且第一个和最后一个珠子的球心距长方体木料两端至少为0.75厘米。则制作的珠子数量=段数+1，段数\u003cimg data-k=\"e6c7a9c8511f\">\u003cimg data-k=\"3db10e46aef0\">，即分为13段，那么珠子数量最多=13+1=14个。\n故正确答案为C。","no":70,"missingImage":false}],"count":10,"answerable":10,"pointsOf":12},{"label":"判断推理","items":[{"type":"question","qid":"5102356","cat":"图形推理","stem":"所给的四个选项中，哪一项填入问号处，不能使之呈现一定的规律性：\n\u003cimg data-k=\"d9b45c73b11a\" style=\"max-width:620px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，图一、图三和图四均为多端点图形，图二为多圆相交图形，可以考虑笔画数。题干图形均为一笔画，而本题为选非题，故？处应选择不是一笔画的图形。A、B、C三项均为一笔画图形，D项为两笔画图形。只有D项不符合规律。\n本题为选非题，故正确答案为D。","no":71,"missingImage":false},{"type":"question","qid":"5102354","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"874a79a91648\" style=\"max-width:558px\">","options":{"A":"①②③，④⑤⑥","B":"①③⑤，②④⑥","C":"①④⑤，②③⑥","D":"①⑤⑥，②③④"},"answer":"D","explanation":"元素组成不同，且无明显属性规律，考虑数量规律。观察发现，题干图形分割明显，考虑面数量。图①⑤⑥均有6个面，图②③④均有9个面，即图①⑤⑥一组，图②③④一组。\n故正确答案为D。","no":72,"missingImage":false},{"type":"question","qid":"5102168","cat":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：\n\u003cimg data-k=\"ac1d8322d96a\" style=\"max-width:570px\">","options":{"A":"①②③，④⑤⑥","B":"①③⑤，②④⑥","C":"①②⑤，③④⑥","D":"①④⑤，②③⑥"},"answer":"C","explanation":"本题为分组分类题目。元素组成不同，且题干图形出现多个封闭面连在一起，考虑图形间关系。观察发现，图①②⑤的图形间关系为相交于线，图③④⑥的图形间关系为相交于点。即图①②⑤一组，图③④⑥一组。\n故正确答案为C。","no":73,"missingImage":false},{"type":"question","qid":"5102250","cat":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：\n\u003cimg data-k=\"ebf7a21ac326\" style=\"max-width:650px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"元素组成相同，优先考虑位置规律。观察发现，第一组图形中，第一个图形上下翻转并保留原图形后得到第二个图形，第一个图形保持不变放置在下方，然后对第一个图形分别进行上下翻转后放置在上方、顺时针旋转\u003cimg data-k=\"c16e5a8b3239\">后放置在左侧、逆时针旋转\u003cimg data-k=\"c16e5a8b3239\">后放置在右侧得到第三个图形。第二组图形应用此规律，对应B项。\n故正确答案为B。","no":74,"missingImage":false},{"type":"question","qid":"5102238","cat":"图形推理","stem":"下图右框内纸盒的外表面中，不能折叠成左框内所示的纸盒的是：\n\u003cimg data-k=\"6292220c23c8\" style=\"max-width:500px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"B","explanation":"本题考查六面体的空间重构。将题干立体图中的面依次标注为面a、面b、面c，如下图所示。\n\u003cimg data-k=\"d7257783153e\" style=\"max-width:500px\">\nA项：选项与题干立体图一致，排除；\nB项：题干立体图中面a与面b的公共边靠近面a中云朵的底部，而选项中面a与面b的公共边靠近面a中云朵的顶部，选项与题干立体图不一致，当选；\n\u003cimg data-k=\"049365b7296c\" style=\"max-width:350px\">\nC项：选项与题干立体图一致，排除；\nD项：选项与题干立体图一致，排除。\n本题为选非题，故正确答案为B。\n备注：本题作图不严谨，C项中面b与面a的公共边所对应的图形与题干立体图有差别，云朵的细节与立体图形不同，但对比B、C两项，B项错误更加明显，因此小粉笔建议选择B项。","no":75,"missingImage":false},{"type":"question","qid":"5102357","cat":"定义判断","stem":"欺诈行为是指经营者采用虚构假象、隐瞒真相、心理引导等方式，使消费者对客观事实产生错误认识，并因此作出购买决定。评价行为则是一种主观的价值判断，会随着评价主体的不同而发生变化，这属于正常的商业宣传。\n根据上述定义，下列属于欺诈行为的是：","options":{"A":"李某卖的鲤鱼都是饲养的，却告诉张某说是野生的，张某并不在意鲤鱼是否野生，但念及李某谋生不易，心中不忍便买了一条","B":"王某看到一幅字帖落款为“启功”，指着这两个字问“真迹否？”店家笑而不语，王某遂以为真，以低价买得，欢喜回家","C":"服装店老板极尽推销之能事，说某件外套能够衬托赵某的身材气质，赵某购买后感觉并不好看，认为自己被骗了","D":"店家拿出一瓶贴牌假酒当真酒卖，黄某认出这是假酒，但心想可以据此索赔，就买回去了"},"answer":"B","explanation":"第一步：找出定义关键词。\n欺诈行为：“采用虚构假象、隐瞒真相、心理引导等方式”、“对客观事实产生错误认识而作出购买决定”；\n评价行为：“主观的价值判断”、“随着评价主体的不同而发生变化”。\n第二步：逐一分析选项。\nA项：张某购买鲤鱼的理由是念及李某谋生不易，且并不在意鲤鱼是否野生，不符合“对客观事实产生错误认识而作出购买决定”，不符合“欺诈行为”的定义，排除；\nB项：对于王某的疑问，店家笑而不语，符合“采用虚构假象、隐瞒真相、心理引导等方式”，王某遂以为真，以低价买得字帖，“遂以为真”说明字帖很大程度上是假的，符合“对客观事实产生错误认识而作出购买决定”，符合“欺诈行为”的定义，当选；\nC项：服装店老板认为外套可以衬托赵某的身材气质，这只是推销过程中的主观认知，不符合“采用虚构假象、隐瞒真相、心理引导等方式”，不符合“欺诈行为”的定义，排除；\nD项：黄某认出假酒，仍选择购买，说明没有对此酒产生错误认识，不符合“对客观事实产生错误认识而作出购买决定”，不符合“欺诈行为”的定义，排除。\n故正确答案为B。","no":76,"missingImage":false},{"type":"question","qid":"5102355","cat":"定义判断","stem":"参照群体理论是关于人的社会心理态度和行为怎样受其从属的或追求的群体参照力所影响的社会心理学理论。参照群体是指个体从心理上把自己列入、与之对照，并在评价、态度、行为上和在规范与价值观形成上接受其影响的群体。\n根据上述定义，下列选项不能用参照群体理论解释的是：","options":{"A":"小王平时喜欢便装，但是参加面试时他决定穿着西装","B":"夏秋之际，妈妈怕孩子受凉，很注意给孩子增减衣物","C":"小刘看其他影迷都购买了偶像同款商品，自己也去买","D":"小张父母都是医生，她比常人更在意身边的卫生状况"},"answer":"B","explanation":"第一步：找出定义关键词。\n“受其从属的或追求的群体参照力所影响”。\n第二步：逐一分析选项。\nA项：小王平时喜欢便装，但参加面试时穿了西装，是因为面试时大多数人都选择正式的西装，小王也受其影响，因而在面试时做出同样的选择，符合“受其从属的或追求的群体参照力所影响”，符合定义，排除； \nB项：妈妈给孩子增减衣物是因为天气转凉，妈妈行为的变化是受天气变化的影响而不是群体的影响，不符合“受其从属的或追求的群体参照力所影响”，不符合定义，当选；\nC项：小刘购买偶像同款商品是因为其他影迷都购买了，小刘的行为受影迷群体的影响，符合“受其从属的或追求的群体参照力所影响”，符合定义，排除；\nD项：小张在意卫生状况是因为小张的父母都是医生，小张的行为受其父母的影响，符合“受其从属的或追求的群体参照力所影响”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":77,"missingImage":false},{"type":"question","qid":"5102239","cat":"定义判断","stem":"替代性满足指当欲望能量在最初对象上遇到阻碍时，就会向其他对象转移；如果再次遇阻，就再次转移，直到寻找到一个替代对象以消除紧张、满足欲望为止。\n根据上述定义，下列选项不属于替代性满足的是：","options":{"A":"小李很喜欢旅游，因此经常利用自己的假期到全国各地旅游","B":"小王将自己不愉快的生活经历倾注于笔下，完成了一些作品","C":"小刘的小超市经营状况不佳，所以他一直有着天降横财的幻想","D":"小林梦想成为一个叱咤风云的英雄，他特别喜欢上网打战争游戏"},"answer":"A","explanation":"第一步：找出定义关键词。\n“欲望能量在最初对象上遇到阻碍”、“不断转移直到寻找到替代对象”。\n第二步：逐一分析选项。\nA项：小李喜欢旅游，这是他的“欲望能量”，他经常利用假期旅游，说明小李的“欲望能量”得到了满足，不符合“欲望能量在最初对象上遇到阻碍”，不符合定义，当选；\nB项：愉快的生活是小王的“欲望能量”，小王有不愉快的生活经历，说明其“欲望能量”没有得到满足，符合“欲望能量在最初对象上遇到阻碍”；他利用不愉快的生活经历完成了一些作品，说明小王将写作作为最初欲望的替代，符合“不断转移直到寻找到替代对象”，符合定义，排除；\nC项：经营好小超市是小刘的“欲望能量”，小刘的小超市经营状况不佳，说明其“欲望能量”没有得到满足，符合“欲望能量在最初对象上遇到阻碍”；他一直有天降横财的幻想，说明小刘将幻想作为最初欲望的替代，符合“不断转移直到寻找到替代对象”，符合定义，排除；\nD项：做一个叱咤风云的英雄是小林的“欲望能量”，因此他特别喜欢上网打战争游戏，说明其“欲望能量”在现实中没有得到满足，符合“欲望能量在最初对象上遇到阻碍”；同时将网络游戏作为最初欲望的替代，符合“不断转移直到寻找到替代对象”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":78,"missingImage":false},{"type":"question","qid":"5102199","cat":"定义判断","stem":"最小干预原则是指在保证文物安全的基本前提下，通过最小程度的介入来最大限度地维系文物的原本面貌，保留文物的历史、文化价值，以实现延续现状、降低保护性破坏的目标。\n根据上述定义，下列选项不属于最小干预原则的是：","options":{"A":"某博物馆在修复古籍时不拆开原线绳，只修补蛀洞严重的书页，而不修补强度未受蛀洞影响的书页","B":"某博物馆的一幅雕塑作品中的人物手臂缺失，专家们查阅了原始资料，根据资料将其复原如初","C":"某古城墙修缮时，保留其残损的现状，在靠近边墙的一侧恢复了很窄的台阶供游人安全通过","D":"某古塔倾斜，专家们在研究后最终决定只纠偏一度，它看上去依旧是倾斜的状态"},"answer":"B","explanation":"第一步：找出定义关键词。\n“保证文物安全”、“最小程度的介入”、“最大限度地维系文物的原本面貌”、“延续现状、降低保护性破坏”。\n第二步：逐一分析选项。\nA项：某博物馆在修复古籍时不拆开原线绳，只修补蛀洞严重的书页，符合“最小程度的介入”，不修补强度未受蛀洞影响的书页，符合“最大限度地维系文物的原本面貌”，符合定义，排除；\nB项：雕塑作品中的人物手臂缺失，根据资料将其复原如初，并没有保留现状，也没有体现是不是最小程度的改变，不符合“最小程度的介入”、“最大限度地维系文物的原本面貌”，不符合定义，当选；\nC项：某古城墙修缮时，保留其残损的现状，符合“最大限度地维系文物的原本面貌”，在靠近边墙的一侧恢复了很窄的台阶，说明修复的地方很少，符合“最小程度的介入”，符合定义，排除；\nD项：某古塔倾斜，专家们只纠偏一度，说明修复的很少，符合“最小程度的介入”，依旧保留倾斜的状态，符合“最大限度地维系文物的原本面貌”，符合定义，排除。\n本题为选非题，故正确答案为B。","no":79,"missingImage":false},{"type":"question","qid":"5102223","cat":"定义判断","stem":"深度学习是指在模仿人脑机制的神经网络中，对人工神经元的层进行了“多层处理”。深度学习不仅可以让AI（人工智能）读取大量图片，还可以让AI自主提取图片特征。得益于深度学习技术的面世，只要有大量数据，AI就能以极高的准确率进行学习，从而大幅度拓展了AI的应用范围。\n根据上述定义，下列属于深度学习的是：","options":{"A":"人工智能图片教学走进课堂让学生体验深度学习","B":"问诊机器人可以迅速获取病患B超报告的风险信息","C":"某设区市在数字峰会期间提供无人驾驶汽车试乘服务","D":"安防巡检机器人通过图像识别技术判定工人是否佩戴安全帽"},"answer":"D","explanation":"第一步：找出定义关键词。\n“AI（人工智能）读取大量图片”、“自主提取图片特征”。\n第二步：逐一分析选项。\nA项：让学生观看人工智能的图片来体验深度学习，是让学生观看图片，不是让AI读取图片，不符合“AI（人工智能）读取大量图片”，不符合定义，排除；\nB项：问诊机器人可以识别B超报告，但报告中不只含有图片，还含有文字性诊断结果可以直接告知病患风险信息，而不需要AI提取，不符合“AI（人工智能）读取大量图片”、“自主提取图片特征”，不符合定义，排除；\nC项：提供无人驾驶汽车试乘服务，不是让AI读取图片，不符合“AI（人工智能）读取大量图片”、“自主提取图片特征”，不符合定义，排除；\nD项：安防巡检机器人通过识别工人的图像来判定工人是否佩戴安全帽，符合“AI（人工智能）读取大量图片”、“自主提取图片特征”，符合定义，当选。\n故正确答案为D。","no":80,"missingImage":false},{"type":"question","qid":"5102222","cat":"定义判断","stem":"回应性监管是指政府通过制度设计，采用多样化的监管手段和策略对市场主体和社会组织进行动态化、智能化、差别化的监管。回应性监管强调监管主体的多元化，除政府以外，企业、社会组织，乃至被监管对象都是监管主体；在监管策略上，采取差异化、阶梯化的监管方式，即政府首先鼓励自我监管，难以奏效时才采取更为严厉的强化型自我监管直至命令控制型监管。\n根据上述定义，下列选项没有体现回应性监管的是：","options":{"A":"某地主管部门因食品安全问题突击整顿涉事企业","B":"瑞典立法要求工作场所必须建立安全环保的内控体系","C":"英国成立企业、工会代表组成的大健康监管委员会","D":"聘请专业的第三方机构对企业安全生产状况进行评估"},"answer":"A","explanation":"第一步：找出定义关键词。\n“采用多样化的监管手段和策略”、“监管主体的多元化”。\n第二步：逐一分析选项。\nA项：某地主管部门直接对涉事企业进行了整顿，监管只有某地主管部门一个，没有体现出监管手段的多样化，不符合“采用多样化的监管手段和策略”，不符合定义，当选；\nB项：瑞典立法要求建立内控体系，说明除政府外还有其他监管手段和策略，内控体系也体现了“差别化的监管”，符合“采用多样化的监管手段和策略”，符合定义，排除；\nC项：英国成立企业、工会代表组成的大健康监管委员会，说明监管由不同主体共同完成，体现了多样化的监管手段和策略，符合“采用多样化的监管手段和策略”，符合定义，排除；\nD项：聘请专业的第三方机构，说明除第三方机构外可能还有其他的监管主体，可能符合 “监管主体的多元化”，比A更好，符合定义，排除。\n本题为选非题，故正确答案为A。","no":81,"missingImage":false},{"type":"question","qid":"5102235","cat":"定义判断","stem":"薄膜干涉，指的是不同颜色的光波有不同的波长，当一束光波照射于薄膜，由于折射率不同，光波会被薄膜的上界面与下界面分别反射后再相遇，发生相互干涉而形成新的光波。对这一现象的研究可以用于计算薄膜的厚度、折射率等。\n根据上述定义，下列不属于薄膜干涉的是：","options":{"A":"一片普通薄玻璃镶嵌在窗框里，屋外灿烂的阳光穿透玻璃，照在屋内镜子上也能产生强烈反光","B":"汽车玻璃上的贴膜会改变折射光线和反射光线的能量分配比例，增加对某一光波的反射光强度","C":"汽车在有积水的柏油路上驶过时，积水面会形成一层油膜，这层油膜在阳光下呈现出美丽的色彩","D":"自然环境中，两块干净平整的玻璃片紧紧压叠形成极薄空间，出现一些平行条纹，手指用力压紧玻璃时，条纹随之发生改变"},"answer":"A","explanation":"第一步：找出定义关键词。\n“一束光波照射于薄膜”、“薄膜使其形成新的光波”。\n第二步：逐一分析选项。\nA项：阳光穿透玻璃，照在屋内镜子上产生强烈反光，说明镜子对光进行了反射，但镜子上是否有薄膜并不清楚，不符合“一束光波照射于薄膜”，不符合定义，当选；\nB项：光线照射在汽车玻璃上的贴膜上，符合“一束光波照射于薄膜”，改变折射光线和反射光线的能量分配比例，增加对某一光波的反射光强度，说明光波经过贴膜后形成了新的光波，符合“薄膜使其形成新的光波”，符合定义，排除；\nC项：积水面形成的油膜在阳光下呈现出美丽的色彩，符合“一束光波照射于薄膜”，“美丽的色彩”说明肉眼看不到颜色的阳光经过油膜后形成了新的光波，符合“薄膜使其形成新的光波”，符合定义，排除；\nD项：两块干净平整的玻璃片紧紧压叠形成极薄空间时，出现平行条纹，说明周围环境有光，符合“一束光波照射于薄膜”，手指用力压紧玻璃时，条纹随之发生改变，说明出现了新的光波，符合“薄膜使其形成新的光波”，符合定义，排除。\n本题为选非题，故正确答案为A。","no":82,"missingImage":false},{"type":"question","qid":"5102230","cat":"定义判断","stem":"过滤气泡是指以大数据与算法推荐为底层架构，根据用户的使用时间、地区以及浏览习惯生成用户画像，并通过算法技术为其呈现独一无二的界面体验。网络上这种针对个人化搜索而提供筛选后结果的推荐算法，被称为过滤气泡。\n根据上述定义，下列不属于过滤气泡的是：","options":{"A":"赵先生准备买车，上网看了很多汽车测评类的文章，买完车之后，浏览器上的内容几乎全是汽车类的资讯","B":"李先生经常网购图书，平台特意为他推送购书清单，打造个性化书店，让他在第一时间能得到新书的信息","C":"刘先生经常去某网络贴吧发帖，得到了很多人的关注，一些与他有相同爱好的人还建立了一个微信群进行交流","D":"王先生和张先生分别在各自手机上搜索某公司，王先生的搜索结果多为该公司的招聘信息，张先生的却多为该公司的投资信息"},"answer":"C","explanation":"第一步：找出定义关键词。\n“针对个人化搜索，提供筛选后结果”。\n第二步：逐一分析选项。\nA项：赵先生上网看测评类的文章后，浏览器为其推送相关内容，符合“针对个人化搜索，提供筛选后结果”，符合定义，排除；\nB项：李先生经常网购图书，平台针对性推送购书清单，符合“针对个人化搜索，提供筛选后结果”，符合定义，排除；\nC项：刘先生经常去某网络贴吧发帖，建立微信群的过程，没有体现出“针对个人化搜索，提供筛选后结果”，不符合定义，当选；\nD项：两位先生分别在各自手机上搜索某公司后，搜索结果的不同，符合“针对个人化搜索，提供筛选后结果”，符合定义，排除。\n本题为选非题，故正确答案为C。","no":83,"missingImage":false},{"type":"question","qid":"5102197","cat":"定义判断","stem":"衰老通常分为生理性衰老和病理性衰老。生理性衰老是指随着年龄增长出现的衰老，也就是自然老化。病理性衰老是指衰老速度由于负面情绪、物理创伤、营养匮乏、身体疾病等各种因素的作用而加快。\n根据上述定义，下列诗词所描述的现象最符合病理性衰老的是：","options":{"A":"白头搔更短，浑欲不胜簪","B":"寒暑迭变，不觉渐成衰老","C":"惟草木之零落兮，恐美人之迟暮","D":"人生不得长欢乐，年少须臾老到来"},"answer":"A","explanation":"第一步：找出定义关键词。\n病理性衰老：“由于负面情绪、物理创伤、营养匮乏、身体疾病”、“衰老速度加快”；\n生理性衰老：“随着年龄增长出现的衰老”、“自然老化”。\n第二步：逐一分析选项。\nA项：“白头搔更短，浑欲不胜簪”意思为“愁闷心烦只有搔首而已，致使白发疏稀插不上簪”，愁闷心烦符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，白发稀疏是衰老的明显特征之一，而更稀疏符合“衰老速度加快”，符合“病理性衰老”定义，当选；\nB项：“寒暑迭变，不觉渐成衰老”意思为“冬天和夏天交替变化，没有感觉就已渐渐衰老”，时间的变化导致的衰老，不符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，也未体现“衰老速度加快”，不符合“病理性衰老”定义，排除；\nC项：“惟草木之零落兮，恐美人之迟暮”意思为“想到树上黄叶纷纷飘零，而害怕美人头上也添上丝丝霜鬓”，诗人只是表达了害怕美人衰老，而不是描写美人已经衰老，又为何衰老，不符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，也未体现“衰老速度加快”，不符合“病理性衰老”定义，排除；\nD项：“人生不得长欢乐，年少须臾老到来”意思为“人的一生得不到长久的欢乐，青春年少的时光总是过的很快，老年很快就来了”，诗人感叹的是时光飞逝，是由于时间的原因导致衰老，不符合“由于负面情绪、物理创伤、营养匮乏、身体疾病”，也未体现“衰老速度加快”，不符合“病理性衰老”定义，
