排除。\n故正确答案为A。\n注——本题出处如下：\nhttps://baike.baidu.com/item/%E8%A1%B0%E8%80%81/1169838?fr=aladdin","no":84,"missingImage":false},{"type":"question","qid":"5102236","cat":"定义判断","stem":"生殖隔离可以区分为合子前隔离和合子后隔离。合子前隔离是指由于活动区域、生活习性、体态差异等各种因素导致无法进行基因交流，从而产生生殖隔离。相比来说，合子后隔离则是因为遗传信息的不匹配，即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍。\n根据上述定义，下列现象体现合子后隔离的是：","options":{"A":"甲种兰花通过a昆虫授粉，乙种兰花通过b昆虫授粉，二者只能通过人工授粉进行繁殖","B":"三倍体西瓜开花后，用二倍体西瓜的花朵进行授粉，培育无籽西瓜","C":"富尔顿蟋蟀和宾州蟋蟀的鸣声不同，无法相互吸引，不会进行交配","D":"13年蝉和17年蝉的发情期不同，没有交配机会"},"answer":"B","explanation":"第一步：找出定义关键词。\n合子前隔离：“由于活动区域、生活习性、体态差异等各种因素”、“导致无法进行基因交流”；\n合子后隔离：“因为遗传信息的不匹配”、“即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍”。\n第二步：逐一分析选项。\nA项：两种兰花因“授粉昆虫不同”无法自然进行基因交流，但可以通过人工授粉进行繁殖，不符合“即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍”，不符合“合子后隔离”的定义，排除；\nB项：三倍体西瓜用二倍体西瓜授粉后，培育出了“无籽”西瓜，说明双方生殖细胞结合后不能完成正常的繁衍，符合“因为遗传信息的不匹配”、“即使双方的生殖细胞能够相遇结合，也无法完成正常的繁衍”，符合“合子后隔离”的定义，当选；\nC项：富尔顿蟋蟀和宾州蟋蟀因“鸣声不同”，不会进行交配，符合“由于活动区域、生活习性、体态差异等各种因素”、“导致无法进行基因交流”，符合“合子前隔离”的定义，不符合“合子后隔离”的定义，排除；\nD项：两种蝉因“发情期不同”，没有交配机会，符合“由于活动区域、生活习性、体态差异等各种因素”、“导致无法进行基因交流”，符合“合子前隔离”的定义，不符合“合子后隔离”的定义，排除。\n故正确答案为B。","no":85,"missingImage":false},{"type":"question","qid":"5102353","cat":"类比推理","stem":"考拉：树袋熊","options":{"A":"墨鱼：乌贼","B":"蜜蜂：黄蜂","C":"蚱蜢：蝗虫","D":"金龟子：天牛"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n考拉和树袋熊是同一种动物，二者为全同关系。\n第二步：判断选项词语间逻辑关系。\nA项：墨鱼和乌贼是同一种动物，二者为全同关系，与题干逻辑关系一致，保留；\nB项：黄蜂属于胡蜂科，蜜蜂属于蜜蜂科，二者为并列关系，与题干逻辑关系不一致，排除；\nC项：蚱蜢和蝗虫的关系较有争议，部分资料显示二者为全同关系，与题干逻辑关系一致，保留；\nD项：金龟子是鞘翅目金龟总科的通称，天牛是多食亚目天牛科昆虫的总称，二者为并列关系，与题干逻辑关系不一致，排除。\n对比A、C两项，C项中蚱蜢和蝗虫的关系较有争议，如下图所示，维基百科和百度百科都表明二者是全同关系，但现代汉语词典表明二者并不是同一种动物，目前无法确定出题人对二者的关系是如何判定的，相对来说，A项中的墨鱼和乌贼是没有争议的全同关系，因此，小粉笔更倾向于将正确答案给到A项。\n\u003cimg data-k=\"8d599fe3a1e5\" style=\"max-width:374px\">\n\u003cimg data-k=\"6f042a1ed3cc\" style=\"max-width:416px\">\n\u003cimg data-k=\"3d589a64792c\" style=\"max-width:324px\">\n故正确答案为A。","no":86,"missingImage":false},{"type":"question","qid":"5102178","cat":"类比推理","stem":"岳父：泰山","options":{"A":"少女：娥眉","B":"儿子：孙子","C":"女婿：东床","D":"兄弟：伯仲"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n“岳父”的别称叫“泰山”，二者为全同关系。\n第二步：判断选项词语间逻辑关系。\nA项：“少女”指未成年女孩，“娥眉”泛指貌美的女子，二者为交叉关系，与题干逻辑关系不一致，排除；\nB项：“儿子”与“孙子”不是全同关系，与题干逻辑关系不一致，排除；\nC项：“女婿”的别称叫“东床”，二者为全同关系，与题干逻辑关系一致，当选；\nD项：“伯仲”指弟兄排行的次序，与“兄弟”不是全同关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":87,"missingImage":false},{"type":"question","qid":"5102358","cat":"类比推理","stem":"帛书：简牍","options":{"A":"日晷：秒表","B":"熊猫：银杏","C":"青铜：礼器","D":"牛车：轿子"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n帛书是指中国古代写在绢帛上的文书；简牍是指中国古代书写在竹简或木片上的文书，二者是两种不同的书，为并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：日晷和秒表是两种不同的计时器，二者为并列关系，与题干逻辑关系一致，保留；\nB项：熊猫是动物，银杏是植物，二者不是并列关系，与题干逻辑关系不一致，排除；\nC项：青铜是制作礼器的原材料之一，二者为原材料与成品的对应关系，与题干逻辑关系不一致，排除；\nD项：牛车和轿子是两种不同的交通工具，二者为并列关系，与题干逻辑关系一致，保留。\n对比A、D两项，题干中的帛书和简牍都是古代出现的事物，A项中的日晷是古代出现的事物，但秒表是现代出现的事物，D项中的牛车起源于商代，牛车和轿子都是古代出现的事物，故D项与题干的关系更近。\n故正确答案为D。","no":88,"missingImage":false},{"type":"question","qid":"5102169","cat":"类比推理","stem":"电脑：设备","options":{"A":"广播：传媒","B":"颜料：绘画","C":"文言：白话","D":"能源：煤炭"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n电脑是一种设备，二者是种属关系。\n第二步：判断选项词语间逻辑关系。\nA项：传媒指传播媒介，特指报纸、广播、电视、网络等各种新闻工具，广播是一种传媒，二者是种属关系，与题干逻辑关系一致，当选；\nB项：颜料是绘画所用的材料，二者不是种属关系，与题干逻辑关系不一致，排除；\nC项：文言和白话为汉语书面语的两种形式，二者是并列关系而非种属关系，与题干逻辑关系不一致，排除；\nD项：煤炭是一种能源，二者是种属关系，但两词顺序与题干相反，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":89,"missingImage":false},{"type":"question","qid":"5102209","cat":"类比推理","stem":"马匹：船只：车辆","options":{"A":"银两：金钱：银币","B":"纸张：试卷：画册","C":"水杯：油瓶：饭碗","D":"官员：武将：首领"},"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。\n马匹、船只和车辆都有运输的功能，三者在功能上是并列关系。\n第二步：判断选项词语间逻辑关系。\nA项：银两是以银锭为主要形式的一种秤量货币单位，金钱多指用金属铸成的钱，后泛指货币财富，银两是金钱，二者是种属关系，与题干逻辑关系不一致，排除；\nB项：纸张是制作试卷的原材料，二者是原材料与成品的对应关系，与题干逻辑关系不一致，排除；\nC项：水杯、油瓶和饭碗都有盛装物品的功能，三者在功能上是并列关系，与题干逻辑关系一致，当选；\nD项：武将是古代的军事将领或部队军官，武将是官员，二者是种属关系，与题干逻辑关系不一致，排除。\n故正确答案为C。","no":90,"missingImage":false},{"type":"question","qid":"5102233","cat":"类比推理","stem":"针线：布料：服饰","options":{"A":"剪刀：彩纸：窗花","B":"刻刀：玺印：玉石","C":"玻璃：窗户：窗框","D":"鸡精：乌鸡：鸡汤"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n针线是制作服饰的工具，布料是制作服饰的原材料，三者为工具、原材料、成品的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：剪刀是制作窗花的工具，彩纸是制作窗花的原材料，三者为工具、原材料、成品的对应关系，与题干逻辑关系一致，当选；\nB项：刻刀是制作玺印的工具，玉石是制作玺印的原材料，三者为工具、成品、原材料的对应关系，但三词顺序与题干不同，与题干逻辑关系不一致，排除；\nC项：玻璃和窗框是窗户的组成部分，与题干逻辑关系不一致，排除； \nD项：鸡精是一种调味品，不是制作鸡汤的工具，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":91,"missingImage":false},{"type":"question","qid":"5102174","cat":"类比推理","stem":"电影院：影片：放映","options":{"A":"图书馆：资料：查阅","B":"下水道：地漏：排水","C":"传染病：疫苗：防疫","D":"朋友圈：微信：聊天"},"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。\n在电影院放映影片，放映影片是动宾关系，电影院是放映影片的地点。\n第二步：判断选项词语间逻辑关系。\nA项：在图书馆查阅资料，查阅资料是动宾关系，图书馆是查阅资料的地点，与题干逻辑关系一致，当选；\nB项：地漏具有排水的功能，二者是功能对应关系，与题干逻辑关系不一致，排除；\nC项：不能说在传染病防疫疫苗，且传染病不是一个地点，与题干逻辑关系不一致，排除；\nD项：不能说在朋友圈聊天微信，且朋友圈不是一个地点，微信具有聊天的功能，二者是功能对应关系，与题干逻辑关系不一致，排除。\n故正确答案为A。","no":92,"missingImage":false},{"type":"question","qid":"5102171","cat":"类比推理","stem":"征稿：评选：颁奖","options":{"A":"运动：热身：放松","B":"节能：减排：环保","C":"设计：施工：监理","D":"麻醉：切开：缝合"},"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。\n先征稿，再评选，最后颁奖，三者为动作上的先后顺序的对应关系。\n第二步：判断选项词语间逻辑关系。\nA项：先热身，再运动，两词顺序与题干相反，与题干逻辑关系不一致，排除；\nB项：节能和减排是并列关系，不分先后，且节能和减排都属于环保措施，与题干逻辑关系不一致，排除；\nC项：先设计，再施工，监理是指对工程项目等进行监督管理，监理的主要内容是熟悉所监理项目的合同条款、规范、设计图纸，有效开展现场监理工作，及时报告施工过程中出现的问题等，所以施工和监理可以同时发生，没有一定的先后顺序，与题干逻辑关系不一致，排除；\nD项：先麻醉，再切开，最后缝合，三者为动作上的先后顺序的对应关系，与题干逻辑关系一致，当选。\n故正确答案为D。","no":93,"missingImage":false},{"type":"question","qid":"5102173","cat":"类比推理","stem":"晴空万里 对于 （    ） 相当于 （    ） 对于 识文断字","options":{"A":"天干物燥；才高八斗","B":"雨后春笋；妙笔生花","C":"阴云密布；胸无点墨","D":"倾盆大雨；味同嚼蜡"},"answer":"C","explanation":"逐一代入选项。\nA项：“晴空万里”形容天空晴朗，没有一点云彩，“天干物燥”意思是天气太干，物品也干燥，极易起火，二者无明显逻辑关系；“才高八斗”比喻才学极高，“识文断字”意思是能识字读书，指有一点文化知识，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nB项：“晴空万里”形容天空晴朗，没有一点云彩，“雨后春笋”指春天下大雨后，发出来的竹笋一下子就长出来很多，比喻新生事物迅速大量地涌现出来，二者无明显逻辑关系；“妙笔生花”比喻写作能力大有进步，或形容文章写得很出色，“识文断字”意思是能识字读书，指有一点文化知识，二者无明显逻辑关系，前后逻辑关系不一致，排除；\nC项：“晴空万里”形容天空晴朗，没有一点云彩，“阴云密布”形容浓厚的云层或空气中的大量的烟尘遮蔽天日，二者为反义关系；“胸无点墨”意思是肚子里没有一点墨水，指没有文化，“识文断字”意思是能识字读书，指有一点文化知识，二者为反义关系，前后逻辑关系一致，当选；\nD项：“晴空万里”形容天空晴朗，没有一点云彩，“倾盆大雨”形容雨大势急，二者为反义关系；“味同嚼蜡”意思是像吃蜡一样，没有一点儿味，形容语言或文章枯燥无味，“识文断字”意思是能识字读书，指有一点文化知识，二者无明显逻辑关系，前后逻辑关系不一致，排除。\n故正确答案为C。","no":94,"missingImage":false},{"type":"question","qid":"5102192","cat":"类比推理","stem":"入木三分 对于 （    ） 相当于 （    ） 对于 音乐","options":{"A":"绘画；珠圆玉润","B":"雕刻；黄钟大吕","C":"建筑；高山流水","D":"书法；余音绕梁"},"answer":"D","explanation":"逐一代入选项。\nA项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，与绘画无明显逻辑关系；珠圆玉润形容歌声婉转优美或文字流畅明快，用来形容音乐，二者为对应关系。前后逻辑关系不一致，排除；\nB项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，与雕刻无明显逻辑关系；黄钟大吕形容正大、庄严、高妙的音乐或文辞，用来形容音乐，二者为对应关系。前后逻辑关系不一致，排除；\nC项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，与建筑无明显逻辑关系；高山流水指知音难觅或乐曲高妙，用来形容音乐，二者为对应关系。前后逻辑关系不一致，排除；\nD项：入木三分形容书法刚劲有力，也用来形容议论、见解深刻，用来形容书法，二者构成对应关系；余音绕梁形容歌声或音乐优美，耐人回味，用来形容音乐，二者构成对应关系。前后逻辑关系一致，当选。\n故正确答案为D。","no":95,"missingImage":false},{"type":"question","qid":"5102164","cat":"逻辑判断","stem":"研究者发现，蚕挑选桑叶要经过类似于计算机安全系统的验证。蚕口器下方的下颚须在触碰叶片时会先轻轻咬一口，下颚须中的味觉神经能以极高的灵敏度识别叶片表面的\u003cimg data-k=\"af343db3844d\">-谷甾醇、绿原酸、异槲皮苷这三种物质；接着，它会用口器上的须形外颚叶来尝一下叶片叶汁中的糖分，须形外颚叶上的味觉神经比较迟钝，只有高浓度的糖才能激活；在确认是桑叶后它才开始大肆咀嚼。\n由此可以推出：","options":{"A":"桑叶会分泌适合蚕生长的糖分和物质，故而它几乎只吃桑叶","B":"通过不同的器官感受不同的味道，这就是蚕判断桑叶的秘诀","C":"蚕在演化过程中，它的口器具备了通过触碰感知桑叶的能力","D":"这项研究有助于改进蚕的人工饲料，可在没有桑树的环境下养蚕"},"answer":"B","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：题干指出蚕是通过高浓度糖分激活须形外颚叶上的味觉神经来确认桑叶，没有提及蚕只吃桑叶的原因，无中生有，无法推出，排除；\nB项：题干指出蚕口器下方的下颚须中的味觉神经能识别\u003cimg data-k=\"af343db3844d\">-谷甾醇、绿原酸、异槲皮苷，接着，蚕会用口器上的须形外颚叶来尝一下叶片叶汁中的糖分，可以推出蚕通过不同的器官感受不同的味道来判断是否是桑叶，可以推出，当选；\nC项：题干指出蚕依靠下颚须中的“味觉神经”识别叶片表面的一些物质，用口器上的须形外颚叶来“尝”糖分，因此蚕是依靠“味觉”来感知桑叶，而非依靠“碰触”，无法推出，排除；\nD项：题干中没有提及蚕的饲养，也没有提及改进蚕的人工饲料，无中生有，无法推出，排除。\n故正确答案为B。","no":96,"missingImage":false},{"type":"question","qid":"5102231","cat":"逻辑判断","stem":"DNA甲基化严密控制着基因的表达，在肿瘤发生发展过程中发挥着重要作用。DNA出错且甲基化缺失是导致癌症的一个重要成因。几乎所有的人类肿瘤中都存在肿瘤相关基因的异常甲基化。因此，DNA甲基化异常是癌症发生的一种警示性标志。研究者据此认为，可以使用DNA甲基化作为一种全新的癌症检测筛查标志物，来有效识别结直肠癌、肺癌、乳腺癌和肝癌等肿瘤。\n以下各项如果为真，最能支持上述研究者观点的是：","options":{"A":"肿瘤抑制基因启动子区往往发生DNA高甲基化，而癌基因启动子区则呈现出低甲基化","B":"DNA甲基化检测方法不断涌现，既说明该研究难度大，也说明这些方法都有其局限性","C":"DNA甲基化检测方法具有生物学的稳定性，且样本需求量少，检查过程更加简单快捷","D":"基因启动子区异常甲基化在多种人类疾病发生发展机制的研究中受到越来越多的重视"},"answer":"A","explanation":"第一步：找出论点和论据。\n论点：可以使用DNA甲基化作为一种全新的癌症检测筛查标志物，来有效识别结直肠癌、肺癌、乳腺癌和肝癌等肿瘤。\n论据：DNA甲基化异常是癌症发生的一种警示性标志。\n本题论点探讨“DNA甲基化”和“筛查癌症的标志”之间的关系，论据说的是“DNA甲基化”和“癌症警示性标志”之间的关系，二者话题一致，优先考虑补充论据加强，可以举例子，也可以解释原因。\n第二步：逐一分析选项。\nA项：该项指出肿瘤抑制基因启动子区呈现DNA高甲基化，而癌基因启动子区呈现DNA低甲基化，解释了为什么DNA甲基化可以作为癌症检测筛查的标志物，解释原因，可以加强，当选；\nB项：该项讨论DNA甲基化检测方法的研究难度以及局限性，但并未提及DNA甲基化是否可以作为癌症检测筛查的标志物，与论点讨论的话题不一致，无法加强，排除；\nC项：该项讨论DNA甲基化检测方法有稳定性高、简单快捷等优势，但并未提及DNA甲基化是否可以作为癌症检测筛查的标志物，与论点讨论的话题不一致，无法加强，排除；\nD项：该项讨论基因启动子区异常甲基化在研究中受到越来越多的重视，但并未提及DNA甲基化是否可以作为癌症检测筛查的标志物，与论点讨论的话题不一致，无法加强，排除。\n故正确答案为A。","no":97,"missingImage":false},{"type":"question","qid":"5102186","cat":"逻辑判断","stem":"研究发现，对居住地附近有至少30%的土地是公园和绿地的成年人而言，他们感到孤独的几率比居住地附近绿地面积不足10%的成年人要低26%。对于独居者而言，关联性甚至更大——在绿地面积达到或超过30%的地区，他们感到孤独的可能性降低了一半。\n以下哪项如果为真，最能支持上述观点?","options":{"A":"越来越多的证据表明，孤独感与罹患抑郁症的风险增加有关","B":"城市重新造林可能有助于降低主观记忆减退甚至患阿尔茨海默症的风险","C":"以前没有定期接触自然的人以安全、积极和可持续的方式定期与自然接触，就有希望缓解孤独感","D":"绿地面积大小与社交互动频率正相关，经常与他人在绿地环境中交流有助于改善情绪和消除孤独感"},"answer":"D","explanation":"第一步：找出论点和论据。\n论点：对于独居者而言，关联性甚至更大——在绿地面积达到或超过30%的地区，他们感到孤独的可能性降低了一半。\n论据：对居住地附近有至少30%的土地是公园和绿地的成年人而言，他们感到孤独的几率比居住地附近绿地面积不足10%的成年人要低26%。\n论据给出一组“居住地附近绿地面积”与“孤独感”关系的数据，论点说的是“居住地附近绿地面积”与“独居者孤独感”的关系，论据和论点的话题一致，加强优先考虑补充论据，即解释原因或举例子。\n第二步：逐一分析选项。\nA项：该项说的是孤独感与罹患抑郁症风险的关系，而论点说的是居住地附近绿地面积与孤独感的关系，话题不一致，无法加强，排除；\nB项：该项说的是城市造林对主观记忆减退及患阿尔茨海默症风险的影响，而论点说的是居住地附近绿地面积与孤独感的关系，话题不一致，无法加强，排除；\nC项：该项说的是定期接触自然有望缓解孤独感，但并不明确“接触自然”与“居住地附近绿地面积”的关系，为不明确项，无法加强，排除；\nD项：该项说的是绿地面积大小影响社交互动频率，且经常与他人在绿地环境中交流有助于改善情绪和消除孤独感，解释了为什么在绿地面积达到或超过30%的地区，独居者感到孤独的可能性会降低，补充论据，可以加强，当选。\n故正确答案为D。","no":98,"missingImage":false},{"type":"question","qid":"5102359","cat":"逻辑判断","stem":"有些人的心情比较容易受到外界影响，比如飞行员担心遇到雷暴，虽然没有什么奇招，但有些食物的确能让大脑更好地运作，可可就是其中之一。这是因为可可含有大量的茶碱和咖啡因，它们可以有效的减轻压力和缓解疼痛。\n以下哪项如果为真，最能支持上述观点？","options":{"A":"虽然可可富含咖啡因，但咖啡因只有在特定条件下才能发挥其减压作用","B":"据研究显示，可可中含有的茶碱和咖啡因可以刺激大脑分泌内啡肽，而内啡肽对减轻压力和缓解疼痛非常有效","C":"每天摄入主要原料为可可的黑巧克力对情绪会有一定影响","D":"每天至少30分钟的运动，有助于大脑产生缓解压力和焦虑所需的激素"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：有些食物的确能让大脑更好地运作，可可就是其中之一。\n论据：可可含有大量的茶碱和咖啡因，它们可以有效的减轻压力和缓解疼痛。\n本题论点说的是“可可”让“大脑更好地运作”，论据说的是“可可”中的“茶碱和咖啡因”可以“减轻压力和缓解疼痛”，“减轻压力和缓解疼痛”有助于“大脑更好地运作”，二者关系紧密，可以认为话题一致，加强可以考虑补充论据，即解释原因或举例。\n第二步：逐一分析选项。\nA项：指出可可中的咖啡因需要在“特定条件”下才能发挥减压作用，但无法确定食用可可时是否满足特定条件，也就无法判断减压作用是否能实现，属于不明确项，无法加强，排除；\nB项：指出可可中含有的茶碱和咖啡因是通过刺激大脑分泌内啡肽来起到减轻压力和缓解疼痛作用的，进而能让大脑更好地运作，解释原因，补充论据，当选；\nC项：指出用可可制作的黑巧克力对情绪有影响，但无法判断是好影响还是坏影响，能否让大脑更好的运作，属于不明确项，无法加强，排除；\nD项：指出“运动”对于大脑的作用，而论点说的是“可可”对于大脑的作用，话题不一致，属于无关项，无法加强，排除。\n故正确答案为B。","no":99,"missingImage":false},{"type":"question","qid":"5102226","cat":"逻辑判断","stem":"有观点认为，体质的酸化是百病之源。无论是癌症，还是常见的高血压、糖尿病、痛风等，都是由于“酸性食物”吃多了导致体质酸化引起的。而鱼、肉、米饭、酒等人类的主副食品都是酸性的，尤其是我们的主食米饭，更被渲染成“酸性食物”的典型代表。\n以下各项如果为真，最能反驳上述观点的是：","options":{"A":"人体的皮肤处于弱酸性状态时，比较不容易滋生细菌","B":"人体的酸碱度以7.4为佳，即身体偏碱性就是健康的","C":"人体有三个调节系统平衡酸碱，人的体质不会是酸性","D":"健康人的尿液是呈酸性的，人体本身就存在酸性物质"},"answer":"C","explanation":"第一步：找出论点和论据。\n论点：体质的酸化是百病之源。\n论据：无论是癌症，还是常见的高血压、糖尿病、痛风等，都是由于“酸性食物”吃多了导致体质酸化引起的。\n本题的论点和论据均在讨论“体质酸化”与“疾病”之间的关系，话题一致，削弱优先考虑削弱论点，即体质的酸化不是百病之源。\n第二步：逐一分析选项。\nA项：该项讨论的是“人体皮肤处于弱酸性状态”与“不容易滋生细菌”的关系，“人体皮肤处于弱酸性状态”不能代表论点中“体质的酸化”，且“不容易滋生细菌”不代表不容易生病，话题不一致，无法削弱，排除；\nB项：该项指出身体偏碱性就是健康的，未明确说明酸性体质是否健康，不明确项，排除；\nC项：该项指出人的体质不会是酸性的，说明酸性体质不存在，则酸性体质也不可能是百病之源，削弱论点，当选；\nD项：该项指出健康人体存在酸性物质，但是存在酸性物质不代表健康人是“酸性体质”，话题不一致，无法削弱，排除。\n故正确答案为C。","no":100,"missingImage":false},{"type":"question","qid":"5102362","cat":"逻辑判断","stem":"传统理论认为恐龙的灭绝是小行星撞击地球导致的，科学家表示，恐龙的多样性是从7600万年前开始下降。研究人员研究了六大恐龙群体的进化趋势，发现在6600万年白垩纪末期物种大灭绝之前的大约1000万年里，食草恐龙和食肉恐龙都在衰落。\n由此可以推出：","options":{"A":"在小行星撞击地球并最终使恐龙灭绝之前恐龙就已经处境不佳","B":"在恐龙时代的最后1000万年里，六大恐龙的新物种形成速度下降，灭绝速度急剧上升","C":"在恐龙时代最后4000万年中的不同时期，六大恐龙的多样性都出现了下降，尽管降幅不一","D":"恐龙在小行星撞地球之前就面临危机，由于它们的灭绝速度超过新物种的速度，因此“尤其容易灭绝”"},"answer":"A","explanation":"日常结论题，根据题干信息逐一分析选项。\nA项：根据题干可知，恐龙的多样性从7600万年前就开始下降，食草恐龙和食肉恐龙都在衰落，这些发生在6600万年白垩纪末期物种大灭绝（小行星撞击地球的时间）之前的大约1000万年里，可以推出在小行星撞击地球并最终使恐龙灭绝之前恐龙就已经处境不佳，当选；\nB项：题干只是指出在恐龙时代的最后1000万年里，食草恐龙和食肉恐龙都在衰落，并没有提及新物种形成速度和灭绝速度的情况，无中生有，无法推出，排除；\nC项：题干中没有提及在恐龙时代“最后4000万年中的不同时期”，六大恐龙多样性的降幅问题，无中生有，无法推出，排除；\nD项：题干中没有提及恐龙和新物种灭绝速度的比较，无中生有，无法推出，排除。\n故正确答案为A。","no":101,"missingImage":false},{"type":"question","qid":"5102200","cat":"逻辑判断","stem":"伤害感受神经能够对造血干细胞动员进行调控，增强造血干细胞的黏附或迁移，降钙素基因相关肽（CGRP）是伤害感受神经元主要分泌的神经递质分子。研究者发现，给予CGRP可以显著增强造血干细胞动员。CGRP可以直接影响造血干细胞，诱导细胞表面形成CALCRL和RAMP1蛋白形成的二聚体受体，并促进造血干细胞进入血管。研究专家认为，吃辣可以促进造血干细胞动员。\n如果上述结论为真，需要补充的前提是：","options":{"A":"骨髓神经纤维中高达77%都是伤害感受神经元","B":"辛辣食物导致的“辣味”是一种痛觉，会激活伤害感受神经","C":"辣的食物能够促进消化液的分泌，增加消化酶的活性，加速胃肠道蠕动","D":"造血干细胞会在神经的调控之下，从骨髓释放进入循环，对损失的血细胞进行补充"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：吃辣可以促进造血干细胞动员。\n论据：伤害感受神经能够对造血干细胞动员进行调控，增强造血干细胞的黏附或迁移，降钙素基因相关肽（CGRP）是伤害感受神经元主要分泌的神经递质分子。研究者发现，给予CGRP可以显著增强造血干细胞动员。CGRP可以直接影响造血干细胞，诱导细胞表面形成CALCRL和RAMP1蛋白形成的二聚体受体，并促进造血干细胞进入血管。\n本题论点说的是“吃辣”与“造血干细胞动员”之间的关系，论据说的是“伤害感受神经”与“造血干细胞动员”之间的关系，话题不一致，且提问方式为“前提”，加强优先考虑搭桥，即建立“吃辣”与“伤害感受神经”之间的联系。\n第二步：逐一分析选项。\nA项：指出骨髓神经纤维中的伤害感受神经元占比高，不能说明“吃辣”与“造血干细胞动员”之间的关系，话题不一致，无法加强，排除；\nB项：指出“辣味”会激活神经纤维中的伤害感受神经，这说明吃辣可以影响伤害感受神经，进而影响造血干细胞动员，在“吃辣”与“伤害感受神经”之间建立了联系，搭桥项，可以加强，当选；\nC项：指出辣的食物能够促进消化液的分泌、加速胃肠道蠕动，与造血干细胞无关，属于无关项，无法加强，排除；\nD项：指出造血干细胞能够对损失的血细胞进行补充，未提及吃辣对其的影响，属于无关项，无法加强，排除。\n故正确答案为B。","no":102,"missingImage":false},{"type":"question","qid":"5102177","cat":"逻辑判断","stem":"要控制冰川的退缩，一劳永逸的方法只有节能减排、减少温室气体排放、遏制地球气温升高。只有这样，冰川的加速退缩才能从根本上得到控制。如果不减少温室气体的排放，欧洲阿尔卑斯山将有94％的冰川会在100年内消失掉，也许人们只能在冷库中看到一点剩余的冰川冰。\n由此可以推出：","options":{"A":"如果节能减排、减少温室气体排放、遏制地球气温升高，就能够控制冰川的退缩","B":"如果欧洲阿尔卑斯山有94％的冰川在100年内消失掉，那就说明温室气体排放没有减少","C":"除非减少温室气体排放，否则欧洲阿尔卑斯山将有94％的冰川在100年内消失掉","D":"只要节能减排、减少温室气体排放、遏制地球气温升高，就能控制冰川退缩"},"answer":"C","explanation":"第一步：翻译题干。\n①冰川的退缩得到控制\u003cimg data-k=\"2dfb7d1f72f3\">节能减排、减少温室气体排放、遏制地球气温升高\n②\u003cimg data-k=\"e752a8ae1a16\">减少温室气体排放\u003cimg data-k=\"2dfb7d1f72f3\">欧洲阿尔卑斯山将有94％的冰川会在100年内消失掉\n第二步：逐一分析选项。\nA项：翻译为“\u003cspan style=\"color:#rgb(89,89,89)\">节能减排、减少温室气体排放、遏制地球气温升高\u003c/span>\u003cimg data-k=\"2dfb7d1f72f3\">\u003cspan style=\"color:#rgb(89,89,89)\">冰川的退缩得到控制\u003c/span>”，是对①的肯后，但肯后得不到确定性的结论，无法推出，排除；\nB项：翻译为“\u003cspan style=\"color:#rgb(89,89,89)\">欧洲阿尔卑斯山将有94％的冰川在100年内消失掉\u003c/span>\u003cimg data-k=\"2dfb7d1f72f3\">\u003cimg data-k=\"e752a8ae1a16\">\u003cspan style=\"color:#rgb(89,89,89)\">减少温室气体排放\u003c/span>”，是对②的肯后，但肯后得不到确定性的结论，无法推出，排除；\nC项：翻译为“\u003cimg data-k=\"e752a8ae1a16\">\u003cspan style=\"color:#rgb(89,89,89)\">欧洲阿尔卑斯山将有94％的冰川在100年内消失掉\u003c/span>\u003cimg data-k=\"2dfb7d1f72f3\">\u003cspan style=\"color:#rgb(89,89,89)\">减少温室气体排放\u003c/span>”，是对②的否后，否后必否前，可以推出，当选；\nD项：翻译为“\u003cspan style=\"color:#rgb(89,89,89)\">节能减排、减少温室气体排放、遏制地球气温升高\u003c/span>\u003cimg data-k=\"2dfb7d1f72f3\">\u003cspan style=\"color:#rgb(89,89,89)\">冰川的退缩得到控制\u003c/span>”，是对①的肯后，但肯后得不到确定性的结论，无法推出，排除。\n故正确答案为C。","no":103,"missingImage":false},{"type":"question","qid":"5102224","cat":"类比推理","stem":"近日，有科学家撰文指出，即使保持现有的城市和农田面积，地球上至少还有种植1万亿棵或1.5万亿棵树的空间，面积可达900万平方公里，大致相当于美国的国土面积。而这些新树未来几十年里可以从大气中吸收近7500亿吨导致温室效应的二氧化碳，这几乎等同于人类在过去25年排放的碳污染的总和。因此，该科学家认为，对抗全球变暖最根本的方法是，种植1万亿棵或1.5万亿棵树。\n以下各项如果为真，最能质疑这位科学家观点的是：","options":{"A":"还有其他可行方法可以应对气候变化，例如让人们从吃肉转向吃素","B":"对燃烧石油、煤炭和天然气的依赖，才是导致全球变暖的根本原因","C":"随着全球变暖尤其是热带地区变干燥，当前树木植被已在大片消失","D":"只有年轻的树木才能从空气中清除更多碳污染，热带地区最具潜力"},"answer":"B","explanation":"第一步：找出论点和论据。\n论点：对抗全球变暖最根本的方法是，种植1万亿棵或1.5万亿棵树。\n论据：1万亿棵或1.5万亿棵新树未来几十年里可以从大气中吸收近7500亿吨导致温室效应的二氧化碳，这几乎等同于人类在过去25年排放的碳污染的总和。\n论点讨论的是“对抗全球变暖最根本的方法是种1万亿棵或1.5万亿棵树”，论据讨论的是“通过种1万亿棵或1.5万亿棵树吸收导致温室效应的二氧化碳”，论点论据都在讨论种树可以对抗全球变暖，论点论据话题一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：该项说的是还有其他可行方法可以应对气候变化，题干论点讨论的是应对全球变暖最根本的方法是种树，话题不一致，无法削弱，排除;\nB项：该项说的是导致全球变暖的根本原因是对燃烧石油、煤炭和天然气的依赖，说明要想对抗全球变暖根本方法应该是减少对燃烧石油、煤炭和天然气的依赖，可以说明种树不能从根本上解决全球变暖，削弱论点，当选；\nC项：该项说的是全球变暖尤其是热带地区变干燥导致当前树木植被已在大片消失，题干论点讨论的是应对全球变暖最根本的方法是种树，话题不一致，无法削弱，排除；\nD项：该项说的是什么样的树木才能从空气中清除更多碳污染，题干论点讨论的是应对全球变暖最根本的方法是种树，无法削弱，排除。\n故正确答案为B。","no":104,"missingImage":false},{"type":"question","qid":"5102163","cat":"逻辑判断","stem":"欧洲杯比赛期间，小赵、小钱、小孙、小李预测甲、乙两支队伍能否进入决赛。他们的对话如下：\n小赵：如果甲进入决赛，则乙也能进入决赛。\n小钱：我看甲进入决赛没有问题。\n小孙：在我看来，甲能够进入决赛，但乙进不了。\n小李：我的看法是，如果甲不能进入决赛，则乙进决赛。\n结果出来后，他们四人的预测有两个真、两个假，关于甲和乙是否进入决赛，以下推论正确的是：","options":{"A":"甲和乙都进入决赛","B":"甲和乙都没有进入决赛","C":"甲进入决赛，乙没有进入决赛","D":"甲没有进入决赛，乙进入决赛"},"answer":"D","explanation":"第一步：分析题干找关系。\n①小赵：甲\u003cimg data-k=\"508f0e7dbbe5\">乙；\n②小钱：甲；\n③小孙：甲 且 \u003cimg data-k=\"e752a8ae1a16\">乙；\n④小李：\u003cimg data-k=\"e752a8ae1a16\">甲\u003cimg data-k=\"508f0e7dbbe5\">乙。\n分析题干条件，①、③为矛盾关系，必有一真一假。\n第二步：看其余。\n根据题干推理可知，四人预测为两真两假，故②、④也必有一真一假。由“A\u003cimg data-k=\"508f0e7dbbe5\">B”=“\u003cimg data-k=\"e752a8ae1a16\">A 或 B”可知，④“\u003cimg data-k=\"e752a8ae1a16\">甲\u003cimg data-k=\"508f0e7dbbe5\">乙”=“甲 或 乙”，此时，若②“甲”为真，则④“甲 或 乙”为真，与②、④必有一真一假矛盾，故②“甲”为假，即甲没有进入决赛，此时④“甲 或 乙”为真，根据或关系的否一推一，可知乙进入决赛。\n故正确答案为D。","no":105,"missingImage":false}],"count":35,"answerable":35,"pointsOf":28},{"label":"资料分析","items":[{"type":"material","material":"\u003cp>        近年来，我国新能源汽车销量及保有量快速提升，充电基础设施布局也日渐完善。2021年新能源汽车销量达352.1万辆，同比增长157.51%；截至2021年，我国新能源汽车保有量达784万辆，同比增长59.25%。\u003c/p>\u003cp>\u003cimg data-k=\"12de19839250\" style=\"max-width:700px\">\u003c/p>\u003cp>\u003cimg data-k=\"e36189b5a361\" style=\"max-width:700px\">\u003c/p>","questions":[{"qid":"5102261","cat":"综合","stem":"2020年底，我国新能源汽车保有量与公共充电桩数量配比约为：","options":{"A":"3.1：1","B":"4.2：1","C":"6.1：1","D":"6.8：1"},"answer":"C","explanation":"根据题干“2020年底，······与······配比约为”，可判定本题为比值计算问题。定位文字材料和图1可得：2021年，我国新能源汽车保有量达784万辆，同比增长59.25%，2020年我国公共充电桩数量为80.7万台。故2020年底新能源汽车保有量\u003cimg data-k=\"a8a6bebd1ac1\">\u003cimg data-k=\"20e68c8c9441\">万台，与公共充电桩数量配比为490：80.7\u003cimg data-k=\"83a5144728fd\">490：81\u003cimg data-k=\"83a5144728fd\">6：1，与C项最接近。\n故正确答案为C。","no":106,"missingImage":false},{"qid":"5102150","cat":"比重","stem":"2021年北京市、上海市、广东省公共充电桩数量之和占全国公共充电桩总数的比重约为：","options":{"A":"28.7%","B":"33.3%","C":"39.8%","D":"46.7%"},"answer":"B","explanation":"根据题干“2021年······占······的比重约为”，可判定本题为现期比重问题。定位图1可得：2021年我国公共充电桩数量为114.7万台；定位图2可得：2021年广东省、上海市、北京市公共充电桩数量依次为181846台、103249台、96840台。根据公式：比重\u003cimg data-k=\"c5594c8ce5b4\">，则2021年北京市、上海市、广东省公共充电桩数量之和占全国公共充电桩总数的比重为\u003cimg data-k=\"49b0a01261a9\">\u003cimg data-k=\"db82d685670e\">\u003cimg data-k=\"39a656bb9520\">。\n故正确答案为B。","no":107,"missingImage":false},{"qid":"5102148","cat":"增长","stem":"2016—2021年我国公共充电桩数量年均增长量约为：","options":{"A":"15.57万台","B":"17.35万台","C":"18.17万台","D":"19.94万台"},"answer":"D","explanation":"根据题干“2016—2021年······年均增长量约”，可判定本题为年均增长量问题。定位图1可得，2016年我国公共充电桩数量为15万台，2021年我国公共充电桩数量为114.7万台，根据年均增长量公式：年均增长量\u003cimg data-k=\"42bdac05dc08\">\u003cimg data-k=\"4b7e0ff260fd\">万台。\n故正确答案为D。","no":108,"missingImage":false},{"qid":"5102262","cat":"增长","stem":"2016至2021年，我国公共充电桩数量同比增速未超过50%的年份有：","options":{"A":"3个","B":"4个","C":"5个","D":"6个"},"answer":"A","explanation":"根据题干“······同比增速未超过50%······”，可判定本题为一般增长率问题。定位图1可知2015—2021年我国公共充电桩数量。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，同比增速未超过50%，即现期量\u003cimg data-k=\"2c55e2b6859b\">1.5基期量。\n2016年：15＞5.7×1.5=8.55，不满足；\n2017年：21.4＜15×1.5=22.5，满足；\n2018年：30＜21.4×1.5=32.1，满足；\n2019年：51.6＞30×1.5=45，不满足；\n2020年：80.7＞51.6×1.5=77.4，不满足；\n2021年：114.7＜80.7×1.5=121.05，满足。\n因此2016—2021年我国公共充电桩数量同比增速未超过50%的年份有3个。\n故正确答案为A。","no":109,"missingImage":false},{"qid":"5102154","cat":"综合","stem":"下列选项能够从上述资料中推出的是：","options":{"A":"2022年我国公共充电桩数量超过180万台","B":"2021年我国公共充电桩数量超过5万台的省级行政区域有7个","C":"2016—2021年我国公共充电桩数量同比增速最小的年份是2017年","D":"2021年我国省级行政区域公共充电桩数量前5名之和占全国总数的比重约为48.9%"},"answer":"D","explanation":"A项：材料中没有给出2022年我国公共充电桩数量的相关数据，因此无法计算，不能推出，错误；\nB项：定位图2可得，2021年我国公共充电桩数量超过5万台的省级行政区域有8个，分别是广东省、上海市、江苏省、北京市、浙江省、山东省、湖北省、安徽省，并非7个，错误；\nC项：定位图1可得，2017年我国公共充电桩数量同比增速为\u003cimg data-k=\"a067987cdde1\">，2018年我国公共充电桩数量同比增速为\u003cimg data-k=\"a8d15317fca0\">，2017年我国公共充电桩数量同比增速高于2018年，并非最小，错误；\nD项：定位图1、2可得，2021年我国公共充电桩数量为114.7万台，2021年我国省级行政区域公共充电桩数量前5名之和为181846+103249+97265+96840+82041\u003cimg data-k=\"83a5144728fd\">182000+103000+97000+97000+82000=561000=56.1万台，占全国总数的比重为\u003cimg data-k=\"deb0c8402bc9\">，正确。\n故正确答案为D。","no":110,"missingImage":false}]},{"type":"material","material":"\u003cp>        2020年末，全国共有艺术表演团体17581个，从业人员43.69万人，其中各级文化和旅游部门所属艺术表演团体2060个，从业人员10.75万人。2020年，全国文化和旅游部门所属艺术表演团体共组织政府采购公益演出13.38万场，比上年下降14.9%；观众0.86亿人次，下降27.9%。\u003c/p>\u003cp>\u003cimg data-k=\"bf8b86c73783\" style=\"max-width:568px\">\u003c/p>","questions":[{"qid":"5102149","cat":"增长","stem":"2011~2020年中，全国艺术团体数同比增量超过2000个的年份有：","options":{"A":"1个","B":"2个","C":"3个","D":"4个"},"answer":"B","explanation":"根据题干“2011~2020年中······同比增量超过2000个······”，可判定本题为增长量计算问题。定位表格材料可得：2011~2020年各年的全国艺术团体数依次为：7055个、7321个、8180个、8769个、10787个、12301个、15742个、17123个、17795个和17581个。根据公式：增长量=现期量-基期量，可得2012~2020年各年全国艺术团体数的同比增量，情况如下：\n2012年的同比增量=7321-7055=266个&lt;2000个；\n2013年的同比增量=8180-7321=859个&lt;2000个；\n2014年的同比增量=8769-8180=589个&lt;2000个；\n2015年的同比增量=10787-8769=2018个&gt;2000个；\n2016年的同比增量=12301-10787=1514个&lt;2000个；\n2017年的同比增量=15742-12301=3441个&gt;2000个；\n2018年的同比增量=17123-15742=1381个&lt;2000个；\n2019年的同比增量=17795-17123=672个&lt;2000个；\n2020年的同比增量=17581-17795=-214个&lt;2000个。\n则2011~2020年中，全国艺术团体数同比增量超过2000个的年份有2015年和2017年，共2个。\n故正确答案为B。\n【备注】根据历年真题教研，本题问法也应计算2011年的增量。但由于题目数据不支持推出2011年增量，本题从2012年增量开始分析。","no":111,"missingImage":false},{"qid":"5102151","cat":"比重","stem":"2020年，在全国艺术表演团体中，各级文化和旅游部门所属艺术表演团体从业人员占比约为：","options":{"A":"11.7%","B":"24.6%","C":"27.4%","D":"31.7%"},"answer":"B","explanation":"根据题干“2020年，······占比约为”，可判定本题为现期比重问题。定位文字材料可得：2020年末，全国共有艺术表演团体从业人员43.69万人，其中各级文化和旅游部门所属艺术表演团体从业人员10.75万人。则2020年，在全国艺术表演团体中，各级文化和旅游部门所属艺术表演团体从业人员占比\u003cimg data-k=\"03954385494e\">。\n故正确答案为B。","no":112,"missingImage":false},{"qid":"5102273","cat":"增长","stem":"2019年全国艺术表演团体演出场次比2012年增长了：","options":{"A":"约80%","B":"约100%","C":"约120%","D":"约140%"},"answer":"C","explanation":"根据题干“2019年······比2012年增长了”，结合选项为百分数，可判定本题为一般增长率问题。定位统计表可得：2012年、2019年全国艺术表演团体演出场次分别为135.02万场、296.80万场。根据公式：增长率\u003cimg data-k=\"2623f0dd96bb\">，可得2019年全国艺术表演团体演出场次比2012年增长了\u003cimg data-k=\"293e5edc66d2\">\u003cimg data-k=\"0ed24c36780c\">，与C项最接近。\n故正确答案为C。","no":113,"missingImage":false},{"qid":"5102156","cat":"综合","stem":"以下折线图中，能准确反映2011~2020年国内演出观众人次变化的是：\n\u003cimg data-k=\"59ce829dd004\" style=\"max-width:656px\">","options":{"A":"A","B":"B","C":"C","D":"D"},"answer":"C","explanation":"定位表格材料可得：2011年、2012年、2013年、2014年、2015年、2016年、2017年、2018年、2019年、2020年国内演出观众人次分别为：7.46亿人次、8.28亿人次、9.01亿人次、9.10亿人次、9.58亿人次、11.81亿人次、12.47亿人次、11.76亿人次、12.30亿人次、8.93亿人次，
